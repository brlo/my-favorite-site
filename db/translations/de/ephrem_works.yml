      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Rede über die Auferweckung des Lazarus</em> (Bibliothek der Kirchenväter). Text nach <a href="https://bkv.unifr.ch/de/works/-18c/versions/rede-uber-die-auferweckung-des-lazarus-joh-11-43-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "EdGB_Творения__Часть_1"
    path: "Ephraem_Hymnen_gegen_die_Irrlehren"
    title: "Hymnen gegen die Irrlehren"
    menu: { parent: "Werke", title: "Hymnen gegen die Irrlehren", priority: 2 }
    update: true
    body: |-
      <p><em>Hymnen gegen die Irrlehren (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Nach der Melodie: Gericht der Völker.</p><p>1. Der Irrtum bei den Abtrünnigen ist die Quelle von Wunden; aber die Liebe, die Arzt sein will in schweren Leiden, verursacht Schmerzen nicht aus böser Lust, bereitet Qual, aber nicht aus Wut, denn kein Arzt ist, der aus Haß schneidet. Und obgleich seine Liebe wohlwollend ist, ist doch sein Eisen furchtbar und grausam; gütig ist er durch Hilfe und bitter in seinen Arzneien.</p><p><em>Kehrvers:</em> Gepriesen sei, der bloßlegte die Ränke der Linken!</p><p>2. Der Neidische wütet heftig und verletzt die Menschen; sein Gift macht ihn rasend, und er beißt, wen er nur trifft. Wut trägt er in seinem Herzen und Fluch in seinem Munde; sein Ursprung und seine Wurzel sind Gift; mit seiner Blüte täuscht er dich, denn die Frucht, die er dir reicht, stammt von Sodom her, ein Erzeugnis seines Trachtens.</p><p>3. Unheil und Fülle sinnt er zu jeder Zeit, denn sein Kopf ist voll Übermut; von Streitlust aufgestachelt, legt er seine Schlinge, die verlockend einen Zufluchtsort vortäuscht. Eine Wolke ist sein düsterer Geist, indem er den Tod ausschüttet bei heiterem, wolkenlosem Himmel; sein Speicher ist des Hagels voll, den er stets bereithält.</p><p>4. Ränkevoll und düster im Innern, heiter und freundlich nach außen, scherzt er und umgarnt er dich; er zeigt sich harmlos und schmettert dich nieder. Ganz scheint er dir zugetan zu sein, und doch ist er ganz dein Gegner. Immerdar ist er Anstifter jeglichen Streites; lächelnd betrügt er dich, küssend beißt er dich, kosend erwürgt er dich – so treibt er es vom Anfang bis zum Ende mit dir.</p><p>5. Wie oft lagert der Löwe friedlich in der Wüste draußen und birgt die Schlange sich im Hause drinnen, ohne zu schaden, der Neidische aber fügt unaufhörlich drinnen und draußen Übel zu. Und sogar der Fleischkoloß im Morgenlande neigt seine Höhe willig vor dem Menschen – das Reittier in friedlicher Ruhe, sein Reiter voller Stolz.</p><p>6. Wenn du eine Schlange siehst, brauchst du nicht sehr zu erschrecken; und wenn dir ein Geist [Dämon] begegnet, verachte ihn und weiche ihm nicht aus; wenn dir aber der Neidische entgegenkommt bezeichne dich [mit dem Kreuzzeichen] und fliehe! Wenn dir der Scheelsüchtige nachstellt, bleibe nicht stehen, geh hinweg und lies im [Buche] Job; in seinen Leiden erkenne dich selbst, denn Tod strömt er aus, und Verderben haucht er dir zu.</p><p>7. Wenn eine Frau dich liebt, teilst Josephs Schicksal du; wenn eine Frau dich haßt, ist dein Geschick das des Elias; und wenn dein Bruder dich verfolgt, verschaff dir Jakobs Flügel; Abel gibt dir einen Vorgeschmack [Vorbild]; wenn du den Neider ganz begreifen willst, betrachte unsern Herrn und überlege, wie er ohne Schuld gekreuzigt ward!</p><p>8. Nicht als ein Neidischer, der sein Schwert stets gezückt hält und mit Blut den Durst seiner Gesinnung löscht, zieht der Arzt sein Eisen heraus zur Rettung; Liebe ist sein Operieren [Wundenschneiden] zur Heilung, so daß die Geheilten, wenn sie gesund geworden sind – wofern sie nicht Tadel verdienen wollen, daß sie gegen ihn undankbar sind –, ihm Freude bereiten, da sie durch seine Anordnungen geheilt wurden. –</p><p></p><p>11. Bardaisans Rede ist in der Öffentlichkeit zwar ehrsam, im Verborgenen aber wird sie zum Gegenteil, zum Urbild der Gotteslästerung; ein Weib ist er, das heimlich hurt im Schlafgemach. Markion ist eine Buhlerin, die sich schamlos aufführt. Mani, der so oft den Speichel des Drachens aufleckte, speit das Bittere für seine Anhänger [wieder] aus und das Scharfe für seine Schüler.</p><p>12. Mit Prachtgewändern und Edelsteinen schmückt er den Bardaisan; den Markion umhüllt er mit dem Bußgewand, damit er die Söhne des Lichtes verdüstere. Den Mani taucht er in bleiche Farbe, um damit zu täuschen. So bewaffnet er einen jeden von ihnen mit jeglicher Schlechtigkeit: den Markion mit der Lästerung, mit Täuschung den Bardaisan; die Hefe, die noch reichlich übriggeblieben, goß er aus über Mani.</p><p>13. Und es begannen die Kinder der Schlange auf Erden einherzuschleichen, um die Schlichtheit irre zu führen und die Jugend zu verlocken, dem Haupte ihres Geschlechtes gleichend, der Schlange der Urzeit. Sie sah Eva im Paradiese in ihrer Unschuld; sie schmeichelte ihr, und Eva vertraute; sie redete ihr zu, und Eva fand Wohlgefallen; sie überraschte sie, und Eva hatte es zu bereuen; sie biß sie, und Eva versank in Traurigkeit.</p><p>14. Das Zucken der Glieder, das Wahrsagen der Zeiten, ein Buch, das Donnerbuch, ein anderes, das Buch der Geheimnisse, ein anderes, das Buch der [Geister-] Scharen, dem gegenüber das der Tierkreiszeichen, – und während nach dem Geiste der Kirche das Schäflein in den Büchern des Heiligen betrachtet, studieren jene in den Büchern des Verderbens.</p><p>15. Wer gesund ist am Leibe, den machen sie am Geiste krank; wer krank ist, den behandeln sie, daß er [geistig] stirbt, wenn er gesundet. Wer gebrochen ist, den verbinden sie, damit er in ihre Schlinge falle. Wenn sie über ein Kind, das gebissen wurde, ihre Beschwörungen murmeln, hat der Skorpion äußerlich geschadet, die Beschwörung aber schadet innerlich. Zwischen einem doppelten Tode bewegt sich der Tor hin und her.</p><p>16. Jezabel überredete den Achab, und sein Ring versiegelte den Brief für seine [Naboths] Verurteilung. Die Irrlehre ließ den Bardaisan durch seine Zunge die Urkunde seiner Anklage schreiben. Markion legte selbst Hand an die Urkunde seiner Verfehlungen; und Mani hat in seinen Lehrschriften niedergelegt, daß er die Freiheit seinesgleichen verkauft hat.</p><p>17. In den Grotten Bardaisans [ertönten] Gesänge und Lieder; da er sah, wie die Jugend nach Ergötzlichkeiten sich sehnt, behexte er durch das Bedürfnis seiner Gesänge die Jugend. Markion fastete wie eine Schlange; immer mehr warf er die Worte der Schlange unter seine Zuhörer. Mani öffnete seinen Mund und spülte ihn aus in Versprechungen.</p><p>18. Gar bald hat man Bardaisans Zelle zerstört, denn nicht las er in ihr die Propheten, die Söhne der Wahrheit, sondern in den Büchern des Tierkreises, studierte dort und erklärte sie. Gegen Markion, der den Schöpfer verleugnete, erhob sich die Schöpfung, unstät irrte er auf ihr; dem Mani, der brüllte, haben die Kinder des Morgenlandes die Haut abgezogen.</p><h2>2</h2><p>Nach derselben Melodie.</p><p>1. Wer hat denn den Bardaisan nach dem Namen des Daisan benannt? Er [der Teufel] hat in ihm mehr ertränkt als im Daisan; seine Überschwemmung führte Dornen und Unkraut mit sich. Er glättete den Markion aufs beste, um ihn rosten zu machen; er schärfte ihn, um seinen Geist durch Lästerung stumpf zu machen. Mani war ein Gewand, das jene verdarb, die es trugen.</p><p><em>Kehrvers:</em> Dein Prüfungsofen, o Herr, möge den Trug des Bardaisan bloßstellen!</p><p>2. Und siehe, es machen sich die Hunde des Mani an jeden Menschen heran; sie umwedeln einen jeden, den sie treffen, um des täglichen Brotes willen. Kranke Hunde sind sie, die es sich nicht brechen können. Sündenschulden wollen sie vergeben; darin sind sie nun ganz irrsinnig, und sie müßten niedergeschlagen werden, denn nur einer ist, der den Sündern ihre Schuld vergeben kann.</p><p>3. Nach ihrer Willkür verzerren sie das Wort des Wahrhaftigen, der seinen Jüngern befahl, einmal durch das Wasser die Sünden der Menschheit nachzulassen, und der [die Gewalt] gab, zu lösen und auch zu binden, damit jener, der gebunden ist, vor den, der alles vergibt, bittend trete, denn der Allerbarmer erbarmt sich auch unser wegen unseres [Reue-] Schmerzes.</p><p>4. Denn recht ist es, daß der, der sich der Sünde hingab, nun Schmerz empfinde; und wenn der Allerbarmer sich unser wegen unseres Reueschmerzes erbarmt, so ist’s ein Possenspiel, wenn sie uns um der Brotbrocken willen Verzeihung versprechen. Der Prophet, der Sohn des Buzi, lehrt es dich: Brotstücke als Lohn der Zauberei geben sie den Zauberinnen. Und es hört die Buße auf infolge des Geschenkes für die Bäuche.</p><p>5. Traue [ihnen] nicht, Unerfahrener, daß sie dich nicht wieder anfallen! Ein zerbrechliches Rohr ist diese ihre Vergebung, Sünden fügt sie noch hinzu. Dem Leichtfertigen mag dieses Blendwerk für seinen unheiligen Lebenswandel recht sein, und käme auch kein Mensch in die Hölle, möchte auch ich wohl an diesem mühelosen Lebenswandel Gefallen finden.</p><p>6. Die Sabbatianer bringt ein Weib unter seine Gewalt, so daß sie ihre Häupter unter seine Hand beugen; auf dem Lehrstuhl im Bema [Altarraum] sitzend, predigt es ihren Ohren, spottet es ihrer Bärte. Rügt es da nicht die Natur und macht es erröten? Auch Qûq ward für die Qûqiten zum Sinnbild seines Namens: zu leeren Krügen hat er sie durch seine Lehre gemacht.</p><p>7. Das ist das Auffällige, daß sie, obschon sie gleich sind, [untereinander] uneinig sind; der Teufel ist es, der mit ihnen umgeht wie mit einer Rohrflöte; er spielt auf ihnen zum Streit anreizende Lieder. Das ist eine Zither, deren Saiten bei ihrem Spiel nicht übereinstimmen, die nicht zusammenklingen zu einer wohlklingenden Melodie; ihr Verfertiger ist ja der Verfluchte [der Teufel].</p><p>8. Sie ergriffen alle trügerischen Bogen und berauschten sich an einer Hefe; einer füllt sich von anderen an und gibt es von sich. Die Kirche rief ihnen [warnend] zu, und der Teufel fürchtete sich vor ihr. Er sah die Heiligen in ihrer Mitte und wurde erschüttert; darum verschloß er mit Streit die Ohren seines Unkrautes aus Furcht, es möchte ihre [der Kirche] Stimme an ihre Ohren dringen.</p><p>9. Und es blähte und füllte sie auf der Teufel mit seinem Hochmut und drückte ihnen das Siegel des Widerspruchs auf; er verdarb sie und zeichnete in ihnen ein Bild der Widersetzlichkeit. Und als er sah, dass sie hungerten, schnitt er ab und gab ihnen gestohlene Worte zu; sie wurden blind und gaben sich nicht die Mühe, unter den abgeschnittenen Gliedern nach den dazugehörigen zu suchen.</p><p>10. Und da er erkannte, daß es nicht möglich sei, schloß er sie bei sich ein; doch die Wahrheit trat offen auf und bewies und machte wahr ihre Worte. Er sah, daß seine Gefangenen trunken waren von der Liebe zu jener Wahrheit; darum schnitt er aus jenem Buche des Lebens heraus Worte zum trügerischen Troste für seine Schüler, und damit sammelte er Gefangene in seiner Höhle.</p><p>11. Da die Lüge wegen ihrer Abscheulichkeit kein Ansehen finden konnte, so hat er ihren Trug mit dem Aufdruck der Wahrheit zu vertuschen gesucht, um so ihre wahre Gestalt zu verkleiden und durch ihr äußeres Aussehen in die Irre zu führen. Und weil es von der Wahrheit gestohlen ist, so konnte er es weder ganz zur Lüge, noch ganz zur Wahrheit machen; das von ihm Gestohlene wird zu seiner Anklage ohne Widerspruch genügen.</p><p>12. Sogar den lebendigen Sauerteig, den er von uns gestohlen und geraubt hat und den er in seine Worte eingehüllt hat, fürchtete er, daß er nicht etwa Lebenskraft den Seelen seiner Hörer einflöße. Die Kraft der Worte, die er gestohlen hat, veränderte er, um ein Fundament auf Sand seinen Bauleuten zu bereiten, die sich abmühten und Trug erbauten, einen Turm, dem Falle geweiht.</p><p>13. Die Kirche erkennt ihre Bücher durchaus nicht an, während sie selbst Zeugen sind für die in ihr niedergelegten Bücher. Indem sie bekennen, daß Moses existierte, klagen sie sich selbst an. Da einer dem andern die Wahrheit abstreitet, erklären sie ihre Bücher für verfälscht und geben so, ohne es zu merken, die Krone dem Wahrhaftigen, indem sie seine Herolde anerkennen.</p><p>14. Während sie wähnen, etwas sehr Großes gefunden zu haben, hat die Wahrheit sie weislich überführt: dadurch, daß sie über ihre [der Weisheit] Worte zu Gericht saßen, machte sie [die Wahrheit] sie zu Unterpfändern und Zeugen für ihre Worte. Während sie sich gegenseitig überführen, gleicht die Wahrheit dem Gedeon: indem sich die Toren gegenseitig mit ihren Schwertern zerfleischen, reichen sie besiegt ihr die Krone.</p><p>15. Alle die Söhne des Irrtums bekennen, daß es eine Wahrheit [d.h.die Heilige Schrift] gibt; Mani leugnete viel, wurde aber bald überführt. Wenn sie im Irrtum wären und glaubten, daß es keine Wahrheit gäbe, so könnte einer meinen, daß sie sie nicht kennen. Sie sind aber ihre eigenen Ankläger, da sie die Bücher zerschneiden und verstümmeln und die Worte, deren Sinn nur einer ist, verdrehen.</p><p>16. Wenn sich jemand erkühnt und ein Glied wegschneidet, so treten alle übrigen Glieder auf und fordern es zurück, und auch sein Ort [wo es weggeschnitten wurde] schreit nach dem Gliede. Und während das Wort, das abgeschnitten wurde, etwas Lebendes und Allbelebendes ist, ist es tot für den Dieb; sobald es an seine Stelle zurückversetzt wird, wirkt es lebenspendend, wenn es gelesen wird.</p><p>17. So ist es mit dem Körper der Wahrheit, deren Worte, den Gliedern vergleichbar, die Frevler und Irrlehrer abgeschnitten haben. Weil sie aber etwas Geistiges ist, wird sie als etwas [in sich] ganz Vollkommenes [Vollständiges] erfunden; bei den Unvollkommenen, die sie zerschnitten haben, ist sie unvollkommen, und sie können von ihr keine Fülle empfangen. In der wahren Kirche ist sie vollkommen und macht sie vollkommen.</p><p>18. Die Kirche des Wahrhaftigen ist groß und ihr Busen weit, und sie faßt die Fülle zweier Testamente. Geborstenen Zisternen nämlich wirft man vor, daß sie keine Wasserfluten in sich halten können. Denn die alten Schläuche hat zerrissen durch seine Neuheit der Wein, dessen Ungestüm in den neuen gebändigt wird.</p><p>19. Es sahen die Kinder des Irrtums, daß die beiden Testamente, verbunden und vereint, zu einem Körper der Wahrheit geworden sind; da schnitten sie an ihnen ab und nahmen und fügten zusammen und fertigten Bücher; sie schnitten heraus und nahmen Stücke, die [ihnen] zusagten. Das war ein Frevel, daß sie einen vollkommenen Körper zusammenfügen wollten aus diesen abgeschnittenen Gliedern.</p><p>20. Ohne Anfang ist das Buch, in dem sie lesen; wie konnten sie auch einen Körper bilden, der kein Haupt hat und nicht die Hände der beiden Testamente? Wer sah jemals einen so missgestalteten Körper, der keine Hände und keine Sinneswerkzeuge hat? Ein Körper ist’s, den Blinde und Häretiker gebildet haben.</p><p>21. Ein Auge an Stelle des Ohres bildeten sie, die Schwätzer; die linke Hand schnitten die Toren ab und nahmen sie fort; an ihre Stelle fügten sie einen Fuß an als andere „Linke“. Ihr Werk bezeugt, wie verkehrt sie handelten, indem sie an Stelle des gepriesenen Körpers der Worte die Mißgestalt eines Buches bildeten, dessen Text verwirrt ist.</p><p>22. Dich, o Kirche, erfreut dieser Körper der Wahrheit, wohlgeordnet in seinen Gliedern, vollendet in seinen Worten, getreu in seinen Verheißungen, gekrönt in seinen Vollkommenheiten. Die Wahrheit ist ihr erhabenes Haupt, und die beiden Testamente sind ihre ausgestreckten Hände, die Apostel sind ihre Sinne, die Propheten dienen ihr als Glieder.</p><p>Erläuterung zu den Sabbatianern in Strophe 6: Über die Sabbatianer hat Jakob von Edessa [† 708] eine wichtige Angabe in dem 12. Briefe an den Styliten Johannes von Litharb [?], der ihn über einige Stellen in den Hymnen Ephräms um Rat gefragt hatte. Der syrische Text wurde von W. Wright im Journal of sacred Literature [1867], S. 24 [der syrischen Paginierung] u. ff. veröffentlicht; eine französische Übersetzung lieferte F. Nau in der Revue de l’Orient chrétien 10 [1905], 277 ff. Der Brief ist auch deshalb wichtig, weil er die Ephräm-Stelle über die Sabbatianer wörtlich, wenn auch mit zwei geringfügigen Varianten zitiert. Die Stelle des Briefes lautet: „Deine Brüderlichkeit fragt mich über jenes Weib, von dem der heilige Mar[i] Ephräm in den Hymnen gegen die Häretiker sagt:,Es unterwarfen sich die Sabbatianer, so daß sie ihre Häupter unter ihre Hand beugten´; wer ist jenes Weib, und wer sind die Sabbatianer? Ich will Dir ganz einfach und kurz antworten. Es gab nämlich in Edessa eine gewisse Frau, die von ihrer Jugend an die Keuschheit und Enthaltsamkeit liebte; sie mischte sich unter die Knaben und wurde in der Schule in der Lehre der Kirche unterrichtet. Sie wurde von ihren Eltern Qamsû genannt. Sie täuschte durch ihr Aussehen und änderte auch ihren Namen und benahm sich so, daß sie von allen für einen Mann gehalten wurde, und keinem wurde bekannt, daß sie eine Frau sei. Sie lernte die Wissenschaft der Männer unter Männern, und sie wurde von jedermann für einen Eunuchen angesehen, sei es, daß sie es vom Mutterleib an sei, oder daß sie von Menschen verschnitten sei. Schließlich wurde sie ordiniert und wie ein Mann in den Klerus eingereiht bei jener Sekte, die man Sabbatianer oder Sambatianer nennt, weil sie den Sabbat halten und verehren wie den Sonntag; so jene damals, und jene, die von ihnen in den Gegenden Galatiens und Phrygiens übriggeblieben sind. – Nachdem sie dem Klerus beigezählt worden war, wurde sie in der Kirche der Sambatianer, die damals in Edessa bestand, berühmt und gelobt, sowohl wegen ihrer Keuschheit und Enthaltsamkeit als auch wegen ihrer Geistesschärfe und Gelehrsamkeit; sie war sogar beredter als viele ihrer Gesinnungsgenossen, so daß man sie zum Bischof wählte, da man glaubte, daß sie ein Mann sei. Und so wurde sie Bischof der Sambatianer in Edessa: ‚Und auf den Bischofsstuhl im Bema [Altarraum]’ wie der Lehrer Mar[i] Ephräm sagt, predigte sie ihren Ohren und spottete ihrer Bärte, und nicht rügte sie die Natur und machte sie erröten.’ Und der Platz ihrer Kirche besteht noch heute und ist bekannt und wird auch jetzt noch Ecclesia der Sambatianer genannt. Den Platz in Edessa kenne ich aus eigener Anschauung, ich, der ich dieses erzähle. – So verhält es sich mit der Geschichte jener Frau, und das ist die Sekte, der sie angehörte, nämlich der Sabbatianer, die den Sabbat beobachten. Man muß aber wissen, daß es zwei Sekten gibt, die Sambatianer genannt werden: eine in den alten Zeiten der Apostel und Jünger, die andere später, die eine Sekte von den Anhängern des Novatus her ist, die die Tür vor den Sündern, die Buße tun, zuschließen, und jetzt sind sie in Galatien. Das ist alles über Qamsû und die Sabbatianer, über die sie spottet.“ In demselben Briefe äußert sich Jakob von Edessa auch über die Qûqiten: „Betreffs dessen, was Deine Brüderlichkeit über Qûq und die Qûqiten fragt, möchte ich Dir mitteilen, daß fünf Häresien von der schmutzigen Freveltat des Valentinos ausgegangen sind, und jede von ihnen fügte noch hinzu und veränderte seinen Frevel über ihre Vorgänger hinaus: [das sind die Häresien] des Valentinos, des Markion, des Qûq, des Bardaisan und des Mani. Die des Markion ist eine Sekte der Valentinianer, ebenso auch die Sekte des Qûq, die nach seinem Namen Qûqiten genannt wurden; und auch er veränderte vieles von den [Lehren] des Valentinos und ebenso von den des Markion. Die Anhänger des Bardaisan sind nicht eine Sekte von jenen, die vor ihm bestanden, sondern sie nahmen von eben diesem Bardaisan ihren Anfang; als er aus der Kirche der Orthodoxen in Edessa ausgestoßen wurde, folgten ihm viele Anhänger seines Frevels und bildeten eine Häresie und Sekte aus dem Volke für sich selbst; sie wurden Daisaniten, nach dem Namen des Bardaisan, genannt; in ähnlicher Weise wurde die Sekte der Manichäer nach dem Namen des Mani benannt.“ – Über die Qûqiten handelt auch Theodor bar Kônî in seinem Buch der Scholien [Corpus Script. Christ. Orient. Syri, Ser. II tom. 66, 333 f.] und der von Rahmani, Studia Syriaca IV, 101 herausgegebene Traktat. Auch im Testamente Ephräms werden unter den von ihm bekämpften Häretikern die Sabbatianer und Qûqiten genannt.</p><h2>3</h2><p>Nach derselben Melodie.</p><p>1. Laßt uns nun die Ketzer überführen als Diebe! Der Schatz, den sie gestohlen, schreit gegen sie, denn er ist mit Sprache begabt. Namen haben sie gestohlen, mit denen sie etwas, was nicht ist, bekleideten. Mit dem Gottesnamen bekleidete man einst die Götzen, die man verehrte, und so wurden auch mit seinem Namen die „Wesen“, die nicht sind, geehrt und benannt.</p><p><em>Kehrvers:</em> Gepriesen sei, durch dessen Bücher die Söhne des Irrtums überführt werden.</p><p>2. Denn nicht von [aus] „Wesen“ schuf das Wesen [Gott] das All, da es keine Wesenheit [Sein] gibt, die erst zum Gemachtwerden [Werden] gelangen müßte. Wesen ist auch der Name jenes Herrn der „Wesen“, und sein eigener Name kann niemals unter untergeordnete Wesen geteilt werden; sie [die Ketzer] haben nun seinen Namen getrennt und gespalten, unter fünf Kräfte geteilt, und haben [so]seine Wesenheit zerlegt.</p><p>3. „Es käme nämlich der Name „Wesen“ ihnen aus dem Grunde zu, weil in ihnen nichts alt oder jung ist, und darum in ihnen auch nichts stark oder schwach sei.“ Dieser gleiche Name macht sie also in allem gleich; sie sind demnach entweder alle gut oder alle gerecht, und sie können nicht Geschöpfe und Schöpfer [zugleich] sein.</p><p>4. Noch [später als] Markion definierte Bardaisan, daß es zwei Götter nicht geben könnte, da nämlich jener Name selbst einzig Gott zukomme. Er irrte sich aber, so daß er durch seine eigene Waffe besiegt wurde; denn wenn es keine Götter gibt, muß er zugeben, daß es [auch] keine „Wesen“ gibt, da jener Name einzig der Wesenheit zukommt.</p><p>5. Wenn ein Gott gepredigt wird, müssen wir auch ein Wesen predigen; da Gott allein einzig ist, muß auch das Wesen eins sein, eins nach beiden Beziehungen, als Wesen und als Gott, und mit einem Namen wird er ganz erfaßt, denn er setzte keinen anderen Gott neben sich als Gott; töricht ist es, in der Wesenheit fünf [Kräfte-„Wesen“] neben ihn zu stellen.</p><p>6. Wegen der sechs Richtungen erdachte er [Bardaisan] sechs Wesen; vier „Wesen“ nahm er an gemäß den vier Himmelsrichtungen, eines verlegte er in die Tiefe und eines in die Höhe Markion erdachte zwei Götter; „Wesen“ und Götter werden durch die eine Kraft [Gottes] überführt, daß sie seine Gottheit entfremdet und seine Wesenheit zerteilt haben.</p><p>7. In Bardaisan fraß weiter der Irrtum der Griechen, da er lehrte, daß von „Wesen“ alles geschaffen und geordnet sei. In Mani aber kam wieder zur Herrschaft die Lüge aus Indien, und zwar führte er einander entgegengesetzt zwei Kräfte ein. Markion nannte nun als Wurzeln [Prinzipien] drei. Sie vermehrten die Götter, um [schließlich] ohne Gott zu sein.</p><p>8. Es wurden die Söhne des Irrtums überführt, daß sie von dem Einen die Namen gestohlen haben und [damit] das, was nicht ist, bekleidet haben; denn, was er geschaffen, mischten sie unterschiedslos seinen Namen bei. Markion und Bardaisan legen Zeugnis ab, da sie, so sehr sie sich unterschieden, doch übereinstimmen in bezug auf seine Zeugung, indem sie bekennen, daß er Gott ist, und nicht leugnen, daß er Schöpfer ist.</p><p>9. Wer sollte jenem Sohn der Wahrheit nicht mehr glauben als dem des Unkrauts? Siehe, sie verkünden seine Geburt; es mögen sich die Leugner schämen, daß sie seine Zeugung geleugnet haben! Wer sollte nicht weinen und betrübt sein, wenn er die draußen sieht, die nicht glauben wollen, und wenn er die drinnen betrachtet, die nicht satt werden, sich unvernünftig zu benehmen!</p><p>10. Und auch der Jude forschte nicht nach geheimnisvollen Dingen, obgleich in seinen Büchern für ihn Stacheln verborgen liegen; eine Frage ist’s, ob er, wenn er seinem Reichtum mit seinem Rauch [?] eifrig nachgeht, an den Heiligen Geist ohne Streit [Widerspruch] glauben würde; wenn er gefragt wird, leugnet er und obgleich er besiegt ist, lästert er, denn ihre Krone ist der Tod und ihre Waffe schnitt die Hoffnung ab.</p><p>11. Als sie nun an den Sohn nicht glaubten, traten die Begrabenen aus ihren Gräbern auf und legten einen Beweis damals für ihn ab. Und wenn jetzt einer den Geist verleugnet, daß er nicht sei, so überzeugen ihn die Bücher, daß der Geist ist der Hauch des Mundes des Herrn, und der Geist bei ihm ist; und wenn es eine Zeit gegeben hätte, die ohne Geist war, würden sie es ohne Streit aufzeigen.</p><p>12. Und anstatt dessen, daß es [ihnen] angemessen erschien, daß er durch seinen Sohn schuf, suchten sie zu zeigen, daß, als er schuf, jener [der Geist] mit ihm schuf, der mit ihm ordnete den Himmel und die Geschöpfe, so daß sie töricht den Sohn verleugnen und ihn auf ein anderes Werk beschränken und sich rühmen, daß er [der Geist] ihm Helfer war; und indem sie die Wahrheit fortwerfen, fanden sie Beschämung.</p><p>13. Ich lernte und glaubte an dich, daß du eins bist in deiner Wesenheit, ich hörte und bekannte dich, daß du der Vater bist mit deinem Eingeborenen, ich wurde zum drittenmal untergetaucht [getauft] auf den Namen des Heiligen Geistes; ich lernte alle diese Wahrheiten, daß, obgleich dein Reichtum ausgestreut ist, dein Schatz doch nicht erfaßt werden kann. Dir gebühren Lobgesänge von jedem, der als Mensch sich fühlt.</p><p></p><h2>4</h2><p>Nach derselben Melodie.</p><p>1. In den Gerechten hat man ein Bild von Schatzmeistern gesehen, denn sie haben die Schätze der [göttlichen] Majestät der Menschheit eröffnet, sie waren gleichsam Verwalter über die geschaffenen Dinge. Moses gebot dem Meere, und es gehorchte, denn nicht als einen leeren [kraftlosen] Namen wandte er den [Namen] Gottes an, und zugleich mit dem Wort ging die Tat hervor.</p><p><em>Kehrvers:</em> Preis sei dem, dessen Propheten die Chaldäer beschämten!</p><p>2. Er wies die Irrenden zurecht, die die Geschöpfe verehrten, denn es hielt [sie] der große Moses von den Geschöpfen zurück, damit die Toren durch ihn erkennen möchten, wie erhaben sie selbst seien, dass sie ihren freien Willen schändeten und erniedrigten vor ihren Götzenbildern; er nahm durch seine Werke von ihnen, die sich selbst geblendet hatten, die Binde hinweg!</p><p>3. Einer von ihnen versperrte den Weg vor der Sonne, und sie wandte sich entgegen ihrer Natur, um den Büßenden zu zeigen, wieviel das Weinen vermag, wie mächtig das Gebet sei. Da die Sonne ihren Lauf rückwärts wandte, sah Babel die Wundermacht, die seine Götzen beschämte, und pries den wahren Glauben des Ezechias durch seine Geschenke.</p><p>4. Ein anderer von ihnen streckte seine Hand aus, und auf sein Gebet hin hielt er die beiden Himmelsleuchten in ihrem Laufe auf; die Scheidewand der Finsternis zwischen zwei Tagen nahm er hinweg, sie vermischten sich und wurden ein Tag. Durch sein Fleisch [Menschwerdung] riß unser Herr die Scheidewand des Streites nieder, und die beiden, die sich [vorher] bekämpften, wurden eins.</p><p>5. Erschütterung entstand auf Erden und Unruhe auf der Welt, es erzitterte das Heidentum, es schrie auf das Magiertum. Auch der Blinde mochte da wohl sein Haupt zum Himmel emporrichten, jedermann erhob seine Augen und stand auf. Die Schöpfung stand ganz still und sah zwei Tage lang die Verdemütigung der Himmelsleuchten, die sonst verehrt, nun aber bloßgestellt waren.</p><p>6. Lasset uns die Torheit belehren, daß nur auf dem einen ihre Hoffnung beruhen wird, und daß sie den vielen absagen soll, denn nichts vermochten die Sieben gegen die Macht des einen Mannes! Wenn nun die Toren sagen, daß auch dieser unter dem Fatum stand, wie konnte er da das Fatum in allen Himmelsgegenden hemmen und binden? Da Sonne und Mond unterlagen, konnte auch kein Stern etwas ausrichten.</p><p>7. Und wie sie sagen, hat die Sonne von allen die größte Macht, und nach ihr der Mond von allen die geringste: er hat die Starke gefesselt und den Schwachen aufgehalten. Beschämt wurden alle [Astrologen], weil die [beiden Gestirne] unter lagen und ihre Bindungen [Konstellationen?] ohne Erfolg [Bestätigung] blieben. Gebet überwand sie, so daß sie ihnen nicht helfen konnten; wem können sie da noch nützen?</p><p>8. Wie konnten nun an jenem Tage die Toren die Stunden einteilen durch die Sonne, die nicht lief? Die Kinder jenes Tages [die an jenem Tage geboren wurden] gaben das Horoskop dem Spotte preis, denn das Los [die Nativität] ihrer aller war dasselbe, so daß entweder alle Sklaven oder alle Könige hätten werden müssen; daß dieses aber nicht eintrat, dafür liefert die Natur den Nachweis.</p><p>9. Die Frauen der Hebräer von damals bezeugen es, daß nicht alle an jenem Tage Könige gebaren und nicht alle Sklaven, denn keiner hat damals die Krone getragen, bis auf den gläubigen David. Auch konnte das Fatum die Verheißung nicht hinfällig machen, daß seine Söhne einer dem andern der Reihe nach die Krone überlieferten.</p><p>10. Das Persien der Chaldäer widerlegt die Chaldäer, denn seine Krone blieb ungestört, um in Unordnung weiter zu regieren; König und Königssohn folgten einander der Reihe nach, das Fatum wird durch seine [eigenen] Verkündiger widerlegt; ihre [der Könige] Reihenfolge zeigt, daß es ein [bloßer] Name ist ohne Kraft, da es nicht imstande ist, Unordnung über sie zu bringen.</p><p>11. Die Sonne stand an jenem Tage im Zenith und verteilt, wie man sagt, in solchem Augenblicke Kronen; betrachte nun, wieviel schwangere Frauen [damals] in einer Stadt niederkamen, und doch findet man nicht, daß es geschah, daß alle an dem einen Tage in einer Stadt Könige wurden; das bezeugt durch das Schwert die Eifersucht [der Argwohn] des Herodes.</p><p>12. Wenn nun jener Tag, der die Nativität [das Horoskop] gleichmachte, einzig ein unglückbringender gewesen wäre, warum war er glückbringend für die Hebräer, und wenn er ein glückbringender gewesen wäre, warum war er ein unglückbringender für die Hethäer? Damals wurde das Fatum beschämt in allem, was sich änderte, da es nicht die Kronen vermehrte in jener Zeit; Josue nahm dreißig Kronen weg zu seiner [des Fatums] Beschämung.</p><p>13. Und wenn seine ganze zwiespältige und unwahre Gleichheit ihm [dem Fatum] entgegen ist, dann widerlegt sie es völlig; und sehr töricht ist, wer seiner Zwiespältigkeit Glauben schenkt. Kann etwas einheitlich sein, das in sich selbst gespalten ist, so daß durch dasselbe die einen Städte zerstört, die andern erhalten bleiben? Gebet bindet und löst, denn seine Kraft zerstört und macht lebendig.</p><p>14. Es ließ an jenem Tage die Natur in gleicher Weise gebären, der Wille des Herrn des Alls aber machte einen Unterschied zwischen der Frau auf dem [vornehmen] Lager und der Magd im Schmutz; und es vermochte das gleiche Fatum nicht, die Unterschiede auszugleichen, die der Ordner des Alls gemacht hat, der zu unserm Heile die Feuer für unsere Prüfung zahlreich werden ließ.</p><p>15. Auch kann das Fatum nicht das Kind zum Sünder machen, denn auch für den [Vernunft-Geschlechts-?] Gebrauch ist es der Natur nach noch ein unmündiges Kind; und ebensowenig wie das Fatum seiner Unmündigkeit ein Ziel setzen kann, ebenso wenig sind auch die Sterne schuld an den Regungen des Jünglingsalters; denn auch ohne Fatum zeigt sein Wachstum an, daß die Zeit seines [Vernunft-Geschlechts-?] Gebrauchs gekommen ist.</p><p>16. Sie übergehen mit Stillschweigen die Gerechtigkeit, die Quelle der Vorzüge [Tugenden] und predigen die Unordnung, die Ursache der Laster; diese [die Unordnung] verweichlicht die Starken, jene [die Gerechtigkeit] stärkt die Verweichlichten. Das Fatum hat der Welt die Hoffnung abgeschnitten; es ist eine Erfindung Satans, die er zu unserm Untergang erfand, indem er den freien Willen glauben machte, er sei ein Sklave der Gestirne.</p><p>17. Zwei Tage lang fesselte er den Lauf der Gestirne. Und wie haben sie in jener Zeitspanne die Nativität zugeteilt? Es gerieten nämlich ihre Beobachter in Erstaunen, da er die Wandelsterne aufhielt, denn vor [bei] ihrem Beobachten leuchteten sie auf. Er hatte ihren Lauf gehemmt, um den Sinn zu verwirren und ihnen zu zeigen, daß die verborgenen Dinge nur dem einen allein enthüllt seien.</p><p>18. Für die Dauer von zwei Tagen hielt er den Lauf der zwei Leuchten auf, damit durch den Mund zweier [Zeugen] bestätigt würde, daß einer ist, der alles leitet durch seinen geliebten Sohn, der in der Höhe bei seinem Vater verborgen ist; Jesus – der Name deutet es an – leitete die Kriege, und der Herr jenes Namens regierte die Sterne.</p><p>19. Wie haben sich die Eitlen [wie eine Flut] ergossen und leichtsinnige Menschen mit sich fortgerissen! Wie haben die Toren, die im Irrtum lebten, törichte Weiber mit in den Irrtum hineingezogen! Bettelnd irrten sie nämlich umher und gaben Schicksalslose für deren Kinder. Und wenn ihr [der Sterne] Lauf, da er ihn band, nichts vermochte, und als er gelöst wurde, seine Bahn fortsetzte, wer kann da mit seinem Verstande ihren Lauf erfassen?</p><h2>5</h2><p>Nach derselben Melodie.</p><p>1. Warte, und ich will dir sagen: Siehe, ein Tor läuft an die Tür des Chaldäers und geht, um seine Freiheit den Gestirnen zu unterwerfen, die [doch] durch das [Natur-] Gesetz gebunden sind! Du bist, wenn du willst, der Herr ihrer aller; statt jenem, der dich in Irrtum führt, ahme vielmehr dem nach, der die Sonne aufhielt, um dich zu belehren, wieviel das Gebet vermag.</p><p><em>Kehrvers:</em> Selig jener, der durch deine Wahrheit die Frevler beschämte!</p><p>2. Wenn der Chaldäer meine Taten und Werke, die ich getan habe und tun werde, mir offenbart, und wenn ferner die Willensfreiheit unter der Herrschaft des Fatums gefangen gehalten ist, dann soll er auch in seiner Weisheit die Ausdrücke und Worte offenbaren, die ich sprach und sprechen werde, denn es können doch meine Worte dem Fatum, das [angeblich] alles lenkt, nicht entgehen.</p><p>3. Wenn aber die Willensfreiheit Gewalt hat über ihre Gedanken und ihre Worte keineswegs unter das Fatum fallen, so kann dann weder ihr Reden noch ihr Handeln von ihm erfaßt werden; die eine Hälfte von ihr liefert uns den Beweis für ihre andere Hälfte: wenn ihr Wort für das Fatum zu hoch ist, um wieviel höher ist dann ihr Handeln? Denn niemals hat ein Zwang ihr Wollen gebeugt.</p><p>4. Und wenn infolge des Fatums viele Blinde auf Erden sind, warum gibt es nicht viele Könige mit ihren Kronen? Wenn ferner infolge des Fatums ein Tauber [in seinem Gebrechen] dem andern gleicht, warum sind sie dann nicht auch in Figur und Gesicht gleich? Das zeigt, daß der eine gleichmacht, was für uns gut ist, und unterscheidet, was uns frommt.</p><p>5. Er hat die Gesichter verschieden gemacht, er hat die Antlitze geformt, er hat gleich gemacht die Prüfungen und die Grübler verwirrt; er hat Unterschiede gemacht, damit wir erkennen, er hat Gleiches gebildet, damit wir erstaunen, er schuf Gleiches und Ungleiches, um uns mit Bewunderung zu erfüllen; er hat seine Unterschiede gleichgemacht, denn eins ist das Urbild der Menschen; er hat seine gemeinsamen Merkmale unterschieden, denn einer ist, der alles kennt.</p><p>6. Sehr verwirrend ist für uns der Anblick seiner Anordnungen, und gleichsam ohne Ordnung macht er arm und wieder reich, und doch ist diese Unordnung ganz der Ordnung unterworfen, wie auch jeder einzelne der Sterne, die gleichsam ungeordnet sind, doch geordnet und nach dem Gesetz hingestellt ist, nicht damit sie mich vergewaltigen, sondern um mir Ermahnungen zu geben.</p><p>7. Nicht als Herren unserer Freiheit sind sie hingestellt, sondern als Diener für unsere Herrschaft; Leuchten sind sie [uns] auf dem Festlande, Meilensteine auf dem Meere, indem das Auge sich nach ihrem Wahrzeichen richtet; die Plejaden, der Wagen, die Hyaden [?], der Orion lehren uns ohne Irrtum, daß einer ist, der alles lenkt.</p><p>8. Königsszepter und Gesetze bezeugen, daß es eine Willensfreiheit gibt, denn sie bestrafen die Frevler und unterweisen die Unkundigen. Wer gemordet, erwürgt, Ehebruch getrieben und geraubt hat, ruft laut, daß wir Willensfreiheit besitzen. Und wenn wir keine Freiheit hätten, wie sollte es da eine Anklage geben? Das Fatum muß seinen Mund schließen bei der Stimme des Anklägers.</p><p>9. Wieviel Taube gibt es, die mit dem einen [gleichen] Gebrechen gekennzeichnet sind? Aber nicht zehn gibt es, die das gleiche Aussehen aufweisen; auch nicht einmal fünf hat das Fatum mit dem gleichen Gesicht gezeichnet. Die Wahrheit sah, daß der Irrtum die Kinder mit den Nativitäten und die Gebrechen miteinander übereinstimmend machen wollte; da änderte sie die Gesichter, um die Nativitäten zuschanden zu machen.</p><p>10. In unserm Zeitalter leben Menschen, die 110 Jahre alt sind, und doch gab es keine Kinder, von denen eins dem andern völlig gleich gewesen wäre in bezug auf Anlage, Aussehen, Gesicht und Figur. Dem Fatum, das hundert Jahre in Geltung war, ist es also nicht gelungen, [Kinder] mit einem [gleichen] Aussehen ins Leben zu rufen, wie es Blinde zu jeder Zeit hervorbrachte. —</p><p>11. „Adam zeugte den Seth nach seinem Gleichnisse und als sein Abbild.“ Weil der Schöpfer sah, daß sein Abbild entstellt sei, hat er es nach sich umgestaltet und als Siegel sich ihm aufgeprägt, d. h. der allmächtige Schöpfer hat das Abbild, das entstellt war, nach sich umgeformt und hat seiner Häßlichkeit die frühere Schönheit aufgeprägt.</p><p>12. Seth war für seinen Vater gleichsam ein Spiegel, Adam sah sich selbst, da er in seinem Sohne abgebildet war, und auch Seth sah sein Bild im Bilde des Vaters. Wer hat den Sohn und sein Entstehen gesehen, daß einer im andern abgebildet war, einer den andern angezogen hatte? Mit dem Geheimnis [Typus] unseres Herrn und seines Vaters sind sie verbunden. —</p><p>13. Wenn also jemand die Frau eines Chaldäers geschändet, ihm den Beutel geraubt, sein Haus geplündert, seinen Tisch umgestoßen und seinen Krug ausgegossen hat, und wenn dieser nun für sich und seine Frau sich zu rächen sucht, macht er das Horoskop unbewußt und unbedacht hinfällig, da es lehrt, daß von ihm her die Ereignisse kommen.</p><p>14. Wenn er seinen Mund öffnet und die Lose [Wahrsagezettel] und Horoskope vorlesen will, so nimm ihm sein Buch weg, zerreiße und zerfetze es, verlache und verspotte ihn und bedeute ihm, daß dieses nach seiner Lehre [so] geschehen müßte! Und wenn er an dich Forderungen stellt [Entschädigungen haben will], frage ihn, weshalb er verlangt, keinen Nachteil zu erleiden, und betrügt, um Gewinn einzuheimsen!</p><p>15. Siehe, wie die [Willens-] Freiheit sich für die ihr angetane Beleidigung rächt, indem sie sowohl das Geld zurückfordert als auch die ihr gebührende Stellung verlangt! In dem Augenblicke, wo sie dies fordern, machen sie das Horoskop hinfällig; gerade seine Lobredner machen es zuschanden, die, indem sie fordern, was Rechtens ist, die wilde Tollheit der Chaldäer, die verwirrte Worte ausgestreut haben, zur Ordnung zurückbringen.</p><p>16. Die wirren Söhne Babels versuchten unser Gehör zu verwirren. Einst wurde die Sprache in seiner Mitte verwirrt; Gaukler und Wahrsager versuchen nun wieder in ihm Verwirrung anzurichten; das Babel der Verwirrung verwirren sie nämlich. Wer sich und sein Gehör jenen hingibt, in dem tanzt und tobt und tollt eine Legion [von Teufeln].</p><p>17. Heil dir, katholische Kirche, deren Augen nicht auf den Sternenlauf gerichtet sind, den Babel beobachtet, über welches der Prophet, der Sohn des Arnos, lachte und oft spottete! Er spottete über die Irren, die es in die Irre geführt hatten. Der Stern der Wahrheit führte sie nach Bethlehem, damit die, die durch die Sterne zum Irrtum verleitet worden waren, durch den Stern das Leben erlangten.</p><p>18. Denn nicht jenen Irrtum des Fatums und des Horoskops sahen sie im Laufe jenes wandelnden Sternes, sie erkannten nämlich, daß die Natur und die Freiheit gestört sei; er lief gegen seine Natur, um uns zu belehren; er verkündete, daß nun aufgeleuchtet sei die Wahrheit auf der Erde, er brachte die frohe Botschaft, daß die Befreiung der Geschöpfe gekommen sei.</p><p>19. Deine Wahrheit, Herr, sei uns eine Festung, in der wir Zuflucht finden! Siehe, der Irrtum schleicht umher und greift uns mit allen Stacheln an; die Wahrsagerei möchte uns [wieder] zu Heiden machen, die Träumerei uns verführen. Reinige in deiner Quelle deine Kirche! Auch Lauf [Spur?] und Gegenlauf, Ruf und Wort sind Schmutz des Heidentums, der viele befleckt.</p><p>20. Niemals sah ein Mensch ein Schiff mitten auf dem Meere, das allein umhertrieb und ohne Schiffer war, daß es sich selbst führte und leitete: wie Schiffe sind alle bedürftig; die Seele [bedarf] der Freiheit, die Schöpfung eines Schöpfers, die Kirche des Erlösers, der Altar des Heiligen Geistes.</p><h2>6</h2><p>Nach derselben Melodie.</p><p>1. Wie sollen wir gegen das Fatum auftreten, so fragt man mich. Wenn es etwas Fremdes ist, so wird die Natur darüber Herr; tritt es als Gebieter auf, so unterliegt es doch der Notwendigkeit. Die ganze Natur mit allen ihren Teilen erhebt sich gegen dasselbe; das ist nicht nur Sache der Gerechtigkeit, denn sein Frevel ist ohne Maß, sondern auch der Gnade, denn sein Gift ist ohne Grenze.</p><p><em>Kehrvers:</em> Gepriesen sei, der den Irrtum beschämte und seine Verkünder bloßstellte!</p><p>2. Ist ein Stern einem Verachteten günstig, um ihm Ruhm zu verleihen, warum vermag der [selbe] Stern nicht, einem Blinden das Licht zu geben? Das Fatum, dem alles unterworfen sein soll, ist selbst bei den Gebrechen unterlegen. Gerade durch seine Unbeständigkeit wird es bloßgestellt. Denn es kommt nicht vor, daß es ein fehlendes Auge heilt, ebensowenig wie es einen Finger wiedergeben kann.</p><p>3. Wenn es vorkommt, daß ein Kind ohne Sinnesorgane empfangen wird, frage dann, wer das Gebrechen im Mutterleibe gebildet hat, und um wieviel das Gebrechen des Kindes seinem Geburtstag vorausgeht! Wenn es aber ferner zwei Nativitäten gibt, dann stehen beider Stunden miteinander im Widerstreit, die Stunde seiner Geburt mit der an deren Stunde seiner Empfängnis und seines Anfangs.</p><p>4. Und wenn sie sagen, daß die Stunde seiner Empfängnis dieselbe ist, die bei seiner Geburt zusammentrifft und wiederkehrt, so irren sie gewaltig und führen in die Irre, denn sie [die Stunde] vermag das nicht zu tun. Ein Trug ist’s, der erdichtet und widerlegt wurde. – Doch siehe, es ist eine Kraft erschienen, die die Horoskope auflöst, im Mutterleibe tötet und außerhalb desselben lebendig macht.</p><p>5. Wie verteilt nun der Irrende die Nativität? Beziehen sie ihre Berechnung auf die Stunde seiner Empfängnis oder stützen sie sich bei der Zuteilung auf die Stunde seiner Geburt? Das Fatum fängt sich selbst und wird überführt: denn wenn es [erst] bei der Geburt hinzutrat, dann ergibt sich, daß die Empfängnis [längst] vorangegangen ist; wenn es aber schon die Empfängnis in Anspruch nimmt, – diese Stunde ist verborgen.</p><p>6. Wenn jener Stern, der Blindheit brachte, so mächtig war, warum ist ein anderer seinesgleichen so schwach, daß er nicht imstande ist, [das Auge] zu öffnen? Wenn aber die Natur die Nativitäten überwindet, zeigt sie, daß der Herr des Alls alles erhält, und wie er die Lose zugeteilt hat, daß die Sklaven Sklaven und die Freien allezeit Freie erzeugen.</p><p>7. Und wenn es vom Fatum herrührt, daß die Fische einander verschlingen, warum schlachten die Lämmer einander nicht? Wenn ferner die Nativitäten die Großäugigen bestimmt, so traf die Maulwürfe das Los, blind zu sein. Welches ist denn die Nativität der Teufel und Dämonen oder die Stunde der „Legion“, des Herrn der Chaldäer?</p><p>8. Betrachte diese Aufstellung, wie sie sich gegenseitig auflösen, frage die Zauberer, Wahrsager und Chaldäer, prüfe sie in irgend etwas, und sofort werden sie des Irrtums überführt, denn ihr ganzes Fundament ist gespalten, die Wahrsagekünste heben die Vorzeichendeutung auf, ein Zauberer besiegt den andern, eine Traumdeutung macht die andere wirkungslos und die Sterne die Zauberer.</p><p>9. Wenn nun der Lauf der Gestirne und Leuchten nicht in dem eigenen freien Willen ebendieser Leuchten liegt, wollen wir sie bezüglich dieses schwierigsten aller Punkte fragen: wer leitet die Bewegung aller? Und wer sich nicht als Beherrscher seiner Bewegung erweisen kann, den sollst du nicht als Herrn hinstellen, denn ein Knecht ist er nur, ohne Beine.</p><p>10. Scharfsinnig war Bardaisan, daß er dieses Fatum durch ein höheres fesselte, das in Freiheit wandelt; den Zwang der unteren [Gestirne] Planeten widerlegte er durch die oberen, ihr Schatten widerlegte ihren Körper; denn jene Berechnung, die die unteren fesselte, lähmte auch die volle Freiheit der oberen.</p><p>11. Verlasset jetzt den furchtbaren Frevel der Chaldäer, die den Schöpfer erzürnen und seine Macht einschränken, als werde auch er vom Zwange [Notwendigkeit] blindlings regiert; seine Gedanken fesseln sie an die Gestirne. – Wer wird noch das Gute lieben und das Gerechte pflegen, wenn es kein Gericht und keinen Feuerofen der Vergeltung gibt?</p><p>12. Wenn nun [jemandem] vom Mutterleibe her die Stunde [das Geschick] eines Mörders zuteil geworden war, die Natur aber im Kinde siegte und es die Freiheit eintreten ließ, damit sie im Kinde siegreich bleibe, bis es erwachsen ist, und wenn dann dem Mannesalter ein nützliches Los [Stellung] zuteil wird, so kann man sehen, daß die Zucht das Kindesalter sanft und das Greisenalter frei machte.</p><p>13. Die Sterne nämlich warten auf keine Zucht, weil das Fatum seine Unordnung nicht zur Ordnung machen kann, denn sein Lauf und seine Dispositionen entspringen nicht seinem Willen, Zwang ist es immer und Zufall. Wenn sie [die Zucht] die Jugend und das Alter sanft macht, zeigt sie, dass der Freiheit die Krone gebührt.</p><p>14. Die Wahrheit ist eine einzige, und ihre Kraft lässt sich nicht spalten; wenn aber ihre Hörer uneinig sind und sich bekämpfen, so berührt der Schmutz der Widerspenstigen ihre Schönheit nicht. Und wenn sie in sich selbst also nicht geteilt ist, so ist das Herumstreiten eine Krankheit der Grübler selbst, da sie die Grenzen der Lehre nicht genau beobachten.</p><p>15. Drei Grenzen sind nämlich den Gläubigen gesetzt, über die auch keiner von ihnen hinausgehen kann und darf; innerhalb derselben müssen wir das Unstäte unseres Denkens festhalten; da eine [Grenze] sich weithin mit den andern mischt, so verletzt der Mensch, der eine überschreitet, alle und fällt in Hunderttausende ihrer Hinterhalte.</p><p>16. Die Vormauer ist mit einem Kranz von Fluten umgeben, nicht vermag das Feuer des Streites sie zu erreichen; durch die Mauer wird ihr Feind, der auf sie losgeht, besiegt. Schweigen gebietet sie [die Mauer] unserm Worte, und nicht kann es [unser Wort] dahin gelangen, die Quellen der Fluten zu erforschen, denn ihre [der Mauer] Fluten reißen es fort.</p><p>17. Verlassen wir das Innere [Verborgene] und sprechen wir von den Chaldäern! Wenn das Fatum wirklich Einfluß hat auf das Kind, dem es bestimmt ist, die Jugend in gedrückter Lage zuzubringen, und wenn aber das Fatum vorbeigeht und diese schlimme Stunde [Geschick] mit sich nimmt, ohne daß sie Schaden hinterläßt, so ist die Natur, die sie überwältigt, ein Zeuge ihrer Schuld.</p><p>18. Wie soll durch das Fatum alles geordnet sein, das alles verwirrt? Maße und Gewichte, warum und für wen? Welche Ursachen riefen die Gesetze hervor? Das Fatum vernichtet sich selbst in jeder Beziehung. Siehe, es ruft die ganze Schöpfung durch aller Mund: Es besitzt der Mensch die Nachbarin der Gerechtigkeit.</p><p>19. Nicht vom Fatum kommt Beschneidung und Vorhaut her [Judentum und Heidentum], denn dieses [das Heidentum] beobachtet Gebräuche und jenes [das Judentum] die [Speisen-] Unterschiede. Das eine unterscheidet die Speisen, das andere Einrichtungen. Von wem kommen die vielen Enthaltsamen in der Welt, deren Stand das Fatum und die Natur verachtet? Denn nicht die Sterne haben das Heilige in den Heiligen zubereitet.</p><p>20. Die Reichen verachten es [das Fatum], wenn sie für ihren Reichtum Sorge tragen; die Armen verachten es, da sie ihre Mühseligkeiten ertragen; die Fastenden verachten es, die in ihrem Fasten aushalten; es bezeugt die Jungfräulichkeit, daß es [das Fatum] nicht existiert. Siehe, der Gegner sind ihm viele in [diesem] Kampfe erstanden; sie halten aus und werden von ihm [unbehelligt] gelassen auf der Laufbahn der Freiheit.</p><p>21. Wenn es einen stumm macht, so ist er jederzeit stumm; wenn das Fatum die Hand bildete, daß sie überall morde, warum ruht in der Volksmenge der Arm des Mörders? Wer hat den Einfluß seines Sternes wirkungslos gemacht? Die Ehebrecherin schämt sich vor Gericht und empfindet Reue; wer hat den Blick jenes unreinen Gestirns keusch gemacht?</p><p>22. Wenn Wahrheit und Unrecht vom Fatum kommt, weshalb wird die Wahrheit geliebt, warum das Unrecht gehaßt? Wenn es keine Freiheit gäbe und keinen Läuterungsofen, und wenn das Fatum allein existierte, wer hat dann dem Menschen geoffenbart, daß er Gott angehört, und wie Christus das Fatum besiegt hat und seine Gesetze?</p><p>23. Wenn das Fatum die Wahrheit wäre in allem, was es sagt, und der Mensch ohne dieses nicht denken könnte, so müßte in allen Regungen, Worten und Gedanken Wahrheit ausgesprochen werden; wenn es [das Fatum] aber lügenhaft ist, muß es schweigen, und wir rufen: die Freiheit ist die Quelle der Gedanken!</p><p>24. Durch sein Joch wird das tyrannische Joch der Chaldäer zuschanden, das die Menschheit wie Tiere unterjocht, denn sie rauben den freien Willen, der die Gedanken lenkt. Meer und Festland liefern den Beweis, daß das Schiff und den Wagen ein anderer lenkt. Lerne, daß der, welcher alles schuf, auch alles lenkt!</p><h2>7</h2><p>Nach derselben Melodie.</p><p>1. Wisse, o Bruder, daß alles, was nach geschlechtlicher Vereinigung strebt, nicht einzeln geschaffen, sondern einer Genossin zugesellt ist. Sollte nun jener, der in seiner Gerechtigkeit sogar die kriechenden Tiere zusammengesellt hat, die „Reinen“ [= Engel] so eingeschränkt haben, daß er ihnen zwar Samen eingegossen, aber ein Erdreich nicht gegeben hätte, so daß sie fielen, herabstiegen und auf dem Erdreich der Unteren säten?</p><p><em>Kehrvers:</em> Gepriesen sei, dessen Geschöpfe die Chaldäer überführen!</p><p>2. Eine erdichtete Lüge ist dies, die sich selbst widerlegt! Denn es wäre für eine solche Frucht im Mutterschoße kein Platz gewesen; die Figur [Natur] des Vaters zeigt, wie groß sie gewesen wäre, sein Haupt reichte nämlich bis an die Sterne. So weist die Natur die Lügner genügend zurück, da die Menschentöchter selbst die Sache [als unmöglich] widerlegen.</p><p>3. Wer aber grundlos seinen Nächsten haßt, dessen Ohr dürstet sehr nach verleumderischen Gerüchten über ihn, und jede Schlechtigkeit, die er hört, glaubt er leichthin, mag es wahrscheinlich oder unannehmbar sein. – Mani haßte die Wahrheit und glaubte die törichtsten Dinge, weil er keinen Prüfungsofen hatte, die Aussprüche zu prüfen.</p><p>4. Er hielt [die Lüge] von den Riesen für wahr und glaubte an [die Träumereien] der Chaldäer. Und die Toren sehen nicht ein, daß das eine durch das andere widerlegt wird. Denn wer hat wohl jene keuschen Söhne der Höhe betört? Erstreckte sich das Fatum bis zu ihnen hinauf? Und wie kam dort hin der Blick [Aspekt] des Sternes? Sie, [die die Fabel glauben], werden überwunden durch die Erdbewohner und widerlegt durch die Bewohner der Höhe.</p><p>5. Schau ferner auf die Staturen und widerlege das Horoskop! Es gibt nämlich ein anderes Geschlecht, halb so groß als [gewöhnliche] Menschen [Zwerge], und doch mit ihnen verwandt, die kleine Statur zum Beispiel, welche ist die Statur des Zöllners Zachäus. Wenn diese [Statur] jemand durch den Samen der großen [Menschen] fortpflanzt, so wird sie groß und widerlegt entschieden die Streitigkeiten.</p><p>6. Von der wunderbaren Quelle des Hauses Adam erfloß der gemeinschaftliche Strom der Sprachen und Bildungen: die Statur der Riesen, die andere der Schwachen, was jenen widerlegt, der behauptet, daß die Wächter [= Engel] herabgestiegen sind und das Geschlecht der Riesen gezeugt haben. Wer aber hat dann den anderen Samen der Schwachen gesät?</p><p>7. Denn siehe, drei Stämme entsproßten und gingen hervor aus Noe: das Geschlecht der Riesen, das zweite der Mittleren und das dritte, welches das der Menschen von halber Größe [der Zwerge] genannt wird, was bezeugt, daß die Wächter [= Engel] nicht herabgestiegen sind. Und wenn die Engel das Geschlecht der Riesen erzeugt haben, wer hat wohl das zugrunde gegangene Geschlecht wieder hergestellt? Wer stieg herab und zeugte das [Geschlecht] der Kleinen und Zwerge?</p><h2>8</h2><p>Nach derselben Melodie.</p><p>1. Lernen wir an den Tieren, daß nicht die Gestirne [bei ihnen] die Zeit der Begattung geordnet, bei den Menschen aber ungeordnet gelassen haben! Lassen wir uns beschämen durch die geregelte Begattung der Vögel, verachten wir die Zeichen des Tierkreises bei allen Dingen! Denn nicht die Sterne haben die Raben züchtig in der Begattung gemacht, ebensowenig wie die Sterne unzüchtige Männer und Frauen zur Sünde verführten.</p><p>2. Siehe, ein Wort, das den Mund des Chaldäers verschließt! Ein Stern soll nämlich den verheirateten Frauen vorstehen, die, wenn sie angeklagt werden, den Tod wegen ihrer Ehebrüche erleiden; rechtfertigt etwa ein anderer Stern immer ihre Männer, die sich Buhldirnen kaufen? O wie töricht ist das Buch und der Traum des Chaldäers!</p><p>3. Eingeschlossen sind die Jungfrauen, engverwahrt die Bräute; Eunuchen und Wächter hüten sie jede Stunde, jedermann gibt auf sie acht, jedermann macht ihnen Vorwürfe. Wer ist beständig gegen sie erregt? Und wer läßt [anderseits] die Bräutigame und Jünglinge frei und zügellos, so daß sie jeden Tag durch Ausschweifungen die Gerechtigkeit herausfordern können?</p><p>4. Dem Manne gestattet [demnach] das Fatum, innerhalb und außerhalb sittenlos zu sein, daß er sogar die Frau seines Knechtes schänden darf, ohne den Tod zu erleiden; und wenn der Knecht, und auch seine Herrin mit ihm, sich verschwören und an dem Wüstling Vergeltung üben, wer zürnt, wenn sie sich [auch] vergehen und Unrecht tun, über sein Tun, da es [nur] Vergeltung ist, und verlangt den Tod, da es [nur] gerechter Zorn ist?</p><p>5. Der Gerechte [Gott] hat die Ehe auf der Wage gewogen; Eva legte er auf die eine Schale, Adam auf die andere. Er hatte weder zwei Männer gebildet noch zwei Frauen gemacht, um zu lehren, daß der eine an die eine gebunden sei. Dieselbe Wage wägt auch bei der Auferstehung; und wer den Weg überschritten hat, den führen sie auf die linke Seite.</p><p>6. Dich, o Mann, möge deine Begierde nicht täuschen, daß du denkst, daß Natur und Gebot das Weib [allein] binden. Durch die Rippe richtet er dich. Ist sie auch verhüllt, so ist ihre Schamröte doch rein und offenkundig und nicht verächtlich. Weil du dein Haupt offen und frei erhebst, ist deine Schamröte verborgen; rein und offen soll auch deine Schamröte sein nach dem Vorbilde deines Hauptes.</p><p>7. Es fielen und trieben Ehebruch Weiber im Volke der Hebräer; und weil die Rippe schwach ist, schadete ihr Verbrechen nur ihr selbst. Als aber das Haupt sich verging und in Unzucht fiel, stürzte es zwanzigtausend in seinen Fall. Nathan ließ die Rippe und lief zum Haupte, Jakob ließ die Bilha, über den Erstgeborenen aber sprach er den Fluch aus.</p><p>8. Denn wenn sie [die Gestirne] die Lose von Reichtümern und Besitztümern geben, ist es wahrscheinlich, daß ein Mensch glaubt, daß sie von sich aus etwas nach unten gaben? Wer hat wohl den Reichtum entdeckt, der von [bei] ihnen oben ist? Wenn sie selbst davon nichts geoffenbart haben, von wem erfloß diese Quelle der Verheißungen, daß sie [die Quelle] etwas Unsterbliches den Sterblichen gab?</p><p>9. Wenn aber ihre Blicke [= die Aspekte der Sterne] beschämt werden durch Ehebrecher, und ihr Antrieb zu ängstlichem Schweigen gebracht wird durch Mörder, und ihr Anstoß ohnmächtig wird durch Greise und Kinder und auch der Verstand ihre Kraft widerlegt, so genügt dies zur Verurteilung der Chaldäer, da es zeigt, daß unsere Freiheit über sie [die Sterne] erhaben ist.</p><p>10. Die keuschen Männer und Frauen besiegten im Kampfe jene Unzüchtige, die sie zu den Sieben [Planeten] beizählten, derentwegen schamlose Männer und Frauen ausgelassen und infolge des verfluchten Sternes verrückt wurden, der in den Städten die Griechenherden verwirrte, und in der Wüste die Wildesel, die Hagarsöhne, befiel.</p><p>11. Das Fatum soll auch den Körpern all die verschiedenen Farben verleihen. Wie kommt es, daß es in Indien den Schwarzen nicht eine andere Farbe gab? Und wie, daß es die Weißen in Medien nicht schwarz gemacht hat? Im Süden widerlegen den Tierkreis die Körper der Dunkeln, im Norden die der Blonden, im Osten die der Bärtigen und im Westen die der Gelockten.</p><p>12. Kronen und Ehrengaben [werden] den Königen und Großen [gegeben], Weihrauch sogar den gemeißelten Steinen [dargebracht]; und selbst der, der sein einziges Werk vollbrachte, verehrt es; wer aber beschimpft nicht die Sterne? Das Fatum nennt man blind, einen Ehebrecher den Mond; als eine Buhlerin auf der Straße hat man den [Venus-] Stern hingestellt.</p><p>13. Ein paar Weiber hat man auch unter den Sternen genannt, und zwar sind es nicht gewöhnliche Namen ohne Bedeutung, es sind [nämlich] Namen von Weibern, die auch von Begierlichkeit erfüllt sind. Und wenn jene Weiber allen [Männern] angehören, wer unter ihnen ist keusch, wer unter ihnen rechtschaffen, da sie nicht einmal wie die Vögel den Geschlechtsgenuß geordnet haben?</p><p>14. Fragen wir die Chaldäer über jene beiden, die sich fünf andern zugesellt haben, über den Mond [= Selene] und den Venusstern! Sie haben die Ehe her abgewürdigt und mit Füßen getreten durch ihre Ehebrüche, sie haben die Ehe in allem zur Lüge gemacht. Die Frau des Chaldäers soll ihn beschämen, wenn er etwa eifersüchtig auf sie ist; seine Frau muß ja von ihrem Sterne lernen.</p><p>15. Er muß auch seine Tochter aneifern, eine Schülerin des Mondes zu sein, um die Lasterhaftigkeit zu lernen. Und von einem andern Sterne sagen sie, daß er ein Mörder sei; er [der Chaldäer] muß demnach auch seinen Sohn zum Schüler dieses Sternes machen, der das Schwert wahllos zückt. Er mag auch den seine eigenen Kinder fressenden Saturn nachahmen.</p><h2>9</h2><p>Nach derselben Melodie.</p><p>1. Der Mund jenes vernünftigen Sternes soll also beredt sein? Der Zwang regiert ja sein Wort und seinen Lauf; er ist überführt worden, daß er in allen Bewegungen von Ohnmacht überwältigt ist, und wenn der Stern etwas Totes ist, so steht er wirkungslos da, denn Tote können Tote nicht lebendig machen und Stumme kein Wort in unsern Geist säen.</p><p>2. Wie kann einer blind sein, ohne daß der Stern blind ist, und wie kann einer stumm sein, ohne daß der Stern stumm ist? Der Lahme belehrt uns über seinen Stern, daß er [der Stern] lahm ist. Das Fatum hat also alle Gestalten an sich, es ist stumm, blind, lahm und von einem Teufel besessen. Ein abscheuliches Untier ist da den Chaldäern begegnet.</p><p>3. Und wenn die Sterne und der Tierkreis Verstand besäßen, müßten sie doch auch ihre große Armseligkeit einsehen; sie müßten erkennen, daß sie unter dem Zwange ruhelos ihre Bahn laufen. Alle haben in jeder Beziehung etwas Unbedeutendes an sich, denn sie können weder ihren Feinden schaden noch ihren Freunden nützen, während nach diesen beiden Richtungen sogar der Knecht eines Richters etwas vermag.</p><p>4. Daß das Feuer heiß, der Wind kalt, das Wasser feucht, die Erde trocken ist, könnte mit einiger Wahrscheinlichkeit noch als von ihrer Macht ausgehend angenommen werden, denn da herrscht kein freier Wille. Sie [die Chaldäer] mögen aber nachweisen, wie die Blicke [Aspekte] von Sternen ohne Sehkraft Toren und Weise hervorbringen!</p><p>5. Wenn sie nämlich kalte und warme Dinge hervorbringen, so geschieht dies, weil Warmes und Kaltes in ihnen ist; und darum geben sie, ohne zu sehen, von dem, was sie gemäß ihrer [natürlichen] Zusammensetzung haben. Wenn sie aber sehen und Verstand geben, den sie nicht haben, so ist einer, dessen Wille die Schatzkammer aller Dinge ist.</p><p>6. Die Höhe jenes Nordens trägt ganz [nur] Schnee, der überhaupt nicht abnimmt, um den Tierkreis zu widerlegen; denn es vermag das Fatum nicht, jenen Schnee zum Aufhören [Schmelzen] zu bringen, der die Quellen des Nordens reich macht, obwohl nicht [bloß] ein kalter Stern auf jenen Ort schaut, der die Scheune des Schnees und die Vorratskammer der Quellen ist.</p><p>7. Die Schiffe, die untergehen, die Häfen, die verschüttet werden, die Beulen und Seuchen, die Erdbeben und Erschütterungen, die Kriege und Überschwemmungen, der Einsturz von Städten heben das Horoskop [die Nativität] auf, da sie es [für alle Betroffenen] gleichmachen. Die Hütten der Hebräer und Zelte der Hagarskinder [Araber] rufen laut, dass der freie Wille Gewohnheit und Gesetz ist.</p><p>8. Wohin sind die wilden Feste und die Glöckchen und Würfelspiele und die gereihten Bücher der Chaldäer gekommen? Wer hat die Feier der rasenden Göttin abgeschafft, an deren Fest die Weiber sich der Hurerei preisgaben? Stand etwa ein Stern jenen Mädchen vor, die einst ihre Jungfräulichkeit der Unzucht weihten?</p><p>9. Siehe, alle Völker gehorchen Fürsten, dienen ihren Oberhäuptern, verehren ihre Könige. Wer hat uns also gegen die Gestirne zum Aufruhr gereizt? Sie durch sich selbst haben uns ja zum Abfall gezwungen. Wer möchte sich wohl zum Fatum bekennen, das uns zum Abfall geführt hat? Wer möchte einem Herrn dienen, der uns nötigt, uns seiner zu schämen?</p><p>10. Das Fatum, das die Diener ihren Herren unterwirft, betrachte es, wie es im Gegenteil uns gegen sich selbst zur Empörung treibt! Es macht sich selbst durch uns lächerlich. Wenn es keine Freiheit gibt, dann nötigt uns der Zwang, es zu verachten. Es bringt uns zum Schweigen, daß wir nicht die Könige ins Angesicht lästern; es ehrt [also] die Könige durch uns, sich selbst aber läßt es durch uns beschimpfen.</p><h2>10</h2><p>Nach derselben Melodie.</p><p>1. Die Sonne sendet ihre Strahlen aus und trifft uns. Wenn nun die Sterne ebenso ihre Blicke [Aspekte] aussenden, so ist das Aufleuchten ihrer Strahlen zu jeder Stunde gleich [wertig], und es liegt in der Stunde keine [besondere] Kraft. Wenn ein Stern die Quelle und der Anstoß der Willen ist, so hebt der Zwang seines Laufes seinen [freien] Willen auf.</p><p>Kehrvers: Selig, wer aus Liebe zu dir die Irrlehrer verachtet!</p><p>2. Wenn es aber hohe und niedere Abteilungen ihrer Wege gibt und dadurch der Stern das Horoskop unterstützt [möglich macht], so fragen wir ganz ruhig: Was bleibt denn vom Tierkreis und vom Stern in uns zurück? Teilt er uns Gewalt oder freien Willen, Aspekte oder Freiheit mit?</p><p>3. Wenn das Feuer einem Dinge seine Wärme geliehen hat, so verfliegt und versiegt die Wärme, die es ihm [nur] geliehen hatte. Fragen wir nun; Wenn ein Stern seinen Strahl zurückgezogen hat, und wenn er körperlich abgeschnitten ist, wie kann ein Teil von ihm in uns verborgen zurückbleiben, und wie kann er [der Teil] von Tag zu Tag unversehrt bleiben und unversehrt gemacht werden?</p><p>4. Kommt vielleicht eine andere Macht, die uns nötigt, oder kommt der Stern [einmal] wieder, um dem Alter das zu geben, was es ihm am Tage seiner Geburt versprochen hatte? Und wenn es ferner Aspekte der Sterne gäbe, wie könnte der Aspekt ohne Körper in uns bleiben, der Glanz ohne Loslösung, die Kraft ohne Befestigung?</p><p>5. Er scheint entweder etwas Vergehendes oder etwas Bleibendes zu sein; und wenn ihre Kraft fortgegangen ist, was bewegt sich da in uns? Und wenn sie abgetrennt ist und [in uns] bleibt, dann ist sie nicht allein, denn ungeordnete Kräfte wohnen [noch] in uns, und wer soll ihre große Verwirrung in Ordnung bringen, daß jede einzelne zur rechten Zeit zu ihrem Geschäft gerufen wird?</p><p>6. Denn wenn einem Menschen vom Fatum bestimmt ist, daß er zu seinem Ende ein Wüstling und Verschwender wird, wer hat [bis dahin] das Fatum aufgehalten und am bestimmten Tage in Bewegung gesetzt? Schlief es und wachte es dann auf? Und wer wirkte jenem ersten Stern entgegen? Machte der Stern seinen Weg zweimal oder wiederholte das Fatum seinen Lauf?</p><p>7. Betrachte doch die Tiere? Sie besuchen [einander] nicht und merken es nicht, wenn sie besucht werden; [nur] das vernunftbegabte [Geschöpf] nämlich sammelt und bewahrt auf. Von der Wohltätigkeit weiß nichts der Wurm, weil ihm ja keine Auferstehung bestimmt ist. – Preis sei dem, der unsere Freiheit in Fülle ausgestattet hat, damit wir unser Leben nicht zu einem Leben der Tiere machen!</p><p>8. Nicht besuchen die Tauben die einsamen Eulen, die Füchse geben keinen Unterricht den einfältigen Hasen, die Fische helfen den Fußgängern im Schwimmen nicht; sie wissen nichts davon, daß einer sich des andern erbarmen soll. Und dieses kommt von der [Natur-] Ordnung, nicht vom Tierkreis her. – Preis sei jenem, der dem Menschen hohe Einsicht verlieh!</p><p>9. Es wird einer krank, damit der andere ihn besuche und jenem geholfen werde; wiederum einer leidet Hunger, damit der andere ihn speise und jener durch ihn am Leben erhalten werde; einer ist unverständig, damit der andere ihn belehre und jener dadurch [an Einsicht] gewinne. So kann die Welt bestehen, und Tausende von Möglichkeiten sind verborgen zu unserer Hilfe in jenen Dingen, durch die die Chaldäer täglich [Got] zum Zorne reizen.</p><p>10. Für die Himmlischen dort, die in Herrlichkeit sind, findet sich freilich keine Möglichkeit zu Wohltaten, ein Engel kann von seinesgleichen keine Wohltaten genießen. Blind ist also der Chaldäer, der nicht sieht, daß über den Sternen Ergötzung und Freuden, unterhalb der Sterne aber Hungersnot und Almosen sind.</p><p>11. Die verschiedenen Meinungen und Lehren widerlegen die Chaldäer; wie vielfach nämlich sind die Völker geteilt bezüglich der Religionen und halten an ihren törichten Gebräuchen unverbrüchlich fest. Dazu zwang sie doch wohl nicht der Lauf der Sterne? Und wer bekleidete die Schnellen mit Flügeln, was, wie die Toren sagen, das Rad der Veränderungen bedeutet?</p><h2>11</h2><p>Nach der Melodie: O mein Schüler!</p><p>1. O unser Arzt! Heile unsere Freiheit! Durch dich möge sie geheilt, durch dich möge sie gesegnet werden! Laß nicht ab, ihr zu helfen, denn auf dir beruht ihre Genesung. Eine hohe Gabe [ist sie], durch die du uns bevorzugt hast vor den Meeren, die durch ihre Grenzen gebunden sind, vor der Erde, dem Himmel und den Bergen, die ohne sie viel geringer sind.</p><p><em>Kehrvers </em>: Die kleinen Körper hast du, o Herr, durch die Freiheit über alle Geschöpfe erhöht!</p><p>2. Unser Herr, besuche unsern Geist, denn krank sind wegen der Güter seine Willensentschlüsse und wegen der Besitzungen seine Gedanken, und wegen seiner Begierden ist krank seine Macht. Denn böse ist er an sich nicht, wenn er [nur] will; gleichwie auch keine Finsternis da ist, wenn es Licht geworden ist, und gleichwie Dornengestrüpp [nur dann] emporwächst, wenn das Feld der Pflege entbehrt.</p><p>Sei, o Herr, sein [des Geistes] Licht und Pfleger, auf daß er durch dich gereinigt und erleuchtet werde!</p><p>3. Die Ungläubigen mit den Chaldäern heben mit ihrer [Willens-] Freiheit die [Willens-] Freiheit auf. Das böse [Ur-] Wesen soll stärker sein als sie [die Willensfreiheit], und das Fatum ist der Zwang, der sie unterjocht. Zeigen wir nun [demgegenüber], dass ihre [der Freiheit] Macht über alles herrscht! Ihr Herr nämlich leitet das Gute und auch das Böse, und kein böses [Ur-] Wesen steht ihr entgegen, kein Zwang des Fatums vermag etwas wider sie. Gepriesen sei der Schöpfer der Freiheit, der der Magd die Freiheit über sich selbst gab!</p><p>4. Wer könnte die Freiheit verbergen, die wie die Sonne am Firmament leuchtet? Wer vermöchte ihre Herrschaft zu leugnen, deren Kraft gewaltig ist wie Gott? Wie offenkundig ist sie, denn siehe, ihre Verleumder sind ihre Verkünder; wie klar ist sie, denn siehe, ihre Schmäher sind ihre Posaunen! Leicht ist ihre Sache und angenehm ihre Partei; ihr Name ist kostbarer als alle geschaffenen Dinge. –</p><p>Gepriesen sei der, der Gebote flocht, mit den die Freiheit bekränzt werde! Gepriesen sei der, der die gerechten Zeugen zahlreich werden ließ, die laut die Freiheit verkünden“!</p><p>5. Die [heiligen] Schriften belehren uns, daß der Gerechte nicht dem Bösen statt der Freiheit Vorwürfe machte; wenn aber ein böses [Ur-] Wesen wäre, würde er dieses gescholten oder bezwungen haben. Wenn ferner das Fatum es wäre, das [Leute zu] Mördern macht, würde jedermann dieses tadeln und nicht die Mörder. Den Verbrechern selbst aber macht man Vorwürfe, da sie ja durch ihre Naturen nicht gezwungen waren, –</p><p>Gepriesen sei derjenige, der durch Moses und Daniel die Könige in ihren Städten zurechtwies!</p><p>6. Gleichwie die Freiheit die Kraft, die in ihr verborgen ist, unterdrücken und durch Vergnügungen abstumpfen kann, bis der Gerechte sie [die Kraft] durch Züchtigungen offenbart – wenn sie leiden muß, gibt sie ihrem Herrn das Anvertraute zurück –, ebenso unterdrückt sie auch durch Lüge die Wahrheit. Gezwungen bekannten auch die Zauberer und Chaldäer die Wahrheit. —</p><p>Gepriesen sei der, der die Hülle der Wahrheit zerriß, und es leuchtete aus ihr die verborgene Wahrheit auf!</p><p>7. Gepriesen sei der, der den Adam nicht durch etwas Großes oder Starkes prüfte, damit niemand fälschlich behaupte, daß Zwang oder eine andere fremde [feindliche] Gewalt vorlag! Durch ein verächtliches Werkzeug aus dem Geschlecht der Tiere [geschah es], das er mit dem Namen Vieh [Be’ira], d. h. das Unterjochte, bezeichnete. Außerdem machte er es lahm, und es wurde erniedrigt, so dass den Adam etwas in Schande brachte, dessen er sonst spottete.</p><p>Dem Meere glich Adam, das von einem Windhauch regiert wird.&lt;p 8. Der Babylonier hat die Chaldäer wegen ihrer Lehre zum Tode verurteilt; und nun nahmen sie ihre Zuflucht zu einem Namen, der erhabener ist als der Name des Fatums. Wenn sie ihre eigenen Götter als solche ansahen, mußten sie von diesen eine Offenbarung erfahren; wenn sie aber eine andere Macht verkündeten, haben sie dadurch ihren eigenen Lehren widersprochen. –</p><p>Gepriesen sei der, der sie vor Daniel sich selbst widerlegen ließ!</p><p>9. Die Chaldäer, die sonst nie den über alles erhabenen Gott bekannten, brachte der Zwang ihres Ränkespiels in Not, und sie verkündigten die Wahrheit, die sie [früher] geleugnet hatten. Ihr Wille hielt hartnäckig die Wahrheit zurück; und da sie den Namen Gottes in der Vielzahl nannten, trat Daniel auf und verkündete den einen Gott, der über alles herrscht. —</p><p>Gepriesen sei der, der seine Offenbarung bekannt machte, die ein Mensch durch das Gebet empfing!</p><p>10. Das Fatum, nicht das Gebet, gibt, wie die Chaldäer sagen, Offenbarung; Berechnung ist’s nach ihrer Aussage; wer sie [die Berechnung] erlernt hat, kann alles durch sie erforschen. Als sie aber zwischen Trug und bloßem Schwerte standen, da eilten sie und deuteten den Traum durch eine andere Macht aus, die keiner [Berechnungs-] Kunst unterworfen ist. Das Gebet verrichtet der [freie] Wille.</p><p>Und weil sie die offenbare Wahrheit bekannten, rettete Gott ihr Leben.</p><p>11. Als die Starken schwach geworden, die Widerspenstigen müde und bestürzt wurden, und als ihre eigenen Lehren und Wahrsagereien und Götzenbilder sie zuschanden gemacht hatten und ihre Krankheiten nachzulassen begannen, da berief der Gütige die hebräischen Ärzte. Ihre Zeichen und Offenbarungen wurden [so] zur Arznei für ihre Zerrissenheit, —</p><p>Gepriesen sei der, der durch ihre Leiden auf ihren Willen einwirkte und ihre Krankheit entfernte!</p><p>12. Der Pharao, Babels Verwandter, verachtete die Kunst seiner [Babels] Zauberer; das Fatum, das es [Babel] liebte, stellte er bloß, denn nicht von dort kommt das Todesgeschick. Ihre [der Ägypter] Handlungen widerlegten die Bücher jener [der Chaldäer]; denn wie kann wohl die Geburt unter einer Nativität den Mädchen auf dem Trockenen das Leben erhalten und die Knaben in dem Flusse ersäufen?</p><p>Gepriesen sei, der sie maß, den ersten durch den zweiten mit dem großen Maße des Meeres!</p><p>13. Ägypten wurde geschlagen; es lernte aber auch, daß die Macht, welche schlägt, auch heilt; es lernte dies nicht von den Chaldäern, denn ehe die schlimme Zeit [der Plagen] vorbeiging, lief es zu Moses, der seine Krankheit heilte. Vielleicht wurden seine Leiden deshalb zahlreich und seine Plagen reihten sich aneinander, damit es nicht denke, daß etwa ein Zufall vorliege; zehnfach lernte es die Wahrheit.</p><p>Moses belehrte Ägypten, die Kühe belehrten das Philisterland.</p><p>14. Gepriesen sei, der die Schlupfwinkel bloßlegte, die voll waren von Wahrsagern und Zauberern: Ägypten, das Magazin der Heilwurzeln, und Babel, das Magazin der Amulette! Auch Assyrien lernte durch den Fall des Sennacherib, und [es lernten] die Indier, die auf das Gebet des Asa eine Niederlage erlitten. Alle Völker stachelte der Höchste durch vielerlei Anlässe dazu an, daß sie ihre Blicke auf ihn richteten.</p><p>Gepriesen sei, der uns ein Doppeltes zugleich lehrte, daß wir einen Herrn, aber auch Freiheit besitzen!</p><h2>12</h2><p>Nach der Melodie: Die ganze Schöpfung sündigte vor dir.</p><p>1. Es lehrte der Gerechte den Söhnen des Irrtums die offenkundige Wahrheit durch Joseph; weil sie aber im Irrtum fortfuhren, schrieb Moses sie [die Wahrheit] ihnen zur Erinnerung auf ihre Leiber. Mit unsichtbarem Finger, durch Blattern und nicht mit Tinte, zeichnete er sie ihnen auf.</p><p><em>Kehrvers:</em> Lob sei dir, Herr, der du deine Anbeter vermehrt hast; sie glänzen auf Erden durch ihre Tugenden!</p><p>2. Beschämt wurden die Zauberer, deren Zaubersprüche sie selbst nicht retten konnten; denn es verbreitete eine unsichtbare Macht über sie die sichtbare Pest vor jenem Stammler, an dem, obwohl er bei der Tochter der Wahrsagereien aufgezogen worden war, der Schmutz ihrer Wahrsagereien doch nicht kleben geblieben war.</p><p>3. Der Glaube war mit ihm aufgewachsen und mit ihm zu jeder Altersstufe emporgestiegen, wie er [Gott] auch an jener Jugend bewirkte, daß ihre Kleider nicht veralteten; er ließ ihre Kleider mit ihren Körpern wachsen, so daß den Staturen auch die Bekleidung entsprach.</p><p>4. Weil er vor Pharaos Tochter sich nicht scheute, es abzulehnen, aus Gefälligkeit gegen sie sich mit ihr dem Irrtum hinzugeben, und da er sein Angesicht nicht mit Menschenfurcht [Heuchelei] geschminkt hatte, machte Gott sein Angesicht glänzend; und weil er ihrer Götter gespottet hatte, machte er ihn zum Gott und sandte ihn gegen sie.</p><p>5. Er [Moses] hat uns ein Zeichen [Vorbild] gegeben, daß der Geist eines jeden, der sich vor einem Großen oder Reichen nicht scheut, sich zu weigern, aus Gefälligkeit gegen ihn mit ihm zu sündigen und seinem Glauben Schaden zuzufügen, der [vielmehr] auf Gott sieht, auf verborgene Weise erglänzt.</p><p>6. Auch der Große und Reiche bewundert ihn, obgleich er ihn haßt; äußerlich haßt er ihn, innerlich bewundert er ihn, weil rein ist die Farbe seines Glaubens, da er seine offene Farbe nicht in die Heuchelei, die Schande [Errötung] des Angesichts, getaucht hat.</p><p>7. Der Gerechte lehrte die Wahrheit in Babel; und weil sie diese vergaßen, brach die Flamme aus dem Ofen hervor und erinnerte sie daran; und weil sie im Irrtum fortfuhren, stieg eine Handfläche herab und schrieb eine Schrift der Erinnerung im Palast des Irrtums nieder.</p><p>8. Nuns Sohn hielt Sonne und Mond auf, und sie [die Kanaaniter] sahen die Schwäche ihrer Götter; ein einzelner Mensch hemmte sie durch seinen Glauben und hielt gewaltsam sogar ihren Lauf auf ihren Bahnen auf, und sie vermochten seine Schranke nicht zu überschreiten.</p><p>9. Beschämt wurden die Chaldäer, weil ein Mensch, der nach ihrer Meinung unter dem Fatum steht, die Himmelssphären hemmte und die Sieben [Planeten] und die Zwölf [Zeichen des Tierkreises] aufhielt. Die Schrift zeigte [so], daß nicht das Fatum über uns herrscht, sondern, daß wir die Herrscher über das All sind.</p><p>10. Den ganzen Tag blieben die Leuchten stehen, da der Gerechte seinen Sieg überzeugend nachwies, indem er nicht wie in einem Traume oder einem Truggebilde die Macht zeigte, damit er den Toren die Einsicht verdoppele und unter den Irrenden die Wahrheit zwiefach erglänze an der Sonne.</p><p>11. Weil die Toren, die Söhne der Finsternis, glaubten, es sei nur ein Zufall oder von ungefähr, so hat er, da die Finsternis ihres Verstandes eine doppelte war, auch das Licht verdoppelt, um sie zu überzeugen. Die Sonne ging nämlich um zehn Grad zurück, um zehnmal den Irrtum zu widerlegen.</p><h2>13</h2><p>Nach derselben Melodie.</p><p>1. Es sah Elias die unreine Festversammlung der Baalspriester, die besessen waren, und, sobald er das Wort der Wahrheit ausgesprochen, mit lautem Geschrei ihn verspotteten. Da entbrannte sein großer Eifer, weil er sah, daß sie von dem Einfluß der Jezabel abhingen.</p><p><em>Kehrvers:</em> Preis sei dem Allmächtigen, der seinen Gerechten Macht gibt, Himmel und Erde zu …</p><p>2. Er ließ sich nicht auf ein wildes Gezänke ein, noch kämpfte er auf pöbelhafte Weise; die Weisheit der Wahrheit wandte er an, und aus der Spitze seines kleinen Fingers bildete er ein Zwangswerkzeug, damit alle Mächte eine Zurechtweisung darüber erhielten, ob eine Macht imstande sei, ihm zu widerstehen.</p><p>3. Er verschloß durch sein Gebet die Pforten der Höhe und die Regenströme und die Schatzkammern des Taues, er entfernte Nebel und Wolken und schloß die Winde in verborgener Scheuer ein. Der feuchte Himmel ward ehern und die weiche Erde hartgeschmiedetes Eisen.</p><p>4. Gleichwie Moses zur Zeit des Hagels den Hagel zurückgehalten hatte, und die Zauberer am Tage des Regnens beschämt wurden, so eiferte Elias und hielt den Regen zurück, damit das Zeichen der Wahrheit sogar den Blinden offenbar werde; zur Regenzeit entzog er den Regen.</p><p>5. Der eine, der Sanftmütige, hielt den Hagel zurück, der andere, der Eiferer, hemmte den Regen. Sie sahen die Regenwolken weggezogen vor seiner Stimme, wie sie dann sahen, daß sie sich [wieder] ausbreiteten auf das Gebet seines Mundes; und durch beides beschämte er den Achab.</p><p>6. Das Firmament, welches die Scheune der Sättigung ist, verschloß er mit seiner Stimme; dann ging er weg und verbarg sich, damit sie, als sie ihn suchten, die Wahrheit suchten; und indem sie an verschiedenen Orten nach ihm forschten, wurde ihnen Belehrung zuteil, durch wessen Macht der Himmel verschlossen worden war.</p><p>7. Die Brüste des Himmels ließ der Eiferer versiegen, und die Säuglinge der Erde versiegen in Qual; es hörten die Güter [Erzeugnisse der Erde] auf, weil er den Tau zurückhielt; es verdorrten die Saaten, weil die Regengüsse versiegten. Es wurde jener Götzendienst gezüchtigt, weil er durch seinen Altar den Gütigen erzürnt hatte.</p><p>8. Sechs Monate und drei Jahre waren Himmel und Erde von Asche bedeckt, die Lügenpropheten und alle Menschen verhüllten ihr Haupt und schwiegen, die Baalspriester schämten sich ihrer Götzenbilder, und auch die Wahrsager stellten ihre Wahrsagereien ein, und die Streitsüchtigen wurden zurückgewiesen.</p><p>9. Schämen mußten sich die Chaldäer, die Lügenhaftes schwätzten, denn die Sieben vermochten nicht mehr durch ihre Aspekte, ihren Dienern Tau zu geben. Beschämt wurde auch jener, den man den nassen Hermes nennt, da ein Mensch den Dürstenden quälte.</p><p>10. Jezabel ward beschämt, daß an ihrem Tisch ein Kreis von Lügnern gemästet worden war. Die achthundert Baalspropheten waren nicht imstande zu lösen was der Finger jenes Eiferers gebunden hatte; er legte seine Schlinge um ihren Hals und entzog sich durch die Flucht.</p><p>11. Die Könige der Erde sahen, daß der Himmel versiegt war; mehr und mehr bestürmten sie ihre Götzen und opferten ihnen und befrugen ihre Wahrsager. Es irrten die Irren, die Lügenhaftes sprachen, denn verborgen war ihnen die Wahrheit.</p><p>12. Sie sahen wohl, daß der Regen aufgehört hatte, aber sie erkannten nicht, wie und wozu und was es bedeute, und wer oder welche Macht ihn abhalte. Als aber Achab, einer von den Königen, den Elias suchte, verkündete er durch sein Suchen die Wahrheit.</p><h2>14</h2><p>Nach der Melodie: Seine Herde hat Bardaisan.</p><p>1. Wenn harte Stoffe zu bearbeiten sind, gelangen auch harte Werkzeuge zur Verwendung; durch hartes Eisen und mächtiges Feuer und gewaltigen Wind und durch Geschicklichkeit und Kraft werden sie bewältigt und kommen in den Ofen zur Herrichtung, damit sie [dann] dem Gebrauche dienen.</p><p>2. Widerspenstige [Tiere], die sich durch sanfte Behandlung nicht zum Gehen bringen lassen, bringt man durch Zaum und Joch dazu, daß ihre Widersetzlichkeit zur richtigen Einordnung gelangt. Widerstreben sie noch, führt es zur Züchtigung, lassen sie sich lenken, führt es zu milder Behandlung. Wenn sie sich aber hartnäckig widersetzen, so wird ihr Treiber der Stock; sind sie gehorsam, dann ist Liebe ihre Führerin.</p><p>3. Zu ihrer Unterwerfung dient das Joch, zu ihrer Züchtigung der Stock. Für ihre Störrigkeit verdienen sie Leiden, zu ihrer Abrichtung ist Kraft notwendig; zu ihrer Erziehung bedarf es des Rates, sie zur Besserung zu führen der Weisheit, zu ihrer Einigung der Liebe, zu ihrer Prüfung des Eifers. Ihrer Eintracht folgt der Friede, ihrer Unterwerfung ein Schatz, ihrer Einsicht Ruhm.</p><p>4. Es gibt aber auch Störrige, Verwandte jenes Pharao, der, wenn er geschlagen wurde, sich bekehrte und Buße tat, wenn er aber wieder frei wurde, wieder vergaß und frevelte, ein Bild der Verkehrten; wenn solche nämlich geehrt werden, fällt es ihnen ein, sich verächtlich zu benehmen, durch Schmeichelei werden sie verdorben, und nur durch Strenge können sie in Schranken gehalten werden.</p><p>5. Wenn du dich demütig beträgst, verachten sie dich ohne zu unterscheiden, trittst du mit Macht auf, hassen sie dich ohne einzusehen; bist du entgegenkommend, so fallen sie über dich her, und du wirst unterdrückt; bist du aber scharf, so meiden sie dich, und du wirst beschimpft; wenn beide Eigenschaften in dir gemischt sind, so halten sie dich für falsch, schmeichlerisch und hinterlistig.</p><p>6. Wenn sie krankwerden, lassen sie dich holen; werden sie vernachlässigt, so richten sie dich; besucht man sie, so zollen sie dir keinen Dank; wenn sie wieder gesund geworden sind, wollen sie nichts mehr von dir wissen; wenn sie sich zum Mahle niedergelassen haben, stoßen sie dich nieder; werden sie zur Rechenschaft gezogen, so verfluchen sie dich; behandelt man sie gnädig, so treten sie dich mit Füßen. Weder Güte noch Gerechtigkeit kann es ihnen jemals recht machen, weil sie in allem schlechter sind als alles. —</p><p>7. Seht nun, wie alle Söhne des Irrtums einig sind! Von den Griechen haben sie den einen hässlichen Namen der abscheulichen Hyle erworben; denn weder Moses hat im Pentateuch über sie geschrieben, noch haben die Propheten Andeutungen über sie gemacht, und auch die Apostel haben ihrer nicht Erwähnung getan; ein ewiges Wesen verkünden alle Söhne der Wahrheit.</p><p>8. Und sehet, wie die Söhne des Trugs sich miteinander verbanden und schrieben von ihr, daß sie ein [ewiges] Wesen [Itûta] sei. Markion stellte sie nämlich in seinen Schriften dem Schöpfer gegenüber; über sie schrieb auch Bardaisan in der Geschichte vom Schöpfer; Mani aber aus Babel hat sinnlos über sie geschrieben, daß sie gefesselt sei: Dornen mit Unkraut zusammen.</p><p>9. Denn es war nicht Sache des unverschämten Markion, zu schreiben, daß der Schöpfer durch [von] jene Hyle alles schuf und einrichtete, das wäre vielmehr Sache des Moses gewesen, mit Hilfe des Heiligen Geistes [darüber] zu schreiben, da der Gerechte es nicht ablehnte, durch den Mund seiner Herolde die Wahrheit seinen Hörern zu erzählen.</p><p>10. Moses, der Auserwählte, schwieg [von der Hyle], um die Verworfenen zu beschämen, die die „Hyle“ ausriefen, wie die Kreuziger, die einstimmig zusammen Barabbas riefen; denn sie sahen, daß er ein Räuberhauptmann war, und sie machten ihn [darum] zu ihrem Oberhaupte, damit sie imstande wären, mit Hilfe eines Gewalttätigen den Helden zu töten, der seine Kraft in ihre Hände gegeben hatte.</p><p>11. Markion versammelte seine Wölfe und sein Genosse seine Füchse, Mani seine Katzen [Wiesel], um den zu bekämpfen, der durch Davids Hand die Löwen und Wölfe niederschmetterte und durch Samsons Hand die Füchse zusammenband, ein Vorbild ihrer Genossen, die die Wahrheit durch ihre [der Ketzer] eigenen Worte fesselt.</p><p>12. Es ward ihnen der Irrtum zum Schlachthorn für die Irrenden; durch Kriegstrompeten brachten die Beschnittenen alle zum Aufruhr und riefen Grübelei und Streit hervor. Der Dorn rief den Stachel zu Hilfe, der Stachel das Unkraut und das Gestrüpp die Spreu. Sie brachten sich selbst so weit und zogen aus, sich mit jenem Feuer des Herrn des Weltalls in Kampf einzulassen.</p><p>13. Dann verschworen sich miteinander die erbarmungslosen Schlangen und die tauben Ottern und die Kriechtiere und wagten es, in den Stein zu beißen, der das Standbild zermalmte, welches der König in Babel aufgestellt hatte, mit dem Kopfe eines Drachen, den Füßen eines Basilisken und dem Bauche einer Otter.</p><p>14. Es kamen zusammen und verbanden sich Würmer und Raupen und die häßliche Motte, um loszugehen und auf die Ferse des Helden zu treten; diese Ferse aber ist vom königlichen Geschlecht des Hauses David, die ins Meer hinabstieg und auf ihm wandelte, und den Leviathan zermalmte und siegreich heraufstieg.</p><p>15. Der Geier [?] schlug mit den Flügeln, schwang sich empor und vereinigte sich mit den Raben den Söhnen der Finsternis; der Habicht rief die Nachteule herbei, und es verhandelt der Reiher [?] mit ihm, um mit jenem himmlichen Adler zu streiten, dessen donnerndes Flügelrauschen den Satan vertrieb und das Paradies öffnete und den Räuber [den guten Schächer] hineinführte.</p><h2>15</h2><p>Nach der „Paradies“ -Melodie.</p><p>1. Ein Toller macht auch jenen toll, der [noch] nicht toll ist; so auch ein Vermessener, der auf ihn hört. Ein Aussätziger verunreinigt nach dem Gesetze auch den Reinen. Das Grübeln übertrifft die Schlange [an Schädlichkeit]. Hüte dich vor dem Geschwätz des Mundes eines Vermessenen mehr als vor dem Hauch aus Basiliskenrachen!</p><p><em>Kehrvers:</em> Gib, Herr, daß wir uns im Kampfe mit deiner Wahrheit rüsten!</p><p>2. Die unscheinbare Biene, das unbedeutendste aller Flügeltiere, ladet die Künstler ein und beruft die Weisen, ob sie imstande seien, den Reichtum ihrer Abteilungen [Zellen] zu durchschauen, wie sie Körper schafft, sie begräbt und die Toten wieder zum Leben erweckt, und, nachdem sie sie flügge gemacht, in deren Gräber Ströme von Süßigkeit ergießt.</p><p>3. Betrachte ferner den Vogel! Er hat keine Bauwerkzeuge, weder die Hand der Künstler noch den Finger der Zimmerleute; dennoch staunen die Baumeister über sein Nest und sein Bauen. Die Arbeiten und die Zeiten teilt er ein; den Männchen fallen die Nester [das Bauen der Nester] zu, den Weibchen die Jungen [die Pflege der Jungen]. Durch die Störche und Schwalben kommt Schande über jenes Volk.</p><p>4. Wer hat den Tieren einen Schatz von Schlauheit gegeben, so daß sie, wenn ein Männchen geboren wird, es aus Furcht verbergen, und wenn ein Weibchen geboren wird, es voll Vertrauen aufziehen? Pharao war den Kindern feindlich; der Wildesel ist eifersüchtig auf das Junge der Tiere, und wenn sein Weibchen Buhlschaft treibt, forscht er nach und rächt sich.</p><p>5. Wer läßt die Heuschrecken sich mit einem Flügelschlag erheben und treibt sie in einem Antrieb fort und läßt sie in einem Augenblick los? Verhaßt sind sie bei allen Menschen, da sie die Nahrung allen Menschen rauben; ein Heer sind sie ohne Kopf und Wort [Befehl]; zu ihrer Nahrung [?] ist durch den Ort ihrer Geburt die Ähre bestimmt, indem sie bei der Ähre des Feldes aufwächst.</p><p>6. Blicke auf das Blatt, das herabfällt, und preise seinen Schöpfer, wie er es eingeteilt und wie er es angeordnet hat! Geh hin und betrachte an einem geringfügigen und wertlosen Dinge seine Fürsorge und verachte jene Geschwätzigkeit der Gelehrten, die da sagen, der Mensch sei ohne Plan in seiner Anlage, während doch die Toren selbst bezeugen müssen, daß er vor allen ausgezeichnet ist.</p><p>7. Wenn schon die Geschöpfe, die zu seinem Dienste erschaffen wurden, herrlich eingerichtet sind und schön sind in ihrer Anordnung, um wie viel erhabener mußte da der Mensch in seiner Anlage sein! Wie sehr ist doch unser Zeitalter verwirrt in seiner Weisheit, daß es die Geschöpfe für wohlgeordnet, die Menschen aber für ungeordnet hält und den Besitz höher einschätzt als den Besitzer!</p><p>8. Eins von beiden muß man ihnen vorwerfen: Wenn Gott gerecht und gut ist, dann sei es ferne [anzunehmen], daß er aus Neid die Menschen planlos gebildet hat. Wenn sie nun in ihrem Wahnsinn ihm in allen Dingen Schimpf antun, so sagen sie damit, daß er nicht gerecht sei: das sei ferne von uns und ihm! Siehe, die Sache der Wahnwitzigen wird in beiden Fällen hinfällig.</p><p>9. Wenn sie nun von dem Gerechten behaupten, daß er nicht gerecht ist, so loben die Toren ihn durch ihre Lästerung, ohne daß sie es merken, denn warum erträgt der Gerechte in seiner Güte sie schweigend und verbirgt seine Gerechtigkeit? Doch nur, damit sie beschämt werden; sie sollen sehen, daß eben jene Güte, von der sie wähnen, daß sie nicht in ihm sei, sich doch in ihm findet, da er sie so langmütig erträgt.</p><p>10. Wenn er ihre Lästerungen auch nur schweigend ertrüge, so wäre dies schon wunderbar, daß er trotz seiner Gerechtigkeit sie nicht beachtet; wenn er aber sogar seine Schätze öffnet und seine Reichtümer über sie ausschüttet, wer sollte da nicht über all dieses erstaunen, daß er, der trotz seiner Gerechtigkeit beleidigt und trotz seiner Güte beschimpft wird, sich noch herabläßt und sie wieder einlädt, das Leben in seinem Reiche zu gewinnen?</p><p>11. Als tot gelten für ihn freilich die Söhne des Irrtums, die keinen Lebensatem schöpfen aus seinen Gesetzen und nicht Heil aus beiden Testamenten saugen. Ihre Auslegung bezeugt ihren Tod, denn sie leugnen ihre Auferstehung und berauben ihren Leib und schneiden sich selbst die Hoffnung ab, da sie ihren Schöpfer verlassen haben.</p><h2>16</h2><p>Nach der Melodie: Wer wollte es wagen?</p><p>1. Sehet die Bilder im Spiegel, ohne daß er durch die Bilder zerbrochen wird noch zerbrochen werden kann.</p><p>2. Sehet die [göttliche] Wesenheit, der von den Geschöpfen weder Zwang angetan wird noch angetan werden kann.</p><p>3. Mögen wir auch Bilder aus den geschaffenen Dingen anführen, nie vermögen wir, sie [die Gottheit] vor unsern Augen abzubilden.</p><p>4. Sie trägt alles, ohne müde zu werden; mag sie auch noch so voll sein, sie ist doch wie leer; o, welch großes Wunder!</p><p>5. Sie ist ganz erfüllt mit Wesenheit, und es ist in ihr Raum [für alles]; wer vermag alles, was in ihr ist, zu erschöpfen?</p><p>6. Wie gleicht ihr der Geist [der Verstand], in dem, obgleich er nicht leer ist, doch Raum für alle Weisheit ist!</p><p>7. Es möge der Mund seine Unzulänglichkeit bekennen, ohne sich seiner Ohnmacht zu schämen, die von ihr [der Gottheit] übertroffen ist!</p><p>8. Überhaupt wird ja alles durch den Einen umfaßt, und ihm gebührt schließlich unaussprechliches Schweigen.</p><p>9. Zusammen mit dem einen Wesen ist kein anderes, denn wie könnte ein Wesen in seinesgleichen wohnen, ohne daß es sein Erzeugnis ist?</p><p>10. Eine große Verwirrung wäre es, wenn mehrere Wesen ineinander wohnten; das wäre Verwirrung und Lästerung.</p><p>11. Und wenn es einen Raum gibt, in dem sie wohnen, so ist der Raum größer als die Wesenheit, weil er diese umfaßt.</p><p>12. Klar ist dies: wenn ein Wesen in einem Wesen wohnt, so ist es entweder sein Sohn oder sein Gebilde.</p><p>13. Wenn aber jedes Wesen von jeher in seinem Räume wohnt, so entsteht eine große Untersuchung und Frage:</p><p>14. Hat der Zwang sie begrenzt [in einem Räume eingeschlossen] oder ist von Natur aus jene Anordnung, damit sie nicht in Unordnung geraten?</p><p>15. Schwach war [freilich] jene Macht, die sie [so] geordnet; denn siehe, sie sind durcheinander geraten; wenn es von Natur so wäre, wer hätte ihr widerstehen können?</p><p>16. Wenn es aber vom Zwange ausgeht, daß sie [ineinander] wohnen, so hat dieser nachgelassen, und wenn es von Natur ist, so hat sie sich geändert.</p><p>17. Gefühllose Wesen können nämlich nicht vermengt werden, wenn nicht ein anderer ist, der sie verwirrt.</p><p>18. Wenn es aber die Natur war, die sie von jeher verwirrte, so wäre der Anfang [Anstoß zu] ihrer Verwirrung nicht erst neuerdings erfolgt.</p><p>19. Hat etwa der Wille jenes Höchsten sich heimlich eingeschlichen und sie durch die Finsternis verwirrt?</p><p>20. Wenn aber die Finsternis eine ruhige Natur ist, wer hat sie denn in Aufruhr versetzt? Und wenn sie aufrührerisch ist, wer hat sie [bis dahin] in Schranken gehalten?</p><p>21. Jene Macht nämlich, die sie von jeher in Schranken hielt, ist viel bekannter als jene, die sie später freiließ.</p><p>22. Wenn aber die Wesen [Itjê] Freiheit hatten, wodurch sie verwirrt werden konnten, so gibt es keine Freiheit ohne Denkvermögen.</p><p>23. Wenn die Wesen Freiheit und auch Verstand besaßen, so brauchten sie keinen Schöpfer. —</p><p>24. Zuschanden gemacht sind also jene Lehren, die dies zusammendichteten, weil sie den Trug gern hatten und die Lüge liebten und die Wahrheit haßten.</p><p>25. Die Wahrheit ist gewöhnt [liebt es], durch Schwache zum Siege zu gelangen: Preis sei der Wahrheit, die durch mich triumphierte!</p><p>26. Preis sei dem Vater, der alles vermag! Lob dem Sohne, der in seinem Schoße wohnt und alles hält!</p><h2>17</h2><p>Nach der Melodie: O meine Brüder und Verwandten!</p><p>1. Meine Brüder, Väter und Söhne, hört auf meine Lehre! Sehet, die Stimme der Wahrheit predigt in der Kirche, und aus allen Büchern [der Bibel] ruft sie uns zu, um uns zu belehren, daß nur ein einziges [ewiges] Wesen ist, und daß ohne Makel die Farbe der Nacht ist, und daß sie nicht eine Verwandte des Übels ist. Betrachtet sie, ihr Einsichtigen, daß sie nicht einer Natur sind, daß das Übel vom Willen kommt, die Nacht nach der Anordnung sich aber über alle ausbreitet.</p><p>2. „Die Finsternis und der Böse sollen nämlich derselben Natur sein, der Körper und die Schlange derselben Natur angehören“.“ Wieviel böse Wesen sind wohl in jenem bösen Wesen? Der Körper, der getauft ist, bekennt seinen Glauben; das Gift der Schlange ist offenbar, und das des Bösen ist versteckt. Satan ist verborgen, die Farbe der Nacht aber sichtbar; der Böse ist gesprächig, die Finsternis aber stumm; ohne Begierde ist die Nacht; dieselbe Natur und doch nicht ähnlich, dieselbe Wurzel und doch nicht gleich, ein Wesen und doch geteilt?</p><p>3. Und wenn der Wille des Schöpfers ihre Natur nicht gleichmachte, so unterwarf er also durch seinen Willen ihre Natur jeglicher Verschiedenheit. Siehe, er verhängte das Übel über die Arten jeder Form, über die zierliche Taube, über die beißende Schlange, über das reine Lamm, über die abscheuliche Otter; wenn die Wurzel [der Ursprung] aller Körper die Finsternis wäre, würden die Früchte es verkünden; es bezeugen aber die Körper laut, daß sie nicht von derselben Natur sind.</p><p>4. „Der Körper soll nämlich etwas von der Seele [völlig] Getrenntes [Verschiedenes] sein, da eine tote Natur nicht mit einem andern Lebewesen leben könne.“ – Satan zeigt ihnen, wie er lebt, und die Dämonen, die den Tod überwanden. Es kann also auch der Körper mit dem Leben der Seele fortdauern am Ende. Und wenn der Satan Tausende von Jahren existiert und nicht stirbt, um wieviel mehr müssen die Körper, die gerechtfertigt sind, in der Endzeit ein Leben ohne Ende erhalten!</p><p>5. Der Körper preist dich, Herr, daß du ihn zu deiner Wohnung geschaffen hast; die Seele betet dich an, daß du sie durch deine Ankunft erkauft hast. Leib und Seele zugleich loben dich, daß sie in dir getauft sind und dich angezogen haben. Auch die Nacht preist dich, unsern Schöpfer, daß du sie geschaffen hast zur Erquickung alles Fleisches. Schlaf und Finsternis, schaue auf beide, denn von ihnen sind abhängig die Körper, die Körper von den Seelen, und die Seelen von deiner Liebe!</p><p>6. Einfältige nennt uns jene Partei, die in ihrer Einfalt sich vergeht wie Toren und sich lächerlich macht, denn sie tadelt Gott heftig und merkt es nicht. Wenn nämlich das Übel und die Finsternis verwandt sind, so ist’s ja Gott, der die Nacht ausbreitet, und in ihr schliefen und schlafen die Gerechten; die Nacht benutzte auch unser Herr zum Schlafe, um zu zeigen, daß sie [Finsternis und Nacht] nicht unrein seien. Nur der ist unrein, der in seiner Freiheit sündigt.</p><p>7. Die Finsternis verfinsterte Ägypten, weil dieses den Glanz verfinstert hatte, mit dem die Söhne Jakobs einzogen und es erleuchten wollten. Die Finsternis richtete die Zauberer. Wie kann ihr Verwandter sein Geschlecht hassen und wiederum ihren [der Zauberer] Hassern helfen und seine Pfeile auf seine Freunde abschießen? Als der Böse mit seinen Zaubereien gegen Moses kämpfte, machte drei Tage lang die Finsternis den Bösen zuschanden, dem Moses aber gab sie die Siegeskrone.</p><p>8. Die Finsternis schloß Ägypten ein, weil es den unschuldigen Joseph, der verleumdet worden war, ins Gefängnis geworfen hatte. Dichte Finsternis ward ihnen zum Bedränger; denn nicht [bloße] Nacht war jene wahre, dichte Finsternis, und durch ihre schweren Flügel wurden sie gequält; wenn sie sich bekehrten, ließ sie ein wenig von ihrer wahren Gewalt ab und zerriß ihre dichte Hülle und zeigte den Suchenden den geraden Weg zu Moses.</p><p>9. Diese Bekehrung entstand ihretwegen. O der Finsternis, die die Finsternis bedrohte! Sie offenbarte jene verborgene, sie machte den verfinsterten Pharao zuschanden und ließ ihn verstummen; die sichtbare Finsternis erleuchtete ihn. Beim Licht war sein Herz verfinstert und prüfte nicht; am Tage war er widerspenstig, unterworfen aber wurde er durch die Nacht; finster war er, solange es hell war, erhellt wurde er durch die Finsternis, – Dinge, die einander zu widersprechen scheinen.</p><p>10. Der Böse verwirrt alles, ermüdet alles, bringt alles in Angst; die Nacht besänftigt alles, macht alles rasten, gibt allem Ruhe. Wenn sogar die Gerechten abfielen, sie fiel nie ab; sie sündigte nicht wie David, verleugnete nicht ihren Herrn wie Simeon, sie verfolgte nicht die Kirche wie der Apostel [Paulus]. Wie kann nun wohl Satan ein Verwandter der Nacht sein? Denn er fiel ab und machte abfallen, und auch sein Name gibt Zeugnis von seinem Abfall.</p><h2>18</h2><p>Nach derselben Melodie.</p><p>1. Wenn die Natur des Leibes und der Finsternis verabscheuenswert ist, wer kann da in der Nacht gerechtfertigt dastehen, wo das Fleisch und die Finsternis und der Satan, ihr Verwandter, zu drei, alles beherrschen? Wenn dann noch hinzukommt Wein und Begierde, wer kann dann [noch] die Natur des [Ur-] Wesens überwinden? Ein Wunder ist der Wille, der allein alle besiegt. Der Ansturm der Freiheit überwindet den Satan, den sie [die Manichäer] zum [Ur-] Wesen gemacht haben.</p><p>2. Damit sie aber vollständig widerlegt werden [führe ich folgendes an]: Wie schwach ist die Stimme des Gebetes von Kranken, und doch trifft sie ihn und vertreibt ihn; und die darniederliegen, werfen ihn, wenn sie beten, zu Boden mit ihrer Stimme. Siehe, die Darniederliegenden werfen ihn hin, die Lahmen kommen ihm im Lauf zuvor durch ihr Fasten, die Blinden singen Psalmen und Loblieder und blenden ihn, die Einarmigen werfen Pfeile des Gebets, und er wird ins Auge getroffen, die Kranken überwinden ihn, die Lahmen machen ihn müde, und die Darniederliegenden werfen ihn zu Boden.</p><p>3. Das Gift der Schlange tötet mit [Natur-] Notwendigkeit, und auch die Farbe der Nacht kommt notwendig [mit dem Umlauf der Himmelskugel]. Auch die Natur des Fiebers und des Schlafes ist Sache der Notwendigkeit, die Sünde aber die des Willens. Wenn sie [der Leib und das Böse] einer Natur wären, siehe, dann widerlegt sie sich selbst, daß sie nämlich nicht dieselbe ist. Der Leib schilt den bösen Geist und schnaubt wütend gegen seinen [angeblichen] Verwandten, die Seele aber liebt er; wie kommt es, daß er die [angeblich] fremde [Seele] liebt, seinen Verwandten aber haßt?</p><p>4. Vom Schöpfer [Gott] haben sie die Ursache abgeleitet: er könne in seiner Weisheit das Böse schön [gut] machen, wie z. B. die Nacht, die mit ihm [dem Bösen] verwandt sein soll, die schön ist und still, in der die Wachenden Siege erringen. Wenn nun ihre [des Bösen und der Nacht] Wurzel eine wäre, dann müßte der Schöpfer ihre Natur verändert haben, da uns ja die Nacht erquickt, der Satan uns aber bedrückt. Wenn aber dieses [diese spätere Veränderung] nicht vom Schöpfer stammt, dann hat also [von vornherein] die Nacht mit Satan nichts gemein.</p><p>5. Die Erde und den Leib, das Böse und die Nacht, wer kann sie vermengen und bei ihren Verschiedenheiten ihre Natur mit gleicher Wage wägen? Siehe, es riefen trotz ihres Schweigens die Erde mit all ihren Früchten, der Leib mit seinen herrlichen Sinnen und der Böse mit allen seinen mannigfaltigen Ränken, die Nacht mit ihren geordneten Momenten und Zeiten – [daß sie nicht gleicher Natur sind]. Hassenswert ist der vierte [der Satan], verflucht durch seinen eigenen Willen und zum Abscheu geworden durch seine Freiheit.</p><p>6. Die Finsternis soll uns ein Bild von Kain darstellen; betrachten wir es! Die Finsternis verbirgt bei den Werken ihre Schönheit [sie macht die Schönheit der Werke unkenntlich], Kain machte die Gerechten zum Vorwand ihrer Ermordung. Siehe, beide stellten wechselseitig ein Bild voneinander dar. Der Schoß der Nacht ist ein Schlupfwinkel und Versteck für Diebe; Tücken und Ränke sind verborgen im Herzen des Mörders. Kain [tat es] aus freiem Willen, die Nacht aber [handelt] gemäß ihrer Natur. Siehe, die Nacht täuscht durch ihre Farbe die Sehenden, Kain durch seine Zunge.</p><p>7. Das Licht soll uns ein Bild von Abel sein; betrachten wir es! Das Licht gibt den geschaffenen Dingen ihren Schmuck, und Abel verlieh den Opfern ihre Wohlgefälligkeit; eins strahlt das andere zurück. Nichts ist im Lichte, was nicht offenbar wäre, und nichts war an Abel, was nicht strahlte; und freundlich leuchtete dieses Licht auch den Hassern entgegen. Abel war heiter wie das Licht, der Mörder düster wie die Finsternis.</p><p>8. Warum ward die Finsternis zuerst geschaffen und warum erhielt sie den Vorrang und die Erstgeburt? Damit Kain mit seiner Erstgeburt vorgebildet werde. Und dann wurde das Licht geschaffen wie auch Abel; und das Licht, das später geschaffen war, war schön wie auch Abel, der nach ihm [Kain] geboren wurde. Kain und die Finsternis waren Erstgeborene und gingen voraus; Abel und die Leuchten kamen später und sollten ein Vorbild sein für die Welt und unsern Erlöser.</p><p>9. Die Zauberer, Magier und Beschwörer, die verflucht seien, machen die Geister und Schlangen sich durch ihre Beschwörungen Untertan. Der Böse ersann eine Waffe, die gegen ihn selbst [gerichtet] ist, damit er besiegt werde. Er stellte sich selbst bloß, da seine Ränke gegen ihn gerichtet sind, und er sah es nicht ein; zur Fesselung gab er seine Hände hin, und er wurde überführt; und als er uns fangen wollte, vermochte er es nicht, da wir ihn durchschauten, daß er ein [ewiges] Wesen nicht ist, denn siehe, sogar seine Anhänger unterwerfen ihn sich durch ihre Zaubereien.</p><p>10. Unterricht richtet den Löwen ab und lehrt ihn, und er fügt keinen Schaden mehr zu; Geschicklichkeit bändigt die Schlange, und sie tötet nicht; auch Adler und Habicht lassen sich abrichten und empören sich nicht. Jener Gute [Gott], von dem [die Ketzer] sprechen, ist nicht einmal den Sterblichen gleichwertig, da er den Bösen nicht lehrte und abrichtete. Oder sollte jener gut sein, der zusieht, wie der Böse wütet, und doch bei all seinen Weisheits- und Klugheitsmitteln ihn nicht abrichtet, daß er nicht mehr schadet?</p><p>11. Der Löwe und der Habicht und die Schlange, die [sonst] verachtet sind, sind zu [Prüfungs-] Öfen geworden für den Trug der Ungläubigen [Ketzer] und widerlegen ihn. Sagen sie, daß ihr [dieser Tiere] Geschlecht vom Bösen sei, wie kann Löwe und Habicht und Schlange abgerichtet werden und nicht mehr schaden? Die Wurzel, aus der sie sind, ist ja bitter [giftig], und Satan läßt niemals sich abrichten, nicht zu schaden. – Betet, o Söhne der Wahrheit, für jene, die den Irrtum verkünden, die bislang irren und irre führen!</p><h2>19</h2><p>Nach derselben Melodie.</p><p>1. Den Leib nennen die Irrlehrer verächtlichen Schmutz; der schmutzige Leib, siehe, selbst beweist er, wie rein er ist. Er ward ja zum guten Werkzeug für die Guten, und mit ihm wirkten sie alles Gute in der Welt. Siehe, wie rein der trübe Leib ist, und wie trübe [anderseits] der Satan, der doch ein Geist ist! Schmutzig sind die Teufel und Dämonen; die Apostel aber sind rein. Elias und der Satan – der mit Fleisch bekleidete, wie flog er, und der geistige, wie tief sank er!</p><p>2. Rein sind die Kälber und Schafe und die Hirsche in ihrer Art; der Tauben und Fische Natur ist schön und rein; des Obstes und der Früchte Geschmack ist rein und lieblich. Siehe, jeder Körper ist rein, häßlich sind die Teufel und Dämonen und ihr Fürst und die sogenannten Wächter der Unterwelt und die Engel, die herabstiegen und sich vermählten, wie sie wähnen. Siehe, wie rein sind die Körperlichen und wie häßlich die Geistigen und wie irrig ihre Lehren!</p><p>3. Warum also fliehen sie den Leib und verachten sie ihn? Denn siehe, wie häßlich ist der Böse, obwohl er ein Geist ist! Eins von beiden müssen sie tun; entweder alles Fleisch verachten und jede Art von Geisterwesen gern haben oder die körperlichen Wesen lieben und die Geisterwesen verachten, oder es gewinne jener [Gedanke] die Oberhand, der mit jeder [wahren] Lehre übereinstimmt, daß nämlich von den Körper- und Geisterwesen jenes befleckt ist, das mit freiem Willen gesündigt hat.</p><p>4. „Henoch und Elias sollen ihre Leiber ausgezogen und abgelegt haben; da sie nämlich in die Luft flogen, sei ihre Natur geläutert worden.“ Und auch über die Engel sprachen sie die Lästerung aus, „daß sie mit ihrem Leibe gesündigt hätten“. O über das törichte Gerede! Sie gaben den überirdischen Engeln einen Leib und nehmen den Leib dem Henoch und Elias. Sie entkleideten und bekleideten die Körper- und Geisterwesen, verwechselten aber in verkehrter Weise ihre Naturen. Was da ist, nahmen sie weg, und was nicht ist, behaupteten sie fälschlich.</p><p>5. Welch verkehrte Dinge vermögen sie doch vorzubringen! Wenn die Natur aller Dinge eine ist, wo ist dann aber die Übereinstimmung ihrer aller? Und wenn die Engel gezeugt haben, dann müßte es doch für die Dämonen jederzeit leicht sein, mit Weibern zu huren und zu zeugen. Beobachte aber, ob Dämonen und Weiber miteinander zeugen! Es widerlegen dies die Jungfrauen, die niemals ohne Mann Mütter geworden sind.</p><p>6. Maria allein ward ohne Mann Mutter, denn für Gott ist alles leicht möglich. Und wenn die Engel zeugten, so wäre es nichts Wunderbares mehr um die Jungfrau, die unsern Erlöser geboren hat. Satan wäre freilich zufrieden, wenn Jungfrauen von Dämonen schwanger werden und gebären könnten, um durch eine Jungfrau die Jungfrau Maria nachzuahmen. Sein Trug macht alles nach; durch die Jungfrau allein ward er besiegt, da er sie nicht nachahmen konnte.</p><p>7. „Götter“ nannte er die Abbilder, durch deren Trug er täuschte, und „Christusse“ die Verführer, durch deren Ruf er Verwirrung stiftete, und,.Baalspropheten“, durch deren Stimme er Irrtum ausstreute; an Stelle der Priester [setzte er] Pfaffen, und seine Apostel machte er den Aposteln ähnlich, und unter den Abtrünnigen baute er etwas Altarähnliches auf; siehe, auf den Vater, den Sohn und den Geist taufen sie, um ähnlich zu sein. Durch die Jungfrau aber wird sein Trug überwunden, denn er konnte die jungfräulich Gebärende nicht nachahmen.</p><p>8. Fern sei es also, daß die Überirdischen, die Söhne der Höhe, Laster begehen! Nicht weil sie etwa konnten, sie wollten vielmehr nicht, weil ihr Wille heilig und ihre Natur rein und gut ist. Auch nicht, weil sie Geisterwesen sind, denn ein Geist war Satan auch, und er wurde doch unrein, und die Dämonen und die Menschen reizen [Gott] zum Zorne. An diesen Drei hat er [Gott] seine Güte und seine Gerechtigkeit gezeigt: er läuterte die Oberen, er richtete die Mittleren und bestrafte die Unteren.</p><p>9. Für das Volk [der Juden] schmückten sich die Töchter Madians und machten es rasend [vor Sinnenlust], den Engeln aber erschienen sie trotz ihres Schmuckes wie Leichname; die Frauen Salomons waren ausschweifend und reizten ihn zur Lust, den Wächtern [Engeln] kamen sie abscheulich vor. Einzigartig war das Lamm des Urias; die Oberirdischen [Engel] ließen es unbeachtet und verblieben in ihrer Reinheit. In den Tagen einer Esther gab es erlesene Frauen, aber sie [die Engel] verachteten sie. Wenn die Engel [damals] gesündigt hätten, würden sie in jedem Zeitalter sündigen; daß sie nicht gesündigt haben, ist offenkundig.</p><p>10. Der Sterbliche zeugt, um sein Geschlecht fortzupflanzen, damit es nicht untergehe. Wenn aber ein Engel sinnliche Begierden gehabt hätte, so hätte ihn der Schöpfer zur Sünde verführt, denn ohne Zweifel hätte er ihm die Regung der Lust eingepflanzt. – Fern sei es [anzunehmen], daß der Schöpfer des Alls für alle Bebauer Ackerfelder geschaffen habe; für die Bebauer in der Höhe aber habe er [in diesem Falle] keine geschaffen. Und wie hätte er sie dann beschuldigen können, daß sie herabgestiegen seien und Samen auf unsere Erde gesät hätten? Siehe, ihre Natur ist rein, ihre Zahl vollkommen und ihre Heiligkeit hellstrahlend.</p><h2>20</h2><p>Nach derselben Melodie.</p><p>1. „Es sah aber Gott alles, was er gemacht hatte, und siehe, es war gut.“ Er lobte die Naturen, daß ihre Schönheit herrlich und glänzend sei; nur betreffs Adams steht geschrieben, daß es ihn [Gott] reute; obwohl er schöner war als die Kriechtiere und die wilden Tiere, die keinen Verstand haben, fiel Adam doch in Sünde und unterlag. – Es reute ihn [Gott] nicht am Löwen seine Wildheit, denn sie gehört zu seiner Natur; es reute ihn auch nicht, dass er die Schlange, die ihn zur Sünde verführte, gemacht hatte, denn er wußte, daß sie nur ein Instrument war.</p><p>2. Alles, was sich Gott nennt und mit diesem Namen bezeichnet wird, bereitet sich zum Angriff gegen Adam vor. – Siehe, auch der Fremde rief laut, daß er aus Liebe zu ihm die Lämmer und Tauben verlassen habe, denn der Gepriesene empfand keine Reue ihretwegen. Den Adam wählte er aus, damit man erkenne, daß er ein vollkommenes Gefäß für seinen Dienst sei, denn der Fremde lehrt uns durch unsere Sinne, er belebt uns durch unsere Schätze, unser Lebensunterhalt kommt von dem Unsrigen.</p><p>3. Preis sei dem Schöpfer, daß er aus Weisheit es sich reuen ließ! Er tadelte sein Werk aus Klugheit, damit jene beschämt würden, die Götter predigen, die erhabener sein sollen als er. Sie hörten das Wort „Reue“ und spotteten und merkten nicht, daß sie ihn lästerten. Der Fremde möge nun seine Vollkommenheit zeigen! Sehen wir zu, ob er uns veränderte Glieder gegeben hat. Sinne und Glieder hat er geheilt, aber nicht verändert, damit ihr Schöpfer geehrt werde.</p><p>4. Und gleichwie er den Körper geheilt und seiner Natur [ursprünglichen Verfassung] zurückgegeben, seine ursprüngliche Schönheit zurückgefordert und wiedererstattet und ihn [aufs neue] geschmückt hat, so hat er auch der Seele die Gesundheit wiedergegeben, die sie verloren hatte. Siehe, es bezeugen dies die Leiber. Wenn er aber das Gebot änderte und ihr [der Seele] neues Leben gab wie ein Arzt, der die Arzneien ändert, so sind seine Arzneien der Schöpfung nicht fremd. Wie ein Arzt alle Mittel zur Heilung anwendet, so benützt Gott alle Gelegenheit, um Leben zu spenden.</p><p>5. Es wurden die Irrlehren getäuscht durch das Wort: "Es reute ihn“. Das Wort ist [an sich] gesund, für die Kranken aber bitter, und sie entstellten es, während es uns über den Adam belehrt, wie groß er war. Er wählte dieses [Wort], um uns zu überzeugen, daß er [der Mensch] nicht ein Gefäß sei, dessen Werkmeister schwach war, denn es gibt keinen anderen Werkmeister, der ihn änderte. Stumm sind die übrigen Geschöpfe. Adam aber ist von Natur aus mit Sprache begabt. Umgrenzt sind die Meere, festgegründet sind die Berge, der Mensch aber ist [ihr] Gebieter.</p><p>6. Verkehrt also fassen sie das Wort auf. Es ist auch heute noch gebräuchlich und geläufig, daß die Menschen murren, daß er [Gott] einen solchen hoch erhob, der unverständig war. Dafür soll [nach ihrer Ansicht] auch Saul ein Zeuge sein, den zum König gemacht zu haben, Gott bereute; er verlieh ihm die königliche Würde, jener aber wurde lasterhaft; verborgen war es bei Adam, offenkundig bei Saul. Um die Lästerer zu widerlegen, stellte er [Gott] unter der Königswürde die Freiheit, die Herrin über alles, dar.</p><p>7. „Söhne zog er auf und erhöhte sie “, sie wurden aber verdorben und lasterhaft. Wen sollen nun die Zuhörer tadeln? Gott, der Ehren verliehen hat, oder jene, die ihn beschimpft haben? Die Toren tadelten ihn; er hinwieder bestrafte sie, damit sie wieder auf den rechten Weg kämen, aber sie tadelten ihn wiederum. Wie furchtbar! Denn die Lästerung ist groß. Betrachtet diesen Streit, der ohne Furcht und ohne Liebe geführt wird! Es gibt keine andere Möglichkeit mehr, daß die Menschen das Leben [wieder] erlangen [oder: daß er sich der Menschen erbarme].</p><p>8. Es möge ein Schiedsrichter erstehen für den Meinungsstreit, und es möge untersucht werden, in welcher Hinsicht ihre [der Menschen] Natur schwach und mangelhaft ist. Wenn ihre Natur mangelhaft ist, ist dann die Schlange vollkommen? Ihr Schöpfer aber ist ja einer. Wer nannte die Namen in seiner Weisheit? Und wer machte Henoch vollkommen, daß er nicht starb? Und wenn unsere Menschheit von Natur aus unvollkommen [geschaffen] ist, dann verschloß der Gute seine Tür und der Gerechte sein Paradies, nur die Tür des Bösen steht offen.</p><h2>21</h2><p>Nach derselben Melodie.</p><p>1. Warum hat er den Leib, der vom Bösen sein soll, in der Arche gerettet? – Sie sahen, daß die großen Tiere [Drachen?] am Leben geblieben sind und erdachten die schlaue Ausrede: „Damit dieses Böse, das verstreut ist, gesammelt würde in seinen Gefäßen; nachdem er es gesammelt hatte, gab er ihm einen festen Wohnsitz; sobald die Schlange getötet würde, würde es ausgestreut, wenn sie lebt, gießt sie es [das Böse] in alles aus.“ O, dieser Grübler, der nicht auf das Wort achtete: „Was immer von der Erde ist, kehrt zur Erde zurück und wird wieder von ihr aufgenommen.“</p><p>2. In der Arche hat Gott ein Bild der Schöpfung gezeichnet, um diese zu belehren, denn in ihr änderten alle Gattungen ihre Natur. Siehe, jedes Wesen dort verkündet uns, daß es nichts von Natur aus Böses gibt. Sie sollen mir also das Böse zeigen, da es ja keine Möglichkeit gibt, daß es seine Natur ändern könnte. Auf die Natur und den freien Willen schauet, ob sie sich bei jenen veränderten! Siehe, jene Parteien sind besiegt, und unsere Partei wird in kurzem den Sieg davontragen.</p><p>3. Wenn jemand bezüglich der Dämonen sagt, daß sie nicht in der Arche waren und ihre Natur nicht verändert werden könne, so mögen ihn der Panther, die Schlange und der Wolf belehren, die gebändigt werden können; denn wenn stumme, wilde, unvernünftige Wesen sich änderten, so schrien auch die Dämonen unserem Herrn zu: "Du bist Gott!“ Und wenn das Böse Eigentümlichkeit der Dämonen ist, so sind die Grübler besiegt, denn alle Bosheit der Menschen und der Tiere kommt dem Bösen nicht gleich.</p><p>4. "Der Gute habe aber nicht durch Zwang das Böse gebändigt“. Siehe nun, in der Arche hat er die Naturen aller gebändigt, und das Böse, das in ihnen war, mit Zwang unterworfen; nicht daß sie böse seien, sondern das Böse auszuziehen, das in ihnen war, wurden sie gezwungen. Aus einem Teile erkenne das Ganze! Die Fische ließ er ans Land ziehen, die Schweine ließ er im Wasser zugrunde gehen. Seine Gewalt erregte Bestürzung vor jenem „Guten, der es nicht zwingt“. Er zwang es doch und machte jenes böse Wesen besser und schützte alle vor allem.</p><p>5. Besitzt das Wesen der Finsternis vielleicht Willensfreiheit und tat er [Gott] ihm deshalb keinen Zwang an, es zu bessern, wie er auch die abscheulichsten Sünder nicht zwingt, sich zu bessern? Dann sollte es nicht „böse“ genannt werden, da es seiner Natur nach frei ist; siehe, die [heiligen] Schriften bezeugen seine Freiheit und das Feuer, das er den Sündern als ihr Anteil bereitet hat! Denn es wäre ein Unrecht, wenn die Natur mit dem Willen verurteilt würde und das Wesen mit der Freiheit.</p><p>6. Zeugnis gibt auch die Schlange bei Adam, die lahm gemacht wurde auf [dem Bauche kriechen musste], und das Vieh, das gesteinigt wurde, weil der Unkeusche es befleckte; der Unsichtbare und der Sichtbare waren Ursache ihres Todes, der Mann und der Satan; ohne den Bösen war ja die Schlange gesund und das Vieh ohne den Mann unbefleckt; der Mensch und der Satan übten Mißbrauch, der Freien wegen strafte er auch die Tiere, um Wachsamkeit zu lehren.</p><p>7. Zeugnis gibt auch das gegossene Kalb der Hebräer, das aus reinem und in den Augen des Schöpfers schönem Golde war; Moses zerschlug es aber wegen der Unreinen, die sich befleckten. So können auch Brot und Wein zu tödlichem Gift werden; [Götzen-] Opfer machen reine Dinge unrein, und Zaubereien beflecken. Die Ursache all des Bösen ist offenkundig die Freiheit; Adam und Satan haben durch ihre Freiheit die Bosheit des Willens eingeführt.</p><p>8. Das Kriechtier und das Vieh lehren uns, daß sie nicht unrein sind, denn die Schlange hat das Volk geheilt und ihm geholfen. Durch die Eselin beschämte Gott den Bileam und wies ihn zurecht. Der Mensch und der Teufel machten beide zu Werkzeugen [Gefäße] ihres Mißbrauches, und sie wurden unrein; der Gute aber hat sie durch seinen Gebrauch [wieder] gereinigt, und sie wurden geschmückt. Er sah, daß die Freien die Natur befleckt hatten, und er ließ sich herab und reinigte sie durch seine Erbarmungen.</p><p>9. Zeugnis gibt ferner der Stab in der Hand des Moses, der, auf den Boden geworfen, die Schlange verschlang, damit er die Behauptung der verächtlichen Irrlehre widerlegte, [indem er zeigte,] wie sehr sie lästerte, denn rein ist die Natur der Schlange. Satan würde nämlich den Satan nicht vertrieben haben, noch hätte sich der Stab des Gerechten zu etwas Unreinem gewandelt. Machte er etwa die Schlange, die vom Bösen ist, zum Götzenbild, das er im hl. Zelt aufstellte, damit jeder das Leben gewänne, der sie anblickte?</p><p>10. Hören mögen die beiden Parteien mit Liebe ohne Neid: die Anhänger des Bardaisan, die dem Moses Glauben schenken: „Wie Moses die Schlange in der Wüste erhöht hat …“ Hat etwa unser Erlöser sich selbst mit Satan verglichen? Auch Markion soll hören: Wie konnte der Gerechte, der doch den Satan haßt und seine Bilder und Zeichen, das Bild der Schlange, das ein Bild unsers Herrn ist, höher schätzen als das des Moses?</p><p>11. In diesem einen Falle steht es wiederum, ohne Eifersucht, bei den Juden [uns zu belehren]. Wie konnte wohl Gott, der in der Wüste [das Gesetz] aufschrieb und [den Juden] die Warnung erteilte, „du sollst dir kein Bild und kein Abbild machen, damit du nicht stirbst“, die eherne Schlange anfertigen lassen, dass der Mensch auf sie wie auf Gott schaue und geheilt werde? Wenn es noch das Bild von Engeln und Seraphim [gewesen wäre]! Allein, es war ein Bild des Verfluchten, des Mörders der Menschheit! Belehre uns [o Jude,] ohne Zank! Hören sollen sie es und preisen den Arzt, der sich in seiner Liebe müde machte.</p><p>12. Wer sollte nicht weinen? Denn siehe, sie irren mit ihrem Fasten. Wer sollte nicht beten? Denn siehe, sie sind auf Abwegen mit ihrem Nachtwachen. Wer sollte nicht flehen? Denn siehe, sie leiden Schaden bei ihren Mühen. Ihr Wille sollte beten, denn sie wollen ja nicht zugrunde gehen. Unser Herr möge auf euere Liebe schauen, Brüder! Kommt in seine Kirche, preiset ihn, der euch ertragen hat! Ihr lästert, und er duldete euch; ihr tatet ihm Unrecht, und er ernährte euch; ihr wäret streitsüchtig, und er versöhnte euch.</p><p>13. Preiset mit uns unsern Gott in seiner großen Güte! Es soll ihn preisen der Ungläubige, der lästerte, und doch sättigte er ihn. Es preise ihn der Beleidiger, der ihn schmähte, und doch ernährte er ihn. Denn gegen alle ist er in allem gut, und er läßt seine Sonne aufgehen über jene, die ihn [mit Götzen] vertauschten; er sendet seinen Regen herab auf jene, die ihn beschimpften. Alle sucht er durch alles zu gewinnen, damit sie sich bekehren und er sich darüber freuen kann. Wen haben wir, der dir gleich wäre? Niemanden! Und wenn etwa einer es sein wollte, es wäre doch, als wäre er nicht.</p><p>14. Bei wem soll ich schwören, o ihr Irrenden, damit ihr erkennt, daß ich mit Liebe und Schmerz an eurer Angelegenheit arbeite? Wenn wir Kinder sehen, die im Feuer verbrennen, so rührt uns ihr Anblick zu Tränen; und wenn Mörder, von denen bekannt ist, wie sehr sie gefrevelt haben, hingerichtet werden, so empfindet man doch Mitleid; um wieviel mehr über Unschuldige, die beraubt wurden, ohne daß sie es merkten! Wer wird nicht über die guten Kinder Adams weinen, die ihm [nun] an Verfehlungen gleichen?</p><h2>22</h2><p>Nach der Melodie: Ermordet wurden die Kinder.</p><p>1. Gleichwie der Körper des Alphabets vollkommen ist in seinen Gliedern und kein Buchstabe sich wegnehmen oder ein anderer hinzufügen läßt, ebenso ist auch die Wahrheit, welche im heiligen Evangelium mit den Buchstaben des Alphabets niedergeschrieben ist, ein vollkommenes Maß, das kein Mehr oder Weniger annimmt.</p><p>Kehrvers: Gepriesen sei dein Bild im Alphabet!</p><p>2. Weil Markion Betrug hinzufügte, verwarf und schloß ihn die Kirche aus. Weil Valentinos abwich, erregte auch der Qûqite weitere Unruhen. Bardaisan schmückte seine falsche Lehre aus; Mani war in allen Dingen rasend, ein Bündel von Dornen und Unkraut! Möge der Gute in seiner Erbarmung sie vom Irrwege zu seiner Herde zurückführen!</p><p>Gepriesen sei, der auch für den Bösen besorgt ist!</p><p>3. Eine Herde stahl sich Valentinos von der Kirche und nannte sie nach seinem Namen; nach seinem eigenen Namen nannte sie der Qûqite. Es stahl sich eine der listige Bardaisan, und sie [diese Irrlehrer] machten gleichsam eine gemeinschaftliche Herde daraus. Markion sonderte seine Schafe ab, da fiel Mani darüber her und raubte von ihm; ein Toller biß den andern. Sie nannten ihre Herde nach ihrem eigenen Namen.</p><p>Gepriesen sei, der sie aus seinem Hause warf!</p><p>4. Da irrten ferner die Arianer und die Aëtianer, die sich auf Spitzfindigkeiten einließen, die Paulinianer, die ganz verkehrt handelten, die Sabellianer, die listig vorgingen, die Photinianer, die betrügerisch zu Werke gingen, die Borborianer, die sich beschmutzten, die Katharer, die sich für rein hielten, die Audianer, die gefallen sind, die Messalianer, die sich schamlos benahmen.</p><p>Möge der Gute sie und seine Hürde zurückführen!</p><p>5. Siehe, es ziehen sich ihre Hände von jedem zurück, es bleibt keine Handhabe, womit man anfassen könnte. Sie wiederum nennen uns Palutianer, und das weisen wir zurück [speien wir aus] und verwerfen wir; Fluch über jenen, der nach dem Namen des Palût sich nennen läßt und nicht nach dem Namen Christi! Der Prüfungsofen des Fluches [Anathems] hat sie bloßgestellt, die [ihren Irrtum] nicht verfluchen wollen.</p><p>Gepriesen sei, durch dessen Anathem sie bloßgestellt wurden!</p><p>6. Auch Palût würde nicht wollen, daß nach seinem Namen Leute sich nennen; und wenn er noch lebte, würde er über alle Widerspenstigen deshalb den Fluch aussprechen, weil er ein Schüler des Apostels war, der mit Schmerz und Bitterkeit erfüllt war über die Korinther, weil sie den Namen Christi aufgegeben und sich nach den Namen von Menschen nannten.</p><p>Gepriesen sei, der die wahren [Christen] zu eigen hat!</p><p>7. Und die Schüler des Lehrers, der nichts Falsches und Häßliches zu der Lehre Christi hinzufügt, nennen sich Christen. Wenn er aber ein wenig Falsches hinzufügt, verliert er den Namen Christi, und nach seinem, eines Unkrauts, Namen werden seine Schüler benannt, denn Lüge und Wahrheit vertragen sich nicht.</p><p>Gepriesen sei, der uns in seiner Wahrheit befestigt hat!</p><p>8. Eben ist der Weg für die Einfältigen; dieser [Weg] ist der Glaube, der eine Reihe von Herbergen und Meilensteine errichtete, von einem Paradiese zum andern; denn durch Adam geschah die Vertreibung und durch den Räuber die Rückkehr. Aber Grübeleien, Abwegen gleich, brachten jene, die forschten, von der Ebene in eine unwegsame Gegend.</p><p>Gepriesen sei, der die Getreuen bewahrt!</p><p>9. Sehet, Brüder, wie das Bild des Königs auf jeder Münze aufgeprägt ist, und auch sein größter Feldherr darf keinen Obolus mit seinem Bilde prägen lassen. Und wenn er das Bild des Königs darauf prägt [als Falschmünzer], und zwar verstohlenerweise prägt, so wird er entweder verbrannt oder enthauptet. Wie vermessen ist also der, der sein eigenes Bild, anstatt das unseres Herrn aufprägt!</p><p>Gepriesen sei, der mit seinem Namen uns bezeichnete!</p><p>10. Gar verächtlich ist das Gold für unsern König, der auch auf Silber sein Bild nicht prägt; der Mensch ist es, der erhaben ist über alles, dem unser Erlöser seine Schönheit aufprägt. Wer an den Namen Gottes glaubt, der empfängt das Siegel Gottes; wenn er aber nach einem Menschen benannt wird, so hat er ein menschliches Siegel empfangen, das verächtlich ist gegenüber dem lebendigen Namen.</p><p>Gepriesen sei, der durch seinen Namen uns auserwählte!</p><p>11. Judas wurde, obwohl er ein Dieb war, doch Jünger genannt; und sogar, als er zum Anführer der „Linken“ wurde, nannte ihn unser Herr „Freund“ und zeigte so, daß er, wenn er auch ein sündiger Jünger war, doch solange er keine Spaltung verschuldete, noch Jünger war; wenn er aber eine eigene Partei aufstellt und Trennung verursacht, wird er ein Freund der Gegenpartei; und siehe, sein Vorbild wird durch „Iskariote“ ausgedrückt.</p><p>Lob sei dir von meiner Armseligkeit!</p><p>12. Es steht geschrieben: „Wer von den Königen auszieht, um Krieg zu führen mit einem anderen König, seinen Genossen…” Genossen nennt er sie, nicht weil sie gleichen Sinnes sind, sondern weil sie gleich sind in dem Namen der königlichen Würde. Vor solchem [Verhältnis, gleichgenannt und doch Gegner zu sein], bebte der Eifrige [der Apostel Paulus] zurück und erlaubte den Korinthern nicht, nach dem Namen eines Menschen genannt zu werden.</p><p>Wehe ruft der König über die Abtrünnigen.</p><p>13. Die Lüge hat sich in die Wahrheit gehüllt, um mit geborgtem Namen zu täuschen; und wenn der Glaubensverleugner bekennt, so muß er als einer mit Schafskleidern Verhüllter betrachtet werden [?]. Judas verriet unsern Erlöser und nannte ihn dabei: „Rabbi“, er wurde aber durch seine Rotten bloßgestellt, wie auch Mani durch seine Handlungen, da er sich in seinen Jüngern einen Anhang geschaffen hatte!</p><p>14. Christus nannte er sich fälschlich, den Geist der Lüge hauchte er in seinen Propheten aus, und er brach seinen Leib für seine Jünger und verteilte die Erde unter seine Verkünder mit dem Namen „unser Herr“ gegen unsern Herrn, und indem er vorgab, dass er keinen Trug anwende, nannte er sich selbst offen vor vielen den Gesandten [Apostel], den Parakleten, der erst gestern aufstand.</p><p>Gepriesen sei, der ihn stellte und ihn dann fing!</p><p>15. Wir müssen jedoch wissen, daß dieses noch gering erschien für den, der sich erfrechte und sich nichts daraus machte, zur Lästerung seinen Mund zu öffnen und zur Lüge seine Zunge zu schärfen, daß auch die Seele, die in einem Hunde ist, von der Natur der Gottheit sei. So war es auch nicht schwer für ihn, wenn er sich selbst zum Gotte machte, daß er Gott [sogar] in einem Hunde wohnen ließ!</p><p>Gepriesen sei der Gerechte, der darüber nicht in Zorn entbrannte!</p><p>16. Alle Empörer [Irrlehrer] geben Zeugnis, daß ein Joch auf ihm lastet, und wenn ein Geist in ihnen weht, so ist es ein Irrtum, der aus ihnen spricht. Sie werfen in ihren Schriften Lehren hin, die verdammt sind, [die der Apostel schon im voraus aus der Kirche ausgeschlossen hat]. Wer wäre auch imstande, Brüder, ihren Unrat aus ihren Büchern auszuschöpfen?</p><p>Reinige du sie, Barmherziger!</p><p>17. Nun sollen sie über ihre [Lebens-] Zeiten befragt werden, welcher von ihnen älter ist als der andere. Wenn auch Mani die Erstgeburt an sich reißen möchte, so ist doch Bardaisan älter; und wenn Bardaisan der älteste sein will, so ist er doch noch jünger der Zeit nach als seine Vorgänger. Markion ist der erste Dorn, der Erstgeborene des Sündengestrüppes, des Unkrauts, das zuerst aufsproßte.</p><p>Der Gerechte möge seine Pflanzung zertreten!</p><p>18. Deutlich sollen sie [ferner] befragt werden, von wem sie die Handauflegung empfangen haben; wenn sie sie von uns empfangen haben und dann abgefallen sind, so genügt das für Beweisführung; wenn sie sich aber erfrechten, die Priesterwürde sich anzumaßen, so ist das hinreichend, sie zu überführen, da dies zu ihrer Beschämung gereicht, weil [auf diese Art] jeder ein Priester ist, wenn er selbst seine Hand auf sein Haupt legen will.</p><p>Eine Verwirrung, die die Hoffnung abschneidet!</p><p>19. Der Höchste ließ sich auf dem Sinai herab und legte Moses seine Hand auf, und Moses legte sie dem Aaron auf, und sie [die Handauflegung] wurde fortgepflanzt bis auf Johannes. Deswegen sagte unser Herr zu diesem: „Gerechtigkeit erfordert es, daß ich von dir getauft werde “; damit die Weihe [der „Ordo“] nicht untergehe, übergab sie unser Herr den Aposteln, und siehe, in unserer Kirche ist ihre Fortpflanzung.</p><p>Gepriesen sei, der uns die Weihe übergeben!</p><p>20. Die Stimme des Herrn schloß sie ein [machte die Ketzer zu Gefangenen]; siehe, aufgehoben wurden die Zelte der Aëtianer, der Arianer, Sabellianer, Katharer, Photinianer und Audianer, die zwar von unserer Kirche die Handauflegung empfangen, aber auch von sich aus Hand an den Glauben gelegt haben, der niedergeschrieben worden war in jener herrlichen Synode.</p><p>Gedacht werde des Königs, der sie [die Bischöfe] berief!</p><p>21. Oberhäupter wurden [aufgestellt] in den Kirchen [der Häretiker], Priester und Diakonen gibt es; andere sind Schriftgelehrte und Lektoren, und es gibt aus ihr auch solche, die dem „Bunde“ angehören. Von der Kirche stahlen sie die verschiedenen Arten der Riten des Gottesdienstes, das Priesteramt zu verwalten, zu taufen, [das Brot] zu brechen und zu lehren, daß der Herr gekommen ist und wieder kommt.</p><p>Gepriesen sei, der alles in der Wahrheit eingeschlossen!</p><p>22. Sie stifteten Zwietracht und kamen auf Abwege, weil sie auch tödliches Gift in ihre Lehren mischten; auf Grübelei und eitles Forschen verlegten sich manche, manche mischten [falsche] Offenbarungen bei, wieder andere Apostelgeschichten; manche mischten Chaldäismus [Astrologie] bei, andere die Fremdheit. Mani aber erfrechte sich, alle Bosheit bis zum äußersten anzuziehen.</p><p>Gepriesen sei, der uns von diesen fernhielt!</p><p>23. Ferner gab es Leute, die sich erfrechten, zu behaupten, daß die Propheten nichts über unsern Herrn verkündet hätten; durch die [zweite] Ankunft, die bevorsteht, werden sie bezüglich jener, die bereits stattgefunden hat, überführt; die erste haben die Propheten verkündet, wie auch die Apostel jene zukünftige uns verkündet haben. Erkennen sie eine Ankunft durch die andere, die erste durch die zukünftige.</p><p>Gepriesen sei, der über beide Offenbarungen gegeben hat!</p><h2>23</h2><p>Nach derselben Melodie.</p><p>1. Die zwölf Apostel waren die Ackersleute des ganzen Erdkreises, aber kein Ort und keine Gegend wurde nach ihrem Namen benannt, bis allerlei Unkraut erschien nachdem die Ackersleute gestorben waren und das Unkraut den Weizen nach seinem Namen benannte; am Erntetage aber wird es ausgerottet werden.</p><p><em>Kehrvers:</em> Gepriesen sei, dessen Ernte bevorsteht!</p><p>2. Sie [die Irrlehrer] lehren mich, sie zu hassen, denn die geheimen Schriften, die sie geschrieben haben, verbergen sie, wie ein Mensch, der seine Schande verbirgt, damit sie nicht verbreitet werden. Die Kirche aber zeigt ihre Herrlichkeit, offen erwirbt ihre Schönheit sich Ruhm. Kein Flecken ist an ihr, den sie verbergen, kein Makel, den sie verhüllen müßte; klar wie das Licht strahlt ihre Lehre.</p><p>Gepriesen sei, der sie mit seiner Wahrheit erleuchtete!</p><p>3. Joab hatte eine Stadt erobert, und zwar die Hauptstadt des Reiches; damit sie aber nicht nach seinem Namen genannt würde, da Joab, der Feldherr, sie erobert hatte, schickte er zu David, der sich beeilte, um in sie als König einzuziehen, und als der genannt zu werden, der sie erobert habe. Joab mühte sich ab als Diener, und der Name des Königs wurde genannt.</p><p>Dir sei Ruhm von den Gläubigen!</p><p>4. Die Apostel und Propheten, die Fürsten und Heerführer waren, mühten sich ab und arbeiteten, unterrichteten und lehrten und eroberten Städte und Festungen. Die Propheten und Apostel mühten sich ab, und der Name Gottes wird genannt. Unser Herr arbeitete und mühte sich ab und lehrte – und der Name von Betrügern wird genannt, so daß Menschen nach ihrem Namen sich nennen.</p><p>Gepriesen sei, durch dessen Namen sie bloßgestellt werden!</p><p>5. Gefragt werden sollen die Anhänger des Bardaisan, wie und warum sie nach dem Namen des Bardaisan genannt werden und was der Anlaß der Benennung sei, ob sie etwa von ihm abstammen, wie die Hebräer von Heber. Und wenn sie von ihm ihre Lehre empfangen haben, so stellt sie [schon] die Nennung seines Namens bloß, da er eine böse Lehre zusammengedichtet hat.</p><p>Gepriesen sei, der ihre Betrügereien aufgedeckt hat!</p><p>6. Nicht jeder aber, der Schüler ausbildet, nennt seine Schüler nach seinem Namen; der Apostel hat die Völker belehrt, und niemand hat er nach seinem Namen genannt; auf jenen Namen, in dem er sie unterrichtete, taufte er sie; eben diesen Namen, in dem er sie taufte, hieß er sie verehren; diesem Namen schrieb er alles zu.</p><p>Gepriesen sei, dessen Name alles gebührt!</p><p>7. Indem nun ein Dämon unter den Griechen begann, eine jede [Ehefrau] zur Hure zu erklären, machte er das nach, was ihm schön und passend schien. Und auch heute verführt er durch allerlei Vorspiegelungen einfältige Weiber; die eine fängt er durch Fasten, die andere durch den [Buß-] Sack und Hülsenfrüchte, wieder eine andere nimmt er durch Reden gefangen.</p><p>Gepriesen sei, der seine Ränke zunichte macht!</p><p>8. Der schändliche Trug kann nämlich, ohne die Wahrheit [zu verwenden], sich nicht schmücken, und die Lüge kann nicht gehen, es sei denn den Fußstapfen der Wahrheit nach. Als Braut gewannen sie sie durch [den Schein] ihrer [d. h. der Wahrheit] Schönheit, und dies beweist, daß sie schändlich sind. Und als sie sie für sich gewonnen hatten, nahmen [behandelten] sie sie [als Frau], und das offenbart, wie arglistig sie sind. Wer sollte da nicht vor ihnen fliehen!</p><p>Gepriesen sei, bei dem alles seine Zuflucht findet!</p><p>9. Rufen wir laut aus diese Worte, damit wir auch von den Tauben gehört werden; dich mache ich zum Schiedsrichter, du wähle aus, o Hörer, was ist größer oder herrlicher, daß du ein Christ heißest oder ein Christ gerufen werdest oder ein Daisanitisches Unkraut?</p><p>Gepriesen sei, nach dem alles sich sehnt!</p><p>10. Ehe noch Bardaisan war und Markion genannt wurde, zu den Früheren lasset uns gehen, die älter sind als Markion, und lasset uns sehen, wie die ersten Kirchen genannt wurden, und nach diesem Namen wollen wir genannt werden und ausziehen und wegwerfen die Benennungen mit späteren Namen.</p><p>Gepriesen sei, der durch seine Namen weiter fortgepflanzt wurde!</p><h2>24</h2><p>Nach derselben Melodie.</p><p>1. Die Abgefallenen erfrechten sich, die Schriften auszutilgen, damit sie nicht widerlegt werden könnten; aber durch die eine, die sie gelassen haben, werden sie widerlegt; es genügt diese, und zwar in reichstem Maße. Unser Herr erhielt sie in seiner Bibel, und jene haben sie nicht wie die übrigen ausgetilgt. Werden sie sie jetzt etwa austilgen? Der Herr bewahre sie und auch mich, daß ich nicht die Ursache dafür werde.</p><p>Gepriesen sei, der meinen Glauben bewahrt!</p><p>2. Es gebot und ordnete an der Wahrhaftige, daß wir auf Erden niemand Meister nennen sollen. Der Apostel war ängstlich besorgt, die Herde nicht nach seinem Namen zu nennen. Wovor der Apostel sich fürchtete, dazu drängt sich zum Ersticken das Unkraut [der Ketzer]; ihr Beweggrund ist die Herrschsucht; darum streitet sich jeder, wer auf diesem Throne sitzen soll.</p><p>Gepriesen sei, dessen Kreuz uns Demut lehrte!</p><p>3. Der Herr versagte in seiner Weisheit die Throne den Söhnen des Zebedäus, damit wir nicht in verkehrter Weise dieses als Vorwand für uns nähmen. In seinen Fragen führte er sie behutsam von der Größe zur Niedrigkeit [Demut], damit unser Hochmut zurechtgewiesen würde; anstatt der Herrlichkeit gab er das Leiden als Zurechtweisung unseres Stolzes.</p><p>Gepriesen sei der Erhabene, der vor dem Gerichte stand!</p><p>4. O die treuen Brautwerber, die sich gegenüber dem Bräutigam nicht änderten, wenn auch die Herde sprach: „Ich bin des Kephas oder des Paulus oder des Apollo.“ O die Herde, die sich selbst mit dem Namen ihresgleichen bezeichnete! Die guten Knechte fürchteten sich und nahmen ihre Namen von der Herde weg und bezeichneten sie mit dem Namen ihres Herrn.</p><p>Gepriesen sei, der sich durch seine Apostel bezeichnete!</p><p>5. Die falschen Lehrer aber gleichen trügerischen Brautwerbern, die als getreu ausgeschickt wurden, sich aber in Betrüger verwandelten; für sich nämlich warben sie die Bräute Christi. Die Schönheit des Bräutigams suchten sie nachzumachen, um die Braut durch dessen Schönheit zu fangen; mit dessen Eigentum wappneten sie sich gegen ihn.</p><p>Gesegnet sei, durch dessen Prüfungsofen sie bloßgestellt wurden!</p><p>6. Auch Johannes, der Brautwerber, offenbarte sich, da er merkte, daß die Braut seines Herrn auf ihn wie als ihren Herrn schaute, als Diener, der [nur] Diener sei; er zeigte seine sterbliche Natur, zeigte seine niedrige Stufe; Herrlichkeit und Niedrigkeit zeigte er ihr [der Braut], daß er nicht würdig sei, den Schuhriemen des Bräutigams zu lösen.</p><p>Gepriesen sei, der ihn lehrte, sie [die Braut] zu überzeugen!</p><p>7. Die falschen Lehrer boten ihr eine erborgte Schönheit dar, die Spitzfindigkeit ihrer Worte. Denn wer die Braut seines erhabenen Herrn verführen will, putzt und schmückt sich. Und doch sind sie häßlich, so sehr sie sich auch herausputzen, denn die Niedrigkeit [Demut] Jesu ist sogar herrlicher als die Schönheit der Geschöpfe.</p><p>Gepriesen sei, dessen Schmach ein Lobpreis ist!</p><p>8. Seine Erhabenheit sahen die Griechen und die Perser und die Ägypter; da verleugnete ihr Mund die eigenen Götzenbilder und die Namen ihrer Götzen, Siehe, die Verdorbenen taten Buße und verleugneten den Namen ihrer Meister und bekannten den Herrn der Wahrheit. Das Unkraut aber nennt sich nach dem Namen von Menschen, die in Irrtum gefallen sind. Gepriesen sei, der die Irrenden zurückführt!</p><p>9. Die Braut des Sohnes schändeten Leute [Irrlehrer] unter den Griechen; da auch ihre Schüler nach dem Namen ihrer Lehrer benannt wurden, bekleidete sich die Braut, deren Liebe ausschweifend wurde, mit dem Namen eines Knechtes. Da entbrannte von Eifer der mächtige Brautwerber, daß sie nicht völlig ausschweifend und verdorben würde und tilgte ihre Namen weg.</p><p>Gepriesen sei, der ihr Eiferer gab!</p><p>10. Und wenn heute noch der Apostel leiblich gegenwärtig wäre, so würde er das Andenken der Betrüger auslöschen, wie das des Amaleq; wenn er nicht einmal gestattete, daß der Name des Simeon der Herde beigelegt wurde, um wieviel mehr würde er den Namen der Diebe austilgen, die sie [die Herde] zerrissen und wegführten und nach ihrem Namen nannten.</p><p>Gepriesen sei, der sie [die Herde] an seinen gepriesenen Namen fesselte!</p><p>11. Markion, der zuerst Lästerungen aussprach, war nicht imstande, seinem Namen zu entgehen; der Name ging von seiner Spaltung aus und die Benennung von seiner Trennung. Auch der Dieb will nicht nach seinem Handwerk genannt werden, er wird aber mit Notwendigkeit Dieb nach seinem Tun genannt. Unsere Taten verschaffen uns unsere Namen.</p><p>Gepriesen sei, mit dessen Namen wir bekleidet sind!</p><p>12. Die heilige Kirche aber flieht vor dem Namen von Menschen, meine Brüder; darum haben die Sabellianer und die Arianer und die übrigen Getrennten, da sie nicht nach dem Namen ihrer Meister genannt werden wollten, mit List versucht, ihr zu gefallen, da sie merkten, wo ihre [der Kirche] Liebe sei, daß sie nämlich ganz an Christus gebunden sei.</p><p>Gepriesen sei der Name, an den sie gebunden ist!</p><p>13. Sie haben nicht beim Apostel gelesen, der jenen tadelt, der sagt: „Ich bin des Kephas" und ein anderer: "des Paulus“ und „des Apollo“. O, des großen Jammers, meine Brüder! Denn die Berufenen waren so dreist, ihren Namen der Herde beizulegen, und die Rufenden erröteten nicht und die Hörer schämten sich nicht, daß sie sich nach dem Namen eines Menschen nannten.</p><p>Gepriesen sei der Name, nach dem wir genannt werden!</p><p>14. Kommet, lasset uns schauen, bei wem diese Lehre der Apostel ist, die die Braut des Sohnes nicht nach ihrem [eigenen] Namen nannten. Eines Lehrers Lehre, der seinen Namen der Herde beilegt, ist nämlich weit entfernt von der der Apostel; wer sie aber nach dem Namen seines Herrn nennt, bei dem ist die Wahrheit erhalten geblieben.</p><p>Gepriesen sei, der uns gezeigt hat, bei wem sie ist!</p><p>15. Auch bei den griechischen Weisen wurden und werden ihre Schüler nach dem Namen eines jeden benannt, meine Lieben! Menschen unterwarfen sich gegenseitig und ließen sich nach ihren Namen nennen. Gegen den Namen des Herrn und Gottes aber empörten sich die Leugner, die ihren Namen der Menschheit beilegen wollten.</p><p>Gepriesen sei, der seinen Namen uns gegeben!</p><p>16. Die eine garstige Lehre haben sie also mit dem Namen des abscheulichen Hundes bezeichnet; und die Wahnwitzigen schämen sich nicht, nach dem Namen des Hundes benannt zu werden, wie auch die Audianer nicht erröten, nach dem Namen der Nachteule genannt zu werden, ebensowenig die Arianer und die Qûqiten; auch ihre Namen sind alle abscheulich, einer mehr als der andere.</p><p>Gepriesen sei der Name, mit dem wir geschmückt sind!</p><p>17. Den Namen von Wölfen haben sie Lämmern beigelegt, es bekleideten sich Tauben mit dem Namen von Habichten, es legte der Weizen seinen guten Namen ab und wurde mit dem Namen von Dornen bezeichnet. Es schalt der Apostel die Korinther, daß sie, obgleich der Herr für sie gekreuzigt wurde, sich doch nach dem Namen von Dienern nannten, nach dem der glorreichen Männer Petrus und Paulus; wieviel mehr würden ihn die Leugner zum Zorne gereizt haben!</p><p>Gepriesen sei der Name, den wir bekennen!</p><p>18. Viele Christusse werden gepredigt, einer, der in der Zeit des Mani erschien, ein anderer in den Tagen des Bardaisan, und zu Markions Zeit wieder ein anderer, Ein anderer Christus ist aber der, der in den Tagen der Apostel kam. Mehrere Christusse aber widersprechen einander; und wenn es nur einer ist, der unter sie verteilt ist, so streitet er in ihrem Munde mit sich selbst.</p><p>Gepriesen sei jener, der mit sich selbst übereinstimmt!</p><p>19. Auch die Zeit, in der diese Unkräuter emporschießen, ist abstoßend, Geliebte! Verwirrt nämlich sind ihre Zeiten und fremdartig ihre Lehren. Wenn sie sie aber [angeblich] von den Aposteln empfangen haben, wer empfing sie denn von ihnen? Etwa Arius, der von heute ist, oder Mani der gestern auftauchte? Oder Quamsû, den [die] Erde ausspie!</p><p>Gepriesen sei, der da lacht im Himmel!</p><p>20. Die Apostel haben jahrelang gepredigt, und nach ihnen andere, und es gab noch keine Unkräuter. Diese aber, die später aufstanden, mögen uns sagen, nach wessen Namen jene Lehre genannt war; die älteste [Lehre], die Simeon vortrug, ward nicht nach dem Namen des Kepha genannt, und das bezeugt auch Paulus und Apollo.</p><p>Gepriesen sei, durch dessen Zeugen sie widerlegt werden!</p><p>21. Die Kirche der [Heiden-] Völker trat in die Erscheinung, und dann ward der Tempel des [jüdischen] Volkes zerstört; und nachdem er den Tempel des Volkes von Grund aus zerstört hatte, wurde dort eine Kirche erbaut. Markion diente in ihr nicht, denn man wußte von ihm noch nichts. Arius betrat sie auch noch nicht, auch Mani nicht, noch Bardaisan. Die Propheten gaben die Überlieferung den Aposteln weiter.</p><p>Gepriesen sei der Herr der Satzungen!</p><p>22. Er pflanzte sie von Adam auf Noe fort, verbreitete sie von Noe bis auf Abraham und von Abraham auf Moses und von Moses auf David und von David bis auf die Gefangenschaft und von Babel bis auf unsern Erlöser. Und es wurde das Volk zerstreut, und es schnitt ab und machte aufhören alle seine Überlieferungen; da setzte die Hand der Apostel die Überlieferung fort.</p><p>Gepriesen sei der Herr ihrer Überlieferungen!</p><p>23. Derselbe, der den Bau der Arche anordnete, hat auch den Tempel des Volkes gebaut; derselbe, der eben dieses vorübergehen ließ, gründete die heilige Kirche; derselbe, der die Fortpflanzungen der Wesen und Geschöpfe geordnet hat, hat auch die Überlieferungen der Propheten und Apostel geregelt von Ewigkeit zu Ewigkeit.</p><p>Gepriesen sei, der den Anfang gab und das Ende!</p><h2>25</h2><p>Nach der Melodie: Deine Gottheit, Herr, hat mich in Erstaunen versetzt.</p><p>1. Lasset uns nun jene widerlegen, die abgeirrt sind und auf den Wegen des Truges wandeln, indem uns der Weg des Lebens den Beweis [das Zeugnis] liefert, da die Boten des Friedens ihn lehrten und die Weisen des Geistes ihn erforschten und auf einer ebenen Strecke ihn abwägend anlegten. Es haben ihn die Propheten und Apostel weiter fortgeführt. Auf ihm befinden sich Meilensteine, die die Wahrheit gegründet hat, und Herbergen, welche die Liebe vollendet hat. Wir aber, Brüder, wollen ihm folgen, auf dem der Vater seinen Sohn sandte, wir wollen alle auf dem Wege des Königs wandeln, damit wir alle bei dem Königssohn zu Tische sitzen.</p><p><em>Kehrvers </em>: Preis sei dir von den Rechtgläubigen!</p><p>2. Das ist der Weg, den vor dem Königssohn zu bahnen das Heer des Königs ausgezogen ist, damit auf ihm in feierlichem Zuge der Sohn der Königsherrschaft einherziehe, um in die Residenzstadt zu kommen, in der der Thron Davids für den Sohn Davids gegründet und vorbereitet war. Als König war er gekleidet, als er verspottet wurde; die Krone trug er, als er verhöhnt wurde; er wurde erhöht und herrschte auf Golgotha. Er vollendete den Weg seiner Propheten und bahnte ihn wiederum seinen Aposteln. Lasset uns alle auf dem Wege des Sohnes wandeln, damit wir hingelangen und sehen die Herrlichkeit des Vaters!</p><p>3. Im Pentateuch bahnte Moses den Weg der Vorbilder vor jenem Volke, das auf jedem Wege herumirrte. Unser Herr aber hat in seinem Testamente den Weg der Wahrheit vollkommen festgestellt für die Völker, die zum Wege des Lebens kamen. Alle Vorbilder zogen also auf jenem Wege einher, den Moses bahnte, und erfüllt wurden sie auf dem Wege des Sohnes. Möge daher unser Geist ein ebenes Land für jenen Weg sein, anstatt auf der Erde, lasset uns, Brüder, auf unsern Seelen den Weg des Lebens bahnen!</p><p>4. Der Mund der Leugner verdammt sie also selbst, ohne daß sie es merken, da sie von Johannes bekennen, daß er gekommen sei. Sehen wir nun zu, ob es nicht in der Ordnung ist, daß die Boten vor dem Könige verschwinden und aufhören, sobald der König angekommen ist! Den Johannes, welcher der letzte und der Abschluß der Propheten ist, sah nämlich Simeon, das Haupt der Jünger, und so stand der Herr in der Mitte zwischen den ersten und den letzten. Es schwiegen die Posaunen der Prophetie, es dröhnte aber das Horn des Apostolats.</p><p>5. Vor dem Messias, der kommen sollte, kam Johannes zu den Juden zur Vorbereitung, wie sie selbst sagen; wenn aber, Geliebte, die große Königsstraße zubereitet wird, merkt jeder, daß der König im Anzuge ist. Dreihundert Jahre ist es schon, daß Johannes den Königsweg bereitete, und wo ist der König, ihr Ungläubigen? Offenkundig ist es und ohne Zweifel, daß jene Vorbereitung des Johannes dem Königssohn voranging, der ihm auf dem Fuße folgte; und weil er gekommen war, verstummten die Herolde.</p><p>6. Das ist der Weg, auf dem Abel schritt, und Henoch und Noe und Abraham, Moses und Josue und Samuel und die aus dem Hause Davids, und sein Nachkomme Joseph und viele, die dazwischen waren; siehe da, eine Kette von Söhnen des Lichts! Sogar Ungläubige müssen also gestehen, daß unser Herr nach Sion kam als Herr nach seinen Dienern. Der Weg beweist, daß er als König hinter seinem Herrn in feierlichem Zuge aufbrach. Indem sie mit Tücke ihn beseitigten, besiegelten sie den Weg mit dem Herrn des Weges.</p><p>7. Wer immer vorgibt, ein Gesandter zu sein, aber vom Wege des Königs abweicht, der ist ein Dieb am Wegesrande, denn auch die Räuber gehen in die Nähe der Straße, um dort die Kaufleute zu überfallen. Wenn aber einer zu führen versteht und ihren Spuren nachgeht, so werden sie bei dem Stehlen ertappt. Gehen auch wir aus und suchen auf dem Wege des Irrtums der Leugner! Erforschet ihre Reden und Nachstellungen und entreißet die Schafe, die sie weggestohlen haben!</p><p>8. Denn der schmutzige Irrtum bahnt sich verstohlene Wege, Brüder, links vom Wege des Lebens. Und siehe, seine Führer auf seinem Wege sind mit der alten Schlange verwandt, der Irreführerin, die die Rechtgesinnten verführt. Häßlich ist ihr Rat wie sie selbst; ihren Spuren folgend, zogen die [Irr-] Lehren die den Weg zum Irrweg machten, einher; und wer einfältig ist, den fangen die Schlingen ihrer Mysterien, und jeden, der rechtgesinnt ist, verdrehen sie durch ihre Lehren, bis er sich ihren Wegen anpaßt.</p><p>9. Weil nun, wie [im Evangelium] verkündet ist, der ebene Weg der verwirrende ist, so haben sich ihm Irrwege angeschlossen. Denn die Sünde säte auf dem Lebenswege Spuren des Todes, um die Kinder des Lichts zu verwirren. Sie glich den Trug der Wahrheit an, damit entweder die Wahrheit als Lüge, oder der Trug als Wahrheit angesehen werde. Wandle auf dem rechten Wege und sei verständig, und präge seine Schönheiten deinem Geiste ein, damit dir nicht die verfluchte Schlange begegne und dich nach dem abscheulichen Wege ablenke und dich zu Fall bringe!</p><p>10. Der Erstgeborene, der auf dem Wasser wandelte und jenem Jünger den Weg bahnte, zeichnete ihm Vorbilder auf den Wellen vor, und es wurden so die Fluten zu Typen. Auf den Gewässern legte er einen Pfad an und prägte Zeichen des Festlandes auf dem Meere ein, denn so bahnte er seinen Aposteln die Pfade des Predigtamtes in der Welt, die ja mit dem Meere verglichen wird. — O Stimme, die den Wellen gebot und einen Pfad auf den Gewässern ebnete, gebiete auch den Ärgernissen gleich den Wogen, und ebne deinem Diener den Weg der Wahrheit!</p><h2>26</h2><p>Nach derselben Melodie.</p><p>1. Eine wichtige Frage ist es, über die Wege aller Leugner Nachforschungen anzustellen, ob sie von Anfang an bestehen. Den Pfad, auf dem Mani ging, hatte er erst vor kurzer Zeit gebahnt; von gestern sind die Lehren der Unkräuter, die da blühen und verdorren. Diebe, deren Pfade in ihre Hinterhalte ablenken, haben das durch den Diener gegebene Testament von dem des Sohnes losgetrennt. Schauen wir auf den Weg der Propheten, der auf jenem Weg der Apostel führte!</p><p><em>Kehrvers</em>: Preis sei dir von den Rechtgläubigen!</p><p>2. Eine starke lebenspendende Quelle gibt es und eine Quelle von Aussprüchen der Prophetie, auch einen Brunnen von Worten des Geistes. Schlangen stahlen von seinen Bächen, sie saugten ein Weniges und gaben ein Vieles von sich; sie waren Teiche [Sammelbecken] von tödlichem Gift. Und obgleich der Trank lebenspendend war, ward er doch, weil Drachengeschmack dabei war, dem Trinker zum Tode. Und wer da töricht ist, glaubt, daß dieser Strom süß und fremdartig ist; der Irrtum stahl nur vom Ausfluß aus der lauteren Quelle der Wahrheit.</p><p>3. Lerne den [rechten] Weg kennen und wandle also, damit dich nicht der andere Weg in die Gefangenschaft führe, denn der Trug äfft auch die Wahrheit nach. Wo die königlichen Meilensteine und die Herbergen und die Handelsleute sind, das ist der Weg des Königs und der Gesandten. Wo aber Wahrsagerei und Horoskop und Lästerung und schlimme Salben sind, ist der Pfad des Irrtums und der Räuber. Und wo du schlimmes Tun findest, mach dich auf und fliehe von dort! Und wo du den geraden Werg gefunden hast, mache auch deine Seele gerade und wandle auf ihm!</p><p>4. Wegen der Frucht bahnte er den Weg, der sich vom Baum bis zum Kreuze, von einem Holze zum andern erstreckte, von Eden bis Sion und von Sion zur heiligen Kirche und von der Kirche bis ins Königreich hinein. Steigen wir ein wenig auf diesem Wege empor! Und siehe, er widerlegt die Leugner, denn wie und wo sie abwichen, zum Satan sind sie abgewichen; sie gingen dahin und zogen seinen Namen und seine Handlungsweise an. Unser Herr verglich sich selbst mit einem Wege; wohlan, wandeln wir auf ihm zu seinem Vater!</p><p>5. Es ist dies der große Weg der Gebote, der sowohl sehr breit als auch sehr eng ist, alt und auch neu. An seinem Anfange schritten die Unbeschnittenen und trugen Vorbilder unseres Herrn, denn ohne seine Vorbilder gelangt kein Mensch zum Leben. Dann kamen die Beschnittenen in die Mitte, die bekleidet waren mit den Vorbildern des Sohnes; und da [wie] er den ersten und den mittleren das Leben gab, gab er es durch sein Brot den letzten, und so hat er den Weg in drei Teile geteilt. Eins ist der Anfang und auch das Ende, und es wird beschlossen bei dem Herrn des Alls.</p><p>6. Die Ursache des Weges [der Erlösung] aber war Adam, nach [hinter] dem die Knechte seines Herrn auszogen und sich abmühten, um das verirrte Lamm zu suchen. Es waren aber die Unterhirten [Knechte des Hirten] nicht imstande, das verlorene zu finden und es in seine Hürde wieder zurückzubringen. Da zog der Sohn des Herrn [selbst] aus, es zu suchen; er ging einher auf dem Wege, den die Unterhirten dem Herrn der Herde gebahnt hatten. Er zog den Adam an und öffnete durch ihn die Pforte des Paradieses bei seinem Einzug. Wohlan, versehen wir uns mit Wegzehrung! und brechen wir von hier auf, denn gebahnt ist der Weg nach Eden.</p><p>7. Auf die Erde von Dornen und Fluch trieb er den Adam, da er gesündigt hatte, damit er sich abtöte und nach Eden zurückkehre. Im Gefängnisse gebar uns Eva, und es kam uns die Gefängniswohnung lieblicher vor als unser Wandel nach dem Paradiese. Groß ist die Vorliebe für die Gewohnheit [für das Gewohnte]; weil wir uns nämlich an die Finsternis gewöhnt hatten, erschien uns das Licht häßlich. Ein Gefesselter bittet wohl, daß man seine Fesseln löse, ein Gefangener ficht, daß er herauskomme; unser Gebet aber ist, wenn es erhört würde, daß wir auf der Dornenerde bleiben möchten.</p><p>8. Wie auf einem Schiffe sind wir zusammengedrängt und trauern über den, der aus den Wogen in den Hafen des Friedens eingegangen ist. Die Kette der Seele ist unsere Sorge, und siehe, ein jeder bringt sie an seinen Nacken heran, um sie ganz um ihn voll ständig zu legen. Und jeder Mensch quält, solange er lebt, seine Freunde, die mit ihm im Gefängnis und in unsichtbaren Fesseln sind. Über die Geburt der Kinder freuen wir uns, über ihren Tod trauern wir; wir freuen uns, daß sie an den Ort der Dornen kommen, und trauern, daß sie an den Ort des Lichtes gehen.</p><p>9. Unsern Herrn ermüden wir durch ein Doppeltes: daß er uns zu sich rufe, beweinen wir, daß er uns hier lasse, vergelten wir mit Unrecht. Der Gute sah, daß wir, wenn es möglich wäre, zahllose Geschenke geben würden, um nicht aus dem Gefängnisse herausgehen zu müssen nach dem [Himmel] -Reiche; darum schuf er den Tod, der weder Geschenke noch Überredung annimmt, damit wir ihn nicht überreden können und hier bleiben. Wenn nun der Barmherzige durch ein kurzes Ende den Menschen erlöst, dann herrscht Trauer, daß der Tod gekommen ist und die Myriaden Fesseln von unsern Gliedern gelöst hat.</p><p>11. In unsers Herrn Macht liegt beides, sowohl die Zeit, als ich eintrat in die Schöpfung, als auch, wann es gut sein wird, daß ich von ihr scheide. Auf dem Wege der Wahrheit wurde ich geboren, obwohl es meine Torheit nicht merkte; erwachsen machte ich mir sie zum Eigentum, als ich sie erkannte. Die verwirrten Pfade, die mir begegneten, verachtete mein Glaube, denn ihr Ende läuft nach links aus. Weil ich dich bekannt habe, bekenne mich; sei gnädig dem Sünder, der an dich glaubt! Denn obgleich er gesündigt, klopft er doch an deine Pforte, und wenn er auch schwach war, so wandelte er doch auf deinem Wege.</p><h2>27</h2><p>Nach der Melodie: O, meine Schüler.</p><p>1. Wie gleichen doch die Leugner jenen, die das Siegel des Königs gestohlen haben und damit im geheimen falsche Münzen prägen! Fällt eine in die Hände von Kennern, so sehen sie darauf wohl das Gepräge und das Bild der königlichen Würde, sie sehen aber auch darauf den Betrug und die Fälschung des Verfertigers; es kann nämlich der Dieb nicht das Gepräge völlig nachmachen [fälschen], Die Lehren, die den Weg verfälschen, konnten die Meilensteine des Königreiches nicht verfälschen.</p><p>2. Und solange die Meilensteine stehen, ist auch der Weg nicht verändert; denn der, dessen Gedächtnis gesund ist, findet sich zurecht, wenn er auf die Meilensteine sieht, was sie sind, woher sie sind und wohin sie führen. Wenn jemand die Meilensteine vom [rechten] Weg nach dem Irrpfad versetzt, verdient er eine doppelte Bestrafung: daß er den Weg verdorben und die Meilensteine gestohlen hat.</p><p>Gepriesen sei, o Herr, die Macht deiner Wahrheit, denn nichts vermag ihre Strahlen zu verbergen!</p><p>3. Kommet, lasset uns den Weg betrachten, den die Leugner in die Irre gebahnt haben! Die Meilensteine unseres wahren Königs sind gestohlen und auf ihm [dem Irrweg] aufgestellt und angeordnet. Siehe, da sind die Namen des Vaters und des Sohnes und des Heiligen Geistes, siehe das Zeichen des Öles und der Taufe, des Brechens des Brotes und der Kelch der Erlösung und die gestohlenen Schriften bei ihnen.</p><p>Gepriesen sei der König der Könige, dessen Weges Meilensteine [wie] Berge sind, die sich nicht verstecken lassen!</p><p>4. Kommt, bewundert die Schwächlinge, die sich abmühen, mit Steinen [Felsstücken] der Wahrheit die hohen Berge zu verdecken, die weder gestohlen noch verborgen werden können! Da sie wußten, daß sich Meilensteine nicht verstecken lassen, benannten sie sie mit dem Namen eines andern Königs, der nicht existiert. Es gab einige, die sich verführen ließen und ihnen Glauben schenkten, andere aber verachteten und widerlegten sie.</p><p>Gepriesen sei, der Meilensteine auf Erden aufstellte und Leuchten am Himmel befestigte!</p><p>5. Und wie keiner das Aufleuchten der Strahlen verdecken kann, so kann auch niemand die Wahrheit der Bücher verbergen. Durch die Sterne geraten viele in Irrtum, und wegen der Bücher kommen viele auf Irrwege. An den Leuchten nehmen sie Ärgernis, und in den reinen Büchern finden sie Flecken.</p><p>Gepriesen sei, der durch das Licht uns erleuchtet und durch die rechte Wahrheit uns Leben verleiht!</p><h2>28</h2><p>Nach derselben Melodie.</p><p>1. Der Schatten ist, Geliebte, für sich gar nichts, sondern wird vermittelst eines Körpers hervorgebracht; ebenso ist auch das Böse dem Wesen nach nichts, denn es wird auch nur vermittels [durch Missbrauch] des Guten hervorgebracht. Die Ehe ist z. B. beides, sowohl rein und anständig, wenn nach dem Gesetze, unrein aber und schändlich, wenn ungesetzlich.</p><p>Gepriesen sei, der uns ein Beispiel gab, wodurch wir vieles verstehen!</p><p>2. Durch die Speisung des Körpers verwöhnt, führt der Wille Schwelgerei ein, und durch seine Tränkung Trunkenheit. Durch das Gute, das ihm von der Natur her zu Gebote steht, zieht er sich das Schlechte zu, das nicht von der Natur her so ist; denn das Böse ist es nicht der Wesenheit nach, sondern das Gute wird in das Böse verkehrt durch unsern Willen. Der Wille verdarb die [ursprünglichen] Anordnungen; die Freiheit verwirrte die Masse.</p><p>Gepriesen sei, der die geschaffenen Dinge ordnete, damit wir durch sie jegliche Ordnung lernten!</p><p>3. Wenn du die Natur betrachtest, so ist sie ganz schön von ihrem Schöpfer her; wenn du aber auf den Brauch [die Sitten, die Gewohnheit] achtest, so ist er ganz verdorben durch unsern Willen; er breitete die Schmutzflecken der Gewohnheit über die Natur, und es wird die schöne Natur verdorben von dem Häßlichen. Und wenn ein Mensch das ablegt, was zur Gewohnheit gehört, so zieht er verständigerweise das an, was zu der Natur gehört.</p><p>Es möge unser Mund die Lästerung ablegen und unsere Zunge sich mit Lobpreisung bekleiden!</p><p>4. Und wenn der Mensch einen zweiten Schmuck zum ersten hinzufügen will, so enthalte er sich [sogar] von dem, was zur Natur gehört, nicht weil er es für schmutzig und unrein ansieht, [sondern aus Selbstüberwindung]; die Natur kann nämlich Grundlage [Stoff] sein für Gutes und Böses, so daß der Mensch, wenn [er] ordnungsgemäß mit ihr umgeht, Nutzen von ihr hat, wenn er sie aber verwirrt, allen Schaden sich durch sie zuzieht.</p><p>Herr der Natur, verleihe uns, daß wir sie weise gebrauchen!</p><p>5. Zeugen mögen für die Natur sein die Ärzte mit ihren Waagen, denn nach Maß und Gewicht mischen sie bei den Arzneien die Heilmittel bei, und wenn ein Arzneibestandteil das Übergewicht über den anderen hat, so ist es zum Schaden. Der Arzt des Weltalls ist der, der die Geschöpfe abwog und ordnete. In Barmherzigkeit ordnete er die Natur, und im Zorn ließ er die Verwirrung der Einrichtungen [Sitten] zu.</p><p>Gepriesen sei, der durch die geschaffenen Dinge unserer Freiheit Ordnung lehrt!</p><p>6. Wenn das Haar und die Nägel am Körper zu groß werden, sind sie häßlich, ohne sie ist er aber entstellt, mit ihnen aber erscheint er geschmückt. Um wieviel mehr aber entstellen Mängel die Natur! Und nur, Wenn der Wein rein [gereinigt] ist, gefällt er. Durch den Willen sündigen die Sünder, durch die Sitten verwirren sie die Natur.</p><p>Gepriesen sei, der als schönes Gewand die reine Natur gab, die durch uns beschmutzt wird!</p><p>7. Wenn du die Natur suchst, suche sie nicht da, wo wir verwirrt haben! Zur Urquelle [Quellhaupt] müssen wir hinaufsteigen, die klar war vor dem Menschen; „denn es sah der Herr alles, und es gefiel ihm alles “. Und wenn es ein böses, widerstreitendes Wesen gab, so stritt es damals mit dem Schöpfer und nicht mit dem Schöpfungswerk.</p><p>Gepriesen sei, der sich uns zeigte als mächtig, weise und huldvoll!</p><p>8. Er zeigte seine Macht als Schöpfer, indem er aus dem Nichts alles schuf; er zeigte auch die Weisheit seines Reichtums, indem er alles schmückte, ordnete, zierte und krönte; er zeigte auch seine Güte, indem er umsonst die schönen Geschöpfe bildete, die er dem Adam übergab; denn bis auf Adam waren sie schön, und von da an wurden sie durch ihn verwirrt.</p><p>Bringe, o Herr, unsern Willen wieder zusammen, denn er irrte ab und verwirrte und ward verwirrt!</p><p>9. Das Wachstum der Dornen bezeugt das neue Aufwachsen der Sünden; denn es waren keine Dornen gewachsen, weil noch nicht die Sünden aufgekommen waren; als aber die verborgenen Sünden des freien Willens zum Vorschein kamen, sproßten auch die sichtbaren Dornen aus der Erde empor. Es stellte Gott die Sünden bildlich durch die Dornen dar, damit niemand die Gottheit schmähe.</p><p>Liebe den Herrn der Natur, die wir durch Sünden und Dornen häßlich gemacht haben!</p><p>10. Wenn auch die Spreu mit dem Weizen verwandt ist, so entstellt sie in dem Maße, wie sie [mit] auf dem Haufen liegt, ihn doch; um wieviel mehr entstellt die Gewohnheit [die Sitten] die Natur, der sie völlig fremd ist! Entfernen wir doch von der Natur die häßlichen Dinge, die von unserer Freiheit herrühren, und die Sünden und Schulden, die unser Wille erzeugt! Es möge der Getreidehaufen reingemacht werden von dem Unkraut und der Spreu unserer Gewohnheit!</p><p>Gepriesen sei der Schöpfer unserer Natur, der sie von Anbeginn rein erschuf!</p><p>11. Seht, wie Natur und Schrift vom Landmann [= Gott] an ein Joch gespannt sind! Die Natur haßt die Ehebrecher und die Zauberer und Mörder, und das Gesetz haßt ebendieselben. Und als Natur und Gesetz die Erde gereinigt hatten, säten sie neue Gebote in die Erde des Herzens, damit sie Früchte bringe.</p><p>Preis sei dem Herrn der Natur und Lobpreis dem Herrn der Schrift!</p><p>12. Es verachten die Unreinen, die Ehebrecher und mit ihnen die Irrlehrer die Natur, [und handeln,] als wäre es ihnen von Natur erlaubt, zu irren und zu huren. Da schrie die Natur auf, und es hörte sie der Stier, ihr Jochgenosse, jenes furchtbare Gesetz vom Berge Sinai; und weil das Gesetz des Moses versagte, stieg der Vollkommene herab, um sie [Natur und Gesetz] vollkommen zu machen.</p><p>Vollender, dir sei Preis, daß die Unvollkommenen durch dich erfüllt wurden!</p><p>13. Von dem hinfälligen Grübeln rette mich, das hart und weichlich und bitter und versteckt ist! Denn häßlich ist aller Streit, denn durch den Mund der Grübler haucht er den Tod aus, durch schwierige Fragen reizt er das Gehör und stiehlt durch schmeichelnde Überredungskünste die Vernunft weg; er wird bald hart, um zu unterjochen, bald demütig, um zu rauben. Reiße weg, Herr, die Vollkommenen von seinen beständigen Nachstellungen!</p><p>Erbarme dich der Ungläubigen, die mit der Natur, aus der sie geworden, sogar über sie lästern!</p><h2>29</h2><p>Nach der Melodie: Deine Herde, flehentlich.</p><p>1. Laß nun, unsichtbarer Geist, alles beiseite und sammle dich bei dir selbst, suche dich in dir selbst! Wo bist du denn im Schlafe? Bei dir oder überall?</p><p><em>Kehrvers:</em> Preis dem, der alles weiß!</p><p>2. Bist du wachend derselbe wie im Schlafe, und weißt du nicht, wo du in dir selbst bist? Vielleicht hat ein anderer dich angezogen [ist in dich gefahren], und du hast nicht gemerkt, wo er ist.</p><p>3. Und du merkst auch nicht, wenn dich in wachem Zustande ein Dämon angezogen hat [in dich gefahren ist], wie er beschaffen ist. Denn sehr fein [dünn] ist seine Natur, und obwohl der Dämon mit einem Körper Verwandtschaft hat, ist er doch viel feiner als der [menschliche] Geist.</p><p>4. Der Dämon ist nämlich die Hefe [der Niederschlag] jenes Wesens der Finsternis; und wenn seine Hefe feiner ist als der [menschliche] Geist, wer kann dann überhaupt die Natur der Abgeklärtheit [der abgeklärten Flüssigkeit] erforschen?</p><p>5. Sage und verkünde es uns, o [menschlicher] Geist und Seele, seid ihr also zu zweien und noch dazu der Körper als dritter in Eintracht der Macht eines Dämons nicht gewachsen?</p><p>6. Und anstatt daß einer von euch ihn besiegen sollte, merkt ihr zu dreien ihn nicht, daß er euch in tiefen Schlaf versenkte und euch umherirren ließ!</p><p>7. Der Schlaf ist die Betäubung des Körpers und wird auch zur Betäubung für den Geist, und wachend wird [nur] erfunden während des Schlafes der mit dem Körper verwandte Dämon, und schlafend zeigt sich während desselben die ihm fremde Seele.</p><p>8. Wenn es nicht der Böse ist, der euch narrt, wer macht euch denn durch Befleckung, von der Moses schrieb, sündigen, und wer macht euch in vielen Abscheulichkeiten umherirren?</p><p>9. Wenn es nicht der Böse ist, der euch in euren Träumen narrt, dann ist es [jedenfalls] nicht der Gute, der sich in eure Traumgesichte einmischt. Und wie kamen und kommen manche eurer Träume zustande?</p><p>10. Und die, die uns das Böse im wachen Zustande predigen, leugnen, daß das Böse im Schlafe existiert; es wache im Wachenden und schlafe im Schlafenden.</p><p>11. Und wie kommt es, daß der Körper, der von ihm [besessen] ist, plötzlich in Bewegung gerät, sich [geschlechtlich] vereinigt ohne Körper, und aussät ohne Acker und sündigt ohne freien Willensentschluß, und sobald er erwacht, sich schämt?</p><p>12. Und wenn das Böse in eure Träume nicht hineingemischt ist, dann sind diese abscheulichen Dinge euer Eigen; und wenn ihr es nicht fühlt, wer ist es, dem wir es zuschreiben sollen?</p><p>13. So müssen wir sagen, daß Satan gewacht und euch [in solches] versenkt hat; ein Leib wurdet ihr für ihn, und er wurde euch zur Geisteskraft, und beide Parteien haben ihre Naturen zugleich missbraucht.</p><p>14. Die Hefe ward klar, der Schlafende wach, der Verstand ward in Schlaf versenkt, der Geist ward tot, der tote Leib ward Seele und der Leib lebendig ohne sie.</p><p>15. Und es ereignete sich, daß der Leib wach war, solange er mit Satan zusammen war, der ihn in seinem Schlafzustand sündigen machte; und es ereignete sich auch, daß auch Geist und Verstand mit ihrer Schwester, der Seele, zum Schweigen gebracht waren.</p><p>16. Wenn aber die Träume dem Satan gehören, wer [anders] streut beim Erwachen die Erinnerung an den Traum in die Seele, in den Geist und Verstand?</p><p>17. Sie genügten ihm nämlich nicht, daß er sie durch die ersteren narrte, dadurch, daß er sie zu Toten machte, die Wachenden und die Geistigen; er fährt wieder in sie, wenn sie erwacht sind und leben.</p><p>18. In ihrem Gedächtnis beginnt er sie an seine Träume zu erinnern, und durch ihre Stimme beginnt er seine Gesichte zu verkünden, und durch ihre Auflösung [Deutung] lehrt er sie seine Träume durch die selbst auszulegen.</p><p>19. Wer sollte sich nicht über diese Verwirrung wundern, wer sollte nicht staunen über dieses Durcheinander, wer kann begreifen diesen Gegensatz?</p><p>20. Es ist nämlich eine Einheit und auch eine Vielheit; erkennend und nicht erkennend, fühlend und nicht fühlend, Irrtum und Erinnerung, seiend und nicht seiend.</p><p>21. Im Schlafe wachend, im Tode lebendig; in Ruhe, und viel umherirrend; in Schlaf versenkt, prophetisch; die prophetische Offenbarung seines Schlafes im wachen Zustand auslegend.</p><p>22. Er ist bei sich und ist nicht bei sich selbst, er ist in sich und nicht in sich, denn siehe, er ist dahingestreckt und irrt umher; geht er dann selbst hinaus und kommt wieder oder ist ein anderer über ihn gekommen?</p><p>23. Was ist wohl die Bewegung im Traume und wie ist sie zu erklären? Sie macht die Glieder bewegen und entlockt den Augen wahre Tränen im Traume, der nicht wahr ist?</p><p>24. Sollen wir sagen, er ist etwas Wahres? Siehe, er ist doch völlig nichts. Sollen wir sagen, er ist etwas Lügenhaftes? Siehe, er ist doch nicht völlig leer. Ihre Schuld ist eine, weil ihr Traum einer ist.</p><p>25. In ihrer tiefen Ruhe ist ihr großer Kampf; geteilt in ihrer Einigkeit bilden sie Träume, einträchtig im Streit, streitend in der Eintracht.</p><p>26. Wie kann ich ein stilles Haus sein für Bewohner, die uneinig in mir im Streit liegen? Sie zahlen keinen Lohn, im Gegenteil, sie verlangen Lohn von mir dafür, daß sie mich im Schlafe quälen.</p><p>27. Geteilt sind sie und doch einträchtig und gleich, denn ihr Wille ist ein und derselbe. Einer ist ferner, der in mir Wahrheit, ein anderer, der in mir Lüge spricht, und in Übereinstimmung reden sie in mir ihre Lüge und ihre Wahrheit.</p><p>28. Und wie beide im Schlafe einen Traum in Einmütigkeit vorgaukeln, so bringen sie ihn im wachen Zustande einträchtig in Erinnerung und sprechen ihn im Wachen aus.</p><p>29. Sie sahen ihn in meinem Verstande, sie malten ihn in meinem Geiste, sie sprachen ihn aus mit meinen Lippen, sie ordneten ihn in meiner Erzählung und verkündeten ihn durch den Mund und legten ihn aus durch die Zunge.</p><p>30. Und ich wurde zum Werkzeuge und mein Wille zur Harfe und meine Freiheit zur Zither, und es zeigten mir die zwei Kräfte im Schlafe den Traum und die Auslegung im wachen Zustande.</p><p>31. Und ich wurde sie, und sie wurden ich, und obwohl wir einander gleich geworden sind, sind wir doch untereinander geteilt, denn ich war mir nicht bewußt, wie sie mit ihren Träumen mich irreführten.</p><p>32. Vielleicht merkten es auch sie nicht in ihren Träumen, und mit mir lagen sie schlafend in mir und ein anderer erregte in mir und in ihnen seine Träume, seine Auslegungen und Gesichte.</p><p>33. Und ich – wo ich bin? Wenn ich verloren gegangen war, wer suchte in meinen Worten mich Verlorenen? Wenn ich aber nicht verloren gegangen war, warum war ich meiner nicht bewußt?</p><p>34. Wer hat es übernommen, mich abzubilden, daß ich selbst in meinen Reden mich sehe, und wer schilderte mir mich selbst, daß ich weiß, wer ich bin? Mir selbst gegenüberstehen kann ich nicht, meine Brüder!</p><p>35. Wer kann mir das erklären, bin ich einer oder mehrere? Wer kann es mir auslegen, bin ich einer oder geteilt? Im Schlafe geteilt, einheitlich im Wachen.</p><p>36. Wer kann es mir offenbaren? Die Hefe [der Schmutz] des Schlafes steht da wie ein Nebel gegenüber dem Wachen, und es entsteht durch das Erwecken heiterer Himmel im Wachsein.</p><p>37. Denn die Seele stirbt nicht, die Seele schläft nicht, jener schläft offenbar, der stirbt [= der Leib], um durch seine Sterblichkeit auch ein Vorbild seiner Auferstehung zu zeichnen.</p><p>38. Die Seele im Körper wird müde bei seinem Wachen und irrt umher in seinem Schlafe, irrt umher in seiner Trunkenheit, irrt umher in seiner Krankheit. Dem Schöpfer beider sei Lobpreis!</p><h2>30</h2><p>Nach der Melodie: Das erste Jahr.</p><p>1. Wessen Natur könnte sich zu jenem Erhabenen erheben, wenn dieser sich nicht selbst erniedrigt hätte durch das, was nicht zu ihm gehört? Sich selbst hat er nämlich [dadurch] erniedrigt, daß er das Opfer, das das Feuer verzehrt, ißt, obwohl er kein Essender ist; erniedrigt hat er sich selbst dadurch, dass er sich sichtbar machte der Menschheit, obwohl er doch seinem Wesen nach ein völlig Verborgener [Unsichtbarer] ist; erniedrigt hat er sich selbst durch die Reue, die nicht zu ihm gehört, um sie in unserem Geschlecht hervorzurufen, zu dem sie gehört.</p><p><em>Kehrvers:</em> Gepriesen sei, der jegliche Form ertrug, um uns Leben zu schenken; gepriesen sei, der Opfer wählte und es doch zurückwies!</p><p>2. Damit er nun nicht mit sich selbst uneinig erscheine, als ob in seinen Augen die Wahrheit, die bei ihm ist, verhaßt wäre, bekannte er anderseits seine wahre Natur, um zu zeigen, wie er beschaffen sei. Obwohl er zu erkennen gab, daß er nach Brandopfern hungerte, bekannte er anderseits, daß er kein Opfer esse; während er andeutete, daß er im Heiligtum wohnte, zeigte er anderseits, daß der Himmel voll von ihm sei.</p><p>3. Er hat seine Hoheit erniedrigt, um zu offenbaren, wie barmherzig er sei; er bekannte aber seine Hoheit, um seine Preiswürdigkeit anzuzeigen; er ließ sich herab und nahm unsere Gestalt an, er ward erhöht und offenbarte seine Glorie, um uns Leben durch beides zu geben. Er erniedrigte sich und bekannte wiederum sein wahres Wesen: durch beides half er uns. Er hat in seiner Güte [Herablassung] sich selbst herabgesetzt und unsern Schatz bereichert und durch sein wahres Wesen unsere Schätze vermehrt.</p><p>4. Er hat seine Größe durch uneigentliche [metaphorische] Ausdrücke verkleinert; damit es uns aber nicht schiene, daß er ganz und gar so sei, hat er seine Majestät enthüllt, zwar nicht so, wie sie ist, sondern nach unserer Fassungskraft. Auch seine Größe ist nämlich eine Verkleinerung, da er nur einen Strahl von ihr uns zeigte; nach dem Maße unserer Sehkraft teilte er uns etwas von seiner gewaltigen Strahlenfülle mit.</p><p>5. Es ließen aber die Ungläubigen die Kraft der Ursachen, die uns zum Heile sind, beiseite und klammerten sich an deren Namen an, um gegen deren Ursache zu streiten. Ihr Sinnen ist eine Quelle der Lästerung, ein Schatz von Abscheulichkeiten ist ihre Bosheit, die Gott an seinem eigenen Orte entehrt, wie die Schlange, die von den Früchten ißt und dem Landmann in seinem Weinberg nachstellt.</p><p>6. Lasset uns in den Kampf eintreten! Fragen wir, und lassen wir uns fragen! Eines nämlich von zwei Möglichkeiten läßt sich feststellen: Entweder wollen sie ohne Gott erfunden werden, und dem ist auch so, oder sie haben einen andern, fremden Gott, der von diesen [Anthropomorphismen] frei ist; es fällt nämlich jener Fremde nicht unter die Ausdrücke und Bezeichnungen unserer Natur.</p><p>7. Wenn er aber erborgte Gewänder der Einheimischen angezogen hat, müßte er auch von den Leugnern angeklagt werden, weil er wie ein Spion arglistig sich verkleidete, um die Freien in die Irre zu führen; und wenn es sich für den Fremden schickte, sich in geliehene, nicht eigene Gestalten zu hüllen, um wieviel mehr schickte es sich für den Schöpfer, sich in die Schönheit seiner Werke zu hüllen!</p><p>8. Wenn sich aber die Blinden über den Fremden freuen, daß er sich in der menschlichen Gestalt der Menschheit näherte, so offenbaren sie ihren Haß, indem sie den Schöpfer hassen, der uns Leben gab in unserer [d. h. menschlicher] Gestalt. Wenn der Herr der Dinge getadelt wird, daß er sich in die Gestalt der ihm gehörigen Dinge hüllte, um wieviel mehr müßte da der Fremde angeklagt werden, daß er sich in gestohlene [d. h. ihm nicht gehörende] Gestalten hüllte!</p><p>9. Es müßte sich dann auch der Fremde fürchten, er möchte völlig arm werden, denn wenn er arm würde, müßte er für sich verlangen wie ein Bedürftiger. Wenn er aber verlangte, so gebührte ihm dasselbe wie jenem, der Opfer forderte zum Vorteile [der Opfernden]. Wenn er uns aber Veranlassung gab, damit er uns wegen der Opfer Leben verleiht, sollte er, der Opfer fordert, gepriesen werden, da er dadurch Gelegenheiten zum Leben anordnete.</p><p>10. Wer nämlich ein Opfer Gott darbrachte, betete viel und heiligte sich sehr, damit sein Opfer nicht von dem unsichtbaren Herrn und dem sichtbaren Priester verworfen wurde; die Leugner aber sündigen heut fortwährend und verbergen es; jener Sünder aber, der opferte, bekannte beim Opfer auch seine Sünden.</p><p>11. Siehe also, wie sehr er durch die Opfer dem Sünder half, weil er bewirkte, daß jener betete, und ihn nötigte, sich zu heiligen. Von seinem Opfer stiegen daher Opfergeruch und Buße zugleich als Weihrauch empor. Während es also den Blinden schien, daß Brandopfer dem Herrn wohlgefielen, gefiel ihm die Buße der Sünder, weil im Brandopfer Buße verborgen ist.</p><p>12. Der Herr sprach, wer seinen Jüngern zu essen gibt, sei jenem gleich, der ihm, dem Herrn, selbst Speise und Trank reiche. Wenn er aber nicht hungert, wer zieht dann Nutzen aus den Hungrigen? Siehe, sie essen statt seiner. Wenn nun jener Wohlgefallen hat am Gewinne dessen, der anderen Speise und Trank reicht, dann freute sich auch der Gerechte am Gewinne des Opfernden, wenn auch ein Priester es war, der die Opfer aß.</p><h2>31</h2><p>Nach derselben Melodie.</p><p>1. Das Aussehen der Traurigkeit nahm bisweilen unser Schöpfer an, um seinen Geschöpfen einen Vorgeschmack seiner Barmherzigkeit zu geben; und während er ohne Sorge ist, trägt er doch in seiner Liebe Sorge, damit wir seine Güte bemerken. Denn jeder, der über etwas Betrübnis zeigt, dessen Sorge liefert einen Beweis seiner Liebe; darum bewies das Weinen unseres Erlösers seine Liebe zu Lazarus.</p><p><em>Kehrvers:</em> Gepriesen sei der Unsichtbare [Verborgene], der unsere Gestalt anzog!</p><p>2. Wenn es einen andern Gott gäbe – fern sei es, dass es so wäre –, so würde er sich wohl hüten, sich über seine verdorbenen Kinder zu betrüben; wenn er sich nämlich betrübte, wäre er wie jener [wahre Gott], von dem geschrieben steht, daß es ihm leid tat, und daß es ihn reute. Wenn nun jener erbarmungslose Gott sich über unsere Leiden nicht betrübt, dann wollen wir unsere Zuflucht zu unserm Gott nehmen, der Betrübnis zeigte, um uns den Wert seiner Erbarmung zu lehren.</p><p>3. Der Apostel sagt: „Betrübt den Heiligen Geist nicht!“ Er mußte sich ihnen gegenüber verkehrt ausdrücken, damit sie auf den rechten Weg gebracht würden. Fragen wir nun die Irrenden, was der Apostel zu den Zuhörern sagen wollte. Wollte er uns die Unvollkommenheit des Heiligen Geistes zeigen, oder suchte er nur eine Möglichkeit, zu ermahnen? Wenn es nicht zum Zwecke der Ermahnung geschehen wäre, dann hätte er uns eine Schwäche des Heiligen Geistes gezeigt.</p><p>4. Denn nicht gesund und rein ist ein Wesen, das einer Unvollkommenheit fähig ist. Wie könnte er rein sein, wenn er durch einen Schmerz in Unruhe versetzt werden könnte? Was sollen wir also erforschen, die Natur oder die Liebe des Heiligen Geistes? Wenn wir seine Natur suchen, wird sie hierin [in den Worten des Apostels] als schwach erfunden; wenn wir aber seine Liebe suchen, so ist sie sehr groß, da er durch seine Erniedrigung uns geehrt hat.</p><p>5. Er hat nämlich seine reine und heilige Natur [als der Schwäche fähig] bloßgestellt. Da sie nämlich überhaupt nicht durch Betrübnis beunruhigt werden kann, schrieb er [der Hl. Geist] an die Sterblichen, daß sie ihn nicht betrüben möchten, um uns durch sein weises Vorgehen Leben zu spenden, wie einer, der für sich besorgt ist, uns aber mit seiner Gnade beschenken wollte; denn durch die Affekte, die nicht in seiner Natur liegen, wollte er die Sünden verhindern, die in unserer Natur liegen.</p><p>6. Für einen, der unwissend ist, findet sich überall etwas zu tadeln, bei Gott aber kann nichts Tadelnswertes zutreffen. Er ist nämlich erhaben, und [nur] die Liebe erniedrigt ihn, und unsertwegen ward er klein, denn mit uns sprach er wie unseresgleichen. Da glaubt [dann] ein Tor, daß Gott wirklich so sei, und er beginnt [er wagt es], die Bilder und Veranstaltungen, die voller Hilfe sind, zu tadeln.</p><p>7. Wer kann wohl das Wesen der Gottheit ergründen? Wer kann den Reichtum der Königswürde ermessen? Wer kann die Tiefe seiner Majestät erforschen und ihre Geheimnisse erfassen? Warum stürzt du, der Schwachheit unterworfen, dich in dieses gewaltige Meer? Weil seine Wogen schön und anziehend sind, reißen sie dich in die Tiefe.</p><p>8. Wenn dich gelüstet, dieses Meer zu erforschen, und du dich einer einzigen kleinen und schwachen Welle näherst, wird sie dich zu einer großen fortreißen, ja, alle Wellen werden dich, eine in die andere, versenken, denn dieses Meer gehört ganz zusammen, vereint und gleich in Wesen und Einheit. Wenn du dich der äußersten Welle näherst, reißt sie dich in die innerste Tiefe.</p><p>9. Wenn du dir aber ein Schiff baust zum Handel und zum Gewinne und nicht zur Grübelei, dann ist es ein erhabenes Meer, das die Kaufleute bereichert, die Dreisten aber ersäuft; dein Kapital aber wird hundertfältigen Ertrag bringen, denn seine Wogen werden dir Schiffsführer sein; alle Schätze wird es zutragen, es wird dich geleiten, und du wirst an seinem Ende in seinen Hafen gelangen.</p><h2>32</h2><p>Nach derselben Melodie.</p><p>1. Das Volk der Hebräer war krank infolge des Götzendienstes; die Heilmittel und die Veranstaltungen, die der Allheiler anordnete, machte Markion zur Ursache für seine Krankheit und vermehrte durch sie seine Leiden; durch den Verband der anderen brachte er sich selbst Verwundungen bei, und durch die Heilmittel fügte er sich Wunden zu, weil er die Ursache der Hilfsmittel nicht verstand; weil sie Gott tadelten, machten sie sich strafbar.</p><p>Kehrvers: Gepriesen sei, der jegliche Gestalt annahm, um uns Leben zu schenken!</p><p>2. An Stelle des gesunden und wahren Gesetzes goß und prägte er falsche Münze und führte die Einfalt irre; er gab sie [die falsche Münze, den Irrtum] heimlich aus, er bot sie umsonst an, er reichte sie listig dar. – Auch sie sind wie er, ihr Vater; in dessen Form sind ihre Worte gegossen, denn verkehrt [der Wahrheit widersprechend] legte er die Lehre dar, die wie eine Mauer die Einfältigen umschloß.</p><p>3. Mein Sohn, nur erborgte [uneigentliche] Bilder werden auf dem Spiegel ausgeprägt [wiedergegeben]; vollkommen ist er [der Spiegel mit seinem Bild] bei den Vollkommenen, schwach bei den Schwachen, er ißt mit den Essenden und nimmt diese Dinge auf, ohne daß sie in ihm sind. Ebenso ließ sich die Majestät, der die Opfer jenes Volkes wohlgefällig erschienen, zum Heile in jeder Weise zu den Toren herab, um das, was ihr gehörte, zur Höhe emporzuziehen.</p><p>4. Obwohl nämlich der Spiegel ohne Alter ist, nahm doch seine Fläche [sein Busen] das Bild des Alters an in dem geheimnisvollen Bilde von der Majestät, die Daniel mit dem Aussehen des Alters sah. Da der König schamlos war wie ein Tor, zog der König der Könige das Alter an wie ein ehrwürdiger Greis; er richtete die Gottlosen, die schamlos der Sünde frönten.</p><p>5. Er bekleidete sich mit dem Greisenalter des Wesens, das nicht altert, um durch Gleichnisse über seinen geliebten Sohn Belehrungen zu erteilen. Unter der Gestalt des Greisenalters zeigte er seine Vaterschaft, um zu zeigen, daß er einen Sohn habe, den Menschensohn, den Daniel vor dem Alten der Tage stehen sah, der den sterblichen Königen die Macht nahm und dem unsterblichen Königssohn die Herrschaft gab.</p><p>6. Wenn nur einer als sitzend bezeichnet wäre, wäre auch nur ein Thron dagewesen, aber statt eines Thrones sah er Throne; damit deutete er an, daß der Alte an Tagen einen Throngenossen und Sohn hatte. Die tausendmal Tausende, die Daniel sah, sah er nur stehend vor dem Throne; er setzte einen Thron für den Sohn, dem Dienst geleistet wird; er gab das Stehen den Engeln, die dienen.</p><p>7. Wenn nun der Spiegel sich mit jeder Gestalt bekleidet und jede Farbe auffängt, ohne daß seine Farbe aufgestrichen wird, und er Kleider anzieht, während er zu jeder Zeit blank [glatt] und schön ist, so hat doch seine Blankheit nichts Beschämendes, und er ist in [mit] seiner eigenen [natürlichen] Herrlichkeit bekleidet; in Licht nämlich hüllt sich der Spiegel, wie der Unsichtbare, dessen Gewand das Licht ist.</p><p>8. Doch betrachte die Majestät nicht wie einen Spiegel, dieser ist nur ein Fahrzeug der Bilder und Darstellungen, jener Majestät kann sich nichts ohne sie [ohne ihren Willen] nähern; denn sie wollte Gestalten annehmen, die bedürftig [mangelhaft] sind, zum Heile der Schwachen, sie schickte [sogar] ihren Sohn zu den Erdbewohnern, um die Irdischen mit den Überirdischen zu vereinen.</p><p>9. Die Majestät entschloß sich, jegliche Gestalt anzuziehen, die Menschheit aber wollte nicht mit deren Hilfe das Leben gewinnen; da schickte sie [die Majestät] ihren Geliebten, und anstatt der erborgten Gestalten, die sie angezogen hatte, zog der Erstgeborene wirkliche Glieder an und vermischte sich mit der Menschheit. Er gab das Seinige und nahm vom Unsrigen, damit seine Vermischung unserer Sterblichkeit Leben verleihe.</p><p>10. Es hörten aber die Leugner, die irren und in Irrtum führen, von den mannigfachen Formen; sie griffen nun die Majestät an, da sie meinten, daß es sich mit ihr [der Majestät Gottes] wirklich so verhielte, wie die erborgten Ausdrücke lauteten. Weil ihre Ohren an den preiswürdigen Worten der Propheten verwirrt waren, stellte sie [die Majestät Gottes] einen Spiegel vor ihnen hin, damit ihre Augen ihre Ohren zurechtwiesen.</p><p>11. Sie sahen nun im Spiegel, daß er [der Spiegel bzw. das Spiegelbild] in allem alles war, daß er in dem Bilde der Person des Sohnes den Sohn wiedergab, indem er sich mit seinem Aussehen bekleidete und indem er mit ihm klein war, – daß er [der Spiegel] ihn aber auch mit dem Aussehen der Majestät schmückte, die sich in ihrer Huld zu dem kindischen [unverständigen] Volke herabließ und sich in die Gestalt seiner Kindheit hüllte und sich ihm näherte, um seine Häßlichkeit zu schmücken.</p><p>12. Der Spiegel [das Spiegelbild] gibt ferner bei dem Manne, dessen Aussehen vollkommen ist, die Vollkommenheit durch das Bild der Person wieder, indem er sich mit dessen Aussehen bekleidet und sich mit seiner Gestalt umgibt. Um ihn nach der Art des Evangeliums, das von den seligen Aposteln und Jüngern aufgestellt wurde, zu schmücken, hat er [der Spiegel] mit den vollkommenen Gesetzen, die er uns gab, unsern innerlichen Menschen geschmückt.</p><p>13. Etwas Wunderbares ist der klare Beweis, der uns zuteil ward, beredt [logisch] ist er, der die Verständigen belehren will über jene Majestät, von der die Toren glauben, daß sie nicht vollkommen sei. Für uns ward sie klein, als sie klein war, für uns wuchs sie auch, als sie wuchs; und obwohl sie jederzeit sich selbst gleichblieb, bekleidete sie sich in ihrer Huld mit jeder Gestalt.</p><p>14. Die Natur ihrer Wesenheit ward niemals kleiner oder größer, denn sie ist nicht ein Wagen, der zum Wechsel kommt [der von Station zur Station gewechselt wird]; einer ist, der nicht kleiner wird, einer ist, der nicht größer wird, dessen Ganzes das Ganze füllt; kein Raum ist in ihm, in den er noch eintreten könnte, kein Platz außerhalb von ihm, in den er noch hinaustreten könnte. Wo sollte er sich ausbreiten oder wachsen? Oder wo sich zusammenziehen oder kleiner werden?</p><p>15. Der Wille der [göttlichen] Wesenheit ist nämlich nicht ihr Gegner noch ihr Feind, so daß er die Majestät nötige oder bekämpfe, um sie dahin zu bringen, daß sie kleiner werde und sich verändere; denn wir dürfen nicht den Willen und die Natur des [göttlichen] Wesens als im Kampfe befindlich uns vorstellen; ein Wille nur ist in ihrer Person, die niemals kleiner oder größer wird.</p><p>16. Denn wenn dieser Spiegel der Natur nach an sich selbst unveränderlich ist, nimmt er uns gegenüber Veränderungen an, indem er sich ganz in menschliche Gestalt kleidet; äußerlich nur hüllt er sich in Formen, sein Körper aber ist frei von unseren Bildern: uns nur erscheint er mit unserem Bilde, während er bleibt, wie er an sich ist.</p><p>17. Mein Sohn! In einem sichtbaren Spiegelbilde, das auch verborgen ist, stellte er sich dar, damit er darin gesehen werde; wir sehen ihn und sehen ihn nicht, das heißt, daß seine Gestalt ohne Gestalt ist. Es kann uns der Spiegel nicht vollkommen das Bild seiner Unsichtbarkeit zeichnen, er kann nicht einmal die sichtbaren Dinge leibhaftig [zeichnen], wie sollte er es bei den unsichtbaren können?</p><h2>33</h2><p>Nach derselben Melodie.</p><p>1. Verhaßt ist den Irrenden die Ursache von Heilsveranstaltungen, daß z. B. geschrieben steht: „Gott erwachte wie ein Schlafender.“ Der Wachende schlief und lehrte, daß die Sünden der Menschheit ihn zu unserm Heile eingeschläfert haben. Auch unser Herr schlief, wie geschrieben steht, im Schiffe; er schlief, damit das Gebet ihn aufwecke um zu zeigen, daß das Gebet in der Not Rettung erwecken kann.</p><p>Kehrvers: Gepriesen sei, der kam und die Seinigen errettete; gepriesen sei, der sich herbeiließ, unsere Wunden zu heilen!</p><p>2. Wenn sie nun schon deshalb unsern Schöpfer hassen, weil er in jeglicher Form gering [klein] ward, um uns auf jede Weise Leben zu spenden, um wieviel mehr müßten sie dann in jeder Weise den Fremden hassen, da sein eigener Wille den Anlaß gab, daß sie ihn ans Kreuz schlugen und töteten und begruben! Und wenn diese harten Dinge ihre Hartnäckigkeit nicht brechen, zeigen sie, wie weit ihre Schmähsucht geht.</p><p>3. Dafür mühte er sich um die Menschheit in jeder Weise ab, indem er keine Möglichkeit und kein Heilmittel unversucht ließ, um sich selbst nicht vorzuwerfen, daß noch ein Mittel gewesen wäre, das er verschmäht und unterdrückt hätte. Er verachtete das Tadelwort der Sünde, um uns das Hilfsmittel der Gerechtigkeit zu reichen; denn er setzte sich über alle Tadler hinweg, nur damit seine Gerechtigkeit ihn nicht tadle.</p><p>4. Er bewies, daß seine Macht, uns zu helfen, nicht überdrüssig werde, er zeigte, daß seine Liebe auf unsere Ehre nicht mißgünstig sei, er lehrte, daß ihm selbst Schande nicht lästig war, um uns zu Hilfe zu kommen. Wenn es [noch] ein Mittel, uns zu helfen, gegeben hätte, und unser Schöpfer hätte nicht gewollt, es anzuwenden, außer daß es sich um Unwürdiges oder Schlechtes handle, dann wäre er entweder neidisch oder furchtsam oder träge gewesen.</p><p>5. Darum trug er kein Bedenken, sich mit Reue zu bekleiden, darum scheute er sich nicht, wie ein Eifernder aufzutreten, darum schämte er sich nicht, sich zum Schlafe niederzulegen und Opfer zu fordern. Er ließ kein Mittel unversucht, um der [menschlichen] Freiheit, die volle Verfügung hatte, zu helfen, so daß ein Tadler nur seinen Wahnsinn beweist, wo der Erbarmer seine Güte zeigt.</p><p>6. Dieses hatte er in Bildern zum Nutzen [der Menschen] veranstaltet; er hat es aber dann auch in Wirklichkeit zum Heile ausgeführt. Er sandte seinen geliebten Sohn, und [dieser] kam zur Geburt, zur Beschimpfung und zur Kreuzigung, damit seine Gerechtigkeit ihm nicht vorwerfe, daß er durch seine Geburt hätte heilen können, und er habe nicht geheilt, und damit seine Güte ihn nicht richte, daß er durch das Kreuz hätte Leben spenden können und er habe es nicht gespendet.</p><p>7. Der Erstgeborene nahte sich und bot seine Wangen den Faustschlägen dar. Wer nun tadelnd fragt, warum ist er herabgestiegen und läßt er sich schlagen, mit einem solchen wird der Gerechte rechten: „Für dich ward ich geschlagen, damit du durch meine Beschimpfung Ehre erlangest.“ Für jene, die seine Geburt und auch seinen Tod tadeln, wurde er geboren und auch gekreuzigt. Wie sollte man da noch Tadler finden? Der Tadel wendet sich ja gegen sie zurück.</p><p>8. Wer die Majestät tadelnd fragt, warum sie sich klein gemacht, der wird von ihr zurechtgewiesen, daß sie klein geworden, um ihn groß zu machen. Wer ihre Erniedrigung tadelt, der wird von ihr zurechtgewiesen, daß sie sich erniedrigt habe, um ihn zu erhöhen. Wenn du über deinen Herrn dich scheltend und tadelnd aussprichst, wendet sich die Anklage gegen dich: Wie kannst du jenen tadeln, der aus Liebe zu dir sich dem getadelten Werke unterzog!</p><p>9. Du bist sehr tadelnswert, weil deine Krankheit die Majestät gezwungen hat, dich durch zahlreiche Veranstaltungen zum Leben zu bringen. Weil du ein Kind bist, ward sie gleichsam eine Amme, um dir Milch zu reichen; weil sie sah, daß dein Körper befleckt war, ward sie zu einer Quelle der Reinigung. Tadle also die reine Quelle, daß sie durch deinen Schmutz verunreinigt wurde, da sie [an sich] rein ist!</p><p>10. Wie kann wohl ein Leidender, der geheilt werden soll, vor dem reinen Arzt zurückschrecken, der sich seinem Geschwür naht? Die Verwundeten sahen jenen Arzt, der voll von ihrem Geschwür war und bebten vor ihm zurück. Die Wunden der Leugner empfanden Ekel vor dem Erbarmer, der sich nahte und sie heilte. Sie schreckten zurück vor seiner Reinheit, die von den Geschwüren ihrer Leiden voll war.</p><p>11. Anstatt jenen glorreichen Arzt zu preisen, der sich unserm Geschwür nahte und unsere Wunden heilte, und anstatt seine Hände zu küssen, die von dem Eiter unserer Fäulnis besudelt wurden, schreckten die Verwundeten vor dem Heilmittel des Lebens zurück, das von dem Blute ihrer Leiden befleckt war; und während eine Danksagung in geringem Maße erfolgte, traten ihm die Leugner mit Anklagen entgegen.</p><h2>34</h2><p>Nach derselben Melodie.</p><p>1. Unser Herr in der Höhe ward Staub infolge seiner Güte, um uns zu sich hinaufzuheben. „Die Natur ist viel zu niedrig, daß er zu uns herabsteigen könnte“, rast zügellos unser Mund und greift ihn an. Wenn er in seiner Glorie gekommen wäre, hätten wir ihn als einen Fremden angesehen, und da er in unserer Gestalt kam, betrachten wir ihn als armselig. Das Seinige begriffen wir nicht als das Seinige, und das Unsrige erkannten wir nicht als das Unsrige.</p><p><em>Kehrvers:</em> Gepriesen sei der Erhabene, der sich erniedrigte, um uns zu erheben; gepriesen sei, der herabstieg und uns erlöste durch seine Niedrigkeit!</p><p>2. Der Barmherzige sah, daß beides schwer sei; wenn er käme in seiner Macht, wußte er, daß er uns schade, wenn er käme in unserer Gestalt, wußte er, daß die Vermessenen beginnen würden, ihn anzugreifen. Es siegte über sie seine Liebe, und er hüllte sich in unsere Gestalt. Über jeden Menschen ließ er seine Hilfe herabregnen; das Unkraut nahm durch seinen Regen Schaden, es sproßte durch ihn [der Same] hundertfach.</p><p>3. Es möge jener Fremde davor zurückschrecken, seine Anhänger zu schelten, damit sie ihn nicht etwa wegen seiner Züchtigung dem Gerechten gleichsetzen; er möge es zulassen, daß seine Söhne und Töchter dem Verderben anheimfallen, so dass er durch seine Güte sich verfehle, wie seine Herolde sagen. Es wird nämlich seine Güte als Fehler erfunden; gegen seine Schäflein kämpft statt der Wölfe der Gütige, der keinen kräftigen Stab führt.</p><p>4. Liebt also der Gute den Bösen und den Satan? Wenn er ihn haßt, dann ist er aus Gerechtigkeit zusammengesetzt; wenn er ihn liebt, dann ist seine Liebe verwerflich, weil er den Satan liebt. Wenn er den Trug von der Wahrheit entfernt, dann ist er ein gerechter Ofen der Prüfung; wenn er das Unkraut vom Weizen sondert, dann ist er der, von dem Johannes spricht.</p><p>5. Wenn er den Bösen und den Satan haßt, dann ist sein Haß gerecht, da er seinen Hasser haßt; und wenn er jenen liebt, der ihn liebt, dann ist echt und gerecht seine Liebe. Wenn er Wohlgefallen hat an den Büßern, so ist er gütig, und wenn er die Verleugner verwirft, dann ist er mächtig. Wenn dieses sich bei unserm Gott findet, kann man es nicht bei dem Fremden finden.</p><p>6. Es ist nämlich Reinheit bei [unserm?] Gott. Wird nun ein und dieselbe bei diesem und bei jenem gefunden? Wenn nun der Schöpfer die Wahrheit ergriffen hat, sehnt auch jener sich nach ihr und freit um sie? Wie sind beide heilig? Wie sind beide weise? Und wenn sich dieses bei beiden findet, wie können sie einander fremd sein?</p><p>7. Die Natur der Majestät kann nur in Gestalten [Erscheinungsformen] sich verkleinern und erniedrigen, Sieh, mein Sohn, auch jener „Fremde“ lieh sich unsere Formen und bekleidete sich [mit ihnen]. Wenn er aber unsere Formen an sich hat, kann er kein Fremder sein, das beweisen nämlich jene Formen selbst, da sie eins sind und von einem und durch einen.</p><p>8. Wenn jener „Fremde“ einen Sohn hat, so hat David von ihm gesagt: „Mein Sohn bist du, und ich habe dich gezeugt.“ Und wenn er einen Himmel hat, so hat Moses von ihm gesagt; „Seine Wohnung sind die Himmel,“ Und wenn er Diener hat, so ist er es, „vor dem tausendmal Tausende stehen “. Wenn er gerecht ist, richtet er alles, und wenn er gut ist, ernährt er alles</p><p>9. Es schämten sich geradezu die Bösen, seine Häßlichkeit zu bekennen; statt ihn einen Räuber zu nennen, nannten sie ihn den „Fremden“, denn auch der Dieb ist sehr fremd dem Herrn des Besitzes. Der Herr der Diener ist mächtig, der Dieb der Diener aber ein Aufwiegler; wenn er aufwiegelt und stiehlt unter dem Anschein des Guten, unterjocht er sie wieder, als sei er gerecht.</p><p>10. Betrachte doch die Jäger und betrachte auch die Betrüger, wie sie sich zunächst mit Süßigkeiten den Seelen nähern; wenn sie sie aber gefangen und betrogen haben, welch eine gewaltige Verwirrung entsteht da! Denn unter dem Namen eines Befreiers betrügt der Betrüger den Knecht, der ihm nicht gehört, und wenn er ihn unter dem Namen der Freiheit betrogen hat, beugt er ihn wieder unter das Joch der Knechtschaft.</p><p>11. Denn jene Güte, die er anfangs gezeigt hat, ist ganz und gar ein Nachteil, sie schadet den Menschen. Jene Gerechtigkeit, die er am Ende übt, die er an dem ausführt, den er betrogen, überführt den „Fremden“ als Betrüger … und indem er betrügt unter dem Namen der Güte, gibt er den Betrügern recht.</p><p>12. Wer ein Weib ansieht und es begehrt, den tadelt er aus Gerechtigkeit, weil er im Herzen mit ihr Ehebruch begangen. Er betrügt durch seine Güte und beginnt, uns mit Schranken der Gerechtigkeit zu umgeben. Es konnte nämlich das Eigentum, das er gestohlen, nicht ohne Gerechtigkeit geordnet werden, denn wenn keine Gerechtigkeit da ist, sind die Dinge verdorben und verwirrt.</p><p>13. Der Stock des Zuchtmeisters bringt die Diebe zur Ruhe, und das Schwert des Richters schreckt die Ehebrecher. Wenn keine Gerechtigkeit ist, ist die Unordnung groß … Auch der Fremde ordnet das Eigentum mit Gerechtigkeit, das er geraubt hat. Er reizte sie an, und sie beschimpften ihren Vater, und dann bewirkte er wieder, daß er von ihnen geehrt wurde.</p><p>14. Er lehrte Lästerungen die Diener des Schöpfers und forderte doch wieder von ihnen, daß sie ihn priesen. Er machte uns zu Abtrünnigen und fesselte uns doch wieder an das Joch seiner Gebote. Er lehrte uns ferner, unsern Gott zu berauben und ihm doch wieder als das Seinige alle Früchte darzubringen. Sieh, nun handelt jener gerecht an den Dieben, der freventlich gestohlen hatte.</p><p>15. Siehe, er löst die Gerechtigkeit auf und stellt sie wieder her. Er haßt es, daß wir ihn verleugnen und macht uns unsern Schöpfer verleugnen. Jene Gerechtigkeit aber, die er gegen sich selbst übte, rechtet mit ihm, denn wenn es recht ist, daß der Fremde geehrt werde von den Kindern, die ihren Vater lästern, um wieviel mehr ist es recht und rühmenswert, daß ihr Vater von ihnen geehrt werde.</p><h2>35</h2><p>Nach derselben Melodie.</p><p>1. Wenn es die Natur [Eigenart] des Fremden ist, daß er der Erhalter [der Welt] ist, so ist eins von drei Dingen bezüglich seiner Ankunft möglich: entweder kam er ganz oder er kam nicht ganz oder er war seit jeher hier. Wenn er nun ganz gekommen ist, so ist dies ein Ärgernis; wenn er zur Hälfte kam, so ist dies eine Lästerung, ….“</p><p><em>Kehrvers:</em> Gepriesen sei, der getadelt wurde wegen seiner Demut; gepriesen sei, der gelästert wurde wegen seiner Güte!</p><p>2. Wenn er nun ganz aufbrach und auszog, um zu kommen, hat er jenen Ort leer gemacht, von dem er ausging und auszog; und wenn auch nur ein wenig, etwa ein Teilchen von ihm [dem Orte] weggeht, dann ist eine Stelle leer. Wenn seine Fülle auch nur wenig nachgelassen, wird doch an ihrer Statt eine Leere gefunden; und es ist bekannt, daß dort, wo etwas entleert ist, statt Ordnung [Friede] Öde [Chaos] wohnt.</p><p>3. Schau auf den Ursprung dieser sichtbaren Sonne, und sieh, wie gewaltig das Hervorströmen ihrer Strahlen ist! Wenn sich aber ihr Glanz weiter fortpflanzt, wird er schwächer, und die Gewalt ihrer Strahlen läßt nach. Auch die Hitze und die Glut wird mit der Entfernung vom Feuer geringer und schwächer; um wieviel mehr wird also ein Glanz abnehmen, der sich von weiter Ferne auf uns erstreckt!</p><p>4. Und wenn sein Wesen eine Eigenschaft hat, wie von einem Gefäß in ein anderes sich zu ergießen und entleeren, so ist es [das Wesen] völlig ein Gegenstand der Geringschätzung, denn viel größer als es [das Wesen] ist das Gefäß, in das es hineinkam. Wenn nun aber sowohl unser Ort als auch sein Ort zusammen mit dem Ort der Mitte voll sind von ihm, so ist erkennbar, daß nur einer ist, der größer ist als alles, und nur der Irrtum hat Teilungen vorgenommen.</p><p>5. Siehe, da die Gewalt der Fragen sie in Verlegenheit gebracht hat, hat sie die Niederlage überredet, Teile zu wählen, so daß sie sagen, er [der Fremde] ist Erbe, oder er ist Schüler, oder auch, daß er ein Dieb ist. Wenn der Fremde nicht der Sohn des Schöpfers ist, dann hat er [nur] den Rang eines Schülers angenommen; und wenn sie dann dieses nicht anerkennen wollen, ist er ein Dieb, der gekommen ist, um zu rauben.</p><p>6. Der Fremde wird nämlich erfunden als Schüler des Schöpfers, auf den er schaute und den er nachahmte; er eiferte nämlich wie jener für seine Kirche, die er sich zu eigen nahm, und er zeigte sich als Rächer. Er spendete Glück, um seine Güte zu zeigen; er spendete Wehe, um seine Gerechtigkeit zu beweisen. Jeden Tadel, den die Irrenden anfechten, zogen sie sich, wie Giezi den Aussatz, selbst zu.</p><p>7. Ein Gegenstand des [strafenden] Zornes bist du, Satan! Wer vermag etwas wider dich? Das Feuer nur kann deine Ränke vereiteln. Er lehrte die Irrenden die himmlischen Anordnungen zu verwirren. Der Schöpfer kleidete sich in unsere Gestalten, sie aber [die Irrlehrer] stellten seine Gestalt [die Anthropomorphismen] als Wirklichkeit hin; als aber unser Herr die Menschheit anzog, machten sie seine Menschheit zum Schein.</p><p>8. So verkehrte der Böse das Herz der Hebräer; als nämlich Moses ausrief: "Euer Gott ist einer“, gingen sie so weit, ein Kalb zu bilden. Als aber der Erstgeborene erschien, wachten sie auf, verfolgten die Wahrheit und stellten die Lehre wieder auf, die sie verworfen hatten, daß nur ein Gott sei; zur Auflösung der Wahrheit bekannten sie den einen, und als einer war [den Moses predigte], gesellten sie ihm viele bei.</p><p>9. Sie [die Markioniten] machten ferner den Fremden zur Quelle der Güte und stellten den Schöpfer als Gegner der Güte hin. Durch ihre Lästerung ist er verherrlicht worden, denn siehe, während sie ihn lästern, tut er ihnen täglich Gutes; eben dadurch, durch das sie beweisen wollen, daß er nicht gut sei, zeigte er Grade seiner Güte. Denn wer ist so gut wie der, der die Münder nährt, die ihn lästern?</p><p>10. Wenn die Leugner nur ein wenig Verstand hätten und in Wahrheit wissen wollten, wer gut ist, [so würden sie einsehen], daß keiner besser ist als jener, der selbst an seinen Anklägern seine Güte beweist. Siehe, jeden Tag preisen sie den Fremden, und doch kommt weder Tau noch Regen von ihm über sie; sie lästern aber den Gerechten, der, trotzdem er gerecht ist, sich ihnen durch seine Tautropfen gütig zeigt.</p><p>11. Sind vielleicht jene nicht tadelnswert gegenüber dem Herrn der Güte, die seine Liebe dazu brachte, daß sie von ihm abfielen? Dadurch nämlich, daß er das Meer seiner Güte öffnete durch die Hand seines Geliebten, wurden in ihren Augen die Quellen der Güter klein, die er durch die Hand seiner Propheten ergossen hatte. Die Propheten schlossen und öffneten Quellen, das Meer der Güte aber öffnete der Eingeborene.</p><p>12. Weil er aber seine Güte vermehrt hatte, setzten sie seine Gerechtigkeit herab; dadurch, daß er seine Gabe so groß machte, machte er sie befremdend [unbegreiflich]. Während sie nämlich ihn lästern, tut er ihnen Gutes, damit wir durch eben dieses lernen, daß wir aus dieser Güte erkennen, daß auch sie selbst seine Gabe sei, daß Gott, der gelästert wird und es erträgt, derselbe ist, der es ertrug, dass sie ihn kreuzigten.</p><p>13. Wenn der Gerechte, als sie ihn lästerten, sie bestraft hätte, so würde er in seiner Gerechtigkeit sie mit Recht angeklagt haben, aber Unwissenden hätte es geschienen, daß sie nur klugerweise sich vor ihm fürchten sollten. Wenn er jene peinigte, die ihn als hart hinstellen, machte er nur ihre Aussage über ihn wahr; nun aber bedeckte er jene mit Schamröte, weil seine Güte seinen Anklägern entgegenkam.</p><h2>36</h2><p>Nach derselben Melodie.</p><p>1. Schaue, mein Sohn, auf Gott, wie er hier steht in der Mitte zwischen Vorwürfen von unserer Seite und auch von seiner Seite. Es tadeln ihn nämlich die Bösen, daß er klein geworden sei und sich erniedrigt und seinen Geschöpfen Hilfe geleistet habe. Wenn er aber nicht klein geworden wäre oder Hilfe geleistet hätte, würde er, der Gerechte, sich selbst Vorwürfe gemacht haben, daß er wegen jener Beschimpfung der Elenden sich gescheut und gefürchtet habe, seinen Geschöpfen zu helfen.</p><p><em>Kehrvers:</em> Gepriesen sei deine Liebe, die ihre Leugner besiegt hat!</p><p>2. Welcher Tadel ist wohl härter für den Gerechten: daß ihn der Böse und Ungerechte ohne Grund tadele, oder jener Tadel, daß er, wenn sonst kein Tadler sich findet, sich selbst tadelt? Denn wenn der Böse die Güte tadelt, schließt er sich selbst von ihr aus. Wem aber sein eigenes Herz Vorwürfe macht, der ist sehr verächtlich, weil ein Makel ihn verächtlich macht.</p><p>3. Es gibt auch heute Fälle von Hilfeleistungen, die mit Schmach und Schande und Lästerungen umgeben sind; wer aber tapfer ist, reißt die Mauer der Schmähung nieder und tritt vor, um zu siegen. Denn wer sich vor Schmach und Schande fürchtet und sich an die Hilfeleistung nicht heranwagt, ist zwar von der Beschimpfung durch andere entfernt, ist aber in seinen eigenen Augen verächtlich.</p><p>4. Wenn die Gottlosen den Gerechten schmähen, winden sie ihm, ohne es zu merken, einen Kranz des Lobes; nur dann beschimpfen sie ihn [wirklich], wenn ihm ihr häßliches Lob angenehm wäre. Das Lob des Gottlosen ist ihm ähnlich; wie das Unrecht [selbst] ist sein Lob verwerflich, denn ein Lob der Gottlosigkeit ist sein Lob, wie ein Fluch ist es in den Ohren der Gerechtigkeit.</p><p>5. Gott selbst also, der niemals kleiner oder größer wird, hat das Lob verschmäht und den Tadel verachtet, hat alle Gestalten angenommen, auf jede Weise sich erniedrigt und allen Geschöpfen geholfen. Wenn er sich nämlich gefürchtet hätte, sich zu erniedrigen, dann wäre er in Wahrheit kleiner geworden; aber gerade deshalb, weil er nicht kleiner war, machte er sich klein, wie er auch groß und siegreich wurde, weil er sich erniedrigte.</p><p>6. Gottes Natur ward nie kleiner oder größer; klein wird er aus freiem Willen und groß aus freiem Willen. Diese Zunahme also, die seiner Natur nicht eigen ist, geschieht nach seinem freien Willen. Denn sobald er [Sündern Leben verleiht, wird er hier größer seinem Willen nach], und ohne daß er seiner Natur nach kleiner oder größer wird, wird sein Wille herrlich und groß.</p><p>7. Siehe, es ist für uns und für sie über den Sohn Gottes geschrieben, daß er ein Opfer und Wohlgeruch für Gott geworden ist. Mit welcher Frechheit tadeln sie nun jenen, der Tier-Opfer forderte, und tadeln nicht jenen, der die Opfer zurückwies und das Opfer seines Sohnes verlangte. Das Testament, dessen Opfer sie verwerfen, ist ganz in Christus abgebildet.</p><p>8. Beide Testamente, die die Leugner als [einander] widersprechend darstellen, sind übereinstimmend eines im andern abgebildet. Es war nämlich das Alte Testament gleichsam das Vorbild und Modell, das um jenes bleibenden wegen aufgestellt wurde und diente und aufgehoben wurde. Das Neue Testament wurde in den Vorbildern [Formen] des Alten gegossen, aber sie gingen in Erfüllung.</p><p>9. Wenn sie [die Markioniten] die Wahrheit des [obigen] Schriftwortes leugnen [und meinen], daß unser Herr in Wirklichkeit nicht ein Opfer gewesen, dann hat er also nur einen Schein angenommen. Wenn sie nun solche Scheingestalten lieben, siehe, dann darf auch der Schöpfer jede Gestalt annehmen. Warum scheuen denn die Leugner davor zurück? Von den Gestalten des Schöpfers wollen sie nichts wissen, mit den Gestalten des Fremden aber befreunden sie sich.</p><p>10. Mit Absicht zeigte der Höchste Reue und Betrübnis; das hörten die Irrlehrer und glaubten, daß es wirklich so sei. Es steht wiederum von unserm Herrn geschrieben, daß er sich fürchtete und sich verbarg, und sie wandten [allegorische] Deutung an. Sie zeigen [also[ offenkundig ihren Haß, indem sie das eine tadeln und das andere [scheinbar durch ihre allegorische Deutung] verbesserten. Die Symbole des Schöpfers wurden angeklagt, und die Tatsachen des Fremden wurden umgedeutet.</p><p>11. Wenn sie in verkehrter Weise Überzeugung vermitteln konnten, um wieviel leichter wäre also eine rechte Überzeugung gewesen! Aber den Verkehrten ist es sehr schwer, sich den richtigen Grundsätzen anzuschließen. Bei unserm Herrn nämlich, der wirklich starb und wieder auflebte, stellten sie dies als Schein hin; aber bei unserm Schöpfer, der in bildlichen Ausdrücken klein ward, hielten sie sein Kleinwerden für Wirklichkeit.</p><p>12. Von unserm Herrn, der Kleider und Glieder angezogen, behaupten sie, daß er nur Scheingestalten gezeigt habe; vom Alten der Tage, der in weißen Kleidern erschien, glaubten sie, daß er wirklich so war. Den Geistigen machen sie zum Körperlichen, den Körperlichen aber zur trügerischen Erscheinung. Nur darin finden sie ihre Befriedigung, die Wahrheit nach jeder Richtung zu verwirren.</p><p>13. Unser Herr, der in Wirklichkeit aß und trank, aß und aß doch wieder nicht, trank und trank doch nicht [nach ihrer Aussage]; den Schöpfer aber lästerten sie, daß er den Wohlgeruch des Bittopfers roch; diesen also, der nach dem bildlichen Ausdruck „roch“, lästern sie; bei jenem aber, der in Wirklichkeit”aß“, leugnen sie es. Sie kämpfen also gegen die Wahrheit, damit diese ganz in jedem Punkt als trügerisch erscheinen soll.</p><p>14. Es ist ferner über unsern Herrn geschrieben, daß er bedürftig war und Aufnahme heischte. Da mühen sich die Söhne des Irrtums ab, über ihn eine Auslegung zu finden, daß er ganz und gar nicht bedürftig gewesen sei und sich uns gegenüber verstellt habe, damit wir auf jede Weise das Leben gewännen. Die Wahrheit prägt sich wohl ihrem Geiste ein, aber sie verdecken sie wie die Erde ihren Samen, damit sie, wie sie über unsern Herrn phantasieren und lehren, so auch über unsern Gott [Törichtes] lehren können.</p><h2>37</h2><p>Nach der Melodie: Ich will meinen Mund öffnen in Weisheit.</p><p>1. Wenn du, o Herr, uns nicht erschaffen hättest, wäre auch der Fremde unnütz gewesen; und da er uns nicht erschaffen konnte, sind wir von ihm aus wie nicht existierend, Ohnmächtig ist er, der uns ohne Hoffnung ließ, da er uns nicht schaffen konnte, ohnmächtig ist er, uns Hoffnung zu bringen, da wir nun geworden sind. Unser Schöpfer aber hat uns große Hoffnung gegeben: als Guter hat er uns erschaffen und erhält uns nun, und als Gerechter hält er uns in Zucht, und als König beschenkt er uns reichlich.</p><p><em>Kehrvers:</em> Gepriesen sei, der sich eines Vertrages für unsere Freiheit bedient, um uns Hilfe zu leisten!</p><p>2. Ein Gott, der nicht Schöpfer ist, ist seinem Wesen nach nicht Gott, seine Schwäche überführt ihn. Denn, wenn er konnte und doch nicht schuf, hätte er uns gegenüber Bosheit gezeigt. So ist er entweder boshaft oder schwach; wenn er boshaft ist, sollen wir vor ihm fliehen, und wenn er schwach ist, so ist trügerisch seine ganze Güte. Wie jener, der uns geschaffen, so ist wahrhaft seine Güte, denn wie er ist auch sein Geschenk.</p><p>Gepriesen sei, der uns viele Hilfsmittel bot durch die drei Beziehungen, von denen ich sprach.</p><p>3. Die Irrlehrer behaupten arglistig, daß der Fremde nicht schaffe. Wenn nun aber ein Schöpfer ist, so gehört alles, was Schöpfung ist, eben diesem Schöpfer. Wessen Sohn ist wohl der, der den Kot bereitete und die Blindheit öffnete und uns ein Bild des Schöpfers gab, der Adam schuf und der den Sabbat aufhob, indem er schuf wie sein Vater, der an allen Sabbaten durch Regengüsse Kot schafft?</p><p>Preis sei dir, Sohn unsers Schöpfers, der uns ein Bild unsers Schöpfers gab!</p><p>4. Die Worte der Trug redenden Leugner widerlegt die Wahrheit. Wenn nämlich der Fremde sich völlig entschlossen hat, nicht zu schaffen als Bildner und nicht aufzustellen als Schöpfer, und wenn er dann [doch] verstümmelte Glieder wiederherstellt, warum machte er so geringen Gebrauch [von seiner Macht]? Ist denn seine Güte von den vielen Hilfeleistungen erschöpft, daß sie nicht auch Geschöpfe erschaffen konnte?</p><p>Gepriesen sei der Gute, der seine Liebe zeigte durch die Schöpfung seinen Geschöpfen gegenüber!</p><p>5. War es freier Wille beim Fremden, nicht zu schaffen? Töricht war dann sein freier Wille, denn siehe, er verschloß die Quelle seiner Güter, da er viele Welten des Daseins und Lebens beraubte. Insofern ist auch seine Güte gegen uns tadelnswert, als der, welcher nur wenigen seine Liebe bezeigte, sie den vielen entzog. Indem er in das nicht ihm Gehörige kam, bewies er Erbarmen, das er dem, was sein war, entzog.</p><p>Gepriesen sei der Gute, der durch seinen Erstgeborenen seine Liebe zu den Geschöpfen zeigte!</p><p>6. Schüler der Raserei, Meister der Schmähung, Lehrmeister der Entfremdung und Prediger des Abfalls, die da rasen und leugnen und den Herrn des Alls, den Herrn der ganzen Welt beschimpfen! Hat denn „Legion“ euch rasend gemacht? Siehe, unser Erlöser ist mitten in seiner Kirche, tretet ein, reinigt euch und lernet von ihm, wessen Sohn er ist: Der Sohn des Schöpfers ist er durch sein Werk, der Sohn des Bildners durch seine Schöpfung.</p><p>Jesus, bringe zur Ruhe die Rasenden, den Staub, der mit seinem Schöpfer Krieg führt!</p><p>7. Er streckte [heilte erstorbene] Hände, weil er ein Sohn des Schöpfers ist; er gab Brot, weil er ein Sohn des Ernährers ist; er ließ Sünden nach, weil er ein Sohn des Gütigen ist; er sprach „Wehe“ aus, weil er ein Sohn des Richters ist; er gebot dem Meere, weil er der Sohn des Mächtigen ist; er schalt den Dämon und schloß seinen Mund, weil er der Sohn des Starken ist; er tilgte das Volk, weil er der Sohn des Eifernden ist; er erlöste die Völker, weil er der Sohn des Gnädigen ist; er machte die Propheten aufhören und berief die Apostel zu ihren Zeiten als Herr des Weltalls.</p><p>Gepriesen sei der Eingeborene, der seinem Vater, dessen Gestalt die Leugner verwarfen, gleich ist!</p><p>8. Eben dies, Herr, daß du uns erschaffen, ist die Ursache der Güter, und dies, daß du uns ernährst, ist die Ursache der Segnungen; und ferner dies, daß du uns züchtigst, ist die Ursache der Erkenntnisse, und daß du uns auf erweckst, die Ursache des Lebens; und wer in diesen vollkommen ist, dessen Geschöpfe bedürfen des Fremden nicht, der gar nicht existiert, denn er genügt für all unsere Hilfe,</p><p>Gepriesen sei der Vollkommene in seiner Wesenheit, der auch seine Geschöpfe vollkommen machen will!</p><p>9. Auch ist die Gerechtigkeit ohne Güte unvollkommen, wie auch die Güte selbst der Gerechtigkeit bedarf. Mögen die Leugner hingehen und in den Schriften jenes Fremden lesen, denn Worte von beiden, von denen ich geredet, finden sich in ihren Büchern zur Abschreckung und zur Ermutigung. Von dort her nämlich werden sie überführt, daß der eine gut und gerecht.</p><p>In deiner Güte und in deiner Gerechtigkeit, o Herr, ist die Schönheit deiner Vollkommenheit abgebildet!</p><p>10. Gedenke meiner, o Herr! Anbetend flehe ich darum. Wenn ich über Dinge der Lust nachgrübelte, grübelte ich doch nicht über dich in Vorwitz nach; und wenn ich mich an Frevel heranwagte, ging ich doch nicht soweit, die zu erforschen; und wenn ich auch ein Sünder bin, bin ich doch kein Leugner [Abtrünniger]. Welchen Vorzug aber gabst du mir gegenüber den Leugnern, wenn ich wie jene verloren ginge? Deine Wahrheit ist größer als der Irrtum vermehre bei mir deine Gabe!</p><p>Preis sei dir, der du dich über mein Leben erbarmst, denn deine Wahrheit ist der Odem meiner Lebenskraft!</p><h2>38</h2><p>Nach der Melodie: Selig bist du, Ephrata.</p><p>1. Warum stieg nur in jener kurzen Zeit der Fremde herab und heilte die Krankheiten? Siehe, heute ist die Welt voll von Krankheiten; wie kommt es, daß er es unterläßt, zu heilen? Ist er gerecht, wenn er die Zeiten auswählte, dem Guten aber die Zeit nicht bekanntgab? Oder haben Ursachen ihn verändert, oder ist die Empfindung seiner Güte nicht gleich geblieben?</p><p><em>Kehrvers:</em> Preis unserm Schöpfer!</p><p>2. Er zögerte, und dann kam er, und nachdem er gekommen war, ging er wieder; er war sorglos, daß er auch nicht …. auch der Fremde … wenn seine Zeichen nicht sichtbar sind. Er zögerte zu kommen, damit [erst] seine Propheten ihr Amt verrichten könnten; er stieg auf und blieb still, damit seine Apostel reden könnten; seine Zeichen hörten auf, damit seine Geschöpfe verkündeten, daß er der Sohn des Schöpfers ist.</p><p>3. Warum denn schwiegen beide Parteien, der Schöpfer sowohl wie der Fremde? Die Propheten nämlich hörten auf von seiten des Schöpfers, die Apostel nahmen ein Ende von Seiten des Fremden. Wenn sie nun einen Willen haben, so ist diese Übereinstimmung, die stattfand, ein Beweis für die Liebe. Ihr Schweigen lehrt uns, daß ihr Wille einer ist, und daß auch ihre Herrschaft eine ist.</p><p>4. Betrachte nur die Welt und betrachte die Schriften und siehe, daß einer ist, der über alles herrscht! Die Naturdinge bezeugen seine Güte, die Bücher rufen laut von seiner Gerechtigkeit. Den Feigenbaum hat er verdorren lassen, um ihre Rebe [= die Juden] zu bewässern; die Schweine ließ er ertrinken, um ihr Volk herauszuziehen; und ähnlich wie er [bei dem Auszuge] aus Ägypten den Pharao, so ergriff und warf er „Legion“ in das Meer.</p><p>5. Für den Gerechten ist es leicht, nach seinem Willen ein Geschöpf vor seinesgleichen zu bevorzugen; für den, der fremd ist, ziemte es sich nicht, das eine unter allen zu lieben und das andere zu hassen. Die Kreuziger schonten seine Kleider, seinen Leibrock wagten sie nicht zu zerreißen. Die Leugner wagten sich an sein Testament und teilten es, sie löschten aus, schrieben und fügten hinzu.</p><p>6. Von der [mit dem Kreuze] gekennzeichneten Herde trennten die Räuber ruhig ein Stück nach dem andern ab und führten sie weg; aber das gefundene Kennzeichen, das Ohrläppchen nämlich, fordert die ganze Herde zurück; durch den Geruch von ihr wird die gestohlene Sache zurückgefordert; der Rest der Darlegung gibt Anspruch auf die [ganze] Rede; das Geringste, das von den ausgetilgten Worten übriggeblieben ist, überführt die Leugner.</p><p>7. Worte, die über die Gerechtigkeit des Sohnes geschrieben sind, nahmen sie weg und tilgten sie aus, da er der Sohn des Guten sei; sie konnten aber nicht den ganzen Band auslöschen, damit nicht die ganze Schrift zugrunde ginge; hätten sie noch mehr ausgelöscht, so wären sie ohne Schrift. Da von der Gerechtigkeit in allen Worten etwas enthalten ist, nahmen sie weg und ließen [doch manches] stehen, und so wurden sie überführt, denn die übriggebliebenen Worte fordern die andern, die sie ausgelöscht, zurück.</p><p>8. Dadurch nun, daß sie den Sohn nicht als gerecht bezeichnen, bezeugen sie, daß sie böse Knechte sind; Hasser wagen nicht, gegen einen gerechten Herrn aufzutreten, der in seiner Liebe die Hausgenossen straft. Athleten, die gesiegt haben, lieben den gerechten [Schiedsrichter], die Feigen, die verloren, fürchten sich vor dem gerechten. Den Guten, vor dessen Gericht sie fliehen möchten, nennen ihn die, welche für seine Gerechtigkeit aufbewahrt sind.</p><p>9. Der Tor will lieber mit dem Tode abscheiden, als daß du ihn trennen könntest von dem, was er liebt; Unweise lassen sich lieber geißeln, als daß sie sich von der Lust enthalten. Die Irrenden verkünden auch, daß er gekreuzigt worden sei; die Kreuzigung ihrer Leiber beweist, daß die Last der Peinen des Fremden schwerer war als die des Schöpfers.</p><p>10. Mögen sie also sich entweder an Lüsten ergötzen, um zu beweisen, daß dies freisteht; oder aber, wenn sie nun ihre Glieder peinigen, den Gerechten durch ihre Kreuze preisen. Sie martern sich selbst mit eigenen Händen, indem sie sich selbst durch ihre Fasten peinigen, und doch tadeln die Schändlichen jene Hand, die aus Liebe ihre Geschöpfe züchtigt.</p><p>11. Den Gerechten tadeln sie, daß er Züchtigungen liebe; sie erdichten nur einen Vorwand, um ihn zu lästern. Wiederum tadeln sie, daß der Sohn die Ehe schätze, — um ihn zu schmähen. Beide [Beschuldigungen] lösen einander auf, beide fallen auf die Toren zurück: sie tadeln ihn, weil er gerecht, sie tadeln ihn, weil er gut ist. Preis sei ihm, der alles erträgt!</p><p>12. Zwei Dinge tadeln sie [also] und streiten darüber. Dadurch werden ihre Lehren bloßgestellt. Fragen wir sie nun über ihre Götter! Wenn sie gut sind, warum sind sie untätig? Güter wollen sie nicht geben, Übel soll man ihnen nicht vorwerfen. Ihre Prediger werden ihnen gleich sein. Einer ist, der alles lenkt!</p><p>13. Sie spotten über den, der den Ertrag der Erde, Milch und Honig, [den Juden] wie Einfältigen spendete; sie spotten, daß er sie wieder aus demselben Lande hinwegführen ließ wie Verdorbene; sie erkennen die Züchtigung zum Heile nicht an und erfassen die Gabe der Güte nicht. In allen Stücken gehen sie wie Rasende darauf aus, ohne Unterschied zu tadeln.</p><p>14. Den Vollkommenen belehrte Gott, daß sein Gewinn im Himmel sei, den Einfältigen reizte er durch irdischen Gewinn von Milch und Honig wie beim Kind. Dem Leichten [Geistigen] gab er Flügel und machte ihn fliegen, und den [ins Irdische] Versunkenen zieht er schmeichelnd empor und führt ihn. Allen wurde er alles, und da er über alles erhaben ist, ließ er sich herab, um allen das Leben zu geben.</p><p>15. Wenn du die Stimme seiner Anlockung hörst, wisse, daß seine Versprechung Kinder zu überzeugen sucht, und wenn du von seiner Strenge hörst, so wisse, daß seine Rute Schlafende aufwecken will. Sie [die Ketzer] prüfen weder die kindliche Einfalt und ihre Lockmittel noch die Vollkommenheit und ihre Prüfungen; ihr Geist ist verwirrt und ihre Zunge bellt, ihren Herrn verleugnend.</p><h2>39</h2><p>Nach derselben Melodie.</p><p>1. Gut ist der Allerhöchste, denn auch seine Übel sind in den Augen der Verständigen gut. David bedient sich in einem Psalm eines überraschenden Ausdrucks, der für die Irrenden ein Anlaß zum Spotte ist: "Er versenkte den Pharao ins Meer“, und sie [die Spötter] lachen, „denn ewig währt seine Barmherzigkeit“. „Wo ist sie [denn]?“ fragen sie [die Spötter]. Aus Barmherzigkeit wurde dem Übermütigen [d. h. dem Pharao] Einhalt geboten; dich hätte er ja [noch mehr] zum Zorne gereizt und [darum] wurde er gezüchtigt.</p><p><em>Kehrvers:</em> Preis sei deiner Güte!</p><p>2. Betrachte nicht das, was sie fragen, sondern vielmehr, wie sie in die Enge getrieben werden! Grübelnd fragen sie: „Woher ist wohl das Übel?“ Und es versanken sie und ihre Götter, Götter, die das Übel nicht verhinderten; sie unterlagen in der Untersuchung über das Übel und gingen unter. Diesen Kranz winden die besiegten Übermütigen dem Prüfungsofen, der sie bloßstellte.</p><p>3. Betrachte nun, wie das Wort der Wahrheit in einer Frage alle Fragen einschließt; alle verkünden das zukünftige Gericht, und daß diese Welt vergänglich sei. — Gepriesen sei, der dem Pharao Einhalt gebot, so daß er nicht mehr täglich seine Schuldschrift ändern konnte! Im Meere entriß und löschte er die Zinsen seiner Schuld, um die an den Kindern [begangene Schuld] zu rächen.</p><p>4. Völlig wurden sie [die Spötter] besiegt, da ihnen kräftig zugesetzt wurde, und die Götter brachten ihnen keine Hilfe. Wenn sie gründlich unterlegen sind, so gereicht das zu ihrer Beschämung; wenn sie [ihre Götter] aber sich gleichgültig verhielten, so ist das unser Sieg. Wie konnten berühmte Götter gleichgültig sein gegenüber den Wölfen, die die Schafe würgten? Alles, was sie [die Irrlehrer] sagen, sagen sie für den Gerechten, dessen Zuchtrute heilsam ist.</p><p>5. Es widerlegen sie nämlich [auch] ihre Gesetze, denn Kasteiungen sind ihre Gebote. Darum müßten [eigentlich] ihre Götter getadelt werden, daß sie an den Qualen der Menschen Wohlgefallen haben. Während sie tadeln wollen, ziehen sie sich selbst Tadel zu, denn mit Plagen schlugen sie die Welt; weil ihr Forschen blind ist, überlassen sie den Sieg der Partei der Wahrheit.</p><p>6. Betrachte die Welt als einen Körper, der von seiner Freiheit her eine Menge von Krankheiten hat, und der einem milden Arzte anvertraut ist! Dieser brennt und schneidet aus Liebe bei jedem, der sich an ihn wendet, damit er ihn heile, und einen jeden, der ihn berühre, gesund zu machen. Er ist gut in allem, und in all seinen Regungen läßt er sich als gütig erkennen.</p><p>7. Ein kleines Schiff [nur] ist die ganze Schöpfung für jenen allweisen Steuermann; ein müheloser Wink lenkt es, und nur die Toren wähnen, daß er ihm nicht gewachsen ist. Die Schöpfung ist ihm ein gehorsamer Wagen, und ein Hauch seines Willens setzt ihn in Bewegung. Er hält auch einen Zügel für das Pferd, und eine Geißel macht es gelehrig.</p><p>8. Stelle alle Züchtigungen und Leiden, sowohl die aufgeschriebenen wie die nicht aufgeschriebenen zusammen, und nimm und betrachte sie alle, daß sie alle zum Heile für alle von dem Allgütigen kommen! Er rottete das Volk aus, um es auf der Wahrheitneu aufzubauen, er nahm und zerstreute es, um das Verwirrte wieder zu sammeln. Wofern sie wollen, sind sie zum Paradiese eingeladen, wenn nicht, zur Hölle.</p><p>9. Da der leere [unfruchtbare] Weinberg — der Weinberg, der doch Früchte bringen sollte — seinen Herrn nicht aufnahm, wer sollte nicht staunen, dass der Herr des Weinbergs wieder Früchte dem verfluchten Weinberg gab, trotzdem er dem Erben doch keine Früchte gebracht hatte? Über die Früchte, die er ihm gebracht, war er erzürnt; er rottete ihn aus, um ihn bei den Heiden auf einen süßen Stamm von Guten zu pflanzen.</p><p>10. Wie er früher die Völker als Fremdlinge [Proselyten] unter seinen Gerechten gepflanzt hatte, denn ihre Rebe war bitter geworden von der von Sodom und ihre Trauben von den von Gomorrha, so hat er nicht aus Bosheit ihren Weinstock ausgerissen, denn mit Recht verdiente er den Untergang; aus Liebe hat er den Sproß der Bitteren auf den Sproß der Süßen gepflanzt.</p><p>11. Wenn nun der Bittere, da er mitten unter der Süßigkeit war, stark werden konnte und der Saft seiner Bitterkeit emporstieg, um womöglich den süßen Geschmack zu verdecken, wie und was wäre er allein geworden! Es möge die ohnmächtige Zunge schweigen, denn nur Gott kann an seinen Gliedern die Nägel, die sich ihm einfügten, bekanntmachen.</p><h2>40</h2><p>Nach derselben Melodie.</p><p>1. Wer ist wohl jener Harfe des Alls kundig, die der Herr des Alls aus allem gemacht hat, um dadurch alle zu überzeugen, daß derjenige, der ihre Saiten zu rühren vermag, von ihm herkommt? Es kam Moses und spielte darauf; und er widerlegte jene Partei der Zauberer, die besiegt wurden. Es wurde das Unkraut zuschanden, das nicht vermochte, die Saiten der Harfe zum Verstummen zu bringen.</p><p><em>Kehrvers:</em> Gepriesen sei, der die Wahrheit lehrte!</p><p>2. Rasende sind die Unseligen, die gegen Moses lästerten, der Machtwunder vollzog. Groß ist die Beschämung ihrer Götter, die ihren Verkündern keine Macht gaben; geschah es, weil sie schwach sind, so ist es eine Beschämung, geschah es, weil sie übermutig waren, so ist es eine Schande. Die zwei elenden Mächte [Prinzipien], die durch Mani und Markion gepredigt wurden, wie verächtlich sind sie!</p><p>3. Viel ist’s, daß ihr Trug sich von den [Schriften der] Aposteln Schönheit stahl, um sich damit zu schmücken; sie mögen nun zeigen, ob von den Aposteln geschrieben steht, daß sie sich namentlich [ausdrücklich] über den Fremden klar aussprachen. Hochklingende Namen von verschiedenen Göttern haben Mani und seine Genossen verkündet, so daß sie sich schämen müssen; zahllose Wunder zu wirken, waren sie zu gering, die leeren, ohne Kraft.</p><p>4. Es kannte Markion die Wahrheitskraft der Söhne der Wahrheit, deren Siege in fortlaufender Reihe kamen, und er mußte ihre Bücher bestätigen, denn er ist völlig von seiner [eigenen] Zunge geschlagen. Die Irrlehrer, die eine neue Lehre predigten, hätten Wunder wirken sollen; es genügt, daß sie sich verächtlich machten: siehe, da sind Leiden, und sie können dem Fieber nicht gebieten.</p><p>5. Sie spotten über Salomon, daß er Heide geworden, der doch, bevor er sündigte, Feuer herabkommen lassen konnte; dafür sollten sie, die voll sind von großem Stolz, das Feuer ihrer Glieder auslöschen. Die verborgene Lust in ihren Leibern ist das Fieber, und es offenbart sich an ihrem Körper Hitze und Begierde und brennendes Fieber; ihr Feuer brennt in ihnen.</p><p>6. Moses spielte auf jener Harfe der Wahrheit verschiedene Wunderzeichen bei den Ägyptern; der Stammler, der die Zunge, die Harfe der Worte, nicht gebrauchen konnte, war geschickt auf der Harfe der Geschöpfe; sein Stammeln jubelt laut über seinen Herrn. Das Schweigen und das Wort, das herabstieg, öffnete unsern Mund; es ist der Schlüssel für jeden Mund.</p><p>7. Da nach Moses niemand ein solches Instrument wie diese Harfe spielen konnte, wer vermöchte ihre Saiten zu meistern und zu beherrschen, daß er auf ihnen Wunder der Heilung jeglicher Art spiele, Umwandlung der Naturen ohne Mühe? Eine Harfe des Schweigens ist sie geworden, die in der Stille das Lob ihres Meisters ertönen läßt.</p><p>8. Sehnend erhob sich diese Harfe, als sie jenen erblickte, durch dessen Hand sie gebildet war; sie freute sich über ihn und jubelte und dehnte sich aus und verlängerte ihre gewaltigen Saiten. Sie küsste seine Hände, da er sie gewürdigt hatte, sie durch Berührung mit seinen Fingern zu heiligen; und wie sie durch seine Ankunft neu geschaffen wurde, spielte sie auch neue Gesänge.</p><p>9. Beim Anfang seiner Lieder spielte er leise Lieder im Kampfe gegen den Bösen; es litt aber schon durch den sanften Ton jener Gewalttätige [der Teufel], da die Stimme des Demütigen sein Ohr zerriß. Das dritte Lied aber spaltete das Herz des Hassers, denn dieser ist es, der zu jeder Zeit alle Zuhörer verwirrt, daß sie nicht hören und aufmerken sollen auf den Herrn der Harfe.</p><p>10. Die rauhe Saite der Unterwelt, die die Sterblichen tyrannisierte, wurde sanft; jene stumme Saite unsers Herrn überwältigte sie; durch die Toten, die auferstanden, sang sie Lobpreis. Die lose Saite band er fest, um sie gefangen zu halten, und es sangen Lob die Seefahrer [die Apostel] auf dem Schiffe. Die hohe Saite ist der Himmel, der sich spaltete, und es ertönte die Stimme des Vaters.</p><p>11. Sie [die Irrlehrer] merken, daß ein solcher Lobgesang auf diesem Instrumente gespielt wird, das ausgespannt dahängt. Kommen mögen nun die Unreinen und seine Saiten rühren im Namen und in der Kraft jenes Fremden, wie sie der gläubige Moses rührte und Josue und die gepriesenen Propheten. Lasset euch beschämen, Irrlehrer, durch die Harfe; denn siehe, sie hängt da und singt ihrem Schöpfer.</p><p>12. Gründlich widerlegt wurden ihre Götter von dem, der der Gott der Wahrheit ist, der sie durch das Wort bildete und aufhängte, sie auf das Nichts aufstellte, und keiner ist, der sie spielen könnte. Die eine schwache Harfe, die an sich klein ist, widerlegte den Gott Markion; sie grübeln, aber sie können ihre Saiten nicht ordnen und stellen sich selbst bloß.</p><p>13. Sie mögen schweigen als Schwache, da sie ihn nicht [einmal] als Starke bezwingen können. Zu tadeln verstehen sie, da dies von der Freiheit herkommt, die seine Erbarmung gegeben hat, obwohl er sie wieder einengte, um sie zu beschämen durch die Gehörlosen, die Markion nicht hörten. Der Fremde ward widerlegt, weil er nicht öffnen und eintreten konnte durch die Tür des Gehörs.</p><p>14. Er [oder die Harfe] spielte in Kana beim Hochzeitsmahl verschiedene Lieder auf den Schöpfer; für Kana nahm er einen Wechsel vor, damit es das Schweigen jener neuen Harfe vernähme, die er spielte: anstatt der schönen Saiten, die erklingen, waren es die vollen Krüge, die verkündeten. – Gepriesen sei derAllwissende, der auf seiner Harfe die Wahrheit dessen sang, der ihn gesandt!</p><h2>41</h2><p>Nach der Melodie: Wer vermag es zu sagen.</p><p>1. Möchten wir doch in uns nicht ein anderes Bild formen, ein verstecktes Idol! Der Trug blüht mehr als die Wahrheit, weil er ein Gebild der Menschen ist. Gepriesen sei der, dessen Wahrheit nicht wie ein Märchen gebildet ist!</p><p><em>Kehrvers:</em> Gepriesen sei, dessen Wahrheit nicht von den Irrlehrern verhüllt werden kann!</p><p>2. Eine Perle ist der Glaube, und er läßt sich nicht meißeln; wie der Diamant ist die Wahrheit und lässt sich nicht der Umformung unterwerfen; für alle Formung ein weiches Wachs ist der Irrtum.</p><p>3. Und wie ein häßlicher Spiegel ist er für den, der hineinschaut; denn wer schön ist, wird darin entstellt, und wer rein ist, wird befleckt. O des Spiegels, durch den jeder, der hineinschaut, viele Flecken bekommt!</p><p>4. Die Perser verehrten das Wasser und das Feuer und die Sterne, die Griechen verehrten allerlei Dinge, und alles verehrten die Ägypter, das Volk [der Juden] das Kalb und der Stamm der Hagar den Venusstern.</p><p>5. All diese abscheulichen Formen hat der Irrtum unter den verschiedenen Völkern ausgesät. Vor der Ankunft des Herrn säte er sie unter den Heiden aus und durch die Irrlehren nach dem Herrn, und als Gesundheit säte er Krankheiten aus.</p><p>6. Einer nun brachte einen fremden Gott zum Vorschein, dessen Name nicht existiert, und es ist klar, daß, wie sein Name nicht ist, er auch ein Niemand und völlig nichtig ist. Namen stiehlt er, und wie ein Dieb schwätzt er öffentlich.</p><p>7. Wieder ein anderer nennt Wind [Luft], Feuer und Wasser [ewige] Wesen, und weil Wesenheit ein Etwas ist, aber nichts vermag, nahm er als ihr Gepräge den Namen der Finsternis; etwas Häßliches prägte er dem auf, was er [ewiges] Wesen nannte.</p><p>8. Ein anderer, der kam, stahl, da seine Genossen vor ihm waren, von seinen Genossen. Seine Hand ist mit allen und die Hand eines jeden mit ihm; mit allen sündigt er, um alle zur Sünde zu verführen; dem Geschlecht der Hagar gleicht er ganz, da er von allen raubt.</p><p>9. Bei denen, die ich aufgezählt, sind auch alle Lehren verbrüdert; und wenn auch das Unkraut eins ist, sein Gewächs ist verschiedenartig nach dem Aussehen; es hat Zweige, Früchte und Blätter nach den vier Himmelsrichtungen</p><p>10. Den Irrtum prägte wie eine Münze der Böse, und in allen Zeitaltern gießt er Gottlosigkeit, und zu jeder Zeit prägt er Trug, je nach der Zeit Grübelei, Spaltungen und verderbliche Ausscheidungen.</p><p>11. Durch neue Spaltungen verdirbt er die Menschen, durch das falsche Gepräge werden sie falsch, durch das verwerfliche Gepräge werden sie verwerflich. Die zweite Seele ist der Glaube, der in den [hl.] Schriften [enthalten ist].</p><p>12. Er [der Teufel] sah den Vorteil [der Schriften] und säte Verderben und Tod in das Leben; er sah die Lehre und säte Streit. Anstatt der Psalmen traten Fragen auf, das einige Volk teilte er in allerlei Spaltungen und richtete es zugrunde.</p><p>13. Er sah die Schriften voller Wahrheit und ließ Lügen aufschreiben, und statt des: „So spricht der Herr“, schrieb er verkehrt statt Gott: „der Mensch N. N. sprach“.</p><p>14. Hohe Tempel ließ er den Göttern bauen, eine harte Arbeit, und gab als Unterpfand eine eitle Hoffnung und dingte Menschen zu verfluchtem Werk; er machte Schauspiele und ließ Gold ohne Nutzen verschleudern.</p><p>15. Statt des Almosens warf er es aus unsern Schätzen zum Schaden hinaus; statt für den Lahmen [wird es verwendet] für den, der gewandt ist in Sprüngen im Zirkus, und statt für den Tauben gibt er es der Flöte wegen des Liedes.</p><p>16. Statt der Witwe wirft er die Kleider den Dirnen hin, statt dem Waisenkinde, das auf der Erde liegt, jenem, der auf dem Seile in der Luft wandelt; statt dem Krüppel gibt er es dem Fechter, der seinen Gegner verwundet.</p><p>17. Diese [Verkehrtheiten] führte er bei den Griechen zu ihrer Zeit ein und anderes bei den verschiedenen Völkern je nach ihren Epochen zu ihrem Schaden; und bei den Hebräern mischte er seine Feste unter ihre Feste.</p><p>18. Unter die [wahren] Priester [mischte er] die Baalspfaffen, und [falsche] Opfer unter die Opfer, unter die Propheten die Lügenpropheten, unter die Apostel Apostel des Trugs, und in unsern Tagen machte er aus den Grüblern Abtrünnige.</p><p>19. Gib mir das [ewige] Leben, o Gott! Denn wie ich gelehrt habe, so habe ich gelernt [zu handeln], und das Muster und Vorbild, das ich gezeichnet, strebte ich eifrig nachzuahmen, und dieser Nutzen möge den Schaden ersetzen, den meine Sünden angerichtet haben!</p><h2>42</h2><p>Nach derselben Melodie.</p><p>1. Ist denn der Gute, der gegen den Bösen ist, auch für ihn? Öffnet er die Augen, daß er [der Mensch] damit begehre? Machte er die [verkrüppelten] Hände gerade, damit sie morden? Sein [des Menschen] Arzt legt Zeugnis ab über seinen Schöpfer, daß er ihn gut geschaffen habe.</p><p>2. Es tadeln die Toren den Finger der Barmherzigkeit, daß er den Körper gebildet habe. Appellieren wir an unsern Herrn: Wenn der Bau seines Hauses [des Körpers] nicht weise ist, möge er ihn zerstören und auflösen! Wenn er aber dennoch verlangte, daß er seine Wohnung werde, dann ist gepriesen sein Bau!</p><p>3. "Es gibt zwei Tempel des einen Erbauers, und er liebt und haßt Seele und Leib von einem Schöpfer, und er wählte aus [die Seele], und er verwarf [den Körper ].“ Warum aber liebte er die Seele und haßte den Körper, da er doch in ihm Wohnung nahm?</p><p>4. Ferner: „Zwei Tempel des einen Schöpfers.“ Wie zerstörte nun der Fremde den Tempel von Sion, weil er ihn haßte; machte sich aber den Leib zum Tempel, weil er ihn liebte? Er riß das Heiligtum nieder, richtete aber den Leib auf, das Nest der Sünden.</p><p>5. Wenn er nun vom Dämon das Geschenk nicht annahm, das er ihm machte, als er ihn „Sohn des Heiligen“ nannte, und er ihm den Mund für sein Geschenk, das er ihm geben wollte, schloß, wie taufte und heiligte er den Leib, wenn er vom Bösen ist?</p><p>6. Und nach ihrer Aussage in ihren Versammlungen befallen die Dämonen den Körper, der getauft wird; der Böse ist also getauft, und für den Satan brechen sie das Brot. Gnädig sei ihnen der Sohn des Guten daß sie so sehr lästern!</p><p>7. Und wenn sie die Sache auf die Seele beziehen, so werden sie wieder überführt; denn es kann wohl das Wort [die Taufformel] auf die Seele bezogen werden – die Taufe ist mit ihr verwandt –, das Brot aber, das sie brechen, ist mit dem Leibe verwandt, den sie hassen.</p><p>8. Und wenn aber mit der Seele verwandt ist das Brot, ihr Gegenteil, um wieviel mehr ist der Leib mit der Seele verwandt, da sie ohne ihn sogar müßig ist! Aus dem ihr nicht Eigenen lerne das ihr Eigene und leugne es nicht!</p><p>9. Und wenn im Brote, einem toten Körper, unser Herr Wohnung nimmt, und im Wasser, das ausgegossen werden kann, und in steinernen Kirchen wohnt, haßt er dann den Körper, dessen Glieder voll sind von zahllosen Mühen?</p><p>10. Eifrig ist er im Fasten und Gebet, seine Gebeine sind sein Schatz, sein Weinen ist seine Mine, sein Auge ist sein Quell, seine Jungfräulichkeit sein Beryll [Edelstein]; er ist ein Pfau des Geistes [= im geistigen Sinn], der seinen Schmuck an seinen Gliedern trägt.</p><h2>43</h2><p>Nach derselben Melodie.</p><p>1. Es forderte der Satan zwei Dinge, und er [Christus] versagte sie ihm, obwohl sie leicht waren; dem Körper aber gewährte er sogar Schwieriges; und wenn der Körper vom Bösen wäre, hätte er es ihm versagt; aber den Körper machte er gehen, und die Schlange machte er lahm [ohne Füße], und so sind die Leugner überführt.</p><p><em>Kehrvers:</em> Gepriesen sei unser Schöpfer, der Sohn unsers Schöpfers, von jeglichem Geschöpf!</p><p>2. Es baten die Dämonen, und sie durften in die Schweine fahren, wie sie gebeten hatten; wo der Satan um etwas bittet, das gegen ihn selbst gerichtet ist, versagt er es nicht. Er gleicht so seinem Vater, der dem Bösen gewährte, sich durch Job beschämen zu lassen.</p><p>3. Als Allwissender gab er beiden, dem Leibe und den Dämonen: die Schweine und das Meer gab er den Dämonen, sein Fleisch und sein Blut gab er dem Leibe. Dem Leibe hätte er seine Geheimnisse [Sakramente] nicht mitgeteilt, wenn er [der Leib] vom Bösen wäre.</p><p>4. Der Gerechte, den sie hassen, machte die Schlange lahm, und nach ihrer Aussage sollen die Schlange und der Leib eine Natur sein! Hat aber unser Herr, der die Lahmen heilte, der lahmen Schlange am lahmen Leibe Füße gegeben?</p><p>5. Verdorren machte der Gerechte die Hand des Königs, und er streckte sie wieder aus, aber er erbarmte sich nicht über die verfluchte Schlange. Auch unser Herr erbarmte sich nicht über die Schlange, denn er gab Gewalt, auf sie zu treten, gleichwie sein Vater [es tat].</p><p>6. Die Schweine ersäufte unser Herr im Meere wegen der Dämonen wie sein Vater, der die Schlange lahm machte. Aus dem Meere aber zog er den Leib Simons empor; er glich seinem Vater, der den Moses aus dem Flusse zog.</p><p>7. Den Gerechten, der den ganzen Körper bildete, tadeln die Armseligen; unsern Herrn, der seine Gebrechen heilte, loben sie; ist denn der Arzt liebenswerter als der Schöpfer und auch der Wundarzt [liebenswerter] als der Bildner? O arge Bosheit!</p><p>8. Es steht der Körper da zwischen Arzt [Heiland] und Schöpfer; den einen tadeln sie, den andern loben sie, und doch ist ihr [d. h. des Heiland-Arztes und des Schöpfers] Werk eines, denn sie haben es angefangen und auch vollendet, und ihre Ankläger stehen in der Mitte besiegt da.</p><p>9. Das Werk des Zimmermanns vermag den Zimmermann zu künden und den Schmied das Werk des Schmiedes und den Sohn des Schöpfers das Schöpfungswerk, denn auch die Heilung ist eine zweite Schöpfung.</p><p>10. Wenn tadelnswert der erste ist, der den Leib gemacht hat, so ist es auch sein Arzt. Da Moses kam und das Kalb fand, das Aaron gemacht hatte, zermalmte er es völlig; unser Herr gab dem Leibe, den er blind, fand, das Licht.</p><p>11. Die Augen des Kalbes vernichtete Moses und zerstörte seine Ohren; unser Herr öffnete die Augen des Leibes und stellte seine Ohren wieder her. Und wenn der Schöpfer böse ist, so handelt auch der Spätere, der kam, um wiederherzustellen, ganz verkehrt.</p><p>12. Moses zerbrach aus Zorn die Tafeln und machte [andere] Tafeln; er zerstörte das Götzenbild, damit kein anderes mehr entstände. Weil Jeroboam böse war, machte er gottloserweise ein anderes Kalb.</p><p>13. Getadelt wird der erste; es kam aber der spätere und heilte den Körper. Nicht getadelt wird Aaron, da er das Kalb gemacht hatte, wie Jeroboam, der Kälber gemacht hatte; wer später kommt, an dessen Hals wird die Schuld des ersten gehängt.</p><p>14. Der Fremde folgte dem Werke jenes Schöpfers. Kain wird nicht so getadelt wie die Kreuziger, die seinem Werke vielfach folgten. – Verkehrt muß man mit den Verkehrten rechten!</p><p>15. Der Gerechte heilte nicht einmal seinen Knecht, Moses, den Stammler, der Fremde aber, der Hasser des Fleisches, heilte zahllose Taube und Stumme. Die Taubstummen sollen schreien gegen die Leugner, wie taub sie sind.</p><p>16. „Der den Körper liebt“ [der Gott des Alten Testaments] reinigte die Mirjam [Schwester des Moses] und den Naaman vom Aussatze; "der Hasser des Fleisches“ heilte die zehn Aussätzigen, damit sie jene Ankläger widerlegen, denn nach ihrer Meinung muß man den [mehr] tadeln, der mehr getan hat.</p><p>17. Und wenn, wie sie behaupten, die Natur des Körpers und der Dämonen eine ist, und unser Herr seine Füße, Hände, Augen, Ohren und seine anderen Glieder geheilt hat, so hat er einen bösen Geist wieder hergestellt und bewirkt, daß er wieder aufstehen und freveln konnte.</p><p>18. Unser Herr aber möge der Prüfungsofen [Schiedsrichter] zwischen uns und ihnen sein! Er fand den Mund des Taubstummen geschlossen, unser Herr öffnete ihn, und dieser pries ihn dafür. Den Mund des Dämonen, der ihn pries, verschloß er schnell.</p><p>19. Und wenn der Leib ein häßliches Gefäß [Werkzeug] des häßlichen Bösen ist, seine Instrumente, die Sinne des Körpers, abgenützt sind, so kam ja unser Herr, stellte sie wieder her; er festigte die Harfe, die er heilte, und gab ihr wieder einen gesunden Körper.</p><p>20. Wenn es notwendig war, daß er [= der Fremde] die Ohren öffnete seiner Worte wegen, was sollten die Augen, die er öffnete, sehen? Sollten sie ihn sehen, der doch nicht körperlich ist? Oder die Geschöpfe, da er doch nicht der Schöpfer ist? Wen priesen sie denn?</p><p>21. Und wenn der Fremde so weise war, daß er die Augen öffnen konnte, [geschah es etwa] damit die Menschen sähen, wie schön der Himmel ist, etwas, was nicht sein [Eigentum, Werk] ist? Denn das Seinige, das eigentlich nicht existiert, hat er nur mit den Namen dargestellt.</p><p>22. Da die Hände, die er gab [wiederherstellte], nicht vom Fremden gemacht sind, so ist er, wenn sie zum [guten] Werk mitwirken, gerecht, wenn sie aber zur Sünde dienten, dann ist er böse. Gepriesen sei der, der Hände gab, auf denen wir seinen Leib empfangen!</p><p>23. Ferner sind doch die Füße, die er [den Lahmen] gab, dazu da, damit wir auf seiner Erde stehen und wandeln. Er hätte aber auch Flügel geben können, wenn er der Fremde ist, obwohl die Luft auch nicht sein ist. Gepriesen sei, der alles Angemessene gab im Verhältnis zu den Gliedern!</p><p>24. Er unterscheidet und gibt: er gab uns die Erde für die Füße, das Licht für die Augen und für die Ohren Laute und Worte. Durch dieses beglaubigte er sich als König über alles.</p><p>25. Der Mund, den er uns gab, ist für sein Fleisch und seinen Kelch, die Augen, die er schuf, für seine Schriften, und für seine Kirche gab er Füße. Wenn dieses auf den Fremden paßt, dann sind die Leugner widerlegt.</p><h2>44</h2><p>Nach derselben Melodie.</p><p>1. Was dachten wohl die Geheilten von dem Erlöser, etwa, daß er nicht der Schöpfer sei, sondern sein Gegner? Und was sahen sie wohl von seiner Schöpfung? Er verbarg seine Schönheit und begann, die Schönheit seines Genossen [des Schöpfers] zu zeigen.</p><p><em>Kehrvers:</em> Dir sei Preis von allem, was du geschaffen auf den Wink deines Vaters!</p><p>2. Der Blinde, der den Herrn des Lichtes sah, brachte Lobpreis dar; denn ohne Licht wäre er blind gewesen, auch wenn er ihm zehntausend Augen gegeben hätte. So pries er den Sohn des Schöpfers und den Schöpfer.</p><p>3. Zwei Werkmeister erstanden dem Gefäß, es in Ordnung zu bringen: der Gute ordnete, und es erhob sich Lobpreis; der Gerechte ordnete, und es entstand Lästerung. Nach dem Augenschein urteilten die Leugner freventlich.</p><p>4. Handelte der Fremde aus Zorn oder Erbarmen? Wenn gewalttätig im Zorn, dann handelt er ganz verkehrt wie ein Verderber, und wenn in Erbarmung, dann ist ihm jene unseres Gottes zuvorgekommen.</p><p>5. Und wenn der Schöpfer sich zur Materie herabließ, so liebte sie unser Herr noch mehr, denn er heilte viele Leiber, die von ihr stammen, nach der Behauptung jener. Möge sich über sie der Heilige erbarmen, über den sie lästern!</p><p>6. "Man gießt nicht neuen Wein in Schläuche, die veraltet sind.“ Er gab darum die Sinne wie die Gebote, ein neues Ohr wie ein [neues] Gebot. Denn von einem Ohr, das alt geworden, werden neue Stimmen nicht vernommen.</p><p>7. Und dieses ist ein Wunder, daß er nicht die alten Gebote gab, aber keine fremden Glieder. Die Sinneswerkzeuge, die er heilte, bezeugen es laut, daß, obgleich er neue Aussprüche gab, er doch nicht fremd ist.</p><p>8. Es war nichts Großes, daß er [neue] Gebote statt der [alten] Gebote gab, denn das ist leicht. Er gab aber der Sonne einen anderen Glanz, keinen überflüssigen, sondern damit ihr Glanz anders sei als der der Gestirne.</p><p>9. Mögen sie sich nun in ihrem Kopf ein anderes Licht vorstellen, das nicht dieser sein Glanz ist und nicht sein Schimmer und nicht seine Farbe, sondern etwas ganz anderes: Das Licht bezeugt, daß sie keinen fremden Gott bilden können.</p><p>10. Und wie schwach sind siel Nicht einmal eine Finsternis können sie sich vorstellen außer dieser; nur nahekommen [?] können sie ihr, ob sie schwächer oder stärker ist. Und wie erfolglos mühen sie sich ab, den fremden Gott darzustellen!</p><p>11. Wie fremd sie ihn auch machen, sie kommen doch [wieder] zu unserm Schöpfer, den sie lästern, ohne daß sie es merken, und den sie loben, ohne es zu wissen; und so sehr sie sich abmühen, bei ihm geraten sie in Verwirrung, denn es ist kein anderer.</p><p>12. Wenn sie den Herrn der Zeiten kennengelernt hätten, würden sie sich auch in bezug auf seine Zeit nicht verirrt haben. Wie schwach sind sie, daß sie nicht einmal merken, wie schwach sie sind! Sie mischen in ihrer Schwäche Gestalten [äußere Formen] untereinander und trennen auseinander.</p><h2>45</h2><p>Nach der Melodie: O mein Schüler.</p><p>1. Kinder der Wahrheit, bringt Lobpreis dar! Denn eure Verfolger sind eure Herolde und eure Hasser eure Bürgen. Sie haben Bürgschaft geleistet und niedergeschrieben und bestätigt dieses: Der Leib unsers Herrn und Allbelebers ist ein wirklicher; anstatt auf eine Rolle haben sie es auf das Brot geschrieben, das sie brechen, ohne Tinte, mit Wein haben sie es gezeichnet, ihnen zur Beschämung, euch zur Krone.</p><p><em>Kehrvers:</em> Preis sei dem Sohn des Herrn des Alls von seiner ganzen Schöpfung!</p><p>2. Wenn der Fremde ein Gesetz gegeben hat, was soll sein Gesetz wohl bewirken? Wenn böse Dinge offenbar sind, so sind es noch mehr als diese die guten. Er hat nämlich weder zu essen, noch zu trinken, noch zu sehen, noch zu stehen, noch zu sitzen, noch zu hören, noch aufzusteigen geboten, damit wir sehen, durch welche Kraft er das Leben verlieh.</p><p>3. Und wenn auch er uns diese Dinge nicht versagt, so müssen wir [wieder] fragen: wenn er sie als böse Dinge nicht verwehrt, so ist es eine Schande für den Fremden; und wenn er sie, weil sie gut sind, uns erlaubt, siehe, dann ist es eine Krone und eine Belobung für dich, unsern Schöpfer. Durch alles, was sie sagen mögen, werden sie gefangen, denn es beschämen sie alle Geschöpfe.</p><p>4. Es war ihm nicht genug, jene nicht blind zu machen, denen die Augen geöffnet waren, um Satan blind zu machen, sondern er machte sogar die Blinden sehend, damit der Böse auf die Begierden achten könne. Der Gerechte nahm das Böse im Fleische gefangen und schloß vor ihm die Tür des Mundes, der Ohren und der Augen; der Fremde öffnete das Gefängnis und ließ die Sünde, die eingeschlossen war, frei.</p><p>5. Die ganze Natur schilt sie aus, aber wie hartnäckig sind doch die Leugner! Die ganze Natur weist sie zurecht, aber wie hochmütig sind doch die Unkraut pflanzen! Die Erde, die sie nährt, der Himmel, der sie speist, die Sonne, die erleuchtet, sind zu gering für sie. Wenn sie [Gott] preisen würden wegen der Nahrung, wäre es ja aus mit der Lästerung! Ihr Mund aber versagt die Lobpreisung.</p><p>6. Wer die Ehe lästert, ist eine verfluchte Frucht, die ihre [eigene] Wurzel verflucht. Zwei böse Dinge sind es, in denen die Leugner zur Vollendung gelangt sind: Groß ist die Lästerung, wenn ein Mensch seinen Schöpfer verleugnet, groß ist die Schmach, wenn ein Mensch seine Wurzel [Ursprung] verleugnet. Sie haben nun die Bosheit völlig angezogen und sind wie Giezi mit Aussatz bedeckt.</p><p>7. Sie erklärten also die Ehe für unrein und beachteten wegen ihrer Trunkenheit nicht, daß die Glieder und die Sinne Brüder sind, Genossen und Verwandte. Wenn also der Gebrauch eines Gliedes unrein ist, dann ist klar, daß alle Glieder unrein sind, gleichwie, wenn ein Glied leidet, alle mit leiden, wie geschrieben steht.</p><p>8. Sie halten ein Auge vom Lichte ab, doch es besteht eine Gemeinschaft zwischen beiden; sie halten ein Ohr vom Schalle ab, siehe, es besteht aber eine Vermischung zwischen beiden; sie trennen auch das Wort von der Zunge, denn auch dieses ist eine reine und lautere Verbindung. Diese reinen Verbindungen rufen laut, daß auch die Ehe rein ist.</p><p>9. Und wenn er nicht den Gebrauch der Sinne und Glieder für unrein erklärt hat, sondern nur [befohlen hat], daß der Mensch nicht auf sündhafte Weise das Sehen gebrauche, und daß der Mensch nicht auf sündhafte Weise das Gehör benutze, dann ist sein Gesetz ein Vervollkommner unserer Natur und sein Gebot ein Verschönerer unseres Willens und seine Lehre die Krone unserer Freiheit, und verschwunden und zugrunde gegangen ist die Fremdheit [die Lehre von einem fremden Gotte].</p><p>10. In drei Formen nämlich ist uns das Gesetz zugeteilt: denn es gibt Ehre und Heiligkeit und Jungfräulichkeit, [sowie] Besitz und Entäußerung und Vollkommenheit. Von bösen Handlungen hält es gleichmäßig jeden Menschen zurück, zu guten Handlungen läßt es auf jede Weise jedem Menschen Freiheit nach seinem Willen.</p><p>11. Die Gesetze, die bestanden und noch bestehen, hängen an der Gerechtigkeit und an der Güte, denn es gibt kein Gesetz, das zwänge, Ehebruch zu treiben, zu stehlen oder zu rauben; wiederum gibt es kein Gesetz, das verböte, gütig, keusch, ehrbar und wahrhaftig zu sein. Gewohnheit und Wille führen ins Verderben, Gesetz und Wille bringen Ordnung.</p><h2>46</h2><p>Nach der Melodie: Das ist der Monat.</p><p>1. Wer vermag wohl den Körper des Menschen besser einzuschätzen als der Böse? Es sah der Teufel, dass unser Herr dich liebte, und siehe, er machte sich an dich und an deine Kleider heran. Es genügt dieses, daß du sie widerlegen kannst, wie sehr sie dir Unrecht tun.</p><p><em>Kehrvers:</em> Dir sei Preis, Sohn des Allbelebers und durch dich deinem Vater!</p><p>2. Wenn du [= der Körper] krank bist, so daß keine Heilmittel mehr sind, kommen die Periodeuten [Sāeôrē] herbei zu dir und beten; einer haucht dich an, einer bezeichnet dich. Wenn du nun vom Bösen bist, beten sie vom Bösen aus über dich und bezeichnen dich?</p><p>3. Und wenn du gestorben bist, erhebt man Klagen über deine Trennung [von der Seele], wäscht man dich und balsamiert dich ein, schüttet die Börsen aus, man schmückt dich und dann trägt man dich auf den Schultern. Die Klageweiber legen über dich Zeugnis ab, daß du gut bist.</p><p>4. Und wenn diese Seele, die im Körper ist, noch nicht weggeht und noch ein wenig in deinem Grabe verweilt. nicht atmend vor Trauer, so zeugt ihre Liebe von deiner Auferstehung, die mit ihr verknüpft ist.</p><p>5. Und wenn sie dich ruft, so dürstet sie darnach, daß du ihr aus dem Grabe antwortest. Und wie soll sie deine Auferstehung leugnen? Siehe, sie wünscht auf jede Weise, daß du auferstehest, und wenn sie könnte, erkaufte sie mit all ihren Gütern dein Leben.</p><p>6. Offenkundig ist freilich, daß die Bösen über deine Auferstehung lästern; und wenn es möglich wäre, würden sie doch hier die Wiederbelebung ihrer Lieben erkaufen, jene Auferstehung [am Jüngsten Tage], die umsonst ist, bekennen sie freilich nicht!</p><p>7. Und wenn du [o Leib] vom Bösen bist, wie die Dämonen vom Bösen sind – über einen Dämon, der ausfährt, freut sich jeder; über dich aber ist man betrübt, wenn du dich entfernst. Dieses genügt den Kindern der Wahrheit über deine Auferstehung.</p><p>8. Deine Geburt ruft vom Anfang her, denn sie ist gar sehr gern gesehen. Dein Tod zeugt von deiner Auferstehung, denn hart und bitter ist dein Abscheiden. Zwischen deinem Anfang und deinem Ende ist die Auferstehung abgebildet.</p><h2>47</h2><p>Nach der Melodie: O mein Schüler.</p><p>1. Der Stolz der hebräischen Bräute war ihr Schleier; siehe, auch in unserm Schleier liegt unser Ruhm, das über alles kostbare Blut Christi. Die Gemeinden der Abtrünnigen haben in ihren Schleiern das wahre Blut Christi nicht, ein Bild nur, das ihm ähnlich ist, haben sie, denn sie glauben nicht an den Leib Jesu. Wo der wahre Leib ist, ist auch das wahre Blut.</p><p>2. Wenn [nach Meinung der Häretiker] unser Herr den Leib verachtete, weil er unrein, befleckt und häßlich ist, dann ist auch befleckt und häßlich das Brot [Eucharistie] und der Kelch des Heiles bei den Leugnern. Wie? Hat er denn den Leib verachtet und sich doch mit dem Brote bekleidet? Denn siehe, das Brot ist doch ein Verwandter des schwachen Leibes. Wenn ihm nun aber das stumme Brot wohlgefiel, um wieviel mehr dann der Leib, der ja der Sprache mächtig ist. Auch im Brote ahmte er den Gerechten nach, denn dessen Tisch liebte das Schaubrot.</p><p>3. Über das Hochzeitsmahl in Kana schmähen sie, es hätte nämlich unserm Herrn fern liegen sollen, dahin zu gehen; und doch nennen sie die Kirche die Braut und unsern Herrn den wahren Bräutigam. Und das Geheimnis des Hochzeitsweines in ihren Kelchen ist ein Bild des Mahles bei ihren Festen. Die Irrlehre ist also unsinnig, denn sie widerlegt sich selbst jederzeit, ohne daß sie es merkt; was nämlich ihre Worte leugnen, widerlegen ihre Handlungen. Möchten doch die Leugner, die Kinder der Hölle, zu Gästen deines Paradieses werden!</p><p>4. Auch der Fremde, der zu keinem Hochzeitsmahl ging, damit er sich weder dem Namen noch der Sache nach ergötzte, ergötzte sich doch als Bräutigam alle Tage. Johannes aber war Asket und Einsiedler und fastete auch; die Söhne des Brautgemachs [= Hochzeitsgäste] können nämlich nicht fasten, die Söhne des Schöpfers aber fasten. Der Fremde, der gar nicht existiert, ist vergnügungssüchtig. — Beten wir für sie, damit sie sich bekehren, denn sie sind Glieder, die von uns weg in die Gefangenschaft geführt sind. Ihre Banden liegen in ihren Büchern und ihre Fesseln in ihren Schriften.</p><p>5. Sollte aber der Leugner sagen: „Nur zum Scheine verehren wir diese Dinge [Brot und Wein]“, so besteht also jene Lehre nur im Scheine, nicht in Wahrheit. Sie mögen daher nur gleich den Satan verehren, wenn die Natur des Bösen und des Brotes dieselbe ist. Warum gilt ihnen [überhaupt] der Böse als unrein und das ihm verwandte Brot als etwas Heiliges? Preis sei dir, der du wie mit einem Schwerte das Wort der Wahrheit herausschneidest!</p><p>6. Anstatt jenes Brotes, des Schaubrotes nämlich, brachten sie Honig und Milch dar; da diese aber ganz rein sind, konnten sie so keine Verwirrung anrichten; Honig wurde nämlich nicht zum Opfer dargebracht und Milch nicht zu Besprengung und Trankopfer [benutzt]. Schaubrote brachten sie nur als Symbol dar, und Blut und Wein opferten sie nur als Vorbild. Die Kreuziger und die Irrlehrer widerlegt das Symbol, von dem Moses schrieb.</p><p>7. Was drängte wohl unsern Heiland, das Brot zu brechen? Vor zwei Dingen mußte er sich [nach Ansicht des Markion] als der Fremde hüten: erstens, daß er lehrte, daß er nicht einen Leib, der unrein ist, angenommen, und zweitens, daß er nicht dem Schöpfer glich, daß Schaubrote nicht dargebracht und auf seinem Tische geopfert wurden. – Dir sei Preis, der du wie in einem Schmelzofen das unechte Erz der Irrlehre offenbar machtest!</p><p>8. Wenn er den Leib nur zum Scheine angezogen hat, können sie nur einen Schatten brechen, und wenn er nur einen Schein von Blut zeigte, gießen sie auch nur einen Schatten von Wein in den Kelch. Wenn sie aber wahres Brot brechen, so berühren sie ihn wahrhaftig und nicht bloß scheinbar. Einen wahren Leib berührte die Sünderin, die sich unserm Herrn nahte. Gepriesen sei, der zu Thomas sagte, er solle den Leib und nicht einen Schatten berühren! Gepriesen sei, der das irrende Schaf, den Geist, der in allem irrt, wiederfand!</p><h2>48</h2><p>Nach der Melodie: Getötet wurden die Kinder.</p><p>1. Markion, der vom Fremden schreibt, war doch dem Fremden fremd, denn der Fremde nennt nicht einmal die Hyle, die der Leugner einführte. O der Fehlgeburt, die erst gestern auftrat, von wem hast du erfahren, daß ein Vertrag zustande kam zwischen der Hyle und dem Schöpfer? Und wenn er sie, oder sie ihn betrogen hat, so ist der Vertrag, wenn er bestand, aufgelöst. Preis sei dir, dem einen in der Wesenheit!</p><p><em>Kehrvers:</em> Preis sei dem einen in der Wesenheit!</p><p>2. Moses schrieb, daß Gott selbst Himmel und Erde erschaffen hat; aus der Erde, die er geschaffen, bildete er uns, und der Name Schöpfer bezeugt es. Wenn nun die Hyle etwas Einheitliches wäre, woher dann die zahllose Menge von Arten: Himmel, Wasser, Feuer, Finsternis, Licht und Wind; Naturdinge, die voneinander verschieden sind?</p><p>3. Und weshalb bedurfte die Hyle der Seele, die vom Schöpfer ist, und [weshalb] konnte nicht ihr eigener Hauch dem Staub Leben verleihen? Und wenn der Hauch von der Hyle dem Staube fremd ist, und wenn sie dem eigenen fremd ist, um wieviel mehr ist der Hauch des Schöpfers den beiden fremd?</p><p>4. Wenn nun der Leib nicht von der Hyle ist, sondern nur von ihrem Besitztum, und die Seele nicht vom Schöpfer, sondern Besitztum des Schöpfers, so finden sich zwei Herren, Besitzer und ihre Besitzungen. Behalte es, Hörer, in deinem Geiste! Es gibt demnach vier fremde Wesen, die die Lehre der Leugner einführte.</p><p>5. Wozu bedurfte der Schöpfer jenes von der Hyle [stammenden] Leibes? Um seinen Geist in ein Gefängnis einzuschließen? Andere lassen frei, er aber schließt ein. Wenn aber der Geist ohne Leib nichts wirken kann, ist er also am Orte des Fremden [im Himmel] leer von Bewußtsein? Denn der Körper fuhr ja nicht mit ihm auf.</p><p>6. Siehe, kann die Seele in ihren Körpern das Licht sehen ohne Augen und die Stimme hören ohne Ohren? Wenn sie nur das Wort des Fremden an taube Ohren in den Schriften gerufen hätten! Sehet, beide sind schwach; der Gute, der die Ohren nicht öffnete, und die Seele, die seine Stimme nicht hörte.</p><p>7. Es wäre auch für den Gerechten nicht recht gewesen, die Seele, die von ihm stammt, dem bösen Leibe, der von der Hyle kommt, beizugesellen; denn wie könnte er seinen Gegner lieben? Er liebte also einen Teil, und den andern Teil haßte er. In der Höhe ist der Leib des Elias, jene des Kore und Dathan sind im Abgrunde; der Körper des Moses und der des Giezi: den einen bedeckte Aussatz, den andern Lichtglanz.</p><p>8. Wie redeten ferner [bei der Verklärung] mit dem Fremden vom Berge her Moses und Elias? Wenn sie im Leibe mit ihm redeten – siehe, die Auferstehung ihrer Leiber [geht daraus hervor]; wenn sie aber nur einen Schein vom Leibe zeigten, so konnten sie [die 3 Jünger] deutlich sehen, daß er [der Fremde] schwach und nicht imstande ist, ihren Glanz zu sehen; sie aber vermochten ihn zu schauen.</p><p>9. Wenn aber Moses und Elias sich wegen der drei Jünger des Fremden in Scheingestalten hüllten, um zu belehren, so hätten sie, anstatt gerade mit dem Fremden zu reden, der dessen nicht bedürftig war, vielmehr seine Jünger belehren sollen, die Hebräer, ihre Stammesgenossen, daß dieser Christus der Fremde ist.</p><p>10. Und wenn der Fremde es nicht ertragen konnte, daß er seines Sohnes auf Erden vergäße, und ihm sogar aus der Höhe zurief: „Dieses ist mein Sohn und mein Geliebter“, wie hätte der Gerechte, wenn er beraubt war, es ertragen können, nicht zu rufen und seine Anhänger zu warnen? Sein Schweigen überführt die Leugner, denn er konnte da nicht schweigen.</p><p>11. Auch wäre, meine Brüder, der Gerechte nicht gerecht, wenn er die gefangenen Naturen zwingt. Wenn nämlich der Leib seiner Natur nach böse ist, die Natur der Seele aber gerecht, warum sollte sich da das Gesetz abmühen? Die Natur kann ja nicht verändert werden. Wenn es sich aber abmüht, damit er sich ändere, will es etwas Häßliches schön machen; wenn er [der Leib] aber gut ist, dann wird er auch auferweckt werden.</p><p>12. Auch wäre, meine Freunde, der Gute nicht gut, denn auch er hat Gesetze gegeben. Er löste die leichten Gesetze auf und gab uns schwere Gesetze; wenn nun die leichten schon schwer waren, wer kann die schweren beobachten? Wenn aber die schweren doch beobachtet werden können, dann noch mehr als sie die leichten. – Was sie [die Gegner] auch wählen, sie sind gefangen.</p><p>13. Sind denn ferner die Körper aller Tiere von Gott geschaffen? Die Körper der Menschen sind teils lieblich, teils häßlich. Und wenn sie ihrer Natur nach Kinder der Hyle sind, warum sind die Tiere verschieden? Es gibt nämlich unreine und reine; oder haben die Lämmer nicht das Gebot beobachtet und haben die Wölfe nicht das Gesetz übertreten?</p><p>14. Und was die Seele der Tiere betrifft, so mögen sie [die Gegner] uns sagen, von wem sie ist; wenn sie vom Gerechten ist, dann ist er nicht gerecht, weil er in einem kriechenden Tiere seinen Geist wohnen ließ; es ist aber auch der Gute nicht gut, weil er die ihm verwandte Seele vernachlässigte. Hat er nun die in uns wohnende Seele aus Schwäche vernachlässigt oder aus Bosheit?</p><p>15. Wenn aber die im Kriechtier wohnende Seele von der Hyle ist, dann gehören auch die reinen Tiere der Hyle. Und wie kann Gott der Opfergeruch aus der Hyle wohlgefällig sein? Denn wenn das ganze Tieropfer von derselben Natur ist, dann ist unrein die Seele und auch der Leib.</p><p>16. Und wenn die Hyle etwas Körperliches ist, wie können da die Dämonen, die von ihr herstammen, fein und geistig sein? Den Satan nennen sie Hyle, wie aber kann etwas Körperliches von ihm sein? Denn jener ist unsichtbar, diese aber sichtbar. Oder gibt es zwei Hylen [ewige Materien], die ihrer Natur nach verschieden sind, während sie dem Namen nach übereinstimmen?</p><p>17. Und wenn die Seele ein Hauch ist, woher sind die geistigen Wächter [= die Engel]? Wenn die Engel aus dem Nichts sind, dann ist auch die Seele aus dem Nichts. Wenn aber alles vom Schöpfer ist, warum haben die Engel nicht nötig, daß sie vermittels der Natur des Körpers sehen? Die Seele kann ja ohne Sinneswerkzeug weder sehen noch hören.</p><p>18. Und wenn den Dämonen, den Kindern der Hyle, der Leib, der [auch] von ihr ist, als etwas Verächtliches erscheint, weshalb verlangte der Schöpfer, daß sein Hauch in ihm wohne? Und warum kann ein Dämon keinen Körper lebendig machen und in ihm wohnen? Und wenn der Körper dem seinigen fremd ist, wie sollte er da der Seele verwandt sein? – Wie sehr lügen doch die Leugner!</p><h2>49</h2><p>Nach der Melodie: Herde des Bardaisan.</p><p>1. Markion ist bloßgestellt, denn er war nicht imstande, auf der Erde einen neuen Namen einzuführen neben dem Namen Jesu, der schon im Gesetze geschrieben steht, und dem Namen des Heiligen Geistes, des Schatzes der Prophetie, und dem Namen Gottes, den jegliche Natur kündet als die Beweise unseres Sieges.</p><p><em>Kehrvers:</em> Preis sei deiner Gerechtigkeit!</p><p>2. Wir müssen über den Leugner staunen, der tagtäglich in der guten Gabe des Herrn des Alls schwelgt, aber einen anderen bekennt, der gar nicht existiert, der nicht einmal die Fingerspitze zu befeuchten und die Gewalt des Fiebers zu binden vermag. Wohin kann er [noch] fliehen? Der flüchtige Jonas überführt den Leugner.</p><p>3. Der Atem in seiner Nase ist ein [Nasen-]Ring, um ihn [dahin] zu ziehen, daß er seinen Schöpfer erkenne. Sein Hunger ist ein Zaum, damit er wieder um seinen Ernährer erkenne. Auch sein Schlaf ist sein Zügel. An ihm selbst sind die Zugmittel. Seine Fesseln sollen ihn belehren, daß es keine andere Kraft gibt, die sie lösen könnte.</p><p>4. Sehr töricht und verblendet ist er, denn er ist auch mit allem in der Hand des Schöpfers eingeschlossen, ein Stückchen Erde, ein Wassertropfen, das eine mit dem andern gemischt, und zum Bild des Menschen geworden durch die Barmherzigkeit des Schöpfers – siehe, dieses niedrige und verworfene Wesen leugnet [den Schöpfer], das gefesselte und abhängige lästert!</p><p>5. Die Engel spotten seiner, die Seraphim verhöhnen ihn, die Cherubim lachen über ihn! Die Berge lassen sich befehlen, die Meere gehorchen, die Erde empört sich nicht, der Himmel lästert nicht. O des Erdenstaubes, während alle preisen, leugnet er um zu sterben!</p><p>6. Sie alle [die Ketzer] spalten und teilen den Namen, der sich niemals spalten und teilen lässt. Ein Leugner nämlich [Markion] leitete von dem Namen Gottes einen andern Namen ab, einen verfluchten und fremden, und zwei seinesgleichen [Bardaisan und Mani] machten aus dem Namen des einen Wesens getrennte Wesen [Äonen].</p><p>7. Preis sei deiner Majestät, die die Geschöpfe fesselte und die Seelen frei ließ! Und wenn es eine andere Macht gibt, so kann sie doch nicht die Seelen bewegen, denn die Seele ist Herrscherin über die Bewegungen ihrer Freiheit. Und wenn jene [die andere Macht] stark genug ist, so möge sie die gefesselten Naturen der [unfreien] Geschöpfe lösen!</p><h2>50</h2><p>Nach derselben Melodie.</p><p>1. Beschämt ist Markion, der irrte und in Irrtum führte, denn es ist kein anderer [Gott], nur einer ist, dessen Name seinen Werken gleichen. Er erschafft und ernährt uns, richtet uns und erbarmt sich unser, er züchtigt und besitzt uns, er erlöst und belebt uns; sein Gericht ist gerecht, seine Gnade voll der Güte. Wo ist da der Fremde?</p><p><em>Kehrvers:</em> Preis sei deinem Glanz!</p><p>2. Beschämt ist auch Bardaisan, der sich verirrte und auch in die Irre führte, und er lehrte, daß viele im Gesetze geredet hätten; er hat sich getäuscht, ohne es zu merken, denn die Wahrheit ist eine einzige, die sich aber vielfältig zeigt in ihren Gesetzen, sich ausbreitet in ihren Aussprüchen, mannigfaltig in ihren Heilmitteln, überfließend in ihren Geschenken; aber in allem ist nur eine.</p><p>3. Beschämt ist ferner auch Mani, der verdarb und verdorben ward; er lehrte, daß [der alttestamentliche] Gott nach den Opfern gehungert habe und sie deshalb verlangte; das Feuer seiner Zerstörung [?] belehrt den Leugner, denn es verzehrte die Opfer des Volkes, das umherzog. Der Gute verlangte Opfer, um es durch die Opfer von dem Opfer der Dämonen abzuhalten.</p><p>4. Beschämt wurden ferner die Juden, denn sie erforschten und untersuchten nicht die Ursache [Zweck] des Gesetzes, sondern machten sich daran, die Kraft der Gebote aufzulösen und sich sinnlos in [leeren] Schall von Worten zu hüllen, weil sie sich keine Mühe gaben, den Prüfungsofen des Denkens zu erwerben, um in ihm die Wahrheit und die Kraft [den Sinn] der Lesung zu prüfen.</p><p>5. Warnen wir die Anhänger der Mani und verbinden wir ihre Wunden! Den Heiligen erzürnen sie durch Donnerschläge und Blitze, die nach ihrer Meinung die geile Stimme eines Archonten sind, der eine Jungfrau erblickt, und durch das Donnerkrachen, durch das ihr Herz erbeben müsste, und …… erregen sie großen Zorn.</p><p>6. Und der Donner gehört der Reinheit an, denn es fürchtet sich selbst ein unreiner Mensch in einem solchen Augenblicke, der Unreinheit sich hinzugeben. Mani redete in solcher Zeit ausgelassene Dinge. Fliehet vor ihnen, Brüder! Es möge euch nicht täuschen jene [ihre] äußere Farbe, denn eine Farbe des Giftes ist sie, weil das Haupt ihres Geschlechtes die Schlange ist.</p><p>7. Warnen wir den Anhang Markions, der in seinen Lesungen [Büchern] den Reinen und Heiligen anklagt, daß er auf den Berg geachtet habe und sich schmählich benommen habe. Darum habe das Volk, das sich heiligte, auf dem Berge Sinai nur gezwungenermaßen Zeugnis abgelegt. – Wenn er aber die ausschweifenden Hebräer heiligte, wieviel mehr mußte er selbst heilig sein!</p><p>8. Vom Geiste, der wirklich über den Wassern schwebte, nehmen sie ein anderes Schweben an, das nicht angemessen ist, und sie lästern [indem sie sagen], daß der Fremde den Schöpfer unterworfen habe. – Fürchtet euch vor ihnen, Brüder, und lasset euch nicht täuschen durch ihren äußeren Schmutz, er ist [wirklich] Bild und Schatten jenes [ihres] inneren Schmutzes.</p><h2>51</h2><p>Nach derselben Melodie.</p><p>1. Wie konnte der Gute, der süße und liebliche Wohltaten spendete, auch furchtbare und gewaltige Übel geben? Er ist ein verständiger Arzt, der weiß, dass die Heilmittel verschieden sein müssen. Er spendete Heilmittel der Güte, und er spendete solche der Gerechtigkeit, um einem jeden Kranken das zu geben, was für ihn zutrifft,</p><p><em>Kehrvers:</em> Preis sei deinen Heilmitteln!</p><p>2. Die Krankheit der Gotteslästerung und das Leiden des Stolzes fand sich bei den Kreuzigern, und der Arzt erkannte das Leiden, daß es ein furchtbares Übel und ein abscheulicher Schandfleck sei: da legte er allerlei Wehe auf, Brennen aus Gerechtigkeit, um durch Strenge die Übel des Hochmuts zu vertreiben die infolge der Freiheit überhand genommen.</p><p>3. Das Buch des Jesaias erzählt von ihnen [den Juden] furchtbar voller Drohungen die Leiden, die niemals zur Heilung kommen, weil sie sich empörten und sich vom Schatze der Heilmittel entfernten, denn sie sind ein Volk, dessen Wunden stündlich wieder aufbrechen, und bei dem die Quelle seiner Krankheit nie versiegt.</p><p>4. Jene Philister, deren Beulen aufbrachen wegen ihrer Sünden, wußten, daß Heilmittel für ihre Krankheiten angewendet werden müßten, und es ward ihnen volle Heilung ihrer Krankheiten zuteil; sie brachten dem unsichtbaren Arzte, der in der Bundeslade wohnte, Opfer dar, als Dank für seine Hilfsmittel.</p><p>5. Jener gute Arzt, der Sohn des unsichtbaren Arztes, der aus Gnade gesandt wurde, um die Krankheiten zu heilen und die Schwächen zu beseitigen, öffnete unter dem Volke der Hebräer seinen reichen Schatz an seinen Heilmitteln, und es wurden durch seine Arzneien die Kranken gesund, die sich aber dann erhoben und ihm mit dem Kreuze vergalten, das sie ihm bereiteten</p><p>6. Eine unheilbare und nicht zu verbindende Wunde erweichte er durch Öl, aber da brach die Quelle ihrer Schmerzen auf, und ihr Leiden siegte über die Arzneien und wurde hartnäckiger. Er gebrauchte sanfte Mittel und ruhte nicht, er gebrauchte strenge und ließ nicht nach, er mischte Arzneien und wandte sich nicht ab, er wurde nachsichtig und hörte nicht auf.</p><p>7. Es kam der unsichtbare Arzt, der die verborgenen Dinge erfaßt, und untersuchte jenes Volk, das irrte und in die Irre führte, und sich selbst schmückte. Er mischte seine Milde mit dem Wehe der Gerechtigkeit, um in den Kampf gegen das verborgene Übel einzutreten, damit er als Arzt das Heilmittel für die Heilung zuverlässig mache.</p><p>8. Der Gute sah, daß das Volk am Willen krank sei. Krank ist der, der nicht will, daß er zur Genesung gelange. Wunden lassen sich verbinden, Leiden können geheilt werden, schwer aber ist es, einen kranken Willen zu heilen; wenn er aber nachgibt, dann kann der Arzt mit seinen Mitteln obsiegen.</p><p>9. Eine häßliche versteckte Gewohnheit ist schwer zu heilen, denn sie ist ein tückisches Leiden; im geheimen schwillt es an, um dem Arzte zu entfliehen, denn verborgen schleicht [wie ein Tropfen] der Tod ins Herz hinein. Auswendig sieht er [der Kranke] schön und gesund aus, im Innern aber ist er faul und modernd; deshalb hat er sie mit geschmückten Gräbern verglichen.</p><p>10. Er öffnete in seiner Güte jenen Schatz des Lebens, damit jeder Mensch in seiner Freiheit wähle und sich die für ihn geeignete Medizin aussuche. Er ist ein Arzt, der niemals in unseren Krankheiten an scharfen Schnitten und starkem Brennen Gefallen findet, sondern an einem guten und milden Heilmittel, um unsere Wunden zu beseitigen.</p><p>11. Wenn nun der Gute, obwohl nicht drohend und leidenschaftlich, doch gegen die Frevler einen sehr scharfen Schnitt, eine sehr starke Arznei, ein sehr heftiges Brennmittel, eine sehr weiche Binde anwandte, so sollen ihn seine Diener nachahmen, um mit dem Eifer der Wahrheit und der Arznei der Gerechtigkeit [Strenge] die Irrenden zu heilen.</p><p>12. Das „Wehe“, das unser Herr ausgesprochen, komme über Markion, der über seinen Schöpfer gelästert hat. Das Heilmittel selbst ist ein Beweis gegen die Krankheit der Lästerung, daß er nämlich nicht der [strengen] Gerechtigkeit wegen jenes „Wehe“ ausgesprochen habe; und da er [Markion] seinen Wundarzt verleugnete, wurde seine Krankheit nicht geheilt; er behielt seine Krankheit und ging dahin und hat sie sogar seinen Anhängern vererbt.</p><p>13. Das „Wehe“, das unser Herr aussprach, traf den Bardaisan, der sieben Wesen [Äonen] aufstellte; denn das Eisen der Wahrheit schnitt ihn ab und gab ihn dahin. Er verkündet die Zeichen des Tierkreises und beobachtet die Stunde [Horoskop] und lehrt die sieben Planeten und forscht nach den Zeiten. Siebenfaches „Wehe“ nahm er dafür hin und vererbte es seinen Jüngern.</p><p>14. Die „Wehe“, die unser Herr aussprach, sammelte Mani, denn er verleugnete seinen Schöpfer und lästerte den Heiligen mit jeglichen unpassenden Namen. Auch gegen Moses und die Propheten wütete und lästerte er, und weil er seinen Wundarzt leugnete, wurde er ohne Schonung zerbrochen; die Zerbrechung trug er davon und vererbte sie seinen Anhängern.</p><p>15. „Wehe“ sprach er auch über jene aus, die die Schlüssel verbargen und die Kleinen hinderten, in das Reich des Lebens einzutreten. Denjenigen, die durch das Tor, das Tor der Wahrheit, eintreten, gab er Leben; sie aber gleichen Irrenden, die bis zu ihrem Ende herumirren und die Strafe beim Rächer vermehren, der von ihnen Rechenschaft fordert; sie gehen zugrunde und stürzen viele ins Verderben.</p><p>16. Siehe also, durch die furchtbaren „Wehe“, die unser Herr aussprach, sind die Leiden weggeschnitten worden, vermittelst der guten Eisen jenes guten Arztes. Er verband sie auch durch Worte des Trostes. Wenn sie gesund wurden, herrschte Freude, wenn sie krank blieben, Furcht; denn die Toren vereitelten vielfach die ganze Sorgfalt.</p><h2>52</h2><p>Nach der Melodie: Gericht der Stämme.</p><p>1. Lasset uns gegen Bardaisan beweisen, daß niemand eine von den drei Formen des Menschen wegnehmen kann, wie man auch nicht die Formen des Feuers wegnehmen kann. Und wenn jemand eine wegnimmt, dann hat er es vernichtet, denn zu seinem vollständigen Leben gehören drei Teile, wie ja der Mensch dreifach zusammengesetzt ist.</p><p><em>Kehrvers:</em> Preis sei dem Allbeleber durch seinen geliebten Sohn!</p><p>2. Du hast gehört, daß der Hund die Türe seines Herrn liebt; von seinem Bauche aber ist auch er angetrieben worden, daß er sich verderben und umwandeln ließ. Viele Hunde sind stumm geworden, [oder] bellen die Hausleute an. Es helfen den Wölfen, wenn sie rauben, die Hunde, die zur Herde gehören; sie schädigen die Herde, sie überfallen und rauben Böcke, Lämmer und Schafe.</p><p>3. Markion wurde von Tollwut befallen und lief fort, Mani fiel in Wahnsinn und Verkehrtheit. Sie verließen die Herden und flohen, schlossen sich aber in Zuneigung und Liebe den Wölfen an, schädigten die Hirten und halfen den Dieben. Das Tor [= Palast] ihres Herrn verachteten und verhöhnten sie, und nun bewachen sie die leeren Höhlen der Diebe; statt der Kirche lieben sie die Räuberhöhlen.</p><p>4. Durch ihre Gleichnisse werden die blinden Söhne des Irrtums widerlegt, die verdorbenen und faulen, die den Vergleich mit Eierschalen gebrauchen; und als sie blindlings vor der Wahrheit flohen, fielen sie auf der Flucht dem Gericht anheim und wurden verurteilt. Während sie in ihren Gleichnissen mit dem Gerechten Krieg führten, zerbrach er ihre Gleichnisse und bekämpfte die Empörer.</p><p>5. Trunken war in seiner Lästerung Markion, und er merkte es nicht wie einer, der durch den Wein seine Besinnung vernichtet hat. Mit dem Symbol von den Geschöpfen vermischt er seine Lehre; Schale und Ei dient zur Erläuterung. Wer aber kann die Geheimnisse [Symbole] des Guten von den Geschöpfen darstellen? Sie sind widerlegt, denn der Schöpfer selbst hat uns nach seinem Bilde gebildet.</p><p>6. Ihr Gleichnis widerlegt sie, indem sie mit der Eierschale den Körper bezeichneten, die Seele mit dem Küchlein, und nicht bedachten, daß Knochen und Fleisch aus dem Ei hervorgehen, das der Erde gleicht; denn in ihr wird der Körper empfangen und zerreißt bei seiner Auferstehung die Erde und sein Grab und fliegt bei der Ankunft [Christi] empor.</p><p>7. Das [künstlich] aufgestellte Wort [der Häretiker] kann sich nicht halten [paßt nicht], denn eine doppelte Hervorbringung hat das Küchlein, die erste durch die Begattung, die zweite durch das Brüten. Der Mutterleib erzeugt durch Begattung, die Erde ohne Begattung nach dem Vorbild der Vögel; die zweite Geburt ist die Hervorbringung bei der Auferstehung.</p><p>8. Sehen wir nun, womit sie das Werk des Erlösers verglichen haben! Wenn er nämlich den Körper losgerissen hätte und die Seele [allein] hätte emporfliegen lassen, siehe, dann hätte unser Herr den Vergleich der Leugner obsiegen lassen; wenn aber gleich einem Ei die Gräber aufsprangen und die Körper aufstanden, die Begrabenen auferweckt wurden, dann hat unser Herr uns die Siegeskrone gegeben.</p><p>9. "Siehe, auch der Same legte seine Schale in der Erde ab“, und den Stengel und die Ähre nennen sie wiederum [vergleichsweise] Körper. Ein verwirrtes Gleichnis und ein Vergleich Wahnsinniger! Sie nannten also zwei Dinge Körper und machten keinen Unterschied, ob die Schale den Körper bedeutet, oder der Stengel als Bild des Körpers gilt. So bleibt das Wort in der Auslegung unverständlich.</p><p>10. Untersuchen wir weiter den Vergleich, damit wir wenn er uns weiter folgt, ihn dahin bringen, dass er zu erkennen gibt, worauf er [der Vergleich] paßt. Die Schale des Samens dient als Spiegelbild für Begierde, Zorn, Haß, die nicht mit dem Körper auferstehen bei der Auferstehung, da er wie eine Schale seine Begierden auszieht und wegwirft.</p><p>11. Siehe, seitdem Adam gestorben, verkündet das Gras, das Gott ihm gab, seine Auferstehung, und es kommt in jeder Periode wieder; es zieht seine Hülle an und aus zu jeder Zeit, um jeden, der in die Welt kommt, zu belehren. Es [das Gras] kann nämlich mit seinen Generationen nicht aufhören, bis sein Vorbild bei der Auferstehung auferweckt wird.</p><p>12. Die Eier werden von Toren für tot gehalten, sie werden [sind] aber lebendig in ihren Nestern durch die Federn der Vögel. Die Leichen sind in ihren Gräbern tot nach der Meinung der Leugner, sie leben aber für den Allbeleber im Scheol; nicht einmal für so mächtig wie die schwachen Federn der Vögel hielten sie das Schweben des Guten, der alles auferweckt.</p><p>13. Die drei werden bei der Auferstehung wieder zu einer Einheit vereinigt: Die Seele, der Geist und ihre Harfe, der Leib; der Geist wohnt im Haupte, sein Wort im Munde, und die Seele vermittelt zwischen beiden in jeder Beziehung. Verschieden sind ihre Namen, leicht in ihren Bedeutungen, aber schwierig in ihren Prinzipien.</p><h2>53</h2><p>Nach der Melodie: Herde des Bardaisan.</p><p>1. Auch ich, meine Brüder, glaubte stets an ein Wesen, und ich weiß nur, daß eins ist, da seine Natur völlig unerforschlich bleibt, wie sie nämlich beschaffen sei. Wenn ein Mensch auch zehntausend Jahre grübelte um durch sein Forschen mehr zu finden, so wird er doch nur dieses allein finden, daß er [Gott] existiert, mehr aber nicht.</p><p><em>Kehrvers:</em> Preis sei dem einen Wesen durch seinen geliebten Sohn.</p><p>2. Über unsere Brüder, die Leugner, von unserem Stamme aus Adam und unserem Geschlecht aus Eva wundere ich mich, wieviel Genossen sie dem wahren Wesen geben. Denn während wir eine gleiche Abstammung vom Staube durch Adam haben, haben wir einen Vater des Lebens, wodurch sich unser Geschlecht von der Gesamtheit der Leugner unterscheidet.</p><p>3. Ihr Geschwätz vor euch zu wiederholen, ist zwar schädlich, da ein gesundes Ohr bei ihrem Reden Schmerz empfindet; denn euer Gehör ist ein Weg für die Stimme der Wahrheit, die nach ihrem Eintritt die Tore eurer Ohren versiegelte, die es nicht duldet, daß der Trug in ihr Lager eintrete.</p><p>4. Doch zwingt euch gewaltsam die Liebe, meine Brüder, daß ihr die Wiederholung ihrer Worte ertraget: von den Wesen [Äonen], den hindernden [feindlichen Prinzipien], den Sternen und Tierkreiszeichen, von dem Körper, der vom Bösen sei, daß es keine Auferstehung gäbe, daß die Seele von den Sieben sei, und das übrige, um nicht zu weitläufig zu sein.</p><p>5. Er dichtete nämlich Hymnen und setzte sie in Musik; auch verfaßte er Psalmen und führte Versmaße ein; nach Maß und Schwere verteilte er die Worte und bot den Harmlosen Gift in süßer Speise dar, Kranken, die die gesunde Speise ablehnten.</p><p>6. Auf David [als sein Vorbild] wollte er schauen um sich mit seiner Schönheit zu schmücken und durch seine Nachahmung Lob zu ernten. Auch er dichtete 150 Psalmen, aber von seiner Wahrheit wich er ab, meine Brüder, und ahmte nur die Zahl nach; denn David sang nicht den Gesang der Ungläubigen, deren Harfenspiel Lüge ist.</p><p>7. David nennt nicht „Wesen“, was jener [Bardaisan] so nennt, denn es ist nur ein Wesen. Die Nennung des [einen] Wesens macht also die Namen der „Wesen“ zunichte, die doch gar nicht existieren; denn wenn ihre Namen gleich sind, müssten auch ihre Naturen gleich sein. Durch sich selbst wird also ihre Lehre geschlagen, meine Brüder.</p><p>8. Sehet nur, wie sehr er sich fürchtete, die Naturen der „Wesen“, die er so nannte, gleichzumachen, damit sichtbar werde, wie vermessen er handelte, da er ihre Namen gleichmachte. In beiden Fällen liegt eine Gefahr für die Partei der Vernünftler, denn wie es sich nicht ziemt, die Naturen gleichzumachen, so auch nicht die Namen.</p><p>9. Der Irrtum hat seinen Verkündern keine Gelegenheit gegeben, zu prüfen und zu sehen, ob die „Wesen“ geschaffen sind. Sie haben alle einen Namen, und so müßte auch an und für sich ihre Natur eine sein. Es gibt aber nur ein Wesen, das in allem vollkommen [übereinstimmend] ist, im Namen und in der Natur.</p><p>10. Alle gemachten Dinge, meine Brüder, sind Geschöpfe, und obwohl ihr Name gleich ist, sind doch ihre Naturen verschieden, und zwar nach dem Willen des Schöpfers. Wenn nun die „Wesen„ nicht vom Schöpfer verursacht sind, wer hat wohl unterschieden und gleichgemacht: ihre Naturen unterschieden und ihren Namen gleichgemacht?</p><p>11. Moses bezeugt uns, denn keinen andern benannte er mit dem Namen „Wesenheit“. „Götter“ wurden sie [die Götzen der Heiden] genannt, aber sie wurden nicht „Wesen“ genannt, damit wir durch den einen Namen den Begriff seiner Güte erfassen, und in dem andern Namen die Kraft seiner Wesenheit kennenlernen und beide gläubig bekennen.</p><p>12. Dem Moses offenbarte er seinen Namen: Ehejeh nannte er sich, denn das ist der Name der „Wesenheit“, und niemals nannte er mit diesem Namen einen andern, während er mit seinen [anderen] Namen [z. B. Alláhâ] die vielen bezeichnen ließ, damit er durch [diesen] einen Namen, den er sich vor behielt, zu erkennen gäbe, daß er allein das Wesen sei und kein anderes existiere.</p><p>13. Obwohl alle seine Namen herrlich sind durch seine Majestät und gleich sind an Glorie, um diesen Namen, den er der Ehre seiner Wesenheit vorbehalten hatte, beneidete ihn doch der Böse, und er reizte die Leugner an, daß sie die Namen von „Wesen“ aufbrächten; Schnitzbilder hängte er an seinen Namen und „Wesen“ an seine Benennung.</p><h2>54</h2><p>Nach derselben Melodie.</p><p>1. Ich horchte auf die Lehren eines von ihnen, welcher sagte: „Es können die Sinne [….] etwas, das in der Wesenheit ist, nicht begreifen.“ Dieses eine vermag ihre Erfindung [ihr System] aufzulösen und ihr Gebäude einzureißen und ihre Geheimnisse aufzudecken und ihre Lehre zu widerlegen.</p><p><em>Kehrvers:</em> Preis sei dem einen Wesen, das kein anderes neben sich hat!</p><p>2. Die Anklage gegen sie ist eine: Wie bildeten sie ungleiche „Wesen“ [Äonen], ließen sie deren Naturen sich verwischen und teilten sie deren Grenzen ab, da doch die ganze Natur der Wesen schwer zu erforschen ist, eben weil sie [ewige] Wesen sein sollen? Sie logen und sagten nicht, daß sie sich selbst widerlegten.</p><p>3. Sie sagen, daß auch die Seele von den „Wesen“ gemacht sei, die Seele aber die Wesenheit, ihre Quelle und Wurzel, nicht erfassen [begreifen] könne. – Wenn sie aber ihre Wesenheit nicht erforschen kann, wie sehr verirren sie sich da in bezug auf das höchste Wesen, und [wie] schlossen sie es an einem Orte ein!</p><p>4. Sie banden und lösten, da sie das eine Wesen hoch erhoben, so daß seine Höhe nicht erforscht werden könne, aber anderseits andere „Wesen“ einführten, die begriffen werden könnten. Ohne streiten zu müssen, ist es klar, daß die Natur der „Wesen“ eine ist, denn einer ist ja auch der Name der „Wesen“, eine ist die Substanz des Menschen, denn einer ist auch der Name des Menschen.</p><p>5. Man nimmt auch ohne Streit an, daß die Natur der Engel eine ist, da der Name der Engel einer ist. Eine ist auch die Natur der Seele, weil auch der Name der Seele einer ist. Das Geschlecht wird nach dem Namen des Stammes genannt und erklärt. Und wenn es andere Unterschiede gibt, so rühren die Verschiedenheiten vom Willen Gottes her.</p><p>6. Seinen Dienern gab er den Namen von Göttern und Herren, und nach dem Namen seines Sohnes benannte er die Söhne der Gnade und nach dem Namen des Heiligen Geistes ein geistiges Geschlecht [wörtlich: Geschlecht der Geistigen]. Verschieden sind ihre Naturen [Gottes und der Menschen, die uneigentlich Götter usw. genannt werden], gleich ihre Namen, damit sie seine Güte preisen und seine Majestät verehren.</p><p>7. Man soll sie nun fragen, wer denn die „Wesen“ nach dem Namen jenes [einen] Wesens benannt hat. Wenn er sie selbst so genannt, dann käme alles von seiner Güte her; wenn es aber nicht seine Anordnung ist, dann ist alles ihm entgegengesetzt [feindlich]. Wer aber ist größer als der, dessen Namen er geraubt hat, um die „Wesen“ darnach zu benennen?</p><p>8. Ihre Erfindung ist dies: ein Wort ohne Wahrheit, und auch ein Name ohne Person. Die Namen sind da, Wesen aber existieren nicht, so daß sie die Namen der Wesen statt ihrer selbst führen. Uneigentliche Namen führen sie also zur Verwirrung ein da ihr Herr nur einer ist.</p><p>9. Preis sei der Quelle, von der die Namen der Herrlichkeit herausströmen! Und da seine Namen nicht weggerissen werden können, gab der Irrtum der Willensfreiheit den Rat, und sie stahl für ihn die anbetungswürdigen Namen, damit durch sie der Böse die Anbetung seiner Anbeter erjage.</p><p>10. Du aber bist nicht neidisch, mein barmherziger Gott wegen der Gotterbezeichnung. Du bist ein gütiger Herr, wegen des Herrentitels [für Menschen]. Alle die von dir [so] genannt werden, werden verherrlicht durch deinen Namen; widerlegt aber und zuschanden werden die, die gegen deinen Willen deinen Namen stahlen.</p><h2>55</h2><p>Nach derselben Melodie.</p><p>1. Betet, Brüder, für die Söhne [Anhänger] des Bardaisan, damit sie nicht fernerhin phantasieren, daß sie wie unmündige Kinder sagen: „Etwas floß hinunter von jenem Vater des Lebens, und die Mutter unter dem Bilde des Fisches [wie ein Fisch] wurde schwanger und gebar ihn, und er wurde Sohn des Lebens genannt.“ — Jesus, Heiliger, Preis sei deinem Erzeuger! —</p><p><em>Kehrvers:</em> Preis sei dem Heiligen!</p><p>2. Und da er meinte, daß der Alleinstehende durchaus nicht hervorbringen und zeugen könnte, nannte er unsern Herrn einen Sproß aus zweien geboren nach Art der [menschlichen] Ehe. — Da aber unser Herr auch dem Leibe nach nicht von zweien gezeugt wurde, um wieviel reiner muß seine göttliche Natur sein, da sie Licht ist vom Lichte!</p><p>3. Wer sollte nicht seine Ohren verschließen, um nicht zu hören, daß sie sagen, daß die rûh qûdšâ [der Heilige Geist ] zwei Töchter geboren habe: „Nach dir sei mir eine Tochter und dir Schwester.“ Und eine Schmach ist’s, daß er erzählt, wie ihre [des Geistes] Schwangerschaft war. Jesus bedecke meinen Mund, denn siehe, ich beflecke meine Zunge, wenn ich ihre Geheimnisse offenbaren soll.</p><p>4. Zwei Töchter gebar sie, die eine "Scham des Trockenen“, die andere „Bild des Wassers“. – Sehet nun, wie sie lästern! Denn nicht einmal das Bild eines Dämonen ist im Wasser sichtbar. Um wieviel reiner und unsichtbarer als ein solches Spiegelbild muß die Natur des Heiligen Geistes [der rûh qûdšâ] sein, da nicht einmal im Denkvermögen sein [ihr] Abbild dargestellt werden kann! —</p><p>5. Und er sagte: „Wann werden wir dein Hochzeitsmahl, o Geist, schauen, das Mädchen, jene Tochter nämlich, die du auf deine Knie gesetzt und mit der du gekost?“ Und er bezeugt in seinen Hymnen, verdorben in seinen Schmeicheleien und weichlich in seinen Gesängen, daß er den schönen Namen des Heiligen Geistes schmähte, der in allem rein ist.</p><p>6. Zu ihrer Beschämung genügt ihr geheimer Hymnus, wo eben jene [die rûh qûdšâ] sagte: „Mein Gott und mein Fürst hat mich allein gelassen.“ Weil er sich seiner Häßlichkeit schämte, hat er seinen Hymnus mit der Schönheit des reinen und heiligen Psalmes bekleidet, aus dem unser Herr anführt; „Mein Gott, warum hast du mich verlassen?“</p><p>7. Sie bekennen, daß sie von Moses das Gesetz lernten; er [Bardaisan] verachtete es aber, da er schrieb: „Haupt des Gebäudes, dessen Pforten auf Befehl geöffnet wurden vor der Mutter.“ An einen Ort der Schande versetzte er das Paradies. Die reine Thora widerlegt wie ein Spiegel ihre häßliche Lehre.</p><p>8. Er haßte ferner das gepriesene Paradies des Heiligen und lehrte ein anderes Paradies der Schande, das Götter ausmaßen und gründeten. „Der Vater und die Mutter pflanzten es durch ihre eheliche Verbindung und machten es fruchtbar durch ihre Schritte.“ Was das Paradies anbetrifft, so ist Moses ihr Richter, denn solches schrieb er nicht.</p><p>9. In Eden, so heißt es, pflanzte der Herr das Paradies; Moses spricht nur von einem, und jener [Bardaisan] führte ein zweites [= anderes] ein, das die Götter ausgemessen und angelegt hätten, und zwar an einem Orte, dessen Namen auch nur zu nennen ich mich schäme. Die Schlange, die Adam am Baume betrog, betrog arglistig auch diesen in bezug auf das Paradies.</p><p>10. Auf Sonne und Mond schaute er; mit der Sonne verglich er den Vater, mit dem Monde verglich er die Mutter; männliche und weibliche Gottheiten und ihre Kinder [nahm er an] und lästerte mit vollem Munde, und pries die Vielen: „Preis euch, meine Herren, und euch Söhnen meiner Herren, Versammlung der Götter!“ So predigte er ohne Scham.</p><p>11. Die Makkabäer fanden die getöteten Juden und fanden auch in ihrem Busen Götzenbilder; sie brachten für die Gefallenen Gebete und Opfer dar. Auch ihr, Söhne des Guten, betet für Bardaisan, der in Abgötterei dahin ging, Legion in seinem Herzen, unsern Herrn im Munde.</p><h2>56</h2><p>Nach derselben Melodie.</p><p>1. Seine Herde hat Bardaisan nach seinem Namen bezeichnet und benannt. Nach dem Namen des Mani ist ferner seine Herde benannt. Wie gestohlene Schafe werden sie mit diesem hässlichen Mal der Diebe bezeichnet. Nach dem Namen unseres Erlösers ist seine Herde bezeichnet; Christus ist’s, der sie gesammelt hat; die Schafe sind [daher] Christen [genannt].</p><p><em>Kehrvers:</em> Preis deiner Güte!</p><p>2. Mani und Bardaisan verdarben die Gemeinden durch Buhlerkünste und führten ihre [eigenen] Namen ein an Stelle jenes schönen Namens; denn seine Braut hatten nach seinem Namen benannt die Brautwerber, die Apostel, die Söhne der Wahrheit. Er gleicht da seinem Vater, dessen Gemeinde nach seinem Namen benannten die Anhänger des Moses.</p><p>3. Moses, dessen Angesicht erstrahlte, überführt die Irrlehrer, denn er sprach nicht im eigenen Namen sondern im Namen seines Herrn. Die Propheten, die dann im Namen des Herrn auftraten, sprachen auch im Namen Gottes. Keiner ist unter ihnen, der es gewagt hatte, im eigenen Namen zu sprechen. Im Namen des Herrn sprachen die Propheten, im Namen Jesu die Apostel.</p><p>4. Erröten sie denn nicht vor Scham, daß ihre Schriften im Namen von Menschen geschrieben sind und kein Schriftgelehrter [Vorleser] sich erhebt und liest:,,So spricht der Herr Sabaoth“, sondern: „So Markion, der Rasende, und Mani und Bardaisan?“ Ihre Namen reichen aus für die Schmach ihrer Gemeinden.</p><p>5. Fürchten sie sich denn nicht, da der Apostel jenen tadelt, der sagt: „Ich bin des Kephas“? Wenn aber nicht einmal nach dem Namen des Kephas die Schafe benannt werden sollten, da er doch das Haupt [der Meister] der Apostel war, die Schlüssel besaß und die Herde weidete, – wehe dem, der sich erfrecht, die Schafe, die ihm nicht gehören, nach seinem Namen zu nennen!</p><p>6. Wohlan denn, ziehet aus, ihr Widder, Lämmer und Schafe, die ihr von den Irrlehrern gestohlen seid, und widersaget der Bezeichnung und dem Namen der Diebe, und kommet und lasset euch bezeichnen mit dem gepriesenen Namen Gottes, und lasset euch Christen nennen, damit ihr nach Bezeichnung und Namen in jeder Beziehung eine christliche Herde seid!</p><p>7. Niemand kann ja auf den Namen eines Menschen getauft, noch nach dem Namen eines Menschen genannt werden; wenn er aber so genannt wird, dann müßte er auch auf den Namen des Menschen getauft werden. Entweder laßt euch taufen auf den Namen eines Menschen und nennt euch dann nach dem Namen des Menschen, oder laßt euch taufen auf den Namen Jesu und benennt euch nach dem Namen Jesu!</p><p>8. Heil dir, hehre Kirche, aus jedem Mund, die du frei bist vom Schmutz und Unrat des Anhanges Markions, des Rasenden, die du rein bist von der Hefe und dem Frevel des Anhanges Manis, die du losgelöst bist von der Unreinheit des Truges des Bardaisan und auch von dem Gestank der stinkenden Juden!</p><p>9. Dein Herr erhebe dein Horn [erhöhe deine Macht], gläubige Kirche, denn in dir findet sich nicht das Buch jenes Markion, des Rasenden, und auch nicht die Schrift des wahnsinnigen Mani, noch auch das Buch der häßlichen Geheimnisse des Bardaisan. Die beiden Testamente des Königs und des Königssohnes sind in deiner Lade aufbewahrt.</p><p>10. Nicht mögen erfolglos [unbelohnt] bleiben die Mühen deines Hirten! Ich habe ja deine Herde nicht verwirrt, sondern ich habe, soweit ich konnte, die Wölfe von ihr ferngehalten, und so gut ich vermochte, Hürden von Liedern für die Lämmer deiner Herde gebaut. Doch bedrängen mich Schmerzen, und Schulden machen mich zittern; mögen sie von deiner Gnade getilgt werden!</p><p>11. Einen Toren und Einfältigen hast du zum Schüler gemacht und hast noch mehr getan und hast ihm den Hirtenstab übergeben und die Arznei der Ärzte, die Waffe der Forscher und die Muße des Vollkommenen. Das Gefäß ist voll und fließt über und bekennt, daß er gebrechlich ist; hemme, o Herr, in deiner Gnade den Überfluß deiner Gabe!</p><p>Zu Ende sind die Gesänge gegen die Irrlehren und gegen die Chaldäer vom seligen Mar [i] Ephräm. Es sind ihrer an Zahl sechsundfünfzig.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Hymnen gegen die Irrlehren</em>. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3949/versions/hymnen-gegen-die-irrlehren-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "T90c_Творения__Часть_2"
    path: "Ephraem_Drei_Reden_ueber_den_Glauben"
    title: "Drei Reden über den Glauben"
    menu: { parent: "Reden", title: "Drei Reden über den Glauben", priority: 1 }
    update: true
    body: |-
      <p><em>Drei Reden über den Glauben (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Ich bin erstaunt darüber, nach welcher Höhe unsere Vermessenheit strebt. Nicht darüber bin ich erstaunt, daß sie dieselbe schon erreicht hätte, sondern darüber, daß sie wähnte, sie überhaupt erreichen zu können. Wenn nämlich jemand etwas zu erreichen wähnt, so hat er es noch lange nicht erreicht. Durch das bloße Meinen erreicht man nichts; freilich ist es sehr leicht, es zu meinen. Auch die Grübler meinten, ihr Ziel erreicht zu haben; aber dadurch, daß sie dies meinten, erreichten sie es doch nicht. Denn erhaben über jede Vernunft ist der Schöpfer aller Vernunftwesen. Unerforschlich ist er den Menschen und selbst den Engeln unbegreiflich. Das Geschöpf ist mit seiner Einsicht nicht imstande, über seinen Schöpfer zu sprechen, vermag es ja nicht, einmal zu sagen, wie es selbst gebildet wurde. Begreift es nun seine eigene Entstehung nicht, wie könnte es imstande sein, seinen Schöpfer zu begreifen? Der Verstand vermag nicht, die große Höhe seines Schöpfers zu erreichen, weit unter jener Höhe bleibt die Forschung der Forscher.</p><p>Sie mühen sich ab, Analogien für den zu finden, der nur Einem gleich ist. Sie alle gehen in seiner Erkenntnis fehl; nur er allein kennt sich. Er ist nicht gleicher Abkunft mit den Erschaffenen, daß sie ihn wie einen ihresgleichen erforschen könnten. Er ist nicht gleichen Geschlechts mit den [aus Erde] Geformten, daß der Mensch sein Wesen erklären könnte. Selbst mit den Wächtern [d. i. Engeln] ist er nicht verwandt, daß sie ihn wie einen der Ihrigen untersuchen könnten. Er ist nicht ein Genosse der Cherubim; denn diese tragen ihn als ihren Herrn. Er schwebt nicht unter den Seraphim; denn sein Ehrenplatz ist zur Rechten [des Vaters]. Zu den Dienstengeln gehört er nicht; denn sie dienen ihm wie seinem Vater. Alle Mächte des Himmels erhalten von ihm Befehle, sie können den Vater nicht schauen ohne den gebietenden Erstgeborenen; denn ohne ihn wurden sie bei ihrer Erschaffung auch nicht gebildet.</p><p>Das Auge vermag das Licht aufzunehmen, und dadurch wird der ganze Leib erleuchtet. Das Gehör ist für die Stimme eingerichtet und dadurch vernehmen die Glieder den Ton. Der Mund genießt die Speisen, und durch ihn und mit ihm der ganze Körper. So schauen die Wächter den Vater durch den Sohn, der aus seinem Schoße ist. Durch ihn hören sie auch seine Stimme, durch ihn empfangen sie seine Gabe. Da gibt es keine andere Mittelsperson, zu helfen oder Hilfe zu empfangen. Die Sinne bedürfen einander, sie hängen alle voneinander ab. Auch die Geschöpfe hängen alle voneinander ab, weil sie einen Körper bilden. Selbst die höheren Wesen erhalten von ihren Genossen Befehle; denn sie befehlen und erhalten Befehle voneinander je nach ihren Rangstufen. Alle aber, von denen ich gesprochen oder die ich nicht erwähnt habe, erhalten von dem einen Erstgeborenen Befehle. Von ihm hängen alle Geschöpfe ab, während er mit seinem Vater vereinigt ist. Wie willst du nun den Eingeborenen ergründen, der mit der Vaterschaft [dem ewigen Vater] vereinigt ist? Wenn du den Vater erforschen kannst, dann findest du in ihm und bei ihm auch den Sohn. Bei seinem Munde ist er [der Sohn], wenn er [der Vater] befiehlt, und bei seinem Arme ist er, wenn er erschafft. Durch ihn [den Sohn] wirkt er, und durch ihn befiehlt er. Nur sie kennen sich wechselseitig. In seinem [des Vaters] Schoße ist er [der Sohn], wenn er liebt, und zu seiner Rechten ist er, wenn er thront. Ihn liebt er, ihn schaut er an.</p><p>Sein [des Vaters] Glanz ist für seinen Diener zu groß. Die Wächter sind nicht imstande, ihn anzusehen. Davon möge dich Moses überzeugen, der verklärt wurde. Wenn das Volk den Moses, einen Menschen, nicht anzuschauen vermochte, wer kann dann das Wesen Gottes schauen? Nur der Eine, der aus ihm ist, vermag ihn anzublicken. Überaus herrlich ist der Glanz des Vaters. Nur der Eine sieht den Einen, nur der Eine vermag den Einen zu schauen, und durch den Einen schauen ihn alle Geschöpfe. Durch seine Güte vergibt er, und durch seine Gerechtigkeit straft er; durch sich vergilt er, und durch sich straft er; denn er selbst ist das Maß seiner Vergeltungen. Durch seinen Zorn geschieht es, wenn er zürnt, und durch seine Milde, wenn er verzeiht. Durch sein Wissen offenbart er, und durch seine Kenntnis belehrt er. Durch sich belehrt er, und durch sich bereichert er. Seine Weisheit ist bei seinen Geschöpfen. Durch sich unterstützt er die Dürftigen mit Gutem aus seinem Schatzhause. Durch sich gibt er seinen Streitern ihre Kronen nach ihrer Auferstehung. Er ist ganz in sich selbst verborgen, wer könnte ihn da ergründen? Die Wächter beten schweigend an, die Seraphe singen laut ihr „Heilig", die Cherube tragen mit Ehrfurcht, die Räder rollen in Lichtglanz. Alle beten von ferne durch den sichtbaren Sohn den verborgenen Vater an.</p><p>Wenn es noch ein anderes Wesen gäbe und dieses den Sohn ergründen könnte, so könnte es ihn doch nicht aus sich selbst begreifen; denn nur das Eigene begreift man. Wenn dieses Wesen, obwohl von ihm verschieden, ihn verstehen würde, so wäre es seinesgleichen oder ebenbürtig. Wenn es noch ein anderes Wesen gäbe, das allein ihn verstehen würde, so könnte dies geschehen aus der Ferne, wenn es ihm fremd ist, oder aus der Nähe, wenn es ihm ebenbürtig ist. Ist das Wesen seinesgleichen, so ist es der Eine, der nur verschiedene Namen trägt; ist es aber nicht seinesgleichen, so sind die Geschöpfe zu schwach, die Seraphe und die Wächter zu unzureichend, und das andere Wesen, falls es ein solches gäbe, würde als ihm fremd noch weit davon entfernt sein. O Staubgeborener und Niedriger, nach welcher Höhe trachtest du also? Nicht wie der Himmel hoch ist, ist der Herr des Himmels erhaben über dich. Die Höhe des Himmels ist meßbar, sein Schöpfer jedoch unermeßlich. Alles Erschaffene ist meßbar größer als etwas anderes Erschaffenes; aber der Schöpfer ist in unermeßlicher Erhabenheit seinen Geschöpfen entrückt. Die Geschöpfe sind untereinander Genossen, wenn auch unendlich voneinander entfernt. Der Schöpfer aber ist seinem Wesen nach von seinen Geschöpfen entfernt. Nur Einer allein ist ihm nahe, nämlich derjenige, durch den er alles geschaffen hat. Kein Diener naht ihm, während sein Sohn ihm ganz nahe ist. Keiner seinesgleichen ist ihm zur Seite; denn nur sein Erzeugter sitzt an seiner Seite.</p><p>Ein großer Abstand ist zwischen der Wesenheit des Schöpfers und der Schöpfung, aber nicht so, daß er von ihr gänzlich abgeschnitten wäre; denn ohne ihn wäre sie überhaupt nicht. Sie ist bei ihm, nicht er bei ihr; er ist mit ihr verbunden und von ihr getrennt. So nahe auch die Sonne der Erde ist, so ist doch ihre Natur von jener der Erde verschieden. Die Natur der Erde ist der herrlichen Natur des Lichtes nicht ähnlich. Auch das Gold ist, obschon es aus ihr kommt, von ihr verschieden und doch mit ihr vermengt. Um wieviel mehr muß der Schöpfer von der Schöpfung verschieden sein, obgleich er bei ihr ist. Er ist, was seine Erforschung betrifft, über alles erhaben.</p><p>Wohin versteigst du dich also, o Schwächling? Staub, hingeworfen auf den Staub, kümmere dich um den Staub! Aber auch der Staub unter dir ist für deine Erforschung zu hoch. Wenn nun das, was unter dir ist, für dich zu hoch ist, wie willst du dann das Höhere erreichen? Wenn der dir ebenbürtige Staub, von dem du genommen bist, dir unbegreiflich ist, wie wirst du dann die Majestät ergründen? Sie ist für deine Erforschung schlechthin zu hoch. Dem Aussehen nach ist der Erdboden einfach, klein und doch vielfältig in bezug auf seine Erforschung. Er ist nur einer und doch nicht einfach; denn er ist reich an den verschiedensten Erzeugnissen. Der eine unansehnliche Schoß erzeugt unzählige Genüsse; der eine geringfügige Schatz bringt zahllose Kostbarkeiten hervor; der gebärende Boden gebärt Kinder, die von ihm ganz verschieden sind und dem Aussehen nach weder ihm noch einander ähnlich sind. Aus seinem unansehnlichen Innern wird uns Wunderbares geboren, aus seinem armseligen Innern entquellen uns reiche Schätze. Aus Einem kommt alles; denn aus der Erde geht alles hervor. Der Erdenstaub ist an sich allen Sinnen feindlich: er schadet im Gehörgang, stört im Auge, verschließt die Pforten des Gehörs, trübt das Licht des Gesichtes. Er ist zu jeglichem Gebrauche ungeeignet und doch die Quelle aller Hilfe. Aber, obgleich er zum Gebrauch sich nicht eignet, kommt doch von ihm das Brauchbare. Er ist ein Gegner der Hungrigen [weil nicht eßbar] und doch der Tisch der Hungrigen. Der Staub ist dem Munde schädlich, er ist die Nahrung der verfluchten Schlange. Zur Strafe wurde er die Nahrung der Schlange und aus Erbarmung der Tisch für alle. Er ist für die Essenden ungeeignet und spendet uns doch alle Nahrungsmittel. Er schadet den Schauenden und verschafft uns doch alle Heilkräuter. Er trübt die Augen und öffnete doch die Augen der Blinden. Es ist in ihm selbst und seinem Nährstoffe jeglicher Nutzen enthalten. Wohlan denn, o Beschauer, bewundere die Schätze, welche die Erde ausschüttet! Dieses magere Ding ist die Quelle alles Fettes. Dieses trockene Ding sprudelt uns die fließenden Quellen hervor. Aus dem seiner Natur nach schwachen Boden kommt das Eisen und das Erz. Dem Anscheine nach arm, gießt er Gold und Silber aus. Er ist der Schatzmeister der Vögel, der Hausvater des Wildes, die große Vorratskammer, die alles, die Haustiere, die Kriechtiere, die Menschen, ernährt.</p><p>Es gibt noch etwas Wunderbares im Schoße des Staubes, das wegen seiner Unscheinbarkeit nicht beachtet wird. In der Erde wachsen die verschiedensten Wurzeln friedlich nebeneinander: neben einer süßen eine bittere, neben einer heilkräftigen eine todbringende. Der Staub bringt das Gift der bitteren ebenso hervor wie die Süßigkeit der heilkräftigen. Die bittere sammelt ihr Gift, ohne daß es sich in die süße ergießt; die süße sammelt ihre Süßigkeit, ohne sie den Wurzeln ihrer Umgebung mitzuteilen. Wie bringt es doch der verachtete Staub zustande, jeglichem sein Wachstum zu verleihen? Den Früchten gibt er ihren Wohlgeschmack und damit zugleich ihre Farben, den Blumen ihre Wohlgerüche und damit zugleich ihre Wohlgestalt. Den Früchten verschafft er Wohlgeschmack, den Wurzeln Aroma. Den Blüten verleiht er Schönheit, und die Blumen kleidet er in Pracht. Für den Samen wird er zum Künstler: er flicht den Weizen zu Ähren, festigt den Halm durch Knoten, wie ein Gebäude durch Gebälk, damit er die Frucht tragen und vor dem Winde bestehen könne. Wie viele Brüste hat doch die Erde, um jegliches mit ihrer Feuchtigkeit zu säugen! Es ist wunderbar, daß sie so viele Brüste hat, als es Wurzeln gibt, und daß sie die bittere und die süße Wurzel, jede ihrer Art entsprechend, säugt. Es ist wunderbar, daß es nur eine Brust ist, die alle Früchte aufzieht. An ihr saugen nämlich die Wurzeln und [dadurch] die Früchte, die süßen und die bitteren. In der einen vermehrt sie die Süßigkeit, in der andern die Bitterkeit.</p><p>Ist dies schon bei getrennten Dingen merkwürdig, so noch viel mehr bei solchen Dingen, die miteinander zusammenhängen. Der gleiche Saft nimmt in ein und demselben Baume verschiedenartige Eigenschaften an. So schmecken z. B. die Früchte süß, die Blätter bitter, ja, die Frucht ist beim Beginne der Reife noch sehr bitter. Sie stellt daher für die Büßer ein Vorbild dar, weil sie am Ende süß und angenehm ist. Wenn nun schon der Staub, den du mit Füßen trittst, bei seiner Erforschung dich verwirrt, wie wirst du dann die Majestät dessen ergründen, der dich schon durch unscheinbare Geschöpfe aus der Fassung bringt?</p><p>Nichts erscheint dir verächtlicher als der Staub, nichts armseliger als das Haar. Der verächtliche Staub ist unter dir, und doch erfassest du die Größe seines Reichtums nicht. Ebenso besiegt dich das Haar auf deinem Haupte; denn du begreifst seine Art und seine Menge nicht. Von den Meeren und Abgründen, vom Himmel und seinen Gestirnen will ich gar nicht reden. Mitten zwischen zwei unscheinbare Geschöpfe hat dich der Schöpfer gestellt. Das Obere [das Haar] schlägt dich, damit du nicht über den Allerhöchsten grübelst, und das Untere [der Staub] weist dich zurecht, die erhabene Hoheit nicht ermessen zu wollen. Durch diese beiden unscheinbaren Geschöpfe belehrt dich der Herr der Geschöpfe. Zügle doch deine Verwegenheit, damit du dich nicht an Geheimnisse wagest! Die Tadler sind nahe, sie sind ja jederzeit bei dir. Weil die Überhebung dir nahe ist, darum ist dir auch die Züchtigung nahe.</p><p>Kein Reiter spornt ohne Zügel sein Pferd zum Laufe an. Sie fallen dem Tiere zwar lästig, halten es aber im Zaume. Dem wilden Feuer [des Pferdes] ist auf diese Weise Dämpfung nahe. Lege denn auch du deiner Forschung Zügel an, daß sie nicht wild dahinrase! Es gibt Zügel, die man freiwillig anlegt, und es gibt Zügel, die mit Gewalt angebracht werden. Die freiwilligen sind in deiner Hand, um das Ungestüme deines Freiheitsdranges zu hemmen; die gewaltsamen sind in der Hand des Herrn. Wolltest du dich auch erfrechen, du bist ohnmächtig. Du magst wollen oder nicht, die Zügel deines Herrn sind dir angelegt. Wie weit reicht wohl dein Lauf? Mäßige dich also, o Ohnmächtiger!</p><p>Der Vater ist vollkommen durch seine Wesenheit [d. h. durch sich selbst], der Erstgeborene durch seine Erzeugung. Der Vater ist vollendet, weil der Sohn vollendet ist; der Erzeugte ist ebenso vollendet wie sein Erzeuger. Die Wurzel ist genau so vollkommen wie die Frucht. Der Baum versagt seiner Frucht den ihm eigenen Wohlgeschmack nicht, ebenso wohnt der Wohlgeschmack der unendlichen Wurzel dem von ihr Erzeugten inne. Wenn aber die Wurzeln ihre Kostbarkeiten ihren Früchten nicht vorenthalten, wie könnte da die gebenedeite Wurzel ihren Reichtum ihrer Frucht vorenthalten? Siehe, der Baum verbirgt in seinem Innern seinen Wohlgeschmack vor allem und jedem, und doch ergießt er ihn in das Innere der Frucht. Hat ihn seine Frucht erhalten, so teilt sie ihn den Essenden mit. Durch die Frucht wurde uns die Süßigkeit gegeben, die in der Wurzel ist. Hätte die Frucht sie nicht erhalten, so hätte niemand zu ihr gelangen können. Die Wurzel teilte sie ihrer Frucht mit, weil sie dieselbe über alles liebt; die Frucht teilte die Süßigkeit den Bedürftigen mit, weil sie dieselben liebt. Wie der Vater seine Frucht liebt, so liebt die Frucht die Essenden. Was die Wurzel birgt, kann durch ihre Frucht gekostet werden.</p><p>Ersinne doch nicht eine neue Lehre aus deinem Kopfe in deinem Zeitalter! Es reicht für dich hin, was von den früheren Quellen herabgeströmt ist. Heil dir, wenn du imstande bist, die von dort kommenden Ergüsse aufzunehmen! Vier Quellen ergossen die Wahrheit in die vier Weltgegenden. Dein Durst ist nicht größer als der Simons; die Fluten, die er trank, reichen auch für dich hin. Die Offenbarung, die von oben herabfloß, löschte seinen großen Durst. Der mächtige Strom, der zu ihm kam, ergoß sich aus ihm und kam zu dir. Er ist größer als der Fluß Edens, laufe also nicht zu Pfützen hin! Er ist größer als die ganze Schöpfung, weil er vom Herrn der Schöpfung ausströmt; denn die Offenbarung fließt bis jetzt und bis in Ewigkeit fort. Du liebst den Sohn nicht mehr als Simon, der hörte und schwieg. An allen anderen Stellen redet er, aber an dieser Stelle schweigt er nur. Wenn er auch beim Abendmahle schwieg, so konnte er es doch nicht unterlassen, wenigstens zu winken. Aber bei dieser Gelegenheit war er ganz still, empfing die Seligpreisung und beobachtete Schweigen. Durch Schweigen setzte er seiner Zunge Schranken, durch Stille stillte er seinen Forschungsdrang. Aber die Schranke, welche Simon nicht überschritt, treten Vermessene mit Füßen.</p><p>Wunderbares enthalten die hl. Schriften, jedoch unsichtbar der Rechthaberei. Unser Herr nahm sich nicht heraus, den Simeon über sich zu belehren - er war sich sozusagen fremd -, aber sein Vater offenbarte über ihn. Nicht als hätte unser Herr nicht selbst über sich offenbaren können, er wollte nur an seiner Person den Verwegenen ein Beispiel geben. Denn wenn er selbst über sich schwieg, wer dürfte sich dann vermessen, über ihn zu grübeln? Wenn er sich enthielt, über sich zu offenbaren, wer dürfte dann seine Erzeugung erforschen wollen? Er bekräftigte jenes Wort: „Der Vater kennt den Sohn"; darum verhielt er sich schweigend, damit sein Erzeuger über ihn rede. Der Vater, in dessen Schöße sein Sohn ist, weiß über ihn zu belehren. Der eine Vater begann und vollendete die Belehrung über den einen Erstgeborenen, wie auch der Erstgeborene den Willen des Vaters vom Anfang bis zum Ende erfüllte.</p><p>Ja, die Beweisführung der Forscher versagt, und unsere Vermessenheit bleibt unbefriedigt. Die Ruhmsucht müht sich mit Neuerungen ab, um nicht die Lehre von gestern vortragen zu müssen. Erniedrigung erscheint es dem Hochmütigen, die Wahrheit, so wie sie bereits niedergeschrieben ist, zu lehren. Während er tiefgründige Untersuchungen anstellt, verliert er die offen daliegende Wahrheit. Simon gab dir ein Beispiel, ahme ihn nach! Der Fischer wurde zum Maler: er malte den Kirchen ein Musterbild, das sich jeder auf sein Herz zeichnen soll. Wir sollen alle zum Sohne sagen: Du bist der Sohn des lebendigen Gottes! Dieses Wort ist für die Oberen und für die Unteren [Engel und Menschen] zu erhaben, und doch soll es dir zum täglichen Brote werden, und nie mögest du daran Ekel empfinden! Selig ist, wer ihn einfach Sohn Gottes nennt. Dieselbe Seligpreisung, die unser Herr [über Petrus] aussprach, wird auch ihm zuteil.</p><p>Nähere dein Auge dem Lichte, es wird dasselbe schauen, ohne darüber zu grübeln. Ebenso wendet es sich dem Schlafe zu, ohne sich mit der Untersuchung desselben abzuquälen. Nähere deinen Mund der Frucht, er gibt sich nicht mit ihrer Erforschung ab. Du wandelst auf der Oberfläche der Erde, ohne ihren Umfang zu untersuchen. Lieb ist dir die ganze Schöpfung auch ohne Forschen und Grübeln. Die endlichen Dinge lassest du unbeachtet und sinnest über den Unendlichen nach. Der Schöpfung gegenüber bleibst du in Ruhe, dem Schöpfer gegenüber gerätst du ins Grübeln. Dem All gegenüber verhältst du dich ganz ruhig und still, gerätst aber in Unruhe gegenüber dem Herrn des Alls.</p><p>Bei der Nahrungsaufnahme hältst du Maß, beim Forschen aber nicht. Der Schoß deiner Fassungskraft ist klein, gib ihr also nur mit Maß Belehrung! Ihre Nahrung soll mit ihrem Schoße [Aufnahmsfähigkeit] im Verhältnis stehen! Sie soll nicht zuviel zu sich nehmen, sonst muß sie sterben! Du sollst dich allerdings mit [gesunder] Lehre nähren! Sie ist ja eine Tafel, die alle ernährt. Sie ist die Tafel des [Himmel-] Reichs. Nimm ein wenig davon, um davon Nutzen zu haben; aber ihre Köstlichkeit verführe dich nicht, viel davon nehmen zu wollen, das keinen Nutzen bringt! Mit Maß forschen ist eine Arznei des Lebens, ohne Maß ist es tödliches Gift. Der du mit Maß Wasser trinkst, halte auch Maß im Forschen! Besser zuviel Wasser als zuviel Fragen.</p><p>Derjenige, nach dessen Höhe du dich ausstreckst, ist nicht bloß um ein geringes höher als du. Soviel der Himmel höher ist als du, ebensoviel höher ist er über dem Himmel. Hundertmal höher als du ist seine Erforschung. Nicht als ob er überhaupt unerkennbar wäre, weil er in unzugänglicher Höhe thront; er ist ja deutlich und klar in seinen Werken erkennbar, mag er auch seinen Geschöpfen verborgen und unsichtbar bleiben. Er ist in allem und zugleich außerhalb allem. So nahe er uns durch seine Huld ist, so ferne ist von uns seine Erforschung. Dies weiß der Verständige, aber von seinem Wesen weiß er nichts. Der Verstand müht sich ab, ihn zu begreifen, erkennt aber nur, daß er existiert. Die Vernunft strengt sich an, ihn zu erfassen; wenn sie glaubt, ihm nahe zu sein, so ist er weit entfernt. Sinne und Gedanken eilen auf ihn zu, erreichen ihn aber nicht Während sie dahinzueilen und ihn zu erreichen wähnen, stehen sie in Wirklichkeit erstaunt und verlegen still.</p><p>Dies hört das Gehör, ohne von ihm [seinem eigentlichen Wesen] etwas zu hören. Woge um Woge schlägt an das Gehör, wenn es die hl. Schriften hört. Während es zu hören sucht, daß er müde sei, hört es wiederum, daß er nie müde werde. Das eine Ohr hört, er schlafe, und das andere, er schlummere nicht. Es vernimmt, er sei klein und eingeschränkt, vernimmt aber wiederum, daß er die Himmel erfülle. Während er vor dem Gehöre klein zu sein sucht, ist er über alle Geschöpfe erhaben. Es hört, er habe Glieder; es geht aus, sie zu messen, und findet keine. Während es über seinen Wagen nachsinnt, findet es ihn ohne Wagen. Während es hört, er sei an einem Orte, hört es auch, er sei an jedem Orte. Während es sucht, ihn den Guten zu nennen, wird er als der Gerechte bezeichnet.</p><p>Das Auge schaut auf seine Gerechtigkeit und trifft auf seine Güte. Der Verstand schaut auf seine Barmherzigkeit: da eilt seine strenge Rute herbei. Erfreulich ertönt der Ruf der Vergebung, schrecklich der Ruf der Rache. So irrt der Verstand bestürzt und staunend zwischen Gottes Güte und Gerechtigkeit hin und her. Der Beobachter steht verwirrt zwischen Prüfung und Züchtigung. Während er sieht, wie die Bösen übermächtig sind, sieht er die Guten geschlagen. Gottes Läuterung prüft die Treuen, seine Rute züchtigt die Frevler. Gerechtigkeit und Güte sind eng verbunden, aber nicht vermengt; sie sind vereint, aber nicht verwirrt. Nur wegen seiner Unzulänglichkeit kann der Verstand sich nicht zurecht finden, weil er es nicht fassen kann. Während er den Tod von Greisen sieht, sieht er auch den Untergang von Kindern. Auf der einen Seite erblickt er Gerechtigkeit, auf der andern ihr Gegenteil; denn der eine Gerechte leidet, der andere bleibt verschont. Die einen Guten sieht er in Bedrängnis, die andern in Frieden. Dieses erscheint als widersinnig. Betrachtet er ferner die Bösen, so wird der eine schon beim ersten Morde ertappt, ein anderer dagegen tötet eine Menge und geht frei aus.</p><p>Wie zwischen den Wogen schwache Schiffe untergehen, ebenso leiden schwächliche Geister zwischen der Güte und der Gerechtigkeit Schiffbruch. Weil hier Unklarheit herrscht, so gerät die Armseligkeit [des Geistes] in Verlegenheit. Wenn man auch nicht alles davon begreift, so begreift man doch soviel, als zuträglich ist. Es genügt für uns zu wissen, daß der Richter aller nicht ungerecht handeln kann. Es ist für uns genug, zu wissen, daß wir ihm keinen Vorwurf machen können; denn es wäre Vermessenheit, wenn das Gefäß seinen Bildner belehren wollte. Mit welchem Rechte könnte der Mensch denjenigen tadeln, der die Urteilskraft verleiht? Wie könnte er ohne den urteilen, der ihn vernünftig gemacht hat? Welches Wissen könnte den richten, der alles weiß? Du hast von ihm deinen Verstand erhalten, sei also durch das dir Verliehene verständig, und wenn du von ihm etwas empfangen hast, so nahe ihm durch das Seinige [durch die verliehene Vernunft]! Die Gabe des Gebers bringt dich ja zum Geber; durch die Einsicht, die er dir verliehen, vermagst du dich selbst und deinen Gott zu erkennen. Was immer von ihm dir zufließt, zieht dich in Ruhe zu ihm; aber deine Anstrengung reicht nicht aus, um zu ihm zu gelangen. Er hat dir Vernunft gegeben und dich erhöht; setze doch nicht durch sie ihren Geber herab! Wenn du Gewinn erzielt hast und reich geworden bist, so verdankst du ihrem [der Vernunft] Kapital die Größe des Gewinnes. Dein Wissen stammt von ihm; du hast nur das Abbild, er die Vollendung. Wenn du durch den Verstand, den sein Hauch dir einblies, deine Schuldigkeit erkennst, um wieviel größer wird dann die Erkenntnis desjenigen sein, der die Quelle des Verstandes selbst ist! Betrachte genau die erlangte Erkenntnis deiner Schuldigkeit, so wirst du erkennen, daß sie der Weisheit anderer bedarf. Wo bleibt also dein Wissen? Es ist nichts im Vergleiche zur [wahren] Weisheit. Es ist also Vermessenheit, wenn das Geschöpf weiser sein will als sein Schöpfer.</p><p>Wer nun solche Wissenschaft besitzt, der möge dir sagen, von wem er sie erhalten hat. Wenn er sie nicht von seinem Herrn empfangen hat, dann ist er weder dessen Diener noch dessen Freund. Er kann sich aber nicht verbergen; denn es gibt ein Mittel, das ihn offenbart: daß er nämlich des Schöpfers bedarf, überführt ihn, daß er ein Geschöpf ist. Wenn aber sein Herr ihm verliehen hat, zu wissen, wie kann der Herr dann von ihm getadelt werden? Er kann ja über die Gabe nicht hinausgehen, die er von Gott empfangen hat. Je größer aber die ihm verliehene Gabe ist, desto mehr bedarf er des Gebers. Wenn dieser den Dürftigen nicht vollkommen gemacht hat, so kommt dies nicht daher, daß sein Schöpfer dazu zu schwach wäre, sondern er hat ihn dem Bedürfnis unterworfen, damit er fühle, wer ihn ernährt. Alles, was der Erschaffene hat, hat er von dem Einen aus Gnade empfangen.</p><p>Wenn nun der Erschaffene schon durch die ihm nur geliehenen Gaben groß ist, um wieviel größer muß dann der Herr der Güter sein? Seine Güte drängte ihn heftig, dir viele Gaben zu verleihen. „Er ist arm geworden, um dich reich zu mache“. Sei nicht bei seinem Reichtum arm; denn es gefällt ihm nicht, wenn du in deiner Dürftigkeit bleibst. Seine Armut hat dich reich gemacht, mache sie nicht arm durch dein Grübeln! Er, der alles reich macht, wird freilich nicht arm; arm wird nur der Grübler selbst. Weit besser als du ist der Stumme, der sich gegen seinen Schöpfer nicht empört; weit besser als du ist der Taube, der über seinen Erschaffer nicht grübelt. Dein sprachfähiger Mund redet vermessen; besser als du ist der Schweigende. Unser Herr hat dich über beide erhöht; du aber vergiltst ihm auf verkehrte Weise. Der Erstgeborene [der Sohn Gottes] hat deine Niedrigkeit erhöht; erniedrige du seine Erhabenheit nicht! Doch derjenige, der alle erhöht, wird nicht niedriger; nur dich erniedrigt das Grübeln über ihn. Seine Güter verwandeln sich dir ins Gegenteil, wenn du dich verkehrt beträgst.</p><p>Werde nicht arm durch den, der alle reich macht; nicht erniedrigt durch den, der alle erhöht! Verirre dich nicht durch den, der alle sammelt; gehe nicht verloren durch den, der alle findet! Wenn du nämlich über ihn grübelst, so verirrst du dich durch ihn. Willst du ihn ermessen, so gehst du durch ihn verloren. Willst du ihn erfassen, so wirst du umfaßt [so daß dir kein Ausweg bleibt]; denn er ist unbegrenzt. Der Erforscher ist mehr als das von ihm Erforschte. Du nennst ihn Schöpfer und grübelst doch über ihn wie über ein Geschöpf. Du nennst ihn den Allerhöchsten und erniedrigst ihn zur Untersuchung; denn wer erforscht werden kann, ist niedriger, und derjenige, der ihn erforscht, ist größer. Wenn Gott vom Menschen erforscht und begriffen werden könnte, so würde ein Schiedsrichter den Forschenden und Begreifenden vorziehen. Wie könnte also ein Mund, der sich soweit erfrecht, von Schuld freigesprochen werden? Knechte ehren hoch ihre Herren und Kriegsheere ihre Könige; du aber erniedrigst den allerhöchsten Erstgeborenen durch Grübelei. Dem Feuer zu nahen, bist du zu feig; aber gegen dessen Schöpfer erhebst du dich vermessen. Die Glut des Feuers erschreckt dich; aber über die Erhabenheit sinnest du grübelnd nach. Weil du [dabei] nicht versengt worden bist, erhebst du dich stolz. Die Barmherzigkeit verschonte dich gnädig, Schwächling; aber aus den Blitzen, die andere verbrannten, nimm ab, wie sie dich gnädig verschonte, o Frecher! Lerne den Sender kennen aus dem Blitze, der von ihm entsendet wird! Dein Auge fürchtet sich vor dem Blitze und dein Ohr vor dem Donner, und doch hat es deine Zunge so eilig, den Herrn beider zu ergründen.</p><p>Die sichtbaren Dinge begreifst du nicht, wie kannst du dann den Unsichtbaren begreifen wollen? Du stehst als ein armseliges Geschöpf da, einer aber ist die Schöpfung voll. Du bist nur an einem Orte, er aber ist größer als jeder Raum. An welchem Orte willst du wohl den suchen, der von keinem Orte umschlossen wird? Siehe, in diesem kleinen Raume kann dein Verstand nicht umherfliegen. Untersuche nur das, was vom Himmel abwärts unten ist! An den sichtbaren Dingen erprobe deinen Scharfsinn! Rede über die Quellen, diese offenen, nie versiegenden Schätze! Werden sie aus nichts erzeugt oder werden sie aus etwas gesammelt? Wenn sie aus einem Vorrat erzeugt werden, dann ist der Schöpfer arm, weil auch er, wie der Mensch, seine Schatzkammer aus etwas versehen muß. Aber der Schöpfer ist nicht arm, wohl aber der Grübler. Sein Wille ist seine Schatzkammer; denn aus nichts entstand alles. Wenn aber die Wasser nur immer wieder an ihren Ort zurückkehren würden, dann wäre der Schöpfer nur in der Kunst größer als der Mensch. Durch den Willen ist der Schöpfer groß; denn sein Wille ist sein Wirken. Er ist keiner Kunst unterworfen, die ihm erst zeigen müßte, wie er es machen solle; sie kann ihren Schöpfer nicht belehren, wie er schaffen müsse. Keine Kunst gebietet jenem Willen, der alles erschafft.</p><p>Ein Künstler ist nämlich wie ein Sklave unter dem Joche der Kunst; er arbeitet nicht nach seinem Willen, sondern ist der Kunst unterworfen. Er steht zwischen Zweifeln, weil er nicht, wie er will, arbeitet; bald will er, bald will er nicht. Von der Kunst geht ihm wie einem Unbeholfenen die Anleitung zu. Der Schöpfer dagegen wird nicht von der Kunst unterstützt, sondern er hat die Kunst geschaffen, daß sie den Menschen unterstütze. Durch sie wird der Künstler befähigt, aus etwas etwas zu bilden. Wenn es sich bei Gott auch so verhalten würde, so wäre er dem Menschen gleich; wenn er auch größer an Kunst wäre, wäre er doch bezüglich seiner Gottheit verkleinert. Ist aber Gott wirklich Gott, so hat sein Wille Macht über alles. Der Mensch schafft aus etwas, Gott aus nichts.</p><p>Ebensowenig als unser geschöpfliches Wesen dem absoluten Wesen gleichkommt, gleicht es ihm an Wirkungsmacht. Schildere uns doch, welcher Art das Wesen des Himmels ist! Ist der Himmel dicht oder fein, naß oder trocken? Gewaltiger als das Feuer hier unten ist die Sonne oben, und doch verbrennt sie das Firmament nicht, weil es [Gottes Gebot] nicht gestattet. Der nämliche Befehl hält sie zurück, welcher das Feuer des Ofens zurückhielt. Was wäre wohl imstande, die unbegreiflichen Geschöpfe zu beschreiben? Sind ja selbst die sichtbaren Dinge, sobald man sie erforschen will, wie wenn sie unsichtbar wären. Wenn nun schon die sichtbaren Dinge verborgen sind, um wieviel mehr die unsichtbaren? Und wenn die unsichtbaren Geschöpfe verborgen sind, um wieviel mehr muß der verborgen sein, der sich in seine geheimnisvolle Wesenheit hüllt! Deine Gier [zu grübeln] ist viel größer als die Wissenschaft deines Forschens. Vor dem Feuerbrande fliehst du, aber den Herrn desselben bestrebst du dich zu erforschen. Fürchtest denn du nicht das Feuer, wie dieses sich vor seinem Herrn fürchtet? Wenn du aber das Feuer fürchtest, so fürchte dich auch vor dem, der im Feuer wohnt! Das Feuer, welches [Gott] dient, ist so überaus glänzend; um wieviel glänzender muß der sein der von ihm bedient wird! Vor dem Dinge, das dient, fliehst du; aber über den, dem gedient wird, grübelst du.</p><p>In herrlicher, aber nur entlehnter Schönheit betraten die Engel Sodoma. Beim Anblicke ihrer alles überragenden Schönheit wurde jung und alt rasend in sie verliebt. Da kam das Feuer der Höhe zur Hilfe der Söhne der Höhe herab, nicht um die Heiligen zu retten, sondern um die Frevler zu verderben. Die Himmlischen hatten eine andere Gestalt angenommen, darum wagten die Irdischen solche Frechheiten. Wären die Geisteswesen in Strahlenglanz erschienen, so wären die Staubgeborenen erschreckt zu Boden gestürzt. Sie hielten die Engel, die geistiger Natur sind, für ihresgleichen; daher ging ihre Lüsternheit über die Grenzen ihrer Natur hinaus und überschritt sie doch wieder nicht. Der wenn auch unnatürliche Umgang verlangte nach Wesen gleicher Gattung, nicht aber nach Himmelsbewohnern, die ganz anderer Natur sind. Wesen, die nicht Söhne unserer Erde sind, sind nicht geschaffen für den Umgang mit uns. Nur wenn sie zu uns gesandt werden, dann können sie durch den Willen des Allmächtigen mit uns verkehren. Die Lüsternheit [der Sodomiten] begehrte also der Himmlischen, welche die Gestalt der Irdischen angenommen hatten. Dies war gegen ihre Natur und doch wieder innerhalb ihrer Natur, da sie ja nur nach ihresgleichen begehrten.</p><p>Wer über Gott nachgrübelt, dessen Tollheit überschreitet die Grenzen der Natur. Er bekennt zwar seinen Glauben an das absolute Wesen, forscht aber doch darüber wie über ein Geschöpf. Er erhebt Gott überaus hoch dem Namen nach, aber durch das Grübeln erniedrigt er ihn wieder. Gib entweder die Benennung oder das Forschen auf! Nennst du ihn Gott, so muß alles Grübeln aufhören; zwischen Gott und dem Mengen wird nur Glaube gefordert. Glaubst du an ihn, so ehrst du ihn; forschest du aber über ihn, so entehrst du ihn. Zwischen dem Menschen und Gott gibt es nur Glaube und Gebet; denn du mußt seiner Wahrhaftigkeit glauben und zu seiner Gottheit beten. Er sagt in der Hl. Schrift, daß er die Geschöpfe erschaffen habe. Du glaubtest es ihm, ohne es gesehen zu haben. Du hast das, was du glaubtest, nicht selbst erfahren; hättest du es selbst erfahren [und nur deshalb geglaubt], so hättest du ihn dadurch für unzuverlässig gehalten. Wie nämlich das Selbsterfahren dem Glauben entgegen ist, so auch die Grübelei. Die Grübelei forscht; wenn sie aber forscht, glaubt sie nicht; ja, je mehr sie forscht, desto weiter entfernt sie sich vom Finden.</p><p>Der Glaube geht nicht irre, er findet die klare Wahrheit, da sie ihm ja entgegenkommt. Die Einheimischen werden aber von den Auswärtigen als vermessene Menschen zurechtgewiesen. Durch Irrende wird ferner der Wissende beschämt, der da weiß und doch verwegen forscht. Die Anbeter der Sonne forschen nicht über sie nach, die doch nur ein Geschöpf ist. So offenkundig auch ihre [der Sonne] Dienstbarkeit ist, so geben sie ihr doch den Namen ihres [der Sonne] Herrn. Auch der Heide untersucht das Götzenbild nicht, das der Irrwahn. bildete. Denn wenn er es untersuchen würde, dann könnte er es unmöglich mehr anbeten. Er könnte nicht mehr zu ihm beten, weil er erforscht hätte, daß es taub ist. Die Erfahrung würde ihn belehren, daß es weder sieht noch hört. Der Irrtum gestattet also den Irrenden nicht, daß sie nachforschen, führt aber das Forschen bei den Gläubigen ein, um ihnen den Tod zu bringen Er [der Irrtum] verhindert nämlich [bei den Heiden] das Forschen, um sie blind zu erhalten; dagegen gestattet er es [den Christen], um sie blind zu machen. So heilsam es ist, ein Götzenbild zu untersuchen, ebenso verderblich ist es, über Gott nachzugrübeln.</p><p>Der Irrtum verleiht Glauben, wo Untersuchung nützlich wäre, führt aber das Forschen ein, wo nur der Glaube erforderlich ist. Findet einmal das Forschen Eingang, dann ist es um den Glauben geschehen, und der Mensch kommt wegen seiner Schwäche bei beiden nicht zum Ziele; denn er erreicht nichts für das Forschen und gewinnt nichts für den Glauben. Untersuche den Tauben, damit du erfahrest, daß er des Gehöres beraubt ist; untersuche aber nicht bei dem alles Hörenden, wie und wodurch er hört! Er hört nämlich nicht mit Ohren, weil er ganz und gar Gehör ist; er sieht auch nicht mit Augen, weil er voll und ganz Gesicht ist. Er ist ein Wesen, das mit seinem ganzen Sein hört und sieht. Nimm zum Glauben deine Zuflucht; denn Gott ist über alle Forschung erhaben! Nur der Glaube kann unsere Schwäche beleben.</p><p>Weil der Irrtum die Schwachen beneidete, reizte er sie durch die Forschung, versah sie durch die Kritik mit scharfen Waffen und stellte sie zur Schlacht auf, da er sah, daß die Liebe gekommen war, um den Menschen zum Himmel emporzuführen. Die Streitsucht beeilte sich, die zum Himmel führende Wurzel abzuschneiden. Da verstummte der Disput mit den Ungläubigen und die Untersuchung der Irrlehren. Die Streitsucht sah, daß ihre Partei unterliege und gestürzt werde, da lieh sie sich die Larve der Wahrheit, um dadurch die Kinder der Wahrheit zu täuschen. Sie verursachte unter ihnen durch die Forschung Spaltungen, indem sie gegen die Erhabenheit [Gottes] aufreizte. Da die Außenstehenden die siegreiche Partei nicht zu besiegen vermochten, so wurde sie jetzt dadurch besiegt, daß sie unter sich zu streiten begann.</p><p>Unserer Schwäche genügt die Wahrheit, die mit offenkundigen Erweisen kam. Bekenne einfach, daß es wirklich einen Vater und einen Sohn gibt, genau wie die Namen lauten! Die Voraussetzung des Namens ist das Objekt, mit ihm sind die Namen verbunden; denn wer würde etwas, das gar nicht existiert, einen Namen beilegen? Wie könnte denn eine Frucht diesen Namen tragen, wenn sie nicht wirklich vorhanden wäre? Nenne also den Vater den Stamm und heiße den Sohn seine Frucht! Er ist mit ihm vereinigt und von ihm getrennt; er ist in seinem Schoße und zu seiner Rechten. Wenn er nicht mit ihm verbunden wäre, so wäre er nicht als sein Geliebter in seinem Schoße, und wenn er nicht von ihm getrennt wäre, so säße er nicht zu seiner Rechten. Er ist mit ihm vereinigt, weil er in seinem Schoße ist, und er ist von ihm getrennt, weil er zu seiner Rechten sitzt. Eins sind sie durch einen Willen, zwei aber wegen der zwei Namen. Sie haben nicht zwei Willen, wohl aber zwei Benennungen. Den Namen der Vaterschaft, weil er Vater ist: dieser Name schließt seinen Ruhm in sich; und den Namen der Sohnschaft, weil er Sohn ist: dieser Name schließt seine Erzeugung in sich. Der Name „Vater„ zeigt das Verhältnis an und der Name „Sohn“ verdeutlicht es. Die Ordnung der Namen schließt die Ordnung ihres gegenseitigen Verhältnisses ein. Wie ihre Namen nicht verborgen sind, obwohl sie eins sind, so wird auch ihr Verhältnis, daß sie eins sind, nicht verheimlicht. Die Juden allerdings wollten den Sohn, der doch nicht verheimlicht werden kann, verheimlichen; aber seine Geschichte ist von seinen Propheten geoffenbart und in geheimnisvollen Vorbildern deutlich dargestellt.</p><p>Auch die Frucht und der Baum sind nicht eines, obwohl sie eins sind. Die Frucht ist als Frucht bekannt und der Baum als Stamm. Durch ein und dieselbe Liebe sind sie vereinigt, aber durch zwei Namen getrennt. Den Namen Frucht trägt die Frucht allein; Baum aber ist der Name des Stammes. Es sind da zwei Namen und zwei Dinge durch eine Kraft und durch eine Liebe verbunden: Wäre bloß der Name Frucht vorhanden, die Frucht selbst aber würde nicht existieren, so würde man mit Baum den Stamm, mit dem Worte Frucht aber etwas bezeichnen, was jener nicht hervorbringen würde. Gleichwie aber der Baum sowohl dem Namen als auch der Sache nach existiert, ebenso ist auch die Frucht dem Namen und der Wirklichkeit nach vorhanden. Wäre die Frucht nur dem Namen, der Stamm aber der Sache nach vorhanden, dann würde man Lüge und Wahrheit zugleich nennen, da das eine wäre, das andere aber nicht. Ist also der Vater wirklich, so ist auch der Sohn wirklich, und zwar sowohl dem Namen als auch der Wirklichkeit nach.</p><p>Wie nun einerseits der Vater und der Sohn nicht zwei Willen haben können, so müssen sie doch anderseits wieder in Wahrheit als Zweiheit angesehen werden. Den Vater haben wir durch seinen Namen kennen gelernt, ebenso ist uns der Sohn durch seinen Namen bekannt geworden. Ohne die Namen gibt es kein Wissen, durch den Namen werden die Begriffe vermittelt. Nimm die Namen und die Bezeichnungen weg, dann werden alle Ordnungen durcheinander geworfen. Du erkennst dann nicht, wen du [im Gebete] anrufst; du weißt dann nicht, wen du bekennst. Du kannst dann nicht unterscheiden, wer gezeugt hat, und ebensowenig erkennen, wer gezeugt wurde; denn die zwei Namen sind wie zwei Leuchten gekommen. Sie verscheuchten das Dunkel, das den Zuhörern den Unterschied verhüllte. Den Vater lernst du durch seinen Namen kennen und ebenso den Eingeborenen durch seine Benennung. Du hast gehört: Vater! Das ist genug für dich. Auch der Name „Sohn“ reicht für dich hin. Hier gibt es kein Angesicht, daß du aus den Gesichtszügen belehrt werden könntest. Die Namen gelten uns als die Gesichter, durch ihre Namen kann man sie unterscheiden. So lernt man ja auch weit entfernte Menschen durch ihre Namen kennen. An die Stelle der entfernten Angesichter treten die nahen Namen, an die Stelle der Gesichtszüge die Benennungen, an die Stelle der Gestalten die Namen. Der Laut flammt anstatt des Lichtes auf, die Stelle des Auges vertritt das Gehör. Das Ohr naht den Namen und unterscheidet sie wie Gestalten.</p><p>Aber auch die Gleichnisse sind nicht imstande, die Wahrheit vollkommen darzustellen. So kann z. B. die Frucht eines Baumes über den Erstgeborenen keine erschöpfende Aufklärung geben. Die Frucht hängt nämlich an ihrem Baume, aber wenn man sie abgepflückt hat, ist sie von ihm getrennt; denn sie kann nicht mehr an ihrem Baume sein, wenn sie bei dem ist, der sie weggenommen hat. Der Erstgeborene ist aber bei seinem Vater, er blieb bei ihm und kam zu uns, er ist bei ihm und auch bei uns. Er kam und ging, obwohl er doch überall ist. Die Schöpfung ist voll von seinem ganzen Wesen, während er doch ganz in seinem Vater ist. Weder sein Gehen noch sein Kommen vermag ein Mund auszusprechen. Ehe er kam, war er schon hier, und auch, nachdem er wegging, ist er noch da. Bevor er zu seinem Vater ging, war er schon ganz bei ihm. Er ging dorthin, obwohl er schon dort war. Er kam hierher, obwohl er bereits hier war. Sein Gehen und sein Kommen ist wirklich. Er kam und ging, ohne zu scheiden. Gott ist allgegenwärtig, seine Frucht ist nicht von ihm entfernt. Vom Erstgeborenen, der alles erfüllt, ist auch sein Vater nicht entfernt. Wenn die Geschöpfe von ihm abhängen, wie können sie da fern von ihm sein? Ferne ist seine Nähe und nahe ist seine Ferne. Ferne ist er, wenn er auch noch so nahe ist. Wer kann über ihn sich aussprechen?</p><p>Wie hat sich doch Adams Vermessenheit auf seine Kinder fortgepflanzt! Adam strebte vermessen nach höherem Range, seine Kinder erhoben sich frech gegen seinen Herrn. Die Kinder Adams forschten und wähnten dann, Gott erfaßt und begriffen zu haben. Wer sich gegen Gott vermessen erhob, der schaue auf Adam wie in einen Spiegel! Auch derjenige, der Gott erforscht zu haben vermeint, ist des Todes schuldig [wie Adam]. Nicht weil er weiß, daß Gott existiert, ist er schuldig, sondern weil er sich erfrechte zu grübeln. Wenn du einmal glaubst, daß das absolute Wesen ist, so ist es Zweifelsucht. wenn du weiter grübelst. Wenn du weißt, daß er ist, so forsche nicht, wie er ist. Von wo aus willst du denn den Unbegrenzten sehen? Willst du das absolute Sein untersuchen, wohlan, so beginne an seiner Grenze! Und wenn du dann gefunden hast, daß er unbegrenzt ist, von wo aus willst du dann zu messen beginnen? Hältst du dich in der Mitte auf, dann bist du von seiner Grenze entfernt. Wenn du also an jeder Stelle dazu unfähig bist, so kehre doch zum Gebote zurück! Schaue auf Adam! Wäre er beim Gebote geblieben, so wäre er Herrscher geworden. Weil er sich aber erkühnte, das Gebot zu übertreten, so erlangte er die gewünschte [Herrscher-] Würde nicht. Als ihn Gott schuf, schuf er ihn zu einem erschaffenen Gott, indem er ihm die Freiheit verlieh, nach seinem eigenen Willen zu wandeln. Allein Adam wollte törichterweise nach dem verlangen, was er bereits besaß; während er aber mit aller Gewalt danach trachtete, verlor er auch das, was er bereits besaß.</p><p>Gott gab dir nun die Gebote als Lehrmeister. Sie belehren dich: Wenn du sie beobachtest, wirst du ein Bruder Christi. Anstatt aber auf sie einzugehen, suchst du, wie du ihnen entgehen könntest. Trete ein in die Untersuchung der Gebote, und sie werden dir als Spiegel dienen. Schaue in ihnen deine Aufgabe und deine Pflicht! Suche in ihnen den Lohn und die Verheißung! Ferner sollen dir die Gerechten ein Vorbild der Liebe sein! Ahme sie nach! Betrachte z. B. den Henoch und sei ebenso tugendhaft! Ahme den Noë, den zweiten Stammvater, nach! Wenn du aber meinst, sie zu übertreffen, kannst du Abraham übertreffen? So zahlreich auch deine Tugenden sein mögen, sein Schoß bleibt doch der Hafen, in den du einlaufen sollst Unser Herr lehrte dich in seinem Evangelium, daß dein Weg zu ihm [Abraham] führe. Forsche daher als ein Verständiger, wie sein Wandel beschaffen war! Wenn aber Abraham nur dadurch, daß er glaubte, die allerhöchste Stufe erlangte, wie willst dann du durch Grübeln auf seiner Stufe stehen? Zweierlei kann man von ihm lernen: Glauben und Nicht-Forschen; denn weil er glaubte, empfing er die Verheißung; weil er nicht forschte, erhielt er das Reich. Wer glaubt, grübelt nicht; wer aber grübelt, glaubt nicht.</p><p>Siehe! Abraham hätte gar wohl über die Worte, die er vernahm, nachgrübeln können; denn er hatte nicht durch ein Gebot gelernt, daß ein Gott im Himmel ist, sondern er urteilte aus sich selbst, daß die Schöpfung einen Herrn haben muß. Der aber seinen Gedanken sah, offenbarte sich ihm, damit er in seinem Glauben bestärkt wurde. Als aber Abraham eingesehen hatte, daß Gott ist, grübelte er über ihn nicht nach, wie er sei. Und auch nachdem sich ihm Gott geoffenbart hatte, fragte ihn Abraham nicht: Wie bist du? Er kannte auch den Messias, forschte aber nicht, wie er sei. Er sah ihn und sehnte sich mit Freuden nach ihm. Er vollbrachte das Geheimnis und beobachtete Stillschweigen. Wie wagst du dich also kühn an die Erforschung des Eingeborenen? Fliehe und verberge dich, bei den Geboten forschend, was du zu tun hast und wie du das Leben erlangen kannst! Untersuche, welches der Gebote für dich der Schlüssel zum Leben sein könne!</p><p>Beachte jedoch, welche Gebote nur ihrer Zeit dienen sollten und nur für sie zweckdienlich waren, und laß dich nicht beirren, wenn du einander widersprechende Aussprüche vernimmst! So lautet ein Ausspruch: „Ich will Schlachtopfer“, und ein anderer: „Ich verabscheue die Brandopfer“; ein Ausspruch lautet: „Reinige das Unreine!“ und ein anderer: „Vermische und iß!“ Ein Ausspruch lautet: „Feiere Feste!“ und ein anderer: „Ich entweihe die Feste“; ein Ausspruch lautet: „Heilige den Tag!“ und ein anderer: „Ich verabscheue die Sabbate“; ein Ausspruch lautet: „Beschneide das Männliche!“ und ein anderer: „Ich verabscheue die Beschneidung“. Wenn du all’ dieses vernimmst, so ergründe die Zwiespältigkeit durch Untersuchung und laß dich nicht wie so viele irre führen welche die Tiefe verschlang!</p><p>Höre also: Die Aussprüche ergingen zwar aus Einem Munde, aber an verschiedene Geschlechter. An das erste Geschlecht erging ein Ausspruch, das Geschlecht verschwand und mit ihm das Gebot; es kam ein anderes Geschlecht und es erfolgte ein anderer Ausspruch, der ein neues Gesetz verordnete. Die Aussprüche aller Geschlechter sammelten sich und häuften sich an bei dem einen [letzten] Geschlechte. Es traten nun Toren auf, welche die sich widersprechenden Aussprüche durch die Annahme verschiedener Götter, als Urheber derselben erklärten. Sie sahen eben nicht, daß auch die einzelnen Geschlechter einander unähnlich waren und daß dieselben sich in ihrer Handlungsweise von einander unterschieden. Wenn das Gesetz eines Geschlechtes alle Geschlechter verpflichten würde, warum hat dann die Flut jene hinweggerafft, die sich doch dem Baume nicht genaht hatten? Wenn der Ausspruch an Adam sich auch auf Noë bezog, wie stand es dann mit der Vergeltung, da er ja gegenstandslos war? Es müssen aber in allen Geschlechtern entsprechende Verordnungen vorhanden sein, und daher ergingen an die [einzelnen] Geschlechter Aussprüche zum Frommen der Söhne des [jeweiligen] Geschlechtes. Aber auf diese Weise häuften und vermehrten sich die Aussprüche; die gehäuften Aussprüche verwirrten die Unwissenden, so daß sie von dem Einen [Gotte] abirrten. Aus den [vielen] auf Erden geschehenen Aussprüchen schlössen sie auf [mehrere] Götter im Himmel.</p><p>Zahlreich waren die Aussprüche der Propheten, welche der Gebrechlichkeit wehren sollten; alle möglichen Arzneien wandten sie gegen die Krankheit der Hinfälligkeit an. Es gibt Gebote, welche zessieren, weil das frühere Leiden nicht mehr vorhanden ist; es gibt aber auch solche, welche fortbestehen, weil auch die Leiden fortbestehen. Die Apostel und die Propheten sind ja Seelenärzte. Sie brachten Heilmittel herbei, welche dem Elend der Menschheit entsprechen; sie bereiteten Arzneien für die Krankheiten ihrer Geschlechter. Ihre Arzneien dienen aber den Späteren wie den Früheren. Es gibt Krankheiten, welche den einzelnen Geschlechtern eigentümlich sind, und Krankheiten, welche allen Geschlechtern gemeinsam sind. Gegen die neu auftretenden Krankheiten gaben sie neue Arzneien, gegen die in allen Geschlechtern gleichbleibenden Krankheiten gaben sie gleichbleibende Arzneien. So gab man das Gebot: Du sollst nicht stehlen! Die Krankheit dauert fort, daher auch das Gegenmittel. Man gab das Gebot der Beschneidung; die Krankheit ist verschwunden und damit auch das Gegenmittel. Man richtete für die Beschnittenen ein Instrument gegen die neu aufgetretenen Krankheiten her; aber die Instrumente, welche man wegen der früheren Krankheiten hergerichtet hatte, sind unnütz geworden, weil diese Krankheiten heute nicht mehr bestehen. Weil der Schaden beseitigt ist, ist das Instrument überflüssig geworden. So sind heutzutage die Gebote des Sabbats, der Beschneidung und der [levitischen] Reinheit für uns Spätere überflüssig, den Mittleren waren sie jedoch nützlich. Den Früheren waren sie unnütz, weil diese durch die Erkenntnis gesund waren; auch den Späteren sind sie unnütz, da diese durch den Glauben gesund sind. Nur den Mittleren dienten sie, da diese durch das Heidentum verletzt waren. Wer sich heutzutage noch der Gesetze als Instrumente bedient, der ist ein Genosse des Mörders, weil er gesunde Glieder abtrennt.</p><p>Die Gesetze sind eisernen Instrumenten gleich, so belehrt dich Jeremias. Den Verwundeten sind sie nützlich, verletze aber nicht damit die Unversehrten! Sie sind für die Krankheiten bestimmt, verwunde nicht mit ihnen die Gesunden! Schlimmer als die sichtbaren Verletzungen sind jene, welche die unsichtbare Seele beschädigen. So heilsam sie für die Kranken sind, so schädlich sind sie für die Gesunden. Du darfst den gesunden Körper nicht quälen, weil dir Arzneien zu Gebote stehen. So ruhten auch schon zu ihrer Zeit bisweilen die Gesetze; denn, wo Gesundheit war, brauchte man keine Binden und Arzneien, die ärztliche Behandlung ist bei Gesunden überflüssig. Wenn aber noch zur Zeit der Krankheit die Arznei da und dort unnütz war, so sind jetzt, wo das [Juden-] Volk und seine Krankheiten verschwunden sind, seine Arzneien erst recht unnütz.</p><p>Die eine Krankheit hörte auf, die andere besteht fort; die eine Arznei hörte auf, die andere besteht fort. Die Krankheiten und die Arzneien der Opfer, der Sabbate und der Zehnten hörten auf, es bleiben aber die Krankheiten und die Arzneien: Du sollst nicht schwören, du sollst nicht stehlen, du sollst nicht ehebrechen! Laufe doch nicht einem Gesetze nach, das samt seiner Krankheit aufgehört hat; hab’ aber recht acht auf das Gesetz, das Arznei für deine Verletzung ist, behandle jedoch deine Wunden nicht mit Arzneien, die nutzlos sind! Du häufst nur Krankheit auf Krankheit, wenn du zur Schuld Eigensinn hinzufügst. Der Gesetzgeber zürnt, weil du bindest, was er gelöst hat. Das Gesetz, das er dir gab ist abgeschafft, aber du beobachtest, was er gelöst hat.</p><p>O Tor, denke doch ein wenig über die Gesetzesbeobachtung nach! Was hilft denn die Beschneidung, wenn die Sünde im Innern bleibt? Die Sünde bleibt in deinem Herzen, aber deine Vorhaut schneidest du weg, statt daß du bei dir sprechen würdest: Die Beschneidung war zu ihrer Zeit vortrefflich; der All-Hirte hat sie der törichten Herde, die er sich erworben, zum Merkmal gemacht. Der Allwissende hat sie der Schar, welche ihre Führer tötet, zum Zeichen gemacht. Es [das Judenvolk] war eine Herde, die sich immer wieder unter die verirrten Herden mischte. Er bezeichnete sie [diese Herde = Juden] daher mit einem sichtbaren Merkmale, damit sie auch gegen ihren Willen abgesondert bliebe. Denn das sichtbare Zeichen, das er ihnen gab, sollte das Ungestüm ihrer Tollheit zügeln. Er hat die Herde nur wegen dessen, was in ihr war, behütet. Was in ihr verborgen war, trat hervor und ward der Hüter der Menschheit. In der armseligen Herde war verborgen der Hirte der Hirten. Er verließ die törichte Herde, damit die [Heiden-] Völker seine Herde würden.</p><p>Bereite dir doch keinen Schmerz durch die Beschneidung, deren Zeit vorüber ist; bereite dir aber Schmerz durch eine [andere] Beschneidung: beschneide die häßlichen Auswüchse in deinem Innern! Dein Wille ist freigeboren; der kann dich durch Beschneiden von der Sünde befreien. Äußere Gewalt kann nicht ins Innere dringen und deine Gesinnung beschneiden. Beachte, daß derjenige, der ihnen die Körper zu beschneiden gebot, ihnen auch zurief: „Beschneidet eure Herzen!“ Warum forderte er eine andere Beschneidung, da doch ihr Fleisch schon beschnitten war? Wenn er eine andere Beschneidung verlangt, so wende die äußerliche nicht mehr an!</p><p>Erwähle dir das erste Gebot, den König aller Gebote! Erwähle das zweite Gebot, den Heerführer aller Gebote! Vom Könige und vom Heerführer hängt ja das ganze Heer ab. Und an diesen zwei Geboten hängen auch das Gesetz und die Propheten. Laß den Sabbat und die Beschneidung; denn sie haben dich auch freigelassen und sind abgeschafft! Du bist zum innerlichen Leben verpflichtet, beobachtest aber nur Äußerlichkeiten. Die Seele im Innern geht verloren, aber der äußerliche Sabbat wird beobachtet.</p><p>Die abtrünnigen [Juden] beobachteten die Gebote zu ihrer Zeit nicht, aber uns will man jetzt zwingen, das Gesetz zu beobachten, dessen Zeit abgelaufen ist. Es [das Judenvolk] will seine frühere Krankheit den Gesunden verschaffen; durch Schneiden, Brennen und Arzneien, die gegen seine eigenen Krankheiten bestimmt waren, sucht es die gesunden Glieder zu zerfleischen. Es bestrebt sich, die Handschellen, Fußfesseln und Bande, welche für seine eigene Sklaverei bestimmt waren, denen anzulegen, die sich durch die Liebe seines Herrn der Freiheit erfreuen. Der rohe Sklave bemüht sich, den Freien seine eigenen Fesseln anzulegen und verlangt, daß sie stolz seien auf das Joch, das ihnen ein Sklave auferlegt. Unter dem Scheine der Ehre will er die Freigeborenen beschimpfen. Er treibt uns zu Moses, um uns dadurch von Christus zu trennen.</p><p>Wenn es [das Judenvolk] schon darauf stolz ist, daß es an der Seite des Sklaven [Moses] steht, um wieviel mehr darf derjenige stolz sein, der an der Seite des Herrn selbst steht. Aber es steht gar nicht einmal an der Seite des Sklaven, wer den Herrn des Sklaven verleugnet. Von ihnen [den Juden] wird Moses beschimpft, bei uns dagegen geehrt. Den Herrn muß man ehren, wie es einem Herrn gebührt, die Sklaven aber, wie es Sklaven gebührt. Den Moses hat es [das Judenvolk] zu seiner Zeit verfolgt und seinen Herrn hat es zu seiner Zeit gekreuzigt. Schon damals, als die [Heiden-] Völker noch im Irrtum waren, war er [Christus] zu ihnen geflohen [nach Ägypten]. Heute, wo das Volk [der Juden] ihn verleugnet und im Irrtum ist, ruft er die [Heiden-] Völker zu sich. In der Gemeinde der Völker herrscht Reinheit, in Ägypten aber herrschte [damals] Unreinheit.</p><p>Es [das Judenvolk] wäre wieder nach Ägypten zurückgekehrt, wenn das Meer es nicht daran gehindert hätte Das Land voll Heiligkeit [die Kirche] betrat es nicht, aber dem Land voll Trug [Ägypten] eilte es zu. Es hatte zuviel Blut gekostet, daher konnte es das Morden nicht mehr lassen. Damals mordete es offen, jetzt mordet es heimlich. Es durchstreift Land und Meer, um seine Anhänger der Hölle zuzuführen. Es hat keine Propheten mehr, die es in seiner Raserei offen morden könnte; es wurde unter die Könige zerstreut, damit sie es mit Gewalt zur Ruhe brächten. Aber es sah, wie die Heiden auf die Propheten und nicht auf die Dämonen achteten, daher legte es die Maske gerade der Propheten an, die es vordem gemordet hatte. Je nach Bedarf legte es den Prophetenmantel an oder ab, um durch Disputieren [über Bibelworte] zu morden. Die Leiber der Propheten hat es gemordet, ihre Stimmen aber hat es angenommen, um statt der Propheten diejenigen zu morden, die in den Propheten lesen.</p><p>Armseliger, fliehe vor ihm [dem Judenvolke]; denn nichts gilt ihm dein Tod und dein Blut! Es hat das Blut Gottes auf sich genommen, sollte es da vor deinem Blute zurückschrecken? Es trägt kein Bedenken, dich in Irrtum zu führen; es trug ja auch kein Bedenken, sich selbst in Irrtum zu führen. Es hat sich nicht gescheut, unter der Wolkensäule ein Kalb anzufertigen, und hat sich nicht entblödet, im Tempel ein Bild mit vier Gesichtern aufzustellen. Gott hing es am Kreuze auf: die Geschöpfe erschauderten, als sie es sahen. Der Geist zerriß den Vorhang, damit der Ungläubige sein Herz zerreiße. Die Felsen der Gräber spalteten sich, aber das Herz von Felsen blieb ungerührt. Als der Geist sah, daß es [das Judenvolk] nicht erschauderte, da floh er es ob seiner Tollheit.</p><p>Die Verfluchten [die Juden] schnaubten mit ihrer Nase vor ihrem ehrfurchtgebietenden Gotte. Der Prophet schämt sich, ihre Unverschämtheit so zu erzählen, wie sie tatsächlich war Schamhaft berichtet Ezechiel ihre Unverschämtheiten. Weil sie von einem Schamhaften erzählt werden, darum werden sie auch nur geschämig berichtet. Während in ihrem Munde das Heilige geschändet wurde, wurden im Munde der Reinen sogar ihre Schmutzereien rein. Sie schlachteten die Propheten wie fehlerlose Lämmer ab. Ärzte kamen zu ihnen, sie aber wurden denselben zu Schlächtern.</p><p>.</p><p>Fliehe und rette dich vor dem rasenden Volke, nimm eilends deine Zuflucht zu Christus! Damit du nicht als Grübler zu ihm kommst, nahe dich ihm als Anbeter! Wenn der Ungläubige ein Kreuziger und der Anbeter ein Grübler ist, so ist das für die Einsichtigen ein großes Leid, da der eine lästert, während der andere grübelt. [Gottes Sohn] kam zum Samen Abrahams, aber die Erben wurden zu Mördern. Er kam zu den törichten Heiden, da wurden Einfältige zu Grüblern. Sei einfältig deinem Herrn gegenüber und klug deinem Widersacher gegenüber! Forsche, untersuche und lerne seine Schlingen kennen, wo und wie er sie verbirgt! Sei verständig, beobachte und betrachte sein verstecktes und feines Netz! Neige dein Ohr, beobachte und schaue, wo er seine Fallstricke legt! Verschaffe dir einen Führer und lerne, wo der Feind dir Nachstellungen bereitet! Allein, anstatt deinem ränkevollen Gegner nachzuspüren, bist du dahin gekommen, über deinen Gott nachzustudieren.</p><p>Wisse, daß Gott Gott ist und daher von dir nicht erfaßt werden kann! Wisse aber auch, daß der Böse ein Betrüger ist und daß deine Aufmerksamkeit auf ihn gerichtet sein soll! Nahe daher jedem von beiden mit kluger Unterscheidung je nach seiner Art! Dem Satan tritt im Kampf entgegen, Gott aber nahe in Einfalt! Bekriege jenen im Streite, diesem aber glaube, dass er ist! Erkühne dich nicht, in seine große geheimnisvolle Flut zu tauchen, damit nicht der Abgrund vor dir zu tief werde und deinen Geist Schauder ergreife!</p><h2>2</h2><p>Gerne möchte ich mich nahen, aber ich fürchte, mich zu entfernen; denn der Verwegene, der sich forschend nähert, entfernt sich sehr weit. Wer sich aber mit Maß nähert, den stößt die Billigkeit nicht zurück. Nähern wir uns also nicht zu sehr, damit wir uns nicht entfernen! Entfernen wir uns nicht, damit wir nicht zugrunde gehen! Nahen wir uns also mit Maß und Zurückhaltung dem unermeßlichen Wesen! Weil langes Gerede darüber nichts nützt, so möge nur Weniges gesagt werden! Wie sollte der armselige Staub imstande sein, von seinem Bildner zu sprechen! Gnade hat den Staub geformt, damit er ein Ebenbild seines Schöpfers sei; die Gerechtigkeit aber soll ihn abschrecken, gegen seinen Schöpfer sich frech zu erheben. Wohl gab der Schöpfer dem Gefäße Verstand, jedoch um sich selbst kennen zu lernen. Nun aber grübelt das Gebilde über den Bildner und tut durch Forschen der Gnade Unrecht. Geben wir daher demjenigen, der mit Maß lernt, gleichsam nach der Wage Gehör! Wir wollen eine Wage aufstellen und nach Gewicht nehmen und geben! Von den Meistern wollen wir darnach nehmen, darnach aber auch den Schülern geben!</p><p>Du hast gehört, daß Gott Gott ist. So lerne dich selbst als Menschen kennen! Du hast gehört, daß Gott der Schöpfer ist; wie soll dann das Geschöpf ihn erforschen können? Du hast gehört, daß Gott Vater ist; an seiner Vaterschaft erkenne seinen Sohn! Ist nämlich der Vater der Erzeuger, so ist der von ihm Erzeugte natürlich sein Sohn. Den einen Sohn, der da der Eingeborene ist, sollen deine Fragen nicht zerteilen! Du hast von der Herrlichkeit des Sohnes gehört; lästere ihn nicht durch deine Untersuchung! Du hast vom Geiste gehört, daß er der Hl. Geist sei; benenne ihn also mit dem Namen, mit dem man ihn bezeichnet! Du hast seinen Namen gehört, bekenne also diesen seinen Namen! Aber sein Wesen zu erforschen, dazu bist du nicht berechtigt. Du hast vom Vater, vom Sohn und vom Hl. Geiste gehört; so schließe also von den Namen auf das wirkliche Dasein der Personen! Die Namen sind nicht vereint, aber die drei sind wahrhaft eins. Bekennst du ihre Namen, nicht aber ihr persönliches Dasein, so bist du wohl dem Namen nach ein Anbeter, in der Wirklichkeit jedoch ein Leugner. Wo kein persönliches Dasein vorhanden ist, da haben wir nur einen leeren Namen. Was nicht wirklich ist, dessen Benennung ist eitel. Der Ausdruck Person belehrt uns, daß sie wahrhaft etwas ist. Daß sie etwas ist, wissen wir; wie sie aber ist, das begreifen wir nicht. Dadurch, daß du weißt, sie existiert, hast du noch nicht erfaßt, wie sie ist. Deshalb, weil du sie nicht begreifst, darfst du ihr Dasein nicht leugnen. Beides ist Lästerung, Skepsis und Grübelei.</p><p>Das Meer ist groß. Wenn du es ergründen willst, so wirst du von der Wucht seiner Wogen abgetrieben. Eine einzige Woge kann dich davontragen und an eine Klippe schleudern. Es genügt für dich, o Schwächling, daß du in einem Schiffe Handel treiben kannst. Der Glaube ist aber für dich besser als ein Schiff auf dem Meere. Das Schiff leiten zwar die Ruder, allein die Fluten können es versenken; dein Glaube aber versinkt nicht, wenn nicht dein Wille es will. Wie wünschenswert wäre es für den Seemann, wenn das Meer sich nach seinem Willen richten würde! Doch anders denkt der Seemann und anders macht es die Woge. Nur unser Herr schalt das Meer, so daß es schwieg und sich beruhigte. Er hat aber auch dir die Gewalt verliehen, gleich ihm ein Meer zu schelten und zum Schweigen zu bringen. Das Forschen ist ärger als das Meer und die Streitsucht stürmischer als die Wogen. Tobt in deinem Geiste die Grübelei, so schilt sie und glätte ihre Wogen! Wie der Sturm das Meer aufwühlt, so regt das Grübeln deinen Geist auf. Unser Herr schalt, da hörte der Wind auf, und das Schiff glitt ruhig dahin. Schilt das Grübeln und bezähme es, dann wird dein Glaube beruhigt sein.</p><p>Davon sollten dich schon die Geschöpfe überzeugen, deren Gebrauch du kennst. So bist du z. B. nicht imstande, die Quelle zu erklären, und doch unterlässest du es nicht, von ihr zu trinken. Dadurch aber, daß du von ihr getrunken hast, glaubst du noch nicht, sie begriffen zu haben. Auch für die Sonne bist du unzureichend, und doch entziehst du dich ihrem Lichte nicht. Deshalb aber, weil sie zu dir herabsteigt [durch ihre Lichtstrahlen], wagst du es doch nicht, zu ihrer Höhe emporzusteigen. Die Luft ist zu groß für dich, und doch erhält der Hauch von ihr dein Leben. Ihr Unterpfand [der Hauch] ist bei dir; aber wie groß ihr Maß ist, erkennst du nicht.</p><p>Du empfängst von den Geschöpfen nur eine geringe zweckdienliche Hilfeleistung und dennoch lässest du ruhig das Viele unbegriffen in ihren Schatzkammern liegen. Das Wenige verschmähst du nicht, aber nach dem Vielen trägst du kein Verlangen. Die Geschöpfe des Schöpfers belehren dich also über den Schöpfer, daß du dich um seine Hilfe bemühen, aber von der Grübelei über ihn dich fernhalten sollst. Empfange das Leben von der [göttlichen] Majestät, laß aber das Grübeln über die Majestät! Liebe die Güte des Vaters, forsche aber nicht über seine Wesenheit! Liebe und schätze die Milde des Sohnes, forsche aber nicht über seine Zeugung! Liebe das Schweben des Hl. Geistes, wage dich aber nicht an seine Ergründung! Den Vater, den Sohn und den Hl. Geist lernen wir aus ihren Namen kennen. Doch sinne nicht über ihre Persönlichkeit nach, sondern erwäge nur ihre Namen! Willst du das Wesen erforschen, dann bist du verloren; glaubst du aber an den Namen, so wirst du leben. Der Name des Vaters sei dir eine Schranke; überschreite sie nicht, um seine Natur zu ergründen! Der Name des Sohnes sei dir eine Mauer; gehe nicht darüber hinaus, seine Zeugung zu ergründen! Der Name des Hl. Geistes sei dir ein Zaun; laß dich nicht in eine Ergründung desselben ein! Diese Namen sollen dir also eine Schranke sein; durch die Namen halte die Untersuchungen zurück! Nachdem du die Namen und die Wirklichkeit gehört hast, wende dich den Geboten zu! Du hast vom Gesetz und von den Geboten gehört, wende dich nun den Sitten zu! Und wenn deine Sitten vollkommen sind, dann wende dich den Verheißungen zu! Laß nicht das Gebotene fahren, um dich mit Dingen abzumühen, die nicht vorgeschrieben sind! Du hast die Wahrheit durch offenbare Dinge erfahren, verirre dich nicht wegen verborgener Dinge! Offenbares sprach Simon aus, er gab die Wahrheit und empfing Seligsprechung Siehe, Simon sprach nur eines, verirre dich also nicht durch vieles!</p><p>Die Wahrheit ist in wenigen Worten niedergeschrieben, stelle also keine lange Untersuchung darüber an! Daß der Vater ist, weiß jedermann; wie er aber ist, das weiß niemand. Daß der Sohn ist, bekennen wir alle; allein sein Wesen und seine Güte begreifen wir nicht. Den Hl. Geist bekennt jeder; ihn zu ergründen, vermag niemand. Bekenne also, daß der Vater ist, bekenne aber nicht, daß er begreiflich ist! Glaube ferner, daß der Sohn ist; daß er aber erforschbar sei, glaube ja nicht! Daß der Hl. Geist ist, halte für wahr; daß er ergründet werden könne, halte aber nicht für wahr! Daß sie eins sind, glaube und halte für wahr; bezweifle aber auch nicht, daß es drei sind! Daß der Vater der erste ist, glaube; daß der Sohn der zweite ist, halte für wahr; zweifle auch nicht daran, daß der Hl. Geist der dritte ist! Nie gebeut der Erstgeborene dem Vater; denn dieser ist der Gebieter. Nie sendet der Hl. Geist den Sohn; denn dieser ist sein Sender. Der Sohn, der zur Rechten sitzt, maßt sich nicht die Stelle des Vaters an; ebensowenig maßt sich der Hl. Geist den Rang des Sohnes an, von dem er gesandt wird. Der Sohn freut sich über die Erhabenheit seines Erzeugers und der Hl. Geist über die Erhabenheit des Geliebten des Vaters. Nur Freude und Eintracht, Vereinigung samt Ordnung, herrschen dort. Der Vater kennt die Zeugung des Sohnes, und der Sohn kennt den Wink des Vaters. Der Vater winkt, der Sohn versteht es, der Hl. Geist führt es aus. Da gibt es keinen Zwiespalt, weil es da nur einen Willen gibt; da ist keine Verwirrung bei der Vereinigung, sondern die größte Ordnung. Meine ja nicht, daß Verwirrung herrsche, weil sie vereinigt sind, noch denke, daß eine Zerteilung vorliege, weil sie getrennt sind! Sie sind vereinigt, aber nicht verwirrt; getrennt, aber nicht zerteilt. Ihre Vereinigung ist keine Verwirrung und ihre Trennung ist keine Zerteilung. Die Art und Weise, wie sie getrennt und vereinigt sind, kennen nur sie allein Nimm deine Zuflucht zum Schweigen, Schwächling!</p><h2>3</h2><p>Die Lehre ist zwar älter als die Lehrer und die Lernenden, sie ist jedoch die Gespielin der Jugend, um bei allen alles zu sein: Lehrerin bei den Meistern und Lernende bei den Schülern. Sie lehrt und lernt also, da sie auf beiden Seiten tätig ist. Mit den Beredten erwirbt sie Ruhm, bei den Klugen zeigt sie ihre Weisheit. Sie weilt bei den Einfältigen und bei den Scharfsinnigen, in jedem Maße [je nach der Fähigkeit des Einzelnen] teilt sie sich allen Seelen mit. Jedem Dinge gibt sie sich als die Herrin aller Dinge hin. Sie paßt sich [verschiedenen] Maßen an, obschon sie über jene erhaben ist, die sie messen wollen. Die Lehrlinge können sie nicht ausmessen, da ihre Kräfte dazu nicht ausreichen; es gibt keine Meister, welche ihr Maß finden könnten, da sie ihre Quellen nicht zu erschöpfen vermögen.</p><p>Während aber die Lehre größer ist als die Lehrer und die Lernenden, so ist sie doch viel kleiner als ihr Schöpfer, weil sie unfähig ist, ihn zu erforschen. Kein Lernender vermag zu begreifen, wie groß die Macht des Schöpfers ist. Er kann nicht ermessen, was er erschuf, noch was er zu erschaffen imstande ist; denn diese Geschöpfe, die er schuf, und diese Werke, die er wirkte, machen nicht die ganze Macht des Schöpfers aus. Nicht deshalb, weil er es nicht könnte, will er nicht mehr erschaffen. Sein Wille ist unbeschränkt; wenn er wollte, könnte er tagtäglich erschaffen; allein dann entstünde ein Wirrwarr. Wenn die Geschöpfe immer mehr würden, dann würden sie wegen ihrer Unzahl einander gar nicht mehr kennen lernen können. Obwohl er ihnen allen gewachsen bliebe, so würden sie doch sich nicht gewachsen sein. Zu welchem Nutzen würde er sie dann erschaffen haben, wenn sie doch einander fremd bleiben müßten? Was auch immer der Schöpfer erschuf, es geschah nicht, um sich selbst größer zu machen; denn er war nicht kleiner, bevor er schuf, noch wurde er größer, nachdem er geschaffen hatte. Seine Werke wollte er groß machen; darum schuf er mit Maß. Wohl hätte er diese Schöpfung unendlich groß machen können; allein dann wären ihre Bewohner in Verwirrung geraten, und mit der Verwirrung wäre Schaden verbunden gewesen; denn man hätte weder auf die Gerechten gemerkt, noch auf die Propheten geachtet. Wäre die Schöpfung hundertmal größer, als sie wirklich ist, so wären die Prediger außerstande, der ganzen Schöpfung zu genügen. Gott stellte Jerusalem in die Mitte [der Welt], damit die ganze Schöpfung auf dasselbe merke. Als er daher die Israeliten aus Ägypten herausführte und als er sie später aus Babel heimführte, bemerkte ihren Wegzug und ihre Heimkehr die ganze Schöpfung. Wäre aber die Welt größer, als sie es in der Tat ist, so hätte sie es nicht in dieser Weise bemerken können. Nur der könnte sie dann erfassen, der nach allen Seiten hin größer ist als sie. Die Schöpfung hätte davon nicht den gleichen Nutzen wie jetzt. Denn wenn sie schon jetzt, wo sie doch [verhältnismäßig] klein ist, von irrigen Reden erschüttert wird, um wieviel mehr würde sie erschüttert werden, wenn sie noch größer wäre? Auch könnte die Sonne nicht von einem Ende zum andern eilen, da der Zwischenraum zu groß wäre, der Tag würde zum Jahre werden. Es würde ein großer Nachteil sein, wenn die Ordnung zerstört würde. Winter und Sommer würden zu lange dauern, Tag und Nacht endlos sein. Wann würde die Saat keimen und wann die Frucht reifen? Er könnte es allerdings so einrichten, aber für uns wäre es zu drückend. Also nicht gemäß seiner Macht schafft der Schöpfer alles und jedes, sondern nach der Maßgabe unseres Vorteils schafft und wirkt er alles.</p><p>Aus diesem unendlichen Schoße ging der unerforschliche Sohn hervor. Willst du ihn dennoch erforschen, so will ich dir Berater sein. Gehe hin und erforsche zuerst seinen Vater, erprobe deine Kraft an seinem Erzeuger, mit seiner Ergründung beginne und ende! Miß ihn nach Länge und Breite! Wenn du den Ewigen gemessen haben wirst, dann hast du auch den Sohn aus seinem Schoße gemessen. Bist du imstande, den Vater zu messen, so bist du es auch beim Eingeborenen. Aber du vermagst dies weder beim Ewigen noch bei seinem Sohne. Steige also, Schwächling, wieder aus dem Meere [der Forschung] empor! Komm, wir wollen uns dem verlassenen Gegenstande wieder zuwenden! Lassen wir doch nicht das Bekannte fahren, um uns mit dem abzumühen, was wir doch nicht erkennen [können]!</p><p>Der Schöpfer erschafft also nicht, soviel er kann. Er schafft nicht soviel, als er kann, sondern soviel, als es sich geziemt. Würde er nämlich in einem fort erschaffen und sein Wirken nicht beschränken, so wäre dies ein maßloses Gebaren, das der Klugheit entbehren würde. Er würde einem Brunnen gleichen, der immerfort ohne Beschränkung fließt. Der Schöpfer wäre eine Quelle, die durch ihre Natur gebunden ist und daher ihren Lauf nicht hemmen kann; denn er hätte keine Gewalt über seinen Willen. Wie er uns nur dadurch, daß er [seiner Schöpfermacht] freien Lauf läßt, seinen Willen offenbart, so kann er uns nur dadurch seine Macht zeigen, daß er sie zurückhält. Er beginnt [zu erschaffen], um Geschöpfe aufzustellen; er hört auf, um Ordnung herzustellen. Wenn er täglich Himmel und Erde und Geschöpfe erschaffen würde, so wäre sein Wirken eine Verwirrung ohne Ordnung, und er wäre im Wirken nicht groß, weil er an Weisheit klein wäre. Es muß ja auch der redende Mund nach einer gewissen Ordnung reden. Muß er denn nicht, obwohl er reden kann, auch wieder zu reden aufhören? Das Reden fällt aber dem Munde nicht so leicht wie das Schaffen dem Schöpfer. Die Schöpfungen sind für den Schöpfer viel leichter als die Worte für die Redenden; aber deshalb, weil er schaffen könnte, erschafft er doch nicht immerfort Neues. Er gibt den Menschen beim Reden Ordnung; um so mehr wird er Maß halten, obwohl er stündlich erschaffen könnte. Er hörte also zu schaffen auf, um zu ordnen, was er geschaffen.</p><p>Wer wäre wohl imstande, anzugeben, wieviel er hätte schaffen können? Viel ist, was er schuf; viel auch, was er zu schaffen unterließ. Was er erschaffen hat, ist unermeßlich, und was er ungeschaffen ließ, ist unerforschlich. Alles, was er durch seinen Wink hervorbringt, ist aus nichts. Es ist den Forschern gänzlich verborgen, mag es sichtbar oder unsichtbar sein. Du erkennst nicht, wieviel er gemacht hat, noch wieviel er machen kann. Nur der Eingeborene, der in seinem Schoße verborgen ist, kennt das Wie und das Wieviel. Denn der Sohn, der verborgen und offenbar ist, kennt das Verborgene und das Offenbare. Wie könnte aber ein Lehrling zu den Quellen gelangen, die für ihn unzugänglich sind? Den Schwachen und Ohnmächtigen [im Begreifen] könnte [vielleicht] die [Rechnungs-] Lehre hierzu behilflich sein, sie lehrt ja beim Multiplizieren schnelle Sprünge machen. Sie vermehrt 10 mit 10 und springt so auf die Zahl 100; sie vermehrt 100 mit 10 und gelangt zur Zahl 1000; sie springt von einem Tausend zum andern und von einer Myriade zur andern. Daraus kannst du schließen, daß sie auch im übrigen ebenso flink ist.</p><p>Die Wissenschaft ist die verborgene Brücke der Seele, auf der sie zu den verborgenen Dingen hinübergeht. Sie ist der Schlüssel der Armut, womit diese sich Schatzkammern aufschließt. Sie ist die Ehre des Alters, welches durch sie der Jugend Einsicht mitteilt. Sie ist die Schutzmauer der Jungfräulichkeit, von der sie die Räuber abhält. Sie unterwarf das Meer den Seefahrern und das Land den Bauern; sie legte den Schiffen Zügel an und machte sie über das Meer eilen. Wagen auf dem Meere entstanden ihr, und Schiffe bereitete sie sich auf dem Lande. Sie nimmt sich der Schwachheit an und macht sie kräftig; sie naht sich der Ausgelassenheit und macht sie besonnen. Sie naht sich der Unwissenheit und lehrt sie eine Menge von Kenntnissen; sie naht sich der Stummheit und bringt sie zur Beredtheit. Streng tritt sie mit dem Richter auf, demütig mit dem Schuldigen. Jenen lehrt sie, wie er zu strafen; diesen, wie er zu flehen hat. Sie forscht mit den Forschenden und untersucht mit den Unterrichteten; sie sucht auf der einen Seite und findet auf der andern Seite. Beides ist in ihr verbunden, weil sie zu beidem Dienste leistet. Ohne mit Gewalt zu zwingen, herrscht sie doch über alles. Sie lehrt den Künstler, aus etwas etwas zu machen, damit er Gott kennen lerne, der alles aus nichts macht. So belehrt sie den Geschaffenen, daß sein Schöpfer größer ist als er; denn der Geschaffene schafft aus etwas, der Schöpfer aus nichts.</p><p>Meine Brüder! Erwecken wir doch unsere Schläfrigkeit, damit die Wächter [Engel] sich über unser Erwachen freuen! Wappnen wir uns mit dem Glauben und töten wir das Böse, das uns den Tod gebracht hat! Der Gestank unserer Verwesung schlägt uns ins Gesicht, weil unser Geruch nicht in Christus gut ist. Der wache Krieg unserer Streitigkeiten schläfert die Wächter durch seine Kämpfe ein. Weil die Priester sich auf die Disputation werfen, stürzen sich die Könige in den Kampf. Der äußere Krieg läßt nicht nach, solange der innere Krieg wütet. Der Hirte ) kämpft mit seinem Genossen, der Priester mit seinem Amtsbruder. Bei dem Streite der Hirten gehen Herde und Weide zugrunde. Während die Hirten uns ganz besonders fein weiden wollten, haben sie unsere gute Weide zertreten, die uns in schlichter Weise erhalten hatte. Während wir nach unserer Bereicherung strebten, raubte man uns all unser Gut. Man hat die Lampe der Wahrheit verborgen, um diese in der Finsternis zu suchen. Die Wahrheit erschallt laut in der Welt, aber man sucht sie in Schluchten. Die Kinder des Lichts stören die im Finstern lagernde Grübelei auf und suchen die offen zutage liegende Wahrheit, als wäre sie verloren gegangen. Sie suchen einen hohen Berg in engen Schluchten; er überragt die ganze Schöpfung, und sie suchen ihn wie schwachen Schimmer. Sie mühen sich ab, die Wahrheit zu erforschen, die doch ausgedehnter als alles ist. Sie wollen sie nicht sehen; statt dieser suchen sie etwas anderes. Sie mühen sich ab, die Wahrheit zu vernichten, welche doch sie gefunden hat, Der Forscher kann allerdings zugrunde gehen, nicht aber die Wahrheit Der Blinde sieht vom Lichte nichts, obwohl es sich bei ihm befindet. Der Taube vernimmt von der Stimme nichts, wenn sie auch neben ihm ertönt. Der Tor ist ferne von der Wissenschaft, wenn auch vor ihm die Bücher aufgeschlagen sind. Mögen gleich alle Kenntnisse naheliegen, die Toren sind doch davon entfernt. Götzenpriester erkannten die Wahrheit, aber christliche Priester suchen sie immer noch. Sogar Magier erkannten, daß ihre Kräfte durch die Kraft der Wahrheit gebrochen wurden. Selbst Sterndeuter erkannten, daß ihre Bücher durch das Buch der Wahrheit abgetan sind. Ebenso erkannten Wahrsager, daß die Wahrheit ihre Schwindeleien zunichte gemacht hat. Teufel erkannten, daß durch die Gesänge der Wahrheit unreine Geister ausgetrieben wurden. Heiden erkannten, daß durch den wahren Gott die Götzen vernichtet wurden.</p><p>Die Wahrheit ruft laut in der ganzen Welt, die Grübler aber suchen sie, wo sie sich etwa befinde. Sogar Feinde des Sohnes erkannten sie, aber Verkünder von ihr suchen sie noch. Das jüdische Volk verleugnete ihn [den Sohn = Christus] zwar, wußte aber doch, wer es ausrottete. Wenn sie es auch nicht eingestanden, so erkannten sie doch, woher dies über sie kam. Die Kirche, Christi Braut, belehrt sie, daß ihretwegen Jerusalem verlassen wurde. Das Priestertum, das er gab, zeigt ihnen, daß ihr Priestertum durch ihn aufgelöst ist. Die Propheten, die er uns gab, verkünden laut, daß durch ihn alles in Erfüllung gegangen sei.</p><p>Der Satan legte in seinem Neide den Grüblern Streitfragen vor, damit durch die von ihm eingeführten Kontroversen verkehrte Lehren ausgesprochen würden. Nach außen erschienen sie als tugendhaft, während ihr Inneres ganz verdorben ist. Die Einfältigen finden den Sohn, die Gelehrten suchen ihn. Ferne kamen und wurden Jünger; Fremde kamen und wurden Hausgenossen; Auswärtige staunten, daß die Einheimischen noch suchen. Was jetzt am Ende [nach der Einführung des Christentums] vorgeht, gleicht dem, was am Anfang geschah. Die Magier gewahrten in der Ferne den König der in Bethlehem geboren war. Die harmlosen Magier dachten, die Schriftgelehrten und die Hebräer würden den dort geborenen Königssohn auf ihren Händen im Triumphe umhertragen; die Fernen kamen und fanden, daß die Nahen ihn nicht kannten. Der König befand sich unter ihnen, und sie plagten sich mit Nachfragen. Der König war schon tatsächlich geboren, sie aber grübelten noch darüber nach, ob er geboren sei. Die Fremden wunderten sich, daß sie noch in der Schrift über seine Geburt nachforschten. Das Unterpfand [seiner Geburt] war bei den Auswärtigen, die Nachforschung aber bei den Einheimischen. Sein Bote [der Stern] war vor den Fremden, die Unsicherheit über ihn bei den Hausgenossen. Die Magier ließen sich jedoch nicht irre machen durch die, welche ihn suchten; sondern verließen sie und gingen mit ihren Geschenken geraden Weges zu dem Erstgeborenen. Die offenbare Wahrheit war bei den Magiern, das Fragen bei den Pharisäern.</p><p>Auch ihr, Lehrlinge, laßt euch nicht dadurch verwirren, daß eure Lehrer die Wahrheit erst suchen! Wie die Magier jenen, über den sie nachfragten, in Bethlehem fanden, so wird er auch von dem, der ihn redlich sucht, in der hl. Kirche gefunden. Ahme den Magiern nach und bringe reinen Lebenswandel als Geschenk dar! Bete den Sohn mit gesundem Glauben an, so wie du ihn gefunden hast und wie er sich dir geoffenbart hat! Gleichwie nämlich die Magier beim Aufleuchten des von ihm gesandten Sternes sich zu ihm aufmachten, so findet ihn der Suchende auch in der Offenbarung, welche Simon ausgesprochen hat. Es möge dich doch die gegenwärtige Zeit, die der früheren gleicht, nicht ängstigen! Die Ankunft des Sohnes, als er zum erstenmale erschien, ist jener ähnlich, wo er wieder erscheinen wird. Denn wie bei der damaligen Ankunft die Fragen der Gelehrten verwirrt waren, ebenso sind sie es jetzt vor seiner Wiederkunft. Auf einem Füllen reitend zog er ein; vor ihm her riefen Heiden. Die einheimischen Beschnittenen hörten den Ruf und begannen, von den Völkern zu lernen; denn sie fingen an zu fragen, wer denn derjenige sei, der da komme. Da es den Hausgenossen entgangen war, lernten sie es von den Auswärtigen. Sie erkundigten sich bei diesen, um von den Außenstehenden ihre eigenen Angelegenheiten zu erfahren. Die heidnischen Völker, die zu den Festen der Blinden gekommen waren, unterrichteten die Hebräer und erzählten ihnen von ihren eigenen Dingen. Die Unbeschnittenen riefen den Beschnittenen zu: Dieser ist Jesus von Nazareth! Die Hebräer fingen an, von den Heiden die Erklärung dieses Namens, der in den Schriften der Blinden aufgezeichnet war, zu lernen. Sie lernten von Fremden das Studium ihrer eigenen Bücher, und Weitentfernte belehrten sie über die Auslegung ihrer eigenen Schriften. Laß dich also nicht verwirren, Zuhörer, wenn ein Gelehrter verkehrte Lehren vorträgt! Erliege nicht, Lehrling, wenn ein Forscher sich verirrt! Wenn dein Lehrer abirrt, so gehe hin und lerne aus den hl. Schriften, daß Kluge nicht strauchelten, wo Forscher abirrten, und daß Hörer nicht sich beirren ließen, wo Lehrer fehlgingen! Nicht Menschenwort trägt die Predigt des Evangeliums - das Menschenwort ist vergänglich, und alles fällt, was daran hängt -, sondern vom Worte Gottes hängt die Predigt der Wahrheit ab. Von diesem Worte, das alles trägt, hängt deine Belehrung, o Lehrling, ab. Wer den Weg verwirrt, gerät selbst dadurch in Verwirrung. Denn er weiß nicht, wie er gehen soll; der Weg ist vor ihm verloren gegangen. Für Kluge aber ist der Weg mit Meilensteinen und Herbergen besät.</p><p>Wenn das ganze Volk sich bekehrt und in Sack und Asche gefleht hätte, dann hätte der Allerhöchste die Verkehrtheit der Oberhäupter nicht hingehen lassen. Allein der Priester war wie das Volk, und das Volk machte es den Priestern nach. Beide Parteien verdienen es, voneinander gequält zu werden. Der nachlässige Lehrer hat unruhige Schüler; sie werden von ihm verdorben, und er wird dafür von ihnen belästigt. Ein ausgezeichnetes Oberhaupt hat dagegen Untergebene, die ihm erquickende Ruhe gewähren. Sie werden von ihm behütet, und er wird hinwiederum von ihnen erfreut. Unsere Vorsteher haben uns vernachlässigt und wir sie. Unsere Leiden kümmern sie nicht, und wir sind gegen die ihrigen gleichgültig. An demselben Körper sind Spaltungen, weil Haupt und Glieder uneins sind. Die Tiere auf den Bergen sind einig, in der Kirche aber sind die Seelen uneinig. Wer fühlt wohl über dieses gemeinsame Leiden Schmerz? Nachdem wir den Weg vollendet haben, kehren wir um, seinen Anfang zu suchen. Wir sind am Ende des Weges angelangt und haben noch nicht begriffen, welches sein Anfang ist. Unsere Reise ist am Ende, und wir suchen noch ihren Anfang. Nachdem wir unter Meistern alt geworden, kommen wir dahin, wieder Schüler zu werden. Nachdem wir das Buch zu Ende gelesen haben, fangen wir an, lesen zu lernen.</p><p>Knaben, die gestern noch in die Schule gingen, blühen plötzlich auf wie die Staude des Jonas. Siehe, schon bilden sie eine neue Glaubensnorm an Stelle jener, welche die Heiligen gebildet haben; sie ist aber voll des Stoffes zu Streitigkeiten, eine Quelle von Zwisten und Kriegen, selbst Bescheidene berauschend und in Raserei versetzend, so daß sie mit jedem Worte Unsinn reden. Sie macht den Mund zum Strome und das Gehör zur Furt. Stille und Schweigsame sehen sie und werden zänkisch und streitsüchtig. Freunde und Kameraden sehen sie und zücken die Zungen gegeneinander. Die sich sonst zärtlich liebten, sehen sie und hassen sich. Einträchtige und Gleichgesinnte sehen sie und verursachen Schismen und Spaltungen. Seit langer Zeit Vertraute sehen sie und zerreißen das Band langjähriger Liebe. Ehrwürdigkeit sieht sie und wird dadurch zur Ausgelassenheit. Verständigkeit sieht sie, und das Salz der Wahrheit wird schal. Die Demut sieht sie und bekommt Hörner zum Stoßen. Der Knabe, der am Anfang des Lebens steht, sieht sie und schmäht den sechzigjährigen Greis; der siebzigjährige Greis sieht sie und lästert siebenmal siebzigmal ärger. Hirten sehen sie und werden dadurch zu Tyrannen. Schweigsame Lämmer sehen sie und werden durch Grübeln zu Panthern. Tauben sehen sie und werden zu giftigen Nattern.</p><p>Der Eingeborene hat zwei Seiten, eine verborgene und eine sichtbare. Die sichtbare läßt sich nichtverbergen und die unsichtbare läßt sich nicht erforschen. Der allerschlaueste Satan zieht uns von der sichtbaren Seite ab und umstrickt uns mit der verborgenen, damit wir ja nicht das Leben durch die sichtbare erlangen. Schauet den Vater, seinen Erzeuger, an! Auch er hat zwei Seiten. Daß er ist, begreift jedermann; aber sein verborgenes Wesen ist unerforschlich. Seine sichtbare Seite ist so offenbar, daß auch Toren erkennen, daß er ist; aber seine verborgene Seite ist so verborgen, dass selbst die Engel nicht begreifen, wie sie ist. Ja, nicht bloß diese Majestät [Gottes] ist unbegreiflich, sondern auch alle Geschöpfe haben zwei Seiten, eine sichtbare und eine verborgene. Man kann zwar die einzelnen Wesen erkennen, aber ganz erfaßt man sie nicht. Wenn also selbst die Geschöpfe dieses Zweifache an sich haben, daß sie verborgen und doch wieder sichtbar, erkennbar und doch wieder nicht erkennbar sind, um wieviel mehr muß dies dann beim Schöpfer und beim Sohne des Erschaffers der Fall sein, daß sich beides vorfindet: eine sichtbare und eine verborgene Seite? Es gibt daher ein Wissen von seiner Sichtbarkeit und ein Nichtwissen von seiner Verborgenheit. So sicher man weiß, daß er ist, so wenig weiß man, wie er ist. Zur Erkenntnis seiner Sichtbarkeit gibt es einen Weg; Verwirrung aber ist es, seine Verborgenheit ergründen zu wollen.</p><p>Frägst du, ob der Sohn existiert, so erfährst du dies im Augenblicke; frägst du aber, wie er ist, so bleibt die Frage offen, bis er kommt. Auch wenn du ihn sehen würdest, könntest du doch nicht wissen, wie er ist. Wenn du dann darüber forschen würdest, so würdest du gar nicht mehr sehen, was du früher gesehen hast. Und wenn du die geschaute Herrlichkeit untersuchen würdest, so würdest du nicht mehr wissen, daß du sie geschaut hast. Und wenn du dieses im Himmelreiche untersuchen wolltest, so bestünde dort deine Qual darin, daß du dich mit dem Forschen über Christus quälst, während die andern alle sich an Christus erfreuen. Eher wäre Hoffnung, aus der Hölle herauszukommen, als daß dort deine Pein aufhören würde, wenn du das Forschen nicht aufgeben würdest. Übrigens, wenn du in dieser Weise grübelst, so nimmt dich das Reich dort gar nicht auf, damit du nicht durch deinen Eintritt Zwietracht in den Ort der Eintracht hineinbringst. Das Himmelreich verschafft der hl. Kirche Sühne; denn die Aufwiegler, welche sie hier beunruhigen, kommen nicht in jenes Reich hinein. Die da Streitigkeiten verursachen, finden nicht Eingang in den Garten des Friedens. Die wahre Kirche diesseits ist ein Abbild des Reiches jenseits. Gleichwie nämlich im Himmelreiche Eintracht herrscht, so muß auch in der hl. Kirche Einigkeit sein. Wenn es dort keine Grübler gibt, warum sollen dann hier Forscher sein? Wenn dort Ruhe und Friede walten, warum soll dann hier Streit sein? Den Einen Sohn sieht man dort und durch ihn seinen Einen Erzeuger. Niemand forscht und grübelt dort, jeder betet an und lobpreist. Wenn dieses den Engeln genügt, warum sollte es nicht auch den Gefallenen genügen? Wenn Geist und Feuer schweigen, soll sich dann Staub und Asche lächerlich machen? Der Himmel und seine Bewohner benehmen sich ehrfurchtsvoll, die Erde und ihre Bewohner dagegen wahnwitzig.</p><p>Gebenedeit sei derjenige, der wegen dieser Verkommenheit Drangsale herbeiführte. Er hat offenkundige Räuber herbeigeführt, weil uns Nachbarn im tiefsten Frieden beraubt haben. Er hat den Weg der Irrgläubigen begünstigt, weil die Gelehrten ihn verkehrt haben. Die Irrgläubigen verwüsteten das Heiligtum, weil wir die Lüge mit der Wahrheit verbanden. Weil die Priester einander stießen, darum erhoben die Irrgläubigen das Horn. Welche Rolle wäre für uns groß genug, um darauf die Streitigkeiten zu schreiben? Weil die Brüder sich gegenseitig verfolgten, darum verfolgt nun einer viele Weil wir uns von unserem Helfer abgewendet haben, machte er uns zum Gegenstande des Schimpfes für unsere Nachbarn. Da seine Worte uns gleichsam zum Gespötte geworden sind, so sind auch wir zum Gespötte und zum Gerede geworden. Betrachten wir die Künste und nehmen wir von ihnen ein Beispiel! Wer ausgezeichnet arbeitet, dessen Kunst wird gerühmt; wer aber seine Kunst stümperhaft und schmählich betreibt, der wird auch von allen geschmäht. Der Schöpfer hat also den Künsten die Gerechtigkeit beigesellt, damit auf die Künstler die Unbilden zurückfallen, die sie den Künsten antun. Um so mehr wird bei dem, der der Gerechte ist, das Gebührende besorgt werden. Weil wir unseren Weg verachtet und großer Beschimpfung preisgegeben haben, so hat uns der Herr unsern Nachbarn zum Schimpfe gemacht, so daß wir von ihnen Verhöhnung davontragen. Seht, die Irrgläubigen fragen uns: „Wo ist denn da die Kraft der Wahrheit?“ Also an uns wird jetzt die Kraft geschmäht, die alle Kräfte überwindet! Weil unser freier Wille seine Kraft verbarg und die Wahrheit nicht siegreich verteidigte, so verbarg auch die Wahrheit ihre Kraft, damit die Irrgläubigen uns verhöhnen.</p><p>Grausame Rächer haben sich erhoben, freche Räuber sind eingedrungen. Weil wir durch Grübelei entzweit sind, haben sie sich zum Kriege vereinigt. Weil wir durch Forschen entzweit sind, verbinden sie sich zur Plünderung. Weil wir dem Sohne nicht gehorchen, gehorchen sie ihrem Oberhaupte, Weil wir das Gebot verachten, ist dort das Gebot stramm. Weil hier die Anordnungen [mit Füßen] getreten werden, werden sie dort genau beobachtet. Dort erwachen die Gesetze, die bei uns gestorben sind, zu neuem Leben. Weil wir unter uns uneins sind, folgen dort alle Einem. Niemand forscht über den König nach und fragt, wie und wo er sei; wir aber grübeln zum Zeitvertreib über den Sohn des Herrn des Alls nach. Schon durch den Wink jenes Sterblichen werden seine Heerscharen erschreckt; in der Kirche werden die hl. Schriften mit Füßen getreten, und man erzählt sich dafür seine eigenen Phantasien. Was wir hier ausgeliehen haben, das wird uns von dort heimgezahlt Die Habgier ist anderswo erloschen, hier dagegen ist ihre Glut entbrannt. Die Diebereien, die dort nachgelassen haben, stehen hier in [voller] Kraft. Während man dort der Blutsaugerei zu Leibe geht, findet sie bei uns freudiges Entgegenkommen. Während dort die Betrügerei abflaute, haben wir hier ihre Stärke verdoppelt. Und wenn wir auf die Wahrheit zu sprechen kommen, wer steht bei uns in der Wahrheit fest?</p><p>Siehe, auch sie [die Wahrheit] ist gegen uns: denn gerade durch die Irrgläubigen richtet Er uns. Dort wird die Sonne verehrt, aber niemand grübelt über sie, die doch nur ein Geschöpf ist; hier aber verachten wir den Schöpfer, indem jedermann den Anzubetenden untersucht. Statt des Feuers, das man dort anbetet, erforscht man hier dessen Herrn. Dort wird das Wasser verehrt, wir aber schätzen unsere Taufe gering. Jene verehren in ihrem Irrtum Geschöpfe statt des Schöpfers; wir aber, die wir doch die Wahrheit kennen, ziehen ihm den Mammon vor. Wir sind noch darauf sehr stolz und irren gegen besseres Wissen. Weil wir unserem Denken keine Schranke ziehen, stürzen die Feinde die Mauern unserer Stadt um, und weil wir unserem Sinnen keine Ruhe gönnen, verwüsten Auswärtige unsere Fluren. Weil unser Herz ganz an der Erde hängt, begraben sie uns unter Erdhaufen. Weil wir nicht nach der Liebe dürsten, werden wir durch Durst gestraft. Weil wir des Erwerbs wegen umherschweifen, irren unsere Gefangenen im Gebirge umher. Weil wir Spreu statt Weizen geworden sind, worfelt uns der Ostwind. Weil wir nach allen Seiten hin ausschwärmen, werden wir nach allen Seiten hin zerstreut. Weil wir nicht zu dem einen Zufluchtsorte eilen, werden wir von einem Orte zum andern gejagt. Weil wir mitten im Frieden tot waren, darum entschlafen wir auf den Straßen. Weil wir die Armen nicht speisen, sättigen sich die Vögel an unseren Leichnamen. Unsere Hirten, die sich so sehr brüsteten, werden nach dem Lande der Magier geschleppt. Unreine stecken unsere Kirchen in Brand, weil wir darin nicht richtig beten; den Altar zertrümmern sie, weil wir ihm nicht gewissenhaft dienen. Die hl. Schriften zerreißen sie, weil wir deren Vorschritten nicht beobachten.</p><p>Doch er, den wir verließen, verläßt uns nicht; er will uns nur züchtigen und dadurch wieder gewinnen. Es erhob sich eine einige Macht und drang auf unsere entzweite Einigung ein. Scharfe Gewalthaber standen auf, räuberische Richter drangen ein. Von der Ferne rückte ein Krieg an, weil mitten unter uns ein großer Krieg war. Bevor die Bogenschützen kamen, waren versteckte Bogenschützen bei uns. Bevor die gezückten Schwerter kamen, waren gezückte Zungen unter uns. Durch den Haß, den in unserer Mitte gespannten Bogen, schleudern wir gespitzte Pfeile. Niemand ist da, der nicht auf den andern schießt; wir schießen alle aufeinander. Der Gerechte führt Übel herbei, um dadurch unseren Übeln ein Ende zu machen. Er führt Bogen herbei, um dadurch den Bogen des Neides zur Ruhe zu bringen. Er schleudert auf uns sichtbare Pfeile, um den verborgenen Pfeilen ein Ende zu machen. Er führt geharnischte Feinde herbei, damit wir unsere Schlechtigkeiten ablegen und infolge des Panzers der Auswärtigen den Panzer der Wahrheit anlegen. Wenn er gezückte Schwerter über uns kommen läßt, so sollen die gezückten Zungen zur Ruhe kommen. Wenn er den Bogen des Assyrers herbeiführt, so soll die Begierde nicht mehr ihre Pfeile abschießen. Durch das Schwirren der Bogensehne draußen soll der Spott drinnen zur Ruhe kommen. Infolge der Furchtbarkeit und Wucht der Elefanten sollen wir uns nicht mehr über Niedrige stolz erheben. Bemühen wir uns doch, Buße und Selbstverleugnung unter uns zu säen, denn von allen Seiten sind innen und außen Kämpfe über uns hereingebrochen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Drei Reden über den Glauben</em>. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3961/versions/drei-reden-uber-den-glauben-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "aClO_Творения__Часть_3"
    path: "Ephraem_Rede_ueber_die_Verklarung"
    title: "Rede über die Verklärung Christi"
    menu: { parent: "Reden", title: "Rede über die Verklärung Christi", priority: 2 }
    update: true
    body: |-
      <p><em>Rede über die Verklärung Christi (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p><em>Diese Rede ist im II. griechisch-lateinischen Bande der römischen Ausgabe S. 41-49 in griechischer Sprache abgedruckt. Davon existiert noch eine arabische Übersetzung im Cod. arab. vat. 45 [Assemani, Bibliotheca Orientalis I, 156, no. 53] und eine armenische Übersetzung im vierten Bande der Mechitaristenausgabe der Werke Ephräms. In syrischer Sprache sind nur Bruchstücke derselben im maronitischen Offizium der Verklärung Christi erhalten, und zwar zum Teil unter dem Namen Ephräms. Darin will Zingerle a. a. O. I,231 f., wohl mit Unrecht, „den entschiedensten und unleugbaren Beweis für ihre Echtheit“ sehen. Doch scheint mir schon die christologische Terminologie, speziell des letzten Abschnittes [16], weit über die Zeit Ephräms hinauszuweisen; jedenfalls müßte man eine spätere Überarbeitung annehmen.</em></p><p><em>Wegen der eigenartigen und geistvollen Behandlung des Stoffes glaubte ich diese kleine Rede beibehalten zu sollen.</em></p><p><em>Inhalt: Im Eingange wird die Hl. Schrift mit einem Acker von unerschöpflicher Fruchtbarkeit verglichen [1]. Dann folgt die Darstellung der Gründe, warum Jesus die Jünger auf den Berg führte, und die Schilderung der Szene auf demselben [2-7]. Hernach werden die Worte des hl. Petrus: „Hier ist gut sein“ ausgelegt [8]. Weiterhin wird der Sinn der Stimme aus der Wolke: „Dieser ist mein geliebter Sohn“ in bemerkenswerter Weise erklärt. Die Beweise für die zwei Naturen in Christus werden in einer langen Reihe von Fragen vorgeführt [915]. Den Schluß bildet ein Bekenntnis des Glaubens an die Gottheit und die Menschheit Christi und an die hl. Dreifaltigkeit [16]. [Nach Zingerle a. a. O. I, 235.]</em></p><h2>2</h2><p>Vom Acker kommt Erntesegen, vom Weinberge schmackhafte Früchte und von der Hl. Schrift belebende Lehre. Der Acker gewährt nur für eine Zeit die Ernte, und der Weinberg gewährt nur für eine Zeit die Weinlese, aber die Hl. Schrift sprudelt, so oft sie gelesen wird, belebende Lehre. Ist der Acker abgeerntet, so hört er auf, zu tragen; ist der Weinberg abgeherbstet, so wird er unfähig; von der Hl. Schrift aber kann man täglich ernten, ohne daß die Ähren in ihr für die Ausleger abnehmen, und täglich kann man in ihr Weinlese halten, ohne daß die Trauben der in ihr hinterlegten Hoffnung ausgehen. Nähern wir uns also diesem Acker und genießen wir von dem Ertrag seiner lebenspendenden Furchen! Ernten wir von ihm Ähren des Lebens, nämlich die Worte unseres Herrn Jesus Christus, der zu seinen Jüngern sagte: „Es sind einige von den hier Stehenden, die den Tod nicht kosten werden, bis sie des Menschen Sohn in seiner Herrlichkeit haben kommen sehen“!</p><h2>3</h2><p>„Und nach sechs Tagen nahm er den Petrus, Jakobus und Johannes, dessen Bruder, auf einen sehr hohen Berg und ward vor ihnen verklärt. Sein Angesicht leuchtete wie die Sonne, seine Kleider aber wurden weiß wie das Licht“. Die Männer, von denen er gesagt hatte, daß sie den Tod nicht kosten würden, bevor sie das Vorbild seiner Ankunft geschaut hätten, sind diejenigen, die er mitnahm und auf den Berg führte. Er zeigte ihnen, wie er am Jüngsten Tage in der Herrlichkeit seiner Gottheit und im Körper seiner Menschheit kommen werde.</p><h2>4</h2><p>Er führte sie auf den Berg, um ihnen zu zeigen, wer der Sohn sei und wessen Sohn er sei. Denn als er sie fragte: „Für wen geben die Leute mich, den Menschensohn, aus?“ antworteten sie ihm: „Die einen für den Elias, die anderen für den Jeremias oder für einen der Propheten.“ Daher führte er sie auf den Berg und zeigte ihnen, daß er nicht der Elias sei, sondern der Gott des Elias; daß er auch nicht der Jeremias sei, sondern jener, der den Jeremias im Mutterleibe geheiligt hat; daß er auch keiner der Propheten sei, sondern der Herr der Propheten, der sie gesandt hat. Er zeigte ihnen auch, daß er der Schöpfer des Himmels und der Erde und der Herr der Lebenden und der Toten sei. Denn er gebot dem Himmel, und dieser ließ den Elias herabkommen; er winkte der Erde, und diese erweckte den Moses.</p><h2>5</h2><p>Er führte sie auf den Berg, um ihnen zu zeigen, daß er Gottes Sohn sei, der vor aller Zeit vom Vater erzeugt wurde, am Ende der bestimmten Zeit aus der Jungfrau Fleisch annahm und, wie er selbst wußte, ohne Zeugung und auf unaussprechliche Weise geboren wurde, indem er die Jungfrauschaft [seiner Mutter] unversehrt bewahrte. Denn wo Gott will, wird die Ordnung der Natur überwunden. Gott, das Wort, wohnte im Schoße der Jungfrau selbst, und doch verbrannte das Feuer seiner Gottheit die Glieder des Leibes der Jungfrau keineswegs, sondern er bewahrte sie die Zeit der neun Monate hindurch unverletzt. Er wohnte im Mutterschoße der Jungfrau und ekelte sich nicht an dem Gestank der Natur. Er trat aus ihr als fleischgewordener Gott hervor, um uns zu erlösen.</p><h2>6</h2><p>Er führte sie auf den Berg, um ihnen die Herrlichkeit der Gottheit zu zeigen und ihnen kund zu tun, daß er der Erlöser Israels sei, wie er es durch die Propheten geoffenbart hatte, damit sie nicht an ihm Anstoß nähmen, wenn sie seine freiwilligen Leiden sähen, die er als Mensch für uns erdulden würde. Sie kannten ihn nämlich nur als Menschen und wußten nicht, daß er Gott sei. Sie kannten ihn als den Sohn Mariens, als einen Menschen, der mit ihnen in der Welt umherwandelte, aber auf dem Berge tat er ihnen kund, daß er Gottes Sohn und Gott sei. Sie sahen ihn essen und trinken, müde werden und ausruhen, schläfrig werden und schlafen, sich fürchten und schwitzen. All dies entsprach nicht der Natur seiner Gottheit, sondern nur seiner Menschheit. Daher führte er sie auf den Berg, damit der Vater ihn den Sohn nenne und ihnen zeige, daß er in Wahrheit sein Sohn und Gott sei.</p><h2>7</h2><p>Er führte sie auf den Berg und zeigte ihnen sein Reich vor seinem Leiden und seine Macht vor seinem Tode und seine Herrlichkeit vor seiner Beschimpfung und seine Ehre vor seiner Entehrung, damit sie, wenn er von den Juden gefangen und gekreuzigt würde, erkennen möchten, daß er nicht aus Schwäche gekreuzigt worden sei, sondern aus freiem Willen, weil es ihm so gefiel, zum Heile der Welt. Er führte sie auf den Berg und zeigte ihnen vor der Auferstehung die Herrlichkeit seiner Gottheit, damit sie, wenn er in der Herrlichkeit seiner göttlichen Natur vom Tode erstanden wäre, erkennen möchten, daß er die Herrlichkeit nicht zur Belohnung seines Leidens erhalten habe, als ob er ihrer bedurft hätte, sondern daß sie schon vor aller Zeit mit dem Vater und bei dem Vater sein eigen gewesen sei, wie er ja selbst, als er in das freiwillige Leiden ging, sagte: „Vater, verherrliche mich mit der Herrlichkeit, die ich bei Dir hatte, ehe die Welt war!“ Diese unsichtbare und in der Menschheit verborgene Herrlichkeit seiner Gottheit zeigte er den Aposteln auf dem Berge; denn sie sahen sein Angesicht leuchten wie einen Blitz und seine Kleider weiß wie das Licht. Zwei Sonnen erblickten dort die Jünger: eine am Himmel, wie gewöhnlich, und noch eine auf ungewöhnliche Weise, eine, die ihnen allein schien, nämlich sein Angesicht. Seine Kleider aber zeigte er weiß wie Licht, weil aus seinem ganzen Körper die Herrlichkeit seiner Gottheil hervorquoll und sein Licht allen seinen Gliedern entstrahlte; denn nicht wie bei Moses leuchtete nur äußerlich sein Fleisch in hellem Glänze, sondern die Herrlichkeit seiner Gottheit quoll aus ihm hervor. Sein Licht ging auf und blieb in ihm gesammelt, es ging nirgend anderswohin und verließ ihn nicht. Es kam ja auch nicht von anderswoher, um ihn zu verklären; es war ihm nicht etwa zu zeitweiligem Gebrauche geliehen. Er zeigte auch nicht das ganze unergründliche Meer seiner Herrlichkeit, sondern nur soviel ihre Augensterne zu fassen vermochten.</p><h2>8</h2><p>„Und es erschienen ihnen Moses und Elias, und sie redeten mit ihm“. Der Inhalt ihrer Unterredung mit ihm war [wohl] dieser: Sie dankten ihm dafür, daß sowohl ihre Worte als auch die aller ihrer Mitpropheten durch seine Ankunft in Erfüllung gegangen sind. Sie beteten ihn an wegen des Heiles, das er der Welt, dem Menschengeschlechte, brachte, und wegen der tatsächlichen Erfüllung des Geheimnisses, das sie vorgebildet hatten. Durch diese Besteigung des Berges wurde den Propheten und Aposteln Freude bereitet. Die Propheten freuten sich, weil sie seine Menschheit sahen, die sie bisher nicht gekannt hatten. Es freuten sich aber auch die Apostel, weil sie die Herrlichkeit seiner Gottheit schauten, die sie nicht gekannt hatten, und die Stimme des Vaters hörten, die dem Sohne Zeugnis gab. Durch diese erkannten sie auch seine Menschwerdung, welche ihnen bisher dunkel war, und nebst der Stimme des Vaters überzeugte sie die sichtbare Herrlichkeit seines Leibes, die eine Wirkung der in ihm ohne Verwandlung und ohne Vermischung vereinigten Gottheit war. Das Zeugnis dreier wurde besiegelt durch die Stimme des Vaters und durch Moses und Elias, die ihn als Diener umstanden. Die Apostel und Propheten sahen einander an; es erblickten sich dort die Führer des Alten und des Neuen Bundes: der hl. Moses sah den geheiligten Simon [Petrus], der Verwalter des Vaters den Verwalter des Sohnes. Jener spaltete einst das Meer, damit das Volk mitten durch die Wogen ziehen konnte; dieser errichtete eine Hütte, um die Kirche zu bauen. Der Jungfräuliche des Alten Bundes sah den Jungfräulichen des Neuen Bundes, Elias den Johannes, der den feurigen Wagen bestieg jenen, der an die Brust des Feuers hinsank. Der Berg wurde zum Vorbilde der Kirche, und Jesus vereinigte auf ihm die beiden Testamente, welche die Kirche erhielt, und tat uns kund, daß er der Spender beider sei. Das eine empfing seine Geheimnisse, das andere offenbarte die Herrlichkeit seiner Taten.</p><h2>9</h2><p>Simon sagte: „Gut ist es für uns, hier zu sein, o Herr!“ O Simon, was sagst du da? Wenn wir hier bleiben, wer erfüllt dann die Weissagung der Propheten? Wer besiegelt dann die Worte der Herolde? Wer bringt dann die Geheimnisse der Gerechten zur Vollendung? Wenn wir hier bleiben, an wem erfüllt sich dann das Wort: „Sie haben meine Hände und Füße durchgraben“? Auf wen trifft dann zu: „Sie haben meine Kleider unter sieh verteilt und über mein Gewand das Los geworfen“ Wem wird dann dies begegnen: „Sie gaben mir Galle zur Speise, und für meinen Durst ließen sie mich Essig trinken“? Wer erfährt dann an sich die Benennung: „Frei unter den Toten“? Wenn wir hier bleiben, wer zerreißt dann die Handschrift Adams, und wer tilgt seine Schuld? Wer gibt ihm dann das Gewand der Herrlichkeit zurück? Wenn wir hier bleiben, wie soll dann geschehen, was ich dir gesagt habe? Wie soll dann die Kirche gebaut werden? Wie wirst du dann von mir die Schlüssel des Himmelreichs bekommen? Wen wirst du dann binden, wen lösen? Wenn wir hier bleiben, wird alles, was durch die Propheten gesagt wurde, ohne Erfüllung bleiben.</p><h2>10</h2><p>Simon sagte ferner: „Laßt uns hier drei Hütten errichten, dir eine, dem Moses eine und dem Elias eine!“ Simon war gesandt, die Kirche in der Welt zu bauen, und er will Hütten auf dem Berge errichten. Er sah nämlich noch immer in Jesus nur einen Menschen und stellte ihn neben Moses und Elias. Deshalb zeigte ihm der Herr, daß er seines Gezeltes nicht bedürfe; denn er war es ja, der seinen Vätern in der Wüste vierzig Jahre hindurch ein Wolkenzelt errichtet hatte. Denn „als sie noch redeten, siehe, da überschattete sie eine Lichtwolke“. Siehst du, Simon, das ohne Arbeit errichtete Zelt? Ein Zelt, das die Hitze abhält und kein Dunkel an sich hat? Ein Zelt, das blitzt und leuchtet? Während die Jünger staunten, vernahm man aus der Wolke eine Stimme vom Vater, die sprach: „Dies ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe; ihn höret!“ Bei diesem Rufe des Vaters kehrte Moses an seinen Ort zurück und Elias in sein Land; die Apostel aber fielen auf ihr Angesicht zur Erde nieder: Jesus stand allein da, weil jener Ruf nur ihm allein galt. Die Propheten flohen, und die Apostel fielen zu Boden; denn ihnen galt der Ruf des Vaters nicht, der bezeugte: „Dies ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe; ihn höret!“ Der Vater belehrte sie, daß die Verwaltung des Moses vorüber sei und daß sie nun auf den Sohn hören sollten. Denn jener redete als Diener, was ihm befohlen war, und verkündete, was ihm gesagt worden war, und ebenso alle Propheten, bis endlich kam, was aufbewahrt war, nämlich Jesus. Dieser ist Sohn, nicht Knecht; Herr, nicht Diener; Herrscher, nicht Untergebener; Gesetzgeber, nicht Untertan. Nach seiner göttlichen Natur ist „dieser mein geliebter Sohn“.</p><h2>11</h2><p>Den Aposteln offenbarte der Vater auf dem Berge, was ihnen unbekannt war. Der Seiende offenbarte den Seienden, der Vater den Sohn. Bei diesem Rufe fielen die Apostel auf ihr Angesicht zur Erde nieder. Denn es war ein furchtbarer Donner, so daß von seinem Schalle die Erde erzitterte und sie zu Boden stürzten. Der Donner zeigte ihnen an, daß der Vater nahe sei; dann rief sie der Sohn mit seiner Stimme und machte sie aufstehen. Wie nämlich die Stimme des Vaters sie niederwarf, so richtete sie die Stimme des Sohnes durch die Macht seiner Gottheit auf, welche in seinem Fleische wohnt und mit demselben ohne Verwandlung vereinigt ist, indem beide in einer Hypostase und in einer Person unzerteilt und unvermischt verbleiben. Er war nicht wie Moses nur äußerlich glänzend, sondern er strahlte als Gott in Herrlichkeit. Denn Moses wurde nur an der Oberfläche seines Gesichtes mit Glanz gesalbt, Jesus aber leuchtete am ganzen Leibe durch die Herrlichkeit seiner Gottheit, wie die Sonne durch ihre Strahlen.</p><h2>12</h2><p>Der Vater rief: „Dies ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe, ihn höret!“ Der Sohn ist von der Herrlichkeit der Gottheit nicht getrennt; denn eine Natur sind der Vater und der Sohn mit dem Hl, Geiste, eine Kraft, eine Wesenheit und eine Herrschaft. Auf einen nur ließ er die Stimme ertönen, mit einem schlichten Namen und zugleich mit furchtbarer Herrlichkeit. Auch Maria nannte ihn Sohn, der durch den menschlichen Leib von der Herrlichkeit seiner Gottheit nicht getrennt ist; denn der eine Gott ist es, der im Fleische in der Welt erschien. Seine Herrlichkeit offenbarte seine göttliche Natur aus dem Vater, und sein Leib offenbarte seine menschliche Natur aus Maria, und zwar beide Naturen verbunden und vereinigt in eine Hypostase. Er ist der Eingeborene aus dem Vater und der Eingeborene aus Maria. Wer ihn [in zwei Personen] trennt, wird von seinem Reiche losgetrennt werden, und wer seine Naturen vermischt, wird des Lebens in ihm verlustig gehen. Wer leugnet, Maria habe Gott geboren, wird nie die Herrlichkeit seiner Gottheit schauen. Wer leugnet, daß er einen sündelosen Leib getragen, wird von dem Heile und dem Leben verworfen, das durch seinen Leib gegeben wird.</p><h2>13</h2><p>Seine Werke bezeugen es, und seine göttlichen Wundertaten belehren die Verständigen, daß er wahrer Gott ist, und seine Leiden beweisen, daß er wahrer Mensch ist. Lassen sich die Geisteskranken [d. h. die Häretiker] nicht überzeugen, so werden sie an seinem furchtbaren Tage dafür büßen müssen. Wenn er nicht Fleisch war, wozu wurde dann Maria ins Mittel gezogen? Und wenn er nicht Gott war, wen nannte dann Gabriel Herr? Wenn er nicht Fleisch war, wer lag dann in der Krippe? Und wenn er nicht Gott war, wen priesen dann die herabgestiegenen Engel? Wenn er nicht Fleisch war, wer wurde dann in Windeln eingewickelt? Und wenn er nicht Gott war, wen beteten dann die Hirten an? Wenn er nicht Fleisch war, wen beschnitt dann Joseph? Und wenn er nicht Gott war, zu wessen Ehre eilte dann der Stern am Himmel dahin? Wenn er nicht Fleisch war, wen säugte dann Maria? Und wenn er nicht Gott war, wem brachten dann die Magier Geschenke dar? Wenn er nicht Fleisch war, wen trug dann Simeon auf den Armen? Und wenn er nicht Gott war, zu wem sagte dann dieser: „Entlaß mich nun in Frieden!“? Wenn er nicht Fleisch war, wen nahm dann Joseph und floh nach Ägypten? Und wenn er nicht Gott war, an wem ging dann das Wort in Erfüllung: „Aus Ägypten berief ich meinen Sohn“? Wenn er nicht Fleisch war, wen taufte dann Johannes? Und wenn er nicht Gott war, zu wem sprach dann der Vater vom Himmel herab: „Dies ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe!“? Wenn er nicht Fleisch war, wer fastete und hungerte dann in der Wüste? Und wenn er nicht Gott war, zu wem stiegen dann die Engel herab, um ihn zu bedienen? Wenn er nicht Fleisch war, wer wurde dann zur Hochzeit nach Kana in Galiläa eingeladen? Und wenn er nicht Gott war, wer verwandelte dann das Wasser in Wein? Wenn er nicht Fleisch war, in wessen Händen lagen dann die Brote? Und wenn er nicht Gott war, wer sättigte dann in der Wüste mit fünf Broten und zwei Fischen die Scharen, die, ohne die Weiber und die Kinder zu rechnen, Tausende betrugen?</p><h2>14</h2><p>Wenn er nicht Fleisch war, wer schlief dann im Schiffe? Und wenn er nicht Gott war, wer schalt dann die Winde und das Meer? Wenn er nicht Fleisch war, mit wem speiste dann Simon, der Pharisäer? Und wenn er nicht Gott war, wer verzieh dann die Vergehen der Sünderin? Wenn er nicht Fleisch war, wer saß dann, von der Reise ermüdet, auf dem Brunnen? Und wenn er nicht Gott war, wer gab dann der Samariterin lebendiges Wasser und warf ihr vor, fünf Männer gehabt zu haben? Wenn er nicht Fleisch war, wer trug dann die Kleider eines Menschen? Und wenn er nicht Gott war, wer wirkte dann die Kräfte und Wunder? Wenn er nicht Fleisch war, wer spuckte dann auf die Erde und bereitete Lehm? Und wenn er nicht Gott war, wer zwang dann durch den Lehm die Augen zum Sehen? Wenn er nicht Fleisch war, wer weinte dann am Grabmal des Lazarus? Und wenn er nicht Gott war, wer rief dann den seit vier Tagen Toten gebietend aus demselben heraus? Wenn er nicht Fleisch war, wer saß dann auf dem Füllen? Und wenn er nicht Gott war, wem zogen dann die Scharen mit Lobgesang entgegen? Wenn er nicht Fleisch war, wessen bemächtigten sich dann die Juden? Und wenn er nicht Gott war, wer gebot dann der Erde und warf sie [die Häscher] dadurch auf ihr Angesicht nieder? Wenn er nicht Fleisch war, wer wurde dann mit dem Backenstreiche geschlagen? Und wenn er nicht Gott war, wer heilte dann das von Petrus abgehauene Ohr wieder an seine Stelle an? Wenn er nicht Fleisch war, wessen Antlitz wurde dann angespien? Und wenn er nicht Gott war, wer hauchte dann den Aposteln den Hl. Geist ins Angesicht? Wenn er nicht Fleisch war, wer stand dann im Gerichtshause vor Pilatus? Und wenn er nicht Gott war, wer erschreckte dann die Gemahlin des Pilatus im Traume? Wenn er nicht Fleisch war, wessen Kleider zogen dann die Soldaten aus und verteilten sie? Und wenn er nicht Gott war, wie wurde dann die Sonne bei der Kreuzigung verfinstert? Wenn er nicht Fleisch war, wer hing dann am Kreuze? Und wenn er nicht Gott war, wer erschütterte dann die Grundfesten der Erde? Wenn er nicht Fleisch war, wessen Hände und Füße wurden dann mit Nägeln angeheftet? Und wenn er nicht Gott war, wie zerriß dann der Vorhang des Tempels, spalteten sich die Felsen und öffneten sich die Gräber?</p><h2>15</h2><p>Wenn er nicht Fleisch war, wer rief dann: „Mein Gott, mein Gott, warum hast Du mich verlassen?“ Und wenn er nicht Gott war, wer sagte dann: „Vater, verzeihe ihnen!“? Wenn er nicht Fleisch war, wer hing dann mit den Schachern am Kreuze? Und wenn er nicht Gott war, wie konnte er dann zum Schächer sagen: „Heute wirst du mit mir im Paradiese sein“? Wenn er nicht Fleisch war, wem reichte man dann Essig und Galle? Und wenn er nicht Gott war, wessen Stimme hörte dann die Unterwelt und erbebte? Wenn er nicht Fleisch war, wessen Seite durchbohrte dann die Lanze, so daß Blut und Wasser herauskam? Und wenn er nicht Gott war, wer zertrümmerte dann die Pforten der Unterwelt und zerbrach die Fesseln, und auf wessen Geheiß kamen dann die eingekerkerten Toten hervor? Wenn er nicht Fleisch war, wen sahen dann die Apostel im Obergemache? Und wenn er nicht Gott war, wie kam er dann bei verschlossenen Türen hinein? Wenn er nicht Fleisch war, in wessen Händen betastete dann Thomas die Wundmale der Nägel und in wessen Seite das Mal der.Lanze? Und wenn er nicht Gott war, wem rief dann dieser zu: „Mein Herr und mein Gott!“? Wenn er nicht Fleisch war, wer aß dann am See von Tiberias? Und wenn er nicht Gott war, auf wessen Gebot füllte sich dann das Netz? Wenn er nicht Fleisch war, wen sahen dann die Apostel und die Engel in den Himmel aufgenommen werden? Und wenn er nicht Gott war, wem öffnete sich dann der Himmel, wen beteten dann die Mächte zitternd an und wen forderte dann der Vater auf: „Setze dich zu meiner Rechten!“, wie auch David sagt: „Es sprach der Herr zu meinem Herrn: Setze dich zu meiner Rechten usw.“?</p><h2>16</h2><p>Wenn er nicht Gott und Mensch war, dann ist unsere Erlösung nur Lüge und sind die Aussprüche der Propheten Lügen; aber die Propheten redeten die Wahrheit, und ihre Zeugnisse sind ohne Trug. Was sie sagen mußten, das redete der Hl. Geist durch sie. Daher belehrte uns auch der keusche Johannes, der an der Brust des Feuers lag, die Stimmen der Propheten bekräftigend, von Gott in den Evangelien sprechend, also: „Im Anfange war das Wort, und das Wort war bei Gott, und Gott war das Wort. Alles ist durch dasselbe gemacht worden, und nichts, was gemacht wurde, ist ohne dasselbe gemacht worden. Und das Wort ist Fleisch geworden und hat unter uns gewohnt.“ Der aus Gott ist, Gott das Wort, der eingeborene Sohn aus dem Vater, wesensgleich mit dem Vater, das ewige Wort, das da ist aus dem, der ist, vor allen Zeiten auf unaussprechliche Weise ohne Mutter aus dem Vater gezeugt: eben dieser wurde am Ende [der bestimmten Zeit] aus einer Menschentochter, aus Maria, der Jungfrau, ohne Vater geboren. Der fleischgewordene Gott nahm von ihr das Fleisch an und wurde Mensch, was er vorher nicht war, blieb aber Gott, was er war, um die Welt zu erlösen. Dies ist Christus, der Sohn Gottes, der Eingeborene aus dem Vater und der Eingeborene aus der Mutter.</p><h2>17</h2><p>Ich bekenne ihn als vollkommenen Gott und als vollkommenen Menschen, der in den zwei hypostatisch oder zu einer Person vereinigten Naturen erkannt wird, und zwar ohne Trennung, ohne Vermischung und ohne Verwandlung, der Fleisch annahm, das durch eine vernünftige und verständige Seele belebt war, und der uns in allem, nur die Sünde ausgenommen, der menschlichen Natur nach gleich geworden ist. Er ist zugleich irdisch und himmlisch, zeitlich und ewig, beschränkt und unbeschränkt, zeitlos und der Zeit unterworfen, erschaffen und unerschaffen, leidend und leidensunfähig, Gott und Mensch, und zwar in beider Hinsicht vollkommen, einer in zweien und in zweien einer. Es ist eine Person des Vaters und eine Person des Sohnes und eine Person des Hl. Geistes. Es ist eine Gottheit, eine Macht, eine Herrschaft in drei Personen oder Hypostasen. In dieser Weise sollen wir die hl. Einheit in der Dreiheit und die hl. Dreiheit in der Einheit verherrlichen, indem der Vater vom Himmel herab gerufen hat: „Dies ist mein geliebter Sohn, ihn höret!“ Diese Lehre nahm die hl. katholische Kirche Gottes an, in dieser hl. Dreiheit tauft sie zum ewigen Leben, diese [die hl. Dreiheit] preist sie mit gleicher Ehrenbezeigung heilig, diese bekennt sie als unzerteilt und ungetrennt, betet sie ohne Irrtum an, bekennt und verherrlicht sie. Dieser dreipersönlichen Einheit gebührt Lob, Danksagung, Ehre, Macht, Verherrlichung: dem Vater und dem Sohne und dem Hl. Geiste, jetzt und allezeit und in alle Ewigkeiten. Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Rede über die Verklärung Christi</em>. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3939/versions/rede-uber-die-verklarung-christi-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "qbv1_Юлиановский_цикл"
    path: "Ephraem_Vier_Lieder_ueber_Julian"
    title: "Vier Lieder über Julian den Apostaten"
    menu: { parent: "Reden", title: "Vier Lieder über Julian den Apostaten", priority: 4 }
    update: true
    body: |-
      <p><em>Vier Lieder über Julian den Apostaten (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p><em>Gegen den Kaiser Julian, der Heide wurde, gegen die Irrlehren und gegen die Juden. Nach der Melodie: „Haltet euch an die Wahrheit!“</em></p><p>1. Das kaiserliche Szepter soll die Menschen leiten, die Länder beaufsichtigen und die wilden Tiere verjagen; das Szepter des kaiserlichen Apostaten tat gerade das Gegenteil. Bei seinem Anblick frohlockten die Bestien, die Wölfe traten auf seine Seite, freudige Erregung erfaßte Panther und Löwe, ja sogar die Schakale erhoben ein Freudengeheul.</p><p>2. Als die Wölfe den Nebel, den Regen und den Sturm sahen, riefen sie einander zu, stürmten herbei und tobten voll Hunger. Bisher waren sie alle eingeschlossen gewesen, jetzt umringten sie voll Wut die gesegnete Herde Christi. Aber bald zerbrach das Szepter, das sie erfreut hatte, und sie wurden wieder in Trauer versetzt. Die Stütze der Linkenwar eben nur ein zerbrechliches Rohr.</p><p>3. Da flohen sie wieder in ihre finsteren Felsenklüfte und zogen die Furcht, die sie abgelegt hatten, in ihren Höhlen von neuem an. Die verfinsterte Schöpfung wurde wieder hell und klar, nachdem die zerschmettert waren, die ihre Häupter erhoben hatten. Die Häupter des Leviathanwurden im Meere zermalmt, seinen einst so beweglichen Schwanz aber zerstampfte man auf dem Lande.</p><p>4. Die lebendig Totenwaren zu neuem Leben erwacht; sie hofften, am Leben zu bleiben, mußten aber bald erkennen, daß sie sich bitter getäuscht hatten. Zu derselben Zeit, als die Götzenbilder wieder erstanden, waren auch sie zu neuem Leben erwacht. Daher sprachen die Götzen selbst den Ungläubigen das Urteil. Die Heiden und die Unkräuterwaren dem gleichen Tode verfallen; denn beide klammerten sich zur gleichen Zeit an den gleichen Halt.</p><p>5. Damals geriet der Kot in Gärung und brachte Schlangen jeder Größe und Gewürm jeglicher Art hervor, so daß die ganze Erde mitten im Winterdavon wimmelte; denn der Hauch des Drachen hatte ihn befruchtet. Wer aber mit den Schuhen der Wahrheit ausgerüstet war, der verachtete die giftigen Stacheln der Söhne des Irrtums.</p><p>6. Die mit den gestürzten Götzen wieder aufgestanden waren, fielen aufs neue mit dem fallenden Kaiser. Sie hielten sich für stark und hofften bestehen zu können. Die Toren schlossen sich aneinander, kamen herbei und fielen. Ihr Fall beweist ihren Anstoß; denn mochten sie auch sonst verschiedenen Sinnes gewesen sein, hinsichtlich des Anstoßes waren sie eins; denn alle waren durch die gleiche Liebe zu dem einen Kaiser mit einander verbunden.</p><p>7. Damals, als sich die Teufel freuten, lebten auch sie plötzlich wieder auf; damals, als der Böse jubelte, frohlockten auch sie. Es war sozusagen ein Vorbild der ihnen bestimmten Ewigkeit, wo sie ebenfalls alle zusammen an den einen gehängt werden sollen: er machte sie jetzt schon untereinander zu Brüdern und Gliedern, sie hingen ja am Haupte der Linken.</p><p>8. Denn während die Rechte über die Sünder trauerte, waren die Söhne der Linken hocherfreut. Die Engel freuen sich nurüber die Büßer, die Toren aber tun törichterweise das Gegenteil. Nur die Kirche ahmt die Engel in beidem nach, indem sie über die Sünder weint und über die Büßer sich freut.</p><p>9. Als der Böse sah, daß er die Menschen in Rausch und Taumel versetzt hatte, da freute er sich und verachtete die Freiheit um so mehr, als sich die Menschen ihm so sklavisch unterworfen hatten. Der Böse staunte, dass er uns so mißhandeln durfte; aber die misshandelten Toren achteten nicht auf ihre Schmerzen und verschmähten die Heilung, obwohl der Arzt bereit war.</p><p>10. Der abscheuliche Februar, der trübe und alles betrübende Monat, hatte sich den Vorzug des alles erfreuenden Aprilangemaßt; aber es sproßten und blühten in ihm nur Dornen und Unkraut. Der Frost, der sonst alles erstarren macht, trieb Saft in die [noch unentwickelten] Dornen und Stacheln im Innern der Gestrüppe und Sträucher, und alsbald kamen sie nackt und bloßhervor.</p><p>11. Die Spätsaatwar gleichsam in Angst und Furcht, sie war ja nicht kunstgerecht gesät und gepflegt worden; denn es waren nur von selbst ausgefallene Körner, die in der Erde gekeimt hatten. Was nur oberflächliche Wurzeln geschlagen hatte, wurde bald ausgerottet; aber die kunstgerecht bestellte Saat schlug tiefe Wurzeln und trug hundertfältige, sechzigfältige und dreißigfältige Frucht.</p><p>12. Die Kaiser, welche Söhne der Wahrheit waren, hatten mit den beiden Testamenten, wie mit zwei an dasselbe gemeinschaftliche Joch gespannten Stieren, die Erde gepflügt und bestellt. Selbst die Dornenbekleideten sich mit dem Glanze des Weizens, und die Saat teilte sogar dem Unkrautihre Farbe mit. Als sie dann den Glanz wieder ablegten, taten sie es mit freiem Willen.</p><p>13. Die einen zeigten sich dann als Dornen, die anderen als Weizen; die einen erwiesen sich als Gold, die anderen als Staub. Der Tyrann wurde zu einem Schmelzofen für den Glanz der Wahrhaftigen. Welch herrliches Schauspiel! Die Wahrheit kommt in den Schmelzofen des Lügners und wird darin erprobt, der Irrtum dagegen verherrlicht die Wahrhaftigen und hat davon keine Ahnung!</p><p>14. Über den Abtrünnigen freuten sich alle Abtrünnigen und über das Haupt der Linken die Söhne der Linken. In ihm konnten sie sich sehen, wie sie waren; denn er war für sie alle ein Spiegel. Diejenigen, welche sich über seinen Sieg freuten, teilten den Triumph mit ihm, wie sie auch bei seinem Untergange Anteil an der Demütigung hatten.</p><p>15. Denn nur die Kirche war ganz gegen ihn, wie auch umgekehrt er und alle seine Anhänger gegen sie waren. Dies genügt zweifellos zum Beweise, daß es nur zwei Parteien gibt, die der Kirche und die ihrer Widersacher. Auch die Heuchler, von denen man glaubte, dass sie nicht zu den letzteren gehörten, schlossen sich ihnen schleunigst an, gleich Gliedern einer und derselben Kette.</p><p>16. Die Juden erfaßte rasendes Entzücken, sie stießen in die Posaune und freuten sich darüber, daß er ein Zauberer war, und jubelten, weil er ein Magier war. Die Beschnittenen sahen plötzlich das Bild des Stieres vor sich; auf seinen Goldmünzen erblicktensie den Stier der Schmach und begannen, ihn mit Pauken und Trompeten zu umtanzen; denn sie erkannten in ihm ihr ehemaliges Kalb.</p><p>17. Er ließ den Stier, das Symbol des Heidentums, der in sein Herz eingezeichnet war, in jenem Münzbilde für das Judenvolk, das ihn liebte, ausprägen. Vielleicht riefen die Juden beim Anblick dieses Stieres: „Israel, das sind die Götter, welche deine Gefangenschaft aus Babylon in das verwüstete Land zurückführen werden, wie dich das gegossene Kalb aus Ägypten herausgeführt hat“.</p><p>18. Der König von Babylon wurde plötzlich in einen Waldesel verwandelt; er lernte aber, sich bändigen zu lassen. Er schlug nicht mehr aus, obwohl er ein störrisches Tier geworden war. Der König von Griechenlandwurde plötzlich ein Stier, der die Kirchen stieß, aber bald dahingerafft wurde. Die Beschnittenen sahen den Stier auf die Stateren geprägt und freuten sich, daß die Kälber des Jeroboamwieder aufgelebt waren.</p><p>19. Vielleicht hatten die Juden deshalb an diese Münze eine so ausgelassene Freude, weil sie dachten: gleichwie der darauf abgebildete Stier einen Platz im Herzen, im Beutel und in der Hand des Kaisers habe, so stehe auch jenes Kalb der Wüste vor seinen Augen, seinem Herzen und seinem Geiste, ja er schaue es möglicherweise sogar in seinen Träumen.</p><p>20. Der König von Babylon wurde wahnsinnig und entfloh in die Wüste. Gott ließ ihn umherirren, auf dass er zur Ruhe komme; er ließ ihn wahnsinnig werden, auf daß er Vernunft annehme. Und er bereitete auch schließlich Gott Freude und dem Daniel Entzücken. Der griechische Kaiser machte sich dadurch strafbar, daß er Gott erzürnte und den Daniel Lügen strafen wolltedes Greuels wird Vernichtung sein; bis zur Vollendung der beschlossenen Dinge wird siein der Vernichtung verharren“; daher wurde er zu Babylon dem Gerichte überliefert und verurteilt.</p><h2>2</h2><p>1. Der Wolfkleidete sich in das Gewand eines Lammes der Wahrheit. Die arglosen Schafe beschnupperten ihn, aber erkannten sein wahres Wesen nicht. Als er den verstorbenen Hirten völlig betört hatte, da ließ er die Lammeshülle fallen und zeigte sich offen als Wolf. Die Böcke nahmen sofort seinen Geruch auf; sie haßten die Lämmer, ihn aber liebten sie als ihren Hirten.&gt;br&gt; Kehrvers:</p><p>Heil dem, der ihn vernichtet und alle Söhne des Irrtums in Trauer versetzt hat!</p><p>2. Sie [die Böcke] freuten sich über ihn, denn er war ein Magier; sie frohlockten über ihn, denn er war ein Zauberer. Sie gerieten außer sich vor Freude, weil er Kaiser, und in Entzücken, weil er Götzenpriester geworden war. Sie jubelten, weil nun durch ihn die Stelle so vieler Könige und Königinnen ihres Schlages, eines Achab, Jeroboam, Joathan, Manasses, einer Jezabel, Athalia, jener Quellen des Heidentums, wieder ausgefüllt war.</p><p>3. Sie verwarfen den Erlöser, den Zeugen des Wahrhaftigen, der die Wißbegierigen belehrte, daß es nur einen Gott gebe. Sie kreuzigten ihn durch ihren Abfall und ihre Vielgötterei [aufs neue] und freuten sich über das abscheuliche Unterpfand. Durch seine Opfer mietete und führte er die Götterschar herbei, damit sie [die Götterschar] die Dornenbüschel für das Höllenfeuer aufhäufe.</p><p>4. Auf seinem Feldzuge nahm er seine Götter und die Göttin, die er gegossen und in Erz gekleidet hatte, sowie Zauberer und Wahrsager mit; alle Söhne des Irrtums begleiteten ihn mit ihren Gebeten. Im Vertrauen auf die großartigen Verheißungen zog er aus und zerstörte sogar seine eigene Flotte, erwarb aber dadurch allen seinen Anhängern nur eine Krone von Schmach.</p><p>5. Seine Götter und Göttinnen pflegten miteinander zu tollen, und er, der der Keuschheit entsagt hatteschämte sich nicht, Götzen zu feiern, welche den Göttinnen liebestoll nachlaufen. Er war ihnen Opferbock und Opferpriester zugleich. Seinen Bart weihte er der Schande: er ließ ihn wachsen und neigte ihn herab, damit der Opferrauch ihn durchdringe.</p><p>6. Ihm sagte die Feier jener Schandgöttinzu, an deren Festtage Weiber und Männer vor unreiner Lust rasen, Jungfrauen sich preisgaben, Ehefrauen Unzucht treiben und schandvolle Reden ausstoßen. Solche abscheuliche Feiern liebte er, aber von den gesegneten Festen der Keuschheit und dem Ostern der Lauterkeitwollte er nichts wissen.</p><p>7. Die Heiden trugen ihre Götzenbilder umher und waren ausgelassen; die Beschnittenen lärmten mit der Posaune und rasten; alle schrien zusammen und tobten. Es war wie bei jenem Feste in der Wüste. Der Allgütige, der dort die durch das eine Kalb Aufgeregten ernüchterte, ernüchterte auch hier die Scharen, die der eine Kaiser aufgeregt hatte.</p><p>8. Er zermalmte jenes Kalb, um die Aufregung wegzunehmen; er zerbrach diese Kaiserkrone, um der Raserei ein Ende zu machen. Wie ein Arzt schnitt er die Ursache der Aufregung weg. Beide wurden im Süden gestürzt; durch ein scharfes Eisen vernichtete er das Kalb und durch einen furchtbaren Speer den Kaiser.</p><p>9. Die Ziegen vom Geschlechte jenes Ziegenbockes, mit langen Haaren und stinkenden Bärten, umringten den Schwarzen [Julian], der auf die Ehe verzichtete, weil er sich seiner Schande [Aphrodite] verlobt und geweiht hatte; diese Zeichendeuter der Linken trieben durch ihre Weissagungenden Bock an, gegen Persien in den Krieg zu ziehen, um dort als Opfer zu fallen.</p><p>10. Mit ihren Orakeln knickten sie den Stengel des Unkrauts, den Schaft und die Säule, auf die sich die Dornen, seine Gesinnungsgenossen, und die Disteln, seine Sippschaft, stützten. Dem Weizen hatte er bei seinem Aufbruch gedroht, ihn nach der Rückkehr mit dem Gestrüppe seines Heidentums zu ersticken; aber der Ackersmann der Gerechtigkeit jätete das Unkraut aus.</p><p>11. Er war jenem Dornstrauch gleich, von dem geschrieben steht, daß er stolz und übermütig wurde, so daß er die Zedern und Zypressen zu erniedrigen drohte, die Disteln und Unkräuter dagegen erhöhen wollte. Aber der gerechte Gott machte aus ihm einen Besen, kehrte damit rücksichtslos allen heidnischen Unrat zusammen, schaffte sein Heidentum fort und warf es an einen abgelegenen Platz.</p><p>12. Die Magier und Wahrsager einzeln zu besiegen, däuchte der Wahrheit zu gering; deshalb band sie dieselben mit dem einen Kaiser zusammen und gab ihnen Gelegenheit, sich mit Helm und Rüstung zu wappnen, um sie dann zusammen in dem einen zu besiegen und das Band der Schmach um sie alle zu schlingen. Denn alle Söhne des Irrtums erwiesen sich in jeder Beziehung als Betrüger.</p><p>13. Haben nun alle insgesamt bei ihren Weissagungen betrogen, so hat natürlich auch jeder einzelne für sich Lügen geweissagt. Die Schweine zogen aus und besudelten sich mit abscheulichem Unräte. Sie sind eine Herde, welche die Welt beschmutzte; denn sie zogen aus und beschmutzten sich, dann kehrten sie zurück und schüttelten sich aus. Und es gelang ihnen und gelingt ihnen noch, viele zu verführen.</p><p>14. Nachdem der König von Babylon die Sterndeuter überführt hatte, ließ er keine andern mehr rufen; denn er hatte sie ein für allemal erprobt. Daher zog er sich von ihnen zurück, verstieß sie und überlieferte sie dem Tode. Er wollte also von seinen eigenen Leuten nichts mehr wissen. Wenn sie nun aber diesen betrogen haben, um wieviel mehr werden sie dich betrügen! Und wenn alle gelogen haben, wie sollte man da einem von ihnen glauben können?</p><p>15. Denn er hatte gewahrsagt und versprochen, geschrieben und uns übersandt, daß er auf seinem Feldzuge Persien überwältigen und demütigen, Singaraber wieder aufbauen würde. Aber die Drohung seines Briefes erfüllte sich so wenig, daß sogar Nisibis infolge seines Kriegszuges verloren ging; denn er hatte durch seine Beschwörer gerade die Macht, auf die es vertraute, gelähmt. Als Opferlamm rettete die Stadt sein Heer.</p><p>16. Gott hat das eroberte Nisibis als Spiegel aufgestellt, in den wir schauen sollen. Den heidnischen Kaiser, der auszog, um zu nehmen, was nicht sein war, ließ er das verlieren, was sein war, diese Stadt, welche der Welt die Schmach seiner Beschwörer verkündigte. Damit aber seine Schande eine fortdauernde sei, mußte er [Julian]diesen fortwährenden, unermüdlichen Herold dem Feinde ausliefern.</p><p>17. Sie [die Stadt Nisibis] ist ein Herold, da sie den Schimpf seiner [des Julian] Beschwörer mit vier Zungenin alle Welt hinausruft; denn die Tore dieser Stadt öffneten sich ehedem nach den glücklich überstandenen Belagerungen und öffnete damit zugleich unseren Mund zum Preise unseres Befreiers; heute sind sie verschlossen, um dadurch den Mund der Heiden und Irrgläubigen zu verschließen.</p><p>18. Wir wollen nun der Ursache nachgehen, warum und wie diese Stadt, der Schild aller Städte, preisgegeben wurde. Der Rasende hatte in seiner Raserei seine Schiffe auf dem Tigris verbrannt. Ohne daß er es merkte, hatten die Bärtigen den Bock überlistet, der sich doch rühmte, das Verborgene zu wissen. So wurde er offen getäuscht, damit er im geheimen noch mehr beschämt würde.</p><p>19. Diese Stadt verkündete die Wahrheit ihres Befreiers, als die plötzlich ausgebrochenen und anprallenden Fluten sich legten, die Belagerungswerke einstürzten und die Elephanten ertranken. Der damalige Kaiserrettete die Stadt durch sein Bußgewand; der Tyrann [Julian] aber vereitelte durch sein Heidentum ihren Triumph, während sie ehedem das Gebet mit Sieg gekrönt hatte.</p><p>20. Die Wahrheit war ihre Mauer, das Fasten ihr Bollwerk. Die Magier kamen drohend heran, aber in ihnen wurde Persien zuschanden, Babylon in seinen Sterndeutern und Indien in seinen Zauberern. Dreißig Jahrelang hatte sie die Wahrheit mit Sieg gekrönt. Aber als jener im Sommerin der Stadt ein Götzenbild aufgestellt hatte, entfloh die Gnade, und der Zorn eilte herbei.</p><p>21. Die leeren Götzenopfer entleerten ihre [der Stadt] Volksmenge; die Dämonen, die Söhne der Wüste, verwüsteten sie infolge ihrer Trankopfer; der Götzenaltar, der in ihr errichtet worden war, zerstörte und entfernte den Altar, dessen härene Decke uns gerettet hatte; die Feste der Raserei beseitigten ihre [der Stadt] Festfeier, und der Dienst der Söhne des Irrtums machte ihrem Gottesdienst ein Ende.</p><p>22. Nachdem der Magierin unserer Stadt eingezogen war, sühnte er unsere Schmach und verachtete seinen Feuertempel, ehrte aber unsere Kirche; er zerstörte die Götzenaltäre, die zur Zeit unserer Erniedrigung erbaut worden waren, und riß die zu unserem Schimpf errichteten Baulichkeiten nieder; denn er wußte, daß die Gnade, die uns dreimalvor ihm errettet hatte, nur von einem Heiligtumeausgegangen war.</p><p>23. Wie sehr hat sich doch die Wahrheit in unserer Stadt geoffenbart! Sie zeigte sich in unseren Breschen nach allen Seiten hin, so daß sogar Blinde sie in unserer Errettung sehen mußten. Auch der Königerkannte sie in unserer Befreiung; da er sie in unseren Triumphen geschaut hatte, als er noch außerhalb der Stadt war, ehrte er sie durch Opfergaben, nachdem er in dieselbe eingezogen war.</p><p>24. Der Krieg war der Ofen der Prüfung, der dem König die Schönheit der Wahrheit und die Hässlichkeit der Lüge offenbarte. Durch die Erfahrung lernte er, daß der Herr dieses Hauses in allem gütig und gerecht ist; denn solange die Stadt ihm gläubig anhing, überlieferte er sie ihm trotz aller seiner Anstrengungen nicht; als sie ihn aber durch ihre Götzenopfer herausgefordert hatte, gab er sie ihm mühelos preis.</p><p>25. Das Bußgewand des seligen Kaisershatte diese Stadt, die das Haupt des ganzen Zweiströmelandes war, errettet und verherrlicht; die Gotteslästerung des Tyrannen dagegen erniedrigte und demütigte sie. Wer vermöchte die Größe ihrer Schande zu ermessen? Sie, die vordem das Haupt des ganzen Abendlandes gewesen, ist jetzt zur äußersten Ferse des Morgenlandes geworden.</p><p>26. Diese Stadt darf nicht mit den übrigen gleich gestellt werden; denn zu wiederholten Malen hat sie der Gütige vom sicheren Untergang, vom Krieg unterund über der Erde errettet. Als sie aber ihrem Retter mit Undank lohnte, da gab er sie preis; doch mischte der Gerechte seiner Zornesglut sein Erbarmen bei, so dass er uns nicht in die Verbannung trieb und zerstreute, sondern im Heimatlande ließ.</p><p>27. Der Kaiser war Götzenpriester geworden und hatte unsere Kirche mit Schmach überhäuft; der Magierkönig dagegen ehrte unser Heiligtum. Er verdoppelte unseren Trost, indem er unser Heiligtum ehrte. Er betrübte und erfreute uns zu gleicher Zeit und zerstreute uns nicht. So hat Gott jenen Irrenden durch einen anderen Irrenden zurechtgewiesen, und je undankbarer der Götzenpriester sich zeigte, desto dankbarer erwies sich der Magier.</p><h2>3</h2><p>1. Hinsichtlich der Stadt erlebte ich ein merkwürdiges Zusammentreffen: Zu eben der Zeit, als der Leichnam dieses Verfluchten an der Stadtmauer vorübergetragen wurde, pflanzte ein Magierdie aus dem fernen Osten hergesandte Fahne auf dem Turme auf, um damit den Zuschauern anzudeuten, daß die Stadt nunmehr den Herren dieser Fahne Untertan geworden sei.</p><p>Kehrvers:</p><p>Preis dem, der seinen Leichnam in Schmach gehüllt hat!</p><p>2. Staunend fragte ich mich, wer wohl dieses gleichzeitige Zusammentreffen von Leichnam und Fahne herbeigeführt haben könnte, und ich erkannte darin eine bewundernswerte Fügung der göttlichen Gerechtigkeit, daß gerade zu der Zeit, als die Leiche des Gestürzten vorbeigetragen wurde, die schreckliche Fahne aufgepflanzt wurde, welche verkündete, daß die Gottlosigkeit seiner Beschwörer diese Stadt den Feinden überliefert habe.</p><p>3. Dreißig Jahre lang hatten die Perser auf alle mögliche Weise gegen diese Stadt Krieg geführt, aber trotzdem die Mauer nicht zu überschreiten vermocht. Wohl gelang es ihnen, in dieselbe Breschen zu legen und sie niederzureißen, aber da griff das Kreuz ein und brachte Rettung. Damals aber bot sich mir ein abscheulicher Anblick: auf dem Turme die Flagge des Eroberers und im Sarge die Leiche des Verfolgers.</p><p>4. Glaubt mir, Brüder, auf ja und nein, wenn ich euch sage, daß ich zum Sarge dieses Unreinen hinging und, als ich bei ihm stand, sein Heidentum also verhöhnte: Das ist also jener, der sich gegen den lebendigen Namen erhoben und dabei vergessen hat, daß er nur Staub ist. Deshalb hat ihn Gott wieder zu Staub werden lassen, damit er erkenne, daß er Staub sei.</p><p>5. Ich stand da voll Staunen über die tiefe Erniedrigung, in der ich ihn schauen mußte. Das war also der einst so hoheitsvolle, stolze Inhaber von Thron und Reich, das die Schleuder, die gegen uns geschwungen worden war! Ich machte mir selbst Vorwürfe darüber, daß ich dieses Ende nicht schon zurzeit seiner Machtfülle vorausgesehen hatte.</p><p>6. Ich konnte nicht begreifen, wie so viele den Spender alles Lebens verleugnen konnten, um einer sterblichen Krone zu gefallen. Brüder, ich blickte nach oben und nach unten, und bewundernd sah ich die Glorie unseres Herrn dort oben und die tiefe Erniedrigung des Verfluchten hier unten. Da dachte ich: Wer würde sich wohl jetzt noch vor diesem Leichnam fürchten und den Wahrhaftigen verleugnen?</p><p>7. Daß das Kreuz, als es mit uns in den Kampf zog, nicht siegte, geschah nicht aus dem Unvermögen zu siegen - es ist ja stets siegreich -, sondern damit für den Frevler, der auf Betreiben seiner Wahrsager nach dem Osten gezogen war, die Grube gegraben würde. Als er nun in dieselbe gefallen und umgekommen war, da wurde es den Einsichtigen klar, daß der Krieg nur auf ihn gewartet hatte, um ihn zu Fall zu bringen.</p><p>8. Man sollte erkennen, daß der Streit sich deshalb so sehr in die Länge gezogen hatte, damit der Keuschedie Jahre seiner Herrschaft vollenden, aber auch der Verfluchte das Maß seines Heidentums vollmachen könnte. Als sich dann sein Geschick erfüllt hatte und er dahingerafft war, da wurde es dann auf beiden Seiten wieder hell, und es ward Friede unter dem gläubigen Kaiser, dem Genossen der Glorreichen.</p><p>9. Der Gerechte hätte ihn auf alle mögliche Weise töten können, aber er sparte ihn für einen entsetzlichen und bitteren Sturz auf; denn an seinem Todestage traten ihm alle diese Gedanken vor die Seele: Wo war jetzt der Orakelspruch, auf den er soviel Vertrauen gesetzt hatte? Wo blieb die Kriegsgöttin, daß sie ihm nicht zu Hilfe eilte? Und wo die Scharen seiner Götter, daß sie ihm keine Rettung brachten?</p><p>10. Als damalsdas Kreuz des Allwissenden an der Spitze der Truppen in den Kampf gezogen war, ließ es sich den Hohn, es habe sie doch nicht retten können, ruhig gefallen. Den Kaiser hatte es in Frieden bewahrt, das Heer dagegen dem Untergang preisgegeben; denn es kannte dessen heimliches Heidentum gar wohl. Preisen wir also das Kreuz des Alldurchforschers, das damals einsichtslose Toren geschmäht haben!</p><p>11. Denn sie hielten nicht zur Fahne des Allerlösers, und dieses Heidentum, das sie am Schlusse offenbarten, war unserm Herrn schon von Anfang an offenbar. Aber obwohl er ihre heidnische Gesinnung kannte, rettete sie doch sein Kreuz; erst als sie sich von ihm lossagten, mußten sie dort Leichen verzehren und wurden zum Sprichwort.</p><p>12. Als das Volk Israel bei der elenden Stadt Hai besiegt worden war, zerriß Josua seine Kleider vor der Bundeslade und sprach vor dem Höchsten die schrecklichen Worte: „Ein Bann ist unter dem Volke, und man weiß es nicht!“Ebenso war im Heere das Heidentum verborgen, trotzdem sie das Kreuz, wie jene die Bundeslade, trugen.</p><p>13. Die Gerechtigkeit rief ihn auf kluge Weise herbei, nicht durch Zwang lenkte sie seinen Willen. Sein Ehrgeiz lockte ihn zu dem todbringenden Speer. Als er sah, wie leicht ihm die Eroberung der Festungen gelang, wurde er übermütig; zudem trat kein Unfall ein, der ihn zur Rückkehr hätte veranlassen können. Und so stürzte er schließlich in den Abgrund.</p><p>14. Weil er den gelästert hatte, der den [flammenden] Speer vom Paradies weggenommen hat, darum drang der Speer der Gerechtigkeit in seinen von den Orakeln seiner Zauberer schwangeren Leib und riß ihn auf. Schmerzlich stöhnte er, als er da an die Drohungen denken mußte, die er in seinem Briefe gegen die Kirchen ausgestoßen hatte. Der Finger der Gerechtigkeit hat sein Andenken ausgelöscht.</p><p>15. Der Kaiser sah, wie die Söhne des Morgenlandes zu ihm kamen und ihn überlisteten, die Einfältigen den Weisen, die Profanen den Zauberer, Die [Perser], welche er schon in sein Netz verstrickt glaubte, nahmen durch die Mithilfe Ungelehrter seine Weisheit gefangen. Er befahl, die Schiffe, die ihm den Sieg verschafft hätten, zu verbrennen. Und so wurden durch eine einzige Überlistung seine Götter und Zauberer gefesselt.</p><p>16. Als er einsah, daß seine Götter mit Schimpf und Schmach bedeckt waren und daß er selbst weder siegen noch fliehen konnte, schwankte er lange unentschlossen zwischen Furcht und Schande hin und her. Endlich wählte er den Tod, um in die Hölle zu entfliehen. Deshalb legte er mit Vorbedacht den Panzer ab, um tödlich getroffen zu werden und zu sterben, ohne daß die Galiläer sich an seiner Schmach weiden könnten.</p><p>17. Verächtlich hatte er die Brüder Galiläergenannt. Siehe, nun rollen die Räderdes galiläischen Königs in der Luft; von seinem Wagen aus, den die Cherube tragen, läßt er seinen Donner erschallen. Der Galiläer rädert die Herde des Zauberers und überliefert sie den Wölfen in der Wüste, aber die galiläische Herde erstarkt und erfüllt die Welt.</p><h2>4</h2><p>1. Wie raffiniert war doch der Schmelzofen, der die Königstochterläuterte! Er zeigte sich gegen sie freundlich, aber sie war darüber nicht erfreut; er suchte sie zu betrüben, aber sie geriet nicht in Angst; er bot ihr an, aber sie nahm nichts an; er beraubte sie, aber sie unterlag nicht. Sie zerstörte dagegen seine Altäre, und er geriet in Wut, Nachdem er aber eines ihrer Glieder zerfleischtund dadurch ihre Standhaftigkeit erprobt hatte, hörte er kluger Weise auf, um nicht ihren Triumph noch zu erhöhen.</p><p>Kehrvers:</p><p>Preis dem, der die Lügner von seiner Wahrheit überzeugt hat!</p><p>2. In dem einen ihrer Glieder hatte er alle ihre Glieder geprüft und alle bereit gefunden, ihre Kronen zu empfangen. Als er einsah, daß er die Wahrhaftigen durch Gewalt nicht bezwingen konnte, verstellte er sich und trat mit Schmeichelreden an sie heran. Er warf seinen Sauerteig in ihre Milch; aber dadurch läuterte er sie nur, ohne es zu bemerken. Das Ihrige mußte er ihr lassen, und nur das Seinige zog er an sich.</p><p>3. Ebenso sah er alle seine Angehörigen in dem einen Verwandten, der bei lebendigem Leibe von Würmern wimmelte und zerfressen wurde. In dem diesseitigen Wurm sah er den jenseitigen. Der Gerechte schnitt ihm durch die Würmer den Arm ab, und er sank ohne Arm hinab, um dadurch anzuzeigen, daß jener im Kampfe abgehauen und nicht siegreich, verstümmelt und nicht triumphierend sein werde.</p><p>4. Er war sein Fleisch und Blut, sein vollkommenes Ebenbild, beide waren sogar mit dem gleichen offenkundigen Namen bezeichnet, gleichwie sie von demselben verborgenen Teufel besessen waren. Sein Verwandter kündigte ihm durch seine Würmer das eigene Schicksal an. In diesem Gegenbilde erblickte er sich selbst und die ihm bevorstehende Strafe. In seinem Tode sah er den eigenen Untergang und in seinem Wurm die eigene Qual.</p><p>5. Der Irrtum schlug seine Leier und fing sie ein: den Achab durch Verheißungen, diesen durch Wahrsprüche. Durch die Propheten des Baaltempels wie durch die Besessenen des Lügentempels sang er das gleiche Lied: dem Achab, daß er hinaufziehen; diesem, daß er hinabziehen solle. Und Achab zog hinauf und fiel; dieser zog hinab und kam um.</p><p>6. Wer hat je so viele Götzenaltäre errichtet? Wer hat je alle Teufel so geehrt? Wer hat je so alle Dämonen sich günstig zu stimmen gesucht? Nur den einen [Gott] erzürnte er - und wurde zerschmettert! In ihm wurde die ganze linke Seite als eine Macht bloßgestellt, die ihren Anbetern nicht helfen kann.</p><p>7. Er suchte sich die berühmtesten Zauberer, die ausgezeichnetsten Sterndeuter, die erfahrensten unter den Söhnen des Irrtums aus, damit nicht etwa aus Unwissenheit das Richtige übersehen und verfehlt würde. Diese mühten sich nun Tag für Tag auf alle Weise ab, vertieften sich in die Lehren der Geheimkunst und forschten darin; aber als sie glaubten, etwas herausgebracht zu haben, da war der ganze Erfolg nichts als Schmach.</p><p>8. Der Gerechte hatte einst dem Saulmit dessen eigenem Maße gemessen: da er durch Zauberei fragte, so betrübte er ihn durch Zauberei und ließ ihn von dem, auf den er horchte, ein Lied hören, das ihm das Herz verwundete. In gleicher Weise verfuhr er mit diesem, welcher in Sauls Fußstapfen wandelte: er liebte die chaldäischen Sterndeuter, darum gab er ihn den Chaldäern preis; er betete die Sonnean, darum fiel er durch die Sonnenanbeter.</p><p>9. Weil er Gott verleugnete, der niemals in sich geteilt ist, deshalb überließ er ihn dem Satan, der niemals in sich einig ist. Der Irrende irrte, als er in den Krieg gegen die Irrenden auszog. Er betete ja selbst die Sonne an, und doch fügte er ihr anderseits wieder Schimpf zu, da er aufbrach, um gegen ihre Diener und Anbeter zu streiten. Das Satansreich ist eben durch und durch morsch und gespalten.</p><p>10. Im Vertrauen auf die Hilfe der Sonne zog er aus, um diejenigen zu besiegen, welche schon seit langer Zeit der Sonne opferten. Dadurch hat er sich selbst das Urteil gesprochen, da er ja selbst der Sonne opferte. Und ohne daß er es ahnte, ließen ihn auch die Sterne im Stiche. Während er aus ihnen entnahm, daß er siegen werde, wenn er ausziehe, hatte er vielmehr in ihnen lesen sollen, daß er unterliegen werde, wenn er ausziehe.</p><p>11. Pochend auf seine Verehrung der Sonne beschloß er, in den Krieg zu ziehen; aber dabei beachtete er nicht, daß sie dort [in Persien] noch viel eifriger angebetet wird. Da die Sterndeuter zu Babylon zu Hause sind, wie konnte er als Fremdling dagegen aufkommen wollen? Wenn er so fest auf den Irrtum vertraute, dem er sich doch erst vor kurzem angeschlossen hatte, so konnten doch diejenigen, bei denen derselbe schon vor ihm bodenständig war, noch viel fester auf ihn vertrauen.</p><p>12. Als er durch seine Forschungen herausgebracht hatte, daß er, wenn er in den Krieg ziehe, diejenigen besiegen werde, welche der Sonne eifrig opferten, gab er seinen eigenen Götzendienst auf und wurde Sonnenanbeter. Aber gerade dadurch beschimpfte er die Sonne, ohne es zu bemerken; denn dadurch, daß er voraussetzte, sie werde ihre langjährigen getreuen Diener im Stiche lassen, erklärte er sie ja für undankbar und ihre Verehrung für zwecklos.</p><p>13. Die Parteien der Kinder des Bösen, die durchaus nie einig sind, sind von der Wurzel aus in sich gespalten. Wenn zwei Könige zugleich in den Sternbildern ihr Schicksal lesen wollen, so müssen sie zu einem falschen Ergebnis kommen; denn wenn der eine aus der Konstellation ersehen könnte, daß er siegen werde, müßte auch der andere zu dem gleichen Resultate gelangen.</p><p>14. Da er wie sie die Sonne anbetete, da er wie sie die Zeichen beobachtete, da er wie sie die Orakel befragte, so ist folglich der Böse in sich selbst geteilt, so belügt ihre verfluchte Lehre ihre eigenen Lehrer und betrügt ihr wahnwitziger Aberglaube dessen Verbreiter.</p><p>15. Der Sohn des Kaisers, dieses Meer von Ruhe, erging sich nie in Siegesankündigungen; denn er wußte wohl, daß der Ratschluß des Höchsten unerforschlich ist. Er gab seine Krone dem Allwissenden anheim, und wenn er auch keine [kriegerischen] Siege und Triumphe feiern konnte, so war doch das schon ein herrlicher Sieg und Triumph, daß sein Gebet vierzig Jahre hindurchdas Reich erhielt.</p><p>16. Einer Zeder gleich neigte er sich zu seiner Zeit sanft zu Boden, sank auf sein Sterbelager und legte sich in Frieden zur Ruhe. An seiner Statt entsproßte der süßen Wurzel seines Stammes ein Schößling des Heidentums, von dem man erwartete, daß er auf lange Zeit hinaus die Berge mit seinem Schatten bedecken würde. Aber in einer Nacht sproßte er auf, in der nächsten verdorrte er wieder.</p><p>17. Und es brannte die Sonne auf die Häupter seiner verfluchten Anhänger, wie einst auf Jonas, herab, eine klug unterscheidende Sonne, da sie die Wahrhaftigen erquickte, die Abtrünnigen dagegen quälte. Denn wenn Jonas leiden mußte, weil er sich gegen die Büßer erhob, um wieviel mehr wird jeder gepeinigt werden, der gegen die Heiligen kämpft.</p><p>18. Damals erregte Gott zur Überführung des Irrtums Erdbeben, um dadurch in der Welt den Seelen die Wahrheit zu predigen. Zur Beschämung des Heidentums wurden ganze Städte zerstört, Jerusalem aber sollte die verfluchten Kreuziger, die sich erfrechten, den Wiederaufbau der Ruinen, des Werkes ihrer Sünden, zu beschließen und in Angriff zu nehmen, ganz besonders ins Unrecht setzen.</p><p>19. Diese einfältigen Toren hatten Jerusalem, als es noch bestand, zerstört, und jetzt, wo es zerstört war, beschlossen sie, es wieder aufzubauen. Als es noch festgegründet dastand, hatten sie es geschleift, und nun, da es verwüstet war, liebten sie es. Jerusalem erbebte, als es sah, daß seine Zerstörer wiederum kämen, um seine Ruhe zu stören. Da flehte es den Höchsten um Hilfe gegen sie an und fand Erhörung.</p><p>20. Er gebot den Stürmen, und sie wehten; er winkte den Erdbeben, und sie kamen; den Blitzen, und sie zuckten; der Luft, und sie verfinsterte sich; den Mauern, und sie stürzten ein; den Toren, und sie öffneten sich. Feuer brach hervor und verzehrte die Schriftkundigen, die bei Danielgelesen hatten, daß die Verwüstung ewig währen sollte. Sie hatten es gelesen, aber daraus nichts gelernt; darum wurden sie durch ihren elenden Untergang belehrt.</p><p>21. Sie hatten Jerusalem zerstreut durch die Tötung des Sanftmütigen, der dessen Küchlein hatte sammeln wollen; nun aber hofften sie, daß der Irrtum des Zauberers es wieder sammeln würde. Sie hatten es durch die Verfolgung der Standhaftenniedergerissen, und nun wollten sie es durch die Begünstigung der Wankelmütigen stützen und wieder neu aufbauen. Sie hatten seinen großen Altar durch die Ermordung des Heiligen zerstört, und nun hofften sie, der Erbauer der Götzenaltäre werde ihn wieder aufrichten.</p><p>22. Sie hatten Jerusalem durch das Kreuzesholz, das sie dem lebendigen Baumeister der Welt bereitet hatten, zum Einsturz gebracht, und nun wollten sie es mit dem gebrechlichen Rohre des Heidentums stützen. Sie hatten es durch die Ermordung des Zachariasbetrübt, der es durch seine Weissagung: „Siehe, dein König kommt!“erfreut hatte, und nun wollten sie ihm eine Freude bereiten durch das Orakeldes Wahnsinnigen, indem sie ihm die frohe Botschaft verkündeten: „Siehe, es kommt der Besessene, der dich wieder aufbauen wird; er wird in dich einziehen und in dir seinen TeufelnOpfer und Spenden darbringen.“</p><p>23. Aber Daniel hatte schon über Jerusalem das entscheidende Urteil gefällt, daß es nie mehr aufgebaut werden solle, und Sion glaubte ihm. Beide [Jerusalem und Sion]beklagten und beweinten ihr Los, gaben aber die Hoffnung endgültig auf. Kanatröstete die beiden Trauernden durch seinen Wein und gab ihnen den Rat: „Vernachlässigt doch bei eurer Trauer nicht die Dankespflicht gegen den Gütigen!“</p><p>24. „Denn sehet, jetzt lebt ihr in Ruhe und Frieden, befreit von den Besessenen und dem Umgang mit den Teufelsdienern. Diese haben stets Unruhen und Aufruhr erregt, haben sogar den Spender alles Lebens gekreuzigt und euch beide unaufhörlich gequält. Sie haben in euch die Propheten ermordet, die Götzen dagegen vermehrt und durch das Götzenbild mit den vier Gesichterneuch die Schamröte ins Gesicht getrieben.</p><p>25. „Heilsamer als dieser heidnische Wohlstand ist für euch die Verwüstung ohne Sünden und die Öde ohne Zauberei. Der Gütige hat euch beiden noch zwei Orte, Bethlehem und Bethanien, beigesellt und veranlaßt, daß statt des verbannten Judenvolkes jetzt alle Völker unter Lobgesängen zu euch wallfahren, um in eurem Schoße das heilige Grab von Golgotha zu schauen.“</p><p>26. Wer wird jetzt noch an Schicksalserforschung und Horoskop glauben? Wer wird jetzt noch Orakeln und Wahrsagern Vertrauen schenken? Wer wird sich jetzt noch von Zauberern und Sterndeutern irreführen lassen? Denn sie alle haben in allem vollständig versagt. Um aber nicht jedem einzelnen Irrenden eigens die Nichtigkeit des Aberglaubens beweisen zu müssen, hat der Gerechte diesen einen Irrenden zerschmettert, um dadurch alle übrigen zu belehren.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Vier Lieder über Julian den Apostaten</em>. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-4027/versions/vier-lieder-uber-julian-den-apostaten-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "RAEO_Творения__Часть_4"
