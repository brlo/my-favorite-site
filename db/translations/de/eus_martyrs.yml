      <p><em>Die Märtyrer in Palästina (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Es war das neunzehnte Jahr der Regierung Diokletians, der Monat Xanthikus — April würde er bei den Römern heißen —, unter der Statthalterschaft des Flavian in Palästina, als gerade zu der Zeit, da das Fest des Leidens des Herrn herannahte, auf einmal allenthalben ein Edikt angeschlagen wurde des Inhalts, die Kirchen seien dem Erdboden gleichzumachen und die heiligen Schriften dem Feuer zu übergeben; ferner sollten diejenigen, die in Ämtern und Würden stünden, dieselben verlieren, die Bediensteten des kaiserlichen Hauses aber der Freiheit verlustig gehen, wenn sie beim Bekenntnisse des Christentums verharrten. Das war der Inhalt des ersten gegen uns gerichteten Ediktes. Bald darauf folgte ein zweites mit der Bestimmung, überall seien alle Vorsteher der Kirchen zunächst zu verhaften und danach mit allen Mitteln zum Opfern zu zwingen.</p><h2>2</h2><p>Der erste unter den Märtyrern in Palästina wurde Prokopius. Ohne vorherige Gefängnishaft wurde er unmittelbar vom Eingangstore weg vor den Richterstuhl des Statthalters geführt; aber auf den Befehl, den sogenannten Göttern zu opfern, erklärte er, nur einen Gott zu kennen, dem man so opfern müsse, wie er es selbst wolle; und auf den Befehl, auch den vier Kaisern ein Trankopfer zu bringen, zitierte er das Wort des Dichters:</p><p>„Nicht ist von Segen die Herrschaft von vielen; nur einer soll Herr sein, Einer der König“.</p><p>Und kaum hatte er das Wort gesprochen, das ihnen nicht gefiel, ward er enthauptet. Es war am siebenten Tage des Monats Däsius — sieben Tage vor den Juniiden würden die Römer sagen —, an einem Dienstage, als dieses erste Martyrium zu Cäsarea in Palästina stattfand. Danach ertrugen in derselben Stadt zahlreiche Bischöfe der benachbarten Kirchen freudigen Herzens furchtbare Martern und es war ein Schauspiel von gewaltigen Kämpfen, das sie damit den Zuschauern boten. Andere freilich verloren feige gleich den Mut und erlagen schon dem ersten Angriff. Die andern alle aber hatten verschiedene Arten von Martern zu erdulden, bald ungezählte Geißelstreiche, bald Folterung und Zerfleischung der Seiten und unerträgliche Fesselung, bei der ihnen sogar die Hände ausgerenkt wurden. Gleichwohl blieb ihnen auch noch ein Letztes nicht erspart, wie es ihnen nach Gottes unerforschlichen Ratschlüssen bestimmt war. Da ergriffen mehrere einen an beiden Händen, führten ihn zum Altar und ließen das verruchte und fluchwürdige Opfer von seiner rechten Hand herabgleiten; er wurde entlassen, wie wenn er geopfert hätte. Ein anderer hatte das Opfer nicht im geringsten berührt, konnte aber dennoch ruhig von dannen gehen, da einige erklärten, er habe geopfert. Wieder ein anderer wurde halbtot aufgehoben, sodann aber, wie wenn er schon ganz tot wäre, hingeworfen und von seinen Fesseln befreit, da er als einer von denjenigen betrachtet wurde, die geopfert hatten. Einer versicherte laut, er werde nicht gehorchen: allein man schlug ihn auf den Mund und die dazu Beauftragten boten alles auf, um ihn zum Schweigen zu bringen: er wurde gewaltsam hinausgestoßen, obwohl er nicht geopfert hatte. So galt ihnen durchweg schon der Schein viel, ihren Willen durchgesetzt zu haben.</p><p>So wurden aus ihrer so großen Zahl der Krone der heiligen Märtyrer nur zwei gewürdigt, Alpheus und Zachäus. Sie hatten bereits Geißelstreiche, Krallen, drückende Fesseln und die damit verbundenen Schmerzen, sowie verschiedene andere Foltern ertragen; dann wurden ihnen die Füße einen Tag und eine Nacht über vier Löcher des Strafholzes ausgespannt und schließlich wurden sie, als ob sie mit ihrem Bekenntnisse des einen Gottes und des einen Königs Christus Jesus eine Lästerung ausgesprochen hätten, ebenso wie der vorhergenannte Märtyrer enthauptet, am siebzehnten Tage des Monats Dios, der bei den Römern der fünfzehnte Tag vor den Dezemberkalenden ist.</p><h2>3</h2><p>Erwähnenswert ist auch, was am gleichen Tage mit Romanus in Antiochien geschah. Er stammte aus Palästina und war Diakon und Exorzist in der Kirche von Cäsarea. Er kam gerade zur Zeit der Zerstörung der Kirchen nach Antiochien. Als er dort im dichten Gedränge mehrere Männer zugleich mit Frauen und Kindern zu den Götterbildern treten und Opfer darbringen sah, meinte er diesen Anblick nicht ertragen zu können und im Eifer für den Glauben näherte er sich ihnen und wies sie mit lauter Stimme zurecht. Ob seiner Kühnheit gefangengesetzt, zeigte er sich als ein Zeuge der Wahrheit, so edel, wie nur überhaupt einer. Als der Richter über ihn den Tod durch das Feuer verhängte, nahm er das Urteil mit heiterem Angesicht und größter Fassung freudig auf und ließ sich abführen. Er wurde an den Pfahl gebunden. Um ihn war bereits das Holz aufgeschichtet, und diejenigen, welche den Scheiterhaufen in Brand stecken sollten, warteten nur noch auf die Weisung des anwesenden Kaisers, da rief er: „Wo bleibt das Feuer für mich?“ Auf diese Worte hin wurde er vor den Kaiser gerufen, um einer anderen neuen Bestrafung seiner Zunge unterworfen zu werden: er ertrug das Abschneiden derselben auf die mannhafteste Weise und ließ so alle durch die Tat erkennen, daß denjenigen, die irgend ein Ungemach für ihren Glauben ertragen müssen, eine göttliche Kraft zur Seite steht, die ihre Mühsale leichter macht und ihren Mut stärkt. Der Edle geriet nicht in Schrecken, als er von der neuen Art seiner Bestrafung gehört: er streckte ohne weiteres von selbst die Zunge heraus und bot sie bereitwilligst bequem zum Abschneiden dar. Nach dem Vollzug dieser Strafe wurde er in das Gefängnis geworfen und dort überaus lange gequält. Und als schließlich die Feier des zwanzigjährigen Regierungsjubiläums der Herrscher herannahte und infolge der dabei herkömmlichen Amnestie zu allen Gefangenen in den Kerkern weit und breit der Ruf der Freiheit drang, wurde Romanus allein, seine beiden Füße über fünf Löcher gespannt, auf dem Holze selbst noch liegend mit einem Stricke erdrosselt und so, wie er es ja ersehnt hatte, mit dem Martyrium geschmückt. Da Romanus aus Palästina stammte, ist er sicher den palästinensischen Märtyrern beizuzählen, obwohl er außerhalb des Landes litt. Das geschah in der geschilderten Weise im ersten Jahre, da die Verfolgung nur auf die Vorsteher der Kirche sich erstreckte.</p><h2>4</h2><p>Im Verlauf des zweiten Jahres entbrannte der Kampf gegen uns noch furchtbarer. Zu der Zeit, da Urbanus Statthalter der Provinz war, erging nämlich zum ersten Male ein Schreiben der Kaiser, „das den allgemein verpflichtenden Befehl enthielt: allenthalben haben alle Einwohner den Götterbildern Opfer und Trankspenden zu entrichten. Damals legte Timotheus in Gaza, einer Stadt in Palästina, durch seine Ausdauer in allen Leiden eine glänzende Probe von der Echtheit seines Glaubens an Gott ab und erlangte die Krone der Sieger in den heiligen Kämpfen für die Religion: nach zahllosen Folterqualen, die er erdulden mußte, wurde er einem kleinen und langsam brennenden Feuer übergeben. Gleichzeitig mit ihm bewährten auch Agapius und unsere Zeitgenossin Thekla edelste Standhaftigkeit: sie wurden verurteilt, den wilden Tieren zum Fraße vorgeworfen zu werden. Doch wen hätte nicht Staunen erfaßt, wenn er mit ansah, was weiter geschah, wen hätte es nicht bis in die Seele hinein ergriffen, wenn er auch nur davon gehört? Als nämlich die Heiden ein Volksfest und die dabei üblichen Schauspiele feierten, sprach man vielfach davon, daß außer denen, die sonst schon vor ihnen zu kämpfen hatten, auch die jüngst zu den wilden Tieren Verurteilten zum Kampf erscheinen würden. Als das Gerücht hiervon sich immer weiter verbreitete und mehr und mehr zu allen drang, banden sich sechs Jünglinge, um ihre völlige Bereitwilligkeit zum Martyrium auszudrücken, selbst die Hände, traten in raschem Schritte vor Urbanus, der eben zur Tierhetze gehen wollte und bekannten sich vor ihm als Christen. Ihr Aufnehmen eines Kampfes mit allen Schrecknissen zeigte es, daß diejenigen, welche sich des Glaubens an den Gott des Alls rühmen dürfen, auch vor den Angriffen von wilden Tieren kein Bangen empfinden. Der eine von ihnen hieß Timolaus und stammte aus dem Pontus, der zweite, aus Tripolis in Phönizien gebürtig, nannte sich Dionysius, der dritte von ihnen, mit Namen Romulus, war Subdiakon der Kirche in Diospolis; dazu kamen zwei Ägypter, Paesis und Alexander, und ein mit dem letzteren gleichnamiger Alexander von Gaza. Nicht gering war das Erstaunen, in das sie den Statthalter und seine Umgebung versetzten. Sofort wurden sie in das Gefängnis gebracht. Nachdem wenige Tage später ihnen zwei andere zugesellt worden waren — der eine, ebenfalls mit Namen Agapius, hatte schon vor ihnen ob seines wiederholten früheren Bekenntnisses schreckliche und mannigfache Foltern zu überstehen gehabt, der andere, der auch den Namen Dionysius trug, hatte ihnen das zum Lebensunterhalt Nötige gebracht —, wurden alle, jetzt acht an der Zahl, an einem Tage in Cäsarea enthauptet, am vierundzwanzigsten Tage des Monats Dystrus, das ist am neunten Tage vor den Aprilkalenden.</p><p>In dieser Zeit erfolgte der Rücktritt von den zwei Herrschern, des ersten unter allen und des zweiten nach ihm, in das Privatleben. Darunter fing auch das Staatswesen selbst zu leiden an; bald darauf ward das römische Reich selbst in sich gespalten, ein Krieg unter sich ließ die Herrscher nicht zur Versöhnung kommen, und die Uneinigkeit und die damit verbundenen Unruhen hörten nicht eher auf, als bis uns der Friede geschenkt wurde im ganzen römischen Weltreich. Denn sobald er allen gleich wie ein Licht in finsterer und dunkelvoller Nacht aufging, war auch sofort wieder der Staat der Römer fest und einig und friedlich, indem das alte gegenseitige gute Verhältnis, wie man es von den Vorfahren überkommen hatte, wiederkehrte. Doch davon werden wir seinerzeit bei der passenden Gelegenheit ausführlicher berichten. Für jetzt müssen wir zur weiteren Entwicklung der Dinge übergehen.</p><h2>5</h2><p>Um gleichsam allen die Beweise seines ihm angeborenen Gotteshasses und seiner Ruchlosigkeit vorzulegen, nahm Cäsar Maximin, der jetzt zur Herrschaft gelangte, in heftigerer Weise als die vorigen die Verfolgung gegen uns auf. Aber während nun alle nicht geringe Verwirrung erfaßte, die einen sich dahin, die andern dorthin zerstreuten und der Gefahr zu entgehen suchten und eine gewaltige Aufregung alles im Banne hielt, — wie könnte ein Wort genügen, um eine vollentsprechende Schilderung zu geben von der Gottesliebe und der Freimütigkeit in dem Bekenntnisse Gottes, wie sie eigen war dem seligen und wahrhaft einem schuldlosen Lamme vergleichbaren Märtyrer, den ich meine, Apphianus, in dem allen Bewohnern Cäsareas vor den Toren der Stadt ein wundervolles Beispiel des Glaubens an den einen Gott vor Augen geführt ward? Noch hatte er damals das zwanzigste Lebensjahr nicht erreicht. Er stammte von Eltern, welche große irdische Reichtümer ihr eigen nannten und so hatte er sich früher längere Zeit zum Studium der weltlichen Wissenschaften der Griechen in Berytus aufgehalten. Es wäre herrlich zu erzählen, wie er in dieser Stadt die Leidenschaften der Jugend überwand und weder durch die Jugendkraft seines Körpers noch durch die Gesellschaft seiner jugendlichen Genossen an seinem Charakter Schaden litt, wie er vielmehr die Mäßigung liebte, sich nach den Lehren des Christentums sittlich, ernst und fromm betrug und sein Leben danach gestaltete. Geziemend ist es, auch seiner Heimat zu gedenken und sie dadurch zu ehren, nachdem ein solch edler Kämpfer für den Gottesglauben aus ihr hervorgegangen, und man wird es berechtigt finden, wenn ich es tue. Wenn einer Gagä kennt, eine nicht unberühmte Stadt Lyciens, nun, aus ihr stammte der Jüngling. Nach der Rückkehr von seinen Studien in Berytus in die Heimat, wo sein Vater eben die erste Stellung bekleidete, vermochte er mit ihm und seinen Angehörigen nicht zusammenzuleben, weil sie nicht nach den Geboten des Christentums leben wollten. Er aber, von einem sozusagen göttlichen Geiste erfaßt, richtete in einer in gewissem Sinne schon in der Natur begründeten, noch mehr aber von Gott gegebenen wahren Philosophie seinen Sinn auf Größeres, als auf den angeblichen Ruhm der Welt, und verachtete das Genußleben des Leibes. So verließ er heimlich seine Familie, und völlig unbekümmert um seinen täglichen Lebensunterhalt, ließ er sich nur vom Vertrauen und Glauben an Gott leiten; und es war der Geist Gottes, der ihn nach Cäsarea führte, wo die Märtyrerkrone für den Glauben seiner harrte. Er wohnte mit uns selbst im Hause zusammen, vervollkommnete soweit als möglich seine Erkenntnis durch Reden über göttliche Dinge und bereitete sich eifrig durch aszetische Übungen darauf vor. Und wen hätte es nicht aufs tiefste ergriffen, der da sah, wie herrlich sich das Lebensende dieses Mannes gestaltete, und wen, der davon hörte, hätte nicht berechtigte Bewunderung überkommen über seine Unerschrockenheit, seine Freimütigkeit, seine Standhaftigkeit, vor allem aber über die Kühnheit seiner Tat selbst, die von einem Glaubenseifer und einer Geistesgröße zeugte, die wahrhaft übermenschlich sind? Im dritten Jahr der gegen uns gerichteten Verfolgung brach nämlich auf Veranlassung Maximins ein zweiter Sturm gegen uns los. Es erging damals zum erstenmal ein Schreiben des Tyrannen, die Beamten in den Städten hätten mit Eifer dafür zu sorgen, daß allenthalben alle ohne Umstände wenigstens einmal opfern. Infolge dessen riefen unter Hinweis auf den behördlichen Befehl Herolde Männer, Frauen und Kinder in die Göttertempel und außerdem forderten Chiliarchen nach einer Liste noch jeden einzelnen mit Namen hierzu auf. Unsagbar viel waren die Leiden, die allenthalben hereinbrachen. Da trat Apphianus, ohne daß jemand von seinem Vorhaben etwas ahnte, und ohne daß wir, die wir doch mit ihm in einem Hause wohnten, und ohne daß die ganze militärische Umgebung des Statthalters etwas davon bemerkte, zu Urbanus, der eben ein Trankopfer brachte, faßte ihn unerschrocken bei der rechten Hand und hinderte ihn ohne weiteres am Opfern. Und dringend bat und mahnte er ihn mit sozusagen göttlichem Ernste, doch abzulassen von seinem Wahne; unrecht sei es, den einen, allein wahren Gott zu verlassen und Göttern und Dämonen zu opfern. Es war wohl die göttliche Macht, die den Jüngling drängte, das zu wagen, eine göttliche Macht, die dadurch es geradezu deutlich kund tun wollte, daß Christen, die es wirklich sind, von dem Glauben an den Gott des Alls, den sie einmal durch Gottes Gnade empfangen, so wenig abfallen, daß sie im Gegenteil erhaben sind über alle Drohung und nachfolgende Strafe, ja sogar den Mut besitzen, in edler und furchtloser Sprache offen zu sprechen und wenn möglich, die Verfolger selbst zu mahnen, abzulassen von ihrem Irrtum und sich der Erkenntnis des einen Gottes zuzuwenden. Wie es sich nach einem solchen Wagnis erwarten ließ, wurde der genannte Bekenner sofort von der Umgebung des Statthalters wie ein wildes Tier gepackt und nach zahllosen Schlägen am ganzen Leibe, die er aufs mannhafteste ertrug, vorerst in das Gefängnis gebracht, wo er einen Tag und eine Nacht lang mit beiden Füßen in den Stock gelegt ward. Am folgenden Tage wurde er vor den Richter geführt. Er sollte zum Opfern gezwungen werden; nicht nur ein oder zweimal, sondern des öfterenmalen wurden ihm die Seiten bis auf die Knochen, ja bis auf die Eingeweide aufgerissen, und ins Angesicht und auf den Nacken erhielt er soviel Schläge, daß ihn in seinem aufgeschwollenen Angesichte selbst diejenigen, welche ihn früher ganz genau gekannt, nicht mehr zu erkennen vermochten. Aber er bewahrte inmitten der Foltern und furchtbaren Qualen völlig seine Standhaftigkeit. Und als er auch auf diese so großen Martern sich nicht fügte, mußten die Folterknechte seine Füße in leinene Tücher hüllen, die mit Öl getränkt waren, und dieselben anzünden. Wohl waren die Schmerzen unbeschreiblich, die der Selige dabei erdulden mußte; denn das Feuer verzehrte das Fleisch und drang bis auf die Knochen, so daß die Feuchtigkeit des Körpers wie Wachs schmolz und in Tropfen herabfloß. Allein auch jetzt wankte er nicht, und da die Gegner bereits unterlegen waren und sich von seiner übermenschlichen Standhaftigkeit geradezu besiegt erklären mußten, brachte man ihn ins Gefängnis zurück. Drei Tage später wurde er jedoch nochmals vor das Gericht gestellt; er wiederholte sein Bekenntnis und wurde, übrigens schon halbtot, in die Fluten des Meeres versenkt. Eine Erzählung der Ereignisse, wie sie unmittelbar darauf folgten, wird wahrscheinlich bei einem, der’s nicht mitangesehen, keinen Glauben finden. Aber trotzdem wir das sehr gut wissen, halten wir es doch für richtig, den Vorfall völlig wahrheitsgemäß in unser Geschichtswerk aufzunehmen, umsomehr, da ja auch, man darf ruhig sagen, alle Einwohner von Cäsarea Zeugen davon sind; denn bei diesem merkwürdigen Schauspiel fehlte kein Lebensalter. Kaum schien man den Heiligen und dreimal Seligen inmitten des Meeres in die unermeßlichen Tiefen versenkt zu haben, da ging auf einmal eine ungewöhnliche Bewegung und Erschütterung durch das Meer und die ganze Luft, so daß die Erde und die ganze Stadt davon erbebte. Und zugleich mit jenem auffallenden und plötzlichen Beben spülte das Meer den Leichnam des gottseligen Märtyrers, gleich als ob es ihn nicht zu behalten vermöchte, vor die Tore der Stadt. So schloß das Leben des herrlichen Apphianus ab, am zweiten Tag des Monats Xanthikus, das ist am vierten Tage vor den Nonen des April, an einem Rüsttage.</p><h2>6</h2><p>Zu derselben Zeit und in denselben Tagen mußte auch in Tyrus ein junger Mann, namens Ulpianus, schreckliche Mißhandlungen und fürchterliche Geißelungen ertragen und wurde sodann zugleich mit einem Hund und einer Aspis, der giftigen Schlange, in eine rohe Rindshaut eingenäht, in das Meer geworfen; aus diesem Grunde glaubten wir berechtigt zu sein — im Zusammenhang mit dem Martyrium des Apphianus — auch ihn zu erwähnen. Das Schicksal des Apphianus teilte bald darauf Ädesius, sein Bruder nicht nur im Herrn, sondern auch der leiblichen Abstammung nach: er hatte den gleichen Vater. Oftmals hatte er seinen Glauben bekannt, lange Zeit die Leiden des Kerkers getragen und war durch den Spruch des Statthalters in die Bergwerke von Palästina gesandt worden. Dabei hatte er allezeit in ärmlichem Philosophenmantel ein philosophisches Leben geführt. Schließlich kam er nach Alexandrien. Er sah, wie der dortige Richter Christen aburteilte und sie gegen alles Recht behandelte, wie er bald angesehene Männer verschiedenfach misshandelte, bald durchaus ehrbare Frauen und reine Jungfrauen Bordellhaltern zu schmachvoller Entehrung übergeben ließ. Und da ihn diese Dinge unerträglich schienen, wagte er die gleiche Tat wie sein Bruder. Festen Schrittes trat er vor den Richter und überhäufte ihn in Worten und Tätlichkeiten mit Schimpf und Schande. Die verschiedenen Folterqualen, die darauf über ihn verhängt wurden, ertrug er aufs mannhafteste und fand schließlich wie sein Bruder den Tod im Meere. Dieser Vorfall spielte in der geschilderten Weise, wie schon bemerkt, kurze Zeit später.</p><h2>7</h2><p>Im vierten Jahre der gegen uns gerichteten Verfolgung, zwölf Tage vor den Kalenden des Dezember, das ist am zwanzigsten Tage des Monats Dios, am Tage des Vorsabbats, fand in derselben Stadt Cäsarea das folgende Martyrium statt, daß es wirklich verdient erwähnt zu werden. Es war damals der Tyrann Maximin anwesend und gab dem Volke, um sich bei ihm beliebt zu machen, anläßlich seines Geburtstages Spiele. Und es war von jeher Sitte, die Spiele, bei denen der Kaiser zugegen war, für die Zuschauer großartiger zu gestalten als sonst, durch neue, fremdartige und ungewöhnliche Darbietungen, indem man Tiere aus Indien oder Äthiopien oder sonst woher bringen ließ oder indem Männer durch kunstvolle Leibesübungen den Zuschauern ein besonderes Vergnügen bereiteten. Und da ja der Kaiser die Spiele gab, so verlangte es der Ehrgeiz, daß auch jetzt etwas Großartiges und Ungewöhnliches geboten werde. Was war es? Ein Bekenner unseres Glaubens wurde vorgeführt, um öffentlich für die allein wahre Religion zu kämpfen: Agapius, von dem kurz vorher schon erwähnt wurde, daß er zugleich mit Thekla für die wilden Tiere zum Fraße bestimmt worden war. Er war auch sonst schon drei oder viermal mit Verbrechern im Zuge aus dem Gefängnisse in das Stadium geführt worden, aber immer wieder hatte es der Richter bei der Drohung bewenden lassen und ihn, sei es aus Mitleid, sei es in der Hoffnung, er werde in seinem Vorhaben noch wankend werden, für andere Kämpfe zurückgestellt. Jetzt in der Gegenwart des Kaisers wurde er vorgeführt. Es war, als ob er absichtlich für diesen Augenblick aufbewahrt worden wäre, damit auch an ihm in Erfüllung gehe das Wort des Heilandes, das derselbe zu seinen Jüngern in göttlichem Wissen vorhergesagt: „auch vor Könige würden sie geführt werden zum Zeugnisse für ihn“. Er wurde in die Mitte des Stadiums hereingeführt, zugleich mit einem Verbrecher, der, wie es hieß, der Tötung seines Herrn schuldig war. Und als der Mörder seines Herrn den wilden Tieren vorgeworfen wurde, fand er, geradezu wie jener Barrabas zur Zeit des Heilandes, Mitleid und Gnade und das Theater widerhallte von stürmischen Beifallsbezeigungen, als der Kaiser menschenfreundlich dem Mörder das Leben geschenkt und ihm Ehre und Freiheit wiedergegeben hatte. Den Kämpfer für das Christentum aber ließ der Tyrann zunächst vor sich rufen, verlangte von ihm die Verleugnung des Glaubens, wofür er ihm die Freiheit anbot. Agapius aber erklärte mit lauter Stimme, daß er nicht für eine schlechte Sache, sondern für den Glauben an den Schöpfer des Weltalls gerne und freudig alles ruhig ertragen wolle, was ihm auch bevorstehe. Und kaum hatte er es gesprochen, ließ er dem Worte die Tat folgen, ging in raschem Schritte geradewegs einer auf ihn losgelassenen Bärin entgegen und bot sich ihr willig zum Fraße dar. Noch atmend brachte man ihn in das Gefängnis zurück, wo er noch einen Tag lebte. Am nächsten Tage wurde er mit Steinen, die ihm an die Füße gebunden waren, mitten in das Meer versenkt. Das war das Martyrium des Agapius.</p><h2>8</h2><p>Die Verfolgung dauerte bereits ins fünfte Jahr hinein. Da trat am zweiten Tag des Monats Xanthikus, das ist am vierten Tage vor den Nonen des April, gerade am Sonntag der Auferstehung unseres Erlösers, wiederum in Cäsarea eine Jungfrau, die von Tyrus gebürtig war, Theodosia, ein gläubiges und überaus reines Mädchen von noch nicht achtzehn Jahren, zu einigen Gefangenen, die ebenfalls ihren Glauben an das Reich Christi bekannten und eben vor dem Gerichtsgebäude saßen, hinzu, um ihnen zusammen ihre Teilnahme auszudrücken, und sie, wie es ja natürlich ist, zu bitten, ihrer zu gedenken, wenn sie zum Herrn kämen. Als sie das getan, ergriffen sie die Soldaten, als ob sie ein schweres Verbrechen begangen hätte, und führten sie zum Statthalter. Dieser ließ sie in einer Art von Wahnsinn und tierischer Wut durch furchtbare schreckliche Folterungen an Seiten und Brüsten bis auf die Knochen zerfleischen, und als sie kaum noch lebte, aber gleichwohl alles mit freudestrahlendem Antlitz ertrug, in die Fluten des Meeres werfen. Danach wandte er sich zu den übrigen Bekennern und sandte sie alle zur Zwangsarbeit in den Erzbergwerken in Phäno in Palästina. Außerdem verurteilte derselbe Statthalter am fünften Tage des Monats Dios — bei den Römern als Novembernonen bezeichnet — in der gleichen Stadt den Silvanus — er war damals, als er Bekenner wurde, noch Priester, erhielt aber bald darauf das Amt eines Bischofes und starb als Märtyrer — mit seinen Gefährten ob ihrer glänzenden Standhaftigkeit, die sie für ihren Glauben an den Tag gelegt, zur Arbeit im gleichen Erzbergwerk, nachdem er ihnen vorher durch Brenneisen die Fußgelenke hatte unbrauchbar machen lassen. Gleichzeitig mit dem Urteil über sie verhängte er den Feuertod über einen Mann, der schon bei zahllosen andern Gelegenheiten seinen Glauben bekannt hatte, Domninus war es, der wegen seines ungewöhnlichen Freimutes in ganz Palästina berühmt war. Geradezu ein furchtbarer Erfinder von Bosheit, griff dieser Richter zu neuen Mitteln zur Bekämpfung des Christentums und wußte Strafen in Anwendung zu bringen, wie sie bis jetzt gegen die Bekenner Gottes gar nicht erhört worden waren. Drei verurteilte er zum Faustkampfe, Auxentius, einen ehrwürdigen und heiligmäßigen Priester, ließ er den wilden Tieren zum Fraße vorwerfen, wieder andere, Männer in vollster Kraft, ließ er entmannen und verurteilte sie zur Arbeit in den Bergwerken, und wieder andere ließ er schrecklich foltern und sodann in das Gefängnis werfen. Unter den letzteren war auch Pamphilus, der mir teuerste aller meiner Freunde, ein Mann, der von allen Märtyrern unserer Tage derjenige war, der ob seiner vollendeten Tugendhaftigkeit die höchste Verehrung genoß. Ihn ließ Urbanus zuerst eine Probe seiner Beredsamkeit und seiner philosophischen Kenntnisse ablegen und suchte ihn sodann zum Opfern zu bestimmen. Als er aber sehen mußte, daß Pamphilus es ablehnte und auch seine Drohungen völlig unbeachtet ließ, faßte ihn zuletzt die Wut und er befahl, ihn mit noch grausameren Foltern zu quälen. Mehr Tier als Mensch sättigte er sich geradezu an langdauernden Zerfleischungen seiner Seiten mit scharfen Krallen, bedeckte sich freilich dabei nur selbst in den Augen aller mit Schmach; sodann ließ er ihn zu den andern Bekennern ins Gefängnis bringen. Die Strafe aber, die Urbanus für seine Grausamkeit gegen die Heiligen dereinst von der göttlichen Gerechtigkeit empfangen wird, er, der so sehr die Bekenner Christi mißhandelt, läßt sich leicht ermessen: denn sie hatte schon hienieden ein Vorspiel, indem die göttliche Gerechtigkeit ihn bald nach seinem frechen Vorgehen gegen Pamphilus noch zu der Zeit, da er Statthalter war, ereilte. Gestern noch hatte er vom hohen Richterstuhle aus Recht gesprochen, hatte eine militärische Bedeckung um sich gehabt, hatte über das ganze Volk Palästinas geherrscht, hatte mit dem Tyrannen selbst als sein bester Freund und Tischgenosse verkehrt, da nahm sie mit einem Schlage in einer Nacht ihm alles, entzog ihm seine hohen Würden, überhäufte ihn mit Schmach und Schande vor denen, die ihm dereinst als Statthalter gehuldigt und ließ ihn vor dem Volke, über das er geherrscht, als einen unmännlichen Feigling erscheinen, der wie ein Weib laut um Hilfe bettelte. Und in Maximin, von dem er sich dereinst gebrüstet, daß er ihn um seines Vorgehens gegen uns besonders schätze, bestimmte sie ihm in derselben Stadt Cäsarea einen unerbittlichen und höchst grausamen Richter: er verurteilte ihn zum Tode, nachdem noch viel Schande über ihn gekommen wegen der Verbrechen, deren er überführt ward. Doch sei das nur im Vorübergehen erwähnt; möge einmal Zeit und Gelegenheit kommen, da wir mit Muße ausführlich die letzten Schicksale und das Lebensende der Gottlosen schildern können, die so sehr gegen uns gekämpft, des Maximinus selbst und seiner Genossen.</p><h2>9</h2><p>Es war das sechste Jahr, seit ununterbrochen der Sturm gegen uns tobte. Schon länger schloß das Bergwerk in der Thebais, das seinen Namen nach dem Porphyr trägt, den es zutage fördert, eine außerordentlich große Zahl von Bekennern des Gottesglaubens in sich. Von ihnen wurden nun siebenundneunzig Männer mit Frauen und noch ganz kleinen Kindern an den Statthalter von Palästina gesandt. In der Stadt der Juden legten sie das Bekenntnis ab für den Gott des Alls und für Christus; dafür ließ ihnen der als Nachfolger des Urbanus dorthin entsandte Statthalter Firmilianus, vorgeblich im Auftrage des Kaisers, das Kniegelenk des linken Fußes mitsamt den Sehnen mit Brenneisen durchschneiden und außerdem das rechte Auge mitsamt dem Häutchen und der Pupille mit dem Schwerte ausstechen, darauf vollständig bis auf die Wurzeln mit glühenden Eisen ausbrennen und so unbrauchbar machen. Sodann sandte er sie in die Bergwerke der Provinz, um sie dort in Arbeit und Not verkommen zu lassen. Und nicht allein sie, auch die Palästinenser mußte man solches leiden sehen, die, wie kurz vorher bemerkt, zum Faustkampf verurteilt worden waren. Da sie weder die Speisen aus der kaiserlichen Kammer kosteten, noch den für den Faustkampf notwendigen Vorübungen sich unterzogen, mußten sie nicht nur vor den Aufsehern und Prokuratoren, sondern auch vor Maximinus selbst erscheinen. Allein sie ertrugen Hunger und duldeten Geißelstreiche und bewährten aufs herrlichste ihre Standhaftigkeit im Bekenntnisse. Sie teilten das Geschick der schon Genannten, gemeinsam mit einigen anderen Bekennern aus Cäsarea selbst, die ihnen beigesellt wurden. Und gleich nach ihnen hatten einige, die in der Stadt Gaza bei der Lektüre der heiligen Schriften betroffen worden waren, teils die gleichen Verstümmelungen an Füßen und Augen zu leiden wie die Erstgenannten, teils sogar noch größere, indem ihnen in der schrecklichsten Weise durch Folterwerkzeuge die Seiten aufgerissen wurden. Eine von ihnen, dem Leibe nach ein Weib, dem Mute nach ein Mann, vermochte die Drohung der Entehrung nicht zu ertragen und ließ eine harte Bemerkung gegen den Tyrannen fallen, daß er das Amt in die Hände von solch rohen Richtern gelegt: sie wurde zuerst gepeitscht, dann auf das Folterholz gehoben und an den Seiten zerfleischt. Als nun die Henker nach dem Befehl des Richters lange Zeit die furchtbare Folterung fortsetzten, brachte es eine andere, die gleich der ersten das Gelübde der Jungfräulichkeit auf sich genommen, nicht mehr über sich, das erbarmungslose, rohe und unmenschliche Tun mitanzusehen. In ihrem anscheinend völlig schwachen Körper und unscheinbaren Äußern lebte eine starke Seele und ein den Körper überragender Geist. Kühner noch als die berühmten von den Hellenen gefeierten Kämpfer für Freiheit rief sie mitten aus der Menge heraus den Richter an: „Wie lange noch marterst du so grausam meine Schwester?“ Dadurch noch mehr gereizt, ließ der Richter das Mädchen sofort ergreifen. Man schleppte sie vor ihn. Und als sie den erhabenen Namen des Heilandes bekannt, suchte man sie zuerst durch Zureden zum Opfern zu bestimmen, und als sie nicht Folge leistete, ward sie gewaltsam zum Altar geschleift. Unsere Schwester aber blieb ruhig und bewahrte die zuerst gezeigte Entschlossenheit. Furchtlos und mutig streckte sie ihren Fuß gegen den Altar aus und stieß ihn um mitsamt dem Feuer, das darauf loderte. Da geriet der Richter in Wut wie ein wildes Tier; sofort ließ er ihr noch mehr als allen durch eiserne Krallen die Seiten zerreißen, gleich als ob er sich geradezu sättigen wollte an ihrem blutenden Fleische. Und als ihn endlich doch Ekel an seinem wahnsinnigen Tun erfaßte, ließ er beide zusammen binden, die letztgenannte mit der andern, die sie Schwester genannt hatte, und verurteilte sie zum Feuertode. Die erstere soll aus dem Gebiet der Stadt Gaza stammen; die letztere aber, muß man wissen, stammte aus Cäsarea; viele haben sie gekannt; ihr Name war Valentina. Und wie könnte ich sodann das Martyrium würdig schildern, mit dem der dreimal selige Paulus begnadet ward? Er wurde in der gleichen Stunde und unter dem gleichen Richterspruch verurteilt, wie die beiden Jungfrauen, bat aber noch bei der Hinrichtung den Henker, der schon zum Schlage ausholen wollte, ihm eine kurze Frist zu gewähren. Und als sie ihm gegeben worden, begann er mit klarer und vernehmbarer Stimme Gott im Gebete um Gnade anzuflehen; zunächst betete er für die Glaubensgenossen, auf daß ihnen bald Freiheit geschenkt werde; dann betete er für die Juden um Bekehrung zu Gott durch Christus; und er betete weiter um das gleiche für die Samariter; und er betete, es möchten auch die Heiden, die noch im Irrtum und in Unwissenheit von Gott dahin leben, zu seiner Erkenntnis gelangen und die wahre Religion annehmen; und er vergaß dabei auch die Volksmenge nicht, die bunt zusammengewürfelt um ihn stand. Nach all diesen betete er auch — welch ein unendlicher Reichtum von Liebe liegt darin! — für den Richter, der das Todesurteil gesprochen, für die über alle gesetzten Herrscher, und schließlich noch für den Henker, der ihm gleich das Haupt abschlagen sollte, so daß dieser selbst und alle Anwesenden es hörten, aufs innigste zum Gott des Alls, es möge ihnen das, was sie ihm angetan, in keiner Weise angerechnet werden. So und ähnlich betete er mit lauter Stimme und rührte dadurch geradezu alle in der Empfindung, daß er zu Unrecht den Tod erleiden müsse, zu Tränen des Mitleids. Er aber machte sich so, wie es Vorschrift war, bereit, bot seinen entblößten Nacken dem Schwerte dar und wurde so mit dem Martyrium für Gott gekrönt, am fünfundzwanzigsten Tage des Monats Panemos, das ist am achten Tage vor den Kalenden des August. Das war der Tod, der den Genannten beschieden war. Nicht lange nachher wurden abermals aus Ägypten einhundertdreißig bewundernswerte Kämpfer für den Glauben an Christus, die schon in Ägypten auf Befehl des Maximian die gleichen Martern wie die vorgenannten an den Augen und den Füßen durchgemacht, teils den Genannten zugesellt, die in den Bergwerken von Palästina arbeiteten, teils denen, die in die Bergwerke von Cilicien verurteilt worden waren.</p><h2>10</h2><p>Schon war nach so vielen Großtaten der edlen Märtyrer Christi die Glut der Verfolgung schwächer geworden und gleichsam durch ihr heiliges Blut gelöscht; schon war auch denen, die in der Thebais um Christi willen in den dortigen Bergwerken arbeiten mußten, Erleichterung und Freiheit gewährt worden; schon begannen wir ein wenig aufzuatmen in freier Luft, — da entbrannte der Haß des Mannes, der die Macht zur Verfolgung überkommen, aus irgend einer Veranlassung, ich weiß nicht wie es kam, aufs neue gegen uns. Auf einmal gingen wiederum überall Edikte des Maximin gegen uns durchs Land und die Statthalter in seiner Präfektur und der Praefectus praetorio trieben noch durch Bekanntmachungen, Schreiben und öffentliche Erlasse in allen Städten die Logisten und mit ihnen die Strategen und Tabularier an, das kaiserliche Edikt zur Ausführung zu bringen, das da bestimmte: Es seien mit allem Eifer die verfallenen Göttertempel wieder aufzubauen und es sei dafür Sorge zu tragen, daß allenthalben alles, Männer mit Frauen und Gesinde, ja mit den Kindern an der Mutterbrust, Rauch- und Trankopfer bringe und gewissenhaft von den Opfergaben koste; alle Waren auf dem Markte seien mit Opferwein zu besprengen und vor den Bädern seien Wärter aufzustellen, um also diejenigen, die dort sich reinigten, durch die ruchlosen Götteropfer zu beschmutzen. Infolge der Durchführung dieser Bestimmungen erfaßte die Unsrigen begreiflicherweise von neuem große Besorgnis. Aber auch die unserm Glauben ferne stehenden Heiden tadelten dieses ungewöhnliche Vorgehen als drückend und sogar maßlos. Denn auch ihnen schien es abscheulich und töricht zu sein. Ein gewaltiger Sturm erhob sich allenthalben gegen uns alle. Doch da hauchte die göttliche Kraft unseres Erlösers wiederum denen, die für sie kämpften, solchen Mut ein, daß sie, ohne von jemand hierzu veranlaßt oder gedrängt zu sein, die Drohungen der so Mächtigen verachteten. Einst opferte der Statthalter den Göttern, da scharten sich plötzlich drei Männer aus der Zahl der Gläubigen zusammen, stürmten auf ihn los und riefen ihm zu, abzulassen von seinem irrigen Tun: denn es gebe keinen andern Gott als den Schöpfer und Bildner des Weltalls. Auf die Frage, wer sie seien, bekannten sie sich mutig als Christen. Darüber noch mehr gereizt, ließ sie Firmilian sofort, ohne die Folter an ihnen zur Anwendung zu bringen, zur Enthauptung abführen. Der eine von ihnen mit Namen Antoninus war schon älter, der zweite hieß Zebinas und stammte aus Eleutheropolis, und der dritte führte den Namen Germanus. Ihre Hinrichtung fand am dreizehnten des Monats Dios, an den Iden des November, statt. Am gleichen Tage wie sie schied ein Weib aus der Welt, Ennathas, von Skythopolis gebürtig, ebenfalls mit der Binde der Jungfrau geschmückt. Sie hatte nicht das gleiche getan, war vielmehr mit Gewalt fortgeschleppt und vor den Richter gebracht worden, nachdem sie schon vorher Geißelung und brutale Gewalttätigkeit über sich hatte ergehen lassen müssen. Einer von den Chiliarchen, der in ihrer Nähe gestanden war, hatte sich erfrecht, sie ihr anzutun, noch dazu ohne Ermächtigung von Seiten der vorgesetzen Behörde, ein Mann, Maxys mit Namen, aber noch schlimmer als der Name sagt, überhaupt frevelhaft, seiner äußeren Erscheinung nach auffallend stark, seines ganzen Wesen nach brutal und deshalb bei allen, die ihn kannten, verrufen. Er fand seine Freude daran, die Selige völlig entkleidet, so daß sie nur noch von den Hüften bis zu den Füßen eine Bedeckung trug, sonst aber am ganzen Körper nackt war, in der ganzen Stadt Cäsarea umherführen, über alle Hauptplätze schleppen und dazu mit Riemen peitschen zu lassen. Nach so vielen Leiden zeigte sie ihre heldenmütige Standhaftigkeit auch vor dem Richterstuhl des Statthalters. Der Richter ließ sie lebendig verbrennen. Die Wut dieses Mannes gegen die Christen steigerte sich bis zur Unmenschlichkeit. Nicht einmal die Gesetze der Natur achtete er und schämte sich nicht, dem entseelten Leibe der heiligen Männer das Begräbnis zu verweigern. So ließ er die Toten unter freiem Himmel den wilden Tieren zum Fraße vorwerfen und deshalb Tag und Nacht sorgfältig bewachen. Und tatsächlich konnte man mehrere Tage lang eine ziemliche Anzahl von Männern sehen, die sich zur Ausführung dieses tierischen und barbarischen Befehles hergaben. Sie standen, wie wenn’s eine Sache wäre, die ihre Sorgfalt verdiente, in einer gewissen Entfernung Wache, damit die Leichname nicht gestohlen würden; wilde Tiere, und Hunde und fleischfressende Vögel verschleppten die menschlichen Gebeine dahin und dorthin, und die ganze Umgebung der Stadt war mit menschlichen Eingeweiden und Knochen bestreut, so daß auch all denen, die uns sonst feindlich gegenüber gestanden waren, nie etwas so schrecklich und grauenhaft vorgekommen war. Sie bedauerten dabei nicht so fast das Unglück derer, denen solches widerfahren war, als den Frevel an ihrer eigenen und der allen gemeinsamen Natur, der darin lag. Denn ganz nahe an den Toren der Stadt bot sich ein Schauspiel, das alles übertrifft, was man beschreiben oder aus dem Munde eines Tragikers hören kann: Das Fleisch von Menschen wurde nicht nur an einem Orte verzehrt, sondern überall hin zerstreut; ja einige behaupteten, auch innerhalb der Tore ganze Knochen und Fleischstücke und Teile von Eingeweiden gesehen zu haben. Das dauerte mehrere Tage so fort, als sich ein merkwürdiges Vorkommnis ereignete. Die Luft war heiter und klar und herrlichstes Wetter am ganzen Himmel. Da fingen auf einmal die meisten Säulen in der Stadt, welche die öffentlichen Hallen trugen, an, Tropfen wie Tränen zu vergießen, und die Plätze und Straßen waren, ohne daß ein Tropfen Regen vom Himmel gefallen wäre, ich weiß nicht woher, von Wasser besprengt und durchnäßt. Allgemein verbreitete sich infolgedessen das Gerücht, die Erde habe auf geheimnisvolle Art Tränen vergossen, weil sie die Pietätlosigkeit jener Vorkommnisse nicht mehr zu ertragen vermochte, und zur Beschämung der gefühllosen und mitleidslosen Natur von Menschen hätten Steine und die unbelebte Materie über das Geschehene geweint. Wohl weiß ich, daß dieser Bericht unsern Nachkommen vielleicht als Gerede und Fabel erscheinen wird, aber nicht ist er’s denen, die damals Gelegenheit hatten, sich von der Wahrheit zu überzeugen.</p><p>Als zweiter nach Pamphilus schritt zum Kampfe Valens, ein Diakon aus Älia, mit ehrwürdigen grauen Haaren, schon dem Äußern nach ein verehrungswürdiger Greis. Die göttlichen Schriften kannte er wie kaum ein anderer. Er hatte sich soviel von ihnen dem Gedächtnisse eingeprägt, daß er die Handschriften nicht nachzusehen brauchte, welche Stellen auch immer er von der Schrift, die er gerade anzog, zitierte. Als dritter unter ihnen war zu bemerken Paulus aus der Stadt Jamnia, ein kühner Feuergeist, der schon vor seinem Martyrium Brennung mit glühenden Eisen ertragen und so den Bekenntniskampf gekämpft hatte. Die Genannten hatten bereits zwei volle Jahre im Gefängnisse zugebracht, als eine neuerliche Ankunft von Brüdern aus Ägypten, welche mit ihnen den Martertod finden sollten, Anlaß zu ihrem eigenen Martyrium gab. Diese hatten nämlich die nach Cilicien verwiesenen Bekenner bis vor die dortigen Erzbergwerke begleitet und waren nun auf dem Heimwege. Ähnlich wie die früher Erwähnten wurden auch sie schon an den Toreingängen der Stadt Cäsarea von den Wachen befragt, wer sie seien und woher sie kämen, und als sie nichts von der Wahrheit verschwiegen, wie auf frischer Tat ertappte Verbrecher festgenommen. Es waren ihrer fünf an der Zahl. Als sie auch vor dem Tyrannen, vor den sie geführt wurden, ein freimütiges Geständnis abgelegt hatten, wurden sie sofort in das Gefängnis geworfen. Am folgenden Tage, am sechzehnten des Monats Peritios führte man sie auf Befehl zugleich mit Pamphilus und seinen genannten Gefährten vor den Richter. Zuerst waren es die Ägypter, deren unüberwindliche Standhaftigkeit er durch mannigfache Arten von Martern und durch Ersinnung von neuen und verschiedenartigen Folterungsmitteln auf die Probe stellte. Als er den Wortführer von allen die Probekämpfe hatte ausfechten lassen, fragte er ihn zunächst, wer er sei, bekam aber statt des eigentlichen Namens einen Prophetennamen zu hören; — und das geschah von Seiten aller, weil sie an Stelle der ihnen von den Eltern gegebenen Namen, die vielleicht mit dem Götzendienst zusammenhingen, sich diese beigelegt hatten. So konnte man hören, wie sie sich Elias und Jeremias und Isaias und Samuel und Daniel nannten und sich demgemäß nicht bloß durch die Tat, sondern auch durch das Tragen entsprechender Namen als „den Juden im Geiste“, also „einen echten und unverfälschten Israeliten Gottes“ zu erkennen gaben —. Firmilianus, der von dem Märtyrer diesen Namen hörte, die Bedeutung des Wortes aber nicht verstand, fragte weiter, welches denn seine Vaterstadt sei. Und abermals gab der Märtyrer eine Antwort, die zur vorigen paßte: er erklärte, Jerusalem sei seine Heimat. Er dachte dabei an jenes Jerusalem, von dem bei Paulus die Rede ist: „Das Jerusalem, das oben ist, ist die Freie und sie ist unsere Mutter“ und „Ihr seid hinzugetreten zum Berge Sion, zur Stadt des lebendigen Gottes, zum himmlischen Jerusalem“. Das meinte er. Der Richter aber dachte an eine Stadt auf der Erde, die auf dem Boden stehe und gab sich viele Mühe zu ermitteln, was das für eine Stadt sei und wo sie liege, und griff dann auch zu Foltern, damit er die Wahrheit gestehe. Aber obwohl dem Märtyrer die Hände rückwärts ausgerenkt und die Füße in bestimmte neue Maschinen gepreßt wurden, blieb er dabei, die Wahrheit gesagt zu haben. Und als der Richter zu wiederholten Malen fragte, was das für eine Stadt sei, von der er rede, und wo sie liege, erklärte er immer wieder, sie sei nur die Heimat der Christen; niemand anderer als sie allein hätte ein Recht darauf und sie liege im Osten, gegen Sonnenaufgang zu. So philosophierte er nach seinen Ideen fort, ohne nur irgendwie auf die Leute rings um sich zu achten, die ihn mit Foltern quälten; er schien von den Schmerzen gar nichts zu fühlen, wie wenn er kein Fleisch, überhaupt keinen Körper hätte. Der Richter aber in seiner Verlegenheit wurde ungeduldig, weil er glaubte, die Christen hätten jedenfalls irgendwo eine den Römern feindliche Stadt gegründet, und gab sich alle Mühe, sie zu erfragen und das genannte Land im Osten ausfindig zu machen. Allein trotzdem er den jungen Mann mit Geißeln blutig schlagen und mit allen möglichen Arten von Foltern quälen ließ, mußte er sehen, daß derselbe unabänderlich auf seiner früheren Aussage bestehen blieb, und verurteilte ihn deshalb zum Tode durch Enthauptung. Soviel Dramatik hatte das Martyrium dieses Bekenners gehabt. Die übrigen ließ er ähnliche Kämpfe bestehen und sie auf die gleiche Weise töten. Er war der Sache müde geworden und hatte in der Erkenntnis, daß die Männer nur erfolglos gemartert würden, auf die Erfüllung seines Wunsches verzichtet. Sodann wandte er sich an Pamphilus und seine Gefährten. Und da er erfahren hatte, daß sie ihre unüberwindliche Hingabe für den Glauben bereits im Foltern bewiesen hatten, fragte er sie nur, ob sie wenigstens jetzt noch gehorchen wollten. Allein er erhielt von einem jeden von ihnen nur die frühere Erklärung des Bekenntnisses, wie er es während des Martyriums abgelegt, und verhängte infolgedessen über sie die gleiche Strafe wie über die vorigen. Als sie dessenthalben abgeführt waren, verlangte ein junger Mann von der häuslichen Dienerschaft des Pamphilus, der wie ein rechtmäßiger Sohn bei dem so großen Manne Erziehung und Bildung genossen hatte, sobald er das Urteil über seinen Herrn erfuhr, mitten aus der Volksmenge heraus mit lauter Stimme, daß ihr Leib der Erde übergeben würde. Der Richter, kein Mensch, sondern ein Tier, ja wilder als ein Tier, erkannte weder die Berechtigung der Bitte an, noch übte er an dem Jüngling um seines Alters willen Nachsicht, sondern wie er auf seine Frage nur hörte, daß er sich als Christ bekenne, fuhr er, wie von einem Pfeil getroffen, in wildem Zorne auf, und befahl den Folterknechten, ihre ganze Kraft an ihm zu gebrauchen. Und wie er sah, daß er auf seinen Befehl zu opfern sich dessen weigerte, ließ er ihn, als ob es sich nicht um das Fleisch eines Menschen handle, sondern um Stein oder Holz oder sonst ein lebloses Ding, bis auf die Knochen und bis auf die tief und verborgen liegenden Eingeweide unausgesetzt zerfleischen. Trotzdem dies lange Zeit fortgesetzt wurde, mußte er schließlich das Vergebliche seiner Versuche einsehen; denn der Körper des Jünglings, der durch die Folterungen förmlich zermalmt war, blieb ohne einen Laut und ohne eine Regung des Schmerzes, fast möchte man sagen, völlig ohne Leben. Freilich, er verharrte in seiner unmenschlichen Unbarmherzigkeit und ließ den Jüngling sofort, wie er war, einem weit ausgedehnten Feuer übergeben. Und so erlangte er, der zuletzt zum Martyrium gekommen, die Erlösung vom Leibe noch vor der Vollendung seines Herrn dem Fleische nach, weil diejenigen, die sich mit den ersteren zu beschäftigen hatten, immer noch zögerten. Da konnte man nun den Porphyrius sehen, wie er nach Art eines Siegers, der in allen heiligen Kämpfen den Siegespreis sich errungen, bestaubt den Körper, strahlend das Antlitz, nach solchen Kämpfen mutigen und freudigen Sinnes den Weg zum Tode schritt, wahrhaftig voll des göttlichen Geistes, nach Philosophenart nur mit dem Mantel bekleidet, den er wie eine Exomis umgeworfen trug. Man konnte ihn sehen, wie er mit Ruhe und Überlegung seinen Bekannten noch für das, was er wünschte, Aufträge gab, und ihnen zuwinkte; wie er selbst am Pfahle noch die Heiterkeit seines Antlitzes bewahrte, ja als der in einer großen Entfernung rings um ihn errichtete Holzstoß von außen in Brand gesteckt worden war, bald von dieser, bald von jener Seite die Lohe mit dem Munde einzuziehen suchte und aufs mutigste bis zum letzten Atemzuge in Stillschweigen verharrte. Nur einen einzigen Laut hatte er noch ausgestoßen, als die Flamme ihn faßte: er hatte Jesus, den Sohn Gottes, um Beistand angefleht. Das war das Martyrium des Porphyrius. Derjenige, der die Nachricht von seinem Tode dem Pamphilus übermittelte, Seleukus, ein Bekenner aus dem Heere, wurde als Überbringer einer solcher Nachricht sofort des gleichen Loses gewürdigt wie sie. Denn kaum hatte er den Tod des Porphyrius gemeldet und einen der Märtyrer mit einem Kusse begrüßt, als ihn Soldaten ergriffen und vor den Statthalter führten. Und dieser ließ ihn sofort enthaupten, gleich als ob er ihn drängen wollte, die vorigen noch auf ihrer Fahrt in den Himmel zu begleiten. Er stammte aus dem Lande der Kappadozier und hatte es unter der auserlesenen Jungmannschaft im Heere und unter denen, die römische Grade bekleideten, zu nicht geringem Range gebracht. An körperlicher Jugendkraft, an Größe und Stärke übertraf er bei weitem alle seine Mitsoldaten, so daß schon sein Äußeres allgemeines Staunen hervorrief und seine ganze Gestalt um ihrer Größe und Schönheit willen verdiente Bewunderung fand. Er hatte sich bereits bei Beginn der Verfolgung in den Kämpfen um das Bekenntnis ausgezeichnet, indem er Geißelungen ertrug, hatte dann nach seinem Ausscheiden aus dem Heeresdienst sich der Nachfolge derer gewidmet, die den Übungen der christlichen Religion lebten, und sich wie ein Vater und Vormund als Hort und Helfer von verlassenen Waisen, hilflosen Witwen und der in Not und Elend Schmachtenden erwiesen. Begreiflich, daß er von dem Gotte, der an solchen Dingen ein größeres Wohlgefallen hat als an dem Duft und Blut der Schlachtopfer, der wunderbaren Berufung zum Martyrium gewürdigt ward. Als zehnter Kämpfer starb er mit den Vorgenannten an einem und demselben Tag, an dem, wie es scheint, durch das Martyrium des Pamphilus, entsprechend dem Verdienste dieses Mannes, ein sehr großes Tor geöffnet und so der Zugang zur Pforte des Himmelreiches ihm und damit auch andern leicht geworden war. Dem Seleukus auf dem Fuße folgte Theodulus, ein ehrwürdiger und frommer Greis, einer von den Dienern des Statthalters, den Firmilian höher als alle im Hause geschätzt hatte, teils wegen seines Alters und deshalb, weil er Vater dreier Generationen war, teils wegen der Anhänglichkeit und treuen Gesinnung, die er ihnen bewahrt. Er tat das gleiche wie Seleukus und wurde deshalb vor seinen Herrn geführt; und da er diesen noch mehr als die Vorausgehenden in Zorn brachte, mußte er das Martyrium des Leidens des Erlösers auf sich nehmen: er wurde an das Kreuz geschlagen. Als danach noch einer fehlte, um bei den genannten Märtyrern die Zwölfzahl vollzumachen, da war es Julianus, der sie ergänzen sollte. Er war eben von einer Reise heimgekehrt und hatte die Stadt noch nicht betreten, als er sogleich, wie er noch vom Wege her war, von den Vorgängen Kunde erhielt und hineilte, um die Märtyrer zu sehen; und wie er die Leiber der Heiligen auf der Erde liegen sah, umfaßte er voll Freude jeden von ihnen und küßte sie alle. Während dieses Tuns ergriffen ihn die Henker und führten ihn vor Firmilianus. Und dieser blieb sich in seinem Verfahren getreu und ließ auch ihn einem weit ausgedehnten Feuer übergeben. Und so wurde auch Julianus der Krone der Märtyrer gewürdigt: vor Freude hüpfte und sprang er und dankte mit lauter Stimme dem Herrn für die so große Gnade. Auch er war seiner leiblichen Abstammung nach Kappadozier, seinem Charakter nach außerordentlich fromm, treu und wahr, dabei auch eifrig in allen andern Dingen; ein Hauch des Heiligen Geistes ging von ihm aus. So geartet war die Schar der Gefährten, die da gewürdigt wurden, zugleich mit Pamphilus zum Martyrium einzugehen. Vier Tage und ebensoviel Nächte wurden auf Befehl des gottlosen Statthalters die gottgeweihten und wirklich heiligen Leiber den Tieren zum Fraße vorgeworfen; aber merkwürdig, kein wildes Tier, kein Vogel, kein Hund machte sich an sie heran; unversehrt nach Anordnung der göttlichen Vorsehung, wurden sie weggebracht, erhielten die ihnen gebührende Bestattung und wurden an dem gewöhnlichen Begräbnisplatze beigesetzt. Noch wurde der Eindruck, den ihr Geschick gemacht, in aller Leute Mund besprochen, als Adrianus und Eubulus, von einem Orte, der Batanäa heißt, zu den noch übrigen Bekennern in Cäsarea kamen; am Tore wurden sie ebenfalls nach der Veranlassung ihres Kommens gefragt; als sie die Wahrheit gestanden, wurden sie vor Firmilianus geführt. Und dieser verhängte über sie verschiedene Folterungen an den Seiten und verurteilte sie wieder nach seiner Art ohne jeden Aufschub zu den wilden Tieren. Nach zwei Tagen wurde Adrianus am fünften Tage des Monats Dystrus, am dritten Tage vor den Nonen des März, am Geburtsfeste der in Cäsarea nach altem Herkommen verehrten Tyche, einem Löwen vorgeworfen und fand danach durch Enthauptung mit dem Schwerte seine Vollendung. Zwei Tage später, an den Nonen selbst, also am siebenten Tage des Monats Dystrus, wurde Eubulus den wilden Tieren vorgeworfen und dann ebenso wie sein Vorgänger enthauptet. Der Richter hatte gar sehr in ihn gedrungen, zu opfern und sich dadurch die Freiheit, die sie meinen, zu gewinnen Er aber zog den herrlichen Tod für den Glauben dem vergänglichen Leben vor. Als letzter der Märtyrer in Cäsarea drückte er den Kämpfern das Siegel auf. Als erwähnenswert ist hier noch anzuführen, daß, als bald darauf die Strafe der göttlichen Vorsehung mit den Tyrannen selbst die gottlosen Statthalter traf, mit den andern auch derjenige, der die Märtyrer Christi so schlimm behandelt hatte, Firmilianus, die Todesstrafe erlitt und durch das Schwert sein Leben endete. So verliefen die Martyrien, die in Cäsarea während der ganzen Zeit der Verfolgung sich abgespielt.</p><h2>11</h2><p>Das siebente Jahr des gegen uns gerichteten Kampfes ging zu Ende. Unsere Verhältnisse waren allmählich infolge der gewährten Ruhe in die rechte Bahn gekommen und bestanden so auch ins achte Jahr hinein fort. Die Bekenner, die in nicht geringer Anzahl in den Erzbergwerken Palästinas vereinigt waren, genossen sogar große Freiheit, so daß sie Häuser in Kirchen umbauten. Als aber der Statthalter der Provinz, ein grausamer und schlechter Mensch, wie es sein Vorgehen gegen die Märtyrer erwies, dorthin kam, und damit Kenntnis von der Lebensweise der dort Angesiedelten erhielt, stattete er in einem Schreiben dem Kaiser davon Bericht ab, offenbar, um sie zu verdächtigen. Darauf erschien der Vorstand der Bergwerke, nahm auf kaiserlichen Befehl eine Teilung unter den Bekennern vor und wies den einen Cypern, den andern den Libanon als Aufenthaltsort an, wieder andere siedelte er an sonstigen Orten Palästinas an und ließ alle in verschiedenen Beschäftigungen Zwangsarbeit tun. Und vier Männer, die eine Führerstellung unter ihnen einzunehmen schienen, griff er heraus und sandte sie an den Befehlshaber der Truppen in der Provinz. Es waren dies Peleus und Nilus, zwei ägyptische Bischöfe, und ein anderer Priester, außerdem noch Patermuthius, der allen wegen seiner Fürsorge für jedermann aufs beste bekannt war. Der Befehlshaber verlangte von ihnen Verleugnung ihres Glaubens, und als er sie nicht durchsetzte, übergab er sie dem Feuertode. Andere Bekenner hinwiederum erhielten dort einen eigenen Wohnort für sich, nämlich alle, die wegen ihres hohen Alters oder wegen erlittener Verstümmelungen oder anderer körperlicher Gebrechen von dem Arbeitsdienst befreit waren. Ihr Haupt war der Bischof Silvanus, der aus Gaza gekommen war, ein Mann voll Frömmigkeit und wahrhaft ein Muster von Christentum. Er hatte vom ersten Tage der Verfolgung an und während der ganzen Zeit derselben durch mannigfache Bekenntniskämpfe sich ausgezeichnet und war sozusagen bis zu dieser Zeit aufbewahrt worden, um zuletzt dem ganzen Kampfe in Palästina das Siegel aufzudrücken. Mit ihm waren auch mehrere Ägypter, unter ihnen Johannes, der alle unsere Zeitgenossen an Gedächtnisstärke übertraf. Obwohl er schon früher des Augenlichtes beraubt worden war, wurde ihm doch auf sein Bekenntnis hin, das er in rühmlichster Weise ablegte, in gleicher Weise wie den andern der Fuß durch glühende Eisen unbrauchbar gemacht und ihm das Brenneisen auf das blinde Gesicht gelegt, wobei die Henker die Roheit und Unmenschlichkeit ihres Handwerks zur völligen Erbarmungs- und Gefühllosigkeit steigerten. Doch warum sollte man an diesem Manne seinen Charakter und seine philosophische Lebensweise rühmen, da ja dies nicht so merkwürdig erscheint, wie seine Gedächtniskraft? Denn ganze Bücher der Heiligen Schrift hatte er nicht auf steinerne Tafeln, wie der göttliche Apostel sagt, auch nicht auf Häute von Tieren oder Blätter von Papier, die von Motten und von der Zeit verzehrt werden, sondern auf die fleischernen Tafeln des Herzens und in seine reine Seele und in sein so klares Auge des Geistes geschrieben, so daß er nach Belieben, wie aus einem Schatze von Sentenzen, Stellen bald aus einem der Gesetzesbücher oder Prophetenbücher, bald aus einem der Geschichtsbücher, einem Evangelium oder einer sonstigen apostolischen Schrift auswendig vorzubringen vermochte. Ich gestehe, daß ich selbst einmal ins höchste Erstaunen geriet, als ich zum erstenmal diesen Mann sah, wie er inmitten einer zahlreichen Volksmenge in der Kirche stand und mehrere Stücke aus der Heiligen Schrift vortrug. Solange ich nur die Stimme hören konnte, glaubte ich, daß jemand, wie es bei den Versammlungen üblich ist, vorlese; als ich aber ganz in die Nähe kam und den Vorgang sah, wie alle andern mit gesunden Augen im Kreis herumstanden, er aber nur die Augen des Geistes zur Verfügung hatte und doch mühelos, wie ein Prophet, sprach und dabei bei weitem diejenigen übertraf, die körperlich gesund waren, — da konnte ich nicht genug Gott loben und staunen und ich glaubte gerade in dem Vorgange einen klaren und sicheren Beweis dafür sehen zu dürfen, daß allein in Wahrheit nicht derjenige Mensch ist, der seinem sichtbaren Körper nach als solcher gilt, sondern derjenige, der es ist der Seele und dem Verstande nach. So ließ er, nachdem sein Leib verstümmelt war, um so stärker die Größe der in ihm wohnenden Kräfte hervortreten. Die erwähnten Männer, die an dem ihnen eigens angewiesenen Orte weilten und in gewohnter Weise dem Fasten und Beten und den anderen Bußübungen oblagen, würdigte Gott, ja Gott selbst einer seligen Vollendung. Er bot ihnen hierzu seine rechte Hand. Der Feind in seinem Hasse konnte es nicht mehr ertragen, wie sie in aller Ruhe durch ihr Beten zu Gott sich gegen ihn wappneten, und beschloß, sie zu töten und aus der Welt zu räumen, gleich als ob sie ihn störten. Und Gott ließ auch dies sein Beginnen geschehen, damit er sich in seiner selbst gewählten Schlechtigkeit nicht gehindert sehe, und zugleich jene endlich den Siegespreis für ihre verschiedenartigen Kämpfe erhielten. So wurden denn neununddreißig an einem Tage auf Befehl des ganz verruchten Maximinus enthauptet.</p><p>Das sind die Martyrien, die in vollen acht Jahren in Palästina stattfanden, und so gestaltete sich die Verfolgung gegen uns: mit der Zerstörung der Kirchen hatte sie begonnen und war zu der großen Ausbreitung gekommen durch die immer wieder erfolgten Angriffe der Statthalter; dabei stellten die mannigfachen und verschiedenartigen Kämpfe der Streiter für die Religion eine fast unzählbare Menge von Märtyrern in jeder Provinz der Gebietsteile, die sich von Libyen angefangen über ganz Ägypten und Syrien und über die Landstriche im Orient und im Umkreis bis zum illyrischen Landstrich erstrecken. Denn die Gebietsteile, die über die gerade genannten hinausliegen, ganz Italien und Sizilien und Gallien, und alle, die gegen Sonnenuntergang liegen über Spanien, Mauretanien und Afrika hin, hatten nicht einmal die ganzen ersten zwei Jahre den Sturm der Verfolgung zu ertragen, sondern durften sich sehr bald des göttlichen Schutzes und des Friedens erfreuen, weil die göttliche Vorsehung die Bewohner um ihrer Einfalt und ihres Glaubens willen schonte. Was in den früheren Zeiten des römischen Reiches überhaupt nicht berichtet ist, das geschah gegen alle Erwartung jetzt zum erstenmal in unserer Zeit: das Reich ward in Hinsicht auf die gegen uns gerichtete Verfolgung in zwei Teile geteilt; die Brüder, die in dem einen, gerade bezeichneten Teile wohnten, genossen Frieden, während die im andern Teile ungezählte Kämpfe auf Kämpfe zu bestehen hatten. Als aber die Huld Gottes und des Himmels uns in Güte und Gnade ihren Schutz bot, da änderten auch unsere Fürsten und selbst diejenigen, die dereinst die Verfolgungen gegen uns veranlaßt, ganz wunderbarer Weise ihre Gesinnung und stimmten den Widerrufungsgesang an: durch uns günstige Edikte und durch milde Bestimmungen brachten sie das gegen uns entfachte Feuer zum Erlöschen. Auch dieser Widerrufungsgesang wird noch niederzuschreiben sein...</p>
