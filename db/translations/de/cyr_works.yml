      <p><em>Katechesen an die Täuflinge (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Bereits weht euch, ihr Täuflinge, der Duft der Seligkeit entgegen. Bereits sammelt ihr geistige Blüten zu himmlischen Kränzen. Bereits strömte der Hl. Geist Wohlgeruch aus. Bereits steht ihr im Vorhof des Palastes. Möge euch der König aber auch eintreten lassen! An den Bäumen zeigen sich schon die Blüten. Gebe Gott, daß die Früchte reifen! Bereits seid ihr ins Verzeichnis eingetragen, zum Militärdienst einberufen. In eurer Hand sind die Lampen für den Hochzeitszug, eure Sehnsucht ist nach dem himmlischen Reiche gerichtet. Gut ist euer Vorsatz, und ihm folgt die Hoffnung. Nicht lügt ja der, welcher gesagt hat: „Denen, die Gott lieben, gereicht alles zum Guten“. Gern spendet Gott Wohltaten. Doch besteht er darauf, daß es jeder ernst nimmt mit seinem Vorsatz, weshalb der Apostel beifügte: „(es gereicht zum Guten) denen, welche auf Grund des Vorsatzes berufen sind“. Ist es dir mit deinem Vorsatz ernst, dann beruft dich Gott. Nichts nützt es dir, wenn dein Leib hier ist, deine Gedanken aber anderswo weilen.</p><p>Simon, der Magier, kam einmal zur Taufe. Er wurde getauft, jedoch nicht erleuchtet. Wohl tauchte er seinen Körper ins Wasser, vergaß aber, das Herz durch den Geist zu erleuchten. Sein Leib stieg ins Wasser und entstieg demselben; seine Seele aber wurde nicht mit Christus begraben und nicht mit ihm auferweckt. Wenn ich auf sündhafte Vorkommnisse verweise, so geschieht es, damit du nicht fallest. Solche Sünden hatten ihre Bedeutung. Sie sind aufgezeichnet, um diejenigen zu warnen, welche noch heutigen Tages (zur Taufe) kommen. Möge unter euch keiner sich finden, der die Gnade versuche! Möge keine bittere Wurzel treiben und Unheil bringen! Möge keiner von euch kommen, weil er sagt: „Wohlan, wir wollen sehen, was die Gläubigen tun! Ich will hingehen und schauen, um zu erfahren, was geschieht.“ Du erwartest etwas zu sehen, und erwartest, nicht gesehen zu werden? Glaubst du nicht, daß, wenn du neugierig ausforschest, was geschieht, Gott dein Herz ausforscht?</p><p>[Forts. v. ] Nach den Evangelien kam einmal jemand aus Neugierde zur Hochzeit. Obwohl er nicht entsprechend gekleidet war, trat er ein, ließ sich nieder und aß; denn der Bräutigam ließ es geschehen. Als jener sah, daß alle Gäste weiß gekleidet waren, hätte auch er sich so kleiden sollen. Wohl nahm er mit ihnen am gleichen Mahle teil, jedoch von gleicher Kleidung und gleicher Gesinnung wollte er nichts wissen. War nun der Bräutigam auch entgegenkommend, so war er doch nicht gleichgiltig. Da er die Gäste einzeln aufsuchte (nicht aus Interesse für ihr Essen, sondern für ihr Benehmen), bemerkte er auch einen Fremden, der kein hochzeitliches Gewand trug, und sagte zu ihm: „Freund, wie bist du hierhergekommen? Was trägst du für Farbe? Wie steht es mit deinem Gewissen? Es mag ja sein, daß der Pförtner mit Rücksicht auf die Gastfreundlichkeit des Gastgebers dich nicht zurückwies, es mag sein, daß du nicht wußtest, in welchem Gewande man beim Mahle zu erscheinen hat, aber bei deinem Eintritt hast du die Gäste in ihren prunkvollen Gewändern gesehen. Hättest du dich nicht wenigstens bei diesem Anblick belehren lassen sollen? Hättest du nicht eintreten sollen, wie es sich gehört, um dann auch so, wie es sich gehört, fortzugehen? Nun aber bist du ohne Anstand gekommen, um ehrlos hinausgeworfen zu werden.“ Da gibt er seinen Dienern den Befehl: „Bindet ihm die Füße, die sich erfrechten, einzutreten! Bindet ihm die Hände, welche es nicht verstanden haben, ihm ein helles Gewand anzuziehen! Werfet ihn hinaus in die Finsternis draußen! Denn nicht ist er es wert, daß ihm die hochzeitlichen Lampen leuchten.“ Siehe, so erging es jenem damals! Stelle dich sicher!</p><p>Wir haben als Christi Diener jeden aufgenommen, haben als Pförtner die Türe offen stehen lassen. Vielleicht bist du eingetreten mit sündenbeschmutzter Seele und unreiner Absicht. Du bist da, bist aufgenommen; dein Name ist eingetragen. Merkst du es, welch’ erhebenden Eindruck die Kirche macht? Siehst du die Ordnung und Disziplin? Achtest du auf die Schriftlesung, die Anwesenheit der Kanoniker, den geregelten Unterricht? Habe Ehrfurcht vor der Stätte und lasse dich belehren durch das, was du schaust! Gehe jetzt hinaus, wie es sich gehört, und komme morgen recht ordentlich herein! Ist deine Seele mit Habsucht bekleidet, dann ziehe ein anderes Gewand an, bevor du kommst! Ziehe aus Unzucht und Unkeuschheit und lege an das so glänzende Gewand der Keuschheit! Ich ermahne dich, noch ehe Jesus, der Seelenbräutigam, eintritt und nach dem Kleide sieht. Lange Zeit ist dir noch gegeben; vierzig Tage hast du zur Buße. Genügend Zeit steht dir zur Verfügung, dich auszuziehen, abzuwaschen, anzuziehen und einzutreten. Verharrst du in deinem schlechten Vorsatz: der Prediger hat keine Schuld daran, wenn du keine Gnade erwarten darfst. Das Wasser nimmt dich zwar an, aber der Geist nimmt dich nicht auf. Weiß einer, daß er eine Wunde hat, dann nehme er eine Salbe! Ist einer gefallen, dann stehe er auf! Unter euch sei kein Simon! Ferne sei Heuchelei und eitle Tändelei!</p><p>Vielleicht ist es noch ein anderer Grund, der dich hierhergeführt hat. Vielleicht ist einer hierhergekommen, um eine Frau zu umwerben; vielleicht auch umgekehrt. Oft will auch der Sklave seinem Herrn und der Freund seinem Freunde damit einen Gefallen erweisen. Ich nehme die Lockspeise für die Angel und halte dich damit fest. Bist du auch nicht in guter Absicht gekommen, so sollst du doch gute Hoffnung haben und selig werden. Vielleicht wußtest du nicht, wohin du gehst, und kanntest nicht das Netz, das dich aufnimmt. In die Netze der Kirche bist du geraten: leben sollst du, Gefangener, entfliehe nicht! Jesus fängt dich mit der Angel, nicht um dich zu töten, sondern um dir durch den Tod das Leben zu geben. Sterben sollst du und auferstehen! Du hast ja gehört das Wort des Apostels: „gestorben der Sünde, lebend der Gerechtigkeit“. Stirb den Sünden und lebe der Gerechtigkeit! Schon von heute ab lebe!</p><p>Erwäge, welch’ hohe Würde dir Jesus verleiht! (Bisher) wurdest du Katechumen (wörtlich: einer, an den ein belehrendes Wort gerichtet wird) genannt, (erst) ins Ohr drang das belehrende Wort. Wohl hörtest du von Hoffnung, verstandest sie aber nicht. Du hörtest von den Geheimnissen, ohne sie zu erfassen; hörtest die Schrift, ohne in ihre Tiefe einzudringen. Nun dringt das Wort nicht mehr ins Ohr, sondern in die Seele. Denn der Geist wohnt in Zukunft in dir und macht deine Seele zu einer göttlichen Wohnung. Wenn du dann das hörst, was über die Geheimnisse geschrieben ist, wirst du erfassen, was du nicht verstanden hast. Glaube nicht, daß das, was du empfängst, etwas Geringfügiges ist! Du, ein armseliger Mensch, empfängst den Namen Gottes. Höre das Wort Pauli „Gott ist getreu!“ Höre das andere Wort der Schrift: „Gott ist getreu und gerecht“! Mit Rücksicht darauf, daß die Menschen den Namen Gottes erhalten sollen, hat der Psalmist im Namen Gottes gesagt: „Ich sprach: Götter seid ihr und Söhne des Höchsten alle“. Sieh aber zu, daß du nicht den Namen eines Gläubigen und die Gesinnung eines Ungläubigen hast! Du hast dich auf den Kampfplatz begeben, strenge dich an im Wettlauf! Solche Gelegenheit kommt dir nicht wieder. Wenn du bald Hochzeit hättest, würdest du nicht alles liegen und stehen lassen, um das Mahl vorzubereiten? Wenn du aber daran bist, die Seele dem himmlischen Bräutigam zu weihen, willst du nicht, um geistige Gaben zu empfangen, das Irdische beiseite lassen?</p><p>[Forts. v. ] Man kann die Taufe nicht zwei- oder dreimal empfangen. Andernfalls allerdings könnte man sagen: „Was ich das erste Mal nicht erreiche, gelingt mir das zweite Mal.“ Hast du das eine Mal keinen Erfolg, dann ist es für immer vorbei. Denn „es ist* ein* Herr,* ein* Glaube,* eine* Taufe“. Nur die Häretiker werden wieder getauft, weil ihre Taufe keine Taufe ist.</p><p>[Forts. v. ] Nichts anderes verlangt Gott von uns als guten Vorsatz. Sage nicht: Wie sollen meine Sünden getilgt werden? Ich sage dir: Es geschieht, wenn man will und glaubt. Was ist einfacher als dies? Allerdings, wenn deine Lippen erklären „ich will“, nicht aber das Herz: — der Richter kennt das Herz! Von heute ab lasse jede Sünde beiseite! Deine Zunge rede keine unehrbaren Worte! Dein Blick sündige nicht und schweife nicht bei eitlen Dingen umher!</p><p>Deine Füße sollen zu den Katechesen eilen! Empfange eifrig die Exorzismen! So oft du angehaucht, so oft du beschworen wirst, ist es dir zum Heil. Du kennst das noch nicht bearbeitete und gereinigte Gold; es ist mit verschiedenen Elementen, mit Erz, Zinn, Eisen, Blei verbunden. Wollen wir nun reines Gold haben: nicht ohne Feuer läßt sich Gold von den fremden Bestandteilen reinigen. So gibt es unmöglich eine Reinigung der Seele ohne Exorzismen. Dieselben sind göttlich, weil der göttlichen Schrift entnommen. Das Gesicht ist verhüllt; denn in Zukunft soll der Geist ungestört bleiben, soll nicht unsteter Blick das Herz unstet machen. Sind die Augen verhüllt, dann kann das Ohr ungestört das Heil vernehmen. Wenn die Goldschmiede mit dünnen Instrumenten Luft dem Feuer zuführen und die Flammen anfachen, schmelzen sie das im Schmelztiegel befindliche Gold und erhalten, was sie suchen. So entflieht, wenn die Exorzisten mit göttlichem Geiste Furcht einhauchen und die Seele im Körper wie in einem Schmelztiegel schmelzen, der feindliche Dämon, um die Erlösungsgnade, die Hoffnung auf das ewige Leben übrig zu lassen; nun besitzt die von Sünden gereinigte Seele das Heil. Brüder, halten wir an der Hoffnung fest, geben wir uns recht der Hoffnung hin, damit der Gott des Weltalls, wenn er unseren guten Willen sieht, uns von Sünden reinigt, festes Vertrauen auf das, was geschieht, in uns weckt und uns die geistige Umwandlung der Erlösten verleiht! Gott hat gerufen, du wurdest gerufen.</p><p>[Forts. v. ] Halte aus bei den Katechesen! Sollte unsere Rede auch lange dauern, so soll doch deine Aufmerksamkeit nie erschlaffen. Denn du wirst ausgerüstet gegen eine feindliche Macht, ausgerüstet gegen Häresien, Juden, Samariter und Heiden. Deiner Feinde sind viele, versorge dich gut mit Geschossen! Gegen viele hast du deine Wurfspieße zu schleudern. Lernen mußt du, wie du den Heiden triffst, wie du kämpfest gegen den Häretiker, den Juden und den Samariter. Die Waffen sind hergerichtet, vor allem bereit liegt das Schwert des Geistes. Du mußt aber auch die Rechte ausstrecken in gutem Willen, damit du den Kampf des Herrn kämpfest, die feindlichen Mächte besiegest, von keiner Häresie überwunden werdest.</p><p>Auch das laß dir gesagt sein: lerne, was man dir vorträgt, und bewahre es für immer! Glaube nicht, es seien die gewöhnlichen Vorträge! Auch diese sind zwar gut und verdienen Gehör. Aber da können wir, was wir heute versäumen, morgen nachlernen. Was aber von dem planmäßigen Unterricht über die Wiedergeburt durch die Taufe heute versäumt wird, wann soll das nachgeholt werden? Denke dir, es ist an der Zeit, Bäume zu pflanzen! Wenn wir unterlassen, zu graben und Gruben zu machen, und einen Baum einmal schlecht pflanzen, wann kann er dann richtig gepflanzt werden? Denke dir, der katechetische Unterricht ist ein Gebäude! Wenn wir nicht tief gegraben und einen Grund gelegt haben, wenn wir nicht planmäßig ein wohlgefügtes Gebäude errichtet haben, damit sich keine Risse zeigen und der Bau nicht Schaden leide, dann ist auch die anfängliche Mühe wertlos. Es muß sich planmäßig Stein an Stein fügen und Kante an Kante reihen, die rauhen Teile müssen abgemeißelt werden. So ersteht schließlich ein tadelloser Bau. In erwähnter Weise verfahren wir mit den Steinen der Erkenntnis, wenn wir sie dir darreichen. Du mußt anhören, was über den lebendigen Gott gelehrt wird, über das Gericht, über Christus, die Auferstehung. Viele Lehren sind es, welche planmäßig vorgetragen werden. Einzelne wurden eben herausgegriffen, sie werden in der Folge so, wie sie zusammengehören, dargeboten. Wenn du nicht die Lehren zu einem Ganzen zusammenfügst und die früheren zugleich mit den späteren im Gedächtnis behältst, dann wird dein Bau Risse zeigen trotz der Arbeit des Baumeisters.</p><p>Sollte von den Katechesen gesprochen werden und ein Katechumene dich fragen, was man im Unterricht gesagt hat, dann gib ihm, der ferne steht, keine Antwort! Denn ein Geheimnis vertrauen wir dir an, die Hoffnung auf das zukünftige Leben. Bewahre das Geheimnis dem, der dir den Lohn gibt! Nie soll einer zu dir sagen: was hast du für einen Schaden, wenn auch ich davon erfahre! Auch die Kranken verlangen nach Wein. Wird er aber zur unrechten Zeit verabreicht, dann wirkt er Fieber, und doppelt ist das Unglück: der Kranke verliert sein Leben, der Arzt seinen Ruf. In genannter Weise ergeht es einem Katechumenen, wenn er von einem Gläubigen etwas erfahren hat; auch der Katechumene wird vom Fieber befallen. Er versteht nämlich nicht, was er gehört hat, macht seine kritischen Bemerkungen und spöttelt über das, was man ihm gesagt hat. Der Gläubige aber steht dann als Verräter da. Bereits stehst du am Scheidewege. Siehe zu, daß du nichts ausschwätzest! Nicht als ob die Lehren nicht der Rede wert wären. Aber jene Ohren verdienen sie nicht zu hören. Als du noch Katechumene warst, erzählte ich auch dir nichts von den Lehren, die zu besprechen sind. Wenn du einmal die Erhabenheit der Lehren aus Erfahrung kennst, dann wirst du verstehen, daß die Katechumenen (noch) nichts davon zu wissen brauchen.</p><p>[Forts. v. ] Seitdem ihr in die Liste eingetragen seid, seid ihr Söhne und Töchter* einer* Mutter. Kommt ihr hier herein, noch ehe die Stunde der Beschwörungen begonnen hat, dann rede jeder von euch nur von dem, was zur Kirche gehört! Schauet euch nach denen um, die noch nicht da sind! Würdest du nicht, wenn du zu einem Mahle geladen wärest, auf den warten, der mit dir geladen ist? Hast du einen Bruder, wirst du nicht für den Bruder sorgen? Beschäftige dich nicht mehr neugierig mit dem, was keinen Wert hat, nicht mit den Ereignissen in der Stadt, nicht mit den Ereignissen auf dem Lande! Frage nicht: „Was treibt der König? Was treibt der Bischof? Was treibt der Priester?“ Blicke aufwärts! Deine Zeit stellt an dich die Forderung: „Gönnet euch Ruhe und erkennet, daß ich Gott bin!“ Wenn du siehst, wie die Gläubigen, die am Dienste teilnehmen, sorglos sind, bedenke: sie sind (bereits) in Sicherheit, sie wissen, was sie empfangen haben, sie besitzen die Gnade. Bei dir dagegen ist es jetzt noch unsicher, ob du aufgenommen wirst oder nicht. Mache es nicht wie die, welche (schon) sorglos sein dürfen! Wandle in Furcht!</p><p>Nach Vornahme des Exorzismus haben die Männer bei den Männern, die Frauen bei den Frauen zu bleiben, bis alles an der Reihe war! Es soll hier sein wie in der Arche Noës, in welcher er selbst, seine Söhne, sein Weib und die Weiber seiner Söhne waren. Obwohl die Arche nur* ein* Raum war und die Türe geschlossen war, war doch alles in Ordnung. Ist auch die Kirche geschlossen und seid auch ihr alle darin, so soll doch alles geordnet, die Männer bei den Männern, die Frauen bei den Frauen sein, damit nicht aus der Gelegenheit zum Heile ein Anlaß zum Unheile werde. Mag auch die Absicht, sich zusammenzusetzen, gut sein: doch fort mit den Leidenschaften! Die Männer sollen beim Sitzen ein nützliches Buch in der Hand haben; der eine soll lesen, der andere aufpassen. Ist kein Buch da, dann soll der eine beten, der andere etwas Nützliches reden. Die Jungfrauen sollen bei ihren Zusammenkünften still die Psalmen beten oder still lesen; nur mit den Lippen sollen sie sprechen, so daß man nichts hört; „denn nicht gestatte ich dem Weibe, in der Kirche zu reden“. Die Frauen sollen es ebenso machen. Wenn sie beten, sollen sich ihre Lippen bewegen, doch darf man ihre Stimme nicht vernehmen, damit Samuel erscheine, damit deine unfruchtbare Seele das Heil des „erhörenden Gottes“ gebäre; denn so ist Samuel zu übersetzen.</p><p>Jeden will ich eifrig, jede in Andacht sehen. Der Geist erglühe in Frömmigkeit! Die Seele lasse sich beschneiden! Die Härte des Unglaubens werde gehämmert! Fort mit den Schlacken des Eisens, das reine Metall bleibe! Fort mit dem Rost des Eisens, das Edelmetall bleibe! Gott möge euch noch jene Nacht schauen lassen, die Finsternis, welche leuchtet wie der Tag und von welcher es heißt: „Die Finsternis ist nicht finster vor dir und die Nacht ist hell wie der Tag“. Dann möge sich jedem von euch — ob Mann, ob Weib ― die Türe des Paradieses öffnen! Dann sollt ihr an dem wohlriechenden Wasser teilhaben, welches Christum bringt. Dann sollt ihr den Namen „Gesalbter“ erhalten sowie die Kraft des Gottesdienstes. Erhebet nunmehr den Blick des Geistes! Stellet euch nunmehr im Geist die Chöre der Engel vor, Gott, den Herrn des Weltalls, auf dem Throne, seinen eingeborenen Sohn zu seiner Rechten, daneben den Geist! Stellt euch vor: die Throne und Herrschaften dienen und jeder von euch — Mann wie Weib — ist selig! Schon lasset an euer Ohr jenes liebliche Lied tönen: „Selig sind die, deren Unrecht nachgelassen und deren Sünden zugedeckt sind“. Die Engel werden es singen am Tage eurer Erlösung, wenn ihr wie Sterne der Kirche eintretet mit glänzendem Körper und leuchtender Seele.</p><p>Groß ist die Taufe, die ihr empfangen sollt. Lösegeld ist sie den Gefangenen, Befreiung von Sündenstrafen, Tod der Sündenschuld, Wiedergeburt der Seele. Sie ist ein leuchtendes Gewand, ein heiliges, unverbrüchliches Siegel, der Wagen zum Himmel, des Paradieses Wonne, des Reiches Bürgerrecht, Gabe der Kindschaft. Doch ein Drache lauert am Wege auf den Wanderer. Sieh zu, daß er dich nicht beißt und du ungläubig wirst! Er sieht so viele auf dem Wege des Heils und „sucht, wen er verschlingen könne“. Zum Vater der Geister führt der Weg, doch der Weg geht über jenen Drachen. Wie nun wirst du ihn passieren? Beschuhe deine Füße „mit der Bereitschaft zum Evangelium des Friedens“, damit sein Beißen nicht schadet! In dir wohne der Glaube, fest sei deine Hoffnung, solid das Schuhwerk, damit du den Feind passierst und zum Herrn gelangst! Bereite dein Herz zur Aufnahme der Lehre, zur Teilnahme an den hl. Mysterien! Bete recht fleißig, damit Gott dich der himmlischen, unsterblichen Mysterien würdige! Weder bei Tag noch bei Nacht lasse nach! So oft der Schlaf die Augen flieht, denke ans Beten! Merkst du, daß ein unreiner Gedanke in dir aufsteigt, dann fasse den heilsamen Gedanken ans Gericht! Denke ans Lernen, um nicht ans Sündigen zu denken! Wenn jemand zu dir sagt: „Du gehst hin, um ins Taufwasser hinabzusteigen? Hat denn die Stadt jetzt nicht Bäder?“, dann sollst du wissen, daß der Meeresdrache dir solche Einwände macht. Achte nicht auf die Lippen dessen, der zu dir redet, sondern auf den, der (in ihm) wirkt! Behüte deine Seele, damit du nicht unter Räuber fällst, damit du in der Hoffnung ausharrend das ewige Leben erbest!</p><p>Wir, die wir diese Mahnungen und Lehren geben, sind Menschen. Machet nicht den Bau, den wir errichten, aus Heu, Stroh und Spreu, damit nicht das Werk verbrenne und wir den Schaden haben! Bauet vielmehr aus Gold, Silber und wertvollem Gestein! Meine Aufgabe ist es, zu reden, die deinige, den Vorsatz zu machen, Gottes Sache aber ist es, zu vollenden. Strengen wir den Geist an, spannen wir die Seele an, bereiten wir das Herz! Um der Seele willen laufen wir, der Ewigkeit wegen hoffen wir. Gott, der eure Herzen kennt und weiß, wer aufrichtig und wer ein Heuchler ist, vermag den Aufrichtigen zu schützen, den Heuchler umzuwandeln. Gott kann auch den Ungläubigen, wenn er ihm nur sein Herz gibt, gläubig machen und die „gegen uns lautende Handschrift“ auslöschen. Er möge es euch gewähren, daß ihr die früheren Sünden vergessen könnt! Verpflanzen möge er euch in die Kirche, euch zu seinen Soldaten machen, angetan mit den Waffen der Gerechtigkeit! Was das Neue Testament Himmlisches bietet, möge er euch in Fülle geben, euch das ewige, untilgbare Siegel des Hl. Geistes verleihen in Christus Jesus, unserm Herrn, dem die Ehre sei in alle Ewigkeit. Amen.</p><p>Diese Katechesen für die Täuflinge lasse diejenigen lesen, welche zur Taufe kommen, und die bereits getauften Gläubigen! Keineswegs aber darfst du sie den Katechumenen geben oder sonst jemandem, der nicht Christ ist. Denn vor dem Herrn hast du dich zu verantworten. Solltest du eine Abschrift machen, dann behalte den Herrn vor Augen! Unseres hl. Vaters Cyrillus, Erzbischofs von Jerusalem.I. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Einleitung für die Täuflinge.</p><h2>2</h2><p>* Einleitung für die Täuflinge.*</p><p>Da ihr zu Jüngern des Neuen Bundes und Teilnehmern an den Geheimnissen Christi jetzt berufen seid, in kurzem es aber auch durch die Gnade werden sollt, so erneuert euer Herz und euren Geist, damit der Himmel an euch Freude haben kann! Wenn nämlich nach dem Evangelium „über einen einzigen Sünder, der Buße tut, Freude herrscht“, um wieviel mehr wird die Erlösung so vieler Seelen die Himmel in freudige Erregung versetzen. Nachdem ihr einen guten, so herrlichen Weg eingeschlagen habt, so eilet gewissenhaft auf dem Pfade der Frömmigkeit! Zu eurer Erlösung ist gerne bereit der eingeborene Sohn Gottes, da er sagt: „Kommet zu mir alle, die ihr mühselig und beladen seid, und ich will euch erquicken!“ Ihr, die ihr mit schweren Vergehen bekleidet seid und gefesselt mit den Stricken eurer Sünden, höret auf das Wort des Propheten: „Waschet euch, werdet rein! Reiniget eure Seele von den Sünden vor meinen Augen!“ Die Chöre der Engel mögen euch zurufen: „Selig sind die, deren Unrecht nachgelassen und deren Sünden zugedeckt sind“. Vor kurzem habt ihr die Lampen des Glaubens angezündet. Ohne auszulöschen, sollen sie in eurer Hand bleiben, damit der, welcher dereinst auf diesem hochheiligen Golgatha dem Räuber wegen seines Glaubens das Paradies geöffnet hat, euch die Gnade verleihe, den hochzeitlichen Gesang zu singen.</p><p>[Forts. v. ] Ist hier einer Sklave der Sünde, eiligst bereite er sich durch den Glauben auf die Wiedergeburt zur Freiheit und Kindschaft vor! Er lege die gar schlimme Knechtschaft der Sünden ab, erwerbe sich die so heilige Knechtschaft des Herrn, um würdig zu werden, das Reich des Himmels zu erben. In der Beichte ziehet „den alten, durch die trügerischen Leidenschaften verdorbenen Menschen“ aus, um den neuen, durch die Erkenntnis seines Schöpfers verjüngten Menschen anzuziehen! Erwerbet euch durch den Glauben das Unterpfand des Hl. Geistes, um in die ewigen Wohnungen aufgenommen zu werden! Tretet heran zum geheimnisvollen Siegel, damit der Herr euch erkenne! Lasset euch zur heiligen, geistigen Herde Christi zählen, um zu seiner Rechten gestellt zu werden und das euch bereitete Leben zu erben! Wem noch die Rauheit der Sünde anhaftet, hat seinen Platz zur Linken, weil er es unterließ, zu dem göttlichen, durch Christus mit der Wiedergeburt in der Taufe gegebenen Gnadengeschenke heranzutreten. Nicht meine ich eine Wiedergeburt des Fleisches, sondern die geistige Wiedergeburt der Seele. Das Fleisch wird geboren durch die irdischen Eltern, die Seele aber wird wiedergeboren durch den Glauben; denn „der Geist weht, wo er will“. Bist du würdig, dann wirst du dereinst das Wort: „Wohl dir, du guter und getreuer Knecht“ zu hören bekommen, sofern nämlich dein Gewissen sich nicht durch Heuchelei verunreinigt zeigt.</p><p>Wenn einer von den Anwesenden meinen sollte, er könne mit der Gnade sein Spiel treiben, betrügt er sich und kennt ihre Kraft nicht. Bewahre deine Seele frei von Unaufrichtigkeít, o Mensch, um dessentwillen, der Herz und Nieren erforscht! Wie diejenigen, welche einen Feldzug unternehmen wollen, bei der Musterung Alter und Körperbeschaffenheit der Soldaten feststellen lassen, so prüft der Herr die Seelen, wenn er sie aushebt, auf ihre Bereitwilligkeit. Den, bei welchem er Heuchelei versteckt findet, weist er zurück, da er in ein richtiges Heer nicht paßt. Trifft er einen Würdigen, dem schenkt er gerne seine Gnade. Nicht gibt er das Heilige den Hunden; sondern wo er gute Absicht wahrnimmt, da gibt er das heilsame, wunderbare Siegel, vor dem die Dämonen zittern und das die Engel kennen. Die einen sollen eilig vor dem Siegel fliehen, die andern sollen es als etwas Heimisches aufsuchen. Wer dieses geistige, heilsame Siegel empfängt, muß also seinerseits auch einen guten Willen mitbringen. Geradeso wie der Griffel oder die Waffe der führenden Hand bedarf, so bedarf die Gnade einer gläubigen Hingabe.</p><p>Nicht vergängliche, sondern geistige Waffe erhältst du. In das geistige Paradies wirst du nunmehr verpflanzt. Du empfängst einen neuen Namen, den du zuvor nicht hattest. Ehedem warst du Katechumene, nun aber wirst du den Namen eines Gläubigen erhalten. Verpflanzt wirst du unter die geistigen Ölbäume. Von dem wilden Ölbaum weg wirst du aufgepfropft auf einen edlen Ölbaum, aus der Sünde in die Gerechtigkeit, aus dem Schmutze in die Reinheit. Du wirst ein Teil des hl. Weinstockes. Verbleibst du am Weinstocke, dann wächst du heran zu einem Fruchtzweig. Verbleibst du aber nicht an ihm, dann wirst du vom Feuer vernichtet werden. Bringen wir, wie es sich gehört, Früchte! Möge es uns nicht ergehen wie jenem unfruchtbaren Feigenbaume! Möge Jesus jetzt nicht noch einmal kommen, um den Fluch über die Unfruchtbarkeit auszusprechen! Allen sollte es vergönnt sein, sich das Wort zu eigen zu machen: „Ich bin wie ein fruchtbarer Ölbaum im Hause Gottes; ich habe in Ewigkeit meine Hoffnung auf Gottes Barmherzigkeit gesetzt“. Nicht ein irdischer Ölbaum, sondern ein geistiger, leuchtender Ölbaum! Gottes Sache ist es, zu pflanzen und zu begießen; deine Pflicht ist es, Früchte zu bringen. Gottes Sache ist es, Gnaden zu spenden; deine Pflicht ist es, sie entgegenzunehmen und zu bewahren. Verachte die Gnade nicht, weil sie unentgeltlich gegeben wird! Nimm sie hin und bewahre sie gewissenhaft!</p><p>Jetzt ist die Zeit zu beichten. Beichte, was du in Wort und Tat, bei Nacht und bei Tag begangen hast! Beichte zur rechten Zeit und nimm hin am Tage des Heiles den himmlischen Schatz! Empfange fleißig die Exorzismen! Wohne eifrig den Katechesen bei und merke dir, was man da sagt! Die Worte sind nicht bloß fürs Ohr, sie sollen vielmehr von dir im Glauben versiegelt werden. Alle menschliche Sorge lege beiseite! Der Seele wegen läufst du. Von dem, was zur Welt gehört, nimmst du vollständig Abschied. Was du verabschiedest, ist gering; groß ist, was dir der Herr schenkt. Verlasse die Gegenwart, vertraue auf die Zukunft! Während deines wertlosen Dienstes für die Welt haben schon so viele Jahre ihren Kreislauf vollendet, und nicht willst du vierzig Tage der Seele widmen? „Gönnet euch Ruhe und erkennet, daß ich Gott bin!“ sagt die göttliche Schrift. Vermeide das viele unnütze Sprechen! Verleumde nicht, höre auch nicht Verleumdungen gerne an, sei vielmehr bereit zum Gebet! Deine geistlichen Übungen mögen zeigen, wem du gestorben bist. Reinige dein Gefäß, damit du noch mehr Gnade erhaltest! Nachlassung der Sünden wird allen in gleicher Weise verliehen, der Hl. Geist aber wird dem einzelnen seinem Glauben entsprechend zuteil. Wer sich wenig plagt, erhält wenig; wer viel arbeitet, hat großen Lohn. Laufe du für dich, schaue auf deinen Nutzen!</p><p>[Forts. v. ] Hast du etwas gegen jemanden, so verzeihe ihm! Du kommst, um Nachlassung der Sünden zu erhalten: auch du mußt dem Sünder vergeben. Wie willst du denn zum Herrn sagen: „Vergib mir meine vielen Sünden!“ wenn du deinerseits dem Mitknechte nicht einmal seine wenigen Sünden verzeihest? Finde dich eifrig bei den Versammlungen ein! Nicht bloß jetzt, da die Geistlichen dich zum Eifer antreiben, sondern auch später, wenn du die Gnade schon empfangen hast. Ist etwas gut, ehe man etwas erhält, sollte es denn nicht auch nach dem Empfange gut sein? Wenn es vor dem Einpfropfen ratsam war, zu gießen und den Boden zu pflegen, ist es nach dem Verpflanzen nicht noch viel besser? Kämpfe für deine Seele, vor allem in solchen Tagen! Weide deine Seele mit göttlicher Lektüre! Geistlichen Tisch hat dir der Herr bereitet. Sprich auch du mit dem Psalmisten: „Der Herr weidet mich, nichts wird mir fehlen. Auf Weideplätzen läßt er mich lagern, an erfrischenden Wassern zieht er mich groß, meine Seele führt er zu sich“. Die Engel sollen sich mit euch freuen, und Christus selbst, der große Hohepriester, möge in Anerkennung eurer guten Gesinnung euch alle dem Vater vorstellen und zu ihm sagen: „Hier bin ich und die Kinder, die mir Gott gegeben hat“. Möge er euch alle in seinem Wohlgefallen erhalten! Ihm sei Ehre und Macht in die endlose Ewigkeit der Ewigkeit. Amen.II. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über Buße und Sündennachlaß und über den Widersacher.</p><h2>3</h2><p>* Über Buße und Sündennachlaß und über den Widersacher.*</p><p>Schrecklich ist die Sünde, schwerste Krankheit für die Seele die Gesetzesübertretung. Nicht nur zerschneidet sie der Seele die Nerven, sie trägt ihr auch ewiges Feuer ein. Sie ist ein selbstverschuldetes Übel, entsprossen aus freiem Willen. Daß wir mit freiem Willen sündigen, sagt einmal deutlich der Prophet: „Ich habe dich gepflanzt als fruchtbaren, ganz echten Weinstock; wie hast du dich zur Bitterkeit verwandelt, fremder Weinstock?“ Die Pflanzen wären schön, doch die Früchte sind schlecht. Das Übel kommt vom freien Willen, der Gärtner hat keine Schuld daran. Der Weinstock wird im Feuer verbrannt werden, der gutgepflanzt wurde, aber aus freiem Willen heraus schlechte Früchte gezeitigt hat. „Gott hat“ — wie es im Buche Ekklesiastes heißt — „den Menschen gerecht gemacht; sie aber folgten ihren vielen Einfällen“. Der Apostel sagt: „Seine Geschöpfe sind wir, erschaffen zu guten Werken“. Der Schöpfer hat also, weil er gut ist, zu guten Werken erschaffen; das Geschöpf aber hat sich freiwillig der Sünde zugewendet. Ein schreckliches Übel ist, wie gesagt, die Sünde; doch nicht ist sie unheilbar. Schrecklich ist das Übel, wenn einer an der Sünde festhält; rasch geheilt aber ist es, wenn einer die Sünde in der Buße ablegt. Denke dir, jemand hätte Feuer in der Hand! Solange er die (brennende) Kohle in der Hand hat, brennt es ihn jedenfalls; sobald er aber die Kohle wegtut, legt er auch das Feuer weg. Sollte einer glauben, er brenne nicht, wenn er sündige, dann sagt die Schrift: „Wird einer Feuer am Busen bergen, ohne die Kleider zu verbrennen?“ Die Sünde brennt, sie zerschneidet die Nerven der Seele, zermalmt die seelischen Gebeine des Geistes und verdunkelt das Licht des Herzens.</p><p>[Forts. v. ] Doch wird man fragen: was ist denn die Sünde? Ist sie ein Lebewesen, ein Engel, ein Dämon? Was ist das, was da wirkt? Sie ist, o Mensch, kein Feind, der von außen an dich herantritt; sie ist vielmehr ein schlimmes Gewächs, das selbständig in dir entsprießt. Ist dein Blick recht gerichtet, dann gibt es keine Begierde. Raube nicht fremdes Eigentum, und der Raub ruht. Denke an das Gericht, und nicht wird Unzucht, Ehebruch, Mord, nicht irgendeine Missetat etwas bei dir vermögen. Sobald du Gott vergißt, nehmen deine schlechten Gedanken und deine sündhaften Handlungen ihren Anfang.</p><p>Doch bist du nicht der einzige Urheber. Noch einer ist da, der Teufel, ein gar schlimmer Hetzer. Mag er auch hetzen, aber er bekommt keine Gewalt über den, der nicht will. Daher sagt Ekklesiastes: „Wenn der Geist des Gewaltigen gegen dich heranzieht, dann mache ihm keinen Platz!“ Wenn du deine Türe verschließest und ihn ferne hältst, wird er dir nicht schaden. Läßt du dich unbedenklich in sinnliche Vorstellungen ein, dann faßt die Sinnlichkeit durch die Gedanken in dir Wurzel, hält dein Denken gefesselt und zieht dich in die Tiefe der Übel hinab. Doch vielleicht wendest du ein: ich glaube, und nichts kann mir die Sinnlichkeit anhaben, mag ich auch noch so tief darüber nachdenken. Weißt du nicht, daß schon oft eine Wurzel im Laufe der Zeit einen Felsen gesprengt hat? Nimm den Keim nicht in dich auf, sonst zersprengt er dir den Glauben! Reiße das Böse, noch ehe es blüht, mit der Wurzel aus! Hüte dich anfangs vor Leichtsinn, damit du nicht später zu Feuer und Schwert greifen mußt! Stellt sich ein Augenleiden ein, dann greife rechtzeitig zu einem Heilmittel! Nicht suche den Arzt erst dann auf, wenn du schon blind bist!</p><p>Der Teufel ist Urheber der Sünde und Vater des Unheils. Der Herr hat es gesagt, nicht ich sage es: „Von Anbeginn sündigt der Teufel“. Vor ihm hat nämlich niemand gesündigt. Er sündigte aber nicht etwa deshalb, weil ihm das Sündigen mit der Natur gegeben werden mußte. In diesem Falle ginge ja die Ursache der Sünde auf den Schöpfer zurück. Erschaffen wurde er gut, eigener Wille aber hat ihn zum Teufel gemacht, welchen Namen ihm sein Handeln eintrug. Ein Erzengel war er und wurde erst später Teufel* (διάβολος)* [diabolos] genannt infolge des Verleumdens* (διαβάλλειν)* [diaballein]. Er war ein guter Diener Gottes, wurde aber ein Satan und erhielt mit Recht diesen Namen; denn Satan heißt Widersacher. Diese Lehren stammen jedoch nicht von mir, sondern von dem inspirierten Propheten Ezechiel. Wo dieser nämlich das „Trauerlied“ beginnt, sagt er von ihm: „Du wurdest als Siegel der Ähnlichkeit und Krone der Schönheit im Paradiese Gottes erschaffen“, und bald darauf: „Von dem Tage deiner Erschaffung an warst du tadellos in deinen Tagen, bis gefunden wurden in dir die Sünden“. Ganz gut heißt es „gefunden wurden sie in dir“; denn nicht von außen her wurden sie hereingebracht, sondern du selbst hast die Sünde hervorgerufen. Auch auf ihre Ursache ist im Anschluß (an jene Worte) verwiesen: „Dein Herz erhob sich ob deiner Schönheit; wegen der Menge deiner Sünden habe ich dich auf die Erde geschleudert“. Damit stimmt überein, was der Herr im Evangelium sagt: „Ich sah den Satan wie einen Blitz vom Himmel fallen“. Wie du siehst, stimmen Altes und Neues Testament überein. Als jener stürzte, zog er noch viele mit sich. Er ist es, der denen, die ihm gehorchen, böse Begierden eingibt. Er ist es, von dem Ehebruch, Unzucht und alle möglichen Laster kommen. Er war Schuld daran, daß unser Stammvater Adam wegen Ungehorsams vertrieben wurde und die dornenreiche Erde gegen das wunderbare Paradies, das ohne Zutun Früchte brachte, eintauschte.</p><p>[Forts. v. ] Sind wir nun etwa — so wird man fragen — verloren, weil wir betrogen worden sind? Gibt es keine Erlösung mehr? Gefallen sind wir. Ist es nicht möglich aufzustehen? Blind wurden wir. Können wir nicht wieder sehend werden? Wir sind gelähmt worden. Gibt es keine Möglichkeit, gerade einherzugehen? Man kann geradezu sagen: wir sind gestorben. Gibt es keine Auferstehung? O Mensch, wird der, welcher den Lazarus vier Tage nach seinem Tode, nachdem er in Verwesung übergegangen war, von den Toten erweckt hat, nicht noch viel leichter dich, der du lebst, erwecken? Er selbst, der sein kostbares Blut für uns vergossen hat, wird uns erlösen von der Sünde. Verzweifeln wir doch nicht an uns selbst, Brüder! Geben wir uns nicht hoffnungslos verloren! Schrecklich ist es nämlich, nicht gläubig auf Umkehr zu hoffen. Wer nicht auf Erlösung rechnet, häuft rücksichtslos Sünde auf Sünde. Wer dagegen hofft, zu genesen, gibt noch acht auf sich. Wenn der Räuber keine Gnade zu erwarten hat, wird er tollkühn; hofft er auf Nachsicht, bekehrt er sich gerne. Die Schlange legt das Alter ab; wir aber wollen nicht die Sünde ablegen? Wird ein dorniges Erdreich gut kultiviert, dann trägt es reichlich Früchte. Wir aber sollen nicht wieder hergestellt werden? Die Natur wird erlöst. Doch ist weiterhin guter Wille gefordert.</p><p>Gott liebt die Menschen, und nicht wenig liebt er die Menschen. Sage nicht: „Ich habe Unzucht getrieben, die Ehe gebrochen, habe schwer gesündigt, nicht einmal, sondern oft. Wird er denn verzeihen, wird er Nachsicht üben?“ Höre, was der Psalmist sagt: „Wie groß ist die Menge deiner Erbarmungen, o Herr!“ Nicht übersteigen deine aufgehäuften Sünden die Menge der Erbarmungen Gottes; nicht übersteigen deine Wunden die Erfahrung und Kunst des Arztes. Nur gläubige Hingabe ist gefordert. Offenbare dem Arzt dein Leiden und sprich mit David: „Ich habe es gesagt: bekennen will ich wider mich meine Missetat dem Herrn“. Dann wirst auch du an dir erfahren, was im Anschluß daran weiter gesagt ist: „Du läßt die Sünde meines Herzens nach.“</p><p>[Forts. v. ] Willst du, der du erst seit kurzem zu den Katechesen kommst, Gottes Liebe zu den Menschen sehen? Willst du sehen Gottes Liebe zu den Menschen und das reiche Maß seiner Langmut? Laß dir über Adam erzählen! Adam, der erste Mensch, den Gott erschaffen hatte, war ungehorsam. Hätte Gott nicht sofort die Todesstrafe über ihn verhängen können? Doch sieh, was tut der Herr in seiner so großen Menschenliebe? Er vertreibt ihn zwar aus dem Paradiese; denn seiner Sünde wegen durfte er dort nicht bleiben. Doch weist er ihm einen Wohnsitz dem Paradiese gegenüber an, damit er den Ort sehe, aus dem er vertrieben wurde, sehe, wie tief er fiel, und so sich bekehre und Rettung finde. Der erstgeborene Mensch, Kain, der sich erfinderisch im Laster zeigte, der Erzmörder, der an der Spitze der Neider steht, hatte seinen Bruder erschlagen. Doch wie lautet das Urteil über den Brudermörder? „Seufzen und zittern sollst du auf Erden“. Groß war die Sünde, klein die Strafe.</p><p>Auch hierin zeigte sich wahrlich Gottes Liebe zu den Menschen, allerdings noch nicht in dem Maße wie später. Denke nur an die Geschichte Noës! Die Riesen sündigten und groß war die Sünde, die sich damals auf Erden ausbreitete. Ihretwegen sollte die Sintflut hereinbrechen. Es war im fünfhundersten Jahre, daß Gott die Drohung aussprach, aber erst im sechshundertsten Jahre ließ er die Überschwemmung über das Land kommen. Wie du siehst, war die Liebe Gottes zu den Menschen so groß, daß sie sich auf hundert Jahre ausdehnte. Hätte denn Gott das, was er damals nach hundert Jahren geschehen ließ, nicht sofort tun können? Doch er verschob es in der Absicht, Gelegenheit zur Buße zu geben. Siehst du Gottes Güte? Wenn die Menschen damals sich bekehrt hätten, dann wäre Gottes Liebe zu ihnen nicht spurlos an ihnen vorübergegangen.</p><p>Gehen wir noch zu anderen über, welche Buße getan haben und erlöst worden sind! Es könnte ja auch eine unter den Frauen erklären: „Ich habe Unzucht getrieben, die Ehe gebrochen, meinen Leib durch Ausschweifungen jeglicher Art befleckt. Gibt es noch eine Erlösung?“ Sieh nur hin, o Weib, auf Rahab und hoffe auch du noch auf Erlösung! Wenn nämlich sie, die eine öffentliche und gemeine Hure war, Buße tat und so Erlösung fand, soll dann eine Frau, welche, noch ehe sie die Gnade empfing, nur gelegentlich einmal Unzucht trieb, nicht durch Buße und Fasten das Heil erlangen? Erkundige dich nur, welches denn der Weg ist, auf welchem jene zum Heil gelangt war. Sie sprach nur das Wort: „Euer Gott ist im Himmel und auf Erden“. „Euer Gott“ (sagte sie); denn ihrer Schlechtigkeit wegen wagte sie nicht, ihn ihren Gott zu nennen. Willst du ein schriftliches Zeugnis dafür, daß sie das Heil erlangt hat: du findest es in den Psalmen aufgeschrieben: „Der Rahab und Babylons werde ich gedenken, welche mich kennen“. O große Menschenliebe Gottes, welche selbst der Huren in der Schrift gedenkt! Es heißt nicht einfach „Der Rahab und Babylons werde ich gedenken“, sondern es steht dabei „welche mich kennen“. Es gibt also sowohl für Männer als auch für Frauen ein Heil, das durch Buße erworben wird.</p><p>Selbst wenn ein ganzes Volk sündigt, wird die Liebe Gottes zu den Menschen nicht besiegt. Das Volk machte ein goldenes Kalb, doch Gott fiel nicht ab von seiner Menschenliebe. Die Menschen verleugneten Gott, doch Gott verleugnete nicht sich selbst. „Dieses sind deine Götter, Israel“, erklärte man, und doch wurde der Gott Israels wieder wie gewöhnlich ihr Erlöser. Aber nicht allein das Volk sündigte, sondern auch Aaron, der Hohepriester. Denn Moses sagt: „Und über Aaron kam der Zorn des Herrn; da betete ich für ihn“ — erklärt er — „und Gott verzieh ihm“. Moses hat damals durch das Gebet für den Hohenpriester, der sündigte, den Herrn besänftigt. Jesus, der Eingeborene, aber soll durch sein Gebet für uns Gott nicht besänftigen? Für jenen war die Sünde kein Hindernis, Hohepriester zu werden; für dich aber soll sie, weil du von den Heiden kommst, ein Hindernis sein, erlöst zu werden? O Mensch, tue weiterhin Buße, und die Gnade ist dir nicht verwehrt! Führe in Zukunft einen untadeligen Lebenswandel! Denn Gott liebt wahrhaft die Menschen, und niemand wird seine Menschenliebe entsprechend zum Ausdruck bringen können. Selbst wenn alle Menschenzungen sich zugleich zusammentäten, würde man nicht einmal einen Teil der Menschenliebe Gottes entsprechend ausdrücken können. Was wir berichten, ist nur ein Teil von dem, was über seine Menschenliebe geschrieben steht. Was er den Engeln verziehen hat, darüber wissen wir nichts. Auch ihnen verzeiht er ja; denn einer allein, Jesus, der uns von den Sünden reinigt, ist frei von Sünden. Darüber genug.</p><p>Willst du, daß dir in unserem Interesse noch andere Vorbilder der Buße vorgeführt werden, so gehe hin zum seligen David und nimm ihn als Vorbild der Buße! Der große Mann fiel. Nach der nachmittägigen Ruhe erging er sich auf seinem Hause, schaute unvorsichtig umher und fiel nach Menschenart. Die Sünde geschah, doch starb damit nicht die aufrichtige Bereitwilligkeit, das Verbrechen zu bekennen. Es kam Nathan, der Prophet, verwies ihn sogleich und heilte die Wunde. „Der Herr erzürnte“, — sagt er — „du hast gesündigt.“ Der einfache Mann sprach’s zum König, König David aber zeigte keinen Unwillen. Denn nicht achtete er auf den, der sprach, sondern auf den, der diesen gesandt hatte. Nicht war er aufgeblasen wegen seines großen militärischen Hofstaates. Denn er dachte an die Engelschar des Herrn und zitterte vor dem Unsichtbaren, als wenn er ihn gesehen hätte. Und zu dem, der gekommen war, vielmehr durch ihn zu dem, der ihn gesandt hatte, spricht er: „Ich habe gesündigt dem Herrn“. Siehst du die Demut des Königs? Nimmst du wahr sein Bekenntnis? War er denn etwa von jemandem überführt worden? Wußten etwa viele von seiner Tat? Rasch wurde die Tat vollbracht, sogleich war der Prophet da als Kläger, und der Frevler bekennt seine Sünde. Da er seine Bereitwilligkeit bekannte, erhielt er auch augenblicklich Heilung. Denn der Prophet Nathan, welcher (soeben) gedroht hatte, erklärt sogleich: „Und der Herr hat deine Sünde weggenommen“. Siehst du, wie gar rasch sich Gott aus Liebe zu den Menschen ändert? „Doch“ — sagt Nathan — „gereizt hast du die Feinde des Herrn. Zahlreich waren zwar deine Feinde wegen deiner Gerechtigkeit; doch schützte dich deine Keuschheit. Da du aber deine beste Waffe weggeworfen hast, so mußt du es haben, wenn deine Feinde bereit stehen, sich wider dich zu erheben.“ Auf diese Weise belehrte ihn der Prophet.</p><p>[Forts. v. ] Wenn auch dem seligen David das Wort, das er zu hören bekam, feststand, nämlich „Der Herr hat deine Sünde hinweggenommen“, so ließ der König nicht nach in der Bußgesinnung, kleidete sich statt mit Purpur mit einem Sacke, setzte sich statt auf goldenen Thron auf Asche und bloßen Boden. Doch nicht nur saß er auf Asche, er aß auch Asche, wie er selbst sagt: „Asche aß ich als Brot, und mit Tränen mischte ich den Trank“. In Tränen ließ er das lüsterne Auge zerfließen. „Jede Nacht“ — sagte er — „wasche ich mein Bett; mit Tränen benetze ich meine Lagerstätte“. Mochten auch seine Beamten ihn zum Essen auffordern, nicht gab er ihnen nach. Eine ganze Woche fastete er. Wenn ein König in solcher Weise seine Sünden bekannte, sollst du, ein einfacher Mann, deine Sünden nicht bekennen? Als dem David nach Absaloms Empörung viele Wege zur Flucht offen standen, wählte er die Flucht über den Ölberg, gerade als hätte er im Geiste den Erlöser, der vom Ölberg aus in den Himmel auffahren wollte, angerufen. Da Semei wider David bittere Fluchworte ausrief, antwortet er: „Lasset ihn!“ Denn er wußte, daß dem, der vergibt, vergeben werden wird.</p><p>Siehst du, daß es gut ist, seine Schuld zu bekennen? Siehst du, daß, wer Reue hat, erlöst wird? Auch Salomon war gefallen. Doch was sagt er später? „Bereut habe ich es „. Ein ganz gesetzwidriges Verhalten bekundete Achab, der König von Samaria. Er war ein Götzendiener, ein Unmensch, ein Prophetenmörder. Von Frömmigkeit wollte er nichts wissen, dagegen gelüstete es ihn nach fremden Äckern und Weinbergen. Als er aber den Naboth durch Jezabel hatte töten lassen, und als der Prophet Elias gekommen war, nur um zu drohen, zerriß er seine Kleider und zog einen Sack an. Was sagt da der menschenfreundliche Gott zu Elias? „Siehst du, wie Achab vor mir zerknirscht wurde? Gerade als suchte er den feurigen Propheten zu bewegen, sich mit ihm zum reuigen König herabzulassen. „Nicht werde ich“ — fährt er fort — „Unglück bringen in seinen Tagen“. Trotzdem jener nach erhaltener Verzeihung von seiner Sünde nicht nachlassen wollte, verzeiht der Gnädige, und zwar obwohl er die Zukunft kannte. Er schenkt Verzeihung, weil sie gerade zur Zeit der Buße am Platze war. Ist ein Richter gerecht, dann entscheidet er nämlich so, wie es gerade der einzelnen Tat entspricht.</p><p>[Forts. v. ] Jeroboam stand am Altare, den Götzen zu opfern. Da verdorrte seine Hand, weil er befahl, den Propheten zu fesseln, der ihn zurechtgewiesen hatte. Da er aus Erfahrung die Macht dessen kannte, der vor ihm stand, sagt er: „Bitte für mich den Herrn!“ Auf dieses Wort hin wurde seine Hand wieder gesund. Wenn der Prophet den Jeroboam heilte, soll Christus nicht dich von den Sünden heilen und erlösen können?</p><p>Auch Manasses war ein großer Sünder. Er ließ Isaias zersägen, befleckte sich durch Götzendienst aller Art und füllte Jerusalem an mit dem Blute Unschuldiger. Als er jedoch gefangen nach Babylon gefühlt wurde, ließ er sich durch das Unglück belehren und tat heilsame Buße. Die Schrift berichtet nämlich: „Manasses demütigte sich vor dem Herrn und betete; der Herr aber erhörte ihn und führte ihn zurück in sein Reich“. Wenn der, welcher den Propheten zersägen ließ, durch Buße Rettung fand, sollst du, der du keine solche Sünde begangen hast, nicht erlöst werden?</p><p>Zweifle doch nicht töricht an der Kraft der Reue! Willst du die Kraft der Reue kennen lernen? Willst du kennen lernen dieses vorzügliche Heilmittel und die Kraft des Schuldbekenntnisses? 185 000 Feinde hat Ezechias durch sein Schuldbekenntnis in die Flucht geschlagen. Fürwahr ein gewaltiges Ereignis, doch noch klein im Vergleich mit dem, das ich nun erzählen will. Derselbe Ezechias hat durch Buße ein bereits gefälltes göttliches Urteil rückgängig gemacht. Als er krank darniederlag, sprach zu ihm Isaias: „Bringe deine häuslichen Angelegenheiten in Ordnung, denn du stirbst und nicht wirst du leben“. Was konnte er noch erwarten? Wie konnte er nach dem Worte des Propheten „du stirbst“ Genesung hoffen? Gleichwohl hörte Ezechias nicht auf, Buße zu tun. Eingedenk des schriftlichen Wortes: „Wenn du dich bekehrst und seufzest, wirst du leben“, kehrte er sich gegen die Wand und ließ seine Gedanken vom Bette zum Himmel gehen; denn dicke Mauern sind kein Hindernis für fromme Gebete, die zum Himmel gesandt werden. Er betet: „Herr, gedenke meiner! Um mich gesund zu machen, genügt es, daß du meiner gedenkest. Nicht bist du von der Zeit abhängig, du selbst bist der Gesetzgeber des Lebens. Nicht wird ja, wie manche in törichter Weise lehren, unser Leben von der Geburt und der Stellung der Gestirne bestimmt. Sondern gerade du selbst bestimmst nach deinem Willen das Leben und die Lebensdauer.“ Und dem, der mit Rücksicht auf die Worte des Propheten keine Hoffnung hatte zu leben, wurde das Leben um fünfzehn Jahre verlängert; zum Zeichen hierfür legte die Sonne ihren Lauf noch einmal zurück. Um den Unterschied zwischen Ezechias und Jesus anzuzeigen, ging die Sonne um des Ezechias willen zurück, während die Sonne Jesu wegen nicht umkehrte, sondern völlig verschwand. Wenn nun Ezechias die Kraft hatte, ein göttliches Urteil aufzuheben, soll dann nicht Jesus Nachlassung der Sünden schenken? Kehre auch du um und seufze! Verschließe die Türe und bete zu dem, der das Verborgene sieht, damit er die bereiteten Qualen des Feuers von dir fernhalte! Denn das Schuldbekenntnis vermag sogar Feuer zu löschen, es vermag sogar Löwen zu bändigen.</p><p>[Forts. v. ] Hast du kein Vertrauen, dann denke an die Geschichte des Ananias und seiner Freunde! Welche Wasser haben sie ausgegossen? Wie groß war die Wassermenge, welche die Feuerflammen zu löschen vermochte, die 49 Ellen hoch emporgestiegen waren? Wo die Flamme gewaltig emporloderte, da gossen sie den Glauben gleich einem Strome aus und sprachen zur Abwehr des Unheiles: „Gerecht bist du, o Herr, in allem, was du mit uns getan hast! Denn gesündigt haben wir und gesetzlos gehandelt“. Und ihre Bußgesinnung löschte die Flammen. Wenn du daran zweifelst, daß Bußgesinnung das Feuer der Hölle zu löschen vermag, so lasse dich durch die Geschichte des Ananias belehren! Doch — wird ein findiger Zuhörer einwenden — Gott hat damals gerecht gehandelt, als er jene rettete; da sie sich nicht für den Götzendienst gewinnen ließen, gab ihnen Gott wunderbare Kraft. Ist dem so, dann wenden wir uns noch einem anderen Beispiel der Buße zu.</p><p>Welche Meinung hast du von Nabuchodonosor? Ist dir nicht aus der Schrift seine Blutgier, seine Wildheit, seine Löwennatur bekannt? Ist dir nicht bekannt, daß er die Gebeine der Könige aus ihren Gräbern genommen hat? Weißt du nicht, daß er das Volk in Gefangenschaft geführt hat? Hast du nicht davon gehört, daß er den König (Sedekias), nachdem er hatte zusehen müssen, wie seine Kinder hingeschlachtet werden, blenden ließ? Hast du nicht davon gehört, daß er die Cherubim zerschlagen ließ; nicht meine ich die geistigen Cherubim — ferne sei, o Mensch, solche Annahme! — sondern die gegossenen Cherubim. Hast du nicht davon gehört, daß er den Gnadenthron, aus dessen Mitte Gott zu sprechen pflegte, zerstörte, den Vorhang des Heiligtums mit Füßen trat? Das Rauchfaß raubte er, um es in einen Götzentempel zu bringen. Alle Opfergaben entwendete er. Den Tempel ließ er von Grund aus niederbrennen. Welche Strafen hätte Nabuchodonosor dafür verdient, daß er Könige mordete, das Heiligtum anzündete, das Volk in Gefangenschaft führte, die heiligen Gefäße in Götzentempel stellte! Hätte ihm nicht tausendmal der Tod gebührt?</p><p>[Forts. v. ] Nachdem du die Größe seiner Sünden gesehen hast, achte nun auch auf Gottes Liebe zu den Menschen! Nabuchodonosor wurde zu einem wilden Tiere, lebte in der Wüste, geißelte sich, um erlöst zu werden. Er hatte Krallen wie ein Löwe; hatte er doch die Heiligtümer geraubt. Er hatte Haare gleich einem Löwen; denn er war ein raubgieriger brüllender Löwe. „Gleich dem Ochsen fraß er Gras“; denn ein Rind war er, da ihm der Verstand fehlte, zu erkennen, wer ihm das Reich gegeben hatte. „Sein Leib wurde vom Tau befeuchtet“; denn als er sah, wie das Feuer vom Tau gelöscht wurde, glaubte er nicht. Und was geschah? „Hierauf“ — sagt er — „erhob ich, Nabuchodonosor, meine Augen zum Himmel, pries den Höchsten, lobte und verherrlichte den, der in Ewigkeit lebt.“ Da er nun den Höchsten erkannte, seine Dankgebete zu Gott sandte, seine Taten bereute, die eigene Schwäche einsah, gab ihm Gott die königliche Würde zurück.</p><p>Wenn nun Gott dem Nabuchodonosor, der gefrevelt, aber seine Schuld bekannt hatte, Verzeihung und Königswürde geschenkt hat, soll er dann nicht dir, wenn du Reue erweckst und einen würdigen Lebenswandel beobachtest, Nachlassung der Sünden und das Reich des Himmels geben? Der Herr liebt die Menschen, schnell ist er bereit zum Verzeihen, langsam schreitet er zur Strafe. Niemand verzweifle also an seinem eigenen Heile!</p><p>Petrus, das Haupt und der Führer der Apostel, verleugnete vor einer geringen Magd dreimal den Herrn. Doch erfaßte ihn Reue, und er weinte bitterlich. Seiner Tränen bezeugen, daß die Reue von Herzen kam. Ihm wurde darum nicht nur die Verleugnung verziehen, er erhielt sogar die unauslöschliche Würde des Apostolates.</p><p>[Forts. v. ] Da ihr, Brüder, viele Beispiele von Sündern habt, welche Buße getan und Erlösung gefunden haben, so sollt auch ihr bereit sein, dem Herrn eure Schuld zu bekennen, auf daß ihr Nachlassung eurer Sünden erhaltet, der Himmelsgabe würdig werdet und mit allen Heiligen das himmlische Reich erbet durch Jesus Christus, dem die Ehre ist in alle Ewigkeit. Amen.III. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Taufe.</p><h2>4</h2><p>* Über die Taufe.*</p><p>„Freuet euch, Himmel, und juble, Erde“, um derentwillen, welche mit Ysop werden besprengt und durch den geistigen Ysop werden gereinigt werden in der Kraft dessen, der in seinem Leiden mittels Ysop und Rohr getränkt worden war! Die himmlischen Kräfte sollen sich freuen! Die Seelen aber, welche sich mit ihrem geistigen Bräutigam verbinden wollen, sollen sich vorbereiten. Denn „die Stimme eines Rufenden in der Wüste: bereitet den Weg des Herrn!“ Es handelt sich ja nicht um eine Kleinigkeit oder um eine gewöhnliche fleischliche Verbindung, die nicht überlegt wird, sondern um die auf Grund des Glaubens erfolgende Auserwählung des Geistes, der alles erforscht. Bei irdischen Verehelichungen und Verbindungen entscheidet keineswegs der Verstand, sondern wo Reichtum und Schönheit ist, da greift der Bräutigam schnell zu. Hier dagegen verlangt der Bräutigam nicht körperliche Schönheit, sondern reines Gewissen, nicht verwerflichen Mammon, sondern Reichtum frommer Seelen.</p><p>Ihr Kinder der Gerechtigkeit, folget also der Mahnung des Johannes: „Bereitet den Weg des Herrn! Schaffet hinweg alles, was anstößig ist und im Wege steht, damit ihr geraden Weges zum ewigen Leben gelanget! Um den Hl. Geist zu empfangen, reiniget die Gefäße der Seele durch ungeheuchelten Glauben! Fanget an, eure Kleider durch Buße zu reinigen, damit ihr, wenn man euch ins Brautgemach ruft, rein befunden werdet! Der Bräutigam ruft zwar alle ohne Ausnahme; denn reichlich gibt er Gnade, und der laute Ruf der Herolde ladet alle ein. Später aber scheidet der Bräutigam unter denen aus, welche zur geistlichen Hochzeit gekommen sind. Möge keiner von denen, deren Name im Verzeichnis eingetragen ist, nun das Wort zu hören bekommen: „Freund, wie bist du ohne hochzeitliches Gewand hierhergekommen?“ Möget ihr alle das Wort hören: „Wohlan, du guter und getreuer Knecht! Über Weniges warst du getreu, über Vieles werde ich dich setzen. Gehe ein in die Freude deines Herrn!“ Jetzt stehst du noch vor der Türe. Möchtet ihr alle sagen können: „Der König führte mich in sein Gemach“. „Es juble meine Seele über den Herrn! Er kleidete mich mit dem Gewande des Heiles und dem Kleide der Freude. Wie einem Bräutigam hat er mir die Kopfbinde umgelegt, und wie eine Braut hat er mich mit Schmuck geschmückt“. Jeder von euch soll zeigen, daß seine Seele „ohne Makel oder Runzel oder dergleichen“ ist! Natürlich nicht vor dem Empfange der Gnade (═ die Taufe). Wie wäre das möglich, da ihr ja erst zur Nachlassung der Sünden berufen werdet? Vielmehr soll, wenn einmal die Gnade (═ die Taufe) gegeben wird, das Gewissen rein befunden werden, damit es mit der Gnade laufen könne.</p><p>Brüder, es ist wahrlich eine große Sache, und ihr müßt daher mit Aufmerksamkeit zu ihr hintreten. Jeder von euch soll Gott vorgestellt werden in Gegenwart von Myriaden von Engelheeren. Der Hl. Geist wird eure Seelen besiegeln. Ihr werdet in den Heeresdienst des großen Königs treten. Bereitet euch also vor, rüstet euch, nicht durch Entfaltung von Kleiderpracht, sondern durch Seelenreinheit und Frömmigkeit! In dem Bade (der Taufe) sollst du nicht gewöhnliches Wasser sehen, achte vielmehr auf die geistige Gnade, die mit dem Wasser gegeben wird! Gleichwie die Gaben, welche auf den Altären (der Heiden) geopfert werden, gewöhnliche Naturdinge sind und erst durch Anrufung der Götzen unrein werden, ebenso erhält andererseits gewöhnliches Wasser unter Anrufung des Hl. Geistes, Christi und des Vaters heiligende Kraft.</p><p>Da der Mensch ein Doppelwesen ist, aus Leib und Seele besteht, darum gibt es auch eine zweifache Reinigung, eine unkörperliche für den Geist und eine körperliche für den Körper. Das Wasser reinigt den Körper, der Geist besiegelt die Seele, auf daß wir, wenn die Seele vom Geiste besprengt und der Körper im reinen Wasser gereinigt ist, zu Gott gelangen. Wenn du also in das Wasser hinabsteigen wirst, dann denke nicht bloß an das Wasser, sondern empfange das Heil in der Kraft des Hl. Geistes! Zur Vervollkommnung ist beides (═ Wasser und Geist) notwendig. So lehre nicht ich, sondern der Herr Jesus Christus, der Herr des Sakramentes. Er sagt nämlich: „Wenn einer nicht wiedergeboren wird, bezw. wenn einer nicht geboren wird aus Wasser und Geist, kann er in das Reich Gottes nicht eingehen. Einerseits ist der, welcher mit dem Wasser getauft wird, nicht jedoch des Geistes gewürdigt ist, nicht im Vollbesitz der Gnade; andererseits kann einer ein Tugendheld sein, wird aber doch nicht, sofern er nicht durch das Wasser das Siegel erhalten hat, in das Himmelreich eingehen. Eine kühne Lehre, doch stammt sie nicht von mir! Jesus hat sie geoffenbart. Die göttliche Schrift möge euch die Lehre beweisen. Cornelius, ein gerechter Mann, wurde der Erscheinung von Engeln gewürdigt und hatte seine Gebete und Almosen wie eine herrliche Säule im Himmel bei Gott aufgestellt. (Zu ihm) kam Petrus, der Geist wurde über die Gläubigen ausgegossen, und sie redeten in fremden Sprachen und weissagten. Nachdem sie die Gnade des Geistes empfangen hatten, da — so heißt es in der Schrift — „befahl Petrus, sie im Namen Jesu Christi zu taufen“, damit nicht nur die Seele durch den Glauben wiedergeboren sei, sondern auch der Körper durch das Wasser an der Gnade teilhabe.</p><p>Wenn einer wissen möchte, warum die Gnade (der Taufe) durch Wasser und nicht durch ein anderes Element vermittelt wird, möge er die göttliche Schrift zur Hand nehmen und er wird Antwort finden. Das Wasser ist etwas Großes und von den vier sichtbaren Elementen der Welt das schönste. Der Himmel ist der Aufenthaltsort der Engel; die Himmel aber bestehen aus Wasser. Die Erde ist die Wohnstätte der Menschen; die Erde aber besteht aus Wasser. Vor dem ganzen Sechstagewerk „schwebte der Geist Gottes über dem Wasser. Der Anfang der Erde ist das Wasser, und am Anfang der evangelischen Geschichte ist der Jordan. Das Meer war es, welches Israel von dem Pharao befreit hatte; die Waschung mit Wasser in Verbindung mit dem Worte Gottes ist es, welche die Welt von den Sünden befreit. Bei jedem Bündnis findest du Wasser. Es war nach der Sintflut, daß der Bund mit Noë geschlossen worden war. Wasser, purpurfarbene Wolle und Ysop waren die Mittel, mit welchen auf dem Berge Sinai der Bund mit Israel geschlossen worden war. Nicht ohne Wasser wird Elias aufgenommen; erst nachdem er den Jordan durchschritten hat, fährt er mit Pferden zum Himmel. Der Hohepriester opfert erst Weihrauch, wenn er die Waschung vorgenommen hat. Aaron ist erst, nachdem er sich gewaschen hatte, Hoherpriester geworden. Denn wie konnte jemand, ohne zuvor im Wasser sich gereinigt zu haben, für die Mitmenschen beten. Ein Vorbild der Taufe ist auch das Waschbecken gewesen, das im Innern der Stiftshütte aufgestellt war.</p><p>Das Ende des Alten und der Anfang des Neuen Bundes ist die Taufe. Ihr erster Spender war nämlich Johannes, der größte unter den von Weibern Geborenen, der Schluß der Propheten. „Denn alle Propheten und das Gesetz waren (nur) bis Johannes“. Er ist der Anfang der evangelischen Geschichte. Denn es heißt: „Anfang des Evangeliums Jesu Christi..... Johannes taufte in der Wüste“. Du wirst einwenden, Elias, der Thesbite, sei (sogar) in den Himmel aufgefahren. Gleichwohl ist er nicht größer als Johannes. Mag auch Enoch „hinweggenommen“ worden sein, er ist nicht größer als Johannes. Moses ist der größte Gesetzgeber, und bewundernswert sind die Propheten alle; dennoch sind sie nicht größer als Johannes. Ich für mich würde es nicht wagen, unter den Propheten Vergleiche anzustellen; aber der Herr Jesus, der Herr der Propheten und unser Herr, hat es gelehrt: „Unter den von Weibern Geborenen ist keiner erstanden, der größer gewesen wäre als Johannes“. Nicht (heißt es) unter den von Jungfrauen, sondern unter den von Weibern Geborenen. Der große Knecht wird verglichen mit den Mitknechten; der Sohn (Gottes) dagegen ist über den Knechten in unvergleichlicher Erhabenheit und Majestät.</p><p>Ist dir bekannt, wer derjenige war, den Gott sich zum ersten Spender dieser Gnade (═ der Taufe) erwählt hat? Er war ein Mann ohne Besitz; er liebte die Wüste, ohne jedoch die Menschen zu hassen. Er aß Heuschrecken, seine Seele beflügelnd. Er nährte sich von Honig; seine Worte waren aber noch süßer und heilsamer als Honig. Er trug ein Gewand aus Kamelhaaren; sein Leben wurde zum Muster der Askese. Als er noch im Schoße der Mutter war, wurde er vom Hl. Geist geheiligt. Mag auch Jeremias geheiligt worden sein, aber er zeigte sich nicht im Mutterschoße als Propheten. Nur Johannes war es, der im Mutterleibe vor Freude aufhüpfte. Und wenn er auch nicht mit leiblichen Augen den Herrn sah, so erkannte er ihn doch im Geiste.</p><p>Da groß war die Gnade der Taufe, bedurfte sie auch eines großen Spenders.</p><p>Johannes taufte im Jordan, und ganz Jerusalem kam zu ihm hinaus, um die erste Taufe zu empfangen; denn Jerusalem hat in allem Guten den Vorzug. Aber, ihr Bewohner von Jerusalem, denket daran, in welcher Weise die damaligen Bewohner von Jerusalem, als sie (zu Johannes) hinausgingen, von ihm sich taufen ließen! „Sie bekannten“ —heißt es — „ihre Sünden“. Zunächst zeigten sie ihre Wunden, dann legte Johannes Heilmittel darauf und verlieh den Gläubigen Befreiung vom ewigen Feuer. Willst du dich davon überzeugen, daß die Taufe des Johannes Befreiung vom angedrohten Feuer ist, dann höre auf sein Wort:.„Natterngezücht, wer hat euch gelehrt, dem künftigen Zorne zu entfliehen?“ Sei also fernerhin keine Natter mehr! Sondern, wenn du ehedem Natterngezücht gewesen bist, dann ziehe — so will gesagt sein — aus, was früher sündhaft in deinem Leben war! Jede Schlange verliert, wenn sie sich in eine enge Spalte verkriecht, ihr Alter, und wenn sie ihr Alter in der Enge abgestreift hat, verjüngt sich ihr Körper. So sollst auch du — will gesagt sein — durch die schmale und enge Pforte eintreten, dich durch Fasten bezähmen und das Verderben von dir verdrängen. Ziehe aus den alten Menschen mit seinen Werken und sprich, wie es im Hohenliede heißt: „Ich habe mein Gewand ausgezogen, wie soll ich es anlegen?“</p><p>Sollte unter euch vielleicht ein Heuchler sein, einer, der Menschen gefallen möchte, ein Scheinheiliger, dessen Glaube nicht im Herzen wohnt, einer, der Simon dem Magier gleicht; sollte einer gekommen sein, nicht um an der Gnade teilzuhaben, sondern um auszuspionieren, was gespendet wird: er möge sich von Johannes sagen lassen: „Bereits ist die Axt an die Wurzel der Bäume gelegt; jeder Baum, der keine gute Frucht trägt, wird ausgehauen und ins Feuer geworfen“. Unerbittlich ist der Richter. Fort mit der Heuchelei!</p><p>Was ist nun Pflicht? Worin bestehen die Früchte der Buße? „Wer zwei Röcke hat, gebe demjenigen einen Rock, der keinen hat, und wer Speisen hat, tue desgleichen! Du willst die Gnade des Hl. Geistes genießen? Die Armen aber würdigest du nicht irdischer Speisen? Du strebst nach großen Gütern, bist aber nicht freigebig mit den kleinen?</p><p>Magst du auch ein Zöllner, ein unzüchtiger Mensch gewesen sein, hoffe auf Erlösung! „Die Zöllner und Buhlerinnen kommen vor euch in das Reich Gottes“. Und Paulus bestätigt es: „Nicht Unzüchtige, nicht Götzendiener..... werden das Reich Gottes erben. Das sind einige von euch gewesen. Doch ihr habt euch gewaschen, ihr seid geheiligt worden“. Nicht heißt es „das sind einige von euch“, sondern „das sind einige von euch* gewesen*“. Wer aus Unwissenheit sündigt, erhält Verzeihung; wer hartnäckig in der Sünde verharrt, wird verdammt.</p><p>[Forts. v. ] Dein Stolz, wenn du getauft wirst, ist der eingeborene Gottessohn selbst. Wozu soll ich also noch weiter über einen Menschen sprechen? Groß war zwar Johannes, doch was ist er gegen den Herrn? Groß war seine Stimme, doch was ist sie gegen den Logos? Gar mächtig war der Herold, doch was ist er gegen den König? Mächtig war der, der mit Wasser taufte, aber was ist er gegenüber dem, der mit dem Hl. Geist und mit Feuer tauft? Mit Hl. Geist und mit Feuer hat nämlich der Erlöser die Apostel getauft, als „plötzlich vom Himmel her ein Brausen entstand gleich dem eines daherfahrenden gewaltigen Windes und das ganze Haus erfüllte, in dem sie saßen, und ihnen geteilte Zungen wie von Feuer erschienen, auf jeden einzelnen von ihnen sich niederließen und alle vom Hl. Geist erfüllt wurden“.</p><p>Wer die Taufe nicht empfängt, für den gibt es kein Heil. Eine Ausnahme bilden nur die Märtyrer, welche auch ohne Wasser das Reich erhalten. Als der Heiland am Kreuze den Erdkreis erlöste, floß nämlich aus seiner Seitenwunde Blut und Wasser, damit, wer in friedlicher Zeit lebe, im Wasser getauft werde, wer dagegen in eine Zeit von Verfolgungen falle, im eigenen Blut die Taufe erhalte. Auch bezeichnet ja der Heiland das Martyrium als Taufe; denn er sagt: „Vermöget ihr den Kelch zu trinken, den ich trinke, und mit der Taufe die ich empfange, getauft zu werden?“</p><p>Die Märtyrer legen ihr Glaubensbekenntnis ab, „ein Schauspiel für die Welt, die Engel und Menschen“; bald sollst auch du das Bekenntnis ablegen. Doch noch nicht ist es Zeit, mit dir hierüber zu sprechen.</p><p>Jesus hat, als er selbst getauft wurde, die Taufe geheiligt. Wenn der Sohn Gottes getauft worden ist, wer könnte die Taufe verschmähen, ohne als gottlos bezeichnet zu werden? Doch wurde er nicht getauft, um Verzeihung von Sünden zu erlangen; denn er war ohne Sünde. Vielmehr wurde der Sündelose getauft, um Gottes Gnade und Würde den Getauften zu vermitteln. Gleichwie Jesus nämlich „wegen des Anteils der Kinder an Blut und Fleisch ebenfalls daran teilgenommen hat“, damit wir nicht nur mit ihm die fleischliche Erscheinung, sondern auch die göttliche Gnade gemeinsam haben, so ließ er sich taufen, damit wir auch durch die Taufe wiederum gemeinschaftlich Heil und Herrlichkeit besitzen. Nach Job war in den Wassern der Drache, der den Jordan mit seinem Rachen aufnahm. Da die Häupter des Drachen zerschmettert werden sollten, stieg Jesus in das Wasser und band den Gewaltigen, damit wir die Macht erhalten, „auf Schlangen und Skorpionen zu treten“. Es war kein kleines, sondern ein furchtbares Tier. Kein Fischerboot konnte auch nur eine einzige Schuppe von seinem Schwanze bekommen. Vor ihm her lief das Verderben, Unheil bereitend denen, die entgegen kamen. Da eilte auf dasselbe zu das Leben, um für immer den Tod zu knebeln, auf daß wir alle gerettet werden und sagen können: „Wo ist, o Tod, dein Stachel? Wo ist, o Hölle, dein Sieg?“ Durch die Taufe wird der Todesstachel vernichtet.</p><p>[Forts. v. ] Zwar steigst du mit Sünden beladen in das Wasser, aber wenn du die Gnade angerufen hast und deine Seele besiegelt worden ist, brauchst du dich nicht mehr von dem furchtbaren Drachen verschlingen zu lassen. Von der Sünde getötet, steigst du hinab, in Gerechtigkeit zum Leben erweckt, kommst du heraus. Wenn du nämlich „der Ähnlichkeit des Todes des Erlösers eingepfropft wirst“, dann wirst du auch der Auferstehung gewürdigt werden. Denn wie Jesus die Sünden der Welt auf sich nahm und starb, um nach Ertötung der Sünde in Gerechtigkeit aufzustehen, so wirst du, wenn du in das Wasser hinabgestiegen und gewissermaßen wie im Felsengrabe begraben bist, wiederum auferweckt, „in Neuheit des Lebens wandelnd“.</p><p>[Forts. v. ] Bist du der Gnade gewürdigt, erst hierauf gibt dir Jesus die Kraft, gegen die feindlichen Mächte zu kämpfen. Gleichwie er nämlich nach der Taufe vierzig Tage versucht wurde — nicht als ob er nicht schon zuvor hätte (den Widersacher) besiegen können, er wollte vielmehr in allem, was er tat, eine gewisse Ordnung einhalten —, so sollst du, der du vor der Taufe den Kampf mit den Feinden nicht gewagt hättest, dann, wenn du die Gnade erhalten hast und für die Zukunft gestärkt bist, den Kampf mit den Waffen der Gerechtigkeit kämpfen und, wenn du willst, das Evangelium verkünden.</p><p>Jesus Christus war der Sohn Gottes. Gleichwohl verkündete er das Evangelium nicht vor der Taufe. Wenn der Herr selbst ordnungs- und zeitgemäß verfuhr, sollen dann wir, seine Diener, ohne Einhaltung der Ordnung etwas wagen? Erst damals begann Jesus zu predigen, als der Hl. Geist in sichtbarer Gestalt gleich einer Taube auf ihn herabgekommen war. Nicht sollte Jesus ihn zum erstenmal sehen; denn er kannte ihn schon, ehe er leiblich erschienen war. Vielmehr sollte ihn Johannes der Täufer schauen. „Denn“ — sagt er — „ich kannte ihn nicht; doch der, welcher mich gesandt hatte, mit Wasser zu taufen, sprach zu mir: Derjenige, auf den du den Geist herabsteigen und auf dem du ihn bleiben siehst, der ist es“. Wenn nun deine Frömmigkeit ebenfalls aufrichtig ist, dann kommt der Hl. Geist auch auf dich herab, und es tönt dir von oben als väterliche Stimme entgegen nicht „dieser ist mein Sohn“, wohl aber „dieser ist jetzt mein Sohn geworden“. Nur von Jesus gilt „er ist“; denn „im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“. Von Jesus gilt „er ist“, da er jederzeit der Sohn Gottes ist. Von dir dagegen heißt es „jetzt ist er es geworden“; denn nicht von Natur aus hast du die Sohnschaft, sondern du empfängst sie gemäß einer Bestimmung, Er ist ewig (der Sohn); du aber erhältst die Gnade im Laufe der Zeit.</p><p>Richte also her das Gefäß deiner Seele, damit du ein Sohn Gottes werdest und „Erbe Gottes, Miterbe aber Christi“. Nur mußt du dich rüsten, um auch zu empfangen; nur muß der Glaube dich führen, wenn du ein Gläubiger werden willst. Du mußt zielbewußt den alten Menschen ablegen. Denn alle deine Sünden werden dir vergeben werden, sei es Unzucht, sei es Ehebruch, sei es irgendeine andere derartige Ausschweifung. Gibt es eine größere Sünde, als Christus gekreuzigt zu haben? Auch von dieser Sünde reinigt die Taufe. Als von denen, welche den Herrn gekreuzigt hatten, dreitausend (zu den Aposteln) kamen, fragten und sagten: „Was sollen wir tun, ihr Brüder? Denn groß ist unsere Wunde. Du hast uns, o Petrus, an unsern tiefen Fall erinnert, da du erklärtest: ‚Den Urheber des Lebens habt ihr getötet‘. Welches Heilmittel gibt es für solche Wunde? Welches Reinigungsmittel für solchen Schmutz? Was rettet aus solchem Verderben?“ da erklärt Petrus: Tuet Buße, und jeder von euch lasse sich taufen im Namen unseres Herrn Jesus Christus zur Vergebung der Sünden! Empfangen werdet ihr die Gabe des Hl. Geistes“. Wie unaussprechlich groß ist Gottes Liebe zu den Menschen! Sie hoffen nicht auf Erlösung und werden des Hl. Geistes gewürdigt. Erkennst du die Kraft der Taufe? Sollte einer von euch durch Lästerungen Christum gekreuzigt haben, sollte von euch einer aus Unwissenheit ihn vor Menschen verleugnet haben, sollte jemand durch sündhafte Taten Anlaß zur Lästerung des Glaubens gewesen sein, er möge Buße tun und guter Hoffnung sein. Auch jetzt noch steht euch dieselbe Gnade zur Verfügung.</p><p>„Fasse Mut, Jerusalem! Der Herr wird alle deine Sünden wegnehmen“. „Abwaschen wird der Herr den Schmutz ihrer Söhne und Töchter im Geiste des Gerichtes und im Geiste des Verbrennens“. „Er wird euch mit reinem Wasser besprengen. Und gereinigt werdet ihr werden von all euren Sünden“. Chöre von Engeln werden euch umgeben und sagen: „Wer ist diese, welche heraufsteigt, weiß glänzend, gestützt auf ihren Geliebten?“ Die Seele nämlich, welche ehedem Sklavin war, hat sich nun den Herrn selbst zum Geliebten erkoren. Dieser aber wird ihre aufrichtige Zuneigung annehmen und entgegnen: „Siehe, schön bist du, meine Freundin; siehe, schön bist du! Deine Zähne sind wie eine Herde geschorener Schafe“ — nämlich wegen des ehrlichen Bekenntnisses. „Die Schafe aber alle“ (so wird er weiter sagen) „bringen Zwillinge“; gemeint ist die zweifache Gnade, nämlich die Gnade, welche aus dem Wasser, und die, welche vom Geiste kommt, oder die vom Alten und vom Neuen Bund verkündete Gnade. Möchtet ihr alle den Lauf der Fasten vollenden, die vorgetragenen Lehren im Gedächtnis behalten, durch gute Werke Früchte bringen, tadellos vor den geistigen Bräutigam treten, um Nachlassung der Sünden von Gott zu erhalten, dem die Ehre sei mit dem Sohn und dem Hl. Geist in Ewigkeit. Amen.IV. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die zehn Glaubenslehren. Einleitung.</p><h2>5</h2><p>* Über die zehn Glaubenslehren.*</p><p>Das Laster ahmt die Tugend nach. Der Lolch will für Weizen gehalten werden; er sieht allerdings dem Weizen ähnlich, aber wer sich darauf versteht, erkennt ihn am Geschmack. „Der Teufel verkleidet sich in einen Engel des Lichtes“, nicht um dahin zurückzukehren, wo er gewesen war; denn er gleicht einem Ambos, da sein Herz unbeugsam ist und seine Gesinnung niemals Reue kennt. Er will vielmehr diejenigen, welche ein engelgleiches Leben führen, in die Finsternis der Verblendung und in den pestartigen Zustand des Unglaubens stürzen. Viele Wölfe gehen in Schafskleidern einher. Sie haben die Kleider von Schafen, nicht aber deren Klauen und Zähne. Sie legen ein zahmes Fell an, um durch ihr Aussehen die Unschuldigen zu täuschen; aus ihren Zähnen aber spritzen sie das verderbliche Gift der Gottlosigkeit. Wir brauchen darum göttliche Gnade, nüchternen Sinn, offene Augen, damit wir nicht, Lolch als Weizen essend, aus Unkenntnis Schaden leiden, damit wir nicht, den Wolf für ein Schaf haltend, ihm zur Beute fallen, damit wir nicht, den verderbenbringenden Teufel für einen segenspendenden Engel ansehend, verschlungen werden. „Er geht nämlich umher wie ein brüllender Löwe und sucht, wen er verschlingen könne“, wie die Schrift sagt. Daher die Mahnungen der Kirche, daher diese Vorträge hier, daher die Lesungen.</p><p>[Forts. v. ] Zum Wesen der Religion gehören fromme Lehren und gute Handlungen. Weder sind Gott Lehren angenehm, welchen nicht gute Taten folgen; noch will Gott Taten, welche nicht aus frommen Lehren entspringen. Was nützt denn einerseits Gottesgelehrtheit dem, der schändliche Unzucht treibt? Was nützt andererseits strenge Enthaltsamkeit dem, der Gott nicht kennt und ihn lästert? Der höchste Besitz ist also Kenntnis der Glaubenslehren, absolut notwendig ist eine keusche Seele. Viele gibt es, welche durch Weltweisheit und eitlen Trug verführen. Die Heiden betören durch schöne Reden; denn „Honig fließt von den Lippen einer Buhlerin“. Die Beschnittenen aber betrügen diejenigen, welche zu ihnen kommen, durch falsche Auslegung der göttlichen Schriften; von Kindheit an bis ins Greisenalter studieren sie, aber sie werden alt, ohne etwas gelernt zu haben. Häretiker betrügen die Herzen der Unschuldigen mit ihren Lehren vom Guten und Schönen; sie bezeichnen sich als Christen, um wie mit Honig die giftigen Pfeile ihrer gottlosen Lehren zu bestreichen. Auf alle diese Irrlehrer verweist der Herr mit den Worten: „Seht zu, daß euch niemand irreführe!“ Darum erfolgt die Unterweisung im Glauben und die Einführung in denselben.</p><p>Vor der Übergabe des Symbolums scheint mir jetzt (nur) eine kurze Zusammenfassung der notwendigen Glaubenslehren gut zu sein, damit sie nicht, wenn von den vorzutragenden Lehren zu viel geboten wird, im Laufe der ganzen dazwischen liegenden heiligen Quadragesimalzeit von den weniger Begabten unter euch wieder vergessen werden. Wenn wir jetzt (nur) das Wichtigste aussäen, das bleibt uns, bis es später weiter ausgearbeitet wird. Die Begabteren und bereits Urteilsfähigeren unter den Anwesenden aber mögen Geduld haben, wenn sie die Kinder lehren und eine Unterweisung, welche erst Milch bietet, hören. Wer erst unterrichtet werden muß, soll etwas lernen; wer bereits die Erkenntnis hat, soll die Erinnerung an das auffrischen, was er schon gelernt hat.Gott.</p><p>Zunächst soll die Lehre von Gott als Fundament in eure Seele gelegt werden.</p><p>Es ist* ein* Gott. Er allein ist unerzeugt, ohne Anfang, unwandelbar, unveränderlich. Weder hat ihn ein anderer erzeugt, noch tritt er an einen anderen das Leben ab. Nicht fing er in der Zeit an, zu leben, noch stirbt er jemals. Er ist gut und gerecht. Sobald du einen Häretiker predigen hörst, ein anderer sei der Gerechte und wieder ein anderer der Gute, sollst du dich sofort an diese Lehre erinnern, um den giftigen Pfeil der Häresie zu erkennen. Es gab Männer, welche in ihrer Lehre ruchlos den einen Gott zu teilen wagten. Einige lehrten, der Schöpfer und Herr der Seele sei ein anderer als der Schöpfer und Herr der Körper — eine unsinnige und gottlose Lehre. Wie kann denn ein und derselbe Mensch Knecht von zwei Herren sein? Sagt ja doch der Herr im Evangelium: „Niemand kann zwei Herren dienen“. Einer allein also ist Gott, der Schöpfer der Seelen und der Körper. Einer ist der Schöpfer Himmels und der Erde, der Schöpfer der Engel und Erzengel. Er ist der Schöpfer vieler, jedoch seit Ewigkeit der Vater eines Einzigen, nur seines einen eingeborenen Sohnes, unseres Herrn Jesus Christus, durch den er alles erschaffen hat, das Sichtbare und das Unsichtbare.</p><p>[Forts. v. ] Dieser Vater unseres Herrn Jesus Christus wird von keinem Raume begrenzt. Nicht ist er geringer als der Himmel. Vielmehr sind die Himmel das Werk seiner Finger und in seiner Faust hält er die ganze Erde. Er ist in allen und außerhalb aller. Glaube nicht, daß die Sonne heller leuchte wie er oder ihm nur gleichkomme! Denn der, welcher die Sonne gemacht hat, muß schon vorher ganz unvergleichlich größer und leuchtender sein. Er weiß die Zukunft vorher und ist mächtiger als alles. Er weiß alles und macht alles, wie er will. Er ist nicht abhängig von geschichtlicher Entwicklung, nicht von der Geburt, nicht vom Schicksal, nicht vom Verhängnis. Er ist in allem vollkommen und besitzt jede Art von Tugend in gleicher Weise. Er wird weder kleiner, noch wächst er, sondern er bleibt sich stets in gleicher Weise der gleiche. Für die Sünder hat er Strafen, Kronen für die Gerechten bestimmt.</p><p>Von dem einen Gott sind viele — die einen auf diese, die andern auf jene Weise — abgewichen. Die einen haben die Sonne vergöttlicht, um nach Sonnenuntergang während der Nachtzeit ohne Gott zu sein. Andere haben, um während des Tages ohne Gott zu sein, den Mond vergöttlicht, andere die übrigen Teile der Welt, die einen die Künste, andere die Speisen, andere die sinnlichen Freuden. Die einen haben in ihrer Weibersucht die Statue eines nackten Weibes aufgestellt, sie Aphrodite genannt und in dem Bilde die Leidenschaft angebetet. Andere, vom Goldglanze geblendet, haben das Gold und die übrigen Elemente zu Göttern gemacht. Wenn aber einer die Lehre von der Einheit Gottes in sein Herz gepflanzt hat und sich nach derselben richtet, der verbannt zugleich alles Verderben, das von den Sünden des Götzendienstes und vom Irrtum der Häretiker kommt.</p><p>Dieses ist die erste Glaubenslehre, welche du dir gläubig ins Herz legen mußt. Christus.</p><p>[Forts. v. ] Glauben mußt du auch an den einen und einzigen Sohn Gottes, unsern Herrn Jesus Christus, Gott, erzeugt aus Gott, Leben, erzeugt aus dem Leben, Licht, erzeugt aus dem Lichte. Ähnlich ist er in allem dem Erzeuger. Nicht in der Zeit hat er das Sein erhalten, sondern vor aller Ewigkeit ist er ewig vom Vater in unfaßbarer Weise geboren worden. Er ist die Weisheit Gottes und die persönliche, wesenhafte Kraft und Gerechtigkeit. Er sitzt zur Rechten des Vaters vor aller Ewigkeit. Denn nicht ist er, wie einige geglaubt haben, nach seinem Leiden gewissermaßen von Gott gekrönt worden, nicht hat er wegen seiner Geduld den Thron zur Rechten erhalten, sondern seitdem er ist — er ist aber ewig erzeugt —, hat er die königliche Würde und thront mit dem Vater, da er, wie gesagt, Gott, Weisheit und Kraft ist. Er regiert zugleich mit dem Vater und hat alles um des Vaters willen erschaffen. Nichts fehlt ihm zur göttlichen Herrlichkeit. Er kennt den Erzeuger, wie er vom Erzeuger gekannt wird. Um es kurz zu sagen, denke an das Wort, das in den Evangelien geschrieben ist: „Niemand kennt den Sohn außer der Vater, und niemand kennt den Vater außer der Sohn“.</p><p>Nicht darfst du den Sohn vom Vater trennen, noch darfst du, beide vermischend, eine Sohnvaterschaft glauben. Glaube vielmehr, daß der eingeborene Sohn des einen Gottes* einer* ist, der vor aller Zeit (existierende) Gott Logos! Nicht ist er ein Wort* (λόγος)* [logos] das gesprochen wird und in die Luft zerfließt; nicht ein Wort ähnlich den wesenslosen Worten. Der Logos Sohn ist der Schöpfer der vernünftigen Wesen, er ist das auf den Vater hörende und selbstredende Wort.</p><p>Hierüber werde ich bei Gelegenheit, so Gott will, noch ausführlicher sprechen; denn nicht vergessen wir unser Vorhaben, jetzt nur eine zusammenfassende Einleitung in die Glaubenslehre zu geben.Die Geburt aus der Jungfrau.</p><p>Glauben mußt du, daß dieser eingeborene Sohn Gottes um unserer Sünden willen vom Himmel auf die Erde herabgekommen ist, indem er diese menschliche Natur mit ihren Leiden, um uns ähnlich zu sein, angenommen hat, aus der hl. Jungfrau und dem Hl. Geiste geboren worden ist. Nicht zum Scheine und nicht in der Einbildung, sondern in Wahrheit ist er Mensch geworden. Nicht ist er durch die Jungfrau wie durch einen Kanal gegangen, sondern er hat wahrhaft aus ihr Fleisch angenommen. Er hat wahrhaft gegessen wie wir, hat wahrhaft getrunken wie wir, ist wahrhaft mit Milch ernährt worden. Wäre nämlich die Menschwerdung nur Schein gewesen, dann wäre auch die Erlösung Schein. Christus war zweifach: sichtbar als Mensch, unsichtbar als Gott. Als Mensch hat er wahrhaft wie wir gegessen; denn er hatte dieselben fleischlichen Bedürfnisse wie wir. Als Gott aber speiste er mit fünf Broten die Fünftausend. Als Mensch ist er wahrhaft gestorben; als Gott aber hat er den, der schon vier Tage tot war, erweckt. Als Mensch hat er im Schiffe wahrhaft geschlafen; als Gott ist er auf dem Wasser gewandelt.Das Kreuz.</p><p>[Forts. v. ] Er ist für unsere Sünden wahrhaft gekreuzigt worden. Willst du es leugnen, so belehrt dich der Ort, den du siehst, dieser hl. Golgatha, auf dem wir jetzt um dessentwillen versammelt sind, der auf ihm gekreuzigt worden war. Mit dem Kreuzesholze ist nunmehr fast der ganze Erdkreis erfüllt. Nicht um eigener Sünden willen ist er gekreuzigt worden, sondern damit wir von den unsrigen erlöst würden. Als Mensch ist er damals von Menschen beschimpft und mit Fäusten geschlagen worden. Als Gott aber hat ihn die Schöpfung erkannt, denn als die Sonne den Herrscher geschändet sah, konnte sie den Anblick nicht ertragen, und bebend verfinsterte sie sich.Das Grab.</p><p>Als Mensch ist er in einem Felsengrabe wahrhaft beigesetzt worden; doch die Felsen zersprangen aus Furcht vor ihm. In die Unterwelt ist er hinabgestiegen, um auch dort die Gerechten zu erlösen. Sage mir: hättest du denn gewollt, daß der Gnade die Lebenden teilhaftig werden, und zwar, obwohl sie größtenteils nicht heilig sind, daß dagegen diejenigen, welche von Adam an lange Zeit eingekerkert waren, keine Freiheit erlangen? Der Prophet Isaias hat so Großes über Christus mit lauter Stimme verkündet. Hättest du nicht gewollt, daß der König hinabsteige, um den Herold zu erlösen? David war in der Unterwelt und Samuel und alle Propheten, auch Johannes, der durch seine Abgesandten hatte fragen lassen: „Bist du der, der da kommen soll, oder haben wir einen anderen zu erwarten?“ Hättest du nicht gewollt, daß er hinabsteige, solche Männer zu erlösen?Die Auferstehung.</p><p>[Forts. v. ] Der, welcher in die Unterwelt hinabgestiegen ist, ist auch wieder aufgestiegen. Nachdem Jesus begraben worden war, ist er am dritten Tage wahrhaft wieder auferstanden. Sollten dich etwa die Juden sticheln, dann halte ihnen sofort die Frage entgegen: „Jonas ist nach drei Tagen aus dem Walfisch hervorgegangen, und Christus soll nach drei Tagen nicht aus der Erde erweckt worden sein?“ Durch Berührung der Gebeine des Elisäus ist ein Toter zum Leben erweckt worden. Soll es nicht viel leichter sein, daß der Schöpfer der Menschen durch die Kraft des Vaters zum Leben erweckt werde? Wahrhaft ist er also auferstanden, und nach seiner Auferstehung ist er wiederum den Jüngern erschienen. Zeugen seiner Auferstehung sind die zwölf Jünger gewesen. Nicht aber haben sie mit schönen Reden Zeugnis gegeben, sondern im Kampfe für die Wahrheit seiner Auferstehung haben sie sogar Martern und Tod erlitten. Trotzdem nach der Schrift (schon) auf der Aussage zweier oder dreier Zeugen jedes Wort beruht, für die Auferstehung Christi aber sogar zwölf Zeugnis geben, solltest du gleichwohl noch nicht auf Grund der Auferstehung glauben?Die Himmelfahrt.</p><p>Nachdem Jesus den Leidensweg vollendet und die Menschen von Sünden erlöst hatte, stieg er wieder zum Himmel empor, von einer Wolke aufgenommen. Als er auffuhr, standen ihm Engel zur Seite, waren Apostel Augenzeugen. Sollte einer der Überlieferung nicht Glauben schenken, dann möge er der Macht glauben, die sich jetzt offenbart. Während alle Könige bei ihrem Tode mit dem Leben auch ihre Macht verlieren, wird Christus seit seiner Kreuzigung von der ganzen Welt angebetet. Den Gekreuzigten verkünden wir, vor dem Gekreuzigten zittern die Dämonen. Viele sind im Laufe der Zeit gekreuzigt worden, aber wer ist sonst je nach seiner Kreuzigung angerufen worden, um die Dämonen zu verscheuchen?</p><p>[Forts. v. ] Wollen wir uns also des Kreuzes Christi nicht schämen! Mögen es andere geheimhalten, du sollst damit offen die Stirne bezeichnen, damit die Dämonen, wenn sie das königliche Zeichen sehen, zitternd weit entfliehen! Mache das Kreuzzeichen beim Essen und Trinken, wenn du sitzest, dich niederlegst, aufstehst, wenn du sprichst, gehst, kurz bei allen Beschäftigungen! Denn der, welcher auf dieser Stelle gekreuzigt wurde, ist oben im Himmel. Würde er nach seiner Kreuzigung und Grablegung im Grabe geblieben sein, dann hätten wir Grund, uns (des Kreuzes) zu schämen. Nun aber ist der, welcher hier auf dem Golgatha gekreuzigt worden war, von dem im Osten gelegenen Ölberg aus in den Himmel aufgefahren. An dieser Stelle (dem Golgatha) ist er in die Unterwelt hinabgestiegen und wieder zu uns zurückgekehrt. Dort (auf dem Ölberg) hat er uns wieder verlassen, um in den Himmel aufzufahren; denn der Vater spricht zu ihm: „Setze dich zu meiner Rechten, bis ich deine Feinde zum Schemel deiner Füße setze!“Das kommende Gericht.</p><p>Dieser Jesus Christus, der in den Himmel aufgefahren ist, kommt wieder vom Himmel, nicht von der Erde. Ich sage „nicht von der Erde“, da jetzt viele Antichriste von der Erde kommen sollen. Bereits haben, wie du gesehen hast, viele erklärt: „Ich bin Christus“. Es muß nur noch „der Greuel der Verwüstung“ kommen. Warte auf den wahren Christus, den eingeborenen Sohn Gottes, der nicht mehr von der Erde, sondern vom Himmel kommen, allen in hellerem Glαnze als jeglicher Blitz und Lichtstrahl erscheinen wird, von Engeln umgeben, um zu richten die Lebendigen und die Toten und über ein himmlisches, ewiges, unvergängliches Reich zu regieren! Auch an dem letzten Satze halte fest! Denn viele gibt es, die behaupten, das Reich Christi habe ein Ende. Der Heilige Geist.</p><p>Glaube auch an den Hl. Geist! Bewahre dir die rechte Meinung über ihn! Denn es gibt viele, welche dem Hl. Geist ferne stehen und schlimme Lehren über ihn aufstellen. Merke dir: dieser Geist ist* einer<em>, ungeteilt, kraftvoll. Vieles wirkt er, ohne selbst geteilt zu werden. Er kennt die Geheimnisse, erforscht alles, auch die Tiefen Gottes. In Gestalt einer Taube ist er auf den Herrn Jesus Christus herabgekommen. Er wirkte im Gesetze und in den Propheten. Und jetzt, zur Zeit der Taufe, besiegelt er deine Seele. Jedes vernünftige Wesen bedarf der Heiligung durch ihn. Wenn einer sich erkühnt, gegen den Hl. Geist zu lästern, erhält er keine Verzeihung, weder in diesem noch im zukünftigen Leben. Dem Geiste kommt zugleich mit dem Vater und dem Sohne Ehre und Würde zu. Seiner bedürfen auch die Throne und Herrschaften, die Mächte und Gewalten. Denn</em> einer* ist Gott, der Vater Christi, und einer ist der Herr Jesus Christus, der eingeborene Sohn des einen Gottes, und* einer* ist der Hl. Geist, der alles heiligt und der im Gesetze und in den Propheten, im Alten und Neuen Bunde gesprochen hat.</p><p>[Forts. v. ] Bewahre in deinem Geiste stets dieses Siegel. Erst der Hauptsache nach und andeutungsweise wirst du jetzt belehrt. So der Herr will, folgt aber noch eine kraftvolle Erklärung mit Schriftbeweis. Wenn es sich nämlich um die göttlichen, heiligen Geheimnisse des Glaubens handelt, darf absolut nichts ohne göttliche Schrift vorgetragen werden. Auch darf man sich durchaus nicht von verführerischen Reden oder durch Wortmacherei verleiten lassen. Du darfst auch meinen Worten nur dann glauben, wenn dir die göttlichen Schriften den Beweis für meine Erklärungen geben. Soll unser Glaube das Heil bringen, dann stützt er sich nicht auf ersonnene Gründe, sondern auf den Beweis aus den göttlichen Schriften.Die Seele.</p><p>Wenn du unseren ehrwürdigen, hochheiligen Glauben kennen gelernt hast, mußt du auch dich selbst kennen lernen. Als Mensch hast du zwei Naturen, bist aus Seele und Leib zusammengesetzt. Ein und derselbe Gott ist, wie vor kurzem bemerkt, der Schöpfer der Seele und des Leibes. Deine Seele hat — das mußt du wissen — freien Willen. Sie ist das schönste Werk Gottes, ein Ebenbild ihres Schöpfers. Sie ist unsterblich, da ihr Gott Unsterblichkeit verliehen hat. Ihrem Wohltäter verdankt sie es, daß sie ein vernünftiges, unzerstörbares Wesen ist. Sie hat die Fähigkeit, zu tun, was sie will. Nicht ist dein Geburtstag schuld, wenn du sündigst, nicht treibt ein Geschick dich zur Unzucht, nicht nötigen, wie einige in törichter Weise behaupten, dich die Konstellationen der Sterne zu Ausschweifungen. Warum scheust du es, deine eigenen Sünden zu bekennen, und schiebst die Schuld auf die unschuldigen Sterne? Höre nicht mehr auf die Astrologen! Denn die göttliche Schrift sagt von ihnen: „Mögen die Sterndeuter auftreten und dich retten, siehe“ — so heißt es weiter — „alle werden wie Stoppeln im Feuer verbrannt werden, und nicht werden sie ihre Seele aus der Flamme retten“.</p><p>Lerne auch das: Ehe die Seele auf diese Erde kam, hatte sie keine Sünde! Als wir eintraten, waren wir ohne Sünde. Jetzt aber sündigen wir mit freiem Willen. Höre nicht auf den, der die Stelle: „Wenn ich das, was ich nicht will, tue“ falsch auslegt, sondern denke an das Wort. „Wenn ihr wollt und auf mich hört, werdet ihr von den Gütern des Landes genießen; wenn ihr aber nicht wollt und nicht auf mich höret, wird euch das Schwert verschlingen usw.“. Und wiederum: „Gleichwie ihr eure Glieder als Knechte der Unreinheit und Gesetzlosigkeit hingegeben habt zur Gesetzlosigkeit, so gebet jetzt eure Glieder als Knechte der Gerechtigkeit hin zur Heiligung!“ Denke auch an das Wort der Schrift: „Wie sie es nicht für gut hielten, Gott zu erkennen“, und: „Was erkennbar ist an Gott, ist in ihnen offenbar“, und: „Ihre Augen haben sie verschlossen“, und wiederum denke an den Tadel Gottes: „Ich habe dich gepflanzt nur als fruchtbaren, wahren Weinberg; wie bist du, entarteter Weinberg, in Bitterkeit verwandelt worden!“</p><p>[Forts. v. ] Die Seele ist unsterblich, und alle Seelen sind einander ähnlich, sowohl die der Männer wie die der Frauen. Nur die Glieder des Leibes sind verschieden. Es gibt nicht eine Klasse von Seelen, welche von Natur aus sündigt, und eine Klasse von Seelen, welche von Natur aus gerecht handelt; sondern das eine wie das andere geschieht auf Grund des freien Willens. Denn das Wesen der Seele ist in allen von gleicher Art und ähnlich.</p><p>Ich weiß zwar, daß meine Rede lang und daß die Zeit schon vorangeschritten ist. Aber was ist wertvoller als das Heil? Willst du dir nicht die Mühe nehmen, Wegzehrung gegen die Häretiker zu empfangen? Willst du nicht auch die Abweichungen vom Wege kennen lernen, um nicht aus Unwissenheit auf abschüssige Bahn geführt zu werden? Sehen die Lehrer es nicht für geringen Gewinn an, wenn du lernst, mußt dann du, der Schüler, nicht mit Freuden die Lehren samt und sonders annehmen?</p><p>[Forts. v. ] Die Seele hat freien Willen. Der Teufel vermag ihr wohl etwas einzuflüstern, aber er hat nicht die Gewalt, sie wider ihren Willen zu etwas zu zwingen. Er hält dir unkeusche Gedanken vor. Wenn du willst, nimmst du sie an; willst du nicht, nimmst du sie nicht an. Würdest du Unkeuschheit treiben aus Zwang, mit welchem Rechte könnte Gott dir die Hölle bereiten? Wenn du naturnotwendig und nicht aus freien Stücken Gerechtigkeit üben würdest, mit welchem Rechte könnte dir Gott unaussprechlich schöne Kronen bereiten? Das Lamm ist sanftmütig, aber noch nie ist es wegen seiner Sanftmut gekrönt worden. Denn es ist nicht sanft aus freiem Willen, sondern von Natur aus.Der Körper.</p><p>Du weißt, mein Lieber, von der Seele so viel, daß es für jetzt genügt. Lasse dich, so gut es geht, auch über deinen Körper belehren! Dulde keinen, der sagt, unser Körper habe mit Gott nichts zu tun! Wer glaubt, der Körper habe mit Gott nichts zu schaffen und die Seele wohne in einem Gefäße, das nicht zu ihr passe, der bedient sich gern des Körpers zur Unzucht. Doch was haben sie an diesem bewundernswerten Körper auszusetzen? Was mangelt ihm denn an Schönheit? Was ist nicht kunstvoll an seinem Bau? Hätten sie nicht auf die Augen und ihre glanzvolle Einrichtung achten sollen? Auf die Ohren, welche, schräg vorstehend, den Schall ungehindert aufnehmen? Auf die Nase und ihr Aus- und Einatmen? Auf die zweifache Funktion der Zunge, welche dem Geschmacke und der Rede dient? Auf die im Verborgenen ruhende Lunge, die ständig tätige Luftpumpe? Wer hat dem Herz den ständigen Pulsschlag gegeben? Wer hat so viele Venen und Arterien zugeteilt? Wessen Weisheit hat die Knochen und Sehnen verbunden? Wer vereinigt den einen Teil der Nahrungsmittel mit dem Körper und scheidet den andern Teil schamhaft aus? Wer hat die Glieder der Scham an schamhafteren Stellen verborgen? Wer hat die (an sich) vergängliche menschliche Natur durch einfache Vereinigung unvergänglich gemacht?</p><p>Sage nicht, der Leib sei Ursache der Sünde! Wenn der Leib Ursache der Sünde ist, warum sündigt denn ein Toter nicht? Lege zur Rechten eines Verstorbenen ein Schwert, gleichwohl erfolgt kein Mord. Lasse vor einem erst verstorbenen Jüngling allerhand Schönheiten vorüberziehen, gleichwohl erwacht kein unkeusches Verlangen. Warum? Weil nicht der Körper an und für sich sündigt, sondern die Seele durch Vermittlung des Körpers. Der Körper ist das Werkzeug der Seele, gleichsam ihr Gewand, ihr Kleid. Wird er von der Seele der Unzucht hingegeben, dann wird er unrein. Wohnt er mit einer hl. Seele zusammen, dann wird er ein Tempel des Hl. Geistes. Das sage nicht ich. Der Apostel Paulus hat es gesagt: „Wisset ihr nicht, daß eure Leiber Tempel des Hl. Geistes sind, der in euch wohnt?“ Schone also deinen Körper, da er ein Tempel des Hl. Geistes ist! Beschmutze dein Fleisch nicht durch unreine Handlungen! Beflecke nicht dieses herrlichste Gewand! Hast du es aber beschmutzt, dann wasche es jetzt in der Buße! Wasche dich, solange es Zeit dazu ist!</p><p>[Forts. v. ] Auf die Lehre über die Keuschheit soll vor allem der Stand der Mönche und Jungfrauen, welche in der Welt ein engelgleiches Leben führen, hören, sodann aber auch das übrige Volk der Kirche. Eine große Krone ist für euch bereit, Brüder! Gebet nicht für eine geringe Freude große Würde hin! Höret auf das Wort des Apostels: „Keiner sei unzüchtig und unheilig wie Esau, der um eine einzige Mahlzeit sein Erstgeburtsrecht hingegeben hat!“ Bereits bist du in die Bücher der Engel eingetragen wegen deines Vorsatzes, keusch zu leben. Sieh zu, daß du nicht wegen unkeuscher Tat wieder ausgetilgt werdest!</p><p>[Forts. v. ] Du darfst aber auch nicht, wenn du ein keusches Leben begonnen hast, hochmütig auf die Verheirateten herabsehen. „Denn“ — sagt der Apostel — „ehrwürdig ist die Ehe und unbefleckt das Ehebett“. Bist nicht auch du, der du die Jungfräulichkeit bewahrst, von Verheirateten geboren? Verachte nicht das Silber, weil du Gold besitzest! Auch diejenigen sollen guter Hoffnung sein, welche in der Ehe leben und die Ehe rechtmäßig benützen, welche die Ehe zu einem Rechtsinstitut, nicht aber durch unmäßigen Gebrauch zu einer Ausschweifung machen, welche sich, um dem Gebete zu obliegen, von Zeit zu Zeit zu enthalten wissen, welche mit reinen Kleidern zugleich auch reine Leiber zum Gottesdienste in die Kirche bringen, welche sich verehelichen, um Kinder zu erzeugen, nicht aber aus lüsternem Verlangen.</p><p>Die* einmal* verheiratet sind, sollen nicht jene verachten, welche eine zweite Ehe eingegangen haben. Die Enthaltsamkeit ist zwar schön und bewundernswert, aber es ist, damit die Schwachen nicht Unzucht treiben, auch eine zweite Ehe gestattet, „Gut ist es für sie“, — sagt der Apostel — „wenn sie bleiben wie ich; wenn sie sich aber nicht enthalten, dann mögen sie heiraten; denn es ist besser zu heiraten, als Brunst zu leiden“. Alles übrige aber, Hurerei, Ehebruch und jede Art von Ausschweifung halte ferne von dir! Bewahre den Leib rein dem Herrn, damit der Herr auch auf den Leib schaue!Nahrung.</p><p>Der Leib muß mit Speisen ernährt werden, um leben und ungehindert seinen Dienst tun zu können, nicht aber, um sich der Wollust hinzugeben. Ihr sollt in bezug auf die Nahrungsmittel folgendes lernen, da sich viele bezüglich der Speisen verfehlen. Einige genießen, ohne zu unterscheiden, Götzenopfer. Andere, welche enthaltsam leben, verurteilen die, welche genießen. Manche Seelen verfehlen sich bald auf diese, bald auf jene Weise in der Speisefrage, da sie die heilsamen Gründe nicht kennen, warum wir essen und nicht essen. Wir fasten und enthalten uns von Wein und Fleisch, nicht weil wir beides als etwas Verabscheuungswürdiges hassen, sondern weil wir dafür einen Lohn erwarten. Wir wollen uns über das Sinnliche erheben und eine geistige, seelische Speise genießen. Wir wollen jetzt in Tränen säen, um dereinst in Freuden zu ernten. Verachte also nicht diejenigen, welche essen und wegen ihrer körperlichen Schwäche Speise zu sich nehmen! Tadle auch nicht diejenigen, welche wegen des Magens und häufiger Schwäche etwas Wein genießen, und verurteile sie nicht als Sünder! Hasse auch nicht die Fleischspeisen als etwas Feindliches. Von denen, die es so machen, weiß der Apostel zu berichten: „Sie verbieten zu heiraten und Speisen zu genießen, obwohl Gott dieselben für die Gläubigen erschaffen hat, damit sie dieselben mit Dankbarkeit zu sich nehmen“. Willst du dich der Speisen enthalten, dann tue es also nicht, weil sie verabscheuungswürdig sind; denn in diesem Falle erhältst du keinen Lohn. Verzichte vielmehr auf das Gute, um die noch besseren geistigen Gaben, die dir bereitet sind, zu erlangen.</p><p>[Forts. v. ] Willst du deine Seele sicherstellen, dann iß niemals Götzenopfer! Gegen diese Speisen eifere nicht nur ich jetzt, sondern bereits die Apostel, sogar Jakobus, der Bischof dieser Kirche, haben es getan. Die Apostel und Ältesten schrieben in einer Enzyklika an alle Heidenchristen, „sie sollen sich vor allem von dem den Götzen Geopferten enthalten, dann auch von Blut und Ersticktem“. Denn viele Menschen sind wilde Tiere und leben gleich den Hunden. Sie lecken wie die wildesten Tiere Blut und verschlingen gierig Ersticktes. Du aber, Christi Diener, sollst beim Essen das Gebot beachten, mit frommem Sinn zu essen.</p><p>Das mag über die Speisen genügen.Kleidung.</p><p>[Forts. v. ] Einfach sei deine Kleidung. Nicht diene sie zum Schmucke, sondern zum notwendigen Schutze. Nicht sollst du damit groß tun, sondern du sollst dich damit im Winter wärmen und sollst die Scham des Körpers bedecken. Verfalle nicht unter dem Vorwande, die Schande zu verhüllen, durch überflüssige Kleiderpracht in eine andere Schande!Auferstehung.</p><p>Gib acht, ich bitte dich, auf deinen Körper und merke dir: du wirst von den Toten auferweckt werden, um mit deinem Körper gerichtet zu werden! Sollte dir aber der Unglaube den Gedanken eingeben: „Das ist unmöglich“, dann schaue auf dein eigenes Leben und schließe daraus auf das, was du (noch) nicht siehst! Denke einmal darüber nach und sage mir, wo warst du vor hundert oder mehr Jahren? Wie klein und einfach war die Substanz, aus der du dich entwickelt hast, und wie groß, schön und würdevoll bist du geworden! Soll dann der, welcher das Nichtseiende ins Dasein rief, nicht imstande sein, das, was bereits war, aber zerfiel, wieder zu erwecken? Wird der, welcher das unsertwegen gesäte Getreide jährlich, wenn es erstorben ist, wieder aufweckt, nicht auch uns, derentwegen jenes auflebt, ohne Mühe erwecken? Du siehst, daß die Bäume jetzt so und so viel Monate schon ohne Früchte und Blätter dastehen. Jedoch nach Ablauf des Winters leben sie gleichsam von den Toten neu auf. Werden wir nicht viel eher und leichter aufleben? Der Stab des Moses wurde in die ihm fremdartige Natur einer Schlange durch den Willen Gottes verwandelt. Und der Mensch soll, wenn er dem Tode verfallen ist, nicht mehr als Mensch auferstehen?</p><p>[Forts. v. ] Höre nicht auf die, welche sagen, unser Körper werde nicht auferweckt! Er wird auferweckt. Und Isaias bezeugt es, wenn er sagt: „Auferstehen werden die Toten, und die in den Gräbern sind, werden auferweckt werden“, Und nach Daniel „werden viele von denen, welche im Staube der Erde schlafen, aufstehen, die einen zum ewigen Leben, die andern zu ewiger Schande“. Alle Menschen stehen auf, aber nicht alle in gleicher Weise. Die Körper, welche wir alle erhalten, sind ewig, aber nicht alle einander ähnlich. Die Gerechten erhalten ihre Leiber, um im ewigen Leben den Chören der Engel beigesellt zu werden; die Sünder erhalten sie, um ewig für ihre Sünden bestraft zu werden.</p><p>Daher hat uns der Herr in gütiger Vorsehung das Bad der Buße gegeben, damit wir die Menge der Sünden, vielmehr den ganzen Sündenpack wegwerfen, das Siegel des Hl. Geistes empfangen und Erben des ewigen Lebens werden. Doch über die Taufe haben wir bereits früher zur Genüge gesprochen. Wir wollen noch auf das eingehen, was noch zum elementaren Unterricht gehört.Die göttlichen Schriften.</p><p>[Forts. v. ] (All) dies lehren uns die inspirierten Schriften des Alten und Neuen Testamentes.* Einer* ist nämlich der Gott der beiden Testamente. Er hat ja den im Neuen Testamente erschienenen Christus im Alten Testament vorherverkündet und durch das Gesetz und die Propheten zu Christus erzogen; „denn ehe der Glaube kam, wurden wir unter dem Gesetze in Gewahrsam gehalten“ und „das Gesetz ist unser Erzieher zu Christus geworden“. Solltest du je einen Häretiker hören, der das Gesetz und die Propheten lästert, dann halte ihm das heilsame Wort entgegen: „Nicht ist Jesus gekommen, das Gesetz aufzulösen, sondern es zu erfüllen“. Lerne auch fleißig von der Kirche, welches die Bücher des Alten Testamentes und welches die des Neuen Testamentes sind! Lies keine apokryphe Schrift! Wenn du die bei allen als echt anerkannten Schriften nicht kennst, wie sollst du dich um die zweifelhaften Schriften unnützerweise plagen? Lies die göttlichen Schriften, nämlich die zweiundzwanzig Bücher des Alten Testamentes, welche von den zweiundsiebzig Übersetzern übersetzt worden sind!</p><p>Nach dem Tode Alexanders, des Königs von Mazedonien, zerfiel sein Reich in vier Herrschaften: in Babylonien, Mazedonien, Asien und Ägypten. Einer der Könige von Ägypten war Ptolemäus Philadelphus, ein großer Freund der Wissenschaften, der überall Bücher sammelte. Dieser hatte von Demetrius aus Phaleron, seinem Bibliothekar, über die göttlichen Schriften des Gesetzes und der Propheten Kenntnis erhalten. Da er es nun für viel besser hielt, sich nicht mit Gewalt und gegen den Willen der Eigentümer in den Besitz der Bücher zu setzen, sondern mit Geschenken und auf freundschaftlichem Wege ihre Eigentümer zu gewinnen, da er auch wußte, daß ein Buch, das mit Gewalt geholt und unfreiwillig gegeben wird, vielfach gefälscht werde, daß dagegen ein Buch, welches gern gegeben wird, ganz unverfälscht geschenkt werde, so sandte er dem damaligen Hohenpriester Eleazar zahlreiche Geschenke für den Tempel hier, in Jerusalem, und bewirkte, daß ihm von jedem der zwölf Stämme Israels je sechs Männer zur Übersetzung abgeschickt wurden. Um die Probe zu machen, ob die Bücher göttlich sind oder nicht, und um zu verhindern, daß die abgesandten Übersetzer miteinander verkehren, wies er sodann im sogenannten Pharus, nahe bei Alexandrien, jedem der angekommenen Übersetzer eine eigene Wohnung an und betraute jeden mit der Übersetzung der ganzen Schrift. Als sie in zweiundsiebzig Tagen die Aufgabe vollendet hatten, verglich Ptolemäus sämtliche Übersetzungen, welche sie in verschiedenen Wohnungen, ohne einander gesehen zu haben, fertiggestellt hatten, und fand, daß sie nicht nur in den Gedanken, sondern auch in den Worten übereinstimmten. Nicht ja handelte es sich um menschliches Produkt und sophistisches Machwerk, sondern in der Kraft des Hl. Geistes wurde die Übersetzung der göttlichen Schriften vollendet.</p><p>Die zweiundzwanzig Bücher der Septuaginta sollst du lesen; mit den Apokryphen jedoch sollst du nichts zu tun haben. Jene allein, zu deren Lektüre wir auch in der Kirche vertrauensvoll greifen, sollst du eifrig studieren. Diejenigen, welche uns dieselben überliefert haben, nämlich die Apostel und die alten Bischöfe, die Vorsteher der Kirche, waren viel verständiger und frömmer wie du. Bist du ein Sohn der Kirche, dann übertritt nicht ihre Gesetze! Studiere die Bücher des Alten Testamentes, deren es, wie gesagt, zweiundzwanzig sind! Bist du wißbegierig, dann gib dir Mühe, ihre Namen, die ich nennen werde, dem Gedächtnis einzuprägen!</p><p>Die Bücher des Gesetzes sind zunächst die fünf Bücher Moses: Genesis, Exodus, Levitikus, Numeri, Deuteronomium; sodann Josue, der Sohn des Nave, und an siebter Stelle das Buch der Richter und Ruth. Von den historischen Büchern bildet das erste und zweite Buch der Könige bei den Hebräern ein einziges, ebenso das dritte und vierte Buch der Könige. Desgleichen ist bei ihnen das erste und zweite Buch Paralipomenon [═ 1. u. 2. Buch der Chronik] ein einziges Buch. Auch das erste und zweite Buch Esdras [═ Esra] wird als* ein* Buch gerechnet. Esther ist das zwölfte Buch. Das wären die historischen Bücher. Poetische Bücher gibt es fünf: Job, das Buch der Psalmen, die Sprichwörter, der Prediger und als siebzehntes Buch das Hohelied. Dazu kommen fünf prophetische Bücher: das eine Buch der zwölf Propheten,* ein* Buch Isaias,* ein* Buch Jeremias nebst Baruch, den Klageliedern und einem Briefe, sodann Ezechiel und das Buch Daniel, das zweiundzwanzigste Buch des Alten Testamentes.</p><p>Zum Neuen Testamente gehören nur vier Evangelien; die übrigen Evangelien sind apokryph und verderblich. Die Manichäer haben ein „Evangelium nach Thomas“ geschrieben; dasselbe hat sich mit dem wohlklingenden Namen Evangelium geschmückt, verdirbt aber die Seelen der Arglosen. Auch die Geschichte der zwölf Apostel mußt du annehmen, dazu die sieben katholischen Briefe, nämlich des Jakobus, Petrus, Johannes und Judas; endlich als Siegel der ganzen Schrift und als letztes Denkmal der Jünger die vierzehn Briefe Pauli. Alle übrigen Schriften sollen in zweiter Linie kommen. Alle jene Schriften aber, welche in der Kirche überhaupt nicht gelesen werden, darfst du, wie du gehört hast, auch für dich nicht lesen. Soviel über die Schrift.</p><p>Fliehe jedes teuflische Werk und höre nicht auf den abtrünnigen Drachen, welcher freiwillig aus einem guten Wesen umgewandelt worden war und welcher diejenigen, welche es so wollen, zu verführen, keinen jedoch zu zwingen vermag! Halte nichts auf Sterndeuterei, auf Vogelflug, auf Vorzeichen, auf fabelhafte Wahrsagungen der Götzen! Von Giftmischerei, Zauberei, den abscheulichen Totenbeschwörungen sollst du nicht einmal etwas hören wollen. Lasse ab von Ausschweifungen jeder Art! Fröne nicht der Völlerei, ergib dich nicht der Wollust! Sei erhaben über Habsucht jeder Art und Wucher! Gehe nicht in heidnische Schauspiele! In Krankheiten wende nie Binden an! Meide all den Schmutz der Wirtshäuser! Falle nicht in Samaritanismus oder Judaismus! Denn für immer hat dich Jesus Christus davon befreit. Halte dich keineswegs mehr an die Beobachtung der Sabbate und nenne nicht mehr diese oder jene indifferente Speisen gemein und unrein! Vor allem hasse alle Zusammenkünfte der gottlosen Häretiker! Auf jede Weise stelle deine Seele sicher durch Fasten, Beten, Almosengeben und durch Lesung göttlicher Aussprüche, damit du die noch übrige Zeit deines Lebens im Fleische in Mäßigkeit und in Beobachtung frommer Lehren zubringst und dich des Heiles erfreuest, welches nur durch die Taufe gewährt wird! Auf genannte Weise sollst du für Gott Vater den himmlischen Heerscharen eingereiht und himmlischer Kronen gewürdigt werden in Christus Jesus, unserem Herrn, dem die Ehre sei in alle Ewigkeit. Amen. V. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über den Glauben.</p><h2>6</h2><p>* Über den Glauben.*</p><p>Welch hohe Gnade euch der Herr verleiht, indem er euch aus dem Stande der Katechumenen in den Stand der Gläubigen* (πιστοί)* [pistoi] versetzt, legt der Apostel Paulus dar mit den Worten: „Treu* (πιστός)* [pistos] ist Gott, durch den ihr berufen wurdet zur Gemeinschaft mit seinem Sohne Jesus Christus“. Wenn Gott* πιστός* [pistos] genannt wird, und auch du deshalb die gleiche Bezeichnung erhältst, dann ist das für dich eine große Gnade. Gott wird nämlich nicht nur gut, gerecht, allmächtig, der Herr des Weltalls genannt, sondern auch* πιστός* [pistos]. Beherzige es, zu welcher Würde du emporsteigst, wenn du an einer göttlichen Bezeichnung teilnehmen sollst.</p><p>„Da wird nun weiterhin von euch verlangt, daß einer gläubig* (πιστός)* [pistos] befunden werde“ vor seinem Gewissen; „denn einen gläubigen Mann zu finden, ist etwas Großes“. Nicht sollst du mir dein Gewissen offenbaren; denn nicht von menschlichem Gerichte wirst du gerichtet werden. Aber du sollst deinen ungeheuchelten Glauben Gott offenbaren, der Nieren und Herzen prüft und die Gedanken der Menschen kennt. Es ist etwas Großartiges um einen gläubigen Mann; er ist reicher als alle Reichen. Denn „dem Gläubigen gehört die ganze Welt der Reichtümer“, insofern er sie verachtet und mit Füßen tritt. Diejenigen, welche nach außen hin reich sind und viel besitzen, sind seelisch arm. Je mehr sie sich nämlich Schätze sammeln, von um so größerer Begierde nach dem, was ihnen noch fehlt, werden sie verzehrt. Der Gläubige dagegen — so widersprechend es klingt — ist reich in der Armut. Da er weiß, daß er nur Kleidung und Nahrung braucht, ist er damit zufrieden und tritt den Reichtum mit Füßen.</p><p>[Forts. v. ] Nicht nur bei uns, die wir den Namen Christi führen, steht der Glaube in großem Ansehen, sondern auch das ganze soziale Leben, auch das Leben derer, die außerhalb der Kirche stehen, vollzieht sich im Glauben. Die gesetzliche Trauung von Personen, die sich fremd gewesen sind, erfolgt auf Grund des Glaubens. Ein Fremder hat Anteil an fremdem Leib und Eigentum auf Grund des Glaubens, der im Ehevertrag ausgesprochen ist. Der Ackerbau beruht auf dem Glauben; denn wer nicht an eine Ernte glaubt, unterzieht sich keinen Mühen. Im Glauben begibt man sich auf das Meer, vertraut sich kleinstem Holze an und vertauscht das festeste Element, die Erde, mit den ungestüm wogenden Fluten; ungewisser Hoffnung gibt man sich hin, geführt vom Glauben, der sicherer ist als jeder Anker. Auf dem Glauben beruhen also die meisten menschlichen Unternehmungen, und nicht nur bei uns herrscht dieser Glaube, sondern, wie gesagt, auch bei jenen, welche uns ferne stehen. Denn wenn sie auch die Schrift nicht annehmen, sondern eigene Lehren vortragen, so nehmen sie doch auch ihre Lehren deshalb an, weil sie daran glauben.</p><p>Zum wahren Glauben ruft euch die heutige Schriftlesung. Sie zeigt euch den Weg, den auch ihr betreten müßt, um Gott zu gefallen. Sie erklärt nämlich, ohne Glaube sei es unmöglich, Gott zu gefallen. Wird je ein Mensch, der nicht glaubt, Gott werde ihn belohnen, sich entschließen, Gott zu dienen? Wird ein Mädchen je Jungfräulichkeit geloben oder ein Jüngling enthaltsam bleiben, wenn sie nicht glauben, daß der Keuschheit eine unverwelkliche Krone zuteil wird? Der Glaube ist das Auge, welches Licht ins ganze Innere bringt und Verständnis gibt. Denn der Prophet sagt: „Wenn ihr nicht glaubt, werdet ihr kein Verständnis haben“. Der Glaube verstopft nach Daniel die Rachen der Löwen; denn die Schrift sagt von Daniel: „Daniel wurde aus der Löwengrube herausgeholt, und keine Verletzung fand sich an ihm, da er an seinen Gott glaubte“. Gibt es etwas Schrecklicheres als den Teufel? Gegen ihn haben wir keine andere Waffe als den Glauben — einen unsichtbaren Schild gegen einen unsichtbaren Feind. Dieser schießt verschiedene Pfeile ab und durchbohrt in finsterer Nacht diejenigen, welche nicht auf der Hut sind. Doch da der Feind nicht sichtbar ist, haben wir im Glauben eine feste Schutzwehr gemäß dem Worte des Apostels: „In allem ergreifet den Schild des Glaubens, womit ihr werdet alle feurigen Geschosse des Bösen auslöschen können!“ Oft schießt der Teufel das feurige Geschoß schmählicher Sinnenlust ab; doch der Glaube kühlt, indem er das Gericht vorzeichnet, das Denken und löscht die Waffen.</p><p>Viel wäre über den Glauben zu sagen. Wollten wir ausführlich über denselben sprechen, so würde ein ganzer Tag nicht hinreichen. Vorderhand möge es genügen, wenn wir aus den Vorbildern des Alten Testamentes die eine Person Abrahams hervorgreifen, zumal wir durch den Glauben seine Kinder geworden sind. Abraham ist nicht nur auf Grund von Werken, sondern auch auf Grund des Glaubens gerechtfertigt worden. Viel hat er geleistet, doch Freund Gottes wurde er immer erst genannt, als er seinen Glauben bekannte. Und alles, was er tat, hat er im Glauben vollendet. Im Glauben verließ er seine Eltern, im Glauben verließ er Vaterland, Haus und Hof. Auf demselben Wege nun, auf dem jener gerechtfertigt wurde, sollst auch du gerecht werden. Nicht mehr konnte sein Körper Kinder erzeugen; denn Abraham war ein Greis. Auch sein Weib war schon bejahrt und hatte keine Hoffnung mehr, Kinder zu gebären. Gott verspricht dem Greise Nachkommenschaft, und „Abraham war nicht schwach im Glauben“, obwohl er erkannte, daß sein Leib bereits erstorben war. Er sah nicht auf die Schwäche seines Körpers, sondern auf die Kraft dessen, der die Verheißung gab, und hielt ihn für treu, und so empfing er aus erstorbenen Leibern wider Erwarten einen Sohn. Nachdem er ihn erhalten hatte, wurde ihm befohlen, seinen Sohn zu opfern. Trotz des Wortes: „In Isaak wird dein Same genannt werden“, opferte er Gott seinen eingeborenen Sohn, da er glaubte, daß Gott ihn auch von den Toten zu erwecken vermöge. Er band seinen Sohn, legte ihn auf das Holz und war entschlossen zum Opfer. Durch die Güte Gottes aber, der an Stelle des Kindes ein Lamm setzte, wurde sein Sohn ihm am Leben erhalten. Da Abraham hier treu gewesen war, wurde er besiegelt zum Zeichen der Gerechtigkeit. Er empfing die Beschneidung als Siegel des Glaubens, den er in der Vorhaut gezeigt hatte, und erhielt die Verheißung, Vater vieler Völker zu werden.</p><p>Wollen wir nun sehen, inwiefern Abraham der Vater vieler Völker ist! Wie allgemein bekannt ist, ist er der Vater der Juden infolge ihrer leiblichen Abstammung. Berücksichtigen wir (nur) die fleischliche Abstammung, dann müssen wir das Verheißungswort als falsch erklären; denn nicht ist er auch von uns allen Vater dem Fleische nach. Doch durch den Glauben ist er unser Vorbild, durch ihn werden wir alle Abrahams Söhne. Inwiefern und auf welche Weise? Menschen ist es unglaublich, daß jemand von den Toten aufersteht, wie es ihnen auch unglaublich ist, daß abgestorbene alte Leute Nachkommenschaft erhalten. Doch wenn verkündet wird, daß Christus gekreuzigt worden ist und nach seinem Tode wieder auferstanden ist, glauben wir es. Die Ähnlichkeit des Glaubens ist es, durch welche wir also zur Kindschaft Abrahams gelangen. Sind wir gläubig geworden, dann werden wir Abraham auch ähnlich, sofern wir das geistige Siegel erhalten, vom Hl. Geiste in der Taufe beschnitten werden — nicht an der Vorhaut des Fleisches, sondern im Herzen gemäß dem Worte des Jeremias: „Beschneidet Gott die Vorhaut eures Herzens!“, und nach dem Worte des Apostels: „in der Beschneidung Christi, mit ihm begraben in der Taufe usw.“.</p><p>Wenn wir diesen Glauben bewahren, werden wir tadellos sein und mit verschiedenartigen Tugenden geschmückt werden. Der Glaube vermag soviel, daß er sogar Menschen befähigt, auf dem Meere zu wandeln. Petrus war Mensch wie wir, bestehend aus Fleisch und Blut und von gleichen Lebensmitteln sich ernährend. Als Jesus zu ihm sagte: „Komm!“, da glaubte er und wandelte auf den Wassern. Der Glaube war ihm auf den Wassern ein festerer Halt als jeder Untergrund. Der schwere Körper wurde durch die Schwungkraft des Glaubens in die Höhe gehalten. Doch nur solange, als er glaubte, hatte er auf dem Wasser eine feste Basis. Als er zweifelte, da begann er unterzusinken. In dem Maße, als der Glaube nachließ, wurde auch der Körper mit abwärts gezogen. Jesus, der den leidenden Seelen aufhilft, sprach zu ihm, da er seine Not sah: „Kleingläubiger, warum zweifelst du?“ Da ihn Jesus an der Hand nahm und ihm Kraft gab und er wieder glaubte, von da ab wandelte er — an der Hand des Herrn — in gleicher Weise wieder auf den Wogen. Dies deutete uns das Evangelium an, wenn es erklärte: „Sie stiegen ins Schiff“. Nicht sagte es, Petrus habe schwimmend das Schiff erreicht, sondern es gibt zu erkennen, er sei in das Schiff gestiegen, nachdem er den gleichen Weg, auf dem er zu Jesus gekommen, noch einmal gegangen war.</p><p>[Forts. v. ] Der Glaube hat eine solche Kraft, daß nicht nur der, welcher glaubt, das Heil erhält, sondern daß auch auf Grund des Glaubens der einen andere gerettet worden sind. Der Gichtbrüchige in Kapharnaum war nicht gläubig; gläubig waren die, welche ihn trugen und ihn durch die Dachziegel hinabließen. Der Kranke hatte nämlich nicht nur einen kranken Körper, sondern auch eine kranke Seele. Glaube nicht, daß ich ohne Grund gegen ihn die Anklage erhebe; denn das Evangelium selbst sagte nicht „da Jesus* seinen* Glauben sah“, sondern „da Jesus* ihren* Glauben sah, sprach er zu dem Gichtbrüchigen: Stehe auf!“ Gläubig waren die Krankenträger, und der Gichtbrüchige erfreute sich der Genesung.</p><p>Willst du einen noch deutlicheren Beweis dafür, daß, während die einen glauben, andere gerettet werden?</p><p>Lazarus starb. Es verging der erste, zweite und dritte Tag. Seine Kräfte lösten sich auf, und Fäulnis zehrte schon an seinem Leibe. Hätte etwa einer, der schon den vierten Tag tot ist, glauben und für sich den Erlöser bitten können? Doch was der Tote nicht vermochte, haben die eigenen Schwestern erreicht. Als der Herr kam, fiel ihm seine Schwester zu Füßen, welche auf seine Frage: „Wo habt ihr ihn hingelegt?“ antwortete: „Herr, er riecht schon; denn vier Tage ist er tot.“ Da entgegnet der Herr: „Wenn du glaubst, wirst du die Herrlichkeit Gottes schauen“, gerade als wolle er sagen: „Da der Tote nicht glauben kann, glaube du!“ Und der Glaube der Schwestern hatte die Kraft, den Toten aus den Toren der Unterwelt zurückzurufen. Der stellvertretende Glaube vermochte Tote zu erwecken. Du aber solltest, wenn du aufrichtig für dich selber glaubst, nicht noch viel größere Vorteile haben? Doch solltest du keinen oder nur geringen Glauben haben, — der Herr ist barmherzig und nimmt sich, wenn du Buße tust, gerne deiner an. Nur sprich auch du aufrichtig: „Ich glaube, Herr, hilf mir in meinem Unglauben!“ Meinst du, gläubig zu sein, fehlt dir aber noch der vollkommene Glaube, dann mußt auch du mit den Aposteln sprechen: „Herr, vermehre uns den Glauben!“ Etwas nämlich hast du von dir, vieles erhältst du vom Herrn.</p><p>[Forts. v. ] Glaube ist ein einziges Wort, bedeutet aber zweierlei. Es gibt einen dogmatischen Glauben. Derselbe ist Zustimmung der Seele zu irgend etwas. Er rettet die Seele; denn der Herr sagt: “Wer meine Worte hört und an den glaubt, der mich gesandt hat, hat das ewige Leben und kommt nicht in das Gericht“, und an anderer Stelle: „Wer an den Sohn glaubt, wird nicht gerichtet, sondern geht vom Tode ins Leben“. O große Menschenfreundlichkeit Gottes! Die Gerechten (des Alten Bundes) haben jahrelang gottwohlgefällig gelebt. Was sie nun in jahrelangem Gott wohlgefälligem Dienste erreicht haben, das schenkt dir jetzt Jesus in einer einzigen Stunde. Wenn du nämlich glaubst, daß Jesus Christus der Herr ist und daß Gott ihn von den Toten erweckt hat, dann wirst du das Heil erlangen und in das Paradies versetzt werden von dem, der den Räuber ins Paradies eingeführt hat. Zweifle nicht, daß dies möglich ist! Denn der, welcher den Räuber, der nur eine einzige Stunde geglaubt hatte, hier auf dem hl. Golgatha erlöst hat, wird auch dich, wenn du glaubst, erlösen.</p><p>Es gibt aber auch noch einen Glauben anderer Art, ich meine das Gnadengeschenk Christi. „Dem einen wird nämlich durch den Geist Weisheitsrede gegeben, einem anderen Erkenntnisrede nach demselben Geist, wieder einem anderen Glaube in dem gleichen Geist, wieder einem anderen Heilungsgaben“. Dieser Glaube, der durch den Hl. Geist als Gnadengeschenk verliehen wird, ist also nicht nur ein dogmatischer, er wirkt auch Übermenschliches. Wer den Glauben letzterer Art hat, wird zu diesem Berge sagen: „Gehe von hier dorthin, und er wird fortgehen“. Wenn jemand gläubig so spricht im Vertrauen, es werde geschehen, ohne im Herzen zu zweifeln, dann erhält er die Gnade. Bezüglich dieser Art des Glaubens heißt es: „Wenn euer Glaube ist wie ein Senfkörnlein“. Wie nämlich das Senfkörnlein klein ist an Gestalt, aber seiner Kraft nach wirkt wie das Feuer, und wie, wenngleich der Same in kleinem Raume ruht, die Äste doch weit um sich greifen, so daß, wenn der Same sich entwickelt hat, sogar die Vögel Schatten finden können, so wirkt der Glaube in der Seele die größten Wunder, und zwar in einem Augenblick. Sie macht sich, durch den Glauben erleuchtet, eine Vorstellung von Gott und schaut Gott, soweit es möglich ist; sie durchwandert die Grenzgebiete der Welt, und schon vor Abschluß dieser Zeit sieht sie das Gericht und die Austeilung der verheißenen Belohnungen.</p><p>Du brauchst den Glauben, bei dem es auf dich ankommt, den Glauben an Gott, damit du den Glauben erhältst, den Gott gibt und der Übermenschliches wirkt.</p><p>Zum Lernen und Bekennen lasse dir nur das Glaubenssymbolum geben, welches dir die Kirche jetzt überreicht und welches in der ganzen Schrift wurzelt! An diesem halte fest! Da nämlich nicht alle die Schrift lesen können, die einen wegen mangelhafter Bildung, andere infolge dieser oder jener Beschäftigung keine Kenntnis davon haben, darum fassen wir, damit nicht die Seele durch Unkenntnis verloren gehe, die ganze Glaubenslehre in den wenigen Sätzen zusammen. Ich will, daß ihr euch dieselben wortwörtlich merket und bei euch recht eifrig hersaget. Nicht sollt ihr sie auf Papier schreiben, sondern zur Erinnerung ins Herz einmeißeln. Darauf sollt ihr achten, daß nicht etwa, wenn ihr dieselben lernt, ein Katechumene höre, was euch anvertraut worden ist. Wir wollen, daß euch dieser Glaube während eurer ganzen Lebenszeit eine Wegzehrung sei und daß ihr außer ihm nie einen anderen annehmet, auch dann nicht, wenn wir selbst von ihm abweichen und in Widerspruch mit unserer jetzigen Lehre geraten sollten, auch dann nicht, wenn ein böser Engel sich in die Gestalt eines Lichtengels kleiden und dich irreführen wollte. „Denn auch wenn wir oder ein Engel vom Himmel euch ein Evangelium verkünden würden, das im Widerspruch steht mit dem, welches ihr jetzt erhalten habt, so seien sie verflucht!“ Höre auf den Wortlaut des Glaubens, um ihn zu merken! Bei gegebener Gelegenheit sollst du die biblischen Belege für die einzelnen Sätze des Glaubensbekenntnisses zusammenstellen. Denn nicht menschliche Willkür hat dasselbe verfaßt, sondern die wichtigsten Lehren der ganzen Schrift sind in ihm zusammengestellt zu einer einzigen Glaubenslehre. Gleichwie der Same des Senfs in einem kleinen Körnlein die vielen Äste birgt, so hält dieses Glaubensbekenntnis in wenigen Worten alle religiösen Kenntnisse des Alten und Neuen Testamentes verschlossen. Wohlan, Brüder, haltet fest die Überlieferungen, welche ihr jetzt empfanget, und schreibet sie in eure weiten Herzen!</p><p>(Nach den letzten Worten erfolgte wohl die „Übergabe“ bzw. Mitteilung des Glaubensbekenntnisses an die Täuflinge.)</p><p>Haltet in Frömmigkeit an dem fest, was euch übergeben wurde, damit nicht etwa einige wegen ihrer Nachlässigkeit vom Feinde ausgeraubt werden! Kein Häretiker soll an dem rütteln, was euch übergeben worden ist! Das Glaubensbekenntnis übergeben heißt Geld auf die Bank legen. Das haben wir jetzt getan. Gott verlangt aber von euch Rechenschaft über das hinterlegte Kapital. „Ich beschwöre euch“ — wie der Apostel sagt — „vor Gott, der alles belebt, und vor Christus Jesus, der vor Pontius Pilatus das gute Bekenntnis abgelegt hat“, daß ihr diesen euch übergebenen Glauben unbefleckt bewahrt, bis unser Herr Jesus Christus erscheinen wird. Ein Schatz des Lebens wurde dir jetzt übergeben. Das hinterlegte Gut fordert der Herr bei seiner Wiederkunft, „welche zur rechten Zeit sehen lassen wird der selige und alleinige Herrscher, der König der Könige und der Herr der Herren, der allein Unsterbliche, der in unzugänglichem Lichte wohnt, den kein Mensch gesehen hat und keiner sehen kann. Ihm sei Herrlichkeit, Ehre und Macht in alle Ewigkeit. Amen“.VI. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Einheit Gottes, Erklärung zu dem Satze: „Ich glaube an einen Gott“. und über Häresien.</p><h2>7</h2><p>* Über die Einheit Gottes, Erklärung zu dem Satze: „Ich glaube an* einen* Gott“. und über Häresien.*</p><p>Gepriesen sei Gott und der Vater unseres Herrn Jesus Christus. Gepriesen sei auch sein eingeborener Sohn. Denn sobald man an Gott denkt, muß man auch an den Vater denken, damit Vater und Sohn unterschiedslos verherrlicht werden. Denn nicht besitzt der Vater eine andere Herrlichkeit als der Sohn, sondern ein und dieselbe. Da der Sohn der Eingeborene des Vaters ist, darum hat auch der Sohn, wenn der Vater verherrlicht wird, Anteil an dessen Herrlichkeit; denn die Herrlichkeit des Sohnes folgt aus der Ehre des Vaters. Andererseits wird, wenn der Sohn verherrlicht wird, auch der Vater dieses hohen Gutes sehr geehrt.</p><p>Der Verstand faßt (Gedanken) sehr rasch. Die Zunge jedoch bedarf (um Gedanken auszudrücken) der Ausdrücke und langer, wortreicher Erklärung. Mit einem Mal erfaßt das Auge den reichen Chor der Sterne; wollte jedoch jemand im einzelnen ausführen, was der Morgenstern, was der Abendstern, was jeder einzelne Stern ist, dann bedürfte es vieler Worte. Ebenso erfaßt der Verstand im Augenblick Erde, Meer und alle Grenzen der Welt; doch braucht man viele Worte, um das, was er in kürzester Zeit denkt, auszudrücken. Ist der Vergleich, den ich hiermit gegeben habe, auch lehrreich, so ist er doch immer noch schwach und hinkt. Denn nicht alles, was von Gott gesagt werden soll, sagen wir von ihm; denn dies ist ihm allein bekannt. Wir sagen nur, was die menschliche Natur faßt und was unsere Schwachheit ertragen kann. Nicht lehren wir, was Gott ist. Daß uns genaue Kenntnis über ihn fehlt, gestehen wir ehrlich. Für den Theologen ist es ein Zeichen großer Weisheit, seine Unwissenheit einzugestehen.</p><p>„Machet also mit mir groß den Herrn und lasset uns seinen Namen erheben“ allzumal; denn nicht einer allein vermag es. Ja selbst wenn wir alle zugleich zusammenkämen, werden wir doch nicht tun, was sein soll. Ich meine da nicht nur uns allein, die wir hier anwesend sind. Denn auch wenn alle Schäflein der ganzen katholischen Kirche der Gegenwart wie der Zukunft zusammenkommen würden, so wird es doch nicht möglich sein, den Hirten nach Gebühr zu preisen.</p><p>Groß und ehrwürdig war Abraham doch (nun) unter Menschen. Als er vor Gott trat, da sprach er aufrichtig die Wahrheit mit den Worten: „Ich bin Erde und Staub“. Nicht sagte er: „Ich bin Erde“, und schwieg dann. Denn nicht wollte er sich als das große Element bezeichnen. Vielmehr fügte er bei: „und Staub“, um die Hinfälligkeit und Gebrechlichkeit seiner Natur anzudeuten. Gibt es — will er sagen — etwas, was kleiner und unscheinbarer ist als Staub?</p><p>Vergleiche nämlich mit dem Staube ein Haus, mit dem Haus eine Stadt, mit der Stadt eine Provinz, mit der Provinz das römische Reich, mit dem römischen Reich die ganze Erde und all ihre Gebiete, die ganze Erde aber mit dem Himmel, der sie umfängt und der für die Erde dasselbe ist, was die ganze Peripherie für den Mittelpunkt ist! Bedenke dann, daß dieser erste und sichtbare Himmel kleiner ist als der zweite und der zweite kleiner als der dritte; drei nennt nämlich die Schrift, nicht weil es nur drei gibt, sondern weil es für uns so gut ist, nur drei zu kennen. Selbst wenn du im Geiste alle Himmel schauen würdest: auch die Himmel werden nicht Gott so, wie er ist, preisen können, auch dann nicht, wenn sie lauter dröhnen als der Donner. Wenn aber diese großen Himmelsräume Gott nicht nach Gebühr loben können, wann werden „Erde und Staub“, das Kleinste und Mindeste, was es gibt, würdige Lobpreisung zu Gott emporsenden oder würdig von Gott reden können, „der den Erdkreis hält und vor dem die Erdbewohner wie Heuschrecken sind“?</p><p>[Forts. v. ] Sollte jemand es versuchen wollen, über Gott zu sprechen, beschreibe er vorerst die Grenzen der Erde! Du bewohnst die Erde, und doch kennst du nicht die Grenzen deiner Wohnung, der Erde. Wie wirst du dir nun ihren Schöpfer würdig vorstellen können? Du siehst die Sterne, ihren Schöpfer aber siehst du nicht. Zähle die Sterne, die du siehst, und dann erzähle von dem, den du nicht siehst, „der die Menge der Sterne zählt und alle mit Namen nennt“! In letzter Zeit hätten uns fast die Tropfen starker Regengüsse den Untergang gebracht. Zähle nur einmal die Tropfen, die auf unsere Stadt fielen! Aber ich will nicht sprechen von unserer Stadt, zähle vielmehr die Tropfen, die in einer einzigen Stunde auf dein Dach fielen, wenn es dir möglich ist! Doch da es dir unmöglich ist, so erkenne deine Schwachheit! Lerne also Gottes Macht kennen! „Denn von ihm sind die Regentropfen gezählt“, die Regentropfen des ganzen Erdkreises, nicht nur diejenigen, welche jetzt gefallen sind, sondern auch diejenigen, welche zu jeder beliebigen Zeit fallen. Gottes Werk ist die Sonne. Ist sie auch groß, so ist sie doch im Vergleich mit dem ganzen Himmel sehr klein. Schaue zuerst hin zur Sonne, und dann forsche fleißig nach dem Herrn! „Forsche nicht nach dem, was dir zu hoch ist, und was über deine Kräfte geht, das suche nicht zu ergründen! Was dir befohlen ist, daran denke!“</p><p>Aber — wird man einwenden — wenn das Wesen Gottes unfaßbar ist, warum redest du davon?</p><p>Soll ich vielleicht, da ich nicht den ganzen Fluß auszutrinken vermag, nicht so viel zu mir nehmen, als mir gut tut? Soll ich, da meine Augen nicht die ganze Sonne zu fassen vermögen, sie auch nicht soweit ansehen, als für mich notwendig ist? Oder wenn ich einen großen Garten betrete und daselbst nicht den ganzen Bestand an Früchten essen kann, willst du, daß ich ganz hungrig wieder fortgehe?</p><p>Ich lobe und verherrliche unseren Schöpfer; denn ein göttlicher Befehl lautet: „Jeder Geist lobe den Herrn!“ Ich versuche jetzt den Herrn zu verherrlichen, nicht ihn zu erklären. Zwar weiß ich, daß ich seine Majestät nicht genügend verherrlichen werde, doch halte ich es für religiöse Pflicht, dies irgendwie zu versuchen. In meiner Schwachheit tröstet mich das Wort des Herrn Jesus: „Niemand hat Gott je gesehen“.</p><p>Wie — wird man einwenden — steht nicht geschrieben: „Die Engel der Kinder schauen immerdar das Angesicht meines Vaters, der im Himmel ist“? Doch die Engel sehen Gott nicht so, wie er ist, sondern nur soweit, als sie ihn fassen. Denn Jesus selbst sagt: „Niemand hat den Vater gesehen außer der, welcher aus Gott ist; dieser hat den Vater gesehen“. Die Engel sehen ihn also, sofern sie ihn fassen, und die Erzengel, sofern sie die Kraft haben; die Throne und Herrschaften aber schauen ihn besser als jene, doch fassen auch sie noch nicht seine Herrlichkeit. Schauen, wie es notwendig wäre, kann ihn nur mit dem Sohne der Hl. Geist. „Denn dieser erforscht und kennt alles, auch die Tiefen Gottes“. Ebenso erkennt auch der eingeborene Sohn zugleich mit dem Hl. Geist den Vater, wie es notwendig ist. „Denn“ — sagt er — „niemand kennt den Vater außer der Sohn und wem ihn der Sohn offenbart“. Er schaut nämlich Gott, wie es notwendig ist, und offenbart mit dem Geist und durch den Geist Gott einem jeden soweit, als dieser ihn erfaßt; denn der eingeborene Sohn hat mit dem Hl. Geist Anteil an der Gottheit des Vaters. Der Erzeugte kennt den Erzeuger, und der Erzeuger kennt den Erzeugten. Wenn die Engel Gott nicht erkennen, wenn sie erst — wie gesagt — vom Eingeborenen durch den Hl. Geist ihrer geistigen Anlage entsprechend die Offenbarung empfangen, dann braucht kein Mensch sich zu schämen, seine Unwissenheit zu gestehen.</p><p>Ich spreche jetzt, und zu ihrer Zeit sprechen alle. Doch wir können nicht sagen, auf welche Weise unsere Sprache entsteht. Wie kann ich nun den beschreiben, der die Sprache gegeben hat? Ich habe eine Seele, kann aber ihr Wesen nicht nennen. Wie werde ich nun den erklären können, der die Seele gegeben hat?</p><p>Uns religiösen Menschen genügt das eine, zu wissen, daß wir einen Gott haben, und zwar* einen* Gott, der ist, ewig lebt, sich selbst immer gleich* (ὅμοιος)* [homoios] bleibt, dessen Vater kein anderer ist, den niemand an Stärke übertrifft, dem niemand nachfolgt, um ihn aus seinem Reiche zu vertreiben, der zwar viele Namen hat und alles wirkt, aber doch einfach ist. Denn nicht ist er, wenn er gut, gerecht, allmächtig, Sabaoth genannt wird, immer wieder ein anderer. Er ist ein und derselbe, auch wenn er in tausendfacher Weise seine göttlichen Wirkungen zeigt. Nicht besitzt er bald mehr, bald weniger, sondern stets ist er sich gleich* (ὅμοιος)* [homoios]. Nicht ist er nur reich an Güte und arm an Weisheit, sondern gleich mächtig ist seine Weisheit und seine Güte. Nicht sieht er bald und ist bald blind; sondern er ist ganz Auge, ganz Ohr, ganz Verstand. Nicht gleich uns versteht er das eine Mal, das andere Mal nicht. Das wäre eine gotteslästerliche und gottesunwürdige Rede. Was ist, hat er vorhergewußt. Er ist heilig, allmächtig, ist der Allergütigste, Allergrößte, Allerweiseste. Nicht werden wir von seinem Anfang, seiner Form, seiner Gestalt reden können. „Denn niemals habt ihr seine Stimme gehört oder seine Gestalt gesehen“, sagt die göttliche Schrift. Daher spricht auch Moses zu den Israeliten: „Achtet sorgfältig auf eure Seelen, denn nicht habt ihr ein Bild gesehen“. Wenn der Geist völlig unfähig ist, sich von Gott ein Bild zu machen, wird er dann in sein Wesen eindringen können?</p><p>Viele haben sich vielerlei Vorstellungen (von Gott) gemacht, aber alle haben sie das Richtige verfehlt. Die einen erklärten Gott als Feuer. Andere verstanden darunter einen geflügelten Menschen, da sie das schöne Wort mißverstanden: „Unter dem Schutze deiner Flügel wirst du mich beschützen“. Sie haben vergessen, daß unser Herr Jesus Christus, der Eingeborene, sich des gleichen Ausdrucks bediente, da er von sich zu Jerusalem sprach: „Wie oft wollte ich deine Kinder versammeln wie ein Vogel seine Jungen unter seinen Flügeln, aber ihr habt nicht gewollt“. Da sie es nicht verstanden haben, daß mit den Flügeln auf die schützende Macht Gottes hingewiesen sein sollte, haben sie, dem Sinnlichen verfallen, den Unerforschlichen menschlich aufgefaßt. Andere haben gewagt zu behaupten, Gott habe sieben Augen, da die Schrift sagt: „Sieben Augen des Herrn schauen auf die ganze Erde“. Wenn er nur sieben Augen hat, dann sieht er nur teilweise und nicht vollkommen. Doch es ist Blasphemie, so von Gott zu sprechen. Denn daß Gott in allem vollkommen ist, müssen wir glauben auf Grund des Erlöserwortes: „Euer himmlischer Vater ist vollkommen“. Vollkommen ist sein Schauen, vollkommen sein Können, vollkommen seine Größe, vollkommen sein Vorherwissen, vollkommen seine Güte, vollkommen seine Gerechtigkeit, vollkommen seine Menschenliebe. Nicht ist er räumlich beschränkt, er hat den Raum erschaffen. Er ist in allen, aber von niemandem begrenzt. Sein Thron ist der Himmel; der darauf sitzt, ist über ihn erhaben. Sein Schemel ist die Erde; doch seine Macht reicht bis zur Unterwelt.</p><p>[Forts. v. ] Gott ist* einer*, überall gegenwärtig, alles sehend, alles erkennend, alles durch Christus erschaffend. „Denn alles wurde durch ihn gemacht, und nichts wurde ohne ihn gemacht“. Er ist die größte, nie versiegende Quelle alles Guten, ein Strom von Wohltaten, ein ewiges, ständig leuchtendes Licht, eine unzerstörbare Kraft, welche sich zu unseren Schwachheiten herabläßt. Wir könnten es nicht einmal aushalten, seinen Namen zu hören. „Wirst du die Spur des Herrn finden“ — fragt Job — „oder bist du bis in die kleinsten Dinge, die der Allmächtige erschaffen hat, gedrungen?“ Wenn seine geringsten Geschöpfe nicht erfaßt werden, wird dann der Weltschöpfer erfaßt werden? „Kein Auge hat es gesehen, und kein Ohr hat es gehört, und in keines Menschen Herzen ist es gekommen, was Gott denen bereitet hat, die ihn lieben“. Wenn unser Verstand das nicht begreifen kann, was Gott bereitet hat, können wir dann mit unserem Geiste den begreifen, der es uns bereitet hat? „O Tiefe des Reichtums, der Weisheit und Erkenntnis Gottes! Wie unerforschlich sind seine Gerichte und wie unergründlich seine Wege.“, sagt der Apostel. Werden seine Gerichte und Wege als unbegreiflich bezeichnet, wird er dann selbst begriffen werden?</p><p>So groß ist also Gott, ja er ist noch größer. Denn selbst wenn ich ganz Sprache werden würde, könnte ich doch nicht nach Gebühr über ihn sprechen; ja selbst wenn alle Engel zusammenkommen würden, so werden sie doch noch nicht seine Majestät zum Ausdruck bringen. Obwohl nun Gott so mächtig, gut und groß ist, haben doch Menschen sich vermessen, Steine zu meißeln, um zu ihnen zu sagen: „Mein Gott bist du“. O große Blindheit, welche von solcher Höhe in solche Tiefe hinabstürzt! Das Holz, das Gott pflanzt und der Regen wachsen läßt, das später verbrannt und im Feuer zu Asche wird, das wird Gott genannt, während der wahre Gott verachtet wird. Aber die Bosheit des Götzendienstes ging noch weiter: selbst Katzen, Hunde, Wölfe wurden an Gottesstatt verehrt, auch der menschenfressende Löwe wurde anstatt des so menschenfreundlichen Gottes angebetet. Die Schlange und der Drache, welche den versinnbilden, der uns aus dem Paradiese vertrieben hat, wurde verehrt, während der, welcher das Paradies gepflanzt hatte, verachtet wurde. Ich schäme mich, es zu sagen, doch sage ich es: sogar die Zwiebel wurde von einigen angebetet. Der Wein wurde gegeben, um des Menschen Herz zu erfreuen; doch statt Gott wurde Dionysos verehrt. Gott schuf das Getreide, da er sprach: „Die Erde bringe hervor die Pflanzen des Feldes, die Samen tragen nach ihrer Art“, damit „das Brot stärke das Herz des Menschen“. Warum aber wurde Demeter angebetet? Das Feuer wird bis auf den heutigen Tag durch Aufeinanderschlagen von Steinen hervorgelockt. Warum soll also Vulkan der Schöpfer des Feuers sein?</p><p>Warum die Torheit des Polytheismus bei den Griechen? Gott ist ohne Körper. Warum wird von Ehebruchszenen bei ihren sogenannten Göttern berichtet? Ich schweige von den Verwandlungen des Zeus in einen Schwan. Ich schäme mich, von seiner Verwandlung in einen Stier zu erzählen. Gottes unwürdig wäre es ja, zu brüllen. Bei den Griechen sehen wir Gott als Ehebrecher, und doch schämen sie sich nicht. Ist er ein Ehebrecher, dann darf er nicht den Namen Gott haben. Auch von Todesfällen, Unfällen, Blitzschlägen ihrer Götter wissen sie zu erzählen. Siehst du, wie tief sie gesunken sind? War es etwa nicht notwendig, daß der Sohn Gottes vom Himmel herabstieg, und zwar um solche Wunden zu heilen? War es etwa nicht notwendig, daß der Sohn kam, und zwar damit der Vater erkannt würde? Verstehst du, was den Eingeborenen bewogen hat, vom Throne zur Rechten herabzusteigen? Der Vater wurde verachtet, darum mußte der Sohn den Irrtum korrigieren. Notwendig war es, daß der, durch den alles gemacht war, dem Herrn des Weltalls alles darbrachte. Notwendig war es, daß die Wunde geheilt wurde. Denn was war schlimmer als diese Krankheit, daß ein Stein als Gott verehrt wurde?Häresien.</p><p>[Forts. v. ] Nicht nur unter den Heiden war der Teufel tätig. Viele falsche Christen, welche zu Unrecht mit dem so wohlriechenden Namen Christi bezeichnet worden waren, haben in gottloser Weise gewagt, Gott seine eigenen Werke abzusprechen. Ich meine die unseligen, ganz von Gott verlassenen Häretiker, die vorgeben Christusfreunde zu sein, aber durchweg Christusfeinde sind. Denn wer den Vater Christi lästert, ist Feind des Sohnes. Sie erkühnten sich, von zwei Gottheiten zu sprechen, von einer guten und einer bösen. O diese große Blindheit! Ist die Gottheit Gottheit, dann ist sie auch durchweg gut. Ist sie aber nicht gut, wie kann sie noch Gottheit genannt werden? Denn zum Wesen Gottes gehört es, gut zu sein. Gott kommt es zu, Menschen zu lieben, wohlzutun, allmächtig zu sein. Es ist nur eines von beiden möglich: entweder ihn Gott zu nennen und zugleich mit dem Namen ihm auch (göttliches) Wirken zuzusprechen, oder, wenn man ihm das Wirken absprechen will, ihm auch den Namen zu versagen.</p><p>Die Häretiker vermessen sich, von zwei Göttern, einer Quelle des Guten und einer Quelle des Bösen, zu sprechen, von denen eine jede ungeworden sein soll. Wären aber beide ungeworden, dann wären jedenfalls beide auch gleich mächtig. Wie aber könnte nun das Licht die Finsternis verscheuchen? Ferner: sind beide vereint oder getrennt? Vereint können sie nicht sein. „Denn welche Gemeinschaft hat das Licht mit der Finsternis?“, fragt der Apostel. Haben sie aber miteinander gar nichts zu tun, dann hat jedenfalls jedes auch seinen abgeschlossenen Raum. Wenn sie aber getrennte Räume haben, dann sind wir doch wohl (nur) in dem Gebiete eines einzigen Gottes, dann beten wir doch wohl nur einen einzigen Gott an. Daß man nur einen einzigen Gott anbeten soll, so müssen wir nämlich auch dann schließen, wenn wir uns von der Torheit jener Häretiker leiten lassen.</p><p>Prüfen wir, was sie über den guten Gott lehren! Ist er mächtig oder machtlos? Wenn er mächtig ist, wie ist wider seinen Willen das Böse geworden? Wie erscheint wider seinen Willen in der Welt das böse Wesen? Wenn er es, obwohl er davon weiß, nicht verhindern kann, dann beschuldigen ihn die Häretiker der Ohnmacht. Wenn er es aber verhindern kann und doch nicht verhindert, dann beschuldigen sie ihn des Verrates. Achte auf ihre Torheit! Bald sagen sie, der böse Gott habe bei Erschaffung der Welt in keiner Weise mit dem guten Gott gewirkt; bald schreiben sie ihm nur den vierten Teil davon zu. Den guten Gott nennen sie Vater Christi, unter Christus aber verstehen sie unsere Sonne. Wenn nach der Lehre der Häretiker die Welt von dem bösen Gott erschaffen worden ist, zu der Welt aber die Sonne gehört, wie kommt es, daß der Sohn des guten Gottes wider seinen Willen im Reiche des bösen Gottes dient? Im Schmutze wandeln wir, wenn wir von solcher Lehre sprechen. Aber wir müssen es, damit keiner von den Anwesenden infolge von Unwissenheit in den Schmutz der Häretiker falle. Zwar weiß ich, daß ich (mit dem Hinweis auf solche Lehren) meinen Mund und die Ohren der Zuhörer beflecke; doch es muß sein. Viel besser ist es, in polemischen Vorträgen von den Torheiten anderer zu hören, als nichts von denselben erfahren zu haben und deshalb in sie zu fallen. Viel besser ist es, den Schmutz zu kennen und ihn zu hassen, als ihn nicht zu kennen und in denselben zu geraten.</p><p>Verschiedenartig ist die gottlose Lehre der Häretiker. Denn sobald einer von dem einen rechten Wege abweicht, stürzt er oftmals in Abgründe.</p><p>[Forts. v. ] Der Urheber aller Häresie ist Simon der Magier, jener Simon, welcher nach der Apostelgeschichte die unkäufliche Gnade des Geistes um Geld kaufen zu können erwartete, jedoch die Worte zu hören bekam: „Du hast keinen Teil und kein Los daran usw.“. Von ihm ist geschrieben: „Sie sind von uns ausgegangen, aber sie waren nicht von uns; wären sie nämlich von uns gewesen, dann wären sie bei uns geblieben“. Als Simon nach der Verstoßung durch die Apostel nach Rom gekommen war in Begleitung einer griechischen Buhlerin, da hat er als erster sich zu der gotteslästerlichen Behauptung verstiegen, er sei Gott-Vater, der sich auf dem Berge Sinai geoffenbart hatte, bei den Juden sei er später zum Scheine — nicht im Fleische — als Christus Jesus erschienen und hierauf als Hl. Geist, als der von Christus verheißene Tröster. Die Stadt Rom täuschte er so sehr, daß Claudius ihm eine Statue errichten ließ, welche in römischer Sprache die Aufschrift trug: „Simoni Deo Sancto“, d. h. übersetzt: „Simon, dem hl. Gott“.</p><p>Als die Irrlehre sich weiter ausbreitete, kam das edle Paar Petrus und Paulus, die Häupter der Kirche, um den Schaden gut zu machen. Gerade als sich der vermeintliche Gott Simon produzieren wollte, stellten sie ihn tot vor. Simon hatte nämlich verkündet, er erhebe sich zum Himmel. Als er nun (b0ereits) auf dämonischem Wagen in die Lüfte fuhr, da fielen die Diener Gottes auf die Knie nieder in jener Eintracht, von der Jesus gesagt hatte: „Wenn zwei von euch eines Sinnes sind, dann werden sie alles, um was sie bitten, erhalten“. Sie schleuderten gegen den Magier die Waffe des einträchtigen Gebetes und warfen ihn auf die Erde herab. Ein wunderbarer Vorfall! Und doch nicht wunderbar, da ja Petrus die Schlüssel der Himmel trug, nicht wunderbar, da ja Paulus in den dritten Himmel und ins Paradies entrückt worden war und „unaussprechliche Worte gehört hatte, die man keinem Menschen sagen darf“. Petrus und Paulus haben den vermeintlichen Gott aus der Luft auf die Erde herabgeworfen, damit er in die Unterwelt geschleudert werde. Simon war der erste Drache der Bosheit. Kaum war aber* ein* Haupt abgeschlagen, da zeigte es sich, daß die Wurzel des Übels viele Köpfe trug.</p><p>Es beschmutzten nämlich noch die Kirche: Cerinth, Menander, Karpokrates, die Ebioniten und Marcion, der Mund der Gottlosigkeit. Wer verschiedene Götter verkündet, den einen als guten Gott, den anderen dagegen als gerechten Gott bezeichnet, der widerspricht dem Sohne, der sagt: „Gerechter Vater!“ Wer zwischen dem Vater und dem Weltschöpfer unterscheidet, der setzt sich in Gegensatz zu dem Worte des Sohnes: „Wenn Gott das Gras des Feldes, das heute ist und morgen in den Feuerofen geworfen wird, also kleidet“, und: „Der seine Sonne aufgehen läßt über Böse und Gute, und über Gerechte und Ungerechte regnen läßt“. Marcion ist der Urheber eines noch anderen Vergehens. Da er durch die im Neuen Testament stehenden alttestamentlichen Zeugnisse widerlegt worden wäre, hat er, nachdem er Gott verlassen hatte, als erster sich erfrecht, diese Zeugnisse auszumerzen und das verheißene Wort des Glaubens der Zeugnisse zu berauben. Er wollte, gerade als wenn keine Prediger mehr dagewesen wären, den Glauben der Kirche wankend machen.</p><p>Auf Marcion folgte der unselige, sittlich ganz verkommene Basilides, dessen Predigt Schamlosigkeit war. Für die Sünde trat auch auf den Plan Valentin, der dreißig Götter predigte. Während die Griechen nur einige Götter zählen, hat er, der sich, obwohl er kein Christ war, Christ nannte, den Irrtum auf volle dreißig ausgedehnt. Seine Lehre ist: Bythos (═ die Tiefe) — gut fängt er, die Tiefe der Bosheit, seine Lehre mit der Tiefe an — gebar die Sige (═ das Schweigen) und erzeugte aus der Sige den Logos. Bythos ist noch schlimmer als der Zeus der Griechen. Während dieser sich mit seiner Schwester verband, soll Sige die Tochter des Bythos gewesen sein. Merkst du die Torheit unter dem christlichen Gewande? Gleich wirst du geradezu von Haß gegen diese Gottlosigkeit ergriffen werden. Valentin behauptet nämlich, aus dem Bythos seien acht Äonen erzeugt worden, ferner hier noch zehn, dort noch weitere zwölf, und zwar männliche und weibliche Äonen. Wie kommt er zu dieser Äonenreihe? Achte auf die Beweise für diese Albernheit! Wie beweist du die dreißig Äonen? Es ist — entgegnet Valentin — geschrieben, daß Jesus dreißig Jahre alt war, als er getauft wurde. Wenn auch Jesus dreißig Jahre alt war, als er getauft wurde, wie kann aber aus diesen dreißig Jahren dieser Schluß gezogen werden? Gibt es nicht vielleicht deshalb, weil Jesus fünf Brote für fünftausend Menschen gemacht hatte, fünf Götter? Oder sollte es nicht deshalb, weil Jesus zwölf Jünger hatte, zwölf Götter geben?</p><p>Doch das ist noch eine Kleinigkeit gegenüber dem, was er sich sonst noch an Gottlosigkeit geleistet hat. Er lehrt, die letzte Gottheit sei männlich und weiblich zugleich und — eine Frechheit ist es, so zu behaupten — sie sei die Weisheit. Welche Gottlosigkeit! Denn während Christus, der eingeborene Sohn, die Weisheit Gottes ist, hat Valentin in seiner Lehre die Weisheit Gottes zu einem Weibe, zum dreißigsten Element, zum letzten Geschöpf erniedrigt. Er erklärt, die Weisheit habe versucht, den Urgott zu schauen; da sie aber seinen Glanz nicht ertragen konnte, stürzte sie von den Himmeln und fiel aus der Zahl Dreißig. Dann habe sie geklagt und aus den Klagen den Teufel erzeugt. Ihre Tränen über den Sturz haben das Meer geschaffen. Siehst du die Gottlosigkeit? Wie kann aus der Weisheit der Teufel, aus dem Verstande die Sünde, aus dem Licht die Finsternis entstehen? Weiter lehrt Valentin: Der Teufel erzeugte andere Wesen, und aus diesen erschufen einige die Welt. Christus aber sei herabgestiegen, um die Menschen dem Weltschöpfer abwendig zu machen.</p><p>[Forts. v. ] Damit nun dein Haß gegen die Häretiker sich noch steigere, höre, was sie unter Christus verstehen! Sie lehren, nach dem Sturz der Weisheit habe jeder der (übrigen) neunundzwanzig Äonen, um die Zahl dreißig wieder voll zu machen, einen ganz kleinen Teil beigetragen und so Christus gebildet, welchen sie wieder als männlich-weibliches Wesen bezeichnen. Gibt es etwas Gottloseres als diese Lehrer, gibt es etwas Erbärmlicheres? Ich erzähle dir von der Häresie, damit du die Häretiker immer mehr hassest. Fliehe also die Gottlosigkeit! Grüße solche Leute auch nicht, auf daß du an den unfruchtbaren Werken der Finsternis keinen Anteil habest! Gib dich mit ihnen nicht ab und lasse dich in kein Gespräch mit ihnen ein!</p><p>Hasse alle Häretiker, ganz besonders aber den Häretiker, der vom Wahnsinn* (μανία)* [mania] seinen Namen hat und vor nicht langer Zeit unter Kaiser Probus aufgetreten war! Vor vollen siebzig Jahren entstand die Irrlehre, und noch heute leben Menschen, welche den Irrlehrer mit eigenen Augen gesehen haben. Doch nicht sollst du ihn hassen, weil er erst vor kurzem gelebt hat, sondern hasse den Verbrecher, den Sammelpunkt allen Unrates, das Gefäß allen häretischen Schmutzes wegen seiner gottlosen Lehren! Er legte seine Ehre darein, in der Sünde sich auszuzeichnen, setzte, aus allem auswählend, eine einzige Häresie zusammen, die von Gotteslästerungen und allen möglichen Verbrechen strotzte, und schädigte auf diese Weise wie ein umhergehender, gefräßiger Löwe die Kirche, mehr noch die, welche außerhalb der Kirche sind. Achte nicht auf die schöne Form seiner Worte, nicht auf seine geheuchelte Demut! Schlangen sind sie, ein Natterngezücht. Auch Judas hatte, als er den Herrn verriet, gesagt: „Sei gegrüßt, Meister!“ Achte nicht auf die Küsse, sondern auf das Gift!</p><p>[Forts. v. ] Damit es jedoch nicht scheine, als hätten wir keinen Grund, ihn anzuklagen, wollen wir kurz sehen, wer dieser Mani ist, und wollen seine Lehre zum Teil darlegen; denn um von all seinen Gemeinheiten entsprechend zu berichten, dazu würde ein ganzes Menschenalter nicht hinreichen. Präge meine Worte deinem Gedächtnis ein! Sie werden dir zur rechten Zeit von Nutzen sein. Was den früheren Täuflingen gesagt worden war, wird auch den jetzigen vorgetragen. Wer nämlich noch in Unkenntnis ist, soll lernen; wer schon gelernt hat, soll rekapitulieren.</p><p>Mani war kein Christ. Das sei ferne! Nicht ist er wie Simon aus der Kirche ausgestoßen worden — er so wenig wie seine Lehrer. Böse Lehren hat er bei Fremden gestohlen und sich angeeignet. Wie, das vernehmet!</p><p>[Forts. v. ] In Ägypten lebte ein gewisser Skythianos, ein Sarazene; weder zum Judentum noch zum Christentum stand er in Beziehung. Er wohnte zu Alexandrien und ahmte die aristotelische Lebensweise nach. Er schrieb vier Bücher. Das eine hatte den Titel „Evangelium“, ein leerer Name; denn es enthielt nicht das Leben Christi. Ein anderes hieß „Kapitel“, ein drittes „Geheimnisse“, ein viertes, das bei ihnen noch im Umlauf ist, „Schatz“. Sein Schüler war Terebinthos. Als Skythianos den Plan faßte, nach Judäa zu wandern, um das Land zu verpesten, sandte ihm der Herr eine tödliche Krankheit und verhinderte die Pest.</p><p>Der Schüler der Bosheit, Terebinthos, erbte das Geld, die Bücher und die Häresie des Skythianos. Er kam nach Palästina. Da er aber in Judäa erkannt und verurteilt wurde, entschloß er sich, nach Persien zu gehen. Um sich aber hier nicht durch seinen Namen zu verraten, nannte er sich Budda. Gleichwohl hatte er auch hier seine Gegner, und zwar in den Priestern des Mithras. In vielen Unterredungen und Disputationen, welche er mit ihnen hatte, wurde er widerlegt. In die Enge getrieben, flüchtete er schließlich zu einer Witwe. Da stieg er auf ein Dach und rief die Dämonen der Luft zu Hilfe, welche die Manichäer noch bis auf den heutigen Tag bei der abscheulichen Feigenzeremonie anrufen. Aber Gott schlug ihn, er stürzte vom Dache und gab seinen Geist auf. So wurde das zweite Tier aus der Welt geschafft.</p><p>[Forts. v. ] Noch aber waren da die Bücher, welche die Erinnerung an seine Bosheit bewahrten. Die Witwe erbte die Bücher und das Vermögen. Da sie keinen Verwandten noch sonst jemanden hatte, beschloß sie, mit dem Vermögen einen Knaben namens Kubrikos zu kaufen. Sie nahm ihn an Kindesstatt an, ließ ihn wie einen eigenen Sohn in den Wissenschaften der Perser unterrichten und schärfte so die Waffe zum Verderben der Menschheit. Kubrikos, der böse Knecht, wuchs mitten unter den Philosophen heran. Als die Witwe gestorben war, erbte er von ihr die Bücher und das Vermögen. Da er sich seines Sklavennamens schämte, nannte er sich später statt Kubrikos Mani, was in der Sprache der Perser „Rede“ bedeutet. Da er nämlich meinte, redegewandt zu sein, nannte er sich Mani, als wäre er ein vorzüglicher Redner gewesen. Im Sprachgebiet der Perser verschaffte er sich damit allerdings Ansehen. Aber durch göttliche Fügung wurde er wider seinen Willen sein eigener Ankläger: während er in Persien sich zu ehren glaubte, sollte er sich bei den Griechen auf Grund seines Namens als wahnsinnig bekennen.</p><p>Er erfrechte sich zu behaupten, er sei der Tröster, obwohl doch geschrieben steht: „Wer gegen den Hl. Geist lästert, erhält keine Verzeihung“. Er lästerte, da er sich für den Hl. Geist ausgab. Wer mit solchen Leuten Gemeinschaft macht, der sehe wohl zu, an wen er sich anschließt! Der Knecht brachte den Erdkreis in Aufregung. Denn „durch drei Dinge erbebt die Erde, und das vierte kann sie nicht ertragen: wenn ein Knecht regiert“. Öffentlich verhieß er Übermenschliches. Der Sohn des Perserkönigs war krank, eine Menge von Ärzten war anwesend. Da verhieß Mani, er werde durch sein frommes Gebet ihn gesund machen. Die Ärzte traten ab, und zu gleicher Zeit endete das Leben des Knaben. Die Gottlosigkeit des Mannes war erwiesen. Der Philosoph wurde gefesselt und in den Kerker geworfen, nicht als ob er dem König im Interesse der Wahrheit Vorstellung gemacht oder Götzenbilder zerstört hätte, sondern weil er Genesung versprochen, das Versprechen aber nicht gehalten hatte, ja weil er — wenn man die Wahrheit sagen soll — einen Mord begangen hatte. Denn er hatte die Ärzte entfernen lassen und so den, der durch ärztliche Sorgfalt noch hätte gerettet werden können, durch seinen Leichtsinn ums Leben gebracht.</p><p>Von dem ganzen Sündenregister, das ich da aufzähle, erwäge zunächst seine Gotteslästerung, dann sein Knechtsein! Nicht als ob Knechtsein Schande wäre, sondern weil es sich nicht gehört, daß ein Knecht Freiheit heuchelt. Erwäge drittens, daß er sein Versprechen nicht gehalten hat; viertens die Ermordung des Knaben; fünftens die Schmach der Kerkerstrafe! Schmachvoll war nicht nur die Kerkerstrafe, sondern auch die Flucht aus dem Kerker. Trotzdem er sich den Tröster und einen Verfechter der Wahrheit nannte, ergriff er die Flucht. Kein Nachfolger Jesu war er, der freiwillig ans Kreuz gegangen war. Er war das Gegenteil von ihm, da er floh. Der Perserkönig ließ damals die Gefängniswärter zum Tode führen. Durch seine Großsprecherei war Mani schuld am Tode des Knaben, durch seine Flucht schuld am Tode der Gefängniswärter. Soll nun der, welcher die Todesstrafe verdient, anbetungswürdig sein? Hätte er nicht Jesum nachahmen und sagen sollen: „Wenn ihr mich suchet, dann lasset diese gehen!“ Hätte er nicht wie Jonas sprechen sollen: „Nehmet mich und werfet mich ins Meer; denn meinetwegen ist dieser Sturm entstanden“.</p><p>Mani floh aus dem Gefängnis und kam nach Mesopotamien. Da trat ihm Bischof Archelaos entgegen, ein Schild der Gerechtigkeit. Dieser weist ihn zurecht vor einem aus Philosophen bestehenden Richterkollegium in Gegenwart eines heidnischen Publikums; nicht Christen sollten das Richteramt ausüben, damit die Richter nicht in Verdacht kamen, parteiisch zu sein. Archelaos sagt zu Mani: „Teile uns deine Lehre mit!“ Mani, dessen Mund ein offenes Grab war, fing an, den Weltschöpfer zu lästern und erklärte: „Der Gott des Alten Bundes ist der Urheber der Sünde; denn er behauptet von sich: ‚Ich bin ein verzehrendes Feuer‘“. Der weise Archelaos widerlegte die Gotteslästerung mit den Worten: „Wenn nach deiner Lehre der Gott des Alten Bundes sich als Feuer bezeichnet, wessen Sohn ist der, welcher sagte:,Ich bin gekommen, Feuer auf die Erde zu schicken‘? Wenn du den tadelst, welcher behauptete,der Herr tötet und erweckt zum Leben‘, warum ehrst du den Petrus, welcher die Tabitha zum Leben erweckte, die Saphira dem Tode überantwortete? Wenn du den Gott des Alten Bundes anklagst, weil er das Feuer bereitet habe, warum klagst du nicht den an, der sagte: ‚Weichet von mir in das ewige Feuer‘? Wenn du den tadelst, der sagte: ‚Ich bin Gott, der Friede macht und Leiden schafft‘, erkläre mir: wie kann Jesus sagen:,Ich bin nicht gekommen, Friede auf die Erde zu bringen, sondern das Schwert‘? Wenn beide (═ der Gott des Alten Bundes und Jesus) dasselbe sagen, dann ist eines von beiden möglich: entweder sind beide gut, da sie in der Lehre übereinstimmen, oder wenn Jesus infolge der erwähnten Lehre keinen Tadel verdient, wie kannst du dem Vorwürfe machen, der im Alten Bunde das gleiche getan hatte?“</p><p>Da spricht Mani zu Archelaos: „Welches ist der Gott, der verblendet? Denn Paulus schreibt:,Der Gott dieser Welt hat den Sinn der Ungläubigen verblendet in ihrem Innern, so daß sie nicht sehen den Glanz des Evangeliums‘“. Archelaos erwidert mit den trefflichen Worten: „Lies das Sätzchen, das zuvor geschrieben steht: ‚Wenn unser Evangelium auch verborgen ist, so ist dies nur bei den Verlorenen der Fall‘“. Siehst du, daß es vor denen verborgen ist, welche verloren sind? Denn nicht darf man das Heilige den Hunden geben. Hat übrigens nur der Gott des Alten Bundes den Sinn der Ungläubigen verblendet? Hat nicht Jesus gesagt: ‚Daher rede ich zu ihnen in Gleichnissen, damit sie sehen und doch nicht sehen‘? Hat er etwa, weil er sie haßte, gewollt, daß sie nichts sehen? Oder hat er es gewollt wegen ihrer Unwürdigkeit, weil sie ihre eigenen Augen verschlossen hatten? Wo man sich für Bosheit entscheidet, wird die Gnade entzogen.,Denn, wer hat, dem wird gegeben werden; wer aber nicht hat, dem wird auch das, was er zu haben scheint, genommen werden‘.</p><p>[Forts. v. ] Sollte man der von einigen Exegeten gegebenen Erklärung folgen:,Wenn er auch den Sinn der Ungläubigen verblendet hat, er hat ihn in guter Absicht verblendet, damit sie nämlich ihre Augen zum Guten erheben‘: die Erklärung ist nicht übel. Denn nicht heißt es:,Er hat verblendet ihre Seele‘, sondern:,den Sinn der Ungläubigen‘. Damit will gesagt sein: verblende den unkeuschen Sinn des Unkeuschen, und der Mensch ist gerettet; verblende des Räubers Gedanken an Raub und Diebstahl, und der Mensch ist gerettet. Doch paßt dir diese Auslegung nicht: es gibt noch eine andere Erklärung. Die Sonne blendet diejenigen, welche schwache Augen haben. Die Augenkranken leiden unter dem Licht und werden geblendet; nicht jedoch ist die Sonne schuld daran, sondern die Natur der Augen. So können die Ungläubigen deshalb, weil ihr Herz krank ist, nicht in die Strahlen der Gottheit schauen. Nicht heißt es:,Er hat den Sinn geblendet, daß sie das Evangelium nicht hören‘, sondern:,Er hat ihn geblendet, daß sie nicht sehen den Glanz der Herrlichkeit des Evangeliums unseres Herrn Jesus Christus‘. Das Evangelium zu hören, ist nämlich allen gestattet. Die Herrlichkeit des Evangeliums aber ist nur den wahren Jüngern Christi vorbehalten. Der Herr sprach zu denen, welche es nicht verstehen konnten, in Gleichnissen; seinen Jüngern speziell aber legte er die Gleichnisse aus. Der Getauften Anteil ist Glanz und Herrlichkeit, der Ungläubigen Anteil Verblendung. Diese Geheimnisse, welche dir seit deinem Austritt aus dem Katechumenat jetzt die Kirche auslegt, dürfen den Heiden nicht erklärt werden. Nicht erklären wir in Gegenwart von Heiden die Geheimnisse des Vaters, des Sohnes und des Hl. Geistes; noch sprechen wir in Gegenwart von Katechumenen offen über die Geheimnisse. Über vieles und oftmals reden wir geheimnisvoll, damit die eingeweihten Gläubigen es verstehen und die Uneingeweihten keinen Anstoß daran nehmen.“</p><p>Mit den erwähnten und noch mehreren anderen Gründen wurde der Drache geschlagen; mit solchen Waffen wurde Mani von Archelaos niedergeworfen. Er, der seinerzeit aus dem Gefängnis geflohen war, begibt sich von neuem auf die Flucht. Er macht sich vor seinem Gegner aus dem Staub und kommt in ein gar armseliges Dorf. Der Schlange glich er, welche im Paradies den Adam verließ und dann sich an die Eva wandte. Aber der gute Hirte Archelaos, der für seine Schafe auf der Hut war, machte sich, als er von der Flucht erfuhr, sofort eilends auf die Suche nach dem Wolf. Kaum hatte Mani seinen Gegner zu Gesicht bekommen, wandte er sich und floh. Es war seine letzte Flucht. Die Soldaten des Perserkönigs, die überall nach ihm suchten, ergriffen ihn auf der Flucht. Die Strafe, welche er (b0ereits) vor Archelaos verdient hätte, haben die Soldaten des Königs an ihm vollzogen. Mani, den seine Jünger verehren, wird gefangen vor den König geführt. Der König machte ihm Lüge und Flucht zum Vorwurf, spottete über seinen Sklavenstand, nahm Rache wegen des Todes seines Sohnes, verurteilte ihn auch wegen des Todes der Gefängniswärter und ließ ihm nach persischem Gesetze die Haut abziehen. Der übrige Körper wurde wilden Tieren zum Fraße vorgeworfen. Seine Haut aber, das Behältnis seiner miserablen Gesinnung, wurde wie ein Schlauch vor den Toren aufgehängt. Er, der sich Paraklet nannte und sich die Kenntnis der Zukunft zuschrieb, wußte seine eigene Flucht und Gefangennahme nicht.</p><p>Mani hatte drei Jünger: Thomas, Baddas und Hermas. Niemand darf das Evangelium nach Thomas lesen; denn nicht stammt es von einem der zwölf Apostel, sondern von einem der drei bösen Schüler des Mani. Niemand darf sich den Manichäern, den Seelenverderbern, anschließen, welche mit ihrem Spreuwasser ein strenges Fasten zur Schau tragen, welche den Schöpfer der Speisen schmähen, aber mit den ausgesuchtesten Speisen sich voll fressen, und welche lehren, daß, wer eine Pflanze ausreiße, in dieselbe verwandelt werde. Wenn der, welcher Gräser oder Gemüse abschneidet, in dieselben verwandelt wird, wie zahlreich sind dann die Pflanzen, in welche die Landleute und Gärtner verwandelt werden! So viele Pflanzen sehen wir unter der Sichel des Gärtners fallen. In welche wird der Gärtner nun verwandelt? Wahrhaft lächerlich, verachtungswert und schandvoll sind die Lehren. In welches Tier wird ein Schafhirte verwandelt, welcher ein Schaf geopfert und einen Wolf getötet hat? In welches Tier werden die vielen Menschen verwandelt, welche mit dem Netze Fische und mit dem Leime Vögel gefangen haben?</p><p>[Forts. v. ] Kinder der Trägheit sind die Manichäer. Nichts arbeiten sie, sie verzehren, was andere gearbeitet haben. Mit lächelnder Miene empfangen sie diejenigen, welche ihnen Speisen bringen; aber statt Segensworte geben sie ihnen Fluchworte. Bringt ihnen jemand in seiner Unerfahrenheit etwas, dann heißt es: „Bleibe ein wenig draußen stehen, ich werde dich segnen!“ Dann — so berichteten bekehrte Manichäer — nimmt der Manichäer das Brot in seine Hände und sagt zum Brote: „Ich habe dich nicht gebacken.“ Nun stößt er Fluchworte gegen den Höchsten aus, und unter Verfluchung des Spenders ißt er das Gebäck.</p><p>Doch wenn du die Speisen hassest, warum schaust du mit lächelnder Miene auf den, der sie dir bringt? Wenn du aber dem Überbringer Dank schuldest, warum lästerst du Gott, der die Speisen bereitet und erschaffen hat?</p><p>Ferner sagt der Manichäer (zum Brote): „Ich habe dich nicht gesäet. Möge der gesäet werden, der dich gesäet hat! Ich habe dich nicht abgemäht mit der Sichel. Abgemäht möge der werden, welcher dich gemäht hat! Ich habe dich nicht im Feuer gebacken. Möge der gebacken werden, welcher dich gebacken hat!“</p><p>Herrliche Worte des Dankes!</p><p>Schon in diesem Verhalten liegt große Schlechtigkeit. Aber es ist noch eine Kleinigkeit gegenüber anderen Bräuchen. Nicht wage ich es, in Gegenwart von Männern und Frauen über die Taufe der Manichäer näher zu berichten. Nicht wage ich es zu erzählen, in was sie die Feige tauchen, welche sie den Unseligen darbieten..... Aus solchem Munde willst du, o Mensch, belehrt werden? Solche Menschen willst du mit einem Kusse begrüßen? Willst du nicht wie die Sünden so den befleckten Mund, die unzüchtigen Hände, sie selbst, die abscheulicher sind als jede schlechte Dirne, meiden?</p><p>Die Kirche teilt solches mit und belehrt darüber und berührt den Schmutz, damit du dich nicht beschmutzest. Sie macht auf Wunden aufmerksam, damit du nicht verwundet wirst. Es muß dir genügen, davon zu wissen. Nicht jedoch darfst du dir durch persönliche Erfahrung Kenntnis darüber verschaffen. Donnert Gott, dann zittern wir alle, jene aber lästern ihn. Blitzt Gott, dann fallen wir alle auf die Erde, jene aber schmähen mit ihren Zungen den Himmel. Jesus sagt von seinem Vater: „Er läßt seine Sonne aufgehen über Gerechte und Ungerechte und läßt über Böse und Gute regnen“. Nach jenen dagegen entsteht der Regen aus Liebesbrunst. Sie erfrechen sich sogar zu behaupten, im Himmel sei eine schöne Jungfrau mit einem schönen Jüngling. Diese sollen zu der gleichen Zeit wie die Kamele und Wölfe die Zeit ihrer schändlichen Begierde haben. Im Winter soll er der Jungfrau wahnsinnig nachlaufen; sie fliehe und er verfolge sie. Beim Nachlaufen komme er dann in Schweiß, die Schweißtropfen aber seien die Ursache des Regens. So steht es in den Büchern der Manichäer geschrieben. Wir haben es selbst gelesen, da wir denen, welche uns davon erzählten, nicht glauben wollten.</p><p>Mit der Verderbnis der Manichäer haben wir uns viel abgegeben, da uns euer Heil am Herzen liegt.</p><p>[Forts. v. ] Möge euch der Herr vor solchem Irrtum behüten! Möget ihr Feindschaft mit dem Drachen haben! Während die Manichäer der Ferse nachstellen, sollt ihr ihnen den Kopf zertreten! Vergeßt nicht, was euch gesagt wurde! Was haben wir mit jenen gemein? Was hat das Licht mit der Finsternis zu tun? Was hat mit der Abscheulichkeit des Manichäismus die Erhabenheit der Kirche zu tun? Hier ist Ordnung, hier Zucht, hier Würde, hier Keuschheit. Hier gilt es schon als Sünde, ein Weib mit Begierlichkeit anzusehen. Hier findest du heilige Ehen, dauernde Enthaltsamkeit, engelgleiche Würde der Jungfräulichkeit. Hier wird unter Danksagung gegessen. Hier weiß man den Weltschöpfer zu ehren. Hier wird der Vater Christi angebetet. Hier lehrt man Furcht und Zittern vor dem, der regnen läßt. Hier preisen wir den, der donnern und blitzen läßt.</p><p>Geselle dich zu den Schafen! Fliehe die Wölfe! Ziehe dich nicht von der Kirche zurück! Hasse auch diejenigen, welche einst der Häresie verdächtig waren! Wenn du nicht weißt, daß sie bereits einige Zeit Buße tun, dann vertraue dich ihnen nicht ohne weiteres an!</p><p>Die wahre Lehre über die Einheit (Gottes) ist dir (hiermit) gegeben worden. Merke dir die Blumen im Garten der Wissenschaft! Sei ein guter Geldwechsler! Was gut ist, bewahre; von der Schlechtigkeit jeder Art halte dich ferne! Hast du selbst einst zu den Häretikern gehört, dann hasse den Irrtum, nachdem du ihn eingesehen hast! Denn du gelangst dann zum Heile, wenn du, was erbrochen ist, ausspeiest, wenn du (die Feinde) von Herzen hassest, wenn du dich nicht nur mit den Lippen, sondern auch mit dem Herzen von ihnen abwendest, wenn du den Vater Christi, den Gott des Gesetzes und der Propheten, anbetest, wenn du erkennst, daß der gute und der gerechte Gott ein und derselbe ist. Dieser möge euch alle bewahren und euch behüten vor allem Anstoß und möge euch befestigen im Glauben, in Christus Jesus, unserem Herrn, dem die Ehre sei in alle Ewigkeit. Amen.VII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über den Vater.</p><h2>8</h2><p>* Über den Vater.*</p><p>Über die Einheit Gottes haben wir gestern eingehend genug zu euch gesprochen. Eingehend genug sage ich nicht in bezug auf die Erhabenheit der Lehre; denn einem Sterblichen ist es absolut unmöglich, dies zu erreichen. Ich sage es in bezug auf unsere Schwäche. Auch habe ich die gottlosen Häretiker auf ihren vielverzweigten Irrwegen verfolgt. Nachdem wir nun ihren Schmutz und ihr seelenverderbendes Gift von uns gewiesen haben, und nachdem wir, nicht um Schaden zu leiden, sondern um unseren Haß gegen sie noch zu steigern, ihrer Bräuche gedacht haben, wollen wir jetzt wieder zu uns zurückkehren und die heilsamen Lehren des wahren Glaubens wieder aufnehmen. An die erhabene Lehre von der Einheit (Gottes) wollen wir die von der (göttlichen) Vaterschaft knüpfen im Glauben an den „* einen* Gott Vater“; denn nicht allein an* einen* Gott muß man glauben, wir müssen pietätvoll auch die Lehre annehmen, daß er der Vater des Eingeborenen, unseres Herrn Jesus Christus, ist.</p><p>Dadurch steht unsere Lehre wohl höher als die der Juden, welche zwar, wenn sie auch durch Götzendienerei wiederholt den einen Gott verleugneten, an ihm in ihrer Lehre festhalten, nicht jedoch die Lehre annehmen, er sei auch der Vater unseres Herrn Jesus Christus. Sie stehen damit im Widerspruch mit ihren eigenen Propheten, welche in der göttlichen Schrift erklären: „Der Herr sprach zu mir: Mein Sohn bist du, heute habe ich dich erzeugt“. Und bis auf den heutigen Tag „toben sie und vereinigen sich wider den Herrn und wider seinen Christus“, da sie meinen, sie könnten, ohne den Sohn zu verehren, die Liebe des Vaters gewinnen, und da sie nicht wissen, daß „niemand zum Vater kommt außer durch den Sohn“, der spricht: „Ich bin die Türe“, „ich bin der Weg“. Wie sollte nun einer, wenn er den Weg zum Vater meidet und von der Türe nichts wissen will, des Zutrittes zu Gott gewürdigt werden? Sie stehen auch im Widerspruch mit dem, was im 88. Psalm geschrieben steht: „Er wird zu mir rufen: Mein Vater bist du, mein Gott und Hort meines Heiles. Ich werde ihn machen zum Erstgeborenen, zum Höchsten unter den Königen der Erde“. Wollen sie durchaus glauben machen, diese Worte seien auf David, Salomo oder einen ihrer Nachfolger gesprochen, dann mögen sie zeigen, inwiefern der Thron dessen, auf den nach ihnen die Prophezeiung gesagt ist, „wie die Tage des Himmels sei und wie die Sonne vor dem Angesichte Gottes und wie der Mond, der bereitet ist für ewig“. Warum achten sie auch nicht auf das Wort der Schrift: „Aus dem Schoße vor Luzifer habe ich dich erzeugt“, und auf das Wort: „Er wird bleiben, so lange Sonne und Mond währen, von Geschlecht zu Geschlecht“? Diese Worte auf einen Menschen beziehen, ist die Fülle und das Übermaß allen Unverstandes.</p><p>Doch die Juden sollen nur, wenn sie es so wollen, durch solche und ähnliche Erklärungen zeigen, daß sie, wie gewöhnlich, an Unglauben leiden! Wir wollen der Religion des Glaubens folgen und den einen Gott, den Vater Christi, anbeten. Ruchlos wäre es, den, der allen Geschöpfen die Zeugungskraft verleiht, solcher Würde zu berauben. Wenn wir glauben „an den einen Gott Vater“, dann soll schon, bevor wir über Christus belehren, der Glaube an den Eingeborenen in die Seelen der Zuhörer gesenkt werden; wenn wir einstweilen vom Vater sprechen, ist dieser Glaube keineswegs beiseite geschoben.</p><p>[Forts. v. ] Denn der Name Vater läßt schon, sobald dieses Wort ausgesprochen wird, auch an den Sohn denken, geradeso wie der, welcher den Namen Sohn ausspricht, sofort auch an den Vater denkt. Ist einer Vater, dann jedenfalls Vater eines Sohnes; ist einer Sohn, dann jedenfalls Sohn eines Vaters. Damit nun deshalb, weil wir zuerst bekennen „den einen Gott, den allmächtigen Vater, den Schöpfer Himmels und der Erde, aller sichtbaren und unsichtbaren Geschöpfe“ und dann erst beifügen „den einen Herrn Jesus Christus“, nicht etwa jemand die unheilige Vermutung aufstelle, der Eingeborene komme erst an zweiter Stelle, nach Himmel und Erde, darum bezeichnen wir, ehe wir Himmel und Erde nennen, Gott als Vater, damit wir, wenn wir an den Vater denken, auch zugleich an den Sohn denken; denn zwischen Vater und Sohn ist nichts einzureihen.</p><p>In uneigentlichem Sinn ist Gott der Vater vieler, von Natur und in Wahrheit aber Vater nur eines einzigen, seines eingeborenen Sohnes, unseres Herrn Jesus Christus. Nicht erst in der Zeit ist er Vater geworden, sondern immer ist er Vater des Eingeborenen. Nicht war er vor ihm ohne Sohn und ist erst später infolge Willensänderung Vater geworden. Vielmehr hat Gott vor jeder Substanz, vor jedem Empfinden, vor der Zeit und vor aller Ewigkeit die Würde, Vater zu sein, worauf er stolzer ist als auf die übrigen Würden. Nicht aus Leidenschaft ist er Vater geworden, nicht in Umarmung, nicht in Unwissenheit, nicht durch Emanation; nicht erlitt er eine Verminderung, nicht eine Veränderung. „Jedes vollkommene Geschenk nämlich kommt von oben, herabsteigend vom Vater der Lichter, bei welchem es keine Veränderung und nicht des Wechsels Umschattung gibt“. Der vollkommene Vater hat den vollkommenen Sohn erzeugt und alles dem Erzeugten übergeben; dieser sagt: „Alles ist mir von meinem Vater übergeben“. Der Vater wird von dem Eingeborenen geehrt; denn der Sohn erklärt: „Ich ehre den Vater“, und wiederum: „wie ich die Gebote meines Vaters beobachtet habe und in seiner Liebe bleibe“. Daher sagen auch wir wie der Apostel: „Gepriesen sei Gott und der Vater unseres Herrn Jesus Christus, der Vater der Erbarmungen und der Gott alles Trostes“, und: „wir beugen unsere Knie vor dem Vater, von dem jede Vaterschaft in den Himmeln und auf Erden ihren Namen hat“. Wir verherrlichen den Vater mit dem Eingeborenen; denn „wer den Vater verleugnet, verleugnet auch den Sohn“, und wiederum: „wer den Sohn bekennt, hat auch den Vater“. Wir erkennen es, daß „Jesus Christus der Herr ist zur Ehre Gottes des Vaters“.</p><p>Wir beten also an den Vater Christi, den Schöpfer Himmels und der Erde, den Gott Abrahams, Isaaks und Jakobs, zu dessen Ehre auch der frühere Tempel dahier uns gegenüber erbaut worden war. Nicht werden wir die Häretiker dulden, welche das Alte Testament von dem Neuen trennen. Wir werden Christus gehorchen, der vom Tempel sagt: „Wußtet ihr nicht, daß ich in dem sein muß, was meines Vaters ist?“, und wiederum: „Schaffet dieses weg von hier und machet nicht das Haus meines Vaters zu einem Kaufhaus!“ Mit diesen Worten erklärte er auf das deutlichste, daß der frühere Tempel in Jerusalem das Haus seines Vaters war. Wenn aber einer infolge seines Unglaubens noch mehrere Beweise dafür braucht, daß der Vater Christi ein und derselbe ist wie der Schöpfer der Welt, der möge auch noch auf sein Wort hören: „Kauft man nicht zwei Sperlinge um einen Pfennig? Aber keiner von ihnen fällt auf die Erde ohne meinen Vater, der in den Himmeln ist“, und: „Betrachtet die Vögel des Himmels: sie säen nicht, sie ernten nicht, sie sammeln nicht in die Scheunen! Euer Vater im Himmel ernährt sie“, und: „Mein Vater wirkt bis jetzt, und ich wirke“.</p><p>[Forts. v. ] Damit man aber nicht deshalb, weil Christus sagte: „Ich gehe hinauf zu meinem Vater und zu eurem Vater“ einfältig und arglistig behaupte, Christus sei den gerechten Menschen gleich zu achten, so ist es gut, im vornherein festzustellen, daß das eine Wort „Vater“ vielerlei Bedeutung hat. Mit Rücksicht darauf hat Christus vorsichtig erklärt: „Ich gehe zu meinem Vater und zu eurem Vater.“ Nicht sagte er: „Ich gehe zu meinem und eurem Vater“, sondern er unterschied. Zuerst sagte er mit Bezug auf sich selbst „zu meinem Vater“, und da steht Vater im natürlichen Sinne. Dann fügte er bei „und zu eurem Vater“, und da steht Vater infolge Adoption. Wenn wir vor allem auch beim Gebete sagen dürfen: „Vater unser, der du bist in den Himmeln“, so verdanken wir dies einem Gnadengeschenk der Liebe. Nicht deshalb, weil wir auf natürliche Weise vom himmlischen Vater erzeugt worden sind, nennen wir ihn Vater; sondern deshalb, weil wir durch seine väterliche Gnade unter Vermittlung seines Sohnes und des Hl. Geistes aus der Knechtschaft in die Sohnschaft erhoben worden sind, dürfen wir dank seiner unaussprechlichen Liebe so sprechen.</p><p>Will jemand wissen, inwiefern wir Gott unseren Vater nennen, dann möge er hören auf das Wort des trefflichen Erziehers Moses: „Hat nicht eben dieser dein Vater dich erworben, dich gemacht, dich gebildet?“ Auch möge er hören auf das Wort des Isaias: „Und nun, o Herr, bist du unser Vater; wir alle aber sind Lehm, das Werk deiner Hände“. Die Prophetie hat uns aufs deutlichste belehrt: nicht wegen natürlicher Abstammung nennen wir Gott unseren Vater, sondern auf Grund der göttlichen Begnadigung und Adoption.</p><p>[Forts. v. ] Damit du klarer es erkennest, daß in den göttlichen Schriften keineswegs der natürliche Vater allein den Namen Vater hat, höre auf das Wort Pauli: „Wenn ihr nämlich tausend Schulmeister habt in Christus, so doch nicht viele Väter; denn in Christus Jesus habe ich euch erzeugt durch das Evangelium“. Paulus war nämlich Vater der Korinther nicht, weil er sie dem Fleische nach erzeugt hatte, sondern weil er sie belehrt und geistig wiedergeboren hatte. Höre auch, was Job sagt: „Ich war Vater der Schwachen“. Keineswegs nämlich, weil er sie erzeugt, sondern weil er für sie gesorgt hatte, hat er sich deren Vater genannt. Als das Fleisch des eingeborenen Sohnes Gottes ans Kreuz geheftet war und er seine leibliche Mutter und seinen Lieblingsjünger Johannes sah, sprach er zu diesem: „Sieh deine Mutter“, zu Maria aber: „Sieh deinen Sohn“, um die Pflicht der Liebe zu lehren und um zu erklären das schwierige Wort bei Lukas: „Und sein Vater und seine Mutter wunderten sich“. Häretiker nehmen diese Stelle in Anspruch für ihre Lehre, Jesus sei von Mann und Weib erzeugt worden. Doch gleichwie Maria als Mutter des Johannes nicht wegen der Geburt aus ihr, sondern wegen des freundschaftlichen Verhältnisses bezeichnet wurde, so wurde Joseph der Vater Christi genannt, nicht weil er ihn erzeugt hatte; „denn nicht erkannte er sie“, — so sagt das Evangelium — „bis sie ihren erstgeborenen Sohn gebar“. Er war vielmehr Christi Vater, weil er für seine Erziehung Sorge getragen hatte.</p><p>Diese Bemerkung sei nebenbei jetzt eurem Gedächtnis eingeprägt. Zum Beweise dafür, daß Gott in uneigentlichem Sinne Vater von Menschen genannt wird, wollen wir noch ein anderes Zeugnis beibringen. Wenn bei Isaias zu Gott gesagt ist: „Du bist nämlich unser Vater; denn Abraham hat uns nicht gekannt, und Sara hat uns nicht geboren“, ist darüber eine weitere Untersuchung noch notwendig? Und wenn der Psalmist sagt: „Sie sollen erschrecken vor ihm, dem Vater der Waisen und dem Richter der Witwen“, sieht da nicht jeder sofort ein, daß Gott als Vater der Waisen, die erst vor kurzem ihren eigenen Vater verloren haben, nicht deshalb genannt wird, weil er sie erzeugt hat, sondern deshalb, weil er für sie sorgt und sie schützt? Vater der Menschen ist Gott, wie gesagt, im uneigentlichen Sinne. Von Christus allein ist Gott der Vater der Natur nach und nicht durch Adoption. Vater der Menschen ist er in der Zeit, Vater Christi vor der Zeit, wie Christus selbst sagt: „Und nun, Vater, verherrliche mich bei dir mit der Herrlichkeit, welche ich bei dir hatte, ehe die Welt war!“</p><p>[Forts. v. ] Wir glauben also an* einen* Gott Vater, den Unerforschlichen und Unaussprechlichen, welchen kein Mensch gesehen hat, von dem nur der Eingeborene berichtet hat. Denn „wer aus Gott ist, hat Gott gesehen“, dessen Angesicht die Engel im Himmel allezeit schauen; sie schauen aber je nach dem Range, der ihnen eigen ist. Das reine Schauen des Vaters ist aber offenbar dem Sohne mit dem Hl. Geiste vorbehalten.</p><p>Dieser Abschnitt des Unterrichtes, die vorhin erwähnte Lehre, daß Gott der Vater der Menschen ist, läßt mich mit großem Entsetzen an den Undank der Menschen denken. In seiner unaussprechlichen Liebe hat es Gott gewährt, daß er Vater der Menschen genannt werde — er, der in den Himmeln ist, Vater derer, die auf Erden wohnen, er, der Schöpfer der Zeiten, Vater derer, welche in der Zeit leben, er, der die Erde in seiner Faust hält, Vater derer, welche auf Erden den Heuschrecken gleichen. Doch der Mensch verließ den Vater im Himmel und sagte „zum Holze ‚Du bist mein Vater‘ und zum Steine ‚Du hast mich gezeugt‘“. Mit Rücksicht hierauf spricht, wie mir scheint, der Psalmist zur Menschheit: „Vergiß dein Volk und das Haus deines Vaters!“ (d. i. vergiß) den, den du dir als Vater erwählt, den du dir zu deinem Verderben erworben hast.</p><p>[Forts. v. ] Doch nicht nur Holz und Stein, sogar auch den Satan, den Seelenverderber, haben sich schon einige zum Vater erwählt. Gegen sie richtete der Herr den Vorwurf: „Ihr tut die Werke eures Vaters“, des Teufels, welcher nicht der Natur nach, sondern infolge Verführung Vater der Menschen ist. Gleichwie Paulus wegen des religiösen Unterrichtes Vater der Korinther genannt wurde, so wird der Teufel Vater derer genannt, welche freiwillig mit ihm laufen. Nicht werden wir jene dulden, welche das Wort: „Daraus erkennen wir die Kinder Gottes und die Kinder des Teufels“ falsch in der Weise auffassen, als ob manche Menschen naturnotwendig selig würden, manche naturnotwendig zugrunde gingen. Nicht Zwang, sondern freier Wille läßt uns zu solch heiliger Kindschaft kommen. Nicht von Natur aus war der Verräter Judas ein Sohn des Teufels und des Verderbens. Sonst hätte er keinesfalls anfangs im Namen Christi Teufel ausgetrieben; denn der Teufel treibt nicht den Teufel aus. Nicht wäre Paulus aus einem Verfolger ein Prediger geworden. Die Kindschaft beruht auf freiem Willen, wie Johannes sagt: „Allen, die ihn aufnahmen, gab er die Kraft, Kinder Gottes zu werden, sofern sie an seinen Namen glaubten“. Nicht nämlich vor dem Glauben, sondern auf Grund des freien Willens, infolge des Glaubens, wurden sie gewürdigt, Kinder Gottes zu werden.</p><p>In Erkenntnis dieser Wahrheit wollen wir im Geiste wandeln, um der Kindschaft Gottes würdig zu werden. „Denn alle, welche sich vom Geiste Gottes leiten lassen, diese sind Kinder Gottes“. Nichts nützt es uns nämlich, den Namen von Christen erhalten zu haben, wenn nicht die Werke folgen. Möge zu uns nie das Wort gesprochen werden: „Wenn ihr Kinder Abrahams wäret, dann würdet ihr die Werke Abrahams tun“. „Wenn wir nämlich den, der einen jeden unparteiisch nach seinen Werken richtet, als Vater anrufen, dann wollen wir in Furcht wandeln während der Zeit unserer Fremdlingschaft!“ „Lieben wir nicht die Welt und das, was in der Welt ist; denn wenn einer die Welt liebt, ist die Liebe des Vaters nicht in ihm“. Daher, liebe Kinder, wollen wir den Vater in den Himmeln durch unsere Werke verherrlichen! „Man soll unsere guten Werke sehen und unseren Vater preisen, der in den Himmeln ist“. „Wollen wir all unsere Sorge auf ihn werfen“; „denn unser Vater weiß, was wir bedürfen“.</p><p>Wenn wir unseren himmlischen Vater ehren, dann wollen wir auch unsere fleischlichen Väter ehren. Denn ausdrücklich bestimmte der Herr selbst im Gesetze und in den Propheten: „Ehre deinen Vater und deine Mutter, auf daß es dir wohlergehe und du lange lebest auf Erden!“ Auf dieses Wort sollen von den Anwesenden vor allem diejenigen hören, welche noch Vater und Mutter haben! „Ihr Kinder, gehorchet euren Eltern“ in allem; denn das ist wohlgefällig dem Herrn. Nicht hat der Herr gesagt: „Wer Vater oder Mutter liebt, ist meiner nicht wert“. Deute nicht das schöne Wort falsch aus Torheit! Es ist ja doch beigefügt: „(wer liebt) mehr als mich“. Denn wenn irdische Eltern eine Gesinnung bekunden, welche dem himmlischen Vater widerspricht, dann hat jenes Wort Geltung. Wenn sie aber unserer religiösen Betätigung kein Hindernis in den Weg setzen und wir aus Undankbarkeit und uneingedenk ihrer Wohltaten sie verachten, dann findet das Wort auf uns Anwendung: „Wer Vater oder Mutter flucht, soll des Todes sterben“.</p><p>[Forts. v. ] Die erste Tugend christlicher Frömmigkeit ist, die Eltern zu ehren, die Mühen derer, welche uns das Leben gegeben haben, zu vergelten, mit allen Kräften sie zu unterstützen. Wenn wir ihnen auch das meiste wieder vergelten, so können wir ihnen doch niemals das Leben geben, das sie uns geschenkt haben. Wenn sie unsere Fürsorge genießen, mögen sie uns mit jenem Segen stärken, welchen der Fersehalter Jakob sich schlau weggenommen hatte! Möge der Vater im Himmel unseren guten Willen annehmen und uns würdigen, mit den Gerechten „wie die Sonne zu leuchten im Reiche unseres Vaters“, dem die Ehre sei mit dem eingeborenen Erlöser Jesus Christus, mit dem Hl. Geist, dem Lebendigmacher, jetzt und immer und in alle Ewigkeit. Amen.VIII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort „Allmächtiger“.</p><h2>9</h2><p>* Über das Wort „Allmächtiger“.*</p><p>Der Glaube an den* einen* Gott ist unsere Waffe gegen die Heiden und die ganze feindliche häretische Macht; er ist Beseitigung jedes polytheistischen Irrtums. Unser Glaube an den „einen Gott* Vater*“ bedeutet Kampf gegen das Judentum, das von dem eingeborenen Sohn Gottes nichts wissen will. Mit dem Bekenntnis „Vater“ haben wir, wie gestern gesagt worden ist, bereits vor Behandlung der christologischen Fragen zu erkennen gegeben, daß er Vater eines Sohnes ist, damit wir, gleichwie wir erkennen, daß ein Gott ist, ebenso auch erkennen, daß er einen Sohn hat. Wir fügen aber auch noch bei, daß er allmächtig ist, und zwar sowohl wegen der Heiden als auch wegen der Juden und aller Häretiker.</p><p>Von den Heiden lehrten einige, Gott sei nur die Seele der Welt, andere dagegen, die Macht Gottes reiche nur bis zum Himmel, nicht aber auch bis auf die Erde. Einige haben, von diesem Irrtume verleitet, das Wort: „Deine Wahrheit erstreckt sich bis zu den Wolken“ falsch gedeutet und haben es gewagt, Gottes Vorsehung auf die Wolken und den Himmel zu beschränken und das Irdische von Gott loszutrennen; sie haben das Psalmwort vergessen: „Wenn ich zum Himmel hinaufsteige, bist du dort; wenn ich hinabsteige zur Unterwelt, bist du da“. Wenn nämlich nichts höher ist als der Himmel, und die Unterwelt tiefer ist als die Erde, dann kümmert sich der, welcher die Unterwelt beherrscht, auch um die Erde.</p><p>[Forts. v. ] Die Häretiker anerkennen, wie schon früher gesagt worden ist, nicht* einen* allmächtigen Gott. Allmächtig aber ist nur der, welcher alles beherrscht, über alles Gewalt hat. Die Häretiker aber bezeichnen den einen als Herrn der Seele, einen andern als Herrn des Körpers; da dem einen dieses, dem andern jenes fehle, leugnen sie die Vollkommenheit des einen wie des andern. Ist denn der, welcher Macht über die Seele, nicht aber über den Körper hat, noch allmächtig? Ist denn der, welcher über die Körper herrscht, nicht aber Gewalt über die Geister hat, noch allmächtig? Doch der Herr hält ihnen vorwurfsvoll entgegen: „Fürchtet vielmehr den, der Seele und Leib in der Hölle zu vernichten vermag!“ Wie kann der Vater unseres Herrn Jesus Christus, wenn er nicht die Macht über beides hat, beides der Strafe unterwerfen? Wie kann er den Leib, wenn er nicht Gewalt über ihn hat, nehmen und in die Hölle werfen? Er mußte ja „zuerst den Gewaltigen fesseln und ihn seiner Waffen berauben“.</p><p>Die göttliche Schrift und die Lehre der Wahrheit kennen nur* einen* Gott, und der beherrscht mit Macht alles und läßt, weil er es so will, vieles zu. Er herrscht auch über die Götzendiener: aus Langmut läßt er sie zu. Auch über die Häretiker, welche ihn verleugnen, herrscht er: aus Langmut duldet er sie. Er herrscht auch über den Teufel: aus Langmut duldet er ihn. Nicht aus Schwäche, wie ein Besiegter, duldet er ihn. Der Teufel ist das erste unter den Geschöpfen des Herrn, erschaffen, um verspottet zu werden — nicht vom Herrn selbst, denn dessen wäre der Teufel nicht wert, sondern von den von ihm erschaffenen Engeln. Der Herr ließ ihm das Leben aus dem zweifachen Grunde, daß er durch Besiegung noch mehr geschändet werde, und daß die Menschen gekrönt werden. O allweise Vorsehung Gottes, welche den bösen Willen zum Heile der Gläubigen verwertet! Wie Gott nämlich den Bruderhaß der Brüder Josephs für seine eigenen Pläne verwertet hatte, wie er den Brüdern des Joseph gewährt hatte, daß sie den Joseph aus Haß verkauften, weil er ihn auf diese Weise zum König werden lassen wollte, so hat er dem Teufel gestattet, zu kämpfen, damit die, welche ihn besiegen, gekrönt werden, und damit der Teufel, wenn er von den Geringeren besiegt wird, durch die Besiegung noch mehr beschämt werde, die Menschen dagegen durch Überwindung des einstigen Erzengels hohen Ruhm erhalten.</p><p>[Forts. v. ] Nichts steht außerhalb der Macht Gottes. Denn die Schrift sagt von ihm: „Alles ist dir dienstbar“. Alles ist ihm dienstbar, ausgenommen von diesem allem ist einzig sein einer Sohn und sein Hl. Geist. Alles, was dienstbar ist, dient dem Herrn durch den einen Sohn im Hl. Geist. Über alles herrscht also Gott, und in seiner Langmut läßt er zu die Mörder, die Räuber, die Unzüchtigen. Er hat die Zeit vorherbestimmt, da er jedem einzelnen vergilt; sie sollen, wenn sie trotz langer Frist unbußfertig bleiben, um so schwerer bestraft werden. Die auf Erden regieren, heißt man Könige, doch sie sind es nicht ohne den Willen himmlischer Macht. Dies hat einst Nabuchodonosor erfahren und erkannt; denn er sagte: „Sein Reich ist ein ewiges Reich, und seine Herrschaft dauert von Geschlecht zu Geschlecht“.</p><p>Reichtum, Gold und Silber gehören nicht, wie einige glauben, zur Herrschaft des Teufels. „Denn die ganze Welt mit ihren Schätzen gehört dem Gläubigen, dem Ungläubigen aber gehört auch nicht ein Heller; nichts ist aber ungläubiger als der Teufel. Deutlich erklärt Gott durch den Propheten: „Mir gehört das Silber, mir das Gold“. Benütze das Geld nur richtig, dann ist es nicht zu tadeln. Wenn du, was gut ist, schlecht gebrauchst, dann schimpfst du gottlos über den, der es bereitet hat, statt über deinen Gebrauch zu schimpfen. Den zeitlichen Gütern kann es einer sogar zu verdanken haben, daß er gerecht ist. (Denn es steht geschrieben:) „Ich war hungrig, und ihr habt mir zu essen gegeben“ — offenbar von zeitlichen Gütern; „ich war nackt, und ihr habt mich bekleidet“ — offenbar mit zeitlichen Gütern. Willst du wissen, daß irdische Schätze die Türe zum Himmelreich sein können? „Verkaufe“ — heißt es — „was du hast, und gib es den Armen, und du wirst einen Schatz im Himmel haben“.</p><p>[Forts. v. ] Dies sage ich der Häretiker wegen, welche Geld und Gut und die Leiber verdammen. Nicht sollst du den irdischen Schätzen dienen, du sollst sie aber auch nicht als Feinde ansehen; denn Gott hat sie dir zu deinem Dienste gegeben. Sage also niemals, die irdischen Schätze gehören dem Teufel! Wenn dieser erklärt: „Dies alles will ich dir bieten, denn mir ist es übergeben“, so kann man sein Wort zurückweisen mit der Bemerkung: einem Lügner braucht man nicht zu glauben. Es wäre aber auch möglich, daß der Teufel unter dem Einfluß dessen, der vor ihm stand, die Wahrheit sprach. Er sagte ja nicht „Dies alles will ich dir geben, weil es mein ist“, sondern „weil es mir übergeben ist“. Denn nicht riß der Teufel die Herrschaft darüber an sich, sondern er gestand nur, daß ihm dieselbe überlassen wurde und daß er sie einstweilen ausübe. Doch frage gelegentlich bei den Exegeten nach, ob der Teufel (hier) lüge oder die Wahrheit spreche!</p><p>Es ist also* ein* Gott, der Vater, der Allmächtige. Ihn wagten die Häretiker zu schmähen. Denn sie erkühnten sich, den Herrn der Heerscharen, der über den Cherubim thront, zu lästern. Sie erfrechten sich, den Herrn Adonai zu beschimpfen. Sie vermaßen sich, zu schmähen den Gott, der allmächtig war zur Zeit der Propheten.</p><p>Bete du an den einen, den allmächtigen Gott, den Vater unseres Herrn Jesus Christus! Fliehe den Irrtum des Polytheismus, fliehe jede Häresie! Sprich mit Job: „Den allmächtigen Herrn will ich anrufen, den, der Großes und Unerforschliches, Rühmenswertes und Wunderbares ohne Zahl schafft“, und: „wegen alles dessen Ehre dem Allmächtigen’“, dem sei Herrlichkeit in alle Ewigkeit. Amen.IX. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort „Schöpfer Himmels und der Erde, alles Sichtbaren und Unsichtbaren“.</p><h2>10</h2><p>* Über das Wort „Schöpfer Himmels und der Erde, alles Sichtbaren und Unsichtbaren“.*</p><p>Es ist unmöglich, mit fleischlichen Augen Gott zu sehen. Das Unkörperliche kann nicht von körperlichen Augen geschaut werden. Der eingeborene Sohn Gottes selbst hat es bezeugt, wenn er sagt: „Niemand hat Gott je gesehen“. Wollte jemand aus dem, was bei Ezechiel geschrieben ist, schließen, Ezechiel habe Gott gesehen, (dann frage ich:) was sagt die Schrift? „Er sah ein Sinnbild der Herrlichkeit des Herrn“. Nicht sah er den Herrn selbst, sondern das Sinnbild seiner Herrlichkeit; er sah nicht einmal seine Herrlichkeit, wie sie in der Tat ist. Als er nur das Sinnbild seiner Herrlichkeit, nicht die Herrlichkeit selbst sah, fiel er vor Furcht auf die Erde nieder. Wenn der Anblick des Sinnbildes der Herrlichkeit den Propheten Furcht und Schrecken einflößte, dann wäre der, welcher es versuchen würde, Gott zu schauen, gewiß des Todes; zumal da es heißt: „Niemand wird mein Angesicht schauen und leben“. Daher hat Gott, damit wir nicht des Todes sind, in seiner unendlichen Güte den Himmel als Vorhang vor seine eigene Gottheit ausgebreitet. Nicht meine Lehre ist es, sondern der Prophet hat es gesagt: „Wenn du den Himmel öffnen würdest, dann würde die Berge Schrecken vor dir erfassen, und sie würden dahinschwinden“. Wunderst du dich, daß Ezechiel, als er das Sinnbild der Herrlichkeit sah, niederfiel? Als Gabriel, der Diener des Herrn, dem Daniel erschien, wurde er sofort von Schrecken ergriffen und fiel auf sein Angesicht nieder; nicht wagte der Prophet zu antworten, bis der Engel sich gezwungen sah, die Gestalt eines Menschensohnes anzunehmen. Wenn die Erscheinung Gabriels den Propheten Schrecken einjagte, wären dann nicht, wenn Gott sich ihnen gezeigt hätte, wie er ist, alle zugrunde gegangen?</p><p>[Forts. v. ] Leiblichen Augen ist es unmöglich, die göttliche Natur zu schauen. Doch ist es möglich, von den Werken Gottes aus zur Vorstellung seiner Macht zu gelangen; denn Salomon sagte: „In der Größe und Schönheit der Geschöpfe wird ihr Schöpfer entsprechend geschaut“. Nicht sagte er: „In den Geschöpfen wird der Schöpfer geschaut“, sondern er fügte noch bei: „entsprechend“. Gott erscheint nämlich um so größer, je tiefer der Mensch eindringt in die Geschöpfe. Schlägt im öfteren Eindringen sein Herz hoch, dann vertieft sich auch seine Vorstellung von Gott.</p><p>Willst du wissen, daß es unmöglich ist, die Natur Gottes zu begreifen? Die drei Jünglinge im Feuerofen preisen Gott mit den Worten: „Gepriesen seist du, der du in die Abgründe schaust und auf den Cherubim thronst!“ Sage mir, welches ist die Natur der Cherubim, alsdann stelle dir den vor, der darauf thront! Der Prophet Ezechiel hat, soweit es möglich war, die Cherubim beschrieben mit den Worten: „Ein jeder hat vier Gesichter: das eines Menschen, eines Löwen, eines Adlers, eines Rindes; ein jeder hat sechs Flügel; Augen haben sie auf allen Seiten; unter einem jeden ist ein vierteiliges Rad“. Trotzdem nun der Prophet diese Beschreibung gibt, können wir doch, wenn wir sie lesen, die Cherubim noch nicht fassen. Wenn wir aber den Thron trotz seiner Beschreibung nicht erfassen können, wie sollten wir dann den unsichtbaren, unbeschreiblichen Gott, der darauf thront, erfassen können? Unmöglich ist es, die Natur Gottes ganz zu erforschen; möglich dagegen ist es, Gott auf Grund seiner sichtbaren Geschöpfe Lobpreisungen emporzusenden.</p><p>[Forts. v. ] So werdet ihr belehrt auf Grund der Glaubenstradition und auf Grund unseres Bekenntnisses: „Wir glauben an* einen* Gott, den allmächtigen Vater, den Schöpfer Himmels und der Erde, alles Sichtbaren und Unsichtbaren.“ Wir sollen nämlich bedenken, daß der Vater unseres Herrn Jesus Christus zugleich auch der Schöpfer Himmels und der Erde ist; wir sollen uns sicherstellen gegen die Irrungen der gottlosen Häretiker, welche sich erfrecht haben, den allweisen Baumeister des Weltalls zu beschimpfen, welche sehen mit den Augen des Fleisches, aber blind sind an den Augen des Geistes.</p><p>Was haben sie an dem so großen Schöpfungswerk Gottes zu tadeln? Staunen sollten sie beim Anblick des Himmelsgewölbes; anbeten sollten sie den, der den Himmel wie einen Bogen ausgebreitet hat, der aus der flüssigen Natur der Gewässer den unerschütterlichen Himmel gebildet hat. Gott hat nämlich gesprochen: „Es werde das Firmament inmitten der Wasser!“ Einmal hat Gott so gesprochen, und damit steht das Firmament, und nicht wankt es. Der Himmel besteht aus Wasser, seine Sonne, sein Mond und seine Sterne aber aus Feuer. Wie nun ist es möglich, daß sich feurige Körper im Wasser bewegen? Hat jemand wegen der gegensätzlichen Natur von Feuer und Wasser Zweifel, dann möge er an das Feuer denken, das zur Zeit des Moses in Ägypten unter Hagel aufflammte. Erwägen möge er die allweise Einrichtung Gottes in der Schöpfung! Da nämlich die Erde, wenn man sie sollte bebauen können, des Wassers bedurfte, so hatte Gott über ihr einen Himmel aus Wasser bereitet, damit, so oft das Ackerland von Regen begossen werden soll, der Himmel schon von Natur aus dazu bereit ist.</p><p>[Forts. v. ] Müssen wir nicht auch von Bewunderung erfüllt werden, wenn wir den Bau der Sonne betrachten? Klein erscheint sie zwar an Gestalt, doch entwickelt sie große Kraft. Im Osten leuchtet sie auf und entsendet ihr Licht bis zum Westen. Ihren Aufgang am Morgen beschrieb der Psalmist mit den Worten: „Sie tritt hervor wie ein Bräutigam aus seinem Gemache“. Er beschrieb die gerade aufgehende Sonne, welche mit wohltuendem Lichte den Menschen leuchtet. Denn wenn sie durch die Mittagslinie eilt, dann fliehen wir oftmals vor ihren brennenden Strahlen; doch geht sie gerade auf, dann erfreut sie alle wie ein Bräutigam, sobald er sich sehen läßt. Achte auf ihr Walten — doch eigentlich nicht auf ihr Walten, sondern auf das Walten dessen, der ihren Lauf festgesetzt hat! Siehe: im Sommer, wenn sie höher steigt, verlängert sie die Tage, um den Menschen Zeit zur Arbeit zu geben, im Winter dagegen zieht sie den Kreislauf enger, um die kalten Tage zu verkürzen und die Nächte zu verlängern und so den Menschen Ruhe, den Pflanzen der Erde Fruchtbarkeit zu verschaffen. Achte darauf, wie die Tage in schöner Ordnung sich ablösen: im Sommer sind sie länger, im Winter kürzer, im Frühling und Herbst haben sie die Durchschnittslänge. In ähnlicher Weise lösen sich die Nächte ab, so daß der Psalmist sagen kann: „Der Tag ruft dem Tag das Wort zu, und die Nacht verkündet der Nacht die Weisheit“. Den Häretikern nämlich, welche keine Ohren haben, schreien sie es gleichsam zu und lehren es durch ihre Ordnung: es gibt keinen anderen Gott als den, der alles geschaffen, bestimmt, geordnet hat.</p><p>Möge keiner auf diejenigen hören, welche lehren, der Schöpfer des Lichtes sei ein anderer als der Schöpfer der Finsternis! Man denke an das Wort des Isaias: „Ich, Gott, habe erschaffen das Licht und bereitet die Finsternis!“ Bist du darüber ungehalten, o Mensch? Ärgerst du dich über die Zeit, welche dir zur Ruhe gegeben ist? Der Knecht würde von den Herren keine Ruhe erhalten, wenn nicht die Finsternis zwingen würde, Erholung zu gewähren. Werden wir nicht oftmals, wenn wir tagsüber uns geplagt haben, durch die Nacht wieder erfrischt? Ist nicht der, welcher gestern von der Arbeit erschöpft war, am Morgen durch die Ruhe der Nacht wieder gekräftigt? Was nützt der Weisheit mehr als die Nacht? Denn nachts denken wir oftmals über Gott nach. Nachts lesen und betrachten wir die göttlichen Worte. Wann ist unser Geist mehr gesammelt zum Psalmensingen und Beten? Nicht in der Nacht? Wann wurden wir so oft an unsere Sünden erinnert? War es nicht in der Nacht? Nehmen wir also nicht die sündhafte Lehre an, ein zweiter Gott habe die Finsternis erschaffen! Die Erfahrung zeigt uns, daß auch sie gut und sehr nützlich ist.</p><p>Die Häretiker sollten nicht nur Sonne und Mond staunend bewundern, sondern auch die wohlgeordneten Chöre der Sterne, ihren ungehinderten Lauf, ihren rechtzeitigen Aufgang. Die einen zeigen den Sommer an, die anderen den Winter. Die einen verkünden die Zeit der Aussaat, die anderen den Beginn der Schiffahrt. Sitzt der Schiffer in seinem Fahrzeug, fährt er auf den unbegrenzten Wogen, dann braucht er nur zu den Sternen aufzublicken, um das Schiff zu leiten. Schön sagt da die Schrift: „Sie sollen sein zu Zeichen, zu Zeiten, zu Jahren“; nicht jedoch sagt sie, sie sollen dienen denen, die Astrologie treiben und aus der Geburtsstunde das Schicksal bestimmen. Achte darauf, wie Gott in seiner Fürsorge uns das Tageslicht allmählich schenkt! Denn nicht auf einmal sehen wir die Sonne aufgehen, sondern es geht ihr ein gedämpftes Licht vorher, damit das Auge Sich für den Anblick stärkerer Strahlen vorbereiten könne. Achte darauf, wie Gott durch das Licht des Mondes das Dunkel der Nacht mildert!</p><p>[Forts. v. ] „Wer ist der Vater des Regens? Wer bringt die Tautropfen hervor?“ Wer verdichtet die Luft zu Wolken und befiehlt ihnen, die Regengüsse zu tragen? Wer führt bisweilen „von Norden her in Goldglanz leuchtende Wolken“? Wer vereinigt sie bald zu einem Ganzen und reißt sie dann wieder auseinander in verschiedene kreisförmige und andere Gestalten? Wer ist so weise, daß er die Wolken zu zählen vermag? Bei Job heißt es: „Er kennt die verschiedenen Wolken“; „den Himmel neigt er zur Erde“, und: „er zählt in seiner Weisheit die Wolken“, und: „unter ihm ist keine Wolke eingebrochen“. Trotzdem so große Wassermassen auf den Wolken liegen, brechen diese nicht ein; vielmehr ergießen sich die Wasser auf die Erde in großer Ordnung. „Wer führt die Winde aus ihren Schatzkammern?“ Wer hat, wie gesagt, die Tautropfen hervorgebracht? Aus wessen Schoß kommt das Eis? Trotzdem es nämlich aus Wasser besteht, ist es hart wie Stein. Bald wird aus Wasser Schnee gleich Wolle; bald dient es dazu, Nebel wie Asche auszubreiten; bald wird es wie Stein. Denn Gott lenkt das Wasser, wie er will. Es hat* eine* Natur, doch verschiedenartige Wirkungen. Im Weinstock wird das Wasser zu Wein, „der des Menschen Herz erfreut“; im Ölbaum wird es zu Öl, „das des Menschen Angesicht erheitert“; auch zu Brot wird es, das „des Menschen Herz stärkt“, und zu Fruchterzeugnissen aller Art.</p><p>Was ist also notwendig? Ist es notwendig, den Herrn zu lästern oder ihn anzubeten? Noch nicht spreche ich von den unsichtbaren Werken seiner Weisheit. Betrachte den Frühling und die Blumen aller Art, welche aus gleichen Verhältnissen heraus sich so verschieden gestalten! Betrachte das lebhafte Rot der Rose und das blendende Weiß der Lilie! Das eine wie das andere entsteht doch aus dem einen Regen und aus der gleichen Erde. Wer ist es nun, der schöpferisch die Verschiedenheit wirkt? Betrachte die Weisheit! Aus ein und demselben Baume wird das schützende Laubdach, werden die verschiedenen Früchte. Einer ist der Künstler. Von ein und demselben Weinstock wird ein Teil zu Brennholz, ein anderer zu Sprossen, ein anderer zu Blättern, ein anderer zu Ranken, ein anderer zu Trauben. Bewundere auch die dicken Knotenringe des Rohres, welche der Künstler gemacht hat! Aus ein und derselben Erde gehen hervor die kriechenden Tiere, die wilden und die zahmen Tiere, die Bäume, die Nahrungsmittel, Gold, Silber, Erz, Eisen, Stein. Die Natur des Wassers ist zwar eine, aber aus ihm stammen Fische und Vögel, damit die einen im Wasser schwimmen, die Vögel in der Luft fliegen.</p><p>[Forts. v. ] „Dieses große und weite Meer — in ihm sind die kriechenden Tiere ohne Zahl“. Wer kann die Schönheit der Meerfische beschreiben? Wer kann beschreiben die Größe der Meerungeheuer und die Natur der Amphibien, welche bald auf dem Festland, bald im Wasser leben? Wer kann beschreiben die Tiefe und Weite des Meeres oder die Fluten der gewaltigen Meereswogen? Trotz allem steht das Meer fest in seinen Grenzen wegen dessen, der gesprochen hat: „Bis hierher sollst du gehen und nicht weiter; in dir selbst sollen deine Wogen zusammenbrechen“. Auf dieses ihm auferlegte Gebot weist das Meer hin, wenn es die Höhe der Flut durch Linien am Gestade kennzeichnet; dadurch gibt es zu erkennen, daß es die ihm gezogene Grenze nicht überschritten hat.</p><p>Wer kann die Natur der Vögel in der Luft erforschen? Die einen singen, andere sind an ihren Flügeln bunt bemalt, andere, wie der Habicht, fliegen mitten in die Luft, um unbeweglich stehen zu bleiben. Auf Befehl Gottes „breitet der Habicht seine Flügel aus und bleibt unbeweglich stehen, die Blicke nach Süden gewandt“. Wer vermag den Adler zu erblicken, wenn er sich in die Höhe erhoben hat? Wenn du den dümmsten Vogel, der sich in die Höhe erhebt, nicht erkennen kannst, wie willst du den Schöpfer des Weltalls verstehen?</p><p>Welcher Mensch weiß von allen Tieren auch nur die Namen? Oder wer kann eine spezielle Naturgeschichte schreiben? Wenn wir aber von den Tieren nicht einmal die Namen kennen, wie werden wir ihren Schöpfer verstehen? Gott sprach das eine Wort: „Die Erde bringe hervor wilde, zahme und kriechende Tiere nach ihrer Art“. Und auf das eine Wort sind aus der einen Erde verschiedene Arten von Tieren geworden: das so fromme Lamm und der fleischfressende Löwe. Es sind geworden die verschiedenen instinktiven Bewegungen der Tiere, um die Äußerungen des freien menschlichen Willens nachzuahmen: der Fuchs bekundet menschliche Schlauheit, die Schlange zeigt das Gift menschlicher Freundschaften, das wiehernde Pferd die Ausgelassenheit der Jugend. Geworden ist die gar emsige Ameise, um den trägen und faulen Menschen zu wecken. Verbringt einer seine Jugend in Faulheit, dann wird er von den unvernünftigen Tieren belehrt; denn die göttliche Schrift weist ihn zurecht mit den Worten: „Gehe hin zur Ameise, du Fauler, sieh ihre Wege und ahme sie nach und sei weiser als sie!“ Achte nämlich darauf, wie sie zu rechter Zeit ihren Unterhalt sammelt, und mache es ebenso: sammle dir als Schätze für die Zukunft Früchte guter Werke! Und wiederum heißt es: „Gehe hin zur Biene und lerne, wie fleißig sie ist!“ Auf verschiedenen Blumen fliegen sie umher, um dir zu deinem Nutzen Honig zu sammeln. So sollst du die göttlichen Schriften durchwandern, um dein Heil zu wirken und, von ihnen gesättigt, zu sprechen: „Wie süß sind meinem Gaumen deine Worte; mehr als Honig sind sie meinem Munde“.</p><p>[Forts. v. ] Ist also der Künstler nicht würdig der Lobpreisung? Ist denn etwa die Schöpfung schon deshalb, weil du nicht in das Wesen alles Geschaffenen eindringst, böse? Kannst du die Kräfte aller Pflanzen kennen? Kannst du wissen, welchen Nutzen dir jedes Tier bringt? Sogar aus dem Gifte der Nattern hat man bereits Arzneimittel gewonnen. Du wirst einwenden: „Die Schlange ist schrecklich.“ Doch fürchte den Herrn, und sie wird dir nicht schaden können. (Du wirst einwenden:) „Der Skorpion sticht.“ Doch fürchte den Herrn, und er wird dich nicht stechen. (Du wirst einwenden:) „Der Löwe ist blutdürstig.“ Doch fürchte den Herrn, und der Löwe wird sich neben dich legen, wie er sich neben Daniel gelegt hat. Wahrlich, bewundern sollte man geradezu die Kraft der Tiere: die einen, wie der Skorpion, haben in den Stacheln ihre scharfen Waffen, andere haben ihre Kraft in den Zähnen, andere benützen ihre Klauen zum Kampfe; die Macht des Basilisken liegt im Blick. Aus der verschiedenen Einrichtung in der Schöpfung sollst du schließen auf die Kraft des Schöpfers.</p><p>Doch vielleicht sind dir diese Dinge unbekannt; vielleicht hast du auch kein Interesse an der Natur, die dich umgibt. Gehe also in dich selbst und schließe von deiner eigenen Natur aus auf den Künstler! Was kannst du tadeln an dem Bau deines Körpers? Beherrsche dich selbst, und keines von allen deinen Gliedern ist böse. Zu Anbeginn war Adam mit Eva im Paradiese nackt; doch war er nicht der Glieder wegen vertrieben worden. Nicht sind also die Glieder die Ursache der Sünde, sondern diejenigen, welche ihre Glieder mißbrauchen. Weise ist der Schöpfer der Glieder. Wer ist es, der den Mutterschoß bereitet hat zum Gebären? Wer beseelt das Unbeseelte im Mutterschoß? Wer hat uns aus Nerven und Knochen zusammengesetzt, uns mit Haut und Fleisch umgeben? Wer läßt, sobald das Kind geboren ist, aus der Mutterbrust die Milchquelle entspringen? Wie wächst das Kind zum Knaben, der Knabe zum Jüngling, der Jüngling zum Manne heran, und wie wird der Mann zum Greise? Niemand nimmt doch den genauen Verlauf der täglichen Veränderung wahr. Wie kommt es, daß ein Teil der Nahrung zu Blut wird, ein anderer Teil zur Ausscheidung gelangt, wieder ein anderer sich in Fleisch verwandelt? Wer gibt dem Herzen die ständige Bewegung? Wer sichert die empfindlichen Augen weise durch die schützenden Augenlider? Den komplizierten, wunderbaren Bau der Augen vermögen kaum die umfangreichen medizinischen Bücher zu beschreiben. Wer gibt einem einzigen Atemzug Einfluß auf den ganzen Körper? Erkennst du, o Mensch, den Künstler? Erkennst du den weisen Schöpfer?</p><p>[Forts. v. ] Ausführlich habe ich dich jetzt über die Schöpfung belehrt. Tausenderlei aber habe ich noch übergangen, vor allem aus der unkörperlichen, unsichtbaren Schöpfung. Hassen sollst du nun diejenigen, welche den weisen, guten Künstler lästern. Aus dem Gesagten und Gelesenen, aus dem, was du durch Selbstbeobachtung finden und wissen kannst, der Größe und Schönheit der Schöpfung, sollst du entsprechend den Schöpfer erkennen. Ehrfurchtsvoll sollst du vor dem Weltschöpfer, der das Sinnliche und Geistige, alles Sichtbare und Unsichtbare gemacht hat, das Knie beugen und in dankbaren, lobpreisenden Worten, mit unermüdlichen Lippen Gott verherrlichen und sprechen: „Wie bewundernswert sind deine Werke, o Herr, alles hast du mit Weisheit gemacht“, dir gebührt Ehre, Herrlichkeit, Größe jetzt und in alle Ewigkeit. Amen.X. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort: „und an einen Herrn Jesus Christus“.</p><h2>11</h2><p>* Über das Wort: „und an einen Herrn Jesus Christus“.*</p><p>Wer gelehrt worden ist, an* einen* Gott, den allmächtigen Vater, zu glauben, muß auch an den eingeborenen Sohn glauben. Denn „wer den Sohn leugnet, hat auch den Vater nicht“. „Ich bin“ — sagt Jesus — „die Türe“; niemand kommt zum Vater außer durch mich“. Wenn du die Türe leugnest, dann ist dir die Kenntnis verschlossen, welche zum Vater führt. „Niemand kennt den Vater außer der Sohn und wem der Sohn ihn offenbart“. Leugnest du den, der offenbart, dann bleibst du in Unwissenheit. In den Evangelien wird behauptet: „Wer nicht an den Sohn glaubt, wird das Leben nicht sehen, sondern der Zorn Gottes bleibt über ihm“. Der Vater zürnt nämlich, wenn sein eingeborener Sohn nicht anerkannt wird. Ein König ist ungehalten, schon wenn einem Soldaten die einfache Achtung entzogen wird. Wenn aber einer der höherstehenden Offiziere oder Freunde nicht geachtet wird, dann wächst seine Erbitterung. Wenn aber einer gar den eingeborenen Königssohn selbst lästert, wer wird den Vater in seinem bitteren Schmerz über seinen eingeborenen Sohn trösten?</p><p>Will einer Gott verehren, dann bete er den Sohn an; sonst nimmt der Vater die ihm erwiesene Verehrung nicht an. Der Vater rief vom Himmel her: „Dieser ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe“. Der Vater hat Wohlgefallen am Sohne. Wenn nicht auch du Wohlgefallen hast, hast du nicht das Leben. Lasse dich nicht von den Juden irreführen, welche arglistig einwenden: „Es ist nur* ein* Gott.“ Du sollst wissen, daß nur* ein* Gott ist, aber zugleich auch erkennen, daß es einen eingeborenen Sohn Gottes gibt. Ich bin nicht der erste, der so lehrt. Im Namen des Sohnes spricht der Psalmist: „Der Herr sprach zu mir: mein Sohn bist du“. Achte nicht auf die Worte der Juden, sondern auf die der Propheten! Ist es zu verwundern, wenn sie, welche die Propheten gesteinigt und getötet haben, die Prophetenworte mißachten?</p><p>Du hast zu glauben an den* einen* Herrn Jesus Christus. Wir reden von* einem* Herrn Jesus Christus, damit eins sei die Sohnschaft. Von* einem* reden wir, damit du nicht noch einen anderen Sohn annimmst. Von* einem* reden wir, damit du nicht, wenn er auf Grund seines Wirkens verschiedene Namen erhält, in gottloser Weise auf verschiedene Söhne schließest. Er wird* Türe* genannt. Nicht jedoch darfst du bei diesem Ausdruck an eine Türe aus Holz denken, sondern an eine vernünftige, lebendige, welche über die Eintretenden entscheidet. Er wird* Weg* genannt. Nicht ist er ein Weg, auf dem man mit den Füßen geht; er ist der Weg, der zum himmlischen Vater führt. Er wird als* Lamm* bezeichnet. Nicht ist er ein unvernünftiges Lamm; er ist das Lamm, welches durch sein kostbares Blut die Welt von ihren Sünden reinigt, welches vor den Scherer geführt wird und weiß, wann es schweigen muß. Dieses Lamm wird aber ein andermal auch* Hirte* genannt, der von sich sagt: „Ich bin der gute Hirte“. Lamm ist er als Mensch, Hirte ist er wegen seiner göttlichen Liebe. Willst du wissen, ob es auch vernunftbegabte Lämmer gibt. Zu den Aposteln sagt der Heiland: „Siehe, ich sende euch aus als Schafe mitten unter die Wölfe“. Ein andermal wird Christus* Löwe* genannt. Nicht ist er ein Löwe, der Menschen frißt; es soll vielmehr mit dieser Bezeichnung auf seine königliche Würde, seine Stärke und Kraft verwiesen werden. Löwe wird er genannt im Gegensatz zu dem Löwen, dem Widersacher, der brüllt und die Verführten verschlingt. Denn der Erlöser ist nicht gekommen, um seine sanfte Natur abzulegen, sondern um als mächtiger „Löwe aus dem Stamme Juda“ die Gläubigen zu erlösen, den Widersacher aber zu vernichten. Christus wird als* Stein* bezeichnet. Nicht ist er ein lebloser, von Menschenhänden gehauener Stein; er ist ein Eckstein, und wer auf diesen vertraut, wird nicht zuschanden werden.</p><p>Jesus ist der* Gesalbte<em>. Nicht von menschlicher Hand ist er gesalbt, sondern der Vater hat ihn ewig zum Hohenpriester der Menschen gesalbt. Er wird ein</em> Toter* genannt. Doch blieb er nicht bei den Toten wie alle, die in der Unterwelt sind, sondern er allein war „frei unter den Toten“.* Menschensohn* wird er genannt, doch nicht weil er wie jeder von uns aus der Erde stammt, sondern weil er auf den Wolken des Himmels kommt, um die Lebendigen und die Toten zu richten. Er wird* Herr* genannt, nicht jedoch im uneigentlichen Sinne wie die Menschen, sondern weil er die eigentliche und ewige Herrschaft besitzt. Sein eigentlicher Name ist* Jesus<em>; so heißt er, weil er eine heilbringende Arznei ist. Er wird</em> Sohn* genannt, nicht infolge Annahme an Kindesstatt, sondern wegen natürlicher Erzeugung. Noch zahlreich sind die Namen unseres Erlösers.</p><p>Damit nun nicht die vielen Namen dich zur Annahme vieler Söhne verführen, und um dich gegen die Irrlehren der Häretiker sicherzustellen, nach welchen Christus ein anderer ist als Jesus und dieser wieder ein anderer als „die Türe“ usw., darum sagt mit Recht das Glaubensbekenntnis: „an* einen* Herrn Jesus Christus“. Wenn auch die Prädikate viele sind, das Subjekt ist nur eines.</p><p>[Forts. v. ] Der Erlöser wirkt in den einen auf diese, in den anderen auf jene Weise, wie es eben der Einzelne braucht. Für die, welche der Freude bedürfen, wird er ein Weinstock. Für die, welche eintreten sollen, wird er zur Türe. Denen, welche des Gebetsopfers bedürfen, ist er der vermittelnde Hohepriester. Denen, die in Sünden sind, wird er ein Lamm, um sich für sie schlachten zu lassen. Allen wird er alles, doch bleibt er seiner Natur nach, was er ist. Obwohl er (unveränderlich) bleibt und die wahrhaft unveränderliche Würde der Sohnschaft beibehält, ist er ein trefflicher Arzt und mitfühlender Lehrer, der sich unserer Schwachheiten annimmt. Er ist Herr in Wahrheit. Nicht ist er erst im Laufe der Zeit Herr geworden; sondern die Würde, Herr zu sein, ist ihm wesentlich eigen. Nicht wird er im uneigentlichen Sinne wie wir Herr genannt, sondern er ist Herr in Wahrheit. Er ist nämlich nach dem Willen seines Vaters Herr über seine eigenen Geschöpfe. Wir dagegen sind Herren über Menschen, die uns an Ehre gleich sind und dieselben Leidenschaften haben wie wir, oft sogar älter sind als wir; oftmals herrscht ein junger Herr über ältere Sklaven. Unser Herr Jesus Christus ist nicht in gleicher Weise Herr; zuerst war er Schöpfer, dann Herr. Zuerst erschuf er nach dem Willen seines Vaters alles; sodann ist er Herr über das, was er erschaffen hatte.</p><p>Christus, der Herr, ist in der Stadt Davids geboren. Willst du es wissen, daß Christus der Herr beim Vater schon vor seiner Menschwerdung ist? Willst du es nicht bloß glauben, sondern auch aus der Alten Schrift bewiesen haben? Nimm das erste Buch, die Genesis, zur Hand! Gott sagt: „Laßt uns den Menschen machen nach unserem Bilde“; nicht sagt er „nach* meinem* Bilde“. Nach der Erschaffung Adams heißt es: „Gott schuf den Menschen, nach dem Bilde Gottes schuf er ihn“. Die Schrift hat die göttliche Würde nicht auf den Vater allein beschränkt, sondern auch den Sohn mitinbegriffen, um zu zeigen, daß der Mensch nicht allein ein Geschöpf Gottes ist, sondern auch ein Geschöpf unseres Herrn Jesus Christus, der ebenfalls wahrer Gott ist. Dieser Herr, der zugleich mit dem Vater wirkt, wirkte auch zur Zeit Sodomas. Denn die Schrift sagt: „Der Herr ließ über Sodoma und Gomorrha Feuer und Schwefel vom Herrn vom Himmel regnen“. In sichtbarer Gestalt erschien dieser Herr dem Moses. Barmherzig ist nämlich der Herr und nimmt sich stets unserer Schwachheiten an.</p><p>Dafür, daß Christus der Herr es war, welcher dem Moses erschienen ist, soll dir Paulus Zeuge sein, welcher sagte: „Sie tranken aus einem geistigen Felsen, welcher ihnen folgte, und dieser Felsen war Christus“, und wiederum: „Im Glauben verließ Moses Ägypten..... und er erachtete die Erniedrigung Christi für einen größeren Reichtum als die Schätze in Ägypten“. Dieser Moses spricht zu ihm: „Zeige mir dich selbst!“ Wie du also siehst, schauten die Propheten damals Christus; allerdings schaute ihn jeder nach seiner Fassungskraft. „Zeige mir dich selbst, damit ich dich sehe und kenne!“ Jener aber erwidert: „Niemand, der mich sieht, wird leben“. Da nun niemand das Antlitz der Gottheit sehen konnte, ohne das Leben zu verlieren, nahm er menschliche Gestalt an; diese sollen wir sehen, um zu leben. Doch als er diese menschliche Gestalt mit nur einiger Herrlichkeit umgab, als nämlich sein Angesicht leuchtete wie die Sonne, da fielen die Jünger vor Schrecken auf die Erde. Wenn nun das körperliche Angesicht nicht in vollem Glanze leuchtete, sondern nur soweit die Jünger den Glanz fassen konnten, und wenn diese schon dadurch in Schrecken gerieten und schon diesen Glanz nicht ertragen konnten, wie hätte jemand in die Herrlichkeit der Gottheit schauen können? „Großes verlangst du, o Moses“, — spricht der Herr —; „doch ich nehme dein unerfülltes Verlangen an und will deinen Wunsch erfüllen, aber entsprechend deiner Fassungskraft. Siehe, ich berge dich in die Felsenhöhlung. Denn da du klein bist, sollst du in kleinem Raume bleiben“.</p><p>[Forts. v. ] Der Juden wegen halte nun für immer fest an dem Worte, das ich dir sagen werde! Unsere Absicht ist, zu zeigen, daß der Herr Jesus Christus bei dem Vater war. Der Herr sagt nun zu Moses: „Ich werde vor dir vorübergehen in meiner Herrlichkeit und werde vor dir im Namen des Herrn rufen“. Welches ist der Herr, den er, der Herr, ruft? Wie du siehst, lehrte er indirekt die erhabene Lehre vom Vater und Sohn. In den folgenden Worten heißt es dann wörtlich: „Und der Herr stieg herab in einer Wolke und stand dort bei ihm und rief im Namen des Herrn. Und es ging der Herr vorüber vor ihm, und es rief der Herr:,Barmherziger, gnädiger, langmütiger, erbarmungsreicher und wahrer Herr, der du die Gerechtigkeit bewahrst und Erbarmen übst bis ins tausendste Geschlecht, der du Missetaten, Ungerechtigkeiten und Sünden wegnimmst!“ Darauf verbeugte sich Moses und fiel nieder vor dem Herrn, der seinen Vater anrief und sprach: „O Herr, ziehe nun mit uns!“</p><p>Hiermit hast du* einen* Beweis. Du sollst noch einen zweiten klaren Beweis haben: „Es sprach der Herr zu meinem Herrn: Setze dich zu meiner Rechten!“ So spricht der Herr zum Herrn, nicht zum Diener, sondern zum Herrn des Weltalls, zu seinem Sohn, „dem er alles unterworfen hat. Wenn er aber sagt, alles sei ihm unterworfen, dann ist zweifellos der ausgenommen, der ihm alles unterworfen hat,..... damit Gott alles in allem sei“. Der eingeborene Sohn ist der Herr aller, aber er ist der gehorsame Sohn des Vaters. Nicht hat er die Herrschaft mit Gewalt an sich gerissen, sondern er hat sie von ihm kraft eines freiwilligen Entschlusses auf natürliche Weise erhalten. Nicht hat der Sohn die Herrschaft geraubt, noch hat der Vater ihn wegen Übertragung der Herrschaft beneidet. Er selbst sagt von sich: „Alles ist mir vom Vater übergeben worden“. „Es ist mir übergeben worden“, (d. h.) nicht als ob ich es früher nicht gehabt hätte; ich bewahre es mit Recht, da ich es dem Geber nicht geraubt habe.</p><p>Der Sohn Gottes ist also Herr. Herr ist der, welcher zu Bethlehem in Judäa geboren wurde, wie der Engel den Hirten verkündet hatte: „Ich verkünde euch eine große Freude; denn Christus, der Herr, ist euch heute in der Stadt Davids geboren worden“. Von ihm sagt einmal einer der Apostel: „Sein Wort hat er den Söhnen Israels gesandt, Friede verkündend durch Jesus Christus; dieser ist der Herr aller.“ Wenn er sagt „aller“, dann darfst du nichts von seiner Herrschaft ausnehmen. Seien es Engel oder Erzengel oder Mächte oder Herrschaften oder (sonst) etwas Erschaffenes, das von den Aposteln erwähnt wird: alles steht unter der Herrschaft des Sohnes. Er ist der Herr der Engel, wie im Evangelium geschrieben steht: „Da stand der Teufel von ihm ab, und die Engel kamen und dienten ihm“. Nicht heißt es „sie halfen ihm“, sondern „sie dienten ihm“, was Pflicht der Knechte ist. Als der Herr aus einer Jungfrau geboren werden wollte, da diente Gabriel, der im Dienen seine Würde erkannte. Da Jesus nach Ägypten fliehen wollte, um in Ägypten die Götzenbilder zu zerstören, da war es wiederum ein Engel, der dem Joseph erschien. Als er nach seiner Kreuzigung von den Toten auferstanden war, verkündete den Frauen ein Engel als guter Diener: „Gehet hin und saget seinen Jüngern: Er ist auferstanden und er geht vor euch nach Galiläa. Siehe, ich habe es euch gesagt“. Er wollte gleichsam sagen: „Ich habe meinen Auftrag nicht übertreten; daß ich ihn euch ausgerichtet habe, erkläre ich feierlich, damit, wenn ihr nicht darauf achtet, der Tadel nicht mich treffe, sondern die, welche nicht darauf geachtet haben.“ Der eine Herr Jesus Christus ist es, von dem auch die heutige Schriftlesung spricht: „Mag man nämlich auch von vielen Göttern sprechen, die im Himmel oder auf Erden seien, wir“ — so heißt es weiter — „haben nur* einen* Gott, den Vater, von dem alles stammt und für den wir sind, und* einen* Herrn Jesus Christus, durch welchen alles ist und durch welchen wir sind“.</p><p>Jesus Christus führt einen doppelten Namen: Jesus ist er als Erlöser, Christus als Priester. Diese Erkenntnis leitete Moses, den gewaltigsten unter den Propheten, bei der Benennung der zwei auserwähltesten Männer: Ause, seinen Nachfolger in der Herrscherwürde, nannte er Jesus (Josue), seinen eigenen Bruder Aaron nannte er Christus. Die beiden auserwählten Männer sollten sowohl die hohepriesterliche wie die königliche Würde des kommenden* einen* Jesus Christus darstellen. Christus ist Hoherpriester wie Aaron. „Nicht hat er sich selbst mit der hohenpriesterlichen Würde ausgezeichnet, sondern der hat es getan, welcher zu ihm sprach: Du bist der Priester ewig nach der Ordnung des Melchisedech“. In vieler Beziehung war Jesus, der Sohn des Nave, ein Vorbild Christi. Am Jordan war es, daß jener seine Herrschaft über das Volk antrat. Dort begann Christus nach seiner Taufe seine Heilsbotschaft zu verkünden. Zwölf Männer stellte der Sohn des Nave auf, daß sie das Erbe verteilten; zwölf Apostel entsandte Jesus als Herolde der Wahrheit in die ganze Welt. Jener, das Vorbild des Erlösers, rettete Rahab, die Buhlerin, weil sie glaubte; der wahre Erlöser erklärte: „Siehe, die Zöllner und Unzüchtigen gehen vor euch in das Reich Gottes ein“. Zur Zeit des Vorbildes stürzten auf den bloßen Trompetenschall hin die Mauern Jerichos ein; wegen des Wortes Jesu: „Nicht wird hier ein Stein auf dem andern gelassen“, ist der jüdische Tempel, der uns gegenüberlag, eingestürzt. Der tiefere Grund des Einsturzes war allerdings nicht das Wort Jesu, sondern die Sünde der Gottlosen.</p><p>[Forts. v. ] Jesus heißt bei den Hebräern soviel als Erlöser, bei den Griechen soviel als Heiland. Denn er ist Arzt für Seele und Leib, er läßt die Geister gesunden. Er heilt, die körperlich blind sind; er bringt Licht dem Verstande. Er ist Arzt der physisch Lahmen; die Füße der Sünder führt er zur Buße. Zum Gichtbrüchigen sagt er nämlich: „Sündige nicht mehr“, und: „nimm dein Bett und gehe“. Da er wegen seines sündhaften Zustandes gichtbrüchig wurde, heilte Christus zuerst seine Seele, um dann auch dem Körper Heilung zu bringen. Wessen Seele wegen ihrer Sünden leidet, der hat in Christus einen Arzt. Ist hier noch einer kleingläubig, so sage er zu Christus: „Hilf mir in meinem Unglauben!“ Ist einer von körperlichen Leiden heimgesucht, so habe er Vertrauen, gehe hin zu Christus, da er auch in diesen Fällen heilt, und erkenne, daß Jesus ist der Christus!</p><p>Die Juden halten den Herrn zwar für einen Jesus, glauben jedoch nicht, daß er der Christus sei. Darum erklärt der Apostel: „Wer ist ein Lügner, wenn nicht der, welcher leugnet, daß Jesus der Christus ist?“ Christus ist ein Hoherpriester, der sein Priesteramt nicht vorübergehend besitzt, der nicht erst in der Zeit angefangen hat, Priester zu sein, den auch niemand ablöst in der hohenpriesterlichen Würde, wie du am Sonntag vernommen hast, als wir beim Gottesdienst über das Wort sprachen: „nach der Ordnung des Melchisedech“. Nicht erbte er auf Grund leiblicher Abstammung das hohepriesterliche Amt, nicht wurde er mit dem üblichen Öl gesalbt, sondern er wurde vor der Zeit vom Vater gesalbt. Von den übrigen Priestern unterscheidet er sich dadurch, daß er unter einem Eidschwur Priester geworden ist. „Die einen sind ohne Eidschwur Priester, er aber ist es auf Grund eines Schwures; denn es heißt: ‚Der Herr schwur, und nicht wird er es bereuen“‘. Zur Gewißheit hätte schon der Wille des Vaters genügt. Nun aber ist die Gewißheit verdoppelt: zum Willen kommt der Eid, „damit wir durch zwei unwandelbare Tatsachen, in welchen Gott nicht lügen konnte, im Troste, den uns der Glaube gibt, uns gesichert fühlen“, wir, die wir Jesus Christus, den Sohn Gottes, annehmen.</p><p>Als dieser Christus gekommen war, verleugneten ihn die Juden, während die Dämonen ihn bekannten. Nicht hatte ihn jedoch der Patriarch David verleugnet; denn er hatte gesagt: „Eine Lampe habe ich bereitet meinem Christus“. Einige haben unter der Lampe das Licht der Prophetie verstanden, andere dagegen das Fleisch, das Christus aus der Jungfrau angenommen hat; denn der Apostel sagt: „Wir haben diesen Schatz in irdenen Gefäßen“. Nicht hatte ihn der Prophet verleugnet, denn er hatte gesagt: „und verkündend den Menschen seinen Christus“. Auch Moses, Isaias, Jeremias hatten ihn gekannt. Es gibt keinen Propheten, der ihn nicht gekannt hätte. Selbst die Dämonen haben ihn erkannt. „Er schalt sie“, heißt es, und beigefügt ist: „weil sie wußten, daß er der Christus sei“. Während die Dämonen ihn bekannten, haben die Hohenpriester ihn verleugnet. Während die Hohenpriester ihn verleugnet haben, hat die Samariterin ihn verkündet mit den Worten: „Kommet, sehet den Mann der mir alles sagte, was ich getan habe! Ist dieser nicht Christus?“</p><p>[Forts. v. ] Dieser Jesus ist der Christus, „der gekommen ist als Hoherpriester der zukünftigen Güter“. In seiner göttlichen Freigebigkeit hat er uns allen seinen eigenen Namen geschenkt. Wer unter den Menschen König ist, teilt seinen Königstitel nicht mit anderen; Jesus Christus aber, der Sohn Gottes, wollte, daß wir Christen heißen. Doch wird man sagen: der Name „Christen“ war neu und ehedem nicht gebräuchlich; was aber neu ist, findet wegen des Ungewöhnlichen oftmals Widerspruch. Da hat der Prophet vorgebeugt, wenn er erklärt: „Die mir dienen, werden einen neuen Namen erhalten, der auf Erden gesegnet sein wird“. Fragen wir einmal die Juden: Dienet ihr dem Herrn oder nicht? Zeiget euern neuen Namen! Denn Juden und Israeliten hießet ihr zur Zeit des Moses und der übrigen Propheten; auch noch nach der Rückkehr aus Babylon und bis auf den heutigen Tag habt ihr diesen Namen. Wo ist also der neue Name? Wir aber haben, da wir dem Herrn dienen, den neuen Namen. Neu ist er allerdings, doch gerade der neue Name ist es, welcher auf Erden gesegnet sein wird. In der ganzen Welt ist dieser Name gang und gäbe. Die Juden sind auf ein Land beschränkt, die Christen aber sind bis an die Grenzen des Erdkreises verbreitet; denn (durch diese) wird der Name des eingeborenen Sohnes Gottes verkündet.</p><p>Willst du wissen, ob die Apostel den Namen Christi gekannt und verkündet haben bzw. ob sie Christum selbst in sich hatten? Paulus sagt zu seinen Zuhörern: „Sucht ihr einen Beweis dafür, daß Christus in mir redet?“ Paulus verkündet Christum mit den Worten: „Nicht predigen wir nämlich uns, sondern Christum Jesum den Herrn, uns aber predigen wir als euren Diener um Jesu willen.“. Wer war nun Paulus? Ehedem ein Verfolger (Christi). O großes Wunder! Er, der früher Christum verfolgt hat, verkündet Christum! Warum? Wurde er bestochen? Niemand hatte ihn bestochen. Oder war er vom persönlichen Verkehr mit Christus ergriffen? Christus war ja bereits in den Himmel aufgefahren. Paulus zog aus zur Verfolgung. Aber schon nach drei Tagen war der Verfolger (Christi) in Damaskus (Christi) Prediger. Welche Kraft hat da gewirkt?</p><p>Sonst ruft man Freunde als Zeugen für Freunde an; ich aber habe dir einen ehemaligen Feind als Zeugen zitiert. Hast du noch Zweifel? Schwerwiegend wäre zwar auch das Zeugnis von Petrus und Johannes; doch manchem war es ungenügend, da Petrus und Johannes Freunde (Christi) waren. Wer sollte aber noch an der Wahrheit zweifeln, wenn einer zuerst Christi Feind war, später aber für ihn gestorben ist?</p><p>Hier muß ich wahrlich das Walten des Hl. Geistes bewundern. Die Briefe der übrigen Apostel beschränkte er nämlich auf eine kleine Zahl; Paulus aber, dem ehemaligen Verfolger, gewährte er die Gnade, vierzehn Briefe zu schreiben. Nicht hatte er für Petrus und Johannes diese Gnade deshalb beschränkt, weil diese geringer gewesen wären. Das sei ferne! Sondern er gewährte seinem früheren Feinde und Verfolger, mehr zu schreiben, damit seine Lehre über allem Zweifel erhaben wäre und wir alle deshalb gläubig würden. „Alle staunten über Paulus und sagten: ‚Ist das nicht der, welcher uns früher verfolgte? Ist er nicht hierhergekommen, um uns gefesselt nach Jerusalem zu führen?‘“ „Staunet nicht — entgegnet Paulus —: ‚Ich weiß, daß es für mich schwer ist, gegen den Stachel auszuschlagen‘. ‚Ich weiß, daß ich nicht würdig bin, Apostel zu heißen, da ich die Kirche Gottes verfolgt habe‘. Doch habe ich sie verfolgt aus Unwissenheit. Denn ich meinte, die christliche Predigt bedeute Aufhebung des Gesetzes. Nicht jedoch wußte ich, daß Christus nicht gekommen war,,das Gesetz aufzulösen, sondern es zu erfüllen‘. ‚Übergroß war in mir die Gnade Gottes‘“</p><p>Geliebte, es gibt viele, auf Wahrheit beruhende Zeugnisse für Christus. Zeugnis gibt vom Himmel her der Vater für seinen Sohn. Zeugnis gibt der Hl. Geist, da er in Gestalt einer Taube sichtbar auf ihn herabsteigt. Zeugnis gibt der Erzengel Gabriel, da er Maria die frohe Botschaft bringt. Zeugnis gibt die jungfräuliche Gottesgebärerin. Zeugnis gibt der selige Ort der Krippe, gibt Ägypten, das den Herrn in seiner Kindheit aufgenommen hatte. Zeugnis gibt Simeon, der ihn in seine Arme nahm und sprach: „Nun entlässest du deinen Diener, o Herr, in Frieden deinem Worte gemäß; denn meine Augen haben dein Heil gesehen, das du vor allen Völkern bereitet hast“. Auch die tugendsame und so fromme Prophetin und Asketin Anna gibt von ihm Zeugnis. Zeugnis gibt Johannes der Täufer, der größte unter den Propheten, aber auch der Anfang des Neuen Bundes, so daß er gewissermaßen beide Testamente, das Alte und das Neue, in sich vereinigt. Zeugnis gibt unter den Flüssen der Jordan, unter den Meeren das Meer Tiberias. Zeugnis geben Blinde, geben Lahme, gehen auferweckte Tote. Die Dämonen geben Zeugnis mit den Worten: „Was haben wir mit dir zu tun, Jesus? Wir wissen, wer du bist, Heiliger Gottes“. Zeugnis geben die Winde, welche auf seinen Befehl schwiegen. Zeugnis geben die fünf Brote, welche für fünftausend Menschen vermehrt worden sind. Zeugnis gibt das heilige Kreuzesholz, welches bis auf den heutigen Tag bei uns zu sehen ist, und dessen Partikel von Gläubigen fast über die ganze Erde verbreitet worden sind. Zeugnis gibt die Palme im Tale, die ihre Zweige den dereinst dem Herrn zujubelnden Kindern bot. Der Ort Gethsemane gibt Zeugnis; den, der Phantasie hat, läßt er immer noch Judas sehen. Dieser heilige, weithin sichtbare Golgatha gibt Zeugnis; Zeugnis gibt das heilige Grabmal und der Stein, der bis auf diesen Tag noch dort liegt. Zeugnis gibt die Sonne, die jetzt leuchtet, damals aber, zur Zeit des heilbringenden Leidens, sich verfinstert hatte. Zeugnis gibt die Finsternis, welche damals von der sechsten bis zur neunten Stunde geherrscht hatte. Zeugnis gibt das Licht, das von der neunten Stunde bis zum Abend leuchtete. Der heilige Ölberg gibt Zeugnis; denn von hier aus fuhr Christus zum Vater auf. Zeugnis geben auch die wasserspendenden Wolken, welche den Herrn aufgenommen haben und von welchen der Psalmist sagte: „Macht auf eure Tore, ihr Mächte, auftun sollen sich die ewigen Tore; der König der Herrlichkeit wird einziehen“. Zeugnis geben die ehemaligen Feinde Jesu, zu welchen der hl. Paulus gehört hatte, der kurze Zeit sein Feind, lange Zeit sein Diener war. Zeugnis geben die zwölf Apostel, welche nicht nur mit Worten, sondern auch durch ihre Martern und ihr Sterben die Wahrheit verkündet haben. Zeugnis gibt der Schatten Petri, wodurch im Namen Christi die Kranken geheilt wurden. Zeugnis geben die Schweißtücher und Gürtel, welche dereinst ebenfalls in der Kraft Christi durch Paulus Heilung bewirkten. Zeugnis geben die Perser und Gothen und alle jene Heiden, welche für den das Leben gelassen haben, den sie mit leiblichen Augen nicht geschaut hatten. Zeugnis geben die Dämonen, welche bis auf den heutigen Tag durch die Gläubigen ausgetrieben werden.</p><p>Diese zahlreichen, verschiedenen Zeugen ließen sich noch vermehren. Kann nun Christus, für den die Zeugen sprechen, der Glaube noch verweigert werden? War einer bisher ungläubig, so glaube er jetzt! War einer bereits gläubig, dann möge er im Glauben an unseren Herrn Jesus Christus seinen Glauben vermehren! Es möge ihm zum Bewußtsein kommen, wessen Namen er trägt! Christ wurdest du genannt! Halte den Namen in Ehren, daß nicht durch dich unser Herr Jesus Christus, der Sohn Gottes, gelästert werde! Lasse vielmehr deine guten Werke leuchten vor den Menschen, damit sie dieselben sehen und in Christus Jesus, unserem Herrn, den Vater im Himmel preisen, dem die Ehre sei jetzt und in alle Ewigkeit. Amen.XI. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Worte: „den eingeborenen Sohn Gottes, der aus dem Vater geboren wurde als wahrer Gott vor aller Zeit, durch den alles erschaffen wurde“.</p><h2>12</h2><p>* Über die Worte: „den eingeborenen Sohn Gottes, der aus dem Vater geboren wurde als wahrer Gott vor aller Zeit, durch den alles erschaffen wurde“.*</p><p>Daß wir auf Jesus Christus hoffen, habe ich im gestrigen Vortrage euch zur Genüge, soweit es in meinen Kräften lag, dargelegt. Nicht aber an irgendeinen beliebigen Christus soll man glauben, auch nicht darf man einen von den vielen annehmen, welche uneigentlich Christus heißen. Während es im Alten Bunde Christus gab nur als Vorbilder, ist unser Jesus der wahre Christus. Nicht wie einer der Menschen wurde er zur priesterlichen Würde befördert, sondern ewig hat er vom Vater die Würde des priesterlichen Amtes. Damit wir ihn nicht für einen gewöhnlichen Christus halten, hat das Glaubensbekenntnis vorgebeugt und ausführlich erklärt: wir glauben an* einen* Herrn Jesus Christus, den eingeborenen Sohn.</p><p>[Forts. v. ] Beim Worte „Sohn“ darfst du aber nicht an einen angenommenen Sohn denken, sondern an einen natürlichen Sohn, an einen eingeborenen Sohn, der keinen Bruder hat. Deshalb heißt er nämlich der Eingeborene, weil er als Gott und als aus dem Vater Geborener keinen Bruder hat. Den Namen „Sohn Gottes“ geben nicht wir selbst ihm, sondern gerade der Vater hat ihn Christus, den Sohn, genannt. Der richtige Name ist der, welchen die Kinder von ihren Eltern erhalten.</p><p>Unser Herr Jesus Christus ist seinerzeit Mensch geworden, doch die Menge hat ihn nicht erkannt. Als er nun über das, was man nicht erkannt hatte, belehren wollte, rief er die Jünger zusammen und fragte: „Für wen hält man mich, den Menschensohn?“ Nicht aus Ehrsucht fragte er, sondern in der Absicht, die Wahrheit zu lehren; die Landsleute des eingeborenen Sohnes Gottes sollten ihn nicht als einen gewöhnlichen Menschen ansehen. Als die Jünger antworteten: „Die einen für Elias, die anderen für Jeremias“, sagte er zu ihnen: „Man muß es ihnen verzeihen, da sie es nicht anders wissen; aber ihr Apostel, die ihr in meinem Namen Aussätzige rein macht, Teufel austreibt, Tote erweckt, müßt jenen kennen, durch welchen ihr die Wunder wirkt.“ Da schwiegen alle; denn die Lehre überstieg die menschliche Fassungskraft. Nur Petrus, der Apostelfürst und oberste Lehrer der Kirche, ergreift das Wort, nicht aber aus Schlauheit, nicht aus menschlicher Berechnung, sondern weil der Vater ihn erleuchtete, und sagt: „Du bist Christus, der Sohn des lebendigen Gottes“; nicht aber sagt er einfach: „Du bist Christus“. Auf dieses wahrhaft übermenschliche Geständnis hin wird Petrus selig gepriesen und wird zur Bekräftigung erklärt, daß der Vater das Wort geoffenbart habe. Der Heiland sagt nämlich: „Selig bist du, Simon, Sohn des Jonas; denn nicht Fleisch und Blut haben es dir geoffenbart, sondern mein Vater, der im Himmel ist“, wer unseren Herrn Jesus Christus, den Sohn Gottes, erkennt, wird selig gepriesen; wer dagegen den Sohn Gottes verleugnet, ist unglücklich und elend.</p><p>Das Wort „Sohn“ darfst du nicht im uneigentlichen Sinne nehmen, sondern du mußt annehmen: er ist wahrer Sohn, ein natürlicher Sohn, ein Sohn, der ohne Anfang ist, der nicht erst aus dem Sklavenstande zur Sohnschaft emporgestiegen ist, sondern ewig auf Grund unerforschlícher, unfaßbarer Geburt Sohn ist. Auch das Wort „Erstgeborener“ darfst du nicht in menschlicher Weise verstehen; denn die Erstgeborenen unter den Menschen haben noch Brüder. Allerdings heißt es einmal: „Mein erstgeborener Sohn ist Israel“. Aber wie Ruben war auch Israel als Erstgeborener abgesetzt worden. Ruben hatte nämlich das Ehebett seines Vaters bestiegen, Israel aber hatte den Sohn des Vaters aus dem Weinberg hinausgeworfen und gekreuzigt. Zu anderen sagt die Schrift: „Ihr seid Söhne unseres Herrn und Gottes“, und wieder ein andermal: „Ich habe es gesagt: Götter seid ihr und Söhne des Höchsten alle“. „Ich habe (so zu ihnen) gesagt“ heißt es, nicht „ich habe sie gezeugt“. Durch dieses Wort Gottes erhielten sie die Sohnschaft, welche sie (zuvor) noch nicht hatten. Jesus aber ist nicht als etwas anderes geboren, als was er ist. Er, der vor jedem Anfang und vor der Zeit war, wurde von Anfang an geboren als Sohn des Vaters. Er ist der Sohn des Vaters, in allem ähnlich dem Erzeuger, ewig vom ewigen Vater, Leben vom Leben, Licht vom Licht, Wahrheit von der Wahrheit, Weisheit aus der Weisheit, König vom König, Gott von Gott, Kraft aus der Kraft.</p><p>Wenn dir das Evangelium sagt: „Stammbuch Jesu Christi, des Sohnes Davids, des Sohnes Abrahams“, dann hast du diese Worte auf seine menschliche Natur zu beziehen. Sohn Davids war er in der Fülle der Zeiten, Sohn Gottes aber ist er vor aller Zeit, ohne einen Anfang zu haben. Die Sohnschaft aus David hatte er nicht, diese erhielt er erst. Die Gottessohnschaft hat er, und er hat sie ewig als Geborener aus dem Vater. Christus hat zwei Väter: seinem Fleische nach hat er David zum Vater, als Gott hat er Gott zum Vater. Sofern er von David abstammt, ist er der Zeit unterworfen, kann berührt werden und hat Vorfahren. Sofern er Gott ist, ist er nicht der Zeit und dem Raume unterworfen und hat auch keine Vorfahren; denn „wer wird sein Geschlecht aufzählen?“ Gott ist ein Geist, und da er ein Geist ist und keinen Körper hat, hat er in geistiger Weise geboren in einer unergründlichen, unfaßbaren Geburt. Der Sohn selbst sagt von seinem Vater: „Der Herr sprach zu mir: Mein Sohn bist du, heute habe ich dich erzeugt“. „Heute“ bedeutet nicht „eben erst“, sondern „ewig“; „heute“ ist soviel als „unzeitlich“, „vor aller Zeit“. „Aus dem Schoße vor Luzifer habe ich dich erzeugt“.</p><p>[Forts. v. ] Glaube also an Jesus Christus, den Sohn des lebendigen Gottes, den eingeborenen Sohn! Denn das Evangelium sagt: „So sehr hat Gott die Welt geliebt, daß er seinen eingeborenen Sohn dahingab, damit keiner, der an ihn glaubt, verloren gehe, sondern das ewige Leben habe“. Und wiederum: „Wer an den Sohn glaubt, wird nicht gerichtet, sondern ist aus dem Tode in das Leben versetzt“; „wer aber an den Sohn nicht glaubt, wird das Leben nicht schauen, vielmehr bleibt der Zorn Gottes auf ihm, da er nicht glaubt an den eingeborenen Sohn Gottes“. Über den Sohn Gottes gibt Johannes das Zeugnis: „Wir sahen seine Herrlichkeit, die Herrlichkeit des Eingeborenen vom Vater, voll Gnade und Wahrheit“. Zitternd erklärten die Dämonen: „Lasse uns! Was haben wir mit dir zu tun, Jesus, Sohn des lebendigen Gottes?“</p><p>Christus ist also der Sohn Gottes von Natur und nicht durch Adoption. Er ist geboren aus dem Vater. „Wer den Erzeuger liebt, liebt auch den, der aus ihm erzeugt ist“. Wer aber den Erzeugten verachtet, schmäht den Erzeuger. Wenn du aber hörst, daß Gott erzeugt, dann darfst du nicht in sinnliche Vorstellung fallen! Nicht darfst du an eine vergängliche Geburt denken! Das wäre gottlos. Gott ist ein Geist; geistig ist die Geburt. Denn Leiber gebären Leiber, auch braucht leibliche Geburt ihre Zeit. Die Geburt des Sohnes aus dem Vater braucht aber keine Zeit. Was auf Erden geboren wird, ist unvollkommen; der Sohn Gottes aber wurde geboren als etwas Vollkommenes. Denn das, was er jetzt ist, als das gleiche ist er von Anfang an geboren worden vor der Zeit. Unsere Geburt ist schuld daran, daß wir von kindlicher Unwissenheit (allmählich) zu geistiger Reife vorrücken. Unvollkommen, o Mensch, ist deine Geburt! Denn, was du wirst, wirst du allmählich. Mit dem Gedanken an Christus aber darfst du nicht derartige Vorstellungen verbinden, nicht darfst du seinen Erzeuger der Schwachheit beschuldigen. Würde er nämlich etwas Unvollkommenes geboren haben, das erst mit der Zeit die Vollkommenheit erlangt hätte, dann würdest du dem Erzeuger Schwachheit vorwerfen. Den Vorwurf würdest du ihm machen, wenn du annimmst, der Erzeuger habe Christus die Vollkommenheit nicht von Anfang an geschenkt, sondern erst später.</p><p>[Forts. v. ] Die Geburt Christi darfst du dir nicht nach Menschenart vorstellen. Du darfst sie auch nicht vergleichen mit der Erzeugung Isaaks aus Abraham. Denn Abraham erzeugte den Isaak nicht auf Grund eigenen Willensentschlusses, sondern auf Grund einer Gnadenerweisung. Wenn aber Gott, der Vater, erzeugt, da gibt es keine Unkenntnis und kein Bedenken. Die Behauptung, er habe nicht gewußt, was er erzeuge, wäre die größte Gottlosigkeit. Und die gleiche Gottlosigkeit wäre es, zu behaupten, es habe ihm erst einige Überlegung gekostet, ehe er Vater geworden sei. Denn nicht war Gott ehedem ohne Sohn, und nicht ist er erst später, in der Zeit, Vater geworden. Vielmehr ewig hat er seinen Sohn, welchen er nicht nach Menschenart geboren hat, sondern in einer Weise, die allein ihm bekannt ist, der vor aller Zeit ihn als wahren Gott geboren hat.</p><p>Da nämlich der Vater wahrer Gott ist, war der Sohn, den er erzeugte, ihm ähnlich: wahrer Gott. Nicht hatte er in gleicher Weise geboren, wie Lehrer Schüler gebären, oder so, wie es Paulus (von sich) sagt: „In Christus Jesus nämlich habe ich euch durch das Evangelium geboren“. Hier ist der, welcher der Natur nach nicht Sohn war, durch den Unterricht zum Sohne geworden, Christus aber ist natürlicher Sohn, wahrer Sohn. Nicht ist er Sohn in der Weise, in welcher ihr Täuflinge jetzt Söhne Gottes werdet. Denn auch ihr werdet Söhne, jedoch durch Adoption auf Grund eines Gnadengeschenkes, da geschrieben ist: „Allen jenen, welche ihn aufnahmen, gab er Macht, Kinder Gottes zu werden, denen, welche an seinen Namen glauben, welche nicht aus dem Geblüte, nicht aus dem Willen des Fleisches, nicht aus dem Willen des Mannes, sondern aus Gott geboren wurden“. Wir werden geboren aus Wasser und Geist; nicht jedoch auf solche Weise wurde Christus aus dem Vater geboren. Denn als Christus getauft wurde, erscholl seine Stimme, die sprach: „Dieser ist mein Sohn“. Nicht sagte er: „Dieser ist jetzt mein Sohn geworden“, sondern: „Dieser ist mein Sohn“. Er wollte zu erkennen geben, daß er auch schon vor der Taufe Sohn war.</p><p>Der Vater gebar den Sohn nicht so, wie bei Menschen der Verstand das Wort gebiert. Der Verstand, der in uns ist, ist zwar etwas für sich Bestehendes; aber das Wort vergeht, sobald es einmal ausgesprochen und in die Luft gedrungen ist. Christus aber wurde, wie wir wissen, nicht als ein flüchtiges Wort geboren, sondern als persönliches, lebendiges Wort. Nicht wurde dieses Wort mit Lippen gesprochen, und nicht ist es zerronnen, sondern es wurde ewig aus dem Vater in unaussprechlicher Weise als Hypostase geboren. Denn „im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“. Zur Rechten sitzt das Wort, erkennt den Willen des Vaters und schafft alles nach dem Willen des Vaters. Das Wort stieg herab und stieg hinauf, während das flüchtig gesprochene Wort weder herab- noch hinaufsteigt. Christus ist das Wort, das sprach: „Was ich bei meinem Vater gesehen habe, sage ich“. Er ist das mächtige Wort, das über alles herrscht; denn alles hat der Vater dem Sohne übergeben“.</p><p>Nicht hat also der Vater ihn erzeugt so, wie Menschen es denken möchten, sondern auf eine Weise, die Gott allein bekannt ist. Wir versprechen euch nicht, über die Art der Erzeugung aufzuklären. Wir konstatieren nur, daß die Erzeugung nicht auf diese oder jene Weise erfolgt ist. Die Erzeugung des Sohnes aus dem Vater ist nicht nur uns unbekannt, sondern auch aller erzeugten Natur. „Frage die Erde, ob sie es dir sagen kann!“ Und wenn du alles, was auf Erden ist, fragen würdest, man könnte dir keine Antwort geben. Denn nicht kann die Erde das Wesen ihres eigenen Bildners und Schöpfers nennen. Nicht nur die Erde, auch die Sonne kennt das Wesen nicht. Denn erst am vierten Tage wurde die Sonne erschaffen, so daß sie nichts weiß von den Vorgängen der ersten drei Tage. Wenn sie aber nichts weiß von dem, was in den drei ersten Tagen vor sich ging, dann kann sie den Schöpfer nicht erklären. (Auch) der Himmel wird keine Auskunft geben; denn auf den Wink des Vaters hat Christus den Himmel, der dem Rauch gleicht, zum Firmament gemacht. Auch die Himmel der Himmel werden keine Auskunft geben, auch nicht die Wasser über den Himmeln. Warum bist du also, o Mensch, darüber ungehalten, daß du nicht weißt, was selbst die Himmel nicht wissen? Doch nicht nur die Himmel erfassen nicht die Geburt, sondern auch alle Engelskreaturen vermögen es nicht. Wenn nämlich einer, sofern es möglich wäre, in den ersten Himmel hinaufsteigen, den dort wohnenden Chor der Engel schauen, zu ihm treten und ihn fragen würde: „Auf welche Weise hat Gott seinen Sohn erzeugt?“ dann würden die Engel wohl antworten; „Über uns droben wohnen noch Höhere; frage sie!“ Steige empor zum zweiten und dritten Himmel! Gehe womöglich zu den Thronen und Herrschaften, zu den Mächten und Kräften! Und könnte — was unmöglich ist — jemand zu ihnen gelangen, würden auch sie die Auskunft verweigern; sie könnten sie ja nicht geben.</p><p>[Forts. v. ] Stets habe ich mich über den Vorwitz jener verwegenen Menschen aufgehalten, welche durch ihre falsche Frömmigkeit in Unglauben fallen. Sie kennen nicht die Geschöpfe Christi, die Throne und Herrschaften, die Mächte und Kräfte, und doch versuchen sie es, deren Schöpfer selbst vorwitzig zu ergründen. Sage mir erst, Verwegenster, welches ist der Unterschied zwischen Thronen und Herrschaften, alsdann grüble nach über das Wesen Christi! Sage mir, was ist Macht, was ist Kraft, was ist Herrschaft, was ist Engel, alsdann forsche neugierig nach dem Schöpfer! Denn „durch ihn ist alles gemacht worden“. Aber du willst bzw. du kannst die Throne und Herrschaften nicht fragen. Wen gibt es noch, der die Tiefen Gottes kennt außer dem Hl. Geiste, der in den göttlichen Schriften geredet hat? Aber auch der Hl. Geist hat in den Schriften nicht über die Geburt des Sohnes aus dem Vater gesprochen. Warum nun forschest du neugierig nach etwas, worüber nicht einmal der Hl. Geist in der Schrift geschrieben hat? Du, der du das Wort der Schrift nicht verstehst, frägst vorwitzig nach dem, was nicht geschrieben ist? Zahlreich sind die Probleme in der göttlichen Schrift. Wenn wir nicht die Schriftprobleme erfassen, was greifen wir dann geschäftig nach Problemen, die außerhalb der Schrift liegen? Es genügt uns zu wissen, daß Gott den einen und einzigen Sohn erzeugt hat.</p><p>Schäme dich nicht, deine Unkenntnis einzugestehen; denn mit den Engeln hast du sie gemein. Nur der Erzeuger kennt den Erzeugten, und der Erzeugte kennt den Erzeuger. Der Erzeuger weiß, was er erzeugt hat, und der heilige Geist Gottes bezeugt es in der Schrift, daß der, welcher vor der Zeit erzeugt worden ist, Gott sei. „Denn wer unter den Menschen kennt des Menschen Wesen außer dem Geiste, der im Menschen ist; so hat auch niemand das Wesen Gottes erkannt außer der Geist Gottes.“ Wie der Vater das Leben in sich hat, so hat er auch dem Sohne gegeben, daß er das Leben in sich hat“, und: „damit sie alle den Sohn ehren, wie sie den Vater ehren“, und: „wie der Vater diejenigen, welche er will, lebendig macht, so macht auch der Sohn lebendig, welche er will“. Weder erlitt der Erzeuger irgendwelchen Verlust noch fehlt dem Erzeugten etwas. Schon oft — ich weiß es — habe ich davon gesprochen; doch, damit ihr sicher geht, wird es wiederholt. Der Erzeuger hat keinen Vater, und der Erzeugte hat keinen Bruder; der Erzeuger wurde nicht zum Sohne und der Erzeugte nicht zum Vater. Aus einem einzigen Vater ist der eine eingeborene Sohn hervorgegangen. Nicht gibt es zwei Unerzeugte, nicht zwei Eingeborene. Vielmehr ist* ein* unerzeugter Vater; unerzeugt ist nämlich der, welcher keinen Vater hat. Und es ist* ein* Sohn, der ewig aus dem Vater erzeugt worden ist. Nicht in der Zeit ist er geboren worden, sondern vor der Zeit; nicht allmählich ist er herangewachsen, sondern er ist als das erzeugt worden, was er jetzt ist.</p><p>Wir glauben also an den eingeborenen Sohn Gottes, der aus dem Vater als wahrer Gott erzeugt worden ist. Der wahre Gott nämlich erzeugt, wie gesagt worden ist, keinen falschen, auch nicht bedurfte es zuerst der Überlegung, ehe er erzeugte, sondern er hat ewig erzeugt, und viel schneller hat er erzeugt, als unsere Worte und Gedanken sind. Wenn wir in der Zeit etwas reden, brauchen wir Zeit. Bei der göttlichen Macht dagegen ist die Geburt unzeitlich. Und wie wiederholt gesagt wurde, hat der Vater nicht den Sohn aus dem Nichtsein in das Sein geführt, auch hat er nicht den Nichtseienden als Sohn angenommen. Vielmehr hat der Vater, der ewig ist, ewig und auf unsagbare Weise den einen und einzigen Sohn, der keinen Bruder hat, erzeugt. Nicht gibt es zwei Anfänge, sondern der Vater, der einzige Anfang, ist das Haupt des Sohnes. Der Vater nämlich hat den Sohn, den wahren Gott, geboren, dessen Name Emanuel ist; Emanuel heißt nämlich übersetzt: Gott mit uns.</p><p>[Forts. v. ] Willst du wissen, daß der, welcher aus dem Vater erzeugt worden ist und später Mensch wurde, Gott ist? Höre auf das Wort des Propheten: „Dieser ist unser Gott; kein anderer ist ihm zu vergleichen. Er hat alle Wege der Weisheit ausfindig gemacht und sie Jakob, seinem Sohne, und Israel, seinem Geliebten, mitgeteilt. Hierauf erschien er auf Erden und verkehrte mit den Menschen“. Erkennst du es: Gott ist nach der Gesetzgebung des Moses Mensch geworden? Noch ein zweites Beispiel sollst du für die Gottheit Christi haben. Es ist eben verlesen worden: „Dein Thron, o Gott, ist in alle Ewigkeit“. Damit man wegen seiner fleischlichen Erscheinung auf Erden nicht glaube, er sei später erst zur Würde der Gottheit gelangt, heißt es ausdrücklich: „Darum hat dich, o Gott, dein Gott mit Öl der Freude gesalbt zur Auszeichnung vor deinen Genossen“. Wie du siehst, ist Christus Gott, gesalbt von Gott, dem Vater.</p><p>Willst du noch ein drittes Zeugnis für die Gottheit Christi? Höre auf das Wort des Isaias: „Der arbeitsame Ägypter und der handeltreibende Äthiopier.... werden zu dir beten: In dir ist Gott, und es ist kein Gott außer dir; denn du bist Gott, und wir wußten es nicht, o Gott, Erlöser Israels“. Gott der Sohn, der Gott den Vater in sich hat, sagt, wie du siehst, fast das gleiche, was er in den Evangelien erklärt hat: „Der Vater ist in mir, und ich bin im Vater“. Nicht sagte er „ich bin der Vater“, sondern „der Vater ist in mir, und ich bin im Vater“. Auch erklärte er nicht: „Ich und der Vater* bin* eins“, sondern: „Ich und der Vater* sind* eins“. Wir sollen nämlich weder Vater und Sohn voneinander trennen noch auch sollen wir sie zu einer Sohn-Vaterschaft vermischen. Eins sind sie mit Rücksicht auf die göttliche Würde; denn Gott hat Gott erzeugt. Eins sind sie in bezug auf ihre Herrschaft. Denn nicht herrscht über die einen der Vater, über die anderen der Sohn. Vielmehr herrscht der Sohn über die, über welche der Vater herrscht. Eins sind sie, da es unter ihnen keine Uneinigkeit und keine Zwietracht gibt; denn nicht will der Vater etwas anderes als der Sohn. Eins sind sie, da die Werke Christi nicht verschieden sind von den Werken des Vaters. Einheitlich ist ja das ganze Schöpfungswerk; durch den Sohn hat es der Vater gemacht. „Denn er sprach, und es ist geworden; er befahl, und es wurde erschaffen“, sagt der Psalmist. Wer spricht, spricht zu dem, der auf ihn hört; wer befiehlt, befiehlt dem, der bei ihm ist.</p><p>Wahrer Gott ist also der Sohn. Er hat den Vater in sich, nicht jedoch ist er in den Vater verwandelt. Nicht nämlich ist der Vater Mensch geworden, sondern der Sohn. Die Wahrheit soll frei herausgesagt werden. Nicht der Vater hat für uns gelitten, sondern der Vater hat den gesandt, der für uns gelitten hat. Nie wollen wir behaupten: „Es war einmal, da war der Sohn nicht“; aber wir wollen auch keine Sohn-Vaterschaft annehmen. Laßt uns vielmehr auf dem königlichen Wege wandeln, ohne nach links oder rechts abzuweichen! Wir wollen nicht in der Absicht, den Sohn zu ehren, diesen Vater nennen; wir wollen aber auch nicht in der Absicht, den Vater zu ehren, den Sohn nur für ein Geschöpf halten. Der eine Vater soll durch den einen Sohn angebetet werden, nicht darf die Anbetung geteilt werden.* Ein* Sohn soll verkündet werden, der vor der Zeit zur Rechten des Vaters sitzt, und der das Sitzen zu seiner Seite nicht erst allmählich, in der Zeit, nach seinem Leiden, erhalten hat, sondern ewig besitzt.</p><p>[Forts. v. ] „Wer den Sohn gesehen hat, hat den Vater gesehen“; denn in allem ist der Sohn dem Erzeuger ähnlich. Leben wurde aus dem Leben, Licht aus dem Lichte, Kraft aus der Kraft, Gott aus Gott erzeugt. Die göttlichen Eigenschaften sind im Sohne unveränderlich. Wer gewürdigt wurde, die Gottheit des Sohnes zu schauen, gelangt zum Genusse seines Erzeugers. Nicht meine Lehre ist es, sondern die Lehre des eingeborenen Sohnes: „So lange bin ich bei euch, und nicht hast du mich erkannt, Philippus; wer mich gesehen hat, hat den Vater gesehen“. Um es kurz zu sagen, wir wollen Vater und Sohn weder trennen noch vermengen. Nie darfst du sagen, der Sohn sei dem Vater fremd, noch darfst du dich denen anschließen, welche lehren, der Vater sei bald Vater, bald Sohn. Das sind fremde und gottlose und keine kirchliche Lehren. Der Vater, der den Sohn erzeugt hat, blieb Vater, und nicht hat er sich geändert. Er hat die Weisheit geboren, ohne jedoch unweise zu werden. Er hat die Kraft geboren, ohne an Kraft zu verlieren. Er hat Gott geboren, ohne der Gottheit beraubt zu werden. Weder hat er selbst durch Verminderung oder Veränderung etwas verloren noch leidet der Erzeugte an irgend etwas Mangel. Vollkommen ist der Erzeuger, vollkommen der Erzeugte. Gott ist der Erzeuger, Gott der Erzeugte. Dieser ist der Gott aller, bezeichnet aber als seinen Gott den Vater; denn nicht schämt er sich zu sagen: „Ich gehe hinauf zu meinem Vater und zu eurem Vater, zu meinem Gott und zu eurem Gott“.</p><p>Damit du nicht glaubst, Gott sei in gleicher Weise Vater des Sohnes, wie er Vater der Geschöpfe ist, damit die Geschöpfe nicht mit dem Eingeborenen gleichgesetzt werden, sagte er nicht: „Ich gehe hinauf zu* unserem* Vater“, sondern: „zu meinem Vater und eurem Vater“. „Mein Vater“ ist er der Natur nach, „euer Vater“ dagegen ist er auf Grund der Adoption. Ferner sagte er: „zu meinem Gott und eurem Gott“. Auf andere Weise ist er „mein“, d. i. des wahren und eingeborenen Sohnes Gott; auf andere Weise ist er „euer“, d. i. der Geschöpfe Gott. Wahrer Gott ist also der Sohn Gottes, vor aller Zeit in unbeschreiblicher Weise erzeugt. Öfter sage ich zu euch dasselbe, damit es sich eurem Geiste einpräge. Glaube, daß Gott einen Sohn hat! Auf welche Weise, darnach forsche nicht vorwitzig! Magst du auch nachforschen, du kommst doch zu keinem Resultate. Erhebe dich nicht selbst, damit du nicht fallest! „Was dir befohlen ist, an das allein sollst du denken!“ Sage mir vorerst wer der ist, welcher erzeugt hat, dann lerne kennen, was er erzeugt hat! Wenn du die Natur des Erzeugers nicht erfassen kannst, dann grüble nicht nach der Art des Erzeugten!</p><p>Der Gottesfürchtige braucht nur, wie wir gesagt haben, zu wissen, daß Gott einen einzigen Sohn hat, einen einzigen, den er auf natürliche Weise erzeugt hat, dessen Sein nicht erst bei der Geburt zu Bethlehem begann, sondern der vor aller Zeit ist. Höre auf das Wort des Propheten Michäas: „Du Bethlehem, Haus von Ephrata, bist doch nicht etwa zu gering, um zu den Tausendschaften Judas gerechnet zu werden; denn aus dir wird mir hervorgehen der Führer, der mein Volk Israel weiden wird, und sein Ausgang ist von Anfang an, von den Tagen der Ewigkeit“. Achte also nicht auf seine zeitliche Geburt in Bethlehem, bete vielmehr den an, welcher ewig aus dem Vater erzeugt worden ist! Höre nicht, wenn jemand von einem zeitlichen Ursprung des Sohnes spricht, sondern erkenne es: der Vater ist sein zeitloser Anfang! Der zeitlose, unfaßbare, ursprungslose Ursprung des Sohnes ist der Vater. Die Quelle des Gerechtigkeitsstromes, des Eingeborenen, ist der Vater, welcher ihn in einer Weise erzeugt hat, die ihm allein bekannt ist. Willst du es wissen, daß unser Herr Jesus Christus ein ewiger König ist? Höre wiederum auf sein Wort: „Abraham, euer Vater, freute sich, meinen Tag zu sehen; er sah ihn und freute sich“. Hierauf, als die Juden dieses Wort hart fanden, sagt er das für sie noch härtere Wort: „Ehe Abraham war, bin ich“. Und wiederum spricht er zum Vater: „Und nun verherrliche mich, o Vater, bei dir mit der Herrlichkeit, welche ich bei dir hatte, ehe die Welt war!“ Deutlich hat er es gesagt: „Ehe die Welt war, hatte ich bei dir die Herrlichkeit“. Wenn er an anderer Stelle erklärt: „Du hast mich geliebt vor Grundlegung der Welt“, sagt er deutlich: „Ewig habe ich die Herrlichkeit bei dir“.</p><p>[Forts. v. ] Wir glauben also an* einen* Herrn Jesus Christus, den eingeborenen Sohn Gottes, den aus dem Vater erzeugten wahren Gott, der vor aller Zeit ist, und durch den alles erschaffen wurde. „Seien es Throne, seien es Herrschaften, seien es Mächte, seien es Kräfte: alles ist durch ihn gemacht worden.“ Und nichts von dem, was erschaffen wurde, entzieht sich seiner Herrschaft. Verstummen möge jede Häresie, welche verschiedene Urheber und Schöpfer der Welt einführt! Verstummen soll die Zunge, welche Christum, den Sohn Gottes, lästert! Verstummen sollen die, welche die Sonne für Christus halten! Christus ist der Schöpfer der Sonne, nicht ist er die Sonne, die du siehst. Verstummen sollen die, welche die Welt als Werk der Engel erklären und den Eingeborenen seiner Würde berauben wollen! Sowohl das Sichtbare wie das Unsichtbare, seien es Throne, seien es Herrschaften, mögen sie diesen oder jenen Namen tragen: alles ist durch Christus gemacht worden. Er ist der König seiner Geschöpfe. Nicht hat er fremdes Gut geraubt und an sich gerissen, sondern er herrscht über seine eigenen Werke, wie der Evangelist Johannes gesagt hat: „Alles ist durch ihn gemacht worden, und ohne ihn ist nichts geworden“. Durch ihn ist alles gemacht worden, da der Vater durch den Sohn wirkt.</p><p>Ich will zum Verständnis des Gesagten ein Gleichnis geben; ich weiß zwar wohl, daß der Vergleich hinkt. Wie sollte nämlich in der sichtbaren Welt etwas mit der göttlichen, unsichtbaren Kraft genau verglichen werden können? Doch mag der Vergleich auch schwach sein: von Schwachen sei er zu Schwachen gesprochen! Gleichwie ein König, der eine Stadt bauen will, den Plan der Stadt seinem mitregierenden Sohne vorlegt, dieser aber, wenn er den Plan erhalten hat, das Projekt ausführt, so hat, als der Vater das Weltall erschaffen wollte, der Sohn nach dem Plane des Vaters alles gemacht: zeugt auch der Plan für die Oberherrlichkeit des Vaters, so sollte doch der Sohn der Herr seiner eigenen Geschöpfe sein. Einerseits sollte der Vater nicht der Herrschaft über seine eigenen Geschöpfe beraubt werden, andererseits sollte der Sohn nicht über fremde, sondern eigene Geschöpfe regieren. Denn, wie gesagt, haben nicht Engel die Welt erschaffen, sondern der eingeborene Sohn, der, wie gesagt, vor aller Zeit erzeugt worden ist. Durch ihn ist alles geworden, und nichts steht außer seinem Wirkungskreise. Soviel sei euch einstweilen mit der Gnade Christi gesagt.</p><p>Kehren wir zum Glaubensbekenntnis zurück und beschließen jetzt die Lehre! Christus hat alles erschaffen, magst du Engel oder Erzengel oder Herrschaften oder Throne nennen. Nicht als ob dem Vater die Kraft gefehlt hätte, selbst zu erschaffene, sondern er wollte, daß der Sohn über seine eigenen Geschöpfe herrsche. Zum Schöpfungswerk gab der Vater dem Sohn die Anleitung. Aus Ehrfurcht vor seinem eigenen Vater erklärt der Eingeborene: „Der Sohn kann nichts aus sich selbst tun, außer er sieht es den Vater tun; was dieser tut, tut in gleicher Weise auch der Sohn“. An anderer Stelle sagt er: „Mein Vater wirkt bis jetzt, auch ich wirke“. Unter den Wirkenden besteht kein Gegensatz; „denn alles Meinige ist dein, und das Deinige ist mein“, sagt der Herr in den Evangelien. Daß Christus der Schöpfer ist, ist klar aus dem Alten und Neuen Testament zu erkennen. Der, welcher erklärte: „Laßt uns den Menschen machen nach unserem Bilde und Gleichnisse!“, sprach offenbar zu jemandem, der bei ihm war. Am allerdeutlichsten hat die Lehre der Psalmist ausgesprochen: „Er sprach, und sie sind geworden; er befahl, und sie wurden erschaffen“; der Vater nämlich befahl und sprach, der Sohn aber machte alles nach dem Willen des Vaters. Job sprach das bedeutungsvolle Wort: „Er allein hat den Himmel ausgebreitet und wandelt auf dem Meere wie auf festem Boden“; den Verständigen ist damit gesagt: der, welcher während seines Erdenlebens auf dem Meere wandelte, war derselbe wie der, welcher ehedem die Himmel gebildet hatte. Wiederum spricht der Herr: „Hast du aus Lehm ein lebendes Wesen gebildet, es mit Sprache ausgestattet und auf die Erde gesetzt?“ und hierauf: „Öffnen sich dir aus Furcht die Tore des Todes? Fürchten sich die Torwächter der Unterwelt bei deinem Anblick?“ Damit gibt er zu erkennen: der, welcher aus Liebe zu den Menschen in die Unterwelt hinabstieg, ist derselbe, welcher zu Anbeginn den Menschen aus Lehm gebildet hatte.</p><p>Christus, der eingeborene Sohn Gottes, ist also auch der Schöpfer der Welt. „Er war nämlich in der Welt, und die Welt ist durch ihn gemacht worden“ und „er kam in sein Eigentum“, wie uns das Evangelium lehrt. Nicht nur ist Christus nach dem Willen des Vaters der Schöpfer der sichtbaren Welt, sondern auch der unsichtbaren. „In ihm wurde nämlich“ — so lehrt der Apostel — „alles erschaffen, was im Himmel und auf Erden ist, das Sichtbare und das Unsichtbare, seien es Throne oder Herrschaften oder Mächte oder Kräfte. Alles wurde durch ihn und für ihn erschaffen. Und er ist vor allem, und alles besteht in ihm.“ Und wenn du auf die Zeit selbst hinweisest: auch sie ist von Jesus Christus nach dem Willen des Vaters erschaffen. „In diesen letzten Tagen nämlich sprach er zu uns durch den Sohn, den er zum Erben des Weltalls gemacht hat, durch den er auch die Zeiten erschaffen hat.“ Ihm sei Herrlichkeit, Ehre, Macht mit dem Vater und dem Hl. Geiste jetzt und immer und in alle Ewigkeit. Amen.XII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort: „der Fleisch angenommen hat und Mensch geworden ist.“</p><h2>13</h2><p>* Über das Wort: „der Fleisch angenommen hat und Mensch geworden ist.“*</p><p>Als Zöglinge der Keuschheit und Schüler der Reinheit wollen wir den aus der Jungfrau geborenen Gott mit keuschen Lippen preisen. Da wir gewürdigt werden, das Fleisch des geistigen Lammes zu empfangen, so wollen wir sowohl das Haupt wie die Füße genießen; unter dem Haupte verstehen wir nämlich die Gottheit, unter den Füßen die Menschheit. Als Hörer der heiligen Evangelien lasset uns dem Theologen Johannes Glauben schenken! Er erklärte nämlich: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“ und fügte bei: „und das Wort ist Fleisch geworden“. Nicht ist es recht, einen bloßen Menschen anzubeten, aber es frommt auch nicht, Gott zu nennen, ohne seiner Menschheit zu gedenken. Wenn Christus, der doch tatsächlich Gott ist, nicht die menschliche Natur angenommen hätte, wären wir rettungslos verloren. Als Gott verdient er Anbetung, aber auch an seine Menschwerdung muß man glauben. Es hat keinen Wert, von seiner Menschheit zu sprechen, wenn man von seiner Gottheit schweigt, noch bringt es Nutzen, wenn man nicht mit der Gottheit zugleich auch der Menschheit gedenkt. Bekennen wir: Der König und Arzt ist erschienen! Da der König Jesus heilen wollte, umgürtete er sich mit der Schürze der Menschheit und heilte, was krank war. Der treffliche Lehrer der Kinder wurde ein Kind mit den Kindern, um den Unwissenden Weisheit zu geben. Das himmlische Brot stieg auf die Erde, um die Hungernden zu nähren.</p><p>[Forts. v. ] Die Juden aber verwerfen den, der erschienen ist; sie warten auf den, der zu ihrem Unglück kommen wird. Den wahren Christus wiesen sie zurück, den Betrug aber nehmen sie, die Betrogenen, auf. Auch hierin bestätigt sich das Wort des Erlösers: „Ich bin gekommen im Namen meines Vaters, und ihr nehmt mich nicht an. Wenn aber ein anderer in seinem eigenen Namen kommt, dann werdet ihr diesen aufnehmen“. Es ist gut, den Juden die Frage vorzulegen: Wenn der Prophet Isaias sagt: „Der Emanuel wird aus einer Jungfrau geboren werden“, spricht er da die Wahrheit oder lügt er? Würden sie ihn der Lüge bezichtigen, so wäre es keineswegs zu verwundern. Sie pflegen ja die Propheten nicht nur als Lügner zu schelten, sondern auch zu steinigen. Wenn aber der Prophet die Wahrheit spricht, dann zeiget uns den Emanuel! Wird der, der kommen soll und auf den ihr wartet, aus einer Jungfrau geboren oder nicht? Wird er nicht aus einer Jungfrau geboren, dann beschuldigt ihr den Propheten der Lüge. Wenn ihr aber diese Geburt in der Zukunft erwartet, warum nehmt ihr sie, wenn sie bereits erfolgt ist, nicht an?</p><p>Die Juden sollen, da sie es so wollen, ihre Irrwege gehen! Die Kirche Gottes aber werde verherrlicht! Wir nehmen nämlich an, daß der Gott Logos wahrhaft Mensch geworden ist nicht durch den Willen eines Mannes und Weibes, wie die Häretiker lehren; wir glauben vielmehr gemäß dem Evangelium, daß er aus einer Jungfrau und dem Hl. Geiste Mensch geworden ist, nicht zum Scheine, sondern in der Wahrheit. Dafür, daß er aus einer Jungfrau wahrhaft Mensch geworden ist, wirst du den Beweis noch erhalten, du brauchst nur die Zeit des Unterrichtes jetzt abzuwarten.</p><p>Vielfältig ist der Irrtum der Häretiker. Die einen haben glattweg seine Geburt aus einer Jungfrau geleugnet. Andere haben zwar seine Geburt zugegeben, aber erklärt, er sei nicht aus einer Jungfrau, sondern aus einem Weibe, dem ein Mann beigewohnt habe, geboren. Wieder andere behaupteten, nicht Christus, der Gott, sei Mensch geworden, sondern ein Mensch sei zu Gott geworden; kühn stellten sie die Lehre auf: nicht der präexistierende Logos ist Mensch geworden, sondern ein Mensch ist für sein Vorwärtsstreben gekrönt worden.</p><p>[Forts. v. ] Denke an das, was gestern über die Gottheit gesagt worden ist! Glaube es: es ist eben jener eingeborene Sohn Gottes, welcher aus einer Jungfrau geboren worden ist. Halte dich an das Wort des Evangelisten Johannes: „Und das Wort ist Fleisch geworden und hat unter uns gewohnt“! Der ewige Logos, der vor aller Zeit aus dem Vater erzeugt worden ist, hat vor nicht langer Zeit unsertwegen Fleisch angenommen. Allerdings wenden viele ein: „Was hätte Gott veranlassen können, zur Menschheit herabzusteigen? Und ist es Gott bei seiner Natur überhaupt möglich, unter Menschen zu wohnen? Und ist es möglich, daß eine Jungfrau ohne Mann gebären kann?“ Da die Einwände viel und die Angriffe zahlreich sind, so wollen wir mit Hilfe der Gnade Christi und vertrauend auf das Gebet der Anwesenden Punkt für Punkt klarlegen.</p><p>Zuerst wollen wir die Frage untersuchen: Weshalb ist Jesus auf die Erde herabgestiegen? Achte nicht auf Gründe, welche mein eigener Verstand ersinnt! Denn dadurch könntest du unter Umständen betrogen werden. Wenn du nicht Punkt für Punkt ein Prophetenzeugnis erhältst, dann glaube nicht den Worten! Wenn die göttlichen Schriften dich nicht über die Jungfrau, den Ort, die Zeit, die Art (der Geburt Jesu) belehren, dann nimm ein menschliches Zeugnis nicht an! Gegen einen anwesenden Lehrer mag man argwöhnisch sein, wer aber sollte, wenn er noch Verstand hat, es sein gegen einen Propheten, der vor tausend und mehr Jahren gesprochen hat?</p><p>Willst du nun nach dem Grunde für die Menschwerdung Christi forschen, dann greife zurück zum ersten Buch der Schrift! In sechs Tagen hat Gott die Welt erschaffen, die Welt aber ist geworden des Menschen wegen. Die Sonne, leuchtend in glänzendsten Strahlen, wurde erschaffen, um uns zu scheinen. Alle Tiere wurden ins Leben gerufen, um uns zu dienen. Pflanzen und Bäume wurden erschaffen zu unserem Nutzen. Herrlich sind alle Geschöpfe, doch keines von ihnen ist ein Ebenbild Gottes, der Mensch allein ausgenommen. Die Sonne wurde durch das bloße Wort, der Mensch aber wurde gebildet von den Händen Gottes: „Lasset uns den Menschen machen nach unserem Bild und Gleichnis!“ Man ehrt das hölzerne Bild eines irdischen Königs; um wieviel mehr verdient das geistige Abbild Gottes Ehre? Doch des Teufels Neid hat dieses größte Geschöpf, da es im Paradiese lustwandelte, aus demselben vertrieben. Der Feind freute sich über den Fall dessen, den er beneidet hatte. Hättest du nun dem Feinde dauernd Freude gewünscht? Da der Teufel es nicht gewagt hatte, an den Mann heranzutreten wegen seiner Stärke, so machte er sich an das schwächere Weib, das noch eine Jungfrau war; denn erst nach der Vertreibung aus dem Paradiese erkannte Adam Eva, sein Weib.</p><p>Im Menschengeschlechte folgen an zweiter Stelle Kain und Abel; Kain war der erste Mörder. Später brach die Sintflut herein wegen der vielen Sünden der Menschen. Feuer kam vom Himmel auf die Bewohner von Sodoma wegen ihrer Frevel. Später hatte Gott sich Israel erwählt, aber auch Israel wurde verdorben: das auserwählte Geschlecht wurde verwundet. Denn während Moses auf dem Berge vor Gott stand, betete das Volk ein Kalb statt Gott an. Zur Zeit des Gesetzgebers Moses, der doch gesagt hatte: „Du sollst nicht ehebrechen“, erfrechte sich ein Mann, an einer Stätte des Lasters Unzucht zu treiben. Nach Moses waren die Propheten gesandt worden, Israel zu heilen. Heilen wollten sie, wurden aber dem Leiden nicht Herr, so daß sie klagten und einer von ihnen sagte: „Wehe, kein Frommer findet sich mehr auf Erden, und kein Gerechter ist unter den Menschen“, und wieder ein anderer: „Alle sind abgefallen, zusammen sind sie unnütz geworden, keiner, auch kein einziger ist, der das Gerechte täte“, und wiederum: „Fluch, Diebstahl, Ehebruch, Mord ist über die Erde ausgegossen“. „Ihre Söhne und ihre Töchter opferten sie den Dämonen.“ Sie fragten nach dem Vogelflug, trieben Zauberei und glaubten an Vorzeichen. An anderer Stelle heißt es: „Ihre Kleider banden sie mit Stricken zusammen und machten daraus Vorhänge für den Altar“.</p><p>[Forts. v. ] Gar groß war die Wunde des Menschengeschlechtes. Von der Sohle bis zum Scheitel war keine gesunde Stelle an ihm. Kein Pflaster, kein Öl, keine Binden konnten angewendet werden. Da weinten die Propheten, härmten sich ab und sagten: „Wer wird aus Sion Rettung bringen?“, und wiederum: „Deine Hand sei über dem Manne deiner Rechten und über dem Menschensohne, den du dir gekräftigt hast! Nicht wollen wir von dir lassen!“ Ein anderer Prophet flehte: „Herr, neige die Himmel und komme herab!“ Die Wunden der Menschheit waren zu groß, als daß wir sie hätten heilen können. Deine Propheten haben sie getötet, deine Altäre niedergerissen. Wir können die Sünde nicht wieder gut machen, du mußt heilen.</p><p>Der Herr erhörte das Gebet der Propheten. Nicht vergaß der Vater unser Geschlecht in seiner Erniedrigung. Er sandte seinen Sohn, unseren Herrn, vom Himmel als Arzt. Einer der Propheten sagt es: „Der Herr, den ihr sucht, kommt, und plötzlich wird er da sein“. Wo? „Der Herr wird kommen in seinen Tempel“, wo ihr ihn gesteinigt habt. Als ein anderer Prophet davon hörte, da sprach er zu ihm: „Der du von göttlicher Erlösung sprichst, redest du in der Stille? Der du die frohe Botschaft bringst, Gott erscheine, um zu erlösen, redest du im Verborgenen? Steige auf hohen Berg, du Freudenbote Sions, und sage zu den Städten Judas!“ Was soll ich sagen? „Siehe, unser Gott, siehe, der Herr kommt mit Macht!“ Der Herr selbst wiederum hat gesagt: „Siehe, ich komme und werde in deiner Mitte mein Zelt aufschlagen, spricht der Herr, und viele Heiden werden zum Herrn ihre Zuflucht nehmen“. Die Israeliten haben meine Erlösung zurückgewiesen. „Ich komme, alle Völker und Zungen zu versammeln.“ „Er kam in sein Eigentum, und die Seinigen nahmen ihn nicht auf.“ Du kommst, und was schenkst du den Heiden? „Ich komme, alle Völker zu sammeln, und unter ihnen ein Zeichen aufzustellen.“ Von meinem Kampfe am Kreuze werde ich jedem meiner Soldaten ein königliches Zeichen auf die Stirne geben. Ein anderer Prophet sagte: „Er neigte die Himmel und stieg herab, und Finsternis war unter seinen Füßen“; verborgen blieb nämlich den Menschen seine Herabkunft vom Himmel.</p><p>Als Salomon diese Worte seines Vaters David hörte, stellte er im Hinblick auf den, welcher in den von ihm erbauten wunderbaren Tempel einziehen sollte, erstaunt die Frage: „Wird Gott wirklich auf Erden unter Menschen wohnen?“ In dem Salomon zugeschriebenen Psalme gibt David im voraus die Antwort: „Ja, er wird heruntersteigen wie der Regen auf das Fließ“. Mit Regen ist auf seine himmlische Natur, mit Fließ auf seine Menschheit hingewiesen. Der Regen, der auf das Fließ fällt, steigt still herab. Unbekannt war auch das Geheimnis der Geburt, so daß die Magier fragten: „Wo ist der König der Juden geboren?“ und Herodes erschrocken nach seiner Geburt forschte und sprach: „Wo wird Christus geboren?“</p><p>[Forts. v. ] Doch wer ist der, welcher da herabsteigt? Der Psalmist fährt fort: „Er wird bleiben mit der Sonne und angesichts des Mondes von Geschlecht zu Geschlecht“. Und ein anderer Prophet wiederum erklärt: „Freue dich sehr, Tochter Sion! Verkünde es, Tochter Jerusalem! Siehe, dein König kommt zu dir gerecht und als Erlöser!“ Da es viele Könige gibt, so sage uns, o Prophet: Von welchem sprichst du? Weise auf ein Merkmal hin, das andere Könige nicht haben! Sagst du, der König trage einen Purpur: schon andere haben diese äußere Auszeichnung getragen. Behauptest du, er sei von Soldaten begleitet und sitze auf vergoldetem Wagen: auch bei anderen Königen war das schon der Fall. Gib uns ein Merkmal, das speziell den König charakterisiert, dessen Ankunft du verkündest! Der Prophet antwortet: „Siehe, dein König kommt zu dir gerecht und als Erlöser. Er ist sanftmütig und sitzt auf einem Lasttier und einem jungen Füllen“, nicht auf einem Wagen. Damit hast du ein charakteristisches Merkmal des erschienenen Königs. Von den Königen saß nur Jesus auf einem unbesattelten Jungtier, und zwar, als er unter Jubelrufen als König in Jerusalem einzog. Und was tut dieser König nach seiner Ankunft? „Aus wasserloser Zisterne hast du deine Gefangenen erlöst im Blute des Bundes“.</p><p>Kann sein, daß er auf einem Füllen saß. Aber gib uns doch noch ein anderes Erkennungszeichen! Von wo aus will der König seinen Einzug halten? Zeige eine Stelle nicht fern von der Stadt, damit wir sie sehen können! Gib uns einen Punkt in der Nähe an, den wir mit den Augen erreichen können! Wir möchten den Ort, auch wenn wir in der Stadt uns aufhalten, schauen können. Der Prophet antwortet: „Seine Füße werden an jenem Tage auf dem Ölberg, Jerusalem gegenüber, östlich davon, stehen“. Sieht nicht auch der, welcher in der Stadt ist, den Ort?</p><p>[Forts. v. ] Wir haben zwei Erkennungszeichen, noch ein drittes möchten wir wissen. Sage, was tut der Herr nach seiner Ankunft? Ein anderer Prophet erklärt: „Siehe, unser Gott..... er selbst wird kommen und uns erlösen. Dann werden die Augen der Blinden geöffnet werden und die Ohren der Tauben hören. Dann wird der Lahme springen wie ein Hirsch und die Zunge der Stummen gelöst werden“. Hören wir noch ein anderes Zeugnis! Du sagst, o Prophet, daß der Herr bei seiner Ankunft Zeichen gebe, wie sie noch nie gegeben worden seien. Was für ein deutliches Zeichen meinst du noch? „Der Herr selbst wird zum Gerichte kommen mit den Ältesten des Volkes und mit seinen Führern.“ Ein vorzügliches Merkmal! Der Herr wird von den ihm untergebenen Ältesten gerichtet und duldet es.</p><p>Wenn die Juden solches lesen, verstehen sie es nicht. Sie haben die Ohren ihres Herzens verstopft, um nicht zu hören. Wir jedoch wollen glauben an Jesus Christus, der im Fleisch erschienen und Mensch geworden ist, da wir ihn sonst nicht begriffen hätten. Weil wir ihn nämlich so, wie er war, nicht hätten schauen oder genießen können, ist er geworden wie wir, damit wir auf solche Weise das Glück haben, ihn zu genießen. Wenn wir die Sonne, die erst am vierten Tage erschaffen worden war, nicht völlig schauen können, hätten wir dann Gott, den Schöpfer der Sonne, sehen können? Im Feuer kam der Herr auf den Berg Sinai herab, und das Volk konnte ihn nicht ertragen, sondern sprach zu Moses: „Sprich du zu uns, und wir werden hören! Nicht spreche Gott zu uns, damit wir nicht sterben!“ An anderer Stelle heißt es: „Wer ist es aus allem Fleisch, der die Stimme des lebendigen, aus dem Feuer sprechenden Gottes gehört hätte und noch lebte?“ Wenn das Hören der Stimme des lebendigen Gottes den Tod verursacht, sollte dann das Schauen Gottes nicht den Tod bringen? Wunderst du dich? Selbst Moses sagt: „Ich fürchte mich und zittere“.</p><p>Was hättest du gewollt? Hätte der, welcher kam, um zu erlösen, den Menschen deshalb, weil sie ihn nicht ertragen konnten, Verderben bringen sollen, oder sollte er gnädig sich uns anpassen? Daniel konnte den Anblick eines Engels nicht ertragen, und du wolltest den Anblick des Herrn der Engel aushalten? Gabriel erschien, und Daniel fiel zu Boden. Wie war jener bei seiner Erscheinung, welche Gestalt hatte er? „Sein Gesicht war wie der Blitz“, nicht wie die Sonne. „Seine Augen waren wie Feuerflammen“, nicht wie ein feuriger Ofen. „Und der Schall seiner Worte wie die Stimme einer Menschenmenge“, nicht wie die Stimmen von zwölf Legionen Engeln. Und trotzdem fiel der Prophet nieder. Und der Engel tritt zu ihm und spricht: „Fürchte dich nicht, Daniel, stehe auf! Fasse Mut, deine Worte sind erhört!“ Daniel erklärt: „Ich stand zitternd auf“. Aber er gab erst Antwort, als ihn etwas wie eine Menschenhand ergriffen hatte. Erst als die Erscheinung die Gestalt eines Menschen angenommen hatte, sprach Daniel. Und was sagt er? „Herr, bei deiner Erscheinung wandte sich mein Innerstes in mir, keine Kraft war in mir, und in mir schwand der Atem.“ Wenn die Erscheinung eines Engels dem Propheten Stimme und Kraft raubte, hätte die Erscheinung Gottes dir noch den Atem gelassen? Erst — sagt die Schrift — „als mich eine menschliche Erscheinung berührte“, bekam Daniel Mut. Nachdem sich unsere Schwachheit bestätigt hatte, nahm der Herr die Gestalt an, die der Mensch verlangte. Da der Mensch auf jemanden hören wollte, der seiner Natur ähnlich war, nahm der Erlöser eine ähnliche Natur an, damit sich die Menschen umso lieber belehren lassen.</p><p>Noch einen anderen Grund sollst du wissen. Christus ist gekommen, um getauft zu werden und die Taufe zu heiligen. Er ist gekommen, um Wunder zu wirken, auf den Wassern des Meeres zu wandeln. Vor seiner Menschwerdung „sah ihn das Meer und floh, und der Jordan wich zurück“; darum nahm der Herr Fleisch an, damit das Meer ihn sehe und trage und der Jordan ohne Schrecken ihn aufnehme. Das ist ein Grund, es gibt aber noch einen anderen. Da durch eine Jungfrau, die Eva, der Tod kam, sollte auch durch eine Jungfrau bzw. aus einer Jungfrau das Leben erscheinen. Während jene von einer Schlange betrogen wurde, sollte diese von Gabriel die frohe Botschaft erhalten. Nachdem die Menschen Gott verlassen hatten, machten sie sich geschnitzte Menschengestalten. Da sie sich betrogen durch göttliche Verehrung von Menschengestalten, wurde Gott, um dem Betrug ein Ende zu machen, wahrhaft Mensch. Der Teufel bediente sich des Fleisches als Waffe im Kampfe gegen uns, weshalb Paulus sagt: „Ich sehe ein anderes Gesetz in meinen Gliedern, welches kämpft wider das Gesetz meines Geistes und mich gefangen hält usw.“. Durch die gleichen Waffen nun, mit welchen uns der Teufel bekämpfte, wurden wir erlöst. Der Herr nahm etwas von uns an, um die Menschheit zu befreien. Von uns nahm er etwas an, damit er dem, der Mangel leidet, um so größere Gnade schenke, damit die sündhafte Menschheit an Gott teilhabe. „Denn wo die Sünde mächtig wurde, strömte die Gnade über.“ Der Herr mußte für uns leiden; doch hätte der Teufel, wenn er ihn gekannt hätte, es nicht gewagt, sich an ihn heranzumachen. „Denn wenn sie ihn gekannt hätten, hätten sie nicht den Herrn der Herrlichkeit gekreuzigt.“ Sein Leib ist eine Lockspeise des Todes geworden; aber der Drache, der die Hoffnung hatte, ihn zu verschlingen, sollte sogar diejenigen, welche er bereits verschlungen hatte, wieder ausspeien. „Denn der mächtige Tod hatte sie verschlungen“, und wiederum heißt es: „Gott trocknete ab von jedem Angesicht jede Träne“.</p><p>[Forts. v. ] Ist Christus etwa ohne Grund Mensch geworden? Sind etwa unsere Lehren menschliche Erfindung und Weisheit? Sind nicht die göttlichen Schriften, die Prophezeiungen der Propheten unser Heil? Bewahre unerschütterlich diese Hinterlage! Niemand soll dich davon abbringen! Glaube es: Gott ist Mensch geworden?</p><p>Die Möglichkeit der Menschwerdung ist dargetan. Wenn aber die Juden immer noch ungläubig sind, wollen wir ihnen die Frage vorhalten: Verkünden wir, wenn wir von einer Menschwerdung Gottes sprechen, etwas Unerhörtes, nachdem doch ihr lehret, daß Abraham den Herrn bewirtet habe? Verkünden wir noch etwas Unerhörtes, nachdem Jakob erklärt hatte: „Ich habe nämlich Gott gesehen von Angesicht zu Angesicht, und ich kam mit dem Leben davon“? Der Herr, welcher bei Abraham gegessen hatte, er aß auch bei uns. Was verkünden wir also Neues? Doch wir verweisen noch auf zwei weitere Zeugen; sie standen auf dem Berge Sinai bei dem Herrn. Moses war in der Höhle des Felsen, auch Elias war seinerseits in der Höhle des Felsen. Beide waren dabei, als Jesus auf dem Berge Tabor verwandelt wurde, und sprachen zu den Jüngern von dem Ende, das ihm in Jerusalem bevorstand. Doch die Möglichkeit seiner Menschwerdung ist, wie gesagt, dargetan. Wer Eifer dazu hat, möge noch weitere Beweise sammeln!</p><p>Wir haben versprochen, von Zeit und Ort der Ankunft des Erlösers zu sprechen. Man soll uns nicht, wenn wir weggehen, den Vorwurf machen, wir haben unser Versprechen nicht gehalten. Vielmehr ist es Pflicht, die Neulinge der Kirche nicht zu entlassen, ohne sie gestärkt zu haben.</p><p>Fragen wir also nach der Zeit, da der Herr erschienen ist; denn trotzdem die Erscheinung vor nicht langer Zeit erfolgte, wird sie bestritten, auch (wird eingewandt): „Christus Jesus gestern und heute, derselbe auch in Ewigkeit“. Der Prophet Moses erklärt nun: „Gott, der Herr, wird uns einen Propheten, wie ich bin, aus euren Brüdern erwecken“. Merken wir uns vorderhand das Wörtchen „wie ich bin“; es wird an seiner Stelle erklärt werden. Doch wann kommt dieser erwartete Prophet? Greife zurück — antwortet er — zu dem, was ich geschrieben habe, und untersuche die Prophezeiung, welche Jakob dem Juda gegeben hat: „Juda, dich mögen deine Brüder loben usw.“ — um nicht die Stelle ganz zu zitieren. „Nicht wird mangeln ein Fürst aus Juda noch ein Führer aus seinen Lenden, bis der kommt, dem es aufbewahrt ist, und er ist die Erwartung — nicht der Juden, sondern ― der Heiden.“ Mit dem Aufhören der jüdischen Herrschaft war die Ankunft Christi angedeutet. Stünden sie jetzt nicht unter der Herrschaft der Römer, dann wäre Christus noch nicht erschienen. Wenn sie noch Führer aus dem Stamme Juda und David hätten, dann wäre der Erwartete noch nicht gekommen. Von der jüngsten Geschichte ihrer jetzigen sogenannten Patriarchen, ihrem Stamme, ihrer Mutter würde ich mich schämen zu reden. Ich überlasse es denen, die davon wissen. Doch woran ist der, welcher als „die Erwartung der Heiden“ kommt, zu erkennen? Es heißt weiter: „Er bindet sein Füllen an einen Weinstock“. Erkennst du jenes Füllen, welches Zacharias deutlich vorherverkündet hatte?</p><p>[Forts. v. ] Doch du willst noch ein anderes Zeugnis für die Zeit (der Menschwerdung Jesu). „Der Herr sprach zu mir: Mein Sohn bist du; heute habe ich dich erzeugt“, und gleich darauf heißt es: „Du wirst sie weiden mit eiserner Rute“. Bereits früher habe ich erklärt, daß deutlich die Herrschaft der Römer als eiserne Rute bezeichnet werde. Bedenken wir noch, was Daniel zudem von diesem Reiche zu berichten weiß! Als er dem Nabuchodonosor die Bildsäule beschrieb und erklärte, erzählte er die ganze Erscheinung, welche jener hierüber gehabt hatte: ein Stein, der sich ohne menschliches Zutun von einem Berge losgelöst hatte und der nicht von Menschen aufgestellt war, werde die Herrschaft über den ganzen Erdkreis erhalten. Deutlich genug erklärt er: „In den Tagen jener Könige wird der Gott des Himmels ein Reich errichten, welches in Ewigkeit nicht zugrunde gehen wird, und nicht wird sein Reich einem anderen Volke überlassen werden“.</p><p>Doch wir wollen eine noch deutlichere Angabe für die Zeit der Menschwerdung. Da der Mensch sich nur schwer zum Glauben versteht, so glaubt er dem Gesagten nur, wenn man ihm die Jahre selbst genau vorrechnet. Welches sind nun die Verhältnisse, welches ist die Zeit (der Menschwerdung)? Es ist die Zeit, da es keinen König mehr aus Juda gibt und da Herodes, ein Fremdling, regiert. Der Engel, welcher zu Daniel spricht, gibt die Andeutung. Merke dir nun, was ich dir sage! „Du sollst wissen und verstehen: vom Erlassen des Wortes, daß Antwort gegeben und Jerusalem aufgebaut werden solle, bis auf Christus, den Führer, werden sieben Wochen und zweiundsechzig Wochen sein.“ 69 Jahreswochen machen nun 483 Jahre. Der Engel behauptete also, daß, wenn Jerusalem erbaut ist, die 483 Jahre abgelaufen sind und es keine eigenen Fürsten mehr gibt, alsdann ein fremder König komme und unter ihm Christus geboren werde. Darius, der Meder, nun baute Jerusalem im sechsten Jahre seiner Regierung, im ersten Jahre der 66. Olympiade. (Als Olympiade bezeichnen die Griechen den Wettkampf, der alle vier Jahre stattfand mit Rücksicht auf den [Schalt-] tag, der sich alle vier Sonnenjahre aus den jährlich restierenden drei [Tages-]stunden ergibt.) Herodes aber wird König in der 186. Olympiade, und zwar im vierten Jahre derselben. Von der 66. Olympiade bis zur 186. Olympiade sind es nun 120 Olympiaden und etwas dazu. Die 120 Olympiaden aber sind gleich 480 Jahre; die drei noch übrigen Jahre fallen jedenfalls zwischen das erste und vierte Jahr. Du hast also einen Beweis auf Grund des Schriftwortes: „Vom Erlassen des Wortes, daß Antwort gegeben und Jerusalem aufgebaut werden solle, bis auf Christus, den Führer, werden sieben Wochen und zweiundsechzig Wochen sein.“ Einstweilen hast du diesen chronologischen Beweis; allerdings gibt es auch noch verschiedene andere Auslegungen der Danielschen Jahreswochen.</p><p>Nun sollst du erfahren, welcher Ort verheißen worden ist. Michäas sagt nämlich: „Du Bethlehem, Haus von Ephrata, bist doch nicht etwa zu gering, um zu den Tausendschaften Judas gerechnet zu werden; denn aus dir wird mir hervorgehen ein Führer, der zum Herrscher in Israel bestimmt ist, und sein Ausgang ist von Anfang an, von den Tagen der Ewigkeit“. Übrigens weißt du als Bewohner Jerusalems bereits, was im 131. Psalme über den Ort (der Erscheinung Christi) geschrieben steht: „Siehe, wir hörten von der Stätte in Ephrata, wir fanden sie in den Waldgefilden“. Vor wenigen Jahren noch war nämlich der Ort waldig. Wie du gehört hast, hat Habakuk zum Herrn gesagt: „Wenn die Jahre heranrücken, wirst du dich zu erkennen geben; wenn die Zeit da ist, wirst du dich zeigen“. Woran, o Prophet, wird man aber die Ankunft des Herrn erkennen? Habakuk sagt weiter: „Du wirst erkannt werden in der Mitte zweier Leben“. Offenbar will er zum Herrn sagen: „Wenn du im Fleische gekommen bist, lebst du, dann stirbst du, dann aber stehst du von den Toten auf, um wieder zu leben.“ Und von welcher Seite Jerusalems kommt er? Von Osten oder Westen, von Norden oder Süden? Sage es uns genau! Der Prophet gibt eine recht klare Antwort und sagt: „Gott wird kommen von Thäman“ (Thäman heißt nämlich Süden) „und der Heilige vom schattigen, dichten Berge“. Damit stimmt überein das Wort des Psalmisten: „Wir fanden sie in den Waldgefilden“.</p><p>Wir forschen weiter, von wem er kommt und wie er kommt. Da gibt uns Isaias Auskunft: „Siehe, die Jungfrau wird empfangen und einen Sohn gebären, und man wird seinen Namen Emanuel nennen“. Gegen diese Worte erheben die Juden Einspruch. Schon seit alten Zeiten haben sie die sündhafte Gewohnheit, sich der Wahrheit zu widersetzen. Sie erklären, es sei nicht geschrieben „die Jungfrau“* (παρθένος)* [parthenos], sondern „das junge Weib“ (νεᾶνις). Aber selbst wenn ich ihrer Erklärung beipflichte, finde ich die erwähnte Wahrheit ausgesprochen. Man muß jene fragen: Wann schreit eine Jungfrau, die vergewaltigt wird? Ruft sie nach oder vor der Schändung um Hilfe? Wenn nun die Schrift irgendwo sagt: „Es rief das junge Weib* (νεᾶνις)* [neanis], und niemand war da, der ihr geholfen hätte“, spricht sie da nicht von einer Jungfrau? Damit dir aber die Lehre noch klarer werde, daß auch die Jungfrau in der göttlichen Schrift als junges Weib bezeichnet wird, höre, was im Buche der Könige über Abisak, die Sunamitin, gesagt ist: „Das junge Weib war überaus schön“. Denn bekanntlich wurde sie als Jungfrau auserwählt und David zugeführt.</p><p>[Forts. v. ] Doch die Juden wenden wiederum ein: „Jene Worte an Achaz beziehen sich auf Ezechias“. Lesen wir die Schrift: „Fordere dir ein Zeichen* (σημεῖον)* [sēmeion] vom Herrn, deinem Gott, in der Tiefe oder in der Höhe!“ Vor allem muß das Zeichen etwas Wunderbares sein. Ein Zeichen war, daß aus dem Felsen Wasser kam, daß sich das Meer teilte, daß die Sonne rückwärts ging und dgl. Was ich noch sagen werde, enthält noch deutlicheren Beweis gegen die Juden.</p><p>Zwar weiß ich, daß meine Zuhörer ermüden, wenn ich ausführlich zu ihnen spreche. Doch habt Geduld, wenn die Rede lang ist! Denn es handelt sich hier um Christus und nicht um Bagatellen.</p><p>Isaias sprach jene Worte unter der Regierung des Achaz. Dieser regierte nur sechzehn Jahre, und während dieser Zeit wurde jene Prophezeiung an ihn gerichtet. Durch König Ezechias, des Achaz Sohn und Nachfolger, wird nun der Einwand der Juden widerlegt, da er beim Antritt der Regierung bereits fünfundzwanzig Jahre zählte. Da Achaz während der sechzehn Jahre seiner Regierung die Prophezeiung erhielt, so war nämlich Ezechias von ihm (mindestens) neun Jahre vor der Prophezeiung erzeugt. Soll nun die Prophezeiung von dem gelten, der bereits erzeugt ist? Nicht sagte ja der Prophet „sie empfing“, sondern „die Jungfrau wird empfangen“. Er sprach also von der Zukunft.</p><p>Bestimmt wissen wir es, daß der Herr aus einer Jungfrau geboren wird. Nun muß noch gezeigt werden, aus welchem Geschlechte die Jungfrau ist. „Es schwor der Herr dem David die Wahrheit, und nicht wird er sie aufgeben: von der Frucht deines Leibes werde ich auf deinen Thron setzen“. An anderer Stelle heißt es: „In alle Ewigkeit werde ich seinen Samen aufstellen und seinen Thron wie die Tage des Himmels“, und hierauf: „Einmal habe ich es geschworen in meiner Heiligkeit. Werde ich David belügen? Sein Same wird bleiben in Ewigkeit und sein Thron wie die Sonne vor mir und wie der Mond, der aufgestellt ist für immer“. Wie du siehst, ist von Christus und nicht von Salomo die Rede. Denn dessen Thron blieb nicht wie die Sonne. Sollte aber jemand deshalb, weil Christus nicht auf dem hölzernen Throne Davids saß, Einwand erheben, so werden wir ihm das Wort vorhalten: „Auf dem Throne des Moses saßen die Schriftgelehrten und Pharisäer“. Nicht der hölzerne Thron ist hier gemeint, sondern die Lehrgewalt. Ebenso darfst du unter dem Throne Davids nicht seinen hölzernen Thron verstehen, sondern seine königliche Macht selbst. Zeugen mögen dir sein die Knaben, welche sangen: „Hosanna dem Sohne Davids, gepriesen sei der König Israels!“ Auch die Blinden riefen: „Sohn Davids, erbarme dich unser!“ Auch Gabriel bezeugt ausdrücklich in seinen Worten an Maria: „Gott der Herr wird ihm den Thron Davids, seines Vaters, geben“. Paulus sagt: „Seid eingedenk, daß Jesus Christus, aus dem Samen Davids, nach meinem Evangelium von den Toten auferstanden ist!“, und zu Beginn des Römerbriefes erklärt er: „Dem Fleische nach stammt er aus dem Samen Davids“. Glaube also an den, der aus David geboren ist, im Vertrauen auf die Prophezeiung: „An jenem Tage wird die Wurzel Jesse kommen und derjenige, welcher aufsteht, die Völker zu regieren; auf ihn werden die Völker hoffen“.</p><p>Wegen dieser Schriftstellen sind die Juden in großer Verlegenheit. Isaias wußte dies vorher, denn er sagte: „Sie werden wollen, wenn sie vom Feuer verbrannt sind; denn ein Kind ist uns — nicht ihnen — geboren, ein Sohn ist uns geschenkt“. Merke dir: zuerst war er Sohn Gottes, dann ist er uns geschenkt worden! Gleich nach jenen Worten sagt der Prophet: „und sein Friede hat keine Grenzen“. Die Römer haben ihre Grenzen, doch das Reich des Sohnes Gottes hat keine Grenze. Die Perser und Meder haben ihre Grenzen, doch der Sohn hat keine Grenze. Weiter folgt: „Auf dem Throne Davids und in dessen Reich (wird er sitzen), um es aufzurichten“. Von David also stammt die heilige Jungfrau ab.</p><p>[Forts. v. ] Für den Keuschesten und den Lehrer der Keuschheit geziemt es sich, aus keuschem Gemache hervorgegangen zu sein. Wenn der, welcher ein guter Priester Jesu ist, sich des Weibes enthält, hätte Jesus selbst aus Mann und Weib hervorgehen sollen? „Du bist es“ — sagt er in den Psalmen — „der mich aus dem Schoße gezogen hat“. Merke genau auf das Wort „der mich aus dem Schoße gezogen hat“! Damit ist angedeutet, daß er ohne Mann aus dem Schoße und Fleische einer Jungfrau gezogen und geboren worden ist. Denn bei ehelicher Verbindung ist die Geburt eine andere.</p><p>Er, der die Glieder gebildet hat, schämt sich nicht, aus solchen Gliedern Fleisch anzunehmen. Und wer lehrt uns dies? Zu Jeremias spricht der Herr: „Ehe ich dich aus dem Mutterleibe gebildet habe, kenne ich dich; ehe du aus der Mutter Schoß hervorgegangen bist, habe ich dich geheiligt“. Hätte sich nun der, welcher sich nicht geschämt hatte, bei der Bildung der Menschen die Glieder zu berühren, schämen sollen, seinetwegen das heilige Fleisch, „die Hülle der Gottheit“, zu bilden? Gott ist es, der immer noch die Frucht im Mutterleibe gestaltet, wie bei Job geschrieben ist: „Hast du mich nicht wie Milch gemolken, mich wie Käse gerinnen lassen? Mit Haut und Fleisch hast du mich umgeben, aus Knochen und Sehnen mich zusammengefügt“. Nichts Unreines ist an der Gestalt des Menschen, außer er befleckt sie durch Ehebruch und Unzucht. Der den Adam gebildet hat, hat auch die Eva gebildet. Von göttlichen Händen wurde Mann und Weib gebildet. Keines der Glieder am Leibe war anfänglich, bei seiner Erschaffung, unrein. Verstummen mögen alle Häretiker, welche die Körper bzw. den Schöpfer selbst anklagen! Wir wollen eingedenk sein des Wortes Pauli: „Wisset ihr nicht, daß unsere Leiber Tempel des Hl. Geistes sind, der in uns wohnt?“ Im Namen Jesu hat der Prophet es vorherverkündet: „Mein Fleisch ist aus ihnen“. Und an anderer Stelle ist geschrieben: „Deshalb wird er sie hingeben bis zur Zeit der Gebärenden“. Und welches ist das Erkennungszeichen? Es heißt im Anschluß an jene Worte: „Sie wird gebären, und die übrigen ihrer Brüder werden sich bekehren“. Welches ist der Mahlschatz der Jungfrau, der heiligen Braut? „Ich werde dich mir verloben in Treue“. Ähnlich sagt Elisabeth zu ihr: „Selig ist, die geglaubt hat; denn es wird in Erfüllung gehen, was der Herr zu ihr gesagt hat“.</p><p>Heiden und Juden bekritteln uns und sagen, es wäre unmöglich, daß Christus aus einer Jungfrau geboren wurde. Den Heiden wollen wir unter Verweis auf ihre eigenen Mythen den Mund verstopfen. Wie könnt denn ihr, die ihr behauptet, hingeworfene Steine werden in Menschen verwandelt, die Möglichkeit der Jungfrauengeburt leugnen? Wenn ihr fabelt, eine Tochter sei aus einem Gehirne geboren worden, wie könnt ihr behaupten, es sei unmöglich, daß aus jungfräulichem Leibe ein Sohn geboren wurde? Ihr, die ihr die Lüge aufstellt, Dionysos sei aus der Hüfte eures Zeus geboren worden, wie könnt ihr unsere wahre Lehre bestreiten? Solche Erzählungen passen zwar, wie ich weiß, nicht für meine Zuhörer; aber damit du bei gegebener Gelegenheit den Heiden Vorhalt machest, haben wir in unserer Polemik gegen sie aus ihren Fabeln diese Mitteilungen beigebracht.</p><p>Denen aus der Beschneidung begegne ich mit der Frage: Was ist schwieriger, daß eine alte, unfruchtbare, nicht mehr den gewöhnlichen Gesetzen unterworfene Frau gebäre oder daß eine Jungfrau in blühendem Alter gebäre? Unfruchtbar war Sara, und doch, wider die Natur, nachdem die weiblichen Organe unwirksam geworden waren, hat sie geboren. Wenn es nun sowohl wider die Natur ist, daß eine Unfruchtbare gebiert, als auch, daß eine Jungfrau gebiert, dann mußt du entweder das eine wie das andere verwerfen oder das eine wie das andere annehmen. Denn es ist der eine und derselbe Gott, welcher jenes getan und dieses bewirkt hat. Nicht wirst du es wagen, zu behaupten: Jenes ist Gott möglich, dieses nicht. Welche Naturkraft bewirkt, daß eine menschliche Hand in einer Stunde ihr Aussehen verändert und wieder zurückerhält? Wie kam es, daß die Hand des Moses weiß wurde wie Schnee und dann gleich wieder hergestellt war? Du entgegnest: Der Wille Gottes hat die Veränderung bewirkt. In dem einen Fall hat Gottes Wille die Macht, und hier hat er nicht die Macht? Dort handelte es sich um ein Wunder, das nur für die Ägypter bestimmt war; hier aber liegt ein Wunder vor, das der Menschheit geschenkt wurde. Ihr Juden, was ist schwerer, daß eine Jungfrau gebäre oder daß ein Stab in ein lebendes Wesen verwandelt werde? Ihr gebt es zu, daß zur Zeit des Moses ein kerzengerader Stab in die Gestalt einer Schlange verwandelt worden war und dem furchtbar wurde, der ihn (auf den Boden) geworfen hatte, und daß der, welcher den Stab zuvor in der Hand gehabt hatte, vor ihm, dem Drachen, floh; in der Tat war es ein Drache. Nicht jedoch floh er aus Furcht vor dem, was er in der Hand gehabt hatte, sondern aus Angst vor dem, der die Verwandlung vorgenommen hatte; denn der Stab bekam Zähne und Drachenaugen. Wenn nun aus einem Stabe sehende Augen wachsen, sollte dann nicht aus jungfräulichem Leibe, wenn es Gott so will, ein Sohn geboren werden? Davon will ich schweigen, daß der Stab Aarons das, was die anderen Bäume in mehreren Jahren hervorbringen, in einer einzigen Nacht hervorgebracht hat. Wer sollte es nämlich nicht wissen, daß ein Stab, dem man die Rinde abgeschält hat, nie mehr wächst, auch dann nicht, wenn er in Wasser gelegt wird? Da sich aber Gott nicht der Natur der Bäume unterordnet, sondern der Schöpfer der Natur ist, darum blühte der unfruchtbare, dürre und abgeschälte Stab, trieb und trug Mandeln. Soll nun der, welcher mit Rücksicht auf den vorbildlichen Hohenpriester dem Stab in übernatürlicher Weise Fruchtbarkeit verlieh, nicht der Jungfrau mit Rücksicht auf den wahren Hohenpriester die Möglichkeit zu gebären gegeben haben?</p><p>[Forts. v. ] Es ist gut, die Erinnerung daran wachzurufen. Doch trotzdem widersprechen die Juden noch und lassen sich nicht durch das, was jener Stab lehrt, überzeugen. Sie wollen sich nur durch Hinweis auf Geburten ähnlicher, wunderbarer, übernatürlicher Art belehren lassen. Darum mußt du dich an sie mit der Frage wenden: „Aus wem wurde zu Anbeginn die Eva geboren? Welche Mutter hat sie, die Mutterlose, empfangen?“ Die Schrift sagt, sie sei aus einer Rippe des Adam geworden. Sollte nun, wenn Eva aus einer männlichen Rippe, ohne Mutter, geboren wurde, nicht ein Knabe aus jungfräulichem Schoße, ohne Vermittlung eines Mannes, geboren werden? Das weibliche Geschlecht schuldete Dank den Männern; denn aus Adam ist Eva geworden, und nicht wurde sie von einer Mutter empfangen, ein Mann allein hat sie gewissermaßen geboren. Maria nun hat den schuldigen Dank abgestattet dadurch, daß sie ohne Mithilfe eines Mannes aus sich allein in kraft des Hl. Geistes durch göttliches Wunder unbefleckt geboren hat.</p><p>Ein noch größeres Wunder steht uns zur Verfügung. Daß Leiber aus Leibern geboren werden, mag wunderbar sein, doch man kann es zugeben. Daß aber aus Staub der Erde ein Mensch wird, das ist noch wunderbarer. Wunderbar ist, daß kompakter Lehm das Aussehen und den Glanz von Augen erhielt. Es ist ein Wunder, daß aus ein und demselben Staub sowohl die festen Knochen wie die zarte Lunge und die übrigen verschiedenartigen Glieder wurden. Daß der belebte Lehm sich selbst bewegt, den Erdkreis durchwandert, Häuser baut, ist ein Wunder. Ein Wunder ist es, daß der Lehm lehrt, redet, zimmert, herrscht. Ihr Juden, gar nichts habt ihr gelernt! Woraus ist Adam geworden? Hat nicht Gott Staub von der Erde genommen und daraus dieses wunderbare Gebilde hergestellt? Wenn Lehm in Augen verwandelt wird, dann soll nicht eine Jungfrau einen Sohn gebären? Was Menschen für unmöglich halten, soll geschehen, und was man noch zugeben kann, soll nicht geschehen?</p><p>Daran, Brüder, wollen wir denken! Diese Verteidigungsmittel wollen wir benützen! Dulden wir die Häretiker nicht, welche lehren, die Menschwerdung Christi sei nur eine scheinbare gewesen! Auch jene wollen wir verabscheuen, welche behaupten, der Erlöser sei aus Mann und Weib geboren worden, und welche sich erkühnt haben zu sagen, er stamme aus Joseph und Maria, da geschrieben wäre: „und er nahm sein Weib“. Denken wir an das Wort, das Jakob, noch ehe er die Rachel zu sich nahm, zu Laban gesprochen hatte: „Gib mir mein Weib!“ Gleichwie Rachel noch vor Vollzug der Ehe nur wegen des Eheversprechens Jakobs Weib genannt worden war, so wurde Maria auf Grund ihrer Verlobung Josephs Weib genannt. Achte darauf, wie genau sich das Evangelium ausdrückt, da es sagt: „Im sechsten Monat wurde der Engel Gabriel von Gott in eine Stadt Galiläas, namens Nazareth, geschickt zu einer Jungfrau, welche mit einem Manne namens Joseph verlobt war usw.“. Was sagt ferner die Schrift, als die Aufschreibung stattfand und Joseph hinaufzog, um sich aufschreiben zu lassen? „Auch Joseph zog von Galiläa aus hinauf, sich aufschreiben zu lassen mit Maria, seiner Braut, welche schwanger war“. Obwohl sie nämlich schwanger war, sagte die Schrift nicht „mit seinem Weibe“, sondern „mit seiner Braut“. Paulus sagt: „Gott sandte seinen Sohn, geboren aus einem Weibe“, d. i. der Jungfrau; denn unter Weib ist, wie wir schon gezeigt haben, auch die Jungfrau zu verstehen. Nicht sagt er „geworden aus Mann und Weib“. Aus einer Jungfrau ist der geboren worden, welcher die Seelen jungfräulich macht.</p><p>Du wunderst dich über die Geburt. Auch die geboren hatte, wunderte sich. Denn zu Gabriel spricht sie: „Wie wird mir dies geschehen, da ich keinen Mann erkenne?“ Er aber entgegnet: „Der Hl. Geist wird über dich kommen, und die Kraft des Allerhöchsten wird dich überschatten; darum wird auch das Heilige, das geboren wird, Sohn Gottes genannt werden“. Unbefleckt und rein war die Geburt. Denn wo der Hl. Geist ist, da ist jeder Schmutz weggenommen. Unbefleckt war also die fleischliche Geburt des Eingeborenen aus der Jungfrau. Wenn die Häretiker der Wahrheit widersprechen, wird sie der Hl. Geist widerlegen. Zürnen wird die Kraft des Allerhöchsten, welche überschattet hat. Ingrimmig wird wider sie am Tage des Gerichtes Gabriel auftreten. Beschämen wird sie der Ort der Krippe, welcher den Herrn aufgenommen hat. Zeugen werden sein die Hirten, welche seinerzeit die frohe Botschaft erhalten haben, und der Chor der Engel, welche lobten, jubelten und sprachen: „Ehre sei Gott in der Höhe und Friede auf Erden unter den Menschen des Wohlgefallens!“ Zeugen sind der Tempel, in den er seinerzeit am vierzigsten Tage gebracht worden war, und die Paare von Turteltauben, welche für ihn dargebracht worden waren, und Simeon, der ihn seinerzeit in seine Arme genommen hatte, sowie die Prophetin Anna, welche zugegen war.</p><p>[Forts. v. ] Da nun Gott Zeugnis gibt und da mit ihm der Hl. Geist Zeugnis gibt und da Christus sagt: „Warum sucht ihr mich zu töten, einen Menschen, der euch die Wahrheit gesagt hat?“ so mögen die Häretiker, welche seine menschliche Natur leugnen, verstummen! Sie widersprechen dem, welcher sagt: „Rühret mich an und erkennet es, daß der Geist nicht Fleisch und Knochen hat, so wie ihr dies an mir schauet!“ Anbeten soll man den Herrn, der aus einer Jungfrau geboren wurde! Erkennen mögen die Jungfrauen den, der die Krone ihres Wandels ist! Der Stand der Mönche möge den erkennen, welcher der Ruhm ihrer Keuschheit ist; denn der Würde der Keuschheit sind wir nicht beraubt. Während der Erlöser neun Monate lang im Schoße der Jungfrau wohnte, lebte der Herr als Mann bis zum dreiunddreißigsten Jahre. Also können wir (Männer), wenn eine Jungfrau sich rühmt wegen der neun Monate, uns noch viel mehr rühmen wegen der vielen Jahre.</p><p>Alle, Jünglinge und Jungfrauen, alt und jung, wollen wir mit Hilfe der Gnade Gottes den Weg der Keuschheit wandeln! Nicht der Ausschweifung wollen wir nachjagen, sondern Christi Namen wollen wir preisen! Verkennen wir nicht die Würde der Keuschheit! Sie ist die Krone der Engel und ein übermenschlicher Stand. Achten wir auf den Leib, der wie die Sonne leuchten wird! Beschmutzen wir doch nicht um einer kleinen Freude willen einen Körper von dieser Art und Größe! Kurz ist die Sünde und dauert nur einige Zeit, viele Jahre und ewig währt die Schande. Die keusch leben, sind Engel, die auf Erden wandeln. Die Jungfrauen haben ihren Teil mit der Jungfrau Maria. Verbannt sei jeder Putz, jeder schädliche Blick, jeder Schlendrian, jedes lange Gewand und jedes sinnlich reizende Beweihräuchern! Als Weihrauch gelte in allem das wohlriechende Gebet, die Verrichtung guter Werke und die körperliche Heiligung, damit der aus einer Jungfrau geborene Herr auch von uns, den keuschen Männern und den gekrönten Frauen, sage: „Ich werde unter ihnen wohnen und wandeln, und ich werde ihr Gott sein, und sie werden mein Volk sein“. Ihm sei Ehre in alle Ewigkeit. Amen.XIII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Worte: „gekreuzigt und begraben“.</p><h2>14</h2><p>* Über die Worte: „gekreuzigt und begraben“.*</p><p>Der katholischen Kirche ist zwar jede Tat Christi Gegenstand des Ruhmes. Gegenstand höchsten Ruhmes aber ist das Kreuz. In dieser Erkenntnis sagt Paulus: „Ferne sei es von mir, mich zu rühmen, es sei denn im Kreuze Christi!“ Etwas Wunderbares war es, daß einer, der von Geburt aus blind war, im Teiche Siloa das Augenlicht erhielt. Doch was ist der Eine gegen die Blinden der ganzen Welt? Etwas Großes, Übernatürliches war es, daß Lazarus, der schon den vierten Tag tot war, von den Toten auferstand. Doch nur an ihm hatte sich die Gnade geoffenbart. Was aber ist der eine Lazarus gegenüber denen, die auf dem Erdkreis durch ihre Sünden gestorben sind? Es war ein Wunder, daß fünf Brote zur Ernährung von fünftausend Mann hinreichten. Doch was sind diese fünftausend gegenüber denen, welche auf dem ganzen Erdkreis Hunger leiden, weil sie in Unwissenheit leben? Wunderbar war die Befreiung des Weibes, welches achtzehn Jahre vom Satan gefesselt war. Aber was ist dieses eine Weib gegenüber uns allen, welche wir von den Ketten unserer Sünden gefesselt sind? Der Siegeskranz des Kreuzes hat den geistig Blinden Licht gebracht, hat alle, die unter der Sünde darniederlagen, befreit und die ganze Menschenwelt erlöst.</p><p>Wundere dich nicht, daß die ganze Welt erlöst wurde! Denn der, welcher für sie starb, war kein gewöhnlicher Mensch, sondern der eingeborene Sohn Gottes. Die Sünde eines einzigen Mannes, des Adam, vermochte der Welt den Tod zu bringen. Wenn aber durch den Fall des einen der Tod zur Herrschaft in der Welt kam, soll dann nicht noch mehr das Leben zur Herrschaft gelangen durch die gerechte Tat des Einen? Wenn seinerzeit die Stammeltern aus dem Paradiese vertrieben wurden wegen des Holzes, von dem sie gegessen hatten, sollten nicht die Gläubigen jetzt leicht in das Paradies eintreten wegen des Holzes Jesu? Wenn der, welcher zuerst aus Erde gebildet worden war, allen den Tod gebracht hat, sollte dann nicht der, welcher ihn aus Erde gebildet hatte, ewiges Leben bringen, da er selbst das Leben ist? Wenn Phinees, welcher in seinem Eifer den Schandbuben getötet hatte, den Zorn Gottes besänftigte, sollte Jesus, der nicht einem Fremden das Leben nahm, sondern sich selbst als Lösepreis hingab, nicht den Zorn gegen die Menschen beseitigen?</p><p>Wir wollen uns also nicht des Kreuzes des Erlösers schämen, sondern uns vielmehr desselben rühmen! Die Kreuzeslehre ist zwar den Juden ein Ärgernis und den Heiden Torheit, uns jedoch Erlösung; sie ist denen, die verloren gehen, Torheit, uns aber, die wir erlöst werden, Kraft Gottes. Denn der für uns gestorben ist, war — wie gesagt — nicht ein gewöhnlicher Mensch, sondern Gottes Sohn, der Mensch gewordene Gott. Wenn das Lamm, welches im Auftrage des Moses geschlachtet wurde, den Verderber fernhielt, sollte dann nicht vielmehr das Lamm Gottes, das die Sünden der Welt auf sich nahm, von Sünden befreien? Wenn das Blut des unvernünftigen Lammes Heil wirkte, soll dann nicht vielmehr das Blut des Eingeborenen Heil bringen? Wer nicht an die Macht des Gekreuzigten glauben will, möge bei den Dämonen anfragen! Wer den Worten nicht glauben will, glaube den offenkundigen Tatsachen! Auf der weiten Welt sind schon viele gekreuzigt worden, doch vor keinem zittern die Dämonen. Da aber Christus für uns gekreuzigt worden ist, erschrecken die Dämonen, wenn sie nur schon das Zeichen des Kreuzes sehen. Während nämlich die einen sterben mußten wegen ihrer eigenen Sünden, ist er für fremde Sünden gestorben. „Denn keine Sünde hat er getan, und kein Betrug ist gefunden worden in seinem Munde“. Nicht Petrus war es, der diese Worte gesprochen hatte; von ihm könnte man vermuten, daß er sie aus Schmeichelei gegen seinen Meister gesprochen habe. Isaias hat sie gesprochen; dem Fleische nach hatte er zwar nicht mit ihm verkehrt, doch im Geiste hatte er seine Ankunft im Fleische vorhergeschaut. Doch soll ich jetzt nur einen Propheten als Zeugen zitieren? Auch an Pilatus hast du einen Zeugen; bei der Verurteilung Jesu hatte er erklärt: „Ich finde keine Schuld an diesem Menschen“. Als er ihn auslieferte, wusch er seine Hände und sprach: „Ich bin unschuldig an dem Blute dieses Gerechten“. Noch einer ist Zeuge für die Sündelosigkeit Jesu, nämlich der Räuber, welcher als erster in das Paradies einging. Er macht seinem Genossen Vorhalt mit den Worten: „Wir empfangen das, was wir für unsere Taten verdienen. Dieser aber hat nichts Böses getan; denn wir, ich und du, waren bei der Gerichtsverhandlung zugegen.“</p><p>Jesus hat also in Wahrheit für alle Menschen gelitten. Das Kreuz war kein Wahn, sonst wäre ja auch die Erlösung Wahn. Nicht war der Tod Einbildung; denn sonst wäre unser Heil Einbildung; dann hätten jene Recht, die sagten: „Wir erinnerten uns, daß jener Verführer, da er noch lebte, erklärte: Nach drei Tagen werde ich auferstehen“. Er hat wahrhaft gelitten, er ist wahrhaft gekreuzigt worden, und nicht schäme ich mich dessen. Er ist gekreuzigt worden, und nicht leugne ich es. Vielmehr bin ich stolz darauf, davon zu sprechen. Wollte ich es jetzt leugnen, so würde mich der Golgatha hier, in dessen Nähe wir alle weilen, zurechtweisen, zurechtweisen würde mich das Kreuzesholz, dessen Partikel bereits in der ganzen Welt von hier aus verbreitet worden sind. Ich bekenne das Kreuz, da ich von der Auferstehung weiß. Wäre Jesus ein Gekreuzigter geblieben, so hätte ich mich gewiß nicht zu dem Kreuze bekannt, dann hätte ich es wohl zugleich mit meinem Lehrmeister verheimlicht. Da aber dem Kreuze die Auferstehung folgte, so schäme ich mich nicht, von dem Kreuze zu predigen.</p><p>Da Jesus Fleisch geworden und allen Menschen ähnlich ist, ist er gekreuzigt worden. Nicht jedoch ist er gekreuzigt worden ähnlicher Sünden wegen. Nicht ist er wegen Habsucht zum Tode geführt worden; war er ja doch der Lehrer der Armut. Auch wurde er nicht wegen Sinnlichkeit verurteilt; erklärt er doch ausdrücklich: „Wer eine Frau ansieht, ihrer zu begehren, hat bereits die Ehe mit ihr gebrochen“. Nicht wurde er verurteilt, weil er aus Mutwille jemanden geschlagen oder verwundet hat; hat er doch die andere Wange dem hingeboten, der ihn geschlagen hatte. Nicht wegen Gesetzesverachtung; denn er hatte das Gesetz erfüllt. Nicht als ob er einen Propheten gelästert hätte; denn er war es, der von den Propheten verkündet worden war. Nicht als ob er sich unrechtmäßigerweise Lohn angeeignet hätte; denn unentgeltlich, umsonst, hat er die Heilungen vorgenommen. Nicht wurde er verurteilt, weil er in Wort oder Tat oder durch Begierde gesündigt hätte; „er hat keine Sünde begangen, und in seinem Munde ist kein Betrug gefunden worden; als er geschmäht wurde, hat er nicht widergeschmäht; als er zu leiden hatte, hat er nicht gedroht“. Nicht wider seinen Willen, sondern freiwillig ist er in sein Leiden gegangen. Wenn auch jetzt noch jemand abweisend zu ihm sagen würde: „Herr, ferne sei es von dir, (daß du leidest), würde er wiederum (wie dem Petrus) entgegnen: „Weiche von mir, Satan!“</p><p>Soll ich dich davon überzeugen, daß Jesus freiwillig in sein Leiden gegangen ist? Die übrigen Menschen, welche unfreiwillig sterben, wissen ihren Tod nicht voraus. Jesus aber hat sein Leiden vorausgesagt mit den Worten: „Siehe, des Menschen Sohn wird ausgeliefert zur Kreuzigung“. Weißt du, warum der Freund der Menschen vor dem Tode nicht geflohen ist? Es sollte die Welt durch ihre Sünden nicht vollständig zugrunde gehen. „Siehe, wir gehen hinauf nach Jerusalem, und des Menschen Sohn wird ausgeliefert und gekreuzigt werden“. Und an anderer Stelle heißt es: „Er richtete sein Angesicht, um nach Jerusalem zu gehen“. Willst du es genau wissen, ob für Jesus das Kreuz eine Ehre ist? Höre auf seine eigenen, nicht auf meine Worte! Judas wurde undankbar gegen seinen Hausvater und verriet ihn. Kaum hatte er den Tisch verlassen und den Kelch des Heiles getrunken, entschloß er sich, für den Trank des Heiles gerechtes Blut zu vergießen. „Gegen den, dessen Brot er gegessen hatte, erhob er die Ferse“. Kaum hatten seine Hände das Abendmahl erhalten, da bereitete er ihm schon um des Verräterlohnes willen den Tod. Als er zurechtgewiesen wurde und das Wort hörte: „Du hast es gesagt“, verließ er den Saal. Da nun sprach Jesus: „Es ist die Stunde gekommen, daß des Menschen Sohn verherrlicht werde“. Wie du siehst, erkannte er im Kreuze seine Herrlichkeit. Wenn Isaias keine Schande darin sah, daß er zersägt wurde, hätte sich dann Christus schämen sollen, für die Welt zu sterben? „Jetzt ist des Menschen Sohn verherrlicht“. Nicht als ob er zuvor nicht auch schon die Herrlichkeit gehabt hätte. War er doch verherrlicht durch die Herrlichkeit, welche er vor Gründung der Welt hatte. Als Gott hatte er immer die Herrlichkeit; in der Zeit aber wurde er verherrlicht, da er die Krone des geduldigen Leidens trug. Nicht gezwungen hat er sein Leben hingegeben, und nicht unter Vergewaltigung ist er hingeschlachtet worden, sondern freiwillig. Höre, was er spricht: „Ich habe die Macht, mein Leben hinzugeben, und ich habe die Macht, es wieder zu nehmen; weil ich will, überlasse ich mich meinen Feinden, würde ich es aber nicht wollen, so würde mir nichts geschehen.“ Freiwillig ging er also in sein Leiden, er freute sich über dieses gute Werk, frohlockte über die Krone (des Leidens), hatte sein Wohlgefallen an der Erlösung der Menschen, schämte sich nicht des Kreuzes. Denn dadurch erlöste er ja die ganze Menschheit. Der Leidende war nämlich kein niedriger Mensch, sondern der menschgewordene, den Kampf geduldigen Leidens kämpfende Gott.</p><p>Doch es erheben Widerspruch die Juden, welche stets zum Widerspruch bereit, im Glauben dagegen saumselig sind, weshalb nun die verlesene Prophetenstelle sagt: „Herr, wer glaubte unserer Predigt?“ Perser glauben, und Hebräer glauben nicht. „Sehen werden die, welchen nicht von ihm verkündet worden war, und erkennen werden die, welche nicht gehört haben“; und die, welche darüber nachdachten, werden das, worüber sie nachdenken, verwerfen.</p><p>Die Juden machen gegen uns die Einwendung: „Der Herr leidet also? Waren denn Menschenhände mächtiger als seine Herrschermacht?“ Leset die Klagelieder! In den Klageliedern hat Jeremias, über euch klagend, Klagenswertes niedergeschrieben. Er sah euren Untergang, er schaute euren Fall. Er klagte über das damalige Jerusalem; denn das jetzige wird nicht beklagt werden. Jenes hat Christus gekreuzigt, das jetzige aber betet ihn an. Klagend sagt Jeremias: „Der Geist unseres Angesichtes, Christus der Herr, wurde gefangen wegen unseres Verderbens“. Rede ich also etwa, was ich selbst ersonnen habe? Siehe, Jeremias bezeugt es, daß Christus, der Herr, von Menschen gefangen werde. Was wird daraus folgen? Sage es mir, o Prophet! Er antwortet: „In seinem Schatten — sagten wir — werden wir leben unter den Heiden“. Damit deutet er an, die Gnade des Lebens wohne nicht mehr in Israel, sondern unter den Heiden.</p><p>Da die Juden gern widersprechen, wohlan, so wollen wir, sofern es die Kürze der Zeit erlaubt, gestützt auf euer Gebet, mit der Gnade des Herrn noch einige Zeugnisse für sein Leiden anführen! Die ganze Geschichte Christi ist aufgeschrieben. Nichts ist zweifelhaft, denn nichts ist unbezeugt. Auf den Säulen der Propheten ist alles aufgezeichnet; nicht auf steinernen Tafeln, sondern vom Hl. Geist ist es deutlich aufgeschrieben. Wenn du nun gehört hast, was das Evangelium über Judas berichtet, mußt du da nicht auch den Beweis hierfür erhalten? Du hast gehört, daß Jesu Seite mit einer Lanze durchbohrt wurde. Mußt du nicht schauen, ob auch von dieser Tatsache geschrieben steht? Du hast gehört, daß er in einem Garten gekreuzigt wurde. Mußt du nicht sehen, ob auch dies geschrieben ist? Gehört hast du, daß er um dreißig Silberlinge verkauft wurde. Mußt du nicht lernen, welcher Prophet dies gesagt hat? Gehört hast du, daß er mit Galle getränkt wurde. Lerne auch, wo dies geschrieben ist! Du hast gehört, daß sein Leichnam in einem Felsen beigesetzt und davor ein Stein angebracht wurde. Mußt du nicht auch hierfür ein Zeugnis aus den Propheten erhalten? Gehört hast du, daß er mit Räubern gekreuzigt wurde. Mußt du nicht schauen, ob auch hierüber geschrieben ist? Du hast von seinem Begräbnis gehört. Mußt du nicht nach einer genauen Aufzeichnung über sein Begräbnis dich umsehen? Du hast von seiner Auferstehung gehört. Mußt du nicht darauf schauen, ob wir dich nicht etwa mit dieser Lehre zum besten haben? Denn „unsere Rede und unsere Predigt besteht nicht in packenden Worten menschlicher Weisheit“. Kein sophistischer Apparat wird jetzt in Bewegung gesetzt; er hat ja keinen Bestand. Worte werden nicht mit Worten besiegt, da sie vergehen. Wir verkünden vielmehr Christum, den Gekreuzigten, weil er von den Propheten bereits vorherverkündet worden ist. Nimm hin die Zeugnisse und präge sie fest in dein Herz ein! Da die Zahl der Zeugnisse groß ist, auch die Zeit schon drängt, so vernimm, soweit es noch Zeit ist, jetzt wenigstens noch einige wichtigere Zeugnisse! Sie mögen Anlaß werden, daß du dich bemühst, auch nach den übrigen Zeugnissen dich umzusehen. Deine Hand soll sich nicht nur ausstrecken, um zu empfangen, sie sei auch bereit zum Arbeiten! Gott verleiht alles. Denn „fehlt es einem von euch an Weisheit, so bitte er darum Gott, den Spender, und er wird sie erhalten“. Möge Gott durch euer Gebet uns, den Predigern, das Wort, euch, den Zuhörern, den Glauben verleihen!</p><p>Forschen wir nun nach den Zeugnissen für das Leiden Christi! Wir sind nämlich nicht zusammengekommen, um jetzt nur zu beschaulichem Zwecke die Schrift zu erklären, sondern vielmehr um uns von dem zu überzeugen, was wir glauben. Zuerst hast du Zeugnisse erhalten für das Erscheinen Jesu, auch dafür, daß er auf dem Meere wandelte; denn es steht geschrieben: „Auf dem Meere ist dein Weg“. Auch für verschiedene Heilungen hast du seinerzeit ein Zeugnis bekommen.</p><p>Ich beginne mit dem Anfang des Leidens Jesu. Judas war der Verräter. Er trat gegen Jesus heran, blieb bei ihm stehen, sprach zwar friedliche Worte, machte aber feindliche Anschläge. Darüber nun sagt der Psalmist: „Meine Freunde und die mir nahe standen traten wider mich heran und blieben stehen“. Und an anderer Stelle sagt er: „Gelinder als Öl sind ihre Worte, und doch sind sie Pfeile“. Mit den Worten: „Sei gegrüßt, Meister!“ überlieferte Judas seinen Meister dem Tode. Nicht achtete er auf das mahnende Wort: „Judas, mit einem Kusse verrätst du des Menschen Sohn?“ Es war fast, als hätte Jesus zu ihm gesagt: „Denke an deinen Namen!“ Denn Judas heißt „Bekenntnis“. Du hast einen Vertrag eingegangen, hast Geld erhalten, bekenne es sofort! „O Gott, verschweige nicht mein Lob, denn der Mund des Sünders und der Mund des Betrügers haben sich wider mich aufgetan! Geredet haben sie wider mich mit lügenhafter Zunge, mich umgeben mit Worten des Hasses“. Daß auch einige Hohepriester zugegen waren, und daß vor den Toren der Stadt die Ketten angelegt wurden, das hast du neulich erfahren. Du wirst dich wohl noch der Auslegung des Psalmes erinnern, der auf Zeit und Ort hinweist mit den Worten: „Gegen Abend kommen sie wieder, haben Hunger wie die Hunde und rennen um die Stadt“.</p><p>Bezüglich der dreißig Silberlinge vernimm das Wort: „Ich werde ihnen sagen: Wenn es gut scheint in euren Augen, dann gebt mir meinen Lohn oder verweigert ihn usw.!“ Lohn gebührt mir von eurer Seite für die Heilung von Blinden und Lahmen, aber als Lohn empfange ich statt Dank Schande, statt Anbetung Spott. Die Schrift hat, wie du siehst, es vorhergesehen: „Und sie bestimmten als meinen Lohn dreißig Silberlinge“. Wie genau hat es die Prophetie gesagt! Wie vieles hat der Hl. Geist unfehlbar gewußt! Nicht sprach er von zehn, nicht von zwanzig Silberlingen; sondern er erwähnte genau dreißig Silberlinge, und so viel waren es auch. Sage mir auch, o Prophet, wohin kommt diese Summe! Behält sie der Empfänger oder liefert er dieselbe ab? Und wenn sie abgegeben wird, wohin wandert sie? Der Prophet antwortet: „Ich nahm die dreißig Silberlinge und warf sie in das Haus des Herrn für den Schmelzofen“. Vergleiche mit der Prophezeiung das Evangelium: „Von Reue ergriffen“ — heißt es — „warf Judas die Silberlinge in den Tempel und entfernte sich“.</p><p>Es ist noch Klarheit in die scheinbaren Widersprüche zu bringen. Diejenigen, welche die Propheten verwerfen, betonen, während der Prophet sage, „und ich warf sie in das Haus des Herrn für den Schmelzofen“, erkläre das Evangelium: „und sie gaben dieselben hin zum Acker des Töpfers“. Höre nun, wie es möglich ist, daß beide die Wahrheit sagen!</p><p>Als die sogenannten frommen Juden, die damaligen Hohenpriester, sahen, daß Judas aus Reue zu ihnen sagte: „Ich habe gesündigt, da ich unschuldiges Blut überantwortet habe“, entgegneten sie: „Was geht das uns an? Da sieh du zu!“ Wirklich, soll es euch, die ihr ihn kreuziget, nichts angehen? Er, der den Lohn des Mörders erhalten, aber wieder zurückgegeben hat, soll zusehen, ihr aber, die Mörder, sollt nicht zusehen müssen? Sodann sagten sie zueinander: „Nicht ist es erlaubt, die Summe in den Tempelschatz zu legen, da sie Preis für Blut ist“. Aus eurem eigenen Munde spricht eure Verurteilung. Ist der Lohn beschmutzt, dann ist auch eure Tat beschmutzt. Hast du aber durch die Kreuzigung Christi eine gerechte Tat vollbracht, warum nimmst du den Lohn nicht an? Doch die Frage, welche wir untersuchen wollen, ist: Inwiefern ist kein Widerspruch zwischen „Acker des Töpfers“, dem Worte des Evangeliums, und „Schmelzofen“, dem Prophetenworte? Es haben doch nicht nur die Goldarbeiter einen Schmelzofen, auch nicht nur die Erzarbeiter, auch die Töpfer haben Schmelzöfen für ihren Töpferton. Sie sondern nämlich die feinen, fetten, brauchbaren Bestandteile der Erde von den kiesartigen ab, scheiden alle schlechte Materie aus und schmelzen Wasser und Ton so zusammen, daß dieser ohne weiteres zu Geschirren verarbeitet werden kann. Was wunderst du dich also, wenn das Evangelium ausdrücklich von dem Acker des Töpfers spricht, der Prophet dagegen seine Prophezeiung unbestimmter ausdrückte? Denn vielfach ist die Prophetie unbestimmt.</p><p>Sie banden Christum und führten ihn in den Hof des Hohenpriesters. Willst du den sicheren Beweis dafür, daß auch dies geschrieben steht? Isaias sagt: „Wehe ihrer Seele! Denn einen schlimmen Plan haben sie wider sich gefaßt, da sie sagten: Laßt uns den Gerechten fesseln, da er uns lästig ist!“ Fürwahr: wehe ihrer Seele! Wollen wir es sehen! Als Isaias zersägt worden war, wurde das Volk geheilt; als Jeremias in den Schmutz eines Verließes geworfen worden war, wurde die Wunde der Juden geheilt. Dieselbe war verhältnismäßig ja noch gering, weil die Juden nur gegen einen Menschen gesündigt hatten. Als aber die Juden nicht gegen einen Menschen, sondern gegen den menschgewordenen Gott sündigten, da „wehe ihrer Seele!“ „Lasset uns den Gerechten fesseln!“ Konnte also — wird man fragen — der, welcher den Lazarus nach vier Tagen aus den Ketten des Todes befreite und den Petrus im Gefängnis von den eisernen Banden erlöste, nicht sich selbst befreien? Bereit wären gewesen die Engel; denn sie sagten: „Lasset uns ihre Bande zerreißen!“ Aber da der Herr entschlossen ist, die Leiden zu ertragen, stehen sie davon ab. Ferner wurde Jesus vor das Gericht der Ältesten geführt, Zeugnis dafür hast du bereits in den Worten: „Der Herr selbst wird kommen vor das Gericht mit den Ältesten des Volkes und mit seinen Fürsten“.</p><p>Als der Hohepriester auf seine Frage die Wahrheit zu hören bekam, wird er unwillig, und der böse Diener gibt Jesus einen Backenstreich. Das Angesicht, das wie die Sonne geglänzt hatte, wollte von ruchlosen Händen geschlagen werden. Andere treten herzu und speien in das Angesicht dessen, der mit Speichel den Blindgeborenen geheilt hatte. „Vergiltst du so dem Herrn, du törichtes, unverständiges Volk?“ Der Prophet spricht verwundert: „Herr, wer glaubte unserer Predigt?“ Unglaublich war es, daß Gott, der Sohn Gottes und Arm des Herrn, solches duldet. Damit aber die Erlösten den Glauben nicht verlören, schrieb im voraus im Namen Christi der Hl. Geist: „Meinen Rücken gab ich hin den Geißeln“ — vor der Kreuzigung ließ ihn nämlich Pilatus geißeln —, „meine Wangen den Backenstreichen, nicht wandte ich mein Gesicht ab von der Schmach des Anspeiens“. Er wollte gleichsam sagen: „Zwar wußte ich voraus, daß man mich schlagen wird, aber dennoch wandte ich meine Wange nicht weg. Wie hätte ich meine Jünger zum Tode für die Wahrheit gestärkt, wenn mir selbst davor gebangt hätte? Ich erklärte:,Wer sein Leben liebt, wird es verlieren‘. Hätte ich mein Leben geliebt und nicht getan, was ich predigte, was für ein Lehrer wäre ich gewesen!“ Er, der Gott, wollte zuerst von Menschen solches leiden, damit dann wir Menschen uns nicht schämen, wenn wir seinetwegen von Menschen solches zu leiden haben.</p><p>Wie du siehst, haben die Propheten auch den erwähnten Teil des Leidens deutlich vorherverkündet. Noch viele andere Schriftzeugnisse übergehen wir, wie gesagt, wegen der Kürze der Zeit. Wenn einer genau nach allem forscht, wird er nichts in der Geschichte Christi unbezeugt finden.</p><p>[Forts. v. ] Gefesselt kam Jesus von Kaiphas zu Pilatus. Steht auch hierüber geschrieben? „Sie fesselten ihn und führten ihn als Geschenk zu König Jarim“. Doch wird ein kritischer Zuhörer einwenden: „Pilatus war nicht König.“ Viele (andere) einschlägige Fragen wollen wir einstweilen übergehen. Haben sie ihn nun gefesselt und als Geschenk zum König geführt? Lies das Evangelium: „Als Pilatus hörte, Jesus sei aus Galiläa, schickte er ihn zu Herodes“. Herodes aber war damals König und hielt sich in Jerusalem auf. Achte auf die Genauigkeit des Propheten! Er sagt, als Geschenk sei er geschickt worden. „Am gleichen Tage wurden Pilatus und Herodes miteinander befreundet; zuvor lebten sie nämlich in Feindschaft“. Es war am Platz, daß der, welcher im Begriffe war, Himmel und Erde zu versöhnen, zuerst unter seinen Richtern Friede machte. Der Herr selbst war ja zugegen, der „die Herzen der Fürsten der Erde versöhnt“. Halte fest an dem, was die Propheten genau und wahrheitsgemäß bezeugen!</p><p>Bewundere den Herrn, da er vor dem Richter steht! Er ließ es sich gefallen, von Soldaten hin- und hergeschleppt zu werden. Pilatus saß auf dem Richterstuhl, und der, welcher zur Rechten des Vaters sitzt, ließ es sich gefallen, daß er stehen mußte. Das Volk, welches er aus Ägypten und sonst noch wiederholt befreit hatte, schrie wider ihn: „Hinweg mit ihm, hinweg mit ihm! Kreuzige ihn!“ Warum, ihr Juden? Weil er eure Blinden geheilt hat? Oder weil er euren Lahmen die Kraft gegeben hat, zu gehen? Und weil er noch anderweitige Wohltaten euch erwiesen hat? Der Prophet hat darum bestürzt auch hierüber gesprochen: „Gegen wen sperrt ihr euren Mund auf, und gegen wen streckt ihr eure Zunge heraus?“ Und der Herr selbst sagt bei den Propheten: „Mein Erbe ist mir geworden wie ein Löwe im Walde; es hat wider mich seine Stimme erhoben. Darum habe ich dasselbe gehaßt. Nicht ich habe es zurückgewiesen, sondern sie haben mich zurückgewiesen. Darum erkläre ich weiterhin: Ich habe mein Haus verlassen“.</p><p>[Forts. v. ] Jesus schwieg, als man über ihn zu Gericht saß. Pilatus hatte daher Mitleid und sprach zu ihm: „Hörst du nicht, was diese wider dich bezeugen?“ Nicht als ob Pilatus den Verurteilten kannte; er fürchtete sich wegen des Traumes seiner Frau, den man ihm mitteilte. Jesus schwieg, weshalb der Psalmist sagt: „Ich war wie ein Mensch, der nicht hört und der in seinem Munde keine Widerrede hat“, und wiederum: „Ich aber hörte nicht wie ein Tauber und öffnete wie ein Stummer nicht meinen Mund“. Schon früher hast du davon gehört, wenn du dich noch erinnerst.</p><p>Die Soldaten umringen Jesus und verspotten ihn. Der Herr wird ihnen zum Gespötte, mit dem Herrscher treiben sie ihren Unwillen. „Sie sahen mich, schüttelten ihr Haupt“. Sie inszenieren eine königliche Huldigung. Sie verspotten ihn und beugen ihre Knie vor ihm. Die Soldaten kreuzigen ihn, aber zuerst legen sie ihm einen Purpurmantel an und setzen ihm eine Krone aufs Haupt. Was tut es zur Sache, daß sie aus Dornen bestand? Jeder König wird von Soldaten ausgerufen. Der Versinnbildlichung wegen mußte Jesus auch von Soldaten gekrönt werden. Daher sagt die Schrift im Hohen Liede: „Gehet hinaus und sehet, ihr Töchter Jerusalems, den König Salomo mit der Krone, mit welcher ihn seine Mutter gekrönt hat!“ Etwas Bedeutungsvolles war die Krone; sie war Erlösung von Sünden, Befreiung von der Verurteilung.</p><p>[Forts. v. ] Über Adam erging das Strafurteil: „Verflucht sei die Erde in deinen Werken! Dornen und Disteln soll sie dir tragen!“ Jesus nimmt deshalb die Dornen auf sich, um das Strafurteil aufzuheben. Und deshalb wurde er in der Erde begraben, damit die verfluchte Erde statt Fluch Segen empfange.</p><p>Als die (erste) Sünde begangen war, legten sich die Stammeltern Feigenblätter an. Darum wirkte Jesus das letzte seiner Wunder am Feigenbaume. Als er nämlich im Begriffe war, in sein Leiden zu gehen, verfluchte er den Feigenbaum. Nicht jeden Feigenbaum verfluchte er, sondern zur Versinnbildlichung nur jenen. Er sprach: „Nie mehr soll jemand von dir eine Frucht genießen!“ (D. h.:) „Das Strafurteil soll aufgehoben sein!“ Da sich die ersten Menschen seinerzeit mit den Blättern des Feigenbaumes bekleidet hatten, so kam Jesus zum Feigenbaum zu einer Zeit, da sich noch keine Frucht an ihm befand. Wer weiß nicht, daß der Feigenbaum im Winter keine Früchte trägt, sondern nur Blätter hat? Was alle wußten, sollte das Jesus nicht auch gewußt haben? Er wußte es, trat aber doch zum Feigenbaum, um an ihm zu suchen. Er wußte wohl, daß er keine Frucht daran finde, aber er wollte zu erkennen geben, daß der Fluch sich nur auf die Blätter beziehe.</p><p>Da wir die Paradiesesgeschichte berührt haben, (muß ich es sagen:) ich wundere mich tatsächlich, wie die Wahrheit sinnreich ausgesprochen war. Im Paradies der Fall, im Garten das Heil; vom Holze die Sünde, die Sünde bis zum Holze. Nach Mittag, da der Herr sich erging, verbargen sich die Stammeltern, und nach Mittag wird der Räuber vom Herrn in das Paradies eingeführt.</p><p>Aber man wird mir entgegenhalten: „Was du redest, sind deine Erfindungen. Weise mir aus den Propheten das Holz des Kreuzes nach! Bringst du mir kein Zeugnis aus den Propheten, so glaube ich nicht.“ Höre auf Jeremias und glaube!</p><p>„Ich sollte es nicht gewußt haben, daß ich wie ein schuldloses Lamm zur Schlachtbank geführt werde?“ So wie ich die Worte vorgetragen habe, als Frage, mußt du den Satz lesen. Sollte denn der, welcher sagte: „Ihr wißt, daß nach zwei Tagen Ostern ist; da wird des Menschen Sohn zur Kreuzigung ausgeliefert werden“, es nicht gewußt haben? „Ich sollte es nicht gewußt haben, daß ich wie ein schuldloses Lamm zur Schlachtbank geführt werde?“ Was für ein Lamm ist gemeint? Johannes, der Täufer, möge die Erklärung geben! Er sagt: „Siehe das Lamm Gottes, das hinwegnimmt die Sünden der Welt!“</p><p>„Sie haben einen schlimmen Plan wider mich ersonnen, indem sie sagten....“. Der, welcher die Pläne kannte, sollte nicht gewußt haben, was geschehen wird?</p><p>Was sagten sie? „Wohlan, lasset uns Holz in sein Brot legen!“ Wenn der Herr dich würdigt, wirst du später noch erkennen, daß nach dem Evangelium das Brot ein Bild seines Leibes war.</p><p>„Wohlan, nun lasset uns Holz in sein Brot legen und ihn vertilgen aus dem Lande der Lebendigen!“ Das Leben wird nicht vertilgt. Was müht ihr euch vergeblich ab?</p><p>„Und seines Namens soll nicht mehr gedacht werden!“ Vergeblich ist euer Plan. Denn „angesichts der Sonne dauert sein Name“ in der Kirche. Weil es das Leben war, das am Kreuze hing, weinte Moses und sagte: „Und dein Leben wird vor deinen Augen hängen, und du wirst dich fürchten Tag und Nacht, und nicht wirst du deinem Leben glauben“. Auch in der eben gegebenen Lesung heißt es: „Herr, wer glaubte unserer Predigt?“</p><p>[Forts. v. ] Ein Vorbild des Kreuzes fertigte Moses, indem er die Schlange kreuzigte, damit, wer von der lebenden Schlange gebissen werde, beim Anblick der ehernen Schlange auf Grund des Glaubens gerettet werde. Eine gekreuzigte eherne Schlange bringt das Heil, und der gekreuzigte menschgewordene Gottessohn soll es nicht bringen? Immer ist es das Holz, durch welches Leben kam. Zur Zeit des Noë wurde durch die hölzerne Arche das Leben gerettet. Als das Meer zur Zeit des Moses den Stab, das Vorbild (des Kreuzes), erblickte, wich es erschrocken vor seinem Schlage zurück. Der Stab des Moses hatte Macht, und das Kreuz des Erlösers sollte machtlos sein? Doch, um kurz zu sein, übergehe ich viele Vorbilder. (Zur Zeit des Moses wurde das Wasser durch das Holz süß.)</p><p>Auf das Holz floß Wasser aus der Seite Jesu. Blut und Wasser sind der Anfang der Moses-Wunder, sie sind anderseits das Ende aller Wunder Jesu. Moses fing damit an, den Fluß in Blut zu verwandeln; Jesus schloß damit, daß er Wasser und Blut aus seiner Seite fließen ließ. Letzteres geschah vielleicht mit Bezug auf die Stimme des Richters und das Rufen des schreienden Volkes oder wegen der Gläubigen und der Ungläubigen. Pilatus nämlich erklärte: „Ich bin unschuldig“ und wusch sich seine Hände mit* Wasser*; das Volk aber schrie: „Sein* Blut* komme über uns!“ Beides floß aus der Seite: das Wasser wohl für den Richter, das Blut für das schreiende Volk. Jene Tatsache kann auch noch anders verstanden werden: für die Juden war das Blut, für die Christen das Wasser. Über jene, seine Feinde, kam aus dem Blute der Fluch, während du als Gläubiger jetzt durch das Wasser das Heil erlangst. Nichts ist ohne Bedeutung.</p><p>Unsere Väter haben in ihrer Schrifterklärung noch einen anderen Grund für jene Tatsache angegeben. Da die heilsame Taufe nach den Evangelien in doppelter Weise wirkt, einerseits in den Täuflingen durch das Wasser, andererseits zur Zeit der Verfolgung in den heiligen Märtyrern durch deren eigenes Blut, kam aus der Seite des Erlösers Blut und Wasser, um sowohl das bei der Taufe wie in der Zeit des Martyriums für Christus abgelegte Bekenntnis als genehm zu bestätigen.</p><p>Es gibt noch eine andere Erklärung für die Seitenwunde. Die erste Ursache der Sünde war das aus der Seite gebildete Weib. Als aber Jesus gekommen war, um sowohl Männern wie Frauen Verzeihung zu schenken, ließ er sich der Frauen wegen die Seite durchbohren, um die Sünde hinwegzunehmen.</p><p>[Forts. v. ] Will einer nachforschen, dann wird er noch weitere Gründe finden. Allein das Gesagte genügt wegen der Kürze der Zeit und um den Ohren der Zuhörer nicht lästig zu werden. Doch darf man nie müde werden, auf die Lehre vom gekrönten Herrscher zu hören, vor allem hier auf dem hochheiligen Golgatha. Während andere nur von ihm hören, sehen und berühren wir ihn. Keiner ermüde! Ergreife gerade für das Kreuz die Waffen gegen die Feinde! Pflanze den Glauben an das Kreuz als Siegeszeichen auf gegen die, welche widersprechen! So oft du mit Ungläubigen über das Kreuz Christi disputieren willst, mache zuvor mit der Hand das Zeichen des Kreuzes Christi, und der Gegner verstummt. Schäme dich nicht, das Kreuz zu bekennen! Erklären doch die Engel mit Stolz: „Wir wissen, wen ihr suchet. Jesum, den Gekreuzigten“. Hättest du, o Engel, nicht sagen können: „Ich weiß, wen ihr suchet. Meinen Herrn.“ Doch erklärt er mit Nachdruck: „Ich weiß. Den Gekreuzigten.“ Denn das Kreuz ist eine Ehrenkrone, keine Schmach.</p><p>Kehren wir zurück zu den in Angriff genommenen Beweisen aus den Propheten! Der Herr ist gekreuzigt worden. Dafür hast du Zeugnisse. Du siehst den Golgatha. Freudig rufst du Beifall. Siehe zu, daß du in der Zeit der Verfolgung deine Gesinnung nicht änderst! Nicht bloß in der Zeit des Friedens sollst du dich des Kreuzes freuen, du sollst auch in der Zeit der Verfolgung an einem und demselben Glauben festhalten! Sei nicht in der Zeit des Friedens ein Freund Jesu, zur Zeit des Krieges sein Feind! Da du jetzt Nachlassung deiner Sünden und die geistigen Gnadengeschenke des Königs empfängst, mußt du im Falle des Krieges mutig für deinen König kämpfen. Der sündelose Jesus ist für dich gekreuzigt worden, und du willst dich nicht für den kreuzigen lassen, der für dich gekreuzigt worden ist? Du erweisest ihm (mit deinem Kreuze) keine Gnade; denn du hast zuerst empfangen. Dank ist es, wenn du leidest, was du dem schuldig bist, der deinetwegen auf dem Golgatha gekreuzigt worden ist.</p><p>Golgatha heißt so viel als „Schädelstätte“. Wer sind nun diejenigen, welche prophetisch diesen Ort hier Golgatha genannt haben, auf dem Christus, das wahre Haupt, das Kreuzesleiden erduldet hat? (Ergänze: Die Juden haben den Ort prophetisch Schädelstätte genannt. Daß nun diese prophetische Bezeichnung sich auf Christus bezieht, ergibt sich aus der Lehre Pauli.) Der Apostel sagt nämlich: „Er ist das Bild des unsichtbaren Gottes.... Er ist das Haupt des Leibes der Kirche“, und an anderer Stelle: „Eines jeden Mannes Haupt ist Christus“, und wiederum: „Er ist das Haupt jeder Macht und Herrschaft“. Dieses* Haupt* hat auf der* Schädel*stätte gelitten. Ein bedeutungsvolles, prophetisches Wort! Es ist, als ob schon das Wort (Golgatha) dich auffordern wollte: Sieh den Gekreuzigten nicht bloß für einen Menschen an; er ist das Haupt jeder Macht und Herrschaft! Er ist das gekreuzigte Haupt jeder Herrschaft und hat den Vater zum Haupte; denn „das Haupt des Mannes ist Christus, das Haupt Christi aber ist Gott“.</p><p>[Forts. v. ] Christus wurde für uns gekreuzigt. Verurteilt war er worden nachts, da es kalt war und deshalb Kohlenfeuer brannte. Gekreuzigt wurde er in der dritten Stunde. Von der sechsten Stunde an bis zur neunten Stunde war Finsternis, von der neunten ab wurde es wieder helle. Steht auch hierüber etwas geschrieben? Wollen wir sehen! Zacharias sagt: „Und an jenem Tage wird nicht sein Licht, sondern Kälte und Frost wird sein einen Tag lang“. Kälte — denn Petrus wärmte sich. „Und jener Tag ist dem Herrn bekannt“. Kennt etwa der Herr die anderen Tage nicht? Es sind viele Tage; doch dies ist der Tag des Herrenleidens, „den der Herr gemacht hat“. „Und jener Tag ist dem Herrn bekannt, und er ist nicht Tag und nicht Nacht“. Was will der Prophet sagen mit den rätselhaften Worten: „jener Tag ist weder Tag noch Nacht“? Was sollen wir darunter verstehen? Das Evangelium gibt die Erklärung. „Es war nicht Tag“, d. h. nicht leuchtete die Sonne vom Aufgange bis zum Untergange, sondern mitten während des Tages, von der sechsten bis zur neunten Stunde, war Finsternis. Zwischen drin war es finster; die Finsternis aber hatte Gott Nacht genannt. Es war also weder Tag noch Nacht. Es war weder ganz Licht, so daß es hätte Tag genannt werden können, noch war es ganz Finsternis, so daß man sie hätte Nacht nennen können. Schien doch wieder nach der neunten Stunde die Sonne. Auch dies prophezeit der Prophet. Denn nach den Worten: „Er ist nicht Tag und nicht Nacht“ fügte er hinzu: „und gegen Abend wird es Licht sein“. Siehst du, wie genau die Propheten berichten? Erkennst du die Wahrheit dessen, was vorherverkündet war?</p><p>Du möchtest genau die Stunde wissen, da die Sonne verschwand. War es in der fünften oder achten oder zehnten Stunde? Gib, o Prophet, den tauben Juden genaue Auskunft, wann die Sonne untergeht! Der Prophet Amos erklärt: „An jenem Tage, sagt Gott, der Herr, da wird zur Mittagszeit die Sonne untergehen“; von der sechsten Stunde an war ja Finsternis. „Und auf der Erde wird das Licht am hellen Tage sich verdunkeln“. Was für eine Zeit, o Prophet, und was für ein Tag wird es sein? „Ich werde eure Feste in Trauer verwandeln“; es geschah ja zur Zeit der ungesäuerten Brote und am Osterfeste. Weiter sagt Amos: „Und ich werde ihn machen zur Trauer um den Geliebten und um die, welche bei ihm sind, zum Tage des Schmerzes“. Am Tage der ungesäuerten Brote und am Feste nämlich klagten und weinten ihre Frauen, die Apostel aber verbargen sich vor Schmerz.</p><p>Staunen muß man über die Prophezeiung.</p><p>[Forts. v. ] Doch — wird man sagen — gib mir noch einen anderen Beweis! Was für einen deutlichen Beweis gibt es noch für die Tatsache (des Leidens Jesu)? Als Jesus gekreuzigt wurde, hatte er nur einen Rock und einen Mantel. Während die Soldaten den Mantel in vier Teile zerschnitten, um ihn zu verteilen, blieb der Rock, weil er andernfalls wertlos geworden wäre, unzerschnitten und wurde von den Soldaten verlost. Der Mantel wird geteilt, der Rock verlost. Steht auch hierüber etwas geschrieben? Das wissen die eifrigen Psalmensänger der Kirche, welche in Nachahmung der Engelschöre stets Gott preisen. Sie haben die Ehre, hier auf dem Golgatha die Psalmen zu singen und zu sprechen: „Meine Kleider haben sie unter sich verteilt, und über mein Gewand warfen sie das Los“. Dieses Los war die Verlosung (durch die Soldaten).</p><p>Als Jesus bei Pilatus verurteilt wurde, trug er ein rotes Gewand. Dort „legten sie ihm einen scharlachroten Mantel um“. Ist auch hierüber geschrieben? Isaias sagt: „Wer ist dieser, der aus Edom kam, dessen rote Kleider aus Bosor sind?“ Wer ist der, welcher ein scharlachrotes Gewand trägt zur* Schmach*? Denn dies bedeutet bei den Hebräern Bosor. „Warum sind rot deine Gewänder und deine Kleider wie die eines Keltertreters?“ Er aber antwortet: „Den ganzen Tag habe ich meine Hände ausgestreckt nach einem ungehorsamen, widerspenstigen Volke“.</p><p>[Forts. v. ] Ausgestreckt hat er seine Hände am Kreuze, um den ganzen Erdkreis zu umfassen. Denn der Mittelpunkt der Erde ist der Golgatha hier. Das ist nicht meine Lehre; der Prophet hat es gesagt: „Du hast das Heil gewirkt in der Mitte der Erde“. Er, der mit seinen geistigen Händen den Himmel befestigt hat, hat seine menschlichen Hände ausgestreckt. Mit Nägeln wurden sie angeheftet. Dadurch, daß die mit den Sünden der Menschen beladene Menschheit ans Holz geheftet wurde und starb, sollte zugleich die Sünde sterben, wir dagegen in Gerechtigkeit auferstehen. Denn da durch* einen* Menschen der Tod gekommen ist, kommt durch* einen* Menschen das Leben, durch den* freiwilligen* Tod des einen Menschen, des Erlösers. Erinnere dich an das Wort: „Ich habe Macht, mein Leben hinzugeben, und habe Macht, es wieder zu nehmen“.</p><p>Da Jesus gekommen war, alle zu erlösen, nahm er solches Leiden auf sich. Doch das Volk lohnte es schlecht. Jesus, der aus hartem Felsen für sie Wasserquellen ließ, muß sagen: „Mich dürstet“. Er verlangte von dem Weinstock, den er gepflanzt hatte, Früchte. Doch was tat der Weinstock, der seiner Natur nach von den heiligen Vätern stammte, seiner Gesinnung nach aber aus Sodoma? „Ihr Weinstock ist nämlich aus Sodoma und ihre Rebe aus Gomorrha“. Da der Herr dürstet, füllt man einen an einem Rohr befestigten Schwamm mit Essig und reicht ihm davon. „Und sie gaben mir Galle zur Speise, und in meinem Durste tränkten sie mich mit Essig“. Deutlich haben, wie du siehst, die Propheten vorhergesprochen. Was für ein bitteres Getränk war es, das man ihm in den Mund gab? „Sie gaben ihm“ — heißt es — „mit Myrrhe gemischten Wein“. Myrrhe ist nämlich gallig und bitter. So dankt ihr dem Herrn? Solche Gabe bringt der Weinstock seinem Herrn? Mit Recht weinte einst Isaias über euch und sagte: „Mein Geliebter hatte einen Weinberg auf einer Höhe, an fettem Orte“. Um nicht die ganze Stelle zu zitieren: ‚„Ich erwartete — heißt es — daß er Trauben brächte‘, (d. h.) ich dürstete darnach, daß er Wein gäbe.,Doch er brachte Dornen‘. Du siehst doch die Krone, welche ich trage. Wie lasse ich es nun merken?,Den Wolken werde ich befehlen, nicht auf ihn zu regnen‘“. Denn die Wolken, die Propheten, sind von ihnen genommen. Propheten gibt es von nun an (nur) noch in der Kirche. Darum sagt Paulus: „Zwei oder drei Propheten sollen reden, die übrigen sollen urteilen!“ Und an anderer Stelle sagt er: „Gott hat in der Kirche die einen als Apostel, die anderen als Propheten aufgestellt“. Ein Prophet war Agabus, der sich Füße und Hände band.</p><p>Über die Räuber, welche mit Jesus gekreuzigt worden waren, heißt es: „Er ist unter die Missetäter gerechnet worden“. Ehedem waren beide Missetäter gewesen. Der eine aber war es dann nicht mehr. Der andere jedoch blieb bis zum Ende ein Missetäter und war unempfänglich für das Heil; seine Hände waren zwar fest gebunden, aber seine Zunge lästerte und verletzte.</p><p>Juden, die des Weges kamen, schüttelten das Haupt und verspotteten den Gekreuzigten. Sie erfüllten das Wort der Schrift: „Sie sahen mich an und schüttelten das Haupt“. Jener Räuber aber lästerte mit ihnen, während der andere ihn wegen der Lästerung zurechtwies. Für den letzteren war des Lebens Ende der Anfang eines besseren Lebens, war die Hingabe der Seele der Empfang des Heiles. Nachdem er den anderen Räuber verwiesen hat, spricht er: „Gedenke meiner, o Herr!“ D. i.: An dich richte ich mein Wort, gib diesen auf, geblendet sind die Augen seines Geistes! Meiner aber gedenke! Nicht sage ich: Gedenke meiner Werke; denn diese ängstigen mich. Jeder Mensch hat Sympathie für seinen Reisegefährten, ich bin dein Reisegefährte auf dem Wege zum Tode. Gedenke meiner, deines Reisegefährten! Nicht jedoch sage ich: jetzt schon gedenke meiner, sondern „wenn du in dein Reich kommst“.</p><p>Welche Macht hat dich, Räuber, erleuchtet? Wer hat dich gelehrt, den anzubeten, der geschmäht und mit dir gekreuzigt wurde? O ewiges Licht, das die erleuchtet, welche in der Finsternis sind! Mit Recht bekam der Räuber das Wort zu hören: „Sei getrost!“ Nicht als ob deine Taten verdient hätten, daß du getröstet wirst, sondern weil der König bereit ist, Gnade zu erweisen. Lange brauchte es, bis der Räuber (um Verzeihung) bat; rasch aber war die Gnade. ‚„Wahrlich sage ich dir: heute wirst du bei mir im Paradiese sein‘; denn heute hast du meine Stimme gehört und hast du dein Herz nicht verhärtet. Gar schnell habe ich über Adam das Urteil gefällt; gar schnell schenke ich dir Gnade. Zu Adam war gesagt worden:,An dem Tage, an welchem ihr davon essen werdet, werdet ihr des Todes sterben‘. Du bist heute dem Glauben gefolgt, und heute schon wird dir das Heil. Adam ist wegen des Holzes gefallen; du wirst vom Holze weg in das Paradies eingeführt. Fürchte nicht die Schlange, sie vertreibt dich nicht, sie ist aus dem Himmel gefallen. Nicht sage ich zu dir: heute wirst du hinscheiden, sondern heute wirst du bei mir sein. Sei getrost, nicht wirst du vertrieben werden! Fürchte nicht das flammende Schwert! Es fürchtet den Herrn.“ O große, unaussprechliche Gnade! Noch nicht war der gläubige Abraham in das Paradies eingegangen, und der Räuber tritt ein. Noch nicht waren Moses und die Propheten eingegangen, und der sündhafte Räuber tritt ein. Vor dir hat sich schon Paulus darüber gewundert; denn er sagte: „Wo die Sünde voll war, war die Gnade übervoll“. Die, welche „die Hitze ertragen hatten“, waren noch nicht eingegangen, und der, welcher erst in der elften Stunde kam, ist eingetreten. Niemand darf gegen den Hausvater murren; denn er sagt: „Freund, ich tue dir nicht Unrecht. Habe ich nicht die Macht, auf meinem Gebiete zu tun, was ich will?“ Der Räuber ist entschlossen, Gutes zu tun; doch der Tod kommt ihm zuvor. Ich warte nicht auf die Tat, ich nehme schon den Glauben an. „Ich, der ich weide unter den Lilien, bin gekommen zu weiden in den Gärten“. Das Schaf, das ich verloren habe, habe ich gefunden und nehme ich auf meine Schulter. Er glaubt ja; denn er sprach: „Ich ging in die Irre wie ein verlorenes Schaf. Gedenke meiner, o Herr, wenn du in dein Reich, kommst!“</p><p>Von diesem Garten hier habe ich in meinen Liedern an meine Braut vorausgesungen, da ich zu ihr sprach: „Ich kam in meinen Garten, meine Schwester und Braut“. „Es war aber an der Stätte, wo er gekreuzigt wurde, ein Garten“. Was holst du dort? „Ich pflückte meine Myrrhe“.</p><p>Nachdem Jesus den ihm dargereichten, mit Myrrhe gemischten Wein und den Essig getrunken hatte, sprach er: „Es ist vollbracht“. Vollbracht war nämlich das Geheimnis, erfüllt die Schrift, erlassen die Sünden. Denn „Christus, der als Hoherpriester der zukünftigen Güter gekommen war, ist durch das größere und vollkommenere Zelt, welches nicht von Menschenhänden gemacht war, d. i. nicht durch ein geschöpfliches Zelt, auch nicht durch das Blut von Böcken und Kälbern, sondern durch das eigene Blut ein für allemal in das Heiligtum eingegangen und hat ewige Erlösung gefunden. Wenn nämlich das Blut von Stieren und Böcken und die Besprengung der Unreinen mit der Asche der (roten) Kuh fleischliche Reinheit verleiht, um wieviel mehr das Blut Christi?“ Weiter heißt es: „Wir haben nun, Brüder, feste Hoffnung auf den Eintritt in das Heiligtum durch das Blut Jesu; einen neuen, lebendigen Weg hat er uns da bereitet durch den Vorhang, d. i. sein Fleisch“. Weil sein Fleisch, der Vorhang, geschändet wurde, deshalb zerriß des Tempels Vorhang, der ein Vorbild davon war. Denn es steht geschrieben: „Siehe, der Vorhang des Tempels zerriß in zwei Teile von oben bis unten“. Und nicht das Geringste blieb von ihm übrig. Da der Herr gesagt hatte: „Siehe, euer Haus wird euch leer gelassen“, wurde das Haus zusammengerissen.</p><p>Der Heiland hat durch sein Leiden, durch das Blut des Kreuzes, was im Himmel und auf Erden ist, versöhnt. Durch die Sünde waren wir nämlich Feinde Gottes, und Gott hatte auf die Sünde Todesstrafe gesetzt. Eines von beiden war nun notwendig: entweder mußte Gott als der Wahrhaftige alle vernichten, oder er mußte als der Barmherzige das Urteil aufheben. Doch siehe Gottes Weisheit! Das Urteil hielt er konsequent aufrecht, ohne seine Barmherzigkeit wirkungslos zu machen. Christus „nahm die Sünden mit seinem Leibe an das Holz“, damit wir durch seinen Tod den Sünden ersterben und der Gerechtigkeit leben. Kein Geringer war der, welcher für uns gestorben ist. Nicht war er ein unvernünftiges Lamm. Nicht war er ein einfacher Mensch. Nicht war er nur ein Engel. Er war vielmehr der menschgewordene Gott. Die Ungerechtigkeit der Sünder war nicht so groß wie die Gerechtigkeit dessen, der für uns gestorben ist. Wir haben nicht so viel gesündigt, als derjenige Gerechtigkeit geübt hat, welcher sein Leben für uns hingegeben hat. Er gab es hin, als er wollte, und er nahm es wieder, als er wollte. Willst du Gewißheit dafür haben, daß er nicht gezwungen sein Leben opferte, daß er nicht unfreiwillig seinen Geist aufgab? Zu seinem Vater sprach er: „Vater, in deine Hände empfehle ich meinen Geist“. (D. h.) ich gebe ihn hin, um ihn wieder zu nehmen. „Nach diesen Worten gab er seinen Geist auf“. Jedoch nicht auf längere Zeit; denn bald stand er wieder von den Toten auf.</p><p>Wegen der Sonne der Gerechtigkeit verfinsterte sich die Sonne. Felsen zersprangen wegen des geistigen Felsen. Gräber öffneten sich, und Tote standen auf um dessentwillen, der „frei war unter den Toten“. „Er entließ seine Gefangenen aus einer Grube, die kein Wasser hat“. Schäme dich also des Gekreuzigten nicht, sondern bekenne auch du es freudig: „Dieser trägt unsere Sünden und leidet unsertwegen, und durch seine Striemen wurden wir geheilt“. Lasset uns gegen den Wohltäter nicht undankbar sein! An anderer Stelle heißt es: „Um der Sünden meines Volkes willen wurde er zum Tode geführt; ich werde die Gottlosen für sein Begräbnis und die Reichen für seinen Tod hingeben“. Deshalb sagt Paulus ausdrücklich: „Christus ist für unsere Sünden gestorben gemäß der Schrift, er ist begraben worden und am dritten Tage der Schrift gemäß auferweckt worden“.</p><p>[Forts. v. ] Genau wollen wir wissen, wo Jesus begraben worden ist. Ist sein Grab von Menschenhänden gemacht? Ragt es nach Art der Königsgräber empor? Ist das Grabmal mit Backsteinen erbaut? Was steht auf demselben? Ihr Propheten, gebt uns genaue Antwort, wo das Grab liegt, wo wir es zu suchen haben! Sie sagen: „Schauet hinein in den harten Felsen, den ihr ausgehauen habt! Schauet hinein und fürchtet euch!“ In den Evangelien liest du: „in einem ausgehauenen Grabe, welches in einen Felsen gehauen war“. Was geschieht? Wie war die Türe des Grabmals? Ein anderer Prophet sagt: „In der Grube töteten sie mein Leben und legten einen Stein über mich“. Ich, „der auserlesene, kostbare Eckstein“, werde auf einige Zeit unter einen Stein gelegt; Stein des Anstoßes bin ich für die Juden, ein heilsamer Stein für die Gläubigen. In die Erde gepflanzt wurde das Holz des Lebens, damit die verfluchte Erde Segen genieße und die Toten erlöst werden.</p><p>Schämen wir uns also nicht, den Gekreuzigten zu bekennen! Besiegeln wir vertrauensvoll mit den Fingern die Stirne, machen wir das Kreuzzeichen auf alles, auf das Brot, das wir essen, über den Becher, den wir trinken! Machen wir es beim Kommen und Gehen, vor dem Schlafe, beim Niederlegen und Aufstehen, beim Gehen und Ruhen! Groß ist dieses Schutzmittel. Unentgeltlich ist es der Armen wegen; der Schwachen wegen kostet es keine Mühe. Von Gott kommt ja die Gnade. Das Kreuz ist das Kennzeichen der Gläubigen, der Schrecken der Dämonen. „Durch das Kreuz hat Christus nämlich über sie triumphiert, offen sie bloßstellend“ So oft sie das Kreuz sehen, erinnern sie sich des Gekreuzigten. Sie fürchten sich vor dem, der dem Drachen die Köpfe zertreten hat. Schätze das Siegel nicht deshalb gering ein, weil es unentgeltlich gegeben worden ist, vielmehr ehre gerade deshalb um so mehr den Wohltäter!</p><p>[Forts. v. ] Kommst du einmal mit jemandem in einen Disput, in welchem es dir an Beweisgründen fehlt, gleichwohl muß dir der Glaube fest bleiben. Besser aber ist es, sich gründlich zu bilden und den Juden mit Prophetenworten, den Heiden aber mit ihren eigenen Mythologien den Mund zu stopfen.</p><p>Die Heiden beten jene an, welche vom Blitz getroffen wurden. Der Blitz, der vom Himmel kommt, kommt nun aber nicht von ungefähr. Wenn die Heiden sich nicht schämen, diejenigen anzubeten, welche Gott haßt und mit seinem Blitz tötet, solltest dann du dich schämen, den für dich gekreuzigten Gottessohn, welchen Gott liebt, anzubeten? Schämen würde ich mich, auf die Geschichten ihrer sogenannten Götter einzugehen; ich übergehe sie auch wegen Zeitmangels. Wer ihre Geschichten kennt, mag darüber berichten.</p><p>Auch allen Häretikern soll der Mund verstopft werden. Wenn einer behauptet, das Kreuz sei Wahn, dann kehre ihm den Rücken! Hasse diejenigen, welche lehren, Christus sei nur zum Scheine gekreuzigt worden! Wäre er nämlich zum Scheine gekreuzigt worden, dann wäre das Heil, welches vom Kreuze kommt, ebenfalls nur Schein. Ist das Kreuz Schein, dann ist auch die Auferstehung Schein. Ist aber Christus nicht auferweckt worden, dann sind wir noch in unseren Sünden. Wenn das Kreuz Schein ist, dann ist auch unsere Annahme (an Kindes Statt) Schein. Ist unsere Annahme Schein, dann ist auch die zweite Ankunft Schein, und alles Weitere ist ohne Wirklichkeit.</p><p>Vor allem greife zum Kreuze, dem unerschütterlichen Fundament! Darauf baue, was sonst noch zum Glauben gehört! Verleugne den Gekreuzigten nicht! Denn, wenn du ihn verleugnest, wirst du viele Ankläger haben. Zuerst wird dich Judas, der Verräter, anklagen; denn der Verräter weiß, daß Jesus von den Hohenpriestern und Ältesten zum Tode verurteilt wurde. Zeugen sind die dreißig Silberlinge. Zeuge ist Gethsemane, wo der Verrat geschah. Noch nicht nenne ich den Ölberg, wo diejenigen beteten, welche nachts bei Jesus waren. Zeuge ist der Mond, der nachts schien. Zeuge ist der Tag und die Sonne, die sich verfinsterte; denn nicht vermochte sie den Frevel der Feinde zu schauen. Es klagt dich an das Feuer, an dem Petrus stand, um sich zu wärmen. Wenn du das Kreuz verleugnest, wird dich das ewige Feuer erwarten. Harte Worte rede ich, damit du nicht Hartes erfahrest. Denke an die Schwerter, welche in Gethsemane auf Jesus eindrangen, damit du nicht das ewige Schwert zu erfahren bekommst! Anklagen wird dich das Haus des Kaiphas, das durch seine jetzige Zerstörung die Macht dessen lehrt, der damals in dem Hause gerichtet worden war. Aufstehen wird wider dich am Tage des Gerichtes auch Kaiphas selbst. Aufstehen werden wider dich der Knecht, welcher Jesus den Backenstreich gab, und die, welche Jesus banden und abführten. Aufstehen werden wider dich auch Herodes und Pilatus. Sie werden etwa sprechen: „Warum verleugnest du den, der vor unserem Richterstuhle von den Juden gelästert worden war, von dem wir aber wohl wußten, daß er keine Sünde hat? Denn ich, Pilatus, wusch mir damals die Hände.“ Aufstehen werden die falschen Zeugen und die Soldaten, welche ihm den Purpurmantel anlegten und die Dornenkrone aufsetzten, welche ihn auf Golgatha kreuzigten und über sein Gewand das Los warfen. Anklagen wird dich Simon von Cyrene, der Jesus das Kreuz nachgetragen hat.</p><p>Von den Gestirnen wird dich anklagen die Sonne, die sich verfinsterte, von dem, was auf Erden wächst, der mit Myrrhe gemischte Wein, von den Rohrgewächsen das Schilfrohr, von den Kräutern der Ysop, von den Meergewächsen der Schwamm, von den Bäumen das Holz des Kreuzes. Anklagen werden — wie gesagt — die Soldaten, welche ihn annagelten und über sein Gewand das Los warfen, der Soldat, welcher mit der Lanze seine Seite öffnete, die Frauen, welche damals dabei waren, der Vorhang des Tempels, welcher damals zerriß, das Prätorium des Pilatus, welches jetzt in Trümmern liegt durch die Macht dessen, der damals gekreuzigt worden war, ferner dieser heilige, hochgelegene Golgatha hier, den man noch heutigen Tages sehen kann und der noch jetzt es zeigt, daß seinerzeit Christus wegen die Felsen sich spalteten, das nahegelegene Grab, in dem er beigesetzt wurde, der vor den Eingang gesetzte Stein, der noch heute beim Grabe liegt, die Engel, welche damals zugegen waren, die Frauen, welche ihn nach seiner Auferstehung anbeteten, Petrus und Johannes, welche zum Grabe liefen, Thomas, welcher seine Hand in die Seite Jesu und seine Finger in die Wundmale der Nägel legte. Unsertwegen hatte Thomas ihn fest berührt; was du, der du damals nicht dabei warst, wissen sollst, hat Thomas, der dabei war, nach göttlicher Anordnung untersucht.</p><p>Zeugen des Kreuzes sind dir die zwölf Apostel und der Erdkreis und die Welt mit ihren an den Gekreuzigten glaubenden Menschen. Schon die Tatsache, daß du jetzt hier bist, soll dich von der Macht des Gekreuzigten überzeugen. Wer war es, der dich jetzt in die Versammlung geführt hat? Welche Soldaten, welche Fesseln haben dich bezwungen? Welcher Richterspruch hat dich jetzt hierher getrieben? Fürwahr, das heilsame Siegeszeichen Jesu, das Kreuz, hat alle hierhergeführt. Das Kreuz hat sich Perser dienstbar gemacht, hat Skythen bezähmt. Das Kreuz ist es, welches den Ägyptern an Stelle des Katzen- und Hundekultes und ihrer vielfachen Verirrungen die Gotteserkenntnis gebracht hat. Das Kreuz heilt bis auf den heutigen Tag Krankheiten, bis auf den heutigen Tag treibt es Teufel aus und vernichtet das Blendwerk der Zauberei und Hexerei.</p><p>[Forts. v. ] Mit Jesus wird das Kreuz wiederum vom Himmel her kommen. Denn das Siegeszeichen wird vor dem König herziehen, damit die Juden, wenn sie denjenigen sehen, den sie durchbohrt haben, und wenn sie an dem Kreuze den erkennen, den sie geschändet haben, von Reue ergriffen wehklagen. Fürwahr, „wehklagen werden sie Stamm für Stamm“; denn dann werden sie Reue empfinden, wenn die Zeit der Reue vorbei ist. Wir dagegen werden uns stolz des Kreuzes rühmen; denn wir beten den Herrn an, der uns gesandt und für uns gekreuzigt wurde; wir beten auch nebst dem Hl. Geiste Gott den Vater an, der Jesum gesandt hat. Ihm sei Ehre in alle Ewigkeit. Amen. XIV. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort: „er ist am dritten Tage auferstanden von den Toten, aufgefahren in die Himmel, sitzet zur Rechten des Vaters“.</p><h2>15</h2><p>* Über das Wort: „er ist am dritten Tage auferstanden von den Toten, aufgefahren in die Himmel, sitzet zur Rechten des Vaters“.*</p><p>Freue dich, Jerusalem! Haltet Freudenfeste ihr alle, die ihr Jesum liebt! Denn er ist auferstanden. Freuet euch alle, die ihr ehedem getrauert habt, als ihr die Frechheiten und Ungerechtigkeiten der Juden gehört hattet! Der, welcher von den Juden an dieser Stelle mißhandelt worden ist, ist wieder auferstanden. Die Predigt vom Kreuze hat gewiß Betrübnis erregt, die fromme Botschaft der Auferstehung möge den Anwesenden Freude bringen! Die Trauer verwandle sich in Freude, das Wehklagen in Frohlocken! Unser Mund ströme über von Frohlocken und Freude! Denn nach seiner Auferstehung hat Jesus gesagt: „Freuet euch!“ Ich weiß, wie die Freunde Christi in den letzten Tagen getrauert haben; denn da die Vorträge bis zum Schluß nur von Tod und Grab sprachen, nicht aber die Auferstehung verkündeten, war man gespannt auf das, was man wünschte. Auferstanden ist der Tote, „der Freie unter den Toten“, der Befreier der Toten. Der, welcher sich geduldig schänden und mit Dornen krönen ließ, ist auferstanden, gekrönt mit dem Diadem seines Sieges über den Tod.</p><p>Wie wir für sein Kreuz die Zeugnisse angeführt haben, so wollen wir jetzt auch die glaubwürdigen Zeugnisse für seine Auferstehung erbringen. Der Apostel, den wir vor uns haben, sagt ja: „Er wurde begraben und ist am dritten Tage auferstanden gemäß der Schrift“. Da uns nun der Apostel auf die Zeugnisse der Schrift verwiesen hat, ist es gut, (auch) kennen zu lernen, was uns die Hoffnung auf unser Heil gibt, vor allem zu fragen, ob die göttlichen Schriften uns die Zeit der Auferstehung Jesu berichten, ob dieselbe im Sommer oder im Herbste oder nach dem Winter erfolge, zu fragen, wo der Heiland auferstehe, ferner, wie bei den wunderbaren Propheten der Ort der Auferstehung heiße, ferner, ob Frauen ihn suchen und nicht finden, dann ihn finden und sich freuen. Man soll nämlich bei Verlesung der Evangelien nicht meinen, das, was die heiligen Evangelien erzählen, sei nur Mythus und Dichtung.</p><p>Daß der Erlöser begraben wurde, habt ihr zur Genüge gehört in voriger Rede. Isaias sagt: „In Frieden wird sein Grab sein“; denn in seinem Grabe machte er Friede zwischen Himmel und Erde, indem er die Sünder Gott zuführte. Er sagt: „Von dem Unrecht wurde der Gerechte hinweggenommen, und in Frieden wird sein Grab sein“, ferner: „Ich werde die Sünder hingeben für sein Begräbnis“. Jakob prophezeit in der Schrift: „Er legte sich nieder und schlief wie ein Löwe und wie ein junger Löwe. Wer wird ihn wecken?“ Ähnlich heißt es im Buche Numeri: „Er legte sich nieder und ruhte wie ein Löwe und wie ein junger Löwe“. Oft habt ihr auch das Psalmwort gehört: „In den Staub des Todes hast du mich geführt“. Den Ort haben wir bezeichnet unter Hinweis auf das Wort: „Schaut hinein in den Felsen, den ihr ausgehauen habt!“</p><p>Nun mögen die Zeugnisse für seine Auferstehung folgen.</p><p>Zunächst heißt es im 11. Psalme [hebr. 12. Ps.]: „Wegen des Elendes der Dürftigen und des Seufzens der Armen werde ich jetzt aufstehen, spricht der Herr“. Allerdings halten manche dieses Zeugnis noch für zweifelhaft; denn oft steht der Herr auch auf zum Zorne, um Rache an seinen Feinden zu nehmen. Gehe also zum 15. Psalme, der ausdrücklich sagt: „Bewahre mich, o Herr, denn ich habe auf dich gehofft..... Nicht sammle ich ihre Gemeinden mit Rücksicht auf das Geblüte, und nicht gedenke ich mit meinen Lippen ihrer Namen“. Mich haben sie nämlich verleugnet und haben zu ihrem König den Kaiser erkoren. Dann heißt es weiter: „Ich sah den Herrn ständig vor mir; denn er ist zu meiner Rechten, daß ich nicht wanke..... Auch noch bis in die Nacht hinein mahnen mich meine Nieren“. Hierauf ist recht deutlich gesagt: „denn nicht wirst du meine Seele in der Unterwelt lassen, und nicht wirst du deinem Heiligen die Verwesung zu schauen geben“. Nicht sagte er: „und nicht wirst du deinem Heiligen den Tod zu schauen geben“; denn sonst wäre er nicht gestorben. Er sagt vielmehr: „Nicht schaue ich die Verwesung, ich werde nicht im Tode bleiben.“ „Kund hast du mir gemacht die Wege des Lebens“. Siehe, deutlich wird für die Zeit nach dem Tode das Leben verkündet.</p><p>Wende dich auch an den 29. Psalm [hebr. 30. Ps.]: „Ich werde dich erheben, Herr, denn du hast mich aufgenommen, und nicht hast du es zugelassen, daß sich meine Feinde über mich freuen“. Was ist geschehen? Wurdest du aus Feindes Hand befreit? Oder wurdest du erlöst, als du bereits geschlagen werden solltest? Er gibt selbst eine sehr deutliche Antwort: „Herr, du hast meine Seele aus der Unterwelt geführt“. In Psalm 15 [hebr. Ps. 16] sagt er prophetisch: „Nicht wirst du (meine Seele in der Unterwelt) lassen“; hier spricht er von dem, was geschehen soll, als von Geschehenem: „Du hast.... geführt, hast mich erlöst von denen, die hinabsteigen in die Grube“. Wann wird dies geschehen? „Am Abend kehrt Weinen ein, am Morgen Freude“. Abend war es nämlich, als die Jünger trauerten; am Morgen aber war die Freude der Auferstehung.</p><p>[Forts. v. ] Willst du auch den Ort wissen? Im Hohen Liede heißt es: „Ich ging hinab in den Nußgarten“. Ein Garten war es, wo Jesus gekreuzigt worden war. Wenn sich auch jetzt größtenteils an seiner Stelle durch kaiserliche Munifizenz herrliche Bauten erheben, es war doch ehedem ein Garten, und noch sind Spuren und Überreste desselben vorhanden. „Ein eingeschlossener Garten, eine versiegelte Quelle“. (Versiegelt) von den Juden, die sagten: „Wir haben uns erinnert, daß jener Verführer, da er noch lebte, sagte: Nach drei Tagen werde ich auferstehen. Befiehl also, daß das Grab bewacht werde!.... Sie aber gingen hin und versiegelten den Stein und sicherten das Grab durch die Wache“. Mit Rücksicht auf sie hat mit Recht jemand gesagt: „Zur Ruhe wirst du sie verurteilen“. Wer aber ist „die versiegelte Quelle“, oder wer wird als Brunnen lebendigen Wassers bezeichnet? Es ist der Erlöser selbst. Denn von ihm ist geschrieben: „Bei dir ist die Quelle des Lebens“.</p><p>Was sagt Sophonias [= Prophet Zephania] im Namen Christi zu den Jüngern? „Bereite dich, stehe früh auf; verdorben ist ihr ganzer Traubenkamm“, nämlich der der Juden, bei welchen keine gesunde Traube übrig geblieben ist, ja nicht einmal ein Träubchen; ihr Weinberg ist ausgerottet. Achte, wie Jesus zu den Jüngern spricht: „Bereite dich, stehe früh auf, erwarte am Morgen die Auferstehung!“ An derselben Stelle der Schrift heißt es sodann: „Deshalb erwarte mich, spricht der Herr, am Tage meiner Auferstehung zum Martyrium!“ Wie du siehst, hat der Prophet auch vorausgesehen, daß der Ort der Auferstehung Martyrium genannt werden wird. Warum denn hat diese Stätte des Golgatha und der Auferstehung nicht wie die übrigen Kirchen den Namen Kirche, sondern den Namen „Martyrium“? Doch wohl wegen der Prophezeiung: „am Tage meiner Auferstehung zum Martyrium“.</p><p>Wer ist dieser, und woran ist der Auferstandene zu erkennen? An der gleichen Prophetenstelle heißt es weiter ausdrücklich: „Alsdann werde ich die Sprache umändern für die Völker“ — nach der Auferstehung nämlich wurde bei der Sendung des Hl. Geistes die Gabe der Sprachen verliehen — „auf daß die Völker dem Herrn dienen unter* einem* Joche“. Was führt derselbe Prophet noch als Kennzeichen dafür an, daß sie dem Herrn „unter* einem* Joche dienen“? „Von jenseits der Ströme Äthiopiens werden sie mir Opfer bringen“. Du weißt, daß in der Apostelgeschichte geschrieben ist, ein Äthiope, ein Eunuche, sei von jenseits der Ströme Äthiopiens gekommen.</p><p>Da also die Schrift die Zeit, die Eigenart des Ortes und die Ereignisse nach der Auferstehung angibt, so glaube nun fest an die Auferstehung, und niemand möge dich vom Bekenntnis des von den Toten auferstandenen Christus abwendig machen!</p><p>[Forts. v. ] Noch ein anderes Zeugnis sollst du im 87. Psalme [hebr. 88. Ps.] erhalten. Christus spricht nämlich in den Propheten; denn derselbe, welcher später erschienen ist, hat damals gesprochen: „O Herr, du Gott meines Heiles, Tag und Nacht rufe ich vor dir“. Und bald darauf sagt er: „Ich bin geworden wie ein Mensch ohne Hilfe, frei unter den Toten“. Nicht sagte er: „Ich bin geworden ein Mensch ohne Hilfe“, sondern „* wie* ein Mensch ohne Hilfe“. Denn nicht wurde er infolge Schwachheit gekreuzigt, sondern freiwillig. Nicht war sein Tod die Folge von Schwachheit und erfolgte wider seinen Willen. „Denen wurde ich zugezählt, welche in die Grube hinabsteigen“. Welches ist das Erkennungszeichen? „Meine Bekannten hast du von mir entfernt“. Die Jünger sind ja geflohen. „Wirst du denn an Toten Wunder tun?“ Bald darauf fährt er fort: „Ich habe, o Herr, zu dir gerufen, und morgen wird mein Gebet zu dir kommen“.</p><p>Wie du siehst, ist sowohl die Zeit und Stunde des Leidens als auch der Auferstehung geoffenbart.</p><p>Welches ist der Ort, an dem der Erlöser aufersteht? Im Hohen Liede heißt es: „Stehe auf, komme, meine Freundin!“ und weiter: „in einer Felsenhöhle“. Felsenhöhle hieß die Höhle, welche seinerzeit vor dem Eingang zum Grabmal des Heilandes sich befand und — wie hier gewöhnlich vor den Grabdenkmälern — aus dem Felsen selbst ausgehauen war. Jetzt sieht man nichts mehr davon, weil die vordere Höhle seinerzeit im Interesse des jetzigen Kunstbaues abgegraben wurde. Vor dem Felsen befand sich eine Höhle, ehe kaiserliche Munifizenz das Grabmal hatte errichten lassen.</p><p>Wo ist der Fels, vor dem die Höhle lag? Liegt er mitten in der Stadt oder an den Mauern und am Ende der Stadt? Liegt er innerhalb der alten Stadtmauer oder innerhalb der später errichteten Vormauer? Im Hohen Liede heißt es: „in einer Felsenhöhle, nahe der Vormauer“.</p><p>Zu welcher Zeit steht der Heiland auf? Ist es Sommer oder eine andere Zeit? Im Hohen Liede wiederum, und zwar kurz vor den erwähnten Worten, heißt es: „Der Winter ist vorüber, der Regen hat aufgehört und ist vorbei; die Blumen sind erschienen im Lande; gekommen ist die Zeit des Beschneidens“. Ist jetzt nicht die Erde voll Blumen, werden jetzt nicht die Weinstöcke beschnitten? Wie du siehst, heißt es deutlich, daß bereits auch der Winter vorüber sei. Der Frühling hat bereits begonnen, da wir jetzt im Monat Xanthikos stehen. Dies ist der erste Monat bei den Hebräern, die Zeit, da einst das vorbildliche Ostern gefeiert wurde und jetzt das wahre Ostern gefeiert wird. Dies ist die Zeit, da die Welt erschaffen wurde. Denn seinerzeit hatte Gott gesprochen: „Die Erde bringe hervor die Pflanzen der Wiese, die Samen tragen entsprechend ihrer Eigenart!“. Jetzt bringt jede Pflanze, wie du siehst, ihre Samen. Einstmals, als Gott Sonne und Mond erschuf, gab er diesen für Tag und Nacht gleichen Lauf — vor wenigen Tagen war Tag- und Nachtgleiche.</p><p>Dereinst sprach Gott: „Lasset uns den Menschen machen nach unserem Bild und Gleichnisse!“ Das Bild behielt der Mensch, das Gleichnis aber verlor er durch seinen Ungehorsam. Zu der gleichen Jahreszeit nun, da er das Gleichnis verloren hatte, wurde es auch wieder hergestellt. Zu derselben Zeit, da der erschaffene Mensch wegen seines Ungehorsams aus dem Paradiese vertrieben wurde, wurde der gläubige Mensch wegen seines Gehorsams in das Paradies eingeführt. Zu derselben Zeit, da der Sündenfall erfolgt war, kam auch die Erlösung; es war die Zeit der Blüten und der Beschneidung.</p><p>Der Ort des Grabes war ein Garten. Der Weinstock, welcher (dort) gepflanzt wurde, sprach: „Ich bin der Weinstock“. Gepflanzt ist er worden in die Erde, damit der Fluch, der durch Adam gekommen war, entwurzelt werde. Verurteilt war die Erde zu Dornen und Disteln. Aus der Erde sproßte der wahre Weinstock, auf daß das Wort erfüllt würde: „Wahrheit sproßte aus der Erde, und Gerechtigkeit schaute vom Himmel herab“. Was soll (nach der Schrift) der im Garten Begrabene sagen? „Ich pflückte meine Myrrhe mit meinen Gewürzen“. Und wiederum: „Myrrhe und Aloe samt allen edelsten Gewürzen“. Dies sind die Kennzeichen der Totenbestattung. In den Evangelien heißt es: „Die Frauen kamen zum Grabmal und brachten Gewürze, welche sie bereitet hatten“, auch „Nikodemus brachte eine Mischung von Myrrhe und Aloe“.</p><p>Im Hohen Liede ist weiter geschrieben: „Ich aß mein Brot mit meinem Honig“. Vor dem Leiden Bitterkeit, nach der Auferstehung Süßigkeit! Obwohl Jesus nach der Auferstehung durch verschlossene Türen eingetreten war, fand er nicht Glaube. Die Jünger meinten, einen Geist zu sehen. Er aber spricht: „Berühret mich und sehet! Leget, wie es Thomas verlangte, die Finger an den Ort meiner Nägel!“ „Da sie noch nicht glaubten und sich vor Freude verwunderten, sprach er zu ihnen: Habt ihr hier etwas zu essen? Da legten sie ihm einen Teil von einem gebratenen Fisch vor und Honigkuchen“. Wie du siehst, hat sich das Wort erfüllt: „Ich aß mein Brot mit meinem Honig“.</p><p>Ehe Jesus bei verschlossenen Türen eintrat, wurde er, der Bräutigam und Seelenarzt, von den bekannten trefflichen, mutigen Frauen gesucht. Die seligen Frauen kamen an das Grab und suchten den, der bereits auferstanden war, und noch flossen aus ihren Augen die Tränen, obwohl sie vielmehr hätten frohlocken und sich freuen sollen über seine Auferstehung. Maria kam, ihn zu suchen, wie das Evangelium erzählt, aber sie fand ihn nicht. Dann hörte sie die Engelsworte, und hierauf sah sie Christum. Ist auch hierüber geschrieben? Im Hohen Liede heißt es: „Auf meiner Ruhestätte suchte ich den, den meine Seele liebte“. Wann war es? „Auf meiner Ruhestätte suchte ich bei Nacht den, den meine Seele liebte.“ Maria — sagt (das Evangelium) — kam, „da es noch Nacht war“. „Auf meiner Ruhestätte suchte ich bei Nacht; ich suchte ihn, und nicht fand ich ihn“. Im Evangelium sagt Maria: „Sie haben meinen Herrn weggenommen, und ich weiß nicht, wohin sie ihn gelegt haben“. Doch die Engel, die damals zugegen waren, heilten die Unwissenheit. Sie sprachen: „Was sucht ihr den Lebenden unter den Toten?“ Er ist nicht allein auferstanden, sondern er ist noch mit anderen Toten auferstanden. Maria aber wußte es nicht, und in ihrem Namen sagte das Hohe Lied zu den Engeln: „Habt ihr den, den meine Seele liebt, nicht gesehen? Ein wenig nur war ich an ihnen — d. i. den beiden Engeln — vorüber, da fand ich ihn, den meine Seele liebt. Ich hielt ihn und ließ ihn nicht“.</p><p>[Forts. v. ] Nach der Erscheinung der Engel kam Jesus, um sich selbst vorzustellen. Das Evangelium berichtet: „Siehe, Jesus begegnete den Frauen und sprach: Seid gegrüßt! Sie aber traten hinzu und hielten ihn an den Füßen“. Sie hielten ihn, damit erfüllt würde das Wort: „Ich hielt ihn, und nicht werde ich ihn lassen.“ Schwach zwar war der Leib der Frau, doch stark war ihre Seele. Nicht löschte viel Wasser ihre Liebe aus, und Ströme überfluteten sie nicht. Tot war der, den sie suchten; aber doch nicht war die Hoffnung auf seine Auferstehung erloschen. Der Engel sagt zu ihnen: „‚Fürchtet euch nicht!‘ Nicht sage ich zu den Soldaten ‚Fürchtet euch nicht‘, sondern zu euch. Die Soldaten sollen sich nur fürchten, damit die Erfahrung sie belehre und sie bezeugen: ‚Wahrhaft, er war Gottes Sohn‘. Ihr aber dürft euch nicht fürchten, denn ‚vollkommene Liebe vertreibt die Furcht‘.,Gehet hin und saget es seinen Jüngern, daß er auferstanden ist..‘“. Die Frauen kehrten zurück „voll Freude und Furcht“. Steht auch dies geschrieben? Der zweite Psalm [hebr. Ps. 2], welcher das Leiden Christi ankündet, sagt: „Dienet dem Herrn mit Furcht und jubelt ihm zu mit Zittern!“ „Jubelt ihm zu“ heißt es wegen der Auferstehung des Herrn. „Mit Zittern“ heißt es mit Rücksicht auf das Erdbeben und den Engel, der einem Blitze gleich erschienen war.</p><p>Hohepriester und Schriftgelehrte ließen durch Pilatus das Grab versiegeln. Doch Jesus stand auf, und die Frauen schauten ihn. Isaias hatte die Schwäche der Hohenpriester und die Glaubensstärke der Frauen gekannt und sagt darum: „Hierher, ihr Frauen, die ihr soeben geschaut habt! Denn es ist kein vernünftiges Volk“. Hohepriester sind unvernünftig, und Frauen schauen mit eigenen Augen. Als die Soldaten zu den Hohenpriestern in die Stadt kamen und den ganzen Vorfall meldeten, sagten diese zu den Soldaten: „Erkläret, seine Jünger seien bei Nacht gekommen und haben, während wir schliefen, ihn gestohlen“. Isaias hat, im Namen dieser Soldaten sprechend, trefflich auch hierüber geweissagt: „Doch saget uns und verkündet uns einen anderen Irrtum!“ Der Auferstandene war auferstanden, und gleichwohl suchen noch die Hohenpriester die Soldaten mit Gold zu bestechen. Nicht jedoch werden von ihnen die jetzigen Kaiser bestochen. Seinerzeit haben Soldaten um Gold die Wahrheit verleugnet. Jetzt aber ist vom frommen Sinn der Kaiser diese heilige Kirche, in der wir sind, die Kirche der Auferstehung des göttlichen Erlösers, erbaut, mit Silber und Gold verziert und mit Kostbarkeiten aus Silber und Gold und kostbarem Gestein geschmückt worden. Die Hohenpriester sagen weiter: „Wenn dies vor dem Landpfleger bekannt werden sollte, werden wir ihn bereden“. Doch wenn ihr auch jene beredet, den Erdkreis werdet ihr nicht bereden. Warum denn wurden nicht, gleichwie die Wächter infolge der Flucht Petri aus dem Gefängnis verurteilt wurden, ebenso auch die Wächter Jesu Christi verurteilt? Während jene infolge Unkenntnis der Sachlage keine Entschuldigung fanden und deshalb von Herodes bestraft wurden, haben diese, obwohl sie die Wahrheit gesehen und nur des Geldes wegen verheimlicht haben, bei den Hohenpriestern Freisprechung gefunden. Nur wenige von den Juden ließen sich damals bereden, die Welt wurde gläubig. Diejenigen, welche die Wahrheit verborgen hatten, wurden vergessen; diejenigen, welche sie angenommen haben, wurden berühmt in der Kraft des Erlösers, welcher nicht nur von den Toten auferstanden ist, sondern zugleich auch Tote erweckt hat. Im Namen dieser sagt der Prophet Oseas deutlich: „Nach zwei Tagen wird er uns gesund machen, am dritten Tage werden wir auferstehen und werden vor ihm leben“.</p><p>[Forts. v. ] Da die göttlichen Schriften auf die widerspenstigen Juden keinen Einfluß haben, da diese, die ganze Schrift ignorierend, der Auferstehung Jesu widersprechen, wäre es am Platze, ihnen also zu antworten: Wenn ihr behauptet, Elisäus und Elias hätten Tote erweckt, was für einen Grund habt ihr noch, nicht an die Auferstehung unseres Erlösers zu glauben? Etwa den, daß von denen, welche seinerzeit die Zeugen unserer Lehre gewesen sind, jetzt keiner mehr lebt? Gut, stellt nun auch ihr uns die Zeugen für die Geschichte des Elisäus und Elias vor! (Ihr werdet sagen:) „Darüber steht geschrieben“. Auch die Auferstehung Jesu steht geschrieben. Warum also nehmt ihr das eine an und verwerft das andere? Über jene Ereignisse haben die Hebräer geschrieben. Auch alle Apostel waren Hebräer. Warum glaubt ihr nicht euren eigenen Leuten? Matthäus, der Evangelist, schrieb in hebräischer Sprache, und Paulus, der Heidenprediger, war Hebräer aus Hebräern, die zwölf Apostel waren aus den Hebräern. Sodann wurden fünfzehn Bischöfe in Jerusalem, wie sie aufeinander folgten, aus Hebräern gewählt. Was für einen Grund habt ihr, eure eigenen Schriften anzunehmen und die unsrigen zu verwerfen, die doch auch von Hebräern aus eurer Mitte geschrieben sind?</p><p>Doch wird man einwenden: Es ist unmöglich, daß Tote auferstehen. Nun hat aber Elisäus zweimal Tote erweckt; er erweckte einen Toten sowohl, da er noch lebte, wie nach seinem Tode. Wenn wir glauben, daß ein Toter deshalb, weil er zur Leiche des Elisäus geworfen wurde und mit ihr in Berührung kam, wieder auferstanden ist, soll dann Christus nicht von den Toten auferweckt worden sein? Übrigens während seinerzeit der Tote, welcher mit Elisäus in Berührung kam, auferstand, Elisäus selbst aber, der jenen auferweckt hatte, tot blieb, ist nun sowohl unser Toter auferstanden als auch viele andere Tote, ohne daß sie jedoch Christus berührt haben. „Viele Leiber der entschlafenen Heiligen standen nämlich auf, gingen nach der Auferstehung (Jesu) aus den Gräbern hervor, kamen in die heilige Stadt — d. i. die Stadt, in der wir jetzt leben, — und erschienen vielen“. Elisäus hatte wohl einen Toten erweckt, aber er wurde nicht Herr über den Erdkreis. Elias hatte einen Toten erweckt; nicht jedoch werden im Namen des Elias Teufel ausgetrieben. Nicht reden wir geringschätzig von den Propheten; doch preisen wir ihren Herrn mehr als sie. Nicht wollen wir uns auf Kosten des Alten Bundes überheben; denn auch der Alte Bund gehört uns. Dieser muß unseren Glauben begründen.</p><p>Doch wendet man ein: „Seinerzeit ist einer, der erst gestorben war, von dem Lebenden auferweckt worden; beweiset uns aber die Möglichkeit, daß jemand, der schon drei Tage tot war, wieder auferstanden ist, daß einer, der schon im Grabe lag, nach drei Tagen wieder aus demselben erstanden ist!</p><p>Suchen wir nach einem Zeugnis hierfür! Der Herr Jesus gibt es uns, wenn er in den Evangelien sagt: „Gleichwie nämlich Jonas drei Tage und drei Nächte im Bauche des Haies war, so wird der Sohn des Menschen drei Tage und drei Nächte im Schoße der Erde sein“. Wenn wir die Erzählung über Jonas prüfen, dann zeigt sich uns große Ähnlichkeit. Jesus wurde gesandt, Buße zu predigen; auch Jonas war dazu gesandt worden. Aber während Jonas, die Zukunft nicht kennend, die Flucht ergriff, war es Jesus eine Freude die Buße des Heiles zu predigen. Während das Meer stürmte, schlief Jonas im Schiffe und schnarchte; göttliche Fügung wollte es, daß auch, während Jesus schlief, das Meer stürmisch war, um die Macht des Schlafenden zu offenbaren. Zu Jonas sagte man: „Was schnarchst du? Stehe auf, rufe deinen Gott an, damit Gott uns rette!“ Zum Herrn sagt man: „Herr, rette uns!“ Während es dort geheißen hatte: „Rufe deinen Gott an!“ heißt es hier: „Rette uns!“ Jonas entgegnet: „Nehmet mich und werfet mich in das Meer, und das Meer wird sich euch legen“. Jesus aber gebot selbst den Winden und dem Meere, und „es entstand große Ruhe“. Jonas wurde in den Bauch des Haies geworfen; Jesus stieg freiwillig da hinab, wo der geistige Hai des Todes war. Freiwillig stieg er hinab, damit der Tod diejenigen wiedergäbe, welche er verschlungen hatte. Es war nämlich geschrieben: „Aus der Hand der Unterwelt werde ich sie befreien, vom Tode sie erlösen“.</p><p>Schließlich müssen wir uns fragen: Was ist schwieriger, daß jemand nach seiner Beerdigung wieder aus dem Grabe aufersteht, oder daß jemand in den Bauch eines Haies hinabsteigt, ohne in der so großen Wärme des Tieres zu vergehen? Wer weiß nicht, daß im Magen solche Wärme ist, daß selbst verschluckte Knochen vergehen? Wie kam es nun, daß Jonas drei Tage und drei Nächte im Bauche des Haies war, ohne zu vergehen? Wie konnte Jonas, trotzdem wir Menschen alle infolge unserer Naturanlage nur leben können, solange wir Luft atmen, drei Tage leben, ohne zu atmen und Luft zu schöpfen? Die Juden geben zur Antwort: „Die Kraft Gottes war zu Jonas hinabgestiegen, da er in der Unterwelt hin- und hergetrieben wurde.“ Während nun der Herr seinem eigenen Diener Kraft und Leben verleiht, soll er sich selbst das Leben nicht geben können? Wer jenes glaubt, muß auch dieses glauben. Wer dieses nicht glaubt, kann auch jenes nicht glauben. Ich glaube das eine wie das andere. Einerseits glaube ich, daß Jonas am Leben erhalten worden war; denn bei Gott ist alles möglich. Andererseits glaube ich, daß Christus von den Toten auferstanden ist. Vielfach bezeugt mir dies die göttliche Schrift und die bis heute wunderbar wirkende Tätigkeit des Auferstandenen. Allein stieg er in die Unterwelt, in reichem Gefolge verließ er sie. Er stieg in den Tod hinab, und viele Körper der entschlafenen Heiligen wurden durch ihn erweckt.</p><p>[Forts. v. ] Der Tod erschrak, als er sah, wie ein Fremder in die Unterwelt kam, ohne von den Ketten des Todes gefesselt zu sein. Warum, ihr Torhüter der Unterwelt, seid ihr bei seinem Anblick erschrocken? Vor wem habt ihr wider eure Gewohnheit euch gefürchtet? Der Tod floh und hat durch seine Flucht seine Furchtsamkeit verraten. Da eilten sie herbei, die himmlischen Propheten, der Gesetzgeber Moses, Abraham, Isaak und Jakob, David und Samuel, Isaias und Johannes, der Täufer, welcher es bezeugt hatte: „Du bist es, der kommen soll. Oder haben wir einen anderen zu erwarten?“ Erlöst wurden alle Gerechte, welche der Tod verschlungen hatte. So gehörte es sich nämlich, daß die trefflichen Herolde von dem König, den sie verkündet hatten, erlöst werden. Jeder der Gerechten sprach damals: „Wo ist dein Sieg, o Tod? Unterwelt, wo ist dein Stachel? Denn der Urheber des Sieges hat uns befreit.“</p><p>Ein Vorbild unseres Erlösers war der Prophet Jonas geworden, da er im Bauche des Haies betete und sprach: „Ich rufe in meiner Bedrängnis.... im Bauche der Unterwelt“. Er war im Hai, aber obwohl er im Hai war, sagt er, er sei in der Unterwelt, da er eben ein Vorbild Christi war, der in die Unterwelt hinabsteigen sollte.</p><p>Bald darauf prophezeit Jonas ganz deutlich im Namen Christi: „Mein Haupt sank unter die Spalten der Berge“. In der Tat aber war er im Magen des Haies. Was für Berge sind es nun, welche dich einschließen? „Ich weiß ja doch“ — erwidert Jonas —, „daß ich ein Vorbild dessen darstelle, welcher in das ausgehauene Felsengrab gelegt werden soll.“</p><p>Obwohl Jonas unter dem Meere war, sagt er: „In die Erde stieg ich hinab“, da er eben ein Vorbild Christi war, welcher in das Innere der Erde hinabstieg. Da Jonas voraussieht, daß die Juden die Soldaten zur Lüge auffordern und sagen: „Erkläret: man hat ihn gestohlen!“ spricht er: „Wer sich an eitle Lüge hält, der hat die Barmherzigkeit verlassen“. Ihr Erbarmer kam nämlich, ließ sich kreuzigen und stand wieder von den Toten auf, nachdem er sein Blut als Lösepreis für Juden und Heiden hingegeben hatte; die Juden aber halten sich an eitle Lügen und sagen: „Erkläret: man hat ihn gestohlen!“</p><p>Über die Auferstehung Jesu verkündet auch Isaias: „Er führte aus der Erde den großen Hirten der Schafe“. Durch das Prädikat „groß“ wollte Isaias verhindern, daß man Jesus den früheren Hirten gleich achte.</p><p>Die Prophezeiungen, die wir haben, fordern von uns den Glauben. Wer aus Unglaube fallen will, soll es so haben! Glaubst du an die Auferstehung, dann stehst du auf einem Felsen. Kein Häretiker möge dich je überreden, über die Auferstehung abfällig zu kritisieren! Noch heute nämlich behaupten die Manichäer, die Auferstehung des Erlösers sei nur Einbildung und nicht Wahrheit gewesen. Nicht hören sie auf Paulus, der da schreibt: „geworden aus dem Samen Davids dem Fleische nach“, und dann: „seit der Auferstehung Jesu Christi, unseres Herrn“. An anderer Stelle wendet Paulus sich gegen sie mit den Worten: „Sage nicht in deinem Herzen: Wer wird hinaufsteigen in den Himmel, oder wer wird hinabsteigen in die Unterwelt, nämlich um Christum von den Toten heraufzuführen!“ Wiederum an anderer Stelle schrieb er zu unserer Bestärkung: „Gedenket, daß Jesus Christus von den Toten auferweckt worden ist!“ Anderswo schrieb er: „Wäre Christus nicht von den Toten auferstanden, dann wäre unsere Predigt eitel, eitel auch unser Glaube, dann stünden wir als falsche Zeugen Gottes da, weil wir gegen Gott bezeugt hätten, daß er Christus, den er nicht auferweckt hatte, auferweckt habe“. Doch — fährt Paulus fort — „Christus ist nun aber von den Toten auferweckt worden, der Erstling der Entschlafenen“. „Er ist dem Kephas, dann den Elfen erschienen“. Willst du nicht* einem* Zeugen glauben, gut, du hast deren zwölf. „Sodann erschien er über fünfhundert Brüdern auf einmal“. Glaubt man den Zwölfen nicht, dann halte man sich an die fünfhundert! „Hierauf erschien er dem Jakobus“, seinem Bruder, dem ersten Bischofe unserer Diözese. Wenn — was sehr viel besagen will — ein Bischof von solcher Bedeutung Christum Jesum nach seiner Auferstehung sah, dann sollst du, sein Jünger, nicht ungläubig bleiben! Doch — wendest du ein — Jakobus, der Bruder, hat aus Gefälligkeit Zeugnis abgelegt. „Hierauf“ — fährt Paulus fort — „erschien er auch mir“, Paulus, seinem Feinde. Wie kann aber ein Zeugnis bezweifelt werden, das sogar ein Feind verkündet: „Ich, der frühere Verfolger, verkünde jetzt die frohe Botschaft der Auferstehung.“</p><p>[Forts. v. ] Zahlreich sind die Zeugen für die Auferstehung des Erlösers: die Nacht und der Vollmond; es war die sechzehnte Nacht. Der Fels des Grabmals, das ihn aufnahm, und der Stein werden wider die Juden aufstehen; denn er schaute den Herrn. Auch der Stein, der seinerzeit weggewälzt wurde, gibt Zeugnis für die Auferstehung; noch heute liegt er dort. Die Engel Gottes, welche dabei waren, bezeugten die Auferstehung des Eingeborenen. Ebenso Petrus, Johannes, Thomas und alle übrigen Apostel. Die einen von ihnen, welche an das Grabmal geeilt waren, sahen daselbst die Grabtücher, in welche Jesus zuvor eingewickelt worden war, nach seiner Auferstehung liegen. Andere von ihnen berührten seine Hände und Füße und sahen den Ort der Nägel. Sie alle aber wurden vom Erlöser angehaucht und gewürdigt, in der Kraft des Hl. Geistes die Sünden nachzulassen. Zeugnis für die Auferstehung gaben die Frauen, welche seine Füße umfaßten und das große Erdbeben und den glänzenden Engel, der dort war, schauten. Es gaben Zeugnis die Leintücher, welche Jesus anhatte und nach seiner Auferstehung zurückließ. Zeugnis gaben die Soldaten und das Geld, womit sie bestochen wurden. Ferner der Ort selbst, den du noch sehen kannst, und dieses Haus der heiligen Kirche, welches Kaiser Konstantin seligen Andenkens als Freund Christi erbauen und, wie du siehst, so herrlich ausschmücken ließ.</p><p>Für die Auferstehung Jesu gibt auch Zeugnis Tabitha, welche in seinem Namen von den Toten auferweckt wurde. Wie wird man den Glauben an die Auferstehung Jesu verweigern können, wenn schon der Name Jesu Tote erweckte? Zeugnis für die Auferstehung Jesu gibt auch das Meer, wie du bereits gehört hast. Zeugnis gibt der Fischfang, die glühenden Kohlen, die dort lagen, und der gebratene Fisch, der darauf war. Zeugnis gibt Petrus, der zuerst dreimal den Herrn verleugnet hatte, dann, als er ihn dreimal bekannte, den Auftrag erhielt, die geistigen Schafe zu leiten. Noch heute steht der Ölberg, welcher noch jetzt gewissermaßen die Augen der Gläubigen auf den hinweist, der auf einer Wolke auffuhr, — ein Wegweiser zur Himmelspforte, durch welche Jesus einzog. Auf Bethlehem stieg er vom Himmel herab, vom Ölberg aus kehrte er in den Himmel zurück. In Bethlehem begannen seine Kämpfe für die Menschheit, auf dem Ölberg wird er für seine Kämpfe gekrönt.</p><p>Du hast also viele Zeugen. Hier hast du den Ort der Auferstehung, hast dort im Osten den Ort der Himmelfahrt. Zu Zeugen hast du die Engel, welche dort Zeugnis gegeben haben, die Wolke, auf welcher er auffuhr, und die Jünger, welche vom Ölberg zurückkehrten.</p><p>Eine systematische Behandlung der Glaubenslehre würde verlangen, auch von der Himmelfahrt zu sprechen. Doch die Gnade Gottes hat es gefügt, daß du am gestrigen Sonntag von uns nach unseren schwachen Kräften ganz ausführlich darüber belehrt wurdest, da nach Fügung der göttlichen Gnade während des Gottesdienstes die treffenden Lesestücke von der Himmelfahrt unseres Erlösers handelten. Ich sprach da mit Nachdruck für alle, für die ganze Gemeinde der Gläubigen, ganz besonders aber mit Rücksicht auf dich. Es frägt sich jedoch, ob du auf die Worte aufgepaßt hast. Du weißt, daß der Glaube dich glauben lehrt an den, der „auferstanden ist am dritten Tage, aufgefahren in die Himmel, sitzet zur Rechten des Vaters“. Ich nehme zwar an, daß du dich noch genau an die Ausführung erinnerst, allein nebenbei will ich dir jetzt noch einmal das Gesagte ins Gedächtnis rufen. Erinnere dich, daß in den Psalmen deutlich geschrieben steht: „Gott ist aufgefahren unter Jubel“. Denke daran, daß auch die göttlichen Kräfte zueinander sprachen: „Machet auf, ihr Fürsten, eure Tore!....“. Erinnere dich auch des Psalmwortes: „Er fuhr auf zur Höhe, hat gefangen geführt die Gefangenen“. Denke auch an das Prophetenwort: „Er baut in den Himmel seine Auffahrt“, und an das, was gestern sonst noch der jüdischen Einwendungen wegen gesagt wurde!</p><p>Wenn die Juden gegen die Himmelfahrt des Erlösers einwenden, sie sei etwas Unmögliches, dann erinnere dich an das, was über die Versetzung Habakuks gesagt worden ist! Ist Habakuk von einem Engel, der ihn „am Haare des Hauptes trug“, versetzt worden, dann war es dem, welcher der Herr der Propheten und Engel ist, erst recht möglich, mit eigener Kraft vom ÖIberge aus auf einer Wolke aufzufahren und in die Himmel einzuziehen. So oft du dich an Wunder solcher Art erinnerst, weise dem Herrn, der das Wunder wirkt, noch höhere Macht zu! Die einen wurden getragen, der Herr aber trägt alles. Merke dir: Henoch wurde versetzt, Jesus aber fuhr auf! Denke an das, was gestern über Elias gesagt worden ist: Elias wurde in einem feurigen Wagen emporgenommen, Christi „Wagen aber sind zehntausend mal tausend Jubelnde“. Elias wurde aufgenommen östlich des Jordan; Christus ist östlich des Baches Cedron aufgefahren. Elias fuhr* wie* in den Himmel, Jesus in den Himmel. Elias sagte, eine doppelte Gabe werde durch den Geist dem heiligen Jünger (═ Elisäus) gegeben werden; Christus dagegen gab seinen eigenen Jüngern die Gabe des Hl. Geistes in so reichem Maße, daß sie denselben nicht nur in sich hatten, sondern auch den Gläubigen durch Handauflegung davon mitteilten.</p><p>Wenn du in solcher Weise gegen die Juden gekämpft und sie unter Hinweis auf parallele Erzählungen besiegt hast, dann gehe auf die überragende Herrlichkeit des Erlösers über und sage: die einen waren nur Diener Gottes, er aber ist der Sohn Gottes. Das Übermaß seiner Herrlichkeit wird dir bewußt werden, wenn du bedenkst, daß ein Diener Christi bis in den dritten Himmel entführt worden ist. Wenn Elias bloß bis zum ersten Himmel kam, Paulus aber bis in den dritten Himmel, dann ist Paulus doch viel größerer Ehre teilhaftig geworden. Schäme dich deiner Apostel nicht! Sie stehen nicht unter Moses, nicht hinter den Propheten. Sie sind trefflich mit den Trefflichen, ja trefflicher als die Trefflichen. Elias wurde wohl in den Himmel aufgenommen; doch Petrus hat die Schlüssel des Himmelreiches. Denn zu ihm wurde gesagt: „Was du auf Erden lösen wirst, wird im Himmel gelöst sein“. Elias wurde nur in den Himmel, Paulus sowohl in den Himmel wie in das Paradies erhoben; denn es war am Platze, daß Jesu Jünger viel reichlichere Gnaden empfingen. Paulus hörte „unaussprechliche Worte, welche kein Mensch sprechen darf“. Paulus stieg aber wieder herab von der Höhe. Nicht als ob er unwürdig gewesen wäre, im dritten Himmel zu bleiben. Er wollte vielmehr, da er Übermenschliches genossen hatte, reich an Ehren hinabsteigen, um Christus zu verkünden, für Christus zu sterben und so auch die Krone des Martyriums zu erlangen.</p><p>Die übrigen Punkte, die ich gestern während des Sonntagsgottesdienstes noch erwähnt habe, will ich übergehen. Denn bei verständigen Zuhörern genügt es, einfach an den Unterricht zu erinnern.</p><p>[Forts. v. ] Da es im Glaubensbekenntnis weiter heißt, „aufgefahren in die Himmel, sitzet zur Rechten des Vaters“, so erinnere dich auch an das, was ich wiederholt über das Sitzen des Sohnes zur Rechten des Vaters gesagt habe! Die Beschaffenheit des Thrones wollen wir nicht näher untersuchen; denn man kann ihn nicht begreifen. Nicht dulden wir jedoch, daß man böswillig behauptet, der Sohn habe erst nach der Kreuzigung, der Auferstehung und Himmelfahrt angefangen, zur Rechten des Vaters zu sitzen. Denn nicht erst im Laufe der Zeit erhielt er den Thron; sondern seitdem er ist — und er ist von Ewigkeit her gezeugt —, sitzt er zugleich mit dem Vater. Diesen Thron hat der Prophet Isaias vor der Menschwerdung des Erlösers geschaut, da er sagt: „Ich sah den Herrn sitzen auf einem hohen und erhabenen Throne....“. Denn da „den Vater noch nie jemand gesehen hat“, so war der, welcher dem Propheten seinerzeit erschienen war, der Sohn. Auch der Psalmist sagt: „Dein Thron ist bereitet von Ewigkeit; von Ewigkeit bist du“. Obwohl die Zeugnisse hierfür zahlreich sind, wollen wir uns wegen der vorgerückten Zeit hiermit begnügen.</p><p>Von dem vielen, was über das Sitzen des Sohnes zur Rechten des Vaters gesagt worden ist, ist nur einiges jetzt zu wiederholen. Der 109. Psalm [hebr. Ps. 110] sagt ausdrücklich: „Es sprach der Herr zu meinem Herrn: setze dich zu meiner Rechten, bis ich deine Feinde zum Schemel deiner Füße lege!“ Dieses Wort bestätigt der Heiland in den Evangelien, indem er sagt, David habe dies nicht aus sich, sondern infolge Eingebung des Hl. Geistes gesprochen. Er erklärt: „Wie kommt es nun, daß ihn David im Geiste einen Herrn nennt, da er sagt: Es sprach der Herr zu meinem Herrn: setze dich zu meiner Rechten?...“ Ferner hat nach der Apostelgeschichte auch Petrus, als er am Pfingstfeste mit den Elfen sich erhoben hatte, um zu den Israeliten zu sprechen, wörtlich dieses Zeugnis aus dem 109. Psalme [hebr. 110. Psalm] erwähnt.</p><p>Noch an einige andere Zeugnisse für das Sitzen des Sohnes zur Rechten des Vaters sei erinnert! Im Evangelium nach Matthäus steht geschrieben: „Doch sage ich euch: von nun an werdet ihr den Sohn des Menschen zur Rechten der Macht sitzen sehen....“. In Übereinstimmung hiermit schreibt der Apostel Petrus: „Durch die Auferstehung Jesu Christi, welcher, nachdem er in den Himmel aufgefahren ist, zur Rechten Gottes sitzt“. Der Apostel Paulus sagt im Briefe an die Römer: „Christus, der gestorben, vielmehr der auferstanden ist, der zur Rechten Gottes ist“. An die Epheser schreibt er: „Gemäß der Kraftwirkung seiner Stärke, welche er an Christus kund tat, da er ihn von den Toten auferweckte und ihn zu seiner Rechten setzte....“. Die Kolosser lehrte er: „Wenn ihr nun mit Christus auferstanden seid, so suchet, was oben ist, wo Christus zur Rechten des Vaters sitzt!“ Im Briefe an die Hebräer sagt er: „Nachdem er die Reinigung unserer Sünden vollendet hatte, setzte er sich zur Rechten der Majestät in den Höhen“. Und wiederum: „Zu welchem der Engel hat er jemals gesprochen: setze dich zu meiner Rechten, bis ich deine Feinde zum Schemel deiner Füße lege?“ Ferner: „Nachdem er das* eine* Opfer für die Sünden auf immer dargebracht hatte, setzte er sich zur Rechten Gottes, wartend, bis seine Feinde zum Schemel seiner Füße gelegt werden“. Und wiederum: „Lasset uns hinblicken auf Jesus, den Urheber und Vollender des Glaubens, welcher um der Freude willen, welche vor ihm lag, das Kreuz erduldete, der Schmach nicht achtend, und sich zur Rechten des Thrones Gottes gesetzt hat“.</p><p>Obwohl es dafür, daß der Eingeborene zur Rechten Gottes sitzt, noch viele Zeugnisse gibt, so mögen doch die gegebenen für jetzt uns genügen! Jedoch daran möchten wir noch einmal erinnern, daß der eingeborene Sohn Gottes, unser Herr Jesus Christus, nicht erst nach der Menschwerdung diese Ehre des Thronens erhalten hat, daß er vielmehr vor aller Zeit, ewig den Thron zur Rechten des Vaters inne hat.</p><p>Er aber, der Gott aller, der Vater Christi, und unser Herr Jesus Christus, der herab- und wieder hinaufgestiegen ist und zugleich mit dem Vater thront, schütze eure Seelen! Unerschütterlich und unveränderlich erhalte er eure Hoffnung auf den Auferstandenen! Er erwecke euch aus dem Tode der Sünde zu seiner himmlischen Gabe! Er würdige euch, daß ihr „in den Wolken entrückt werdet, um dem Herrn entgegenzueilen in den Lüften“ zur rechten Zeit! Bis jene Zeit der zweiten, ruhmreichen Ankunft Jesu kommt, möge er alle eure Namen in das Buch der Lebenden einschreiben — einschreiben und nicht mehr auslöschen! Denn viele fallen, und ihre Namen werden wieder ausgelöscht. Er verleihe euch allen, an den Auferstandenen zu glauben, den zu erwarten, der aufgefahren ist und wiederkommt! Nicht von der Erde kommt er. Stelle dich sicher, o Mensch, wegen der kommenden Verführer! Er verleihe, den zu erwarten, der in der Höhe thront und doch zugleich bei uns hier weilt, der sieht, ob der Glaube eines jeden wohl bestellt und fest begründet ist. Glaube nicht, daß er deshalb, weil er dem Fleische nach jetzt nicht bei uns weilt, auch dem Geiste nach ferne ist! Er ist hier mitten unter uns. Er hört, was man über ihn spricht. Er sieht, was du bei dir denkst. Er erforscht Nieren und Herzen. Er ist jetzt bereit, die Täuflinge und euch alle im Hl. Geiste dem Vater vorzustellen und zu sagen: „Hier bin ich und sind die Kinder, welche mir Gott gegeben hat“. Ihm sei Ehre in Ewigkeit. Amen.XV. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über das Wort: „und der kommen wird in Herrlichkeit, zu richten die Lebendigen und die Toten, dessen Reich kein Ende haben wird“. Über den Antichrist.</p><h2>16</h2><p>* Über das Wort: „und der kommen wird in Herrlichkeit, zu richten die Lebendigen und die Toten, dessen Reich kein Ende haben wird“. Über den Antichrist.*</p><p>Wir predigen nicht bloß* eine* Ankunft Christi, wir verkünden auch noch eine zweite, eine noch viel herrlichere als die erste. Die eine war Leidensoffenbarung, die andere zeigt das Diadem göttlicher Herrschaft. Die ganze Geschichte unseres Herrn Jesus Christus verläuft — soweit es möglich ist — in Doppelereignissen. Doppelt war seine Geburt: die Geburt aus Gott vor der Zeit und die Geburt aus der Jungfrau in der Fülle der Zeit. Doppelt war seine Herabkunft: die eine ist geheimnisvoll wie auf Vlies, die andere, die erst sein wird, ist unverhüllt. Bei der ersten Ankunft war er in einer Krippe in Windeln eingewickelt, bei der zweiten umkleidet er sich mit Licht. Bei der ersten Ankunft trug er, der Schmach nicht achtend, das Kreuz; bei der zweiten wird er in Begleitung eines Heeres von Engeln in Herrlichkeit kommen.</p><p>Wir halten uns nicht allein an die erste Ankunft, wir erwarten auch die zweite. Bei der ersten Ankunft riefen wir: „Gepriesen, der da kommt im Namen des Herrn“. Bei der zweiten wiederholen wir das Wort. Mit den Engeln werden wir dem Herrn entgegeneilen, vor ihm niederfallen und sagen: „Gepriesen, der da kommt im Namen des Herrn!“ Der Heiland wird wiederkommen, nicht um wieder gerichtet zu werden, sondern um zu richten die Richter. Er, der seinerzeit, da er gerichtet wurde, schwieg, wird dereinst den Bösewichtern die Freveltaten bei der Kreuzigung ins Gedächtnis rufen und sagen: „Solches hast du getan, und ich habe geschwiegen“. Seinerzeit kam Jesus nach göttlichem Ratschluß, um die Menschen zu belehren und zu überzeugen; dereinst werden die Menschen mit Gewalt unter seine Herrschaft gebeugt werden,auch wenn sie nicht wollen.</p><p>Von der einen wie der anderen Ankunft Jesu spricht der Prophet Malachias. „Und alsbald wird der Herr, den ihr suchet, in seinen Tempel kommen“. Hier hast du die eine Ankunft. Über die zweite verkündet er: „... und der Engel des Bundes, den ihr wollet. Sieh, es kommt der Herr, der Allmächtige! Wer wird den Tag seines Einzuges aushalten? Wer wird bestehen bei seinem Anblick? Denn er wird einherziehen wie Feuer eines Schmelzofens und wie Kraut der Walker. Er wird sitzen schmelzend und reinigend“. Gleich darauf sagt der Heiland selbst: „Ich werde zu euch kommen im Gerichte. Ein rascher Zeuge werde ich sein wider die Zauberer und Ehebrecherinnen und die, welche falsch in meinem Namen schwören usw.“. Darum versichert uns Paulus: „Wenn jemand auf diesen Grund baut Gold, Silber, Edelstein, Holz, Heu, Stroh: eines jeden Werk wird offenbar werden. Der (Gerichts-) tag wird es kundtun, denn durch Feuer wird es geoffenbart“.</p><p>Auch schon Paulus verweist auf die erwähnten beiden Parusien, da er an Titus schreibt: „Erschienen ist die Gnade Gottes allen Menschen zur Erlösung, und sie leitet uns an, abzusagen der Gottlosigkeit und den weltlichen Begierden und ein enthaltsames, rechtschaffenes und frommes Leben in dieser Zeitlichkeit zu führen in Erwartung der seligen Hoffnung und der Erscheinung der Herrlichkeit des großen Gottes, unseres Heilandes Jesus Christus“. Wie du siehst, sprach Paulus von einer ersten und zweiten Parusie. Die eine bezeichnet er als Gnade, die andere erwarten wir.</p><p>Darum haben wir euch jetzt durch Übergabe des Glaubensbekenntnisses angewiesen, zu glauben an den, der „aufgefahren ist in die Himmel, sitzet zur Rechten des Vaters und kommen wird in Herrlichkeit, zu richten die Lebendigen und die Toten, und dessen Reich kein Ende haben wird“.</p><p>Unser Herr Jesus Christus wird von den Himmeln kommen. Am Ende dieser Welt, am Jüngsten Tage, wird er mit Herrlichkeit kommen. Diese Welt nimmt ein Ende; erneuert wird diese erschaffene Welt. Da nämlich Verderben, Diebstahl, Ehebruch, Sünden aller Art sich über die Erde ergossen haben und Blut über Blut die Welt getränkt hat, vergeht unsere Welt, damit dieses wunderbare Gebäude nicht mit Sünden erfüllt bleibe und damit die Welt schöner wieder erstehe. Willst du dafür Schriftbeweise haben? Höre das Wort des Isaias: „Wie eine Buchrolle wird der Himmel zusammengerollt werden, und alle Sterne werden herabfallen wie die Blätter vom Weinstock, wie Blätter fallen vom Feigenbaum“. Das Evangelium sagt: „Die Sonne wird sich verfinstern, und der Mond wird seinen Schein nicht geben, und die Sterne werden vom Himmel fallen“. Betrüben wir uns nicht, als müßten wir allein sterben! Auch Sterne sterben; doch erstehen sie wieder. Der Herr rollt die Himmel zusammen, nicht um sie zu vernichten, sondern um sie noch schöner erstehen zu lassen. Höre das Wort des Propheten David: „Im Anfange hast du, o Herr, die Erde gegründet, und das Werk deiner Hände sind die Himmel. Sie werden vergehen, du aber bleibst“. Man wird einwenden: „Siehe, deutlich sagt er: sie vergehen!“ Inwiefern er sagt „sie werden vergehen“, soll dir der folgende Vers erklären: „Alle werden altern wie ein Kleid, und wie ein Gewand wirst du sie zusammenlegen. Verändert werden sie werden. Gleichwie man nämlich, obwohl man vom Vergehen eines Menschen spricht und sagt: „Sehet, der Gerechte ging zugrunde, und niemand nimmt es zu Herzen“, doch seine Auferstehung erwartet, so erwarten wir auch eine Auferstehung der Himmel. „Die Sonne wird sich in Finsternis verwandeln und der Mond in Blut“. Dies mögen sich die Konvertiten aus dem Manichäismus merken. Nicht mehr mögen sie die Gestirne als Götter erklären, und nicht mehr mögen sie den gottlosen Glauben vertreten, unsere Sonne, die sich verfinstern wird, sei Christus! Höre das andere Wort des Herrn: „Himmel und Erde werden vergehen; doch meine Worte werden nicht vergehen!“ Was erschaffen ist, kommt nämlich den Worten des Herrn nicht gleich.</p><p>Das Sichtbare vergeht, es kommt das, was wir erwarten und was schöner ist als was wir schauen. Doch niemand forsche vorwitzig nach der Zeit! Denn „nicht“ — sagt der Herr — „kommt es euch zu, Zeit und Stunde zu wissen, welche der Vater in eigener Macht bestimmt hat“. Nicht erkühne dich, die Zeit hierfür zu bestimmen! Schlafe auch nicht wieder sorglos ein! „Wachet“, — ruft er — „denn zu einer Stunde, da ihr es nicht erwartet, wird der Sohn des Menschen kommen“. Doch damit wir — wie es notwendig war — die Anzeichen des Weltendes erfahren und nicht in unserer Messiaserwartung vor unserem Tode getäuscht und vom lügnerischen Antichrist betrogen werden, treten die Apostel nach Gottes Willen, gemäß höherer Fügung, zum wahren Lehrmeister und sagen: „Sage uns, wann wird dies geschehen, und welches wird das Zeichen deiner Ankunft und des Endes der Welt sein? Wir erwarten, daß du noch einmal kommen wirst; doch der Satan kleidet sich in die Gestalt eines Lichtengels. Sorge also für uns, daß wir nicht an deiner Statt einen anderen anbeten!“ Christus aber öffnet seinen göttlichen, seligen Mund und antwortet: „Sehet zu, daß euch niemand irre führe!“ Meine Zuhörer, die ihr jetzt den Herrn mit geistigen Augen schaut, höret auf seine Worte, welche er auch zu euch spricht: „Sehet zu, daß euch niemand irre führe!“ Diese Mahnung will euch alle aufmerksam machen auf die folgenden Worte. Denn nicht handelt es sich um eine Erzählung früherer Begebenheiten, sondern um die Prophezeiung einer Zukunft, die sicher eintreten wird. Nicht wir prophezeien; denn dessen wären wir unwürdig. Wir berichten nur, was geschrieben steht, und teilen die Anzeichen mit. Achte darauf, welche Zeichen bereits eingetreten sind, und welche noch ausstehen! Sorge für dich!</p><p>[Forts. v. ] „Sehet zu, daß euch niemand irre führe! Denn viele werden in meinem Namen kommen und sagen: Ich bin Christus, und sie werden viele verführen“. Zum Teil sind diese Worte in Erfüllung gegangen. Denn so haben bereits Simon, der Magier, und Menander und noch andere gottlose Häresiarchen gesprochen. Und noch andere werden zu unserer Zeit oder auch nach uns so sprechen.</p><p>Ein zweites Zeichen geben die Worte: „Ihr werdet hören von Krieg und Kriegsgerüchten“. Die Perser führen zur Zeit Krieg mit den Römern wegen Mesopotamien. Oder ist es nicht so? Ein Volk steht gegen das andere und ein Reich gegen das andere auf. Oder ist es nicht so? „Und es wird sein allenthalben Hunger und Pest und Erdbeben“. Das trifft bereits zu. Wiederum heißt es: „Schrecken vom Himmel und große Ungewitter“. „Wachet also“, — heißt es — „da ihr nicht wisset, an welchem Tag unser Herr kommen wird!“</p><p>[Forts. v. ] Doch wir suchen für die Ankunft (Christi) ein Zeichen, das speziell uns betrifft. Wir Mitglieder der Kirche wollen ein kirchliches Zeichen. Da sagt der Heiland: „Und dann werden viele Ärgernis nehmen, und sie werden einander verraten und einander hassen“. Wenn du hörst, daß Bischöfe gegen Bischöfe, Kleriker gegen Kleriker, Laien gegen Laien blutig vorgehen, so lasse dich nicht verwirren! Die Schrift hat es ja vorhergesagt. Schenke deine Aufmerksamkeit nicht der gegenwärtigen Geschichte, sondern der Schrift! Nicht brauchst du, wenn ich, dein Lehrer, sterben muß, mit mir zu sterben. Dem Hörer kann es besser ergehen als dem Lehrer: wer zuletzt kommt, kann der erste werden. Denn der Herr nimmt auch diejenigen auf, welche erst in der elften Stunde kommen. Fand sich unter den Aposteln ein Verräter, wunderst du dich dann, wenn du unter Bischöfen Bruderhaß findest? Das Zeichen erstreckt sich jedoch nicht nur auf die Führer, sondern auch auf die Laien. Es heißt nämlich: „Da die Sünde überhand nimmt, wird die Liebe der Masse erkalten“. Will sich etwa von den Anwesenden jemand rühmen, den Nächsten selbstlos zu lieben? Küssen nicht oftmals die Lippen, lächelt nicht das Gesicht, sind nicht nach außen hin fröhlich die Augen, während das Herz auf List sinnt und unter friedlichen Reden Böses vollbracht wird?</p><p>Ferner ist dir als Zeichen gegeben: „Und dieses Evangelium des Reiches wird auf dem ganzen Erdkreis verkündet werden zum Zeugnis für alle Völker, und alsdann wird das Ende kommen“. Fast ist, wie wir sehen, die ganze Welt erfüllt von der christlichen Lehre.</p><p>Und was geschieht hernach? Der Herr sagt weiter: „Wenn ihr nun den Greuel der Verwüstung, von dem der Prophet Daniel gesprochen hat, an heiliger Stätte sehet, — wer es liest, merke es wohl!“ und wiederum: „Wenn alsdann jemand zu euch sagt: ‚Siehe, hier ist Christus‘, oder:,Siehe, dort‘, dann glaubet es nicht!“ Der Bruderhaß bereitet dem Antichrist das Feld. Der Teufel wirkt Spaltungen unter den Laien, um bei seiner Ankunft bereitwillig aufgenommen zu werden. Ferne sei es, daß einer der Anwesenden oder irgendwo ein Diener Christi zum Feinde überlaufe! Der Apostel Paulus gibt uns in einem Briefe gute, entsprechende Aufklärung: „Denn zuerst muß der Abfall kommen und muß der Mensch der Bosheit sich offenbaren, der Sohn des Verderbens, der Widersacher, der sich erhebt über alles, was Gott oder Heiligtum heißt, so daß er sich in den Tempel Gottes setzt und sich selber zu Gott macht. Erinnert ihr euch nicht, daß ich euch das sagte, als ich noch bei euch war? Für jetzt wißt ihr auch, was ihn aufhält, bis er sich zu seiner Zeit offenbare. Bereits wirkt nämlich das Geheimnis der Sünde. Nur muß erst beseitigt werden, der es bis jetzt zurückhält. Alsdann wird sich der Frevler offenbaren, welchen der Herr Jesus mit dem Hauche seines Mundes töten und, wenn er bei der Parusie erscheint, vernichten wird. Jenes Ankunft aber geschieht in der Kraft des Satans mit allen möglichen trügerischen Krafterweisen, Zeichen und Wundern und in jeder Art von Trug und Unrecht für die, welche ins Verderben gehen“. So sagt Paulus. Der Abfall findet jetzt statt. Denn vom wahren Glauben sind die Menschen abgefallen. Die einen predigen eine Sohn-Vaterschaft. Andere erkühnen sich zu behaupten, Christus sei aus dem Nichts ins Dasein versetzt worden. Während früher die Häretiker offen bekannt waren, ist jetzt die Kirche voll von verborgenen Häretikern. Abgefallen sind die Menschen von der Wahrheit und lassen sich die Ohren kitzeln. Schmeichelt eine Rede, dann hören alle gerne zu. Will eine Rede belehren, dann geht alles fort. Die meisten haben sich vom rechten Handeln abgewendet. Ihnen ist der Schein lieber als die Wahrheit. Dies ist der Abfall, der Feind ist zu erwarten. Bereits hat er angefangen, seine Vorläufer auszusenden, um zur Jagd bereit zu sein. Sieh dich also vor, o Mensch, und stelle dich sicher! Im Angesicht des lebendigen Gottes unterrichtet dich jetzt die Kirche und belehrt dich über den Antichrist, ehe er kommt. Ob er noch zu deiner Zeit kommt, wissen wir nicht. Ob er erst nach dir kommt, wissen wir nicht. Gut ist es für dich, unsere Lehre anzunehmen und dich sicher zu stellen.</p><p>Der wahre Christus, der eingeborene Sohn Gottes, wird nicht mehr von der Erde kommen. Wenn einer in der Wüste auftritt, um Gaukelspiele zu zeigen, dann gehe nicht hinaus! „Wenn man sagt:,Sieh, hier ist Christus; sieh, dort ist er!’ dann glaube es nicht!“ Schaue nicht mehr abwärts auf die Erde! Denn vom Himmel wird der Herr kommen! Nicht wird er wie ehedem allein kommen, sondern in großer Begleitung, von unzähligen Engeln umgeben. Nicht wird er in Verborgenheit kommen gleich dem Regen, der auf das Vließ träufelt, sondern wie ein Blitz wird er hell aufleuchten. Der Herr selbst hat nämlich gesagt: „Wie der Blitz ausgeht vom Aufgang und leuchtet bis zum Niedergang, so wird sein die Ankunft des Menschensohnes“. Und wiederum: „Sie werden den Sohn des Menschen kommen sehen auf den Wolken des Himmels mit großer Macht und Herrlichkeit. Und er wird seine Engel aussenden mit mächtiger Posaune usw.“.</p><p>[Forts. v. ] Als seinerzeit Jesus Mensch werden wollte, und als man darauf wartete, daß Gott von einer Jungfrau geboren werde, da suchte der Teufel über die Tatsache böswillig hinwegzutäuschen, indem er durch das Heidentum von falschen Göttern erzählte, welche gebaren und von Weibern geboren wurden; er wollte, daß — so stellte er es sich vor — wenn die Lüge einmal Platz gegriffen hat, die Wahrheit nicht geglaubt würde. So wird nun, wenn der wahre Christus zum zweiten Male kommen wird, der Widersacher, die Erwartung der Arglosen, vor allem derer aus der Beschneidung, ausnützend, einen Zauberer erwecken, der in der trügerischen, schlimmen Kunst der Zauberei und Wahrsagerei sehr erfahren ist, die Herrschaft über das römische Reich an sich reißt, sich den falschen Namen Christus beilegt und gerade durch diese Bezeichnung Christus (Messias) die auf den Gesalbten wartenden Juden täuscht, während er die aus dem Heidentum durch seine Zauberkünste fesselt.</p><p>Dieser prophezeite Antichrist wird aber erst kommen, wenn die Zeiten des römischen Reiches erfüllt sind und das Ende der Welt nahe ist. Zehn römische Könige werden zugleich aufstehen; wenn auch wohl an verschiedenen Orten, werden sie doch zu ein und derselben Zeit regieren. Nach ihnen kommt als elfter der Antichrist. Dieser wird die römische Macht mit Zauberkraft an sich reißen, drei der früheren Könige „erniedrigen“, während die übrigen sieben unter ihm stehen werden. Zuerst wird er sich stellen, als wäre er ein gelehrter und weiser Mann, und wird Milde, Mäßigung und Menschenfreundlichkeit heucheln. Durch falsche, trügerischer Zauberkunst entsprungene Zeichen und Wunder wird er, den erwarteten Messias spielend, die Juden täuschen. Und dann wird er sich durch alle möglichen Laster der Unmenschlichkeit und Ungerechtigkeit hervortun in einer Weise, daß er alle Ungerechten und Gottlosen, die vor ihm waren, übertreffen wird; denn gegen alle, besonders aber gegen uns Christen wird er eine mordgierige, überaus hartherzige, erbarmungslose und verschmitzte Gesinnung bekunden. Doch nur drei Jahre und sechs Monate wird er in solcher Weise verfahren. Denn alsdann wird ihn die zweite, vom Himmel her erfolgende, herrliche Ankunft des eingeborenen Sohnes Gottes, unseres Herrn und Heilandes Jesus, des wahren Christus, zunichte machen, da er den Antichrist mit dem Hauche seines Mundes töten und dem Feuer der Hölle ausliefern wird.</p><p>Was wir da vortragen, haben wir nicht selbst ersonnen, sondern haben uns die göttlichen Schriften der Kirche, vor allem die soeben verlesene Danielprophetie gelehrt. Eine Auslegung gibt auch der Erzengel Gabriel; denn er sagt: „Das vierte Tier wird das vierte Reich auf Erden sein; es wird größer sein als alle Reiche“. Daß darunter das römische Reich zu verstehen ist, haben uns die Exegeten der Kirche überliefert. Da nämlich das erste große Reich das der Assyrer war, das zweite das der Meder und Perser, das dritte sodann das der Mazedonier, so ist nun das vierte Reich das der Römer. Weiter gibt sodann Gabriel die Auslegung: „Die zehn Hörner werden zehn Könige sein, die auftreten werden, und nach ihnen wird noch ein anderer König auftreten, der durch seine Laster alle Vorgänger übertreffen wird“. Nicht nur — so sagt er — die zehn, sondern überhaupt alle Vorgänger, „Und er wird drei Könige erniedrigen“. Offenbar sind drei von den erwähnten zehn Königen gemeint. Da er aber drei von jenen zehn Königen erniedrigen wird, wird er jedenfalls als achter die Herrschaft erhalten. „Und er wird“ — sagt Gabriel — „Reden wider den Höchsten halten“. Ein Gotteslästerer und Gesetzesverräter ist er. Nicht von den Vätern empfängt er die Herrschaft, sondern er reißt durch Zauberei die Macht an sich.</p><p>[Forts. v. ] Wer ist dieser, oder in welcher Kraft tritt er auf? Erkläre es uns, Paulus! „Seine Ankunft erfolgt in der Kraft des Satans mit allen möglichen trügerischen Krafterweisen, Zeichen und Wundern“. Damit will er sagen: der Satan bedient sich des Antichrist als seines Werkzeuges; er wirkt persönlich durch ihn. Da der Satan weiß, daß es für ihn im Gerichte keine Nachsicht mehr gibt, kämpft er nicht mehr wie gewöhnlich durch seine Diener, sondern offen in eigener Person. „Mit allen möglichen trügerischen Zeichen und Wundern.“ Der Vater der Lüge gaukelt nämlich Werke der Lüge vor, damit die Menge an eine Totenerweckung glaube, auch wo keine Totenerweckung statthat, damit sie, auch wo keine Heilung stattfindet, sich einbilde, die Lahmen gehen und die Blinden sehen.</p><p>Weiter sagt Paulus: „Der Widersacher, der sich erhebt über alles, was Gott oder Heiligtum heißt“. „Über alles, was Gott heißt“; offenbar wird nämlich der Antichrist die Götzenbilder hassen. „So daß er sich in den Tempel Gottes setzt“. Was für ein Tempel ist es? Gemeint ist der zerstörte Tempel der Juden. Keineswegs darf darunter die Kirche verstanden werden, in der wir sind. Warum sagen wir dies? Damit man nicht meint, wir machen Anspruch auf die Ehre. Wenn der Antichrist ausgibt, er sei der Messias, und zu den Juden kommt und von ihnen Verehrung beansprucht, um sie dann erst recht täuschen zu können, dann bemüht er sich eifrigst um den Tempel und erweckt den Schein, er sei der Nachkomme Davids, welcher den von Salomo erbauten Tempel wieder aufbauen werde. Dann wird der Antichrist kommen, wenn gemäß der Prophezeiung des Heilandes am jüdischen Tempel kein Stein auf dem anderen bleibt. Dann, wenn durch den Zahn der Zeit oder durch einen zum Zwecke eines Neubaues oder aus anderen Gründen erfolgten Abbruch alle Steine — ich meine nicht der Umfassungsmauer, sondern des inneren Tempels, wo die Cherubim waren — zerstört sind, alsdann wird jener mit allen möglichen trügerischen Zeichen und Wundern kommen, sich über alle Götzen erheben und, nachdem er zuerst Menschenfreundlichkeit geheuchelt hat, seine Wildheit vor allem gegenüber den Heiligen Gottes kundtun. Denn es heißt: „Ich schaute, und jenes Horn führte Krieg mit den Heiligen“. Und wiederum an anderer Stelle heißt es: „Und es wird eine Zeit der Trübsal sein, eine Trübsal, wie sie bis dahin nicht gewesen ist seit der Zeit, da Völker auf Erden sind“. Schrecklich ist das Tier, groß der Drache, für Menschen schwer zu besiegen; bereit ist er, zu verschlingen.</p><p>Noch mehr könnten wir auf Grund der göttlichen Schriften über den Antichrist sagen, doch wir wollen uns beschränken und begnügen uns einstweilen damit.</p><p>Da der Herr die Größe des Gegners kannte, gibt er den Frommen gewisse Freiheit, sofern er sagt: „Alsdann mögen die, welche in Judäa sind, in das Gebirge fliehen!“ Wenn aber einer sich bewußt ist, fest genug zu sein, gegen den Satan zu kämpfen, der halte stand! Ich vertraue nämlich fest auf die Nervenkraft der Kirche. Und er möge sprechen:„Wer wird uns trennen von der Liebe zu Christus?...“ Sind wir furchtsam, dann wollen wir uns in Sicherheit bringen; sind wir mutig, dann wollen wir standhalten! „Alsdann wird sein große Trübsal, wie sie von Anbeginn der Schöpfung bis jetzt nicht war und fürwahr nicht sein wird“. Doch Gott sei Dank, daß er die große Trübsal auf wenige Tage beschränkt! Er erklärt nämlich: „Um der Auserwählten willen werden aber jene Tage abgekürzt werden“. Nur dreieinhalb Jahre wird der Antichrist regieren. Diese Lehre entnehmen wir nicht apokryphen Schriften, sondern Daniel, der sagt: „Und es wird in seine Hände gegeben werden bis zu einer Zeit und auf Zeiten und auf die Hälfte einer Zeit“. „Die Zeit“ ist das eine Jahr, an welchem immer noch der Erschienene an Macht wachsen wird. „Zeiten“ sind die zwei übrigen von den Jahren seiner Gottlosigkeit, deren im ganzen drei gezählt werden. Unter der „Hälfte einer Zeit“ sind die sechs Monate zu verstehen. An einer anderen Stelle sagt Daniel dasselbe: „Und er schwor bei dem ewig Lebendigen: auf eine Zeit und auf Zeiten und auf die Hälfte der Zeit“. Hierauf beziehen einige wohl auch das folgende Wort: „Zwölfhundertneunzig Tage“, ferner die Worte: „Selig, wer ausharrt und bis zu dreizehnhundertfünfunddreißig Tagen gelangt“. Daher wird es notwendig sein, sich zu verbergen und zu fliehen. Wohl werden wir nämlich bis zur Ankunft des Menschensohnes „die Städte Israels nicht vollenden“.</p><p>Wer wird so selig sein, sich alsdann für Christus in frommer Demut dem Martyrium zu unterziehen? Ich behaupte nämlich: Über allen Märtyrern werden die Märtyrer jener Zeit stehen. Während die Märtyrer vor jener Zeit nur mit Menschen gekämpft haben, werden die Märtyrer zur Zeit des Antichrist mit der Person des Satans selbst zu kämpfen haben. Bei früheren Verfolgungen töteten die Könige nur, ohne den Anspruch zu erheben, Tote zu erwecken, und ohne zauberhafte Zeichen und Wunder zur Schau zu tragen. Hier aber wirkt die schlimme Versuchung sowohl durch Schrecken wie durch Trug, „so daß, wenn es möglich wäre, selbst die Auserwählten irre geführt würden“. In denen, welche zu jener Zeit leben, mögen nie die Gedanken aufsteigen: „War es mehr, was Christus gewirkt hatte? Was für eine Kraft ist es denn, in welcher dieser solches wirkt? Nur weil es Gott so will, läßt er dies zu.“ Um dich sicherzustellen, hat der Apostel prophezeit: „Und deshalb schickt ihnen Gott die Macht der Verführung“. „Er schickt“ steht für: „Er läßt es zu, daß es geschehe.“ (Er schickt ihnen jene Macht) nicht, damit sie sich (dahinter) verteidigen, sondern „damit sie dem Gerichte verfallen“. Weshalb? „Weil sie nicht glaubten der Wahrheit“, d. i. dem wahren Christus; „sondern am Unrecht Gefallen hatten“, d. i. am Antichrist. Solche Offenbarungen feindlicher Macht läßt Gott zu sowohl in den von Zeit zu Zeit stattfindenden Verfolgungen als auch in jener Zeit, nicht weil er sie nicht verhindern könnte, sondern weil es bei ihm Gesetz ist, seine Helden gleich seinen Propheten und Aposteln nur auf Grund erprobter Geduld zu krönen. Nach kurzer Zeit der Drangsal sollen sie das ewige Reich der Himmel erben, wie Daniel sagt: „In jener Zeit wird dein ganzes Volk gerettet werden, das geschrieben ist im Buche.“ Gemeint ist offenbar das Buch des Lebens. „Und viele von denen, welche im Staube der Erde schlafen, werden auferweckt werden, die einen zum ewigen Leben, die anderen zur ewigen Schmach und Schande. Die Verständigen werden leuchten wie der Glanz des Firmamentes und viele Gerechte wie die Sterne immer und ewig“.</p><p>Stelle dich also sicher, o Mensch! Du weißt von den Wundertaten des Antichrist. Nicht nur für dich allein denke daran, berichte darüber neidlos allen! Hast du ein Kind dem Fleische nach, unterweise es bereits hierin! Hast du durch (christlichen) Unterricht ein Kind geboren, so beuge vor, daß es nicht den falschen Christus für den wahren annehme! „Denn das Geheimnis der Sünde ist bereits wirksam“. Es schrecken mich die Kriege der Völker, es schrecken mich die kirchlichen Spaltungen; es schreckt mich der Bruderhaß. Das muß ich gestehen. Doch ist damit nicht gesagt, daß sich die Verheißung schon zu unserer Zeit erfülle. Doch auf der Hut sollen wir sein. Soviel über den Antichrist.</p><p>[Forts. v. ] Sehnsüchtig wollen wir auf die Ankunft des Herrn warten, der von den Himmeln auf den Wolken kommt! In jener Zeit werden die Posaunen der Engel erschallen. Zuerst werden die Toten, welche in Christus sind, auferstehen. Die Frommen, welche noch leben, werden in Wolken entrückt werden, um als Lohn ihrer Drangsal übermenschliche Ehren zu erhalten; übermenschlich sind ja auch ihre Kämpfe. Der Apostel Paulus schreibt nämlich in einem Briefe: „Wenn der Befehl erschallt, die Stimme des Erzengels ertönt, die Gottes-Posaune erklingt, wird er, der Herr, vom Himmel herabsteigen, und die Toten, die in Christus sind, werden zuerst auferstehen. Dann werden wir, die noch am Leben geblieben sind, zugleich mit ihnen in den Wolken entrückt werden, um dem Herrn in den Lüften entgegenzueilen. Und so werden wir in Gemeinschaft mit dem Herrn sein immerdar“.</p><p>Von dieser Ankunft des Herrn und dem Ende der Welt wußte der Prediger. Er sagt nämlich: „Freue dich, Jüngling, über deine Jugend!“ Und weiterhin: „Nimm den Unmut aus deinem Herzen und entferne das Böse aus deinem Fleische und gedenke deines Schöpfers, ehe die bösen Tage kommen, ehe sich die Sonne, das Licht, der Mond und die Sterne verfinstern, ehe finster werden in ihren Höhlen die Schauenden (gemeint ist die Sehkraft), ehe die Silberschnur zerreißt (ein Hinweis auf den Sternenteppich; denn wie Silber sehen die Sterne aus) und ehe die goldene Kamille zertreten wird (gemeint ist die dem Golde gleichende Sonne; die Kamille, eine bekannte Pflanze, hat nämlich einen Kranz zahlreicher, wie Strahlen ausgehender Blütenblätter). Und sie werden aufstehen beim Gesang des Vogels. Von der Höhe aus werden sie sehen, und Schrecken wird sein auf dem Wege“. Was werden sie sehen? „Dann werden sie den Sohn des Menschen kommen sehen auf den Wolken des Himmels“, und „sie werden klagen, Stamm für Stamm“. Und was wird geschehen bei der Ankunft des Herrn? „Blühen wird der Mandelbaum, fett wird werden die Heuschrecke, und die Kappern werden aufbrechen“. Nach den Exegeten besagt der blühende Mandelbaum, daß der Winter vorüber ist. Unsere Leiber werden alsdann nach dem Winter blühen in himmlischer Blüte. Und fett wird die Heuschrecke, d. i. die beflügelte Seele, welche mit dem Leibe bekleidet sein wird. Und die Kappern werden aufbrechen: die dornigen Sünder mögen bersten!</p><p>Wie du siehst, ist die Ankunft des Herrn den Propheten allgemein bekannt. Bekannt ist ihnen, wie du siehst, die Stimme des Vogels. Wollen wir sehen, was für eine Stimme dies ist! „Wenn der Befehl erschallt, die Stimme des Erzengels ertönt, die Gottesposaune erklingt, wird er, der Herr, vom Himmel herabsteigen“. Ein Erzengel wird allen das Wort zurufen: „Steht auf, dem Herrn entgegen!“</p><p>Schrecklich ist es, wenn der Herr herabsteigt. David sagt: „Gott, unser Gott, wird sichtbar kommen. Nicht wird er schweigen. Feuer wird vor ihm brennen, und rings um ihn wird starkes Gewitter sein usw.“. Wenn nach der eben verlesenen Schriftstelle der Menschensohn auf den Wolken des Himmels vor den Vater tritt, wird ein Strom von Feuer niederstürzen, die Menschen zu erproben. Sind eines Menschen Werke Gold, wird er gar herrlich glänzen. Sind eines Menschen Werke von Stroh, wertlos, dann wird er vom Feuer verschlungen werden.</p><p>Der Vater „sitzt, sein Gewand ist weiß wie Schnee, und die Haare seines Hauptes sind wie reine Wolle“. Dies ist bildlich gesprochen. Inwiefern? Er ist nämlich der König derer, welche sich nicht mit Sünden beschmutzt haben. „Denn“ — sagt er — „ich werde eure Sünden weiß machen wie Schnee und wie Wolle“ — Bilder des Sündennachlasses bzw. der Unschuld. Wie der Herr auf Wolken in die Himmel auffuhr, wird er auf Wolken von den Himmeln herabkommen. „Und sie werden den Menschensohn auf den Wolken des Himmels kommen sehen mit großer Macht und Herrlichkeit“.</p><p>Woran wird jedoch die Ankunft Christi zu erkennen sein? Es könnte ja etwa eine feindliche Macht sich erkühnen, dieselbe nachzuahmen. Antwort; „Alsdann wird das Zeichen des Menschensohnes am Himmel erscheinen“. Das für Christus wahrhaft charakteristische Zeichen ist das Kreuz. Das Zeichen des glänzenden Kreuzes wird dem König vorangehen, um ihn zu offenbaren, der ehedem gekreuzigt worden war. Die Juden, welche ihn seinerzeit durchbohrt und verfolgt haben, sollen, wenn sie das Kreuzzeichen sehen, „klagen, Stamm für Stamm“ und sagen: es ist der, der die Backenstreiche erhalten hatte; es ist der, dem man seinerzeit ins Angesicht gespien hatte; es ist der, den man in Fesseln geschlagen hatte; es ist der, den man dereinst am Kreuze verspottet hatte. Wohin — so werden sie fragen — sollen wir fliehen vor deinem Zorne? Vor der Schar der Engel, welche sie umgeben, werden sie aber nirgends fliehen können.</p><p>Während das Zeichen des Kreuzes seinen Feinden ein Schrecken sein wird, wird es Freude seinen Freunden sein, welche an Christus geglaubt, ihn verkündet oder für ihn gelitten haben. Wer wird alsdann so glücklich sein, als Freund Christi erfunden zu werden? Jener herrliche König, der von Engeln umgeben ist und wie der Vater auf dem Throne sitzt, wird seine Diener nicht verachten. Damit die Auserwählten nicht mit den Feinden vermengt werden, „wird er seine Engel unter dem lauten Schalle der Posaune aussenden, und sie werden seine Auserwählten von den vier Winden her sammeln“. Wenn Gott den einen Loth nicht verachtete, wie sollte er dann die Menge der Gerechten verachten? „Kommet, ihr Gesegneten meines Vaters!“ wird er denen zurufen, welche dann, von Engeln gesammelt, auf den Wolken daherfahren werden.</p><p>Aber von den Anwesenden wird einer fragen: „Wenn ich arm bin oder vielleicht zu jener Zeit krank im Bette gefunden werde, oder wenn ich, ein Weib, verlassen in der Mühle bin, sollten wir da nicht etwa vernachlässigt werden?“ Mut, o Mensch! Der Richter fragt nicht nach dem Ansehen der Person. „Nicht nach dem Ansehen wird er richten und nicht nach der Redegewandtheit urteilen“. Nicht zieht er die Gelehrten den Unwissenden und nicht die Reichen den Armen vor. Auch wenn du auf dem Felde arbeitest, werden die Engel dich holen. Glaube nicht, daß er die Grundbesitzer aufnimmt und dich, den Ökonomiearbeiter, übersieht! Magst du ein Knecht, ein Armer sein, habe keine Angst! Er, der Knechtsgestalt angenommen hat, verachtet die Knechte nicht. Und liegst du krank im Bette: es ist geschrieben: „Dann werden zwei auf* einem* Bette liegen, der eine wird angenommen, der andere zurückgelassen“. Wenn dich — Mann oder Weib — die Not zwingt, in der Mühle zu sein, wenn du Fesseln trägst und in der Mühle sitzest, so wird dich doch der nicht übersehen, welcher „die Gefesselten mit Kraft herausführt“. Der, welcher Joseph aus Sklaverei und Kerker zur Herrschaft geführt hat, wird auch dich aus Trübsal erlösen ins Himmelreich. Habe nur Mut, arbeite nur, kämpfe nur tapfer! Nichts wird verloren gehen. Aufgeschrieben sind alle deine Gebete und Psalmengesänge. Aufgeschrieben ist jedes Almosen. Aufgeschrieben ist jedes Fasten. Aufgeschrieben ist jede rein bewahrte Ehe. Aufgeschrieben ist die um Gottes willen ertragene Witwenschaft. Die beste Krone aber ist zugeschrieben der jungfräulichen Keuschheit. Glänzen wirst du wie ein Engel.</p><p>Wie du gern von den Freuden hörst, so sollst du nun aber auch festen Sinnes zuhören, wenn von dem Gegenteil gesprochen wird. Aufgeschrieben ist all deine Habsucht. Aufgeschrieben ist all deine Unzucht. Aufgeschrieben ist jeder Meineid, jede Gotteslästerung, jede Zauberei, jeder Diebstahl, jeder Mord. Begehst du jetzt nach der Taufe die gleichen Sünden wieder, so werden sie alle wiederum aufgeschrieben. Die früheren allerdings sind getilgt.</p><p>„Wenn aber“ — heißt es — „der Menschensohn in seiner Herrlichkeit kommen wird und alle Engel mit ihm....“. Achte, o Mensch, darauf, daß du in Gegenwart so vieler vor Gericht erscheinen wirst! Das ganze Menschengeschlecht wird dann zugegen sein. Überlege es, wie groß ist die römische Nation! Erwäge, wie zahlreich sind die jetzt lebenden Barbaren, und wie viele sind seit hundert Jahren gestorben! Erwäge, wie viele sind seit tausend Jahren zu Grabe gegangen! Erwäge die Zahl der Menschen von Adam bis heute! Groß ist die Menge und doch noch klein. Noch größer ist die Zahl der Engel. Sie sind die neunundneunzig Schafe, während die Menschheit das eine Schaf ist. Die Menge der Bewohner muß man aus der Größe aller Orte berechnen. Wenn die bewohnte Erde, welche der Mittelpunkt in der Mitte des einen Himmels ist, schon eine solche Menge zählt, welche Menge muß dann der Himmel, der diese Erde umgibt, fassen? Ist nicht unvergleichlich groß die Zahl, welche die Himmel der Himmel fassen? Es ist geschrieben: „Zehntausendmal Zehntausend dienten ihm, und zehntausendmal Zehntausend standen zu seiner Seite“. Nicht als ob die Menge nur so groß wäre, sondern der Prophet konnte eine größere Zahl nicht aussprechen. Alsdann wird bei Gericht anwesend sein Gott, der Vater aller, zu dessen Seite Jesus Christus thront, und mit ihm wird zugegen sein der Hl. Geist. Wir alle, beladen mit unseren Werken, werden von der Posaune des Engels gerufen werden. Müssen wir nicht jetzt schon in Angst sein? Glaube nicht, o Mensch, es sei nur eine geringe Pein, wenn du vor Antritt der Strafe in Gegenwart so vieler verurteilt wirst! Sollten wir nicht lieber wünschen, oftmals zu sterben, als von Freunden verdammt zu werden?</p><p>Seien wir ängstlich besorgt, Brüder, Gott möchte uns verdammen! Denn zur Verdammung bedarf er nicht der Untersuchung, nicht der Beweise. Sage nicht: „Ich habe bei Nacht Unzucht, Zauberei und andere Sünden begangen; kein Mensch war dabei“! Auf Grund deines Gewissens wirst du gerichtet: „die Gedanken werden sich gegenseitig anklagen und freisprechen an dem Tage, da Gott die Geheimnisse der Menschen lichten wird“. Das furchtbare Antlitz des Richters wird dich zwingen, die Wahrheit zu sagen, bzw. es überführt dich, auch wenn du die Wahrheit nicht sagst; denn wenn du auferweckt wirst, wirst du entweder mit deinen Sünden oder mit deiner Gerechtigkeit angetan sein. Der Richter selbst — Christus ist nämlich der Richter — hat dies geoffenbart: „Nicht richtet nämlich der Vater jemanden, sondern er hat alles Gericht dem Sohne gegeben“. Nicht jedoch entäußert er sich seiner Macht, sondern er richtet durch den Sohn. Der Sohn richtet also nach dem Willen des Vaters. Denn nicht ist der Wille des Vaters ein anderer als der Wille des Sohnes; er ist vielmehr ein und derselbe. Was sagt nun der Richter bezüglich der Frage, ob du mit deinen Werken angetan sein wirst oder nicht? „Und sie werden vor ihm alle Völker versammeln“. Vor Christus muß sich ja jedes Knie beugen derer, die im Himmel, auf Erden und unter der Erde sind. „Und er wird sie voneinander trennen, wie der Hirte die Schafe von den Böcken scheidet“. Wie nimmt der Hirte die Scheidung vor? Zieht er ein Buch zu Rate, wenn er wissen will, was ein Schaf und was ein Bock ist? Oder unterscheidet er auf Grund eigener Wahrnehmungen? Erkennt man nicht an der Wolle das Schaf, an den Haaren und dem bockbeinigen Wesen den Bock? Wenn du demnächst von Sünden gereinigt wirst, in Zukunft mit deinen Werken wie mit reiner Wolle angetan bist, dein Gewand unbefleckt bleibt und du stets sagst: „Ich habe mein Kleid ausgezogen, wie soll ich es wieder anziehen?“ dann wirst du an dem, was du anhast, als Schaf erkannt. Wenn sich aber findet, daß du Haare hast wie Esau, der dicht mit Haaren bewachsen war und schlechte Gesinnung zeigte, da er das Recht der Erstgeburt wegen einiger Speisen verlor und seine Ehre verkaufte, dann gehörst du zu denen, welche auf der linken Seite stehen. Ferne sei es, daß einer von den Anwesenden der Gnade verlustig gehe und sündhafter Taten wegen in den Reihen der Sünder, welche zur Linken stehen werden, gefunden werde!</p><p>Wahrhaft furchtbar wird das Gericht sein, und man hat in anbetracht dessen, was angekündigt worden ist, Ursache, zu zittern.Ein Himmelreich ist in Aussicht gestellt, ewiges Feuer ist bereitet. Wie können wir — wird man fragen — dem Feuer entfliehen? Wie können wir in das Reich gelangen? „Ich war hungrig“ — antwortet der Herr — „und ihr habt mir zu essen gegeben“. Merket euch den Weg! Es bedarf da keiner Umdeutung, sondern da heißt es: das Wort erfüllen! „Ich war hungrig, und ihr habt mir zu essen gegeben; ich war durstig, und ihr habt mich getränkt; ich war fremd, und ihr habt mich beherbergt; ich war nackt, und ihr habt mich bekleidet; ich war krank, und ihr habt mich besucht; ich war im Gefängnis, und ihr seid zu mir gekommen“. Tust du das, dann wirst du an der Regierung (des Herrn) teilhaben; tust da es nicht, dann wirst du verdammt werden. Mache jetzt bereits den Anfang! Harre aus im Glauben, damit du nicht wie die törichten Jungfrauen, wenn du Öl kaufen willst, ausgeschlossen werdest! Sei nicht schon damit zufrieden, daß du die Lampe hast! Sorge dafür, daß sie auch immer brenne! Lasse das Licht deiner guten Werke vor den Menschen leuchten! Christus soll nicht deinetwegen gelästert werden! Trage das Kleid der Unverweslichkeit, sofern du dich durch gute Werke auszeichnest! Die Verwaltung, welche dir Gott überträgt, übe nutzbringend aus! Sind dir äußere Güter anvertraut, verwalte sie gut! Ist dir der Lehrberuf anvertraut, leite richtig die Seelen deiner Zuhörer! Hast du das Zeug zu einem Vorsteher, mache einen eifrigen Vorsteher! Für einen guten Verwalter gibt es viele Türen. Möge keiner von uns verurteilt und verstoßen werden, damit wir mit Vertrauen dem ewigen König Christus, der in Ewigkeit regiert, entgegengehen können! In Ewigkeit ist nämlich König der Richter der Lebenden und der Toten, da er für die Lebenden und die Toten gestorben ist. Paulus sagt nämlich: „Denn dazu ist Christus gestorben und ins Leben zurückgekehrt, daß er über die Toten und Lebenden herrsche“.</p><p>Solltest du einmal hören, das Reich Christi habe ein Ende, dann hasse diese Häresie! Sie ist ein neues Haupt des Drachen, das vor kurzem in Galatien gewachsen ist. Jemand erkühnte sich zu lehren, Christus regiere nach dem Ende der Welt nicht mehr; er erkühnte sich zu behaupten, der Logos, der aus dem Vater hervorgegangen ist, habe sich wieder in den Vater aufgelöst und existiere nicht mehr. Wer so lästert, verflucht sich. Nicht hat er gehört auf das Wort des Herrn: „Der Sohn bleibt in Ewigkeit“. Nicht hat er gehört auf Gabriel, der sagte: „Er wird regieren über das Haus Jakob in Ewigkeit, und seines Reiches wird kein Ende sein“. Erwäge, was gelehrt wird! Häretiker lehren jetzt wider Christus; der Erzengel Gabriel aber lehrte die Ewigkeit des Erlösers. Wem willst du lieber Glauben schenken? Nicht etwa Gabriel? Vernimm das Daniel-Zeugnis, das uns vorliegt! „Ich schaute im Gesichte der Nacht, und siehe, mit den Wolken des Himmels kam einer wie eines Menschen Sohn. Und er ging bis zu dem Bejahrten. Ihm wurde gegeben Ehre, Macht und Herrschaft. Und alle Völker, Stämme und Zungen werden ihm dienen. Seine Macht ist eine ewige Macht, die nicht vergehen wird, und sein Reich wird nicht zerstört werden“. Halte lieber diese Worte fest und glaube ihnen! Die häretischen Lehren aber weise von dir! Was du gehört hast über das unvergängliche Reich Christi, ist doch deutlich genug geoffenbart.</p><p>Eine ähnliche Lehre gibt dir „der Stein, der sich ohne Zutun von Menschenhand vom Berge losgerissen hatte“, worunter die fleischliche Natur Christi zu verstehen ist. „Und sein Reich wird keinem anderen Volke überlassen werden“. Auch David sagt einmal: „Dein Thron, o Gott, ist in alle Ewigkeit“. Ein andermal sagt er: „Im Anfang hast du, o Herr, die Erde gegründet.... Sie werden zugrunde gehen, du aber bleibst.... Du aber bist derselbe, und deine Jahre nehmen kein Ende“. Paulus hat alle diese Worte auf den Sohn gedeutet.</p><p>[Forts. v. ] Willst du wissen, wie die, welche das Gegenteil lehren, auf solchen Unsinn kommen? Was der Apostel richtig sagt, haben sie falsch gelesen. Ich meine das Wort: „Er muß nämlich herrschen, bis er alle seine Feinde unter seine Füße legt“. Jene erklären: „Sobald einmal seine Feinde unter seine Füße gelegt sind, regiert er nicht mehr.“ Eine falsche, unsinnige Auslegung! Wenn Christus schon herrscht, ehe er noch seine Feinde gerichtet hat, wird er dann nicht noch viel mehr herrschen, wenn er seine Feinde überwunden hat?</p><p>Das Schriftwort: „Wenn ihm alles unterworfen sein wird, dann wird auch der Sohn selbst sich dem unterwerfen, der ihm alles unterworfen hat“, soll — so wird kühn behauptet — lehren, daß der Sohn sich im Vater auflöse. Ihr also, ihr Allergottlosesten, ihr bleibt als Geschöpfe Christi, und Christus, durch welchen ihr und alles geworden ist, geht zugrunde? Eine gotteslästerliche Sprache! Wie wird denn ihm alles unterworfen werden? Dadurch, daß es zugrunde geht, oder dadurch, daß es bleibt? Wenn das, was dem Sohne unterworfen ist, bleibt, wird dann der Sohn, wenn er sich dem Vater unterwirft, nicht bleiben? Wenn es heißt: „Er wird sich unterwerfen“, so ist nicht gesagt: er fängt alsdann erst an, dem Vater zu gehorchen; denn immer und ewig tut er, was ihm wohlgefällig ist. Es will vielmehr gesagt sein: Auch dann gehorcht er nicht in erzwungenem Gehorsam, sondern in freiwilliger Hingabe. Denn nicht unterwirft er sich als Sklave einem Zwange, sondern er gehorcht als Sohn freiwillig und aus Liebe.</p><p>[Forts. v. ] Fragen wir die Gegner: Was bedeutet das „so lange als“ oder „so lange bis“? Um zu versuchen, ihren Irrtum zu widerlegen, gehe ich von dem gleichen Worte wie sie aus. Da sie auf Grund der Worte „bis daß er seine Feinde unter seine Füße lege“ kühn von einer Endlichkeit Christi sprachen, kühn die ewige Herrschaft Christi begrenzten und von seiner unvergänglichen Macht lehrten, sie habe ein Ende, so wollen wir bei dem Apostel nachlesen, wo wir einen ähnlichen Ausdruck finden. „Doch“ — sagt er — „es herrschte der Tod von Adam* bis* Moses“. Sind nun etwa die Menschen nur bis zu jener Zeit gestorben? Gab es nach Moses keine Toten mehr? Herrschte nach dem Gesetze der Tod nicht mehr über die Menschen? Du mußt doch einsehen, daß das Wörtchen „bis“ nicht eine zeitliche Beschränkung andeutet, daß Paulus vielmehr hat sagen wollen: Obwohl Moses ein gerechter, bewunderungswürdiger Mann war, so traf doch auch ihn und seine Nachkommen, die doch nicht wie Adam vom Baume gegessen und durch Ungehorsam sich versündigt hatten, das über Adam gefällte Todesurteil.</p><p>Lies noch eine andere einschlägige Stelle! „* Bis* auf den heutigen Tag nämlich liegt, so oft Moses gelesen wird, eine Decke auf ihrem Herzen“. Bezieht sich der Ausdruck „bis auf den heutigen Tag“ etwa nur bis auf Paulus? Bezieht er sich nicht noch auf unsere Zeit und bis auf das Ende der Welt?</p><p>Wenn Paulus zu den Korinthern sagt: „Wir sind nämlich eben* bis* zu euch gekommen in der Verkündigung Christi, und wir haben, wenn euer Glaube wächst, die Hoffnung, noch über euch hinaus das Evangelium zu verkünden“, dann siehst du deutlich, daß mit dem Wörtchen „bis“ nicht das Endziel angedeutet wird, daß es vielmehr auch noch etwas, was folgt, in sich faßt.</p><p>Wie hast du also die Worte „bis er legt seine Feinde“ zu verstehen?</p><p>Noch an anderer Stelle sagt derselbe Paulus: „Und ermuntert euch alle Tage, so lange es noch ‚heute‘ heißt!“ D. h. (ermuntert euch) immer! Wie man nicht von einem Anfang der Tage Christi sprechen darf, so möge man es auch nicht dulden, daß jemand je von einem Ende seiner Herrschaft spreche! Denn es steht geschrieben: „Sein Reich ist ein ewiges Reich“.</p><p>[Forts. v. ] Ich könnte zwar noch mehrere Zeugnisse aus den göttlichen Schriften für die ewige, endlose Herrschaft Christi anführen. Da jedoch der Tag bereits vorangeschritten ist, will ich mich mit dem Gesagten begnügen.</p><p>Mein Zuhörer, bete allein Jesum als König an! Fliehe jeglichen Irrtum der Häresie! So es die Gnade Gottes will, werdet ihr seinerzeit auch noch von den übrigen Glaubenslehren hören. Der Gott des Weltalls beschütze euch alle! Merket euch die Zeichen des Weltendes! Lasset euch nimmermehr vom Antichrist besiegen! Du kennst die Zeichen des kommenden Betrügers. Du kennst die Zeichen des wahren Christus, der sichtbar von den Himmeln herabsteigen wird. Den einen, den falschen Christus, fliehe! Den anderen, den wahren Christus, erwarte! Du weißt, welchen Weg du gehen mußt, um beim Gerichte unter denen gefunden zu werden, welche rechts stehen. Bewahre das anvertraute christliche Gut, indem du dich durch gute Werke auszeichnest, um mit Zuversicht vor den Richter zu treten und das Himmelreich zu erben! Durch ihn und mit ihm sei Gott und zugleich dem Hl. Geist die Ehre in alle Ewigkeit. Amen.XVI. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Worte: „und an einen Hl. Geist, den Tröster, welcher durch die Propheten gesprochen hat.“</p><h2>17</h2><p>* Über die Worte: „und an einen Hl. Geist, den Tröster, welcher durch die Propheten gesprochen hat.“*</p><p>Wir bedürfen wahrlich der Gabe des Geistes, wenn wir über den Hl. Geist Vortrag halten wollen. Nicht brauchen wir sie etwa, weil wir von ihm so sprechen wollen, wie es seinem erhabenen Wesen entspricht; denn das ist unmöglich. Wir brauchen sie vielmehr, um nicht, wenn wir aus den göttlichen Schriften belehren, uns einer Gefahr auszusetzen. Gar Furchtbares ist nämlich in den Evangelien geschrieben, sofern Christus ausdrücklich erklärt hat: „Wer ein Wort wider den Hl. Geist spricht, dem wird es weder in diesem noch im zukünftigen Leben verziehen werden“.Oft muß man fürchten, daß man — sei es aus Unwissenheit, sei es aus falscher Frömmigkeit — über den Geist etwas sagt, was man nicht sagen darf, und sich so die Verdammnis zuzieht. Jesus Christus, der Richter der Lebendigen und der Toten, hat erklärt, man erhalte keine Verzeihung. Wenn sich nun einer verfehlt, welche Hoffnung hat er noch?</p><p>Möge Jesus Christus uns die Gnade verleihen, ohne Fehler zu sprechen, und euch die Gnade geben, mit Verständnis zuzuhören! Nicht nur die Redner brauchen nämlich Verständnis, sondern auch die Zuhörer, damit sie nicht in ihren Geist etwas anderes aufnehmen als in ihre Ohren.</p><p>Wir wollen über den Hl. Geist nur das reden, was geschrieben steht. Mit dem, was nicht geschrieben steht, wollen wir uns nicht beschäftigen. Der Hl. Geist selbst hat in den Schriften geredet. Alles, was er von sich sagen wollte, bzw. was wir fassen konnten, hat er selbst von sich gesagt. Was er gesagt hat, soll gelehrt werden. Nicht würden wir es nämlich wagen, etwas zu lehren, was er nicht gesagt hat.</p><p>[Forts. v. ] Der Hl. Geist, der Tröster, ist nur* einer.* Wie Gott, der Vater, nur* einer* ist und es keinen zweiten Vater gibt, und wie der eingeborene Sohn und Logos Gottes nur* einer* ist und er keinen Bruder hat, so ist auch der Hl. Geist nur* einer* und gibt es keinen zweiten Geist, der ihm an Ehre gleich wäre. Der Hl. Geist ist die höchste Macht, etwas Göttliches, Unerforschliches. Er lebt, ist mit Vernunft begabt und heiligt alles, was Gott durch Christus erschaffen hat. Er erleuchtet die Seelen der Gerechten. Er war in den Propheten und im Neuen Bunde in den Aposteln. Diejenigen soll man hassen, welche sich erkühnen, die Wirksamkeit des Hl. Geistes zu trennen.* Einer* ist Gott der Vater, der Herr des Alten und des Neuen Bundes;* einer* ist der Herr Jesus Christus, der im Alten Gott der Vater, der Herr des Alten und des Neuen Bundes erschienen ist;* einer* ist der Hl. Geist, der durch die Propheten den Messias verkündet hatte und nach dem Erscheinen Christi herabstieg,um für ihn Zeugnis zu geben.</p><p>Niemand trenne daher den Alten Bund vom Neuen! Niemand sage, der Geist sei dort ein anderer als hier! Sonst versündigt er sich eben wider den Hl. Geist, der mit dem Vater und dem Sohne geehrt wird und zur Zeit der hl. Taufe in der hl. Dreifaltigkeit einbegriffen war. Ausdrücklich hat der eingeborene Sohn Gottes zu den Aposteln gesagt: „Gehet hin und lehret alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Hl.Geistes!“ Wir hoffen auf den Vater und den Sohn und den Hl. Geist. Nicht lehren wir drei Götter. Verstummen mögen die Marcioniten! Wir verkünden mit dem Hl. Geist durch den einen Sohn* einen* Gott. Was wir glauben, läßt sich nicht teilen; was wir verehren, kann nicht getrennt werden. Nicht trennen wir die hl. Dreifaltigkeit, wie es einige machen, noch vermischen wir sie wie Sabellius. Wir anerkennen mit frommem Sinne* einen* Vater, der uns seinen Sohn als Erlöser gesandt hat. Wir anerkennen* einen* Sohn, der verheißen hat, er werde vom Vater den Tröster senden. Wir anerkennen den Hl. Geist, der in den Propheten gesprochen hat und am Pfíngstfest in Gestalt feuriger Zungen auf die Apostel herabgekommen ist hier in Jerusalem im Obergeschosse der Apostelkirche; wir haben nämlich in allem den Vorzug. Hier ist Christus vom Himmel herabgestiegen. Hier ist der Hl. Geist vom Himmel herabgestiegen. Es wäre wahrlich ganz am Platze, wenn wir, wie wir über Christus und den Golgatha hier auf dem Golgatha sprechen, ebenso über den Hl. Geist in der oberen Kirche sprechen würden. Da jedoch der, welcher dort herabgekommen ist, an der Ehre des hier Gekreuzigten teil hat, darum belehren wir über den, der dort herabgekommen ist, an dieser Stätte. Was wir verehren, läßt sich ja nicht teilen.</p><p>[Forts. v. ] Wenn wir nun vom Hl. Geiste sprechen, wollen wir nicht eine genaue Erklärung seines Wesens geben — denn dies ist unmöglich —, sondern die verschiedenen Irrtümer über ihn erwähnen, um nicht aus Unkenntnis derselben einmal in dieselben zu verfallen. Die Irrwege wollen wir absperren, um allein den königlichen Weg zu wandeln. Wenn wir nun den einen oder anderen häretischen Ausspruch zitieren, so geschieht es, um uns sicher zu stellen, der Ausspruch selbst aber falle auf das Haupt der Häretiker zurück! Wir, die Prediger und die Zuhörer, wollen mit demselben nichts zu tun haben.</p><p>Die Häretiker, in allen Wassern gewaschen, haben auch wider den Hl. Geist ihre Zunge geschärft und sich erkühnt, Gottloses wider denselben zu lehren, wie Irenäus, der Exeget, in seinen Abhandlungen gegen die Häresien geschrieben hat. Zum Teil erfrechten sie sich, wie zuerst Simon, in der Apostelgeschichte der Magier genannt, zu behaupten, sie selbst seien der Hl. Geist. Nachdem er aus der Kirche ausgestoßen war, verstieg er sich zu solchen Lehren. Die gottlosen sog. Gnostiker stellten noch andere Lehren wider den Hl. Geist auf, wieder andere die frevelhaften Valentinianer. Der gottlose Manes erklärte kühn sich selbst als den von Christus gesandten Tröster. Wieder andere wagten zu behaupten, der Geist, welcher im Neuen Bunde wirkt, sei ein anderer als der, welcher in den Propheten war. Mannigfach ist ihr Irrtum, bzw. ihre Gotteslästerung. Hasse solche Menschen! Fliehe die, welche den Hl. Geist lästern! Für sie gibt es keine Verzeihung. Was willst du, der du auch in den Hl. Geist jetzt getauft werden wirst, mit den Hoffnungslosen Gemeinschaft pflegen? Wenn einer, der es mit einem Diebe hält und mit ihm läuft, der Strafe unterliegt, welche Hoffnung soll dann noch der haben, welcher sich gegen den Hl. Geist versündigt?</p><p>[Forts. v. ] Hassen soll man auch die Marcioniten, welche aus dem Neuen Testament die Worte des Alten Testamentes ausgemerzt haben. Der gar gottlose Marcion, welcher zuerst die Lehre von drei Göttern aufgestellt hat, hat auch zuerst, da er wußte, daß das Neue Testament prophetische Zeugnisse auf Christus enthält, die alttestamentlichen Zeugnisse daraus entfernt, damit dem König die Zeugen fehlen. Hassen soll man die oben erwähnten Gnostiker! Gnostiker (═ Wissende) sind sie nur dem Namen nach, in der Tat sind sie voll Unwissenheit; denn sie haben so verwegene Lehren über den Hl. Geist aufgestellt, daß ich sie nicht zu nennen wage.</p><p>Hassen muß man die Kataphrygier und den Unheilstifter Montanus mit seinen zwei angeblichen Prophetinnen Maximilla und Priscilla. Dieser verrückte und wahrhaft wahnsinnige Montanus — nur Wahnsinn hat so lehren können — hatte nämlich die Frechheit, zu behaupten, er sei der Hl. Geist — er, der erbärmliche Wicht voll Unreinheit und Ausschweifung. Aus Ehrfurcht vor den anwesenden Frauen mag es genügen, dies anzudeuten. Montanus nahm Pepuza, ein sehr kleines Dorf in Phrygien, in Besitz und nannte es fälschlich Jerusalem. Armselige, kleine Kinder ließ er für die sogenannten Mysterien der Montanisten schlachten und zu schändlichem Mahle zerstückeln; sie, die Montanisten, sind durch diese ihre Bräuche und, weil sie sich fälschlich den Namen „Christen“ beilegen, Schuld daran, daß Verleumder bis in die jüngste Zeit herauf bei Verfolgungen uns solche Schandtaten vorwerfen. Dieser mit aller Gottlosigkeit und Unmenschlichkeit erfüllte Mann, der unrettbar verloren ist, erfrechte sich zu behaupten, er sei der Hl. Geist.</p><p>[Forts. v. ] Ferner erhob sich zum Kampfe, wie bereits erwähnt, der gar gottlose Manes, in dem sich die Irrtümer aller Häresien vereinigten. Er, der letzte Abgrund des Verderbens, faßte die Irrlehren aller Häretiker zusammen und stellte noch eine neue Irrlehre auf. Er wagte zu behaupten, er sei der Tröster, dessen Sendung Christus versprochen hatte. Der Erlöser gab nun aber den Aposteln die Verheißung: „Ihr aber bleibet in der Stadt Jerusalem, bis ihr mit Kraft von oben angetan werdet!“ Wie, sollten etwa die Apostel, welche zweihundert Jahre vorher gestorben waren, darauf gewartet haben, daß sie zur Zeit des Manes mit Kraft angetan werden? Wird jemand leugnen, daß sie bereits seinerzeit voll des Hl. Geistes waren? Es ist doch geschrieben: „Alsdann legten sie die Hände auf, und sie empfingen den Hl. Geist“. Ist dies nicht vor Manes, und zwar viele Jahre vor ihm geschehen, nachdem der Hl. Geist am Pfingstfest herabgestiegen war?</p><p>Warum wurde Simon, der Magier, verdammt? War es nicht deshalb, weil er zu den Aposteln ging und sagte: „Gebet auch mir diese Gewalt, damit jeder, dem ich die Hand auflege, den Hl. Geist empfange“? Nicht sagte er nämlich: „Gebet mir auch Anteil an dem Hl. Geist“, sondern er verlangte „die Gewalt“, um das, was nicht gekauft werden kann, was er sich selbst nicht erworben hatte, an andere zu verkaufen. Den armen Aposteln bot er Geld an, als er sah, wie man den Erlös verkaufter Gegenstände brachte und ihnen zu Füßen legte. Nicht bedachte er, daß sie, welche das zum Unterhalt der Armen gespendete Geld mit Füßen traten, nicht gegen Bezahlung die Gewalt des Hl. Geistes gegeben hätten. Was entgegnen die Apostel dem Simon? „Behalte dein Geld bei dir, es sei dir zum Verderben, da du glaubtest, Gottes Gabe mit Geld zu erwerben!“ Ein zweiter Judas bist du, da du darauf rechnetest, die Gnade des Geistes gegen Geld zu verkaufen. Wenn nun Simon verdammt ist, weil er „die Gewalt“ um Geld erwerben wollte, wie groß muß dann das Verbrechen des Manes sein, der ausgab, er sei der Hl. Geist! Hassen wir die, welche gehaßt zu werden verdienen! Kehren wir denen den Rücken, von welchen sich Gott abwendet! Mit Beziehung auf alle Häretiker wollen wir kühn und offen zu Gott sprechen: „O Herr, hasse ich nicht diejenigen, welche dich hassen, und härme ich mich nicht deiner Feinde wegen ab?“ Es gibt nämlich auch eine sittlich gute Feindschaft, denn es steht geschrieben: „Ich will Feindschaft setzen zwischen dir und zwischen ihrer Nachkommenschaft“. Freundschaft mit der Schlange wirkt Feindschaft gegen Gott und den Tod.</p><p>Soviel möchten wir über diejenigen gesagt haben, welche (aus der Kirche) ausgestoßen sind. Nun wollen wir wieder zu den göttlichen Schriften zurückkehren und wollen Wasser trinken aus unseren Gefäßen, den heiligen Vätern, und aus unseren Brunnen. Trinken wollen wir vom „lebendigen Wasser, das in das ewige Leben emporquillt“. „Mit diesem Worte wies der Erlöser auf den Geist, welchen die, die an ihn glauben, empfangen werden“. Achte auf sein Wort! „Wer an mich glaubt (nicht schlechthin, sondern so) wie es die Schrift verlangt (er verwies dich auf das Alte Testament), aus dessen Innerem werden Ströme lebendigen Wassers fließen“, nicht irdische Ströme, welche bloß die Erde mit ihren Dornen und Bäumen bewässern, sondern Ströme, welche den Seelen Licht bringen. An anderer Stelle sagt er: „Doch das Wasser, das ich ihm geben werde, wird in ihm werden eine Quelle lebendigen Wassers, das in das ewige Leben emporquillt“. Das neue Wasser ist lebendig und quillt empor, es quillt empor für die, welche würdig sind.</p><p>Warum hat Christus die Gnade des Geistes Wasser genannt? Alles besteht nämlich aus Wasser, das Wasser bringt Pflanzen und Tiere hervor, das Wasser kommt im Regen vom Himmel herab. In einer einzigen Form kommt es zwar herab, auf verschiedene Art aber wirkt es. Ein und dieselbe Quelle ist es zwar, welche den ganzen Garten bewässert, und ein und derselbe Regen ist es, welcher auf die ganze Welt herabkommt. Aber weiß wird er in der Lilie, rot in der Rose, dunkelgelb in den Levkoien und Hyazinthen; in bunter Verschiedenheit zeigt er sich in den verschiedenartigen Dingen. Anders ist er in der Palme, anders im Weinstock. In allem ist er alles, obwohl er nur von* einer* Art und in sich selbst nicht verschieden ist. Nicht ändert sich der Regen und kommt bald so, bald anders hernieder, sondern er richtet sich nach der Beschaffenheit der Dinge, die ihn aufnehmen, und wird für das einzelne Ding das, was ihm entspricht.</p><p>So ist auch der Hl. Geist zwar nur* einer* und von* einer* Art und ungeteilt, aber er weist jedem die Gnade zu, wie er will. Wie das Holz, welches trocken war, sobald es Wasser in sich aufnimmt, Zweige hervorbringt, so bringt die Seele, welche in Sünden gelebt hatte, sobald sie durch Buße des Hl. Geistes gewürdigt ist, Trauben der Gerechtigkeit hervor. Obwohl der Hl. Geist von* einer* Art ist, wirkt er doch nach dem Willen Gottes im Namen Christi vielerlei Tugenden. Bei dem einen bedient er sich der Zunge zur Weisheit, bei einem anderen erleuchtet er die Seele durch Prophetie, einem anderen gibt er die Macht der Teufelaustreibung, einem anderen verleiht er die Gabe, die göttlichen Schriften auszulegen. Den einen stärkt er in der Enthaltsamkeit, einen anderen lehrt er Barmherzigkeit, einen anderen Fasten und Abtötung, einen anderen Verachtung irdischer Wünsche, wieder einen anderen macht er zum Märtyrer. In dem einen wirkt er so, in dem anderen anders, obwohl er sich selbst gleich bleibt. Es steht nämlich geschrieben: „Jedem wird die Offenbarung des Geistes gegeben zu seinem Nutzen. Dem einen wird durch den Geist die Rede der Weisheit verliehen, dem anderen die Rede der Erkenntnis nach demselben Geiste, einem anderen Glauben in demselben Geiste, wieder einem anderen die Gaben der Heilung in demselben Geiste, einem anderen die Kraft, Wunder zu wirken, einem anderen Prophetengabe, einem anderen Unterscheidung der Geister, einem anderen mancherlei Sprachen, einem anderen Deutung der Sprachen. All das wirkt aber ein und derselbe Geist; er teilt einem jeden einzelnen zu, wie er will“.</p><p>Da über den Geist im allgemeinen die göttlichen Schriften vieles und verschiedenes geschrieben haben, und da Gefahr besteht, daß man, nicht wissend, von welchem Geiste die einzelne Schriftstelle spricht, durch Unwissenheit in Verwirrung kommt, so ist es am Platze, jetzt festzustellen, was die Schrift unter dem Hl. Geiste versteht. Gleichwie nämlich Aaron Christus genannt wird, ebenso David, Saul und noch andere Christus heißen, obwohl nur* einer* der wahre Christus ist, so ist es, da auch die Bezeichnung „Geist“ verschieden angewendet wird, gut, zu wissen, wer eigentlich der Hl. Geist ist. Von vielen Geistern ist die Rede. Ein Engel heißt Geist, unsere Seele wird Geist genannt, auch dieser Wind, der weht, heißt Geist. Auch eine hohe Tugend wird als Geist bezeichnet. Auch eine unreine Handlung und der Dämon, der Widersacher, heißt Geist. Wenn du nun von Geistern hörst, achte darauf, daß du nicht etwa infolge der gleichen Worte das eine mit dem anderen verwechselst! Von unserer Seele sagt die Schrift: „Sein Geist wird ausziehen und in seine Erde zurückkehren“. Von derselben Seele sagt sie an anderer Stelle: „Er bildet den Geist des Menschen in ihm“. Bezüglich der Engel heißt es in den Psalmen: „Seine Engel macht er zu Geistern und seine Diener zur Feuerflamme“. Vom Winde sagt die Schrift: „Mit heftigem Geiste zertrümmerst du die Fahrzeuge von Tharsis“. und: „gleichwie im Walde die Bäume vom Geiste bewegt werden“, und: „Feuer, Hagel, Schnee, Eis, Geist des Sturmes“.Von der guten Lehre sagt der Herr selbst: „Die Worte, welche ich zu euch geredet habe, sind Geist und Leben“, d. h.: die Worte sind geistig. Der Hl. Geist aber wird nicht mit der Zunge ausgesprochen; er lebt und gibt die Kraft, weise zu reden. Er ist es, der redet und spricht.</p><p>Willst du Beweise dafür, daß er spricht und redet? Philippus ging auf die Offenbarung eines Engels hin den Weg, der von Jerusalem nach Gaza hinabführte, als der Eunuche kam. Da sprach der Geist zu Philippus: „Gehe hin und schließe dich diesem Wagen an!“ Wie du siehst, redet der Geist zu dem, der auf ihn hört. Ezechiel erklärt: „Der Geist des Herrn kam über mich und sprach zu mir: Dies spricht der Herr“. Ein andermal sprach der Hl. Geist zu den Aposteln in Antiochien: „Sondert mir nun den Barnabas und den Saulus ab für das Werk, zu welchem ich sie berufen habe!“ Wie du siehst, lebt der Geist, er sondert ab, beruft, entsendet in eigener Machtvollkommenheit. Paulus sagte: „Doch der Hl. Geist gibt mir in jeder Stadt kund, daß Banden und Bedrängnisse meiner warten“. Dieser gute Heiligmacher, Helfer und Lehrer der Kirche, der Hl. Geist, der Tröster, von dem der Heiland sagte: „Jener wird euch alles lehren und euch an alles erinnern“ — nicht bloß sagte: „Er wird lehren“, sondern; „Er wird euch auch an alles erinnern, was ich euch gesagt habe“, da die Lehren Christi keine anderen sind als die des Hl. Geistes, sondern ein und dieselben —, dieser Hl. Geist gab dem Paulus sein Schicksal im voraus kund, damit das Vorherwissen ihn erst recht mutig mache.</p><p>Diese Bemerkungen habe ich euch gemacht wegen des (obigen) Zitates: „Die Worte, welche ich zu euch geredet habe, sind Geist“. Hier sollst du unter Geist die gute Lehre, nicht das Reden mit Lippen verstehen.</p><p>Auch die Sünde wird, wie erwähnt, Geist genannt. (Hier) ist Geist in einem anderen, in entgegengesetztem Sinne gebraucht. So wenn es heißt:„Vom Geiste der Unzucht wurden sie betrogen“. Den Namen Geist führt auch der unreine Geist, der Dämon, doch mit dem Prädikate „unrein“. Immer wenn von einem Geiste die Rede ist, erhält er, um ihn zu charakterisieren, eine Apposition. Wenn die Schrift von der Seele des Menschen sprechen will, dann verbindet sie mit „Geist“ die Apposition „des Menschen“. Will sie vom Winde sprechen, dann sagt sie „der Geist des Sturmes“. Will sie von der Sünde sprechen, dann sagt sie „der Geist der Unzucht“. Will sie vom Dämon sprechen, sagt sie „der unreine Geist“. So können wir wissen, wovon jedesmal die Rede ist. Glaube also nicht, an solchen Stellen sei vom Hl. Geiste die Rede! Das sei ferne! Der Name Geist ist nämlich an und für sich unbestimmt. Alles, was keinen festen Körper hat, wird im allgemeinen Geist genannt.</p><p>Da nun auch die Dämonen keinen solchen Körper haben, werden sie Geister genannt. Doch ist ein großer Unterschied. Wenn nämlich der unreine Dämon auf eine Menschenseele eindringt — möge der Herr die Seelen aller Zuhörer und Abwesenden vor ihm bewahren! — stürzt er sich auf sie, wie ein blutgieriger Wolf sich auf das Schaf stürzt, bereit, es zu verschlingen. Gar wild ist er, wenn er sich zeigt, gar furchtbar, wenn man ihn zu fühlen bekommt; die Seele wird finster. Mit Unrecht greift er an, er raubt fremdes Eigentum. In seiner Gewalttätigkeit bedient er sich des fremden Körpers und fremden Werkzeuges, wie wenn es sein Eigentum wäre. Wer steht, den bringt er zu Fall. Er ist aus dem Gesinde dessen, der vom Himmel gefallen ist. Er macht wirr die Sprache, läßt krampfhaft die Lippen bewegen: statt der Worte tritt Schaum hervor. Der Mensch wird finster. Die Augen sind weit geöffnet, und doch sieht die Seele nicht mehr mit den Augen. Es zittert und zuckt der arme Mensch vor seinem Tode. Wahrlich, die Dämonen sind Feinde der Menschen, schändlich und unbarmherzig gehen sie mit ihnen um.</p><p>Nicht von dieser Art ist der Hl. Geist. Das sei ferne! Im Gegenteil, seine ganze Tätigkeit zielt auf das Gute und Heilsame ab. Zunächst ist sein Erscheinen milde. Wo er einkehrt, verbreitet sich Wohlgeruch. Gar leicht ist seine Last. Vor seiner Ankunft leuchten Strahlen des Lichtes und der Erkenntnis. Er kommt mit dem Herzen eines wahren Beschützers. Er kommt, um zu erlösen, zu heilen, zu lehren, zu mahnen, zu kräftigen, zu trösten, zu erleuchten, und zwar vor allem die Seele dessen, der ihn aufnimmt, dann auch durch Vermittlung dieses die Seelen anderer. Wie einer, der zuerst in der Finsternis war, dann plötzlich die Sonne schaute, durch die Erleuchtung des körperlichen Auges deutlich das sieht, was er zuvor nicht gesehen hatte, so schaut der, welcher des Hl. Geistes gewürdigt ist, durch die Erleuchtung seiner Seele in übermenschlicher Weise das, was er nicht gewußt hatte. Ist der Körper auch auf Erden, so schaut die Seele doch die Himmel wie in einem Spiegel. Sie sieht wie Isaias den Herrn sitzen auf einem hohen, erhabenen Throne. Sie sieht wie Ezechiel den, der auf den Cherubim ist. Sie sieht wie Daniel viele Zehntausende und viele Tausende. So klein der Mensch ist, er schaut den Anfang der Welt und das Ende der Welt und die Mitte der Zeiten und die Könige, wie sie aufeinander folgen. Was er nicht gelernt hat, weiß er; denn der wahre Luzifer ist bei ihm. Lebt der Mensch auch zwischen den Wänden, die Kraft seiner Erkenntnis reicht doch weit darüber hinaus, so daß er auch das sieht, was andere tun.</p><p>Petrus war zwar nicht dabei, als Ananias und Saphira ihre Besitzungen verkauften. Aber durch den Geist war er doch dabei. „Warum“ — frägt er — „hat der Satan dein Herz erfüllt, daß du den Hl. Geist belogen hast?“ Kein Kläger war da, kein Zeuge. Woher wußte er, was geschehen war? „Wäre dir nicht das, was du behalten hattest, geblieben, und wäre dir nicht, was du verkauft hast, zur Verfügung gestanden? Warum hast du in deinem Herzen beschlossen, solches zu tun?“ Durch die Gnade des Geistes hat der ungebildete Petrus gelernt, was nicht einmal die Weisen der Griechen gewußt hatten. Ein ähnliches Beispiel gibt dir Elisäus. Obwohl Elisäus den Aussatz des Naaman unentgeltlich geheilt hatte, nahm Giezi eine Bezahlung dafür entgegen; für fremde Wohltaten ließ er sich bezahlen. Er nahm von Naaman das Geld entgegen und legte es an einen finsteren Platz. Doch die Finsternis ist nicht finster vor den Heiligen. Als Giezi zurückkehrte, fragte ihn Elisäus ähnlich wie Petrus, der sagte: „Sage mir, habt ihr den Acker so teuer verkauft?“ Elisäus stellt die Frage: „Giezi, woher kommst du?“ Nicht aus Unwissenheit, sondern aus trauriger Erregung stellt er die Frage: „Woher?“ „Aus der Finsternis bist du gekommen, und in die Finsternis wirst du wandern. Die Heilung des Aussätzigen hast du verkauft und erbst den Aussatz. Ich habe“ — sagt er — „den Befehl dessen ausgeführt, der zu mir gesagt hat:,Umsonst habt ihr empfangen, umsonst sollt ihr geben‘. Du aber hast die Gnade verkauft; empfange das, weswegen du das Geschäft machen konntest!“ Was sagt zu ihm Elisäus ‚„Bin ich nicht geistig mit dir gegangen?‘ Dem Körper nach war ich hier, der Geist aber, den mir Gott gegeben hat, sah in die Ferne und zeigte mir deutlich, was anderswo geschah.“</p><p>Wie du siehst, nimmt der Hl. Geist nicht nur die Unwissenheit weg, er verleiht auch Kenntnis. Der Hl. Geist erleuchtet, wie du siehst, die Seelen.</p><p>[Forts. v. ] Isaias, der vor fast tausend Jahren lebte, schaute Sion gleich einem Zelte. Noch stand (damals) die Stadt, mit Plätzen geschmückt und mit Würde bekleidet. Gleichwohl sagt er: „Sion wird wie ein Acker gepflügt werden“. Was jetzt, in unserer Zeit, sich erfüllt hat, hatte er vorhergesagt. Achte auf die Genauigkeit der Weissagung. Er sagte nämlich: „Verlassen wird die Tochter Sions sein wie eine Hütte im Weinberge und wie eine Laube im Gurkenfelde“. Und wirklich ist jetzt die Stätte voll Gurken.</p><p>Wie du siehst, erleuchtet der Hl. Geist die Heiligen. Lasse dich nicht durch die Gleichheit des Wortes irre führen, sondern halte dich an das, was genau feststeht!</p><p>Wenn dir einmal zufällig, während du da saßest, ein Gedanke an Keuschheit oder Jungfräulichkeit kam, war es der Hl. Geist, der dich belehrte. Hat nicht oftmals ein Mädchen, das dem Brautgemache nahe war, noch die Flucht ergriffen, weil der Hl. Geist es über die Jungfräulichkeit belehrt hat? Hat nicht oft einer, der herrlich in Palästen gewohnt hatte, auf Reichtum und Würde verzichtet, vom Hl. Geiste belehrt? Hat nicht oftmals ein Jüngling beim Anblick einer Schönheit die Augen geschlossen, hat es vermieden, sie anzuschauen, und ist der Befleckung entgangen? Du frägst, woher dies komme. Der Hl. Geist hat die Seele des Jünglings belehrt. So viel Habsucht findet sich in der Welt, aber Christen verlangen, arm zu sein. Warum? Wegen der Verheißung des Geistes. Wahrlich, etwas Kostbares ist der heilige, der gute Geist. Es ist recht, daß wir auf den Vater, den Sohn und den Hl. Geist getauft werden.</p><p>Der Mensch hat, so lange er noch im Körper lebt, mit vielen, sehr wilden Dämonen zu kämpfen. Aber schon oft wurde der Dämon, der von vielen mit eisernen Ketten nicht bezwungen wurde, durch die Worte des Gebetes von einem Menschen kraft des in ihm wohnenden Hl. Geistes bezwungen. Das einfache Anblasen von seiten des Exorzisten wirkt auf den unsichtbaren Dämon wie Feuer. Gott hat uns also einen großen Mitkämpfer und Verteidiger gegeben, einen großen Lehrer der Kirche, einen großen Wächter zu unserem Schutze. Fürchten wir nicht die Dämonen, auch nicht den Teufel! Denn, der für uns kämpft, ist noch größer. Nur müssen wir ihm die Türen öffnen. Denn er geht umher und sucht nach den Würdigen, und sucht, wem er seine Gaben schenke.</p><p>Der Hl. Geist wird Tröster genannt, da er tröstet und ermuntert und sich unserer Schwachheit annimmt. „Um was wir bitten sollen, so wie es notwendig ist, wissen wir nicht. Doch der Geist selbst tritt für uns ein mit wortlosen Seufzern“ — nämlich Gott gegenüber. Oft wurde einer ungerechterweise um Christi willen beschimpft und entehrt; das Martyrium steht bevor, Qualen allenthalben: Feuer, Schwert, wilde Tiere, Abgrund. Aber der Hl. Geist redet ihm zu und sagt: „Warte auf den Herrn, o Mensch! Klein ist, was du erleidest, groß, was dir geschenkt wird. Kurze Leidenszeit bringt dir ewiges Leben mit den Engeln.“ „Nicht zu vergleichen sind die Leiden unserer Zeit mit der Herrlichkeit, welche an uns offenbar werden wird.“ Der Hl. Geist malt dem Menschen das Himmelreich vor und zeigt ihm das Paradies der Wonne. Wenn auch die Märtyrer ihre leiblichen Augen — weil es nicht anders ging — den Richtern zugewendet hatten, so war doch ihr Geist im Paradiese, und darum achteten sie nicht auf die irdischen Beschwerden.</p><p>[Forts. v. ] Willst du einen Beweis dafür, daß die Märtyrer in der Kraft des Hl. Geistes Märtyrer werden? Der Heiland sagt zu den Jüngern: „Wenn man euch in die Synagogen, vor Herrscher und Beamten führt, dann seid nicht besorgt, wie ihr euch verteidigen und was ihr sagen sollt! Denn der Hl. Geist wird euch zur selben Stunde lehren, was ihr sagen müßt“. Unmöglich ist es nämlich, daß jemand anders als durch den Hl. Geist für Christus das Martyrium auf sich nimmt. Denn wenn „niemand sagen kann,Herr Jesus Christus’ außer im Hl. Geiste“, wie sollte jemand für Jesus sein Leben geben können, wenn nicht im Hl. Geiste?</p><p>Der Hl. Geist ist etwas Großes, in seinen Gnadenerweisungen etwas Allmächtiges und Wunderbares. Bedenke, wieviel ihr seid, die ihr hier sitzet, wie viele Seelen beisammen sind! In jedem einzelnen wirkt er in entsprechender Weise. Er ist mitten unter uns und sieht das Verhalten eines jeden einzelnen, er sieht die Gedanken, die Gewissen, was wir reden und sinnen und glauben. Schon damit ist wahrlich viel gesagt, aber doch ist es noch eine Kleinigkeit. Lasse sein Licht hineinleuchten in deinen Verstand und erwäge, wie viele Christen es in unserer ganzen Diözese gibt, wie viele in der ganzen Kirchenprovinz Palästina! Dann schaue mit dem Auge des Geistes von der Kirchenprovinz weg auf das ganze römische Reich und von da weg auf die ganze Welt, auf die Stämme der Perser, das Volk der Inder, auf die Gothen, die Sauromaten, die Gallier und Spanier und Mauren, die Libyer und Äthiopier und dazu noch die Völker, welche wir dem Namen nach nicht kennen; von vielen Völkern ist uns ja nicht einmal der Name bekannt geworden. Denke an die Bischöfe, Priester, Diakonen, Mönche, Jungfrauen und ferner die Laien eines jeden Volkes! Dann denke daran, wie der große Führer, der Spender der Gnaden, in der ganzen Welt dem einen Keuschheit verleiht, dem anderen immerwährende Jungfräulichkeit, einem anderen Barmherzigkeit, diesem freiwillige Armut, jenem die Gabe, feindliche Geister auszutreiben! Gleichwie das Licht mit einem einzigen Strahle alles erleuchtet, so erleuchtet der Hl. Geist diejenigen, welche Augen haben. Hat einer keine Augen und wird er der Gnade nicht gewürdigt, tadle er nicht den Geist, sondern seinen eigenen Unglauben!</p><p>Nachdem du dir das Wirken des Hl. Geistes auf der ganzen Welt vorgestellt hast, bleibe nicht auf der Erde! Steige empor zu dem, was oben ist! Steige im Geiste empor zum ersten Himmel und schaue dort auf die vielen, ungezählten Myriaden von Engeln! Wenn du kannst, steige mit deinen Gedanken noch weiter hinauf! Schaue die Erzengel, schaue die Geister, schaue die Mächte, schaue die Fürsten, schaue die Kräfte, schaue die Throne, schaue die Herrschaften! Über sie alle ist von Gott als Führer, Lehrer und Heiligmacher der Tröster gestellt. Seiner bedarf unter den Menschen Elias, Elisäus, Isaias. Seiner bedarf unter den Engeln Michael, Gabriel. Keines von den Geschöpfen steht ihm an Ehre gleich. Alle Chöre und Heerscharen der Engel zusammengenommen kommen dem Hl. Geiste nicht gleich. Gegenüber der allgütigen Macht des Trösters verdunkeln diese alle. Während diese ausgesandt werden, um zu dienen, ergründet der Geist selbst die Tiefe Gottes, wie der Apostel sagt: „Der Geist ergründet nämlich alles, selbst die Tiefen Gottes. Wer von den Menschen weiß, was des Menschen ist, außer der Geist, welcher im Menschen wohnt? So erkennt auch keiner, was Gottes ist, außer dem Geiste Gottes“.</p><p>[Forts. v. ] Der Hl. Geist hat durch die Propheten den Messias verkündet. Er hat gewirkt in den Aposteln. Er besiegelt bis auf den heutigen Tag die Seelen in der Taufe. Der Vater gibt dem Sohne, der Sohn übermittelt an den Hl. Geist. Jesus selbst, nicht ich sage es: „Alles ist mir von meinem Vater übergeben“. Und über den Hl. Geist bemerkt er: „Wenn jener, der Geist der Wahrheit, kommt,.... jener wird mich verherrlichen; denn von dem Meinigen nimmt er und wird euch mitteilen“. Der Vater schenkt durch den Sohn in Verbindung mit dem Hl. Geist alle Gnaden. Nicht sind die Gnaden des Vaters andere als die des Sohnes und als die des Hl. Geistes. Es gibt nur* ein* Heil,* eine* Kraft,* einen* Glauben. Es ist* ein* Gott, der Vater; es ist* ein* Herr, sein eingeborener Sohn;* einer* ist der Hl. Geist, der Tröster.</p><p>Dies zu wissen, genüge uns! Die Natur aber oder das Wesen des Geistes sollst du nicht neugierig erforschen wollen! Wäre darüber geschrieben, wir würden es euch sagen. Was nicht geschrieben ist, darüber wollen wir nicht zu sprechen wagen. Wenn wir selig werden wollen, genüge es zu wissen: es ist der Vater, der Sohn und der Hl. Geist.</p><p>Dieser Geist war zur Zeit des Moses auf die siebzig Ältesten herabgestiegen.</p><p>Möge jedoch, Geliebteste, die Länge der Rede euch nicht ermüden! Er, von dem wir reden, möge jedem Kraft verleihen, sowohl uns, die wir reden, als euch, die ihr zuhöret!</p><p>Dieser Geist — sagte ich — war auf die siebzig Ältesten zur Zeit des Moses herabgestiegen. Ich erwähne dies, um dir jetzt zu zeigen, daß der Geist alles weiß, und daß er wirkt, wie er will. Die siebzig Ältesten wurden auserwählt; „da stieg der Herr in einer Wolke herab und nahm von dem Geiste, der in Moses war, und gab den siebzig Ältesten“. Nicht war der Geist geteilt worden, sondern die Gnade war ausgeteilt worden entsprechend den Empfängern und entsprechend der Kraft der Empfangenden. Doch waren (damals nur) achtundsechzig zugegen von denen, welche Propheten geworden waren, Eldad und Medad waren nicht zugegen. Um zu zeigen, daß nicht Moses die Gnade spendete, sondern daß der Geist wirkte, wurden Eldad und Medad berufen und Propheten, ohne bereits zugegen gewesen zu sein.</p><p>Josue, der Sohn des Nave und Nachfolger des Moses, war darüber erstaunt, trat zu Moses und sprach: „Hast du gehört, daß Eldad und Medad weissagen? Sie wurden berufen, obwohl sie nicht erschienen waren. Moses, mein Herr, tue ihnen Einhalt!“ Moses antwortet: „Ich kann es ihnen nicht wehren. Denn die Gnade kommt vom Himmel. Ich bin soweit entfernt, es ihnen zu wehren, daß ich sie vielmehr selbst für begnadet halte. Doch will ich nicht annehmen, daß du dies aus Neid gesagt hast. Sei nicht eifersüchtig, weil jene weissagten, während du noch nicht weissagst! Warte die Zeit ab! Und wer wird das ganze Volk des Herrn zu Propheten machen, wenn einmal der Herr seinen Geist ihnen geben wird?“ Ein Wort der Weissagung ist es: „wenn der Herr geben wird“. Jetzt hat er ihn (euch) noch nicht gegeben; noch nicht hast du ihn. Hatten Abraham, Isaak, Jakob und Joseph ihn nicht erhalten? Hatten ihn nicht die Männer erhalten, welche vor Moses lebten? Ja, aber Moses will sagen: „wenn der Herr ihn* allen* geben wird; jetzt ist die Gnade an einzelne verteilt, später werden die Gnadengaben allen zuteil sein“. Jenes Wort deutete an, was bei uns am Pfingstfest geschah. Der Geist ist es, der zu uns herabkam.</p><p>Auch schon früher ist der Hl. Geist auf viele herabgekommen. Denn es ist geschrieben: „Josue, der Sohn des Nave, wurde vom Geist der Weisheit erfüllt; denn Moses legte seine Hände auf ihn“. Überall siehst du das gleiche Symbol (der Handauflegung), im Alten und im Neuen Testament. Zur Zeit des Moses wurde der Geist durch Handauflegung verliehen, auch Petrus spendet den Geist unter Auflegung der Hände. Auch über dich wird bei der Taufe die Gnade kommen. In welcher Weise, davon spreche ich nicht; denn ich will nicht vorgreifen.</p><p>[Forts. v. ] Der Hl. Geist kam auf alle Gerechten und Propheten, nämlich auf Enos, Enoch, Noë usw., auf Abraham, Isaak, Jakob. Daß der Geist Gottes in Joseph war, hat sogar schon Pharao erkannt. Von Moses und den zu seiner Zeit in der Kraft des Geistes gewirkten Wundern hast du oft gehört. Auch der heldenmütige Job besaß den Geist, ebenso alle Heiligen, wenn wir auch ihre Namen nicht alle einzeln erwähnen. Auch bei der Errichtung der Stiftshütte wurde der Geist gesandt: er erfüllte die Weisen um Beseleel mit Weisheit.</p><p>Im Buche der Richter lesen wir, daß in der Kraft dieses Geistes Othoniel richtete, Gedeon stark wurde, Jephte siegte, Debora, das Weib, Krieg führte, Samson, solange er gerecht handelte und den Geist nicht betrübte, Übermenschliches wirkte. In den Büchern der Könige [= 1. u. 2. Sam. u. 1. u. 2. Könige nach neuerer Zählart] lesen wir deutlich, daß Samuel und David im Hl. Geist prophezeiten und durch ihn die Führer der Propheten wurden. Samuel hieß „der Seher“. David sagt ausdrücklich: „Der Geist des Herrn sprach in mir“, und in den Psalmen ruft er: „Nimm deinen Hl. Geist nicht von mir“. Und wiederum sagt er: „Dein guter Geist wird mich führen ins rechte Land“. In den Büchern der Chronik lesen wir, daß Azarias unter König Asaph und Oziel unter König Josaphat und noch ein anderer Azarias, der gesteinigt worden war, den Hl. Geist empfangen hatten. Und Esdras berichtet: „Du hast deinen guten Geist gegeben, sie zu unterweisen“. Von Elias, der aufgefahren ist, und von Elisäus, diesen Geistesmännern und Wundertätern, ist es — auch wenn wir nicht davon sprechen — bekannt, daß sie voll des Hl. Geistes waren.</p><p>[Forts. v. ] Wenn einer alle Bücher der Propheten, sowohl der zwölf wie der übrigen, durchblättert, wird er zahlreiche Zeugnisse über den Hl. Geist finden. Michäas sagt im Namen Gottes: „Nur ich erfülle mit Kraft im Geiste des Herrn“. Joel ruft: „Alsdann werde ich, spricht Gott, von meinem Geiste ausgießen über alles Fleisch usw.“. Aggäus [= Haggai] erklärt: „Denn ich bin mit euch, spricht der allmächtige Herr, und mein Geist bleibt in eurer Mitte“. Ähnlich sagt Zacharias: „Doch nehmet meine Worte und meine Gesetze an, welche ich durch meinen Geist meinen Dienern, den Propheten, verkünde!“ usw.</p><p>Isaias, der gewaltige Herold, sagt: „Auf ihm wird ruhen der Geist Gottes: der Geist der Weisheit und der Erkenntnis, der Geist des Rates und der Stärke, der Geist der Wissenschaft und der Frömmigkeit, und erfüllen wird ihn der Geist der Furcht Gottes“. Damit lehrt er, daß der Geist* einer* ist und unteilbar, daß aber seine Wirksamkeit eine verschiedene ist. An anderer Stelle: sagt er: „Jakob, mein Knecht...... meinen Geist habe ich auf ihn gelegt“. Wieder an anderer Stelle: „Meinen Geist werde ich auf deinen Samen legen“. Wiederum: „Jetzt hat mich der allmächtige Herr und sein Geist gesandt. An anderer Stelle: „Dies ist mein Bund mit ihnen, sprach der Herr: mein Geist, welcher auf dir ist“. Ferner: „Der Geist des Herrn ist auf mir, weshalb er mich gesalbt hat....“. In seinen Reden wider die Juden sagt er: „Sie aber gehorchten nicht und erzürnten seinen Hl. Geist“, und: „Wo ist der, welcher den Hl. Geist in sie gelegt hat?“ Bei Ezechiel — sofern es dich nicht ermüdet, noch länger zuzuhören — liest du das bereits erwähnte Wort: „Auf mich fiel der Geist und sprach zu mir: sage: so redet der Herr“. Das Wort „er* fiel* auf mich“ muß man aber recht verstehen, nämlich in freundschaftlichem Sinne, in gleichem Sinne, wie den Bericht: Jakob* fiel* dem Joseph, da er ihn fand, um den Hals, oder wie die evangelische Erzählung: als der liebende Vater den aus der Fremde zurückkehrenden Sohn sah, „wurde er von Mitleid gerührt, lief ihm entgegen,* fiel* ihm um den Hals und küßte ihn“. Wiederum liest du bei Ezechiel: „Er führte mich im Gesichte im Geiste Gottes nach Chaldäa zu den Gefangenen“. Noch andere Stellen hast du früher im Unterricht über die Taufe gehört. „Ich werde über euch reines Wasser ausgießen...., ich werde euch ein neues Herz geben, und einen neuen Geist werde ich in euch geben“. Und gleich darauf: „Und meinen Geist werde ich in euch geben“. Und wiederum: „Und die Hand des Herrn kam über mich und führte mich hinaus im Geiste des Herrn“.</p><p>[Forts. v. ] Der Hl. Geist gab Weisheit der Seele Davids, so daß er, obwohl noch ein Jüngling, Richter der Alten wurde. Die keusche Susanna wurde wegen Unkeuschheit verurteilt. Niemand war da, der für sie eintrat. Wer hätte sie den Ratsherren entrissen? Sie wurde zum Tode geführt. Schon war sie in den Händen der Schergen. Doch der Helfer war da, der Tröster, der HI. Geist, der jede vernünftige Kreatur heiligt. Komme, o Jüngling — spricht er zu Daniel —, klage die Alten an, die von Jugendsünden angesteckt sind! Es ist nämlich geschrieben: „Gott erweckte den Hl. Geist in einem noch ganz jungen Manne“. Und — um es kurz zu sagen — trotz allem wurde die Keusche durch den Ausspruch Daniels gerettet. Dies erwähnen wir, um ein Zeugnis anzuführen; zu einer exegetischen Auseinandersetzung ist keine Zeit.</p><p>Auch Nabuchodonosor hatte erkannt, daß in Daniel der Hl. Geist wohnt. Denn er sagt zu ihm: „Balthasar, Oberster der Zeichendeuter, ich weiß von dir, daß der Hl. Geist Gottes in dir wohnt!“ Sein Wort war wahr und falsch. Wahr war, daß er den Hl. Geist empfangen hatte. Nicht jedoch war er der Oberste der Zeichendeuter; denn er war kein Zauberer, sondern weise durch den Geist. Schon früher hatte Daniel ihm den Traum ausgelegt, den er über die Bildsäule geschaut hatte, den er aber trotzdem nicht (mehr) wußte. „Erzähle mir“ — spricht Nabuchodonosor — „den Traum, den ich gesehen habe, aber nicht mehr weiß!“ Erkennst du die Kraft des Hl. Geistes? Was die, welche etwas gesehen haben, nicht wissen, das wissen und erklären die, welche es nicht gesehen haben.</p><p>Noch gar viele Zeugnisse könnte man wahrlich aus dem Alten Testamente anführen, um die Lehre vom Hl. Geiste noch ausführlicher zu behandeln. Doch die Zeit ist zu kurz. Auch muß der Prediger Maß halten. Daher wollen wir uns mit dem, was wir bisher aus dem Alten Testamente angeführt haben, begnügen und wollen, so Gott will, in der nächsten Katechese zu dem übergehen, was noch aus dem Neuen Testamente zu berichten ist.</p><p>Der Gott des Friedens aber möge durch unseren Herrn Jesus Christus und durch die Liebe des Hl. Geistes euch alle der geistigen und himmlischen Gnadengaben würdigen! Ihm sei Ehre und Herrschaft in alle Ewigkeit. Amen.XVII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über den HI. Geist. (Fortsetzung.)</p><h2>18</h2><p>* Über den HI. Geist. (Fortsetzung.)*</p><p>In der vorhergehenden Katechese haben wir, soweit es möglich war, eurer Liebe einen kleinen Teil der Zeugnisse über den Hl. Geist vorgelegt. Jetzt werden wir, so Gott will und soweit es möglich ist, uns an die Zeugnisse machen, welche noch aus dem Neuen Testamente zu erwähnen sind. Dort hatten wir, um in der Predigt Maß zu halten, uns Einhalt geboten; unerschöpflich ist nämlich die Lehre über den Hl. Geist. Jetzt werden wir wiederum nur einen kleinen Teil von dem erwähnen, was noch zu sagen übrig ist. Denn offen bekennen wir auch jetzt, daß unsere Schwachheit von der Menge dessen, was geschrieben ist, überladen wird. Auch heute bedienen wir uns nicht menschlicher Weisheitssprüche, da es wertlos wäre, sondern berufen uns bloß auf die Worte der göttlichen Schriften; denn dies ist der sicherste Weg nach dem heiligen Apostel Paulus, welcher sagt: „Davon reden wir auch, (aber) nicht in Worten, welche uns Menschenweisheit gelehrt hat, sondern in Worten, die vom Geiste gelehrt sind, indem wir Geistiges den Geistesmenschen vermitteln“.</p><p>Wir machen es wie die Wanderer oder die Schiffer, welche, wenn sie auch dem einen Ziel ihrer so großen Reise mit Eifer zueilen, doch wegen der menschlichen Schwäche an verschiedenen Städten und Häfen anzulegen pflegen.</p><p>In getrennten Vorträgen sprechen wir über den Hl. Geist; untrennbar aber ist der Geist, er ist ein und derselbe. Gleichwie wir bei einem Unterrichte über den Vater das eine Mal seine Einheit, dann seinen Namen Vater oder Allmächtiger, dann seine Weltschöpfung zum Thema nahmen, ohne durch diese Abteilung in Katechesen den Glauben zu teilen, da das religiöse Ziel eins war und ist; gleichwie wir ferner bei einem Unterricht über den eingeborenen Sohn Gottes das eine Mal über seine Gottheit, das andere Mal über seine Menschheit belehrten, ohne dadurch, daß wir die Lehre über unseren Herrn Jesus Christus in viele Themata teilten, zu erklären, der Glaube an ihn sei teilbar: ebenso teilen wir jetzt die Katechesen über den Hl. Geist, ohne jedoch zu behaupten, der Glaube an ihn sei teilbar. Denn* einer* ist auch der Hl. Geist, der zwar seine Gaben jedem besonders zuweist, wie er will, selbst aber unteilbar bleibt. Nicht nämlich ist der Tröster ein anderer als der Hl. Geist, sondern er ist ein und derselbe, nur hat er verschiedene Namen: er ist der Lebende, die Person, der Redende, der Wirksame, der Heiligmacher aller von Gott durch Christus erschaffenen vernünftigen Wesen, der Engel wie der Menschen.</p><p>[Forts. v. ] Damit nicht einige in ihrer Unwissenheit aus der Verschiedenheit der Namen des Hl. Geistes auf verschiedene Geister schließen, statt der Tatsache entsprechend einen einzigen Geist anzunehmen, hat die katholische Kirche in ihrer Vorsorge für dich durch ihr Glaubensbekenntnis dich glauben gelehrt „an den* einen* Hl. Geist, den Tröster, der durch die Propheten gesprochen hat“. Du sollst nämlich erkennen, daß es zwar viele Bezeichnungen gibt, aber nur* einen* Hl. Geist. Aus der großen Zahl seiner Namen werden wir euch nun einige nennen.</p><p>Er hat den Namen Geist nach der eben verlesenen Stelle: „Dem einen wird durch den Geist verliehen das Wort der Weisheit“. Er heißt Geist der Wahrheit; denn der Heiland sagt: „Wenn aber jener kommt, der Geist der Wahrheit“. Er heißt Tröster, da der Heiland gesagt hat: „Denn wenn ich nicht hingehe, wird der Tröster nicht zu euch kommen“. Daß er, trotzdem er verschiedene Namen führt, doch ein und derselbe ist, ergibt sich deutlich aus folgendem. Zum Beweise dafür, daß der Hl. Geist und der Tröster derselbe ist, ist gesagt: „Der Tröster aber, der Hl. Geist“. Zum Beweise dafür, daß aber auch der Tröster und der Geist der Wahrheit derselbe ist, heißt es: „Noch einen anderen Tröster wird er euch geben, damit er bei euch bleibe in Ewigkeit, den Geist der Wahrheit“, und wiederum: „Wenn der Tröster, den ich euch vom Vater senden werde, kommen wird, der Geist der Wahrheit“. Er wird Geist Gottes genannt; denn es ist geschrieben: „Ich sah den Geist Gottes herabsteigen“, und an anderer Stelle: „Alle, die sich vom Geiste Gottes leiten lassen, diese sind Söhne Gottes“. Er hat auch den Namen Geist des Vaters; denn der Heiland sagt: „Denn nicht ihr seid es, die reden, sondern der Geist eures Vaters ist es, der in euch spricht“. Und Paulus wiederum schreibt: „Daher beuge ich meine Knie vor dem Vater...., daß er euch verleihe, durch seinen Geist gestärkt zu werden“. Er heißt auch Geist des Herrn; denn Petrus sagte: „Warum habt ihr euch vereinbart, den Geist des Herrn zu versuchen?“ Auch Geist Gottes und Christi wird er genannt; denn Paulus schreibt: „Ihr aber seid nicht im Fleische, sondern im Geiste, sofern der Geist Gottes in euch wohnt. Wenn aber einer den Geist Christi nicht hat, ist er nicht sein“. Er heißt auch Geist des Sohnes Gottes; denn es ist gesagt: „Da ihr aber Söhne seid, entsandte Gott den Geist seines Sohnes“. Auch Geist Christi wird er genannt; denn es steht geschrieben: „(Sie forschten), auf welche Zeit oder Umstände der in ihnen wohnende Geist Christi hindeutete“, und wiederum: „Durch euer Gebet und den Beistand des Geistes Jesu Christi“.</p><p>Außerdem wirst du noch viele andere Bezeichnungen für den Hl. Geist finden. Er wird Geist der Heiligung genannt; denn es ist geschrieben: „nach dem Geiste der Heiligung“. Er heißt Geist der Kindschaft; denn Paulus sagt: „Denn ihr habt nicht empfangen den Geist der Knechtschaft zur Furcht, sondern ihr habt empfangen den Geist der Kindschaft, in dem wir rufen: Abba, Vater“. Auch Geist der Offenbarung wird er genannt; denn es ist geschrieben: „Er möge euch geben den Geist der Wahrheit und Offenbarung in seiner Erkenntnis!“ Auch Geist der Verheißung wird er genannt; denn Paulus wiederum sagt: „In ihm seid auch ihr, als ihr gläubig wurdet, besiegelt worden durch den heiligen Geist der Verheißung“. Auch heißt er Geist der Gnade, da Paulus wiederum sagt: „Wer den Geist der Gnade verhöhnt hat“. Noch mit mehreren anderen Bezeichnungen wird er benannt. In der vorhergehenden Katechese ist dir klar gesagt worden, daß er in den Psalmen das eine Mal der Gute, das andere Mal der Führende genannt wird und bei Isaias „Geist der Weisheit, der Erkenntnis, des Rates, der Stärke, der Wissenschaft, der Frömmigkeit, der Furcht Gottes“ hieß.</p><p>Aus all dem, was wir früher und jetzt gesagt haben, ergibt sich, daß die Namen (des Geistes) verschieden sind, daß aber der Hl. Geist ein und derselbe ist. Er ist der Lebendige, der Persönliche, er ist ewig mit dem Vater und dem Sohne. Nicht wird er vom Munde und von den Lippen des Vaters oder des Sohnes gesprochen oder gehaucht, nicht zerfließt er in die Luft, sondern er ist Person, er ist der Redende, der Wirkende, der Gnadenspendende, der Heiligende. Das heilsame, vom Vater, vom Sohn und vom Hl. Geist ausgehende Wirken uns gegenüber ist natürlich, wie wir schon früher gesagt haben, ein untrennbares, einheitliches, einziges. Ich möchte, daß ihr euch noch an jene letzthin gegebenen Lehren erinnert und wohl wisset, daß nicht der eine Geist im Gesetze und in den Propheten und ein anderer in den Evangelien und in den Aposteln gewesen ist, daß es vielmehr ein und derselbe Hl. Geist ist, welcher im Alten und Neuen Testamente die göttlichen Schriften diktiert hat.</p><p>[Forts. v. ] Dieser Hl. Geist ist es, welcher auf die heilige Jungfrau Maria gekommen ist. Da es nämlich Christus, der Eingeborene, war, der geboren werden sollte, überschattete die Kraft des Höchsten dieselbe und kam der Hl. Geist über sie und heiligte sie, damit sie den empfange, durch welchen alles geworden war. Nicht viele Worte brauche ich zu machen, um dich zu belehren, daß die Geburt unbefleckt und rein war. Denn du weißt es, Gabriel hat zu ihr gesprochen: „Ich verkünde, was geschehen wird. Nicht jedoch bin ich mittätig. Wenn ich auch ein Erzengel bin, kenne ich doch meine Stellung. Ich verkünde dir Freude; wie du aber gebären wirst, hängt nicht von meiner Gnade ab. ‚Der Hl. Geist wird über dich kommen, und die Kraft des Höchsten wird dich überschatten; deshalb wird auch das Heilige, das geboren wird, Sohn Gottes genannt werden.‘“</p><p>Dieser Hl. Geist wirkte in Elisabeth. Er erkennt nicht nur Jungfrauen, sondern auch Verehelichte, soferne die Ehe legitim ist. „Und Elisabeth wurde vom Hl. Geist erfüllt“ und weissagte. Und die gute Magd sagt von ihrem Herrn: „Woher kommt mir dies, daß die Mutter meines Herrn zu mir kommt?“ Selig pries sich Elisabeth. Von diesem Hl. Geiste wurde auch Zacharias, der Vater des Johannes, erfüllt, und er weissagte alles Gute, das der Eingeborene spende, und sagte, daß Johannes durch die Taufe sein Vorläufer werde. Von diesem Hl. Geiste wurde der gerechte Simeon belehrt, daß er den Tod nicht schauen werde, ehe er den Gesalbten des Herrn sehe, und er nahm ihn im Tempel in seine Arme und gab ausdrücklich von ihm Zeugnis.</p><p>[Forts. v. ] Johannes, der vom Mutterschoße an vom Hl. Geiste erfüllt war, wurde geheiligt, um den Herrn zu taufen. Nicht gab er den Geist, sondern er verkündete den, welcher den Geist gibt. Er sagt nämlich: „Ich taufe euch mit Wasser zur Buße; der aber, welcher nach mir kommt...., er wird euch taufen mit dem Hl. Geiste und mit Feuer“. Inwiefern mit Feuer? Da die Herabkunft des Hl. Geistes in feurigen Zungen erfolgte. Diesbezüglich sagt freudig der Herr: „Ich bin gekommen, Feuer auf die Erde zu senden, und wie sehr wünsche ich, daß es schon angezündet wäre!“</p><p>Dieser Hl. Geist stieg bei der Taufe des Herrn herab, damit die Würde des Getauften nicht verborgen bleibe. Johannes sagt nämlich: „Doch der, welcher mich sandte, mit Wasser zu taufen, sprach zu mir: derjenige, von welchem du siehst, daß der Geist auf ihn herabsteigt und auf ihm bleibt, ist es, welcher mit dem Hl. Geiste tauft“. Achte ja auf das Wort des Evangeliums: „Es öffneten sich die Himmel“! Sie öffneten sich aber wegen der Würde dessen, der herabstieg. Denn „siehe“ — heißt es — „es öffneten sich die Himmel, und er sah den Geist Gottes herabsteigen gleich einer Taube und über ihn kommen“. Natürlich war seine Herabkunft eine freiwillige Selbstbetätigung. Nach einigen Erklärern sollten nämlich die vorzüglichen Erstlingsgaben des Hl. Geistes, welche die Täuflinge erhalten, der menschlichen Natur des Erlösers gegeben werden, welcher diese Gnade verleiht. Der Geist kam, wie einige behaupten, wohl in Gestalt einer Taube herab, um die reine, schuldlose, einfältige Taube, welche durch ihre Bitten für die Wiedergeburt der Kinder und die Nachlassung der Sünden wirkt, zu versinnbilden; denn geheimnisvoll war einst verkündet worden, daß Christi Augen an die Taube erinnern. Im Hohen Liede wird vom Bräutigam gesagt: „Deine Augen sind wie Tauben über großen Wassern“.</p><p>[Forts. v. ] Diese Taube (═ der Hl. Geist) wurde nach einigen Erklärern zum Teil vorgebildet durch die Taube Noës. Gleichwie nämlich zur Zeit des Noë, da Holz und Wasser Rettung brachten und eine neue Generation ihren Anfang nahm, die Taube mit einem Ölbaumblatt gegen Abend zu Noë zurückkehrte, so stieg, wie man sagt, der Hl. Geist auf den wahren Noë, welcher der Schöpfer der zweiten Generation wurde, welcher die verschiedenen Völker — vorbildlich dargestellt durch die verschiedenen Tierarten in der Arche — in Eintracht verbindet, welcher durch sein Erscheinen die geistigen Wölfe und Schafe auf* eine Weide führte, welcher auf der Weide seiner Kirche Kalb, Stier und Löwe vereint; denn noch heute sehen wir, daß weltliche Fürsten von den Dienern der Kirche sich leiten und belehren lassen. Nach manchen Exegeten stieg also die geistige Taube zur Zeit der Taufe herab, um zu lehren, daß (Jesus ein Noë ist und daß) er die Gläubigen durch das Holz des Kreuzes rettet und am Abend durch seinen Tod das Heil bereitet</p><p>Wohl sind auch noch andere Erklärungen möglich. Hören wir nun, was der Heiland selbst über den Hl. Geist sagt! Er spricht: „Wenn jemand nicht geboren wird aus Wasser und Geist, kann er nicht eingehen in das Reich Gottes“. Daß die Gnade (des Geistes) vom Vater kommt, lehrt er mit den Worten: „Um wieviel mehr wird der Vater vom Himmel den Hl. Geist denen geben, welche ihn darum bitten!“ Er sagt, man müsse Gott im Geiste anbeten: „Doch es kommt die Stunde, und sie ist schon da, wo die wahren Anbeter den Vater anbeten werden im Geiste und in der Wahrheit; denn auch der Vater sucht solche Anbeter. Gott ist Geist, und die ihn anbeten, sollen ihn im Geiste und in der Wahrheit anbeten)!“ An anderer Stelle erklärt er: „Wenn ich aber im Geiste Gottes die Teufel austreibe....“, und gleich darauf: „Daher sage ich euch: jede Sünde und Lästerung wird den Menschen verziehen werden, die Lästerung wider den Hl. Geist aber wird nicht verziehen werden. Und wer ein Wort wider den Sohn des Menschen spricht, dem wird es verziehen werden; wer aber ein Wort wider den Hl. Geist spricht, dem wird es nicht verziehen werden, weder in diesem noch im zukünftigen Leben“. Wieder an anderer Stelle sagt er: „Ich werde den Vater bitten, und er wird euch einen anderen Tröster senden, damit er bei euch sei in Ewigkeit, den Geist der Wahrheit, den die Welt nicht empfangen kann; denn sie sieht ihn nicht und kennt ihn nicht. Ihr aber kennt ihn, weil er bei euch bleibt und in euch sein wird“. Ferner sagt er: „Dies sage ich zu euch, da ich noch bei euch weile. Der Tröster aber, der Hl. Geist, welchen der Vater in meinem Namen senden wird, wird euch alles lehren und wird euch an alles erinnern, was ich euch gesagt habe“. Wiederum erklärt er: „Wenn aber der Tröster kommen wird, welchen ich euch vom Vater senden werde, der Geist der Wahrheit, welcher vom Vater ausgeht, dieser wird von mir Zeugnis geben“. Dann sagt der Heiland: „Wenn ich nämlich nicht hingehe, kommt der Tröster nicht zu euch. Wenn dieser kommt, wird er die Welt überführen von der Sünde, der Gerechtigkeit und dem Gerichte“, und hierauf: „Noch vieles habe ich euch zu sagen, aber ihr könnt es jetzt nicht ertragen. Wenn aber jener, der Geist der Wahrheit, kommt, wird er euch alle Wahrheit lehren. Denn er wird nicht von sich selbst aus reden; sondern was er hört, wird er sagen, und er wird euch die Zukunft verkünden. Jener wird mich verherrlichen; denn er wird von dem Meinigen nehmen und es euch verkünden. Alles, was der Vater hat, ist mein. Deshalb habe ich euch gesagt: er wird von dem Meinigen nehmen und es euch verkünden“.</p><p>Ich habe dir jetzt die Worte des Eingeborenen selbst vorgelesen, damit du nicht auf menschliche Worte achtest.</p><p>Die Teilnahme an diesem Hl. Geist verlieh Jesus den Aposteln. Denn es ist geschrieben: „Nach diesen Worten hauchte er sie an und sagt zu ihnen: Empfanget den Hl. Geist! Welchen ihr die Sünden nachlasset, denen sind sie nachgelassen; welchen ihr sie behaltet, denen sind sie behalten“. Dies ist die zweite Anhauchung; denn die erste war durch die freiwillig begangenen Sünden verdunkelt worden. Es sollte erfüllt werden das Wort der Schrift: „Er stieg herauf und hauchte in dein Angesicht und befreite dich aus der Trübsal“. Wenn es heißt „Er stieg herauf“, woher ist er gekommen? Aus der Unterwelt. Denn erst nach der Auferstehung hat er sie, wie das Evangelium berichtet, angehaucht. Doch die Gnade, welche er da gibt, verleiht er noch weit reichlicher; denn er sagt zu den Aposteln; „Ich bin bereit, schon jetzt zu geben, aber das Gefäß faßt noch nicht. Einstweilen empfanget soviel Gnade, als ihr fassen könnt, wartet aber auf noch größere Gnade. ‚Bleibet in der Stadt Jerusalem, bis ihr mit Kraft von oben umkleidet werdet!‘ Empfanget jetzt (die Gnade) zum Teil! Dereinst werdet ihr vollständig damit angetan werden.“ Es ist oftmals so, daß, wer empfängt, nur einen Teil erhält von dem, was gegeben wird; derjenige dagegen, welcher mit einem Kleide angetan ist, ist vollständig umkleidet. Fürchtet nicht — will gesagt sein — die Waffen und Geschosse des Teufels; denn ihr werdet tragen die Kraft des Hl. Geistes!</p><p>Vergesset nicht, daß ich vor kurzem die Lehre gab: nicht der Geist, sondern die durch ihn gewirkte Gnade ist teilbar!</p><p>[Forts. v. ] Jesus ist in die Himmel aufgefahren und hat die Verheißung erfüllt; er hatte nämlich zu den Aposteln gesagt: „Ich werde den Vater bitten, und er wird euch einen anderen Tröster senden“. Sie blieben und erwarteten die Ankunft des Hl. Geistes. Als es Pfingsten geworden war, (saßen) hier in dieser Stadt Jerusalem — wir waren es wieder, welche da den Vorzug hatten; wir sprechen nämlich nicht von Wohltaten, welche auch andere erhalten, sondern von den uns erwiesenen (außerordentlichen) Gnadenerweisungen. Als es nun Pfingstfest war, da saßen sie, und vom Himmel kam der Tröster, der Wächter und Heiligmacher der Kirche, der Leiter der Seelen, der Steuermann im Sturme, das Licht auf dem Irrwege, der Kampfrichter der Kämpfenden, der Preisrichter der Siegenden.</p><p>Der Hl. Geist kam herab, um die Apostel mit Kraft zu bekleiden und sie zu taufen. Denn der Herr sagt: „Ihr werdet getauft werden im Hl. Geiste nicht lange nach diesen Tagen“. Nicht Stückwerk war die Gnade, es war volle Kraft. Gleichwie derjenige, welcher in das Wasser getaucht und getauft wird, von allen Seiten vom Wasser umgeben wird, so wurden die Apostel vollständig vom Geiste getauft. Während aber das Wasser nur den Körper umfließt, badet der Geist unaufhörlich die Seele. Was wunderst du dich? Du sollst ein Beispiel aus der Körperwelt haben, ein kleines, allbekanntes, aber für einfachere Leute lehrreiches Beispiel. Wenn das Feuer in das Innere des dichten Eisens eindringt und die ganze Masse zu Feuer macht, wenn (durch das Feuer) das Kalte heiß, das Schwarze leuchtend wird, wenn das Feuer, selbst ein Körper, in den Körper des Eisens eindringt und so ungehindert wirkt, wie kannst du dich wundern, wenn der Hl. Geist in das Innerste der Seele eindringt?</p><p>Damit man aber wohl wußte, wie groß die Gnade war, die herabstieg, erscholl gewissermaßen eine Himmelsposaune. „Es entstand nämlich plötzlich vom Himmel her ein Brausen gleich einem gewaltigen daherfahrenden Winde“. Dieser zeigte die Ankunft dessen an, welcher den Menschen die Gnade gibt, das Reich Gottes mit Gewalt an sich zu reißen. Die Augen sollten die feurigen Zungen sehen, die Ohren sollten das Brausen hören.</p><p>„Und es erfüllte das ganze Haus, in dem sie saßen.“ Das Haus wurde ein Behältnis des geistigen Wassers. Die Jünger saßen in dem Hause, welches ganz erfüllt wurde. Sie wurden also vollständig eingetaucht, wurden der Verheißung gemäß an Seele und Leib mit dem göttlichen, heilsamen Kleide „angetan“.</p><p>„Und es erschienen ihnen geteilte Zungen von Feuer, und es ließ sich auf jeden einzelnen von ihnen nieder, und alle wurden vom Hl. Geist erfüllt.“ Feuer empfingen sie, nicht aber ein verbrennendes Feuer, sondern ein heilsames Feuer, welches die Dornen der Sünden verzehrt, die Seele aber erleuchtet. Dieses Feuer wird jetzt auch über euch kommen und eure dornigen Sünden wegnehmen und vernichten, es wird den kostbaren Schatz eurer Seele erst recht glänzen lassen und euch Gnade geben; es hat dieselbe ja seinerzeit auch den Aposteln gegeben. In Gestalt feuriger Zungen ließ sich die Gnade auf die Apostel nieder, um ihr Haupt durch die feurigen Zungen mit ganz neuen, geistigen Diademen zu krönen. Dereinst hatte ein feuriges Schwert den Eingang zum Paradiese versperrt, eine feurige, wohltätige Zunge brachte das Heil wieder.</p><p>[Forts. v. ] „Und sie fingen an, in fremden Sprachen zu reden, so wie es der Geist ihnen verlieh“. Die Galiläer Petrus und Andreas sprachen entweder persisch oder medisch. Johannes und die übrigen Apostel redeten in jeder Sprache zu den Völkerscharen; denn nicht erst in unserer Zeit, sondern schon damals begannen die Fremden in Massen von allen Seiten in Jerusalem zusammen zu strömen. Welcher Lehrer läßt sich finden, der es vermöchte, mit einem Male zu lehren, ohne gelernt zu haben? Wie viele Jahre braucht es nur schon, bis man mit Hilfe der Grammatik im schulgemäßen Unterricht gut griechisch sprechen lernt! Und (trotz Grammatik und schulgemäßen Unterrichtes) sprechen nicht alle gleich gut. Der Rhetor bringt es vielleicht soweit, gut zu reden, der Grammatiker dagegen redet manchmal nicht gut; auch versteht sich, wer Grammatik beherrscht, nicht auf Philosophie. Der Hl. Geist lehrt auf einmal viele Sprachen, welche den Aposteln die ganze Zeit unbekannt waren. Wahrlich große Weisheit, göttliche Kraft! Wie kommt die langjährige Unwissenheit der Apostel mit einem Male zu dem vielseitigen, unerhörten, unvermuteten Sprachgenie?</p><p>Unter der Menge der Zuhörer entstand Aufregung* (σύγχυσις)* [synchysis], eine neue Aufregung, entgegengesetzt der ersten, schlimmen (b0ei der Sprachverwirrung) in Babylon. Während bei der Sprachverwirrung infolge der Gottlosigkeit der Gesinnung die Pläne und Absichten sich gekreuzt haben, hat hier heiliges Streben die Gemüter gefestigt und geeint. Aufregung* (σύγχυσις)* [synchysis] führte zum Fall, Aufregung führt zur Auferstehung.</p><p>Man wunderte sich und sagte: „Wie kommt es, daß wir sie sprechen hören?“ Es ist nicht zu verwundern, daß ihr es nicht versteht. Auch Nikodemus hatte das Kommen des Geistes nicht verstanden; es wurde zu ihm gesagt: „Der Geist weht, wo er will; du hörst seine Stimme, aber du weißt nicht, woher er kommt und wohin er geht“. Wenn ich nun, trotzdem ich seine Stimme höre, nicht weiß, woher er kommt, wie kann ich sein Wesen erklären?</p><p>[Forts. v. ] „Andere aber spotteten und sagten: sie sind voll des Mostes.“ Spottend sagten sie die Wahrheit. Tatsächlich war der Wein, die Gnade des Neuen Testamentes, noch neu. Doch dieser neue Wein kam vom geistigen Weinstock, der wiederholt bereits in den Propheten Früchte getragen hatte und im Neuen Bunde neue Triebe zeitigte. Wie in der sichtbaren Natur der Weinstock, wenngleich er stets derselbe bleibt, doch von Zeit zu Zeit wieder neue Früchte hervorbringt, so hat ein und derselbe Geist, der bleibt, was er ist, und der oft in den Propheten gewirkt hatte, jetzt etwas Neues, Wunderbares gezeitigt. Auch über die Väter war die Gnade gekommen, aber jetzt erschien sie im Übermaß. Jene erhielten am Hl. Geiste Anteil, die Apostel wurden vollständig in denselben eingetaucht.</p><p>Petrus, der den Hl. Geist hatte und sich desselben bewußt war, erwidert: „,Israeliten‘ — die ihr den (Propheten) Joel verkündet, aber nicht wisset, was er geschrieben hat —,nicht sind diese Männer, wie ihr meint, betrunken‘“. Betrunken sind sie allerdings, aber nicht so, wie ihr meint. Geschrieben ist nämlich: „Sie werden trunken werden von dem Überfluß deines Hauses, und du wirst sie tränken aus den Strömen deiner Wonne“. Trunken sind sie in nüchterner Trunkenheit, welche die Sünde tötet, den Geist belebt, in einer Trunkenheit, welche das Gegenteil ist von körperlicher Trunkenheit. Diese läßt vergessen, was man gewußt hat, jene dagegen gibt Kenntnis dessen, was man nicht gewußt hat. Trunken sind sie, da sie den Wein des geistigen Weinstockes getrunken haben, der da sagt: „Ich bin der Weinstock, und ihr seid die Reben“. Wenn ihr aber mir nicht glauben wollt, so möge euch die Zeit das lehren, was ich gesagt habe</p><p>„Denn es ist (erst) die dritte Stunde des Tages.“ Der, welcher — wie Markus sagt — um die dritte Stunde gekreuzigt worden war, hat jetzt, zur dritten Stunde, die Gnade geschickt. Man darf nicht unterscheiden zwischen der Gnade hier und der Gnade dort; vielmehr hat der, welcher seinerzeit gekreuzigt worden war und die Verheißung gegeben hatte, die Verheißung erfüllt. Wollt ihr Beweise dafür haben, dann höret!</p><p>„Wahrlich“ — fährt Petrus fort — „dies ist durch den Propheten Joel verkündet worden:,Alsdann, so sagt Gott, werde ich von meinem Geiste ausgießen’.“ Mit dem Worte „Ich werde ausgießen“ hat er auf ein reichliches Geben hingewiesen. „Denn nicht in beschränktem Maße gibt Gott den Geist. Der Vater liebt den Sohn, und er hat alles in seine Hand gegeben.“ Er hat ihm auch die Macht gegeben, die Gnade des allheiligen Geistes nach seinem eigenen Willen zu verleihen.</p><p>„Ich werde von meinem Geiste über alles Fleisch ausgießen, und eure Söhne und eure Töchter werden weissagen“, und hierauf: „Auch über meine Knechte und meine Mägde werde ich in jenen Tagen von meinem Geiste ausgießen, und sie werden weissagen“. Der Hl. Geist fragt nicht nach der Person; nicht frägt er nach hohen Würden, sondern nach frommen Seelen. Die Reichen sollen nicht hochmütig, die Armen nicht kleinmütig werden! Jeder möge nur nach dem Empfang der himmlischen Gnade verlangen!</p><p>[Forts. v. ] Vieles habt ihr heute gehört, und das Zuhören hat euch wohl schon müde gemacht. Doch noch vieles ist zu sagen. Eigentlich brauchte man für den Unterricht über den Hl. Geist noch eine dritte, ja noch mehrere Katechesen. Beides ist uns zu entschuldigen. Mit Rücksicht auf das bereits bevorstehende Paschafest haben wir heute unsere Rede verlängert; aber alle Zeugnisse aus dem Neuen Testamente, so wie es notwendig wäre, zu zitieren, ist unmöglich. Noch nicht erwähnt sind zahlreiche Zeugnisse aus der Apostelgeschichte, wonach die Gnade des Hl. Geistes in Petrus und in allen Aposteln zugleich gewirkt hat; noch nicht erwähnt sind zahlreiche Zeugnisse aus den katholischen Briefen und den vierzehn Briefen Pauli. Aus diesen Schriften werden wir jetzt wie von einer großen Wiese einen kleinen Blumenstrauß nur als Andenken zu geben versuchen.</p><p>Als Petrus mit den Elfen aufgestanden war und seine Stimme erhoben hatte gemäß dem Worte: „Erhebe mit Kraft deine Stimme, Freudenbote Jerusalems!“ fing er in der Kraft des Hl. Geistes nach dem Willen des Vaters und des Sohnes mit dem geistigen Netze seiner Worte bei dreitausend Seelen. So mächtig wirkte in allen Aposteln zugleich die Gnade, daß von jenen Juden, welche Christum gekreuzigt hatten, eine solche Menge gläubig wurde, sich im Namen Christi taufen ließ und in der Lehre der Apostel und im Gebete treu aushielt. Als Petrus und Johannes um die neunte Stunde, die Stunde des Gebetes, in den Tempel hinaufgegangen waren und den vom Mutterleibe an vierzig Jahre lang Lahmen am Schönen Tempeltore im Namen Jesu geheilt hatten, damit erfüllt würde das Wort: „Alsdann wird der Lahme springen wie ein Hirsch“, da fingen sie in derselben Kraft des Hl. Geistes mit dem geistigen Netze der Lehre mit einemmale fünftausend Menschen, die gläubig wurden. Sie widerlegten die im Irrtum befangenen Volksführer und Hohenpriester nicht durch eigene Weisheit, da sie ja ungeschulte und ungebildete Männer waren, sondern durch die Kraft des Geistes. Es steht nämlich geschrieben: „Da wurde Petrus vom Hl. Geiste erfüllt und sprach zu ihnen“. So mächtig wirkte durch die zwölf Apostel die Gnade des Hl. Geistes in den Gläubigen, daß sie „<em>ein</em> Herz und* eine* Seele waren“ und daß der Genuß der Güter gemeinsam wurde; denn die Besitzenden lieferten den Erlös aus ihren Gütern aus Frömmigkeit zur Beseitigung der Armut ab. Ananias und Saphira allerdings suchten den Hl. Geist zu belügen, erhielten aber die verdiente Strafe.</p><p>„Durch die Hand der Apostel geschahen viele Zeichen und Wunder unter dem Volke.“ Die Gnade des Geistes umströmte die Apostel in einer Weise, daß man sich vor ihnen trotz ihrer Sanftmut fürchtete; denn „von den Übrigen wagte es niemand, sich störend bei ihnen einzudrängen, vielmehr schätzte sie das Volk hoch“. Die Menge derer, welche an den Herrn glaubten — Männer und Weiber —, nahm immer mehr zu. Tragbahren und Betten mit Kranken füllten die Straßen, damit, „wenn Petrus käme, wenigstens sein Schatten auf den einen oder anderen von ihnen falle. Aber auch aus den umliegenden Städten strömten Scharen“ hierher nach dem heiligen Jerusalem „und brachten Kranke und von unreinen Geistern Besessene. Sie alle wurden geheilt“.</p><p>[Forts. v. ] Als die zwölf Apostel wegen ihrer christlichen Predigt von den Hohenpriestern in das Gefängnis geworfen, von einem Engel aber nachts wunderbarerweise aus demselben befreit worden waren und dann vom Tempel weg vor den Richterstuhl jener geführt wurden, sprachen sie zu ihnen von Christus und erhoben unerschrocken in der Kraft des Hl. Geistes Anklage. Sie entgegneten: „Gott hat den Hl. Geist denen gegeben, welche ihm gehorchten“. Nachdem sie gegeißelt worden waren, „gingen sie fröhlich weg“, „hörten aber nicht auf, die Lehre und frohe Botschaft von Christus Jesus zu verkünden“.</p><p>Die Gnade des Hl. Geistes wirkte aber nicht nur in den zwölf Aposteln, sondern auch in den erstgeborenen Kindern unserer einst unfruchtbaren Kirche, nämlich in den sieben Diakonen. Auch sie wurden nämlich, wie die Schrift sagt, auserwählt als Männer „voll des Hl. Geistes und der Weisheit“. Unter diesen war der, welcher mit Recht den Namen Stephanus trug, der Erstling der Märtyrer, „ein Mann voll des Glaubens und des Hl. Geistes“. Stephanus „wirkte große Zeichen und Wunder unter dem Volke“. Mit Erfolg bekämpfte er die, welche wider ihn stritten; denn „sie konnten der Weisheit und dem Geiste, womit er sprach, nicht widerstehen“. Als er auf falsche Anklage hin vor Gericht geschleppt wurde, glänzte er wie ein Engel; „alle nämlich, die im Hohen Rate saßen, schauten auf ihn, und sie sahen sein Angesicht gleich dem eines Engels“. Nachdem er durch seine geistreiche Verteidigungsrede „die halsstarrigen und an Herz und Ohren unbeschnittenen Juden, die immer dem Hl. Geist widerstreiten“, zurechtgewiesen hatte, schaute er „die Himmel offen und sah den Menschensohn zur Rechten Gottes stehen“. Nicht jedoch aus eigener Kraft sah er ihn. Die Hl. Schrift sagt vielmehr: „Er aber war voll des Hl. Geistes, schaute zum Himmel und sah die Herrlichkeit Gottes und sah Jesus zur Rechten Gottes stehen“.</p><p>[Forts. v. ] In dieser Kraft des Hl. Geistes und im Namen Christi trieb Philippus einst in der Stadt Samarias die unreinen Geister aus, welche laut schrien; auch heilte er Gichtbrüchige und Lahme und führte zu Christus große Scharen von Gläubigen. Petrus und Johannes kamen hin und erteilten diesen unter Gebet und Handauflegung den Hl. Geist; nur Simon, der Magier, empfing ihn nicht — und zwar mit Recht, wie sich zeigte. Eines Tages rief der Engel des Herrn den Philippus auf die Straße wegen des frommen Eunuchen aus Äthiopien, und der Geist selbst sprach deutlich zu ihm: „Mache dich hurtig an diesen Wagen heran!“ Philippus belehrte den Äthiopier, taufte ihn und entsandte ihn als Prediger Christi nach Äthiopien; denn es ist geschrieben: „Äthiopien wird seine Hand zuerst zum Herrn erheben“. Philippus wurde sodann von dem Engel entrückt und „verkündete das Evangelium Stadt für Stadt“.</p><p>Nach seiner Berufung durch unseren Herrn Jesus Christus wurde auch Paulus vom Hl. Geiste erfüllt. Unser Wort möge uns der fromme Ananias bezeugen, der in Damaskus lebte und zu Paulus sagte: „Der Herr hat mich gesandt, Jesus, der dir auf deinem Wege erschienen ist: du sollst dein Augenlicht zurückempfangen und mit dem Hl. Geiste erfüllt werden“. Der Geist wirkte sofort; er gab den erblindeten Augen Pauli die Sehkraft, gab seiner Seele das Siegel, machte ihn zu einem „auserwählten Gefäße“ und stellte ihm die Aufgabe, den Namen des Herrn, der ihm erschienen war, „vor Könige und Israels Söhne zu tragen“. Den einstigen Verfolger machte er zu einem trefflichen Prediger und Diener: „Von Jerusalem bis Illyricum vollendete er die Verkündigung des Evangeliums“, er unterrichtete die Kaiserstadt, beabsichtigte, selbst Spanien zu missionieren, ertrug tausenderlei Mühseligkeiten und wirkte Zeichen und Wunder. Soviel einstweilen über Paulus.</p><p>In der Kraft desselben Hl. Geistes und im Namen Christi hat Petrus, der Fürst der Apostel und Schlüsselträger des Himmelreiches, in Lydda, dem jetzigen Diospolis, den gichtbrüchigen Aeneas geheilt, in Joppe die Wohltäterin Tabitha von den Toten auferweckt. Als er auf dem Dache war und in einer Verzückung den Himmel offen sah, wurde er durch ein Behältnis, das einem Leintuche glich, (vom Himmel) herabgelassen wurde und voll von verschiedenartigen Tieren war, deutlich belehrt, daß niemand, auch nicht wenn er aus dem Heidentum stammt, gemein oder unrein genannt werden dürfe, und als er von Cornelius gerufen wurde, sprach der Hl. Geist zu ihm: „Siehe, es sind Männer da, welche dich suchen! Stehe auf, gehe hinab und reise unbedenklich mit ihnen, denn ich habe sie gesandt!“ Um deutlich zu zeigen, daß auch die, welche aus den Heiden gläubig wurden, an der Gnade des Hl. Geistes Anteil erhielten, darum macht die Schrift im Anschluß an die Ankunft Petri in Cäsarea und an seine Belehrung über Christus die Mitteilung: „Noch während Petrus dies redete, kam der Hl. Geist auf alle Zuhörer herab, so daß die aus der Beschneidung, welche mit Petrus gekommen waren, sich wunderten und erstaunt sagten: auch über die Heiden ist die Gabe des Hl. Geistes ausgegossen“.</p><p>[Forts. v. ] Als in Antiochien, der bedeutendsten Stadt Syriens, die Predigt über Christus sich wirksam zeigte, wurde von hier (═ Jerusalem) aus nach Antiochien als Mitarbeiter am guten Werke Barnabas, „ein trefflicher Mann, voll des Hl. Geistes und des Glaubens“, entsandt. Da dieser die große Ernte des christlichen Glaubens sah, holte er aus Tarsus den Paulus als Kampfgenossen nach Antiochien. Sie unterrichteten nun eine große Menge in der Kirche und gewannen sie für dieselbe, und „zum ersten Male wurden in Antiochien die Jünger Christen genannt“; der Hl. Geist hat, wie ich glaube, den vom Herrn den Gläubigen verheißenen „neuen Namen“ gegeben. Da Gott in gar reichlichem Maße zu Antiochien die Gnade des Geistes ausgoß, gab es daselbst Propheten und Lehrer; zu ihnen gehörte Agabus. „Während des Gottesdienstes und Fastens sprach der Hl. Geist: sondert mir nun den Barnabas und Paulus für die Aufgabe aus, zu welcher ich sie berufen habe!“ Da legte man ihnen die Hände auf, und der Hl. Geist entsandte sie.</p><p>Der Hl. Geist, der spricht und sendet, ist offenbar, wie wir schon gesagt haben, lebendig, persönlich, wirksam.</p><p>Dieser Hl. Geist hat, als er in Übereinstimmung mit dem Vater und dem Sohne den Neuen Bund durch die katholische Kirche stiftete, uns von den schweren Lasten des Gesetzes befreit, nämlich von den Vorschriften über das Gemeine und Unreine, über die Speisen, über die Sabbate, Neumonde und über die Beschneidung, über Besprengungen und Opfer; diese Vorschriften wurden nur für gewisse Zeit gegeben, sie waren ein Schatten der zukünftigen Güter und hörten mit Recht auf, als die Wahrheit erschien. Als in Antiochien durch die Forderung der Beschneidung und der Beobachtung der mosaischen Gesetze die Lage kritisch geworden war, entsandte man den Paulus und Barnabas, und die hier, in Jerusalem, weilenden Apostel befreiten den ganzen Erdkreis schriftlich, in einem Briefe, von allen gesetzlichen Vorschriften und vorbildlichen Einrichtungen. Wahrlich nicht sich selbst schrieben sie die Vollmacht zu, in solcher Sache zu entscheiden. Vielmehr erklären sie in dem übersandten Schreiben: „Es hat nämlich dem Hl. Geiste und uns gefallen, euch weiter keinerlei Last aufzulegen außer diesen notwendigen Forderungen: daß ihr euch enthaltet von dem den Götzen Geopferten, vom Blute, vom Erstickten und von der Unzucht“. Durch dieses Schreiben gaben sie deutlich zu erkennen: wenn auch Apostel, also Menschen, es waren, welche geschrieben waren, so war es doch der Hl. Geist, welcher die Vorschriften für den Erdkreis gegeben hat. In diesem Sinn haben Barnabas und Paulus und deren Begleiter die Vorschrift auch entgegengenommen und an den ganzen Erdkreis hinausgegeben.</p><p>Ich breche ab. Eure Liebe oder vielmehr der in Paulus wohnende Geist möge es mir verzeihen, wenn ich mit Rücksicht auf meine Schwachheit und auf die Anstrengung meiner Zuhörer nicht alle Ereignisse berichten kann. Wann werde ich nach Gebühr Pauli wunderbare Taten erzählen, welche er in der Kraft des Hl. Geistes und im Namen Christi gewirkt hat? Ich meine das auf Zypern an Elymas, dem Magier, gewirkte Wunder, die Heilung des Lahmen zu Lystra, seine Wunder in Zilizien, Phrygien, Galatien, Mysien, Mazedonien, sein Auftreten in Philippi, nämlich seine dortige Predigt und seine im Namen Christi erfolgte Austreibung des Wahrsagegeistes sowie die in der Nacht nach dem Erdbeben dem ganzen Hause des Gefängniswärters durch die Taufe geschenkte Erlösung. Ich meine die Ereignisse in Thessalonike, seine Volksrede, die er mitten unter den Athenern auf dem Areopag gehalten hat, seine Lehrtätigkeit in Korinth und überhaupt in ganz Achaia. Wie kann ich nach Gebühr erzählen, was der Hl. Geist durch Paulus in Ephesus gewirkt hat? Die Bewohner von Ephesus hatten den Geist noch nicht gekannt, sie lernten ihn erst durch die Lehre Pauli kennen. „Als ihnen Paulus die Hand aufgelegt hatte und der Hl. Geist über sie gekommen war, redeten sie in Sprachen und weissagten“. So groß war die Gnade des Geistes in Paulus, daß nicht nur seine Berührung gesund machte, sondern sogar seine Schweißtücher und seine Leibwäsche, wenn sie aufgelegt wurden, die Krankheiten heilten und die bösen Geister austrieben, „selbst die, welche sich mit Zaubereien abgegeben hatten, ihre (Zauber)bücher zusammentrugen, um sie vor aller Augen zu verbrennen.</p><p>Ich übergehe auch, was sich in Troas mit Eutychus zugetragen hat, der, vom Schlafe überwältigt, vom dritten Stock herabfiel und, als man ihn tot aufhob, von Paulus zum Leben erweckt wurde. Auch übergehe ich die prophetischen Worte, welche Paulus zu den nach Milet berufenen Ältesten von Ephesus gesprochen hatte; er sagte ihnen ausdrücklich: „Der Hl. Geist gibt mir von Stadt zu Stadt kund usw.“. Mit dem Worte „von Stadt zu Stadt“ gab Paulus zu erkennen, daß die Wunder, welche er in jeder Stadt wirkte, in der Kraft des Hl. Geistes, nach dem Willen Gottes und im Namen des in ihm redenden Christus erfolgten. In der Kraft desselben Hl. Geistes eilte derselbe Paulus in diese heilige Stadt Jerusalem, und zwar, obwohl Agabus ihm im Geiste die Zukunft prophezeite. Er redete (in Jerusalem) zum Volke, vertrauensvoll auf Christus verweisend. Als Paulus nach Cäsarea geschleppt worden war und mitten unter den Richtern sowohl vor Felix wie vor dem Prokurator Festus und vor König Agrippa dastand, empfing er vom Hl. Geiste die Gnade, so überzeugend zu reden, daß selbst Agrippa, der König der Juden, erklärte: „Wenig fehlt, und du überredest mich, Christ zu werden“. Derselbe Hl. Geist bewirkte auf der Insel Malta, daß Paulus trotz eines Natternbisses, nicht Schaden nahm, im Gegenteil verschiedene Krankenheilungen wirkte. Dieser Hl. Geist führte ihn, den einstigen Verfolger Christi, als Herold Christi sogar bis in die Kaiserstadt Rom, wo er viele Juden für den Glauben an Christus gewann und an seine Widersacher das offene Wort richtete: „Gut sprach der Hl. Geist durch den Propheten Isaias, der zu unseren Vätern sagte....“.</p><p>[Forts. v. ] Paulus und alle zu seiner Zeit lebenden Apostel sowie die, welche nach ihnen an den Vater, den Sohn und den Hl. Geist glaubten, waren voll des Hl. Geistes. Höre, was Paulus in seinen Briefen deutlich schreibt! „Meine Lehre und meine Predigt besteht nicht in Überzeugungskräften menschlicher Weisheit, sondern im Erweis von Geist und Kraft.“ An anderer Stelle sagt er: „Eben hierfür hat uns Gott besiegelt und uns das Unterpfand des Geistes gegeben“. Und wiederum: „Der, welcher Jesus von den Toten auferweckt hat, wird auch eure sterblichen Leiber lebendig machen durch seinen in euch wohnenden Geist“. Und an Timotheus schreibt er: „Bewahre das herrliche, anvertraute Gut durch den Hl. Geist, der uns gegeben ist!“</p><p>Daß der Hl. Geist eine Person ist, daß er lebt, spricht, prophezeit, haben wir im Vorausgehenden wiederholt gesagt. An Timotheus nun schreibt Paulus ausdrücklich: „Der Geist erklärt klar, daß in den späteren Zeiten manche vom Glauben abfallen werden“. Solcher Abfall zeigt sich uns in den häretischen Bewegungen der Vergangenheit wie unserer Tage; denn bunt und mannigfaltig ist der Irrtum der Häretiker. An anderer Stelle sagt derselbe Apostel: „Dies ist in anderen Generationen den Menschenkindern nicht in gleicher Weise kund getan worden, wie es jetzt durch den Geist geoffenbart wurde seinen heiligen Aposteln und Propheten usw.“. Und wiederum: „Darum, wie der Hl. Geist sagt....“. Und an anderer Stelle: „Auch der Hl. Geist gibt uns das Zeugnis....“. Ein andermal ruft er den Soldaten der Gerechtigkeit zu: „Nehmet den Helm des Heiles und das Schwert des Geistes, d. i. das Wort Gottes, unter lauter Gebet und Flehen!“ Und wiederum: „Berauschet euch nicht mit Wein — das ist unsittlich —, sondern werdet voll des Geistes und redet zueinander in geistlichen Psalmen, Hymnen und Gesängen!“ Ein andermal: „Die Gnade des Herrn Jesus und die Liebe Gottes und die Gemeinschaft des Hl. Geistes sei mit euch allen!“</p><p>Aus allen diesen Zitaten und den vielen anderen, welche wir übergangen haben, ergibt sich für jeden Verständigen die persönliche, heiligmachende und wirksame Kraft des Hl. Geistes. Es würde mir die Zeit fehlen, wollte ich auch noch die übrigen Bemerkungen über den Hl. Geist erwähnen, welche sich in den mannigfaltigen, ausführlichen, erhabenen Lehren der vierzehn Briefe Pauli finden. Möge die Gnade des Hl. Geistes es uns verzeihen, wenn wir, weil uns nur noch wenige Tage zur Verfügung stehen, manches übergangen haben! Euch, meine Zuhörer, möge er vollständig auch noch das, was wir übergangen haben, wissen lassen, d. h. die Eifrigeren unter euch mögen es sich durch fleißige Lektüre der göttlichen Schriften zu eigen machen! Sie mögen aber auch schon auf Grund dieser meiner Katechesen und meiner früheren Vorträge noch mehr befestigen ihren Glauben „an den einen Gott, den allmächtigen Vater, und an unseren Herrn Jesus Christus, seinen eingeborenen Sohn, und an den Hl. Geist, den Tröster“.</p><p>Ein und derselbe Ausdruck und Terminus „Geist“ wird zwar in den göttlichen Schriften für die verschiedenen Personen gemeinschaftlich gebraucht; denn vom Vater heißt es nach dem Johannesevangelium: „Gott ist Geist“, und vom Sohne nach dem Propheten Jeremias: „Der Geist vor uns ist Christus der Herr“, und vom Hl. Geist — wie gesagt —: „der Tröster, der Hl. Geist“. Wer aber den Glauben richtig versteht, hält auch den Sabellianismus ferne. Wir wollen darum nunmehr zu dem übergehen, was vordringlich und für euch nützlich ist.</p><p>Gehe mir ja nicht zur Taufe wie ein Simon, ein Heuchler! Dein Herz verlange nach der Wahrheit! Unsere Pflicht ist es, dich eindringlichst zu warnen; deine Pflicht ist es, dich in acht zu nehmen. Wenn du im Glauben fest stehst, bist du selig. Bist du aber ungläubig geworden und gefallen, dann wirf heute noch den Unglauben weg und glaube fest! Wirst du getauft, dann trittst du vor die Bischöfe oder Priester oder Diakonen; denn die Gnade wirkt an allen Orten, in Dörfern wie in Städten, durch Ungebildete wie Gebildete, durch Sklaven wie durch Freie, da die Gnade nicht von Menschen kommt, sondern ein von Gott durch Menschen verliehenes Geschenk ist. Gehe hin zum Taufenden, aber achte dabei nicht auf das Irdische, Äußere, sondern denke an diesen Hl. Geist, über welchen wir jetzt zu dir sprachen! Dieser kommt und ist bereit, deine Seele zu versiegeln. Er gibt dir ein Siegel, vor welchem die Dämonen zittern, ein himmlisches, göttliches Siegel; denn es ist geschrieben: „In ihm seid ihr auch, als ihr gläubig wurdet, versiegelt worden mit dem Hl. Geist der Verheißung“.</p><p>[Forts. v. ] Doch (zuvor) prüft der Geist die Seele; (denn) nicht wirft er die Perlen vor die Schweine. Wenn du als Heuchler kommst, taufen dich zwar jetzt die Menschen, doch der Geist wird dich nicht taufen. Wenn du dich aber vom Glauben hinführen läßt, dann gibt der Hl. Geist, während Menschen sichtbare Zeremonien verrichten, die unsichtbare Gnade. Du kommst zu einer bedeutungsvollen Prüfung, zu einer wichtigen Musterung, die* eine* Stunde dauert. Ist die Stunde für dich verloren, dann läßt sich das Übel nicht mehr gut machen. Wenn du aber der Gnade gewürdigt wirst, wird deine Seele erleuchtet, und du erhältst eine Kraft, welche du nicht hattest. Waffen empfängst du, vor welchen die Dämonen sich fürchten. Wenn du die Waffen nicht wegwirfst, das Siegel vielmehr in der Seele behältst, tritt der Dämon nicht an dich heran. Er hält sich scheu zurück, da ja im Geiste Gottes die Dämonen ausgetrieben werden.</p><p>Wenn du glaubst, empfängst du nicht nur Nachlassung der Sünden, sondern du wirkst auch Übermenschliches. Möchtest du auch der Prophetengabe gewürdigt werden! Du empfängst nämlich so viele Gnaden, als du zu fassen vermagst, und nicht bloß das, was ich sage. Es kann nämlich sein, daß ich nur Geringes nenne, du aber Größeres empfängst; der Glaube ist ja ein weites Gebiet. Der Tröster ist überall dein Beschützer. Er ist für dich besorgt wie für einen Soldaten; er achtet auf deinen Eingang und auf deinen Ausgang, auch auf die, welche dir nachstellen. Wenn du ihn nicht durch eine Sünde beleidigst, schenkt er dir Gnadengaben aller Art. Es ist nämlich geschrieben: „Betrübet nicht den Hl. Geist Gottes, in welchem ihr versiegelt seid für den Tag der Erlösung!“ Geliebte, was heißt nun das: die Gnade bewahren? Seid bereit, die Gnade zu empfangen, und wenn ihr sie empfangen habt, werfet sie nicht weg!</p><p>[Forts. v. ] Der Gott des Weltalls, der im Hl. Geist durch die Propheten gesprochen, ihn hier (in Jerusalem) am Pfingstfeste auf die Apostel herabgesandt hat, er möge ihn jetzt auch auf euch herabsenden und möge durch ihn auch uns bewahren und uns allen gemeinsam seine Wohltaten erweisen, damit wir überall die Früchte des Hl. Geistes bringen: „Liebe, Freude, Friede, Langmut, Freundlichkeit, Güte, Glaube, Sanftmut, Enthaltsamkeit“ in Christus Jesus, unserem Herrn. Durch ihn und mit ihm sei zugleich mit dem Hl. Geiste die Ehre dem Vater jetzt und immer und in alle Ewigkeit. Amen.XVIII. KATECHESE AN DIE TÄUFLINGE, frei vorgetragen in Jerusalem. Über die Worte: „und an eine heilige, katholische Kirche, Auferstehung des Fleisches und ein ewiges Leben“.</p><h2>19</h2><p>* Über die Worte: „und an* eine* heilige, katholische Kirche, Auferstehung des Fleisches und ein ewiges Leben“.*</p><p>Die Hoffnung auf die Auferstehung ist die Wurzel jeder guten Handlung. Die Erwartung eines Lohnes stärkt die Seele zu gutem Werke. Jeder Arbeiter ist ja gerne bereit, die Mühen zu ertragen, wenn er den Lohn für die Mühen voraussieht; wer aber für seine Mühen keinen Lohn erhält, der bricht physisch und moralisch zusammen. Der Soldat ist zum Kriege bereit, wenn der Kampfpreis auf ihn wartet. Wer im militärischen Dienste eines unverständigen Königs steht, welcher Strapazen nicht belohnt, ist nicht bereit, für den König zu sterben. So weiß selbstverständlich jede Seele, die an eine Auferstehung glaubt, sich zu schätzen, während jene, welche an keine Auferstehung glaubt, sich dem Verderben ausliefert. Wer glaubt, daß der Körper zur Auferstehung bestimmt ist, gibt acht auf dieses Kleid und beschmutzt es nicht durch Unzucht; wer aber nicht an eine Auferstehung glaubt, gibt sich der Unzucht hin, auf den eigenen Körper so wenig achtend, als wäre er etwas Fremdes. Eine wichtige Botschaft und Lehre der heiligen katholischen Kirche ist also der Glaube an die Auferstehung der Toten. Eine wichtige und sehr notwendige Lehre, der zwar viele widersprechen, die aber von der Wahrheit bestätigt wird. Ihr widersprechen die Heiden, die Samariter glauben nicht an sie, die Häretiker spotten über sie. Vielfach ist der Widerspruch, einfach die Wahrheit.</p><p>[Forts. v. ] Heiden wie Samariter entgegnen uns: „Wenn der Mensch stirbt, zerfällt er, fault und löst sich vollständig in Würmer auf, die auch ihrerseits sterben. Wenn sich aber solche Fäulnis und Vernichtung des Körpers bemächtigt hat, wie soll er auferweckt werden? Die Schiffbrüchigen werden von Fischen verzehrt, die selbst wieder verzehrt werden. Bären und Löwen zermalmen und verzehren sogar noch die Knochen der Tierkämpfer. Geier und Raben fressen das Fleisch von den Toten, die man auf freiem Felde liegen ließ, und fliegen dann in alle Welt davon. Woher soll der Körper zusammengebracht werden? Denn es ist möglich, daß von jenen Raubvögeln der eine in Indien, ein anderer in Persien, ein dritter in Gothien endet. Andere Menschen werden verbrannt, und Regen oder Winde zerstreuen ihre Asche. Wie soll der Körper wieder zusammengesetzt werden?“</p><p>Für dich, der du ein winzig kleiner und schwacher Mensch bist, ist Indien weit von Gothien und Spanien weit von Persien entfernt. Für Gott aber, der die ganze Erde in seiner Faust hält, ist alles nahe. Klage nicht Gott, ihn nach deiner eigenen Schwäche messend, der Ohnmacht an, denke vielmehr an seine Macht! Wenn die Sonne, ein kleines Werk Gottes, mit einem einzigen Strahl die ganze Welt erwärmt, wenn die Luft, die Gott gemacht, alles in der Welt umgibt, sollte dann Gott, der Schöpfer der Sonne und der Luft, der Welt ferne sein? Da du noch schwach im Glauben bist, gebe ich dir ganz einfache Vergleiche. Nimm an, verschiedene Pflanzensamen seien gemischt, und du hieltest diese verschiedenen Samen in deiner einen Hand! Ist es nun für dich, den Menschen, schwer oder leicht, was in deiner Hand ist, zu sondieren und die einzelnen Samen nach ihrer Beschaffenheit zu sammeln und zu ihrer Gattung zu legen? Wenn nun du das, was du in deiner Hand hast, sondieren kannst, sollte dann Gott das, was er in seiner Faust hält, nicht sondieren und wieder in Ordnung bringen können? Überlege, was ich dir sage, und antworte, ob es nicht gottlos ist, (die Auferstehung) zu leugnen!</p><p>[Forts. v. ] Achte auch auf die Forderung der Gerechtigkeit! Urteile von dir selbst aus! Hast du verschiedene Diener, von denen die einen gut, die anderen böse sind, dann ehrst du die guten und schlägst die bösen. Bist du Richter, dann lobst du die guten Menschen und strafst die Verbrecher. Wenn nun bei dir, einem sterblichen Menschen, die Gerechtigkeit Schutz findet, soll dann bei Gott, dem Könige aller, der ohne Nachfolger ist, die Gerechtigkeit ihren Lohn nicht erhalten? Wahrlich gottlos ist es, (die Auferstehung) zu leugnen. Erwäge, was ich dir sage! Viele Mörder sind in ihrem Bette gestorben, ohne also gestraft worden zu sein. Wo wäre nun Gottes Gerechtigkeit? Mörder, auf denen fünfzig Mordtaten lasten, werden ein einziges Mal enthauptet. Wo nun werden sie für die neunundvierzig Mordtaten gestraft? Wenn es nach dieser Welt kein Gericht und keine Vergeltung gibt, dann beschuldigst du Gott der Ungerechtigkeit. Halte dich nicht darüber auf, daß das Gericht erst später kommt! Wird ja doch jeder Wettkämpfer erst nach Beendigung des Kampfes gekrönt oder beschämt. Niemals krönt ein Kampfrichter noch während des Kampfes, sondern er wartet, bis alle Kämpfer am Ziele sind, um erst dann an die Kritik zu gehen und die Kampfpreise und Kränze zu verteilen. So gibt Gott, so lange noch der Kampf auf dieser Welt fortdauert, wohl einstweilen den Gerechten etwas Hilfe, erteilt ihnen aber erst später vollen Lohn.</p><p>[Forts. v. ] Wenn es nach deiner Meinung keine Auferstehung der Toten gibt, warum verurteilst du die Grabschänder? Wenn der Körper ein für allemal vernichtet ist und keine Hoffnung auf Auferstehung besteht, warum wird der Grabschänder bestraft? Wenn du auch die Auferstehung mit den Lippen leugnest, so wohnt doch in dir, wie du siehst, das unzerstörbare Bewußtsein, daß es eine Auferstehung gibt.</p><p>Wenn ein Baum, der gefällt worden ist, noch treibt, soll dann der Mensch, wenn er gefällt ist, nicht leben? Wenn das Getreide geerntet ist, harrt es der Scheune. Der Mensch aber soll, wenn er von dieser Welt abgeerntet ist, nicht der Scheune harren? Die Zweige der Weinstöcke und anderer Bäume erhalten, wenn sie auch vollständig abgeschnitten und verpflanzt worden sind, doch wieder Leben und treiben Früchte. Soll nun der Mensch, um dessentwillen die Pflanzenwelt existiert, nicht, wenn er in die Erde gesenkt ist, wieder auferstehen? Was ist verhältnismäßig schwieriger: eine Statue vollständig neu errichten oder eine umgestürzte Statue reparieren? Soll nun Gott, der uns aus dem Nichts erschaffen hat, es nicht vermögen, uns, die wir bereits in das Dasein gerufen sind, nach unserem Zerfall wieder zu erwecken?</p><p>Weil du ein Heide bist, glaubst du nicht, was die Schrift über die Auferstehung lehrt. Die Naturgeschichte möge dir die Augen für die Wahrheit öffnen, die tägliche Erfahrung den Verstand erleuchten! Nehmen wir an, es werde Weizen oder eine andere Samenart gesät. Ist der Same in die Erde gefallen, dann stirbt er und fault und wird ungenießbar. Trotzdem er verfault ist, wird er wieder erweckt und grünt. Und war er auch klein, da er (in die Erde) fiel, er wird herrlich, da er aufersteht. Nun ist aber der Weizen unsertwegen erschaffen worden; denn zu unserem Gebrauche und nicht seiner selbst wegen sind der Weizen und die (anderen) Samen entstanden. Wenn nun das, was unsertwegen erschaffen worden ist, stirbt und wieder lebend wird, sollten dann wir, derentwegen jene Samen entstanden sind, nach unserem Tode nicht auferweckt werden?</p><p>Es ist jetzt Winter, wie du siehst. Die Bäume stehen jetzt wie abgestorben da. Wo sind die Blätter des Feigenbaumes? Wo sind die Trauben des Weinstockes? Doch was im Winter tot ist, grünt im Frühling. Kommt die Zeit, dann wird neues Leben gegeben, gleichsam eine Auferstehung von den Toten. Da Gott deinen Unglauben kennt, wirkt er Jahr für Jahr in dieser sichtbaren Welt eine Auferstehung, damit du auf Grund dessen, was du in der unvernünftigen Welt wahrnimmst, auch eine Auferstehung der vernünftigen Wesen glaubst. Wenn Fliegen und Bienen oftmals, trotzdem sie im Wasser ertrunken sind, nach einiger Zeit wieder lebendig werden, wenn — deinem niederen Denken entsprechen die Beispiele — gewisse Arten von Kröten, welche den Winter über bewegungslos daliegen, im Sommer wieder Leben bekommen, sollte dann der, welcher die vernunftlosen, niedrigen Geschöpfe in unfaßbarer Weise belebt, nicht auch uns, um derentwillen er jene Tiere erschaffen hat, Leben schenken?</p><p>Die Heiden verlangen jedoch ein noch deutlicheres Beispiel für die Auferstehung von den Toten. Sie erklären: Jene Geschöpfe werden wohl zum Leben erweckt, ohne jedoch vollständig verfault zu sein. Sie wollen daher, daß man ihnen ein Tier zeige, das wirklich vollständig verfault und doch wieder aufersteht. Gott kannte den Unglauben der Menschen und schuf daher einen Vogel, den sogenannten Phönix. Dieser existiert, wie Clemens schreibt und noch mehrere Schriftsteller berichten, nur in einem einzigen Exemplar. Er kommt alle fünfhundert Jahre nach Ägypten, und damit das Wunderbare nicht verborgen bleibe, tut er seine Auferstehung nicht an einsamen Orten kund; vielmehr erscheint er in offener Stadt, auf daß man das Unglaubliche mit den Händen greife. Wenn der Phönix sich aus Weihrauch, Myrrhen und anderen Gewürzen ein Nest gebaut hat, legt er sich, sobald seine Zeit gekommen ist, in dasselbe und stirbt vor aller Augen und verfault. Aus dem verfaulten Fleisch des verendeten Vogels entsteht ein Wurm, der, wenn er größer geworden ist, sich zum Vogel verwandelt. Halte dies nicht für unglaublich! Du siehst ja auch die Bienen sich aus Würmern entwickeln und, daß aus den ganz flüssigen Eiern die Federn, Knochen und das Fleisch der Vögel wird. Wenn der erwähnte Phönix Flügel bekommt und vollständig die frühere Gestalt angenommen hat, dann fliegt er — derselbe, der gestorben war — in die Luft empor, nachdem er die Menschen klar und deutlich die Auferstehung der Toten gelehrt hat. Der Phönix ist ein wunderbarer Vogel, aber es fehlt ihm die Vernunft, und noch nie hat er Gott ein Loblied gesungen. Er fliegt in der Luft umher, doch weiß er nicht, wer der eingeborene Sohn Gottes ist. Wenn nun dem unvernünftigen Tiere, das seinen Schöpfer nicht kennt, eine Auferstehung von den Toten verliehen wird, soll dann uns, die wir Gott preisen und seine Gebote beobachten, keine Auferstehung geschenkt werden?</p><p>Da das Beispiel des Phönix weit hergeholt und seltsam ist, und man (seinetwegen) noch nicht glaubt, so sollst du aus den täglichen Erfahrungen Beweise haben. Wo waren wir alle, die wir reden und zuhören, vor hundert oder zweihundert Jahren? Wir kennen doch die Grundlage unseres körperlichen Daseins. Du weißt doch, daß wir aus einer schwachen, gestaltlosen, einfachen Substanz erzeugt werden. Aus der einfachen und schwachen Substanz entwickelt sich der lebende Mensch. Die schwache Substanz wird zu Fleisch und entwickelt sich zu kräftigen Nerven, zu Augen, die leuchten, zur Nase, die riecht, zu Ohren, die hören, zur Zunge, die redet, zum Herzen, das schlägt, zu den Händen, die arbeiten, zu den Füßen, die gehen, zu Gliedern jeder Art. Jene schwache Substanz wird zu Marineingenieuren, zu Baumeistern, zu Architekten, zu Männern jeglichen Berufes, zu Soldaten, zu Herrschern, zu Gesetzgebern, zu Königen. Soll nun Gott, der uns aus unscheinbarer Substanz gebildet hat, uns nach unserem Verfall nicht wieder erwecken können? Soll der, welcher die winzig kleine Substanz zum Körper gestaltet, den Körper nach seinem Zerfalle nicht wieder erwecken können? Soll der, welcher aus dem Nichts erschaffen hat, das, was ins Dasein gerufen ist, nach seinem Verfalle nicht wieder erwecken können?</p><p>[Forts. v. ] Einen deutlichen Beweis für die Auferstehung von den Toten sollst du haben. Der Himmel und die Gestirne geben dir den Beweis Monat für Monat. Ist der Mond so vollständig verschwunden, daß nichts mehr von ihm zu sehen ist, dann wird er wieder voll und wird wieder zu dem, was er war. Um die Beweiskraft zu erhöhen, nimmt der Mond nach Jahresumlauf ab und verwandelt sich deutlich in Blut, erhält aber dann wieder seine leuchtende Gestalt. Dies ist von Gott so geordnet, damit du, o Mensch, der du aus Blut bestehst, fest an die Auferstehung von den Toten glaubst und das, was du an dem Mond beobachtest, auch von dir selbst annimmst.</p><p>Solcher Beweise bediene dich gegen die Heiden! Gegen jene, welche die Schrift nicht annehmen, mußt du mit Waffen kämpfen, welche dir nicht die Schrift, sondern einzig die Vernunft und die Natur in die Hand geben. Nicht kennen sie ja Moses, nicht Isaias, nicht die Evangelien, nicht Paulus.</p><p>Wende dich ferner gegen die Samariter! Dieselben anerkennen nur das Gesetz, nicht aber auch die Propheten. Unsere Lesung aus Ezechiel ist also für sie bedeutungslos. Die Propheten nehmen sie ja, wie gesagt, nicht an. Wie werden wir nun die Samariter überzeugen? Halten wir uns an das, was im Gesetze geschrieben steht! Da spricht nun Gott zu Moses: „Ich bin der Gott Abrahams, Isaaks und Jakobs“. Offenbar leben und existieren diese also noch weiter. Wären nämlich Abraham, Isaak und Jakob tot, dann wäre Gott ein Gott der Toten. Wann hat je ein König gesagt, er sei König von Soldaten, die er nicht hat? Wann hat jemand einen Reichtum zur Schau ausgestellt, den er nicht besaß? Damit nun Gott ein Gott von Personen ist, die existieren, müssen Abraham, Isaak und Jakob noch existieren. Nicht sagte er nämlich: „Ich* war* ihr Gott“, sondern: „Ich bin es“. Und da es ein Gericht gibt, spricht Abraham zum Herrn: „Wird etwa der, welcher die ganze Erde richtet, kein Gericht halten?“</p><p>Doch die törichten Samariter wenden ein und sagen: „Wenn auch die Seelen Abrahams, Isaaks und Jakobs weiter leben, so stehen doch ihre Leiber unmöglich auf.“</p><p>Wenn nun der Stab des gerechten Moses zur Schlange werden konnte, soll es dann unmöglich sein, daß die Leiber der Gerechten lebendig werden und aufstehen? Dort geschah ein Wunder; das aber, was naturgemäß ist, soll nicht erfolgen? Obwohl der Stab des Aaron abgeschnitten und erstorben war und „ohne Wohlgeruch des Wassers“, fing er zu grünen an. Obwohl er im Zelte lag, grünte er, als wäre er auf freiem Felde, und obwohl er auf trockenem Boden war, trieb er in einer einzigen Nacht gleich Pflanzen, die Jahre lang begossen werden, und trug Früchte. Wenn nun der Stab Aarons gleichsam von den Toten auferstanden ist, soll dann Aaron selbst nicht auferweckt werden? Wenn Gott, um dem Aaron die hohepriesterliche Würde zu erhalten, am Holze Wunder wirkte, soll er dann dem Aaron selbst nicht die Auferstehung verleihen?</p><p>Wenn ein Weib wunderbarerweise zu Salz wurde, Fleisch sich in Salz verwandelte, soll dann Fleisch nicht wieder zu Fleisch werden? Wenn das Weib des Lot zu einer Salzsäule wurde, soll dann das Weib des Abraham nicht auferstehen?</p><p>Welche Macht hat die Hand des Moses verändert, so daß sie innerhalb* einer* Stunde wie Schnee wurde und dann wieder wurde wie zuvor? Offenbar Gottes Wort. Wenn nun Gottes Wort seinerzeit Kraft hatte, soll es jetzt keine Kraft mehr haben?</p><p>[Forts. v. ] Ihr Samariter, ihr unverständigsten unter allen Menschen, woraus ist zu Anbeginn der Mensch erzeugt worden? Greifet zum ersten Buch der Schrift, welches auch ihr annehmet! „Und Gott bildete den Menschen, Staub von der Erde“. Staub wird in Fleisch verwandelt, aber Fleisch soll nicht wieder zu Fleisch werden? An euch ist die Frage zu stellen: Woraus sind die Himmel, die Erde und die Meere geworden? Woraus Sonne, Mond und Sterne? Wie sind aus Wasser die Vögel und die Fische entstanden? Wie sind aus Erde alle Tiere (des Landes) geworden? So viele Myriaden sind aus dem Nichts in das Dasein gerufen worden, und wir Menschen, Gottes Ebenbild, sollen nicht wieder auferstehen? Wahrlich, ein vollendeter Unglaube! Schwere Strafe erwartet die Ungläubigen, welche trotz des Wortes Abrahams an den Herrn: „Du richtest die ganze Erde“ und trotz ihrer Gesetzeskenntnis ungläubig bleiben, welche ungläubig bleiben, trotzdem sie das Wort der Schrift lesen: aus Erde ist der Mensch.</p><p>Diese Lehren (des Gesetzes) sind gegen die ungläubigen Samariter gerichtet. Uns, die wir glauben, gelten die Prophetenworte. Nun aber glauben auch einige, welche die Propheten annehmen, nicht an die Worte der Schrift und zitieren gegen uns die Worte: „Nicht werden die Gottlosen zum Gerichte aufstehen“, und: „Wenn der Mensch in die Unterwelt hinabgestiegen ist, steigt er nimmermehr herauf“, und: „Nicht werden die Toten dich loben, o Herr“. Sie mißbrauchen herrliche Schriftstellen. Nebenbei, soweit es jetzt möglich ist, wollen wir uns mit diesen abgeben!</p><p>Wenn es heißt: „Nicht werden die Gottlosen zum Gerichte aufstehen“, so will gesagt sein: Nicht zum Gerichte, sondern zur Verdammung werden sie aufstehen. Gott braucht nämlich nicht erst lange zu untersuchen, sondern in demselben Augenblick, da die Gottlosen aufstehen, werden sie schon bestraft. Wenn es ferner heißt: „Nicht werden die Toten dich loben, o Herr“, so will das heißen: da für Buße und Sündennachlaß in diesem Leben nur bestimmte Frist gegeben wird, werden diejenigen, welche diese Frist ausnützen, „dich loben“, während diejenigen, welche in Sünden gestorben sind, nach ihrem Tode, da sie nichts Gutes empfangen, nicht loben, sondern nur weinen werden. Wer Dank sagen kann, wird loben; wer gezüchtigt wird, wird weinen. Die Gerechten werden also dereinst loben; die aber in Sünden gestorben sind, werden keine Zeit mehr haben, ihre Sünden zu bekennen.</p><p>Bezüglich des Satzes: „Wenn der Mensch in die Unterwelt hinabgestiegen ist, steigt er nimmermehr herauf“, achte auf die noch folgenden Worte! Es heißt nämlich: „Er steigt nimmermehr herauf, und nimmermehr kehrt er in sein eigenes Haus zurück.“ Wie soll einer, wenn die ganze Welt dahinsinkt und jedes Haus zusammenfällt und eine neue, andere Erde entsteht, in sein eigenes Haus zurückkehren?</p><p>Die Ungläubigen sollten auf das Wort des Job hören: „Der Baum hat Hoffnung. Ist er abgehauen, dann grünt er wieder und seine Zweige treiben wieder. Altert seine Wurzel in der Erde, stirbt sein Stamm im Gestein, dann läßt der Wohlgeruch des Wassers ihn wieder grünen und gibt Früchte, gleich als wäre der Baum neu gepflanzt. Der Mensch aber, wenn er gestorben ist, ist dahin? Der Sterbliche, wenn er zerfallen ist, ist nicht mehr?“ Als Frage sind die Worte „er ist nicht mehr“ zu lesen. Beschämend wird der Vorwurf erhoben: soll denn, wenn der Baum fällt und doch wieder zum Leben erwacht, der Mensch, um dessentwillen die Bäume erschaffen worden sind, nicht wieder auferstehen? Damit du aber nicht meinst, ich tue der Stelle Gewalt an, lies, was folgt! Nach der Frage: „Der Sterbliche, wenn er zerfallen ist, ist nicht mehr?“ heißt es: „Wenn nämlich der Mensch gestorben ist, wird er leben“, und gleich darauf: „Ich harre, bis ich wieder werde“. Und an irgendeiner anderen Stelle: „Er wird auf Erden meine Haut wieder beleben, welche diese Mühen auszuhalten hat“. Der Prophet Isaias aber sagt: „Die Toten werden auferstehen, und es werden auferweckt werden, die in den Gräbern sind“. Ganz deutlich erklärt unser Prophet Ezechiel: „Siehe, ich öffne eure Gräber und werde euch aus euren Gräbern wieder herausführen“. Daniel sagt: „Viele von denen, welche im Staube der Erde ruhen, werden auferstehen, die einen zum ewigen Leben, die anderen zur ewigen Schande“.</p><p>Viele Stellen der Schrift bezeugen die Auferstehung der Toten. Es gibt nämlich noch mehrere andere Schriftworte hierüber. Vorübergehend erinnern wir jetzt nur an die nach vier Tagen erfolgte Auferstehung des Lazarus, vorübergehend — mit Rücksicht auf die Kürze der Zeit — an die Auferweckung des Sohnes der Witwe. Nebenbei sei jetzt auch nur erinnert an die Tochter des Synagogenvorstehers. Erwähnt sei noch, daß die Felsen sprangen, die Gräber sich öffneten und die Leiber vieler entschlafener Heiligen auferstanden. Vor allem aber sei an die Auferstehung Christi von den Toten erinnert. Nicht erwähnt habe ich, wie Elias den Sohn der Witwe von den Toten erweckte, nicht erwähnt habe ich, wie Elisäus zweimal Tote erweckte, das eine Mal zu seinen Lebzeiten, das andere Mal nach seinem Tode. Zu seinen Lebzeiten wirkte seine Seele die Auferstehung. Damit man aber nicht nur die Seele der Gerechten ehre, sondern glaube, daß auch dem Körper der Gerechten Kraft innewohne, so erhielt der Leichnam, welcher in das Grab des Elisäus gelegt wurde, wieder das Leben, sobald er den toten Körper des Propheten berührt hatte. Der Leichnam des Propheten wirkte, was die Seele gewirkt hatte. Der Körper, der tot im Grabe lag, verlieh dem Toten Leben, und er blieb tot auch noch, nachdem er das Leben verliehen hatte. Warum? Man sollte nicht, im Falle einer Auferstehung des Elisäus, jenes Wunder nur seiner Seele zuschreiben; es sollte sich vielmehr zeigen, daß in den Körpern der Heiligen, auch wenn sie bereits entseelt sind, noch eine Kraft ist, und zwar deshalb, weil in diesen Körpern so viele Jahre lang eine gerechte Seele gewohnt hat, welcher der Körper gedient hat. Huldigen wir nicht töricht dem Unglauben, gleich als wenn das Wunder nicht geschehen wäre! Wenn nämlich Schweißtücher und Leibwäsche, sobald sie mit kranken Körpern in Berührung kamen, die Kranken aufrichteten, um wieviel mehr vermochte der Leichnam des Propheten den Toten zu erwecken!</p><p>Wollten wir auf die einzelnen wunderbaren Begebenheiten eingehen, dann hätten wir noch viel zu sagen. Da ihr aber wegen des strengen Fastens am Karfreitag und infolge der Wachen ermüdet seid, seien jene Beispiele einstweilen nur vorübergehend erwähnt — eine kleine Saat, die ihr als ein herrlicher Boden aufnehmen sollt, um reichliche Früchte zu bringen. Daran sei noch erinnert, daß auch die Apostel Tote erweckt haben. Petrus erweckte die Tabitha in Joppe, Paulus den Eutychus in Troas, auch alle übrigen Apostel wirkten Totenerweckungen; allerdings sind nicht alle Wunder aufgeschrieben, die jeder gewirkt hat. Denket an all das, was Paulus im ersten Briefe an die Korinther geschrieben hat als Antwort auf die Frage: „Wie sollen die Toten auferstehen? In welchem Leibe werden sie kommen?“ Denket an das Wort: „Wenn die Toten nicht auferstehen, ist auch Christus nicht auferstanden“! Denket daran, daß er die, welche nicht (an die Auferstehung) glaubten, als „Toren“ bezeichnete! Rufe dir die ganze dortige Lehre über die Auferstehung von den Toten ins Gedächtnis! Erinnere dich an sein Wort im Briefe an die Thessaloniker: „Wir wollen euch, Brüder, nicht in Unkenntnis über die Entschlafenen lassen, damit ihr euch nicht betrübet, wie die anderen Menschen, welche keine Hoffnung haben“, und an alle die folgenden Worte, vor allem aber an die Erklärung: „Die Toten, die in Christus gestorben sind, werden zuerst auferstehen“.</p><p>Vor allem merket euch den Fingerzeig, den euch Paulus gibt mit den Worten: „Es muß nämlich dieses Vergängliche die Unvergänglichkeit und dieses Sterbliche die Unsterblichkeit anziehen“. Wenn nämlich dieser Körper auferweckt wird, behält er nicht diese seine Schwäche bei, sondern eben der Körper zieht, wenn er auferweckt wird, die Unvergänglichkeit an; er wird verwandelt wie das Eisen, das im Feuer zu Feuer wird, vielmehr er wird verwandelt nach der Weisheit des Herrn, der ihn auferweckt. Es ist dieser Körper, welcher auferweckt wird, doch besteht er dann weiter nicht in seinen jetzigen Eigenschaften, sondern als ewiger Körper. Nicht mehr bedarf er alsdann, um zu leben, unserer Nahrungsmittel, und um emporzusteigen, braucht er keine Leiter. Er wird nämlich zum geistigen Körper, zu etwas Wunderbarem, wofür wir keinen entsprechenden Ausdruck haben. „Alsdann“ — heißt es — „werden die Gerechten leuchten wie die Sonne und der Mond und wie der Glanz des Firmamentes“. Da Gott den Unglauben der Menschen vorauswußte, fügte er es, daß aus dem Körper von ganz kleinen Würmern im Sommer Lichtstrahlen ausgehen. Die Beobachtung dieser Naturerscheinung sollte zum Glauben an das führen, was wir zu erwarten haben. Der den Teil gegeben hat, kann auch das Ganze geben, und der einem Wurme Licht verleiht, wird um so mehr den Gerechten leuchten lassen.</p><p>[Forts. v. ] Bei der Auferstehung werden wir alle zwar einen ewigen Körper, aber nicht alle den gleichen Körper erhalten. Der Gerechte empfängt einen himmlischen Körper, um würdig mit den Engeln verkehren zu können. Der Sünder dagegen empfängt einen ewigen Körper, welcher fähig ist, Sündenstrafen zu erleiden, ewig im Feuer zu brennen, ohne jemals zu verbrennen. Mit Recht verfährt Gott auf solche Weise gegen die beiden Menschenklassen. Denn nichts tun wir ohne den Körper. Mit dem Munde fluchen wir, mit dem Munde beten wir. Mit dem Leibe treiben wir Unkeuschheit, mit dem Leibe pflegen wir Keuschheit. Durch die Hand geht der Raub, durch die Hand das Almosen usw. Da der Körper zu allem mithilft, hat er in der Zukunft auch die Folgen zu tragen.</p><p>Brüder, seien wir also für unsere Körper besorgt und mißbrauchen wir sie nicht, gerade als wären sie Fremdlinge! Sagen wir nicht wie die Häretiker: „Der Körper ist ein fremdes Gewand“! Achten wir vielmehr auf ihn, da er unser Eigentum ist! Wir müssen nämlich dem Herrn Rechenschaft geben für alles, was wir mit dem Körper getan haben. Sagen wir nicht: „Niemand sieht mich“! Und glaube nicht, es gebe keinen Zeugen für das, was du tust! Oftmals ist allerdings kein Mensch Zeuge, wohl aber ist immer der wahrhafte Schöpfer im Himmel ein verlässiger Zeuge; er sieht, was geschieht. Auch bleiben im Körper die Flecken der Sünde. Gleichwie von einer Wunde, selbst wenn sie geheilt ist, doch noch die Narbe am Körper bleibt, so bleiben, wenn die Sünde der Seele und dem Leibe Wunden geschlagen hat, doch noch überall die Narben; sie vergehen nur bei denen, welche das Bad (der Taufe) empfangen. Da nun Gott durch die Taufe die bisherigen Wunden der Seele und des Leibes heilt, wollen wir uns alle gemeinsam für die Zukunft sicherstellen, um dieses Gewand des Leibes rein zu bewahren und auch nicht durch etwas Unzucht und Ausschweifung oder durch irgendeine andere Sünde das himmlische Heil zu verlieren; denn das ewige Reich Gottes wollen wir erben. Möge Gott in seiner Gnade euch alle desselben würdig machen!</p><p>[Forts. v. ] So viel sei gesagt zum Beweise der Auferstehung von den Toten!</p><p>Ich spreche euch nun noch einmal das Glaubensbekenntnis vor, und ihr saget es wortwörtlich mit allem Eifer nach und präget es dem Gedächtnis ein!</p><p>[Forts. v. ] Das Glaubensbekenntnis, das ihr gesprochen habt, enthält noch die Worte: „und an* eine* Taufe der Buße zur Vergebung der Sünden und an eine heilige katholische Kirche und an eine Auferstehung des Fleisches und ein ewiges Leben“. Über die Taufe und die Buße haben wir in den ersten Katechesen gesprochen. Die Lehre von der Auferstehung der Toten haben wir soeben im Anschluß an die Worte „und an eine Auferstehung des Fleisches‘ vorgetragen. Es erübrigt also noch, über die Worte „und an* eine* heilige katholische Kirche“ zu sprechen. Hierüber wäre vieles zu sagen, doch wollen wir uns kurz fassen.</p><p>Die Kirche heißt katholisch, weil sie auf dem ganzen Erdkreis, von dem einen Ende bis zum anderen, ausgebreitet ist, weil sie allgemein und ohne Unterlaß all das lehrt, was der Mensch von dem Sichtbaren und Unsichtbaren, von dem Himmlischen und Irdischen wissen muß, weil sie das ganze Menschengeschlecht, Herrscher und Untertanen, Gebildete und Ungebildete, zur Gottesverehrung führt, weil sie allgemein jede Art von Sünden, die mit der Seele und dem Leibe begangen werden, behandelt und heilt, endlich weil sie in sich jede Art von Tugend, die es gibt, besitzt, mag sich dieselbe in Werken oder Worten oder in irgendwelchen Gnadengaben offenbaren.</p><p>[Forts. v. ] Der Name Kirche* (ἐκκλησία)* [ekklēsia] erklärt sich daraus, daß durch sie alle Menschen berufen und vereint werden. Im Buche Levitikus sagt der Herr: „Versammle* (ἐκκλησίασον)* [ekklēsiason] die ganze Gemeinde vor der Türe des Zeltes des Zeugnisses!“ Zu bemerken ist, daß das Wort* ἐκκλησίασον* [ekklēsiason] hier, wo der Herr den Aaron als Hohenpriester aufstellte, zum ersten Male in der Schrift gebraucht wird. Im Deuteronomium spricht Gott zu Moses: „Versammle* (ἐκκλησίασον)* [ekklēsiason] vor mir das Volk! Sie sollen meine Worte hören, daß sie mich fürchten lernen!“ Noch einmal wird der Name Kirche erwähnt, nämlich da, wo es von den Tafeln heißt: „Auf denselben waren alle Worte geschrieben, welche der Herr zu euch auf dem Berge aus der Mitte des Feuers* am Tage der Versammlung (ἐκκλησία)* [ekklēsia] gesprochen hatte“. Genauer ausgedrückt sollte es heißen: „am Tage, da ihr von Gott berufen und versammelt wurdet“. Und der Psalmist sagt: „Ich will dich preisen, o Herr, in großer Versammlung* (ἐκκλησία)* [ekklēsia], vor zahlreichem Volke will ich dich loben“.</p><p>Ehedem sang der Psalmist: „In der Kirche preiset Gott, den Herrn, ihr aus den Quellen Israels!“ Seitdem aber die Juden den Erlöser verfolgt haben und deshalb aus der Gnade verstoßen worden sind, hat der Erlöser mit der Gründung unserer heiligen christlichen Kirche eine zweite Kirche, und zwar aus den Heiden, erbaut. Zu Petrus sagte er über dieselbe: „Auf diesen Felsen werde ich meine Kirche bauen, und die Pforten der Hölle werden sie nicht überwältigen“.David hat über diese beiden Kirchen ausdrücklich sich prophetisch geäußert. Über die erste Kirche, die verworfen wurde, sagt er: „Ich hasse die Kirche der Ruchlosen“. Über die zweite Kirche, die (b0ereits) gegründet ist, erklärt er in demselben Psalme: „Herr, ich liebe die Pracht deines Hauses“, und gleich darauf: „In den Kirchen will ich dich loben, o Herr“. Nachdem die eine, jüdische Kirche verworfen ist, mehren sich auf dem ganzen Erdkreis die christlichen Kirchen, worüber in den Psalmen gesagt ist: „Singet dem Herrn ein neues Lied! Sein Lob erschalle in der Kirche der Heiligen!“ In Übereinstimmung hiermit sprach der Prophet zu den Juden: „Ich habe kein Wohlgefallen an euch, spricht der Herr, der Allmächtige“,und gleich darauf: „Denn vom Aufgange der Sonne bis zu ihrem Untergange ist mein Name gepriesen unter den Heiden“. Über diese heilige katholische Kirche schreibt Paulus an Timotheus: „Du sollst wissen, wie du zu wandeln hast im Hause Gottes, welches ist die Kirche des lebendigen Gottes, die Säule und Grundfeste der Wahrheit“.</p><p>Das Wort* ἐκκλησία* [ekklēsia] wird in verschiedenem Sinne gebraucht. So heißt es z. B. von der im Theater zu Ephesus versammelten Menge: „Nachdem er dies gesagt hatte, entließ er die* ἐκκλησία* [ekklēsia]“. Mit Grund könnte also jemand behaupten: die Versammlung der ruchlosen Häretiker, der Marcioniten und Manichäer usw. sind tatsächlich auch eine Kirche. Deshalb versichert dir nun das Glaubensbekenntnis: „und an* eine* heilige, katholische Kirche“. Die häßlichen Versammlungen der Häretiker sollst du nämlich meiden, der heiligen, katholischen Kirche aber, in der du wiedergeboren wurdest, stets treu anhangen! Kommst du in eine Stadt, dann frage nicht einfach: „Wo ist das Haus des Herrn?“ Denn die gottlosen Häretiker erkühnen sich auch ihre Spelunken Haus des Herrn zu nennen. Auch frage nicht einfach: „Wo ist die Kirche?“, sondern: „Wo ist die katholische Kirche?“ Denn dies ist der spezielle Name für unsere heilige Kirche, für unser aller Mutter, die da ist die Braut unseres Herrn Jesus Christus, des eingeborenen Sohnes Gottes; denn es steht geschrieben: „wie Christus seine Kirche geliebt und sich für sie hingegeben hat usw.“. Auch ist unsere Kirche ein Abbild und eine Nachahmung des „oberen Jerusalem, sie ist die Freie und die Mutter von uns allen“, welche zuerst unfruchtbar war, nun aber viele Kinder hat.</p><p>Nachdem die erste Kirche verworfen war, hat Gott in der zweiten, d. i. in der katholischen Kirche, wie Paulus sagt, „zunächst Apostel, zweitens Propheten, drittens Lehrer aufgestellt, hat sodann Wunder, die Gaben der Heilung, der Hilfeleistung, der Verwaltung, von mancherlei Sprachen (verliehen)“ und jede Art der Tugend, nämlich Weisheit und Verstand, Mäßigkeit und Gerechtigkeit, Barmherzigkeit und Menschenfreundlichkeit und eine bei Verfolgungen unüberwindliche Geduld. Diese unsere Kirche (zeigt sich) „in den Waffen der Gerechtigkeit zur Rechten und zur Linken, geehrt und geschmäht“; früher hat sie die heiligen Märtyrer in den Zeiten der Verfolgung und der Trübsal mit den bunten, blumenreichen Siegeskränzen der Geduld gekrönt, jetzt aber, in der Zeit des Friedens, erhält sie durch die Gnade Gottes die ihr gebührende Ehre von Königen und Machthabern und von jeder Gattung und Art von Menschen. Während die Macht der Könige beschränkt ist auf das Gebiet ihrer Völker, hat die heilige, katholische Kirche — und sie allein — eine unbegrenzte Macht über den ganzen Erdkreis. „Als ihre Grenzen hat nämlich Gott“ — wie geschrieben ist — „den Frieden bestimmt“.</p><p>Wollte ich die ganze Lehre der Kirche vortragen, dann bräuchte ich mehrere Stunden dazu.</p><p>[Forts. v. ] Wenn wir uns von der heiligen, katholischen Kirche genügend unterrichten lassen und tugendhaft in ihr wandeln, werden wir durch sie das Himmelreich erlangen und das ewige Leben erben. Alle Mühen nehmen wir auf uns, um von dem Herrn das ewige Leben zu erhalten. Unser Ziel ist kein geringes, nach dem ewigen Leben streben wir. Daher wird im Glaubensbekenntnis nach den Worten „und an eine Auferstehung des Fleisches“, d. i. der Toten, wovon wir gesprochen haben, von uns der Glaube „an ein ewiges Leben“ verlangt. Um das ewige Leben kämpfen wir Christen.</p><p>[Forts. v. ] Der Vater ist seinem Wesen nach und in Wahrheit das Leben. Über alles gießt er durch seinen Sohn und den Hl. Geist seine himmlischen Gaben aus. Das* ewige* Leben aber hat er in seiner Menschenfreundlichkeit uns Menschen untrüglich verheißen. Glauben müssen wir an die Möglichkeit, daß es uns gegeben wird. Glauben müssen wir; denn wir sollen auf Gottes Macht und nicht auf unsere Schwäche achten. Bei Gott ist nämlich alles möglich. Daß das ewige Leben möglich ist und daß wir es zu erwarten haben, sagt Daniel: „Und die vielen Gerechten werden leuchten wie die Sterne in Ewigkeit und immer“. Und Paulus sagt: „Und so werden wir in Gemeinschaft mit dem Herrn sein immerdar“. Die Versicherung, „in Gemeinschaft mit dem Herrn zu sein immerdar“, verweist nämlich auf das ewige Leben. Ganz deutlich spricht sich der Erlöser in den Evangelien aus: „Diese werden eingehen in die ewige Pein, die Gerechten aber in das ewige Leben“.</p><p>Es gibt zahlreiche Beweise für ein ewiges Leben. Wollen wir das ewige Leben erlangen: die göttlichen Schriften weisen uns die Wege, die dazu führen. Da wir aber bereits lange sprachen, wollen wir jetzt nur einige Schriftzeugnisse zitieren; eurem Eifer überlassen wir es, die übrigen aufzusuchen.</p><p>Ein Weg ist der Glaube. Denn es ist geschrieben: „Wer an den Sohn glaubt, hat das ewige Leben usw.“. An anderer Stelle sagt derselbe Schriftsteller: „Wahrlich, wahrlich sage ich euch: wer mein Wort hört und an den glaubt, der mich gesandt hat, hat das ewige Leben usw.“.</p><p>Ein anderer Weg ist die Verkündigung des Evangeliums. Denn die Schrift sagt: „Wer erntet, empfängt Lohn und sammelt Früchte für das ewige Leben“.</p><p>Noch ein anderer Weg ist: im Martyrium Christum zu bekennen. Denn es heißt: „Wer seine Seele haßt in dieser Welt, wird sie erhalten für das ewige Leben“.</p><p>Wieder ein anderer Weg ist: Christum höher zu schätzen als Besitz und Verwandtschaft.„Wer verläßt Brüder und Schwestern,..... wird das ewige Leben erben.“</p><p>Wieder ein Weg ist die Beobachtung der Gebote. „Du sollst nicht ehebrechen, du sollst nicht töten usw.“ antwortete der Herr dem, der zu ihm kam und fragte: „Guter Meister, was muß ich tun, um das ewige Leben zu haben?“</p><p>Noch ein Weg ist: die sündhaften Werke aufzugeben und weiterhin Gott zu dienen. Paulus sagt nämlich: „Jetzt aber, da ihr befreit seid von der Sünde und zu Sklaven Gottes geworden seid, habt ihr eure Frucht, die zur Heiligung führt, und als Ende ewiges Leben“.</p><p>Noch viele andere Wege lassen das ewige Leben finden. Doch ich übergehe sie, es sind ihrer zu viele. In seiner Barmherzigkeit hat nämlich der Herr nicht nur eine oder zwei, sondern viele Türen zum ewigen Leben geöffnet; denn soweit es auf ihn ankommt, sollen alle ungehindert das ewige Leben erlangen.</p><p>Um uns einzuschränken, sagen wir euch einstweilen nur dies über das ewige Leben. Es ist der allerletzte Lehrsatz und Abschluß im Glaubensbekenntnis. Möchten wir alle, Lehrer wie Zuhörer, durch die Gnade Gottes das ewige Leben erhalten!</p><p>[Forts. v. ] Liebe Brüder! Die Lehre der Kirche mahnt euch alle, eure Seele für den Empfang der himmlischen Gnaden vorzubereiten. Über den heiligen, apostolischen Glauben, der euch übergeben wurde, auf daß ihr ihn bekennet, haben wir mit der Gnade des Herrn so viele Katechesen, als es möglich war, in dieser verflossenen vierzigtägigen Fastenzeit gehalten. Nicht dürft ihr meinen, wir hätten nur dies zu sagen gehabt. Vieles ist übergangen worden, was nach der Anschauung besserer Lehrer vielleicht noch wichtiger gewesen wäre. Da am bevorstehenden heiligen Osterfest eure Liebe in Christus durch das Bad der Wiedergeburt erleuchtet wird, werdet ihr noch, so Gott will, über das Erforderliche belehrt werden, nämlich darüber, daß ihr, wenn ihr gerufen werdet, mit großer Andacht und in großer Ordnung eintreten müßt. Ihr werdet belehrt werden über den Zweck aller heiligen Taufzeremonien und darüber, daß ihr von der Taufe weg mit großer Andacht und in großer Ordnung zu dem heiligen Altare Gottes gehen müßt, um hier die geistigen und himmlischen Geheimnisse zu empfangen. Wenn ihr nämlich durch das Wort der Kirche vorbereitet und erleuchtet seid, dann soll man an jedem einzelnen es wahrnehmen, wie groß die Gnaden sind, welche Gott euch schenkt.</p><p>Nach dem heiligen, heilbringenden Ostertage werdet ihr schon vom Montag ab an jedem Tage der Woche am Schluß der Messe an die heilige Stätte der Auferstehung gehen, um, so Gott will, noch weiteren Unterricht zu erhalten. In demselben werdet ihr über den Grund jeder einzelnen Handlung belehrt werden und werdet ihr die Beweise des Alten und des Neuen Testamentes erhalten. Ihr werdet zunächst unterrichtet werden über die unmittelbar vor der Taufe stattfindenden Zeremonien, sodann über die Sündenreinigung, welche der Herr durch das Wort im Bade des Wassers wirkt, über den Namen Christ, den ihr zum Zeichen eurer priesterlichen Würde erhaltet, über das Siegel, das euch gegeben wird als Zeichen eurer Gemeinschaft mit dem Hl. Geist, über das Zeugnis der göttlichen Schrift bezüglich der Geheimnisse auf dem Altare des Neuen Bundes, welche hier (═ auf dem Golgatha) ihren Anfang genommen haben, über die Kraft dieser Geheimnisse, über die Zeit, zu welcher, und die Art, auf welche man dieselben empfangen muß, schließlich über die Notwendigkeit, sich in der Zukunft durch Wort und Tat der Gnade würdig zu zeigen, auf daß ihr alle das ewige Leben genießen könnt. Darüber werdet ihr, so Gott will, noch belehrt werden.</p><p>Endlich, meine Brüder, „freuet euch im Herrn alle Zeit! Ich wiederhole es: freuet euch!“ „Denn eure Erlösung ist nahe.“ Das himmlische Heer der Engel wartet auf eure Erlösung. Schon hört man „die Stimme des Rufenden in der Wüste: Bereitet den Weg des Herrn“. Der Prophet ruft: „Ihr, die ihr dürstet, kommet zum Wasser!“ Und gleich darauf; „Höret auf mich und esset Gutes, und laben soll sich am Guten eure Seele!“ Bald wird euch die schöne Stelle vorgelesen werden: „Werde Licht, werde Licht, neues Jerusalem! Dein Licht ist erschienen“. Von diesem Jerusalem hat der Prophet gesagt: „Dann wirst du heißen Stadt der Gerechtigkeit, treue Metropole Sion“; denn aus Sion ist das Gesetz hervorgegangen und aus Jerusalem das Wort des Herrn, das von hier aus sich über den ganzen Erdkreis ergossen hat. Zu diesem Jerusalem sagt der Prophet über euch: „Erhebe ringsum deine Augen und siehe deine Kinder versammelt!“ Jerusalem aber antwortet und spricht: „Wer sind die, welche auf mich zufliegen wie Wolken und wie Tauben mit ihren Jungen?“ „Wolken“ (heißen jene Kinder) wegen ihres geistigen Wesens, „Tauben“ wegen ihrer Einfalt. An anderer Stelle (sagt der Prophet): „Wer hat solches erfahren oder wer hat solches gesehen? Gebiert ein Land an* einem* Tage, wird ein Volk auf einmal geboren? Denn Sion gebar und brachte zur Welt ihre Kinder“. Alles wird mit unaussprechlicher Freude erfüllt werden; denn der Herr sagte: „Denn sieh, ich mache Jerusalem zur Wonne und mein Volk zur Freude“.</p><p>Schon jetzt soll man von euch sagen können: „Freuet euch, ihr Himmel, und frohlocke, o Erde!... Denn Gott erbarmt sich seines Volkes und tröstet die Niedrigen seines Volkes“. Dies wird geschehen wegen der Menschenfreundlichkeit Gottes, der zu euch spricht: „Siehe, ich werde deine Missetaten wegnehmen wie Wolken und deine Sünden wie Nebel“. Ihr seid gewürdigt des Namens der Gläubigen, wovon geschrieben ist: „Meine Diener werden einen neuen Namen erhalten, der gepriesen sein wird auf der Erde“, und darum werdet ihr mit Freude sagen: „Gepriesen sei Gott, der Vater unseres Herrn Jesus Christus, welcher uns mit lauter geistigem Segen im Himmel gesegnet hat durch Christus. In diesem — durch sein Blut — haben wir die Erlösung, die Vergebung der Sünden nach dem Reichtum seiner Gnade, mit der er uns reichlich beschenkt hat usw.“, und wiederum: „Gott, der reich ist an Erbarmen, hat in der großen Liebe, die er an uns gezeigt hat, uns, die wir tot waren durch die Sünden, zugleich mit Christus zum Leben erweckt usw.“. Lobet auch den Herrn der Güter mit den Worten: „Als aber die Güte und Menschenfreundlichkeit Gottes, unseres Heilandes, erschien, da hat er uns nicht auf Grund von Werken der Gerechtigkeit, welche wir getan haben, sondern nach seiner Barmherzigkeit erlöst durch das Bad der Wiedergeburt, und durch die Erneuerung im Hl. Geist, den er reichlich über uns ausgegossen hat durch unseren Herrn Jesus Christus, damit wir, gerechtfertigt durch seine Gnade, Erben würden gemäß unserer Hoffnung auf das ewige Leben“.</p><p>„Gott, der Vater unseres Herrn Jesus Christus, der Vater der Herrlichkeit, gebe euch den Geist der Weisheit und der Offenbarung in seiner Erkenntnis und möge die Augen des Geistes erleuchten!“ Er möge euch allezeit erhalten in guten Werken, Worten und Gedanken! Ihm sei Herrlichkeit, Ehre und Herrschaft durch unseren Herrn Jesus Christus zugleich mit dem Hl. Geist jetzt und immer und in alle endlose Ewigkeit. Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Katechesen an die Täuflinge</em> (Bibliothek der Kirchenväter). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3585/versions/katechesen-an-die-tauflinge-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "gKkn_Тайноводственные_поучения"
    path: "Cyrill_Mystagogische_Katechesen"
    title: "Mystagogische Katechesen an die Neugetauften"
    menu: { parent: "Katechetische Werke", title: "Mystagogische Katechesen an die Neugetauften", priority: 2 }
    update: true
    body: |-
      <p><em>Mystagogische Katechesen an die Neugetauften (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>* Lesung aus dem ersten katholischen Briefe Petri von „Seid nüchtern und wachsam“ bis zum Schluß des Briefes.*</p><p>Schon längst habe ich darnach verlangt, mit euch, ihr wahren, ersehnten Kinder der Kirche, mich über diese geistigen, himmlischen Geheimnisse zu unterhalten. Da ich jedoch gut wußte, daß man sich auf das, was man sieht, viel mehr verläßt als auf das, was man hört, so wartete ich auf den heutigen Tag. (Erst jetzt), da ihr auf Grund dessen, was ihr nun erlebt habt, für die Lehre empfänglicher geworden seid, will ich euch auf die lichte, wohlriechende Wiese dieses Paradieses führen. Von besonderer Bedeutung ist es, daß ihr, nachdem ihr der göttlichen, lebenspendenden Taufe gewürdigt worden seid, auch noch der göttlicheren Geheimnisse teilhaftig wurdet. Da es notwendig ist, euch jetzt erhabenere Lehren aufzutragen, wohlan, so wollen wir euch darin genau unterrichten, damit ihr das wertvolle Erlebnis jenes Taufabendes versteht.</p><p>Zuerst tratet ihr in die Vorhalle des Baptisteriums. Nachdem ihr euch gegen Westen aufgestellt hattet, fingt ihr an zu hören.. Dann wurde euch befohlen, die Hand auszustrecken, und ihr widersagtet dem Satan, als wäre er anwesend gewesen.</p><p>In der alten Geschichte — das müßt ihr wissen — ist dieser Vorgang angedeutet. Als Pharao, dieser grausame, rohe Tyrann, das freie, edle Volk der Hebräer knechtete, da sandte Gott den Moses, um sie aus der schlimmen Knechtschaft der Ägypter zu befreien. Mit dem Blute eines Lammes wurden die Türpfosten bestrichen, damit der Verderber an den Häusern vorüberginge, welche das Zeichen des Blutes hatten. Wunderbar war es, wie das Volk der Hebräer befreit wurde. Als der Feind, dieselben auch noch nach ihrer Befreiung verfolgend, sah, wie sich das Meer wunderbar für sie teilte, rückte er trotz allem ihnen auf dem Fuße nach, wurde aber plötzlich in den Wogen des Roten Meeres versenkt.</p><p>[Forts. v. ] Wende dich von der alten Geschichte zur neuen, vom Vorbild zur (vorgebildeten) Wahrheit! Dort wird Moses von Gott nach Ägypten geschickt, hier wird Christus vom Vater in die Welt gesandt. Dort soll (Moses) das bedrückte Volk aus Ägypten führen, hier soll Christus die in der Welt unter der Sünde leidenden Menschen erlösen. Dort hatte das Blut des Lammes den Würger abgewandt, hier vertreibt das Blut des unbefleckten Lammes Jesus Christus die Dämonen. Der erwähnte Tyrann setzte jenem alten Volke nach bis zum Meer; dich verfolgte dieser freche, unverschämte, grundschlechte Dämon noch bis zu der Quelle des Heiles. Jener versank im Meer; dieser verschwindet im Wasser des Heiles.</p><p>Wahrlich, trotz allem hörst du, wie man, die Hand gegen den Dämon ausgestreckt, als wäre er anwesend, erklärt:* „Ich sage mich von dir los, Satan“.*</p><p>Ich will auch auseinandersetzen, warum ihr euch gegen Westen aufstelltet. Es ist notwendig. Da der Westen die Gegend der sichtbaren Finsternis ist, der Satan aber, die Finsternis, in der Finsternis regiert, darum schaut ihr, um dies sinnbildlich auszuprägen, gegen Westen, wenn ihr jenem dunklen, finsteren Herrscher widersaget. Was hat nun jeder von euch stehend gesprochen? „Ich sage mich los von dir, Satan“, von dir, dem schlimmen, grausamsten Tyrannen. Nicht mehr — sagtest du — fürchte ich deine Macht. Denn Christus hat, indem er gleich mir Fleisch und Blut angenommen hat, um dadurch den Tod im Tode abzutun, jene Macht zerstört, damit ich nicht ständig der Knechtschaft unterworfen bin. Ich sage mich los von dir, der schlauen und gar verschmitzten Schlange. Ich sage mich los von dir, dem hinterlistigen Feinde, der unter dem Vorwand der Freundschaft nur Sünden angestiftet und unseren Stammeltern den Abfall bewirkt hat. Ich sage mich los von dir, o Satan, dem Urheber und Diener aller Bosheit.</p><p>[Forts. v. ] Eine zweite Formel lehrt dich sodann sagen:* „und von allen deinen Werken“.* Zu den Werken des Satans gehört jede Sünde. Von ihr muß man sich lossagen, gleichwie der, welcher sich von einem Tyrannen losgesagt hat, auch dessen Waffen vollständig wegwirft. Jede Art von Sünde wird zu den Werken des Teufels gerechnet. Wahrlich, du sollst wissen, daß vor allem das, was du in jener so weihevollen Stunde sagst, eingeschrieben ist in den Büchern Gottes: Wenn du nun etwas tust, was jenen Erklärungen widerspricht, wirst du als wortbrüchig verurteilt werden. Du sagst dich also los von den Werken des Satans, nämlich von allen vernunftwidrigen Handlungen und Gedanken.</p><p>[Forts. v. ] Weiter erklärst du:* „und von allem seinem Gepränge“.* Zu diesem Pomp des Teufels aber gehören Bühnenleidenschaft, Pferderennen, Treibjagden und alle derartigen Eitelkeiten, wovon der Heilige bittet, befreit zu werden, indem er zu Gott spricht:„Wende ab meine Augen, daß sie nichts Eitles schauen!“ Verlange nicht gierig nach den Leidenschaften der Bühne, wo frech und ohne allen Anstand schlüpfrige Schauspiele der Mimen aufgeführt werden und rasende Tänze weibischer Männer!Verlange nicht gierig nach den Leidenschaften derer, welche, um ihren elenden Bauch zu befriedigen, auf der Jagd sich dem Kampfe mit wilden Tieren aussetzen! Sie möchten ihren Bauch füttern, werden aber tatsächlich selbst zur Nahrung im Bauche wilder Tiere im Kampfe — um es richtig zu sagen — für ihren Gott, den Bauch. Meide auch die Pferderennen, das rasende Schauspiel, wo Seelen stürzen! All das gehört zum Gepränge des Teufels.</p><p>Auch das, was in Götzentempeln und auf festlichen Märkten aufgehängt ist, sei es Fleisch oder Brot oder anderes dergleichen, gehört, weil durch Anrufung der unreinen Dämonen beschmutzt, zum Pompe des Teufels. Gleichwie nämlich das Brot und der Wein der Eucharistie vor der Anrufung der heiligen, anbetungswürdigen Dreifaltigkeit gewöhnliches Brot und gewöhnlicher Wein ist, nach der Anrufung aber das Brot zum Leibe Christi und der Wein zum Blute Christi wird, ebenso werden solche Eßwaren vom Pompe des Satans, obwohl sie von Natur aus gewöhnliche Dinge sind, durch die Anrufung der Dämonen unrein.</p><p>[Forts. v. ] Hierauf sagst du:* „und deinem Dienste“*. Teufelsdienst aber ist das Beten in den Götzentempeln und, was zur Ehre der leblosen Götterbilder geschieht, das Anzünden der Lampen oder das Räuchern an Quellen oder Flüssen; denn manche sind, von Träumen oder Dämonen getäuscht, dahingegangen und meinten, Heilung in ihren körperlichen Leiden zu finden. Gib dich damit nicht ab! Beobachtung des Vogelfluges, Wahrsagerei, Zeichendeuterei, Amulette, beschriebene Täfelchen, Zauber- oder andere böse Künste und, was es dergleichen gibt, gehören zum Teufelsdienst. Meide sie! Würdest du, nachdem du dich vom Satan losgesagt und für Christus verpflichtet hast, in diese Sünden fallen, dann bekämst du noch mehr die Bitterkeit des Tyrannen zu erfahren, den du jetzt sehr erbitterst, zumal wenn er dich einst als Freund geehrt und dich vor seiner bitteren Knechtschaft bewahrt hatte. Christi würdest du beraubt werden und den Satan bekämst du zu fühlen.</p><p>Hast du nicht gehört, was uns die alte Geschichte über Lot und seine Töchter berichtet? Ist er nicht mit seinen Töchtern, nachdem er den Berg erreicht hatte, gerettet worden, während sein Weib zu einer Salzsäule wurde, ein Denkmal für ewige Zeit, eine Erinnerung an ihr unseliges Verlangen und Umschauen. Habe acht auf dich! Wenn du die Hand an den Pflug gelegt hast, wende dich nicht wieder um nach dem salzigen Treiben dieses Lebens! Fliehe vielmehr auf den Berg zu Jesus Christus, dem Stein, der ohne menschliches Zutun sich losgerissen und den Erdkreis erfüllt hat!</p><p>Wenn du dich nun vom Satan lossagst und den ganzen Bund mit ihm, die alten Verträge mit der Hölle, vollständig auflösest, dann öffnet sich dir das Paradies Gottes, welches er gegen Osten gepflanzt hatte, woraus aber unser Stammvater seiner Sünde wegen vertrieben worden war. Zum Zeichen dafür wandtest du dich von Westen nach Osten, der Gegend des Lichtes. Dann wurde dir befohlen, zu sagen: „Ich glaube an den Vater und an den Sohn und an den Hl. Geist und an* eine* Taufe der Buße.“ Darüber wurde in den früheren Katechesen, wie es die Gnade Gottes gegeben hat, ausführlich zu dir gesprochen.</p><p>[Forts. v. ] Stelle dich durch diese Worte (des Glaubens) sicher und sei wachsam! Denn unser „Widersacher, der Teufel, geht“ — wie vorhin vorgelesen wurde — “wie ein Löwe umher und sucht, wen er verschlingen könne“. Zuvor hatte wahrlich der Tod noch die Macht und verschlang. Im heiligen Bade der Wiedergeburt aber „trocknete Gott jede Träne in jedem Angesicht“. Denn da du den alten Menschen ausgezogen hast, trauerst du nicht mehr; vielmehr bist du in festlicher Stimmung, da du das Gewand des Heiles, Jesus Christus, angezogen hast.</p><p>[Forts. v. ] Was ich da erwähnte, geschah in dem äußeren Hause. Wenn wir bei den folgenden Erklärungen der Geheimnisse in das Allerheiligste eintreten, dann werden wir, so Gott will, dort die Bedeutung der daselbst (═ im Baptisterium) sich vollziehenden Handlungen kennen lernen.</p><p>Gott dem Vater sei Ehre, Herrschaft, Herrlichkeit mit dem Sohne und dem Hl. Geiste in alle Ewigkeit. Amen.II. MYSTAGOGISCHE KATECHESE Über die Taufe</p><h2>2</h2><p>* Lesung aus dem Briefe an die Römer von der Stelle: „Oder wisset ihr nicht, daß wir alle, die wir in Christus Jesus getauft wurden, in seinen Tod getauft wurden?“ bis zu den Worten: „Denn ihr seid nicht unter dem Gesetze, sondern unter der Gnade“*.</p><p>Die jetzigen täglichen mystagogischen Lehren, welche auf die letzten Vorgänge eingehen, sind wertvoll für uns, ganz besonders aber für euch, die ihr aus dem Alter in die Neuheit erneuert worden seid. Notwendig ist es daher, dem gestrigen mystagogischen Vortrag für euch eine Fortsetzung zu geben. Ihr sollt die Bedeutung dessen lernen, was ihr in dem inneren Hause getan habt.</p><p>Gleich nachdem ihr eingetreten wart, habt ihr euch entkleidet. Dadurch war versinnbildet, daß ihr den alten Menschen mit seinen Handlungen ausgezogen habt. Nachdem ihr die Kleider abgelegt hattet, waret ihr nackt. Auch hierin habt ihr Christus nachgeahmt, der da am Kreuze entblößt worden war und durch seine Entblößung die Herrschaften und Mächte bloßgestellt hatte, indem er am Kreuze offen über sie triumphierte. Weil nämlich in euren Gliedern die feindlichen Mächte hausten, dürft ihr nimmermehr jenes alte Kleid tragen. Ich meine durchaus nicht dieses sichtbare Kleid, sondern „den alten, von trügerischen Begierden verderbten Menschen“. Die Seele möge diesen, wenn sie ihn einmal ausgezogen hat, nicht wieder anziehen, sondern wie die Braut Christi im Hohen Liede sprechen: „Ich habe mein Kleid ausgezogen, wie soll ich es anziehen?“ Merkwürdig! Ihr waret nackt vor den Augen aller und schämtet euch nicht. Ihr waret in der Tat dem ersten Menschen Adam gleich, der im Paradiese nackt war und sich nicht schämte.</p><p>[Forts. v. ] Als ihr entkleidet wart, wurdet ihr mit exorzisiertem Öle vom Scheitel bis zu unterst gesalbt und erhieltet Anteil an dem edlen Ölbaum Jesus Christus. Ihr wurdet nämlich vom wilden Ölbaum abgeschnitten und auf den edlen Ölbaum aufgepfropft und erhieltet Anteil an der Fettigkeit des wahren Ölbaumes. Das exorzisierte Öl versinnbildete also die Teilnahme an der Fettigkeit Christi; es vertrieb jede Spur feindlicher Kraft. Gleichwie das Anblasen der Heiligen und die Anrufung des Namens Gottes gleich der heftigsten Flamme die Dämonen brennt und vertreibt, so vermag dieses exorzisierte Öl durch die Anrufung Gottes und durch Gebet nicht nur die Spuren der Sünden auszubrennen und wegzuwischen, sondern auch alle unsichtbaren Mächte des Bösen zu vertreiben.</p><p>Hierauf wurdet ihr zum heiligen Bade der göttlichen Taufe geführt, wie Christus vom Kreuze weg zu dem in der Nähe gelegenen Grabe gebracht wurde. Und jeder einzelne wurde gefragt, ob er an den Namen des Vaters und des Sohnes und des Hl. Geistes glaube. Jeder legte das heilsame Bekenntnis ab und tauchte dreimal in das Wasser unter und wieder auf, hierdurch das dreitägige Begräbnis Christi sinnbildlich andeutend. Wie nämlich unser Heiland drei Tage und drei Nächte im Schoße der Erde verbrachte, so stiegt ihr das erste Mal empor, um den ersten Tag Christi unter der Erde anzudeuten, und tauchtet unter, um die Nacht darzustellen. Wie man nämlich bei Nacht nicht mehr sieht, bei Tag aber im Lichte wandelt, so saht ihr beim Untertauchen nichts wie bei Nacht, während es euch beim Emporsteigen Tag wurde. Im gleichen Augenblick starbt ihr und wurdet ihr geboren; jenes heilsame Wasser wurde für euch zugleich Grab und Mutter. Was Salomon bei anderer Gelegenheit gesagt hat, mag für euch passen. Er sagte dereinst: „Eine Zeit des Gebärens und eine Zeit des Sterbens“. Bei euch heißt es allerdings umgekehrt: eine Zeit des Sterbens und eine Zeit des Geborenwerdens. Eine einzige Zeit wirkt das eine wie das andere: zugleich mit eurem Tode erfolgte eure Geburt.</p><p>[Forts. v. ] Etwas Ungewöhnliches und Wunderbares! Eigentlich sind wir nicht gestorben, eigentlich wurden wir nicht begraben. Wir sind auferstanden, ohne eigentlich gekreuzigt worden zu sein. Es sind (nur) Bilder, Nachahmungen. Doch Tatsache ist die Erlösung. Tatsächlich ist Christus gekreuzigt worden, tatsächlich ist er begraben worden, wahrhaft ist er auferstanden. Alle diese Gnaden hat er uns geschenkt, damit wir, wenn wir durch Nachahmung an seinen Leiden teilhaben, in Wahrheit das Heil gewinnen. O überströmende Liebe zu den Menschen! Christus hat an seinen makellosen Händen und Füßen die Nägel empfangen und Schmerzen erduldet, und mir, der ich keine Schmerzen und Mühsale hatte, schenkt er auf Grund der Teilnahme an seinem Schmerz die Erlösung.</p><p>Niemand glaube, der Zweck der Taufe sei nur Nachlassung der Sünden und Verleihung der Sohnschaft, wie die Taufe des Johannes nur Nachlassung der Sünden wirkte. Man möge sich genau merken, daß die Taufe nicht nur von Sünden reinigt und die Gabe des Hl. Geistes verleiht, sondern auch ein Abbild der Leiden Christi ist. Daher hat Paulus soeben ausgerufen: „Oder wisset ihr nicht, daß wir alle, die wir in Christus Jesus getauft wurden, in seinen Tod getauft wurden? Mit ihm wurden wir begraben durch die Taufe in den Tod“. Damit wandte er sich gegen die Behauptung, die Taufe verleihe Sündennachlaß und Sohnschaft, nicht aber sei sie durch Nachahmung auch Teilnahme an den wahren Leiden Christi.</p><p>[Forts. v. ] Damit wir lernen, daß Christus alles, was er litt, unsertwegen, um unseres Heiles willen, in Wahrheit und nicht zum Scheine gelitten hat, und daß wir teilnehmen an seinen Leiden, rief Paulus mit aller Deutlichkeit aus: „Wenn wir nämlich eingepflanzt worden sind der Ähnlichkeit mit seinem Tode, werden wir es auch sein mit seiner Auferstehung“. Mit Recht heißt es „eingepflanzt“, weil nämlich hier der wahre Weinstock gepflanzt worden ist und wir ihm eingepflanzt werden durch die in der Taufe erfolgende Teilnahme an seinem Tode. Achte genau auf die Worte des Apostels! Nicht sagte er: „wenn wir nämlich eingepflanzt worden sind dem Tode“, sondern: „der Ähnlichkeit mit seinem Tode“. In der Tat erhielt nämlich der Tod Gewalt über Christus, denn tatsächlich trennte sich seine Seele von seinem Leibe. Wirklichkeit war auch das Grab; denn in reine Leinwand wurde sein heiliger Leib gewickelt. Überhaupt seine ganze Geschichte ist Wirklichkeit. Das Leiden und Sterben unsererseits aber ist (nur) Ähnlichkeit. Die Erlösung allerdings ist nicht Ähnlichkeit, sondern Wahrheit.</p><p>[Forts. v. ] Worüber ihr zur Genüge belehrt worden seid, das behaltet — bitte — im Gedächtnis, damit ich, obwohl unwürdig, von euch sagen kann: Ich liebe euch, weil ihr alle Zeit „meiner gedenket und an den Überlieferungen, welche ich euch gegeben habe, festhaltet“.</p><p>Gott, der euch aus dem Tode zum Leben erweckt hat, vermag euch die Gnade zu geben, „in der Neuheit des Lebens zu wandeln“, denn ihm ist Ehre und Herrlichkeit jetzt und in alle Ewigkeit. Amen.III. MYSTAGOGISCHE KATECHESE Über die Firmung</p><h2>3</h2><p>* Lesung aus dem ersten katholischen Briefe des Johannes von den Worten: „und ihr habt die Salbung von Gott und wisset alles“ bis zu der Stelle: „damit wir von ihm nicht beschämt werden bei seiner Ankunft“*.</p><p>Da ihr in Christus getauft worden seid und Christum angezogen habt, seid ihr dem Sohne Gottes gleichförmig geworden. Da uns Gott zur Annahme an Kindesstatt vorherbestimmt hat, hat er uns dem verherrlichten Leibe Christi gleichförmig gemacht. Nachdem ihr nun an dem Gesalbten Anteil erhalten habt, werdet ihr mit Recht Gesalbte genannt. Von euch hat Gott gesagt: „Vergreifet euch nicht an meinen Gesalbten!“ Gesalbte aber seid ihr geworden, weil ihr das Abbild* (ἀντίτυπον)* [antitypon] des Geistes empfangen habt. Alles ist bildlich an euch vorgenommen worden, weil ihr Bilder Christi seid.</p><p>Als Christus bei der Taufe im Jordan den Wassern vom Wohlgeruch seiner Gottheit mitgeteilt hatte, stieg er heraus, und der Hl. Geist kam persönlich auf ihn herab, so daß der Gleiche auf dem Gleichen ruhte. So wurde euch, als ihr dem heiligen Bade entstiegen waret, die Salbung gegeben, ein Abbild* (ἀντίτυπον)* [antitypon] jener Salbung, welche Christus empfangen hatte. Diese ist der Hl. Geist, von welchem der selige Isaias in seiner Prophetie im Namen des Herrn gesagt hatte: „Der Geist des Herrn ist auf mir, weil er mich gesalbt hat; den Armen das Evangelium zu verkünden, hat er mich gesandt“.</p><p>[Forts. v. ] Christus ist nicht mit irdischem Öle oder irdischer Salbe von Menschen gesalbt worden, sondern sein Vater, der ihn zum Erlöser der ganzen Welt vorherbestimmt hatte, hat ihn mit dem Hl. Geiste gesalbt. Denn Petrus sagt: „Jesum von Nazareth hat Gott mit dem Hl. Geiste gesalbt“. Und der Prophet David rief aus: „Dein Thron, o Gott, ist in alle Ewigkeit. Ein Szepter der Gerechtigkeit ist das Szepter deiner Herrschaft. Du liebst Gerechtigkeit und hassest das Unrecht. Darum salbte dich Gott, dein Gott, mit dem Öle der Freude zur Auszeichnung vor deinen Genossen“. Wie Christus in Wirklichkeit gekreuzigt und begraben wurde und auferstand, während ihr in der Taufe gewürdigt werdet, in „Ähnlichkeit“ mit ihm gekreuzigt und begraben zu werden und aufzuerstehen, so ist es auch bei der Firmung. Während Christus mit dem geistigen Öl der Freude gesalbt wurde, d. i. mit dem Hl. Geist, der als Quelle der geistigen Freude das Öl der Freude heißt, wurdet ihr mit Salbe* (μύρον)* [myron] gesalbt, nachdem ihr Teilnehmer und Genossen Christi geworden waret.</p><p>Doch darfst du ja nicht meinen, jene Salbe sei nur Salbe. Denn gleichwie das Brot der Eucharistie nach der Anrufung des Hl. Geistes nicht mehr gewöhnliches Brot ist, sondern der Leib Christi, so ist diese heilige Salbe nach der Anrufung nicht mehr einfache Salbe und nicht, wie man sagen möchte, gemein, vielmehr ist sie Gnade Christi und wirkt durch die Gegenwart von Christi Gottheit den Hl. Geist. Mit der Salbe werden dir die Stirne und die übrigen Sinne gesalbt in sinnbildlicher Weise. Mit irdischer Salbe wird der Körper gesalbt, mit dem heiligen, lebenspendenden Geiste wird die Seele geheiligt.</p><p>[Forts. v. ] Zuerst wurdet ihr auf die Stirne gesalbt, um von der Schande, welche der erste sündige Mensch überallhin trug, befreit zu werden und um „die Herrlichkeit des Herrn mit unverhülltem Antlitz widerzuspiegeln“. Darauf wurdet ihr an den Ohren gesalbt, damit ihr Ohren erhieltet, welche die göttlichen Geheimnisse hören, Ohren, von welchen Isaias sagte: „Und der Herr gab mir ein Ohr zu hören“, und der Herr Jesus in den Evangelien sprach: „Wer Ohren hat zu hören, der höre!“ Sodann wurdet ihr an der Nase gesalbt, damit ihr nach Empfang der göttlichen Salbe saget: „Christi Wohlgeruch sind wir für Gott unter den Geretteten“. Hierauf wurdet ihr auf der Brust gesalbt, damit ihr, „angetan mit dem Panzer der Gerechtigkeit“, „gegen die Schliche des Teufels fest stehet“. Gleichwie Jesus nach der Taufe und nach der Herabkunft des Hl. Geistes hinausging (in die Wüste) und den Widersacher bekämpfte, so sollt ihr nach der heiligen Taufe und nach der geistigen Salbung, angetan mit der ganzen Waffenrüstung des Hl. Geistes, euch der feindlichen Macht entgegenstellen und sie bekämpfen und sagen: „Alles vermag ich in Christus, der mich stärkt“.</p><p>Dieser heiligen Salbung gewürdigt, werdet ihr Christen genannt; eure Wiedergeburt bestätigt die Richtigkeit des Namens. Ehe ihr dieser Gnade gewürdigt wurdet, verdientet ihr eigentlich nicht diese Bezeichnung, ihr waret vielmehr erst auf dem Wege dazu, schicktet euch erst an, Christen zu sein.</p><p>[Forts. v. ] Ihr sollt wissen, daß in der Alten Schrift diese Salbung vorgebildet ist. Als nämlich Moses den Auftrag Gottes seinem Bruder mitteilte und ihn zum Hohenpriester bestellte, wusch er ihn mit Wasser und salbte ihn hierauf, und er wurde Gesalbter genannt infolge der offenbar vorbildlichen Salbung. Als der Hohepriester Salomon zum König erhob, salbte er ihn zu Gibon nach vorangegangener Waschung. Was an diesen Männern geschah, war Vorbild; was an euch geschah, ist nicht Vorbild, sondern Wahrheit. Denn in Wahrheit seid ihr gesalbt worden vom Hl. Geist. Der Anfang eures Heiles ist Christus; er ist wahrhaft das Erstlingsbrot, während ihr die Masse des Teiges seid. Wenn aber das Erstlingsbrot heilig ist, dann geht offenbar die Heiligkeit auf die Masse über.</p><p>Bewahret diese Gnade unbefleckt! Denn sie wird euch, wenn sie euch bleibt, alles lehren, wie ihr vorhin von dem heiligen Johannes gehört habt, der uns viele weise Lehren über die Firmung gibt. Diese heilige Gabe ist ein geistiges Schutzmittel für den Leib und Rettung der Seele.</p><p>Auf die Firmung hat schon der selige Isaias in alten Zeiten prophetisch hingewiesen, wenn er sagt: „Es wird der Herr an allen Völkern dies auf dem Berge wirken: sie werden Wein trinken, Freude trinken, mit Salbe gesalbt werden“; als Berg bezeichnet der Prophet die Kirche auch an einer anderen Stelle, wo er sagt: „In den letzten Tagen wird der Berg des Herrn sichtbar sein“. Um dich von ihm überzeugen zu lassen, höre auf das, was er über diese geistige Salbung spricht: „Gib dies alles den Völkern; denn es ist der Ratschluß des Herrn über alle Völker!“</p><p>Da ihr mit dieser heiligen Salbe gefirmt seid, so bewahret sie fleckenlos und rein in euch, indem ihr im Guten fortschreitet und dem Urheber eures Heiles, Christus Jesus, dankbar werdet, dem die Ehre sei in alle Ewigkeit. Amen.IV. MYSTAGOGISCHE KATECHESE Über den Leib und das Blut Christi</p><h2>4</h2><p>* Lesung aus dem Briefe Pauli an die Korinther: „Ich habe von dem Herrn empfangen, was ich auch euch überliefert habe usw.“*.</p><p>Schon diese Lehre des heiligen Paulus genügt, euch von der Wahrheit der göttlichen Geheimnisse völlig zu überzeugen, durch welche ihr gewürdigt wurdet,* ein* Leib und* ein* Blut mit Christus zu werden. Soeben rief euch nämlich Paulus zu: „In der Nacht, da unser Herr Jesus Christus verraten wurde, nahm er Brot, dankte, brach es und gab es seinen Jüngern mit den Worten: nehmet hin und esset, das ist mein Leib! Und er nahm den Kelch, dankte und sprach: nehmet hin und trinket, das ist mein Blut!“ Da er nun selbst vom Brote ausdrücklich erklärte „das ist mein Leib“, wer wird es wagen, noch zu zweifeln? Und da er selbst versicherte „das ist mein Blut“, wer wird je Bedenken haben und sagen, es sei nicht sein Blut?</p><p>[Forts. v. ] Wenn Jesus einst zu Kana in Galiläa durch seinen (b0loßen) Wink Wasser in Wein verwandelt hat, soll ihm dann nicht zuzutrauen sein, daß er Wein in Blut verwandelt hat? Wenn Jesus, zu irdischer Hochzeit geladen, dieses seltsame Wunder gewirkt hat, soll man dann nicht noch viel mehr zugeben, daß er den Söhnen des Brautgemaches seinen Leib und sein Blut zum Genusse dargeboten hat?</p><p>Aus voller Glaubensüberzeugung wollen wir also am Leibe und Blute Christi teilnehmen! In der Gestalt des Brotes wird dir nämlich der Leib gegeben, und in der Gestalt des Weines wird dir das Blut gereicht, damit du durch den Empfang des Leibes und Blutes Christi* ein* Leib und* ein* Blut mit ihm werdest. Durch diesen Empfang werden wir Christusträger; denn sein Fleisch und sein Blut kommt in unsere Glieder. Durch diesen Empfang werden wir, wie der heilige Petrus sagte, der göttlichen Natur teilhaft.</p><p>[Forts. v. ] In einem Disput mit den Juden sagte Christus einmal: „Wenn ihr mein Fleisch nicht esset und mein Blut nicht trinket, habt ihr das Leben nicht in euch“. Jene nahmen, da ihnen beim Hören der Worte der Geist fehlte, Ärgernis und gingen fort; denn sie meinten, er halte sie zu fleischlichen Gerichten an.</p><p>[Forts v. ] Im Alten Bunde hatte man Schaubrote. Doch diese Brote des Alten Bundes hatten ein Ende. Im Neuen Bunde aber gibt es ein himmlisches Brot und einen Kelch des Heiles; sie heiligen Seele und Leib. Während das (Schau)brot dem Körper entspricht, entspricht der Logos der Seele.</p><p>[Forts. v. ] Betrachte daher Brot und Wein nicht als rein irdische Dinge! Denn nach der Versicherung des Herrn sind sie Leib und Blut Christi. Wenn dich auch die Sinne hier im Stiche lassen: der Glaube möge dir Festigkeit geben! Nicht nach dem Geschmack darfst du hier urteilen, der Glaube muß dir die zweifellose Sicherheit geben, daß du des Leibes und Blutes Christi gewürdigt wurdest.</p><p>Der selige David deutet dir die Kraft (von Brot und Wein) an, wenn er sagt: „Du hast vor meinen Augen den Tisch gedeckt gegenüber denen, welche mich bedrängen“. Der Sinn der Worte ist: „Ehe du erschienen bist, hatten die Dämonen den Menschen den Tisch gedeckt, und zwar einen schmutzigen, unreinen, reich an teuflischer Macht. Nachdem du aber erschienen bist o Herr, hast du vor meinen Augen den Tisch gedeckt.“ Wenn der Mensch zu Gott spricht: „Du hast vor meinen Augen den Tisch gedeckt“, was meint er darunter anders als den mystischen, geistigen Tisch, welchen uns Gott gedeckt hat gegenüber den Dämonen, d. h. zum Kampfe gegen die Dämonen? Und so ist es in der Tat. Denn während jener Tisch die Gemeinschaft mit den Dämonen verlieh, verleiht dieser die Gemeinschaft mit Gott. „Mit Öl hast du mein Haupt gesalbt.“ Mit Öl hat er die Stirne deines Hauptes gesalbt, damit Gott dich besiegle und du „ein Ausdruck der Besiegelung, ein Heiligtum Gottes“ werdest. „Und wie kostbar ist dein Kelch, der mich berauscht!“ Wie du siehst, ist hier von dem Kelch die Rede, welchen Jesus in seine Hand nahm, um zu danken und zu sagen: „Dies ist mein Blut, das für viele vergossen wird zur Vergebung der Sünden“.</p><p>Um auf diese Gnade hinzuweisen, sagt ferner Salomon im Prediger: „Komm! Iß in Freuden dein Brot“, das geistige Brot! „Komme — eine heilbringende, seligmachende Einladung! — trinke mit frohem Herzen deinen Wein“, den geistigen Wein! „Und Öl werde ausgegossen über dein Haupt!“ Wie du siehst, deutet er auch die mystische Salbung an. „Und stets seien deine Gewänder weiß, denn der Herr hatte Wohlgefallen an deinem Tun!“ Ehe du nämlich zu der Gnade hinzutratest, war dein Tun Eitelkeit der Eitelkeiten. Nachdem du aber die alten Kleider ausgezogen und die geistigen weißen Kleider angezogen hast, mußt du stets weiß gekleidet sein. Keineswegs sagen wir, daß du immer weiße Kleider tragen sollst.Vielmehr behaupten wir, daß du mit den wahrhaft weißen und glänzenden, den geistigen Kleidern angetan sein sollst. Mit dem seligen Isaias sollst du sagen können: „Meine Seele frohlocke in dem Herrn; denn er kleidete mich mit dem Gewande des Heiles und umgab mich mit dem Kleide der Freude“.</p><p>[Forts. v. ] Da du es nun weißt und davon überzeugt bist, daß das, was als Brot erscheint und den Geschmack von Brot hat, doch nicht Brot ist, sondern Christi Leib, und daß das, was als Wein erscheint und den Geschmack von Wein hat, doch nicht Wein ist, sondern Christi Blut, und da David hierüber in den Psalmen einstens gesagt hat: „Und das Brot stärkt des Menschen Herz, so daß er mit Öl sein Angesicht erheitert“, darum genieße von dem geistigen Brote und stärke dein Herz und erheitere das Antlitz deiner Seele! Möchtest du durch reines Gewissen dein Gesicht unverhüllt erhalten, die Herrlichkeit des Herrn widerspiegeln und von Herrlichkeit zu Herrlichkeit schreiten in Christus Jesus, unserem Herrn! Ihm sei Ehre, Macht und Herrlichkeit in alle Ewigkeit. Amen.V. MYSTAGOGISCHE KATECHESE</p><h2>5</h2><p>Lesung aus dem katholischen Briefe Petri: „Daher leget ab alle Unreinigkeit und allen Trug und Verleumdung usw.“.</p><p>In den vorausgehenden Versammlungen habt ihr dank der Güte Gottes genug über die Taufe, die Firmung und den Empfang des Leibes und Blutes Christi erfahren. Nun ist es noch notwendig, zu dem Folgenden überzugehen. Wir werden heute dem geistigen Bau eures Heiles den krönenden Abschluß geben.</p><p>Ihr habt gesehen, wie der Diakon dem Zelebranten und den den Altar Gottes im Kreise umgebenden Priestern das Wasser zum Waschen reicht. Er reichte es aber keineswegs zur Abwaschung körperlichen Schmutzes. Dazu dient es nicht. Denn körperlich beschmutzt traten wir nicht einmal ehedem in die Kirche. Die Handwaschung ist ein Symbol, daß ihr von allen Sünden und Ungerechtigkeiten rein sein sollt. Da nämlich durch die Hand das Handeln versinnbildet wird, so deuten wir selbstverständlich durch die Handwaschung an, daß unser Handeln rein und unbefleckt ist. Hast du nicht das Wort des seligen David gehört, in welchem er auf eben dieses Geheimnis hinweist: „Unter den Unschuldigen werde ich meine Hände waschen und werde deinen Altar umgeben, o Herr“? Die Handwaschung ist also ein Symbol der Sündenreinheit.</p><p>[Forts. v. ] Hierauf ruft der Diakon: „Gebet euch einander hin und geben wir einander den Kuß!“ Nicht darfst du glauben, dieser Kuß sei der Art, wie ihn gewöhnliche Freunde auf dem Marktplatz zu geben pflegen! Solcher Art ist er nicht. Dieser Kuß verbindet die Seelen miteinander und gelobt, alles Unrecht zu vergessen. Der Kuß ist ein Zeichen der Seelenvereinigung und der Verzeihung jeglichen Unrechts. Daher sagte Christus: „Wenn du deine Gabe an den Altar bringst und dich daselbst erinnerst, daß dein Bruder etwas wider dich hat, so lasse deine Gabe am Altare, gehe zuerst hin und versöhne dich mit deinem Bruder! Alsdann komme und opfere deine Gabe!“ Der Kuß ist also Versöhnung und deshalb heilig. Der heilige Paulus rief ja einmal: „Grüßet einander mit heiligem Kusse!“Und Petrus schreibt: „mit dem Kusse der Liebe“.</p><p>Sodann ruft der Zelebrant: „Himmelwärts die Herzen!“ Wahrlich, in jener schauererregenden Stunde soll das Herz aufwärts zu Gott gerichtet sein und nicht abwärts zur Erde und den irdischen Geschäften. Eindringlich befiehlt also der Priester in jener Stunde, alle sollen die Kümmernisse des Lebens und die häuslichen Sorgen beiseite lassen und ihr Herz bei dem barmherzigen Gott im Himmel haben.</p><p>Eure Antwort lautet hierauf: „Wir erheben sie zum Herrn“. Durch dieses Bekenntnis gebt ihr dem Priester eure Zusage. Keiner der Beteiligten spreche aber mit dem Munde „Wir erheben sie zum Herrn“, während seine Gedanken bei den Sorgen des Lebens weilen! Zwar sollte man immer an Gott denken; doch wenn dies wegen der menschlichen Schwäche unmöglich ist, muß man sich wenigstens zu jener Stunde darum bemühen.</p><p>[Forts. v. ] Hierauf sagt der Priester: „Lasset uns dem Herrn Dank sagen!“ Fürwahr, wir müssen Dank sagen, da er uns, obwohl wir unwürdig waren, zu solcher Gnade berufen, da er uns, die wir Feinde waren, versöhnt, da er uns des Geistes der Kindschaft gewürdigt hat. Ihr entgegnet: „Es ist würdig und gerecht.“ Wenn wir nämlich Dank sagen, tun wir etwas, was würdig und gerecht ist. Wenn aber Gott uns Gutes tat und uns solcher Wohltaten würdigte, so erfüllte er nicht eine Forderung der Gerechtigkeit, sondern handelte darüber hinaus.</p><p>Sodann denken wir an Himmel und Erde und Meer, an Sonne, Mond und Sterne, an die ganze vernünftige und unvernünftige, sichtbare und unsichtbare Schöpfung, an Engel, Erzengel, Kräfte, Mächte, Herrschaften, Gewalten, Throne und an die vieläugigen Cherubim und sprechen mit Nachdruck das Wort Davids&gt; „Preiset den Herrn mit mir!“ Wir denken auch an die Seraphim, welche Isaias im Hl. Geiste den Thron Gottes umstehen sah, welche mit zwei Flügeln das Angesicht, mit zwei Flügeln die Füße verhüllen und mit zwei Flügeln fliegen und welche sprechen: Heilig, heilig, heilig ist der Herr Sabaoth. Wir sprechen diese von den Seraphim her uns überlieferte göttliche Lobpreisung, um an dem Lobgesang der überirdischen Heerscharen teilzunehmen.</p><p>Nachdem wir uns durch diese geistigen Lobgesänge geheiligt haben, rufen wir die Barmherzigkeit Gottes an, daß er den Hl. Geist auf die Opfergaben herabsende, um das Brot zum Leibe Christi, den Wein zum Blute Christi zu machen. Denn was der Hl. Geist berührt, ist völlig geheiligt und verwandelt.</p><p>[Forts. v. ] Nach Vollendung des geistigen Opfers, des unblutigen Gottesdienstes, rufen wir über jenes Opfer der Versöhnung Gott an um den allgemeinen Frieden der Kirchen, um Ruhe und Ordnung im politischen Leben, für die Kaiser, für das Heer und die Bundesgenossen, für die Kranken und die Bedrückten. Kurz, wir alle beten überhaupt für alle, die der Hilfe bedürfen, und bringen für sie dieses Opfer dar.</p><p>[Forts. v. ] Alsdann gedenken wir derer, die bereits entschlafen sind, vor allem der Patriarchen, Propheten, Apostel, Märtyrer, damit Gott durch deren Gebete und Fürbitten unser Flehen erhöre. Dann beten wir für die bereits entschlafenen heiligen Väter und Bischöfe und überhaupt für alle unsere Verstorbenen. Wir glauben nämlich, daß die Seelen, für welche während des heiligen, erhabensten Opfers gebetet wird, sehr großen Nutzen davon haben.</p><p>Um euch davon zu überzeugen, will ich euch ein Beispiel geben. Denn gewiß erklären viele: „Was soll es einer Seele, welche mit Sünden aus dieser Welt geschieden ist oder ohne Sünden, nützen, wenn ihrer während des Opfers gedacht wird?“ Nehmen wir an: es haben sich einige gegen ihren König vergangen und wurden deshalb von ihm in die Verbannung geschickt; deren Angehörige aber flechten nun einen Kranz und bringen ihn dem König, um Fürbitte für die Bestraften einzulegen. Wird der König ihnen nicht etwa die Strafe nachlassen? Ebenso ist es bei uns. Wir bringen Gott für die Verstorbenen, trotzdem sie Sünder waren, unsere Gebete dar. Wir winden keinen Kranz, sondern opfern den für unsere Sünden geschlachteten Christus. Dadurch versöhnen wir den barmherzigen Gott mit ihnen und mit uns.</p><p>[Forts. v. ] Nach jener Fürbitte sprechen wir das Gebet, welches der Heiland seine eigenen Jünger gelehrt hat. Mit reinem Herzen bezeichnen wir Gott als unseren Vater und beten: „Vater unser, der du bist in den Himmeln.“ Wie groß ist Gottes Liebe zu den Menschen! Denen, welche von ihm abgefallen sind und sich in die schwersten Sünden gestürzt haben, gibt er in einer Weise Verzeihung der Sünden und Teilnahme an der Gnade, daß er sich geradezu Vater nennen läßt. „Vater unser, der du bist in den Himmeln.“ Unter den „Himmeln“ dürften auch jene zu verstehen sein, welche ein Abbild des Himmels sind und in welchen Gott wohnt und wandelt.</p><p>[Forts. v. ] „Geheiliget werde dein Name!“ Heilig ist der Name Gottes schon seiner Natur nach, gleichviel, ob wir so beten oder nicht. Da aber sein Name durch die Sünder gelästert wird gemäß dem Worte: „Euretwegen wird mein Name ständig von den Heiden gelästert“, beten wir, daß der Name Gottes durch uns geheiligt wird. Nicht beten wir, daß er aus dem Nichtheiligsein zum Heiligsein gelange, sondern daß er in uns heilig werde, sofern wir uns heiligen und heilige Werke verrichten.</p><p>[Forts. v. ] „Es komme dein Reich!“ Nur eine reine Seele kann mit Zuversicht sprechen: „Es komme dein Reich!“ Wer auf das Wort Pauli hört: „Nicht herrsche also die Sünde in eurem sterblichen Leibe!“, wer in seinem Handeln, Denken und Reden sich rein gehalten hat, wird zu Gott sagen: „Es komme dein Reich!“</p><p>„Dein Wille geschehe wie im Himmel also auch auf Erden!“ Die göttlichen, heiligen Engel Gottes tun Gottes Willen. Denn der Psalmist David sagte: „Preiset den Herrn, alle seine Engel, ihr Mächtigen, die ihr seinen Willen tut!“ Durch dein Gebet bekennst du es laut: Wie von den Engeln dein Wille geschieht, so soll er, o Herr, auf Erden von mir geschehen!</p><p>[Forts. v. ] „Gib uns heute unser zum Wesen gehörendes Brot!“ Unser gewöhnliches Brot gehört nicht zum Wesen, aber dieses heilige Brot gehört zum Wesen, d. i. zum Wesen der Seele. Dieses Brot kommt nicht „in den Magen und findet seinen natürlichen Ausgang“, es verteilt sich vielmehr in dein ganzes Wesen zum Nutzen von Leib und Seele. — Das Wörtchen „heute“ bedeutet so viel als „tagtäglich“; denn Paulus sagte: „so lange es heute heißt“.</p><p>[Forts. v. ] „Und vergib uns unsere Schulden, wie auch wir vergeben unseren Schuldigern!“ Zahlreich sind unsere Sünden. Wir verfehlen uns in Worten und in Gedanken und tun sehr viel Verdammungswürdiges. Würden wir sagen, daß wir keine Sünden haben, dann lügen wir, wie Johannes erklärt. Es ist ein Vertrag mit Gott, wenn wir beten, er möge uns unsere Sünden verzeihen, wie wir unsererseits dem Nächsten die Schulden erlassen. Bedenken wir nun, wofür wir so große Nachsicht erhalten, und säumen wir doch nicht länger, einander zu verzeihen! Die Verfehlungen gegen uns sind klein, unbedeutend und leicht gut zu machen, während unsere Beleidigungen Gottes groß sind und nur von Gottes Barmherzigkeit erlassen werden können. Habe acht, daß du dir nicht etwa wegen der kleinen, unbedeutenden Beleidigungen, die du erfahren hast, die göttliche Verzeihung deiner gar schweren Sünden verschließest!</p><p>„O Herr, führe uns nicht in Versuchung!“ Lehrt uns etwa der Herr, wir sollen beten, daß wir überhaupt nicht versucht werden? Wie könnte dann an anderer Stelle gesagt sein: „Ein Mann, der nicht versucht wird, ist nicht erprobt“, und wiederum: „Haltet es für lauter Freude, meine Brüder, wenn ihr in vielerlei Versuchungen fallet“. Ist denn nicht etwa unter jener Versuchung (vor welcher uns der Herr bewahren möge) das Untergehen in der Versuchung zu verstehen? Die Versuchung gleicht nämlich einem Strome, der schwer zu durchschreiten ist. Wer ein tüchtiger Schwimmer ist und sich nicht fortreißen läßt, geht in den Versuchungen nicht unter, sondern schreitet durch sie hindurch. Wer aber jene Gabe nicht hat, geht in der Versuchung unter. So geriet z. B. Judas in die Versuchung der Habsucht; er schwamm aber nicht hindurch, sondern versank und ging an Körper und Geist zugrunde. Petrus geriet in die Versuchung, zu verleugnen; doch er versank nicht in der Versuchung, vielmehr schwamm er mutig hindurch und wurde gerettet.</p><p>Vernimm noch den Chor der wahrhaft Heiligen, welcher für Errettung aus der Versuchung dankt! „Du hast uns geprüft, o Gott, im Feuer hast du uns geläutert, wie man Silber läutert. Du führtest uns ins Netz hinein, legtest uns Beschwernisse auf den Rücken, Menschen setztest du über unsere Häupter. Durch Feuer und Wasser sind wir gegangen. Aber du führtest uns heraus in die Erfrischung.“ Siehst du, wie sie sich offen freuen, weil sie sich durchgearbeitet haben und nicht versunken sind? „Du hast uns“ — heißt es — „herausgeführt in die Erfrischung.“ „Sie wurden erfrischt“ ist soviel als „sie wurden aus der Versuchung errettet“.</p><p>„Doch befreie uns von dem Bösen!“ Wenn die Bitte „Führe uns nicht in Versuchung“ so viel wäre als „Lasse uns gar nicht versucht werden“, dann wäre nicht beigefügt „doch befreie uns von dem Bösen“. Der Böse, von dem wir befreit zu werden bitten, ist der Widersacher, der Teufel.</p><p>Am Schlusse des Gebetes sprichst du „Amen“. Durch das Wörtchen „Amen“ ═ „es geschehe“ besiegelst du, was in dem von Gott gelehrten Gebete gesagt ist.</p><p>[Forts. v. ] Hierauf spricht der Priester: „Das Heilige den Heiligen.“ Heilig ist das aufliegende Opfer, weil der Hl. Geist darauf herabgekommen ist. Heilig seid andererseits ihr, weil ihr des Hl. Geistes gewürdigt wurdet. Das Heilige gehört also den Heiligen. Ihr erwidert: „* Einer* ist heilig,* einer* der Herr, Jesus Christus“. In der Tat ist nur* einer* heilig, seinem Wesen nach heilig. Zwar sind auch wir heilig, jedoch nicht unserem Wesen nach, sondern infolge Teilnahme, durch Abtötung und Gebet.</p><p>[Forts. v. ] Alsdann hört ihr, wie der Psalmensänger euch mit göttlicher Melodie zur Teilnahme an den heiligen Geheimnissen einlädt und spricht: „Kostet und sehet, daß süß der Herr ist!“ Urteilet nicht nach dem Gaumen, sondern nach dem festen Glauben! Denn wer zum Mahle kommt, der wird nicht eingeladen, Brot und Wein zu kosten, sondern das Abbild des Leibes und Blutes Christi.</p><p>Trittst du vor, dann darfst du nicht die Hände flach ausstrecken und nicht die Finger spreizen. Da die rechte Hand den König in Empfang nehmen soll, so mache die linke Hand zum Throne für denselben! Nimm den Leib Christi mit hohler Hand entgegen und erwidere: Amen! Berühre behutsam mit dem heiligem Leibe deine Augen, um sie zu heiligen! Dann genieße ihn, doch habe acht, daß dir nichts davon auf den Boden falle! Was du davon fallen ließest, wäre natürlich so viel als Verlust eines deiner eigenen Glieder. Sage mir doch: Würdest du nicht, wenn dir jemand Goldstaub gäbe, denselben recht sorgfältig aufheben, damit ja nichts verloren gehe und du keinen Schaden erleidest! Solltest du also nicht viel mehr darauf bedacht sein, daß dir kein Brosämlein von dem verloren gehe, was kostbarer ist als Gold und Edelstein?</p><p>[Forts. v. ] Nach der Kommunion des Leibes Christi gehe auch zum Kelche des Blutes, nicht jedoch mit ausgestreckten Händen! Verbeuge dich, sprich zur Anbetung und Verehrung das Amen und genieße, um dich zu heiligen, auch vom Blute Christi! So lange noch Feuchtigkeit auf deinen Lippen ist, berühre sie mit den Fingern und heilige (mit jener Feuchtigkeit) Augen, Stirne und die übrigen Sinne! Alsdann warte das Gebet ab, um Gott zu danken, da er dich solcher Geheimnisse gewürdigt hat!</p><p>[Forts. v. ] Bewahret unversehrt diese Überlieferungen und haltet euch rein! Verzichtet nicht auf die Kommunion! Beraubet euch nicht durch Sündenschmutz dieser heiligen, geistigen Geheimnisse! „Der Gott des Friedens heilige euch ganz und gar! Und möge euer Leib, eure Seele und euer Geist vollkommen bleiben bis zur Ankunft unseres Herrn Jesus Christus!“ Ihm sei Ehre, Ruhm und Macht mit dem Vater und dem Hl. Geist jetzt und immer und in alle Ewigkeit. Amen.</p>
