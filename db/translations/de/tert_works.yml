    body: |-
      <p><em>Über die Auferstehung des Fleisches, übersetzt von Karl Adam Heinrich Kellner (Köln 1882).</em></p><h2>1</h2><p>Was den Christen ihr Vertrauen einflösst, ist die Auferstehung der Toten. Durch sie sind wir Gläubige geworden. Zu diesem Glauben nötigt uns die wahre Lehre; die wahre Lehre offenbart uns Gott, aber der Pöbel verlacht sie in dem Wahne, es gebe nach dem Tode nichts mehr. Und doch bringt man den Verstorbenen Totenopfer dar, und zwar mit ausgiebigem Dienste, entsprechend ihrer Lebensart, sowie dem Zeitwechsel der Speisen, so dass man also bei denen ein Verlangen voraussetzt, denen man sogar jedes Gefühl abgesprochen hat.</p><p>Ich aber verlache den Pöbel um so mehr auch dann, wenn er dieselben Verstorbenen, die er nachher auf so leckere Weise beköstigt, in so schrecklicher Weise verbrennt, indem er ihnen mittels derselben Feuerkraft Gutes und Böses zufügt. Ist das eine Verwandtenliebe, die mit einer Grausamkeit ihr Spiel treibt! Sind es denn eigentlich Opfer oder Beleidigungen, was sie darbringt, wenn sie verbrannten Personen etwas verbrennt? Allerdings thun die Weisen ihre Ansicht von der Sache mit der des Pöbels zusammen. Nach dem Tode gibt es nichts mehr, lautet der Unterricht des Epikur. Auch Seneca behauptet, dass nach dem Tode alles aus sei, sogar der Tod selber. å</p><p>Es genügt uns, dass im Gegenteil die Philosophie des Pythagoras, die nicht geringer ist, sowie die des Empedokles und die Platoniker die Unsterblichkeit der Seelen aufrecht erhalten und, uns ganz nahekommend, letztere sogar in Körper zurückkehren lassen, freilich nicht in dieselben und nicht in menschliche Körper, allein doch so, dass Euphorbus in Pythagoras, Homer in einem Pfau wiedererkannt werden. Sie haben zum wenigsten doch eine körperliche Wiedererweckung der Seele verkündet; sie haben, was noch erträglicher ist, deren Eigenheit nicht geleugnet, sondern verändert und die Wahrheit, wenn auch nicht erreicht, so doch wenigstens berührt.</p><p>So verkennt die ausserchristliche Welt auch in ihrem Irrtum die Auferstehung der Toten nicht.</p>
      <h2>2</h2><p>Wenn sich aber auch unter den Bekennern Gottes eine Gesellschaft findet, die den Epikuräern näher verwandt ist als den Propheten, so wissen wir ja, was sie, die Sadduzäer, von Christus zu hören bekamen. Christus nämlich war es vorbehalten, alles ehedem Verborgene aufzudecken, dem Ungewissen die Richtung zu geben, das Unvollständige zu ergänzen, das Vorhergesagte gegenwärtig zu machen, gewiss aber die Auferstehung der Toten nicht bloss <em>durch</em> sich, sondern auch <em>an</em> sich zu bestätigen. Jetzt rüsten wir uns gegen eine andere Art Sadduzäer, die, welche die Ansicht derselben teilen. Sie erkennen so die Auferstehung nur zur Hälfte an, nämlich bloss die der Seele, den Körper verachten sie, sowie auch den Herrn des Körpers. Die Häretiker missgönnen nämlich keiner andern körperlichen Substanz ihr Wohlergehen, als der, welche der andern Gottheit angehört. Daher waren sie auch bei Christus gezwungen, damit er nur nicht dem Weltschöpfer angehöre, ihm eine andere Beschaffenheit zu geben, und haben so zuerst hinsichtlich seiner menschlichen Natur selbst geirrt, indem sie entweder mit Marcion und Basilides vorgaben, dieselbe habe gar keine Realität, oder, wie die Häresie de Valentinus und Apelles will, sie sei von einer ganz besondern Beschaffenheit. Und so ist denn die Folge, dass sie von der Erhaltung derjenigen Substanz, woran sie Christo keinen Anteil geben, nichts wissen wollen, überzeugt davon, dass es für deren Auferstehung ein äusserst günstiges Vorurtheil erwecken würde, wenn in Christus das Fleisch bereits auferstanden wäre.</p><p>Aus diesem Grunde haben wir auch das Buch über den Leib Christi vorausgehen lassen, worin wir dessen Materialität gegen das Hirngespinst eines Scheingebildes beweisen und gegenüber der vorgeblichen ganz besondern Qualität desselben seinen menschlichen Charakter aufrecht erhalten, so dass Christus den Namen Mensch und Menschensohn zu führen berechtigt ist. Denn indem wir den Beweis liefern, dass er ein fleischliches und körperliches Wesen war, überführen wir die Gegner zugleich durch Präskription davon, dass dann auch neben dem Weltschöpfer kein Gott weiter geglaubt werden dürfe, indem wir an Christo, in welchem Gott erkannt wird, eine solche Beschaffenheit nachweisen, wie sie der Weltschöpfer verheissen hat. Dadurch überführt, dass Gott der Schöpfer des Fleisches, und Christus der Erlöser des Fleisches sei, werden sie nunmehr auch der Auferstehung des Fleisches überwiesen werden. Natürlich ganz folgerecht!</p><p>Das ist denn auch ungefähr die Methode, wonach wir die Disputationen mit den Häretikern anstellen. Denn die logische Ordnung verlangt, dass immer aus den Grundsätzen die Folgerungen abgeleitet werden, so dass zuerst das feststehe, was dem fraglichen Gegenstande als Fundament dienen soll. Daher verhandeln die Häretiker, ihrer Schwäche sich wohl bewusst, niemals nach dieser ordnungsgemässen Methode.</p><p>In der sichern Erwartung der grossen Mühe, die sie mit dem Erweise einer andern Gottheit gegenüber dem Gott der Welt haben, der durch die Zeugnisse seiner Werke von Natur aus allen bekannt, in seinen Geheimnissen der Frühere und in seinen Verkündigungen der Erkennbarere ist, machen sie unter dem Vorwande, es gebe eine dringendere Angelegenheit, nämlich das Heil des Menschen, welches vor allem andern zu suchen sei, mit den Fragen in betreff der Auferstehung den Anfang.</p><p>Denn an die Auferstehung des Fleisches glaubt es sich schwerer als an einen Gott. Daher bearbeiten sie das Erkenntnisvermögen, berauben es der Kraft der ihm entsprechenden richtigen Methode, beschweren es dafür mit Besorgnissen, die auf Herabsetzung des Leibes gerichtet sind, und machen es empfänglich — eben durch Beraubung der Hoffnung und Vertauschung des Gegenstandes derselben. Jeder nämlich, der von der Höhe seiner Hoffnung, deren er sich beim Schöpfer sicher glaubte, herabgestossen oder doch darin wankend gemacht ist, neigt leicht dem Gedanken an den Gewährsmann einer andern Hoffnung zu und kommt von selbst darauf. Durch eine Verschiedenheit der Verheissungen wird die Verschiedenheit der Götter insinuiert. Auf diese Weise sehen wir viele Leute ins Garn gehen und sie werden eher um den Glauben an die Auferstehung gebracht, bevor sie andere um den Glauben an die Einheit Gottes bringen.</p><p>Was die Häretiker anlangt, so haben wir schon gezeigt, mit welcher Waffe man ihnen entgegenwirken müsse. Und es ist ihnen bereits, jedem unter seinem besonderen Titel, entgegengewirkt, bezüglich der Einzigkeit Gottes und seines Christus <em>gegen Marcion</em>, bezüglich der menschlichen Natur des Herrn <em>gegen die vier Häresien;</em> letzteres besonders, um für die gegenwärtige Frage den Weg zu bahnen. Daher ist nun über die Auferstehung des Fleisches bloss noch in der Rücksicht zu handeln, als ungewiss in Hinsicht unser, das heisst in Hinsicht des Weltschöpfers.</p><p>Denn es gibt auch viele Unwissende, sehr viele, die in ihrem Glauben schwanken, und noch mehr Einfältige, welche man wird unterrichten, leiten und befestigen müssen. Auch nach dieser Seite hin wird die Einheit der Gottheit ihre Verteidigung finden. Wie dieselbe nämlich durch Leugnung der Auferstehung des Fleisches gefährdet wird, so wird sie umgekehrt durch deren Aufrechthaltung sichergestellt.</p><p>Die Fortdauer der Seele aber unterliegt, glaube ich, keinen Bedenklichkeiten. Denn fast alle Häretiker lassen sie in irgend einer Weise gelten oder leugnen sie doch nicht. Wenn dann einzig und allein ein gewisser Lukanus mit der genannten Substanz nicht einmal Schonung übt, sondern sie in aristotelischer Weise auflöst und dafür etwas anderes an ihre Stelle setzt, indem er als ein gewisses Drittes auferstehen will, nicht als Seele und auch nicht als Leib, das heisst dann wohl als ein Nichtmensch, vielleicht, weil er aus Lukanien ist, als ein Bär — so ist das seine Sache. Auch er findet aus unserer Feder ein sehr umfangreiches Werk über die Seele in allen ihren Beziehungen. Wir halten darin vor allem deren Unsterblichkeit aufrecht, erkennen bloss dem Fleische die Vergänglichkeit zu und behaupten ganz besonders dessen Wiederherstellung. Was wir sonst etwa anderwärts, wie es die Sachen mit sich brachten, vorweggenommen und hie und da zerstreut angebracht haben, das ist dort in ein dem Gegenstand entsprechendes regelrechtes Ganzes gebracht. Denn, wie es üblich ist, manchmal etwas vorwegzunehmen, so muss man auch manchmal etwas versparen, wenn dann nur das Vorwegbesprochene seine Vervollständigung als Ganzes findet und das an verschiedenen Orten Aufgesparte unter seiner Rubrik wieder erscheint.</p>
      <h2>3</h2><p>Es gibt zwar auch ein Denken nach dem allgemeinen Menschenverstande in Sachen der Offenbarung, allein nur zum Zeugnis für die Wahrheit, nicht zur Unterstützung von etwas Falschem, welches der göttlichen Anordnung entsprechend sein soll und nicht derselben zuwiderläuft. Denn manche Dinge sind von Natur aus bekannt, so z. B. sehr vielen die Unsterblichkeit der Seele, allen Menschen der von uns verkündete Gott. Wenn also ein Plato sagt: „Jede Seele ist unsterblich“, so werde auch ich mich seines Ausspruches bedienen; wenn das gewöhnliche Volk das Dasein eines Gottes der Götter bezeugt, so werde ich mich seiner Wissenschaft bedienen. Ich werde mich auch der übrigen allgemeinen Begriffe bedienen, worin z. B. das Richteramt Gottes verkündet wird: „Gott sieht es“, und „Ich stelle es Gott anheim“. Hingegen wenn die Leute sagen: „Tot ist tot“, oder „So lang du das Leben hast, lebe auch!“ oder „Nach dem Tode ist alles aus und er auch“, dann werde ich daran denken, dass Gott das Herz der Menge wie Asche gerechnet und sogar die Weisheit dieser Welt für Thorheit erklärt hat.</p><p>Wenn dann der Häretiker zu den Fehlern des Pöbels und der Denkart der Welt seine Zuflucht nimmt, so werde ich sagen: Häretiker, lass den Heiden gehen! Obwohl Ihr, die Ihr Euch Euren Gott macht, alle eins seid, so bist Du, indem Du dies unter dem Namen Christi thust, und Dir einredest, Christ zu sein, doch vom Heiden verschieden. Gib ihm seine Ideen zurück, da er sich ja auch nicht durch die Deinigen belehren lässt. Warum nimmst Du dir einen blinden Führer als Stütze, wenn Du selber siehest? Was lässest Du Dich von einem Nackten ankleiden, wenn Du Christum angezogen hast? Was bedienst Du Dich eines fremden Schildes, wenn Du vom Apostel mit Waffen ausgerüstet bist? Richtiger sollte der andere von Dir die Auferstehung des Fleisches bekennen lernen, statt dass Du sie durch ihn verleitet verkennest. Denn wenn dieselbe von christlichem Standpunkte in Abrede gestellt werden müsste, so wäre es genug, sie auf Grund eigenen Wissens zu leugnen, nicht aber aus der Unwissenheit der Heiden Belehrungen zu schöpfen. Wer leugnet, was die Christen behaupten, und wer es noch dazu mit Hilfe solcher Argumente, deren sich die Nichtchristen bedienen, thut, der dürfte wohl kein Christ mehr sein.</p><p>Man nehme also den Häretikern die Anschauungen, die sie mit den Heiden gemein haben, so dass sie mit ihren Untersuchungen lediglich auf den Boden der hl. Schrift gestellt sind, und sie werden nicht bestehen können. Denn die allen Menschen gemeinsamen Begriffe empfehlen sich eben durch ihre Gemeinverständlichkeit, das Mitempfinden der Anschauungen und die Vertrautheit dieser Meinungen; sie werden für um so zuverlässiger gehalten, je mehr sie unverhüllte, gemeinfassliche und allen bekannte Dinge enthalten. Der göttliche Gedanke aber wohnt in der Tiefe, nicht auf der Oberfläche, und ist oftmals dem Augenschein gerade entgegengesetzt.</p>
      <h2>4</h2><p>Daher machen die Häretiker den Anfang mit demjenigen, wovon sie wissen, dass die Menge sich leicht damit fangen lässt, mit der beliebten Gemeinsamkeit der Begriffe; damit leiten sie die Sache ein und bauen darauf fort.</p><p>Oder hört man sie nicht aus dem Munde der Häretiker ebenso schnell und ebenso oft als aus dem der Heiden? Hört man nicht sofort und überall die Schimpferei über das Fleisch, seinen Ursprung, seine Bestandteile, seine Zufälle, seinen ganzen Ausgang? dass es von Anfang an unrein sei als Abschaum der Erde, dass es in der Folge noch mehr verunreinigt worden durch den Unflat seines eigenen Samens, dass es gebrechlich, schwach, schuldbeladen, beschwert, lästig sei, und zuletzt als Schluss der ganzen Litanei seiner Niedrigkeit, dass es in die Erde, seinen Ausgang, hinsinke als Leichnam, dass es endlich nicht einmal diesen Namen behalte, sondern in ein Nichts zergehe, noch nicht einmal ein Name, sondern bis zum Untergang jeglicher Benennung!? Dieses Fleisch also, weiser Mann, das Deinem Anblick, Deiner Berührung und Deiner Erinnerung entschwunden ist, davon wolltest Du Dir einreden lassen, dass es sich einst wieder herstellen werde, aus der Verderbnis zu einem vollkommenen Ganzen, aus der Inhaltlosigkeit zu etwas Greifbarem, aus der Leerheit zur Vollheit, aus einem baren Nichts zu einem Etwas?! Und dabei sollen es natürlich die Flammen, die Wogen, die Wänste der wilden Tiere, die Kröpfe der Vögel, die Kaldaunen der Fische, ja sogar die ganz absonderliche Wohlschmeckerei der jetzigen Zeiten wieder hergeben?! Mithin wird es als dasselbe wieder erwartet, welches zu Grunde gegangen ist, so dass man als Lahmer, als Schielender, als Blinder, als Aussätziger, als Gelähmter wiederkommt, so dass also in den ursprünglichen Zustand zurückzukehren nicht beliebt?! Oder wird man unverkrüppelt sein, so dass man nochmals dergleichen Leiden zu fürchten habe? Und dann, was mit dem Fleische verbunden ist?! Ist ihm eben dieses alles wiederum notwendig? Vor allem Nahrung und Getränke, den Lungen das Aufatmen, den Eingeweiden die Wärme, den Schamteilen sich nicht zu schämen und allen Gliedern die Verrichtung ihrer Thätigkeit? Will man denn Geschwüre und Wunden, Fieber, Podagra und den Tod wieder zurückwünschen? Selbstverständlich, dies würde das Verlangen, den Leib wieder zu erhalten, bedeuten, wiederum wünschen, ihn los zu werden! — Wir sagen nur so viel, als sich mit einiger Ehrbarkeit sagen lässt, damit das Papier nicht erröte. Wie viel sollte bei ihren Besprechungen nicht auch noch der Zotenreisserei zu unternehmen erlaubt sein, sowohl den Heiden als den Häretikern?!</p>
      <h2>5</h2><p>Da also sogar alle Ungebildeten für die Gemeinbegriffe empfänglich sind, da auch die Schwankenden und Einfältigen durch eben dieselben aufs neue in Unruhe versetzt werden, und da sie jedesmal der erste Sturmbock sind, der gegen uns gerichtet und wodurch unsere richtige Ansicht in betreff des Fleisches wankend gemacht wird, so muss notwendigerweise die Stellung und Würde des Fleisches zuerst gesichert werden dadurch, dass man Tadel mit Lob vertreibt. So nötigen mich die Häretiker, den Rhetoren zu machen, so gut wie den Philosophen.</p><p>Nichtig und gebrechlich ist dieses armselige Leibeswesen, das böse zu nennen sie nicht zurückschrecken. Mag dasselbe nun, wie Menander und Markus beliebt, ein Werk der Engel gewesen oder mag es, wie Apelles lehrt, das Bauwerk eines Feuerwesens, also ebenfalls eines Engels sein, so würde, um ihm Ansehen zu verleihen, die Vorstandschaft einer Gottheit zweiten Ranges genügen. Denn wir wissen, dass auf Gott die Engel folgen. Schon auf diesem Punkte der Beweisführung könnte ich, wie beschaffen der jedesmalige oberste Gott eines solchen Häretikers auch sein mag, die Würde des menschlichen Leibes ganz passend sogar von ihm ableiten, weil dann der Entschluss, ihn zu schaffen, ihm gehört haben würde. Denn in jedem Falle hätte er die Erschaffung des Menschenleibes verhindern können, wenn er dieselbe nicht gewollt hätte, da er ja um diese Erschaffung wusste. So ist auch nach ihrer Ansicht der menschliche Leib ebenso gut ein Werk Gottes. Alles, was jemand hat geschehen lassen, ist auch sein Werk.</p><p>Ein Glück aber ist es, dass die meisten, ja sogar alle dauerhaften Lehrmeinungen die Bildung des ganzen Menschen unserem Gotte überlassen. Wie gross dessen Erhabenheit sei, das weiss der recht gut, welcher geglaubt hat, er sei nur ein einziger. Möge der menschliche Leib, dessen Baumeister so gross ist, nun Dir zu gefallen anfangen! Aber man entgegnet, auch die Welt ist Gottes Werk, und doch vergeht die Gestalt dieser Welt, nach dem Zeugnisse selbst des Apostels, und es wird keine Wiederherstellung derselben verheissen, trotzdem dass sie ein Werk Gottes ist. Wenn aber das Weltall nach seinem Untergang nicht wieder herstellbar ist, was wird aus den blossen Teilen desselben werden? — Ja wohl, wenn der Teil dem Ganzen gleichsteht. Wir berufen uns nämlich auf ihre Verschiedenheit. Erstens ist zwar alles durch das Wort Gottes geschaffen worden und ohne dasselbe nichts. Das Fleisch aber besteht auch seiner Form nach durch das Wort Gottes, damit nichts ohne das Wort Gottes da sei. Denn er hat die Worte vorausgehen lassen: „Wir wollen den Menschen machen“, und zwar noch mehr, mit der Hand, wegen des Vorranges desselben, damit er mit der Welt gar nicht verglichen werden könnte. „Es bildete“, heisst es, „Gott den Menschen.“ Ohne Zweifel der Grund für eine grosse Verschiedenheit, entsprechend, wie sich von selbst versteht, der Beschaffenheit der betreffenden Dinge! Geringer nämlich sind die Dinge, die geschaffen wurden, als der, für welchen sie geschaffen wurden, sie wurden nämlich für den Menschen geschaffen, dem sie Gott alsbald zuwies. Mit Recht war also das Weltall, als das Dienende, durch einen Befehl und ein Geheiss und die in dem blossen Wort liegende Macht hervorgebracht worden. Der Mensch dagegen, als Herr desselben, ist in dieser Eigenschaft, indem er vom Herrn geschaffen wurde, gebildet worden, um Herr desselben sein zu können. In betreff des Menschen aber vergiss nicht, dass er im eigentlichen Sinne Fleisch genannt werde, weil dieses zuerst den Namen Mensch bekam: „Und es bildete Gott zum Menschen den Lehm der Erde.“ Er ist schon Mensch und doch noch Lehm. „Gott hauchte in sein Angesicht den Hauch des Lebens, und es wurde der Mensch, d. i. der Lehm der Erde, zur lebendigen Seele, und Gott setzte den Menschen, den er gebildet hatte, ins Paradies.“ Zuerst also war der Mensch ein blosses Gebilde, nachher der ganze Mensch. Dies möchte ich aus dem Grunde hervorgehoben haben, damit man wisse, dass alles, was von Gott überhaupt für den Menschen in Aussicht genommen und ihm verheissen wurde, nicht der Seele allein, sondern auch dem Fleische zukomme, wenn nicht infolge seines Anteils an der Gattung, doch sicher wenigstens durch das Privilegium seiner Benennung.</p>
      <h2>6</h2><p>Ich möchte also meinen Gegenstand wohl noch weiter verfolgen, wenn ich nur imstande wäre, dem menschlichen Leibe so viel Ehre zu verschaffen, als der ihm erwiesen hat, der ihn bildete. Denn derselbe erfreute sich schon damals des Ruhmes, dass ein so niedriger Gegenstand wie der Lehm in die Hände Gottes, wie immer sie auch sein mögen, geriet, glücklich genug durch jene blosse Berührung. Er hätte ja können ohne weitere bildnerische Thätigkeit sofort als Gebilde infolge der blossen Berührung durch Gott dastehen. Es ging also etwas Grosses vor sich, als diese Materie bereitet wurde. Sie empfing ebenso vielmal eine Auszeichnung, als sie die Hand Gottes fühlte, indem sie berührt, ein Teil davon genommen, weggebracht und ausgeformt wurde. Stelle dir vor, wie Gott ganz mit ihr beschäftigt ist, seine Hand, sein Sinn, sein Wirken, sein Plan, seine Weisheit, seine Vorsehung und vor allem seine Zuneigung selbst, welche die Umrisse eingab, an sie hingegeben ist. Denn zu was auch immer der Lehm gestaltet wurde, es schwebte der Gedanke an Christus dabei vor, der einst Mensch werden sollte, dasselbe wie der Lehm, und der Gedanke an das Wort, das Fleisch werden sollte, was damals noch Erde war. Denn so lautet die vorausgehende Anrede des Vaters an den Sohn: „Wir wollen den Menschen machen nach unserm Bilde und Gleichnisse.“ Und es bildete Gott zum Menschen das, was er eben bildete, und er schuf ihn nach dem Ebenbilde Gottes, d. i. wohlgemerkt Christi. Denn auch das Wort ist Gott, er, der, im Bilde Gottes hingestellt, es nicht für einen Raub erachtete, Gott gleich zu sein. So war denn jener Lehm, dem schon damals das Ebenbild des künftig im Fleische erscheinenden Christus angelegt wurde, nicht bloss ein Werk Gottes, sondern auch ein Unterpfand. Was nützt es also, um den Ursprung des menschlichen Leibes herabzusetzen, jetzt immer das Wort Erde als Bezeichnung eines unreinen, niedrigen Elementes im Munde zu führen? Wenn auch ein anderer Stoff zur Ausmeisselung des Menschen dagewesen wäre, so müsste man doch die hohe Stellung des Bildners im Auge behalten, der ihn durch die getroffene Wahl für würdig erklärte und durch die Behandlung dazu würdig machte. Die Hand des Phidias arbeitet einen olympischen Jupiter aus Elfenbein und er wird angebetet. Der Gott hat mit dem wilden Tiere und noch dazu mit einem so ungeschlachten nichts mehr gemein; er ist der höchste Gott der heidnischen Welt, nicht weil der Elefant, sondern weil der Phidias so gross ist. Und der lebendige Gott, der wahre Gott, der sollte nicht jede noch so geringe Materie durch ein Bearbeiten seinerseits gereinigt und von jeder Schwäche geheilt haben!? Oder sollte etwa die Möglichkeit übrig sein, dass ein Mensch einen Gott mit mehr Anstand bilden könne, als Gott den Menschen? Jetzt ist der Lehm, wenn auch ein Ärgernis, doch ein anderes Ding geworden. Ich halte mich daran, er ist bereits ein Leib und keine Erde, obwohl auch der Leib zu hören bekommt: „Du bist Erde und wirst wieder zur Erde zurückkehren.“ Damit wird bloss seine Herkunft angegeben, nicht aber sein Wesen widerrufen. Es ist ihm ein Sein verliehen worden, welches edler ist als seine Herkunft und glücklicher als seine Abstammung. Auch das Gold ist Erde, weil von der Erde; und doch ist es keine Erde mehr, sondern, seitdem es Gold ist, ein ganz anderer Stoff, glänzender und edler als der unscheinbare Mutterstoff. So ist es auch Gott verstattet gewesen, das Gold des menschlichen Leibes aus dem vermeintlichen Schmutz der Erde herauszuschmelzen und seine Herkunft zu entschuldigen.</p>
      <h2>7</h2><p>Aber sollte vielleicht das Ansehen des Fleisches darum geringer erscheinen, weil es nicht auch wie der Lehm von der Hand Gottes im eigentlichen Sinne berührt worden ist? — Nein, da er den Lehm zu dem Zwecke in Behandlung nahm, damit nachher aus dem Lehm Fleisch werde, so hat er damit gewiss das Interesse des Fleisches gewahrt.</p><p>Doch ich wünschte, dass man noch lerne, wann und wie das Fleisch aus dem Lehm hervorgesprosst sei. Die Stücke von Fellen, welche Adam und Eva bei der Vertreibung aus dem Paradiese angezogen erhielten, werden es nicht, wie einige meinen, gewesen sein, wodurch die Umbildung des Lehmes in Fleisch geschah. Denn schon geraume Zeit vorher hatte Adam in dem Ableger von seiner Substanz, in dem Weibe, Fleisch erkannt, — „das ist nun Bein von meinem Bein und Fleisch von meinem Fleisch,“ — und was vom Manne zur Bildung des Weibes weggenommen war, wurde mit Fleisch ausgefüllt, da es, wie man denken sollte, doch, wenn Adam noch Lehm war, mit Lehm hätte ausgefüllt werden müssen. Also der Lehm ist ganz im Fleisch aufgegangen und verzehrt. Wann? — Als der Mensch zur lebenden Seele wurde, durch den Hauch Gottes, eine Glut, welche gewissermassen imstande ist, Lehm so auszudörren, dass er zu einer andern Substanz wird, zu Fleisch, so gut wie zu Steingut. So ist es ja auch dem Töpfer möglich, den Thon durch richtige Anwendung von Feuer zu dauerhafterem Stoffe zu verdichten und aus der einen Erscheinungsform eine andere hervorgehen zu lassen, besser als die frühere, von besonderer Art und mit eigenem Namen. Denn obgleich geschrieben steht: „Spricht etwa der Thon zum Töpfer?“, d. h. der Mensch zu Gott, obgleich der Apostel „von irdenen Gefässen“ redet, so ist dennoch der Mensch Thon, weil er vorher Lehm war, und der menschliche Leib ein irdenes Geschirr, weil er durch die Glut des göttlichen Hauches aus Lehm entstanden ist. Später wurde er mit Stücken von Fellen bekleidet, das ist mit Haut überzogen. Denn überall, wo man die Haut abstreift, wird das Fleisch blossgelegt. So war das, was jetzt, wenn es abgestreift wird, einen Balg bildet, damals, als es angelegt wurde, ein Gewand. Daher erklärt auch der Apostel, indem er die Beschneidung eine Wegnahme des Fleisches nennt, die Haut für ein Gewand.</p><p>Da sich dieses alles nun so verhält, so hat man einen durch die Hand Gottes geadelten Lehm und ein durch den Anhauch Gottes, wodurch das Fleisch zugleich die Spuren des Lehmes ablegte und die Auszeichnung einer Seele erhielt, noch mehr geadeltes Fleisch. Wir sind nicht kunstfertiger als Gott und fassen doch scythische und indische Edelsteine sowie die weissen Körnlein des Roten Meeres nicht in Blei, nicht in Erz, nicht in Eisen, auch nicht einmal in Silber, sondern lassen sie in die ausgesuchteste und künstlichste Goldfassung ein; ebenso besorgt man für recht köstliche Weine und Salben zuvor auch angemessene Gefässe und sucht sich ebenso für ein Schwert, das in vollendeter Weise damasziert ist, eine würdige Scheide aus. Gott dagegen sollte den Schatten seiner Seele, den Hauch seines Geistes, das Werk seines Mundes in ein seiner ganz unwürdiges Behältnis eingesargt und fürwahr zu einem unwürdigen Aufenthalt verurteilt haben?! Er hat ihm aber zum Aufenthaltsort gegeben den Leib, besser gesagt, ihn darin eingesäet und ihn mit ihm vermischt und zwar in so inniger Verbindung, dass man es für zweifelhaft halten kann, ob der Leib der Seele oder die Seele dem Leibe als Träger diene, ob das Fleisch der Seele oder die Seele dem Fleische gehorche.</p><p>Jedoch man muss annehmen, die Seele, als das Gott mehr Verwandte, werde getragen und herrsche. Selbst die Thatsache schlägt wieder zur Verherrlichung des Leibes aus, dass er die Gott verwandte Seele enthält und ihr Gelegenheit zum Herrschen verschafft. Gibt es irgend eine Benutzung der Natur, einen Genuss von der Welt, eine Ergötzung durch die Elemente, welche die Seele nicht durch den Leib genösse? Durch ihn wird sie mit dem sämtlichen Hülfsapparat der Sinne versehen, mit dem Gesicht, Gehör, Geschmack, Geruch, Gefühl. Durch ihn wird sie mit der göttlichen Macht überflutet, sie, die alles nur durch die Sprache vollbringt, wenigstens durch die stillschweigend voraufgegangene. Denn auch die Sprache kommt von den leiblichen Organen. Die Künste vollziehen sich vermittelst des Leibes, die Studien und Bestrebungen vermittelst des Leibes, die Thätigkeiten, Geschäfte, Obliegenheiten vermittelst des Leibes, und so fusst die ganze Lebensthätigkeit der Seele auf dem Leibe, so dass nicht leben für die Seele nichts anderes heisst, als den Leib verlassen. So ist sogar das Sterben selbst eine Thätigkeit des Leibes, so gut wie das Leben. Also, wenn der Seele alles nur durch den Leib unterworfen ist, so ist es auch dem Leibe unterworfen. Durch wessen Hilfe du geniessest, in dessen Gemeinschaft musst du auch geniessen. So zeigt sich der Leib, obwohl er für den Diener und Knecht der Seele gehalten wird, als ihr Genosse und Mitbesitzer. — Wenn aber in zeitlichen Dingen, warum nicht auch hinsichtlich der ewigen?</p>
      <h2>8</h2><p>Dies ist es, was ich gleichsam auf Grund der allgemeinen Gesetze des menschlichen Daseins zu gunsten des Leibes beibringen wollte. Sehen wir nun nach, welch grosse Vorzüge diese gebrechliche und unreine Substanz besonders auf Grund der dem christlichen Bekenntnisse eigentümlichen Gesetze bei Gott hat. Es dürfte schon genügen, dass überhaupt keine Seele ihr Heil erlangen kann, als wenn sie, so lange sie im Fleische wohnte, gläubig war. Also ist der Leib der Angelpunkt des Seelenheils. Und wenn die Seele Gottes Eigentum wird, so ist es der Leib, welcher bewirkt, dass sie es werden kann. Denn der Leib ist es, der abgewaschen wird, damit die Seele von ihren Flecken gereinigt werde; der Leib wird gesalbt, damit die Seele geheiligt werde. Der Leib wird bezeichnet, damit die Seele befestigt werde; der Leib wird durch die Handauflegung beschattet, damit die Seele durch den Geist erleuchtet werde. Der Leib geniesst das Fleisch und das Blut Christi, damit die Seele aus Gott genährt werde.</p><p>Was also bei der Arbeit verbunden ist, das kann bei der Belohnung nicht getrennt werden. Denn auch die Gott wohlgefälligen Opfer, ich meine die Kasteiungen der Seele, das Fasten, sowohl das eigentliche Fasten als auch die Xerophagien und die sonstigen Zeichen von Trauer, welche zu diesem Dienste gehören, sie alle stellt der Leib auf seine Kosten allein an. Auch der Wohlgeruch der Jungfräulichkeit und Witwenschaft, sowie der bloss angenommene Schein einer Ehe, der im verborgenen sittsam ist, und dass man sich mit der bloss einmaligen Kenntnis derselben genügen lässt, — alle diese Opfer werden Gott von den Gütern des Leibes dargebracht.</p><p>Endlich, was urteilst du wohl über den Leib, wenn er, wegen der Treue für sein Bekenntnis in die Öffentlichkeit geschleppt und dem allgemeinen Hasse preisgegeben seinen Kampf kämpft, wenn er in Kerkern hinschmachtet in schmählicher Entbehrung des Tageslichtes, im Mangel an allem Nötigen, in schmutziger, unsauberer und schimpflicher Lebensweise, nicht einmal während des Schlafes frei, weil er sogar auf der Lagerstätte gefesselt bleibt und von der Streu zerstochen wird, wenn er dann gar am hellen Tage durch angewandte Martern aller Art zerfleischt und endlich von den Todesqualen aufgerieben wird, sich sehnend, für Christus zu sterben, wie dieser für ihn gestorben ist, und zwar oftmals sogar an demselben Kreuze, um von noch grässlicheren, ausgesuchten Todesstrafen zu schweigen? Nein, über das glückselige und höchst ruhmwürdige Fleisch, das imstande ist, bei Christus, dem Herrn, für eine solche Schuld aufzukommen, so dass es ihm nur insofern noch etwas schuldig bleibt, dass es sein Schuldner zu sein aufgehört hat, und dies mehr im gefesselten Zustande als in der Freiheit!</p>
      <h2>9</h2><p>Um also die Sache kurz zusammenzufassen, sage ich, was Gott mit seinen eigenen Händen zu seinem Ebenbilde geformt hat, was er durch sein Anhauchen nach der Analogie seines Lebens belebt, was er mit der Bestimmung, seine ganze Schöpfung zu bewohnen, zu geniessen und zu beherrschen, ihr vorgesetzt hat, was er mit seinen Sakramenten und seiner Zucht umgeben hat, das, dessen Reinigkeit er liebt, dessen Kasteiungen er genehm hält, dessen Leiden vor ihm Wert haben — das sollte nicht auferstehen, während es in so vielen Hinsichten Gott angehört?! Fern, ja fern sei es, dass Gott das Werk seiner Hände, den Gegenstand der Sorge seines Schöpfergeistes, das Behältnis seines Hauches, den König seiner Schöpfung, den Erben seiner Freigebigkeit, den Priester seiner Religion, den Kämpfer für sein Zeugnis, den Bruder Christi einem immerwährenden Untergange preisgebe!</p><p>Dass Gott gut ist, haben wir gewusst, dass er das beste Wesen ist, haben wir von seinem Christus dazu gelernt. Da er nächst der Liebe zu Gott die zum Nächsten befiehlt, so wird er doch wohl auch selber thun, was er vorschreibt. Er wird den menschlichen Leib lieben, der ihm in so vielfacher Weise nahesteht, obwohl derselbe schwach ist, — „die Tugend wird ja in der Schwäche vollendet“, — obschon er krank ist, — „nur die sich schlecht Befindenden bedürfen eines Arztes“, — obschon er unansehnlich ist, — „aber die unansehnlicheren Glieder umkleiden wir mit grösserer Ehre“, — obschon er verloren war, — aber „ich bin“, sagt er, „gekommen, um zu retten, was zu Grunde gegangen“, — obschon er sündhaft ist, — „aber ich will lieber“, sagt er, „das Heil des Sünders als seinen Tod“, — obschon er verdammt ist, — „ich bin es“, sagt er, „der Wunden schlagen und sie heilen wird“. Was machst Du dem Leibe seine Zustände zum Vorwurf, welche Gottes warten, welche auf Gott hoffen, welche bei ihm Ehre finden, denen er zur Hilfe kommt? Ich möchte fast wagen zu behaupten, wenn diese Zustände dem Leibe nicht zugestossen wären, so hätten Gottes Güte, Gnade, Erbarmung, ja die ganze Kraft des Wohlthuns Gottes keinen Gegenstand gehabt.</p>
      <h2>10</h2><p>Man klammert sich immer an die Schriftstellen an, worin das Fleisch getadelt wird, halte auch die fest, worin es, gerühmt wird. Wenn es manchmal heruntergesetzt wird, so beachtet man das; mach’ die Augen auch dann auf, wenn es erhoben wird. „Alles Fleisch ist nur Heu“. Aber nicht bloss diesen Ausspruch thut Isaias, sondern auch den, „dass alles Fleisch das Heil Gottes sehen wird“. Man merkt sich, wie in der Genesis Gott sagt: „Mein Geist wird nicht in diesen Menschen bleiben, weil sie Fleisch sind“. Aber man hört aus dem Munde Joëls auch: „Ich will von meinem Geiste über alles Fleisch ausgiessen“. Auch des Apostels Schreibart sollte man nicht bloss von der Seite kennen, wo er das Fleisch so oft herabdrückt. Denn wenn er auch in Abrede stellt, dass irgend etwas Gutes in seinem Fleische wohne, obschon er behauptet, dass die, welche im Fleische sind, Gott nicht gefallen können, weil es gegen den Geist gelüste, und wenn er noch manche andere Aussprüche der Art hinstellt, wodurch zwar nicht der Substanz des Fleisches, sondern dessen Werken die Ehre entzogen wird, so werden wir auf der andern Seite doch wieder sagen müssen, dass dem Fleische im eigentlichen Sinne kein Vorwurf gemacht werden dürfe, als nur zum Zweck der Beschämung der Seele, welche sich der Dienste des Leibes bedient. Jedoch in eben jenen Briefen heisst es auch, dass Paulus die Male Christi an seinem Körper trage, unsern Leib, als den Tempel Gottes, zu beflecken verbiete, unsere Körper zu Gliedern Christi mache, und er ermahnt, in unserm Leibe Gott zu verherrlichen und zu tragen? Wenn die schmachvollen Seiten des Fleisches dessen Auferstehung verwehren, warum sind es nicht seine erhabenen Seiten, die sie wiederbringen? Denn es ist Gottes viel angemessener, das, was er verworfen hat, manchmal wieder zum Heil zurückzuführen, als das, was auch nur irgend einmal seinen Beifall hatte, dem Verderben preiszugeben.</p>
      <h2>11</h2><p>Soweit nun die Lobeserhebungen des Fleisches gegenüber seinen Feinden, die nichtsdestoweniger dessen ärgste Liebhaber sind! Denn niemand lebt so fleischlich als die, welche die Auferstehung des Fleisches leugnen, und wer die Strafe leugnet, macht sich auch nichts aus der Zucht. Von ihnen sagt klar und deutlich der Paraklet durch die Prophetin Priska: „Sie sind Fleisch und hassen doch das Fleisch.“ Wenn ihm eine so grosse Autorität zur Seite steht, dass es sogar zum Erwerb des Seelenheils beitragen kann, haben wir da noch nötig, auf Gottes Können, seine Macht und seine Freiheit zurückzugehen, ob er auch gross genug sei, das zerfallene, das verschlungene und auf irgend welche Weise abhanden gekommene Gezelt des menschlichen Leibes wieder herzustellen und aufzurichten? Hat er uns nicht auch Belege davon auf dem grossen Schauplatz der Natur hingestellt, damit niemand mehr danach zu dürsten brauche, Gott zu erkennen, den man sich nicht anders vorzustellen hat, als alles vermögend.</p><p>Unter den Philosophen freilich gibt es solche, welche behaupten, diese Welt sei ungeworden und ungeschaffen, viel besser aber ist es, dass fast alle Häresien diese Welt als entstanden und geworden ansehen und deren Erschaffung Gott zuschreiben. Glaube also fest, dass er diese ganze Welt aus nichts hervorgebracht habe, und du hast die Erkenntnis Gottes in dem Glauben, dass Gott eine so grosse Macht besitze. Denn einige, die zu schwach sind, vorerst zu glauben, dass dies das Frühere sei, stellen dafür lieber nach dem Vorgange der Philosophen die Lehre auf, er habe das Weltall aus einer vorhandenen Materie inauguriert. Aber auch wenn es in Wirklichkeit so wäre, auch dann müsste man sagen, er habe bei dieser Umbildung der Materie ganz andere Substanzen und ganz andere Formen hervorgebracht, als in der Materie selber vorher waren. Ich würde daher auch dann noch die Behauptung aufrecht erhalten, er habe aus nichts geschaffen — wenn er nämlich Dinge hervorbrachte, die noch gar nicht dagewesen waren. Denn wodurch unterscheidet es sich denn, aus nichts hervorgebracht werden oder aus etwas, da nicht gewesen sein gleichbedeutend ist mit nichts gewesen sein? So ist umgekehrt gewesen sein, gleichbedeutend mit etwas gewesen sein. Nun aber spricht, auch wenn ein Unterschied zwischen beidem vorhanden ist, dennoch beides zu meinen gunsten. Denn entweder hat Gott alles aus nichts hergestellt, dann wird er auch das in nichts verwandelte Fleisch wieder aus dem Nichts hervorziehen können, oder er hat alles aus einer anders beschaffenen Materie gestaltet, dann wird er das Fleisch, wenn es auf irgend eine Weise absorbiert ist, auch wieder hervorrufen können. In jedem Falle ist der, welcher etwas gemacht hat, auch imstande, es wieder zu machen, da ja machen mehr ist als wiedermachen, und die Entstehung verleihen mehr als sie wieder verleihen. Somit muss man die Wiederherstellung des Leibes für leichter erachten als seine erste Herstellung.</p>
      <h2>12</h2><p>Richte nun deinen Blick auf die Bethätigungen der göttlichen Macht selbst, die dem analog sind. Der Tag stirbt hin, es wird Nacht; er wird allüberall in Finsternis begraben. Der Glanz der Schöpfung verdunkelt sich und alles hüllt sich in Schatten. Alles entfärbt sich, schweigend und wie verblüfft; überall ist Stillstand und Ruhe aller Dinge. Das ist die Trauer um das verlorene Licht. Und dennoch erwacht es samt seinem Gefolge und seinen Gaben wiederum mit der Sonne, noch ganz dasselbe, unversehrt und vollständig über den ganzen Erdkreis; nun tötet es seinen Tod, die Nacht; es zerbricht sein Grab, die Finsternis; es wird sein eigener Erbe, bis endlich auch die Nacht wieder erwacht, auch ihrerseits mit all ihrer Zubehör. Denn auch die Strahlen der Sterne, welche in der Morgenglut erloschen waren, werden wieder angezündet; es stellen sich wieder ein die Planeten, welche die Zeitperiode des Verschwindens dem Blick entzogen hatte; es erscheint die Mondscheibe, welche durch den Lauf des Monats kleiner geworden, wieder in ihrem früheren Schmuck.</p><p>Zurück kehren Winter und Sommer, Frühling und Herbst mit ihren Triebkräften, Gewohnheiten und Produkten. Denn auch das Verhalten der Erde hängt vom Himmel ab, dass die Bäume sich wieder bekleiden nach der Entblätterung, dass die Blumen sich wieder färben, dass die Kräuter von neuem ansetzen und dieselben Samenkörner hervorbringen wie die, welche verbraucht wurden, ja auch nicht einmal eher welche hervorbringen, als bis dieselben verschwunden sind. Wunderbares Verhältnis! Aus einer Verderberin wird sie Erhalterin; sie entwendet, um wiederzubringen; sie verdirbt, um zu bewahren; sie beschädigt, um wiederherzustellen; sie zehrt auf, um reichlicher wiederzugeben, und stellt in reicherer und schönerer Weise wieder zurück, was sie vernichtet hat, mit wirklichem Wucherzins nach dem Untergang, mit Aufgeld nach dem Betrug, mit Gewinn nach dem Verlust.</p><p>Um es mit einem Male zu sagen, die ganze Schöpfung ist auf Wechsel eingerichtet. Alles, was du antriffst, ist schon dagewesen; wenn du etwas verlierest, es gibt nichts, was nicht wiederkommt. Alles kehrt, wenn es entschwunden, zum Bestande zurück; alles fängt dann an, wann es aufgehört hat; alles nimmt sein Ende, um zu entstehen. Nichts geht zu Grunde, es sei denn zu seiner Erhaltung. Dieser gesamte regelmässige Wechsel der Dinge ist ein Zeugnis für die Auferstehung der Toten. Gott hat dieselbe in seinen Werken früher als in seinen Schriften vorgezeichnet; er hat sie durch seine Macht eher gepredigt als durch sein Wort. Er hat zu deinem Nutzen die Natur als Lehrmeisterin vorausgeschickt mit der Absicht, die Prophezie nachzusenden, damit du, ein Schüler der Natur, der Prophezie leichter Glauben schenkest, damit du es sogleich annehmest, wenn du hörst, was du überall schon gesehen hast, und nicht mehr zweifelst, dass Gott, den du als den Wiederhersteller aller Dinge schon kennst, auch der Wiedererwecker des Fleisches sei. Und fürwahr, wenn alles aufersteht zum Nutzen des Menschen, und wenn für den Menschen, dann folgerecht auch zum Nutzen des Leibes, was sollte man dazu sagen, wenn er selber, um dessentwillen und zu dessen Nutzen nichts vergeht, selbst gänzlich zu Grunde ginge?!</p>
      <h2>13</h2><p>Wenn das Weltall noch zu wenig Sinnbild der Auferstehung ist, wenn die Schöpfung nichts derart anzeigt, weil von den einzelnen Dingen in derselben nicht sowohl ein Sterben als ein Aufhören ausgesagt und keine Wiederbeseelung, sondern nur eine Wiederherstellung angenommen wird, so vernimm nun noch ein ganz vollständiges und zuverlässiges Beispiel dieser Hoffnung. Sein Gegenstand ist ein beseeltes, des Lebens und Sterbens fähiges Wesen. Ich meine nämlich den nur dem Orient angehörigen Vogel, der, durch seine Einzigkeit ausgezeichnet, in bezug auf Nachkommenschaft ein Wunder der Natur ist, der, sich selbst freiwillig begrabend, sich selbst erneuert, an seinem Geburtstage sterbend und wieder eintretend abermals zum Phönix wird, nachdem er schon nichts mehr war, abermals er selber, er, der nicht mehr war, ein anderer und doch derselbe. Was gibt es Ausdrücklicheres und Bezeichnenderes in dieser Beziehung, oder für welche Sache findet sich eine so zutreffende Bestätigung? Gott sagt in der hl. Schrift auch: „Er wird blühen wie ein Phönix“, nämlich nach dem Tode und dem Begräbnis, damit man glaube, dass die Substanz des Körpers auch dem Feuer wieder entrissen werden könne. Nun hat aber der Herr den Ausspruch gethan, dass wir besser sind als viele Sperlinge; das würde nichts Grosses sein, wenn wir nicht auch besser wären als der Phönix. Und die Menschen sollten für immer vergehen, während arabische Vögel ihrer Auferstehung sicher sind?!</p>
      <h2>14</h2><p>Dieses ist vorläufig in ihren Umrissen gezeichnet, die Macht Gottes, welche er in Gleichnissen nicht sowohl ausgesprochen als ausgewirkt hat. Wir kommen nun zu seinen eigentlichen Befehlen und Beschlüssen, damit wir bei diesem Gegenstande die Einteilung in bester Ordnung treffen. Denn ausgegangen von der Würde des menschlichen Leibes, ob sie gross genug sei, dass ihm nach seinem Zerfall die Herstellung gebühre, haben wir im weitern Verlauf der Darstellung von der Macht Gottes gehandelt, ob sie von der Art sei, dass sie einer zerfallenen Sache die Herstellung zu verleihen pflege. Jetzt wünschte ich, wenn wir beides bewiesen haben, dass man auch untersuche, ob irgend ein Motiv von solchem Gewicht vorhanden sei, dass es die Auferstehung des Fleisches als eine Notwendigkeit und als etwas der Vernunft in jeder Weise ganz sicher Entsprechendes erheische; denn es liegt nahe, zu sagen: Gut, wenn der Leib der Wiederherstellung auch fähig und die Gottheit ihn wiederherzustellen imstande ist, so wird doch auch eine Ursache für die Wiederherstellung vorhanden sein müssen.</p><p>Vernimm also die Ursache davon, du, der du bei Gott in die Schule gehst, dem gütigsten und auch gerechtesten, dem gütigen in Rücksicht auf sich, dem gerechten in Rücksicht auf uns. Wenn der Mensch nicht gesündigt hätte, dann würde er bloss von der Güte Gottes etwas erfahren haben, infolge von dessen natürlichen Eigenschaften. Nun aber erfährt er auch dessen Gerechtigkeit, weil eine dazu zwingende Veranlassung vorhanden ist, aber auch so ist Gott immer noch der Gütigste trotz seiner Gerechtigkeit. Auch wenn er in Unterstützung des Guten und in Bestrafung des Bösen seine Gerechtigkeit zeigt, dienen beide Sentenzen dem Guten, indem er auf der einen Seite dafür eintritt, auf der andern es belohnt. Indes du wirst es mit Marcion vollständiger einsehen lernen, ob diese gesamte Thätigkeit Gott zukomme. Für jetzt genügt es, dass unser Gott mit Recht der Richter sei, weil er der Herr ist, mit Recht der Herr, weil der Schöpfer, mit Recht der Schöpfer, weil er Gott ist. Darum ist auch jener sogenannte Gott der Häretiker mit Recht nicht Richter; denn er ist nicht der Herr; mit Recht nicht der Herr, denn er ist nicht der Schöpfer, und ich weiss nicht mehr, ob der noch Gott sein kann, der nicht Schöpfer ist, was Gott doch ist, und nicht Herr, was der Schöpfer doch ist. Wenn es also dem Gott, dem Herrn und dem Schöpfer am meisten zusteht, das Gericht über den Menschen gerade in betreff der Frage anzustellen, ob er sich bemüht habe, seinen Herrn und Schöpfer zu erkennen und ihn zu ehren oder nicht, dann wird auch dieses Gericht in der Auferstehung zum Vollzug kommen. Darin beruht die Hauptursache, ja, sozusagen, die Notwendigkeit einer Auferstehung, in der Gott möglichst angemessenen Vornahme des Richteramts.</p><p>In betreff der Einrichtung desselben magst du nun untersuchen, ob der göttliche Sittenrichter über beide Bestandteile des Menschen zu Gerichte sitzt, über den Leib und die Seele. Denn was gerichtet werden soll, das muss auferweckt werden. Wir wissen zuvörderst, dass das Gericht Gottes für ein vollständiges und vollkommenes zu halten sei, weil es das letzte und schon aus diesem Grunde das ewig gültige ist, weil es auch insofern das gerechte ist, dass es für keinen zu gelinde, und weil es auch in der Beziehung Gottes würdig ist, dass es entsprechend der grossen Langmut Gottes ein vollständiges und vollendetes ist. Daher ist, behaupten wir weiter, die Vollständigkeit und Vollkommenheit des Gerichtes nur dann vorhanden, wenn der ganze Mensch vor dasselbe gestellt wird, mithin erscheint der ganze Mensch, der aus der Verbindung der beiden Wesenheiten besteht, vor ihm. Darum muss er, der in seiner Ganzheit gerichtet werden soll, auch in beiden Wesenheiten dargestellt werden. Denn wenn er nicht nach seiner Wesenheit lebte, so würde er überhaupt nicht leben. In derselben Beschaffenheit also, wie er in seinem Leben war, wird er gerichtet; denn er soll eben über sein Leben gerichtet werden. Das Leben ist die Ursache, warum das Gericht stattfindet, und dies muss sich über eben so viele Substanzen erstrecken, als zur Lebensthätigkeit gehören.</p>
      <h2>15</h2><p>Gut denn, mögen nun unsere Gegner den Zusammenhang des Leibes mit dem Geiste schon zum voraus in Hinsicht auf die Lebensthätigkeiten spalten, um das Wagnis unternehmen zu können, ihn auch bei der Belohnung für die Lebensthätigkeiten zu spalten! Mögen sie die Gemeinsamkeit des Wirkens leugnen, um auch die der Belohnung leugnen zu können! Das Fleisch habe keinen Anteil am Gerichte, wenn es an der Veranlassung dazu nicht beteiligt gewesen ist! Mag die Seele allein zurückgerufen werden, wenn sie allein dahinscheidet!</p><p>Aber sie scheidet ebensowenig für sich allein dahin, als sie dasjenige für sich allein durchlaufen hat, woraus sie scheidet, ich meine das gegenwärtige Leben. Die Seele verbringt so wenig das Leben für sich allein, dass wir nicht einmal die blossen Gedanken, welche nicht zur Verwirklichung durch den Leib gelangen, von der Gemeinschaft mit dem Leibe trennen. Denn, was die Seele im Herzen thut, das thut sie im Fleische, mit dem Fleische und durch das Fleisch. So macht denn der Herr auch gerade diesen Teil des Leibes, das Bollwerk der Seele, beim Tadel der Gedanken verantwortlich. „Warum denkt Ihr Böses in Euren Herzen?“ und: „Wer ein Weib ansieht, um sie zu begehren, der hat im Herzen die Ehe gebrochen.“ Also ist der Gedanke auch ohne That und ohne Verwirklichung eine Handlung des Leibes. Aber auch wenn im Gehirn oder in der Mitte des Raumes, der die Augenbrauen trennt, oder wohin sonst die Philosophen den Hauptpunkt für die Wahrnehmungen, das, was man das Hegemonikon nennt, verlegen, jedenfalls wird der Sitz des Denkens der Seele aus Fleisch bestehen. So lange die Seele sich im Körper befindet, ist sie niemals ohne den Körper. Sie thut nichts ohne den, ohne welchen sie nicht ist. Nun untersuche noch lange, ob die Gedanken auch durch den Leib vor sich gehen, sie, die mit Hilfe des Leibes äusserlich erkannt werden! Beschäftigt sich die Seele mit irgend etwas, so gibt das Gesicht davon ein Zeichen; das Antlitz ist der Spiegel für alle Absichten. Mögen sie denn dem Bestandteile, welchem sie die Teilnahme an dem Gedanken nicht abszuprechen imstande sind, den Anteil an den Thaten absprechen!</p><p>Und da zählen diese Leute noch die Mängel und Fehltritte des Leibes auf — gut, dann wird also der Delinquent seine Strafe bekommen. Wir aber halten ihnen auch die guten Seiten des Leibes entgegen; es wird also auch das brav Handelnde seine Belohnung bekommen. Wenn es auch die Seele ist, die eigentlich wirkt und zu allem antreibt, so ist doch der Leib der gehorchende Teil. Es ist unstatthaft, Gott für einen ungerechten oder fahrlässigen Richter zu halten. Er wäre aber ungerecht, wenn er den Teilnehmer an den guten Werken von den Belohnungen ausschlösse, und fahrlässig, wenn er den Teilnehmer am Bösen straffrei liesse, während jeder menschliche Urteilsspruch für um so vollkommener angesehen wird, je mehr er auch die untergeordneten Teilnehmer an einer Handlung heranzieht, ohne sie zu schonen oder sie zu verkürzen, so dass sie also mit den eigentlichen Urhebern sowohl die Strafe als die Belohnung teilen.</p>
      <h2>16</h2><p>Wenn wir der Seele das Amt der Leitung, dem Leibe das des Gehorchens zuteilen, so müssen wir uns vorsehen, dass sie nicht diese Wahrheit durch eine gegenteilige Argumentation umstossen und den Leib in den Dienst der Seele bringen, aber nicht in der Weise eines Dieners, um nicht gezwungen zu werden, ihn infolge davon als deren Gefährten anzuerkennen. Sie werden nämlich sagen, Diener und Genossen haben die Selbstbestimmung in betreff ihres Dienens und ihres Genosseseins, sowie die Gewalt über ihren Willen in beiden Beziehungen, da sie Menschen sind. Deshalb teilen sie sich auch mit den eigentlichen Anstiftern, denen sie ihre Mitwirkung freiwillig zur Verfügung stellen, in das Verdienst. Der Leib hingegen, der aus eigener Kraft nichts denkt und nichts fühlt, der auch das Wollen oder Nichtwollen nicht besitzt, erscheint vielmehr wie ein Gefäss der Seele, wie ein Instrument, nicht wie ein Diener. Daher sitzt der Richter bloss für die Seele, wie sie sich des Leibes als Gefäss bedient habe, auf seinem Richterstuhl; das Gefäss selber aber wird nicht Gegenstand des Richterspruches, so wenig wie der Becher verurteilt wird, wenn er zur Giftmischerei gedient hat, noch das Schwert zu den wilden Tieren verdammt wird, mit welchem jemand einen Raubmord damit vollbracht hat.</p><p>Gut, dann ist also der Leib auch schuldlos insofern, dass ihm die bösen Thaten nicht zugerechnet werden können, und nichts mehr verbietet, ihm wegen seiner Schuldlosigkeit die Wiederherstellung zuzubilligen. Denn obschon ihm dann weder die guten noch die bösen Thaten angerechnet werden, so steht es doch der göttlichen Güte besser an, das Schuldlose zu befreien. Wer wohlthätig ist, der muss das. Beweis der höchsten Güte aber ist es, auch das, was man nicht muss, zu geben. Und doch, was den Becher angeht — ich meine nicht einen Giftbecher, in welchen ein Sterbender sich hinein erbrochen hat, — sondern den Becher, der durch den Atem der Reiberin, des Archigallus, eines Gladiators oder Henkers, verpestet wurde, so frage ich, ob du ihn dir nicht ebenso verbitten würdest, als Küsse von solchen Leuten? Auch wenn er durch Unreinigkeiten, die von uns selbst herrühren, befleckt ist oder sonst unserem Geschmacke nicht zusagt, so pflegen wir ihn zu zerbrechen, je mehr wir dem Diener zürnen. Ein Schwert aber, das von Mordthaten trunken ist, wer wird es nicht aus seinem Hause und vollends aus seinem Schlafgemach oder gar von seinem Kopfkissen weit entfernen, im Glauben, er werde sonst von nichts als Spukerscheinungen solcher Seelen träumen, die den Bettgenossen ihres Blutes beängstigen und beunruhigen? Dagegen wird der Becher, der von nichts Bösem weiss und sich durch treuen Dienst empfohlen hat, auch wohl von den Kränzen dessen, der aus ihm trinkt, mitgeschmückt oder durch Anheften von Blumen geehrt. Das Schwert aber, das in einem verdienstvollen Kampfe von Blut gerötet worden und besser als das Schwert des Mörders ist, wird als Weihegeschenk den Lohn für sein Verdienst erhalten.</p><p>Es kommt also wirklich vor, dass auch gegen Gefässe und Werkzeuge ein Urteilsspruch ergeht, so dass auch sie am Lose ihrer Herren und Eigentümer teilnehmen. Damit dürfte ich auch den Beweis geführt haben, wenngleich die Verschiedenheit der Dinge einer Analogie entbehrt. Denn jedes Gefäss und Werkzeug wird von anderswoher genommen, und sein Stoff befindet sich durchaus ausserhalb der menschlichen Wesenheit. Der Leib aber, im Mutterleibe keimend und sich bildend, mit der Seele mitgeschaffen von Anfang an, bleibt bei jeder Handlung ihr innig zugesellt. Denn wenngleich er vom Apostel ein Gefäss genannt wird, welches man in Ehren halten soll, so wird er gleichwohl von ihm als der äussere Mensch bezeichnet. Er ist der erste Lehm, welcher bezeichnet wurde mit der Aufschrift Mensch, nicht der Lehm, woraus der Becher, das Schwert oder Gefäss besteht. Denn die Benennung Gefäss hat er nur wegen seiner Aufnahmefähigkeit erhalten, vermöge deren er die Seele aufnimmt und enthält, Mensch aber heisst er in Rücksicht auf seine Teilnahme an der Natur, welche ihn bei den einzelnen Thätigkeiten nicht als Werkzeug hinstellt, sondern als ein dienendes Wesen. So wird denn das dienende Wesen, obschon es aus sich nichts denkt, auch vor Gericht gestellt werden, weil es ein Teil dessen ist, was denkt, und nicht sein blosses Hausgerät. Darum hält auch der Apostel, obwohl er sehr gut weiss, dass das Fleisch durch sich selbst nichts thut, was nicht der Seele anzurechnen wäre, es dennoch für ein sündiges, damit man nicht glaube, es bleibe deswegen vom Gericht frei, weil es seine Antriebe von der Seele zu erhalten scheint. So sagt er auch da, wo er einige löbliche Werke des Fleisches anzeigt: „Verherrlichet und traget Gott in Eurem Fleische“, obwohl er gewiss ist, dass auch diese Antriebe durch die Seele geschehen. Er schreibt sie dem Fleische deswegen zu, weil er ihm auch Lohn in Aussicht stellt. Andernfalls hätte eine Anschuldigung gegen ein Wesen, welches der Schuld gänzlich fern steht, keinen Sinn, ebensowenig als eine Aufmunterung bei einem Wesen, das mit der Verherrlichung nichts zu schaffen hat. Sowohl Anklage als Aufmunterung wären dem Fleische gegenüber gegenstandslos, wenn es einen Lohn, wie er in der Auferstehung erlangt wird, nicht gäbe.</p>
      <h2>17</h2><p>Weniger einsichtsvolle Anhänger unserer Meinung könnten vielleicht glauben, der Leib müsse auch deshalb vor Gericht gestellt werden, weil sonst die Seele, als körperlos, keiner Empfindung von Qual oder Wohlsein fähig wäre, da sie unkörperlich ist. Letzteres meint nämlich der grosse Haufe. Wir aber bekennen uns auch hier zur Körperlichkeit derselben und liefern in einem eigenen Werke den Beweis dafür, dass sie eine besondere Art von Dichtigkeit ihrer Substanz besitzt, wodurch sie sowohl zu fühlen als zu leiden imstande ist. Denn dass die Seelen, obwohl sie noch überkleidet und von ihrem Leibe getrennt sind, auch jetzt schon in der Unterwelt gequält oder getröstet werden, das dürfte das Beispiel des Lazarus beweisen.</p><p>Ich lasse daher die Gegner den Einwand erheben: Also, die Seele, welche ihre besondere Körperlichkeit hat, wird auch für sich allein imstande sein, zu leiden und zu fühlen, so dass sie einer Wiederherstellung des Fleisches nicht bedarf. — Im Gegenteil, sie wird sie bedürfen in dem Sinne, als wäre sie ohne das Fleisch nicht imstande, etwas zu empfinden, sondern weil sie notwendig in der Gesellschaft mit dem Leibe empfinden muss. Denn wie die Seele mit ihren eigenen Kräften ausreicht zum Behuf des Handelns, so auch zum Leiden. Zum Handeln reicht sie aber mit ihren Kräften nicht ganz aus. Denn aus ihrer eigenen Kraft vermag sie nur zu denken, zu wollen, zu wünschen und zu planen; zum Vollbringen aber muss sie auf die Thätigkeit des Fleisches warten. Ebenso ist es auch hinsichtlich des Leidens; sie verlangt auch zum Leiden nach der Mitgenossenschaft des Leibes, um in ebenso vollkommener Weise leiden zu können, als sie ohne ihn mit Vollständigkeit zu handeln nicht vermochte.</p><p>Deshalb zahlt sie für die Dinge, wozu sie mit ihren eigenen Kräften ausreichte, vorläufig die Sühne: für das Begehren, das Denken und das Wollen. Wenn die genannten Thätigkeiten zur Vollständigkeit des Verdienstes genügten und keine Thaten dazu verlangt würden, so würde weiterhin auch zur Vollkommenheit des Gerichtes die Seele allein vollständig ausreichen, indem sie über das zu richten wäre, was zu thun sie für sich allein das Vermögen hatte. Da nun aber auch für die Thaten der Lohn nicht ausbleiben kann, die Thaten sich aber mit Hilfe des Leibes vollziehen, so reicht es schon nicht mehr aus, dass die Seele ohne den Leib beseligt oder gequält werde wegen der Werke, die auch dem Fleische angehören, obschon sie einen Körper und Glieder hat. Diese genügen ihr ebensowenig zum vollständigen Empfinden als zum vollkommenen Handeln. Daher leidet sie in der Unterwelt auch nach Massgabe ihres Handelns; sie kostet zuerst das Urteil, wie sie auch die erste war, die dem Vergehen den Eintritt gestattet hat; sie erwartet aber noch den Leib, damit sie mit Hülfe dessen, dem sie ihre Gedanken anvertraut hat, ihre Thaten wieder gut mache. Somit wird der Grund, warum das Gericht auf das äusserste Weltende angesetzt ist, eben der sein, dass die göttliche Strafsentenz in der Wiederherstellung alles Fleisches ihre Vollendung finde. Im andern Falle, wenn sie bloss für die Seelen allein bestimmt wäre, würde sie nicht erst am Weltende zu erwarten sein, wovon die Seelen jetzt schon in der Unterwelt den Vorgeschmack empfinden.</p>
      <h2>18</h2><p>Soviel möchte ich als Unterbauten errichtet haben, um den Sinn der Schriftstellen, welche ein Wiedererscheinen des Leibes in Aussicht stellen, zu sichern. Da für dasselbe so viele Gewährschaften von höchster Beweiskraft sprechen: die Vorzüge der betreffenden Substanz selbst, die Macht Gottes, dann die vorhandenen Beweise derselben, die Rücksichten auf das Gericht und dessen wesentliche Erfordernisse, so wird es nicht zu umgehen sein, die Schriftstellen in dem durch diese so zahlreichen Gewährschaften gebotenen Sinne zu verstehen, nicht aber den Klügeleien der Häretiker entsprechend, die aus blosser Ungeneigtheit zum Glauben hervorgehen. Man hält es bloss für etwas Unglaubliches, dass eine durch Vernichtung unfindbar gewordene Substanz wieder hergestellt werde, nicht weil es für die betreffende Substanz selber unerreichbar oder für Gott unmöglich und für das Gericht unpassend wäre. Jene Lehre wäre allerdings unglaublich, wäre sie nicht von Gott verkündet worden. Sie müsste jedoch, wäre sie auch nicht von Gott verkündigt worden, von selbst vorausgesetzt werden, als gerade deswegen nicht ausdrücklich verkündigt, weil sie durch so viele Autoritäten von vornherein nahegelegt ist. Ertönt aber nun diese Lehre sogar aus dem göttlichen Munde selber, so darf sie nicht im entferntesten anders verstanden werden, als jene Gewährschaften, wodurch sie, auch abgesehen von den göttlichen Aussprüchen, gepredigt wird, es verlangen.</p><p>Sehen wir uns also zuerst danach um, unter welchem Titel diese Hoffnung bekannt gemacht worden sei. Eine einzige Bekanntmachung Gottes, meine ich, ist es, die bei allen aushängt: „Auferstehung der Toten!“ Zwei leicht verständliche, bestimmte, propere Worte! An sie will ich mich halten und untersuchen, an welche Substanz sie gerichtet sind. Wenn ich höre, dass dem Menschen „Auferstehung“ in Aussicht stehe, so werde ich notwendigerweise fragen müssen, was an ihm denn das Schicksal gehabt habe, hinzufallen, da ja doch wohl nur das ein Aufstehen zu erwarten hat, was zuvor hingefallen ist. Wer nicht weiss, dass der Leib im Tode hinfällt, der kann auch nicht wissen, dass er steht im Leben. Den Urteilsspruch Gottes: „Du bist Erde und wirst zur Erde werden“ verkündigt die Natur. Wer das nicht gehört hat, der sieht es. Jeder Tod besteht in einem Hinstürzen der Glieder. Diesem Lose des Leibes hat der Herr selbst Ausdruck gegeben, da er, mit derselben Substanz überkleidet, sagte: „Zerstöret diesen Tempel, und ich werde ihn in drei Tagen wieder aufrichten“. Er gab damit zu verstehen, wen die Zerstörung treffe, wen das Verschwinden, wen das Hinfallen, wen also auch das wieder aufgerichtet und aufgehoben werden. Wiewohl er eine Seele in sich trug, die bange war bis zum Tode, so doch keine, die im Tode hinfiel; denn es heisst in der hl. Schrift: „Er hatte dieses aber von seinem Leibe gesagt“.</p><p>So ist es denn also der Leib, welcher im Tode hinstürzt und vom Hinfallen den Namen Kadaver erhält. Von der Seele dagegen braucht man den Ausdruck fallen gar nicht; denn sie stürzt nicht hin ihrer Lage nach. Sie ist es im Gegenteil, welche, wenn sie ausgehaucht wird, das Hinstürzen des Körpers bewirkt, sowie sie es auch ist, welche ihn, wenn sie wieder einzieht, von der Erde aufrichten wird. Was durch seinen Eintritt die Aufrichtung bewirken wird, das kann nicht fallen; was durch seinen Hinausgang zu Boden wirft, das kann nicht hinstürzen. Ich will mich noch knapper ausdrücken, die Seele fällt nicht einmal mit dem Körper gemeinschaftlich in Schlaf und schnarcht auch nicht mit dem Leibe. Denn sie ist sogar im Schlafe noch regsam und bewegt; sie würde aber ruhen, wenn sie daläge, und daliegen, wenn sie hinstürzte. So fällt sie dem wirklichen Tode nicht selber zur Beute, so wenig als seinem Nachbilde.</p><p>Betrachte nun in gleicher Weise, an welche Substanz sich der darauffolgende Ausdruck „der Toten“ hefte. Wir müssen freilich hierbei zugeben, dass die Häretiker zuweilen der Seele Sterblichkeit zuschreiben. Würde die sterbliche Seele zur Auferstehung gelangen, dann wäre dies ein günstiges Vorzeichen dafür, dass sie dem Leibe, der ebenso sterblich, die Auferstehung mitteilen werde. Doch es muss nunmehr dem betreffenden Ausdruck seine Bestimmung vindiziert werden. Weil aufstehen Sache eines hingefallenen Wesens ist, nämlich des Leibes, so wird letzterer auch in dem Namen „Toter“ stecken, weil es sich um das Aufstehen hingefallener Wesen handelt, und das sind eben die Toten. So lernen wir es auch von Abraham, dem Stammvater des Glaubens, dem Mann der göttlichen Freundschaft. Da er nämlich zur Beerdigung der Sara von den Söhnen Cheth einen Platz forderte, drückte er sich also aus: „Gebt mir den Besitz eines Grabes bei Euch, und ich werde mein Totes begraben“, natürlich den Leib. Denn zum Begraben der Seele würde er keinen Platz begehrt haben, auch wenn er sie für sterblich gehalten und sie wirklich verdient hätte, „das Tote“ genannt zu werden. Wenn also der Körper das Tote genannt wird, so wird die Auferstehung, da sie Auferstehung der Toten genannt wird, eine Auferstehung der Körper sein.</p>
      <h2>19</h2><p>Die Prüfung besagten Titels und seines Inhalts, welche die Worte in ihrer eigentlichen Bedeutung nimmt und verteidigt, wird dahin operieren müssen, dass, wenn die Gegenpartei die Sache etwas durch Vorschieben von Figuren und Rätseln trübt, immer das Handgreiflichere die Oberhand erhalte und das Ungewisse durch das Gewisse abgewiesen werde. Sie klammern sich nämlich an eine sehr gewöhnliche Form der prophetischen Ausdrucksweise, die häufig — aber doch nicht immer — allegorisch und figürlich ist, und schwächen die Bedeutung der Auferstehung, die ganz deutlich angekündigt ist, zu einer bloss bildlichen ab, indem sie behaupten, dass auch das Sterben nur geistig zu verstehen sei. Es sei nämlich nicht das Sterben in Wirklichkeit, welches wir stets vor Augen haben, die Trennung der Seele vom Leibe hier gemeint, sondern die Unkenntnis Gottes, wodurch der Mensch, Gott abgestorben, im Irrtum darnieder liegt geradeso wie im Grabe. Und darum sei es auch für eine Auferstehung zu halten, wenn jemand den Zugang zur Wahrheit gefunden habe, dadurch für Gott wieder beseelt und wieder belebt, nach Beseitigung des Todes der Unwissenheit, gleichsam aus dem Grabe des alten Menschen hervorgehe. Denn der Herr habe die Schriftgelehrten und Pharisäer auch mit übertünchten Gräbern verglichen. Von dem Zeitpunkt an also, wo man den Herrn in der Taufe angezogen habe, habe man durch den Glauben die Auferstehung mit ihm erlangt.</p><p>Durch diesen Kunstgriff pflegen sie auch bei Unterredungen häufig die unsrigen zu fangen, als wenn sie ihrerseits ebenfalls die Auferstehung zugäben. Um nicht gleich vor den Kopf zu stossen, wenn sie sofort die Auferstehung leugnen, sagen sie: Wehe dem, welcher nicht in diesem Fleische aufersteht. Im stillen aber denken sie sich dabei ihrer Wissenschaft entsprechend: Wehe dem, welcher nicht, so lange er in diesem Leibe lebt, die häretischen Geheimlehren erkannt hat! Denn das ist ihre Auferstehung. Viele aber haben bei der Auferstehung das Herausgehen der Seele im Auge und erklären, aus dem Grabe Hervorgehen heisse: die Welt verlassen, weil die Welt der Wohnort der Toten sei, d. h. der Menschen, die Gott nicht kennen, oder sie verstehen es sogar vom Körper selbst, weil der Körper, als Kerker dienend, die eingeschlossene Seele im Tode dieses zeitlichen Lebens festhalte.</p>
      <h2>20</h2><p>Wegen solcher Hypothesen also will ich nun ihr erstes Bollwerk zerstören, nämlich, dass sie behaupten, die Propheten hätten alles nur in Bildern verkündigt. Wenn das richtig wäre, so könnten die Bilder selber nicht mehr unterschieden werden, wofern nämlich nicht auch wirkliche Dinge vorausgesagt wurden, nach welchen die Bilder gezeichnet sind. Oder vielmehr, wenn alles nur Figuren sind, was wird denn das sein, wovon sie die Figuren sind? Wird man einen Spiegel vorhalten, wenn nirgendswo ein Gesicht ist? Mithin ist nicht alles Bild, sondern es gibt auch Wirklichkeiten, nicht alles Schatten, sondern es gibt auch Körper, dergestalt nämlich, dass einige wichtigere Prophezeiungen auf den Herrn selbst auch ganz klar lauten. Zum Beispiel, die Jungfrau empfing in ihrem Mutterleibe nicht figürlich und gebar den Emmanuel, den Gottmituns, nicht uneigentlicher Weise; und wenn er „die Kraft von Damaskus und die Beute von Samaria“ auch in nur uneigentlicher Weise empfangen sollte, so sollte er doch in buchstäblicher Weise „wieder kommen zum Gericht mit den Ältesten und den Ersten des Volkes.“ Denn es haben ja auch „gegen ihn getobt die Heiden“ — in der Person des Pilatus — und „die Völker Eitles gegen ihn ersonnen“ — in der Person Israels. „Es haben die Könige der Erde dagestanden“ — Herodes — und „die Obrigkeiten sich gegen ihn versammelt,“ — Annas und Caiphas — „gegen den Herrn und seinen Gesalbten“. Er ist „wie ein Lamm zur Schlachtbank geführt worden, und wie ein Schaf vor dem, der es schert“ — vor Herodes — „stumm ist, so öffnete er seinen Mund nicht“; „seinen Rücken gab er preis den Geisselhieben, seine Wangen den Backenstreichen, und sein Gesicht wandte er nicht ab vor dem Auswurf ihres Speichels. Er wurde unter die Gottlosen gerechnet; an Händen und Füssen durchbohrt, über sein Gewand musste er das Los werfen lassen, den bittern Trank und das Kopfschütteln der Spötter hinnehmen, nachdem er von dem Verräter auf dreissig Silberlinge geschätzt war.“</p><p>Wo sind in diesen Stellen des Isaias die Figuren, bei David die Bilder, die Gleichnisreden bei Jeremias? Nicht einmal seine Wunderkräfte haben sie in blossen Bildern prophezeit. Oder sind etwa den Blinden nicht die Augen geöffnet worden, hat die Zunge der Stummen keinen Laut gegeben, sind die erschlafften Hände und die wankenden Knie nicht wieder erstarkt, ist der Lahme nicht gesprungen wie ein Hirsch?</p><p>Wenn wir diese Dinge allerdings auch in geistiger Weise zu deuten pflegen mit Beziehung auf die Heilung entsprechender Seelenfehler durch den Herrn, so sind sie doch, da sie auch in körperlicher Weise in Erfüllung gingen, ein Zeichen, dass die Propheten auf beide Arten geredet haben, wobei jedoch bestehen bleibt, dass ihre unverhüllten, eigentlichen und von jedem Schleier der Allegorie freien Aussprüche zahlreicher sind, wie z. B., wenn sie vom Untergang von Völkern und Städten, Tyrus, Ägypten, Idumäa, Karthago, sprechen, wie z. B. wenn sie über die Schläge und Begnadigungen, die Israel treffen, über seine Gefangenschaft, Befreiung und dessen endliche letzte Zerstreuung reden. Wer wird hier nach Interpretationen und nicht vielmehr nach blossen Anwendungen suchen? Die Thatsachen sind in dem Geschriebenen enthalten, sowie auch das Geschriebene in den Thatsachen gelesen wird. So ist die Form der prophetischen Ausdrucksweise nicht <em>immer</em> und nicht bei <em>allen</em> Dingen allegorisch, sondern nur <em>zuweilen</em> und bei <em>einigen</em> Dingen.</p>
      <h2>21</h2><p>Wenn also doch zuweilen und bei einigen Dingen, warum sind sie denn nicht, höre ich einwenden, auch in der Ankündigung der Auferstehung geistig zu verstehen? Weil mehrfache Gründe dagegen vorhanden sind. Erstens nämlich, was wird aus der so ansehnlichen Menge göttlicher Schriftstellen werden, welche die leibliche Auferstehung so bündig bezeugen, dass sie auch nicht einmal den Gedanken an eine figürliche Deutung aufkommen lassen? Und dann würde es zweitens, wie wir schon oben angedeutet haben, billig sein, das Ungewisse auf Grund des Gewissen, das Undeutliche auf Grund des Deutlichen zu beurteilen, damit wenigstens bei dem Zwiespalt zwischen gewiss und ungewiss, deutlich und undeutlich der Glaube nicht zu Grunde gehe, die Wahrheit keine Gefahr laufe und nicht die Gottheit selbst, als sich nicht gleich bleibend, getadelt werde.</p><p>Sodann ist es nicht wahrscheinlich, dass gerade der Punkt der christlichen Heilslehre, der den Glauben in seinem ganzen Umfange in Anspruch nimmt und worauf sich die ganze Kirchenzucht gründet, in doppelsinniger Weise verkündigt und in dunkeln Worten hingestellt erscheine, da doch die Hoffnung auf die Auferstehung, nur wenn sie in Beziehung auf Lohn und etwaige Strafe klar und bündig ist, jemand zur Annahme der Religion bewegen wird, zumal einer solchen, welche sich dem öffentlichen Hasse ausgesetzt sieht. Kein sicheres Unternehmen kann bei einem unsichern Lohn bestehen, keine Furcht ist begründet bei einer nur zweifelhaften Gefahr. Nun aber hängt sowohl der Lohn als die etwaige Gefahr von dem wirklichen Eintritt der Auferstehung ab. Wenn nun schon die Ratschlüsse Gottes, welche einzelne Zeiten, Orte und Personen betreffen, in so klarer und bündiger Prophezeiung an dieselben gerichtet sind, was sollte man dazu sagen, wenn seine ewigen und allgemeinen, für das ganze Menschengeschlecht geltenden Anordnungen ihr eigenes Licht scheuen würden?! Sie müssen vielmehr, je wichtiger, auch desto klarer sein, gerade damit sie für wichtig gehalten werden. Und ich sollte doch denken, dass man Gott weder Missgunst noch List, weder die Unbeständigkeit noch den Wortprunk, womit öffentliche Ankündigungen hochgestellter Personen sonst wohl die Leute hänseln, zutrauen dürfe.</p>
      <h2>22</h2><p>iernach müssen wir unsere Blicke auf die Schriftstellen werfen, welche es als unzulässig erscheinen lassen, die Auferstehung entweder hier auf Erden in der Erkenntnis der Wahrheit bestehend zu denken, wie jene seelischen, um nicht zu sagen Geistesmänner, wollen, oder sie sofort auf den Ausgang aus dem Leben anzusetzen. Da der Zeitpunkt für unser gesamtes Hoffen in den hochheiligen Blättern festgesetzt ist und es nicht freisteht, ihn früher anzusetzen, als, denke ich, auf die Zeit der Ankunft Christi, so sind unsere sehnsuchtsvollen Wünsche auf den Ablauf dieser Zeitlichkeit gerichtet, auf den Untergang der Welt, den grossen Tag des Herrn, den Tag des Zornes und der Vergeltung, den jüngsten und verborgenen Tag, der keinem ausser dem Vater bekannt, und der doch durch Wunderzeichen, Erschütterung der Elemente und den Zusammenstoss der Nationen zum voraus gekennzeichnet ist. Ich würde, wenn Christus geschwiegen hätte — freilich sind auch die Prophezeiungen eine Stimme Christi — die Prophezeiungen aufschlagen, aber wichtiger ist, dass er sie mit seinem eigenen Munde besiegelt hat.</p><p>Von seinen Jüngern befragt, wann die Dinge eintreffen würden, welche er vorläufig über die Schicksale des Tempels hatte verlauten lassen, gibt er den Verlauf der Geschichtsperioden, erstlich den der jüdischen bis zur Zerstörung von Jerusalem, sodann den der gemeinsamen bis zum Schluss der Zeitlichkeit genau an. Nachdem er nämlich ausgesagt hat: „Dann wird Jerusalem von den Heiden zertreten werden, bis die Zeiten der Heiden erfüllt sind“, nämlich die Zeiten, wo sich Gott ihrer annehmen und sie mit den Resten Israels vereinigen will, da wendet er sich an den ganzen Erdkreis und diese ganze Zeitlichkeit und verkündet, ähnlich wie Joël, Daniel und der Chor sämtlicher Propheten, die zukünftigen Zeichen an Sonne, Mond und Sternen, den Zusammenstoss der Nationen und ihr Entsetzen über das Getöse des Meeres sowie die Unruhe der von Furcht und Erwartung der Dinge, die den Erdkreis treffen sollen, schaudernden Menschen. „Denn die Kräfte der Himmel“, sagt er, „werden erschüttert werden, und dann wird man den Sohn des Menschen auf den Wolken kommen sehen mit vieler Macht und Herrlichkeit. Wenn aber dies zu geschehen beginnt, so werdet Ihr Eure Häupter aufrichten und erheben, denn Eure Erlösung kommt heran.“ Und doch sagt er nur, sie komme heran, nicht, sie sei schon da, und „wann das anfange zu geschehen“, nicht, wenn es geschehen ist, weil dann, wenn es geschehen sein wird, die Erlösung wirklich da ist, bis dahin aber noch immer gesagt werden muss, sie sei nahe, indem er für jetzt die Gemüter aufrichtet und ermuntert zur nächsten Frucht, zur Hoffnung.</p><p>Hierfür wird auch ein Gleichnis beigefügt, das von den schwellenden Bäumen, deren Blütenstengeln und der Blüte, der dann folgenden Vorbotin der Frucht. „So sollt auch Ihr, wenn Ihr das alles geschehen sehet, wissen, dass das Reich Gottes nahe ist. Wachet also zu jeder Zeit, damit Ihr würdig erachtet werdet, allem dem zu entgehen, und vor dem Sohne Gottes bestehet“, nämlich dann, wenn zuvor alles durch die Auferstehung seine Vollendung gefunden hat. Wenn so also auch der Baum ausschlägt — in der Erkenntnis des Herrn, — so bekommt er doch zuvor erst Blüten und Früchte bei der Erscheinung desselben.</p><p>Wer ist es also, der den Herrn so unzeitiger, so bitterer Weise aufgefordert hat, bereits zur Rechten Gottes, die Erde zu zerschlagen nach dem Ausdruck des Isaias, die doch, sollte ich denken, noch unversehrt ist? Wo ist der, der nach Davids Worten die Feinde Christi ihm schon zu Füssen gelegt hat — schneller als Gott der Vater — während noch jede Volksversammlung durch Geschrei fordert, dass die Christen den Löwen vorgeworfen werden? Wer hat gesehen, dass Jesus ebenso vom Himmel herabgestiegen ist, in Gemässheit mit der von den Engeln gegebenen Bestimmung, wie die Apostel ihn hatten hinaufsteigen sehen? Noch haben die Juden nicht Stamm für Stamm an die Brust geschlagen, sehend auf den, den sie durchbohrt haben, niemand hat bis jetzt den Elias aufgenommen, niemand ist noch vor dem Antichrist entflohen, niemand hat noch den Untergang Babylons beweint. Und doch gibt es Leute, die schon auferstanden sind! Es sind aber nur Häretiker. Fürwahr, sie haben das Grab ihres Körpers verlassen, obwohl sie noch Fiebern und Geschwüren ausgesetzt sind! Sie haben die Feinde schon niedergetreten, obwohl sie noch mit den Mächtigen der Erde zu kämpfen haben! Jedenfalls herrschen sie auch schon, obwohl sie noch immer dem Kaiser geben müssen, was des Kaisers ist.</p>
      <h2>23</h2><p>Zwar lehrt der Apostel in seinem Briefe an die Kolosser, wir seien einmal „gestorben und abgeirrt und Feinde des Sinnes des Herrn gewesen, damals, als wir in den schlechtesten Werken wandelten“, sodann aber „mitbegraben mit Christus in der Taufe und mitauferweckt in ihm durch den Glauben an die Kraft Gottes, die ihn von den Toten auferweckt hat“. „Auch Euch, die Ihr tot waret in Sünden und in der Vorhaut Eures Fleisches, hat er mitbelebt mit ihm und Euch alle Sünden erlassen.“ Und wiederum: „Wenn Ihr mit Christus gestorben seid den Kindheitslehren der Welt, warum traget Ihr noch, als lebtet Ihr in der Welt, die Satzung?“ Wenn er uns in der Weise als geistig tot darstellt, dass er dabei doch noch unser künftiges leibliches Sterben zugibt, so leugnet er, wenn er uns schon für geistig Auferstandene ansieht, damit offenbar ebensowenig unsere künftige leibliche Auferstehung. So sagt er z. B.: „Wenn Ihr mit Christus auferstanden seid, so suchet, was droben ist, wo Christus zur Rechten Gottes sitzt; denket an das, was droben, nicht an das, was hier unten ist.“ In dieser Weise werden wir, lehrt er, dem Geiste nach auferstehen, womit wir bis jetzt ja allein erst nur das Himmlische zu erfassen imstande sind. Wir würden es nicht suchen und nicht daran denken, wenn wir es besässen. Er fügt auch noch hinzu: „Denn Ihr seid gestorben“ — nämlich den Sünden, nicht Euch selbst — „und Euer Leben ist mit Christo in Gott verborgen.“ Ähnlich Johannes: „Noch ist nicht offenbar, was wir sein werden; wir wissen, dass wir, wenn er es geoffenbart hat, ihm ähnlich sein werden.“</p><p>So viel fehlt also daran, dass wir bereits das wären, was wir nicht kennen; wenn wir es aber schon wären, so würden wir es kennen. Mithin ist das Schauen der Hoffnung in dieser Zeitperiode ein Schauen durch den Glauben, keine Gegenwart; kein Besitz, sondern eine Erwartung. In betreff dieser Hoffnung und Erwartung sagt Paulus im Galaterbriefe: „Im Geiste durch den Glauben sind wir der Hoffnung der Gerechtigkeit gewärtig.“ Er sagt nicht: Wir halten sie fest. Mit der Gerechtigkeit Gottes aber meint er die Gerechtigkeit als Folge des Gerichts, wo wir unser Urteil in betreff des Lohnes empfangen werden. Auf diese auch seinerseits harrend, schreibt er an die Philipper und sagt: „Wo ich auf irgend eine Weise zur Auferstehung gelange, zur Auferstehung von den Toten, nicht als hätte ich es schon ergriffen oder als wäre ich schon vollkommen.“ Er hatte doch gewiss Glauben und Kenntnis von allen Geheimnissen, er, das Gefäss der Auserwählung, der Lehrer der Heiden, und doch setzt er noch hinzu: „Ich jage ihm aber nach, ob ich es ergreife in dem, worin ich ergriffen bin von Christus.“ Und weiter: „Brüder, ich erachte nicht, als hätte ich es ergriffen, eins fürwahr, vergessend des Vergangenen, strecke ich meine Hand zu den künftigen Dingen aus und laufe der untadeligen Palme nach, zu der ich gelangen soll“, natürlich zur Auferstehung von den Toten, jedoch erst zu seiner Zeit, wie er im Briefe an die Galater sagt: „Gutes thuend lasset uns nicht ermüden, denn zu seiner Zeit werden wir ernten.“ Ähnlich im Briefe an Timotheus in betreff des Onesiphorus: „Möge ihm der Herr geben, dass er Barmherzigkeit finde an jenem Tage.“ Für jenen Tag und jene Zeit empfiehlt er ihm selber auch „zu halten das Gebot unbefleckt, untadelig, bis zur Erscheinung des Herrn Jesu Christi, welche dieser zu schauen geben wird zu ihrer Zeit, er, der selige und alleinige Machthaber, der König der Könige und der Herr der Herren“, womit er Gott meint. Von diesen Zeiten redet auch Petrus in der Apostelgeschichte: „Thuet nun Busse und bekehret Euch, damit Eure Sünden getilgt werden, damit nun komme die Zeit der Tröstung vom Angesichte des Herrn und er Euch den vorherverkündigten Herrn Jesus Christus sende, welchen die Himmel aufnehmen müssen, bis zu den Zeiten der Erfüllung aller Dinge, die Gott geredet hat durch den Mund seiner heiligen Propheten.“</p>
      <h2>24</h2><p>Diese Zeiten lerne nun mit den Thessalonichern kennen. Wir lesen nämlich: „Wie Ihr umgekehrt seid von den Götzen zum Dienste des wahren und lebendigen Gottes und zur Erwartung seines Sohnes Jesus, den er von den Toten auferweckt hat, vom Himmel her.“ Und wiederum: „Wer ist unsere Hoffnung, unser Trost und unsere Freudenkrone, wenn nicht Ihr sie seid vor dem Herrn, unserem Gott, Jesus Christus, am Tage seiner Ankunft!“ Ebenso: „Vor Gott und unserem Vater bei der Ankunft unseres Herrn Jesu Christi mit allen seinen Heiligen!“ Dass über ihr Entschlafen nicht so sehr zu trauern sei, lehrt er zugleich mit dem Zeitpunkt der Auferstehung in den Worten: „Wenn wir geglaubt haben, dass Jesus gestorben und auferstanden ist, so wird Gott auch die, welche entschlafen sind, durch Jesus herbeiführen mit ihm selbst. Denn dies sagen wir Euch in den Worten des Herrn: dass wir, die wir leben, und die wir auch zurückbleiben für die Wiederkunft unseres Herrn, denen, die entschlafen sind, nicht zuvorkommen werden. Weil der Herr selbst in seinem Befehl, in der Stimme des Erzengels und in der Posaune Gottes herabsteigen wird vom Himmel und die in Christus Gestorbenen zuerst auferstehen werden. Dann werden wir, die wir noch leben, zugleich mit ihnen in die Wolken emporgehoben werden, Christus entgegen in die Luft, und so werden wir immerdar bei dem Herrn sein.“ Wo hat man sonst schon die Stimme eines Erzengels oder eine Posaune Gottes gehört, als nur in den Kammern der Häretiker? Denn wenn auch das Wort des Evangeliums, welches sie allerdings schon gerufen haben dürfte, eine Posaune Gottes genannt werden kann, so würden sie entweder dem Körper nach schon gestorben sein, um auferstehen zu können — wie kommt es dann aber, dass sie noch leben? — oder sie würden in die Wolken entrückt sein müssen — aber sie sind ja noch hier? Jedenfalls wären sie nach dem Ausspruche des Apostels als „die beklagenswertesten Menschen“, die nur auf dieses Leben ihre Hoffnung setzen, auszuschliessen, indem sie das, was für das künftige Leben verheissen ist, für das gegenwärtige vorweg nehmen, in betreff der Wahrheit in nicht geringerem Grade getäuscht, als Phygelus und Hermogenes.</p><p>Daher fügt in Voraussicht solcher Gesinnungen in eben dem Briefe an die Thessalonicher die Majestät des hl. Geistes noch bei: „Über die Zeiten und Zeiträume aber, Ihr Brüder, ist nicht nötig, Euch zu schreiben. Denn Ihr selbst wisst aufs genaueste, dass der Tag des Herrn kommen wird, wie ein Dieb in der Nacht. Wenn sie sagen werden: Friede, und alles sicher ist, dann wird ihnen der Untergang plötzlich bevorstehen.“ Im zweiten Briefe an sie aber schreibt er mit noch grösserer Bekümmernis: „Ich beschwöre Euch aber, Ihr Brüder, bei der Ankunft unseres Herrn Jesu Christi und unserer Vereinigung mit ihm, dass Ihr Euch nicht leicht im Geiste beunruhigen und verwirrt machen lasset, weder durch einen Geist noch durch eine Rede — nämlich der Pseudopropheten — noch durch einen Brief — nämlich von Pseudo-Aposteln — als wäre er von uns, der Tag des Herrn stände bevor. Möge Euch niemand auf irgend eine Weise verführen. Denn erst muss der Abfall kommen — nämlich von diesem Reiche — und der Mensch der Sünde — d. i. der Antichrist — sich enthüllen, der Sohn des Verderbens, der kämpfen und sich erheben wird gegen alles, was Gott oder Religion genannt wird, damit er sitze im Tempel Gottes, vorgebend, er sei Gott. Seid Ihr nicht mehr dessen eingedenk, dass ich Euch dieses sagte, als ich bei Euch war? Und was ihn nun zurückhält, damit er offenbar werde zu seiner Zeit, das wisst Ihr. Denn schon geht das Geheimnis der Gottlosigkeit vor sich, nur dass der Zurückhaltende ihn noch zurückhält, bis er den Platz räumen wird.“ — Wer denn? Kein anderer als der römische Staat, dessen Untergang und Verteilung unter zehn Könige der Antichrist herbeiführen wird. „Und dann wird der Mensch der Sünde enthüllt werden, den der Herr Jesus töten wird mit dem Hauche seines Mundes und zunichte machen mit dem Glanze seiner Ankunft, ihn, der kommt in der Wirksamkeit des Satans, in aller Macht und in den Zeichen und Wundern der Lüge und mit jeglicher Verführung der Ungerechtigkeit für die, welche verloren gehen.“</p>
      <h2>25</h2><p>Auch in der Apokalypse des Johannes wird der Verlauf der Zeiten entrollt, den auch „die Seelen der Martyrer unter dem Altare“, welche um Rache und Gericht rufen, abwarten gelernt haben, damit erst der Erdkreis „aus den Schalen der Engel“ seine Plagen austrinke, die Stadt der Unzucht durch die zehn Könige ihr verdientes Ende finde und das Tier, der Antichrist und sein Pseudoprophet, mit der Kirche Gottes den Kampf beginne, damit so, nachdem der Teufel inzwischen in den Abgrund verwiesen ist, die Auszeichnung der ersten Auferstehung von den Thronen aus geordnet und sodann den ins Feuer Geworfenen das Urteil der allgemeinen Auferstehung aus den Büchern gesprochen werde. Da also die hl. Schrift auch die Zustände der letzten Zeiten bekannt gibt und die gesamte Frucht der christlichen Hoffnung auf den Ausgang der Zeiten ansetzt, so leuchtet ein, dass entweder alles, was auch immer von Gott versprochen ist, in jener Zeit erfüllt werde — und dann ist das, was hier von den Häretikern behauptet wird, gegenstandslos — oder aber dass, wenn die Erkenntnis der Heilsgeheimnisse auch eine Auferstehung ist, unbeschadet dieser letztern auch noch an jene Auferstehung geglaubt werde, welche von der Predigt des Heiles auf das Weltende angesetzt wird. Und gerade darum, weil jene für geistig angesehen wird, folgt, dass diese für eine leibliche gehalten werden muss, weil, wenn für jenen Zeitpunkt gar keine Auferstehung angekündigt wäre, mit Recht diese allein und bloss als eine geistige aufrecht erhalten würde. Da sie aber für die letzten Zeiten angesagt wird, so ist sie für eine leibliche anzusehen, weil für jenen Zeitpunkt eine geistige nicht angekündigt ist. Warum sollte wohl eine abermalige Auferstehung von derselben Beschaffenheit, nämlich eine geistige, angekündigt werden, da dieselbe ja entweder jetzt abgemacht werden müsste ohne Unterschied der Zeit, oder erst beim allgemeinen Abschluss der Zeiten? Und so käme es mit viel mehr Recht <em>uns</em> zu, eine geistige Auferstehung zu behaupten, nämlich von der Annahme des Glaubens an, da wir die vollständige Auferstehung, nämlich die am Ende der Zeiten, ebenfalls anerkennen.</p>
      <h2>26</h2><p>Eins will ich noch auf die frühere Proposition in betreff der allegorischen Schriftstellen zur Antwort geben: Wir dürfen, auch auf die figürlichen Aussprüche der Propheten gestützt, eine körperliche Auferstehung behaupten. Denn siehe, der Ausspruch Gottes nennt den Menschen im Anfang Erde: „Erde bist Du und zur Erde wirst Du hingehen“, versteht sich der Substanz des Fleisches nach, welches von der Erde genommen wurde und, wie wir gezeigt haben, zuerst die Benennung Mensch erhielt. Er gibt mir damit eine Anleitung, auch alles das, was der Herr an Zorn oder Gnade über die Erde ausspricht, auf das Fleisch zu beziehen. Denn die Erde, die weder etwas Böses noch etwas Gutes gethan hat, ist ja seinem Gericht auch nicht einmal im eigentlichen Sinne anheim gefallen. Sie, die Blut getrunken hat, wird zwar verflucht, aber auch dies nur im Bilde, in Rücksicht auf das Fleisch, welches den Mord begangen hat. Wenn die Erde Hilfe erfährt oder Schaden leidet, so geschieht auch das des Menschen wegen, damit er durch das Geschick seines Aufenthaltsortes Hilfe oder Schaden erfahre. Noch viel mehr wird er das, was die Erde seinetwegen leidet, zu tragen haben. Und so möchte ich, wenn Gott der Erde drohet, lieber sagen, er drohe dem Fleische, und wenn er der Erde etwas verheisst, lieber darunter verstehen, dass er dem Fleische etwas verheisst, so z. B. bei David: „Der Herr regiert, es frohlocke die Erde“, d. i. die Leiber der Heiligen, für welche der Genuss des Reiches Gottes bestimmt ist. Dann fährt er fort: „Die Erde sah es und erbebte, die Berge zerflossen wie Wachs vor seinem Angesichte“,nämlich die Leiber der Gottlosen; und: „Sie werden sehen, wen sie durchbohrt haben“.</p><p>Wenn beiderlei Aussprüche einfachhin von der Erde als blossem Element zu verstehen sind, wie reimt es sich dann, dass dieselbe vor dem Angesichte des Herrn, über dessen Regieren sie oben frohlockte, nun erbebt und zerfliesst? So wird man die Worte bei Isaias: „Ihr werdet das Gute der Erde essen“ auf die Güter des Leibes beziehen können, welche demselben verbleiben, wenn er, im Reiche Gottes wieder hergestellt und engelhaft geworden, das erlangen wird, „was kein Auge gesehen, kein Ohr gehört hat und was in keines Menschen Herz gekommen ist.“ Sonst wäre es albern genug, wenn Gott zum Gehorsam einladen wollte, um der Feldfrüchte und Nahrungsmittel des jetzigen Lebens willen, welche er ja auch den Gottlosen und Lästerern zuteil werden lässt. Denn die Schöpfung ist dem Menschen einmal zu eigen gegeben, und Gott lässt regnen über Gute und Böse und seine Sonne aufgehen über Gerechte und Ungerechte. Es wäre meiner Treu ein grosses Glück für die Gläubigen, zu erlangen, was die Feinde Gottes und Christi auch haben und nicht nur gebrauchen, sondern auch missbrauchen, indem sie die Schöpfung selbst anbeten anstatt des Schöpfers. Man wird dann wohl Zwiebeln und Erdschwämme für „die Güter der Erde“ ansehen, während der Herr doch sagt, dass der Mensch nicht vom Brote allein leben werde.</p><p>Die Juden haben in dieser Weise ihre Hoffnung auf das Irdische allein gesetzt und verlieren darüber das Ewige, indem sie weder das vom Himmel versprochene Brot kennen, noch das Öl der göttlichen Salbung, den Wein des Geistes oder das Wasser der Seele, welche von dem Weinstocke Christi belebt wird. So halten sie ja sogar auch das Judenland im eigentlichen Sinne für das heilige Land selbst, da letzteres doch vielmehr auf den Leib des Herrn zu deuten ist, welcher von da an und an allen, die Christum angezogen haben, ein heiliges Land ist, wahrhaft heilig durch die Einwohnung des heiligen Geistes, wahrhaft von Milch und Honig fliessend vermöge der Lieblichkeit seiner Hoffnung, in Wahrheit ein Judenland vermöge der Freundschaft und Nähe Gottes. Denn nicht, wer es äusserlich ist, ist ein Israelit, sondern wer es im verborgenen ist. Darum ist das Fleisch auch der Tempel Gottes und jenes Jerusalem, an welches Isaias die Worte richtet: „Erhebe Dich, erhebe Dich, Jerusalem, bekleide Dich mit der Stärke Deines Armes; erhebe Dich wie zu Anbeginn des Tages“, d. h. in Unversehrtheit, wie sie war vor dem Vergehen und der Übertretung. Denn wie würden solche ermahnende und aufmunternde Zurufe für das Jerusalem passen, welches die Propheten getötet und die gesteinigt hat, die zu ihm gesandt sind, und schliesslich sogar ihn, seinen eigenen Herrn, durchbohrt hat?! Indessen es ist überhaupt nicht einmal die Erde, der das Heil versprochen wird; denn sie soll, mit der ganzen Gestalt der Welt untergehen. Auch wenn es jemand unternehmen sollte, das „heilige Land“ auf das Paradies zu deuten, worauf auch der Ausdruck „Land der Väter“, nämlich Land, des Adam und der Eva, passt, so wird es den Schein gewinnen, als würde dadurch dem Fleische die Wiedereinsetzung in das Paradies versprochen, welches so glücklich war, seine Wohnung darin zu bekommen, und der Mensch würde alsdann ebenso dorthin zurückversetzt, wie er daraus verstossen worden ist.</p>
      <h2>27</h2><p>Auch die Erwähnung von Kleidern in der hl. Schrift haben wir im Sinne der Hoffnung des Leibes allegorisch zu erklären. In der Apokalypse des Johannes heisst es nämlich beispielsweise: „Das sind die, welche ihre Gewänder nicht befleckt haben mit Weibern“; darunter werden die Jungfrauen verstanden und diejenigen, welche sich selbst verschnitten haben wegen des Reiches Gottes. Und so werden sie denn weiss gekleidet sein, d. h. in die Klarheit eines jungfräulichen Leibes. Auch im Evangelium kann man in dem „hochzeitlichen Kleide“ die Heiligkeit des Leibes wiedererkennen. Daher sagt Isaias da, wo er lehrt, welches das Fasten sei, das der Herr sich auserwählt hat, und über den Lohn für das Gute Angaben macht: „Dann wird Dein Licht hervorbrechen wie der Morgen und Dein Gewand wird schneller kommen“, doch wohl kein halbseidenes oder ein Pallium, sondern er wollte, dass man den Leib darunter verstehe, und hat so bei Gelegenheit der Erwähnung des Unterganges des Todes die Entstehung des wieder auferstehenden Fleisches verkündet. Also steht auch uns die Verteidigung der körperlichen Auferstehung mit Hilfe der Allegorie zu.</p><p>Wenn wir lesen: „Tritt ein mein Volk, in deine Vorratskammern….einen Augenblick, bis mein Zorn vorüber ist“, so werden die Vorratskammern wohl die Gräber sein, in welchen diejenigen eine kurze Zeit zu ruhen haben, die am Ende der Welt unter dem letzten Zorne durch die Gewalt des Antichrists umkommen. Oder aber, warum hat er es vorgezogen, sich des Ausdrucks „Vorratskammern“ zu bedienen und nicht des Namens irgend eines andern Aufbewahrungsortes, wenn nicht aus dem Grunde, weil in den Vorratskammern das gesalzene und zum Gebrauche bestimmte Fleisch aufbewahrt wird, welches daraus zu seiner Zeit soll hervorgeholt werden. Denn gerade so werden die Leiber mit Spezereien für das Begräbnis einbalsamiert und in Mausoleen und Grabmälern beigesetzt, um daraus wieder hervorzugehen, sobald es der Herr befiehlt. Da dies nun so zu verstehen ist — denn wo gäbe es sonst Vorratskammern, die uns vor dem Zorne Gottes als Zufluchtsörter dienen könnten? — und gerade deshalb, weil er sagt: „ <em>Bis</em> mein Zorn <em>vorüber</em>geht“, der nämlich, welcher den Antichrist vernichten wird, — so gibt er damit zu erkennen, dass der Leib aus dem Grabe, in welches er vor dem Ausbrechen des Zornes gebracht worden war, wieder hervorgehen werde. Denn aus den Vorratskammern wird nichts anderes herausgeholt, als was hineingetragen wurde, und die Auferstehung wird nach der Vertilgung des Antichrists vor sich gehen.</p>
      <h2>28</h2><p>Wir wissen aber, dass Prophezeiungen nicht nur in Worten, sondern auch mit Zuhilfenahme von Handlungen gegeben wurden. Sowohl in Worten als auch durch Handlungen wird die Auferstehung verkündigt, z. B. wenn Moses seine Hand in seinen Busen steckt, sie abgestorben wieder herauszieht, sie wieder hineinsteckt und lebendig herauswickelt. Ist dieses nicht ein Vorzeichen für den ganzen Menschen? indem durch jenes dreifache Zeichen mit Beobachtung der Aufeinanderfolge bemerklich gemacht wird die dreifache Macht Gottes, welche den Teufel, die Entsetzen erregende Schlange, erstlich dem Menschen unterwerfen, alsdann das Fleisch aus dem Versteck des Todes hervorziehen und endlich alles Blut im Gerichte zurückfordern wird. In betreff des letztern spricht bei demselben Propheten Gott: „Ich will Euer Blut von allen wilden Tieren zurückfordern, sowie aus der Hand des Menschen und aus der Hand des Bruders will ich es wieder fordern.“ Nun wird aber nichts gesucht, als was zurückverlangt wird; es wird nichts zurückverlangt, als was auch zurückgegeben werden wird, und zurückgegeben wird natürlich das, was zur Vergeltung zurückgefordert und verlangt wird. Denn es kann nichts vergolten werden, was niemals vorhanden gewesen ist behufs der Vergeltung. Es wird aber vorhanden sein, wenn es wird hergestellt werden.</p><p>Alles also, was nur immer gegen das Blut ausgesagt wird, richtet sich gegen das Fleisch, ohne welches das Blut ja kein Blut wäre. Das Fleisch wird auferweckt, damit das Blut gerächt werde. Einiges wenige findet sich auch in einer Weise ausgesprochen, dass es des Schleiers der Allegorie entbehrt, nichtsdestoweniger aber trotz seiner Einfachheit einer Deutung bedürftig ist, wie die Stelle bei Isaias’: „Ich bin es, der töten und lebendig machen wird“. Sicher wird er beleben, erst nachdem er getötet hat. Also der, welcher durch den Tod getötet hat, wird durch die Auferstehung beleben. Es ist aber das Fleisch, welches durch den Tod getötet wird; somit wird es auch das Fleisch sein, welches in der Auferstehung wieder belebt wird. Wenn dem Fleische die Seele entreissen töten, und das Gegenteil davon, dem Fleische die Seele wiedergeben, beleben heisst, so ist es notwendig, dass dasjenige Fleisch aufsteht, dem die durch die Tötung entrissene Seele durch Belebung wiedergegeben werden muss.</p>
      <h2>29</h2><p>Wenn also allegorische Schriftstellen, thatsächliche Beweise und wörtlich zu nehmende Aussprüche die Auferstehung des Fleisches, wiewohl ohne Nennung der betreffenden Substanz selbst, durchblicken lassen, um wie viel weniger werden dann die Stellen, wodurch jene Hoffnung auf die körperliche Substanz selbst unter spezieller Erwähnung bestimmt ausgesprochen wird, in Frage zu ziehen sein! Nimm beispielsweise den Ezechiel! „Es kam“, sagt er, „die Hand des Herrn über mich, und es führte mich der Herr im Geiste hinaus und stellte mich in die Mitte eines Feldes. Dasselbe war mit Gebeinen angefüllt und er führte mich über sie im Kreise herum, und siehe, es waren ihrer viele auf der Oberfläche des Feldes, und sie waren dürre genug. Und er sprach zu mir: Menschensohn, ob diese Gebeine wohl leben werden? Und ich sagte: Adonai, Herr, Du weisst es. Und er sprach zu mir: Weissage über diese Gebeine und sprich: Dürres Gebein, höre die Stimme des Herrn! So spricht der Herr Adonai zu diesen Gebeinen: Siehe, ich will Geist in Euch bringen, und ihr werdet leben; ich will Geist in Euch geben und Euch in Leiber zurück führen, Euch mit Haut umgeben und Geist in Euch geben, und Ihr werdet leben und erkennen, dass ich der Herr bin. Und ich weissagte nach seinem Gebot. Und siehe, es ward ein Geräusch, während ich weissagte, und eine Bewegung und Gebein näherte sich dem Gebein. Und ich schaute und siehe, die Gebeine überzogen sich mit Sehnen; Fleisch und Haut bildeten sich darüber, aber Geist war noch nicht in ihnen. Und er sprach zu mir: Menschensohn, Prophet, weissage zum Geiste und sage zum Geiste: So spricht der Herr Adonai: Komm, Du Geist, von den vier Winden und wehe in den Toten und sie werden leben. Und ich weissagte zum Geiste, wie er mir vorgeschrieben hatte. Da kehrte der Geist in sie ein, und sie lebten und standen auf ihren Füssen, stark und gross genug. Und er sprach zu mir: Menschensohn, es ist das ganze Haus Israel, diese Gebeine. Sie sprachen: Unsere Gebeine sind verdorret, unsere Hoffnung ist zu Grunde gegangen, wir sind Abgeschnittene in ihnen. Deshalb prophezeie ihnen: Siehe, ich werde Eure Gräber öffnen und Euch herausführen aus Euren Gräbern als mein Volk und Euch führen in das Land Israel, und Ihr werdet erkennen, dass ich, der Herr, Eure Gräber geöffnet und Euch hinausgeführt habe aus Euren Gräbern, mein Volk; und ich will Euch den Geist geben und Ihr werdet leben und ruhen in Eurem Lande und erkennen, dass ich, der Herr, geredet und es gethan habe, spricht der Herr.“</p>
      <h2>30</h2><p>Ich weiss wohl, wie sie diese Ankündigung durchstöbern, um eine Allegorie herauszuklügeln. Sie sagen: Weil jene Gebeine das ganze Haus Israel sind, so hat er sie zu einem Bilde Israels gemacht und sie ihres eigentümlichen Charakters entkleidet, und so habe man eine bloss figürliche, keine reale Verkündigung der Auferstehung vor sich. Der jüdische Staat gerate nämlich in Verfall, sei wie tot, vertrocknet und werde über das Feld des Erdkreises verstreut. Darum sei auch das Bild von der Auferstehung eine Allegorie auf ihn; denn es finde eine Wiederansammlung und eine Wiederbefestigung von Gebein an Gebein statt, d. h. von Stamm an Stamm und von Volk an Volk, und sie würden wieder als Körper hergestellt vermittelst des Fleisches des Reichtums und der Sehnen der Königsherrschaft; so aus den Gräbern, d. h. aus den so traurigen und trübseligen Verbannungsörtern, herausgeführt, kämen sie zum Zwecke des Trostes wieder zu sich und würden von da an in ihrem Lande Judäa leben. — Und was danach? Ohne Zweifel werden sie sterben. Und was nach dem Tode? Dann gibt es vermutlich keine Auferweckung, wenn es nicht eben die ist, welche dem Ezechiel geoffenbart wurde.</p><p>Allein es wird auch anderwärts sonst noch eine Auferstehung verkündigt; folglich wird es diese sein, und es ist vergebens, sie auf den Zustand des jüdischen Staates umzudeuten. Ist es aber eine andere als die, welche wir verteidigen, so ist mir auch weiter nichts daran gelegen, wenn es nur eine Auferstehung der Körper ist so gut wie des jüdischen Staates. Dadurch endlich, dass die Wiedererweckung des jüdischen Staates durch eine Wiedereinkörperung und Wiedervereinigung von Gebeinen versinnbildet ist, wird bewiesen, dass eben dasselbe sich mit den Gebeinen auch ereignen werde. Denn obschon im Bilde nur eine Fiktion der Realität liegt, so hat doch das Bild selbst seine eigene Realität für sich. Es muss vorerst denn doch für sich bestehen, um etwas anderem angepasst werden zu können. Eine aus Wesenlosem entnommene Ähnlichkeit hat keinen Sinn, eine auf nichts basirte Gleichnisrede lässt keine Anwendung zu. So wird es denn nötig sein, auch hinsichtlich der Gebeine anzunehmen, dass sie wieder mit Eingeweiden und Atmungsorganen, wie angegeben, versehen werden, welchem Vorgange entsprechend dann die Wiederherstellung des jüdischen Staates ausgemalt werden kann, wie sie ihm angedichtet wird.</p><p>Doch es entspricht der Frömmigkeit mehr, auf Grund des Ansehens des buchstäblichen Verständnisses die Wirklichkeit zu verteidigen, wie es der Sinn der göttlichen Kundgebung verlangt. Denn wenn sich diese Vision auf den jüdischen Staat bezöge, so hätte Gott sogleich nach enthülltem Anblick der Lage der Gebeine hinzugesetzt: „Alle diese Gebeine sind das ganze Haus Israel“ und so weiter. Aber da er, nachdem er die Knochen gezeigt hat, erst noch von der besondern Hoffnung derselben redet, ohne Israel zu nennen, und den Glauben des Propheten auf die Probe stellt: „Menschensohn, werden diese Gebeine wohl leben?“, so dass jener erst antwortete: „Herr, Du weisst es“, so würde Gott wahrhaftig den Glauben des Propheten doch nicht mit einer Sache auf die Probe gestellt haben, welche sich niemals zutragen sollte, wovon Israel niemals hören würde, die es nicht zu glauben brauchte. Weil jedoch die Auferstehung der Toten allerdings verkündigt wurde, Israel aber, seiner Ungläubigkeit entsprechend, zweifelte und Ärgernis nahm und bei dem Anblicke des sich lange hinziehenden Zustandes des Begrabenseins an der Auferstehung verzweifelte oder doch wenigstens den Sinn nicht sowohl auf sie richtete als auf seine Notlage, deshalb eben hat Gott den Propheten, insofern er selber auch schwankend war, vorerst zur Standhaftigkeit in der Verkündigung befähigt, indem er ihm den Hergang der Auferstehung offenbarte. Auch befahl er dem Volke, zu glauben, was er dem Propheten geoffenbart hatte, indem er sich des Ausdrucks bediente, die Gebeine, die da auferstehen sollten, seien das Volk selbst, es, das an die Auferstehung nicht glaubte. So sagt er auch am Schluss: „Und Ihr werdet erkennen, dass ich, der Herr, es gesagt habe und thun werde“; er wollte nämlich thun, was er gesagt hatte, würde aber nicht thun, was er gesagt hatte, wenn er es in anderere Weise ausführt, als er gesagt hat.</p>
      <h2>31</h2><p>Wenn das Volk nur allegorisch darüber gemurrt hätte, dass sein Mark aufgezehrt und seine Hoffnung verloren sei, sich über das Schicksal der Zerstreuung beklagend, dann würde Gott allerdings mit Recht eine solche figürliche Hoffnungslosigkeit auch durch eine bloss figürliche Versprechung trösten. Aber da das Unglück des Zerstreutseins das Volk noch nicht getroffen hatte, die Hoffnung der Auferstehung dagegen bei ihm sehr oft gesunken war, so hat Gott in der Weise, wie es das Vertrauen darauf aus Anlass des Vergehens der Leiber offenbar erschütterte, diesen Glauben, den das Volk zerstörte, in entsprechender Weise wieder aufgerichtet. Auch wenn irgend ein niederschlagendes Zeitereignis Israel in jenem Augenblicke mit Betrübnis erfüllt hätte, so wäre darum doch der Inhalt jener Vision nicht als eine blosse Parabel zu nehmen, sondern als ein Zeugnis der Auferstehung, um es wieder zu jener Hoffnung aufzurichten, nämlich zur Hoffnung auf das ewige Heil und eine noch notwendigere Auferstehung, und um es vom Anblicke der gegenwärtigen Zustände abzulenken.</p><p>Diesen Zweck haben auch andere Propheten: „Ihr werdet aus den Gräbern hervorgehen wie die Kälber, wenn sie von den Banden befreit sind, und Eure Feinde unter die Füsse treten.“ Und wiederum: „Euer Herz wird sich freuen und Eure Gebeine aufkeimen wie ein Kraut“, weil auch das Kraut aus der Auflösung und Verwesung des Samenkorns wieder ersteht.</p><p>In Summa, wenn die Vision von den auferstehenden Gebeinen sich ausschliesslich auf den jüdischen Staat bezieht, warum wird denn nicht bloss Israel, sondern allen Völkern eine und dieselbe Hoffnung angekündigt, die Hoffnung der Wiedereinkörperung und Wiederbeseelung der sterblichen Überreste und der Auferweckung der Toten aus den Gräbern? Es ist nämlich mit Bezug auf alle gesagt: „Die Toten werden leben und aus den Gräbern auferstehen; denn der Tau, welcher von Dir ausgeht, ist die Heilung für ihr Gebein.“ Ebenso an einer andern Stelle: „Alles Fleisch wird kommen, um vor meinem Angesichte anzubeten, spricht der Herr.“ Wann denn? Wenn die Gestalt dieser Welt zu vergehen beginnen wird. Denn oben hiess es: „Denn wie der neue Himmel und die neue Erde, die ich bilden werde vor meinem Angesicht, so wird, spricht der Herr, auch Euer Same vor mir bestehen.“ Dann wird auch das, was er unmittelbar folgen lässt, sich erfüllen: „Und sie werden hervorgehen“ — natürlich aus ihren Gräbern — „und schauen die Glieder derer, welche sich gegen mich versündigt haben, weil ihr Wurm nicht herunterfallen und ihr Feuer nicht erlöschen wird, und sie werden zum Schauspiel sein für alles Fleisch“— verstehe, für das Fleisch, welches, auferweckt und aus den Gräbern hervorgegangen, den Herrn für diese Gnade anbeten wird.</p>
      <h2>32</h2><p>Damit es nicht den Anschein gewinne, als werde die Auferstehung bloss derjenigen Leiber verkündigt, welche in Gräbern niedergelegt sind, so existiert auch die Schriftstelle: „Ich werde den Fischen des Meeres Befehl erteilen, und sie werden von sich geben die Gebeine, welche sie verschlungen haben, und ich werde fügen Band an Band und Bein an Bein.“ Dann werden folglich, höre ich einwenden, auch die Fische wiederaufstehen, sowie auch die wilden Tiere und Fleisch fressenden Vögel, um die Menschen von sich geben zu können, welche sie gefressen haben; denn man liest auch bei Moses, dass von allen Tieren das Blut zurückgefordert werde? — Durchaus nicht, sondern die wilden Tiere und Fische werden behufs der Wiedergabe des Fleisches und Blutes nur zu dem Zwecke namentlich aufgeführt, um die Auferstehung auch der verschlungenen Leiber um so entschiedener auszudrücken, wenn sogar den Verschlingern derselben die Wiederherausgabe befohlen wird.</p><p>Für einen hinlänglichen Beleg der diesbezüglichen Macht Gottes halte ich den Jonas, da derselbe unversehrt an beiden Bestandteilen, an Leib und Seele, aus dem Bauche des Fisches herausgeholt wird. Ein Fischmagen wäre sicher in einem Zeitraum von drei Tagen mit der Auflösung eines Menschenleibes leichter zustandegekommen, als ein Sarg, ein Grab, als die Ruhe in irgend einem einsamen und abgelegenen Beinhause, davon ganz zu schweigen, dass im Bilde der Bestien diejenigen, welche sich wild gegen die Christen betragen, die nur dem Namen nach Menschen, in Wirklichkeit Engel der Gottlosigkeit sind, angedeutet werden. Von ihnen wird das Blut wiedergefordert durch eine entsprechende Strafe.</p><p>Wem also das Lernen mehr am Herzen liegt als Einbildungen, wer es mehr aufs Glauben abgesehen hat als aufs Streiten, wer die göttliche Weisheit mehr ehrt als er seiner eigenen frönt, wird der, wenn er von einem Ratschlusse Gottes in betreff des Fleisches, der Haut und der Sehnen hört, ihn auf andere Weise auslegen und glauben, was in betreff dieser Substanzen angekündigt wird, gelte dem Menschen nicht? Entweder ist in betreff des Menschen nichts beschlossen, weder die Verleihung des Himmelreichs, das strenge Gericht und was sonst noch zur Auferstehung gehört, oder aber, wenn dem Menschen dergleichen bestimmt ist, so ist es notwendigerweise für die Substanzen bestimmt, woraus der Mensch, für den es bestimmt ist, besteht. Ich richte an diese verschmitzten Hexenmeister, die Gebeine, Fleisch, Sehnen und Gräber weghexen, auch die Frage, warum sie, wenn einmal ein für die Seele geltender Ausspruch gethan wird, die Seele nicht auch für etwas anderes deuten und sie nicht in einen andern Gegenstand umdeuten, sondern warum sie, wenn etwas auf irgend einen körperlichen Bestandteil Bezügliches gesagt wird, eher alles andere gelten lassen, als das Ding, dessen Name genannt wird? Wenn die körperlichen Dinge blosse Gleichnisse sind, warum nicht auch die seelischen? Wenn die seelischen keine enthalten, dann sind die körperlichen auch keine. Denn der Mensch ist so gut Körper als Seele. Daher kann nicht der eine Bestandteil Sinnbilder zulassen, der andere sie ausschliessen.</p>
      <h2>33</h2><p>In betreff der prophetischen Schriften genügt dies. Ich lenke den Kampf nun aufs Gebiet der Evangelien. Auch hier muss ich zuerst der analogen Verschmitztheit derer in den Weg treten, welche behaupten, der Herr habe alles nur in Gleichnissen geredet, weil geschrieben steht: „Dieses alles nun redete Jesus in Gleichnissen, und ohne Gleichnis redete er nichts zu ihnen“ — wohlgemerkt zu den Juden. Denn auch die Jünger sagen: „Warum redest Du in Gleichnissen?“ Und der Herr antwortet: „Ich rede deshalb in Gleichnissen zu ihnen, damit sie sehen und doch nicht sehen, hören und doch nicht hören“, gemäss den Worten des Isaias. Wenn er also zu den Juden in Gleichnissen redete, dann doch nicht zu allen; wenn nicht zu allen, dann auch nicht immer, und es ist nicht alles Gleichnis, sondern nur einiges und bei gewissen Personen. Diese Personen aber sind die Juden, manchmal allerdings auch die Jünger. Aber betrachte, mit welchen Worten die hl. Schrift dies berichtet: „Er redete aber auch ein Gleichnis zu ihnen.“ Folglich sagte er manchmal auch <em>kein Gleichnis</em>. Denn es wäre nicht angemerkt worden, wann er ein Gleichnis redete, wenn er immer so geredet hätte. Überdies wird man finden, dass die Parabeln entweder von ihm selbst ausgelegt werden, wie die vom Säemann als die Predigt des Wortes, oder vom Verfasser des Evangeliums erklärt werden, wie die vom stolzen Richter und der zudringlichen Witwe als Hinweisungen auf die Beharrlichkeit im Gebet, oder endlich, dass sie sich selbst erklären, wie die vom Feigenbaum, der noch Aufschub erhielt wegen der Hoffnung, als ein Bild der Unfruchtbarkeit des jüdischen Volkes.</p><p>Wenn also das Licht des Evangeliums nicht einmal durch die Gleichnisreden verdunkelt wird, so fehlt viel daran, dass die Aussprüche und Erklärungen, die ihrer Natur nach klar sind, anders zu verstehen wären, als sie lauten. Das Gericht, das Reich Gottes und die Auferstehung aber kündigt der Herr in Form von Erklärungen und Aussprüchen an. „Erträglicher“, sagt er, „wird es Tyrus und Sidon gehen an jenem Tage“, „saget ihnen, das Reich Gottes sei nahe“, „es wird Dir bei der Auferstehung der Gerechten vergolten werden“. Wenn also die Namen der betreffenden Dinge, d. h. Gericht, Reich Gottes und Auferstehung, in sich fertig sind, so dass keins davon zu einer Parabel verflüchtigt werden kann, so darf auch das nicht zu Parabeln verflüchtigt werden, was in der Verkündigung als zur Vorbereitung, Verwirklichung und Wahrnehmung des Reiches, des Gerichtes und der Auferstehung gehörig bezeichnet wird.</p><p>So werden also diese Dinge als körperliche aufrecht erhalten werden, weil sie für Körperliches bestimmt und folglich nicht geistig sind, weil nicht figürlich. Deshalb haben wir auch den Nachweis vorausgeschickt, dass sowohl dem Seelen- als dem Leibeskörper der dem gemeinschaftlichen Wirken entsprechende schuldige Lohn in Aussicht stehe, damit nicht durch die Körperlichkeit der Seele, welche zu symbolischen Auffassungen Anlass gibt, die Körperlichkeit des Leibes ausgeschlossen werde. Denn der Glaube muss festhalten, dass sie beide am Reiche, am Gericht und an der Auferstehung Teil haben.</p><p>Nun fahren wir fort zu beweisen, der Herr habe ganz eigentlich die Körperlichkeit des Leibes bei jeder Erwähnung der Auferstehung im Sinne, unbeschadet der der Seele, welche einige wenige Personen ebenfalls schon empfangen haben.</p>
      <h2>34</h2><p>Wenn er erstens sagt, er sei gekommen, selig zu machen, was verloren war, was mag denn das Verlorene gewesen sein? Ohne Zweifel der Mensch. Der ganze oder nur ein Teil von ihm? Sicher der ganze. Denn die Uebertretung, welche die Ursache des menschlichen Verderbens ist, vollzog sich sowohl aus Antrieb und Begierlichkeit der Seele als durch die Thätigkeit des Leibes, nämlich durch den Genuss, sie trug den ganzen Menschen in das Schuldbuch der Uebertretung ein und erfüllte ihn von der Zeit an mit der Schuld des Verderbens.</p><p>Er wird also in seiner Vollständigkeit gerettet werden, wie er in seiner Ganzheit durch die Uebertretung verloren gegangen ist. Oder ist etwa das Schaf im Evangelium ohne Leib verloren gegangen und ohne Leib zurückgebracht worden? Wird mit der Seele, weil es eben ein heiles Stück Vieh war, auch sein Leib auf den Schultern des guten Hirten herbeigebracht, so ist es jedenfalls ein Beleg dafür, dass auch der Mensch beiden Bestandteilen nach wiederherzustellen ist. Oder wie wenig wäre es Gottes würdig, bloss den halben Menschen zu erlösen, ihn so fast noch herunterzusetzen, da sogar die Begnadigung seitens der weltlichen Fürsten immer vollständig beansprucht wird! Der Teufel wird mächtiger gedacht in Schädigung des Menschen, indem er ihn vollständig zu Boden wirft; Gott aber soll für schwächer erklärt werden, indem er ihn nicht ganz wieder erhebt?! Und doch setzt der Apostel hinzu: „Wo die Sünde reichlich war, ist die Gnade noch reichlicher gewesen“. Wie soll man ihn denn für einen Geretteten halten, ihn, der auch ein Verlorener genannt werden könnte? Dem Leibe nach bleibt er nämlich verloren, der Seele nach dagegen ist er gerettet. Oder man müsste, damit eine Errettung der Seele bewirkt werden könne, auch sie zu dem Verlorengegangenen rechnen; denn was verloren gegangen war, wird gerettet werden müssen. Nun aber nehmen wir ja die Unsterblichkeit der Seele an, so dass man ihr Verlorengehen nicht für gänzlichen Untergang ansieht, sondern für ein Verlorengehen zur Bestrafung, d. i. zur Hölle. Und wenn dem so ist, so wird die Herstellung nicht der Seele gelten, da sie ihrer natürlichen Beschaffenheit nach, vermöge ihrer Unsterblichkeit unversehrt ist, sondern sich vielmehr auf den Leib, der, wie allen bekannt, des Untergangs fähig ist, beziehen. Wenn aber die Seele auch des Untergangs fähig, d. h. wie das Fleisch nicht unsterblich ist, dann wird schon der Gleichheit wegen auch dem Fleische jenes Gesetz zu statten kommen müssen, welches ebenso sterblich und vergänglich ist; denn der Herr will ja, was verloren ist, wieder herstellen.</p><p>Ich will für jetzt nicht darüber rechten, ob der Mensch nach dieser oder jener Seite hin eine Beute der Auflösung werde, da ihm beiderseits eine Herstellung bevorsteht, die für beide Bestandteile die gleiche ist. Denn siehe, hinsichtlich welcher Substanz man auch den Untergang des Menschen annimmt, hinsichtlich der andern geht er nicht unter. Er wird also hinsichtlich der Substanz, welche nicht untergegangen ist, schon gerettet sein, hinsichtlich der aber, welche untergegangen ist, nichtsdestoweniger gerettet werden. Da hast Du die Wiederherstellung des vollständigen Menschen; denn der Herr wird, was immer von ihm auch untergeht, erretten, andererseits das, was nicht untergeht, nicht erst noch verderben. Wer würde also an der Erhaltung beider Bestandteile noch zweifeln, da der eine seinen Fortbestand wiedererlangen, der andere ihn gar nicht verlieren soll?!</p><p>Doch der Herr drückt den Sinn der Sache noch genauer aus und sagt: „Ich bin nicht gekommen, meinen Willen zu thun, sondern den Willen meines Vaters, der mich gesandt hat“. Welchen denn wohl? „Dass ich von allem, was er mir gegeben, nichts verliere, sondern es wieder auferwecke am jüngsten Tage“. Was hatte Christus vom Vater denn anders empfangen, wenn nicht das, was er angezogen hatte? Die menschliche Natur ohne Zweifel, die Vereinigung aus Leib und Seele. Er wird also nicht dulden, dass auch nur eins von dem, was er empfangen hat, zu Grunde gehe, ja nicht einmal eins von beiden, nicht einmal das geringere. Ist das Fleisch das geringere, dann auch nicht das Fleisch, weil er auch das geringe nicht verliert, noch überhaupt etwas, da er nichts verliert. Wollte er nun aber das Fleisch am jüngsten Tage nicht wieder auferwecken, so liesse er schon nicht mehr etwas geringes vom Menschen zu Grunde gehen, sondern ich möchte entsprechend der Wichtigkeit des betreffenden Teiles fast sagen, den ganzen Menschen.</p><p>Wenn er ferner noch beifügt: „Das ist der Wille des Vaters, dass jeder, der den Sohn sieht und an ihn glaubt, das ewige Leben habe; und ich will ihn auferwecken am jüngsten Tage“, so hat er damit die Auferstehung in ihrer Vollständigkeit hingestellt. Er teilt nämlich jedem der beiden Bestandteile seinen eigentümlichen Lohn in der Wiederherstellung zu, je nach seinen Verrichtungen, dem Fleische, womit der Sohn gesehen wurde, und der Seele, womit an ihn geglaubt wurde. Dann ist diese Versprechung also, wirst Du wohl sagen, nur denen gegeben, welche Christus gesehen haben. Mag es immerhin so sein, dann wird dieselbe Hoffnung von ihnen auch zu uns gelangen. Denn wenn denjenigen, welche ihn leiblich schauten und darum an ihn glaubten, damals schon ihr leibliches und geistiges Thun Früchte brachte, dann wird es sie noch viel mehr für uns bringen. Denn glücklicher noch sind die, „welche nicht sehen und doch glauben“; deswegen würde uns, als den Glücklicheren, die Auferstehung des Fleisches sogar dann noch zukommen, wenn sie jenen versagt worden wäre. Wie könnten sie glücklich sein, wenn einer ihrer Teile von ihnen zu Grunde gehen wird!?</p>
      <h2>35</h2><p>Der Herr schreibt ferner vor, man solle denjenigen, welcher Leib und Seele in den Höllentod stürzen kann, d. i. den Herrn allein, mehr fürchten, nicht diejenigen, welche bloss den Körper töten, der Seele aber nicht schaden können, d. i. die menschlichen Gewalthaber. Folglich wird auch in diesen Worten anerkannt, die Seele sei von Natur aus unsterblich, da sie nicht von Menschen getötet werden kann, die Sterblichkeit aber als ein Attribut des Leibes hingestellt, da ihm das Getötetwerden eignet. Allein weil sich die Untersuchung auch hierbei mit Deuteleien des Wortes Körper muss narren lassen, so werde ich unter dem Körper des Menschen nichts anderes verstehen, als diese ganze Schicht Fleisch, durch welche Sorte von Stoffen sie auch immer sich zusammensetzen und verändern möge, das, was man sehen, greifen, mit einem Wort das, was am Menschen getötet werden kann. So darf man ja auch unter dem Körper einer Mauer nichts anderes verstehen als den Mörtel, die Bruch- und die Backsteine. Wenn jemand noch irgend einen Geheimkörper lehrt, so mag er ihn uns zeigen und offenbaren. Er möge beweisen, dass er dasjenige sei, was am Menschen getötet wird, und dann soll es der richtige sein. Ebenso ist, wenn der Leib zu der Seele im Gegensatz gestellt wird, gleichfalls alle Pfiffigkeit vergebens. Da angenommen wird, dass beide, die Seele sowohl als der Leib, dem Höllentode verfallen, so bleibt der Körper von der Seele unterschieden, und es bleibt uns nur übrig, unter dem Leibe das zu verstehen, was vor Augen liegt, nämlich das Fleisch, welches, wenn es den Tod aus der Hand Gottes nicht mehr fürchtet, dem Höllentode verfällt, ebenso sicher aber, wenn es vorgezogen haben sollte, sich von den Menschen töten zu lassen, zum ewigen Leben belebt werden wird.</p><p>Sollte jemand den Höllentod von Seele und Leib begierig aufgreifen wollen als eine Vernichtung und den Untergang beider Substanzen, nicht als Bestrafung, nicht als würden sie gezüchtigt, sondern aufgerieben, so möge er sich auch daran erinnern, dass das Höllenfeuer als ein ewiges hingestellt wird, zum Zweck der ewigen Strafe, und daraus die Ewigkeit dieses Todes erkennen, welcher eben darum mehr zu fürchten ist, als der Tod durch Menschen, der nur ein zeitweiliger ist. Dann wird er auch an die ewige Dauer der Substanzen glauben müssen, da sie ja zur Strafe einem ewigen Tode verfallen. Wenigstens wird, da nach der Auferstehung Leib und Seele den Höllentod von seiten Gottes erleiden sollen, beides hinlänglich feststehen, sowohl die leibliche Auferstehung als der ewige Tod. Im andern Falle wäre es höchst absurd, wenn das wieder auferweckte Fleisch den Höllentod in der Weise erleiden müsste, dass es ganz verginge, was es ja auch dann erlitten hätte, wenn es gar nicht wieder auferweckt worden wäre. Es würde dann selbstverständlicherweise nur darum wiederhergestellt, um nicht mehr zu sein, während das Nichtsein doch vorher schon sein Los gewesen ist.</p><p>Um uns in derselben Hoffnung fest zu begründen, fügt er das Beispiel von den Sperlingen bei. Von zweien dieser Tiere fällt keines auf die Erde ohne den Willen Gottes. Ebenso sollst du auch glauben, dass der Leib, welcher zur Erde herabgesunken ist, in Kraft des Willens desselben Gottes wieder auferstehen könne. Den Sperlingen ist das freilich nicht gegeben. Aber sind wir denn nicht besser als viele Sperlinge, gerade darum, weil wir wieder auferstehen, wenn wir hingesunken sind, und weil uns derjenige, der von sich sagt, er habe alle Haare unseres Hauptes gezählt, die Herstellung verheisst? Denn wenn sie verloren sein sollen, welcher Grund wäre dann dazu vorhanden gewesen, ihre Zahl festzustellen? Aber da heisst es: „Von allem, was mir der Vater gegeben hat, werde ich nichts verlieren“, d. h. auch nicht einmal ein Haar, so wenig als ein Auge oder einen Zahn. Womit sollte übrigens das Weinen und Zähneknirschen geschehen, wenn nicht mit den Augen und Zähnen? nämlich auch dann noch, nachdem man dem Höllentode dem Leibe nach verfallen und in die äusserste Finsternis hinausgestossen ist, was die spezielle Qual für die Augen ist. Wenn sich einer bei dem. Hochzeitsmahle mit Werken bekleidet einfindet, die nicht würdig sind, so soll er sofort an Händen und Füssen gebunden werden; folglich wird er mit seinem Leibe auferstanden sein. So sind also auch das zu Tische Sitzen im Reiche Gottes, das Sitzen auf den Stühlen Christi, das Stehen zu seiner Rechten oder zu seiner Linken, sowie das Essen vom Baume des Lebens höchst zuverlässige Anzeichen einer körperhaften Beschaffenheit.</p>
      <h2>36</h2><p>Sehen wir nun zu, ob er nicht auch, als er die Verschlagenheit der Sadduzäer abwehrte, dafür um so mehr unsere Ansicht hoch gehoben hat. Tendenz der Frage war nach meinem Dafürhalten die Beseitigung der Auferstehung; denn die Sadduzäer geben weder den fortdauernden Bestand des Leibes noch der Seele zu. Daher hatten sie das Argument für ihr Problem von da entnommen, wo der Glaube an die Auferstehung seine schwächste Stelle zeigt, nämlich mit der nur so hingeworfenen Frage, ob der Leib nach der Auferstehung heiraten werde oder nicht, veranlasst durch die Person eines Weibes, bei der es, da sie an sieben Brüder verheiratet gewesen war, zweifelhaft erschien, welcher davon sie wiedererhalten würde. Nun gut; es muss nur der Sinn der Frage sowohl als der Antwort genau festgehalten werden, und der Streit ist abgeschnitten.</p><p>Wenn nämlich die Sadduzäer die Auferstehung verwarfen, der Herr sie aber behauptete und jene schalt, weil sie der h. Schriften unkundig seien, derjenigen nämlich, welche die Auferstehung lehren, sowie auch, weil sie nicht an die Kraft Gottes glaubten, diejenige natürlich, welche die Toten aufzuerwecken imstande ist, und zuletzt hinzufügte: „Dass die Toten auferstehen,“ somit also ohne Zweifel zu bejahen ist, was Gegenstand ihres Leugnens war, — so bejahte er auch die Auferstehung in derselben Weise, wie sie geleugnet wurde, nämlich hinsichtlich beider Bestandteile des Menschen. Wenn er bei jener Gelegenheit sagte, die Toten würden nicht heiraten, so hat er damit nicht auch erklärt, dass sie nicht auferstehen würden. Er hat sie im Gegenteil „Söhne der Auferstehung“ genannt, so dass sie also durch dieselbe gewissermassen geboren werden, obwohl sie nach derselben nicht heiraten, sondern auferweckt den Engeln gleich sein werden, weil sie nicht mehr heiraten, da sie auch nicht mehr sterben, sondern in den Zustand der Engel übergehen durch jenes „Kleid der Unverweslichkeit“, jedoch mit einer Veränderung der wiederauferweckten Substanz. Man würde übrigens gar nicht darnach gefragt haben, ob wir wiederum heiraten und sterben oder nicht, wenn nicht die Wiederherstellung gerade derjenigen Substanz in Zweifel gezogen worden wäre, welche beim Sterben und Heiraten vorzugsweise beteiligt ist, des Fleisches. Da hast du nun aus dem Munde des Herrn, gegenüber den jüdischen Häretikern, bestätigt, was auch jetzt noch bei den christlichen Sadduzäern geleugnet wird, die materielle Auferstehung!</p>
      <h2>37</h2><p>Ebenso hat sich, wenn es heisst, „das Fleisch nütze nichts,“ die Auffassung nach dem Anlasse des Ausspruches zu richten. Weil man nämlich die Rede des Herrn für hart und unausstehlich gehalten hatte, als wäre es seine Absicht gewesen, man solle in Wirklichkeit sein Fleisch essen, so hat er, um das Wesen des Heils auf den Geist zu gründen, die Worte vorausgeschickt: „Der Geist ist es, der lebendig macht“, und dann hinzugesetzt: „Das Fleisch aber nützt nichts“, nämlich zum Lebendigmachen. Er führt auch weiter aus, was er unter dem Geiste verstanden wissen will. „Die Worte, die ich zu Euch geredet habe, sind Geist, sind Leben“; sowie weiter oben: „Wer meine Worte hört und an den glaubt, der mich gesandt hat, der hat das ewige Leben, und das Gericht wird nicht über ihn kommen, sondern er wird vom Tode zum Leben hinübergehen.“ Indem er so das Wort als den Lebendigmacher hinstellt, weil das Wort Geist und Leben ist, hat er sein Fleisch ebenso genannt, weil das Wort ja Fleisch geworden war. Demnach musste es zum Zwecke des Lebens begehrt, durch Anhörung genossen, durch Verstehen gleichsam wiedergekäuet, durch Glauben verdauet werden. Denn er hatte kurz vorher sein Fleisch auch als das Himmelsbrot bezeichnet, indem er durch eine von den notwendigsten Nahrungsmitteln entnommene Allegorie die Erinnerung an die Vorfahren, welche das Brot und Fleisch Ägyptens der göttlichen Berufung vorzogen, wach rief. Sich gegen ihre Bedenklichkeiten, die, wie er bemerkt hatte, zerstreut werden mussten, wendend, sagte er also: „Das Fleisch nützt nichts“. Hat das mit Beseitigung der Auferstehung etwas zu schaffen? Als ob es nicht Dinge geben dürfte, die, wenn sie schon selbst nichts nützen, doch Nutzen von andern empfangen können? Der Geist nützt, er macht nämlich lebendig; das Fleisch nützt nichts, weil es dem Tode verfällt.</p><p>Darum hat Christus bei unserer Ansicht viel besser angegeben, was jedem von beiden bevorsteht. Indem er nämlich zeigt, was nützt und was nicht, hat er damit zugleich ins Licht gestellt, wer nützt und wem, nämlich der Geist als Lebendigmacher dem hingestorbenen Fleische. „Denn es wird die Stunde kommen,“ sagt er, „da die Toten die Stimme des Sohnes Gottes hören werden, und die sie hören, werden leben.“ Was ist denn tot? Doch nur das Fleisch. Und wer ist die Stimme Gottes? Doch nur das Wort. Und wer ist das Wort? Doch nur der Geist, der mit Recht, weil er selbst Fleisch geworden ist, das Fleisch auferwecken wird, und zwar von dem Tode, den er selbst erduldet hat, und aus dem Grabe, in das er selbst ist gebracht worden. Endlich, wenn er sagt: „Wundert Euch nicht, weil die Stunde kommt, in welcher alle, die in den Gräbern sind, die Stimme des Sohnes Gottes hören werden, und es werden hervorgehen, die Gutes gethan haben zur Auferstehung des Lebens, die aber Böses gethan haben, zur Auferstehung des Gerichts“; — dann wird niemand mehr, sage ich, unter den Toten, die in den Gräbern sind, etwas anderes verstehen können, als die Körper und das Fleisch, weil die Gräber auch nichts anderes sind als Behausungen der Leichname. Denn gerade die alten Menschen, d. i. die Sünder, d. i. die, welche tot sind durch Unkenntnis Gottes und nach der pfiffigen Auslegung der Häretiker mit den Gräbern gemeint sein sollen, die werden, wie unumwunden gesagt ist, aus ihren Gräbern herausgehen zum Gericht. Wie sollten übrigens Gräber aus Gräbern hervorgehen können?</p>
      <h2>38</h2><p>Welche Bedeutung sollen wir nach den Reden des Herrn nun auch noch seinen Handlungen beilegen, wenn er Tote aus Särgen und Gräbern wieder auferweckt? Wozu soll das? Geschah es bloss zur Schaustellung seiner Macht und zum Gunstbeweis einer augenblicklichen Wiederbeseelung, so ist es ja nichts so gar Grosses für ihn, Leute, die von neuem sterben werden, aufzuerwecken. Geschah es hingegen mehr zur Sicherstellung des Glaubens an die künftige Auferstehung, dann ist damit gegeben, dass auch sie eine leibliche sein wird, entsprechend der Form jenes ihres Beleges.</p><p>Ich mag auch nichts von denen hören, welche sagen, die für die Seele allein bestimmte Auferstehung habe dazumal auch auf das Fleisch hinübergegriffen, weil die Auferstehung der unsichtbaren Seele unmöglich in anderer Weise habe anschaulich gemacht werden können als durch Auferweckung der sichtbaren Substanz. Die kennen Gott schlecht, die da glauben, er vermöge nicht, was sie nicht glauben; dennoch müssen sie recht gut wissen, dass er es konnte, wenn sie die Urkunde des Johannes kennen. Denn wer die noch nackten Seelen der Martyrer, die unter dem Altare ruhen, sichtbar machte, der wäre jedenfalls imstande gewesen, auch die auferstandenen Seelen ohne Leiber sichtbar zu machen. Ich für meine Person dagegen will lieber, dass Gott das Vermögen zu täuschen nicht besitze und in der Kunst zu täuschen allein schwach sei, damit es nicht scheine, als habe er Belege vorausgeschickt, die der Einrichtung der Sache nicht entsprechen, oder vielmehr, ich will, wenn er eine Analogie der Auferstehung beizubringen ohne Anwendung eines Leibes nicht vermochte, lieber, dass er an derselben Substanz diese überschwengliche Analogie gar nicht anbringen konnte. Eine Analogie ist niemals grösser als das, wovon sie die Analogie ist. Sie ist aber grösser, wenn Seelen mit dem Körper auferweckt werden zum Beweise einer körperlichen Auferstehung. Dann würde eine totale Herstellung des Menschen einer bloss halben zur Unterstützung dienen, da doch umgekehrt das Wesen der Beispiele vielmehr das erfordern würde, was als das Geringere gilt, ich meine, eine Auferstehung bloss der Seele, als Vorgeschmack z. B. davon, dass auch das Fleisch seinerzeit auferstehen werde.</p><p>So dienten denn also nach unserer Vorstellung von der Wirklichkeit jene Beispiele von Totenerweckungen durch den Herrn allerdings der Auferstehung des Leibes und der Seele als Belege, damit keiner der beiden Substanzen dieses Geschenk versagt sein sollte. Insofern sie jedoch blosse Beispiele waren, zeigten sie weniger als das, was Christus verhiess. Die betreffenden Personen wurden nämlich nicht zur Herrlichkeit oder Unverweslichkeit auferweckt, sondern nur, um abermals zu sterben.</p>
      <h2>39</h2><p>Auch die apostolischen Urkunden bezeugen die Auferstehung. Denn auch die Apostel hatten keine andere Aufgabe, als die Siegel des alten Testamentes zu erbrechen und die des neuen anzulegen, oder vielmehr das Testament Gottes in Christo kund zu machen. So haben sie denn auch in betreff der Auferstehung nichts neues gebracht, sondern dieselbe nur zur Verherrlichung Christi verkündet, da sie im übrigen in einfachem und allgemeinem Glauben bereits angenommen war, ohne allen Streit über die Art und Weise. Einzig die Sadduzäer widersprachen. Es wäre also leichter gewesen, die Auferstehung überhaupt zu leugnen, als sie anders aufzufassen.</p><p>Nimm Paulus, der vor den Hohenpriestern in Anwesenheit des Tribuns mitten unter den Sadduzäern und Pharisäern seinen Glauben bekennt. „Männer,“ sagt er, „Brüder, ich bin Pharisäer, Sohn von Pharisäern, und werde jetzt wegen der Hoffnung und der Auferstehung bei Euch vor Gericht gestellt,“ natürlich wegen der allgemeinen Auferstehung. Er sagte dies, um nicht, weil er bereits als Übertreter des Gesetzes erschien, in einem Hauptstücke der gesamten Glaubenslehre, d. h. in der Auferstehung, für einen Gesinnungsverwandten der Sadduzäer gehalten zu werden. Da er also den Glauben an die Auferstehung zu bekämpfen nicht den Anschein haben wollte, so hat er ihn damit jedenfalls bekräftigt im Sinne der Pharisäer, und deren Leugner, die Sadduzäer, desavouiert. Auch vor Agrippa sagte er aus, dass er nichts anderes vorgebracht habe, als was die Propheten verkündigt hatten. Also hielt er die Auferstehung in dem Sinne aufrecht, wie die Propheten sie angekündigt hatten. Denn wenn er erwähnt, auch bei Moses stehe etwas über die Auferstehung der Toten geschrieben, so wusste er recht gut, dass es eine körperliche sei, bei der das Blut des Menschen zurückgefordert werden sollte. Er predigte mithin eine Auferstehung, wie sie die Pharisäer annahmen und der Herr selbst sie gepredigt hatte, während die Sadduzäer, um nicht eine Auferstehung von derselben Beschaffenheit glauben zu müssen, sie lieber gänzlich leugneten.</p><p>Darum haben sie ihn auch ausgelacht. Sie würden ihn aber nicht ausgelacht haben, wenn sie nur eine Wiederherstellung der Seele allein aus seinem Munde vernommen hätten. Denn darin wären sie einer landläufigen Annahme ihrer eigenen einheimischen Philosophie begegnet. Da aber die Heiden bei der Ankündigung einer bisher unerhörten Art der Auferstehung eben durch deren Neuheit frappiert wurden und ihre sehr erklärliche Ungeneigtheit, eine so wichtige Sache zu glauben, dem gläubigen Sinne zu schaffen machte, da war der Apostel auch darauf bedacht, überall in seinen Schriften den Glauben an diese Hoffnung zu stärken, und zeigte, dass sie stattfinde, dass sie noch nicht vor sich gegangen, und dass sie, wonach noch begieriger geforscht wurde, eine Auferstehung des Körpers sei, und zwar, was auch noch bezweifelt wurde, nicht eine Auferstehung in einem andern Körper.</p>
      <h2>40</h2><p>Es ist kein Wunder, wenn auch verfängliche Argumente aus seinen Schriften entnommen werden. Es muss ja Häresien geben. Es könnte aber keine geben, wenn die Schriftstellen nicht auch verkehrt verstanden werden könnten.</p><p>Da die Häretiker also finden, dass der Apostel etwas hat verlauten lassen vom zweifachen Menschen, einem inneren, d. i. der Seele, und einem äusseren, d. i. dem Leibe, so haben sie der Seele, d. i. dem inneren Menschen, die Erhaltung, dem Leibe aber, d. i. dem äussern, den Untergang zuerkannt, weil im Briefe an die Korinther geschrieben stehe: „Wenn auch unser äusserer Mensch hinschwindet, der innere erneuert sich von Tag zu Tag“. Nun aber ist weder die Seele für sich allein der Mensch, da sie jenem Gebilde, das den Namen Mensch bereits führte, eingegeben wurde, noch ist der Leib ohne die Seele der Mensch, da er nach dem Austritt der Seele Leichnam genannt wird. So ist der Ausdruck „Mensch“ gleichsam das Bindemittel für die zwei verbundenen Substanzen; im Besitz dieser Bezeichnung können sie nicht anders als verbunden sein.</p><p>Der Apostel aber will unter dem innern Menschen nicht sowohl die Seele als vielmehr die Gesinnung und den Geist verstanden wissen, d. h. nicht die Substanz selbst, sondern den geistigen Geschmack der Substanz. Wenn er darum an die Epheser schreibt, „dass in bezug auf den innern Menschen Christus darin wohne,“ so hat er natürlich damit gemeint, der Herr müsse in seinem Herzen weilen. Denn er setzt gleich hinzu: „durch den Glauben auch in Euren Herzen“ und „in Liebe“, nicht um Glauben und Liebe als konstituierende Bestandteile der Seele hinzustellen, sondern als begriffliche; wenn er aber sagt „in den Herzen“, welche wesentliche Bestandteile des Leibes sind, so hat er damit den innern Menschen in den Leib verwiesen; denn er setzt ihn ins Herz. Berücksichtige auch, dass der äussere Mensch nach Pauli Angabe hinschwinden, der innere aber sich von Tag zu Tag erneuern soll, dann wirst du nicht mehr behaupten, das sei die Verwesung des Leibes, welche er vom Tage seines Todes an in immerwährender Vernichtung erträgt, sondern die, welche er in der Spanne dieses Lebens vor dem Tode und bis zum Tode durch Plagen und Heimsuchungen, durch Qualen und Peinen der Religion wegen erleiden wird. Denn der innerliche Mensch soll hier durch die Eingebungen des Geistes immerfort erneuert werden, indem er im Glauben und in der Disziplin von Tag zu Tag fortschreitet, nicht jenseits, das wäre in der Auferstehung, wo uns dann doch kein tagtägliches Erneuertwerden bevorsteht, sondern ein einmaliges in der vollkommensten Weise. Dies lerne aus den darauf folgenden Worten: „Unsere gegenwärtige vorübergehende und leichte Bedrängnis wird in uns bewirken eine überschwengliche ewige Fülle von Herrlichkeit, indem wir nicht auf das sehen, was sichtbar ist, — d. i. die Leiden, — sondern auf das, was unsichtbar ist, — d. i. die Belohnungen, — denn das Sichtbare ist nur zeitweilig, das Unsichtbare aber ewig.“ Von den Bedrängnissen und Schäden, wodurch der äussere Mensch aufgerieben wird, sagt Paulus, dass man sie, als leichte und vorübergehende, verachten müsse, indem er die Fülle der Herrlichkeit und der unsichtbaren ewigen Belohnungen hervorhebt, welche zur Vergeltung der Mühseligkeiten dienen, in deren Ertragung hier auf Erden der Leib dahinschwindet.</p><p>Das ist also nicht das Hinschwinden, welches sie, um die Auferstehung zu beseitigen, dem äussern Menschen beilegen zu beständiger Vernichtung des Leibes. So sagt er auch an einer andern Stelle: „Wir leiden ja mit ihm, um auch mitverherrlicht zu werden; ich achte nämlich, dass die Leiden dieser Zeit nicht wert sind der künftigen Herrlichkeit, die an uns soll offenbar werden.“ Dort zeigt er, dass die Beschwerden geringer sind als die Belohnungen dafür. Wenn wir aber mitleiden dem Fleische nach, dem es zukommt, im eigentlichen Sinne durch die Leiden aufgezehrt zu werden, so wird ihm auch das zu Teil, was für die Teilnahme am Leiden verheissen wird. Er schreibt also dem Fleische die Bedrängnisse in dem Grade als etwas ihm Eigentümliches zu, dass er sich vorher des Ausdrucks bedient: „Da wir nach Macedonien gekommen waren, hatte unser Fleisch keine Erholung“; sodann er fährt, um auch der Seele ihren Anteil am Leiden zuzuwenden, fort: „In allem bedrängt, von aussen Kämpfe“ — solche nämlich beunruhigen das Fleisch — „von innen Furcht“ — diese drückt nämlich die Seele nieder. Also, wenn der äussere Mensch aufgerieben wird, so wird das Aufreiben nicht so verstanden werden, als ginge er der Auferstehung verlustig, sondern so, dass er Bedrängnis aussteht, und aus diesem Grunde eben ist die Gemeinschaft des innern Menschen nicht ausgeschlossen. So wird also beiden alles gemeinsam sein, sowohl zusammen verherrlicht zu werden, als auch zusammen zu leiden. Entsprechend der Teilnahme an der Arbeit muss auch der Anteil an den Belohnungen ausfallen.</p>
      <h2>41</h2><p>Dieselbe Meinung führt Paulus da noch weiter aus, wo er die Belohnungen über die Leiden stellt: „Wir wissen“, sagt er, „dass, wenn auch das irdische Wohnhaus dieses unseres Zeltes aufgelöst wird, wir doch noch eine andere Wohnung haben, die nicht von Händen gemacht ist, die ewige im Himmel“, d. h. dadurch, dass unser Fleisch durch die Leiden aufgerieben wird, werden wir eine Wohnung im Himmel erlangen. Er dachte dabei an den Ausspruch im Evangelium: „Selig die, welche Verfolgung leiden wegen der Gerechtigkeit, denn ihrer ist das Himmelreich“. Er leugnet die Wiederherstellung des Fleisches nicht, wenn er die Entschädigung durch Lohn gegenüberstellt, da die Entschädigung demselben gebührt, dessen Auflösung angenommen wird, nämlich dem Fleische. Allein, weil er das Fleisch eine Wohnung genannt hatte, so wollte er in eleganter Weise bei der Vergleichung des Lohnes sich auch des Ausdrucks „Haus“ bedienen, indem er für eben die Wohnung, welche durch die Leiden abgebrochen wird, ein besseres Haus verspricht vermittelst der Auferstehung. Auch der Herr stellt viele Wohnungen, gleichsam Häuser, bei seinem Vater in Aussicht.</p><p>Als diese Wohnung könnte indessen auch die Welt verstanden werden, nach deren Auflösung der ewige Wohnsitz im Himmel versprochen wird, weil das Nachfolgende, welches sich offenbar auf das Fleisch bezieht, zeigt, dass sich das Vorausgegangene nicht auf das Fleisch bezieht. Denn der Apostel macht einen Unterschied, indem er hinzusetzt: „Auch darum seufzen wir, indem wir uns sehnen, mit unserer Wohnung, welche vom Himmel ist, überkleidet zu werden, wofern wir nämlich überkleidet, nicht nackt angetroffen werden“, d. h. wir wünschen uns vorher mit der himmlischen Kraft der Ewigkeit zu überkleiden, bevor wir des Fleisches entkleidet werden. Dieser Gnadenerweis wartet nämlich derer, welche sich bei der Ankunft des Herrn noch in ihrem Leibe befinden werden und wegen der Härte der Zeiten des Antichrists es verdienen, durch das abgekürzte Verfahren eines in blosser Verwandlung bestehenden Todes, mit den Auferstehenden zusammenzutreffen, wie Paulus den Thessalonichern schreibt: „Dies sagen wir Euch nach dem Worte des Herrn, dass wir, die wir leben, die wir zurückbleiben für die Ankunft des Herrn, nicht denen zuvorkommen werden, welche entschlafen sind. Denn er, der Herr selbst, wird bei dem Aufrufe, bei der Stimme des Erzengels, bei der Posaune Gottes herabsteigen vom Himmel, und die in Christus Verstorbenen werden zuerst auferstehen; sodann werden wir mit ihnen zugleich in die Wolken entrückt werden, entgegen dem Herrn in die Lüfte, und so werden wir immerdar mit dem Herrn sein“.</p>
      <h2>42</h2><p>Die Umwandlung der Genannten wiederholt er, indem er zu den Korinthern sagt: „Wir werden zwar alle auferstehen, aber nicht alle verwandelt werden; in einem Moment, in einem Augenblick, bei der letzten Posaune“, wohlgemerkt, nur die allein, welche noch in ihren Leibern angetroffen werden. „Die Toten“, heisst es, „werden auferstehen, wir aber werden umgewandelt werden.“ Nachdem man vorerst diesen Satz betrachtet hat, wird man das übrige nach dem Sinn des vorigen auffassen. Wenn er nämlich hinzufügt: „Dieses Verwesliche muss die Unverweslichkeit anziehen und dieses Sterbliche die Unsterblichkeit“, so wird das eben jene Wohnung vom Himmel sein, womit überkleidet zu werden wir in diesem Fleische unter Seufzern begehren, und zwar über das Fleisch, in welchem wir werden gefunden werden, weil der Ausdruck gebraucht ist, wir seien dadurch beschwert, wir, die wir uns in dem Zelte befinden, dessen wir nicht entkleidet zu werden wünschen, sondern nur überkleidet, „damit das Sterbliche vom Leben verschlungen werde“, indem wir nämlich verwandelt werden durch Überkleidung mit dem, was vom Himmel stammt. Denn wer sollte nicht, so lange er im Fleische ist, wünschen, das Kleid der Unsterblichkeit anzulegen und das Leben fortzusetzen, indem er sich das Sterben erspart durch die an dessen Stelle getretene Umwandlung, so dass er von der Unterwelt, wo man bis zum letzten Heller bezahlen muss, nichts gewahr wird?</p><p>Wer aber die Unterwelt durchgemacht hat, wird die Umwandlung nach der Auferstehung auch erlangen. Denn von dieser Zeit an wird, so lehren wir bestimmt, das Fleisch auf alle Weise auferstehen, und die ihm aus jener Umwandlung zukommende Gabe, den engelhaften Zustand erlangen. Oder wenn das Fleisch nur bei denjenigen, welche noch darin angetroffen werden, umgewandelt werden muss, damit das Sterbliche vom Leben verschlungen werde, d. h. das Fleisch von jener himmlischen und ewigen Überkleidung, dann würden diejenigen, welche schon tot sind, das Leben nicht erlangen, da sie des Gegenstandes, um mich so auszudrücken, der Speise des Lebens, d. h. des Leibes, schon beraubt sind. Oder aber es ist notwendig, dass auch sie ihn wiederbekommen, damit auch bei ihnen das Sterbliche vom Leben könne verschlungen werden, wenn sie das Leben erlangen sollen.</p><p>Man wendet ein, bei den Toten wird dieses Sterbliche schon verschlungen sein. — Keinesfalls bei allen. Denn wie viele würde man dann nicht treffen, die noch so eben von gestern herrühren, als so frische Leichen, dass bei ihnen noch nichts als verschlungen angesehen werden kann! Unter dem Verschlungenen kann man nämlich nichts anderes verstehen, als was entfernt, beseitigt, was jeder Wahrnehmung entzogen ist, was in die Erscheinung zu treten vollständig aufgehört hat. Es dürfte aber nicht einmal hinsichtlich der uralten Leichname der Giganten feststehen, ob sie verschlungen sind; denn ihre Gerippe existieren noch. Ich habe davon schon anderwärts gesprochen. Noch ganz kürzlich, als in hiesiger Stadt mit Profanation vieler alten Gräber die Fundamente eines Odeums gelegt wurden, wurde das Volk durch Gebeine, die bei einem Alter von ungefähr fünfhundert Jahren noch frisch waren, und durch Haare, die noch Geruch von sich gaben, in Schrecken gesetzt. Es steht fest, dass nicht bloss die Knochen fortdauern, sondern auch die Zähne unzerstört bleiben, welche als Samenkörner für den in der Auferstehung wieder erblühenden Körper übrig bleiben.</p><p>Wenn dann schliesslich auch bei allen Toten das Sterbliche schon verschlungen angetroffen werden wird, so ist es sicher durch den Tod, die Ewigkeit, die Zeit verschlungen, oder ist es etwa durch das Leben, durch die Überkleidung, durch die Anlegung der Unsterblichkeit verschlungen? Wer behauptet, das Sterbliche werde durch die zuletzt genannten Dinge verschlungen werden, der leugnet damit, dass es durch die andern geschehe. Jedenfalls wird es angemessen sein, dass dies durch die göttlichen Kräfte, nicht durch Gesetze der Natur zustande komme und geleistet werde.</p><p>Da also, was sterblich ist, vom Leben verschlungen werden soll, so muss es jedenfalls herbeigeschafft werden, um verschlungen werden zu können, und verschlungen werden, um verwandelt werden zu können. Wenn das Feuer angezündet werden soll, so kann man nicht das, wodurch es angezündet wird, einmal für notwendig erklären, einmal nicht. So auch, wenn Paulus noch in betreff derer, welche am Tage des Herrn nicht mehr am Leben und nicht im Leibe angetroffen werden, hinzusetzt: „wir werden entkleidet gefunden, nicht nackt“, so kann er nicht an andern Stellen geleugnet haben, dass die von ihm vorher „entkleidet“ Genannten nackt seien, als nur dann, wenn er sie für überkleidet angesehen wissen wollte mit derselben Substanz, deren sie beraubt worden waren. Wie sie nämlich alsdann nackt angetroffen werden, wenn sie entweder den Leib ganz abgelegt haben oder derselbe teilweise zerrissen und aufgerieben ist — denn auch dies kann Nacktheit genannt werden, — so werden sie ihn fortan wieder annehmen, damit sie, von neuem mit dem Leibe bekleidet, auch mit der Unsterblichkeit überkleidet werden können. Denn überkleidet kann niemand werden, als wenn er schon bekleidet ist.</p>
      <h2>43</h2><p>Wenn Paulus sagt: „Wir sind immer voll Vertrauens, indem wir wissen, dass, so lange wir im Körper weilen, wir fern sind vom Herrn; denn im Glauben wandeln wir und nicht im Anschauen“, dann ist klar, dass dies ebenfalls keine Heruntersetzung des Fleisches sein soll, als ob dieses es wäre, was uns von dem Herrn trennt. Auch hier haben wir nur eine Ermahnung, das gegenwärtige Leben zu verachten, vor uns. Denn wir weilen fern vom Herrn, so lange wir leben; wir wandeln nur im Glauben, nicht im Schauen, d. h. in der Hoffnung, nicht im Besitz. Deshalb fährt er fort: „Wir sind voll Vertrauens und halten es mehr für etwas gutes, fern vom Leibe zu sein und beim Herrn zu weilen“, um nämlich lieber in der Anschauung zu wandeln als im Glauben, im Besitz, und nicht bloss in der Hoffnung. Da sieht man, wie sehr er auch hier die Verachtung des Körpers mit den Vorzügen des Martyriums in Beziehung setzt! Denn niemand, der fern vom Körper weilt, weilt darum schon sofort beim Herrn, ausser wenn er nämlich zur Belohnung des Martyriums im Paradiese und nicht in der Unterwelt sich aufhalten wird. Haben dem Apostel etwa die Ausdrücke gefehlt, um den Austritt aus dem Körper zu bezeichnen, oder spricht er absichtlich auf eine neue Art? Keineswegs, sondern indem er die bloss zeitliche Abwesenheit vom Körper andeuten wollte, wählte er den Ausdruck, dass wir von ihm fern in der Fremde seien, weil derjenige, welcher in der Fremde ist, wieder in seine Wohnung zurückkehrt.</p><p>Sodann sagt er in bezug auf alle: „Und darum mögen wir nun noch so fern sein oder bei ihm weilen, befleissigen wir uns, Gott wohlgefällig zu sein; denn wir alle müssen offenbar werden vor dem Richterstuhl Christi Jesu“. Wenn wir alle, dann auch als ganze Wesen; wenn als ganze, dann auch als innerliche und äusserliche, d. h. sowohl die Leiber als die Seelen, „auf dass jeder empfange“, heisst es, „die Werke des Leibes, gemäss dem, wie er gewirkt hat, sei es Gutes, sei es Böses“. Nunmehr stelle ich die Frage, wie liesest du diese Stelle — denn er hat sie gleichsam in etwas verwirrter Weise mit Hyperbaton konstruiert, — „was mittels des Leibes zu empfangen sein wird“ oder „was mittels des Leibes gethan wurde“? Auch wenn man konstruiert: „was vermittelst des Leibes zu empfangen sein wird“, auch dann ist die Auferstehung ohne Zweifel eine körperliche, und wenn man konstruiert „was mittels des Leibes gethan wurde“, dann ist dies natürlich auch mittels des Leibes, durch welchen es geschehen ist, auch wieder zu vergelten. So wird die ganze Auseinandersetzung des Apostels, die in diesen Schluss ausläuft, in einem Sinne zu verstehen sein, der mit den Schlussworten harmoniert.</p>
      <h2>44</h2><p>Wenn man noch näherhin auf das Vorangegangene, wodurch die Erwähnung des innern und äussern Menschen veranlasst wurde, zurückblickt, wird man da nicht auch die Würde und Hoffnung des Leibes in ihrer Vollständigkeit finden? Wenn Paulus nämlich, in betreff des Lichtes, welches Gott in unseren Herzen zur Erleuchtung angezündet hat, damit man seine Herrlichkeit in der Person Christi erkenne, sagt, „wir tragen diesen Schatz in irdenen Gefässen“, nämlich im Fleische, wird dasselbe etwa, weil es seiner Herkunft nach vom Lehme, irden ist, zerstört, oder wird es nicht vielmehr, weil es zum Aufbewahren des himmlischen Schatzes dient, erhöht werden? Wenn nun sogar jenes wahre Licht Gottes, das in der Person Christi das Leben in sich enthält, und dieses selbige Leben mit dem Lichte dem Fleische anvertraut wird, kann dann wohl das, dem das Leben anvertraut wird, dem Untergange ausgesetzt sein? Fürwahr, dann würde der Schatz selbst ein vergänglicher sein, da man Vergänglichem nur Vergängliches anvertraut, wie den alten Schläuchen neuen Wein.</p><p>Wenn Paulus dann ebenso fortfährt: „Wir tragen immer das Sterben Christi an unserem Leibe“, was wird das für ein Gegenstand sein, der neben der Benennung „Tempel Gottes“ auch noch die eines Grabes Christi zu führen imstande ist? Warum tragen wir das Sterben des Herrn am Leibe herum? „Damit das Leben“, lautet die Antwort, „offenbar werde.“ Wo denn? Am Körper. An welchem? Am sterblichen. Also an dem Leibe, welcher infolge der Schuld allerdings sterblich ist, aber auch lebensfähig durch die Gnade, und siehe nur zu, durch welche grosse Gnade; denn in ihm wird ja das Leben Christi geoffenbart. Also an einer Sache, die dem Heile fremd ist, an dem Gegenstande beständig dauernder Auflösung wird das ewige Leben Christi sich offenbaren, das beständige, das unvergängliche, jenes Leben, das bereits Leben Gottes ist? Jenes Leben, welches er lebte bis zu seinem Leiden, welches nicht bloss bei den Juden bekannt war, sondern nunmehr, auch allen Heiden mitgetheilt worden ist!</p><p>Paulus hat hier also auf dasjenige Leben hingedeutet, welches die diamantenen Pforten des Todes, die ehernen Riegel des Totenreichs gesprengt hat, welches von da an bereits auch uns zugehört. Es wird sich am Leibe offenbaren. Wann? Nach dem Tode. Wie? Wenn wir im Körper auferstehen so wie Christus. Damit nun niemand den Trugschluss mache, das Leben Christi werde schon jetzt geoffenbart in unserem Leibe, vermittelst der Übung der Heiligkeit, Geduld, Gerechtigkeit und Weisheit, womit das Leben des Herrn geschmückt war, darum hat die vorsichtige Aufmerksamkeit des Apostels hinzugefügt: „Denn wenn wir, die wir leben, in den Tod hingegeben werden um Jesu willen, damit sein Leben sich offenbare im sterblichen Leibe“. Dies werde sich, sagt er also, nach unserem Tode an unserem Körper zutragen. Geschieht es erst dann, wie wird es geschehen ohne seine Wiederauferweckung? Darum sagt er zum Schluss auch: „Wohl wissend, dass der, welcher Jesum auferweckt hat, auch uns mit ihm auferwecken wird“, weil er schon von den Toten auferstanden ist; es müsste denn sein, dass das „mit ihm“ so viel als „wie ihn“ bedeutet. Bedeutet es aber „wie ihn“, dann wird er uns sicherlich nicht ohne den Leib auferwecken.</p>
      <h2>45</h2><p>Mit einer Blindheit anderer Art klammern sie sich an den Ausdruck die beiden Menschen, „der alte und der neue“, an der Stelle, wo der Apostel uns ermahnt, „den alten Menschen, der vergeht durch die Begierlichkeit der Verführung, abzulegen, uns zu erneuern im Geiste des Verstandes und den neuen Menschen anzuziehen, der nach Gott geschaffen ist in der Gerechtigkeit und Heiligkeit der Wahrheit“, und behaupten, dass er auch hier, nach den beiden Substanzen unterscheidend, das Alter für das Fleisch, die Neuheit für die Seele, für das alte also, d. h. für den Leib, ein beständiges Vergehen in Anspruch genommen habe.</p><p>Aber gut, wenn es nach Substanzen geht, so ist weder die Seele der neue Mensch, weil das Spätere, noch auch der Leib der alte, weil das Frühere. Denn wie klein ist der Zeitraum, der zwischen der Thätigkeit der Hände Gottes und dem Anhauchen liegt! Ich würde zu behaupten wagen, selbst wenn der Leib viel früher da war als die Seele, so hat Gott ihr dennoch dadurch, dass der Leib darauf angewiesen war, von der Seele erfüllt zu werden, die Priorität verliehen. Denn jede Vervollkommnung und Vollendung ist, wenn sie auch der Zeitfolge nach später kommt, der beabsichtigten Wirkung nach früher da. Früher ist das, ohne welches die wirklich früher existierenden Dinge nicht sein können. Ist das Fleisch der alte Mensch, zu welcher Zeit war es das denn? Von Anfang an? Aber der ganze Adam war neu, und bei Neuheit ist niemand alt. Auch nachher, seitdem der Segen über die Fortpflanzung ausgesprochen ist, entstehen Leib und Seele, ohne dass dabei eine Zeit in Rechnung käme, weil ihr Same im Mutterleibe zu gleicher Zeit gelegt wird, wie wir in der Abhandlung über die Seele gezeigt haben. Sie haben gleiche Zeiten hinsichtlich der Empfängnis und gleiches Alter in bezug auf die Geburt. Sie stellen auf diese Weise diese beiden Menschen, die allerdings zwiefacher Substanz aber nicht zwiefachen Alters sind, als einen einzigen dar, da keiner früher ist als der andere. Richtiger wäre es, dass wir mit unserer ganzen Persönlichkeit entweder alt oder neu sind, denn auf welche Weise wir das eine oder das andere sein sollen, ist unbegreiflich. Doch der Apostel gibt ganz deutlich zu erkennen, was der „alte Mensch“ ist. „Lege ab“, sagt er „den alten Menschen“ nach dem früheren Wandel, nicht den, der alt ist wegen des hohen Alters irgend eines Bestandteils. Er schreibt uns ja auch nicht vor, dass wir das Fleisch ablegen sollen, sondern die Werke, die er auch anderwärts als fleischliche kennzeichnet; nicht die Körper klagt er an, sondern er fügt vielmehr auch hier in betreff derselben bei: „Ablegend alle Lüge redet die Wahrheit, ein jeder zu seinem Nächsten, weil wir einer des andern Glieder sind! Zürnet, aber wollet nicht sündigen! Die Sonne gehe nicht unter über Eurem Zorn! Gebet dem Teufel keinen Raum! Wer gestohlen hat, der stehle nicht mehr, er arbeite vielmehr und schaffe mit seinen Händen, damit er habe, um den Bedürftigen mitzuteilen! Keine irgendwie schändliche Rede gehe hervor aus Eurem Munde, sondern eine solche, wie sie am besten dient zur Erbauung im Glauben, so dass sie den Hörern Gnade verschaffe! Wollet den heiligen Geist nicht betrüben, in welchem Ihr besiegelt seid am Tage Eurer Erlösung! Seid einer gegen den andern gütig, mildthätig, einander vergebend, wie Euch Gott auch vergeben hat in Christo!“</p><p>Warum beschleunigen also die Leute, die den Leib für „den alten Menschen“ ansehen, nicht ihren Tod, um den Vorschriften des Apostels durch Ablegung des alten Menschen nachzukommen? Wir, die wir glauben, dass der gesamte Glaube sich im Leibe auswirken müsse, wozu sowohl der Mund gehört, um immer nur die besten Reden hervorzubringen, als auch die Zunge, um nicht zu lästern, das Herz, damit es nicht zürne, sowie die Hände, damit sie arbeiten und austeilen — wir behaupten, dass sowohl das Alte im Menschen als auch das Neue sich auf den moralischen, nicht auf einen substanziellen Unterschied beziehe; daher erkennen wir ebensosehr an, dass derselbe Mensch, der seinem früheren Wandel nach ein alter gewesen ist, vergehe, indem er so genannt worden ist wegen der Begierlichkeit der Verführung, sowie er auch „alt“ ist wegen seines frühern Wandels, nicht wegen des Fleisches, und zwar in einem immer dauernden Untergang, wobei er im übrigen aber dem Fleische nach ebensowohl erhalten als auch dieselbe Person sein wird, nämlich seines fehlerhaften Wandels, nicht der Körperlichkeit nach entkleidet.</p>
      <h2>46</h2><p>So wird man das Verfahren des Apostels überall finden; er verurteilt nämlich die Werke des Fleisches in einer Weise, dass er das Fleisch selbst zu verurteilen scheint, sorgt jedoch durch Einflössung anderer damit zusammenhängender Ansichten dafür, dass man sich jener Vorstellung nicht hingebe. Wenn er z. B. sagt, „die, welche im Fleische sind, können Gott nicht gefallen“, so führt er sofort von der etwaigen falschen Auffassung zur richtigen zurück, indem er hinzusetzt: „Ihr aber seid nicht im Fleische, sondern im Geiste“. Denn dass sie sich im Fleische befanden, stand fest. Indem er nun doch wieder in Abrede stellt, dass sie sich im Fleische befänden, gibt er zu erkennen, dass sie sich mit den Werken des Fleisches nicht abgeben, und dass endlich jene Gott nicht gefallen können, welche <em>fleischlich</em> leben, nicht die, welche im Fleische leben, dass ihm die hingegen gefallen, welche im Fleische befindlich dem Geiste gemäss wandeln.</p><p>Und wiederum gebraucht er den Ausdruck, der „Leib sei tot“, — wegen der Vergehungen — der Geist sei das Leben — wegen der Gerechtigkeit. Wenn er dem Tode, der ja ohne Zweifel das Fleisch trifft, das Leben entgegensetzt, so verheisst er das Leben — infolge der Gerechtigkeit — auch da, wo er den Tod als Folge des Fehltritts verkündet hat. Er hätte vergebens das Leben dem Tode entgegengesetzt, wenn es sich nicht ebenda fände, wo sich dessen Gegensatz befindet, von dem der Körper natürlich zu befreien ist. Wenn nun aber das Leben den Tod vom Körper vertreibt, so kann es dies nicht, ohne das zu durchdringen, wo sich befindet, was vertrieben wird.</p><p>Doch warum soll meine Rede verwickelter sein, da die Ausdrucksweise des Apostels vollendeter ist? „Wenn der Geist dessen“, sagt er, „der Jesum auferweckt hat, in Euch wohnt, so wird der, welcher Jesum von den Toten auferweckt hat, auch Eure sterblichen Körper auferwecken, wegen des Euch innewohnenden Geistes.“ Danach würde sogar jeder, der die Seele für einen sterblichen Körper hält, da er nicht umhin kann, dies auch vom Leibe zu behaupten, gezwungen sein, die Wiedererweckung des Leibes anzuerkennen, infolge des gleichartigen Zustandes. Auch aus folgendem mag man noch lernen, dass die Werke des Fleisches verdammt werden, nicht es selbst. „Brüder, so sind wir denn“, sagt er, „Schuldner nicht dem Fleische, um danach zu leben. Wenn Ihr nach dem Fleische lebet, so werdet Ihr sterben, wenn Ihr aber durch den Geist die Werke des Fleisches ertötet, so werdet Ihr leben.“</p><p>Wenn nun aber, um auf alles einzelne zu antworten, denen, die sich zwar im Fleische befinden, aber nach dem Geiste leben, das Heil verheissen wird, so steht dem Heile nicht das Fleisch im Wege, sondern das Thun des Fleisches. Wenn aber die fleischliche Handlungsweise, diese Todesursache, beseitigt ist, so steht das Fleisch schon als gerettet da, weil frei von der Ursache des Todes. „Denn das Gesetz des Geistes des Lebens in Christo Jesu“, spricht er, „hat mich frei gemacht vom Gesetze der Übertretung und des Todes“, gewiss nur das Gesetz, welches, wie er oben gesagt hatte, „in unseren Herzen wohnt“. Folglich werden unsere Glieder nicht mehr unter dem Gesetze des Todes gehalten werden, weil nicht mehr unter dem der Übertretung, von welchen beiden sie freigemacht sind. „Denn Gott hat — wozu das Gesetz unvermögend war, weil kraftlos wegen des Fleisches — indem er seinen Sohn in der Ebenbildlichkeit mit dem Fleische der Übertretung und der Übertretung wegen gesandt hat, die Übertretung im Fleische verurteilt“, nicht umgekehrt, das Fleisch in der Uebertretung, denn ein Haus wird ja auch nicht mit seinem Bewohner verdammt werden. Er hat nämlich gesagt, „die Sünde wohne in unserem Körper“. Wenn die Übertretung aber verdammt und abgethan ist, so ist das Fleisch freigesprochen, so wie es, wenn sie noch nicht verdammt ist, dem Gesetze des Todes und der Übertretung verfallen ist. Darum hat er auch die fleischliche Gesinnung „Tod“, sodann auch „Feindschaft gegen Gott“ genannt, aber niemals das Fleisch selbst.</p><p>Gut, wird man einwenden, wem wird also nun die fleischliche Gesinnung zugerechnet werden, wenn nicht eben der Substanz selbst? — Sie würde es allerdings, wenn man zu zeigen imstande wäre, das Fleisch habe aus sich eine Gesinnung. Wenn es aber ohne die Seele keine Gesinnung hat, so erkenne daraus, dass „die fleischliche Gesinnung“ auf die Seele zu beziehen und nur vorläufig auf das Fleisch übertragen sei, weil sie wegen und mittels des Fleisches sich auswirkt. Darum drückt er sich auch aus, die Übertretung „wohne im Fleische“, weil die Seele, von welcher die Übertretung ausgeht, eine Einwohnerin des Leibes ist, der zwar getötet ist, aber nicht seinetwegen, sondern wegen der Übertretung. Denn an einer andern Stelle sagt er: „Wie könnt Ihr, als lebtet Ihr noch in der Welt, die Satzung tragen?“ So schrieb er nicht an Verstorbene, sondern an solche, welche aufhören sollten, nach den Gebräuchen der Welt zu leben.</p>
      <h2>47</h2><p>Das weltliche Leben wird wohl in dem zu suchen sein, wovon er sagt, dass es der alte Mensch sei, der mit Christus gekreuzigt ist, nicht die Körperlichkeit, sondern die sittliche Qualität. Wollen wir es aber nicht so auffassen, so ist unsere Körperlichkeit nicht gekreuzigt und unser Leib hat vom Kreuze Christi nichts gespürt, sondern es steht in dem Sinne, wie er beifügt: „damit der Leib der Übertretung abgethan werde“ durch Besserung des Lebens, nicht durch Zerstörung der Substanz, und wie er sagt, „damit wir fürder der Übertretung nicht mehr dienen“, und „dass wir auf diese Weise mit Christus gestorben, glauben, dass wir auch mit ihm leben werden“. „In diesem Sinne nämlich“, sagt er, „haltet Euch für Abgestorbene.“ Wem abgestorben? Dem Fleische? Nein, sondern der Übertretung. Folglich werden sie dem Fleische nach unversehrt sein und doch Gott leben in Christo Jesu, natürlich vermittelst des Fleisches, dem sie nicht gestorben sind, da sie der Übertretung abgestorben sind, nicht dem Fleische. Er fügt auch noch bei: „Es möge also nicht herrschen in Eurem sterblichen Leibe die Übertretung, um ihr Gehör zu schenken und Eure Glieder zu Werkzeugen der Ungerechtigkeit herzugeben für die Übertretung, sondern gebt Euch selbst Gott hin als vom Tode wieder Aufgelebte“ — nicht wie Lebende, sondern wie vom Tode wieder Aufgelebte — „und Eure Glieder als Werkzeuge für die Gerechtigkeit“. Und wiederum: „Wie Ihr Eure Glieder dargeboten habt, zu dienen der Unreinheit und der Ungerechtigkeit, so gebet nun Eure Glieder hin, zu dienen der Gerechtigkeit zur Heiligkeit; denn da Ihr Diener der Übertretung gewesen seid, waret Ihr ledig der Gerechtigkeit. Welche Frucht habet Ihr denn nun gehabt von den Dingen, deren Ihr Euch jetzt schämet? Ihr Ende ist der Tod. Nun aber seid Ihr ledig geworden der Übertretung; als Diener Gottes aber habt Ihr als Frucht die Heiligung, als Ende das ewige Leben. Denn der Sold der Übertretung ist der Tod, der Lohn Gottes aber ist das ewige Leben in Christo Jesu, unserem Herrn.“</p><p>Da er so diese ganze Gedankenreihe hindurch bestrebt ist, unsere Glieder von der Ungerechtigkeit und Übertretung fernzuhalten, sie für die Gerechtigkeit und Heiligkeit zu gewinnen und sie vom Solde des Todes zum Lohn des ewigen Lebens hinüberzuführen, so verspricht er damit natürlich als Lohn dafür auch dem Leibe das Heil. Ihm eine besondere Sittenzucht der Heiligkeit und Gerechtigkeit aufzuerlegen, wäre überhaupt unstatthaft gewesen, wenn es für ihn nicht auch eine Vergeltung eben dieser Sittenzucht gäbe. Es wäre sogar unstatthaft gewesen, ihm die Taufe zu erteilen, wenn er durch diese Wiedergeburt nicht auch zur Wiederherstellung vorbereitet würde, was der Apostel denn auch anzeigt mit den Worten: „Wisset Ihr nicht, dass wir alle, die in Christo untergetaucht sind, auf seinen Tod untergetaucht sind? Wir sind also mit ihm begraben durch die Taufe auf seinen Tod, so dass, wie Christus von den Toten auferstanden ist, so auch wir in Neuheit des Lebens wandeln sollen.“ Und damit Du nicht meinst, das gelte bloss für jenes Leben, welches wir in Kraft der Taufe aus dem Glauben in Neuheit führen sollen, so hat er mit Wohlbedacht hinzugefügt: „Wenn wir miteingepflanzt sind dem Bilde des Todes Christi, so werden wir es auch demjenigen seiner Auferstehung sein“. Im Bilde nämlich sterben wir in der Taufe, aber in Wirklichkeit stehen wir wieder auf im Fleische, wie Christus; „damit, wie im Tode die Übertretung geherrscht hat, so auch die Gnade herrsche durch die Gerechtigkeit zum ewigen Leben durch Jesus Christus, unsern Herrn“.</p><p>Wie wird sie das aber können, wenn es nicht ebenfalls auch in bezug auf den Leib geschieht? Wo der Tod ist, da wird auch nach dem Tode das Leben sein, aus dem Grunde, weil vorher da Leben war, wo jetzt Tod ist. Denn wenn die Herrschaft des Todes nichts weiter bewirkt als die Auflösung des Leibes, so muss das Gegentheil ein dem Tode entgegengesetztes Leben bewirken, d. h. also eine Wiederherstellung des Leibes, damit der Tod ebenso, wie er früher mit seiner Macht der verschlingende war, nun nach der Verschlingung der Sterblichkeit von der Unsterblichkeit die Worte zu hören bekomme: „Tod, wo ist dein Stachel? Tod, wo ist dein Sieg?“ Auf diese Weise ist die Gnade da, wo die Gottlosigkeit überschwenglich gewesen war, noch überschwenglicher. So gelangt die Kraft in der Schwäche zu ihrer Vollendung, indem sie, was verloren war, errettet, was tot ist, belebt, was geschlagen ist, heilt, was matt ist, erquickt, was genommen ist, wiedergibt, was in Knechtschaft geraten war, befreit, was verführt ist, zurückruft und was niedergeworfen ist, wiedererhebt, und zwar von der Erde in den Himmel, „wo wir“, wie die Philipper vom Apostel erfahren, „auch unsern Wandel haben, von wo wir auch den Erlöser erwarten, Jesum Christum, welcher den Leib unserer Niedrigkeit umgestalten wird, gleichgestaltig dem Leibe seiner Herrlichkeit“. Ohne Zweifel geschieht dies nach der Auferstehung, weil nicht einmal Christus selber vor seinem Leiden verherrlicht worden ist.</p><p>So steht es um unsere Körper, welche als lebendige, heilige, Gott versöhnende Opfergabe darzubringen Paulus die Römer beschwört. Wie könnten sie lebendig sein, wenn sie untergehen werden? wie heilig, wenn sie profan sind? wie versöhnend, wenn sie verdammt werden? Wie werden jene das Licht der hl. Schrift scheuenden Menschen vollends erst die Stelle an die Thessalonicher auffassen, welche so klar ist, wie mit einem Sonnenstrahl geschrieben: „Er selbst aber, der Gott des Friedens möge Euch vollständig heiligen“. Noch nicht genug! Nein, es folgt noch: „Euer ganzer Leib, Seele und Geist mögen ohne Tadel bewahrt werden bis auf die Ankunft des Herrn“. Da sieht man nun, wie die gesamte Wesenheit des Menschen zum Heile bestimmt ist und zwar für keine andere Zeit als die der Ankunft des Herrn, welche der Schlüssel zur Auferstehung ist!</p>
      <h2>48</h2><p>Aber Fleisch und Blut, wendet man ein, können ja das Reich Gottes nicht besitzen. — Wir kennen diese Schriftstelle auch und haben sie absichtlich bis jetzt verspart, um das, was uns die Gegner sofort im ersten Haupttreffen entgegen stellen, beim letzten Kampfe niederzuschlagen, nachdem zuvor alle Fragen, gleichsam ihre Hilfstruppen, zersprengt sind. Auch hier ist es erspriesslich, das Vorhergehende zu berücksichtigen, damit auch hier der Ausgangspunkt die Entscheidung für Feststellung des Sinnes gebe.</p><p>Mich dünkt, der Apostel hat, nachdem er den Korinthern alle bebesondern Punkte der Kirchenzucht vorgelegt, zum Schluss den Schwerpunkt seines Evangeliums und ihres Glaubens in die Anempfehlung des Todes des Herrn und seiner Auferstehung gelegt, um auch für unsere Hoffnung den Leitstern in dem zu finden, von wo sie ausgeht. Daher fährt er fort: „Wenn Christus verkündigt wird als der, welcher von den Toten auferstanden ist, wie können dann einige unter Euch sagen, dass es keine Auferstehung gebe? Wenn es eine solche nicht gibt, so ist auch Christus nicht auferstanden. Wenn aber Christus nicht auferstanden ist, so ist vergebens unsere Predigt und leer auch Euer Glaube. Denn wir würden als falsche Zeugen Gottes erfunden werden, indem wir das Zeugnis geben, er habe Christum auferweckt, da er ihn doch nicht auferweckt hat. Denn wenn die Toten nicht auferstehen, so ist auch Christus nicht auferstanden. Wenn Christus nicht auferstanden ist, so ist leer Euer Glaube, weil ihr Euch noch in Euren Sünden befindet, und die in Christo Entschlafenen sind verloren.“</p><p>Für die Annahme welches Glaubenssatzes will er durch diese Worte wohl den Grund in uns legen? — Für die Auferstehung der Toten, welche geleugnet wurde, antwortest du. Er wollte gewiss den Glauben an sie durch sein Beispiel von der Auferstehung des Herrn erwecken? — Deine Antwort lautet: Ohne Zweifel. Beruht aber weiter das Wesen eines Beispiels in einer Verschiedenheit oder in seiner Gleichartigkeit? — Jedenfalls in der Gleichartigkeit, antwortest du. Wie ist denn aber Christus auferstanden? Im Fleische oder ohne dasselbe? Wenn man durch die hl. Schrift erfährt, dass er gestorben und begraben worden sei nicht anders als im Fleische, so wird man ohne Zweifel zugestehen, dass er ebenso auch im Fleische auferstanden sei. Denn eben dasselbe, was im Tode hingesunken ist und im Grabe gelegen hat, ist auch auferstanden, nicht sowohl der Christus im Fleische, als das Fleisch in Christo. Sollen wir also nach Analogie Christi auferstehen, der im Fleische auferstanden ist, so würden wir schon nicht mehr nach Analogie Christi auferstehen, wenn wir nicht auch im Fleische auferständen: „weil durch einen Menschen,“ wie es heisst, „der Tod und durch einen Menschen die Auferstehung“. Damit sollen die Urheber dieser beiden Dinge auseinander gehalten werden, Adam als der des Todes, Christus als der der Auferstehung, und zugleich die Auferstehung gerade der Substanz, der der Tod eignet, durch diese Gleichstellung der beiden Urheber unter dem Namen „Mensch“ aufrecht erhalten werden. Denn wenn wir alle, so wie wir in Adam alle sterben, in Christo lebendig gemacht werden, so werden wir dem Fleische nach in Christo lebendig gemacht, wie wir dem Fleische nach in Adam sterben, ein jeglicher in seinem besonderen Range, weil in seinem eigenen Leibe.</p><p>Rang und Stand wird nämlich nach den bestehenden Verdiensten eingerichtet. Da aber auch dem Leibe Verdienste zugeschrieben werden, so muss notwendig auch eine Rangordnung der Leiber festgestellt werden, damit es eine solche der Verdienste geben könne. „Wenn sich einige sogar für Verstorbene taufen lassen, so wollen wir sehen, ob es mit Grund geschieht. Sicher ist, dass Paulus behauptet, sie hätten dies vorgenommen, weil sie glaubten, dass eine stellvertretende Taufe auch dem Leibe des andern nützen werde, zur Hoffnung auf die Auferstehung. Wenn diese nicht leiblich wäre, dann würde andernfalls so, durch eine körperliche Taufe, kein Anrecht darauf erworben werden. Warum gebraucht er den Ausdruck, sie selber seien getauft, wenn die Leiber, die getauft werden, nicht auferstehen? Denn die Seele wird nicht durch das Abwaschen, sondern durch das Gelöbnis geheiligt.</p><p>„Warum,“ fragt er, „sind auch wir zur jeder Stunde in Gefahr?“ Natürlich durch das Fleisch. „Täglich sterbe ich“, natürlich durch die Fährlichkeiten des Leibes, mittels dessen er auch „gegen die wilden Tiere zu Ephesus gekämpft hat,“ nämlich die wilden Tiere seiner Bedrängnis in Asien, worüber er in einem zweiten Briefe an die Korinther schreibt: „Wir wollen nicht, Brüder, dass ihr in Unkenntnis bleibt hinsichtlich unserer Bedrängnis in Asien, wie wir mehr als über die Maassen bedrängt worden sind, so dass wir die Hoffnung am Leben aufgaben“. Dies alles zählt er, wenn mich nicht alles täuscht, aus dem Grunde her, damit die Peinigungen des Fleisches nicht für verloren angesehen, sondern die Auferstehung des Fleisches um so zweifelloser geglaubt werde. Aber da wird man wohl sagen: „Wie werden denn die Toten auferstehen? Mit welchem Leibe werden sie kommen?“</p><p>Damit kommt Paulus nun schon zur Besprechung der Frage nach der Beschaffenheit der Leiber, ob man wieder eben denselben oder einen andern annimmt. Allein diese Frage gilt erst als eine spätere und es wird vorläufig genügen, dass die Auferstehung auch durch den Umstand, dass die Frage nach der Beschaffenheit der Leiber gestellt wird, für eine körperliche erklärt worden ist.</p>
      <h2>49</h2><p>Nun kommen wir auf das Fleisch und Blut, in Wahrheit das Fleisch und Blut der ganzen Untersuchung. In welchem Sinne der Apostel diese Substanzen vom Reiche Gottes ausschliesse, kann man ebenfalls aus dem Vorhergehenden ersehen. „Der erste Mensch von der Erde“, sagt er, „war irdisch,“ d. i. von Lehm, nämlich Adam; der zweite Mensch ist vom Himmel“, d. h. der göttliche Logos, nämlich Christus. Er ist jedoch, wenn auch Mensch vom Himmel, in keiner andern Weise Mensch, als dass er ebenfalls Leib und Seele ist, d. h. Mensch, was Adam auch war. Wenn derselbe kurz zuvor „der letzte Adam“ genannt wurde, so hat er das Recht auf Führung dieses Namens nur durch den Anteil an dessen Substanz erlangt, weil ebenfalls Adam wie Christus seinen Leib nicht durch Zeugung erhalten hat. Wie also der Irdische beschaffen ist, so sind auch die Irdischen, wie der Himmlische so auch die Himmlischen. Sind sie es vermöge ihrer Substanz? Oder an erster Stelle infolge ihres sittlichen Wandels, sodann infolge ihrer Würde, die sie durch ihren Wandel erlangten? Nun dürften aber die Irdischen und die Himmlischen der Substanz nach in keiner Weise geschieden werden, da sie einmal vom Apostel den Namen Menschen erhalten haben. Wenn nämlich Christus auch im eigentlichsten Sinne der Himmlische, ja sogar ein Überhimmlischer ist, so ist er doch ein Mensch, weil er aus Leib und Seele besteht und sich in Hinsicht auf die Beschaffenheit der Substanzen durch nichts von der Art der Irdischen unterscheidet. Ebenso werden auch die, welche nach seinem Muster Himmlische sind, nicht um ihrer gegenwärtigen Substanz willen, sondern im Hinblick auf ihre künftige Verklärung als solche bezeichnet und angesehen, weil vorher, infolge ihrer verschiedenen Würdigkeit, von der diese Unterscheidung ihren Ausgang genommen hat, gezeigt worden ist, dass die Herrlichkeit der Überhimmlischen eine andere ist als die der Irdischen, eine andere die der Sonne, eine andere die des Mondes und eine andere die der Sterne; denn ein Stern unterscheidet sich ja auch vom andern an Glanz, nicht in der Wesenheit. So hat er denn, nach vorhergehender Hervorhebung des Unterschiedes in der Würdigkeit, nach welcher man jetzt trachten und die man in Zukunft erreichen soll, auch noch die Ermahnung hinzugefügt, man solle einerseits die Art Christi hienieden nachahmen in der sittlichen Zucht, andrerseits dort droben den Gipfel erreichen in der Herrlichkeit. „Wie wir das Bild des Irdischen getragen haben, so sollen wir auch tragen das Bild des Himmlischen.“ Wir haben nämlich das Bild des Irdischen getragen durch den Anteil an der Übertretung, durch die Gemeinsamkeit des Todes und die Ausweisung aus dem Paradiese. Obgleich wir hienieden das Bild Adams im Fleische an uns tragen, so werden wir doch nicht ermahnt, das Fleisch abzulegen. Wenn aber dies nicht gemeint ist, dann ist es der Wandel, damit wir sodann noch nicht das Bild Gottes, sondern das Bild des Himmlischen an uns tragen, noch nicht in den Himmel verpflanzt, sondern auf den Spuren Christi wandelnd in Heiligkeit, Gerechtigkeit und Wahrheit.</p><p>Somit zielt also jener ganze Ausspruch auf die Sittenzucht und besagt, man solle hienieden das Bild Christi tragen im jetzigen Leibe und in der jetzigen Zeit und Zucht. Indem Paulus in befehlender Form sagt: „Lasst uns tragen“, spricht er von der gegenwärtigen Zeit, in welcher der Mensch aus keiner andern Substanz besteht, als aus Leib und Seele; wenn aber dieser Glaube wirklich auf eine andere, d. i. auf eine himmlische Substanz zielte, so wäre sie doch nur demjenigen in Aussicht gestellt, der darnach zu ringen aufgefordert wird. Da er also das Abbild „des Irdischen und des Himmlischen“ in den Lebenswandel setzt, jenes als das zu verabscheuende, dieses als das nachzuahmende, und dann hinzufügt; „Denn ich sage dies“ — d. h. wegen des Obengesagten; es ist nämlich eine Satzverbindung, die den Sinn des Vorhergehenden vervollständigt — „weil Fleisch und Blut das Reich Gottes nicht ererben können“, so will er unter Fleisch und Blut nichts anderes verstanden wissen als das oben genannte Abbild des irdischen Adam. Wenn dieses nun im alten Wandel besteht, der alte Wandel aber das Reich Gottes nicht erlangt, so reduzieren sich Fleisch und Blut, insofern sie das Reich Gottes nicht erlangen, auf den alten Wandel.</p><p>Wenn der Apostel aber niemals die Substanz für die Wirkungen gesetzt hat, dann freilich soll er es auch hier nicht gethan haben! Wenn er hingegen von solchen, die sich noch im Fleische befinden, gesagt hat, sie befänden sich nicht darin, womit er nur sagte, dass sie sich mit Werken des Fleisches nicht abgeben, so darf man seine Gewohnheit nicht umstossen, die darin besteht, dass er nicht die Substanz, sondern die Werke der Substanz vom Reiche Gottes ausschliesst. Nachdem er dies den Galatern kund gethan hat, bekennt er, es ihnen vorauszusagen und vorausgesagt zu haben, „dass die, welche solche Dinge verüben, das Reich Gottes nicht ererben werden“, weil sie nämlich das Bild des himmlischen Adam nicht an sich tragen, wie sie das des irdischen an sich getragen hatten, und dass sie deshalb infolge ihres nicht veränderten alten Wandels für nichts weiter zu halten seien, als für Fleisch und Blut. Denn wenn der Apostel ganz unvorbereitet auf einmal mit dieser Erklärung hervorgetreten wäre, dass Fleisch und Blut vom Reiche Gottes ausgeschlossen werden müssen, ohne durch die vorhergehenden Gedanken darauf vorbereitet zu haben, würden wir da nicht ebenso unter jenen beiden Substanzen den alten Menschen verstanden haben, der dem Fleische und dem Blute ergeben ist, d. i. dem Essen und Trinken? der gewohnt ist, gegen den Glauben an die Auferstehung mit der Redensart zu kommen: „Lasst uns essen und trinken, denn morgen werden wir sterben“. Indem der Apostel auch dies hineinlegen wollte, hat er Fleisch und Blut wegen seiner Früchte, nämlich wegen des Essens und des Trinkens getadelt.</p>
      <h2>50</h2><p>Aber auch mit Beiseitelassung derartiger Auslegungen, wodurch die Werke des Fleisches und Blutes heruntergesetzt werden, wird man den Substanzen selber, nicht anders, als sie sind, aufgefasst, die Auferstehung zusprechen dürfen. Denn die Auferstehung wird dem Fleische und Blute direkt nicht abgesprochen, sondern das Reich Gottes, welches zur Auferstehung hinzukommt, — es gibt ja auch eine Auferstehung zum Gerichte, — oder richtiger noch, die allgemeine Auferstehung wird bestätigt, indem eine besondere dagegen gesetzt wird. Denn wenn gesagt wird, zu welchem Zustande man nicht aufersteht, so wird damit zu verstehen gegeben, zu welchem man auferstehe. Indem so das Thun und Treiben der Substanz, nicht deren Gattung, einen Unterschied in Hinsicht der Auferstehung je nach den Verdiensten erfährt, geht auch daraus klar hervor, dass Fleisch und Blut nur in Rücksicht auf ihre Schuld, nicht als Substanzen vom Reiche Gottes fern gehalten werden, dass sie dagegen um der Ordnung willen zum Gerichte auferstehen, eben weil sie zum Herrschen nicht auferstehen.</p><p>Ich möchte noch sagen: „Fleisch und Blut können das Reich Gottes nicht ererben“, d. h. natürlich bloss sie und für sich allein, so dass damit angezeigt wird, dass sie auch noch den Geist vonnöten haben. „Der Geist nämlich ist es, der lebendig macht — zum Reiche Gottes — das Fleisch nützt nichts“. Nützen aber kann ihm etwas anderes, nämlich der Geist, und durch den Geist auch die Werke des Geistes. Und so erstehet denn, wie billig und recht, alles Fleisch und Blut wieder in seiner Eigenschaft. Allein diejenigen, welche in das Reich Gottes eingehen sollen, die werden anziehen müssen die Kraft der Unvergänglichkeit und Unsterblichkeit, ohne welche sie nicht in das Reich Gottes eingehen können, bevor sie dieselbe erhalten können. Mit Recht also sind Fleisch und Blut, wie wir gesagt haben, für sich allein nicht imstande, das Reich Gottes zu erlangen. Aber dann, wenn das Verwesliche im Begriff ist, „von der Unverweslichkeit verschlungen zu werden“,— nämlich das Fleisch — „und das Sterbliche von der Unsterblichkeit“— nämlich das Blut — nach der Auferstehung, bei der Verwandlung, alsdann kann das nach Verdienst umgestaltete oder verschlungene Fleisch und Blut das Reich Gottes erben, aber keineswegs das noch nicht auferstandene.</p><p>Einige wollen unter dem Fleisch und Blut der Beschneidung wegen das Judentum verstanden wissen, da es vom Reiche Gottes getrennt sei, weil das Judentum es mit dem Alten hält und unter diesem Titel von dem Apostel schon an einer andern Stelle getadelt worden ist. Derselbe „ratschlagte nämlich, nachdem ihm der Sohn Gottes geoffenbart war, damit er ihn unter den Heiden verkündige, nicht sofort mit Fleisch und Blut“, d. i. mit dem Judentum, wie er den Galatern geschrieben hat.</p>
      <h2>51</h2><p>Für alles jedoch wird nunmehr das stehen, was wir zum Schluss aufgespart haben; auch für den Apostel selbst, der im höchsten Grade der Unbedachtsamkeit zu zeihen wäre, wenn er, wie einige wollen, in solch abgerissenener Weise, sozusagen mit geschlossenen Augen unterschiedslos und unbedingt <em>alles</em> Fleisch und Blut ganz allgemein aus dem Reiche Gottes verbannt hätte, selbstverständlich auch aus dem Königspalaste des Himmels selber, obwohl doch jetzt dort zur Rechten des Vaters Jesus sitzt; Mensch, wenngleich Gott; letzter Adam, wenn auch ursprüngliches Wort; Fleisch und Blut, obgleich von reinerer Beschaffenheit als das unsrige, und doch eben derselbe sowohl der Substanz als der Gestalt nach, wie bei seiner Himmelfahrt. Er wird nach der Aussage der Engel ebenso wieder herabsteigen; denn er soll ja wieder erkannt werden von denen, welche ihn verwundet haben. Dieser ist es, der „Mittler zwischen Gott und den Menschen“ genannt worden ist, infolge davon, dass ihm von beiden Parteien ein Depositum anvertraut wurde, und er verwahrt bei sich selbst auch das Depositum des Leibes, das Unterpfand der Gesamtsumme. Denn, wie er uns das Handgeld des Geistes zurückliess, so hat er von uns das Handgeld des Leibes empfangen und es mit sich in den Himmel genommen als Unterpfand dafür, dass die Gesamtsumme einst von dort zurückkomme. Seid unbesorgt, Fleisch und Blut, ihr habt in Christus das Reich Gottes und den Himmel bereits inne! Oder wer euch dieses und den Himmel abspricht, der leugnet auch Christum im Himmel selber.</p><p>So sagt Paulus auch: „Die Verwesung wird nicht die Unvergänglichkeit ererben“, nicht damit man Fleisch und Blut für die Verwesung halte, da sie ja vielmehr nur das der Verwesung Ausgesetzte sind, nämlich infolge des Todes; denn der Tod ist es, der Fleisch und Blut nicht nur verdirbt, sondern auch aufzehrt, — wohl aber hat er deshalb, weil nach seinem früheren Ausspruche die Werke des Fleisches und Blutes das Reich Gottes nicht erlangen können, um diesen Ausspruch noch mehr zu verstärken, sogar der Verderbnis selbst, d. i. dem Tode, welchem die Werke des Fleisches und Blutes in die Hände arbeiten, die Erbschaft der Unvergänglichkeit genommen. Denn bald darauf hat er gewissermassen von einem Tode des Todes selbst etwas verlauten lassen und gesagt: „Verschlungen ist der Tod im Streit. Wo ist, Tod, dein Stachel, wo ist, Tod, deine Macht?“ Der Stachel des Todes besteht in der Übertretung; diese wird dann auch die Verwesung sein. Die Kraft aber ist das Gesetz der Sünde, ohne Zweifel jenes andere, welches er in seine Glieder versetzt hat, welches gegen das Gesetz seines Geistes streitet, nämlich eben die Macht, zu sündigen wider Willen. Denn oben hat auch er gesagt, der letzte Feind, der Tod, werde vernichtet.</p><p>Auf diese Weise erlangt die Verwesung nicht die Unvergänglichkeit als ihr Erbtheil. Das heisst, auch der Tod wird keinen Bestand haben. Wann und wie wird er aber ein Ende nehmen? Wenn „in einem Nu, in einem Augenblick bei der letzten Posaune auch die Toten unverweslich auferstehen“. Wer sind diese, wenn nicht die, welche vorher verwest waren? d. h. die Leiber, d. h. Fleisch und Blut. „Auch wir werden verändert“. Aus welchem Zustand, wenn nicht aus demjenigen, in welchem wir angetroffen werden? „Denn es muss dieses Verwesliche anziehen die Unvergänglichkeit und dieses Sterbliche anziehen die Unsterblichkeit“. Welches Sterbliche? Doch nur der Leib? Welches Vergängliche, wenn nicht das Blut. Und damit du da, wo der Apostel für dich Vorsorge trifft und sich abmüht, damit du einsiehest, der Ausspruch beziehe sich auf den Leib, nicht glaubest, er habe etwas anderes dabei im Sinn, so spricht er die Worte: <em>„dieses</em> Vergängliche und <em>dieses</em> Sterbliche“, gleichsam indem er seine eigene Haut hinhält. Er konnte das Wort: „dieses“ sicher nur auf etwas Vorliegendes und Sichtbares beziehen. Es ist der Ausdruck für das körperliche Zeichen. Das Verwesliche ist aber etwas anderes als die Verwesung, das Sterbliche etwas anderes als die Sterblichkeit. Denn das, was leidet, ist etwas anderes als das, was das Leiden bewirkt? So muss denn also dasjenige, was die Verwesung und das Sterben zu erleiden hat, auch die Unverweslichkeit und Unsterblichkeit an sich erfahren.</p>
      <h2>52</h2><p>Untersuchen wir nun, mit was für einem Leibe die Abgestorbenen nach des Apostels Lehre wiederkommen werden. Es ist gut, dass er sich sofort daran gemacht hat, es zu zeigen, gleich als ob jemand nach diesen Dingen gefragt hätte.</p><p>„Du Thor“, sagt er, „was Du säest, wird nicht belebt, es sei denn gestorben.“ Mithin geht schon aus der Analogie des Säens hervor, dass kein anderer Leib wieder lebendig wird als der, welcher gestorben ist, und darnach wird auch das folgende sein richtiges Licht erhalten. Denn nichts darf in einem dem Grundcharakter des Beispiels zuwiderlaufenden Sinne verstanden werden, und man darf nicht, weil folgt: „Was Du säest, nicht den Körper, der werden soll, säest Du“, glauben, es werde ein anderer Körper auferstehen als der, welcher durch das Sterben gesäet worden ist. Sonst würde man aus dem Vergleich fallen. Denn niemals sprosst, wenn Weizen gasäet und in der Erde zersetzt worden ist, Gerste hervor, sondern stets ist die Art des Getreides dieselbe, sowie auch seine Natur, Beschaffenheit und Gestalt. Woher kommt es denn überhaupt, wenn es nicht dasselbe ist? Auch als zersetztes ist es dasselbe, da es aus der Zersetzung kommt. Denn er hat nicht angedeutet, in welcher Weise der Körper, der erst werden soll, gesäet wird, sondern gesagt: „Ein nacktes Korn wird gesäet“, etwa vom Weizen oder dergleichen, „Gott aber gibt ihm den Körper, wie er will“. Sicher doch dem Korn, wovon er sagt, dass es nackt gesäet werde? Gewiss wird deine Antwort lauten: Das, dem Gott einen Körper zu geben vorhat, ist also doch heil. Wie aber kann es heil sein, wenn es sich nirgends vorfindet, wenn es nicht aufersteht, wenn es nicht als eben dasselbe aufersteht? Wenn es nicht aufersteht, so ist es nicht erhalten. Wenn es nicht erhalten ist, so kann es von Gott keinen Körper bekommen. Dass es aber erhalten bleibe, das ist auf alle Weise sicher gestellt. Wozu also wird ihm Gott einen Körper geben nach seinem Wohlgefallen, da es doch jenen nackten Körper als eigenen besitzt, wenn nicht aus dem Grunde, damit er nunmehr nicht als nackter auferstehe? Folglich wird derselbe etwas Hinzugegebenes sein, was zum Körper noch hinzugethan wird, und es wird das, dem es zugefügt wird, nicht vernichtet, sondern gemehrt. Was aber gemehrt ist, das ist wohlerhalten. Denn gesäet wird das Korn allein, ohne die Hülse als Kleid, ohne die Ähre, woran es sitzt, ohne die Deckung durch die Grannen, ohne den stolzen Schmuck des Halmes. Es erhebt sich aber, wuchernd in üppiger Fülle, aufgebaut in Harmonie der Teile, mit Schmuck versehen und vollständig bekleidet. Diese Dinge sind für das Korn der andere Körper, in welchen es umgewandelt wird, nicht durch eine Vernichtung, sondern mit einer reichlichern Ausstattung versehen.</p><p>Gott hat einem jeden Samen einen eigenen Körper bestimmt, der doch wieder nicht seiner ist, nämlich nicht sein früherer, so dass auch jener andere der seinige werde, den er äusserlich von Gott erhält. Bleibe also bei dem Gleichnisse, halte es als Spiegelbild für den Leib fest und glaube, eben dasselbe, welches gesäet wird, werde Frucht bringen; es selber, wenn auch vervollständigt; nicht ein anderes, wenn es auch in anderer Weise zurückkehrt. Es wird nämlich seinerseits auch den Putz und Schmuck in Empfang nehmen, womit Gott es wird überkleiden wollen gemäss seinen Verdiensten. Ohne Zweifel zielt Paulus hierauf mit den Worten: „Nicht alles Fleisch ist dasselbe Fleisch“. Er will damit nicht die Gemeinsamkeit der Substanz leugnen, sondern die Gleichheit der Vorrechte, indem er den Leib unter den Unterschied der Ehre, nicht unter den der Art bringt. Deshalb fügt er auch noch figürliche, von den Tieren und Elementen entnommene Beispiele hinzu. „Ein anderes ist das Fleisch des Menschen“, d. i. des Dieners Gottes, welcher der wahre Mensch ist, „ein anderes das des Viehes“, d. i. des Heiden, von welchem der Prophet sagt: „Gleich geworden ist der Mensch dem unvernünftigen Vieh“, „ein anderes das der Vögel“, d. i. der Martyrer, welche sich zum Höhern erheben, „ein anderes das der Fische“, d. i. derjenigen, welche mit dem Wasser der Taufe genug haben. Dazu führt er noch von den überhimmlischen Körpern hergenommene Argumente ins Treffen. „Eine andere ist die Herrlichkeit der Sonne“, d. i. Christi, „eine andere die des Mondes“, d. i. der Kirche, und „eine andere die der Sterne“, d. i. die des Samens Abrahams. Und „ein Stern unterscheidet sich von dem andern an Glanz, sowie auch die irdischen und himmlischen Körper“, verstehe der Jude und der Christ. Wenn er sich aber hier nicht figürlich ausdrückt, so hat er in höchst thörichter Weise Leiber von Mauleseln und Geiern und Körper von Himmelslichtern mit den Menschenleibern zusammengestellt, obwohl jene weder mit dem Vergleiche noch mit der Erlangung der Auferstehung etwas zu schaffen haben.</p><p>Indem er hierdurch nur einen Schluss auf den Unterschied in der Glorie, nicht aber in der Substanz gezogen hat, sagt er zuletzt: „So ist es auch bei der Auferstehung der Toten“. Wie denn? Sie unterscheidet sich in nichts anderem als in der blossen Glorie. Denn, indem er dann wieder die Auferstehung auf dieselbe Substanz zurückführt und von neuem auf das Samenkorn kommt, sagt er: „Gesäet wird Verweslichkeit, es aufersteht die Unverweslichkeit, gesäet wird in Unscheinbarkeit, die Auferstehung geschieht in Herrlichkeit, gesäet wird in Schwachheit, die Auferstehung geschieht in Kraft, gesäet wird ein tierischer Leib, auferstehen wird ein geistiger“. Sicher steht nichts anderes auf, als was gesäet wird, und es wird nichts anderes gesäet, als was sich in der Erde zersetzt, und es wird nichts anderes in der Erde zersetzt, als das Fleisch. Denn dieses ist es, welches der Urtheilsspruch Gottes zu Boden gestreckt hat: „Erde bist du und zur Erde wirst du gehen“, weil es auch von der Erde genommen war. Daher ist auch der Apostel auf den Gedanken gekommen, von ihm den Ausdruck „säen“ zu brauchen, wenn es der Erde zurückgegeben wird; denn die Erde ist der Aufnahmeort für die Sämereien, um sie darin niederzulegen und von dort zurückzuerwarten. Daher bekräftigt er es mit Nachdruck: „So steht es geschrieben“, damit man nicht glaube, das Gesäetwerden sei etwas anderes als das: „Du wirst zu Erde werden, aus der du genommen bist“, und ebenso nicht glaube, die Stelle gehe einen andern an als den Leib. Denn so steht es geschrieben.</p>
      <h2>53</h2><p>Einige geben listiger Weise die Seele für den animalischen Leib aus, um die in Rede stehende Wiederherstellung vom Fleische fern zu halten. Da es aber feststeht und sicher ist, dass der Körper aufersteht, der gesäet wurde, so würden sie damit zur Herbeischaffung der Sache selber aufgefordert sein, oder müssten zeigen, dass die Seele nach dem Tode ausgesäet, d. h. dass sie tot sei, zu Boden gestreckt, zerstört, aufgelöst, während doch kein derartiger Ratschluss Gottes gegen sie vorliegt. Sie mögen also darlegen, dass dieselbe der Vergängnis, Verunstaltung und Krankheit anheimgefallen sei, so dass sie des Wiederaufstehens zur Unverweslichkeit, Herrlichkeit und Kraft fähig werde. Bei Lazarus, dem vorzüglichsten Beispiel der Auferstehung, lag wohl der Leib krank da, war fast verwest bis zur Verunstaltung, roch schon übel von Verwesung, und doch stand Lazarus im Fleische auf, mit der Seele zwar, aber diese war unverwest geblieben, niemand hatte sie in leinene Binden eingeschnürt ins Grab gelegt oder gemerkt, dass sie stinke; niemand in den vier Tagen gesehen, dass sie gesäet werde. Das ganze Aussehen, die ganze Behandlung des Lazarus widerfährt noch heute dem Leibe eines jeden, aber nie einer Seele. Worauf also der Ausdruck des Apostels hinzielt und wovon derselbe offenbar redet, das ist der Leib, der animalisch ist zur Zeit, wenn er ausgesäet, geistig, wenn er wieder erweckt wird.</p><p>Damit wir einsehen, dass es so sei, bietet uns Paulus noch weiter die Hand und führt auf Grund derselben hl. Schrift aus, „der erste Mensch sei Adam geworden, zur lebendigen Seele“. Wenn Adam der erste Mensch, das Fleisch aber schon Mensch war noch vor Mitteilung der Seele, so ist ohne Zweifel das Fleisch zur lebendigen Seele geworden. Ist es nun zu einer Seele geworden, da es doch Körper war, so ist es in jedem Falle ein animalischer Körper geworden. Wie wollten sie es wohl benennen, als nach dem, was es durch die Seele geworden ist, was es vor Mitteilung der Seele nicht war, was es ohne die Seele nicht mehr sein wird, ausser wenn es aufersteht? Wenn er nämlich die Seele wieder erhalten hat, so wird er wieder zum animalischen Körper, um ein geistiger zu werden. Es kann ja nichts wiedererstehen, als was vorher da war. Aus derselben Rücksicht, aus welcher der Name „animalischer Leib“ dem Fleische zukommt, kommt er der Seele nicht zu. Denn das Fleisch war erst bloss Körper, dann animalischer Körper. Beseelt ist es nachher zum animalischen Körper geworden. Die Seele dagegen, obschon ein Körper, kann, weil sie kein beseelter Körper, sondern vielmehr ein beseelender ist, dennoch nicht ein animalischer Körper genannt werden und auch nicht selbst das werden, was sie bewirkt. Denn wenn sie das Accidens des andern ist, so macht sie es animalisch; wenn sie aber nicht Accidens des andern ist, wie wird sie sich selbst animalisch machen? Sowie das Fleisch, welches eine Seele annimmt, erst animalischer Körper war, so wird es nachher geistig, wenn es sich mit dem Geiste überkleidet.</p><p>Indem der Apostel diesen Hergang als den gewöhnlichen darlegt, unterscheidet er ihn mit Recht an Adam und an Christus, den beiden Ausgangspunkten der Unterscheidung selbst. Wenn er Christus den letzten Adam nennt, so erkenne daraus, dass er mit allen seinen Lehrkräften für die Auferstehung des Fleisches, nicht für die der Seele gewirkt hat. Wenn nämlich auch der erste Mensch, Adam, Fleisch war und nicht Seele, er, der denn doch „zur lebenden Seele“ geworden ist, und der letzte Adam, Christus, nur deshalb Adam ist, weil Mensch, und nur deshalb Mensch, weil er Fleisch, nicht weil er Seele war, und sodann hinzugefügt wird: „Nicht das Geistige ist das erste, sondern das Animalische“, so ist das Geistige später, wie die beiden Adame beweisen. Scheint es dir etwa, er habe an einem und demselben Fleische einen seelischen und einen geistigen Körper unterschieden? Welche Unterscheidung hat er an jedem der beiden Adame, d. h. an beiden Menschen vorbereitet? In bezug auf welche Substanz gleichen sich Christus und Adam unter einander? Ich denke doch in bezug auf das Fleisch, wenn auch hinsichtlich der Seele gleichfalls. Allein nur unter dem Titel von Fleisch sind beide Menschen; denn das Fleisch war zuerst Mensch. Nur in Rücksicht auf dieses konnte von einer Aufeinanderfolge bei ihnen die Rede sein und der eine für den ersten, der andere für den letzten Menschen oder Adam gehalten werden. Von einander verschiedene — wenigstens der Substanz nach verschiedene Dinge — können nicht in eine Aufeinanderfolge gebracht werden. In bezug auf Ort, Zeit und Beschaffenheit können sie es vielleicht. Hier in unserem Falle aber sind die Bezeichnungen „erster und letzter“ in Rücksicht auf die Substanz gebraucht, wie wiederum auch der erste Mensch von der Erde und der zweite vom Himmel stammt, weil er, obschon dem Geiste nach vom Himmel, doch dem Fleische nach Mensch ist.</p><p>Da also bei den beiden Adamen hinsichtlich des Leibes eine Aufeinanderfolge am Platze ist, hinsichtlich ihrer Seelen aber nicht, weil der erste Mensch zur lebenden Seele, der letzte aber zum lebendig machenden Geist geworden ist, so sind sie verschieden. Ihre Verschiedenheit hat in gleicher Weise auch für ihre Leiber einen Unterschied präjudiziert, so dass es dem Fleische gilt, wenn gesagt wird: „Nicht das Geistige ist das erste, sondern das Animalische; sodann das Geistige“, und somit ist also auch das oben gemeinte Fleisch dasselbe: „Was gesäet wird, ist ein animalischer Leib, und was aufersteht, ein geistiger Leib“, weil nicht das Geistige das erste ist, sondern das Animalische und der erste Adam zur Seele wurde, der zweite zum Geiste. Das Ganze gilt vom Menschen, das Ganze vom Fleische, weil vom Menschen. Was also werden wir sagen? Hat das Fleisch nicht jetzt auch den Geist aus dem Glauben, so dass man fragen muss, wie kann gesagt werden, dass ein animalischer Leib gesäet werde. Allerdings hat hienieden das Fleisch den Geist empfangen, aber nur als ein Handgeld, von der Seele dagegen nicht bloss das Handgeld, sondern die ganze Fülle. Daher ist es auch mit dem Namen der vorzüglicheren Substanz benannt worden, „seelischer Leib“, als welcher es gesäet wird, der dann in der Folge dazu auch ein geistiger sein soll, kraft der Fülle des Geistes, in welcher er auferweckt wird. Was ist auffallendes daran, wenn es seine Bezeichnung von demjenigen erhalten hat, wovon es ganz angefüllt, und nicht von dem, womit es bloss obenhin angefeuchtet ist?</p>
      <h2>54</h2><p>So bieten häufig die gewählten Ausdrücke sowie auch der gemeinschaftliche Gebrauch von Wörtern Anlass, Fragen aufzuwerfen. Da sich beim Apostel auch die Wendung findet: „das Sterbliche solle vom Leben verschlungen werden“, nämlich das Fleisch, so fasst man eiligst auch dieses Verschlingen als ein Vernichten des Fleisches auf, gleich als ob wir nicht auch von einem Verschlucken der Galle oder des Schmerzes redeten, was dann ihn verbergen, verdecken und in sich selbst verschliessen heisst. Wenn sodann geschrieben steht: „Dieses Sterbliche muss anziehen die Unsterblichkeit“, so wird damit gezeigt, auf welche Art das Sterbliche vom Leben verschlungen wird, so zwar, dass es mit Unsterblichkeit überkleidet, verborgen, verdeckt und eingeschlossen, nicht aber verzehrt und weggenommen wird. Also auch der Tod, wendet man ein, wird erhalten bleiben, wenn er verschlungen wird. — Unterscheide den gemeinschaftlichen Gebrauch der Worte ihrem Sinne gemäss, dann wirst Du die Sache vollkommen verstehen! Der Tod ist etwas anderes als das Sterbliche. Also wird der Tod auch auf eine andere Weise verschlungen werden als das Sterbliche. Der Tod kann die Unsterblichkeit nicht in sich aufnehmen, das Sterbliche aber kann dies. Daher heisst es: „Dieses Sterbliche muss die Unsterblichkeit anziehen“. Wie zieht es dieselbe an? Indem es vom Leben verschlungen wird. Auf welche Art wird es vom Leben verschlungen? Indem es in dasselbe aufgenommen, zurückgeführt und eingeschlossen wird. Der Tod wird aber ganz mit Recht zum Untergange verschlungen, weil er selbst auch verschlingt. Der Tod hat verschlungen, heisst es, indem er stark wurde, und deshalb wird er verschlungen im Siege. Tod, wo ist dein Stachel? Tod, wo ist dein Sieg? Mithin wird auch das Leben, welches der Gegensatz zum Tode ist, durch seinen Sieg zum Heile das verschlingen, was der Tod durch seinen Sieg vorher zum Untergange verschlungen hatte.</p>
      <h2>55</h2><p>Obwohl wir mit dem Nachweise, dass das Fleisch auferstehen wird, auch bewiesen haben, dass kein anderes auferstehen werde, als eben das, um welches es sich handelt, so erfordern doch einzelne Fragen und deren Objekte noch besondere Erörterungen, mögen sie auch schon anderweit abgemacht sein. Wir wollen daher die Bedeutung und den Begriff der betreffenden Umwandlung genauer erklären, weil dieselbe gewöhnlich zu der Meinung Anlass gibt, es werde ein anderes Fleisch auferstehen. Das wäre aber, als wenn umgewandelt werden so viel hiesse, als gänzlich aufhören und seines früheren Zustandes verlustig gehen.</p><p>Das Trugbild einer Vernichtung ist jedoch von dem Begriffe der Umwandlung ganz fern zu halten. Denn Umwandlung ist ganz etwas anderes als Vernichtung. Würde der Leib in einer Weise umgewandelt werden, dass er unterginge, dann wäre er auch kein anderer mehr. Er würde aber bei der Umwandlung untergehen, wenn er dabei nicht er selbst bliebe, welcher in der Auferstehung wieder hergestellt wird. So gut wie er zu Grunde gegangen ist, wenn er nicht aufersteht, so ist er ebenfalls zu Grunde gegangen, wenn er zwar aufersteht, aber durch eine Verwandlung beseitigt wird. Und wie sinnlos wäre es, wieder aufzuerstehen dazu, um nicht zu sein, da er es doch in seiner Gewalt hatte, gar nicht aufzuerstehen oder gar nicht zu sein, zumal er ja schon angefangen hatte, nicht zu sein. So ganz verschiedene Dinge wie Verwandlung und Vernichtung, die ja auch in ihren Wirkungen ganz verschieden sind, sollten doch nicht vermengt werden. Erstere bewirkt völliges Verschwinden, letztere Veränderung. So gut wie also das, was vernichtet wurde, keine Veränderung erlitten hat, so ist auch das, was eine Veränderung erlitten hat, nicht vernichtet. Vernichtet sein heisst nämlich, überhaupt das gar nicht mehr sein, was man gewesen ist; verändert sein, heisst es auf andere Weise sein. Wenn ein Ding in anderer Weise existiert, so kann es noch dasselbe sein; denn was nicht vergangen ist, das hat sein Sein. Es hat nämlich eine Verwandlung erlitten, keine Vernichtung. So kann also etwas verändert werden und nichtsdestoweniger doch es selbst sein, wie denn auch der ganze Mensch in dieser Zeitlichkeit seiner Substanz nach zwar er selbst ist, sich aber doch vielfach verändert, sowohl in Hinsicht seiner Kleidung als in Hinsicht auf Körperlichkeit, Gesundheit, Stand, Würde, Alter, Lebensrichtung, Geschäft, Kunst, Fähigkeit, Wohnsitz, Gesetz und Sitte. Er büsst dadurch trotzdem doch nichts vom Menschenwesen ein; nein, er wird nicht ein anderer, sondern nur anders.</p><p>Diese Form der Umwandlung kommt auch in den hl. Büchern vor. Verwandelt wird des Moses Hand, und zwar ist sie nach Art einer toten Hand blutlos, bleich und kalt; nach Wiederempfang der Lebenswärme und Wiedererlangung der Farbe ist sie aber wieder dasselbe Fleisch und Blut. Verwandelt wird späterhin auch sein Antlitz durch eine blendende Klarheit. Aber er war ebenso der Moses, obwohl man ihn nicht anblicken konnte. So hatte auch Stephanus schon die Höhe der Engel erreicht, aber es waren keine fremde Kniee, die er vor der Steinigung bog. Der Herr hat in der Einsamkeit auf dem Berge sogar seine Kleider durch Licht umgestalten lassen, aber doch die Gesichtszüge bewahrt, welche für Petrus erkennbar blieben. Dort haben auch Moses und Elias, der eine im blossen Bilde des noch nicht wieder angenommenen Leibes, der andere in der Wirklichkeit eines noch nicht verstorbenen Leibes gezeigt, dass in der Herrlichkeit die äussere Erscheinung des Körpers als dieselbe fortbestehe. Durch dies Beispiel belehrt, braucht Paulus den Ausdruck: „Er wird den Leib unserer Niedrigkeit umgestalten zu einem dem Leibe seiner Herrlichkeit gleichgestalteten Leibe“. Wollte man behaupten, Umgestaltung und Umwandlung bestehe im Verschwinden der Substanz, welche sie auch sei, so ist also Saul, als er sich in einen andern Mann umwandelte, aus seinem Körper herausgegangen, und Satanas selbst verliert seine eigentümliche Beschaffenheit, wenn er sich in einen Engel des Lichts verwandelt. So wird auch zum schliesslichen Vollzug der Auferstehung eine Veränderung, Umwandlung und Wiederherstellung möglich sein mit Beibehaltung der Wesenheit.</p>
      <h2>56</h2><p>In der That, es wäre ein grosser Unsinn, ja sogar eine Ungerechtigkeit — beides aber ist Gottes unwürdig — wenn die eine Substanz die Thaten verrichtete, die andere aber den Lohn heimführte, so dass ein Leib in den Martyrien zerfleischt und ein anderer gekrönt würde; ebenso umgekehrt, wenn der eine sich in unreinen Lüsten wälzte und der, welcher verdammt wird, ein anderer wäre. Würde es nicht besser sein, den Glauben an die Auferstehung lieber ein für alle Mal aufzugeben, als mit der Würde und Gerechtigkeit Gottes sein Spiel zu treiben, und etwa anstatt des Valentinus den Marcion auferstehen zu lassen?</p><p>Es ist auch nicht glaublich, dass Gesinnung, Gedächtnis oder Wissen des gegenwärtigen Menschen durch jenes umgestaltende Gewand der Unsterblichkeit und Unverweslichkeit zum Verschwinden gebracht wird. Denn dann würde der Nutzen und die Frucht der Auferstehung sowie das Wesen des nach beiden Seiten gehenden göttlichen Gerichts inhaltslos sein. Wenn ich mich nicht erinnere, dass ich der bin, der etwas verdient hat, wie kann ich Gott dafür Dank sagen? Wie soll ich ihm ein neues Lied singen, da ich nicht weiss, ob ich der bin, der zum Danke verpflichtet ist? Warum wird die Verwandlung immer bloss beim Fleische geltend gemacht und nicht auch bei der Seele, die ja dem Fleische doch in allem vorgestanden hat? Was soll man dazu sagen, dass eben dieselbe Seele, welche in dem jetzigen Leibe den ganzen Verlauf des Lebens mitgemacht hat, welche in diesem Leibe Gott kennen gelernt, Christum angezogen und die Hoffnung des Heils ausgesäet hat, in weiss Gott was für einem andern Leibe die Frucht davon erntet? Fürwahr, das wäre ein sehr dankbarer Leib, dessen Leben umsonst sein würde! Wenn die Seele dann nicht ebenfalls verändert wird, so gibt es auch keine Auferstehung der Seele mehr. Denn man würde nicht glauben, dass sie auferstanden sei, wenn sie nicht als eine ganz andere aufersteht.</p>
      <h2>57</h2><p>Dies gibt Anlass zu einer verschmitzten Einrede des vulgären Unglaubens: Wenn eine und dieselbe Substanz, sagt man, wieder ins Sein gerufen wird, mit ihrer Gestalt, ihren Umrissen und Eigenschaften, dann wird sie folglich auch ihre übrigen Malzeichen haben. Man würde daher auch als Blinder, Lahmer, Gichtbrüchiger, oder wie gezeichnet jemand sonst aus dem Leben geschieden ist, wiederkommen. — Gut, was geschieht denn aber nun und dann, wenn man es verschmäht, in welchem Zustande auch immer, diese so grosse Gnade von Gott zu erlangen? Schreibt man denn nicht auch so, wenn man bloss eine Erhaltung der Seele zulässt, einem unvollständigen Menschen das Heil zu?</p><p>Was heisst an eine Auferstehung glauben anders, als an eine vollständige glauben? Wenn das Fleisch sogar aus der Auflösung wieder hergestellt werden wird, um wie viel mehr wird es von einer blossen Beschädigung befreit werden! Durch das Grössere wird das Geringere präskribiert. Ist nicht die Verstümmelung oder Schwächung eines Gliedes dessen Tod? Wenn der allgemeine Tod durch die Auferstehung rückgängig gemacht wird, was soll mit dem teilweisen Tode geschehen? Wenn wir zur Herrlichkeit umgestaltet werden, warum nicht noch mehr zur Vollständigkeit? Eine Verstümmelung des Körpers ist etwas zufälliges, Vollständigkeit dagegen sein eigentlicher Zustand. In diesem werden wir geboren. Selbst wenn wir schon im Mutterleibe beschädigt werden, so ist das Leidende schon ein Mensch. Die Gattung existiert vor dem Unfall. Wie Gott das Leben gibt, so wird er es auch wiedergeben. Wie wir es empfangen, so empfangen wir es auch zurück. Wir werden der Natur, nicht dem schadhaften Zustande zurückgegeben. Wir leben wieder auf, als das, als was wir geboren wurden, nicht als das, was wir durch eine Beschädigung erst geworden sind.</p><p>Sind die von Gott Auferweckten keine volle Menschen, so weckt er überhaupt keine Toten auf. Welcher Tote ist denn noch vollständig, auch wenn er in Vollständigkeit gestorben ist? Wer ist unversehrt und doch entseelt? Welcher Körper bleibt dann unverletzt, wenn er umgebracht, todesstarr, bleich, steif, kurz wenn er eine Leiche geworden ist? Wann ist der Mensch schwächer, als wenn er es ganz ist? Wann ist er mehr gichtgelähmt, als wenn er unbeweglich ist? So heisst also einen Toten auferwecken nichts anderes als ihn ganz machen, damit er nicht dem Teile nach, der nicht auferstanden ist, noch tot sei. Gott ist imstande, wiederzumachen, was er gemacht hat. Diese seine Macht und Freiheit hat er bereits hinlänglich verbürgt an Christus, oder vielmehr, er hat kund gethan, nicht bloss wer der Wiedererwecker des Fleisches, sondern auch, wer dessen völliger Wiederhersteller sei. Daher sagt der Apostel: „Die Toten werden unverwest auferstehen!“ Wie das nun, wenn sie nicht völlig wiederhergestellt sind? sie, die früher verwest waren, sowohl infolge der Krankheit als des langen Liegens im Grabe. Wenn er vorher beides erwähnte, sowohl dass dieses Verwesliche die Unverweslichkeit anziehen müsse, als dieses Sterbliche die Unsterblichkeit, so hat er damit seinen Gedanken nicht etwa wiederholt, sondern auf einen Unterschied aufmerksam gemacht. Denn den Ausdruck „Unsterblichkeit“ hat er mit Rücksicht auf die Rückgängigmachung des Todes, „Unverweslichkeit“ mit Rücksicht auf die Aufhebung der Verwesung gewählt, indem er das eine der Auferstehung, das andere der Wiederherstellung zuschreibt. Mir ist aber, als hätte er auch den Thessalonichern die Wiederherstellung der gesamten Substanz in Aussicht gestellt.</p><p>Und so wird denn in Zukunft auch kein Untergang der Körper mehr zu befürchten sein. Die entweder bewahrte oder wieder hergestellte Unversehrtheit wird nichts einbüssen können von dem Zeitpunkt an, wo ihr, was sie etwa verloren hat, wiedergegeben worden ist. Erhebt man die Einrede, wenn die Auferstehung eben desselbigen Fleisches gelehrt wird, so wird es auch wieder eben denselben Leiden unterliegen, dann tritt man verwegenerweise als Verteidiger der Natur gegen ihren Herrn auf und steift sich gottloserweise auf das Gesetz im Gegensatz zur Gnade, als wenn es Gott dem Herrn nicht freistände, die Natur zu ändern und zu erhalten ohne ein Gesetz. Zu welchem Zwecke heisst es denn: „Was unmöglich ist bei den Menschen, das ist möglich bei Gott“, und: „Was thöricht ist vor der Welt, hat Gott erwählt, um die Weisheit dieser Welt zu beschämen“? Ich bitte dich, wenn du deinem Sklaven die Freiheit geschenkt hast, wird dann sein Fleisch und sein Gemüt, weil sie dieselben sind, die früher den Peitschenhieben, den Fesseln und der Brandmarkung ausgesetzt waren, darum auch noch in Zukunft dieselben Dinge zu erdulden haben? Ich glaube nicht. Im Gegenteil, er wird mit einem glänzend weissen Kleide, mit der Auszeichnung eines goldenen Ringes, mit dem Namen seines Patrons, seiner Tribus und seiner Tischgenossenschaft beehrt. Gewähre Gott doch auch die Macht, in Kraft jener geschilderten Umgestaltung die Qualität, nicht die Natur zu ändern, indem einerseits die Leiden beseitigt, anderseits Sicherheiten gegeben werden. So wird denn der Leib nach der Auferstehung zwar derselbe bleiben und insofern leidensfähig, als er er selbst und derselbe ist, aber doch leidensunfähig sein, insofern er eben zu diesem Zwecke von Gott freigelassen ist, um nicht mehr leiden zu können.</p>
      <h2>58</h2><p>„Ewige Wonne über ihr Haupt“, sagt Isaias. Es ist aber nichts ewig, als nach der Auferstehung. „Schmerz, Trauer und Seufzen“, sagt er, „ist von ihnen gewichen.“ Ebenso der Engel zu Johannes: „Gott wird wegnehmen jede Thräne von ihren Augen.“ Natürlich von denselben Augen, welche zuvor geweint hatten, welche auch später noch weinen könnten, wenn die göttliche Güte nicht das Nass der Thränen ganz getrocknet hätte. Dann heisst es wiederum: „Gott wird wegnehmen jede Thräne von ihren Augen und es wird kein Tod mehr sein“, also auch keine Verwesung. Diese ist durch die Unverweslichkeit ebenso verscheucht, wie der Tod durch die Unsterblichkeit. Wenn Schmerz, Trauer, Seufzen, ja, der Tod selbst nur aus Verletzungen der Seele und des Leibes hervorgehen, so können sie nicht beseitigt werden, ausser wenn ihre Ursachen aufhören, die Verletzungen des Leibes und der Seele. Wie könnte es widrige Zufälle in der Nähe des Herrn, wie feindliche Anfälle bei Christus geben, wie Angriffe des Teufels bei Anwesenheit des hl. Geistes, da der Teufel selbst mit seinen Engeln schon ins Feuer gestürzt ist? Wo ist da der Zwang, oder das, was man Glück und Fatum nennt? Welche Plage kann es für die Auferweckten geben nach erlangter Verzeihung? Was für Zorn für die Ausgesöhnten nach erlangter Gnade? Welche Schwachheit nach erlangter Kraft, welches Unvermögen nach Erlangung des Heils?</p><p>Dass die Kleider und Schuhe der Kinder Israel vierzig Jahre hindurch unzerrissen und unverschlissen blieben, dass an ihren Leibern selbst das sonst so leichte Wachstum der Nägel und Haare auf das von der Schicklichkeit und Würde bedingte Maass beschränkt blieb, damit nicht deren enorme Grösse für Verwesung gehalten würde,dass zu Babylon an den drei Jünglingen nicht einmal die Turbane und weiten Hosen, die bei den Juden nicht üblich waren, durch die Feuerflammen verletzt wurden, dass Jonas verschlungen von einem Meerungeheuer, dessen Bauch gewöhnt war, Schiffstrümmer zu verdauen, drei Tage später unverletzt ausgeworfen wurde, dass Henoch und Elias, obwohl noch nicht durch die Auferstehung hindurchgegangen, weil noch nicht gestorben, doch darum, weil sie von der Erde hinweggenommen und dadurch zur Anwartschaft auf die Ewigkeit gelangt sind, heute noch eine Freiheit des Leibes von jedem Gebrechen, jedem Schaden, jeder Unbill und Schmach gemessen — alle diese Begebenheiten setzen das Siegel ihres Zeugnisses unter keinen andern Glauben als unter den, wonach man glauben muss, dass diese Dinge Beweise für die zukünftige Auferstehung sind. Nach dem Ausspruche des Apostels sind jene Dinge Vorbilder auf uns und stehen deshalb geschrieben, damit wir glauben sollen, der Herr sei mächtiger als jedes für die Körper geltende Gesetz, und natürlich umsomehr ein Erhalter des Leibes, da er sogar Kleidungsstücke und Schuhe unter seinen Schutz genommen hat.</p>
      <h2>59</h2><p>Das kommende Zeitalter hat aber, wendet man ein, eine ganz andere und für die Ewigkeit berechnete Anlage, also kann die nicht ewige Substanz der jetzigen Zeitperiode Abweichendes nicht in sich schliessen. — Wenn der Mensch wegen der künftigen Einrichtung und nicht die Einrichtung des Menschen wegen da ist, dann allerdings. Aber der Apostel schreibt: „Sei es nun die Welt oder das Leben oder der Tod, sei es das Zukünftige oder Gegenwärtige, alles ist Euer“. Damit macht er eben dieselben Personen zu Erben auch des Zukünftigen. Isaias schenkt uns nichts, indem er sagt: „Alles Fleisch ist Heu“, und anderswo: „Alles Fleisch wird sehen das Heil des Herrn“. Er hat nicht die Substanzen unterschieden, sondern ihre schliesslichen Schicksale. Denn jeder wird das Gericht Gottes in zweierlei Sentenzen bestehen lassen, in der des Heiles und in der der Strafe. Alles Fleisch ist also Heu, insofern es für das Feuer bestimmt ist, und alles Fleisch wird das Heil des Herrn sehen, insofern es für das Heil bestimmt wird. Was mich betrifft, so weiss ich, dass ich nicht in einem mir nicht gehörigen Leibe Ehebrüche begangen habe und jetzt auch nicht in einem mir nicht gehörigen Leibe nach Enthaltsamkeit strebe. Trüge jemand die Geschlechtsteile doppelt an sich, so könnte er das Heu des verunreinigten Fleisches hinwegthun und sich jenes Fleisch allein bewahren, welches das Heil des Herrn sehen wird.</p><p>Wenn derselbe Prophet in betreff der Nationen das eine Mal lehrt, dass sie für Staub oder Auswurf gerechnet werden, das andere Mal, dass sie auf den Namen und den Arm des Herrn hoffen und daran glauben, täuschen wir uns dann etwa hinsichtlich ihrer? Und werden die einen, welche glauben, andere sein als die, welche für Staub gerechnet werden, infolge einer Verschiedenheit ihrer Substanz? Aber Christus hat diesseit des Ozeans und von demselben Himmel her, der über uns liegt, den Heiden als das wahre Licht geleuchtet. Die Valentinianer selbst haben hier auf Erden irren gelernt, und es gibt keine andere Form für die gläubigen Nationen als für die nicht gläubigen: Leib und Seele. Wie er also die Heiden, die ihrem Lose, nicht ihrer Art nach dieselben sind, unterschieden hat, so hat er auch die Leiber, deren Beschaffenheit bei den Heiden dieselbe ist, nicht ihrem Stoff, sondern ihrem Lohne nach gesondert.</p>
      <h2>60</h2><p>Um eine weitere Schwierigkeit gegen den Leib, namentlich dessen Identität aufzuwerfen, siehe, nehmen unsre Gegner auch von den Verrichtungen der Glieder eine Ausflucht her und sagen, die Glieder müssten, weil noch eben derselben Körperlichkeit angehörig, auch in ihrer Thätigkeit und in ihren Wirkungen verharren, oder aber, da es feststehe, dass die Verrichtungen der Glieder aufhören werden, so räumen sie auch mit der Körperlichkeit auf. Man könne dann an den Fortbestand der letztern natürlich nicht mehr glauben, weil sie ohne Glieder sei; an das Dasein von Gliedern aber dürfe man deshalb nicht glauben, weil sie ohne Verrichtungen sein würden. Denn wozu, sagen sie, sollte uns die Mundhöhle noch dienen, wozu die Reihen von Zähnen, der hinabführende Schlund, der Magen, welcher der Sammelplatz ist, die Bauchhöhle mit ihren Vertiefungen und die langen verschlungenen Eingeweide, wenn kein Essen und Trinken mehr stattfindet? Zu welchem Zweck sollten diese Glieder aufnehmen, kauen, unterschlucken, zersetzen, verdauen und aussondern? Wozu die Hände und Füsse und all die Glieder, die zum Arbeiten dienen, wenn mit dem Unterhalt auch die Sorge um ihn aufhört? Wozu die Nieren, welche an der Samenbereitung teilnehmen, wozu die übrigen Zeugungsglieder beider Geschlechter, die zur Empfängnis dienenden Behältnisse, die Brüste mit ihren Quellen, da Begattung, Gebären und Erziehen ein Ende haben? Wozu endlich der Körper überhaupt, da er ganz und gar keinen Zweck mehr hat?</p><p>In Beziehung hierauf haben wir die Bemerkung vorausgeschickt, dass die Einrichtungen der Zukunft und die der Gegenwart nicht zusammengestellt werden dürfen; denn die Verwandlung wird dazwischentreten; und nun fügen wir noch die Bemerkung bei, diese Verrichtungen der Glieder für die Bedürfnisse dieses Lebens werden so lange bestehen, bis das Leben selbst aus der Zeitlichkeit in die Ewigkeit hinübergeführt wird, so wie der animalische Leib in den geistigen, indem dieses Sterbliche die Unsterblichkeit und dieses Verwesliche die Unverweslichkeit anzieht, und sie selbst, diese Glieder, werden, indem dann das Leben der Bedürfnisse enthoben ist, auch ihrer Verrichtungen enthoben sein. Aber darum werden sie doch nicht unnötig sein. Denn wenn sie gleich ihrer Verrichtungen enthoben sind, so werden sie doch zum Zwecke des Gerichtes beibehalten werden, damit „jeder empfange an seinem Leibe“, wie er es getrieben hat. Denn das Gericht Gottes verlangt einen vollständigen Menschen, vollständig aber kann der Mensch nicht sein ohne Glieder, aus deren Substanzen — nicht aus deren Verrichtungen — er zusammengesetzt ist. Man müsste denn vielleicht auch von einem Schiffe ohne Kiel, ohne Vorder- und Hinterteil, und ohne vollständiges, ganzes Gefüge behaupten wollen, es sei vollständig. Und doch haben wir mehr als einmal gesehen, wie ein vom Sturme zertrümmertes oder von Fäulnis zerfressenes Schiff, nachdem alle seine Glieder wieder ersetzt und ausgebessert waren, als dasselbe erschien und sich des Titels eines wiederhergestellten erfreute.</p><p>Sind wir hinsichtlich Gottes, seiner Geschicklichkeit dazu, seines Willens oder Rechtes in Besorgnis? Wenn nun aber der reiche und freigebige Herr des Schiffes, seinen Neigungen oder den Rücksichten auf seine Ehre folgend, dem Schiffe die blosse Wiederherstellung gewährt und will, dass es fürder nicht mehr arbeite, wollte man dann etwa behaupten, das frühere Gebälk sei darum nun nicht mehr notwendig, weil es von nun an keinen Zweck mehr habe und bloss zur Vervollständigung eines Schiffes ohne Thätigkeit dienen würde?</p><p>Es ist also weiter nichts nötig, als sich darüber zu unterrichten, ob Gott, indem er den Menschen zum Heil bestimmte, auch den Leib dazu bestimmt und gewollt habe, dass derselbe von neuem existiere; und wir haben nicht das Recht, auf Grund der künftigen Zwecklosigkeit der Glieder in betreff seiner die Einrede zu erheben, er könne nicht wieder werden. Denn es kann ja etwas von neuem existieren, was trotzdem keine Bestimmung hat, und es kann doch nicht einmal behauptet werden, dass es zwecklos sei, wenn es nicht existiert. Wenn es aber existiert, so wird es die Macht haben, auch zwecklos zu sein; denn bei Gott wird nichts zwecklos sein.</p>
      <h2>61</h2><p>Aber Du hast ja, o Mensch, den Mund bekommen zum Essen und Trinken. — Warum nicht lieber zum Sprechen, um dich von den übrigen lebenden Wesen zu unterscheiden? Warum denn nicht lieber, um Gott zu preisen, damit du auch unter den Menschen einen Vorrang habest? Adam hat erst den Tieren ihre Namen verkündet, bevor er vom Baume pflückte, er hat auch eher prophezeit als gegessen. Doch wir haben ja die Zähne bekommen, um das Fleisch zu kauen. — Warum nicht lieber dazu, um das Öffnen des Mundes und das Gähnen etwas zu verschönern? Warum nicht, um die Bewegungen der Zunge zu regeln, um die einzelnen Laute beim Sprechen durch das Anstossen daran zu markieren? Höre und siehe dir schliesslich die Zahnlosen an, und frage dann nach der Würde des Mundes und dem Mechanismus der Zähne.</p><p>Beim Manne und beim Weibe befinden sich Öffnungen an den unteren Teilen natürlich nur, damit die Wollüste durch dieselben ihren Ausweg nehmen. — Warum werden sie nicht mit mehr Recht in Ehren gehalten werden wegen der Ausscheidungen? Sodann hat das weibliche Geschlecht inwendig im Körper auch einen Ort, wo die Samen zusammenfliessen oder wo das überflüssige Blut sich ausscheidet, welches das stärkere Geschlecht abzusondern nicht imstande ist. — Auch diese Dinge muss ich leider erwähnen, weil jene Leute, um die Auferstehungslehre lächerlich zu machen, absichtlich mit den Verrichtungen beliebiger Glieder possenhafterweise angestiegen kommen, wie sie wollen und mit welchen sie wollen, und nicht dabei bedenken, dass in jener Zeit vorerst die Ursachen für deren Notwendigkeit hinwegfallen werden, für das Essen der Hunger, für das Trinken der Durst, für den Beischlaf das Gebären und für das Arbeiten die Gewinnung des Lebensunterhalts. Denn wenn der Tod weggefallen ist, so bildet weder die Nahrung das Mittel zur Erhaltung des Lebens, noch wird der untere geschlechtliche Organismus die Glieder belästigen.</p><p>Aber auch jetzt kann es vorkommen, dass die Eingeweide und die Geschlechtsteile ausser Wirksamkeit sind. Vierzig Tage lang hielten Moses und Elias das Fasten aus und wurden von Gott allein ernährt. Denn der Grundsatz: „Nicht vom Brote allein lebt der Mensch, sondern vom Worte Gottes“, wurde schon damals inauguriert. Siehe da den Schattenriss der künftigen Tugendkraft! Auch wir versagen unserem Munde die Speise, so gut wir können, und halten uns von geschlechtlicher Vereinigung fern. Wie zahlreich sind nicht die freiwillig Verschnittenen! Wie viele sind nicht der an Christus vermählten Jungfrauen! Wie viele der Unfruchtbaren von beiden Naturen, die mit unfruchtbaren Geschlechtsteilen versehen sind! Wenn die Verrichtungen und Wirkungen der Glieder sogar schon hier in einer zeitweiligen Unthätigkeit ohne Wirksamkeit sein können, gleichsam nach einem vorübergehenden, zeitweiligen Ratschluss, und der Mensch dabei nicht weniger Mensch bleibt, so werden wir ganz ebenso ohne Verkümmerung des Menschenwesens, weil nach einem ewigen Ratschluss, in jener Zeit noch viel weniger Dinge begehren, welche wir schon nicht einmal mehr hienieden zu begehren gewohnt waren.</p>
      <h2>62</h2><p>Dem Streite darüber macht der Ausspruch des Herrn ein Ende: „Sie werden sein wie die Engel“. Wenn dies geschieht, indem sie nicht heiraten und weil sie nicht sterben, dann sicher auch dadurch, dass sie keinem der entsprechenden Bedürfnisse des körperlichen Daseins unterliegen. Denn auch die Engel sind einstmals wie die Menschen geworden, assen, tranken und liessen sich die Füsse waschen; sie hatten nämlich die äussere Erscheinung von Menschen angenommen, ohne dass ihr eigenes Wesen innen Schaden gelitten hätte. Wenn also die Engel, wie Menschen geworden, zu ihrer frühern geistigen Substanz auch ein leibliches Verhalten annahmen, warum sollten nicht die Menschen, wenn sie wie Engel geworden sind, in derselben Substanz des Fleisches eine geistige Disposition eingehen können, indem sie unter dem engelartigen Gewande von den Gepflogenheiten des Leibes nicht mehr abhängig sind, als damals die Engel unter dem menschlichen Gewande von denen des Geistes? Wenn sie nicht mehr bei den Gewohnheiten des Fleisches verblieben sind, so sind sie darum doch keine Wesen, welche nicht mehr im Fleische verbleiben; denn auch die Engel sind immer noch Geisteswesen geblieben, trotzdem sie nicht bei den Gepflogenheiten des Geistes verblieben. Endlich hat er nicht gesagt: „Sie werden Engel sein“ und damit ihr Menschsein geleugnet, sondern: „Sie werden <em>wie</em> die Engel sein“ und sie dadurch in ihrem Menschsein belassen. Er hat die Substanz keineswegs aufgehoben, als er ihr eine Ähnlichkeit beilegte.</p>
      <h2>63</h2><p>Also der Leib wird auferstehen, und zwar jeder, derselbe und ein vollständiger. Wo er sich auch immer befindet, er ist in Sicherheit bei Gott hinterlegt durch den treuesten Mittler zwischen Gott und den Menschen, Jesus Christus, welcher den Menschen Gott und dem lieben Gott die Menschen wiedergeben wird, dem Fleische den Geist und dem Geiste das Fleisch. Denn beides hat er bereits in seiner Person vereinigt, dem Bräutigam eine Braut und der Braut einen Bräutigam verschafft. Wenn man darauf bestehen sollte, die Seele allein für die Braut auszugeben, so wird der Leib wenigstens unter dem Titel einer Mitgift die Seele begleiten. Die Seele wird keine gemeine Dirne sein und nicht nackt und bloss von ihrem Bräutigam angenommen werden müssen. Sie hat ihre Ausstattung, sie hat ihren Putz und ihren Sklaven, den Leib; wie ein Milchbruder wird er sie begleiten.</p><p>Allein die wahre Braut ist das Fleisch, welches auch in Christo Jesu durch Blut den Geist als Bräutigam sich verbunden hat. Was man für seinen Untergang ansieht, ist nur ein vorübergehendes sich Entfernen. Nicht die Seele allein entfernt sich. Auch das Fleisch hat während der Zeit seine Verstecke: im Wasser, im Feuer, in den Vögeln, in den wilden Tieren. Wenn es in diese aufgelöst scheint, so ist es gleichsam nur in andere Gefässe übergeleitet. Fehlen ihm sogar die Gefässe und fliesst es auch aus diesen in seine mütterliche Erde aus, dann macht es gleichsam einen Kreislauf durch, so dass aus ihr wieder ein Adam hergestellt wird, der vom Herrn die Worte hören soll: „Siehe, Adam ist wie einer aus uns geworden.“ Dann ist er wirklich kundig des Bösen, dem er entgangen ist, und des Guten, in das er eingegangen ist. Warum, o Seele, empfindest du Widerwillen gegen den Leib? Niemand steht dir so nahe, wie er, den du nächst dem Herrn lieben sollst; niemand ist in höherem Grade dein Bruder, als der, welcher mit dir in Gott geboren wird. Du hättest für ihn die Auferstehung erflehen müssen, wenn er vielleicht auf deine Veranlassung gesündigt hat. Aber es ist kein Wunder, wenn man das hasst, dessen Urheber man ebenfalls verschmäht hat, was man auch an der Person Christi zu leugnen oder zu verunstalten gewohnt ist, indem man damit sogar es selbst, das Wort Gottes, das Fleisch geworden ist, schriftlich oder durch mündliche Auslegungen verunehrt und die Geheimlehren der Apokryphen, diese gotteslästerlichen Fabeln, darauf anwendet.</p><p>Jedoch der allmächtige Gott hat, in seiner alles voraussehenden Gnade diesen Erfindungen des Unglaubens und der Gottlosigkeit zum Trotz, in den letzten Tagen von seinem Geiste auf alles Fleisch ausgegossen, auf seine Knechte und Mägde, den angefochtenen Glauben an die leibliche Auferstehung neu belebt und die bisherigen Urkunden durch klare Beleuchtung der Worte und Gedanken von aller Zweideutigkeit und Dunkelheit gereinigt. Weil es Häresien geben musste, damit alle Bewährten offenbar würden, diese aber, ohne einigen Anlass in den hl. Schriften zu finden, nicht wagen konnten, aufzutreten, deshalb wurden ihnen in den bisherigen hl. Urkunden, wie es scheint, einige Anhaltspunkte gegeben, welche freilich wiederum durch die nämlichen Schriften widerlegbar sind. Weil es jedoch nötig war, dass der hl. Geist nicht mehr damit zurückhielt, zu zeigen, dass er auch an solchen Aussprüchen Überfluss habe, welche den Häretikern zu verschmitzten Ausreden nicht nur keinen Stoff geben, sondern im Gegenteil sogar ihr altes Gras auszurupfen dienen, — deshalb hat er nunmehr alle früheren Zweideutigkeiten und die Parabeln durch klare und verständliche Verkündigungen des ganzen Lehrgeheimnisses beseitigt, in der neuen Prophetie, die aus dem Paraklet hervorquillt. Wollte man aus seinen Quellen schöpfen, so würde man nach keiner Lehre mehr dürsten und keine Streitfrage uns noch zu erhitzen imstande sein, sondern wir würden, beständig des Leibes Auferstehung trinkend, Erquickung finden.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Karl Adam Heinrich Kellner, <em>Über die Auferstehung des Fleisches</em> (Tertullians sämtliche Schriften, Köln 1882). Text nach <a href="https://bkv.unifr.ch/de/works/CPL-19/versions/uber-die-auferstehung-des-fleisches-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "XyG2_О_душе_1"
    path: "Tertullian_De_anima"
    title: "Über die Seele"
    menu: { parent: "Werke", title: "Über die Seele", priority: 3 }
    update: true
    body: |-
      <p><em>Über die Seele, übersetzt von Karl Adam Heinrich Kellner (Köln 1882).</em></p><h2>1</h2><p>Nachdem ich früher gegen Hermogenes bloss in betreff der Frage nach dem Ursprunge der Seele in die Schranken getreten bin, insoweit derselbe ihn lieber aus Einflüssen der Materie als aus dem Hauche Gottes ableitet, werde ich mich jetzt zu den übrigen Fragen wenden und dabei wohl meistens mit Philosophen zu kämpfen haben.</p><p>Sogar im Kerker des Sokrates wurde noch über den Zustand der Seele gestritten. Obschon auf den Ort nichts ankommt, so ist mir doch erstens nicht klar, ob, was die Person des Lehrmeisters angeht, die Zeit eine gelegene war. Denn was sollte wohl die Seele des Sokrates in jenem Augenblick noch mit Evidenz erkennen, nachdem das heilige Schifflein schon vom Lande abgestossen, der Schierlingsbecher, wozu er verurteilt, bereits getrunken und sie, wenn es nach der Ordnung der Natur ging, durch die Nähe des Todes in jedem Falle zu einer gewissen Erregung aufgeschreckt war? Wofern es aber nicht nach dem Laufe der Natur ging, war sie ausser sich. Wie heiter und ruhig sie sich auch befand, wie wenig sie auch durch das Weinen der Gattin, die bald eine Witwe, oder durch den Anblick der Kinder, die nun Waisen werden sollten, unter das Gesetz der Verwandtenliebe sich beugen liess, so war sie doch beunruhigt durch das Streben, nicht unruhig werden zu wollen. Ihre Standhaftigkeit war erschüttert durch das Ankämpfen gegen den Mangel an Standhaftigkeit.</p><p>Wofür aber wird ein mit Unrecht Verurteilter sonst noch Sinn haben als nur für Tröstungen über das Unrecht? Und nun gar erst der Philosoph, der geborne Sklave der Ruhmbegier, der nicht sowohl die Aufgabe hat, über Unrecht zu trösten, als vielmehr es sogar verachten soll! So hatte Sokrates gleich nach der Verurteilung seiner Gattin, die ihm begegnete und nach Weiberart schrie: „Sokrates, deine Verurteilung ist eine ungerechte!” auf diese Gratulation geantwortet: „Wünschest du denn etwa, dass sie eine gerechte wäre?” Darum ist es nicht zu verwundern, wenn er im Bestreben, die fragwürdigen Lorbern des Anytus und Melitus zu nichte zu machen, im Kerker und angesichts des Todes selbst die Unsterblichkeit der Seele aufrecht erhält, um der Ungerechtigkeit ihren Erfolg zu rauben.</p><p>Deshalb stammte die ganze damalige Weisheit des Sokrates aus dem Streben eines absichtlich angenommenen Gleichmuts, nicht aus der zuversichtlichen Überzeugung von der Wahrheit. Denn wer kann zur Überzeugung von der Wahrheit gelangen ohne die Hilfe Gottes? Wer Gott erkennen ohne Christus? Wer hat Christus gefunden ohne den heiligen Geist? Wem ist der heilige Geist zu teil geworden ohne das Sakrament des Glaubens? In Wirklichkeit wurde Sokrates eher von einem weit verschiedenen Geiste bewegt. Denn man sagt ja, dass von seiner Kindheit an beständig ein Dämonium um ihn gewesen sei. Wahrhaftig, ein schlechter Erzieher! wenn die Dämonen bei den Dichtern und Philosophen auch als Wesen gelten, die gleich nach den Göttern kommen und sich in der Gesellschaft der Götter befinden. Noch waren nämlich die Belege der Macht des Christentums nicht erschienen, welches allein imstande ist, jene so verderblichen Mächte zu beschämen, die niemals gut sind, sondern jeglichen Irrtum erzeugen und alle Wahrheit fernhalten.</p><p>Wenn nun Sokrates nach dem Urteile des Pythischen Dämons, der freilich nur seinem Bundesgenossen beistand, schon aus der angegebenen Ursache der allerweiseste war, um wie viel mehr Würde und Bestand haben nicht die Aussagen der christlichen Weisheit, bei deren Anhauch die ganze Macht der Dämonen zurückweicht! Sie ist die Weisheit aus der Schule des Himmels, die sich allerdings die Freiheit nimmt, die heidnischen Götter zu leugnen, und sich nicht durch den Befehl, dem Äskulap ein Hahnopfer zu bringen, zweideutig erweist, keine neuen Dämonen einführt, sondern die alten beseitigt, auch die Jugend nicht verführt, sondern sie zur Tugend der Schamhaftigkeit anleitet. Darum, als die Wahrheit, hat sie ungerechte Verurteilung auch nicht bloss von seiten <em>einer</em> Stadt, sondern des ganzen Erdkreises zu tragen, und wird um so viel mehr gehasst, als sie vollkommener ist. Sie hat den Tod nicht in festlichem Anzuge aus einem Becher zu schlürfen, sondern am Kreuze oder auf dem Scheiterhaufen ihn nebst allen Erfindungen der Grausamkeit durchzukosten und stellt in dem viel finstereren Kerker dieser Welt mittlerweile ihre etwaigen Untersuchungen über die Seele mit ihren Gebeten und Phädonen nach den Anweisungen Gottes an.</p><p>Du bist sicherlich nicht imstande, einen besseren Nachweiser der Seele anzugeben als den Urheber derselben. Durch Gott magst du kennen lernen, was du von Gott erhalten hast, oder wenn nicht von Gott, dann auch von keinem andern. Denn wer vermöchte zu enthüllen, was Gott zugedeckt hat? Man muss seine Belehrung da suchen, wo man selbst beim Nichtwissen ganz sicher geht. Es ist besser, etwas nicht wissen um Gottes willen, weil er es nicht geoffenbart hat, als es durch einen Menschen erfahren, weil dieser selbst es gemutmasst hat.</p>
      <h2>2</h2><p>Wir wollen allerdings nicht leugnen, dass die Philosophen manchmal auch unsern Ansichten nahe gekommen sind. Prüfstein für eine Wahrheit ist ihr Erfolg selbst. Beim Sturm, wenn die Merkzeichen am Himmel und im Meere verwischt sind, trifft man auch durch einen glücklichen Irrtum manchmal einen Hafen; zuweilen findet man in blindem Glück auch in der Finsternis den Eingang und Ausgang.</p><p>Es wird ja auch durch die Natur sehr vieles an die Hand gegeben, sozusagen durch den Gemeinsinn, womit Gott die Seele auszustatten geruht hat. Dieses Gemeinsinnes hat sich die Philosophie bemächtigt und ihn zur Verherrlichung ihrer eigenen Kunstfertigkeit aufgeblasen, aus Eifer — es kann nicht auffallen, wenn ich dies so ausdrücke — aus Eifer für eine Redefertigkeit, die alles Beliebige zu beweisen und abzuleugnen versteht, und mehr durch Wortschwall als durch Belehrungen gewinnt. Sie gibt den Dingen eine Form; das eine Mal stellt sie sie gleich, das andere Mal besondert sie sie, aus Gewissem schliesst sie auf Ungewisses, sie greift auf Beispiele zurück, als wenn alles verglichen werden dürfte, sie stellt für alles die Grundsätze zum voraus fest vermittelst der Eigenschaften, obwohl dieselben auch bei ähnlichen Dingen verschieden sind, sie lässt nichts für die göttliche Freithätigkeit übrig, sondern stempelt ihre Meinungen zu Naturgesetzen. — Ich würde mir das gefallen lassen, wenn sich die Philosophie selbst als eine naturgemässe erwiese, die an der Natur auf Grund ihrer gleichartigen Beschaffenheit teil hat.</p><p>Zwar ist auch sie des Glaubens, aus vermeintlich heiligen Schriften geschöpft zu haben, weil das Altertum manche Autoren sogar für Götter oder wenigstens für göttliche Wesen gehalten hat, z. B. den ägyptischen Merkurius, an den sich besonders Plato hält, den Phrygier Silenus, dem, als er von den Hirten herbeigebracht wurde, Midas seine langen Ohren lieh, Hermotimus, welchem die Klazomenier nach seinem Tode einen Tempel errichteten, Orpheus, Musaeus und Pherekydes, den Lehrer des Pythagoras. Wie aber, wenn den Philosophen auch solche Schriften unter die Hände geraten wären, die bei uns unter der Bezeichnung Apokryphen geächtet sind, weil wir die Überzeugung haben, nichts zulassen zu dürfen, was nicht mit der Autorität der echten und schon geraume Zeit früher entstandenen Prophezie übereinstimmt. Wir kennen nämlich die falschen Propheten und die noch viel älteren abgefallenen Geister, welche mit dergleichen verschmitzten Erfindungen das ganze Angesicht der Welt bedeckt haben. Obschon es schliesslich glaublich ist, dass, wer nach Weisheit forscht, auch die wirklichen Propheten, von der Neugierde getrieben, aufgesucht habe, so dürfte man doch bei den Philosophen mehr Abweichungen als Verwandtschaft finden, da man sogar in der Verwandtschaft bei ihnen noch Abweichungen trifft. Denn alles, was man bei ihnen Wahres und mit den Propheten Übereinstimmendes findet, beweisen sie mit fremdartigen Gründen oder putzen es mit fremden Dingen auf, zum grössten Schaden für die Wahrheit selber, die sie durch Falsches Unterstützung finden, oder durch die sie Falschem Unterstützung zukommen lassen.</p><p>Dieser Umstand also hat uns bei vorliegender Materie zum Kampfe gegen die Philosophen getrieben. Denn manchmal staffieren sie die ihnen und uns gemeinsamen Ansichten mit ihren eigenen Beweisführungen aus, die unserer Regel aber in diesem und jenem zuwiderlaufen, manchmal dagegen unterstützen sie ihre besondern Meinungen durch die gemeinsamen Beweise, die da und dort mit ihrer Regel harmonieren, so dass die eigentliche Wahrheit von der Philosophie fast gänzlich ausgeschlossen ist, wegen der Giftmischerei, die diese damit vornimmt. Durch diese doppelte Verwandtschaft, deren jede der Wahrheit feindlich ist, fühlen wir uns dringend aufgefordert, einerseits die gemeinsamen Lehren von den Beweisführungen der Philosophen zu befreien und andererseits die gemeinsamen Beweisführungen von deren Meinungen zu reinigen, indem wir die einzelnen Probleme auf die göttlichen Schriften zurückführen, mit Ausnahme natürlich derjenigen, die ohne die Fangschlinge irgend eines Präjudizes auf das einfache Zeugnis hin aufzunehmen gestattet sein wird, weil manchmal auch das Zeugnis der Feinde erforderlich ist, um den Freunden zu nützen. Ich weiss recht gut, wie dicht der Wald dieser Materie bei den Philosophen ist, entsprechend der Zahl der betreffenden Schriftsteller, wie gross die Verschiedenheiten der Ansichten sind, wie zahlreich die Tummelplätze der Meinungen, wie gross die Zahl der sich weiter ergebenden neuen Fragen, wie verwickelt die Lösungen.</p><p>Auch in die Medizin, die Schwesterwissenschaft, wie man sagt, der Philosophie, habe ich einen Blick gethan, da auch sie diesen Gegenstand für sich in Anspruch nimmt, so zwar, dass es scheint, als gehöre die Seele noch mehr ihr an, wegen der Sorge für den Körper. Daher setzt sie denn auch ihrer Schwesterwissenschaft häufig Widerspruch entgegen, als kenne sie die Seele besser deswegen, weil sie dieselbe gleichsam persönlich im Hause zu behandeln hat. Doch mag der Anspruch beider auf den Vorrang dahinstehen!</p><p>Es hat die Philosophie die Freiheit des Gedankens für sich die Medizin hinwiederum die Gebundenheit der Kunst, um den Detailforschungen über die Seele weiten Spielraum zu gestatten. Ungewisse Dinge werden lang und breit erörtert, Vermutungen noch weitläufiger besprochen. Je schwerer die Sache zu beweisen, desto grösser ist die Geschäftigkeit, uns zu beschwätzen, so dass mit Recht der bekannte Heraklit, der dunkle, die übergrossen Dunkelheiten bei den Forschern über die Seele bemerkend, aus Überdruss an ihren Untersuchungen den Ausspruch that: „Er habe, obwohl er den ganzen Weg zurückgelegt, die Grenzen der Seele keineswegs gefunden.” Der Christ aber hat zur Wissenschaft über diesen Gegenstand wenig notwendig. Denn sie ruht allezeit sicher auf wenigen Punkten, und sein Forschen darf nicht weiter gehen als bis dahin, wo ihm das Finden noch verstattet ist; denn „endlose Untersuchungen” verbietet der Apostel. Nun aber darf man nicht finden über das hinaus, was man von Gott lernt, was man aber von Gott lernt, das ist das Ganze.</p>
      <h2>3</h2><p>Wenn doch die Notwendigkeit, dass es Häresien gebe, damit die Bewährten an den Tag kommen, lieber nicht vorhanden wäre! Dann hätten wir mit den Philosophen, den Patriarchen der Häretiker, um mich so auszudrücken, überhaupt gar nichts über die Seele zu verhandeln. Denn es hat der Apostel schon damals in der Philosophie eine Gefährdung der Wahrheit erblickt; er hatte nämlich an Athen die Stadt der Zungenfertigkeit kennen gelernt, und nachdem er alle die, welche dort Weisheit und Beredsamkeit auskramten, durchgekostet hatte, da beschloss er jenen bekannten Mahnruf.</p><p>Ähnlich verhält es sich nämlich auch mit der Seele infolge der philosophischen Lehren von Leuten, die dem Wein Wasser beimischen. Die einen leugnen die Unserblichkeit der Seele, die andern behaupten, sie sei mehr als unsterblich; andere streiten über ihre Substanz, andere über ihre Form, andere über jegliche Eigenschaft; diese leiten ihren Zustand anderswoher ab, jene lassen sie bei ihrem Ausgang in etwas Anderes übergehen, je nachdem entweder Platos Ehre, Zenos Kraft, des Aristoteles Konsequenz, Epikurs Eingebungen, Heraklits Tiefsinn oder des Empedokles Wahnsinn den Ausschlag gibt.</p><p>Am Ende hat die göttliche Lehre gar einen Fehler gemacht, dass sie aus Judäa und nicht vielmehr aus Griechenland gekommen ist. Auch Christus hat darin gefehlt, dass er die Fischer eher zum Predigen aussandte als den Sophisten. Wird nun in dieser Weise irgendwo das reine Himmelblau der Wahrheit durch den Nebel der Philosophie verdunkelt, so werden die Christen die Pflicht haben, es wieder aufzuhellen, indem sie einerseits die entstandenen Deduktionen, d. i. die der Philosophen, niederschlagen, andererseits ihnen die himmelentsprossenen Lehren, d. h. die des Herrn, entgegensetzen, damit alles, wodurch sich die Heiden von der Philosophie fangen lassen, zerstört, und alles, wodurch sich die Gläubigen von den Häretikern bethören lassen, abgewiesen werde.</p><p>Da nun der eine Streitpunkt, der gegen Hermogenes, wie eingangs bemerkt, bereits erledigt ist, da wir die Entstehung der Seele aus dem Hauche Gottes, nicht aus Materie behaupten und hierin durch die nicht verdunkelbare Regel einer Entscheidung Gottes geschützt sind, nämlich die: „Gott hauchte den Hauch des Lebens in das Antlitz des Menschen und es wurde der Mensch zu einer lebendigen Seele”, natürlich durch den Hauch Gottes, so ist über diesen Punkt nichts weiter zu entwickeln. Er hat seinen Titel und seinen Häretiker. Hinsichtlich der übrigen Punkte will ich hier mit der Einleitung beginnen.</p>
      <h2>4</h2><p>Nächst der Bestimmung ihres Ursprungs unterliegt die Seele der Untersuchung über ihr Wesen. Denn wenn wir eingeräumt haben, dass sie aus einem Hauche Gottes entstanden sei, so ist die unmittelbare Folge, dass wir ihr einen Anfang zuschreiben. Diese Behauptung weist Plato ab, indem er lehrt, die Seele sei ungeboren und ungemacht. Wir lehren aber, sie sei sowohl geboren als gemacht, nachdem festgestellt ist, dass sie einen Anfang hat. Wir haben nicht damit sofort einen Irrtum begangen, wenn wir beides behaupten, weil, wohlgemerkt, geboren sein etwas anderes ist als gemacht sein, indem jenes nur den lebendigen Wesen eignet. Die Unterschiede besitzen aber, indem sie ihre eigenen Orte und Zeiten haben, zuweilen auch die Reziprozität der Gemeinsamkeit. Die Seele lässt also auch ein Machen zu als Form ihres Insdaseingesetztwerdens, da bekanntlich alles, was auf irgend eine Weise das Sein empfängt, erzeugt wird. Der Erzeuger selbst kann Macher genannt werden; so drückt sich auch Plato aus. Was also unsern Glauben an eine gemachte oder geborene Seele angeht, so ist die Ansicht des Philosophen ebenfalls durch die Autorität der Prophezie beseitigt.</p>
      <h2>5</h2><p>Plato wird nun wohl einen Eubulus, Kritolaus, Xenokrates und Aristoteles, der es in diesem Punkte mit ihm hält, zu Hilfe rufen. Vielleicht würden sie noch mehr herausgestrichen, um die Körperlichkeit der Seele zu beseitigen, wenn man nicht im Gegenteil und zwar in noch grösserer Anzahl andere sähe, die einen Körper der Seele behaupten. Und ich meine nicht bloss die, welche sie aus handgreiflich körperlichen Elementen bestehen lassen, wie Hipparchus und Heraklit aus Feuer, wie Hippon und Thales aus Wasser, wie Empedokles und Kritias aus Blut, wie Epikur aus den Atomen, insofern ja auch die Atome durch ihr Zusammentreffen sich zur Körperlichkeit verdichten — wie Kritolaus und seine Peripatetiker aus einer sonst unbekannten fünften Substanz, wenn nämlich auch sie ein Körper ist, da sie Körper einschliesst —, ja sogar auch die Stoiker ziehe ich herbei, die, obwohl sie, fast wie wir, die Seele einen Geist nennen, insofern sich ja Hauch und Geist ganz nahe stehen, doch gern für die Körperlichkeit der Seele sprechen werden.</p><p>Zeno endlich, der die Seele als verdichteten Atem definiert, legt sich die Sache so zurecht: dasjenige, nach dessen Austritt ein lebendes Wesen stirbt, ist ein Körper; wenn aber der verdichtete Atem austritt, so stirbt das lebende Wesen, folglich ist der verdichtete Atem ein Körper; der verdichtete Atem ist aber die Seele, also ist die Seele ein Körper.</p><p>Kleanthes behauptet, dass bei den Kindern eine Ähnlichkeit mit den Eltern vorhanden sei, nicht bloss in den körperlichen Umrissen, sondern auch in den Eigenschaften der Seele, im Spiegelbilde des Charakters, in den Anlagen und Neigungen, dass die Seele aber auch mit dem Körper Ähnlichkeit oder Unähnlichkeit eingehe. So sei der Körper der Ähnlichkeit und Unähnlichkeit unterworfen. Ebenso seien die körperlichen und die nicht körperlichen Leiden keineswegs identisch. Nun aber leide die Seele mit dem Körper mit; wenn er durch Schläge, Wunden, Beulen verletzt sei, so empfinde sie den Schmerz mit und ebenso auch der Leib mit der Seele, mit deren Leiden er bei Sorge, Angst und Liebe seinen Zusammenhang verrät durch den Verlust der entsprechenden Munterkeit, und von deren Scham und Furcht er durch sein Erröten und Erbleichen Zeugnis gibt. Folglich ist die Seele ein Körper, weil sie die körperlichen Leiden teilt.</p><p>Chrysippus reicht ihm die Hand, indem er konstatiert, dass das Körperliche vom Unkörperlichen durchaus nicht getrennt werden könne, weil es sonst auch nicht davon würde berührt werden. Deshalb sagt auch Lukretius: „Berühren und berührt werden kann kein Ding, als nur ein Körper”; wenn die Seele aber den Körper verlässt, so verfalle dieser dem Tode. Mithin sei die Seele ein Körper, weil sie, wenn nicht körperlich, den Körper nicht verlassen würde.</p>
      <h2>6</h2><p>Hiergegen erheben die Platoniker mehr aus Spitzfindigkeit als mit Grund Schwierigkeiten. Ein jeder Körper, sagen sie, ist notwendigerweise entweder belebt oder unbelebt. Und dann wird er, wenn unbelebt, von aussen her, wenn belebt, von innen her in Bewegung gesetzt. Die Seele aber dürfte wohl nicht von aussen bewegt werden, als welche nicht unbeseelt ist, und auch nicht von innen, weil sie es vielmehr selber ist, die den Körper bewegt. Daher werde sie wohl kein Körper sein, da sie nicht nach der herkömmlichen Art der Körper von irgend einer Stelle aus in Bewegung gesetzt wird.</p><p>Hierbei dürften wir uns nun zunächst über das Unzutreffende der Definition zu wundern haben, die sich auf etwas beruft, was auf die Seele nicht passt. Es geht nämlich nicht an, dass man sagt, die Seele sei entweder etwas Belebtes oder etwas Unbelebtes, da sie es gerade ist, welche den Körper zu einem Belebten macht durch ihre Anwesenheit, und zu einem Leblosen durch ihre Abwesenheit von ihm. Sie kann also nicht ihre eigene Wirkung selber sein und etwas Belebtes oder Lebloses genannt werden. Denn Seele wird sie genannt in Hinsicht auf ihre Substanz. Wenn das, was die Seele ist, sich nun die Benennung Belebtes oder Unbelebtes nicht gefallen lässt, wie kann man sich da auf die Form der belebten und unbelebten Körper berufen?</p><p>Sodann, wenn es das Kennzeichen eines Körpers ist, von aussen her durch etwas bewegt zu werden, und wir nun zeigen, dass auch die Seele von anderen Faktoren bewegt wird, z. B. wenn sie weissagt, wenn sie raset, d. h. also von aussen, da ja das Bewegende ein anderes ist, so werde ich nach der vorgetragenen Analogie mit vollem Recht das, was von einem andern von aussen her bewegt wird, für einen Körper ansehen. Ist es nun eine Eigenschaft des Körpers, von einem andern bewegt zu werden, um wie viel mehr noch ist es eine solche, selbst einen andern Körper zu bewegen! Die Seele aber setzt den Körper in Bewegung, und ihre desfallsigen Bemühungen treten äusserlich zutage. Von ihr nämlich kommt es her, wenn die Füsse zum Gehen, die Hände zum Erfassen, die Augen zum Sehen, die Zunge zum Sprechen angetrieben werden, indem sie unter der Oberfläche automatenartig die Bewegung bewirkt. Woher hat die unkörperliche Seele die Kraft dazu? Wie kann ein wesenloses Ding materielle Dinge fortbewegen?</p><p>Aber wie kommt es, dass beim Menschen die körperlichen und geistigen Sinnesthätigkeiten getrennt erscheinen? Man sagt, die Sinne des Körpers, z. B. Gesicht und Gefühl, melden uns die Eigenschaften der körperlichen Dinge, wie der Erde oder des Feuers, die nicht körperlichen dagegen passen für das Intellektuelle, wie Güte und Bosheit. Daher stehe es fest, dass die Seele unkörperlich sei, weil ihre Eigenschaften nicht mit den körperlichen Sinnen, sondern mit den intellektuellen erfasst würden. Das soll gelten, so lange bis ich dieser Auffassung Platz zu greifen verwehre. Aber siehe da, ich zeige, dass auch Unkörperliches unter die körperlichen Sinneswahrnehmungen falle, der Ton unter das Gehör, die Farbe unter das Gesicht, der Duft unter den Geruch; nach der Analogie davon tritt die Seele auch mit dem Körper in Verbindung. Daher kann man nicht sagen, dass diese Dinge, weil sie mit Körperlichem in Verbindung treten, mit den körperlichen Sinnen aufgefasst würden. Wenn es also feststeht, dass unkörperliche Dinge von den körperlichen erfasst werden, warum sollte nicht auch die Seele, welche unkörperlich ist, durch Körperliches angezeigt werden? Die Annahme ist ganz gewiss abgewiesen.</p><p>Zu den vorzüglichsten Beweisführungen gehört auch, dass man glaubt, jeder Körper ernähre sich durch Körperliches, die Seele aber, als ein Unkörperliches, durch Geistiges, nämlich durch das Streben nach Weisheit. Aber auch dies ist keine haltbare Stellung, da ein in der methodischen Heilkunde so unterrichteter Gewährsmann wie Soranus, die Antwort gibt, die Seele ernähre sich ebenfalls durch körperliche Dinge, ja, sie werde, wenn sie auszugehen droht, durch Speise meistens gehalten. Natürlich, wenn letztere gänzlich fehlt, so verlässt die Seele den Körper. So hat denn auch Soranus, der über die Seele am ausführlichsten — in vier Büchern — geschrieben hat und in allen philosophischen Lehren bewandert ist, der Seele eine körperliche Substanz vindiziert, aber sie dabei freilich um die Unsterblichkeit gebracht. Denn nicht alle sind zum Glauben berufen, wie die Christen.</p><p>Wie Soranus einerseits zeigt, dass sich die Seele von körperlichen Dingen ernährt, so müsste der Philosoph andererseits ähnlich den Beweis liefern, dass sie von Unkörperlichem lebe. Es hat aber noch niemals jemand einer Seele, wenn sie zu scheiden im Begriffe stand, den Honigseim Platonischer Beredsamkeit eingegeben und noch keine hat dann die Brocken der Subtilitäten des Aristoteles verschluckt. Was sollen vollends die Seelen so vieler ungebildeten Menschen und Barbaren anfangen, welche das Brot der Weisheit nicht besitzen und doch in ungeschulter Klugheit stark sind, die ohne Akademien, ohne attische Säulenhallen und Sokratische Kerker, mit Einem Wort, ungespeist und ungetränkt von aller Philosophie, dennoch leben? Denn der Substanz der Seele selber hilft ja das Genährtsein durch Studien nichts, sondern nur ihrem Verhalten, da sie die Seele nicht fetter machen, sondern sie nur zieren.</p><p>Zum guten Glück behaupten die Stoiker, auch die Künste seien körperlich. Also ist die Seele selbst dann auch körperlich, wenn sie mit den Künsten genährt worden ist. Bei ihrem hohen Fluge pflegt die Philosophie häufig nicht auf den Weg zu sehen. So kam es, dass Thales in den Brunnen fiel. Sie pflegt auch wohl, indem sie ihre eigenen Meinungen nicht versteht, an das Dasein einer Krankheit zu denken. Daher griff Chrysipp zum Niesswurz. Etwas der Art, vermute ich, ist ihm zugestossen, als er leugnete, dass zwei Körper in einem sein können, wobei er Augen und Sinn gar nicht auf die Schwangern richtete, welche doch jeden Tag nicht einen, sondern sogar zwei und drei Körper im Bereich ihres einzigen Uterus tragen. Ist doch im Civilrechte von einer Griechin die Rede, welche eine Fünfheit von Söhnen zur Welt gebracht hat, zugleich Mutter von allen, mehrfache Gebärerin bei einem einzigen Fötus, vielfältige Kindbetterin bei einem einzigen Uterus, welche, von so vielen Körpern, ich möchte fast sagen, von einem ganzen Volke umringt, selber der sechste Körper war. Die ganze Schöpfung bezeugt es, dass Körper, die aus Körpern hervorgehen sollen, sich bereits an derselben Stelle befinden, von wo sie hervorgehen sollen. Was aus einem andern entsteht, muss notwendig das Zweitfolgende sein. Nichts aber entsteht aus einem andern, als wenn es erzeugt wird. Dann sind es zwei.</p>
      <h2>7</h2><p>Was die Philosophen anlangt, so genügt das Gesagte; was die unsrigen betrifft, so ist es bereits zu viel, da uns die Körperlichkeit der Seele schon aus dem Evangelium entgegenleuchtet. Die Seele eines gewissen Mannes in der Unterwelt empfindet Schmerz, wird im Feuer gestraft, leidet Qual an ihrer Zunge und fleht, durch den Finger einer glücklicheren Seele die Erquickung des Taues zu erhalten. Hältst du das Ende des frohen Armen und des trauernden Reichen für ein blosses Bild? Was soll denn dann der Name Lazarus, wenn der Vorfall kein wirklicher ist? Aber auch wenn er für ein blosses Bild zu halten ist, so wird er doch ein Beleg für die Wirklichkeit sein. Denn wenn die Seele keinen Körper hätte, so würde das Bild der Seele keinen Vergleich mit dem Körper zulassen und die heilige Schrift würde nicht — lügnerischer Weise also — von körperlichen Gliedern reden, wenn es keine gäbe. Was ist es denn aber, das zur Unterwelt getragen wird nach der Trennung vom Körper? Was ist es, das dort festgehalten und für den Gerichtstag aufbewahrt wird? Zu wem ist Christus nach seinem Tode hinabgestiegen? Ich denke, zu den Seelen der Patriarchen. Aber warum befindet sich denn die Seele unter der Erde, wenn sie ein Nichts ist? Denn ein Nichts ist sie, wenn sie kein Körper ist. Für die Körperlosigkeit gibt es keine Art von Gewahrsam, sie ist ledig der Strafe sowohl als der Erquickung; denn das, woran man gestraft oder erquickt wird, kann nur ein Körper sein. Ich werde darüber noch ausführlicher an einem gelegeneren Orte handeln. Wenn also die Seele im Kerker oder am Aufenthaltsorte des Unterirdischen, im Feuer oder im Schoosse Abrahams Strafe und Trost irgendwelcher Art im voraus verkostet, so dürfte die Körperlichkeit der Seele damit bewiesen sein. Denn das Körperlose empfindet nichts, da es kein Organ hat, wodurch es empfinden könnte, oder wenn es eins hat, so ist es der Körper. Wie nämlich alles Körperliche leidens- und empfindungsfähig, so ist alles Leidens- und Empfindungsfähige körperlich.</p>
      <h2>8</h2><p>Darum ist es auch in den übrigen Hinsichten grundlos und unsinnig, irgend etwas von der Klasse der Körper auszunehmen, weil es die sonstigen Analogien mit dem Körperlichen nicht in gleicher Weise besitzt. Wo blieben denn da die besondern Unterschiede der Eigenschaften, durch welche sich die Erhabenheit des Urhebers in der Mannigfaltigkeit seiner Werke zeigt, indem diese ebensowohl verschieden als gleich, ebenso einander befreundet als feindlich sind? Die Philosophen sagen selber, dass das All aus lauter entgegengesetzten Dingen bestehe, im Sinne der Freundschaft und Feindschaft des Empedokles. Wenn so also das Körperliche dem Unkörperlichen entgegengesetzt ist, so unterscheiden sich auch diese beiden Klassen von Dingen untereinander selber wieder in der Weise, dass der Unterschied ihre Arten vermehrt, nicht die Gattung ändert, so dass zur Ehre Gottes auf diese Weise der körperlichen Dinge viele sind, indem sie mannigfaltig, mannigfaltig, indem sie verschieden sind, verschieden, indem die Wahrnehmung einer Eigenschaft durch diesen Sinn, einer andern durch jenen geschieht, indem die einen diese Nahrung aufnehmen, die andern jene, diese das Leichte, jene das Schwere, diese das Sichtbare, jene das Unsichtbare.</p><p>Man behauptet nämlich, auch deswegen die Seele für unkörperlich ansehen zu müssen, weil nach ihrem Austritt die Leichen schwerer werden, da sie doch durch die Wegnahme eines Körpers, wenn die Seele ein Körper wäre, leichter werden müssten. Was würde man dazu sagen, fragt Soranus, wenn geleugnet würde, das Meer sei ein Körper, weil ein ausserhalb des Meeres befindliches Schiff unbeweglich und schwer wird? Um wie viel kräftiger muss daher der Körper der Seele sein, wenn sie den nachher so schweren Leib mit solcher Behendigkeit und Beweglichkeit herumträgt!</p><p>Auch die Unsichtbarkeit der Seele entspricht der Beschaffenheit ihres Körpers, der Eigentümlichkeit seiner Substanz und der Natur dessen, wodurch sie die Eigenschaft des Unsichtbarseins erlangt hat. Die Nachteulen wissen nichts vom Sonnenschein wegen ihrer Augen, die Adler aber können ihn so gut vertragen, dass sie den echten Adel ihrer Nachkommenschaft danach beurteilen, ob deren Augen ihm zu trotzen vermögen; andernfalls ziehen sie dieselbe nicht auf, als sei aus der Art geschlagen, wer sich vor dem Sonnenstrahl wegwendet. Was also dem einen unsichtbar ist, ist es dem andern nicht, und braucht darum doch nicht unkörperlich zu sein, weil sich jene Fähigkeit nicht gleich bleibt. Denn die Sonne ist ein Körper, da sie ja Feuer ist. Allein was der Adler bekennt, das dürfte die Nachteule am Ende leugnen, ohne darum ein Präjudiz gegen den Adler hervorzurufen. Ebenso sehr ist auch der Seelenkörper höchstens für das Fleisch unsichtbar, dem Geiste aber ist er sichtbar. So erblickte z. B. Johannes, vom Geiste Gottes überkommen, die Seelen der Märtyrer.</p>
      <h2>9</h2><p>Wenn wir behaupten, dass der Seelenkörper von besonderer Beschaffenheit und eigener Art sei, so dürfte bereits dieser Umstand, die Eigenart, in betreff der übrigen Accidenzien der Körperlichkeit ein Präjudiz dafür geben, dass er, dessen Körper wir bewiesen haben, deren ebenfalls besitze, dass aber auch sie von eigener Art sind entsprechend der Eigentümlichkeit des Seelenkörpers, oder aber wenn etwa keine vorhanden sind, eben dies zu seiner Besonderheit gehöre, dass der Seelenkörper nicht hat, was die andern Körper haben. Trotzdem werden wir beharrlich behaupten, dass die Seele alle gewöhnlicheren und die durchaus notwendigen Eigenschaften der Körperlichkeit besitze, wie z. B. das Aussehen, die Begrenzung und die dreifache Ausdehnung, nämlich Länge, Breite und Höhe, wonach die Philosophen den Körper messen.</p><p>Wie aber, wenn wir auch ein Bild der Seele zuliessen, Plato zum Trotz, der es nicht zugeben will, weil die Unsterblichkeit der Seele dadurch in Gefahr käme?! Denn alles Abzubildende, behauptet er, sei zusammengesetzt und gefügt; alles Zusammengesetzte und Gefügte sei auflösbar; die Seele aber sei unsterblich. Folglich sei sie unauflösbar, weil unsterblich und unabbildbar, weil unauflöslich. Sie würde aber zusammengesetzt und gefügt sein, wenn sie abbildbar wäre. Er schildert sie gleichsam auf eine andere Weise ab in bloss intellektuellen Formen: als schön infolge der Gerechtigkeit und des philosophischen Unterrichts, hässlich hingegen durch das Gegenteil davon.</p><p>Wir legen ihr leibliche Umrisse bei, nicht bloss infolge unseres Glaubens an ihre Körperlichkeit im Wege des Schlusses, sondern mit der Zuversicht der Gnade infolge einer Offenbarung. Denn weil wir geistige Charismen gelten lassen, so haben wir die Prophetengabe zu erlangen verdient, auch noch nach Johannes. Es befindet sich gegenwärtig bei uns eine Mitschwester, welcher das Charisma der Offenbarungen zuteil geworden ist, die sie in der Kirche während der Sonntagsfeier durch Verzückung im Geiste erhält. Sie verkehrt mit den Engeln, zuweilen auch mit dem Herrn, sie sieht und hört Geheimnisse, unterscheidet zuweilen die Herzen und gibt denen, die es verlangen, Heilmittel an. Ferner, je nachdem Schriftstellen gelesen, Psalmen gesungen oder Anreden gehalten werden, bieten sich ihr aus ihnen Gegenstände zu Visionen dar. Zufällig hatte ich einmal, ich weiss nicht mehr was, über die Seele vorgetragen, als über diese Schwester der Geist kam. Gemäss ihrer Gewohnheit, uns mitzuteilen, was sie geschaut hat — ich erzähle dies sorgfältig, damit es geprüft werde — sagte sie nach Vollendung des Gottesdienstes und Entlassung des Volkes: Unter anderem wurde mir die Seele in leiblicher Gestalt gezeigt und der Geist war sichtbar, nicht entleert und in hohler Beschaffenheit, nein, so, dass er sich auch festhalten zu lassen versprach, zart, lichtartig, luftfarben und in vollkommen menschlicher Gestalt. Dies die Vision; Gott ist Zeuge und der Apostel hinlänglich Bürge für das künftige Vorhandensein von Charismen in der Kirche — und da wollte man, wenn die Sache selbst in den Einzelheiten in so überzeugender Weise auftritt, nicht einmal glauben?!</p><p>Denn wenn die Seele ein Körper ist, so ist sie ohne Zweifel innerhalb der Dinge, die wir oben angegeben haben. Auch die Farbe als Eigenschaft hängt jeglichem Körper an. Welche Farbe also wolltest du sonst bei der Seele annehmen, als die der Luft und des Lichtes? Nicht dass die Luft selbst die Substanz der Seele wäre, obschon es dem Änesidemus und Anaximenes, nach einigen vermutlich auch Heraklit so geschienen hat, noch auch das Licht, obschon es dem Heraklides aus Pontus so gefällt. Der Keraunius hat darum keine feurige Substanz, wenn er auch in rötlicher Farbe schillert, noch der Beryll darum einen wässerigen Stoff, weil er in geläutertem Schimmer schwimmt. Wie viele andere Dinge gleichen sich in der Farbe, werden aber durch ihre Wesenheit weit auseinander gehalten! Weil alles Feine und Durchsichtige mit der Luft verwechselt werden kann, so könnte es auch die Seele, insofern sie ein Hauch und übertragener Atem ist. Läuft sie ja doch wegen ihrer Feinheit und Dünnheit Gefahr, selbst hinsichtlich ihrer Körperlichkeit verkannt zu werden.</p><p>So mache dir denn nun auch in betreff ihres Bildes einen Begriff aus deiner eignen Wahrnehmung, dass das Bild der menschlichen Seele für kein anderes gehalten werden dürfe, als eben für das menschliche, und zwar das Bild desjenigen Körpers, den eine jede mit sich umhertrug. Dies so zu verstehen, mögen wir vorläufig durch die Betrachtung ihres Ursprunges bewogen werden. Vergegenwärtige dir nämlich folgendes: Als Gott den Hauch des Lebens in das Angesicht des Menschen blies und der Mensch zur lebendigen Seele geworden war, wurde sofort jener Hauch vollständig durch das Gesicht in sein Inneres hinübergeleitet, ergoss sich durch alle Räume des Körpers, verdichtete sich zugleich durch göttliche Nachhilfe, drückte jede der Grenzlinien aus, die er, drinnen verdichtet, ausgefüllt hatte und erstarrte gleichsam wie in einer Form. Damit also wurde die Körperlichkeit der Seele kraft der Verdichtung befestigt und ihr Bild durch das Abdrücken geformt.</p><p>Das wäre der innere Mensch; ein anderer ist der äussere, in beidem einer. Auch jener hat seine Augen und Ohren, womit das Volk den Herrn hätte sehen und hören sollen, sowie die übrigen Glieder, deren er sich in Gedanken bedient und die er bei Träumen gebraucht. So hat denn auch der reiche Prasser in der Unterwelt eine Zunge, der Arme Finger und Abraham einen Schooss. An diesen Umrissen werden auch die Seelen der Martyrer unter dem Altare erkannt. Denn die von Anfang an in Adam mit dem Körper verwachsene und mit ihm geformte Seele war der Same wie der ganzen Gesamtsubstanz so auch der in Rede stehenden Seinsweise.</p>
      <h2>10</h2><p>Es gehört zum Wesen des Glaubens, die Seele mit Plato zu bestimmen als einfach, d. h. als eingestaltig wenigstens hinsichtlich der Substanz. Mögen die Künste und Wissenschaften, mögen auch die Bilder dazu sagen, was sie wollen!</p><p>Einige Leute wollen nämlich, dass sich in ihr noch als eine andere geistige Substanz der <em>Odem</em> befinde, in dem Sinne, dass es etwas anderes sei zu <em>leben</em>, was von der Seele herkomme, und wieder etwas anderes zu <em>atmen</em>, was durch den Odem geschehe. Denn nicht alle lebenden Wesen besitzen beides. Sehr viele nämlich leben bloss, atmen aber nicht, deswegen, weil sie keine Atmungsorgane, keine Lungen und Luftröhren besitzen. Wozu aber sollte es dienen, bei der Untersuchung über die menschliche Seele sich bei kleinlichen, von der Mücke und Ameise hergenommenen Spitzfindigkeiten aufzuhalten, da ja doch der göttliche Schöpfungskünstler allen Tieren Lebensorgane gegeben hat, entsprechend der Beschaffenheit jeglicher Gattung, so dass man daraus keine Schlüsse ziehen kann. Denn der Mensch, wenn er mit Lungen und Luftröhren ausgerüstet ist, wird darum nicht mit etwas anderem atmen und anders leben, noch wird hinsichtlich der Ameise, wenn sie dieser Organe entbehrt, in Abrede gestellt werden dürfen, dass sie atme und bloss lebe. Wem aber ist so viel Einblick in die Werke Gottes gestattet, dass er bei irgend einem davon auf diesen Mangel schliessen könnte? Ob Herophilus, der bekannte Arzt oder auch Fleischhacker, der sechshundert Personen seziert hat, um die Natur zu erforschen, der den Menschen mit Hass verfolgte, um ihn kennen zu lernen, ob er alle seine inneren Teile bis zur Evidenz erkannt hat, ich weiss es nicht; denn der Tod verändert ja das, was Leben gehabt hat, zumal ein nicht gewöhnlicher Tod, und er selbst irrte sich wohl auch zwischen den Handgriffen des Sezierens.</p><p>Die Philosophen haben als ausgemacht behauptet, dass die Mücken, Ameisen und Motten keine Lungen haben. — Sage mir, sorgsamer Forscher, haben sie Augen zum Sehen? Sie laufen aber doch nach jeder Richtung, wohin sie wollen; sie vermeiden und erstreben, was sie durch das Gesicht erkannt haben. Zeige mir nun die Augen, lege mir die Pupillen vor! Die Motten nagen ja auch; zeige mir ihre Kinnladen, weise mir ihre Backen! Die Mücken geben doch Laute von sich und sind nicht einmal im Dunkeln blind; denn sie wissen die Ohren zu finden. Wo ist nun ihre Sprachröhre und ihr Mundstück? Jegliches Tier, und wenn es auch nur so gross wie ein Pünktchen wäre, muss von irgend etwas leben. Zeige mir seine Organe zum Unterschlucken, Verdauen und zur Scheidung der Speisen!</p><p>Was werden wir also sagen? Wenn diese Organe zum Leben gehören, so werden sie sich natürlich auch bei allem, was lebt, vorfinden, wenn sie auch nicht sichtbar, nicht bemerkbar sind wegen ihrer Kleinheit. Man wird dies um so glaublicher finden, wenn man sich erinnert, dass Gott ein grosser Künstler ist im kleinen sowohl als im allergrössten. Wenn man dagegen glaubt, dass so kleine Körperchen dem Erfindungsgeiste Gottes keinen Raum böten, so müsste man seine Grösse darin erkennen, dass er die kleinen Tierchen doch mit Leben ausgerüstet hat, ohne die erforderlichen Glieder dazu, dass sie Sehkraft besitzen ohne Augen, fressen ohne Zähne, verdauen ohne Bauchhöhlen, so gut, wie manche andere sich auch ohne Füsse fortbewegen in wellenförmiger Bewegung, wie die Schlangen, sich im Ansprung emporheben, wie die Würmer, oder im Kriechen Schaum absondern, wie die Schnecken.</p><p>Warum wolltest du also nicht auch glauben, dass sie atmen ohne die Blasbälge der Lunge und ohne eine Luftröhre? sondern vermeinst, einen gewaltigen Griff in dem Argumente gethan haben, dass du sagst, der menschlichen Seele sei auch der Odem beigegeben, weil es Geschöpfe gebe, die des Atmens entbehren, und deswegen des Atmens entbehren, weil sie nicht mit Atmungswerkzeugen ausgerüstet seien. Du nimmst an, dass etwas ohne zu atmen leben könne; dass es aber ohne Lunge atmen könne, willst du nicht glauben?! Was ist denn, ich bitte dich, das Atmen? Einen Hauch aus sich ausstossen, denke ich. Was heisst nicht leben? Keinen Hauch mehr aus sich ausstossen, denke ich. So würde ich antworten müssen, wenn atmen und leben nicht ein und dasselbe wäre. — Der Tote wird keinen Hauch mehr aus sich ausstossen, der Lebende wird also einen solchen ausgehen lassen. — Ja, aber auch der Atmende wird einen Hauch ausstossen, folglich wird der Lebende auch atmen. Wenn beides ohne die Seele vor sich gehen könnte, so würde der Seele nicht das Atmen, sondern bloss das Leben zuzuschreiben sein. Aber leben ist atmen und atmen ist leben. Also ist das Leben und Atmen zusammen miteinander Sache dessen, dem das Leben eignet, d. h. der Seele.</p><p>Will man Seele und Odem auseinanderhalten, so halte man auch deren Thätigkeiten auseinander. Beide sollten doch einmal etwas in unterschiedlicher Weise thun, die Seele für sich und der Odem für sich! Die Seele sollte doch einmal ohne den Odem leben und der Odem ohne die Seele atmen. Das eine sollte doch einmal den Körper verlassen und das andere darin bleiben; Tod und Leben sich zusammenthun! Denn wenn Seele und Odem zwei Wesen sind, so können sie auch getrennt werden, und kann durch ihre Trennung, indem das eine geht, das andere bleibt, sich ein Zusammentreffen von Tod und Leben ereignen. Aber das wird niemals vorkommen. Folglich sind sie nicht zwei Wesen, da sie nicht getrennt werden können. Sie würden aber getrennt werden können, wenn sie zwei wären.</p><p>Aber es können doch zwei Dinge zusammengewachsen sein. — Gut, sie würden aber nicht zusammengewachsen sein, wenn leben etwas anderes wäre als atmen. Ihre bezüglichen Thätigkeiten setzen den Unterschied zwischen den Substanzen.</p><p>Um wie viel sicherer ist nun die Wahrheit gestellt, dass beide nur ein Wesen sind, da du keine Scheidung zulässest, indem Seele und Atmungsseele dasselbe sind, und das, was atmet und lebt, eines und dasselbe ist! Wie wäre es, wenn man den Tag für etwas anderes ausgeben wollte, als das Licht, indem dieses zum Tage noch hinzutrete, da doch der Tag selbst das Licht ist? Es mag allerdings auch andere Arten von Licht geben, wie zum Beispiel das mit Hilfe des Feuers erzielte Licht. Es mag auch andere Arten von Atmungsseelen geben, wie z. B. die aus Gott oder die aus dem Teufel stammenden. Daher wird, wenn von der Seele und dem Lebensodem gehandelt wird, Seele und Atmungsseele dasselbe sein, so gut wie Tag und Tageslicht. Denn ein Ding ist etwas durch das, wodurch es zu etwas wird.</p>
      <h2>11</h2><p>Die Seele hier Odem zu nennen, treibt mich der Stand der gegenwärtigen Untersuchung; denn das Atmen ist einer andern Substanz zugeschrieben worden. Wenn wir es der Seele selbst zuschreiben, die wir als eingestaltig und einfach anerkennen, so müssen wir uns des Ausdrucks Odem mit einer gewissen Modifikation bedienen, nicht als Bezeichnung eines Zustandes, sondern einer Thätigkeit, nicht für die Substanz, sondern für ihr Wirken, da sie atmet, nicht aber im eigentlichen Sinne der Lebensodem selbst ist. Denn auch das Hauchen ist Atmen. Wie wir also infolge ihrer Eigentümlichkeit behaupten, die Seele sei ein Hauch, so sprechen wir hier aus Notwendigkeit den Satz aus, sie sei Odem.</p><p>Im übrigen halten wir gegen Hermogenes, der behauptet hat, sie sei aus der Materie und nicht aus dem Hauche Gottes entstanden, im eigentlichen Sinne aufrecht, dass sie ein Hauch sei. Er macht nämlich gegen die Autorität der hl. Schrift selbst aus dem Hauche einen Odem, und meint somit, da es unglaublich sei, dass der Hauch Gottes in einen Fehltritt und infolge dessen dem Gerichte verfalle, die Seele sei aus der Materie und nicht aus dem Odem Gottes hervorgegangen. Darum haben wir auch dort den Satz verteidigt, sie sei ein Hauch und nicht ein Odem, in Gemässheit mit der hl. Schrift und der Unterscheidung des Ausdrucks. Hier dagegen sagen wir nur ungern von ihr aus, dass sie ein Odem sei wegen der Identität des Hauchens und des Atmens. Dort handelte es sich um die Substanz; denn das Hauchen ist eine Thätigkeit der Substanz.</p><p>Halten wir uns nun auch nicht länger dabei auf, als wegen der Häretiker nötig ist, die weiss Gott was für einen spirituellen Samen in die Seele hineinstopfen, der durch eine heimliche Freigebigkeit der Mutter Sophia ohne Wissen des Schöpfers ihr verliehen sein soll! Die hl. Schrift aber, die den Schöpfer, ihren Gott, besser kennt, hat nichts darüber weiter gemeldet, als dass Gott in das Antlitz des Menschen den Hauch des Lebens blies und der Mensch zur lebenden Seele geworden sei, wodurch er von da an sowohl lebt als atmet. Dabei ist dann der Unterschied zwischen Odem und Seele in den folgenden Schriften genugsam kenntlich gemacht, indem Gott selbst spricht: „Der Odem ist aus mir ausgegangen, und jeglichen Hauch, ich habe ihn gemacht.” Die Seele ist nämlich der aus dem Odem entstandene Hauch. Und wiederum heisst es: „Der, welcher dem Volke auf Erden den Hauch gegeben hat und Odem denen, die sie treten.” Zuerst hat nämlich Seele, d. i. Hauch, das Volk, das auf der Erde wandelt, d. h. welches im Fleische fleischlich handelt, sodann haben Lebensodem die, welche die Erde unter die Füsse treten, d. h. die Werke des Fleisches sich unterwerfen, wie denn auch der Apostel nicht das, was geistig ist, zuerst setzt, sondern erst das Animale und dann das Spiritale. Wenn Adam sofort als Prophet auftrat und das grosse Sakrament verkündete, in bezug auf Christus und die Kirche: „Dies ist jetzt Bein von meinen Beinen und Fleisch von meinem Fleisch; deswegen wird der Mensch Vater und Mutter verlassen und seinem Weibe anhängen, und sie werden zwei sein zu einem Fleische”, — so erfuhr auch er ein plötzliches Überkommen des Geistes. Es kam nämlich eine Extase über ihn, eine die Prophetie des hl. Geistes vermittelnde Kraft.</p><p>Denn auch der böse Geist ist etwas, das einen überkommt. So verwandelte z. B. der Geist Gottes den Saul nachher in einen andern Menschen, d. i. in einen Propheten, da es heisst: „Was ist dies mit dem Sohne des Cis? Auch Saul unter den Propheten?” Nachher aber verwandelte ihn der böse Geist in einen andern Menschen, nämlich in einen Abtrünnigen. Auch in Judas, der eine geraume Zeit zu den Auserwählten zählte, so dass er sogar Schatzmeister wurde — obwohl damals schon ein Betrüger, so doch noch kein Verräter, — auch in ihn fuhr nachmals der Teufel. Wenn also der Seele von Geburt aus weder der Geist Gottes noch der Geist des Teufels zugesellt ist, so steht es fest, dass sie für sich allein bleibt, so lange nicht der eine oder andere Geist kommt. Wenn sie aber allein ist, dann ist sie auch einförmig, in Hinsicht auf ihre Substanz einfach und hat daher ihren Odem nirgendwo anders her, als aus ihrer eigenen Substanz.</p>
      <h2>12</h2><p>Ebenso verstehen wir unter dem <em>animus</em>, meinetwegen auch dem <em>mens</em>, bei den Griechen dem <em>νοῦς</em> [nous], nichts anderes als den der Seele angeborenen oder eingepflanzten und von Geburt aus eigenen Trieb, vermöge dessen sie handelt und empfindet. Ihn aus sich selbst bei sich besitzend, bewegt sie sich in sich selbst und scheint von ihm wie von einer fremden Substanz bewegt zu werden. So wollen es die, welche den <em>animus</em> für den Beweger des Weltall halten, jenen bekannten Gott des Sokrates, den Monogenes des Valentinus, dessen Vater der Bythos, dessen Mutter die Sige sein soll.</p><p>Wie verworren ist doch die Ansicht des Anaxagoras! Nachdem er den <em>animus</em> für den Anfang aller Dinge ausgegeben hat, an welchem das Weltall wie eine Schaukel an ihrer Achse aufgehängt sei und dann behauptet hat, derselbe sei rein, einfach und keiner Mischung fähig, so sondert er ihn gerade aus diesem Grunde wieder von der Vergesellschaftung mit der Seele ab und gesellt ihn doch an einer andern Stelle ihr wiederum zu.</p><p>Dies hat auch Aristoteles getadelt, von dem man eigentlich nicht weiss, ist er besser gerüstet, seine Lehren aufzuputzen oder die der andern des Inhalts zu entleeren. Seine eigene Definition von <em>animus</em> hat er aufgespart, vor der Hand aber doch von einer andern Art von <em>animus</em> gesprochen, dem göttlichen, den er durch den Beweis seiner Leidensunfähigkeit wiederum von der Gemeinschaft mit der Seele fern hält. Denn da es feststeht, dass die Seele die Leiden, von denen sie getroffen wird, zu ertragen fähig ist, so wird sie dieselben entweder durch Vermittlung des <em>animus</em> leiden und dann auch mit ihm — denn wenn sie mit ihm zusammengewachsen ist, so kann man von keinem leidensunfähigen <em>animus</em> reden — oder aber, wenn sie nicht durch Vermittlung des <em>animus</em> leidet, dann leidet sie auch nicht mit ihm. Sie wird also auch nicht mit dem verwachsen sein, mit welchem sie nichts und der selbst nichts leidet.</p><p>Wenn nun aber weiter die Seele weder durch ihn noch mit ihm leidet, so wird sie auch nichts durch ihn wahrnehmen, denken und sich nicht durch ihn bewegen lassen. Aristoteles lässt nämlich auch die Empfindungen Leiden sein. Warum denn nicht? Ist ja doch auch das Empfinden ein Leiden, weil leiden empfinden ist. Ebenso ist dann auch das Denken ein Empfinden und die Bewegung ein Empfinden, und so alles ein Leiden. Wir finden aber, dass die Seele von alledem nichts gewahr wird, ohne dass es auch dem <em>animus</em> zugeschrieben wird, weil es sich durch ihn und mit ihm vollzieht. Folglich ist — gegen die Ansicht des Anaxagoras — der * animus* auch einer Vergesellschaftung fähig und er ist — gegen die Ansicht des Aristoteles — auch leidensfähig. Wofern man aber eine Scheidung zulässt, so dass Seele und <em>animus</em> der Substanz nach zwei verschiedene Dinge wären, so wird dem einen alles Leiden, Empfinden, Denken, sowie die Thätigkeit und die Bewegung zugehören, dem andern aber Nichtsthun, Ruhe, Stumpfsinn, überhaupt das Negative, und es wird entweder die Seele oder der <em>animus</em> ohne Beschäftigung sein. Wenn es aber feststeht, dass alle diese Dinge beiden zugeschrieben werden, so sind folglich beide eins, und Demokrit wird Recht behalten, wenn er den Unterschied beseitigt. Die Frage wird dann nur die sein: <em>wie</em> sind sie beide eins, durch Vermischung der beiden Substanzen oder indem sie sich als eins verhalten? Unsere Erklärung ist, der <em>animus</em> sei mit der Seele verwachsen, nicht in der Art wie ein zweites der Substanz nach, sondern wie eine Verrichtung der Substanz.</p>
      <h2>13</h2><p>Ausserdem ist noch übrig, zuzusehen, wo sich der Vorrang befindet, d. h. wer von ihnen die Vorstandschaft ausübt, und über wen, und das, bei dem sich der Vorrang findet, das wird auch die Masse der Substanz bilden. Dasjenige aber, worüber die Masse der Substanz die Führerschaft ausübt, das wird als blosse natürliche Verrichtung der Substanz angesehen werden müssen. Aber wer wollte nicht das Ganze der Seele zuerkennen, deren Name ja als Bezeichnung des gesamten Menschen förmlich anerkannt ist? So und so viel Seelen <em>animae</em> habe ich zu ernähren, sagt der Reiche, nicht <em>animi</em>; der Steuermann wünscht die Erhaltung der Seelen, die Seele versichert der Landmann bei seiner Arbeit, der Soldat in der Schlacht einzusetzen, ein, nicht den <em>animus</em>. Wessen Gefahren und Wünsche werden häufiger genannt, die der Seele oder die des <em>animus</em>? Was geben die Menschen nach der allgemeinen Ausdrucksweise beim Tode auf, die Seele oder den <em>animus</em>? Und sie selber zuletzt, die Philosophen und die Ärzte, sie schreiben, wenn sie gleich über den <em>animus</em> handeln wollen, doch einer wie der andere auf die Stirn ihres Werkes und an die Spitze des Gegenstandes <em>de anima</em>. Dieselben Ausdrücke bekommt man von Gott zu hören. Gott redet immer nur die Seele an, zur Seele spricht er; sie ruft er, auf ihn Acht zu haben. Sie selig zu machen kam Christus, sie droht er in der Hölle zu verderben, sie verbietet er zu hoch zu schätzen. Sie ist es, die er selbst einsetzt, der gute Hirt, für seine Schafe. Da hast du den Vorrang der Seele, da hast du auch die Einheit der Substanz in ihr und siehst, dass der <em>animus</em> nur ihr Werkzeug ist, nicht ihr Beschützer.</p>
      <h2>14</h2><p>In den anderen Beziehungen einheitlich und einfach, ist sie vollständig durch sich und kann ebensowenig von aussenher konstruiert werden, als sie aus sich teilbar ist; denn sie ist auch nicht auflösbar. Wäre sie konstruierbar und auflösbar, so wäre sie nicht mehr unsterblich. Daher ist sie, weil nicht sterblich, auch weder auflösbar noch teilbar. Denn Teilung ist Auflösung und Auflösung ist Sterben.</p><p>Aber dennoch teilt man sie in Teile, bald in zwei, wie Plato, bald in drei, wie Zeno, bald in fünf und sechs, wie Panätius, in sieben, wie Soranus, sogar in acht, wie Chrysippus, ja, sogar in neun, wie Apollophanes, aber auch in zwölf, wie einige Stoiker. In zwei fernere Teile wird sie ausserdem noch von Posidonius geteilt, der von zwei Titeln ausgeht, dem obersten, den man das <em>ἡγεμονικόν</em> [hēgemonikon] nennt, und dem vernünftigen, den man das <em>λογικόν</em> [logikon] nennt, und sie sodann in siebenzehn Teile zerlegt.</p><p>So teilen sich immer andere und andere Besonderheiten in die Seele. Dieselben dürfen aber nicht sowohl für Teile der Seele gehalten werden, als vielmehr für ihre Kräfte, Wirkungen und Thätigkeiten, wie Aristoteles hinsichtlich einiger auch wirklich geurteilt hat. Denn die Seelensubstanz hat keine Gliedmassen, sondern Anlagen; so z. B. zur Bewegung, zur Thätigkeit, zum Denken und was man sonst noch in dieser Hinsicht für Unterscheidungen trifft, wie die bekannten fünf Sinne, Gesicht, Gehör, Geschmack, Tastsinn und Geruch. Obwohl man allen diesen Vorrichtungen bestimmte Sitze am Körper angewiesen hat, so wird doch darum eine solche Einteilung der Seele nicht gleichbedeutend sein mit Abschnitten der Seele, da man ja nicht einmal den Leib in der Weise teilt, wie jene Leute die Seele teilen wollen. Es wird vielmehr durch die Vielheit der Glieder der eine Leib gebildet, so dass diese Teilung selber eher eine Zusammensetzung ist.</p><p>Betrachte das wunderbare Geschenk, das uns Archimedes gemacht hat, die Wasserorgel! Sie hat so viele Glieder, so viele Teile, Gelenke, Tonkanäle, Verstärkungen des Schalles, so viele Verbindungen der Tonarten, so viele Reihen von Pfeifen, und das alles bildet doch nur ein Instrument. Der Hauch, der dort durch den Druck des Wassers flötet, wird darum nicht in Teile zerteilt, weil er in Teilen angewendet wird, seiner Substanz nach ist er einer, den Verrichtungen nach hingegen geteilt. Dem Strato, Änesidemus und Heraklit lag dieses Beispiel nicht fern; denn auch sie halten an der Einheit der Seele fest, welche, durch den ganzen Körper verbreitet und überall sie selbst, durch die Sinne wie der Luftstrom im Rohr durch die Löcher in verschiedener Weise zum Vorschein kommt, nicht sowohl zerschnitten als vielmehr verteilt. Mit welchen Titeln man alle diese Dinge nun benennen, in welche Einteilungen man sie festbannen und durch welche Grenzlinien am Körper man sie abgrenzen soll, das mögen die Ärzte mit den Philosophen ausfechten; für uns werden ein paar Worte genügen.</p>
      <h2>15</h2><p>Zunächst die Frage, ob es in der Seele eine gewisse höchste Region gibt, welche die vitale und der Sitz des Denkens ist, das sogenannte Hegemonikon oder das Oberste; denn wenn dieses in Abrede gestellt wird, so ist es um die ganze Seele geschehen. Diejenigen, welche dieses Oberste leugnen, haben zuvor die Seele selbst schon für nichts erklärt. Ein gewisser Dikäarchus aus Messenien, unter den Ärzten aber Andreas und Asklepiades, haben das Oberste dadurch beseitigt, dass sie die Sinne, für welche eben ein Oberstes behauptet wird, in den <em>animus</em> selbst verlegen. Asklepiades reitet auch auf dem Scheinbeweise herum, dass viele Tiere noch geraume Zeit leben und selbst dann noch empfinden, wenn man sie der Teile beraubt, worin nach der gewöhnlichsten Meinung das Oberste seinen Sitz hat, wie z. B. die Fliegen, Wespen und Heuschrecken, wenn man ihnen die Köpfe abschneidet, die Ziegen, Schildkröten und Aale, wenn man ihnen die Herzen herauszieht. Daher gebe es gar kein Oberstes; denn wenn es ein solches gebe, so würde die Lebenskraft der Seele mit ihrem Sitz verloren gehen und nicht fortdauern.</p><p>Allein gegen den Dikäarchus stehen mehrere, sowohl Philosophen, wie Plato, Strato, Epikur, Demokrit, Empedokles, Sokrates, Aristoteles, als auch Ärzte gegen den Andreas und Asklepiades, nämlich Herophilus, Erasistratus, Diokles, Hippokrates und Soranus selbst, endlich auch wir Christen, die wir zahlreicher sind als sie alle, wir werden in betreff beider Punkte von Gott dahin belehrt, dass es in der Seele ein Oberstes gebe, und dass dieses zweitens in einen bestimmten Ort des Körpers gebunden sei. Denn wenn wir lesen, dass Gott der Erforscher und Beobachter des Herzens sei, wenn sein Prophet daran erprobt wird, dass er der Geheimnisse des Herzens überführt, wenn Gott selbst den Gedanken des Herzens bei seinem Volke zuvorkommt: „Warum denkt ihr in Euren Herzen Böses?”, wenn David sagt: „Erschaffe in mir ein reines Herz, o Gott!” und Paulus, „dass man mit dem Herzen glaube zur Gerechtigkeit”, und Johannes, „dass ein jeder von seinem eigenen Herzen zurechtgewiessen werde,” wenn schliesslich einer, „der eine Frau ansieht, um ihrer zu begehren, in seinem Herzen bereits die Ehe gebrochen hat,” — dann leuchtet zugleich beides ein, erstens, dass es in der Seele ein Prinzipales gebe, an welches die göttliche Absicht sich wendet, d. h. ein Empfindungs- und Lebensvermögen — denn was empfindet, das ist auch lebendig, — und dass es zweitens in der Schatzkammer des Körpers enthalten sei, auf welche Gott hinblickt.</p><p>Daher wird man nicht mit Heraklit annehmen, jenes Prinzipale werde von aussen her bewegt, noch mit Moschion, es sei durch den ganzen Körper verbreitet, noch mit Plato, dass es im Kopfe eingeschlossen sei, noch mit Xenokrates, es habe vielmehr im Scheitel seinen Sitz, noch mit Hippokrates, es ruhe im Gehirn, auch nicht in der Basis des Gehirns, wie Herophilus will, noch in den Häutchen desselben, wie Strato und Erasistratus sagten, noch in der Mitte zwischen den beiden Augenbrauen, wie der Physiker Strato will, noch im Brustkasten im ganzen, wie Epikur, sondern dass es das sei, was schon die Ägypter und die vermeintlichen Erklärer der Orakelsprüche als solches bezeichneten, sowie auch der bekannte Vers des Orpheus oder Empedokles: „Das das Herz umströmende Blut bildet beim Menschen die geistige Wahrnehmung.”Auch Protagoras, Apollodorus und Chrysippus denken so. Sogar von solchen Leuten zurückgewiesen, weiss Asklepiades nicht, wo er mit seinen Ziegen ohne Herzen, die doch blöken, bleiben soll; er jagt seine Mücken, die ohne Kopf fliegen, fort, und alle, welche über die Einrichtung der menschlichen Seele aus der Beschaffenheit der Tiere Schlüsse ziehen wollen, sind instand gesetzt einzusehen, dass sie selbst es sind, die leben, ohne Herz und Hirn zu haben.</p>
      <h2>16</h2><p>Durch die Zweiteilung der Seele, welche Plato vornimmt, in einen vernünftigen und einen unvernünftigen Teil wird die Glaubenslehre gleichfalls berührt. Dieser Lehre schenken auch wir Beifall, aber nicht in der Weise, dass beides für natürlich gehalten werden dürfte. Denn für naturentsprechend ist nur das Rationale zu halten, weil es der Seele von Anfang an eingeschaffen worden ist durch ihren vernünftigen Urheber. Denn nichts, was Gott durch sein Geheiss hervorgerufen, ist unvernünftig, geschweige denn das, was er im eigentlichen Sinne durch seinen Hauch hat ausgehen lassen.</p><p>Das Irrationale aber ist für das Spätere zu halten, weil es durch den Antrieb der Schlange hinzugetreten ist, eben jener Fehltritt der Übertretung selber, sich sodann in der Seele festgesetzt hat und mit ihr herangewachsen ist, ähnlich wie eine natürliche Eigentümlichkeit; denn es kam gleich bei den ersten Anfängen der Natur hinzu. Wenn aber derselbe Plato das Rationale als das Alleinige bezeichnet, weil es sich an der Seele Gottes selbst vorfinde, so würde, wenn wir auch das Irrationale der Natur, die unsere Seele von Gott empfangen hat, beilegen wollten, das Irrationale als etwas Natürliches ebenso von Gott herrühren müssen; denn Gott ist der Urheber der Natur. Nun kommt aber die Sünde aus der Eingebung des Teufels, alles Unvernünftige ist Sünde, folglich stammt das Unvernünftige vom Teufel, der auch der Urheber der Sünde ist, welche Gott fremd ist, wie ihm auch das Unvernünftige fremd ist. Mithin ist die Verschiedenheit dieser Dinge eine Folge der Verschiedenheit ihrer Urheber.</p><p>Wenn Plato sodann, indem er das Rationale für Gott allein in Anspruch nimmt, aus dem Irrationalen wiederum zwei Unterabteilungen macht, die Regungen des Unwillens, das sog. <em>θυμικόν</em> [thymikon], und des Begehrens, das sog. <em>ἐπιθυμητικόν</em> [epithymētikon], so zwar, dass ersteres uns gemein sei mit den Löwen, letzteres aber mit den Mücken, das Rationale hingegen mit Gott, so finde ich, dass man auf diesen Punkt genauer eingehen müsse um dessentwillen, was wir bei Christus wahrnehmen. Denn siehe, diese gesamte Dreiheit findet sich auch beim Herrn, sowohl das Rationale, kraft dessen er lehrt, Reden hält und den Heilsweg bereitet, als auch das zornmütige Element, kraft dessen er über die Schriftgelehrten und Pharisäer schilt, sowie auch das Strebungsvermögen, kraft dessen ihn mit seinen Jüngern das Pascha zu essen verlangt. Mithin darf man nicht glauben, das Zornmütige und das Strebungsvermögen gehe bei uns Menschen immer vom irrationalen Prinzip aus, da wir versichert sind, dass es beim Herrn einen rationalen Verlauf genommen habe. Gott wird in vernünftiger Weise denen zürnen, welchen er zürnen muss, und in vernünftiger Weise Dinge begehren, die seiner würdig sind. Er wird einerseits dem Bösen zürnen, andererseits dem Guten die Seligkeit wünschen.</p><p>Auch der Apostel gestattet uns ein Begehren. „Wenn einer den Episkopat begehrt, so begehrt er ein gutes Werk.” Wenn er ihn ein gutes Werk nennt, so gibt er zu erkennen, dass das Begehren ein vernünftiges sei. Warum denn auch nicht? er nahm ihn ja selbst über sich. Auch sagt er: „O, dass die, welche Euch verführen, abgeschnitten würden.” Der Unwille, welcher aus der Liebe zur Ordnung stammt, ist vernünftig. Hingegen, wenn er sagt: „Auch wir waren einst von Natur Kinder des Zornes,” so brandmarkt er damit den unvernünftigen Zorn und Unwillen, weil dieser nicht aus der Natur stammt, welche von Gott herrührt, sondern aus derjenigen, welche der Teufel herbeigeführt hat, der in seiner Sphäre auch den Namen „Herr” erhält. „Ihr könnt nicht zweien Herren dienen.” Er wird sogar Vater genannt: „Ihr stammt von Eurem Vater, dem Teufel.” Man stehe nicht an, die andere, und zwar die verschlechterte Natur demjenigen als Eigentum zuzuschreiben, von dem geschrieben steht, dass er den Samen des Windhafers darüber säe und bei nächtlicher Weile die Aussaat des Weizens verfälsche.</p>
      <h2>17</h2><p>Auch die Frage nach den bekannten fünf Sinnen, welche wir mit den Anfangsgründen der Wissenschaft kennen lernen, gehört hierher, weil die Häretiker auch sie zu Hilfe nehmen, Gesicht, Gehör, Geruch, Geschmack und Gefühl.</p><p>Die Akademiker verwerfen ihre Zulässigkeit in schroffer Weise, nach einigen Angaben auch Heraklit, Diokles und Empedokles. Plato nennt im Timäus die Sinneswahrnehmung eine unvernünftige und mit Einbildungen zusammenhängende. So wird der Sehkraft vorgeworfen, sie täusche, weil sie das Ruder im Wasser gekrümmt und gebrochen zeigt, obwohl man weiss, dass es ganz ist, weil sie einen vierkantigen Thurm von fern rund erscheinen lässt, weil sie einen überall gleich breiten Säulengang am Ende hässlich verengert, weil sie den Himmel, der so hoch über uns ist, mit dem Meere zusammenfliessen lässt. Ebenso macht sich das Gehör des Betrugs schuldig. Meinen wir, es dröhne vom Himmel her, so ist es ein Wagen; fängt der Donner an zu rollen, so halten wir es für das Getöse eines Wagens. Auch Geruch und Geschmack werden in der Art angeklagt. Denn dieselbe Salbe, derselbe Wein erscheint bei einem spätern Gebrauche geringer. Auch der Tastsinn wird getadelt. Denn die Hände halten das Getäfel des Fussbodens für rauh, die Füsse hingegen für glatt; beim Baden kündigt sich dasselbe Badewasser zuerst als sehr heiss, sodann als mässig warm an. Folglich, sagt man, werden wir durch die Sinne getäuscht, wenn wir unsere Meinungen ändern. Etwas gemässigter verfahren die Stoiker; sie beschuldigen nicht jede Sinnesempfindung der Lüge und nicht immer. Die Epikuräer dagegen verteidigen mit zu viel Hartnäckigkeit deren Gleichheit und Beständigkeit bei allen, aber nach einer andern Methode. Denn nicht der Sinn sei es, der lüge, sondern die Vorstellung. Der Sinn verhalte sich nur leidend, nicht vorstellend; die Seele aber stelle vor. Sie haben eine Trennung der Wahrnehmung vom Sinne und des Sinnes von der Seele vorgenommen. Woher denn die Wahrnehmung, wenn nicht vom Sinne? Wenn zum Beispiel das Gesicht den Turm nicht als etwas Rundes wahrnähme, so würde auch keine Wahrnehmung von der Rundheit vorhanden sein. Und woher die Sinneswahrnehmung, wenn nicht von der Seele? Darum wird ein der Seele entbehrender Körper auch ohne Sinneswahrnehmung sein. Also rührt auch die Sinneswahrnehmung von der Seele und die Vorstellung vom Sinne her, und das Ganze ist die Seele.</p><p>Übrigens wird die beste Proposition die sein, dass es immerhin etwas gebe, was bewirkt, dass die Sinne andere Meldungen machen, als es der Sache entspricht. Wenn nun Meldungen, die der Sache nicht entsprechen, gemacht werden können, warum sollte nicht durch dasselbe Medium etwas gemeldet werden können, was sich nicht in den Sinnen vorfindet, sondern in den Verhältnissen, welche unter deren Namen auftreten? Und so wird man sie denn also untersuchen dürfen. Gesetzt den Fall, das Ruder erscheine im Wasser gebogen oder gebrochen, so ist das Wasser schuld daran; denn ausserhalb des Wassers ist das Ruder für die Sehkraft gerade. Durch die Zartheit der genannten Substanz aber, kraft deren sie durch die Beleuchtung zu einem Spiegel wird, je nachdem man sie schlägt oder bewegt, wird auch das Bild in zitternde Bewegung gesetzt und die gerade Linie abgelenkt. Täuscht uns die Erscheinung des Turmes, so wird dies offenbar durch die Entfernung bewirkt. Die Gleichmässigkeit der uns umgebenden Luft überkleidet nämlich die Kanten mit gleichem Lichte und verwischt die Linien. So wird auch der an sich gleichbreite Säulengang am Ende verengert, indem die in einem geschlossenen Raume beengte Sehkraft durch dasselbe Mittel eine Schwächung erleidet, wodurch sie verstärkt wird. Der Himmel tritt mit dem Meere da in Vereinigung, wo die Sehkraft aufhört, welche, so lange sie besteht, eine Unterscheidung verstattet. Das Gehör aber, wodurch anders wird es getäuscht, als durch die Ähnlichkeit der Töne? Wenn die Salbe nachher weniger duftet, der Wein geringer schmeckt und das Bad weniger heiss ist, so ist fast bei allen diesen Dingen die erste Kraft die Hauptkraft. Im Urteil über Rauhheit und Glätte weichen Hände und Füsse selbstverständlich voneinander ab, weil jenes zarte, dieses schwielige Gliedmassen sind. Auf diese Weise wird jede Sinnentäuschung ihre Ursache haben.</p><p>Wenn nun die Ursachen es sind, welche die Sinne und durch die Sinne die Vorstellung täuschen, so wird man die Täuschung nicht mehr in die Sinne setzen dürfen, denn sie folgen den Ursachen, noch auch in die Vorstellungen, weil sie sich ja nach den den Ursachen folgenden Sinnen richten. Die Verrückten sehen eine Person für eine andere an, Orestes seine Schwester für seine Mutter, Ajax das Herdenvieh für den Odysseus, Athamas und Agave ihre Kinder für wilde Tiere. Wird man diesen Irrtum den Augen zur Last legen und nicht lieber den Furien? Die, welche wegen zu reichlichen Vorhandenseins von Galle an der Gelbsucht leiden, halten alles für bitter. Willst du nun dem Geschmacksinn diese Abweichung zur Last legen oder der Krankheit? So werden sämtliche Sinne aufgehoben und getäuscht — aber nur zeitweise, — um die Täuschung nicht zu ihrem Eigentum werden zu lassen.</p><p>Nicht einmal den Ursachen selbst darf man den Vorwurf des Betrugs machen. Denn wenn solche Erscheinungen ihren guten Grund haben, so verdienen sie nicht für Betrug angesehen zu werden. Was sich so zutragen <em>muss</em>, das ist kein Betrug. Wenn so also sogar die Ursachen von jedem Vorwurfe freigesprochen werden müssen, dann die Sinne noch vielmehr, da ihnen ja erst die Ursachen frei vorangehen. Wahrheit, Zuverlässigkeit und Vollständigkeit sollte deshalb den Sinnen gerade erst recht zugesprochen werden, weil sie keine andere Meldung machen, als wie die Ursache es ihnen vorschreibt, welche bewirkt, dass die Sinne andere Meldungen machen, als es der Sache entspricht.</p><p>Was also ist dein Beginnen, zudringliche Akademie? Du stürzest alle Lebensverhältnisse über den Haufen, du bringst die ganze Ordnung der Natur in Verwirrung, du bezichtigst die Vorsehung Gottes selbst der Blindheit, der uns an den Sinnen alsdann nur trügerische und lügnerische Führer zur Erkenntnis, Ausbildung, Verteilung und Geniessung seiner Werke verliehen hätte. Wird uns nicht durch die Sinne die ganze Schöpfung vermittelt? Tritt nicht durch sie auch noch die zweite Ausstattung zu den irdischen Dingen hinzu? All diese Künste, Erfindungen, geistigen Bestrebungen, Geschäfte, Pflichten, Handelsverbindungen und Heilmittel, Rat, Trost, Lebensunterhalt, Putz und Schmuck? Diese Dinge haben dem Leben erst Geschmack und Würze gegeben, indem der Mensch durch diese Sinne als das einzige vernunftbegabte unter allen lebenden Wesen dasteht, das zum Erkennen und Wissen befähigt ist und sogar zur Aufnahme in die Akademie.</p><p>Plato freilich leugnet, um nicht ein den Sinnen günstiges Zeugnis unterschreiben zu müssen, im Phaedon in der Person des Sokrates aus diesem Grunde, sich selbst erkennen zu können, wie die Inschrift zu Delphi ermahnt. Im Theaetet spricht er sich das Wissen und Empfinden ab und im Phaedon verschiebt er das Aussprechen seiner Ansicht als einer nachgeborenen Tochter der Wahrheit bis nach seinem Tode, philosophiert aber trotzdem, obwohl er noch nicht tot ist.</p><p>Uns aber ist es unter keiner Bedingung gestattet, die Zuverlässigkeit der Sinne in Zweifel zu ziehen, damit nicht auch bei der Person Christi an ihrer Zuverlässigkeit gezweifelt werde und es nicht etwa heisse, er habe sich getäuscht, als er vorhersah, dass Satan vom Himmel gestürzt werde, oder er habe fälschlich die Stimme des Vaters gehört, welche Zeugnis von ihm ablegte, oder er sei betrogen worden, als er die Schwiegermutter des Petrus berührte, oder er habe einen andern Duft für den Duft der Salbe genommen, welche er sich für seine Beerdigung gefallen liess, und einen andern Geschmack für den des Weines, welchen er zum Andenken an sein Blut konsekrierte. Denn das ist die Weise, wonach ihn Marcion lieber für ein Phantasma halten wollte und dessen ganzen Leib für Wirklichkeit zu halten verschmäht hat. Nicht einmal mit den Aposteln hat sich Christi natürliche Beschaffenheit einen Scherz erlaubt. Zuverlässig war sein Anblick und sein Reden auf dem Berge, zuverlässig war auf der Hochzeit in Galiläa der Geschmack des Weines, obwohl er vorher Wasser gewesen war, zuverlässig war auch die Betastung durch den von da an gläubigen Thomas. Lies doch nur die Beteuerung des Johannes: „Was wir gesehen, was wir gehört, was wir mit unseren Augen gesehen und was unsere Hände berührt haben vom Worte des Lebens.” Diese Beteuerung wäre jedenfalls falsch, wenn die Wahrnehmungen der Augen, Ohren und Hände von Natur aus trügerisch sind.</p>
      <h2>18</h2><p>Ich wende mich nun zu dem intellektuellen Teile der Seele, wie ihn Plato vom Körperlichen getrennt den Häretikern angepriesen hat, nachdem er kurz vor seinem Tode noch Kenntnis davon erlangt hatte. Er sagt nämlich im Phaedon: „Was sodann die Erlangung der Weisheit selbst angeht, so frage ich, ist der Körper ein Hindernis derselben oder nicht, wenn ihn jemand beim Untersuchen zu Hilfe nimmt? Ich meine etwa so: Haben Gesicht und Gehör eine gewisse Realität für den Menschen oder nicht? Oder wiederholen es uns nicht sogar die Dichter, dass wir nicht mit Gewissheit sehen und hören?” — Er dachte hierbei nämlich an den Vers des Komikers Epicharmus: „Der Geist sieht, der Geist hört; alles Übrige ist stumm und taub.” Darum bemerkt er wiederum: „Derjenige gelange zu einer höhern Erkenntnis, der nur mit dem Geiste erkenne und weder dem Sehvermögen den Vorzug gebe, noch sonst irgend einen Sinn zum Geiste hinzuziehe, sondern indem er das reine Nachdenken an und für sich anwende, um jegliches reine Sein zu erfassen, sich so viel wie möglich losmache von den Augen und Ohren, ja, ich möchte sagen, vom ganzen Körper, als welcher in Verwirrung setzt und der Seele nicht gestattet, Wahrheit und Einsicht zu gewinnen, wenn er dabei ist.”</p><p>Wir sehen also, wie gegen die körperlichen Sinne eine andere, angeblich viel bessere Gabe und Anlage der Seele vorgeschoben wird, nämlich die Seelenkräfte, welche die Erkenntnis der Wahrheiten vermitteln, deren Gegenstände nicht vor uns liegen, nicht den körperlichen Sinnen unterliegen, sondern sich weitab vom gewöhnlichen Wissen im Verborgenen, in höheren Sphären, bei Gott selbst befinden. Plato lehrt nämlich, es gebe gewisse unsichtbare, unkörperliche, überweltliche, göttliche und ewige Wesenheiten, die er Ideen nennt, auf lateinisch <em>formae</em>, die Urbilder und Ursachen dieser natürlichen, greifbaren und den körperlichen Sinnen unterworfenen Dinge; sie seien die Realitäten, letztere aber nur die Abbilder davon.</p><p>Treten da nicht schon die Keime des Gnostizismus und Valentinianismus zu Tage? Von daher holen sie so begierig den Unterschied zwischen körperlichen Sinnen und geistigen Kräften her, den sie auch in der Parabel von den zehn Jungfrauen wiederfinden. Die fünf thörichten nämlich sollen die körperlichen Sinne vorstellen, thöricht, weil sie sich leicht täuschen lassen; die klugen aber sollen das Merkmal der intellektuellen Kräfte an sich tragen, weil sie an jene geheimnisvolle, höhere, im Pleroma befindliche Wirklichkeit, die Geheimnisse der häretischen Ideen, hinanreichen, nämlich ihre Äonen und Genealogien. Daher statuieren sie auch einen Unterschied in den Wahrnehmungen für die geistigen Menschen einerseits, die von dem bei ihnen sogenannten geistigen Samen herkommen, und für die bloss sinnlichen andererseits, die von tierischem Samen sind, weil er das Geistige durchaus nicht fasst. Jenem gehöre das Unsichtbare, diesem hingegen das Sichtbare, Niedere und Zeitliche an, was, in blossen Bildern bestehend, durch die Sinneswahrnehmung erfasst wird.</p><p>Das also sind die Gründe, warum wir zuvor den Nachweis geliefert haben, das der Animus nichts anderes sei als eine Beigabe und Ausrüstung der Seele, dass ihr Odem nichts weiter sei, als was sie selbst ist durch den Hauch, und dass das übrige, was Gott oder auch der Teufel hinterher dazugethan hat, für blossen Zuwachs zu halten sei. Auch jetzt geben wir in bezug auf den Unterschied des Sinnlichen und Intellektuellen nichts weiter zu, als die Verschiedenheit der Objekte, der körperlichen und der geistigen, der sichtbaren und der unsichtbaren, der offenbaren und der geheimen, dass die einen der Sinneswahrnehmung, die anderen dem Intellekt angehören, während doch sowohl jene als diese für abhängig von der Seele angesehen werden, welche das Körperliche durch den Körper sinnlich wahrnimmt, wie sie vermittelst des Animus das Unkörperliche erkennt, unbeschadet dessen, dass sie beim Erkennen auch fühlt.</p><p>Denn ist nicht auch das Fühlen ein Erkennen und das Erkennen ein Fühlen? Oder was sollte die Sinneswahrnehmung denn sein, wenn nicht ein Erkennen des Gegenstandes, der sinnlich wahrgenommen wird? Was die Erkenntnis, wenn nicht ein Wahrnehmen der Sache, die erkannt wird? Woher sind denn jene Qualen, welche die Einfalt martern und die Wahrheit unsicher machen? Wer wird mir einen Sinn geben, der nicht erkennt, was er wahrnimmt, oder eine Erkenntnis, die nicht wahrnimmt, was sie erkennt, und beweisen, dass das eine ohne das andere Macht habe? Wenn das Körperliche wahrgenommen, das Unkörperliche aber erkannt wird, dann sind eben die Objekte nur ihrer Art nach verschieden, nicht aber der Sitz des Sinnes und der Sitz der Erkenntnis, d. h. Seele und Animus.</p><p>Schliesslich, von wem wird denn das Körperliche wahrgenommen? Wenn von der Seele, dann ist sie folglich auch schon sinnlich und nicht schlechthin intellektuell; denn indem sie erkennt, nimmt sie auch sinnlich wahr, weil sie, wenn sie nicht wahrnimmt, auch nicht erkennt. Wenn die Seele nun aber das Körperliche wahrnimmt, dann ist auch der Intellekt eine nicht bloss sinnliche Potenz; denn indem er wahrnimmt, erkennt er auch, weil er, wenn er nicht erkennt, auch nicht wahrnimmt.</p><p>Sodann, wer ist es, der das Unkörperliche erkennt? Ist es der Animus, wo bleibt die Seele? ist es die Seele, wo bleibt der Animus? Was von einander getrennt ist, das muss auch dann von einander gesondert bleiben, wenn es seine Obliegenheiten verrichtet. Man wird sich nun zwar vorstellen, Seele und Animus seien von einander getrennt, dann nämlich, wenn wir nicht wissen, dass wir etwas gesehen oder gehört haben, weil der Animus dann an einem andern Orte gewesen ist. Dann werde ich behaupten, nein, vielmehr die Seele selbst hat nichts gesehen oder gehört, weil sie anderswo war mit ihrer Kraft, d. i. mit dem Animus. Wird der Mensch blödsinnig, so wird die Seele blödsinnig; sie ist nicht etwa auf Reisen, sondern mit dem Animus leidend.</p><p>Im übrigen ist die Seele das erste, Ausschlag gebende. Womit ist das zu beweisen? Damit, dass, wenn die Seele den Menschen verlassen hat, auch kein Animus mehr in ihm zu finden ist. Mithin folgt letzterer ihr überall nach, da er nicht einmal beim letzten Ende ohne sie zurückbleibt. Da er ihr folgt und zu ihr gehört, so gehört der Intellekt der Seele an; denn der Animus, dem der Intellekt zugesprochen wird, folgt ihr. Mag dann auch der Intellekt mehr gelten als die sinnliche Wahrnehmung und ein besserer Erforscher der Geheimnisse sein, wofern er nur seinerseits nichts weiter ist, als ein der Seele eigenes Vermögen, so gut wie die Sinneswahrnehmung auch.</p><p>Mir ist an der Sache nichts gelegen, als insofern der Intellekt aus dem Grunde über die Sinneswahrnehmung gestellt wird, damit sein Abstand von ihr um so grösser erscheine und ihm ein höherer Rang beigelegt werde. In diesem Falle müsste ich mit der Verschiedenheit auch seinen höhern Rang abweisen, indem ich sonst bis zur Annahme eines Gottes höherer Art gelangen würde. In betreff der Lehre von Gott jedoch führen wir den Kampf mit den Häretikern auf besonderem Gebiete. Für jetzt ist die Seele unser Thema und davon die Rede, dass man den Intellekt nicht listigerweise höher stellen darf. Denn wenn auch die Dinge, welche mittels der Erkenntnis erfasst werden, als geistige höher stehen, als die sinnlich wahrnehmbaren körperlichen, so ist das nur eine Höherstellung der Objekte, der erhabenen im Vergleich zu den niederen, nicht der Sinne im Vergleich zum Intellekt.</p><p>Warum sollte er denn den Sinnen vorgezogen werden, da letztere ihn zur Erkenntnis der Wirklichkeit vorbereiten? Denn wenn die Wirklichkeit durch die Bilder erfasst, d. h. das Unsichtbare mit Hilfe des Sichtbaren erkannt wird, eine Wahrheit, die uns der Apostel in den Worten vorlegt: „Das Unsichtbare an ihm wird von Erschaffung der Welt an aus seinen Werken erkennbar wahrgenommen”, und Plato den Häretikern in den Worten: „Was erscheint, ist Bild der verborgenen Dinge, und diese Welt muss durchaus das Abbild irgend einer andern sein”, — dann ist ja gerade ersichtlich, dass der Intellekt die Sinne zu Führern, zu Bürgen und zum ersten Fundamente nimmt und man ohne sie zur Wahrheit nicht gelangen kann. Wie könnte er also mehr sein als das, wodurch er existiert, dessen er bedarf, dem er alles zu verdanken hat, was er erreicht? So gelangt man zu folgenden beiden Schlussfolgerungen: erstens der Intellekt ist nicht höher zu stellen als die Sinne; denn jedes Ding ist geringer als das, wodurch es besteht; zweitens er ist nicht von den Sinnen zu trennen; denn jedes Ding steht in Verbindung mit dem, wodurch es existiert.</p>
      <h2>19</h2><p>Wir dürfen auch nicht einmal die passieren lassen, welche der Seele, wenn auch nur für kurze Zeit den Intellekt absprechen. Damit machen sie sich nämlich den Weg frei, um ihn später eintreten zu lassen, sowie auch den Animus, von welchem der Intellekt ausgehen soll. Sie lehren, in der Kindheit werde der Mensch bloss von der Lebensseele erhalten, durch welche er das Leben schlechthin habe, ohne zugleich zu denken, weil ja nicht alles denke, was lebt. So leben z. B. auch die Pflanzen, ohne zu denken, nach Aristoteles und der Lehre aller derer, welche sonst etwa noch die animale Substanz über das ganze Weltall verteilt sein lassen, während sie nach unserer Lehre etwas dem Menschen allein eigentümliches ist, nicht sowohl darum, weil er ein Werk Gottes ist, was die übrigen Dinge auch sind, sondern weil er ein Hauch Gottes ist, was dieser Substanz allein zukommt, welche, wie wir behaupten, mit ihrer gesamten Ausrüstung versehen ins Dasein tritt.</p><p>Werden wir auf die Bäume hingewiesen, gut, so lassen wir uns diese Analogie gefallen; denn auch in ihnen steckt, wenn sie noch nicht einmal Bäumchen, sondern nur Reiser oder erst Schösslinge sind, schon ihre besondere Lebenskraft, sobald sie aus dem Boden herauskommen. Aber sie wird aus Rücksichten auf die Zeit noch zurückgehalten, erstarkt und wächst heran mit ihrem Stamme, so lange bis das reife Alter den Zustand vollständig herbeigeführt hat, worin die Natur wirken soll. Woher käme es sonst, dass sich alsbald an ihnen die Fruchtaugen bilden, die Blätter sich gestalten, die Knospen anschwellen, der Blütenschmuck hervortritt und die Fruchtsäfte sich sammeln, wenn nicht in jenen Schösslingen schon die ganze Eigenheit der Art schlummerte und in stückweiser Entwicklung heranreifte? Sie üben also ihr Denken von dem nämlichen Augenblick an aus, wo sie das Leben haben, sowohl ihr eigenartiges Denken als ihr eigenartiges Leben, und sind von ihrer Kindheit an sie selber.</p><p>Wie ich nämlich sehe, kennt auch der Weinstock, wenngleich er noch zart und unentwickelt ist, doch schon seine Aufgabe und strebt, sich an irgend etwas anzuhängen, worauf gestützt und worein verschlungen er wachsen will. Er wird sogar die Kunst des Landmannes nicht abwarten, sondern ohne Pfähle und Stützen, wenn er nur irgend einen Gegenstand erreichen kann, seine Verbindungen schliessen und ihn um so heftiger umarmen, wenn er es nach seinem eigenen Willen und nicht nach deiner Leitung thut. Er eilt, sich Sicherheit zu verschaffen.</p><p>Ich sehe, wie auch schon das kleinste Epheu sofort nach der Höhe strebt und, ohne dass es ihm jemand vormacht, sich anhängt, weil es lieber an den Wänden hängend einen verschlungenen Wald bildet, als sich auf der Erde von frevlem Mutwillen zertreten lassen will. Dagegen gibt es andere Gewächse, welchen an der Wand nicht wohl ist, sondern die beim Wachsen ihre Richtung davon hinwegnehmen und zurückweichen. Daraus mag man ersehen, dass ihre Zweige eine andere Richtung zu nehmen bestimmt sind, und das Leben des Baumes aus seiner Flucht von der Wand hinweg erkennen. Er ist zufrieden mit seiner Schiefheit, an die er sich von seinem ersten Anfang an schon als höchst vorsichtiger Schössling gewöhnt hat, aus Furcht vor gänzlichem Untergang.</p><p>Warum sollte ich diese Erscheinungen nicht als den Verstand und das Wissen der Bäume geltend machen? Mögen sie leben, wie die Philosophen wollen, und denken, wie die Philosophen nicht wollen. Besitzt der Baum in seiner Kindheit sein Denkvermögen schon, dann aber noch viel mehr der Mensch, dessen Seele gleich einem jungen Schössling aus Adam als der Mutterpflanze als Setzling heruntergeleitet und, den Gebärhöhlungen des Weibes anvertraut, mit ihrer gesamten Ausrüstung, sowohl mit Intellekt als sinnlichem Wahrnehmungsvermögen versehen, heranwächst. Ich will ein Lügner sein, wenn der Säugling, sobald er das Dasein mit Weinen begrüsst, nicht eben dadurch sofort bezeugt hat, dass er fühle und erkenne, er sei geboren, und damit sofort sämtliche Sinnesthätigkeiten zu gleicher Zeit beginnt, das Sehen durch das Licht, das Hören beim Schall, das Schmecken bei dargebotener Flüssigkeit, das Riechen mittels der Luft, das Fühlen auf der Erde. So wird er durch die ersten Eindrücke der Sinne und das erste Anklopfen der Erkenntnisse zu jenen ersten Lauten gezwungen.</p><p>Mehr noch wäre es, wenn einige sein Weinen als Folge der Voraussicht eines thränenreichen Lebens und Vorboten der Widerwärtigkeiten auslegen; danach wäre seine Stimme sogar für vorherwissend zu halten, nicht für bloss erkennend. Sodann erkennt er seine Mutter an ihrem Hauche, findet seine Amme heraus durch ihren Hauch, erkennt das Kindermädchen an dessen Hauch. Denn er weist die Brust einer Fremden ab, ein ungewohntes Bett verschmäht er und will zu niemandem gehen, als zu wem er kennt. Woher hat er das Urteil über Ungewohntes und Gewohntes, wenn er nicht fühlt? Woher kommt es, dass ihm etwas zuwider ist oder gefällt, wenn er nichts erkennt? Es wäre wirklich höchst wunderbar, wenn die Kindheit von Natur aus lebensvoll wäre und doch keinen Geist hätte, von Natur voll Liebe und doch ohne Erkenntnis. Christus, der aus dem Munde der Säuglinge und Unmündigen Lob erfuhr, hat weder das Kindes-noch das Säuglingsalter als blödsinnig bezeichnet. War doch die eine dieser beiden Altersstufen, ihm mit Zuruf entgegenkommend, imstande, ein Zeugnis für ihn darzubringen, die andere hat, für ihn gemordet, jedenfalls die Gewalt gefühlt.</p>
      <h2>20</h2><p>Hier ist also die Stelle, den Schluss zu ziehen, alles, was der Seele natürlich ist, wohne ihr selbst als konstituierender Bestandteil inne, schreite mit ihr fort und wachse von dem Augenblick an, wo sie zu sein anfängt. So lehrt auch Seneca, der häufig auf unserer Seite steht: „Anerschaffen sind uns die Keime zu allen Künsten und Altersstufen, und Gott, der verborgene Lehrmeister, lässt die Geisteskräfte hervorgehen”, nämlich aus den anerschaffenen und das Kindesalter hindurch noch versteckt gebliebenen Keimen, welche auch die des Intellekts sind. Denn aus diesem gehen die Geisteskräfte hervor.</p><p>Auch die Samen der Früchte sind ja von gleicher Art und Gestalt, im Verlauf aber treten Verschiedenheiten ein. Die einen entwickeln sich gleichmässig fort, andere veredeln sich sogar, noch andere endlich entarten, je nach der Beschaffenheit der Witterung und des Bodens, je nach dem Maasse der Mühe und Sorgfalt, je nach der Gunst der Jahreszeiten, je nachdem es die Unfälle mit sich bringen. — In derselben Weise wird auch die Seele im Keime eingestaltig, in der Entwicklung mehrgestaltig sein dürfen.</p><p>Denn auch bei ihr kommt auf den Ort etwas an. Zu Theben kommen, wie berichtet wird, stumpfsinnige und dumme Menschen zur Welt, zu Athen seien die Leute flink und gewandt im Denken und Sprechen; daselbst, in Colyttus, lernen die Kinder immer noch einen Monat früher sprechen, weil frühreifer Zunge. Plato behauptet im Timäus, Minerva habe, als sie mit Gründung der Stadt umging, auf nichts mehr gesehen, als auf die Beschaffenheit des Ortes, welcher dergleichen Talente hervorzubringen versprochen habe. Deshalb schreibt er selbst auch in der Schrift über die Gesetze dem Megillus und Klinias vor, auf Auswahl einer Stelle für die zu gründende Stadt bedacht zu sein. Empedokles verlegt die Ursachen der feineren oder gröberen Geistesanlagen in die Beschaffenheit des Blutes; die Vollendung und den Fortschritt aber leitet er vom Unterricht und der Anleitung her. Eine bekannte Sache sind die Volkseigentümlichkeiten. Die Phrygier werden von den Komikern als furchtsam verspottet, Sallust stichelt auf die Mauren als eitle Leute und auf die Dalmatier als wild und unbändig; die Kreter brandmarkt sogar der Apostel als verlogen.</p><p>Vielleicht thut auch der Körper und seine Konstitution noch etwas hinzu. Korpulenz ist ein Hindernis des Denkens, Magerkeit befördert dasselbe, Lähmung macht den Geist zerstreut, Zehrung hält ihn zusammen. Um wie viel mehr noch wird das für bloss zufällig gehalten, was, abgesehen von der Leibesbeschaffenheit und Gesundheit, den Geist schärft oder abstumpft. Es schärft ihn Unterricht, Anleitung, Kunst, Erfahrung, Beschäftigung und Studium, es stumpfen ihn ab Unwissenheit, Trägheit, Wollüste, Mangel an Übung, Müssiggang, Laster, ausserdem auch andere Einflüsse, wenn deren noch welche obwalten. Es walten aber deren noch ob, und zwar nach unserer Lehre: Gott und sein Feind, der Teufel, nach der gemeinen Meinung hingegen: das Fatum und die Notwendigkeit der Vorsehung sowie die Willkür des Glücksspiels. Auch die Philosophen unterscheiden diese Dinge, und wir haben uns ebenfalls fest vorgenommen, darüber vom Standpunkt der christlichen Lehre unter besonderem Titel zu handeln.</p><p>Es liegt am Tage, wie zahlreich die Einflüsse sind, wodurch die von Natur einfache Seele in so verschiedene Verfassung versetzt wird, so dass sie gemeinhin in die Natur verlegt werden, da sie doch keine verschiedenen Arten, sondern Zufälligkeiten einer und derselben Natur und Substanz sind, jener nämlich, welche Gott in Adam gelegt und zur Mutter aller gemacht hat. Somit werden sie wohl bloss verschiedene Gaben und nicht Abarten der einen Substanz sein, d. h. die Verschiedenheit ist eine bloss sittliche, da sie in Adam, dem Stammvater des Geschlechtes, selbst, so gross nicht gewesen sein wird, als sie jetzt ist. Es musste sich nämlich in Adam, als dem Urquell der Natur, alles dieses finden und von ihm in seiner ganzen Mannigfaltigkeit ausströmen, wenn es Verschiedenheiten der Natur gewesen sein sollen.</p>
      <h2>21</h2><p>Wenn die Natur der Seele nun in Adam vor dem Auftreten so vielfacher Geistesanlagen von Anbeginn eine einheitliche war, so ist sie trotz dieser zahlreichen Geistesanlagen nicht vielgestaltig und auch nicht viergestaltig, so dass auch noch die Dreiheit Valentinians hinfällig wird, welche sich nicht einmal in Adam findet. Denn was gab es denn Pneumatisches an ihm? Etwa dass er jenes grosse Geheimnis in Christo und in der Kirche vorher verkündet hat: „Dieses Bein von meinem Gebein und Fleisch von meinem Fleisch wird Weib genannt werden. Deswegen wird der Mensch Vater und Mutter verlassen und seinem Weibe anhängen, und sie werden zwei sein zu einem Fleische.” Dies trug sich erst später zu, als Gott die Bewusstlosigkeit, jene pneumatische Gewalt, worauf die Prophezie beruht, hatte über ihn kommen lassen. Wenn Böses in ihm zutage trat, nämlich das Ereignis der Übertretung, so ist es nicht für eine Natureigenschaft zu halten, weil er es auf Antrieb der Schlange beging. Es ist so wenig eine Natureigenschaft als etwas Materielles, weil wir auch den Gedanken an die Materie bereits abgewiesen haben. Wenn sich nun weder etwas Pneumatisches noch etwas Hylisches — gesetzt, der Keim des Bösen wäre aus der Materie gekommen — in ihm als seine Eigentümlichkeit fand, so bleibt nichts übrig, als dass sich in ihm als einzige Natureigenschaft das fand, was als das Lebensprinzip gilt und was wir seinem Wesen nach als einfach und einheitlich hingestellt haben.</p><p>Darüber allerdings bleibt noch eine Untersuchung anzustellen, ob das, was wir Natureigenschaft genannt haben, für veränderlich zu halten sei. Denn die Genannten erklären die Natur für unveränderlich, um den einzelnen Eigentümlichkeiten ihre Dreiheit aufzudrücken, weil ein guter Baum nicht schlechte Früchte und ein schlechter Baum nicht gute Früchte bringen und niemand von Dornen Feigen und von Disteln Trauben ernten kann. Also wenn dem so ist, dann wird Gott nicht aus Steinen Söhne Abrahams erwecken können, das Natterngezücht keine Früchte der Busse bringen und der Apostel hat sich geirrt, wenn er schreibt: „Ihr waret einst Finsternis” und: „Wir sind einst von Natur Kinder des Zornes gewesen” und: „Unter ihnen waret auch Ihr, aber Ihr seid abgewaschen.” Die heiligen Lehren werden sich niemals widersprechen. Kein schlechter Baum wird je gute Früchte bringen, — wenn er nicht okuliert wird, und der gute wird schlechte bringen, — wenn man ihn vernachlässigt. Die Steine werden Söhne Abrahams, wenn sie zu Abrahams Glauben angeleitet werden. Das Natterngezücht wird Früchte der Busse bringen, wenn es das Gift der Bosheit ausgespieen haben wird.</p><p>Das wird die Macht der göttlichen Gnade vermögen, die ja mächtiger ist als die Natur; denn sie findet in uns das ihr unterstehende freie Wahlvermögen, welches man <em>αὐτεξούσιον</em> [autexousion] — Selbstbestimmung — nennt. Da es ebenfalls naturgemäss und veränderlich ist, so richtet es sich, wohin es sich immer auch richten mag, gemäss seiner Natur. Dass die Selbstbestimmung uns von Natur aus eigen sei, haben wir bereits gezeigt, sowohl dem Marcion als dem Hermogenes.</p><p>Wie nun, wenn Natur so zu definieren wäre, dass eine zweifache angenommen wird, die der gewordenen und die der ungewordenen, die der geschaffenen und die der ungeschaffenen Dinge? Dann wird sich auch das, was, wie ausgemacht, geworden und geschaffen ist, kraft seiner Natur einen Wechsel gefallen lassen. Denn es wird wieder geboren und wieder hergestellt werden können. Das Ungeborne und Ungewordene aber wird unbeweglich dastehen. Da letztere Eigenschaft Gott allein zukommt, als welcher allein unentstanden und ungeworden und darum unvergänglich und unwandelbar ist, so ist ausgemacht, dass die Natur aller übrigen gewordenen und entstandenen Wesen veränderlich und wandelbar sei, und selbst wenn der Seele dreierlei Beschaffenheit beizulegen wäre, so würde dies aus Veränderung der Eigenschaften, nicht aus der Natur herzuleiten sein.</p>
      <h2>22</h2><p>Die übrigen Natureigenschaften der Seele nebst deren Verteidigung und Beweis hat Hermogenes bereits von uns vernommen; die Seele erscheint durch sie Gott verwandt, nicht der Materie. Hier sollen sie nur einfach mit Namen aufgeführt werden, damit es nicht scheine, als seien sie übersehen worden.</p><p>Wir haben ihr beigelegt erstens Freiheit des Willens, wie oben angegeben, zweitens die Herrschaft über die Dinge, zuweilen auch das Ahnungsvermögen, abgesehen von dem, welches ihr durch die Gnade Gottes in der Prophetengabe etwa zuteil wird. Daher will ich die Untersuchung über ihre Beschaffenheit nun abbrechen, um über ihr Leben und Verhalten ins reine zu kommen. Wir beschreiben also die Seele als entstanden aus Gottes Hauch, unsterblich, wesenhaft, körperlich, von abbildungsfähiger Gestalt, der Substanz nach einfach, durch sich empfindend, in verschiedener Weise fortschreitend, freien Willens, Zufälligkeiten ausgesetzt, von wechselnder Geistesrichtung und Anlage, vernünftig, herrschend, mit Ahnungsvermögen begabt und aus einer Seele hervorgehend.</p><p>Wir werden nun im folgenden betrachten müssen, auf welche Weise sie aus einer Seele hervorgeht, d. h. von wo, wann und wie sie daraus entnommen wird.</p>
      <h2>23</h2><p>Einige bilden sich ein, vom Himmel gekommen zu sein, und schmeicheln sich mit derselben Festigkeit der Überzeugung, unfehlbar wieder dorthin zurückzukehren. So z. B. Saturninus, der Schüler des Menander, der die Lehre aufgebracht hat, der Mensch, von den Engeln gebildet, sei erst ein hinfälliges, kraftloses und haltloses Machwerk gewesen und habe, unfähig zu stehen, auf der Erde wie ein Wurm gezappelt, sodann habe er durch das Mitleid des höchsten Wesens, nach dessen Bilde, aber nach dessen nicht vollständig erkanntem Bilde er vorschnell konstruiert worden sei, ein kleines Fünkchen Leben erlangt, dieses habe ihn erweckt, aufgerichtet, kräftiger beseelt und werde ihn nach Ablauf des Lebens zu seinem Ausgange zurückführen.</p><p>Karpokrates aber nimmt nur so viel von den höheren Stoffen für sich in Anspruch, dass seine Schüler ihre Seelen bereits Christo gleichstellen, natürlich noch mehr den Aposteln und auch noch beliebig darüber. Sie wollen sie von der erhabenen Macht empfangen haben, welche die mächtigen Herrschaften der Welt verachtet.</p><p>Apelles berichtet, die Seelen seien mit Hilfe irdischer Speisen aus ihren überhimmlischen Sitzen herausgelockt worden durch den Feuerengel, den Gott Israels, der der unsrige ist, und der sie sodann mit sündhaftem Fleische bekleidet und darin festgebannt habe.</p><p>Der Schwarm der Valentinianer stopft den Samen der Sophia in die Seele, wodurch sie die Geschichten und Liebesromane ihrer Äonen in sichtbaren Bildern erkenne.</p><p>Ich bedaure, dass Plato, ohne es zu ahnen, zum Spezereikrämer für sämtliche Häretiker geworden ist. Denn er lehrt im Phaedon, dass die Seelen von hier dorthin gehen, und von dort hierher; und im Timaeus, dass die Erzeugten Gottes, als ihnen die Hervorbringung der sterblichen Wesen anvertraut war, den unsterblichen Seelenkeim in Empfang nahmen und ihn in die Eishülle eines sterblichen Körpers versetzten. Diese gegenwärtige Welt sodann sei das Abbild einer andern.</p><p>Um alles dieses glaubwürdig und annehmbar zu machen, nämlich erstens, dass die Seele früher in den höhern Regionen mit Gott im Verkehr der Ideen gestanden habe und zweitens, dass sie von dort herüberkomme und hier durchdenke, was sie ehemals aus den Ideen gelernt hat, dafür hat er einen neuen Beweis ausgeklügelt und sagt, die <em>μαθήσεις</em> [mathēseis] seien nur <em>ἀναμνήσεις</em> [anamnēseis], d. h. das Lernen sei nur ein Erinnern. Die von dort hieher kommenden Seelen hätten vergessen, wo sie früher waren und erinnerten sich erst in der Folge wieder daran, durch die gegenwärtigen sichtbaren Dinge belehrt. Da Plato mit diesem Argumente eben die Lehren annehmbar zu machen sucht, welche die Häretiker von ihm entlehnen, so werde ich die letzteren hinlänglich widerlegen, wenn ich die platonische Beweisführung über den Haufen werfe.</p>
      <h2>24</h2><p>Fürs erste gebe ich nicht zu, dass die Seele eines derartigen Vergessens fähig sei; denn Plato räumt ihr eine so hohe Stufe der Göttlichkeit ein, dass er sie Gott gleichstellt. Er lässt sie ungeworden sein, woraus ich allein schon einen starken Beweis für ihre vollkommene Gottheit machen könnte. Er fügt hinzu, sie sei unsterblich, unvergänglich, unkörperlich, weil er Gott auch dafür gehalten hat, unsichtbar, nicht abzubilden, eingestaltig, sie sei das Oberste, mit Vernunft und Erkenntnis begabt. Wenn er die Seele Gott nennete, er würde ihr keine höhere Eigenschaft beilegen. Wir aber, die wir Gott ein solches Anhängsel nicht geben, setzen aus eben diesem Grunde die Seele tief unter Gott, weil wir sie als geworden ansehen und dadurch eben als eine verdünnte Abart der Gottheit und von schwächerer Glückseligkeit, wie ein Hauch, nicht wie ein Geist, und wenn sie auch unsterblich ist, was etwas Göttliches ist, so doch leidensfähig, was vom Geborensein herrührt. Darum sei sie auch von Anbeginn an der Gefahr der Beraubung ausgesetzt gewesen und deshalb des Vergessens fähig. Hierüber haben wir mit Hermogenes genug verhandelt.</p><p>Um sämtliche Eigenschaften mit Gott gleich zu haben und so mit Recht für eine Gottheit gehalten werden zu können, dürfte die Seele keinem Leiden unterworfen sein, mithin auch nicht dem Vergessen. Denn das Vergessen ist ein ebenso grosser Nachteil als das, dem es Eintrag thut, ein Ruhm ist, nämlich ein gutes Gedächtnis. Letzteres preist Plato selbst als die Sicherstellung der Sinne und Erkenntnisse und Cicero als die Schatzkammer aller Studien. Man wird jetzt nicht sowohl das in Zweifel ziehen, ob die in so hohem Grade vergöttlichte Seele das Erinnerungsvermögen verlieren, sondern vielmehr, ob sie es, wenn sie es verloren hat, wieder gewinnen könne. Ich weiss nicht, ob sie sich wieder zu erinnern imstande sein wird, wenn sie vergessen hat, was sie nicht hätte vergessen sollen. So würde also beides auf die Seele passen, wie ich sie will, nicht auf die Platonische.</p><p>An zweiter Stelle mache ich die Einwendung: Soll die Seele von Natur aus an den Ideen teil haben oder nicht? — Ja wohl, von Natur aus, ist die Antwort. Dann wird niemand zugeben, dass das natürliche Wissen um die natürlichen Fertigkeiten verloren gehe. Die Kenntnis von Studien, Lehren, Anleitungen mag verloren gehen, vielleicht sogar auch die von Fähigkeiten und Affekten, welche zwar zur Natur zu gehören scheinen, aber, wie gezeigt, doch nicht dazu gehören, sondern die je nach Ort, Erziehung, Körperbeschaffenheit, Gesundheit, den vorherrschenden Kräften und der Freiheit des Wahlvermögens auf Zufälligkeiten basieren.</p><p>Das Wissen um zur Natur gehörige Dinge nimmt jedoch nicht einmal bei den Tieren ab. Allerdings vergisst der Löwe seiner Wildheit, wenn er zur Zahmheit abgerichtet ist, wird mit dem ganzen Wulste seiner Mähnen ein Spielzeug für irgend eine Königin wie Berenice werden und mit seiner Zunge ihre Wangen rein lecken. Von Gewohnheiten sagt das Tier sich los, das Wissen um ihm Natürliches wird bleiben. Nie vergisst der Löwe seiner natürlichen Nahrung, seiner natürlichen Arzneien, seiner natürlichen Schreckmittel. Wenn die Königin ihm Fische und Kuchen anbieten wollte, so wird er Fleisch begehren. Wollte sie ihm, wenn er krank ist, einen Theriak zurecht machen, so wird er seinen Affen verlangen. Wenn sie ihm gegenüber auch keinen Jagdspiess befestigt, so wird er sich doch vor einem Hahn fürchten.</p><p>Ebenso verbleibt dem Menschen, vielleicht dem vergesslichsten Wesen von allen, die Kenntnis des Natürlichen allein ungetrübt, da sie allein ihm natürlich ist. Er wird also immer an das Essen denken bei Hunger, an das Trinken bei Durst, mit den Augen sehen, mit den Ohren hören, mit der Nase riechen, mit dem Munde schmecken und mit der Hand tasten. Das sind die Sinne, welche die Philosophie mit Bevorzugung des Intellektuellen heruntersetzt.</p><p>Wenn also das natürliche Wissen auf sinnlichem Gebiete bleibt, wie kommt es, dass es auf dem intellektuellen, welches doch für vorzüglicher gilt, untergeht? Woher gerade hier der Einfluss jenes Vergessens, welches dem Wiedererinnern vorhergehen soll? Von der Länge der Zeit, sagt man. — Kurzsichtig genug! Die Zeitdauer wird keinen Einfluss auf Wesen haben, die angeblich ungeboren sind und gerade darum für ewig gehalten werden. Denn für das, was, weil es ungeboren, ewig ist, gibt es keinen Anfang und kein Ende der Zeit und es lässt darum auch gar kein Zeitmaass zu. Wofür es aber kein Zeitmaass gibt, das ist auch der Zeit nicht unterworfen durch irgend eine Veränderung und dieser aus der Länge der Zeit angeblich hervorgehende Einfluss existiert nicht. Wenn die Zeit das Vergessen verursacht, warum verlässt das Gedächtnis die Seele erst von der Zeit an, wo sie in den Körper eintritt, als ob es erst von da an für sie, die ohne Zweifel früher als der Körper, aber doch nicht ohne die Zeit existierte, eine Zeit gebe.</p><p>In den Körper eingetreten, vergisst sie dann sofort, oder dauert es erst noch eine Zeit? — Wenn es sofort geschieht, welches wird dann die Länge einer Zeit sein, die noch gar nicht zählt? Es ist ja das Alter der unmündigen Kinder. Wenn es aber erst eine zeitlang dauert, so wird sich doch die Seele noch des Gedächtnisses in jenem Zeitraume vor dem Eintritt des Vergessens erfreuen? Was soll es nun heissen, dass sie später vergisst und sich später nochmal wieder erinnert? In welcher Zeitfrist auch immer das Vergessen eintritt, wie lange man das Zeitmaass auch ansetzt, die ganze Lebensdauer, sollte ich denken, wäre nicht hinreichend, um das Andenken an die lange Periode vor der Annahme des Körpers zu verwischen.</p><p>Veränderung halber verlegt Plato den Grund nun wieder in den Körper, als wenn es glaubhaft wäre, dass eine gewordene Substanz die Macht einer ungewordenen auslöschen könnte. Gross und zahlreich aber sind die Verschiedenheiten der Körper je nach Abkunft, Grösse, Haltung, Alter und Gesundheit. Soll man danach nun auch die Verschiedenheiten im Vergessen abschätzen? Das Vergessen ist aber ganz das gleiche. Folglich wird ein ganz gleichförmiger Ausgang nicht durch eine verschiedengestaltige Körperlichkeit verursacht. Viele Beweise bekunden, sogar nach Platos Zeugnis selbst, das Ahnungsvermögen der Seele. Wir haben sie bereits dem Hermogenes dargelegt. Wohl kein Mensch fühlt nicht zu Zeiten einmal in sich die Seherkraft seiner Seele oder ihre Ahnungen von Unheil, Gefahren oder Freude. Wenn nun der Körper dem Ahnungsvermögen nicht hinderlich ist, so wird er auch dem Gedächtnis, sollte ich denken, nicht im Wege stehen. Denn es ist sicher der nämliche Körper, in welchem die Seele vergisst und sich erinnert. Bewirkt irgend ein im Körper liegender Grund das Vergessen, wie kann er dann das Gegenteil, das Wiedererinnern, zulassen? Das Wiedererinnern nach dem Vergessen ist ja nur das wiederkehrende Gedächtnis. Was aber dem ersten Erinnern zuwider ist, warum sollte das nicht auch dem zweiten entgegenstehen?</p><p>Wer könnte endlich ein besseres Erinnerungsvermögen besitzen als die Kinder, deren Seelen noch frisch sind, noch nicht hineingezogen in die Sorgen des häuslichen und öffentlichen Lebens und solchen Studien hingegeben, deren Lernen ein Wiedererinnern wird? Richtiger gesagt, warum erinnern wir uns nicht alle in gleichem Grade wieder, da wir in gleichem Grade vergessen? Warum erinnern sich allein die Philosophen und auch sie nicht einmal alle? Denn, wohlgemerkt, in dem ganzen grossen Gewimmel von Völkern, auf der weiten Trift der Weisheit ist es Plato ganz allein, der die Ideen vergessen und sich ihrer wieder erinnert hat. Wenn also diese seine vornehmste Argumentation in keiner Weise standhält, so ist damit das Ganze über den Haufen geworfen, wofür sie berechnet ist, und man hat die Seelen eigentlich nur darum für unentstanden, in den himmlischen Räumen wohnhaft, dort des Göttlichen mitwissend, von da hierher versetzt und hier sich wiedererinnernd gehalten, um den Häretikern Anknüpfungspunkte zu verschaffen.</p>
      <h2>25</h2><p>Ich kehre nun zur Veranlassung dieser Abschweifung zurück, um anzugeben, wie die Seelen aus der einzigen ausströmen, wann, wo und auf welche Weise sie entnommen werden. In betreff dieses Gegenstandes liegt nichts daran, ob die Frage von einem Philosophen, einem Häretiker oder dem grossen Haufen aufgeworfen wird. Es liegt den Bekennern der Wahrheit nichts an ihren Gegnern, zumal an so frechen Gegnern, wie zuerst die sind, welche annehmen, die Seele werde nicht im Mutterschoosse empfangen und nicht mit der Bildung des Leibes gefestigt und hervorgebracht, sondern erst nach erfolgter Geburt dem noch leblosen Kinde von aussen eingedrückt. Es werde nämlich der Same durch den Beischlaf in die weiblichen Organe aufgenommen, durch die natürliche Bewegung angemuntert und verdichte sich zur festen Fleischessubstanz. Diese werde geboren, von der Wärme des Mutterleibes noch dampfend; von seiner Glut befreit, werde sie wie ein glühendes Eisen, das schnell in kaltes Wasser getaucht wird, von der Kälte getroffen, nehme dadurch die seelische Kraft an und gebe Laute von sich. Das behaupten in Gemeinschaft mit Änesidemus die Stoiker und zuweilen Plato selbst, wenn er die sonsthin abwesende und ausserhalb des Mutterschoosses weilende Seele durch das erste Einatmen des geborenen Kindes herbeigeholt sowie sie durch das letzte Ausatmen ausgestossen werden lässt. Wir wollen zusehen, ob er das als seine Ansicht hingestellt hat. Von den Ärzten fehlt nicht einmal Hikesius, der immer die Grenzen der Natur und seiner Kunst überschreitet.</p><p>Vermutlich war es Scham, was sie hinderte, etwas gutzuheissen, was Meinung der Weiber ist. Von den Weibern schliesslich widerlegt zu werden, ist aber viel schimpflicher, als von ihnen eine Bestätigung zu empfangen! Denn in diesem Punkte gibt es keine geeigneteren Lehrer, Richter und Zeugen als das weibliche Geschlecht. Gebt also Antwort, ihr Mütter, Schwangern und Gebärenden, die Unfruchtbaren aber und die Männer sollen schweigen! Man wünscht zu erfahren, wie sich eure Natur in Wirklichkeit verhalte, man forscht nach zuverlässigen Wahrnehmungen bei euch, ob ihr in eurer Leibesfrucht irgend eine der eurigen fremde, lebhafte Bewegung verspürt, infolge deren es in der Hüftgegend gribbelt, die Weichen erzittern, die ganze Bauchwandung Stösse fühlt und die Stelle der Last sich fortwährend ändert? Gewähren euch diese Bewegungen die sichere Gewissheit und vollkommene Sicherheit, weil ihr alsdann glaubet, das Kind lebe und spiele? Geratet ihr in Furcht, wenn die Unruhe der Frucht aufhört? Besitzt sie in euch bereits Gehör, denn sie schrickt bei ungewohntem Schall zusammen? Verspürt ihr verkehrte Gelüste nach Speisen für die Leibesfrucht? Empfindet ihr für sie Ekel? Teilt ihr euch die Krankheiten gegenseitig einander mit und zwar bis zu dem Grade, dass sie von den Verletzungen, die ihr bekommt, drinnen an denselben Gliedern gezeichnet wird, indem sie den Schaden, der der Mutter geschieht, sich annimmt. Rühren Blässe oder Röte vom Blute her, das Blut wird nicht ohne Leben sein. Ist Gesundheit ein Zuwachs des Lebens, keine Gesundheit wird es ohne Leben geben; wenn Nahrung Appetitlosigkeit, Wachstum, Abnahme, Furcht und Bewegung Lebensthätigkeiten sind, so wird der Leben haben, welcher diese Funktionen ausübt. Wer aufhört, sie zu üben, der hört auf zu leben.</p><p>Endlich werden auch Tote geboren. Wie wäre das möglich, wenn nicht auch Lebende geboren würden. Wer ist denn aber tot? Nur wer vorher gelebt hat. Nun aber wird das Kind sogar im Mutterleibe getötet, eine Grausamkeit, die notwendig ist, wenn es beim Heraustreten sich querlegend die Geburt hindert. Es würde zum Muttermörder, wenn es nicht stürbe. Daher befindet sich unter den Geräten der Ärzte auch ein Instrument, womit zunächst die geheimen Teile gewaltsam geöffnet werden mit massig drehender Bewegung, ferner das sichelförmige Messer, womit die Glieder im Innern abgeschnitten werden unter banger Erwartung, endlich der stumpfe Haken, womit die böse Materie herausgezogen wird, in gewaltsamer Entbindung. Man hat auch eine Lanzette von Bronze, womit die Tötung selbst vorgenommen wird, ein unsichtbarer Raubmord. Sie führt den Namen Embryotöter von ihrer Bestimmung, das Kind zu töten; es ist also denn doch ein lebendes Kind, welches umgebracht wird. Ihrer bedienten sich schon Hippokrates, Asklepiades, Erasistratus, Herophilus, der auch Erwachsene sezierte, und sogar der menschlichere Soranus, in der gewissen Überzeugung, dass ein lebendes Wesen empfangen sei. Sie übten an diesen so unglücklichen Kindern in der Weise Erbarmen, dass sie sie vor der Geburt töteten, damit sie nicht lebend in Fetzen gerissen würden.</p><p>Dass dieses Verbrechen geboten sei, daran zweifelte auch Nikesius nicht, der die Seele über die bereits Gebornen kommen lässt infolge des Zutritts der kalten Luft; bei den Griechen entspricht dem auch die vom Erfrischen hergenommene Bezeichnung der Seele. Die Beseelung der Barbarenvölker geschieht darum wohl auf andere Weise als die der romanischen, weil sie der Seele irgendwelchen andern Namen gegeben haben als Psyche?! Wie viele Nationen werden aber in einem sehr heissen Klima geboren und sind auch in Hinsicht auf die Farbe wie verbrannt! Woher kriegen diese nun ihre Seele, da es bei ihnen keine kühle Luft gibt? Von der Zimmerhitze in den Gemächern der Kindbetterinnen und der ganzen Wärmevorrichtung, welche ihnen so notwendig ist, da es schon gefährlich ist, sie bloss anzublasen, schweige ich lieber. Fast in einem Schwitzbade kommt der Säugling zur Welt und auf der Stelle hört man ihn plärren.</p><p>Wenn dagegen die Kühle der Luft den Seelen das Dasein gibt, so würde ausserhalb Deutschlands, Russlands, der Alpenländer und Argos eigentlich niemand geboren werden dürfen. Nun sind aber die Einwohner zahlreicher gerade unter den orientalischen und mittäglichen Klimaten, und auch die Talente schneller, indem sämtliche Sarmaten geistig stumpf sind. Und doch müssten, wenn die Seelen aus den kalten Stoffen entsprängen, aus der dortigen Kälte begabtere Geister hervorgehen. Denn dem Stoffe entspricht die Kraft.</p><p>Dies vorausgeschickt, dürfen wir auch jener Personen gedenken, welche, aus dem Mutterleibe herausgeschnitten, doch lebten und atmeten, wie Liber und Scipio.</p><p>Wenn jemand mit Plato der Ansicht ist, zwei Seelen könnten ebensowenig zusammen sein als zwei Körper, so wollte ich ihm nicht etwa bloss <em>zwei</em> Seelen zeigen, die vereinigt sind, so gut wie im Mutterleibe zwei Körper, sondern noch vieles andere, was schon mit der Seele in Verbindung getreten ist, nämlich Geister von Dämonen und nicht bloss von einem einzigen wie bei Sokrates, sondern sogar von einem siebenfältigen wie bei Magdalena, und einem, dessen Zahl Legion war, wie bei dem Gerasener. Dann wird man um so lieber glauben, dass eine Seele mit einer andern Seele zusammengesellt sein könne wegen der Gleichheit der Substanz, da sie mit einem bösen Geiste zusammengesellt war trotz der Verschiedenheit der Natur.</p><p>Plato gibt aber selber im sechsten Buch von den Gesetzen die Ermahnung, darauf zu sehen, dass nicht durch ein Fehlgehen des Samens infolge fehlerhaften Beischlafes ein Mangel für Körper und Geist entstehe. Da weiss ich denn doch nicht, ob er sich mehr von seiner früheren oder von seiner letztern Meinung entfernt hat. Denn er gibt damit zu erkennen, die Seele werde mit dem Samen, auf den er Acht zu haben ermahnt, eingeführt und nicht mit dem ersten Atemholen des Neugeborenen. Wie in aller Welt kommt es, dass wir in Hinsicht der Geistesanlagen durch Ähnlichkeit der Seele nach dem Zeugnisse des Kleanthes unsern Eltern entsprechen, wenn wir nicht aus dem Seelensamen hervorgehen? Warum haben denn die alten Astrologen als die Geburtszeit des Menschen den Anfangspunkt seiner Empfängnis festgehalten, wenn die Seele nicht von da an existiert? Auf sie bezieht sich der Stand der Gestirne, wenn er überhaupt etwas ist, ebenso sehr.</p>
      <h2>26</h2><p>Doch die Meinungen der Menschen ausserhalb der Grenzen der Offenbarung zeigen nichts als lauter Abweichungen. Ich will mich nun hinter unsere Grenzlinien zurückziehen, um, was ich den Philosophen und Ärzten zur Antwort gegeben habe, für die Christen zu beweisen. Lass, christlicher Mitbruder, deinen Glauben sich auf dem dir eigenen Fundamente auferbauen! Blicke hin auf den belebten Mutterschooss heiliger Frauen und auf die Kinder, die dort bereits nicht bloss leben, sondern auch prophezeien.</p><p>Der Leib der Rebekka wird unruhig, und noch ist die Entbindung fern, noch kein Andringen der Luft vorhanden. Siehe, die Doppelgeburt im Mutterleibe wird unruhig und die zwei Völker sind noch nirgends zu sehen. Unheilverkündend wäre vielleicht die Aufgeregtheit der Kinder, die schon streiten und noch nicht leben, die schon lebhaft sind und noch nicht belebt, im Falle sie etwa bloss die Mutter durch ihr Strampeln beunruhigt hätten. Allein als die Entbindung ihren Anfang nimmt, die Zahl sichtbar und die Vorbedeutung erkannt wird, bestätigt sich, glaube ich, nicht nur die Beseelung der Kinder, sondern auch der stattgehabte Streit. Es wurde der, welcher zuerst geboren war, festgehalten von dem andern, dem er zuvorgekommen und der noch nicht vollständig geboren war, sondern erst mit der Hand herauskam. Schlürfte der erste seine Seele mit dem ersten Einatmen, nach Platonischer Weise, oder schöpfte er sie aus der kalten Luft, nach Stoischer Sitte, wie machte es denn der andere, den man noch erwartete, der noch drinnen festgehalten wurde, der aber draussen schon festhielt? Er atmete, denke ich, noch nicht, und hielt doch schon seinen Bruder an der Ferse fest. Obwohl er sich noch in der Wärme der Mutter befand, begehrte er schon zuerst hervorzugehen. O über dieses feindselige, kräftige und auch, vermutlich weil es lebte, schon streitsüchtige Kind!</p><p>Berücksichtige ferner die Einzelgeburten, und zwar die auffallenden, die einer Unfruchtbaren und einer Jungfrau, die gerade darum wegen der Umkehrung der Natur nur Unvollkommenes würden haben gebären können, die eine als vor dem Samen scheu, die andere weil davon unberührt. Die, welche nicht in der rechten Weise empfangen waren, hätten müssen ohne Seele geboren werden, aber auch sie leben, jeder in seinem Mutterschoosse. Elisabeth frohlockt, Johannes hatte sie innerlich dazu angetrieben; Maria aber preiset den Herrn, Christus hatte sie innerlich dazu angeregt. Die Mütter kennen gegenseitig ihre Neugeborenen und werden dem entsprechend auch von ihnen erkannt. Dieselben lebten also und waren nicht bloss Seelen, sondern auch Geister.</p><p>So liesest du auch einen an Jeremias gerichteten Ausspruch Gottes; „Bevor ich dich im Mutterschoosse bildete, habe ich dich erkannt.” Wenn Gott im Mutterschoosse bildet, so haucht er auch an, in der Weise wie zu Anbeginn „Gott bildete den Menschen und blies in ihn den Hauch des Lebens”. Gott kann auch den Menschen im Mutterschoosse nur dann erkennen, wenn derselbe vollständig fertig ist: „Bevor Du aus dem Mutterleibe hervorgingest, habe ich Dich geheiligt.” Und da soll er bloss ein toter Körper sein? In keiner Weise! Gott ist ja ein Gott der Lebendigen und nicht der Toten.</p>
      <h2>27</h2><p>Wie hat denn also die Empfängnis des lebenden Wesens stattgefunden? Wurde die Substanz beider, des Körpers und der Seele, auf einmal zusammengeschweisst oder war eins von beiden früher da? Nein, wir lehren, beide sind zugleich sowohl empfangen als auch bereitet und vollendet, so gut wie sie auch zugleich hervorgezogen werden, und in der Empfängnis findet sich kein Moment, wodurch die Stelle bestimmt würde.</p><p>Deinen Begriff vom Anfange bilde dir aus dem Ende. Wenn sich der Tod nicht anders bestimmen lässt denn als Trennung des Leibes von der Seele, so wird das Gegenteil vom Tode, das Leben, nicht anders zu definieren sein als: Verbindung des Leibes mit der Seele. Wenn die Trennung beim Tode zu gleicher Zeit beide Substanzen betrifft, so muss sich gerade dies als das Gesetz der Verbindung darstellen, indem letztere beim Leben auf gleiche Weise für beide Substanzen stattfindet.</p><p>Daher lassen wir das Leben mit der Empfängnis beginnen, weil wir den Anfang der Seele von der Empfängnis an datieren; denn das Leben beginnt in demselben Augenblick wie die Seele. Es wird also auf gleiche Weise zum Leben zusammengefügt, was auf gleiche Weise zum Zwecke des Sterbens getrennt wird. Im Falle wir aber dem einen die erste Stelle geben, dem andern die zweite, so müssen im Verhältnis zur Aufeinanderfolge auch die Zeitpunkte der Besamung auseinander gehalten werden. Wann wird denn nun der Same des Körpers gelegt und wann der der Seele? Wenn die Zeit der Besamung unterschieden ist, so wird man verschiedene Stoffe bekommen infolge der Trennung der Zeiten. Denn wenn wir auch zwei Arten von Samen unterscheiden, den seelischen und den animalischen, so behaupten wir doch, sie seien ungetrennt und damit also noch gleichzeitig und aus demselben Augenblicke.</p><p>Man schäme sich nicht ob dieser notgedrungenen Erklärung. Die Natur muss in Ehren gehalten werden und ist kein Gegenstand des Errötens. Der Beischlaf ist schimpflich infolge der Wollust, nicht an sich; die Ausschreitung, nicht die Sache selbst ist wider die Scham; denn die Sache selbst ist gesegnet bei Gott: „Wachset und mehret euch!” Die Ausschreitung aber ist verflucht; die Ehebrüche, Hurereien und schlechten Häuser. Also bei dieser gewöhnlichen geschlechtlichen Verrichtung, worin sich Mann und Weib verbinden, ich meine den gewöhnlichen Beischlaf, ist, wie wir wissen, Leib und Seele zugleich thätig, die Seele durch die Begierde, das Fleisch in der Vollziehung, die Seele durch den Trieb, der Leib im Werke. Indem also mit einem einzigen Anstoss beider der ganze Mensch in Erregung gesetzt wird, läuft der Same zu einem vollständigen Menschen über, der aus der Körpersubstanz die Feuchtigkeit, aus der geistigen aber die Wärme bekommen hat. Und wenn die Seele den Griechen zufolge etwas Frostiges ist, warum wird dann der Körper kalt und starr, wenn sie aus demselben herausgegangen ist?</p><p>Und endlich, um eher an der Schamhaftigkeit als an der Kraft des Beweises etwas fehlen zu lassen, gerade bei der Glut der aufs höchste gestiegenen Wollust, wo die Zeugungsflüssigkeit ausgestossen wird, fühlen wir da nicht auch etwas von der Seele mit hinausgehen? Deshalb werden wir dabei matt und kraftlos mit Abnahme des Lichts. Das wird wohl der seelische Samen sein aus einer Austräuflung der Seele, so wie die eben erwähnte Flüssigkeit der Same des Körpers ist, aus einem Ueberschäumen des Fleisches.</p><p>Der Uranfang ist eine sehr getreue Analogie dazu. Aus dem Lehm stammte Adams Fleisch. Was ist Lehm anders als eine zähe Flüssigkeit? Von da werden die zeugenden Säfte stammen. Aus dem Anhauch Gottes kam die Seele. Was anders ist der Anhauch Gottes als ein Wehen des Geistes? Von ihm wird das herrühren, was wir mit jener Flüssigkeit aushauchen. Da also beim Uranfang zwei verschiedene und getrennte Dinge, der Lehm und der Anhauch, zusammen den einen Menschen herstellten, so haben damals schon die beiden zusammengeflossenen Substanzen auch ihre Samen in eins zusammengethan und damit die Regel für die Fortpflanzung des Geschlechtes in der Folgezeit gegeben, so dass auch jetzt noch beide, obwohl verschieden, doch vereint zusammen ausfliessen. Zu derselben Zeit der Furche und ihrem Ackerboden anvertraut, bringen sie zu gleicher Zeit einen Menschen von beiden Substanzen hervor, in welchem wieder sein Same enthalten ist nach seiner Art, so wie es jedem zeugungstüchtigen Geschöpfe vorherbestimmt ist.</p><p>Mithin stammt aus einem einzigen Menschen diese ganze Unzahl von Seelen, indem die Natur den Ausspruch Gottes befolgt: „Wachset und mehret euch.” Auch in der Vorrede zu Gottes einmaligem Wirken: „Lasst uns den Menschen machen!” ist schon die gesamte Nachkommenschaft im Plural vorausverkündet: „Sie sollen herrschen über die Fische des Meeres.” Kein Wunder! Es wird im Samen die Ernte verheissen.</p>
      <h2>28</h2><p>Was ist das für ein alter Dialog, dessen Plato gedenkt, der über das abwechselnde Hin- und Hergehen der Seelen sagt, dass, wenn sie sich von hier entfernen, sie dorthin gehen, dann wiederum hierher kommen und leben, sodann aus dem Leben scheiden und wiederum aus Toten Lebende werden? Er ist Pythagoräisch, wie einige behaupten, oder göttlich, wie Albinus meint, oder er rührt vielleicht von Merkur her, wie die Ägypter sagen.</p><p>Göttliche Aussprüche aber gibt es keine, als die des einen einzigen Gottes, wie sie die Propheten, die Apostel und Christus selbst kund gethan haben. Moses ist ja schon älter als Saturn, etwa neunhundert Jahr, natürlich noch viel älter als dessen Urenkel, göttlich aber gewiss in noch viel höherem Grade. Er hat den Verlauf der Geschicke des Menschengeschlechtes durch die einzelne Generationen hindurch mit Namen und nach Zeiten angezeigt, indem er die Göttlichkeit seines Auftretens durch die göttliche Seherkraft seines Wortes hinlänglich bewährte. Wenn aber für die infolge der abwechselnden Wiederherstellung der Lebendigen und Toten sich stets wiederholende Wiederkehr der Seelen der Sophist aus Samos Platos Gewährsmann ist, dann hat sich Pythagoras, wenn auch sonst ein guter Mann, um seine Lehre zu stützen, auf eine nicht bloss schändliche, sondern sogar verwegene Lügerei verlegt. Man untersuche die Sache, wenn man sie noch nicht kennt, und sei mit uns gläubig!</p><p>Er gibt vor, gestorben zu sein, verbirgt sich in einem unterirdischen Raume, verurteilt sich zu siebenjährigem Aufenthalt daselbst und erfährt mittlerweile durch seine Mutter, die seine einzige Mitwisserin und Gehülfin in der Sache ist, die Dinge, die er mit dem Schein der Glaubwürdigkeit über die nach ihm Gestorbenen erzählen will. Sobald es ihm scheint, als habe er lange genug seine Leiblichkeit verleugnet, steigt er mit allen Schrecknissen eines längst Verstorbenen aus seinem betrügerischen Asyle, wie einer, den die Unterwelt wiederhergegeben hat. Wer sollte einen Menschen, von dessen Ableben er nichts gehört hat, nicht für wieder aufgelebt halten? Zumal wenn er von ihm über die seither Verstorbenen Dinge hört, die dieser nur in der Unterwelt erfahren haben zu können scheint?! So lautet die ältere Erzählung darüber, dass die Toten wieder lebendig werden können. Was läge daran, wenn sie jünger wäre? Denn die Wahrheit braucht nicht das Altertum als Stütze, und die Lüge schreckt auch vor der Makel der Neuheit nicht zurück.</p><p>Ich halte die Sache für vollständig erlogen, wenn auch diese Lüge durch hohes Alter geadelt ist. Und wie sollte das nicht falsch sein, dessen Beweis falsch ist? Wie könnte ich glauben, dass Pythagoras nicht lüge, da er lügt, damit ich glaube? Wie will er mich überreden, dass er früher, bevor er Pythagoras gewesen, Äthalides, der Fischer Euphorbus, Pyrrhus und Hermotimus gewesen sei, um mich glauben zu machen, dass aus Toten wiederum Lebendige werden, er, der fälschlich beteuert hat, er werde wiederum Pythagoras sein? Wäre er einmal als dieselbe Person wieder zum Leben zurückgekehrt und nicht so vielmal immer als ein anderer, so würde das viel glaubhafter sein. Da er in geringen Dingen schon gelogen hat, so hat er noch mehr in grösseren Betrug geübt.</p><p>Aber er erkannte ja den Schild des Euphorbus wieder, der sich einst zu Delphi als Weihgeschenk befand, nannte ihn den seinigen und bewies es aus sonst unbekannten Kennzeichen! — Denke doch nur an sein unterirdisches Gemach, und wenns dann noch geht, so glaube! Wer eine solche Schnurre ersonnen hat, zum Schaden seiner Gesundheit, mit dem Verluste seiner Lebensfreude, die sieben Jahre lang unter der Erde verkümmert wurde, durch Appetitlosigkeit, Unlust, Finsternis, wer eine solche Abneigung gegen das Himmelslicht hatte, welche Verwegenheit sollte ihm unerreichbar, welche Mittel der Neugier ihm unzugänglich sein, um zur Kenntnis jenes Schildes zu gelangen?! Wie aber, wenn er sie etwa in irgendwelchem alten vergessenen Geschichtsbuche fand? Wie, wenn er einige Bröckchen von einer schon verwischten Tradition erhaschte? Wie, wenn er ihn durch eine vom Küster heimlich erkaufte Besichtigung kannte? Wir wissen, dass in Erforschung verborgener Dinge dergleichen auch der Magie möglich ist durch die katabolischen, paredrischen und pythonischen Geister. Hat nicht auch Pherecydes, der Lehrer des Pythagoras, mit Hilfe solcher Künste geweissagt, um nicht zu sagen deliriert? Wie, wenn in ihm derselbe Geist sass, der durch Euphorbus blutige Thaten vollbrachte? Und endlich, wenn er sich als Euphorbus auswies mit Hilfe des Schildes, warum hat er denn nicht ebensogut einen von seinen trojanischen Kriegskameraden wieder erkannt? Diese wären doch wohl auch wieder aufgelebt, wenn aus Toten Lebendige würden!</p>
      <h2>29</h2><p>Dass die Lebendigen zu Toten werden, das steht fest, darum aber noch nicht, dass aus Toten Lebendige werden. Denn im Uranfang waren die Lebendigen die ersten und darum von Anfang an die Toten die Späteren. Sie entstehen nirgendwo anders her als aus Lebendigen. Für diese aber gab es einen angemessenern Ursprung als aus den Toten. Jene hingegen haben nichts, woraus sie entspringen könnten, als nur die Lebendigen. Wenn also im Uranfang die Lebendigen nicht aus den Toten entstanden sind, warum denn nachher? War denn die Quelle ihres Ursprungs, wie beschaffen auch immer, versiecht? Oder war ihnen die herkömmliche Regel leid? Und wie blieb diese in den Toten von Bestand? Weil im Anbeginn Tote aus Lebenden entstanden, entstehen sie deshalb nicht noch immer daraus? Entweder wäre die ursprüngliche Regel in beiden Fällen von Bestand gewesen, oder sie hätte sich in beiden geändert, so dass, wenn später Lebendige aus Toten entstehen mussten, es ebenso eine Notwendigkeit gewesen wäre, dass nicht mehr aus Lebendigen Tote würden. Wenn die Zuverlässigkeit der Einrichtung sich nicht durchweg gleichbleiben durfte, so gibt es auch keine fortdauernde wechselsweise Wiederherstellung der Dinge aus ihrem Gegenteil.</p><p>Wir stellen ja auch die Gegensätze von Geboren und Ungeboren, Sehvermögen und Blindheit, Jugend und Alter, Weisheit und Nichtweisheit einander gegenüber, sagen aber darum doch nicht, das Ungeborene gehe aus Geborenem hervor, weil sein Gegenteil aus dem andern Gegenteil hervorgeht. Ebensowenig entsteht das Sehvermögen darum aus der Blindheit, weil die Blindheit das Sehvermögen befällt. Die Jugend verjüngt sich nicht aus dem Alter darum, weil das Alter auf die Jugend durch Abnahme der Kräfte folgt; die Weisheit stumpft sich nicht darum zur Thorheit ab, weil die Thorheit sich zur Weisheit schärft. Solche Folgerungen fürchtete auch Albinus für seinen Plato und suchte daher in subtiler Weise die Gegensätze in Klassen zu zerlegen. Aber das kommt dann so heraus, als ob die letztgenannten Gegensätze nicht ebenso vollkommen wären als jene, welche er im Interesse der Ansicht seines Meisters auslegt, nämlich Leben und Tod. Trotzdem wird das Leben nicht nach dem Tode darum wieder verliehen werden, weil auf das Leben der Tod folgt.</p>
      <h2>30</h2><p>Was werden wir aber auf die übrigen Punkte erwidern? Erstens, wenn aus den Toten Lebendige sowie aus den Lebendigen Tote entständen, so würde die Anzahl sämtlicher Menschen immer durchaus dieselbe geblieben sein, nämlich jene Anzahl, welche zuerst in das Leben eingetreten war. Denn die Lebendigen sind ja früher als die Toten, danach werden Tote aus den Lebendigen und dann wiederum aus den Toten Lebendige. Und wenn dies immer in derselben Weise geschieht, so sind es immer dieselben, welche aus denselben hervorgehen. Es würden weder mehr noch weniger ausgehen als zurückkommen.</p><p>Nun finden wir aber in den Berichten der <em>antiquitates humanae</em>, dass das Menschengeschlecht nach und nach sich ausgebreitet habe, indem die Aboriginer, entweder als Herumstreicher oder Verbannte oder als Sieger, fortwährend neue Länder besetzten, so die Scythen das Partherland, die Temeniden den Peloponnes, die Athener Asien, die Phrygier Italien und die Phönizier Afrika. Auch werden in förmlichen und feierlichen Auswanderungen, welche man <em>ἀποικίαι</em> [apoikiai] nennt, Schwärme Volks in der Absicht, die Last der Volkszahl zu vermindern, in fremde Gebiete ausgespieen. Jetzt nämlich bleiben die Aboriginer in ihren Wohnsitzen und suchen vielmehr ihre Volksmenge anderwärts für sich nutzbar zu machen. Wenigstens liegt es auf der Hand, dass der Erdkreis selbst von Tag zu Tag mehr angebaut wird und kultivierter ist als ehedem. Alles ist bereits zugänglich, alles erforscht, alles für den Verkehr erschlossen; verrufene Einöden sind längst in die lieblichsten Triften verwandelt, Wälder zu Ackerfeld urbar gemacht, die wilden Tiere durch die zahmen vertrieben, Sandflächen besäet, Felsen gesprengt, Sümpfe ausgetrocknet und die Zahl der Städte so gross als ehedem die der Hütten. Auch die Inseln sind nicht mehr Gegenstand der Furcht, Klippen schrecken nicht mehr, überall sind Wohnungen, überall Bevölkerungen, überall Staaten, überall Leben. Wir sind der Erde eine Last, kaum reichen die Elemente für uns aus, die Bedürfnisse werden knapper und überall gibts Klagen, da uns die Natur bereits nicht mehr erhalten will.</p><p>Seuchen, Hunger, Kriege, Untergang von Städten sind schier für Heilmittel zu halten, für eine Art Beschneidung des überwuchernden menschlichen Geschlechtes. Und doch, wenn dergleichen Sensen einmal eine gewaltige Menge Sterblicher wegmähen, so ist der Erdkreis noch niemals vor der Wiederbringung, welche nach eintausend Jahren einmal die Toten als Lebende zurückführen soll, bange gewesen. Wenn aus Toten Lebende würden, so hätte die wiederherstellende Macht, welche die gleiche ist wie beim Verluste, auch dies fühlbar gemacht. Warum aber werden erst nach tausend Jahren und nicht sogleich aus Toten Lebende? Wenn das Verschwundene nicht sofort wieder erscheint, so läuft es ja Gefahr, gänzlich zu vergehen, indem das Hinschwinden dann einen zu grossen Vorsprung hätte vor der Wiederherstellung. Denn die gegenwärtige Lebensdauer ist dem nicht entsprechend, sondern viel kürzer als tausend Jahre und darum leichter auszulöschen als wieder anzufachen. Alles Leben würde also, wenn die Lebenden aus den Toten entstünden, auf diese Weise erloschen sein. Da es aber noch nicht erloschen ist, so wird auch nicht anzunehmen sein, dass die Lebendigen aus den Toten entstehen.</p>
      <h2>31</h2><p>Gesetzt nunmehr, es würden aus den Toten Lebendige, dann aber doch aus den einzelnen Personen immer nur wieder einzelne Personen. Es hätten also die Seelen der einzelnen Körper als einzelne in die einzelnen Körper zurückkehren müssen. Wenn sie nun aber zu je zwei, drei bis zu fünf in einen Mutterschooss Aufnahme finden, so entstehen nicht aus den Toten Lebendige, weil nicht je ein Individuum aus je einem. Auch dadurch findet die ursprüngliche Regel ihre Bestätigung, dass auch jetzt noch mehrere Seelen aus einer einzigen hervorgehen.</p><p>Da die Seelen in verschiedenem Lebensalter von hinnen scheiden, warum, frage ich da, kommen sie alle denn in demselben Alter wieder? Alle Geborenen befinden sich im Kindesalter. Was soll das aber heissen, dass ein verstorbener Greis als Kind zurückkehrt und seine Seele draussen in rückläufigem Alter abnimmt? Wie viel angemessener wäre es, wenn die Seelen tausend Jahre später vorangeschrittener zurückkämen, oder wenigstens in demselben Alter als bei ihrem Tode, um die abgebrochene Lebensperiode von neuem aufzunehmen!</p><p>Gesetzt auch, sie kämen immer als dieselben wieder, so müssten sie, wenn auch nicht dieselben Körperformen, so doch die vorigen Eigentümlichkeiten in den Geistesanlagen, Studien und Neigungen mit sich zurückbringen. Denn wenn sie dessen entbehren, woran man ihre Identität erkennt, so würde es ja ein übereiltes Urteil sein, sie für identisch zu halten. Woher weisst Du denn, wendet man mir ein, ob es nicht im Verborgenen doch so ist, aber der tausendjährige Zeitraum mag die Fähigkeit rauben, sie wiederzuerkennen, da es uns unbekannte sind, die zurückkehren. O bitte, ich weiss sehr wohl, dass es sich nicht so verhält, da es ja Pythagoras-Euphorbus ist, den man mir entgegenstellt. Denn siehe, Euphorbus ist, wie schon durch die Auszeichnung seiner zum Weihgeschenk gemachten Schilde zur Genüge feststeht, eine kriegerische und soldatische Seele gewesen. Pythagoras dagegen war so friedlich und unkriegerisch, dass er die damaligen Kämpfe in Griechenland vermeidend das ruhige Italien vorzog, ganz der Geometrie, Astronomie und Musik hingegeben, ganz fremd den Neigungen und Beschäftigungen des Euphorbus. Pyrrhus beschäftigte sich mit Überlistung der Fische, Pythagoras aber nicht einmal mit deren Verspeisung, da er sich von Tierischem enthielt. Äthalides und Hermotimus fielen über ihre Bohnen her als alltägliche Speise; Pythagoras dagegen lehrte seine Schüler, sie sollten nicht einmal an Bohnenpflanzungen vorübergehen. Wie wäre es also möglich, dass dieselben Seelen wieder angenommen würden, da sie sich weder nach ihren Anlagen noch durch Fertigkeiten und Lebensweise als dieselben ausweisen?</p><p>Von der grossen Anzahl Seelen aus Griechenland werden ferner nur vier angeführt. Und warum denn bloss solche aus der Schar der Griechen? Warum finden nicht aus jedem Volk, jedem Alter, jeder Lebensstellung und auch aus jedem Geschlecht täglich Metempsychosen und Metensomatosen statt? Warum erkennt sich Pythagoras allein als den oder den wieder und warum erkenne ich mich nicht auch? Oder wenn das ein Vorzug der Philosophen ist, und noch dazu der griechischen — als ob nicht die Scythen und Indier auch philosophierten — warum erinnert sich nicht Epikur, früher der und der gewesen zu sein, warum nicht Chrysippus, Zeno und nicht einmal Plato, den wir etwa für Nestor angesehen haben würden wegen seiner honigartigen Wohlredenheit?</p>
      <h2>32</h2><p>Empedokles freilich faselte davon, er sei ein Gott; deshalb glaube ich, verschmähte er es, die Erinnerung zu haben, dass er ein Heros gewesen sei, und erklärte: Ich war ein Strauch und ein Fisch. Warum nicht lieber, da er so ohne Salz war, auch eine Melone und, da er so aufgeblasen war, ein Chamäleon? Offenbar geschah es auch in seiner Eigenschaft als Fisch, dass er in den Ätna sprang, um sich lieber braten zu lassen, als in einem verborgenen Grabe zu verwesen. Vonda an mag es bei ihm mit der Metensomatosis wohl aus gewesen sein, wie eine sommerliche Mahlzeit mit dem Braten schliesst.</p><p>Wir müssen darum hier gegen einen noch ungeheuerlicheren Wahn ankämpfen, denjenigen, der auch Tiere aus Menschen und umgekehrt Menschen aus Tieren hervorgehen lässt. Mit den Sträuchern mag’s denn so bleiben. Wir brauchen dies nur im Fluge zu thun, um uns nicht veranlasst zu sehen, Spässe zu machen, statt zu belehren. Wir behaupten, die menschliche Seele kann auf keine Weise in Tiere übertragen werden, auch wenn sie, wie die Philosophen lehren, aus elementaren Substanzen ihren Anfang nähme. Entweder ist die Seele Feuer, Wasser, Blut, Hauch, Luft oder Licht, jedenfalls müssen wir bedenken, dass es Tiere gibt, welche diesen einzelnen Arten von Dingen entgegengesetzt sind, dem Feuer die kalten Tiere, die Schlangen, Eidechsen, Salamander und alle, welche aus dem entgegengesetzten Elemente hervorgehen, nämlich dem Wasser. Umgekehrt sind dem Wasser entgegengesetzt die trockenen und saftlosen; es freuen sich der Trocknis nämlich die Heuschrecken, Schmetterlinge und Chamäleone. Dem Blut sind die entgegengesetzt, welche dessen Röte entbehren, die Schnecken, Würmer und der grössere Teil der Fische, dem Hauche entgegengesetzt die, welche nicht zu atmen scheinen, die der Lungen und Luftröhren entbehren, die Mücken, Ameisen, Spinnen und die kleinen Tiere dieser Art, der Luft sind entgegengesetzt die, welche immer unter der Erde oder dem Wasser lebend des Einatmens derselben entbehren, dem Lichte entgegengesetzt die gänzlich blinden und die, welche nur Augen für die Finsternis haben, die Maulwürfe, Fledermäuse und Nachteulen. So viel, um nur aus offen daliegenden und bekannten Wesen Belehrung zu schöpfen.</p><p>Wollte ich die Atome des Epikur aufgreifen, auf die Zahlen des Pythagoras sehen, an die Ideen des Plato anrennen und mich der Entelechien des Aristoteles bemächtigen, so würde ich doch vielleicht auch Tiere finden, welche ich diesen Klassen von Dingen unter dem Titel der Gegenteiligkeit entgegensetzen könnte. Aus welcher von den genannten Substanzen auch die Seele bestehen möge, so hätte, behaupte ich, keine Wiederherstellung derselben in Tiere stattfinden können, die allen diesen Substanzen so sehr entgegengesetzt sind, und sie hätte sich infolge ihrer Überführung nicht können einer Klasse von Wesen anschliessen, bei denen sie anstatt einer Zulassung und Aufnahme Zurückweisung und Ausschliessung zu erwarten gehabt hätte, in kraft dieses ersten Gegensatzes, der eine Verschiedenheit des wesentlichen Zustandes behauptet, sodann auch in kraft der übrigen Gegensätze, die infolge der Entwicklung einer jeden Natur eintreten. Denn die menschliche Seele hat ganz andere Wohnsitze, Lebensweise, Ausstattung, Sinne, Affekte, Fortpflanzung und Nachkommenschaft erhalten; ebenso sind ihre Anlagen, Thätigkeiten, Freuden, Abneigungen, Laster, Begierden, Vergnügungen, Krankheiten, Arzneien, zuletzt auch ihre Lebensformen und Todesarten ganz eigentümliche.</p><p>Wie sollte also die Seele, welche, vor jeder Höhe und jeder Tiefe bange, an der Erde haftet, die durch blosses Treppensteigen zu ermüden und schon in einem Badebassin zu ersäufen ist, sich später als Adler in den Lüften schwenken oder sich als Aal im Meere herumtummeln können? Wie sollte sie, die an anständige, ausgesuchte und wohl zubereitete Nahrung gewöhnt ist, ich will nicht einmal sagen, Stroh, sondern sogar Disteln, bittere Feldkräuter, Mistkäfer und giftiges Gewürm verzehren können, wenn sie in eine Ziege oder in eine Wachtel gewandert ist; wie sollte sie, die sich denn doch immer ihrer selbst bewusst bleibt, vollends Aas, am Ende wohl gar menschliches verschlingen können, wenn sie in einem Bären oder Löwen steckt?! Auf ähnliche Weise wird man auch die übrigen Behauptungen der Ungereimtheit überführen. Wir wollen uns aber nicht länger bei Erörterung alles einzelnen aufhalten.</p><p>Was soll die Menschenseele dann, welches auch immer ihre Ausdehnung, welches auch ihr Umfang sein mag, in den Tierkörpern thun, die entweder, viel grösser oder viel kleiner sind als sie? Es ist notwendig, dass jeder Leib von seiner Seele ausgefüllt und jede Seele von ihrem Leibe bedeckt wird. Wie soll nun die Menschenseele einen Elefanten ausfüllen? Wie soll sie von einer Mücke bedeckt werden? Wenn sie um ebenso vieles ausgedehnt oder zusammengepresst werden muss, so wird es wahrhaftig mit ihr schlimm stehen. Darum füge ich hinzu: wenn sie auf keine Weise in Tierkörper übertragen werden kann, da diese ihr weder an Körpermaass noch hinsichtlich ihrer übrigen Naturgesetze entsprechen, wird sie sich dann eine den Eigenschaften, den Arten und der Lebensweise jener Tiere entsprechende Veränderung gefallen lassen, deren Lebensweise der menschlichen so ganz entgegengesetzt ist, und dadurch selbst etwas von einer Menschenseele gänzlich verschiedenes werden? Liesse sie aber eine solche Veränderung mit Verlust ihres frühern Seins zu, so würde sie auch nicht mehr sein, was sie früher war, und wenn sie das nicht mehr ist, so wäre damit die Metensomatosis abgethan und man dürfte sie natürlich einer Seele, welche infolge der geschehenen Veränderung nicht mehr existiert, nicht beilegen. Denn es könnte von einer Metensomatosis nur bei einem Dinge die Rede sein, welches, wenn es sie erlitte, doch in demselben Zustande bliebe.</p><p>Wenn die Seele also keine Veränderung erleiden kann, um nicht ihre Identität einzubüssen, noch auch in demselben Zustande verharren, weil dieser so Entgegengesetztes nicht zulässt, so suche ich nach irgend einer glaubhaften Ursache einer solchen Übertragung. Wenn manche Menschen auch in Hinsicht ihrer Sitten, Anlagen und Neigungen mit den Tieren auf gleicher Stufe stehen und Gott selbst spricht: „Der Mensch ist gleich geworden vernunftlosen Tieren”, so brauchen darum doch nicht aus Räubern Habichte, aus geilen Menschen Hunde, aus streitsüchtigen Panther, aus rechtschaffenen Schafe, aus geschwätzigen Schwalben, aus schamhaften Tauben zu werden, als wenn die Seelensubstanz in den Eigenschaften der Tiere ihre Natur überall wiederholte. Etwas ganz anderes als die Substanz ist die Natur der Substanz. Die Substanz ist für jede Sache eine besondere, die Beschaffenheit aber kann eine gemeinschaftliche sein. Sieh dich nach einem Beispiel um! Der Stein und das Eisen sind Substanzen, Härte ist die Natur des Steines sowie der Eisensubstanz. Die Härte stimmt überein, die Substanz ist unterschieden. Weich ist die Wolle und weich die Feder; ihre natürlichen Eigenschaften sind gleich, ihre Wesenheiten nicht. So kann dem Menschen der Name eines wilden Tieres oder auch eines sanften gegeben werden, aber die Seelen beider sind doch nicht dieselben. Die Ähnlichkeit der Natur wird gerade dann hervorgehoben, wenn man eine Verschiedenheit der Substanzen wahrnimmt. Eben dadurch, dass man einen Menschen mit einem wilden Tiere gleichstellt, gesteht man zu, ihre Seelen seien nicht dieselben. Man nennt sie ja ähnlich, nicht identisch. So lautet auch der Ausspruch Gottes, der den Menschen dem Vieh gleichstellt in Hinsicht seiner Beschaffenheit, nicht seiner Substanz. Gott würde den Menschen nicht auf diese Weise getadelt haben, wenn er wusste, dass derselbe seiner Substanz nach ein Vieh sei.</p>
      <h2>33</h2><p>Auch wenn dieser Lehrsatz durch eine Berufung auf das Gericht gestützt und gesagt wird, die menschlichen Seelen würden je nach ihrem Lebenswandel und Verdienst für eine entsprechende Tierart bestimmt — die, welche abgewürgt werden müssten, seien alle im Schlachtvieh, die unter das Joch zu bringenden, im Lastvieh, die abzutreibenden im Arbeitsvieh, die schnöde Behandlung verdienen, im unreinen Vieh, umgekehrt, die in Ehren zu halten, zu liebkosen, zu pflegen und zu begehren wären, befänden sich alle in zierlichen, treuen, nützlichen und zärtlichen Tierarten — auch dann würde ich sagen, wenn sie verändert werden, so wird ihnen nicht in ihrer eigenen Person vergolten, was sie verdienen, und der Begriff Gericht wird illusorisch, wenn das Gefühl der Vergeltung fehlt. Sie wird nicht gefühlt, wenn der Zustand der Seelen gewechselt hat; der Zustand der Seelen aber wechselt, wenn sie nicht dieselben bleiben. Bestehen sie in ähnlicher Weise fort für das Gericht, was auch der ägyptische Merkurius lehrt, indem er sagt: „Die aus dem Körper geschiedene Seele fliesst nicht in die Allseele zurück, sondern bleibt in ihrer Besonderheit bestehen, damit sie”, sind seine Worte, „dem Vater Rechenschaft über das gebe, was sie im Leibe gethan hat” — so will ich doch an die Gerechtigkeit, Strenge, Majestät und Würde des göttlichen Gerichts erinnern und zu bedenken geben, ob dann nicht die menschliche Art zu urteilen durch Achtbarkeit ihrer beiderlei Sentenzen, der strafenden sowohl als der belohnenden, weil strenger im Ahnden und liberaler im Nachlassen, vor jener bei weitem den Vorzug habe.</p><p>Was soll aus der Seele eines Mörders werden? Vermutlich ein Vieh, das für die Schlachtbank und den Metzger bestimmt ist, damit sie gerade so abgewürgt werde, wie sie abgewürgt hat, abgehäutet werde, wie sie geplündert hat, und auch zur Speise vorgesetzt werde, weil sie die in Wäldern und unwegsamen Gegenden Ermordeten den wilden Tieren preisgegeben hat. Wenn des Mörders Seele hierzu verurteilt wird, so weiss ich nicht, ob es ihm nicht mehr zum Troste als zur Strafe gereicht, durch gut bezahlte Köche seine Bestattung zu finden, nach Vorschrift eines Apicius und Lurco in Gewürzen begraben, auf Ciceronianische Tische gestellt, in glänzenden Sullanischen Schüsseln aufgetragen zu werden, sein Leichenbegängnis durch ein Gastmahl zu finden, von seinesgleichen und nicht von Habichten und Wölfen verspeist zu werden. Im Körper eines Menschen begraben und in sein eigenes Geschlecht zurückgekehrt, würde er so eine Auferstehung zu feiern scheinen und im Vergleich damit die Urteilssprüche der Menschen, wenn er sie je erfahren haben sollte, verlachen. Denn diese lassen den Mörder durch verschiedene auserlesene und gegen ihre Natur abgerichtete Bestien zerreissen, und zwar lebendig; das Sterben wird ihm nicht leicht gemacht, sondern sein Ende verzögert zur Vervollständigung der Strafe. Selbst wenn seine Seele schon entflohen sein sollte, bevor das Schwert ihm den Garaus macht, so wird sein Leib dem Eisen damit noch nicht entronnen sein. Es wird ihm trotzdem noch Kehle, Bauch und Brustkasten durchbohrt und dadurch Vergeltung für seine Schandthat geübt. Dann wird er dem Feuer übergeben, damit er auch um das Begräbnis gestraft werde. Anders geht es nicht. Auch die Sorgfalt bei seiner Verbrennung ist nicht gross, so dass andere Tiere die Überreste finden, wenigstens wird mit seinen Gebeinen keine Schonung und mit seiner Asche, die mit Nacktheit bestraft werden muss, keine Nachsicht geübt. Die Bestrafung des Mordes von seiten der Menschen ist so schwer, als die Natur selbst, welche gerächt wird, für erhaben angesehen wird. Wer würde da nicht die Gerechtigkeit dieser Welt höher stellen, von welcher auch der Apostel bezeugt, dass sie nicht umsonst mit dem Schwerte bewehrt sei, und welche durch ihre zum Wohle der Menschen geübte Strenge Ehrfurcht einflösst!?</p><p>Denken wir an die Art und Weise, die übrigen Verbrechen zu ahnden, an die Kreuze, das Lebendigverbrennen, die Säcke, die Krallen, die Felsen, so frage ich, käme man nicht besser davon, wenn man sein Urteil nach Pythagoras oder Empedokles litte? Denn auch die, welche, um durch Arbeiten und Frondienste bestraft zu werden, in Leibern von Eseln oder Maultieren wieder kommen, wie werden sie sich zu den Tretmühlen und Wasserschöpfrädern Glück wünschen, wenn sie sich an die Bergwerke, Arbeitshäuser und öffentlichen Zwangsarbeiten erinnern, ja selbst an die einfachen Kerker, wo man nicht arbeitet!</p><p>Für die Leute, denen ihre unbescholtenen Sitten beim Richter zur Empfehlung ihres Lebens gereichen sollten, sehe ich mich nach Belohnungen um, finde aber umgekehrt für sie nur Strafen. Freilich, es ist eine grosse Gunst für die Guten, in irgend ein Tier verwandelt zu werden! Wie den Ennius träumte, erinnerte sich Homer, ein Pfau gewesen zu sein. Ich glaube den Poeten noch nicht einmal, wenn sie wachen. Obwohl der Pfau ein sehr schönes Tier und mit allen Farben geschmückt ist, sein Gefieder ist stumm, ja, seine Stimme missfällt sogar, während die Poeten an nichts mehr Gefallen finden als am Singen. Demnach ist Homer in einen Pfau nicht begnadigt, sondern verurteilt. Er würde über eine ihm von der Menschenwelt zugeteilte Belohnung grössere Freude empfinden, da er als Vater der geistigen Bildung gilt, und die Zierde seines Ruhmes ist ihm lieber als ein Schweif. Gut nun, gesetzt, die Poeten gingen in Pfauen und Schwäne über, da die Schwäne wenigstens eine ausgezeichnete Stimme haben, welchen Tierleib wird man den Äacus anziehen lassen, diesen so gerechten Mann? In welche Bestie die Dido kleiden, dieses so untadelhafte Weib? Welcher Vogel wird für die Geduld, welches Vieh für die Heiligkeit, welcher Fisch für die Unschuld bestimmt sein? Sie alle sind bestimmt, dem Menschen zu dienen, ihm unterthänig und sein eigen zu sein. Wird jemand in eins von ihnen verwandelt, so wird dadurch einer degradiert, dem man wegen der Verdienste während seines Lebens Bilder, Statuen, Ehrentitel, öffentliche Auszeichnungen und Privilegien zuerkennt, dem die Kurie und das Volk seine Huldigungen darbringt. Ach, die göttlichen Urteile nach dem Tode wären dann trügerischer als die der Menschen, zu leicht in ihren Strafen und widerlich in ihren Belohnungen! Von den Bösen würden die ersteren nicht gefürchtet, von den Guten die letzteren nicht begehrt; die Verbrecher würden ihnen eifriger nachlaufen als die Heiligen; jene, um der Gerechtigkeit der Menschenwelt schneller zu entgehen, diese, um sie desto später zu erlangen.</p><p>Das ist mir eine schöne Lehre, eine erspriessliche Überzeugung, die Ihr Philosophen uns gebt, die Strafen und Belohnungen nach dem Tode seien geringer, während das Gericht, welches etwa der Seelen wartet, bei der Abrechnung für das Leben doch für strenger gehalten werden muss als das während seiner Führung. Denn das Letzte ist immer das Vollständigste, nichts aber ist vollständiger als das Göttliche. Daher wird Gott das vollständigste Gericht halten, weil es das letzte ist, und einen ewigen Urteilsspruch thun sowohl hinsichtlich der Strafe als des Lohnes, nicht für Seelen, die in Tierleiber, sondern für Seelen, die in ihre eigenen Leiber zurückkehren, und zwar ein- für allemal, für den Tag, den nur der Vater allein kennt, damit in schwebender Erwartung der bange Glaube bewährt werde, der immer den Tag erwartet, den er niemals kennt, und der täglich fürchtet, was er täglich hofft.</p>
      <h2>34</h2><p>Als Häresie ist bis jetzt keine dieser verrückten Theorien, welche die menschlichen Seelen in Bestien wiederkehren lassen, aufgetreten. Trotzdem war es notwendig, auch sie herbeizuziehen und abzuweisen, weil sie mit den vorigen zusammenhängen, damit sowohl Homer in seinem Pfau als Pythagoras im Euphorbus fortgejagt werde. Indem in solcher Weise die Metempsychose und Metensomatose zurückgewiesen wurde, ist wiederum etwas aus dem Felde geschlagen, was den Häretikern irgendwelchen Stoff geliefert hat.</p><p>Der Samariter Simon nämlich, aus der Apostelgeschichte bekannt als Käufer des hl. Geistes, wandte sich, nachdem er von diesem samt seinem Gelde verdammt, seinen Untergang erfolglos beweint hatte, der Bekämpfung der Wahrheit gleichsam als einer trostvollen Rache zu und stützte sich dabei auch auf seine Kunstfertigkeit. Für dasselbe Geld kaufte er sich aus einer öffentlichen Lasterhöhle eine gewisse Helena aus Tyrus — für ihn eine passende Entschädigung statt des hl. Geistes — um Taschenspielerkünste einer bekannten Art auszuüben. Sich selbst gab er für den höchsten Vater aus, jene Person aber für seine erste Eingebung, durch die ihm eingegeben worden sei, die Engel und Erzengel zu erschaffen. Im Besitze dieses Ratschlusses sei sie dem Vater entsprungen, in die niederen Regionen herabgestiegen und habe hier, dem Ratschluss des Vaters zuvorkommend, die Engelmächte erzeugt, welche vom Vater, dem Baumeister der Welt, nichts wussten, sei von ihnen aber aus Missgunst zurückgehalten worden, damit sie nicht, wenn jene weggegangen wäre, für Geschöpfe des andern gehalten würden. So sei ihr denn jegliche Schmach angethan worden, damit sie, um alles Ansehen gebracht, keine Lust mehr habe, irgendwo anders hinzugehen, sie sei sogar in eine menschliche Gestalt eingeschlossen worden, damit sie so gleichsam durch die Bande des Fleisches festgehalten werde. So habe sie sich viele Jahrhunderte hindurch in immer wechselnden weiblichen Gestalten herumgetrieben und sei die für Priamus und später für die Augen des Stesichorus so verhängnisvolle Helena gewesen. Letztern habe sie wegen eines Schmähgedichtes geblendet, nachher aber, als sie durch ein Lobgedicht Genugthuung empfangen, ihn wieder sehend gemacht. Sodann habe sie, aus einem Körper in den andern wandernd, als Helena geringerer Sorte in äusserster Schmach, unter einem Aushängeschild Prostitution getrieben.</p><p>Diese Person nun sei das verlorene Schaf, zu welchem der oberste Vater, Simon nämlich, herabgestiegen sei; er habe es zuerst wieder erworben und zurückgebracht, ob auf den Schultern oder auf dem Schoosse, ist zweifelhaft. Sodann habe er das Heil der Menschen erwogen, um sie aus der Gewalt jener Engel zu erretten, sozusagen zur Strafe für letztere. Um sie zu täuschen, habe er selbst die gleiche Gestalt angenommen, den Menschen einen Menschen vorgelogen und in Judäa den Sohn, in Samaria aber den Vater gespielt.</p><p>O über diese Helena, die sowohl von den Poeten als von den Propheten zu leiden hat, dort wegen ihres Ehebruches, hier wegen ihrer Hurerei berüchtigt ist! Nur ist es anständiger, sie aus Troja herauszuholen als aus dem Hurenhause. Schäme Dich, Simon, so langsam mit Deinem Herausholen und so unbeständig im Festhalten! Menelaus hat der Verlorenen wenigstens sogleich nachgesetzt und sofort die Entführte zurückverlangt; durch einen zehnjährigen Krieg erzwingt er sie sich, ohne Hinterhalt, Betrug und Sophisterei. Ich möchte eher glauben, jener sei der Vater, da er für Wiedererlangung der Helena mit mehr Wachsamkeit, Kühnheit und Ausdauer gearbeitet hat.</p>
      <h2>35</h2><p>Simon ist es aber nicht allein, dem die Metempsychose auf eine solche Fabel verholfen hat. Auch Karpokrates macht davon Gebrauch, ebenfalls ein Magier und ein Hurer, wenn auch um die Helena ärmer als Simon. Oder etwa nicht? Hat er doch behauptet, die Seelen müssten deshalb wieder in Leiber zurückversetzt werden, damit sich ein gänzlicher Umsturz der göttlichen und menschlichen Ordnung vollziehe. Denn keinem werde dieses Leben angerechnet, wenn er nicht alles, was man als Schuld bezeichnet, durchgemacht habe, weil nichts an sich schlecht sei, sondern nur in der Meinung der Menschen. Daher stehe uns die Metempsychose mit Notwendigkeit bevor, wenn man nicht gleich beim ersten Verweilen in diesem Leben in allem Unerlaubten Genüge leiste. Missethaten seien nämlich ein notwendiger Tribut vom Leben. Die Seele habe so oft die Rückkehr zu erwarten, als sie zu wenig mitbringe und noch mit Sündigen im Rückstande sei; sie werde so oft in den Kerker des Leibes verstossen, als sie den letzten Heller noch nicht bezahlt habe.</p><p>Hierauf bezieht er nämlich diese ganze Allegorie des Herrn, deren Deutung doch so klar und sicher und die zuvörderst buchstäblich zu verstehen ist. „Unser Widersacher” ist nämlich der Heide, der auf demselben gemeinsamen Lebenswege einhergeht. Wir müssten sonst aus der Welt hinausgehen, wenn wir mit ihm nicht umgehen dürften. Diesem also heisst uns der Herr die Wohlthat des Geistes erteilen. „Liebet Eure Feinde und betet für die, so Euch fluchen”, sagt er nämlich, damit uns nicht einer, bei irgend einem Handelsgeschäfte durch Verluste gereizt, vor seinen Richter schleppe, und wir, ins Gefängnis geworfen, zur Bezahlung der ganzen Schuld angehalten werden. Wenn dann unter dem „Widersacher” der Teufel verstanden wird wegen seines uns stets verfolgenden Auflauerns, so wird man damit ermahnt, auch mit ihm in jenes Vertragsverhältnis zu treten, welches seit dem Bunde des Glaubens gilt. Wir haben ja versprochen, ihm, seiner Pracht und seinen Engeln zu widersagen. Hierüber seid Ihr unter einander übereingekommen. Darin wird unsere Freundschaft bestehen, die auf der Beobachtung des Versprechens beruht, hinterher nichts von dem wieder aufzunehmen, was man abgeschworen, was man ihm zurückgegeben hat, damit er uns nicht vor dem göttlichen Richter Betrug und Übertretung des Vertrags vorwerfe — wie wir lesen, dass er anderwärts den Ankläger der Heiligen gemacht habe schon wegen seines Namens Diabolus, Verleumder, — und damit der Richter uns nicht seinem Gerichtsengel übergebe und dieser uns nicht in den Kerker, die Unterwelt, bringe, von wo man nicht wird entlassen werden, bis auch die geringste Sünde durch Hinausschiebung der Auferstehung bezahlt ist.</p><p>Was ist passender als diese Deutung, was zutreffender als diese Auslegung? Wenn die Seele aber nach Karpokrates alle Schandthaten zu begehen schuldig ist, wer soll dann unter ihrem Feinde und Gegner zu verstehen sein? Am Ende wohl der gute Geist, der in sie ein wenig Unschuld hineingelegt hat, um sie wieder und wieder in Körper zu verstossen, bis sie des Wohlverhaltens in nichts mehr schuldig befunden wird. Das hiesse an den schlechten Früchten den guten Baum erkennen, nämlich die schlechtesten Gebote als Lehren der Wahrheit anerkennen.</p><p>Es ist zu erwarten, dass diese Häretiker sich auch des Elias als Beispieles bemächtigen, als sei er in Johannes in einer Weise wieder erschienen, dass der Ausspruch des Herrn der Seelenwanderung günstig wird: „Elias ist schon gekommen und sie haben ihn nicht erkannt”; und anderswo: „Wenn Ihr hören wollt, hier ist der Elias, der kommen soll.” Haben also die Juden im Sinne der Pythagoräer den Johannes gefragt: „Bist Du Elias?” und nicht vielmehr infolge der göttlichen Verheissung: „Siehe, ich will Euch Elias senden, den Thesbiter.” Bei den Pythagoräern bedeutet Seelenwanderung die Zurückrufung einer Seele, die längst verstorben ist und in einen andern Körper einkehrt. Elias aber hat das Leben gar nicht verlassen, sondern wird aus einer Entrückung zurückkommen. Er soll auch nicht dem Körper wiedergegeben werden, da er nicht ihm entrissen ist, sondern wird nur wieder in die Welt zurückversetzt, aus welcher er entrückt wurde, nicht um sein Heimatsrecht am Lehen zu behaupten, sondern um seine Prophezie zu vervollständigen, derselbe und kein anderer, sowohl dem Namen als der Person nach.</p><p>Aber inwiefern ist denn Johannes ein Elias? — Wir haben das Wort des Engels: „Er wird vor ihm hergehen vor dem Volke in der Macht und dem Geiste des Elias”, nicht aber in dessen Seele und Leibe. Denn dies sind die Substanzen, die einem jeden Menschen besonders angehören. Geist aber und Macht werden von aussen hinzugegeben durch die Gnade Gottes. Daher können sie auch auf einen andern übertragen werden durch den Willen Gottes, wie es früher mit dem Geiste des Moses geschehen ist.</p>
      <h2>36</h2><p>Zu diesen abschweifenden Erörterungen sind wir nach meinem Dafürhalten von dem Punkte aus gelangt, zu welchem wir nunmehr wieder zurückkehren müssen. Wir hatten festgestellt, dass der Keim der Seele in einem Menschen und durch einen Menschen gelegt werde, und dass von Uranfang ein bestimmter Same dafür existiere, sowie auch für das Fleisch, und zwar für den gesamten Schwarm der Menschheit. Dies war, wohlgemerkt, geschehen wegen der entgegenstehenden Meinungen der Philosophen, Häretiker und jenes alten Gespräches bei Plato. Jetzt setzen wir die Reihenfolge der daraus sich ergebenden Verhandlungen fort.</p><p>Die Seele empfängt, nachdem ihr Same im Mutterschoosse in gleicher Weise wie beim Fleisch gelegt ist, in gleicher Weise wie das Fleisch auch ihr Geschlecht, so dass in Sachen des Geschlechtes keine von beiden Substanzen aufgehalten ist. Denn wenn für die eine oder andere Substanz bei der Empfängnis irgend ein Zwischenraum in der Samenlegung zulässig wäre und entweder das Fleisch oder die Seele zuerst ausgesäet würde, so müsste es geschehen, dass sie der andern Substanz ihr besonderes Geschlecht vorschriebe, infolge der Zwischenzeit nach der Samenlegung, und es würde entweder der Leib der Seele oder die Seele dem Leibe die geschlechtliche Eigentümlichkeit aufdrücken, weil ja auch Apelles, nicht der Maler, sondern der Häretiker, indem er männliche und weibliche Seelen vor den Leibern annimmt, wie er von seiner Philumena erfahren hatte, den Leib als das spätere sein Geschlecht von der Seele empfangen lässt. Diejenigen hingegen, welche die Seele erst nach der Geburt in den Leib gelangen lassen, als in das zuerst Gebildete, die lassen durch den Leib der Seele die männliche oder weibliche Geschlechtseigentümlichkeit vorgeschrieben werden.</p><p>Allein die ungesonderten Samenkeime beider Substanzen und deren gleichzeitige Zusammenschüttung erheischen es auch, dass die Erteilung der Geschlechtseigentümlichkeit gemeinsam erfolge, je nachdem der Plan der Natur, welcher es auch immer sei, seine Grundlinien gezeichnet hat. Sicherlich gibt sich auch hier die uranfängliche Regel zu erkennen, indem das männliche Wesen schneller gebildet wird — denn Adam war früher da, — das weibliche aber ein wenig langsamer; denn Eva war die Spätere. Somit war sie lange Zeit hindurch eine gestaltlose Fleischmasse, als welche sie aus der Seite Adams entnommen wurde; ein lebendes Wesen aber war auch sie schon, weil ich auch in jener Zeit in ihr einen Teil von Adams Seele als ihre Seele anerkenne. Sonst, wenn sich im Weibe nicht ein Ableger der Seele so gut wie des Leibes aus Adam befunden hätte, würde auch sie durch den Hauch Gottes belebt worden sein.</p>
      <h2>37</h2><p>Sämtliche Vorgänge bei der Aussaat, der Zusammenfügung und Bildung des Menschen im Mutterleibe leitet natürlich eine gewisse Macht, die dem göttlichen Willen dient und die bestimmt ist, alles dahin Gehörige in Bewegung zu setzen. Dieses erkennend hat der römische Wahnglaube die Göttin Alemona ersonnen, um den Fötus im Mutterleibe zu ernähren, sodann die Göttinnen Nona und Decima, von wegen der stärkere Besorgnisse erweckenden Monate, die Partula, welche die Entbindung leitet, und die Lucina, welche den Fötus an das Licht bringt. Wir dagegen glauben, dass diese göttlichen Obliegenheiten von Engeln verrichtet werden. Von dem Zeitpunkte an ist also der Fötus im Mutterschoosse ein Mensch, von wo an seine Form vollständig ist. Denn das Gesetz Moses’ unterwirft den, der eine Frühgeburt verschuldet, dem Gesetz der Vergeltung, da es sich bereits um einen Menschen handelt, die Verhältnisse von Leben und Sterben bereits auf denselben Anwendung finden und auch das Schicksal bereits auf ihn einwirkt, wenn er in der Regel auch nur das Schicksal seiner Mutter teilt, so lange er noch in der Mutter lebt,</p><p>Um nach der Ordnung zu verfahren, will ich auch etwas über die Zeit der Entstehung der Seele sagen. Die regelmässige Zeit der Geburt ist gewöhnlich der Anfang des zehnten Monats. Die, welche Gewicht auf die Zahlen legen, halten auch wohl den <em>Numerus decurialis</em>, die Zahl Zehn als Stammmutter der übrigen und sogar als Vervollkommenerin der menschlichen Geburt in Ehren. Ich hingegen deute dieses Zeitmass mehr auf Gott. Die zehn Monate weisen also vielmehr den Menschen für den Dekalog ein, so dass wir in einem mit derselben Zahl bemessenen Zeitraume geboren werden, wie er der Wiedergeburt durch die Disziplin entspricht. Da auch mit sieben Monaten die Geburt schon eine reife ist, so erkenne ich darin leichter als beim achten die Ehre des Sabbats wieder, so dass das Ebenbild Gottes manchmal am ebensovielten Monate das Licht erblickt, als am wievielten Tage die Schöpfung ihre Weihe erhielt. Es ist der Geburt verstattet, der Zeit vorauszueilen, und demnach ganz passend mit der Woche zusammenzutreffen, zur Vorbedeutung der Auferstehung, Ruhe und Herrschaft. Daher bringt die Achtzahl uns nicht hervor; denn dann werden keine Hochzeiten sein.</p><p>Das Beisammensein von Leib und Seele vom Zusammentritt der Samenkeime an bis zur Vollendung des Gebildes haben wir eben schon gezeigt. Jetzt behaupten wir dasselbe ebenso nach der Geburt, vorzüglich deshalb, weil sie zusammen wachsen, jedoch in verschiedener Weise, je nach ihrer Beschaffenheit und Art, der Leib dem Maasse, die Seele der Anlage nach, der Leib hinsichtlich der Haltung, die Seele hinsichtlich der Erkenntnis. Ein Wachstum der Seele der Substanz nach muss man aber in Abrede stellen, um nicht auch ein Abnehmen der Substanz nach aussagen und so auch an ein Verschwinden glauben zu müssen. Ihre Kraft, in welcher die natürlichen mitentstandenen Gaben verbleiben, produziert sich vielmehr allmählich mit dem Leibe, wobei das kleine Maass der Substanz, welches von Anfang an eingehaucht ist, unverändert bleibt. Nimm ein bestimmtes Gewicht Gold oder Silber, eine noch ungefügige Masse! Es ist seinem Aussehen nach noch zusammengedrückt und kleiner als späterhin; dennoch schliesst es in den Grenzlinien seines geringen Umfanges alles das ein, was zur Natur des Goldes oder Silbers gehört. Sodann aber, wenn die Masse zu einem Blech ausgedehnt wird, wird sie grösser als anfangs, infolge der Ausdehnung des bestimmten Gewichtes, nicht durch Hinzuthun, indem sie ausgedehnt, nicht indem sie vermehrt wird. Sie wird zwar auch dann vermehrt, wenn man sie ausdehnt; denn man kann sie auch für den blossen Anblick vermehren, obwohl man es in der Sache nicht kann. Dann tritt erst der eigentliche Gold- oder Silberglanz hervor, der sich in der Masse allerdings auch befand, aber verdunkelt, indes doch immerhin vorhanden. Sodann treten immer andere Erscheinungsformen ein, je nach der Bildsamkeit der Materie, und je nachdem sie der gestaltet, der sie treibt, der zur Masse gleichwohl nichts hinzuthut als die Gestalt. So ist auch das Wachstum der Seele anzusehen, nicht als ein wesentliches, sondern als ein hervorgerufenes.</p>
      <h2>38</h2><p>Wir haben oben den Nachweis vorausgeschickt, dass alle Natureigentümlichkeiten der Seele, die sich auf die sinnliche Wahrnehmung und den Intellekt beziehen, der Substanz selbst anhaften, und zwar von dem ungewordenen Ursprunge der Seele her, dass sie aber allmählich fortschreiten, entsprechend den Altersstufen, und sich infolge unwesentlicher Umstände verschieden entwickeln, je nach den Fertigkeiten, Anleitungen, Örtlichkeiten und herrschenden Leidenschaften, was jedoch alles für die hier aufgestellte Verbindung von Leib und Seele spricht. — Ebenso behaupten wir, dass die geistige Pubertät mit der körperlichen zusammentreffe, jene durch Zunahme der Anschauungen und diese durch Ausbildung der Glieder ungefähr vom vierzehnten Jahre an in gleicher Weise beginne; nicht aus dem Grunde, weil Asklepiades die Weisheit von da an datiert, auch nicht weil die bürgerlichen Rechte den Menschen von da an zum Betriebe von Geschäften geeignet machen, sondern weil diese Einrichtung uranfänglich so bestand.</p><p>Wenn Adam und Eva nach erlangter Erkenntnis von Gut und Böse die Notwendigkeit fühlten, die Schamteile zu bedecken, so bekennen wir uns zur Erkenntnis von Gut und Böse, sobald wir das Gleiche empfinden. Von diesen Jahren an ist das Geschlechtsleben erregter und versteckter, die Begierde bedient sich fleissig der Augen zum Beobachten und teilt ihr Wohlgefallen mit; sie wird inne, wozu dies und jenes da ist, und die betreffenden Stellen des Körpers bedecken sich nach Analogie der Feigenblätter. Sie führt den Menschen aus dem Paradiese der Unschuld heraus und ist von da an lüstern nach ferneren Sündenschulden, bis zur Begehung von Dingen, die widernatürlich sind, weil nicht mehr Folgen eines Triebes, sondern eines Fehlers der Natur.</p><p>Die einzige im eigentlichen Sinne der Natur entsprechende Begierde ist der Nahrungstrieb, den Gott auch schon uranfänglich erteilt hat: „Von jedem Baume”, sagte er, „sollt ihr essen”. Der zweiten Schöpfung nach der Sündflut gab er ein noch reichlicheres Maass: „Siehe, ich habe euch alles zur Speise gegeben, wie das Kraut des Feldes,” indem er Vorsorge traf, nicht sowohl für die Seele als für den Leib, wenn auch wegen der Seele. Denn man muss der verkehrten Argumentation vorbeugen, die, weil die Seele anscheinend Nahrung begehrt, sie aus diesem Grunde auch für sterblich angesehen wissen will, da sie durch Speise erhalten, durch deren Versagung geschwächt und zuletzt durch deren gänzliche Entziehung getötet werde. Man darf dabei nicht bloss hervorheben, wer es ist, der Speise begehrt, sondern auch für wen; wenn seinetwegen, dann auch, warum, wann und wie lange; sodann, dass es etwas ganz anderes ist, sie kraft der eigenen Natur zu begehren, als aus Zwang infolge seiner Eigentümlichkeit und zu einem bestimmten Zwecke. Die Seele wird also für sich Speise begehren aus Zwang, für den Leib hingegen wegen dessen natürlicher Eigentümlichkeit. Der Leib ist doch sicher das Haus der Seele und die Seele die Bewohnerin des Leibes. Die Bewohnerin wird aus gutem Grunde und mit Notwendigkeit während der ganzen Mietzeit nach dem begehren, was dem Hause nutzt, nicht als wäre sie selbst zu erbauen, zu schirmen und zu schützen, sondern wie eine, die zu beherbergen ist, weil sie nicht anders beherbergt werden kann, als in einem wohl versicherten Hause. Nachdem das Haus, seiner Stützen beraubt, eingestürzt ist, stellt es der Seele frei, sich unbeschädigt zu entfernen, da sie ihre besondere Grundlage und die ihrer eigentümlichen Beschaffenheit zukommende Nahrung besitzt, die Unsterblichkeit, die Vernunftthätigkeit, die Wahrnehmung, das Erkenntnisvermögen und den freien Willen.</p>
      <h2>39</h2><p>Alle diese Gaben, die der Seele von der Geburt an zuerteilt sind, sucht der, für welchen sie bei Anbeginn ein Gegenstand des Neides waren, auch jetzt zu verdunkeln und zu verderben, damit sie nicht Gegenstand einer grössern Vorsorge oder so angewendet werden, wie es sich gehört. Denn wo wäre ein Mensch, dem sich nicht der böse Geist, der von der Schwelle der Geburt an die Seelen zu fangen sucht, zugesellte, eingeladen vielleicht sogar noch auf irgend eine Weise durch all den Aberglauben, der bei den Entbindungen geübt wird? So werden ja alle unter Anwendung von Idololatrie zur Welt geboren, indem schon der Mutterleib selbst, umwunden mit Binden, die in der Nähe der Idole verfertigt wurden, bekennt, dass die Dämonen auf seine Frucht ein Anrecht haben, indem bei der Entbindung die Rufe: Lucina und Diana ausgestossen werden, die ganze Woche hindurch der Juno ein Tisch gedeckt wird, am letzten Tage die Fata Scribunda angerufen werden und das erste Stellen des Kindes auf die Erde der Göttin Statina geheiligt ist. Wer gelobt nicht sodann das ganze Haupt seines Kindes dem Frevel, oder nimmt nicht ein Haar, zerschneidet es mit dem Rasiermesser, weiht es zu einem Opfer und besiegelt es mit einer Weihe, entsprechend der Devotion der Gens, der Ahnen, der öffentlichen oder Privatverehrung.</p><p>So hatte der dämonische Geist den Sokrates schon als Knaben ausfindig zu machen gewusst. So werden allen Kindern Genien beigegeben, welches die Bezeichnung einer Art Dämonen ist. Also fast keine Geburt bleibt rein; denn sie ist heidnisch. Darum sagt der Apostel, dass, wenn beide Geschlechter geheiligt seien, Heilige daraus hervorgehen, sowohl infolge eines Vorrechtes ihres Samens als auch der Anleitung zur Sittlichkeit. Sonst würden sie, sagt er, als Unreine geboren werden, gleich als wollte er die Kinder der Gläubigen als zur Heiligkeit und darum auch als zum Heile bestimmt angesehen wissen, um die Ehe, welche er beizubehalten vorgeschrieben hatte, durch das Unterpfand dieser Hoffnung in Schutz zu nehmen. Im übrigen ist er des Ausspruches des Herrn eingedenk geblieben: „Wenn jemand nicht geboren werden wird aus dem Wasser und dem hl. Geiste, so wird er nicht eingehen in das Reich Gottes,” d. h. er wird kein Heiliger sein.</p>
      <h2>40</h2><p>So ist jede Seele so lange bei Adam eingetragen, bis sie auf Christus übertragen wird, so lange unrein, bis sie übertragen wird. Sie ist aber sündig, weil unrein, und speit ihre Schande auch auf das Fleisch hinüber infolge ihrer Verbindung damit. Denn, obschon das Fleisch sündig ist und uns nach dem Fleische zu wandeln verboten wird, seine Werke, wenn es gegen den Geist gelüstet, verdammt und um seinetwillen als fleischlich getadelt werden, so ist doch das Fleisch nicht an und für sich infam. Denn es hat nicht aus eigener Kraft Urteil und Verstand, zur Sünde zu raten oder sie zu befehlen. Warum nicht? Es hat ja lediglich eine dienende Stellung, und zwar einen Dienst, nicht wie ein Sklave oder geringerer Freund, sondern nur wie ein Trinkgefäss oder sonst ein Gegenstand der Art; als Leib, nicht als Seele. Der Becher steht im Dienste des Trinkenden; allein wenn der Durstige sich den Becher nicht zurecht macht, so wird er ihm nichts helfen. So beruht keine der Eigentümlichkeiten der Menschen in dem Stofflichen, und der Mensch ist nicht, in der Weise Fleisch, als wäre dasselbe eine andere Seelenkraft oder andere Person, sondern es ist ein Ding von ganz anderer Wesenheit und anderer Beschaffenheit, aber der Seele beigegeben, wie ein Hausrat oder Gerät zu den Verrichtungen des Lebens. Das Fleisch wird in der heiligen Schrift gescholten, weil die Seele ohne das Fleisch nichts vermag in Ausübung von Wollust, Schlemmerei, Trunksucht,Grausamkeit, Götzendienst und in den sonstigen fleischlichen, nicht Gesinnungen, sondern Thaten. Darum werden sündhafte Gedanken, die ohne Effekt geblieben sind, gewöhnlich der Seele zugerechnet. „Wer ansieht, um zu begehren, der bricht im Herzen schon die Ehe.” Was würde das Fleisch aber umgekehrt in Bethätigung der Rechtschaffenheit, Gerechtigkeit, Geduld und Keuschheit vermögen ohne die Seele? Nichts. Was soll es nun heissen, demjenigen, dem man nicht einmal die Beweise von Güte als ihm gehörig zuschreibt, die Vergehungen aufzubürden? Nein, das, womit gesündigt wird, das wird angeklagt, nur damit das eigentlich Sündigende noch mehr belastet werde, durch die Anklage sogar gegen seinen Diener. Grösser ist die Missliebigkeit des Präsidenten, wenn seine Beamten davon mitgetroffen werden. Stärker wird der Befehlshaber gezüchtigt, wenn selbst die bloss Gehorchenden keine Entschuldigung finden.</p>
      <h2>41</h2><p>Das Böse in der Seele, abgesehen von dem Bösen, was durch das Dazwischentreten des bösen Geistes noch hinzukommt, hat mithin infolge der Sünde des Ursprungs den Vortritt, gewissermassen als eine Natureigentümlichkeit. Denn die Verderbnis der Natur ist, wie gesagt, zur andern Natur geworden; sie hat ihren Gott und Vater, nämlich den Urheber der Verderbnis selbst, doch so, dass in ihr immer noch jenes Urgute der Seele, jenes göttliche, echte und im eigentlichen Sinne natürliche Gute wohnt. Denn, was von Gott herrührt, wird nicht sowohl ausgelöscht als vielmehr nur verdunkelt. Es kann verdunkelt werden, weil es nicht selbst <em>Gott</em> ist; es kann aber nicht ganz ausgelöscht werden, weil es von Gott ist.</p><p>Und so also, gleichwie das Licht bei irgend einem Hemmnisse an sich zwar unbehindert bleibt, aber doch keinen Schein gibt, wofern die Dichtigkeit des Hemmnisses gross genug ist, in gleicher Weise bleibt auch das vom Bösen überwältigte Gute in der Seele; je nach Beschaffenheit des ersteren verbirgt es entweder sein Licht gänzlich, oder dasselbe erglänzt bei erlangter Freiheit, sobald die Gelegenheit gegeben ist, wieder. So sind manche sehr schlecht oder sehr gut, aber trotzdem gehören alle Seelen einer Gattung an. So ist auch an dem Schlechtesten immer noch irgend etwas Gutes und an dem Besten ein wenig Böses. Denn Gott allein ist ohne Fehl, und der einzige Mensch ohne Fehl ist Christus, weil Christus auch Gott ist. So bricht das Göttliche in der Seele auch in der Form von Weissagungen durch, infolge ihrer vormaligen Güte, und das Wissen um Gott tritt als ein Zeugnis hervor: „Der gute Gott, Gott sieht es” und „Ich empfehle es Gott”. Deshalb ist keine Seele ohne Schuld, weil keine ohne den Keim des Guten. Sodann, wenn sie zum Glauben gelangt, wenn sie durch die zweite Geburt aus dem Wasser und aus der höheren Macht wiederhergestellt und der Schleier ihrer früheren Verderbtheit weggezogen ist, so erblickt sie ihr eigenes Licht in seiner Vollständigkeit. Sie wird dann in Empfang genommen vom heiligen Geiste, sowie dies bei der ersten Geburt vom unheiligen Geiste geschah. Der Seele, die sich dem Geiste vermählt, folgt der Leib nach als ein zu ihrer Mitgift gehöriger Leibeigener, der nicht mehr Diener der Seele, sondern des Geistes sein will. O Vermählung voll Glückseligkeit, wenn keine eheliche Untreue vorfällt!</p>
      <h2>42</h2><p>Noch ist übrig der Tod, um sich da als Gegenstand darzubieten, wo die Seele fertig ist. Indes Epikur leugnet in landläufiger Anschauungsweise, dass der Tod uns etwas angehe. Denn was aufgelöst wird, sagt er, ist empfindungslos, und was empfindungslos ist, geht uns nichts an. Aber nicht der Tod selbst wird aufgelöst und ist empfindungslos, sondern der Mensch, der ihn erleidet. Epikur misst ihm dagegen das Leiden bei, dessen Vollstreckung er nur ist. Wenn nun der Mensch den Tod erleiden muss, der seinen Körper auflöst und seinen Empfindungen ein Ende setzt, wie läppisch ist es, zu sagen, ein so machtvolles Ereignis gehe den Menschen nichts an!</p><p>Viel gezwungener sagt Seneca: „Nach dem Tode ist alles aus, auch der Tod.” Wenn dem so ist, so geht der Tod sich selbst etwas an, wenn er es nämlich ist, der ein Ende nimmt, und noch näher geht er den Menschen etwas an, in welchem er, indem alles endigt, selbst sein Ende nimmt. Der Tod geht uns nichts an, also –— auch nicht das Leben. Denn wenn wir in irgendetwas aufgelöst werden ausserhalb unserer Person, so werden wir auch irgendwozu zusammengefügt ausserhalb unser. Wenn die Hinwegnahme der Empfindung uns nichts angeht, dann auch deren Erlangung nicht. Mag den Tod töten, wer die Seele tötet! Wir aber wollen uns, wie über das nach dem Ende folgende Leben und das andere Reich der Seele, so auch über den Tod verbreiten. Wir gehen ihn etwas an, wenn er uns nichts angehen sollte. Auch sein Spiegelbild, der Schlaf, ist uns kein fremdartiger Gegenstand.</p>
      <h2>43</h2><p>Erst wollen wir über den Schlaf handeln, dann darüber, wie die Seele den Tod erleide. Der Schlaf ist keinenfalls etwas Aussernatürliches, wie einigen Philosophen dünkt, da sie ihm Ursachen zuschreiben, die ausserhalb der Natur zu liegen scheinen. Die Stoiker geben den Schlaf für eine Auflösung der sinnlichen Kraft aus, die Epikuräer für eine Verminderung des physischen Lebensgeistes, Anaxagoras mit Xenophanes für eine Erschlaffung, Empedokles und Parmenides für ein Erkalten, Strato für eine Absonderung des verbundenen Geistes, Demokrit für einen Mangel des Geistes, Aristoteles für eine Abnahme der Wärme in der Herzgegend.</p><p>Ich meinerseits wüsste nicht, jemals so geschlafen zu haben, dass ich von diesen Dingen etwas gespürt hätte. Der Schlaf ist keineswegs für eine Erschlaffung zu halten, sondern vielmehr für das Gegenteil davon; er beseitigt sie ja. Denn der Mensch wird durch den Schlaf gestärkt, nicht aber ermüdet. Sodann entsteht der Schlaf nicht immer aus Ermüdung, und auch wenn er aus ihr entsteht, so ist er doch keine Ermüdung. Auch das Kaltwerden oder den Mangel von Wärme lasse ich nicht gelten; denn die Körper werden ja durch den Schlaf warm, und die Zerteilung der Speisen im Schlafe würde nicht so leicht vor sich gehen, wenn wir im Schlafe kälter würden. Denn die Wärme beschleunigt, die Kälte verzögert dies. Noch wichtiger ist, dass auch der Schweiss ein Zeichen der vor sich gehenden Verdauung ist. Denn man bezeichnet letztere auch als ein Verkochen, was eine Wirkung der Hitze, nicht der Kälte ist. An eine Abnahme des Lebensgeistes, an Mangel des Geistes oder Trennung des verbundenen Geistes zu glauben, erlaubt die Unsterblichkeit der Seele ebensowenig. Die Seele würde untergehen, wenn sie vermindert würde. Es bliebe nun allenfalls noch übrig, mit den Stoikern den Schlaf als eine Auflösung der sinnlichen Kraft zu erklären, weil er bloss Ruhe des Körpers bewirke, nicht der Seele. Denn die Seele, als immer bewegt und immer beschäftigt, unterliege niemals der Ruhe, da letztere dem Stande der Unsterblichkeit fern sei, weil nichts Unsterbliches ein Ende seines Wirkens dulde. Der Schlaf aber ist das Ende des Wirkens. Darum wird die Ruhe nur dem Körper, dem allein Sterblichkeit eigen ist, das Ende des Wirkens bringen.</p><p>Wer also an der Naturgemässheit des Schlafes zweifelt, hat wohl die Dialektiker für sich, welche die ganze Unterscheidung von natürlich und aussernatürlich in Zweifel ziehen, und ist sich bewusst, dass er das, wovon er meint, es liege ausserhalb der Natur, der Natur vindizieren dürfe, von welcher es das Sein nur in der Weise erhalten hat, dass es ausserhalb ihrer zu liegen scheint und dass entweder alles Natur ist oder nichts. Bei uns dagegen wird man erfahren können, was die Betrachtung Gottes an die Hand gibt, des Urhebers aller der Dinge, über welche Untersuchungen angestellt werden. Wir glauben nämlich, wenn etwas von der Natur herrührt, so sei es ein vernunftentsprechendes Werk Gottes. Nun geht aber dem Schlafe ein vernünftiger Grund vorher. Der Schlaf ist so angemessen, so nützlich und so nötig, dass ohne ihn keine Seele bestehen würde. Er ist der Erquicker der Leiber, der Wiederhersteller der Kräfte, der Prüfstein der Gesundheit, der Befreier von der Arbeit, die Arznei gegen Anstrengungen, ein Genuss, den zu gestatten der Tag abtritt und die Nacht den Befehl gibt, indem sie sogar die Farben der Dinge verschwinden macht. Wenn der Schlaf also etwas Vitales, Heilsames und Nützliches ist, dann ist alles an ihm vernünftig, alles natürlich.</p><p>So verweisen auch die Ärzte alles, was dem Vitalen, Heilsamen und Nützlichen entgegengesetzt ist, aus dem Gebiete des Naturgemässen hinaus, und wenn sie die dem Schlafe feindseligen Krankheiten, die Gehirn- und Magenleiden, für ausserhalb des Naturgemässen liegend ansehen, so haben sie damit von vornherein den Schlaf für etwas Natürliches erklärt. Wenn sie ihn hingegen z. B. bei Letargischen für <em>nicht</em> natürlich erklären, so handeln sie auch darin dem Fingerzeige der Natur entsprechend, da er nur innerhalb seines Maasses natürlich ist. Denn eine jede Natureinrichtung wird verletzt entweder durch das Zuviel oder das Zuwenig und ist gewahrt durch ihr bestimmtes Maass. So ist manches natürlich durch seinen dermaligen Bestand, was unnatürlich werden kann durch Zunahme oder Abnahme. Was geschieht, wenn man das Essen und Trinken seiner natürlichen Bestimmung entkleidet? In diesen beiden Dingen liegt ja auch eine sehr wichtige Vorbereitung des Schlafes. Sicherlich ist der Mensch vom Anbeginn seiner Natur an hierin unterwiesen worden.</p><p>Wenn du von Gott lernen willst, so hat der bekannte Urquell des menschlichen Geschlechts, Adam, eher eines tiefen Schlafes genossen, bevor er der Ruhe begehrte, eher geschlafen als gearbeitet, auch eher als gegessen, ja sogar eher als er geweissagt hat, so dass man sieht, der naturgemässe Unterweiser, der Schlaf, hat den Vorzug vor allen übrigen naturgemässen Dingen. Damit werden wir darauf geführt, dass er bereits damals das Bild des Todes gewesen sei. Denn wenn Adam als Vorbild Christi diente, so bedeutete der Schlaf Adams den Tod Christi, der im Tode entschlafen sollte. Durch den Verlust in seiner Seite aber sollte die wahre Mutter der Lebendigen, die Kirche, vorgebildet werden.</p><p>Darum wird der Schlaf, der so heilsam und vernunftgemäss ist, auch als Bild des bereits öffentlichen und allgemeinen Todes gebraucht. Denn Gott, der auch sonst in seinen Einrichtungen nichts ohne Analogien gelassen hat, wollte nach dem von Plato gebrauchten Beispiele, aber in vollkommenerer Weise, jeden Tag eine Nachbildung gerade des Anfangs und des Endes des Menschen mit uns vornehmen und reicht uns die Hand, um unserem Glauben durch Parabeln und Beispiele, wie in Worten so auch in sachlichen Vorgängen leichter aufzuhelfen. Er stellt dir also den Leib vor, durch die freundliche Macht des Schlummers hingestreckt und durch die angenehme Notwendigkeit der Ruhe zu Boden geworfen, unbeweglich in seiner Lage, wie er dalag, ehe er belebt wurde, und wie er nach Ablauf des Lebens daliegen wird, zur Bezeugung sowohl seiner Entstehung als seines Begräbnisses, der Seele harrend, als wäre sie ihm noch nicht gegeben, oder als wäre sie ihm bereits genommen. Auch letztere befindet sich in einem Zustande, als hielte sie sich anderswo auf, indem sie durch ihre vermeintliche Anwesenheit sich für ihre zukünftige Abwesenheit einübt, wie wir von Hermotimus noch lernen werden.</p><p>Aber sie träumt ja unterdessen. –— Woher kommt nun das Traumleben? –— Ihre Ruhe und Unthätigkeit ist keine vollständige und ihre unsterbliche Natur lässt sie nicht völlig zur Sklavin der Bewusstlosigkeit werden. Sie bewährt ihre beständige Beweglichkeit, über Land und Meer wandert sie, treibt Handel, ist thätig, arbeitet, scherzt, trauert, freut sich, thut Erlaubtes und Unerlaubtes und beweist damit, dass sie auch ohne den Körper vieles vermag, dass auch sie mit ihren Gliedern ausgerüstet ist, dass sie sich aber nichtsdestoweniger in der Notwendigkeit befinde, den Körper wiederum in Bewegung zu setzen. Wenn also der Körper wieder erwacht und seinen Beschäftigungen zurückgegeben wird, so bestätigt sie dir die Auferstehung der Toten. Das ist der naturgemässe Grund und die vernunftgemässe Natur des Schlafes. Sogar durch das Abbild des Todes inaugurierst du deinen Glauben, sinnst nach über den Gegenstand deiner Hoffnung, lernst sterben, leben und wachen, während du schläfst.</p>
      <h2>44</h2><p>Aber Hermotimus? –— Er hatte, wie man sagt, während des Schlafes keine Seele; sie verliess bei dieser Gelegenheit, da der Mensch gleichsam nichts zu thun hatte, den Körper. Seine Ehefrau hat dies verraten. Feinde, die ihn schlafend fanden, verbrannten ihn als tot. Später kam die Seele zurück und musste sich nun, vermute ich, den Mord zuschreiben. Des Hermotimus Mitbürger, die Klazomenier, trösteten ihn durch Errichtung eines Tempels; kein Weib betritt ihn wegen des Vorwurfs, den die Ehefrau trifft. Wozu soll dies dienen? Damit die Leichtgläubigkeit, da es leicht ist, gemeinhin den Schlaf für eine Entfernung der Seele zu halten, sich nicht auf dieses Beispiel mit Hermotimus stütze. Es war eine Art bedeutend schwereren Schlafes, wie man sich das Alpdrücken denkt oder jenen Mangel an Gesundheit, den Soranus, das Alpdrücken verwerfend, an dessen Stelle setzt, oder es war etwas wie das Leiden, das auch den Epimenides zum Gegenstand einer Mythe machte, der beinahe fünfzig Jahre im Schlaf befangen war. Sueton erzählt in betreff des Nero und Theopompus in betreff des Thrasymedes, sie hätten niemals geträumt, Nero höchstens bei seinem letzten Ende nach seinen Angstanfällen. Wie, wenn es nun bei Hermotimus auch so war und die tiefe Ruhe der Seele, die sich nicht in Träumen thätig zeigte, für Abwesenheit gehalten wurde? Man müsste eher alles andere annehmen als eine derartige Freiheit der Seele, sich ohne Eintritt des Todes entfernen zu können, und zwar regelmässig und beständig. Wollte man dagegen dergleichen einen einmaligen Vorfall nennen, etwa eine Sonnen- oder Mondfinsternis der Seele, dann allerdings würde ich mir einreden lassen, dass es etwas von Gott Gewirktes sei. Es hat Sinn und Verstand, dass der Mensch von Gott durch den Schlag eines augenblicklichen Todes gemahnt oder geschreckt werde wie durch einen raschen Blitzstrahl, wenn es nicht näher läge, für einen Traum zu halten, was eher hätte einem Wachenden zustossen müssen, wenn es nicht noch eher für eine Faselei gehalten werden müsste.</p>
      <h2>45</h2><p>Wir sind gehalten, hier die christliche Ansicht über die Träume auseinanderzusetzen, weil sie zufällige Erscheinungen des Schlafes und nicht geringe Beunruhigungen der Seele bilden, welche, wie gesagt, infolge ihrer beständigen Beweglichkeit stets geschäftig und thätig ist, was die Art und Weise des Göttlichen und Unsterblichen so mit sich bringt. Wenn also die Ruhe dem Körper, dessen besondere Vergünstigung sie ist, zuteil geworden ist, so ruht die Seele, an dieser ihr fremden Vergünstigung unbeteiligt, keineswegs, sondern bedient sich, wenn sie des Dienstes der Glieder des Körpers entbehrt, ihrer eigenen.</p><p>Denke dir einen Gladiator ohne Waffen, einen Wettfahrer ohne Wagen; gestikulierend stellen sie jede in ihrer Beschäftigung vorkommende Stellung und Haltung dar; der kämpft, jener wettet, aber ihr Brüsten ist eitel. Nichts destoweniger scheint doch zu geschehen, was zu geschehen wiederum auch nicht scheint; es geschieht nämlich in Vornahme der Handlung, nicht der Wirkung nach. Diese Erscheinung nennen wir Ekstase, eine Ausschreitung des Geistes und ein Ebenbild des Wahnsinns. So begann auch im Uranfang der Schlaf mit einer Ekstase. „Gott schickte eine Ekstase über Adam, und er schlief ein.” Denn der Schlaf kommt dem Körper zu statten zum Zweck der Ruhe, die Ekstase aber kommt über die Seele der Ruhe entgegen, und auf Grund dessen ist ihre Form die, den Schlaf mit der Ekstase zu verbinden, und ihre Natur beruht auf dieser Form.</p><p>So empfinden wir im Traume auch Lust, Traurigkeit und Schrecken und sind so ergriffen, ängstlich und leidend wie möglich, da wir doch, wenn wir selbstbewusst träumten, in nichts würden aufgeregt werden, weil es sich natürlich nur um inhaltleere Bilder handelt. Die guten Thaten, die im Schlafe geschehen, sind ebenfalls umsonst und die Vergehungen straflos. Wir werden wegen einer buhlerischen Traumerscheinung ebensowenig verworfen, als wegen eines geträumten Martyriums gekrönt. Wie kommt es nun, fragt man, dass die Seele die Träume in Acht behält, da sie doch in keiner Weise selbstbewusst sein soll? –— Das ist diesem bewusstlosen Zustande so eigen, weil derselbe nicht eintritt infolge eines Schadens an der Gesundheit, sondern aus einem natürlichen Grunde; denn er vertreibt nicht die Seele, sondern ruft sie nur ab. Etwas anderes ist bewegen als darniederschlagen, fortrücken etwas anderes als umstürzen. Dass also das Gedächtnis noch da ist, das ist ein Zeichen, dass der Geist sich wohlbefindet; wenn aber der gesunde Geist bei unvermindertem Gedächtnisse still steht, so ist das eine Art Blödsinn. Daher sagen wir auch nicht, wir rasen, sondern wir träumen; daher gelten wir dabei als ganz vernünftig, wenn wir es sonst nur sind. Obwohl unser Nachdenken verdunkelt wird, so ist es doch nicht ausgelöscht; nur kann es eben scheinen, als sei es zur Zeit unthätig, die Ekstase, aber auch darin auf ihre eigene Weise thätig, dass sie uns ebensowohl Bilder der Weisheit eingibt als Bilder des Irrtums.</p>
      <h2>46</h2><p>Siehe, da sind wir nun im Gedränge, uns hinsichtlich der Spezialuntersuchung über die Träume, wovon die Seele heimgesucht wird, auszulassen. Wann werden wir denn zur Besprechung des Todes kommen? Auch hier möchte ich sagen: Sobald es Gott gibt; der Aufschub dessen, was doch geschieht, dauert wenigstens nicht lange.</p><p>Für völlig nichtig hat Epikur die Träume erklärt, indem er ja die Gottheit der Geschäfte entledigt, die Aufeinanderfolge der Dinge aufhebt und alles willkürlich verzettelt, als dem blossen Erfolge preisgegeben und zufällig. Nun gut; wenn dem so ist, so wird es ein Eintreffen der Wirklichkeit geben, weil es nicht angeht, dass sie allein vom Erfolge, der allen Dingen gebührt, ausgenommen sei. Homer hat den Träumen zwei Pforten zugewiesen, eine von Horn für das Eintreffen, und eine von Elfenbein für die Täuschung. Denn durch Horn, sagen sie, kann man hindurch sehen, das Elfenbein aber ist undurchsichtig. Aristoteles spricht seine Meinung für das Überwiegen der Täuschungen aus, erkennt aber damit auch das Eintreffen an. Die Einwohner von Telmessus lassen keinen Traum vergeblich sein und schieben die Schuld nur auf die Unzulänglichkeit der Deutung. Wer aber ist den menschlichen Dingen so fremd, dass er nicht auch einmal ein oder das andere eingetroffene Traumgesicht gehabt hätte! Indem ich von den bemerkenswerteren Thatsachen einiges wenige flüchtig anführe, will ich Epikur beschämen. Von Astyages, dem Beherrscher der Meder, erzählt Herodot, dass er im Traume gesehen habe, wie der Blase seiner noch jungfräulichen Tochter Mandane eine Flüssigkeit zur Ueberschwemmung von ganz Asien entquollen sei. Ein Jahr nach ihrer Verheiratung sei derselben Stelle ein Weinstock entsprossen, der sich über ganz Asien gelagert habe. Dies berichtet auch Charon von Lampsakus noch vor Herodot. Diejenigen, welche diese grosse Begebenheit auf ihren Sohn deuteten, haben sich nicht geirrt; denn Cyrus hat Asien sowohl ertränkt als erdrückt.</p><p>Philipp von Macedonien sah, bevor er Vater wurde, den Mutterschooss seiner Gattin Olympias mit einem Siegelring versiegelt; darauf war ein Löwe einpetschiert. Er glaubte, ihre Gebärfähigkeit sei verschlossen, vermutlich, weil der Löwe nur einmal Vater wird. Aristodemus oder Aristophon hatten aber die richtigere Mutmassung, dass etwas Leeres nicht versiegelt werde und es daher einen Sohn von der allergrössten Energie bedeute. Wer Alexander kennt, der erkennt auch den Löwen auf dem Petschaft wieder. Ephorus schreibt es.</p><p>Die Tyrannis des Dionysius über Sicilien wurde von einer gewissen Himeräa im Traume geschaut. Heraklides hat es überliefert. Für Seleukus sah seine Mutter Laodice, da sie ihn noch nicht geboren hatte, die Herrschaft über Asien vorher. Euphorion hat es berichtet. Dass sich Mithridates infolge eines Traumes des Pontus bemächtigt habe, erfahre ich von Strabo, und dass der Illyrier Baralires infolge eines Traumes von Molossus bis Macedonien geherrscht habe, lerne ich aus dem Kallisthenes.</p><p>Auch die Römer wissen von derartigen eingetroffenen Träumen. Dass der Wiederhersteller des Reiches, als er noch ein Knäblein und Privatmann im Orte und nur erst Julius Octavius war, Augustus und der Beendiger der Wirren des Bürgerkrieges werden würde, das hat bereits Marcus Tullius, der ihn nicht einmal kannte, infolge eines Traumes gewusst. So steht es in den Denkschriften des Vitellius.</p><p>Allein Träume sind nicht bloss der Weg, die höchste Herrschaft vorauszuverkünden, sondern auch Gefahren und Untergang; wie z. B., wenn Cäsar in der Schlacht gegen die Aufrührer Brutus und Cassius, obwohl krank, in der Meinung, sonst eine grössere Gefahr von den Feinden zu gewärtigen, auf eine Vision des Artorius hin das Zelt verliess und entkam. Des Polykrates von Samos Tochter erkannte seine Kreuzigung vorher, aus seiner Salbung mit Fett durch Sol und seiner Abwaschung durch Jupiter.</p><p>Es werden auch Ehrenstellen und Erfindungen in der Zeit der Ruhe geoffenbart, Heilmittel kund gethan, Diebstähle enthüllt und Schätze verliehen. Ciceros hohe Würde hatte schon seine Kindsmagd, als er noch ein Knäbchen war, erschaut. Der Schwan, der vom Schoosse des Sokrates aus die Menschen bezaubert, war sein Schüler Plato. Der Faustkämpfer Leonymus wurde von Achill im Traume geheilt. Als Athen seine goldene Krone auf der Burg verloren hatte, fand sie der Tragödiendichter Sophokles im Traume wieder. Der Tragöde Neoptolemus bewahrte das Grabmal des Ajax zu Rhöteum bei Troja, im Schlafe von ihm selber gemahnt, vor Einsturz, und nachdem er die verwitterten Steine weggeräumt, kam er reich an Gold zurück.</p><p>Wie zahlreich aber sind nicht die Schriftsteller und Gewährsleute für diese Sachen! Artemon, Antiphon, Strato, Philochorus, Epicharmus, Serapion, Kratippus, Dionysius von Rhodus, Hermippus und die gesamte heidnische Litteratur. Nur lachen würde ich höchstens über den, der glaubt, mich überreden zu können, früher als alle habe schon Saturn geträumt. Für den Fall jedoch, dass Aristoteles früher als alle anderen Leute gelebt haben sollte, verzeihe man mir den Scherz. Epicharmus hat mit Philochorus dem Athener unter allen Vorbedeutungen den Träumen den höchsten Rang zuerkannt. Mit Orakeln dieser Art ist der Erdkreis bedeckt; solche sind: das des Amphiaraus zu Oropus, des Amphilochus zu Mallus, des Sarpedon in Troas, des Trophonius in Böotien, des Mopsus in Cilicien, der Hermione in Macedonien, der Pasiphaa in Lakonien. Die übrigen mit ihren Ursprüngen, Gebräuchen und Berichterstattern nebst der Gesamtgeschichte der Träume wird Hermippus von Berytus der Reihe nach in seinen fünf Büchern sattsam darbieten. Die Stoiker sind geneigt, zu glauben, dass die auf Belehrung der Menschheit so sehr bedachte Gottheit unter den anderen Hilfsmitteln der Weissagekünste und -Lehren uns auch die Träume verliehen habe, als besonderes Privilegium eines natürlichen Orakels.</p><p>So viel in bezug auf die Glaubwürdigkeit der Träume, insoweit sie von uns zu bestätigen, aber doch anders aufzufassen ist. In betreff der übrigen Orakel, bei denen kein Schlafen vorkommt, was werden wir anders sagen können, als dass sie ein dämonisches Verfahren der Geister sind, die bereits in den Menschen gewohnt oder ihrer Überlieferungen sich bemächtigt haben, zu jeglichem Aufputz ihrer Schlechtigkeit, die in diesem Falle sich lügnerisch die Gottheit beilegen und mit derselben Geflissentlichkeit auch durch Wohlthaten, wie z. B. Heilmittel, Warnungen und Vorherverkündungen, täuschen, um dadurch gelegentlich desto mehr Schaden zuzufügen, indem sie durch ihre erteilte Hilfe von der Untersuchung der Wahrheit unter falschen Einflüsterungen ablenken? Diese Macht ist keineswegs räumlich eingeschlossen und beschränkt sich nicht auf die Grenzen der Heiligtümer, sondern sie schweift und fliegt umher und ist vorläufig noch frei. Darum mag niemand daran zweifeln, dass sein Haus den Dämonen zugänglich sei und sie die Leute nicht bloss in den Tempeln, sondern auch in ihren Schlafgemächern durch Trugbilder täuschen.</p>
      <h2>47</h2><p>Wir sind nämlich der bestimmten Ansicht, sehr viele Träume werden von den Dämonen veranlasst, zuweilen allerdings auch zutreffende und erfreuliche, –— die dann aber auch blendend und berückend sind, aus welchem Grunde, haben wir angegeben, –— noch viel mehr aber sind die falschen, täuschenden, verwirrenden, schlüpfrigen und schmutzigen Träume ihr Werk! Es ist kein Wunder, wenn die Bilder denen angehören, denen die Sache angehört.</p><p>Als von Gott aber, der da bekanntlich allem Fleische die Gnade des hl. Geistes verheissen, und der versprochen hat, dass seine Knechte und Mägde prophezeien und Traumgesichte haben würden –— als von Gott herrührend werden diejenigen angesehen, welche in einem Verhältnis zur Gnade stehen, die ehrbaren, heiligen, prophetischen, offenbarenden, erbaulichen und erweckenden Träume, deren reicher Schatz sich sogar auf Unheilige zu verbreiten pflegt, indem Gott seinen Regen und Sonnenschein an die Gerechten und Ungerechten in gleicher Weise verteilt. So z. B. hatte Nabuchodonosor einen von Gott kommenden Traum, und fast der grössere Teil der Menschen kennt Gott aus Traumgesichten. Wie sich also die gnädige Herablassung Gottes auch an die Heiden richtet, so die versuchende Thätigkeit des bösen Feindes gegen die Gerechten, und er lässt von ihnen niemals ab, sondern überfällt sie sogar, wenn sie schlafen, wie und wo sie kann, wenn sie es im Wachen nicht kann.</p><p>Die dritte Art von Träumen ist die, welche sich die Seele selber herbeizuführen scheint durch Betrachtung ihrer Lage. Da es nun aber nicht vom freien Willen abhängt zu träumen –— dieser Ansicht ist nämlich Epicharmus –— wie kann sie dann sich selbst Ursache irgend einer Vision werden? Sollte diese Spezies der natürlichen Form überlassen werden müssen, welche der Seele das Vorrecht sichert, selbst in der Ekstase die ihr zugehörigen Erscheinungen zu erfahren? Was aber dem Anschein nach weder von Gott, noch vom Teufel, noch von der Seele herkommt und gegen die Erwartung, Auslegung und Beschreibung der Fähigkeit ist, das wird im eigentlichen Sinne der Ekstase und ihrer Art und Weise vorbehalten bleiben.</p>
      <h2>48</h2><p>Zuverlässiger und geläuterter sollen, wie man behauptet, diejenigen Träume sein, die man gegen Ende der Nacht hat, wo nach andauerndem Schlafe gleichsam die Munterkeit der Seele bereits anhebt. Was die Jahreszeiten angeht, so sind im Frühling die Träume am ruhigsten, weil der Sommer die Seelen auflöst, der Winter sie gewissermassen verdichtet und der Herbst, der sonst auch die Gesundheit gefährdet, sie durch die sehr weingeisthaltigen Säfte des Obstes betäubt. Ähnlich kommt auch die Lage während der Ruhe in Betracht, ob man nicht auf dem Rücken oder der rechten Seite liege, ob nicht bei ebenfalls rückwärtsliegenden Eingeweiden, gleichsam wie geöffneten Kanälen, der Sitz der Sinne in Fluss geraten sei oder die Zusammendrückung der Leber eine Beängstigung des Gemütes bewirkt habe. Über solche Dinge, glaube ich, kann man eher geistreiche Ansichten aussprechen, als etwas bestimmtes beweisen, wenn es gleich Plato ist, der diese Ansichten hat; vielleicht mögen diese Dinge auch zufällig vor sich gehen. Denn sonst würden die Träume dem freien Willen unterworfen sein, wenn man sie leiten könnte.</p><p>Auch die Vorschriften in betreff der Unterscheidung und Vermeidung von Speisen, welche teils Wahn, teils der Aberglaube als Anleitung zu Träumen vorgeschrieben hat, ist noch zu prüfen. Der Aberglaube z. B. schreibt denen, die bei den Orakeln schlafen wollen, ein Fasten vor, um Keuschheit zu bewirken; Wahn dagegen ist es z. B., wenn die Pythagoräer aus dieser Rücksicht die Bohnen verschmähen, als eine beschwerende und blähende Nahrung. Nun aber haben die drei Brüder, die wie Daniel mit blossem Gemüse zufrieden waren, um sich nicht an den königlichen Speisen zu verunreinigen, dafür ausser der sonstigen Weisheit gerade die Gnade, Träume zu erlangen und auszulegen, von Gott erhalten. Was das Fasten angeht, so weiss ich nicht, ob ich es allein bin, der dann in der Regel so träumt, dass er nichts davon gewahr wird.</p><p>Sollte also, fragt man, die Massigkeit in dieser Beziehung nichts bewirken? Ja freilich, in dieser Beziehung weit mehr wie in jeder andern, und wenn schon beim Aberglauben, dann noch viel mehr in der Religion. Denn die Dämonen fordern gerade darum von ihren Träumern, um sich die Sehergabe erschwindeln zu können, Nüchternheit, weil sie wissen, dass man durch sie Gott näher tritt und weil auch Daniel in einem Stationsfasten von drei Wochen nur Trockenes genoss, allerdings in der Absicht, Gott durch Leistungen der Verdemütigung herabzurufen, nicht um der Seele, da sie träumen sollte, Empfindung und Wahrnehmung dafür zu verschaffen, als wenn sie nicht in der Ekstase handeln würde. Daher ist die Nüchternheit kein Mittel, um der Ekstase Platz zu schaffen, sondern um sie wohlgefälliger zu machen, damit sie in Gott stattfinde.</p>
      <h2>49</h2><p>Diejenigen, welche der Ansicht sind, die unmündigen Kinder träumten nicht, obwohl sie sonst alle Lebensverrichtungen nach Maassgabe ihres Alters vollziehen, die mögen das Zusammenfahren, Nicken und Lächeln derselben während der Zeit der Ruhe beobachten, um daraus zu erkennen, dass die Bewegungen der träumenden Seele durch den zarten Leib mit Leichtigkeit bis zur Oberfläche hindurchdringen.</p><p>Aus dem Gerüchte, das Volk der Libyer im Atlasgebirge bringe die Nacht in einem nichts sehenden Schlafe hin, macht man auch Schlüsse in betreff der Natur der Seele. Nun aber ist Herodot entweder durch die Fama, die öfters die Barbaren verleumdet, belogen worden oder es besitzt in jenem Landstriche eine gewaltige Menge der betreffenden Dämonen die Herrschaft. Wenn nämlich, wie Aristoteles bemerkt, ein gewisser Heros in Sardinien die Leute, die in seinem Tempel schlafen, der Traumgesichte beraubt, so wird es zu den Vergnügungen der Dämonen gehören, Träume sowohl zu nehmen als auch zu geben, so dass sowohl die Erscheinung, dass Nero spät träumte, als auch die bei Thrasymedes beobachtete von ihnen herrührt.</p><p>Wir aber leiten auch die Träume von Gott ab. Warum sollten daher nicht auch die Atlasbewohner mit Gottes Hilfe träumen, schon darum, weil jetzt kein Volk mehr ganz von Gott verlassen ist, da das Licht des Evangeliums seine Strahlen schon in alle Länder und bis zu den Grenzen des Erdkreises sendet? Fama hat also den Aristoteles belogen, oder es ist noch immer so die Art und Weise der Dämonen. Nur die Meinung darf nicht bestehen, dass irgend eine Seele von Natur aus des Träumens entbehre.</p>
      <h2>50</h2><p>Genug nun von dem Spiegelbilde des Todes, dem Schlafe, genug auch von den Verrichtungen im Schlafe, den Träumen! Zurück nun zum Ausgangspunkt dieser Abschweifung, d. h. zu den Vorgängen beim Tode, weil er selbst noch Fragen unterliegt, wenn er gleich das Ende alles Fragens ist.</p><p>Nach der allgemeinen Meinung des ganzen menschlichen Geschlechtes bezeichnen wir den Tod als einen der Natur schuldigen Tribut. Ihn hat sich ausbedungen der Ausspruch Gottes, ihm hat sich verpfändet alles, was geboren wird, so dass schon dadurch der Blödsinn Epikurs beschämt wird, der leugnet, dass diese Schuld uns etwas angehe, und noch mehr der Wahnsinn des Häretikers Menander aus Samaria seine Verwerfung findet, der sagt, der Tod gehe die Seinigen nicht nur nichts an, sondern treffe sie gar nicht einmal. Zu diesem Ende nämlich sei er, Menander, von der höchsten und verborgenen Macht gesendet worden, damit die, welche seine Taufe annehmen, unsterblich, unvergänglich und sofort der Auferstehung teilhaftig würden.</p><p>Wir lesen zwar, dass manche Arten von Wasser die Aufmerksamkeit auf sich ziehen, wie z. B. die weinartige Wasserader der Lynkestier trunken macht, der dämonische Sprudel zu Kolophon Wahnsinn bewirkt und Alexander in die giftige Quelle Nonakris in Arkadien geriet. Es hatte auch in Judäa ein Teich Heilkraft vor der Zeit Christi. Von den stygischen Sümpfen erzählt der Dichter gar, dass sie den Tod abwaschen. Aber sogar Thetis musste ihren Sohn beweinen. Wenn Menander die Leute in den Styx tauchte, so müssten sie trotzdem doch erst sterben, um zum Styx zu gelangen. Denn er befindet sich in der Unterwelt. Wie und wo in aller Welt ist doch dieses glückselige Gewässer, welches uns früher Johannes der Täufer nicht geschenkt, noch Christus selbst den Jüngern gezeigt hat? Dieses Bad des Menander, was ist es? Ich glaube, es ist komödienhaft. Aber warum ist es denn so selten, so unbekannt, und warum gehen so wenige in diese Schwemme? Mir ist es sehr verdächtig, dass diese so sichere und sichernde Geheimlehre, bei der es auch kein Gebot ist, für Gott zu sterben, so wenig Anhänger zählt, während doch bereits alle Nationen hinaufsteigen zum Berge des Herrn und zum Hause des Gottes Jakobs, obwohl dieser den Tod durch das Martyrium sogar fordert und ihn selbst seinem Gesalbten nicht erlassen hat. Nicht einmal der Zauberei wird man die Macht zutrauen, den Tod beseitigen, den Lebensbaum wie einen Weinstock aufhacken und das Alter verjüngen zu können. Das vermochte nicht einmal Medea beim Menschen, wenn sie es auch bei einem Hammel konnte.</p><p>Henoch und Elias wurden entrückt, und ihr Tod wurde nicht gesehen, d. h. er ist aufgeschoben. Sie werden übrigens für das Sterben aufbewahrt, um den Antichrist mit ihrem Blute zu ersticken. Es starb auch Johannes, von welchem man vergebens hoffte, er werde bis zur Erscheinung des Herrn dableiben. Denn in der Regel bemächtigen sich die Häresien unserer Beispiele und entnehmen davon die Waffen, womit sie sich decken. Mit einem Worte endlich: Wo sind denn die, welche Menander selbst getauft, die er in seinen Styx eingetaucht hat? Seine unvergänglichen Apostel mögen kommen und ihm Beistand leisten! Mein Thomas soll sie dann beschauen; mag er sie hören, betasten und dann glauben!</p>
      <h2>51</h2><p>Die Wirkung des Todes liegt auf der Hand: Trennung von Seele und Leib. Einige jedoch thun sich zu gunsten der Unsterblichkeit der Seele, welche sie, ohne von Gott darüber belehrt zu sein, so halb und halb aufrecht erhalten, nach bettelhaften Argumentationen um und wollen, man solle glauben, einzelne Seelen blieben auch nach dem Tode noch an ihren Körpern haften. Zu diesem Zwecke wendet Plato, wenn er auch sonst sämtliche Seelen sofort in den Himmel schickt, dennoch im „Staate” ein, der Leichnam eines Unbeerdigten sei lange Zeit hindurch ohne alle Spur von Verwesung geblieben, nämlich wegen nicht stattgefundener Absonderung der Seele. Zu diesem Zweck macht Demokritus auf das Wachsen der Nägel und Haare in den Gräbern, das sich geraume Zeit hindurch fortsetzt, aufmerksam. Es war aber auch möglich, dass die Beschaffenheit der Luft für jenen Leichnam einen Schutz bildete. Wie, wenn die Luft trockener und die Erde salzhaltiger gewesen wäre? Wie, wenn die Bestandteile des Körpers selbst saftloser gewesen wären? Wie, wenn seine Todesart selbst schon im voraus die die Fäulnis bewirkenden Stoffe hinausgeschafft hätte? Die Nägel aber scheinen, da sie die Ausgangspunkte der Sehnen sind, ganz natürlich, sobald die Sehnen durch Auflösung länger werden und das Fleisch täglich abnimmt, länger hervorzutreten. Die Haare erhalten ihre Nahrung aus dem Gehirn, welchem durch seine geschützte Lage die Fortdauer noch einige Zeit lang gesichert ist. So ist ja auch bei den Lebenden der Haarwuchs je nach der Masse des Gehirns wuchernd oder er geht aus. Die Ärzte vertreten dies.</p><p>Nicht einmal das Geringste von der Seele kann im Körper zurückbleiben; es würde zuletzt auch entweichen müssen, wenn die Zeit das ganze Gebäude des Leibes vernichtet hat. Es gibt Leute, die auch diese Meinung hegen; darum sagen sie, man dürfe die Leichen aus Mitleid mit dem Seelenreste nicht verbrennen. Ganz anders aber ist das Verfahren der Frömmigkeit in diesem Punkte, sie nimmt keine höfliche Rücksicht auf die Reste der Seele, sondern verabscheut diese Grausamkeit schon um des Körpers willen, weil der Mensch so etwas jedenfalls nicht verdient, in der Todesart der Verbrecher hingeopfert zu werden. Die Seele ist übrigens unteilbar, weil unsterblich, und dies nötigt, anzunehmen, auch der Tod sei ein ungeteilter, indem er die Seele nicht so fast als unsterbliches, sondern als unteilbares Wesen in unteilbarer Weise trifft. Denn würde die Seele geteilt, so würde auch der Tod in Teile zerlegt werden, nämlich in Bezug auf den Rest der Seele, der einstens ebenfalls sterben muss. So würde mit dem einen Teile der Seele auch noch ein Teil des Todes in Rückstand bleiben.</p><p>Ich weiss wohl, dass es Anzeichen gibt, die für jene Meinung sprechen. Ich habe persönliche Erfahrung darüber gemacht. Mir ist der Fall bekannt, dass eine Frau, welche, als Glied der Kirche geboren, ohne Gebrechen an Form und Lebensalter, nach einer einzigen und kurzen Ehe in Frieden entschlafen war. Die Beerdigung verzögerte sich noch, und die Person wurde unter den Gebeten des Priesters unterdessen dafür zurecht gelegt; beim ersten Tone des Gebetes hob sie ihre Hände von den Seiten auf, nahm die Haltung des Gebetes an und legte sie nach Beendigung des Friedensgebetes wiederum in ihre frühere Lage zurück. Auch lebt im Munde der Unsrigen die Erzählung, dass auf dem Kirchhofe ein Leichnam einem andern, der daneben gelegt werden sollte, durch Zurückweichen Platz gemacht habe.</p><p>Wenn sich bei den Heiden derartige Erzählungen auch finden, so ist zu sagen, Gott lässt allerwärts Zeichen seiner Macht sehen, den Seinigen zum Troste, den andern zum Verderben. Ich für meinen Teil möchte lieber glauben, Gott wirke dergleichen zum Zeichen, als dass es durch irgendwelche Reste der Seele geschehe. Wenn solche noch da wären, so würden sie wohl auch die anderen Glieder in Bewegung gesetzt haben, und wenn bloss die Hände, dann doch nicht zum Zwecke des Gebetes. Jene andere Leiche würde nicht bloss dem Bruder Platz gemacht haben, sondern sonst noch durch Veränderung ihrer Lage sich selbst Erleichterung verschafft haben. Woher nun diese Dinge auch kommen, so viel ist gewiss, sie sind für Zeichen und Wunder zu halten, und können nicht die Regel bilden. Wenn der Tod nicht mit einem Male und ganz eintritt, so ist er gar keiner. Wenn etwas von der Seele zurückbleibt, so ist Leben vorhanden. Tod und Leben werden sich ebensowenig miteinander verbinden, als der Tag mit der Nacht.</p>
      <h2>52</h2><p>Dieses Vorkommnis, der Tod oder die Trennung des Leibes von der Seele, wird durch das Gefühl der Menschen, mit Beiseitelassung der Frage nach Schicksalsbestimmung oder Zufälligkeit, zwiefach eingeteilt, in eine gewöhnliche und eine aussergewöhnliche Form, und man schreibt die gewöhnliche Form, jeden ruhigen Tod, der Natur zu, die aussergewöhnliche, jedes gewaltsame Ende dagegen, hält man für aussernatürlich. Wir, die wir den Ursprung des Menschen kennen, erklären frischweg, dass sich von Natur der Tod gar nicht an den Menschen herangewagt habe, sondern erst infolge einer Schuld, die nicht einmal eine natürliche war. Es konnte aber leicht geschehen, dass das, was von der Geburt an durch ein zufälliges Überkommen uns anhängt, die Bezeichnung Natur bekam. Denn nur dann, wenn der Mensch für den Tod direkt angelegt gewesen wäre, müsste der Tod der Natur zugeschrieben werden. Dass er aber nicht für den Tod angelegt war, beweist das Gesetz, welches sich mit bedingter Drohung in der Schwebe hält und den Eintritt des Todes dem freien Willen des Menschen zuschreibt. Wenn er nicht gesündigt hätte, wäre er gar nicht gestorben. Somit kann nicht Natur sein, was infolge eines anheimgegebenen Anerbietens durch den freien Willen eingetreten ist und nicht mit Notwendigkeit auf Grund höherer Anordnung.</p><p>Wenn folglich der Verlauf des Sterbens auch ein verschiedener ist, je nach der verschiedenen Beschaffenheit der Ursachen, so ist der Tod doch niemals so sanft zu nennen, dass er ohne Gewalt geschähe. Was den Tod bewirkt, ist eben, wenn es auch einfach ist, Gewalt. Wie? Er ist es ja, welcher die so innige Verbindung von Seele und Leib, diese innige Vereinigung verschwisterter Substanzen trennt und zerreisst. Wenn jemand seinen Geist vor Freude aufgibt, wie der Spartaner Chilon, während er seinen zu Olympia siegreichen Sohn umarmte, oder infolge einer Auszeichnung, wie der Athener Klidemus, während er wegen seines vorzüglichen historischen Stiles mit einem goldenen Kranze gekrönt wurde, oder im Schlafe, wie Plato, durch Lachen, wie P. Crassus, so ist eine solche Todesart eigentlich noch viel gewaltsamer, weil sie sich ungewohnter Mittel bedient, weil sie die Seele aus ihren Annehmlichkeiten hinausjagt und uns den Tod dann anthut, wann zu leben angenehmer wäre, in der Freude, in der Ehre, in der Ruhe, im Vergnügen. Es ist dieselbe Gewalt, welche die Schiffe trifft, wenn sie weit von den kaphareischen Klippen, von keinem Wirbelwinde gepackt und nicht von Wogen umhergeschleudert, bei kosenden Lüftchen, gleitendem Lauf, fröhlicher Bemannung, bei sonst vollkommener Sicherheit, mit einem plötzlichen innern Krach in sich zusammenbrechen. Dem gleichen genau die Schiffbrüche des Lebens und der Eintritt sogar eines sanften Todes. Wenn die Fahrt der Seele einmal zu Ende ist, so verschlägt es nichts, ob das Schifflein des Leibes unbeschädigt versinkt oder zerschellt.</p>
      <h2>53</h2><p>Irgendwohin aber wird sich die entkleidete und hinausgestossene Seele wenden müssen? Ohne Zweifel. Wir werden der Reihe nach verfahren. Zuerst wollen wir jedoch, was hierher gehört, abmachen, damit man nicht, da wir verschiedenartige Ausgänge des Todes angenommen haben, von uns Rechenschaft über alle einzelnen erwarte. Dies muss man vielmehr den Ärzten überlassen, vor welche die Beurteilung der den Tod bewirkenden Dinge oder Ursachen sowie der körperlichen Dispositionen dazu gehört.</p><p>Ich will nur, um auch in dieser Hinsicht die Unsterblichkeit der Seele zu sichern, bei Erwähnung des Todes etwas über jene Art des Hinsterbens einfliessen lassen, wobei die Seele nach und nach stückweise hinschwindet. Denn sie scheidet dann mit dem äussern Anschein des Verlöschens, indem sie aufgezehrt zu werden scheint, und gibt durch ihr allmähliches Fortgehen Anlass zu der Vermutung, sie vergehe. Aber ihr Verhalten innerhalb wie ausserhalb des Körpers ist ein einheitliches. Wie nämlich der Verlauf eines solchen Todes auch immer sei, er ist ohne Zweifel eine Zerstörung entweder von Stoffen einzelner Körperteile oder der Lebensgänge. Unter den Stoffen verstehe ich Blut und Galle, unter den Körperteilen Herz und Leber, unter den Lebensgängen die Puls- und Blutadern. Wenn also diese Dinge infolge einer besonderen schädigenden Ursache im Körper verwüstet werden, bis zur äussersten Zerstörung und Auflösung der zum Leben erforderlichen, das ist der naturgemässen Grenzen, Lagen und Verrichtungen, so sieht sich auch die Seele, indem ihre Werkzeuge, Wohnsitze und Räume nach und nach zerfallen, allgemach notwendig gedrängt, auszuwandern und wird hinausbefördert, so dass der Schein einer Abnahme derselben entsteht, nicht anders, als wie wenn der Fuhrmann zu mangeln scheint, sobald ihm die Pferde aus Übermüdung den Dienst versagen, und dies geschieht infolge der Beschaffenheit des Menschen, der verlassen wird, nicht in der Weise eines wirklichen Vorganges. Ebenso steht der Fuhrmann des Körpers, der Lebensodem, still, nicht an sich, sondern wegen des stillstehenden Fuhrwerks, er lässt ab von seinem Thun, nicht von seiner Lebenskraft, er wird matt in seinem Handeln, nicht in seinem Sein, er verzehrt seine Beständigkeit, nicht seine Ständigkeit, weil er aufhört, nicht –— zu sein, sondern zu erscheinen. Jeder plötzliche Tod, z. B. ein Bruch des Genicks, der auf einmal die Thür soweit aufthut, und die Apoplexie, dieses innere Zusammensinken, gestattet der Seele keinen Verzug und zerlegt nicht ihren Ausgang martervoll in die einzelnen Momente. Hingegen wo der Tod ein langsamer ist, da verlässt die Seele in derselben Weise, wie sie verlassen wird. Doch wird sie keineswegs bei dieser Todesart in Stücke zerschnitten, sondern sie wird herausgezogen, und indem sie herausgezogen wird, lässt sie ihr Endstück als einen Teil erscheinen. Aber nicht jedes, was ein Teil ist, ist darum losgetrennt, weil es das Spätere ist, auch geht es nicht deshalb, weil es klein ist, sofort zu Grunde. Das Endglied folgt seiner ganzen Reihe, der mittlere Teil zieht sich nach dem obern hin, und der Rest, der mit dem Ganzen zusammenhängt, wird von demselben nur erwartet, nicht aber im Stich gelassen. Darum möchte ich zu sagen wagen, der letzte Teil des Ganzen sei das Ganze, weil er, obwohl geringer und später, doch zu ihm gehört.</p><p>Daher kommt es, dass die Seele bei der Trennung selbst oft kräftiger handelt mit sorgsamem Umblick und ausserordentlicher Redseligkeit, während sie, ihrer grösseren Masse nach schon freigestellt, durch den Rest, der noch im Körper zögernd zurückbleibt, mitteilt, was sie sieht, hört und zu erkennen anfängt. Denn wenn dieser unser Körper, nach dem Ausspruche Platos ein Kerker, nach dem des Apostels aber, weil er sich in Christus befindet, ein Tempel Gottes ist, so schnürt er doch jetzt immer noch die Seele durch seine Umklammerung ein, verdunkelt und benebelt sie durch das anhaftende Fleisch, obwohl er Christo zugehört. Daher kommt es, dass für sie die Beleuchtung der Dinge eine trübere ist, wie durch einen hörnernen Fensterverschluss. Ohne Zweifel wird sie durch die Gewalt des Todes aus dem Zusammenhang mit dem Fleische hinausgepresst und durch eben dieses Hinauspressen gereinigt. Sicherlich dringt sie durch den Vorhang des Leibes hindurch ins Freie zu dem reinen, lauteren, ihr eigentümlichen Lichte, erkennt sofort sich selbst in der leichteren Substanz und erwacht in der Freiheit zur Göttlichkeit, wie man im Schlafe von Traumbildern zur Wirklichkeit auffährt. Alsdann teilt sie mit, was sie sieht, dann ist sie froh oder verzagt, je nachdem ihr die Beschaffenheit ihres Aufenthaltsortes zusagt und der Gesichtsausdruck beschaffen ist, den ihr sogleich der Engel zeigt, der Aufrufer der Seelen, der Merkur der Dichter.</p>
      <h2>54</h2><p>Nun hätten wir anzugeben, wohin die Seele alsdann gethan wird. Fast alle Philosophen, welche die Unsterblichkeit der Seele, in welcher Weise auch immer, aufrecht erhalten, wie Pythagoras, Empedokles und Plato, sowie die, welche, wie die Stoiker, ihr nur einen gewissen Zeitraum gönnen, vom Tode an bis zur Verbrennung des Weltall, –— sie alle versetzen doch nur ihre, d. h. die Seelen der Weisen, in die höhern Wohnsitze. Und zwar gewährt Plato auch den Seelen der Philosophen nicht ohne weiteres diese Vergünstigung, sondern wohlgemerkt nur denen, welche ihre Philosophie mit dem Schmuck der Knabenliebe geziert haben. Bei den Philosophen hat demnach die Unreinheit sogar ein grosses Privilegium. Und so werden denn bei Plato die Seelen der Weisen in den Äther erhoben, bei Arius in die Luft, bei den Stoikern in die Region unter dem Monde. Dabei wundere ich mich nur, dass sie die unweisen Seelen in die Erdennähe verbannen, da sie behaupten, dieselben würden von den weisen, die sich an einem viel höheren Orte befinden, unterrichtet. Wo soll das Schullokal sein bei einem so grossen Abstande der Wohnorte? Auf welche Weise sollen die Schülerinnen mit ihren Lehrerinnen zusammenkommen, da sie durch einen solchen Zwischenraum von einander getrennt sind? Wozu soll ihnen endlich diese Unterweisung nach dem Tode dienen und nützen, da sie bei dem Weltbrande doch zu Grunde gehen werden? Die übrigen Seelen verweisen sie in die Unterwelt. Diese beschreibt Plato im Phädon als den Schooss der Erde, wo alle Unreinigkeiten der Welt zusammenfliessen, sitzen bleiben, verdunsten und durch ihren Schmutz und ihre Unsauberkeit gleichsam schwereren Atem und eine besondere Art dicker Luft verursachen.</p>
      <h2>55</h2><p>Von uns wird die Unterwelt nicht für eine blosse Aushöhlung oder eine oben offene Mistkaule der Erde, sondern für einen ungeheuren Raum im Abgrunde der Erde in der Tiefe und für einen entlegenen Schlund im Innern der Erde selbst gehalten. Denn wir lesen, dass Christus die drei Tage seines Totseins im Herzen der Erde zugebracht habe, d. h. in deren innerstem und innerlichstem Verlies, das noch in der Erde selbst verborgen, in ihr selbst verschlossen und mit noch tieferen Abgründen überbaut ist. Christus selbst, der Gott war, leistete also, weil er der Schrift zufolge ein Mensch, ein Toter und schliesslich auch ein Begrabener war, sogar diesem Gesetze Genüge, indem er der gewöhnlichen Form des menschlichen Totseins sich unterzog, und stieg nicht eher zu den höheren Regionen des Himmels empor, als bis er in die tieferen Regionen der Erde hinabgestiegen war, um dort den Patriarchen und Propheten Anteil an seiner Person zu verschaffen. Darum haben wir auch an eine unterirdische Region der Unterwelt zu glauben und jene Leute gleichsam mit dem Ellbogen dorthin zu stossen, welche stolz genug sind und die Seele der Gläubigen zu gut für die Unterwelt halten. Das sind Diener, die über ihrem Herrn, Schüler, die über dem Lehrer stehen wollen. Sie würden es vielleicht sogar verschmähen, den Trost anzunehmen, im Schoosse Abrahams die Auferstehung erwarten zu dürfen!</p><p>„Gerade dazu”, wenden sie ein, „hat Christus die Unterwelt betreten, damit wir es nicht brauchen. Was für ein Unterschied bestände denn zwischen Heiden und Christen, wenn ihr Kerker derselbe wäre?” –— Wie wäre es denn aber möglich, dass die Seele zum Himmel hinaufwalle, so lange Christus dort noch sitzt zur Rechten des Vaters, so lange man den Befehl Gottes durch die Posaune des Erzengels noch nicht vernommen hat, so lange diejenigen, welche die Ankunft des Herrn in dieser Welt finden soll, noch nicht ihm entgegen hinaufgezogen worden sind in die Lüfte samt denen, welche, in Christo abgeschieden, zuerst auferstehen werden? Niemandem steht der Himmel offen, so lange die Erde noch besteht, um nicht zu sagen, so lange sie noch verschlossen ist. Denn erst mit der Umwandlung der Erde werden die Reiche des Himmels aufgeschlossen.</p><p>Dann wird unsere Ruhestätte wohl bei den Knabenschändern des Plato sein, in der Luft bei Arius, oder um den Mond herum mit den Endymionen unter den Stoikern?! Nein, entgegnet man uns, im Paradiese, wohin schon damals die Patriarchen und Propheten als Gefolgschaft der Auferstehung des Herrn übergesiedelt sind. –— Wie kam es dann aber, dass die Region des Paradieses, die dem Johannes im Geiste enthüllt wurde und die unter dem Altare gelegen ist, keine andern Seelen als solche von Martyrern aufzuweisen hatte? Wie kam es, dass die beherzte Martyrin Perpetua, als ihr am Tage ihres Leidens das Paradies enthüllt wurde, dort nur die Seelen ihrer Mitmartyrer erblickte, wenn nicht daher, dass das Schwert, welches die Pforte des Paradieses bewacht, nur denen Platz macht, die in Christo, nicht denen, die in Adam verschieden sind? Die neue Todesart für Gott und der aussergewöhnliche Tod für Christus finden in einer andern und besondern Herberge Aufnahme. Daraus also entnehme man den Unterschied zwischen einem Heiden und einem Gläubigen in bezug auf den Tod, wenn wir für Gott sterben, wie der Paraklet ermahnt, nicht in weichlichen Fieberchen und Bettchen, sondern im Martyrtum, wenn wir unser Kreuz auf uns nehmen und dem Herrn folgen, wie er selber vorgeschrieben hat. Der Schlüssel zum Paradies ist Dein eigenes Blut. Es existiert von uns auch eine eigene Schrift <em>über das Paradies</em>, worin wir festgestellt haben, dass alle Seelen in der Unterwelt verwahrt gehalten werden bis zum Tage des Herrn.<k> 56. Cap. Über die Ansicht der Alten, die Seelen könnten nicht in die Unterwelt eingehen, bevor die Leiche beerdigt ist. <k> Es drängt sich uns nun die Untersuchung darüber auf, ob dies unmittelbar nach dem Hinscheiden geschieht oder ob einzelne Seelen durch irgend welche Umstände einstweilen noch hier zurückgehalten werden, so wie auch, ob sie, dorthin aufgenommen, nach ihrem Gutdünken oder infolge eines besonderen Befehles nachher noch bei uns erscheinen dürfen. Denn auch hierfür fehlt es nicht an Wahrscheinlichkeitsgründen. Man hat geglaubt, die Unbeerdigten könnten nicht eher in die Unterwelt gelangen, als bis sie ihr Recht bekommen haben, nach Art des Patroklus bei Homer, der in Traumgesichten von Achilles sein Begräbnis verlangte, weil er sich sonst den Thüren der Unterwelt nicht nahen dürfe und die Seelen der Begrabenen ihn davon fern hielten. Wir kennen aber ausser den poetischen Licenzen auch die fromme Sorgfalt des Homer. Denn er hat eine um so grössere Sorgfalt auf das Begräbnis verwendet, je mehr er den Aufschub desselben getadelt hat als eine Beleidigung für die Seelen. Auch solle niemand einen Verstorbenen im Hause behalten und sich dadurch selbst mit ihm noch mehr abhärmen durch einen so ungewöhnlichen Trost, der im Schmerze seine Nahrung findet. Daher hat er die Klagen der unbegrabenen Seele auf beides gerichtet sein lassen, dass durch das sofortige Begräbnis einerseits die der Leiche gebührende Ehre gewahrt, andererseits der Gedanke an die frühere Liebe gemässigt werde.</k></k></p><p>Wie sinnlos aber ist es, die Seele auf das warten zu lassen, was dem Körper gebührt, gerade als ob sie etwas davon in die Unterwelt mit sich fortnehme! Noch viel thörichter ist es, die Verzögerung des Begräbnisses als ein Unrecht gegen die Seele anzusehen. Dieselbe müsste das eher als eine Gunst begrüssen. Denn da sie nicht sterben wollte, so wird sie in jedem Falle vorziehen, lieber recht spät zur Unterwelt hinweggeführt zu werden. Sie wird den lieblosen Erben gern haben, durch dessen Schuld sie sich des Lichtes noch erfreut. Oder aber wenn es wirklich ein Unrecht ist, spät unter die Erde hinabgestossen zu werden, und der Titel dieses Unrechtes in der Verzögerung des Begräbnisses besteht, so wäre es ja höchst unbillig, dieses Unrecht der Seele zuzufügen, der die Verzögerung des Begräbnisses gar nicht zugerechnet werden kann; denn dasselbe ist ja Pflicht ihrer Nebenmenschen!</p><p>Auch die von einem vorzeitigen Tode getroffenen Seelen, sagt man, schweifen hier so lange umher, bis der Rest ihrer Lebenszeit erfüllt sei, so lange als sie gelebt haben würden, wenn sie nicht vorzeitig gestorben wären. –— Entweder ist jedem seine Zeit bestimmt, und dann glaube ich nicht, dass ihm von der festgesetzten Zeit etwas entrissen werden kann, oder wenn sie zwar festgesetzt, aber durch den Willen Gottes oder eine andere Macht verkürzt worden ist, so würde ja diese Verkürzung illusorisch gemacht, wenn sie doch noch ihre Erfüllung zu erwarten hätte. Ist ihre Zeit dagegen nicht festgesetzt, so gibt es auch keinen Rückstand von Zeiten, die ja nicht festgesetzt sind. Ich sage noch mehr: Siehe, es ist beispielsweise ein Säugling an der Mutterbrust verschieden, meinetwegen auch ein Knabe, der noch keine Kleider trägt, oder auch einer, der welche trägt, der aber achtzig Jahre gelebt haben würde. Was soll es nun wohl heissen, seine Seele verlebe diese ihr entrissenen Jahre nach dem Tode noch? Er kann ja kein höheres Lebensalter erreichen ohne den Körper, weil sich die Lebensstufen nur mittels des Körpers vollziehen.</p><p>Die Unsrigen mögen ferner noch bedenken, dass die Seele denselben Leib wieder bekommen wird, in welchem sie verstorben ist. Man wird also auch dieselbe Beschaffenheit des Körpers und dieselbe Altersstufe zu hoffen haben, welche eine Folge der dermaligen Beschaffenheit des Körpers ist. Wie ginge es also an, dass die Seele eines Kindleins hier die ihr geraubten Jahre zubrächte, um sodann als eine Achtzigerin in einem Leibe von <em>einem</em> Monat aufzuerstehen? Oder, wenn es durchaus nötig ist, die Zeiträume, welche für eine Seele festgesetzt waren, hier zu durchlaufen, so frage ich, wird sie dann die Lebensthätigkeiten, welche den betreffenden Zeiträumen entsprechen und ihr mit letzteren hienieden bestimmt waren, auch der Reihe nach hienieden ebenso durchmachen, also studieren, wenn sie aus dem Kindes- ins Knabenalter tritt, Kriegsdienste leisten, sobald das Jünglingsalter vom Mannesalter abgelöst wird, die Staatslasten tragen, wenn das Mannesalter das Ansehen des Greisenalters erhält, Zinsen herausschlagen, das Land bebauen, Schifffahrt treiben, Prozesse führen, heiraten, arbeiten, Krankheiten durchmachen und alles andere, was Trauriges und Freudiges ihrer mit jenen Zeiträumen gewartet hätte? Wie soll man dieses durchmachen ohne Körper? wie leben, ohne zu leben? Zeiträume aber, die in blossem Abwarten zu durchlaufen wären, würden zwecklos sein. Was steht folglich im Wege, dass man sie nicht auch in der Unterwelt abwarten könne, wo doch ebensowenig ein Gebrauch davon gemacht wird? Daher behaupten wir, jede Seele, in welchem Lebensalter sie auch das Leben verlassen haben sollte, bleibe in demselben stehen bis zu dem Tage, auf welchen der nach dem Maasse der Vollkommenheit der Engel gebildete vollkommene Zustand verheissen ist.</p><p>Mithin sind auch die Seelen derer, welche gewaltsamer Weise dem Leben entrissen wurden, vorzüglich durch grausige Leibesstrafen, als da sind Kreuz, Beil, Schwert, wilde Tiere nicht als von der Unterwelt ausgeschlossen zu betrachten, auch darf man die Todesarten, welche die Gerechtigkeit, die Rächerin von Gewaltthaten beschliesst, gar nicht als Gewaltthaten ansehen. Eben darum wird man nun wohl einwenden, sind es die verbrecherischen Seelen, welche aus der Unterwelt ausgeschlossen bleiben. Mithin nötige ich, festzustellen, ob die Unterwelt gut oder böse sei. Wenn man sich für das letztere entscheidest, dann müssten die allerschlechtesten Seelen hineingestürzt werden; wenn sie aber gut ist, warum will man denn die Seelen der vor der Zeit und ehelos Verstorbenen gerade die nach Maassgabe ihrer Lebenszeit reinen und unschuldigen Seelen, jetzt noch derselben für unwürdig halten?</p>
      <h2>56</h2><p>Es drängt sich uns nun die Untersuchung darüber auf, ob dies unmittelbar nach dem Hinscheiden geschieht oder ob einzelne Seelen durch irgend welche Umstände einstweilen noch hier zurückgehalten werden, so wie auch, ob sie, dorthin aufgenommen, nach ihrem Gutdünken oder infolge eines besonderen Befehles nachher noch bei uns erscheinen dürfen. Denn auch hierfür fehlt es nicht an Wahrscheinlichkeitsgründen. Man hat geglaubt, die Unbeerdigten könnten nicht eher in die Unterwelt gelangen, als bis sie ihr Recht bekommen haben, nach Art des Patroklus bei Homer, der in Traumgesichten von Achilles sein Begräbnis verlangte, weil er sich sonst den Thüren der Unterwelt nicht nahen dürfe und die Seelen der Begrabenen ihn davon fern hielten. Wir kennen aber ausser den poetischen Licenzen auch die fromme Sorgfalt des Homer. Denn er hat eine um so grössere Sorgfalt auf das Begräbnis verwendet, je mehr er den Aufschub desselben getadelt hat als eine Beleidigung für die Seelen. Auch solle niemand einen Verstorbenen im Hause behalten und sich dadurch selbst mit ihm noch mehr abhärmen durch einen so ungewöhnlichen Trost, der im Schmerze seine Nahrung findet. Daher hat er die Klagen der unbegrabenen Seele auf beides gerichtet sein lassen, dass durch das sofortige Begräbnis einerseits die der Leiche gebührende Ehre gewahrt, andererseits der Gedanke an die frühere Liebe gemässigt werde.</p><p>Wie sinnlos aber ist es, die Seele auf das warten zu lassen, was dem Körper gebührt, gerade als ob sie etwas davon in die Unterwelt mit sich fortnehme! Noch viel thörichter ist es, die Verzögerung des Begräbnisses als ein Unrecht gegen die Seele anzusehen. Dieselbe müsste das eher als eine Gunst begrüssen. Denn da sie nicht sterben wollte, so wird sie in jedem Falle vorziehen, lieber recht spät zur Unterwelt hinweggeführt zu werden. Sie wird den lieblosen Erben gern haben, durch dessen Schuld sie sich des Lichtes noch erfreut. Oder aber wenn es wirklich ein Unrecht ist, spät unter