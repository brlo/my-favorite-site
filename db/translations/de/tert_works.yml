      <p><em>Über den Leib Christi, übersetzt von Karl Adam Heinrich Kellner (Köln 1882).</em></p><h2>1</h2><p>Diejenigen, welche den Glauben an die Auferstehung, einen Glauben, der bis auf die Zeit der gegenwärtigen Geistesverwandten der Sadduzäer unangefochten geblieben ist, wankend zu machen suchen, indem sie leugnen, dass besagte Hoffnung auch dem Fleische gelte, die zerren natürlich auch die Leiblichkeit Christi auf dem Kampfplatze ihrer Kontroversen auseinander. Sie soll dann entweder gar keine oder doch eine andere als die menschliche gewesen sein, letzteres, damit nicht, wenn es sich ergeben sollte, dass sie doch eine menschliche gewesen, dadurch gegen sie das Präjudiz ausgesprochen sei: Was bei Christus auferstanden ist, wird in jedem Falle der Auferstehung teilhaftig.</p><p>Auf derselben Basis also, von der aus jene die Hoffnungen des Leibes zerstören, müssen wir sie verbollwerken. Untersuchen wir die Substanz des Leibes des Herrn, — in betreff seiner geistigen nämlich ist die Sache ausgemacht. Es handelt sich um seinen Leib; die Wirklichkeit und Beschaffenheit desselben bildet den Gegenstand unserer Verhandlung, <em>ob</em> er einen hatte, <em>woher</em> er ihn hatte und <em>wie</em> er beschaffen war. Das Resultat davon wird uns zugleich über unsere Auferstehung Aufschluss geben.</p><p>Um die Leiblichkeit Christi leugnen zu können, leugnete Marcion auch dessen Geburt, oder um die Geburt leugnen zu können, leugnete er auch seine Leiblichkeit, in der Absicht nämlich, damit beides nicht gegenseitig Zeugnis für einander ablege, die Geburt für das Fleisch und umgekehrt. Denn ein Geborenwerden ohne Leiblichkeit ist ebenso wenig denkbar als eine Leiblichkeit ohne Geborensein. Und doch hätte er mit derselben häretischen Willkür können die Leiblichkeit zulassen, die Geburt dagegen leugnen, wie es sein Schüler und nachmaliger Gegner Apelles gemacht hat. Er konnte ferner ebenso leicht sogar beides, die Leiblichkeit und die Geburt, zugeben und doch beides anders bestimmen, wie sein Mitschüler und ebenfalls nachmaliger Gegner es gemacht hat, Valentinus. Wer die Theorie von einem Scheinleibe Christi in Schwang brachte, der konnte sogar geradeso leicht eine Scheingeburt ersinnen; dann wäre auch die Empfängnis, die Schwangerschaft und das Gebären der Jungfrau sowie der darauf folgende Verlauf der Kindheit für Schein gehalten worden. Diese Dinge hätten ja nur dieselben Augen und dieselben Sinne getäuscht, welche durch die falsche Vorstellung von einer Leiblichkeit betrogen wurden.</p>
      <h2>2</h2><p>Seine Geburt wird unzweideutig von Gabriel angekündigt, — was aber hat jener Mensch mit dem Engel des Schöpfers zu schaffen? Die Empfängnis im Schoosse der Jungfrau wird auch beseitigt. — Was hat er mit Isaias, dem Propheten des Schöpfers, zu schaffen? Die Verzögerungen sind ihm verhasst; lässt er doch Christum mit einem Schlage vom Himmel herunterkommen. „Fort mit den beständigen lästigen Schatzungen des Kaisers“, sind seine Worte, „fort mit der überfüllten Herberge, fort mit den schmutzigen Windeln und der harten Krippe! Will die Engelschar ihren Herrn in den Nächten ehren, meinetwegen, die Hirten aber sollten lieber auf ihr Vieh acht geben, und die Magier brauchten sich nicht so weit herzubemühen; ich schenke ihnen ihr Gold! Herodes sollte auch besser sein, damit Jeremias sich nicht rühme. Das Kind braucht sich nicht beschneiden zu lassen, damit es keine Schmerzen habe, und nicht zum Tempel getragen zu werden, damit es seinen Eltern nicht mit den Kosten der Darstellung beschwerlich falle, auch braucht es nicht dem Simeon auf die Arme gegeben zu werden, damit der lebensmüde Greis nicht getröstet werde. Das alte Weib kann den Mund halten und braucht den Knaben nicht zu behexen.“</p><p>Ratschläge von dieser Sorte, meine ich, sind es, womit Du, Marcion, dich unterstanden hast, die so zahlreichen authentischen Beweisschriften Christi vernichten zu wollen, damit seine Leiblichkeit nicht bewiesen werden könne. Lass erst einmal Deine Autorisation sehen! Bist Du ein Prophet, so verkündige etwas vorher; bist Du ein Apostel, so predige öffentlich; bist Du ein Apostelschüler, so denke wie die Apostel; bist Du ein blosser Christ, so glaube an die Überlieferung. Wenn Du aber von allem dem nichts bist, so würde ich mit Recht sagen: Stirb! Denn Du bist schon tot, Du, der Du kein Christ bist und den Glauben nicht hast, der zum Christen macht. Du bist umsomehr tot, je weniger Du ein Christ bist, denn Du bist abgefallen, nachdem Du Christ geworden und hast widerrufen, was Du vordem glaubtest, wie Du in einem Deiner Briefe selbst eingestehst, wie die Deinigen nicht leugnen und die Unsrigen es beweisen. Indem Du cassierst, was Du geglaubt hast, bist Du bei dieser Zurücknahme schon kein Gläubiger mehr; dennoch ist Deine Zurücknahme keine rechtmässige, weil Du den Glauben verloren hast.</p><p>Nun aber beweisest Du durch Deinen Widerruf gerade, dass es sich vor diesem Widerruf anders verhalten habe. Dein früherer anderer Glaube entsprach der Überlieferung. Was aber auf der Überlieferung beruht, das war das Richtige, weil von denen überliefert, die zum Lehramte berufen waren. Folglich, wenn Du die Überlieferung bekämpftest, so hast Du das Richtige bekämpft. Du hast das ohne Berechtigung gethan. Jedoch das sind Prozesseinreden gegen sämtliche Häresien, deren wir uns vollständiger schon an einem andern Orte bedient haben. Nach denselben ist es eigentlich Überfluss, dass wir uns jetzt in Verhandlungen einlassen, getrieben von dem Verlangen, Rechenschaft darüber zu erhalten, warum Du die Geburt Christi nicht annehmen willst.</p>
      <h2>3</h2><p>Da Du meinst, dies sei Deinem Gutdünken anheim gegeben, so musst Du notwendig ein Geborenwerden Gottes entweder für unmöglich oder für Gottes unwürdig gehalten haben. Allein es ist Gott nichts unmöglich als nur das, was er nicht will. Erwägen wir mithin, ob er geboren werden wollte, weil, wofern er es nur wollte, er es auch konnte und also auch wirklich geboren worden ist.</p><p>Ich fasse die Sache kurz. Wollte Gott nicht geboren werden — aus welcher Ursache auch immer — dann hätte er es auch nicht geschehen lassen, dass er Mensch zu sein scheine. Denn wer würde, wenn er einen Menschen sieht, sagen, derselbe sei nicht geboren worden? Was er also nicht <em>sein</em> wollte, dafür konnte er auch in keinem Falle <em>angesehen</em> werden wollen. Von jeder Sache, welche uns missliebig ist, weist man auch den Schein ab, weil es gar keinen Unterschied macht, ob sie etwas ist oder ob nicht, wenn an ihr Vorhandensein trotzdem geglaubt wird, obwohl sie nicht da ist. Offenbar liegt aber etwas daran, dass nichts Falsches geglaubt werde, was in Wahrheit nicht ist.</p><p>Ihm genügte, wendest Du ein, sein eigenes Wissen um die Sache; wenn die Menschen ihn für einen Geborenen hielten, da sie einen Menschen sahen, so war das ihre Sache. — Gut, wie viel würdiger und consequenter wäre es also von ihm gewesen, wenn er sich die Ansicht der Menschen über sich gefallen liess, als ein wirklich Geborner, da er ja, ohne geboren zu sein, ganz dieselbe Ansicht tragen sollte gegen sein besseres Wissen, welches Du als die Bürgschaft dafür ansiehst, dass er, obwohl ein nicht Geborner, sich doch ruhig gefallen liess, gegen sein eignes Wissen für einen Gebornen gehalten zu werden. Warum lag denn so viel daran, dass Christus, der recht gut wusste, was er war, sich als etwas hingestellt hätte, was er nicht war? Gib uns darüber Aufschluss! Du kannst nicht sagen, es geschah, damit er durch seine Geburt und wahrhaftige Menschwerdung nicht aufhöre, Gott zu sein, und nicht verliere, was er war, indem er wurde, was er nicht war. Denn eine Gefährdung seines Standes gibt es für Gott nicht.</p><p>Nein, erwiderst Du, dass sich Gott wirklich in einen Menschen verwandelte, so zwar, dass er auch geboren wurde und durch das Fleisch mit einem Körper versehen wurde, das leugne ich deshalb, weil derjenige, welcher ohne Ende ist, notwendigerweise auch keiner Verwandlung fähig ist. Denn in etwas anderes verwandelt werden, ist gleichbedeutend mit dem Aufhören des vorigen Zustandes. Also wem es nicht zukommt, ein Ende zu nehmen, dem kommt es auch nicht zu, eine Verwandlung zu erleiden. — Allerdings gilt für das Wesen der veränderlichen Dinge das Gesetz, dass sie bei dem, was sich an ihnen verändert, nicht stehen bleiben und dass sie so durch das Nichtbleiben vergehen, indem sie ihr voriges Sein durch Veränderung verlieren. Aber es gibt nichts, was Gott gleich wäre; sein Wesen ist von den Seinsbedingungen aller andern Dinge weit verschieden. Wenn demnach Dinge, welche von Gott weit verschieden sind und von welchen auch Gott weit verschieden ist, durch Veränderung ihr früheres Sein verlieren, wo bliebe dann die Verschiedenheit der Gottheit von den übrigen Dingen, wenn ihr nicht das Gegenteil davon zukommt, nämlich sich in alles verwandeln zu können und doch zu bleiben, wie sie ist? Wo nicht, so würde Gott ja den Dingen gleich sein, welche durch Veränderung ihr früheres Sein verlieren, denen er schlechterdings in allen ungleich ist, mithin auch hinsichtlich der etwa zu erleidenden Veränderungen.</p><p>Dass die Engel des Schöpfers in Bilder von Menschen verwandelt wurden, hast Du ja einstens gelesen und geglaubt; auch dies, dass sie mit einem so sehr reellen Körper versehen waren, dass Abraham ihnen die Füsse wusch, Lot durch ihre Hände den Sodomiten entrissen wurde und dass ein Engel, der mit einem Menschen gekämpft hatte, von dem ganzen Gewichte des Leibes befreit zu werden verlangte; so sehr wurde er festgehalten. Was also den Engeln des niedern Gottes, wenn sie in die menschliche Körperlichkeit verändert wurden, vergönnt war, nämlich, trotzdem Engel zu bleiben, das wolltest Du Gott, der mächtiger ist, absprechen, als wäre es Christus, da er mit einem wahrhaftigen Menschen bekleidet wurde, nicht möglich gewesen, Gott zu bleiben?! Oder erschienen etwa auch jene Engel als blosse Phantasmen des Fleisches? Du wirst wohl nicht wagen, das zu behaupten. Wenn bei Dir die Engel dem Schöpfer angehören, sowie Christus auch, so wird er der Christus des Gottes sein, dem die Engel zugehören, die so beschaffen sind wie Christus.</p><p>Wenn Du nicht die Bücher der Schrift, welche Deiner Meinung entgegenstehen, teils verworfen, teils verfälscht hättest, so würde Dich in diesem Stücke das Evangelium des Johannes widerlegen, welches erzählt, dass der hl. Geist mit dem Leibe einer Taube sich herabgesenkt und über dem Herrn geruht habe. Obwohl er der Geist war, so war er so wahrhaftig eine Taube, als er der Geist war, und er hatte nicht seine eigene Wesenheit durch die Annahme einer fremden getötet. Du wirfst nun die Frage auf, wo denn der Taubenleib, nachdem der Geist in den Himmel zurückgenommen war, geblieben sei, wie auch der der Engel? Er ist in derselben Weise hinweggenommen, wie er geschaffen wurde. Wenn Du gesehen hättest, wie er aus dem Nichts hervorgezogen wurde, so würdest Du es auch gewahr geworden sein, als er ins Nichts zurückversetzt wurde. War aber sein Anfang nicht sichtbar, dann ist es auch sein Ende nicht. Und doch war der Körper ein dichter und undurchdringlicher in jedem Momente, da er als ein Körper gesehen wurde. Es ist unmöglich, dass das nicht existiert haben sollte, dessen Dasein die hl. Schrift behauptet.</p>
      <h2>4</h2><p>Wenn Du also die Annahme eines Körpers weder als unmöglich noch als der Gottheit Gefahr bringend zurückweisen kannst, so bleibt noch übrig, sie als seiner unwürdig zu verwerfen und anzuklagen. Von dem Geburtsakt selbst anfangend, peroriere nun über die Unsauberkeit der Zeugungsstoffe im Mutterleibe, über das abscheuliche Zusammenlaufen der Feuchtigkeit und des Blutes zum Zwecke, das Fleisch mit demselben Unflat neun Monate hindurch zu nähren. Beschreibe, wie der Mutterleib von Tag zu Tag mehr anschwillt, wie er schwer, beängstigend, sogar im Schlafe unruhig, zwischen Leckerhaftigkeit und Widerwillen unbeständig hin- und herschwanke. Ziehe dann auch los gegen die Scheu des gebärenden Weibes selbst, das doch vielmehr wegen der Gefahr zu ehren wäre und durch die Natur geheiligt ist. Jedenfalls ist Dir das Kind, das nun mit allen seinen Umhüllungen herausgebracht ist, ein Greuel, Du verabscheuest es gewiss auch dann noch, wenn es abgewaschen ist, weil es mit Windeln zusammengehalten, mit Einreibungen behandelt und mit Liebkosungen angelacht wird. — Diese verehrungswürdige Einrichtung der Natur, Marcion, verachtest Du? Auf welche Weise bist denn Du geboren worden? Du hassest den Menschen in seiner Geburt?! — Wie wirst Du da noch irgend jemand lieben können? Dich wenigstens hast Du offenbar nicht geliebt, indem Du ja der Kirche und dem Glauben Christi untreu geworden bist.</p><p>Doch wenn Du Dir selbst missfällst oder auch auf irgend eine andere Art geboren bist, so ist das Deine Sache! Christus wenigstens hat sicher den Menschen geliebt, obwohl derselbe im Mutterleibe aus Unreinigkeiten zusammenrinnt, vermittels der Schamteile ans Licht kommt und unter Schäckereien gross gefüttert wird. Seinetwegen ist er herabgestiegen, seinetwegen hat er gepredigt, seinetwegen sich in jeder Art von Demütigung erniedrigt bis zum Tode, und zwar bis zum Tode am Kreuze. Wen er um einen grossen Preis zurückkaufte, den hat er ganz gewiss geliebt. Wenn Christus dem Schöpfer angehört, so hat er nur das Seinige geliebt, wie es sich gebührt. Kam er dagegen von einem andern Gott, so war seine Liebe noch grösser, weil er Fremdes zurückgekauft hat.</p><p>Demzufolge liebte er mit dem Menschen auch dessen Geburt und Leiblichkeit. Denn nichts kann geliebt werden, losgetrennt, von dem wodurch es das ist, was es ist. Verhindere die Geburt und dann zeige uns noch einen Menschen, nimm den Leib hinweg, und lass uns dann den sehen, den Gott erlöst hat. Wenn aus diesen Dingen der Mensch besteht, den Gott erlöst hat, so zwingst Du ihn, sich dessen, was er erlöst hat, zu schämen und machst das, was er, wenn er es nicht geliebt, auch nicht erlöst hätte, zu etwas Unwürdigem.</p><p>Nachdem er den Geburtsakt durch eine himmlische Geburt wiederhergestellt hatte, befreite er den Leib von jeder Art Plage, aussätzige Leiber hat er von ihren Flecken gereinigt, blinden das Licht wiedergegeben, paralytische geheilt, dämonische gesühnt, tote auferweckt — und wir sollten uns des Leibes schämen müssen? Wenn Christus es für gut befunden hätte, seinen Ausgang aus einer Wölfin, Sau oder Kuh zu nehmen und mit einem Tierleibe überkleidet das Himmelreich zu predigen, dann wäre Dein Tadel: das sei Gottes unangemessen, des Sohnes Gottes unwürdig und etwas Dummes, der sei ein Narr, der so etwas glaube, eine wirksame Einrede.</p><p>Es würde allerdings etwas Dummes sein, wenn wir über Gott urteilen wollten nach unserer Denkart. Aber sieh zu, Marcion; vielleicht hast Du den Ausspruch; „Was thöricht vor der Welt ist, hat Gott auserwählt, um das, was weise, zu verwirren,“ noch nicht ausgestrichen. Welches sind denn diese thörichten Dinge? Die Bekehrung des Menschen zur Verehrung des wahren Gottes, die Ablegung des Irrtums, die Zucht der Gerechtigkeit, die Keuschheit, Barmherzigkeit, Geduld und jede Art Sittlichkeit. Das alles, sind es nicht Thorheiten? Suche mithin zu erforschen, welche Dinge er gemeint haben könne, und wenn Du glaubst, etwas gefunden zu haben, wird es wohl eine so grosse Thorheit sein, als an einen Gott zu glauben, der geboren worden ist, und zwar von einer Jungfrau, und noch dazu im Fleische, einen, der die genannten Niedrigkeiten der Natur alle durchgemacht hat? Da sage einer noch, das seien keine Thorheiten und es gebe noch andere Dinge, die Gott zur Bekämpfung der irdischen Weisheit auserkoren habe! Diese letztere aber bequemt sich leichter dazu, zu glauben, Jupiter habe sich in einen Stier oder Schwan verwandelt, als dass Marcion glaubt, Christus sei wirklich Mensch geworden.</p>
      <h2>5</h2><p>Es gibt allerdings noch andere Dinge, welche in demselben Grade den Charakter der Thorheit an sich tragen, nämlich alles, was zu der Schmach und den Leiden Gottes gehört. Oder will man die Lehre von einem gekreuzigten Gott als Klugheit bezeichnen? Beseitige diese auch noch, Marcion, oder richtiger, sie zuerst. Denn was ist Gottes wohl weniger würdig, geboren zu werden oder zu sterben, eine Leiblichkeit zu tragen oder ein Kreuz, beschnitten oder angeheftet zu werden, erzogen oder begraben zu werden, in eine Krippe gelegt oder in einem Grabmal beigesetzt zu werden? Du wirst noch weiser sein, wenn Du diese Dinge auch nicht mehr glaubst. Und doch wirst Du nicht weise werden, wenn Du nicht vor der Welt zum Thoren geworden bist, dadurch, dass Du die Thorheiten Gottes glaubst.</p><p>Oder hast Du vielleicht aus dem Grunde das Leiden von Christo nicht hinweggenommen, weil er als ein Phantasma keine Empfindung davon hatte? Ich habe vorhin schon bemerkt, dass er sich der wesenlosen Spielerei einer eingebildeten Geburt und Kindheit ebenso leicht hätte unterziehen können. Antworte daher, Du Mörder der Wahrheit, nunmehr auf folgende Fragen: Ist Gott nicht wirklich gekreuzigt worden? Ist er nicht wirklich gestorben, weil er wirklich gekreuzigt war? Ist er nicht wirklich auferweckt, weil er wirklich tot war? Dann hat sich Paulus also wohl mit Unrecht vorgenommen, unter uns nichts zu wissen, als Jesum den Gekreuzigten? Er hat auch seines Begräbnisses mit Unrecht gedacht und mit Unrecht seine Auferstehung betont? Falsch ist also auch unser Glaube und ein Phantasma alles, was wir von Christus hoffen? — Du grösster Verbrecher unter den Menschen, Du entschuldigst ja die Mörder Gottes! Denn wenn Christus nicht wirklich gelitten hat, so hat er auch von ihnen nichts zu leiden gehabt. Übe doch Schonung gegen den einzigen Gegenstand der Hoffnung des ganzen Erdkreises! Warum zerstörst Du die dem Glauben so nötige Schmach? Was immer da auch Gottes unwürdig ist, das ist mein Vorteil. Mein Heil ist es, wenn ich ob meines Herrn nicht in Verwirrung gerate. „Wer sich meiner“, sagt er, „schämen wird, dessen werde ich mich auch schämen.“</p><p>Andere Veranlassungen, mich zu schämen, die mir durch Verachtung der Beschämung Gelegenheit geben, mich zu bewähren, und mein Nichterröten zu einem heilsamen, meine Thorheit zu einer glückseligen machen könnten, finde ich keine. Gottes Sohn ist gekreuzigt worden — ich schäme mich dessen nicht, gerade weil es etwas Beschämendes ist. Gottes Sohn ist gestorben — das ist erst recht glaubwürdig, weil es eine Thorheit ist; er ist begraben und wieder auferstanden — das ist ganz sicher, weil es unmöglich ist. Denn wie könnte etwas Wirkliches an ihm sein, wenn er selbst nicht ein Wirklicher war, wenn er nicht wirklich etwas an sich hatte, was angenagelt werden, was sterben, begraben und wieder auf erweckt werden konnte, nämlich unser Fleisch, vom Blute durchströmt, an einem Knochengerüst aufgebaut, von Nerven durchwoben und von Adern durchflochten, welches geboren werden und sterben konnte und ohne Zweifel ein menschliches war, weil aus einem Menschen geboren. Deshalb eben wird es bei Christus ein sterbliches gewesen sein, weil Christus ein Mensch und der Menschensohn war. Oder warum ist Christus Mensch und Menschensohn, wenn er nichts von einem Menschen und nichts aus einem Menschen an sich hatte? Es müsste denn etwa der Mensch etwas anderes sein können als Fleisch, oder das menschliche Fleisch anderswoher stammen können als aus einem Menschen, oder Maria ist etwas anderes gewesen als ein Mensch, oder aber der Gott Marcions ist Mensch. Andernfalls würde Christus gar nicht Mensch genannt worden sein ― nämlich ohne Fleisch ― noch Menschensohn ― ohne eine menschliche Gebärerin, ebenso wenig als Gott ― ohne den Geist Gottes, oder Gottes Sohn ― ohne einen göttlichen Vater.</p><p>So hat die Abstammung beider Naturen uns den Gottmenschen gezeigt, auf der einen Seite als den geborenen, auf der andern als den ungeborenen, hier leiblich, dort geistig, hier schwach, dort überstark, hier sterbend, dort lebend. Diese Eigentümlichkeiten der beiden Seinsweisen, der göttlichen und menschlichen, sind in gleicher Realität bei beiden Naturen vollendet, mit derselben Glaubhaftigkeit des Geistes und des Leibes. Die Wunder des Geistes Gottes haben den Gott, die Leiden den menschlichen Leib dokumentiert. Wenn die Wunder nicht ohne den Geist zustande kamen, dann ebenso wenig die Leiden ohne das Fleisch. Wenn das Fleisch mit seinen Leiden ein fingiertes war, dann war auch der Geist mit seinen Wunderkräften kein echter.</p><p>Warum spaltest Du durch Deine falschen Aussagen Christum? Nur in seiner Ungeteiltheit war er eine Wirklichkeit. Er hätte es, glaube mir, weit vorgezogen, sich der Geburt zu unterziehen, als in einem Punkte zu lügen und noch dazu in betreff seiner eignen Person, einen Leib zu haben, der ohne Knochen Festigkeit, ohne Muskeln Stärke besass, ohne Blut zu haben, blutig war, der, ohne ein Gewand zu haben, bekleidet war, den ohne die Empfindung des Hungers hungerte, der ohne Zähne ass und ohne Zunge redete, so dass seine Rede durch den Glauben, dass man eine Stimme höre, für die Ohren etwas Gespenstisches gehabt hätte. Er war dann auch nach seiner Auferstehung noch ein blosses Phantasma, als er die Jünger seine Hände und Füsse sehen liess mit den Worten: „Sehet, dass ich es bin, da ein Geist ja keine Knochen hat, wie ihr seht, dass ich habe“, ohne Zweifel Hände, Füsse und Knochen, nicht wie sie der Geist besitzt, sondern der menschliche Leib. Wie willst Du diesen Ausspruch erklären, Marcion, der Du ja Deinen Jesus vom höchsten, einfachen, guten Gotte kommen lassest? Siehe da! er täuscht, betrügt und überlistet die Augen aller, die Sinne aller, alle noch beim Herzutreten und Betasten. Folglich hättest Du Deinen Christus nicht sollen vom Himmel kommen lassen, sondern aus irgend einer Gauklertruppe, nicht sollen zum Menschen und Gott machen, sondern zum Menschen und Zauberer, nicht zu einem Priester des Heils, sondern zu einem Bühnenkünstler, nicht zu einem Auferwecker der Toten, sondern zu einem Wegzauberer der Lebendigen. Nur musste er, wenn er ein Zauberer war, jedenfalls auch geboren sein.</p>
      <h2>6</h2><p>Gewisse Schüler des Mannes aus Pontus aber, die sich angetrieben fühlten, klüger sein zu wollen als ihr Meister, räumen Christo die Realität des Leibes ein, ohne sich das Recht nehmen zu lassen, seine Geburt zu verwerfen. Er kann einen Leib gehabt haben, sagen sie, nur keinen, der geboren worden ist. Da sind wir also, wie man zu sagen pflegt, aus dem Kalkhaufen in die Kohlengrube geraten und von Marcion zu Apelles gelangt, der, durch das Fleisch zum Falle gebracht, von der Lehre Marcions ab- und einem Weibe zufiel, sich aus Antrieb des Geistes zur Jungfrau Philumene emporschwang und von ihr den Auftrag empfing, einen materiellen Leib Christi zu predigen, aber ohne Geburt. Diesen Engel der Philumene würde der Apostel mit den Worten angeredet haben, womit er gerade ihn voraus verkündigte, indem er sagte: „Auch wenn ein Engel vom Himmel Euch ein anderes Evangelium verkündigen wollte, als wir Euch verkündigen, der sei verflucht.“ Wir wollen ihren weiteren Klügeleien aber schon entgegentreten.</p><p>Sie geben zu, dass Christus wirklich einen Leib gehabt habe. Woher stammte nun dessen Materie, wenn nicht von der Beschaffenheit, in der sie erschien? Woher der Körper, wenn der Körper nicht Fleisch war? Woher das Fleisch, wenn es nicht geboren war? Es musste geboren sein, da es das sein sollte, was geboren wird. — Aus den Gestirnen und den Substanzen der höhern Welt, antworten sie, hat er sein Fleisch entlehnt, und stellen uns vor, dass man sich über einen nichtgebornen Körper nicht verwundern dürfe, weil es ja auch den Engeln möglich gewesen sei, hienieden ohne Hilfe eines Mutterschoosses im Fleische zu wandeln. Wir geben zu, dass derartiges berichtet wird, aber was soll man dazu sagen, wenn ein Glaube andern Bekenntnisses von dem Glauben, den er bekämpft, für seine Beweisführungen die Hilfsmittel entnimmt? Was hat der mit Moses zu teilen, der den Gott des Moses verwirft? Wenn sein Gott ein anderer ist, so sollten auch seine Sachen anders sein. Doch mögen sich die Häretiker insgesamt der Schriften dessen bedienen, dessen Schöpfung sie ja auch gebrauchen; es wird ein weiteres Zeugnis gegen sie im Gerichte sein, wenn sie ihre Lästerungen mit Belegen, die ihm gehören, unterstützen. Es ist der Wahrheit, auch ohne derartige Prozesseinreden gegen diese Leute anzuwenden, ein leichtes, das Feld zu behaupten.</p><p>Darum also, wer für den Leib Christi die Analogie der Engel anführt und behauptet, er sei nicht geboren, obwohl er ein Leib sei, der sollte doch auch die Beweggründe, die Christus hatte, im Fleische zu erscheinen, mit denjenigen vergleichen, welche die Engel hatten. Kein Engel ist jemals zu dem Ende herabgestiegen, um sich kreuzigen zu lassen, um zu sterben und vom Tode wieder auferweckt zu werden. Wenn niemals eine von den genannten die Ursache war, warum die Engel mit Körpern versehen wurden, so ist damit der Grund angegeben, warum sie ihr Fleisch nicht auf dem Wege der Geburt empfingen. Sie waren nicht gekommen, um zu sterben, also auch nicht, um geboren zu werden. Christus hingegen, der gesendet war, um zu sterben, bedurfte auch des Geborenwerdens, um sterben zu können; denn es pflegt nur das zu sterben, was geboren worden ist. Die Geburt steht zum Sterben im Verhältnis einer Schuldnerin. Die Bestimmung zu sterben ist die Ursache des Geborenwerdens. Wenn Christus um dessentwillen, was sterben muss, gestorben ist, wenn aber nur das stirbt, was geboren wird, so ergab sich daraus oder vielmehr bestand schon vorher die innere Notwendigkeit, dass er um dessentwillen, was geboren wird, ebenfalls geboren werde. Denn er sollte sterben für das, was stirbt, weil es geboren wird. Nicht geboren zu werden für das, wofür er sterben musste, wäre ein Unding gewesen.</p><p>Dem Abraham hingegen erschien zwischen den zwei Engeln damals auch der Herr selbst, auch ohne vorausgegangene Geburt im Fleische, weil die Ursache eben eine verschiedene war. Dies lasst Ihr jedoch nicht gelten, weil Ihr nichts wissen wollt von dem Christus, der schon damals sich darin übte, zum Menschengeschlechte zu reden, es zu befreien und es zu richten, in der Umhüllung eines Leibes, der nicht geboren war, weil es noch nicht dessen Bestimmung war, zu sterben, bevor seine Geburt und sein Sterben verkündet worden. Mögen daher unsere Gegner beweisen, dass jene Engel ihren Leib von den Gestirnen empfangen haben. Wenn sie es aber nicht beweisen können, weil nichts davon geschrieben steht, so wird auch der Leib Christi, für welchen sie die Analogie der Engel geltend machen, nicht von dorther stammen. Es steht fest, dass die Engel die Leiber nicht als etwas ihnen eigentlich zugehöriges an sich getragen haben, als Wesen, die von Natur aus geistiger Substanz sind, — wenn sie auch eine gewisse Körperlichkeit besitzen, so ist dieselbe doch von ganz besonderer Art, — dass sie aber trotzdem in Menschenleiber umgestaltbar zeitweilig erscheinen und mit den Menschen umgehen können.</p><p>Da also nicht gesagt ist, woher sie diese Leiber genommen haben, so bleibt es unsrer Einsicht gestattet, zu glauben, dass es eine Eigentümlichkeit der Macht der Engel sei, einen Körper anzunehmen, aber nicht aus einer Materie. — Um wie viel eher noch, wird man einwenden, aus einer Materie! — Ganz gut, aber es steht nichts darüber fest, weil die Schrift nichts an die Hand gibt. Übrigens, wenn sie die Macht haben, sich selbst zu etwas zu machen, was sie von Natur nicht sind, warum sollten sie sich denn nicht dazu machen können, auch ohne irgend eine Materie? Wenn sie etwas werden, was sie nicht sind, warum sollten sie es nicht auch aus dem nicht Existierenden werden können? Was aber noch nicht existiert, wenn es wird, das entsteht aus nichts. Deswegen wird auch nicht untersucht und nicht angegeben, was nachher aus ihren Körpern geworden ist. Was aus nichts entstanden ist, das ist zu nichts geworden. Die, welche sich selbst in Fleisch zu verwandeln vermochten, konnten auch das Nichts selbst in Fleisch verwandeln. Eine Wesenheit umwandeln, ist etwas Grösseres, als einen Stoff hervorbringen.</p><p>Auch dann, wenn die Engel ihre Leiber einem Stoffe entnommen haben müssten, wäre es jedenfalls glaubwürdiger, dass sie ihn aus einem irdischen Stoffe entnommen haben, als aus einer himmlischen Substanz irgend einer Art, da er sich ja von so irdischer Beschaffenheit erwies, dass er sich sogar mit irdischen Speisen nährte. Es kann nun freilich der Fall gewesen sein, dass das aus den Gestirnen stammende Fleisch, obwohl es nicht irdisch war, auf dieselbe Weise mit irdischer Speise genährt wurde, wie das irdische, ohne himmlisch zu sein, mit himmlischer Nahrung genährt worden ist. Wir haben nämlich gelesen, dass dem Volke Manna als Speise diente; „Brot der Engel“, heisst es, „ass der Mensch“. Dennoch wird dadurch das, was über die einmal ganz verschiedene Beschaffenheit des Leibes des Herrn, der eine ganz andere Bestimmung hatte, gesagt worden ist, nicht abgeschwächt. Der, welcher wirklicher Mensch sein sollte bis zum Sterben, der musste sich auch in jenes Fleisch kleiden, dem das Sterben eignet. Das Fleisch aber, dem das Sterben eignet, existiert erst nach vorausgegangener Geburt.</p>
      <h2>7</h2><p>So oft sich eine Kontroverse über die Geburt erhebt, wollen alle, welche sie als für die Realität des Fleisches in Christo präjudizierend verwerfen, die Geburt Gottes deshalb in Abrede stellen, weil er gesagt hat: „Wer ist meine Mutter und wer sind meine Brüder?“ Es möge also auch Apelles hören, was ich schon dem Marcion in der kleinen Schrift, worin wir sein Evangelium einer Prüfung unterwarfen und bekämpften, geantwortet habe, nämlich dass man den Anlass zu diesem Ausspruch erwägen müsse.</p><p>Erstens hätte ihn niemals jemand davon benachrichtigt, seine Mutter und seine Brüder ständen draussen, der nicht gewiss wusste, dass er eine Mutter und Brüder habe, und dass es eben die seien, welche er dazumal anmeldete, die er entweder schon von früher gekannt oder damals erst — freilich haben die Häresien diese Dinge aus dem Evangelium entfernt — kennen gelernt hatte, weil die Leute, welche sich über seine Lehre verwunderten, sagten, dass sie mit seinem vermeintlichen Vater, dem Zimmermann Joseph, seiner Mutter, seinen Brüdern und Schwestern sehr wohl bekannt seien.</p><p>Aber vielleicht that man das, dass man ihm Mutter und Brüder anmeldete, die er nicht hatte, um ihn zu versuchen? Die hl. Schrift sagt das nicht, obwohl sie es sonst nicht verschweigt, wenn etwas gegen ihn geschah, um ihn zu versuchen. „Siehe“, sagt sie, „es stand ein Gesetzeslehrer auf, um ihn zu versuchen.“ Und anderswo: „Es nahten sich ihm die Pharisäer, um ihn zu versuchen.“ Nichts hätte verwehrt, auch hier anzudeuten, dass es geschehen sei, um ihn zu versuchen. Ich lasse nicht gelten, dass Du ohne innern Anhaltspunkt von Deinen Einfällen etwas in die Schrift hineinträgst. Sodann muss auch ein Anhalt zum Versuchen vorhanden sein. Was war es denn, worüber sie ihn auf die Probe zu stellen gedachten? Doch wohl, ob er geboren sei oder nicht. Wenn nämlich seine Antwort verneinend ausfiel, so hatte die Meldung des Versuchers es glücklich herausgebracht. Allein keine verfängliche Frage, welche die Kenntnis dessen bezweckt, worüber man in Zweifel ist, kommt so unvermittelt, dass nicht eine Frage vorausginge, welche Zweifel erweckt und zu der Versuchung zwingt. Wenn nun aber die Geburt Christi niemals zur Sprache gekommen war, wie kannst Du da auf den schlauen Einfall kommen, man hätte durch eine Probe ausforschen wollen, was früher niemals in Frage gekommen war?</p><p>Wir fügen dem noch bei, dass er, wenn er in betreff seiner Geburt, ausgeforscht werden sollte, gewiss nicht auf diese Weise ausgeforscht worden wäre, nämlich durch Anmeldung von Personen, die selbst dann, wenn Christus wirklich geboren war, gar nicht vorhanden zu sein brauchten. Wir sind alle geboren, und doch haben wir nicht alle Brüder oder eine Mutter. Es kann ja statt dessen jemand seinen Vater noch besitzen statt seiner Mutter, oder Oheime statt der Brüder. Als ein Aushorchen in betreff seiner Geburt, die ja auch ohne Nennung von Mutter und Brüdern geschehen konnte, ist dies also nicht zweckentsprechend. Eher ist es denkbar, dass sie, fest überzeugt davon, er habe Mutter und Brüder, in betreff seiner Gottheit, nicht aber seiner Geburt ihn hätten auf die Probe stellen wollen, ob er drinnen weilend wisse, wer draussen sei, in Versuchung geführt durch lügenhafte Anmeldung der Anwesenheit von Personen, die wirklich nicht anwesend waren. Nur wäre in diesem Falle das Auskundschaften nicht schlau gewesen. Denn es konnte der Fall sein, dass er wusste, diejenigen, welche man ihm als draussen stehend anmeldete, seien wirklich abwesend infolge einer ihm bereits bekannten Krankheit, durch Geschäfte oder eine Reise verhindert. Niemand führt jemanden auf eine Weise in Versuchung, von der er weiss, dass er sich mit seiner Probe blamieren kann. Es ist also gar kein Anhalt für eine Versuchung vorhanden und die Wahrhaftigheit der Meldung, seine Mutter und seine Brüder seien wirklich angekommen, ist sichergestellt.</p><p>Auch Apelles möge die Ursache erfahren, warum der Herr in seiner Antwort Mutter und Brüder für den Augenblick verleugnet. Die Brüder des Herrn hatten nämlich nicht an ihn geglaubt, wie es in den Ausgaben des Evangeliums, die vor der des Marcion erschienen sind, steht; dass seine Mutter ihm ebensowenig anhing, ist daraus ersichtlich, da Martha und eine andere Maria es sind, welche gewöhnlich in seinem Umgang erscheinen. Gerade an dieser Stelle tritt ihr Unglaube hervor; während Jesus den Weg des Lebens lehrte, das Reich Gottes predigte und sich bemühte, Krankheiten und Fehler zu heilen, da waren diese so nahen Verwandten abwesend, indes Fremde von ihm gefesselt wurden. Endlich kommen sie an und bleiben draussen stehen, ohne einzutreten und von dem zu profitieren, was drinnen vorgeht. Sie warten nicht einmal, gleich als wenn sie etwas noch Notwendigeres, als was er gerade betrieb, zu überbringen hätten; sie unterbrechen ihn und wollen ihn von einem so wichtigen Werke weggerufen wissen. Ich bitte Dich, Apelles oder Marcion, wenn Du, gerade mit dem Brettspiel oder bei einer Wette über Spieler und Wagenlenker beschäftigt, durch eine solche Nachricht abgerufen würdest, hättest Du da nicht auch gesagt: Wer ist meine Matter und wer sind meine Brüder? Wenn aber Christus Gott verkündigt und ihn beweist, wenn er das Gesetz und die Propheten erfüllt und die Finsternis der frühern langen Zeit verscheucht, dann thut er etwas Unwürdiges, indem er sich dieser Redewendung bedient, um den Unglauben der draussen Stehenden zu rügen und die unzeitige Störung der ihn von seiner Arbeit Abrufenden abzuweisen. Um seine Geburt zu leugnen, hätte er einen andern Ort, eine andere Zeit und andere Redeweisen gefunden, als die, deren sich auch jemand bedienen kann, der wirklich Brüder und eine Mutter hat.</p><p>Wenn man im Unwillen seine Eltern verleugnet, so verleugnet man sie nicht, sondern man tadelt sie. Darum stellte Jesus die anderen höher, und indem er den Grund dieses Vorziehens andeutete, nämlich die Anhörung seines Wortes, zeigte er deutlich, in welchem Sinne er seine Mutter und seine Brüder verleugnete. Er verleugnete sie, die sich von ihm fernhielten, nämlich in demselben Sinne, in welchem er sich die anderen, die ihm anhingen, adoptierte. Denn Christus pflegt, selbst zu erfüllen, was er andere thun lehrt. Wie hätte es sich also ausgenommen, zu lehren, dass man Mutter und Vater und Brüder nicht so hoch schätzen solle als das Wort Gottes, und nach Anmeldung von Mutter und Brüdern vom Worte Gottes selber hinwegzulaufen! Er verleugnete also seine Verwandten in der Weise, wie er gelehrt hatte, dass man sie für die Sache Gottes verleugnen müsse. In anderer Beziehung steckt in der Fernhaltung der Mutter auch noch ein Sinnbild der Synagoge und in den ungläubigen Brüdern ein Sinnbild der Juden. In ihrer Person stand Israel draussen. Die neuen Schüler, welche drinnen Christo zuhörten, ihm glaubten und ihm anhingen, sie versinnbildeten die Kirche, welche er für eine vorzüglichere Mutter und würdigere Brüder erklärt, mit Verleugnung seiner leiblichen. In diesem Sinne also antwortete er auf jenes Hinausrufen, nicht so, dass er den Mutterschooss und die Mutterbrust verleugnet hätte, sondern so, dass er als glücklicher die bezeichnete, welche das Wort Gottes hören.</p>
      <h2>8</h2><p>Wenn bloss die erwähnten Stellen, von welchen Marcion und Apelles sich am meisten Unterstützung versprechen, nach dem echten, unverstümmelten und unverfälschten Evangelium erklärt würden, so hätte als Beweis für den menschlichen Leib in Christo, geführt durch Erhärtung seiner Geburt, dies eigentlich schon genügen sollen. Aber weil auch die Anhänger des Apelles uns am liebsten die schimpfliche Armseligkeit des Fleisches entgegenhalten gemäss ihrer Lehre, dass sie von dem feurigen Fürsten des Bösen den beängstigten Seelen beigegeben worden und daher Christi unwürdig sei, und vorgeben, dass ihm die den Sternen entstammende Substanz deshalb besser angestanden habe, so muss ich sie mit ihrem eigenen Rüstzeug zurücktreiben.</p><p>Sie bezeichnen irgend einen berühmten Engel als das Wesen, welches diese Welt eingerichtet, nach deren Herstellung aber der Reue Raum gegeben habe. Auch davon haben wir seines Orts gehandelt. Es existiert nämlich auch eine Schrift von uns gegen sie über die Frage, ob der, welcher zu diesen Werken den Geist, den Willen und die Macht Christi besessen hat, etwas bereuenswertes gethan habe. Sie deuten nämlich das verirrte Schaf als Figur auf jenen Engel. Die Erschaffung der Welt würde also, wie die Reue ihres Herstellers bezeugt, eine Sünde sein, da ja jede Reue das Geständnis einer Sünde in sich schliesst, weil sie nur bei einer Sünde Platz hat. Wenn sie eine Sünde war, insofern der Körper und die Glieder sündhaft wären, so wird auch der Himmel, das Himmlische und alles, was von dorther empfangen und ausgegangen ist, sündhaft sein. Ein schlechter Baum muss notwendig schlechte Früchte bringen. Also besteht das Fleisch Christi, wenn es aus himmlischen Elementen gebildet ist, aus den Elementen der Sünde; es ist sündhaft als von sündigem Ursprunge, und wird sofort ein Teil jener Wesenheit, d. i. der unsrigen, sein, welche sie als eine sündhafte Christo beizulegen so eifrig von sich weisen.</p><p>So ist also hinsichtlich der Schande kein Unterschied vorhanden, ob sich die, welchen unsere Materie missfällt, für ihren Christus eine von noch reinerer Art ausdenken, oder ob sie sie als die gleiche anerkennen, weil im Vergleich mit ihr die himmlische auch nicht besser sein kann. Wir lesen allerdings: „Der erste Mensch ist vom Staube der Erde, der zweite Mensch aber vom Himmel.“ Das bezieht sich jedoch nicht auf eine Verschiedenheit der Materie, sondern setzt nur der früher irdischen Fleischessubstanz des ersten Menschen, d. i. Adams, die infolge des Geistes himmlische Substanz des zweiten Menschen, d. i. Christi, entgegen. Daher bezieht diese Stelle den himmlischen Menschen nicht auf das Fleisch, sondern auf den Geist, so dass es klar ist, die damit in Vergleich Gesetzten werden in diesem irdischen Fleische zu himmlischen Wesen, nämlich durch den Geist. Wenn nun aber Christus seinem Fleische nach auch himmlisch wäre, so würden die, welche dem Fleische nach nicht himmlisch sind, doch nicht mit ihm verglichen werden können. Wenn also die, welche himmlisch werden, wie es Christus ist, eine irdische Fleischessubstanz besitzen, so wird auch dadurch bestätigt, dass Christus selbst ein Himmlischer in einem irdischen Fleische gewesen sei, gerade so gut wie die, welche mit ihm auf gleiche Linie gesetzt werden.</p>
      <h2>9</h2><p>Wir heben ferner hervor, dass etwas, was von etwas anderem herrührt, mit der Bestimmung, wieder etwas anderes zu werden als das erste, sich nie in dem Grade verändere, dass es seine Herkunft nicht ahnen liesse. Jede Materie trägt ein Ursprungsattest an sich, wenn sie auch zu einer neuen Besonderheit des Wesens umgestaltet wird.</p><p>Jedenfalls gibt dieser unser Körper, der aus Lehm gebildet ist — eine Wahrheit, die ihren Weg auch in die heidnische Mythologie gefunden hat, — seine Entstehung aus beiden Elementen deutlich zu erkennen, und zwar die Entstehung aus Erde durch das Fleisch, die aus Wasser durch das Blut. Denn mag auch die äussere Beschaffenheit, d. i. was sich an den Dingen verändert, anders erscheinen — was ist denn Blut anderes als eine rote Flüssigkeit und Fleisch anderes als Erde in ihrer besondern Bildung? Betrachte die einzelnen Eigenschaften, so nehmen die Muskeln die Stelle der Erdschollen ein, die Knochen vertreten die Felsen, auch gewisse kleine Steinchen finden sich um die Saugwarzen herum. Blicke hin auf die so haltbaren Verbindungen der Sehnen, — sie gleichen den Verzweigungen von Wurzeln; die Adern wie sie sich durcheinander verästeln, — sie gleichen dem gewundenen Lauf der Bäche; das Flaumhaar entspricht dem Moose, das Haupthaar dem Rasen und die verborgen liegenden Massen des Markes sind die Metalladern des Leibes.</p><p>Alle diese Kennzeichen des Ursprungs von der Erde fanden sich auch in Christo, und sie sind es, welche seine Gottessohnschaft verhüllten; sonst hätte er gar nicht für einen blossen Menschen gehalten werden können, als wenn er für das Auge die Substanz eines menschlichen Körpers darbot. Wo nicht, so zeigt uns an ihm etwas, was aus dem Sternbild des grossen Bären, aus den Plejaden oder Hyaden erbettelt worden wäre! Denn die Dinge, welche wir aufgezählt haben, sind bei ihm ebenso kräftige Beweise für einen irdischen Leib als bei uns. Aber Neues, Fremdartiges kann ich nichts an ihm entdecken. Mit Einem Wort, die Leute staunten bloss wegen seiner Worte und Thaten, bloss wegen seiner Lehren und Tugenden den Menschen Christus an. Wenn man eine ungewöhnliche Erscheinung an seinem Leibe für ein Wunder angesehen hätte, so wäre das sicher auch aufgezeichnet worden. Es war aber keineswegs eine wunderbare Beschaffenheit seines Leibes, welche sein sonstiges Auftreten so auffallend machte; denn sie sagten: „Woher hat er diese Lehre und diese Wunderzeichen?“ Auch die, welche seine Gestalt verachteten, sprachen so. Mithin besass sein Körper nicht einmal menschliche Wohlgestalt, geschweige denn himmlischen Glanz. Da sogar unsere Propheten von seinem unscheinbaren Aussehen schweigen, so sprechen seine Leiden und die ihm widerfahrenen Beschimpfungen dafür. Die Leiden nämlich bekunden seinen menschlichen Leib, die Beschimpfungen aber die Unansehnlichkeit desselben. Oder würde es jemand gewagt haben, einen Leib von aussergewöhnlicher Beschaffenheit auch nur mit der Spitze eines Nagels anzurühren oder ein Antlitz durch Anspeien zu besudeln, welches nicht dazu herausforderte?</p><p>Wie kann man mir überhaupt einen Leib als himmlisch bezeichnen, woran man keine Spur von etwas Himmlischem wahrnimmt? Wie kann man die irdische Beschaffenheit leugnen, da, wo man die klaren Beweise davon sieht? Es hungerte ihn — unter den Augen des Teufels, es dürstete ihn — in Gegenwart der Samariterin, er weinte — über Lazarus, er zagte — im Angesichte des Todes, denn das Fleisch, ruft er aus, ist schwach, und zuletzt vergoss er sein Blut. Das sind mir die rechten himmlischen Zeichen! Wie hätte er überhaupt, wiederhole ich nochmals, verachtet werden und leiden können, wenn an seinem Leibe auch nur der geringste Schimmer himmlischen Adels erglänzt hätte? Gerade darum, so lautet mein siegreicher Beweis, trug er nichts Himmlisches an sich, damit er leiden und sterben könne.</p>
      <h2>10</h2><p>Ich wende mich nun gegen andere, die ebenfalls für sich weise sein wollen und behaupten, der Leib Christi sei psychischer Natur, weil die Seele Fleisch geworden sei, also sei auch das Fleisch Seele, oder so wie das Fleisch psychisch, so sei auch die Seele fleischlich geworden. Auch hier suche ich nach den Motiven.</p><p>Wenn Christus, um die Seele zu retten, selbst eine Seele annahm, weil sie nicht würde errettet worden sein, als durch ihn und in ihm, so sehe ich keinen Grund mehr, warum er bei seiner Fleischwerdung dieses Fleisch psychisch gemacht haben sollte, als ob er die Seele nicht anders hätte retten können, ausser wenn sie Fleisch würde. Denn wenn er unsere Seelen, nicht bloss die nicht fleischernen, sondern sogar auch, wenn sie vom Fleische getrennt sind, selig macht, um wievielmehr war er imstande, jene Seele, die er selbst annahm, auch wenn sie nicht fleischern war, zum Heile zu führen!</p><p>Zweitens, da sie annehmen, Christus sei gar nicht wegen der Erlösung unseres Leibes, sondern allein unserer Seele halber erschienen, so ist es zunächst höchst absurd, dass er, der nur die Seele allein erlösen wollte, sie zu einem Körper von der Art, wie er ihn gerade nicht erlösen wollte, gemacht haben sollte. Sodann, wenn es seine Absicht war, unsere Seelen vermittelst der Seele, welche er annahm, zu befreien, so musste er auch eine Seele wie die unsrige annehmen, d. h. eine wie die unsrige geformte Seele — mag nun die Form, welche unsere Seele im Dunkel der Unsichtbarkeit hat, sein wie sie will — aber doch keine fleischerne. Hatte er dagegen eine fleischerne Seele, so hat er unsere Seele nicht erlöst; denn sie ist keine fleischerne. Wenn er nun aber die unsere nicht erlöst hat, indem er ja eine fleischerne erlöste, so geht uns das nichts an, weil er dann die unsrige nicht erlöst hat. Sie wäre auch gar nicht zu erlösen gewesen, weil sie nämlich fleischern, also nicht die unsrige war. Denn sie war, wenn sie nicht die unsrige, d. i. nicht fleischern, war, nicht in Gefahr. Erlöst aber wurde sie, das steht fest. Mithin ist sie also auch keine fleischerne gewesen; sie war eben die unsrige, wenn sie nämlich die war, welche erlöst werden sollte, weil sie sich in Gefahr befand. Nun also, wenn die Seele Christi nicht fleischern gewesen ist, so kann auch sein Fleisch kein psychisches gewesen sein.</p>
      <h2>11</h2><p>Ich greife nun ein anderes von ihren Argumenten an und prüfe, warum denn Christus, wenn er einen psychischen Leib annahm, eine fleischerne Seele gehabt haben soll?</p><p>Gott habe, geben sie vor, gewünscht, den Menschen die Seele sichtbar darzustellen dadurch, dass er sie körperlich machte, sie, die früher unsichtbar gewesen war und von Natur aus, durch diese gegenwärtige Fleischeshülle gehindert, nichts sah, nicht einmal sich selbst, so dass sogar die Streitfrage entstehen konnte, ob die Seele geboren werde oder nicht. Somit sei die Seele bei Christus ein Körper geworden, damit wir sie, wenn sie geboren würde, wenn sie stürbe und, was noch mehr sagen will, wenn sie auferstände, wahrnehmen könnten.</p><p>Was soll das nun wohl heissen, die Seele wird sich selbst oder uns vermittelst des Fleisches gezeigt, sie, die eben wegen des Fleisches nicht gesehen werden kann? Sie wird also, um enthüllt zu werden, dasselbe wie das, dem sie eben unbekannt war, nämlich Fleisch. Mithin legt sie sich Finsternisse an, um leuchten zu können. Hiergegen möchten wir zuerst genau darüber handeln, ob die Seele überhaupt in dieser Weise geoffenbart werden musste, sodann, ob sie in früherer Zeit für gänzlich unsichtbar, sozusagen als unkörperlich oder mit einer gewissen Art ihr eigentümlicher Körperlichkeit versehen, ausgegeben wird.</p><p>Und da wird sie doch, obwohl sie unsichtbar sein soll, als etwas Körperliches hingestellt, welches die Eigenschaft hat, unsichtbar zu sein. — Wie kann das, was nichts Unsichtbares an sich hat, unsichtbar genannt werden? Sie kann aber nicht einmal existieren, ausser wenn sie das hat, wodurch sie existiert. Da sie existiert, so muss sie das haben, wodurch sie subsistiert. Wenn sie das hat, wodurch sie subsistiert, so ist das eben ihre Körperlichkeit.</p><p>Alles, was existiert, ist körperlich in seiner besondern Art. Nichts ist unkörperlich, ausser was gar nicht existiert. Da die Seele also einen unsichtbaren Körper hat, so hätte der, welcher es unternahm, sie sichtbar zu machen, in jedem Falle besser gethan, an ihr das sichtbar zu machen, was als unsichtbar galt, weil sich für Gott auch in dieser Sache weder Lüge noch Schwäche schickt. Lüge wäre es aber, wenn er die Seele als etwas anderes dargestellt hat, als was sie ist —Schwäche, wenn er ihre eigentliche Beschaffenheit zu enthüllen nicht imstande war. Niemand, der uns einen Menschen sehen lassen will, setzt ihm erst einen Helm oder eine Maske auf. Das wäre mit der Seele geschehen, wenn sie, in Fleisch verwandelt, sich ein fremdes Antlitz aufgesetzt hätte.</p><p>Auch wenn die Seele für unkörperlich gehalten wird, in der Art, dass sie nur in einer gewissen verborgenen Kraft des Denkens bestehe, dass aber das, was die Seele auch immer sein mag, kein Körper sei, so war es Gott ebensowenig unmöglich, ja, es stimmte sogar besser zu seinem Ratschlusse, sie in einer ganz neuen Art von Leiblichkeit, nicht in der gewöhnlichen, allgemeinen und schon anderweit bekannten, vorzuführen. Alsdann würde er sich nicht ohne Ursache gerühmt haben, die Seele aus einer unsichtbaren zu einer sichtbaren gemacht zu haben, nämlich zu einer solchen, die zu diesen Fragen Anlass gibt, indem ihr der menschliche Leib vorenthalten blieb. Allein Christus konnte nun einmal für Menschen nicht sichtbar sein, ausser als Mensch. Gib also Christo seine Ehrlichkeit zurück: Wenn er als Mensch einhergehen wollte, so trug er auch eine Seele von menschlicher Beschaffenheit zur Schau und machte sie nicht zu einer fleischernen, sondern bekleidete sie mit dem Fleische.</p>
      <h2>12</h2><p>Gut, möge für jetzt die Seele als vermittelst des Fleisches geoffenbart gelten, wenn es nur feststeht, dass sie, die sich selbst und uns unbekannte Seele, auf irgend eine Weise geoffenbart werden musste. Doch auch in diesem Punkte ist die Unterscheidung eine grundlose und nimmt sich so aus, als wenn wir von der Seele getrennt existierten, da doch alles, was wir sind, die Seele ist. Mit Einem Worte, ohne die Seele sind wir nichts, nur Leichname, und verdienen nicht einmal den Namen Menschen. Wenn wir uns also in betreff der Seele in Unwissenheit befinden, so kennt sie sich selber nicht.</p><p>Somit ist nur noch die Frage zu untersuchen übrig, ob sich die Seele darum nicht gekannt habe, damit sie auf irgend eine Weise bekannt werde. Ich bin der Ansicht, die Seele ist ihrer Natur nach mit Wahrnehmungsvermögen begabt. Also es existiert nichts Seelisches ohne Wahrnehmungsvermögen und nichts mit Wahrnehmungsvermögen Begabtes ohne Seele. Und um es noch ausdrücklicher zu sagen, das Empfinden ist die Seele der Seele. Da also die Seele in Ansehung des Empfindens alle Dinge übertrifft, und da sie nicht bloss die Eigenschaften, sondern auch die Eindrücke aller Dinge wahrnimmt, wer möchte da wohl glauben, sie habe nicht von Anfang an Bewusstsein von sich selbst empfangen? Woher kommt ihr das Wissen, was ihr vermöge des naturnotwendigen Verlaufs der Dinge zuweilen unentbehrlich ist, wenn sie ihre eigene Beschaffenheit, und was dieser unentbehrlich ist, nicht kennt?</p><p>Diese Eigentümlichkeit, ich meine das Bewusstsein ihrer selbst, ohne welches sich eine Seele gar nicht zu leiten vermag, kann man bei einer jeden Seele wahrnehmen. In betreff des Menschen aber, des einzigen mit Vernunft begabten Wesens, glaube ich es noch mehr, dass er eine ihrer selbst mächtige Seele empfangen habe, die ihn zum vernünftigen Wesen machen kann, indem sie vor allen Dingen selbst mit Vernunft begabt ist. Aber wie könnte sie, die den Menschen zum vernünftigen Wesen macht, mit Vernunft begabt sein, wenn sie selbst ihr eigenes Verhältnis nicht kennte und nichts von sich selbst wüsste?</p><p>Sie kennt sich aber so gut, dass sie sogar ihren Urheber, ihren Richter und ihre Lage kennt. Schon wenn sie noch nichts über Gott gelernt hat, spricht sie den Namen: Gott aus. Wenn sie noch sein Gericht nicht zugibt, so sagt sie schon, sie empfehle sich Gott. Wenn sie noch nichts weiter gehört hat, als dass nach dem Tode alles aus sei, wünscht sie doch schon jedem Verstorbenen, dass es ihm gut, beziehungsweise schlecht gehen möge. Vollständiger findet sich dieser Gedanke in einem von uns verfassten Schriftchen: <em>Vom Zeugnis der Seele</em> erörtert.</p><p>Wenn die Seele übrigens anfänglich sich selbst nicht kannte, dann hätte sie weiter nichts von Christus zu lernen gebraucht, als wer und wie sie sei. Nun aber hat sie nicht ihr Aussehen von Christus kennen gelernt, sondern ihr Heil. Deswegen ist der Sohn Gottes vom Himmel herabgestiegen und hat eine Seele angenommen, nicht etwa, damit die Seele in Christo sich selbst kennen lerne, sondern umgekehrt in sich selbst Christum. Denn nicht dann befindet sie sich in Heilsgefahr, wenn sie sich selbst nicht kennt, sondern dann, wenn sie Christum nicht kennt. „Das Leben“, heisst es, „ist uns geoffenbart worden“, nicht die Seele. Und „ich bin gekommen,“ hat er gesagt, „um die Seele zu erretten“, — nicht, um sie sehen zu lassen, sagte er. Natürlich, wir wussten ja nicht, dass die Seele, da sie unsichtbar ist, geboren werde und sterbe, wenn sie uns nicht fleischlich dargestellt wurde. Wir wussten allerdings nicht, dass sie mit dem Fleische auferstehen werde. Das wird es sein, was Christus uns geoffenbart hat. Aber auch das offenbarte er uns an seiner Person eben in keiner andern Weise wie an Lazarus, dessen Fleisch nicht seelisch und dessen Seele nicht fleischern war.</p><p>Was ist uns nun also über den Zustand der früher unbekannten Seele weiter noch bekannt geworden? Was gab es an ihr Unsichtbares, das einer Sichtbarmachung vermittelst des Fleisches bedurft hätte?</p>
      <h2>13</h2><p>Die Seele ist Fleisch geworden, damit die Seele geoffenbart würde. — Ist denn nun also etwa auch das Fleisch Seele geworden, damit das Fleisch geoffenbart würde? Wenn die Seele Fleisch geworden ist, dann ist sie bereits nicht mehr Seele, sondern Fleisch. Wenn aber das Fleisch Seele geworden ist, so ist es schon kein Fleisch mehr, sondern Seele. Wo also Fleisch und wo Seele ist, das eine wie das andere ist geworden. Wenn sie aber keins von beiden mehr sind, indem jedes von beiden zum andern wird, so heisst es gewiss die Verkehrtheit aufs höchste getrieben, unter dem Ausdruck Fleisch die Seele zu verstehen und mit dem Ausdruck Seele das Fleisch zu meinen. Dann steht alles in Gefahr, für etwas anderes genommen zu werden als für das, was es ist, und sein Wesen einzubüssen, indem es als etwas anderes aufgefasst wird, wofern man nämlich den Dingen nicht mehr ihren rechten Namen gibt.</p><p>Auf der Festigkeit der Bezeichnungen beruht die Aufrechterhaltung der Eigentümlichkeiten. Die Dinge gelangen dann erst in den Besitz von neuen Namen, wenn sie ihre Eigenschaften wechseln. Z. B.: Gebrannter Thon bekommt den Namen Ziegel, und partizipiert nicht mehr an dem Namen seiner vormaligen Kategorie, weil er zu der Kategorie nicht mehr gehört. Ebenso muss auch die Seele Christi, wenn sie Fleisch geworden ist, notwendig sein, was sie geworden ist, und kann — ist sie nämlich überhaupt etwas anderes geworden — nicht mehr sein, was sie gewesen ist. Und weil wir uns eines naheliegenden Beispiels bedient haben, so wollen wir es ausnutzen. Sicherlich ist „Thonziegel“ ein einziger Gegenstand und eine einzige Bezeichnung, natürlich für einen einzigen Gegenstand. Er kann nicht „Thon und Ziegel“ genannt werden, weil er nicht mehr ist, was er war; was er aber nicht mehr ist, das adhäriert ihm auch nicht mehr. Auch die Seele adhäriert nicht mehr. Folglich ist auch die Fleisch gewordene Seele ein einheitliches, in sich geschlossenes Ding, eine in sich vollständige und unzerreissbare Substanz.</p><p>An Christus aber finden wir eine Seele und einen Leib, welche mit einfachen und unverhüllten Ausdrücken benannt werden, d. h. die Seele „Seele“ und das Fleisch „Fleisch“. Nirgends finden wir ein Seelenfleisch oder eine Fleischseele — denn so hätten sie doch genannt werden müssen, wenn sie so gewesen wären — sondern wir finden sogar die Bezeichnung einer jeden Substanz für sich getrennt in seinem eigenen Munde, natürlich gemäss der Verschiedenheit ihrer beiden Wesenheiten, die Seele allein und das Fleisch allein. Warum sagt er: „Meine <em>Seele</em> ist betrübt bis zum Tode?“ und wiederum: „Das Brot, das ich geben werde, ist mein <em>Fleisch</em> für das Heil der Welt?“</p><p>Wenn seine Seele Fleisch gewesen wäre, so wäre beides in Christo einerlei, die fleischerne Seele oder das seelische Fleisch. Hingegen da er die Dinge trennt, das Fleisch und die Seele, so gibt er zu erkennen, dass es zwei sind. Sind sie zwei, dann sind sie nicht mehr eins; sind sie nicht eins, so ist auch die Seele nicht mehr fleischlich und das Fleisch nicht mehr seelisch. Denn Seelenfleisch oder Fleischseele — das ist ganz einerlei. Er hätte denn müssen ausser der Seele, welche Fleisch war, noch eine andere Seele besitzen und ausser dem Fleisch, welches Seele war, noch ein anderes Fleisch umhertragen müssen. Wenn aber sein Fleisch nur eins und seine Seele nur eine war, dann war es eben diese Seele, die traurig war bis zum Tode, dann war eben dieses Fleisch das Brot für das Heil der Welt, und gewahrt ist die <em>Zweizahl der Substanzen</em>, die in ihrer Art verschieden sind und den Fall einer bloss einzigen Fleischesseele ausschliessen.</p>
      <h2>14</h2><p>Christus habe, behaupten sie, die Natur eines Engels an sich gehabt. — In welcher Weise? In derselben, wie die menschliche. Folglich ist auch die Ursache dieselbe. Dass Christus sich mit der menschlichen Natur bekleidete, dafür war das Heil des Menschen der Beweggrund; es sollte nämlich wiederhergestellt werden, was zu Grunde gegangen war. Der Mensch war zu Grunde gegangen, der Mensch musste wiederhergestellt werden. Dass Christus Engelnatur angenommen habe, dafür ist eine gleiche Ursache nicht vorhanden. Denn wenn auch das Wort: „ins Feuer, das dem Teufel und seinen Engeln bereitet ist“, als Verdammung der Engel gilt, so ist ihnen doch niemals eine Wiederherstellung verheissen worden. Zur Erlösung der Engel hat Christus keinen Auftrag vom Vater erhalten. Was der Vater weder versprochen noch befohlen hat, das konnte Christus auch nicht vollbringen.</p><p>Zu welchem Zwecke also hat er sich nun auch eine Engelnatur beigelegt, wenn es nicht der war, einen tüchtigen Gehilfen zu haben, mit dem er das Heil der Menschen wirken könnte? Der Gottessohn war für sich allein nicht geeignet, den Menschen zu befreien, der von der Schlange ganz allein war zum Falle gebracht worden? Also haben wir schon nicht mehr bloss <em>einen</em> Gott und <em>einen</em> Heilsbringer, wenn es zwei Bewirker der Erlösung gibt, wovon natürlich der eine des andern bedarf. Oder geschah es, damit er vermittelst des Engels die Menschen erlöse? Warum stieg er denn also zur Vollbringung eines Werkes herab, das er durch den Engel erledigen wollte? Vollbringt er es durch den Engel, was thut denn er selber? Vollbringt er es, was thut denn der Engel?</p><p>Zwar erhielt er den Namen: Engel des grossen Ratschlusses; dies bedeutet aber Bote und ist Bezeichnung eines Amtes, nicht des Wesens. Der grosse Ratschluss war nämlich der des Vaters in betreff der Erlösung des Menschen; den sollte er der Welt ankündigen. Doch ist er darum nicht in der Weise als ein Engel anzusehen, wie Gabriel oder Michael. Zwar schickte der Herr des Weinberges auch seinen Sohn zu den Bebauern desselben so gut wie seine Knechte, um von den Früchten zu verlangen. Aber der Sohn wurde deshalb nicht für einen Knecht gehalten, weil er im Dienste den Knechten nachfolgte.</p><p>Eher würde ich allenfalls noch sagen, der Sohn Gottes sei ein Engel, d. i. ein Bote des Vaters, als im Sohne wohne ein Engel. Allein da bezüglich des Sohnes selbst der Ausspruch gethan worden ist: „Du hast ihn ein wenig unter die Engel erniedrigt“, so frage ich: Wie kann man sich einbilden, er habe einen Engel in sich aufgenommen, da ja seine Erniedrigung unter die Engel gerade darin besteht, dass er Mensch wird, weil Leib und Seele und Menschensohn? Insofern er dagegen Geist Gottes und die Kraft des Allerhöchsten, also Gott und Gottes Sohn ist, kann er gar nicht unter die Engel erniedrigt werden. So sehr er also, da er die Menschennatur an sich trägt, unter die Engel erniedrigt worden ist, umsoweniger wäre er es, wenn er Engelnatur an sich trüge.</p><p>Das dürfte ungefähr mit der Meinung des Hebion übereinstimmen, der Jesum einen blossen Menschen sein und nur aus dem Samen Davids stammen und nicht Gottes Sohn sein lässt. In der erstern Beziehung soll er allerdings ausgezeichneter als die Propheten gewesen sein, so dass er behauptet, es habe ein Engel in ihm gewohnt, wie in Zacharias. Nun hat sich aber Christus leider des Ausdrucks niemals bedient: „Der Engel, der in mir redete, sprach zu mir“, auch nicht einmal die alltägliche Redeweise der Propheten angewendet: „So spricht der Herr.“ Er war nämlich der Herr selber, der persönlich in eigener Autorität redete: „Ich aber sage Euch.“ Wozu noch mehr Worte? Man höre in bezug hierauf den Isaias, welcher ausruft: „Nicht etwa ein Engel und ein Gesandter hat sie erlöst, sondern der Herr selbst.“</p>
      <h2>15</h2><p>Wie es die Vorrechte der Häresie so mit sich bringen, hatte auch Valentinus die Freiheit, den Satz auszuhecken, das Fleisch Christi sei pneumatisch gewesen. Wer einmal nicht glauben wollte, dass es menschliches Fleisch sei, der konnte es für alles Beliebige ausgeben, weil — und das sei gegen alle bemerkt — weil, wenn sein Fleisch kein menschliches und kein von einem Menschen entnommenes war, dann gar keine Substanz mehr für mich erfindbar ist, kraft deren sich Christus selber einen Menschen und Menschensohn hätte nennen dürfen.</p><p>„Nun aber wollt Ihr einen Menschen töten, der die Wahrheit zu Euch geredet hat,“ Und „der Menschensohn ist der Herr des Sabbats.“ Von ihm sagt Isaias: „Er ist ein Mann der Schmerzen, der Schwachheit zu tragen versteht“ und Jeremias: „Er ist ein Mensch, und wer hat ihn erkannt?“ und Daniel: „Über den Wolken gleich wie der Menschensohn.“ Auch der Apostel Paulus sagt: „Der Mittler zwischen Gott und den Menschen, der Mensch Christus Jesus.“ Ebenso Petrus in der Apostelgeschichte: „Jesum von Nazareth, den Mann, der Euch von Gott gesandt war“, also doch ein Mensch.</p><p>Das allein hätte als alles niederschlagende Prozesseinrede zum Erweise eines menschlichen und von einem Menschen entnommenen Leibes, der also ebensowenig ein pneumatischer wie ein psychischer, kein aus den Sternen entnommener und kein phantastischer ist, genügen müssen, wenn die Häresien imstande wären, die Sucht und die Künstelei des Disputierens beiseite zu lassen. Denn wie ich bei einem Autor aus dem Häuflein des Valentinus gelesen habe, leugnen sie erstens, dass Christus mit einer irdischen und menschlichen Substanz versehen sei, damit der Herr nicht geringer erscheine als die Engel, zweitens, dass sein dem unsrigen ähnlicher Leib auch auf eine ähnliche Weise habe geboren werden müssen, und zwar nicht aus dem Geiste, auch nicht aus Gott, sondern aus dem Willen des Mannes.</p><p>Und warum aus Verweslichem, nicht aus Unverweslichem? Und warum wird nicht sofort auch unser Leib, der seinem ja gleich ist, gleichwie der seinige auferstanden und in den Himmel zurückgenommen ist, ebenfalls dahin aufgenommen? Oder warum löste sich nicht sein Leib, der unserem ja gleich war, so wie dieser in Staub auf? Solche Zweifel hegen die Heiden ungefähr auch: Also zu einem solchen Grade der Erniedrigung ist der Sohn Gottes herabgedrückt worden? Wenn er aber als Vorbild unserer Hoffnung, wieder auferstanden ist, warum hat sich denn in betreff unser nichts derartiges bestätigt?</p><p>Solche Fragen sind bei Heiden natürlich. Bei Häretikern sind sie aber auch natürlich; denn worin besteht denn der Unterschied zwischen beiden? Nur darin, dass die Heiden glauben, indem sie nicht glauben, und die Häretiker nicht glauben, indem sie glauben. So lesen sie z.B.: „Du hast ihn ein wenig unter die Engel erniedrigt“, leugnen aber, dass die Substanz Christi geringer sei [als die der Engel], wiewohl er sich einen Wurm, nicht einmal einen Menschen nennt, einen, der keine Gestalt und kein Ansehen hat, sondern dessen Gestalt unansehnlich und verachtet war mehr als aller Menschen, einen Mann der Heimsuchung, der Schwachheit zu tragen gewohnt ist. Sie erkennen eine mit der Gottheit vereinigte Menschheit an, leugnen aber die Menschheit. Sie glauben an seinen Tod, behaupten aber das Sterbliche an ihm sei aus dem Unverweslichen geboren, als ob die Verwesung etwas anderes wäre als der Tod. — Aber, wenden sie ein, dann müsste auch unser Leib sogleich auferstehen. — Wartet es ab! Christus hat seine Feinde noch nicht vernichtet, um mit seinen Freunden über sie zu triumphieren.</p>
      <h2>16</h2><p>Überdies hat sich, wie der Geist der Häresie es mit sich bringt, auch noch der bekannte Alexander aus Lust an Klügeleien eine Gelegenheit zu solchen ausersehen und thut, als wenn wir behaupteten, Christus habe einen Leib von irdischer Herkunft angenommen, um an seiner eigenen Person den Leib der Sünde zu zerstören. Wenn wir das auch sagen, so werden wir unsere Meinung auf eine bessere Weise zu stützen wissen, nur nicht mit einem solchen Wahnsinn, wie er glaubt, nämlich damit, dass wir meinen, der Leib Christi sei als sündhaft an seiner eigenen Person beseitigt worden, da wir ja nicht vergessen haben, dass er zur Rechten des Vaters im Himmel thront, sondern predigen und lehren, er werde von dort im Gepränge der Herrlichkeit des Vaters kommen.</p><p>So wenig wir also sagen können, dass er beseitigt worden, ebensowenig können wir ihn sündig und beseitigt nennen, da in ihm kein Falsch war. Wir behaupten auch gar nicht, der Leib der Sünde sei in Christo entfernt worden, sondern die Sünde des Leibes; nicht dessen Materie, sondern seine Beschaffenheit, nicht seine Substanz, sondern seine Schuld, infolge der Autorität des Apostels, der da sagt: „Er hat die Sünde im Fleische zerstört.“ Denn anderswo sagt er auch, dass Christus die Gleichheit des Leibes der Sünde gehabt habe, nicht als ob er etwas dem Leibe Ähnliches angenommen hätte, etwa das Bild eines Leibes und keinen wirklichen Leib, sondern für die Ähnlichkeit des sündigen Leibes will er es gehalten wissen, dass das selbst nicht sündige Fleisch Christi vermöge seiner Abstammung von Adam, — nicht wegen der Sünde Adams — demjenigen Fleisch glich, dem die Sünde eigen war. Auch auf Grund dessen behaupten wir, dass Christus das Fleisch gehabt habe, dessen Beschaffenheit bei den Menschen eine sündige ist, und dass so in ihm die Sünde zerstört worden sei, weil das in Christo <em>ohne</em> Sünde war, was bei den Menschen nicht ohne Sünde ist. Denn die Sünde nicht in dem Fleische zu zerstören, in welchem die sündige Beschaffenheit sich befand, das würde weder zu der Absicht Christi stimmen, der die Sünde des Fleisches zerstören will, noch zu seiner Herrlichkeit. Was wäre es Grosses, in einem Leibe höherer Art und von anderer, d. i. nicht sündiger Natur, das Muttermal der Sünde zerstört zu haben?</p><p>Mithin, wendest Du ein, wenn Christus unser Fleisch annahm, war sein Fleisch sündig. — Wolle doch den unerforschlichen Gedanken nicht in Fesseln schlagen! Wenn er unser Fleisch annahm, so machte er es ja zum seinigen; wenn er es zum seinigen machte, so machte er es zu einem nicht sündigen. Im übrigen — und das sei gegen alle bemerkt, welche wähnen, das Fleisch Christi sei deshalb nicht das unsrige gewesen, weil es nicht aus dem Samen eines Mannes entstanden war — im übrigen möge man sich erinnern, dass Adam selbst in dieses Fleisch nicht durch den Samen eines Mannes gelangt war. So wie Erde in dieses unser Fleisch verwandelt wurde, ohne den Samen eines Mannes, so konnte auch das Wort Gottes in die Materie eben dieses Fleisches ohne das Gerinnen übergehen.</p>
      <h2>17</h2><p>Doch lassen wir nun den Alexander mit seinen Syllogismen, die er in seinen Beweisführungen herausdrechselt, und mit den Psalmen Valentins, die er mit grosser Unverschämtheit, als rührten sie von einem brauchbaren Verfasser her, einflicht! Richten wir nunmehr den Kampf auf einen einzigen Punkt, auf die Frage, ob Christus seinen Leib aus der Jungfrau erhalten habe, um vorzugsweise dadurch gerade festzustellen, dass er ein menschlicher war, wenn er seine Substanz aus einer menschlichen Mutter bezogen hat. Es ist freilich aus seiner Benennung Mensch, aus dem Zustande seines Wesens, aus dem Empfinden der Behandlung und aus dem Verlauf seines Leidens schon klar genug, dass sein Leib ein menschlicher gewesen ist.</p><p>Vor allem aber dürfte hinzuweisen sein auf die Ursache, welche dafür obwaltete, dass der Sohn Gottes aus einer Jungfrau geboren werde. Auf eine neue Art musste der geboren werden, welcher der Urheber einer neuen Geburt werden sollte, von welcher der Herr, nach der Verkündigung des Isaias, ein Zeichen geben wollte. „Siehe, die Jungfrau wird in ihrem Leibe empfangen und einen Sohn gebären.“ Die Jungfrau empfing also und gebar den Emmanuel, den <em>Gott mit uns</em>. Das ist die neue Geburt, dass ein Mensch in Gott geboren wird. In diesem Menschen wurde Gott geboren, indem er das Fleisch von altem Samen in sich aufnahm, doch ohne die Hilfe des alten Samens, um es kraft eines neuen Samens, d. h. des geistigen, wiederherzustellen und durch Ausschliessung der alten Unreinigkeit zu entsündigen. Dieser neue Vorgang ist, wie in allen Fällen, so auch hier, ganz im alten vorgebildet, indem der Herr kraft besondern Ratschlusses von der Jungfrau als vernünftiger Mensch geboren wurde.</p><p>Die Erde war noch jungfräulich, noch nicht durch Bearbeitung gebändigt, noch nicht für die Einsaat urbar gemacht, als Gott aus ihr, — wie uns berichtet wird, den Menschen zur lebenden Seele bildete. Wenn also betreffs des ersten Adam solches berichtet wird, so ist der zweite oder letzte Adam, wie der Apostel sich ausgedrückt hat, mit Recht ebenso aus Erde, d. i. aus einem Fleische, welches noch nicht durch Gebären entsiegelt war, als Leben gebender Geist von Gott hervorgebracht worden. Damit mir jedoch der Name Adam nicht nutzlos in die Feder geflossen sei, stelle ich die Frage, mit welchem Rechte ist Christus vom Apostel ein Adam genannt worden, wenn seine Menschheit nicht irdischen Ursprungs war?</p><p>Allein auch hier verlangt der innere Zusammenhang der Sache, dass Gott sein Bild und Gleichnis, welches in des Teufels Gefangenschaft geraten war, durch ein entsprechendes Verfahren wieder befreite. In eine Jungfrau nämlich, was Eva ja noch war, hatte das Wort, welches den Tod bewirkte, Eingang gefunden. Das Wort Gottes, welches das Leben aufrichten sollte, musste ebenfalls in eine Jungfrau eingehen, damit, was durch ihr Geschlecht verloren gegangen war, durch dasselbe Geschlecht wieder zum Heile gelange. Eva hatte der Schlange geglaubt, Maria glaubte dem Gabriel. Was jene durch ihr Glauben sündigte, hat diese durch ihren Glauben wieder gut gemacht. Allein bei Eva erfolgte damals durch das Wort des Teufels keine Empfängnis in ihrem Mutterschoosse. — Mit nichten, sie erfolgte. Nämlich, dass sie von da an Verworfenes gebar, und dass sie in Schmerzen gebar, dazu wurde sie durch das Wort des Teufels befruchtet. Sie hat sogar einen Teufel, einen Brudermörder, geboren. Dagegen hat Maria demjenigen das Leben geschenkt, welcher seinen leiblichen Bruder, Israel, seinen Mörder, endlich noch einmal erretten sollte. Gott hat also sein Wort, den guten Bruder, in einen Mutter-schooss gelangen lassen, damit es das Andenken an den bösen Bruder auslösche. Christus musste zum Heile der Menschen aus dem hervorgehen, wohin der Mensch erst nach seiner Verstossung eingegangen war.</p>
      <h2>18</h2><p>Um jetzt eine einfachere Antwort zu geben, sagen wir, eine Geburt des Sohnes Gottes aus menschlichem Samen wäre unpassend gewesen. Denn wäre er in jeder Hinsicht Menschensohn, so wäre er nicht mehr Gottessohn, hätte nichts vor Salomon und nichts vor Jonas voraus gehabt, und man musste ihn sich nach Hebions Meinung vorstellen. Da er nun also bereits Gottes Sohn aus dem Samen Gottes des Vaters, d. h. aus dem Geiste, war, so brauchte er, um Menschensohn zu werden, weiter nichts als Fleisch aus menschlichem Fleische anzunehmen, ohne Hilfe des Samens des Mannes. Denn der Same des Mannes hätte keinen Zweck gehabt bei einem, der aus dem Samen Gottes stammte. Daher konnte er, als er aus der Jungfrau geboren wurde, eine menschliche Mutter haben ohne einen menschlichen Vater, so gut wie er vor seiner Geburt aus der Jungfrau Gott zum Vater haben konnte, ohne eine menschliche Mutter. So ist er also ein Mensch, der mit Gott vereinigt ist, indem er ein mit dem Geist Gottes vereinigter menschlicher Leib ist; Leib ist er ohne Vermittlung des Mannessamens aus einem Menschen, Geist hingegen durch den Samen aus Gott.</p><p>Wenn also der Plan und Ratschluss in betreff des Sohnes Gottes dahin ging, dass er aus einer Jungfrau hervorgehen sollte, warum sollte er nicht wirklich aus der Jungfrau den Leib angenommen haben, den er aus der Jungfrau hervorgehen liess? Weil der Leib, den er von Gott annahm, ein anderer ist; denn, behaupten sie, „das Wort ist Fleisch geworden“. Diese Schriftstelle bezeugt aber nur, <em>was</em> Fleisch geworden ist, und es ist keineswegs Gefahr, dass es, Fleisch geworden, alsbald etwas anderes und nicht mehr Wort sei. Ob das Wort aus dem Fleische Fleisch geworden sei oder mit Hilfe des Samens selbst, das soll uns die hl. Schrift sagen. Da die Schrift nur sagt, was etwas geworden ist und nicht, woraus es dieses geworden sei, so gibt sie damit zu verstehen, dass es aus etwas anderem, nicht aus dem Samen geworden sei. Wenn aber aus etwas anderem und nicht aus dem Samen, was gäbe es denn schicklicheres, woraus man glauben könnte, dass das Wort Fleisch angenommen habe, als das Fleisch, in welchem es ja auch sein wollte, schon deshalb, weil der Herr selbst ganz formell und bestimmt erklärt hat: „Was im Fleische geboren wurde, ist Fleisch“, weil es aus dem Fleische geboren ist. Wenn er aber damit nur die gewöhnlichen Menschen gemeint hat, nicht auch sich selbst, dann mag man allerdings die Menschheit Christi leugnen und behaupten, dass es nicht auf ihn passe. Aber er fährt ja sogleich fort: „Und was aus dem Geiste geboren ist, ist Geist’“, weil der Geist Gott und von Gott geboren ist. — Dieses bezieht sich natürlich um so mehr auf ihn selbst, wenn es auch auf seine Gläubigen geht. Wenn also die letzteren Worte auf ihn gehen, warum nicht auch die vorigen? Denn man kann die Stelle doch nicht spalten und das letzte auf ihn, das erste auf die übrigen Menschen beziehen — wofern man nämlich nicht beide Naturen in Christo, die leibliche und die geistige leugnet. Wenn er aber sowohl Fleisch als Geist hatte, so kann er, wenn er von der Beschaffenheit beider Naturen, die er in seiner Person an sich trug, spricht, nicht bei dem Geiste zwar über seinen Geist, bei dem Fleisch aber nicht über sein Fleisch eine Erklärung abgegeben haben. Da er also selber dem Geiste Gottes entstammt und Gott Geist ist, so ist er selber sowohl Gott und aus Gott geboren, als auch Mensch aus einem menschlichen Fleische im Fleische erzeugt.</p>
      <h2>19</h2><p>Was bedeutet also die Stelle: „Sie sind nicht aus dem Blute, auch nicht aus dem Willen des Mannes, sondern aus Gott geboren?“ Dieser Stelle werde mit mehr Recht ich mich bedienen, nachdem ich die Gegner der Verfälschung derselben überführt habe. Sie behaupten nämlich, es stehe da: „Nicht aus dem Blute, noch aus dem Willen des Fleisches, noch aus dem des Mannes, sondern aus Gott sind sie geboren“, gleich als ob Johannes damit die vorher von ihm als solche, „die in seinem Namen glauben werden“, Bezeichneten meine, um anzudeuten, sie seien der geheime Same der Verborgenen und Auserwählten, den sie in sich aufnehmen. Wie könnte das jedoch der Fall sein, da alle, welche im Namen des Herrn glauben, nach dem gewöhnlichen Gesetze der menschlichen Abstammung, aus dem Blute und dem Willen des Fleisches und des Mannes geboren sind, sogar Valentinus selber?</p><p>Es steht mithin die Einzahl da, nämlich in bezug auf den Herrn: „Und er ist aus Gott geboren.“ Ganz natürlich, weil er das Wort Gottes, mit dem Worte zugleich der Geist Gottes, im Geiste die Kraft Gottes ist, und was Christus sonst noch von Gott hat. Insofern er aber Fleisch ist, stammt er nicht aus dem Blute, auch nicht aus dem Willen des Fleisches oder des Mannes, weil nämlich das Wort durch den Willen Gottes Fleisch geworden ist. Auf das Fleisch nämlich und nicht auf das Wort bezieht sich die formelle Negierung unserer Geburtsweise; denn das Fleisch musste so geboren werden, nicht aber das Wort. Wenn er aber negierte, dass es auch aus dem Willen des Fleisches geboren sei, warum hat er da nicht auch negiert, dass es aus der Substanz des Fleisches geboren sei? Und wenn er auch die Geburt aus dem Blute negierte, so leugnete er ja damit keineswegs die Substanz des Fleisches, sondern nur die Mitwirkung des Samens, welcher bekanntlich die heissen Teile des Blutes enthält, wenn er durch Ausschäumen verändert das weibliche Blut gerinnen macht. Denn durch das Lab steckt im Käse die Macht über die Substanz, die er durch seine Beimischung gerinnen macht, d. h. über die Milch.</p><p>Wir sehen also ein, dass damit nur negiert ist, der Herr sei infolge einer geschlechtlichen Verbindung, was unter dem Willen des Mannes und des Fleisches zu verstehen ist, geboren worden, nicht aber ohne Beteiligung eines Mutterschoosses. Und dann, warum schärft er sonst mit solchem Aufwand von Worten ein, das Wort sei nicht aus dem Blute, noch aus dem Willen des Fleisches oder des Mannes geboren, als gerade darum, weil den Leib den er hatte, so war, dass niemand gezweifelt haben würde, dasselbe sei infolge einer Geschlechtsverbindung geboren worden? Wer seine Geburt aus einer Geschlechtsverbindung negiert, der hat damit nicht seine Geburt aus dem Fleische negiert, sondern sie gerade bestätigt, weil er die Geburt aus dem Fleische eben nicht in der Art negiert hat, wie er es mit der Geburt aus einer vorhergegangenen Geschlechtsverbindung that.</p><p>Ich bitte Euch um alles in der Welt; wenn der Geist Gottes nicht deshalb in den Mutterschooss herabstieg, um darin Fleisch anzunehmen, warum ist er denn überhaupt in den Mutterschooss herabgestiegen? Pneumatisches Fleisch hätte er ja auch können ausserhalb desselben annehmen, und zwar viel einfacher ausserhalb des Mutterschoosses als innerhalb desselben. Er hat sich ganz zwecklos da hineinbegeben, von wo ihm nichts mit herausgegeben wurde. Allein er stieg eben <em>nicht</em> zwecklos in den Mutterschooss herab. Folglich hat er etwas daraus empfangen. Denn, wenn er nichts daraus empfangen hat, so ist er zwecklos in denselben hinabgestiegen eben dann, wenn er Fleisch von solcher Beschaffenheit anannehmen sollte, wie es nicht das des Mutterschoosses war, nämlich pneumatisches.</p>
      <h2>20</h2><p>Eure Sucht, Winkelzüge zu machen, ist so gross, dass Ihr sogar das Wörtchen „aus“, welches als Präposition dasteht, zu beseitigen trachtet und Euch lieber einer andern bedienen wollt, welche in dieser Weise sich nicht in der hl. Schrift gebraucht findet. <em>Durch</em> die Jungfrau, sagt Ihr, sei er geboren, nicht <em>aus</em> derselben, und <em>in dem</em> Mutterschoosse, nicht <em>aus</em> demselben, weil der Engel im Traumgesicht zu Joseph gesagt habe: „Was <em>in</em> ihr geboren ist, das ist vom hl. Geiste”, nicht, was <em>aus</em> ihr geboren ist. Er hat dennoch auch <em>in ihr</em> gemeint, selbst wenn er <em>aus ihr</em> gesagt hätte. Denn was <em>aus ihr</em> war, das war eben <em>in ihr</em>. Wenn er also sagt, <em>in ihr</em>, so bedeutet das genau dasselbe wie <em>aus ihr</em>, weil das aus ihr war, was in ihr war.</p><p>Ein Glück ist es nur, dass derselbe Matthäus, indem er den Stammbaum des Herrn von Abraham bis Maria durchläuft, sagt: „Jakob zeugte Joseph, den Mann Mariens, aus der Christus geboren ist.“ Auch Paulus legt jenen Sprachmeistern Stillschweigen auf. Es sandte, heist es bei ihm, Gott seinen Sohn, „geworden <em>aus</em> dem Weibe“, nicht etwa <em>durch</em> das Weib oder <em>in</em> dem Weibe. Dass er sagt „geworden“, das ist ein vollerer Ausdruck als „geboren“; denn es wäre einfacher gewesen, zu sagen „geboren“. Indem er aber sagt „geworden“, bestätigt er den Satz: „Das Wort ist Fleisch geworden“, und behauptet die Realität des aus der Jungfrau gewordenen Fleisches.</p><p>Es kommen uns hierfür auch die Psalmen zu statten, nicht die Psalmen des Apostaten, Häretikers und Platonikers Valentinus, sondern die des heiligen und überall rezipierten Propheten David. Er singt bei uns von Christus und durch ihn singt Christus von sich selbst. Nimm Christum an und höre den Herrn, wie er mit Gott Vater redet. „Du bist es, der mich hervorgezogen aus dem Schoosse meiner Mutter.“ Das ist das eine.“Du bist meine Hoffnung von den Brüsten meiner Mutter an; auf Dich ward ich geworfen vom Mutterschoosse an.“ Das ist das andere. „Vom Mutterleibe an warst Du mein Gott.“ Das ist das dritte.</p><p>Nun wollen wir um die Bedeutung der Worte kämpfen. Du hast mich hervorgezogen, sagt er, aus dem Mutterschoosse. Was wird denn hervorgezogen? Doch nur das, was darin ist, was darin haftet, was mit dem verbunden ist, wovon es durch das Hervorziehen getrennt wird. Wenn er sich nicht im Mutterschoosse befand, wie konnte er denn daraus hervorgezogen werden? Wenn aber der Hervorgezogene sich darin befand, so konnte er sich nur dann darin befinden, wenn er zum Mutterschoosse gehörte durch die Nabelschnur, gleichsam den Verbindungskanal seiner Scheide, welche an dem innersten Teile des Mutterschoosses anhaftet. Schon wenn etwas nur äusserlich mit einem andern verbunden ist, ist es so sehr damit zusammengewachsen und verschlungen, dass es beim Losreissen etwas von dem, wovon es losgerissen wird, mit sich nimmt, gleichsam als Folge der getrennten Einheit oder als Rest des wechselseitigen Zusammenhanges.</p><p>Endlich, was meint er denn für Mutterbrüste? Ohne Zweifel doch nur die, welche er gesogen. Die Hebammen, die Ärzte und Naturkundigen mögen uns Auskunft geben über die Beschaffenheit der Brüste, ob sie etwa auch sonst ohne dass der Mutterschooss in der Affektion des Gebärens ist, zu fliessen pflegen; denn nur von da ab leiten die Adern den Strom des untern Blutes in die Brust und verändern ihn durch das Überleiten in eine reinere Materie, die Milch. Daher kommt es, dass zur Zeit des Säugens die Blutflüsse aufhören. Wenn aber das Wort aus sich allein Fleisch geworden ist, nicht durch Mitwirkung des Mutterschoosses, so hat der Mutterschooss nichts gethan, nichts gewirkt, keine Affektion erlitten, wie sollte er folglich seinen Strom haben in die Brüste überströmen lassen, welche er nur durch diesen Strom verändert? Er konnte zur Bildung der Milch kein Blut haben, wenn die Ursachen für das Dasein dieses Blutes nicht vorhanden waren, nämlich eine Lostrennung von seinem Fleische.</p><p>Was bei der Geburt Christi aus der Jungfrau Ungewöhnliches stattfand, ist klar, nämlich einzig und allein das, dass er aus einer Jungfrau geboren wurde, aus dem früher angegebenen Grunde, und dass die Jungfrau von allen Makeln gereinigt uns zur geistigen Wiedergeburt werde durch Christus, der selbst sogar dem Leibe nach Jungfrau war, weil aus dem Fleische einer Jungfrau.</p>
      <h2>21</h2><p>Wenn sie folglich behaupten, es würde den neuen Verhältnissen entsprochen haben, dass das Wort Gottes ebensowenig aus dem Fleische der Jungfrau Fleisch annahm als aus dem Samen eines Mannes, so frage ich, warum sollte es denn nicht schon etwas vollständig Neues sein, dass aus einem Leibe ein Leib hervorging, ohne aus dem Samen des Mannes erzeugt zu sein?</p><p>Ich will mich noch tiefer in den Kampf einlassen. ― „Siehe“, heisst es, „die Jungfrau wird in ihrem Mutterleibe empfangen.“ Was wird sie denn empfangen? Doch sicher das Wort Gottes, nicht den Samen eines Mannes, und jedenfalls, um einen Sohn zu gebären. Denn, so heisst es: „Sie wird einen Sohn gebären.’“ Mithin, wie es ihre Sache war, zu empfangen, so gehörte ihr, was sie gebar, auch an, obschon ihr das nicht zugehörte, was sie empfing. Wenn dagegen das Wort aus sich selbst Fleisch geworden ist, dann hat es sich selbst empfangen und geboren und die Prophezie wird ihres Sinnes beraubt; denn wenn das, was die Jungfrau nach Empfängnis des Wortes gebar, nicht von ihrem Fleische war, dann hat sie nicht empfangen und geboren.</p><p>Aber wird vielleicht dieser prophetische Ausspruch allein zerstört oder geht es nicht mit dem des Engels, der die Empfängnis und Geburt der Jungfrau verheisst, auch so? Und mit jeder Schriftstelle, welche eine Mutter Christi verkündigt, auch? Denn wie könnte sie Mutter sein, wenn er sich nicht in ihrem Mutterleibe befunden hätte? ― Aber er empfing aus ihrem Mutterleibe nichts, was ihn zum Sohn derjenigen machen würde, in deren Mutterleibe er sich befand. ― Die Bezeichnung Mutterschooss darf ein ihm fremder Leib nicht anwenden. Nur der Leib, welcher dem Mutterschoosse sein Dasein verdankt, kann von einem Mutterschoosse reden. Was aber von sich selbst geboren ist, das verdankt sein Dasein keinem Mutterschoosse.</p><p>Es wird also auch Elisabeth verstummen müssen, obwohl sie mit einem Kinde, das seines Herrn Gegenwart schon erkannte, mit einem Propheten, schwanger ging und dazu selbst mit dem hl. Geiste erfüllt war. Denn es ist ganz ohne Halt, wenn sie sagt: „Woher kommt mir das, dass die Mutter meines Herrn zu mir kommt!“ Wenn Maria nicht einen Sohn, sondern einen bloss durchgehenden Gast in ihrem Schoosse trug, wie konnte Elisabeth sagen: „Gebenedeit ist die <em>Frucht</em> Deines Leibes?“ Was sollte das für eine Frucht des Leibes sein, die nicht aus dem Mutterleibe aufgesprosst ist, die nicht im Mutterleibe ihre Wurzel hat, welche nicht der gehört, deren Mutterleib es ist?</p><p>Und wie ist denn Christus eine Frucht des Mutterleibes? Ist er es nicht deshalb, weil er die Blume des Reises ist, das aus der Wurzel Jesse hervorgegangen? Die Wurzel Jesse aber ist das Geschlecht Davids, das Reis aus der Wurzel ist Maria, die Tochter aus David, die Blume aus dem Reis ist der Sohn Marias, der Jesus Christus genannt wird. Derselbe wird dann auch eine Frucht sein. Denn die Blume ist Frucht, weil sich jede Frucht durch die Blume und aus der Blume zur Frucht heranbildet. Was folgt daraus? Sie sprechen der Frucht ihre Blüte ab, der Blüte ihr Reis und dem Reis seine Wurzel, damit nicht die Wurzel durch Vermittlung des Reises das Eigentum dessen beanspruchen könne, was aus dem Reise entstanden ist, nämlich der Blüte und der Frucht. Denn alle Stufen der Abstammung werden von der letzten zur ersten hinaufgezählt, so dass man nun schon wissen sollte, das Fleisch Christi stehe nicht bloss mit Maria, sondern durch Maria auch mit David und durch David auch mit Jesse in Verbindung. Darum schwört Gott dieser Frucht aus den Lenden Davids, d. h. aus der Nachkommenschaft seines Leibes, ihr seinen Thron einräumen zu wollen. Wenn er aus den Lenden Davids ist, um wie viel mehr aus den Lenden Mariens, vermittelst welcher er in den Lenden Davids war!</p>
      <h2>22</h2><p>Unsere Gegner müssten auch die Zeugnisse der Dämonen, welche Jesum als Sohn Davids anriefen, beseitigen; die Zeugnisse der Apostel für ihn aber werden sie nicht beseitigen, auch wenn die der Dämonen etwa der Sache unwürdig sein sollten. Vor allem Matthäus selbst, der zuverlässigste Berichterstatter in der evangelischen Botschaft, weil ein Begleiter des Herrn, fängt sein Evangelium mit den Worten an: „Buch der Abstammung Jesu Christi, des Sohnes Davids, des Sohnes Abrahams“, aus keinem andern Grunde, als um uns mit der leiblichen Herkunft Christi bekannt zu machen. Da die Familie ihre Abstammung aus dieser Quelle herleitet und die Abfolge sich stufenweise bis zur Geburt Christi weiter fortsetzt, wer anders als das Fleisch Abrahams und Davids selbst bildet durch die einzelnen Personen hindurchgehend den Kanal und setzt seinen Stammbaum fort bis zu der Jungfrau und bringt uns Christum, oder richtiger Christus selbst wird aus der Jungfrau hervorgebracht.</p><p>Der Apostel Paulus, als Schüler, Lehrer und Zeuge desselben Evangeliums, weil Apostel eben desselben Christus, bezeugt ebenfalls, dass Christus dem Fleische nach, versteht sich seinem eigenen nach, aus dem Samen Davids war. Also aus dem Samen Davids stammt der Leib Christi. Wenn er vermittelst des Leibes Maria aus dem Samen Davids stammt, so ist er folglich aus dem Fleische Mariens, weil aus dem Samen Davids. In welcher Weise jemand den Ausspruch auch verdrehen mag, entweder ist, was aus dem Samen Davids stammt, aus dem Fleische Mariens, oder, was aus dem Fleische Mariens stammt, ist aus dem Samen Davids. Diese ganze Streitfrage schneidet derselbe Apostel ab, indem er erklärt, dass Christus „Samen Abrahams“ sei, wenn aber Samen Abrahams, dann noch viel mehr Samen Davids, weil dieser jünger ist. Indem er die den Nationen im Namen Abrahams gegebene Verheissung des Segens erörtert: „Und in Deinem Namen sollen gesegnet werden alle Nationen“, bemerkt er, es heisse nicht <em>in den</em> Samen, in der Mehrheit, sondern in dem Samen, als von einem, welcher da ist Christus.</p><p>Wenn wir das lesen und glauben, welche Eigenschaft müssen und können wir da dem Fleische Christi zuerkennen? Doch wohl keine andere als dem Abrahams, da Christus ja Samen Abrahams ist; und auch keine andere als Jesse, da Christus ja die Blume aus der Wurzel Jesse ist; und auch keine andere als David, da Christus ja die Frucht aus den Lenden Davids ist; und auch keine andere als Maria, da Christus ja aus dem Mutterschoosse Mariens stammt; ja noch mehr, auch keine andere als Adam, da Christus der zweite Adam ist. Folgerichtig wäre es also, jenen Personen, von welchen dieselbe Beschaffenheit der Substanz Christi abgeleitet wird, entweder auch einen pneumatischen Leib zuzuerkennen oder zuzugeben, dass der Leib Christi kein pneumatischer gewesen sei, weil er nicht von pneumatischem Stamme herrührt.</p>
      <h2>23</h2><p>Wir anerkennen die Erfüllung des prophetischen Ausspruchs Simeons, den er über den Herrn, das neugeborne Kind, that: „Siehe, dieser ist gesetzt zum Falle und zur Auferstehung vieler in Israel und zu einem Zeichen, dem wird widersprochen werden.“ Das Kennzeichen der Geburt Christi verkündet nämlich Isaias: „Deshalb wird Euch der Herr selbst ein Zeichen geben: Siehe, die Jungfrau wird in ihrem Leihe empfangen und einen Sohn gebären.“ Da haben wir das Zeichen, dem man widersprechen kann, die Empfängnis und Geburt seitens der Jungfrau Maria, worüber diese Akademiker sagen: „Sie hat geboren und doch nicht geboren, sie ist Jungfrau und ist doch nicht Jungfrau“, obwohl es, wenn man sich so ausdrücken dürfte, bei unserer Auffassung viel mehr am Platze wäre, sie so zu nennen.</p><p>Wenn nämlich eine aus ihrem Fleische geboren hat, so hat sie wirklich geboren und wenn eine nicht aus dem Samen des Mannes geboren hat, so hat sie nicht wirklich geboren; sie ist Jungfrau, was die Gemeinschaft mit einem Manne angeht; sie ist nicht Jungfrau was das Gebären angeht. Aber es ist darum doch nicht so, dass sie geboren habe und doch nicht geboren, und dass darum eine Person eine Jungfrau wäre, die keine Jungfrau ist, weil sie in bezug auf ihre Organe Mutter ist. Bei unserer Lehre bleibt nichts zweifelhaft und nichts dehnbar, um es nach beiden Seiten zu verteidigen. Licht ist Licht, Finsternis ist Finsternis; Ja ist Ja, Nein ist Nein, und was darüber ist, ist vom Übel.</p><p>Wer geboren hat, hat geboren und wenn die Jungfrau empfangen hat, so ist sie durch ihr Gebären zu einer Verehelichten geworden. Denn sie ist zu einer Verehelichten geworden durch das Gesetz der Öffnung des Körpers, in bezug auf welchen Punkt es keinen Unterschied macht, ob ein Mann eingelassen oder hinausgelassen wurde. Es ist dasselbe Geschlecht, das ihn entsiegelt hat. Dieses ist mit einem Wort jener Mutterschooss, weswegen in betreff der andern geschrieben steht: „Alles Männliche, welches den Mutterschooss öffnet, wird dem Herrn heilig genannt werden.“ Wer ist wahrhaft heilig, wenn nicht der Sohn Gottes? Wer hat den Mutterschooss im eigentlichen Sinne geöffnet, als wer den verschlossenen aufgemacht hat? Sonst wird er bei allen durch die Verheiratung geöffnet. Darum wurde, was mehr als sonst verschlossen war, um so mehr geöffnet. Mithin ist sie um so weniger Jungfrau zu nennen, als Jungfrau, die gewissermaassen sprungweise Mutter geworden ist, ehe sie heiratete.</p><p>Was wäre über diesen Punkt wohl noch weiter zu erwägen? Da der Apostel aus Rücksicht hierauf den Ausdruck gebraucht hat, „der Sohn Gottes sei aus dem Weibe geboren“, nicht aus der Jungfrau, so hat er damit anerkannt, dass der Zustand ihres geöffneten Mutterschoosses so war, wie er infolge der Ehe ist. Wir lesen zwar bei Ezechiel von einer Kuh, welche geboren habe und nicht geboren. Allein sehet Euch vor; vielleicht hat Euch schon der heilige Geist durch diesen Ausspruch mit Eurer Streiterei über den Mutterschooss Mariens zum voraus gekennzeichnet; sonst hätte er sich nicht gegen seine sonstige Einfachheit in zweifelnder Form ausgedrückt, da Isaias sagt: „Sie wird empfangen und gebären.“</p>
      <h2>24</h2><p>Was die Schläge angeht, welche Isaias bei Bekämpfung gerade der Häretiker beibringt und insbesondere jene Stelle: „Wehe denen, welche das Bittere süss nennen und die Finsternis Licht“, so trifft er damit oben diese Leute, die nicht einmal jene Worte im Lichte ihrer eigentümlichen Bedeutungen festzuhalten wissen, so dass Seele bliebe, was gewöhnlich so genannt wird, Fleisch, was gewöhnlich dafür angesehen wird und Gott der, welcher sonst als solcher gepredigt wird. Marcion vorherschauend, sagt daher der Herr sogar: „Ich bin Gott und ausser mir ist kein anderer.“ Und wenn er ein andermal sagt: „Vor mir ist kein Gott gewesen“, so trifft er damit, Gott weiss, welche Genealogien der valentinianischen Äonen. Der Ausspruch: „Nicht aus dem Blute, noch aus dem Willen des Fleisches oder des Mannes, sondern aus Gott geboren“ dient als Antwort gegen Hebion, und den Ausspruch: „Wenn auch ein Engel vom Himmel Euch ein anderes Evangelium verkünden sollte als wir, der sei Anathema“ richtet er gegen den Sohn, wie er ein Produkt der Philumene ist, jener Jungfrau, die sich mit Apelles hielt.</p><p>Sicher ist aber, dass, wer die Ankunft Jesu Christi im Fleische leugnet, ein Antichrist ist. Wer dessen Fleisch, ohne allen Zusatz, ohne Einschränkung und mit dürrer Bezeichnung seiner Beschaffenheit nur Fleisch nennt, der schlägt allen Streit darüber nieder, sowie derjenige, welcher erklärt, es gebe nur einen Christus, allen Beweisen für einen mehrfachen Christus den Boden entzieht, womit sie Christus zu einer andern Person machen als Jesus ― den, der aus der Mitte der Volksscharen entweicht, zu einem andern als den, der festgehalten wird, und als den, der in der Abgeschiedenheit auf dem Berge, von einer Wolke umhüllt, vor drei Zeugen verklärt wird, die den ordinären und unberühmten einen andern sein lassen als den erhabenen, den, der zagt und zuletzt leidet, einen andern als den, der auferweckt wird, womit sie dann ihr eigenes Auferstehen in einem andern Fleische zu beweisen wähnen.</p><p>Doch es ist nur gut, dass derselbe, der gelitten hat, auch vom Himmel wieder kommen, und derselbe, der auferweckt ist, allen erscheinen wird. „Sie werden ihn sehen und wieder erkennen, sie, die ihn durchbohrt haben“, natürlich dasselbe Fleisch, gegen welches sie gewütet haben, ohne welches er nicht er selbst sein, noch erkannt werden kann. Daher mögen sich auch die schämen, welche behaupten, dass der leere Leib, woraus Christus herausgenommen ist, ohne Besinnung, wie eine leere Scheide im Himmel sitze, oder bloss der Leib und die Seele allein, oder auch bloss die Seele allein und das Fleisch schon gar nicht mehr.</p>
      <h2>25</h2><p>Doch damit genug über vorwürfige Materie! Denn, wie ich glaube, ist nun in betreff des Leibes in Christo der Beweis, dass er <em>aus der Jungfrau geboren</em> und <em>ein menschlicher sei</em>, hinreichend geführt worden. Eine schlichte Erörterung darüber hätte genügen können, ohne die verschiedenen entgegengesetzten Meinungen in den Kampf zu führen. Wir haben dieselben aber mit ihren Beweisführungen und den Schriftstellen, deren sie sich bedienen, reichlich zu Worte kommen lassen, um, was der Leib Christi nicht sei, schon durch den positiven Nachweis seiner Beschaffenheit und seines Ursprungs im voraus gegen alle sicher zu stellen. Die Lehre von der Auferstehung unseres Leibes, die in einer andern Schrift verteidigt werden soll, wird ― damit der Schluss mit der Einleitung harmoniere ― hieran eine Unterlage haben, da nun schon klar ist, wie das beschaffen war, was in Christi Person auferstand.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Karl Adam Heinrich Kellner, <em>Über den Leib Christi</em> (Tertullians sämtliche Schriften, Köln 1882). Text nach <a href="https://bkv.unifr.ch/de/works/cpl-18/versions/uber-den-leib-christi-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

