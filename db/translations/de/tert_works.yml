gabe ihrer Lebenszeit reinen und unschuldigen Seelen, jetzt noch derselben für unwürdig halten?</p>
      <h2>57</h2><p>Hier zurückgehalten werden ist entweder etwas sehr Gutes wegen der Aori oder etwas sehr Schlimmes wegen der Biäothanati, um mich der Ausdrücke zu bedienen, welche bei den Urhebern dieser Meinungen, den Magiern, in Gebrauch sind: Ostanes, Typhon, Dardanus, Damigeron, Nektabis und Berenice. Allgemein bekannt ist bereits jene Art Litteratur, worin versprochen wird, sogar die in reifem Lebensalter entschlummerten Seelen sowie auch die durch anständige Todesarten dahingeschiedenen und die durch eine pünktliche Beerdigung beseitigten aus ihrer unterweltlichen Wohnung hervorzurufen. Als was sollen wir also die Magie bezeichnen? Wie fast alle, als Betrügerei.</p><p>Die einzigen aber, welchen das wahre Wesen dieses Betrugs nicht entgeht, sind wir Christen, die wir von dieser geistigen Bosheit nicht etwa durch eine mit ihr im Bunde stehende Mitwisserschaft, sondern durch ein ihr gegensätzliches Wissen Kenntnis haben und diese vielgestaltige Seuche des menschlichen Geistes nicht herbeilocken, sondern sie mit einer sie bekämpfenden Übermacht behandeln, sie, die Bewirkerin jeglichen Irrtums, diese Verwüsterin des Heils und der Seelen zugleich. Durch die Kunst der Magie, jener zweiten Sorte des Götzendienstes, in welcher sich die Dämonen als Tote darstellen, gerade wie bei dem eigentlichen Götzendienste als Götter –— und warum sollten sie es denn nicht, da die Götter ja auch blosse Verstorbene sind? –— werden also die vorzeitig und gewaltsam aus dem Leben Geschiedenen zwar citiert, unter dem scheinbar plausibeln Grunde, es sei glaublich, dass gerade die Seelen, welche ein durch Gewaltthat und Unrecht herbeigeführtes, grausiges, vorzeitiges Ende des Lebens beraubte, vorzugsweise zu Gewaltthaten und Unrecht mitwirken, sozusagen, zur Wiedervergeltung des Unrechtes, wirklich sind es aber die Dämonen, welche unter ihrem Deckmantel wirtschaften, und zwar gerade die, welche damals in ihnen sassen, als sie noch lebten, und ihnen ein derartiges Ende bereiteten. Wir haben ja bereits angedeutet, dass kein Mensch ohne ein Dämonium sei, und es ist mehrfach bekannt, dass durch das Treiben der Dämonen vorzeitige und schreckliche Todesfälle bewirkt werden, welche man ihren Angriffen zuschreibt. Auch diesen Betrug des bösen Geistes, der sich unter den Personen Verstorbener versteckt, thun wir, wenn ich nicht sehr irre, durch Thatsachen dar. Denn derselbe behauptet bei den Exorzismen zuweilen, er sei einer von den beiden Eltern des ihm angehörigen Menschen, manchmal, er sei ein Gladiator oder Bestiarier, so gut wie ein andermal, er sei ein Gott, indem er auf weiter nichts sinnt, als unsere Lehren zu beseitigen, damit wir nur ja nicht glauben, dass sämtliche Seelen in die Unterwelt gethan werden, und den Glauben an das Gericht und die Auferstehung zu erschüttern. Aber nachdem der Dämon die Anwesenden zu täuschen versucht hat, muss er durch fortgesetzte Anwendung der göttlichen Gnade besiegt, schliesslich, wenn auch ungern, den wahren Sachverhalt bekennen.</p><p>Daher wird denn auch bei der zweiten Art von Magie, welche vermeintlich die schon zur Ruhe gelangten Seelen aus der Unterwelt hervorruft, es keine andere Kraft des Betruges sein, die wirksam ist. Dort wird auch ein Phantasma dargeboten und scheinbar ein Leib angenommen. Die äussern Augen einzunehmen, ist ja nichts Grosses für den, dem es ein Leichtes ist, die innere Sehkraft des Geistes zu verdunkeln. So erschienen Pharao und den Ägyptern die aus den Zauberstäben entstandenen Schlangen als Körper. Aber die wirklichen Schlangen des Moses frassen das Trugbild auf. Viel, fürwahr, unternahmen Simon und Elymas, die Zauberer, gegen die Apostel. Aber die Strafe der Blindheit war keine Einbildung. Was ist es denn besonderes, wenn der unreine Geist die Wahrheit nachäfft? Siehe, haben doch heutzutage die Häretiker, die sich nach demselben Simon nennen, eine so grosse Vorstellung von ihrer Kunst, dass sie sich in ihrer Selbstüberhebung sogar anheischig machen, die Seelen der Propheten aus der Unterwelt hervorzuholen, und ich glaube auch, dass sie es in betrügerischer Weise imstande sind. War doch dazumal, als Saul ausser Gott noch die Toten um Rat fragen wollte, dem Pythonsgeiste nichts Geringeres gestattet, als die Seele Samuels vorzustellen.</p><p>Fern sei es von uns, zu glauben, es sei die Seele irgend eines Heiligen, geschweige denn eines Propheten, wirklich durch einen Dämon herausgeholt worden; sind wir doch belehrt, dass der Satan sich sogar in einen Engel des Lichts verwandelt, um wie viel mehr also noch in einen Menschen des Lichts; beim Weltende wird er sogar behaupten, Gott zu sein, und noch wunderbarere Zeichen sehen lassen, um, wenn es möglich wäre, sogar die Auserwählten abwendig zu machen. Vermutlich hat er damals noch Bedenken getragen, sich für einen Propheten auszugeben, zumal Saul gegenüber, in welchem er selbst bereits wohnte. Man glaube nur nicht etwa, der, welcher das Gesicht bewirkte, sei ein anderer gewesen, als der, welcher es empfahl, sondern man halte den Geist, der in der falschen Prophetin und dem Apostaten mit Leichtigkeit erlog, was er zu glauben bewirkte, für denselben, der auch bewirkt hatte, dass Sauls Schatz dort war, wo sein Herz war, nämlich da, wo Gott nicht war. Darum schaute Saul mit dessen Hilfe, durch den er zu schauen glaubte, weil er auch durch den glaubte, mit dessen Hilfe er schaute. Wenn man uns entgegenhält, man erblicke in nächtlichen Bildern häufig Verstorbene nicht ohne Nutzen –— denn auch die Nasamonen erhalten durch Verweilen bei den Gräbern ihrer Eltern besondere Orakel, wie Heraklit, Nymphodor und Herodot berichten, und die Celten bringen aus demselben Grunde bei den Grabhügeln tapferer Männer ganze Nächte zu, wie Nikander berichtet –— so ist doch die Realität, womit wir im Schlafe die Toten wahrnehmen, keine grössere als bei den Lebendigen, sondern die Art und Weise, sie zu sehen, ist dieselbe, wie wir die Lebenden und alles Sichtbare sehen. Denn die Gesichte sind nicht deshalb wahr, weil sie geschaut werden, sondern insofern sie in Erfüllung gehen. Die Zuverlässigkeit der Traumgesichte beruht auf ihrem Eintreffen, nicht auf der Wahrnehmung.</p><p>Dass die Unterwelt durchaus keiner Seele den Austritt gestatte, hat der Herr in der Person Abrahams an der Geschichte von dem Armen, der in die Ruhe einging, und dem Reichen, der stöhnte, deutlich genug durch die Bemerkung bestätigt, dass von dort kein Verkündiger der göttlichen Ratschlüsse ausgesendet werden könne, was doch wohl zu dem Zweck, damit Moses und die Propheten Glauben fänden, hätte erlaubt werden dürfen. Obwohl aber die Macht Gottes einige Seelen in ihre Körper zurückgerufen hat, um damit ihr Recht dazu zu dokumentieren, so wird sie sich darum noch nicht auf eine Stufe stellen mit dem verwegenen Wahn der Magier, der Betrügerei der Träumer und der Freiheit der Dichter. Wo die Macht Gottes hingegen bei den vorgekommenen Fällen von Auferstehung, sei es durch Propheten, sei es durch Christus oder die Apostel, einzelne Seelen ihren Körpern wiedergegeben hat, da ist durch deren materielle, greifbare und ersättigte Realität das Präjudiz gegeben, dass dies die Norm für die Wahrheit sei, und man darf jedes Erscheinen von Verstorbenen ohne Körper als Blendwerk ansehen.</p>
      <h2>58</h2><p>Sind also sämtliche Seelen in der Unterwelt? Man mag es wollen oder nicht, ja; und es gibt dort bereits auch Bestrafungen und Erquickungen, –— vergleiche den Armen und den Reichen. Und weil ich in bezug auf diesen Punkt noch Etwas aufgespart hatte, so will ich es nun hier am Schluss richtigen Orts vorbringen. Warum will man nicht glauben, dass die Seele jetzt schon in der Unterwelt Strafen leide oder erquickt werde, in der Erwartung des doppelten Gerichtes und gewissermaassen in einer Vorwegnahme desselben und Anwartschaft darauf? Weil, wird man antworten, dem göttlichen Gerichte sein Geschäft unverkümmert bleiben muss, ohne irgend eine Vorwegnahme seiner Sentenz. Sodann auch deshalb nicht, weil die Auferstehung des Fleisches, als des Genossen der Arbeit und des Lohnes, noch abzuwarten ist.</p><p>Gut, was soll denn also in jenem Zeitraume geschehen? Werden wir schlafen? Nun schlafen aber die Seelen nicht einmal zu Lebzeiten des Menschen, denn der Schlaf ist nur Sache des Leibes, den allein der Tod angeht, so gut wie sein Abbild, der Schlaf. Oder willst du etwa, dass dort, wohin die ganze Menschheit gezogen, wo jede Hoffnung sicher gestellt wird, Nichtsthun herrsche? Meinst du, damit würde das Gericht vorweggenommen und nicht vielmehr angefangen? übereilt und nicht vielmehr vorbereitet? Wie ungerecht vollends würde in der Unterwelt ein müssiger Zustand sein, wenn dabei dem Schuldigen immer noch ganz gut zu Sinne ist und dem Unschuldigen noch nicht? Warum will man, dass es nach dem Tode noch unklare Hoffnungen, die in ungewisser Erwartung schweben, geben soll, und nicht vielmehr eine prüfende Rückschau über das Leben und die drohende Vorbereitung des Gerichts stattfinde?</p><p>Aber muss denn die Seele immer auf ihren Körper warten, um zu trauern oder zu frohlocken? Ist sie sich nicht selber genug, um beides zu erleiden? Wie oft wird die Seele gequält, ohne dass der Leib einen Schaden gelitten, von Trübsinn, Zorn und Widerwillen allein, dessen sie sehr oft sich selbst nicht einmal bewusst ist? Wie oft sucht sich dagegen, wenn der Körper geschlagen ist, die Seele eine heimliche Freude und macht sich von der Gemeinschaft mit dem Leibe, die ihr dann ungelegen ist, los? Ich will ein Lügner sein, wenn sie nicht wegen körperlicher Leiden sich sogar zu rühmen und zu freuen pflegt.</p><p>Blicke hin auf die Seele des Mucius, wie er seine rechte Hand im Feuer zerstört! Blicke hin auf Zeno, wie an seiner Seele die Martern des Tyrannen vorübergehen! Die Bisse wilder Tiere sind eine Zierde für die Jugend, wie bei Cyrus die von einem Bären herrührenden Narben.</p><p>Folglich wird sich die Seele auch in der Unterwelt zu freuen und zu betrüben wissen ohne das Fleisch, weil sie sich auch im Fleische, wenn sie will, sogar im unverletzten Fleische, betrübt, und im verletzten, wenn sie will, sich freut. Wenn sie während des Lebens das nach Gutdünken kann, warum nicht infolge des Gerichtes Gottes in noch höherem Maasse nach dem Tode? Aber noch nicht einmal das gesamte Thun teilt die Seele mit dem dienenden Fleische. Denn der Tadel Gottes verfolgt schon die blossen Gedanken und nackten Willensthätigkeiten. „Wer anblickt, um zu begehren, der hat im Herzen schon Ehebruch begangen.” Folglich ist es schon aus diesem Grunde sehr angemessen, dass die Seele, auch ohne den Leib zu erwarten, gestraft werde für das, was sie ohne Teilnahme des Leibes begangen hat. Ebenso wird sie wegen der frommen und guten Gedanken, bei denen sie des Fleisches nicht bedurfte, ohne das Fleisch belohnt werden. Wie, wenn sie selbst bei den körperlichen Thätigkeiten diejenige ist, welche zuerst den Gedanken fasst, den Plan macht, befiehlt und antreibt? Und wenn sie manchmal auch nicht recht will, so ist sie doch die erste, die sich mit dem befasst, was sie durch den Leib zu vollbringen im Begriff steht. Denn niemals ist das Wissen später als das Thun. So harmoniert es ganz gut mit diesem Hergange, dass sie zuerst ihre Vergeltung erhält, da sie ihr zuerst gebührt.</p><p>In Summa, da wir unter jenem Kerker, welchen das Evangelium andeutet, die Unterwelt verstehen und den letzten Heller auf die geringen Vergehen beziehen, welche durch Hinausschieben der Auferstehung daselbst zu sühnen sind, so wird niemand daran zweifeln, dass die Seele in der Unterwelt büsse, ohne dass die Vollständigkeit der Auferstehung hinsichtlich des Leibes dadurch verkürzt werde. Das hat auch der Paraklet sehr häufig ans Herz gelegt, wenn er etwa Aussprüche als Folge der Anerkennung der von ihm verheissenen Gnadengaben zugelassen hat.</p><p>Wir haben nun jeglicher menschlichen Meinung über die Seele vom Standpunkte der christlichen Lehre aus Rede und Antwort gestanden und so, dünkt mich, der Wissbegierde, wenigstens der gerechtfertigten und notwendigen, Genüge geleistet; die übertriebene und müssige wird desto weniger lernen, jemehr ihr zu fragen beliebt.</p>
