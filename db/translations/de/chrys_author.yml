    body: |-
      <p>Die Werke des Johannes Chrysostomus sind auch <a href="https://bibleox.com/ru/grc/w/%CE%99%CF%89%CE%AC%CE%BD%CE%BD%CE%B7%CF%82_%CE%BF_%CE%A7%CF%81%CF%85%CF%83%CF%8C%CF%83%CF%84%CE%BF%CE%BC%CE%BF%CF%82/">auf Griechisch</a> verfügbar. Das Umschalten auf andere Sprachen erfolgt oben, über der Liste der Werke.</p><p><strong>Gedenktage</strong>: 27. Januar (9. Februar), 30. Januar (12. Februar) (Synaxis der drei Hierarchen), 14. (27.) September, 13. (26.) November.</p><h2>Biographie</h2><h3>Kindheit und Jugendjahre</h3><p>Er wurde in Antiochien in einer vornehmen Familie geboren, etwa im Jahr 347.</p><p>Sein Vater Secundus war ein angesehener Heerführer. Einen nennenswerten Einfluss auf die Erziehung seines Sohnes vermochte er nicht auszuüben, da er starb, als Johannes noch ein kleines Kind war.</p><p>Die Mutter des Johannes, Anthusa, war von edler Herkunft. Als sie im Alter von zwanzig Jahren verwitwet war und mit zwei Kindern und einem Erbe, das eine ordnungsgemäße Verwaltung erforderte, allein zurückblieb, sah sie sich mit nicht geringen Schwierigkeiten konfrontiert. In vergleichbaren Lagen ließen sich viele Frauen, ihre Zeitgenossinnen, nicht davon abbringen, eine zweite Ehe einzugehen; Anthusa jedoch lehnte mit fester Entschlossenheit alle an sie gerichteten Heiratsangebote ab. Sie fand die Kraft sowohl für die Erziehung der Kinder als auch für die Überwindung der übrigen Schwierigkeiten. Ihr hohes sittliches Niveau erweckte Sympathie sogar unter den Heiden.</p><p>Die Tochter der Anthusa, die Schwester des Johannes, starb offenbar bald. Was aber Johannes betrifft, so gab ihm die Mutter eine nahezu bestmögliche Erziehung, die unter den gegebenen Umständen möglich war.</p><p>Neben der sittlichen Erziehung erhielt Johannes eine vortreffliche weltliche Bildung. Philosophie studierte er bei Andragathius, Literatur und Rhetorik (und andere Disziplinen) bei dem berühmten Libanios, einem der besten Fachleute auf dem Gebiet der Beredsamkeit und der Redekunst. Während seiner Ausbildung erstaunte Johannes ihn mehrfach durch seine Begabungen. Später äußerte sich Libanios über ihn als über seinen besten Schüler.</p><p>Wahrscheinlich hatte Anthusa ihren Sohn, den Chrysostomus, schon seit dessen Kindheit in den Wahrheiten der Heiligen Schrift gefestigt. Dies half ihm, sich nicht von der heidnischen Literatur mitreißen zu lassen und nicht in den Bann des Glanzes des weltlichen heidnischen Lebens zu geraten.</p><h3>Die jungen Jahre. Der Weg zur Kirche</h3><p>Nachdem er die notwendigen Kenntnisse erworben hatte, widmete sich Johannes Chrysostomus der Anwaltspraxis und erzielte auf diesem Gebiet glänzende Erfolge. Dank seines Talents, seiner Bildung und seiner hohen gesellschaftlichen Stellung hätte er eine ansehnliche Karriere machen können. Doch Gott bestimmte für ihn einen anderen Weg.</p><p>Obwohl die Eltern des Johannes Christen waren, wurde er selbst nicht in früher Kindheit getauft. Damals galt die Praxis, die Taufe der Kinder aufzuschieben, nicht als etwas Außergewöhnliches. Viele Eltern hielten es für besser, dass ihre Kinder bewusst zur Kirche hinzutreten.</p><p>Nach einiger Zeit unterbrach Johannes, ernsthaft von der göttlichen Schrift und den Werken der Kirchenväter ergriffen, seine Anwaltspraxis und legte den Titel eines Rhetors nieder.</p><p>Zu dieser Entscheidung trug der Umstand bei, dass der Bischof von Antiochien, Meletius, der in ihm einen künftigen Diener Gottes erkannte und wohl verstand, welchen Nutzen er der Kirche bringen konnte, ihn zu sich rief. Drei Jahre lang wurde Johannes in den Wahrheiten der christlichen Lehre unterwiesen und empfing dann von Meletius die Taufe.</p><p>Zu dieser Zeit hatte sich in Johannes endgültig der Wunsch herausgebildet, sein Leben dem Dienst an Gott zu weihen. Viele seiner Altersgenossen, die dem Herrn näher sein wollten, strebten damals nach dem Mönchsleben, ließen sich an einsamen Orten nieder, wo sie sich weise Mentoren aus dem Kreis erfahrener Asketen suchten, sich dem Studium des Wortes Gottes, dem Gebet, der Kontemplation und körperlicher Arbeit widmeten. Das Mönchsleben war mit dem Leben in einer großen, lauten, verderbten Stadt in keiner Weise zu vergleichen.</p><p>Johannes blickte, wie auch viele seiner Gefährten, mit großer Achtung auf die Mönche. In die Wüste aber ging er nicht. Dazu trugen mindestens zwei Faktoren bei: die vielfachen Bitten seiner Mutter, die in dem einzigen Sohn ihren Trost sah, und das Handeln des Bischofs Meletius.</p><h3>Die weitere Formung der Persönlichkeit</h3><p>Kurz nach dem Empfang der Taufe durch Johannes erhob Bischof Meletius ihn in den Stand des Lektors. In jener geschichtlichen Etappe diente das Amt des Lektors häufig als vorbereitende Stufe vor der Übernahme des Priestertums.</p><p>Unterdessen wurde Meletius im Jahr 370 im Zusammenhang mit der Innenpolitik des Kaisers Valens, der die Arianer begünstigte und ihre hartnäckigen Gegner bedrängte, aus der Stadt vertrieben.</p><p>In jener Zeit blieben in Antiochien auch andere bekannte Lehrer: Karterios und Diodor, der später Bischof von Tarsus wurde. In der Schule dieses Theologen zeichnete sich neben Johannes durch seine Kenntnisse Theodor von Mopsuestia aus. Doch während Theodor bestrebt war, die Besonderheiten der Theologie Diodors zu verstärken und sogar zuzuspitzen, bemühte sich Johannes im Gegenteil, Extreme zu vermeiden und scharfe Kanten zu glätten.</p><p>Mit der Zeit erwarb sich Johannes Ansehen unter den Einwohnern, die ihn, wie auch seinen Freund Basilius, auf einem höheren geistlichen Posten sehen wollten. Er selbst aber widersetzte sich solchen Wünschen, da er sich in Demut für unwürdig einer hierarchischen Erhöhung hielt. Unterdessen wurde sein Freund Basilius in die Würde eines Bischofs erhoben.</p><p>Um die Jahre 374–375 verwirklichte Johannes nach dem Tod seiner geliebten Mutter seinen langgehegten Wunsch: Er zog sich in eine der Mönchsgemeinschaften zurück. Hier verbrachte er in Fasten, Nachtwachen und Herzensgebeten etwa vier Jahre.</p><p>Danach zog er sich durch die Vorsehung Gottes zurück und lebte als Einsiedler in einer abgelegenen Höhle. Das strenge asketische Leben und die ununterbrochenen Anstrengungen wirkten sich auf seine körperliche Gesundheit aus: Die erworbene Magenkrankheit verfolgte ihn bis zum Ende seines irdischen Lebens.</p><p>Da seine Gesundheit untergraben war, sah er sich gezwungen, das Einsiedlerleben aufzugeben und nach Antiochien zurückzukehren. Man schrieb das Jahr 380.</p><h3>Diakonat und Priesterdienst</h3><p>Im Jahr 381 empfing Johannes auf Initiative des Meletius die diakonische Weihe. In dieser Zeit gehörte neben den für einen Diakon traditionellen gottesdienstlichen Pflichten die Fürsorge für die Armen und Enterbten zum Verantwortungsbereich des Chrysostomus. In diesem Dienst zeigte er sich nicht nur als verantwortungsvoller Diener, sondern auch als feinfühliger, anteilnehmender und barmherziger Christ.</p><p>Im Jahr 386 weihte Flavian, der Nachfolger des Meletius auf dem Bischofsstuhl, den neununddreißigjährigen Johannes zum Priester.</p><p>In dieser Zeit erlangte er weite Berühmtheit, und zwar nicht nur als eifriger Hirte, sondern auch als glühender Redner und hervorragender Prediger. Kennzeichnend für seine Predigten waren Klarheit, Verständlichkeit, lebendige Ausdruckskraft, Tiefe des Gedankens und Rechtgläubigkeit. Die Reden des Chrysostomus erregten schon damals die Aufmerksamkeit eines breiten Kreises von Gläubigen. Scharen von Menschen strömten zu ihm, um seine Unterweisungen und Lehren zu hören.</p><p>Im Jahr 388, nachdem die Einwohner Antiochiens, unzufrieden mit der Einführung einer besonderen Kriegssteuer, in der Stadt einen Aufruhr angezettelt und die Statuen des Kaisers Theodosius und seiner Gemahlin Flacilla gestürzt hatten und danach, ernüchtert und erschrocken über die zu erwartende Vergeltung durch die kaiserliche Macht, in einem Zustand des Entsetzens und der Verzweiflung verharrten, rief Johannes seine Herde zur Demut und Buße auf und begeisterte sie mit der Hoffnung auf die Barmherzigkeit Gottes. Diese Reden sind uns durch seine Homilien „Über die Statuen“ bekannt.</p><p>Der greise Bischof Flavian trat persönlich beim Kaiser für die Begnadigung der Stadtbewohner ein, und durch seine Fürsprache, vor allem aber durch die Fürsprache Gottes entgingen die Einwohner einer harten Vergeltung.</p><h3>Das hierarchische Wirken</h3><p>Im Jahr 397 wurde Johannes Chrysostomus nach dem Tod des Erzbischofs von Konstantinopel, Nektarius, aus Antiochien herbeigerufen und in die Hauptstadt gebracht, um den verwaisten Stuhl unter seine Leitung zu nehmen. Dabei handelten die damit Beauftragten mit Findigkeit und List, nicht ohne Grund befürchtend, dass die Einwohner, die Johannes als Hirten liebgewonnen hatten, ihn einfach nicht würden gehen lassen wollen.</p><p>Die Erhebung des Johannes auf den Stuhl von Konstantinopel wünschte der Kaiser Arkadius selbst. Dies wünschte auch der bessere Teil des einheimischen Klerus und das Volk. Trotz der Proteste der Neider, die in dieser Angelegenheit intrigierten und daraus irgendeinen persönlichen Nutzen zu ziehen wünschten, bestieg Johannes im Jahr 397 feierlich den Patriarchalthron von Konstantinopel.</p><p>Der Patriarch von Alexandria, Theophilus, der sich der Kandidatur des Chrysostomus widersetzte und so gut er konnte nicht an seiner Weihe teilnehmen wollte, stimmte schließlich doch zu, aus Furcht vor einer möglichen Bestrafung (wie man annimmt, für ein tatsächlich von ihm begangenes Vergehen (Vergehen)).</p><p>Das Dienstgeschäft auf dem neuen Posten erwies sich, wie es die Pflichten eines Hierarchen erforderten, als äußerst mühselig. Das allgemeine sittliche Niveau der Einwohner Konstantinopels ließ viel zu wünschen übrig. Der Adel versank in Üppigkeit und Luxus, während das Leben der unteren Schichten durch Armut und Elend gekennzeichnet war. Der einheimische Klerus entsprach in vielem nicht seiner Berufung und Bestimmung.</p><p>Um die Situation zu wenden, ergriff der neue Vorsteher der Kirche von Konstantinopel die entschiedensten Maßnahmen: Er prangerte die höchsten Kreise an, vertrieb aus dem Klerus Geistliche, die sich durch Verbrechen und die Umgehung der Erfüllung der christlichen Pflicht befleckt hatten, förderte Umgestaltungen im Bereich des Mönchslebens und organisierte Hilfe für die Armen.</p><p>Angesichts des vielen Vertretern des höheren Klerus völlig fremden Strebens nach einem bescheidenen Leben rief Johannes bei ihnen Unverständnis und zeitweise auch offene Unzufriedenheit hervor. Er verringerte die Ausgaben für die Unterhaltung seines Stuhls erheblich, beschränkte seine tägliche Mahlzeit auf ein maßvolles Sortiment an Speisen und Gerichten und seine Alltagsgarderobe auf ausreichend bescheidene (für seinen Rang) Kleidung.</p><p>Die durch die vernünftige Sparsamkeit freigewordenen Mittel verwendete Johannes Chrysostomus für wohltätige Zwecke. Für die Bedürfnisse der Armen verwandte er auch jene Mittel, die er aus dem Verkauf von prächtigem Geschirr, Vorhängen, Möbeln und Marmor erlöste.</p><p>Der bekannte Gegner des Heiligen, Theophilus von Alexandria, der von Johannes an einem bescheidenen Tisch empfangen wurde, fasste diesen Empfang als Beleidigung auf, wodurch sein Zorn und sein Hass nur noch stärker wurden.</p><p>Ein solches Verhalten des Johannes stand in scharfem Kontrast zum Verhalten der übrigen Hierarchen und Priester und diente ihnen zur Anklage. Und dies rief eine gewisse Spannung hervor. Mit der Zeit wuchs die Spannung zu einem Kampf heran.</p><p>Einst nahm Johannes Chrysostomus vier Brüder aus der Nitrischen Wüste bei sich auf, die Schutz vor der Verfolgung durch Theophilus suchten. Nachdem er sie angehört hatte, wandte er sich mit einer Fürbitte an Theophilus. Diese Handlungen wurden von Letzterem als ungesetzliche Einmischung in die Angelegenheiten einer anderen Eparchie gewertet. Die Mönche ihrerseits suchten Schutz beim Kaiser, wandten sich an ihn und erhoben gegen Theophilus recht schwerwiegende Anschuldigungen.</p><p>Dieser wurde nach Konstantinopel vor Gericht geladen. Als jedoch die Verhandlung der anberaumten Sache stattfand, hielt es der heilige Johannes, von den besten Beweggründen geleitet, für angebracht, sich dem Gericht zu entziehen. Theophilus aber nutzte die Situation, begann zu intrigieren und beschuldigte Chrysostomus des Origenismus (dies hängt damit zusammen, dass die von ihm aufgenommenen nitrischen Mönche des Origenismus beschuldigt wurden).</p><p>In die Zusammensetzung der aus diesem Anlass organisierten Synode, die auf der vom Kaiser zur Verfügung gestellten Villa „Bei der Eiche“ stattfand, gingen die mit Theophilus eingetroffenen ägyptischen Hierarchen ein. Als Verbündete des Theophilus trat die mächtige Kaiserin Eudoxia auf, unzufrieden darüber, dass Chrysostomus sie der Ansprüche auf einen Weinberg einer unglücklichen Witwe anklagte und sie mit der gottlosen biblischen Königin Isebel verglich.</p><p>Auf der Synode wurden gegen den sich weigernden, dorthin zu kommen, Johannes Chrysostomus mehrere verleumderische Anschuldigungen vorgebracht, von denen ein Teil auf Vermutungen beruhte, während der andere Teil auf falschen Gerüchten basierte. Unter anderem wurde ihm die Veruntreuung von Kirchenmitteln vorgeworfen (wobei man den Verkauf von Wertsachen zu wohltätigen Zwecken im Sinn hatte).</p><p>Trotz der Fürsprache der dem Johannes freundlich gesinnten Diener wurde er verurteilt. Auf Drängen der Eudoxia bestätigte Kaiser Arkadius das Urteil. Der Heilige wurde abgesetzt und in die Verbannung geschickt (nicht weit von Nikomedia).</p><p>Sobald sich die Kunde von dem Geschehenen in den Straßen Konstantinopels verbreitete, kam es zu einem Volksaufruhr. Theophilus zum Beispiel musste sich durch Flucht retten und die Hauptstadt heimlich verlassen.</p><p>Im Anschluss an den Volksaufruhr ereignete sich ein Erdbeben, weshalb die Kaiserin, die sich ihrer Rolle bei der Verurteilung des Chrysostomus bewusst war und die Katastrophe als Zeichen des göttlichen Gerichts ansah, in Entsetzen geriet. Nachdem der Verbannte auf Drängen der Kaiserin aus der Verbannung zurückgekehrt war, bereiteten ihm die Stadtbewohner einen feierlichen Empfang. Eine neuerlich einberufene Synode hob das Urteil der vorherigen Synode auf, nahm die Anschuldigungen von dem Heiligen zurück und stellte seine Rechte wieder her.</p><p>Bald jedoch fand der verborgene Hass seiner ideellen Gegner einen erneuten Anlass zur Schadenfreude. Als unweit der Kirche der Heiligen Sophia in Konstantinopel eine Säule zu Ehren der Kaiserin Eudoxia errichtet und dann zu Ehren dieses Ereignisses Feierlichkeiten veranstaltet wurden, die grobes Heidentum verrieten und durch ihren Lärm den Ablauf des Gottesdienstes störten, wandte sich Johannes Chrysostomus an den Präfekten und wies ihn auf die Unvereinbarkeit dieses Treibens mit christlicher Frömmigkeit hin. Da er keine gebührende Antwort erhielt, prangerte er die Kaiserin öffentlich an und nannte sie eine rasende, wütende Herodias.</p><p>Diese scharfe Anklage versetzte Eudoxia in Wut. Doch einfach den ersten Hierarchen von Konstantinopel zu nehmen und zu bestrafen, konnte sie nicht. Da nahm sie erneut Verbindung mit Theophilus auf und drängte ihn zu einem weiteren Gericht über den Heiligen. Theophilus wagte es aus Furcht vor einem Ausbruch des Volkszorns nicht, persönlich in die Hauptstadt zu kommen, entsandte jedoch eine besondere Gesandtschaft dorthin: Akakios und Severinus. Letztere versammelten die Feinde des Chrysostomus, wonach durch gemeinsamen Beschluss ein neues Urteil über die Absetzung gefällt wurde. Der Kaiser bestätigte das Urteil, dem Einfluss der Eudoxia nachgebend.</p><h3>Die letzten Lebensjahre</h3><p>Johannes Chrysostomus wurde im Jahr 404 am Ostertag, unmittelbar während des Gottesdienstes, in Haft genommen. Eine Zeit lang befand er sich unter Hausarrest, und dann schickte man ihn nach Bithynien. Der römische Papst Innozenz I., der von dem Geschehenen erfuhr, vermochte die Situation nicht zu ändern.</p><p>Aus Bithynien wurde der Verurteilte nach Kukus geschickt, einem kleinen Dorf in Kleinarmenien. In Kukus verbrachte er in Not und Entbehrungen etwa drei Jahre. Hier widmete er sich gottgefälligen Arbeiten und dem Gebetswerk und führte einen Briefwechsel. Von Zeit zu Zeit besuchten ihn die Antiochener.</p><p>Da die Feinde von den Verbindungen des abgesetzten Erzbischofs mit Gleichgesinnten wussten, konnten sie dies nicht ruhig ansehen. Unter ihrem Einfluss erließ der Kaiser einen Erlass über seine Versetzung an einen neuen Ort, nach Pityus, im östlichen Teil der Schwarzmeerküste.</p><p>Am 14. September 407 entschlief Johannes Chrysostomus, durch den langen Marsch endgültig entkräftet, im Herrn, ohne den endgültigen Bestimmungsort erreicht zu haben. Seine letzten Worte waren: „Ehre sei Gott für alles“.</p><p>Bald darauf wurde er gerechtfertigt. Im Gedächtnis der Kirche wird er als hervorragender heiliger Vater und berühmter christlicher Schriftsteller verehrt.</p><h2>Hymnographie</h2><p><strong>Troparion an den heiligen Johannes Chrysostomus, Ton 8</strong></p><blockquote><p>Durch die Gnade deines Mundes, die wie der Glanz des Feuers erstrahlte, / wurde das Erdenrund erleuchtet: / nicht hat sie der Welt Schätze der Habgier erworben, / die Höhe der Demut hat sie uns gezeigt. / Doch durch deine Worte uns unterweisend, Vater Johannes Chrysostomus, // bitte das Wort, Christus Gott, dass unsere Seelen gerettet werden.</p></blockquote><p><strong>Erster Kondak, Ton 1</strong></p><blockquote><p>In geheimnisvoller Freude frohlockt die geehrte Kirche / über die Rückkehr deiner verehrten Gebeine, / und da sie diese, wie kostbares Gold, geborgen hat, / schenkt sie denen, die dich besingen, unerschöpflich / durch deine Gebete die Gnade der Heilungen, // Johannes Chrysostomus.</p></blockquote><p><strong>Zweiter Kondak, Ton 6</strong></p><blockquote><p>Vom Himmel hast du die göttliche Gnade empfangen / und mit deinen Lippen lehrst du alle, den einen Gott in der Dreieinigkeit anzubeten, / Johannes Chrysostomus, allseliger ehrwürdiger, / würdig preisen wir dich: / denn du bist der Lehrer, // da du Göttliches offenbarst.</p></blockquote><p><strong>Gebet an den heiligen Johannes Chrysostomus</strong></p><blockquote><p>O großer Hierarch Johannes Chrysostomus! Vielfältige und mannigfaltige Gaben hast du vom Herrn empfangen und, wie ein guter und treuer Knecht, alle dir gegebenen Talente wohl vermehrt; darum warst du wahrhaft ein Lehrer des Erdenrundes, denn jedes Alter und jeder Stand wird von dir unterwiesen. Du bist den Kindern ein Bild des Gehorsams, den Jungen eine Leuchte der Keuschheit, den Männern ein Lehrer der Arbeitsamkeit, den Alten ein Lehrer der Sanftmut, den Mönchen eine Regel der Enthaltsamkeit, den Betenden ein von Gott begeisterter Führer, den nach Weisheit Suchenden ein Erleuchter des Verstandes, den wohlberedten Rednern ein unerschöpflicher Quell des lebendigen Wortes, den Wohltätern ein Stern der Barmherzigkeit, den Herrschenden ein Bild weiser Regierung, den Eiferern für die Gerechtigkeit ein Erwecker der Kühnheit, den um der Gerechtigkeit Verfolgten ein Lehrer der Geduld – allen bist du alles geworden, damit du auf jede Weise einige rettetest. Über all dies aber hast du die Liebe erworben, die das Band der Vollkommenheit ist, und mit ihr, wie mit einer göttlichen Kraft, hast du alle Gaben in deiner einen Person in eins zusammengefasst, und eben diese Liebe, die das Getrennte versöhnt, hast du in der Auslegung der Worte der Apostel allen Gläubigen verkündet. Wir aber, die Sünder, da jeder von uns nur seine eigene Gabe hat, besitzen nicht die Einheit des Geistes im Band des Friedens; wir sind ruhmsüchtig, reizen einander, beneiden einander, und darum erweisen sich unsere getrennten Gaben uns nicht zum Frieden und Heil, sondern zur Feindschaft und Verdammnis. Darum fallen wir vor dir nieder, Hierarch Gottes, von Zwietracht umstürmt, und bitten in Zerknirschung des Herzens: Vertreibe durch deine Gebete aus unseren Herzen allen Hochmut und Neid, die uns trennen, damit in vielen Gliedern ein einziger Leib der Kirche sei, damit wir nach deinem Gebetswort einander lieben und einmütig den Vater und den Sohn und den Heiligen Geist bekennen, die dreieinige und ungeteilte Dreifaltigkeit, jetzt und immerdar und von Ewigkeit zu Ewigkeit. Amen.</p></blockquote><p><strong>Troparion an die drei Hierarchen (Basilius der Große, Gregor von Nazianz, Johannes Chrysostomus), Ton 4</strong></p><blockquote><p>Den Aposteln an Gesinnung gleich / und Lehrer des Erdenrundes, / bittet den Herrn aller Dinge, / dem Erdenrund Frieden zu schenken / und unseren Seelen großes Erbarmen.</p></blockquote><p><strong>Kondak an die drei Hierarchen, Ton 2</strong></p><blockquote><p>Die heiligen und gottverkündenden Prediger, / die Spitze der Lehrer, o Herr, / hast du aufgenommen zum Genuss deiner Güter und zur Ruhe; denn ihre Mühen und ihren Tod hast du aufgenommen mehr als jedes Brandopfer, // Einziger, der du deine Heiligen verherrlichst.</p></blockquote><h2>Der Glaube</h2><h3>Die sichtbare Einheit der Kirche</h3><blockquote><p>Also: <strong><mark>wenn wir den Geist vom Haupt empfangen wollen, so lasst uns in Einheit miteinander stehen</mark></strong>. Es gibt <strong>zwei Arten der Trennung von der Kirche: die eine, wenn wir in der Liebe erkalten, die andere, wenn wir es wagen, gegenüber diesem Leib (der Kirche) etwas Unwürdiges zu tun. In dem einen wie im anderen Fall trennen wir uns vom Ganzen. Wenn uns aber zudem aufgetragen ist, auch andere zu erbauen, und wir erbauen nicht, sondern sind die ersten, die Spaltungen bewirken</strong>, was wird man dann deswegen nicht zu erdulden haben? Nichts vermag so sehr Spaltungen in der Kirche zu bewirken wie die Herrschsucht; <strong><mark>nichts beleidigt Gott so sehr wie Spaltungen in der Kirche</mark></strong>. <strong><mark>Und wenn wir auch tausend gute Werke vollbracht haben, so werden wir nicht weniger verurteilt als jene, die seinen Leib zerrissen haben, wenn wir die Einheit der Kirche zerreißen</mark></strong>. Das erste geschah zum Nutzen der ganzen Welt, wenn auch nicht in dieser Absicht; das letztere aber bringt niemandem irgendeinen Nutzen, sondern bedeutet großen Schaden. <strong><mark>Was ich gesagt habe, bezieht sich nicht nur auf die Vorgesetzten, sondern auch auf die Untergebenen</mark></strong>. Ein heiliger Mann hat etwas gesagt, was kühn erscheinen könnte, wenn er es nicht gesagt hätte. Was denn? Er sagte, <strong><mark>dass eine solche Sünde nicht einmal das Blut der Märtyrer tilgen könne</mark></strong>. Sage mir doch: wofür erduldest du Martyrien? Doch nicht etwa um der Herrlichkeit Christi willen? Wie kannst du es also wagen, die Kirche zu zerstören, für die Christus seine Seele hingegeben hat, da du doch bereit bist, deine Seele für Christus hinzugeben? Höre, was Paulus von sich sagt: »Ich bin nicht würdig, Apostel genannt zu werden, weil ich die Kirche Gottes verfolgt habe« (1Kor 15,9). <strong>Der Schaden (durch die Spaltungen) ist nicht geringer als der, den die Feinde zufügen, sondern viel größer</strong>. Dort wird (der Kirche) noch größerer Glanz zuteil, während sie hier sich selbst in den Augen der Feinde erniedrigt, wenn ihre eigenen Kinder gegen sie Krieg führen. Und das deshalb, weil es bei ihnen (den Feinden) als starker Beweis für Betrug gilt, wenn die, welche in der Kirche geboren und in ihr erzogen sind, ihre Geheimnisse gut gekannt haben, – plötzlich verändert, sich gegen sie erheben wie Feinde.</p><p><strong><em><mark>Was ich gesagt habe, richtet sich gegen die, welche sich unterschiedslos an Menschen anschließen, die sich von der Kirche absondern</mark></em></strong><em>. </em><strong><em><mark>Wenn diese letzteren (uns) entgegengesetzte Dogmen vertreten, so darf man schon deshalb keine Gemeinschaft mit ihnen haben; wenn sie aber dasselbe denken wie wir, so (muss man sie) noch mehr (meiden). Warum ist das so?</mark></em></strong><em> Weil </em><strong><em>dies eine Krankheit der Herrschsucht ist</em></strong><em>. </em><strong><em><mark>Wisst ihr denn nicht, was mit Korach, Dathan und Abiram geschehen ist? Haben aber nur sie gelitten? Sind nicht zusammen mit ihnen auch ihre Anhänger (umgekommen) (Num 16,32)? Was sagst du? »Sie haben denselben Glauben, und sie sind ebenfalls rechtgläubig.« Wenn dem so ist, warum sind sie dann nicht mit uns?</mark></em></strong><em> »Ein Herr, ein Glaube, eine Taufe«. Wenn es bei ihnen gut steht, dann steht es bei uns schlecht; und wenn es bei uns gut steht, dann bei ihnen schlecht. »Als Kindlein«, sagt er, »die hin- und hergeworfen und von jedem Wind umgetrieben werden«. Sage mir: haltet ihr es denn für genügend, dass man sie rechtgläubig nennt, während doch </em><strong><em>bei ihnen die Gnade der Handauflegung versiegt und verloren ist? Was nützt alles übrige, wenn bei ihnen dieses letzte nicht bewahrt ist?</em></strong><em> </em><strong><em>Man muss gleichermaßen für den Glauben wie auch für sie (die Gnade des Priestertums) eintreten.</em></strong><em> </em><strong><em>Wenn es aber jedem erlaubt ist, nach dem alten Sprichwort seine Hände zu füllen und Priester zu sein, so sollen alle herzutreten, und dann ist dieser Altar vergeblich errichtet, vergeblich (eingesetzt) die kirchliche Ordnung, vergeblich die Schar der Priester: so stürzen wir es um und vernichten es.</em></strong><em> Das, sagen sie, dürfe nicht sein. Aber tut nicht gerade ihr das und sagt dann: so darf es nicht sein? Was sagst du noch: es darf nicht sein, wenn es doch in Wirklichkeit so ist? </em><strong><em><mark>Ich sage das und bezeuge es, dabei nicht meinen eigenen Vorteil im Auge, sondern euer Heil.</mark></em></strong></p><p>&lt;…&gt;</p><p>Darum sagen wir auch das alles und erinnern an dies alles, damit ihr an jenem (letzten) Tag nicht sagen könnt: niemand hat uns das gesagt, niemand hat es uns erklärt, wir haben es nicht gewusst und es keineswegs für Sünde gehalten. So sage ich denn und bezeuge, dass <strong><mark>Spaltungen in der Kirche zu bewirken kein geringeres Übel ist als in Häresien zu verfallen</mark></strong>.</p></blockquote><p>(Homilien zum Epheserbrief, Homilie 11, 5)</p><h3>Außerhalb der Kirche gibt es kein Heil</h3><blockquote><p><strong>Entferne dich nicht von der Kirche</strong>; denn es gibt nichts Stärkeres als die Kirche. Deine Hoffnung ist die Kirche, dein Heil ist die Kirche, deine Zuflucht ist die Kirche.</p></blockquote><p>(Homilie, gehalten, als Eutropius, außerhalb der Kirche aufgefunden, ergriffen wurde, über die Gärten und die Schriften, und zu den Worten: »Die Königin stand zu deiner Rechten« (Ps 44,10))</p><blockquote><p><strong>Welchen Nutzen bringen viele Anstrengungen, wenn einer nach diesen Anstrengungen aus großer Unerfahrenheit in eine Häresie verfällt und sich vom Leib der Kirche absondert?</strong> Ich kenne viele, bei denen das geschehen ist. Welchen Nutzen hat er von der Geduld? <strong>Keinen</strong>; ebenso (keinen Nutzen) hat auch der gesunde Glaube bei einem verderbten Leben.</p></blockquote><p>(Über das Priestertum)</p><blockquote><p><strong>Die Arche ist die Kirche</strong>, Noah ist Christus, die Taube ist der Heilige Geist, der Ölzweig ist die Menschenliebe Gottes. &lt;…&gt; Wie die Arche die, welche in ihr waren, mitten im Meer errettete, so <strong>errettet die Kirche alle, die umherirren</strong>; doch die Arche rettete nur, die Kirche aber wirkt etwas Größeres; zum Beispiel: die Arche nahm die Unvernünftigen in sich auf, – und rettete sie als Unvernünftige; die Kirche nahm die unverständigen Menschen auf und rettet sie nicht nur, sondern verwandelt sie auch &lt;…&gt; <strong>weder Mensch noch Vieh noch irgendein anderes der Wesen, die außerhalb der Arche blieben, wurden gerettet</strong>;</p></blockquote><p>(Sieben Reden über Lazarus)</p><h3>Die Notwendigkeit der Überlieferung</h3><blockquote><p><em>»So nun, Brüder, steht fest und haltet die Überlieferungen, die ihr gelehrt worden seid, sei es durch Wort, sei es durch unseren Brief« (2Thess 2,15). Daraus ist offenbar, dass </em><strong><em>(die Apostel) nicht alles durch die Briefe überliefert haben, sondern <mark>vieles auch ohne Schrift mitteilten</mark></em></strong><em>; dabei ist </em><strong><em><mark>beides gleichermaßen zuverlässig</mark></em></strong><em>. Darum </em><strong><em><mark>müssen wir auch die kirchliche Überlieferung als zuverlässig anerkennen</mark></em></strong><em>. Es gibt eine Überlieferung, suche nichts weiter. Hier zeigt (der Apostel), dass viele (im Glauben) schwanken.</em></p></blockquote><p>(Kommentar zum zweiten Thessalonicherbrief, Homilie 4)</p><blockquote><p><em>Wenn aber jemand sagt: warum hat denn (Lukas) nicht alles beschrieben, der doch bis zum Ende bei Paulus blieb? – so antworte ich, dass auch das für die, welche aufmerksam sein wollten, genügte, dass </em><strong><em>(die Apostel) stets mit den notwendigsten Dingen beschäftigt waren und dass <mark>ihre Hauptsorge nicht darin bestand, Bücher zu schreiben</mark>, da <mark>sie vieles auch durch die ungeschriebene Überlieferung mitteilten</mark></em></strong><em>.</em></p></blockquote><p>(Homilien zur Apostelgeschichte, 1)</p><blockquote><p><em>Denn der recht Glaubende und im Glauben Feststehende bedarf weder eines Beweises noch eines Grundes für das, was ihm geboten wird, sondern </em><strong><em><mark>begnügt sich mit der Überlieferung allein</mark></em></strong><em>; der Schwache aber befolgt, wenn er auch den Grund erfahren hat, das Gesagte mit größerem Eifer und gehorcht mit größerer Hingabe.</em></p></blockquote><p>(Homilien zum 1. Korintherbrief, Homilie 26)</p><h3>Die Werke sind zum Heil notwendig</h3><p><a href="https://bibleox.com/ru/ru/w/f7Bz4RJ8_%D0%94%D0%BB%D1%8F_%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BD%D1%83%D0%B6%D0%BD%D1%8B_%D0%B4%D0%B5%D0%BB%D0%B0#HH-%D0%98%D0%BE%D0%B0%D0%BD%D0%BD-%D0%97%D0%BB%D0%B0%D1%82%D0%BE%D1%83%D1%81%D1%82-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-347-407">Zitate im entsprechenden Abschnitt</a></p><h3>Das Priestertum</h3><blockquote><p>Was ich gesagt habe, richtet sich <strong>gegen die, welche sich unterschiedslos an Menschen anschließen, die sich von der Kirche absondern</strong>. Wenn diese letzteren (uns) entgegengesetzte Dogmen vertreten, so darf man schon deshalb <strong>keine Gemeinschaft mit ihnen haben; wenn sie aber dasselbe denken wie wir, so (muss man sie) noch mehr (meiden)</strong>. Warum ist das so? Weil <strong>dies eine Krankheit der Herrschsucht ist</strong>. Wisst ihr denn nicht, was mit Korach, Dathan und Abiram geschehen ist? Haben aber nur sie gelitten? Sind nicht zusammen mit ihnen auch ihre Anhänger (umgekommen) (Num 16,32)? Was sagst du? »Sie haben denselben Glauben, und sie sind ebenfalls rechtgläubig.« <strong>Wenn dem so ist, warum sind sie dann nicht mit uns?</strong> »Ein Herr, ein Glaube, eine Taufe«. Wenn es bei ihnen gut steht, dann steht es bei uns schlecht; und wenn es bei uns gut steht, dann bei ihnen schlecht. »Als Kindlein«, sagt er, »die hin- und hergeworfen und von jedem Wind umgetrieben werden«. Sage mir: haltet ihr es denn für genügend, dass man sie rechtgläubig nennt, während doch <strong><mark>bei ihnen die Gnade der Handauflegung versiegt und verloren ist</mark>? <mark>Was nützt alles übrige, wenn bei ihnen dieses letzte nicht bewahrt ist?</mark></strong> <strong>Man muss gleichermaßen für <mark>den Glauben</mark> wie auch <mark>für sie (die Gnade des Priestertums)</mark> eintreten.</strong> <strong>Wenn es aber jedem erlaubt ist, nach dem alten Sprichwort seine Hände zu füllen und Priester zu sein, so sollen alle herzutreten, und dann ist dieser Altar vergeblich errichtet, vergeblich (eingesetzt) die <mark>kirchliche Ordnung</mark>, vergeblich die <mark>Schar der Priester</mark>: so stürzen wir es um und vernichten es.</strong> Das, sagen sie, dürfe nicht sein. Aber tut nicht gerade ihr das und sagt dann: so darf es nicht sein? Was sagst du noch: es darf nicht sein, wenn es doch in Wirklichkeit so ist? Ich sage das und bezeuge es, <strong>dabei nicht meinen eigenen Vorteil im Auge, sondern euer Heil</strong>.</p></blockquote><p>(Homilien zum Epheserbrief, Homilie 11, 5)</p><blockquote><p>So <strong>groß die Würde dessen ist, der das Priestertum besitzt</strong>, um so größer sind auch seine Gefahren, denn ein einziger rechter Vollzug des Bischofsamtes kann zum Himmel erheben, und ein einziger Missgriff in dieser Sache kann in die Hölle stürzen. Indem ich alles andere beiseite lasse, was täglich geschieht, will ich Folgendes sagen: wenn er aus Freundschaft oder aus irgendeinem anderen Grund einem Unwürdigen die <strong>Bischofswürde</strong> überlässt und ihm die Leitung einer großen Stadt anvertraut, so sieh, welchem Feuer er sich damit schuldig macht.</p></blockquote><p>(Kommentar zum Titusbrief)</p><h3>Die Taufe der Kinder</h3><blockquote><p>5. »Gepriesen sei Gott«, – sagen wir wiederum, – »der allein Wunder tut« (Ps 71,18), der alles wirkt und umgestaltet! Die gestrigen Gefangenen sind heute frei und Bürger der Kirche; die zuvor mit der Schande der Sünden bekleidet waren, sind nun in Freimut und Gerechtigkeit. In der Tat: sie sind nicht nur frei, sondern auch heilig, nicht nur heilig, sondern auch gerecht, nicht nur gerecht, sondern auch Söhne, nicht nur Söhne, sondern auch Erben, nicht nur Erben, sondern auch Brüder Christi, nicht nur Brüder Christi, sondern auch Miterben, nicht nur Miterben, sondern auch Glieder, nicht nur Glieder, sondern auch Tempel, nicht nur Tempel, sondern auch Werkzeuge des Geistes.</p><p>6. »Gepriesen sei Gott, der allein Wunder tut«! Hast du gesehen, wie groß die Gaben der Taufe sind? Obwohl es vielen scheint, dass die Gabe [der Taufe] nur in der Vergebung der Sünden bestehe. Wir aber haben zehn Würden aufgezählt. <strong>Darum taufen wir auch die Kinder</strong>, obwohl sie keine Sünden haben, damit sie die Heiligung, die Gerechtigkeit, die Kindschaft, das Erbe, die Bruderschaft empfangen, Glieder Christi werden und zur Wohnung des Heiligen Geistes werden.</p></blockquote><p>(Taufkatechesen, 4:5-6)</p><h3>Die Eucharistie – wahrer Leib und wahres Blut Jesu Christi</h3><blockquote><p>»Der Kelch des Segens, den wir segnen, ist er nicht die Gemeinschaft des Blutes Christi?« Sehr treffend und furchtbar hat er sich ausgedrückt; der Sinn seiner Worte aber ist folgender: <strong>was im Kelch ist, ist eben das, was aus der Seite des Herrn geflossen ist: dessen werden wir teilhaftig</strong>. Kelch des Segens nannte er ihn deshalb, weil wir ihn in den Händen halten, Ihn verherrlichen, uns wundern und über die unaussprechliche Gabe staunen und ihn dafür segnen, dass Er ihn ausgegossen hat, um uns vom Irrtum zu erlösen, und nicht nur ausgegossen, sondern ihn uns allen dargereicht hat.</p></blockquote><p>(Homilien zum 1. Korintherbrief, Homilie 24)</p><blockquote><p>Und da wir von seinem Leib sprechen, so gedenkt, die ihr den Leib empfangt und sein Blut trinkt: <strong>wir empfangen den Leib, der in nichts unterschieden ist von jenem Leib, der droben thront, den die Engel anbeten, der nahe der unvergänglichen Kraft ist, – eben (diesen Leib) essen wir</strong>. O wie viele Wege zum Heil sind uns eröffnet! Er hat uns zu seinem Leib gemacht, uns seinen Leib gegeben, – und all dies entfernt uns nicht vom Bösen.</p></blockquote><p>(Homilien zum Epheserbrief, Homilie 3)</p><blockquote><p><strong>Er hat denen, die es wollten, nicht nur gegeben, Ihn zu sehen, sondern auch zu berühren, zu essen, mit den Zähnen sein Fleisch zu berühren und sich mit Ihm zu verbinden</strong>, und durch Ihn jedes Verlangen zu sättigen.</p></blockquote><p>(Homilien zum Johannesevangelium, Homilie 46)</p><h3>Gebete an die Heiligen</h3><blockquote><p>Wir haben unsere Herrin – die heilige Maria, die Gottesgebärerin; aber <strong>wir bedürfen auch der apostolischen Gebete</strong>. Sagen wir zu Paulus, wie seine Zeitgenossen zu ihm sagten: „Komm herüber nach Makedonien und hilf uns“ (Apg 16,9). Wir <strong>haben die Apostel</strong>, wir wollen doch nicht vor Furcht erstarren! Wir<strong> haben unsere Herrin – die Gottesgebärerin, die heilige allzeit jungfräuliche Maria</strong>, wir wollen uns doch nicht fürchten! Wir <strong>haben die Schar der Märtyrer</strong>, wir wollen doch nicht lässig sein! Wir wollen nicht nur bitten, sondern, wenn wir es für nötig erachten, auch fasten.</p></blockquote><p>(Homilie darüber, dass ein und derselbe Gesetzgeber des Alten und des Neuen Testamentes ist, auch über das Gewand des Priesters und über die Buße)</p><blockquote><p><strong>die heiligen Märtyrer zu Teilhabern unserer Gebete nehmend</strong>, wollen wir sie bitten um langes Leben, um ehrwürdiges Greisenalter, um Kinder und Kindeskinder und vor allem diesem um die Fortdauer dieses Eifers, um die Mehrung der Ehrfurcht und um einen solchen Abschluss des gegenwärtigen Lebens, dass wir auch die endlosen Zeitalter hindurch mit dem einziggezeugten Sohn Gottes herrschen</p></blockquote><p>(11 Homilien, 2. Homilie)</p><blockquote><p>Wir dürfen nicht, einerseits alles den <strong>Gebeten der Heiligen</strong> überlassend, selbst in Untätigkeit verharren und zum Laster streben und nichts von dem vollbringen, was zur Tugend führt, andererseits aber, indem wir Gutes tun, auch diese Hilfe nicht verachten. Groß, wahrhaft groß ist die Kraft des Gebetes, das für uns (zu Gott) dargebracht wird, aber nur dann, wenn auch wir selbst uns mühen.</p></blockquote><p>(2 Thess, 5. Homilie)</p><blockquote><p>Gut ist es, auf <strong>das Gebet der Heiligen</strong> zu vertrauen, aber – nur dann, wenn auch wir selbst uns mühen. Wozu aber brauche ich, wird jemand sagen, das Gebet der anderen, wenn ich selbst tätig sein werde und mich dadurch nicht in die Lage bringe, es zu brauchen? Und ich wünsche euch das nicht; wenn wir aber recht urteilen, so erfahren wir diese Notwendigkeit immer. Paulus sagte nicht: Was brauche ich das Gebet der anderen? Obwohl die, die für ihn beteten, nicht würdiger waren als er und ihm nicht einmal gleich waren; du aber sagst: Was brauche ich das Gebet der anderen? Petrus sagte nicht: Was brauche ich das Gebet? – das Gebet, heißt es, „betete die Kirche inständig für ihn zu Gott“ (Apg 12,5); du aber sagst: Wozu brauche ich das Gebet der anderen? Darum brauchst du es, weil du es für dich für unnötig hältst. Wärest du auch Paulus gleich, so hast du das Gebet doch nötig. Erhebe dich nicht, damit du nicht erniedrigt werdest. Aber, wie ich schon sagte, nur dann nützen uns die Gebete für uns, wenn auch wir selbst uns mühen.</p></blockquote><p>(1 Thess, 1. Homilie)</p><blockquote><p>Im Übrigen gebe Gott nicht zu, dass jemand aus dieser geehrten Versammlung dort in einer so unglücklichen Lage erscheine; sondern <strong>durch die Gebete unserer heiligen Väter</strong>, nachdem wir alle Sünden gebessert und reichliche Frucht der Tugend gebracht haben, wollen wir von hier mit großer Zuversicht hinweggehen, durch die Gnade und Menschenliebe unseres Herrn Jesus Christus, durch den und mit dem dem Vater die Ehre sei, samt dem Heiligen Geist, in alle Ewigkeit. Amen.</p></blockquote><p>(Homilie über die Statuen, 6)</p><blockquote><p><strong>Durch die Gebete der Vorsteher aber und aller Heiligen</strong>, nachdem wir diese und alle anderen Mängel gebessert haben, wollen wir das Himmelreich erlangen, durch die Gnade und Menschenliebe unseres Herrn Jesus Christus, mit dem dem Vater und dem Heiligen Geist Ruhm, Ehre und Anbetung sei, jetzt und immerdar und in alle Ewigkeit. Amen.</p></blockquote><p>(Homilie über die Statuen, 20)</p><h3>Die Verehrung der Reliquien der Heiligen</h3><blockquote><p>Dann, als er [Ignatius der Gottesträger, 1. Jahrhundert] dort sein Leben beendet hatte, oder – richtiger – in den Himmel aufgestiegen war, kehrte er bekränzt zurück. Und es war ein Werk der Vorsehung Gottes, dass Er ihn wieder <strong>zu uns zurückbrachte und den Märtyrer unter den Städten aufteilte</strong>. Rom empfing sein strömendes Blut, und <strong>ihr seid mit seinen Überresten geehrt</strong> &lt;…&gt; <strong>diesen kostbaren Schatz</strong> und nachdem er ihn jener Stadt gezeigt hatte, gab er ihn euch mit größerem Glanz &lt;…&gt; blickten sie auf diese zurückkehrenden Überreste? Welche Freude empfanden sie? Wie frohlockten sie? Mit welchen Lobesworten überschütteten sie von allen Seiten den bekränzten Sieger? &lt;…&gt;</p><p>So wollen wir <strong>nicht nur heute, sondern jeden Tag zu ihm kommen, um von ihm geistliche Früchte zu empfangen</strong>. Vielleicht kann, wahrlich kann der, der hierher mit Glauben kommt, große Güter empfangen, weil <strong>nicht nur die Leiber, sondern auch die Gräber der Heiligen selbst von geistlicher Gnade erfüllt sind</strong>. &lt;…&gt;</p><p>Wollen wir den Aufenthalt hier jeder Freude und jedem Vergnügen vorziehen, damit wir, uns freuend und zugleich Nutzen empfangend, auch dort Mitbewohner und Teilhaber dieser Heiligen werden können, <strong>durch die Gebete der Heiligen selbst</strong></p></blockquote><p>(Lobrede auf den heiligen Hieromärtyrer Ignatius den Gottesträger)</p><blockquote><p>Und <strong>sie sind weit besser als Schätze</strong>, weil die Geldschätze die, die sie finden, vielen Gefahren aussetzen und, in viele Teile geteilt, durch diese Teilung geringer werden; hier aber gibt es nichts dergleichen, sondern im Gegensatz zu den sinnlichen Schätzen ist sowohl der Erwerb sicher, als auch <strong>die Teilung keine Verminderung bewirkt</strong>. Jene werden, wie ich eben sagte, in Teile zerstückelt, geringer; diese aber <strong>zeigen, wenn sie unter viele geteilt werden, dann umso mehr ihren Reichtum</strong></p></blockquote><p>(Lobreden auf die Heiligen. Homilie über die Märtyrer und über die Zerknirschung und das Almosen)</p><blockquote><p>Kostbar sind diese Leiber, weil sie die Wunden für ihren Herrn empfangen haben, weil sie die Wundmale für Christus tragen. Und wie eine Königskrone, mit verschiedenen Steinen von allen Seiten geschmückt, mannigfachen Glanz hervorbringt, ebenso <strong>sind die Leiber der heiligen Märtyrer, mit Wundmalen für Christus wie mit kostbaren Steinen besät, kostbarer und herrlicher als jedes königliche Diadem</strong>.</p></blockquote><p>(Homilien über die heiligen Makkabäer, erste)</p><h3>Die Ikonen</h3><blockquote><p>Lasst uns den Herrn der Engel bitten, und Er wird einen Engel senden, der das ganze Heer der Feinde zerstreuen wird. <strong>Mir gefiel auch das Bild, aus Wachs gefertigt und von Frömmigkeit erfüllt. Ich sah auf dem Bilde einen Engel</strong>, der die Finsternisse der Barbaren vertreibt, sah die zertretenen barbarischen Stämme und David, der wahrhaft ausrief: „Herr, vernichte ihr Bild in Deiner Stadt“ (Ps 72,20).</p></blockquote><p>(Homilie darüber, dass ein und derselbe Gesetzgeber des Alten und des Neuen Testamentes ist, auch über das Gewand des Priesters und über die Buße)</p><blockquote><p>Ganz am Anfang, als er in die Stadt kam und ihr ihn aufnahmt, nannte jeder von euch sein Kind bei seinem Namen, in der Meinung, durch diesen Namen den Heiligen in sein Haus einzuführen, und die Mütter gaben, an Vätern, Großvätern und Urgroßvätern vorbei, den neugeborenen Kindern den Namen des seligen Meletius. &lt;…&gt; Im Übrigen <strong>hegtet ihr eine solche Zuneigung nicht nur zu seinem Namen, sondern auch zu seinem Äußeren</strong>. Wie ihr mit seinem Namen umgingt, so gingt ihr auch mit seinem Bilde um. Viele zeichneten <strong>dieses heilige Bild</strong> und auf Ringen – statt Steinen – und auf Siegeln und auf Schalen und <strong>an den Wänden der Zimmer,</strong> überall, – damit <strong>sie nicht nur seinen heiligen Namen hören, sondern auch überall sein leibliches Bild sehen</strong>, und einen doppelten Trost in der Trennung von ihm haben.</p></blockquote><p>(Lobrede auf unseren heiligen Vater Meletius, den Erzbischof des großen Antiochien, und über den Eifer der Versammelten)</p><h3>Er trug das Kreuz und bekreuzigte sich</h3><blockquote><p>So schäme sich niemand der anbetungswürdigen Zeichen unseres Heiles, durch die wir leben, und des Anfangs aller Güter, durch die wir bestehen. Sondern <strong>wie eine Krone wollen wir <mark>das Kreuz Christi tragen</mark></strong>. Durch es wird alles vollbracht, was für uns nötig ist. Ist es nötig, geboren zu werden – <strong>wird uns das Kreuz dargeboten</strong>; wollen wir <strong>uns nähren</strong> mit geheimnisvoller Speise, ist es nötig, <strong>die Handauflegung zu empfangen</strong>, oder etwas anderes zu tun – <strong>überall steht uns dieses <mark>Zeichen des Sieges</mark></strong>. Darum <strong>mit aller Sorgfalt <mark>zeichnen wir es sowohl an den Häusern als auch an den Wänden und an den Türen und auf der Stirn und im Herzen</mark></strong>. Das Kreuz ist das Zeichen unseres Heiles, der allgemeinen Freiheit und der Menschenliebe unseres Herrn, der „wie ein Schaf zur Schlachtung geführt wurde“ (Jes 53,7). Wenn du dich daher mit dem Kreuz bezeichnest, so stelle dir die ganze Bedeutung des Kreuzes vor, lösche den Zorn und alle übrigen Leidenschaften. Wenn du dich mit dem Kreuz bezeichnest, so soll sich auf deiner Stirn eine lebendige Hoffnung ausdrücken, und deine Seele soll frei werden. &lt;…&gt; Nicht mit dem Finger allein soll man es abbilden, sondern dem müssen die Herzensneigung und der volle Glaube vorangehen. &lt;…&gt; So präge das Kreuz in deinem Geist ein und umarme das heilbringende Zeichen unserer Seelen.</p></blockquote><p>(Homilien über das Evangelium nach Matthäus, 54. Homilie, 4)</p><h3>Die Gottesgebärerin und ihre immerwährende Jungfräulichkeit</h3><blockquote><p>Wir <strong>haben unsere Herrin – die heilige Maria, die Gottesgebärerin</strong>; aber wir bedürfen auch der apostolischen Gebete. Sagen wir zu Paulus, wie seine Zeitgenossen zu ihm sagten: „Komm herüber nach Makedonien und hilf uns“ (Apg 16,9). Wir haben die Apostel, wir wollen doch nicht vor Furcht erstarren! <strong>Wir haben unsere Herrin – die Gottesgebärerin, die heilige <mark>allzeit jungfräuliche</mark> Maria</strong>, wir wollen uns doch nicht fürchten! Wir haben die Schar der Märtyrer, wir wollen doch nicht lässig sein! Wir wollen nicht nur bitten, sondern, wenn wir es für nötig erachten, auch fasten.</p></blockquote><p>(Homilie darüber, dass ein und derselbe Gesetzgeber des Alten und des Neuen Testamentes ist, auch über das Gewand des Priesters und über die Buße)</p><h3>Gebete für die Verstorbenen</h3><blockquote><p>Weine über die, die <strong>im Reichtum gestorben sind und aus ihrem Reichtum nichts zu ersinnen wussten, was zur Tröstung ihrer Seelen dient, die die Möglichkeit hatten, ihre Sünden zu reinigen, und es nicht wollten</strong>. Um sie wollen wir alle, einzeln und gemeinsam, weinen, nur mit Anstand, ohne die Würde zu verlieren, so dass wir uns nicht zum Schauspiel machen. Wir wollen um sie nicht einen, nicht zwei Tage weinen, sondern unser <strong>ganzes Leben lang. Diese Tränen sind die Folge nicht einer unvernünftigen Leidenschaft, sondern zarter Liebe</strong>; jene aber kommen aus einer törichten Leidenschaft und trocknen daher bald aus. Nur das, was aus der Furcht Gottes kommt, ist beständig. So wollen wir <strong>sie beweinen, wir wollen ihnen nach Kräften helfen, wir wollen für sie irgendeinen Beistand erdenken, einen zwar kleinen, der aber doch helfen kann</strong>. Wie und auf welche Weise? <strong><mark>Selbst beten und andere überreden, für sie zu beten, und für sie den Armen geben. Das wird eine gewisse Erleichterung bringen</mark>.</strong> In der Tat, höre, was Gott sagt: „Und ich will diese Stadt um Meinetwillen und um Davids, Meines Knechtes, willen beschützen“ (2 Kön 20,6). Wenn allein das Gedächtnis des Gerechten so stark war, wie sollten dann nicht die Werke stark sein, die für einen Verstorbenen getan werden? <strong><mark>Nicht vergeblich haben die Apostel festgesetzt, bei der Feier der furchtbaren Geheimnisse der Verstorbenen zu gedenken</mark></strong>: sie wussten, dass ihnen daraus viel Gewinn, viel Nutzen kommt. Wenn das ganze Volk und die heilige Schar mit erhobenen Händen dastehen und das furchtbare Opfer vorliegt, wie sollten wir Gott dann nicht anflehen und für sie bitten? Aber das (sagen wir) von denen, die im Glauben entschlafen sind; die Katechumenen aber werden dieses Trostes nicht gewürdigt, sondern sind jeglicher solcher Hilfe beraubt, außer einer einzigen. Welcher nämlich? Für sie kann man den Armen geben; das bringt ihnen einen gewissen Trost, weil es Gott gefällt, dass wir einander helfen. Denn wozu hätte Er geboten, für den Frieden und das Wohlergehen der Welt zu beten? Wozu – für alle Menschen? Obwohl hier unter allen auch Räuber sind und Grabräuber und Diebe und mit unzähligen Lastern Erfüllte, beten wir dennoch für alle: vielleicht dient dies einigermaßen zu ihrer Bekehrung. Denn wie wir für die Lebenden beten, die sich in nichts von den Toten unterscheiden, so <strong>kann man auch für die Verstorbenen beten</strong>.</p></blockquote><p>(Phil, 3. Homilie)</p><h3>Der Priester vollzieht die Sakramente, darunter auch die Beichte</h3><blockquote><p>Wer bedenkt, wie wichtig es ist, dass ein Mensch, noch mit Fleisch und Blut bekleidet, nahe bei der seligen und unsterblichen Natur gegenwärtig sein kann, der wird klar sehen, <strong>welcher Ehre <mark>die Priester</mark> die Gnade des Geistes gewürdigt hat</strong>. <strong><mark>Durch sie werden diese heiligen Handlungen vollzogen</mark></strong> und andere, nicht weniger wichtige für unsere Vollendung und unser Heil. Menschen, die auf Erden leben und noch auf ihr wandeln, sind eingesetzt, das Himmlische zu verwalten, und <strong><mark>haben eine Vollmacht empfangen, die Gott weder den Engeln noch den Erzengeln gegeben hat</mark></strong>; denn nicht zu ihnen ist gesagt: „Was ihr auf Erden binden werdet, wird im Himmel gebunden sein; und was ihr auf Erden lösen werdet, wird im Himmel gelöst sein“ (Mt 18,18). <strong>Die irdischen Machthaber haben die Macht zu binden, aber nur den Leib; doch <mark>diese Bande binden die Seele selbst und dringen in die Himmel ein; was die Priester auf Erden vollziehen, das vollendet Gott im Himmel, und die Meinung der Knechte bestätigt der Herr</mark></strong>. Bedeutet das nicht, dass Er ihnen die ganze himmlische Vollmacht gegeben hat? „Wem ihr, – sagt (der Herr), – die Sünden erlasst, dem werden sie erlassen ... und wem ihr sie behaltet, dem werden sie behalten“ (Joh 20,23). <strong><mark>Welche Vollmacht kann größer sein als diese?</mark></strong> „Der Vater ... hat das ganze Gericht dem Sohne gegeben“ (Joh 5,22); und ich sehe, dass <strong><mark>der Sohn dieses ganze Gericht den Priestern übergeben hat</mark></strong>.</p></blockquote><p>(Über das Priestertum)</p><h3>Antworten auf die Kritik</h3><p>Eine Untersuchung der Zitate des heiligen Johannes Chrysostomus über die Gebete an die Heiligen und über die Schrift: <a href="https://bibleox.com/ru/ru/w/jTEQ_%D0%9E_%D0%BD%D0%B5%D0%BC%D1%8B%D1%81%D0%BB%D0%B8%D0%BC%D0%BE%D0%B9_%D0%BD%D0%B5%D0%BD%D0%B0%D0%B2%D0%B8%D1%81%D1%82%D0%B8_%D0%BA_%D0%B8%D1%81%D1%82%D0%B8%D0%BD%D0%B5/">Link</a>.</p><h2>Zugeschriebene Schriften</h2><h3>Spuria (zugeschrieben)</h3><ol><li><p>Homilien auf den heiligen Stephanus</p></li><li><p>Homilie über den See Gennesaret und über den heiligen Apostel Petrus</p></li><li><p>Homilie über den Heiligen Geist</p></li><li><p>Homilie über die Verleugnung Petri, über das Kreuz und darüber, wie Josef als Vorbild Christi diente</p></li><li><p>Homilie über das Gleichnis vom Feigenbaum</p></li><li><p>Homilie darüber, dass der Asket sich nicht der Scherzhaftigkeit hingeben darf</p></li><li><p>Homilie über den Verrat des Judas</p></li><li><p>Homilie darüber, dass man scheinheiliges und unwahres Auftreten meiden muss</p></li><li><p>Homilie über die Weissagung des Zacharias und die Empfängnis der Elisabeth</p></li><li><p>Auf den Neuen Sonntag und auf den Apostel Thomas</p></li><li><p>Auf die heilige Himmelfahrt unseres Erlösers</p></li><li><p>Über die Blutflüssige aus dem Evangelium nach Lukas</p></li><li><p>Darüber, dass das gegenwärtige Leben dem Meer gleicht, und darüber, wie Jesus mit seinen Jüngern in das Schiff stieg und einschlief (Lk 8,22–23; Mt 8,23)</p></li><li><p>Über die Buße und zur Lesung über (die Sünde) Davids mit der Frau des Urija</p></li><li><p>Über diejenigen, welche während der Fastenzeit Enthaltsamkeit üben, und über die Lebensweise der verschiedenen Propheten</p></li><li><p>Ermahnungsrede über die Enthaltsamkeit</p></li><li><p>Rede über den heiligen Gregor den Großen, den Erleuchter, den Hohenpriester unseres Gottes</p></li><li><p>Auf die heilige Theophanie</p></li><li><p>Über die Gotteserkenntnis, auf die heilige Theophanie und an die Neugetauften</p></li><li><p>Auf das heilige Pfingstfest</p></li><li><p>Über die Wiederkunft unseres Herrn Jesus Christus und über das Almosen</p></li><li><p>Auf die Geburt unseres Herrn Jesus Christus</p></li><li><p>Zur Evangelienlesung, über die Jungfräulichkeit und Ermahnung an die gefallenen Jungfrauen</p></li><li><p>Darüber, dass es schwer wiegt, die Menschenliebe Gottes zu verachten</p></li><li><p>Über die Geduld, das Ende dieses Zeitalters und die Wiederkunft</p></li><li><p>Über den Verrat des Judas und über die Leiden unseres Herrn Jesus Christus</p></li><li><p>Über den Zöllner Zachäus</p></li><li><p>Die Liebe nach Gott – ein Gottes würdiges Werk</p></li><li><p>Auf die Himmelfahrt unseres Herrn Jesus Christus</p></li><li><p>Darüber, dass der, welcher irgendeine Gnade der Erkenntnis besitzt, sie dem Bedürftigen weitergeben muss, und über den Presbyter</p></li><li><p>Lobrede auf den heiligen Johannes den Theologen</p></li><li><p>Über die Dürre</p></li><li><p>Auf die Geburt Christi</p></li><li><p>Über Rachel und die Kinder</p></li><li><p>Über die dreitägige Auferstehung unseres Herrn Jesus Christus</p></li><li><p>Über Herodes und die Kindlein</p></li><li><p>Über den Hauptmann</p></li><li><p>Gegen die Juden über die eherne Schlange</p></li><li><p>Über den heiligen Johannes, den Apostel und Evangelisten, den Theologen</p></li><li><p>Über den Sohn der Witwe</p></li><li><p>Homilien auf Pfingsten</p></li><li><p>Reden auf das heilige Pascha</p></li><li><p>Über das kostbare Kreuz</p></li><li><p>Über das kostbare und lebenspendende Kreuz und über die Übertretung der ersten Menschen</p></li><li><p>Erklärung des Gebetes „Vater unser“</p></li><li><p>Über die heilige Jungfrau und Gottesgebärerin Maria</p></li><li><p>Gegen die Häretiker und über die heilige Gottesgebärerin</p></li><li><p>Über die heiligen zwölf Apostel</p></li><li><p>Über die höchsten Apostel Petrus und Paulus und ihr ruhmreichstes Martyrium</p></li><li><p>Rede über den heiligen Johannes den Theologen</p></li><li><p>Über den heiligen Apostel Thomas</p></li><li><p>Auf den Beginn der Indiktion</p></li><li><p>Auf die Erhöhung des kostbaren Kreuzes</p></li><li><p>Auf die Synaxis der Erzengel</p></li><li><p>Auf das Fest der heiligen Theophanie</p></li><li><p>Rede über die Darstellung unseres Herrn Jesus Christus sowie über die Gottesgebärerin und über Simeon</p></li><li><p>Auf die Verkündigung an unsere überaus herrliche Herrin, die Gottesgebärerin</p></li><li><p>Auf die dreitägige Auferstehung unseres Herrn Jesus Christus</p></li><li><p>Homilien auf die Himmelfahrt unseres Herrn Jesus Christus</p></li><li><p>Auf den Beginn des neuen Jahres und über die Märtyrer sowie über die blutflüssige Frau</p></li><li><p>Homilien über Johannes den Vorläufer</p></li><li><p>Über die Buße sowie über Herodes und Johannes den Täufer</p></li><li><p>Auf die Enthauptung des Vorläufers und Täufers Johannes und über Herodias</p></li><li><p>Über den Tanz der Herodias und die Abschlagung des Hauptes des Vorläufers und Täufers Johannes</p></li><li><p>Auf die Menschwerdung unseres Herrn Jesus Christus und dass jedes Land seine Engel hat</p></li><li><p>Auf den heiligen Erzmärtyrer Stephanus</p></li><li><p>Über den heiligen Erzmärtyrer Stephanus –</p></li><li><p>Über Lazarus und den Reichen</p></li><li><p>Über die Sünderin, die den Herrn mit Salböl salbte, und über den Pharisäer.</p></li><li><p>Über den verlorenen Sohn, über die Buße, über den Baum der Erkenntnis des Guten und Bösen und über den Räuber</p></li><li><p>Rede über die falschen Propheten, die falschen Lehrer und die Häretiker sowie über die Zeichen des Endes dieses Zeitalters</p></li><li><p>Über den Verrat (des Judas) am Erlöser usw.</p></li><li><p>Rede darüber, dass man sich nicht schämen darf, das kostbare Kreuz zu verherrlichen</p></li><li><p>Rede über den Zirkus</p></li><li><p>Über den Räuber und über den Verrat (des Judas) an unserem Erlöser Jesus Christus</p></li><li><p>Schriftliche Antwort des gefallenen Theodor an unseren heiligen Vater und ökumenischen Lehrer Johannes Chrysostomus</p></li><li><p>Rede darüber, dass der Jünger Christi sanftmütig sein und nicht vorschnell zürnen soll</p></li><li><p>Rede über das Fasten und das Almosen</p></li><li><p>Auf das im Evangelium Gesagte</p></li><li><p>Siebente Rede über das Priestertum (Auf die Wochen des Triodion)</p></li><li><p>Homilie über den Pharisäer</p></li><li><p>Homilie über den von Christus geheilten Blinden, über Zachäus, über das Gericht und über das Almosen</p></li><li><p>Rede über den Zöllner und den Pharisäer</p></li><li><p>Auf das Gleichnis vom verlorenen Sohn</p></li><li><p>Auf die mittlere Woche der Fastenzeit</p></li><li><p>Auf die Verehrung des kostbaren und lebenspendenden Kreuzes in der mittleren Woche der Großen Fastenzeit</p></li><li><p>Auf den heiligen und großen Freitag</p></li><li><p>Über die Myrrhenträgerinnen</p></li><li><p>Über den Eifer und die Frömmigkeit und über den Blindgeborenen</p></li><li><p>Auf den Palmsonntag</p></li><li><p>Geistliche Ermahnungen</p></li><li><p>Auf die Verkündigung an die Gottesgebärerin und gegen den gottlosen Arius</p></li><li><p>Auf den Zöllner und den Pharisäer</p></li><li><p>Auf den Beginn der Fastenzeit und über das Fasten</p></li><li><p>Auf die Verehrung des kostbaren Holzes</p></li><li><p>Auf das Gleichnis von dem unter die Räuber Gefallenen</p></li><li><p>Auf die Worte: „Ich bin gekommen, Feuer auf die Erde zu werfen“ (Lk 12,49); und: „Ich bin nicht gekommen, Frieden zu bringen, sondern das Schwert“ (Mt 10,34).</p></li><li><p>Auf die heilige Himmelfahrt unseres Herrn Jesus Christus</p></li><li><p>Auf das Opfer Kains, die Gaben Abels, über die Riesen, die Sintflut, die Sterne und das Schicksal</p></li><li><p>Über den vier Tage im Grab liegenden Lazarus. Erste Rede</p></li><li><p>Über den vier Tage im Grab liegenden Lazarus. Zweite Rede</p></li><li><p>Über den vier Tage im Grab liegenden Lazarus. Dritte Rede</p></li><li><p>Über die Liebe</p></li><li><p>Über das Almosen</p></li><li><p>Über das Gebet</p></li><li><p>Über das Fasten. Erste Rede</p></li><li><p>Über das Fasten. Zweite Rede</p></li><li><p>Über das Fasten. Dritte Rede</p></li><li><p>Über das Fasten, über David, über die Presbyter, über Goliat und gegen Nabat</p></li><li><p>Über das Fasten – in der fünften Woche der Fastenzeit</p></li><li><p>Über die Auferstehung unseres Herrn Jesus Christus und über die Myrrhenträgerinnen</p></li><li><p>Beim Beginn der heiligen Fastenzeit</p></li><li><p>Am heiligen und großen Freitag auf das heilige Leiden des Herrn</p></li><li><p>Über die Kanaanäerin (Mt 15)</p></li><li><p>Vergleich der königlichen Macht, des Reichtums und der Vorrechte mit der wahren und christlichen Philosophie des Mönchslebens</p></li><li><p>Katechetische Homilie mit den zur Erleuchtung Vorbereiteten</p></li><li><p>An die Juden und Griechen, und an die Häretiker; und auf die Worte: „Jesus war ... zum Hochzeitsmahl geladen“ (Joh 2,2)</p></li><li><p>Katechetische Rede auf die Worte des Evangeliums: (Mt 20,1–16)</p></li><li><p>Auf die Worte des Apostels: „Denn nicht das Gute, das ich will, tue ich, sondern das Böse, das ich hasse, das tue ich“ (Röm 7,15)</p></li><li><p>Auf die Worte: „Meine Gnade genügt dir; denn meine Kraft vollendet sich in der Schwachheit“ (2Kor 12,9)</p></li><li><p>Auf die Worte: „Die Hohenpriester und Pharisäer versammelten einen Rat und sprachen: Was sollen wir tun?“ (Joh 11,47)</p></li><li><p>Auf die Worte: „Das Himmelreich ist gleich einem Senfkorn“ (Mt 13,31)</p></li><li><p>Auf die Worte: „Seht zu, dass ihr euer Almosen nicht vor den Menschen gebt“ (Mt 6,1)</p></li><li><p>Auf das Evangelium nach Lukas, über die Drachme, und auf die Worte: „Ein Mensch hatte zwei Söhne“ (Lk 15,11)</p></li><li><p>Auf das Gleichnis von den zehn Jungfrauen und über das Almosen (Mt 25,1)</p></li><li><p>Auf das Gleichnis vom ungerechten Haushalter und dass nichts unser ist (Lk 16,1–9)</p></li><li><p>Über die Samariterin und auf die Worte: „So kommt er nun in eine Stadt Samarias, die heißt Sychar“ (Joh 4,5)</p></li><li><p>Gespräch über die Psalmen</p></li><li><p>Homilie auf die Worte: „Es erging ein Gebot von Kaiser Augustus“ (Lk 2,1) und auf die Eintragung der heiligen Gottesgebärerin in die Volkszählung</p></li><li><p>Auf das Gleichnis im Evangelium des Lukas, in dem es heißt: „Ein Mensch ging ... und fiel unter die Räuber“ (Lk 10,30)</p></li><li><p>Auf die Worte: „Ist jemand in Christus, so ist er eine neue Kreatur; das Alte ist vergangen, siehe, alles ist neu geworden“ (2Kor 5,17)</p></li><li><p>Auf die Worte: „Es ging ein Sämann aus, zu säen“ (Lk 8,5)</p></li><li><p>Auf die Worte: „Die Pharisäer aber gingen hinaus und hielten Rat gegen ihn, wie sie ihn umbringen könnten“ (Mt 12,14)</p></li><li><p>Auf die Worte: „Dies ist mein geliebter Sohn, an dem ich Wohlgefallen habe“ (Mt 17,5)</p></li><li><p>Über die Wiederkunft unseres Herrn Jesus Christus und auf die Worte:</p></li><li><p>Auf die Verkündigung an die allerheiligste Gottesgebärerin</p></li><li><p>Auf die Worte: „Mein Vater! Ist es möglich, so gehe dieser Kelch an mir vorüber“ (Mt 26,39). Am großen Freitag</p></li><li><p>Auf die Worte: „Wenn du Gottes Sohn bist, so stürze dich hinab“, und: „Der Teufel nimmt ihn mit auf einen sehr hohen Berg“ (Mt 4,6.8), und anderes</p></li><li><p>Am Gedenktag der Märtyrer</p></li><li><p>Über Martha, Maria und Lazarus und den Propheten Elias</p></li><li><p>Auf die Geburt des heiligen Johannes, des Propheten, Vorläufers und Täufers</p></li><li><p>Lobrede auf die Empfängnis des heiligen Johannes, des Propheten, Vorläufers und Täufers</p></li><li><p>Über die Hure und den Pharisäer</p></li><li><p>Auf die Verklärung des Erlösers</p></li><li><p>Rede über die drei Jünglinge und den babylonischen Ofen</p></li><li><p>Über Susanna</p></li><li><p>Über Josef und die Keuschheit</p></li><li><p>Rede über den Propheten Elias</p></li><li><p>Über den Jordan</p></li><li><p>Rede des Pseudo-Johannes Chrysostomus über die Keuschheit</p></li></ol><h3>Dubia (zweifelhaft)</h3><ol><li><p>Über die Sanftmut</p></li><li><p>Homilie über David, den König, und Paulus, den Apostel</p></li><li><p>Über das Gebet</p></li><li><p>Lobrede auf die heilige Erzmärtyrerin und apostelgleiche Thekla</p></li><li><p>Sehr nützliche Rede über den Glauben, über das Gesetz der Natur und über den Heiligen Geist</p></li><li><p>Rede über den Apostel Petrus und den Propheten Elias</p></li><li><p>Rede über den seligen Abraham</p></li><li><p>Auf die Worte: „Im Anfang war das Wort …“ (Joh 1,1) und anderes.</p></li></ol>
