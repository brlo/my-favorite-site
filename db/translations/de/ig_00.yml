  - src: "Игнатий_Антиохийский"
    # page_type и edit_mode наследуются от русской страницы-оригинала
    path: "Ignatius_von_Antiochien"
    title: "Ignatius von Antiochien, 1. Jh."
    title_sub: "Hieromärtyrer (um 35–107), Bischof von Antiochien, Gottesträger"
    meta_desc: "Ignatius von Antiochien, Hieromärtyrer und Bischof von Antiochien: sein Leben, seine sieben Briefe und sein Zeugnis für die Einheit der Kirche."
    menu: { parent: "1. Jahrhundert", title: "Ignatius von Antiochien", priority: 2 }
    update: true
    body: |-
      <p>Den Abschnitt mit den Werken des Ignatius von Antiochien <strong>auf Griechisch</strong> finden Sie <a href="https://bibleox.com/de/grc/w/%CE%99%CE%B3%CE%BD%CE%AC%CF%84%CE%B9%CE%BF%CF%82_%CE%98%CE%B5%CE%BF%CF%86%CF%8C%CF%81%CE%BF%CF%82_%CE%91%CE%BD%CF%84%CE%B9%CE%BF%CF%87%CE%B5%CE%AF%CE%B1%CF%82/">hier</a>. Die übrigen Sprachen lassen sich oben über der Werkliste umschalten.</p>

      <p><strong>Gedenktage</strong>: 20. Dezember (2. Januar), 29. Januar (11. Februar)</p>

      <h2>Leben</h2>

      <p>Über das Leben des Ignatius ist wenig bekannt. Eine Überlieferung sieht in ihm das Kind, das Christus auf seine Arme nahm und segnete (<a href="https://bibleox.com/de/ge-sch/mf/18/#L2-5">Mt. 18,2–5</a>); die meisten Forscher halten dies für eine spätere Legende.</p>

      <p>Wegen der Sprache seiner Briefe hält man ihn für einen Syrer. Jedenfalls gehört er zu den ersten christlichen Schriftstellern nichtjüdischer Herkunft. Nach der „Kirchengeschichte“ des Eusebius von Cäsarea wurde er in Antiochien unter der Regierung Trajans verhaftet und zur Hinrichtung nach Rom gebracht. Während der Reise schrieb er sieben Briefe an die Gemeinden, durch deren Gebiete sein Weg führte – an die Epheser, die Magnesier, die Trallianer, die Philadelphier, die Smyrnäer und die Römer – sowie einen Brief an Polykarp von Smyrna. In Rom wurde er am 20. Dezember 107 den Löwen vorgeworfen.</p>

      <p>Polykarp erwähnt die Briefe des Ignatius bereits in seinem eigenen Schreiben an die Philipper und sammelte sie:</p>

      <blockquote><p><strong>Die Briefe des Ignatius, die er an uns geschickt hat, und andere, die wir bei uns haben</strong>, schicken wir euch zu, wie ihr verlangt habt; sie sind diesem Briefe beigefügt; ihr werdet großen Nutzen aus ihnen ziehen können. Denn sie handeln von Glaube, Geduld und jeglicher Erbauung, die auf unseren Herrn abzielt. (<a href="https://bibleox.com/de/de/w/PlkSm_Phil#HH-13">Polykarp, An die Philipper 13</a>)</p></blockquote>

      <h2>Die sieben Briefe</h2>

      <p>Die Briefe des Ignatius sind in der sogenannten mittleren Rezension erhalten. Sie sind das älteste Zeugnis für die dreifache Ordnung des kirchlichen Amtes – Bischof, Presbyter, Diakone – und für das Verständnis der Eucharistie als Opfer und Gegenwart des Herrn. Ihr Grundton ist die Einheit der Kirche und die Bereitschaft zum Martyrium.</p>

      <ul>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Eph">An die Epheser</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Mag">An die Magnesier</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Trall">An die Trallianer</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Rom">An die Römer</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Philad">An die Philadelphier</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Smyrn">An die Smyrnäer</a></li>
      <li><a href="https://bibleox.com/de/de/w/IgnAnt_Pol">An Polykarp</a></li>
      </ul>

      <h2>Sehnsucht nach dem Martyrium</h2>

      <p>Der Brief an die Römer ist das bewegendste Zeugnis seiner Bereitschaft, für Christus zu sterben. Ignatius bittet die römische Gemeinde, sein Martyrium nicht zu verhindern:</p>

      <blockquote><p><strong>Brotkorn Gottes bin ich</strong>, und durch die Zähne der Tiere werde ich gemahlen, damit ich als reines Brot Christi erfunden werde. (<a href="https://bibleox.com/de/de/w/IgnAnt_Rom#HH-4">An die Römer 4</a>)</p></blockquote>

      <p>Sein Zeugnis für die Einheit der Kirche bleibt bis heute lebendig: „Wo immer der Bischof sich zeigt, da sei auch das Volk, so wie da, wo Jesus Christus ist, auch die katholische Kirche ist“ (<a href="https://bibleox.com/de/de/w/IgnAnt_Smyrn#HH-8">An die Smyrnäer 8</a>).</p>

  - src: "ИгнАн_Еф"
    path: "IgnAnt_Eph"
    title: "An die Epheser"
    meta_desc: "An die Epheser des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Epheser", priority: 1 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Epheser.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), entbietet vielmals Gruß in Jesus Christus und in vollkommener Freude der mit Recht überglücklichen Kirche von Ephesus in (Klein-) Asien, die gesegnet ist in der Größe Gottes des Vaters durch reiche Gnade, die vor allen Zeiten vorherbestimmt ist, auf dass sie immerdar sei zum bleibenden, unveränderlichen Ruhme geeint und auserwählt in wahrem Leiden nach dem Willen des Vaters und Jesu Christi, unseres Gottes.</p>
      <h2>1</h2><p>1. Ich habe aufgenommen in Gott deinen vielgeliebten Namen (= die Gemeinde Ephesus), den ihr erworben habt durch euer gerechtes Wesen gemäß eurem Glauben und eurer Liebe in Christus Jesus, unserem Erlöser; da ihr Nachahmer Gottes seid, habt ihr, im Blute Gottes zu neuem Leben gelangt, das Werk der Bruderliebe vollkommen ausgeübt. 2. Denn sobald ihr hörtet, dass ich, gefesselt um des gemeinsamen Namens und gemeinsamer Hoffnung willen, von Syrien her komme, im Vertrauen, durch euer Gebet (unterstützt) in Rom den Kampf mit den wilden Tieren ausfechten zu dürfen, damit ich dadurch es erlangen könne, ein Jünger (Christi) zu sein, da waret ihr eifrig bemüht, mich zu sehen. 3. Ich habe also eure ganze Gemeinde im Namen Gottes empfangen in der Person des Onesimus, eines Mannes von unbeschreiblicher Liebe, eures Bischofs im Fleische, den ihr nach Christus - das wünsche ich - (am meisten) lieben und dem ihr alle ähnlich sein sollt; denn gepriesen sei der, dessen Huld euch für würdig hielt, einen solchen Bischof zu besitzen.</p>
      <h2>2</h2><p>1. Bezüglich meines Mitknechtes Burrus, nach Gottes Willen eures in allen Dingen gepriesenen Diakons, hege ich den Wunsch, dass er (bei mir) bleibe zu eurer und des Bischofs Ehre; auch Krokus, der Gottes und eurer würdig ist, den ich als Zeichen eurer Liebe empfing, hat mich in jeder Hinsicht aufgerichtet, wie auch ihn selbst der Vater Jesu Christi erquicken möge zugleich mit Onesimus, Burrus, Euplus und Fronto, durch die ich euch alle der Liebe nach gesehen habe. 2. Ich möchte mich immerdar erfreuen an euch, soweit ich dessen würdig bin; daher geziemt es sich, dass ihr in jeder Hinsicht verherrlichet Jesus Christus, der euch verherrlicht hat, damit ihr, in einheitlicher Unterordnung verbunden, in Gehorsam gegen den Bischof und das Presbyterium in allem geheiligt seid.</p>
      <h2>3</h2><p>1. Ich gebe euch meine Mahnungen nicht, als ob ich etwas wäre. Denn wenn ich auch um des Namens willen Fesseln trage, so bin ich doch noch nicht vollkommen in Jesus Christus. Ich fange nämlich jetzt erst an mit der Jüngerschaft (Christi) und rede zu euch als zu meinen Mitschülern; denn von euch musste ich (zum Kampfe) gesalbt werden durch Glauben, Ermunterung, Geduld und Langmut. 2. Aber weil mich die Liebe nicht schweigen lässt, wenn’s euch angeht, deshalb habe ich mir vorgenommen, euch zu ermahnen, dass ihr in Übereinstimmung mit dem Willen Gottes wandelt. Denn auch Jesus Christus, unser untrennbares Leben, ist der Wille des Vaters, wie auch die Bischöfe, die bis an die Grenzen der Welt aufgestellt sind, im Willen Jesu Christi sind.</p>
      <h2>4</h2><p>1. Daher ziemt es sich für euch, dem Willen des Bischofs entsprechend zu wandeln, wie ihr es auch tut. Denn euer ehrwürdiges Presbyterium, seines Gottes wert, ist so mit dem Bischof verbunden, wie die Saiten mit der Zither. Deshalb erklingt Jesu Christi Lied in eurer Eintracht und einmütigen Liebe. 2. Aber auch die einzelnen sollen einen Chor bilden, damit ihr in Eintracht zusammenstimmet, in Einigkeit die Melodie Christi auffasset und mit <strong>einer</strong> Stimme durch Jesus Christus dem Vater (lob)singet, auf dass er euch höre und aus euren guten Werken erkenne, dass ihr Glieder seid seines Sohnes. Es ist also gut, dass ihr in vollendeter Eintracht lebet, damit ihr auch an Gott allezeit Anteil habet.</p>
      <h2>5</h2><p>1. Wenn nämlich ich in so kurzer Zeit zu eurem Bischof in so enge Beziehung getreten bin, die nicht menschlich, sondern geistig ist, um wieviel mehr muss ich euch glücklich preisen, die ihr (ihm) so fest verbunden seid, wie die Kirche mit Jesus Christus und wie Jesus Christus mit dem Vater, damit alles in Eintracht zusammenstimme? 2. Keiner lasse sich irreführen: Wer nämlich nicht innerhalb der Opferstätte ist, der kommt um das Brot Gottes. Wenn nämlich das Gebet eines einzigen oder zweier (Menschen) eine solche Kraft hat, um wieviel mehr das Gebet des Bischofs und der ganzen Gemeinde? 3. Wer also nicht zur Versammlung kommt, der ist schon von Hochmut besessen und hat sich selbst gerichtet. Denn es steht geschrieben: „Den Hochmütigen widersteht Gott“. Hüten wir uns also davor, mit dem Bischof uns zu entzweien, damit wir im Gehorsam gegen Gott verharren.</p>
      <h2>6</h2><p>1. Und je mehr einer sieht, dass der Bischof schweigt (nicht tadelt), um so mehr Achtung soll er vor ihm haben; jeden nämlich, den der Herr des Hauses schickt zur Verwaltung seines Hauses, den müssen wir so aufnehmen wie den Sendenden selbst. Daher ist es klar, dass wir den Bischof so ansehen müssen wie den Herrn selbst. 2. Nun ist Onesimus selbst voller Lob über euer Wohlverhalten in Gott, dass ihr nämlich alle der Wahrheit gemäß lebet und sich keine Irrlehre unter euch eingenistet hat, sondern dass ihr auf keinen mehr höret als auf Jesus Christus, der die Wahrheit redet.</p>
      <h2>7</h2><p>1. Es ist nämlich üblich geworden, dass einige in verwerflichem Truge zwar den (Christen-) Namen zur Schau tragen, aber andere Dinge tun, die Gottes unwürdig sind; diesen müsst ihr ausweichen wie wilden Tieren. Das sind nämlich wütende Hunde, die heimlich beißen; vor diesen müsst ihr euch hüten, da sie (ihre Bisse) schwer zu heilen sind. 2. Einer ist der Arzt, fleischlich sowohl als geistig, geboren und ungeboren, im Fleische wandelnd ein Gott, im Tode wahrhaftiges Leben, sowohl aus Maria als aus Gott, zuerst leidensfähig, dann leidensunfähig, Jesus Christus unser Herr.</p>
      <h2>8</h2><p>1. Keiner soll daher euch verführen, wie ihr euch auch nicht verführen lasset; denn ihr gehöret ganz Gott. Wenn nämlich kein Streit bei euch eingedrungen ist, der euch quälen könnte, dann lebt ihr fürwahr Gott gemäß. Ein Sühnopfer für euch bin ich und werde auch geweiht für euch Epheser, die weitberühmte Kirche für ewige Zeiten. 2. Die Fleischlichen können das Geistige nicht tun noch die Geistigen das Fleischliche, so wenig wie der Glaube die Werke des Unglaubens oder der Unglaube die des Glaubens. Aber auch was ihr dem Fleische nach tut, ist geistig; denn ihr tut alles in Jesus Christus.</p>
      <h2>9</h2><p>1. Ich habe erfahren, dass einige von dort wieder abziehen mussten, weil sie eine schlechte Lehre hatten; ihr ließet sie ihre Saat bei euch nicht ausstreuen, indem ihr eure Ohren verstopftet, damit ihr die von ihnen ausgestreute Saat nicht aufnähmet, als Bausteine für den Tempel des Vaters, zubereitet für den Bau Gottes des Vaters, in die Höhe gehoben durch das Hebewerk Jesu Christi, welches ist das Kreuz, während euch als Seil diente der Heilige Geist; euer Glaube ist euer Führer nach oben, die Liebe der Weg, der zu Gott emporführt. 2. Ihr seid also alle Weggenossen, Gottesträger und Tempelträger, Christusträger, Heiligenträger, in allen Stücken geschmückt mit den Geboten Jesu Christi; ich frohlocke auch über euch, da ich gewürdigt worden bin, durch diesen Brief mit euch zu reden und mich mit euch zu freuen, weil ihr entsprechend einem anderen (das ist nicht fleischlichen) Leben nichts liebet als Gott allein.</p>
      <h2>10</h2><p>1. Auch für die anderen Menschen betet ohne Unterlass. Denn auch in ihnen lebt die Hoffnung auf Umkehr, damit sie zu Gott gelangen. Gestattet ihnen daher wenigstens soviel, dass sie aus euren Werken lernen. 2. Gegen die Ausbrüche ihres Zornes seid milde, gegen ihre prahlerischen Reden bescheiden, ihren Lästerungen stellt euer Gebet gegenüber, gegen ihre Verirrungen seid stark im Glauben gegen ihr ungestümes Auftreten seid sanft und hütet euch, ihnen nachzuahmen. 3. Als ihre Brüder sollen wir erfunden werden durch unsere Nachgiebigkeit; wir wollen uns befleißen, Nachahmer des Herrn zu sein; wer wurde mehr beleidigt, mehr beraubt, mehr missachtet als er? Auf dass niemand unter euch als Pflänzlein des Teufels erfunden werde, sondern dass ihr in aller Reinheit und Mäßigung in Jesus Christus verbleibet fleischlich und geistig.</p>
      <h2>11</h2><p>1. Die letzten Zeiten sind da; deshalb wollen wir auf der Hut sein und Furcht haben vor Gottes Langmut, dass sie uns nicht zum Gerichte werde. Entweder müssen wir Furcht haben vor dem kommenden Zorn oder die gegenwärtige Gnade lieben, eins von beiden, nur dass wir in Christus Jesus erfunden werden zum wahren Leben. 2. Nichts gewinne euer Wohlgefallen außer ihm, in dem ich die Fesseln herumtrage, die geistigen Edelsteine, in denen mir die Auferstehung zukommen möge durch euer Gebet, dessen ich immer teilhaftig sein möchte, damit ich erfunden werde in den Reihen der Epheser, der Christen, die auch mit den Aposteln immer zusammengestimmt haben in der Kraft Jesu Christi.</p>
      <h2>12</h2><p>1. Ich weiß, wer ich bin und wem ich schreibe. Ich bin verurteilt, ihr habt Gnade gefunden; ich bin in Gefahr, ihr seid gefestigt. 2. Ihr seid (= eure Stadt ist) der Durchgangspunkt für die, die (getötet werden, dass sie) zu Gott gelangen, ihr seid die Miteingeweihten des Paulus, der geheiligt, gemartert worden ist, des hochseligen, auf dessen Pfaden ich erfunden werden möchte, wenn ich zu Gott gelange, der in einem ganzen Briefe euer gedenkt in Christus Jesus.</p>
      <h2>13</h2><p>1. Befleißiget euch daher, dass ihr häufiger zusammenkommt zur (Feier der) Eucharistie Gottes und zum Lobe. Denn wenn ihr euch oft versammelt, wird die Macht Satans gebrochen, und sein verderblicher Einfluss wird in der Eintracht eures Glaubens aufgehoben. 2. Nichts ist besser als Friede, an dem aller Krieg himmlischer und irdischer Mächte abprallt.</p>
      <h2>14</h2><p>1. Davon bleibt euch nichts verborgen, wenn ihr vollkommen seid in Glaube und Liebe zu Jesus Christus; denn das ist Anfang und Ende des Lebens. Anfang ist der Glaube, Ende die Liebe. Diese beiden, zur Einheit verbunden, sind Gott! Alles Übrige, was zum rechten Leben gehört, folgt aus diesen. 2. Keiner, der den Glauben bekennt, sündigt, und keiner, der die Liebe besitzt, hasst. Den Baum erkennt man an seinen Früchten; so werden die, welche sich zu Christus bekennen, an ihren Werken erkannt werden. Denn jetzt kommt es nicht an auf das Bekenntnis, sondern darauf, dass einer in der Kraft des Glaubens befunden wird bis ans Ende.</p>
      <h2>15</h2><p>1. Besser ist schweigen und etwas sein, als reden und nichts sein. Gut ist das Lehren, wenn man tut, was man sagt. Einer nun ist der Lehrer, der „sprach und es geschah“, und das, was er schweigend getan hat, ist des Vaters würdig. 2. Wer Christi Wort besitzt, kann wahrhaftig auch sein Schweigen vernehmen, damit er vollkommen sei, damit er durch sein Wort wirke und durch sein Schweigen erkannt werde. 3. Nichts entgeht dem Herrn, sondern auch unsere Geheimnisse sind nahe bei ihm. Deshalb wollen wir alles tun, als ob er in uns wohnte, damit wir seine Tempel seien und er, unser Gott, in uns wohne, wie es auch ist und sich zeigen wird vor unserem Angesicht; deshalb sollen wir ihn auch richtig lieben.</p>
      <h2>16</h2><p>1. Lasset euch nicht irreführen, Brüder; die die Ehre eines Hauses schänden, werden das Reich Gottes nicht erben. 2. Wenn nun Leute, die dem Fleische nach solches verübten, dem Tode verfallen sind, um wieviel mehr, wenn einer den Glauben Gottes durch schlechte Lehre schändet, für den Jesus Christus gekreuzigt worden ist? Wer sich dadurch befleckt hat, wird in das unauslöschliche Feuer wandern, ebenso der, welcher ihn hört.</p>
      <h2>17</h2><p>1. Deshalb nahm der Herr Salbe auf sein Haupt, damit er der Kirche Unverweslichkeit zuwehe. Salbet euch daher nicht mit dem üblen Geruch der Lehre des Fürsten dieser Welt, damit er euch nicht aus dem zu erwartenden Leben weg in die Gefangenschaft führe. 2. Warum aber werden wir nicht alle (ohne Ausnahme) verständig, die wir doch die Kenntnis Gottes bekommen haben, das ist Jesus Christus? Warum gehen wir törichterweise verloren, da wir die Gnadengabe verkennen, die uns der Herr wahrhaft gesandt hat?</p>
      <h2>18</h2><p>1. Mein Geist ist nur Auskehricht des Kreuzes, welches ist den Ungläubigen ein Ärgernis, uns aber Erlösung und ewiges Leben. Wo ist ein Weiser? Wo ein Forscher? Wo ist die Prahlerei derer, die man Weise nennt? 2. Denn unser Gott, Jesus der Christus, wurde von Maria empfangen, nach dem Heilsplan Gottes zwar aus dem Samen Davids, aber vom Heiligen Geiste; er wurde geboren und getauft, damit er durch das Leiden das Wasser reinige.</p>
      <h2>19</h2><p>1. Und es blieb dem Fürsten dieser Welt verborgen die Jungfrauschaft Marias und ihr Gebären, ebenso auch der Tod des Herrn; drei laut rufende Geheimnisse, die in der Stille Gottes vollbracht wurden. 2. Wie wurden sie nun den Zeiten kund? Ein Stern strahlte auf am Himmel, heller als alle Sterne, und sein Licht war unbeschreiblich, und seine Neuheit rief Staunen hervor; alle übrigen Sterne aber samt Sonne und Mond führten einen Reigen auf vor diesem Sterne, und sein Licht überstrahlte alle; und es herrschte Bestürzung darüber, woher diese unter ihnen neue Erscheinung sei. 3. Infolgedessen löste jegliche Zauberei sich auf, und jede Fessel der Bosheit ward vernichtet; die Unwissenheit ward weggenommen, das alte Reich ward zerstört, da Gott in Menschengestalt sich offenbarte zur Neuschaffung ewigen Lebens; da nahm seinen Anfang, was bei Gott zubereitet war. Deshalb kam alles in Bewegung, weil die Vernichtung des Todes betrieben wurde.</p>
      <h2>20</h2><p>1. Wenn Jesus Christus durch euer Gebet mich würdigt, und es sein Wille ist, werde ich in dem zweiten Briefe, den ich euch zu schreiben vorhabe, euch des weiteren darlegen, was ich begonnen habe über den Heilsplan in Beziehung auf den neuen Menschen Jesus Christus, in seinem Glauben und in seiner Liebe, in seinem Leiden und seiner Auferstehung. 2. Ganz besonders (werde ich es tun), wenn der Herr mir offenbart, dass ihr alle Mann für Mann gemeinsam in der Gnade zufolge des Namens euch versammelt in Glauben und in Jesus Christus, der dem Fleische nach aus dem Geschlechte Davids stammt, dem Sohne des Menschen und dem Sohne Gottes, auf dass ihr untertänig seid dem Bischof und dem Presbyterium in ungeteilter Gesinnung, Brot brechend, das ist ein Heilmittel zur Unsterblichkeit, ein Gegengift, dass wir nicht sterben, sondern leben in Jesus Christus immerdar.</p>
      <h2>21</h2><p>1. Meine Seele gebe ich hin für euch und die, welche ihr zu Gottes Ehre nach Smyrna gesandt habt, von wo ich euch schreibe, voll Dank gegen den Herrn, voll Liebe zu Polykarp wie zu euch. Gedenket meiner, wie auch euer Jesus Christus (gedenken möge). 2. Betet für die Kirche in Syrien, von wo ich gefesselt nach Rom weggeführt werde, der ich der letzte bin von den dortigen Gläubigen, wie ich ja gewürdigt wurde, zur Ehre Gottes erfunden zu werden. Lebet wohl in Gott dem Vater und in Jesus Christus, unserer gemeinsamen Hoffnung.</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_Мг"
    path: "IgnAnt_Mag"
    title: "An die Magnesier"
    meta_desc: "An die Magnesier des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Magnesier", priority: 2 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Magnesier.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), an die Kirche zu Magnesia am Mäander, die gesegnet ist durch die Gnade Gottes des Vaters in Christus Jesus, unseren Heiland, in dem ich sie grüße und ihr in Gott Vater und in Jesus Christus alles Gute wünsche.</p>
      <h2>1</h2><p>1. Da ich von eurer in Gott gar wohlgeordneten Liebe erfuhr, nahm ich mir voll Freude vor, im Glauben an Jesus Christus einige Worte an euch zu richten. 2. Da ich nämlich des Gott wohlgefälligsten Namens gewürdigt wurde, so preise ich in den Ketten, die ich trage, die Kirchen und wünsche ihnen die Einheit mit dem Fleische und Geiste Jesu Christi, unseres immerwährenden Lebens, die Einheit des Glaubens und der Liebe, über die nichts geht, und was noch wichtiger ist, die Einheit mit Jesus und dem Vater. Denn falls wir in ihm allen Übermut des Fürsten dieser Welt ertragen und meiden, werden wir Gottes teilhaftig werden.</p>
      <h2>2</h2><p>Da ich nun gewürdigt wurde, euch zu sehen in eurem Gottes würdigen Bischof Damas, in den ehrwürdigen Presbytern Bassus und Apollonius and in meinem Mitknechte, dem Diakon Zotion, an dem ich mich erfreuen möchte, weil er untertan ist dem Bischof, als einer Gnade Gottes und dem Presbyterium als einem Gesetz Jesu Christi ….</p>
      <h2>3</h2><p>1. Es ziemt euch aber, das jugendliche Alter des Bischofs nicht auszunützen, sondern entsprechend der Macht Gottes des Vaters jegliche Ehrfurcht ihm zu erzeigen, wie ich erfahren habe, dass auch die heiligen Presbyter seine offenbar in jugendlichem Alter erfolgte Erhebung nicht missbrauchen, sondern als in Gott verständige Männer in Übereinstimmung mit ihm wandeln, doch nicht mit ihm, sondern mit dem Vater Jesu Christi, dem Bischof aller. 2. Zur Ehre dessen nun, der uns erwählt hat, ziemt es sich, ohne jede Heuchelei gehorsam zu sein; denn man täuscht nicht diesen sichtbaren Bischof, sondern man spottet über den unsichtbaren. Ein solches Handeln aber bezieht sich nicht auf das Fleisch, sondern auf Gott, der das Verborgene weiß.</p>
      <h2>4</h2><p>So ziemt es sich denn also, nicht bloß Christ zu heißen, sondern auch zu sein; wie es ja auch Leute gibt, welche den Bischof zwar so nennen, aber alles ohne ihn tun. Diese scheinen mir aber kein gutes Gewissen zu haben, weil sie nicht zuverlässig dem Gebote gemäß ihre Versammlungen halten.</p>
      <h2>5</h2><p>1. Da nun die Dinge ein Ziel haben und zweierlei zugleich uns vorgelegt ist, der Tod und das Leben, so wird auch jeder an seinen besonderen Ort gelangen; 2. wie es ja auch zwei Münzen gibt, nämlich eine Münze Gottes und eine dieser Welt; und zwar trägt jede derselben ihr eigenes Gepräge an sich: die Ungläubigen das Gepräge dieser Welt, die Gläubigen aber in Liebe das Gepräge Gottes des Vaters durch Jesus Christus, dessen Leben nicht in uns ist, wenn wir nicht selbst durch ihn bereit sind, auf sein Leiden hin zu sterben ….</p>
      <h2>6</h2><p>1. Da ich nun in den genannten Personen die ganze Gemeinde im Glauben sah und lieb gewann, ermahne ich euch: Befleißiget euch, alles zu tun in der Eintracht Gottes, da der Bischof den Vorsitz führt an Stelle Gottes, die Presbyter an Stelle des Apostelkollegiums, und die Diakonen, die ich gar sehr liebe, mit dem Dienste Jesu Christi betraut sind, welcher von Ewigkeit beim Vater war und am Ende (der Zeiten) erschienen ist. 2. Nehmet also alle gottgefällige Sitte an, gebet einander nach, und keiner sehe in fleischlicher Weise nach dem Nächsten, sondern liebet einander in Jesus Christus allezeit. Nichts sei unter euch, das imstande wäre, euch zu spalten, seid vielmehr eins mit dem Bischof und mit den Vorgesetzten zum Vorbild und zur Lehre der Unvergänglichkeit.</p>
      <h2>7</h2><p>1. Wie nun der Herr, da er mit ihm eins ist, ohne den Vater nichts getan hat, weder durch sich selbst noch durch die Apostel, so sollt auch ihr ohne den Bischof und die Presbyter nichts tun; auch sollt ihr nicht versuchen, etwas auf eigene Faust als richtig erscheinen zu lassen, sondern bei eurer Versammlung sei ein Gebet, eine Bitte, ein Sinn, eine Hoffnung in Liebe, in untadeliger Freude, das ist Jesus Christus, im Vergleich zu dem es gar nichts Besseres gibt. 2. Kommet alle zusammen wie in einen Tempel Gottes, wie zu einem Altare, zu dem einen Jesus Christus, welcher von einem Vater ausging und bei dem einen blieb und zu ihm zurückgekehrt ist.</p>
      <h2>8</h2><p>1. Lasset euch nicht verführen durch die falschen Lehren und die alten Sagen, die nichts nützen; denn wenn wir bis jetzt nach dem Judentum leben, gestehen wir zu, dass wir die Gnade nicht empfangen haben. 2. Denn die gotterleuchtetsten Propheten haben nach Christus Jesus gelebt. Deshalb wurden sie auch verfolgt, begeistert von seiner Gnade, auf dass die Ungläubigen volle Gewissheit bekämen, dass es einen Gott gibt, der sich geoffenbart hat durch Jesus Christus, seinen Sohn, der sein in der Stille ausgegangenes Wort ist und in allem dem Wohlgefallen hat, der ihn gesandt hat.</p>
      <h2>9</h2><p>1. Wenn nun die nach dem alten Brauche lebten, umgekehrt zur neuen Hoffnung gelangt sind, indem sie nicht mehr den Sabbat halten, sondern ihr Leben nach dem Sonntag richten, an dem auch unser Leben aufgesproßt ist durch ihn und seinen Tod - was einige leugnen -, ein Geheimnis, durch das wir den Glauben erhielten und wegen dessen wir ausharren, damit wir uns ausweisen als Schüler Jesu Christi, unseres einzigen Lehrers; 2. wie werden wir leben können ohne ihn, dessen Schüler im Geiste sogar die Propheten waren, und den sie als ihren Lehrer erwarteten? Und deshalb ist er, den sie in Gerechtigkeit erwarteten, euch erschienen und hat sie von den Toten erweckt.</p>
      <h2>10</h2><p>1. Seien wir daher nicht unempfänglich gegen seine Huld! Wenn er nämlich unsere Handlungsweise nachahmt, dann sind wir schon dahin. Deshalb wollen wir, nachdem wir seine Schüler geworden sind, lernen, dem Christentum gemäß zu leben. Denn wer sich nach einem anderen Namen nennt außer diesem, der ist nicht Gottes. 2. Schaffet also weg den schlechten Sauerteig, der veraltet und versauert ist, und wandelt euch um in einen neuen Sauerteig, der ist Jesus Christus. In ihm sollet ihr gesalzen werden, damit keiner unter euch verderbe (durch Fäulnis), da ihr nach dem Geruche werdet überführt werden. 3. Es ist nicht am Platze, Jesus Christus im Munde zu führen und nach dem Judentum zu leben. Denn der Glaube des Christentums führte nicht zum Judentum, sondern das Judentum zum Christentum, zu dem jegliche an Gott gläubige Zunge geführt worden ist.</p>
      <h2>11</h2><p>Das schreibe ich euch nicht, meine Geliebten, weil ich wusste, dass Leute mit solcher Anschauung unter euch sind, sondern, selbst geringer als ihr, wünsche ich, dass ihr vorsichtig seid, damit ihr nicht in die Angelhaken leeren Glaubens geratet; vielmehr wünsche ich euch gefestigt im Glauben an die Geburt, das Leiden und die Auferstehung, die geschah, als Pontius Pilatus Landpfleger war; wahrhaft und sicher vollbracht von Jesus Christus, unserer Hoffnung, um die keiner von euch gebracht werden möge.</p>
      <h2>12</h2><p>An euch möchte ich immer meine Freude haben, wenn ich dessen würdig bin. Denn wenn ich auch gefesselt bin, so kann ich doch nicht aufkommen gegen einen von euch, die ihr keine Fesseln traget. Ich weiß, dass ihr nicht aufgebläht werdet; denn ihr traget Jesus Christus in euch; vielmehr weiß ich, wenn ich euch lobe, gehet ihr in euch, wie geschrieben steht: „Der Gerechte ist sein eigener Ankläger“.</p>
      <h2>13</h2><p>1. Gebet euch Mühe, in den Lehren des Herrn und der Apostel gefestigt zu werden, damit ihr in allem, was ihr tuet, das Richtige treffet für Fleisch und Geist, Glaube und Liebe im Sohne und im Vater und im Geiste, im Anfang und Ende, im Verein mit eurem ehrwürdigsten Bischof und dem schöngewundenen geistlichen Kranze eures Presbyteriums und eurer gottgemäßen Diakonen. 2. Seid untertan eurem Bischof und euch gegenseitig, wie Jesus Christus seinem Vater dem Fleische nach und die Apostel Jesus und dem Vater und dem Geiste, damit Einheit herrsche dem Fleische und dem Geiste nach.</p>
      <h2>14</h2><p>Überzeugt, dass ihr Gottes voll seid, habe ich euch nur in Kürze zugeredet. Gedenket meiner in euren Gebeten, damit ich Gottes teilhaftig werde, auch der Kirche in Syrien, deren Glied genannt zu werden ich nicht würdig bin; ich bedarf nämlich eures in Gott vereinten Gebetes und eurer Liebe, damit die Kirche in Syrien gewürdigt werde, durch eure Kirche betaut (= erfrischt) zu werden.</p>
      <h2>15</h2><p>Es grüßen euch die Epheser von Smyrna aus, wo ich euch schreibe; sie sind wie auch ihr zur Ehre Gottes gekommen und haben mich in allen Stücken erquickt, zugleich mit Polykarp, dem Bischof von Smyrna. Auch die übrigen Kirchen grüßen euch zur Ehre Jesu Christi Lebet wohl, die ihr eines Sinnes mit Gott unzerstörbaren Geist besitzet, der ist Jesus Christus.</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_Тр"
    path: "IgnAnt_Trall"
    title: "An die Trallianer"
    meta_desc: "An die Trallianer des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Trallianer", priority: 3 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Trallianer.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), an die von Gott, dem Vater Jesu Christi, geliebte heilige Kirche von Tralles in Kleinasien, der auserwählten und gotteswürdigen, die gefriedet ist im Fleische und im Geiste durch das Leiden Jesu Christi, der unsere Hoffnung ist in der Auferstehung zu ihm hin; sie grüße ich auch in der (Gnaden-) Fülle, nach Weise der Apostel und wünsche ihr alles Gute.</p>
      <h2>1</h2><p>1. Von eurer tadellosen und in Geduld unverwüstlichen Gesinnung, die euch nicht nur durch Übung, sondern von Natur eignet, habe ich gehört aus dem Berichte des Polybius, eures Bischofs, welcher nach dem Willen Gottes und Jesu Christi in Smyrna war und sich mit mir, der ich in Christus Jesus gefesselt bin, so &lt;132&gt; freute, dass ich in ihm eure ganze Gemeinde erblickte. 2. Da ich also durch ihn euer gottgemäßes Wohlwollen erfahren durfte, pries ich (Gott), da ich in euch, wie ich erkannt hatte, Nachahmer Gottes fand.</p>
      <h2>2</h2><p>1. Solange ihr nämlich eurem Bischof untertan seid wie Jesus Christus, scheint ihr mir nicht nach Menschenart zu leben, sondern nach Jesus Christus, der unseretwegen gestorben ist, damit ihr durch den Glauben an seinen Tod dem Tode entrinnet. 2. Daher ist es notwendig - wie ihr es ja haltet - dass ihr ohne den Bischof nichts tuet, und dass ihr vielmehr auch dem Presbyterium euch füget wie den Aposteln Jesu Christi, unserer Hoffnung, in dem wandelnd wir erfunden werden sollen. 3. Auch ist es nötig, dass die Diakonen, welche Geheimnisse Jesu Christi verwalten, auf jede Weise allen genehm seien. Denn sie sind nicht Diener für Speise und Trank, sondern Gehilfen der Kirche Gottes. Daher müssen sie sich vor Anschuldigungen hüten wie vor Feuer.</p>
      <h2>3</h2><p>1. Gleicherweise sollen alle die Diakonen achten wie Jesus Christus, wie auch den Bischof als das Abbild des Vaters, die Presbyter aber wie eine Ratsversammlung Gottes und wie einen Bund von Aposteln. Getrennt von diesen kann man von keiner Kirche reden. 2. Dass ihr dieses so haltet, davon bin ich überzeugt. Denn ich habe als Abbild eurer Liebe erhalten und habe bei mir euren Bischof, dessen Haltung allein eine starke Lehre und dessen Milde seine Macht ist; ihn achten, glaube ich, auch die Gottlosen. 3. Da ich euch liebe, halte ich an mich, obwohl ich ernster hierüber schreiben könnte. Nicht soweit glaubte ich (gehen zu dürfen), dass ich, ein Verurteilter, wie ein Apostel euch befehle.</p>
      <h2>4</h2><p>1. Vieles denke ich in Gott, aber ich lege mir Maß auf, damit ich nicht in Überhebung verloren gehe. Denn jetzt muss ich mich mehr in acht nehmen und darf nicht hören auf solche, die mich aufblähen; denn die (so) zu mir reden, geißeln mich. 2. Denn ich liebe zwar das Leiden, aber ich weiß nicht, ob ich würdig bin. Mein eifriges Streben sehen nämlich viele nicht, mir aber setzt es kräftiger zu. Ich brauche also Mäßigung, durch die der Fürst dieser Welt zuschanden wird.</p>
      <h2>5</h2><p>1. Kann ich euch nicht das Himmlische beschreiben? Ich fürchte aber, es könnte euch, die ihr noch Kinder seid, schädlich sein; verzeihet mir also, damit ihr nicht elend zugrunde gehet, weil ihr es nicht begreifen könnet. 2. Denn deshalb, weil ich gefesselt und auch imstande bin, das Himmlische zu erkennen, die Plätze der Engel und die Rangordnung der Herrschaften, das Sichtbare und das Unsichtbare, so bin ich trotzdem noch kein Jünger. Denn es fehlt uns noch viel, dass wir nicht Gottes verlustig werden.</p>
      <h2>6</h2><p>1. Ich ermahne euch also, doch nicht ich, sondern die Liebe Jesu Christi: genießet bloß die christliche Speise, enthaltet euch fremder Kost, das heißt der Irrlehre. 2. Denn die, welche sich selbst mit Jesus Christus verknüpfen, damit sie glaubwürdig erscheinen, gleichen denen, die tödliches Gift dem süßen Wein beimischen; das nimmt der Ahnungslose gerne in verderblicher Lust: es ist sein Tod.</p>
      <h2>7</h2><p>1. Hütet euch also vor solchen. Das wird bei euch der Fall sein, wenn ihr nicht aufgeblasen seid und euch nicht trennet von Gott Jesus Christus, vom Bischof und von den Vorschriften der Apostel. 2. Wer sich innerhalb der Opferstätte befindet, ist rein; wer aber außerhalb steht, ist nicht rein; das heißt: wer ohne Bischof, ohne Presbyterium und Diakon etwas tut, der ist nicht rein in seinem Gewissen.</p>
      <h2>8</h2><p>1.. Nicht als ob ich etwas solches bei euch entdeckt hätte (schreibe ich dies); vielmehr will ich euch, meine Geliebten, zum voraus schützen, da ich die Anschläge des Teufels vorhersehe. Nehmet also Sanftmut an und befestigt euch von neuem im Glauben, das bedeutet das Fleisch des Herrn, und in der Liebe, das bedeutet das Blut Jesu Christi. 2. Keiner von euch soll etwas haben gegen seinen Nächsten. Gebet den Heiden keinen Anstoß, damit nicht wegen des Unverstandes weniger die ganze Gemeinde Gottes in Verruf komme. Denn wehe dem, der schuld ist, dass wegen nichts bei einigen mein Name gelästert wird.</p>
      <h2>9</h2><p>1. Verstopfet daher eure Ohren, sobald euch einer Lehren bringt ohne Jesus Christus, der aus dem Geschlechte Davids, der aus Maria stammt, der wahrhaft geboren wurde, aß und trank, wahrhaft verfolgt wurde unter Pontius Pilatus, wahrhaft gekreuzigt wurde und starb vor den Augen derer, die im Himmel, auf der Erde und unter der Erde sind, 2. der auch wahrhaft auferweckt wurde von den Toten, da ihn sein Vater auferweckte; denn nach diesem Vorbild wird uns, die wir ihm glauben, sein Vater auch so auferwecken in Christus Jesus, ohne den wir das wahre Leben nicht haben.</p>
      <h2>10</h2><p>Wenn aber einige Gottlose, das heißt Ungläubige behaupten, es sei nur Schein, dass er (= Jesus Christus) gelitten hat, da sie doch selbst nur Schein sind: warum bin ich dann gefesselt, warum sehne ich mich dann nach dem Kampf mit den wilden Tieren? - Umsonst also sterbe ich. Also rede ich die Unwahrheit über den Herrn.</p>
      <h2>11</h2><p>1. Fliehet also die bösen Auswüchse, die tödliche Frucht hervorbringen; wer davon genießt, wird sogleich sterben. Denn diese sind nicht die Pflanzung des Vaters. 2. Denn wenn sie es wären, dann würden sie als Äste des Kreuzes sich zeigen, und dann wäre ihre Frucht unvergänglich; durch diese nämlich ruft er euch zu sich in seinem Leiden, die ihr seine Glieder seid. Unmöglich kann ein Kopf geboren werden ohne die Glieder, da Gott (die) Einheit verspricht, was er selbst ist.</p>
      <h2>12</h2><p>1. Ich grüße euch von Smyrna aus zugleich mit den Kirchen Gottes, die bei mir sind, die mich in jeder Hinsicht erquickt haben, dem Fleische und dem Geiste nach. 2. Meine Fesseln, die ich um Jesu Christi willen trage, voll Sehnsucht, Gottes teilhaftig zu werden, meine Fesseln mahnen euch: verharret in eurer Eintracht und im gemeinsamen Gebet. Denn für jeden einzelnen aus euch, vornehmlich aber für die Presbyter gehört es sich, dem Bischof Freude zu machen zur Ehre des Vaters, Jesu Christi und der Apostel. 3. Ich wünsche, dass ihr in Liebe mich anhöret, damit ich mit meinem Schreiben nicht zum Zeugnis sei wider euch. Betet auch für mich, der ich eurer Liebe bedarf bei der Erbarmung Gottes, damit ich des Anteils gewürdigt werde, den zu erlangen mir gar sehr angelegen ist, damit ich nicht unwert befunden werde.</p>
      <h2>13</h2><p>1. Es grüßt euch die Liebe (= Gemeinde) der Smyrnäer und Epheser. Gedenket in euren Gebeten der Kirche in Syrien, der anzugehören ich, der geringste von ihnen, nicht würdig bin. 2. Lebet wohl in Jesus Christus, im Gehorsam gegen den Bischof wie gegen (Gottes) Gebot, im Gehorsam gleicherweise gegen das Presbyterium. Und liebet alle einander in ungeteiltem Herzen. 3. Meine Seele opfert sich für euch nicht nur jetzt, sondern auch wenn ich zu Gott gelangt bin. Noch bin ich nämlich in Gefahr; aber der Vater ist getreu in Jesus Christus, mein und euer Gebet zu erhören; in ihm möget ihr ohne Tadel erfunden werden.</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_Рим"
    path: "IgnAnt_Rom"
    title: "An die Römer"
    meta_desc: "An die Römer des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Römer", priority: 4 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Römer.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), an die Kirche, die Gottes Barmherzigkeit erfahren in der Herrlichkeit des höchsten Vaters und Jesu Christi, seines einzigen Sohnes, die geliebt und erleuchtet ist im Willen dessen, der alles Seiende gewollt hat, gemäß der Liebe Jesu Christi, unseres Gottes, die auch den Vorsitz führt am Orte des römischen Bezirkes, die Gottes würdig, ehrwürdig, preiswürdig, lobwürdig, des Erfolges würdig, keusch und Vorsteherin ist des Liebesbundes, die das Gesetz Christi hat, des Vaters Namen führt, die ich auch grüße im Namen Jesu Christi, des Sohnes des Vaters; denen, die dem Fleische und dem Geiste nach eins sind in jeglichem Gebot desselben, die unzertrennlich erfüllt sind mit der Gnade Gottes und völlig gereinigt sind von jeglicher fremden Farbe, sage ich herzlichen, vollkommenen Gruß in Jesus Christus, unserem Gott.</p>
      <h2>1</h2><p>1. Durch mein Gebet habe ich es bei Gott erlangt, euer gottwürdiges Angesicht zu schauen; wie ich auch sehr um dieses Glück gefleht habe: denn gefesselt in Christus Jesus, hoffe ich euch zu begrüßen, wofern es (sein) Wille ist, dass er mich würdigt, ans Ziel zu gelangen. 2. Der Anfang hat sich nämlich gut gestaltet, wenn ich die Gnade bekomme dazu, dass ich mein Los unbehindert erlange. Ich fürchte mich nämlich vor eurer Liebe, sie möchte mir zum Schaden sein. Euch geht leicht, was ihr tun wollt; mir aber geht es schwer, Gottes teilhaftig zu werden, wenn ihr nicht schonende Rücksicht auf mich nehmet.</p>
      <h2>2</h2><p>1. Denn mein Wunsch ist es, dass ihr nicht den Menschen, sondern Gott gefallt, wie ihr ihm auch wohlgefällig seid. Denn weder werde ich nochmals eine solche Gelegenheit, zu Gott zu kommen, finden, noch werdet ihr, wenn ihr schweiget, auf bessere Werke euren Namen setzen können. Denn wenn ihr von mir schweiget, bin ich Gottes Wort; wenn ihr aber mein (Leben im) Fleisch liebet, werde ich wieder bloß ein (leerer) Schall sein. 2. Erweiset mir damit den größten Gefallen, dass ich Gott geopfert werde, solange der Altar noch bereit steht, auf dass ihr in Liebe einen Chor bildet und dem Vater lobsinget in Christus Jesus, weil Gott den Bischof von Syrien zu finden sich gewürdigt hat und ihn vom Osten nach dem Westen sich herbeigeholt hat. Es ist schön, von der Welt unterzugehen zu Gott, damit ich bei ihm auferstehe.</p>
      <h2>3</h2><p>1. Ihr seid nie auf jemand neidisch gewesen; andere habt ihr belehrt. Ich wünsche, dass, was ihr gelehrt und eingeschärft habt, auch fest haften bleibe. 2. Erflehet mir nur Kraft nach innen und nach außen, damit ich nicht nur rede, sondern auch wolle, damit ich nicht nur Christ heiße, sondern auch als solchen mich erweise. Wenn ich nämlich (als solcher) erfunden werde, dann kann ich auch so genannt werden, und dann kann ich getreu sein, wenn ich für die Welt nicht mehr zu sehen bin. 3. Nichts ist gut, was (hier) sichtbar ist. Denn unser Gott Jesus Christus erscheint viel herrlicher, seitdem er wieder beim Vater ist. Das Christentum ist nicht das Werk der Überredung, sondern der (inneren) Größe, solange es von der Welt gehasst wird.</p>
      <h2>4</h2><p>1. Ich schreibe an alle Kirchen und teile allen mit, dass ich gerne für Gott sterbe, wenn ihr es nicht verhindert. Ich flehe zu euch, dass euer Wohlwollen mir keine Schwierigkeit bereite. Lasst mich eine Speise der wilden Tiere werden; durch sie ist es mir möglich, zu Gott zu kommen. Brotkorn Gottes bin ich, und durch die Zähne der Tiere werde ich gemahlen, damit ich als reines Brot Christi erfunden werde. 2. Lieber schmeichelt den Tieren, damit sie mir zum Grabe werden und nichts von meinem Körper übrig lassen, auf dass ich niemand lästig falle, wenn ich entschlafen bin. Dann werde ich wahrhaft Jesu Christi Jünger sein, wenn die Welt auch meinen Leib nicht mehr sieht. Betet für mich zu Christus, auf dass ich durch diese Werkzeuge als Opfer für Gott erfunden werde. 3. Nicht wie Petrus und Paulus befehle ich euch. Jene waren Apostel, ich bin ein Verurteilter; jene waren frei, ich bin bis zur Stunde ein Sklave. Aber wenn ich gelitten habe, werde ich Freigelassener Jesu Christi sein und werde in ihm auferstehen, ein Freier. Jetzt lerne ich, in den Fesseln wunschlos zu sein.</p>
      <h2>5</h2><p>1. Von Syrien bis nach Rom bestehe ich den Tierkampf zu Wasser und zu Lande, bei Tag und Nacht, gefesselt an zehn Leoparden, das heißt an eine Abteilung Soldaten; diese werden sogar auf empfangene Wohltaten hin noch schlimmer. Unter ihren Unbilden werde ich besser geschult, aber deshalb bin ich nicht gerechtfertigt. 2. Freuen will ich mich auf die Tiere, die für mich bereit gehalten werden, und ich bete, dass sie sich scharf gegen mich zeigen; ich will sie noch locken, dass sie mich sogleich aufzehren, nicht dass sie, wie es bei einigen (geschah), aus Furcht nicht anpacken. Und wenn sie widerspenstig sind und nicht wollen, werde ich sie mit Gewalt dazu zwingen. 3. Verzeiht mir; was mir zum Vorteil ist, weiß ich. Jetzt fange ich an, ein Jünger zu sein. Nichts möge sich um mich bemühen von dem Sichtbaren noch von dem Unsichtbaren, damit ich zu Jesus Christus gelange. Feuer, Kreuz, Kämpfe mit wilden Tieren, Zerschneidungen, Zerteilungen, Zerschlagen der Gebeine, Verzerrung der Glieder, Zermalmung des ganzen Körpers, des Teufels böse Plagen sollen über mich kommen, nur damit ich zu Jesus Christus gelange.</p>
      <h2>6</h2><p>1. Mir werden nichts nützen die Enden der Erde noch die Königreiche dieser Welt. Für mich ist es besser, durch den Tod zu Christus Jesus zu kommen, als König zu sein über die Grenzen der Erde. Ihn suche ich, der für uns gestorben ist; ihn will ich, der unseretwegen auferstanden ist. Mir steht die Geburt bevor. 2. Verzeihet mir, Brüder; hindert mich nicht, das Leben zu gewinnen, wollet nicht meinen Tod, gönnet mich, da ich Gottes eigen sein will, nicht der Welt und täuschet (mich) nicht mit Irdischem; lasset mich reines Licht empfangen. Wenn ich dort angelangt bin, werde ich ein Mensch sein. 3. Gönnet mir, ein Nachahmer zu sein des Leidens meines Gottes. Wenn ihn jemand in sich hat, so bedenke er, was ich will, und leide mit mir, da er meine Bedrängnis kennt.</p>
      <h2>7</h2><p>1. Der Fürst dieser Welt will mich rauben und meinen auf Gott gerichteten Willen verderben. Deshalb darf keiner von euch, die dabei sind, ihm helfen. Ergreifet vielmehr für mich, das heißt für Gott, Partei! Führet nicht Jesus Christus im Munde, während ihr nach der Welt verlangt. 2. Neid soll nicht unter euch herrschen. Wenn ich unter euch weilend euch um etwas bitte, gehorchet mir nicht; folget lieber dem, was ich euch schreibe. Lebend nämlich schreibe ich euch, voll Sehnsucht nach dem Tode. Meine Liebe (zur Welt) ist gekreuzigt, und in mir ist kein Feuer, das nach Sinnlichem (glüht). Aber lebendes Wasser und redendes ist in mir, das im Innern zu mir spricht: Auf zum Vater! 3. Ich habe keine Freude an vergänglicher Speise noch auch an den Vergnügungen dieses Lebens. Gottes Brot will ich, das ist das Fleisch Jesu Christi, der aus dem Samen Davids (stammt), und als Trank will ich sein Blut, das unvergängliche Liebe ist.</p>
      <h2>8</h2><p>1. Ich will nicht mehr nach Menschenweise leben; dieser Wunsch geht in Erfüllung, wenn ihr wollt. Zeiget (diesen) guten Willen, damit auch ihr guten Willen findet. 2. Mit ein paar Buchstaben bitte ich euch: Glaubet mir. Jesus Christus wird dies euch kundtun, dass ich die Wahrheit sage, (er,) der lügenlose Mund, durch den der Vater die Wahrheit gesprochen. 3. Betet für mich, dass ich ans Ziel gelange. Nicht dem Fleische nach habe ich euch geschrieben, sondern dem Willen Gottes entsprechend. Wenn ich leide, habt ihr es gut mit mir gemeint; wenn ich verworfen werde, habt ihr mich gehasst.</p>
      <h2>9</h2><p>1. Gedenket in eurem Gebete der Kirche von Syrien, deren Hirte an meiner Statt Gott ist. Jesus Christus allein wird ihr Bischof sein und - eure Liebe. 2. Ich aber muss mich schämen, zu ihren Mitgliedern zu zählen; denn ich verdiene es nicht, da ich der letzte unter ihnen bin und eine Fehlgeburt; aber durch (Gottes) Erbarmung bin ich etwas, wenn ich zu Gott gelangt bin. 3. Meine Seele grüßt euch und die Liebe der Kirchen, die mich aufgenommen haben im Namen Jesu Christi, nicht wie einen (gewöhnlichen) Durchreisenden. Denn auch die, die nicht an meinem Wege - den ich dem Fleische nach mache - liegen, haben mir von Stadt zu Stadt das Geleite gegeben.</p>
      <h2>10</h2><p>1. Ich schreibe euch dies von Smyrna aus durch die preiswürdigen Epheser. Es ist bei mir außer vielen anderen auch Krokus, der mir teure Name. 2. Von denen, die vor mir zur Ehre Gottes von Syrien nach Rom gekommen sind, nehme ich an, dass ihr sie erkannt habet; saget ihnen auch, dass ich nicht mehr ferne bin. Alle sind sie nämlich Gottes und eurer würdig; sie in allem zu erquicken, steht euch wohl an. Ich schrieb euch dieses am 24. August. Lebet wohl bis ans Ende in der Geduld Jesu Christi!</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_Фл"
    path: "IgnAnt_Philad"
    title: "An die Philadelphier"
    meta_desc: "An die Philadelphier des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Philadelphier", priority: 5 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Philadelphier.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (genannt wird), an die Kirche Gottes des Vaters und des Herrn Jesu Christi, die in Philadelphia in Asien sich befindet, begnadigt und gefestigt in Eintracht mit Gott, die ohne Aufhören frohlockt im Leiden unseres Herrn und die in seiner Auferstehung vollendet ist in jeglicher Barmherzigkeit, die ich grüße im Blute Jesu Christi, die meine ewige und bleibende Freude ist, besonders wenn sie eins ist mit ihrem Bischof und seinen Presbytern und den nach Jesu Christi Willen eingesetzten Diakonen, die er nach seinem eigenen Willen in Festigkeit gestärkt hat durch seinen Heiligen Geist.</p>
      <h2>1</h2><p>1. Von diesem Bischof habe ich erfahren, dass er nicht von sich aus und auch nicht durch Menschen noch auch aus Ehrgeiz sein über die Gesamtheit ausgedehntes Amt sich erworben hat, sondern in der Liebe Gottes des Vaters und des Herrn Jesus Christus. Ich staune über seine Zurückhaltung, der durch Schweigen mehr vermag als die, welche Eitles reden. 2. Er stimmt nämlich überein mit den Geboten (Gottes) wie die Zither mit den Saiten. Deshalb preise ich von Herzen seine auf Gott gerichtete Gesinnung, die ich als tugendhaft und vollkommen erkannt habe, seine Standhaftigkeit und Sanftmut in jeglicher Milde des lebendigen Gottes.</p>
      <h2>2</h2><p>1. Als Kinder des Lichtes der Wahrheit fliehet die Spaltung und die schlimmen Lehren; wo immer der Hirte ist, dorthin folget wie die Schafe. 2. Denn viele Wölfe, die vertrauenswürdig (scheinen), fangen durch böse Lust die Gottsucher weg. Wenn ihr aber einig seid, haben diese keinen Erfolg.</p>
      <h2>3</h2><p>1. Hütet euch vor den schlimmen Pflanzen, die Jesus Christus nicht anbaut, weil sie keine Pflanzung des Vaters sind; nicht weil ich bei euch eine Spaltung gefunden hätte, vielmehr fand ich Reinigung. 2. Denn alle, die Gott und Jesus Christus angehören, stehen auf Seiten des Bischofs; und alle, die Busse tun und zur Einheit der Kirche kommen, auch diese werden Gott angehören, damit sie das Leben haben gemäß Jesus Christus. 3. Lasset euch nicht irreführen, meine Brüder; wer einem Abtrünnigen (Schismatiker) folgt, wird das Reich Gottes nicht erben; wer in einer falschen Lehre dahinwandelt, der hat keinen Anteil am Leiden (Christi).</p>
      <h2>4</h2><p>Bemühet euch, nur <strong>eine</strong> Eucharistie zu feiern; denn es ist nur <strong>ein</strong> Fleisch unseres Herrn Jesu Christi und nur <strong>ein</strong> Kelch zur Einigung mit seinem Blute, nur <strong>ein</strong> Altar, wie nur <strong>ein</strong> Bischof ist in Verbindung mit dem Presbyterium und (den) Diakonen, meinen Mitknechten, auf dass, was immer ihr tuet, ihr tuet gemäß dem Willen Gottes.</p>
      <h2>5</h2><p>1. Meine Brüder, ich bin gar sehr ausgegossen in Liebe zu euch, und in lauter Frohlocken bestärke ich euch; doch nicht ich, sondern Jesus Christus, in dem gefesselt ich gar große Besorgnis habe, da ich noch nicht vollendet bin. Aber euer Gebet wird mich vollkommen machen für Gott, auf dass ich das Los erlange, in dem mir Erbarmung zuteil geworden, da ich zum Evangelium meine Zuflucht nahm als zum Fleische Jesu und zu den Aposteln als dem Presbyterium der Kirche. 2. Lieben wir aber auch die Propheten, weil auch ihre Lehre auf das Evangelium hingerichtet ist und weil sie auf ihn hoffen und ihn erwarten; im Glauben an ihn sind sie auch gerettet worden, in Einheit mit Jesus Christus verbunden, liebe und bewunderungswürdige Heilige, von <s144> Jesus Christus beglaubigt und mitgezählt in dem Evangelium der gemeinsamen Hoffnung.</s144></p>
      <h2>6</h2><p>1. Wenn aber bei euch einer judaistische Lehren verkündigt, so höret nicht auf ihn! Denn es ist besser, von einem Beschnittenen das Christentum zu hören, als von einem Unbeschnittenen judaistische Lehren. Wenn aber beide nichts von Jesus Christus reden, dann sind sie für mich wie Grabsäulen und Totenkammern, auf denen nur Namen von Menschen eingeschrieben sind. 2. Fliehet also die schlimmen Kunstgriffe und die Arglist des Fürsten dieser Welt, damit ihr nicht durch seinen Plan in Trübsal kommet und in der Liebe schwach werdet; kommet vielmehr alle an einem Orte zusammen in ungeteiltem Herzen. 3. Ich danke meinem Gott, dass ich euretwegen ein gutes Gewissen habe und dass keiner, weder heimlich noch öffentlich, damit prahlen kann, dass ich im Kleinen oder im Großen ihm zur Last gewesen sei. Und allen, zu denen ich gesprochen habe, wünsche ich, sie mögen (meine Worte) nicht aufgenommen haben zum Zeugnis (gegen sich).</p>
      <h2>7</h2><p>1. Wenn mich auch einige dem Fleische nach irreführen wollten, so lässt sich doch der Geist nicht irreführen, da er von Gott ist. Denn er weiß, woher er kommt und wohin er geht, und das Verborgene untersucht er. Ich schrie in ihrer Mitte, ich rief mit lauter Stimme, mit Gottes Stimme: Haltet euch an den Bischof, das Presbyterium und die Diakonen. 2. Wenn aber einige vermuteten, ich hätte so gesprochen, weil ich vorher von der Spaltung einiger gehört hätte, so ist mir der, in dem ich die Fesseln trage, Zeuge, dass ich von menschlichem Fleische es nicht wusste. Aber der Geist hatte es mir kund getan, indem er also sprach: Ohne Bischof tuet nichts, euer Fleisch bewahret als einen Tempel Gottes, die Eintracht liebet, die Spaltungen fliehet, werdet Nachahmer Jesu Christi, wie auch er selbst seines Vaters (Nachahmer ist).</p>
      <h2>8</h2><p>1. Ich habe nun das Meinige getan als ein Mensch, der zur Einheit veranlagt ist. Wo aber Spaltung herrscht und Erbitterung, da wohnt Gott nicht. Allen Reuigen jedoch vergibt der Herr, wenn sie sich bekehren zur Einheit mit Gott und zur Vereinigung mit dem Bischof. Ich vertraue der Gnade Jesu Christi, der jede Fessel von euch nehmen wird. 2. Ich ermahne euch, nichts aus Streitsucht zu tun, sondern gemäß der Lehre Christi. Da ich einige sagen hörte: wenn ich etwas nicht in den Urkunden, in dem Evangelium finde, glaube ich nicht; und als ich ihnen erwiderte, dass es geschrieben steht, gaben sie mir zur Antwort: dies steht ja in Frage. Mir aber ist Urkunde Jesus Christus; mir sind die unversehrten Urkunden sein Kreuz, sein Tod, seine Auferstehung und der durch ihn begründete Glaube; in diesen will ich durch euer Gebet gerechtfertigt werden.</p>
      <h2>9</h2><p>1. Gut waren auch die Priester (des Alten Bundes), besser ist der Hohepriester (= Jesus Christus), der das Allerheiligste erhalten hat, dem allein die Geheimnisse Gottes anvertraut sind; er ist der Zugang zum Vater, durch den Abraham, Isaak, Jakob, die Propheten, die Apostel und die Kirche Zutritt haben. All das dient zur Vereinigung (der Menschen) mit Gott. 2. Etwas Besonderes aber hat das Evangelium, nämlich die Ankunft des Erlösers, unseres Herrn Jesus Christus, sein Leiden und seine Auferstehung. Die Weissagungen der geliebten Propheten gehen auf ihn; das Evangelium aber ist die Vollendung der Unvergänglichkeit. Alles miteinander ist gut, wenn ihr in Liebe glaubet.</p>
      <h2>10</h2><p>1. Da mir gemäß eurem Gebet und entsprechend der innigen Teilnahme, die ihr in Christus Jesus hegt, <s146> gemeldet wurde, dass die Kirche von Antiochien in Syrien wieder Friede hat, geziemt es sich für euch als einer Kirche Gottes, einen Diakon zu erwählen und ihn dorthin als eine Gesandtschaft Gottes zu schicken, auf dass er mit ihnen in gemeinsamer Versammlung sich freue und den Namen (Gottes) preise. 2. Glücklich in Christus Jesus, der eines solchen Auftrags gewürdigt wird, und auch euch wird es zum Ruhme sein. Wenn ihr guten Willen habt, ist es nicht unmöglich, dies für den Namen Gottes zu tun, wie ja auch die nächst gelegenen Kirchen teils Bischöfe, teils Presbyter und Diakone gesandt haben.</s146></p>
      <h2>11</h2><p>1. Was aber Philo betrifft, den Diakon aus Kilikien, einen Mann von bestem Leumund, der auch jetzt mir dient in Gottes Wort zugleich mit Rheus Agathopus, einem auserlesenen Mann, der mir von Syrien her folgt, nachdem er auf das Leben verzichtet hatte, die auch euch ein gutes Zeugnis geben, so sage auch ich Gott Dank für euch, weil ihr sie aufgenommen habt, wie auch euch der Herr (aufnehmen möge). Wer sie aber missachtet hat, möge Verzeihung finden in der Gnade Jesu Christi. 2. Es grüßt euch die Liebe der Brüder von Troja, von wo aus ich euch schreibe durch Burrus, der von den Ephesern und Smyrnäern mir ehrenhalber zum Geleite mitgeschickt wurde. Der Herr Jesus Christus wird sie ehren, auf den sie hoffen in Fleisch, Seele, Geist, Glaube, Liebe, Eintracht. Lebet wohl in Christus Jesus, unserer gemeinsamen Hoffnung!</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_См"
    path: "IgnAnt_Smyrn"
    title: "An die Smyrnäer"
    meta_desc: "An die Smyrnäer des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An die Smyrnäer", priority: 6 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An die Smyrnäer.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), der Kirche Gottes des Vaters und des geliebten Jesus Christus, die Erbarmen gefunden in jeglicher Gnadengabe, die vollendet ist in Glaube und Liebe, die keiner Gnadengabe ermangelt, der gotteswürdigen und Mutter von Heiligen, die zu Smyrna in Asien ist, herzliche Grüße in untadeligem Geiste und Werke Gottes.</p>
      <h2>1</h2><p>1. Ich preise den Gott Jesus Christus, der euch so weise gemacht hat; ich habe nämlich erkannt, dass ihr vollendet seid in unerschütterlichem Glauben, wie angenagelt mit Leib und Seele an das Kreuz des Herrn Jesus Christus, gefestigt in der Liebe im Blute Christi, vollkommen (im Glauben) an unseren Herrn, den wahrhaftigen Spross aus dem Geschlechte Davids dem Fleische nach, den Sohn Gottes nach dem Willen und der Macht Gottes, wahrhaft geboren aus der Jungfrau und von Johannes getauft, auf dass jegliche Gerechtigkeit von ihm erfüllt würde; 2. wahrhaft unter Pontius Pilatus und dem Vierfürsten Herodes für uns im Fleische (ans Kreuz) genagelt, von dessen Frucht wir (stammen) von seinem gottgepriesenen Leiden, auf dass er für ewige Zeiten durch seine Auferstehung sein Banner erhebe für seine Heiligen und Getreuen, sei es unter den Juden oder unter den Heiden in dem Leibe seiner Kirche.</p>
      <h2>2</h2><p>Dies alles hat er nämlich gelitten unseretwegen, damit wir gerettet werden; und zwar hat er wahrhaft gelitten, wie er sich auch wahrhaft auferweckt hat, nicht wie einige Ungläubige behaupten, er habe nur scheinbar gelitten, da sie selbst nur scheinbar leben; und gemäß ihren Anschauungen wird es ihnen ergehen, wenn sie körperlos und gespensterhaft sind (bei der Auferstehung).</p>
      <h2>3</h2><p>1. Ich nämlich weiß und vertraue darauf, dass er auch nach der Auferstehung derselbe war im Fleische. 2. Und als er zu Petrus und seinen Genossen kam, sprach er zu ihnen: „Fasset (mich) an, betastet mich und sehet, dass ich nicht ein körperloser Geist bin“. Und sogleich betasteten sie ihn und glaubten, da sie in Fühlung gekommen waren mit seinem Körper und seinem Geiste. Deshalb verachteten sie auch den Tod und zeigten sich stärker als der Tod. 3. Nach der Auferstehung aß und trank er mit ihnen wie ein leibhaftiger Mensch, obwohl er dem Geiste nach vereinigt war mit dem Vater.</p>
      <h2>4</h2><p>1. Ich gebe euch hierüber Mahnungen, Geliebte, obwohl ich weiß, dass auch ihr so denket (wie ich es dargelegt habe). Ich warne euch aber vor den Tieren in Menschengestalt, diese dürft ihr nicht nur nicht aufnehmen, sondern womöglich sollt ihr ihnen nicht einmal begegnen, nur beten sollt ihr für sie, ob sie sich vielleicht bekehren, was freilich schwierig ist. Darüber hat die Macht Jesus Christus, unser wahres Leben. 2. Wenn nämlich dies nur zum Scheine von unserem Herrn vollbracht wurde, dann bin auch ich nur zum Scheine gefesselt. Wozu habe auch ich mich gänzlich dem Tode überliefert, fürs Feuer, fürs Schwert, für wilde Tiere? Aber nahe dem Schwerte ist nahe bei Gott, inmitten der wilden Tiere ist inmitten Gottes; einzig im Namen Jesu Christi. Um mit ihm zu leiden, ertrage ich alles, wenn er mir Kraft gibt, der vollkommener Mensch geworden ist.</p>
      <h2>5</h2><p>1. Ihn verleugnen einige aus Unkenntnis, oder besser sie wurden von ihm verleugnet, da sie eher Anwälte des Todes als der Wahrheit sind; diese konnten die Prophezeiungen nicht überzeugen, noch das Gesetz Mosis, ja nicht einmal bis zum heutigen Tage das Evangelium und die Leiden der einzelnen aus uns. 2. Denn auch von uns denken sie ebenso. Was nützt denn ein Mensch mir, wenn er mich zwar lobt, aber meinen Herrn schmäht, indem er nicht zugibt, dass er im Fleische erschienen ist? Wer dies nicht bejaht, hat ihn völlig verleugnet und trägt seine eigene Leiche. 3. Ihre Namen aber, die ungläubigen, glaube ich nicht aufzeichnen zu sollen. Ja ferne sei es von mir, ihrer zu gedenken, bis sie sich bekehrt haben zu dem Leiden, das unsere Auferstehung ist.</p>
      <h2>6</h2><p>1. Niemand lasse sich täuschen; sogar die himmlischen Mächte und die Herrlichkeit der Engel und die sichtbaren und unsichtbaren Herrscher, auch sie müssen des Gerichtes gewärtig sein, wenn sie nicht an das Blut Jesu Christi glauben. Wer es fassen kann, der fasse es! Keinen blähe seine Stellung auf; das Ganze nämlich ist Glaube und Liebe; diese übertrifft nichts. 2. Lernet sie kennen, die Sonderlehren aufstellen über die Gnade Jesu Christi, die zu uns gekommen ist, wie sehr sie dem Willen Gottes entgegen sind! Um die (Nächsten-) Liebe kümmern sie sich nicht, nicht um die Witwe, nicht um die Waise, nicht um den Bedrängten, nicht um den Gefangenen oder Freigegebenen, nicht um den Hungernden und Dürstenden.</p>
      <h2>7</h2><p>1. Von der Eucharistie und dem Gebete halten sie &lt;150&gt; sich ferne, weit sie nicht bekennen, dass die Eucharistie das Fleisch unseres Erlösers Jesus Christus ist, das für unsere Sünden gelitten hat und das der Vater in seiner Güte auferweckt hat. Die nun reden wider die Gabe Gottes, die sterben in ihrer Streitsucht. Besser wäre für sie die Liebe, auf dass sie auch auferstehen. 2. So ist es passend, von solchen sich fern zu halten und weder einzeln noch gemeinsam von ihnen zu reden, dagegen sich an die Propheten zu halten, ganz besonders aber an das Evangelium, in dem uns das Leiden geoffenbart und die Auferstehung klar dargelegt ist. Die Spaltungen fliehet als den Anfang der Übel!</p>
      <h2>8</h2><p>1. Alle sollt ihr dem Bischof gehorchen wie Jesus Christus dem Vater, und auch dem Presbyterium wie den Aposteln; die Diakonen aber ehret wie Gottes Anordnung. Keiner tue ohne den Bischof etwas, das die Kirche angeht. Nur jene Eucharistie gelte als die gesetzmäßige, die unter dem Bischof vollzogen wird oder durch den von ihm Beauftragten. 2. Wo immer der Bischof sich zeigt, da sei auch das Volk, so wie da, wo Jesus Christus ist, auch die katholische Kirche ist. Ohne den Bischof darf man nicht taufen noch das Liebesmahl feiern; aber was immer er für gut findet, das ist auch Gott wohlgefällig, auf dass alles, was geschieht, sicher sei und gesetzmäßig.</p>
      <h2>9</h2><p>1. Übrigens ist es angezeigt, zur Einsicht zu kommen und, solange es noch Zeit ist, sich zu Gott zu bekehren. Es ist gut, Gott und den Bischof zu kennen. Wer den Bischof ehrt, der wird von Gott geehrt; wer ohne des Bischofs Wissen etwas tut, der dient dem Teufel. 2. Alles möge also euch in Gnade reichlich zuteil werden; denn ihr seid’s wert. In allem habt ihr mich erquickt und euch Jesus Christus. Ob ich abwesend oder da war, ihr habt mir eure Liebe erzeigt. Vergelte es euch Gott, dem zulieb ihr alles ertraget und zu dem ihr gelangen werdet.</p>
      <h2>10</h2><p>1. Dass ihr den Philo und den Rheus Agathopus, die mir um Gottes willen gefolgt sind, wie Diakonen Christi des Gottes aufgenommen habt, daran habt ihr gut getan; sie danken auch dem Herrn für euch, weil ihr sie auf jegliche Weise erquickt habt. Nichts wird euch verloren gehen. 2. Als Entgelt für euch (gebe ich) meinen Geist und meine Fesseln, die ihr nicht verachtet, deren ihr euch nicht geschämt habt. Auch eurer wird sich nicht schämen der vollkommene Glaube, Jesus Christus.</p>
      <h2>11</h2><p>1. Euer Gebet ist gedrungen bis zur Kirche von Antiochien in Syrien, von wo ich (komme), gefesselt mit den Gott angenehmsten Fesseln, und alle grüße, obwohl ich nicht wert bin, von dort zu sein, da ich der geringste von ihnen bin; aber durch (Gottes) Willen wurde ich für würdig befunden, nicht aus Selbstbewusstsein, sondern durch Gottes Gnade, die mir vollkommen zuteil werden möge, damit ich durch euer Gebet zu Gott gelange. 2. Auf dass nun euer Werk vollkommen werde auf Erden wie im Himmel, ist es geziemend, dass eure Kirche zu Gottes Ehre einen Gottgesandten wähle, dass er bis nach Syrien reise und sie beglückwünsche, dass sie (wieder) in Frieden sind und die ihnen eigene Größe wiedererlangt haben und ihnen der rechtmäßige Körper (= die richtige Verfassung) wieder hergestellt worden ist. 3. Es dünkt mich also eine würdige Tat, aus eurer Mitte einen Boten mit einem Briefe abzusenden, dass er den nach Gottes Wille ihnen gegebenen Frieden mitverherrliche und dass sie (= die Kirche) auf euer Gebet hin bereits den Hafen erreicht hat. Ihr seid vollkommen, sinnet auch auf Vollkommenes. Denn wenn ihr gewillt seid, Gutes zu tun, ist Gott zum Geben bereit.</p>
      <h2>12</h2><p>1. Es grüßt euch die Liebe der Brüder in Troas, von wo aus ich euch schreibe durch Burrus, den ihr zugleich mit den Ephesern, euren Brüdern, zu meiner Begleitung abgeordnet habt und der mich in allen Stücken erfreut hat. Dass doch alle ihn nachahmten, da er ein Vorbild ist im Dienste Gottes! Die Gnade wird ihn entlohnen in allem. 2. Ich grüße den gotteswürdigen Bischof und das gottgefällige Presbyterium und meine Mitknechte, die Diakonen, jeden einzelnen und alle insgesamt im Namen Jesu Christi und in seinem Fleische und Blute, seinem Leiden und seiner Auferstehung im Fleische und im Geiste, in eurer und Gottes Einheit. Gnade sei euch, Barmherzigkeit, Friede, Geduld in allem!</p>
      <h2>13</h2><p>1. Ich grüße die Familien meiner Brüder mit ihren Frauen und Kindern und den Jungfrauen, die man „Witwen“ nennt. Lebt mir wohl in Kraft des Geistes. Es grüßt euch Philo, der bei mir ist. 2. Ich grüße das Haus der Tavia, der ich wünsche, dass sie gefestigt werde in Glaube und Liebe, der fleischlichen wie der geistigen. Ich grüße Alke, den mir teuren Namen, und Daphnus den Unvergleichlichen, und Euteknus und alle, Name für Name. Lebet wohl in Gottes Gnade!</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "ИгнАн_Пк"
    path: "IgnAnt_Pol"
    title: "An Polykarp"
    meta_desc: "An Polykarp des Ignatius von Antiochien, deutsche Übersetzung von Franz Zeller (1918)."
    menu: { parent: "1. Jahrhundert/Ignatius von Antiochien", title: "An Polykarp", priority: 7 }
    update: true
    body: |-
      <p><em>Ignatius von Antiochien, An Polykarp.</em></p>

      <h2>0</h2><p>Ignatius, der auch Theophorus (heißt), grüßt vielmals Polykarp, den Bischof der Kirche von Smyrna, der vielmehr selbst wieder als Bischof über sich hat Gott Vater und den Herrn Jesus Christus.</p>
      <h2>1</h2><p>1. Nachdem ich deinen auf Gott gerichteten Sinn, der wie in einem unbeweglichen Felsen gefestigt ist, vernommen habe, bin ich voll Rühmens, dass ich deines unsträflichen Antlitzes gewürdigt wurde, an dem ich mich in Gott erfreuen möchte. 2. Bei der Gnade, mit der du angetan bist, ermahne ich dich, deinen Lauf zu beschleunigen und alle zu ermuntern, dass sie gerettet werden. Verteidige deinen Posten in jeglicher Sorgfalt, fleischlicher wie geistiger; sorge für die Einheit, das Beste von allem. Alle ertrage, wie auch dich der Herr; ertrage alle in Liebe, wie du ja auch tust. 3. Dem Gebete widme dich ohne Unterlass; bitte um größere Einsicht, als du hast. Wache, ausgerüstet mit einem schlaflosen Geiste. Mit jedem einzelnen rede nach Gottes Art; trage die Krankheiten aller als vollkommener Held. Wo größere Mühe, ist reicher Lohn.</p>
      <h2>2</h2><p>1. Wenn du nur die guten Schüler lieb hast, bringt es dir keinen Dank; bringe vielmehr die Bösartigen in Sanftmut zur Unterordnung. Nicht jede Wunde wird mit dem gleichen Pflaster geheilt. Fieberanfälle stille durch feuchte Umschläge. 2. Werde klug wie die Schlange in allen Dingen und für immer einfältig wie die Taube. Deshalb bist du fleischlich und geistig, dass du, was dir unter die Augen kommt, freundlich behandelst; bitte, dass das Unsichtbare dir offenbar werde, auf dass dir nichts fehle und du Überfluss habest an jeglicher Gnadengabe. 3. Die Zeit verlangt nach dir, damit du zu Gott gelangest, wie der Steuermann nach dem Winde, wie der vom Sturm Bedrängte nach dem Hafen. Sei nüchtern wie ein Gottesheld; der Preis ist Unvergänglichkeit und ewiges Leben, wovon auch du überzeugt bist. In allem bin ich für dich zum Opfer bereit und meine Ketten, die du lieb gewonnen hast.</p>
      <h2>3</h2><p>1. Die scheinbar Glauben verdienen und die Abweichendes lehren, sollen dich nicht einschüchtern. Stehe fest wie ein Ambos unter den Schlägen (des Hammers). Einem starken Ringkämpfer ist es eigen, dass er Streiche erhält und doch den Sieg erringt. Wir müssen in erster Linie um Gottes willen alles ertragen, damit auch er uns ertrage. 2. Werde noch viel eifriger, als du bist. Lerne die Zeiten kennen. Den erwarte, der über der Zeit ist, den Zeitlosen, den Unsichtbaren, der unseretwegen sichtbar geworden, den Unbetastbaren, den Leidenlosen, der unseretwegen gelitten hat, der auf alle Arten unseretwegen geduldet hat.</p>
      <h2>4</h2><p>1. Witwen dürfen nicht vernachlässigt werden, nach dem Herrn sollst du ihr Schutzherr sein. Nichts soll ohne deinen Willen geschehen, und du sollst nichts tun ohne Gott, wie du es ja auch nicht tust; sei standhaft! 2. Die Versammlungen sollen häufiger stattfinden; suche alle beim Namen. 3. Sklaven und Sklavinnen verachte nicht; aber auch sie selbst sollen sich nichts einbilden, sondern sollen zur Ehre Gottes noch eifriger dienen, damit sie bessere Freiheit von Gott erlangen. Sie sollen nicht danach trachten, auf Gemeindekosten losgekauft zu werden, damit sie nicht als Sklaven der Begierde erfunden werden.</p>
      <h2>5</h2><p>1. Die schlechten Mittel fliehe; handle vielmehr darüber in deinen Reden. Meinen Schwestern sage, sie sollen ihren Herrn lieben und zufrieden sein mit ihren Männern nach Fleisch und Geist. Ähnlicherweise rede meinen Brüdern zu im Namen Jesu Christi, sie sollen ihre Frauen lieben wie der Herr die Kirche. 2. Wenn jemand in Keuschheit zu leben vermag zur Ehre des Fleisches unseres Herrn, so bleibe er so ohne Selbstüberhebung. Wenn er sich rühmt, ist er verloren, und wenn er sich für mehr hält als den Bischof, so ist er dem Verderben verfallen. Es gehört sich, dass Bräutigam und Braut mit Gutheißen des Bischofs die Verbindung eingehen, damit die Ehe sei im Sinne Gottes und nicht nach sinnlicher Begierde. Alles geschehe zu Gottes Ehre.</p>
      <h2>6</h2><p>1. Haltet zum Bischof, damit auch Gott zu euch (halte). Meine Seele setze ich daran für die, die dem Bischof, den Presbytern und den Diakonen untertan sind; möge es mir gegönnt sein, mit ihnen mein Teil zu bekommen bei Gott. Mühet euch miteinander, kämpfet, laufet, leidet, ruhet, wachet miteinander als Verwalter, Genossen und Diener Gottes. 2. Gewinnet die Zufriedenheit eures Kriegsherrn, von dem ihr ja auch den Sold empfanget; keiner werde fahnenflüchtig. Eure Taufe bleibe als Rüstung, der Glaube als Helm, die Liebe als Speer, die Geduld als volle Rüstung. Eure Einlage seien eure Werke, damit ihr würdig euren Lohn empfanget. Übet also Langmut gegenseitig in Milde, wie Gott mit euch. Möge ich immer Freude haben an euch.</p>
      <h2>7</h2><p>1. Da die Kirche von Antiochien in Syrien, wie mir mitgeteilt wurde, auf euer Gebet hin Friede hat, wurde auch ich freudiger gestimmt in sorglosem Vertrauen auf Gott, wenn ich nur durch meine Leiden zu Gott gelange, damit ich bei der Auferstehung als euer Jünger erfunden werde. 2. Es wäre angebracht, gottseliger Polykarp, dass ihr eine gottgefällige Versammlung veranstaltet und einen Mann wählet, den ihr gar sehr liebet, einen unermüdlichen, den man Gottesläufer nennen kann; dass ihr diesen beehret, nach Syrien zu reisen, damit er eure unverdrossene Liebe kund tue zur Ehre Gottes. 3. Ein Christ hat nicht freies Recht über sich selbst, sondern er hat seine Zeit für Gott. Dieses Werk gehört Gott und euch, wenn ihr es vollbringet. Ich habe nämlich das Vertrauen zur Gnade, dass ihr bereit seid zu schöner Tat, die Gott gebührt. Da ich euren Eifer für die Wahrheit kenne, habe ich nur mit wenigen Worten euch ermahnt.</p>
      <h2>8</h2><p>1. Da ich nun allen Kirchen nicht mehr schreiben konnte wegen der plötzlichen Abreise von Troas nach Neapel, wie es (Gottes) Wille gebietet, so schreibe du, da du mit Gottes Gesinnung ausgestattet bist, den vorderen Kirchen, dass auch sie das gleiche tun, dass nämlich die einen, denen es möglich ist, Gesandte, die anderen aber durch die von dir abgeordneten Boten Briefe schicken, damit ihr verherrlicht werdet durch ein bleibendes Werk, wie du es ja verdienst. 2. Ich grüße alle bei Namen, besonders die Frau des Epitropus mit ihrem ganzen Hause und ihren Kindern. Ich grüße meinen geliebten Attalus. Ich grüße den, der die Ehre haben wird, nach Syrien zu reisen. Die Gnade soll mit ihm sein in allem und mit Polykarp, der ihn abschickt. 3. Ich sage euch für immer Lebewohl in unserem Gott Jesus Christus, in dem ihr verharren möget, geeint mit Gott und unter seinen Augen. Ich grüße Alke, den mir lieben Namen. Lebet wohl im Herrn!</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 117–156. Text nach <a href="https://bkv.unifr.ch/works/cpg-1025/versions/die-sieben-briefe-des-ignatius-von-antiochien-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>
