    body: |-
      <p><strong>Gedenktage</strong>: 18. (31.) Januar, 9. (22.) Juni</p>
      <h2>Biografie</h2>
      <p>Cyrill von Alexandrien wurde in Alexandrien geboren und wuchs dort auf als Spross der berühmten Bischofsdynastie. Sein Onkel war Theophilus von Alexandrien, nach dem er 412 auch Vorsteher wurde.</p>
      <p>Als einer der ersten deckte er die Häresie des Nestorius auf; er war Organisator und Hauptakteur des III. Ökumenischen Konzils in Ephesus. Von ihm stammen zahlreiche polemische Werke, die die nestorianische Lehre von Christus widerlegen. Der heilige Cyrill formuliert als erster die Lehre von der Einheit der Hypostase des Erlösers, was von den späteren Monophysiten als Behauptung auch der Einheit seines Wesens ausgelegt wurde. Von ihm stammen auch die Auslegungen der Heiligen Schrift, Erklärungen der Lehre von der Dreieinigkeit, eine Reihe von Briefen theologischen Inhalts.</p>
      <p>Neben der kirchlichen Tätigkeit besaß er auch großen Einfluss auf die weltliche Macht Alexandriens. Daher wird sein Name mit den Episoden der zahlreichen Konflikte zwischen Heiden und Christen verbunden. Unter der Stadtbevölkerung und den Mönchen genoss er unbestreitbare Autorität und nach seinem Tod ein gutes Andenken.</p>
      <p>Der heilige Cyrill leitete die Kirche von Alexandrien 32 Jahre lang: am Ende seiner fruchtbaren Tätigkeit war die Herde von den Häretikern gereinigt.</p>
      <p>Der heilige Cyrill starb im Jahr 444 und hinterließ viele Werke. Besonders hervorzuheben sind die Auslegungen der Evangelien nach Lukas und nach Johannes, der Briefe des Apostels Paulus an die Korinther und an die Hebräer sowie die Apologie zur Verteidigung des Christentums gegen den Kaiser Julian den Abtrünnigen (361–363). Von enormer Bedeutung sind die fünf Bücher gegen Nestorius, das Werk über die Heiligste Dreieinigkeit mit dem Titel „Schatzkammer“, geschrieben gegen Arius und Eunomius, und zwei dogmatische Schriften über die Heiligste Dreieinigkeit, die sich durch die Genauigkeit der Darstellung der orthodoxen Lehre vom Ausgang des Heiligen Geistes auszeichnen. Die Schrift gegen den Anthropomorphismus wurde vom heiligen Cyrill für einige Ägypter geschrieben, die sich in Unwissenheit Gott in menschlicher Gestalt vorstellten. Unter den Werken des heiligen Cyrill finden sich auch die „Reden“, unter denen besonders ergreifend und erbaulich das „Wort über den Ausgang der Seele“ ist, das in den slawischen „Folgepsalter“ aufgenommen wurde.</p>
      <h2>Werke</h2>
      <h3>Exegetische</h3>
      <p>Obwohl der heilige Cyrill viel gegen seine Gegner schreiben musste, ist der Hauptteil seines Erbes nicht polemischer, sondern exegetischen Charakters. Der heilige Cyrill war ein glänzender Kommentator der Bibel und folgte in seinen Auslegungen der allegorischen Methode, was ihn in eine Reihe mit Origenes und anderen Alexandrinern stellt. Doch im Unterschied zu Origenes hielt er nicht alle Einzelheiten der alttestamentlichen Geschichte für geistlich bedeutsam. Auf die historische und philologische Analyse des Textes richtete er wenig Aufmerksamkeit, dafür ist in seinen Auslegungen stets die Polemik mit den Häretikern gegenwärtig.</p>
      <p>Die 17 Bücher Über die Anbetung und den Dienst im Geist und in der Wahrheit, verfasst in Form von Dialogen zwischen dem heiligen Cyrill und Palladius, sind eine allegorische Erklärung einzelner Stellen des Pentateuchs, die nicht in der Reihenfolge ausgewählt sind, in der sie in der Bibel stehen, sondern in der, die dem Autor zur Bestätigung seiner Grundidee am günstigsten ist. Der heilige Cyrill beweist, dass der Buchstabe des Gesetzes aufgehoben ist, der Geist aber nicht, und dass daher die Auslegung alttestamentlicher Texte nicht wörtlich, sondern allegorisch sein muss. Im 1. Buch spricht der heilige Cyrill von der Befreiung des Menschen aus der Knechtschaft der Sünde und des Teufels, im 2. und 3. von der Rechtfertigung durch Christus, im 4.–5. vom menschlichen Willen, im 6.–8. von der Liebe zu Gott und zum Nächsten, im 9.–13. von der Kirche und dem Priestertum, im 14.–16. von der geistlichen Anbetung der Christen und im 17. von den jüdischen Festen, insbesondere von Pascha. Die Abhandlung wurde nach der Bischofsweihe des heiligen Cyrill, aber vor Beginn der antinestorianischen Polemik (412–429) geschrieben.</p>
      <p>Die 13 Bücher der Kunstvollen Auslegungen („Glaphyra“) wurden im selben Lebensabschnitt des Heiligen geschrieben und enthalten ebenfalls eine Erklärung ausgewählter Stellen des Pentateuchs, jedoch in der Reihenfolge, in der sie in der Bibel stehen. In den Büchern 1–7 wird das Buch Genesis erörtert, in 8–10 der Exodus, im 11. das Buch Levitikus, im 12. das Buch Numeri, im 13. das Buch Deuteronomium.</p>
      <p>Die Auslegung des Propheten Jesaja wurde höchstwahrscheinlich nach den exegetischen Werken über den Pentateuch, aber vor 429 verfasst und besteht aus fünf Büchern. Der heilige Cyrill bietet dem Leser eine „doppelte“ Auslegung, die die „Historie“, d. h. den wörtlichen Sinn des Textes, und die „Theoria“ – seine allegorische Erklärung – umfasst.</p>
      <p>Die Auslegung der zwölf Propheten besteht aus 12 Teilen, die in Bände gegliedert sind. Nach einer umfangreichen Einleitung, in der der heilige Cyrill auf die früheren Exegeten hinweist, folgt seine eigene Auslegung, wobei jedem Buch eine eigene Vorrede vorangestellt ist.</p>
      <p>In den Katenen zum Alten Testament sind Fragmente aus anderen Auslegungen des heiligen Cyrill erhalten: zu den Büchern der Könige, den Psalmen und biblischen Cantica, den Sprüchen, dem Hohelied, Jeremia, Ezechiel und Daniel. Fragmente der Auslegungen des heiligen Cyrill zu Ezechiel sind in einer armenischen Handschrift erhalten, die an der Universität Oxford (Bodleian Library) aufbewahrt wird. Die Kommentare des heiligen Cyrill zu den Psalmen erwähnt der Patriarch Photius („Bibliothek“, Nr. 229). In der Literatur finden sich auch Hinweise auf andere biblische Arbeiten des heiligen Cyrill, die uns nicht überliefert sind. Von der Auslegung des Evangeliums nach Matthäus, die der heilige Cyrill nach 428 verfasste, sind nur wenige Fragmente erhalten. Diese Auslegung war Leontius von Byzanz, Ephräm von Antiochien und Facundus von Hermiane bekannt.</p>
      <p>Die Sammlung der Reden über den Evangelisten Lukas ist in einer syrischen Version des 6.–7. Jahrhunderts erhalten, die 156 Reden umfasst, während in griechischer Sprache nur drei Reden vollständig und einige Fragmente überliefert sind. Die Reden enthalten eine deutlich ausgeprägte antinestorianische Polemik, und der Verweis auf die Anathematismen zeigt, dass diese Reden um 430 gehalten wurden.</p>
      <p>Von den 12 Büchern der Auslegungen über den Evangelisten Johannes sind 10 Bücher (1–6, 9–12) vollständig erhalten, zwei (7 und 8) dagegen in Fragmenten, deren Echtheit fraglich ist. Der Kommentar des heiligen Cyrill trägt dogmatisch-polemischen Charakter, worauf der Autor in der Einleitung hinweist. Der heilige Cyrill findet im Evangelium nach Johannes Beweise für die Wesensgleichheit des Sohnes mit dem Vater und widerlegt die Lehren der Arianer und Eunomianer sowie die Christologie der antiochenischen Schule. Der Name des Nestorius sowie der Begriff „Gottesgebärerin“ fehlen in der Auslegung, daher wird angenommen, dass sie vor 429 verfasst wurde.</p>
      <h3>Dogmatisch-polemische und apologetische</h3>
      <p>Die frühen dogmatisch-polemischen Arbeiten des heiligen Cyrill richten sich gegen die Arianer. Die Abhandlung Schatzkammer über die Heilige und wesensgleiche Dreieinigkeit wurde vermutlich zu Beginn des Episkopats des heiligen Cyrill, spätestens 425, geschrieben. Die Abhandlung besteht aus 35 Kapiteln. In der Trinitätslehre folgt der heilige Cyrill seinem Vorgänger, dem heiligen Athanasius dem Großen. Ein Teil der Abhandlung ist die Wiedergabe des 3. Buches des heiligen Athanasius „Gegen die Arianer“. Als eine der Quellen benutzt der heilige Cyrill das Buch des Didymus „Gegen Eunomius“.</p>
      <p>Die Abhandlung Über die Heilige und lebenspendende Dreieinigkeit wurde kurz nach der „Schatzkammer“ verfasst und ist deren Umarbeitung. Die Abhandlung ist dem „Bruder“ Nemesius gewidmet und besteht aus sieben Dialogen des Autors mit dem Freund Hermias: in sechs Dialogen ist vom Sohn die Rede, im siebten vom Heiligen Geist. Die erste antinestorianische Abhandlung – Fünf Bücher gegen Nestorius – wurde um 430 geschrieben. Sie ist eine kritische Auseinandersetzung mit der Sammlung von Predigten, die Nestorius im vorangegangenen Jahr veröffentlicht hatte. Der Name des Nestorius wird im Text nicht erwähnt, jedoch werden Zitate aus seinen Arbeiten angeführt. Im ersten Buch untersucht der heilige Cyrill die Stellen, an denen Nestorius sich dagegen ausspricht, Maria als Gottesgebärerin zu bezeichnen; die vier anderen Bücher sind den zwei Naturen Christi gewidmet.</p>
      <p>Die Abhandlung Über den rechten Glauben, geschrieben 430, besteht aus drei Sendschreiben, die der heilige Cyrill wegen der nestorianischen Häresie an den Kaiserhof sandte. Das erste ist an den Kaiser Theodosius gerichtet, die beiden anderen an Kaiserinnen (ohne Angabe der Namen). Nach der Aussage des Johannes von Cäsarea (6. Jh.) ist das zweite Sendschreiben an die jüngeren Schwestern des Kaisers – Arkadia und Marina – gerichtet, das dritte an die ältere Schwester Pulcheria und die Gemahlin des Kaisers Eudokia.</p>
      <p>Die zwölf Anathematismen gegen Nestorius wurden im selben Jahr 430 im Namen der Synode von Alexandrien verfasst. Der heilige Cyrill war gezwungen, seine Anathematismen in drei Apologien zu verteidigen. Die erste heißt Verteidigung der zwölf Kapitel gegen die östlichen Bischöfe und richtet sich gegen Andreas von Samosata, der den heiligen Cyrill des Apollinarismus und des Monophysitismus beschuldigte. Gegen die Anschuldigungen des Theodoret von Kyrrhos verteidigt sich der heilige Cyrill im Brief an Euoptius, den Bischof von Ptolemais in Libyen, von dem er den Text der Schrift Theodorets gegen die Anathematismen erhalten hatte. Beide Abhandlungen wurden vor dem III. Ökumenischen Konzil geschrieben. Die dritte Abhandlung zur Verteidigung der Anathematismen unter dem Titel Erklärung der zwölf Kapitel wurde im Gefängnis von Ephesus geschrieben, wo der heilige Cyrill im August–September 431 nach dem III. Ökumenischen Konzil weilte.</p>
      <p>Das Verteidigungswort an den Kaiser Theodosius wurde vom heiligen Cyrill unmittelbar nach seiner Rückkehr aus Ephesus nach Alexandrien geschrieben. In diesem Wort verteidigt er seine Handlungen vor dem Konzil von Ephesus und während dessen Verlauf.</p>
      <p>Die Scholien über die Menschwerdung des Eingeborenen wurden nach 431 geschrieben: in ihnen gibt der heilige Cyrill eine Erklärung der Namen Christus, Emmanuel und Jesus, wonach er die hypostatische Einheit der Naturen verteidigt und die Auffassungen von „Vermischung“ und „Verbindung“ zwischen ihnen widerlegt. Die Schrift gegen die Apollinaristen. Der vollständige Text ist in lateinischer, syrischer und armenischer Version erhalten; vom griechischen Original ist nur ein Teil überliefert.</p>
      <p>Im Dialog Darüber, dass Christus einer ist, widerlegt der heilige Cyrill die Lehre, dass das Wort Gottes nicht Fleisch geworden, sondern mit dem Menschen Jesus verbunden sei, so dass die Ehre des Ersteren nicht dem Zweiten zukomme. Der heilige Cyrill verweist auf seine frühe Polemik mit Nestorius und zeigt eine solche Reife des Denkens, dass der in der Antike hoch geschätzte Dialog als eine der späten Arbeiten des heiligen Cyrill erscheint.</p>
      <p>Das kleine Buch gegen die, welche die Heilige Jungfrau nicht als Gottesgebärerin anerkennen wollen, setzt die antinestorianische Polemik fort. Auf diese Abhandlung als auf ein echtes Werk des heiligen Cyrill berief sich 542 der Kaiser Justinian in seinem „Wort gegen die Monophysiten“.</p>
      <p>In der Abhandlung Gegen Diodor und Theodor widerlegt der heilige Cyrill die Doktrin der Lehrer des Nestorius – Diodors von Tarsus und Theodors von Mopsuestia. Die Abhandlung besteht aus drei Büchern: das 1. ist Diodor gewidmet, das 2. und 3. Theodor. Die Abhandlung wurde um 438 geschrieben. Erhalten sind Fragmente in griechischer und lateinischer Version. Auch in Fragmenten ist die Abhandlung Gegen die Anthropomorphiten erhalten.</p>
      <p>Die Abhandlung Gegen die Synusiasten, d. h. gegen die extremen Apollinaristen („Synusie“ – das Zusammenbestehen zweier Naturen), wurde in der späten Lebenszeit des Heiligen verfasst und ist in Auszügen in griechischer und syrischer Sprache erhalten.</p>
      <p>Das monumentale apologetische Werk Über die heilige Religion der Christen gegen den gottlosen Julian wurde zwischen 433 und 441 verfasst, d. h. nach der Versöhnung mit Johannes von Antiochien, aber vor dem Tod des Letzteren, da aus dem 83. Brief des seligen Theodoret hervorgeht, dass der heilige Cyrill dieses Werk an Johannes sandte. Es ist dem Kaiser Theodosius II. gewidmet und enthält eine Widerlegung der Abhandlungen Julians des Abtrünnigen „Gegen die Galiläer“. Julian veröffentlichte 363 drei Abhandlungen unter diesem Titel. Die Vorrede des heiligen Cyrill zeigt, dass das Heidentum zu seiner Zeit noch stark war und die Abhandlungen Julians mit ihren Anschuldigungen gegen die Christen beliebt waren. Erhalten sind nur die ersten zehn Bücher des heiligen Cyrill, in denen er die 1. Abhandlung Julians untersucht und von den Verbindungen zwischen Christentum, Judentum und Heidentum spricht. Fragmente aus dem 11. und 20. Buch, die in griechischer und syrischer Version überliefert sind, zeigen, dass in den Büchern 11–20 von der zweiten Abhandlung Julians die Rede war. J. Newman vermutet, dass der heilige Cyrill in den folgenden Büchern die 3. Abhandlung Julians widerlegte und dass sein Werk insgesamt etwa 30 Bücher umfasste. Doch von den vermuteten Büchern 21–30 ist nichts erhalten: möglicherweise hatte der heilige Cyrill gar nicht die Absicht, alle Abhandlungen Julians zu widerlegen, sondern beschränkte sich nur auf die ersten beiden (Quasten J., S. 129–130).</p>
      <h3>Osterbriefe</h3>
      <p>Wie seine Vorgänger – die heiligen Athanasius, Petrus und Theophilus von Alexandrien – wandte sich der heilige Cyrill jährlich mit einem Sendschreiben über das Datum der Osterfeier an seine Herde. Die Herausgeber der Werke des heiligen Cyrill sammelten 29 Sendschreiben unter dem gemeinsamen Titel Osterreden. Sie wurden zwischen 414 und 442 verfasst und sind vorwiegend moralisch-asketischen Themen gewidmet: dem Fasten und der Enthaltsamkeit, dem Wachen und dem Gebet, den Werken der Wohltätigkeit und der Barmherzigkeit. Erörtert werden auch dogmatische Fragen: in den Reden 5, 8, 17 und 27 verteidigt der heilige Cyrill die Lehre von der Menschwerdung gegen die Arianer und andere Häretiker, die die Ewigkeit des Sohnes leugnen; in der Rede 12 ist von der Heiligen Dreieinigkeit die Rede. In vielen Reden findet sich eine Polemik mit Juden und Heiden.</p>
      <h3>Reden</h3>
      <p>Von den Predigten, die der heilige Cyrill während seiner bischöflichen Dienstzeit in Alexandrien hielt, sind nicht mehr als 22 erhalten, unter denen einige in Fragmenten überliefert sind. Die Herausgeber nannten sie Andere Reden zum Unterschied von den Osterreden (Sendschreiben). Die ersten acht Reden wurden in Ephesus während der Arbeit des III. Ökumenischen Konzils gehalten. Von ihnen wurde die 1. zu Beginn der Konzilsarbeit gehalten, die 2. am Gedenktag des Apostels Johannes des Theologen, die 5. nach der Verurteilung des Nestorius, die 6. nach dem Bruch mit Johannes von Antiochien, die 7. vor der Verhaftung. Die 4. Rede, eine Lobrede auf die heilige Maria, die Gottesgebärerin, gehalten zwischen dem 23. und 27. Juni 431 in der Kirche der Heiligsten Gottesgebärerin in Ephesus, ist die berühmteste Predigt der Antike über die Heiligste Jungfrau Maria: der heilige Cyrill nennt sie „die unauslöschliche Lampe“, „die Krone der Jungfräulichkeit“, „das Zepter der Orthodoxie“, „den unzerstörbaren Tempel“, „das Gefäß des Unfassbaren“ – einige dieser Wendungen gingen später in den Akathistos an die Heiligste Gottesgebärerin ein. In den Reden 3, 15, 16 und 20 ist von der Menschwerdung des Sohnes Gottes die Rede. Die 10. Rede, Über das Mystische Abendmahl, gehört wahrscheinlich Theophilus von Alexandrien; die 11. ist nichts anderes als die 4. Rede, erweitert und ergänzt im 7.–9. Jahrhundert. Die 13., Am Palmsonntag, geht auf Eulogius von Alexandrien zurück. Die berühmte 14. Rede, Über den Ausgang der Seele aus dem Leib und über die Wiederkunft Christi, die im Mittelalter besondere Beliebtheit genoss (sie war im slawischen Folgepsalter enthalten), ist ein Werk von fraglicher Echtheit: in den „Apophthegmata der Väter“ wird sie als Werk des Theophilus von Alexandrien erwähnt. Die 8. Rede, Auf die Verklärung des Herrn, und die 12., Auf die Darstellung des Herrn, gehören zum Korpus der Reden über das Evangelium nach Lukas (siehe oben).</p>
      <h3>Briefe</h3>
      <p>Die Sammlung der Briefe des heiligen Cyrill, gedruckt in der Patrologie des Migne, umfasst 88 Briefe, von denen 17 Briefe anderer sind, die an ihn gerichtet wurden, und einige sind unecht. Die meisten Briefe des heiligen Cyrill werden auf die Zeit nach dem Konzil von Ephesus datiert. Für die Geschichte der Beziehungen zwischen Ost und West ist der Briefwechsel des heiligen Cyrill mit den Päpsten Cölestin und Sixtus von Interesse. Auf die Briefe des heiligen Cyrill beriefen sich später die Ökumenischen Konzile: der 4. Brief, der zweite an Nestorius, wurde auf dem III., IV. und V. Ökumenischen Konzil verlesen. Der 17. Brief, der dritte an Nestorius, enthält eine Schilderung der Akten der Synode von Alexandrien 430. Im 39. Brief, an Johannes von Antiochien, drückt der heilige Cyrill seine Freude über die erfolgte Versöhnung aus: er beginnt mit den Worten „Es freuen sich die Himmel“. Die drei genannten Briefe (4, 17, 39) erhielten wegen ihrer dogmatischen Bedeutung die Bezeichnung „ökumenisch“. Der 76. Brief enthält die Weigerung des heiligen Cyrill, den Namen des Johannes Chrysostomus in die Diptychen einzutragen. Der 80. Brief, der Brief der Hypatia an Cyrill, ist unecht, ebenso wie der 86., der Brief des Cyrill an den Papst Leontius.</p>
      <h2>Hymnographie</h2>
      <p><strong>Tropar an den heiligen Cyrill von Alexandrien, Ton 8</strong></p>
      <blockquote>
      <p>Lehrer der Orthodoxie, / Lehrer der Frömmigkeit und der Reinheit, / Leuchte des Weltalls, / gottinspirierte Zierde der Hierarchen, / weiser Cyrill, / durch deine Lehren hast du alles erleuchtet, / geistliche Flöte, // flehe Christus Gott an, dass unsere Seelen gerettet werden.</p>
      </blockquote>
      <p><strong>Kondak an den heiligen Cyrill von Alexandrien, Ton 6</strong></p>
      <blockquote>
      <p>Einen Abgrund der Lehren der Theologie hast du uns entspringen lassen / offenbar aus den Quellen des Erlösers, / der die Häresien versenkt / und die Herde unversehrt vor den Stürmen rettet, / seliger Cyrill, / denn allen Ländern bist du ein Lehrer, Ehrwürdiger, // da du Göttliches offenbarst.</p>
      </blockquote>
