      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Der Hirte des Hermas</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-1052/versions/der-hirte-des-hermas-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>
