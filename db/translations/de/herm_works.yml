    body: |-
      <h2>Vorwort</h2><p>Der Verfasser der Schrift „Der Hirte des Hermas“ war Hermas, der Bruder des römischen Bischofs des heiligen Pius I. Der älteste Teil des „Hirten“ wurde noch zu Lebzeiten des heiligen Klemens geschrieben, das ganze Buch in seiner heutigen Gestalt jedoch erst um 130–140.</p><p>Die Schrift entspricht im Umfang fast allen Werken der Zeit der apostolischen Väter zusammengenommen. Es ist ein apokalyptisches Buch: Der Autor sagt, er schreibe aufgrund einer Offenbarung als ein vom göttlichen Geist inspirierter Prophet.</p><p>Einige der ältesten Väter rechneten das Buch zum Kanon des Neuen Testaments. Es gelangte auch in den berühmten Codex Sinaiticus zusammen mit den kanonischen biblischen Büchern.</p><p>„Der Hirte des Hermas“ enthält fünf Gesichte, zwölf Gebote und zehn Gleichnisse. Die Offenbarungen werden Hermas durch die Kirche, die in Gestalt einer alten Frau erscheint, und durch den Engel, der in Gestalt eines Hirten erscheint, zuteil, woher der Name des Werkes stammt. Alle Offenbarungen, die Hermas empfing, enthalten Ermahnungen zur Buße.</p><p>Im dritten Gesicht sah Hermas den Bau eines großen Turmes aus glänzenden quadratischen Steinen auf dem Wasser. Sechs Jünglinge bauten den Turm, und Tausende anderer Männer brachten Steine herbei. Der Deutung zufolge ist der Turm die Kirche auf Erden; die sechs Jünglinge sind die sechs erstgeschaffenen Engel, denen der Herr sein Schöpfungswerk anvertraut hat; die anderen Männer sind niedere Engel. Der Turm wird auf dem Wasser gebaut, um zu zeigen, dass das Leben durch das Wasser (d. h. das Sakrament der Taufe) gerettet ist und gerettet wird. Die sieben Frauen, die um den Turm stehen und ihn stützen, sind die sieben christlichen Tugenden: Glaube, Enthaltsamkeit, Einfalt, Unschuld, Bescheidenheit, Erkenntnis, Liebe. Der Bau des Turmes ist noch nicht vollendet, wird aber bald abgeschlossen sein, und dann wird das Ende kommen.</p><p>Das fünfte Gesicht ist die Einleitung zu den Geboten und Gleichnissen. Die Gebote legen in einfacher Sprache die christliche Sittenlehre dar. So schreibt das zweite Gebot vor, in Einfalt und Arglistlosigkeit zu leben und Almosen zu geben, und im zehnten befiehlt der Hirt, Traurigkeit und Niedergeschlagenheit von sich zu entfernen und sich mit Freude zu bekleiden.</p><p>Nach der Darlegung der Gebote geht der Hirt zu den zehn Gleichnissen über. Das erste gründet auf der Gleichsetzung der Christen mit den Bürgern der himmlischen Stadt, und im fünften Gleichnis lehrt der Hirt, dass das vollkommene und Gott wohlgefällige Fasten in der Enthaltung von der Sünde besteht. Das zehnte Gleichnis ist der Abschluss des ganzen Buches: „Zögert nicht, damit der Bau des Turmes nicht beendet wird... Wenn ihr euch nicht beeilt, euch zu bessern, wird der Turm vollendet, und ihr werdet nicht in ihn hineinkommen.“</p><p><em>Der Hirte des Hermas, übersetzt von Franz Zeller (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35, München 1918).</em></p><h2>Erstes Gesicht</h2><p>1. Mein Ernährer hat mich nach Rom an eine gewisse Rhode verkauft. Nach vielen Jahren sah ich sie wieder und gewann sie allmählich lieb wie eine Schwester. 2. Nach einiger Zeit sah ich sie, wie sie im Tiber badete, ich reichte ihr die Hand und führte sie aus dem Fluss. Wie ich nun ihre Schönheit sah, wurde ich nachdenklich und sprach bei mir selbst: Glücklich wäre ich, wenn ich eine solche Frau bekäme mit dieser Schönheit, diesen Sitten. Nur dieses dachte ich, sonst nichts. 3. Später ging ich nach Kumä; dabei pries ich die Werke Gottes: ihre Größe, Erhabenheit und Gewalt; da übermannte mich im Gehen der Schlaf. Und ein Geist erfasste mich und entführte mich durch eine unwegsame Gegend, durch die kein Mensch durchkommen konnte; sie war steil und durch das Wasser zerklüftet. Nachdem ich jenen Fluss überschritten hatte, kam ich in die Ebene, fiel auf die Knie nieder, begann zum Herrn zu beten und meine Sünden zu bekennen. 4. Während ich betete, tat sich der Himmel auf, und ich sah jene Frau, die ich ersehnte, mich vom Himmel her grüßen und (ich hörte) sie sagen: „Sei gegrüßt; Hermas!“ 5. Die Augen auf sie gewandt, fragte ich sie: „Herrin, was machst du da?“ Und sie erwiderte mir: „Ich wurde aufgenommen, damit ich deine Sünden kund tue bei dem Herrn.“ 6. Ich sagte zu ihr: „So bist du meine Anklägerin?“ „Nein“, entgegnete sie, „höre vielmehr, was ich dir zu sagen habe. Der Gott, der in dem Himmel wohnet und der aus dem Nichts das Seiende erschaffen, erweitert und vermehrt hat um seiner heiligen Kirche willen, zürnt dir, weil du wider mich gesündigt hast.“ 7. Ich entgegnete ihr und sagte: „Wider dich habe ich gesündigt? auf welche Weise? habe ich zu dir einmal ein schlüpfriges Wort gesagt? habe ich dich nicht stets wie eine Göttin angesehen? habe ich dich nicht stets behandelt wie eine Schwester? Warum lügst du, Weib, gegen mich dieses Schändliche und Unreine?“ 8. Da lachte sie auf und sprach zu mir: „In deinem Herzen stieg die Lust zum Bösen auf. Oder scheint es dir nicht etwas Schlimmes zu sein für einen gerechten Mann, wenn in seinem Herzen die böse Lust aufsteigt? Das ist eine Sünde“, sagte sie, „und zwar eine große. Denn der gerechte Mann sinnt auf Gerechtes. Denn darauf, dass er Gerechtes sinnt, baut sich sein guter Ruf im Himmel, und der Herr ist ihm zugetan in all seinem Beginnen; die aber Böses sinnen in ihren Herzen, die ziehen sich Tod und Gefangenschaft zu, am meisten die, welche sich um diese Welt kümmern und sich ihres Reichtums rühmen und auf die kommenden Güter nicht hoffen. 9. Bereuen werden es in ihren Herzen alle, die keine Hoffnung haben, sie haben ja sich selbst aufgegeben und ihr Leben. Du aber bete zu Gott, und er wird deine Sünden heilen und die deines ganzen Hauses und aller Heiligen.“</p><p>1. Nachdem sie diese Worte gesprochen hatte, schloss sich der Himmel; ich zitterte am ganzen Leibe und war betrübt. Und ich sprach bei mir selbst: Wenn mir dies zur Sünde angerechnet wird, wie werde ich das Heil erlangen können? oder wie werde ich Gott versöhnen für meine Sünden, die ich durch die Tat vollführt habe? oder mit welchen Worten soll ich mich an den Herrn wenden, auf dass er mir gnädig sei? 2. Als ich dies in meinem Herzen erwog und überdachte, sah ich vor mir einen großen, leuchtenden Sitz aus schneeweißer Wolle. Und es kam eine bejahrte Frau in prächtigem Gewande, ein Buch in den Händen haltend, setzte sich allein nieder und grüßte mich: „Sei gegrüßt, Hermas.“ Voll Betrübnis sprach ich unter Tränen: „Sei gegrüßt, Herrin.“ 3. Und sie sprach zu mir: „Warum bist du traurig, Hermas, du, der Langmütige und Friedliebende, der allzeit Lachende, warum siehst du so niedergeschlagen aus und warum bist du nicht munter?“ Ich antwortete ihr: „Wegen einer überaus guten Frau, die sagte, ich hätte wider sie gesündigt.“ 4. Sie entgegnete: „Keinesfalls gibt es bei dem Diener Gottes ein solches Tun. Vielmehr stieg lediglich in deinem Herzen (der Gedanke) an sie auf. Allerdings ist es so, für die Diener Gottes zieht ein solcher Gedanke Sünde nach sich; sündhaft ist nämlich der Wunsch und verwerflich bei einer ganz lauteren und schon erprobten Seele, wenn sie eine schlimme Tat begehrt, und zumal (wenn es) Hermas (tut), der Enthaltsame, der sich frei hält von jeder schlechten Begierde und der erfüllt ist mit jeglicher reinen Gesinnung und großer Unschuld!</p><p>1. Aber nicht deshalb zürnt dir Gott, sondern damit du dein Haus bekehrest, das sich versündigt hat gegen Gott und gegen euch, seine Eltern. Weil du die Kinder liebst, hast du dein Haus nicht gewarnt, ließest es vielmehr gar sehr verderben; deshalb zürnt dir der Herr; aber er wird all das Böse heilen, das in deinem Hause vorgekommen ist; denn wegen der Fehltritte und Sünden jener ging es dir schlecht in deinen zeitlichen Unternehmungen. 2. Aber die Barmherzigkeit Gottes hatte Mitleid mit dir und deinem Hause, und er wird dich stark machen und dich befestigen in seinem Ruhme. Nur nimm du es nicht leicht, sondern fasse guten Mut und bestärke dein Haus. Wie nämlich der Schmied durch das Hämmern des Stückes fertig bringt, was er will, so wird auch die tägliche gute Zusprache Herr über jegliche Schlechtigkeit. Lasse also nicht ab, deine Kinder zu warnen; denn ich weiß es, wenn sie von ganzem Herzen sich bekehren, werden sie mit den Heiligen eingeschrieben werden in die Bücher des Lebens.“ 3. Als sie diese Worte zu Ende gesprochen hatte, sagte sie zu mir: „Willst du mich anhören, wenn ich vorlese?“ Und ich versetzte: „Ja, Herrin!“ Da sagte sie zu mir: „Höre zu und vernimm die Herrlichkeiten Gottes.“ Ich hörte Mächtiges und Wunderbares, was ich nicht behalten konnte. Denn alle Worte waren zum Erschauern, so dass sie ein Mensch nicht ertragen kann. Nur die letzten Worte habe ich behalten; sie waren mir nämlich erträglich und milde. 4. „Siehe, der Herr der Heerscharen, der mit seiner unsichtbaren Macht und Stärke und großen Weisheit die Welt erschuf und in seinem lobwürdigen Ratschlusse seine Schöpfung mit Schönheit umgab und mit seinem mächtigen Wort den Himmel befestigte und die Erde gründete über den Wassern und in der ihm eigenen Weisheit und Vorsicht seine heilige Kirche schuf, die er auch segnete, siehe, er versetzt die Himmel, die Berge, die Hügel und die Meere, und alles wird ebenes Land für seine Auserwählten, damit er ihnen das Versprechen einlöse, das er mit großem Ruhm und großer Freude gegeben, wenn sie nämlich die Satzungen Gottes halten, die sie in großem Vertrauen empfangen haben.“</p><p>1. Als sie nun mit dem Vorlesen aufgehört und von dem Sitze sich erhoben hatte, kamen vier Jünglinge, nahmen den Sitz und entfernten sich gegen Osten. 2. Sie aber rief mich, fasste mich an der Brust und sagte zu mir: „Hat dir meine Vorlesung gefallen?“ Und ich erwiderte ihr: „Herrin, der Schluss eben gefiel mir, das Vorhergehende aber ist schwierig und hart.“ Sie sagte mir aber entgegnend: „Diese Schlussworte sind für die Gerechten, das Vorhergehende ist für die Heiden und die Abtrünnigen.“ 3. Während sie noch mit mir sprach, erschienen zwei Männer, trugen sie an den Armen und entfernten sich gegen Osten, wohin auch der Sitz gebracht worden war. Sie ging aber heiter weg, und im Gehen sagte sie zu mir: „Sei stark, Hermas!“</p><h2>Zweites Gesicht</h2><p>1. Als ich nach Kumä ging zu derselben Zeit wie im vorigen Jahre, dachte ich beim Gehen an die vorjährige Erscheinung, und wiederum erhob mich der Geist und führte mich an den gleichen Ort wie damals. 2. Hier angekommen, fiel ich auf die Knie, fing an zum Herrn zu beten und seinen Namen zu verherrlichen, weil er mich für würdig gehalten und mir meine früheren Sünden geoffenbart hatte. 3. Wie ich mich dann vom Gebete erhob, sah ich mir gegenüber die ältere Frau, die ich auch im vorigen Jahre gesehen hatte, hin und her wandeln und in einem kleinen Buche lesen; und sie sprach: „Kannst du dies den Auserwählten Gottes verkünden?“ Ich erwiderte ihr: „Herrin, soviel kann mein Gedächtnis nicht behalten; gib mir das Buch zum Abschreiben!“ „Nimm es“, sagte sie, „aber gib es mir wieder zurück.“ 4. Und ich nahm es, zog mich an einen Platz auf dem Felde zurück und schrieb alles buchstäblich ab; denn Silben fand ich nicht. Als ich mit dem Abschreiben der Buchstaben des Buches fertig war, wurde es mir plötzlich aus der Hand gerissen; von wem, sah ich nicht.</p><p>1. Vierzehn Tage später, nachdem ich gefastet und zum Herrn viel gebetet hatte, wurde mir die Erkenntnis der Schrift enthüllt. Folgendes stand darin: 2. „Deine Kinder, Hermas, haben gesündigt gegen Gott und gelästert wider den Herrn; in großer Schlechtigkeit haben sie ihre Eltern verraten, man nannte sie Verräter der Eltern, und sie ließen es sich nicht zunutzen sein, sondern sie fügten ihren Sünden noch Ausschweifung und allerhand Bosheit hinzu, und so ist ihre Schlechtigkeit voll geworden. 3. Tue diese Worte allen deinen Kindern kund und deiner Gattin, die einmal deine Schwester sein soll; denn sie beherrscht die Zunge nicht, sondern sündigt damit; wenn sie aber dies hört, wird sie es nicht mehr tun, und sie wird Erbarmung finden. 4. Wenn du ihnen diese Worte mitgeteilt hast, die mir der Herr aufgetragen hat, damit du sie offen erkennest, dann werden ihnen alle Sünden nachgelassen, die sie früher begangen haben, ebenso allen Heiligen, was sie bis auf diesen Tag gesündigt haben, wenn sie aus ganzem Herzen sich bekehren und aus ihrem Herzen den Zwiespalt nehmen. 5. Denn der Herr hat bei seiner Herrlichkeit gegen seine Auserwählten geschworen: wenn nach diesem festgesetzten Tage noch eine Sünde geschieht, dann sollen sie das Heil nicht erlangen; denn die Bußzeit hat ein Ende für die Gerechten; die Tage der Buße sind erfüllt für alle Heiligen; für die Heiden aber gibt es eine Buße bis zum Jüngsten Tage. 6. Sage daher den Vorstehern der Kirche, auf dass sie ihre Wege bessern in Gerechtigkeit und mit großer Herrlichkeit aus dem Vollen die Verheißungen empfangen. 7. Fahret fort, die Gerechtigkeit zu üben und duldet keinen Zwiespalt im Herzen, damit ihr eingehen werdet zu den heiligen Engeln! Glückselig seid ihr alle, wenn ihr die kommende große Trübsal aushaltet und wenn ihr euer Leben nicht verleugnet. 8. Denn der Herr hat durch seinen Sohn geschworen, dass denen, die ihren Herrn verleugnen, ihr Leben abgesprochen ist, nämlich denen, die in den kommenden Tagen ihn verleugnen werden; wer es früher getan, dem zeigte sich der Herr gnädig wegen seiner Barmherzigkeit.</p><p>1. Du aber, Hermas, sollst deinen Kindern das Böse nicht nachtragen und auch deine Schwester nicht entlassen, damit sie von ihren früheren Sünden gereinigt werden. Sie werden nämlich in eine gerechte Zucht genommen werden, wenn du ihrer Sünden nicht gedenkst; denn Böses nachtragen, heißt sich den Tod zuziehen. Du aber, Hermas, wirst selbst große Trübsal mitmachen müssen wegen der Übertretungen der Deinigen, weil du dich nicht um sie gekümmert hast; vielmehr hast du sie vernachlässigt und warst verstrickt in deine bösen Unternehmungen. 2. Aber retten wird dich der Umstand, dass du nicht abgefallen bist vom lebendigen Gotte, und deine aufrichtige Gesinnung und deine große Enthaltsamkeit; das ist deine Rettung, falls du so bleibst, und das rettet alle, die so handeln und die wandeln in Gerechtigkeit und Aufrichtigkeit. Diese werden jegliche Schlechtigkeit überwinden und ausharren zum ewigen Leben. 3. Glückselig alle, die Gerechtigkeit üben; sie werden in Ewigkeit nicht zugrunde gehen. 4. Dem Maximus aber sage: siehe, Trübsal kommt; wenn’s dir gut dünkt, verleugne abermals. Nahe ist der Herr denen, die sich bekehren, wie geschrieben steht bei Eldad und Modat, die dem Volke in der Wüste geweissagt haben.“</p><p>1. Brüder, im Schlafe erhielt ich eine Offenbarung von einem gar schönen Jüngling, der mir sagte: „Was meinst du, wer die alte Frau war, von der du das Büchlein bekamst?“ Ich sagte: „Die Sibylle“. „Du irrst“, versetzte er, „die ist es nicht.“ „Wer ist es denn?“ fuhr ich fort. „Die Kirche“, war seine Antwort. Ich sagte ihm: „Warum ist sie alt?“ „Weil sie“, antwortete er, „von allem zuerst gegründet wurde; deswegen ist sie alt, und ihretwegen wurde die Welt geschaffen.“ 2. Danach sah ich ein Gesicht in meinem Hause. Die alte Frau kam und fragte mich, ob ich das Buch schon den Presbytern gegeben habe. Ich sagte: „Nein.“ „Du hast recht getan“, fuhr sie fort. „Ich habe noch einiges hinzuzufügen. Wenn ich nun vollends alle Worte hinzugefügt habe, werden sie durch dich allen Auserwählten bekanntgegeben werden. 3. Du wirst zwei Abschriften fertigen und eine dem Klemens, eine der Grapte senden. Klemens wird es an die auswärtigen Städte schicken, das ist ihm aufgetragen worden; Grapte wird die Witwen und Waisen mahnen. Und du wirst es in dieser Stadt gemeinsam mit den Presbytern, den Vorstehern der Kirche, vorlesen.“</p><h2>Drittes Gesicht</h2><p>1. Was ich schaute, Brüder, verhält sich so. 2. Als ich oftmals gefastet und den Herrn gebeten hatte, dass er mir die Offenbarung enthülle, die er mir durch jene alte Frau zu zeigen versprochen hatte, da erschien mir mitten in der Nacht jene Frau und sagte mir: „Da du so mangelhaft unterrichtet bist und so begierig, alles zu erfahren, so komme auf das Feld, wo du Korn bauest, und um die fünfte Stunde werde ich dir erscheinen und dir zeigen, was du sehen musst.“ 3. Ich fragte sie: „Herrin, wo auf dem Felde?“ „Wo du willst“, sprach sie. Ich wählte einen schönen, etwas zurückgelegenen Platz. Bevor ich aber sie anreden und ihr den Ort bezeichnen konnte, sagte sie: „Ich komme dorthin, wohin du willst.“ 4. Ich begab mich also, Brüder, auf das Feld, zählte die Stunden, kam an den Platz, den ich ihr als Treffpunkt bezeichnet hatte, und sah eine Bank aus Elfenbein dastehen, und über der Bank lag ein leinenes Kopfkissen, und über dem Linnen war ein feines, flächsenes Tuch gebreitet. 5. Als ich dies daliegen und niemand an dem Orte sah, geriet ich in Verwirrung, und es überkam mich wie ein Zittern, und die Haare stiegen mir zu Berge. Wie ein Schauern kam es mich an, weil ich allein war. Als ich wieder zu mir gekommen war, als ich an Gottes Herrlichkeit mich erinnert und wieder Mut gefasst hatte, fiel ich auf die Knie und bekannte dem Herrn abermals meine Sünden, wie früher. 6. Da kam sie mit sechs Jünglingen, die ich auch früher schon gesehen hatte, trat neben mich und hörte zu, wie ich betete und dem Herrn meine Sünden bekannte. Und indem sie mich berührte, sprach sie: „Hermas, höre auf, nur immer wegen deiner Sünden zu beten; bete auch um die Gerechtigkeit, damit du von ihr einen Teil in dein Haus bringest.“ 7. Dann richtete sie mich auf an der Hand und führte mich zu der Bank und sagte zu den Jünglingen: „Gehet fort und bauet.“ 8. Und als die Jünglinge sich entfernt hatten und wir allein waren, begann sie zu mir: „Setze dich hierher!“ Ich erwiderte ihr: „Herrin, lass die Älteren zuerst Platz nehmen.“ „Was ich dir sage“, fuhr sie fort, „setze dich!“ 9. Als ich mich dann auf die rechte Seite setzen wollte, gab sie es nicht zu und winkte mit der Hand, dass ich mich auf die linke Seite setzen solle. Dann sann ich darüber nach und war mißstimmt, weil sie mich nicht rechts hatte sitzen lassen. Sie sagte dann: „Bist du traurig, Hermas? Der Platz zur Rechten gehört anderen, die Gott ganz wohlgefällig sind und um seines Namens willen gelitten haben; dir fehlt noch viel, bis du dich zu ihnen setzen darfst. Aber verbleibe in der Aufrichtigkeit, wie du sie hast, und du wirst bei ihnen Platz nehmen, ebenso alle, welche die Werke jener tun und ertragen, was auch jene ertragen haben.“</p><p>1. „Was“, fragte ich, „haben sie ertragen?“ „Höre“, erwiderte sie, „Geißeln, Gefängnis, große Trübsal, Kreuzesstrafe, wilde Tiere um des Namens willen. Deshalb gehört jenen die rechte Seite der Beseligung und jedem, der wegen des Namens leidet; den übrigen gehört die linke Seite. Aber beide, sowohl die zur Rechten als auch die zur Linken Sitzenden haben die gleichen Gnaden und dieselben Verheißungen; nur genießen die zur Rechten Sitzenden eine gewisse Ehre. 2. Du bist voll Begierde, mit ihnen zur Rechten zu sitzen, aber deiner Unvollkommenheiten sind es viele; aber du wirst von ihnen gereinigt werden; auch werden alle diejenigen auf diesen Tag von ihren Fehlern befreit, die nicht doppelten Sinnes sind. 3. Nach diesen Worten wollte sie gehen; ich fiel ihr aber zu Füßen und bat sie bei dem Herrn, sie möge mir das versprochene Gesicht zeigen. 4. Da fasste sie mich wiederum bei der Hand, hob mich auf und hieß mich auf der Bank zur Linken Platz nehmen; sie selbst nahm auch Platz zur Rechten. Und nachdem sie einen prunkvollen Stab erhoben hatte, begann sie zu mir: „Du siehst etwas Großes.“ Ich entgegnete ihr: „Herrin, ich sehe gar nichts.“ Sie sprach zu mir: „Da, siehst du nicht, wie dir gegenüber ein großer Turm über den Wassern aus prächtigen Quadersteinen erbaut wird?“ 5. Im Viereck aber wurde der Turm aufgeführt von den sechs Jünglingen, die mit ihr gekommen waren; aber außerdem trugen unzählige Männer Steine herbei, die einen aus der Meerestiefe, die anderen von der Erde, und übergaben sie den sechs Jünglingen; diese nahmen sie in Empfang und setzten sie in den Bau. 6. Die aus der Tiefe heraufgezogenen Steine fügten sie alle so in den Bau; denn sie eigneten sich so und passten in den Mauerverband mit den übrigen Steinen; sie wurden so untereinander verbunden, dass man die Fugen nicht sah. Es schien, als ob das Gefüge des Turmes aus <strong>einem</strong> Stein hergestellt sei. 7. Von den anderen Steinen, die sie von der trockenen Erde holten, warfen sie einen Teil weg, den anderen fügten sie ein in den Bau; wieder andere schlugen sie zusammen und warfen sie weit weg vom Turme. 8. Und wieder andere Steine lagen in großer Zahl rings um den Turm, aber sie verwendeten sie nicht für den Bau; einige von ihnen hatten Flecken, andere hatten Risse, andere waren verstümmelt, andere waren glänzend und abgerundet, so dass sie in den Bau nicht passten. 9. Auch sah ich, wie einige Steine weit vom Turme weggeschleudert auf den Weg fielen, aber in dem Wege nicht liegen blieben, sondern weiter rollten vom Weg auf unwegsamen Boden; andere sah ich ins Feuer fallen und verbrennen; endlich sah ich, wie einige nahe am Wasser niederfielen, wie sie aber nicht ins Wasser weiterrollen konnten, obwohl sie weiter springen und ins Wasser fallen wollten.</p><p>1. Als sie mir dies gezeigt hatte, wollte sie weggehen. Da sagte ich ihr: „Herrin, was nützt es mir, wenn ich dies gesehen habe, aber nicht verstehe, was diese Dinge zu bedeuten haben?“ Antwortend sagte sie mir: „Du bist ein neugieriger Mensch, da du das Nähere über den Turm erfahren willst.“ „Ja, Herrin“, erwiderte ich, „damit ich es den Brüdern mitteile, damit sie froher werden und damit sie, wenn sie dies hören, den Herrn erkennen in großer Herrlichkeit.“ 2. Sie entgegnete: „Es werden zwar viele dies hören; von diesen werden die einen sich freuen, andere werden weinen; aber auch diese werden sich sogar freuen, wenn sie darauf hören und Buße tun. So höre denn das Gleichnis von dem Turm; ich will dir nämlich alles enthüllen. Aber mache mir keine Vorwürfe mehr wegen der Enthüllung; denn diese Offenbarungen haben ein Ende; sie sind nämlich erfüllt; du aber hörst nicht auf, Offenbarungen zu verlangen; so anspruchsvoll bist du. 3. Der Turm, den du bauen siehst, bin ich, die Kirche, die dir jetzt wie auch früher erschienen ist; was du nun willst, das frage über den Turm, und ich werde es dir künden, damit du dich freuest mit den Heiligen.“ Da sagte ich zu ihr: „Herrin, da du mich nun einmal für würdig hieltest, mir alles zu enthüllen, so rede.“ Sie aber entgegnete: „Was immer dir enthüllt werden kann, das wird enthüllt werden. Nur soll dein Herz zu Gott gerichtet sein, und du darfst nicht anzweifeln, was du siehst.“ 4. Ich fragte sie: „Warum ist der Turm auf Wasser gebaut, Herrin?“ „Ich habe es dir“, versetzte sie, „schon früher gesagt, du fragst genau nach; wenn du also fragst, wirst du die Wahrheit finden. Höre nun, warum der Turm auf Wasser gebaut ist. Weil euer Leben durch Wasser gerettet wurde und gerettet werden wird. Der Grund des Turmes ist nämlich gelegt durch das Wort des allmächtigen und verherrlichten Namens, er wird zusammengehalten durch die unsichtbare Macht des Herrn.“</p><p>1. Ich antwortete ihr mit den Worten: „Herrin, groß und wunderbar ist diese Sache. Wer aber sind die sechs Jünglinge, die beim Bau tätig sind, Herrin?“ „Das sind die heiligen Engel Gottes, die zuerst geschaffenen, denen der Herr den Auftrag gab, seine ganze Schöpfung zu fördern, zu ordnen und sie ganz zu beherrschen. Durch sie wird daher der Bau des Turmes vollendet werden.“ 2. „Und wer sind die anderen, welche die Steine beitragen?“ „Auch das sind heilige Engel Gottes; jene sechs aber sind höheren Ranges als diese. Der Turm wird also seine Vollendung finden, und alle insgesamt werden sich freuen rings um den Turm, und sie werden Gott verherrlichen, weil der Bau des Turmes zu Ende geführt wurde.“ 3. Ich fragte sie: „Herrin, ich hätte gerne gewusst, welche Bewandtnis es hat mit der Herkunft und der Bedeutung der Steine.“ Ihre Antwort lautete: „Nicht weil du von allen der würdigste bist, diese Enthüllung zu erhalten - denn andere kommen vor dir und sind besser als du, so dass ihnen diese Gesichte hätten geoffenbart werden sollen - vielmehr damit der Name Gottes verherrlicht werde, wurde dir die Offenbarung und wird sie dir zuteil werden wegen der Zweifler, wegen derer, die grübeln in ihren Herzen, ob es so sei oder nicht. Sage, ihnen, dass dies alles wahr ist und nichts gegen die Wahrheit verstößt, sondern alles fest, sicher und wohlbegründet ist.“</p><p>1. „Nun höre von den Steinen, die in den Bau kamen. Die viereckigen, weißen und in den Verband passenden Steine, das sind die Apostel, Bischöfe, Lehrer und Diakonen, welche lebten nach der Heiligkeit Gottes, die ihr Hirtenamt, Lehramt und ihren Dienst heilig und fromm versehen haben für die Erwählten Gottes; die einen von ihnen sind schon entschlafen, die anderen leben noch; immer waren sie einig miteinander, hielten Frieden unter sich und hörten aufeinander; deshalb passen in dem Bau des Turmes die Fugen zueinander.“ 2. „Was aber bedeuten die Steine, die aus der Meerestiefe heraufgezogen und in den Bau eingemauert wurden und deren Linien mit den übrigen schon zum Bau verwandten Steinen übereinstimmten?“ „Das sind die, welche für den Namen des Herrn gelitten haben.“ 3. „Auch über die anderen Steine, welche von der Erde genommen, möchte ich Auskunft und Deutung haben, Herrin.“ Sie erklärte: „Die, welche zum Bau verwendet wurden, ohne dass man sie behauen musste, sind vom Herrn erprobt, weil sie in der Gerechtigkeit des Herrn wandelten und seine Gebote richtig hielten.“ 4. „Was bedeuten aber die, welche herbeigeführt und in den Bau gelegt wurden?“ „Das sind die Neulinge im Glauben und (andere) Gläubige; sie werden von den Engeln zu guten Werken ermahnt, weil in ihnen keine Sünde gefunden wurde.“ 5. „Und was bedeuten die Weggeworfenen und Fortgeschleuderten?“ „Das sind solche, welche gesündigt haben und sich bekehren wollen; deshalb wurden sie nicht weit vom Turme weggeworfen, weil sie für den Bau brauchbar sein werden, wenn sie sich bekehrt haben. Die, welche die Bekehrung vorhaben, werden nach ihrer Bekehrung stark sein im Glauben, wenn ihre Bekehrung jetzt geschieht, solange am Turme noch gebaut wird; wenn aber der Bau vollendet ist, dann gibt es für sie keinen Platz mehr, und sie werden verworfen sein; nur das bleibt ihnen, dass sie in der Nähe des Turmes liegen.“</p><p>1. „Willst du auch über die Zerschlagenen und vom Turme weit Weggeschleuderten Auskunft haben? Das sind die Kinder der Sünde; ihr Glaube war Heuchelei, und keine Schlechtigkeit blieb fern von ihnen. Deshalb finden sie das Heil nicht, weil sie wegen ihrer Sünden nicht brauchbar sind für den Bau. Deshalb wurden sie zusammengeschlagen und weit fort geworfen wegen des Herrn Zorn, weil sie ihn geärgert haben. 2. Dann hast du andere in großer Zahl daliegen sehen, die nicht in den Bau kamen; das sind die mit Flecken Behafteten; sie haben die Wahrheit zwar erkannt, aber sie blieben nicht bei ihr und schlossen sich den Heiligen nicht an; deshalb sind sie unbrauchbar.“ 3. „Wer sind dann die mit den Rissen?“ „Sie bedeuten Leute, die im Herzen etwas gegeneinander haben und miteinander nicht im Frieden leben, vielmehr sich den Anschein des Friedens geben; sobald sie aber auseinander gegangen sind, leben ihre Sünden fort in ihren Herzen; das sind die Risse, welche die Steine haben. 4. Die Verstümmelten sodann sind diejenigen, welche zwar gläubig sind und der Hauptsache nach in Gerechtigkeit leben, aber doch einigen Anteil an der Sünde haben; deshalb sind sie verstümmelt und nicht ganz.“ 5. „Was ist aber dann mit den weißen, rundlichen Steinen, die nicht in das Bauwerk passen, Herrin?“ Sie antwortete mir: „Wie lange noch bist du töricht und unverständig und fragst nach allem und siehst nichts ein? Das sind solche, die zwar den Glauben haben, zugleich aber auch den Reichtum dieser Welt; wenn die Trübsal kommt, dann verleugnen sie ihren Herrn wegen ihres Reichtums und wegen ihrer Geschäfte.“ 6. Ich erwiderte ihr und sagte: „Herrin, wann werden sie brauchbar werden für den Bau?“ „Sie werden dann brauchbar sein für Gott, wenn ihnen der Reichtum, der ihre Seele beherrscht, vermindert worden ist. Wie nämlich der rundliche Stein nur dadurch viereckig wird, dass man ihn behaut und einiges von ihm wegnimmt, so können auch die Reichen in dieser Welt nur dadurch für den Herrn brauchbar werden, dass ihnen der Reichtum beschnitten wird. 7. Erkenne dies zuerst an dir selbst; solange du reich warst, warst du nicht zu brauchen, jetzt aber bist du sehr brauchbar und nützlich für das Leben. Werdet brauchbar für Gott! Denn du selbst wirst aus diesen Steinen genommen.“</p><p>1. „Die anderen Steine, die, wie du sahest, weit vorn Turme weggeworfen wurden und auf den Weg fielen, aber vom Wege weiterrollten in wegloses Feld, das sind die, welche zwar geglaubt haben, aber wegen ihres Zweifels ihren wahren Weg verließen; in der Meinung, einen besseren Weg finden zu können, irren sie umher und sind unglücklich durch ihr Umherstreifen in den weglosen Gebieten. 2. Die, welche ins Feuer fielen und verbrannten, das sind die, welche am Ende von dem lebendigen Gott abgefallen sind und in deren Herzen keine Sinnesänderung mehr aufkam wegen ihrer schwelgerischen Lüste und ihrer Sünden, die sie begingen. 3. Möchtest du endlich wissen, was die zu bedeuten haben, welche nahe am Wasser niederfielen, aber nicht ins Wasser weiterrollen konnten? Das sind die, welche das Wort hörten und sich taufen lassen wollten auf den Namen des Herrn; wenn ihnen hernach die Keuschheit (als Forderung) der wahren Lehre zu Gemüte geführt wird, kehren sie um und laufen wieder ihren schlechten Begierden nach.“ 4. Da schloss sie mit der Deutung des Turmes. 5. Ich aber war frech und fragte sie noch, ob alle diese weggeworfenen und in den Bau des Turmes nicht passenden Steine, ob es für sie eine Buße gibt und ob sie eine Stelle finden in diesem Turme. „Es gibt für sie eine Buße“, erwiderte sie, „aber in diesen Turm können sie nicht kommen. 6. Aber sie werden für einen anderen viel geringeren Platz passen, und zwar dann, wenn sie ihre Schmerzen getragen und die Tage ihrer Sünden erfüllt haben. Sie werden aber deshalb an einen anderen Ort versetzt werden, weil sie teilgenommen hatten an dem gerechten Worte. Und nur dann wird es ihnen gelingen, ihren Qualen entrissen zu werden, wenn in ihrem Herzen (die Reue über) die bösen Werke, die sie verübt, sich regt. Wenn diese sich aber nicht regt in ihrem Herzen, dann werden sie nicht gerettet werden wegen ihrer Herzenshärtigkeit.“</p><p>1. Als ich nun aufhörte, sie nach all diesem zu fragen, sagte sie zu mir: „Willst du etwas anderes sehen?“ Da ich sehr begierig war, etwas zu schauen, wurde ich überglücklich durch (die Aussicht auf) ein neues Gesicht. 2. Lächelnd sah sie mich an und sagte: „Siehst du sieben Frauen um den Turm?“ „Ja, Herrin“, erwiderte ich. „Der Turm hier wird von diesen getragen gemäß der Anordnung des Herrn. 3. Vernimm nun ihre Bedeutung. Die erste von ihnen, die mit den kräftigen Händen, wird Glaube genannt. Durch sie werden die auserwählten Gottes gerettet. 4. Die zweite, mit dem Gürtel und mit dem mannhaften Aussehen, heißt Enthaltsamkeit; sie ist die Tochter des Glaubens. Wer ihr nachfolgt, wird glücklich in seinem Leben, weil er sich von allen bösen Taten frei halten wird, weil er glaubt, dass er das ewige Leben erben wird, wenn er sich frei hält von jeder sündhaften Lust.“ 5. „Was bedeuten aber die übrigen, Herrin?“ „Die eine ist die Tochter der anderen. Ihre Namen sind: Aufrichtigkeit, Wissenschaft, Unschuld, Keuschheit, Liebe. Wenn du alle Werke der Mutter von ihnen tust, kannst du das Leben besitzen.“ 6. „Ich hätte gerne gewusst, Herrin, welche Bedeutung jede von ihnen hat.“ „So höre“, antwortete sie, „die Bedeutung, die jede hat. 7. Die Bedeutung der einen ist von der anderen abhängig und folgt ihr in der Ordnung, wie sie geboren sind. Von dem Glauben stammt die Enthaltsamkeit, von der Enthaltsamkeit die Aufrichtigkeit, von der Aufrichtigkeit die Unschuld, von der Unschuld die Keuschheit, von der Keuschheit die Wissenschaft, von der Wissenschaft die Liebe. Ihre Werke nun sind rein, keusch, göttlich. 8. Wer nun diesen dient und es fertig bringt, ihre Werke zu üben, der wird im Turme Wohnung finden bei den Heiligen Gottes.“ 9. Ich fragte sie dann nach der Zeit, ob schon die Vollendung da sei. Da schrie sie laut auf und rief: „Du unverständiger Mensch, siehst du nicht, dass an dem Turme noch gebaut wird? Erst wenn der Turm fertig dasteht, kommt das Ende. Aber es wird rasch gebaut werden. Frage mich nichts mehr! Diese Mahnung genügt für dich und die Heiligen und die Erneuerung eures Geistes. 10. Aber nicht für dich allein wurde diese Offenbarung gegeben, sondern dazu, dass du sie allen kund tuest. 11. Nach drei Tagen (du musst es nämlich zuerst verstehen) werde ich dir, Hermas, erst die Worte ans Herz legen, die ich dir sagen will, damit du sie alle den Heiligen ins Ohr redest, damit sie dieselben hören und erfüllen und so gereinigt werden von ihren Sünden, du selbst und sie.“</p><p>1. „Höret mich, Kinder! Ich habe euch aufgezogen in aller Aufrichtigkeit und Unschuld und Keuschheit wegen der Erbarmung des Herrn, der seine Gerechtigkeit herabtauen ließ über euch, damit ihr gerechtfertigt und entsühnt würdet von allem Bösen und aller Verkehrtheit; ihr aber wollt nicht ablassen von eurer Schlechtigkeit. 2. Nun höret jetzt auf mich und haltet Frieden unter euch selbst und besuchet einander und nehmet einander auf und genießet die Gaben Gottes nicht allein im Überfluss, sondern teilet auch den Bedürftigen davon mit! 3. Während nämlich die einen infolge zu vieler Nahrungsaufnahme sich eine Krankheit des Körpers zuziehen und ihn schädigen, leidet der Körper der anderen Schaden infolge mangelnder Nahrung, weil sie nicht genug zu essen haben, und so geht ihr Leib zugrunde. 4. Diese Unmäßigkeit ist schädlich für euch Wohlhabende, die ihr dem Bedürftigen nichts gebet. 5. Schauet hin auf das kommende Gericht! Suchet also ihr, die ihr in Überfluss habet, die Hungernden auf, solange der Turm noch nicht fertig ist! denn nach Vollendung des Turmes werdet ihr Gutes tun wollen, aber es wird euch nicht mehr möglich sein. 6. Sehet zu, ihr im Reichtum Schwelgenden, dass die Darbenden nicht etwa seufzen und dass ihr Seufzen nicht emporsteige zum Herrn und ihr nicht mitsamt euren Gütern ausgeschlossen werdet von dem Eingang des Turmes! 7. Jetzt aber rede ich zu den Vorstehern der Kirche und den Inhabern der ersten Plätze; werdet den Giftmischern nicht ähnlich! Diese tragen nun zwar ihr Gift in Büchsen, ihr aber habt euer Gift und euer tötendes Mittel im Herzen. 8. Ihr seid verhärtet und wollet euer Herz weder reinigen noch eine einmütige Gesinnung miteinander haben in einem reinen Herzen, auf dass ihr Erbarmen erlangen könntet von dem großen Könige. 9. Sehet also zu, Kinder, dass diese Zwistigkeiten euch nicht um das Leben bringen! 10. Wie wollt ihr die Erwählten des Herrn erziehen, wenn ihr selbst keine Zucht habet? Es erziehe also einer von euch den anderen; und haltet Friede unter euch selbst, damit auch ich frohen Herzens vor den Vater treten und eurem Herrn Rechenschaft geben könne über euch alle!“</p><p>1. Als sie nun ihr Gespräch mit mir beendigt hatte, kamen die sechs Jünglinge, welche bauten, und trugen sie weg zu dem Turme, und vier andere nahmen die Bank und trugen sie ebenfalls zum Turme; ihr Antlitz konnte ich nicht sehen, weil sie abgewandt waren. 2. Als sie nun weggehen wollte, bat ich sie um Aufklärung über die drei Gestalten, in denen sie mir erschienen war. Ihre Antwort lautete: „Darüber musst du mich ein anderes Mal fragen, damit ich es dir enthülle.“ 3. Bei dem ersten Gesichte voriges Jahr war sie mir, Brüder, als eine ganz alte Frau, auf einem Sessel sitzend, erschienen. 4. Bei der zweiten Erscheinung hatte sie ein jüngeres Gesicht, aber einen alten Körper und graue Haare, und sie stand, als sie mit mir sprach; sie war aber in besserer Stimmung als das erste Mal. 5. Bei der dritten Erscheinung war sie ganz jung und von ausgezeichneter Schönheit, nur hatte sie graue Haare; aber sie war fröhlich bis zum Schlusse und saß auf einer Bank. 6. Dies machte mich ganz traurig, weil ich die Deutung hiervon kennen wollte. Da schaute ich in einem nächtlichen Gesichte die alte Frau, und sie sagte mir: „Jedes Gebet bedarf demütiger Gesinnung; faste also und du wirst erhalten, was du vom Herrn begehrst.“ 7. So fastete ich denn einen Tag, und in der gleichen Nacht erschien mir ein Jüngling, der mir sagte: „Warum verlangst du im Gebete die Offenbarungen der Reihe nach? Sieh zu, dass du nicht zuviel verlangst und so deiner Gesundheit schadest. 8. Diese Enthüllungen genügen dir. Oder kannst du stärkere Offenbarungen als die erlebten aushalten?“ 9. Ich antwortete ihm: „Herr, nur um das eine bitte ich, nämlich (um Aufklärung) über die dreifache Gestalt der alten Frau, damit die Offenbarung vollständig werde.“ Da erwiderte er: „Wie lange seid ihr noch unverständig? Vielmehr sind es die Zweifel, die euch das Verständnis nehmen, und der Umstand, dass ihr euer Herz nicht beim Herrn habet.“ 10. Ich antwortete ihm, indem ich nochmals sagte: „Aber von dir, o Herr, werde ich es genauer erfahren.“</p><p>1. „So höre denn über die drei Gestalten, wie du es verlangst. 2. Warum sie bei dem ersten Gesichte dir alt erschien und auf einem Sitze ruhend? Weil euer Geist schon alterte und schon abgezehrt war und keine Kraft mehr hatte wegen eurer Schwäche und eurer Zweifel; 3. wie nämlich die alten Leute, weil sie keine Aussicht haben, wieder jung zu werden, nur noch auf das Einschlummern warten, so habt auch ihr, durch die zeitlichen Sorgen geschwächt euch der Sorglosigkeit überlassen und habt nicht alle eure Sorgen auf den Herrn geworfen; vielmehr wurde euer Sinn niedergebeugt, und ihr seid gealtert durch eure Kümmernisse.“ 4. „Warum sie auf einem Sessel ruhte, möchte ich wissen, Herr.“ „Weil jeder Schwache sich auf einen Ruheplatz niedersetzt wegen seiner Schwäche, damit die Schwäche seines Körpers überwunden werde. Damit hast du die Bedeutung des ersten Gesichtes.“</p><p>1. „Bei der zweiten Erscheinung sahest du sie stehend, mit einem jugendlicheren Gesichte und fröhlicher als das erste Mal, nur mit älterem Körper und grauem Haar. Vernimm“, sagte er, „auch dieses Gleichnis! 2. Wenn einer schon alt ist und sich schon wegen seiner Schwäche und seiner Armut aufgegeben hat, dann erwartet er nichts anderes mehr als den letzten Tag seines Lebens; da fällt ihm plötzlich eine Erbschaft zu, und er springt bei der Nachricht hiervon auf, und voll Freude bekommt er wieder Kraft und bleibt nicht mehr liegen, sondern steht auf, und sein Geist, der infolge der früheren Arbeiten schon abgemattet war, lebt wieder auf; er bleibt nicht mehr sitzen, sondern rührt sich männlich: so ist es auch euch ergangen, als ihr die Offenbarung hörtet, die euch der Herr gegeben hat. 3. Weil er sich erbarmt hat über euch, hat sich auch euer Geist erneuert, habt ihr eure Schwäche abgelegt, habt ihr wieder Kraft geschöpft und seid wieder stark geworden im Glauben, und als der Herr eure Erstarkung sah, freute er sich; und deshalb hat er auch den Bau des Turmes geoffenbart und wird euch noch mehr offenbaren, wenn ihr aus ganzem Herzen unter euch Frieden bewahrt.“</p><p>1. „Bei der dritten Erscheinung sahst du sie jung, schön, fröhlich und von edler Gestalt 2. Wie nämlich ein Trauriger, dem plötzlich eine gute Botschaft zukommt, sogleich das alte Leid vergisst und nichts anderes erwartet als die (Erfüllung der) frohen Botschaft, von der er hörte, und wie er künftighin stark sein wird im Hinblick auf das Gute und wie sein Geist sich erneuert wegen der Freude, die ihm zuteil geworden, so habt auch ihr eine Erneuerung eures Geistes erlebt, als ihr diese Güter sahet. 3. Und wenn du sie auf einer Bank sitzen sahest, so wisse, dass es ein starker Sitz war, weil die Bank vier Füße hatte und fest stand; denn auch die Welt beruht auf vier Elementen. 4. Wer also völlig sich bekehrt, wer nämlich aus ganzem Herzen seine Gesinnung ändert, der wird neu werden und fest gegründet. Nun hast du die Offenbarung vollständig, und du sollst fernerhin gar nichts mehr fragen über die Offenbarung; sollte aber etwas notwendig sein, so wird es dir geoffenbart werden.“</p><h2>Viertes Gesicht</h2><p>1. Das vierte Gesicht, welches ich hatte, Brüder, zwanzig Tage nach dem letzten, ist zum Vorbild der kommenden Trübsal. 2. Ich ging auf dem Feldweg in meinen Acker. Von der Staatsstraße ist es ungefähr zehn Stadien entfernt; es ist aber leicht, an den Ort zu kommen. 3. Wie ich nun allein dahinging, bat ich den Herrn, er möge die Enthüllungen und die Gesichte, die er mir durch seine heilige Kirche gezeigt hatte, vollenden, auf dass er mich stärke und seinen Dienern, die gesündigt haben, Reue schenke, zur Verherrlichung seines großen und berühmten Namens, weil er mich gewürdigt hatte, mir seine Wunder zu zeigen. 4. Und während ich ihn lobte und ihm dankte, bekam ich Antwort wie vom Echo einer Stimme: „Zweifle nicht, Hermas!“ Ich fing an bei mir selbst zu überlegen und zu sprechen: „Was habe ich zu zweifeln, der ich so gefestigt bin vom Herrn und seine herrlichen Werke geschaut habe?“ 5. Ich ging ein wenig vorwärts, Brüder, und da sah ich Staub gleichsam bis zum Himmel aufsteigen, und ich begann bei mir selbst zu sprechen: Kommen denn Tiere und machen Staub? Es war von mir etwa ein Stadium weg. 6. Als aber die Staubwolke größer und größer wurde, merkte ich, dass es etwas Göttliches sei; einen Augenblick leuchtete die Sonne auf, und da sah ich ein großes Tier wie ein Meerungeheuer, und aus seinem Maule kamen feurige Heuschrecken hervor. Das Tier hatte eine Länge von ungefähr hundert Fuß, und sein Kopf war wie aus Ton. 7. Und ich fing an zu weinen und den Herrn zu bitten, er wolle mich von ihm erlösen.; da erinnerte ich mich des Wortes, das ich gehört hatte: Zweifle nicht, Hermas! 8. Da wappnete ich mich, Brüder, mit dem Glauben des Herrn und erinnerte mich an seine erhabenen Lehren, und so ermutigt, begab ich mich zu dem Tiere. Es kam aber das Tier daher mit einer Gewalt, dass es hätte eine ganze Stadt verwüsten können. 9. Ich ging auf das Tier zu, da streckte sich das riesige Ungeheuer auf den Boden aus, zeigte nur noch die Zunge und regte sich überhaupt nicht, bis ich an ihm vorbeigegangen war. 10. Das Tier hatte aber vier Farben am Kopfe: schwarz, feurig- und blutigrot, golden und weiß.</p><p>1. Als ich aber an dem Tiere vorbeigegangen war und es ungefähr dreißig Schritte hinter mir hatte, begegnete mir eine Jungfrau, geschmückt, wie wenn sie aus dem Brautgemach käme, ganz in Weiß gekleidet auch die Sandalen waren weiß, verschleiert bis zur Stirne, am Kopfbund war ihr Schleier; sie hatte aber weißes Haar. 2. Ich wusste aber aus den früheren Erscheinungen, dass es die Kirche war, und wurde froh. Sie grüßte mich mit den Worten: „Sei gegrüßt, Mann.“ Ich erwiderte ihren Gruß: „Herrin, sei gegrüßt.“ 3. Sie antwortete mir: „Ist dir nichts begegnet?“ Ich sagte ihr: „Ja Herrin, so ein großes Tier, dass es ganze Völker vernichten kann; aber durch des Herrn Macht und seine Barmherzigkeit bin ich ihm entronnen.“ 4. „Du kamst gut davon“, fuhr sie fort, „weil du deine Sorge auf den Herrn geworfen und dein Herz für den Herrn geöffnet hast im Vertrauen, dass du durch nichts anderes gerettet werden kannst als durch den großen und herrlichen Namen. Deshalb hat Gott seinen Engel, der über die Tiere gesetzt ist und dessen Name Thegri heißt, abgesandt, und dieser hat dem Tiere das Maul verschlossen, damit es dir nichts zuleid tue. Du bist einer großen Trübsal entronnen durch deinen Glauben, weil du beim Anblick des Ungeheuers nicht verzweifeltest. 5. So gehe denn hin, erkläre den Erwählten des Herrn seine Großtaten und sage ihnen, dass dieses Tier ein Abbild ist der großen Trübsal, die kommen wird; wenn ihr nun euch vorher bereit haltet und aus eurem ganzen Herzen zum Herrn euch bekehret, werdet ihr derselben entrinnen können, wenn euer Herz rein wird und ohne Sünde und wenn ihr die übrigen Tage eures Lebens dem Herrn untadelig dienet. Werfet eure Sorge auf den Herrn, und er selbst wird sie in Ordnung bringen! 6. Glaubet dem Herrn, ihr Zweifler, dass er alles kann, dass er seinen Zorn wegwendet von euch und dass er Geißeln senden wird für euch, die Zweifler. Wehe denen, die diese Worte hören und sie verwerfen! Es wäre besser für sie, sie wären nicht geboren!“</p><p>1. Ich fragte sie nach den vier Farben, die das Tier an seinem Kopfe hatte. Sie erwiderte mir: „Wiederum bist du neugierig nach diesen Dingen.“ „Ja, Herrin“, versetzte ich, „künde mir, was dies zu bedeuten hat.“ 2. „So höre“, erwiderte sie, „das Schwarze bedeutet diese Welt, in der ihr wohnet; 3. das Feurige und Blutige aber, dass diese Welt durch Blut und Feuer zugrunde gehen muss. 4. Der goldige Teil aber seid ihr, die ihr dieser Welt entronnen seid; denn wie das Gold durch das Feuer erprobt und brauchbar wird, so werdet auch ihr erprobt, die ihr unter ihnen (den Leuten dieser Welt) lebet. Wenn ihr nun ausharret und von ihnen durch das Feuer erprobt seid, werdet ihr gereinigt werden. Wie nämlich das Gold, was an ihm unrein ist, abwirft, so werdet auch ihr alle Trauer und alle Angst ablegen, und ihr werdet gereinigt und brauchbar werden für den Bau des Turmes. 5. Der weiße Teil aber ist die kommende Welt, in der die Erwählten Gottes wohnen werden, weil die von Gott zum ewigen Leben Auserkorenen fleckenlos und rein sein werden. 6. Versäume nun nicht, den Heiligen es recht zu sagen. Ihr habt nun auch das Abbild der großen Trübsal, die kommen wird. Wenn ihr aber guten Willen habt, wird sie nichts zu bedeuten haben. Denket an das, was weiter oben niedergeschrieben worden ist.“ 7. Nach diesen Worten entfernte sie sich, und ich konnte nicht sehen, wohin sie ging; es erhob sich nämlich ein Getöse; und ich wandte mich rückwärts vor Angst, weil ich glaubte, das Tier käme</p><h2>Fünftes Gesicht</h2><p>1. Als ich in meinem Hause betete und mich auf mein Lager niedergelassen hatte, trat ein Mann herein mit einem vornehmen Gesichtsausdruck; er kam in einem Hirtengewand, hatte ein weißes Ziegenfell umgeworfen, trug eine Tasche über die Schultern und einen Stab in der Hand. Er grüßte mich, und ich grüßte ihn wieder. 2. Und sogleich setzte er sich neben mich und sagte mir: „Ich bin gesandt von dem ehrwürdigsten Engel, dass ich den Rest deiner Lebenstage bei dir wohne.“ 3. Ich war der Meinung, er sei gekommen, um mich auf die Probe zu stellen und entgegnete ihm: Wer bist du denn? Denn ich kenne den“, sagte ich, „dem ich übergeben worden bin.“ Er versetzte: „Kennst du mich nicht?“ „Nein“, entgegnete ich. „Ich bin“, lautete seine Antwort, „der Hirte, dem du übergeben worden bist.“ 4. Während er noch redete, veränderte sich seine Gestalt, und ich erkannte ihn als den, dem ich übergeben worden war, und sogleich fuhr ich zusammen, Furcht ergriff mich, und ich brach ganz zusammen aus Trauer darüber, dass ich ihm eine so schlechte und ungeschickte Antwort gegeben hatte. 5. Er aber erwiderte mir: „Sei nicht verzagt, sondern werde stark durch die Vorschriften, die ich dir geben werde! Ich wurde nämlich gesandt“, fuhr er fort, „damit ich dir alle Gesichte, die du früher schon geschaut hast, noch einmal zeige, und zwar das Wichtigste, das euch von Nutzen ist. Vor allem sollst du meine Gebote und die Gleichnisse aufschreiben; das andere sollst du, so wie ich es dir zeigen werde, aufschreiben; ich verlange von dir deshalb zuerst die Niederschrift der Gebote und Gleichnisse, damit du sie hernach lesest und sie beobachten kannst.“ 6. So habe ich also seinem Auftrag gemäß die Gebote und Gleichnisse niedergeschrieben. 7. Wenn ihr nun dieselben höret, beobachtet, in ihnen wandelt und sie erfüllt mit reinem Herzen, werdet ihr vom Herrn empfangen alles, was er euch versprochen hat; wenn ihr sie aber höret und euch nicht bekehret, sondern in euren Sünden weitermachet, werdet ihr das Gegenteil vom Herrn erhalten. Dies alles so aufzuschreiben, befahl mir der Hirte, der Engel der Buße.</p><h2>Erstes Gebot: Glaube an den einen Gott und fürchte ihn!</h2><p>1. „Fürs allererste: glaube, dass es <strong>einen</strong> Gott gibt, der alles erschaffen und vollendet und aus Nichts gemacht hat, dass es sei, indem er auch alles umfasst, während er allein unfassbar ist, 2. Ihm also glaube und fürchte ihn, aus Furcht sei enthaltsam. Dies halte, und du wirst jegliche Schlechtigkeit von dir werfen, und du wirst anziehen jegliche Tugend der Gerechtigkeit und (für) Gott leben, wenn du dieses Gebot hältst.“</p><h2>Zweites Gebot: Fliehe die Verleumdung; tue Gutes!</h2><p>1. Er sagte mir: „Sei geraden Sinnes und werde fehlerlos, dann wirst du sein wie die kleinen Kinder, welche die Schlechtigkeit nicht kennen, die das Leben der Menschen zerstört. 2. Vor allem verleumde niemanden und höre dem Verleumder nicht gerne zu; sonst wirst auch du, der Hörer, Teil haben an der Sünde des Verleumders, wenn du der Verleumdung Glauben schenkst, die du hörst. Denn wenn du es glaubst, wirst du selbst eingenommen sein gegen deinen Bruder. Auf diese Weise also wirst du Teil haben an der Sünde des Verleumders. 3. Es ist etwas Schlechtes um die Verleumdung, sie ist ein unruhiger, böser Geist, der niemals Friede hält, sondern stets bei Zwistigkeiten wohnt. Halte dich also fern von ihm, und du wirst stets Ansehen genießen bei allen. 4. Umgib dich mit Würde, die nichts Schlimmes (und) Anstößiges an sich hat, sondern in allem gerade und freudig ist. Tue Gutes und gib vom Segen deiner Arbeit, den Gott dir gibt, allen Bedürftigen schlechthin, ohne zu fragen, wem du geben und wem du nicht geben sollst. Gib allen; denn Gott will, dass man allen von seinen eigenen Geschenken gibt. 5. Die Empfänger aber müssen Gott Rechenschaft geben, warum und wozu sie empfangen haben; wer nämlich in der Not eine Gabe empfangen hat, wird nicht gerichtet werden, wer aber Unterstützungen erheuchelt, wird bestraft werden. 6. Der Geber ist frei von Schuld; denn wie er vom Herrn seinen Dienst zur Erledigung bekommen hat, so hat er ihn einfach erledigt, ohne zu untersuchen, wem er geben und wem er nicht geben solle. Und dieser einfach erledigte Dienst ist ehrenvoll geworden vor Gott. Wer demnach so einfach seinen Dienst erfüllt, wird (in) Gott leben. 7. Halte also dieses Gebot, wie ich es dir gesagt habe, damit deine und deines Hauses Bekehrung als aufrichtig erfunden werde und dein Herz rein und unbefleckt sei.“</p><h2>Drittes Gebot: Lüge nicht!</h2><p>1. Wiederum sprach er zu mir: „Die Wahrheit liebe, und nur wahre Rede komme aus deinem Munde, damit der Geist, den Gott in dieses Fleisch gepflanzt hat, als wahr(haftig) erfunden werde vor allen Menschen; dadurch wird dann der Herr, der in dir wohnt, verherrlicht werden; denn der Herr ist wahrhaft in jedem Worte, und bei ihm gibt es keine Lüge. 2. Die Lügner verleugnen demnach den Herrn und betrügen ihn, da sie ihm das anvertraute Gut, das sie empfingen, nicht zurückgeben. Denn sie bekamen von ihm einen wahrhaften Geist. Wenn sie diesen als lügnerischen Geist zurückgeben, dann haben sie den Auftrag des Herrn nicht gehalten und sind Betrüger geworden.“ 3. Als ich nun dieses hörte, musste ich laut weinen. Wie er mich weinen sah, fragte er: „Warum weinst du?“ „O Herr“, erwiderte ich, „weil ich nicht weiß, ob ich gerettet werden kann.“ „Warum?“ fragte er. „Niemals nämlich, o Herr“, fuhr ich fort, „habe ich in meinem Leben ein wahres Wort gesprochen, sondern stets war mein Leben mit jedermann voller Ränke und List, und meine Lüge habe ich bei allen Menschen für Wahrheit ausgegeben; und nie hat mir jemand widersprochen, vielmehr glaubte man meinem Worte. Wie nun, o Herr, kann ich das Leben bekommen nach solchem Tun?“ 4. „Du denkst gut und wahr“, erwiderte er; „du hättest nämlich wie ein Diener Gottes in Wahrheit wandeln sollen, und ein schlechtes Gewissen hätte nicht zusammenwohnen sollen mit dem Geiste der Wahrheit und hätte dem erhabenen und wahren Geiste kein Leid zufügen sollen.“ „Nie, o Herr“, sagte ich, „habe ich solche Worte klar und deutlich gehört.“ 5. „Jetzt aber“, versetzte er, „hörst du sie; befolge sie, damit auch das, was du früher bei deinen Geschäften gelogen hast, wenn das jetzige als wahr erfunden wird, auch jenes glaubhaft werde; denn es kann glaubhaft werden. Wenn du dies beobachtest und von jetzt ab nur Wahrheit redest, so kannst du dir das Leben erwerben; und wer immer dieses Gebot hört und sich frei hält von der verwerflichen Lüge, der wird das Leben haben bei Gott.“</p><h2>Viertes Gebot</h2><p>1. „Ich gebiete dir“, fuhr er fort, „die Keuschheit zu bewahren, und es soll in deinem Herzen keine Begierde &lt;206&gt; aufsteigen nach dem Weibe eines anderen oder nach einer unzüchtigen Handlung oder sonst einer derartigen Schlechtigkeit. Wenn du nämlich dies tust, begehst du eine große Sünde. Wenn du aber allezeit an deine eigene Frau denkst, so sündigst du niemals. 2. Wenn nämlich jene Begierde in deinem Herzen aufsteigt, sündigst du, und auch wenn sonst solche schlechte Dinge (in deinem Herzen aufsteigen), begehst du eine Sünde; denn eine solche Begierde ist für einen Diener Gottes eine große Sünde; wenn aber einer diese böse Tat vollbringt, dann zieht er sich den Tod zu. 3. Siehe also du zu! Enthalte dich von dieser Begierde; wo immer nämlich die Heiligkeit zu Hause ist, dort darf die Sünde nicht in das Herz eines gerechten Mannes kommen.“ 4. Ich erwiderte ihm: „Herr, gestatte mir, einige Fragen an dich zu richten.“ „Rede“, sprach er. „Wenn“, so sprach ich, „wenn, o Herr, einer eine im Herrn gläubige Frau hat und diese bei einem Ehebruch ertappt, sündigt der Mann, wenn er weiter mit ihr zusammenlebt?“ 5. „Solange er nichts davon weiß“, antwortete er, „sündigt er nicht; wenn aber der Mann von ihrer Sünde Kenntnis erhalten hat und wenn sich die Frau nicht bekehrt, sondern in ihrer ehelichen Untreue verharrt und der Mann mit ihr zusammenlebt, dann bekommt er Teil an ihrer Sünde und ist mitschuldig an ihrem Ehebruch.“ 6. „Was nun, o Herr“, fragte ich weiter, „soll der Mann tun, wenn die Frau in dieser Leidenschaft verharrt?“ „Dann soll er sie entlassen“, sagte er, „und der Mann soll für sich bleiben; wenn er aber seine Frau entlässt und eine andere heiratet, dann bricht er selbst die Ehe.“ 7. „Wenn nun, Herr“, sagte ich, „die Frau nach ihrer Entlassung sich bekehrt und zu ihrem rechten Manne zurückkehren will, darf sie nicht aufgenommen werden?“ 8. „Aber freilich“, antwortete er; „wenn der Mann sie nicht wieder aufnimmt, sündigt er, und zwar zieht er sich eine große Sünde zu; vielmehr muss man den Sünder, der Buße tut, aufnehmen, aber nicht mehrere mal; denn für die Diener Gottes gibt es nur eine einzige Buße. Wegen der Buße nun darf der Mann nicht (eine andere) heiraten. Diese Vorschrift gilt für Mann und Weib. 9. Es ist nicht nur Ehebruch, wenn einer sein eigenes Fleisch befleckt, sondern die Ehe bricht auch der, welcher Ähnliches tut wie die Heiden. Wenn also einer in solchen Werken verharrt und sich nicht bekehrt, dann bleibe ihm fern und lebe nicht mit ihm zusammen; andernfalls hast auch du Teil an seiner Sünde. 10. Deshalb habt ihr die Vorschrift erhalten, für euch zu bleiben, Mann wie Weib; es kann nämlich auch in solchen Fällen eine Buße geben. 11. Ich will aber“, fuhr er fort, „damit nicht Anlass geben, dass dieser Fall tatsächlich vorkomme, sondern nur, dass einer, der gesündigt hat, nicht weiter sündige. Für seine frühere Sünde aber gibt es einen, der die Macht hat, Heilung zu geben; er ist ja der, welcher Macht hat über alle Dinge.“</p><p>1. Wiederum fragte ich ihn, indem ich sprach: „Da der Herr mich gewürdigt hat, dass du die ganze Zeit bei mir weilest, so lass dir noch einige Worte von mir gefallen, weil ich nichts verstehe und mein Herz verhärtet ist infolge meiner früheren Taten; belehre mich, da ich gar unverständig bin und überhaupt nichts begreife.“ 2. Er antwortete mir und sprach: „Ich bin über die Buße gesetzt, und allen, die Buße tun, gebe ich Erkenntnis. Oder scheint es dir nicht“, fuhr er fort, „dass eben die Buße - Erkenntnis ist? Buße tun“, sagte er, „ist große Erkenntnis; denn der Sünder erkennt, dass er das Böse getan hat vor dem Herrn und in seinem Herzen regt sich die Tat, die er begangen, er bekehrt sich, tut nicht mehr das Böse, sondern verlegt sich mit Eifer auf das Gute, demütigt seine Seele und quält sich ab, weil er gesündigt. Du siehst also, in der Buße liegt große Erkenntnis.“ 3. „Deshalb frage ich ja, o Herr, bei dir genau nach allem; besonders deshalb, weil ich ein Sünder bin, damit ich erkenne, was ich tun muss, um das Leben zu erlangen; denn meiner Sünden sind es viele und verschiedenartige.“ 4. „Du wirst das Leben haben“, versetzte er, „wenn du meine Gebote hältst und in ihnen wandelst; jeder, der diese Gebote hört und sie hält, wird leben in Gott.“</p><p>1. „Noch mehr, o Herr, möchte ich fragen.“ „Rede“, sagte er. „Herr, ich habe von einigen Lehrern gehört, dass es keine andere Buße gibt als die, da wir ins Wasser stiegen und Vergebung unserer früheren Sünden erhielten.“ 2. „Es ist richtig, was du gehört hast“, erwiderte er; „es verhält sich so. Denn wer die Vergebung seiner Sünden erlangt hat, der sollte nicht mehr sündigen, sondern in Heiligkeit leben. 3. Da du aber genau nach allem fragst, so will ich dir auch dieses kund tun, ohne jedoch ein Anrecht denen zu geben, welche den Glauben an den Herrn in Zukunft annehmen werden oder ihn eben angenommen haben. Denn für die, welche eben jetzt gläubig wurden oder erst gläubig werden, gibt es keine Buße für die Sünden, sie bekommen nur Nachlas ihrer früheren Sünden. 4. Aber für die vor unseren Tagen Berufenen hat der Herr eine Buße eingesetzt; da er ein Kenner der Herzen ist und alles vorher weiß, kannte er die Schwachheit der Menschen und die Verschmitztheit des Teufels, dass er den Dienern Gottes Böses zufügen und schlecht an ihnen handeln wird. 5. In seiner Milde erbarmte sich der Herr über seine Geschöpfe und setzte diese Buße ein, und mir hat er die Gewalt über diese Buße verliehen. 6. Ich sage dir aber: wenn nach jener großen und heiligen Berufung einer vom Teufel verführt wird und sündigt, so gibt es für ihn nur noch eine Buße; wenn er aber weiter macht im Sündigen und dann Buße tut, so hat das keinen Wert für einen solchen Menschen; nur schwerlich wird er das Leben erhalten.“ 7. Da sprach ich zu ihm: „Ich atmete ganz auf, als ich dieses so genau von dir hörte; denn ich weiß, dass ich gerettet werde, wenn ich nicht mehr sündige.“ „Du wirst gerettet werden“, bemerkte er, „und alle, die so handeln.“</p><p>1. Nochmals fragte ich ihn, indem ich sagte: „Herr, da du mich nun einmal ertragen hast, so offenbare mir auch noch dieses.“ „Rede“, sprach er. „Wenn eine Frau oder umgekehrt ein Mann entschlafen ist und der überlebende Teil von ihnen wieder heiratet, sündigt er, wenn er sich wieder verheiratet?“ 2. „Er sündigt nicht“, antwortete er; „wenn er aber für sich bleibt, verschafft er sich selbst überreiche Ehre und großes Ansehen bei dem Herrn; aber auch wenn er heiratet, sündigt er nicht. 3. Bewahre also die Keuschheit und Heiligkeit, und du wirst leben in Gott. Beobachte von jetzt ab all das, was ich dir sage und noch sagen werde, von dem Tage an, da du mir übergeben wurdest und ich in deinem Hause wohnen werde. 4. Für deine früheren Fehltritte wirst du Vergebung erhalten, wenn du meine Gebote hältst; und allen wird Vergebung zuteil werden, wenn sie diese meine Gebote halten und in dieser Reinheit wandeln.“</p><h2>Fünftes Gebot</h2><p>1. „Werde langmütig und verständig“, fuhr er fort, „und du wirst erhaben sein über alle bösen Werke und nur Gerechtigkeit üben. 2. Wenn du nämlich langmütig bist, dann wird der in dir wohnende Heilige Geist rein sein, nicht verdunkelt von einem anderen bösen Geiste, sondern in einer geräumigen Behausung wohnend wird er frohlocken und freudig sein mit dem Gefäße, in dem er wohnt, und er wird Gott dienen mit vieler Freude, da er sein Glück in sich selbst hat. 3. Wenn aber irgendwie der Jähzorn sich einnistet, dann wird es alsbald dem Heiligen Geiste, der zart ist, zu enge, da er keinen reinen Wohnort mehr hat, und er sucht von da auszuziehen. Der böse Geist sucht ihn nämlich zu ersticken, indem der Zorn ihn vergewaltigt, und so kann er dem Herrn nicht mehr dienen, wie er will. Denn in der Langmut wohnt Gott, in der Zornmütigkeit aber der Teufel. 4. Wenn nun beide Geister in einem Menschen zusammenwohnen, so ist das unzuträglich und schädlich für den, in dem sie wohnen. 5. Wenn du nämlich nur ein ganz klein wenig Absinth nimmst und ihn in einen Topf voll Honig schüttest, ist dann nicht der ganze Honig verdorben? Und zwar wird eine solche Menge Honig von dem bisschen Absinth verdorben, er nimmt dem Honig seine Süßigkeit, und dieser schmeckt dem Herrn nicht mehr, weil ihm etwas beigemischt und er so ungenießbar wurde. Wenn aber der Absinth dem Honig nicht beigegeben wird, dann behält er seine Süßigkeit und ist dem Herrn wohlbekömmlich. 6. Du siehst also, dass die Langmut viel süßer ist als Honig und dass sie gar genehm ist für den Herrn und dass er in ihr wohnt. Der Jähzorn aber ist bitter und unnütz. Wenn sich nun der Zorn vermischt mit der Langmut, dann wird diese verdorben, und das Dazukommen jenes ist dem Herrn nicht genehm.“ 7. „Ich möchte gern, o Herr, die Wirkung des Jähzorns kennen lernen“, fuhr ich fort, „damit ich mich vor ihm hüte.“ „Fürwahr“, entgegnete er, „wenn du dich vor ihm nicht hütest mit deinem Hause, dann ist all deine Hoffnung dahin. So hüte dich also vor ihm; denn ich bin mit dir. Und auch alle, die sich von ganzem Herzen bekehren, werden sich von ihm enthalten; denn auch mit ihnen werde ich sein und werde sie bewahren; denn sie alle wurden gerechtfertigt von dem heiligsten Engel.“</p><p>1. „So vernimm nun“, fuhr er fort, „die Wirkung des Zornes, wie verderblich er ist und wie er durch seine Wirkung die Diener Gottes verführt und dieselben von der Gerechtigkeit abwendet. Zwar verführt er die Vollkommenen im Glauben nicht, noch kann er Einfluss auf sie gewinnen, weil die Macht des Herrn mit ihnen ist; aber er verführt die leeren und schwankenden Menschen. 2. Wenn er nämlich solche Leute in Zufriedenheit leben sieht, stiehlt er sich in das Herz dieses Menschen und wegen nichts gerät der Mann oder die Frau in Erbitterung um alltäglicher Dinge willen: über eine Speise, über sonst eine Kleinigkeit, über einen Freund, ob man etwas geben oder nehmen soll, und über ähnliche Torheiten; denn all das sind törichte, eitle, sinnlose und unnütze Dinge für die Diener Gottes. 3. Die Langmut aber ist groß, gefestigt, von großer Kraft, stark, in weitem Umkreis in Ansehen, freudig, fröhlich, sorglos, allezeit den Herrn preisend, ohne Bitternis im Innern, in allem milde und ruhig bleibend. Diese Langmut also wohnt bei denen, die den vollkommenen Glauben haben. 4. Der Zorn aber ist vor allem töricht, leichtsinnig und unverständig. Sodann entsteht aus dem Unverstand Bitterkeit, aus der Bitterkeit Erregung, aus der Erregung Zorn, aus dem Zorn Wut; diese Wut, die aus so großen Fehlern sich zusammensetzt, wird zu einer großen, unheilbaren Sünde. 5. Wenn nämlich diese Geister in <strong>einem</strong> Gefäße wohnen, in dem auch der Heilige Geist seinen Sitz hat, dann genügt jenes Gefäß nicht, sondern es ist überfüllt. 6. Der zarte Geist nun, der weder mit dem schlechten Geiste noch mit der Hartherzigkeit zusammenwohnen kann, zieht von einem solchen Menschen aus und sucht sich bei Milde und Ruhe eine Wohnung. 7. Wenn er dann seine frühere Wohnung bei jenem Menschen verlassen hat, ist dieser von dem guten Geiste verlassen und ganz angefüllt von den bösen Geistern; dadurch verliert er jeglichen Halt in all seinem Tun, wird dahin und dorthin getrieben von den bösen Geistern und wird verblendet, weil er der guten Einsicht bar geworden ist. So nun geht es allen Jähzornigen. 8. Darum halte dich frei vom Jähzorn, diesem gar schlechten Geiste; ziehe vielmehr die Langmut an und widerstehe dem Zorn und der Bitterkeit, und du wirst gefunden werden bei den Heiligen, die der Herr liebt. Siehe also zu, dass du dieses Gebot nie missachtest; denn wenn du dieses Gebot beherrschest, wirst du auch die übrigen halten können, die ich dir noch geben werde. Sei stark und mächtig in ihnen, auch alle (anderen) werden gestärkt werden, welche in ihnen zu wandeln entschlossen sind.“</p><h2>Sechstes Gebot</h2><p>1. „In dem ersten Gebote“, fuhr er fort, „habe ich dir aufgetragen, den Glauben, die Furcht und die Enthaltsamkeit zu bewahren.“ „Ja, Herr“, versetzte ich. „Aber jetzt will ich dir auch ihre Bedeutung mitteilen“, sagte er, „damit du auch erkennst, welche Bedeutung und welche Wirkung jedes von ihnen hat; zweifach sind nämlich die Wirkungen derselben; sie liegen auf dem Gebiete des Rechten und des Unrechten. 2. Du sollst dem Rechten vertrauen, aber nicht dem Unrechten; denn das Gerechte hat einen geraden Weg, das Unrechte einen verkehrten. Du sollst den rechten, ebenen Weg gehen, den verkehrten sollst du meiden. 3. Denn der verkehrte Weg hat keine (gepflegten) Pfade, sondern er ist nicht gangbar, bietet vielfachen Anstoß, er ist rauh und dornig; so schadet er denen, die ihn begehen. 4. Die aber auf dem rechten Wege wandeln, gehen eben und ohne Anstoß dahin; er ist auch nicht rauh und dornig. Du siehst also, dass es nützlicher ist, auf diesem Wege zu gehen.“ 5. „Mir gefällt es, o Herr, gut, diesen Weg einzuschlagen.“ „Du wirst ihn gehen“, sprach er, „und jeder, der sich von ganzem Herzen zum Herrn bekehrt, wird ihn gehen.“</p><p>1. „So höre mich denn“, fuhr er weiter, „an über den Glauben. Zwei Engel sind bei dem Menschen, einer der Gerechtigkeit und einer der Schlechtigkeit.“ 2. „Wie nun“, unterbrach ich, „wie nun soll ich, o Herr, ihre Wirkungen erkennen, da doch beide Engel in mir wohnen?“ 3. „Höre“, erwiderte er, „und lerne sie kennen. Der Engel der Gerechtigkeit ist zart, schamhaft, milde und ruhig; wenn nun dieser in deinem Herzen sich regt, spricht er sogleich mit dir über Gerechtigkeit, Keuschheit, Heiligkeit, Genügsamkeit, über jegliche gerechte Tat und über jede rühmliche Tugend. Wenn all dies in deinem Herzen sich regt, dann wisse, dass der Engel der Gerechtigkeit mit dir ist. Denn das sind die Werke des Engels der Gerechtigkeit, diesem also vertraue und seinen Werken. 4. Betrachte nun auch die Werke des Engels der Schlechtigkeit. Er ist vor allem jähzornig, verbittert und unverständig, seine Werke sind böse und verführen die Diener Gottes; wenn also dieser sich in deinem Herzen regt, dann erkenne ihn an seinen Werken.“ 5. „Ich verstehe nicht, o Herr, wie ich ihn erkennen soll.“ „So höre“, sprach er. „Wenn ein Jähzorn an dich kommt oder eine Erbitterung, dann wisse, dass er in dir ist; ferner wenn Begierden kommen, allerlei zu treiben, und mannigfache Ausgaben für reichliche Tafelgenüsse, häufiges und übermäßiges Trinken, für allerlei Leckerbissen und unnötige Dinge, Begierden nach Frauen und Reichtümern; ein übermäßiger Stolz und Prahlerei, und alles, was diesen verwandt und ähnlich ist: wenn also derlei Gedanken in deinem Herzen aufsteigen, dann wisse, dass der Engel der Schlechtigkeit in dir ist. 6. Wenn du dann seine Werke erkannt hast, dann sage dich los von ihm und vertraue ihm nicht, weil seine Werke schlecht und den Dienern Gottes schädlich sind. Nun hast du die Wirkungen beider Engel. Lerne sie kennen und vertraue dem Engel der Gerechtigkeit. 7. Von dem Engel der Schlechtigkeit sage dich los, weil seine Lehre schädlich ist in jedem Stücke; wenn nämlich jemand ein gläubiger Mann ist und die Gesinnung dieses Engels in sein Herz dringt, dann muss dieser Mann oder diese Frau einen Fehltritt tun. 8. Wenn dagegen einer ein ganz böser Mann oder eine ganz böse Frau ist und in sein Herz die Werke des Engels der Gerechtigkeit dringen, dann muss er notgedrungen etwas Gutes tun. 9. Du siehst also“, sprach er weiter, „dass es gut ist, dem Engel der Gerechtigkeit zu folgen, von dem der Schlechtigkeit aber sich abzukehren; 10. Soviel eröffnet dieses Gebot über den Glauben, damit du den Werken des Engels der Gerechtigkeit vertrauest und sie erfüllest und so in Gott lebest. Glaube aber, dass die Werke des Engels der Schlechtigkeit böse sind, tue sie nicht, und du wirst leben in Gott.“</p><h2>Siebtes Gebot: Von der Gottesfurcht</h2><p>1. „Fürchte den Herrn“, sprach er, „und halte seine Gebote; wenn du nämlich die Gebote Gottes hältst, wirst du mächtig sein in all deinem Tun, und dieses wird unvergleichlich sein. Denn in der Furcht des Herrn wirst du alles trefflich machen. Das ist die Furcht, die du haben musst, um das Heil zu erlangen. 2. Den Teufel sollst du nicht fürchten; denn in der Furcht des Herrn wirst du den Teufel überwinden, weil er keine Macht besitzt. Wer aber keine Macht hat, den braucht man auch nicht zu fürchten; wessen Macht aber anerkannt ist, vor dem hat man auch Furcht. Jeder, der Macht hat, flößt auch Furcht ein; nur wer machtlos ist, wird allgemein übersehen. 3. Furcht haben sollst du vor des Teufels Werken, weil sie böse sind. Wenn du nun den Herrn fürchtest, fürchtest du auch die Werke des Teufels und tust sie nicht, sondern hältst dich fern von ihnen. 4. Demnach gibt es also eine zweifache Furcht: fürchte den Herrn, wenn du etwas Böses tun willst, dann wirst du es nicht tun; wenn du aber etwas Gutes tun willst, so fürchte den Herrn, und du wirst es tun. So ist die Furcht des Herrn stark, mächtig und rühmlich. Fürchte also den Herrn, und du wirst ihm leben; und alle, die ihn fürchten und seine Gebote halten, werden in Gott leben.“ 5. „Warum, Herr“, fragte ich, „sagtest du von denen, die seine Gebote halten: Sie werden in Gott leben?“ „Weil“, entgegnete er, „weil jedes Geschöpf den Herrn zwar fürchtet, aber seine Gebote nicht hält. Wer aber ihn fürchtet und seine Gebote hält, der wird das Leben haben bei Gott; wer aber seine Gebote nicht hält, der wird auch das Leben nicht haben.“</p><h2>Achtes Gebot: Von der Enthaltsamkeit</h2><p>1. „Ich habe dir gesagt“, sprach er weiter, „dass die Geschöpfe Gottes zwei Seiten haben. So hat auch die Enthaltsamkeit zwei Seiten: von einigen Dingen muss man sich nämlich enthalten, von anderen aber nicht.“ 2. „Sage mir, o Herr, von welchen Dingen man sich enthalten und von welchen man sich nicht enthalten muss.“ „Vernimm es; dem Bösen bleib fern und tu es nicht; vom Guten aber bleibe nicht weg, sondern tue es, [denn wenn du dem Guten ferne bleibst und es nicht tust, begehst du eine große Sünde]. Wenn du dich also beherrschst und das Böse nicht tust, erfüllst du große Gerechtigkeit. Darum halte dich fern von jeder Schlechtigkeit und vollbringe das Gute.“ 3. „Welches sind nun aber, o Herr, die bösen Dinge“, fragte ich, „deren wir uns enthalten müssen?“ „Höre“, versetzte er; „von Ehebruch und Hurerei, von maßlosem Trunk, von sündhaftem Wohlleben, von häufigen Tafelgenüssen, von Verschwendung des Reichtums, von Prahlerei, Einbildung und Stolz, von Lüge, Verleumdung und Heuchelei, von übler Nachrede und jeglicher Lästerung. 4. Das sind die allerschlimmsten Werke im Leben des Menschen; deshalb muss sich auch ein Diener Gottes fern halten von ihnen. Denn wer sich einlässt auf diese Dinge, kann nicht in Gott leben. Vernimm auch noch, welche Dinge sie nach sich ziehen.“ 5. „Gibt es denn“, fragte ich, „noch andere böse Werke?“ „Gewiss, und zwar noch viele gibt es“, antwortete er, „deren ein Diener Gottes sich enthalten muss: Diebstahl, Lüge, Raub, falsches Zeugnis, Gewinnsucht, böse Begierlichkeit, Trug, Eitelkeit, Prahlerei und was sonst dem ähnlich ist. 6. Hast du nicht den Eindruck, dass diese Dinge bös sind, und zwar sehr bös für die Diener Gottes? Wer Gott dienen will, darf nichts von all diesem tun. Also halte dich frei von allen diesen Dingen, damit du lebest in Gott und dein Name einmal stehe bei denen, die in diesen Stücken sich beherrscht haben. Nun folgen die Dinge, die man nicht zu meiden braucht. 7. Höre, was man nicht lassen, sondern tun muss. Das Gute unterlasse nicht, sondern vollbringe es.“ 8. „Künde mir auch, Herr, die Bedeutung der guten Dinge, damit ich in ihnen wandle und ihnen diene und dadurch das Heil erlangen könne.“ „So höre auch die guten Werke, die du tun musst und nicht unterlassen darfst. 9. Vor allem ist es der Glaube, die Furcht des Herrn, Liebe, Eintracht, gerechte Rede, Wahrheit, Geduld; etwas Besseres als dies gibt es nicht im Leben des Menschen. Wenn einer dieses tut und nicht unterlässt, wird er glückselig in seinem Leben. 10. Höre auch, was diese Tugenden nach sich ziehen: den Witwen beistehen, Waisen und Unglückliche besuchen, die Diener Gottes aus Bedrängnis befreien, Gastfreundschaft üben (in der Ausübung der Gastfreundschaft findet man einmal Wohltätigkeit), mit niemand Feindschaft halten, in Ruhe leben, sich kleiner machen als alle (anderen) Menschen, das Alter ehren, die Gerechtigkeit üben, die Bruderliebe pflegen, Übermut erdulden, langmütig sein, Unrecht nicht nachtragen, die Niedergeschlagenen trösten, die im Glauben Strauchelnden nicht verstoßen, sondern zurückbringen und ihnen das Gleichgewicht der Seele geben, die Fehlenden zurechtweisen, die Schuldner und die Bedürftigen nicht drängen und noch vieles dieser Art. 11. Dünkt dich dies gut?“ „Was soll es denn Besseres geben als dies, o Herr?“ „So wandle denn“, fuhr er fort, „in ihnen und halte dich nie fern von ihnen, dann wirst du das Leben haben in Gott. 12. Halte also dieses Gebot; wenn du das Gute tust und es nicht meidest, wirst du in Gott leben, und auch alle, die so handeln, werden in Gott leben. Noch einmal (sage ich dir), wenn du das Böse nicht tust und dich davon frei hältst, wirst du in Gott leben, ebenso werden alle in Gott leben, welche diese Gebote halten und in ihnen wandeln.“</p><h2>Neuntes Gebot: Über das vertrauensvolle Gebet</h2><p>1. Er sagte mir: „Wirf weg von dir allen Zweifel und jegliches Bedenken, etwas von dem Herrn zu erbitten, indem du bei dir sprichst: wie kann ich etwas von dem Herrn erbitten und erlangen, da ich so sehr gegen ihn gesündigt habe? 2. Mach dir darüber keine Gedanken, sondern wende dich von ganzem Herzen an deinen Herrn und bitte ihn ohne Bedenken, und du wirst seine Barmherzigkeit kennen lernen, dass er dich gewiss nicht verlässt, sondern die Bitte deines Herzens erfüllen wird. 3. Denn Gott ist nicht wie die Menschen, die Böses nachtragen, vielmehr verzeiht er und erbarmt sich seines Geschöpfes. 4. Reinige also dein Herz von allen Eitelkeiten dieser Welt, auch von den oben erwähnten Bedenken; dann flehe zum Herrn, und du wirst alles erhalten, und keine deiner Bitten wird fehlschlagen, wenn du sie vertrauensvoll an ihn richtest. 5. Wenn du aber zweifelst in deinem Herzen, wirst du keine Bitte erfüllt sehen; denn die an Gott zweifeln, das sind die Zweifler, and diesen wird überhaupt keine ihrer Bitten gewährt. 6. Aber die Vollkommenen im Glauben bitten um alles im Vertrauen auf den Herrn und erhalten es, weil sie mit Vertrauen bitten, frei von allem Zweifel. Denn es wird schwerlich geschehen, dass ein Zweifler sein Heil findet, wenn er sich nicht bekehrt. 7. Reinige also dein Herz vom Misstrauen, gürte dich mit dem Glauben, denn er ist stark, und vertrau zu Gott, dass du alles, um was du ihn bittest, erlangen werdest. Und wenn du einmal den Herrn um etwas gebeten hast, aber die Erhörung deiner Bitte sich etwas verzögert, so verliere das Vertrauen nicht, weil deine Seele die Erfüllung ihres Gebetes nicht schnell erhielt; denn sicherlich ist eine Prüfung oder ein dir unbekannter Fehltritt daran schuld, dass sich die Erfüllung deiner Bitte verzögert. 8. Auch musst du beharrlich sein mit dem Gebete deiner Seele, dann wirst du es erlangen. Wenn aber dein Eifer und dein Vertrauen beim Beten nachlassen, dann klage dich selbst an und nicht den, der dir geben sollte. 9. Schau dir solch ein Misstrauen an; es ist böse, sinnlos, reißt vielen den Glauben mit der Wurzel aus, sogar ganz Tiefgläubigen und Gefestigten. Und zwar ist diese Zweifelsucht eine Tochter Satans, und sie vergeht sich gar schwer an den Dienern Gottes. 10. Lege also den Zweifel beiseite und beherrsche ihn in allem, rüste dich dafür mit dem starken und mächtigen Glauben; der Glaube verspricht nämlich alles und vollendet auch alles, das Misstrauen aber, das nicht (einmal) an sich selbst glaubt, versagt bei allem, was es beginnt. 11. So siehst du denn“, schloss er, „dass das Vertrauen von oben kommt, vom Herrn, und dass es große Macht besitzt; das Misstrauen aber ist ein irdischer Geist, kommt vom Teufel und hat keine Macht. 12. Diene also du dem mächtigen Glauben und halte dich fern von dem machtlosen Misstrauen, dann wirst du in Gott leben; auch alle anderen, die so denken, werden in Gott leben.“</p><h2>Zehntes Gebot</h2><p>1. „Vertreibe aus deinem Herzen die Traurigkeit“, begann er wieder; „denn sie ist eine Schwester des Misstrauens und des Zornes.“ 2. „Wie ist sie“, fragte ich, „eine Schwester von diesen, o Herr? Mir scheint doch etwas anderes der Zorn, etwas anderes der Zweifel, und die Traurigkeit wieder etwas anderes zu sein.“ „Bist du so ein unverständiger [Mensch“, sprach er,] „und siehst nicht ein, dass die Traurigkeit schlimmer ist als alle (anderen) Geister und gar schrecklich für die Diener Gottes, dass sie mehr als alle schlimmen Geister dem Menschen schadet, den Heiligen Geist austilgt und ihn auch wieder rettet?“ 3. Ich antwortete; „O Herr, ich bin töricht und verstehe diese Gleichnisse nicht. Wie sie nämlich austilgen und doch wieder retten kann, das begreife ich nicht.“ 4. „So höre“, sprach er. „Leute, die niemals nachgedacht haben über die Wahrheit, die nach der Gottheit nicht geforscht, sondern nur geglaubt haben, die aber in Geschäfte, Reichtum, heidnische Liebhabereien und sonst in vielerlei Dinge dieser Welt verwickelt sind, alle, sage ich, die mit diesen Dingen sich abgeben, verstehen die Gleichnisse der Gottheit nicht; denn infolge dieser Geschäfte werden sie blind, verdorben und werden wertlos. 5. Wie nämlich die guten Weinstöcke, wenn sie vernachlässigt werden, unter Dornen und vielen anderen Gewächsen schlecht werden, so kommen auch gläubige Leute, die sich in diese genannten vielfachen Geschäfte verwickeln, von ihrer guten Gesinnung ab und sind gar nicht mehr empfänglich für die Gerechtigkeit; ja sogar, wenn sie von der Gottheit und Wahrheit reden hören, wendet sich ihr Geist ihrem Geschäfte zu, und sie erfassen gar nichts mehr. 6. Wer aber Gottesfurcht besitzt, wer über Gottheit und Wahrheit nachdenkt, wessen Herz auf Gott gerichtet ist, der erfasst und versteht, was man ihm sagt, schneller, weil er die Furcht des Herrn in sich hat; wo nämlich der Herr wohnt, da ist auch viel Einsicht. Schließe dich also dem Herrn an, und du wirst alles begreifen und verstehen.“</p><p>1. „Höre also“, fuhr er fort, „Unverständiger, wie die Traurigkeit den Heiligen Geist austilgt und wieder rettet. 2. Wenn der Misstrauische ein Werk begonnen hat und dieses wegen seines Misstrauens nicht gelingt, dann zieht die Traurigkeit ein bei dem Menschen, sie betrübt den Heiligen Geist und löscht ihn aus. 3. Wenn aber dann der Zorn einen solchen Menschen wegen einer Sache ergriffen und ihn ganz verbittert hat, dann schleicht sich wiederum die Trauer in das Herz des Zornigen; er ist dann unglücklich über die Tat, die er vollbracht, und es reut ihn, dass er Böses getan hat. 4. Diese Art von Traurigkeit scheint Rettung zu bringen, weil sie Reue über das böse Tun hervorgerufen hat. Beide Handlungen betrüben also den Geist. Das Misstrauen betrübt den Geist, weil sein Unternehmen nicht geglückt ist und der Zorn betrübt ihn, weil er das Böse getan hat. So sind demnach beide für den Heiligen Geist betrübend, das Misstrauen und der Zorn. 5. Wirf also die Trauer von dir und betrübe den Heiligen Geist nicht, der in dir wohnt, auf dass er nicht etwa bei Gott wider dich spreche und dich verlasse. 6. Denn der Geist Gottes, der diesem Körper gegeben wurde, erträgt keine Trauer und keine Angst.“</p><p>1. „Ziehe also jenen Frohsinn an, der Gott stets wohlgefällig und angenehm ist und freue dich in ihm. Denn jeder Fröhliche tut Gutes, denkt Gutes und verachtet die Traurigkeit. 2. Ein Trauriger aber macht seine Sache immer schlecht; erstens ist es nicht gut, dass er den Heiligen Geist betrübt, der dem Menschen gegeben wurde als ein Geist der Freude. Zweitens sündigt der, welcher den Heiligen Geist betrübt, weil er nicht mehr zu Gott betet und vor ihm nicht bekennt. Überhaupt hat das Gebet eines traurigen Menschen nicht die Kraft, auf den Altar des Herrn emporzusteigen.“ 3. „Weshalb“, fragte ich, „steigt das Gebet des Trauernden nicht zum Altar empor?“ „Weil die Traurigkeit in seinem Herzen sitzt. Wenn aber die Traurigkeit mit dem Gebete vermischt ist, dann lässt sie das Gebet nicht rein emporsteigen zum Altare. Wie nämlich Essig und Wein miteinander gemischt nicht den gleich guten Geschmack haben (wie der reine Wein), so hat auch die Traurigkeit mit dem Heiligen Geist gemischt nicht das gleiche Gebet. 4. Mache dich daher frei von dieser schlimmen Traurigkeit, dann wirst du in Gott leben; ebenso werden alle in Gott leben, welche die Traurigkeit von sich werfen und sich in lauter Frohsinn kleiden.“</p><h2>Elftes Gebot</h2><p>Über die wahren und falschen Propheten. 1. Er zeigte mir Leute, die auf einer Bank saßen, und dazu einen Menschen, der auf einem Stuhle saß. Und er sagte zu mir: „Siehst du die Leute, die auf der Bank sitzen?“ „Ja, Herr“, erwiderte ich. „Das sind“, fuhr er fort, „gläubige Menschen, und der auf dem Stuhle ist ein falscher Prophet, [der] die Diener Gottes um ihre gute Gesinnung bringt, aber nur die Zweifler, nicht die Gläubigen. 2. Die Zweifler kommen zu ihm wie zu einem Weisen (Zauberer) und fragen ihn, wie es ihnen gehen werde; und dieser falsche Prophet, der nichts von der Kraft des göttlichen Geistes in sich hat, richtet sich in seinen Reden mit ihnen nach ihren Fragen [und nach ihren schlechten Begierden und macht ihnen das Herz voll], so wie sie es wünschen. 3. Da er selbst ein hohler Kopf ist, gibt er auch den hohlen Menschen gehaltlose Antworten; was immer gefragt wird: die Antwort entspricht der Hohlheit des Menschen. Allerdings spricht er auch einige wahre Worte. Denn der Teufel erfüllt ihn mit seinem Geiste, ob er etwa einen Gerechten abwendig machen könne. 4. Alle aber, die im Glauben des Herrn gefestigt, die gewappnet sind mit der Wahrheit, verkehren nicht mit derartigen Geistern, sondern bleiben ihnen fern; die Zweifler aber und die häufig ihre Gesinnung ändern, befragen den Heiden gleich den Seher und ziehen sich eine gar große Sünde zu, da sie Götzendienst treiben; denn, wer einen falschen Propheten über irgendeine Sache befragt, ist ein Götzendiener, ist der Wahrheit bar und töricht. 5. Denn jeder von Gott gegebene Geist lässt sich nicht fragen, sondern im Besitze göttlicher Kraft gibt er von selbst jegliche Auskunft, da er von oben ist, von der Kraft des göttlichen Geistes. 6. Aber ein Geist, der sich fragen lässt und der entsprechend den Wünschen der Menschen redet, ist von der Erde, oberflächlich und ohne Kraft; er redet überhaupt nicht, außer wenn er vorher befragt wird.“ 7. „Wie nun, Herr“, fragte ich, „soll ein Mensch erkennen, wer von ihnen ein richtiger Prophet und wer ein falscher Prophet ist?“ „So vernimm mich über die beiden Prophetenarten; und so wie ich dir sagen werde, wirst du den richtigen und den falschen Propheten beurteilen. Nach seinem Leben erprobe den Menschen, der den göttlichen Geist besitzt. 8. Fürs erste ist der Mensch, der den [göttlichen] Geist von oben besitzt, milde, ruhig, demütig, frei von jeder Schlechtigkeit und von jeder eitlen Begierde nach dieser Welt, er macht sich geringer als alle Menschen, nie gibt der göttliche Geist jemand auf eine Frage Auskunft noch redet er im verborgenen für sich oder wenn ein Mensch will, dass er rede, vielmehr spricht der Heilige Geist nur dann, wenn es Gottes Wille ist, dass er rede. 9. Wenn also ein Mensch, der im Besitze des göttlichen Geistes ist, in eine Versammlung gerechter Männer kommt, die den Glauben an den göttlichen Geist haben, und wenn von diesen versammelten Männern das Gebet an Gott verrichtet wird, dann erfüllt der Engel des prophetischen Geistes den Menschen, bei dem er wohnt, und vom Heiligen Geist erfüllt, redet der Mensch zu der Menge, so wie der Herr es wünscht. 10. Auf diese Weise also wird der göttliche Geist offenbar werden. Daran (siehst du), wie groß die Macht des Herrn sich zeigt im göttlichen Geiste.“ 11. „Jetzt sollst du auch etwas hören über den irdischen, hohlen, ohnmächtigen Geist, der töricht ist 12. Vor allem brüstet sich ein solcher, der sich im Besitze des Geistes wähnt, er will den ersten Platz einnehmen, ist gleich keck, frech, geschwätzig, in vielen Genüssen und vielen anderen Täuschungen bewandert und lässt sich für seine Prophetie bezahlen; wenn er kein Geld bekommt, prophezeit er nicht. Kann nun ein göttlicher Geist Lohn nehmen und dafür prophezeien? Das geht nicht an bei einem Propheten Gottes, vielmehr ist der Geist solcher Propheten von der Erde. 13. Sodann kommt er gar nicht in die Versammlung gerechter Männer, sondern geht ihnen aus dem Wege; dafür verkehrt er mit den Zweiflern und hohlen Menschen, prophezeit ihnen in Winkeln und betrügt sie, indem er lauter eitles Zeug schwatzt nach ihrem Begehren; leeren Menschen gilt seine Antwort; wenn man nämlich ein leeres Gefäß mit anderen leeren zusammenstößt, dann zerspringt es nicht, sondern sie tönen miteinander zusammen. 14. Wenn er aber in eine Versammlung von lauter gerechten Männern, die den göttlichen Geist haben, kommt und wenn von diesen gebetet wird, dann steht jener Mensch leer da: der irdische Geist flieht von ihm aus Furcht, und so wird er stumm und ganz bestürzt, so dass er nichts mehr reden kann. 15. Wenn du in einer Vorratskammer Wein oder Öl aufbewahrst und darunter ein leeres Gefäß gestellt hast, so wirst du beim Räumen der Kammer jenes Gefäß, das du leer hingestellt hast, noch leer finden; so wird man auch die leeren Propheten, wenn sie zu den Geistern von Gerechten kommen, in dem Zustand finden, in dem sie gekommen sind. 16. Damit hast du das Leben der beiden Prophetenarten; beurteile also nach den Werken und nach dem Leben einen Menschen, der sich als Träger des Geistes ausgibt. 17. Glaube aber nur dem Geiste, der von Gott kommt und Macht besitzt; dem irdischen und leeren Geiste aber glaube nicht, weil keine Macht in ihm ist; denn er kommt vom Teufel. 18. Höre das Gleichnis, das ich dir sagen will: nimm einen Stein, wirf ihn gen Himmel und siehe zu, ob du ihn (den Himmel) erreichen kannst; oder nimm eine Wasserspritze, spritze zum Himmel und siehe zu, ob du den Himmel damit durchbohren kannst.“ 19. „Wie ist denn dies möglich, o Herr? beidemal redest du von Unmöglichem.“ „Wie nun diese Dinge“, fuhr er fort, „unmöglich sind, so sind auch die irdischen Geister ohne Macht und ohne Kraft. 20. Halte dagegen die Macht, die von oben kommt. Ein Hagelkorn ist ein ganz kleines Kügelchen, aber welchen Schmerz verursacht es, wenn es einem Menschen auf den Kopf fällt! oder nimm den Wassertropfen, der von dem Ziegel zur Erde fällt und den Stein aushöhlt! 21. Du siehst also, dass ganz geringfügige Dinge, die von oben auf die Erde fallen, eine große Gewalt haben, so ist auch der göttliche Geist, der von oben kommt, voll Macht. Diesem Geiste also glaube, von dem anderen halte dich fern.“</p><h2>Zwölftes Gebot</h2><p>1. Er sagte zu mir: „Lege ab jede schlechte Begierde und ziehe an die gute und heilige Begierde; denn wenn du diese Begierde umgetan hast, dann wirst du die böse Lust hassen und sie beherrschen, wie du willst 2. Die böse Begierde ist nämlich etwas Wildes, und sic lässt sich schwer bezähmen; sie ist nämlich fürchterlich, und durch ihre Wildheit richtet sie die Menschen gar sehr zugrunde; ganz besonders wird ein Diener Gottes, der ihr verfällt und nicht klug zu Werke geht, von ihr schrecklich zugerichtet. Sie vergreift sich aber nur an denen, die das Kleid der guten Begierde nicht tragen, sondern in diese Welt verstrickt sind; diese überliefert sie dem Tode.“ 3. „Welcher Art, o Herr, sind die Werke der bösen Begierde, dass sie die Menschen in den Tod bringen? Künde sie mir, damit ich mich von ihnen fern halte.“ „Höre, durch welche Werke die böse Begierde die Diener Gottes tötet.“</p><p>1. „An der Spitze steht die Begierde nach der Frau eines anderen oder nach einem anderen Manne, nach verschwenderischem Reichtum, nach vielem, unnötigem Essen und Trinken und nach vielen anderen törichten Genüssen; denn alle Üppigkeit ist töricht und eitel für die Diener Gottes. 2. Diese Begierden sind schlecht und bringen den Dienern Gottes den Tod; denn diese schlechte Begierde ist eine Tochter des Teufels. Deshalb müsst ihr euch dieser schlechten Begierden enthalten, auf dass ihr durch die Enthaltung in Gott lebet. 3. Wer sich aber von ihnen beherrschen lässt und ihnen nicht widersteht, wird dem Tode verfallen bis ans Ende; denn diese Begierden sind tödlich. 4. Ziehe an die Begierde nach Gerechtigkeit und wappne dich völlig mit der Furcht des Herrn und leiste ihnen Widerstand; denn die Furcht Gottes wohnt in der guten Begierde. Wenn nämlich die böse Begierde sieht, wie du gewappnet bist mit der Furcht Gottes und ihr Widerstand leistest, wird sie weit von dir fliehen und sich nicht mehr bei dir blicken lassen aus Furcht vor deiner Rüstung. 5. Wenn du [den Sieg über jene errungen und] den Kranz dir erkämpft hast, dann wende dich der Begierde nach Gerechtigkeit zu, übergib ihr den Sieg, den du errungen, und diene ihr so, wie sie will. Wenn du der guten Begierde dienst und ihr ergeben bleibst, dann wirst du es fertig bringen, die böse Begierde zu beherrschen und sie zu unterdrücken, wie du willst.“</p><p>1. „Ich möchte gerne wissen, o Herr, auf welche Weise ich der guten Begierde dienen muss.“ „Vernimm es: übe Gerechtigkeit und Tugend, Wahrheit und Furcht des Herrn, Glauben, Sanftmut und was es sonst noch verwandtes Gutes gibt! Wenn du dieses erfüllst, wirst du ein wohlgefälliger Diener Gottes sein und ihm leben; alle werden in Gott leben, die der guten Begierde dienen.“ 2. Damit war er fertig mit den zwölf Geboten und dann sprach er: „Du hast diese Gebote; wandle in ihnen und rede den Hörenden zu, auf dass ihre Bekehrung rein sei die übrigen Tage ihres Lebens. 3. Erfülle den Auftrag, den ich dir hiermit gebe, gewissenhaft, und du wirst viel erreichen; du wirst nämlich Dank ernten bei denen, die sich bekehren und deinen Worten folgen werden; ich werde nämlich mit dir sein und sie zwingen, dir zu gehorchen.“ 4. Da sprach ich zu ihm: „O Herr, diese Gebote sind groß, gut, herrlich und fähig, das Herz des Menschen zu erfreuen, der imstande ist, sie zu halten. Aber ich weiß nicht, ob ein Mensch diese Gebote beobachten kann, weil sie gar schwer sind.“ 5. Seine Antwort lautete: „Wenn du dir selbst einredest, dass es möglich ist, sie zu halten, wirst du sie ohne Mühe halten, und sie werden keineswegs schwer sein; wenn sich aber in deinem Innern die Meinung regt, sie könnten von einem Menschen nicht gehalten werden, dann wirst du sie auch nicht halten. 6. Jetzt aber sage ich dir: wenn du sie nicht hältst, sondern sie missachtest, wirst weder du selbst noch deine Kinder noch dein Haus das Heil erlangen, weil du dir selbst das Urteil schon gebildet hast, dass es unmöglich für den Menschen sei, diese Gebote zu halten.“</p><p>1. Und zwar sprach er diese Worte in großem Zorn, so dass ich ganz bestürzt war und mich sehr vor ihm fürchtete; sein Äußeres veränderte sich nämlich, so dass kein Mensch seinen Zorn ertragen konnte. 2. Wie er mich aber ganz verwirrt und bestürzt sah, begann er milder [und freundlicher] zu mir zu sprechen, indem er sagte: „Törichter, Unverständiger, Zweifler, weißt du nicht, wie groß, wie mächtig und wunderbar die Herrlichkeit Gottes ist, weil er die Welt um des Menschen willen geschaffen hat und seine ganze Schöpfung dem Menschen unterstellt und ihm die Macht gegeben hat, über alles, was sich unter dem Himmel befindet, zu herrschen? 3. Wenn nun“, fuhr er fort, „der Mensch Herr ist über alle Geschöpfe Gottes und wenn er über alles herrscht, kann er dann nicht auch Herr werden über diese Gebote? Gewiss, über alles, auch über alle diese Gebote kann der Mensch Herr werden, wenn er den Herrn in seinem Herzen trägt. 4. Für diejenigen aber, die den Herrn nur auf den Lippen haben, deren Herz aber verstockt und vom Herrn weit entfernt ist, für solche sind diese Gebote schwer und nur mit Mühe zu erfüllen. 5. Nehmet also ihr, die ihr leer seid und geringen Glaubens, den Herrn in euer Herz auf, und ihr werdet erkennen, dass nichts leichter, nichts süßer und milder ist als diese Gebote. 6. Bekehret euch daher, die ihr in den Geboten des Teufels wandelt, von diesen schweren, bitteren, wilden und wüsten Geboten und fürchtet den Teufel nicht, weil er keine Gewalt wider euch besitzt. 7. Denn ich, der Engel der Buße, werde mit euch sein, und ich habe Gewalt über ihn. Der Teufel flößt nur Furcht ein, aber diese Furcht ist ohne Belang; fürchtet ihn also nicht, und er wird von euch weichen.“</p><p>1. Ich sprach zu ihm: „Höre, o Herr, ein paar Worte von mir an.“ „Sprich, was du willst.“ „Der Mensch“, begann ich, „o Herr, hat zwar den guten Willen, die Gebote Gottes zu halten, und es gibt niemand, der nicht den Herrn um die Gnade anflehen würde, in den Geboten gefestigt zu werden und ihnen untertan zu sein; aber der Teufel gibt nicht nach und wird Herr über die Menschen.“ 2. „Aber“, versetzte er, „er kann nicht Herr werden über die Diener Gottes, die von ganzem Herzen auf ihn hoffen. Der Teufel kann zwar ringen (wider den Menschen), aber niederringen kann er ihn nicht. Wenn ihr ihm also widerstehet, wird er besiegt voll Schmach von euch abziehen. Allerdings die leeren Menschen fürchten den Teufel, wie wenn er Macht hätte. 3. Wenn nämlich jemand passende Krüge mit gutem Weine anfüllt und unter diesen einige nicht voll werden, dann kommt er wieder zu den Weinkrügen, schaut aber nicht nach den vollen; denn er weiß, dass sie voll sind; aber nach den halbvollen schaut er aus Furcht, sie möchten sauer werden; denn halbvolle Krüge werden rasch sauer, und der gute Geschmack des Weines geht verloren. 4. So kommt auch der Teufel zu allen Dienern Gottes, um sie zu versuchen. Wer nun voll ist im Glauben, der widersteht ihm standhaft, und so zieht jener von dannen, da er keinen Platz findet, wo er eindringen kann. Er geht dann zu den Halbvollen, und da er Platz hat, zieht er bei ihnen ein und wirkt in ihnen, was er will, und so werden sie seine Knechte.“</p><p>1. „Ich aber, der Engel der Buße, sage euch: Fürchtet den Teufel nicht. Denn ich wurde gesandt, auf dass ich mit euch sei, die sich aus ganzem Herzen bekehren, und dass ich euch stärke im Glauben. 2. Vertrauet also auf Gott, die ihr wegen einer Sünden die Hoffnung auf das Leben aufgeben musstet, da ihr in Sünden weiter gelebt und euer Leben belastet habt; denn, wenn ihr euch von ganzem Herzen zum Herrn bekehret und die Gerechtigkeit übet in den übrigen Tagen eures Lebens, und wenn ihr ihm recht dienet nach seinem Willen, dann wird er Heilung schaffen für eure früheren Sünden, und ihr werdet Macht bekommen, über die Werke des Teufels Herr zu werden. Die Drohung des Teufels braucht ihr gar nicht zu fürchten; denn er ist ohne Kraft wie die Sehnen eines Toten. 3. So höret denn auf mich, fürchtet den Allmächtigen, der retten und ins Verderben stürzen kann und haltet diese Gebote, dann werdet ihr das Leben in Gott haben.“ 4. Ich sagte ihm dann: „Herr, nun bin ich gestärkt in allen Gerechtsamen des Herrn, weil du mit mir bist; und ich weiß, dass du alle Macht des Teufels zerbrechen wirst, dass wir Herr sein werden über ihn und alle seine Werke überwinden werden. Auch hoffe ich, o Herr, dass ich imstande bin, alle Gebote. die du mir aufgetragen hast, zu halten, da der Herr mir Kraft. verleiht.“ 5. „Du wirst sie halten“, schloss er, „wenn dein Herz in Lauterkeit hingerichtet ist zum Herrn; auch werden alle die, welche ihr Herz gereinigt haben von den eitlen Begierden dieser Welt, sie halten und in Gott leben.“</p><h2>Erstes Gleichnis: Die Menschen haben hier keine bleibende Stätte. Sie sollen mit ihrem Gelde sich Reichtümer vor Gott erwerben durch Übung der Nächstenliebe</h2><p>1. Er sprach zu mir: „Wisset, dass ihr Diener Gottes in der Fremde wohnet! Denn eure (Heimat-) Stadt ist weit entfernt von dieser Stadt. Wenn ihr nun aber eure Heimat kennet, in der ihr wohnen sollet, wozu erwerbet ihr hier Grundbesitz, kostspielige Einrichtungen, Wohnungen und überflüssige Bauten? 2. Wer sich in dieser Stadt so einrichtet, der erwartet nicht, dass er zurückkehren werde in seine eigentliche Vaterstadt. 3. Du unverständiger, wankelmütiger und armer Mensch, siehst du nicht ein, dass all dies nicht dir gehört und in der Gewalt eines anderen steht? Denn der Herr dieser Stadt wird sagen: Ich will nicht, dass du in meiner Stadt wohnest; wandere aus von dieser Stadt, weil du nicht nach meinen Gesetzen lebst. 4. Du hast aber Grundstücke, Wohnungen und sonst manchen Besitz; wenn du nun von ihm vertrieben wirst, was fängst du an mit deinem Acker, deinem Hause und den anderen Dingen, die du dir erworben hast? Denn mit Recht wird dir der Herr dieses Landes sagen: Entweder lebe nach meinen Gesetzen oder verlasse mein Land. 5. Was willst du nun tun, da du doch dein (eigenes) Gesetz hast in deiner (Heimat-) Stadt? Wirst du etwa wegen deiner Äcker und deines übrigen Besitzes dein eigenes Gesetz ganz verleugnen und nach dem Gesetze dieser Stadt leben? Gib acht, dass dir die Verleugnung deines Gesetzes nicht verderblich werde; denn wenn du in deine (Heimat-) Stadt zurückkehren willst, wirst du nicht aufgenommen, weil du das Gesetz deiner (Vater)stadt verleugnet hast, sondern von ihr ausgeschlossen werden. 6. Darum siehe zu: Da du in der Fremde weilst, erwirb dir nur den ausreichenden Lebensbedarf und halte dich bereit, damit du, wenn der Fürst dieser Stadt dich wegen des Ungehorsams gegen sein Gesetz hinausjagen will, seine Stadt verlassen und in deine (Vater)stadt kommen kannst und du nach deinem Gesetze unbeschädigt in Freude leben kannst. 7. Sehet euch also vor, ihr Diener Gottes, den ihr im Herzen traget! Vollbringet die Werke Gottes eingedenk seiner Gebote und der Verheißungen, die er gegeben, und vertrauet, dass er sie erfüllen wird, wenn seine Gebote beobachtet werden. 8. Kaufet euch je nach Vermögen anstatt der Äcker bedrängte Seelen, besuchet Witwen und Waisen und verachtet sie nicht, und verwendet euren Reichtum und allen Besitz, den euch der Herr gegeben hat, für solche Äcker und Häuser. 9. Denn der Herr hat euch eben dazu Reichtum verliehen, damit ihr ihm diese Dienste erweiset; es ist dir viel besser, dir solche Äcker, solchen Besitz und solche Häuser zu erwerben, die du wieder finden wirst in deiner Heimatstadt, wenn du dort dich niederlässest. 10. Dieser Aufwand ist gut und heilig, er bringt keinen Kummer und keine Furcht, sondern Freude. Den Aufwand der Heiden sollt ihr nicht mitmachen; denn dieser bringt euch, den Dienern Gottes, Schaden. 11. Vielmehr verwendet euer Geld in einer Art, über die ihr euch freuen könnt; übet keinen Betrug, greifet nicht nach fremdem Gut und begehret dessen auch nicht; denn es ist böse, nach fremdem Gute Begierde zu haben. Erfülle vielmehr deine eigene Pflicht, und du wirst das Heil erlangen.“</p><h2>Zweites Gleichnis: Die Gaben des Reichen an die Armen werden durch das Gebet der Armen von Gott belohnt</h2><p>1. Als ich spazieren ging in meinem Acker und dabei Ulme und Weinstock betrachtete und mir so meine Gedanken über sie und ihre Früchte machte, da erschien mir der Hirte und sprach: „Was denkst du bei dir über die Ulme und den Weinstock?“ „Ich finde, [Herr,] dass sie vorzüglich zueinander passen.“ 2. „Diese beiden Pflanzen sind zum Abbild gesetzt für die Diener Gottes.“ „Ich möchte gerne die Bedeutung der Gesträuche, von denen du redest, kennen lernen.“ „Siehst du die Ulme und den Weinstock?“ „Ja, Herr.“ 3. „Der Weinstock hier trägt Früchte, die Ulme aber ist ein unfruchtbarer Baum; wenn sich aber der Weinstock nicht an der Ulme emporrankt, kann er keine Frucht bringen, weil er zu sehr am Boden kriecht, und wenn er Frucht trägt, so verfault sie, weil der Weinstock nicht an der Ulme sich emporwindet. Wenn also der Weinstock an der Ulme emporwächst, dann trägt er sowohl von sich selbst aus Frucht und zugleich wegen der Ulme. 4. Du siehst also, dass sowohl die Ulme viel Frucht hervorbringt, und zwar nicht weniger als der Weinstock, eher aber noch mehr.“ [ „Wie sogar noch mehr, Herr?“] „Weil der Weinstock, wenn er an der Ulme emporwächst, viele und gute, wenn er aber am Boden kriecht, faulige und wenige Früchte bringt. Dieses Gleichnis bezieht sich nun auf die Diener Gottes, auf die Armen und die Reichen.“ 5. „Sage mir, Herr, wie sich das verhält.“ „Merke auf! Der Reiche hat zwar ein großes Vermögen, aber dem Herrn gegenüber ist er ein Bettler; er gibt sich zuviel mit seinem Reichtum ab, und allzu kurz verrichtet er sein Bekenntnis und sein Gebet zu dem Herrn, und wenn er es verrichtet, so ist es kurz, schwächlich und ohne Kraft nach oben. Wenn nun der Reiche zu dem Armen geht und ihm das Mangelnde gibt im Glauben, dass, was er dem Armen tut, seinen Lohn bei Gott finden wird - weil der Arme reich ist durch sein Gebet und sein Bekenntnis und weil sein Gebet gar viel vermag bei Gott -, so gewährt also der Reiche dem Armen alles ohne Bedenken. 6. Der Arme aber, dem von dem Reichen aufgeholfen wurde, betet für ihn, indem er Gott dankt wegen seines Wohltäters. Und jener fährt in seiner Sorge um den Armen fort, damit diesem während seines Lebens nichts abgehe; denn er weiß, dass das Gebet des Armen wohlgefällig und vielvermögend ist bei Gott. 7. Durch die Mitwirkung beider wird das Ziel erreicht; der Arme verrichtet sein Gebet, in dem er reich ist und das ihm Gott verliehen; dies gibt er als Entgelt dem Herrn, der ihm geholfen hat. Und der Reiche gibt gleicherweise den Reichtum, den er vom Herrn empfangen hat, ohne Bedenken dem Armen. Und dieses Werk ist groß und angenehm vor Gott, weil er in richtiger Beurteilung seines Reichtums die Gaben Gottes für die Armen verwendete und so seine Aufgabe richtig erfüllte. 8. Bei den Menschen herrscht die Meinung, dass die Ulme keine Frucht trage; sie wissen und verstehen nicht, dass zur Zeit der Dürre die Ulme mit ihrer Feuchtigkeit den Weinstock tränkt und dass dieser, stets mit Feuchtigkeit versorgt, doppelte Frucht bringt sowohl für sich als auch für die Ulme. So vermehren auch die Armen durch ihr Gebet für die Reichen zum Herrn deren Reichtum, und umgekehrt sorgen die Reichen, wenn sie den Armen das Notwendigste geben, für ihre Seelen. 9. So haben also beide gemeinsam Anteil an dem guten Werke. Wer so handelt, den wird Gott nicht verlassen, vielmehr wird er eingeschrieben werden in die Bücher der Lebendigen. 10. Glücklich die Besitzenden, die einsehen, dass sie ihren Reichtum von Gott haben. Wer nämlich dies einsieht, der wird auch seinen Dienst erfüllen können.“</p><h2>Drittes Gleichnis: Gerechte und Sünder unterscheiden sich in ihrem äußeren Leben nicht viel</h2><p>1. Er zeigte mir viele Bäume, die keine Blätter hatten, sondern geradezu dürr zu sein schienen; alle waren einander ähnlich. Und er sagte zu mir: „Siehst du diese Bäume?“ „Ja, Herr, ich sehe, dass sie einander gleichen und dürr sind.“ Da antwortete er mir: „Die Bäume, die du hier siehst, das sind die Menschen, die in dieser Welt leben.“ 2. „Warum, o Herr“, entgegnete ich, „sind sie wie dürr und einander ähnlich?“ „Weil weder die Gerechten noch die Sünder in dieser Welt auffallen, sondern einander ähnlich sind. Denn für die Gerechten ist diese Welt ein Winter, und man erkennt sie nicht, da sie unter den Sündern wohnen. 3. Wie nämlich im Winter die Bäume ihr Laub abwerfen und einander gleichen, so dass man nicht sieht, welche dürr sind und welche Leben haben, so unterscheiden sich in dieser Welt die Gerechten nicht von den Sündern, sondern alle gleichen einander.“</p><h2>Viertes Gleichnis: Wie man im Sommer die grünen Bäume von den dürren unterscheidet, so werden in der künftigen Welt Gerechte und Sünder verschieden sein</h2><p>1. Wiederum zeigte er mir viele Bäume, teils grünende, teils dürre, und sagte mir: „Siehst du diese Bäume?“ „Ja, Herr, ich sehe grünende und dürre,“ 2. „Die grünenden Bäume hier“, sprach er, „das sind die Gerechten, die in der zukünftigen Welt wohnen werden; denn die zukünftige Welt ist Sommer für die Gerechten, aber Winter für die Bösen. Wenn nämlich die Barmherzigkeit des Herrn aufleuchtet, dann werden die Diener Gottes offenbar werden, und zwar alle. 3. Wie man nämlich im Sommer an jedem einzelnen Baum die Früchte sieht und ihre Beschaffenheit erkennt, so werden auch die Früchte der Gerechten offenbar werden, und bei allen wird man in jener Welt sehen, wie schön gewachsen sie sind. 4. Die Heiden und die Sünder aber wird man in jener Welt so finden, wie du die dürren Bäume gesehen hast, nämlich dürr und ohne Frucht, und man wird sie verbrennen wie Holz, da man erkannte, dass ihre Werke schlecht waren während ihres Lebens. Denn die Bösen werden ins Feuer geworfen werden, weil sie sündigten und keine Buße taten; die Heiden aber werden ins Feuer wandern, weil sie ihren Schöpfer nicht erkannt haben. 5. Bringe daher Frucht, dass sie in jenem Sommer offenbar werde; von den vielen Geschäften halte dich fern, und du wirst nicht sündigen. Denn wer sich mit vielem abgibt, sündigt auch viel, da er ganz aufgeht in seinen Geschäften und seinem Herrn nicht dient. 6. Wie kann denn ein solcher vom Herrn etwas erflehen und erlangen, wenn er dem Herrn nicht dient? Wer dem Herrn dient, dessen Wünsche werden erfüllt, wer ihm aber nicht dient, der bekommt auch nichts. 7. Wer aber nur <strong>ein</strong> Geschäft betreibt, der kann auch dem Herrn dienen; denn sein Herz wird nicht verdorben und abgelenkt von dem Herrn, er wird ihm vielmehr dienen mit lauterem Herzen. 8. Wenn du dieses tust, kannst du Früchte tragen in der zukünftigen Welt; ebenso alle, die dies halten.“</p><h2>Fünftes Gleichnis</h2><p>1. Fastend saß ich auf einem Berge und dankte dem Herrn für alles, was er mir getan hatte. Da sah ich den Hirten neben mir sitzen; er sprach: „Warum bist du so früh hierher gekommen.“ „Weil ich Stationstage halte, o Herr.“ 2. „Was ist Station?“ fragte er mich. „Ich faste, o Herr.“ „Was ist das für ein Fasten, das ihr haltet?“ „Wie ich es gewohnt bin, Herr, so faste ich.“ 3. „Ihr verstehet nicht, dem Herrn zu fasten, aber trotzdem ist das Fasten, das ihr ihm haltet, nicht wertlos.“ „Warum, o Herr“, fuhr ich fort, „redest du so?“ „Ich sage dir, dass das kein Fasten ist, das ihr zu halten wähnet; aber ich will dich lehren, was vollwertiges und dem Herrn genehmes Fasten ist. Höre! 4. Gott will ein solches nutzloses Fasten nicht; denn wer also dem Herrn fastet, der tut nichts für die Gerechtigkeit. Halte aber dem Herrn ein Fasten in folgendem Sinne: 5. Tue nichts Böses in deinem Leben und diene dem Herrn mit reinem Herzen; halte seine Gebote, indem du wandelst in seinen Gesetzen, und lasse keine schlechte Begierde aufkommen in deinem Herzen; vertraue zu Gott, dass du ihm leben wirst, wenn du dies befolgst, ihn fürchtest und dich jeder bösen Tat enthältst; auf diese Weise wirst du ein rechtes, Gott wohlgefälliges Fasten halten.“</p><p>1. „Vernimm das Gleichnis, das ich dir mit Bezug auf das Fasten sagen will. 2. Ein Mann besaß Grund und Boden und viele Sklaven, und einen Teil seines Grundes hatte er als Weinberg angelegt. Dieser wählte sich einen treuen, beliebten und geachteten Sklaven aus, ließ ihn zu sich kommen und sprach: Nimm diesen Weinberg, den ich angepflanzt habe, und umgib ihn, bis ich komme, mit einem Zaune; sonst sollst du nichts am Weinberge machen; wenn du meinen Auftrag ausführst, sollst du von mir die Freiheit haben. Der Herr des Sklaven ging in die Fremde. 3. Als er fortgegangen war, machte sich der Sklave an den Weinberg und umgab ihn mit einem Zaune. Wie er damit fertig war, sah er, dass der Weinberg voll Unkraut war. 4. Da dachte er bei sich selbst: diesen Auftrag meines Herrn habe ich nun ausgeführt; nun will ich noch den Weinberg hier umgraben; wenn er umgegraben ist, wird er schöner aussehen, und von Unkraut frei, wird er mehr Frucht bringen, weil ihn das Unkraut nicht erstickt. Er ging daran, grub den Weinberg um und riss alles Unkraut, das darin war, aus. Und jener Weinberg bekam ein schönes Aussehen und zeigte guten Wuchs; denn er hatte kein Unkraut, das ihn hätte ersticken können. 5. Nach einiger Zeit kam der Herr des Sklaven und des Feldes und er ging in seinen Weinberg. Und als er den guten Zaun um den Weinberg erblickte und sah, wie dieser außerdem umgegraben und jedes Unkraut ausgerissen war und die Weinstöcke in voller Kraft standen, freute er sich gar sehr über die Arbeit seines Sklaven. 6. Da ließ er seinen geliebten Sohn, den er als Erben, und seine Freunde, die er als Ratgeber hatte, zu sich kommen und erzählte ihnen, welchen Auftrag er seinem Sklaven gegeben und welche (Arbeit) er erledigt vorgefunden habe. Und diese freuten sich mit dem Sklaven über das Zeugnis, das ihm sein Herr ausstellte. 7. Er sagte ihnen: Ich habe diesem Sklaven die Freiheit versprochen, wenn er den Auftrag, den ich ihm gab, richtig ausführe. Er hat den Auftrag erledigt und zudem noch eine schöne Arbeit an dem Weinberg getan, die mich gar sehr erfreute. Zum Lohne für seine Leistung will ich ihn nun zum Miterben meines Sohnes machen, weil er den guten Gedanken nicht von sich gewiesen, sondern ihn ausgeführt hat. 8. Diesem Vorschlag nun, dass der Sklave das Erbe mit ihm teilen solle, stimmte der Sohn des Herrn zu. 9. Einige Tage darauf veranstaltete sein [Hausherr] ein Mahl und schickte davon dem Sklaven viele Speisen zu. Dieser nahm von den Speisen, die ihm sein Herr geschickt hatte, soviel als er zu seiner Sättigung brauchte, das übrige aber verteilte er unter seine Mitknechte. 10. Diese freuten sich sehr über die Speisen, die sie von ihm bekommen hatten und fingen an, für ihn zu beten, dass er bei seinem Herrn noch viel mehr Gnade finde, weil er sich so (gut) gegen sie benommen hatte. 11. Alle diese Dinge kamen seinem Herrn wieder zu Ohren, und wiederum freute er sich gar sehr über seine Handlungsweise. Da ließ er wiederum seine Freunde und seinen Sohn zusammenkommen und teilte ihnen mit, was er mit den Speisen, die er bekommen hatte, angefangen habe; und sie waren noch mehr der Ansicht, dass der Sklave mit seinem Sohne sich in die Erbschaft teilen solle.“</p><p>1. Ich sagte: „O Herr, ich verstehe diese Gleichnisse nicht und ich kann sie nicht begreifen, wenn du mir sie nicht erklärst.“ 2. „Ich werde dir alles erklären“, versetzte er, „und alles, was ich mit dir bespreche, das werde ich dir auch zeigen. Die Gebote [des Herrn halte, und du wirst Gott wohlgefällig sein, und du wirst aufgeschrieben werden unter die Zahl derer, die seine Gebote halten]. 3. Wenn du über das Gebot des Herrn hinaus etwas Gutes tust, so erwirbst du dir überreichen Ruhm, und du wirst angesehener sein bei Gott, dem du gehören wolltest. Wenn du also die Gebote Gottes beobachtest und überdies noch diese Dienste verrichtest, dann wirst du dich freuen, wenn du sie meinem Auftrag entsprechend erfüllst.“ 4. Ich sagte ihm: „Was du mir befiehlst, Herr, das werde ich halten; denn ich weiß, dass du mit mir bist.“ „Ich werde mit dir sein, weil du so große Bereitwilligkeit hast für das Gute, und auch mit allen anderen, die diesen guten Willen haben, werde ich sein. 5. Dieses Fasten ist überaus gut bei denen, die des Herrn Gebote halten. Das Fasten, welches du beobachten willst, halte also: 6. Fürs allererste hüte dich vor jedem schlechten Worte, jeder bösen Begierde und halte dein Herz rein von allen Eitelkeiten dieser Welt! Wenn du dies beobachtest, wird dein Fasten vollkommen sein. 7. Dabei sollst du es also machen: Zunächst erfülle, was geschrieben steht; dann sollst du an diesem Tage nur Wasser und Brot essen; von den Speisen, die du sonst an diesem Tage genießen würdest, sollst du sodann die Höhe der Auslagen für den in Betracht kommenden Tag berechnen und diese einer Witwe oder einer Waise oder einem Bedürftigen geben und so dich bescheiden, auf dass der, welcher durch deine Bescheidenheit etwas bekommen hat, sein Herz erfülle und für dich zum Herrn bete. 8. Wenn du also so, wie ich es angegeben habe, das Fasten hältst, wird dein Opfer angenehm sein bei Gott, und dies dein Fasten wird eingeschrieben werden, und ein Gottesdienst, der so geübt wird, ist gut, erfreulich und wohlgefällig beim Herrn. 9. Dies sollst du auf diese Weise beobachten, du selbst, deine Kinder und dein ganzes Haus; wenn du dies hältst, wirst du glücklich sein; auch alle, die dies hören und beobachten, werden glücklich sein und um was immer sie den Herrn bitten, das werden sie erlangen.“</p><p>1. Ich bat ihn dringend, er möge mir das Gleichnis erklären von dem Felde, dem Herrn, dem Weinberg, von dem Sklaven, der den Weinberg mit einem Zaune umgab, von dem Zaune und dem Unkraut, das aus dem Weinberg ausgerissen wurde, von dem Sohne und den Freunden, die seine Ratgeber waren; denn ich sah ein, dass all dies ein Gleichnis ist. 2. Er aber entgegnete mir: „Im Fragen bist du gar kühn. Du brauchst überhaupt nichts zu fragen; denn wenn du eine Erklärung nötig hast, wird sie dir gegeben werden.“ Ich erwiderte ihm: „Herr, wenn du mir Gesichte zeigst, ohne sie zu erklären, dann habe ich sie wohl umsonst gesehen, denn ich verstehe ihre Bedeutung nicht; so ist es auch, wenn du mir Gleichnisse erzählst und sie nicht erklärst, dann habe ich sie wohl umsonst von dir gehört.“ 3. Da gab er mir wieder zur Antwort: „Ein Diener Gottes, der seinen Herrn im Herzen trägt, bittet ihn um Einsicht und erhält sie auch, so dass er jedes Gleichnis (sich) erklären kann und dass alle Worte des Herrn, die in Gleichnissen gesprochen sind, ihm verständlich werden; wer aber bequem und träge ist zum Beten, der zögert, vom Herrn etwas zu erbitten. 4. Der Herr ist voll Erbarmen und gibt unaufhörlich allen, die ihn darum bitten. Du bist nun gestärkt durch den heiligen Engel Gottes und hast von ihm ein solches Gebet erhalten und bist nicht träge: warum bittest du den Herrn nicht um Einsicht, damit du sie von ihm bekommst?“ 5. Da sprach ich zu ihm: „Herr, ich habe dich bei mir und deshalb muss ich notwendig dich bitten und dich fragen; denn du zeigst mir alles und redest mit mir. Wenn ich aber in deiner Abwesenheit es gesehen oder gehört hätte, dann hätte ich mich an den Herrn um Aufklärung gewandt.“</p><p>1. „Ich habe dir’s gesagt, und zwar erst vor kurzem, dass du schlau bist und kühn, wenn es gilt, nach der Erklärung der Gleichnisse zu fragen. Da du so hartnäckig bist, will ich dir das Gleichnis von dem Ackerfeld und all dem übrigen, was dazu gehört, erklären, damit du es allen verständlich machest. So merke denn auf, dass du es verstehst. 2. Der Acker ist diese Welt; der Herr des Ackers ist der Schöpfer aller Dinge, der sie vollendet und befestigt hat; [der Sohn ist der Heilige Geist;] der Knecht ist der Sohn Gottes; die Weinstöcke sind dieses Volk, das er selbst gepflanzt hat; 3. die Umzäunungen sind die Engel des Herrn, die sein Volk beherrschen; das Unkraut aber, das aus dem Weinberg herausgerissen wurde, das sind die Sünden der Diener Gottes; die Speisen, die er ihm von seinem Mahle sandte, sind die Gebote, die er seinem Volke gab durch seinen Sohn; seine Freunde und Berater sind die zuerst erschaffenen heiligen Engel. Die Reise des Herrn bedeutet die Zeit, die noch übrig ist bis zur Wiederkunft des Herrn.“ 4. Ich entgegnete: „Herr, groß und wunderbar ist alles, und alles macht einen herrlichen Eindruck. Fürwahr“, fragte ich, „wäre ich imstande gewesen, dieses zu ergründen? Auch kein anderer Mensch, und wenn er noch so weise wäre, hätte dieses finden können. Und weiterhin, o Herr, erkläre mir noch, was ich dich fragen werde.“ 5. „Rede, wenn du etwas (wissen) willst.“ „Warum, o Herr, tritt in dem Gleichnis der Sohn Gottes in der Rolle eines Knechtes auf?“</p><p>1. „Höre! Der Sohn Gottes tritt [nicht] in der Rolle eines Knechtes auf, sondern in großer Macht und Herrlichkeit.“ „Wieso, Herr? das verstehe ich nicht.“ 2. „Wenn Gott den Weinberg pflanzte, so will das heißen, er hat das Volk erschaffen und hat es seinem Sohne übergeben; und der Sohn setzte die Engel über sie zu ihrem Schutze; und er selbst hat ihre Sünden getilgt, indem er sich sehr abmühte und viele Arbeit auf sich nahm; denn kein Weinberg kann umgegraben werden ohne viel Arbeit oder Mühe. 3. Dadurch, dass er nun selbst die Sünden des Volkes tilgte, zeigte er ihnen die Pfade des Lebens, indem er ihnen das Gesetz gab, das er von seinem Vater empfangen hatte. 4. [Du siehst, dass er selbst der Herr ist über das Volk, da er alle Gewalt von seinem Vater empfangen hat,] dass aber der Herr zur Beratung über die Erbschaft des Knechtes seinen Sohn und die ruhmvollen Engel beigezogen hat, darüber höre: 5. Den Heiligen Geist, der schon vorher da war und der jegliches Ding erschaffen hat, verpflanzte Gott in einen Leib, den er wollte. Dieser Leib nun, in dem der Heilige Geist wohnte, diente dem Geiste gut durch einen Wandel in Heiligkeit und Reinheit, da er gar nie den Geist befleckte. 6. Der Leib nun führte einen guten Wandel, duldete und arbeitete mit dem Geiste in allen Stücken, wandelte kräftig und männlich, deshalb erwählte ihn (der Herr) zum Genossen des Heiligen Geistes; [Gott] hatte nämlich Wohlgefallen an dem Wandel dieses Leibes, weil er sich mit dieser Welt nicht befleckte, da er den Heiligen Geist besaß. 7. Als Ratgeber zog er seinen Sohn und die herrlichen Engel bei, auf dass auch dieser Leib, der dem Geiste ohne Tadel gedient hatte, eine Wohnstätte habe und dass es nicht scheine, als sei er des Lohnes [für seinen Dienst verlustig gegangen; denn jeder Leib wird seinen Lohn erhalten], wenn er unbefleckt und makellos erfunden wird, er, in dem der Heilige Geist seine Wohnung hatte. 8. Damit hast du auch die Erklärung dieses Gleichnisses.“</p><p>1. „Es war für mich eine Freude, o Herr, diese Deutung zu hören.“ „So merke jetzt auf! Bewahre deinen Leib rein und unbefleckt, damit der in ihm wohnende Geist ihm Zeugnis geben könne und so dein Leib gerechtfertigt werde. 2. Gib acht, dass in deinem Herzen sich nicht einmal der Gedanke rege, dein Leib sei vergänglich, und dass du ihn nicht missbrauchest zu einer Befleckung. Wenn du nämlich deinen Leib befleckst, befleckst du auch den Heiligen Geist; wenn du aber den Geist befleckst, wirst du das Leben nicht haben.“ 3. Da stellte ich die Frage: „Wenn aber, Herr, vor der Kenntnis dieser Worte eine Torheit begangen würde, wie kann ein Mensch gerettet werden, der seinen Leib befleckt hat?“ „Für frühere aus Unwissenheit begangene Fehltritte kann Gott allein Heilung bieten; denn er besitzt alle Macht. 4. [Aber von jetzt ab hüte dich, und der allmächtige Herr wird in seiner Barmherzigkeit für die früheren Taten der Unwissenheit Heilung bieten,] wenn du in Zukunft weder dein Fleisch noch den Geist befleckest. Denn die beiden gehören zusammen, und es kann nicht das eine ohne das andere befleckt werden. Bewahre also beide rein, und du wirst in Gott leben.“</p><h2>Sechstes Gleichnis</h2><p>1. Ich saß in meinem Hause, lobte den Herrn für alles, was ich hatte sehen dürfen, dachte nach, wie schön die Gebote sind, wie kraftvoll, erfreulich, rühmlich und mächtig, der Seele eines Menschen das Heil zu verschaffen, und sprach bei mir selbst: Ich werde selig sein, wenn ich in diesen Geboten wandle, ebenso alle, die in ihnen wandeln. 2. Wie ich dies bei mir sprach, bemerkte ich, wie er plötzlich neben mir saß und sprach: „Warum grübelst du nach über die Gebote, die ich dir gegeben habe? Sie sind gut; du sollst gar nicht zweifeln; gürte dich vielmehr mit dem Vertrauen auf den Herrn und wandle in ihnen; denn ich werde dich stark machen durch sie. 3. Diese Gebote sind nützlich für die, welche Buße tun wollen. Denn wer sie nicht befolgt, dessen Buße ist wertlos. 4. Wenn ihr also Buße tut, dann leget ab die Schlechtigkeit dieser Welt, die euch aufreibt. Ziehet an jegliche Tugend der Gerechtigkeit, und ihr werdet imstande sein, diese Gebote zu halten und in euren Sünden nicht weiter zu machen. [Wenn ihr also in gar keine neue Sünde mehr fallet, werdet ihr auch von den früheren Fehltritten frei werden.] Wandelt daher in diesen meinen Geboten, und ihr werdet in Gott leben. Dies alles ist euch von mir gesagt worden.“ 5. Als er diese Worte an mich gerichtet hatte, fuhr er fort: „Wir wollen aufs Feld gehen, dort will ich dir die Hirten der Schafe zeigen.“ „Wir wollen gehen, Herr“, sagte ich. Wir kamen in eine Ebene, und da zeigte er mir einen jugendlichen Hirten, der durchaus in safranfarbige Gewänder gekleidet war. 6. Er weidete eine sehr zahlreiche Herde; seine Schafe waren geradezu üppig und sehr ausgelassen, und munter hüpften sie hin und her; der Hirte selbst war ganz vergnügt mit seiner Herde; und erst das Aussehen des Hirten war überaus freudig, wie er so unter seinen Schafen dahinging. [Auch andere Schafe sah ich noch ausgelassen und üppig an <strong>einem</strong> Orte, aber sie sprangen nicht umher.]</p><p>1. Und er sprach zu mir: „Siehst du diesen Hirten?“ „Ja, Herr.“ „Das ist“, fuhr er fort, „der Engel der Üppigkeit und des Trugs. Dieser verdirbt die Seelen der Diener Gottes und macht sie abtrünnig von der Wahrheit, indem er sie betört durch die schlechten Begierden, in denen sie umkommen. 2. Sie vergessen nämlich die Gebote des lebendigen Gottes, wandeln in eitel Trug und Üppigkeit und werden so von diesem Engel ins Verderben geführt, die einen zum Tode, die anderen in die Irre.“ 3. Ich sprach zu ihm: „Herr, ich weiß nicht, was das bedeutet: zum Tode und in die Irre.“ „Höre! Die Schafe, die du freudig umherspringen sahest, das sind die Leute, die sich für immer von Gott losgesagt und den Lüsten dieser Welt übergeben haben. Bei diesen gibt es keine Umkehr zum Leben, weil sie in ihren Sünden weiterlebten und den Namen Gottes lästerten. Für diese kommt der Tod. 4. Die Schafe aber, die du nicht umherspringen, sondern am gleichen Orte weiden sahest, das sind solche, die sich zwar den Lüsten und Torheiten übergeben, aber den Herrn nicht gelästert haben. Diese sind zwar von der Wahrheit abgeirrt; aber in ihnen lebt noch Aussicht auf Buße, durch die sie das Leben erlangen können. Im Irrtum ist also die Hoffnung auf eine Wiederbelebung, im Tod aber ewige Vernichtung.“ 5. Wir gingen wieder ein Stück weiter; da zeigte er mir einen großen Hirten, dessen Aussehen etwas Rauhes hatte, angetan mit einem weißen Ziegenfell; um die Schultern hatte er eine Tasche, in den Händen einen ganz rauhen Stock mit vielen Knorren und eine große Geißel; sein Blick war sehr streng, so dass ich mich vor ihm fürchtete; so schaute er drein. 6. Dieser Hirte nun nahm von dem jüngeren die Schafe, die lustig und munter waren, aber nicht umhersprangen und führte sie an einen steilen mit Dornen und Disteln bewachsenen Ort, so dass die Schafe wegen der Dornen und Disteln sich nicht frei machen konnten, sondern sich in die Dornen und Disteln verwickelten. 7. Diese weideten also in Dornen und Disteln verstrickt und mussten sehr viel ausstehen, weil sie von ihm geschlagen wurden; er trieb sie bald dahin, bald dorthin und gab ihnen keine Ruhe, so dass diese Schafe an keinem Orte sich niederlegen konnten.</p><p>1. Als ich sie nun so geschlagen und leiden sah, tat es mir leid um sie, weil sie so gequält wurden und gar keine Ruhe hatten. 2. Da redete ich den Hirten, der mit mir sprach, also an. „Herr, was ist das für ein hartherziger und gestrenger Hirte, dass er gar kein Mitleid mit seinen Schafen hat?“ „Das ist der Engel der Strafe; er gehört zu den guten Engeln und ist gesetzt über die Strafe. 3. Er nimmt die auf, die von Gott abgeirrt sind und in den Torheiten und Lüsten dieser Welt gewandelt sind, und bestraft sie, wie sie es verdienen, mit harten und verschiedenartigen Strafen.“ 4. „Ich möchte gerne wissen, Herr, welcher Art diese verschiedenen Strafen sind.“ „So vernimm denn die verschiedenen Züchtigungen und Strafen. Die Züchtigungen kommen im Leben; sie bestehen für die einen in Strafen, für andere in Verlusten, für andere in allerlei Krankheiten oder für andere in gänzlicher Unbeständigkeit, einige werden auch von unwürdigen Leuten beschimpft und haben sonst bei ihren verschiedenen Unternehmungen zu leiden; 5. viele nämlich sind unbeständig in ihren Entschlüssen, sie fangen vieles an, aber nichts bei ihnen will recht vorwärts gehen. Diese sagen dann, dass sie kein Glück haben in ihren Unternehmungen; aber dass sie Böses getan haben, daran denken sie nicht in ihrem Herzen, vielmehr beschuldigen sie den Herrn. 6. Wenn sie dann jegliche Mühsal erduldet haben, dann werden sie mir übergeben zu einer milden Erziehung, sie erstarken im Glauben an den Herrn und dienen dem Herrn die übrigen Tage ihres Lebens mit reinem Herzen; wenn sie sich dann bekehrt haben, regt sich in ihrem Herzen das Bewusstsein ihrer früheren Sünden, und dann loben sie Gott und sagen, er sei ein gerechter Richter und jeder habe entsprechend seinem Tun die richtige Strafe bekommen: fernerhin dienen sie dem Herrn mit reinem Herzen, und alle ihre Unternehmungen haben einen guten Fortgang, da sie vom Herrn alles erlangen, um was sie bitten; dann preisen sie Gott dafür, dass sie mir übergeben worden sind; etwas Schlimmes haben sie nicht mehr zu erdulden.“</p><p>1. Ich sprach zu ihm: „Herr, erkläre mir auch noch folgendes.“ „Wonach willst du fragen?“ „Ob die, o Herr, welche in Täuschung und Üppigkeit gelebt haben, ebenso lange gestraft werden, als jenes üppige und verführerische Leben dauerte?“ „Gleich lang währt ihre Strafe.“ 2. [„Gar wenig werden sie gestraft, o Herr;] sie sollten siebenfach gestraft werden, die in solcher Üppigkeit leben und Gott vergessen.“ 3. „Du bist töricht und kennst den Wert der Strafe nicht“, sagte er mir. „Wenn ich es wüsste, o Herr, hätte ich dich nicht um Aufklärung angegangen.“ „So höre den Wert beider. 4. Die Zeit der Schwelgerei und Täuschung ist eine Stunde; die Stunde der Strafe aber hat einen Wert von dreißig Tagen. Wenn also einer einen Tag lang in verlockender Schwelgerei lebt und seine Strafe einen Tag dauert, so hat der Tag der Strafe den Wert eines ganzen Jahres. Es wird also einer so viele Jahre gestraft, als er Tage in Schwelgerei gelebt hat. Du siehst also, dass die Zeit der Üppigkeit und Täuschung sehr kurz, die der Strafe und Züchtigung aber lang ist.“</p><p>1. „Noch immer bin ich, Herr, nicht recht im klaren wegen der Dauer der Täuschung, der Üppigkeit und der Strafe; erkläre mir das noch deutlicher.“ 2. Er antwortete mir: „Deine Torheit hält lange an, und du willst dein Herz nicht reinigen und Gott nicht dienen. Sieh zu, dass die Zeit nicht abläuft und du noch als Tor erfunden wirst. Merke also auf, damit du es verstehst, wie du es willst. 3. Wer einen Tag in Schwelgerei und Täuschung verlebt und tut, was er will, in dem ist viel Unverstand, und er bedenkt nicht, was er tut; denn am anderen Tag weiß er nicht mehr, was er tags zuvor getan; denn Trug und Täuschung haben keine Erinnerung wegen der Torheit, in der er lebt; wenn aber Strafe und Züchtigung nur einen Tag dem Menschen anhaften, ist er ein ganzes Jahr gestraft und gezüchtigt; denn Strafe und Züchtigung hinterlassen ein langes Andenken. 4. Wer nun ein ganzes Jahr lang gezüchtigt und gestraft wird, der erinnert sich dann an sein Wohlleben und an den Trug und sieht ein, dass er ihretwegen das Schlimme erdulden muss. Daher werden alle Menschen, die sich dem Wohlleben und Trug überlassen, so bestraft, weil sie im Besitze des Lebens sich dem Tode überliefert haben.“ 5. „Welche Arten von Lüsten sind schädlich, Herr?“ „Was immer ein Mensch mit Genuss tut, das bedeutet für ihn eine Lust; so zum Beispiel ist es eine Lust für den Jähzornigen, wenn seine Leidenschaft befriedigt wird; ebenso ist es, wenn der Ehebrecher, der Trunkenbold, der Verleumder, der Lügner, der Habsüchtige, der Betrüger und ähnliche Leute ein jeder seine Leidenschaft befriedigt: in ihrem Tun liegt Lust. 6. Alle diese Lüste sind nachteilig für die Diener Gottes. Wegen dieser Genüsse müssen sie leiden, wenn über sie Züchtigung und Strafe kommt. 7. Es gibt aber auch Lüste, die den Menschen zur Rettung dienen; viele empfinden Lust, wenn sie Gutes tun, weil ihr eigenes Vergnügen sie dazu antreibt. Diese Art von Lust ist den Dienern Gottes zuträglich und verschafft einem solchen Menschen das Leben; aber die schädlichen Arten der Lüste, von denen oben die Rede war, verschaffen ihnen Züchtigung und Strafe; wenn sie darin verharren und nicht Buße tun, ziehen sie sich den Tod zu.“</p><h2>Siebtes Gleichnis: Hermas wird wegen der Sünden seiner Angehörigen dem Engel der Strafe übergeben</h2><p>1. Einige Tage später sah ich ihn in derselben Ebene, wo ich auch die Hirten gesehen hatte, und er fragte mich: „Was suchst du?“ „Ich bin hier, o Herr, damit du dem Hirten der Strafe befehlest, mein Haus zu verlassen, weil er mich gar sehr plagt,“ „Es ist nötig, dass du geplagt werdest; denn der herrliche Engel hat es so angeordnet für dich; er wünscht nämlich, dass du geprüft werdest.“ „Was habe ich denn so Schlimmes getan, o Herr, dass ich diesem Engel übergeben wurde?“ 2. „Höre! Du hast zwar viele Sünden, aber nicht so viel, dass du hättest diesem Engel übergeben werden müssen; aber dein Haus hatte große Fehler und Sünden begangen, und der herrliche Engel wurde erbittert über ihr Tun; deshalb befahl er, dass du eine Zeitlang bedrängt werdest, damit auch jene Buße tun und sich reinigen von jeder Begierde dieser Welt. Wenn sie Buße getan und sich gereinigt haben, dann wird der Engel der Strafe von dir weichen.“ 3. Da entgegnete ich: „Herr, wenn doch jene solche Dinge verübt haben, dass der herrliche Engel erbittert wurde, was habe dann ich getan?“ „Jene können nur dadurch gestraft werden, dass auch du, das Haupt des Hauses, in Bedrängnis kommst. Wenn sie nämlich an dich kommt, dann trifft sie notwendig auch jene, wenn es aber dir gut geht, können jene keine Bedrängnis erleiden.“ 4. „Aber sieh doch, o Herr, dass sie von ganzem Herzen Buße getan haben.“ „Auch ich weiß, dass sie aus ganzem Herzen Buße getan haben; aber glaubst du, dass den Büßern [sogleich] die Sünden nachgelassen werden? Keineswegs; vielmehr muss der Büßer seine Seele züchtigen, er muss sich bei jedem Werke kräftig demütigen und in allen möglichen Drangsalen sich quälen; und wenn er die Drangsale, die über ihn kommen, aushält, dann wird der Schöpfer und Bekräftiger aller Dinge volles Erbarmen üben und ihm irgendeine Heilung gewähren. 5. Und dies auf alle Fälle, [wenn er das Herz] des Büßers frei von jeglichem Fehltritt sieht. Dir und deinem Hause aber ist die jetzige Drangsal von Nutzen. Doch wozu soll ich dir viele Worte machen? Du musst die Bedrängnis erleiden, so wie es jener Engel des Herrn, der dich mir übergab, angeordnet hat; und dafür sollst du dem Herrn Dank sagen, dass er dich gewürdigt hat, dir die Drangsal vorher zu offenbaren, damit du sie starkmütig auf dich nimmst, weil du es vorher schon weißt.“ 6. Ich sagte: „Herr, bleibe du bei mir, dann werde ich die Kraft haben, jede Drangsal zu bestehen.“ „Ich werde mit dir sein; und ich will den Engel der Strafe bitten, dass er etwas milder mit dir verfahre; aber auf kurze Zeit wirst du bedrängt und dann wieder deinem Hause zurückgestellt werden; nur sei ausdauernd in der Demut und ganz reinen Herzens im Dienste des Herrn, ebenso soll es sein bei deinen Kindern und bei deinem Hause; wandle in den Geboten, die ich dir gebe, und deine Buße wird wirkungsvoll und reinigend sein können. 7. Und wenn du mit deinem Hause dieses befolgst, wird jegliche Drangsal von dir weichen; auch wird sie von allen denen sich entfernen, die in diesen meinen Geboten wandeln.“</p><h2>Achtes Gleichnis</h2><p>1. Er zeigte mir einen großen Weidenbaum, der Ebenen und Berge bedeckte, und in den Schatten dieser Weide kamen alle, die im Namen des Herrn berufen sind. 2. Ein herrlicher Engel des Herrn aber stand ganz erhaben neben dem Weidenbaum und schnitt mit einem großen Messer Zweige von der Weide ab und gab sie dem Volke, das im Schatten der Weide stand; er gab ihnen aber nur kleine Zweige, etwa ellengroße. 3. Als alle ihren Zweig erhalten hatten, legte der Engel das Messer weg, und jener Baum war unversehrt, so wie ich ihn gesehen hatte. 4. Darüber wunderte ich mich und ich sprach bei mir selbst: Wie ist der Baum noch unversehrt geblieben, obwohl so viele Zweige abgeschnitten wurden? Der Hirte sagte mir: „Wundere dich nicht, wenn der Baum unversehrt geblieben ist trotz der Wegnahme so vieler Zweige; [aber warte nur zu;] sobald du alles gesehen hast, wird dir auch klar werden, was dies bedeutet. 5. Der Engel, der dem Volke die Zweige ausgeteilt hatte, forderte sie wieder von den Leuten zurück; und so wie sie die Zweige in Empfang genommen hatten, so wurden sie zu ihm herangerufen, und jeder gab seinen Zweig zurück. Der Engel des Herrn nahm die Zweige und sah sie an. 6. Von einigen bekam er dürre Zweige, die wie von einer Motte angefressen waren; der Engel ließ die Überbringer solcher Zweige sich gesondert aufstellen. 7. Andere übergaben dürre Zweige, die aber von der Motte nicht angefressen waren; auch diese ließ er gesondert aufstellen. 8. Wieder andere gaben halbdürre Zweige ab; auch diese nahmen einen besonderen Platz ein. 9. Einige kamen auch mit halbdürren Zweigen, die Risse hatten; auch diese stellten sich gesondert auf. 10. [Wieder andere brachten zwar grüne, aber aufgesprungene Zweige, auch diese traten an einen besonderen Platz.] 11. Es kamen auch einige mit Zweigen, die zur Hälfte dürr, zur Hälfte grün waren; auch diese stellten sich besonders auf. 12. Andere brachten ihre Zweige, die zu zwei Teilen grün, zu einem Teil dürr waren; auch diese nahmen einen besonderen Platz ein. 13. Einige übergaben Zweige, die zu zwei Teilen dürr, zu einem Teil grün waren; auch sie bekamen einen besonderen Platz. 14. Andere brachten Zweige, die fast ganz grün waren; nur ein ganz kleiner Teil, und zwar die Spitze war verdorrt; auch zeigten sie Risse; auch diese stellten sich gesondert auf. 15. Bei einigen war nur ganz wenig grün, der übrige Teil der Zweige aber verdorrt; auch diese bekamen einen Platz für sich. 16. Endlich kamen andere mit Zweigen, die so grün waren, wie sie dieselben von dem Engel bekommen hatten; und zwar übergab der größere Teil der Menge solche Zweige. Über sie war der Engel hocherfreut; auch diese traten an einen besonderen Platz. 17. [Auch kamen einige mit grünen Zweigen, die Schösslinge hatten, auch diese stellten sich gesondert auf, und auch über sie war der Engel hocherfreut.] 18. Zuletzt übergaben einige ihre Zweige, die grün waren und Schösslinge hatten; die Schösslinge zeigten Fruchtansätze. Und die Leute, deren Zweige dergestalt sich zeigten, waren überaus fröhlich; der Engel war entzückt über sie, und auch der Hirte war ihretwegen ganz froh.</p><p>1. Der Engel des Herrn befahl, Kränze herbeizubringen. Und es wurden Kränze, die aussahen wie Palmkränze, gebracht, und er bekränzte damit die Männer, welche die Zweige mit den Schösslingen und dem Fruchtansatz übergeben hatten, und entließ sie in den Turm. 2. Auch die anderen schickte er in den Turm, welche die grünenden Zweige mit Schösslingen ohne Frucht übergeben hatten, und gab ihnen ein Siegel. 3. Es hatten aber alle, die in den Turm gingen, das gleiche Gewand an, weiß wie Schnee. 4. Die aber, welche ihre Zweige grün, wie sie dieselben bekommen hatten, abgaben, entließ er auch, nachdem er ihnen Gewand und Siegel gegeben hatte. 5. Als der Engel damit fertig war, sprach er zum Hirten: „Ich gehe weg; diesen aber sollst du innerhalb der Mauern einen Platz anweisen, wie ein jeder zu wohnen verdient. Betrachte aber ihre Zweige gewissenhaft, und danach weise sie an; gib aber genau acht; sieh zu, dass keiner dich täusche. Wenn dich aber einer täuscht, so werde ich ihn richten an dem Altare.“ Nachdem er dies dem Hirten gesagt hatte, ging er fort. 6. Als der Engel weggegangen war, sprach zu mir der Hirte: „Wir wollen die Zweige von allen nehmen und sie einpflanzen, ob nicht einige von ihnen zum Leben kommen könnten.“ Ich sagte zu ihm: „O Herr, wie werden denn diese dürren Zweige ausschlagen können?“ 7. Er entgegnete mir: „Dieser Baum ist eine Weide, und diese schlagen gern aus; wenn also die Zweige eingepflanzt werden und ein wenig Feuchtigkeit bekommen, werden viele von ihnen ausschlagen; wir wollen es dann auch versuchen, ihnen Wasser zuzugießen; wenn der eine oder andere zum Leben kommt, werde ich mich über sie freuen; wenn nicht, so werde ich doch nicht als ein Nachlässiger dastehen.“ 8. Der Hirte befahl mir, alle, ihrem Platze nach, herbeizurufen; sie kamen Reihe um Reihe und übergaben ihre Zweige dem Hirten; dieser nahm ihnen die Zweige ab, pflanzte sie nach Reihen ein und begoss sie dann mit viel Wasser, so dass man vor Wasser die Zweige nicht mehr sehen konnte. 9. Und nachdem er die Zweige getränkt hatte, sprach er zu mir: „Nun wollen wir gehen; in einigen Tagen wollen wir wieder kommen und nach allen Zweigen sehen; denn der diesen Baum gepflanzt hat, will, dass alle leben, die Zweige von diesem Baume empfangen haben. Und ich hoffe auch, dass diese Zweige, nachdem sie Feuchtigkeit bekommen und Wasser getrunken haben, zum größten Teil wieder leben werden.“</p><p>1. Da sagte ich zu ihm: „Herr, erkläre mir, was dieser Baum zu bedeuten hat; denn ich bin seinetwegen im unklaren, weil er trotz der Wegnahme so vieler Zweige unversehrt geblieben ist und man gar nicht merkt, dass etwas von ihm weggeschnitten ist; darüber bin ich mir nicht klar.“ 2. „Höre“, versetzte er; „dieser große Baum, der Ebenen und Berge und die ganze Erde überdeckt, bedeutet das Gesetz Gottes, das für die ganze Welt gegeben ist. Dies Gesetz aber ist der Sohn Gottes, der bis an die Grenzen der Erde verkündet worden ist. Die Völker in seinem Schatten sind die, welche seine Botschaft hörten und an ihn glaubten. 3. Der große und herrliche Engel ist Michael, der Gewalt hat über dieses Volk und dasselbe beherrscht. Denn dieser ist es, der sein Gesetz in die Herzen der Gläubigen gelegt hat; und denen er es gegeben hat, bei denen schaut er nach, ob sie es gehalten haben. 4. Du siehst den Zweig von jedem einzelnen; denn die Zweige sind das Gesetz. Du siehst nun, dass viele Zweige verdorben sind; daraus wirst du jeden, der das Gesetz nicht gehalten hat, erkennen, auch wirst du sehen, wo ein jeder wohnen wird.“ 5. Ich fragte ihn: „Herr, warum schickte er die einen in den Turm und überließ dir die anderen?“ „Alle, die das von ihm überkommene Gesetz übertreten haben, übergab er in meine Gewalt zur Buße; wer aber dem Gesetze bereits Genüge getan und es erfüllt hatte, den behielt er in seiner eigenen Gewalt.“ 6. „Wer sind nun, Herr, die, welche mit Kränzen geschmückt in den Turm gingen?“ „[Bekränzt wurden die, welche mit dem Teufel gerungen und ihn niedergerungen haben]; das sind solche, die für das Gesetz gelitten haben. 7. Die anderen aber, die zwar gleichfalls grünende Zweige mit Trieben, aber ohne Fruchtansatz übergeben haben, das sind die, welche für das Gesetz wohl Mühsal getragen, aber nicht gelitten noch ihr eigenes Gesetz verleugnet haben. 8. Grün, wie sie dieselben bekommen hatten, gaben ihre Zweige die ab, welche heilig und gerecht in sehr großer Herzensreinheit gelebt und die Gebote des Herrn gehalten haben. Das übrige sollst du erfahren, wenn ich nach diesen eingepflanzten und begossenen Zweigen gesehen habe.“</p><p>1. Nach einigen Tagen kamen wir wieder an den Ort; der Hirte ließ sich auf den Platz des Engels nieder, und ich trat neben ihn. Da sprach er zu mir: „Lege dir ein reines Linnen um aus grobem Stoff [und diene mir;“ ich legte das Linnen um]. 2. Wie er mich dann gegürtet und für seinen Dienst bereit sah, sprach er: „Rufe die Männer, denen die eingepflanzten Zweige gehören, in der Reihenfolge, wie sie ihre Zweige abgegeben haben;“ und ich ging in die Ebene und rief sie alle her; da traten sie alle reihenweise an. 3. Und er sagte ihnen: Jeder soll seinen Zweig herausziehen und ihn zu mir bringen. 4. Die ersten nun, die ihre Zweige abgaben, hatten dürre und verstümmelte Zweige; als diese dürr und verstümmelt erfunden waren, ließ er die Leute an einen gesonderten Platz aufstellen. 5. Dann kamen die, welche dürre, aber keine verstümmelten Zweige brachten; einige von ihnen brachten auch grüne Zweige, die von anderen waren dürr und wie von Motten angefressen. Die Überbringer der grünen Zweige ließ er gesondert aufstellen, die mit den dürren und angefressenen Zweigen stellte er zu den ersten. 6. Dann kamen die mit den halbdürren und aufgerissenen Zweigen; und viele von diesen brachten grüne Zweige ohne Riss; einige brachten (sogar) grüne Zweige mit Trieben und Früchten an den Trieben, so wie die, welche mit Kränzen geschmückt in den Turm gegangen waren; viele andere brachten dürre und angefressene, oder dürre Zweige, die nicht angefressen waren, oder solche, die halbdürr waren und Risse zeigten. Er wies einem jeden seinen besonderen Platz an, die einen stellte er nämlich zu den passenden Abteilungen, die anderen aber besonders für sich.</p><p>1. Dann kamen die zur Abgabe der Zweige, die zuerst grüne Zweige mit Rissen hatten; diese brachten lauter grüne Zweige, und sie bildeten eine eigene Abteilung. Über sie freute sich der Hirte, weil alle sich geändert und die Risse verloren hatten. 2. Es kamen auch solche, welche früher halb grüne, halb dürre Zweige hatten; unter diesen fanden sich ganz grüne, halbdürre, dürre und zernagte, auch grüne Zweige mit Schösslingen; diese wurden alle entlassen, ein jeder zu seiner Abteilung. 3. Dann kamen die, deren Zweige zu zwei Drittel grün, zu einem Drittel dürr waren; viele von ihnen übergaben grüne, viele halbdürre, andere dürre und angefressene Zweige. Diese alle stellten sich zu der für sie passenden Abteilung. 4. [Hernach kamen die, deren Zweige zu zwei Drittel dürr und ein Drittel grün waren; viele von ihnen brachten auch halbdürre, andere dürre und angefressene, andere halbdürre mit Rissen, nur wenige brachten grüne Zweige; alle diese stellten sich zu der für sie passenden Abteilung] 5. Dann kamen noch die zur Abgabe, welche grüne Zweige gehabt hatten, die aber ein klein wenig [dürr] waren und Risse hatten; von diesen gaben einige grüne, einige auch grüne Zweige mit Schösslingen ab; auch sie traten weg, ein jeder zu seiner Schar. 6. Dann kamen noch die daran, deren Zweige früher nur zum kleinsten Teil grün, im übrigen aber dürr waren; ihre Zweige waren zum größten Teil grün, hatten Schösslinge und an den Schösslingen Frucht, einige von ihnen waren ganz grün. Über diese Zweige freute sich der Hirte geradezu ungemein, weil sie in dieser Gestalt sich zeigten. Auch sie traten weg, ein jeder zu seiner Abteilung.</p><p>1. Als der Hirte alle Zweige angesehen hatte, sprach er zu mir: „Ich habe dir gesagt, dass dieser Baum sehr lebensfähig ist. Siehst du, wie viele Buße taten und Rettung fanden?“ „Ja, ich sehe es, Herr.“ „Damit du die Erbarmung des Herrn erkennst, wie groß und herrlich sie ist und wie er den Geist verliehen hat denen, die der Buße würdig sind.“ 2. „Warum“, fragte ich, „warum, o Herr, haben sie nicht alle Buße getan?“ „Bei wem der Herr sah, dass er sein Herz rein halten und ihm aus ganzer Seele dienen will, dem hat er die Buße verliehen; dagegen hat er denen keine Buße verliehen, bei denen er Falschheit und Schlechtigkeit sah, dass sie nur zum Scheine Buße tun wollten, damit sie nicht von neuem seinen Namen schänden.“ 3. Ich sprach dann zu ihm: „Gib mir jetzt noch Auskunft über die Überbringer der Zweige, wie es sich mit einem jeden von ihnen verhält, und über ihren Aufenthaltsort, damit, wenn die Gläubigen, die das Siegel empfangen, es aber gebrochen und nicht unversehrt bewahrt haben, es hören, ihre Werke erkennen und Buße tun, und dann, wenn sie von dir das Siegel erhalten haben, den Herrn preisen, dass er sich über sie erbarmt und dich gesandt hat zur Erneuerung ihres Geistes.“ 4. „Höre“, sprach er: „Deren Zweige man trocken und von der Motte angefressen fand, das sind die Abtrünnigen und Verräter der Kirche, die durch ihre Verfehlungen den Herrn gelästert haben, ja sogar sich des Namens des Herrn schämten, der über sie angerufen worden. Diese sind bis ans Ende verloren für Gott. Du siehst, dass nicht ein einziger von ihnen Buße tat, obwohl sie hörten, was du in meinem Auftrag ihnen sagtest; von solchen ist das Leben gewichen. 5. Die Überbringer der dürren, nicht zerfressenen Zweige stehen jenen ziemlich nahe; es waren Heuchler, Verbreiter falscher Lehren, Verführer der Diener Gottes, hauptsächlich der Sünder, da sie diese nicht zur Buße zuließen, sondern sie mit ihren törichten Lehren beschwatzten. Für sie bleibt die Aussicht auf Buße. 6. Du siehst ja, dass viele von ihnen schon Buße getan, seitdem du ihnen meine Gebote kund getan hast; auch werden einige noch Buße tun. Wer aber nicht Buße tun wird, der hat sein Leben verloren; wer von ihnen sich bekehrte, wurde gut, und seine Wohnung ist innerhalb der ersten Mauer; einige von ihnen kamen sogar in den Turm. Du siehst also“, sprach er, „dass Buße tun für die Sünder Leben bringt, das Verweigern der Buße aber Tod.“</p><p>1. „Nun höre von denen, die halbdürre Zweige mit Rissen übergeben haben. Diejenigen, deren Zweige gleichmäßig halb dürr waren, das sind die Zweifler; sie leben nicht noch sind sie tot. 2. Die Überbringer von halbdürren Zweigen mit Rissen das sind Zweifler und Verleumder, die niemals im Frieden miteinander leben, sondern immer Streit haben. Aber auch für diese“, sprach er, „gibt es eine Buße. Du siehst, dass einige von ihnen Buße getan haben. Außerdem ist bei einigen noch Aussicht, dass sie Buße tun werden. 3. Und wer von ihnen Buße getan, der bekommt Wohnung im Turme. Wer aber aus ihnen nur langsam Buße getan hat, der wird innerhalb der Mauern wohnen. Wer aber keine Buße tut, sondern in seinem Tun verharrt, der wird des Todes sterben. 4. Die Überbringer von grünen Zweigen mit Rissen, das waren durchaus gläubige und gute Leute, aber sie waren eifersüchtig aufeinander wegen irgendeines Vorranges oder irgendeiner Ehre; aber alle diese sind törichte Leute, die wegen des Vorranges aufeinander [eifersüchtig] sind. 5. Aber auch diese haben, da sie gut waren, auf meine Gebote geachtet und haben sich durch rasche Buße gereinigt. Deshalb bekamen sie Wohnung im Turme; wer sich aber wieder dem Streite zuwendet, der wird aus dem Turme ausgestoßen werden und seines Lebens verlustig gehen. 6. Alle aber, die des Herrn Gebote halten, werden das Leben besitzen; in den Geboten aber steht nichts von Vorrang und Ehre, sondern von Langmut und Demut eines Mannes. Solche haben das Leben des Herrn, die Streitsüchtigen und Sünder aber den Tod.“</p><p>1. „Die Überbringer von halbgrünen und halbdürren Zweigen aber das sind die, welche in weltliche Geschäfte sich verwickelt, aber nicht den Heiligen sich angeschlossen haben; deshalb ist die eine Hälfte von ihnen lebendig, die andere abgestorben. 2. Von diesen haben viele auf meine Gebote gehört und Buße getan; diese haben ihre Wohnung im Turme. Einige sind aber auch für immer abgefallen; diese haben keine Buße getan; denn durch ihre Geschäfte hatten sie den Herrn geschmäht und verleugnet. Sie haben das Leben verloren wegen ihrer Schlechtigkeit, die sie übten. 3. Viele von ihnen waren noch unentschieden; diesen wird die Buße noch zuteil, wenn sie rasch Buße tun, und auch ihre Wohnung wird im Turme sein; wenn sie aber ihre Buße verzögern, werden sie innerhalb der Mauern wohnen; und wenn sie überhaupt keine Buße tun, haben auch sie ihr Leben verloren. 4. Die Überbringer von Zweigen, die zu zwei Dritteln grün und zu einem Drittel dürr waren, sind solche, die in verschiedenen Fällen (den Herrn) verleugnet haben. 5. Viele derselben taten Buße und kamen in den Turm zu wohnen; viele aber sind auf immer von Gott abgefallen; diese haben das Leben auf immer verloren. Einige von ihnen lebten auch im Zweifel und Unfrieden. Für diese gibt es eine Buße, wenn sie schnell Buße tun und nicht in ihren Gelüsten verharren; wenn sie aber weitermachen in ihrem Tun, dann bereiten auch diese sich selbst den Tod.“</p><p>1. „Die Überbringer sodann von den Zweigen, die zu zwei Dritteln dürr und nur zu einem Drittel grün sind, das sind solche, die gläubig waren, dann aber reich wurden und angesehen unter den Heiden; sie hüllten sich in ein hochmütiges Gebaren, wurden stolz, wichen ab von der Wahrheit und verkehrten nicht mehr mit den Gerechten, sondern richteten ihr Leben auf heidnische Weise ein, und dieser Weg schien ihnen bequemer zu sein; von Gott sind sie nicht abgefallen, vielmehr verharrten sie im Glauben, aber sie taten nicht die Werke des Glaubens. 2. Viele von ihnen taten nun Buße, und diese erhielten Wohnung im Turme. 3. Andere aber, die immer mit den Heiden verkehrten, ließen sich durch die Eitelkeiten derselben verderben, fielen von Gott ab und taten die Werke der Heiden. Diese wurden zu den Heiden gerechnet. 4. Andere aber von ihnen verfielen in Zweifel, da sie an ihrem Heile verzweifelten wegen der Werke, die sie getan; andere fielen gleichfalls in Zweifel und richteten Spaltungen an in ihren Kreisen. Für die, welche wegen ihrer Werke dem Zweifel verfielen, gibt es noch eine Buße; aber sie müssen sich damit beeilen, dass sie noch im Turme eine Wohnung bekommen; dagegen ist der Tod denen nahe, die keine Buße tun, sondern in ihren Lüsten verharren.“</p><p>1. „Die Überbringer der grünen Zweige, an denen nur die Spitze dürr und aufgerissen war, waren stets gute, gläubige und bei Gott angesehene Leute; sie haben nur ganz wenig gefehlt wegen kleiner Begierden und wegen kleiner Feindseligkeiten, die sie miteinander hatten. Als sie aber meine Worte vernahmen, taten sie zum größten Teil sofort Buße und bekamen Wohnung im Turme. 2. Einige von ihnen verfielen zwar dem Zweifel, und im Zweifel riefen sie eine größere Spaltung hervor. In ihnen lebt die Hoffnung auf Buße, weil sie alle Zeit gut waren; schwerlich wird einer von ihnen sterben. 3. Die Überbringer von dürren Zweigen aber, von denen nur ein ganz kleiner Teil grün war, sind die, welche nur glaubten, aber die Werke der Gottlosigkeit übten; aber sie sind nie von Gott abgefallen, haben freudig seinen Namen getragen und haben gerne die Diener Gottes in ihre Häuser aufgenommen. Als sie nun von dieser Buße hörten, da taten sie unverweilt Buße, und jetzt üben sie jegliche Tugend und Gerechtigkeit. 4. Einige von ihnen sind sogar bereit [zu leiden] in der Erkenntnis ihres früheren (sündhaften) Tuns. Diese werden sämtlich im Turme wohnen.“</p><p>1. Als er mit der Auslegung aller Zweige fertig war, sprach er zu mir: „Gehe hin und sage zu allen, sie sollen Buße tun, und sie werden in Gott leben; denn der Herr hat in seiner Erbarmung mich gesandt, allen Buße zu gewähren, auch wenn einige wegen ihrer Werke sie nicht verdienen. Aber in seiner Langmut will der Herr, dass alle das Heil erlangen, die durch seinen Sohn berufen worden sind.“ 2. Darauf sagte ich: „Herr, ich hoffe, dass alle, die es hören, Buße tun; denn ich bin überzeugt, dass ein jeder in der Erkenntnis seiner eigenen Werke und aus Furcht vor Gott Buße tun wird.“ 3. Da antwortete er mir: „Alle, die aus ganzem Herzen [Buße tun und] sich von den genannten Sünden reinigen und fernerhin keine Ungerechtigkeit mehr begehen, werden Heilung ihrer begangenen Sünden vom Herrn erhalten und werden in Gott leben, wenn sie nicht wanken in diesen Geboten. [Wer aber in seinen Sünden weiterlebt und in den Lüsten dieser Welt wandelt, der schreibt sich selbst das Todesurteil.] 4. Und du selbst wandle in meinen Geboten, und du wirst leben [in Gott; und alle, die in ihnen wandeln und recht handeln, werden in Gott leben].“ 5. Nachdem er mir all das gezeigt und gesagt hatte, sprach er: „Das übrige werde ich dir in einigen Tagen erklären.“</p><h2>Neuntes Gleichnis</h2><p>1. Als ich die Gebote und Gleichnisse des Hirten, des Engels der Buße, aufgeschrieben hatte, kam er zu mir und sprach zu mir: „Ich will dir zeigen, was dir der Heilige Geist gezeigt hat, der in der Gestalt der Kirche mit dir gesprochen hat; jener Geist nämlich ist der Sohn Gottes. 2. Da du nämlich zu schwach warst im Fleische, wurde dir keine Offenbarung durch einen Engel gegeben. Nachdem du dann gestärkt warst durch den Geist und gekräftigt in deiner Kraft, so dass du auch den Anblick eines Engels ertragen konntest, da wurde dir durch die Kirche der Bau des Turmes geoffenbart; du hast alles schön und würdig geschaut, wie wenn eine Jungfrau es dir gezeigt hätte. Jetzt aber wird dir die Offenbarung von einem Engel durch denselben Geist gegeben. 3. Aber du sollst durch meine Vermittlung alles genauer kennen lernen. Deshalb wurde mir auch von dem herrlichen Engel der Auftrag gegeben, in deinem Hause zu wohnen, damit du alles mit starkem Sinne sehest, nichts fürchtend wie das erste Mal.“ 4. Und er führte mich weg nach Arkadien auf einen busenförmigen Berg, hieß mich auf der Spitze des Berges niedersitzen und zeigte mir eine große Ebene und rings um die Ebene zwölf Berge, von denen jeder ein anderes Aussehen hatte. 5. Der erste war schwarz wie Ruß, der zweite war kahl ohne Pflanzenwuchs, der dritte war voll Dornen und Disteln. 6. Was auf dem vierten wuchs, war halbdürr, oben grün und gegen die Wurzel hin verdorrt; einige Pflanzen verdorrten, wenn die Sonne darauf brannte. 7. Der fünfte Berg hatte grüne Kräuter, war aber rauh. Der sechste Berg war voll von Spalten, teils kleinen teils großen; in den Spalten wuchsen Pflanzen, aber sie waren gar nicht üppig, sondern mager. 8. Der siebte Berg hatte lachende Kräuter, und der ganze Berg war frisch, und alle Arten von Tieren und Vögeln weideten auf diesem Berge; und je mehr die Tiere und die Vögel fraßen, um so reicher wuchsen die Pflanzen dieses Berges. Der achte Berg war voll von Quellen, und alle Geschöpfe des Herrn tranken aus den Quellen dieses Berges. 9. Der neunte Berg aber hatte gar kein Wasser und sah ganz wie eine Wüste aus; auf ihm lebten wilde Tiere und tödliche Schlangen, die den Menschen verderblich sind. Der zehnte Berg war mit sehr hohen Bäumen bewachsen und war ganz schattig, und in seinem Schatten lagerten viele Schafe, die ausruhten und wiederkäuten. 10. Auf dem elften Berge standen die Bäume dicht, ganz dicht beieinander, und zwar waren es fruchtbare Bäume, jeder mit anderen Früchten behangen, dass es jeden, der sie sah, gelüstete, davon zu essen. Der zwölfte Berg war ganz weiß und bot einen freudigen Anblick, und der Berg an sich war sehr schön.</p><p>1. In der Mitte der Ebene zeigte er mir einen großen, leuchtenden Felsen, der sich aus der Ebene erhob. Dieser Felsen war höher als die Berge, rechtwinklig, so dass er die ganze Welt fassen konnte. 2. Der Felsen war alt, ein Tor war in denselben eingehauen, und zwar schien es mir, als sei das Tor erst ganz frisch angebracht. Dieses war glänzend wie die Sonne, so dass ich staunen musste über seine Lichtfülle. 3. Rings um das Tor standen zwölf Jungfrauen. Die vier an den Ecken stehenden erschienen mir als die prächtigsten; aber auch die anderen waren prächtig. Sie waren aber so aufgestellt: vier an den Ecken des Tores und in der Mitte jedesmal zwei. 4. Sie trugen Linnengewänder, waren züchtig gegürtet; die rechte Schulter war frei, als ob sie eine Last tragen wollten. So standen sie bereit, waren sehr freudig und wohlgemut. 5. Als ich dies gesehen hatte, staunte ich bei mir selbst über den Anblick der großen, herrlichen Dinge. Sodann wusste ich nicht, warum die doch so zarten Jungfrauen so tapfer dastanden, als wollten sie den ganzen Himmel tragen. 6. Da sprach der Hirte zu mir: „Warum grübelst du nach über Dinge, die du nicht verstehst, und schaffst dir selbst Kummer? Wenn du vernünftig bist, dann wage dich nicht an Dinge, die du nicht begreifen kannst, sondern wende dich an den Herrn, damit du Einsicht bekommst, sie zu begreifen. 7. Was hinter dir liegt, kannst du nicht sehen, was vor dir ist, siehst du. Lasse daher in Ruhe und quäle dich nicht um Sachen, die du nicht sehen kannst; was du siehst, das mache dir zu eigen, und um das übrige kümmere dich nicht; alles, was ich dir gezeigt habe, werde ich erklären. So schau nun, was noch kommt!“</p><p>1. Da sah ich sechs große, stattliche Männer kommen, die einander gleich sahen; und sie riefen eine Anzahl Männer herbei. Und es kamen lauter große, schöne, kräftige Männer; jene sechs befahlen nun diesen, oben auf dem Felsen [und zwar über dem Tore] einen Turm zu bauen. Es entstand aber ein großer Lärm, als diese Männer herbeirückten zum Bau des Turmes und da und dorthin sich um das Tor drängten; 2. die Jungfrauen aber, welche um das Tor herumstanden, sagten den Männern, sie sollen sich beeilen mit dem Turmbau; dabei hatten die Jungfrauen ihre Hände ausgestreckt, als wollten sie von den Männern etwas in Empfang nehmen. 3. Da befahlen jene sechs Männer, es sollten sich aus der Tiefe Steine erheben und zum Turmbau herankommen. Da kamen zehn prächtige [nicht-] behauene Quadersteine herauf. 4. Dann riefen die sechs die Jungfrauen herbei und gaben ihnen den Auftrag, alle die Steine, die zum Bau des Turmes verwendet werden sollten, durch das Tor hindurchzutragen und sie den Männern zu bringen, deren Aufgabe es war, den Turm zu erstellen. 5. Und die Jungfrauen hoben die zehn Steine, die zuerst aus der Tiefe emporstiegen, miteinander auf und trugen zusammen jedesmal einen fort.</p><p>1. Wie sie miteinander rings vor dem Tore gestanden waren, in dieser Ordnung blieben sie auch beim Tragen, und zwar hatten die, die als die Stärkeren erschienen waren, den Stein an den Ecken auf sich genommen; die anderen hatten sich an den Seiten unter den Stein gestellt, und auf diese Weise trugen sie alle Steine fort; sie gingen mit ihrer Last der Weisung gemäß durch das Tor und brachten sie den Männern für den Turm; diese nahmen die Steine ab und verwendeten sie zum Bau. 2. Der Turm aber wurde auf dem hohen Felsen, und zwar über dem Tore erstellt. Es wurden [also] diese [zehn] Steine aneinandergelegt [und sie füllten die ganze Fläche des Felsens aus. So wurden sie] zum Fundament für den Turmbau; der Felsen aber und das Tor trugen den ganzen Turm. 3. Nach den zehn ersten Steinen kamen noch [fünfund]zwanzig aus der Tiefe herauf; sie wurden ebenfalls wie die ersten von den Jungfrauen getragen und in den Bau des Turmes gefügt. Hernach kamen fünfunddreißig Steine herauf, die ebenso dem Turme einverleibt wurden. Danach kamen vierzig weitere Steine, die alle für den Bau zum Turme geschafft wurden; [so waren es jetzt vier Reihen an dem Fundament des Turmes]. 4. Von jetzt ab kamen keine Steine mehr aus der Tiefe empor; auch die Bauleute setzten ein wenig aus. Dann befahlen die sechs Männer wieder der Schar von Bauleuten, sie sollten Steine von den Bergen herbeischaffen für den Turmbau. 5. Sie brachten also von allen Bergen verschiedenfarbige Steine, die von den Männern behauen wurden, und übergaben sie dann den Jungfrauen; diese trugen die Steine durch das Tor und gaben sie ab für den Bau des Turmes. Und sobald die verschiedenfarbigen Steine dem Bau eingefügt waren, änderten sie die verschiedenen Farben und wurden gleichermaßen weiß. 6. Einige Steine wurden auch von den Männern zu dem Bau gebracht, aber diese wurden nicht hell, sondern sie blieben so, wie man sie hingelegt hatte; sie waren eben nicht von den Jungfrauen übergeben noch durch das Tor getragen worden. Diese Steine passten nun nicht in das Mauerwerk des Turmes. 7. Sobald die sechs Männer diese unpassenden Steine in der Mauer erblickten, ordneten sie an, dass dieselben entfernt und wieder hinabgeschafft würden an den Platz, wo ein jeder hergekommen war. 8. Und sie sagten zu den Männern, welche die Steine herbeitrugen: Ihr sollt gar keinen Stein für den Bau abgeben; leget sie vielmehr neben dem Turme nieder, damit sie die Jungfrauen durch das Tor tragen und sie abliefern für den Bau. Wenn sie nämlich nicht, sagten sie, von den Händen dieser Jungfrauen durch das Tor getragen werden, können sie ihre Farbe nicht ändern; gebet euch also keine vergebliche Mühe.</p><p>1. Und wirklich wurde an diesem Tage mit dem Bauen aufgehört, aber der Turm war doch noch nicht fertig; es sollte nämlich noch einmal daran gebaut werden; aber es trat eine Verzögerung ein im Bauen. Die sechs Männer befahlen den Bauleuten, sie sollten alle ein wenig zur Seite treten und ausruhen; den Jungfrauen aber geboten sie, nicht von dem Turme zu weichen. Ich hatte den Eindruck, als ob die Jungfrauen zur Bewachung des Turmes dableiben mussten. 2. Als sich alle zur Erholung zurückgezogen hatten, fragte ich den Hirten: „Herr, warum wurde der Bau des Turmes nicht ganz vollendet?“ Dieser erwiderte: „Der Turm kann erst dann ganz fertiggestellt werden, wenn der Herr desselben da war und diesen Bau geprüft hat, damit er die Steine, die etwa als morsch sich herausstellen, auswechsle; denn auf seinen Wunsch hin wird der Turm gebaut.“ 3. „Ich möchte gerne von diesem Turme wissen, Herr, was seine Erbauung zu bedeuten hat, und was der Felsen, das Tor, die Berge, die Jungfrauen und die Steine, die aus der Tiefe heraufkamen und ohne weitere Bearbeitung, wie sie waren, in den Bau kamen. 4. Ferner warum zuerst zehn Steine für das Fundament gelegt wurden, dann fünfundzwanzig, dann fünfunddreißig, dann vierzig; auch über die Steine möchte ich Aufklärung, die zuerst in den Bau eingefügt waren, dann aber herausgenommen und wieder an ihren früheren Platz zurückgebracht wurden; über all dies mögest du, Herr, meine Seele beruhigen und mir Auskunft darüber geben.“ 5. „Wenn es bei dir nicht eitle Neugier ist, wirst du alles erfahren; denn in einigen Tagen [werden wir wieder hierher kommen, dann sollst du alles genau sehen, was an dem Turme noch gemacht wird, und auch alle Gleichnisse sollst du deutlich erfahren.“ 6. Und nach einigen Tagen] kamen wir dorthin, wo wir gesessen waren. Da sagte er zu mir: „Wir wollen zum Turme gehen; denn der Eigentümer des Turmes kommt, um ihn zu besichtigen.“ So gingen wir zum Turme; aber außer den Jungfrauen war gar niemand dort. 7. Da fragte der Hirte die Jungfrauen, ob der Herr des Turmes schon dagewesen sei; sie erwiderten, er werde erst kommen zur Besichtigung des Baues.</p><p>1. Und wirklich, gleich darauf sah ich eine große Schar von Männern kommen; in der Mitte ging ein Mann von solcher Größe, dass er den Turm überragte. 2. Und die sechs Männer, die den Turmbau [leiteten, gingen rechts und links von ihm; auch waren alle beim Bau des Turmes] beschäftigten Männer in seinem Gefolge, und außerdem umgaben ihn noch viele hervorragende Männer; die Jungfrauen aber, die Wache hielten am Turme, eilten auf ihn zu, küssten ihn und begannen dann, in seiner Nähe sich haltend, den Turm zu umschreiten. 3. Jener aber nahm es mit der Prüfung des Turmes so genau, dass er jeden einzelnen Stein betastete. Mit einem Stab, den er in der Hand hielt, schlug er an jeden einzelnen in den Bau gefügten Stein. 4. Auf den Schlag hin wurden einige von ihnen schwarz wie Ruß, einige bekamen Flecken, einige bekamen Risse, einige wurden verstümmelt, andere waren weder weiß noch schwarz, andere waren rauh und passten nicht zu den anderen Steinen, wieder andere bekamen viele schmutzige Stellen; das sind die verschiedenen Mängel, die sich an den morschen, für den Bau verwendeten Steinen zeigten. 5. Dann befahl er, alle diese Steine aus dem Turme zu entfernen, sie neben den Turm zu legen, andere Steine zu bringen und sie an ihre Stelle zu setzen. 6. [Da fragten ihn die Bauleute, von welchem Berge er wünsche, dass die Steine geholt würden, die an die Stelle jener kommen sollten.] Da befahl er, dass die Steine nicht von den Bergen, [sondern von einer nahen Ebene] geholt würden. 7. Als man in der Ebene nachgrub, fand man prächtige Steine, viereckige und runde. Alle Steine dieser Ebene wurden mitgenommen und von den Jungfrauen durch das Tor getragen. 8. Dann wurden die viereckigen Steine behauen und an Stelle der entfernten eingefügt; die runden aber wurden dem Mauerverband nicht einverleibt, weil sie fürs Behauen zu hart waren und die Arbeit nur langsam vorwärts ging. Sie wurden aber neben den Turm gelegt, wie wenn sie später behauen und dem Bau eingefügt werden sollten; denn es waren gar prächtige Steine.</p><p>1. Als dies der herrliche Mann, der Herr des ganzen Turmes, vollendet hatte, rief er den Hirten zu sich, übergab ihm sämtliche Steine, die neben dem Turme lagen und von dem Bau ausgeschieden waren, und sprach zu ihm: 2. „Reinige diese Steine sorgfältig und verwende sie für den Bau des Turmes, soweit sie sich den übrigen anpassen lassen; was nicht passen will, wirf weit weg vom Turme.“ 3. [Nachdem er dem Hirten diese Weisungen gegeben hatte, entfernte er sich vom Turme] mit allen, [die mit ihm gekommen waren]. Die Jungfrauen aber standen rings um den Turm, um ihn zu bewachen. 4. Da fragte ich den Hirten: „Wie können diese Steine in den Turm kommen, da sie doch verworfen sind?“ Er gab zur Antwort: „Siehst du diese Steine?“ „Ja, Herr.“ „Ich werde den größten Teil dieser Steine behauen und sie dem Bau einfügen, und sie werden zu den anderen Steinen passen.“ 5. „Wie aber können sie, Herr, wenn sie doch rings behauen sind, den gleichen Platz ausfüllen?“ Darauf erwiderte er: „Die sich als zu klein erweisen, werden in den mittleren Teil der Mauer geworfen, die größeren aber werden außen hinkommen und die anderen zusammenhalten.“ 6. Nach diesen Worten fuhr er fort: „Wir wollen jetzt gehen und in zwei Tagen wiederkommen; dann wollen wir diese Steine reinigen und sie in den Bau einfügen; denn rings um den Turm muss alles gereinigt werden, damit der Herr nicht einmal plötzlich komme und die Sachen beim Turm schmutzig finde und dann zürne; dann werden diese Steine nicht in den Bau des Turmes kommen, und mein Herr wird mich für nachlässig halten.“ 7. Als wir nach zwei Tagen zum Turme kamen, sagte er mir: „Nun wollen wir uns die Steine anschauen und sehen, welche in den Bau kommen können.“ Ich sagte: „Ja, Herr, wir wollen nachsehen.“</p><p>1. Wir fingen an und betrachteten zuerst die schwarzen Steine; sie sahen noch so aus, wie sie bei ihrer Entfernung aus dem Bau ausgesehen hatten. Und der Hirte befahl, sie von dem Turme wegzutragen und abseits zu legen. 2. Dann besichtigte er die mit den Flecken; davon nahm er viele, bearbeitete sie und befahl den Jungfrauen, sie hinaufzutragen und in den Bau zu legen. Und die Jungfrauen trugen sie hinauf und legten sie in die Mauer des Turmes, und zwar in die Mitte. Den Rest ließ er zu den schwarzen Steinen schaffen; denn auch sie zeigten eine schwarze Farbe. 3. Dann besah er die Steine mit Rissen; auch von diesen bearbeitete er viele und ließ sie durch die Jungfrauen zum Bau tragen; sie wurden auf die Außenseite gelegt, weil sie gesund erschienen. Der Rest konnte wegen der vielen Risse nicht bearbeitet werden; deshalb wurden sie fortgeschafft von dem Bauplatz des Turmes. 4. Dann sah er sich die Verstümmelten an, und dabei zeigte es sich, dass viele von ihnen schwarz waren, einige aber auch große Risse bekommen hatten; auch diese ließ er zu den verworfenen Steinen bringen; was davon noch übrig blieb, ließ er reinigen, bearbeiten und zu dem Bau bringen. Die Jungfrauen trugen sie hinauf und legten sie mitten in das Mauerwerk des Turmes; es waren nämlich schwache Steine. 5. Dann kamen die zur Hälfte weißen, zur Hälfte schwarzen an die Reihe; viele von ihnen wurden als schwarz erfunden; auch diese ließ er zu den verworfenen bringen. Alle übrigen wurden von den Jungfrauen hinaufgetragen; da sie weiß waren, wurden sie von den Jungfrauen selbst in den Bau eingefügt; sie bekamen ihren Platz außen, weil sie gesund schienen, so dass sie die Steine in der Mitte zusammenhalten konnten; an ihnen brauchte gar nichts weggehauen zu werden. 6. Hierauf besichtigte er die harten und rauhen Steine; von diesen mussten nur wenige weggeworfen werden, weil sie sich nicht bearbeiten ließen; denn sie waren zu hart; sonst wurden diese alle behauen und von den Jungfrauen hinaufgetragen und dem Mauerverband des Turmes mitten eingefügt, da sie schwach waren. 7. Dann betrachtete er die Steine mit den Schmutzflecken; von diesen waren nur wenige schwarz und wurden zu den anderen gelegt. Die übrigen erschienen glänzend und gesund. Auch diese wurden von den Jungfrauen dem Bauwerk eingefügt, und zwar auf der Außenseite, weil es kräftige Steine waren.</p><p>1. Hernach machte er sich daran, die weißen und runden Steine zu betrachten; da sprach er zu mir: „Was fangen wir mit diesen Steinen an?“ „Was verstehe denn ich, Herr?“ „So hast du dir also keine Gedanken über sie gemacht?“ 2. „Ich verstehe mich nicht auf dieses Handwerk, ich bin kein Steinmetz und kann es (daher) auch nicht verstehen.“ „Siehst du nicht, dass sie zu sehr gerundet sind? Und wenn ich sie viereckig machen will, muss viel von ihnen weggehauen werden; es müssen aber von ihnen notwendig einige in dem Bau Verwendung finden.“ 3. „Wenn dies sein muss, Herr, was zerbrichst du dir den Kopf und wählst dir für den Bau nicht die aus, die du willst, und fügst sie in denselben ein?“ Dann wählte er von ihnen die großen und schönen aus und bearbeitete sie; die Jungfrauen aber trugen sie hinauf und legten sie auf die Außenseiten des Baues. 4. Die anderen überflüssigen Steine aber wurden aufgehoben und in die Ebene zurückgetragen, woher sie geholt worden waren; aber sie wurden nicht verworfen, „weil“, wie er sagte, „noch eine Kleinigkeit am Turme zu bauen übrig bleibt“. Der Herr des Turmes will aber durchaus, dass diese Steine in den Bau eingefügt werden, weil sie überaus schön sind. 5. Dann wurden zwölf Frauen herbeigerufen, von schöner Gestalt, in schwarzen Kleidern [gegürtet, aber mit freien Schultern] und aufgelösten Haaren; es schien mir, als ob es Frauen vom Lande seien. Diesen befahl der Hirte, die vom Bau verworfenen Steine aufzuheben und in die Berge zurückzutragen, von wo sie auch hergeholt worden waren. 6. Diese hoben freudig alle Steine auf, trugen sie weg und legten sie da nieder, wo man sie geholt hatte. Als dann alle Steine weggeschafft waren und keiner mehr um den Turm lag, sprach der Hirte zu mir: „Nun wollen wir den Turm umschreiten und nachsehen, ob sich nicht irgendein Mangel an ihm findet.“ Und wir umschritten ihn beide. 7. Wie nun der Hirte sah, dass der Turm im Bau gar wohl gelungen war, zeigte er sich hocherfreut; er war nämlich so gebaut, dass mich bei seinem Anblick Sehnsucht erfaßte, in ihm zu wohnen; er war nämlich so gebaut, wie wenn er aus einem einzigen Stein und zu <strong>einem</strong> Stück zusammengefügt wäre; es machte den Eindruck, als ob der Stein aus dem Felsen herausgehauen wäre; mir schien er aus <strong>einem</strong> Steine zu sein.</p><p>1. Als ich so mit ihm ging, war ich sehr erfreut, als ich sah, wie gut dies war. Der Hirte aber sprach zu mir: „Geh und bringe mir Kalk und kleine Scherben, damit ich die Hohlräume, die durch die Wegnahme der zum Bau verwendeten Steine entstanden waren, ausfülle; denn es muss alles rings um den Turm eben sein.“ 2. Ich tat nach seinem Befehle und brachte ihm die Sachen. „Hilf mir“, sprach er, [„und das Werk wird bald vollendet sein“]. Dann füllte er die Formen der Steine, die in den Bau gekommen waren, aus und ließ den Platz rings um den Turm aufräumen und reinigen. 3. Die Jungfrauen nahmen Besen zur Hand und kehrten, trugen allen Unrat vom Turme fort, sprengten Wasser aus, und so bekam der Platz beim Turme ein freundliches und gar gefälliges Aussehen. 4. Jetzt sagte der Hirte zu mir: „Alles ist gereinigt; wenn der Herr zur Besichtigung des Turmes kommt, hat er keinen Grund, uns etwas vorzuhalten.“ Nach diesen Worten wollte er weggehen. 5. Ich aber hielt ihn an seiner Tasche fest und begann, ihn beim Herrn zu beschwören, dass er mir das erkläre, was er mir gezeigt hatte. Er sagte zu mir: „Im Augenblick habe ich keine Zeit; aber ich werde dir alles erklären. Warte hier auf mich, bis ich komme.“ 6. Ich erwiderte: „Herr, was soll ich hier tun, wenn ich allein bin.“ „Du bist nicht allein; denn diese Jungfrauen sind bei dir.“ „So übergib mich ihnen“, bat ich. Da rief sie der Hirte heran und sagte ihnen: „Ich empfehle euch diesen Mann, bis ich wiederkomme“ Und er ging weg. 7. Ich aber war allein mit den Jungfrauen; sie waren recht heiter und sehr freundlich zu mir, besonders die vier stattlicheren von ihnen.</p><p>1. Die Jungfrauen sprachen zu mir: „Heute kommt der Hirte nicht mehr hierher.“ „Was soll ich nun tun?“ „Warte auf ihn bis zum Abend. Wenn er kommt, wird er mit dir reden; wenn er nicht kommt, warte mit uns hier, bis er kommt.“ 2. Ich erwiderte: „Bis zum Abend will ich auf ihn warten; wenn er aber nicht kommt, werde ich nach Hause gehen und morgen früh zurückkehren.“ Diese aber erwiderten mir: „Uns bist du übergeben; du darfst dich von uns nicht entfernen.“ 3. „Wo soll ich denn bleiben?“ „Du wirst bei uns schlafen wie ein Bruder, nicht wie ein Mann; du bist unser Bruder, und wir wollen fernerhin bei dir wohnen; denn wir lieben dich sehr.“ Ich aber errötete darüber, dass ich bei ihnen bleiben sollte. 4. Jene aber, welche die erste unter ihnen zu sein schien, begann mich zu küssen und mich zu umarmen; als aber die anderen sahen, dass diese mich umarmte, fingen auch sie an, mich zu küssen, mich rings um den Turm herumzuführen und mit mir zu spielen. 5. Und wie wenn ich jünger geworden wäre, fing auch ich an, mit ihnen zu spielen. Die einen führten einen Reigen auf, die anderen tanzten, wieder andere sangen; ich aber ging schweigend mit ihnen um den Turm und war froh mit ihnen. 6. Als es [aber Abend] geworden war, wollte ich in mein Haus zurückkehren; aber sie ließen mich nicht fort, sondern hielten mich zurück. So blieb ich die Nacht bei ihnen und schlief bei dem Turme. 7. Die Jungfrauen breiteten nämlich ihre leinenen Gewänder auf den Boden aus und legten mich in ihre Mitte und sie taten gar nichts als beten; auch ich betete ohne Unterbrechung mit ihnen, und zwar nicht weniger als sie. Und die Jungfrauen freuten sich darüber, dass ich so betete. Ich blieb daselbst bei den Jungfrauen bis zur zweiten Stunde des anderen Tages. 8. Dann kam der Hirte und sagte zu den Jungfrauen: „Habt ihr ihm etwa was Unrechtes getan?“ „Frage ihn selbst“, erwiderten sie. Ich sagte ihm: „Herr, ich bin froh darüber, dass ich bei ihnen geblieben bin.“ „Was hast du zu essen bekommen?“ „Meine Speise war die ganze Nacht hindurch das Wort Gottes.“ „Haben sie dich gut aufgenommen?“ „Gewiss, Herr.“ 9. „Was willst du jetzt“, fuhr er fort, „zuerst hören?“ „So, Herr, wie du es mir von Anfang an gezeigt hast; ich bitte dich, Herr, dass du es mir so erklärest, wie ich dich frage.“ „Wie du willst werde ich es dir erklären und gar nichts vor dir geheim halten.“</p><p>1. „Fürs allererste, Herr, erkläre mir dies: Was bedeutet der Felsen und das Tor?“ „Der Felsen und das Tor bedeuten den Sohn Gottes.“ „Wie aber, o Herr, kommt es, dass der Felsen alt, das Tor aber neu ist?“ „Merke auf und begreife es, du Unverständiger. 2. Der Sohn Gottes ist älter als seine ganze Schöpfung, so dass er auch der Ratgeber seines Vaters bei seiner Schöpfung sein konnte; deshalb ist er (der Felsen) auch alt.“ „Warum aber ist das Tor neu, Herr?“ 3. Weil er (der Sohn) sich erst in den letzten Tagen der Erfüllung geoffenbart hat; deshalb ist das Tor neu, damit die, welche das Heil erlangen sollen, durch dasselbe in das Reich Gottes gelangen. 4. Hast du gesehen, wie die durch das Tor hereingekommenen Steine für den Bau des Turmes [verwendet wurden], die anderen aber, die nicht durch das Tor gekommen waren, wieder an ihren Platz zurückgebracht wurden?“ „Ja, Herr.“ „So wird niemand in das Reich Gottes gelangen, wenn er nicht den Namen seines Sohnes annimmt. 5. Wenn jemand in eine Stadt kommen will und diese Stadt ringsum mit einer Mauer umgeben ist und nur ein Tor hat, kann er denn auf einem anderen Wege in jene Stadt gelangen als [durch das eine Tor,] das sie hat?“ „Wie könnte es anders sein, Herr?“ „Wie man nun in die Stadt nicht anders gelangen kann als durch ihr Tor, so kann auch ein Mensch ins Reich Gottes nicht anders gelangen als durch den Namen seines geliebten Sohnes. 6. Hast du die Schar Leute gesehen, die den Turm erbauten?“ „Ja, Herr.“ „Das sind lauter herrliche Engel; von diesen ist der Herr wie mit einer Mauer umgeben. Das Tor aber ist der Sohn Gottes; dieser ist der einzige Zugang zum Herrn. Auf andere Weise kann keiner zu ihm kommen als durch seinen Sohn. 7. Hast du auch die sechs Männer gesehen und den herrlichen, großen Mann in ihrer Mitte, der den Turm umschritt und die Steine wegsprach aus dem Bau?“ „Ja, Herr,“ 8. „Der herrliche Mann ist der Sohn Gottes, und jene sechs Männer, das sind die herrlichen Engel, die ihn zur Rechten und Linken umgeben. Von diesen herrlichen Engeln kommt keiner zu Gott ohne ihn; wer seinen Namen nicht annimmt, wird nicht ins Reich Gottes gelangen.“</p><p>1. „Was bedeutet aber der Turm?“ „Der Turm, das ist die Kirche.“ 2. „Was bedeuten aber diese Jungfrauen?“ „Das sind heilige Geister; anders kann ein Mensch im Reiche Gottes nicht gefunden werden, außer diese haben ihm ihr Kleid angetan; denn wenn du nur den Namen annimmst, das Kleid von ihnen aber nicht empfängst, dann nützt es dir nichts; denn diese Jungfrauen sind die Kräfte des Gottessohnes. Denn wenn du nur seinen Namen trägst, seine Kraft aber nicht trägst, dann wirst du vergeblich seinen Namen tragen. 3. Die verworfenen Steine, die du sahest, haben zwar den Namen getragen, aber das Kleid der Jungfrauen hatten sie nicht angetan.“ „Welches Kleid tragen sie denn, Herr?“ „Eben die Namen (der Jungfrauen) sind ihr Kleid. Wer immer den Namen des Gottessohnes trägt, muss auch ihre Namen tragen; denn sogar der Sohn trägt die Namen dieser Jungfrauen. 4. Die Steine, die du in den Bau [des Turmes kommen, durch ihre Hände übergeben und in dem Turm verbleiben] sahest, sind mit der Kraft dieser Jungfrauen bekleidet. 5. Daher siehst du auch, dass der Turm <strong>ein</strong> Stein geworden ist mit dem Felsen. So werden auch diejenigen, die dem Herrn glauben durch seinen Sohn, und die diese Geister angezogen haben, zu einem Geiste, einem Leibe, und einheitlich wird die Farbe ihrer Gewänder sein. Wer so die Namen der Jungfrauen trägt, dessen Wohnung ist im Turme.“ 6. „Warum, Herr“, fragte ich, „wurden die verworfenen Steine verworfen? Sie kamen doch durch das Tor und wurden doch von den Händen der Jungfrauen in den Bau des Turmes eingefügt?“ „Da du dich um alles kümmerst und genau danach fragst, so höre über die verworfenen Steine! 7. Alle diese“, sprach er, „hatten den Namen des Sohnes Gottes angenommen und auch die Kraft dieser Jungfrauen. Im Besitze dieser Geister wurden sie mächtig und waren bei den Dienern Gottes, und sie hatten einen Geist und einen Leib und ein Gewand; dachten sie ja doch das gleiche und übten sie Gerechtigkeit. 8. Nach einiger Zeit aber ließen sie sich von den Frauen verführen, die du gesehen hast in ihren schwarzen Gewändern, entblößten Schultern, aufgelösten Haaren und in ihrer schönen Gestalt. Als sie diese gesehen hatten, fassten sie Verlangen nach ihnen und sie zogen die Kraft dieser (Frauen) an, [das Kleid und] die Kraft der Jungfrauen aber legten sie ab. 9. Diese wurden daher vom Hause Gottes vertrieben und jenen Frauen übergeben; wer sich aber nicht betören ließ durch die Schönheit dieser Frauen, der blieb im Hause Gottes. Somit hast du die Bedeutung der verworfenen Steine.“</p><p>1. „Wenn nun aber, Herr, die Männer, die in dieser Verfassung sind, sich bekehren, die Begierde nach diesen Frauen ablegen, zu den Jungfrauen zurückkehren und in ihrer Kraft und in ihren Werken wandeln, können dann diese nicht in das Haus Gottes kommen?“ 2. „Ja“, antwortete er, „wenn sie dem Werke dieser Frauen entsagen, die Kraft der Jungfrauen annehmen und in ihren Werken wandeln; deshalb trat auch die Verzögerung des Baues ein, damit diese, wenn sie sich bekehren, in die Wohnung des Turmes kommen. Wenn sie sich aber nicht bekehren, dann werden andere kommen, und diese werden für immer ausgeschlossen werden.“ 3. Für all dies habe ich dem Herrn Dank gesagt, dass er sich erbarmt hat über alle, über die sein Name angerufen worden ist und dass er den Engel der Buße zu uns geschickt hat, die wir gegen ihn gesündigt haben, und unseren Geist erneuerte und uns das Leben wieder gab, als wir schon verloren waren und keine Hoffnung fürs Leben mehr bestand. 4. „Jetzt aber, o Herr, sage mir, warum der Turm nicht auf dem Boden, sondern auf dem Felsen, und zwar über dem Tore gebaut werden musste.“ „Bist du immer noch unverständig und töricht?“ „Es ist notwendig, dass ich dich nach allem frage, da ich ganz und gar nichts begreifen kann; denn alles ist groß und herrlich und unbegreiflich für die Menschen.“ 5. „Höre! Der Name des Sohnes Gottes ist groß und unendlich und trägt die ganze Welt. Wenn nun die ganze Schöpfung durch den Sohn Gottes getragen wird, was hältst du dann von denen, die von ihm berufen sind, den Namen des Gottessohnes tragen und in seinen Geboten wandeln? 6. Siehst du nun, welche Leute er erträgt? Solche, die aus ganzem Herzen seinen Namen tragen. Er selbst ist die Grundlage für sie geworden und er trägt sie gerne, weil sie sich nicht schämen, seinen Namen zu tragen.“</p><p>1. „Verkünde mir, o Herr, der Jungfrauen [Namen und den der schwarzgekleideten Frauen.“ „So vernimm die Namen der Jungfrauen], die der stärkeren, die an den Ecken standen. 2. Die erste ist der Glaube, die zweite die Enthaltsamkeit, die dritte die Stärke, die vierte die Langmut; die anderen, die zwischen diesen standen, haben folgende Namen: Aufrichtigkeit, Unschuld, Keuschheit, Frohsinn, Wahrheit, Einsicht, Eintracht, Liebe. Wer diese Namen und den des Gottessohnes trägt, der wird ins Reich Gottes kommen können. 3. Nun vernimm auch die Namen der schwarzgekleideten Frauen. Auch unter ihnen sind vier stärkere: die erste ist der Unglaube, die zweite die Unmäßigkeit, die dritte der Ungehorsam, die vierte die Verführung. Ihre Begleiterinnen aber heißen: Trauer, Schlechtigkeit, Schwelgerei, Jähzorn, Lüge, Torheit, Üble Nachrede, Hass. Ein Diener Gottes, der diese Namen trägt, wird das Reich Gottes zwar schauen, aber hineinkommen wird er nicht.“ 4. „Was bedeuten sodann die Steine, Herr, die aus der Tiefe für den Bau passend kamen?“ „Die zehn ersten, die in das Fundament gelegt wurden, bedeuten das erste Geschlecht, die fünfundzwanzig anderen das zweite Geschlecht der gerechten Männer, die fünfunddreißig Propheten und Diener Gottes, die vierzig aber bedeuten Apostel und Lehrer der Botschaft des Gottessohnes.“ 5. „Weshalb haben nun die Jungfrauen auch diese Steine durch das Tor getragen und für den Bau übergeben?“ 6. „Diese waren nämlich zuerst Träger dieser Geister und sie ließen durchaus nicht voneinander ab, weder die Geister von den Menschen noch die Menschen von den Geistern, sondern die Geister blieben in ihnen, bis sie entschliefen. Und wenn sie nicht im Besitz dieser Geister gewesen wären, wären sie wohl auch nicht brauchbar gewesen für den Bau dieses Turmes.“</p><p>1. „Noch anderes musst du mir erklären, Herr.“ „Was möchtest du wissen?“ „Warum, Herr, kamen diese Steine aus der Tiefe und wurden in den Bau (des Turmes) gelegt, wenn sie doch Träger dieses Geistes waren?“ 2. „Sie mussten notwendig durch das Wasser emporsteigen, damit sie das Leben erlangten; denn sie konnten nicht anders in das Reich Gottes eingehen, als wenn sie die Sterblichkeit des [früheren] Lebens ablegten. 3. So haben also auch diese Entschlafenen die Besiegelung des Gottessohnes erhalten [und sind eingegangen in das Reich Gottes]. Denn bevor der Mensch den Namen des Gottessohnes trägt, ist er tot; sobald er aber die Besiegelung erhalten hat, legt er die Sterblichkeit ab und nimmt das Leben an. 4. Die Besiegelung aber ist das Wasser: ins Wasser tauchen sie unter als Tote und tauchen empor als Lebendige. Auch ihnen ging die Botschaft zu von dieser Besiegelung; sie machten davon Gebrauch, damit sie ins Reich Gottes gelangten.“ 5. „Warum kamen nun, Herr, diese vierzig Steine mit diesen aus der Tiefe empor, obwohl sie das Siegel schon hatten?“ Weil die Apostel und Lehrer, die Verkündiger des Namens des Gottessohnes, nachdem sie in der Kraft und im Glauben des Gottessohnes entschlafen waren, auch den vorher Entschlafenen predigten und ihnen das Siegel der Botschaft übergaben. 6. Sie tauchten nun mit ihnen ins Wasser und stiegen wieder empor; aber diese waren lebend, als sie untertauchten, und lebend, als sie wieder emporstiegen; aber die vorher Entschlafenen tauchten unter als Tote und kamen empor als Lebendige. 7. Durch sie also haben jene das Leben erlangt und den Namen des Gottessohnes erkannt; deshalb also stiegen sie zugleich mit jenen empor, wurden zugleich mit ihnen dem Bau des Turmes eingefügt und unbehauen dem Bau verbunden; waren sie ja doch in Gerechtigkeit und großer Reinheit entschlafen; nur diese Besiegelung hatten sie nicht erhalten. Nun hast du auch hierfür die Erklärung.“ „Ja, Herr.“</p><p>1. „Jetzt gib mir noch Auskunft, Herr, über die Berge; warum haben sie ein verschiedenes Aussehen, der eine dieses, der andere jenes?“ „Höre! Diese zwölf Berge bedeuten die [zwölf] Stämme, welche den ganzen Erdkreis bewohnen. An sie erging die Botschaft vom Sohne Gottes durch die Apostel.“ 2. „Warum ist das Aussehen der Berge verschieden, beim einen so, beim anderen anders? Erkläre mir dies, o Herr!“ „Höre!“ fuhr er fort; „diese zwölf Stämme, die den ganzen Erdkreis bewohnen, sind zwölf Völker, verschieden an Gesinnung und Geist. Wie du die Berge verschieden sahest, so gibt es auch bei diesen Völkern Verschiedenheiten des Geistes und der Gesinnung. Ich will dir klarlegen, wie es sich bei jedem einzelnen verhält.“ 3. „Zuerst, Herr, sage mir dies: warum bekamen bei dieser Verschiedenheit der Berge die von ihnen für den Bau verwendeten Steine eine und dieselbe glänzende Farbe wie auch die aus der Tiefe emporgestiegenen Steine?“ 4. „Weil alle unter dem Himmel wohnenden Völker, wenn sie hörten und glaubten, nach dem Namen [des Sohnes] Gottes genannt wurden. Mit der Besiegelung nun empfingen sie eine Gesinnung und einen Geist, eins wurde ihr Glaube und eins ihre Liebe, und sie trugen die Geister der Jungfrauen mit dem Namen. Deshalb wurde der Bau des Turmes in einer Farbe glänzend wie die Sonne. 5. Nachdem sie sich aber vereinigt hatten und ein Leib geworden waren, befleckten sich einige aus ihnen und wurden deshalb ausgestoßen aus dem Geschlechte der Gerechten, und sie wurden wieder, wie sie früher waren oder vielmehr schlechter.“</p><p>1. „Wieso, Herr“, fragte ich, „wurden sie schlechter, nachdem sie doch Gott erkannt hatten?“ „Wer Gott nicht kennt“, sprach er, „und sündigt, der wird bestraft für seine Sünde; wer aber Gott erkannt hat, darf nichts Böses mehr tun, sondern er muss recht handeln. 2. Wenn nun der, welcher recht handeln muss, Böses tut, scheint der nicht ein größeres Unrecht zu begehen als der, welcher Gott nicht kennt? Deshalb sind die, welche ohne Gott zu kennen Böses tun, zum Tode verurteilt, und die, welche Gott kennen und seine Großtaten gesehen haben und dennoch sündigen, werden doppelt bestraft und zum ewigen Tode verurteilt werden. Auf diese Weise wird die Kirche Gottes gereinigt werden. 3. Wie du es beim Turme sahest, dass die Steine herausgenommen, den bösen Geistern übergeben und von dort entfernt wurden, so werden die Gereinigten einen Leib bilden, und wie der Turm nach der Reinigung wie aus einem Steine geformt dastand, so wird es auch mit der Kirche Gottes sein, wenn sie gereinigt und gesäubert ist von den Bösen, den Heuchlern, den Verleumdern, den Zweiflern und von denen, die alles mögliche Unrecht tun. 4. Nach der Entfernung dieser wird die Kirche Gottes sein wie ein Leib, eine Gesinnung, ein Geist, ein Glaube, eine Liebe. Dann wird der Sohn Gottes frohlocken und sich freuen unter ihnen, wenn er sein Volk rein bekommen hat.“ „Herr, groß und erhaben“, sagte ich, „ist dies alles. 5. Erkläre mir noch, Herr, welche Bedeutung und Wirkung jeder einzelne Berg hat, damit jede auf den Herrn vertrauende Seele, wenn sie es hört, seinen großen, wunderbaren und herrlichen Namen preise.“ „So höre denn die Verschiedenheit der Berge und der zwölf Völker.“</p><p>1. „Die Gläubigen von dem ersten, schwarzen Berge sind diese: Abtrünnige sind es, Gotteslästerer, Verräter der Diener Gottes. Für sie gibt es keine Buße, für sie ist der Tod; deshalb sind sie auch schwarz; denn sie sind ein böses Geschlecht. 2. Mit den Gläubigen von dem zweiten, kahlen Berge steht es so: es sind Heuchler und Lehrer der Schlechtigkeit. Diese sind den ersten ähnlich: sie haben keine Frucht der Gerechtigkeit; wie nämlich ihr Berg ohne Frucht ist, so haben auch diese Menschen zwar den Namen, aber sie sind des Glaubens bar, und es ist keine Frucht der Wahrheit in ihnen. Für sie gibt es eine Buße, wenn sie sich schnell bekehren; wenn sie aber zögern, haben sie den Tod gemein mit den ersten.“ 3. „Weshalb, o Herr“, fragte ich, „gibt es für sie eine Buße und für die ersten nicht? Sie haben ja so ziemlich das gleiche getan.“ „Für diese gibt es deshalb eine Buße, weil sie ihren Herrn nicht gelästert und die Diener Gottes nicht verraten haben; sie gaben vielmehr ihre Lehren wegen der Begierde, etwas zu erhalten, [auf] und ein jeder richtete sich in seinen Lehren nach den Begierden der sündigen Menschen. Eine Strafe aber werden sie bekommen; doch gibt es für sie eine Buße, weil sie keine Gotteslästerer und keine Verräter waren.“</p><p>1. „Mit den Gläubigen von dem dritten, Dornen und Disteln tragenden Berge verhält es sich also: von ihnen ist ein Teil reich, der andere ist in mancherlei Geschäfte verwickelt. Unter den Disteln sind die Reichen, unter den Dornen die in weltliche Geschäfte Verwickelten zu verstehen. 2. Denn die [in viele verschiedene Geschäfte Verwickelten] schließen sich nicht an die Diener Gottes an, sondern sie kommen auf Irrwege und ersticken in ihren Geschäften. Die Reichen aber halten es nur ungern mit den Dienern Gottes, weil sie fürchten, man könnte sie um etwas angehen; diese werden nur schwer in das Reich Gottes gelangen. 3. Wie es schwer ist, barfuss über Disteln zu gehen, so ist es auch für diese etwas Schweres, in das Reich Gottes zu gelangen. 4. Für diese alle aber bedarf es der Buße, und zwar einer raschen, damit sie das, was sie in früheren Zeiten unterlassen haben, jetzt nachholen in (diesen Buß-) Tagen und etwas Gutes tun. [Wenn sie nun sich bekehren und etwas Gutes tun,] werden sie in Gott leben; wenn sie aber in ihrem Tun verharren, werden sie jenen Frauen übergeben werden, die sie zum Tode führen werden.“</p><p>1. „Mit den Gläubigen vom vierten Berge mit den vielen Gesträuchen, die zum Teil oben grün und unten an den Wurzeln dürr, zum Teil von der Sonne verdorrt waren, steht es folgendermaßen: das sind die Zweifler und die, die den Herrn auf den Lippen, aber nicht in ihrem Herzen haben. 2. Deshalb ist ihre Wurzel trocken und ohne Kraft, und sie haben nur Leben ihren Worten nach, ihre Werke aber sind tot. Solche Leute sind [weder lebendig noch] tot. Ähnlich steht es mit den Zweiflern, auch sie sind weder grün noch dürr, weder lebendig noch tot. 3. Wie nämlich ihre Pflanzen angesichts der Sonne vertrockneten, so wenden sich die Zweifler, sobald sie von der Trübsal hören, wegen ihrer Feigheit dem Götzendienst zu und machen dem Namen ihres Herrn Schande. 4. Solche sind [weder lebendig] noch tot. Aber auch diese [können] bei baldiger Umkehr [das Leben erlangen; wenn sie sich aber nicht bekehren,] dann sind sie schon den Frauen übergeben, die ihnen das Leben nehmen werden.“</p><p>1. „Von dem fünften Berge mit grünen Pflanzen und rauher Oberfläche kommen folgende Gläubige: sie haben zwar den Glauben, sie haben schwerverständliche Lehren, sind eingebildet und selbstgefällig, die alles verstehen wollen und gar nichts verstehen. 2. Wegen dieser ihrer Einbildung ist die Einsicht von ihnen gewichen, und törichter Unverstand hat seinen Einzug bei ihnen gehalten. Sie rühmen sich selbst ob ihrer Einsicht und drängen sich als freiwillige Lehrer auf, sie sind aber töricht. 3. Wegen dieses Hochmutes wurden viele von ihnen erniedrigt, die sich selbst erhöhten. Denn eine dämonische Macht [ist die Einbildung und das unbegründete Selbstvertrauen]; deshalb wurden viele von ihnen verworfen; einige aber bekehrten sich auch, glaubten und fügten sich denen, die Einsicht besitzen, [in der Erkenntnis] der eigenen Unwissenheit. 4. Auch für die übrigen dieser Klasse gibt es eine Buße; sie waren ja nicht schlecht, vielmehr [töricht und unverständig. Wenn also diese] Buße tun, werden sie in Gott leben; wenn sie aber keine Buße tun, werden sie zusammenwohnen müssen mit den Frauen, die Böses gegen sie verüben.“</p><p>1. „Mit den Gläubigen vom sechsten [Berge] aber, der große und kleine Spalten und in den Spalten magere Gesträuche aufweist, steht es also: 2. die mit den kleinen Spalten, das sind die, welche untereinander Streit haben und infolge ihrer Verleumdungen im Glauben eingetrocknet sind; aber viele von ihnen haben Buße getan. Der Rest wird Buße tun, wenn er meine Gebote hört. Denn ihre bösen Reden sind geringfügig, und rasch werden sie Buße tun. 3. Die mit großen Spalten aber sind solche, die in ihren Verleumdungen verharren und das Böse nachtragen, indem sie einander zürnen; diese wurden vom Turme weggeschleudert und aus dem Bau ausgeschlossen. Solche werden nur schwerlich das Leben erlangen. 4. Wenn Gott, unser Herr, der über alles gebietet und Macht hat über seine ganze Schöpfung, denen, die ihre Sünden eingestehen, nichts nachträgt, vielmehr Gnade übt, wie sollte ein sterblicher Mensch, der selbst voller Fehler ist, seinem Mitmenschen Böses nachtragen, wie wenn er Macht hätte, ihn zu verderben oder zu retten? 5. Ich aber, der Engel der Buße, sage euch: Wenn ihr in solchem Zwiste lebet, lasset ab von ihm und tuet Buße, und der Herr wird eure früheren [Fehler] heilen, wenn ihr euch reiniget von diesem bösen Geiste; wenn nicht, so werdet ihr ihm übergeben werden zum Tode.“</p><p>1. „Von dem siebten [Berge] aber, [auf dem die Pflanzen] grün [und] freudig aussahen, der ganz fruchtbar war und [auf dem] Tiere und Vögel jeder Art die Pflanzen abweideten und wo diese abgeweideten Pflanzen üppiger nachwuchsen, steht es mit den Gläubigen also: 2. sie waren allezeit aufrichtig, ohne Falsch [und glücklich], sie hatten nichts gegeneinander, sondern freuten sich stets über die Diener Gottes, waren angetan &lt;279&gt; [mit dem Heiligen Geiste dieser] Jungfrauen und hatten stets ein Herz für jedermann, und von (dem Ertrag) ihrer Arbeit steuerten sie jedem Menschen bei ohne Schmähung und ohne Zögerung. 3. Da [nun der] Herr ihren geraden und in allem kindlichen Sinn sah, gab er ihnen reichen Segen bei ihrer Hände Arbeit und schenkte ihnen seine Gnade bei jeder Unternehmung. 4. Dieses sage ich, der Engel der Buße, euch, die ihr so beschaffen seid: Bleibet so, und euer Same wird in Ewigkeit nicht ausgetilgt werden; denn der Herr hat euch geprüft und hat euch in unsere Zahl aufgenommen, und eure ganze Nachkommenschaft wird wohnen bei dem Sohne Gottes; denn von seinem Geiste habt ihr empfangen.“</p><p>1. „Mit den Gläubigen von dem achten Berge, der die vielen Quellen hatte, aus denen alle Geschöpfe des Herrn tranken, steht es also: 2. das sind die Apostel und Lehrer, die das Wort des Herrn über den ganzen Erdkreis hin verkündeten und es lehrten in Heiligkeit und Reinheit und dabei nichts wegen der bösen Begierde unterschlugen, sondern allezeit in Gerechtigkeit und Wahrheit wandelten gemäß dem Heiligen Geiste, den sie empfangen hatten. Der Wandel dieser ist daher an der Seite der Engel.“</p><p>1. „Die Gläubigen von dem neunten, dem öden Berge aber, der kriechende und wilde Tiere, die den Menschen verderben, beherbergt, sind also beschaffen: 2. die einen, die mit Schmutz bedeckten, das sind Diakonen, die ihren Dienst schlecht verwaltet, den Lebensunterhalt der Witwen und Waisen weggenommen und sich selbst Vorteil verschafft haben aus dem Amte, das ihnen zur Verwaltung anvertraut war; wenn sie in dieser Leidenschaft verharren, dann sind sie dem Tode verfallen, und es besteht für sie keine Aussicht, das Leben zu erlangen; wenn sie sich aber bekehren und ihr Amt vollends heilig halten, können sie das Leben erlangen. 3. Die mit den Flecken aber, das sind die, welche ihren Herrn verleugnet und sich ihm nicht wieder zugewandt haben, sondern verwilderten und vereinsamten, da sie sich den Dienern Gottes nicht anschlossen, vielmehr allein für sich ihre Seelen zugrunde richten. 4. Wie nämlich ein Weinstock, der verlassen an der Hecke wächst, ungepflegt verdirbt, durch das Gesträuche abgesondert und mit der Zeit verwildert und so für seinen Herrn wertlos wird, so haben auch solche Menschen sich selbst aufgegeben und sind für ihren Herrn wertlos, da sie verwilderten. 5. Für diese gibt es eine Buße, wenn es sich nicht zeigt, dass ihre Verleugnung von Herzen kam; wenn es aber herauskommt, dass einer (den Herrn) von Herzen verleugnet hat, dann weiß ich nicht, ob er das Leben erlangen kann. 6. Und zwar sage ich dies nicht für die heutige Zeit, damit einer den Herrn verleugne und dann Buße erlange; denn es ist unmöglich, dass einer gerettet werde, der jetzt seinen Herrn verleugnen will; vielmehr soll die Buße für solche bestimmt sein, die früher einmal den Herrn verleugnet haben. Wenn also jemand Buße tun will, soll er sich beeilen, bevor der Turm ganz ausgebaut ist; wenn nicht, so wird er von den Frauen zum Tode verderbt werden. 7. Die Verstümmelten aber, das sind die Arglistigen und die Verleumder; auch die Tiere, die du auf dem Berge gesehen hast, bedeuten solche Leute. Gleichwie nämlich die Tiere mit ihrem Gifte den Menschen verderben und töten, so richten auch die Reden solcher Menschen die Leute zugrunde und töten sie. 8. Diese sind also an ihrem Glauben verkürzt durch ihre Tat, die sie an sich haben; einige von ihnen taten Buße und wurden gerettet. Auch die übrigen Leute dieser Klasse können gerettet werden, wenn sie Buße tun; wenn nicht, werden sie durch jene Frauen, deren Kraft sie in sich haben, dem Tode überliefert werden.“</p><p>1. „Die Gläubigen vom zehnten Berge aber, dessen Bäume ihren Schatten über einige Schafe ausbreiteten, sind also beschaffen: 2. es sind Bischöfe und gastliche Leute, welche allezeit gerne ohne Heuchelei die Diener Gottes in ihr Haus aufnahmen; die Bischöfe haben immer Dürftigen und Witwen ohne Unterlass ihren Dienst angedeihen lassen, und haben allezeit einen reinen Wandel geführt. 3. Diese werden daher alle Gottes Schutz in allen Dingen erfahren. Wer solches tut, steht in Ansehen bei Gott, und ihr Ort ist einmal bei den Engeln, wenn sie bis ans Ende im Dienste Gottes verharren.“</p><p>1. „Mit den Gläubigen vom elften Berge, wo die mit Früchten beladenen Bäume, jeder mit anderen Früchten geschmückt, standen, verhält es sich so: 2. das sind die, welche für den Namen des Gottessohnes gelitten, und zwar aus ganzem Herzen gerne gelitten und ihr Leben hingegeben haben.“ 3. „Weshalb, o Herr, tragen zwar alle Bäume Früchte, während einige von ihnen wieder schönere Früchte haben?“ „Höre“, erwiderte er; „in Ansehen sind bei Gott alle, die einmal wegen des Namens gelitten haben; die Sünden von allen diesen wurden getilgt, weil sie wegen des Namens des Gottessohnes gelitten haben. Höre auch, warum ihre Früchte verschieden, teilweise sogar hervorragend sind. 4. Wer vor die Obrigkeit geführt und untersucht wurde, aber nicht leugnete, sondern bereitwillig litt, der steht in größerem Ansehen bei dem Herrn; seine Frucht ist hervorragend. Wer aber feig und zögernd in seinem Herzen überlegte, ob er leugnen oder bekennen sollte und so litt, dessen Früchte sind geringer, weil dieser Gedanke in seinem Herzen aufstieg; denn das ist ein schlechter Gedanke, dass ein Diener seinen Herrn verraten solle. 5. Sehet also ihr, die ihr solche Erwägungen heget, zu, dass nicht ein solcher Gedanke in euren Herzen wohne, und ihr für Gott sterbet. Ihr aber, die ihr um des Namens willen gelitten habt, seid Gott zu Dank verpflichtet, dass er euch gewürdigt hat, diesen Namen zu tragen und Heilung aller eurer Sünden zu erlangen. 6. So preiset euch also glücklich; glaubet aber ein großes Werk vollbracht zu haben, wenn einer aus euch Gottes wegen gelitten hat. Das Leben schenkt euch der Herr, und ihr sehet es nicht ein; eure Sünden waren nämlich schwer geworden, und wenn ihr nicht um des Herrn Namen willen gelitten hättet, wäret ihr wegen eurer Sünden tot gewesen für Gott. 7. Das sage ich euch, die ihr unschlüssig seid, ob ihr leugnen oder bekennen sollet; bekennet, dass ihr einen Herrn habet, damit ihr nicht, wenn ihr leugnet, in das (ewige) Gefängnis überliefert werdet. 8. Wenn die Heiden ihre Sklaven strafen, wenn einer seinen Herrn verleugnet hat, was meinet ihr, dass der Herr, der die Herrschaft über alles [hat], euch tun wird? Bannet also solche Gedanken aus euren Herzen, auf dass ihr für immer in Gott lebet.“</p><p>1. „Die Gläubigen aber vom zwölften, weißen Berge sind also beschaffen: sie sind gleich unschuldigen Kindern, in deren Herzen nichts Böses sich regt, und sie haben nicht [erkannt], was Bosheit ist, vielmehr bewahrten sie allezeit die kindliche Unschuld. 2. Diese werden also sofort Wohnung bekommen im Reiche Gottes, weil sie in keinem Stücke die Gebote Gottes verletzt haben, sondern in kindlicher Unschuld alle Tage ihres Lebens in der gleichen Gesinnung verharrten. 3. Wenn nun ihr alle“, fuhr er fort, „bleibet und sein werdet wie die Kinder, frei vom Bösen, dann werdet ihr angesehener sein als alle die schon Genannten. Denn alle Kinder sind angesehen vor Gott, und zwar als die ersten vor ihm. Glücklich seid also ihr alle, wenn ihr die Bosheit von euch werfet und euch bekleidet mit der Unschuld; als erste von allen werdet ihr in Gott leben.“ 4. Als er mit den Gleichnissen von den Bergen zu Ende war, bat ich ihn: „Herr, kläre mich nun noch auf über die Steine, die aus der Ebene herbeigeschafft und in den Turm vermauert wurden an Stelle der aus dem Turm entfernten, auch über die rundlichen Steine, die in den Turm kamen, und über die, die immer noch eine runde Form haben.“</p><p>1. „Vernimm mich auch noch über all diese Dinge! Die Steine, die aus der Ebene genommen und an Stelle der Verworfenen in den Bau des Turmes gelegt wurden, bilden den Fuß dieses weißen Berges. 2. Da ja die Gläubigen von diesem weißen Berge alle als unschuldige Leute sich zeigten, befahl der Herr des Turmes, dass diese vom Fuße dieses Berges für den Bau des Turmes verwendet würden; er wusste nämlich, dass diese Steine, wenn sie in den Turm verbaut würden, glänzend bleiben werden, dass keiner von ihnen schwarz werden wird. 3. Wenn aber der Herr Steine von den anderen Bergen dazu genommen hätte, hätte er den Turm noch einmal nachsehen und reinigen müssen. Diese aber erwiesen sich alle weiß, die, welche schon glauben, und die, welche erst zum Glauben gelangen, weil sie aus dem gleichen Geschlechte sind. Glücklich ist dieses Geschlecht, weil es unschuldig ist. 4. Höre jetzt über jene runden, weißen Steine. Sie kommen alle von diesem weißen Berge. Vernimm aber, weshalb sie runde Form zeigen. Ihre Reichtümer haben sie nämlich ein wenig ins Dunkel gerückt von der Wahrheit weg und ihre Farbe getrübt; von dem Herrn aber haben sie sich nie entfernt, und kein böses Wort kam aus ihrem Munde, sondern nur Gerechtigkeit, Tugend und Wahrheit. 5. Da der Herr ihre Gesinnung sah, dass sie nämlich für die Wahrheit eingenommen sein und dass sie auch gut bleiben können, ließ er ihre Reichtümer beschneiden, aber sie nicht ganz wegnehmen, damit sie von dem Reste Gutes tun können, und sie werden in Gott leben, weil sie aus einem guten Geschlechte stammen. Deshalb also wurden sie ein wenig behauen und dann in diesen Turm vermauert.“</p><p>1. „Die anderen aber, die bis jetzt ihre runde Form behalten haben und für diesen Bau ungeeignet sind, weil sie das Siegel noch nicht erhalten haben, sind an ihren Platz zurückgebracht worden; sie waren nämlich gar (zu) sehr gerundet. 2. Auch muss von ihnen diese weltliche Gesinnung weggehauen werden, ebenso die Einbildung auf ihren Besitz, dann werden auch sie für das Reich Gottes geeignet sein. Denn diese müssen in das Reich Gottes eingehen1), denn der Herr hat dieses unschuldige Geschlecht gesegnet. Von diesem Geschlechte wird daher keiner verloren gehen. Und wenn je eines aus ihnen, von dem bösen Satan versucht, einen Fehltritt gemacht hat, so wird es rasch zurückkehren zu seinem Herrn. 3. Ich preise euch alle selig, ich, der Engel der Buße, die ihr unschuldig seid wie die Kinder, da euer Anteil gut und ehrenvoll ist bei Gott. 4. Ich sage aber euch allen, die ihr dieses Siegel empfangen habt, dass ihr geraden Sinn bewahren, Beleidigungen vergessen, in böser Gesinnung nicht verharren, erlittenes Unrecht nicht bitteren Herzens nachtragen sollet, dass ihr alle eines Geistes werden, diese bösen Spaltungen überbrücken und ganz beseitigen sollet, auf dass der Herr der Herde über diese sich freue. 5. Er wird sich aber freuen, wenn er alles gesund antrifft. Wenn er aber finden müsste, dass einige von ihnen sich entfernt hätten, wehe dann den Hirten! 6. Wenn aber die Hirten selbst sich entfernt haben? Wie werden sie sich rechtfertigen [für] ihre Herde? Werden sie etwa sagen, sie seien von der Herde verfolgt worden? Das wird man ihnen nicht glauben. Denn es ist unglaublich, dass die Herde dem Hirten etwas zuleid tut; und er wird noch härter bestraft werden wegen seiner Lüge. Und ich bin der Hirte und muss gar strenge Rechenschaft geben über euch.“</p><p>1. „Bessert euch also, solange noch am Turme gebaut wird. 2. Der Herr wohnt bei den Friedfertigen, denn er liebt den Frieden; aber er hält sich weit fern von den Streitsüchtigen und durch Bosheit Verderbten. Bringet ihm also den Geist unversehrt zurück, wie ihr ihn empfangen habt. 3. Wenn du nämlich dem Walker ein neues, unverdorbenes Kleid gibst und es wieder unversehrt zurückhaben willst, wenn es aber der Walker dir zerrissen zurückbringt, wirst du es annehmen? Wirst du nicht sogleich böse werden und ihm Vorhalt machen und sagen: Ich habe dir ein unversehrtes Kleid gegeben; warum hast du es mir zerrissen und unbrauchbar zurückgebracht? Und wegen des Risses, den du ins Kleid gemacht hast, ist es nicht mehr zu gebrauchen. Wirst du nicht alles dies dem Walker zum Vorwurf machen, und zwar wegen des Risses, den er in dein Kleid gemacht hat? 4. Wenn nun du so betrübt bist über das Kleid und dich beklagst, dass du es nicht unversehrt zurückbekommst, was glaubst du, dass der Herr dir tun wird, der dir einen unversehrten Geist gegeben hat, und du hast ihn ganz unbrauchbar zurückgebracht, so dass sein Herr ihn nicht mehr brauchen kann? Denn er ist nutzlos geworden, da er von dir verderbt wurde. Wird also nicht der Herr dieses Geistes wegen dieser deiner Tat [dich mit dem Tode] bestrafen?“ 5. „Sicherlich“, erwiderte ich, „wird er alle mit dem Tode bestrafen, die er so antrifft, dass sie Beleidigungen nicht verzeihen.“ „Tretet daher seine Milde nicht mit Füßen, ehret ihn vielmehr, weil er soviel Geduld hat mit euren Fehlern und weil er nicht ist wie ihr. Tuet Buße, die euch frommt.“</p><p>1. „All das, was hier oben niedergeschrieben ist, habe ich, der Hirte, der Engel der Buße, den Dienern Gottes dargelegt und verkündigt. Wenn ihr also glaubet, auf meine Worte höret, in ihnen wandelt und eure Wege bessert, werdet ihr das Leben haben können. Wenn ihr aber verharret in böser Gesinnung und das Unrecht nicht vergesset, so wird keiner von dieser Verfassung leben in Gott. Ich habe euch all das, wie ich musste, gesagt.“ 2. Zu mir sprach der Hirte selbst noch: „Hast du mich nach allem gefragt?“ Ich sagte: „Ja, Herr.“ „Warum hast du mich nicht gefragt nach der Form der Steine, die in den Bau kamen, deren Formen wir ausgefüllt haben?“ „Das habe ich vergessen, Herr.“ 3. „Vernimm mich jetzt darüber. Das sind die, welche jetzt meine Gebote gehört und aus ganzem Herzen Buße getan haben. Als der Herr sah, dass ihre Buße gut und rein sei und dass sie in ihr verharren werden, befahl er, ihre früheren Sünden zu tilgen. Diese Formen waren nämlich ihre Sünden; sie wurden ausgefüllt, damit man sie nicht mehr sehen kann.“</p><h2>Zehntes Gleichnis</h2><p>1. Als ich dieses Buch vollendet hatte, kam jener Engel, der mich diesem Hirten übergeben hatte, in das Haus, in dem ich war, ließ sich nieder auf das Lager, und zur Rechten stellte sich der Hirte auf. Dann ließ er mich kommen und sagte zu mir: 2. „Ich habe dich und dein Haus diesem Hirten übergeben, damit du von ihm beschützt werdest.“ „Ja, Herr“, versetzte ich. „Wenn du also geschützt sein willst gegen alle Plage und alle Grausamkeit, und wenn du Erfolg haben willst bei jedem guten Werke und Worte, und wenn du jegliche Tugend der Gerechtigkeit erreichen willst, dann wandle in den Geboten dieses Mannes, die ich dir gegeben habe, und du wirst Herr sein können über alles Böse. 3. Wenn du nämlich die Gebote dieses Mannes befolgst, wird alle böse Lust und die Lockung dieser Welt unter dir sein, und in jedem guten Werke wird guter Erfolg deiner warten. Nimm in dich auf die Würde dieses Mannes und seine Bescheidenheit und verkünde es allen, dass er in großer Ehre und Achtung steht bei dem Herrn, dass er über starke Macht verfügt und dass er Gewalt hat in seinem Amte. Ihm allein ist auf dem ganzen Erdkreis die Bußgewalt übertragen. Scheint er dir mächtig zu sein? Ihr aber missachtet seine Würde und die Ehrfurcht, die er gegen euch zeigt.“</p><p>1. Da entgegnete ich: „Frage ihn selbst Herr, ob ich etwas Ordnungswidriges, wodurch ich ihn beleidigt hätte, getan habe, seitdem er in meinem Hause weilt.“ 2. „Auch ich“, erwiderte dieser, „weiß, dass du nichts wider die Ordnung getan hast noch tun wirst. Und ich habe dir dies deshalb gesagt, damit du ausharrest; dieser hat dir nämlich bei mir ein gutes Zeugnis ausgestellt Du sollst diese Worte den anderen mitteilen, damit sie, die Buße getan haben oder tun werden, ebenso denken wie du und dieser bei mir über sie Gutes berichten kann und ich bei dem Herrn.“ 3. „Und ich, o Herr, verkünde allen Menschen die Großtaten Gottes; ich hoffe aber, dass alle, die früher sündigten, wenn sie dies hören, bereitwillig Buße tun und das Leben erlangen.“ 4. „Harre aus in diesem Dienste und führe ihn durch bis ans Ende. Alle, die seine Gebote halten, werden das Leben und dieser wird große Ehre bei Gott haben. Wer aber seine Gebote nicht hält, der flieht sein Leben und weist diesen zurück; [dieser aber hat seine Ehre bei Gott. Wer immer also ihn verachtet] und seinen Geboten nicht folgt, der überliefert sich selbst dem Tode, und ein jeder von ihnen ist an seinem eigenen Blute schuldig. Dir aber sage ich: Halte diese Gebote, und du hast ein Heilmittel für die Sünden!“</p><p>1. „Ich habe dir diese Jungfrauen geschickt, dass sie bei dir wohnen; ich habe nämlich gesehen, dass sie dir zugetan sind. Sie sind als Helferinnen bei dir, damit du die Gebote dieses (Hirten) um so leichter halten kannst; denn es ist nicht möglich, ohne die Jungfrauen diese Gebote zu halten. Ich sehe aber, dass sie gerne bei dir sind; gleichwohl befehle ich ihnen, dein Haus nie zu verlassen. 2. Du aber reinige dein Haus; denn in einem reinen Hause werden sie gerne wohnen; sie sind nämlich alle rein, keusch, fleißig und in Gnaden bei Gott. Wenn sie also bei dir ein reines Haus haben, werden sie bei dir bleiben; wenn aber in irgendeinem Stücke auch nur im geringsten was Unreines geschieht, werden sie sogleich dein Haus verlassen; denn diese Jungfrauen lieben durchaus keine Befleckung.“ 3. Ich entgegnete: „Ich hoffe, Herr, es werde ihnen gefallen, so dass sie immer gerne in meinem Hause weilen, Und wie dieser, dem du mich übergeben hast, nichts über mich zu klagen hat, so werden auch jene nicht klagen.“ 4. Da wandte er sich zu diesem Hirten mit den Worten: „Ich sehe, dass der Diener Gottes das Leben erlangen, diese Gebote halten und in keuscher Gemeinschaft mit diesen Jungfrauen zusammenwohnen will.“ 5. Nach diesen Worten übergab er mich noch einmal diesem Hirten, rief jene Jungfrauen heran und sagte ihnen: „Da ich sehe, dass ihr gerne in dem Hause dieses Mannes wohnet, empfehle ich euch ihn und sein Haus, auf dass ihr gar nie von seinem Hause weichet.“ Sie aber nahmen diese Worte freudig auf.</p><p>1. Darauf sagte er zu mir: „Halte männlich aus in diesem Dienste, verkünde allen Menschen die Großtaten des Herrn, und du wirst Gnade haben in diesem Dienste. Wer immer in diesen Geboten wandelt, wird das Leben haben und wird glücklich sein in seinem Leben; wer immer aber sie missachtet, wird das Leben nicht haben und in seinem Leben nicht glücklich sein. 2. Sage es allen, damit sie nicht nachlassen, wer immer recht handeln kann; es ist ihnen von Nutzen, wenn sie gute Werke tun. Ferner sagte ich, dass man alle Leute aus ihrer misslichen Lage befreien muss. Denn wer dürftig ist und in seinem täglichen Leben übles erduldet, der ist in großer Bedrängnis und Not. 3. Wer also die Seele eines solchen Menschen der Not entreißet, der erwirbt sich eine große Freude. Wer nämlich von solchem Missgeschick geplagt wird, der ist in gleicher Weise gequält wie der, welcher deshalb im Gefängnis sitzt. Viele haben wegen derartigen Unglücks, das sie nicht ertragen konnten, sich das Leben genommen. Wer daher die Not eines solchen Menschen kennt und ihn daraus nicht befreit, der begeht eine große Sünde und macht sich seines Blutes schuldig. 4. Wer immer von euch (Güter) vom Herrn empfangen hat, der verrichte gute Werke, damit nicht, wenn ihr lange zögert, der Bau des Turmes vollendet wird. Denn euretwegen wurde der Bau unterbrochen. Wenn ihr euch also nicht beeilet mit euren guten Werken, wird der Turm vollendet, und ihr werdet ausgeschlossen werden.“ 5. Nachdem er dies zu mir gesprochen hatte, stand er vom Lager auf, nahm den Hirten und die Jungfrauen bei der Hand und ging fort, sagte mir aber, dass er den Hirten und die Jungfrauen in mein Haus zurückschicken werde.</p>
