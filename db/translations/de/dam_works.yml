      <p><em>Genaue Darlegung des orthodoxen Glaubens — Buch 1 (Bibliothek der Kirchenväter).</em></p><h2>Buch 1</h2><h3>I. KAPITEL. Das göttliche Wesen ist unbegreiflich. Man darf sich nicht um das bemühen und bekümmern, was uns von den heiligen Propheten, Aposteln und Evangelisten nicht überliefert ist.</h3><p>„Gott hat niemand jemals gesehen. Der eingeborene Sohn, der im Schoße des Vaters ist, er hat [ihn] kundgemacht“. Unaussprechlich also ist das göttliche Wesen und unbegreiflich. Denn „niemand kennt den Vater außer der Sohn und niemand den Sohn außer der Vater“. Aber auch der Hl. Geist weiß, was Gottes ist, so, wie der Geist des Menschen weiß, was in ihm ist. Nach der ersten, seligen (═ göttlichen) Natur aber hat niemand Gott je erkannt, außer der, dem er sich persönlich geoffenbart, nicht bloß kein Mensch, sondern auch keine überweltliche Macht, ja, ich behaupte, selbst kein Cherubim und Seraphim.</p><p>Gleichwohl hat uns Gott nicht in völliger Unkenntnis gelassen. Denn die Erkenntnis des Daseins Gottes ist von ihm allen von Natur aus eingepflanzt. Aber auch die Schöpfung selbst, deren Erhaltung und Regierung verkündet die Majestät der göttlichen Natur. Ferner hat er sich, zuerst durch Gesetz und Propheten, dann aber auch durch seinen eingeborenen Sohn, unseren Herrn, Gott und Heiland Jesus Christus entsprechend unserem Fassungsvermögen erkennbar gemacht. Daher nehmen wir alles an, was uns durch Gesetz und Propheten, Apostel und Evangelisten überliefert ist, studieren und verehren es und suchen nichts darüber hinaus. Gott ist gut, darum ist er der Geber alles Guten; er unterliegt nicht Neid oder einer Leidenschaft. Ja, fern von der göttlichen Natur, die leidenschaftslos und nur gut ist, ist Neid. Da er alles weiß und eines jeden Interesse im Auge hat, so hat er gerade das geoffenbart, dessen Kenntnis in unserem Interesse lag. Was wir jedoch nicht ertragen konnten, hat er verschwiegen. Damit wollen wir uns zufrieden geben; dabei wollen wir bleiben; wir wollen nicht die ewigen Grenzen verrücken und über die göttliche Überlieferung hinausgehen.</p><h3>II. KAPITEL. Aussprechbares und Unaussprechbares, Erkennbares und Unerkennbares.</h3><p>Wer von Gott reden oder hören will, muß sich klar sein,* daß in der Gotteslehre wie in der Heilsveranstaltung weder alles unaussprechbar noch alles aussprechbar, weder alles unerkennbar noch alles erkennbar ist.* Etwas anderes ist das Erkennbare und etwas anderes das Aussprechbare,* wie etwas anderes das Reden und etwas anderes das Erkennen ist.* Darum kann man vieles von dem, was sich von Gott schwer erkennen läßt, nicht in den rechten sprachlichen Ausdruck bringen. Vielmehr sehen wir uns genötigt, das, was über uns hinausliegt, nach unserer (menschlichen) Art auszudrücken. So z. B. reden wir bei Gott von Schlaf, Zorn, Sorglosigkeit, Händen und Füßen und dergleichen.</p><p>Daß Gott ohne Anfang und Ende ist, ewig und immerwährend, ungeschaffen, unwandelbar, unveränderlich, einfach, nicht zusammengesetzt, unkörperlich, unsichtbar, ungreifbar, unbegrenzt, unendlich, unbegreiflich, uneingeschränkt, unfaßbar, gut, gerecht, Bildner aller Geschöpfe, allmächtig, allherrschend, allsehend, allsorgend, Machthaber und Richter — das erkennen und bekennen wir. Und daß nur* ein* Gott ist, d. h.* eine* Wesenheit; daß er in drei Personen erkannt wird und ist, nämlich im Vater, Sohn und Hl. Geist; daß der Vater, Sohn und der Hl. Geist in allem eins sind, ausgenommen das Ungezeugtsein, das Gezeugtsein und das Hervorgehen; daß der eingeborene Sohn und Logos Gottes und Gott „aus herzinnigem Erbarmen“ unseres Heiles wegen durch den Willen des Vaters und die Mitwirkung des allheiligen Geistes ohne Samen empfangen, unbefleckt aus der heiligen Jungfrau und Gottesgebärerin Maria durch den Hl. Geist geboren worden und als vollkommener Mensch aus ihr hervorgegangen ist; daß derselbe vollkommener Gott und vollkommener Mensch zugleich ist, [bestehend] aus zwei Naturen, Gottheit und Menschheit, und in zwei Naturen, die vernünftig, wollend, wirkend, selbstmächtig, mit einem Wort vollkommen sind, eine jede in der ihr zukommenden Bestimmtheit und Beschaffenheit, in der Gottheit und Menschheit nämlich, aber in* einer* zusammengesetzten Person (Hypostase); daß er hungerte und dürstete und müde ward, gekreuzigt wurde, drei Tage lang Tod und Grab kostete, in den Himmel aufstieg, von wo er auch zu uns gekommen und am Ende wiederkommen wird — dafür sind Zeuge die Hl. Schrift und der ganze Chor der Heiligen (= der Väter).</p><p>Was aber das Wesen Gottes ist, oder wie er in allem ist, oder wie der eingeborene Sohn und Gott sich selbst entäußerte und aus jungfräulichem Blute Mensch wurde, durch ein anderes als das Naturgesetz gebildet, oder wie er trockenen Fußes auf dem Wasser gewandelt, das erkennen wir nicht und können es nicht sagen. Es ist also, abgesehen von dem, was uns von Gott durch die göttlichen Aussprüche des Alten und Neuen Testamentes verkündet oder mitgeteilt und geoffenbart worden ist, nicht möglich, etwas von Gott zu sagen oder überhaupt zu denken.</p><h3>III. KAPITEL. Beweis für das Dasein Gottes.</h3><p>Die Existenz Gottes ist denen, die die heiligen Schriften, nämlich das Alte und Neue Testament, annehmen, nicht zweifelhaft, aber auch der Mehrzahl der Heiden nicht. Denn die Erkenntnis des Daseins Gottes ist, wie gesagt, uns von Natur aus eingepflanzt. Allein die Schlechtigkeit des Bösen (═ des Teufels) übte auf die Menschennatur eine so große Gewalt aus, daß sie sogar manche in den unvernünftigsten und allerübelsten Abgrund des Verderbens stürzte: sie leugneten nämlich das Dasein Gottes. Ihren Unverstand zeigt der heilige Seher David auf, wenn er sagt: „Der Tor spricht in seinem Herzen: Es ist kein Gott“. Darum haben die Jünger und Apostel des Herrn, die vom allheiligen Geiste Belehrung bekommen und durch seine Kraft und Gnade die göttlichen Zeichen wirkten, mit dem Netze der Wunder sie lebendig gefangen und aus der Tiefe der Unwissenheit zum Lichte der Gotteserkenntnis emporgeführt. Desgleichen haben auch ihre Nachfolger in der Gnade und Würde, die Hirten und Lehrer, welche die erleuchtende Gnade des Geistes empfangen, durch die Macht der Wunder und „die Lehre der Gnade“ die erleuchtet, die in der Finsternis waren, und auf den rechten Weg gebracht, die in die Irre gegangen. Wir aber, die weder die Gabe der Wunder noch die der Unterweisung empfangen haben — wir haben uns nämlich durch die Vorliebe zu den Lüsten unwürdig gemacht —, wohlan, wir wollen einiges von dem, was uns hierüber von den Erklärern der Gnade überliefert worden ist, besprechen, zuvor aber den Vater und den Sohn und den Hl. Geist anrufen.</p><p>Alles, was existiert, ist entweder geschaffen oder ungeschaffen. Wenn nun geschaffen, so ist es sicherlich auch veränderlich. Denn wessen Sein mit Veränderung begonnen, das wird bestimmt der Veränderung unterliegen, sei es, daß es vernichtet wird oder freiwillig sich ändert. Wenn aber ungeschaffen, so ist es folgerichtig sicher auch unveränderlich. Denn wessen Sein gegensätzlich ist, bei dem ist auch die Art des Wieseins, d. h. die Eigenschaften, gegensätzlich. Wer also wird nicht dem beistimmen, daß alles Seiende, das in unsere Sinne fällt, ja sogar die Engel sich ändern und wandeln und vielfältigem Wechsel unterstehen, und zwar die geistigen Wesen, die Engel, Seelen und Dämonen, durch freie Willensentscheidung, durch den Fortschritt im Guten und die Abkehr vom Guten, worin es ein Mehr und ein Minder gibt, die übrigen Wesen aber durch Entstehen und Vergehen, durch Zunehmen und Abnehmen, durch den Eigenschaftswechsel und die Ortsbewegung? Da sie also veränderlich sind, so sind sie sicherlich auch geschaffen. Wenn aber geschaffen, dann wurden sie gewiß von jemand geschaffen. Der Schöpfer aber muß ungeschaffen sein. Denn ward auch jener geschaffen, so ist er sicher von jemand [anderem] geschaffen [und so fort], bis wir zu etwas Ungeschaffenem kommen. Da also der Schöpfer ungeschaffen ist, so ist er sicherlich auch unveränderlich. Was anders aber sollte dieses [Ungeschaffene] sein als Gott?</p><p>Aber auch der Zusammenhalt, die Erhaltung und Regierung der Welt lehrt uns, daß ein Gott ist, der dies All zusammengesetzt hat, es zusammenhält und erhält und immer dafür sorgt. Denn wie hätten die entgegengesetzten Naturen von Feuer und Wasser, von Luft und Erde zur Vollendung* einer* Welt zusammenkommen können, und wie könnten sie unaufgelöst bleiben, wenn nicht eine allmächtige Gewalt diese zusammengezwungen hätte und sie immerdar unaufgelöst erhielte?</p><p><em>Was ist das, das die Dinge am Himmel und auf Erden, und alles, was in der Luft, und alles, was im Wasser ist, ja vielmehr das, was vor diesen ist, Himmel und Erde und Luft und die Natur von Wasser und Feuer geordnet hat? Was hat diese Dinge vermischt und verteilt?</em> Was ist das, das sie in Bewegung gesetzt hat und den unaufhörlichen, ungehinderten Lauf leitet?* Nicht etwa ihr Künstler, der, der in alle Gesetzmäßigkeit gelegt, wonach das All gelenkt und regiert wird? Wer ist ihr Künstler? Nicht der, der sie gemacht und ins Dasein gerufen? Wir werden doch nicht dem Zufall eine solche Macht einräumen. Denn gesetzt, ihr Entstehen sei Sache des Zufalls: Wessen ist die Ordnung? Auch darauf wollen wir, wenn es beliebt, hinweisen: Wessen Sache ist es, sie nach den Gesetzen, nach denen sie zuerst entstanden, zu erhalten und zu bewahren? Eines anderen offenbar als des Zufalls. Was anders aber ist dieses [Wesen] als Gott?</p><h3>IV. KAPITEL. Das Wesen Gottes. Seine Unbegreifbarkeit.</h3><p>Daß es also einen Gott gibt, ist klar. Was er aber seiner Wesenheit und Natur nach ist, das ist völlig unbegreiflich und unerkennbar. Daß er unkörperlich ist, ist klar. Denn* wie* sollte das ein Körper sein,* das unendlich und unbegrenzt, gestaltlos, ungreifbar und unsichtbar,* einfach und nicht zusammengesetzt ist? Wie wäre etwas unveränderlich, wenn es begrenzt und leidensfähig wäre? Und wie das leidenslos,* das aus Grundstoffen zusammengesetzt ist und sich wieder in sie auflöst? Denn Zusammensetzung ist der Grund des Kampfes, Kampf [der Grund] der Trennung, Trennung [der Grund] der Auflösung. Auflösung aber ist für Gott ein völlig fremder Begriff.*</p><p><em>Wie ließe sich aber auch die Tatsache halten, daß Gott alles durchdringt und alles erfüllt,</em> wie die Schrift sagt:* „Erfülle ich nicht den Himmel und die Erde, spricht der Herr?“ * Denn es ist unmöglich, daß ein Körper Körper durchdringt, ohne zu spalten und gespaltet,* verflochten und gegenübergestellt* zu werden,* wie alles Flüssige sich vermischt * und verbindet.</p><p>Mögen auch manche einen immateriellen (stofflosen) Körper annehmen, etwa den fünften Körper, wie er bei den griechischen Weisen heißt, was allerdings unmöglich ist; in Bewegung wird er jedenfalls sein so wie der Himmel. Denn diesen (═ den immateriellen Körper) nennen sie fünften Körper. Wer ist es nun, der diesen bewegt? Denn alles, was in Bewegung ist, wird von anderem bewegt. Und wer [bewegt] letzteres? Und so fort ins Unendliche, bis wir auf etwas Unbewegtes stoßen. Denn das Erstbewegende ist unbewegt, und das ist das göttliche Wesen. Wie wäre ferner das Bewegte nicht örtlich begrenzt? Darum ist nur das göttliche Wesen unbewegt, in Unbewegtheit alles bewegend. Mithin ist das göttliche Wesen unkörperlich zu fassen.</p><p>Aber auch* dieses* (= das Unkörperliche) ist* nicht imstande, sein (= Gottes) Wesen zu erklären, wie auch nicht das Ungezeugtsein, das Anfangslose, das Unveränderliche, das Unvergängliche und was sonst von Gott oder in Beziehung auf Gott ausgesagt wird.* Denn dieses bezeichnet nicht das, was er ist, sondern das, was er nicht ist. Wer das Wesen von einem Ding angeben will, der muß sagen, was es ist, nicht das, was es nicht ist. Gleichwohl läßt sich bei Gott unmöglich sagen, was er dem Wesen nach ist. Viel geeigneter ist es, von allem [Seienden] abzusehen und so die Erörterung [über ihn] anzustellen. Denn er ist nichts vom Seienden. Nicht als ob er nicht wäre, sondern weil er über allem Seienden und über dem Sein selbst ist. Denn mag es auch vom Seienden Erkenntnisse geben, das, was über der Erkenntnis ist, wird sicherlich auch über dem Sein sein. Und umgekehrt wird das, was über dem Sein ist, auch über der Erkenntnis sein.</p><p>Unendlich und unbegreifbar also ist das göttliche Wesen. Nur das ist von ihm begreifbar, seine Unendlichkeit und Unbegreifbarkeit. All unsere bejahenden Aussagen von Gott bezeichnen nicht die Natur, sondern die Beziehungen der Natur. Wenn du [ihn] gut, wenn gerecht, wenn weise und was sonst noch nennst, so meinst du nicht die Natur Gottes, sondern die Beziehungen seiner Natur. Es gibt aber auch bejahende Aussagen von Gott, die die Bedeutung einer überschwenglichen Verneinung haben. Wenn wir z. B. von Gott Finsternis aussagen, so denken wir nicht an Finsternis, sondern [denken], daß er nicht Licht, ja sogar, daß er mehr als Licht ist. Und [sagen wir von Gott] Licht aus, [so denken wir,] daß er nicht Finsternis ist.</p><h3>V. KAPITEL. Beweis, daß es nur* einen* Gott gibt und nicht viele.</h3><p>Daß Gott existiert, sowie daß sein Wesen unbegreifbar ist, ist zur Genüge bewiesen worden. Daß es aber nur* einen* Gott gibt und nicht viele, das ist denen, die der göttlichen Schrift glauben, nicht zweifelhaft. Es sagt ja der Herr zu Anfang der Gesetzgebung: „Ich bin der Herr, dein Gott, der dich aus Ägypten geführt. Du sollst keine anderen Götter außer mir haben.“ Und wiederum: „Höre, Israel, der Herr, dein Gott, ist der einzige Herr.“ Und durch den Propheten Isaias spricht er: „Ich bin Gott von Anbeginn und ich bin es hinfort, und außer mir ist kein Gott. Vor mir war kein anderer Gott, und nach mir wird keiner sein, und außer mir ist keiner.“ Und der Herr spricht in den heiligen Evangelien zum Vater also: „Das ist das ewige Leben, daß sie dich erkennen, den* allein* wahren Gott.“ Mit denen aber, die der göttlichen Schrift nicht glauben, wollen wir uns folgendermaßen auseinandersetzen:</p><p>Das göttliche Wesen ist vollkommen, ihm mangelt nichts an Güte, an Weisheit und an Macht, es ist ohne Anfang, ohne Ende, ewig, unbegrenzt — kurz, absolut vollkommen. Gesetzt nun, wir wollen viele Götter annehmen, so wird sich notwendig ein Unterschied unter den vielen bemerkbar machen. Denn wenn gar kein Unterschied unter ihnen besteht, so ist vielmehr einer und nicht viele. Ist aber ein Unterschied unter ihnen, wo ist dann die Vollkommenheit? Denn stünde einer in Hinsicht auf Güte oder auf Macht oder auf Weisheit oder auf Zeit oder auf Ort hinter dem Vollkommenen zurück, so wäre er nicht Gott. Die vollständige Identität aber beweist erst recht* einen* und nicht viele.</p><p>Wie wäre es aber auch möglich, daß beim Dasein vieler die Unbegrenztheit gewahrt bliebe? Denn wo der eine wäre, könnte der andere nicht sein.</p><p>Wie ließe sich ferner von vielen die Welt regieren? Müßte sie sich nicht auflösen und zugrundegehen, da doch ein Kampf unter den Regierenden offensichtlich wäre? Denn der Unterschied bringt Gegensätzlichkeit mit sich. Wollte man aber behaupten, jeder beherrsche seinen Teil, [dann frage ich,] was ist denn das, das die Ordnung geschaffen und die Verteilung unter ihnen vorgenommen? Das ist doch wohl erst recht Gott.* Einer* also ist Gott, vollkommen, unbegrenzt, Schöpfer des Alls, Erhalter und Regierer, übervollkommen und übervollendet.</p><p>Zudem ist es aber auch eine Naturnotwendigkeit, daß die Einheit Grund der Zweiheit ist.</p><h3>VI. KAPITEL. Vom Logos und Sohne Gottes — Vernunftbeweis.</h3><p>Dieser einzige und alleinige Gott ist nicht* ohne Logos* (Wort).* Hat er aber ein Wort,* so wird er kein solches haben, das keine eigene Subsistenz besitzt oder zu sein angefangen hat oder aufhören wird. Denn es gab nie eine Zeit, da Gott das Wort nicht war. Vielmehr hat er immer sein aus ihm gezeugtes Wort. Dieses hat nicht wie unser Wort* keine eigene Subsistenz* und ergießt sich nicht in die Luft, nein, es ist subsistierend, lebendig und vollkommen, weicht nicht von ihm, sondern ist stets in ihm. Denn wo sollte es sein, wenn es sich von ihm trennte? Weil* unsere Natur hinfällig* und leicht auflösbar ist, deshalb hat auch unser Wort keine eigene Subsistenz. Weil aber Gott* immer besteht* und vollkommen ist, deshalb wird auch sein Wort vollkommen, subsistierend, immer bestehend, lebendig sein und alles besitzen, was der Erzeuger hat. Unser* Wort, das vom Geiste* ausgeht,* ist weder ganz dasselbe wie der Geist noch völlig verschieden* [von ihm]. Da es aus dem Geiste ist, ist es etwas anderes als er.* Da es aber den Geist selbst zur Erscheinung bringt, ist es doch nicht mehr völlig verschieden vom Geiste. Es ist vielmehr der Natur nach eins mit ihm, dem Subjekt nach ist es verschieden. So ist es auch mit dem Worte Gottes. Dadurch, daß es für sich besteht, ist es verschieden von jenem, von dem es das Sein hat. Insofern es aber in sich all das aufweist, was man an Gott erblickt, ist es der Natur nach ein und dasselbe mit ihm.* Wie man nämlich* die allseitige Vollkommenheit * am Vater sieht, so sieht man sie auch an dem aus ihm gezeugten Wort.</p><h3>VII. KAPITEL. Vom Hl. Geiste — Vernunftbeweis.</h3><p>Es muß aber das Wort auch ein Pneuma (einen Hauch) haben. Denn nicht einmal unser Wort ist ohne Hauch.* Allein bei uns ist der Hauch* etwas unserer Wesenheit Fremdes.* Er ist ein Einnehmen* und Abgeben* der Luft, die man zur Erhaltung des Körpers einzieht und ausstößt. Zur Zeit des Sprechens wird er zur Stimme des Wortes, die die Bedeutung des Wortes in sich offenbart. Bei der göttlichen Natur nun,* die einfach und nicht zusammengesetzt ist,* muß man zwar die Existenz eines Pneuma Gottes fromm* zugeben,* denn das Wort* [Gottes]* steht nicht hinter dem unsrigen Wort zurück.* Aber nicht fromm ist es, das Pneuma für etwas* Fremdes,* von außen zu Gott Hinzukommendes zu halten wie bei uns, die wir zusammengesetzt sind.* Nein. Denn wenn wir vom Worte Gottes hören, sind wir nicht der Meinung, es habe keine eigene Subsistenz oder es entstehe durch Lernen oder es werde durch eine Stimme erzeugt* oder es ergieße sich in die Luft und* vergehe, vielmehr* [meinen wir],* es subsistiere wesenhaft* (in eigener Hypostase),* habe freien Willen, sei wirksam und allmächtig. In gleicher Weise denken wir auch, wenn wir vom Pneuma Gottes hören, das das Wort begleitet und seine Wirksamkeit offenbart, nicht an einen Hauch,* der keine eigene Subsistenz hat.* Es würde* ja* so die Hoheit der göttlichen Natur zur Niedrigkeit herabgedrückt, dächte man sich das Pneuma in ihm ähnlich unserem* Hauch.* Nein,* [wir denken]* an eine wesenhafte Kraft, die man für sich in eigener Hypostase betrachtet.* Sie geht vom Vater aus und ruht im Worte und offenbart es.* Sie kann sich von Gott, in dem sie ist, und vom Worte, das sie begleitet, nicht trennen noch ihr Sein verlieren, sondern sie besteht ebenso wie das Wort selbständig für sich,* ist lebendig,* hat freien Willen, bewegt sich selbst, ist wirksam, will stets das Gute, besitzt unumschränkte Willensmacht,* hat keinen Anfang und kein Ende. Denn nie fehlte dem Vater das Wort noch dem Worte das Pneuma.</p><p>So wird durch die Einheit der Natur der polytheistische Irrtum der Heiden zunichte gemacht, durch die Annahme des Logos und Pneuma aber die Lehre der Juden abgetan, und von den beiden Ansichten bleibt das Brauchbare: von der jüdischen Anschauung die Einheit der Natur, vom Heidentum aber nur die Unterscheidung der Personen.</p><p>Sollte aber der Jude gegen die Lehre vom Worte und Geiste Widerspruch erheben, so soll er sich von der Hl. Schrift widerlegen und den Mund zum Schweigen bringen lassen. Denn vom Worte sagt der göttliche David: „In Ewigkeit, Herr, währt dein Wort im Himmel.“ Und wiederum: „Er sandte sein Wort und heilte sie.“ Das Wort aber, das man mit dem Munde ausspricht, wird nicht gesandt und bleibt auch nicht in Ewigkeit. Vom Hl. Geiste aber [sagt] derselbe David: „Du sendest aus deinen Geist [Hauch], und sie werden geschaffen.“ Und wiederum: „Durch das Wort des Herrn sind die Himmel befestigt (geschaffen) und durch den Geist (Hauch) seines Mundes ihr ganzes Heer.“ Und Job: „Ein göttlicher Geist ist es, der mich geschaffen, und ein allmächtiger Hauch, der mich erhalten.“ Geist (Hauch) aber, der gesandt wird, schafft, befestigt und erhält, ist kein Odem, der sich auflöst, wie auch der Mund Gottes kein körperliches Glied ist. Beides nämlich muß man auf eine gotteswürdige Art verstehen.</p><h3>VIII. KAPITEL. Von der heiligen Dreieinigkeit.</h3><p>Wir glauben also an* einen* Gott,* einen* Urgrund, der anfangslos, ungeschaffen, ungezeugt, unvergänglich und unsterblich, ewig, unendlich, unumschränkt, unbegrenzt, unendlich mächtig, einfach, nicht zusammengesetzt, unkörperlich, leidenschaftslos, unwandelbar, unveränderlich, unsichtbar, Quelle der Güte und Gerechtigkeit, geistiges Licht, unzugänglich ist. [Wir glauben] an eine Macht, die durch kein Maß erkannt, die nur durch den eigenen Willen gemessen wird. Denn sie kann alles, was sie will. Sie erschafft alle sichtbaren und unsichtbaren Dinge, erhält und bewahrt alles, sorgt für alles, behauptet und beherrscht und regiert alles in unendlicher, unvergänglicher Herrschaft, hat keinen Gegensatz, sie erfüllt alles, ist von nichts umschlossen, umschließt vielmehr selbst alles, hält es zusammen und überragt es, durchdringt alle Wesenheiten, ohne befleckt zu werden, steht über allem, ist über jede Wesenheit erhaben, darum überwesentlich, allüberragend, übergöttlich, übergut, übervollkommen. Sie setzt alle Anfänge und Ordnungen fest, ist über jeden Anfang und jede Ordnung erhaben, steht über Wesenheit und Leben und Wort und Gedanken. Sie ist Selbst-Licht, Selbst-Güte, Selbst-Leben, Selbst-Wesen. Denn sie hat weder das Sein noch sonst etwas von einem andern, sie ist vielmehr selbst Quelle des Seins für’s Seiende, des Lebens für’s Lebende, der Vernunft für’s Vernünftige, und für alle Ursache aller Güter. Sie weiß alles, ehe es geschieht. [Wir glauben] an* eine* Wesenheit,* eine* Gottheit,* eine* Kraft,* einen* Willen,* eine* Wirksamkeit,* ein* Prinzip,* eine* Macht,* eine* Herrschaft,* eine* Regierung. Sie wird in drei vollkommenen Hypostasen (Personen) erkannt, genießt aber nur* eine* Anbetung, sie wird geglaubt und verehrt von jedem vernünftigen Geschöpfe. Sie (= die Hypostasen) sind ohne Vermischung vereint und ohne Trennung unterschieden, was geradezu unglaublich scheint. [Wir glauben] an den Vater, Sohn und Hl. Geist, auf die wir auch getauft sind. Denn so hat der Herr seinen Aposteln zu taufen befohlen, da er sprach: „Taufet sie auf den Namen des Vaters und des Sohnes und des Hl. Geistes.“</p><p>[Wir glauben] an* einen* Vater, das Prinzip und die Ursache von allem. Er ist aus niemand gezeugt, er ist allein ohne jedes Prinzip und ungezeugt. Er ist Schöpfer aller Dinge. Kraft der Natur ist er Vater seines einen, alleinigen, eingeborenen Sohnes, unseres Herrn und Gottes und Heilandes Jesus Christus, und Hervorbringer des allheiligen Geistes. Und [wir glauben] „an* einen* Sohn Gottes, den Eingeborenen“, unseren Herrn Jesus Christus, „der aus dem Vater gezeugt ist vor aller Zeit, Licht vom Licht, wahrer Gott vom wahren Gott, gezeugt, nicht geschaffen, gleichen Wesens mit dem Vater, durch den alles erschaffen ist.“ Mit den Worten „vor aller Zeit“ zeigen wir an, daß seine Zeugung zeit- und anfangslos ist. Denn der Sohn Gottes ward nicht aus dem Nichtsein ins Sein hervorgebracht, er, „der Abglanz der Herrlichkeit, der Abdruck des Wesens des Vaters “, die lebendige „Weisheit und Kraft“, das Wort, das in sich selbst besteht, das wesenhafte, vollkommene und lebendige „Abbild des unsichtbaren Gottes “, nein, immer war er mit dem Vater und in ihm, ewig und anfangslos aus ihm gezeugt. Denn es gab nie eine Zeit, da der Vater war, als der Sohn nicht war, sondern mit dem Vater war zu gleicher Zeit der Sohn, der aus ihm gezeugt ist. Denn ohne Sohn könnte er (Gott) nicht Vater heißen. War er einmal ohne Sohn, dann war er nicht Vater. Und hat er später einen Sohn bekommen, so ist er später Vater geworden, während er vorher nicht Vater gewesen, und er hat sich geändert, aus dem Nicht-Vatersein ist er zum Vatersein gekommen. Allein das wäre schlimmer als jede Lästerung. Denn man kann nicht sagen, Gott entbehre der natürlichen Fruchtbarkeit. Die Fruchtbarkeit besteht nämlich darin, daß er aus ihm, d. h. aus seinem eigenen Wesen, etwas erzeugt, das ihm der Natur nach gleich ist.</p><p>Was also die Zeugung des Sohnes betrifft, so ist es gottlos, wenn man von einer Zwischenzeit spricht und den Sohn nach dem Vater geschaffen sein läßt. Denn aus ihm, d. h. aus der Natur des Vaters, so sagen wir, erfolgte die Zeugung des Sohnes. Geben wir nicht zu, daß von Anfang an mit dem Vater zugleich der aus ihm gezeugte Sohn existiere, dann tragen wir eine Veränderung in die Hypostase (Person) des Vaters hinein. Denn dann ist sie später Vater geworden, während sie es [zuerst] nicht war. Die Schöpfung ist ja allerdings später entstanden, allein nicht aus der Wesenheit des Vaters, sie ward vielmehr durch seine Kraft und seinen Willen aus dem Nichtsein ins Sein hervorgebracht. Darum hat die Natur Gottes keine Änderung erfahren. Zeugung ist nämlich der Hervorgang aus der Wesenheit des Zeugenden, so daß das Erzeugte [ihm] wesensgleich ist. Schöpfung aber und Erschaffung ist das Werden von außen her und nicht [das Werden] aus der Wesenheit des Erschaffenden und Bildenden, so daß das Geschaffene und Gebildete [ihm] vollständig ungleich ist.</p><p>Bei dem allein leidenschaftslosen, unwandelbaren, unveränderlichen, sich immer gleich bleibenden Gott also geschieht das Zeugen wie das Schaffen ohne Leidenschaft. Denn da er von Natur leidenschaftslos und ohne Fluß ist, weil einfach und nicht zusammengesetzt, kann er weder beim Zeugen noch beim Schaffen einer Leidenschaft oder einem Fluß unterworfen sein, auch bedarf er keiner Mitwirkung. Im Gegenteil. Denn die Zeugung ist anfangslos und ewig, weil sie ein Werk der Natur ist und aus seiner (═ Gottes) Wesenheit hervorgeht, so daß der Zeugende keine Veränderung erleidet, und es nicht einen früheren Gott und einen späteren Gott gibt, und er einen Zuwachs bekommt. Die Schöpfung bei Gott aber ist, weil sie ein Werk seines Willens ist, nicht gleichewig wie Gott. Denn das, was aus dem Nichtsein ins Sein hervorgebracht wird, kann nicht gleichewig sein mit dem, was ohne Anfang und immer ist. Mensch und Gott schaffen also nicht auf gleiche Weise. Der Mensch bringt nicht etwas aus dem Nichtsein ins Sein hervor, sondern was er schafft, schafft er aus einem vorher vorhandenen Stoff, und er* will* nicht bloß, sondern er überlegt auch zuvor und macht sich im Geiste ein Bild von dem, was werden soll, sodann arbeitet er auch mit den Händen und erträgt Mühsal und Anstrengung, oft verfehlt er aber auch das Ziel, sein Bemühen hat nicht den gewünschten Erfolg. Gott jedoch bringt durch bloßes Wollen alles aus dem Nichtsein ins Sein hervor. Ebenso zeugen Gott und Mensch auch nicht auf gleiche Weise. Denn Gott, der zeitlos, anfangslos, leidenschaftslos, ohne Fluß, unkörperlich, einzig und endlos ist, zeugt zeitlos, anfangslos, leidenschaftslos, ohne Fluß und Paarung. Seine unfaßbare Zeugung hat keinen Anfang und kein Ende. Anfangslos [zeugt] er wegen seiner Unveränderlichkeit; ohne Fluß wegen seiner Leidenschaftslosigkeit und Unkörperlichkeit; ohne Paarung, wiederum weil er unkörperlich und der einzige und alleinige Gott ist, der keines andern bedarf; endlos aber und unaufhörlich wegen der Anfangs-, Zeit- und Endlosigkeit und des immerwährenden Gleichseins. Denn was keinen Anfang hat, hat kein Ende. Was aber durch Gnade ohne Ende ist, ist sicherlich nicht ohne Anfang, wie z. B. die Engel.</p><p>Anfangs- und endlos also zeugt der immerseiende Gott sein vollkommenes Wort. Denn sonst würde Gott in der Zeit zeugen, er, der eine über die Zeit erhabene Natur und Existenz besitzt. Der Mensch aber zeugt offenbar gerade auf entgegengesetzte Weise, weil er dem Entstehen und Vergehen, dem Fluß und der Vervielfältigung unterliegt und mit einem Körper umhüllt ist und das Männliche und das Weibliche in seiner Natur besitzt (zweigeschlechtig ist). Denn es bedarf das Männliche der Hilfe des Weiblichen. — Nun denn, so möge gnädig sein der, der über alles erhaben ist und alles Denken und Begreifen übersteigt.</p><p>Es lehrt also die heilige, katholische und apostolische Kirche, daß zu gleicher Zeit mit dem Vater sein eingeborener Sohn ist, der zeitlos, ohne Fluß, leidenschaftslos und auf eine [uns] unbegreifliche, nur dem Gott aller Dinge bekannte Weise gezeugt ist, geradeso wie das Feuer und das Licht, das von ihm ausgeht, gleichzeitig sind, und nicht zuerst das Feuer und dann das Licht ist, sondern beide zu gleicher Zeit sind. Wie sodann das Licht, das ständig aus dem Feuer erzeugt wird, immer in ihm ist und sich nie von ihm trennt, so wird auch der Sohn aus dem Vater gezeugt und trennt sich durchaus nicht von ihm, sondern ist immer in ihm. Allein das Licht, das ohne Trennung aus dem Feuer erzeugt wird und ständig in ihm bleibt, hat keine eigene Subsistenz neben dem Feuer, denn es ist eine natürliche Beschaffenheit des Feuers. Der eingeborene Sohn Gottes aber, der ohne Trennung und Scheidung aus dem Vater gezeugt ist und immerdar in ihm bleibt, besitzt eigene Subsistenz neben der des Vaters.</p><p>Er heißt Wort und „Abglanz“, weil er ohne Paarung, leidenschaftslos und zeitlos, ohne Fluß und ohne Trennung aus dem Vater gezeugt ist. Sohn aber und „Abdruck des väterlichen Wesens “, weil er vollkommen ist, eigene Subsistenz besitzt und in allem dem Vater gleich ist, ausgenommen die Ungezeugtheit (Agennesie). Eingeborener aber, weil er einzig aus dem einzigen Vater auf einzige Weise gezeugt ist. Denn keine andere Zeugung läßt sich mit der Zeugung des Sohnes Gottes vergleichen. Es gibt ja auch keinen anderen Sohn Gottes. Wohl geht auch der Hl. Geist vom Vater aus, aber nicht zeugungsweise, sondern ausgangsweise. Das ist eine andere Existenzweise, unbegreifbar und unerkennbar, wie auch die Zeugung des Sohnes. Darum ist auch alles, was der Vater hat, sein, ausgenommen die Ungezeugtheit. Diese bezeichnet jedoch keinen Unterschied im Wesen noch eine Würde, sondern eine Existenzweise. Ein Beispiel: Adam ist ungezeugt, denn er ist ein Gebilde Gottes. Seth ist gezeugt, denn er ist ein Sohn Adams. Eva ist aus einer Rippe Adams hervorgegangen, also ist diese nicht gezeugt. Sie unterscheiden sich nicht durch die Natur voneinander — sie sind ja Menschen —, sondern durch die Existenzweise.</p><p>Man muß nämlich wissen, daß* ἀγένητον* [agenēton] (mit* einem* ν [n] geschrieben) das Ungeschaffene oder Nicht-Gewordene bezeichnet,* ἀγέννητον* [agennēton] aber (mit zwei νν [nn] geschrieben) das Nicht-Gezeugte bedeutet. Nach der ersten Bezeichnung nun unterscheidet sich Wesenheit von Wesenheit, denn eine andere ist die ungeschaffene und ungewordene (ἀγένητος [agenētos] mit einem ν [n]) und eine andere die gewordene oder geschaffene. Nach der zweiten Bezeichnung aber unterscheidet sich nicht Wesen vom Wesen. Denn in jeder Art (Spezies) lebender Wesen ist die erste Hypostase ungezeugt, aber nicht ungeworden. Sie wurden ja vom Schöpfer gebildet und durch sein Wort ins Dasein gesetzt. Aber gezeugt wurden sie wahrlich nicht, da ein anderes von gleicher Art, woraus sie erzeugt wären, vorher nicht existierte.</p><p>Nach der ersten Bezeichnung also kommen die drei übergöttlichen Personen der heiligen Gottheit [gegenseitig] überein, denn sie sind wesensgleich und ungeschaffen. Nach der zweiten Bezeichnung aber durchaus nicht. Denn nur der Vater ist ungezeugt, er hat das Sein von keiner anderen Person. Nur der Sohn ist gezeugt, denn er ist anfangslos und zeitlos aus dem Wesen des Vaters gezeugt. Nur der Hl. Geist geht vom Wesen des Vaters aus, denn er wird nicht gezeugt, sondern geht aus. So lehrt es die Hl. Schrift. Freilich die Art der Zeugung und des Ausgangs ist unbegreifbar.</p><p>Aber auch das muß man wissen, daß nicht von uns der Name der Vaterschaft, der Sohnschaft und des Ausgangs auf die selige Gottheit übertragen, sondern umgekehrt von dorther uns mitgeteilt worden ist, wie der göttliche Apostel sagt: „Darum beuge ich meine Knie vor dem Vater, von dem jegliche Vaterschaft im Himmel und auf Erden ist “.</p><p>Wenn wir aber sagen, der Vater sei Prinzip des Sohnes und größer, so meinen wir nicht, er habe bezüglich der Zeit oder der Natur dem Sohne gegenüber einen Vorrang, „er hat ja durch ihn die Zeiten geschaffen “; nein, das gilt einzig und allein hinsichtlich der Ursache (des Prinzips), insofern der Sohn aus dem Vater gezeugt ist, und nicht der Vater aus dem Sohn, und der Vater das natürliche Prinzip des Sohnes ist. Wir sagen ja auch nicht, aus dem Lichte geht das Feuer hervor, sondern umgekehrt, das Licht geht aus dem Feuer hervor. Wenn wir also hören, der Vater sei Prinzip des Sohnes und größer, so wollen wir dies in Rücksicht auf die Ursache (das Prinzip) verstehen. Und wie wir nicht sagen, eine andere Wesenheit hat das Feuer, und eine andere das Licht, so kann man nicht sagen, eine andere Wesenheit hat der Vater und eine andere der Sohn. Sie haben vielmehr ein und dieselbe. Ferner sagen wir, das Feuer leuchtet durch das Licht, das von ihm ausgeht; wir behaupten nicht, ein dienendes Werkzeug des Feuers ist das Licht, das ihm entspringt, sondern [behaupten] vielmehr, es ist eine natürliche Kraft. Ebenso sagen wir, der Vater tut alles, was er tut, durch seinen eingeborenen Sohn; nicht wie durch ein dienendes Werkzeug, sondern durch natürliche und subsistierende Kraft. Und wie wir sagen, das Feuer leuchtet, und wiederum sagen, das Licht des Feuers leuchtet, so „tut alles, was der Vater tut, in gleicher Weise auch der Sohn “. Allein das Licht besitzt keine eigene Subsistenz neben dem Feuer. Der Sohn aber ist eine vollkommene Hypostase, nicht getrennt von der väterlichen Hypostase, wie wir weiter oben dargetan haben. In der Schöpfung läßt sich eben unmöglich ein Bild finden, das völlig entsprechend (adäquat) in sich die Art und Weise der heiligen Dreieinigkeit darstellte. Denn wie könnte das, was geschaffen, zusammengesetzt, fließend, wandelbar und begrenzt ist, Gestalt hat und vergänglich ist, die von all dem freie, überwesentliche, göttliche Natur klar und deutlich machen? Alle Geschöpfe aber tragen offenbar die meisten dieser Merkmale an sich, und ein jedes verfällt gemäß seiner eigenen Natur dem Untergang.</p><p>Gleicherweise glauben wir auch „an einen Hl. Geist, den Herrn und Lebendigmacher, der vom Vater ausgeht “ und im Sohne ruht, „der mit dem Vater und dem Sohne zugleich angebetet und verherrlicht wird“, als wesensgleich und gleichewig; an den Geist aus Gott, „den rechten, den vorzüglichen “, den Quell der Weisheit, des Lebens und der Heiligung. Er ist und heißt Gott wie der Vater und der Sohn, ungeschaffen, vollkommen, Schöpfer, allherrschend, allwirkend, allmächtig, unendlich gewaltig; er herrscht über jedes Geschöpf, wird aber nicht beherrscht, er vergöttlicht, wird aber nicht vergöttlicht, er erfüllt, wird aber nicht erfüllt, er läßt teilnehmen, hat aber nicht teil, er heiligt, wird aber nicht geheiligt, er ist Anwalt, denn er nimmt aller Bitten entgegen. In allem ist er dem Vater und dem Sohne gleich. Er geht vom Vater aus, wird durch den Sohn mitgeteilt und von jeglichem Geschöpf empfangen. Er schafft durch sich selbst, macht alles zu Wesen, heiligt und hält zusammen. Er subsistiert in eigener Hypostase, ohne sich jedoch vom Vater und Sohne zu trennen und zu entfernen. Er besitzt alles, was der Vater und der Sohn hat, ausgenommen die Ungezeugtheit und das Gezeugtsein. Denn der Vater ist ohne Prinzip und ungezeugt, er ist aus keinem, er hat das Sein aus sich, und von allem, was er besitzt, hat er nichts von einem andern. Er ist vielmehr selbst für alles natürliches Prinzip und Ursache des Wieseins. Der Sohn aber ist aus dem Vater nach Art der Zeugung. Aber auch der Hl. Geist selbst ist aus dem Vater, jedoch nicht zeugungsweise, sondern ausgangsweise. Daß ein Unterschied zwischen Zeugung und Ausgang besteht, wissen wir. Welcher Art aber der Unterschied ist, [wissen] wir durchaus nicht. Die Zeugung des Sohnes aus dem Vater und der Ausgang des Hl. Geistes sind jedoch zugleich.</p><p>Alles also, was der Sohn besitzt, hat auch der Geist vom Vater, ja selbst das Sein. Wenn der Vater nicht ist, dann ist auch nicht der Sohn und nicht der Geist. Und wenn der Vater etwas nicht hat, dann hat es auch der Sohn und der Geist nicht. Wegen des Vaters, d. h. weil der Vater ist, ist der Sohn und der Geist. Und wegen des Vaters hat der Sohn und der Geist alles, was er hat, d. h. weil der Vater es hat, ausgenommen das Ungezeugtsein, das Gezeugtsein und Ausgehen. Denn nur in diesen persönlichen Eigentümlichkeiten unterscheiden sich die heiligen drei Personen voneinander. Nicht durch die Wesenheit, sondern durch das Merkmal der eigenen Hypostase sind sie ohne Trennung unterschieden.</p><p>Wir sagen, jeder von den dreien hat eine vollkommene Hypostase, damit wir nicht eine aus drei unvollkommenen [Hypostasen] zusammengesetzte vollkommene Natur annehmen, sondern eine in drei vollkommenen Hypostasen bestehende einzige, einfache, übervollkommene, übervollendete Wesenheit. Denn alles, was aus Unvollkommenem besteht, ist sicherlich zusammengesetzt. Eine Zusammensetzung aus vollkommenen Hypostasen aber ist ausgeschlossen. Darum sagen wir auch nicht, das Wesen bestehe* aus* Hypostasen, sondern* in* Hypostasen. Wir sprachen von Unvollkommenem, das das Wesen der Sache, die man aus ihm macht, nicht behält. Stein, Holz, Eisen: ein jedes ist für sich in seiner eigenen Natur vollkommen. In Rücksicht auf das Haus aber, das man aus ihnen herstellt, ist ein jedes unvollkommen. Denn keines von ihnen ist für sich ein Haus.</p><p>Vollkommen also nennen wir die Hypostasen, um nicht an eine Zusammensetzung bei der göttlichen Natur zu denken. Denn Zusammensetzung ist der Grund der Trennung. Ferner sagen wir, die drei Hypostasen sind ineinander, um nicht eine Menge und Schar von Göttern einzuführen. Die drei Hypostasen schließen für unser Erkennen eine Zusammensetzung und Vermischung aus, die Wesensgleichheit aber und das Ineinandersein der Hypostasen und die Identität des Willens, der Wirksamkeit, der Kraft, der Macht und der Tätigkeit lassen uns sozusagen die Untrennbarkeit und Einheit Gottes erkennen. Denn nur* einer* ist in Wahrheit Gott, der Gott und das Wort und sein Geist.</p><p><em>Vom Unterschied der drei Personen. Sachliche, logische und begriffliche Betrachtung.</em></p><p>Man muß wissen, daß etwas anderes die sachliche Betrachtung und etwas anderes die logische und begriffliche ist. Bei allen Geschöpfen wird der Unterschied der Hypostasen* sachlich* betrachtet. So sind Petrus und Paulus, sachlich betrachtet, voneinander getrennt.* Die Gemeinsamkeit* aber, die Zusammengehörigkeit und die Einheit* werden logisch und begrifflich angeschaut.* Denn wir denken mit dem Verstande, daß Petrus und Paulus von derselben Natur sind und eine einzige, gemeinsame Natur haben. Ein jeder von ihnen ist ein vernünftiges, sterbliches Lebewesen, und ein jeder von ihnen ist Fleisch, das durch eine vernünftige und denkende Seele belebt wird. Diese gemeinsame Natur also wird begrifflich betrachtet. Denn die Personen sind auch nicht ineinander. Eine jede ist eigens und besonders oder für sich getrennt, da sie sehr vieles haben, was sie voneinander scheidet. Denn sie sind örtlich getrennt, der Zeit nach verschieden, geteilt durch Gesinnung, Kraft, Gestalt oder Form, Fähigkeit, Temperament, Würde, Lebensart und alle charakteristischen Eigentümlichkeiten, vor allem aber dadurch, daß sie nicht ineinander, sondern getrennt [voneinander] sind. Man spricht darum auch von zwei, drei und vielen Menschen.</p><p>Das ist in der ganzen Schöpfung zu sehen. Bei der heiligen, überwesentlichen, allerhabenen, unbegreifbaren Dreieinigkeit aber ist es umgekehrt. Denn hier wird das Gemeinsame und* Eine sachlich* betrachtet* wegen der Gleichewigkeit und der Identität* des Wesens,* der Wirksamkeit des Willens,* wegen der Übereinstimmung der Denkweise und der Dieselbigkeit der Macht, der Kraft und* der Güte.* Ich sprach nicht von Ähnlichkeit, sondern von Identität und Einheitlichkeit der Tätigkeit. Denn es handelt sich um* eine* Wesenheit,* eine* Güte,* eine* Kraft,* einen* Willen,* eine* Wirksamkeit,* eine* Macht, eine und dieselbe, nicht um drei einander ähnliche, sondern um eine und dieselbe Tätigkeit der drei Personen. Eine jede von ihnen besitzt ja nicht weniger Einheit mit der anderen als mit sich selbst, d. h. der Vater und der Sohn und der Hl. Geist sind in allem eins, ausgenommen die Ungezeugtheit, das Gezeugtsein und den Ausgang.* Begrifflich aber sind sie unterschieden.* Denn wir erkennen* einen* Gott.* Nur in den Eigentümlichkeiten der Vaterschaft, der Sohnschaft und des Ausgangs, hinsichtlich des Prinzipes (═ der Ursache) und des Prinzipiierten (═ des Verursachten)* und der Vollkommenheit der Hypostase, nämlich der Existenzweise, denken wir den Unterschied.* Bei der unbegrenzten Gottheit können wir nicht wie bei uns von einer örtlichen Trennung reden;* denn die Personen sind ineinander nicht so, daß sie sich vermischen, sondern so, daß sie zusammenhängen nach dem Worte des Herrn, der gesagt: „Ich bin im Vater, und der Vater ist in mir.“* Ferner nicht von einem Unterschied des Willens oder der Denkweise* oder der Wirksamkeit* oder der Kraft* oder in irgendeinem anderen Punkte,* dergleichen bei uns die sachliche (reale) und gänzliche Trennung erzeugt.* Wir behaupten deshalb auch nicht, daß der Vater und der Sohn und der Hl. Geist drei Götter sind, vielmehr [sagen] wir, daß die heilige Dreiheit nur* ein* Gott ist. Denn* Sohn und Geist führen sich auf ein Prinzip zurück, sie setzen sich nicht zusammen und verschmelzen nicht * im Sinne der Synäresis (═ Zusammenziehung) des Sabellius. Sie sind ja, wie gesagt, eins, nicht so, daß sie sich vermischen, sondern so, daß sie gegenseitig zusammenhängen (einander inhärieren), sie haben das Ineinandersein (die Perichorese) ohne jede Verschmelzung und Vermischung. Sie sind ferner nicht auseinander oder dem Wesen nach getrennt im Sinne der Diäresis (═ Trennung) des Arius.* Denn die Gottheit ist, wenn man es kurz sagen soll, ungeteilt in Geteilten und gleichsam in drei zusammenhängenden und ungetrennten Sonnen eine Verbindung* und Einheit* des Lichtes. Wenn wir also zur Gottheit aufblicken und zu dem ersten Grund, zur Alleinherrschaft (Monarchie), zu dem einen und demselben Tun und Wollen der Gottheit, wenn ich so sagen darf, zur Identität des Wesens,* der Kraft, der Wirksamkeit und Herrschaft,* so ist eines das, was wir uns vorstellen; wenn aber zu dem, worin die Gottheit ist,* oder genauer gesagt, was die Gottheit ist,* und auf das, was aus der ersten Ursache zeitlos, gleichherrlich* und ungetrennt* entspringt,* nämlich die Personen des Sohnes und des Geistes,* so sind es drei, die angebetet werden.* * Ein* Vater ist der Vater und anfangslos, d. i. prinziplos, denn er ist aus keinem.* Ein* Sohn ist der Sohn, aber nicht anfangslos, d. i. nicht prinziplos, denn er ist aus dem Vater. Faßt man aber* ἀρχή* [archē] (= Anfang) zeitlich, so ist er gleichfalls anfangslos. Denn er ist der Schöpfer der Zeiten und der Zeit nicht unterworfen.* Ein* Geist ist der Hl. Geist. Er geht vom Vater aus, aber nicht nach Art eines Sohnes, sondern ausgangsweise. Der Vater ermangelt nicht der Ungezeugtheit, weil er gezeugt hat, der Sohn nicht der Zeugung, weil er vom Ungezeugten gezeugt worden ist (wie denn?), und der Hl. Geist geht weder in den Vater noch in den Sohn über, weil er ausgeht und Gott ist. Denn die Eigentümlichkeit ist unbeweglich (unveränderlich). Oder wie könnte die Eigentümlichkeit bleiben, wenn sie sich veränderte und überginge? Wenn nämlich der Vater Sohn wird, ist er nicht mehr Vater im eigentlichen Sinne, denn nur einer ist Vater im eigentlichen Sinne. Und wenn der Sohn Vater wird, ist er nicht im eigentlichen Sinne Sohn, denn nur einer ist im eigentlichen Sinne Sohn und einer Hl. Geist.</p><p>Man muß aber wissen, daß wir nicht sagen, der Vater ist aus jemand, sondern wir nennen ihn Vater des Sohnes. Den Sohn nennen wir nicht Ursache (Prinzip) noch Vater, wir sagen vielmehr, er ist aus dem Vater und der Sohn des Vaters. Der Hl. Geist aber, sagen wir, ist aus dem Vater, und wir nennen ihn Geist des Vaters. Dagegen behaupten wir nicht, daß er aus dem Sohne ist, nennen ihn jedoch Geist des Sohnes. „Wer den Geist Christi nicht hat“, sagt der göttliche Apostel, „der ist nicht sein.“ Auch bekennen wir, daß er uns durch den Sohn geoffenbart worden ist und mitgeteilt wird. Denn es heißt: „Er hauchte seine Jünger an und sprach zu ihnen: Empfanget den Hl. Geist.“ In gleicher Weise ist aus der Sonne sowohl der Strahl wie der Glanz — sie selbst ist ja die Quelle des Strahles und des Glanzes —, durch den Strahl aber wird der Glanz uns mitgeteilt, und dieser ist es, der uns erleuchtet und von uns aufgenommen wird. Der Sohn aber, sagen wir, ist weder des Geistes noch aus dem Geiste.</p><h3>IX. KAPITEL. Von den Prädikaten Gottes.</h3><p>Das göttliche Wesen ist einfach und nicht zusammengesetzt. Was aus Vielem und Verschiedenem besteht, ist zusammengesetzt. Würden wir nun das Ungeschaffensein, die Anfangslosigkeit, Unkörperlichkeit, Unsterblichkeit, Ewigkeit, Güte, Schöpfermacht und dergleichen als wesenhafte Unterschiede in Gott nehmen, so wäre das aus so vielem Bestehende nicht einfach, sondern zusammengesetzt. Man muß demnach dafürhalten, daß ein jedes der Prädikate Gottes nicht bezeichnet, was Gott seinem Wesen nach ist, sondern anzeigt, entweder was er nicht ist, oder eine Beziehung zu etwas, das sich von ihm unterscheidet, oder etwas, das seine Natur begleitet, oder eine Wirksamkeit.</p><p>Von all den Namen, die von Gott ausgesagt werden, scheint der treffendste „der Seiende“ zu sein. So* nennt er sich selbst dem Moses gegenüber beim Berge* (Horeb), wenn er spricht: „Sage den Söhnen Israels: Der Seiende (der da ist) hat mich gesandt.“* Denn er hat das ganze Sein in sich zusammengefaßt wie ein unendliches, grenzenloses Meer von Wesenheit.* Wie aber der hl. Dionysius sagt, [ist der treffendste Name] „der Gute“. Denn man kann bei Gott nicht sagen: Zuerst das Sein und dann das Gute.</p><p>Ein zweiter Name ist* Θεός* [Theos] (Gott). Er wird abgeleitet von* θέειν,* laufen, alles umkreisen, oder von * αἴθειν* [aithein], d. h. brennen; denn Gott ist ein Feuer, das jegliche Schlechtigkeit verzehrt, oder von* θεᾶσθαι* [theasthai], weil er alles sieht. Denn nichts entgeht ihm, von allem ist er Augenzeuge. [Er sieht alles, bevor es geschieht, in zeitlosem Denken, und jegliches geschieht nach seinem zeitlosen Willensentschluß, der Vorherbestimmung, Bild und Muster ist, in der vorherbestimmten Zeit].</p><p>Der erste [Name] also bezeichnet das Sein selbst und das Wassein, der zweite aber eine Tätigkeit. Die Anfangslosigkeit, die Unvergänglichkeit, das Ungewordensein oder Ungeschaffensein, die Unkörperlichkeit, die Unsichtbarkeit u. dgl. zeigen an, was er nicht ist, nämlich, daß er nicht zu sein angefangen hat, nicht vergeht, nicht geschaffen ist, nicht Körper, nicht sichtbar ist. Die Güte, Gerechtigkeit, Heiligkeit u. dgl. begleiten die Natur, allein das Wesen selbst offenbaren sie nicht. Der Name Herr, König u. dgl. drückt eine Beziehung aus zu dem, was gegenübersteht. Den Beherrschten gegenüber heißt er Herrscher (Herr), den Regierten gegenüber Regent (König), den Geschöpfen gegenüber Schöpfer, den Gehüteten gegenüber Hüter (Hirte).</p><h3>X. KAPITEL. Von der göttlichen Einheit und Unterscheidung.</h3><p>Alle diese Bezeichnungen sind* gemeinsam* von der ganzen Gottheit zu gebrauchen und gleichmäßig, einfach (═ einzeln, für jede göttliche Person), ungeteilt und einheitlich;* unterscheidungsweise* dagegen die Ausdrücke: Vater, Sohn, Geist, nichtprinzipiiert, prinzipiiert, ungezeugt, gezeugt und ausgegangen. Denn diese bezeichnen nicht das Wesen, sondern die gegenseitige Beziehung und die Subsistenzweise.</p><p>Dies wissen wir nun und werden dadurch zum göttlichen Wesen hingeführt, allein das Wesen selbst erfassen wir nicht, sondern nur das, was in der Umgebung des Wesens ist. Wenn wir z. B. erkennen, daß die Seele ohne Körper, ohne Quantität und ohne Gestalt ist, so haben wir nicht auch schon ihr Wesen erfaßt und ebensowenig [das Wesen] des Körpers, wenn wir erkennen, daß er weiß oder schwarz ist, sondern nur das, was in der Umgebung des Wesens ist. Die wahre Lehre aber lehrt, daß das göttliche Wesen einfach ist und eine einzige, einfache Wirksamkeit hat, die gut ist und in allen alles wirkt, gleich dem Sonnenstrahl, der alles erwärmt und in jedem entsprechend seiner natürlichen Empfänglichkeit und Aufnahmsfähigkeit wirkt, da er vom Schöpfer-Gott eine solche Wirksamkeit erhalten hat.</p><p>Unterschieden aber ist alles, was zur göttlichen, menschenfreundlichen Fleischwerdung des göttlichen Wortes gehört. Denn daran hat der Vater und der Geist in keiner Hinsicht einen Anteil, ausgenommen [den Anteil] in Hinsicht auf das Wohlgefallen und die unaussprechlichen Wundertaten, die auch der für uns Mensch gewordene Gott-Logos vollbracht hat als unwandelbarer Gott und Gottes Sohn.</p><h3>XI. KAPITEL. Von den körperlichen Prädikaten Gottes.</h3><p>Wir finden, daß in der göttlichen Schrift sehr vieles von Gott auf etwas körperliche Art symbolisch ausgedrückt ist. Allein man muß wissen, daß wir, die wir ja Menschen sind und dieses grobe Fleisch an uns tragen, unmöglich die göttlichen, erhabenen, immateriellen Tätigkeiten Gottes denken oder aussprechen können, wenn wir nicht Bilder, Typen und Symbole gebrauchen, die uns angemessen sind. Was immer also von Gott auf etwas körperliche Weise gesagt ist, ist symbolisch gesprochen, es hat aber einen höheren Sinn. Denn das göttliche Wesen ist einfach und gestaltlos. Unter den Augen, den Wimpern und dem Gesicht Gottes sollen wir seine allsehende Kraft und seine nichts übersehende Erkenntnis verstehen, weil durch diesen Sinn eine vollkommenere Erkenntnis und Einsicht bei uns entsteht. Unter den Ohren und dem Gehör seine Geneigtheit, Gnade zu üben und unser Flehen aufzunehmen. Denn auch wir zeigen uns durch diesen Sinn denen, die flehentlich bitten, gnädig, freundlich neigen wir zu ihnen das Ohr. Unter dem Mund und dem Reden den Ausdruck seines Willens, weil bei uns durch Mund und Reden die Gedanken des Herzens zum Ausdruck kommen. Unter Speise und Trank unsere Übereinstimmung mit seinem Willen, denn auch wir sättigen durch den Geschmacksinn das notwendige Begehren der Natur. Unter Geruch die Annahme wohlwollender Gesinnung gegen ihn, weil auch bei uns durch diesen Sinn die Aufnahme des Wohlgeruchs erfolgt. Unter Angesicht sein Erscheinen und Sichtbarwerden in den Werken, weil auch wir durch das Angesicht erkennbar werden. Unter den Händen seine erfolgreiche Wirksamkeit, denn auch wir führen das Nützliche und besonders Wertvolle mit unseren Händen aus. Unter der Rechten seine Hilfe zur rechten Zeit, denn auch wir bedienen uns da, wo es sich um höheren Anstand und Wert handelt, und sehr viel Kraft nötig ist, lieber der Rechten. Unter Betastung seine ganz genaue Erkenntnis und Erforschung der unscheinbarsten und verborgensten Dinge, weil bei uns die, die betastet werden, nichts in sich verbergen können. Unter Füßen und Gehen sein Kommen und Erscheinen zur Unterstützung der Bedürftigen oder zur Bestrafung der Feinde oder zu anderem Tun, weil sich bei uns durch den Gebrauch der Füße das Kommen vollzieht. Unter dem Schwur die Unveränderlichkeit seines Ratschlusses, weil bei uns die gegenseitigen Verträge durch einen Eid befestigt werden. Unter Zorn und Grimm seine Feindschaft und Abneigung gegen die Schlechtigkeit, denn auch wir zeigen Haß und Zorn gegen das, was unserer Gesinnung entgegengesetzt ist. Unter Vergessen, Schlaf und Schlummer die Verzögerung der Bestrafung der Feinde und den Aufschub der gewohnten Hilfe gegen die Seinen. Kurz, alle die körperlichen Bezeichnungen Gottes haben einen verborgenen Sinn, der uns aus dem, was uns entspricht, das lehrt, was über uns ist, ausgenommen das, was etwa über den körperlichen Erdenwandel des Gott-Logos gesagt ist. Denn er hat unseres Heiles wegen den ganzen Menschen angenommen, eine vernünftige Seele und einen Leib und die Eigentümlichkeiten der menschlichen Natur und die natürlichen, untadeligen Affekte.</p><h3>XII. KAPITEL. Über das nämliche.</h3><p>Das also lernen wir, wie der göttliche Dionysius der Areopagite sagt, aus den heiligen Aussprüchen: Gott ist* die Ursache und das Prinzip aller Dinge, die Wesenheit* der Wesen,* das Leben* der Lebenden, die Vernunft der Vernünftigen, der Verstand der Verständigen,* Rückruf und Auferstehung der von ihm Abfallenden, Erneuerung und Umwandlung* der das Naturgemäße Verderbenden,* heiliger Halt der von unheiliger Unruhe Geplagten, Sicherheit der Stehenden, Weg und Emporführung der zu ihm Gehenden.* Er ist aber auch, das möchte ich hinzusetzen, Vater seiner Geschöpfe. Ja, unser Gott, der uns aus dem Nichtsein ins Sein gerufen, ist Vater in eigentlicherem Sinne als die Eltern, die ja von ihm sowohl das Sein als das Zeugen empfangen haben. Er ist ferner der Hirte der ihm Folgenden und von ihm sich weiden Lassenden, das Licht der Licht Werdenden, der Vollendungsgrund der sich Vollendenden, der Vergöttlichungsgrund der sich Vergöttlichenden, der Friede der Entzweiten, die Einfachheit der einfach Werdenden, die Einheit der sich Einenden, jeglichen Anfangs überwesentlicher, weil überanfänglicher Anfang, gütige Mitteilung des Verborgenen, d. i. seiner Erkenntnis, soweit es möglich und für den einzelnen faßbar ist.</p><p><em>Noch Genaueres über die göttlichen Namen.</em></p><p>Die Gottheit ist unbegreifbar, darum wird sie sicherlich auch ohne Namen sein. Da wir also ihr Wesen nicht kennen, wollen wir auch nicht nach dem Namen ihres Wesens forschen. Die Namen bezeichnen die Sachen. Wohl ist Gott gütig, er hat, um seine Güte mitzuteilen, uns aus dem Nichtsein ins Sein gerufen und uns mit Erkenntnis ausgestattet; allein die Erkenntnis seines Wesens hat er uns nicht mitgeteilt, so wenig wie sein Wesen. Denn unmöglich kann eine Natur die Übernatur vollkommen erkennen. Mag man auch das Seiende erkennen, doch wie soll man das Überseiende erkennen? In seiner unaussprechlichen Güte gefiel es ihm (Gott) nun, sich nach dem nennen zu lassen, was uns entspricht, so daß wir seiner Erkenntnis nicht völlig bar sind und ein, wenn auch dunkles Verständnis von ihm haben. Insofern er also unbegreifbar ist, ist er auch unbenennbar. Da er aber die Ursache aller Dinge ist und die Begriffe und die Ursachen von allem Seienden in sich befaßt, wird er auch nach allem Seienden, selbst nach dem Entgegengesetzten, benannt, wie z. B. nach Licht und Finsternis, Wasser und Feuer. Wir sollen dadurch erkennen, daß er dieses nicht dem Wesen nach ist. Denn er ist überwesentlich und unbenennbar. Als Ursache alles Seienden wird er jedoch nach allem Verursachten benannt.</p><p>Deshalb werden von den Namen Gottes die einen verneinend ausgesagt, sofern sie das Überwesentliche bezeichnen, wie wesenlos, zeitlos, anfangslos, unsichtbar, nicht als ob er geringer wäre als etwas oder als ob ihm etwas fehlte — sein ist ja alles und aus ihm und durch ihn ist es geworden und in ihm hat es seinen Bestand —, sondern weil er überschwenglich erhaben über alle Wesen ist. Die anderen aber werden bejahend ausgesagt, sie werden von ihm gebraucht, insofern er die Ursache von allem ist. Als die Ursache alles Seienden und jeglicher Wesenheit heißt er Seiender und Wesenheit. Als Ursache jeglicher Vernunft und Weisheit, des Vernünftigen und Weisen, heißt er Vernunft und vernünftig, Weisheit und weise; desgleichen Verstand und verständig, Leben und lebendig, Macht und mächtig und ebenso in allem übrigen. Viel passender jedoch wird man ihn nach dem Höheren und ihm Nahestehenden benennen. Höher aber und ihm viel näher ist das Immaterielle als das Materielle, das Reine als das Befleckte, das Heilige als das Fluchbeladene. Denn ersteres hat auch mehr an ihm teil. Darum wird man ihn passender Sonne und Licht nennen als Finsternis, Tag als Nacht, Leben als Tod, Feuer, Luft und Wasser (weil zum Leben gehörig) als Erde und vor allem und ganz besonders Güte als Schlechtigkeit oder, was dasselbe ist, seiend als nicht seiend. Denn das Gute ist Sein und Ursache des Seins, das Böse aber Beraubung von Gutem oder Sein. Das nun sind die Verneinungen und Bejahungen. Sehr fein ist aber auch die Verbindung beider, wie z. B. die überwesentliche Wesenheit, die übergöttliche Gottheit, der überanfängliche Anfang u. dgl. Es gibt ferner gewisse bejahende Aussagen von Gott, die die Bedeutung einer überschwenglichen Verneinung haben, wie z. B. Finsternis. Nicht als ob Gott Finsternis wäre, sondern weil er nicht Licht ist, vielmehr erhaben über das Licht ist.</p><p>Es heißt also Gott Verstand, Vernunft, Geist, Weisheit und Kraft, da er deren Urheber, immateriell, allschaffend und allmächtig ist. Diese Prädikate werden gemeinsam von der ganzen Gottheit gebraucht, die Verneinung wie die Bejahung, und von jeder einzelnen Person der heiligen Dreieinigkeit gleichmäßig auf dieselbe Weise und unterschiedslos. Denn denke ich an eine der Personen, so weiß ich, daß sie vollkommener Gott, vollkommene Wesenheit ist. Nehme und zähle ich aber die drei zusammen, so weiß ich, daß sie* ein* vollkommener Gott sind. Denn nicht zusammengesetzt ist die Gottheit, sondern in drei Vollkommenen* ein* Ungeteiltes und zusammengesetztes Vollkommenes. Denke ich aber an das wechselseitige Verhältnis der Personen, so weiß ich, daß der Vater überwesentliche Sonne, Quelle der Güte, Abgrund von Wesenheit, Vernunft, Weisheit, Kraft, Licht und Gottheit, erzeugende und hervorbringende Quelle des darin verborgenen Guten ist. Er ist also Verstand, Abgrund von Vernunft, Erzeuger des Wortes und durch das Wort Hervorbringer des offenbarenden Geistes, und, um es kurz zu sagen, nur der Sohn ist Wort, Weisheit, Kraft und Wille des Vaters, die einzige Kraft, die der Schöpfung aller Dinge vorangeht, die so als vollkommene Person aus einer vollkommenen Person gezeugt ist, wie der selbst weiß, der Sohn ist und heißt. Der Hl. Geist aber ist die das Verborgene der Gottheit offenbarende Kraft des Vaters, die vom Vater durch den Sohn ausgeht, wie er selbst weiß, nicht zeugungsweise. Darum ist auch der Hl. Geist der Vollender alles Geschaffenen. Alles nun, was dem verursachenden Vater, der Quelle, dem Erzeuger eignet, ist nur dem Vater zuzueignen. Alles aber, was dem verursachten (prinzipiierten), gezeugten Sohne, dem Logos, der vorangehenden Kraft, dem Willen, der Weisheit eignet, ist dem Sohne zuzueignen. Alles jedoch, was der verursachten, ausgehenden, offenbarenden, vollendenden Kraft eignet, ist dem Hl. Geiste zuzueignen. Der Vater ist Quelle und Ursache des Sohnes und des Hl. Geistes, Vater jedoch nur vom Sohne, vom Hl. Geiste Hervorbringer. Der Sohn ist Sohn, Wort, Weisheit, Kraft, Bild, „Abglanz, Abdruck“ des Vaters und aus dem Vater. Der Hl. Geist aber ist nicht Sohn des Vaters, er ist Geist des Vaters, da er vom Vater ausgeht — ohne Geist keine Betätigung —, aber auch Geist des Sohnes, nicht weil er aus ihm, sondern weil er durch ihn vom Vater ausgeht. Urgrund ist nämlich nur der Vater.</p><h3>XIII. KAPITEL. Vom Orte Gottes. Das göttliche Wesen allein ist unbegrenzt.</h3><p>Der Ort ist körperlich, Grenze des Umgebenden, sofern das Umgebene umgeben wird. Die Luft z. B. umgibt, der Körper aber wird umgeben. Nicht ganz jedoch ist die umgebende Luft Ort des umgebenen Körpers, sondern das Ende der umgebenden Luft, die den umgebenen Körper berührt. Jedenfalls aber ist das Umgebende nicht im Umgebenen.</p><p>Es gibt aber auch einen geistigen Ort, wo die geistige, unkörperliche Natur gedacht wird und ist, wo sie zugegen ist und wirkt, nicht körperlich, sondern geistig umgeben wird. Denn sie hat keine Gestalt, um körperlich umgeben werden zu können. Darum ist Gott, da er immateriell und unbegrenzt ist, an keinem Orte. Er selbst ist sein Ort, da er alles erfüllt und über allem ist und selbst alles zusammenhält. Man sagt aber auch, er sei an einem Orte. Ort Gottes heißt der Ort, wo seine Wirksamkeit sich offenbart. Er selbst durchdringt ja alles ohne Vermischung und teilt allem von seiner eigenen Wirksamkeit mit, so wie es der Empfänglichkeit und Aufnahmsfähigkeit, ich meine der natürlichen, und Willensreinheit des einzelnen entspricht. Reiner ist das Immaterielle als das Materielle, das Tugendhafte als das mit Schlechtigkeit Gepaarte. Es heißt demnach Ort Gottes der, der mehr teil hat an seiner Wirksamkeit und Gnade. Darum ist der Himmel sein Thron. Denn in ihm sind die Engel, die seinen Willen tun und ihn immerdar preisen. Das ist seine Ruhestätte, die Erde aber ist der Schemel seiner Füße. Denn auf ihr hat er im Fleische mit den Menschen verkehrt. Fuß Gottes jedoch ist sein heiliges Fleisch genannt. Es heißt aber auch die Kirche Ort Gottes. Denn diesen haben wir zu seinem Lobpreis als ein Heiligtum ausgesondert; in ihm richten wir auch unsere Bitten an ihn. Desgleichen werden auch die Orte, an denen uns seine Wirksamkeit offenbar wird, sei es im Fleische, sei es ohne Körper, Orte Gottes genannt.</p><p>Man muß jedoch wissen, daß das göttliche Wesen unteilbar ist, überall vollständig ganz ist und sich nicht nach Körperart in einzelne Teile auflöst. Nein, es ist ganz in allem und ganz über allem.</p><p><em>Vom Orte des Engels und der Seele und vom Unumschriebenen.</em></p><p>Der Engel wird zwar nicht nach Körperart an einem Orte umschlossen, so daß er Form und Gestalt annähme. Gleichwohl sagt man, er sei an einem Orte, weil er eben auf geistige Art zugegen ist und seiner Natur entsprechend wirkt, und er sei nicht anderswo, sondern werde an seinem Wirkungsorte geistig umgrenzt. Denn er kann nicht zu gleicher Zeit an verschiedenen Orten wirken. Gott allein ist es eigen, überall zu derselben Zeit zu wirken. Der Engel wirkt durch die Schnelligkeit seiner Natur, durch seine Fähigkeit, sich flink und rasch von einem Ort zum andern zu bewegen, an verschiedenen Orten. Das göttliche Wesen aber, das ja überall und über allem ist, wirkt zu gleicher Zeit auf verschiedene Weise durch eine einzige und einfache Tätigkeit.</p><p>Die Seele aber ist ganz mit dem ganzen Körper verbunden, und nicht ein Teil mit dem andern. Und sie wird von ihm nicht umfaßt, sondern sie umfaßt ihn wie Feuer das Eisen und bringt in ihm ihre eigenen Tätigkeiten hervor.</p><p>Umschrieben ist, was von Ort, Zeit oder Begriff begrenzt ist; unumschrieben aber, was keine dieser Grenzen hat. Unumschrieben ist also nur die Gottheit, da sie ohne Anfang und Ende ist, alles umfaßt und von keinem Begriff umfaßt wird. Denn sie allein ist unbegreifbar und unbegrenzt, von niemand wird sie erkannt, nur sie selbst erkennt sich. Der Engel aber wird umschrieben: von der Zeit, denn er hat zu sein angefangen; vom Orte, wenn auch auf geistige Weise, wie oben gesagt, und vom Begriff. Denn sie (die Engel) kennen doch wohl ihre gegenseitige Natur und sie werden vollständig vom Schöpfer begrenzt. Die Körper aber [werden] durch Anfang und Ende, durch körperlichen Ort und Begriff [umschrieben].</p><p><em>Folgerungen von Gott dem Vater und dem Sohne und dem Hl. Geiste.</em></p><p>Völlig unveränderlich und unwandelbar also ist die Gottheit. Sie hat, was nicht in unserer Macht gelegen ist, alles kraft ihres Vorauswissens vorherbestimmt, jedes einzelne für den geeigneten, entsprechenden Zeitpunkt und Ort. Und demgemäß „richtet der Vater niemand, sondern er hat das Gericht ganz dem Sohne gegeben “. Es richtet ja allerdings der Vater und der Sohn als Gott und der Hl. Geist. Aber der Sohn selbst wird als Mensch in körperlicher Gestalt herabkommen und „auf dem Throne der Herrlichkeit sitzen “ — das Herabkommen und das Sitzen ist Sache eines umschriebenen Körpers — und den ganzen Erdkreis in Gerechtigkeit richten.</p><p>Alles steht Gott ferne, nicht dem Orte, sondern der Natur nach. Klugheit, Weisheit und Rat kommen und gehen bei uns, da sie eine Beschaffenheit sind, nicht aber bei Gott. Denn bei ihm entsteht und vergeht nichts. Er ist ja unveränderlich und unwandelbar, bei ihm darf man von keinem Akzidens reden. Denn das Gute trifft mit dem Wesen zusammen. Wer nach Gott allzeit verlangt, der sieht ihn; Gott ist ja in allem. Denn an dem Seienden (═ Gott) hängt das Seiende, und es kann nichts sein, außer es hat in dem Seienden (═ Gott) das Sein. Mit allen Dingen ist Gott vermischt, da er ihre Natur zusammenhält. Mit seiner heiligen Natur aber ist der Gott-Logos hypostatisch geeint und mit der unsrigen ohne Vermischung verbunden.</p><p>Niemand sieht den Vater, außer der Sohn und der Geist.</p><p>Wille, Weisheit und Kraft des Vaters ist der Sohn. Man darf nämlich bei Gott von keiner Beschaffenheit reden, damit wir nicht sagen, er sei aus Wesenheit und Beschaffenheit zusammengesetzt.</p><p>Der Sohn ist aus dem Vater, und alles, was er besitzt, hat er aus ihm. Deshalb kann er auch nichts aus sich selbst tun. Denn er hat keine eigene Wirksamkeit neben dem Vater.</p><p>Daß aber Gott, obwohl er seiner Natur nach unsichtbar ist, durch seine Wirksamkeiten sichtbar wird, erkennen wir aus dem Bestand und der Regierung der Welt.</p><p>Bild des Vaters ist der Sohn und [Bild] des Sohnes der Geist. Durch ihn verleiht Christus dem Menschen, in dem er wohnt, die Gottebenbildlichkeit.</p><p>Der Hl. Geist ist Gott. Er steht in der Mitte zwischen dem Ungezeugten und Gezeugten und wird durch den Sohn mit dem Vater verbunden. Er heißt Geist Gottes, Geist Christi, Verstand Christi, Geist des Herrn, Selbstherr, Geist der Annahme an Kindesstatt (Adoption), der Wahrheit, Freiheit, Weisheit (denn all das bewirkt er), er erfüllt alles durch seine Wesenheit, hält alles zusammen, er erfüllt die Welt in seiner Wesenheit, ist unfaßbar für die Welt in seiner Macht.</p><p><em>Gott ist immerwährende und unveränderliche Wesenheit, sie ist Schöpferin des Seienden und wird in frommer Erwägung angebetet.</em></p><p><em>Gott der Vater, der immer Seiende,</em> ist ungezeugt, denn er ist aus niemand gezeugt, sondern er hat den gleichewigen Sohn gezeugt.* Gott ist auch der Sohn, der immer* zugleich mit dem Vater* ist,* zeitlos, ewig, ohne Fluß und Leidenschaft und Trennung aus ihm gezeugt.* Gott ist auch der Hl. Geist, die heilige,* subsistierende* Kraft,* die ohne Trennung vom Vater ausgeht und im Sohne ruht,* gleichen Wesens mit dem Vater und dem Sohne.*</p><p><em>Logos (Wort) ist der immer wesenhaft mit dem Vater zugleich Seiende.</em> Logos ist dann auch die natürliche Bewegung des Geistes, in der er tätig ist, denkt und urteilt, gleichsam sein Licht und Abglanz.* Logos ist* ferner* das innerliche, im Herzen gesprochene Wort. Logos ist endlich der Bote des Gedankens.* Der Gott-Logos ist also wesenhaft und subsistierend. Die übrigen drei Arten des Logos sind Kräfte der Seele und werden nicht in eigener Subsistenz betrachtet. Der Logos der ersten Art ist ein natürliches Erzeugnis des Geistes, das auf natürliche Weise immer aus ihm hervorquillt. Der der zweiten Art heißt das im Herzen gesprochene Wort, der der dritten Art das mit dem Munde gesprochene Wort.</p><p>Das Wort Pneuma ist vieldeutig. Es bedeutet den Hl. Geist. Es heißen aber auch die Kräfte (Wirkungen) des Hl. Geistes Pneumata. Pneuma [heißt] auch der gute Engel, Pneuma auch der Dämon, Pneuma auch die Seele. Bisweilen wird auch der Verstand Pneuma genannt. Pneuma [heißt] auch der Wind, Pneuma auch die Luft.</p><h3>XIV. KAPITEL. Die Eigentümlichkeiten (ldiomata) der göttlichen Natur.</h3><p>Die Ungeschaffenheit, die Anfangslosigkeit, die Unsterblichkeit, Unendlichkeit, Ewigkeit, die Immateriälität, die Güte, die Schöpferkraft, die Gerechtigkeit, die Lichtgebung, die Unveränderlichkeit, die Leidenschaftslosigkeit, die Unumschriebenheit, die Unfaßbarkeit, die Unumschränktheit, die Unbegrenztheit, die Unsichtbarkeit, die Unbegreifbarkeit, die Bedürfnislosigkeit, die Selbstherrschaft und Selbstbestimmung, die Allgewalt, die Lebensspendung, die Allmacht, die Machtvollkommenheit, die Heiligung und Mitteilung, das Allumfassen und Allzusammenhalten, die Allfürsorge — all das u. dgl. besitzt [das göttliche Wesen] von Natur; es hat dies nicht anderswoher bekommen, sondern teilt selbst seinen Geschöpfen entsprechend der Aufnahmsfähigkeit des einzelnen alles Gute mit.</p><p>Die Personen weilen und wohnen ineinander. Denn sie sind unzertrennlich und gehen nicht auseinander, sie sind unvermischt ineinander, jedoch nicht so, daß sie verschmelzen oder verfließen, sondern so, daß sie gegenseitig zusammenhängen. Denn der Sohn ist im Vater und Geiste, und der Geist im Vater und Sohne, und der Vater im Sohne und Geiste, ohne daß eine Zerfließung oder Verschmelzung oder Vermischung stattfände. Und es besteht Einheit und Identität in der Bewegung, denn die drei Personen haben nur* eine* Bewegung,* eine* Tätigkeit. Das läßt sich bei der geschaffenen Natur nicht beobachten.</p><p>So bleibt auch die göttliche Erleuchtung und Wirksamkeit, die nur eine, einfach und ungeteilt ist, obwohl sie in den geteilten Dingen verschiedenartiges Gute wirkt und allen das zuteilt, was den Bestand ihrer Natur bedingt, einfach, sie vervielfältigt sich ungeteilt im Geteilten und sammelt und wendet das Geteilte zu seiner eigenen Einfachheit hin. Denn alles verlangt nach ihr und hat in ihr seine Existenz. Sie teilt allem das Sein mit, so, wie es seine Natur braucht. Sie ist das Sein der Seienden, das Leben der Lebendigen, die Vernunft der Vernünftigen und der Verstand der Verständigen, während sie selbst über dem Verstand, über der Vernunft, über dem Leben und über dem Sein ist.</p><p>Außerdem dringt sie auch durch alles ohne Vermischung, durch sie aber [dringt] nichts. Ferner erkennt sie auch alles in einfacher Erkenntnis. Mit ihrem göttlichen, allschauenden und immateriellen Auge sieht sie alles auf einfache Weise, das Gegenwärtige, das Vergangene und das Zukünftige, ehe es geschieht. Sie ist ohne Sünde, läßt Sünden nach und rettet. Sie kann alles, was sie will, aber nicht alles, was sie kann, will sie. Sie kann nämlich die Welt vernichten, will es aber nicht.</p>
