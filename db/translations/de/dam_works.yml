      <p><em>Genaue Darlegung des orthodoxen Glaubens — Buch 2 (Bibliothek der Kirchenväter).</em></p><h2>Buch 2</h2><h3>I. KAPITEL. Vom Äon.</h3><p>Der hat die Zeiten (Äonen) geschaffen, der vor den Zeiten ist, zu dem der göttliche David spricht: „Von Ewigkeit (Äon) zu Ewigkeit bist du.“ Und der Apostel [sagt]: „Durch den er auch die Zeiten geschaffen.“</p><p>Man muß also wissen, daß der Name Äon vieldeutig ist. Ja, er hat mehrfachen Sinn. Äon heißt einmal jedes menschliche Lebensalter. Dann heißt Äon der Zeitraum von tausend Jahren. Weiterhin heißt Äon das ganze gegenwärtige Leben und Äon [heißt] das zukünftige, das endlose [Leben] nach der Auferstehung. Es heißt ferner* Äon nicht eine Zeit oder ein Zeitteil, der nach Gang* und Lauf* der Sonne gemessen wird,* also aus Tagen und Nächten besteht,* sondern die Bewegung und Dauer, die, gleichsam zeitlich, mit dem Ewigen gleichläuft.* Denn was für das Zeitliche die Zeit, das ist für das Ewige die Ewigkeit (der Äon).</p><p>Man zählt nun sieben Zeitalter dieser Welt, angefangen von Erschaffung des Himmels und der Erde bis zur allgemeinen Vollendung und Auferstehung der Menschen. Es gibt eine teilweise Vollendung, d. i. der Tod des einzelnen. Es gibt aber auch eine allgemeine und ganze Vollendung, wenn die allgemeine Auferstehung der Menschen erfolgen wird. Das achte Zeitalter aber ist das zukünftige.</p><p>Vor dem Bestehen der Welt, als es noch keine Sonne gab, die den Tag von der Nacht schied, gab es auch keine meßbare Zeit (Äon),* sondern die Bewegung und Dauer, die, gleichsam zeitlich, mit dem Ewigen gleichläuft.* In dieser Hinsicht gibt es nur einen Äon. Deshalb heißt Gott unzeitlich, aber auch vorzeitlich. Er hat ja die Zeit selbst geschaffen. Gott allein ist anfangslos, darum ist er der Schöpfer von allem, der Zeiten und alles Seienden. Ich habe von Gott gesprochen. Darunter verstehe ich natürlich den Vater und seinen eingeborenen Sohn, unsern Herrn Jesus Christus, und seinen allheiligen Geist als unseren einzigen Gott.</p><p>Man spricht auch von Zeiten der Zeiten deshalb, weil ja die sieben Zeitalter der gegenwärtigen Welt viele Zeiten, nämlich Menschenleben, umfassen, und der eine Äon alle Äonen in sich schließt. Und Zeit der Zeit heißt die gegenwärtige wie die zukünftige. Ewiges Leben aber und ewige Strafe bezeichnet die Endlosigkeit der zukünftigen Zeit. Denn nach der Auferstehung wird die Zeit nicht nach Tagen und Nächten gerechnet werden. Es wird vielmehr ein Tag ohne Abend sein, da „die Sonne der Gerechtigkeit“ den Gerechten hell strahlt. Für die Sünder aber wird tiefe, endlose Nacht sein. Wie wird es deshalb möglich sein, die tausendjährige Zeit der origenistischen Wiederherstellung (Apokatastasis) zu zählen? Aller Zeiten einziger Schöpfer also ist Gott, er, der ja alles geschaffen hat, der vor den Zeiten ist.</p><h3>II. KAPITEL. Von der Schöpfertätigkeit.</h3><p>[Forts. v. ] Der gute, übergute Gott hat sich nicht mit der Betrachtung seiner selbst begnügt, nein, im Übermaße seiner Güte hat er gewollt, daß etwas werde, das seine Wohltaten empfangen und an seiner Güte teilnehmen soll. Darum bringt er alles aus dem Nichtsein ins Sein hervor und schafft es, das Unsichtbare wie das Sichtbare und den Menschen, der aus Sichtbarem und Unsichtbarem zusammengesetzt ist. Er schafft aber, indem er denkt, und* der Gedanke subsistiert als Werk, durch das Wort vollbracht und durch den Geist vollendet.*</p><h3>III. KAPITEL. Von den Engeln.</h3><p>Er selbst ist der Schöpfer und Bildner der Engel. Er hat sie aus dem Nichtsein ins Sein gerufen, nach seinem Bilde hat er sie geschaffen als eine körperlose Natur, eine Art Wind und* unstoffliches Feuer,* wie der göttliche David sagt: „Der seine Engel zu Winden und seine Diener zur Feuerflamme macht“. Damit beschreibt er die Leichtigkeit, Feurigkeit, Wärme, Eindringlichkeit und Schnelligkeit, womit sie sich Gott hingeben und ihm dienen, ihr Aufwärtsstreben und Freisein von jeder materiellen Gesinnung.</p><p><em>Ein Engel ist</em> demnach* ein denkendes, allzeit tätiges, willensfreies,* unkörperliches,* Gott dienendes Wesen,* dessen Natur die Unsterblichkeit aus Gnade empfangen hat. Die Form und Bestimmung seines Wesens kennt allein der Schöpfer. Unkörperlich aber und immateriell heißt er in Beziehung auf uns. Denn verglichen mit Gott, dem allein Unvergleichbaren, erscheint alles grob und stofflich. Wahrhaft unstofflich und unkörperlich ist eben nur das göttliche Wesen.</p><p>Er (der Engel) ist also ein vernünftiges, denkendes, willensfreies, in Gesinnung oder Willen wandelbares Wesen. Denn alles Geschaffene ist auch wandelbar, nur das Ungeschaffene ist unwandelbar. Und alles Vernünftige kann sich selbst bestimmen. Als vernünftig und denkend hat es (das Wesen des Engels) darum freie Selbstbestimmung. Als geschaffen ist es jedoch wandelbar, es hat die Macht, sowohl im Guten zu bleiben und vorwärts zu kommen, als sich zum Schlechten zu wenden.</p><p>Unfähig ist er (der Engel) einer Bekehrung, weil er ja unkörperlich ist. Denn der Mensch hat wegen der Schwachheit des Körpers Bekehrung erlangt. Unsterblich ist er nicht kraft seiner Natur, sondern durch Gnade. Denn alles, was einen Anfang gehabt, hat naturgemäß auch ein Ende. Nur Gott ist immer, ja noch mehr, er ist sogar über dem Immer. Denn nicht unter der Zeit, sondern über der Zeit ist der Schöpfer der Zeiten.</p><p>Sie (die Engel) sind sekundäre, geistige Lichter. Ihre Erleuchtung haben sie vom ersten, anfangslosen Lichte. Sprache und Gehör brauchen sie nicht, sie teilen vielmehr ohne gesprochenes Wort einander ihre Gedanken und Entschlüsse mit.</p><p>Durch das Wort (den Logos) wurden alle Engel geschaffen und vom Hl. Geiste durch die Heiligung vollendet, entsprechend ihrer Würde und ihrer Rangordnung sind sie der Erleuchtung und der Gnade teilhaftig geworden.</p><p>Sie sind umschrieben. Denn wenn sie im Himmel sind, sind sie nicht auf der Erde. Und werden sie von Gott auf die Erde gesandt, so bleiben sie nicht im Himmel zurück. Sie werden aber nicht begrenzt von Mauern und Türen, Riegeln und Siegeln, denn sie sind unbegrenzt. Unbegrenzt sage ich. Denn nicht so, wie sie sind, erscheinen sie den Würdigen, denen sie Gott erscheinen lassen will, sondern in veränderter Gestalt, so, wie die Sehenden sie sehen können. Denn* unbegrenzt* von Natur aus und im eigentlichen Sinne* ist nur das Ungeschaffene. Jedes Geschöpf wird* ja* von* Gott,* seinem Schöpfer, begrenzt.*</p><p>Die Heiligung haben sie außerhalb ihrer Natur vom Hl. Geiste empfangen. Durch die göttliche Gnade weissagen sie. Eine Ehe haben sie nicht nötig, denn sie sind nicht sterblich.</p><p>Sie sind Geister, darum sind sie auch an geistigen Orten. Sie werden umschrieben, zwar nicht nach Körperart — sie haben ja ihrer Natur nach keine Körpergestalt noch dreifache Ausdehnung — sondern dadurch, daß sie dort, wo sie hinbefohlen werden, geistig zugegen sind und wirken und nicht zu gleicher Zeit da und dort sein und wirken können.</p><p>Ob sie dem Wesen nach gleich oder voneinander verschieden sind, wissen wir nicht. Gott allein weiß es, er, der sie erschaffen hat, der ja alles weiß. Verschieden jedoch sind sie voneinander durch den Lichtglanz und den Stand, sei es, daß dem Lichtmaß ihr Stand oder dem Stand ihr Lichtanteil entspricht. Wegen der Überordnung des Ranges oder der Natur erleuchten sie sich gegenseitig. Es ist klar, daß die Höheren den Niederen das Licht und die Erkenntnis mitteilen.</p><p>Sie sind stark und bereit zur Erfüllung des göttlichen Willens; dank ihrer schnellen Natur finden sie sich sogleich überall ein, wo der göttliche Wink es befiehlt. Sie beschützen die Erdteile, sie stehen Völkern und Orten vor, wie es ihnen vom Schöpfer aufgetragen ist, sie besorgen unsere Angelegenheiten und helfen uns. Es ist sicher, daß sie nach dem göttlichen Willen und Gebot über uns stehen und beständig um Gott sind.</p><p>Schwer beweglich sind sie zum Bösen, doch nicht unbeweglich. Jetzt sind sie ja unbeweglich, nicht kraft ihrer Natur, sondern kraft der Gnade und dem Eifer, womit sie ausschließlich am Guten festhalten.</p><p>Sie schauen Gott, soweit es ihnen möglich ist, und das ist ihre Nahrung.</p><p>Sie stehen über uns, denn sie sind unkörperlich und frei von jeder körperlichen Leidenschaft, aber wahrlich nicht leidenschaftslos. Denn nur die Gottheit ist leidenschaftslos.</p><p>Sie nehmen die Gestalt an, die Gott, der Herr, befiehlt, und so erscheinen sie den Menschen und enthüllen ihnen die göttlichen Geheimnisse.</p><p>Sie weilen im Himmel, und ihre einzige Arbeit ist, Gott zu preisen und seinem göttlichen Willen zu dienen. Wie der überaus heilige, fromme und große Gottesgelehrte Dionysius der Areopagite sagt,* hat die ganze Theologie,* d. i. die Hl. Schrift,* den himmlischen Wesen neun Namen gegeben. Diese gruppiert der göttliche Lehrer, der uns in die heilige Wissenschaft eingeweiht, in drei dreiteilige Ordnungen. Die erste, sagt er, ist die, die immerdar um Gott ist, und, wie die Überlieferung berichtet, ununterbrochen und unmittelbar mit ihm vereinigt ist,* nämlich die der sechsflügeligen Seraphim, der vieläugigen Cherubim und der hochheiligen Throne.* Die zweite die der Herrschaften, der Gewalten* und der Mächte. * Die dritte* und letzte die der Fürstentümer,* Erzengel und Engel.*</p><p>Einige behaupten nun, sie (die Engel) seien vor jeder Schöpfung ins Dasein getreten. So sagt Gregor der Theologe: „Zuerst denkt Gott die englischen und himmlischen Mächte, und der Gedanke ward Tat.“ Andere [behaupten] jedoch, nach der Erschaffung des ersten Himmels. Daß aber vor der Schöpfung des Menschen, darin sind alle einig. Ich stimme dem Theologen bei. Denn es ziemte sich, daß zuerst die geistige Natur, dann die sinnliche und schließlich der aus beiden bestehende Mensch geschaffen wurde.</p><p>Alle, die behaupten, die Engel seien Schöpfer von was immer für einer Wesenheit, diese sind ein Sprachrohr ihres Vaters, des Teufels. Denn sie sind Geschöpfe, darum sind sie keine Schöpfer. Schöpfer und Vorseher und Erhalter von allem ist Gott, der allein unerschaffen ist, der im Vater und Sohne und Hl. Geiste gepriesen und verherrlicht wird.</p><h3>IV. KAPITEL. Vom Teufel und den Dämonen.</h3><p>Von diesen englischen Mächten hat sich der Fürst der die Erde umgebenden Rangklasse, dem von Gott die Bewachung der Erde übertragen war, der von Natur aus nicht böse, sondern gut und für das Gute geschaffen war, der durchaus keine Spur von Schlechtigkeit vom Schöpfer in sich gehabt, der jedoch das Licht und die Ehre, die ihm der Schöpfer geschenkt, nicht ertragen, durch freie Selbstbestimmung vom Naturgemäßen zum Widernatürlichen gewendet und sich gegen Gott, seinen Schöpfer, erhoben, in der Absicht, sich ihm zu widersetzen. Zuerst ist er vom Guten abgefallen, dann ist er ins Böse geraten. Das Böse ist ja nichts anderes als eine Beraubung des Guten, wie auch die Finsternis eine Beraubung des Lichtes ist. Denn das Gute ist ein geistiges Licht. Ebenso ist auch das Böse eine geistige Finsternis. Als Licht also war er vom Schöpfer geschaffen und gut — denn: „Gott sah alles, was er gemacht hatte, und siehe, es war sehr gut“ —, durch freie Willensentscheidung ist er Finsternis geworden. Mit ihm riß sich eine unendliche Menge der ihm unterstellten Engel los, folgte ihm und fiel mit ihm. Obwohl sie also von derselben Natur sind wie die Engel, sind sie böse geworden, sie haben aus freien Stücken ihren Willen vom Guten zum Bösen gewendet.</p><p>Sie haben keine Macht und Gewalt über jemand, es müßte denn sein, daß sie ihnen von Gott aus Gründen der Heilsordnung eingeräumt würde, wie von Job und wie von den Schweinen im Evangelium geschrieben steht. Erhalten sie aber von Gott die Erlaubnis, dann haben sie die Macht, sie wandeln und ändern sich um und nehmen die Gestalt an, in der sie erscheinen wollen.</p><p>Das Zukünftige wissen zwar weder die Engel Gottes noch die Dämonen. Gleichwohl sagen sie es voraus. Die Engel, wenn Gott es ihnen offenbart und vorherzusagen heißt. Deshalb trifft alles, was sie sagen, ein. Es sagen aber auch die Dämonen voraus, weil sie die fernen Ereignisse teils schauen, teils vermuten. Deshalb lügen sie auch häufig, man darf ihnen nicht glauben, auch wenn sie unter den genannten Umständen oft die Wahrheit sprechen. Sie kennen aber auch die Schriften.</p><p>Jegliche Bosheit ward von ihnen ersonnen und die unreinen Leidenschaften. Zwar wurde ihnen erlaubt, dem Menschen zuzusetzen, zwingen aber können sie niemand. Denn an uns ist es, den Angriff aufzunehmen oder nicht aufzunehmen. Deshalb ist dem Teufel und seinen Dämonen und seinen Anhängern das unauslöschliche Feuer und die ewige Strafe bereitet.</p><p>Man muß aber wissen: Was für die Menschen der Tod ist, das ist für die Engel der Abfall. Denn nach dem Abfall gibt es für sie keine Buße, so wenig wie für die Menschen nach dem Tode.</p><h3>V. KAPITEL. Von der sichtbaren Schöpfung.</h3><p>[Forts. von ] Unser Gott selbst, der in der Dreiheit und Einheit gepriesen wird, „hat den Himmel und die Erde und alles, was darin ist, gemacht“. Alles hat er aus dem Nichtsein ins Sein hervorgebracht, teils aus nicht vorhandenem Stoff, wie Himmel, Erde, Luft, Feuer, Wasser, teils aus dem von ihm geschaffenen, wie Tiere, Pflanzen, Samen. Denn diese sind aus Erde, Wasser, Luft und Feuer auf den Befehl des Schöpfers entstanden.</p><h3>VI. KAPITEL. Vom Himmel.</h3><p>Himmel ist die Umfassung der sichtbaren und unsichtbaren Geschöpfe. Denn in seinem Bereiche sind die geistigen Mächte der Engel und alle sinnlichen Dinge umschlossen und umgrenzt. Nur das göttliche Wesen ist unumschrieben, es erfüllt alles, umfaßt alles und umgrenzt alles, da es über allem ist und alles geschaffen hat.</p><p>Da nun die Schrift von einem Himmel und einem „Himmel des Himmels“ und von „Himmeln der Himmel“ spricht, und der selige Paulus sagt, er sei bis in den dritten Himmel entrückt worden, so behaupten wir, daß wir bei der Entstehung des Weltalls* den* Himmel geschaffen bekamen, den die außenstehenden (= heidnischen) Weisen, die sich die Lehre des Moses angeeignet, die sternlose Sphäre nennen. Außerdem nannte Gott auch noch das Firmament Himmel. Diesen ließ er inmitten des Wassers entstehen und bestimmte ihn als Scheide zwischen dem Wasser ober dem Firmament und zwischen dem Wasser unter dem Firmament. Der göttliche Basilius, aus der Hl. Schrift belehrt, nennt dessen Natur fein wie Rauch. Andere aber [nennen] sie wässrig, da sie sich inmitten der Wasser befindet, andere aus den vier Elementen [zusammengesetzt], andere einen fünften, von den vier [Elementen] verschiedenen Körper.</p><p>Einige meinten nun, der Himmel umfasse das All im Kreise, sei kugelförmig und auf allen Seiten der oberste Teil, der von ihm umfaßte Zwischenraum aber sei der untere Teil. Die leichten und flüchtigen Körper hätten vom Schöpfer den oberen Raum bekommen, die schweren, abwärtsstrebenden aber den unteren Raum, d. i. den Zwischenraum. Das leichtere, aufwärtsstrebende Element nun ist das Feuer, das, wie sie behaupten, gleich nach dem Himmel seinen Platz hat. Dies nennen sie den Äther, das aber, was weiter abwärts liegt, die Luft. Die Erde und das Wasser jedoch seien, da schwerer und mehr abwärtsstrebend, im Zwischenraum befestigt, so daß einander gegenüber unten die Erde und das Wasser ist — das Wasser ist leichter als die Erde, darum ist es beweglicher als sie —, oben aber ringsum auf allen Seiten wie ein Umwurf die Luft, und um die Luft auf allen Seiten der Äther, außerhalb allem jedoch im Umkreis der Himmel.</p><p>Weiter behaupten sie, der Himmel bewege sich kreisförmig und halte das, was sich innerhalb befindet, zusammen, und so bleibe es fest und falle nicht.</p><p>Ferner nehmen sie sieben Zonen des Himmels an, die eine höher als die andere. Er selbst, sagen sie, sei von sehr feiner Natur wie Rauch, und in jeder Zone sei einer der Planeten. Es gebe nämlich, so behaupten sie, sieben Planeten: Sonne, Mond, Jupiter, Merkur, Mars, Venus und Saturn. Die Venus, sagen sie, sei bald Morgen-, bald Abendstern. Planeten aber nannten sie diese, weil sie eine dem Himmel entgegengesetzte Bewegung machen. Denn während der Himmel und die übrigen Gestirne sich von Aufgang gegen Untergang bewegen, haben diese allein ihre Bewegung von Untergang gegen Aufgang. Das werden wir am Mond bemerken, der jeden Abend ein wenig rückwärts geht.</p><p>Alle, die den Himmel für kugelförmig erklärten, schreiben ihm gleichen Abstand und Entfernung von der Erde zu, sowohl von oben, wie nach den Seiten und von unten. Von unten und nach den Seiten, sage ich, soweit unsere sinnliche Wahrnehmung in Betracht kommt. Denn, wie aus dem Gesagten folgt, nimmt der Himmel von allen Seiten den oberen Raum und die Erde den unteren ein. Und sie sagen, der Himmel drehe sich im Kreise um die Erde und trage durch seine äußerst schnelle Bewegung Sonne, Mond und die Sterne mit herum, und, wenn die Sonne über der Erde sei, dann sei es hier Tag, unter der Erde aber Nacht. Wenn jedoch die Sonne unter die Erde hinabsteige, dann sei es hier Nacht, dort aber Tag.</p><p>Andere dagegen stellten sich den Himmel als eine Halbkugel vor, weil der göttliche David sagt: „Der den Himmel ausspannt wie ein Fell“, was soviel als Zelt bedeutet, und der selige Isaias: „Der den Himmel befestigt wie ein Gewölbe “, und weil die Sonne, der Mond und die Sterne bei ihrem Untergang die Erde von Westen gegen Norden umkreisen und so wiederum zum Aufgang gelangen. Doch, ob so oder so, alles ist durch den göttlichen Befehl geschaffen und begründet und hat den göttlichen Willensbeschluß zur unerschütterlichen Grundlage. „Denn er sprach, und sie wurden; er befahl, und sie wurden geschaffen. Er gab ihnen Bestand für alle Ewigkeit; er gab ein Gesetz und übertritt es nicht.“</p><p>„Himmel des Himmels“ ist also der erste Himmel, der ober dem Firmamente ist. Siehe da, zwei Himmel! Denn auch das Firmament nannte Gott Himmel. Es pflegt aber die göttliche Schrift auch die Luft Himmel zu nennen, weil sie oben gesehen wird. Denn sie sagt: „Preiset ihn, all ihr Vögel des Himmels “, d. i. der Luft. Die Luft ist ja der Aufenthaltsort der Vögel, und nicht der Himmel. Siehe da, drei Himmel! Von diesen sprach der göttliche Apostel. Willst du aber auch die sieben [Planeten-] Zonen als sieben Himmel fassen, so tut das dem „Wort der Wahrheit “ durchaus keinen Eintrag. Es pflegt auch die hebräische Sprache statt [der Einzahl] der Himmel die Mehrzahl: die Himmel zu gebrauchen. Indem sie also Himmel des Himmels sagen wollte, sagte sie Himmel der Himmel, was Himmel des Himmels, der [Himmel] ober dem Firmament, bedeutet, und [sie sagte] „die Wasser ober den Himmeln“, indem die Luft und das Firmament oder die sieben Zonen des Firmaments oder das Firmament nach dem hebräischen Sprachgebrauch mit dem Plural Himmel bezeichnet werden.</p><p>Alle geschaffenen Dinge unterliegen naturgemäß der Vergänglichkeit, auch die Himmel.. Durch die Gnade Gottes werden sie jedoch erhalten und bewahrt. Nur das göttliche Wesen ist seiner Natur nach ohne Anfang und ohne Ende. Darum heißt es auch: „Sie gehen unter, du aber bleibst.“ Doch werden die Himmel nicht vollständig vergehen. Denn sie werden altern, und wie ein Mantel werden sie aufgerollt und geändert werden, und es wird ein neuer Himmel und eine neue Erde sein.</p><p>Der Himmel ist vielmal größer als die Erde. Nach dem Wesen des Himmels zu forschen, ist jedoch nicht nötig, denn es ist für uns unerkennbar.</p><p>Niemand soll die Himmel oder die Himmelslichter für beseelt halten, denn sie sind unbeseelt und empfindungslos. Deshalb ruft die göttliche Schrift, wenn sie auch sagt: „Freuen sollen sich die Himmel, und frohlocken soll die Erde “, die Engel im Himmel und die Menschen auf der Erde zur Freude auf. Es weiß die Schrift zu personifizieren und vom Unbeseelten gleichwie von Beseeltem zu sprechen. Z. B.: „Das Meer schaute und floh; der Jordan wandte sich zurück.“ Und: „Was ist dir, o Meer, daß du fliehst? Und dir, o Jordan, daß du dich zurückwendest?“ Auch Berge und Hügel werden um den Grund ihres Hüpfens gefragt. So pflegen auch wir zu sagen: Die Stadt versammelte sich. Damit wollen wir nicht die Häuser, sondern die Bewohner der Stadt bezeichnen. Und: „Die Himmel erzählen die Herrlichkeit Gottes.“ Sie geben zwar keinen für sinnliche Ohren vernehmbaren Laut von sich, aber durch die Größe, die ihnen eigen ist, stellen sie uns die Macht des Schöpfers dar. Wir betrachten ihre Schönheit und preisen den Schöpfer als den trefflichsten Künstler.</p><h3>VII. KAPITEL. Von Licht, Feuer, Leuchtkörpern, Sonne, Mond und Sternen.</h3><p>Das Feuer ist eines der vier Elemente, leicht und mehr aufwärtsstrebend als die andern, brennend und leuchtend zugleich, am ersten Tage vom Schöpfer geschaffen. Es sagt ja die göttliche Schrift: „Und Gott sprach: Es werde Licht! Und es ward Licht.“ Das Feuer ist nicht, wie einige sagen, etwas anderes als das Licht. Andere behaupten, es (═ das Licht) sei das kosmische Feuer über der Luft, das sie Äther nennen. Im Anfang also oder am ersten Tag schuf Gott das Licht, den Schmuck und die Zierde der ganzen sichtbaren Schöpfung. Denn, nimm das Licht weg, und alles bleibt in der Finsternis unerkennbar, es kann seine Schönheit nicht zeigen. „Es nannte aber Gott das Licht Tag, die Finsternis aber nannte er Nacht.“ Finsternis ist keine Wesenheit (Substanz), sondern ein Akzidens, denn sie ist Beraubung des Lichtes. Die Luft besitzt ja nicht in ihrer Wesenheit das Licht. Gerade das Lichtberaubtsein der Luft also nannte Gott Finsternis. Und nicht die Wesenheit der Luft ist Finsternis, sondern die Beraubung des Lichtes. Dies zeigt doch viel mehr ein Akzidens als eine Wesenheit an. Es ward aber nicht zuerst die Nacht, sondern der Tag genannt. Daher ist zuerst der Tag und danach die Nacht. Es folgt also die Nacht dem Tag, und von Beginn des einen Tages bis zum andern ist ein Tag und eine Nacht (═ ein Tag). Es sagt ja die Schrift: „Und es ward Abend und es ward Morgen, ein Tag.“</p><p>In den drei Tagen also, da auf den göttlichen Befehl das Licht sich ausbreitete und zusammenzog, ward der Tag und die Nacht. Am vierten Tage aber schuf Gott die große Leuchte oder die Sonne, auf daß sie den Tag beherrsche und regiere — denn durch sie wird der Tag bewirkt; Tag ist es nämlich, wenn die Sonne über der Erde ist, und eine Tagesdauer ist der Lauf der Sonne über der Erde vom Aufgang bis zum Untergang —, und die kleinere Leuchte oder den Mond und die Sterne, um die Nacht zu beherrschen und zu regieren und sie zu erleuchten. Nacht ist es, wenn die Sonne unter der Erde ist, und eine Nachtdauer ist der Lauf der Sonne unter der Erde vom Untergang bis zum Aufgang. Der Mond und die Sterne also sind bestimmt, die Nacht zu erleuchten; nicht als ob sie bei Tag stets unter der Erde wären — es sind ja auch bei Tag Sterne am Himmel über der Erde —, aber die Sonne verbirgt diese zugleich und den Mond durch ihren helleren Glanz und läßt sie nicht scheinen.</p><p>Diesen Leuchten hat Gott das erstgeschaffene Licht (═ Urlicht) gegeben, nicht als ob es ihm an anderem Licht gebrochen, sondern damit jenes Licht nicht unnütz bleibe. Denn Leuchte (Leuchtkörper) ist nicht das Licht selbst, sondern ein Lichtträger.</p><p>Zu diesen Leuchten zählen die sieben Planeten. Sie sollen eine dem Himmel entgegengesetzte Bewegung haben. Darum hat man sie Planeten genannt. Denn der Himmel, sagt man, bewege sich von Aufgang gegen Untergang, die Planeten dagegen von Untergang gegen Aufgang, der Himmel aber trage durch seine schnellere Bewegung die sieben Planeten mit sich. Die Namen der sieben Planeten sind folgende: Mond, Merkur, Venus, Sonne, Mars, Jupiter, Saturn. In jeder Himmelszone aber befinde sich einer von den sieben Planeten:</p><p>In der ersten oder der obersten der Saturn. ♄ In der zweiten der Jupiter. In der dritten der Mars. ♂ In der vierten die Sonne. ☌ In der fünften die Venus. ♀ In der sechsten der Merkur. ☿ In der siebten und untersten der Mond. ☾</p><p>Sie nehmen unaufhörlich ihren Lauf ein, wie ihn der Schöpfer ihnen bestimmt hat, und so, wie er sie gegründet hat — nach dem Worte des göttlichen David: „Mond und Sterne, die du gegründet hast.“ Denn durch den Ausdruck: „Du hast gegründet“ bezeichnete er das Feste und Unveränderliche der ihnen von Gott gegebenen Ordnung und Stellung. Denn er bestimmte sie „zu Zeiten und Zeichen, zu Tagen und Jahren “. Durch die Sonne werden nämlich die vier Jahreszeiten bestimmt. Die erste ist der Frühling. Denn in ihr hat Gott alles geschaffen. Das beweist der Umstand, daß in ihr bis heute noch das Sprossen der Blüten vor sich geht. Sie ist auch die Zeit der Tag- und Nachtgleiche. Sie macht sowohl den Tag wie die Nacht zwölf Stunden lang. Sie wird durch den mittleren Aufgang der Sonne bestimmt, ist gemäßigt, blutmehrend, warm und feucht, hält sich in der Mitte zwischen Winter und Sommer, ist wärmer und trockener als der Winter, kälter und feuchter aber als der Sommer. Diese Zeit erstreckt sich vom 21. März bis zum 24. Juni. Dann, wenn sich der Aufgang der Sonne gegen die nördlicheren Teile erhebt, folgt die Sommerzeit. Sie hält die Mitte zwischen dem Frühling und dem Herbst: vom Frühling hat sie die Wärme, vom Herbst aber die Trockenheit. Denn sie ist warm und trocken und vermehrt die gelbe Galle. Sie hat den längsten Tag von fünfzehn Stunden und die kürzeste Nacht mit einer Dauer von neun Stunden. Sie reicht vom 24. Juni bis zum 25. September. Dann, wenn die Sonne wieder zum mittleren Aufgang zurückkehrt, löst die Herbstzeit die Sommerzeit ab, sie hält gewissermaßen die Mitte zwischen Kälte und Wärme, Trockenheit und Feuchtigkeit, und sie hält sich in der Mitte zwischen Sommer und Winter: vom Sommer hat sie die Trockenheit und vom Winter die Kälte. Denn sie ist kalt und trocken und vermehrt die schwarze Galle. Sie ist wiederum die Zeit der Tag- und Nachtgleiche, an ihr hat sowohl der Tag wie die Nacht zwölf Stunden. Sie reicht vom 25. September bis zum 25. Dezember. Steigt aber die Sonne zum kleinsten und niedrigsten oder zum südlichen Aufgang hinab, dann kommt die Winterszeit. Sie ist kalt und feucht und hält die Mitte zwischen der Herbst- und Frühlingszeit: von der Herbstzeit hat sie die Kälte, von der Frühlingszeit besitzt sie die Feuchtigkeit. Sie hat den kürzesten Tag von neun Stunden und die längste Nacht von fünfzehn Stunden. Sie vermehrt das Phlegma. Sie reicht vom 25. Dezember bis zum 21. März. Weise hat der Schöpfer vorgesorgt, daß wir nicht durch den Übergang von der höchsten Kälte oder Wärme oder Nässe oder Dürre zum äußersten Gegenteil in schwere Krankheit fallen. Als gefährlich erkennt nämlich die Vernunft die plötzlichen Übergänge.</p><p>So bewirkt also die Sonne die Jahreszeiten und durch sie das Jahr, ebenso die Tage und die Nächte: erstere, indem sie aufgeht und über der Erde steht, letztere, indem sie unter die Erde sinkt. Und sie überläßt und übergibt den andern das Leuchten, dem Mond und den Sternen das Licht.</p><p>Sie sagen aber auch, es seien am Himmel zwölf Sternbilder, die eine der Sonne und dem Monde und den fünf andern Planeten entgegengesetzte Bewegung haben, und durch die zwölf Sternbilder gingen die sieben [Planeten]. Die Sonne nun vollendet in jedem Sternbild einen Monat und durchwandert in den zwölf Monaten die zwölf Sternbilder. Die Namen der zwölf Sternbilder und deren Monate sind folgende:</p><p>Der Widder ♈ nimmt die Sonne am 21. März auf. Der Stier ♉ am 23. April. Die Zwillinge ♊ am 24. Mai. Der Krebs ♋ am 24. Juni. Der Löwe ♌ am 25. Juli. Die Jungfrau ♍ am 25. August. Die Wage ♎ am 25. September. Der Skorpion ♏ am 25. Oktober. Der Schütze ♐ am 25. November. Der Steinbock ♑ am 25. Dezember. Der Wassermann ♒ am 25. Januar. Die Fische ♓ am 24. Februar.</p><p>Der Mond ☾ aber durchwandert in jedem Monat die zwölf Sternbilder, weil er weiter unten ist und diese schneller durchläuft. Machst du einen Kreis in einem andern Kreis, so wird der innere Kreis als kleiner erscheinen. Ebenso ist auch der Lauf des Mondes, der weiter unten ist, kleiner und wird schneller vollendet.</p><p>Die Heiden behaupten nun, durch den Auf- und Untergang und das Zusammentreffen dieser Gestirne, der Sonne und des Mondes würden alle unsere Angelegenheiten gelenkt — damit beschäftigt sich die Astrologie —, wir jedoch erklären sie zwar für Zeichen von Regen und Regenmangel, Kälte und Wärme, Feuchtigkeit und Trockenheit, von Winden u. dgl., aber durchaus nicht von unseren Handlungen. Wir, die vom Schöpfer einen freien Willen erhalten haben, sind ja Herren unseres Handelns. Denn wenn wir alles infolge der Bewegung der Sterne tun, dann tun wir das, was wir tun, gezwungen. Was aber gezwungen geschieht, ist weder Tugend noch Schlechtigkeit. Besitzen wir jedoch weder Tugend noch Schlechtigkeit, dann verdienen wir weder Belobungen noch Strafen. Es wird aber auch Gott als ungerecht erscheinen, wenn er den einen Güter, den anderen Drangsale gibt. Aber auch Gottes Leitung und Vorsehung werden seine Geschöpfe nicht erfahren, wenn alles Tun und Handeln aus Zwang geschieht. Auch die Vernunft wird bei uns überflüssig sein. Denn sind wir über keine Handlung Herr, dann ist unser Überlegen überflüssig. Die Vernunft ist uns aber sicherlich zum Zwecke der Überlegung gegeben. Darum hat alles Vernünftige auch einen freien Willen.</p><p>Wir sagen: Sie (═ die Gestirne) sind nicht Ursachen von irgend etwas, das geschieht, weder von der Entstehung dessen, was entsteht, noch vom Untergang dessen, was vergeht, sondern vielmehr Anzeichen von Regen und Luftveränderung. Vielleicht könnte aber jemand sagen, sie seien auch von Kriegen zwar nicht Ursachen, aber doch Zeichen. Auch die Beschaffenheit der Luft, die von Sonne, Mond und den Sternen herrühre, bewirke so oder anders verschiedene Temperamente, Stimmungen und Zustände. Die Stimmungen gehören zu dem, was in unserer Macht liegt. Denn sie stehen, wie sich gebührt, unter der Herrschaft und Leitung der Vernunft.</p><p>Es erscheinen aber oft auch Kometen, gewisse Zeichen, die den Tod von Königen ankündigen. Diese gehören nicht zu den von Anfang geschaffenen Gestirnen (Urgestirnen), sondern sie entstehen durch den göttlichen Befehl genau zur festgesetzten Zeit und lösen sich wieder auf. Es befand sich ja auch der Stern, der zur Zeit der unsertwegen im Fleische erfolgten, menschenfreundlichen und heilbringenden Geburt des Herrn von den Magiern gesehen ward, nicht unter den am Anfang geschaffenen Gestirnen. Das erhellt daraus, daß er seinen Lauf bald von Aufgang nach Untergang, bald von Norden nach Süden nahm, daß er bald sich verbarg, bald sich zeigte. Denn das liegt nicht in der Ordnung oder Natur der Gestirne.</p><p>Man muss wissen, daß der Mond von der Sonne beleuchtet wird, nicht als hätte Gott keine Mittel und Wege gewußt, um ihm eigenes Licht zu gewähren, nein, es sollte Harmonie und Ordnung, wonach der eine herrscht, der andere beherrscht wird, in die Schöpfung gelegt werden, und wir sollten lernen, einander mitzuteilen und zu geben und Untertan zu sein, zuerst dem Schöpfer und Bildner, Gott dem Herrn, dann aber den von ihm bestellten Herrschern, und nicht lange zu fragen: Warum herrscht der, ich aber nicht?, sondern alles, was von Gott ist, in dankbarer, guter Gesinnung anzunehmen.</p><p>Die Sonne und der Mond verfinstern sich. Sie beweisen dadurch den Unverstand derer, die die Schöpfung mehr als den Schöpfer verehren. Sie lehren, daß sie wandelbar und veränderlich sind. Alles Wandelbare aber ist nicht Gott, denn alles Wandelbare ist seiner Natur nach vergänglich.</p><p>Die Sonne verfinstert sich, wenn der Mondkörper wie eine Wand dazwischen tritt, Schatten wirft und kein Licht uns zukommen läßt. Die Größe, in der der Mondkörper erscheint, der die Sonne verbirgt, erhält auch die Verfinsterung. Wundere dich nicht, wenn der Mondkörper kleiner ist! Denn auch die Sonne gilt manchen als vielmal größer wie die Erde, den heiligen Vätern aber als der Erde gleich, und doch verbirgt oft eine kleine Wolke oder ein kleiner Hügel oder eine Wand dieselbe.</p><p>Die Verfinsterung des Mondes tritt durch den Schattenwurf der Erde ein, wenn der Mond den fünfzehnten Tag erreicht und sich ihr gegenüber in der Höhenmitte [des Erdschattens] zeigt — die Sonne unter der Erde, der Mond aber über der Erde. Denn die Erde wirft einen Schatten, und es kann das Sonnenlicht den Mond nicht beleuchten, darum verfinstert er sich.</p><p>Man muß ferner wissen, daß der Mond vom Schöpfer als Vollmond, d. h. so, wie er am fünfzehnten Tage ist, geschaffen wurde. Denn es ziemte sich, daß er vollkommen geschaffen wurde. Am vierten Tage ward, wie gesagt, die Sonne geschaffen. Er ist also der Sonne um elf Tage voraus. Denn vom vierten Tage bis zum fünfzehnten sind elf. Deshalb haben auch in einem Jahre die zwölf Mondmonate elf Tage weniger als die zwölf Sonnenmonate. Denn die Sonnenmonate haben 365 1/4 Tage. Nimmt man nun das ein Viertel in je vier Jahren zusammen, so macht das einen Tag aus, der Schalttag heißt. Und jenes Jahr hat 366 Tage. Die Mondjahre aber haben 354 Tage. Denn der Mond wächst von der Zeit an, da er geboren oder erneuert wird, bis er 14 3/4 Tage alt ist, er nimmt allmählich bis zu 29 1/2 Tagen ab und ist dann völlig unbeleuchtet. Nun nimmt er die Sonne wieder auf und wird wiedergeboren und erneuert — er erinnert uns an unsere Auferstehung. Jedes Jahr also zahlt er die elf Tage an die Sonne ab. Daher ist in je drei Jahren bei den Hebräern ein Schaltmonat, und es zeigt sich, daß jenes Jahr infolge der Zulage von den [dreimal] elf Tagen dreizehn Monate hat.</p><p>Es ist klar, daß die Sonne, der Mond und die Gestirne zusammengesetzt sind und gemäß ihrer Natur der Vergänglichkeit unterliegen. Ihre Natur jedoch kennen wir nicht. Einige behaupten nun, das Feuer sei außerhalb eines Stoffes unsichtbar. Daher verschwindet es auch, wenn es erlöscht. Andere aber sagen, es verwandle sich beim Erlöschen in Luft.</p><p>Der Tierkreis bewegt sich schief, er ist in zwölf Abschnitte geteilt, die Sternbilder heißen. Das Sternbild hat drei Zehnteile, dreißig Grade, der Grad hat sechzig Minuten. Es hat also der Himmel 360 Grade, die Halbkugel über der Erde 180 Grade und die unter der Erde 180.</p><p><em>Planetenhäuser.</em></p><p>Widder und Skorpion [sind Häuser] des Mars, Stier und Wage der Venus, Zwillinge und Jungfrau des Merkur, Krebs [ist Haus] des Mondes, Löwe der Sonne, Schütze und Fische [sind Häuser] des Jupiter, Steinbock und Wassermann des Saturn.</p><p><em>Höhen.</em></p><p>Der Widder [hat die Höhe] der Sonne, der Stier die des Mondes, der Krebs die des Jupiter, die Jungfrau die des Mars, die Wage die des Saturn, der Steinbock die des Merkur, die Fische [haben die Höhe] der Venus.</p><p><em>Die Gestalten (Phasen) des Mondes.</em></p><p>Ein Zusammentreffen (eine Konjunktion) [des Mondes mit der Sonne findet statt], wenn er in demselben Grade steht, in dem die Sonne ist. Er wächst, wenn er 15 Grade von der Sonne absteht. Er geht auf, wenn er sichelförmig erscheint, zweimal, sobald er 60 Grade entfernt ist. Er ist zweimal halbvoll bei einer Entfernung von 90 Grad, zweimal überhalbvoll bei einer Entfernung von 120 Grad, zweimal fast voll und fast ganz leuchtend bei einer Entfernung von 150 Grad, Vollmond bei einer Entfernung von 180 Grad. „Zweimal“, sagten wir, nämlich einmal beim Zunehmen und einmal beim Abnehmen. In 2 1/2 Tagen durchwandert der Mond jedes Sternbild.</p><h3>VIII. KAPITEL. Von der Luft und den Winden.</h3><p>* Die Luft ist ein* sehr feines* Element,* feucht und warm, schwerer als das Feuer, aber leichter als die Erde und die Wasser, Grund des Atemholens und der Stimme, farblos, d. h. von Natur aus ohne Farbe, durchsichtig, durchscheinend, denn sie nimmt das Licht auf. Sie dient dreien unserer Sinne. Denn durch sie sehen, hören, riechen wir. Sie nimmt Wärme und Kälte, Trockenheit und Feuchtigkeit an, und all ihre örtlichen Bewegungen sind: aufwärts, abwärts, hinein, heraus, nach rechts und links, und die Kreisbewegung.</p><p>Von Haus aus besitzt sie kein Licht, sondern wird von Sonne, Mond und Sternen und vom Feuer beleuchtet. Und das ist es, was die Schrift sagt: „Finsternis war über dem Abgrund.“ Damit will sie zeigen, daß die Luft das Licht nicht von Haus aus besitze, sondern die Wesenheit des Lichtes eine andere sei.</p><p>Wind ist Luftbewegung oder* Wind ist ein Luftstrom, der entsprechend dem Wechsel der Orte, von denen er kommt, seine Namen ändert.*</p><p>Die Luft hat auch ihren Ort. Denn Ort eines jeden Körpers ist dessen Umgebung. Was aber umgibt die Körper außer Luft? Es gibt jedoch verschiedene Orte, woher die Bewegung der Luft kommt, von denen auch die Winde ihre Namen haben. Im ganzen sind es zwölf. Man sagt,* die Luft sei ein erloschenes Feuer oder ein Dunst erhitzten Wassers. Es ist daher die Luft ihrer Natur nach warm. Sie wird jedoch durch ihre Annäherung an das Wasser und die Erde abgekühlt, so daß ihre unteren Teile kalt, die oberen aber warm sind.*</p><p>Winde wehen: Vom sommerlichen Aufgang [der Sonne] der Kaikias oder auch Meses (═ der Nordostwind), vom äquinoktialischen Aufgang der Ostwind, vom winterlichen Aufgang der Südostwind, vom winterlichen Untergang der Südwestwind, vom äquinoktialischen Untergang der Westwind, vom sommerlichen Untergang der Agrestes oder Olympias oder auch Japyx (═ der Nordwestwind). Dann der Süd- und Nordwind, die einander entgegenwehen. Zwischen Nord- und Nordostwind aber der Nordnordostwind, zwischen Südost- und Südwind der Phoinikias, der sog. Euronotos (═ der Südsüdostwind), zwischen dem Nord- und Nordwestwind aber der Thraskias, von den Umwohnern Kerkios genannt (═ der Nordnordwestwind).</p><p>Völker wohnen: An den Grenzen [der Erde] gegen Osten die Baktrianer, gegen Südosten die Indier, gegen Südsüdost [liegt] das Rote Meer und Äthiopien; gegen Südsüdwesten [wohnen] die Garamanten jenseits (═ südlich) der Syrte, gegen Südwesten die Äthiopen und westlichen Mauren, gegen Westen [sind] die Säulen [des Herkules] und die Anfänge von Libyen und Europa, gegen Nordwesten [ist] Iberien, jetzt Spanien, gegen Nordnordwesten [wohnen] die Kelten und angrenzende Völker, gegen Norden die hyperthrakischen Skythen, gegen Nordnordost [sind] der Pontus, die Mäotis und die Sarmaten, gegen Nordosten das Kaspische Meer und die Saken.</p><h3>IX. KAPITEL. Von den Wassern.</h3><p>Auch das Wasser ist eines der vier Elemente, ein überaus schönes Gottesgebilde. Das Wasser ist ein nasses und kaltes, schweres und abwärtsstrebendes, leicht zerfließendes Element. Seiner erwähnt die göttliche Schrift, wenn sie sagt: „Und Finsternis war über dem Abgrund, und der Geist Gottes schwebte über dem Wasser.“ Abgrund ist nichts anderes als viel Wasser, dessen Ende für Menschen unerreichbar ist. Am Anfang überflutete das Wasser die ganze Erde. Zuerst schuf Gott das Firmament, welches das Wasser ober dem Firmament vom Wasser unter dem Firmament schied. Denn es ward inmitten des Abgrunds der Wasser durch den Befehl des Herrn festgemacht. Deshalb sprach ja Gott, es solle eine Feste werden, und es geschah. Weshalb aber brachte Gott ober dem Firmamente Wasser an? Wegen der äußerst heißen Glut der Sonne und des Äthers. Denn gleich nach dem Firmament ist der Äther ausgebreitet. Auch die Sonne mit dem Mond und den Sternen sind am Firmament. Läge nicht Wasser darüber, so würde vor Hitze das Firmament verbrennen.</p><p>Sodann befahl Gott, die Wasser sollen sich sammeln an* einen* Sammlungsort. Der Ausdruck* „ein* Sammlungsort“ bedeutet nicht, daß sie sich an* einem* Orte sammelten. Denn sieh, hernach heißt es: „Und die Ansammlungen der Wasser nannte er Meere.“ Nein, der Ausdruck zeigt an, daß die Wasser auf einmal für sich, getrennt von der Erde, entstanden. Es sammelten sich also die Wasser an ihre Sammlungsorte, und es erschien das Trockene. Daher die zwei Meere, die Ägypten umgeben, denn dieses liegt zwischen zwei Meeren. Es sammelten sich verschiedene Meere, die Berge, Inseln, Vorgebirge und Häfen haben und verschiedene Busen, Flach- und Steilküsten umgeben. Flachküste (Strand) heißt die sandige [Küste], Steilküste die felsige, an der das Meer tief ist, die gleich am Anfang eine Tiefe hat. In gleicher Weise [sammelte sich] auch das gegen Aufgang gelegene Meer, welches das Indische heißt, und das nordische, welches das Kaspische heißt. Auch die Seen sammelten sich von da an.</p><p>Der Ozean umkreist wie ein Fluß die ganze Erde. Von ihm hat, wie mir scheint, die göttliche Schrift gesagt: „Ein Fluß geht aus vom Paradiese.“ Er hat trinkbares und süßes Wasser. Er liefert das Wasser den Meeren. Ist dieses eine Zeitlang in den Meeren und steht es unbewegt, dann wird es bitter. Denn die Sonne und die Wasserhosen ziehen das Feinere in die Höhe. Daher bilden sich auch die Wolken und entstehen die Regengüsse. Mittels der Durchseihung wird das Wasser süß.</p><p>Dieser [Ozean] teilt sich auch in vier Anfänge oder in vier Flüsse. Der Name des ersten ist Phison, d. i. der indische Ganges. Der Name des zweiten ist Gehon, d. i. der Nil, der von Äthiopien nach Ägypten hinabfließt. Der Name des dritten ist Tigris und der Name des vierten Euphrat. Es gibt aber auch sehr viele und sehr große andere Flüsse, wovon die einen sich in das Meer entleeren, die andern auf der Erde verschwinden. Darum ist die ganze Erde durchlöchert und unterwühlt, sie hat gleichsam Adern, durch die sie vom Meere die Wasser aufnimmt, die Quellen ergießt. Je nach der Beschaffenheit der Erde also wird auch das Wasser der Quellen. Denn durch die Erde wird das Meerwasser geseiht und geläutert und wird so süß. Ist aber der Ort, wo die Quelle entspringt, etwa bitter oder salzig, so quillt je nach der Erde auch das Wasser hervor. Oft aber wird das Wasser, wenn es eingeengt ist und mit Gewalt hervorbricht, warm. Daher kommen die von Natur warmen Wasser.</p><p>Durch den göttlichen Befehl entstanden also Höhlungen in der Erde, und so sammelten sich die Wasser an ihre Sammlungsorte. Dadurch sind auch die Berge entstanden. Dem Urwasser nun befahl Gott, lebendes Wesen hervorzubringen. Denn durch das Wasser und den Hl. Geist, der am Anfang über den Wassern schwebte, wollte er den Menschen erneuern. Das sagte nämlich der göttliche Basilius. Es (═ das Urwasser) brachte Tiere hervor, kleine und große, Meerungeheuer, Drachen, Fische, die in Wassern schwimmen, und Flugtiere. Durch die Flugtiere also stehen das Wasser und die Erde und die Luft miteinander in Verbindung. Denn aus den Wassern sind diese entstanden, auf der Erde aber leben sie und in der Luft fliegen sie. Ein ganz vortreffliches und ungemein nützliches Element ist das Wasser, es reinigt von Schmutz, nicht bloß von körperlichem, sondern auch von seelischem, wenn es die Gnade des Geistes aufnimmt.</p><p><em>Von den Meeren.</em></p><p>Das Ägäische Meer nimmt der Hellespont auf, der bei Abydus und Sestus aufhört. Dann die Propontis, die bei Chalzedon und Byzanz aufhört; dort ist die Enge, mit der der Pontus beginnt. Dann der Mäotische See (═ das Asowsche Meer). Ferner am Anfang von Europa und Libyen das Iberische Meer, von den Säulen [des Herkules] bis zu den Pyrenäen; das Ligurische Meer bis zu den Grenzen Tyrrheniens; das Sardinische, das sich jenseits von Sardinien bis hinab gegen Libyen erstreckt; das Tyrrhenische, das bis Sizilien reicht und am äußersten Ende Liguriens beginnt; dann das Libysche, dann das Kretische, Sizilische, Jonische und das Adriatische, das sich aus dem Sizilischen Meere ergießt, das man auch Korinthischen Meerbusen oder Alkyonisches Meer nennt. Das vom Sunischen und Skilläischen [Meer] umfaßte Meer ist das Saronische. Dann das Myrtoische und Ikarische, in dem auch die Cykladen sind. Dann das Karpathische, Pamphylische und Ägyptische. Die Fahrt an Europa vorbei von der Mündung des Flusses Tanais (Don) bis zu den Säulen des Herkules beträgt 609 709 Stadien; die an Libyen (Afrika) vorbei von Tingis bis zur Kanopischen (oder westlichen) Nilmündung 209 252 Stadien; die Fahrt an Asien vorbei von Kanopus bis zum Flusse Tanais nebst den Busen 4111 Stadien. Zusammen beträgt die Küstenausdehnung unserer bewohnten Erde einschließlich der Busen 1 309 072 Stadien.</p><h3>X. KAPITEL. Von der Erde und dem, was sie hervorgebracht.</h3><p>Die Erde ist eines der vier Elemente, trocken und kalt, schwer und unbeweglich, von Gott am ersten Tage aus dem Nichtsein ins Sein gerufen. Denn es heißt: „Im Anfang schuf Gott den Himmel und die Erde.“ Ihren Sitz und ihre Grundlage aber hat kein Mensch angeben können. Die einen behaupten, sie sei über Wassern gegründet und befestigt, wie der göttliche David sagt: „Der die Erde über Wassern befestigt “, die andern: über der Luft. Ein anderer aber sagt: „Der die Erde über dem Nichts gegründet hat.“ Und wiederum sagt der göttlich redende David gleichsam in der Person des Schöpfers: „Ich habe ihre Säulen festgestellt.“ Er hat die Kraft, die sie zusammenhält, Säulen genannt. Das Wort aber: „Er hat sie über den Meeren gegründet “, zeigt an, daß die Natur des Wassers die Erde von allen Seiten umfließt. Ob wir nun zugeben, daß sie auf sich selbst oder über der Luft oder über Wassern oder über dem Nichts gegründet ist, die fromme Gesinnung dürfen wir nicht aufgeben, sondern müssen bekennen, daß alles zumal durch die Macht des Schöpfers beherrscht und zusammengehalten wird.</p><p>Im Anfang also war sie (die Erde), wie die göttliche Schrift sagt, von Wassern bedeckt und sie war nicht hergerichtet, d. h. sie hatte keinen Schmuck. Auf Gottes Befehl aber entstanden die Wasserbehälter, und dann traten die Berge ins Dasein, und auf den göttlichen Befehl erhielt sie ihren Schmuck, sie ward mit mannigfachen Kräutern und Pflanzen geziert. In diese legte der göttliche Befehl die Kraft, sich zu vermehren, sich zu nähren, Samen zu bilden, d. h. ihresgleichen zu erzeugen. Auf Befehl des Schöpfers brachte sie (═ die Erde) aber auch allerlei Arten von Tieren, kriechenden, wilden und zahmen hervor — alle zum passenden Gebrauch des Menschen: die einen davon zur Nahrung, wie Hirsche, Schafe, Rehe u. dgl., die andern zur Dienstleistung, wie Kamele, Rinder, Pferde, Esel u. dgl., die andern zur Ergötzung, wie Affen, und unter den Vögeln Häher, Papageien u. dgl. Von den Gewächsen und Pflanzen [brachte sie hervor] teils fruchttragende, teils eßbare, teils wohlriechende und bunte, zur Ergötzung uns geschenkte, wie die Rose u. dgl., teils Krankheiten heilende. Gibt es doch kein Tier und kein Gewächs, in das der Schöpfer nicht eine Kraft gelegt, die dem Nutzen der Menschen dient. Denn er, der alles weiß, eh’ es geschieht, wußte, daß der Mensch sich freiwilliger Übertretung schuldig machen und sich dem Verderben überantworten werde. Darum hat er alles am Firmament, auf der Erde und in den Wassern zu dessen passendem Gebrauch geschaffen.</p><p>Vor der Übertretung war alles dem Menschen untertan. Denn Gott hatte ihn zum Herrscher über alles auf Erden und in den Wassern gesetzt. Sogar die Schlange lebte vertraulich mit dem Menschen zusammen, sie kam mehr als die andern zu ihm heran und verkehrte in ergötzlichen Bewegungen mit ihm. Daher gab durch sie der Urheber des Bösen, der Teufel, den Stammeltern den so schlimmen Rat ein. Die Erde trug von selbst die Früchte zum Bedarf der ihm untertänigen Tiere. Auch hatte die Erde weder Regen noch Winter. Nach der Übertretung aber, als er „den unvernünftigen Tieren gleich und ihnen ähnlich geworden “, da er es in seinem Ungehorsam gegen das Gebot des Herrn dahin gebracht, daß in ihm die unvernünftige Begierde über den vernünftigen Geist herrschte, empörte sich gegen den, der vom Schöpfer zum Herrscher bestimmt war, die [ihm] untergebene Schöpfung. Und es erging an ihn der Befehl, im Schweiße die Erde zu bearbeiten, von der er genommen war.</p><p>Aber auch jetzt sind die wilden Tiere nicht umsonst und unnütz da. Denn sie jagen Schrecken ein und treiben zur Erkenntnis und Anrufung Gottes, der sie geschaffen. Auch der Dorn sproßte nach der Übertretung aus der Erde gemäß dem Urteilsspruch des Herrn. Nach ihm gesellte sich selbst zum Genuß der Rose der Dorn. Er erinnert uns an die Übertretung, derentwegen die Erde verurteilt ward, für uns Dornen und Disteln hervorzubringen.</p><p>Weil sich dies so verhält, so muß man glauben, daß dessen Fortdauer bis jetzt das Wort des Herrn bewirkt, das er gesprochen: „Wachset und vermehret euch und erfüllet die Erde.“</p><p>Einige erklären die Erde für kugelförmig, andere für kegelförmig. Sie ist jedoch weniger und bedeutend kleiner als der Himmel, gleichsam ein Punkt, der in dessen Mitte hängt. Aber auch sie wird vergehen und verwandelt werden. Selig jedoch ist, wer die Erde der Sanftmütigen erbt. Denn die Erde, welche die Heiligen aufnehmen soll, ist unvergänglich. Wer könnte also die unendliche und unbegreifliche Weisheit des Schöpfers gebührend bewundern? Oder wer könnte dem Geber solcher Güter den geziemenden Dank abstatten?</p><p>[Es sind aber der bekannten Provinzen oder Statthalterschaften der Erde in Europa 34, auf dem großen Festland von Asien 48 Provinzen; Kirchenprovinzen 12.]</p><h3>XI. KAPITEL. Vom Paradies.</h3><p>Gott wollte den Menschen aus sichtbarer und unsichtbarer Natur nach seinem Bild und Gleichnis wie einen König und Herrscher über die ganze Erde und ihre Dinge bilden. Darum errichtete er ihm zuvor gleichsam eine Königsburg, in der er wohnen und ein ganz glückseliges Leben haben sollte. Dies ist das göttliche Paradies, von Gottes Händen in Eden gepflanzt, ein Vorratsort jeglicher Freude und Wonne — Eden bedeutet ja Üppigkeit —, gegen Aufgang höher als die ganze Erde gelegen, gemäßigt und von feinster und reinster Luft umstrahlt, mit immergrünen Pflanzen bewachsen, von Wohlgeruch erfüllt, voll Licht, den Begriff aller sinnlichen Anmut und Schönheit übersteigend, ein wahrhaft göttlicher Ort, eine Wohnung würdig dessen, der nach Gottes Bild geschaffen ist. In ihm wohnte kein unvernünftiges Wesen, sondern nur der Mensch, das Gebilde der göttlichen Hände.</p><p>Mitten in diesem pflanzte er (═ Gott) den Baum des Lebens und den Baum der Erkenntnis. Den Baum der Erkenntnis als eine Versuchung, Erprobung und Übung des Gehorsams und Ungehorsams des Menschen. Darum heißt er auch Baum der Erkenntnis des Guten und Bösen oder [er heißt Baum der Erkenntnis], weil er denen, die davon nahmen, die Kraft gab, ihre eigene Natur zu erkennen. Das ist zwar gut für die Vollkommenen, schlecht aber für die weniger Vollkommenen und „allzu Gierigen, wie feste Speise für die noch Zarten und Milchbedürftigen “. Denn Gott, der uns erschaffen, wollte nicht, daß wir in Sorge und Unruhe um vielerlei sind und uns um unser Leben härmen und kümmern. Das eben ist gerade auch bei Adam der Fall gewesen. Denn als er gekostet, erkannte er, daß er nackt war, und er machte sich eine Schürze, er umgürtete sich mit Feigenblättern. Vor dem Genusse waren „beide nackt, Adam wie Eva, und sie schämten sich nicht “. Gott wollte, daß wir so leidenschaftslos seien — denn das ist ein Zeichen höchster Leidenschaftslosigkeit —, außerdem auch noch sorglos, daß wir nur eine Beschäftigung haben, nämlich die der Engel, unaufhörlich und unablässig den Schöpfer zu preisen und in seiner Anschauung zu schwelgen und auf ihn unsere Sorge zu werfen. Das ließ er auch frei und offen durch den Propheten David uns verkünden. „Wirf auf den Herrn deine Sorge“, sagt er, „und er wird dich erhalten “. Und in den Evangelien spricht er, seine Jünger belehrend: „Sorget nicht für euer Leben, was ihr essen, noch für euren Leib, was ihr anziehen werdet.“ Und wiederum: „Suchet das Reich Gottes und seine Gerechtigkeit, und alles wird euch dazugegeben werden.“ Und zu Martha: „Martha, Martha, du machst dir Sorge und Unruhe um vielerlei: Eines nur ist not. Maria hat den besten Teil erwählt, der ihr nicht wird genommen werden “ — insofern sie nämlich zu seinen Füßen saß und auf seine Worte hörte.</p><p>Der Baum des Lebens war ein Baum, der lebenspendende Kraft besaß, oder von dem nur die des Lebens Würdigen und dem Tode nicht Unterworfenen essen konnten. Einige nun stellten sich das Paradies sinnlich vor, andere geistig. Meine Ansicht jedoch ist die: Wie der Mensch sinnlich und geistig zugleich erschaffen worden war, so war auch dessen hochheiliger Tempel sinnlich und geistig zugleich, er hatte somit eine doppelte Seite. Denn mit dem Leibe wohnte er, wie erwähnt, an dem hochgöttlichen, über die Maßen schönen Orte. Mit der Seele aber weilte er an einem noch erhabeneren und schöneren Orte. Er hatte ja Gott, der in ihm wohnte, zum Tempel, er war sein herrliches Gewand, er war mit seiner Gnade bekleidet, er erfreute sich wie irgendein anderer Engel seiner Anschauung, der einen, süßesten Frucht. Von dieser nährte er sich: Das eben heißt doch ganz entsprechend Baum des Lebens. Denn die süße Teilnahme an Gott verleiht denen, die sie genießen, ein Leben, das vom Tode nicht zerschlagen wird. Das eben hat Gott auch „alle Bäume“ genannt, da er sprach: „Von allen Bäumen im Paradiese mögt ihr essen.“ Denn er selbst ist alles, in ihm und durch ihn besteht alles.</p><p>Der Baum der Erkenntnis des Guten und Bösen aber ist die praktische Wertung der theoretischen Kenntnis, d. i. die Erkenntnis der eigenen Natur. Sie ist gut für die Vollkommenen und in der göttlichen Erkenntnis Fortgeschrittenen. Sie verkündet ja aus sich selbst die Größe des Schöpfers denen, die keinen Fall befürchten, weil sie es mit der Zeit zu einer gewissen Fertigkeit in solcher Erkenntnis gebracht haben. Nicht gut aber [ist sie] für die noch Jungen und „allzu Gierigen “. Denn da sie im Besseren noch nicht kräftig verharren, und das eine Gute noch nicht fest bei ihnen sitzt, pflegt die Sorge um ihren Leib sie auf ihre Seite zu ziehen und zu zerstreuen.</p><p>So ist, wie ich glaube, das Paradies zweifach (═ sinnlich und geistig) gewesen. Und in der Tat, das ist die Überlieferung der Väter, die Gott in sich getragen, mögen sie nun so oder so gelehrt haben. Man kann ferner unter „allen Bäumen“ die Erkenntnis der göttlichen Macht verstehen, die man aus den Geschöpfen gewinnt, wie der göttliche Apostel sagt: „Denn sein unsichtbares Wesen wird seit der Weltschöpfung in den Geschöpfen mit geistigem Auge geschaut.“ Erhabener jedoch als all diese Erkenntnisse und Betrachtungen ist die unserer selbst, d. h. die unserer Zusammensetzung (Natur), wie der göttliche David sagt: „Wunderbar ist deine Erkenntnis aus mir “, d. i. aus meinem Bau. Gefährlich aber war diese für Adam, da er noch ein Neuling war, aus den Gründen, die wir angeführt.</p><p>Oder [man kann] unter dem Baume des Lebens die Gotteserkenntnis, die aus allen sinnlichen Dingen zustandekommt, und die durch sie bewirkte Hinführung zum Schöpfer und Bildner und Urheber aller Dinge [verstehen]. Das nannte er auch „alle Bäume“ und meinte damit das Volle und Ungeteilte und die bleibende Teilnahme am Guten. Unter dem Baum der Erkenntnis des Guten und Bösen aber die sinnliche und ergötzende Speise, die scheinbar süß ist, in Wirklichkeit aber den, der davon nimmt, mit Übeln in Verbindung bringt. Denn Gott sprach: „Von allen Bäumen im Paradiese magst du essen.“ Damit, glaube ich, sagte er: Durch alle Geschöpfe erhebe dich zu mir, dem Schöpfer, und pflücke von allen* eine* Frucht, mich, „das wahre Leben “, alles soll dir Lebensfrucht bringen, und die Teilnahme an mir mache zu deinem Daseinsbestand. Denn so wirst du unsterblich sein. „Vom Baum der Erkenntnis des Guten und Bösen aber, von dem sollt ihr nicht essen. An dem Tage nämlich, da ihr davon esset, werdet ihr des Todes sterben.“ Denn naturgemäß ist die sinnliche Speise die Ergänzung des Abgangs und gelangt in den Abort und zur Vernichtung. Und so kann unmöglich unvergänglich bleiben, wer die sinnliche Speise genießt.</p><h3>XII. KAPITEL. Vom Menschen.</h3><p>So hat denn Gott die geistige Wesenheit, nämlich die Engel und alle himmlischen Ordnungen geschaffen — denn diese sind ganz offenkundig geistiger, unkörperlicher Natur: unkörperlicher, sage ich, im Zusammenhalt mit der Grobheit der Materie, in Wahrheit ist ja nur das göttliche Wesen immateriell und unkörperlich — außerdem auch noch die sinnliche [Wesenheit], Himmel und Erde, und was sich darin befindet, und zwar die eine als [ihm] verwandt — denn Gott verwandt ist die vernünftige, nur mit dem Geiste erfaßbare Natur —, die andere aber als in ganz weiter Ferne [von ihm] liegend, da sie natürlich unter die sinnliche Wahrnehmung fällt. Es mußte aber auch, wie der göttlich redende Gregorius sagt,* aus beiden* (═ Geist und Sinnenwesen)* eine Mischung* erfolgen* als Erweis einer höheren Weisheit und des großen Aufwandes betreffs der Naturen,* gleichsam eine Verbindung* der sichtbaren und unsichtbaren Natur.* Das „es mußte“ deutet auf den Willen des Schöpfers hin. Denn dieser ist höchstgeziemendes Maß und Gesetz. Und niemand wird zu seinem Bildner sagen: Warum hast du mich so gemacht? Denn der Töpfer hat Gewalt, aus seinem Tone verschiedene Gefäße zum Beweis seiner Geschicklichkeit zu fertigen.</p><p>So nun verhält es sich in dieser Sache. Darum hat er (═ Gott) den Menschen aus sichtbarer und unsichtbarer Natur mit eigenen Händen und nach seinem Bild und Gleichnis geschaffen. Den Leib hat er aus Erde gebildet, die vernünftige und denkende Seele aber hat er ihm durch seinen Hauch gegeben. Das eben nennen wir göttliches Bild. Denn das „nach dem Bilde“ bedeutet den Verstand und die Willensfreiheit, das „nach dem Gleichnis“ aber die [Gott-] Ähnlichkeit in der Tugend, soweit es möglich ist.</p><p>Der Leib und die Seele sind gleichzeitig gebildet worden, nicht das eine früher, das andere später, wie Origenes töricht behauptet.</p><p>Es schuf also Gott den Menschen unschuldig, rechtschaffen, tugendhaft, leidenschaftslos, sorgenfrei, mit aller Tugend geschmückt, mit allen Gütern ausgestattet,* gleichsam eine zweite Welt, in der großen eine kleine, einen anderen Engel, einen gemischten Anbeter, einen Augenzeugen der sichtbaren Schöpfung, Kenner des Geistigen, Herrscher übers Irdische, beherrscht von oben, irdisch und himmlisch, vergänglich und unsterblich, sichtbar und geistig, in der Mitte zwischen Größe und Niedrigkeit, Geist und Fleisch zugleich: Geist auf Grund der Gnade, Fleisch in Anbetracht der Erhebung; das eine, daß er bleibe und seinen Wohltäter preise, das andere, daß er leide und durch Leiden gemahnt und gezüchtigt werde wegen seines Größenstolzes; ein Wesen, das hier,* d. i. im gegenwärtigen Leben,* geleitet und anderswohin,* d. i. in die zukünftige Welt,* versetzt und, was das höchste Geheimnis ist, durch die Hinneigung zu Gott vergöttlicht wird;* vergöttlicht aber durch Teilnahme an der göttlichen Erleuchtung und nicht durch Verwandlung ins göttliche Wesen.</p><p>Er schuf ihn der Natur nach sündlos und dem Willen nach frei. Sündlos, sage ich, nicht als wäre er keiner Sünde fähig gewesen — nur das göttliche Wesen ist keiner Sünde fähig —, nein, deshalb, weil es nicht in seiner Natur, sondern vielmehr in seinem freien Willen lag, zu sündigen, oder weil er die Macht hatte, mit Hilfe der göttlichen Gnade im Guten zu verbleiben und fortzuschreiten, sowie mit Zulassung Gottes in Anbetracht seiner freien Selbstbestimmung sich auch vom Guten abzuwenden und sich zum Bösen zu gesellen. Denn was aus Zwang geschieht, ist keine Tugend.</p><p>Die Seele ist eine lebendige Substanz, einfach und unkörperlich, in ihrer Natur für körperliche Augen unsichtbar, unsterblich, vernünftig, denkend, gestaltlos, sie bedient sich eines organischen Leibes und gibt diesem Leben, Wachstum, Empfindung und Zeugung; sie hat nicht einen von ihr verschiedenen Geist — dieser ist vielmehr der reinste Teil von ihr. Denn wie das Auge im Leibe, so ist der Geist in der Seele — sie ist selbstmächtig, wollend und wirkend, wandelbar oder willensveränderlich, weil ja geschaffen. All das hat sie von Natur aus durch die Gnade des Schöpfers empfangen, durch die sie auch das Sein und das von Natur Sosein erhalten hat.</p><p><em>Wie vielerlei ist der Sinn des Wortes „unkörperlich“?</em></p><p><em>Unkörperliches, Unsichtbares und Gestaltloses verstehen wir auf zweierlei Art: das eine ist [so] kraft seines Wesens, das andere kraft der Gnade, das eine ist [so] von Natur, das andere im Vergleich mit der Grobheit der Materie.</em> Von Gott wird Unkörperliches ausgesagt der Natur nach, von den Engeln, Dämonen und Seelen aber der Gnade nach und im Vergleich mit der Grobheit der Materie.</p><p>Ein Körper ist ein Ding, das drei Dimensionen, oder das Länge, Breite und Tiefe oder Dicke hat. Jeder Körper besteht aus den vier Elementen, die Körper der Lebewesen aber [bestehen] aus den vier Säften.</p><p>Man muß wissen, daß es vier [Elemente] gibt:* die Erde, trocken und kalt, das Wasser, kalt und feucht, die Luft, feucht und warm, das Feuer, warm und trocken.* Ebenso gibt es auch vier Säfte, die den vier Elementen entsprechen: die schwarze Galle, sie entspricht der Erde, denn sie ist trocken und kalt; das Phlegma, es entspricht dem Wasser, denn es ist kalt und feucht; das Blut, es entspricht der Luft, denn es ist feucht und warm; die gelbe Galle, sie entspricht dem Feuer, denn sie ist warm und trocken. Die Früchte nun bestehen aus den Elementen, die Säfte aus den Früchten, die Körper der Lebewesen aber aus den Säften und sie lösen sich in sie (in die Elemente) auf. Denn alles Zusammengesetzte löst sich in sie auf.</p><p><em>Der Mensch hat mit den beseelten, mit den unvernünftigen und vernünftigen Wesen etwas gemein.</em></p><p>Man muß wissen, daß der Mensch mit den unbeseelten Wesen etwas gemein hat, am Leben der vernunftlosen teilnimmt und der Denkkraft der vernünftigen teilhaftig ist. An den unbeseelten hat er Anteil hinsichtlich des Lebens und der Mischung aus den vier Elementen, an den Pflanzen sowohl in genannter Hinsicht als auch hinsichtlich der ernährenden, wachstumgebenden, samenbildenden oder zeugenden Kraft, an den unvernünftigen aber in erwähnter Hinsicht und überdies hinsichtlich des Verlangens, d. i. des Zornes und der Begierde, und hinsichtlich der Sinnesempfindung und hinsichtlich der Bewegungstätigkeit.</p><p>Sinnesempfindungen nun gibt es fünf: Gesicht, Gehör, Geruch, Geschmack und Tastsinn.* Zur Bewegungstätigkeit gehört die Fähigkeit, von einem Ort zum andern überzugehen, den ganzen Leib zu bewegen, einen Laut zu geben und zu atmen. Denn es steht bei uns, dies zu tun oder nicht zu tun.*</p><p>Durch die Vernunft hängt er (═ der Mensch) mit den unkörperlichen und geistigen Naturen zusammen. Denn er überlegt und denkt und beurteilt jegliches, er strebt nach Tugenden und trachtet nach dem Gipfel der Tugend, der Frömmigkeit. Deshalb ist der Mensch auch eine kleine Welt.</p><p>Man muß wissen, daß* Teilung, Fluß und Veränderung* nur dem Körper eigen sind.* Veränderung hinsichtlich der Beschaffenheit,* wie Erwärmung, Erkältung u. dgl.* Fluß hinsichtlich des Abgangs, denn es geht Trockenes und Nasses und Odem ab * und bedarf der Ergänzung; darum sind der Hunger und der Durst natürliche Triebe. Teilung aber ist die Trennung der Säfte voneinander und die Scheidung nach Form und Materie.</p><p>Der Seele eigen sind die Frömmigkeit und das Denken. Seele und Leib gemeinsam aber sind die Tugenden. Zwar beziehen sich auch diese auf die Seele. Allein die Seele gebraucht dazu den Leib.</p><p>Man muß wissen, daß das Vernünftige seiner Natur nach über das Unvernünftige herrscht. Es scheiden sich nämlich die Kräfte der Seele in einen vernünftigen und einen unvernünftigen [Teil]. Das Unvernünftige aber hat zwei Teile: der eine hört nicht auf die Vernunft, d. h. er gehorcht der Vernunft nicht, der andere hört auf die Vernunft und gehorcht ihr. Nicht hört auf die Vernunft und nicht gehorcht ihr die Lebenstätigkeit, die auch Pulstätigkeit heißt, die samenbildende oder zeugende, die Wachskraft, auch Nährkraft genannt. Zu letzterer gehört auch die mehrende, die auch die Körper gestaltet. Diese wird nämlich nicht durch die Vernunft, sondern durch die Natur geleitet. Der Teil aber, der auf die Vernunft hört und ihr gehorcht, scheidet sich in Zorn und Begierde. Der unvernünftige Teil der Seele heißt mit einem gemeinsamen Namen der leidenschaftliche (pathetische) und begehrende. Man muß jedoch wissen, daß zu dem [Teil], der der Vernunft gehorcht, auch die Bewegungstätigkeit gehört.</p><p>Zu dem [Teil], der der Vernunft nicht gehorcht, gehört die Ernährungs-, Zeugungs- und Pulsierkraft. Die mehrende, nährende und zeugende Kraft nennt man vegetativ, die pulsierende aber Lebenskraft.</p><p><em>Die Ernährungstätigkeit hat vier Kräfte: die aufnehmende,</em> welche die Nahrung aufnimmt;* die behaltende,* welche die Nahrung festhält und nicht zuläßt, daß sie sich sogleich ausscheidet;* die verwandelnde,* welche die Nahrung in die Säfte verwandelt;* die ausscheidende,* die den Überfluß durch den After ausscheidet und ausstößt.</p><p>Man muß wissen, daß* von den tierischen Kräften die einen seelisch (psychisch), die andern vegetativ, die andern lebengebend (vital) sind. Seelisch sind die freiwilligen,* nämlich* die Bewegungstätigkeit und die Empfindung — zur Bewegungstätigkeit gehört die Fähigkeit, den Ort zu verändern, den ganzen Leib zu bewegen, einen Laut zu geben und zu atmen —, denn es steht bei uns, dies zu tun oder nicht zu tun. Die vegetativen und vitalen* aber sind unfreiwillig — vegetativ sind die* nährende, mehrende und samenbildende* [Kraft],* vital aber ist die pulsierende * —, denn diese sind tätig, wir mögen wollen oder nicht.</p><p>Man muß wissen, daß von den Dingen die einen gut, die andern schlecht sind. Ein erwartetes Gut weckt Verlangen, ein gegenwärtiges Freude. Ebenso wiederum ein erwartetes Übel Furcht, ein gegenwärtiges Schmerz. Zu beachten ist, daß wir unter dem Guten, von dem wir sprachen, entweder das wahrhaft Gute oder das scheinbar Gute verstanden haben, desgleichen auch unter dem Übel.</p><h3>XIII. KAPITEL. Von den Lüsten.</h3><p>Von den Lüsten sind die einen seelisch, die andern leiblich. Seelisch sind alle, die an sich nur der Seele angehören, wie die an den Wissenschaften und der Betrachtung. Leiblich die, die aus der Verbindung der Seele und des Leibes entstehen und deshalb auch leiblich heißen, alle, die sich auf Nahrung, Geschlechtsverkehr u. dgl. beziehen. Lüste, die nur dem Leibe eigen sind, findet man wohl nicht.</p><p>Des weiteren sind von den Lüsten die einen wahr, die andern falsch. Die rein geistigen (seelischen) bestehen in Wissenschaft und Betrachtung, die leiblichen aber in der Sinnesempfindung. Von den leiblichen Lüsten sind die einen natürlich und zugleich notwendig, ohne sie kann man nicht leben, wie die das Bedürfnis befriedigenden Speisen und die notwendigen Kleider, die andern natürlich, jedoch nicht notwendig, wie die natürlichen und rechtmäßigen Beiwohnungen. Denn letztere dienen zwar zur Fortdauer des ganzen Geschlechtes, aber man kann ohne sie in Jungfräulichkeit leben. Andere endlich sind weder notwendig noch natürlich, wie Trunkenheit, Unzucht und Übersättigung. Denn sie nützen weder zur Erhaltung unseres Lebens noch zur Fortpflanzung des Geschlechtes. Im Gegenteil, sie schaden vielmehr sogar. Darum muß der nach Gottes Willen Lebende den notwendigen und natürlichen zugleich folgen, an zweite Stelle aber die natürlichen und nicht notwendigen, wie sie in der entsprechenden Zeit und Weise und im entsprechenden Maße auftreten, setzen. Die andern aber muß er durchaus zurückweisen.</p><p>Als gute Lüste müssen die gelten, die nicht mit Traurigkeit verbunden sind und keine Reue mit sich bringen noch sonst einen Schaden verursachen noch die Grenze des Mäßigen überschreiten noch uns für lange von den wichtigen Arbeiten abziehen oder unterjochen.</p><h3>XIV. KAPITEL. Von der Traurigkeit.</h3><p>Die Traurigkeit hat vier Arten: Schmerz, Ärger, Neid, Mitleid. Schmerz ist Trauer, die sprachlos macht. Ärger Trauer, die beschwert. Neid Trauer bei fremdem Glück, Mitleid Trauer bei fremdem Unglück.</p><h3>XV. KAPITEL. Von der Furcht.</h3><p>[Forts. von ] Auch die Furcht unterscheidet sich in sechs [Arten]: in Zaudern, in Scheu, in Scham, in Schrecken, in Bestürzung, in Angst. Zaudern ist Furcht vor einer bevorstehenden Tätigkeit. Scheu ist Furcht bei Erwartung von Tadel. Dieser Affekt ist sehr gut. Scham ist Furcht ob einer schändlichen Tat. Auch dieser [Affekt] ist nicht ohne Aussicht auf Heil. Schrecken ist Furcht auf Grund einer gewaltigen Vorstellung. Bestürzung ist Furcht infolge einer ungewohnten Vorstellung. Angst ist Furcht vor Fall oder Fehlschlag. Denn fürchten wir, daß unser Tun mißlingt, so ängstigen wir uns.</p><h3>XVI. KAPITEL. Vom Zorn.</h3><p><em>Zorn ist ein Aufwallen des Herzblutes, das infolge Aufdampfens oder Erregens der Galle entsteht. Deshalb heißt er auch Chole und Cholos (═ Galle). Es ist aber bisweilen der Zorn auch ein Verlangen nach Rache. Denn werden wir beleidigt oder glauben wir beleidigt zu werden, so sind wir traurig, und es entsteht dann der Affekt, der aus Begier und Zorn gemischt ist.</em></p><p><em>Es gibt drei [Arten] des Zornes: Ärger, der auch Chole und Cholos (═ Galle) heißt, Groll und Rachsucht. Wenn nämlich der Zorn anhebt und sich regt, heißt er Chole und Cholos (═ Galle ═ Ärger). Groll (μῆνις) [mēnis] ist bleibender Ärger</em> oder Gedenken des erlittenen Bösen* (μνησικακία)* [mnēsikakia].* Er heißt so, weil er bleibt (παρὰ τὸ μένειν) [para to menein] und sich dem Gedächtnis (τῇ μνήμῃ) [tē mnēmē] einprägt. Rachsucht (κότος) [kotos] aber ist Ärger, der die Zeit zur Rache abpaßt. Diese hat ihren Namen von κεῖσθαι [keisthai]* (liegen bleiben = auf der Lauer liegen).</p><p><em>Der Zorn ist der Trabant des Verstandes,</em> ein Rächer der Begierde. Denn wenn wir eine Sache begehren und von jemand gehindert werden, so sind wir, gleich als wäre uns Unrecht widerfahren, über ihn zornig,* nachdem offenbar der Verstand geurteilt, daß das Geschehene bei denen, die naturgemäß ihre Stellung wahren, Zorn verdient.*</p><h3>XVII. KAPITEL. Vom Vorstellungsvermögen.</h3><p>[Forts. von ] * Vorstellungsvermögen ist eine Kraft der unvernünftigen Seele, die durch die Sinne wirkt* und die Sinnesempfindung (Wahrnehmung) heißt.* Sinnlich vorstellbar* und wahrnehmbar* ist das, was unter die Vorstellung* und die Wahrnehmung* fällt.* So ist Gesicht die Sehkraft selbst, sichtbar aber ist das, was unter das Gesicht fällt, etwa ein Stein oder sonst dergleichen.* Vorstellung jedoch ist ein Zustand der unvernünftigen Seele, der durch etwas Vorstellbares entsteht. Einbildung (leere Vorstellung) ist ein nichtiger Zustand im unvernünftigen Teil der Seele, der von keinem vorstellbaren Gegenstand herrührt.* Organ des Vorstellungsvermögens ist die vordere Gehirnhöhle.</p><h3>XVIII. KAPITEL. Von der Sinneswahrnehmung.</h3><p>Sinneswahrnehmung ist eine Kraft der Seele, die das Stoffliche bemerkt oder unterscheidet. Sinne aber sind die Werkzeuge oder Glieder, durch die wir wahrnehmen. Sinnlich ist das, was unter die Sinneswahrnehmung fällt. Sinnbegabt ist das Tier, das die Sinneswahrnehmung besitzt. Es gibt fünf Sinneswahrnehmungen, ebenso auch fünf Sinnesorgane.</p><p>Der erste Sinn ist das Gesicht. Werkzeuge und Organe des Gesichtes sind die Gehirnnerven und die Augen.* An erster Stelle nimmt das Gesicht die Farbe wahr.* Mit der Farbe aber* unterscheidet es auch den farbigen Körper, seine Größe, Gestalt, den Ort, wo er ist, den Zwischenraum, die Anzahl, Bewegung und Ruhe, das Rauhe und Glatte, Ebene und Unebene, das Spitze und das Stumpfe und seinen Bestand, ob er wasser- oder erdartig, d. h. naß oder trocken ist.*</p><p>Der zweite Sinn ist* das Gehör. Es nimmt die Stimmen und die Töne wahr. Es unterscheidet ihre Höhe und Tiefe, Feinheit und Stärke. Seine Organe sind die weichen Gehirnnerven und die hierfür eingerichteten Ohren. Nur der Mensch und Affe bewegen die Ohren nicht.*</p><p>Der dritte Sinn ist* der Geruch. Er entsteht durch die* die Dünste ins Gehirn führenden* Nasenhöhlen und geht bis an die Grenzen der vorderen Gehirnhöhlen. Er* empfindet und* bemerkt die Dünste. Der allgemeinste Unterschied der Dünste ist Wohl- und Übelgeruch und das, was dazwischen liegt, was weder wohl noch übel riecht. Wohlgeruch entsteht, wenn die in den Körpern befindlichen Feuchtigkeiten gut verkocht sind. Wenn [sie] aber mittelmäßig [verkocht sind], so [entsteht] ein Zwischenzustand. Sind sie jedoch wenig oder gar nicht verkocht, so entsteht der Übelgeruch.*</p><p>Der vierte Sinn ist* der Geschmack. Er bemerkt oder empfindet die Säfte. Seine Organe sind die Zunge, und von dieser besonders die Spitze und der Gaumen,* den manche Himmelchen nennen.* In ihnen sind die vom Gehirn kommenden Nerven ausgebreitet, sie melden dem herrschenden Teil (der Seele) die erfolgte Wahrnehmung* oder Empfindung.* Die sog. Geschmackseigenschaften der Säfte sind folgende: Süße, Schärfe, Säure, Bitterkeit, Herbheit, Kälte, Salzigkeit, Fettigkeit, Klebrigkeit. Diese unterscheidet nämlich der Geschmack. In Hinsicht auf diese Eigenschaften ist das Wasser geschmacklos. Denn es besitzt keine von ihnen.* Die Bitterkeit aber ist ein hoher Grad der Herbheit.</p><p>Der fünfte Sinn ist* der Tastsinn. Er ist auch allen Tieren gemein. Er entsteht durch die Nerven, die vom Gehirn in den ganzen Körper ausgehen.* Deshalb besitzen der ganze Körper wie auch die andern Sinneswerkzeuge die Tastempfindung. Es fällt aber unter den Tastsinn* das Warme und Kalte, das Weiche und Harte, Klebrige und Spröde, Schwere und Leichte. Denn dies erkennt man nur durch Betasten. Tastsinn und Gesicht gemeinsam aber sind das Rauhe und Glatte, das Trockene und Nasse, Grobe und Feine, Oben und Unten, der Ort und die Größe, wenn sie derart ist, daß sie sich durch Annäherung des Tastsinns umfassen läßt, das Dichte und Dünne oder Spärliche und das Runde, wenn es klein ist, und manch andere Formen. Desgleichen bemerkt er (═ der Tastsinn) mit Hilfe des Gedächtnisses und des Verstandes auch den in der Nähe befindlichen Körper, ebenso auch die Zahl bis zwei oder drei und solch kleine, die man leicht umfassen kann. Diese jedoch nimmt mehr das Gesicht als der Tastsinn wahr.*</p><p>Man muß wissen, daß der Schöpfer ein jedes der andern Sinneswerkzeuge doppelt gemacht hat, damit, wenn eines Schaden leidet, das andere den Dienst versieht. Denn [er machte] zwei Augen, zwei Ohren, zwei Nasenlöcher und zwei Zungen, die jedoch bei einigen Lebewesen geteilt sind, wie bei den Schlangen, bei den andern aber verbunden, wie beim Menschen. Den Tastsinn aber [machte er] im ganzen Körper, ausgenommen Knochen, Nerven, Nägel und Hörner, Haare, Bänder und anderes dergleichen.</p><p>Man muß wissen, daß das Gesicht nach geraden Linien wahrnimmt, der Geruch und das Gehör aber nicht bloß geradeaus, sondern nach allen Seiten. Der Tastsinn und der Geschmack aber nehmen weder geradeaus noch nach allen Seiten wahr, sondern nur dann, wenn sie ihren sinnlichen Gegenständen selbst nahe sind.</p><h3>XIX. KAPITEL. Vom Denkvermögen.</h3><p>[Forts. von ] * Zum Denkvermögen gehören die Urteile, die Zustimmungen, die Entschlüsse* zum Handeln, die Abneigung* und die Scheu vor dem Handeln, besonders aber die Betrachtungen* des Geistigen,* die Tugenden und Wissenschaften, die Begriffe der Künste, die Beratung und die Wahl. Dieses* (═ das Denkvermögen)* ist es aber auch, das uns in Träumen die Zukunft weissagt. Diese Weissagung erklären die Pythagoräer, den Hebräern folgend, für die allein wahre. Auch hiervon ist Organ die mittlere Gehirnhöhle und der seelische Geist, der in ihr ist.*</p><h3>XX. KAPITEL. Vom Erinnerungsvermögen.</h3><p><em>Das Erinnerungsvermögen ist Grund und Vorratskammer des Gedenkens und Erinnerns. Erinnerung ist nämlich eine Vorstellung, die von einem wirksam stattgehabten Wahrnehmen</em> und Denken* zurückbleibt oder Behaltung einer Wahrnehmung und eines Gedankens. Die Seele bemerkt* oder empfindet* das Sinnliche durch die Sinnesorgane, und es entsteht eine Vorstellung, das Geistige aber durch den Geist, und es entsteht ein Gedanke. Wenn sie also die Bilder dessen, was sie wahrgenommen und was sie gedacht, behält, so heißt man das: sich erinnern.*</p><p>Man muß jedoch wissen, daß* die Erfassung des Geistigen nur durch Lernen und natürliches Denken,* nicht durch Sinneswahrnehmung erfolgt.* Denn des Sinnlichen erinnert man sich von selbst, des Geistigen aber erinnern wir uns, wenn wir etwas gelernt haben. Von seinem Wesen freilich haben wir keine Erinnerung.*</p><p><em>Wiedererinnerung nennt man</em> den Wiedererwerb einer infolge Vergessens verlorenen Erinnerung.* Vergessenheit ist Verlust einer Erinnerung. Die Vorstellungskraft also,* die durch die Sinne die Stoffe wahrnimmt,* übergibt sie der Denk-* oder Urteils<em>kraft</em> — beides ist nämlich dasselbe —* diese empfängt und beurteilt sie und überschickt sie dem Erinnerungsvermögen* (Gedächtnis).* Organ* des Erinnerungsvermögens* ist die hintere Gehirnhöhle, die man auch Kleinhirn nennt, und der seelische Geist, der darin ist.*</p><h3>XXI. KAPITEL. Vom innerlichen und ausgesprochenen Wort.</h3><p>Weiterhin unterscheidet* sich der vernünftige Teil der Seele ins innerliche und ins ausgesprochene Wort. Das innerliche Wort ist eine Bewegung der Seele, die sich im überlegenden Teil ohne eine Aussprache vollzieht. Deshalb gehen wir oft auch stillschweigend eine ganze Rede in uns durch und unterhalten uns in den Träumen. Hauptsächlich mit Rücksicht darauf sind wir alle vernünftige Wesen. Denn auch die, die von Geburt aus stumm sind oder die infolge einer Krankheit oder eines Unfalls ihre Stimme verloren, sind nichtsdestoweniger vernünftige Wesen. Das ausgesprochene Wort aber macht sich in der Stimme und in den Dialekten (Mundarten) geltend,* es ist also das Wort, das durch Zunge und Mund hervorgebracht wird. Darum heißt es auch hervorgebrachtes [Wort]. Es ist Bote des Gedankens. Mit Rücksicht darauf heißen wir auch redende Wesen.</p><h3>XXII. KAPITEL. Vom Leiden (Pathos) und Wirken.</h3><p>Das Wort Pathos (Leiden) hat mehrfache Bedeutung.* Man bezeichnet damit das körperliche Leiden, wie die Krankheiten und die Wunden. Ferner bezeichnet man damit das seelische Leiden, die Begierde und den Zorn. Allgemein oder generell ist es Leiden (untätiges Verhalten) eines Lebewesens, dem Freude oder Trauer folgen. Es folgt nämlich dem Leiden Trauer, und nicht das Leiden selbst ist die Trauer. Denn das Empfindungslose leidet zwar, hat aber trotzdem keinen Schmerz. Nicht das Leiden also ist Schmerz, sondern die Empfindung des Leidens.* Es* muß aber der Rede wert,* d. h. groß* sein, um unter die Empfindung zu fallen.*</p><p><em>Eine Definition der seelischen Leiden ist folgende: Leiden ist eine empfindbare Bewegung des Bewegungsvermögens bei Vorstellung eines Gutes oder eines Übels. Oder anders: Leiden ist eine unvernünftige Bewegung der Seele infolge Vorstellung eines Gutes oder eines Übels.</em> Die Vorstellung des Gutes also bewegt (erregt) das Verlangen, die Vorstellung des Übels jedoch den Unwillen (Zorn).* Das generelle oder allgemeine Leiden aber wird so definiert: Leiden ist eine Bewegung in dem einen durch ein anderes. Tätigkeit aber ist eine wirksame Bewegung. Wirksam nennt man das, was sich aus sich selbst bewegt. So ist der Zorn eine Tätigkeit des zürnenden [Teils], Leiden aber [eine Tätigkeit] der beiden Teile: der Seele und überdies des ganzen Leibes, wenn er vom Zorn mit Gewalt zum Handeln getrieben wird. Denn die Bewegung findet in dem einen durch ein anderes statt. Das eben heißt Leiden.*</p><p><em>Auch in anderer Hinsicht nennt man die Tätigkeit Leiden. Tätigkeit ist nämlich eine naturgemäße Bewegung, Leiden dagegen eine naturwidrige. Mit Rücksicht darauf heißt nun Tätigkeit Leiden, wenn sie sich nämlich nicht naturgemäß bewegt, sei es durch sich selbst, sei es durch ein anderes. Die Pulsbewegung des Herzens also ist,</em> da sie natürlich ist,* eine Tätigkeit. Die* [Bewegung des Herzens]* aber, die infolge der Erschütterung entsteht, ist,* da sie ungemessen und* nicht naturgemäß* ist,* Leiden* und nicht Tätigkeit.</p><p><em>Allein nicht jede Bewegung des leidensfähigen (leidenden) Teiles heißt Leiden, sondern nur die stärkeren und zur Empfindung gelangenden. Die kleinen und unempfindbaren sind noch keine Leiden. Denn das Leiden muß auch eine der Rede werte Größe haben. Darum ist der Definition des Leidens beigefügt: eine empfindbare Bewegung. Denn die kleinen Bewegungen, die der Empfindung entgehen, bewirken nicht das Leiden.</em></p><p>Man muß wissen, daß unsere Seele zweierlei Kräfte hat, die erkennenden und die lebenstätigen. Die erkennenden sind: Einsicht, Überlegung, Meinung, Vorstellung, Wahrnehmung. Die lebenstätigen oder begehrenden sind: Wille und Wahl. Damit jedoch das Gesagte klarer werde, wollen wir darüber eingehend reden. Zuerst wollen wir von den erkennenden sprechen.</p><p>Von der Vorstellung und Wahrnehmung ist schon im Vorausgehenden genugsam die Rede gewesen. Durch die Wahrnehmung also bildet sich in der Seele ein Leiden, das Vorstellung heißt. Aus der Vorstellung aber entsteht eine Meinung. Die Überlegung sodann, die über die Meinung urteilt, ob sie wahr oder falsch ist, beurteilt, was wahr ist. Deshalb versteht man auch unter Überlegung das Überlegen und Beurteilen. Das Beurteilte und als wahr Bestimmte nun heißt Einsicht.</p><p>Oder anders: Man muß wissen, daß die erste Bewegung der Einsicht* (νοῦς)* [nous] Nachdenken* (νόησις)* [noēsis] heißt. Das Nachdenken über etwas nennt man Überlegung. Bleibt diese und gestaltet sie die Seele nach dem Gedachten, so heißt sie Beherzigung. Wenn die Beherzigung darin verharrt und sich selbst erforscht und die Seele mit dem Gedachten vertraut macht, so heißt sie Besinnung. Erweitert sich aber die Besinnung, so bewirkt sie die Erwägung, die innerliche Rede genannt wird. Diese definiert man als vollkommenste Bewegung der Seele, die sich in dem erwägenden Teile der Seele ohne eine Aussprache vollzieht, woraus, wie man sagt, die äußerliche, durch die Zunge gesprochene Rede hervorgeht. — Nachdem wir nun von den erkennenden Kräften gesprochen, wollen wir auch von den lebenstätigen oder begehrenden sprechen.</p><p>Man muß wissen, daß der Seele von Natur aus eine Kraft eingepflanzt ist,* die das Naturgemäße begehrt und alles erhält, was der Natur wesenhaft zukommt. Sie* heißt* θέλησις* [thelēsis] (Wille ═ das einfache, das schlechthinige Vermögen, zu wollen). Denn* die Wesenheit begehrt nach dem Sein, dem Leben und der geistigen und sinnlichen Bewegung (b0etätigung), indem sie nach ihrem natürlichen und vollkommenen Sein strebt. Deshalb* definiert man auch dieses natürliche Wollen* (θέλημα)* [thelēma] so:* θέλημα [thelēma] ist ein vernünftiges und lebenstätiges, nur am Natürlichen hängendes Begehren.* Darum ist die* θέλησις* [thelēsis] das gleiche, das natürliche, lebenstätige und vernünftige Begehren nach allem, was zum Bestande der Natur gehört, ein einfaches (═ ein schlechthiniges) Vermögen. Denn das Begehren der vernunftlosen Wesen heißt, da es nicht vernünftig ist, nicht Wollen.</p><p><em>Βούλησις</em> [Boulēsis] (Wille) aber ist* ein bestimmtes natürliches Wollen (θέλησις) [thelēsis]* oder ein natürliches und vernünftiges Begehren* nach irgendeiner Sache.* Es liegt nämlich in der Menschenseele die Kraft zum vernünftigen Begehren. Bewegt sich nun dieses vernünftige Begehren in natürlicher Weise auf eine Sache hin, so heißt es Wille* (βούλησις)* [boulēsis]. Denn Wille* (βούλησις)* [boulēsis] ist ein vernünftiges Begehren und Streben nach einer Sache.</p><p>Wille* (βούλησις)* [boulēsis] gebraucht man sowohl für das, was in unserer Macht steht, als auch für das, was nicht in unserer Macht steht, d. i.* für das Mögliche wie für das Unmögliche.* Oft wollen wir Unzucht treiben oder enthaltsam sein oder schlafen oder etwas dergleichen. — Das steht in unserer Macht und ist möglich. Wir wollen aber auch Könige sein — das jedoch steht nicht in unserer Macht. Wir wollen vielleicht auch niemals sterben — das gehört zum Unmöglichen.</p><p><em>Der Wille geht auf das Ziel,</em> nicht* auf die Mittel zum Ziel. Ziel also ist das Gewollte, wie* das Königsein,* das Gesundsein, Mittel zum Ziel aber das, worüber man beratschlagen kann, oder die Art und Weise, wodurch wir gesund* oder König* sein können.* Nach dem Willen [kommt] dann eine Untersuchung und Überlegung, und danach folgt, wenn es sich um Dinge handelt, die in unserer Macht stehen, eine Beratschlagung* (βουλή)* [boulē] oder Beratung* (βούλευσις)* [bouleusis].* Beratung ist ein suchendes Begehren, das betreffs dessen entsteht, was wir vollbringen können.* Man beratet nämlich, ob man an die Sache gehen soll oder nicht. Dann urteilt man, was besser ist — und das heißt Urteil* (κρίσις)* [krisis]. Sodann hat man Hinneigung und Liebe zu dem, was man auf Grund der Beratung geurteilt, und das heißt Gesinnung* (γνώμη)* [gnōmē]. Denn wenn man urteilt, aber zu dem, worüber man geurteilt, keine Hinneigung und Liebe hat, so heißt man es nicht Gesinnung. Auf die Hinneigung folgt sodann die Wahl* (προαίρεσις)* [proairesis] oder Erwählung* (ἐπιλογή)* [epilogē]. Die Wahl besteht darin, daß man von zwei vorliegenden Dingen das eine vor dem andern erwählt und ausliest. Dann schreitet man zur Tat, und das heißt Angriff (Unternehmen,* ὁρμή* [hormē]). Danach macht man Gebrauch, und das heißt Gebrauch* (χρῆσις)* [chrēsis]. Endlich ruht nach dem Gebrauch das Begehren.</p><p>In den vernunftlosen Wesen nun entsteht ein Begehren nach etwas, und sogleich erfolgt ein Angriff zur Tat. Denn das Begehren der vernunftlosen Wesen ist unvernünftig, sie werden vom natürlichen Begehren getrieben. Darum nennt man das Begehren der vernunftlosen Wesen nicht Wollen* (θέλησις)* [thelēsis] und nicht Willen* (βούλησις)* [boulēsis]. Denn das Wollen* (θέλησις)* [thelēsis] ist ein vernünftiges und freiwilliges, natürliches Begehren. Bei den Menschen wird, da sie vernünftig sind, das natürliche Begehren viel mehr geleitet als daß es leitet. Denn frei und vernünftig bewegt er (═ der Mensch) sich (═ ist er tätig), da die erkennenden und lebenstätigen Kräfte in ihm miteinander verbunden sind. Frei also begehrt er und frei will er, und frei sucht und überlegt er, und frei beratschlagt und frei urteilt er, und frei neigt er sich hin und frei wählt er, und frei greift er an, und frei handelt er in dem, was naturgemäß ist.</p><p>Man muß wissen, daß wir bei Gott zwar von einem Willen reden, aber von Wahl im eigentlichen Sinn nicht sprechen. Denn Gott geht nicht mit sich zu Rate. Ist es doch ein Zeichen von Unwissenheit, sich zu beraten. Denn niemand beratet über das, was man erkennt. Wenn aber Beratung Unwissenheit verrät, dann sicherlich auch die Wahl. Da nun Gott schlechthin alles weiß, so geht er nicht mit sich zu Rate.</p><p>Aber auch bei der Seele des Herrn reden wir von keiner Beratung oder Wahl. Sie war ja frei von Unwissenheit. Denn hatte sie auch eine [menschliche] Natur, die das Künftige nicht wußte, so besaß sie gleichwohl, da sie mit dem Gott-Logos hypostatisch geeint war, die Kenntnis von allem nicht aus Gnade, sondern, wie gesagt, wegen der hypostatischen Union. Ein und derselbe war nämlich sowohl Gott als Mensch. Darum hatte er auch keinen Gesinnungswillen. Er hatte ja wohl einen natürlichen, einfachen Willen, wie man ihn in gleicher Weise bei allen menschlichen Personen sieht, aber eine Gesinnung oder ein Wollen im Gegensatz zu seinem göttlichen Willen oder verschieden von seinem göttlichen Willen hatte seine heilige Seele nicht. Denn die Gesinnung trennt sich mit den Personen, ausgenommen die heilige, einfache, nicht zusammengesetzte, ungetrennte Gottheit. Da nun hier die Personen in keiner Weise getrennt oder geschieden sind, so ist auch das Wollen nicht getrennt, und es ist hier, da eine einzige Natur, auch ein einziger natürlicher Wille. Da die Personen ungetrennt sind, gibt es auch nur ein einziges Wollen und eine einzige Bewegung der drei Personen. Bei den Menschen ist, da die Natur eine ist, auch der natürliche Wille einer. Da aber die Personen nach Ort und Zeit und der Neigung zu den Dingen und sehr vielem anderen voneinander getrennt und geschieden sind, darum sind die Willen und die Gesinnungen verschieden. Bei unserem Herrn Jesus Christus aber sind, da die Naturen verschieden, auch die natürlichen Willen oder die Willensvermögen seiner Gottheit und seiner Menschheit verschieden. Da jedoch die Person eine, und der Wollende einer ist, so ist eines auch das Wollen oder der Gesinnungswille. Denn sein menschlicher Wille folgt natürlich seinem göttlichen Willen und will das, was der göttliche Wille zu wollen beliebt.</p><p>Man muß wissen, daß etwas anderes ist das Wollen* (θέλησις)* [thelēsis] und etwas anderes der Wille* (βούλησις)* [boulēsis], etwas anderes das Gewollte* (θελητόν)* [thelēton] und etwas anderes das Wollensfähige* (θελητικόν)* [thelētikon] und etwas anderes der Wollende* (θέλων)* [thelōn].* Θέλησις* [Thelēsis] ist das einfache (═ das schlechthinige) Vermögen, zu wollen.* Βούλησις* [Boulēsis] aber ist der auf eine Sache gerichtete Wille. Gewollt ist die dem Willen unterliegende Sache oder* was* wir wollen. Ein Beispiel: Es regt sich die Begierde nach Speise. Die Begierde schlechthin (als solche) ist ein vernünftiges Wollen* (θέλησις)* [thelēsis]. Wollensfähig ist das, was die Willensfähigkeit hat, z. B. der Mensch. Wollend aber ist eben der, der vom Wollen Gebrauch macht.</p><p>Man muß aber wissen, daß* θέλημα* [thelēma] (Wille) bald das Wollen* (θέλησις)* [thelēsis], d. i. das Willensvermögen, bedeutet — dann heißt er natürlicher Wille —, bald das Gewollte, und dann heißt er Gesinnungswille (gnomischer Wille).</p><h3>XXIII. KAPITEL. Von der Tätigkeit.</h3><p>Man muß wissen, daß alle die vorgenannten Kräfte, die erkennenden wie die lebenstätigen, die natürlichen wie die kunstfertigen, Tätigkeiten genannt werden. Denn Tätigkeit ist die natürliche Kraft und Bewegung einer jeden Wesenheit. Und wiederum: Natürliche Tätigkeit ist die eingepflanzte Bewegung einer jeden Wesenheit. Daher ist klar, daß das, was dieselbe Wesenheit hat, auch dieselbe Tätigkeit hat. Wo aber die Naturen verschieden sind, da sind auch die Tätigkeiten verschieden. Denn es ist unmöglich, daß eine Wesenheit ohne natürliche Tätigkeit ist.</p><p>Ferner ist natürliche Tätigkeit die jede Wesenheit offenbarende Kraft. Und wiederum: Natürliche Tätigkeit ist auch die erste (ursprüngliche) sich stets bewegende Kraft der vernünftigen Seele, d. i. ihr stets regsames Denken, das auf natürliche Weise immerfort aus ihr quillt. Und wiederum: Natürliche Tätigkeit ist die Kraft und Bewegung einer jeden Wesenheit, ohne die nur das nicht Seiende ist.</p><p>Tätigkeiten heißen aber auch die Handlungen, wie das Reden, das Gehen, das Essen, das Trinken u. dgl. Auch die natürlichen Affekte* (πάθη)* [pathē] werden oft Tätigkeiten genannt, wie Hunger, Durst u. dgl. Tätigkeit heißt ferner auch die Verwirklichung der Möglichkeit.</p><p>Auf zweifache Weise wird die Möglichkeit und die Wirklichkeit ausgesagt. Wir nennen einen Knaben, der noch Säugling ist, einen Grammatiker der Möglichkeit nach. Er hat ja die Befähigung, durch Lernen ein Grammatiker zu werden. Wir nennen ferner den Grammatiker einen Grammatiker der Möglichkeit und der Wirklichkeit nach: der Wirklichkeit nach, weil er die Kenntnis der Grammatik besitzt; der Möglichkeit nach, weil er sie lehren kann, aber den Unterricht nicht ausübt. Und wieder nennen wir ihn einen Grammatiker der Wirklichkeit nach, wenn er wirkt, d. h. lehrt.</p><p>Man muß also wissen, daß die zweite Art sowohl die Möglichkeit wie die Wirklichkeit bedeutet: an zweiter Stelle die Möglichkeit, an erster aber die Wirklichkeit.</p><p>Erste und alleinige und wahre Naturtätigkeit ist das freiwillige oder vernünftige und selbstmächtige Leben, das auch unsere Art begründet. Die dem Herrn dies nehmen, von denen weiß ich nicht, wie sie ihn als den menschgewordenen Gott bezeichnen.</p><p><em>Tätigkeit ist wirksame</em> Natur<em>bewegung.</em> Wirksam heißt das, was sich aus sich selbst bewegt.</p><h3>XXIV. KAPITEL. Vom Freiwilligen und Unfreiwilligen.</h3><p>Das Freiwillige liegt in einem gewissen Handeln, und das, was als unfreiwillig gilt, liegt in einem gewissen Handeln. Viele nehmen aber auch das wirklich Unfreiwillige nicht bloß im Leiden, sondern auch im Handeln an. Darum muß man wissen, daß Handlung eine vernünftige Tätigkeit ist. Den Handlungen folgt Lob oder Tadel. Die einen davon vollbringt man mit Freud’, die andern mit Leid. Die einen davon sind dem Handelnden erwünscht, die andern verhaßt. Von den erwünschten sind die einen immer erwünscht, die andern nur zu einer gewissen Zeit. Dasselbe gilt auch von den verhaßten. Und wiederum: Die einen Handlungen läßt man Erbarmen finden und würdigt sie der Nachsicht, die andern aber haßt und straft man. Dem Freiwilligen nun folgt jedenfalls Lob oder Tadel, man tut es mit Freude, und die Handlungen sind den Handelnden erwünscht, entweder immer oder zu der Zeit, da sie geschehen. Dem Unfreiwilligen aber [folgt]: Man würdigt es der Nachsicht oder des Erbarmens, man tut es mit Schmerz, [die Handlungen] sind nicht erwünscht, man vollbringt die Tat nicht aus sich selbst, auch wenn man dazu gezwungen wird.</p><p><em>Das Unfreiwillige geschieht teils aus Zwang, teils aus Unwissenheit. Aus Zwang, wenn das wirkende Prinzip</em> oder die Ursache* von außen stammt,* d. h. wenn wir von einem andern gezwungen werden, ohne daß wir uns überhaupt bereden lassen oder aus eigenem Antrieb beistimmen oder überhaupt mitwirken oder durch uns selbst das Erzwungene tun. Das können wir auch so definieren: Unfreiwillig ist das, dessen Prinzip von außen stammt,* ohne daß der Gezwungene aus eigenem Antrieb beistimmt.* Unter Prinzip aber verstehen wir die Wirkursache. Das Unfreiwillige aus Unwissenheit ist dann gegeben,* wenn wir nicht selber an der Unwissenheit schuld sind, sondern es sich zufällig so trifft.* Wenn z. B. jemand im Rausch einen Mord begeht, so hat er zwar unwissend getötet, aber wahrlich nicht unfreiwillig. Denn die Ursache der Unwissenheit, nämlich den Rausch, hat er selbst hervorgerufen.* Wenn aber einer, der am gewohnten Orte schießt, den vorbeigehenden Vater tötet,* so sagt man, er habe dies aus Unwissenheit unfreiwillig getan.</p><p><em>Da es also eine doppelte Art von Unfreiwilligem gibt, nämlich das aus Zwang und das aus Unwissenheit, so steht das Freiwillige beiden gegenüber. Denn freiwillig ist, was weder aus Zwang noch aus Unwissenheit geschieht. Freiwillig ist also das, dessen Prinzip, d. i. Ursache, in dem ist, der selber alle Einzelheiten kennt, wodurch und worin die Handlung besteht.</em> Einzelheiten aber sind das,* was bei den Rednern Umstände heißt;* z. B.* wer,* d. i. der, der gehandelt hat;* wen,* d. i. den, der gelitten hat;* was, d. i. die Tat selbst,* etwa: er hat getötet;* wodurch,* d. i. durch welches Werkzeug;* wo,* d. i. an welchem Ort;* wann,* d. i. zu welcher Zeit;* wie,* d. i. die Art und Weise der Handlung;* warum,* d. i. aus welchem Grunde.</p><p>Man muß wissen, daß manches in der Mitte zwischen Freiwilligem und Unfreiwilligem steht. Obwohl dies unerfreulich und betrübend ist, tun wir es doch um eines größeren Übels willen. So werfen wir des Schiffbruchs wegen hinaus, was im Schiffe ist.</p><p>Man muß wissen, daß* die Kindlein und die vernunftlosen Wesen zwar freiwillig, aber wahrlich nicht aus Wahl handeln, und daß wir alles, was wir im Zorn tun, ohne zu überlegen, freiwillig, doch wahrlich nicht auch vorsätzlich tun. Auch der Freund begegnet uns plötzlich, zwar freiwillig (erwünscht) für uns, aber wahrlich nicht auch mit unserem Vorsatz. Und wer unverhofft auf einen Schatz gestoßen, ist freiwillig, aber wahrlich nicht auch vorsätzlich auf ihn gestoßen.* All das ist zwar freiwillig, weil wir uns darüber freuen, aber wahrlich nicht auch vorsätzlich, weil ohne Überlegung. Eine Überlegung muß aber jedenfalls, wie gesagt, der Wahl (dem Vorsatz) vorausgehen.</p><h3>XXV. KAPITEL. Von dem, was in unserer Macht steht, d. i. vom freien Willen.</h3><p>Bei der Untersuchung über den freien Willen, d. i. über das, was in unserer Macht steht, ist die erste Frage, ob es etwas gibt, was in unserer Macht steht. Denn viele sind es, die dem entgegentreten. Die zweite [Frage ist die], was das ist, was in unserer Macht steht und über was wir Macht haben. Die dritte hat zu untersuchen, aus welchem Grunde Gott, der uns erschaffen, uns frei erschaffen hat. Wir wollen also mit dem ersten Punkt beginnen und zuerst aus dem, was von jenen zugestanden wird, zeigen, daß es etwas gibt, das in unserer Macht steht, und zwar folgendermaßen:</p><p>Die Ursache von allem, was geschieht, ist, so sagen sie, entweder Gott oder die Notwendigkeit oder das Schicksal oder die Natur oder das Glück oder der Zufall. Nun, ein Werk Gottes ist die Wesenheit und Vorsehung; [Werk] der Notwendigkeit die Bewegung dessen, was sich immer gleich bleibt; des Schicksals, daß das, was durch dasselbe geschieht, sich mit Notwendigkeit vollzieht — denn auch dieses ist Sache der Notwendigkeit; [Werk] der Natur Werden, Wachstum, Vergehen, Pflanzen und Tiere; des Glücks das Seltene und Unerwartete. Man definiert nämlich das Glück als ein Zusammentreffen und Zusammenkommen zweier Ursachen, denen ein Vorsatz zugrundeliegt, die aber eine andere Wirkung haben als ihrer Natur entspricht. Z. B.: Es hebt jemand einen Graben aus und findet einen Schatz. Denn weder hat der, der den Schatz hingelegt, ihn in der Absicht hingelegt, daß ein anderer diesen finde, noch hat der, der ihn gefunden, in der Absicht gegraben, einen Schatz zu finden, sondern der eine, um ihn zu heben, wann es ihm beliebte, der andere, um einen Graben zu machen. Es traf sich jedoch etwas anderes, als beide beabsichtigten. [Ein Werk] des Zufalls endlich ist das, was außer Natur und Kunst den unbeseelten oder unvernünftigen Wesen zustößt. So ihre Ansicht. Worunter sollen wir also das einreihen, was durch die Menschen geschieht, wenn nämlich der Mensch nicht Ursache und Prinzip (Grund) seines Tuns ist? Denn die bisweilen schändlichen und ungerechten Handlungen darf man weder Gott zuschreiben noch der Notwendigkeit — sie gehören ja nicht zu dem immer sich gleich Bleibenden —, noch dem Schicksal — denn nicht zum Möglichen, sondern zum Notwendigen gehören, wie sie sagen, die Bestimmungen des Schicksals —, noch der Natur — denn Werke der Natur sind Tiere und Pflanzen —, noch dem Glück — denn nicht selten und unerwartet sind die Handlungen der Menschen —, noch dem Zufall — denn sie sagen, Zufall begegne dem Unbeseelten oder Unvernünftigen. Es bleibt also nur übrig: Der handelnde und wirkende Mensch ist Prinzip (Ursache) seiner Werke und hat einen freien Willen.</p><p>Ferner, wenn der Mensch von keiner Handlung die Ursache ist, so hat er nicht nötig, sich zu beraten. Denn wozu braucht er die Beratung, wenn er über keine Handlung Herr ist? Jede Beratung [erfolgt] doch um einer Handlung willen. Das Schönste und Wertvollste am Menschen aber als überflüssig hinzustellen, dürfte zu dem Törichtesten gehören. Wenn er sich also berät, so berät er sich um einer Handlung willen. Denn jede Beratung [erfolgt] um einer Handlung willen und wegen einer Handlung.</p><h3>XXVI. KAPITEL. Von dem, was geschieht.</h3><p>Das, was geschieht, steht teils in unserer Macht, teils nicht.* In unserer Macht steht* das, was wir in freier Entscheidung tun oder lassen können, d. i.* das, was von uns freiwillig getan wird — man würde ja nicht sagen, daß es freiwillig getan wird, stünde das Tun nicht in unserer Macht —, kurz das, worauf Tadel oder Lob folgt, und wofür es Aufmunterung und Gesetz gibt. Im eigentlichen Sinn aber steht in unserer Macht alles, was unsere Seele angeht und worüber wir beraten. Die Beratung aber betrifft das, was gleich (so oder so) möglich ist. Gleichmöglichkeit besteht da, wo sowohl das wie sein Gegenteil in unserer Macht liegt. Die Wahl darüber trifft unser Verstand, dieser ist Anfang (Prinzip) der Handlung. Das also steht in unserer Macht, was gleich möglich ist, wie z. B. sich bewegen und sich nicht bewegen, angreifen und nicht angreifen, das nicht Notwendige begehren und nicht begehren, lügen und nicht lügen, geben und nicht geben, sich freuen, wo man soll, und ebenso sich nicht freuen, wo man nicht soll, und alles dergleichen, worin die Werke der Tugend und der Schlechtigkeit bestehen. Denn hierüber sind wir unser eigener Herr. Zu dem gleich Möglichen gehören auch die Künste.* Denn es steht bei uns, sie zu betreiben, wenn wir wollen, und sie nicht zu betreiben.</p><p>Man muß aber wissen, daß zwar* die Wahl dessen, was zu tun ist, immer in unserer Macht steht,* die Ausführung jedoch infolge eines bestimmten Verhaltens der göttlichen Vorsehung oft verhindert wird.</p><h3>XXVII. KAPITEL. Über die Frage, warum wir einen freien Willen haben.</h3><p><em>Wir sagen allsogleich, die Willensfreiheit begleite die Vernunft und dem Geschaffenen sei Veränderung und Wandel eigen.</em> Alles Geschaffene ist eben auch wandelbar. Denn wessen* Entstehung* mit Veränderung begonnen, das ist notwendig wandelbar. Wandel aber ist es, aus dem Nichtsein ins Dasein zu treten und* aus einem vorhandenen Stoff* etwas anderes zu werden. Die unbeseelten und unvernünftigen Wesen nun verwandeln sich nach den erwähnten körperlichen Veränderungen, die vernünftigen aber durch freie Wahl.* Vom Vernünftigen ist das eine theoretisch, das andere praktisch: theoretisch das Nachdenken darüber, wie sich das Seiende verhält, praktisch aber die Beratung, die für das, was zu tun ist, den rechten Maßstab bestimmt. Man nennt das Theoretische Verstand (νοῦς) [nous], das Praktische aber [praktische] Vernunft, das Theoretische Weisheit, das Praktische Klugheit. Jeder nun, der ratschlagt, ratschlagt so, als stünde die Wahl dessen, was zu tun ist, in seiner Macht, um das zu wählen, was auf Grund der Beratung den Vorzug verdient, und es dann nach der Wahl zu tun. Wenn aber das, dann steht notwendig der Vernunft der freie Wille zur Seite. Denn entweder wird keine Vernunft da sein, oder, wenn eine Vernunft da ist, wird sie Herrin der Handlungen und selbstmächtig sein.* Daher haben auch die unvernünftigen Wesen keinen freien Willen. Denn sie werden von der Natur mehr geleitet als sie leiten. Deshalb widersprechen sie auch nicht dem natürlichen Begehren, sondern sobald sie nach etwas begehren, schreiten sie zur Tat. Der Mensch aber, der ja vernünftig ist, leitet die Natur viel mehr, als er [von ihr] geleitet wird. Deshalb hat er auch beim Begehren, wenn er will, die Macht, die Begierde zu zügeln oder ihr zu folgen. Darum werden die vernunftlosen Wesen weder gelobt noch getadelt, der Mensch jedoch wird sowohl gelobt als getadelt.</p><p>Man muß wissen, daß die Engel, da sie vernünftig sind, selbstmächtig, und da geschaffen, wandelbar sind. Das hat der Teufel bewiesen. Er ward vom Schöpfer gut geschaffen, aber eigenmächtig ist er nebst den mit ihm abgefallenen Mächten oder den Dämonen Erfinder der Schlechtigkeit geworden, während die übrigen Ordnungen der Engel im Guten verharrten.</p><h3>XXVIII. KAPITEL. Von dem, was nicht in unserer Macht steht.</h3><p>Von dem, was nicht in unserer Macht steht, hat einiges in dem, was in unserer Macht steht, seine Gründe oder Ursachen, nämlich die Vergeltung unserer Handlungen in der gegenwärtigen und in der zukünftigen Welt, alles übrige aber hängt vom göttlichen Ratschluß ab. Denn das Entstehen aller Dinge hat seinen Grund in Gott, das Vergehen aber ward unserer Bosheit wegen zu Straf’ und Nutzen eingeführt. „Gott hat ja den Tod nicht gemacht, noch freut er sich am Untergang der Lebendigen.“ Durch den Menschen vielmehr, d. i. durch Adams Übertretung, ist der Tod gekommen, desgleichen auch die übrigen Strafen. Alles andere aber muß man Gott beilegen. Denn unsere Entstehung verdanken wir seiner schöpferischen Kraft, die Fortdauer seiner erhaltenden Kraft, die Leitung und Erhaltung seiner vorsehenden Kraft, den ewigen Genuß der Güter seiner Güte gegen die, die das Naturgemäße bewahren, wozu wir auch gebildet wurden. Da aber einige die Vorsehung leugnen, so wollen wir auch über die Vorsehung noch ein paar Worte sprechen.</p><h3>XXIX. KAPITEL. Von der Vorsehung.</h3><p><em>Vorsehung ist die Sorge, die Gott dem Seienden zuwendet.</em> Und wiederum:* Vorsehung ist der Wille Gottes, durch den alles Seiende die angemessene Leitung erhält. Ist aber die Vorsehung Gottes Wille, so muß folgerichtig* alles, was durch die Vorsehung geschieht,* überaus schön und gotteswürdig und so geschehen, wie es besser gar nicht geschehen könnte. Denn es muß der Schöpfer und Vorseher des Seienden ein und derselbe sein. Es wäre ja weder geziemend noch folgerichtig, wenn einer Schöpfer des Seienden und einer Vorseher wäre. Denn da fehlte* sicherlich beiden* die Kraft:* dem einen, um zu schaffen, dem andern, um vorzusehen. Gott ist also sowohl Schöpfer als Vorseher, und seine schaffende und erhaltende und vorsehende Kraft ist sein guter Wille. Denn „alles, was er wollte, hat der Herr im Himmel und auf der Erde gemacht “, und seinem Willen widersteht niemand. Er wollte, daß alles werde, und es ward. Er will, daß die Welt bestehe, und sie besteht, und alles, was er will, geschieht.</p><p>Daß Gott vorsorgt und daß er trefflich vorsorgt, zeigt wohl am richtigsten folgende Erwägung: Gott allein ist von Natur aus gut und weise. Da er also gut ist, sorgt er vor. Denn wer nicht vorsorgt, ist nicht gut. Auch die Menschen und die vernunftlosen Wesen sorgen ja naturgemäß für ihre Kinder vor. Und wer nicht vorsorgt, wird getadelt. Da er ferner weise ist, sorgt er aufs beste für das Seiende.</p><p>Beachten wir dies, so müssen wir alle Werke der Vorsehung bewundern, alle loben, alle ohne Grübeln hinnehmen, auch wenn sie der Menge ungerecht scheinen. Denn die Vorsehung Gottes ist unerkennbar und unbegreifbar, und unsere Gedanken und Handlungen sowie die Zukunft sind ihm allein bekannt. All das steht nämlich nicht in unserer Macht. Denn was in unserer Macht liegt, ist nicht Sache der Vorsehung, sondern unseres freien Willens.</p><p>Was Sache der Vorsehung ist, geschieht teils nach Wohlgefallen, teils nach Zulassung. Nach Wohlgefallen alles, was unwidersprechlich gut ist.* Nach Zulassung aber [auf verschiedene Art]. Oft läßt sie zu, daß auch der Gerechte in Unglück fällt, um die in ihm verborgenen Tugenden den andern kundzutun, wie bei Job. Ein andermal läßt sie etwas Unziemliches geschehen, auf daß durch die unziemlich scheinende Tat etwas Großes und Wunderbares vollbracht werde, wie durch das Kreuz das Heil der Menschen. In anderer Weise läßt sie den Frommen Übles leiden, auf daß er nicht das gute Gewissen verliere oder auch ob der ihm verliehenen Kraft und Gnade in Prahlerei verfalle, wie bei Paulus. Mancher wird eine Zeitlang zur Besserung eines andern verlassen, damit die andern, die seine Lage sehen, unterwiesen werden, wie bei Lazarus und dem Reichen. Denn naturgemäß gehen wir, wenn wir welche leiden sehen, in uns. Manch einer wird auch zur Ehre eines andern, nicht durch eigene oder der Eltern Sünde, verlassen, wie der Blindgeborene zur Ehre des Menschensohnes. Ferner wird zugelassen, daß mancher zur Aneiferung eines andern leidet, damit, wenn des Leidenden Ruhm sich erhöht, die andern das Leiden ohne Zaudern ertragen in der Hoffnung auf die „künftige Herrlichkeit “ und im Verlangen nach den „künftigen Gütern “, wie bei den Märtyrern.* Es wird zugelassen, daß mancher zuweilen sogar eine schändliche Handlung begeht, um ein anderes, noch schlimmeres Übel zu verhindern. Z. B.: Es ist einer stolz auf seine Tugenden und guten Werke. Diesen läßt Gott in Unzucht fallen, daß er durch den Fall zur Erkenntnis seiner Schwäche komme, sich demütige, zum Herrn hinzutrete und ihm ein Bekenntnis ablege.</p><p>Man muß wissen, daß zwar* die Wahl dessen, was zu tun ist, in unserer Macht steht.** Das Vollziehen* jedoch liegt, was das Gute betrifft, an der Mitwirkung Gottes, der gemäß seines Vorherwissens mit denen, die mit gutem Gewissen das Gute wählen, mit Recht mitwirkt; was aber das Böse betrifft, am Verlassen Gottes, der wieder gemäß seines Vorherwissens mit Recht [den Bösen] verläßt.</p><p>Es gibt zwei Arten der Verlassung. Es gibt nämlich eine in der Heilsordnung gelegene und erziehliche Verlassung, und es gibt eine vollständige, verwerfende Verlassung. In der Heilsordnung gelegen und erziehlich ist die, die zur Besserung und Rettung und Ehre des Leidenden oder zur Aneiferung und Nachahmung anderer oder zur Ehre Gottes erfolgt. Die vollständige Verlassung aber ist dann da, wenn der Mensch, trotzdem Gott alles zum Heile Dienende getan, vorsätzlich gefühllos und ungeheilt, oder besser gesagt, unheilbar bleibt. Dann wird er dem völligen Verderben überantwortet wie Judas. Möge Gott uns gnädig sein und uns vor einer solchen Verlassung bewahren!</p><p>Man muß wissen, daß es viele Arten der Vorsehung Gottes gibt, die man weder mit Worten erklären noch mit dem Verstande begreifen kann.</p><p>Man muß wissen, daß alle traurigen Geschicke denen, die sie mit Dank annehmen, zum Heil gereichen und gewiß nutzbringend sind.</p><p>Man muß wissen, daß Gott in vorangehender Weise will, daß alle gerettet werden und sein Reich erlangen. Denn nicht zur Bestrafung hat er uns geschaffen, sondem zur Teilnahme an seiner Güte, da er gut ist. Die Bestrafung der Sünder aber* will* er, da er gerecht ist.</p><p>Den ersten [Willen] nun nennt man vorangehenden Willen und Wohlgefallen, da er (Gott) selbst dessen Ursache ist; den zweiten nachfolgenden Willen und Zulassung, da seine Ursache wir sind. Und diese (═ die Zulassung) ist eine doppelte: die eine ist in der Heilsordnung gelegen und erzieht zum Heile, die andere verwirft zur vollen Bestrafung, wie gesagt. Dies aber bezieht sich auf das, was nicht in unserer Macht steht.</p><p>Von dem, was in unserer Macht steht, will er (Gott) das Gute in vorangehender Weise und hat daran sein Wohlgefallen. Das Böse und wirklich Schlechte aber will er weder in vorangehender noch nachfolgender Weise. Er erlaubt es jedoch dem freien Willen. Denn was aus Zwang geschieht, ist nicht vernünftig noch Tugend. Gott sorgt für die ganze Schöpfung, und durch die ganze Schöpfung spendet er Wohltaten und erzieht, ja oft sogar durch die Dämonen, wie bei Job und den Schweinen.</p><h3>XXX. KAPITEL. Vom Vorherwissen und Vorherbestimmen.</h3><p>Man muß wissen, daß Gott alles vorherweiß, aber nicht alles vorherbestimmt. Er weiß vorher, was in unserer Macht steht, aber er bestimmt es nicht vorher. Er will ja nicht, daß die Schlechtigkeit geschehe, noch erzwingt er die Tugend. Daher ist die Vorherbestimmung ein Werk des auf Vorherwissen beruhenden Befehles Gottes. Er bestimmt aber das, was nicht in unserer Macht steht, gemäß seinem Vorherwissen voraus. Denn kraft seines Vorherwissens hat Gott bereits alles nach seiner Güte und Gerechtigkeit vorausentschieden.</p><p>Man muß wissen, daß die Tugend von Gott in die Natur gegeben wurde, daß er selbst Prinzip und Ursache alles Guten ist, und daß wir ohne seine Mitwirkung und Hilfe unmöglich Gutes wollen oder tun können. In unserer Macht aber steht es, entweder in der Tugend zu verharren und Gott zu folgen, der dazu ruft, oder von der Tugend abzugehen, d. i. sich dem Bösen hinzugeben und dem Teufel zu folgen, der ohne Zwang dazu ruft. Denn das Böse ist nichts anderes als ein Zurückweichen vom Guten, wie die Finsternis ein Zurückweichen vom Licht. Bleiben wir also im Naturgemäßen, so sind wir in der Tugend. Weichen wir aber vom Naturgemäßen oder von der Tugend ab, so kommen wir ins Naturwidrige und fallen ins Böse.</p><p>Bekehrung ist die Rückkehr vom Naturwidrigen zum Naturgemäßen und vom Teufel zu Gott durch Übung und Mühen.</p><p>Der Schöpfer hat den Menschen als Mann geschaffen, er hat ihm seine göttliche Gnade mitgeteilt und durch diese ihn in Gemeinschaft mit ihm gebracht. Deshalb hat er auch wie ein Herr den ihm gleichsam als Diener zugewiesenen Tieren prophetisch die Namen gegeben. Denn da er nach Gottes Bild vernünftig und denkend und frei geschaffen ward, hat er mit Recht die Herrschaft übers Irdische vom gemeinsamen Schöpfer und Herrn aller Dinge empfangen.</p><p>Da aber der vorauswissende Gott wußte, daß er sich der Übertretung [des Gebotes] schuldig machen und dem Verderben verfallen werde, schuf er aus ihm ein Weib, eine Gehilfin für ihn, ihm entsprechend. Eine Gehilfin, um nach der Übertretung das Geschlecht durch eine mittels Zeugung zu erzielende Nachkommenschaft zu erhalten. Die ursprüngliche Bildung heißt Erschaffung* (γένεσις)* (genesis) und nicht Zeugung* (γέννησις)* [gennēsis). Erschaffung ist die ursprüngliche Bildung durch Gott, Zeugung aber ist die kraft des Todesurteils wegen der Übertretung erfolgte Abstammung voneinander.</p><p>Diesen (═ den ersten Menschen) versetzte er ins Paradies, das sowohl geistig als sinnlich war. Denn in dem sinnlichen [Paradies] lebte er auf Erden dem Körper nach, der Seele nach aber verkehrte er mit den Engeln, bebaute göttliche Gedanken und nährte sich mit diesen. Nackt ob der Einfachheit und des ungekünstelten Lebens, erhob er sich durch die Geschöpfe zum alleinigen Schöpfer und erfreute und ergötzte sich in seiner Betrachtung.</p><p>Da er ihn von Natur mit freiem Willen ausgestattet, gab er ihm ein Gebot, vom Baume der Erkenntnis nicht zu kosten. Von diesem Baume haben wir im Kapitel vom Paradies, so gut wir es vermochten, zur Genüge gesprochen. Dieses Gebot gab er ihm mit der Verheißung, er werde, wenn er die Würde der Seele bewahre, der Vernunft den Sieg lasse, den Schöpfer anerkenne und dessen Befehl beachte, die ewige Seligkeit erlangen und, dem Tode überlegen, leben in Ewigkeit. Wenn er aber die Seele dem Leibe unterordne und die Lüste des Leibes vorziehe, nachdem er seine Ehre verkannt und, den unvernünftigen Tieren gleich geworden, das Joch des Schöpfers abgeschüttelt und sein göttliches Gebot mißachtet, so werde er dem Tode und Verderben verfallen, der Mühsal unterworfen werden und ein elendes Leben führen. Denn es war zum Vorteil, daß er nicht ohne Erprobung und Bewährung die Unsterblichkeit erlangte, nämlich um nicht in Hochmut und ins Gericht des Teufels zu fallen. Denn infolge der Unsterblichkeit ist jener nach seinem freiwilligen Fall unwiderruflich und unabänderlich im Bösen gefestigt. Andrerseits sind die Engel, nachdem sie freiwillig die Tugend erwählt, durch die Gnade unbeweglich im Guten gegründet.</p><p>Es sollte sich also der Mensch zuerst bewähren — ein ungeprüfter, unbewährter Mann ist keines Wortes wert —, in der Prüfung durch Haltung des Gebotes vollkommen werden und so die Unsterblichkeit als Kampfpreis der Tugend davontragen. Denn, zwischen Gott und die Materie gestellt, sollte er durch Beobachtung des Gebotes, nachdem er sein natürliches Verhältnis zu den Dingen aufgegeben, zur möglichsten Gotteinigung kommen und die unerschütterliche Festigkeit im Guten erlangen. Da er sich aber durch die Übertretung vielmehr zur Materie hingewendet und seinen Geist von seiner Ursache, von Gott, losgerissen, so sollte er dem Verderben anheimfallen, leidensvoll statt leidenslos, sterblich statt unsterblich werden, Paarung und flüssige Zeugung brauchen, sich aus Verlangen nach dem Leben an die Annehmlichkeiten hängen, gleich als könnten diese es enthalten, die aber, die ihn dieser berauben wollen, ungescheut hassen, die Zuneigung von Gott auf die Materie und den Zorn vom wirklichen Feind des Heiles auf den Geschlechtsgenossen (Mitmenschen) übertragen. „Durch den Neid des Teufels “ also ward der Mensch besiegt. Denn nicht ertrug es der neidische, das Gute hassende Dämon, daß wir das Obere (═ den Himmel) erlangen, nachdem* er* wegen seiner Erhebung hinabgestürzt war. Darum betrügt auch der Lügner den Unglücklichen, indem er ihm Hoffnung auf Gottsein macht, führt ihn zur eigenen Höhe des Hochmuts hinauf und stürzt ihn dann in den gleichen Abgrund des Verderbens hinab.</p>
