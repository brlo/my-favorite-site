      <p><em>Genaue Darlegung des orthodoxen Glaubens — Buch 4 (Bibliothek der Kirchenväter).</em></p><h2>Buch 4</h2><h3>I. KAPITEL. Vom Zustand [Christi] nach der Auferstehung.</h3><p>Nach der Auferstehung legte er alle Leiden: Vergänglichkeit, Hunger und Durst, Schlaf und Ermüdung und dergleichen ab. Zwar kostete er auch nach der Auferstehung Speise, aber nicht kraft eines Naturgesetzes — er hatte ja keinen Hunger —, sondern gemäß der Heilsveranstaltung: Er sollte beglaubigen, daß seine Auferstehung Wirklichkeit sei, daß es dasselbe Fleisch sei, das litt und auferstand. Keinen von den Bestandteilen der Natur, nicht den Leib, nicht die Seele, hat er abgelegt, nein, er besitzt sowohl den Leib als die vernünftige und denkende, wollende und wirkende Seele. Und so sitzet er zur Rechten des Vaters und will und wirkt auf göttliche und menschliche Weise unser Heil: auf göttliche, sofern er für alles sorgt, es erhält und regiert; auf menschliche, sofern er sich seines Erdenlebens erinnert und sieht und weiß, daß er von der ganzen vernünftigen Schöpfung angebetet wird. Es weiß ja seine heilige Seele, daß sie hypostatisch mit dem Gott-Logos geeint ist und mitangebetet wird als Seele Gottes und nicht als Seele schlechthin. Auch die Auffahrt von der Erde zum Himmel und die Wiederherabkunft sind Wirksamkeiten eines umschriebenen Leibes. Denn es heißt: „So wird er wieder zu euch kommen, wie ihr ihn zum Himmel hinauffahren sahet.“</p><h3>II. KAPITEL. Vom Sitzen zur Rechten des Vaters.</h3><p>Wir sagen: Christus sitzet körperlich zur Rechten Gottes, des Vaters, allein wir lehren keine örtliche Rechte des Vaters. Denn wie sollte der Unumschriebene eine örtliche Rechte haben? Eine Rechte und Linke haben ja nur umschriebene Wesen. Nein, unter der Rechten des Vaters verstehen wir die Herrlichkeit und die Ehre der Gottheit, in welcher der Sohn Gottes als Gott und wesensgleich mit dem Vater von Ewigkeit existiert und in der er nun, nachdem er in den letzten Zeiten Fleisch geworden, auch körperlich sitzt, da sein Fleisch mitverherrlicht ist. Denn er wird mit seinem Fleisch in* einer* Anbetung von der ganzen Schöpfung angebetet.</p><h3>III. KAPITEL. Gegen die, die einwenden: Wenn Christus zwei Naturen hat, so dienet ihr auch dem Geschöpf, da ihr ja eine geschaffene Natur anbetet, oder ihr sagt, eine Natur sei anzubeten und die andere nicht.</h3><p>Den Sohn Gottes beten wir mit dem Vater und dem Hl. Geiste an, vor der Menschwerdung als unkörperlich und jetzt den nämlichen als Fleisch- und Menschgewordenen und Gott zugleich. Sein Fleisch nun ist seiner eigenen Natur nach, sofern du in feinen Gedanken das Sichtbare vom Geistigen sonderst, nicht anzubeten, da geschaffen. Vereint aber mit dem Gott-Logos, wird es wegen seiner und in ihm angebetet. Der König wird verehrt, mag er nackt oder bekleidet sein. Der Purpur wird als bloßer Purpur getreten und weggeworfen, als königliches Gewand aber geehrt und gerühmt, und wer ihn verunehrt, wird, wie es häufig geschieht, zum Tode verurteilt. Bloßes Holz ist der Berührung nicht unzugänglich, aber mit dem Feuer verbunden und Kohle geworden, wird es [der Berührung] unzugänglich, nicht seiner selbst wegen, sondern wegen des damit verbundenen Feuers, und nicht die Natur des Holzes ist unzugänglich, sondern die Kohle oder das feurige Holz. So ist auch das Fleisch seiner eigenen Natur nach nicht anzubeten. Angebetet jedoch wird es in dem Fleisch gewordenen Gott-Logos nicht seiner selbst willen, sondern wegen des mit ihm hypostatisch geeinten Gott-Logos. Und wir sagen nicht, daß wir bloßes Fleisch anbeten, sondern Fleisch Gottes oder den fleischgewordenen Gott.</p><h3>IV. KAPITEL. Warum ist der Sohn Gottes Mensch geworden, und nicht der Vater und der Geist? Und was hat er geleistet dadurch, daß er Mensch geworden?</h3><p>Der Vater ist Vater und nicht Sohn, der Sohn Sohn und nicht Vater, der Hl. Geist Geist und nicht Vater noch Sohn. Denn die Eigentümlichkeit ist unbeweglich. Oder wie wäre es möglich, daß sie Eigentümlichkeit bliebe, wenn sie bewegt würde und überginge? Darum wird der Sohn Gottes Sohn eines Menschen, damit die Eigentümlichkeit unbewegt bleibe. Denn da er Sohn Gottes war, wurde er Sohn eines Menschen, nahm aus der heiligen Jungfrau Fleisch an und legte seine Sohnes-Eigentümlichkeit nicht ab.</p><p>Der Sohn Gottes ist Mensch geworden, um dem Menschen wiederzugeben, wozu er ihn geschaffen. Geschaffen hatte er ihn nach seinem Bilde, denkend und selbstmächtig, und nach seinem Gleichnis, d. h. vollkommen in Tugenden, soweit es für eines Menschen Natur erreichbar ist. Das sind gleichsam die Kennzeichen der göttlichen Natur: die Kummer- und Sorglosigkeit, die Lauterkeit, die Güte, die Weisheit, die Gerechtigkeit, die Freiheit von jeglichem Übel. Er setzte den Menschen mit sich in Gemeinschaft — „zur Unvergänglichkeit erschuf er ihn “ — und durch die Gemeinschaft mit sich erhob er ihn zur Unvergänglichkeit. Durch die Übertretung des Gebotes aber verdunkelten und verwischten wir die Züge des göttlichen Bildes, gerieten in Schlechtigkeit und wurden der göttlichen Gemeinschaft beraubt — denn „was hat die Finsternis mit dem Lichte gemein?“ —, wir gingen des Lebens verlustig und verfielen dem Verderben des Todes, er gab uns Anteil am Besseren, und wir bewahrten es nicht. Darum nimmt er am Schlechteren, nämlich an unserer Natur teil, um durch sich und in sich die Form des Bildes und Gleichnisses zu erneuern, aber auch um uns den tugendhaften Wandel zu lehren, den er durch sich uns leicht gemacht, um [uns] durch die Lebensgemeinschaft vom Untergang zu befreien, da er der Erstling unserer Auferstehung geworden, um das abgenützte und verbrauchte Gefäß zu erneuern, um uns von der Gewaltherrschaft des Teufels zu erlösen, indem er uns zur Gotteserkenntnis berief, um [uns] zu stärken und zu unterweisen, durch Geduld und Demut den Tyrannen zu bezwingen.</p><p>Nun hat der Dämonenkult aufgehört, die Schöpfung ist durchs göttliche Blut geheiligt, Götzenaltäre und -tempel sind niedergerissen, Gotteserkenntnis ist gepflanzt, die wesensgleiche Dreiheit, die ungeschaffene Gottheit wird angebetet,* ein* wahrer Gott, Schöpfer und Herr aller Dinge, Tugenden werden gepflegt, Auferstehungshoffnung ist durch Christi Auferstehung gegeben, vor den Menschen, die zuvor in Knechtschaft waren, erschrecken die Dämonen, und das Wunderbare ist, daß dies alles durch Kreuz und Leiden und Tod zustandegekommen. Auf der ganzen Erde ist das Evangelium der Gotteserkenntnis verkündet. Nicht durch Krieg und Waffen und Heere hat es die Gegner geschlagen. Nein, Unbewaffnete, Arme, Ungelehrte, Verfolgte, Mißhandelte, dem Tode Überlieferte haben den im Fleische Gekreuzigten und Gestorbenen verkündet und dadurch die Weisen und Mächtigen besiegt. Denn es folgte ihnen die allmächtige Kraft des Gekreuzigten. Der Tod, der ehedem so gefürchtet war, ist überwunden, er, der ehedem so gescheut und gehaßt war, wird jetzt dem Leben vorgezogen. Das sind die Großtaten der Erscheinung Christi, das die Kennzeichen seiner Macht. Denn nicht wie durch Moses hat er nur* ein* Volk aus Ägypten und der Knechtschaft des Pharao errettet, indem er das Meer geteilt, er hat vielmehr die ganze Menschheit vom Verderben des Todes und dem grausamen Tyrannen, der Sünde, befreit. Nicht mit Gewalt trieb er die Sünder zur Tugend, er verschüttete sie nicht mit Erde und verbrannte sie nicht mit Feuer und ließ sie nicht steinigen, sondern mit Sanftmut und Geduld überredete er die Menschen, die Tugend zu wählen und für sie freudig Mühen und Kämpfe auf sich zu nehmen. Ja, einst wurden die Sünder mißhandelt und hielten doch noch an der Sünde fest, die Sünde galt ihnen als Gott. Jetzt wählen sie um Frömmigkeit und Tugend willen Mißhandlungen und Martern und Tod.</p><p>Wohlan, Christus, Wort Gottes, Weisheit und Macht und allherrschender Gott, wie sollen wir Arme dir dieses alles vergelten? Denn dein ist alles, und du verlangst von uns nichts, als daß wir uns retten lassen, und auch dies gibst du selbst und weißt in unsäglicher Güte den Empfängern Dank. Dank dir, der du das Sein gegeben und das Wohlsein geschenkt und die, die dies verloren, in deiner unaussprechlichen Herablassung wieder hierzu zurückgeführt.</p><h3>V. KAPITEL. Gegen die, die fragen, ob die Hypostase Christi geschaffen oder ungeschaffen ist.</h3><p>Die Hypostase des Gott-Logos war vor der Fleischwerdung einfach, nicht zusammengesetzt, unkörperlich und ungeschaffen. Bei der Fleischwerdung aber wurde sie auch für das Fleisch Hypostase, sie ist eine zusammengesetzte geworden, [bestehend] aus der Gottheit, die sie immer hatte, und aus dem Fleische, das sie angenommen. Sie trägt die Eigentümlichkeiten der zwei Naturen, da sie sich in zwei Naturen kenntlich macht. Darum ist sie dieselbe* eine* Hypostase, sowohl ungeschaffen der Gottheit nach als geschaffen der Menschheit nach, sichtbar und unsichtbar. Denn sonst sehen wir uns gezwungen, den einen Christus zu teilen, indem wir zwei Hypostasen annehmen, oder den Unterschied der Naturen zu leugnen und eine Verwandlung und Vermischung einzuführen.</p><h3>VI. KAPITEL. Wann hat Christus seinen Namen erhalten?</h3><p>Die Vernunft* (νοῦς)* [nous] wurde nicht, wie einige falsch lehren, vor der Annahme des Fleisches aus der Jungfrau mit dem Gott-Logos geeint und seit damals Christus genannt. Diese Ungereimtheit gehört zu den Albernheiten des Origenes, der eine Präexistenz der Seele lehrte. Wir aber sagen, der Sohn und das Wort Gottes sei Christus geworden, seitdem er im Schoße der heiligen, immerwährenden Jungfrau Wohnung nahm und ohne Verwandlung Fleisch wurde, und das Fleisch mit der Gottheit gesalbt wurde. „Denn diese ist die Salbung der Menschheit“, wie Gregor der Theologe sagt. Und der so heilige Cyrill von Alexandrien sagt in einem Schreiben an den Kaiser Theodosius (II.) also: „Nach meiner Ansicht wenigstens darf man weder das aus Gott gezeugte Wort ohne Menschheit, noch den aus dem Weibe geborenen Tempel ohne Einigung mit dem Worte Christus Jesus nennen. Denn unter Christus versteht man das in heilsordnungsmäßiger Einigung auf unaussprechliche Weise mit der Gottheit verbundene Wort aus Gott.“ Und an die Kaiserinnen [schreibt er]: „Einige sagen, der Name Christus komme auch dem allein und an und für sich gedachten und existierenden, aus Gott Vater gezeugten Worte zu. Wir aber sind nicht gelehrt worden, so zu denken oder zu reden. Denn wir sagen, das Wort sei damals, als es Fleisch geworden, auch Christus Jesus genannt worden. Weil er von Gott dem Vater mit dem Freudenöl, d. h. mit dem Geiste gesalbt worden ist, darum heißt er Christus. Daß aber die Salbung das Menschliche betraf, daran zweifelt wohl keiner von denen, die richtig zu denken gewohnt sind.“ Und der allberühmte Athanasius sagt in seiner Abhandlung über die heilbringende Erscheinung [Christi] etwa so: „Der präexistierende Gott war vor seinem Leben im Fleische nicht Mensch, sondern er war Gott bei Gott, unsichtbar und leidenslos. Wie er aber Mensch geworden, wird ihm der Name Christus des Fleisches wegen beigelegt, da dem Namen das Leiden und der Tod folgen.“</p><p>Zwar sagt auch die Hl. Schrift: „Deshalb hat dich Gott, dein Gott, mit dem Freudenöl gesalbt.“ Allein man muß wissen, daß die Hl. Schrift oft die Vergangenheit statt der Zukunft gebraucht, so z. B.: „Danach ward er auf Erden gesehen und ist unter den Menschen gewandelt.“ Denn Gott ward noch nicht gesehen und ist nicht unter den Menschen gewandelt, als dieses gesagt wurde. Ferner: „An den Flüssen Babylons saßen wir und weinten.“ Denn das war noch nicht geschehen.</p><h3>VII. KAPITEL. Gegen die, die fragen, ob die heilige Gottesgebärerin zwei Naturen gebar, oder ob zwei Naturen am Kreuze hingen.</h3><p>Das Ungeworden- und Gewordensein —* ἀγἐνητον* [agenēton] und* γενητόν* [genēton] mit* einem ν * [ n ] geschrieben — betrifft die Natur und ist gleichbedeutend mit dem Ungeschaffen- und Geschaffensein. Das Ungezeugt- und Gezeugtsein aber —* ἀγἐννητον * [agennēton] und* γεννητόν* [gennēton] mit zwei ν [ n ] — betrifft nicht die Natur, sondern die Hypostase. Es ist also die göttliche Natur ungeworden oder ungeschaffen, außer der göttlichen Natur aber ist alles geworden oder geschaffen. Man betrachtet nun in der göttlichen und ungeschaffenen Natur das Ungezeugtsein im Vater — denn er ist nicht gezeugt —, das Gezeugtsein im Sohne — denn er ist ewig aus dem Vater gezeugt —, das Ausgehen aber im Hl. Geiste. In jeder Art von Lebewesen sind die ersten zwar ungezeugt, aber nicht ungeworden. Denn sie sind durch den Schöpfer geworden, sie wurden nicht von ihresgleichen erzeugt. Werden* (γένεσις)* [genesis] nämlich ist Schöpfung, Zeugung* (γέννησις)* [gennēsis] aber ist bei Gott der Hervorgang des wesensgleichen Sohnes aus dem Vater allein, bei den Körpern jedoch der Hervorgang einer wesensgleichen Hypostase aus der Verbindung von Männchen und Weibchen. Daraus erkennen wir, daß das Gezeugtwerden nicht Sache der Natur, sondern der Hypostase ist. Denn wäre es Sache der Natur, so betrachtete man nicht in der [nämlichen] Natur das Gezeugte und das Ungezeugte. Eine Hypostase also gebar die heilige Gottesgebärerin. Diese stellt sich in zwei Naturen dar. Der Gottheit nach ist sie zeitlos aus dem Vater gezeugt, zuletzt aber, in der Zeit, nahm sie aus ihr (═ der Gottesgebärerin) Fleisch an und wurde dem Fleische nach geboren.</p><p>Sollten aber die Frager sticheln und sagen, der aus der heiligen Gottesgebärerin Geborene habe zwei Naturen, so antworten wir: Ja, er hat zwei Naturen, denn der nämliche ist Gott und Mensch. Ebenso [sagen wir] auch bezüglich der Kreuzigung, Auferstehung und Himmelfahrt. Dieses ist nämlich nicht Sache der Natur, sondern der Hypostase. Es litt also Christus, der in zwei Naturen existiert, und er wurde gekreuzigt der leidensfähigen Natur nach. Denn dem Fleische und nicht der Gottheit nach hing er am Kreuze. Sollten sie auf unsere Frage: Sind zwei Naturen gestorben? antworten: Nein, so werden wir sagen: Also sind auch nicht zwei Naturen gekreuzigt worden. Nein, Christus oder das menschgewordene göttliche Wort wurde geboren, wurde geboren dem Fleische nach, wurde gekreuzigt dem Fleische nach, litt dem Fleische nach, starb dem Fleische nach, während seine Gottheit leidenslos blieb.</p><h3>VIII. KAPITEL. Wie kann der eingeborene Sohn Gottes Erstgeborener heißen?</h3><p>Erstgeborener ist der zuerst Geborene, mag er nun Eingeborener oder auch älter als die andern Brüder sein. Würde nun der Sohn Gottes Erstgeborener genannt, Eingeborener aber nicht genannt, so könnten wir meinen, er sei unter Geschöpfen zuerst geboren, gleich als wäre er ein Geschöpf. Da er aber sowohl Erstgeborener als auch Eingeborener genannt wird, so muß man auch beides bei ihm festhalten. „Erstgeboren vor aller Schöpfung “ nennen wir ihn, da sowohl er aus Gott, als auch die Schöpfung aus Gott ist. Aber er, der allein zeitlos aus der Wesenheit Gottes, des Vaters, gezeugt ist, wird mit Recht eingeborener, erstgeborener und nicht erstgeschaffener Sohn genannt werden. Denn die Schöpfung ist nicht aus der Wesenheit des Vaters, sondern durch seinen Willen aus dem Nichtsein ins Sein hervorgebracht. „Erstgeborener aber unter vielen Brüdern “ — als Eingeborener ist er ja auch aus der Mutter [geboren] — [wird er genannt], weil er gleich uns an Blut und Fleisch teil hatte und Mensch wurde, und auch wir durch ihn „Söhne Gottes “ wurden, da durch die Taufe unsere Annahme an Kindesstatt erfolgte. Er, der Sohn Gottes von Natur, ist Erstgeborener geworden unter uns, die wir durch Annahme und Gnade „Söhne Gottes“ wurden und als seine Brüder gelten. Deshalb sprach er: „Ich steige hinauf zu meinem Vater und zu eurem Vater.“ Er sagte nicht: unserem Vater, sondern „meinem Vater“, [Vater] nämlich von Natur, und „eurem Vater“, [Vater] durch Gnade. Und [er sprach]: „zu meinem Gott und eurem Gott.“ Er sagte nicht: unserem Gott, sondern „meinem Gott“ — sofern du in feinen Gedanken das Sichtbare vom Geistigen trennst — und „eurem Gott“, als dem Schöpfer und Herrn.</p><h3>IX. KAPITEL. Von dem Glauben und der Taufe</h3><p>Wir bekennen* eine* Taufe „zur Vergebung der Sünden “ und zum ewigen Leben. Die Taufe bedeutet den Tod des Herrn. Wir werden nämlich durch die Taufe mit dem Herrn begraben, wie der göttliche Apostel sagt. Gleichwie nun der Herr einmal gestorben ist, so müssen auch wir einmal getauft werden, getauft werden aber nach dem Worte des Herrn auf den Namen des Vaters und des Sohnes und des Hl. Geistes, wodurch uns das Bekenntnis des Vaters und des Sohnes und des Hl. Geistes gelehrt wird. Alle also, die auf den Vater, Sohn und Hl. Geist getauft und über die eine Natur der Gottheit in drei Personen belehrt sind und trotzdem sich wieder taufen lassen, die kreuzigen Christus von neuem, wie der göttliche Apostel sagt: „Denn es ist unmöglich, die, die einmal erleuchtet worden usf., wieder zur Buße zu erneuern, weil sie für sich Christus von neuem kreuzigen und zum Gespötte machen.“ Alle, die nicht auf die heilige Dreifaltigkeit getauft sind, die müssen wiedergetauft werden. Denn wenn auch der göttliche Apostel sagt: „Wir sind auf Christus und seinen Tod getauft, so sagt er doch nicht, die Anrufung bei der Taufe müsse in dieser Weise geschehen, sondern die Taufe sei ein Bild des Todes Christi. Durch die drei Untertauchungen deutet nämlich die Taufe die drei Tage an, in denen der Herr im Grabe lag. Auf Christus getauft sein bedeutet also im Glauben an ihn getauft werden. Unmöglich aber ist es, an Christus zu glauben, wenn man nicht gelernt hat, Vater, Sohn und Hl. Geist zu bekennen. Denn Christus ist der Sohn des lebendigen Gottes, den der Vater mit dem Hl. Geiste gesalbt hat, wie der göttliche David sagt: „Darum hat dich Gott, dein Gott, mit dem Öl der Freude gesalbt vor deinen Genossen.“ Und Isaias [sagt] in der Person des Herrn: „Der Geist des Herrn ist über mir. Darum hat er mich gesalbt.“ Da jedoch der Herr seinen Jüngern die Anrufung lehrte, sprach er: „Taufet sie auf den Namen des Vaters und des Sohnes und des Hl. Geistes.“ Denn Gott hat uns zur Unsterblichkeit geschaffen, nach Übertretung seines heilsamen Gebotes aber zur Vergänglichkeit des Todes verurteilt, damit das Böse nicht unsterblich sei. Da er jedoch barmherzig ist, ist er zu den Knechten herabgestiegen; er ist uns gleich geworden und hat uns durch sein eigenes Leiden vom Verderben erlöst. Er ließ uns aus seiner heiligen, unbefleckten Seite eine Quelle der Vergebung entspringen: Wasser zur Wiedergeburt und Abwaschung der Sünde und des Verderbens, Blut zum Trank, der ewiges Leben vermittelt. Er hat uns den Auftrag gegeben, wir sollen durch Wasser und Geist wiedergeboren werden, indem durch Gebet und Anrufung der Hl. Geist zum Wasser hinzukommt. Da der Mensch zweifach ist, aus Seele und Leib [besteht], gab er uns auch eine zweifache Reinigung, durch Wasser und Geist: der Geist erneuert in uns die Form des Bildes und Gleichnisses, das Wasser aber reinigt durch die Gnade des Geistes den Leib von der Sünde und befreit ihn von der Vergänglichkeit; das Wasser stellt das Bild des Todes dar, der Geist aber reicht das Pfand des Lebens.</p><p>Am Anfang „schwebte der Geist Gottes über den Wassern “. Und von Anfang an stellt die Schrift dem Wasser das Zeugnis aus, daß es ein Reinigungsmittel ist. Durch Wasser tilgte Gott zu Noës Zeit die Sünde der Welt. Durch Wasser wird nach dem Gesetz jeder Unreine gereinigt, selbst die Kleider werden mit dem Wasser gewaschen. Elias zeigte, daß die Gnade des Geistes mit dem Wasser in Verbindung stehe: mit Wasser verbrannte er das Brandopfer. Und fast alles wird nach dem Gesetz mit Wasser gereinigt. Denn das Sichtbare ist Sinnbild des Geistes. Die Wiedergeburt geschieht an der Seele. Der Glaube kann uns, obwohl wir Geschöpfe sind, durch den Geist zu Söhnen (Kindern) machen und zur ursprünglichen Seligkeit führen.</p><p>Die Vergebung der Sünden wird allen in gleicher Weise durch die Taufe verliehen, die Gnade des Geistes aber „nach Maßgabe des Glaubens “ und der vorhergehenden Reinigung. Jetzt also empfangen wir durch die Taufe „die Erstlingsfrucht, den Hl. Geist “, und die Wiedergeburt ist für uns Anfang eines andern Lebens und Siegel und Schutzwehr und Erleuchtung.</p><p>Wir müssen aber mit aller Kraft uns selbst „in sicherem Gewahrsam“ rein von schmutzigen Werken „halten “, um nicht wie ein Hund wieder zum eigenen Gespei zurückzukehren und uns abermals zu Sklaven der Sünde zu machen. Denn „Glaube ohne Werke ist tot “, gleichwie auch Werke ohne Glauben. Der wahre Glaube bewährt sich durch die Werke.</p><p>Wir werden auf die heilige Dreieinigkeit getauft. Denn das, was getauft wird, bedarf zu seinem dauernden Bestand der heiligen Dreieinigkeit, und es ist unmöglich, daß die drei Personen nicht beisammen sind. Ungetrennt ist ja die heilige Dreiheit.</p><p>Die erste Taufe war die der Sintflut zur Tilgung der Sünde. Die zweite war die [Taufe] durch das Meer und die Wolke. Die Wolke war nämlich das Sinnbild des Geistes, das Meer das des Wassers. Die dritte war die gesetzliche. Denn jeder Unreine wusch sich mit Wasser und wusch seine Kleider, und so trat er in das Lager ein. Die vierte war die des Johannes. Sie war eine einführende, sie führte die, die sich taufen ließen, zur Buße, auf daß sie an Christus glaubten. „Ich“, sagt er, „taufe euch mit Wasser. Der nach mir kommt“, sagt er,... „der wird euch mit Hl. Geist und Feuer taufen.“ Johannes reinigt also durch Wasser voraus zum Empfang des Geistes. Die fünfte war die Taufe des Herrn, mit der er sich selbst taufen ließ. Er läßt sich taufen, nicht als bedürfte er selbst einer Reinigung, sondern weil er meine Reinigung sich zueignet, um die Köpfe der Drachen im Wasser zu zermalmen, um die Sünde abzuwaschen und den ganzen alten Adam im Wasser zu begraben, um den Täufer zu heiligen, um das Gesetz zu erfüllen, um das Geheimnis der Dreieinigkeit zu offenbaren, um uns ein Vorbild und Beispiel zu werden, daß wir uns taufen lassen. Auch wir werden mit der vollkommenen Taufe des Herrn getauft, mit der durch Wasser sowohl als [mit der] durch Geist. Mit Feuer aber, heißt es, taufe Christus, weil er in Gestalt feuriger Zungen die Gnade des Geistes über die heiligen Apostel ausgoß, wie der Herr selbst sagt: „Johannes hat mit Wasser getauft, ihr aber werdet nach wenigen Tagen mit heiligem Geist und Feuer getauft werden “, oder wegen der Straftaufe des künftigen Feuers. Die sechste ist* die durch Buße und Tränen,* in der Tat eine mühselige. Die siebente ist* die durch Blut und Martyrium, mit der auch Christus selbst sich* für uns* taufen ließ.* Sie ist ja sehr erhaben und selig,* da sie durch keine zweite Befleckung mehr besudelt wird.* Die achte, die letzte, ist nicht heilbringend. Sie hebt zwar die Bosheit auf, denn nicht mehr waltet da Bosheit und Sünde, aber sie straft ohne Ende.</p><p>In körperlicher Gestalt* wie eine Taube* kam der Hl. Geist [auf Christus] herab, er zeigte die Erstlingsfrucht unserer Taufe an und* ehrte den Leib. Denn auch dieser,* nämlich der Leib,* war durch die Vergottung Gott, und außerdem pflegte ehedem eine Taube das Aufhören der Flut zu verkünden.* Auf die heiligen Apostel aber kommt er in feuriger Gestalt herab. Denn er ist Gott, „Gott aber ist ein verzehrendes Feuer.“</p><p>Das Öl wird zur Taufe genommen, weil es unsere Salbung anzeigt, uns zu Christen (Gesalbten) macht und uns durch den Hl. Geist das Erbarmen Gottes verheißt. Es hat ja auch die Taube den aus der Flut Geretteten einen Ölzweig gebracht.</p><p>Johannes ward durch Auflegung seiner Hand aufs göttliche Haupt des Herrn und durch sein eigenes Blut getauft.</p><p>Man darf die Taufe nicht verschieben, wenn durch Werke der Glaube der Hinzutretenden bezeugt ist. Wer hinterlistig zur Taufe tritt, wird, weit entfernt, einen Nutzen davon zu haben, vielmehr verdammt werden.</p><h3>X. KAPITEL. Vom Glauben.</h3><p>Der Glaube ist zweifach. Denn „der Glaube kommt vom Hören “. Wir hören die heiligen Schriften und glauben der Lehre des Hl. Geistes. Dieser [Glaube] wird vollendet durch alles, was von Christus angeordnet ist, er ist im Werke gläubig und fromm und vollbringt die Gebote dessen, der uns erneuert hat. Denn wer nicht „entsprechend der Überlieferung “ der katholischen Kirche glaubt oder durch verkehrte Werke mit dem Teufel Gemeinschaft hat, ist ein Ungläubiger.</p><p>Weiterhin „ist aber der Glaube die Zuversicht auf das, was man hofft, die Überzeugung von Dingen, die man nicht sieht “, oder die zuversichtliche und zweifellose Hoffnung auf die uns von Gott gegebenen Verheißungen und die Erfüllung unserer Bitten. Der erste [Glaube] ist Sache unserer Entscheidung, der zweite gehört zu den Gnadengaben des Geistes.</p><p>Man muß wissen, daß wir durch die Taufe an der ganzen, von Geburt an vorhandenen Hülle oder an der Sünde beschnitten werden und geistige Israeliten und „Volk Gottes “ werden.</p><h3>XI. KAPITEL. Vom Kreuze. Dabei noch einmal vom Glauben.</h3><p>„Das Wort vom Kreuze ist denen, die verloren gehen, eine Torheit, uns aber, die gerettet werden, eine Gotteskraft.“ Denn „der Geistige beurteilt alles, ein [bloß] seelischer Mensch aber nimmt nicht an, was des Geistes ist.“ Torheit nämlich ist es (═ das Wort vom Kreuze) für die, die es nicht im Glauben annehmen und nicht die Güte und Allmacht Gottes bedenken, sondern mit menschlichen und natürlichen Gedanken das Göttliche erforschen. Denn alles, was Gottes ist, ist über Natur und Wort und Gedanke erhaben. Bedenkt einer, wie und warum Gott alles aus dem Nichtsein ins Sein hervorgebracht und will er es mit natürlichen Gedanken ergründen, so erfaßt er es nicht. Denn diese Erkenntnis ist seelisch und dämonisch. Hält aber einer, vom Glauben geleitet, die Gottheit für gut, allmächtig, wahrhaft, weise und gerecht, so wird er alles glatt und eben und einen geraden Weg finden. Denn ohne Glauben ist es unmöglich, gerettet zu werden. Auf Glauben beruht ja alles, das Menschliche wie das Geistige. Ohne Glauben durchfurcht weder der Landmann die Erde, noch vertraut der Kaufmann auf kleinem Boot sein Leben dem rasenden Meere an, noch werden Ehen gegründet, noch [geschieht] etwas anderes von dem, was im Leben [vorkommt]. Durch den Glauben erkennen wir, daß alles durch Gottes Kraft aus dem Nichtsein ins Sein gelangt ist. Durch den Glauben vollbringen wir alles Göttliche und Menschliche. Glaube aber ist Zustimmung ohne Grübelei.</p><p>Wohl ist jede Handlung und Wundertat Christi überaus groß und göttlich und wunderbar, aber bewundernswerter als alle ist sein kostbares Kreuz. Denn durch nichts anderes ward der Tod vernichtet, die Sünde des Stammvaters nachgelassen, die Hölle beraubt, die Auferstehung geschenkt, die Kraft uns gegeben, das Gegenwärtige, ja selbst den Tod zu verachten, die Rückkehr zur ursprünglichen Seligkeit vollführt, das Paradiesestor geöffnet, unsere Natur zur Rechten Gottes gesetzt, [durch nichts anderes] sind wir Gotteskinder und Erben geworden als durch das Kreuz unseres Herrn Jesus Christus. Durch das Kreuz ward ja alles vollbracht. Sagt doch der Apostel: „Wir alle, die wir auf Christus getauft sind, sind auf seinen Tod getauft „Wir alle, die wir auf Christus getauft sind, haben Christus angezogen.“ „Christus ist Gottes Kraft und Gottes Weisheit.“ Siehe, der Tod Christi oder das Kreuz hat uns mit der subsistierenden Weisheit und Kraft Gottes bekleidet. Eine Gotteskraft aber ist das Wort vom Kreuze, entweder weil durch dasselbe die Kraft Gottes oder der Sieg über den Tod uns kundgemacht ward, oder weil durch die Kraft Gottes die Höhe und die Tiefe, Länge und Breite, d. h. alle sichtbare und unsichtbare Schöpfung zusammengehalten wird, gleichwie die vier Kreuzesenden durch das mittlere Zentrum gehalten und verbunden sind.</p><p>Dieses [Kreuz] ist uns als Zeichen auf die Stirne gegeben, wie Israel die Beschneidung. Denn durch dasselbe unterscheiden wir Gläubige uns von den Ungläubigen und erkennen uns. Dieses ist Schild und Waffe und Siegeszeichen gegen den Teufel. Dieses ist ein Siegel, daß uns der Erwürger nicht berühre, wie die Schrift sagt. Dieses ist Aufrichtung der Liegenden, Halt der Stehenden, Stütze der Schwachen, Stab der Geleiteten, Führer der Umkehrenden, Vollendung der Fortschreitenden, Heil der Seele und des Leibes, Abwehr aller Übel, Gewähr aller Güter, Tilgung der Sünde, Reis der Auferstehung, Baum ewigen Lebens.</p><p>Dieses wirklich kostbare und verehrungswürdige Holz (Kreuz) nun, an dem sich Christus selbst für uns zum Opfer gebracht, ist zu verehren, da es durch die Berührung des heiligen Leibes und Blutes geheiligt ist, desgleichen die Nägel, die Lanze, die Kleider und seine heiligen Stätten, als da sind: die Krippe, die Höhle, das heilbringende Golgatha, das lebengebende Grab, Sion, die Burg der Kirchen, und dergleichen. So sagt der Stammvater Gottes, David: „Laßt uns in sein Zelt eintreten, anbeten an dem Ort, wo seine Füße standen.“ Daß er aber das Kreuz meint, zeigt das folgende: „Steh auf, Herr, zu deinem Ruheorte.“ Die Auferstehung folgt ja auf das Kreuz. Wenn [uns] Haus und Bett und Kleid der Lieben teuer sind, um wieviel mehr das, was Gottes und des Erlösers ist, wodurch wir ja auch gerettet worden sind.</p><p>Wir verehren aber auch das Bild des kostbaren und lebenspendenden Kreuzes, mag es auch aus anderem Stoff bestehen. Wir ehren ja nicht den Stoff - das sei ferne -, sondern das Bild als Sinnbild Christi. Denn so erklärte er seinen Jüngern: „Alsdann wird das Zeichen des Menschensohnes am Himmel erscheinen “, nämlich das Kreuz. Darum sprach auch der Auferstehungsengel zu den Frauen: „Ihr suchet Jesus von Nazareth, den Gekreuzigten.“ Und der Apostel: „Wir predigen Christus, den Gekreuzigten.“ Es gibt viele Christusse und Jesusse, aber nur* einen* Gekreuzigten. Er sagte nicht: den mit der Lanze Durchbohrten, sondern den Gekreuzigten. Deshalb ist das Zeichen Christi zu verehren. Denn wo das Zeichen ist, da wird auch er selbst sein. Der Stoff aber, aus dem das Kreuzesbild besteht, ist, selbst wenn es Gold oder kostbare Steine wären, nach der etwaigen Zerstörung des Bildes nicht zu verehren. Somit verehren wir alles, was Gott geweiht ist, indem wir ihm (═ Gott) die Verehrung bezeigen.</p><p>Ein Vorbild dieses kostbaren Kreuzes war der von Gott im Paradiese gepflanzte Baum des Lebens. Denn da durch einen Baum der Tod [gegeben worden], so mußte durch einen Baum das Leben und die Auferstehung geschenkt werden. Zuerst hat Jakob, da er die Spitze von Josephs Stab verehrte, das Kreuz angedeutet, und als er mit übereinandergelegten Händen dessen Söhne segnete, hat er ganz deutlich das Zeichen des Kreuzes beschrieben. [Ferner deuteten das Kreuz an] der Stab des Moses, der in Kreuzesform das Meer schlug und Israel rettete, den Pharao aber ertränkte, die kreuzweise ausgestreckten und den Amalek (═ die Amalekiter) schlagenden Hände, das bittere, durch Holz süß gemachte Wasser, der durch Holz gesprengte, wasserströmende Fels, der Stab, der Aaron die Würde des Priestertums verlieh, die wie ein Siegeszeichen am Holze erhöhte Schlange — sie ward gleichsam getötet. Die den toten Feind gläubig anblickten, rettete das Holz. So ward Christus im „sündigen Fleische “, das keine Sünde kannte, an [das Holz] genagelt — der große Moses, der rief: „Ihr werdet euer Leben am Holze hängend vor euren Augen sehen “, Isaias [wenn er sagt]: „Den ganzen Tag streckte ich meine Hände aus nach einem ungläubigen und widerspenstigen Volke.“ — Möchten doch wir, die es (═ das Kreuz) verehren, Christi des Gekreuzigten teilhaftig werden! Amen.</p><h3>XII. KAPITEL. Von der Anbetung gegen Sonnenaufgang.</h3><p>Nicht zufällig und grundlos beten wir gegen Aufgang an. Nein. Weil wir aus einer sichtbaren und unsichtbaren oder geistigen und sinnlichen Natur zusammengesetzt sind, bringen wir dem Schöpfer auch eine doppelte Anbetung dar, gleichwie wir sowohl mit dem Geist als mit den leiblichen Lippen psallieren, mit Wasser und Geist getauft werden und uns auf doppelte Weise mit dem Herrn vereinigen, indem wir an den Mysterien (Sakramenten) und an der Gnade des Geistes teilhaben.</p><p>Weil Gott ein geistiges Licht ist, und Christus in den Schriften „Sonne der Gerechtigkeit “ und „Aufgang “ heißt, darum gilt es, ihm den Aufgang zur Anbetung zu weihen. Denn alles Schöne muß man Gott weihen. Durch ihn ist alles Gute gut. Es sagt auch der göttliche David: „Ihr Reiche der Erde, singet Gott, lobsinget dem Herrn, der über dem höchsten Himmel einherfährt gegen Aufgang.“ Ferner sagt die Hl. Schrift: „Gott hatte einen Garten gepflanzt, in Eden gegen Aufgang; dorthin versetzte er den Menschen, den er gebildet.“ Nach der Übertretung vertrieb er ihn und siedelte ihn gegenüber dem Garten der Wonne an, natürlich gegen Untergang. Wir suchen also das alte Vaterland und blicken zu ihm auf, wenn wir Gott anbeten. Auch das mosaische Zelt hatte den Vorhang und den Sühnedeckel [der Bundeslade] gegen Aufgang. Der Stamm Juda schlug sein Lager gegen Aufgang auf, da er einen Ehrenvorzug besaß. In dem berühmten salomonischen Tempel war die Pforte des Herrn gegen Aufgang gelegen. Ja, auch der Herr sah gegen Untergang, als er am Kreuze war, und so sehen wir auf ihn hin und beten an. Und als er [in den Himmel] aufgenommen wurde, schwebte er gegen Aufgang, und so beteten ihn die Apostel an, und „er wird genau so wiederkommen, wie sie ihn zum Himmel hinauffahren sahen “, wie der Herr selbst sagte: „Gleichwie der Blitz gegen Aufgang ausgeht und bis Untergang leuchtet, so wird es mit der Ankunft des Menschensohnes sein.“ Darum beten wir, weil wir ihn erwarten, gegen Aufgang an. Diese Überlieferung der Apostel ist nicht aufgeschrieben. Denn vieles haben sie uns ungeschrieben überliefert.</p><h3>XIII. KAPITEL. Von den heiligen, makellosen Mysterien des Herrn.</h3><p>Der gute, allgute, übergute Gott, der ganz Güte ist, ertrug es ob des überströmenden Reichtums seiner Güte nicht, daß nur das Gute, d. h. seine eigene Natur, existiere, ohne daß jemand daran teilnehme, und eben deswegen schuf er zuerst die geistigen und himmlischen Mächte, dann die sichtbare und sinnliche Welt, dann aus Geistigem und Sinnlichem den Menschen. Alles von ihm Geschaffene hat dem Sein nach an seiner Güte teil. Denn er selbst ist für alles das Sein, da das Seiende in ihm ist, nicht bloß weil* er* es aus dem Nichtsein ins Sein gerufen, sondern weil* seine* Wirksamkeit das von ihm Geschaffene bewahrt und erhält. In höherem Maße [bewahrt und erhält er] die lebenden Wesen. Denn sie nehmen am Guten teil, sofern sie sowohl das Sein als das Leben besitzen. Aber noch mehr die vernünftigen Wesen, sowohl mit Rücksicht auf das eben Gesagte als auch mit Rücksicht auf die Vernunft. Denn sie sind gewissermaßen näher mit ihm verwandt, wenn er sie auch sicherlich unvergleichlich überragt.</p><p>Der Mensch hatte, da er vernünftig und selbstmächtig war, die Macht empfangen, sich durch eigene Wahl unaufhörlich mit Gott zu vereinigen, wenn anders er im Guten, d, h. im Gehorsam gegen den Schöpfer beharrte. Weil er nun das Gebot dessen, der ihn geschaffen, übertrat und dem Tode und Verderben verfiel, wurde der Schöpfer und Bildner unseres Geschlechtes „in seinem herzlichen Erbarmen “ uns gleich, er wurde in allem, die Sünde ausgenommen, Mensch und vereinigte sich mit unserer Natur. Denn da er uns sein Bild und seinen Geist mitgeteilt, und wir sie nicht bewahrten, nimmt er selbst unsere arme und schwache Natur an, um uns rein und unvergänglich und wieder seiner Gottheit teilhaftig zu machen.</p><p>Es sollte aber nicht bloß der Erstling unserer Natur zur Teilnahme am Guten gelangen, nein, es sollte auch jeder Mensch, der will, in zweiter Geburt geboren und mit einer neuen, der Geburt entsprechenden Speise genährt werden und so das Maß der Vollkommenheit erreichen. Durch seine Geburt oder Fleischwerdung, seine Taufe, sein Leiden und seine Auferstehung befreite er die Natur von der Sünde des Stammvaters, von dem Tode und dem Verderben, er ist der Erstling der Auferstehung geworden und hat sich selbst zum Weg und Vorbild und Beispiel gemacht, damit auch wir seinen Spuren folgen und durch Annahme werden, was er von Natur ist: Söhne und Erben Gottes und seine Miterben. Er gab uns also, wie gesagt, eine zweite Geburt. Wie wir, aus Adam geboren, ihm gleich wurden und den Fluch und das Verderben erbten, so sollten wir auch, aus ihm geboren, ihm gleich werden und seine Unvergänglichkeit, seinen Segen und seine Herrlichkeit erben.</p><p>Da dieser Adam geistig ist, mußte auch die Geburt geistig sein, ebenso auch die Speise. Aber weil wir Doppelwesen und zusammengesetzt sind, muß auch die Geburt doppelt, desgleichen auch die Speise zusammengesetzt sein. Die Geburt nun ist uns durch Geist und Wasser, nämlich durch die Taufe, gegeben. Die Speise aber ist „das Brot des Lebens “ selbst, unser Herr Jesus Christus, der vom Himmel herabgekommen. Im Begriffe, den freiwilligen Tod für uns auf sich zu nehmen, in der Nacht, in der er sich überlieferte, vermachte er seinen heiligen Jüngern und Aposteln und durch sie allen, die an ihn glauben, ein neues Testament. Nachdem er im Obergemach des heiligen und herrlichen Zion mit seinen Jüngern das alte Pascha gegessen und das Alte Testament erfüllt, wäscht er den Jüngern die Füße, die heilige Taufe versinnbildend. Dann brach er Brot und gab es ihnen mit den Worten: „Nehmet hin und esset, das ist mein Leib, der für euch gebrochen wird zur Vergebung der Sünden.“ Desgleichen nahm er auch den Kelch mit Wein und Wasser und reichte ihnen denselben mit den Worten: „Trinket alle daraus, das ist mein Blut des Neuen Bundes, das für euch vergossen wird zur Vergebung der Sünden. Tuet dies zu meinem Andenken.“ Denn so oft ihr dieses Brot esset und diesen Kelch trinket, verkündet ihr den Tod des Menschensohnes und bekennet seine Auferstehung, bis er kommt.</p><p>Wenn „das Wort Gottes lebendig und wirksam ist “, und der Herr alles, was er wollte, gemacht hat, wenn er sprach; „Es werde Licht “ — und es ward —, „es werde das Firmament “ — und es ward —, wenn „durch das Wort des Herrn die Himmel geschaffen sind und durch den Hauch seines Mundes ihr ganzes Heer “, wenn der Himmel und die Erde, Wasser und Feuer und Luft und all ihr Schmuck und vollends dieses hochgefeierte Wesen, der Mensch, durch das Wort des Herrn entstanden, wenn der Gott-Logos selbst freiwillig Mensch wurde, und das reine, unbefleckte Geblüte der heiligen, immerwährenden Jungfrau sich ohne Samen zum Fleische bildete — kann er dann nicht das Brot zu seinem Leib und den Wein und das Wasser zu seinem Blute machen? Er sprach am Anfang: „Es bringe die Erde zartes Grün hervor “, und bis jetzt bringt sie, durchs göttliche Gebot gedrängt und befähigt, ihre Gewächse hervor. Es sprach Gott: „Das ist mein Leib“, und: „Das ist mein Blut“, und: „Das tuet zu meinem Andenken.“ Und durch sein allmächtiges Gebot geschieht es, bis er kommt. Denn so heißt es: „Bis er kommt.“ Und es kommt durch die Anrufung (Epiklese) als Regen auf dies neue Ackerfeld die überschattende Kraft des Hl. Geistes. Denn wie Gott alles, was er gemacht, durch die Wirksamkeit des Hl. Geistes gemacht hat, so schafft auch jetzt die Wirksamkeit des Hl. Geistes das Übernatürliche, das nur der Glaube fassen kann. „Wie wird mir das geschehen,“ sagt die heilige Jungfrau, „da ich keinen Mann erkenne?“ Der Erzengel Gabriel antwortet: „Der Hl. Geist wird auf dich herabkommen, und die Kraft des Allerhöchsten dich überschatten.“ Und jetzt fragst du, wie das Brot Leib Christi und der Wein und das Wasser Blut Christi wird. Auch ich sage dir: Der Hl. Geist kommt hinzu und wirkt das, was Begreifen und Denken übersteigt.</p><p>Es wird Brot und Wein genommen. Denn Gott kennt die menschliche Schwachheit. Sie wendet sich nämlich meist von dem, was nicht in gewohnheitsmäßigem Gebrauche ist, unwillig ab. In seiner gewohnten Herablassung also bewirkt er auch durch das, woran die Natur gewöhnt ist, das Übernatürliche. Weil die Menschen sich mit Wasser zu waschen und mit Öl zu salben pflegen, so verband er bei der Taufe mit Öl und Wasser die Gnade des Geistes und machte sie zum „Bade der Wiedergeburt.“ Und weil die Menschen Brot zu essen und Wasser und Wein zu trinken pflegen, so verband er mit ihnen seine Gottheit und machte sie zu einem Leib und Blut, damit wir durch das Gewohnte und Natürliche das Übernatürliche erlangen.</p><p>Der Leib ist wahrhaft mit der Gottheit vereint, der Leib aus der heiligen Jungfrau, nicht als ob der [in den Himmel] aufgenommene Leib vom Himmel herabkäme, sondern weil das Brot und der Wein selbst in Leib und Blut Gottes verwandelt wird. Fragst du aber, wie es geschieht, so genügt dir zu hören, daß es durch den Hl. Geist [geschieht]. So bildete auch der Herr aus der heiligen Gottesgebärerin durch den Hl. Geist für sich und in sich Fleisch. Und mehr wissen wir nicht, als daß das Wort Gottes wahr und wirksam und allmächtig ist, das Wie aber ist unerforschlich. Zweckdienlich ist auch folgende Bemerkung: Wie auf natürliche Weise das Brot durch Essen und der Wein und das Wasser durch Trinken in Leib und Blut des Essenden und Trinkenden verwandelt werden, und nicht ein Leib entsteht, der von seinem früheren Leibe verschieden ist, so wird auch das Opferbrot und Wein und Wasser durch die Anrufung und Herabkunft des Hl. Geistes auf übernatürliche Weise in den Leib und das Blut Christi verwandelt, und es sind nicht zwei, sondern es ist ein und derselbe.</p><p>Es gereicht denen, die es im Glauben würdig empfangen, „zur Vergebung der Sünden “, zum ewigen Leben und zum Schutze des Leibes und der Seele; denen aber, die es im Unglauben unwürdig genießen, zur Züchtigung und Strafe, gleichwie auch der Tod des Herrn den Gläubigen Leben und Unvergänglichkeit zum Genusse der ewigen Seligkeit ist, den Ungläubigen und Mördern des Herrn aber zur ewigen Strafe und Pein gereicht.</p><p>Das Brot und der Wein sind nicht ein Bild des Leibes und Blutes Christi — das sei ferne —, sondern der vergottete Leib des Herrn selbst. Denn der Herr selber sprach: „Das ist mein Leib“, nicht: [Das ist] ein Bild des Leibes, und nicht: [Das ist] ein Bild des Blutes, sondern: „[Das ist] mein Blut.“ Und vorher sagte er zu den Juden: „Wenn ihr das Fleisch des Menschensohnes nicht esset und sein Blut nicht trinket, so habt ihr kein Leben in euch. Denn mein Fleisch ist wahrhaftige Speise, und mein Blut ist wahrhaftiger Trank.“ Und wiederum: „Wer mich ißt, wird leben.“</p><p>Darum wollen wir mit aller Ehrfurcht, reinem Gewissen und zuversichtlichem Glauben hinzutreten, und gewiß wird uns geschehen, wie wir glauben, wenn wir nicht zweifeln. Ehren wir es (═ Leib und Blut Christi) durch jegliche Reinheit, seelische wie leibliche, denn es ist zweifach. Treten wir mit glühendem Verlangen zu ihm hin und empfangen wir, die flachen Hände kreuzweise gelegt, den Leib des Gekreuzigten. Halten wir Augen, Lippen und Stirne hin und nehmen wir die göttliche (glühende) Kohle, damit das Feuer sehnsüchtiger Liebe in uns, verbunden mit der Glut der Kohle, unsere Sünden verbrenne und unsere Herzen erleuchte, und wir durch die Teilnahme am göttlichen Feuer feurig und vergottet werden. Eine glühende Kohle sah Isaias. Kohle ist nicht einfaches, sondern mit Feuer vereintes Holz. So ist auch das Brot der Gemeinschaft nicht einfaches, sondern mit der Gottheit vereintes Brot. Der mit der Gottheit vereinte Leib aber ist nicht* eine* Natur. Nein, die eine ist die des Leibes, die andere die der Gottheit, die mit ihm vereint ist, so daß beides zusammen nicht* eine* Natur ist, sondern zwei.</p><p>Mit Brot und Wein empfing Melchisedech, „der Priester des höchsten Gottes “, den Abraham bei seinem Rückmarsch von der Niederwerfung der fremden Stämme. Jener Tisch bildete diesen geheimnisvollen Tisch vor, wie jener Priester ein Typus und Bild des wahren Hohenpriesters Christus war. Denn es heißt: „Du bist Priester in Ewigkeit nach der Ordnung Melchisedechs Dieses Brot sinnbildeten die Schaubrote. Dies ist das reine, allerdings auch unblutige Opfer, von dem der Herr durch den Propheten gesagt, daß es vom Aufgang der Sonne bis zu ihrem Untergang dargebracht wird.</p><p>Leib und Blut Christi dienen zum Bestande unserer Seele und unseres Leibes. Denn sie werden nicht aufgezehrt, vergehen nicht, kommen nicht zur Ausscheidung — das sei ferne —, sondern sie gehen in unsere Wesenheit ein und dienen zu unserer Erhaltung, sie wehren jeglichen Schaden ab, sie reinigen von jedem Schmutz, wie wenn man unreines Gold nimmt und es durchs prüfende (läuternde) Feuer reinigt, „auf daß wir nicht einstens mit der Welt verdammt werden “. Er (═ der Herr) reinigt nämlich durch Krankheiten und allerlei Schickungen, wie der göttliche Apostel sagt: „Würden wir uns selbst prüfen (richten), würden wir nicht geprüft (gerichtet) werden. Wenn wir aber vom Herrn geprüft (gerichtet) werden, werden wir dadurch gezüchtigt, damit wir nicht [einstens] mit der Welt verdammt werden.“ Und das meint er, wenn er sagt: „Wer den Leib und das Blut des Herrn unwürdig genießt, ißt und trinkt sich das Gericht.“ Durch ihn gereinigt, werden wir mit dem Leibe des Herrn und seinem Geiste vereint und werden Leib Christi.</p><p>Dieses Brot ist der Erstling des künftigen Brotes, „welches das kommende* (ἐπιούσιος )* [epiousios], auch das zum Sein gehörige ist. Denn das* ἐπιούσιος* [epiousios] bedeutet entweder das künftige, d. i. [das Brot] des künftigen Lebens, oder das, das zur* Erhaltung* unseres* Seins (οὐσία)* [ousia] empfangen wird. Sei es nun so oder so, man wird darunter passend den Leib des Herrn verstehen.* „Denn lebendigmachender Geist “ ist das Fleisch des Herrn, weil es vom lebendigmachenden Geiste empfangen ward. Was nämlich aus dem Geiste geboren ist, ist Geist.* Das aber sage ich, nicht um die Natur des Leibes aufzuheben, sondern um das Lebendigmachende und Göttliche desselben zu zeigen.</p><p>Wenn aber auch einige das Brot und den Wein Abbilder des Leibes und Blutes des Herrn nannten, wie der Gottesträger Basilius sagte, so meinten sie dieselben nicht* nach* der Heiligung (Konsekration), sondern* vor* der Heiligung, sie nannten die Opfergabe selbst so.</p><p>Teilnahme heißt sie (═ die Opfergabe). Denn durch sie nehmen wir an der Gottheit Jesu teil. Gemeinschaft heißt und ist sie wirklich. Denn durch sie haben wir Gemeinschaft mit Christus und werden seines Fleisches und seiner Gottheit teilhaftig. Durch sie treten wir aber auch untereinander in Gemeinschaft und Verbindung. Denn wir alle, die wir an* einem* Brote teilnehmen, werden* ein* Leib und* ein* Blut Christi und Glieder voneinander, da wir mit Christus zu* einem* Leib vereinigt sind.</p><p>Mit aller Kraft wollen wir uns hüten, die „Teilnahme“ (Kommunion) von den Häretikern zu empfangen oder ihnen zu geben. Denn der Herr sagt: „Gebet das Heilige nicht den Hunden und werfet eure Perlen nicht vor die Schweine “, damit wir nicht Genossen ihrer Irrlehre und ihrer Verdammung werden. Gewiß, wenn sie (═ die Teilnahme, Kommunion) mit Christus uns gegenseitig vereinigt, so verbinden wir uns sicherlich auch mit allen, die dem Willen nach daran teilnehmen. Denn mit Willen geschieht diese Vereinigung, nicht ohne unsere Gesinnung. Ja, „wir alle sind* ein* Leib, weil wir an* einem* Brote teilnehmen “, wie der göttliche Apostel sagt.</p><p>Abbilder des Künftigen aber heißen sie (═ Brot und Wein), nicht als wären sie nicht wirklich Leib und Blut Christi, sondern weil wir jetzt durch sie an der Gottheit Christi teilhaben, dann aber geistig nur durch die Anschauung.</p><h3>XIV. KAPITEL. Vom Geschlechtsregister des Herrn und von der heiligen Gottesgebärerin.</h3><p>Über die heilige, überaus preiswürdige, immerwährende Jungfrau und Gottesgebärerin Maria haben wir im Vorausgehenden in mäßigem Umfang gehandelt und hauptsächlich festgestellt, daß sie im eigentlichen und wirklichen Sinne Gottesgebärerin ist und heißt. Wir wollen jetzt das noch Fehlende nachtragen. Sie, die durch den ewigen, vorausschauenden Ratschluß Gottes vorherbestimmt und in verschiedenen Bildern und Aussprüchen der Propheten durch den Hl. Geist vorgebildet und vorherverkündet war, entsproßte in der vorherbestimmten Zeit aus der Wurzel Davids auf Grund der Verheißungen, die an ihn ergangen. Denn es heißt: „Geschworen hat der Herr Treue dem David und er bricht sie nicht: Von deines Leibes Frucht (═ Nachkommen von dir) werde ich auf deinen Thron setzen.“ Und wiederum: „Einmal habe ich geschworen bei meiner Heiligkeit, wahrlich, David täusche ich nicht. Seine Nachkommen bleiben in Ewigkeit. Und sein Thron ist wie die Sonne vor mir und wie der Mond, der für die Ewigkeit geschaffen und ein zuverlässiger Zeuge am Himmel ist.“ Und Isaias: „Aufsprossen wird ein Reis aus Jesse, und eine Blüte aus seiner Wurzel aufgehen.“</p><p>Daß Joseph sich aus Davidischem Stamm herleitet, haben die hochheiligen Evangelisten Matthäus und Lukas deutlich gezeigt. Allein Matthäus leitet Joseph von David durch Salomon her, Lukas dagegen durch Nathan. Die Abstammung der heiligen Jungfrau aber haben beide verschwiegen.</p><p>Man muß wissen, daß es nicht Gewohnheit der Hebräer und auch nicht der Hl. Schrift gewesen, die weibliche Linie anzugeben. Gesetz war, daß nicht ein Stamm aus einem andern Stamme heirate. Joseph, der aus Davidischem Stamme hervorging und gerecht war — denn dieses Zeugnis stellt ihm das göttliche Evangelium aus —, hätte die heilige Jungfrau nicht widergesetzlich zur Ehe genommen, hätte sie nicht demselben Stamme angehört. Es genügte also, die Abstammung Josephs aufzuzeigen.</p><p>Man muß aber auch folgendes wissen: Es war Gesetz, daß beim kinderlosen Tode eines Mannes dessen Bruder die Ehefrau des Verstorbenen zur Ehe nehmen und dem Bruder Nachkommenschaft erwecken sollte. Die Nachkommenschaft gehörte der Natur nach dem Zweiten, d. h. dem Erzeuger, dem Gesetze nach dem Verstorbenen an.</p><p>Aus der Linie Nathans nun, des Sohnes Davids, erzeugt, zeugte Levi den Melchi und den Panther. Panther zeugte den sogenannten Barpanther. Dieser Barpanther zeugte den Joachim. Joachim zeugte die heilige Gottesgebärerin. Aus der Linie Salomons aber, des Sohnes Davids, hatte Mathan ein Weib, aus dem er den Jakob zeugte. Als jedoch Mathan starb, heiratete Melchi, der aus dem Stamme Nathans war, der Sohn des Levi und Bruder des Panther, das Weib des Mathan, die Mutter des Jakob, und zeugte aus ihr den Heli. Es waren also Jakob und Heli Brüder von* einer* Mutter, Jakob aus dem Stamme Salomons, Heli aus dem Stamme Nathans. Es starb aber Heli, der aus dem Stamme Nathans war, kinderlos, und es nahm Jakob, sein Bruder, der aus dem Stamme Salomons war, dessen Weib und erweckte seinem Bruder Nachkommenschaft und zeugte den Joseph. Joseph ist also der Natur nach ein Sohn Jakobs, der aus der Linie Salomons war, dem Gesetze nach aber [ein Sohn] Helis, der von Nathan stammt.</p><p>Joachim nun nahm die ehr- und lobwürdige Anna zur Ehe. Aber wie die frühere Anna durch Gebet und Verheißung den Samuel geboren, da sie unfruchtbar war, so empfängt auch diese durch Flehen und Verheißung von Gott die Gottesgebärerin, damit sie auch hierin keiner der berühmten [Frauen] nachstehe. Es gebiert also die Gnade (denn das heißt Anna) die Herrin (denn das bedeutet der Name Maria ). Sie ist wirklich Herrin aller Geschöpfe geworden, da sie Mutter des Schöpfers wurde. Sie wird geboren im Hause Joachims am Schaftore und dem Heiligtum zugeführt. Sodann im Hause Gottes gepflanzt und befruchtet durch den Geist, wurde sie, „wie ein fruchttragender Ölbaum “, eine Herberge jeglicher Tugend, sie hielt von jeder weltlichen und fleischlichen Begier den Geist fern und bewahrte so die Seele samt dem Leibe jungfräulich, wie es sich für die ziemte, die Gott in ihrem Schoße aufnehmen sollte. Denn er, der Heilige, ruht in Heiligen. So also geht sie der Heiligung nach und erweist sich als heiliger und wunderbarer, „des allerhöchsten Gottes “ würdiger Tempel.</p><p>Es belauerte aber der Feind unseres Heiles die Jungfrauen wegen der Vorhersagung des Isaias, der sprach: „Siehe, die Jungfrau wird schwanger werden und einen Sohn gebären, und man wird ihm den Namen Emmanuel geben, d. h. verdolmetscht Gott-mit-uns.“ Damit nun der, der „die Weisen in ihrer Schlauheit fängt “, den täusche, der sich immer mit Weisheit brüstet, darum wird die Jungfrau von den Priestern dem Joseph zur Ehe übergeben, die neue Buchrolle dem Schriftkundigen. Die Vermählung war einerseits ein Schutz der Jungfrau, andrerseits eine Täuschung dessen, der die Jungfrauen belauerte. „Als aber die Fülle der Zeiten kam “, wurde ein Engel des Herrn zu ihr gesandt, der verkündete, daß sie den Herrn empfange. Und so empfing sie den Sohn Gottes, die subsistierende Kraft des Vaters, „nicht aus dem Trieb des Fleisches, nicht aus dem Trieb des Mannes “, d. h. aus Umarmung und Samen, sondern durch das Wohlgefallen des Vaters und Mitwirkung des Hl. Geistes. Sie gewährte dem Schöpfer die Möglichkeit, geschaffen, dem Bildner, gebildet zu werden, dem Sohne Gottes und Gott, Fleisch und Mensch zu werden aus ihrem heiligen, makellosen Fleisch und Blut. Damit erfüllte sie das Amt der Stammesmutter. Wie nämlich jene ohne Umarmung aus Adam gebildet ward, so gebar auch diese den neuen Adam, der zwar nach dem Gesetz der Schwangerschaft, aber entgegen der natürlichen Erzeugung geboren wurde. Denn geboren wird vom Weibe ohne Vater der, der aus dem Vater ist ohne Mutter. Weil vom Weibe, darum nach dem Gesetz der Schwangerschaft; weil aber ohne Vater, darum entgegen der natürlichen Erzeugung. Weil zur gewöhnlichen Zeit — denn wer die neun Monate vollendet hat und in den zehnten geht, wird geboren —, darum nach dem Gesetz der Schwangerschaft; weil aber ohne Wehen, darum entgegen dem Gesetz der Geburt. Denn der, der keine Lust voranging, folgten auch keine Wehen, gemäß dem Propheten, der sagt: „Bevor sie Wehen hatte, gebar sie Und wiederum: „Bevor die Zeit der Wehen kam, entfloh sie und gebar ein Männliches (ein Knäblein).“</p><p>Geboren ward also aus ihr der fleischgewordene Sohn Gottes; nicht ein gotttragender Mensch, sondern ein fleischgewordener Gott, nicht wie ein Prophet durch Wirksamkeit gesalbt, sondern durch die Anwesenheit des ganzen Salbenden, so daß das Salbende Mensch und das Gesalbte Gott wurde, nicht durch Umwandlung der Natur, sondern durch hypostatische Einigung. Denn der nämliche war sowohl der Salbende als der Gesalbte, salbend als Gott sich selbst als Menschen. Wie sollte also die nicht Gottesgebärerin sein, die den fleischgewordenen Gott aus sich geboren? Fürwahr, im eigentlichen und wahren Sinne ist sie Gottesgebärerin und Herrin, sie gebietet über alle Geschöpfe, da sie Magd und Mutter des Schöpfers ist. Gleichwie er aber in der Empfängnis die Empfangende jungfräulich erhielt, so bewahrte er auch in der Geburt ihre Jungfräulichkeit unversehrt, da er allein durch sie hindurchging und sie verschlossen erhielt. Durch Hören [erfolgte] die Empfängnis, die Geburt durch den gewöhnlichen Ausgang der Geburten, wenn auch einige fabeln, er sei durch die Seite der Gottesmutter geboren worden. Es war ihm ja nicht unmöglich, durch die Pforte hindurchzugehen und deren Siegel nicht zu verletzen.</p><p>Es bleibt also Jungfrau auch nach der Geburt die immerwährende Jungfrau, da sie bis zum Tode mit keinem Manne einen Verkehr gehabt. Denn wenn auch geschrieben steht: „Und er erkannte sie nicht, bis sie ihren Sohn, den Erstgeborenen, gebar “, so muß man wissen, daß Erstgeborener der zuerst Geborene ist, auch wenn er Eingeborener wäre. Denn das „Erstgeborener“ bedeutet zuerst geboren sein, es zeigt aber gewiß nicht an, daß auch andere [danach] geboren worden sind. Das „bis“ bezeichnet zwar den bestimmten Zeittermin, verneint aber nicht das darauffolgende. Es sagt nämlich der Herr: „Und siehe, ich bin bei euch alle Tage bis ans Ende der Welt “, nicht als werde er nach dem Ende der Welt sich trennen. Sagt doch der göttliche Apostel: „Und so werden wir allezeit beim Herrn sein “, nach der allgemeinen Auferstehung nämlich.</p><p>Denn wie wäre es möglich, daß sie, die Gott geboren, und aus der Erfahrung dessen, was folgte, das Wunder erkannt, eines Mannes Umarmung zugelassen hätte? Fort damit! Keinem keuschen Sinn ziemt es, sich solches zu denken, geschweige zu tun.</p><p>Aber diese selige, der übernatürlichen Gaben Gewürdigte erlitt diese Wehen, denen sie bei der Geburt entging, in der Zeit des Leidens, da sie in mütterlichem Mitgefühl die Zerfleischung des Innern erduldete. Als sie sah, daß der, den sie durch die Geburt als Gott erkannt, wie ein Missetäter getötet wurde, da wurde sie von den Gedanken wie von einem Schwerte zerfleischt. Und das ist es: „Und auch deine eigene Seele wird ein Schwert durchdringen.“ Doch den Schmerz änderte die Freude der Auferstehung, die den als Gott verkündet, der dem Fleische nach gestorben.</p><h3>XV. KAPITEL. Von der Verehrung der Heiligen und ihrer Reliquien.</h3><p>Man muß die Heiligen als Freunde Christi, als Kinder und Erben Gottes ehren, wie der Theologe und Evangelist Johannes sagt: „Allen aber, die ihn aufnahmen, denen gab er Macht, Kinder Gottes zu werden.“ „Daher sind sie nicht mehr Knechte, sondern Söhne; wenn aber Söhne, auch Erben, Erben Gottes und Miterben Christi.“ Auch der Herr sagt in den heiligen Evangelien zu den Aposteln: „Ihr seid meine Freunde. Ich nenne euch nicht mehr Knechte. Denn der Knecht weiß nicht, was sein Herr tut Wenn der Schöpfer und Herr aller Dinge „König der Könige, Herr der Herren “ und „Gott der Götter “ genannt wird, so sind gewiß auch die Heiligen Götter und Herren und Könige. Ihr Gott und Herr und König ist und heißt Gott. Denn er sagt zu Moses: „Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs.“ Und den Moses hat Gott zu einem Gott über Pharao gemacht. Götter aber und Könige und Herren nenne ich sie nicht von Natur, sondern sofern sie über die Leidenschaften geboten und herrschten und die Ähnlichkeit mit dem göttlichen Bilde, wonach sie ja geschaffen sind, unverfälscht bewahrten — denn König wird auch das Bild des Königs genannt — und sofern sie dem Willen nach mit Gott geeint waren und diesen als Gast aufnahmen und durch die Teilnahme an ihm aus Gnade das wurden, was er selbst von Natur aus ist. Wie soll man also die nicht ehren, die Diener und Freunde und Söhne Gottes sind? Denn „die Ehre, die man den gutgesinnten Mitknechten erweist, ist ein Beweis der Liebe gegen den gemeinsamen Herrn “.</p><p>Diese sind Schatzkammern und reine Herbergen Gottes. Denn Gott sagt: „Ich will in ihnen wohnen und wandeln und ich werde Gott sein.“ Daß „die Seelen der Gerechten in der Hand Gottes sind und der Tod sie nicht berührt, sagt die Hl. Schrift. Der Tod der Heiligen ist ja viel mehr ein Schlaf als ein Tod. Denn sie haben sich geplagt ihr Leben lang und werden leben ohne Ende. Und: „Kostbar vor dem Herrn ist der Tod seiner Heiligen Was ist nun kostbarer als in der Hand Gottes zu sein? Denn Gott ist Leben und Licht, und die in der Hand Gottes sind, sind im Leben und Lichte.</p><p>Daß aber Gott auch in ihren* Leibern* durch den Geist gewohnt, sagt der Apostel: „Wißt ihr nicht, daß eure Leiber ein Tempel des Hl. Geistes sind, der in euch wohnt?“ „Der Herr aber ist Geist.“ Und: „Wenn einer den Tempel Gottes vernichtet, so wird ihn Gott vernichten.“ Wie soll man also die lebendigen Gottestempel, die lebendigen Gotteszelte nicht ehren? Diese haben sich im Leben freimütig auf Seite Gottes gestellt.</p><p>Als heilbringende Quellen gab uns der Herr Christus die Reliquien der Heiligen, die auf mannigfache Weise die Wohltaten ausströmen, wohlriechendes Öl hervorquellen. Und niemand sei ungläubig! Denn wenn aus hartem, festem Fels in der Wüste Wasser quoll, weil Gott es wollte, und aus einem Eselskinnbacken dem dürstenden Samson, ist es dann unglaublich, daß aus Märtyrerreliquien wohlriechendes Öl quelle? Keineswegs, wenigstens für die, welche die Macht Gottes und die Ehre kennen, die den Heiligen von ihm zuteil wird.</p><p>Im Gesetze galt jeder, der einen Toten berührte, für unrein. Aber diese sind keine Toten. Denn seitdem er, der selbst das Leben, der Grund des Lebens ist, zu den Toten gezählt ward, nennen wir die, die in der Hoffnung auf Auferstehung und im Glauben an ihn entschlafen sind, nicht Tote. Denn wie kann ein toter Körper Wunder wirken? Wie also werden durch sie Dämonen ausgetrieben, Krankheiten verscheucht, Kranke geheilt, Blinde sehend, Aussätzige rein, Versuchungen und Kümmernisse gehoben, wie kommt durch sie jede gute Gabe vom Vater der Lichter auf die herab, die in zuversichtlichem Glauben bitten? Wieviel Mühe gäbest du dir, um einen Helfer zu finden, der dich einem sterblichen König vorstellte und für dich einen Fürsprecher bei ihm machte! Sollte man nun die Fürsprecher des ganzen Geschlechts, die für uns die Bitten Gott darbringen, nicht ehren? Ja gewiß, wir müssen sie ehren, wir errichten Gott Tempel auf ihre Namen, bringen Früchte dar, feiern ihr Andenken und freuen uns dabei auf geistige Weise, damit die Freude denen entspreche, die uns dazu laden, auf daß wir nicht, während wir ihnen zu huldigen suchen, sie im Gegenteil erzürnen. Denn an dem, wodurch man Gott verehrt, werden sich auch seine Verehrer erfreuen. Worüber aber Gott zürnt, darüber werden auch seine Diener zürnen. „In Psalmen und Lobgesängen und geistlichen Liedern “, in Zerknirschung und Barmherzigkeit mit den Dürftigen wollen wir Gläubige die Heiligen verehren. Dadurch wird auch Gott am meisten verehrt. Denksäulen wollen wir ihnen errichten und sichtbare Bilder und selbst lebendige Denksäulen und Bilder derselben durch die Nachahmung ihrer Tugenden werden. Die Gottesgebärerin wollen wir ehren als Gottesmutter im eigentlichen und wahren Sinne; den Propheten Johannes als Vorläufer und Täufer, Apostel und Märtyrer — denn „unter den von Weibern Geborenen ist kein Größerer erstanden als Johannes der Täufer “, wie der Herr gesagt, und er ist der erste Herold des Reiches gewesen —; die Apostel als Brüder des Herrn und Augenzeugen und Diener seiner Leiden, die Gott der Vater „in seinem Vorherwissen auch vorherbestimmt hat, dem Bilde seines Sohnes gleichgestaltet zu werden “, „erstens zu Aposteln, zweitens zu Propheten, drittens zu Hirten und Lehrern “; die aus jedem Stande erwählten Märtyrer des Herrn „als Streiter Christi “, die seinen Kelch getrunken, als sie mit der Taufe des lebendigmachenden Todes selber getauft wurden, als Genossen seiner Leiden und seiner Herrlichkeit, deren Anführer der Erzdiakon und Apostel und Erzmärtyrer Christi, Stephanus, war; unsere heiligen Väter, die gotterfüllten Asketen, die das langwierigere und mühsamere Martyrium des Gewissens durchgekämpft, „die in Schaf- und Ziegenfellen umhergingen, darbend, leidend, duldend, die in Einöden, in Gebirgen, in Höhlen und Klüften der Erde umherirrten, deren die Welt nicht wert war; die endlich, die* vor* der Gnade lebten, die Propheten, Patriarchen, Gerechten, die die Ankunft des Herrn vorherverkündet. Auf den Wandel all dieser wollen wir achten und ihren Glauben, ihre Liebe, ihre Hoffnung, ihren Eifer, ihr Leben, ihren Starkmut in den Leiden, ihre Ausdauer bis zum Blute nachahmen, damit wir mit ihnen auch an den Ehrenkronen teilhaben.</p><h3>XVI. KAPITEL. Von den Bildern.</h3><p>Weil einige uns tadeln, da wir dem Bilde des Herrn und unserer Herrin, dann aber auch der übrigen Heiligen und Diener Christi Ehrfurcht und Ehre erweisen, so sollen sie hören, daß am Anfang Gott den Menschen nach seinem Bild geschaffen hat. Weshalb bezeigen wir einander Ehre? Doch nur, weil wir nach dem Bilde Gottes geschaffen sind. Denn „die Ehre des Bildes geht“, wie der Gotteslehrer und Gottesgelehrte Basilius sagt, „auf das Urbild über“. Urbild aber ist das, dem etwas nachgebildet, von dem ein Abbild gemacht wird. Warum betete das mosaische Volk das Zelt ringsum an? Weil es ein Abbild und Typus der himmlischen Dinge oder vielmehr der ganzen Schöpfung war. Es sprach nämlich Gott zu Moses: „Siehe, du sollst alles machen nach dem Vorbild, das dir auf dem Berge gezeigt wurde.“ Und die Cherubim, die den Sühnedeckel (der Bundeslade) beschatteten, waren sie nicht „Werke von Menschenhänden “? Was war der berühmte Tempel in Jerusalem? War er nicht mit Händen gemacht und durch Menschenkunst hergestellt?</p><p>Die Hl. Schrift klagt die an, welche „die Schnitzbilder anbeten “, aber auch die, die „den Dämonen opfern “. Es opferten die Heiden, es opferten aber auch die Juden, freilich, die Heiden den Dämonen, die Juden Gott. Und das Opfer der Heiden ward verworfen und verdammt, das der Gerechten aber war Gott willkommen. Denn Noë opferte, und „Gott roch den lieblichen Duft “, er nahm den Wohlgeruch seines guten Willens und seiner Liebe zu ihm an. So sind die Schnitzbilder der Heiden, da sie Abbilder von Dämonen waren, verworfen und verboten worden.</p><p>Zudem, wer kann sich von dem unsichtbaren, unkörperlichen, unumschriebenen und gestaltlosen Gott ein Abbild machen? Höchst töricht und gottlos also ist es, die Gottheit zu gestalten (darzustellen). Daher war im Alten Testament der Gebrauch der Bilder nicht üblich. Es ist aber Gott „in seinem herzlichen Erbarmen “ unseres Heiles wegen wahrhaftig Mensch geworden, nicht wie er dem Abraham in Menschengestalt erschienen ist, auch nicht wie den Propheten, nein wesenhaft, wirklich ist er Mensch geworden, hat auf Erden gelebt und mit den Menschen verkehrt, hat Wunder gewirkt, gelitten, ist gekreuzigt worden, auferstanden, [in den Himmel] aufgenommen worden, und all das ist wirklich geschehen und von den Menschen gesehen worden, und es ist zu unserer Erinnerung und zur Belehrung derer, die damals nicht zugegen waren, aufgeschrieben worden, damit wir, die es nicht gesehen, aber gehört und geglaubt haben, der Seligpreisung des Herrn teilhaftig würden. Da aber nicht alle die Buchstaben kennen und sich mit dem Lesen beschäftigen, schien es den Vätern geraten, diese Begebenheiten wie Heldentaten in Bildern darstellen zu lassen, um sich daran kurz zu erinnern. Gewiß erinnern wir uns oft, wo wir nicht an das Leiden des Herrn denken, beim Anblick des Bildes der Kreuzigung Christi, des heilbringenden Leidens, und fallen nieder und beten an, nicht den Stoff, sondern den Abgebildeten, gleichwie wir auch nicht den Stoff des Evangeliums und den Stoff des Kreuzes, sondern das dadurch Ausgedrückte anbeten. Denn was ist für ein Unterschied zwischen einem Kreuz, das das Bild des Herrn nicht hat, und dem, das es hat? So ist es auch mit der Gottesmutter. Denn die Verehrung, die man ihr erweist, bezieht sich auf den, der aus ihr Fleisch geworden. Ebenso spornen uns auch die Heldentaten der heiligen Männer zur Mannhaftigkeit, zum Eifer, zur Nachahmung ihrer Tugend und zum Preise Gottes an. Denn, wie gesagt, „die Ehre, die wir den Edelgesinnten unserer Mitknechte erweisen, ist ein Beweis der Liebe gegen den gemeinsamen Herrn “, und „die Ehre des Bildes geht auf das Urbild über “. Es ist dies jedoch eine ungeschriebene Überlieferung wie auch die Anbetung gegen Aufgang und die Verehrung des Kreuzes und sehr viel anderes dergleichen.</p><p>Man erzählt aber auch eine Geschichte: Als Abgar, König von Edessa, einen Maler absandte, um ein Bildnis des Herrn zu machen, und der Maler es wegen des strahlenden Glanzes seines Antlitzes nicht vermochte, habe der Herr selbst sein Oberkleid auf sein göttliches, lebenspendendes Antlitz gelegt und sein Bild im Kleide abgeprägt und es so dem danach verlangenden Abgar geschickt.</p><p>Daß aber die Apostel auch sehr vieles ungeschrieben überliefert haben, schreibt der Völkerapostel Paulus: „So stehet denn fest, Brüder, und haltet an unsern Überlieferungen fest, die ihr gelernt habt, sei es durch mündliche Rede, sei es durch einen Brief von uns.“ Und an die Korinther: „Ich lobe euch aber, Brüder, daß ihr in allem meiner eingedenk seid und an den Überlieferungen, wie ich sie euch überliefert habe, festhaltet.“</p><h3>XVII. KAPITEL. Von der Schrift.</h3><p>Einer ist Gott, er, der sowohl vom Alten wie vom Neuen Testament verkündet, der in Dreiheit (═ in drei Personen) besungen und gepriesen wird. Denn der Herr sprach: „Ich bin nicht gekommen, das Gesetz aufzuheben, sondern zu erfüllen.“ Er selbst wirkte ja unser Heil, um dessentwillen jegliche Schrift und jegliches Mysterium da ist. Und wiederum: „Ihr durchforschet die Schriften, denn die sind es, die über mich Zeugnis ablegen.“ Und der Apostel sagt: „Zu verschiedenen Zeiten und auf verschiedene Weise hat Gott vor alters zu unseren Vätern geredet durch die Propheten. Am Ende dieser Tage sprach er zu uns in seinem Sohne.“ Durch den Hl. Geist also haben „das Gesetz und die Propheten “, die Evangelisten und Apostel, Hirten und Lehrer geredet.</p><p>Demnach „ist“ sicherlich „jede von Gott eingegebene Schrift auch nützlich “. Daher ist es sehr gut und heilsam, die göttlichen Schriften zu durchforschen. Denn „wie ein Baum, der neben Wasserläufe gepflanzt ist “, so wird auch die Seele genährt, die von der göttlichen Schrift bewässert wird, und „sie bringt Frucht zu ihrer Zeit “, den rechten Glauben, und prangt in immergrünen Blättern, den gottgefälligen Werken. Denn zu tugendhaftem Handeln und ungetrübtem Betrachten werden wir durch die heiligen Schriften angeleitet. In diesen finden wir ja Ermahnung zu jeder Tugend und Warnung vor allem Schlechten. Sind wir also lernbegierig, so werden wir auch viel lernen. Durch Fleiß und Mühe und die Gnade des gebenden Gottes kommt ja alles zustande. Denn „wer bittet, empfängt, und wer sucht, findet, und wer anklopft, dem wird aufgetan “. Klopfen wir also an dem so herrlichen Paradiese der Schriften an, dem duftigen, dem so lieblichen, dem so fruchtprangenden, das mit mannigfachen Liedern der geistigen, gottvollen Vögel unsere Ohren umtönt, das unser Herz berührt, in der Trauer tröstet, im Zorne besänftigt und mit ewiger Freude erfüllt, das unser Denken auf den goldstrahlenden, hellglänzenden Rücken der göttlichen Taube erhebt und durch deren hellleuchtende Flügel hin zum eingeborenen Sohn und Erben des Pflanzers des geistigen Weinstocks trägt und durch ihn zum „Vater der Lichter “ bringt. Aber nicht nachlässig, sondern inständig und anhaltend wollen wir anklopfen. Wir wollen unermüdlich anklopfen. Denn nur so wird uns aufgetan werden. Wenn wir ein- und zweimal lesen und nicht verstehen, was wir lesen, so wollen wir gleichwohl nicht ermüden, sondern anhalten, nachsinnen, fragen. Es heißt ja: „Frage deinen Vater, und er wird es dir kundtun; deine Vorfahren, und sie werden es dir sagen.“ Denn nicht allen ist die Erkenntnis eigen. Schöpfen wir aus der Paradiesesquelle unversieglicher, reinster Wasser, die ins ewige Leben strömen. Ergötzen wir uns daran, schwelgen wir darin unersättlich. Denn sie enthalten die Gnade kostenlos. Sollten wir auch von den „Außenstehenden “ (═ von den heidnischen Schriftstellern) etwas Nützliches gewinnen können, so steht dem nichts im Wege. Werden wir bewährte Wechsler, die das echte und reine Gold aufhäufen, das unechte aber zurückweisen. Nehmen wir gute Lehren an, lächerliche Götter aber und alberne Fabeln laßt uns den Hunden hinwerfen. Denn aus ihnen (═ den guten Lehren) können wir wohl sehr große Kraft gegen letztere holen.</p><p>Man muß wissen, daß das Alte Testament zweiundzwanzig Bücher hat, entsprechend den Buchstaben der hebräischen Sprache. Sie (═ die Hebräer) haben nämlich zweiundzwanzig Buchstaben, von denen fünf verdoppelt werden, so daß sich siebenundzwanzig ergeben. Doppelt nämlich sind das Kaph, das Mem, das Nun, das Pe und das Zade. Daher zählt man auch auf diese Weise zweiundzwanzig Bücher, siebenundzwanzig aber findet man, weil fünf von ihnen Doppelbücher sind. Es wird nämlich Ruth mit Richter verbunden und bei den Hebräern als* ein* Buch gezählt. Das erste und zweite [Buch] der Könige ist* ein* Buch, das dritte und vierte [Buch] der Könige* ein* Buch, das erste und zweite [Buch] Paralipomenon* ein* Buch, das erste und zweite [Buch] Esdras* ein* Buch. So liegen denn die Bücher in vier Pentateuchen (═ Fünfbüchern) vor, zwei bleiben noch übrig, so daß die [in den Kanon] aufgenommenen Bücher folgende sind: Fünf gesetzliche: Genesis, Exodus, Levitikus, Numeri, Deuteronomium. Das ist der erste Pentateuch, der auch Gesetzgebung heißt. Den anderen Pentateuch sodann bilden die sogenannten Grapheia (═ Schriften ═ Geschichtsbücher), von einigen Hagiographa genannt. Diese sind: Jesus, der Sohn Naves, Richter mit Ruth, Könige, erstes und zweites [Buch der Könige]* ein* Buch, drittes und viertes [Buch der Könige]* ein* Buch, und die zwei [Bücher] Paralipomenon* ein* Buch. Das ist der zweite Pentateuch. Den dritten Pentateuch bilden die Versbücher (═ poetischen Bücher): Job, der Psalter, die Sprüche Salomons, sein Prediger und sein Hohes Lied. Der vierte Pentateuch ist der prophetische: Die zwölf Propheten* ein* Buch, Isaias, Jeremias, Ezechiel, Daniel, dann die zu* einem* Buch vereinigten zwei Bücher Esdras und Esther. Das Tugendbuch (Panaretos), d. i. die Weisheit Salomons und die Weisheit Jesu, die der Vater des Sirach hebräisch herausgab und dessen Enkel Jesus, des Sirachs Sohn, ins Griechische übersetzte — sie sind zwar trefflich und gut, werden aber nicht gezählt und lagen auch nicht in der Bundeslade.</p><p>[Die Bücher] des Neuen Testamentes aber sind: Die vier Evangelien nach Matthäus, nach Markus, nach Lukas, nach Johannes; die Taten der heiligen Apostel (Apostelgeschichte) vom Evangelisten Lukas; sieben katholische Briefe: einer von Jakobus, zwei von Petrus, drei von Johannes, einer von Judas; vierzehn Briefe vom Apostel Paulus; die Apokalypse des Evangelisten Johannes; die Kanones der heiligen Apostel von Klemens.</p><h3>XVIII. KAPITEL. Von den Aussagen über Christus.</h3><p>Von den Aussagen über Christus gibt es vier Gattungsweisen. Die einen kommen ihm schon vor der Menschwerdung zu, die andern in der Einigung, die andern nach der Einigung, die andern nach der Auferstehung. Von denen vor der Menschwerdung gibt es sechs Weisen. Die einen davon bezeichnen die Einheit der Natur und die Wesensgleichheit mit dem Vater, wie: „Ich und der Vater sind eins “, und: „Wer mich gesehen hat, hat den Vater gesehen “, und: „Er, der in Gottes Gestalt sich befand “ u. dgl. Die andern [bezeichnen] die Vollkommenheit der Hypostase, wie: „Sohn Gottes “, und: „Abdruck seines Wesens “, und: „Engel des guten Rates, Wunderbarer, Ratgeber “ und ähnliche [Aussagen].</p><p>Andere [bezeichnen] das Ineinandersein der Hypostasen, wie: „Ich im Vater und der Vater in mir “, und ihre unzertrennliche Verbindung, wie: „Wort “, „Weisheit “, „Macht “, „Abglanz “. Denn das Wort — ich meine das wesenhafte Wort — haftet untrennbar im Verstande und ebenso die Weisheit, und im Mächtigen die Macht und im Lichte der Abglanz, aus ihnen quellend.</p><p>Andere [bezeichnen] das Begründetsein im Vater, wie: „Der Vater ist größer als ich “. Aus ihm hat er (Christus) ja das Sein und alles, was er hat: das Sein durch Zeugung und nicht durch Schöpfung. Daher sein Wort: „Ich bin vom Vater ausgegangen und gekommen “, und: „Ich lebe durch den Vater.“ Alles, was er hat, hat er nicht durch Mitteilung oder Belehrung, sondern aus ihm (═ dem Vater) als seinem Prinzip. So sagt er: „Der Sohn kann nichts aus sich selbst tun, wenn er es nicht den Vater hat tun sehen.“ Denn ist der Vater nicht, so ist auch der Sohn nicht. Der Sohn ist ja aus dem Vater und im Vater und zugleich mit dem Vater und nicht nach dem Vater. Ebenso tut er auch, was er tut, aus ihm und mit ihm. Denn einer und derselbe, nicht ähnlich, nein, derselbe ist der Wille und die Wirksamkeit und die Macht des Vaters und des Sohnes und des Hl. Geistes.</p><p>Andere [bezeichnen] die Erfüllung des väterlichen Willens durch seine Wirksamkeit. Sie ist nicht die eines Werkzeuges oder eines Knechtes, sondern die seines wesenhaften und subsistierenden Wortes, seiner Weisheit und Macht, weil sich die Bewegung (Tätigkeit) im Vater und Sohn als* eine* darstellt. So die Stelle: "Alles ist durch dasselbe (═ das Wort) geworden “, und die: „Er sandte sein Wort und heilte sie “, und die: „Damit sie erkennen, daß du mich gesandt hast.“</p><p>Andere [Aussagen] werden* prophetisch* gemacht. Von diesen gehen die einen auf die Zukunft, wie: „Er wird sichtbar kommen “, und das Wort des Zacharias: „Siehe, dein König kommt zu dir “, und der Ausspruch des Michäas: „Siehe, der Herr zieht aus von seiner Stätte und er wird herabsteigen und über die Höhen der Erde dahinschreiten “. Die andern [von den prophetischen Aussagen] gehen zwar auf die Zukunft, werden jedoch gemacht, als bezögen sie sich auf die Vergangenheit, wie die Stelle: „Dieser ist unser Gott... Danach ist er auf Erden erschienen und unter den Menschen gewandelt “, und die: „Der Herr schuf mich als Anfang seiner Wege zu seinen Werken “, und die: „Darum hat dich Gott, dein Gott, mit dem Öl der Freude vor deinen Genossen gesalbt “ u. dgl.</p><p>Die Aussagen vor der Einigung werden auch nach der Einigung von ihm gelten, die nach der Einigung aber keineswegs vor der Einigung, außer, wie gesagt, prophetisch. Von den Aussagen in der Einigung gibt es dreierlei Weisen. Reden wir von dem Höheren, so sagen wir Vergottung, Wortwerdung* (λὀγωσις)* [logōsis], Erhöhung des Fleisches u. dgl. Dadurch zeigen wir die Bereicherung an, die dem Fleische aus seiner Einigung und Verbindung mit dem höchsten Gott, dem Worte, erwachsen ist. [Reden wir] aber von dem Geringeren, so sagen wir Fleischwerdung, Menschwerdung, Entäußerung, Armut, Erniedrigung des Gott-Logos. Denn dieses und dergleichen wird infolge der Verbindung mit dem Menschlichen von dem Worte und Gott ausgesagt. [Reden wir] aber von beiden (═ dem Höheren und dem Geringeren) zugleich, so sagen wir Einigung, Gemeinschaft, Salbung, Verwachsung, Verbindung u. dgl. Wegen dieser dritten Weise also werden die beiden vorgenannten Weisen ausgesagt. Durch die Vereinigung wird nämlich angegeben, was ein jedes von beiden aus der Verbindung und dem Ineinandersein mit dem zugleich mit ihm Bestehenden erhalten hat. Denn wegen der hypostatischen Einigung wird vom Fleische gesagt, es sei vergottet, Gott geworden und zugleich Gott wie das Wort, und vom Gott-Logos, er sei Fleisch und Mensch geworden, er heißt Geschöpf und nennt sich „den Letzten “, nicht als hätten sich die zwei Naturen in* eine* zusammengesetzte Natur verwandelt — denn es ist unmöglich, daß die natürlichen Gegensätze in* einer* Natur zugleich sind —, sondern weil die zwei Naturen hypostatisch geeint und ohne Vermischung und Verwandlung ineinander sind. Die Durchdringung (Perichorese) erfolgte nicht von Seiten des Fleisches, sondern von seiten der Gottheit. Denn unmöglich kann das Fleisch die Gottheit durchdringen. Nein, die göttliche Natur, die einmal das Fleisch durchdrang, verlieh auch dem Fleische die unaussprechliche Durchdringung mit ihr, die wir eben Einigung nennen.</p><p>Man muß wissen, daß bei der ersten und zweiten Weise der Aussagen in der Einigung die Wechselseitigkeit ins Auge gefaßt wird. Denn reden wir vom Fleische, so sagen wir Vergottung, Wortwerdung, Erhöhung, Salbung. Das geht zwar von der Gottheit aus, wird aber am Fleische geschaut. [Reden wir] jedoch vom Worte, so sagen wir Entäußerung, Fleischwerdung, Menschwerdung, Erniedrigung u. dgl. Das geht zwar, wie bemerkt, vom Fleische aus, wird aber von dem Worte und Gott ausgesagt. Denn er selbst nahm dieses freiwillig auf sich.</p><p>Von den Aussagen* nach* der Einigung gibt es drei Weisen. Die erste zeigt die göttliche Natur an, wie: „Ich im Vater und der Vater in mir “, und: „Ich und der Vater sind eins.“ Alles, was vor der Menschwerdung von ihm ausgesagt wird, das wird auch nach der Menschwerdung von ihm ausgesagt werden, nur das nicht, daß er nicht Fleisch und dessen natürliche Eigenschaften angenommen habe.</p><p>Die zweite [Weise zeigt] die menschliche [Natur] an, wie das Wort: „Was sucht ihr mich zu töten, einen Menschen, der die Wahrheit zu euch gesprochen?“, und das: „So muß der Menschensohn erhöht werden “ u. dgl.</p><p>Von dem, was auf* menschliche* Art von Christus, dem Heiland, ausgesagt wird und geschrieben steht, seien es Worte oder Taten, gibt es sechs Weisen. Einiges davon ist gemäß der Heilsordnung auf natürliche Weise erfolgt und gesagt, wie die Geburt aus der Jungfrau, das Wachstum und die Zunahme an Alter, der Hunger, der Durst, die Ermüdung, das Weinen, der Schlaf, die Durchbohrung mit den Nägeln, der Tod und alles dergleichen, was natürliche und untadelhafte Leiden sind. In all diesem besteht eine Verbindung des Göttlichen mit dem Menschlichen, mag man auch des Glaubens sein, daß es in Wirklichkeit dem Leibe angehört. Denn das Göttliche erleidet hiervon nichts, aber es besorgt dadurch unser Heil.</p><p>Einiges [ist] verstellungsweise [geschehen und gesagt], wie die Frage: „Wo habt ihr den Lazarus hingelegt?“, sein Hingehen zum Feigenbaum, sein Sichverbergen oder Sichzurückziehen, sein Gebet, das: „Er stellte sich, als wollte er weitergehen.“ Denn dieses und Ähnliches hatte er weder als Gott noch als Mensch nötig, sondern er nahm nach menschlicher Art eine Haltung an, wie sie das Bedürfnis und der Nutzen erheischte. So betete er, um zu zeigen, daß er kein Gottesfeind sei, da er ja den Vater als sein Prinzip ehrte. Er fragte nicht aus Unwissenheit, sondern um neben dem Gottsein das wirkliche Menschsein zu zeigen. Er zog sich zurück, um zu lehren, nicht vorschnell zu handeln und sich nicht selbst preiszugeben.</p><p>Einiges [ist] aneignungs- und übernahmsweise [gesagt], wie: „Mein Gott, mein Gott, warum hast du mich verlassen?“, und: „Den, der keine Sünde kannte, hat er für uns zur Sünde gemacht “, und: „Der für uns zum Fluche geworden “, und: „Der Sohn selbst wird dem unterworfen werden, der ihm alles unterworfen hat.“ Denn weder als Gott noch als Mensch ward er je vom Vater verlassen, er ist weder Sünde noch Fluch geworden, noch braucht er sich dem Vater zu unterwerfen. Sofern er Gott ist, ist er dem Vater gleich und weder entgegengesetzt noch unterworfen. Sofern er aber Mensch ist, war er dem Erzeuger nie ungehorsam, um eine Unterwerfung zu brauchen. Sofern er sich* unsere* Person aneignete und sich mit uns zusammenstellte, sagte er dieses. Denn* wir* waren die der Sünde und dem Fluche Verfallenen,* wir* waren ja widerspenstig und ungehorsam und darum verlassen.</p><p>Manches ist auf Grund der gedanklichen Trennung (Abstraktion) [gesagt]. Denn wenn du das in der Wirklichkeit Untrennbare in Gedanken trennst, nämlich das Fleisch vom Worte, so heißt er auch Knecht und unwissend. Er hatte ja die knechtische und unwissende Natur. Denn wäre das Fleisch nicht mit dem Gott-Logos geeint, so wäre es knechtisch und unwissend. Allein wegen der hypostatischen Einigung mit dem Gott-Logos war es weder knechtisch noch unwissend. In diesem Sinne nannte er auch den Vater seinen Gott.</p><p>Manches [ist gesagt] wegen der Offenbarung und Beglaubigung uns gegenüber, wie: „Vater, verherrliche du mich mit der Herrlichkeit, die ich bei dir hatte, ehe die Welt war.“ Denn er selbst war und ist verherrlicht, aber uns gegenüber war seine Herrlichkeit nicht geoffenbart und beglaubigt. Und der Ausspruch des Apostels: „Der zum Sohne Gottes bestimmt ward in Kraft [Gottes] nach dem Geiste der Heiligung durch die Auferstehung von den Toten.“ Denn durch die Wunder und die Auferstehung und die Herabkunft des Hl. Geistes ward der Welt geoffenbart und beglaubigt, daß er der Sohn Gottes ist. Und die Stelle: „Er nahm zu an Weisheit und Gnade.“</p><p>Manches [ist gesagt] mit Rücksicht auf die Aneignung der Person der Juden, insofern er sich zu den Juden zählte. So sagt er zur Samariterin: „Ihr betet an, was ihr nicht kennt, wir beten an, was wir kennen, denn das Heil kommt von den Juden.“</p><p>Die dritte Weise zeigt die* eine* Hypostase an und stellt beides (═ die beiden Naturen) zusammen dar, wie z. B.: „Ich lebe durch den Vater, und wer mich ißt, der wird leben durch mich “, und: „Ich gehe zum Vater, und ihr sehet mich nicht mehr “, und: „Sie hätten den Herrn der Herrlichkeit nicht gekreuzigt “, und: „Niemand ist in den Himmel aufgestiegen als nur der eine, der vom Himmel herabgestiegen ist, der Menschensohn, der im Himmel ist “ u. dgl.</p><p>Von den Aussagen nach der Auferstehung sind die einen* Gott* angemessen, wie: „Taufet sie auf den Namen des Vaters und des Sohnes und des Hl. Geistes “, des Sohnes natürlich als Gott, und: „Siehe, ich bin bei euch alle Tage bis ans Ende der Welt “ u. dgl. Denn als Gott ist er bei uns. Die andern [Aussagen] aber sind dem* Menschen* angemessen, wie: „Sie umfaßten seine Füße “, und: „Dort werden sie mich sehen “ u. dgl.</p><p>Von den dem* Menschen* angemessenen [Aussagen] nach der Auferstehung gibt es verschiedene Weisen. Einiges [geschah] wirklich, aber nicht auf natürliche Weise, sondern gemäß der Heilsordnung zur Beglaubigung, daß derselbe Leib, der litt, auch auferstand, wie die Wundmale, das Essen und das Trinken nach der Auferstehung. Anderes aber [geschah] wirklich und natürlich, wie das mühelose Übergehen von einem Ort zum andern und das Eintreten durch die verschlossenen Türen. Anderes [geschah] durch Verstellung, wie: „Er stellte sich an, als wollte er weitergehen.“ Einiges gilt von beiden [Naturen] zusammen, wie das Wort: „Ich steige hinauf zu meinem Vater und eurem Vater, zu meinem Gott und eurem Gott “, und das: „Einziehen wird der König der Herrlichkeit “, und das: „Er setzte sich zur Rechten der Majestät in der Höhe.“ Anderes endlich [wird] von ihm, der sich ja gleichsam mit uns zusammenstellt, in Weise einer rein gedanklichen Trennung [ausgesagt], wie: „Meinem Gott und eurem Gott.“</p><p>Man muß also das Erhabene der göttlichen, über Leiden und Körperlichkeit erhabenen Natur zuteilen, das Niedrige dagegen der menschlichen, das Gemeinsame aber dem Zusammengesetzten, d. h. dem* einen* Christus, der Gott und Mensch ist, und man muß wissen, daß beides einem und demselben Jesus Christus, unserm Herrn, zukomme. Denn wenn wir das Eigentümliche eines jeden erkennen und einsehen, daß beides (═ Erhabenes und Niedriges) von* einem* vollbracht wird, so werden wir recht glauben und nicht irren. Aus all dem erkennt man den Unterschied der geeinten Naturen, und daß Gottheit und Menschheit in natürlicher Beschaffenheit nicht dasselbe sind, wie der so göttliche Cyrillus sagt: „Einer fürwahr ist Sohn und Christus und Herr.“ Und da er einer ist, so ist auch seine Person* eine,* denn infolge der Anerkennung des Unterschieds der Naturen wird in keiner Weise die hypostatische Einheit geteilt.</p><h3>XIX. KAPITEL. Gott ist nicht Urheber der Übel.</h3><p>Man muß wissen, daß die göttliche Schrift die Zulassung Gottes dessen Wirksamkeit zu nennen pflegt. So, wenn der Apostel im Briefe an die Römer sagt: „Oder hat nicht der Töpfer Gewalt über den Ton, um aus derselben Masse das eine Gefäß zur Ehre, das andere aber zur Unehre zu machen?“ Denn* er* macht sowohl dies wie das, nur er ist der Schöpfer aller Dinge. Aber nicht er selbst macht geehrte oder ungeehrte [Gefäße], sondern der eigene Wille eines jeden. Das erhellt aus dem, was derselbe Apostel im zweiten Briefe an Timotheus sagt: „In einem großen Hause gibt es nicht nur goldene und silberne Gefäße, sondern auch hölzerne und irdene; die einen zur Ehre, die andern zur Unehre. Wenn sich nun jemand von diesen (letzteren) rein hält, so wird er ein Gefäß zur Ehre sein, geheiligt, brauchbar für den Herrn, zu jedem guten Werke bereit.“ Offenbar geschieht die Reinhaltung freiwillig, denn er sagt: „Wenn jemand sich rein hält.“ Der folgerichtige Gegensatz dazu lautet: Wenn jemand sich nicht rein hält, wird er ein Gefäß zur Unehre sein, unbrauchbar für den Herrn, wert, zerbrochen zu werden. Der vorliegende Ausspruch also, ferner die Stelle: „Gott hat sie alle unter den Ungehorsam beschlossen (gebracht) “, ebenso die: „Gott gab ihnen den Geist der Betäubung, Augen, mit denen sie nicht sehen, und Ohren, mit denen sie nicht hören “ — dies alles ist nicht im Sinne von göttlicher Wirksamkeit, sondern im Sinne von göttlicher Zulassung zu nehmen, weil der Wille frei und das Gute ohne Zwang ist.</p><p>Die göttliche Schrift pflegt also seine Zulassung als sein Wirken und Tun zu bezeichnen. Ja, auch wenn sie sagt, „Gott schaffe Übles “, und es gebe in einer Stadt kein Übel, das nicht der Herr gemacht, stellt sie Gott nicht als Urheber der Übel hin, sondern [sagt so], weil der Name Übel zweideutig ist, zweierlei ausdrückt. Bisweilen bedeutet er nämlich das durch seine Natur Schlechte, was der Tugend und dem Willen Gottes entgegen ist, bisweilen das für unser Empfinden Schlimme und Lästige, d. i. die Trübsale und Mißgeschicke. Diese sind zwar scheinbar schlimm, da sie schmerzlich sind, in Wirklichkeit aber gut. Denn sie gereichen den Einsichtigen zur Bekehrung und Rettung. Diese, sagt die Schrift, geschehen durch Gott.</p><p>Man muß jedoch wissen, daß auch an diesen* wir* schuld sind. Denn aus den freiwilligen Übeln entspringen die unfreiwilligen.</p><p>Auch das muß man wissen, daß die Schrift manches, was ausgangsweise gesagt werden sollte, ursachsweise auszudrücken pflegt. So an der Stelle: „Gegen dich allein habe ich gesündigt und Böses vor dir getan, damit du gerecht erscheinst in deinen Worten und siegest, wenn man dich richtet.“ Denn der, der gesündigt, hat nicht deshalb gesündigt, damit Gott siege, noch bedurfte Gott unserer Sünde, um dadurch als Sieger zu erscheinen — denn er trägt in unvergleichlicher Weise über alle, auch über die, die nicht sündigen, den Sieg davon, weil er Schöpfer ist und unerfaßbar und ungeschaffen, und die natürliche Herrlichkeit, nicht eine erworbene hat —, nein, weil er, wenn wir sündigen, nicht ungerecht ist, sofern er zürnt, und verzeiht, wenn wir uns bekehren, deshalb zeigt er sich als Sieger über unsere Bosheit. Aber nicht zu diesem Zwecke sündigen wir, sondern die Sache geht eben so aus. Z. B.: Es sitzt jemand an der Arbeit, und ein Freund kommt dazu. Da sagt er: Damit ich heute nichts arbeite, ist der Freund gekommen. Doch der Freund ist nicht gekommen, damit er nichts arbeite, sondern es ist eben so geschehen. Weil er mit dem Empfang des Freundes beschäftigt ist, arbeitet er nicht. Es wird auch dieses ausgangsweise gesagt, weil die Dinge einen solchen Ausgang nehmen. Gott will aber nicht allein gerecht sein, sondern [er will], daß alle ihm möglichst ähnlich werden.</p><h3>XX. KAPITEL. Es gibt nicht zwei Prinzipe.</h3><p>Daß es nicht zwei Prinzipe, ein gutes und ein böses, gibt, werden wir daraus (═ aus dieser Abhandlung) erkennen. Denn das Gute und das Böse sind einander entgegengesetzt und zerstören sich gegenseitig und können nicht ineinander oder miteinander bestehen. Jedes von diesen wird also in einem Teile des Alls sein. Und fürs erste werden sie nicht bloß vom All umschrieben werden, sondern jedes davon wird auch von einem Teil des Alls [umschrieben werden].</p><p>Sodann: Wer hat einem jeden seinen Platz angewiesen? Denn man wird nicht sagen, sie hätten sich miteinander vertragen und verglichen, da das Böse nicht böse ist, wenn es Frieden hält und sich mit dem Guten vergleicht, und das Gute nicht gut, wenn es sich freundlich zum Bösen verhält. Ist es jedoch ein anderer, der jedem von diesen seinen Aufenthalt angewiesen, so wird vielmehr* dieser* Gott sein.</p><p>Es ist aber auch eins von beiden notwendig: Entweder berühren und zerstören sie sich gegenseitig, oder es gibt ein Mittleres, worin weder Gutes noch Böses sein wird, das wie eine Scheidewand beide voneinander trennt. Und dann werden es nicht mehr zwei, sondern drei Prinzipe sein.</p><p>Es ist aber auch das eine oder andere von folgendem notwendig: Entweder halten sie Frieden — doch dies kann das Böse nicht, denn was Frieden hält, ist nicht bös — oder sie kämpfen. Allein dies kann das Gute nicht, denn was kämpft, ist nicht vollkommen gut. Oder das Böse kämpft, das Gute aber kämpft nicht dagegen, sondern wird vom Bösen zerstört oder immerfort mißhelligt und mißhandelt, was wahrlich kein Merkmal des Guten ist. Es existiert also* ein* Prinzip, das von allem Bösen frei ist.</p><p>Aber, sagen sie, wenn dem so ist, woher das Böse? Denn unmöglich hat das Böse vom Guten seinen Ursprung. Wir sagen: Das Böse ist nichts anderes als Beraubung des Guten, Abkehr vom Naturgemäßen und Hinkehr zum Naturwidrigen. Denn nichts ist von Natur aus böse. Alles, was Gott gemacht, ist ja sehr gut, sofern es geschaffen ist. Bleibt es also, wie es geschaffen ist, so ist es sehr gut. Tritt es aber freiwillig aus dem Naturgemäßen heraus und geht es zum Naturwidrigen über, so wird es böse.</p><p>Naturgemäß ist alles dem Schöpfer untertan und gehorsam. Wenn also eines der Geschöpfe freiwillig die Zügel abstreift und seinem Schöpfer ungehorsam wird, so begründet es in sich selbst das Böse. Denn das Böse ist keine Wesenheit noch Eigentümlichkeit einer Wesenheit, sondern etwas Hinzukommendes (═ ein Akzidens), d. h. die freiwillige Abkehr vom Naturgemäßen und Hinkehr zum Naturwidrigen, was eben Sünde ist.</p><p>Woher also die Sünde? Sie ist eine Erfindung der freien Entschließung des Teufels. Ist also der Teufel bös? Sofern er geschaffen ist, ist er nicht bös, sondern gut. Denn als lichter, hellstrahlender Engel ward er vom Schöpfer geschaffen, selbstmächtig, da vernünftig. Freiwillig machte er sich von der naturgemäßen Tugend los, er geriet in die Finsternis der Bosheit, nachdem er sich von Gott, dem allein Guten, dem Lebensspender und Lichtgeber, entfernt. Denn durch ihn ist alles Gute gut. Sofern es sich aber von ihm der Gesinnung, nicht dem Orte nach entfernt, wird es bös.</p><h3>XXI. KAPITEL. Warum erschuf der vorauswissende Gott die, die sündigen und nicht Buße tun werden?</h3><p>Gott bringt aus Güte das Werdende aus dem Nichtsein ins Sein hervor und weiß das Künftige voraus. Würden sie also gar nicht* sein,* so würden sie auch nicht böse sein und nicht vorausgewußt werden. Denn auf das, was* ist,* geht die Erkenntnis, und auf das, was gewiß* sein wird,* das Vorauswissen. Zuerst das Sein und dann das Gut- oder Bössein. Würde nämlich der Umstand, daß die, die durch Gottes Güte künftig* sein* sollen, aus eigenem Willen böse sein werden, ihre Erschaffung verhindern, so würde das Böse die Güte Gottes besiegen. Es macht also Gott alles, was er macht, gut. Jeder aber wird durch eigenen Willen gut oder bös. Zwar sagte der Herr: „Es wäre jenem Menschen besser, wenn er nicht geboren wäre.“ Allein mit diesen Worten tadelte er nicht seine eigene Schöpfung, sondern die Bosheit, die sich bei seinem Geschöpf durch eigenen Willen und Leichtsinn eingestellt. Denn der Leichtsinn der eigenen Gesinnung hat die Wohltat des Schöpfers für ihn unnütz gemacht. [Das ist geradeso], wie wenn einer, der von seinem König Reichtum und Herrschaft bekommen, seinen Wohltäter vergewaltigen will. Jener wird ihn mit Recht unterwerfen und strafen, wenn er sieht, daß dieser fort und fort bei seiner Tyrannei beharrt.</p><h3>XXII. KAPITEL. Vom Gesetz Gottes und Gesetz der Sünde.</h3><p>Gut, übergut ist das göttliche Wesen und sein Wille. Denn was Gott will, das ist gut. Gesetz aber ist das Gebot, das dies lehrt, damit wir darin verharren und so im Lichte seien. Die Übertretung dieses Gebotes ist Sünde. Diese aber kommt durch den Angriff des Teufels und unsere ungezwungene, freiwillige Zustimmung zustande. Auch diese heißt Gesetz.</p><p>„Das Gesetz Gottes “, das in unserer Vernunft waltet, zieht diese an sich und stachelt unser Gewissen auf. Es heißt auch unser Gewissen Gesetz unserer Vernunft. Und der Angriff „des Bösen “ (═ des Teufels) ist das Gesetz der Sünde, das in den Gliedern unseres Fleisches waltet. Es greift durch dasselbe (═ das Fleisch) uns an. Denn nachdem wir einmal freiwillig „das Gesetz Gottes“ übertraten und dem Angriff „des Bösen“ zustimmten, gewährten wir ihm Zugang, wir verkauften uns selbst an die Sünde. Deshalb wird unser Leib leicht zu ihr hingezogen. Es heißt also auch der Geruch und die Empfindung der Sünde, die sich in unserem Leibe befinden, d. h. die Begierde und Lust des Leibes, Gesetz in den Gliedern unseres Fleisches.</p><p>„Das Gesetz meiner Vernunft “ oder das Gewissen freut sich an dem Gesetze oder Gebote Gottes und will dieses. „Das Gesetz der Sünde“ aber oder der Angriff durch „das Gesetz in den Gliedern“ oder durch die Begierde und Neigung und Bewegung des Leibes und des unvernünftigen Teiles der Seele widerstreitet dem Gesetz meiner Vernunft, d. i. dem Gewissen, und nimmt mich gefangen infolge der Vermischung [der Seele mit dem Leibe], auch wenn ich „das Gesetz Gottes“ will und liebe und die Sünde nicht will, und verführt mich, wie gesagt, durch die Lockung der Lust und die Begier des Leibes und des unvernünftigen Teiles der Seele, und beredet mich, der Sünde zu dienen. Aber „was dem Fleisch unmöglich war, weil es durch das Fleisch unvermögend war, das hat Gott getan: Er sandte seinen Sohn in Gestalt des Sündenfleisches“ — Fleisch nahm er an, Sünde aber keineswegs — „und verdammte die Sünde im Fleische, damit die Forderungen des Gesetzes in denen erfüllt werden, die nicht nach dem Fleische wandeln, sondern nach dem Geiste.“ Denn „der Geist hift unserer Schwäche auf “ und verleiht dem „Gesetz unserer Vernunft“ Kraft gegen „das Gesetz in unsern Gliedern“. Denn: „Um was wir bitten sollen, so wie es sich ziemt, wissen wir nicht, aber der Geist selbst tritt für uns ein mit unaussprechlichen Seufzern “, d. h. er lehrt uns, um was wir bitten sollen. Darum ist es unmöglich, anders als durch Geduld und Gebet die Gebote des Herrn zu erfüllen.</p><h3>XXIII. KAPITEL. Gegen die Juden. Vom Sabbat.</h3><p>Sabbat heißt der siebente Tag. Er bedeutet die Ruhe. Denn an ihm „ruhte Gott von allen seinen Werken “, wie die göttliche Schrift sagt. Darum macht auch die Zahl der Tage, wenn sie bis sieben fortgeschritten ist, wieder den Kreislauf und beginnt mit dem ersten [Tage]. Diese Zahl stand bei den Juden in Ehren, da Gott befahl, sie zu ehren, und das nicht beliebig, sondern unter den schwersten Strafen im Übertretungsfalle. Nicht grundlos befahl er dies, sondern aus gewissen Gründen, die von „Geistigen “ und Scharfsichtigen mystisch verstanden werden.</p><p>Was mich, den Ungelehrten, betrifft, so ist meine Ansicht darüber — ich beginne mit dem Niedrigeren und Gröberen — folgende: Gott kannte die Roheit und Fleischlichkeit und ganz materielle Neigung des israelitischen Volkes, zugleich aber auch seinen Unverstand. Darum [befahl er es], erstens damit der Knecht und das Zugvieh ruhe, wie geschrieben steht, weil „ein gerechter Mann sich seines Viehes erbarmt “, dann aber auch, damit sie (═ die Israeliten) sich der Beschäftigung mit der Materie enthielten, sich zu Gott hinsammelten, „mit Psalmen und Lobgesängen und geistlichen Liedern “ und Studium der göttlichen Schriften den ganzen siebenten Tag verbrächten und in Gott ruhten. Denn als es noch kein Gesetz und keine „von Gott eingegebene Schrift “ gab, war auch der Sabbat Gott nicht geheiligt. Als aber „die von Gott eingegebene Schrift“ durch Moses gegeben ward, wurde der Sabbat Gott geheiligt, damit sich an ihm auf das Studium dieser (═ der Schrift) die verlegten, die nicht ihr ganzes Leben Gott weihten, die nicht aus Liebe dem Herrn als Vater dienten, sondern als gedankenlose Knechte, und wenigstens einen kleinen, ganz geringen Teil ihres Lebens Gott widmeten, und dies aus Furcht vor Rechenschaft und Strafe im Übertretungsfalle. Denn „das Gesetz gilt nicht für den Gerechten, sondern für den Ungerechten “. Denn zuerst hat Moses, da er vierzig Tage und wieder weitere vierzig unter Fasten bei Gott lag, sicherlich auch an den Sabbaten sich durch Fasten kasteit, während doch das Gesetz befahl, sich am Tage des Sabbats nicht zu kasteien. Wollten sie aber sagen, das sei* vor* dem Gesetz gewesen, was werden sie von Elias dem Thesbiter sagen, der mit einer einzigen Speise einen Weg von vierzig Tagen zurückgelegt? Denn da dieser nicht bloß durch Fasten, sondern auch durch die Reise sich an den Sabbaten der vierzig Tage kasteit, so hat er den Sabbat verletzt. Und doch hat Gott, der das Gesetz gegeben, diesem nicht gezürnt, sondern er hat sich ihm sogar gleichsam als Tugendlohn auf dem Horeb geoffenbart. Was werden sie ferner von Daniel sagen? Hat er nicht drei Wochen ohne Speise zugebracht? Wie? Beschneidet nicht ganz Israel das Knäblein am Sabbat, wenn es da gerade acht Tage alt ist? Und werden sie (═ die Israeliten) nicht auch das große Fasten, das ihnen im Gesetz vorgeschrieben ist, halten, wenn es etwa auf den Sabbat trifft? Und entweihen nicht auch die Priester und die Leviten bei den Arbeiten im Zelte (═ Tempel) den Sabbat und sind doch schuldlos? Aber auch der, der ein Vieh, das am Sabbat in eine Grube fällt, herauszieht, ist ohne Schuld, schuldig, wer es unterläßt. Und wie? Ist nicht ganz Israel, die Gotteslade tragend, sieben Tage lang um die Mauern Jerichos gezogen, worunter sicherlich auch der Sabbat war?</p><p>Also, wie gesagt, wegen der Beschäftigung mit Gott, damit sie wenigstens einen ganz geringen Zeitteil ihm widmeten und ruhten, der Knecht wie das Vieh, ward die Beobachtung des Sabbats ersonnen, für „die noch Unmündigen und den Elementargeistern Untertanen “, für „die fleischlich Gesinnten “ und die, die nicht über den Leib und den Buchstaben hinaus zu denken vermögen. „Als aber die Fülle der Zeit kam, sandte Gott seinen eingeborenen Sohn, Mensch geworden aus dem Weibe, Untertan dem Gesetze, um die, die unter dem Gesetze standen, zu erlösen, damit wir als Kinder angenommen würden.“ Denn uns „allen, die ihn aufnahmen, gab er Macht, Kinder Gottes zu werden, [uns,] die an ihn glauben “. Daher sind wir nicht mehr Knechte, sondern Söhne, nicht mehr „unter dem Gesetze, sondern unter der Gnade “. Wir dienen nicht mehr zeitweilig dem Herrn aus Furcht, sondern wir müssen die ganze Lebenszeit ihm weihen, wir lassen den Knecht, ich meine den Zorn und die Begierde, immerdar von der Sünde ruhen und bei Gott feiern, all unsere Begierde richten wir immerdar auf Gott, den Zorn aber waffnen wir gegen die Feinde Gottes und ebenso lassen wir das Lasttier, d. h. den Leib, vom Knechtesdienst der Sünde ruhen und treiben es an, den göttlichen Geboten zu gehorchen.</p><p>Dies befiehlt uns das geistige Gesetz Christi, und die dieses beobachten, sind über das mosaische Gesetz erhaben. Denn als das Vollendete gekommen, hat das Stückwerk aufgehört, und als die Hülle des Gesetzes oder der Vorhang durch die Kreuzigung des Heilands zerriß, und der Geist in feurigen Zungen aufleuchtete, ward der Buchstabe abgetan, das Körperliche beendet, das Gesetz der Knechtschaft erfüllt und „das Gesetz der Freiheit “ uns geschenkt. Und wir feiern die vollkommene Ruhe der menschlichen Natur, ich meine den Tag der Auferstehung, an dem uns der Herr Jesus, „der Führer zum Leben und Heiland “, in das Erbteil eingeführt, das denen verheißen ist, die auf geistige Weise Gott dienen, in das er selbst als unser Vorläufer eingegangen, als er von den Toten auferstanden. Es öffneten sich ihm die Himmelspforten, und er setzte sich leibhaftig zur Rechten Gottes. Dahin werden auch die kommen, die das geistige Gesetz beobachten.</p><p>Uns also, die wir nach dem Geiste und nicht nach dem Buchstaben wandeln, kommt die völlige Ablegung des Fleischlichen, der geistige Gottesdienst und die Verbindung mit Gott zu. Beschneidung ist das Ablegen der körperlichen Lust und des Überflüssigen und nicht Notwendigen. Vorhaut ist nämlich nichts anderes als die überflüssige Haut eines wollüstigen Gliedes. Jede Lust jedoch, die nicht aus Gott und in Gott ist, ist eine überflüssige Lust, deren Sinnbild die Vorhaut ist. Sabbat aber ist die Ruhe von der Sünde. Daher sind beide (═ Beschneidung und Sabbat) eines, und so bewirken beide zusammen, wenn sie von den „Geistigen“ beobachtet werden, nicht die mindeste Ungesetzlichkeit.</p><p>Ferner muß man wissen, daß die Siebenzahl die ganze gegenwärtige Zeit bedeutet. So sagt der hochweise Salomon, man solle unter sieben und wohl auch unter acht austeilen. Und der göttlich redende David sang, da er für die Oktav Psalmen machte, von der Wiederherstellung, die nach der Auferstehung von den Toten kommen wird. Als das Gesetz befahl, am siebenten Tage sich vom Körperlichen zu enthalten und dem Geistigen zu obliegen, zeigte es dem wahren Israel, das befähigt ist, Gott zu sehen, auf mystische Weise [die Pflicht] an, die ganze Zeit sich Gott zu weihen und sich über das Körperliche zu erheben.</p><h3>XXIV. KAPITEL. Von der Jungfräulichkeit.</h3><p>„Die Fleischlichen “ schmähen die Jungfräulichkeit, und zum Zeugnis führen die Lüstlinge das Wort an: „Verflucht jeder, der keine Nachkommenschaft erweckt in Israel.“ Wir aber sagen, uns auf den Gott-Logos stützend, der aus der Jungfrau Fleisch angenommen, daß die Jungfräulichkeit von vornherein und von Anfang der Menschennatur eingepflanzt wurde. Denn aus jungfräulicher Erde ward der Mensch gebildet. Nur aus Adam ward die Eva erschaffen. Im Paradiese waltete Jungfräulichkeit. Es sagt ja die göttliche Schrift, daß sie nackt waren, Adam und Eva, und sich nicht schämten. Als sie aber [das Gebot] übertraten, erkannten sie, daß sie nackt waren, und sie schämten sich und flochten sich Schürzen. Und erst dann, als er nach der Übertretung hörte: „Erde bist du und zur Erde sollst du zurückkehren “, als infolge der Übertretung der Tod in die Welt kam, „erkannte Adam die Eva, sein Weib, und sie empfing und gebar “. Darum also ward die Ehe ersonnen, damit das Geschlecht vom Tode nicht aufgerieben und vernichtet würde. Es sollte durch die Kindererzeugung das Menschengeschlecht erhalten werden.</p><p>Aber sie werden vielleicht sagen: Was will also das Wort: „Mann und Weib “ und das: „Wachset und mehret euch “? Darauf werden wir erwidern: Das „wachset und mehret euch“ bedeutet sicherlich nicht die Vermehrung durch ehelichen Verkehr. Es konnte ja Gott auch auf andere Weise das Geschlecht vermehren, wenn sie bis ans Ende das Gebot unverletzt beobachteten. Allein Gott, der alles weiß, eh’ es geschieht, wußte kraft seines Vorauswissens, daß sie die Übertretung begehen und zum Tode verurteilt würden. Darum erschuf er zum voraus Mann und Weib und befahl ihnen, zu wachsen und sich zu mehren. Wir wollen daher des Weges weitergehen und die Vorzüge der Jungfräulichkeit betrachten, dasselbe aber auch von der Keuschheit sagen.</p><p>Wie Noë den Befehl erhält, in die Arche zu gehen, und ihm die Erhaltung des Weltsamens übertragen wird, empfängt er den Auftrag: „Gehe hinein, du und deine Söhne und dein Weib und die Weiber deiner Söhne.“ Er sonderte sie von den Weibern ab, damit sie mittels der Keuschheit dem Meere und jenem Allerweltsschiffbruche entgingen. Nach dem Aufhören der Sintflut sprach er: „Gehe heraus, du und dein Weib und deine Söhne und die Weiber deiner Söhne.“ Siehe, hier ward wieder der Vermehrung wegen die Ehe gestattet. Sodann Elias, der feueratmende Wagenlenker und Himmelsfahrer, huldigte er nicht der Ehelosigkeit und bewahrte sie durch seine übermenschliche Himmelfahrt? Wer verschloß die Himmel? Wer erweckte Tote? Wer teilte den Jordan? Nicht der jungfräuliche Elias? Und Elisäus, sein Schüler, hat er nicht, da er die gleiche Tugend (═ die Jungfräulichkeit) bewiesen, in doppeltem Maße die Gnade des Geistes empfangen, um die er gebeten? Und die drei Jünglinge? Haben sie nicht durch Übung der Jungfräulichkeit das Feuer überwunden, da ihre Leiber durch die Jungfräulichkeit vom Feuer nicht verzehrt werden konnten? War es nicht Daniel, dessen Leib durch die Jungfräulichkeit so gehärtet war, daß die Zähne der wilden Tiere nicht einzudringen vermochten? Gab nicht Gott, da er den Israeliten erscheinen wollte, den Befehl, den Leib keusch zu halten? Hielten sich nicht die Priester rein und gingen so in das Heiligtum ein und brachten die Opfer dar? Hat nicht das Gesetz die Keuschheit ein großes Gelübde genannt?</p><p>Man muß also die Vorschrift des Gesetzes mehr geistig nehmen. Es gibt nämlich eine geistige Nachkommenschaft. Sie wird durch Liebe und Furcht Gottes im seelischen Schoße empfangen, der den Geist des Heiles gebiert und hervorbringt. So ist auch das Wort zu fassen: „Selig, wer Nachkommenschaft hat in Sion und Verwandte in Jerusalem.“ Denn wie ist einer, trotzdem er „ein Hurer oder Trunkenbold oder Götzendiener “ ist, selig, wenn er nur Nachkommenschaft in Sion und Verwandte in Jerusalem hat? Kein Vernünftiger wird das behaupten.</p><p>Jungfräulichkeit ist der Wandel der Engel, die Eigentümlichkeit einer jeden unkörperlichen Natur. Das sagen wir nicht, um die Ehe zu schmähen, das sei ferne — wir wissen ja, daß der Herr in seiner Gegenwart die Ehe segnete und [wir kennen] den, der gesagt: „Ehrbar sei die Ehe, und das Ehebett unbefleckt “ —, sondern weil wir erkennen, daß die Jungfräulichkeit besser ist als die Ehe, die ja gut ist. Denn sowohl bei den Tugenden wie bei den Lastern gibt es höhere und geringere Grade. Wir wissen, daß, abgesehen von den Stammeltern des Geschlechts, alle Sterblichen Sprößlinge der Ehe sind. Denn jene sind ein Gebilde der Jungfräulichkeit, und nicht der Ehe. Allein die Ehelosigkeit ist, wie gesagt, eine Nachahmung der Engel. Um soviel also ein Engel höher steht als ein Mensch, um soviel ist Jungfräulichkeit wertvoller als Ehe. Doch was sage ich? Ein Engel? Christus selbst ist der Ruhm der Jungfräulichkeit. Denn er ist nicht bloß aus dem Vater ohne Anfang, ohne [Samen] fluß und ohne Paarung erzeugt, sondern er hat auch, da er Mensch wurde wie wir, auf höhere Weise als wir Fleisch angenommen, nämlich aus einer Jungfrau ohne Geschlechtsgemeinschaft, und er hat selbst die wahre und vollkommene Jungfräulichkeit an sich gezeigt. Darum hat er auch diese für uns nicht zum Gesetze gemacht — denn „nicht alle fassen das Wort “, wie er selbst gesagt —, allein durch die Tat hat er uns [in ihr] unterwiesen und uns dazu befähigt. Denn wem ist nicht klar, daß jetzt die Jungfräulichkeit unter den Menschen heimisch ist?</p><p>Gut ist die Kindererzeugung, welche die Ehe erzielt, und gut die Ehe „wegen [der Gefahr] der Unzuchtssünden “, da sie diese abschneidet und das Wutartige der Begierde durch die gesetzliche Verbindung nicht zum ungesetzlichen Handeln ausrasen läßt. Gut ist die Ehe für die, denen nicht Enthaltsamkeit innewohnt. Besser aber ist die Jungfräulichkeit, welche die Fruchtbarkeit der Seele mehrt und Gott als reife Frucht das Gebet darbringt. „Ehrbar sei die Ehe, und das Ehebett unbefleckt, Unzüchtige und Ehebrecher aber wird Gott richten.“</p><h3>XXV. KAPITEL. Von der Beschneidung.</h3><p>Die Beschneidung ward vor dem Gesetz dem Abraham nach den Segnungen, nach der Verheißung gegeben als ein Zeichen, das ihn und seine Kinder und seine Hausgenossen von den Heiden, mit denen er verkehrte, unterscheiden sollte. Es ist klar: Als Israel vierzig Jahre in der Wüste allein für sich verweilte, ohne mit einem andern Volk in Berührung zu kommen, wurden alle, die in der Wüste geboren wurden, nicht beschnitten. Als aber Josue sie (═ die Israeliten) über den Jordan führte, wurden sie beschnitten, und es entstand ein zweites Gesetz der Beschneidung. Unter Abraham ward nämlich ein Gesetz der Beschneidung gegeben, dann ruhte es in der Wüste vierzig Jahre. Und wiederum zum zweitenmal gab Gott dem Jesus (═ Josue) ein Gesetz der Beschneidung nach dem Übergang über den Jordan, wie im Buche Jesus (═ Josue), des Sohnes Naves, geschrieben steht: „Um diese Zeit sprach der Herr zu Jesus (═ Josue): Mache dir steinerne Messer aus hartem Stein und setze dich und beschneide die Söhne Israels zum zweitenmal.“ Und kurz darauf: „Zweiundvierzig Jahre lang weilte Israel in der Wüste Madbaritis. Darum waren von ihnen (═ den Israeliten) unbeschnitten geblieben die meisten der Kämpfer, die aus Ägypten ausgezogen waren, die den Befehlen Gottes nicht gehorcht, denen er auch erklärt, daß sie das gute Land nicht sehen, das der Herr ihren Vätern zu geben zugeschworen, das Land, das von Milch und Honig fließt. An deren Stelle aber setzte er ihre Söhne, die Jesus (═ Josue) beschnitt, weil sie auf dem Wege nicht beschnitten worden waren.“ Die Beschneidung war also ein Zeichen, das Israel von den Heiden schied, mit denen es verkehrte.</p><p>Sie war ein Vorbild der Taufe. Denn wie die Beschneidung kein nützliches Glied des Leibes abschneidet, sondern einen unnützen Überfluß, so werden wir durch die heilige Taufe an der Sünde beschnitten. Die Sünde ist aber offenbar gleichsam ein Überfluß von Begierde und kein nützliches Begehren. Es ist ja unmöglich, überhaupt nicht zu begehren oder vollständig ohne Lustgenuß zu sein. Aber das Unnütze der Lust, d. h. die unnütze Begierde und Lust, d. i. die Sünde, welche die heilige Taufe beschneidet, indem sie uns als Zeichen das kostbare Kreuz auf die Stirne gibt, nicht um uns von [andern] Völkern abzusondern — denn alle Völker gelangten zur Taufe und wurden mit dem Zeichen des Kreuzes besiegelt —, sondern um in jedem Volke den Gläubigen vom Ungläubigen zu unterscheiden. Nachdem also die Wahrheit offenbar geworden, ist das Vorbild und der Schatten unnütz. Daher ist jetzt die Beschneidung überflüssig und der heiligen Taufe zuwider. „Denn wer sich beschneiden läßt, ist verpflichtet, das ganze Gesetz zu beobachten.“ Der Herr aber ließ sich beschneiden, um das Gesetz zu erfüllen. Er beobachtete das ganze Gesetz und den Sabbat, um das Gesetz zu erfüllen und zu bestätigen. Seitdem er aber getauft worden, und der Hl. Geist den Menschen erschienen ist, als er in Gestalt einer Taube auf ihn herabkam, seitdem ward der geistige Gottesdienst und Lebenswandel und das Himmelreich verkündet.</p><h3>XXVI. KAPITEL. Vom Antichrist.</h3><p>Man muß wissen, daß der Antichrist kommen muß. Nun ist zwar „jeder, der nicht bekennt, daß der Sohn Gottes im Fleische gekommen “ und vollkommener Gott ist und zum Gottsein hin vollkommener Mensch geworden, ein Antichrist (Widerchrist). Gleichwohl heißt besonders und vorzugsweise Antichrist der, der „am Ende der Welt “ kommt. Es muß also zuerst das Evangelium unter allen Völkern verkündet sein, wie der Herr sagt, und dann wird er kommen zur Überführung der gottesfeindlichen Juden. Sprach doch zu ihnen der Herr: „Ich bin im Namen meines Vaters gekommen, aber ihr nehmt mich nicht an. Ein anderer kommt in seinem eigenen Namen, den werdet ihr annehmen.“ Und der Apostel: „Darum, weil sie die Liebe zur Wahrheit nicht angenommen, um gerettet zu werden. Und deshalb wird Gott ihnen wirkungsvollen Trug schicken, daß sie der Lüge glauben, damit alle gerichtet werden, die der Wahrheit nicht geglaubt, sondern an der Ungerechtigkeit Gefallen gehabt.“ Die Juden nahmen also den wirklichen Sohn Gottes, den Herrn Jesus Christus und Gott, nicht auf, den Betrüger aber, der sich für Gott ausgibt, werden sie aufnehmen. Denn daß er sich Gott nennen wird, das sagt der Engel, der den Daniel belehrt, mit folgenden Worten: „Auf die Götter seiner Väter wird er nicht achten “, und der Apostel: „Niemand betöre euch auf irgendeine Weise, denn zuvor muß Abfall kommen und der Mensch der Gesetzlosigkeit, der Sohn des Verderbens offenbar werden, der der Widersacher ist und sich über alles erhebt, was Gott heißt und göttlich verehrt wird, so daß er sich in den Tempel Gottes setzt und sich als Gott ausgibt “ — in den Tempel Gottes, nicht den unsrigen, sondern den alten, den jüdischen. Denn nicht zu uns, sondern zu den Juden wird er kommen, nicht für Christus und die Christen, weshalb er auch Widerchrist (Antichrist) heißt.</p><p>Es muß also zuerst das Evangelium unter allen Völkern verkündet sein, und „alsdann wird offen hervortreten der Ruchlose, dessen Ankunft in Kraft des Satans erfolgt mit jeglicher Machttat und trügerischen Zeichen und Wundern, mit jedem Trug der Ungerechtigkeit für die, die verloren gehen, den der Herr töten wird mit dem Worte seines Mundes und zunichte machen durch seine Wiederkunft “. Nicht der Teufel selbst also wird Mensch nach Art der Menschwerdung des Herrn. Das sei ferne! Nein, ein Mensch wird aus Hurerei erzeugt und empfängt die ganze Wirksamkeit des Satans. Denn Gott, der die Verkehrtheit seines künftigen Willens vorausweiß, gestattet dem Teufel, in ihm zu wohnen.</p><p>Erzeugt also wird er, wie gesagt, aus Hurerei und in der Verborgenheit aufgezogen, und plötzlich steht er auf und erhebt sich und herrscht. Und im Anfang seiner Herrschaft oder vielmehr Gewaltherrschaft heuchelt er Heiligkeit. Wann er aber mächtig geworden, verfolgt er die Kirche Gottes und offenbart seine ganze Schlechtigkeit. Er wird kommen „mit trügerischen Zeichen und Wundern “, erdichteten und nicht wirklichen, und die, deren Denken eine schwache, nicht starke Grundlage hat, täuschen und vom „lebendigen Gott “ abtrünnig machen, „so daß womöglich auch die Auserwählten irregeführt werden “.</p><p>Es wird aber Henoch und Elias der Thesbiter gesandt werden und „sie werden die Herzen der Väter zu den Kindern kehren “, d. i. die Synagoge zu unserm Herrn Jesus Christus und der Predigt der Apostel und von ihm (═ dem Antichrist) getötet werden. Und der Herr wird so vom Himmel kommen, wie ihn die heiligen Apostel in den Himmel hinauffahren sahen, als vollkommener Gott und vollkommener Mensch, „mit Macht und Herrlichkeit “, und er wird den Menschen der Gesetzlosigkeit, den Sohn des Verderbens mit dem Hauche seines Mundes töten. Niemand also erwarte den Herrn von der Erde, sondern vom Himmel her, wie er selbst versichert hat.</p><h3>XXVII. KAPITEL. Von der Auferstehung.</h3><p>Wir glauben auch an eine Auferstehung der Toten. Denn es wird wirklich, ja es wird eine Auferstehung der Toten stattfinden. Reden wir aber von Auferstehung, so meinen wir eine Auferstehung der* Leiber*. Auferstehung ist ja eine Wiedererstehung dessen, was dahingesunken. Wie wird es also möglich sein, daß die Seelen, die doch unsterblich sind, auferstehen? Definiert man den Tod als eine Trennung der Seele vom Leibe, so ist Auferstehung sicherlich eine Wiederverbindung von Seele und Leib und eine Wiedererstehung des aufgelösten und dahingesunkenen Lebewesens. Der Leib selbst also, der vergeht und sich auflöst, der wird unvergänglich auferstehen. Denn der, der am Anfang ihn aus dem Erdenstaub gebildet, vermag recht wohl ihn, der nach dem Richterspruch des Schöpfers sich wieder auflöste und zur Erde zurückkehrte, von der er genommen war, wiederherzustellen.</p><p>Gibt es keine Auferstehung, dann „laßt uns essen und trinken “, ein Freuden- und Genußleben führen. Gibt es keine Auferstehung, worin unterscheiden wir uns dann von den Tieren? Gibt es keine Auferstehung, dann laßt uns „die Tiere des Feldes “ selig preisen, die ein sorgenfreies Leben führen. Gibt es keine Auferstehung, dann gibt es auch keinen Gott und keine Vorsehung, sondern alles geht und vollzieht sich durch Zufall. Denn siehe, wir sehen, daß sehr viele Gerechte in Armut leben und Unrecht leiden und keine Hilfe im gegenwärtigen Leben erlangen, daß Sünder und Ungerechte aber in Reichtum und jeglicher Üppigkeit schwelgen. Welcher Vernünftige sollte dies für ein Werk „eines gerechten Gerichtes “ oder einer weisen Vorsehung halten? Es wird also, ja es wird eine Auferstehung stattfinden. Denn Gott ist gerecht, und er wird denen, die bei ihm ausharren, ein Vergelter. Hat die Seele allein in den Tugendkämpfen gerungen, dann wird sie auch allein gekrönt werden. Und hätte sie sich allein in den Lüsten gewälzt, dann würde sie mit Recht allein gestraft. Doch da sie ohne den Leib weder der Tugend noch dem Laster nachgegangen, werden mit Recht beide zugleich auch die Vergeltung empfangen.</p><p>Es bezeugt aber auch die göttliche Schrift, daß eine Auferstehung der Leiber stattfinden wird. Sagt doch Gott nach der Sintflut zu Noë: „Wie das grüne Kraut gebe ich euch alles. Nur Fleisch, das noch sein Blut in sich hat, sollt ihr nicht essen. Und ich will euer eigenes Blut rächen, an allen Tieren will ich es rächen und an jedem Menschen, auch am Manne, der sein Bruder ist, will ich sein (═ des Menschen) Leben rächen. Wer Menschenblut vergießt, dessen Blut soll auch vergossen werden. Denn nach Gottes Bild habe ich den Menschen geschaffen.“ Wie wird er das Blut des Menschen an allen Tieren [anders] rächen, als daß er die Leiber der gestorbenen Menschen auferwecken wird? Denn nicht werden für den Menschen die Tiere sterben.</p><p>Ferner [sprach er] zu Moses: „Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs.“ Aber „Gott ist kein Gott von Toten“, von solchen, die gestorben sind und nicht mehr sein werden, „sondern von Lebendigen “, deren Seelen in seiner Hand leben, deren Leiber aber durch die Auferstehung wieder leben werden. Und der Stammvater Gottes, David, sagt zu Gott: „Nimmst du ihren Odem weg, so schwinden sie hin und werden wieder Staub.“ Sieh, von den Leibern ist die Rede! Dann fährt er fort: „Sendest du aus deinen Geist, so werden sie geschaffen, und du erneuerst das Angesicht der Erde.“</p><p>Ferner Isaias: „Auferstehen werden die Toten und auferweckt werden, die in den Gräbern sind.“ Es ist klar, daß nicht die Seelen, sondern die Leiber in die Gräber gelegt werden.</p><p>Und der selige Ezechiel sagt: „Als ich weissagte, siehe, da entstand eine Erderschütterung, und die Gebeine näherten sich, Gebein zu Gebein, ein jedes zu seinem Gelenk. Und ich schaute, und siehe, es entstanden an ihnen Sehnen, und Fleisch wuchs an und legte sich über sie, und die Haut spannte sich darüber.“ Dann lehrt er, wie auf Befehl der Geist zurückkehrt.</p><p>Und der göttliche Daniel sagt: „In jener Zeit wird Michael, der große Fürst, sich erheben, der für die Söhne seines Volkes einsteht. Und es wird eine Zeit der Trübsal sein, eine Trübsal, wie keine gewesen, seitdem ein Volk auf der Erde existiert bis zu jener Zeit. Und in jener Zeit wird dein Volk gerettet werden, ein jeder, von dem sich zeigt, daß er im Buche aufgeschrieben ist. Und viele von denen, die im Erdenstaube schlafen, werden auferweckt werden, die einen zum ewigen Leben, die andern zur ewigen Schmach und Schande. Und die einsichtig waren, werden strahlen wie der Glanz der Himmelsfeste und sie werden unter den vielen Gerechten wie Sterne leuchten auf immer und ewig.“ Wenn er sagt: „Viele, die im Erdenstaube schlafen, werden auferweckt werden“, so ist klar, daß er die Auferstehung der* Leiber* meint. Denn es wird doch wohl niemand behaupten, daß die* Seelen* im Erdenstaube schlafen.</p><p>Aber fürwahr, auch der Herr lehrt in den heiligen Evangelien sehr deutlich die Auferstehung der Leiber. Denn er sagt: „Die in den Gräbern sind, werden die Stimme des Sohnes Gottes hören, und es werden [aus den Gräbern] hervorkommen, die das Gute getan, zur Auferstehung zum Leben, die aber das Schlechte getrieben, zur Auferstehung zum Gericht.“ Kein Vernünftiger aber dürfte je sagen, in den Gräbern seien die* Seelen*.</p><p>Doch nicht bloß mit Worten, sondern auch durch die Tat hat er die Auferstehung der Leiber gelehrt. Erstens hat er den Lazarus erweckt, der schon vier Tage lag und bereits in Verwesung überging und roch. Denn nicht eine des Leibes beraubte Seele, sondern einen Leib mit der Seele, und keinen andern [Leib], sondern den verwesenden selbst hat er erweckt. Denn wie wäre es möglich gewesen, daß man die Auferstehung des Gestorbenen erkannt oder geglaubt hätte, ohne daß die charakteristischen Eigentümlichkeiten diese bestätigt? Er erweckte jedoch den Lazarus zum Erweise seiner Gottheit und zur Beglaubigung seiner wie unserer Auferstehung. Er (═ Lazarus) mußte wieder in den Tod zurückkehren. Der Herr selbst aber ist der Erstling der vollkommenen, dem Tode nicht mehr unterliegenden Auferstehung geworden. Darum sagte auch der göttliche Apostel Paulus: „Wenn Tote nicht erweckt werden, ist auch Christus nicht erweckt worden. Ist aber Christus nicht erweckt worden, dann ist euer Glaube vergeblich, und wir sind noch in unsern Sünden “, und: „Weil Christus erweckt worden ist [und zwar] als Erstling der Entschlafenen “, und: „Erstgeborener von den Toten “, und wiederum: „Denn wenn wir glauben, daß Jesus gestorben und auferstanden ist, so wird ja auch Gott die, die durch Jesus entschlafen sind, mit ihm herbeiführen.“ „So“, sagte er; nämlich wie der Herr auferstanden ist.</p><p>Daß aber die Auferstehung des Herrn eine Vereinigung des unsterblich gewordenen Leibes und der Seele war — diese waren ja getrennt —, ist klar. Denn er sagte: „Zerstöret diesen Tempel, und in drei Tagen werde ich ihn [wieder] aufrichten.“ Ein glaubwürdiger Zeuge dafür, daß er von seinem Leibe sprach, ist das heilige Evangelium. „Rühret mich an und sehet“, sprach der Herr zu seinen Jüngern, die einen Geist zu sehen meinten, „daß ich es bin“ und mich nicht verwandelt habe. „Denn ein Geist hat nicht Fleisch und Bein, wie ihr sehet, daß ich habe.“ „Und als er dies gesagt hatte, zeigte er ihnen die Hände “ und die Seite und bot sie Thomas zum Betasten hin. Genügt das nicht, um die Auferstehung der Leiber zu beglaubigen?</p><p>Wiederum sagt der göttliche Apostel: „Denn dieses Vergängliche muß Unvergänglichkeit anziehen, und dieses Sterbliche muß Unsterblichkeit anziehen.“ Und wiederum: „Gesät wird in Vergänglichkeit, erweckt in Unvergänglichkeit. Gesät wird in Schwachheit, erweckt in Kraft; gesät wird in Unehre, erweckt in Herrlichkeit. Gesät wird ein seelischer Leib“, d. h. ein grober und sterblicher, „erweckt ein geistiger Leib “, wie der Leib des Herrn nach der Auferstehung, der durch verschlossene Türe ging, frei von Ermüdung war und nicht der Nahrung, des Schlafes und Trankes bedurfte. Denn der Herr sagt: „Sie werden sein wie die Engel Gottes.“ Da gibt es kein Heiraten und Kindergebären mehr. Daher sagt der göttliche Apostel: „Unser Staat (unsere Heimat) ist im Himmel, von wo wir auch als Heiland den Herrn Jesus erwarten, der unsern Niedrigkeitsleib verwandeln wird, daß er seinem Herrlichkeitsleibe gleichgestaltet werde.“ Er meinte nicht die Umwandlung in eine andere Form — das sei ferne! —, sondern vielmehr den Übergang aus Vergänglichkeit in Unvergänglichkeit.</p><p>„Aber [da] wird einer sagen: Wie werden [denn] die Toten erweckt?“ O des Unglaubens! O des Unverstandes! Er, der durch bloßen Willen Staub in einen Leib verwandelt, der bestimmt, daß ein kleiner Samentropfen im Mutterschoße wachse und dies vielgestaltige und vielgliedrige Werkzeug des Leibes zustande bringe, wird er nicht vielmehr den schon gewesenen und hingeschwundenen [Leib] durch seinen bloßen Willen wiederherstellen [können]? „Wie ist aber der Leib beschaffen, mit dem sie kommen? O Tor!“ Wenn deine Verhärtung dich den Worten Gottes nicht glauben läßt, so glaube doch wenigstens seinen Werken! Denn „was du säst, wird nicht lebendig gemacht, wenn es nicht gestorben ist. Und bezüglich dessen, was du säst, [gilt]: Du säst nicht den in der Zukunft werdenden Leib, sondern ein nacktes Korn, z. B. vom Weizen oder irgendeiner der übrigen [Arten]. Gott aber gibt ihm einen Leib, wie er es gewollt hat, und [zwar] einem jeden der Samen einen besonderen Leib.“ Betrachte also die in Furchen wie in Gräbern vergrabenen Samen! Wer ist es, der ihnen Wurzeln, Rohr, Blätter und Ähren und die feinsten Halme gibt? [Ist es] nicht der Schöpfer aller Dinge? Nicht der Befehl dessen, der alles gefertigt? Glaube daher ebenso, daß auch die Auferstehung der Toten durch göttlichen Willen und Wink stattfinden wird. Denn als Begleiter des Willens hat er (═ der göttliche Wink) die Macht.</p><p>Wir werden also auferstehen: Die Seelen werden sich wieder mit den Leibern vereinigen, die die Unvergänglichkeit angezogen und die Vergänglichkeit ausgezogen haben, und wir werden vor den furchtbaren Richterstuhl Christi gestellt werden. Und es werden der Teufel und seine Dämonen und sein Mensch, d. h. der Antichrist, und die Gottlosen und die Sünder dem ewigen Feuer übergeben werden, nicht einem materiellen, wie es das unsrige ist, sondern einem, dessen Beschaffenheit nur Gott kennt. Die aber das Gute getan, „werden leuchten wie die Sonne “ mit den Engeln im ewigen Leben, mit unserm Herrn Jesus Christus, und sie werden ihn sehen immerdar und gesehen werden und unaufhörliche Freude von ihm ernten und ihn loben mit dem Vater und dem Hl. Geiste ohn’ Ende in alle Ewigkeit. Amen.</p>
