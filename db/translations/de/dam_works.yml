      <p><em>Genaue Darlegung des orthodoxen Glaubens — Buch 3 (Bibliothek der Kirchenväter).</em></p><h2>Buch 3</h2><h3>I. KAPITEL. Von der göttlichen Heilsveranstaltung, von der Sorge um uns und von unserem Heil.</h3><p>Den Menschen nun, der sich durch diesen Angriff des erzbösen Dämon betrügen ließ, der das Gebot des Schöpfers nicht befolgt, der die Gnade verloren und „die Zuversicht zu Gott “ ausgezogen, der mit der Rauheit des mühseligen Lebens bedeckt war ― denn das bedeuten die Feigenblätter ―, der das Sterben, d. h. die Sterblichkeit und Grobheit des Fleisches, angezogen ― denn das bedeutet die Umhüllung mit den Fellen ―, der nach „Gottes gerechtem Gericht “ aus dem Paradies vertrieben, zum Tode verurteilt und der Vergänglichkeit unterworfen war, diesen übersah der Mitfühlende nicht, er, der [ihm] das Sein gegeben und das Wohlsein geschenkt. Nein, zuerst züchtigte er [ihn] durch viele Mittel und rief ihn zur Bekehrung durch Seufzen und Zittern, durch Sintflut und fast völligen Untergang des ganzen Geschlechtes, durch Verwirrung und Teilung der Sprachen, Aufsicht von Engeln, Verbrennung von Städten, vorbildliche Gotteserscheinungen, Kriege, Siege, Niederlagen, Zeichen und Wunder, verschiedene Machterweise, durch Gesetz, Propheten. Der Zweck von [all] dem war die Aufhebung der Sünde, die sich mannigfaltig ausgebreitet, den Menschen unterjocht und Schlechtigkeit aller Art aufs Leben gehäuft, und die Rückkehr des Menschen zum Wohlsein (Glück). Durch die Sünde war ja der Tod in die Welt gekommen, der wie ein wildes, ungezähmtes Tier das menschliche Leben verwüstet. Der Erlöser aber durfte keine Sünde haben und durch die Sünde dem Tode nicht unterworfen sein. Zudem galt es, die Natur zu stärken und zu erneuern und den Weg der Tugend, der vom Verderben weg- und zum ewigen Leben hinführt, durch die Tat zu weisen und zu lehren. Da endlich zeigt er das große Meer der Liebe, die er zu ihm (═ dem Menschen) hat. Denn der Schöpfer und Herr selbst übernimmt für sein Gebilde den Kampf und wird Lehrer durch die Tat. Und da der Feind den Menschen geködert, indem er ihm Hoffnung auf Gottsein gemacht, so wird* er* geködert, indem er (═ der Herr) ihm Fleisch entgegenhält, und es zeigt sich zugleich die Güte und die Weisheit, die Gerechtigkeit und die Macht Gottes. Die Güte. Denn er hat die Schwachheit seines Gebildes nicht übersehen, sondern sich des Gefallenen erbarmt und ihm die Hand gereicht. Die Gerechtigkeit. Denn, als der Mensch besiegt worden, läßt er nicht einen andern den Tyrannen besiegen noch entreißt er mit Gewalt den Menschen dem Tode; nein den, den einst der Tod wegen der Sünden unterjocht, hat der Gute und Gerechte wiederum zum Sieger gemacht und durch den Gleichen den Gleichen gerettet, was unmöglich schien. Die Weisheit. Er hat ja die treffendste Lösung des [scheinbar] Unmöglichen gefunden. Denn „der eingeborene Sohn“, das Wort Gottes und Gott, „der im Schoße Gottes, des Vaters, ist “, der dem Vater und dem Hl. Geiste Wesensgleiche, der Ewige, der Anfangslose, der im Anfang war und bei Gott dem Vater war und Gott war, der „in göttlicher Gestalt existierte “, der neigt nach dem Wohlgefallen Gottes des Vaters die Himmel und steigt herab, d. i. er erniedrigt seine Hoheit, die keine Erniedrigung kennt, ohne sich zu erniedrigen, und steigt in unaussprechlicher und unbegreiflicher Herablassung zu seinen Knechten herab. Denn das bedeutet das Herabsteigen. Und obwohl er vollkommener Gott ist, wird er vollkommener Mensch und vollbringt das Neueste von allem Neuen, das allein Neue unter der Sonne, wodurch sich die unendliche Macht Gottes offenbart. Denn was gibt es Größeres, als daß Gott Mensch wird? „Und das Wort ist“, ohne sich zu verwandeln, „Fleisch geworden “ aus dem Hl. Geiste und der heiligen, immerwährenden Jungfrau und Gottesgebärerin Maria. Und es läßt sich „Mittler zwischen Gott und den Menschen “ nennen, der einzige Menschenfreund, nicht „aus dem Gelüst “ oder dem Trieb oder der Umarmung eines Mannes oder aus wollüstigem Zeugen im unbefleckten Schoße der Jungfrau, sondern aus dem Hl. Geiste und nach Art der ursprünglichen Entstehung Adams empfangen. Und er wird gehorsam dem Vater, durch die Annahme dessen, was uns entsprechend und aus uns ist, heilt es unsern Ungehorsam und wird uns ein Vorbild des Gehorsams, ohne den man das Heil nicht erlangen kann.</p><h3>II. KAPITEL. Von der Empfängnisweise des Wortes und seiner göttlichen Fleischwerdung.</h3><p>Ein Engel des Herrn ward zur heiligen Jungfrau, die aus Davids Stamm entsprossen, gesandt. „Es ist ja wohlbekannt, daß unser Herr aus Judäa hervorgegangen, einem Stamme, von dem niemand Dienst am Altare getan “, wie der göttliche Apostel sagt. Darüber wollen wir später ausführlicher reden. Dieser (═ der Jungfrau) brachte er auch frohe Botschaft und sprach: „Sei gegrüßt, Begnadigte, der Herr ist mit dir.“ Sie aber wurde infolge des Wortes verwirrt, doch der Engel sprach zu ihr: „Fürchte dich nicht, Maria, denn du hast Gnade gefunden beim Herrn, du wirst einen Sohn gebären und seinen Namen Jesus nennen.“ „Denn er wird sein Volk von seinen Sünden erretten.“ Deshalb wird auch das Wort Jesus mit Retter übersetzt. Sie aber war in großer Verlegenheit: „Wie wird mir das geschehen, da ich keinen Mann erkenne?“ Wiederum sprach der Engel zu ihr: „Der Hl. Geist wird auf dich herabkommen, und die Kraft des Allerhöchsten wird dich überschatten. Darum wird auch das Heilige, das aus dir geboren wird, Sohn Gottes genannt werden.“ Sie aber sprach zu ihm: „Siehe, ich bin die Magd des Herrn, mir geschehe nach deinem Worte.“</p><p>Nach der Zustimmung der heiligen Jungfrau kam also der Hl. Geist über sie gemäß dem Worte des Herrn, das der Engel gesprochen, und reinigte sie und gab ihr die zur Aufnahme der Gottheit des Wortes, zugleich aber auch die zum Erzeugen gehörige Kraft. Und damals überschattete sie die persönliche Weisheit und Macht Gottes, des Höchsten, der Sohn Gottes, der dem Vater wesensgleich ist, wie ein göttlicher Same und bildete sich aus ihrem heiligen und reinsten Blute Fleisch, von einer vernünftigen und denkenden Seele belebt, als Erstling unseres Teiges, nicht samenhaft, sondern schöpferisch durch den Hl. Geist. Nicht durch allmähliches Hinzukommen bildete sich die Gestalt, sondern sie ward auf einmal vollendet. Das Wort Gottes selbst wurde ja für das Fleisch die Hypostase. Denn nicht mit einem Fleische, das vorher für sich selbst existierte, vereinigte sich das göttliche Wort, sondern es wohnte dem Schoße der heiligen Jungfrau inne und bildete, ohne in seiner eigenen Hypostase umschrieben zu sein, aus dem heiligen Blute der immerwährenden Jungfrau Fleisch, von einer vernünftigen und denkenden Seele belebt, es nahm die Erstlinge des menschlichen Teiges an, das Wort selbst wurde für das Fleisch die Hypostase. Darum ist es einerseits Fleisch, andrerseits Fleisch des Gott-Logos und zugleich beseeltes Fleisch, vernünftig und denkend. Deshalb reden wir nicht von einem vergotteten Menschen, sondern von einem menschgewordenen Gott. Denn dasselbe [Wort], das kraft der Natur vollkommener Gott ist, ist kraft der Natur vollkommener Mensch. Es hat sich nicht in seiner Natur geändert noch die Heilsveranstaltung nur zum Schein zur Schau gestellt, nein, es hat sich mit dem Fleisch, das aus der heiligen Jungfrau genommen und mit einer vernünftigen und denkenden Seele belebt ward, das in ihm selbst sein Sein erhalten, hypostatisch geeint ohne Vermischung, ohne Verwandlung und ohne Trennung. Denn es hat die Natur seiner Gottheit nicht in die Wesenheit des Fleisches verwandelt noch die Wesenheit seines Fleisches in die Natur seiner Gottheit, noch hat es aus seiner göttlichen Natur und aus der menschlichen Natur, die es angenommen, eine einzige, zusammengesetzte Natur gebildet.</p><h3>III. KAPITEL. Von den zwei Naturen. Gegen die Monophysiten.</h3><p>Ohne Änderung und ohne Wandlung sind die Naturen miteinander vereinigt: Die göttliche Natur hat ihre Einfachheit nicht verloren und die menschliche hat sich wahrlich nicht in die Natur der Gottheit verwandelt oder ihr Sein aufgegeben, noch ist aus den zweien eine einzige, zusammengesetzte Natur entstanden. Denn die zusammengesetzte Natur kann keiner der beiden Naturen, aus denen sie besteht, wesensgleich sein, da sie etwas anderes als die beiden geworden. Ein Beispiel: Ein Körper, der aus den vier Elementen zusammengesetzt ist, gilt nicht als wesensgleich dem Feuer, noch wird er Feuer oder Luft oder Wasser oder Erde genannt, er ist eben keinem davon wesensgleich. Wenn also den Häretikern gemäß Christus eine einzige, zusammengesetzte Natur nach der Vereinigung gehabt, so ist er aus einer einfachen Natur in eine zusammengesetzte verwandelt worden und ist weder dem Vater, der von einfacher Natur ist, wesensgleich noch der Mutter. Denn diese ist nicht aus Gottheit und Menschheit zusammengesetzt. Und er existiert dann wahrlich nicht in Gottheit und Menschheit und wird weder Gott noch Mensch, sondern nur Christus genannt werden. Und es wird das Wort Christus nicht der Name der Hypostase, sondern der nach ihnen (═ den Häretikern)* einen* Natur sein.</p><p>Wir aber lehren, Christus sei nicht von zusammengesetzter Natur, aus verschiedenen [Naturen] etwas Verschiedenes, wie aus Seele und Leib ein Mensch oder wie aus vier Elementen ein Körper, sondern aus verschiedenen dasselbe. Wir bekennen nämlich, daß aus Gottheit und Menschheit der nämliche vollkommener Gott sei und heiße, aus zwei und in zwei Naturen. Das Wort Christus aber, sagen wir, ist der Name der Hypostase, der nicht auf* eine* Art (═ von etwas, das aus* einer* Natur besteht) ausgesagt wird, sondern etwas bezeichnet, das aus zwei Naturen besteht. Denn er selbst hat sich selbst gesalbt. Als Gott salbt er mit seiner Gottheit den Leib, gesalbt aber wird er als Mensch. Denn er ist das eine wie das andere. Salbung der Menschheit aber ist die Gottheit. Denn wäre Christus von einer einzigen, zusammengesetzten Natur und dem Vater wesensgleich, so wäre auch der Vater zusammengesetzt und dem Fleische wesensgleich. Doch das ist ungereimt und aller Lästerung voll.</p><p>Wie wird aber auch* eine* Natur der entgegengesetzten wesenhaften Unterschiede fähig sein? Denn wie ist es möglich, daß dieselbe Natur in derselben Hinsicht geschaffen und ungeschaffen, sterblich und unsterblich, umschrieben und unumschrieben sei?</p><p>Behaupten sie aber, Christus habe nur* eine* Natur, und erklären sie diese für einfach, so werden sie ihn entweder als bloßen Gott bekennen und ein Scheinbild, nicht eine Menschwerdung einführen, oder als bloßen Menschen, wie Nestorius. Und wo ist dann das Vollkommene in der Gottheit und das Vollkommene in der Menschheit? Wann wollen sie aber auch sagen, Christus habe zwei Naturen, wenn sie behaupten, er habe nach der Vereinigung eine einzige, zusammengesetzte Natur? Denn daß Christus vor der Einigung* eine* Natur gehabt, ist doch jedem klar.</p><p>Aber das ist der Grund des Irrtums bei den Häretikern, daß sie die Natur und die Hypostase für dasselbe erklären. Wohl behaupten wir die Einheit der Natur der Menschen. Allein dies behaupten wir, das muß man wissen, weil wir nicht den Begriff der Seele und des Leibes im Auge haben. Denn vergleicht man die Seele und den Leib miteinander, so kann man unmöglich sagen, sie seien* einer* Natur. Nein [dies behaupten wir], weil es eben sehr viele Hypostasen der Menschen gibt, allen (═ Menschen) aber derselbe Begriff der Natur zukommt. Denn alle sind aus Seele und Leib zusammengesetzt und alle sind der Natur der Seele teilhaftig und besitzen die Wesenheit des Leibes und die gemeinsame Wesensform. Die Natur der überaus vielen und verschiedenen Hypostasen, sagen wir, ist eine. Jede Hypostase hat natürlich zwei Naturen und besteht in den zwei Naturen der Seele und des Leibes.</p><p>Bei unserem Herrn Jesus Christus aber darf man keine gemeinsame Wesensform annehmen. Denn weder war noch ist noch wird je ein anderer Christus sein aus Gottheit und Menschheit, in Gottheit und Menschheit, derselbe vollkommener Gott und vollkommener Mensch. Darum darf man von unserem Herrn Jesus Christus nicht* eine* Natur aussagen, von dem aus Gottheit und Menschheit bestehenden Christus nicht so wie von einem aus Seele und Leib bestehenden Individuum [sprechen]. Denn dort ist ein Individuum, Christus aber ist kein Individuum. Er hat ja nicht die Form der Christusheit als [allgemeines] Prädikat. Darum sagen wir eben, aus zwei vollkommenen Naturen, der göttlichen und menschlichen, sei die Einigung erfolgt, nicht nach Art einer Vermengung oder Zerfließung oder Vermischung oder Verschmelzung, wie der von Gott geschlagene Dioskur behauptete und Eutyches und Severus und ihr fluchbeladener Anhang, auch nicht dem Äußeren oder der Beziehung nach oder der Würde oder dem gleichen Willen oder der gleichen Ehre oder dem gleichen Namen oder der [gleichen] Gesinnung nach, wie der gottverhaßte Nestorius sagte und Diodor und Theodor von Mopsueste und deren dämonische Schar, sondern durch Verbindung oder hypostatisch, ohne Veränderung, ohne Vermischung, ohne Verwandlung, ohne Zerreißung und ohne Trennung. Wir bekennen in zwei vollkommenen Naturen* eine* Hypostase des Gottessohnes und des Fleischgewordenen, wir erklären die Hypostase seiner Gottheit und Menschheit für eine und dieselbe, wir bekennen, daß die zwei Naturen in ihm nach der Einigung gewahrt blieben, wir setzen aber nicht eine jede für sich, und besonders, sondern lassen sie miteinander verbunden sein in der einen zusammengesetzten Hypostase. Denn für wesenhaft erklären wir die Einigung, d. i. für wirklich und nicht scheinbar. Für wesenhaft, nicht als ob die zwei Naturen eine einzige, zusammengesetzte Natur ausmachten, sondern sofern sie wirklich in einer einzigen, zusammengesetzten Hypostase des Sohnes Gottes miteinander verbunden sind, und wir halten fest, daß ihr wesenhafter Unterschied gewahrt ist. Denn das Geschaffene ist geschaffen, das Ungeschaffene ungeschaffen geblieben. Das Sterbliche blieb sterblich, und das Unsterbliche unsterblich, das Umschriebene umschrieben, das Unumschriebene unumschrieben, das Sichtbare sichtbar, und das Unsichtbare unsichtbar. „Das eine glänzt durch die Wundertaten, das andere unterliegt den Schmähungen.“</p><p>Es eignet sich aber das Wort (der Logos) das Menschliche an — denn sein ist, was seines heiligen Fleisches ist ― und teilt von seinen Eigenheiten dem Fleische mit in der Weise einer wechselseitigen Mitteilung wegen des gegenseitigen Ineinanderseins der Teile und der hypostatischen Einigung, und weil einer und derselbe war, der sowohl das Göttliche als das Menschliche in jeder von beiden Formen in Gemeinschaft mit dem andern wirkte. Darum heißt es ja auch, der Herr der Herrlichkeit sei gekreuzigt worden, obgleich seine göttliche Natur nicht gelitten, und es ist erklärt, daß der Menschensohn vor dem Leiden im Himmel war, wie der Herr selbst gesagt. Denn einer und derselbe war der Herr der Herrlichkeit und der, der nach der Naturordnung und wirklich Menschensohn oder Mensch geworden ist, und als sein erkennen wir die Wunder wie die Leiden, wenn auch der nämliche in anderer Hinsicht Wunder wirkte und in anderer Hinsicht die Leiden erduldete. Wir wissen nämlich, daß, wie seine* eine* Hypostase, so der wesenhafte Unterschied der Naturen gewahrt ist. Denn wie würde der Unterschied gewahrt, wenn nicht das gewahrt bliebe, was sich gegenseitig unterscheidet? Unterschied besteht doch zwischen dem, was verschieden ist. Mit Rücksicht auf die Art und Weise also, wodurch sich die Naturen Christi voneinander unterscheiden, d. i. mit Rücksicht auf die Wesenheit, sagen wir, sei er mit dem Gegensätzlichen verbunden: der Gottheit nach mit dem Vater und dem Geiste, der Menschheit nach aber mit seiner Mutter und allen Menschen. In Rücksicht auf die Art und Weise, wodurch seine Naturen verbunden sind, sagen wir, er unterscheide sich sowohl vom Vater und vom Geiste als auch von seiner Mutter und den übrigen Menschen. Seine Naturen sind nämlich durch die Hypostase verbunden, sie haben eine einzige, zusammengesetzte Hypostase. Nach dieser unterscheidet er sich sowohl vom Vater und vom Geiste als von der Mutter und uns.</p><h3>IV. KAPITEL. Über die Art der Wechselmitteilung.</h3><p>Daß etwas anderes die Wesenheit (Natur), etwas anderes die Hypostase ist, haben wir schon vielmals gesagt, ebenso, daß die Wesenheit die gemeinsame, die gleichartigen Hypostasen umfassende Form bedeutet, wie: Gott, Mensch, die Hypostase aber das Individuum bezeichnet, wie: Vater, Sohn, Hl. Geist, Petrus, Paulus. Der Name Gottheit und Menschheit zeigt also, das muß man wissen, die Wesenheit oder die Natur an. Der [Name] Gott und Mensch aber wird auch von der Natur gebraucht. So, wenn wir sagen: Gott ist eine unfaßbare Wesenheit, und: Gott ist einer. Er wird aber auch von den Hypostasen (Personen) genommen, da das Partikularere den Namen des Allgemeineren annimmt. So, wenn die Schrift sagt: „Darum hat dich, o Gott, dein Gott gesalbt Denn siehe, sie bezeichnet [mit Gott] den Vater und den Sohn. Und so, wenn sie sagt: „Es war ein Mensch im Lande Ausitis (Hus).“ Denn sie bezeichnet [mit Mensch] nur den Job.</p><p>Bei unserm Herrn Jesus Christus nun erkennen wir zwei Naturen und eine einzige, aus beiden zusammengesetzte Hypostase an. Wenn wir die Naturen betrachten, so nennen wir [sie] Gottheit und Menschheit. Wenn [wir] jedoch die aus den Naturen zusammengesetzte Hypostase [betrachten], so nennen wir Christus bald nach beiden zusammen Gott und Mensch zugleich und fleischgewordenen Gott, bald aber nach einem der Teile bloß Gott und Gottessohn und bloß Mensch und Menschensohn, bald nur nach dem Erhabenen und bald nur nach dem Niedrigen. Denn einer ist, der in gleicher Weise das eine wie das andere ist: das eine ist er ohne Ursache (═ ohne daß die Ursache in ihm liegt) immer aus dem Vater, das andere aber ist er ob seiner Menschenliebe später geworden.</p><p>Wenn wir also von der Gottheit reden, so sagen wir von ihr nicht die Eigentümlichkeiten der Menschheit aus. Denn wir bezeichnen nicht die Gottheit als leidensfähig oder geschaffen. Andrerseits sagen wir von dem Fleische oder der Menschheit nicht die Eigentümlichkeiten der Gottheit aus. Denn wir nennen nicht das Fleisch oder die Menschheit ungeschaffen. [Reden] wir aber von der Hypostase (Person), sei es, daß wir diese nach beiden Teilen oder nach einem benennen, so legen wir ihr die Eigentümlichkeiten der beiden Naturen bei. Denn Christus — das ist die Benennung nach beiden — wird sowohl Gott als Mensch, geschaffen und ungeschaffen, leidensfähig und leidenslos genannt. Und wird er nach einem der Teile Gottessohn und Gott genannt, so nimmt er die Eigentümlichkeiten der mitbestehenden Natur oder des Fleisches an: Er wird leidender Gott und gekreuzigter Herr der Herrlichkeit genannt, nicht sofern er Gott, sondern sofern der nämliche auch Mensch ist. Und wird er Mensch und Menschensohn genannt, so nimmt er die Eigentümlichkeiten und Auszeichnungen der göttlichen Natur an: vorzeitliches Kind, anfangsloser Mensch, nicht sofern er Kind und Mensch ist, sondern sofern er, der vorzeitlicher Gott ist, zuletzt ein Kind wurde. Ja, das ist die Art der Wechselmitteilung: Jede Natur teilt der andern infolge der hypostatischen Identität und ihres gegenseitigen Ineinanderseins ihre Eigenheiten mit. Demgemäß können wir von Christus sagen: „Dieser ist unser Gott, er ward auf der Erde gesehen und hat mit den Menschen verkehrt “, und: Dieser Mensch ist ungeschaffen und leidenslos und unumschrieben.</p><h3>V. KAPITEL. Von der Zahl der Naturen.</h3><p>Wir bekennen bei der Gottheit* eine* Natur, wir unterscheiden aber drei wirkliche Hypostasen und nennen alles, was zur Natur und Wesenheit gehört, einfach, den Unterschied der Hypostasen aber erkennen wir nur in den drei Eigentümlichkeiten des Nichtprinzipiiert- und Vaterseins, des Prinzipiiert- und Sohnseins, des Prinzipiiert- und Ausgegangenseins. Wir wissen, daß sie voneinander nicht zu trennen und zu scheiden, sondern vereint und ohne Vermischung ineinander sind — denn es sind drei, wenn sie auch vereint sind —, und daß sie unterschieden sind, ohne geschieden zu sein. Denn wenn auch eine jede für sich subsistiert oder eine vollkommene Hypostase ist und ihre besondere Eigentümlichkeit und ihre verschiedene Subsistenzweise besitzt, so sind sie doch durch die Wesenheit und die natürlichen Eigentümlichkeiten und dadurch, daß sie sich von der Hypostase des Vaters nicht scheiden und trennen, geeint und sind und heißen* ein* Gott. In gleicher Weise bekennen wir auch bei der göttlichen, unaussprechlichen, alles Fassen und Begreifen übersteigenden Heilsveranstaltung des einen der heiligen Dreiheit, des Gott-Logos und unseres Herrn Jesus Christus, zwar zwei Naturen, eine göttliche und eine menschliche, die miteinander verbunden und hypostatisch geeint sind, aber nur eine einzige, aus den Naturen bestehende, zusammengesetzte Hypostase. Ferner sagen wir, daß die zwei Naturen auch nach der Einigung in der einen zusammengesetzten Hypostase oder in dem einen Christus gewahrt sind, daß sie und ihre natürlichen Eigentümlichkeiten wirklich existieren, daß sie geeint sind, jedoch ohne Vermischung und verschieden sind ohne Trennung und gezählt werden. Und wie die drei Hypostasen der heiligen Dreiheit ohne Vermischung geeint und ohne Trennung unterschieden sind, und die Zahl keine Trennung oder Scheidung oder Entfremdung oder Absonderung in ihnen wirkt — denn als* einen* Gott erkennen wir den Vater, den Sohn und den Hl. Geist —, so sind auch die Naturen Christi zwar vereint, aber ohne Vermischung vereint, und sie sind wohl ineinander, aber sie lassen keine Verwandlung und keinen Übergang ineinander zu. Denn jede bewahrt unverändert ihre natürliche Eigentümlichkeit. Darum werden sie auch gezählt, aber die Zahl führt keine Trennung ein. Denn Christus ist* einer,* vollkommen in Gottheit und Menschheit. Die Zahl bildet nämlich keinen Trennungs- oder Einigungsgrund, sondern sie bezeichnet nur die Quantität der Gezählten, ob sie nun vereint oder getrennt sind: vereint, wie: Diese Wand hat fünfzig Steine; getrennt: Fünfzig Steine liegen auf diesem Feld; geeint: Zwei Naturen sind in der Kohle, nämlich die des Feuers und des Holzes; getrennt aber: Die Natur des Feuers ist eine andere und die des Holzes ist eine andere. Ein anderer Grund eint und trennt sie, und nicht die Zahl. Wie man also die drei Hypostasen der Gottheit, auch wenn sie miteinander geeint sind, nicht* eine* Hypostase nennen kann, da man sonst den Unterschied der Hypostasen zerstören und aufheben würde, so kann man auch die zwei hypostatisch geeinten Naturen Christi nicht* eine* Natur nennen, da wir sonst ihren Unterschied aufheben, zerstören und vernichten würden.</p><h3>VI. KAPITEL. Die ganze göttliche Natur ist in einer ihrer Hypostasen mit der ganzen menschlichen Natur geeint, und nicht Teil mit Teil.</h3><p>Das Gemeinsame und Allgemeine wird von dem unter ihm begriffenen Partikularen ausgesagt. Gemeinsam nun ist die Wesenheit als Form, partikular aber die Hypostase (Person). Partikular, nicht als ob sie einen Teil von der Natur hätte, sie hat keinen Teil, sondern partikular der Zahl nach als Individuum. Denn der Zahl und nicht der Natur nach unterscheiden sich, wie man sagt, die Hypostasen. Es wird aber die Wesenheit von der Hypostase ausgesagt, weil in jeder der gleichartigen Hypostasen die vollkommene Wesenheit ist. Darum unterscheiden sich auch die Hypostasen nicht der Wesenheit nach voneinander, sondern nach dem, was hinzukommt, d. i. nach den charakteristischen Eigentümlichkeiten: charakteristisch aber für die Hypostase (Person), nicht für die Natur. Man definiert ja auch die Hypostase als Wesenheit samt den hinzukommenden Merkmalen (Akzidenzien). Daher besitzt die Hypostase das Gemeinsame nebst dem Eigentümlichen und das Fürsichbestehen. Die Wesenheit aber besteht nicht für sich selbst, sondern wird in den Hypostasen betrachtet. Darum sagt man: Leidet eine der Hypostasen, so leidet die ganze leidensfähige Wesenheit, nach der die Hypostase leidet, in einer ihrer Hypostasen. Es ist jedoch nicht notwendig, daß auch alle gleichartigen Hypostasen zugleich mit der leidenden Hypostase leiden.</p><p>So bekennen wir denn, daß die Natur der Gottheit ganz auf vollkommene Weise in jeder ihrer Hypostasen ist, ganz im Vater, ganz im Sohne, ganz im Hl. Geiste. Darum ist auch der Vater vollkommener Gott, der Sohn vollkommener Gott, der Hl. Geist vollkommener Gott. So hat sich auch, sagen wir, bei der Menschwerdung des einen der heiligen Dreiheit, des Gott-Logos, die ganze und vollkommene Natur der Gottheit in einer ihrer Hypostasen mit der ganzen menschlichen Natur geeint, und nicht Teil mit Teil. Es sagt ja der göttliche Apostel: „In ihm wohnt die ganze Fülle der Gottheit leibhaftig “, d. i. in seinem Fleische. Und dessen Schüler, der Gottesträger und Gottesgelehrte Dionysius, [sagt], „sie habe sich uns ganz und gar in einer ihrer Hypostasen mitgeteilt“. Wir werden darum nicht zu sagen brauchen, alle, d. h. die drei Hypostasen der heiligen Gottheit, seien mit allen Hypostasen der Menschheit hypostatisch geeint; denn nach keiner Hinsicht hat der Vater und der Hl. Geist an der Fleischwerdung des Gott-Logos teil, außer dem Wohlgefallen und Willen nach. Wir sagen jedoch, mit der ganzen menschlichen Natur sei die ganze Wesenheit der Gottheit geeint. Denn nichts von dem, was der Gott-Logos unserer Natur anerschaffen, da er uns am Anfang gebildet, hat er weggelassen, sondern alles hat er angenommen, einen Leib, eine vernünftige und denkende Seele und deren Eigentümlichkeiten. Denn das Lebewesen, das eines hievon nicht hat, ist kein Mensch. Ja, ganz hat er mich ganz angenommen und ganz hat er sich mit dem Ganzen geeint, um dem Ganzen das Heil zu spenden. Denn was nicht angenommen ist, kann nicht geheilt werden.</p><p>Geeint also ist das Wort Gottes mit dem Fleische mittels des Geistes* (νοῦς)* [nous], der zwischen der Reinheit Gottes und der Grobheit (Materialität) des Fleisches vermittelt. Denn der Geist herrscht über Seele und Fleisch — der Geist ist ja das Reinste der Seele —, Gott aber über den Geist. Und sobald die Zulassung vom Höheren kommt, zeigt der Geist Christi seine Herrschaft. Er steht jedoch unter dem Höheren und folgt ihm und wirkt das, was der göttliche Wille fordert.</p><p>Der Geist ist Wohnstätte der mit ihm hypostatisch geeinten Gottheit, ebenso natürlich auch das Fleisch, nicht Mitbewohner, wie die gottlose Meinung der Häretiker irrig behauptet, da sie sagt: Ein Scheffel wird doch nicht zwei Scheffel fassen. Sie beurteilt eben das Immaterielle nach Art der Körper. Wie soll man aber Christus vollkommenen Gott und vollkommenen Menschen und wesensgleich mit dem Vater und mit uns nennen, wenn in ihm ein Teil der göttlichen Natur mit einem Teile der menschlichen Natur geeint ist?</p><p>Wir sagen, unsere Natur ist von den Toten auferstanden und aufgefahren und sitzt zur Rechten des Vaters, nicht sofern alle Hypostasen der Menschen auferstanden sind und zur Rechten des Vaters sitzen, sondern sofern dies unserer ganzen Natur in der Person (Hypostase) Christi zuteil geworden. Darum sagt der göttliche Apostel: „Er (Gott) hat uns in Christus mitauferweckt und mitversetzt [in die Himmelswelt].“</p><p>Auch das sagen wir, daß sich aus gemeinsamen Wesenheiten die Einigung vollzog. Jede Wesenheit ist nämlich den unter ihr begriffenen Hypostasen gemeinsam, und man kann keine partikulare und eigentümliche (individuelle) Natur oder Wesenheit finden. Denn sonst müßte man dieselben Hypostasen für wesensgleich und wesensverschieden erklären und die heilige Dreiheit der Gottheit nach sowohl wesensgleich als wesensverschieden nennen. Dieselbe Natur also wird in jeder der Hypostasen betrachtet. Und wenn wir nach dem hl. Athanasius und Cyrillus sagen, die* Natur* des Wortes sei Fleisch geworden, so meinen wir, die Gottheit habe sich mit dem Fleische geeint. Darum können wir auch nicht sagen: Die Natur des Wortes hat gelitten, denn es hat nicht die Gottheit in ihm gelitten. Wir sagen aber, die menschliche Natur habe in Christus gelitten, ohne jedoch alle Hypostasen (Personen) der Menschen zu meinen. Wir bekennen aber auch, Christus habe in der menschlichen Natur gelitten. Darum bezeichnen wir, wenn wir „Natur des Wortes“ sagen, [damit] das Wort selbst. Das Wort aber besitzt sowohl das Gemeinsame der Wesenheit als das Eigentümliche der Person (Hypostase).</p><h3>VII. KAPITEL. Von der einen zusammengesetzten Hypostase des Gott-Logos.</h3><p>Wir sagen also, die göttliche Hypostase des Gott-Logos präexistiere zeitlos und ewig als einfach und nicht zusammengesetzt, ungeschaffen und unkörperlich, unsichtbar, ungreifbar, unumschrieben, alles besitzend, was der Vater hat, da ihm wesensgleich, durch die Art der Zeugung und die Beziehung (Relation) von der Hypostase des Vaters verschieden, vollkommen, niemals von der Hypostase des Vaters getrennt; in den letzten Zeiten aber habe das Wort, ohne sich vom väterlichen Schoße zu trennen, im Schoße der heiligen Jungfrau gewohnt, ohne umschrieben zu werden, ohne Samen, auf unbegreifliche Weise, wie er selbst weiß, und habe in seiner ewigen Hypostase aus der heiligen Jungfrau Fleisch angenommen.</p><p>In allem und über allem also war es, selbst als es im Schoße der heiligen Gottesgebärerin existierte. In ihr aber [war es] durch die Wirksamkeit der Fleischwerdung. Es ist also Fleisch geworden, es hat die Erstlinge unseres Teiges angenommen, Fleisch, von einer vernünftigen und denkenden Seele belebt. Darum bildete die Hypostase des Gott-Logos selbst die Hypostase für das Fleisch, und aus der zuvor einfachen Hypostase des Logos (Wortes) entstand eine zusammengesetzte, zusammengesetzt aus zwei vollkommenen Naturen, Gottheit und Menschheit. Darum trägt sie sowohl die charakteristische und abgrenzende Eigentümlichkeit der göttlichen Sohnschaft des Gott-Logos an sich, wonach sie vom Vater und vom Geiste unterschieden ist, als auch die charakteristischen und abgrenzenden Eigentümlichkeiten des Fleisches, wonach sie von der Mutter und den übrigen Menschen verschieden ist. Sie trägt aber auch die Eigentümlichkeiten der göttlichen Natur an sich, wonach sie mit dem Vater und dem Geiste geeint ist, und die Kennzeichen der menschlichen Natur, wonach sie mit der Mutter und uns vereint ist. Außerdem unterscheidet sie sich sowohl vom Vater und vom Geiste als auch von der Mutter und uns dadurch, daß der nämliche zugleich Gott und Mensch ist. Denn das erkennen wir als die eigentümlichste Eigenheit der Hypostase Christi.</p><p>Daher bekennen wir ihn denn als den einzigen Gottessohn auch nach der Menschwerdung und den nämlichen als Menschensohn,* einen* Christus,* einen* Herrn, den alleinigen eingeborenen Sohn und Logos Gottes, Jesum, unsern Herrn. Wir verehren bei ihm eine doppelte Geburt: eine aus dem Vater vor aller Zeit, über Ursache und Begriff, Zeit und Natur erhaben, und eine in den letzten Zeiten wegen uns, gemäß uns und über uns. Wegen uns, weil um unseres Heiles willen; gemäß uns, weil er aus dem Weibe und in der Zeit der Schwangerschaft Mensch geworden ist; über uns, weil er nicht aus Samen, sondern aus dem Hl. Geiste und der heiligen Jungfrau Maria über dem Gesetz der Schwangerschaft [Mensch geworden ist]. Wir verkünden ihn nicht als bloßen Gott, der nicht dieselbe Menschheit wie wir besäße, noch auch als bloßen Menschen, indem wir ihn der Gottheit entkleiden; nicht als den einen und den andern, sondern als einen und denselben, als Gott und Mensch zugleich, vollkommenen Gott und vollkommenen Menschen, ganzen Gott und ganzen Menschen, denselben als ganzen Gott auch mit seinem Fleisch und als ganzen Menschen auch mit seiner übergöttlichen Gottheit. Mit dem Ausdruck „vollkommener Gott und vollkommener Mensch“ bezeichnen wir die Vollständigkeit und Unversehrtheit der Naturen. Mit dem Ausdruck „ganzer Gott und ganzer Mensch“ weisen wir auf die Einzigkeit und Ungeteiltheit der Hypostase hin.</p><p>Wir bekennen aber auch „eine einzige fleischgewordene Natur des Gott-Logos“. Wir bezeichnen nach dem seligen Cyrillus mit dem Ausdruck „fleischgeworden“ die Wesenheit des Fleisches. Es ist also das Wort Fleisch geworden und hat seine Immaterialität nicht verloren und es ist ganz Fleisch geworden und ist ganz unumgrenzt. Dem Körper nach wird es klein und zieht sich zusammen, der Gottheit nach aber ist es unumgrenzt, da sein Fleisch sich nicht zugleich mit seiner unumgrenzten Gottheit ausdehnt.</p><p>Ganz also ist es (═ das Wort) vollkommener Gott, aber nicht das Ganze ist Gott. Denn es ist nicht bloß Gott, sondern auch Mensch. Und ganz ist es vollkommener Mensch, aber nicht das Ganze ist Mensch. Es ist ja nicht bloß Mensch, sondern auch Gott. Denn „das Ganze“ bezeichnet die Natur, „der Ganze“ aber die Hypostase, wie „das andere“ die Natur, „der andere“ aber die Hypostase.</p><p>Das jedoch muß klar sein. Wir sagen zwar, die Naturen des Herrn durchdringen sich gegenseitig, gleichwohl aber wissen wir, daß die Durchdringung von Seiten der göttlichen Natur geschehen ist. Denn diese geht, wie sie will, durch alles hindurch und durchdringt es, durch sie aber [geht] nichts. Und diese teilt ihre Vorzüge dem Fleische mit, selbst aber bleibt sie unaffiziert und hat an den Affektionen des Fleisches nicht teil. Die Sonne teilt uns ihre Kräfte mit, allein die unsrigen genießt sie nicht. Um wieviel mehr gilt das vom Schöpfer und Herrn der Sonne!</p><h3>VIII. KAPITEL. Gegen die, die sagen: Die Naturen des Herrn fallen unter die kontinuierliche oder unter die diskrete Quantität.</h3><p>Fragt jemand betreffs der Naturen des Herrn, ob sie unter die kontinuierliche oder unter die diskrete Quantität fallen, so werden wir sagen: Die Naturen des Herrn sind weder ein Körper noch eine Fläche noch eine Linie, nicht Zeit, nicht Ort, um unter die kontinuierliche Quantität zu fallen. Denn diese Dinge sind es, die kontinuierlich gezählt werden.</p><p>Man muß aber wissen: Nur, was verschieden ist, wird gezählt. Was in keiner Hinsicht verschieden ist, kann man nicht zählen. Sofern die Dinge sich unterscheiden, sofern werden sie auch gezählt. So werden z. B. Petrus und Paulus, sofern sie eins sind, nicht gezählt. Eins sind sie in Anbetracht der Wesenheit, darum können sie nicht zwei Naturen genannt werden. Verschieden aber sind sie der Hypostase nach, darum heißen sie zwei Hypostasen. Gezählt wird also, was verschieden ist, und sofern das, was verschieden ist, sich unterscheidet, sofern wird es auch gezählt.</p><p>Geeint also ohne Mischung sind die Naturen des Herrn der Hypostase nach, verschieden aber ohne Trennung sind sie in Ansehung und Anbetracht des Unterschiedes, und sofern sie geeint sind, werden sie nicht gezählt. Denn wir sagen nicht, die Naturen Christi seien der Hypostase nach zwei. Sofern sie aber ohne Trennung verschieden sind, werden sie gezählt. Zwei nämlich sind die Naturen Christi in Ansehung und Anbetracht des Unterschiedes. Denn da sie hypostatisch geeint sind und sich gegenseitig durchdringen, so sind sie ohne Vermischung geeint, eine jede behält ihren natürlichen Unterschied. Daher werden sie auch nur in Ansehung des Unterschiedes gezählt und fallen unter die diskrete Quantität.</p><p>Einer also ist Christus, vollkommener Gott und vollkommener Mensch. Wir erweisen ihm mit dem Vater und dem Geiste* eine* Anbetung und schließen dabei sein unbeflecktes Fleisch nicht aus. Denn wir sagen nicht, sein Fleisch sei nicht anzubeten. Es wird nämlich in der* einen* Hypostase des Wortes, die für dasselbe (═ das Fleisch) Hypostase geworden, angebetet. Dadurch dienen wir nicht dem Geschöpf. Denn nicht als bloßes Fleisch beten wir es an, sondern als geeint mit der Gottheit, und weil* eine* Person und* eine* Hypostase des Gott-Logos Träger seiner zwei Naturen ist. Ich scheue mich, die Kohle anzufassen wegen des Feuers, das mit dem Holz verbunden ist. Ich bete in Christus beides zusammen an wegen der Gottheit, die mit dem Fleische geeint ist. Denn ich führe keine vierte Person in der Trinität ein, das sei ferne, nein, ich bekenne* eine* Person des Gott-Logos und seines Fleisches. Denn eine Dreiheit blieb die Dreiheit auch nach der Fleischwerdung des Wortes.</p><p>Zusatz.</p><p>Gegen die, die fragen, ob die zwei Naturen zur kontinuierlichen oder diskreten Quantität (Größe) gehören.</p><p>Die Naturen des Herrn sind weder ein Körper noch eine Fläche noch eine Linie, nicht Ort, nicht Zeit, um unter die kontinuierliche Quantität (Größe) zu fallen. Denn diese Dinge sind es, die man kontinuierlich zählt. Geeint ohne Vermischung sind die Naturen des Herrn der Hypostase nach, verschieden aber ohne Trennung sind sie in Ansehung und Anbetracht des Unterschiedes. Und sofern sie geeint sind, werden sie nicht gezählt. Denn wir sagen nicht, die Naturen Christi seien zwei Hypostasen oder zwei der Hypostase nach. Sofern sie aber ohne Trennung verschieden sind, werden sie gezählt. Denn zwei Naturen sind es in Ansehung und Anbetracht des Unterschiedes. Da sie nämlich hypostatisch geeint sind und einander gegenseitig durchdringen, sind sie ohne Vermischung geeint, sie gehen nicht ineinander über, sondern bewahren auch nach der Einigung die natürliche Verschiedenheit, die einer jeden eigen ist. Denn das Geschaffene blieb geschaffen, das Ungeschaffene ungeschaffen. Nur in Ansehung des Unterschiedes also werden sie gezählt und fallen unter die diskrete Größe. Denn es ist unmöglich, das zu zählen, was in keiner Hinsicht verschieden ist. Sofern sie aber verschieden sind, sofern werden sie gezählt. So z. B. werden Petrus und Paulus, sofern sie eins sind, nicht gezählt. Eins sind sie in Anbetracht der Wesenheit, weder sind noch heißen sie darum zwei Naturen. Verschieden aber sind sie der Hypostase nach, darum heißen sie zwei Hypostasen. So ist also der Unterschied Grund der Zählung.</p><h3>IX. KAPITEL. Antwort auf die Frage, ob es eine subsistenzlose Natur gebe.</h3><p>Wenn es auch keine unhypostatische Natur oder unpersönliche Wesenheit gibt — denn die Wesenheit und die Natur wird in Hypostasen und Personen betrachtet —, so ist es doch nicht notwendig, daß von den miteinander hypostatisch geeinten Naturen eine jede eine eigene Hypostase besitze. Es kann ja sein, daß sie in* eine* Hypostase zusammenlaufen und dann weder unhypostatisch sind noch für jede eine eigene Hypostase haben, sondern beide ein und dieselbe. Dieselbe Hypostase des Wortes bildet nämlich die Hypostase der beiden Naturen, sie läßt weder eine von ihnen unhypostatisch sein noch gestattet sie fürwahr, daß sie hypostatisch voneinander verschieden sind, noch ist sie [die Hypostase] bald von dieser, bald von jener [Natur], sondern sie ist immer ohne Trennung und ohne Scheidung Hypostase beider. Sie teilt und scheidet sich ja nicht und weist nicht einen Teil von ihr dieser [Natur], einen Teil jener zu, sondern sie ist ungeteilt und vollständig [Hypostase] ganz von dieser und ganz von jener. Denn nicht in eigener Hypostase subsistiert das Fleisch des Gott-Logos, noch existiert außer der Hypostase des Gott-Logos eine andere Hypostase, sondern es subsistiert in ihr, ist vielmehr hypostasiert, es hat kein selbständiges Fürsichsein. Daher ist es weder subsistenzlos (unhypostatisch) noch führt es eine andere Hypostase in die Dreiheit ein.</p><h3>X. KAPITEL. Über das Trishagion (Dreimalheilig).</h3><p>Daher erklären wir auch den Zusatz im Trishagion, der von dem törichten Petrus dem Walker stammt, für gotteslästerlich. Denn er (═ der Zusatz) führt eine vierte Person ein, er stellt den Sohn Gottes, die persönliche Kraft des Vaters, eigens und den Gekreuzigten eigens, als wäre er ein anderer als „der Starke“, oder aber er läßt die heilige Dreifaltigkeit leiden und kreuzigt mit dem Sohne den Vater und den Hl. Geist. Fort mit diesem lästerlichen und falschen Geschwätz! Wir verstehen das „heiliger Gott“ vom Vater, legen aber nicht bloß ihm den Namen der Gottheit bei, sondern wissen wohl, daß auch der Sohn und der Hl. Geist Gott ist. Und das „heiliger Starker“ beziehen wir auf den Sohn, ohne jedoch den Vater und den Hl. Geist der Stärke zu entkleiden. Und das „heiliger Unsterblicher“ bestimmen wir für den Hl. Geist. Wir schließen damit den Vater und den Sohn nicht von der Unsterblichkeit aus, sondern wir wenden alle Gottesbezeichnungen schlechthin und uneingeschränkt auf jede der Hypostasen an, wir ahmen den göttlichen Apostel nach, der sagt: „Wir aber haben* einen* Gott, den Vater, aus dem alles ist, und wir aus ihm, und* einen* Herrn Jesus Christus, durch den alles ist, und wir durch ihn “, und einen Hl. Geist, in dem alles ist, und wir in ihm, und fürwahr nicht bloß ihn, sondern auch Gregor den Theologen, der irgendwo also sagt: „Wir aber haben* einen* Gott, den Vater, aus dem alles, und* einen* Herrn Jesus Christus, durch den alles, und* einen* Hl. Geist, in dem alles ist.“ Die Ausdrücke: „aus dem, durch den und in dem“ scheiden keine Naturen — man könnte ja auch die Vorwörter oder die Reihenfolge der Namen nicht umkehren —, sondern sie bezeichnen Eigentümlichkeiten einer einzigen und unvermischten Natur. Und das erhellt daraus, daß sie wieder in Eins verbunden werden, es müßte denn sein, daß man unachtsam bei demselben Apostel jenes Wort läse: „Aus ihm und durch ihn und in ihm ist alles, ihm sei Ehre in alle Ewigkeit. Amen.“</p><p>Denn daß das Trishagion nicht allein vom Sohne, sondern von der heiligen Dreiheit gesagt ist, bezeugen der göttliche und hl. Athanasius, Basilius, Gregorius und der ganze Chor der Väter, der Gottesträger. [Sie bezeugen] nämlich, daß durch das Dreimalheilig die heiligen Seraphim uns die drei Hypostasen der überwesentlichen Gottheit anzeigen. Dadurch aber, daß sie nur* einen* Herrn nennen, bezeichnen sie die eine Wesenheit und Herrschaft der göttlichen Dreiheit. Es sagt daher Gregor der Theologe: „So kommen also die Heiligen der Heiligen, die auch von den Seraphim verborgen und in drei Heilig gepriesen werden, in* einem* Herrsein und Gottsein zusammen. Dies ist auch von einem andern vor uns in überaus treffender und erhabener Weise wissenschaftlich erörtert worden.“</p><p>Es berichten auch die Kirchengeschichtsschreiber: Als das Volk in Konstantinopel wegen einer von Gott verhängten Bedrohung unter dem Erzbischof Proklus betete, da traf sich folgendes: Ein Knabe aus dem Volke geriet in Verzückung und lernte durch englische Belehrung das Dreimalheilig-Lied so: „Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme dich unser.“ Und als der Knabe wieder zu sich kam und das Gelernte verkündete, sang die ganze Menge das Lied, und so hörte die Bedrohung auf. Auch auf der vierten heiligen, großen, allgemeinen Synode zu Chalzedon soll dieses Dreimalheilig-Lied so gesungen worden sein. So wird nämlich in den Akten derselben heiligen Synode berichtet. Lächerlich also und läppisch fürwahr ist es, daß das Dreimalheilig-Lied, das von Engeln gelehrt, durch das Aufhören des Schrecknisses beglaubigt, durch die Versammlung so vieler heiliger Väter bestätigt und bekräftigt und ehedem von den Seraphim zur Bezeichnung der dreipersönlichen Gottheit gesungen worden, durch die unvernünftige Meinung des Walkers gleichsam mit Füßen getreten und wohl gar verbessert worden ist, als übertreffe er die Seraphim. O der Keckheit, um nicht zu sagen, der Torheit! Wir aber sagen, auch wenn Dämonen bersten, so: „Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme dich unser!“</p><h3>XI. KAPITEL. Von der in der Art und im Individuum betrachteten Natur und vom Unterschied von Einigung und Menschwerdung. Ferner, wie ist jenes Wort zu verstehen: „Die eine, fleischgewordene Natur des Gott-Logos“ ?</h3><p>Die Natur wird entweder rein gedanklich (abstrakt) betrachtet — denn sie hat kein Fürsichbestehen — oder gemeinsam in allen gleichartigen Hypostasen, diese umfassend, und heißt dann eine in der Art betrachtete Natur, oder im Ganzen unter Hinzunahme der Akzidenzien, wie sie in* einer* Hypostase existiert, und heißt dann eine im Individuum betrachtete Natur. Sie ist dieselbe wie die in der Art betrachtete. Der fleischgewordene Gott-Logos nun hat weder die rein gedanklich betrachtete Natur angenommen — denn das wäre nicht Fleischwerdung, sondern Trug und Schein einer Fleischwerdung —, noch die in der Art betrachtete — denn nicht alle Hypostasen hat er angenommen —, sondern die im Individuum [betrachtete], die dieselbe ist wie die in der Art [betrachtete] — denn er hat die Erstlinge unseres Teiges angenommen —, letztere aber nicht als solche, die früher für sich selbst subsistierte und ein Individuum gewesen und so von ihm angenommen worden wäre, sondern als solche, die in seiner Subsistenz ihre Existenz bekam. Denn dieselbe Hypostase des Gott-Logos ward Hypostase für das Fleisch, und auf diese Art „ist der Logos (das Wort) Fleisch geworden “, ohne Verwandlung natürlich, und das Fleisch Logos, ohne Veränderung, und Gott Mensch. Denn Gott ist das Wort, und der Mensch Gott auf Grund der hypostatischen Einigung. Es ist daher gleich, ob man sagt Natur des Wortes oder die individuelle Natur. Denn man bezeichnet damit weder eigentlich und ausschließlich das Individuum oder die Hypostase noch das Gemeinsame der Hypostasen, sondern die gemeinsame Natur in einer der Hypostasen betrachtet und untersucht.</p><p>Etwas anderes nun ist Einigung und etwas anderes Fleischwerdung. Die Einigung bedeutet nämlich nur die Verbindung. Womit aber die Verbindung geschehen ist, [bedeutet] es nicht mehr. Die Fleischwerdung jedoch oder, was dasselbe ist, die Menschwerdung, bedeutet die Verbindung mit Fleisch oder mit einem Menschen, wie auch das Feurigwerden des Eisens seine Einigung mit dem Feuer. Der selige Cyrillus selbst erklärt im zweiten Briefe an Sukensus das „* eine,* fleischgewordene Natur des Gott-Logos“. Er sagt also: „Hätten wir gesagt: ‚* eine* Natur des Wortes‘ und dann geschwiegen und nicht ‚fleischgewordene‘ hinzugefügt, sondern die Heilsveranstaltung (═ die Menschwerdung) gleichsam ausgeschlossen, so würde ihre Rede vielleicht gar Glauben finden, wenn sie zum Scheine fragten: Ist das Ganze* eine* Natur, wo ist dann die vollkommene Menschheit? Oder wie subsistierte die uns gleiche Wesenheit? Da jedoch sowohl die Vollkommenheit der Menschheit wie die Bezeichnung der uns gleichen Wesenheit durch das Wort ‚fleischgewordene‘ hinzugefügt worden ist, so sollen sie aufhören, sich auf einen Rohrstab zu stützen.“ Hier hat er also unter der Natur die Natur des Wortes gemeint. Hätte er nämlich Natur statt Hypostase genommen, so wäre es nicht unstatthaft, dies auch ohne das „fleischgeworden“ zu sagen. Denn wenn wir von* einer* Hypostase des Gott-Logos schlechthin reden, irren wir nicht. Ebenso hat auch Leontius von Byzanz den Ausdruck von der Natur verstanden, nicht von der Hypostase. In der Verteidigung des zweiten gegen die Vorwürfe des Theodoret gerichteten Anathematismus sagt der selige Cyrill so: „Die Natur des Wortes oder die Hypostase, d. i. das Wort selbst.“ Daher bezeichnet der Ausdruck „Natur des Wortes“ weder die Hypostase allein noch das Gemeinsame der Hypostasen, sondern die gemeinsame, voll und ganz in der Hypostase des Wortes betrachtete Natur.</p><p>Daß also die Natur des Wortes Fleisch geworden, d. h. sich mit dem Fleisch vereinigt hat, ist gesagt worden. Daß aber die Natur des Wortes dem Fleische nach gelitten hat, haben wir jetzt noch nicht gehört. Daß Christus dem Fleische nach gelitten hat, darüber wurden wir belehrt. Daher bedeutet der Ausdruck „Natur des Wortes“ nicht die Hypostase. Es erübrigt also nur noch zu sagen: Die Fleischwerdung ist die Vereinigung mit dem Fleische, und der Satz: „Das Wort ist Fleisch geworden “ heißt: Die Hypostase des Wortes selbst ist, ohne sich zu verändern, Hypostase des Fleisches geworden. Und daß Gott Mensch geworden und der Mensch Gott, ist gesagt worden. Denn das Wort, das Gott ist, ist, ohne sich zu verwandeln, Mensch geworden. Daß aber die* Gottheit* Mensch geworden ist oder Fleisch oder die menschliche Natur angenommen hat, haben wir nirgends gehört. Daß jedoch die Gottheit sich mit der Menschheit in einer ihrer Hypostasen vereint hat, wissen wir. Und daß Gott eine fremde Form und Wesenheit, nämlich die unsrige, angenommen hat, ist gesagt worden. Jeder der Hypostasen wird ja der Name Gott beigelegt, „Gottheit“ aber können wir von der Hypostase nicht sagen. Denn daß der Vater allein oder der Sohn allein oder der Hl. Geist allein „Gottheit“ sei, haben wir nicht gehört. Gottheit bedeutet nämlich die Natur, Vater aber die Hypostase, wie auch Menschheit die Natur, Petrus aber die Hypostase. „Gott“ jedoch bezeichnet einerseits das Gemeinsame der Natur, andrerseits wird es jeder der Hypostasen als Beiname gegeben, wie auch „Mensch“. Denn Gott ist, wer die göttliche Natur hat, und Mensch, wer die menschliche [Natur hat].</p><p>Zu alledem muß man wissen, daß der Vater und der Hl. Geist in keiner Weise an der Fleischwerdung des Wortes Anteil haben außer hinsichtlich der Wunder, des Wohlgefallens und des Willens.</p><h3>XII. KAPITEL. Die heilige Jungfrau Gottesgebärerin. Gegen die Nestorianer.</h3><p>Wir predigen die heilige Jungfrau als Gottesgebärerin im eigentlichen und wahren Sinne. Denn wie wahrer Gott der ist, der aus ihr geboren worden, so ist wahre Gottesgebärerin die, die den wahren Gott, der aus ihr Fleisch angenommen, geboren hat. Denn Gott, sagen wir, ist aus ihr geboren worden, nicht als hätte die Gottheit des Wortes den Anfang des Seins aus ihr genommen, sondern weil der Gott-Logos selbst, der „von Ewigkeit her “ zeitlos aus dem Vater gezeugt ist und anfangslos und ewig mit dem Vater und dem Geiste zugleich existiert, „am Ende der Tage “ um unseres Heiles willen in ihrem Schoße Wohnung nahm und, ohne sich zu verwandeln, aus ihr Fleisch annahm und geboren wurde. Denn nicht einen bloßen Menschen gebar die heilige Jungfrau, sondern einen wahrhaftigen Gott, nicht einen nackten, sondern fleischbekleideten, nicht einen, der vom Himmel den Leib herabbrachte und wie durch einen Kanal durch sie hindurchging, sondern einen, der aus ihr uns wesensgleiches Fleisch annahm und es in ihm selbst subsistieren machte (hypostasierte). Wäre nämlich der Leib vom Himmel gebracht und nicht von unserer Natur genommen, was hälfe dann die Menschwerdung? Die Menschwerdung des Gott-Logos geschah ja darum, daß die sündige, gefallene und verdorbene Natur selbst den Tyrannen, der sie getäuscht, besiege und so vom Verderben befreit werde, wie der göttliche Apostel sagt: „Denn durch einen Menschen [kommt] der Tod und durch einen Menschen die Auferstehung der Toten.“ Ist das erste wahr, dann auch das zweite.</p><p>Wenn er aber auch sagt: „Der erste Adam ist von der Erde, irdisch, der zweite Adam ist der Herr vom Himmel “, so meint er nicht, sein Leib sei vom Himmel, sondern [meint] offenbar, er sei kein bloßer Mensch. Denn sieh, er nannte ihn sowohl Adam wie Herrn und zeigte damit beides zugleich an. Adam heißt ja Erdgeborener. Erdgeboren aber ist offenbar die Natur des Menschen, sie ist aus Staub gebildet. Herr dagegen bezeichnet die göttliche Wesenheit.</p><p>Ferner sagt der Apostel: „Es sandte Gott seinen eingeborenen Sohn, geboren aus einem Weibe. Er sagte nicht:* durch* ein Weib, sondern:* aus* einem Weibe. Es zeigte also der göttliche Apostel an, daß der eingeborene Sohn Gottes und Gott der ist, der aus der Jungfrau Mensch geworden, er hat nicht in einem zuvor gebildeten Menschen wie in einem Propheten Wohnung genommen, sondern er ist wesenhaft und wirklich Mensch geworden, d. h. er hat in seiner Hypostase ein mit einer vernünftigen und denkenden Seele belebtes Fleisch hypostasiert und ist selbst dessen Hypostase geworden. Denn dies bedeutet das „geboren aus einem Weibe“. Wie wäre es denn möglich gewesen, daß das Wort Gottes selbst „dem Gesetze unterstellt “ war, wenn es nicht ein uns wesensgleicher Mensch geworden wäre?</p><p>Darum nennen wir die heilige Jungfrau mit Recht und in Wahrheit Gottesgebärerin. Stellt doch dieser Name das ganze Geheimnis der Heilsveranstaltung (═ Menschwerdung) dar. Ist nämlich die Gebärerin Gottesgebärerin, so ist sicherlich der aus ihr Geborene Gott, sicherlich aber auch Mensch. Denn wie sollte Gott, der von Ewigkeit her existiert, aus einem Weibe geboren sein, wenn er nicht Mensch geworden wäre? Der Sohn eines Menschen ist doch offenbar ein Mensch. Ist aber der aus einem Weibe Geborene selbst Gott, dann ist offenbar der, welcher der göttlichen und anfangslosen Wesenheit nach aus Gott dem Vater gezeugt ist, und der, der am Ende der Zeiten der anfänglichen und zeitlichen, d. h. der menschlichen Wesenheit nach, aus der Jungfrau geboren ist, ein einziger. Das weist aber auf* eine* Hypostase, zwei Naturen und zwei Geburten unseres Herrn Jesus Christus hin.</p><p>Christusgebärerin aber nennen wir die heilige Jungfrau durchaus nicht. Denn der verruchte, verabscheuungswürdige und jüdisch gesinnte Nestorius, das Gefäß der Schande, hat zur Aufhebung des Ausdruckes Gottesgebärerin und zur Bekämpfung der Gottesgebärerin, die in Wahrheit allein höher als jedes Geschöpf geehrt wird, und mag dieser samt seinem Vater, dem Satan, bersten, diese kränkende Benennung erfunden. Denn ein Christus (═ ein Gesalbter) ist auch der König David und der Hohepriester Aaron — Könige und Priester sind es, die gesalbt werden —, und jeder gotttragende Mensch kann Christus, dagegen nicht von Natur Gott genannt werden. So hat auch der gottverfluchte Nestorius sich erfrecht, den aus der Jungfrau Geborenen Gottesträger zu nennen. Fern sei es uns, ihn als Gottesträger zu bezeichnen oder zu denken, sondern als fleischgewordenen Gott. Denn das Wort selbst ist Fleisch geworden, empfangen zwar von der Jungfrau, hervorgegangen aber als Gott unter Annahme [der menschlichen Natur], die auch selbst zugleich mit ihrer Hervorbringung ins Sein von ihm vergottet wurde. Darum erfolgte zu gleicher Zeit dreierlei: ihre Annahme, ihre Existenz und ihre Vergottung durch das Wort. Und so kommt es, daß die heilige Jungfrau als Gottesgebärerin bezeichnet und gedacht wird, nicht bloß wegen der Natur des Wortes, sondern auch wegen der Vergottung des Menschlichen. Deren Empfängnis wie Existenz, nämlich die Empfängnis des Wortes und die Existenz des Fleisches im Worte selbst, ist zu gleicher Zeit auf wunderbare Weise erfolgt. Denn die Gottesgebärerin selbst bot wunderbar den Stoff zur Bildung dem Bildner dar und den Stoff zur Menschwerdung dem Gott und Schöpfer des Alls, der das Angenommene vergottete, während die Einigung das Geeinte so, wie es eben geeint worden, wahrte, nämlich nicht bloß das Göttliche, sondern auch das Menschliche von Christus, das, was über uns ist, und das, was wir sind. Denn nicht etwas, das zuerst wie wir geworden, ist später höher als wir geworden, nein, beides existierte immer vom ersten Dasein an, weil es von Anfang der Empfängnis an die Existenz im Worte selbst hatte. Menschlich also ist es (═ das Angenommene) seiner eigenen Natur nach, Gott aber und göttlich auf übernatürliche Weise. Weiterhin besaß es auch die Eigentümlichkeiten des beseelten Fleisches, denn das Wort nahm sie in Rücksicht auf die Heilsordnung an. Sie sind in der Ordnung natürlicher Bewegung (Tätigkeit) in Wahrheit natürlich.</p><h3>XIII. KAPITEL. Von den Eigentümlichkeiten der beiden Naturen.</h3><p>Wir bekennen denselben Jesus Christus, unseren Herrn, als vollkommenen Gott und vollkommenen Menschen. Darum sagen wir: Er besitzt, abgesehen von der Ungezeugtheit, alles, was der Vater hat, und er besitzt, nur die Sünde ausgenommen, alles, was der erste Adam hatte, d. i. einen Leib und eine vernünftige und denkende Seele. Er hat entsprechend den zwei Naturen die zweifachen natürlichen [Eigentümlichkeiten] der zwei Naturen: zwei natürliche Willen, den göttlichen und den menschlichen, und zwei natürliche Tätigkeiten, eine göttliche und eine menschliche, und zwei natürliche Willensfreiheiten, eine göttliche und eine menschliche, und eine [zweifache] Weisheit und Erkenntnis, eine göttliche und eine menschliche. Denn da er wesensgleich mit Gott dem Vater ist, will und wirkt er selbstmächtig wie Gott. Da er aber auch mit uns wesensgleich ist, will und wirkt er selbstmächtig wie ein Mensch. Denn sein sind die Wunder, sein auch die Leiden.</p><h3>XIV. KAPITEL. Von den Willen und Willensfreiheiten unseres Herrn Jesus Christus.</h3><p>Da also Christi Naturen zwei sind, so sind, sagen wir, seine natürlichen Willen und seine natürlichen Tätigkeiten zwei. Da aber die Hypostase seiner zwei Naturen eine ist, so sagen wir: Es ist einer und derselbe, der auf natürliche Weise will und wirkt entsprechend den beiden Naturen, aus denen und in denen [er besteht], nämlich Christus, unser Gott. Er will und wirkt aber nicht getrennt, sondern vereint. Denn er will und „wirkt in jeder der beiden Formen in Gemeinschaft mit der andern “. Was nämlich dieselbe Wesenheit hat, das hat auch dasselbe Wollen und Wirken. Was aber eine verschiedene Wesenheit hat, das hat auch verschiedenes Wollen und Wirken. Und umgekehrt, was dasselbe Wollen und Wirken hat, das hat auch dieselbe Wesenheit; was aber verschiedenes Wollen und Wirken hat, das hat auch verschiedene Wesenheit.</p><p>Darum erkennen wir eben bei Vater, Sohn und Hl. Geist aus der Identität des Wirkens und Wollens die Identität der Natur. In der göttlichen Heilsveranstaltung aber erkennen wir aus der Verschiedenheit der Tätigkeiten und der Willen auch die Verschiedenheit der Naturen, und wenn wir die Verschiedenheit der Naturen erkennen, bekennen wir zugleich auch die Verschiedenheit der Willen und Tätigkeiten. Denn wie die Zahl der Naturen des nämlichen und einen Christus, fromm gedacht und gemeint, den einen Christus nicht trennt, sondern den Unterschied der Naturen auch in der Einigung als gewahrt darstellt, so führt auch die Zahl der seinen Naturen wesenhaft zukommenden Willen und Tätigkeiten — denn nach den beiden Naturen wollte und wirkte er unser Heil — keine Trennung ein (das sei ferne!), sondern zeigt nur, auch in der Einigung, deren Wahrung und Erhaltung an. Denn natürlich und nicht hypostatisch nennen wir die Willen und Tätigkeiten. Ich meine die wollende und wirkende Kraft, nach der das Wollende und Wirkende will und wirkt. Denn geben wir zu, es sei hypostatisch, so werden wir uns genötigt sehen zu sagen, die drei Hypostasen der heiligen Dreiheit hätten verschiedene Willen und verschiedene Tätigkeiten.</p><p>Man muß nämlich wissen,* daß Wollen und So-oder-Sowollen nicht dasselbe ist. Denn das Wollen ist wie auch das Sehen Sache der Natur,* es kommt ja allen Menschen zu.* Das So-oder-Sowollen aber* ist wie* auch das So-oder-Sosehen,* das Gut- oder Schlecht-[Sehen] nicht Sache der Natur, sondern unseres Sinnes. Denn nicht alle Menschen wollen auf gleiche Weise noch sehen sie auf gleiche Weise. Das werden wir auch von den Tätigkeiten zugeben. Denn das So-oder-Sowollen, So-oder-Sosehen oder So-oder-Sowirken* ist die Art und Weise der Ausübung des Wollens, Sehens und Wirkens, die nur dem zukommt, der sie ausübt, und ihn nach dem gemeinhin sogenannten Unterschied von andern absondert.*</p><p>Man nennt also das Wollen schlechthin Willen* (θέλησις)* [thelēsis] oder die Willenskraft, die ein vernünftiges Verlangen und ein natürliches Wollen ist, das So-oder-Sowollen jedoch oder das, was dem Wollen unterliegt, Gewolltes und gnomischen (═ durch Wahl bestimmten) Willen (Wahlwillen). Wollensfähig aber ist das, was in der Lage ist, zu wollen. So ist z. B. die göttliche Natur wollensfähig, ebenso auch die menschliche. Wollend aber ist der, der den Willen ausübt, d. h. die Hypostase, wie z. B. Petrus.</p><p>Da nun Christus einer, und seine Hypostase eine ist, so ist einer und derselbe, der will sowohl auf göttliche wie menschliche Weise. Da er aber zwei wollensfähige, weil vernünftige Naturen hat — denn alles Vernünftige ist wollensfähig und selbstmächtig —, so werden wir von ihm zwei natürliche Willen oder Wollungen aussagen. Der Gleiche ist nämlich wollensfähig nach seinen beiden Naturen. Er nahm ja die von Natur aus in uns vorhandene Willenskraft an. Und da einer und derselbe Christus ist, der nach beiden Naturen will, so sagen wir das Gewollte eben von ihm aus, nicht als ob er nur das wollte, was er natürlicherweise als Gott wollte — denn es ist nicht Sache der Gottheit, essen und trinken und Ähnliches zu wollen —, vielmehr [wollte er] auch das, was die menschliche Natur erhält, freilich nicht in einem Gegensatz der Gesinnung [zum göttlichen Wollen], sondern in Eigentümlichkeit der Naturen. Denn dann wollte er letzteres auf natürliche Weise, wann sein göttlicher Wille es wollte und dem Fleische gestattete, das [ihm] Eigentümliche zu leiden und zu tun.</p><p>Daraus erhellt, daß der Wille dem Menschen von Natur aus zukommt.* Abgesehen vom göttlichen gibt es drei Arten von Leben: das pflanzliche, das empfindende, das denkende. Dem pflanzlichen eigen ist die ernährende, die mehrende, die zeugende Bewegung (Tätigkeit), dem empfindenden die antreibende, dem vernünftigen und denkenden die selbstmächtige* (freie).* Wenn* nun* dem pflanzlichen die ernährende, dem empfindenden die antreibende von Natur aus innewohnt, so wohnt folglich dem* vernünftigen und* denkenden die selbstmächtige* von Natur aus inne. Selbstmacht (Freiheit) aber ist nichts anderes als der Wille. Da nun das Wort ein beseeltes, denkendes und selbstmächtiges Fleisch geworden ist, so ist es auch wollensfähig geworden.</p><p>Ferner: Das* Natürliche ist nicht gelernt.* Denn niemand lernt denken oder leben oder hungern oder dürsten oder schlafen. Auch wollen lernen wir nicht. Darum ist das Wollen natürlich.</p><p><em>Und wiederum: In unvernünftigen Wesen lenkt die Natur, im Menschen aber wird sie gelenkt, da er selbstmächtig nach seinem eigenen Willen sich bewegt. Folglich ist der Mensch von Natur aus wollensfähig.</em></p><p><em>Und wiederum: Der Mensch ist nach dem Bilde der seligen und überwesentlichen Gottheit geschaffen, die göttliche Natur aber ist von Natur aus selbstmächtig und wollensfähig.</em> Denn* das Selbstmächtige bestimmten die Väter als Wollen.*</p><p><em>Ferner: Allen Menschen wohnt das Wollen inne, es wohnt nicht den einen inne, den andern nicht. Was man aber an allen gemeinsam wahrnimmt, kennzeichnet die Natur in den darunter begriffenen Individuen. Also ist der Mensch von Natur aus wollensfähig.</em></p><p>Und weiters: Die Natur nimmt kein Mehr oder Weniger an; das Wollen wohnt allen in gleicher Weise inne, den einen nicht mehr, den andern nicht weniger. Folglich ist der Mensch von Natur aus wollensfähig. Ist also der Mensch von Natur aus wollensfähig, so ist auch der Herr, nicht bloß sofern er Gott ist, sondern sofern er Mensch ist, von Natur wollensfähig. Wie er nämlich unsere Natur angenommen, so hat er auch unseren Naturwillen angenommen. Und in diesem Sinne sagten die Väter, er habe unser Wollen in sich nachgebildet.</p><p>Ist* das Wollen nicht natürlich, so wird es entweder hypostatisch (persönlich) oder widernatürlich sein. Allein wenn hypostatisch, so wird der Sohn einen andern Willen als der Vater haben, denn nur eine Hypostase hat das Hypostatische als Merkmal. Wenn aber widernatürlich,* so wird das Wollen* Abfall* von der Natur sein,* denn das Widernatürliche verdirbt das Naturgemäße.*</p><p><em>Der Gott und Vater von allem will entweder als Vater oder als Gott. Wenn er als Vater [will], so wird sein Wollen von dem des Sohnes verschieden sein. Der Sohn ist ja nicht Vater. Wenn er jedoch als Gott [will], der Sohn aber Gott und der Hl. Geist auch Gott ist, so [wird] das Wollen Sache der Natur oder natürlich [sein].</em></p><p><em>Ferner: Wovon das Wollen eines ist, davon ist gemäß den Vätern auch die Wesenheit eine. Nun ist auch das Wollen der Gottheit Christi und seiner Menschheit eines. Also wird auch deren Wesenheit eine und dieselbe sein.</em></p><p><em>Und wiederum: Nach den Vätern wird der Unterschied der Natur durch den einen Willen nicht ersichtlich. Entweder nimmt man nun einen Willen an, dann darf man keinen natürlichen Unterschied (═ Unterschied der Natur) in Christus annehmen, oder man nimmt einen natürlichen Unterschied an, dann darf man nicht einen Willen annehmen.</em></p><p>Und weiters: Das göttliche Evangelium erzählt:* Der Herr kam in die Landschaft von Tyrus und Sidon und „er trat in ein Haus und wollte, daß es niemand erfahren sollte; er konnte aber nicht verborgen bleiben “.* Nun ist aber sein göttlicher Wille allmächtig, er hat jedoch, obwohl er wollte, nicht verborgen bleiben können. Also konnte er es nicht, obwohl er wollte, sofern er Mensch war, und er* war wollensfähig, auch sofern er Mensch war.*</p><p>Und wiederum:* „Als er“,* heißt es,* „an den Ort kam, sprach er: Mich dürstet. Und sie gaben ihm Wein mit Galle vermischt: er kostete, wollte aber nicht trinken“. * Wenn er nun als Gott dürstete und kostete, aber nicht trinken wollte, so ist er auch als Gott leidensfähig, denn ein Leiden ist sowohl der Durst als das Kosten. Wenn aber nicht als Gott, so dürstete er sicherlich als Mensch und war auch als Mensch wollensfähig.</p><p><em>Und der selige Apostel Paulus sagt: „Er ward gehorsam bis zum Tode, ja bis zum Tode am Kreuze.“</em> Der Gehorsam ist eine Unterwerfung des wirklichen, nicht des nicht wirklichen Willens. Denn das unvernünftige Wesen werden wir nicht gehorsam oder ungehorsam nennen. Wenn nun der Herr dem Vater* gehorsam* ward, so* ist er es nicht als Gott, sondern als Mensch gewesen. Als Gott ist er ja „weder gehorsam noch ungehorsam.* Denn* das ist Sache dessen, was unterworfen ist“,* wie der Gottesträger* Gregorius sagte. Also ist* Christus* auch als Mensch wollensfähig.*</p><p>Nennen wir den* Willen natürlich,* so meinen wir damit* nicht einen gezwungenen,* sondern einen selbstmächtigen (freien); denn wenn vernünftig, ist er sicherlich auch selbstmächtig (frei).* Es hat ja nicht bloß die göttliche und ungeschaffene Natur, sondern auch die denkende und geschaffene nichts Gezwungenes.* Das ist klar.* Gott, der von Natur gut und von Natur Schöpfer und von Natur Gott ist, ist dieses nicht mit Notwendigkeit. Denn wer ist der, der [ihm] die Notwendigkeit auferlegt? *</p><p><em>Man muß aber wissen, daß die Selbstmächtigkeit (Freiheit) in verschiedenem Sinne ausgelegt wird: anders bei Gott, anders bei Engeln und anders bei Menschen. Bei Gott in übernatürlicher Weise. Bei Engeln so, daß die Inangriffnahme zugleich mit der Neigung erfolgt und durchaus keine Zwischenzeit zuläßt.</em> Denn da er (═ der Engel) die Selbstmacht von Natur aus hat, gebraucht er diese ungehindert; er hat ja weder das Widerstreben seitens des Körpers noch den Widersacher.* Bei Menschen aber so, daß die Neigung zeitlich vor der Inangriffnahme gedacht wird.* Zwar ist der Mensch selbstmächtig von Natur aus, er hat aber auch den Widerstand des Teufels und die Bewegung des Körpers. Darum bleibt wegen des Widerstandes [des Teufels] und der Schwere des Körpers die Inangriffnahme hinter der Neigung zurück.</p><p><em>Adam gehorchte, weil er wollte, und er aß, weil er wollte. Also leidet in uns zuerst der Wille. Leidet nun zuerst der Wille, nahm diesen aber das fleischgewordene Wort nicht mit der Natur an, dann sind wir der Sünde nicht los geworden.</em></p><p>Ferner:* Ist die freie Willenskraft der Natur sein* (═ des Wortes)* Werk, hat es jedoch diese nicht angenommen, so hat es damit entweder seine eigene Schöpfung für nicht gut erklärt oder es hat uns die Heilung in diesem Punkte mißgönnt und uns der vollständigen Heilung beraubt, sich selbst aber als leidend gezeigt, da es uns nicht vollständig retten wollte oder nicht konnte.*</p><p>Man kann nicht sagen, aus zwei Willen entstehe ein zusammengesetzter, wie aus den Naturen eine zusammengesetzte Hypostase. Denn erstens* ist zusammengesetzt nur das, was in einer Hypostase existiert (= was subsistiert), nicht aber, was man in einer andern und nicht in eigener Natur schaut.* Zweitens werden wir uns,* falls wir eine Zusammensetzung der Willen* und Tätigkeiten* annehmen wollen, genötigt sehen, eine Zusammensetzung auch der andern natürlichen Eigentümlichkeiten des „ungeschaffen und geschaffen“,* des „unsichtbar und sichtbar“ und dergleichen anzunehmen.* Wie soll man auch den aus den Willen zusammengesetzten Willen benennen? Denn unmöglich kann man dem Zusammengesetzten den Namen der Bestandteile geben. Sonst müßten* wir* auch das aus den Naturen Zusammengesetzte Natur* und nicht Hypostase* nennen.* Ferner: Wollen wir einen einzigen, zusammengesetzten Willen bei Christus annehmen, so* trennen wir ihn* (═ Christus)* vom Willen des Vaters.* Denn der Wille des Vaters ist nicht zusammengesetzt. Es bleibt also nur übrig zu sagen, die Hypostase Christi sei zusammengesetzt und wie seinen Naturen, so auch seinen natürlichen Eigentümlichkeiten gemeinsam.</p><p>Von einer Meinung und Wahl können wir beim Herrn nicht reden, wollen wir im eigentlichen Sinne reden. Denn die Meinung, die der Untersuchung und Überlegung oder Beratung und Beurteilung bezüglich etwas Unerkanntem folgt, ist eine Hinneigung zu dem Geurteilten. Danach kommt die Wahl. Sie wählt aus und zieht das eine dem andern vor. Der Herr aber, der kein bloßer Mensch, sondern auch Gott war und alles wußte, bedurfte keiner Untersuchung, Überlegung, Beratung und Beurteilung, und er war von Natur aus dem Guten zugeneigt und dem Bösen abgeneigt. Denn so sagt auch der Prophet Isaias: „Bevor der Knabe das Böse zu erwählen weiß, wird er das Gute erwählen; denn bevor der Knabe Gutes oder Böses erkennt, wird er das Böse verwerfen und das Gute erwählen.“ Das „bevor“ zeigt nämlich an, daß er nicht wie wir durch Untersuchung und Beratung, sondern durch das Sein selbst und seine Allwissenheit von Natur aus das Gute hatte, weil er eben Gott war und auf göttliche Weise im Fleische subsistierte, d. h. hypostatisch mit dem Fleische geeint war. Denn natürlich sind die Tugenden und wohnen von Natur aus und auf gleiche Weise allen inne, wenn wir auch nicht alle auf gleiche Weise das Naturgemäße wirken. Denn durch die Übertretung [des Gebotes] sind wir aus dem Naturgemäßen ins Naturwidrige gefallen. Der Herr aber hat uns aus dem Naturwidrigen zum Naturgemäßen zurückgeführt. Denn das heißt der Ausdruck: „Nach dem Bild und Geichnis.“ Die Askese aber und deren Mühseligkeiten wurden nicht zur Erwerbung der von außen kommenden Tugenden ersonnen, sondern zur Vertreibung der eingedrungenen und naturwidrigen Schlechtigkeit, gleichwie wir auch den Rost des Eisens, der nicht natürlich ist, sondern durch Nachlässigkeit hinzugekommen ist, mit Mühe entfernen und dadurch den natürlichen Glanz des Eisens sichtbar machen.</p><p>Man muß wissen, daß das Wort * (γνώμη)* [gnōmē] vielsinnig und vieldeutig ist. Bald bedeutet es Ermahnung. So, wenn der göttliche Apostel sagt: „Betreffs der Jungfrauen besitze ich kein Gebot vom Herrn, eine Ermahnung aber gebe ich.“ Bald auch Rat. So, wenn der Prophet David sagt: „Wider dein Volk hielten sie bösen Rat.“ Bald Beschluß. So, wenn Daniel sagt: „Von wem ging dieser schamlose Beschluß aus?“ Bald aber [steht es] für Glaube oder Meinung oder Gesinnung, ja, es wird, um es kurz zu sagen, der Name* (γνὠμη)* [gnōmē] in achtundzwanzig Bedeutungen gebraucht.</p><h3>XV. KAPITEL. Von den Wirksamkeiten (Tätigkeiten) in unserem Herrn Jesus Christus.</h3><p>Wir reden bei unserem Herrn Jesus Christus auch von zwei Tätigkeiten. Als Gott und dem Vater wesensgleich, besaß er gleichfalls die göttliche Tätigkeit (Wirksamkeit) und als Menschgewordener und uns wesensgleich die Tätigkeit der menschlichen Natur.</p><p>Man muß jedoch wissen, daß etwas anderes die Wirksamkeit, etwas anderes das Wirksame, etwas anderes die Wirkung und etwas anderes der Wirkende ist.* Wirksamkeit ist* die* tätige* und wesenhafte* Bewegung * der Natur. Das Wirksame ist die Natur, von der eine Wirksamkeit ausgeht. Wirkung ist die Vollziehung der Wirksamkeit. Wirkend ist der, der die Wirksamkeit ausübt, oder die Hypostase. Man nennt aber auch die Wirksamkeit Wirkung und die Wirkung Wirksamkeit, wie auch das Geschöpf Schöpfung. Denn so sagen wir: „Die ganze Schöpfung“ und bezeichnen damit die Geschöpfe.</p><p>Man muß wissen, daß die Wirksamkeit eine Bewegung ist und vielmehr gewirkt wird als wirkt, wie Gregor der Theologe in seiner Rede über den Hl. Geist sagt: „Ist er eine Wirksamkeit, so wird er offenbar gewirkt werden und nicht wirken und zugleich mit dem Gewirktsein aufhören.“</p><p>Man muß wissen, daß* auch das Leben* selbst* eine Wirksamkeit, ja die erste Wirksamkeit des Lebewesens ist,* auch die ganze Einrichtung des Lebewesens: die nährende und mehrende oder natürliche [Bewegung], die antreibende oder die empfindende und die denkende und selbstmächtige (freie) Bewegung. „Die Wirksamkeit aber ist die Vollendung der Möglichkeit.“ Wenn wir nun all das in Christus schauen, so werden wir ihm auch eine menschliche Wirksamkeit zuschreiben.</p><p><em>Wirksamkeit heißt auch der erste in uns entstehende Gedanke. Er ist eine einfache und verhältnislose Wirksamkeit des Geistes, der in sich unsichtbar seine Gedanken hervorbringt, ohne die er mit Recht nicht einmal Geist genannt werden könnte. Weiterhin heißt Wirksamkeit auch die Offenbarung und Kundgebung des Gedachten durch die Aussprache des Wortes. Diese aber ist nicht mehr verhältnislos und einfach, sondern sie wird in einem Verhältnis gedacht,</em> da sie aus Gedanke und Wort zusammengesetzt ist.* Aber auch das Verhalten selbst, das der Handelnde zum Geschehenden zeigt, ist eine Wirksamkeit. Und das Vollbringen selbst heißt Wirksamkeit. Das erste ist Sache der Seele allein, das zweite [Sache] der sich des Körpers bedienenden Seele, das dritte [Sache] des geistig beseelten Körpers, das vierte aber Vollbringung.* Der Geist* erwägt zum voraus, was geschehen soll,* und wirkt so durch den Körper. Der Seele kommt also die Herrschaft zu. Denn sie gebraucht den Körper wie ein Werkzeug, führt und lenkt diesen.* Eine andere aber ist die Wirksamkeit des Körpers,* der von der Seele geführt und bewegt wird. Die Vollbringung dagegen ist, was den Körper betrifft, das Berühren und das Festhalten und gleichsam das Umfassen dessen, was geschieht; was aber die Seele betrifft, gleichsam das Formen und Gestalten dessen, was geschieht. So war auch bei unserem Herrn Jesus Christus die Macht der Wunder eine Wirksamkeit seiner Gottheit, die Handleistung aber und das Wollen und Sagen: „Ich will, werde rein “ war eine Wirksamkeit seiner Menschheit. Vollbringung jedoch war seitens der menschlichen [Natur] die Brechung der Brote, die Anhörung des Aussätzigen, das „ich will“, seitens der göttlichen aber die Vermehrung der Brote und die Reinigung des Aussätzigen. Durch beides nämlich, durch die Wirksamkeit der Seele wie des Körpers, zeigte er eine und dieselbe, übereinstimmende und gleiche, seine göttliche Wirksamkeit. Wie wir nämlich die Naturen als vereint und sich gegenseitig durchdringend erkennen und doch deren Unterschied nicht leugnen, sondern diese zählen und als getrennt erkennen, so erkennen wir einerseits die Verbindung der Willen und Wirksamkeiten, andrerseits erkennen wir den Unterschied an und zählen sie und führen doch keine Trennung ein. Denn gleichwie das Fleisch vergottet worden und doch keine Änderung seiner eigenen Natur erlitten hat, ebenso sind auch der Wille und die Wirksamkeit vergottet und haben dennoch ihre eigenen Grenzen nicht überschritten. Denn einer ist es, der dieses und jenes ist, der auf diese und jene Weise, d. h. auf göttliche und menschliche wollte und wirkte.</p><p>Man muß also wegen der Doppelnatur in Christus zwei Wirksamkeiten annehmen. Denn wovon die Natur verschieden ist, davon ist die Wirksamkeit verschieden, und wovon die Wirksamkeit verschieden ist, davon ist die Natur verschieden. Und umgekehrt, wovon die Natur dieselbe ist, davon ist auch die Wirksamkeit dieselbe, und wovon die Wirksamkeit* eine* ist, davon ist auch die Wesenheit* eine,* wie die göttlich redenden Väter lehren. Eines von beiden ist also notwendig: Entweder erklärt man die Wirksamkeit in Christus für eine, dann muß man auch die Wesenheit für eine erklären, oder wir halten uns an die Wahrheit und erklären mit dem Evangelium und den Vätern die Wesenheiten für zwei, dann müssen wir zugleich auch die ihnen entsprechend folgenden Wirksamkeiten für zwei erklären. Denn da er nach seiner Gottheit Gott dem Vater wesensgleich ist, wird er [ihm] auch in der Wirksamkeit gleich sein. Und da der nämliche nach seiner Menschheit uns wesensgleich ist, wird er [uns] auch in der Wirksamkeit gleich sein. Sagt doch der selige Gregorius, der Bischof von Nyssa: „Wovon die Wirksamkeit* eine* ist, davon ist gewiß auch das Vermögen dasselbe. Denn jede Wirksamkeit ist Vollendung eines Vermögens.“ Unmöglich kann ferner die Natur oder Macht oder Wirksamkeit einer ungeschaffenen und einer geschaffenen Natur eine einzige sein. Wollten wir nun die Wirksamkeit Christi für eine erklären, so würden wir der Gottheit des Wortes die Leidenschaften (Affekte) der vernünftigen Seele, nämlich Furcht und Schmerz und Angst, zuschreiben.</p><p>Sollten sie jedoch einwenden: Die heiligen Väter, die über die heilige Dreiheit handelten, sagten allerdings: „Wovon die Wesenheit eine ist, davon ist auch die Wirksamkeit eine, und wovon die Wesenheit verschieden ist, davon ist auch die Wirksamkeit verschieden “, aber man darf* die Sätze der Gotteslehre nicht auf die Heilsveranstaltung (Menschwerdung) übertragen,* so werden wir antworten:* Ist bei den Vätern bloß von der Gotteslehre die Rede,* und hat der Sohn* nicht auch nach der Fleischwerdung* dieselbe Wirksamkeit wie der Vater,* dann wird er auch nicht dieselbe Wesenheit haben. Wem aber werden wir dann das zuschreiben: „Mein Vater wirkt bis auf diese Stunde, und auch ich wirke “, und: „Was er den Vater tun sieht, das tut in gleicher Weise auch der Sohn “, und: „Wenn ihr mir nicht glauben wollt, dann glaubet meinen Werken “, und: „Die Werke, die ich tue, legen Zeugnis von mir ab “, und: „Wie der Vater die Toten aufweckt und lebendig macht, so macht auch der Sohn die lebendig, die er will “? Dies alles zeigt, daß er auch nach der Fleischwerdung nicht bloß wesensgleich mit dem Vater ist, sondern daß er auch dieselbe Wirksamkeit hat.*</p><p>* Und wiederum: Wenn die Sorge für das Seiende nicht bloß dem Vater und dem Hl. Geiste, sondern auch dem Sohne auch nach der Fleischwerdung zukommt, dieses aber eine Wirksamkeit ist, so hat er auch nach der Fleischwerdung dieselbe Wirksamkeit wie der Vater.*</p><p><em>Wenn wir aus den Wundern erkennen, daß</em> Christus* dieselbe Wesenheit wie der Vater hat, die Wunder aber eine Wirksamkeit Gottes sind,* so hat er nach der Fleischwerdung* dieselbe Wirksamkeit wie der Vater.*</p><p>Wenn die Wirksamkeit seiner Gottheit und seines Fleisches* eine* ist, so wird sie zusammengesetzt sein, und er wird entweder eine andere Wirksamkeit haben als der Vater, oder es wird auch der Vater eine zusammengesetzte Wirksamkeit besitzen. Wenn aber eine zusammengesetzte Wirksamkeit, dann offenbar auch eine [solche] Natur.</p><p>Sollten sie aber sagen,* mit der Wirksamkeit werde zugleich eine Person eingeführt,* so werden wir erwidern: Wird mit der Wirksamkeit zugleich eine Person eingeführt, so wird nach der vernunftgemäßen Umkehrung auch mit der Person zugleich eine Wirksamkeit eingeführt werden, und es wird, wie drei Personen oder Hypostasen der heiligen Dreiheit, so auch drei Wirksamkeiten geben, oder wie* eine* Wirksamkeit, so* eine* Person und* eine* Hypostase. Die heiligen Väter haben aber einstimmig erklärt, das, was dieselbe Wesenheit habe, besitze auch dieselbe Wirksamkeit.</p><p>Ferner:* Wenn mit der Wirksamkeit zugleich eine Person eingeführt wird,* so haben die, die bestimmt haben, weder von einer noch von zwei Wirksamkeiten Christi zu reden, angeordnet, weder von einer noch von zwei Personen bei ihm zu reden.</p><p>Bei* dem feurig gemachten Messer* bleiben die Naturen* des Feuers und des Eisens gewahrt,* ebenso auch zwei Wirksamkeiten und deren Wirkungen. Denn das Eisen kann schneiden, das Feuer brennen, und der Schnitt ist die Wirkung von der Wirksamkeit des Eisens und das Brennen von der des Feuers. Und ihr Unterschied bleibt in dem gebrannten Schnitt und in dem geschnittenen Brand gewahrt, wenn auch* nach der Vereinigung* [des Feuers und Eisens]* weder das Brennen ohne den Schnitt noch der Schnitt ohne das Brennen* geschieht. Und wir reden* wegen der doppelten natürlichen Wirksamkeit weder von zwei glühend gemachten Messern,* noch* vermischen wir wegen des einzigen glühend gemachten Messers ihren wesenhaften Unterschied.* So gehört auch in Christus die göttliche und allmächtige Wirksamkeit seiner Gottheit an, die uns gemäße aber seiner Menschheit. Tat der menschlichen war es, daß er das Mädchen bei der Hand nahm und zog, [Tat] der göttlichen, daß er es lebendig machte. Denn etwas anderes war dieses und etwas anderes jenes, wenngleich sie (═ die Wirksamkeiten) in der gottmenschlichen Wirksamkeit nicht voneinander getrennt waren. Wird aber deshalb, weil die Hypostase des Herrn* eine* ist, auch die Wirksamkeit* eine* sein, dann wird wegen der* einen* Hypostase auch die Wesenheit* eine* sein.</p><p>Und wiederum: Wollen wir* eine** Wirksamkeit* beim Herrn annehmen, so werden wir diese* entweder göttlich oder menschlich oder keines von beiden* nennen.* Allein wenn göttlich,* dann* werden wir ihn nur für Gott erklären,* der die uns gleiche Menschheit nicht hat.* Wenn aber menschlich,* dann werden wir ihn* einen bloßen Menschen* lästern. Wenn jedoch weder göttlich noch menschlich, [dann werden wir ihn] * weder für Gott noch für einen Menschen,* weder dem Vater noch uns wesensgleich [erklären]. Denn durch die Einigung ist die persönliche Identität entstanden, nicht aber ist auch der Unterschied der Naturen aufgehoben worden. Bleibt jedoch der Unterschied der Naturen gewahrt, so werden natürlich auch deren Wirksamkeiten gewahrt bleiben. Denn es gibt keine unwirksame Natur.</p><p>Ist die Wirksamkeit Christi, des Herrn, eine, so wird sie entweder* geschaffen oder ungeschaffen* sein. Denn dazwischen gibt es keine Wirksamkeit, wie auch keine Natur. Wenn nun* geschaffen, so wird sie nur eine geschaffene Natur anzeigen. Wenn aber ungeschaffen, so wird sie nur eine ungeschaffene Wesenheit kennzeichnen. Denn das Natürliche muß jedenfalls den Naturen entsprechen.* Eine unvollständige Natur kann nicht existieren. Die naturgemäße Wirksamkeit ist nicht außerhalb des Naturgemäßen, und es ist klar, daß die Natur ohne ihre naturgemäße Wirksamkeit weder existieren noch erkannt werden kann. Denn jedwedes verbürgt durch das, was es wirkt, seine Natur, sofern es sich nicht ändert.</p><p>Ist die Wirksamkeit Christi* eine,* so tut die nämliche* das Göttliche und Menschliche. Kein Seiendes aber kann, wenn es in dem bleibt, was seiner Natur gemäß ist, das Gegenteil tun. Das Feuer kann nicht kühlen und wärmen, das Wasser nicht trocknen und nässen.* Wie ist es also möglich, daß der, der von Natur Gott ist und von Natur Mensch geworden ist,* sowohl die Wunder als die Leiden durch eine Wirksamkeit vollbracht hat?*</p><p>Hat Christus einen menschlichen Geist* (νοῦς)* [nous] oder eine denkende und vernünftige Seele angenommen, so wird er sicherlich gedacht haben und immer gedacht haben. Das Denken ist aber eine Wirksamkeit des Geistes. Also ist Christus auch als Mensch wirksam (tätig) und immer wirksam.</p><p>Der hochweise und große heilige Chrysostomus sagt in seiner Erklärung der Apostelgeschichte in der zweiten Rede also: „Man dürfte nicht irren, wenn man auch sein Leiden ein Tun nennt. Denn dadurch, daß er alles litt,* tat* er jenes große und wunderbare Werk, indem er den Tod vernichtete und alles andere vollbrachte.“</p><p><em>Wenn jede Wirksamkeit als wesenhafte Bewegung einer Natur bestimmt wird, wie die hierin Erfahrenen lehren: Wo weiß jemand eine untätige oder völlig unwirksame Natur oder wo hat er eine Wirksamkeit gefunden, die nicht Bewegung eines natürlichen Vermögens wäre?</em> Daß aber Gott und Geschöpf eine einzige natürliche Wirksamkeit haben, wird wohl kein Vernünftiger zugeben gemäß dem seligen Cyrillus: „Weder macht die menschliche Natur den Lazarus lebendig, noch weint die göttliche Macht. Denn die Träne ist der Menschheit eigen, das Leben jedoch dem an sich subsistierenden Leben.“ Aber gleichwohl ist wegen der Identität der Person beides beiden gemeinsam. Denn* einer* ist Christus, und* eine* ist seine Person oder Hypostase. Aber er hat doch zwei Naturen, [die Natur] seiner Gottheit und seiner Menschheit. Von der Gottheit her ist nun die Herrlichkeit, die naturgemäß von ihr ausgeht, wegen der Identität der Hypostase beiden gemeinsam, vom Fleische her ist das Niedrige beiden gemeinsam. Denn einer und derselbe ist der, der sowohl dieses wie jenes ist, nämlich Gott und Mensch, und der nämliche hat sowohl die Eigenschaften der Gottheit wie die der Menschheit. Die Wunder wirkte die Gottheit, jedoch nicht ohne das Fleisch, das Niedrige aber das Fleisch, jedoch nicht ohne die Gottheit. Denn einerseits war mit dem leidenden Fleische die Gottheit verbunden, die leidensfrei blieb und die Leiden heilbringend machte, andrerseits war mit der wirkenden Gottheit des Wortes der heilige Verstand* (νοῦς)* [nous] verbunden, der das, was vollbracht wurde, bedachte und wußte.</p><p>Ihre eigenen Vollkommenheiten teilt die Gottheit dem Leibe mit, sie selbst aber bleibt von den Leiden des Fleisches unberührt. Denn nicht so, wie durch das Fleisch die Gottheit wirkte, litt auch durch die Gottheit sein Fleisch. Das Fleisch war nämlich Werkzeug der Gottheit. Obgleich daher von der ersten Empfängnis an nicht die geringste Trennung zwischen den beiden Gestalten (═ der göttlichen und menschlichen Gestalt) bestand, sondern die Handlungen der* einen* Person jederzeit beiden Gestalten zugehörten, so vermischen wir doch das, was ungetrennt geschehen, in keiner Weise, sondern erkennen aus der Beschaffenheit der Werke, was Sache der einen oder andern Form ist.</p><p>Es wirkt also Christus nach jeder seiner beiden Naturen, und es wirkt jede der beiden Naturen in ihm in Gemeinschaft mit der andern: Das Wort wirkt durch die Macht und Kraft der Gottheit, was des Wortes ist, alles, was des Herrschers und Königs ist, der Leib aber nach dem Willen des mit ihm geeinten Wortes, dem er ja angehört. Denn nicht* von sich selbst aus* erregte er den Trieb zu den natürlichen Affekten noch auch die Abneigung und den Widerwillen gegen das Lästige oder litt er das von außen her Zustoßende, sondern er bewegte (═ betätigte) sich entsprechend dem Naturverhältnis: Gemäß der Heilsordnung war es nämlich das Wort, das wollte und zuließ, daß er das Seinige leide und tue, damit durch die Werke die Wirklichkeit der Natur beglaubigt würde.</p><p>Gleichwie er, aus einer Jungfrau geboren, in überwesentlicher Weise Wesenheit annahm, so wirkte er auch in übermenschlicher Weise, was Sache der Menschen ist: Er wandelte mit irdischen Füßen auf unstetem Wasser. Das Wasser ward nicht zur Erde, sondern es wurde durch die übernatürliche Macht der Gottheit zusammengehalten, so daß es nicht zerfloß und der Schwere der materiellen Füße nicht nachgab. Denn nicht auf menschliche Weise tat er das Menschliche, er war ja nicht bloß Mensch, sondern auch Gott. Deshalb waren auch seine Leiden lebendigmachend und heilbringend. Und nicht auf göttliche Weise wirkte er das Göttliche, er war ja nicht bloß Gott, sondern auch Mensch. Deshalb wirkte er durch Berührung, Wort und dergleichen die Wunder.</p><p>Wollte aber jemand sagen:* Nicht um die menschliche Wirksamkeit aufzuheben, behaupten wir eine Wirksamkeit* in Christus,* sondern weil im Gegensatz zur göttlichen Wirksamkeit* die menschliche Wirksamkeit* ein Leiden genannt wird,* insofern behaupten wir* eine* Wirksamkeit in Christus, so werden wir antworten:* Demgemäß halten auch die, die eine Natur behaupten, diese fest, nicht um die menschliche aufzuheben, sondern weil im Gegensatz zur göttlichen Natur die menschliche leidend heißt.* Von uns aber* sei es ferne, daß wir im Gegensatz zur göttlichen Wirksamkeit die menschliche Bewegung ein Leiden nennen. Denn, um allgemein zu sprechen, von keiner Sache läßt sich die Existenz durch Gegenüberstellung oder Vergleichung erkennen und bestimmen. Auf diese Weise würde es sich zeigen, daß die Dinge wechselseitig Ursachen voneinander sind. Denn wenn deshalb, weil die göttliche Bewegung eine Wirksamkeit ist, die menschliche ein Leiden ist, so wird gewiß auch deshalb, weil die göttliche Natur gut ist, die menschliche schlecht sein. Und umgekehrt wird, weil die menschliche Bewegung ein Leiden genannt wird, die göttliche Bewegung eine Wirksamkeit genannt, und weil die menschliche Natur schlecht ist, wird die göttliche gut sein.* Und auch alle Geschöpfe werden auf diese Weise schlecht sein, und es wird der lügen, der sagt: „Und Gott sah alles, was er gemacht hatte, und siehe, es war sehr gut.“</p><p>Wir aber sagen:* Die heiligen Väter haben die menschliche Bewegung (Tätigkeit) je nach den Gedanken, die sie entwickelten, auf mannigfache Weise benannt. Sie nannten sie nämlich Vermögen, Wirksamkeit, Unterschied, Bewegung, Eigentümlichkeit, Beschaffenheit, Leiden. Vermögen [nannten sie dieselbe] nicht im Gegensatz zur göttlichen, sondern da sie bleibend und unwandelbar ist. Wirksamkeit, da sie kennzeichnend ist und die Gleichheit in allen Gleichartigen anzeigt. Unterschied, da sie unterscheidend ist. Bewegung, da sie sich kundgibt. Eigentümlichkeit, da sie bestimmend ist und nur ihr selbst und keiner andern zukommt. Beschaffenheit, da sie formbildend ist. Leiden, da sie bewegt wird — denn alles, was aus Gott und nach Gott ist, leidet dadurch, daß es bewegt wird, da es nicht Selbstbewegung oder Selbstmacht ist —, also, wie gesagt, nicht im Gegensatz, sondern nach dem Inhalt, der ihr von der Ursache, die das All begründet, schöpferisch eingepflanzt ist. Deshalb gaben sie ihr auch die gleiche Bezeichnung wie der göttlichen, sie nannten sie Wirksamkeit. Denn der gesagt hat: „Es wirkt jede der beiden Formen in Gemeinschaft mit der andern “, was hat er anderes getan als der, der gesagt: „Als er vierzig Tage gefastet, hungerte ihn zuletzt “ — denn wann er wollte, ließ er die Natur das Ihrige wirken — oder die, die eine verschiedene, oder die, die eine doppelte, oder die, die eine andere und wieder andere Wirksamkeit in ihm lehrten?* Letzteres ist ja nur ein Benennungswechsel (Antonomasie) und bezeichnet die beiden Wirksamkeiten. Oft wird nämlich durch einen Benennungswechsel die Zahl angezeigt, wie dadurch, daß man sagt: göttlich und menschlich. Denn* der Unterschied ist ein Unterschied von etwas, das verschieden ist.* Wie soll das, was nicht ist, verschieden sein?</p><h3>XVI. KAPITEL. Gegen die, die sagen: Hat der Mensch zwei Naturen und Wirksamkeiten (Tätigkeiten), so muß man bei Christus drei Naturen und ebensoviele Wirksamkeiten annehmen.</h3><p>Da der einzelne Mensch aus zwei Naturen, Seele und Leib, besteht und diese unverändert in sich trägt, so wird man mit Recht sagen, er habe zwei Naturen. Er bewahrt nämlich auch nach der Einigung die natürlichen Eigentümlichkeiten einer jeden. Denn der Körper ist nicht unsterblich, sondern vergänglich, die Seele nicht sterblich, sondern unsterblich. Der Körper ist nicht unsichtbar, die Seele für leibliche Augen nicht sichtbar. Sie ist vernünftig, denkend und unkörperlich, er grob, sichtbar und unvernünftig.* Nicht einer Natur aber ist, was der Wesenheit nach einen Gegensatz bildet. Also sind Seele und Leib nicht einer Natur.*</p><p>Und wiederum:* Der Mensch ist ein vernünftiges, sterbliches Wesen, jedes Wesensmerkmal zeigt die in Rede stehenden Naturen an. Das Vernünftige aber ist gemäß dem Begriffe der Natur nicht dasselbe wie das Sterbliche. Also hat der Mensch nach seiner Normaldefinition wohl nicht eine Natur.*</p><p><em>Sagt man jedoch bisweilen, der Mensch habe eine Natur, dann nimmt man den Namen Natur für Art. So wenn wir sagen, ein Mensch unterscheide sich vom andern durch keinen Unterschied der Natur.</em> Da alle Menschen dieselbe Zusammensetzung haben, aus Seele und Leib bestehen, ein jeder zwei Naturen umfaßt, so werden eben alle unter* eine* Definition gebracht. Und das ist nicht unvernünftig. Denn der heilige Athanasius sagte sogar, daß alle Geschöpfe, sofern sie geworden,* eine* Natur haben.* Bei der Widerlegung der Lästerer des Hl. Geistes sagt er nämlich also: „Daß der Hl. Geist über der Schöpfung steht, von der Natur der Geschöpfe verschieden ist und allein der Gottheit angehört, ist wiederum leicht einzusehen.“ „Denn alles, was man gemeinsam und in vielen schaut, nicht im einen mehr, im andern weniger existiert, heißt Wesenheit.“* Nun ist jeder Mensch aus Seele und Leib zusammengesetzt, insofern redet man von* einer* Natur der Menschen. Bei der Hypostase des Herrn aber können wir nicht von* einer* Natur reden. Denn eine jede (der beiden Naturen) bewahrt auch nach der Einigung ihre natürliche Eigentümlichkeit, und eine Art von Christussen ist nicht zu finden. Es existiert ja kein anderer aus Gottheit und Menschheit bestehender Christus, der Gott und Mensch zugleich wäre.</p><p>Und wiederum: Die Arteinheit des Menschen und die Wesenseinheit von Seele und Leib sind nicht dasselbe. Die Arteinheit des Menschen zeigt nämlich die in allen Menschen vorhandene Gleichheit an, die Wesenseinheit von Seele und Leib aber zerstört deren Sein und bringt sie zum völligen Nichtsein. Denn entweder wird das eine in die Wesenheit des andern verwandelt werden, oder aus beiden ein anderes entstehen, und beide verwandelt werden, oder sie werden in den eigenen Grenzen bleiben und zwei Naturen sein. Nach dem Begriff der Wesenheit ist eben der Körper mit dem Unkörperlichen nicht identisch. Darum darf man, wenn man beim Menschen von* einer* Natur redet — nicht wegen der Identität der wesenhaften Beschaffenheit von Seele und Leib, sondern wegen der Gleichheit der unter eine Art befaßten Individuen —, nicht auch bei Christus von* einer* Natur reden, wo es eine Art, die viele Hypostasen umfaßt, nicht gibt.</p><p>Ferner: Jede Zusammensetzung, sagt man, bestehe aus dem* zunächst Verbundenen.* Denn wir sagen nicht, das Haus sei aus Erde und Wasser zusammengesetzt, sondern aus Ziegelsteinen und Holz. Sonst müßte man sagen, auch der Mensch sei wenigstens aus fünf Naturen zusammengesetzt,* aus den vier Elementen* und der Seele. So ziehen wir auch bei unserem Herrn Jesus Christus nicht die Teile der Teile in Betracht, sondern das* zunächst Verbundene,* Gottheit und Menschheit.</p><p>Ferner: Wenn wir sagen, der Mensch habe zwei Naturen, und darum genötigt sein werden, bei Christus drei Naturen anzunehmen, so werdet auch ihr, da ihr den Menschen aus zwei Naturen bestehen laßt, lehren, Christus bestehe aus drei Naturen. Dasselbe gilt auch von den Wirksamkeiten. Denn die Wirksamkeit muß der Natur entsprechen. Daß aber der Mensch zweinaturig heißt und ist, bezeugt Gregor der Theologe, da er sagt: „Denn zwei Naturen sind Gott und Mensch, weil auch Seele und Leib es sind.“ Und in der Rede über die Taufe sagt er also: „Da wir zweifach sind, aus Seele und Leib, der sichtbaren und der unsichtbaren Natur [bestehen], so ist zweifach auch die Reinigung, durch Wasser und Geist.“</p><h3>XVII. KAPITEL. Von der Vergottung der Fleischnatur und des Willens des Herrn.</h3><p>Man muß wissen:* Nicht weil ein Übergang oder eine Verwandlung oder Veränderung oder Vermischung der Natur erfolgte, sagt man, das Fleisch des Herrn sei vergottet und Mitgott und Gott geworden, wie der Theologe Gregorius sagt:* „Wovon das eine vergottete, das andere „vergottet wurde“ und,* ich wage zu sagen, Mitgott* [wurde], und es sei* Mensch* geworden,* was salbte, und Gott, was gesalbt wurde.* Denn das [sagt man] nicht* mit Rücksicht auf eine Verwandlung der Natur, sondern mit Rücksicht auf die heilsordnungsmäßige, d. i. hypostatische Einigung, wonach es* (═ das Fleisch)* unzertrennlich mit dem Gott-Logos geeint ist,* wie wir auch von einem Feurigwerden des Eisens reden.* Wie wir die Menschwerdung ohne Verwandlung und Veränderung bekennen, so glauben wir auch, daß die Vergottung des Fleisches geschah. Denn weder trat das Wort deshalb, weil es Fleisch wurde, aus den Grenzen seiner Gottheit und der ihr zukommenden göttlichen Vollkommenheiten heraus, noch wurde durch die Vergottung das Fleisch in seiner Natur oder seinen natürlichen Eigentümlichkeiten verwandelt. Es sind nämlich auch nach der Einigung sowohl die Naturen unvermengt als deren Eigenschaften unversehrt geblieben. Das Fleisch des Herrn aber gewann ob seiner reinsten, nämlich seiner hypostatischen Einigung mit dem Worte die göttlichen Wirksamkeiten, ohne irgendeinen Verlust seiner natürlichen Eigenschaften zu erleiden.* Denn nicht in eigener Wirksamkeit, * sondern kraft des mit ihm geeinten Wortes wirkte es das Göttliche,* durch dasselbe erwies das Wort seine eigene Wirksamkeit. Es brennt ja das feurig gemachte Eisen nicht, weil es durch seine Natur die brennende Wirksamkeit besitzt, sondern weil es dieses durch seine Vereinigung mit dem Feuer erlangt hat.</p><p>Das nämliche (═ das Fleisch) ist also sterblich ob seiner selbst und lebendigmachend ob seiner hypostatischen Einigung mit dem Worte. Desgleichen behaupten wir auch die Vergottung des Willens, nicht als wäre seine natürliche Bewegung (Tätigkeit) verändert worden, sondern weil sie mit seinem göttlichen und allmächtigen Willen vereint ward und derselbe der Wille des menschgewordenen Gottes wurde. Daher konnte er nicht* aus sich selbst* verborgen bleiben, als er wollte, da es dem Gott-Logos gefiel, daß die in ihm wirklich vorhandene Schwäche des menschlichen Willens sich zeige. Er wirkte aber, als er wollte, die Reinigung des Aussätzigen wegen der Vereinigung mit dem göttlichen Willen.</p><p>Man muß aber wissen, daß die Vergottung der Natur wie des Willens ganz klar und deutlich die zwei Naturen und die zwei Willen erkennen läßt. Denn wie das Feurigwerden nicht die Natur des Feuriggewordenen in die des Feuers verwandelt, sondern sowohl das Feuriggewordene als das Feurigmachende anzeigt, und nicht eines, sondern zwei ausdrückt, so stellt auch die Vergottung nicht eine einzige, zusammengesetzte Natur her, sondern [zeigt] die beiden und ihre hypostatische Einigung [an]. Darum sagt der Theologe Gregorius: „Von denen das eine vergottete und das andere vergottet wurde.“ Denn da er sagte: „Von denen das eine und das andere“, hat er zwei aufgezeigt.</p><h3>XVIII. KAPITEL. Abermals von Willen und Selbstmacht, von Verstand, Erkenntnis und Weisheit.</h3><p>Wir nennen Christus vollkommenen Gott und vollkommenen Menschen, darum werden wir [ihm] gewiß alles zugestehen, was sowohl dem Vater als der Mutter natürlich ist. Denn er ist Mensch geworden, damit das Besiegte siege. Er, der alles kann, hätte zwar die Macht gehabt, durch seine allmächtige Kraft und Gewalt den Menschen vom Tyrannen zu befreien. Allein das hätte dem Tyrannen, der den* Menschen* besiegt, aber von einem* Gott* bezwungen worden wäre, Stoff zur Anklage gegeben. Da jedoch der mitleidige und menschenfreundliche Gott den Gefallenen selbst als Sieger erklären wollte, ward er Mensch, um Gleiches mit Gleichem wieder gut zu machen.</p><p>Daß der Mensch ein vernünftiges und denkendes Wesen ist, wird niemand leugnen. Wie wäre es also möglich, daß er (Christus) Mensch geworden, wenn er ein beseeltes Fleisch oder eine geistlose Seele angenommen hätte? Denn das ist kein Mensch. Was hätten wir auch einen Nutzen von der Menschwerdung gehabt, wäre der Erstverwundete nicht gerettet und durch die Verbindung mit der Gottheit nicht erneuert und gekräftigt worden? Denn was nicht angenommen ist, ist nicht geheilt. Er nimmt also den ganzen Menschen an, sein Bestes, das aus Schwachheit gefallen, um dem ganzen das Heil zu schenken. Einen Geist aber ohne Weisheit, der Erkenntnis bar, dürfte es niemals geben. Denn ist er ohne Tätigkeit und Bewegung, dann ist er sicherlich auch ohne Existenz.</p><p>Da also der Gott-Logos das Ebenbildliche erneuern wollte, ist er Mensch geworden. Was aber ist das Ebenbildliche, außer der Geist? Soll er also das Bessere ausgelassen und das Geringere angezogen haben? Der Geist steht in der Mitte zwischen Gott und Fleisch, diesem als Hausgenosse, Gott als Ebenbild. Geist vermischt sich also mit Geist, und der Geist vermittelt zwischen der Reinheit Gottes und der Grobheit des Fleisches. Denn hat der Herr eine geistlose Seele angenommen, dann hat er die Seele eines unvernünftigen Tieres angenommen.</p><p>Wenn aber der Evangelist sagte: „Das Wort ist Fleisch geworden “, so muß man wissen: In der Hl. Schrift wird der Mensch bald Seele genannt, so z. B.: „In fünfundsiebzig Seelen kam Jakob nach Ägypten “, bald Fleisch, so z. B.: „Alles Fleisch wird das Heil Gottes schauen.“ Nicht unbeseeltes oder geistloses Fleisch aber, sondern* Mensch* ist der Herr geworden. Sagt er ja selbst: „Was schlägst du mich, einen Menschen, der ich die Wahrheit zu euch gesprochen?“ Er nahm also Fleisch an, das von einer vernünftigen und denkenden Seele beseelt war, die über das Fleisch herrschte, selbst aber von der Gottheit des Wortes beherrscht war.</p><p>Er besaß also von Natur aus sowohl als Gott wie als Mensch das Wollen. Es folgte und gehorchte aber seinem [göttlichen] Willen der menschliche, er wurde nicht durch eine eigene Meinung bewegt, sondern wollte das, was sein göttlicher Wille wollte. Denn nur mit Zulassung des göttlichen Willens erlitt er naturgemäß das Eigene. Als er sich den Tod verbat, verbat er sich ihn naturgemäß, und er hatte Angst und Furcht, da sein göttlicher Wille es wollte und zuließ. Und als sein göttlicher Wille wollte, daß sein menschlicher Wille den Tod erwähle, wurde für ihn das Leiden ein freiwilliges. Denn nicht bloß als Gott überantwortete er sich freiwillig dem Tode, sondern auch als Mensch. Dadurch flößte er auch uns Mut gegen den Tod ein. Denn so sagt er vor dem heilbringenden Leiden: „Vater, ist es möglich, so gehe dieser Kelch an mir vorüber.“ Natürlich sollte er als Mensch den Kelch trinken, nicht als Gott. Als Mensch also will er, daß der Kelch vorübergehe. Das sind die Worte der natürlichen Furcht. „Doch nicht mein Wille geschehe,“ nämlich sofern ich von dir wesensverschieden bin, „sondern der deine “, d. h. der meine und deine, sofern ich dir wesensgleich bin. Das sind wieder Worte des Mutes. Denn als die Seele des Herrn, dem es gefallen, wahrhaft Mensch zu werden, zuerst die natürliche Schwachheit erfahren, da sie bei der Trennung vom Leibe auch ein natürliches Schmerzgefühl empfunden, faßt sie, vom göttlichen Willen gestärkt, wieder Mut gegen den Tod. Denn weil der nämliche ganz Gott war mit seiner Menschheit und ganz Mensch mit seiner Gottheit, unterwarf er als Mensch in sich und durch sich das Menschliche Gott dem Vater, indem er sich selbst uns als bestes Vorbild und Muster gab, und er ward dem Vater gehorsam.</p><p>Frei aber wollte er durch den göttlichen und menschlichen Willen. Jeder vernünftigen Natur ist doch sicherlich der freie Wille angeboren. Denn wozu soll sie die Vernunft haben, wenn sie nicht frei überlegt? Das natürliche Begehren hat der Schöpfer ja auch den unvernünftigen Tieren eingepflanzt, dieses lenkt sie mit Notwendigkeit zur Erhaltung ihrer Natur. Denn die [Wesen], die der Vernunft nicht teilhaft sind, können nicht lenken, sondern werden vom Naturtrieb gelenkt. Deshalb erfolgt, sobald der Trieb sich regt, sogleich auch der Angriff zum Handeln. Denn sie brauchen nicht Vernunft oder Beratung oder Erwägung oder Beurteilung. Deshalb werden sie weder gelobt und selig gepriesen, sofern sie der Tugend folgen, noch gestraft, sofern sie Böses tun. Die vernünftige Natur hat zwar das natürliche Verlangen, das sich regt, es wird aber in dem, was das Naturgemäße bewahrt, von der Vernunft gelenkt und geregelt. Das ist eben der Vorzug der Vernunft, der freie Wille, den wir eine natürliche Bewegung im Vernünftigen nennen. Darum wird sie auch gelobt und gepriesen, sofern sie der Tugend folgt, und gestraft, sofern sie dem Bösen nachgeht.</p><p>Daher wollte die Seele des Herrn in freier Bewegung, aber sie wollte frei das, von dem sein göttlicher Wille wollte, daß sie es wolle.* Denn nicht auf den Wink des Wortes bewegte sich das Fleisch,* auch Moses und alle Heiligen bewegten sich auf den göttlichen Wink, nein, als Gott und Mensch zugleich wollte er sowohl nach dem göttlichen als dem menschlichen Willen. Darum unterschieden sich die zwei Willen des Herrn nicht durch Gesinnung, sondern vielmehr durch natürliche Macht voneinander. Denn sein göttlicher Wille war anfangslos und allwirkend, von der Macht begleitet und leidenslos. Sein menschlicher Wille aber begann in der Zeit und erfuhr die natürlichen und tadellosen Affekte. Er war zwar von Natur nicht allmächtig, aber da er in Wahrheit und der Natur nach [Wille] des Gott-Logos wurde, war er doch allmächtig.</p><h3>XIX. KAPITEL. Von der gottmenschlichen Wirksamkeit.</h3><p>Der selige* Dionysius * sagt,* Christus „habe uns eine neue, gottmenschliche Wirksamkeit vorgelebt.“* Nicht um die natürlichen Wirksamkeiten aufzuheben, sagt er, es sei aus der menschlichen und göttlichen* eine* Wirksamkeit entstanden — denn so könnten wir auch von einer einzigen neuen Natur reden, die aus der göttlichen und menschlichen entstanden. Wovon nämlich die Wirksamkeit eine ist, davon ist nach den heiligen Vätern auch die Wesenheit eine ― er wollte* vielmehr die neue, unaussprechliche Erscheinungsweise der natürlichen Wirksamkeiten Christi, die der unaussprechlichen Weise des Ineinanderseins der Naturen Christi entspricht, sein fremdartiges, wunderbares, der Natur der Wesen unbekanntes Walten als Mensch, sowie die Weise der der unaussprechlichen Einigung entsprechenden Wechselmitteilung zeigen.* Denn nicht getrennt lassen wir die Wirksamkeiten sein und nicht getrennt die Naturen wirken, sondern vereinigt, eine jede in Gemeinschaft mit der andern das wirken, was sie Eigentümliches hat. Er wirkte nämlich weder das Menschliche [bloß] auf menschliche Weise, er war ja nicht bloßer Mensch, noch das Göttliche bloß auf göttliche, er war kein bloßer Gott, sondern Gott und Mensch zugleich. Denn wie wir von den Naturen sowohl die Vereinigung als den natürlichen Unterschied kennen, so auch von den natürlichen Willen und Wirksamkeiten.</p><p>Man muß demnach wissen, daß wir von unserem Herrn Jesus Christus bald als von zwei Naturen, bald als von* einer* Person reden. Aber das eine wie das andere bezieht sich auf* einen* Gedanken. Denn die zwei Naturen sind* ein* Christus, und der* eine* Christus besteht aus zwei Naturen. Es ist also dasselbe, wenn man sagt: Es wirkt Christus nach jeder seiner beiden Naturen, und: Es wirkt jede der beiden Naturen in Christus in Gemeinschaft mit der andern. Es hat also die göttliche Natur teil am Fleische, das wirkt, weil ihm durch das Wohlgefallen des göttlichen Willens eingeräumt wird, das Eigene zu leiden und zu tun, und weil die Wirksamkeit des Fleisches sicherlich heilbringend ist. Das ist nicht Sache der menschlichen Wirksamkeit, sondern der göttlichen. Das Fleisch aber [hat teil] an der Gottheit des Wortes, die wirkt, weil sie durch den Leib wie durch ein Werkzeug die göttlichen Wirksamkeiten vollzieht, und weil einer der ist, der göttlich und menschlich wirkt.</p><p>Man muß aber wissen: Seine heilige Vernunft betätigt auch ihre natürlichen Tätigkeiten, sie bedenkt und erkennt, daß sie Vernunft Gottes ist und von der ganzen Schöpfung angebetet wird, und sie erinnert sich ihres Wirkens und Leidens auf Erden. Sie hat aber teil an der Gottheit des Wortes, die wirkt und alles leitet und regiert, sie denkt und erkennt und lenkt, nicht als bloße Vernunft eines Menschen, sondern als hypostatisch mit Gott geeint und als Vernunft Gottes.</p><p>Das also bedeutet die gottmenschliche Wirksamkeit: Als „Gott Mann “ oder Mensch „geworden“, war auch seine menschliche Wirksamkeit göttlich oder vergottet, sie entbehrte nicht seiner göttlichen Wirksamkeit, und seine göttliche Wirksamkeit entbehrte nicht seiner menschlichen Wirksamkeit, sondern jede von beiden zeigte sich in Verbindung mit der andern. Diese Redeweise heißt Periphrase, wenn man nämlich zweierlei durch* ein* Wort ausdrückt. Den geschnittenen Brand und den gebrannten Schnitt des feurig gemachten Messers nennen wir* einen;* wir sagen jedoch, Schneiden und Brennen seien verschiedene Wirksamkeiten und rührten von verschiedenen Naturen her, das Brennen vom Feuer, das Schneiden vom Eisen. Ebenso verstehen wir auch, wenn wir von einer gottmenschlichen Wirksamkeit Christi reden, die zwei Wirksamkeiten seiner zwei Naturen, die göttliche Wirksamkeit seiner Gottheit und die menschliche seiner Menschheit.</p><h3>XX. KAPITEL. Von den natürlichen und untadelhaften Leidenschaften (Affekten).</h3><p>Wir bekennen, daß er (═ Christus) alle natürlichen und untadelhaften Affekte des Menschen angenommen hat. Denn den ganzen Menschen und alles Menschliche hat er angenommen, nur die Sünde ausgenommen. Diese ist ja nicht natürlich, auch nicht vom Schöpfer in uns gesät, sondern, weil der Teufel darauf gesät, ist sie in unserem Willen freiwillig entstanden, sie herrscht jedoch nicht mit Gewalt über uns. Natürliche und untadelhafte Affekte aber sind solche, die nicht von uns abhängen, alle, die infolge der Verurteilung, die wegen der Übertretung erfolgt, ins menschliche Leben gekommen sind, wie Hunger, Durst, Ermüdung, Mühe, die Träne, die Vergänglichkeit, die Todesscheu, die Furcht, die Angst, daher die Schweiß- und Blutstropfen, die Hilfe der Engel ob der Schwachheit der Natur und anderes dergleichen, das allen Menschen naturgemäß zukommt.</p><p>Alles also hat er angenommen, um alles zu heiligen. Er ward versucht und siegte, um uns den Sieg zu bereiten und der Natur Kraft zu geben, den Widersacher zu besiegen, damit die ehedem besiegte Natur durch die Angriffe, durch welche sie besiegt worden, den ehemaligen Sieger besiege.</p><p>Der Böse (═ der Teufel) griff [ihn] also von außen, nicht durch Gedanken an, desgleichen auch den Adam; denn auch letzteren nicht durch Gedanken, sondern durch die Schlange. Der Herr aber schlug den Angriff zurück und löste ihn auf wie Rauch, damit auch wir die Affekte, die ihn angriffen und die besiegt wurden, leicht niederkämpfen könnten, und der neue Adam den alten rette.</p><p>Ohne Zweifel waren unsere natürlichen Affekte gemäß der Natur und über der Natur in Christus. Gemäß der Natur nämlich regten sie sich in ihm, wenn er dem Fleisch erlaubte, das [ihm] Eigene zu leiden. Über der Natur aber, weil beim Herrn das Natürliche den Willen nicht beherrschte. Denn nichts Gezwungenes, sondern lauter Freiwilliges schaut man bei ihm. Freiwillig hungerte, freiwillig dürstete, freiwillig zagte, freiwillig starb er.</p><h3>XXI. KAPITEL. Von der Unwissenheit und Knechtschaft.</h3><p>Man muß wissen, daß er (═ Christus) die unwissende und dienende Natur angenommen hat. Denn die Menschennatur ist Dienerin Gottes, der sie geschaffen, und sie besitzt nicht die Kenntnis der Zukunft. „Wenn du also nach dem Theologen Gregorius das Sichtbare vom Geistigen sonderst “, so heißt das Fleisch dienend und unwissend. Allein wegen der Identität der Hypostase und der unzertrennlichen Einigung war die Seele des Herrn mit der Kenntnis der Zukunft und den übrigen Wundern bereichert. Das Fleisch der Menschen ist seiner eigenen Natur nach nicht lebendigmachend. Das hypostatisch mit dem Gott-Logos selbst geeinte Fleisch des Herrn verlor zwar die natürliche Sterblichkeit nicht, allein infolge der hypostatischen Einigung mit dem Worte wurde es lebendigmachend, und wir können nicht sagen, daß es nicht lebendigmachend war und immer ist. Ebenso besitzt die menschliche Natur die Kenntnis der Zukunft nicht wesenhaft, aber die Seele des Herrn gewann, wie gesagt, infolge der Einigung mit dem Gott-Logos selbst und der hypostatischen Identität mit den übrigen Wundern auch die Kenntnis der Zukunft.</p><p>Man muß ferner wissen, daß wir ihn auch nicht Knecht nennen können. Denn der Name Knechtschaft und Herrschaft bezeichnet nicht eine Natur, sondern Beziehungen, wie der [Name] Vaterschaft und der [Name] Sohnschaft. Diese zeigen ja nicht eine Wesenheit, sondern ein Verhältnis an. [Wir sagen], wie wir auch von der Unwissenheit sagten: Wenn du in reinen Gedanken oder feinen Verstandesvorstellungen das Geschaffene vom Ungeschaffenen sonderst, so ist das Fleisch knechtisch, falls es mit dem Gott-Logos nicht geeint ist. Wie soll es aber, einmal hypostatisch geeint, knechtisch sein? Denn da Christus* einer* ist, so kann er nicht sein eigener Knecht und Herr sein. Diese Bezeichnungen gehören ja nicht zu den schlechthinigen (absoluten), sondern zu denen, die sich auf anderes beziehen (═ zu den relativen). Wessen Knecht also wird er sein? Des Vaters? Also gehört nicht alles, was der Vater hat, auch dem Sohn, wenn er nämlich ein Knecht des Vaters ist. Sein eigener [Knecht] aber ist er gewiß nicht. Wie ist es möglich, daß von uns, die wir durch ihn Söhne geworden, der Apostel sagt: „Daher bist du nicht mehr Knecht, sondern Sohn “, wenn er selbst ein Knecht ist? Zunamensweise also wird er Knecht genannt, nicht als ob er selbst dies wäre, sondern weil er unsertwegen Knechtesgestalt annahm und mit uns sich Knecht nennen ließ. Denn, obwohl leidenslos, unterwarf er sich unsertwegen Leiden und wurde Diener unseres Heiles. Die ihn aber Knecht nennen, trennen den* einen* Christus in zwei, wie Nestorius. Wir jedoch nennen ihn Gebieter und Herrn der ganzen Schöpfung, den* einen* Christus, der Gott und Mensch zugleich ist und alles weiß. Denn „in ihm sind alle Schätze der Weisheit und der Erkenntnis verborgen “.</p><h3>XXII. KAPITEL. Vom Fortschritt.</h3><p>„Er nahm zu“, heißt es, „an Weisheit und Alter und Gnade.“ Er wuchs an Alter. Mit dem zunehmenden Alter aber ließ er die in ihm wohnende Weisheit ans Licht treten. Ferner machte er den Fortschritt der Menschen in Weisheit und Gnade und die Erfüllung des Vaterwillens, d. h. die Gotteserkenntnis und das Heil der Menschen, zu seinem eigenen Fortschritt und eignete sich überall das Unsrige an. Die aber bei ihm einen Fortschritt in Weisheit und Gnade in dem Sinne behaupten, als hätte er hierin eine Vermehrung erfahren, die lassen die Einigung nicht mit der ersten Entstehung des Fleisches erfolgt sein und sie lehren auch keine hypostatische Einigung, sondern dem eitlen Nestorius folgend fabeln sie von einer äußerlichen Einigung und einer bloßen Einwohnung, „verstehen aber gar nicht, was sie sagen, noch worüber sie kühn Behauptungen aufstellen “. Denn wenn das Fleisch im Anfange seiner Existenz mit dem Gott-Logos wirklich geeint wurde oder vielmehr in ihm seinen Anfang nahm und die hypostatische Identität mit ihm hatte, wie war es dann möglich, daß es nicht vollkommen alle Weisheit und Gnade besaß? Es ward nicht der Gnade teilhaftig oder hatte aus Gnade an dem, was des Wortes ist, teil, nein, es ist vielmehr kraft der hypostatischen Einigung, wodurch sowohl das Menschliche als das Göttliche dem* einen* Christus eigen war — der nämliche war ja Gott und Mensch zugleich —, Quelle der Gnade und Weisheit und Fülle aller Güter für die Welt geworden.</p><h3>XXIII. KAPITEL. Von der Furcht.</h3><p>Der Name Furcht hat einen doppelten Sinn. Natürlich ist die Furcht, wenn die Seele sich nicht vom Leibe trennen will wegen der ihr ursprünglich vom Schöpfer eingepflanzten natürlichen Zuneigung und Angehörigkeit, derentwegen sie naturgemäß Furcht und Angst hat und den Tod verschmäht. Ihre Definition lautet:* Naturgemäße Furcht ist eine mit Beklommenheit am Sein festhaltende Macht.* Denn, ward vom Schöpfer alles aus dem Nichtsein ins Sein gerufen, so hat es naturgemäß ein Verlangen nach dem Sein und nicht nach dem Nichtsein. Diesem aber eignet von Natur das Streben nach dem, was [das Sein] erhält. Es hatte also auch der menschgewordene Gott-Logos dieses Verlangen, er zeigte zu dem, was die Natur erhält, eine Zuneigung, indem er nach Speise und Trank und Schlaf begehrte und naturgemäß davon Gebrauch machte, gegen das aber, was ihr (═ der Natur) verderblich ist, eine Abneigung, so daß er zur Zeit des Leidens freiwillig die Beklommenheit vor dem Tode durchmachte. Wohl geschah das, was geschah, durch ein Naturgesetz, aber doch nicht wie bei uns auf gezwungene Weise. Denn frei wollend nahm er das Natürliche an. Darum gehört das Zagen, die Furcht und Angst zu den natürlichen, untadelhaften und keiner Sünde unterliegenden Affekten.</p><p>Es gibt ferner eine Furcht, die aus Ratlosigkeit, Mißtrauen und Unkenntnis der Todesstunde entspringt, so wenn wir uns nachts fürchten, wenn ein Geräusch entsteht. Diese ist widernatürlich, und wir definieren sie so:* Widernatürliche Furcht ist eine unvorhergesehene Beklommenheit.* Diese* hat der Herr nicht zugelassen.* Darum fürchtete er sich auch nie außer zur Zeit des Leidens, und wenn er oft gemäß der Heilsordnung sich selbst betrübte. Ihm war ja die Zeit nicht unbekannt.</p><p>Daß er sich aber wirklich gefürchtet, sagt der heilige Athanasius in seiner Abhandlung gegen Apollinaris: „Darum sprach der Herr: Jetzt ist meine Seele erschüttert. Das ‚Jetzt‘ aber heißt: Als er wollte. Gleichwohl zeigte er an, was wirklich der Fall war. Denn er bezeichnete nicht das Nichtwirkliche als wirklich, als ob das, was [von ihm] gesagt würde, nur zum Schein geschähe. Denn in Wirklichkeit und Wahrheit geschah alles.“ Und später: „Keineswegs läßt die Gottheit ein Leiden zu ohne einen leidenden Körper, noch zeigt sie Erschütterung und Trauer ohne eine betrübte und erschütterte Seele, noch ängstigt sie sich und betet ohne einen sich ängstigenden und betenden Geist. Nein. Denn wenn auch das, was geschah, nicht durch ein Erliegen seiner Natur eintrat, so geschah es doch zum Beweise dessen, was er wirklich war.“ Daß aber das, was geschah, nicht durch ein Erliegen seiner Natur eintrat, beweist der Umstand, daß er dies nicht unfreiwillig litt.</p><h3>XXIV. KAPITEL. Vom Gebet des Herrn.</h3><p>Gebet ist ein Aufstieg des Geistes zu Gott oder eine Bitte an Gott ums Zukömmliche. Wie war es also möglich, daß der Herr bei Lazarus und zur Zeit des Leidens betete? Denn seine heilige Vernunft* (νοῦς)* [nous], die doch ein für allemal hypostatisch mit dem Gott-Logos geeint war, bedurfte weder eines Aufstieges zu Gott noch einer Bitte an Gott. Christus ist ja einer. Nein, [er betete,] weil er unsere Stelle vertrat, das Unsrige in sich nachbildete, uns ein Muster wurde, uns lehrte, Gott zu bitten und uns zu ihm zu erheben, und durch seine heilige Vernunft uns den Weg zum Aufstieg zu Gott bahnte. Denn wie er die Affekte auf sich nahm, um uns den Sieg über sie zu geben, so betete er auch, wie gesagt, um uns den Weg zum Aufstieg zu Gott zu bahnen und „für uns alles, was recht ist, zu tun “, wie er zu Johannes sagte, und seinen Vater mit uns zu versöhnen und diesen als Grund und Prinzip zu ehren und zu zeigen, daß er kein Gottesfeind ist. Denn als er im Falle Lazarus sagte: „Vater, ich danke dir, daß du mich erhört hast. Ich wußte, daß du mich allezeit erhörest, aber wegen der Menge, die hier steht, habe ich es gesagt, damit sie erkennen, da du mich gesandt hast “, ist da nicht für alle ganz klar, daß er dieses sagte, um seinen Vater als sein Prinzip zu ehren und zu zeigen, daß er kein Gottesfeind ist?</p><p>Als er aber sagte: „Vater, wenn es möglich ist, so laß diesen Kelch an mir vorübergehen. Doch nicht wie ich will, sondern wie du willst “, ist es da nicht jedem klar, daß er uns lehrt, in den Prüfungen von Gott allein die Hilfe zu erflehen und den göttlichen Willen dem unsrigen vorzuziehen, und zeigt, daß er sich wirklich unsere Natur angeeignet und daß er in Wahrheit zwei natürliche, seinen Naturen entsprechende, aber nicht entgegengesetzte Willen besaß? „Vater,“ sprach er als wesensgleich, „wenn es möglich ist.“ Nicht als ob er es nicht wußte — was wäre auch Gott unmöglich? — sondern um uns zu unterweisen, den göttlichen Willen dem unsrigen vorzuziehen. Denn nur das ist unmöglich, was Gott nicht will und nicht zuläßt. „Doch nicht wie ich will, sondern wie du willst.“ Als Gott ist er zwar gleichen Willens mit dem Vater. Als Mensch aber zeigt er naturgemäß den Willen der Menschheit. Dieser verschmäht naturgemäß den Tod.</p><p>Das Wort aber: „Mein Gott, mein Gott, warum hast du mich verlassen? “, sprach er, weil er unsere Stelle vertrat. Denn der Vater ist nur dann sein Gott, wenn er (═ Christus) uns gleichgestellt ist, wobei man durch feine Verstandesvorstellungen das Sichtbare vom Geistigen sondert. Außerdem ward er nie von seiner eigenen Gottheit verlassen, sondern* wir* waren die Verlassenen und Verachteten. Daher betete er dieses, weil er unsere Stelle vertrat.</p><h3>XXV. KAPITEL. Von der Aneignung.</h3><p>Man muß wissen, daß es zwei Aneignungen gibt: eine natürliche und wesenhafte, eine persönliche und relative. Natürlich und wesenhaft ist die, nach der der Herr aus Menschenliebe unsere Natur und alles Natürliche angenommen, indem er von Natur und in Wahrheit Mensch geworden und das Natürliche an sich erfahren. Persönlich und relativ aber ist sie, wenn jemand auf Grund einer Beziehung (Relation), ich meine aus Mitleid oder Liebe, die Person eines andern vertritt und an seiner Statt für ihn die Worte redet, die ihm selber in keiner Hinsicht zukommen. Dieser [Aneignung] gemäß hat er (═ Christus) sich unsern Fluch und unsere Verlassenheit und anderes von der Art, was nicht natürlich ist, angeeignet, nicht sofern er selber das gewesen oder geworden wäre, sondern sofern er unsere Rolle annahm und sich uns gleichstellte. Solchen Sinn hat auch das Wort: „Da er für uns zum Fluche geworden.“</p><h3>XXVI. KAPITEL. Vom körperlichen Leiden des Herrn und der Leidenslosigkeit seiner Gottheit.</h3><p>Das Wort Gottes selbst litt alles im Fleische, während seine göttliche, allein leidenslose Natur leidenslos blieb. Denn da der eine, aus Gottheit und Menschheit zusammengesetzte, in Gottheit und Menschheit existierende Christus litt, so litt der leidensfähige, von Natur aus zum Leiden geeignete Teil, der leidenslose aber litt nicht mit. Die Seele ist leidensfähig. Darum leidet und duldet sie, wenn der Leib geschnitten wird, mit dem Leibe mit, obwohl sie selbst nicht geschnitten wird. Die Gottheit aber ist leidenslos, darum litt sie nicht mit dem Leibe mit.</p><p>Wohlgemerkt, wir sagen zwar: Gott litt im Fleische, keineswegs aber: Die Gottheit litt im Fleische oder Gott litt durch das Fleisch. Bescheint die Sonne den Baum, wenn die Axt ihn behaut, so bleibt die Sonne unbehauen und leidenslos. Um wieviel mehr bleibt die leidenslose, mit dem Fleische hypostatisch geeinte Gottheit des Wortes leidenslos, wenn das Fleisch leidet? Gießt man auf ein feurig gemachtes Eisen Wasser, so löscht das, was geeignet ist, vom Wasser etwas zu erleiden, nämlich das Feuer, aus, das Eisen aber bleibt unversehrt. Es ist ja von Natur aus nicht geeignet, vom Wasser zerstört zu werden. Um wieviel weniger ließ beim Leiden des Fleisches die allein leidenslose Gottheit das Leiden zu, obwohl sie von ihm (═ dem Fleische) nicht getrennt war. Es ist nicht notwendig, daß sich die Beispiele vollkommen und restlos decken. Man muß doch in den Beispielen sowohl die Ähnlichkeit wie die Verschiedenheit sehen, sonst wäre es kein Beispiel. Denn das in allem Gleiche wäre ja das nämliche und kein Gleichnis, und besonders [gilt das] beim Göttlichen. Es ist ja unmöglich, ein in allem gleiches Beispiel zu finden, mag es sich um die Gotteslehre oder die Heilsveranstaltung handeln.</p><h3>XXVII. KAPITEL. Die Gottheit des Wortes war auch heim Tode des Herrn von der Seele und dem Leibe nicht getrennt und blieb eine Hypostase.</h3><p>Unser Herr Jesus Christus war sündenlos. Denn „es hat keine Sünde getan, der die Sünde der Welt hinwegnimmt, und in seinem Munde ward kein Trug gefunden “. Darum war er dem Tode nicht unterworfen, wenn anders durch die Sünde der Tod in die Welt gekommen ist. Er stirbt also, weil er für uns den Tod auf sich nimmt, und er bringt sich selbst dem Vater als Opfer für uns dar. Denn gegen ihn haben wir gesündigt, und es war nötig, daß er das Lösegeld für uns entrichtete und wir so von der Verdammung erlöst wurden. Denn das Blut des Herrn ward gewiß nicht dem Tyrannen dargebracht. Es kommt also der Tod heran und verschlingt den Köder des Leibes, wird aber vom Haken der Gottheit durchbohrt. Und nachdem er den sündenlosen und lebendigmachenden Leib gekostet, geht er zugrunde und gibt alle wieder von sich, die er zuvor verschlungen. Denn wie die Finsternis schwindet, wenn das Licht erscheint, so weicht das Verderben, wenn das Leben auftritt, und allen wird Leben zuteil, Verderben aber dem Verderber.</p><p>Wenn er also auch wie ein Mensch gestorben ist und seine heilige Seele von dem unbefleckten Leibe sich getrennt hat, so ward doch die Gottheit von beiden, der Seele und dem Leibe nämlich, nicht getrennt, es ward auch so die eine Hypostase nicht in zwei Hypostasen geschieden. Denn der Leib und die Seele hatten zugleich von Anfang an in der Hypostase des Wortes ihre Existenz, und obwohl im Tode voneinander getrennt, blieb ein jedes davon in der* einen* Hypostase des Wortes. Daher war die eine Hypostase des Wortes Hypostase sowohl des Wortes als der Seele und des Leibes. Denn nie besaß die Seele oder der Leib außer der Hypostase des Wortes eine eigene Hypostase, die Hypostase des Wortes aber ist stets eine und nie zwei, daher ist die Hypostase Christi immer eine. Denn wenn die Seele auch örtlich vom Leibe getrennt war, so war sie doch hypostatisch durch das Wort vereint.</p><h3>XXVIII. KAPITEL. Von der Vergänglichkeit und Vernichtung.</h3><p>Der Name Vergänglichkeit bedeutet zweierlei: Er bedeutet* folgende menschliche Leiden: Hunger, Durst, Ermüdung,* das Durchbohren mit Nägeln, Tod oder Trennung der Seele vom Leibe und dergleichen. Nach dieser Bedeutung nennen wir den Leib des Herrn vergänglich. Denn all das nahm er freiwillig an. Es bedeutet aber* die Vergänglichkeit (φθορά)* [phthora] auch* die völlige Auflösung des Leibes in die Elemente, aus denen er zusammengesetzt ist,* seine Vernichtung* (ἀφανισμός)* [aphanismos], die von vielen lieber* διαφθορά* [diaphthora] genannt wird. Diese erfuhr der Leib des Herrn nicht, wie der Prophet David sagt: „Denn nicht lässest du mich in die Unterwelt sinken, noch deinen Heiligen (Verehrer) Vernichtung erfahren.“</p><p>Darum ist es gottlos, nach der ersten Bedeutung von Vergänglichkeit den Leib des Herrn vor der Auferstehung unvergänglich zu nennen, wie der unsinnige Julian und Gajanus lehrten. Denn war er unvergänglich, dann war er uns nicht wesensgleich, sondern nur scheinbar und nicht wirklich geschah, was das Evangelium von seinem Hunger, seinem Durst, den Nägeln, der Seitenwunde, dem Tod erzählt. Geschah es aber nur scheinbar, dann ist das Geheimnis der Heilsveranstaltung Täuschung und Theater, dann ist er scheinbar und nicht wirklich Mensch geworden, dann sind wir nur scheinbar und nicht wirklich gerettet. Doch fort damit! Die dies behaupten, sollen am Heile nicht teil haben. Wir haben das wahre Heil erlangt und werden es erlangen. — Nach der zweiten Bedeutung von Vergänglichkeit aber bekennen wir, daß der Leib des Herrn unvergänglich und unverweslich ist, wie uns die gotterfüllten Väter überliefert haben. Nach der Auferstehung des Heilands von den Toten jedoch erklären wir auch nach der ersten Bedeutung den Leib des Herrn für unvergänglich. Denn auch unserem Leib hat der Herr durch seinen Leib die Auferstehung und die darauffolgende Unvergänglichkeit geschenkt, da er für uns der Erstling der Auferstehung, der Unvergänglichkeit und der Leidenslosigkeit geworden ist. „Es muß nämlich dieses Vergängliche die Unvergänglichkeit anziehen “, sagt der Apostel.</p><h3>XXIX. KAPITEL. Von der Höllenfahrt.</h3><p>[Forts. von ] Die vergottete Seele ist abgestiegen zu der Hölle (in die Unterwelt). Wie den Irdischen „die Sonne der Gerechtigkeit “ aufging, so sollte auch den Unterirdischen, „in Finsternis und Todesschatten Sitzenden “ das Licht aufleuchten. Den Irdischen hat er den Frieden, den Gefangenen die Entlassung, den Blinden das Gesicht verkündet, den Gläubigen ewiges Heil begründet und die Ungläubigen ihres Unglaubens überführt. Dasselbe sollte auch den Unterirdischen widerfahren, „damit sich ihm jedes Knie der Himmlischen, Irdischen und Unterirdischen beuge.“ Und so erlöste er die seit Weltaltern Gefesselten, erstand wieder von den Toten und bahnte uns den Weg zur Auferstehung.</p>
