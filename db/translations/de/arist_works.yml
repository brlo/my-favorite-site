    body: |-
      <p><em>Apologie, übersetzt von Dr. Kaspar Julius (Bibliothek der Kirchenväter, 1. Reihe, Bd. 12, München 1913).</em></p><p>An den Imperator Caesar Titus (Aelius) Hadrianus Antoninus Augustus Pius der Philosoph Marcianus Aristides aus Athen</p>
      <h2>1</h2><p>1. Ich bin, o Kaiser, durch Gottes Vorsehung auf die Welt gekommen. Und als ich den Himmel betrachtete und Erde und Meer, und Sonne und Mond [erblickte] und die übrigen Schöpfungswerke, da erstaunte ich über dieses Weltgebäude. 2. Ich begriff aber, daß sich die Welt und alles darin (nur) aus Zwang [seitens eines andern] bewegt, und ich sah ein, daß derjenige, der sie bewegt und erhält, Gott ist, [der darin verhüllt und dadurch verborgen ist]; auch ist klar, daß das Bewegende stärker ist als das Bewegte, und das Erhaltende stärker als das Erhaltene. Aber nachzugrübeln über den Beweger des Alls, wie beschaffen er (nämlich) ist - denn soviel ist mir ersichtlich: er ist ja seiner Natur nach unbegreiflich - und zu handeln über die Festigkeit seiner Weltordnung, um sie ganz zu begreifen, bringt mir keinen Gewinn, kann sie ja doch niemand vollkommen begreifen. 3. Ich behaupte aber von dem Weltbeweger, daß er der Gott des Alls ist, der alles um des Menschen willen gemacht hat; und mir scheint das (allein) von Wert zu sein, daß man Gott verehre und den (Mit-) Menschen nicht kränke. 4. Ich behaupte aber, daß Gott ungezeugt ist und ungemacht, von niemand umfaßt wird, selbst aber alles umfaßt, (daß er ist) eine durch sich seiende Form, anfangslos und endlos, unvergänglich, unsterblich, vollkommen und unbegreiflich. Wenn ich sagte: vollkommen, so heißt das, daß er keinen Mangel hat und nichts bedarf, während alles seiner bedarf; und wenn ich sagte, daß er anfangslos ist, so heißt das, daß alles, was einen Anfang hat, auch ein Ende hat, und alles, was ein Ende hat, auflösbar ist.</p><p>5. Er hat keinen Namen; denn alles, was einen Namen hat, gehört mit zum Geschaffenen. Er hat keine Gestalt und keine Zusammensetzung von Gliedern; denn wer solches hat, gehört mit zu den Gebilden. Er ist nicht männlich und nicht weiblich. Der Himmel umfaßt ihn nicht, vielmehr wird der Himmel und alles Sichtbare und Unsichtbare von ihm umfaßt. 6. Er hat keinen Gegner; denn es gibt niemand, der stärker wäre als er. Er hat nicht Grimm und Zorn; denn es gibt nichts, das ihm widerstehen könnte. Irrtum und Vergeßlichkeit liegt nicht in seiner Natur; denn er ist ganz und gar Weisheit und Einsicht und durch ihn besteht alles, [was besteht]. Er heischt nicht Schlacht- und Trankopfer, noch eines von den sichtbaren Dingen; [von niemand heischt er etwas,] aber alle Lebewesen heischen von ihm.</p>
      <h2>2</h2><p>1. Da also [von uns zu Euch] über Gott ist gesprochen worden, soweit ich über ihn zu sprechen vermochte, wollen wir nun zum Menschengeschlecht kommen, um zu sehen, welche hiervon an der Wahrheit teilhaben, von der wir gesprochen, und welche am Irrtum. Es ist uns offenbar, o Kaiser, daß es auf der Welt vier Gattungen von Menschen gibt: Barbaren und Griechen, Juden und Christen. 3. Die Barbaren nun leiten ihre Abkunft von Kronos und Rhea und ihren übrigen Göttern her, 4. die Griechen dagegen von Hellen, der von Zeus abstammen soll; von Hellen stammt dann Aiolos und Xuthos, das übrige Hellas aber von Inachos und Phoroneus, zuletzt von dem Ägypter Danaos, dem Sidonier Kadmos und dem Thebaner Dionysos. 5. Die Juden aber leiten ihre Abkunft von Abraham her, der Isaak zeugte, von dem dann Jakob gezeugt wurde, der selbst zwölf Söhne zeugte. Diese übersiedelten von Syrien nach Ägypten. Dort wurden sie von ihrem Gesetzgeber das Hebräervolk genannt; später erhielten sie den Namen Juden.</p><p>6. Die Christen nun leiten ihre Abkunft von Jesus Christus her. Dieser wird der Sohn des höchsten Gottes genannt, und es heißt (von ihm), daß er (als) Gott vom Himmel niederstieg und von einer hebräischen Jungfrau Fleisch nahm und anzog, und (daß so) in einer Menschentochter der Sohn Gottes Wohnung nahm. Dies wird gelehrt von dem Evangelium, das - so heißt es bei ihnen - (erst) vor kurzem gepredigt worden ist, (und) dessen Sinn auch Ihr, wenn Ihr darin leset, erfassen werdet, 8. Dieser Jesus also entstammt dem Geschlechte der Hebräer. Er hatte aber zwölf Jünger, damit sein wunderbares Heilswerk vollendet würde. Derselbe wurde von den Juden durchbohrt [und starb und wurde begraben], und es heißt (von ihm), daß er nach drei Tagen wieder auflebte und in den Himmel erhoben wurde. Und dann zogen diese zwölf Jünger aus in die bekannten Gegenden der Welt und lehrten seine Majestät in aller Milde und Ehrbarkeit. Deshalb werden auch diejenigen, die heute an jene Predigt glauben, Christen genannt, wie sie allbekannt sind.</p><p>9. Es gibt also, wie ich vorhin sagte, vier Gattungen von Menschen: Barbaren und Griechen, Juden und Christen.</p><p>[10. Gott also dient der Hauch, den Engeln das Feuer, den Dämonen das Wasser und den Menschen die Erde.]</p>
      <h2>3</h2><p>1. Wollen wir nun mit den Barbaren beginnen und nach und nach zu den übrigen Völkern kommen, damit wir [ein]sehen, welche von ihnen die Wahrheit über Gott besitzen und welche [von ihnen] den Irrtum. 2. Die Barbaren also, die Gott nicht kennen, gingen den Elementen nach in die Irre und begannen das Geschöpf an Stelle seines Schöpfers zu verehren, und [deshalb] machten [sie] Bilder davon und schlossen sie in Tempel ein. Und nun beten sie dieselben an, sie Götter nennend, und behüten sie gar sorgfältig, damit sie nicht von Räubern gestohlen werden. Und nicht sahen die Barbaren ein, daß alles Behütende größer ist als das Behütete und [je]der Schaffende größer als das Geschaffene. Sind nun ihre Götter zu ihrer eigenen Rettung zu ohnmächtig, wie sollen sie dann den Menschen Rettung bringen? Einen großen Irrtum haben also die Barbaren begangen, indem sie tote und [für sie] nutzlose Bildsäulen anbeteten.</p><p>3. Und Staunen überkommt mich, o Kaiser, ob ihrer Philosophen, daß auch sie so irregingen und den Namen Götter Bildern gaben, die zu Ehren der Elemente gefertigt worden, und (daß) die Weisen gar nicht einsahen, daß auch jene Elemente vergänglich und auflöslich sind. Denn wenn (nur) ein kleiner Teil von einem Element sich auflöst oder vergeht, so löst es sich ganz auf und vergeht (ganz). Sind nun jene Elemente auflöslich und vergänglich und müssen sie sich aus Zwang einem andern fügen, das fester ist als sie, und sind sie nicht ihrer Natur nach Götter, wie mögen sie die (nur) ihnen zu Ehren gemachten Bilder Götter nennen? 4. Groß ist also der Irrtum, den ihre Philosophen über ihre Anhänger gebracht haben.</p>
      <h2>4</h2><p>1. Wenden wir uns jetzt, o Kaiser, den (einzelnen) Elementen selbst zu, um von ihnen zu beweisen, daß sie keine Götter sind, sondern vergängliche und veränderliche Kreatur, die dem Menschen nachgebildet ist. Gott aber ist unvergänglich, unveränderlich und unsichtbar, während er selbst alles sieht, wandelt und ändert.</p><p>2. Die nun glauben, die Erde sei Gott, sind [schon] im Irrtum. Wird sie doch von den Menschen mißhandelt und dienstbar gemacht, wird aufgegraben, durchwühlt und durchfurcht, und nimmt den kotigen Unflat von Menschen, wilden und zahmen Tieren auf. Zeitweise wird sie auch nutzlos; wird sie nämlich gebrannt, so wird sie tot, denn aus einer Scherbe wächst nichts. Wird sie ferner übermäßig benetzt, so verdirbt sie samt ihren Früchten. Ja sie wird von Menschen und Vieh zertreten und nimmt die blutige Unreinigkeit Ermordeter auf, sie wird aufgegraben und mit Toten angefüllt und wird (so) zum Leichenbehälter. 3. Es ist (nun) unmöglich, daß jene heilige, ehrwürdige, selige und unvergängliche Natur Gottes derartiges (in sich) aufnehme. Und eben daraus ist uns ersichtlich, daß die Erde nicht Gott, sondern eine Schöpfung Gottes ist.</p>
      <h2>5</h2><p>1. In gleicher Weise haben ferner die geirrt, die vom Wasser annehmen, daß es Gott sei. Denn das Wasser ist zum Gehrauch des Menschen geschaffen und ihm auf vielfache Weise dienstbar gemacht. Es verändert sich nämlich, nimmt Schmutz an, verdirbt und verliert seine Natur, indem es mit vielerlei Dingen gekocht wird und ihm nicht eigene Farben annimmt. Auch erstarrt es bei Frost und wird mit dem Kot von Menschen und Vieh und mit dem Blute Ermordeter besudelt und vermischt. 2. Von den Handwerkern wird es gezwungen, durch die Enge der Kanäle zu fließen und muß sich wider Willen in die Gärten leiten lassen und an andere Orte, um den Mist der Menschen hinauszuspülen, allen Schmutz abzuwaschen und das Bedürfnis der Menschen daran zu befriedigen. Deshalb kann das Wasser unmöglich Gott sein; es ist vielmehr ein Werk Gottes und ein Teil der Welt.</p><p>3. So haben auch die nicht wenig geirrt, die vom Feuer annehmen, daß es Gott sei; denn auch das ist zum Gebrauch der Menschen geschaffen und auf vielfache Weise ihnen dienstbar gemacht, (wie) zur Bereitung der Speisen, zur Verfertigung von Schmucksachen u. s. w., womit Eure Majestät vertraut ist; dabei wird dasselbe auf vielfache Weise ausgelöscht und vernichtet.</p><p>4. Weiterhin sind auch die im Irrtum, die vom Wehen der Winde annehmen, es sei Gott. Für uns ist klar, daß die Winde einem andern dienstbar sind, da ihr Wehen bald zu-, bald abnimmt und aufhört auf Geheiß dessen, der sie dienstbar macht. Um des Menschen willen sind sie ja von Gott geschaffen worden, um das Bedürfnis der Bäume, Früchte und Samen zu befriedigen und die Schiffe auf dem Meere fortzutreiben, die für die Menschen den Bedarf an Waren von da, wo diese vorrätig sind, dorthin schaffen, wo sie nicht vorrätig sind, und (so) die Gegenden der Welt zu versorgen. 5. Nimmt ebendieses (Wehen) zeitweise zu und ab, so bringt es an dem einen Ort Gewinn und an dem andern Schaden je nach dem Wink des Lenkenden. Auch können es die Menschen mittels bestimmter Geräte einfangen und einschließen, damit es die Forderung erfüllt, die sie an es stellen. Aber über sich selbst hat es keinerlei Macht, und deshalb kann man die Winde unmöglich Götter nennen, sondern (nur) ein Werk Gottes.</p>
      <h2>6</h2><p>1. So sind auch die im Irrtum, die von der Sonne annehmen, daß sie Gott sei. Denn wir sehen, wie sie sich aus Zwang [seitens eines andern] bewegt und dreht und läuft und von einem (Tierkreis-) Zeichen zum andern wandelt, indem sie täglich auf- und untergeht, um die Sprossen der Pflanzen und Gewächse zu erwärmen und an der mit ihr (dem Licht) vermischten Luft alles junge Grün auf Erden sprießen zu lassen. 2. Und dieselbe hat [in der Berechnung] teil mit den übrigen Sternen auf ihrem Laufe. Und während sie ihrer Natur nach eine ist, ist sie, entsprechend dem Nutzen, den ihr Gebrauch den Menschen bringt, vielen Teilen beigemischt, und (zwar) nicht nach eigenem Willen, sondern nach dem Willen dessen, der sie lenkt. Deshalb ist die Sonne unmöglich Gott, sondern Gottes Werk. Und in gleicher Weise auch (nicht) der Mond und die Sterne.</p>
      <h2>7</h2><p>1. Die aber von dem Menschen annehmen, daß er Gott sei, sind [sehr] im Irrtum. Wie auch du, o Kaiser, weißt, besteht der Mensch aus den vier Elementen und aus Seele und Geist; deshalb wird er auch Welt genannt; und ohne einen dieser Teile besteht er nicht, Er hat Anfang und Ende, wird geboren und vergeht. Gott aber hat, wie ich sagte, nichts von (alle-) dem in seiner Natur, sondern ist ungemacht und unvergänglich. 2. Deshalb können wir auch unmöglich dem Menschen göttliche Natur beilegen, (ihm,) den zeitweise, wenn er Freude erwartet, Leid trifft, und wenn (er) Lachen (erwartet), Weinen überkommt, 3. (ihm), der jähzornig ist und eifersüchtig und neidisch und reuig und mit den übrigen Fehlern (behaftet) Auch wird er auf vielfache Weise vernichtet, von den Elementen und von den Tieren.</p><p>4. Daher geziemt es uns, o Kaiser, den Irrtum der Barbaren einzusehen. Dadurch, daß sie nach dem wahren Gott nicht forschten, irrten sie von der Wahrheit ab und gingen der Lust ihres Sinnes nach, indem sie auflösliche Elemente und tote Bildsäulen verehrten. Und ob ihres Irrtums merkten sie nicht, was der wahre Gott ist.</p>
      <h2>8</h2><p>1. Kommen wir jetzt auch wieder zu den Griechen, um zu sehen, was sie für eine Anschauung von [dem wahren] Gott haben. 2. Da nun die Griechen weiser sind als die Barbaren, haben sie mehr als die Barbaren geirrt, indem sie viele erdichtete Götter, teils männliche, teils weibliche einführten, so daß unter ihren Göttern welche erfunden wurden als Ehebrecher und Mörder, als eifersüchtig und neidisch, als zornig und hitzig, als Vater- und Brudermörder, als Diebe und Räuber. 3. Und gewisse, sagen sie, waren hinkend und krüppelhaft, andere Zauberer, manche rasten, andere spielten Zither, einige streiften auf den Bergen umher, etliche starben (eines natürlichen Todes), andere wurden vom Blitz erschlagen, welche wurden sogar Menschen dienstbar, einige flohen, andere wurden von Menschen gestohlen, gewisse gar [von Menschen] beweint und beklagt. Einige sollen zum Hades hinabgestiegen, andere durchbohrt worden sein. 4. Gewisse verwandelten sich in Tiergestalt, um mit dem Geschlecht sterblicher Weiber Ehebruch zu treiben; einige mußten sich wegen Beilagers mit Männlichen schmähen lassen. Von andern heißt es, daß sie mit ihren Müttern, Schwestern und Töchtern verheiratet waren. Auch behaupten sie von ihren Göttern, daß sie mit Menschentöchtern Ehebruch trieben und von diesen ein gewisses Geschlecht geboren wurde, das selbst auch sterblich war. Und von einigen (Göttinnen) behaupten sie, daß sie wegen (ihrer) Schönheit (miteinander) in Streit gerieten und vor Menschen zu Gericht erschienen.</p><p>5. Gottloses, lächerliches und albernes Gerede, o Kaiser, haben also die Griechen über ihre Götter und über sich selbst aufgebracht, wenn sie solche Götter nannten, die keine sind. 6. Und daher nahmen die Menschen jeweils Anlaß, Ehebruch und Unzucht zu treiben, zu rauben und alles Böse, Häßliche und Scheußliche zu verüben. Denn wenn ihre sogenannten Götter all das oben Beschriebene verübt haben, um wieviel mehr werden es die Menschen tun, die an eben die glauben, die solches verübten. Ja infolge dieses gottlosen Irrtums kamen über die Menschen langwierige Kriege, große Hungersnöte, bittere Gefangenschaft und vollständige Entblößung. Ja sie müssen dulden, und all das bricht einzig aus diesem Grunde über sie herein. Und während sie’s erdulden, merken sie nicht in ihrem Sinn, daß ihnen dies ob ihres Irrtums widerfährt.</p>
      <h2>9</h2><p>1. Wollen wir jetzt zu ihrer Göttergeschichte kommen, um alles oben Gesagte genau zu erweisen. 2. Vor allem führen die Griechen als Gott den Kronos ein [der mit Kêvan übersetzt wird]. Seine Verehrer opfern ihm ihre Kinder, wobei manche sie lebendig verbrennen. 3. Man erzählt, daß er sich Rhea zum Weibe nahm und von ihr viele Kinder zeugte. Von derselben erzeugte er auch den [Dios, der genannt wird] Zeus. Er wurde später wahnsinnig und begann aus Furcht vor einer ihm gewordenen Weissagung seine Kinder zu verschlingen. 4. Ihm wurde Zeus entwendet, ohne daß er es merkte. Denselben fesselte schließlich Zeus, schnitt ihm die Geschlechtsteile ab und warf sie ins Meer, woraus nach der Sage Aphrodite, geboren ward [die Astera heißt], und schleuderte Kronos gefesselt in den Tartaros. 5. Groß ist also der Irrtum und der Spott, den die Griechen über den Ahnherrn ihrer Götter aufgebracht haben, indem sie all das von ihm erzählen, o Kaiser. Unmöglich kann ein Gott gefesselt oder verstümmelt sein, sonst ist er schon sehr elend.</p><p>6. Nach Kronos führen sie einen andern Gott, den Zeus, ein und behaupten von ihm, daß er die Herrschaft erhalten habe und König [all] der Götter geworden sei. Und sie sagen von ihm, daß er sich in ein Rind und anderes verwandelte, um mit sterblichen Weibern Ehebruch zu treiben und sich von ihnen Kinder zu erwecken. 7. So soll er sich einmal in einen Stier verwandelt haben aus Liebe zu Europe und Pasiphaë. Ferner verwandelte er sich in die Gestalt des Goldes aus Liebe zu Danaë, in einen Schwan aus Liebe zu Leda, in einen Satyr aus Liebe zu Antiope, in einen Blitz aus Liebe zu Semele, so daß er von diesen viele Kinder zeugte Von Antiope nämlich soll er den Zethos und Amphion gezeugt haben, von Semele den Dionysos, von Alkmene den Herakles, von Leto den Apollon und die Artemis, von Danaë den Perseus, von Leda den Kastor und Polydeukes und die Helena. Von Mnemosyne zeugte er neun Töchter, die sogenannten Musen, und von Europe den Minos, Radamanthys und Sarpedon. Zuletzt verwandelte er sich in die Gestalt eines Adlers aus Liebe zum Hirten Ganymedes.</p><p>8. Infolge dieser Geschichten, o Kaiser, hat bei den Menschen der Gegenwart eine große Lasterhaftigkeit eingerissen, da sie ihren Göttern nachahmen und sich mit ihren Müttern und Schwestern und durch Beilager mit Männlichen beflecken, ja einige sogar ihre Eltern zu ermorden wagen. Denn wenn derjenige, der das Haupt und der König ihrer Götter heißt, solches verübte, um wieviel mehr werden seine Anbeter ihm nachahmen? 9. Ja groß ist der Irrwahn, den die Griechen in ihrer Sage von ihm aufgebracht haben. Denn ein Gott kann unmöglich Ehebruch oder Unzucht treiben oder sich zum Beilager mit Männlichen hergeben oder seine Eltern ermorden, sonst ist er schlimmer als ein verderblicher Dämon.</p>
      <h2>10</h2><p>1. Ferner führen sie einen andern Gott, den Hephaistos, ein und behaupten von ihm, er sei hinkend, trage eine Kappe auf dem Kopf, halte eine Zange und einen Hammer in der Hand und übe das Schmiedehandwerk aus, um sich dadurch seinen Bedarf an Nahrung zu beschaffen. 2. Ja bedarf denn dieser Gott all dessen? Es ist doch unmöglich, daß ein Gott bedürftig sei oder hinkend, sonst ist er schon sehr ohnmächtig.</p><p>3. Und weiter führen sie einen andern Gott ein, [und nennen ihn] Hermes, und behaupten, er sei ein habgieriger, diebischer und gewinnsüchtiger Mann, ein Zauberer, Krüppel (?), Ringer und Ausleger von Reden. 4. Unmöglich kann (aber) ein Gott ein Magier oder ein Geizhals oder ein Krüppel (?) oder nach fremdem Gut begierig oder ein Ringer sein, sonst gilt er als nichtsnutzig.</p><p>5. Und nach diesem führen sie einen andern Gott, den Asklepios, ein und behaupten, er sei ein Arzt und bereite Arzneien und kunstgerechte Pflaster, um seinen Bedarf an Nahrung zu decken. Ja ist denn dieser Gott bedürftig? Zuletzt wurde er wegen des Lakedaimoniers Tyndareus von Zeus mit dem Blitz getroffen und starb infolgedessen. 6. Wenn nun Asklepios als Gott vom Blitz getroffen sich selbst nicht helfen konnte, wie sollte er da andern helfen können? Es kann doch unmöglich die göttliche Natur bedürftig sein oder vom Blitz erschlagen werden.</p><p>7. Ferner führen sie einen andern Gott ein, [und nennen ihn] Ares, und behaupten, er sei kampflustig, eifersüchtig und gierig nach Schafen und manch anderem; und er erwerbe sich Besitz mit seinen Waffen. Zuletzt, sagen sie, habe er mit Aphrodite Ehebruch getrieben und sei von dem Knäblein Eros und von Hephaistos, dem Gatten der Aphrodite, gefesselt worden. Unmöglich kann (aber) ein Gott ein Kämpfer, Gefesselter oder Ehebrecher sein. 8. Weiter behaupten sie von Dionysos, daß er ein Gott sei, der nächtliche Feste feiere, die Trunkenheit lehre und fremde Weiber raube. Zuletzt, heißt es, sei er rasend geworden, habe seine Dienerinnen verlassen und sei in die Wildnis geflohen. In seiner Raserei habe er dann Schlangen verzehrt und sei schließlich von den Titanen ermordet worden. War nun Dionysos ein Gott und konnte er, da er ermordet wurde, sich selbst nicht helfen, wie könnte er andern helfen?</p><p>9. Ferner führen sie den Herakles ein und behaupten von ihm, daß er ein Gott sei, der Häßliches haßt, gewalttätig ist und kampflustig und die Bösewichte tötet. Auch von ihm behaupten sie, daß er zuletzt rasend wurde, seine Kinder umbrachte, sich ins Feuer stürzte und so den Tod fand. Wenn nun Herakles ein Gott ist und all diese Übel für sich nicht überstehen konnte, wie mochten ihn da andere um Hilfe bitten? Es ist doch unmöglich, daß ein Gott ein Rasender oder Trunkenbold sei oder seine Kinder umbringe oder vom Feuer verzehrt werde.</p>
      <h2>11</h2><p>1. Nach diesem führen sie einen andern Gott ein, [und nennen ihn] Apollon, und behaupten von ihm, daß er eifersüchtig sei und wandelbar, und bald Bogen und Köcher, bald Zither und Plektrum (?) halte, und den Menschen wahrsage, um von ihnen Lohn zu empfangen, Ja bedarf denn dieser Gott eines Lohnes? Es ist schmählich, daß man all das bei einem Gotte finden will.</p><p>2. Und nach ihm führen sie die Artemis als Göttin ein, Apollons Schwester, und behaupten, daß sie eine Jägerin sei, Bogen und Pfeile trage und auf den Bergen umherstreife mit (ihren) Hunden, [oder] um Hirsche und Eber zu jagen. Es ist doch schmählich, wenn ein jungfräuliches Mädchen allein auf den Bergen umherstreift und auf (wilde) Tiere Jagd macht. Drum kann Artemis unmöglich eine Göttin sein.</p><p>3. Weiter behaupten sie von Aphrodite, daß sie eine Göttin sei. Bald weile sie bei ihren Göttern, bald treibe sie mit Menschen Ehebruch; bald sei Ares ihr Geliebter gewesen, bald Anchises, bald Adonis [d. i. Tammûz]. Und einmal habe sie über den Tod des Adonis geweint und geklagt und sei zum Hades hinabgestiegen, um Adonis von Persephone, der Gattin des Hades, loszukaufen. Wenn nun Aphrodite eine Göttin ist und ihrem Geliebten in seinem Tod nicht helfen konnte, wie kann sie dann andern helfen? Es ist doch unerhört, daß die göttliche Natur zu Weinen und Klagen und Ehebruch kommt.</p><p>4. Ferner behaupten sie auch von Adonis, daß er ein Gott sei. Er sei ein Jäger und Ehebrecher. Auch soll er durch den Stoß eines Wildschweins gewaltsam getötet worden sein, ohne daß er sich selbst helfen konnte. Und wenn er sich selbst nicht helfen konnte, wie kann er dann für das Menschengeschlecht sorgen? Unmöglich kann ein Gott ein Ehebrecher oder Jäger sein oder eines gewaltsamen Todes sterben. 5. Weiter behaupten sie von Rhea, sie sei die Mutter ihrer Götter und habe einst den Attis zu ihrem Geliebten gehabt und ihre Lust an verstümmelten Männern Zuletzt habe sie eine Totenklage erhoben und ihren Geliebten Attis betrauert. Wenn nun ihre Göttermutter ihrem Geliebten nicht helfen und ihn dem Tod entreißen konnte, wie kann sie dann andern helfen? Es ist also schmählich, wenn eine Göttin klagt und weint und an Verstümmelten ihre Lust hat.</p><p>6. Dann kommen sie noch mit der Kore daher und behaupten, sie sei eine Göttin. Dieselbe wurde von Pluton geraubt, ohne sich selbst helfen zu können. Wenn sie nun eine Göttin ist und sich selbst nicht helfen konnte, wie mag sie andern helfen? Eine Gottheit, die sich rauben läßt, ist schon sehr ohnmächtig. 7. All das haben also die Griechen, o Kaiser, über ihre Götter aufgebracht und [über sie] erdichtet und gesagt, so daß davon die Menschen Anlaß nehmen, alle Frevel und Ausschweifungen zu begehen; und dadurch ist die ganze Erde verderbt worden.</p>
      <h2>12</h2><p>1. Die Ägypter aber, weil einfältiger und unvernünftiger als alle Völker auf Erden, haben ärger denn alle geirrt. Denn nicht genügten ihnen die Heiligtümer der Barbaren und Griechen, sondern sie haben auch solche tierischer Natur eingeführt und von ihnen behauptet, sie seien Götter, sogar gewisse Kriechtiere auf dem Lande und im Wasser. Auch von gewissen Pflanzen und dem jungen Grün haben sie behauptet, daß sie Götter seien, und haben sich geschändet durch allerlei Tollheit und Ausschweifung ärger als alle Völker auf Erden.</p><p>2. Anfangs verehrten sie nämlich die Isis und behaupteten, sie sei eine Göttin, die ihren Bruder Osiris zum Manne hatte. Nach der Ermordung des Osiris durch seinen Bruder (Seth-) Typhon sei Isis mit ihrem Sohn Horus nach Byblos in Syrien geflohen und habe dort eine Zeitlang geweilt, bis ihr Sohn Horus herangewachsen war und (dann) mit seinem Oheim Typhon kämpfte und ihn erschlug. Dann sei Isis heimgekehrt, sei mit ihrem Sohne Horus auf der Suche nach der Leiche ihres Gatten Osiris umhergezogen und habe bitterlich über seinen Tod geklagt. 3. Wenn nun Isis eine Göttin ist und ihrem Bruder und Gatten Osiris nicht helfen konnte, wie kann sie dann andern helfen? Es ist doch unmöglich, daß die göttliche Natur sich fürchte und flüchte, oder weine und klage; sonst ist sie schon sehr elend.</p><p>4. Und von Osiris behaupten sie, daß er ein nutzbringender Gott sei. Er wurde aber von Typhon ermordet, ohne sich selbst helfen zu können; es ist nun klar, daß solches von einer Gottheit nicht ausgesagt werden kann.</p><p>5. Ferner behaupten sie von seinem Bruder Typhon, daß er, der Brudermörder, ein Gott sei, der von seines Bruders Sohn und (jugendlicher) Gemahlin erschlagen wurde, ohne sich selbst helfen zu können. Wie mag denn einer, der sich selbst nicht helfen kann, ein Gott sein?</p><p>6. Die Ägypter aber, weil unverständiger als die übrigen Völker, haben sich nicht mit diesen und ähnlichen Göttern begnügt, sondern haben sogar den Tieren, die doch nur eine (sinnliche) Seele haben, den Namen Götter beigelegt. 7. Denn manche von ihnen beten das Schaf an, einige den Ziegenbock, andere das Kalb, manche das Schwein, andere den Wels, einige das Krokodil, den Falken, die Taube und Weihe, den Geier, Adler und Raben. Manche beten die Katze an, andere den [Fisch] Barsch (?), einige den Hund, manche die (Horn-) Viper, einige die Schildotter, andere den Löwen, wieder andere den Knoblauch, die Zwiebeln und Akazien, andere endlich den Leopard u. dgl. m. 8. Und nicht merken die Elenden bei all diesen Dingen, daß dieselben nichts sind, obgleich sie täglich an ihren Göttern sehen, wie sie von Menschen, ja ihresgleichen verzehrt und vernichtet werden, während manche verbrennen, andere verenden, verwesen und zu Dünger werden. Und nicht sehen sie ein, daß sie auf vielerlei Art zugrunde gehen.</p><p>9. Nicht sahen also die Ägypter ein, daß solche (Wesen) keine Götter sind, die sich selbst keine Rettung bringen können. Sind sie also zu ihrer eigenen Rettung zu ohnmächtig, woher nehmen sie dann die Kraft zur Rettung ihrer Anbeter? Einen größeren Irrtum haben also die Ägypter begangen als alle Völker auf Erden.</p>
      <h2>13</h2><p>1. Staunen aber muß man, o Kaiser, über die Griechen, daß sie, obwohl an Gesittung und Vernunft alle übrigen Völker überragend, toten Götzen und unbeseelten Bildern nach in die Irre gegangen sind, obgleich sie sehen, daß ihre Götter von ihren Verfertigern gesägt, geschlichtet, zugestutzt, abgeschnitten, gebrannt, geformt und in jegliche Gestalt verwandelt werden. 2. Und wenn sie alt werden und mit [der Länge] der Zeit vergehen, und (um)gegossen und zerschlagen werden, wie mochten sie denn darüber nicht zur Einsicht kommen, daß sie keine Götter sind? Und wie können diejenigen, die ihre eigene Rettung nicht vermögen, für die Menschen Sorge tragen?</p><p>3. Vollends haben ihre Dichter und Philosophen irrtümlicherweise von ihnen aufgebracht, daß sie Götter seien. Die so Verfertigten (würden ja nur) zu Ehren des allmächtigen Gottes (verfertigt), und irrtümlicherweise wollen sie, daß sie Gott gleichen, von dem nie jemand gesehen, wem er gleicht, ja den (überhaupt) niemand sehen kann 4. Und dabei bringen sie über die Gottheit auf, als fände sich in ihr ein Mangel, indem sie (nämlich) behaupten, sie nehme Schlachtopfer an und fordere Brand- und Trankopfer, Menschenmorde und Tempel, indes Gott bedürfnislos ist und ihm von alledem nichts Not tut. Es ist klar, daß die Menschen in dem irren, was sie sinnen.</p><p>5. Aber ihre Dichter und Philosophen bringen auf und behaupten, daß die Natur all ihrer Götter eine sei, ohne einzusehen, daß Gott. unser Herr, während er einer ist, in allem ist. Sie irren also; denn wenn am menschlichen Körper, obwohl er vielteilig ist, kein Glied das andere fürchtet, sondern, obgleich der Körper zusammengesetzt ist, ein jedes (Glied) mit dem andern übereinstimmt, so kommt nun auch Gott, der seiner Natur nach einer ist, <strong>eine </strong>Wesenheit zu, indem er in seiner Natur und Wesenheit übereinstimmt und sich nicht vor sich selbst fürchtet. Wenn also die Natur der Götter eine ist, so schickt es sich nicht, daß ein Gott den andern verfolgt und mordet und ihm Übles tut. 6. Wenn nun Götter von Göttern verfolgt und durchbohrt, gewisse geraubt und andere vom Blitz erschlagen wurden, so ist klar, daß die Natur ihrer Götter nicht eine ist, und daraus, o Kaiser, erhellt, daß es ein Irrtum ist, wenn sie die Naturen ihrer Götter (zusammen-)rechnen und auf <strong>eine </strong>Natur bringen.</p><p>7. Wenn wir uns also wundern müssen über einen Gott, der gesehen wird, aber nicht sieht, um wieviel mehr ist bewundernswert, daß man an eine unsichtbare, aber allsehende Natur glaubt? Und wenn es sich ferner geziemt, das Werk eines Künstlers zu betrachten, um wieviel mehr geziemt es sich, den Schöpfer des Künstlers zu preisen?</p><p>8. Ja als sich die Griechen Gesetze gaben, sahen sie nicht ein, daß sie durch ihre Gesetze ihre Götter verurteilen. Sind nämlich ihre Gesetze gerecht, so sind ungerecht ihre Götter, die die Gesetze übertraten, indem sie einander mordeten und Zauberei, Ehebruch, Raub und Diebstahl verübten und mit Männlichen schliefen, zu ihren übrigen Missetaten hin. Wenn aber ihre Götter bei all dem (oben) Geschilderten löblich handelten, so sind ungerecht der Griechen Gesetze, die nicht nach dem Willen ihrer Götter gegeben worden sind.</p><p>9. Und hierin hat die ganze Welt geirrt. Denn ihre Göttergeschichten sind teils Sagen, teils natürlich(e Vorgänge), teils Gesänge und Lieder. Die Gesänge und Lieder nun sind leere Worte und Schall. Haben sich aber die natürlichen (Vorgänge) so zugetragen, wie man erzählt, so sind die keine Götter mehr, die solches taten, erlitten und erduldeten; sind sie aber bildlich (aufzufassen), so sind (sie wie) die Sagen matte Reden, die gar keinen Sinn haben.</p>
      <h2>14</h2><p>1. Kommen wir jetzt, o Kaiser, auch zum Volksstamm der Juden, und sehen wir zu, was sie für eine Anschauung von Gott haben. 2. Die Juden nun behaupten, daß Gott einer ist, Schöpfer des Alls und allmächtig, und daß man nichts anbeten dürfe als Gott allein. Und hierin scheinen sie der Wahrheit näher zu kommen als alle (anderen) Völker, darin (nämlich), daß sie vorzüglich Gott und nicht seine Werke anbeten. 3. Auch ahmen sie Gott nach durch die Menschenliebe, die sie pflegen, indem sie sich der Armen erbarmen, die Gefangenen erlösen, die Toten begraben u. dgl. tun, was Gott genehm und auch den Menschen gefällig ist, was sie (alles) von ihren Vorvätern übernommen haben. 4. Indes sind auch sie von der genauen Erkenntnis abgeirrt. Sie vermeinen zwar in ihrem Sinne Gott zu verehren, aber durch die Art ihrer Handlungen gilt ihre Verehrung den Engeln und nicht Gott, da sie die Sabbate, die Neumonde, die (Tage des) Ungesäuerten, den Großen Tag, das Fasten, die Beschneidung und die Reinheit der Speisen beobachten, was sie nicht einmal so vollkommen halten.</p>
      <h2>15</h2><p>1. Die Christen aber, o Kaiser, haben umhersuchend die Wahrheit gefunden und stehen, wie wir ihren Schriften entnommen haben, der Wahrheit und genauen Erkenntnis näher als die übrigen Völker. 2. Denn sie kennen Gott und glauben an ihn als den Schöpfer und Werkmeister des Alls, durch den alles und von dem alles ist, der keinen andern Gott neben sich hat, 3. von dem sie die Gebote empfingen, die sie in ihren Sinn eingezeichnet haben und beobachten in der Hoffnung und Erwartung der künftigen Welt.</p><p>4. Deshalb treiben sie nicht Ehebruch und Unzucht, legen kein falsches Zeugnis ab, unterschlagen kein hinterlegtes Gut, begehren nicht, was nicht ihr eigen, ehren Vater und Mutter, erweisen ihrem Nächsten Gutes und richten, wenn Richter, nach Gerechtigkeit. 5. Götzen in Menschengestalt beten sie nicht an, und was sie nicht wollen, daß ihnen andere tun, das tun sie auch niemand. Von der Götzenopferspeise essen sie nicht, denn sie sind rein. Denen, die sie kränken, reden sie zu und machen sie sich zu Freunden; den Feinden spenden sie eifrig Wohltaten.</p><p>6. Ihre Frauen, o Kaiser, sind rein wie Jungfrauen, und ihre Töchter sittsam. Ihre Männer enthalten sich jedes ungesetzlichen Verkehrs und aller Unlauterkeit in der Hoffnung auf die in der andern Welt winkende Vergeltung. Die Sklaven aber und Sklavinnen oder die Kinder, die deren einzelne haben mögen, bereden sie aus Liebe zu ihnen, Christen zu werden; und sind sie es geworden, so nennen sie dieselben ohne Unterschied Brüder. 7. Die fremden Götter beten sie nicht an. Sie wandeln in aller Demut und Freundlichkeit. Lüge wird bei ihnen nicht gefunden. Sie lieben einander. Die Witwen mißachten sie nicht; die Waise befreien sie von dem, der sie mißhandelt. Wer hat, gibt neidlos dem, der nicht hat. Wenn sie einen Fremdling erblicken, führen sie ihn unter Dach und freuen sich über ihn, wie über einen wirklichen Bruder. Denn sie nennen sich nicht Brüder dem Leibe nach, sondern [Brüder] im Geiste und in Gott. 8. Wenn aber einer von ihren Armen aus der Welt scheidet und ihn irgendeiner von ihnen sieht, so sorgt er nach Vermögen für sein Begräbnis. Und hören sie, daß einer von ihnen wegen des Namens ihres Christus gefangen oder bedrängt ist, so sorgen alle für seinen Bedarf und befreien ihn, wo möglich. 9. Und ist unter ihnen irgendein Armer oder Dürftiger, und sie haben keinen überflüssigen Bedarf, so fasten sie zwei bis drei Tage, damit sie den Dürftigen ihren Bedarf an Nahrung decken.</p><p>Die Gebote ihres Christus halten sie [gar] gewissenhaft, indem sie rechtschaffen und ehrbar leben, so wie der Herr ihr Gott ihnen befohlen, 10. Alle Morgen und zu allen Stunden preisen und loben sie Gott ob der ihnen gespendeten Wohltaten und danken ihm für Speise und Trank. 11. Und wenn ein Gerechter von ihnen aus der Welt scheidet, so freuen sie sich und danken Gott und geben seiner Leiche das Geleite, gleich als zöge er (nur) von einem Ort zum andern. Und wenn einem von ihnen ein Kind geboren worden, so preisen sie Gott; und sollte es dann (schon) in seiner Kindheit sterben, so preisen sie Gott überaus, ist es doch ohne Sünde aus der Welt geschieden. Müssen sie hinwiederum sehen, wie einer von ihnen in seiner Gottlosigkeit und seinen Sünden stirbt, so weinen sie über diesen bitterlich und seufzen, soll er ja zur Strafe hingehen. 12. Das, o Kaiser, ist das Gebot des Gesetzes der Christen und ihre Lebensführung.</p>
      <h2>16</h2><p>1. Als solche, die Gott kennen, bitten sie ihn (nur) um Dinge, die ihm wohl anstehen zu geben und ihnen zu empfangen. So füllen sie ihre Lebenszeit aus. Und da sie Gottes Wohltaten gegen sie erkennen, siehe! so strömen ihretwegen die Segnungen in der Welt fort. Und wahrhaftig sind sie es, die umher suchend die Wahrheit gefunden haben. Und aus dem, was wir vernommen, haben wir geschlossen, daß sie allein der Erkenntnis der Wahrheit nahestehen.</p><p>2. Die Wohltaten, die sie spenden, rufen sie nicht in die Ohren der Menge; sie sind (vielmehr) besorgt, daß sie niemand bemerke, und verheimlichen ihre Gabe wie einer, der einen Schatz gefunden hat und ihn geheim hält. Sie bemühen sich gerecht zu sein, erwarten sie ja in großer Herrlichkeit ihren Christus zu sehen und die ihnen gemachten Verheißungen von ihm zu empfangen. 3. Ihre Sprüche und Gebote aber, o Kaiser, den Ruhm ihres (Gottes-) Dienstes und den Lohn [der Vergeltung], den sie entsprechend dem Tun eines jeden einzelnen von ihnen in der andern Welt erwarten, magst du aus ihren Schriften kennen lernen. 4. Uns aber genügt es, in Kürze Eurer Majestät den Wandel und die Wahrheit der Christen kundgetan zu haben; denn wahrhaft groß und wunderbar ist ihre Lehre für den, der sie betrachten und verstehen will, und wahrhaft neu ist dies Volk und eine göttliche Mischung ist in ihm.</p><p>5. Nehmt also ihre Schriften her und lest darin, und siehe! Ihr werdet finden, daß ich dies nicht aus mir selbst geschöpft oder als ihr Anwalt gesprochen habe, sondern, nachdem ich nun einmal in ihren Schriften gelesen habe, bin ich davon fest überzeugt, auch von dem Zukünftigen. Darum fühlte ich mich auch gedrängt, denen die Wahrheit zu zeigen, die ihr geneigt sind und die künftige Welt suchen. 6. Auch hege ich keinen Zweifel, daß (nur) durch das flehentliche Gebet der Christen die Welt noch fortbesteht. Die übrigen Völker aber gehen und führen irre, indem sie sich vor die Elemente der Welt hinwälzen, will ja ihr Geistesblick nicht drüber hinwegsehen. Sie tasten wie im Dunkeln, da sie die Wahrheit nicht erkennen wollen, und taumeln wie Trunkene, ziehen einander hin und fallen.</p>
      <h2>17</h2><p>1. Bis hierher, o Kaiser, habe <strong>ich </strong>gesprochen. Bezüglich des übrigen finden sich, wie oben bemerkt, in ihren andern Schriften Worte, die schwer zu sagen und von jemand vorzutragen sind, (Worte) die nicht bloß geredet, sondern auch befolgt sein wollen.</p><p>2. Die Griechen hingegen, o Kaiser, weil schändliche Dinge verübend durch Beilager mit Männlichen und mit Mutter, Schwester und Tochter, schieben den Hohn ihrer Unlauterkeit auf die Christen. Die Christen jedoch sind rechtschaffen und heilig und die Wahrheit steht ihnen vor Augen. 3. Sie sind auch langmütig. Und weil sie wissen, daß jene im Irrtum sind, lassen sie sich von ihnen schlagen, ertragen und dulden sie, ja noch mehr, sie behandeln sie schonend als Leute, die der Erkenntnis ermangeln, und bringen für sie Gebet(e) dar, damit sie sich von ihrem Irrtum bekehren. 4. Kommt es indes vor, daß einer von ihnen sich bekehrt, so schämt er sich vor den Christen seiner begangenen Missetaten, bekennt (sie) Gott und spricht: „Aus Unwissenheit habe ich diese begangen“. Und er reinigt sein Herz, und seine Sünden werden ihm nachgelassen, weil er sie aus Unwissenheit in der früheren Zeit beging, wo er (noch) die wahre Erkenntnis der Christen lästerte und schmähte. 5. Ja wahrhaft selig ist das Geschlecht der Christen vor allen Menschen auf der Erdoberfläche.</p><p>6. Verstummen sollen nunmehr die Zungen derer, die Eitles reden und die Christen verleumden, und sie sollen jetzt die Wahrheit sagen. Denn es frommt ihnen mehr, den wahren Gott anzubeten, als einen unbestimmten Schall. 7. Und wahrhaft ist Gottes, was durch der Christen Mund geredet wird, und ihre Lehre ist die Pforte des Lichts. 8. Es sollen sich ihr nun alle die nahen, die Gott (noch) nicht erkannt haben, und sollen die unvergänglichen Worte aufnehmen, die von jeher sind und von Ewigkeit. Mögen sie also zuvorkommen dem furchtbaren Gericht, das durch Jesus Christus über das ganze Menschengeschlecht kommen soll.</p><hr><p><strong>Quelle:</strong> Übersetzung von Dr. Kaspar Julius, <em>Apologie</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 12), München 1913. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-1062/versions/apologie-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>
