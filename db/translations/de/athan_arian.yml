    body: |-
      <p><em>Erste Rede gegen die Arianer (Bibliothek der Kirchenväter).</em></p><p>Alle Häresien, die durch Abfall von der Wahrheit entstanden, haben offenbar ein Wahngebilde sich ausgesonnen, und ihre Gottlosigkeit ist längst allen offenkundig geworden. Daß ja die, die solches ausgeheckt haben, von uns geschieden sind, ist doch wohl klar, wie ja der selige Johannes geschrieben hat: Die Anschauung solcher Leute hätte mit der unsrigen nie harmoniert noch auch harmoniere sie heute. Deshalb zerstreuen sie auch, wie der Heiland gesagt hat, mit dem Teufel, sie, die nicht mit uns sammeln, und warten, bis die Leute schlafen, um dann ihr eigenes tödliches Gift auszusäen und so Genossen im Tode zu gewinnen.</p><p>Eine von den Irrlehren nun und zwar die jüngste, die eben erst als Vorläuferin des Antichrist ausgezogen ist, die sogenannte arianische, — listig und verschlagen — sieht, wie ihre älteren Schwestern, die andern Irrlehren, vor aller Welt gebrandmarkt wurden. Deshalb sucht sie sich heuchlerisch mit den Aussprüchen der Schrift zu decken wie schon ihr Vater, der Teufel, und will sich den Wiedereintritt in das Paradies der Kirche erzwingen, um unter der Maske des Christentums durch ihre verführerischen Fehlschlüsse — etwas Vernünftiges ist ja bei ihr nicht zu finden — den einen und andern zu einer falschen Vorstellung von Christus zu verleiten. Und sie hat ja wirklich schon einige Unbesonnene irregeführt und zwar so, daß deren Schädigung nicht auf das Anhören beschränkt blieb, sondern daß sie, der Eva gleich, auch nahmen und kosteten und nunmehr in ihrer Verblendung das Bittere süß wähnen und die abscheuliche Irrlehre schön nennen.</p><p>Ich erachtete es daher, von euch dazu ermuntert, für nötig, den geschlossenen Panzer dieser häßlichen Irrlehre zu öffnen und euch deren übelriechende Torheit nachzuweisen, damit die ihr ferne Stehenden sie noch mehr fliehen, die von ihr bereits Betrogenen aber zu besserer Einsicht kommen, die Augen ihres Herzens öffnen und erkennen, daß, wie die Finsternis nicht Licht und die Lüge nicht Wahrheit ist, so auch die arianische Irrlehre nicht schön ist, daß aber auch die, welche diese Leute noch Christen nennen, in gar schwerer Täuschung befangen sind, da sie weder die Schrift verstehen noch überhaupt das Christentum und seinen Glauben kennen.</p><p>Welche Ähnlichkeit haben sie denn zwischen dieser Irrlehre und dem frommen Glauben entdeckt, da sie so albern reden, als sagten jene nichts Schlimmes? Das heißt doch wahrlich soviel, wie wenn sie den Kaiphas noch einen Christen nenneten, den Verräter Judas noch zu den Aposteln zählten und sagten, die, welche den Barabbas statt des Heilandes losbaten, hätten nichts Böses getan, und den Hymenäus und Alexander als rechtlich denkende Männer, den Apostel aber unwahrer Aussagen über sie bezichtigten. Doch wohl kein Christ könnte dies mitanhören, noch auch würde man den, der solche Sprache zu führen sich erdreistete, für geistig gesund halten. Denn an Stelle von Christus haben sie den Arius, wie die Manichäer den Manichäus, anstatt Moses und der übrigen Heiligen einen gewissen Sotades, der selbst den Heiden zum Gespötte ist, und die Tochter des Herodias aufgebracht. Denn des ersteren gebrochene und weibische Manier hat Arius nachgemimt, indem auch er Thalien schrieb. Der letzteren aber suchte er es im Tanze gleichzutun, indem er in seinen Schmähungen auf den Heiland tanzte und scherzte, so daß die, welche der Irrlehre anheimfallen, sinnverwirrt und unverständig werden, den Namen des Herrn der Herrlichkeit mit der Ähnlichkeit eines Bildes von einem vergänglichen Menschen vertauschen und anstatt Christen sich fortan Arianer nennen und damit ihre Gottlosigkeit kennzeichnen. Denn mit Ausflüchten mögen sie sich nicht behelfen noch auch, wenn sie Schmach trifft, die, welche nicht ihresgleichen sind, verdächtigen wollen, indem sie auch in gleicher Weise die Christen nach ihren Lehrern benennen, um so auch selbst wieder wie jene als Christen dazustehen und bezeichnet zu werden. Sie mögen auch nicht, wenn sie sich ihres schimpflichen Namens schämen, spassen, sondern, wenn sie erröten, sich verbergen oder ablassen von ihrer Gottlosigkeit. Denn noch nie nahm eine Gemeinde den Namen von ihren Bischöfen an, sondern vom Herrn, an den wir auch glauben. So sind die seligen Apostel unsere Lehrer geworden und Diener an der Frohbotschaft des Erlösers; aber wir wurden nicht nach ihnen genannt, sondern von Christus her sind und heißen wir Christen. Die aber von andern ihren Glauben herleiten, haben billigerweise von ihnen auch die Benennung, da sie zu ihnen gehören.</p><p>So fürwahr wurde, während wir alle nach Christus Christen sind und heißen, vor Zeiten Marcion der Stifter einer Irrlehre, ausgestoßen und die, welche zu dem standen, der ihn ausstieß, behielten den Namen „Christen“ bei, die Anhänger Marcions aber hießen fortan nicht mehr Christen, sondern Marcionisten. So teilten auch Valentin, Basilides, Manichäer und Simon der Magier ihren Anhängern ihren eigenen Namen mit, und so werden die einen Valentinianer, die andern Basilidianer, die dritten Manichäer und die letzten Simonianer und wieder andere nach den Phrygiern aus Phrygien und nach Novatus Novatianer genannt. So nannte auch Meletius, nachdem er vom Bischof und Märtyrer Petrus ausgestoßen worden war, seine Leute nicht mehr Christen, sondern Meletianer. So blieben denn auch, als der selige Alexander den Arius ausstieß, die, welche es mit Alexander hielten, Christen, die aber mit Arius austraten, haben uns, den Anhängern des Alexander, den Namen des Erlösers zurückgelassen; sie aber hießen fortan Arianer. Ja, noch mehr! Auch nach dem Tode Alexanders haben die, welche in Gemeinschaft stehen mit seinem Nachfolger Athanasius, und mit denen eben dieser Athanasius wieder in Gemeinschaft steht, dasselbe Gepräge, und weder tragen einige von ihnen seinen Namen, noch wird er selbst nach jenen benannt, sondern alle heißen wie gewöhnlich wieder Christen. Denn wenn wir auch Nachfolger der Lehrer haben und deren Schüler werden, so sind und heißen wir nichtsdestoweniger Christen, weil wir ja von ihnen in der Lehre Christi unterwiesen werden. Die sich aber den Irrlehrern anschließen, tragen, wenn sie auch Tausende zu Nachfolgern haben, doch jedenfalls den Namen des Stifters der Irrlehre. So wurden, als nach dem Tode des Arius viele von den Seinigen ihm folgten, gleichwohl die Gesinnungsgenossen des Arius nach ihm benannt und Arianer geheißen. Ein auffallender Beweis hierfür ist ja doch auch folgende Tatsache: Die Heiden, die auch jetzt noch in die Kirche eintreten und den Aberglauben an ihre Götzenbilder aufgeben, nehmen nicht den Namen ihrer Katecheten an, sondern den des Erlösers, und statt Heiden heißen sie von nun an Christen. Die aber zu jenen übertreten oder überhaupt alle, die von der Kirche zur Irrlehre überspringen, geben den Namen Christi auf und heißen nunmehr Arianer, da sie ja nicht mehr den Glauben Christi besitzen, sondern Erben des arianischen Wahnsinns geworden sind.</p><p>Wie sind also sie Christen, wenn sie doch keine Christen, sondern Ariomaniten sind? Oder wie gehören die zur katholischen Kirche, die den katholischen Glauben abgeschüttelt und schlimme Neuerungen ausgeheckt haben, welche die Aussprüche der göttlichen Schriften unbeachtet lassen, dafür aber die Thalien des Arius eine neue Weisheit nennen? Mit Recht reden sie von einer neuen Weisheit, verkünden sie ja doch eine neue Irrlehre. Schon viele haben zum Alten und Neuen Testament zahlreiche Kommentare und unzählige Homilien geschrieben, aber bei keinem, auch bei keinen ernsthaften Heiden findet sich eine Thalia, sondern nur bei solchen, die derartiges beim Trinkgelage unter Lärm und Spott zum Zeitvertreib singen, um andere zum Lachen zu reizen. Und daher muß man sich wundern, daß der sonderbare Arius nichts Würdiges zum Vorbild nahm, sondern, ohne zu wissen, was sich schon überhaupt für gesetzte Leute schickt, auch noch die Hauptsache den andern Irrlehren abstahl und bloß der Possenreißerei des Sotades nacheiferte. Denn was hätte er anderes tun sollen, wenn er gegen den Heiland einen Tanz aufführen wollte, als seine erbärmlichen, gottlosen Reden in regel- und kraftlose Weisen zu kleiden, damit, wie die Weisheit sagt: „Vom Ausgang der Rede wird der Mann erkannt werden“, so aus jenen das Unmännliche der Seele und die verdorbene Gesinnung des Verfassers erkannt würde? Und es blieb ja wirklich auch der Hinterlistige nicht verborgen, sondern wie oft er sich auch, der Schlange gleich, auf- und abwärts wand, er ist doch in den Irrtum der Pharisäer gefallen. Denn wie jene, die am Gesetz vorbeikommen wollten, sich gaben, als beobachteten sie die Worte des Gesetzes, und sie, die den erwarteten und erschienenen Herrn nicht anerkennen wollten, sich stellten, als nenneten sie ihn Gott, aber als Lästerer sich verrieten, wenn sie sagten: „Warum machst Du Dich, der Du doch ein Mensch bist, zu Gott und sagst: ich und der Vater sind eins“, so stellt sich auch der Betrüger und Sotadaer Arius, als rede er von Gott, indem er auf die Aussagen der Schrift sich beruft, wird aber auf allen Seiten überführt als der gottlose Arius, der den Sohn leugnet und ihn unter die Geschöpfe zählt.</p><p>Der Anfang der arianischen Thalia und Possenreißerei mit ihrem weibischen Charakter und Rhythmus lautet nun also: “Nach dem Glauben der Auserwählten Gottes, der Gottesgelehrten, der heiligen Kinder und der Rechtgläubigen, die den Hl. Geist Gottes empfangen haben, habe ich von denen, die Anteil haben an der Weisheit, den Gebildeten, den von Gott Unterrichteten, den in allen Dingen Weisen folgendes gelernt. In ihre Fußtapfen trat ich, gleicher Gesinnung, der hochberühmte, der ich schon viel um der Herrlichkeit Gottes willen erduldet habe, und von Gott unterrichtet gewann ich Weisheit und Erkenntnis”. Die abstoßenden und von Gottlosigkeit strotzenden Possen aber, die er in ihr reißt, sind etwa folgende: “Nicht immer war Gott Vater, sondern es war [einmal], da Gott allein war und noch nicht Vater war; später aber kam der Vater dazu. Nicht immer war der Sohn; denn als alles aus dem Nichtseienden entstand, und alle geschöpflichen und gemachten Wesen wurden, da ist auch das Wort Gottes aus Nichtseiendem geworden, und es war einmal, da es nicht war, und war nicht, bevor es wurde, sondern es hatte selbst auch einen Anfang der Schöpfung. Denn es war, sagt er, Gott allein, und noch nicht war das Wort und die Weisheit. Als er dann uns erschaffen wollte, da machte er irgendeinen und nannte ihn Wort und Weisheit und Sohn, um durch ihn uns zu schaffen. Zwei Weisheiten nun, sagt er, gebe es: eine, welche die eigentliche ist und mit Gott existiert, und in dieser Weisheit sei der Sohn entstanden und wegen der Teilnahme an ihr Weisheit und Wort bloß genannt worden. Denn die Weisheit, sagt er, wurde durch die Weisheit nach dem Willen des weisen Gottes. So, sagt er, gebe es auch ein zweites Wort in Gott neben dem Sohn, und nur wegen der Teilnahme an ihm sei hinwiederum der Sohn selbst aus Gnade Wort und Sohn genannt worden.” Es ist aber auch das eine ihrer Irrlehre eigene Ansicht, die in andern ihrer Schriften vertreten wird, daß sie denken: “Es gibt viele Kräfte, und die eine ist Gott von Natur eigen und ewig; Christus ist aber wieder nicht die wahre Kraft Gottes, sondern auch eine der sogenannten Kräfte, von denen eine, die Heuschrecke und die Raupe, nicht bloß eine Kraft, sondern eine große Kraft genannt wird, die andern aber in großer Anzahl vorhanden und dem Sohne ähnlich sind, von denen auch David in seinen Psalmen singt:”Der Herr der Kräfte“. Und von Natur ist auch das Wort wie alle Wesen veränderlich, aber durch seinen eigenen freien Willen bleibt es gut, solange es will. Wenn es aber will, kann es sich auch verändern wie wir, da es veränderlicher Natur ist. Denn deshalb, sagt er, hat auch Gott, da er voraussah, daß es gut sein werde, zum voraus ihm diese Herrlichkeit gegeben, die es als Mensch hernach auch durch seine Tugend erlangte, so daß es Gott wegen seiner Werke, die er vorhersah, schon in solchem Zustand entstanden sein ließ.”</p><p>Wieder wagte er zu behaupten, daß das Wort auch nicht wahrer Gott sei. Wenn es aber auch Gott genannt werde, so sei es doch nicht wahrer Gott, sondern durch die Teilnahme an der Gnade werde es auch wie alle andern bloß dem Namen nach Gott genannt. Und da alle dem Wesen nach Gott fremd und unähnlich seien, so sei auch das Wort in allem dem Wesen und der Eigentümlichkeit des Vaters fremd und unähnlich; es gehöre vielmehr zu den gewordenen und geschaffenen Wesen und sei eins von ihnen.</p><p>Mit diesen Behauptungen schrieb er, wie wenn er dem Teufel in seiner Verwegenheit hätte folgen wollen, in seiner Thalia nieder, daß also auch dem Sohn der Vater unsichtbar sei, und es könne das Wort seinen Vater weder sehen noch auch genau und vollkommen erkennen, aber auch, was es erkenne und sehe, wisse und sehe es nur in dem ihm entsprechenden Maße, wie auch wir nur nach dem Maße eigener Kraft erkennen. Denn auch der Sohn, sagt er, kenne nicht nur den Vater nicht genau — denn es fehle ihm das Vermögen, ihn zu erfassen —, sondern es erkenne der Sohn nicht einmal sein eigenes Wesen, weil die Wesenheiten des Vaters, des Sohnes und des Hl. Geistes der Natur nach geteilt, gesondert, getrennt, gegenseitig sich fremd seien und in keiner Gemeinschaft miteinander stehen, und, wie er selbst sagte, dem Wesen wie der Herrlichkeit nach von einander durchaus unendlich verschieden seien. Das Wort nun, sagt er, stehe in Bezug auf die Ähnlichkeit der Herrlichkeit und des Wesens beiden, dem Vater wie dem Hl. Geiste, ganz ferne. In solchen Worten also drückte der Gottlose sich aus und behauptet, daß der Sohn für sich gesondert sei und mit dem Vater in gar keiner Gemeinschaft stehe. — Das sind Auszüge aus den Hirngespinsten, die in der lächerlichen Schrift des Arius sich finden.</p><p>Wer sollte nun, wenn er derlei Reden und das Gedicht der Thalia hört, den Arius nicht mit Recht hassen, der wie auf der Bühne mit solchen Dingen seinen Spott treibt? Wer sieht nicht in diesem Menschen, wenn er Gott bei Namen zu nennen und von ihm zu reden scheint, die Schlange, die dem Weibe rät? Wer aber durchschaut nicht, wenn er auf das Nachfolgende stößt, seine Gottlosigkeit ebenso wie den nachgefolgten hinterlistigen Betrug der Schlange an dem Weibe? Wer entsetzt sich nicht ob solcher Gotteslästerungen? Der Himmel entsetzte sich, wie der Prophet sagt, und die Erde erzitterte bei der Übertretung des Gesetzes. Die Sonne aber zürnte noch mehr, und da sie damals die dem uns allen gemeinsamen Herrn zugefügten körperlichen Mißhandlungen, die er freiwillig für uns litt, nicht mitansehen konnte, wandte sie sich ab, zog ihre Strahlen ein und entzog jenem Tag das Sonnenlicht. Wie soll aber nicht ob der Gotteslästerungen des Arius die ganze Natur der Menschen sprachlos werden, die Ohren verstopfen, die Augen schließen, damit sie derlei Dinge nicht hören noch den, der solches geschrieben, sehen könne? Und wird nicht noch mit mehr Recht der Herr selbst diesen in ihrer Gottlosigkeit und Undankbarkeit die Worte zurufen, die er durch den Propheten Oseas vorhergesagt hat: „Wehe ihnen, weil sie abtrünnig wurden von mir; elend sind sie, weil sie gefrevelt haben wider mich. Ich erlöste sie, doch sie redeten Lügen gegen mich“. Und kurz hernach: „Und sie sannen wider mich Böses, sie wandten sich dem Nichts zu“. Denn indem sie sich vom seienden Worte Gottes abwandten und sich das nichtseiende erdichteten, sind sie in das Nichts gefallen. Deshalb stieß ja auch die allgemeine Synode den Arius, der dies behauptete, aus der Kirche aus und belegte ihn mit dem Banne, da sie seine Gottlosigkeit nicht ertragen konnte. Auch fürderhin betrachtete man die Verirrung des Arius als Häresie, die etwas mehr als die übrigen Häresien enthalte, weshalb sie auch als christusfeindlich und als Vorläuferin des Antichrist angesehen wurde. Ein so gewichtiges Urteil über die gottlose Häresie genügt nun vollauf, um alle zur Flucht vor ihr zu bestimmen. Doch da einige von den sogenannten Christen, wie bereits früher bemerkt, entweder aus Unwissenheit oder aus Verstellung meinen, daß die Häresie der Wahrheit gleichgültig gegenüberstehe, und Leute von solcher Gesinnung noch Christen nennen, so wollen wir die Tücke der Häresie aufdecken, indem wir nach Möglichkeit an sie Fragen stellen. Vielleicht werden sie dann, so in die Enge getrieben, zum Schweigen gebracht werden und vor der Häresie wie vor dem Anblick einer Schlange fliehen.</p><p>Wenn sie nun deswegen, weil er einige Stellen aus der göttlichen Schrift in die Thalia aufgenommen hat, auch seine Gotteslästerungen für Lobpreisungen halten, so werden sie wohl jedenfalls, wenn sie die jetzt lebenden Juden das Gesetz und die Propheten lesen sehen, deshalb auch mit jenen Christum leugnen. Und wenn sie etwa auch die Manichäer einige Abschnitte aus den Evangelien verlesen hören, so werden sie mit ihnen das Gesetz und die Propheten zurückweisen müssen. Wenn sie aber aus Unwissenheit sich so erhitzen und derlei Zeug schwatzen, so mögen sie aus der Schrift lernen, daß auch der Teufel, der Erfinder der Irrlehren, wegen des der Bosheit eigenen üblen Geruchs Stellen aus der Schrift verwertet, um, durch sie gedeckt, sein Gift auszusäen und die Arglosen zu hintergehen. So betrog er Eva, so schuf er auch die andern Häresien. So riet er auch jetzt dem Arius, gegen die Häresien zu reden und sich wohl in die Brust zu werfen, um so seine eigene Häresie unbemerkt einzuschmuggeln. Gleichwohl blieb der Verschmitzte auch so nicht verborgen. Denn da er gegen das Wort Gottes frevelte, fiel er alsbald von allem ab, und allen ist es kund geworden, daß er auch in den andern Dingen unwissend war, und daß er, ohne irgendwie es auf die Wahrheit abzusehen, sich nur verstellt. Denn wie könnte der über den Vater die Wahrheit verkünden, der den Sohn leugnet, der über ihn Aufschluß gibt? Oder wie wird er vom Geiste eine richtige Vorstellung haben, wenn er doch das Wort schmäht, das ihn mitteilt? Wer wird ihm Glauben schenken, wenn er von der Auferstehung redet, wenn er Christum leugnet, der unsertwegen „der Erstgeborene von den Toten“ geworden ist? Wie wird der, welcher die echte und wahrhafte Zeugung des Sohnes aus dem Vater ganz und gar nicht kennt, nicht auch bezüglich seiner Erscheinung im Fleische im Irrtum befangen sein? Denn so verloren auch die damaligen Juden, die das Wort nicht anerkannten und sprachen: „Wir haben keinen König als den Kaiser“, alles zumal: sie sind verlustig gegangen des Lichtes der Lampe, des Wohlgeruchs der Salbe, der prophetischen Erkenntnis, ja der Wahrheit selbst, und jetzt wandeln sie in völliger Unkenntnis im Dunkeln herum. Denn wer hätte jemals etwas Derartiges vernommen? Oder woher und von wem haben die bestechlichen Schmeichler der Häresie solches gehört? Wer hat ihnen, als sie im Glauben unterrichtet wurden, Ähnliches gesagt? Wer hat sie gelehrt: „Ihr, die ihr die Anbetung der Kreatur aufgegeben habt, wendet euch wieder hin zur Kreatur und dem Geschöpf, um es anzubeten?“ Wenn sie aber auch selbst es zugeben müssen, erst jetzt solche Dinge gehört zu haben, so sollen sie nicht bestreiten, daß diese Häresie ein fremdes Gewächs ist und nicht von den Vätern stammt. Was aber nicht von den Vätern stammt, sondern erst jetzt aufgebracht wurde, was wäre das anderes als was der selige Paulus vorausgesagt hat: „In den späteren Zeiten werden manche vom gesunden Glauben abfallen, indem sie irreführenden Geistern und Lehren der Dämonen Gehör schenken, solchen, die in Heuchelei Lügen reden, die in ihrem Gewissen gebrandmarkt sind und die Wahrheit von sich weisen“.</p><p>Denn sieh, wir sprechen uns nach den göttlichen Schriften über den frommen Glauben offen aus und stellen ihn wie eine Leuchte auf den Leuchter, indem wir sagen: Von Natur wahrer und echter Sohn des Vaters, eigen seiner Wesenheit, eingeborene Weisheit, wahres und einziges Wort Gottes ist dieser. Nicht ist er im Geschöpf, noch im Gebilde, sondern eigene Zeugung der Wesenheit des Vaters. Deshalb ist er wahrer Gott und wesenseins mit dem wahren Vater. Alle andern aber, zu denen er sagte: „Ich sprach, ihr seid Götter“, haben nur durch Teilnahme am Wort durch den Geist diese Gnade vom Vater. Denn er ist das Abbild der Person des Vaters, Licht vom Licht, und Kraft und wahrhaftes Bild der Wesenheit des Vaters. Dies sagt ja wieder der Herr: „Wer mich gesehen hat, hat den Vater gesehen“. Immer aber war und ist er, und niemals war er nicht. Denn da der Vater ewig ist, so ist wohl auch ewig dessen Wort und Weisheit. Was aber bringen uns jene aus der verrufenen Thalia vor? Sie mögen sie doch erst lesen und die Manier ihres Verfassers nachahmen, damit sie vielleicht auch von andern verspottet einsehen, in welchem Abgrund sie liegen, und dann mögen sie künftig so reden. Was aber könnten sie aus ihr vorbringen als das: Nicht immer war Gott Vater, vielmehr ist er es erst später geworden. Nicht immer existierte der Sohn; denn er war nicht, bevor er gezeugt wurde. Er ist nicht aus dem Vater, sondern auch er entstand aus dem Nichtseienden. Er ist der Wesenheit des Vaters nicht eigen; denn ein Geschöpf ist er und ein Gebilde. Und Christus ist nicht wahrer Gott, sondern durch Teilnahme wurde auch er zu Gott gemacht. Nicht kennt der Sohn genau den Vater, noch sieht das Wort den Vater vollkommen, noch auch begreift und erkennt das Wort den Vater genau. Nicht ist er das wahre und einzige Wort des Vaters selbst, sondern nur dem Namen nach wird er Wort und Weisheit und der Gnade nach Sohn und Kraft genannt. Er ist nicht unveränderlich wie der Vater, sondern veränderlich von Natur wie die Geschöpfe, und es fehlt ihm das Vermögen, den Vater vollkommen zu begreifen und zu erkennen. Sonderbar jedenfalls ist die Häresie, wenn sie auch nichts Glaubwürdiges enthält, sondern immer nur vom Nichtsein am Seienden faselt und statt Lobpreisungen in einem fort Lästerungen vorbringt. Wenn man nun einen, der die Ansichten beider Teile prüfte, fragen würde, wessen Glauben er vorziehe und wessen Worte er Gottes würdig finde — doch nein, vielmehr sollen die Schmeichler der Gottlosigkeit selbst es sagen, welche Antwort sich zieme auf eine Fragestellung über Gott, — „denn Gott war das Wort“. Denn daraus wird man überhaupt erkennen, welche von den beiden vorgelegten Ansichten zu vertreten sich schicke, das „er war“ oder das „er war nicht“, das „immer“ oder das „bevor er wurde“, das „ewig“ oder das „von dem an“ und „von wann an“, daß er wahrhafter oder durch Annahme und Teilnahme und in Gedanken sei, ihn eines von den gewordenen Wesen zu nennen oder ihn mit dem Vater zu verbinden, daß er dem Wesen nach dem Vater unähnlich oder dem Vater ähnlich und eigen sei, daß er ein Geschöpf sei, oder daß durch ihn die Geschöpfe geworden seien, daß er das Wort des Vaters oder ein anderer sei als dieses, und er durch jenes und eine andere Weisheit geschaffen worden sei und bloß dem Namen nach Weisheit und Wort heiße und teilnehme an jener Weisheit und später entstanden sei.</p><p>Wessen Worte nun reden von Gott und tun dar, daß unser Herr Jesus Christus Gott und Sohn des Vaters ist? Die, welche ihr ausgespien habt, oder die wir nach der Schrift angeführt haben und aussprechen? Wenn also der Heiland nicht Gott, noch auch Wort und Sohn ist, so soll, wie den Heiden und jetzigen Juden, auch euch erlaubt sein zu sagen, was ihr wollt. Wenn er aber Wort des Vaters und wahrer Sohn und Gott aus Gott ist, und „über alles gepriesen in Ewigkeit“, wie wäre es dann nicht billig, die andern Behauptungen und ganz besonders die Thalia des Arius zu beseitigen und zu vertilgen als ein Bild des Bösen und als ein Werk, das strotzt von jeglicher Gottlosigkeit? Denn der, welcher auf sie stößt, weiß nicht, daß durch sie die Erdensöhne umkommen, und er die Leiter zur Hölle betritt. Sie selbst wissen das auch, und in ihrer Verschmitztheit halten sie es geheim und haben den Mut nicht, es frei heraus zu sagen, sondern sie sagen dafür etwas anderes. Denn wenn sie es sagen, wird man über sie den Stab brechen. Wenn sie aber auch nur in Verdacht kommen, werden sie von allen Seiten mit den Widerlegungen aus den Schriften überschüttet werden. Deshalb nun zünden sie als Kinder dieser Welt in schelmischer Weise ihren vermeintlichen Leuchter vom wilden Ölbaum an, und aus Furcht, er möchte alsbald erlöschen, — „denn das Licht der Gottlosen“, heißt es, „erlischt“ — verbergen sie diesen unter den Scheffel der Heuchelei, reden anders und brüsten sich mit dem Schutz der Freunde und dem Schrecken des Konstantius, damit die, welche bei ihnen eintreten, vor ihrer Heuchelei und Prahlerei den Schmutz der Häresie nicht sehen. Ist nun nicht die Häresie auch deshalb wieder hassenswert, wo sie doch von ihren eigenen Leuten geheim gehalten wird, da sie die Öffentlichkeit nicht ertragen kann und wie eine Schlange gepflegt wird? Denn woher haben sie diese Reden zusammengetragen? Oder von wem haben sie denn solches erhalten, was sie auszusprechen sich vermessen haben? Sie können wohl keinen Menschen nennen, der ihnen dieses geboten hätte. Denn wo wäre ein Heide oder Barbar, der zu sagen wagte, der, den er als Gott bekennt, sei eines von den Geschöpfen, und er sei nicht gewesen, ehe er gemacht worden? Oder wo wäre einer, der seinem Gott, an den er glaubt, keinen Glauben schenkt, wenn er sagt: „Dieser ist mein geliebter Sohn“, indem er behauptet, daß er nicht Sohn, sondern ein Geschöpf sei? Nein, alle werden über sie ungehalten sein, wenn sie in solcher Weise rasen. Aber auch die Schrift bietet ihnen keine Ausflüchte. Denn es ist schon oft gezeigt worden und soll auch hier gezeigt werden, daß diese Aufstellungen mit den göttlichen Aussprüchen im Widerspruch stehen. Da uns also nur mehr die Behauptung übrigbleibt, daß sie dies vom Teufel erhalten haben und rasend geworden sind — denn nur jener ist der Sämann von solchen Dingen, — wohlan, so wollen wir ihm gegenübertreten. Denn ihm gilt unser Kampf mit diesen, auf daß mit des Herrn Hilfe und damit, daß jener wie gewöhnlich unsern Beweisen unterliegt, diese beschämt werden, wenn sie den in Nöten sehen, der ihre Häresie ausgestreut hat, und, wenn auch erst spät, zur Erkenntnis kommen, daß sie als Arianer keine Christen sind.</p><p>Ihr habt gesagt und meint, wie jener es euch beibringt, daß einmal [eine Zeit] war, da der Sohn nicht war. Denn diese Maske eurer Erfindung muß man euch zuerst herabreißen. Was war also einmal, als der Sohn nicht war? Redet, ihr gottlosen Lästerzungen! Wenn ihr nun den Vater nennt, dann ist eure Blasphemie noch ärger. Denn es geht nicht an zu sagen: „es war einmal“ bezw. ihn in dem Worte „einmal“ anzudeuten. Denn er ist immer und ist auch jetzt und existiert, da auch der Sohn existiert, und er selbst ist der Seiende und des Sohnes Vater. Wenn ihr aber sagt, daß der Sohn einmal war, da er selbst nicht war, so ist die Antwort töricht und unvernünftig. Denn wie war er selbst, und war er selbst nicht? Wenn ihr nun hierin schon in Verlegenheit kommt, so müßt ihr noch weiterhin sagen: Es war einmal eine Zeit, da das Wort nicht war. Denn darauf deutet ja schon euer Beiwort „einmal“ hin. Und was ihr wiederum schriftlich ausgesprochen habt: „Der Sohn war nicht, bevor er gezeugt wurde“, heißt soviel als sagtet ihr: „Es war einmal, da er nicht war“. Denn, daß die Zeit vor dem Worte gewesen, besagt erstere Ausdrucksweise wie letztere. Wo nun habt ihr dies ausfindig gemacht? Habt etwa auch ihr den Heidenvölkern gleich getobt und sinnt auf eitle Reden wider den Herrn und seinen Gesalbten? Denn in keiner Stelle der Schrift ist so etwas vom Erlöser ausgesagt, sondern vielmehr das „immer“, das „ewig“ und das „ewige Sein mit dem Vater“. „Denn im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“. Und in der Apokalypse spricht er also: „Der ist und der war und der kommen wird“. Wer aber könnte von dem, „der ist“ und dem, „der war“ den ewigen trennen? Davon suchte ja auch Paulus in seinem Briefe an die Römer die Juden zu überzeugen, wenn er schrieb: „Von denen Christus dem Fleische nach stammt, der da ist über alles, Gott, gepriesen in Ewigkeit“. Zur Widerlegung der Heiden aber sagte er: „Denn das Unsichtbare an ihm wird am Schöpfungswerk der Welt in den erschaffenen Dingen geistig wahrgenommen: seine ewige Kraft und Gottheit“. Wer aber die Kraft Gottes ist, lehrt er selbst wieder in den Worten: „Christus, Gottes Kraft und Gottes Weisheit“. Denn er bezeichnet mit diesen Worten doch nicht den Vater, wie ihr oft einander zuflüstert und sagt: „Der Vater ist seine eigene ewige Kraft“. Doch dem ist nicht so. Denn er hat nicht gesagt: Gott selbst ist die Kraft, sondern: „Sein ist die Kraft“. Es ist aber allen klar, daß das Seinige nicht er selbst ist, aber ihm auch nicht fremd, sondern vielmehr ihm eigen ist. Beachtet aber auch den Zusammenhang der Worte und wendet euch zu dem Herrn, [„der Herr aber ist Geist“] und ihr werdet sehen, daß die Stelle auf den Sohn geht.</p><p>Denn indem er von der Schöpfung Erwähnung tut, schreibt er folglich auch von der schöpferischen Kraft, die bei der Schöpfung wirksam war, die ja das Wort Gottes ist, durch das alles entstanden ist. Wenn also die Schöpfung imstande ist, von sich aus allein ohne den Sohn Gott zu erkennen zu geben, dann habt acht, daß ihr nicht fallet und meint, die Schöpfung sei auch ohne den Sohn entstanden. Indes, wenn sie durch den Sohn geworden, und in ihm alles geworden ist, dann muß der, welcher die Schöpfung richtig betrachtet, auch das Wort, das sie ins Dasein gesetzt hat, richtig betrachten und durch dasselbe zur Erkenntnis des Vaters kommen. Wenn aber nach dem Worte des Heilandes „niemand den Vater erkennt als der Sohn, und dem der Sohn ihn offenbart“, und wenn er auf die Worte des Philippus: „Zeige uns den Vater“ nicht sprach: „Schau auf die Schöpfung!“, sondern: „Wer mich gesehen, hat den Vater gesehen“, so hat Paulus, wenn er die Heiden anklagt, daß sie trotz der Betrachtung der Harmonie und Ordnung in der Schöpfung nicht an das schöpferische Wort in ihr denken, — denn die Werke verkünden ihren Schöpfer, damit man aus ihnen den wahren Gott erkenne und von der Anbetung der Geschöpfe ablasse, — mit Recht gesagt: „Seine ewige Kraft und Gottheit“, um den Sohn anzudeuten. Wenn aber die Heiligen sagen: „Der vor den Zeiten besteht“ und: „Durch den er die Zeiten gemacht hat“, so verkünden sie ebenso wieder das ewige und immerwährende Sein des Sohnes, womit sie ihn auch als Gott bezeichnen. Denn so sagt Isaias: „Der ewige Gott, der die äußersten Grenzen der Erde erschaffen hat“. Und Susanna sagte: „Der ewige Gott“. Baruch schrieb: „Ich werde rufen zum Ewigen in meinen Tagen“ und kurz hernach: „Denn ich hoffte auf den Ewigen für eure Rettung, und es kam mir Freude vom Heiligen“. Da aber auch der Apostel in seinem Brief an die Hebräer sagt: „Welcher der Abglanz seiner Herrlichkeit und das Ebenbild seines Wesens ist“ und auch David im 89. Psalme singt: „Und der Lichtglanz des Herrn sei über uns“, und: „In Deinem Licht werden wir das Licht schauen“, wer wäre so unvernünftig, daß er am ewigen Sein des Sohnes noch zweifelte? Denn wann sah einer Licht ohne den Schimmer des Abglanzes, um auch vom Sohne sagen zu können: „Es war einmal, da er nicht war“, oder: „Er war nicht, bevor er gezeugt wurde“? Und was im 144. Psalm zum Sohne gesagt wird: „Deine Herrschaft ist die Herrschaft über alle Zeiten“, läßt nicht zu, irgendeine, wenn auch noch so kurze Unterbrechung zu denken, während der das Wort nicht bestanden hätte. Denn wenn jede Unterbrechung mit Zeiträumen sich messen läßt, aller Zeiten Schöpfer und König aber das Wort ist, dann ist es, wenn vor ihm auch nicht die geringste Unterbrechung war, Wahnsinn zu behaupten: „Es war einmal, da der Ewige nicht war“, und: „Der Sohn ist aus dem Nichtseienden“. Da aber auch der Herr selbst sagt: „Ich bin die Wahrheit“ und nicht sagt: Ich wurde die Wahrheit, sondern immer sagt: „Ich bin“ wie z. B. wenn er sagt: „Ich bin der Hirt“, „ich bin das Licht“ und wiederum: „Nennet ihr mich nicht Herr und Meister? Und mit Recht sagt ihr so; denn ich bin es“, wer sollte, wenn er eine solche Selbstbezeugung von Gott und der Weisheit und dem Worte des Vaters vernimmt, an der Wahrheit noch zweifeln und nicht sogleich glauben, daß in dem „ich bin“ die Ewigkeit und absolut vorzeitliche Anfangslosigkeit des Sohnes ausgedrückt ist?</p><p>Daß also die Schrift mit ihren Worten die Ewigkeit des Sohnes lehrt, erhellt aus dem Gesagten. Daß aber das, was die Arianer mit den Worten „er war nicht“ und „bevor“ und „da“ zum Ausdruck bringen, dieselbe Schrift von den Geschöpfen aussagt, soll wieder das Folgende dartun. Moses erzählt nämlich in seinem Bericht über unsere Erschaffung: „Und jedes Gewächs des Feldes, ehe es aufging in der Erde, und jedes Gras des Feldes, bevor es aufsproßte. Denn noch nicht hatte Gott regnen lassen auf die Erde, und es war noch kein Mensch, den Boden zu bebauen“. Und im Deuteronomium: „Als der Höchste die Völker teilte“. Der Herr aber sprach durch seinen eigenen Mund: „Wenn ihr mich liebtet, würdet ihr euch freuen, daß ich sagte: ich gehe zum Vater. Denn der Vater ist größer als ich. Und jetzt habe ich es euch vorhergesagt, ehe es geschieht, damit ihr glaubet, wenn es geschehen ist“. Über die Schöpfung aber redet er durch Salomo: „Bevor er die Erde schuf, und bevor er die Abgründe machte, bevor die Wasserquellen hervorbrachen und die Berge befestigt wurden, und vor allen Hügeln zeugt er mich“, und: „Bevor Abraham ward, bin ich“. Und von Jeremias sagt er: „Bevor ich dich im Mutterleibe bildete, kenne ich dich“. Und David singt: „Herr, Du bist meine Zuflucht geworden von Geschlecht zu Geschlecht. Bevor die Berge wurden und gebildet ward die Erde und ihr Umkreis, bist Du von Ewigkeit zu Ewigkeit“. Und bei Daniel: „Mit lauter Stimme rief Susanna und sprach: Ewiger Gott, der Du das Verborgene kennst und alles weißt, ehe es geschieht“. Ausdrücke also wie: „er war einmal nicht“ oder „bevor er wurde“, oder „als“, kurz, alle solcher Art werden passenderweise nur von gewordenen und geschaffenen Dingen gebraucht, die aus Nichtseiendem entstanden sind, haben aber mit dem Worte nichts zu tun. Wenn aber die Schrift diese Ausdrücke von den gewordenen Dingen, das Wort „ewig“ aber vom Sohne gebraucht, dann ist also nicht, ihr Gottesfeinde, der Sohn aus Nichtseiendem entstanden, noch gehört überhaupt der Sohn zu den gewordenen Dingen, sondern ist des Vaters ewiges Bild und Wort, das niemals nicht war, sondern immer ist, da er des ewigen Lichtes ewiger Abglanz ist. Was phantasiert ihr also von Zeiten vor dem Sohne? Oder was setzt ihr in blasphemischer Weise das Wort hinter die Zeiten, durch das doch auch die Zeiten erst entstanden sind? Denn wie wäre überhaupt eine Zeit oder ein Jahrhundert entstanden, wenn, wie ihr wähnt, das Wort noch nicht erschienen wäre, durch das doch alles entstanden, und ohne das auch gar nichts geworden ist? Oder warum sagt ihr, die Zeit nur andeutend, nicht frei heraus: „Es gab eine Zeit, da das Wort nicht war“? Aber ihr haltet mit dem Worte „Zeit“ zurück, um die Arglosen zu hintergehen; eure Gesinnung verdeckt ihr aber damit durchaus nicht; ja wenn ihr sie auch zu verbergen sucht, so könnt ihr doch nicht verborgen bleiben. Ihr deutet ja die Zeiten an, wenn ihr sagt: „Es war einmal, da er nicht war“ und: „Er war nicht, bevor er gezeugt wurde“.</p><p>Wenn man das so nachweist, dann werden sie noch unverschämter und sagen: Wenn nie einmal war, da er nicht war, sondern wenn der Sohn ewig ist und zugleich mit dem Vater existiert, so nennt ihr ihn doch nicht mehr Sohn, sondern Bruder des Vaters. O die Unverständigen und Streitsüchtigen! Wenn wir von ihm nur das ewige Sein mit dem Vater aussagten und ihn nicht auch Sohn nennen würden, dann hätte ihre erheuchelte Gewissenhaftigkeit einige Glaubwürdigkeit. Wenn wir ihn aber ewig nennen und zugleich als Sohn aus dem Vater bekennen, wie kann der Erzeugte als Bruder des Erzeugers gelten? Und wenn unser Glaube den Vater und Sohn zum Inhalt hat, welches Bruderverhältnis besteht dann unter diesen? Oder wie kann das Wort Bruder desjenigen genannt werden, dessen Wort es ist? Es ist indes das kein Einwand, der aus Unwissenheit erhoben würde, erkennen sie ja doch auch selbst die Wahrheit. Es ist vielmehr ein jüdischer Vorwand, der, wie Salomon sagte, von solchen kommt, die sich von der Wahrheit trennen wollen. Denn nicht aus einem früher existierenden Prinzip wurden der Vater und der Sohn erzeugt, um für Brüder gehalten zu werden, sondern der Vater ist das Prinzip des Sohnes und sein Erzeuger, und der Vater ist Vater und ist nicht jemands Sohn geworden. Und der Sohn ist Sohn und nicht Bruder. Wenn er nun ewige Zeugung des Vaters genannt wird, so heißt er so mit Recht. Denn nie war die Wesenheit des Vaters unvollkommen, so daß das ihr Eigentümliche erst nachträglich hinzugekommen wäre, Auch ist der Sohn nicht wie ein Mensch aus einem Menschen erzeugt worden, so daß er später wäre als die väterliche Existenz, sondern er ist eine Zeugung Gottes, und als des ewigen Gottes eigener Sohn existiert er von Ewigkeit her. Den Menschen ist es ja eigen, in der Zeit zu zeugen, weil ihre Natur unvollkommen ist. Die Zeugung Gottes aber ist ewig, weil seine Natur immer vollkommen ist. Wenn er also nicht Sohn, sondern ein Gebilde aus Nichtseiendem geworden ist, so mögen sie es uns erst beweisen und dann mögen sie in ihrer Einbildung wie von einem Gebilde kreischen: “Es war einmal, da er nicht war”. Denn das Gewordene ist geworden, da es nicht war. Wenn er aber Sohn ist — und das sagt der Vater und verkündet laut die Schrift —, der Sohn aber nichts anderes ist als die Zeugung vom Vater, das vom Vater Gezeugte aber sein Wort, seine Weisheit und sein Abglanz ist, was muß man dann anders sagen als daß sie mit den Worten: “Es war einmal, da der Sohn nicht war”, wie Räuber Gott das Wort entziehen und geradezu von ihm behaupten, daß er einmal ohne sein eigenes Wort und seine Weisheit existierte, und das Licht einmal ohne Glanz und die Quelle unfruchtbar und trocken war? Denn wenn sie auch das Wort “Zeit” heuchlerisch meiden aus Furcht vor ihren Tadlern und sagen, daß er vor den Zeiten war, so nehmen sie doch gewisse Zeiträume an, in denen er nach ihrer Einbildung nicht war, und sind sehr gottlos, da sie nichtsdestoweniger von Zeiten reden und bei Gott ein Fehlen von Wort [Vernunft] und Weisheit annehmen.</p><p>Wenn sie aber auch den Namen des Sohnes wiederum zugestehen, weil sie nicht offen von allen verurteilt werden wollen, aber doch bestreiten, daß dieser die eigene Zeugung aus dem Wesen des Vaters sei, wie wenn dies ohne die Vorstellung von Teilen und Teilungen nicht möglich wäre, so behaupten sie damit trotzdem wieder, daß er nicht wahrer Sohn sei, und nennen ihn nur dem Namen nach Sohn. In welch schwerer Täuschung aber befinden sie sich nicht, wenn sie über das Unkörperliche sich körperliche Vorstellungen machen und wegen der Ohnmacht der eigenen Natur das in Abrede stellen, was dem Vater naturgemäß und eigen ist! Natürlich müssen sie, die nicht wissen, wie Gott ist oder woher der Vater, auch ihn leugnen, da sie in ihrem Unverstand auch die Zeugung des Vaters nach ihrer Natur bemessen. Da es mit ihnen nun so steht, und da sie glauben, daß es einen Sohn Gottes nicht geben könne, muß man Mitleid mit ihnen haben. Aber man muß sie auch ins Verhör nehmen und widerlegen. Vielleicht kommen sie auf diese Weise zur Besinnung. Wenn nach eurer Meinung der Sohn aus Nichtseiendem ist und nicht war, ehe er geboren ward, so wird er wohl allem nach nur infolge der Teilnahme selbst auch Sohn, Gott und Weisheit genannt. Denn so ist auch alles andere entstanden und wird geheiligt und verherrlicht. Ihr müßt mir nun sagen, woran er teilnimmt. Alles andere nämlich hat am Geiste Anteil; an wem aber hätte nun er nach eurer Meinung Anteil? Am Geiste? Aber der Geist empfängt doch selbst vielmehr vom Sohne, wie er selbst gesagt hat, und unvernünftig ist die Behauptung, dieser werde von jenem geheiligt. So nimmt er also am Vater Anteil; denn das allein bleibt noch übrig, und das muß man auch behaupten. Was ist nun dies oder woher stammt es? Ist es nun etwas von außen her vom Vater Erdachtes, dann hätte er wieder nicht mehr am Vater teil, sondern an dem außer ihm Liegenden, und er wird auch nicht mehr der zweite nach dem Vater sein, da er jenes Ding vor sich hat, noch auch würde man ihn des Vaters Sohn nennen, sondern Sohn jenes Dinges, an dem er auch teilnimmt und darum Sohn und Gott genannt wurde. Ist dies aber ungereimt und gottlos, weil der Vater sagt: „Dies ist mein geliebter Sohn“, und auch der Sohn Gott für seinen Vater erklärt, so ist offenbar das, woran er teilhat, nicht außerhalb des Vaters, sondern aus seinem Wesen. Wenn aber das wieder etwas anderes ist als das Wesen des Sohnes, dann werden wir wieder auf die gleiche Ungereimtheit stoßen, da man in diesem wieder ein Mittelding findet zwischen dem Vater und dem Wesen des Sohnes, welcher Art dies auch sein mag.</p><p>Da diese Ansichten also ungereimt sind und offenbar mit der Wahrheit im Widerspruch stehen, so muß man sagen: das, was aus dem Wesen des Vaters stammt, ist durchaus dessen eigener Sohn. Denn daß in allem an Gott Anteil genommen werde, kommt der Behauptung gleich, daß Gott zeuge. Auf was anders aber weist „zeugen“ hin als auf „Sohn“? Am Sohne selbst also nimmt alles Anteil gemäß der von ihm stammenden Gnade des Geistes, und daraus erhellt, daß der Sohn selbst an nichts Anteil hat, das aber, woran am Vater Anteil genommen wird, der Sohn ist. Denn wenn wir am Sohn Anteil haben, sagt man von uns: wir hätten an Gott Anteil, und eben das sagte Petrus mit den Worten: „Damit ihr teilhaft werdet der göttlichen Natur“, wie auch der Apostel sagt: „Wißt ihr nicht, daß ihr ein Tempel Gottes seid?“ und: „Denn wir sind ein Tempel des lebendigen Gottes“. Und indem wir den Sohn selbst sehen, sehen wir den Vater. Denn das Erkennen und Begreifen des Sohnes ist ein Erkennen des Vaters, weil er die eigene Zeugung aus seinem Wesen ist. Wie aber wohl niemand aus euch die Teilnahme ein Leiden oder eine Teilung des Wesens Gottes nennen würde — es ist ja gezeigt und zugegeben worden, daß eine Teilnahme an Gott stattfindet, und daß Teilnahme und Zeugung dasselbe sind —, so ist die Zeugung kein Leiden und auch keine Teilung jener seligen Wesenheit. Es ist also nicht unglaublich, daß Gott einen Sohn habe, die Zeugung seines eigenen Wesens. Und wir denken daher auch nicht an ein Leiden oder eine Teilung des Wesens Gottes, wenn wir von Sohn und Zeugung reden, sondern wir haben vielmehr diesen Glauben, indem wir das Echte, Wahre und Eingeborene an Gott erkennen. Da diese Wahrheit so herausgestellt und bewiesen ist, daß diese Zeugung aus dem Wesen des Vaters der Sohn ist, so ist es wohl niemand mehr zweifelhaft, sondern ganz klar, daß diese die Weisheit und das Wort des Vaters ist, in dem und durch das er alles erschafft und macht, und sie ist sein Abglanz, in dem er alles erleuchtet und sich offenbart, wem er will. Sie ist sein Ausdruck und Abbild, in dem er geschaut und erkannt wird, weshalb auch er und der Vater eins sind. Denn wer ihn sieht, sieht auch den Vater. Diese Zeugung ist Christus, in dem alles erlöst wurde, und in dem er die Schöpfung wieder erneuert hat. Da also der Sohn so beschaffen ist, so schickt es sich nicht, sondern ist gar sehr verhängnisvoll zu sagen, dieser sei ein Geschöpf aus dem Nichtseienden, oder „er war nicht, bevor er geboren wurde“. Denn wer sich über das, was dem Wesen des Vaters eigen ist, so ausspricht, der lästert wider den Vater selbst, indem er über ihn Ähnliches denkt, was er auch von seiner Zeugung zusammenspinnt und lügt.</p><p>Es wäre nun dies allein schon eine hinreichende Widerlegung der arianischen Häresie. Gleichwohl mag man aber auch aus folgendem ihre Andersgläubigkeit ersehen. Wenn Gott Schöpfer und Bildner ist, durch den Sohn aber die Geschöpfe schafft, und man nichts in anderer Weise kann entstehen sehen als eben durch das Wort, ist es dann, wenn doch Gott Schöpfer ist, nicht gotteslästerlich zu behaupten, daß sein schöpferisches Wort und seine schöpferische Weisheit einmal nicht gewesen seien? Denn das kommt der Behauptung gleich, daß Gott auch nicht Schöpfer ist, wenn er ja kein eigenes schöpferisches Wort aus sich selbst hat, sondern der, in dem er schafft, von außen in ihn hineingetragen wird, ihm fremd und dem Wesen nach unähnlich ist. Dann aber sollen sie uns sagen oder besser gleich zur Einsicht kommen von ihrer Gottlosigkeit, die in den Worten liegt: „Es war einmal, da er nicht war“ und; „Er war nicht, bevor er gezeugt wurde“. Denn wenn das Wort nicht von Ewigkeit her mit dem Vater existiert, dann ist die Dreiheit nicht ewig, sondern es bestand zuerst eine Einheit; aber durch Zuwachs ward später eine Dreiheit, und erst im Laufe der Zeit wuchs und gestaltete sich nach ihnen das theologische Wissen von Gott. Und wiederum: wenn der Sohn nicht die eigene Zeugung aus der Wesenheit des Vaters, sondern aus Nichtseiendem geworden ist, so setzt sich die Dreiheit aus Nichtseiendem zusammen, und es war einmal, da es nicht eine Dreiheit gab, sondern eine Einheit; und einmal ist die Dreiheit mangelhaft, ein andermal vollständig: mangelhaft, ehe der Sohn wurde, vollständig, nachdem er geworden ist. Und von da an wird auch das Geschaffene dem Schöpfer zugezählt und, was einmal nicht existierte, wird mit dem Ewigen zugleich als Gott betrachtet und verherrlicht. Ja noch mehr: man findet die Dreiheit als sich selbst unähnlich, da sie sich aus fremden, verschiedenartigen Naturen und Wesenheiten zusammensetzt. Es heißt dies aber nichts anderes als ein allmähliches Entstellen der Dreiheit annehmen. Was ist aber das für eine Religion, die nicht einmal sich gleich bleibt, sondern erst im Laufe der Zeiten zur Vollendung kommt und bald so, bald anders sich verhält? Denn wahrscheinlich wird sie auch ferner einen Zuwachs erhalten, und zwar ohne Aufhören, da sie ja einmal auch im Anfang durch Zuwachs ihren Bestand erhalten hat. Doch zweifellos kann sie auch abnehmen; denn was hinzugesetzt wird, kann offenbar auch wieder weggenommen werden.</p><p>Es verhält sich aber nicht so; ferne sei es! Die Dreiheit ist nicht geworden, sondern eine ewige und einzige Gottheit ist in der Dreiheit, und nur Eine Herrlichkeit der hl. Dreiheit gibt es. Und ihr erkühnt euch, sie in verschiedene Naturen zu spalten. Während der Vater ewig ist, sagt ihr von dem, der neben ihm sitzt, vom Wort, daß einmal war, da es nicht war, und während der Sohn neben dem Vater sitzt, nehmt ihr euch den Mut, ihn vom Vater zu trennen. Die Dreiheit ist bildend und schaffend tätig, und ihr nehmt keinen Anstand, sie zu den Dingen aus dem Nichts herabzuwürdigen; ihr schämt euch nicht, den Sklavenstand dem Adel der Dreiheit gleichzusetzen und den König, den Herrn der Heerscharen, den Untertanen an die Seite zu stellen. Laßt ab, das Unvereinbare zu vermengen und gar das Nichtseiende mit dem Seienden! Mit solchen Reden könnt ihr dem Herrn nicht Ehre und Ruhm, sondern nur Unehre und Schmach antun. Denn, wer den Sohn entehrt, entehrt den Vater. Wenn nämlich jetzt in der Dreiheit die Gotteserkenntnis vollkommen ist, und da die einzig wahre Gottesverehrung ist, wo die Schönheit und die Wahrheit ist, so müßte dies immer so sein, damit nicht die Schönheit und Wahrheit als Zugabe und die Vollendung der Gotteserkenntnis als erst durch Zuwachs eingetreten erscheine. Es mußte dies also von Ewigkeit her so sein. Wenn es aber nicht von Ewigkeit her so war, so könnte die Gottesverehrung auch jetzt nicht so sein, sondern so, wie ihr sie für den Anfang voraussetzt, so daß auch jetzt keine Dreiheit wäre. Doch kein Christ kann solche Häretiker ertragen. Heiden freilich ist dies eigen, daß sie eine gewordene Dreiheit annehmen und sie mit geschaffenen Dingen vermengen. Die gewordenen Dinge nämlich sind einer Ab- und Zunahme fähig. Der Christen Glaube aber kennt nur eine unveränderliche, vollkommene und immer sich gleichbleibende selige Dreiheit und setzt dieser weder ein Mehr hinzu, noch auch nimmt er an, daß sie jemals mangelhaft gewesen sei; beides nämlich ist gottlos. Deshalb erkennt er auch, daß sie sich mit den gewordenen Dingen nicht vermischt habe, und betet die untrennbare Einheit ihrer Gottheit an, an der er festhält, flieht die Lästerungen der Arianer und bekennt und weiß, daß der Sohn ewig ist. Denn er ist ewig wie der Vater, dessen ewiges Wort er auch ist. Denn auch dies wollen wir wieder näher ins Auge fassen.</p><p>Wenn Gott die Quelle der Weisheit und des Lebens ist und genannt wird, wie es bei Jeremias heißt: “Mich haben sie verlassen, die Quelle des lebendigen Wassers”, und wieder: “Erhabener Thron der Herrlichkeit, unsere Heiligung, Hoffnung Israels, o Herr! Alle, die Dich verlassen, sollen zu Schanden werden, die Dir fernestehen, sollen auf den Erdboden geschrieben werden, weil sie den Herrn, die Quelle lebendigen Wassers, verlassen haben, bei Baruch aber geschrieben steht:”Die Quelle der Weisheit habt ihr verlassen“, so folgt daraus wohl, daß das Leben und die Weisheit dem Wesen der Quelle nicht fremd, sondern eigen sind, und niemals existenzlos, sondern immer waren. Es ist dies aber der Sohn, der sagt:”Ich bin das Leben“ und:”Ich, die Weisheit, wohne im Rate“. Wie nun, ist der nicht gottlos, der sagt:”Es war einmal, da der Sohn nicht war“? Denn das kommt der Behauptung gleich: Es war einmal, da die Quelle ausgetrocknet, ohne das Leben und die Weisheit war. Das wäre aber gar keine Quelle. Denn das, was nicht aus sich selbst erzeugt, ist keine Quelle. Wie voll Ungereimtheit ist nicht dies! Denn Gott verkündet, daß die, welche seinen Willen tun, wie eine Quelle sein werden, der das Wasser nicht ausgeht, indem er durch den Propheten Isaias spricht:”Du wirst gesättigt werden, wie deine Seele sich sehnt, und deine Gebeine werden fett werden und werden sein wie ein getränkter Garten und wie eine Quelle, deren Wasser nie versiegt“. Diese aber wagen es, Gott, der die Quelle der Weisheit heißt und ist, zu lästern, als wäre er unfruchtbar und einmal ohne seine eigene Weisheit gewesen. Aber was aus ihrem Munde kommt, ist Lüge. Die Wahrheit aber bezeugt, daß Gott die ewige Quelle seiner eigenen Weisheit sei. Wenn aber die Quelle ewig ist, dann muß auch die Weisheit ewig sein. Denn in dieser ist auch alles entstanden, wie David singt:”Alles hast Du in Weisheit gemacht“ und Salomo sagt:”Gott hat durch seine Weisheit die Erde befestigt und die Himmel bereitet in Einsicht“. Die Weisheit selbst ist das Wort, und durch dieses wurde, wie Johannes sagt, alles, und ohne dasselbe ist nichts geworden. Dieses selbst aber ist Christus.”Denn Einer ist Gott, der Vater, aus dem alles, und dem auch wir angehören, und Einer ist der Herr, Jesus Christus, durch den alles und wir durch ihn“. Wenn aber alles durch ihn ist, so kann er selbst nicht zu allem gerechnet werden. Denn wer zu behaupten wagt, daß der, durch den alles ist, Einer von allem sei, wird gewiß doch auch von Gott, aus dem alles ist, dieselbe Ansicht haben. Wenn aber einer diese Ansicht als ungereimt von sich weist und Gott von allem als einen andern trennt, so darf man füglich auch den eingeborenen, wesenseigenen Sohn des Vaters vom All verschieden nennen. Wenn er aber nicht zu allem gehört, so kann man nicht mit Recht von ihm sagen:”Es war einmal, da er nicht war" und: “Er war nicht, bevor er gezeugt wurde”. Denn solche Ausdrücke mag man zutreffend auf die Geschöpfe anwenden. Der Sohn selbst ist aber so beschaffen wie der Vater, dessen wesenseigene Zeugung, Wort und Weisheit er auch ist. Denn das ist dem Sohne dem Vater gegenüber eigen, und das zeigt, daß der Vater dem Sohne eigen ist, so daß man weder Gott jemals das Wort, noch dem Sohne jemals die Existenz absprechen kann. Denn wie wäre er Sohn, wenn er nicht von ihm wäre, oder wie wäre er Wort und Weisheit, wenn er nicht immer und ihm eigen wäre?</p><p>Wann also war Gott getrennt von dem, was ihm eigen ist? Oder wie kann einer das, was eigen ist, als etwas Fremdes und Andersartiges sich denken? Denn alles andere, was geworden ist, hat seinem Wesen nach keine Ähnlichkeit mit dem, der es gemacht hat, sondern es existiert außerhalb von ihm, durch seine Gnade und nach seinem Willen durch das Wort entstanden, so daß es auch wieder einmal aufhören kann, wenn es dem, der es geschaffen, beliebt. Denn solcher Natur ist das Gewordene. Wie ist es aber nicht verwegen und gottlos, von dem, was dem Wesen des Vaters eigen ist, — denn als dies ist der Sohn anerkannt, — zu behaupten, daß es aus Nichtseiendem stamme, und daß es nicht war, bevor es gezeugt wurde, sondern daß es hinzugekommen sei, und daß es einmal wieder nicht sein könne? Wer aber auch nur so denkt, der möge erwägen, wie die Vollkommenheit und die Fülle der Wesenheit des Vaters beseitigt wird, und man wird dann wieder deutlicher das Ungereimte an dieser Häresie erkennen, wenn man bedenkt, daß der Sohn Bild und Abglanz des Vaters, Gestalt und Wahrheit ist. Denn wenn, die Existenz des Lichtes vorausgesetzt, der Abglanz sein Bild und, die Existenz der Wesenheit angenommen, ihre Gestalt unversehrt ist, und existiert die Wahrheit, wenn der Vater ist, so mögen sie, wenn sie das Bild und die Gestalt der Gottheit mit der Zeit messen, erwägen, in welch tiefen Abgrund der Gottlosigkeit sie fallen. Denn wenn der Sohn nicht war, bevor er gezeugt wurde, so war die Wahrheit nicht immer in Gott. Aber so zu sprechen wäre Unrecht. Denn wenn der Vater war, war in ihm immer die Wahrheit, die der Sohn ist, der sagt: „Ich bin die Wahrheit“. Und wenn die Wesenheit existiert, so muß absolut notwendig sofort auch deren Gestalt und Bild existieren. Denn nicht von außen her ist das Bild Gottes gezeichnet, sondern Gott selbst ist dessen Erzeuger, in dem er sich selbst schaut und an dem er sich freut, wie der Sohn selbst sagt: „Ich war es, woran er sich freute“. Wann sah also der Vater sich nicht in seinem Bilde? Oder wann freute er sich nicht daran, um kühn behaupten zu können: Das Bild ist aus dem Nichtseienden, und nicht freute sich der Vater, ehe das Bild geworden war? Wie könnte auch der Bildner und Schöpfer sich in einer geschaffenen und gewordenen Wesenheit sehen? Denn das Bild muß so beschaffen sein, wie dessen Vater beschaffen ist.</p><p>Wohlan also, wir wollen die Eigenschaften des Vaters betrachten, um auch vom Bilde zu erkennen, ob es das seinige ist. Ewig ist der Vater, unsterblich, mächtig, Licht, König, Allmächtiger, Gott, Herr, Schöpfer und Bildner. Dies muß im Bilde sein, damit der, welcher den Sohn gesehen, in Wahrheit den Vater gesehen habe. Wenn aber dem nicht so ist, sondern, wie die Arianer meinen, der Sohn geworden und nicht ewig ist, so ist dies nicht das wahrhafte Bild des Vaters, wenn sie nun nicht etwa jedes Schamgefühls bar behaupten, daß die für den Sohn gewählte Bezeichnung „Bild“ nicht eine Bezeichnung ähnlicher Wesenheit, sondern bloß ein Name für ihn sei. Aber das ist wieder, ihr Christusfeinde, kein Bild und kein Abriß. Denn welche Ähnlichkeit besteht zwischen dem, was aus dem Nichtseienden ist, und dem, der das Nichtseiende ins Dasein gerufen? Oder wie kann dem Seienden das Nichtseiende ähnlich sein, das an dem Gebrechen leidet, daß es einmal nicht war und zu den gewordenen Dingen gehört? Weil nämlich die Arianer ihn so beschaffen wissen wollten, ersannen sie sich folgende Schlüsse: Wenn der Sohn eine Zeugung und ein Bild des Vaters und in allem dem Vater ähnlich ist, so muß der Sohn, wie er gezeugt ist, notwendig auch zeugen und selbst Vater und Sohn werden, und der von ihm Gezeugte auch selbst wieder zeugen und so der Reihe nach fort ins Unendliche. Denn dies bekundet die Ähnlichkeit des Erzeugten mit dem Erzeuger. Erfinder von Gotteslästerungen sind in Wahrheit die Gottesfeinde, da sie, um den Sohn nicht als Bild des Vaters anerkennen zu müssen, vom Vater selbst leibliche und irdische Vorstellungen machen und bei ihm von Teilungen, Ab- und Zufluß reden. Wenn nun Gott wie ein Mensch ist, so mag er auch Erzeuger sein wie ein Mensch, damit auch der Sohn Vater eines andern wird, und so mögen sie der Reihe nach voneinander entstehen, damit nach ihrer Ansicht die Nachfolge zu einer Menge von Göttern sich vermehre. Wenn aber Gott nicht wie ein Mensch ist, — er ist es nämlich nicht, — so darf man auf ihn keine menschlichen Eigentümlichkeiten übertragen. Denn die unvernünftigen Wesen und die Menschen werden nach einem im Anfang erfolgten Schöpfungsakt der Reihe nach voneinander erzeugt und, der gezeugt wird, wird, von einem erzeugten Vater erzeugt, natürlich auch selbst Vater eines andern, indem er diese ihm eigene Kraft von einem Vater hat, aus dem er auch selbst entsprossen ist. Deshalb gibt es auch bei solchen nicht eigentlich einen Vater und nicht eigentlich einen Sohn, und es ist bei ihnen auch der Begriff „Vater“ und der Begriff „Sohn“ nicht etwas Bleibendes. Denn derselbe wird Sohn und Vater, Sohn des Erzeugers und Vater des von ihm Gezeugten. Bei der Gottheit aber ist es nicht so. Denn Gott ist nicht wie ein Mensch. Es ist der Vater nicht aus einem Vater, — deshalb zeugt er auch keinen, der Vater werden soll, — noch entstammt der Sohn einem Ausfluß des Vaters, und er ist auch nicht von einem erzeugten Vater erzeugt. Darum ist er auch nicht erzeugt, um zu zeugen. Daher ist nur bei der Gottheit der Vater im eigentlichen Sinne Vater und der Sohn im eigentlichen Sinne Sohn, und auch nur bei diesen bleibt in Geltung, daß Vater „immer Vater sein“ und Sohn „immer Sohn sein“ bedeutet.</p><p>Wer also danach forscht, warum der Sohn nicht zeugungsfähig sei, möge nachforschen, warum der Vater keinen Vater hatte. Aber beides ist ungereimt und jeglicher Gottlosigkeit voll. Denn wie der Vater immer Vater ist und nie Sohn werden kann, so ist auch der Sohn immer Sohn und kann niemals Vater werden. Denn gerade darin zeigt sich noch mehr, daß er Abriß und Bild des Vaters ist und bleibt, was er ist, und sich nicht ändert, sondern vom Vater die Unveränderlichkeit [seines Wesens] hat. Wenn nun der Vater sich ändert, so mag auch das Bild sich ändern. Denn in diesem Verhältnis steht zum Erzeuger sein Bild und Abglanz. Wenn aber der Vater unveränderlich ist und, was er ist, bleibt, so bleibt notwendig auch das Bild, was es ist, und wird sich nicht verändern. Er ist aber Sohn aus dem Vater. Er wird also nicht etwas anderes werden, als was der Wesenheit des Vaters eigen ist. Vergebens also sannen die Unverständigen auch dies aus, sie, die vom Vater das Bild loslösen wollten, um den Sohn der Kreatur gleichzustellen. Indem nun die Anhänger des Arius nach der Lehre des Eusebius ihn in die Reihe des erschaffenen Wesen stellten und ihn dem gleichgeartet erachteten, was durch ihn entsteht, so weichen sie von der Wahrheit ab, und indem sie sich trügerische Sprüchlein schmiedeten, gingen sie im Anfang, als sie diese Häresie schufen, überall herum, und noch bis zur Stunde treffen einige von ihnen mit Kindern auf dem Markte zusammen und fragen sie natürlich entfernt nicht nach der Schrift, sondern sie reden gleichsam „aus dem Überfluß ihres Herzens“: „Hat der Seiende den Nichtseienden aus dem Seienden gemacht oder den Seienden? Hat er ihn also als einen Seienden gemacht oder als einen Nichtseienden?“ Und wiederum: „Ist das Ungewordene Eins oder sind es zwei?“ Ferner: „Ist er selbstmächtig und ändert er sich, obwohl veränderlicher Natur, aus eigenem Entschlusse nicht? Denn nicht ist er wie ein Stein, der von sich aus unbeweglich bleibt“. Dann wenden sie sich auch an die Weiblein und belästigen sie mit ihren unziemlichen Reden: „Hattest du einen Sohn, bevor du gebarest? So wie du keinen Sohn hattest, war auch der Sohn Gottes nicht, bevor er geboren wurde“. Mit solchen Phrasen scherzen und tanzen die Ehrlosen und machen Gott den Menschen gleich. Und sie, die sich Christen nennen, vertauschen die Herrlichkeit Gottes mit der Ähnlichkeit eines Bildes von einem vergänglichen Menschen.</p><p>Man sollte nun eigentlich auf ein so unsinniges und törichtes Zeug gar keine Antwort geben. Damit es aber nicht scheine, als wäre ihre Häresie irgendwie begründet, so muß man sie wenigstens im Vorbeigehen auch hierin widerlegen, besonders mit Rücksicht auf die von ihnen leicht hintergangenen Weiblein. Sie hätten aber bei diesen ihren Behauptungen auch einen Baumeister fragen sollen: „Kannst du ohne verfügbares Material ein Haus bauen? Wie du aber es nicht kannst, so konnte auch Gott ohne Baumaterial das Weltganze nicht erschaffen“. Sie müßten dann auch jeden Menschen fragen: „Kannst du sein ohne Raum? Wie es aber du nicht sein kannst, so ist auch Gott im Raume“. Denn dann könnten sie wenigstens von ihren Zuhörern beschämt werden. Oder warum leugnen sie, wenn sie hören, daß Gott einen Sohn habe, diesen im Hinblick auf sich selbst, spielen aber, wenn sie hören, daß er erschafft und hervorbringt, nicht mehr die menschlichen Verhältnisse dagegen aus? Sie sollten doch auch beim Schaffen an das Menschliche denken und Gott einen Stoff zur Verfügung stellen, um Gott auch als Schöpfer leugnen und fürderhin mit den Manichäern sich im Staube wälzen zu können. Wenn aber die Vorstellung von Gott darüber hinausgeht und jemand bloß auf das Hören hin glaubt und weiß, daß er nicht ist, wie wir sind, sondern wie ein Gott ist, und daß er schafft, nicht wie Menschen schaffen, sondern wie Gott schafft, so ist klar, daß er nicht zeugt, wie Menschen zeugen, sondern wie Gott zeugt. Denn nicht ahmt Gott den Menschen nach, vielmehr wurden die Menschen wegen Gott, der im eigentlichen Sinne und allein wahrhaft Vater seines Sohnes ist, selbst Väter ihrer eigenen Kinder genannt; „denn nach ihm wird jede Vaterschaft im Himmel und auf Erden genannt“. Ja, wenn ihre Worte ungeprüft bleiben, so glaubt man, sie hätten etwas Vernünftiges gesagt. Wenn man sie aber logisch untersucht, so wird es sich herausstellen, daß sie bittern Spott und Hohn verdienen.</p><p>Fürs erste ist jene ihre erste Frage töricht und unklar. Denn sie stellen ihren Fragepunkt gar nicht heraus, so daß der Gefragte auch eine Antwort geben könnte, sondern sie sagen einfach: “Der Seiende den Nichtseienden”. Wer ist denn der Seiende und was das Nichtseiende, ihr Arianer? Oder wer ist der Seiende und wer der Nichtseiende, und was wird seiend genannt und was nichtseiend? Denn der Seiende kann das Nichtseiende machen wie das Seiende und wie das Vorausgegangene. Es bearbeitet ja ein Zimmermann, Goldschmied und Töpfer den Stoff, der vorhanden ist und schon vor ihm existierte, nach der ihm eigenen Fertigkeit und macht beliebige Geräte. Er aber, der Gott aller Dinge, nimmt den vorhandenen, von ihm bereits geschaffenen Staub von der Erde und bildet den Menschen. Doch die Erde selbst wieder, die ehedem nicht war, hat er später durch sein eigenes Wort ins Dasein gesetzt. Wenn sie nun so fragen, so ist offenkundig, daß die Kreatur nicht war, bevor sie wurde, daß aber die Menschen den vorhandenen Stoff bearbeiten, und ihre Rede wird zusammenhanglos erscheinen, da sowohl wird, was ist, als auch wird, was nicht ist, wie wir gesagt haben. Wenn sie aber von Gott und seinem Worte reden, so sollen sie zur Frage das Mangelnde hinzufügen und dann fragen: War der seiende Gott jemals ohne Wort und der, welcher das Licht ist, jemals ohne Licht, oder existiert immer ein Vater des Wortes? Oder auch wieder so: Hat der seiende Vater das nichtseiende Wort gemacht oder hat er das eigene Wort, die Zeugung seiner Wesenheit, immer bei sich, so daß man auch erkennen könnte, daß sie überhaupt über Gott und den, der aus ihm ist, zu neugierig forschen und in Sophistereien sich zu ergehen wagen. Denn wer wird sie ausstehen können, wenn sie sagen, daß Gott jemals ohne Wort gewesen sei. Sie sind nämlich wieder gleich den früheren auf dasselbe gestoßen, obgleich sie dieser Klippe zu entgehen bezw. sie durch ihre Spitzfindigkeiten zu verbergen suchten; doch es gelang ihnen nicht. Denn niemand würde sie auch nur hören wollen, wenn sie behaupteten, Gott sei nicht immer Vater gewesen, sondern sei dies erst später geworden, um so sich einbilden zu können, daß auch sein Wort einmal nicht gewesen, da ja die bereits genannten Gegengründe nicht wenige sind, und auch Johannes sagt: “Es war das Wort” und Paulus wiederum schreibt: “Welcher der Abglanz der Herrlichkeit ist” und: “Welcher ist über alles, Gott, gepriesen in Ewigkeit. Amen”.</p><p>Es wäre nun wohl besser, wenn sie schwiegen. Da sie aber nicht nachlassen, so mag man ihnen nunmehr herzhaft auf eine solche unverschämte Frage ihrerseits in gleicher Weise folgende Fragen entgegenhalten. Vielleicht werden sie, wenn sie sich in die ähnlichen Ungereimtheiten verwickelt sehen, ablassen vom Kampf gegen die Wahrheit. Innig möge man also erst Gott um seine Gnade anflehen und dann mag man ihnen also begegnen: Ist der seiende Gott, da er nicht war, geworden, oder ist er auch, bevor er geworden ist? Hat er also, da er war, sich selbst gemacht oder ist er aus nichts und ist er, da er zuvor nichts war, plötzlich von selbst erschienen? Ungereimt ist eine solche Frage, ja ungereimt und der Lästerung voll, aber der ihrigen ähnlich. Denn mag ihre Aussage so oder so lauten, sie ist voll jeglicher Gottlosigkeit. Wenn aber diese Fragestellung über Gott blasphemisch und der Gottlosigkeit voll ist, so ist wohl auch derartiges Fragen über seine Weisheit blasphemisch. Man muß aber gleichwohl zur Lösung dieser ihrer unvernünftigen und törichten Frage also antworten, daß Gott der ewig Seiende ist. Da der Vater immer ist, so ist auch ewig dessen Abglanz, der ja sein Wort ist, und wiederum hat der seiende Gott aus sich das Wort auch als seiendes. Und weder ist das Wort nachträglich geworden, während es früher nicht war, noch war der Vater jemals ohne Wort. Denn die Vermessenheit gegen den Sohn führt zur Lästerung wider den Vater, wenn er sich ja eine Weisheit, ein Wort und einen Sohn von außen her ersonnen hat. Denn welchen von diesen Begriffen du immer nennen magst, er bezeichnet, wie gesagt, die Zeugung aus dem Vater. Deshalb ist diese ihre Frage haltlos und zwar ganz natürlich. Denn indem sie das Wort [Vernunft] leugnen, ist auch ihre Frage unvernünftig. Denn wie einer, der beim Anblick der Sonne nach ihrem Abglanz fragte und sagen würde: „Hat die Seiende den Nichtseienden gemacht oder hat sie ihn gemacht, da er war?“ als des gesunden Menschenverstandes verlustig und schwachsinnig erachtet würde, weil er ja das, was vom Lichte ausgeht, als von außen stammend annimmt und darum fragt, wann und wo und ob es gemacht worden ist, so verrät auch der, welcher über den Sohn und den Vater so denkt und Fragen aufwirft, einen weit größeren Unverstand, weil er das vom Vater kommende Wort von außen ihm zuführt und die natürliche Zeugung zur Schattenfigur eines Geschöpfes erniedrigt und sagt: „Er war nicht, bevor er gezeugt wurde“. Doch sie mögen auf ihre Frage zugleich auch noch vernehmen, daß der seiende Vater den seienden Sohn gemacht hat. Denn „das Wort ist Fleisch geworden“ und da er Gottessohn war, machte er ihn, als die Fülle der Zeiten gekommen war, auch zum Menschensohn, wenn sie nicht etwa mit dem Samosatener sagen wollen, daß er auch vor seiner Menschwerdung nicht gewesen sei. Und dies mag auf ihre erste Frage als Antwort von unserer Seite genügen.</p><p>Ihr aber, Arianer, erinnert euch eurer eigenen Aussprüche und sagt: Bedurfte der Seiende zur Erschaffung aller Dinge des Nichtseienden, oder bedurfte er seiner, als er bereits war? Denn ihr habt gesagt: Als Werkzeug hat er sich den Sohn aus dem Nichtseienden bereitet, um durch ihn alles zu machen. Was ist nun besser, das, was Bedürfnis hat, oder das, was dem Bedürfnis abhilft? Oder heben beide die gegenseitigen Bedürfnisse? Indem ihr nämlich solches redet, zeigt ihr mehr die Ohnmacht dessen an, der bereitet hat, wenn er ja allein nicht imstande war, alle Dinge zu schaffen, sondern von außen sich ein Werkzeug ersinnen muß wie ein Zimmermann oder Schiffsbaumeister, der ohne Axt und Säge gar nichts arbeiten kann. Was ist nun gottloser als dies? Oder was braucht man überhaupt sich dabei aufzuhalten, als wäre es von Bedeutung, da doch das bereits Gesagte hinlänglich dartut, daß ihre Reden nur Phantastereien sind. Auf ihre zweite ganz einfältige und törichte Frage aber, die sie an die Weiblein richten, sollte man ebenfalls nichts oder nur das zur Antwort geben, was wir bereits früher gesagt haben, daß man nämlich die Geburt aus Gott nicht nach der menschlichen Natur bemessen dürfe. Damit sie aber doch auch hierin sich selbst das Urteil sprechen, so ist es gut, sie wieder mit ihren eigenen Worten in folgender Weise zu schlagen. Sie sollen nur, wenn sie an Eltern über einen Sohn Fragen stellen, sich darüber Gedanken machen, woher das geborene Kind kommt. Denn wenn der Vater einen Sohn nicht hatte, bevor er ihn zeugte, so empfing er ihn, wenn er einen bekommen, nicht von außen noch als einen fremden, sondern aus sich selbst und als einen seinem Wesen eigenen und als ein unverändertes Bild, so daß dieser in jenem gesehen und jener in diesem wahrgenommen wird. Wenn sie also aus den menschlichen Beispielen die Zeit der Zeugenden abnehmen, warum berücksichtigen sie nicht vom gleichen Standpunkt aus auch die naturhafte und eigengehörige Beziehung der Kinder zu den Eltern, sondern sammeln nach Art der Schlangen aus der Erde nur das, was zur Giftbereitung dienlich ist? Sie hätten, wenn sie sich an die Eltern mit der Frage wandten: Hattest du einen Sohn, bevor du ihn erzeugtest? auch hinzufügen und sagen sollen: Wenn du einen Sohn hast, erwirbst du ihn von außen wie ein Haus oder ein anderes Besitztum? Dann würde dir zur Antwort gegeben: Er ist nicht von außen, sondern aus mir. Denn was von außen kommt, sind Besitzungen und geht von einem auf den andern über. Der Sohn aber ist aus mir und meiner Substanz eigen und ähnlich, nicht von einem andern auf mich übergegangen, sondern aus mir erzeugt. Deshalb bin ich ganz in jenem, indes ich selbst bleibe, was ich bin. So also verhält es sich. Wenn auch der Vater der Zeit nach vom Sohne verschieden ist, da er als Mensch auch in der Zeit geworden ist, so hätte doch auch er einen Sohn, der immer mit ihm existierte, wenn nicht die Natur es unmöglich machte und hinderte. Denn auch Levi war noch in den Lenden seines Urgroßvaters, bevor er gezeugt wurde und bevor der Großvater gezeugt ward. Wenn also der Mensch das Alter erreicht, in dem die Natur die Möglichkeit der Zeugung gewährt, so wird der Mensch, da die Natur kein Hindernis mehr bietet, Vater des aus ihm entsprossenen Sohnes.</p><p>Wenn sie also an Eltern bezüglich ihrer Kinder Fragen stellten und erkannten, daß die natürlichen Kinder nicht von außen, sondern von den Eltern stammen, so sollen sie auch vom Worte Gottes zugeben, daß es durchaus vom Vater kommt. Und wenn sie sich über die Zeit aufhalten, so sollen sie sagen, inwiefern sie für Gott ein Hindernis sei. Denn man muß sie mit ihren höhnischen Fragen der Gottlosigkeit überführen. Sie sollen also sagen, was Gott hindert, immer der Vater des Sohnes zu sein. Denn daß das Erzeugte vom Vater stammt, ist zugestanden. Damit aber überhaupt die, welche etwas Derartiges von Gott denken, sich selbst das Urteil sprechen, so sollen sie, wie sie die Frauen betreffs der Zeiten fragten, so die Sonne nach ihrem Abglanz und die Quelle nach ihrem Ausfluß fragen, damit sie erfahren, daß diese, wenngleich Zeugungen, doch immer auch mit denen existieren, von denen sie auch stammen. Wenn aber solche Erzeuger ihre Kinder von Natur und immer haben, warum tragen sie, wenn sie Gott für geringer halten als die geschaffenen Wesen, ihre Gottlosigkeit nicht offener zur Schau? Wenn sie sich aber nicht getrauen, offen so zu sprechen, aber zugegeben wird, daß der Sohn nicht von außen stammt, sondern eine natürliche Zeugung aus dem Vater ist, und auch gar kein Hemmnis für Gott besteht, — denn nicht wie ein Mensch ist Gott, sondern er ist sogar mehr als die Sonne oder vielmehr Gott der Sonne, — so stammt offenbar aus ihm das Wort und existiert mit dem Vater, durch das der Vater alles Nichtseiende ins Dasein gerufen hat. Daß also der Sohn nicht aus dem Nichtseienden, sondern ewig und aus dem Vater ist, und daß die Frage der Häretiker an die Eltern ihre boshafte Gesinnung verrät, das zeigt die Sache selbst. Denn sie erkannten das natürliche Verhältnis und mußten sich nun auch noch ob ihrer Fragen bezüglich der Zeit schämen.</p><p>Daß man aber nicht die Geburt Gottes mit der Natur der Menschen in Vergleich bringen und glauben darf, daß der Sohn Gottes ein Teil von ihm sei, oder gar, daß die Geburt irgend ein Leiden bedeute, haben wir im Vorausgehenden bereits gesagt und behaupten auch an dieser Stelle dasselbe: Gott ist nicht wie ein Mensch. Denn die Menschen zeugen unter Leiden, da sie eine unbeständige Natur haben und bei der Schwäche ihrer Natur die Zeiten abwarten müssen. Von Gott aber kann man dies nicht sagen. Denn er ist nicht aus Teilen zusammengesetzt, sondern, weil leidensunfähig und einfach, ist er ohne Leiden und Teilung Vater des Sohnes, und hiefür steht uns wieder ein Zeugnis und Beweis von Gewicht aus den göttlichen Schriften zu Gebote. Denn das Wort Gottes ist sein Sohn und der Sohn ist Wort und Weisheit des Vaters; Wort und Weisheit aber ist weder ein Geschöpf noch ein Teil von dem, dessen Wort es ist, noch ist es eine mit Leiden verbundene Zeugung. Indem nun die Schrift beides verband, nannte sie ihn Sohn, um damit die natürliche und wahrhafte Zeugung der Wesenheit zu verkünden. Damit aber niemand auf die Vermutung komme, daß die Zeugung eine menschliche sei, sagt sie wiederum, seine Wesenheit andeutend, er sei das Wort, die Weisheit und der Abglanz. Denn daraus schließen wir auch, daß die Geburt ohne Leiden erfolgt, ewig und Gott geziemend sei. Was für ein Leiden oder was für ein Teil vom Vater ist also das Wort, die Weisheit und der Abglanz? Denn dies können auch die Unverständigen begreifen. Wie sie sich von den Frauen Aufschluß erbaten über ihren Sohn, so sollen sie auch noch die Männer befragen bezüglich ihres Wortes, um zu erfahren, daß das Wort, das sie hervorbringen, weder ein Leiden auf ihrer Seite noch ein Teil ihres Geistes ist. Wenn aber das Wort der Menschen, obschon sie leidensfähig und teilbar sind, so beschaffen ist, warum denken sie dann bei dem unkörperlichen und unteilbaren Gott an Leiden und Teile, um dann unter dem Scheine, als wollten sie sich ja davor in acht nehmen, die wahre und natürliche Geburt des Sohnes leugnen zu können? Und daß die Zeugung Gottes nicht ein Leiden ist, ist mit dem oben Gesagten hinlänglich erwiesen. Erwiesen ist aber auch noch jetzt insbesondere, daß das Wort ohne Leiden gezeugt wurde. Sie sollen aber auch über die Weisheit das nämliche hören. Gott ist nicht wie ein Mensch; sie sollen auch in diesem Punkte von ihm keine menschliche Vorstellung machen. Denn während wiederum die Menschen so beschaffen sind, daß sie die Weisheit erst empfangen müssen, ist Gott, der an niemand Anteil hat, selbst Vater seiner Weisheit, und die an ihr teil haben, pflegt man weise zu nennen. Und es ist auch die Weisheit selbst kein Leiden und auch kein Teil, sondern die eigene Zeugung des Vaters. Deshalb ist er immer Vater und nicht ist die Vaterschaft zu Gott hinzugekommen; denn sonst müßte er als veränderlich gelten. Denn wenn sein Vatersein gut ist, er aber nicht immer Vater war, dann war füglich das Gute nicht immer in ihm.</p><p>Aber sieh doch, wenden sie ein, Gott ist auch immer Schöpfer, und die Macht zu schaffen ist nicht erst nachträglich ihm zuteil geworden. Sind nun, da er ja Schöpfer ist, auch die Geschöpfe ewig, und darf man auch von diesen nicht sagen: Sie bestanden nicht, bevor sie wurden? O die unverständigen Arianer! Welche Ähnlichkeit besteht denn zwischen Sohn und Geschöpf, um in derselben Weise vom Vater wie von den Schöpfern reden zu können? Wie können sie, nachdem im Vorausgegangenen ein so großer Unterschied zwischen Zeugung und Geschöpf nachgewiesen worden ist, in ihrer Unwissenheit verharren? Wieder muß man nun dasselbe sagen. Das Geschöpf ist, wie gesagt, außerhalb des Schaffenden; der Sohn aber ist die eigene Zeugung aus der Wesenheit. Deshalb muß auch das Geschöpf nicht immer sein. Denn der Schöpfer schafft, wann er will. Die Zeugung aber unterliegt nicht dem Willen, sondern gehört mit zur Wesenheit. Und ein Schöpfer ist wohl vorhanden, und man redet wohl von einem solchen, wenn auch noch keine Werke vorhanden sind. Vater aber wird wohl keiner genannt und ist auch keiner, wenn kein Sohn da ist. Wenn sie aber spitzfindig fragen, warum Gott, der immer schaffen könne, nicht immer schaffe, so verrät sich auch hier die Vermessenheit von Rasenden. „Denn wer hat die Gedanken des Herrn erforscht und wer ist sein Ratgeber gewesen?“. Oder wie wird das Töpfergeschirr zum Schöpfer sagen: „Warum hast du mich so gestaltet?“. Damit wir aber, nachdem wir auf einen, wenn auch nur schwachen Einwand gestoßen sind, nicht verstummen, so sollen sie hören, daß, wenn es Gott auch möglich ist, immer zu schaffen, doch die geschaffenen Dinge nicht ewig sein konnten. Denn sie sind aus Nichtseiendem und waren nicht, bevor sie wurden. Wie konnte das Nichtseiende, bevor es ward, mit dem immer seienden Gott zugleich existieren? Daher nahm Gott auf dessen Nutzen Rücksicht und hat erst dann, als er sah, daß es nach seinem Entstehen fortbestehen könne, auch alles gemacht. Und wie er sein Wort erst am Ende der Zeiten absandte, obschon er es gleich im Anfang zur Zeit des Adam und des Noe oder des Moses hätte absenden können, — denn er sah, daß dies der ganzen Schöpfung ersprießlich sei, — so machte er auch die geschaffenen Dinge, als er wollte und es für sie gut war. Der Sohn aber, der nicht ein Geschöpf, sondern dem Vater wesenseigen ist, existiert immer. Denn da der Vater immer ist, so muß auch immer sein das seinem Wesen Eigene, was ja sein Wort und seine Weisheit ist. Die Geschöpfe aber, auch wenn sie noch nicht existieren, entziehen dem Schöpfer nichts. Denn er hat die Macht zu schaffen, wann er will. Wenn aber die Zeugung nicht immer mit dem Vater existiert, so bedeutet dies eine Schmälerung der Vollkommenheit seines Wesens. Daher wurden die Geschöpfe durch sein Wort geschaffen, als er wollte, der Sohn aber ist immer die eigene Zeugung der Substanz des Vaters.</p><p>Dies erfreut die Gläubigen, betrübt aber die Häretiker, da sie ihre Häresie vernichtet sehen. Denn auch jene ihre weitere Frage: „Ist das Unentstandene Eins oder sind es zwei?“ zeigt, daß ihre Gesinnung nicht die rechte ist, sondern verdächtig und voll List. Denn nicht zur Ehre des Vaters fragen sie so, wohl aber zur Unehre des Wortes. Wenn nämlich einer, ohne ihre Verschmitztheit zu kennen, antwortet: „Das Unentstandene ist Eines“, so speien sie alsbald ihr Gift aus und sagen: Also gehört der Sohn zum Entstandenen und wir haben mit Recht gesagt: „Er war nicht, bevor er gezeugt wurde“. Denn sie mischen und mengen alles durcheinander, nur um das Wort vom Vater zu trennen und den Schöpfer aller Dinge zu den Geschöpfen zählen zu können. Fürs erste gehören sie schon daraufhin verurteilt, daß sie, die den Bischöfen des Konzils von Nicäa einen Vorhalt machen, weil sie nicht schriftgemäße, aber doch auch keine blasphemische, sondern nur auf Beseitigung ihrer Gottlosigkeit abzielende Ausdrücke gebrauchten, vor der gleichen Anklage sich nicht fürchteten und auch nicht schriftgemäße Wendungen gebrauchen und dabei auf Lästerungen wider den Herrn sinnen und weder das verstehen, was sie sagen, noch worüber sie Behauptungen aufstellen. Sie sollen also die Heiden fragen, von denen sie es gehört haben, — denn nicht aus der Schrift, sondern von jenen stammt der Fund, — damit sie von ihnen vernehmen, welche Bedeutungen der Ausdruck hat, und sich überzeugen, daß sie nicht einmal über das, wovon sie reden, richtig zu fragen verstehen. Denn ihretwillen habe auch ich mich belehren lassen, daß „unentstanden“ genannt werde, was noch nicht geworden ist, aber werden kann, wie das Holz, das noch kein Boot geworden ist, aber werden kann, und daß „unentstanden“ genannt werde, was weder geworden ist, noch jemals werden kann, z. B. aus einem Dreieck ein Viereck und aus einer geraden Zahl eine ungerade. Denn weder ist aus einem Dreieck jemals ein Viereck geworden, noch wird es ein solches jemals werden, und auch die gerade Zahl ist weder jemals zu einer ungeraden geworden noch wird sie je zu einer solchen werden. Es wird ferner „unentstanden“ genannt, was zwar existiert, aber aus nichts entstanden ist, und absolut keinen Vater besitzt. Es hat aber auch der verschlagene Sophist Asterius, der auch ein Anwalt der Häresie ist, in seiner Schrift noch beigefügt: „Unentstanden“ sei auch das, was nie gemacht wurde, sondern immer ist. Sie hätten also, wenn sie fragten, beifügen sollen, in welchem Sinn sie das „unentstanden“ nehmen, damit der Gefragte auch eine richtige Antwort geben könnte.</p><p>Wenn sie aber meinen, richtig zu fragen mit den Worten: Ist das „Unentstanden“ Eins oder sind es zwei? so mögen sie zunächst als Unwissende vernehmen, daß es vieles ist und nichts, sehr vieles das, was entstehen kann, nichts aber, soweit es nicht entstehen kann, wie wir gesagt haben. Wenn sie aber in dem Sinne fragen, wie es dem Asterius gefiel, wonach unentstanden wäre, was kein Geschöpf, sondern immer ist, so sollen sie nicht einmal, sondern oft vernehmen, daß auch der Sohn in gleicher Weise nach dieser Auffassung unentstanden genannt werden kann. Denn er gehört weder zu den gewordenen Dingen noch ist er ein Geschöpf, sondern existiert, wie bereits erwiesen, ewig mit dem Vater, wie oft sie auch sich drehen und wenden mögen, nur um wider den Herrn die Worte richten zu können: „Er ist aus Nichtseiendem und er war nicht, bevor er gezeugt wurde“. Wenn sie nun, überall durchgefallen, mit jenem Ausdruck zuletzt noch das bezeichnet wissen wollen, was existiert, aber aus nichts geworden ist, und keinen Vater hat, so sollen sie von uns vernehmen, daß der so Bezeichnete der eine und einzige unentstandene Vater ist; sie werden aber, wenn sie solches hören, nichts gewinnen. Denn auch, wenn Gott in diesem Sinn unentstanden genannt wird, ist dies kein Beweis, daß der Sohn entstanden sei, da aus den vorausgegangenen Beweisen erhellt, daß das Wort so beschaffen ist, wie sein Erzeuger. Es ist also, wenn Gott unentstanden ist, dessen Bild nicht entstanden, sondern eine Zeugung, die sein Wort und seine Weisheit ist. Denn welche Ähnlichkeit besteht zwischen dem Entstandenen und Unentstandenen? Denn wiederum dasselbe zu sagen, davor darf man sich nicht scheuen. Denn wenn sie das Entstandene dem Unentstandenen ähnlich finden wollen, so daß, wer dieses schaut, jenes sehe, so sind sie nahe daran, zu behaupten, daß auch das Unentstandene ein Bild der Geschöpfe sei, und nunmehr wird von ihnen alles durcheinander geworfen, das Entstandene wird dem Unentstandenen gleichgestellt, der Unentstandene wird erniedrigt und bemessen nach den Geschöpfen, nur um den Sohn unter die Geschöpfe einreihen zu können.</p><p>Indes glaube ich, daß auch sie selbst nicht mehr solches werden reden wollen, wenn sie dem Sophisten Asterius Glauben schenken. Denn obschon dieser bemüht ist, die arianische Häresie zu empfehlen, und behauptet, daß das Unentstandene Eins sei, so widerspricht er doch diesen, wenn er sagt, daß auch die Weisheit Gottes unentstanden und ohne Anfang sei; und ein Teil von dem, was er geschrieben hat, ist folgendes: “Es sagte der selige Paulus nicht, er predige Christum, die Kraft Gottes oder die Weisheit Gottes, sondern ohne die Beifügung des Artikels:”Kraft Gottes und Weisheit Gottes“, indem er verkündigt, daß eine andere Kraft die Gott selbst eigene und ihm angeborene und ohne Entstehung mit ihm existierende sei. Und kurz hernach:”Wenngleich seine ewige Kraft und Weisheit, welche nach der richtigen Auffassung anfangslos und unentstanden erscheint, doch wohl sicher eine und dieselbe ist“. Denn wenn er auch das Wort des Apostels unrichtig auffaßte und glaubte, daß es zwei Weisheiten gebe, so hat er doch, indem er von einer zugleich mit ihm existierenden unentstandenen Weisheit redet, ausgesprochen, daß das Unentstandene nicht mehr Eines, sondern auch noch ein anderes mit ihm unentstanden sei. Denn was zugleich existiert, existiert nicht zugleich mit sich selbst, sondern mit einem andern. Wenn sie also dem Asterius Glauben schenken, so sollen sie nicht mehr fragen; Ist das Unentstandene Eins oder sind es zwei? damit sie nicht mit ihren etwaigen Zweifeln gegen diesen ankämpfen. Wollen sie aber jenem entgegentreten, so sollen sie sich nicht mehr auf seine Schrift berufen, damit sie sich nicht gegenseitig beißen und aufzehren. Das sei in kurzem die Erwiderung auf ihre Unwissenheit. Wer könnte aber gegen ihre verschlagene Tücke hinlänglich losziehen? Wer sollte nicht die, welche solchem Wahn ergeben sind, mit Recht hassen? Denn da sie mit dem Schlagwort”aus dem Nichtseienden" und “er war nicht, bevor er gezeugt wurde” nicht mehr frei herausrücken dürfen, erfanden sie den Ausdruck “unentstanden”, um dann vor den Arglosen den Sohn einen entstandenen zu nennen und damit wieder den Sinn eben jener Redensarten “aus dem Nichtseienden” und “er war einmal nicht” zum Ausdruck zu bringen. Denn mit diesen werden die gewordenen Dinge und die Geschöpfe bezeichnet.</p><p>Sie hätten also, wenn sie auf ihre Worte bauen, bei diesen auch bleiben und nicht so mannigfach sich ändern sollen. Aber das wollen sie nicht, indem sie mit allem leicht fertig zu werden glauben, wenn sie die Häresie mit diesem Schlagwort decken und den Ausdruck “unentstanden” vorschützen. Denn auch der Ausdruck “unentstanden” hat gar keine Beziehung zum Sohne, wie auch diese dagegen kreischen mögen, sondern zum Entstandenen. Hierzu mag man eine Parallele finden in den Bezeichnungen “allmächtig” und “Herr der Mächte”. Denn wenn der Vater durch das Wort über alles herrscht und gebietet, und der Sohn als Wort und Bild des Vaters die Herrschaft des Vaters führt und die Macht über alles hat, so ist ganz klar, daß damit weder der Sohn zu allen Dingen gerechnet ist, noch auch der Vater seinetwegen Allmächtiger und Herr heißt, sondern wegen dessen, was durch den Sohn entstanden ist und worüber er durch das Wort herrscht und gebietet. Und das Wort “unentstanden” wird sonach nicht im Hinblick auf den Sohn, sondern in Hinsicht auf das, was durch den Sohn entstanden ist, angewandt, und zwar mit Recht, weil Gott nicht wie das Entstandene ist, vielmehr dessen Schöpfer und Bildner durch den Sohn. Wie also der Ausdruck “unentstanden” auf das Entstandene hindeutet, so offenbart auch das Wort “Vater” den Sohn. Und wer Gott einen Schöpfer und Bildner und unentstanden nennt, schaut und begreift die Geschöpfe und die gewordenen Dinge. Wer Gott Vater nennt, erkennt und schaut sogleich den Sohn. Deshalb mag man sich auch wundern ob ihrem hartnäckigen Festhalten an der Gottlosigkeit, weil sie, obschon der Name des Unentstandenen den vorhin angegebenen richtigen Sinn hat und mit Gottesfurcht genannt werden kann, in ihrer Häresie ihn zur Unehre des Sohnes vorbringen, als hätten sie nicht gelesen, daß wer den Sohn ehrt, den Vater ehrt, und wer den Sohn entehrt, den Vater entehrt. Denn wenn es ihnen überhaupt um die Lobpreisung und Ehrung des Vaters zu tun wäre, dann müßten sie — es wäre besser und nicht mehr als billig — Gott eher als Vater anerkennen und so bezeichnen als mit jenem Namen benennen. Indem nämlich jene Gott unentstanden nennen, nennen sie ihn, wie gesagt, bloß nach den gewordenen Werken Schöpfer und Bildner im Glauben, daß sie dann auch das Wort, so wie es ihnen zusagt, als sein Geschöpf hinstellen können. Wer aber Gott Vater nennt, bezeichnet ihn so nach seinem Sohn, wohl wissend, daß, da ein Sohn existiert, alles Entstandene notwendig durch den Sohn geschaffen wurde. Wenn diese ihn “unentstanden” nennen, so bezeichnen sie ihn nur nach den Werken, und auch sie wissen vom Sohne so wenig wie die Heiden. Wer aber Gott Vater nennt, bezeichnet ihn so nach dem Sohne. Wenn er aber das Wort kennt, so weiß er, daß es der Schöpfer ist, und begreift, daß durch dieses alles geworden ist.</p><p>Es entspräche also mehr der Gottesfurcht und der Wahrheit, Gott nach dem Sohne zu benennen und Vater zu heißen, als ihn bloß zu den Werken in Beziehung zu setzen und ihn unentstanden zu nennen. Denn diese Bezeichnung geben, wie gesagt, jedes einzelne Werk und alle Werke insgesamt, die nach dem Willen Gottes durch das Wort geworden sind. Die Benennung “Vater” aber hat nur in Beziehung auf den Sohn Geltung und beruht auf ihm. So groß aber der Abstand zwischen dem Worte und den geschaffenen Dingen ist, ebenso groß, ja noch größer ist der Unterschied zwischen dem Vaternamen Gottes und seiner Benennung als eines “Unentstandenen”. Denn diese letztere Bezeichnung ist nicht schriftgemäß und ist verdächtig, weil deren Bedeutung eine mehrfache ist, so daß die Gedanken dessen, der danach gefragt wird, auf viele Möglichkeiten gelenkt werden. Der Ausdruck “Vater” aber ist einfach und schriftgemäß, kommt der Wahrheit näher und deutet nur auf den Sohn hin. Der Ausdruck “unentstanden” ist von den Heiden erfunden, die den Sohn nicht kennen; die Bezeichnung “Vater” aber wurde von unserm Herrn anerkannt und huldvoll mitgeteilt. Denn da er selbst wohl wußte, wessen Sohn er war, sagte er: “Ich bin im Vater und der Vater ist in mir” und: “Wer mich gesehen hat, der hat den Vater gesehen” und: “Ich und der Vater sind Eins”, und nirgends hören wir ihn den Vater “unentstanden” nennen. Auch, als er uns beten lehrte, sprach er nicht: “Wenn ihr betet, sprechet:”Unentstandener Gott“, sondern vielmehr:”Wenn ihr betet, sagt: Vater unser, der Du bist in dem Himmel“. Und auch die Grundlage unseres Glaubens sollte nach seinem Willen mit diesem Namen im Zusammenhang stehen, indem er befahl, daß wir nicht auf den Namen des Unentstandenen und Entstandenen, noch auch auf den Namen des Schöpfers und des Geschöpfes getauft würden, sondern auf den Namen des Vaters und des Sohnes und des Hl. Geistes. Denn indem wir, die wir zu den geschaffenen Dingen gehören, in dieser Weise eingeweiht werden, werden wir von da an zu Söhnen, und wenn wir den Vaternamen aussprechen, erkennen wir aus diesem Namen auch das Wort im Vater selbst. Es ist also bewiesen, daß auch ihr Versuch mit dem Schlagwort”unentstanden" ein eitler ist und nichts weiter als ein bloßes Phantasiegebilde.</p><p>Was aber ihre Frage anlangt, ob das Wort veränderlich sei, so ist eine lange Erwägung darob überflüssig. Denn es genügt, wenn ich nur ihre Worte niederschreibe, um ihre verwegene Gottlosigkeit zu zeigen. Denn also lauten ihre geschwätzigen Fragen: „Ist er selbständig oder nicht? Ist er durch freie Wahl und Selbstbestimmung gut und kann er nach Belieben sich ändern, weil veränderlicher Natur, oder fehlt ihm wie Holz und Stein der freie Wille, nach beiden Richtungen hin sich zu bewegen oder zu neigen?“ Ihrer Häresie sind also solche Reden und Gedanken nicht fremd. Denn nachdem sie einmal aus Nichtseiendem sich einen Gott und geschaffenen Sohn gebildet haben, so haben sie folgerichtig auch solche Ausdrücke gewählt, wie sie für ein Geschöpf passen. Wenn aber diese von den Männern der Kirche, gegen die sie ankämpfen, vom wahrhaften und einzigen Worte des Vaters hören und trotzdem solche Reden über ihn zu führen sich erfrechen, wer könnte da noch etwas Abscheulicheres schauen als jene Lehre? Wer aber gerät nicht schon beim Anhören derselben in Aufregung, selbst wenn er ihr nicht entgegnen kann, und wird nicht das Ohr verschließen, bestürzt ob dem, was jene schwatzen, und ob der neuen Reden, die er vernimmt, die schon im Wortlaut die Blasphemie enthalten? Denn wenn das Wort veränderlich ist und anders werden kann, wo wird es dann stehen bleiben und wo wird es am Ende seiner Zunahme angelangt sein? Oder wie wird der Veränderliche dem Unveränderlichen ähnlich sein können? Wie wird der, welcher den Veränderlichen gesehen hat, glauben, den Unveränderlichen gesehen zu haben? In welchem Stadium seines Werdens muß er sich also befinden, wenn man den Vater in ihm soll schauen können? Denn offenbar wird man nicht immer in ihm den Vater schauen, weil der Sohn sich beständig verändert und veränderlicher Natur ist. Denn der Vater ist unveränderlich und unwandelbar und verhält sich immer auf die gleiche Weise und ist immer derselbe. Wenn aber der Sohn nach ihrer Ansicht veränderlich und nicht immer derselbe ist, sondern von stets veränderlicher Natur ist, wie kann er, der so beschaffene, ein Bild des Vaters sein, da er ihm in der Unveränderlichkeit nicht ähnlich ist? Wie ist er aber überhaupt im Vater, da er einen unbeständigen Willen hat? Wohl aber ist er, da er auch veränderlich ist und täglich zunimmt, noch nicht vollkommen. Doch fort mit diesem Wahnsinn der Arianer, die Wahrheit möge leuchten und ihren Unverstand beweisen! Denn wie ist der nicht vollkommen, der Gott gleich ist? Oder wie ist der nicht unveränderlich, der mit dem Vater Eins und sein wesenseigener Sohn ist? Da aber das Wesen des Vaters unveränderlich ist, so wird wohl auch die ihm entstammte eigene Zeugung unveränderlich sein. Wenn sie aber trotz dieses Sachverhalts dem Worte Veränderlichkeit andichten, so mögen sie erkennen, wo ihr Wort Gefahr läuft. An der Frucht nämlich wird auch der Baum erkannt. Darum hat auch der, welcher den Sohn gesehen hat, den Vater gesehen, und die Erkenntnis des Sohnes ist die Erkenntnis des Vaters.</p><p>So ist also wohl das Bild des unveränderlichen Gottes unveränderlich. Denn: „Jesus Christus ist gestern und heute und in Ewigkeit derselbe“. Und David singt von ihm; „Und Du, Herr, hast im Anfang die Erde gegründet, und ein Werk Deiner Hände sind die Himmel. Sie werden vergehen, Du aber bleibst, und alle werden altern wie ein Kleid, und Du wirst sie wechseln wie ein Kleid, und sie werden sich verändern. Du aber bist derselbe und Deine Jahre werden nicht abnehmen“. Der Herr aber sagt durch den Propheten von sich selbst: „Seht mich an, sehet, daß ich es bin“ und: „Ich habe mich nicht geändert“. Denn wenn man auch sagen kann, daß damit der Vater gemeint sei, so passen diese Worte doch auch auf den Sohn! weil er, gerade auch nachdem er Mensch geworden, seinen stets gleichen Zustand und seine Unveränderlichkeit denen gegenüber gezeigt hat, die glauben, daß er wegen des Fleisches eine Umwandlung erlitten habe und etwas anderes geworden sei. Aber mehr Glauben als die Böswilligkeit der Gottlosen verdienen die Heiligen und noch mehr der Herr. Denn auch an der zitierten Psalmstelle sagt die Schrift, daß die Natur aller gewordenen Dinge und der ganzen Schöpfung, worunter sie Himmel und Erde versteht, veränderlich und wandelbar sei, nimmt aber den Sohn davon aus und erklärt, daß er durchaus nicht entstanden sei, und lehrt, daß vielmehr er alles andere umwandle und nicht selbst einer Umwandlung unterworfen sei, indem sie sagt: „Du bist derselbe und Deine Jahre nehmen nicht ab“. Und mit Recht! Denn da das Gewordene aus dem Nichtseienden ist und, bevor es wurde, nicht ist, so muß es, weil es als Nichtseiendes wird, überhaupt eine veränderliche Natur haben. Der Sohn aber ist, weil er vom Vater stammt und seiner Substanz eigen ist, unwandelbar und unveränderlich wie der Vater selbst. Denn man darf nicht sagen, daß aus der unveränderlichen Substanz ein veränderliches Wort und eine wandelbare Weisheit geboren werde. Denn wie ist er noch Wort, wenn er veränderlich ist, oder wie ist das Wandelbare noch Weisheit? Sie müßten sich denn nur die Sache denken wollen als ein Verhältnis von Substanz und Akzidenz, wonach also in irgend einer besonderen Substanz irgend eine Gnade oder Tugendanlage zufällig vorhanden wäre und diese dann Wort, Sohn und Weisheit genannt würde, so daß dann diese der Substanz entzogen und wieder hinzugefügt werden könnte. Solche Gedanken nämlich haben sie oft ausgesprochen. Doch dies ist nicht der Glaube der Christen. Denn auch so kommt nicht zum Ausdruck, daß wirklich ein Wort und Sohn Gottes existiert, und die Weisheit wahre Weisheit ist. Denn was sich ändert und umwandelt und nicht in ein und demselben Zustande verharrt, wie kann dies noch wahr sein? Der Herr aber sagt: „Ich bin die Wahrheit“. Wenn also der Herr selbst von sich dies sagt und seine Unveränderlichkeit bezeugt, und die Heiligen dies wissen und davon Zeugnis geben, aber auch schon der Begriff von Gott dies als der Gottesfurcht nicht entsprechend findet, woraus haben dann die Gottlosen solche Vorstellungen geschöpft? Aus ihrem Herzen fürwahr haben sie dieselben wie aus einem Herd von Verkommenheit ausgespien.</p><p>Da sie sich aber mit den göttlichen Aussprüchen hinausreden und diese mit Gewalt nach ihrem eigenen Sinn verdrehen, so muß man ihnen doch soviel entgegnen als nötig ist, um die Aussprüche zu rechtfertigen und deren richtigen Sinn wie anderseits deren falsche Auslegung von ihrer Seite zu beweisen. Sie sagen also, daß beim Apostel geschrieben steht: „Deshalb hat ihn Gott auch erhöht und ihm einen Namen gegeben, der über alle Namen ist, daß im Namen Jesu sich beugen alle Knie derer, die im Himmel, auf der Erde und unter der Erde sind“. Und bei David: „Darum hat dich Gott, dein Gott gesalbt mit dem Öl der Freude vor deinen Genossen“. Daran fügen sie die vermeintlich weise Bemerkung: Wenn er „darum“ erhöht wurde und Gnade empfing und er „d a r u m“ gesalbt ist, so empfing er einen Lohn für seine Willensentscheidung. Wenn er aber mit Willen handelte, so ist er doch jedenfalls veränderlicher Natur. Dies haben Eusebius und Arius nicht bloß zu sagen, sondern auch zu schreiben gewagt, und ihre Anhänger scheuen sich nicht, mitten auf dem Markt es auszusprechen, ohne zu beachten, welchen Wahnsinn ihre Rede enthält. Denn wenn er das, was er empfing, als Lohn für seinen Willensentschluß empfangen hat und es nicht erhalten hätte, wenn er nicht das Werk des Bedürftigen vollbracht hätte, so wurde er also, da er wegen seiner Tugend und Vervollkommnung dieses erhielt, deshalb mit Fug und Recht Sohn und Gott genannt, ist aber nicht wahrer Sohn. Denn was der Natur nach aus etwas stammt, ist eine wahre Zeugung, wie es Isaak war für Abraham, Joseph für Jakob, und wie es der Abglanz für die Sonne ist. Die aber, welche bloß auf Grund der Tugend und aus Gnade so genannt werden, besitzen statt der Natur die Gnade vom Empfang und sind von dem, was ihnen geschenkt wurde, verschieden, wie es die Menschen sind, die den Geist auf dem Weg der Anteilnahme empfangen haben, von denen er auch sagte: „Söhne habe ich gezeugt und erhöht, sie aber haben mich verachtet“. Da sie nicht von Natur Söhne waren, deshalb gingen sie, da sie sich änderten, des Geistes verlustig und sie wurden verleugnet. Wenn sie aber Reue empfinden, wird er sie wieder aufnehmen, ihnen das Licht geben und sie wieder Söhne nennen, er, der Gott, der ihnen auch im Anfang in dieser Weise die Gnade gegeben hat.</p><p>Wenn sie nun so auch vom Erlöser reden, so wird sich daraus ergeben, daß er weder wahrer Gott, noch wahrer Sohn, noch dem Vater ähnlich ist, noch überhaupt Gott zum Vater seines wesenhaften Seins, sondern nur zum Vater der ihm verliehenen Gnade hat, für sein wesenhaftes Sein aber ist ihm Gott wie allen Dingen nur ein Schöpfer. Wenn er aber so beschaffen ist, wie diese ihn zeichnen, dann wird sich herausstellen, daß er nicht einmal von Anfang an den Namen „Sohn“ hatte, wenn er ja diesen als Preis für seine Werke und seine Zunahme empfing, die keine andere war als die, da er Mensch geworden war und die Gestalt des Knechtes angenommen hatte. Denn damals, als er gehorsam geworden bis zum Tode, heißt es von ihm, er sei erhöht worden und habe als Gnade den Namen empfangen, „damit im Namen Jesu sich beugen alle Knie“. Was war also vorher, wenn er jetzt erhöht wurde, und man jetzt anfing, ihn anzubeten und er jetzt Sohn genannt wurde, nachdem er Mensch geworden war? Denn er scheint selbst das Fleisch in nichts verbessert zu haben, sondern eher selbst durch dasselbe verbessert worden zu sein, wenn er ja nach ihrer verkehrten Ansicht damals erhöht und Sohn genannt wurde, als er Mensch geworden ist. Was war er also vordem? Wieder muß man sie fragen, damit man auch ihre vollendete Gottlosigkeit sieht. Denn wenn der Herr Gott, Sohn, Wort ist, dies aber nicht war, bevor er Mensch wurde, so war er entweder etwas anderes als dies und nahm später wegen seiner Tugend daran teil, wie wir gesagt haben, oder sie müssen ein Zweites behaupten, was auf ihr Haupt fallen möge, daß er vorher gar nicht gewesen und überhaupt von Natur nur ein Mensch sei und nichts weiter. Aber das ist nicht die Anschauung der Kirche, sondern des Samosateners und der jetzigen Juden. Warum lassen sie sich aber dann, wenn sie ihrer Ansicht beipflichten, nicht auch wie die Juden beschneiden, sondern bekennen sich dem Scheine nach zum Christentum, während sie doch mit ihm im Kampfe stehen? Denn wenn er nicht war oder wohl war, aber später besser wurde, wie ist dann durch ihn alles geworden bezw. wie konnte, wenn er ja nicht vollkommen war, in ihm der Vater sich freuen? Und wenn er selbst jetzt erst besser wurde, wie freute er sich vordem im Angesichte des Vaters? Und wenn ihm erst nach dem Tode die Anbetung zuteil wurde, wie verstehen wir dann, daß Abraham ihn im Zelte anbetet und Moses im Dornbusch, und wie dienten ihm, wie Daniel es sah, Myriaden von Myriaden und Tausende von Tausenden? Und wenn der Sohn nach ihrer Ansicht erst jetzt eine Vervollkommnung erfuhr, wie konnte er dann selbst, als er von der himmlischen Herrlichkeit sprach, die er vor der Erschaffung der Welt hatte, sagen: „Verherrliche mich, Vater, mit der Herrlichkeit, die ich bei Dir hatte, ehe die Welt war“? Wenn er aber nach ihrer Ansicht jetzt erhöht wurde, wie hatte er vordem „die Himmel geneigt und ist herniedergestiegen“ und hat wiederum „der Höchste seine Stimme erschallen lassen“? Wenn also der Sohn, bevor die Welt entstand, die Herrlichkeit inne hatte und der höchste Herr der Herrlichkeit war und vom Himmel herabstieg und immer anbetungswürdig ist, so wurde er also, indem er herabstieg, nicht besser, vielmehr verbesserte er das Besserungsbedürftige. Und wenn er um zu verbessern herabgestiegen ist, so wurde ihm doch fürwahr die Bezeichnung Sohn und Gott nicht als Belohnung zuteil, sondern er machte vielmehr uns zu Söhnen des Vaters und, selbst Mensch geworden, vergöttlichte er die Menschen.</p><p>Er ist also nicht, da er Mensch war, später Gott geworden, sondern da er Gott war, später Mensch geworden, um vielmehr uns zu Göttern zu machen. Denn wenn er damals, als er Mensch geworden ist, Sohn und Gott genannt wurde, vor seiner Menschwerdung aber Gott die alten Völker Söhne nannte und den Moses zu Gott über Pharao setzte und die Schrift von vielen spricht: “Gott stand in der Versammlung der Götter”, so ist er offenbar erst nach ihnen Sohn und Gott genannt worden. Wie ist nun alles durch ihn und er selbst vor allem, oder wie ist er der Erstgeborene der ganzen Schöpfung, wenn es vor ihm solche gab, die Söhne und Götter genannt wurden? Wie aber haben die ersten Teilnehmer nicht teil am Worte? Es ist dies nicht der wahre Glaube, sondern eine Erfindung derer, die jetzt judaisieren. Denn wie können überhaupt einige Gott als Vater erkennen? Eine Annahme an Sohnes Statt kann ja ohne den wahren Sohn gar nicht stattfinden, und er sagt doch selbst: “Niemand kennt den Vater als der Sohn, und wem der Sohn ihn offenbart”. Und wie hätte auch ohne das Wort und vor ihm eine Vergöttlichung eintreten können, wenn er doch selbst zu den Juden, ihren Brüdern, sagt: “Wenn er jene Götter nannte, an die das Wort Gottes erging”? Und wenn alle, die auf Erden und im Himmel Söhne genannt wurden, zu Söhnen und Göttern wurden durch das Wort, der Sohn selbst aber das Wort ist, so sind es offenbar alle durch ihn, er aber ist vor allen, oder vielmehr er allein nur ist wahrer Sohn, und er allein ist wahrer Gott vom wahren Gott, und er empfing dies nicht als Lohn für die Tugend noch auch ist er von diesem verschieden, sondern er ist es der Substanz nach von Natur. Denn er ist eine Zeugung aus dem Wesen des Vaters, so daß niemand zweifeln kann, daß entsprechend der Unveränderlichkeit des Vaters auch das Wort unveränderlich ist.</p><p>Bisher sind wir mit den Begriffen vom Sohne ihren unvernünftigen Erfindungen entgegengetreten, wie es der Herr selbst uns verliehen hat. Es ist aber gut, die göttlichen Aussprüche noch weiter anzuführen, damit noch mehr die Unveränderlichkeit des Sohnes und seine unwandelbare väterliche Natur wie aber auch die Böswilligkeit jener erwiesen werde. Der Apostel schreibt also an die Philipper: „So sollt ihr gesinnt sein, wie auch Jesus Christus gesinnt war, der, da er in Knechtsgestalt war, es nicht für einen Raub hielt, Gott gleich zu sein, sondern sich selbst entäußerte, Knechtsgestalt annahm, den Menschen gleich geworden und im Äußeren als ein Mensch erfunden wurde. Er erniedrigte sich selbst und war gehorsam bis zum Tode, ja zum Tode am Kreuze. Darum hat ihn Gott erhöht und ihm einen Namen gegeben, der über alle Namen ist, auf daß in dem Namen Jesu jedes Knie sich beuge aller Wesen im Himmel, auf Erden und unter der Erde, und jede Zunge bekenne, daß Jesus Christus der Herr zum Preise des Vaters ist“. Was könnte lichtvoller und überzeugender sein als diese Worte? Er ist also nicht aus einem Geringeren ein Besserer geworden, sondern nahm vielmehr, da er Gott war, die Knechtsgestalt an und wurde, indem er sie annahm, kein Besserer, sondern er erniedrigte sich. Wo ist also hierbei eine Belohnung der Tugend oder wo eine Zunahme und Besserung in der Erniedrigung? Denn wenn er, da er Gott war, Mensch geworden ist, und wenn es von ihm, der aus der Höhe herabgestiegen ist, heißt, er sei erhöht worden, wie wird er erhöht, da er Gott ist? Und wiederum ist es klar, daß, wenn Gott der Höchste ist, notwendig auch sein Wort der Höchste sein muß. Wie konnte also der noch mehr erhöht werden, der im Vater und in allem dem Vater ähnlich ist? Er ist also gar keines Zuwachses bedürftig und ist nicht so, wie die Arianer ihn wähnen. Denn wenn das Wort herabgestiegen ist, um erhöht zu werden und dies geschrieben steht, warum mußte er sich überhaupt erniedrigen, um nach dem zu streben, was er hatte? Und was für eine Gnade empfing der Spender der Gnade? Und wie empfing er den Namen, um angebetet zu werden, er, der doch immer in seinem Namen angebetet wurde? Denn bevor er Mensch wurde, riefen die Heiligen ihn an: „Gott, in Deinem Namen rette mich“. Und wieder: „Diese sind zu Wagen, diese zu Rosse, wir aber werden im Namen Gottes, unseres Herrn, verherrlicht werden“. Und er wurde von den Patriarchen angebetet. Und von den Engeln steht geschrieben: „Und es sollen ihn anbeten alle Engel Gottes“.</p><p>Wenn aber auch, wie David im 71. Psalm singt, „sein Name vor der Sonne besteht und vor dem Mond von Geschlecht zu Geschlecht“, wie empfing er, was er immer hatte, und bevor er es jetzt empfing? Oder wie wird er erhöht, da er auch schon vor der Erhöhung der Höchste war? Oder wie empfing er die Anbetung, er, der auch, bevor er sie erst jetzt empfing, immer angebetet wurde? Es ist kein Rätsel, sondern ein göttliches Geheimnis: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“. Unsertwegen ist aber später dieses Wort Fleisch geworden, und wenn jetzt gesagt wird: „Er hat erhöht“, so bedeutet dies nicht eine Erhöhung der Substanz des Wortes, — denn sie war immer und ist Gott gleich, — sondern der Menschheit kommt die Erhöhung zu. Nicht eher also ist dies gesprochen worden, als bis das Wort Fleisch geworden war, damit offenbar würde, daß die Ausdrücke „er erniedrigte“ und „er erhöhte“ von der menschlichen Seite gelten. Denn nur was niedrig ist, kann wohl auch erhöht werden, und wenn das „er erniedrigte“ wegen der Annahme des Fleisches geschrieben steht, so steht offenbar auch ihretwegen das „er erhöhte“ da. Denn der Mensch war dessen bedürftig wegen der Niedrigkeit des Fleisches und des Todes. Nun nahm das Wort, das des Vaters Bild und unsterblich ist, die Gestalt des Knechtes an und erlitt um unsertwillen als Mensch in seinem Fleische den Tod, um sich so für uns im Tod dem Vater darzubringen. Deshalb heißt es von ihm, als Mensch sei er um unsertwillen und für uns erhöht worden, damit wir, wie wir in seinem Tode alle in Christus starben, ebenso in Christus selbst wieder erhöht würden, indem wir von den Toten auferweckt werden und in die Himmel uns erheben, „wohin Jesus als Vorläufer für uns gegangen ist, nicht in ein Nachbild des wahrhaftigen, sondern in den Himmel selbst, um nunmehr vor dem Angesichte Gottes für uns zu erscheinen“. Wenn aber Christus jetzt für uns in den Himmel selbst eingegangen ist, obschon er auch vorher immer Herr und Schöpfer des Himmels war, so steht also auch hier geschrieben, daß er für uns erhöht wurde. Und wie er, der alle heiligt, selbst wiederum sagt, daß er für uns sich dem Vater heilige, nicht damit das Wort heilig werde, sondern damit er in sich selbst uns alle heilige, so nun heißt es jetzt auch: „Er erhöhte ihn“, nicht damit er selbst erhöht würde, — denn er ist der Höchste, — sondern damit er selbst für uns Gerechtigkeit würde, wir aber in ihm erhöht würden und in die Pforten der Himmel eingingen, die er selbst wieder für uns eröffnet hat, wie die Vorläufer sagen: „Erhebet, Fürsten, eure Tore, und erhebt euch, ewige Tore, und einziehen wird der König der Herrlichkeit“. Denn auch hier waren ihm, dem Herrn und Schöpfer aller Dinge, die Tore nicht verschlossen, vielmehr ist auch dies unsertwegen geschrieben, denen das Tor des Paradieses verschlossen war. Deshalb wird auch in menschlicher Weise wegen des Fleisches, das er trug, mit Bezug auf ihn gesagt: „Erhebet eure Tore“ und „er wird eingehen“, wie wenn ein Mensch einzöge. Aber da das Wort auch Gott ist, so wird in göttlicher Weise wiederum von ihm gesagt: „Herr und König der Herrlichkeit“. Diese unsere Erhöhung hat der Geist im 88. Psalme vorhergesagt: „In Deiner Gerechtigkeit werden sie erhöht werden, weil Du der Ruhm ihrer Macht bist“. Wenn aber der Sohn Gerechtigkeit ist, so wird nicht er selbst erhöht, als wäre er dessen bedürftig, sondern wir sind es, die erhöht werden in der Gerechtigkeit, die er selbst ist.</p><p>Und auch das „er gab ihm“ ist nicht wegen des Wortes selbst geschrieben. Denn er wurde wiederum, wie bereits gesagt, auch ehe er Mensch wurde, von den Engeln und der ganzen Schöpfung angebetet, weil er dem Vater eigen ist. Es ist dies vielmehr wieder um unsertwillen und für uns über ihn geschrieben. Denn wie Christus als Mensch starb und erhöht wurde, so sagt man, daß er als Mensch empfing, was er als Gott immer hatte, damit diese mitgeteilte Gnade auf uns übergehe. Denn das Wort wurde durch die Annahme eines Leibes nicht verringert, so daß es auch nach einer Gnade hätte streben können, sondern es hat vielmehr vergöttlicht, was es anzog und in noch reicherer Fülle diese Gnade dem Menschengeschlechte gewährt. Wie es nämlich immer angebetet wurde, da es Wort war und die Gestalt Gottes an sich trug, so liegt, da es auch Mensch geworden und Jesus genannt dasselbe blieb, nichts destoweniger die ganze Schöpfung zu seinen Füßen und beugt vor ihm in diesem Namen das Knie und bekennt, daß die Menschwerdung des Wortes und sein Sterben im Fleische nicht seiner Gottheit zur Schmach, sondern Gott dem Vater zur Ehre gereicht habe. Denn es bedeutet eine Verherrlichung des Vaters, wenn der, welcher Mensch geworden und verloren gegangen war, wieder gefunden wurde und, nachdem er getötet war, wieder ins Leben zurückkehrte und ein Tempel Gottes wurde. Und wenn die himmlischen Mächte, Engel und Erzengel ihn immer anbeteten, jetzt auch den Herrn im Namen Jesu anbeten, so kommt uns diese Gnade und Erhöhung zu, weil der Sohn Gottes, auch nachdem er Mensch geworden, angebetet wird und es die himmlischen Mächte nicht befremden wird, wenn sie uns alle, die wir einen Körper haben wie er, in ihre Gefilde einziehen sehen. Sonst wäre dies wohl nicht geschehen, wenn nicht der, der in der Gestalt Gottes war, Knechtsgestalt angenommen und sich selbst so weit erniedrigt hätte, daß er seinen Leib dem Tode überantwortete.</p><p>Sieh also, was dem Menschen im Kreuze als Torheit Gottes erschien, ist ehrwürdiger als alles geworden. Denn unsere Auferstehung beruht auf ihm, und nicht mehr bloß Israel, sondern auch alle Heidenvölker verlassen, wie der Prophet vorhergesagt hat, von nun an ihre Götzen und erkennen den wahren Gott, den Vater Christi. Dem Blendwerk der Dämonen ist ein Ende gemacht, und nur der wirkliche Gott wird im Namen unseres Herrn Jesu Christi angebetet. Wenn aber der Herr, der im Leibe erschien und Jesus genannt wurde, angebetet und für den Sohn Gottes gehalten und durch ihn der Vater erkannt wird, so zeigt das, wie gesagt, wohl deutlich, daß nicht das Wort, insofern es Wort ist, eine solche Gnade empfing, sondern wir; denn wegen der Verwandtschaft mit seinem Leibe sind auch wir ein Tempel Gottes geworden und sind nunmehr zu Söhnen Gottes gemacht, so daß auch in uns schon der Herr angebetet wird, und die, welche es sehen, melden, wie der Apostel gesagt hat, daß wahrhaft Gott in ihnen ist. Dies sagt auch Johannes im Evangelium: „Allen, die ihn aufgenommen haben, gab er Macht, Kinder Gottes zu werden“. Und in seinem Briefe schreibt er: „Daran erkennen wir, daß er in uns bleibt, an dem Geist, den er uns gegeben hat“. Aber auch das ist ein Kennzeichen seiner Güte gegen uns, daß wir erhöht wurden, weil in uns der höchste Herr wohnt, und daß unsertwegen die Gnade ausgeteilt wird, weil der Herr, der die Gnade spendet, ein Mensch geworden ist wie wir. Der Heiland aber selbst erniedrigte sich, indem er unsern niedrigen Leib annahm. Er nahm Knechtsgestalt an, indem er das von der Sünde geknechtete Fleisch anzog. Und er empfing nichts von uns zu seiner Besserung, — denn bedürfnislos und vollkommen ist das Wort Gottes, — vielmehr sind wir durch ihn verbessert worden. Denn er ist „das Licht, das jeden Menschen erleuchtet, der in die Welt kommt“. Und vergebens berufen sich die Arianer auf die Konjunktion „darum“, weil Paulus sagt: „Darum hat ihn Gott erhöht“. Denn nicht einen<s81> Preis für eine Tugend und auch nicht einen Fortschritt zum Bessern bezeichnete er mit diesen Worten, sondern die Ursache der an uns vollzogenen Erhöhung. Was ist aber das für eine andere Ursache als die, daß der, welcher in der Gestalt Gottes war und Sohn des edlen Vaters ist, sich erniedrigte und statt unser und für uns Knecht wurde? Wenn nämlich der Herr nicht Mensch geworden wäre, so wären wir nicht von den Sünden erlöst worden und wären nicht von den Toten auferstanden, sondern wir wären tot unter der Erde geblieben. Und wir wären auch nicht in die Himmel erhöht worden, sondern wir würden in der Unterwelt liegen. Unsertwegen und für uns also heißt es: „Er erhöhte“ und: „Er gab“.</s81></p><p>Dies ist meines Erachtens der Sinn der Stelle, wie er besonders auch der kirchlichen Auffassung entspricht. Doch könnte man die Stelle auch anders auffassen und doch dasselbe in entsprechender Weise zum Ausdruck bringen, indem man sagt, sie rede nicht von der Erhöhung des Wortes selbst, insoweit es Wort sei. Denn es ist, wie kurz vorher gesagt, der Höchste und dem Vater ähnlich, aber wegen seiner Menschwerdung deutet die Stelle die Auferstehung von den Toten an. Daher fügte er den Worten: „Er erniedrigte sich bis zum Tode“ sogleich bei: „Darum erhöhte er ihn“. Er wollte zu erkennen geben, daß, wenn man auch von ihm als Menschen sagt, daß er gestorben sei, er doch, da er das Leben war, in der Auferstehung erhöht wurde. „Denn der, welcher herabkam, ist derselbe wie der, der auferstand“. Denn er stieg herab leiblich, stand aber wieder auf, weil Gott selbst im Leibe war. Und eben dies ist wiederum der Grund, weshalb er in diesem Sinne das Bindewort „darum“ beigefügt hat, das nicht einen Lohn der Tugend oder der Zunahme, sondern den Grund angibt, warum die Auferstehung erfolgt ist, und warum die andern Menschen von Adam bis jetzt gestorben sind und tot blieben, dieser allein aber unversehrt von den Toten auferstand. Der Grund aber ist<s82> der, den er selbst zuvor angegeben hat, nämlich daß er, der Gott war, Mensch geworden ist. Denn alle andern Menschen, die nur von Adam stammten, sind gestorben und sie hatten den Tod als Herrscher über sich. Dieser zweite Mensch aber ist vom Himmel; „denn das Wort ist Fleisch geworden“. Und man nennt diesen Menschen „vom Himmel stammend“ und einen „himmlischen“, weil das Wort vom Himmel herabgekommen ist. Und deshalb ist er auch vom Tode nicht überwältigt worden. Denn wenn er auch sich selbst erniedrigte, indem er seinen eigenen Leib dem Tode überantwortete, da dieser ja dem Tode zugänglich war, so wurde er doch von der Erde erhöht, weil im Leibe Gottes Sohn war. Es ist sonach das hier Gesagte: „Darum hat ihn Gott auch erhöht“ dem gleichbedeutend, was Petrus in der Apostelgeschichte sagt: „Diesen hat Gott auferweckt, indem er die Schmerzen des Todes löste, wie es denn unmöglich war, daß er von demselben festgehalten wurde“. Denn wie bei Paulus geschrieben steht: „Da er, obschon er die Gestalt Gottes besaß, Mensch geworden ist und sich bis in den Tod erniedrigte, so hat darum auch Gott ihn erhöht“, so sagt auch Petrus: „Weil er, da er Gott war, Mensch geworden ist, die Zeichen und Wunder aber denen, die sie sahen, ihn als Gott bekundeten, deshalb war es unmöglich, daß er vom Tode festgehalten wurde“. Einem Menschen aber war es nicht möglich, dies zu leisten; denn den Menschen eigen ist der Tod. Deshalb ist das Wort, da er Gott war, Fleisch geworden, damit er, im Fleische getötet, alle durch seine Macht lebendig mache.</s82></p><p>Da es aber von ihm heißt, er sei erhöht worden, und Gott habe ihm gegeben, und da die Häretiker daraus auf eine Verminderung oder ein Leiden der Wesenheit des Wortes schließen, so muß man angeben, wie diese Worte zu verstehen sind. Es heißt nämlich, er sei von den unteren Teilen der Erde erhöht worden, da der Tod auch als sein Anteil bezeichnet wird. Beides aber wird von ihm ausgesagt, da ihm und nicht einem andern der Leib angehörte, der von den Toten erhöht und in den Himmel aufgenommen wurde. Da aber wiederum ihm der Leib gehörte, und das Wort nicht außer ihm sich befand, so sagt man, wenn der Leib erhöht wird, mit Recht, daß er als Mensch wegen des Leibes erhöht werde. Wenn er nun nicht Mensch geworden ist, so soll man das von ihm nicht sagen. Wenn aber das Wort Fleisch geworden ist, so muß man wie bei einem Menschen von seiner Auferstehung und Erhöhung reden, damit der Tod, der als sein Anteil gilt, ein Lösegeld für die Sünde der Menschen und eine Vernichtung des Todes sei, die Auferstehung und Erhöhung aber um seinetwillen uns sicher erhalten bleibe. Für beide Fälle hat er gesagt: „Gott hat ihn erhöht“ und: „Gott hat ihm gegeben“, um auch dadurch wieder zu zeigen, daß nicht der Vater Fleisch geworden, sondern sein Wort Mensch geworden ist, der vom Vater in menschlicher Weise empfängt und von ihm, wie gesagt, erhöht wird. Es ist aber offenbar und niemand kann daran zweifeln, daß der Vater, was er gibt, durch den Sohn gibt. Es ist dies auffallend und kann in der Tat überraschen. Von der Gnade, die der Sohn vom Vater mitteilt, heißt es nämlich, der Sohn empfange sie, und bei der Erhöhung, die der Sohn vom Vater bewirkt, ist es auch der Sohn, der erhöht wird. Denn er, der der Sohn Gottes ist, ist auch Menschensohn geworden, und als Wort teilt er die Gaben vom Vater aus. Denn alles, was der Vater tut und gibt, tut und gewährt er durch ihn; insofern er aber Menschensohn ist, sagt man von ihm selbst, daß er in menschlicher Weise empfange, was von ihm selbst kommt, weil nicht einem andern, sondern ihm selbst der Leib gehört, der von Natur zum Empfang der Gnade fähig ist, wie wir gesagt haben. Denn er empfing, insoweit der Mensch erhöht wurde; eine Erhöhung war es, daß dieser vergöttlicht wurde. Das Wort selbst aber besaß immer dies gemäß seiner väterlichen Gottheit und Vollkommenheit.</p><p>Was also beim Apostel geschrieben steht, hat diesen Sinn und widerlegt die Gottlosen. Was aber der Sänger sagt, hat wieder den nämlichen richtigen Sinn, den diese zwar mißdeuten, der Psalmist aber im gottesfürchtigen Sinne versteht. Denn auch er sagt: „Dein Thron, o Gott, besteht für alle Ewigkeit, ein Zepter der Gerechtigkeit ist das Zepter Deiner Herrschaft. Du hast die Gerechtigkeit geliebt und die Ungerechtigkeit gehaßt, darum hat Dich Gott, Dein Gott, mit dem Öle der Freude gesalbt vor Deinen Genossen“. Merkt auf, ihr Arianer, und erkennt wenigstens hieraus die Wahrheit! Genossen des Herrn hat der Psalmist uns alle genannt. Wenn er aber aus Nichtseiendem war und eines von den geschaffenen Wesen, so war er wohl auch einer von den Genossen. Da er ihn aber als ewigen Gott pries mit den Worten: „Dein Thron, o Gott, steht fest in Ewigkeit“, und gezeigt hat, daß alles übrige an ihm teilhabe, was anderes muß man denken, als daß er von den gewordenen Dingen verschieden und allein das wahre Wort des Vaters, Abglanz und Weisheit ist, an der alle gewordenen Dinge teilnehmen und von ihm im Geiste geheiligt werden? Hier wird er also gesalbt, nicht um Gott zu werden, — denn er war es auch vordem, — auch nicht, um König zu werden, — denn er war ewig Herrscher und ein Bild Gottes, wie jener Ausspruch besagt, — sondern auch dies ist wieder für uns geschrieben. Denn die Könige über Israel wurden in dem Augenblick Könige, da sie gesalbt wurden, während sie zuvor keine Könige waren wie David, Ezechias, Josias und die andern. Vom Erlöser aber, der doch schon vorher Gott war und immer die Herrschaft seines Vaters führte und auch den Hl. Geist mitteilte, wird gleichwohl gesagt, daß er jetzt gesalbt werde, damit er, der, wie es heißt, als Mensch mit dem Geist gesalbt wird, uns Menschen wie die Erhöhung und Auferstehung, so auch das Einwohnen des Geistes und dessen Freundschaft erwirke. Das deutet der Herr selbst mit eigenen Worten im Evangelium des Johannes an: „Ich habe sie in die Welt gesandt und heilige mich selbst für sie, damit auch sie in der Wahrheit geheiligt seien“. Mit diesen Worten aber zeigte er, daß nicht er selbst es ist, der geheiligt wird, vielmehr der heiligt. Denn nicht von einem andern wird er geheiligt, sondern er heiligt sich selbst, damit auch wir in der Wahrheit geheiligt werden. Der aber sich selbst heiligt, ist der Herr der Heiligung. Wie geschieht nun dies? Und was sagt er anders als: Ich, das Wort des Vaters, gebe mir selbst, Mensch geworden, den Geist und heilige mich selbst, da ich Mensch geworden bin, in ihm, damit von nun an in mir, der Wahrheit, — „denn Dein Wort ist Wahrheit“, — alle geheiligt werden?</p><p>Wenn er aber um unsertwillen sich heiligt und dies tut, nachdem er Mensch geworden ist, so galt offenbar auch die Herabkunft des Geistes auf ihn im Jordan uns, weil er unsern Leib trug. Und sie hat nicht zur Besserung des Wortes stattgefunden, sondern wieder zu unserer Heiligung, damit wir an seiner Salbung teilnehmen und auch mit Bezug auf uns gesagt sei: “Wißt ihr nicht, daß ihr ein Tempel Gottes seid, und der Geist Gottes in euch wohnt?” Denn da der Herr als Mensch im Jordan abgewaschen wurde, waren wir es, die in ihm und von ihm abgewaschen wurden. Und als er den Geist empfing, waren wir es, die von ihm für dessen Aufnahme empfänglich gemacht wurden. Deshalb ist er auch nicht in gleicher Weise wie Aaron oder David oder alle die andern mit Öl gesalbt worden, sondern in anderer Weise als alle seine Genossen, mit dem Öle der Freude, unter dem er selbst den Geist versteht, wenn er durch den Propheten spricht: “Der Geist des Herrn ist über mir, deshalb weil er mich” salbte“. Ebenso hat auch der Apostel gesagt:”Wie ihn Gott mit dem Heiligen Geiste gesalbt hat“. Wann nun ist dies über ihn gesagt worden, wenn nicht damals, als er auch im Fleische erschienen war und im Jordan getauft wurde, und der Geist auf ihn herabgekommen ist? Ja auch der Herr selbst sagt:”Der Geist wird von dem meinigen nehmen“, und:”Ich sende ihn“, und zu den Jüngern:”Empfanget den Heiligen Geist“, und gleichwohl heißt es jetzt von ihm, der als Wort und Abglanz des Vaters ihn andern mitteilt, daß er geheiligt werde, und eben wieder, weil er Mensch geworden ist, und der Leib, der geheiligt wird, ihm angehört. Mit ihm also begannen auch wir die Salbung und das Siegel zu empfangen, wie Johannes sagt:”Auch ihr habt die Salbung vom Heiligen“, und der Apostel:”Auch ihr seid besiegelt mit dem Hl. Geiste der Verheißung“. Das also wird um unsertwillen und für uns gesagt. Wie läßt sich nun hieraus ein Fortschritt zum Bessern und ein Lohn für die Tugend oder überhaupt für das Tun und Wirken des Herrn erweisen? Denn wenn er Gott geworden wäre, ohne es zuvor zu sein, wenn er, ohne zuvor König zu sein, zur Herrschaft erst gelangt wäre, so hätte eure Rede doch noch einen Schatten von Glaubwürdigkeit. Wenn er aber Gott ist, und der Thron seiner königlichen Herrschaft ewig ist, wie konnte Gott einen Zuwachs erhalten? Oder was fehlte dem, der auf dem Throne des Vaters saß? Wenn aber, wie auch der Herr selbst gesagt hat, der Geist sein ist, und er vom Seinigen nimmt und er selbst ihn sendet, so ist es ja nicht das Wort, insoweit es Wort und Weisheit ist, das mit dem von ihm gegebenen Geiste gesalbt wird, sondern es ist das von ihm angenommene Fleisch, das in ihm und von ihm gesalbt wird, damit die Heiligung, die dem Herrn als Menschen zuteil wurde, von ihm allen Menschen mitgeteilt würde. Denn nicht von sich selbst spricht der Geist, sagt er, sondern das Wort ist es, das ihn den Würdigen erteilt. Der vorhin zitierten Stelle ähnlich ist auch folgende. Wie nämlich der Apostel geschrieben hat:”Welcher, da er in Gottesgestalt war, das Gottgleichsein für keinen Raub erachtete, sondern sich selbst entäußerte und Knechtsgestalt annahm“, so preist David den Herrn als ewigen Gott und König, der zu uns gesandt wurde und unsern sterblichen Leib annahm. Von ihm wird dies angedeutet in den Psalmworten:”Myrrhe und Myrrhenöl und Kasia sind in Deinen Kleidern", durch Nikodemus und die Begleiterinnen Marias offenkundig, wenn der erstere eine Mischung von Myrrhe und Aloe gegen hundert Pfund brachte, die letzteren aber Wohlgerüche zum Begräbnis des Leibes des Herrn bereitet hatten.</p><p>Welchen Zuwachs gewann nun wieder der Unsterbliche, wenn er das Sterbliche annahm, oder welche Verbesserung ward dem Ewigen zuteil, wenn er das Zeitliche anzog? Und wie könnte noch ein höherer Lohn dem ewigen Gott und König zuteil werden, der im Schoße des Vaters ist? Sehet ihr nicht, daß auch das unsertwegen und für uns geschehen und geschrieben ist, damit der Herr uns, die Sterblichen und Vergänglichen, unsterblich mache und in das ewige Reich der Himmel einführe? Errötet ihr nicht, die göttlichen Aussprüche lügenhaft zu entstellen? Denn indem unser Herr Jesus Christus auf Erden erschien, wurden wir verbessert und von der Sünde befreit; er selbst aber bleibt derselbe. Und nicht hat er sich geändert, da er Mensch geworden ist denn ich muß wiederum dasselbe sagen —, sondern, wie geschrieben steht, „das Wort Gottes bleibt in Ewigkeit“. Denn so gewiß er vor der Menschwerdung als Wort den Heiligen den Geist als sein eigen mit teilte, so heiligt er auch, nachdem er Mensch geworden ist, alle durch den Geist und spricht zu den Jüngern: „Empfanget den Heiligen Geist!“. Und er gab ihn dem Moses und den übrigen Siebzig. Durch ihn flehte David zum Vater mit den Worten: „Deinen Heiligen Geist nimm nicht von mir!“. Und nachdem er Mensch geworden, sprach er: „Und ich werde euch den Tröster senden, den Geist der Wahrheit“. Und so sandte ihn das untrügliche Wort Gottes. Also „Jesus Christus, gestern und heute derselbe in Ewigkeit“, bleibt unveränderlich und ist derselbe, der gibt und empfängt, gibt als Gottes Wort, empfängt als Mensch. Nicht also das Wort, insofern es Wort ist, verbessert sich — es besaß ja alles und besitzt es immer —, sondern die Menschen sind es, die in ihm und durch ihn zu empfangen beginnen. Da es nun von ihm heißt, daß er in menschlicher Weise gesalbt werde, so sind wir es, die in ihm gesalbt werden. Und auch, wenn er getauft wird, sind wir es, die in ihm getauft werden. Über all dies gibt uns der Heiland näheren Aufschluß, wenn er zum Vater sagt: „Und ich habe ihnen die Herrlichkeit gegeben, die Du mir gegeben hast, damit sie Eins seien wie wir Eins sind“. Unsertwegen bat er also um die Herrlichkeit und heißt es: „Er empfing“ und „er gab“ und „er erhöhte“, damit wir empfingen, damit er uns gebe und wir in ihm erhöht würden, wie er auch für uns sich heiligt, damit wir in ihm geheiligt würden.</p><p>Wenn sie aber deshalb, weil im Psalm unmittelbar die Worte folgen: „Darum salbte Dich Gott, Dein Gott“, aus dem Worte „darum“ wieder einen Scheingrund für sich und ihre Sache gewinnen wollen, so mögen sie, die Schriftunkundigen und Erfinder der Gottlosigkeit, erkennen, daß auch hier wiederum das Wort „darum“ nicht einen Lohn für die Tugend oder das Tun und Wirken des Wortes, sondern wieder die Ursache seines Erscheinens unter uns und der Salbung des Geistes bezeichnet, die für uns an ihm vollzogen wurde. Denn er hat nicht gesagt: Darum salbte er Dich, damit Du Gott würdest oder König oder Sohn oder Wort. Denn er war dies auch vordem und ist es immer, wie gezeigt wurde. Vielmehr sagte er: Da Du Gott bist und König, „darum“ wurdest Du auch gesalbt, da auch kein anderer den Menschen mit dem Heiligen Geiste verbinden konnte als nur Du, das Bild des Vaters, nachdem wir auch im Anfang geschaffen worden sind; denn Dein ist auch der Geist. Denn die Natur der geschaffenen Wesen bot hierfür nicht die nötige Garantie, da die Engel sündigten, die Menschen ungehorsam waren. Daher bedurfte es Gottes — Gott aber ist das Wort —, damit er selbst die befreite, die dem Fluche verfallen waren. Wenn er nun aus Nichtseiendem wäre, so wäre er auch Christus nicht, da er einer von allen und selbst auch Genosse wäre. Da er aber als Sohn Gottes Gott ist und als Abglanz und Abriß des Vaters ewiger König, deshalb ist er natürlich selbst der erwartete Christus, den der Vater den Menschen verkündigt und seinen heiligen Propheten offenbart, damit, wie wir durch ihn geschaffen worden sind, so auch in ihm allen die Erlösung von den Sünden zuteil, und alles von ihm regiert werde. Und dies ist die Ursache der an ihm vollzogenen Salbung und der Erscheinung des Wortes im Fleische. Sie schaut auch der Psalmist voraus, und er preist die Gottheit und väterliche Herrschaft des Wortes, wenn er ausruft: „Dein Thron, o Gott, besteht in Ewigkeit, ein Zepter der Gerechtigkeit ist das Zepter Deiner Herrschaft“. Und seine Ankunft unter uns ankündigend, sagt er: „Deshalb salbte Dich Gott, Dein Gott, mit dem Öle der Freude vor Deinen Genossen“.</p><p>Doch wie sollte es befremden oder unglaublich&lt; s90&gt; sein, wenn es vom Herrn, der den Geist schenkt, heißt, er werde jetzt selbst vom Geiste gesalbt, wo er doch, als die Umstände es wieder erheischten, nicht anstand, wegen seiner menschlichen Natur zu sagen, daß er geringer sei als der Geist? Denn als die Juden ihm entgegenhielten, daß er die Teufel durch Belzebub austreibe, da wies er diese Lästerzungen zurecht und antwortete ihnen mit den Worten: „Wenn ich aber im Geiste Gottes die Teufel austreibe“. Sieh also, der Spender des Geistes sagt jetzt, er treibe im Geiste die Teufel aus. Dieses ist aber nur wegen des Fleisches gesprochen; weil nämlich die Menschennatur nicht von sich aus, sondern nur durch die Kraft des Geistes imstande ist, die Teufel auszutreiben, deshalb sagte er als Mensch: „Wenn ich im Geiste Gottes die Teufel austreibe“. So erklärte er denn auch die Lästerung wider den Heiligen Geist für größer als die gegen seine Menschheit mit den Worten: „Wer gegen den Menschensohn ein Wort spricht, wird Verzeihung erhalten“, — es waren dies solche, welche sprachen: „Ist dies nicht des Zimmermanns Sohn?“ Die aber wider den Heiligen Geist lästern und die Werke des Wortes dem Teufel zuschreiben, werden der unentrinnbaren Strafe verfallen. So also sprach der Herr zu den Juden als Mensch. Den Jüngern aber gab er seine Gottheit und Größe zu erkennen und gab ihnen den Geist, dem gegenüber er sich nicht mehr als geringer, sondern als ebenbürtig bezeichnete und sprach: „Nehmet hin den Heiligen Geist“ und: „Ich sende ihn, und er wird mich verherrlichen, und was er hört, wird er reden“. Wie also hier der Herr, der Spender des Geistes selbst, nicht ansteht zu sagen, daß er als Mensch die Teufel im Geiste austreibe, ebensowenig hielt der nämliche Spender des Geistes zurück mit den Worten: „Der Geist des Herrn ist über mir, weil er mich salbte“, und zwar deshalb, weil er Fleisch geworden ist, wie Johannes sagt, damit kund würde, daß in beiden Fällen wir gemeint sind, wir, die bei der Heiligung die Gnade des Geistes nötig haben, und wir, die Dämonen nicht austreiben können ohne die Kraft des Geistes. Durch wen aber und von wem hätte der Geist erteilt werden sollen, wenn nicht durch den Sohn, dem der Geist gehört? Und wann hätten wir ihn empfangen können, wenn nicht damals, als das Wort Mensch geworden ist? Wie die Stelle beim Apostel zeigt, wären wir nicht erlöst und erhöht worden, wenn nicht der, welcher die Gestalt Gottes besaß, Knechtsgestalt angenommen hätte, so weist auch David darauf hin, daß wir in keiner andern Weise des Geistes teilhaft geworden und geheiligt worden wären, wenn nicht der Spender des Geistes selbst, das Wort, gesagt hätte, es werde für uns mit dem Geiste gesalbt. Daher haben wir ihn gewiß erhalten, weil es von ihm heißt, daß es im Fleische gesalbt sei. Denn da das Fleisch zuerst in ihm geheiligt wurde, und man von ihm sagt, daß es wegen des Fleisches als Mensch den Geist empfangen habe, so besitzen wir die daraus quillende Gnade des Geistes, indem wir aus seiner Fülle schöpfen.</p><p>Die Worte aber: „Du hast die Gerechtigkeit geliebt und das Unrecht gehaßt“, die im Psalme folgen, zeugen nicht, wie ihr wieder meint, für eine veränderliche Natur des Wortes, sondern sie weisen vielmehr mit diesem ihrem Inhalt hin auf seine Unveränderlichkeit. Denn die Natur der gewordenen Wesen ist wandelbar. Die einen sündigten, wie gesagt, die andern waren ungehorsam. Ihr Handeln ist nicht beständig, sondern vielfach tritt der Fall ein, daß der zur Stunde noch Rechtschaffene nachher sich ändert und ein anderer wird, so daß der, der eben noch gerecht war, nach kurzer Zeit als ungerecht befunden wird. Deshalb bedurfte es eines Unwandelbaren, damit die Menschen in der unwandelbaren Gerechtigkeit des Wortes ein Idealbild fürs Tugendleben hätten. Dieser Gedanke erscheint den Verständigen auch wohl begründet. Weil nämlich der erste Mensch Adam sich veränderte, und durch die Sünde der Tod in die Welt kam, deshalb war es in der Ordnung, daß der zweite Adam unwandelbar war, damit auch bei einem erneuten Versuch der Schlange ihre Tücke wirkungslos bleibe, und, da der Herr unveränderlich und unwandelbar ist, die Schlange bei ihren Angriffen allen gegenüber ohnmächtig würde. Denn wie vom Sündenfall Adams die Sünde auf alle Menschen überging, so wird auch infolge der Menschwerdung des Herrn und der Überwindung der Schlange durch ihn eine solche Kraft auf alle Menschen übergehen, so daß jeder von uns sagt: „Denn seine Anschläge sind uns nicht unbekannt“. Es wird also billigerweise der Herr, der immer und von Natur unwandelbar ist, der die Gerechtigkeit liebt und die Ungerechtigkeit haßt, gesalbt und auch abgesandt, damit er, der derselbe ist und bleibt, das veränderliche Fleisch annehme, die Sünde in ihm richte und es freimache und befähige, fortan die Gerechtigkeit des Gesetzes an sich zu erfüllen, so daß man auch sagen kann: „Wir aber sind nicht im Fleische, sondern im Geiste, wenn anders Gottes Geist in uns wohnt“.</p><p>Grundlos also habt ihr, Arianer, euch einer solchen Meinung hingegeben, und umsonst habt ihr euch auf die Schriftworte berufen. Denn das Wort Gottes ist unveränderlich und existiert immer und in derselben Weise, nicht einfach, sondern ebenso wie der Vater. Denn wie ist es ihm ähnlich, wenn es nicht so ist? Oder wie gehört alles, was dem Vater gehört, dem Sohne, wenn er nicht auch die Unveränderlichkeit und Unwandelbarkeit des Vaters besitzt? Nicht wie wenn er Gesetzen unterworfen wäre und nach beiden Seiten hinneigen könnte, liebt er das eine und haßt das andere, damit er nicht, aus Furcht zu fehlen, für das Eine sich entscheide und außerdem wieder als veränderlich eingeführt werde, sondern als Gott und Wort des Vaters ist er ein gerechter Richter und Freund der Tugend oder vielmehr auch ihr Verleiher. Da er also von Natur heilig und gerecht ist, deshalb heißt es von ihm, daß er die Gerechtigkeit liebe und die Ungerechtigkeit hasse. Dafür kann man auch sagen, er liebe die Tugendhaften und nehme sie auf, die Ungerechten aber weise er von sich und hasse sie. Denn auch vom Vater sagen die göttlichen Schriften dasselbe: „Gerecht ist der Herr und er liebt die Gerechtigkeit“, und: „Du haßt alle Übeltäter“ und: „Die Tore Sions liebt er, die Gezelte Jakobs aber schlägt er nicht hoch an“. Und: „Jakob liebte er, Esau aber haßte er“. Nach Isaias aber ist es wieder die Stimme des Herrn, der spricht: „Ich bin der Herr, der Gerechtigkeit liebt und den Raub der Ungerechtigkeit haßt“. So mögen sie also auch jene Worte wie diese auffassen; denn auch jene sind vom Bilde Gottes geschrieben. Oder sie sollen diese wie jene böswillig deuten und dann auch den Vater sich als veränderlich denken. Weil es aber nicht ohne Gefahr ist, andere auch nur so reden zu hören, deshalb fassen wir mit Recht die Worte, daß Gott die Gerechtigkeit liebe und den Raub der Ungerechtigkeit hasse, nicht so auf, als ob er nach beiden Seiten hinneigen könnte und für das Gegenteilige zugänglich wäre, so daß er sich für das eine entscheiden, das andere beiseite lassen könnte; denn dies ist den geschaffenen Dingen eigen. Vielmehr, weil er als Richter die Gerechten liebt und aufnimmt, von den Bösen aber sich fernhält, ist es wohl konsequent, auch vom Bilde Gottes so zu denken, daß es also in dieser Weise liebt und haßt. Denn die Natur des Bildes muß so sein, wie dessen Vater ist, mögen auch die Arianer wie Blinde weder dieses noch sonst etwas in den göttlichen Aussprüchen sehen. Denn da sie die Einfälle ihres Herzens oder vielmehr ihre Wahnideen aufgeben müssen, so flüchten sie sich wieder zu den Aussprüchen der heiligen Schriften, für die sie in der Regel auch kein Verständnis haben und daher ihren Sinn nicht herausfinden. So als ein Kanon gilt ihnen ihre eigene Gottlosigkeit; nach diesem verdrehen sie alle göttlichen Aussprüche, Wenn sie ja solche auch nur zitieren, verdienen sie nichts anderes zu hören als: „Ihr irrt und kennt die Schrift nicht, noch die Kraft Gottes“. Wenn sie aber hartnäckig darauf bestehen, dann verdienen sie wieder zurechtgewiesen zu werden und müssen hören: „Gebt den Menschen, was des Menschen ist, und Gott, was Gottes ist!“.</p><p>So sagen sie denn, in den Sprichwörtern stehe geschrieben: „Der Herr erschuf mich als Anfang seiner Wege für seine Werke“. Und im Briefe an die Hebräer sagt der Apostel: „Um so erhabener ist er geworden als die Engel, je ausgezeichneter der Name ist, den er vor ihnen ererbt hat“. Und kurz hernach: „Daher, heilige Brüder, die ihr der himmlischen Berufung teilhaftig seid, sehet auf den Gesandten und Hohenpriester unseres Bekenntnisses, Jesus, der treu ist dem, der ihn dazu gemacht hat“. Und in der Apostelgeschichte: „Es soll also euch allen bekannt sein, dem ganzen Haus Israel, daß Gott diesen Jesus, den ihr gekreuziget habt, zum Herrn und Christus gemacht hat“. Diese Stellen brachten sie hin und wieder vor und verfehlten den Sinn, wenn sie glaubten daraus schließen zu können, daß das Wort Gottes ein Gebilde, ein Geschöpf und eines von den geschaffenen Wesen sei. Und so täuschen sie die Unverständigen, indem sie die Schriftstellen als Vorwand benützen, statt des wahren Sinnes aber das eigene Gift ihrer Häresie darunter mischen. Denn wenn sie die rechte Einsicht hätten, so würden sie nicht wider den Herrn der Herrlichkeit freveln und nicht, was richtig geschrieben ist, verkehrt auslegen. Wenn sie nunmehr offenkundig das Verhalten des Kaiphas annehmen und zu judaisieren sich entschieden haben und deshalb nicht wissen, was geschrieben steht, nämlich daß Gott in Wahrheit auf der Erde wohnen wird, so sollen sie nicht die Worte der Apostel prüfen. Denn das ist der Juden Art nicht. Wenn sie aber auch mit den gottlosen Manichäern sich zusammenschließen und leugnen, daß das Wort Fleisch geworden und im Fleische erschienen sei, so sollen sie sich nicht auf die Sprichwörter berufen; die Manichäer tun ja das auch nicht. Wenn sie aber wegen ihrer ausnehmenden Stellung und des Gewinnes, der daraus ihrer Habsucht erwachsen ist, und aus Liebe zu äußerer Ehre nicht das Herz haben zu bestreiten, daß das Wort Fleisch geworden ist, da es ja geschrieben steht, so sollen sie entweder die betreffenden Schriftworte richtig auf die leibliche Ankunft des Erlösers beziehen, oder, wenn sie diesen Sinn leugnen, auch leugnen, daß der Herr auch Mensch geworden ist. Denn es geht nicht an, auf der einen Seite zuzugeben, das Wort sei Fleisch geworden, dann aber zu erröten ob dem, was über ihn geschrieben steht, und darum dessen Sinn zu entstellen.</p><p>Es steht also geschrieben: „Er ist um soviel vorzüglicher geworden als die Engel“. Denn diese Stelle muß man zunächst untersuchen. Man muß aber auch hier wie bei der ganzen göttlichen Schrift überhaupt so vorgehen, daß man sorgfältig auf die Zeit Rücksicht nimmt, zu der der Apostel sprach, sowie auf die Person und die Sache, um derentwillen er sprach, damit nicht der Leser, indem er hierin oder auch nur in einem dieser Punkte in Unkenntnis bleibt, vom Sinne abkommt. Denn dessen war sich auch jener wißbegierige Eunuch bewußt. Deshalb machte er sich an Philippus mit der Bitte: „Ich bitte dich, vom wem sagt dies der Prophet, von sich oder von einem andern?“. Denn er befürchtete, wenn er die Schriftstelle nicht auf die richtige Person beziehe, den richtigen Sinn nicht zu treffen. Auch die Jünger wollten den Zeitpunkt der Rede erfahren; deshalb wandten sie sich an den Herrn mit den Worten: „Sag uns, wann dies geschehen wird, und welches das Zeichen Deiner Ankunft sein wird“. Und als sie vom Erlöser die Endereignisse erfuhren, wollten sie wieder die Zeit erfahren, um selbst nicht irre zu gehen und auch andern Aufschluß geben zu können. Und da sie es erfahren hatten, klärten sie die Thessalonicher auf, die sich in der Gefahr des Irrtums befanden. Wenn nun einer diese Umstände recht kennt, dann gewinnt er auch die richtige und gesunde Einsicht in den Glauben. Faßt man aber etwas davon auf, nicht achtend des einen oder andern Umstands, alsbald fällt man in eine Häresie. So gingen, die Zeit übersehend, irre die Anhänger des Hymenäus und Alexander, indem sie sagten, daß die Auferstehung schon geschehen sei; der verflossenen Zeit nicht achtend auch die Galater, indem sie jetzt die Beschneidung angenommen haben. In der Person aber gingen und gehen bis heute fehl die Juden, die meinen, über einen aus ihnen sei gesagt: „Siehe, die Jungfrau wird empfangen und einen Sohn gebären, und sie werden seinen Namen Emmanuel nennen, das heißt: Gott mit uns“, und die glauben, daß die Worte: „Gott wird euch einen Propheten auferwecken“ von einem der Propheten gesagt seien, oder bezüglich der Worte: „Er wurde wie ein Lamm zur Schlachtbank geführt“ nicht von Philippus lernen, sondern annehmen, daß sie von Isaias oder sonst von einem der Propheten gelten.</p><p>In solcher Weise also gingen fürwahr auch die Feinde Christi in die Irre, und sie sind in eine abscheuliche Häresie gefallen. Denn hätten sie die Person, die Sache und die Zeit beim Apostelwort erkannt, dann hätten die Unverständigen nicht Menschliches auf die Gottheit übertragen und so schwer gefrevelt. Dies kann man sehen, wenn man den Anfang der Stelle richtig nimmt. Es sagt nämlich der Apostel: “Nachdem Gott vielgeteilt und auf mancherlei Weise in den Propheten zu den Vätern gesprochen, hat er in diesen letzten Tagen zu uns im Sohne geredet”. Dann sagt er kurz hernach: “Nachdem er durch sich selbst uns von den Sünden gereinigt hatte, hat er sich gesetzt zur Rechten der Majestät in der Höhe, um so erhabener geworden als die Engel, je ausgezeichneter der Name ist, den er vor ihnen ererbt hat”. An die Zeit also, in der er zu uns im Sohne gesprochen hat, und auch die Reinigung von den Sünden vollzogen wurde, erinnert das Apostelwort. Wann nun hat er zu uns im Sohne geredet? Und wann vollzog sich die Reinigung von den Sünden? Und wann wurde er Mensch, wenn nicht nach den Propheten “in den letzten Tagen”? Da hierauf von seinem Heilswerke an uns die Rede ist, und er von den letzten Zeiten spricht, so hat er damit passend daran erinnert, daß Gott zu den früheren Zeiten den Menschen gegenüber nicht geschwiegen habe. Er redete nämlich zu ihnen durch die Propheten. Und da auch die Propheten dienten, und durch Engel das Gesetz verkündet wurde, und der Sohn erschien und kam, um zu dienen, so mußte er die Worte hinzufügen: “um so vorzüglicher geworden als die Engel”, womit er zeigen wollte, daß der Dienst des Sohnes um soviel den Dienst der Knechte überragt habe, als der Sohn vom Knecht abstehe. Indem also der Apostel scheidet zwischen dem alten und dem neuen Dienst, schreibt er freimütig an die Juden die Worte: “um soviel erhabener geworden als die Engel”. Deshalb hat er überhaupt auch hier nicht vergleichungsweise gesagt “größer” oder “geehrter”, damit nicht einer jene sich vorstelle, als wären sie gleichen Geschlechtes mit ihm, sondern er hat “vorzüglicher” gesagt, um den Unterschied der Natur des Sohnes den gewordenen Dingen gegenüber zu erkennen zu geben. Und hiefür liefern uns den Beweis die göttlichen Schriften, indem David singt: “Vorzüglicher ist ein Tag in Deinen Gehöften als tausende” und Salomon ausruft: “Nehmet Zucht, und nicht Silber, und Erkenntnis ziehet erprobtem Golde vor. Denn vorzüglicher ist Weisheit als kostbare Steine und jedes geschätzte Ding ist ihrer nicht würdig”. Sind denn nicht die Weisheit und die Steine aus der Erde ihrem Wesen und ihrer Natur nach voneinander verschieden? Und welche Verwandtschaft besteht zwischen den himmlischen Gehöften und irdischen Wohnungen? Oder welche Ähnlichkeit besteht zwischen dem Ewigen und Geistigen und dem Augenblicklichen und Sterblichen? Denn gerade das sagt auch Isaias: “So spricht der Herr zu den Eunuchen:”Allen, welche meine Sabbate beobachten und wählen, was ich will, und die an meinem Bunde festhalten, werde ich in meinem Hause und in meiner Mauer einen angesehenen Platz anweisen. Ich werde ihnen einen ewigen Namen geben, der vorzüglicher ist als “Söhne” und “Töchter” und nicht vergehen wird“. Ebensowenig besteht eine Verwandtschaft zwischen dem Sohne und den Engeln. Wenn es aber keine Verwandtschaft gibt, so ist das”vorzüglicher" auch nicht vergleichsweise, sondern der Unterscheidung wegen gesagt, wegen der Verschiedenheit seiner Natur von der Natur jener. Und auch der Apostel versteht das “vorzüglicher”, wo er es erklärt, von nichts anderem als vom Unterschied zwischen dem Sohne und den entstandenen Wesen, indem er sagt, daß dieser Sohn sei, die andern aber dienende Wesen. Und dieser sitzt als Sohn zur Rechten des Vaters, die andern aber stehen als dienende Wesen an seiner Seite und werden gesandt und dienen ihm.</p><p>Wenn aber die Worte in der Schrift so lauten, so wird darin, ihr Arianer, der Sohn nicht als ein geschaffenes Wesen angekündigt, sondern vielmehr als ein von den entstandenen Wesen verschiedenes, als dem Vater eigen und in seinem Schoße ruhend. Denn wenn auch hier geschrieben steht „geworden“, so will damit nicht gesagt sein, der Sohn sei geworden, wie ihr es versteht. Wenn er einfach das „geworden“ gesagt und dann geschwiegen hätte, dann bestünde für die Arianer ein Vorwand. Da er aber den Sohn vorher genannt und im ganzen Abschnitt nachgewiesen hat, daß er von den gewordenen Wesen verschieden sei, so hat er nicht das Wort „geworden“ für sich allein gesetzt, sondern vorzüglicher mit „geworden“ verbunden. Er hielt nämlich das Wort für belanglos in der Erkenntnis, daß, wer auf den als echt bekannten Sohn das „geworden“ anwendet, soviel sagt, als: er sei gezeugt und: er sei vorzüglicher. Denn für das Erzeugte ergibt sich kein Unterschied, ob man nun sagt: „Es ist entstanden“, oder: „Es ist gemacht worden“. Die entstandenen Wesen aber, die Geschöpfe sind, kann man unmöglich gezeugt nennen, wenn man nicht etwa sagt, sie seien hernach durch Teilnahme am gezeugten Sohne gleichfalls gezeugt worden — doch dies keineswegs wegen ihrer eigenen Natur, sondern wegen ihrer Teilnahme am Sohne im Geiste. Auch dies weiß wieder die göttliche Schrift, wenn sie von den entstandenen Dingen sagt: „Alles ist durch ihn entstanden, und ohne ihn ist nichts geworden“ und: „Du hast alles in Weisheit gemacht“ und von den erzeugten Söhnen: „Dem Job wurden sieben Söhne und drei Töchter“ und: „Abraham war hundert Jahre alt, als ihm sein Sohn Isaak wurde“. Und Moses sagte: „Wenn jemanden Söhne werden“. Wenn also der Sohn ein anderer ist als die entstandenen Wesen und nur Er die eigene Zeugung der Substanz des Vaters, dann berufen sich die Arianer vergebens auf das „geworden“. Denn wenn sie, obschon hiemit zuschanden geworden, sich zwingen wiederum zu behaupten, jene Worte seien vergleichsweise gesprochen, und deshalb seien die verglichenen Gegenstände gleichgeartet, so daß der Sohn die Natur der Engel hätte, so wird sie besonders Schmach treffen, weil sie für den Valentin, Karpokrates und die übrigen Häretiker Partei ergreifen und gleich ihnen reden, von denen der eine gesagt hat, die Engel seien gleicher Natur mit Christus, Karpokrates aber sagt, die Engel seien die Weltschöpfer. Denn von ihnen haben vielleicht auch sie gelernt, wenn sie das Wort Gottes mit den Engeln vergleichen.</p><p>Doch diese Leute mit solchen Wahngedanken werden vom Sänger beschämt werden, der sagt: “Wer wird dem Herrn unter den Söhnen Gottes ähnlich sein?” Und: “Wer wird Dir unter den Göttern ähnlich sein, o Herr?” Sie sollen aber gleichwohl hören, wenn sie etwa auf diesem Weg zur Einsicht kommen wollen, daß man nur unter gleichartigen Dingen eine Vergleichung anzustellen pflegt, nicht unter ungleichartigen. Niemand wird also Gott mit einem Menschen vergleichen und einen Menschen wieder nicht mit unvernünftigen Geschöpfen, auch nicht Holz mit Stein, eben wegen der Unähnlichkeit der Natur. Gott ist etwas Unvergleichbares, der Mensch aber ist vergleichbar mit einem Menschen, Holz mit Holz, Stein mit Stein. Und niemand wird hiebei das Wort “vorzüglicher” gebrauchen, sondern “mehr” und “in höherem Grade”. So war Joseph in höherem Grade schön als seine Brüder, und Rachel als Lia. Ein Stern ist nicht vorzüglicher als ein anderer, sondern zeichnet sich mehr aus durch Glanz. Wenn man Verschiedenartiges miteinander vergleicht, dann wird das “vorzüglicher” zur Bezeichnung des Unterschiedes gebraucht, wie dies in Bezug auf die Weisheit und die Steine gesagt worden ist. Wenn also der Apostel gesagt hätte: “Um soviel steht der Sohn höher als die Engel” oder: “Um wieviel größer ist er”, dann hättet ihr einen Vorwand, da dann der Sohn mit den Engeln verglichen würde. Da er aber nun sagt, er sei vorzüglicher und so hoch erhaben wie ein Sohn über Knechte, so zeigt er, daß er anders ist als die Natur der Engel. Und wenn er wieder sagt, daß er alles gegründet habe, gibt er wieder auch zu verstehen, daß er ein anderer ist als alle entstandenen Dinge. Da er aber ein anderer ist und anderen Wesens ist als die Natur der gewordenen Dinge, wie wäre eine Vergleichung oder Ähnlichkeit seines Wesens mit den entstandenen Dingen möglich? Denn wenn sie auch wieder einem solchen Gedanken Raum geben, so wird sie Paulus mit den nämlichen Worten überführen: “Denn zu welchen von den Engeln hat er jemals gesprochen: Mein Sohn bist du, heute habe ich dich gezeugt? Und zu den Engeln sagte er: Der seine Engel zu Winden macht und seine Diener zu Feuerflammen”.</p><p>Sieh also, den entstandenen Dingen kommt es zu gemacht zu werden, und diese nennt er Geschöpfe. Wo er aber vom Sohne redet, spricht er nicht von einer „Erschaffung“ und nicht von einem „Entstehen“, sondern von „ewig“, „König“ und „Schöpfer sein“, wenn er sagt: „Dein Thron, o Gott, steht in Ewigkeit“ und: „Du hast, o Herr, im Anfang die Erde gegründet, und die Werke Deiner Hände sind die Himmel. Sie werden vergehen, Du aber bleibst“. Daraus könnten auch sie, wenn sie wollten, sehen, daß etwas anderes der Schöpfer, etwas anderes die Geschöpfe sind, und daß ersterer Gott ist, letztere aber entstanden und aus Nichtseiendem gemacht sind. Denn wenn es an dieser Stelle heißt: „Sie werden vergehen“, so sagt er dies nicht, als ob die Schöpfung dem Untergang anheimfallen würde, sondern um am Ausgang die Natur der entstandenen Dinge zu zeigen. Denn was vergehen kann, ist, wenn es auch dank der Huld dessen, der es erschaffen hat, nicht vergeht, doch aus Nichtseiendem geworden und bezeugt damit selbst, daß es einmal nicht war. Also deshalb, weil diese Dinge eine solche Natur haben, heißt es vom Sohne: „Du aber bleibst“, um seine Ewigkeit zu zeigen. Denn da er nicht wie das Gewordene „vergehen“ kann, vielmehr die Macht hat, immer zu bleiben, so paßt es nicht, von ihm zu sagen: „Er war nicht, bevor er gezeugt wurde“. Vielmehr ist ihm eigen, immer zu sein und zugleich mit dem Vater zu bleiben. Wenn nun der Apostel im Brief an die Hebräer das nicht geschrieben hätte, so würden fürwahr seine übrigen Briefe und die ganze Heilige Schrift es ihnen verwehren, etwas Derartiges vom Worte zu denken. Da er es aber selbst geschrieben hat, und schon oben bewiesen worden ist, daß der Sohn eine Zeugung aus der Substanz des Vaters ist, Er der Schöpfer, das übrige aber von ihm geschaffen, Er Abglanz, Wort, Bild und Weisheit des Vaters, die entstandenen Dinge aber irgendwie unter der Dreiheit stehen und dienen, so ist der Sohn andersartig und anderen Wesens als die entstandenen Dinge; ja er ist vielmehr der Substanz des Vaters eigen und natureins mit ihm. Denn deshalb hat auch der Sohn selbst nicht gesagt: „Der Vater ist vorzüglicher als ich“, damit man nicht meine, er sei der Natur des Vaters fremd, sondern er sagte „größer“, nicht mit Bezug auf eine bestimmte Größe oder Zeit, sondern wegen seiner Geburt aus dem Vater selbst. Und er hat auch mit den Worten „Er ist größer“ wieder die Eigenheit der Substanz angezeigt.</p><p>Der Apostel selbst wollte aber nicht in erster Linie die Substanz des Wortes mit den entstandenen Dingen vergleichen, wenn er sagte: “um soviel vorzüglicher geworden als die Engel”. Denn es ist unvergleichbar oder vielmehr etwas ganz anderes. Er wollte vielmehr im Hinblick auf die Ankunft des Wortes im Fleische und die damals von ihm getroffene Heilsordnung zeigen, daß dieser denen, die vor ihm da waren, nicht ähnlich sei, daß, soweit er der Natur nach von denen abstehe, die er früher abgesandt hatte, ebenso sehr, ja noch mehr die von ihm und durch ihn erlangte Gnade den Dienst der Engel übertreffe. Denn die Knechte konnten bloß um die Früchte bitten, der Sohn und Herr aber konnte die Schulden erlassen und den Weinstock versetzen. Und was nun vom Apostel beigefügt wird, <s104>zeigt den Unterschied des Sohnes von den entstandenen Dingen, indem er sagt: “Darum müssen wir umsomehr an dem halten, was wir gehört haben, damit wir nicht etwa verfließen. Denn wenn schon das durch die Engel verkündigte Wort fest ward, und jede Übertretung und jeder Ungehorsam gerechte Vergeltung empfing, wie sollten wir entrinnen, wenn wir ein so großes Heil außer acht lassen, das zuerst vom Herrn verkündigt und von denen, die es gehört, in uns befestigt worden ist”. Wenn aber der Sohn zu den entstandenen Dingen gehörte, so wäre er nicht vorzüglicher als sie, und es würde seinetwegen auf dem Ungehorsam kein größeres Maß von Strafe liegen. Denn auch im Dienste der Engel gab es für den einzelnen der Übertreter nicht ein “mehr” oder “weniger”, sondern Ein Gesetz gab es und Eine Strafe gegen die Übertreter. Da aber das Wort nicht zu den gewordenen Dingen gehört, sondern der Sohn des Vaters ist, so muß wohl, je vorzüglicher es selbst ist und das, was von ihm kommt und außerordentlich ist, desto strenger auch die Strafe ausfallen. Sie sollen also auf die durch den Sohn gewährte Gnade achten und ihn auch in seinen Werken bezeugt erkennen, daß er nämlich anders ist als die entstandenen Dinge, und er allein wahrer Sohn im Vater und der Vater in ihm ist. Das Gesetz aber wurde von den Engeln verkündet und hat niemand vollkommen gemacht, da es der Ankunft des Wortes bedurfte, wie Paulus gesagt hat. Die Ankunft des Wortes aber hat des Vaters Werk vollendet. Und damals herrschte von Adam bis auf Moses der Tod“, das Erscheinen des Wortes aber machte dem Tode ein Ende. Und wir sterben nicht mehr alle in Adam, sondern werden alle in Christus lebendig gemacht. Und damals wurde von Dan bis Bersabee das Gesetz verkündigt, und in Judäa allein war Gott bekannt. Jetzt aber ist über die ganze Erde ihr Ruf gedrungen, und die ganze Erde ist erfüllt mit der Erkenntnis Gottes; die Jünger lehrten alle Völker, und es ist jetzt erfüllt, was geschrieben steht:”Sie werden alle von Gott unterrichtet sein“. Und damals war, was erschien, nur ein Vorbild, jetzt aber ist die Wahrheit geoffenbart. Das erklärt der Apostel selbst wieder deutlicher mit den Worten:”In dem Maße ist Jesus eines vorzüglicheren Bundes Bürge geworden“. Und wiederum:”Nun aber ist ihm ein um soviel vorzüglicherer Priesterdienst zuteil geworden, je vorzüglicher der Bund ist, dessen Mittler er ist, der auf vorzüglichere Verheißungen gegründet ist“.”Denn das Gesetz hat nichts zur Vollendung geführt, war hingegen die Einführung einer vorzüglicheren Hoffnung“. Und wieder sagt er:”So mußten also die Abbilder der himmlischen Dinge hiedurch gereinigt werden; doch das Himmlische selbst erfordert höhere Opfer als diese“. Das”vorzüglicher" schreibt er also hier und durchweg dem Herrn zu, der vorzüglicher und anders ist als die entstandenen Dinge. Denn vorzüglicher ist sein Opfer, vorzüglicher die Hoffnung auf ihn, und seine Verheißungen sind nicht groß im Vergleich mit Kleinem, sondern sind mit anderm verglichen ihrer Natur nach anders. Denn auch der, welcher diese Heilsordnung getroffen hat, ist vorzüglicher als die entstandenen Dinge.</s104></p><p>Und wenn es wieder heißt: „Er ist Bürge geworden“, so ist seine Bürgschaft für uns gemeint. Denn wie er, da er Wort war, Fleisch wurde, und wir das „werden“ auf das Fleisch beziehen, — denn dieses ist entstanden und geschaffen, — so steht auch hier das „er ist geworden“, damit wir es im zweiten Sinne auffassen, weil er ja Mensch geworden ist. Und erkennen sollen die Streitliebenden, daß sie auch hier bei ihrer Böswilligkeit nicht verharren können, und hören sollen sie, daß Paulus, der weiß, daß er Sohn, Weisheit, Abglanz und Bild des Vaters ist, nicht seine Wesenheit als geworden bezeichnet, sondern hier das Werden auf den Dienst des Bundes bezieht, durch den der Tod, der einst die Herrschaft geführt hat, vernichtet wurde. Denn auch insofern ist sein Dienst vorzüglicher geworden, als Gott, „was dem Gesetze unmöglich war, weil es durch das Fleisch geschwächt ward, seinen Sohn in der Ähnlichkeit des Fleisches der Sünde sandte, und wegen der Sünde die Sünde im Fleische verdamme“, und so es vom Vergehen befreite, indem es beständig gefangen gehalten wurde, so daß es den göttlichen Geist nicht aufnehmen konnte. Indem er aber das Fleisch für die Aufnahme des Wortes empfänglich machte, bewirkte er, daß wir nicht mehr nach dem Fleische wandeln, sondern nach dem Geiste und oft sagen: „Wir sind nicht im Fleische, sondern im Geiste“, und: „Der Sohn Gottes kam in die Welt, nicht damit er die Welt richte, sondern damit er alle erlöse und die Welt durch ihn gerettet werde“. Denn damals wurde die Welt wie ein Schuldiger vom Gesetze gerichtet. Nun aber nahm das Wort das Gericht auf sich, litt im Leibe für alle und schenkte allen das Heil. Im Hinblick darauf rief Johannes aus: „Das Gesetz wurde durch Moses gegeben, die Gnade und die Wahrheit aber ist uns durch Jesus Christus geworden“. Vorzüglicher aber als das Gesetz ist die Gnade und als der Schatten die Wahrheit.</p><p>Was also „vorzüglicher“ ist, konnte, wie gesagt, durch keinen andern entstehen als durch den Sohn, der zur Rechten des Vaters ist. Worauf weist dies hin, wenn nicht auf die Echtheit des Sohnes und darauf, daß die Gottheit des Vaters die des Sohnes ist? Denn da der Sohn die Herrschaft des Vaters führt, so sitzt er auf demselben Throne wie der Vater, und da er in der Gottheit des Vaters geschaut wird, so ist Gott das Wort, und der den Sohn sieht, sieht den Vater, und so ist Ein Gott. Wenn er nun zur Rechten sitzt, setzt er den Vater nicht zur Linken, sondern was im Vater zur Rechten ist und ehrenvoll, das besitzt auch der Sohn und er sagt: „Alles, was der Vater hat, ist mein“. Deshalb sieht auch der Sohn, wenn er zur Rechten sitzt, gleichfalls den Vater zur Rechten, wenn er auch als Menschgewordener sagt: „Ich sah meinen Herrn immer vor mir, weil er zu meiner Rechten ist, damit ich nicht wanke“. Denn auch hierin zeigt sich wieder, daß der Sohn im Vater und der Vater im Sohne ist. Denn wenn der Vater zur Rechten ist, dann ist der Sohn in dem, der zur Rechten sitzt, und wenn der Sohn zur Rechten sitzt, ist der Vater im Sohne. Die Engel dienen, indem sie auf- und niedersteigen. Vom Sohn aber sagt er: „Und es sollen ihn anbeten alle Engel Gottes“. Und wenn die Engel dienen, sagen sie: „Ich bin zu Dir gesandt“ und: „Der Herr hat befohlen“. Wenn aber der Sohn auch in menschlicher Weise sagt: „Ich bin gesandt“ und daß er komme, das Werk zu vollenden und zu dienen, so sagt er gleichwohl als Wort und Bild: „Ich bin im Vater und der Vater ist in mir“, und: „Wer mich gesehen hat, hat den Vater gesehen“, und: „Der Vater bleibt in mir und vollbringt selbst die Werke“. Denn, was man in diesem Bilde sieht, das sind die Werke des Vaters. Das genügt nun, um die zu beschämen, welche gegen die Wahrheit selbst kämpfen. Wenn sie aber, weil geschrieben steht, „vorzüglicher geworden“, das „geworden“ nicht so vom Sohn verstanden wissen wollen, als hieße es: Er ist es geworden und ist es, oder das „geworden“ nicht so nehmen und deuten wollen, daß sein Dienst vorzüglicher geworden sei, wie wir sagten, sondern meinen, daß mit diesem Worte der Sohn als entstanden hingestellt sei, so sollen sie auch darauf eine kurze Antwort vernehmen, da sie ja das Gesagte vergessen haben.</p><p>Wenn der Sohn einer von den Engeln ist, so soll wie auf jene so auch auf ihn das „geworden“ seine Anwendung finden, und er soll sich seiner Natur nach in nichts von ihnen unterscheiden, sondern es sollen entweder auch diese Söhne, oder es soll auch jener ein Engel sein, und sie sollen alle gemeinsam zur Rechten des Vaters sitzen, oder es soll mit allen auch der Sohn als dienender Geist zur Seite stehen, gleichfalls so wie jene zum Dienste abgesandt. Wenn aber Paulus den Sohn von den entstandenen Dingen sondert mit den Worten: „Zu welchem von den Engeln hat er je gesprochen: Mein Sohn bist Du?“ und Er den Himmel und die Erde erschafft, sie aber durch ihn werden, Er beim Vater sitzt, diese aber zum Dienste bereitstehen, wem ist da nicht wiederum klar, daß er nicht mit Bezug auf die Substanz des Wortes das „geworden“ aussagte, sondern mit Bezug auf den durch das Wort vollzogenen Dienst? Denn wie er, der das Wort war, Fleisch geworden ist, so ist er nach seiner Menschwerdung in seinem Dienste um soviel vorzüglicher geworden gegenüber den Engeln mit ihrem Dienste, als der Sohn von Knechten und der Schöpfer vom Geschaffenen absteht. Darum mögen sie aufhören, von der Substanz des Sohnes das „geworden“ zu verstehen — denn er gehört nicht zu den entstandenen Wesen —, und sie mögen erkennen, daß mit dem „geworden“ der Dienst und die eingetretene Heilsordnung angezeigt wird. Wie er aber im Dienste vorzüglicher geworden ist, da er in seiner Natur vorzüglicher war als die gewordenen Wesen, erhellt aus dem bereits Gesagten, und ich glaube, daß sie sich vielleicht jetzt auch schämen. Wenn sie aber den Streit suchen, dann mag es angezeigt sein, gegen ihre unsinnige Vermessenheit den Kampf aufzunehmen und die ähnlich lautenden Worte über den Vater ihnen entgegen zu halten, damit sie entweder beschämt ihrer Zunge Böses verwehren oder einsehen, welch krasser Unwissenheit sie anheimgefallen sind. Es steht also geschrieben: „Werde mir ein schirmender Gott und ein Haus der Zuflucht, um mich zu retten“ und wieder: „Der Herr wurde eine Zufluchtstätte für den Armen“ und was alles ähnliches in den göttlichen Schriften sich findet. Wenn sie nun sagen, daß das vom Worte gesagt sei, was auch vielleicht mehr der Wahrheit entspricht, so mögen sie erkennen, daß die Heiligen bitten, Er, der nicht ein gewordenes Wesen ist, möge ihnen Helfer und Zufluchtsstätte werden, und sie sollen von nun an das „geworden“ und „er machte“ und „er schuf“ auf seine Ankunft im Fleische beziehen. Denn damals ist er Helfer und Zufluchtstätte geworden, als er mit seinem Leibe unsere Sünden an das Holz erhob und sagte: „Kommt alle zu mir, die ihr mühselig und beladen seid, ich will euch erquicken“.</p><p>Wenn sie aber sagen, daß diese Worte vom Vater gelten, werden sie dann, da ja auch hier geschrieben steht: „Werde“ und „es wurde“, soweit gehen, daß sie behaupten, Gott sei geworden? Ja sie werden es wagen, da sie auch vom Worte selbst sich solche Gedanken machen. Denn die Konsequenz verlangt, daß sie auch vom Vater Ähnliches denken, was sie über sein Wort phantasieren. Doch ferne sei es, daß einem Gläubigen jemals so etwas auch nur in den Sinn komme! Denn weder gehört der Sohn zu den gewordenen Dingen, noch bedeutet, wenn hier geschrieben und gesagt ist: „Werde“ und „er wurde“, dies den Anfang des Seins, sondern die den Bedürftigen zuteil gewordene Hilfe. Denn Gott ist immer und bleibt derselbe, die Menschen sind aber hernach durch das Wort entstanden, da der Vater selbst es wollte, und Gott ist unsichtbar und für die gewordenen Wesen unzugänglich und zwar gerade für die Menschen auf Erden. Wenn also die Menschen in ihrer Ohnmacht ihn anrufen, wenn sie in der Verfolgung ihn um Hilfe anflehen, wenn sie ungerecht behandelt zu ihm beten, dann zeigt sich der Unsichtbare als der Menschenfreundliche in seiner wohltätigen Huld, die er durch sein eigenes Wort und in ihm zeigt, und von nun an richtet sich die Erscheinung Gottes nach dem Bedürfnis eines jeden, und es wird den Ohnmächtigen Kraft, den Verfolgten Zuflucht und Haus des Heils. Denen, die Unrecht leiden, sagt sie: „Da du noch redest, werde ich sprechen: Sieh, hier bin ich“. Und was ein jeder durch den Sohn in Empfang nimmt, von dem sagt jeder, daß Gott ihm dies sei, da auch die Hilfe von Gott selbst durch das Wort kommt. So zu reden sind die Menschen gewöhnt, und jedermann wird sich sagen müssen, daß diese Redeweise die richtige ist. Oft haben auch Menschen den Menschen Hilfe gebracht, und es ist der eine dem, der Unrecht litt, beigesprungen, wie Abraham dem Lot; ein anderer hat dem Verfolgten sein Haus geöffnet, wie Abdias den Söhnen der Propheten; ein dritter beherbergte den Fremdling, wie Lot die Engel; wieder ein anderer unterstützte die Bedürftigen, wie Job die, welche ihn darum baten. Wenn nun einer von denen, die Gutes empfangen haben, sagen würde: „Der und der ist mein Helfer geworden“, und wieder ein anderer sagte: „und mir Zuflucht und diesem Ernährer“, so würden sie mit diesen Worten nicht den Anfang der Entstehung und nicht die Substanz der Wohltäter, sondern die von ihnen empfangene Wohltat bezeichnen, und wie diese, so bezeichnen in gleicher Weise die Heiligen, wenn sie von Gott sagen: „Er wurde“ und „werde“ nicht irgend einen Anfang der Entstehung —, denn Gott ist anfangslos und nicht geworden —, sondern die von ihm den Menschen gewährte Rettung.</p><p>Bei dieser Auffassung ergibt sich wohl auch für den Sohn, daß, wie immer und so oft man von ihm sagt: „Er wurde“ und „werde“, dies denselben Sinn hat. So dürfen wir auch, wenn wir die Worte vernehmen: „Vorzüglicher geworden als die Engel“ und: „Er wurde“ nicht denken, daß es beim Worte irgend einen Anfang des Seins gebe, und nicht dürfen wir das Wort überhaupt als entstanden wähnen, sondern das Wort bei Paulus Mensch geworden ist. Denn damals, als das Wort Fleisch wurde und unter uns wohnte und kam, um zu dienen und allen Rettung zu bringen, wurde es uns Heil und Leben und Versöhnung. Damals ist seine Heilsordnung für uns vorzüglicher geworden als die der Engel, und er wurde Weg und Auferstehung. Und wie das „werde mir zu einem schirmenden Gott“ nicht die Entstehung der Substanz Gottes selbst, sondern seine Menschenliebe, wie wir gesagt haben, bezeichnet, so zeigt auch hier das „vorzüglicher geworden als die Engel“ und „er wurde“ und „Jesus ist ein um so vorzüglicherer Bürge geworden“, nicht die Substanz des Wortes als geworden an — das sei ferne —, sondern die aus seiner Menschwerdung uns zuteil gewordene Wohltat, mögen auch die Häretiker undankbar und zanksüchtig in ihrer Gottlosigkeit verharren.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung des 19. Jahrhunderts, <em>Vier Reden gegen die Arianer</em> (BKV). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2093/versions/vier-reden-gegen-die-arianer-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "athanasius-four-discourses-against-the-arians-2"

    path: "Athanasius_Gegen_die_Arianer_2"
    title: "Zweite Rede gegen die Arianer"
    menu: { parent: "Dogmatisch-polemische Werke", title: "Zweite Rede gegen die Arianer", priority: 2 }
    update: true
    body: |-
      <p><em>Zweite Rede gegen die Arianer (Bibliothek der Kirchenväter).</em></p><p>Ich glaubte, die Heuchler des arianischen Wahnsinns würden sich auf das, was ich bisher zu ihrer Widerlegung und zum Erweis der Wahrheit vorgebracht habe, zufrieden geben und nunmehr sich ruhig verhalten und bereuen, was sie vom Heiland übel gedacht und geredet haben. Sie aber geben in unbegreiflicher Weise auch jetzt noch nicht nach, sondern wie Schweine und Hunde in ihrem eigenen Auswurf und Kot sich wälzen, so erfinden sie vielmehr für ihre Gottlosigkeit neue Wege. Ohne also zu verstehen, was in den Sprichwörtern geschrieben steht: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“, noch auch, was vom Apostel gesagt wird: „Der treu ist dem, der ihn gemacht hat“, streiten sie einfach herum und behaupten, der Sohn sei ein Geschöpf und Gebilde. Und doch hätten sie, wenn sie nicht völlig ihre Sinne verloren hätten, schon aus dem bereits Gesagten ersehen können, daß der Sohn, wie die Wahrheit bezeugt, nicht aus Nichtseiendem ist, noch überhaupt zu den entstandenen Dingen gehört. Denn da er Gott ist, ist er wohl auch kein Geschöpf, und man darf ihn nicht ein Gebilde nennen; denn von Gebilden und Geschöpfen kann man sagen, sie seien aus Nichtseiendem und sie waren nicht, bevor sie erzeugt wurden. Da sie aber wie aus Furcht, ihr Wahngebilde preisgeben zu müssen, nach Gewohnheit auf die schon genannten Stellen der göttlichen Schrift sich berufen, die zwar richtig niedergeschrieben sind, aber von ihnen in frivoler Weise behandelt werden, wohlan denn, so wollen wir auf den Sinn des bereits Gesagten wieder zurückgehen und die Gläubigen daran erinnern, diesen aber aus jeder einzelnen Stelle nachweisen, daß sie das Christentum überhaupt nicht kennen. Denn wenn sie es kennen würden, so würden sie sich nicht im Unglauben der heutigen Juden verschließen, sondern durch Nachforschen erfahren, daß „im Anfang das Wort war, und das Wort bei Gott war, und Gott das Wort war“, und daß damals, als nach dem Wohlgefallen des Vaters das Wort selbst Mensch geworden ist, passend über ihn von Johannes gesagt sei: „Das Wort ist Fleisch geworden“ und von Petrus: „Er machte ihn zum Herrn und Gesalbten“ und durch den Mund des Salomo gleichsam vom Herrn selbst: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“, von Paulus aber: „Um soviel vorzüglicher geworden als die Engel“ und wiederum: „Er entäußerte sich selbst, indem er Knechtsgestalt annahm“ und wieder: „Deshalb, heilige Brüder, Mitgenossen des himmlischen Berufes, sehet auf Jesum, den Gesandten und Hohenpriester unseres Bekenntnisses, der treu ist dem, der ihn dazu gemacht hat“. Denn alle Aussprüche dieser Art haben dieselbe Bedeutung und denselben Sinn, wie er der Gottesfurcht entspricht und die Gottheit des Wortes und das bezeichnet, was in menschlicher Weise über ihn gesagt wird, weil er auch Menschensohn geworden ist. Und wenn nun auch dies zu ihrer Widerlegung hinreichte, so hielt ich es gleichwohl für nötig, sie, die das Wort des Apostels nicht verstehen und meinen, — um dies zuerst zu erwähnen, — das Wort Gottes sei auf Grund des Schriftwortes: „Der dem treu ist, der ihn gemacht hat“ eines von den Geschöpfen, mit dieser ihrer Behauptung wieder zu beschämen, wobei wir entsprechend unserem bisherigen Verfahren von ihrer eigenen Voraussetzung ausgehen.</p><p>Wenn er nun nicht Sohn ist, so soll er auch ein Geschöpf genannt werden, und alles, was von den Geschöpfen gilt, soll auch ihm nachgesagt werden, und er soll nicht einziger Sohn heißen, nicht Wort, nicht Weisheit, Gott selbst soll nicht Vater heißen, sondern nur Schöpfer und Bildner seiner Kreatur. Und die Schöpfung soll nicht ein Bild und Ausdruck seines schöpferischen Willens sein, und er sei nach ihrer Ansicht nicht zeugungsfähiger Natur, so daß es von seiner eigenen Substanz kein Wort, keine Weisheit und überhaupt auch kein Bild gibt. Denn wenn es keinen Sohn gibt, gibt es auch kein Bild. Wenn es aber keinen Sohn gibt, wie wollt ihr dann behaupten, daß Gott ein Schöpfer sei, wenn doch durch das Wort und in der Weisheit alles Werdende entsteht, und außer dem nichts entstehen kann, er aber nach eurer Ansicht niemand hat, in dem und durch den er alles macht? Wenn aber die göttliche Substanz selbst nicht fruchtbar ist, sondern nach ihrer Ansicht unfruchtbar wie ein Licht, das nicht leuchtet, und eine trockene Quelle, warum schämen sie sich nicht zu behaupten, ihm komme eine schöpferische Energie zu? Wenn sie aber das Naturhafte aufheben, warum erröten sie nicht, wenn sie der Willensäußerung den Vorrang geben wollen? Wenn er aber das außen Liegende und zuvor Nichtbestehende, dessen Existenz er aber will, ins Dasein setzt und dessen Schöpfer wird, so ist er wohl viel früher Vater einer Zeugung aus seiner eigenen Substanz. Denn wenn sie bezüglich des Nichtbestehenden Gott das Wollen zuerkennen, warum erkennen sie dann Gott das nicht zu, was höher steht als der Wille? Höher aber als der Wille steht, daß er von Natur Vater des eigenen Wortes ist. Wenn nun das erstere, das Naturhafte, nach ihrer unverständigen Meinung nicht existierte, wie kann denn das zweite eintreten, was dem Willen zukommt? Zuerst ist doch das Wort, und erst später das Geschöpf. Doch es existiert das Wort, mögen auch die Gottlosen sich noch mehr erlauben, und durch dasselbe ist die Schöpfung entstanden, und offenbar hat wohl Gott, wenn er Schöpfer ist, auch das schöpferische Wort nicht von außen, sondern als sein eigen. Man muß nämlich wieder dasselbe sagen. Wenn er das Wollen hat, und sein Wille wirksam ist, und wenn sein Wille genügt, die werdende Dinge ins Dasein zu rufen, sein Wort aber wirksam und schöpferisch ist, so ist es zweifellos der lebendige Ratschluß des Vaters und die wesenhafte Energie und wahres Wort, in dem alles sich gebildet hat und trefflich geleitet wird. Und es wird auch niemand bezweifeln, daß der Ordner vor der Ordnung und vor dem Geordneten da ist. Ebenso liegt, wie ich bereits sagte, bei Gott das Schaffen später als das Erzeugen. Denn Sohn ist, was eigentlich und wahrhaft aus jener seligen und immerwährenden Substanz stammt. Was aber von ihrem Willen kommt, entsteht und bildet sich von außen und wird durch die eigene und aus ihr stammende Zeugung geschaffen.</p><p>Wenn nun unsere Ausführung die große Ungereimtheit derer aufzeigt, die behaupten, es gebe keinen Sohn Gottes, wohl aber ein Geschöpf, so müssen wir nunmehr zugeben, daß der Herr der Sohn ist. Wenn aber ein Sohn existiert, wie dem auch wirklich ist, und zugegeben ist, daß der Sohn nicht von außen, sondern vom Erzeuger stammt, so sollen sie sich nicht um die Worte herumstreiten, wie ich bereits sagte, wenn doch die Heiligen mit Bezug auf das Wort selbst anstatt der Worte “der gezeugt hat” die Worte “der gemacht hat” anwenden, da es in solchen Fällen auf das Wort nicht ankommt, so lange im Wesen Übereinstimmung herrscht. Denn die Worte heben ja das Wesen nicht auf, vielmehr bezieht das Wesen die Ausdrücke auf sich und ändert sie. Denn nicht sind die Worte früher als die Substanzen, sondern zuerst sind die Substanzen und erst nachher die Worte. Daher wird auch, wenn die Substanz ein Geschöpf oder Gebilde ist, alsdann die Ausdrucksweise “er machte” und “es wurde” und “er erschuf im eigentlichen Sinn auf sie angewandt und bezeichnet das Geschöpf. Wenn aber die Substanz eine Zeugung ist und ein Sohn, dann findet die Ausdrucksweise”er machte" und “es wurde” und “er erschuf” nicht mehr im eigentlichen Sinne auf sie ihre Anwendung und bezeichnet auch kein Geschöpf, sondern man wählt unterschiedslos für den Ausdruck “er zeugte” die Ausdrucksweise “er machte”. Oft nun nennen Väter ihre natürlichen Kinder ihre Knechte, ohne die Echtheit ihrer Abstammung zu leugnen, und oft nennen sie ihre Knechte in wohlwollender Gesinnung Kinder, ohne ihren ursprünglichen Ankauf zu verhehlen, vielmehr sagen sie ersteres kraft ihrer Autorität als Väter, letztere Bezeichnung wählen sie aus Menschenfreundlichkeit. So nannte Sara den Abraham Herrn, obschon sie nicht Magd, sondern Gattin war, und der Apostel stellte den Sklaven Onesimus mit Philemon, seinem Herrn, zusammen wie einen Bruder. Bersabee aber, obschon sie Mutter war, nannte den Sohn Knecht, indem sie zum Vater sprach: “Deinen Knecht Salomo”. Dann sprach auch der Prophet Nathan, als er zu ihm ging, dasselbe wie jene: “Salomo, deinen Knecht”, und es kümmerte sie nicht, den Sohn Knecht zu nennen. Denn es erkannte sowohl jener, da er es hörte, die Abstammung, als auch diese mit ihrer Redeweise die Echtheit nicht verkannten. Sie baten ja, daß Er Erbe des Vaters werde, er, den sie Knecht nannten; denn er war von Natur Davids Sohn.</p><p>Wenn wir also diese Stellen lesen, so verstehen wir sie gut, und wenn wir von einem Knecht Salomo hören, so halten wir ihn nicht für einen Knecht, sondern für einen natürlichen und echten Sohn. So sollen auch gewisse Leute, wenn die Heiligen auch vom Heiland, der als wahrer Sohn bekannt wird, und von Natur Wort ist, sagen: „Der treu ist dem, der ihn gemacht hat“, oder wenn er von sich selbst sagt: „Der Herr schuf mich“ und: „Ich bin Dein Knecht und der Sohn Deiner Magd“ und dergleichen mehr, deshalb nicht seinen Sohnescharakter leugnen, sondern sie sollen, wie bei Salomo und David, so auch über Vater und Sohn richtig urteilen. Denn wenn sie von einem Knecht Salomo hören und ihn doch als Sohn bekennen, verdienen sie nicht tausendfach den Tod, wenn sie nicht beim Herrn dieselbe Ansicht beibehalten, sondern wenn sie von Zeugung, Wort und Weisheit hören, die Bezeichnung mit Gewalt zu verdrehen und die natürliche und echte Geburt des Sohnes aus dem Vater zu leugnen suchen, wenn sie aber die Ausdrücke und Bezeichnungen von einem Geschöpfe hören, sich alsbald auf den Glauben bringen lassen, der Sohn sei von Natur ein Geschöpf, und das Wort leugnen, obschon sie, weil er Mensch geworden ist, alle derartigen Bezeichnungen auf seine menschliche Seite beziehen können? Erscheinen nun nicht auch sie als Greuel vor dem Herrn, wenn sie zweierlei Gewicht bei sich tragen und mit dem einen jene Verhältnisse bemessen, mit dem andern aber den Herrn lästern? Doch vielleicht pflichten sie uns bei, die Benennung Knecht sei aus Zuneigung angewandt, halten aber an dem Ausdruck „dem, der gemacht hat“ als einer starken Stütze ihrer Häresie fest. Doch auch diese Stütze ist in ihren Händen ein geknicktes Rohr. Denn sie werden alsbald sich das Urteil sprechen, wenn sie den Sprachgebrauch der Schrift kennen lernen. Denn Salomo wird, obschon er Sohn ist, Knecht genannt. So leugnen auch die Eltern, — um das schon früher Gesagte nochmals zu sagen, — wenn sie auch ihre natürlichen Söhne als gemacht, gebildet und geworden bezeichneten, gleichwohl deren natürliche Abstammung nicht. So sprach Ezechias, wie bei Isaias geschrieben steht, im Gebete: „Denn von heute an werde ich Kinder machen, die Deine Gerechtigkeit verkünden werden, Herr meines Heils“. Er sagte also: „Ich werde machen“. Der Prophet aber sagte in derselben Schrift und im vierten Buche der Könige also: „Und Deine Söhne, die aus Dir hervorgehen werden. Statt “zeugen„ hat er also “ich werde machen„ gesagt, und er bezeichnet seine natürlichen Sprossen als “gemacht. Und niemand leugnet, daß von einer natürlichen Zeugung die Rede ist. Auch Eva sagte nach der Geburt des Kain: „Ich habe durch Gott einen Menschen bekommen“. Statt „gebären“ hat also auch sie gesagt: „Ich habe bekommen“. Denn zuerst sah sie die Geburt, und dann erst sagte sie: „Ich habe bekommen“. Und man wird wohl nicht wegen der Ausdrucksweise: „Ich habe bekommen“ glauben, Kain sei auswärts gekauft und nicht von ihr geboren worden. Auch der Patriarch Jakob sagte zu Joseph: „Jetzt also sind deine zwei Söhne, die du in Ägypten bekommen hast, bevor ich zu dir nach Ägypten kam, die meinigen, Ephraim und Manasse“. Ferner sagt die Schrift von Job: „Es wurden ihm sieben Söhne und drei Töchter“, wie auch Moses im Gesetz gesagt hat: „Wenn einem Söhne werden“ und: „Wenn einer einen Sohn macht“.</p><p>Sieh also wieder, die Erzeugten haben sie als entstanden und gemacht bezeichnet, wobei sie sich bewußt waren, daß, solange sie als Söhne anerkannt werden, die etwaige Ausdrucksweise: „Sie wurden“ oder „ich bekam“ oder „ich machte“ belanglos sei. Denn die Natur und die Wirklichkeit bestimmen den Sinn. Wenn man also untersuchen will, ob der Herr ein Gebilde und Geschöpf sei, so muß man zuerst danach fragen, ob er Sohn, Wort und Weisheit sei. Denn ist dies bewiesen, so fällt und schwindet alsbald auch die argwöhnische Vorstellung von Gebilde und Geschöpf. Es kann doch das Geschöpf nicht Sohn und Wort sein, noch der Sohn ein Geschöpf. Da nun dem wieder so ist, so muß allen einleuchten, daß die Ausdrucksweise: „Der ihn gemacht hat“ nicht zugunsten ihrer Häresie spricht, sondern ihr eher das Urteil spricht. Es ist ja gezeigt worden, daß der Ausdruck „er machte“ in der göttlichen Schrift auch auf die echten und leiblichen Kinder Anwendung findet. Wenn also der Herr erwiesenermaßen natürlicher und echter Sohn, Wort und Weisheit des Vaters ist, so will, wenn man auch mit Bezug auf ihn sagt: „Er machte“ oder „er wurde“, dies nicht soviel heißen, als wäre er ein Geschöpf, sondern die Heiligen bedienen sich des Ausdrucks unterschiedslos wie bei Salomo und den Kindern des Ezechias. Denn obwohl sie selbst aus sich erzeugt haben, steht geschrieben: „Ich machte“, „ich bekam“ und „er wurde“. Wenn also die Gottesfeinde sich vielfach auf solche Redewendungen heuchlerisch berufen, so müssen sie doch endlich einmal auf das hin, was wir gesagt haben, ihre gottlose Gesinnung aufgeben und vom Herrn denken, daß er wahrer Sohn, Wort und Weisheit des Vaters ist, nicht ein Geschöpf, nicht ein Gebilde. Denn wenn der Sohn ein Geschöpf ist, in welchem Worte und in welcher Weisheit ist er dann selbst geworden. Denn alles Geschaffene ist durch das Wort und die Weisheit geworden, wie geschrieben steht: „Alles hast Du in Weisheit gemacht“ und: „Alles ist durch dasselbe gemacht worden und ohne dasselbe ist nichts geworden“. Wenn er aber selbst das Wort und die Weisheit ist, in der alles entsteht, so gehört er füglich nicht zu den gemachten und überhaupt nicht zu den entstandenen Wesen, sondern ist eine Zeugung des Vaters.</p><p>Ihr seht also, welch ein Irrtum es ist, zu behaupten, das Wort Gottes sei ein Geschöpf. Es sagt Salomo irgendwo im Ecclesiastes: „Jedes geschaffene Wesen wird Gott vor Gericht ziehen wegen alles Verborgenen, sei es gut oder böse“. Wenn also das Wort ein Geschöpf ist, wird es nach eurer Ansicht auch vor Gericht geführt werden? Und wo ist dann das Gericht, wenn der Richter gerichtet wird? Wer wird den Gerechten die Segnungen und den Unwürdigen die Strafen zuteilen, wenn nach eurer Ansicht der Herr wie alle vor Gericht steht? Und nach welchem Gesetze wird der Gesetzgeber selbst gerichtet werden? Dies ist das Los der Geschöpfe, gerichtet, vom Sohne gesegnet und gestraft zu werden. Fürchtet nunmehr den Richter und hört auf die Worte Salomos! Denn wenn Gott jegliches Geschöpf vor Gericht ziehen wird, der Sohn aber nicht zu denen gehört, die gerichtet werden, sondern vielmehr selbst der Richter aller Geschöpfe ist, ist es dann nicht sonnenklar, daß der Sohn nicht ein Geschöpf, sondern das Wort des Vaters ist, in dem die Geschöpfe entstehen und gerichtet werden? Wenn sie aber wegen des Schriftworts: „Der treu ist“ aufs neue in Verwirrung geraten und glauben, daß, wie von allen, so auch von ihm das „treu“ ausgesagt sei, insofern er mit seinem Glauben den Lohn für den Glauben empfange, dann müssen sie auch deshalb wieder gegen Moses Vorwürfe erheben, der sagt; „Treu und wahrhaft ist Gott“, und gegen Paulus, der schreibt: „Treu ist Gott, der euch nicht über eure Kraft wird versuchen lassen“. Die Heiligen hatten aber, wenn sie so sprachen, von Gott keine menschliche Vorstellungen, sondern sie wußten, daß das Wort „treu“ in der Schrift einen doppelten Sinn habe, einmal den von „vertrauend“ und dann den von „vertrauenswürdig“, so daß der erstere auf den Menschen, letzterer auf Gott passe. Treu ist also Abraham, weil er dem Worte Gottes geglaubt hat, treu aber Gott, weil, wie David singt, „der Herr in allen seinen Worten treu ist“ und glaubwürdig und unmöglich trügen kann. Und „wenn eine Gläubige Witwen hat“, so wird sie wegen ihres richtigen Glaubens gläubig genannt. „Wahrhaft aber ist das Wort“, weil man glauben muß, was es gesagt hat; denn so ist es und nicht anders. Wenn also geschrieben steht: „Der dem treu ist, der ihn dazu gemacht hat“, so hat er damit keine Ähnlichkeit mit andern, und nicht, weil er glaubt, ist er wohlgefällig geworden, sondern weil er als Sohn des wahren Gottes auch selbst wahrhaft ist, und man ihm in allem, was er sagt und tut, glauben muß, da er selbst unveränderlich bleibt und in der menschlichen Heilsordnung und in der leiblichen Erscheinung keine Umwandlung erfährt.</p><p>Wer nun in dieser Weise gegen ihre Unverschämtheit losrückt, kann schon mit dem bloßen Ausdruck „er machte“ sie des Irrtums überführen, wenn sie das Wort Gottes für ein Geschöpf halten. Da aber auch der Sinn der Schriftworte mit dem Hinweis auf Zeit und Zweck, für die der Ausdruck „er machte“ Geltung hat, unverfänglich ist, so muß man auch aus ihm den Unverstand der Häretiker nachweisen können, wenn wir, wie schon früher gesagt, gerade auch hier auf die Zeit und den Zweck Rücksicht nehmen. Nicht also, da er von dem der Schöpfung Vorausliegenden erzählt, hat der Apostel dies gesagt, sondern für die Zeit, als das Wort Fleisch wurde. Denn also steht geschrieben: „Deshalb, heilige Brüder, die ihr teilhaftig seid der himmlischen Berufung, habt acht auf den Gesandten und Hohenpriester unseres Bekenntnisses, Jesus, der treu ist dem, der ihn dazu gemacht hat“. Wann nun wurde er abgesandt, wenn nicht damals, als er unser Fleisch anzog? Wann aber ist er Hoherpriester unseres Bekenntnisses geworden, wenn nicht, da er sich selbst für uns darbrachte, seinen Leib von den Toten auferweckte, und da er jetzt die, welche zum Glauben an ihn kommen, dem Vater zuführt und darbringt und alle loskauft, und für alle die Versöhnung wird bei Gott? Nicht die Substanz des Wortes also und auch nicht die natürliche Geburt aus dem Vater wollte der Apostel anzeigen, wenn er gesagt hat: „Der treu ist dem, der ihn gemacht hat“. Ferne sei es! Denn das Wort schafft, ist aber selbst nicht geschaffen. Er wollte vielmehr seine Herabkunft zu den Menschen und sein Hohepriestertum anzeigen, wie man es aus der Geschichte des Gesetzes und des Aaron wohl ersehen kann. So ist Aaron nicht als Hoherpriester auf die Welt gekommen, sondern als Mensch, und nach einiger Zeit, als Gott es wollte, ist er Hoherpriester geworden, und er ist es nicht nur so einfachhin geworden, und auch nicht, insofern man ihn an den gewöhnlichen Kleidungsstücken erkannte, sondern indem er das Schulterkleid, den Brustschmuck und das lange Gewand anzog, welches ihm die Frauen im Auftrag Gottes verfertigt hatten. In diesen betrat er das Heiligtum und brachte für das Volk das Opfer dar, und in diesen stand er gleichsam mitten zwischen der Anschauung Gottes und den Opfern der Menschen. So nun war auch der Herr im Anfang das Wort, und das Wort war bei Gott, und Gott war das Wort. Als aber der Vater wollte, daß für alle das Lösegeld bezahlt werde und allen Gnade zuteil werde, da nahm das Wort, wie Aaron das lange Kleid, in gleicher Weise das von der Erde stammende Fleisch an, indem er Maria als eine unbearbeitete Erde zur Mutter seines Leibes nahm, um so selbst zu besitzen, was er darbringen sollte, und als Hoherpriester sich dem Vater darzubringen und im eigenen Blute uns alle von den Sünden zu reinigen und von den Toten aufzuwecken.</p><p>Hiervon nämlich waren die alten Zustände ein Schatten, und was der Erlöser bei seiner Ankunft getan hat, das stellte Aaron nach dem Gesetze im Schatten dar. Aaron war also derselbe und änderte sich nicht, indem er die hohepriesterliche Kleidung anzog, sondern blieb derselbe und hüllte sich bloß ein. Und wenn einer ihn beim Opfern gesehen und gesagt hätte: „Sieh, heute ist Aaron Hoherpriester geworden“, hätte er damit nicht sagen wollen, er sei damals Mensen geworden, — denn er war Mensch, auch bevor er Hoherpriester wurde, sondern er sei durch das Priesteramt zum Hohenpriester gemacht worden, indem er die für den Hohepriesterdienst gemachten und verfertigten Kleider anzog. Genau so kann man auch vom Herrn richtig denken: er sei mit der Annahme des Fleisches nicht ein anderer geworden, sondern er habe, sich selbst gleichgeblieben, nur in dieses sich gehüllt, so daß man die Ausdrücke: „er ist geworden“ und „er ist gemacht worden“, nicht so auffassen muß, als wäre das Wort als solches gemacht worden, sondern in dem Sinne, daß es bislang schon als Schöpfer-Wort existierend, später noch zum Hohenpriester gemacht worden sei, indem es den gewordenen und erschaffenen Leib anzog, den es für uns auch darbringen kann, weshalb man auch von ihm sagt, es sei gemacht worden. Wenn also der Herr nicht Mensch geworden ist, so mögen die Arianer ankämpfen; wenn aber das Wort Fleisch wurde, was anders sollte man vom gewordenen Menschen sagen, als daß er dem treu ist, der ihn gemacht hat? Denn wie man eigens vom Worte sagt: „Im Anfang war das Wort“, so sagt man auch von den Menschen das Werden und Gemachtwerden aus. Wer also hätte, wenn er den Herrn in Menschengestalt wandeln und durch seine Werke als Gott sich hätte ausweisen sehen, nicht gefragt: „Wer hat diesen zum Menschen gemacht?“ Wer würde, wieder so gefragt, nicht geantwortet haben, der Vater habe diesen zum Menschen gemacht und ihn uns als Hohenpriester gesandt? Diesen Sinn aber und die Zeit und die Person kann uns der Apostel selbst, der auch geschrieben hat: „Der dem treu ist, der ihn gemacht hat“, deutlicher zeigen, wenn wir auf das Vorausgehende achten. Denn es steht im unmittelbaren Zusammenhang, und der Inhalt bezieht sich auf ein und denselben Gegenstand. Er schreibt also im Briefe an die Hebräer folgendes: „Da nun die Kinder Fleisch und Blut gemeinsam haben, so hat auch Er gleichfalls daran teilgenommen, damit er durch den Tod dem ein Ziel setzte, der des Todes Gewalt hatte, das ist dem Teufel, und alle die befreite, welche durch die Todesfurcht das ganze Leben hindurch in Knechtschaft gehalten wurden. Doch wohl nicht der Engel nimmt er sich an, sondern dem Samen Abrahams kommt er zu Hilfe. Darum mußte er in allem seinen Brüdern gleich werden, damit er barmherzig würde und ein treuer Hoherpriester vor Gott, um zu versöhnen die Sünden des Volkes; denn darin, worin er selbst gelitten hat und versucht worden ist, kann er auch denen, die versucht werden, helfen. Deshalb, heilige Brüder, die ihr der himmlischen Berufung teilhaftig seid, sehet auf den Gesandten und Hohenpriester unseres Bekenntnisses, Jesus, der treu ist dem, der ihn gemacht hat“.</p><p>Wer kann diesen ganzen Abschnitt lesen, ohne die Arianer zu verurteilen und den seligen Apostel wegen seiner trefflichen Rede zu bewundern? Denn wann ist er gemacht worden, und wann ist er ein Abgesandter geworden, wenn nicht damals, als er gleich uns auch an Fleisch und Blut teilnahm? Und wann ist er barmherzig und ein treuer Hoherpriester geworden, wenn nicht damals, als er in allem den Brüdern ähnlich wurde? Er wurde aber damals ähnlich, als er Mensch geworden ist und unser Fleisch anzog: In Bezug auf die menschliche Heilsordnung des Wortes schrieb und sagte Paulus: „Der treu ist dem, der ihn gemacht hat“ und nicht in Bezug auf die Substanz des Wortes. Hört also auf zu rasen und zu sagen, das Wort Gottes sei ein Geschöpf; es ist ja von Natur eingeborener Sohn. Damals aber gewann es Brüder, als es das uns ähnliche Fleisch anzog, das es auch durch sich selbst darbrachte und so Hoherpriester genannt wurde, und barmherzig und treu geworden ist, barmherzig, weil es sich für uns darbrachte und sich unser erbarmte, treu, nicht weil es am Glauben teilnahm, auch nicht, weil es an einen glaubte wie wir, sondern weil man ihm Glauben schuldet in allem, was es sagt und tut, und weil es ein zuverlässiges Opfer darbringt, das fortdauert und nicht hinfällig wird. Denn die Opfer, die nach dem Gesetze dargebracht wurden, hatten nicht dieses Zuverlässige, da sie mit dem Tag vorübergingen und wieder eine Reinigung erheischten. Das Opfer des Heilandes aber hat, einmal dargebracht, alles zur Vollendung gebracht und ist zuverlässig geworden, da es immerdar bleibt. Und Aaron hatte seine Nachfolger, und überhaupt lösten im Gesetzespriestertum Zeit und Tod ihre Träger ab. Der Herr aber, der das unwandelbare und unübertragbare Hohepriesteramt besitzt, ist ein zuverlässiger Hoherpriester geworden, weil er immer bleibt, und ist in seiner Verheißung treu, da er die, welche zu ihm kommen, erhört und nicht betrügt. Dies kann man wiederum auch aus dem Briefe des großen Petrus erfahren, der sagt; „Darum müssen auch die, welche nach dem Willen Gottes leiden, ihre Seelen dem treuen Schöpfer anempfehlen“. Denn er ist treu, da er sich nicht ändert und immerdar bleibt und auch erfüllt, was er versprochen hat.</p><p>Die Götter der Heiden aber, die von ihnen fälschlich so genannt werden, sind weder in ihrer Existenz noch in ihren Verheißungen treu. Denn sie sind nicht überall dieselben, sondern sie gehen sogar an den Orten, wo sie sind, mit der Zeit unter und fallen in sich selbst zusammen. Deshalb erhebt auch das Wort seine Stimme gegen sie, daß das Vertrauen auf sie keinen Wert gehabt habe, da sie falsches Wasser seien und Treue bei ihnen nicht zu finden sei. Aber der einzig wirkliche und wahrhafte Gott aller Dinge ist treu, da er der nämliche bleibt und er sagt: „Sehet mich, sehet, daß ich es bin!“ und: „Ich habe mich nicht geändert“. Deshalb ist auch sein Sohn treu, da er immer ist und sich nicht ändert und auch nicht trügt, weder in der Existenz noch in seinen Verheißungen, wie der Apostel wiederum an die Thessalonicher schreibt: „Treu ist, der euch berufen hat, er wird es auch vollbringen“. Denn wenn er tut, was er verspricht, ist er treu in seinen Worten. An die Hebräer aber schreibt er, um ihnen zu verstehen zu geben, daß dieser Ausdruck auch die Unveränderlichkeit anzeige: „Wenn wir nicht glauben, er bleibt doch treu, er kann sich selber nicht verleugnen“. Es sagt also der Apostel, wo er von der leiblichen Ankunft des Wortes redet, mit Recht: „Den Abgesandten“ und „dem, der treu ist, der ihn gemacht hat“, und zeigt so, daß Jesus Christus, auch nachdem er Mensch geworden ist, gestern und heute derselbe und in Ewigkeit unwandelbar ist. Und wie der Apostel in seinem Schreiben mit der Rede von seinem Hohepriestertum an seine Menschwerdung erinnert, so hat er auch wieder nicht lange geschwiegen von seiner Gottheit. Vielmehr erinnert er alsbald an seine Gottheit, indem er sich überall der Genauigkeit befleißt, zumal da, wo er von seiner Niedrigkeit redet, damit wir sogleich auch seine Hoheit und väterliche Größe erkennen. Er sagt nämlich: Moses war Diener, Christus aber Sohn, jener war treu im Hause, dieser aber über das Haus, da er es selbst erbaut hat und sein Herr und Baumeister ist und als Gott es heiligt. Denn Moses, von Natur ein Mensch, wurde treu, indem er Gott, der durch das Wort redete, glaubte; das Wort war aber nicht wie eines von den geschaffenen Wesen im Leibe, auch nicht wie ein Gebilde im Gebilde, sondern Gott im Fleische und Schöpfer und Baumeister in dem von ihm geschaffenen Werke. Die Menschen werden mit Fleisch umgeben, damit sie existieren und bestehen. Das Wort Gottes aber ist Mensch geworden, um das Fleisch zu heiligen, und als Herr lebte es in der Knechtsgestalt. Denn dem Worte dient die ganze Schöpfung, die von ihm ins Dasein gerufen und gemacht wurde. Daraus aber folgt, daß auch damit, daß es beim Apostel heißt: „Er hat gemacht“, nicht das Wort als gemacht hingestellt wird, sondern der Leib, den er uns gleich annahm. Daher ließ er sich auch unsern Bruder nennen, nachdem er Mensch geworden war.</p><p>Wenn aber erwiesen ist, daß, wer auch auf das Wort selbst den Ausdruck “er hat gemacht” anwendet, ihn an Stelle des Ausdrucks “er zeugte” gebraucht, was für eine böswillige Deutung werden sie dann jetzt noch für dieses Wort ausfindig machen können, wo doch unsere Ausführung die Stelle nach allen Seiten beleuchtet und dargetan hat, daß der Sohn nicht ein Geschöpf, sondern in seiner Wesenheit eine Zeugung des Vaters ist, in der Heilsordnung aber nach dem Wohlgefallen des Vaters unsertwegen zum Menschen gemacht wurde und als solcher besteht? Deshalb also heißt es bei dem Apostel: “Der treu ist dem, der ihn gemacht hat” und heißt es in den Sprichwörtern, er werde geschaffen. Solange nämlich zugegeben wird, daß er Mensch wurde, macht es, wie bereits gesagt, keinen Unterschied, ob man sagt: “Er wurde” oder “er ist gemacht worden” oder “er ist geschaffen worden oder”er ist gebildet worden“, ob man sagt”Knecht" oder “Sohn einer Magd” oder “Menschensohn” oder “er wurde eingesetzt” oder “er ging in die Fremde” oder “Bräutigam” oder “Vetter” oder “Bruder”. Denn alle diese Ausdrücke eignen sich zur Bezeichnung menschlicher Verhältnisse, und alles Ähnliche läßt sich nicht von der Substanz des Wortes verstehen, wohl aber von seiner Menschenordnung. Solchen Sinn hat auch die aus der Apostelgeschichte von ihnen angeführte Stelle, wo Petrus sagt: [Wisse,] “daß er diesen Jesus, den ihr gekreuzigt habt, zum Herrn und Gesalbten gemacht hat”. Denn auch hier steht nicht geschrieben: Er machte sich einen Sohn, oder: er machte sich ein Wort, so daß sie auch derlei Gedanken ausspinnen könnten. Wenn sie also nicht vergessen haben, daß sie vom Worte Gottes reden, so mögen sie nachforschen, ob irgendwo geschrieben steht: Gott machte sich einen Sohn, oder: Er schuf sich ein Wort, oder wieder, ob irgendwo deutlich geschrieben steht: Das Wort ist ein Geschöpf oder Gebilde, und dann mögen sie sich darauf berufen, damit sie, die Unverständigen, auch dann ihre Widerlegung finden. Wenn sie aber nichts Derartiges finden und nur immer darauf Jagd machen, ob nicht irgendwo geschrieben steht: Er machte, und: Er ist gemacht worden, so befürchte ich, sie möchten, wenn sie hören: “Im Anfang schuf Gott Himmel und Erde” und: “Er schuf die Sonne und den Mond” und: “Er schuf das Meer”, allmählich zur Behauptung kommen, er sei der Himmel, und er sei das am ersten Tage entstandene Licht und, er sei die Erde und jedwelches von den gemachten Wesen, so daß sie von nun an den sogenannten Stoikern gleichen; denn jene dehnen Gott selbst auf alle Dinge aus, sie aber verlegen das Wort Gottes in alle gemachten Dinge. Und sie haben schon früher Ähnliches behauptet, wenn sie sagten, er sei eines von den Geschöpfen.</p><p>Doch sie sollen wieder dasselbe vernehmen und zunächst erfahren, daß das Wort, wie bereits früher gesagt, Sohn und nicht ein Geschöpf ist, und daß man solche Ausdrücke nicht von seiner Gottheit verstehen darf, sondern daß man nachforschen muß, warum und wie dies geschrieben ist, und sie werden bei ihrem Nachforschen auf das menschliche Heilswerk kommen, das er unsertwegen übernommen hat. Denn auch Petrus hat den Worten: „Er machte ihn zum Herrn und Gesalbten“ sogleich beigefügt: „diesen Jesus, den ihr gekreuzigt habt“. Und es ist allen klar geworden und wird es wohl auch diesen werden, wenn sie den Zusammenhang beachten wollen, daß er nicht von der Substanz des Wortes, sondern mit Rücksicht auf seine menschliche Seite von ihm sagte, er sei gemacht worden. Denn was anders ist gekreuzigt worden als der Leib? Wie aber konnte er die leibliche Seite im Wort anders zum Ausdruck bringen als mit dem Worte „er machte“? Übrigens hat der Ausdruck „er machte“ an dieser Stelle auch sonst noch einen guten Sinn. Denn er hat nicht, wie vorhin bemerkt, gesagt: Er machte ihn zum Worte, sondern: „ihn zum Herrn“, und nicht bloß dies, sondern „für euch“ und „in eurer Mitte hat er [ihn] gemacht“, was soviel heißt als: er gab [ihm] Zeugnis. Und eben dies hat Petrus, als er mit dieser Fundamentallehre begann, mit Bedacht zum Ausdruck gebracht, da er zu ihnen redete: „Israeliten, höret diese Worte: Jesum, den Nazarener, einen Mann, dem Gott unter euch Zeugnis gab durch Taten Wunder und Zeichen, welche Gott durch ihn in eurer Mitte wirkte, wie ihr selbst wisset“. Was also am Ende mit dem Worte „er machte“ gesagt wird, das hat er am Anfang ausgesprochen mit dem Ausdruck „er gab Zeugnis“. Denn in den Zeichen und Wundern, die der Herr wirkte, erwies er sich nicht als bloßen Menschen, sondern als Gott in einem Leibe, als den Herrn selbst und den Gesalbten. Ähnlich verhält es sich auch mit dem, was Johannes in seinem Evangelium sagt: „Darum verfolgten ihn die Juden noch mehr, weil er nicht nur den Sabbat nicht hielt, sondern auch Gott seinen Vater nannte und Gott sich gleichmachte“. Denn nicht machte sich der Herr damals zu Gott, — denn es kann Gott überhaupt nicht gemacht werden, — sondern er wies sich aus durch seine Werke, wie er sagte: „Wenn ihr mir nicht glaubt, so glaubet meinen Werken, damit ihr erkennet, daß ich im Vater bin und der Vater in mir ist“. So also hat der Vater ihn zum Herrn und Könige gemacht in unserer Mitte und für uns, die wir zuvor nicht glauben wollten. Und offenbar fängt der, der sich jetzt als Herr und König zeigt, nicht erst damals an, Herr und König zu werden, sondern fängt an, seine Herrschaft zu zeigen und sie auch auf die, welche zuvor nicht glaubten, auszudehnen.</p><p>Wenn sie nun glauben, daß der Heiland, ehe er Mensch wurde und den Kreuzestod erlitt, nicht Herr und König war, sondern erst damals Herr zu sein anfing, so mögen sie erkennen, daß sie offen wieder dem Samosatener nachsprechen. Wenn er aber, wie wir im Vorausgegangenen gesehen und gesagt haben, ewiger Herr und König ist, da ja Abraham ihn als Herrn anbetet, und Moses sagt: „Und der Herr ließ über Sodoma und Gomorrha Schwefel und Feuer vom Herrn aus dem Himmel regnen“, und da David singt: „Es sprach der Herr zu meinem Herrn, setze Dich zu meiner Rechten“ und: „Dein Thron, o Gott, steht in Ewigkeit, ein Zepter der Gerechtigkeit ist das Zepter Deines Reiches“, und: „Dein Reich ist ein Reich für alle Ewigkeit“, so war er offenbar, auch ehe er Mensch wurde, ewiger König und Herr als das Bild und Wort des Vaters. Wenn aber das Wort ewiger Herr und König ist, so hat wieder offenbar Petrus das Gemachtwerden nicht von der Substanz des Sohnes, sondern von seiner Herrschaft über uns ausgesagt, die damals begann, als er Mensch und mit der Erlösung aller am Kreuze aller Herr und König geworden ist. Wenn sie aber deswegen, weil geschrieben steht: „Er hat [ihn] gemacht“ herumstreiten und den Ausdruck „er hat [ihn] gemacht“ nicht mit dem andern „er gab [ihm] Zeugnis“ gleichbedeutend finden wollen, sei es, weil sie es nicht verstehen oder wegen ihrer christusfeindlichen Richtung, so sollen sie vernehmen, daß auch so die Worte des Petrus einen richtigen Sinn ergeben. Denn der, welcher über irgendwelch’ andere Herr wird, bringt die unter seine Herrschaft, die bereits existieren. Wenn aber der Herr aller Schöpfer und ewiger König ist, damals aber, als er Mensch geworden ist, auch uns erworben hat, so ist auch danach wieder klar, daß das Wort des Petrus auch so nicht die Substanz des Wortes als gemacht bezeichnet, sondern die nachgefolgte Unterwerfung aller und des Erlösers Herrschaft über alle; und das ist doch dem oben Gesagten ähnlich. Wie wir nämlich dort die Worte: „Werde mir zu einem schirmenden Gott“ und: „Es wurde der Herr eine Zuflucht dem Armen“ anführten, und die Ausführung ergab, daß diese Gott nicht als entstanden /beweisen, sondern auf die einem jeden von Gott gespendete Wohltat hinweisen, so hat auch das Wort des Petrus denselben Sinn.</p><p>Da also der Sohn Gottes selbst Wort ist, so ist er Herr über alles. Wir aber waren früher unterworfen, und zwar ursprünglich der Knechtschaft, der Verwesung und dem Fluche des Gesetzes, später aber bildeten wir uns allmählich das Nichtseiende und dienten, wie der selige Apostel gesagt hat, den Göttern, die der Natur nach nicht bestanden, verkannten den wahren Gott und stellten das Nichtseiende höher als die Wahrheit. Später aber ist er, als, wie einst das Volk in Ägypten in seiner Bedrückung seufzte, so auch wir im Besitze des natürlichen Gesetzes unaussprechliche Seufzer des Geistes ausstießen und riefen: „Herr, unser Gott, nimm uns in Besitz“, wie zu einem Haus der Zuflucht und schirmenden Gott, so auch zu unserem Herrn geworden. Und nicht erhielt er damals den Anfang seines Daseins, vielmehr kamen wir in die Lage, ihn zu unserem Herrn zu haben. Denn nun läßt Gott, der in seiner Güte und als Vater des Herrn sich erbarmt und von allen erkannt werden will, seinen Sohn einen menschlichen Leib anziehen und ihn Jesus heißen, damit er in diesem sich für uns darbringe, alle vom Götzendienst und vom Untergang befreie und selbst aller Herr und König werde. Daß er also in dieser Weise Herr und König wurde, gerade das wollte Petrus sagen mit den Worten: „Er machte ihn zum Herrn und sandte ihn als Gesalbten“, was soviel ist, als sagte er, der Vater habe ihn auch zum Menschen gemacht; denn des Menschen Anteil ist es, gemacht zu werden. Doch er machte ihn nicht einfachhin zum Menschen, sondern er hat ihn [zum Menschen] gemacht, damit er über alle herrsche und alle durch die Salbung heilige. Wenn nun nämlich das Wort, das in Gottesgestalt war, auch Knechtsgestalt annahm, so erniedrigte die Annahme des Fleisches das Wort, das von Natur Herr ist, nicht zum Knechte, vielmehr war sie eine Befreiung, die durch das Wort der ganzen Menschheit zuteil wurde. Das Wort selbst aber, das von Natur Herr ist und auch Mensch geworden ist, ist durch die Knechtsgestalt zum Herrn aller gemacht worden und zum Gesalbten, um nämlich alle mit dem Geiste zu heiligen. Und wie Gott, wenn er zu einem schirmenden Gott wird und sagt: „Ich werde ihnen Gott sein“, nicht mehr Gott wird und auch dann nicht erst anfängt Gott zu werden, sondern, was er immer ist, das auch den Bedürftigen wird, wenn es ihm gefällt, so wird auch der Gesalbte, der von Natur Herr und ewiger König ist, nicht in dem Augenblick, da er abgesandt wird, mehr Herr und beginnt auch nicht erst dann Herr und König zu sein, sondern, was er immer ist, dazu ist er damals auch dem Fleische nach gemacht worden, und mit der vollbrachten Erlösung aller wird er auch [auf diesen Titel hin] Herr der Lebendigen und Toten. Denn ihm dient von nun an alles, und eben davon singt David: „Es spricht der Herr zu meinem Herrn: Setze Dich zu meiner Rechten, bis ich Deine Feinde zum Schemel Deiner Füße lege“. Denn es ging nicht an, daß die Erlösung durch einen andern bewirkt werde als durch den, der von Natur Herr war, damit wir nicht durch den Sohn geschaffen werden, aber einen andern Herrn nennen und so in den Unverstand der Arianer und Heiden fallen und dem Geschöpfe dienen anstatt Gott, dem Schöpfer aller Dinge.</p><p>Das ist wenigstens nach meinem schwachen Urteil der Sinn der Stelle. Denn diese Worte des Petrus an die Juden haben einen wahren und guten Grund. Die Juden nämlich irren von der Wahrheit ab und warten auf die Ankunft Christi. Sie glauben aber nicht, daß er auch Leiden auf sich nehme, und sie verstehen die Worte nicht, die sie sagen: „Wir wissen, daß, wenn Christus kommt, er in Ewigkeit bleibt, und wie sagst du, daß er erhöht werden müsse“. Dann nehmen sie an, daß er nicht das Wort im Fleische, sondern ein bloßer Mensch sei, wie alle Könige gewesen sind. Der Herr tadelte daher Kleophas und dessen Begleiter und belehrte sie, daß Christus zuerst leiden mußte, und die übrigen Juden, daß er als Gott in die Welt gekommen sei, indem er sagte: „Wenn es [das Gesetz] diejenigen Götter nannte, an die das Wort Gottes ergangen ist, und die Schrift nicht aufgehoben werden kann, wie sagt ihr von dem, den der Vater geheiligt und in die Welt gesandt hat: Du lästerst Gott, weil ich gesagt habe, ich bin der Sohn Gottes“?</p><p>Petrus also, der dies vom Heiland erfahren hatte, weist die Juden nach beiden Seiten hin zurecht und sagt: Ihr Juden, die göttlichen Schriften verkünden, daß Christus komme, und ihr haltet ihn für einen bloßen Menschen, wie einen aus der Nachkommenschaft Davids. Was aber über ihn geschrieben steht, zeichnet ihn nicht so, wie er nach euren Worten wäre, verkündet ihn vielmehr als Herrn und Gott und Unsterblichen und als Spender des Lebens. Denn Moses hat gesagt: „Ihr werdet euer Leben vor euren Augen hängen sehen“ und David im 109. Psalm: „Es sprach der Herr zu meinem Herrn: Setze Dich zu meiner Rechten, bis ich Deine Feinde zum Schemel Deiner Füße lege“, und im 15. Psalm: „Du wirst meine Seele nicht in der Hölle lassen und Deinen Heiligen nicht die Verwesung schauen lassen“. Daß nun aber diese Worte nicht auf David gehen, bezeugt er selbst, wenn er den, der kommt, seinen Herrn nennt. Doch auch ihr seht, daß er gestorben ist, und seine Überreste bei euch sind. Daß aber Christus so sein müsse, wie ihn die Schriften zeichnen, werdet jedenfalls auch ihr zugeben. Von Gott sind ja die Worte gesprochen worden, und sie können nicht trügen. Wenn ihr nun sagen könnt, daß früher ein solcher gekommen sei, und ihr ihn aus seinen Zeichen und Wundern als Gott erweisen könnt, dann streitet ihr mit Recht mit uns; wenn ihr aber nicht beweisen könnt, daß ein solcher gekommen ist, ihr ihn aber bis zur Stunde erwartet, so erkennet aus Daniel den Zeitpunkt; denn seine Worte weisen auf die Gegenwart. Wenn aber die gegenwärtige Zeit die längst vorher verkündigte ist, und wenn ihr gesehen habt, was jetzt unter uns geschehen ist, so erkennet, daß dieser Jesus, den ihr gekreuzigt habt, der erwartete Christus ist. Denn David und alle Propheten sind gestorben, und die Denkmäler aller befinden sich bei euch. Aber die Auferstehung, die nunmehr zur Tatsache geworden ist, bewies, daß die Schriftworte auf diesen sich beziehen. Denn wenn er gekreuzigt wurde, so ist dies angedeutet in dem Worte: „Ihr werdet euer Leben hängen sehen“, und wenn seine Seite mit der Lanze versehrt wurde, so sind die Worte erfüllt: „Wie ein Lamm wurde er zur Schlachtbank geführt“; und wenn er nicht allein auferstand, sondern auch Tote der Vorzeit aus den Gräbern auferweckte, — denn diese haben die meisten aus euch gesehen, — so beziehen sich darauf die Worte: „Du wirst meine Seele nicht in der Hölle lassen“ und: „Es verschlang der übermächtige Tod“ und wieder: „Gott nahm hinweg“. Wenn es aber solche Zeichen getan hat, wie sie geschehen sind, so beweist dies den, der im Leibe war, als Gott, das Leben und den Herrn des Todes. Denn es ziemte sich, daß Christus, der den übrigen das Leben gab, selbst nicht vom Tode überwunden wurde. Aber das wäre nicht geschehen, wenn, wie ihr meint, Christus ein bloßer Mensch gewesen wäre. Doch wahrhaftig, er ist der Sohn Gottes; denn die Menschen sind insgesamt dem Tode unterworfen. So möge denn niemand mehr zweifeln, sondern das ganze Haus Israel soll untrüglich erkennen, daß dieser Jesus, den ihr in Menschengestalt solche Zeichen und Werke habt vollbringen sehen, wie sie noch nie einer verrichtet hat, Christus und der Herr aller ist. Denn wenn er auch Mensch geworden ist und Jesus genannt wurde, wie wir schon früher gesagt haben, so wurde er durch das menschliche Leiden nicht geringer, sondern er erweist sich auch darin, daß er zum Menschen gemacht wurde, als Herrn der Lebendigen und Toten. „Denn da“, wie der Apostel gesagt hat, „die Welt durch ihre Weisheit Gott in der Weisheit Gottes nicht erkannt hat, so gefiel es Gott, durch die Torheit der Predigt die zu retten, welche glauben“, so gefiel es auch Gott, als wir Menschen Gott durch sein Wort nicht erkennen und dem Worte Gottes, unserem natürlichen Herrn, nicht dienen wollten, seine Herrschaft in einem Menschen zu zeigen und alle an sich zu ziehen. Aber dies durch einen bloßen Menschen zu tun, ging nicht an, damit wir nicht, wenn wir einen Menschen zum Herrn haben, Menschenkult treiben. Deshalb wurde das Wort selbst Fleisch und nannte seinen Namen Jesus, und so machte ihn der Vater zum Herrn und Gesalbten, was soviel heißen will als: Er machte ihn, daß er Herr und König sei, damit im Namen Jesu, den ihr gekreuzigt habt, wie jedes Knie sich beuge, so auch wir den Sohn selbst als Herrn und König und durch ihn den Vater anerkennen.</p><p>Wie nun die Juden dies hörten, gingen sie zum größten Teil in sich und anerkannten fortan Christus, wie in der Apostelgeschichte geschrieben steht. Da aber die Ariomaniten Juden bleiben und wider Petrus streiten wollen, — nun denn, so wollen wir ihnen die Parallelstellen anführen. Vielleicht gehen sie dann in sich, wenn sie den Sprachgebrauch der göttlichen Schrift kennen. Daß also Christus ewiger Herr und König ist, ist aus dem bereits Gesagten klar geworden, und keiner ist, der darüber noch Zweifel hätte. Denn da er Gottes Sohn ist, ist er ihm wohl ähnlich, und wenn er ihm ähnlich ist, so ist er jedenfalls auch Herr und König. Er sagt ja selbst: „Wer mich gesehen, hat den Vater gesehen“. Daß aber das Wort des Petrus: „Er machte ihn zum Herrn und Gesalbten“ auch allein für sich genommen den Sohn nicht als ein Geschöpf dartut, kann man aus der Segnung des Isaak ersehen, wenn sie vielleicht auch für den Gegenstand, von dem die Rede ist, ein etwas dunkles Bild gibt. Er sagt nämlich zu Jakob: „Du sollst Herr deines Bruders werden“, und zu Esau: „Siehe, ich habe ihn zu deinem Herrn gemacht“. Wenn nun der Ausdruck „er hat gemacht“ auf die Substanz des Jakob und seine erste Geburt zu deuten wäre, so hätten sie selbst dann vom Worte Gottes nicht so denken sollen. Denn der Sohn Gottes ist kein Geschöpf wie Jakob. Wenn sie nur etwa nachfragen wollten, sie würden sich nicht weiter der Torheit überlassen. Wenn sie aber diese Ausdrücke nicht von der Substanz noch auch von der ersten Geburt verstehen, obschon Jakob von Natur ein Geschöpf und gemachtes Wesen ist, rasen sie dann nicht noch ärger als der Teufel, wenn sie sich etwas vom Sohne Gottes zusammenreimen, was sie sich auf Grund ähnlicher Ausdrücke nicht erlauben bei Wesen, die ihrer Natur nach entstanden sind, indem sie nämlich sagen, er sei ein Geschöpf. Es sprach nämlich Isaak: „Du sollst werden“ und: „Ich habe gemacht“, ohne damit von der ersten Geburt des Jakob noch auch von seiner Substanz zu reden, — er sagte ja das mehr als dreißig Jahre nach dessen Geburt, — vielmehr kündigte er mit jenen Worten seine nachmalige Herrschaft über seinen Bruder an.</p><p>Nun noch viel weniger bezeichnete Petrus mit seinen Worten die Substanz des Wortes als die eines gemachten Wesens. Wußte er doch, daß er ihn als Gottessohn bekannt hatte: „Du bist Christus, der Sohn des lebendigen Gottes“. Vielmehr bezeichnete er seine in Gnaden bewirkte und auch auf uns sich erstreckende Macht und Herrschaft. Denn wo er auch dieses sagte, hat er nicht von der ewigen und väterlichen Gottheit des Gottessohnes geschwiegen, vielmehr hatte er schon zuvor gesagt, daß er auch den Geist über uns ausgegossen habe. Aber den Geist mit Macht geben, ist nicht Sache eines Gebildes oder gemachten Wesens, sondern ist eine Schenkung Gottes. Denn die Geschöpfe werden geheiligt vom Hl. Geist; der Sohn aber, der nicht vom Hl. Geist geheiligt wird, vielmehr selbst ihn allen gibt, erweist sich dadurch nicht als ein Geschöpf, sondern als wahren Sohn des Vaters. Gleichwohl wird auch von dem, der den Geist gibt, gesagt, er sei auch gemacht worden und zwar zum Herrn gemacht worden unter uns wegen seiner menschlichen Natur; er gibt aber [den Geist], weil er das Wort Gottes ist. Denn er war immer und ist wie Sohn, so auch Herr und Allherrscher über alles, in allem dem Vater ähnlich und im Besitze alles dessen, was dem Vater gehört, wie er selbst gesagt hat. Wohlan, fassen wir nun auch jene Stelle in den Sprichwörtern ins Auge: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“. Wenn wir nun nachgewiesen haben, daß das Wort kein gemachtes Wesen ist, so ist es auch völlig bewiesen, daß es kein Geschöpf ist. Denn gemachtes Wesen und Geschöpf besagen dasselbe, so daß der Beweis dafür, daß es kein gemachtes Wesen ist, zugleich dafür der Beweis ist, daß es kein Geschöpf ist. Man muß sich also nur wundern, wenn sie für ihre Gottlosigkeit auf neue Scheingründe sinnen, anstatt auf die jeweiligen Gegenbeweise hin sich zu schämen. Denn zuerst sannen sie auf Trug, indem sie an die Arglosen die Fragen stellten: „Hat der Seiende den Nichtseienden aus Nichtseiendem geschaffen oder den Seienden?“ und: „Hattest du einen Sohn, bevor du ihn gebarst?“ Wie sich aber diese Fragen als hinfällig erwiesen hatten, da kamen sie darauf zu sagen: „Ist Ein Ungewordenes oder sind es zwei?“ Als sie dann auch hierin widerlegt waren, fügten sie alsbald hinzu: „Ist er selbständig und veränderlicher Natur?“ Und als sie auch hierin geschlagen waren, da erfanden sie wieder das Wort: „um soviel vorzüglicher geworden als die Engel“. Da aber auch dies die Wahrheit widerlegte, so nehmen sie nunmehr dies alles zusammen und glauben, mit „gemachtes Wesen“ und „Geschöpf“ ihre Häresie halten zu können. Denn sie bringen eben jenes wieder zum Ausdruck und lassen nicht ab von ihren bösen Gedanken, indem sie dasselbe mannigfach verschieben und verdrehen, um vielleicht einige mit dieser Abwechslung hintergehen zu können. Aus dem bereist Gesagten erhellt nun auch vollauf, daß dieser ihr Einfall albern ist. Aber da sie mit jener Stelle aus den Sprichwörtern überall sich auslassen und bei vielen, die den Christenglauben nicht kennen, den Eindruck machten, als sagten sie etwas von Bedeutung, so ist gleichwohl nötig, daß wir, wie die Stelle: „Der dem treu ist, der ihn gemacht hat“, ebenso auch das Wort „er schuf“ besonders untersuchen, um zu beweisen, daß sie, wie in allem, so auch hierin nichts weiteres haben als ein leeres Wahngebilde.</p><p>Zunächst wollen wir nun sehen, was sie im Anfang, als sie die Häresie ersannen, dem seligen Alexander übergeben haben. Sie schrieben ihm nämlich folgendes: “Ein Geschöpf ist er, doch nicht wie eines von den Geschöpfen, ein gemachtes Wesen ist er, doch nicht wie eines von den gemachten Wesen, eine Zeugung ist er, doch nicht wie eine von den Zeugungen”. Es beachte nur ein jeder das Hinterlistige und Verschlagene an dieser Häresie. Denn da sie sich der Bitterkeit ihrer verruchten Denkart bewußt ist, sucht sie durch ein täuschendes Wortgepränge sich ein schöneres Aussehen zu geben. Sie behauptet zwar, wie sie denkt, daß er ein Geschöpf sei, glaubt jedoch sich verstecken zu können hinter der Bemerkung: “Doch nicht wie eines von den Geschöpfen”. Doch dadurch, daß sie so schreiben, haben sie noch offener ihre Gottlosigkeit verraten. Denn wenn er überhaupt nach eurer Ansicht ein Geschöpf ist, warum sagt ihr dann heuchlerisch: “Doch nicht wie eines von den Geschöpfen”? Und wenn er überhaupt ein gemachtes Wesen ist, warum ist er nicht wie eines von den gemachten Wesen? Hier kann man nun wirklich das Gift ihrer Häresie spüren. Denn wenn sie sagen: “Eine Zeugung, aber nicht wie eine von den Zeugungen”, so stellen sie viele Söhne auf und lehren, daß von diesen einer der Herr sei. So ist er nach ihrer Ansicht nicht mehr der Eingeborene, sondern einer von den vielen Brüdern und wird Zeugung und Gott genannt. Wozu nun die Verstellung, ihn bald ein Geschöpf zu nennen, bald zu behaupten, er sei kein Geschöpf? Wenn ihr nämlich auch sagt: “Nicht wie eines von den Geschöpfen”, so wird sich dies als eine Spitzfindigkeit von euch herausstellen. Denn ihr sagt wieder, er sei eines von den Geschöpfen, und was man auch von den übrigen Geschöpfen sagen kann, das denkt ihr auch vom Sohne, wie förmliche Toren und Blinde. Denn wo wäre auch sonst ein Geschöpf gerade so beschaffen, wie auch das andere geworden ist, daß ihr damit vom Sohne etwas besonderes aussagen würdet? Und die ganze sichtbare Schöpfung ist in sechs Tagen entstanden, und zwar am ersten Tag das Licht, das er Tag nannte, am zweiten das Firmament; am dritten bildete er die Wasser zusammen und ließ das Trockene erscheinen und brachte auf ihm die mannigfaltigen Früchte hervor; am vierten Tage hat er die Sonne und den Mond gemacht und den ganzen Chor der Sterne; am fünften rief er die Tiere des Meeres und die Vögel der Luft ins Dasein; am sechsten hat er die vierfüßigen Tiere auf der Erde geschaffen und endlich den Menschen. “Das Unsichtbare an ihm wird seit der Erschaffung der Welt durch die Betrachtung der Geschöpfe geschaut”. Es ist aber weder das Licht wie die Nacht, noch die Sonne wie der Mond, noch die unvernünftigen Wesen wie der vernünftige Mensch, noch die Engel wie die Throne, noch die Throne wie die Mächte, wohl aber sind alle Geschöpfe, jedes der entstandenen Wesen aber ist und bleibt seiner Art nach in seiner eigenen Substanz, wie es geworden ist.</p><p>So scheide man denn das Wort von den gemachten Wesen aus und teile es als Schöpfer dem Vater zu und bekenne ihn als Sohn von Natur; oder, wenn es überhaupt ein Geschöpf ist, so soll man zugeben, daß es dieselbe Stellung einnimmt, die auch die übrigen Geschöpfe zu einander einnehmen. Man nenne dann aber von diesen ein jedes ein Geschöpf, aber nicht wie eines von den Geschöpfen, ein gezeugtes oder ein gemachtes Wesen, aber nicht wie eines von den gemachten oder gezeugten Wesen. Ihr habt ja die Zeugung und das gemachte Wesen als dasselbe bezeichnet, wenn ihr geschrieben habt: den Erzeugten oder den Geschaffenen. Denn wenn auch der Sohn bei der Vergleichung die andern überragt, so ist er nichts destoweniger ein Geschöpf wie jene. Denn auch unter den Geschöpfen, die es ihrer Natur nach wirklich sind, kann man solche finden, die die andern überragen. So z. B. ist ein Stern von den andern verschieden an Glanz, und alles übrige weist, miteinander verglichen, einen Unterschied auf. Und doch ist deshalb nicht der eine Teil der herrschende und dient der andere dem vorzüglicheren; auch sind nicht die einen Wesen die wirkenden Ursachen, durch welche die andern ins Dasein treten, sondern allem ist es von Natur aus eigen, zu entstehen und geschaffen zu werden, und alles bekennt durch sein Dasein seinen Schöpfer, wie David singt: „Die Himmel erzählen die Herrlichkeit Gottes, und das Firmament verkündet die Werke seiner Hände“, und wie auch der weise Zorobabel sagt: „Die ganze Erde ruft die Wahrheit an, und der Himmel preist sie und alle Werke beben und zittern“. Wenn aber die ganze Erde den Schöpfer und die Wahrheit preist und lobt und zittert, ihr Schöpfer aber das Wort ist, und dieses selbst sagt: „Ich bin die Wahrheit“, so ist doch das Wort nicht ein Geschöpf, sondern einzig und allein dem Vater eigen, in dem alles geordnet ist, und er selbst wird von allen als Schöpfer gepriesen, denn: „Ich war“, wie er selbst sagt, „bei ihm ordnend“ und: „Mein Vater wirkt bis jetzt und auch ich wirke“. „Bis jetzt“ aber zeigt an, daß er als Wort ewig im Vater existiert. Denn dem Wort ist es eigen, die Werke des Vaters zu schaffen und nicht außer ihm zu existieren.</p><p>Wenn aber das, was der Vater wirkt, auch der Sohn wirkt, und was der Sohn schafft, auch des Vaters Geschöpfe sind, ein Werk und Geschöpf des Vaters aber der Sohn ist, so wird er entweder sich selbst machen, und er wird sein eigener Schöpfer sein — denn was der Vater wirkt, sind auch Werke des Sohnes —, was doch wohl ungereimt und unmöglich ist, oder er ist wohl, wenn er die Werke des Vaters schafft und macht, selbst kein Werk und auch kein Geschöpf, damit er nicht in Einer Person schaffende Ursache ist und unter den gemachten Wesen als Schöpfer dessen, was er selbst geworden ist, befunden wird, zumal er es ja nicht einmal machen kann. Denn wie ist er, wenn er nach eurer Ansicht aus dem Nichtseienden geworden ist, imstande, das Nichtseiende ins Dasein zu setzen? Wenn er aber als Geschöpf auch ein Geschöpf schafft, dann wird man auch von jedem Geschöpf dasselbe denken müssen, nämlich, daß auch sie schaffen können. Und wenn ihr das so wollt, wozu bedarf es denn des Wortes, wenn das Niedrige durch das Höhere entstehen kann, oder da überhaupt schon im Anfang jedes der entstandenen Wesen von Gott hören konnte: „Entsteht“ und „Werde“ und so das Einzelne wäre geschaffen worden? Doch das steht nicht geschrieben, noch auch war es möglich; denn von den entstehenden Dingen ist keines schöpferische Ursache. Alle sind ja durch das Wort entstanden, und es hätte das Wort selbst nicht alle schaffen können, wenn es selbst auch eines von den Geschöpfen wäre. Denn auch die Engel, weil gleichfalls Geschöpfe, werden nicht schaffen können, wenn auch Valentin, Marcion und Basilides solches dachten, und ihr deren Nachbeter seid. Und auch die Sonne wird, weil ein Geschöpf, niemals das Nichtseiende ins Dasein setzen, und auch kein Mensch wird einen Menschen bilden, und kein Stein einen Stein ersinnen, und kein Holz dem Holze Wachstum geben, sondern Gott ist es, der im Mutterleib den Menschen bildet und die Berge setzt und das Holz ausdehnt. Der erkenntnisfähige Mensch aber setzt diesen Stoff zusammen und bildet ihn um und bearbeitet das Seiende, wie er es gelernt hat, und es genügt ihm, daß es existiert; und da er seine Natur kennt, so kann er, wenn er etwas braucht, Gott darum bitten.</p><p>Wenn man nun auch von Gott annimmt, er schaffe und bilde aus dem Stoff, so ist das heidnische Anschauung, und Gott wäre ein Künstler und nicht ein Schöpfer zu nennen. Gleichwohl soll das Wort in dieser Weise den Stoff bearbeiten im Auftrag Gottes und in dienender Stellung. Wenn er aber das Nichtseiende durch sein Wort ins Dasein ruft, so gehört das Wort nicht zu dem, was nicht ist und ins Dasein gerufen wird, damit wir nicht nach einem zweiten Worte suchen müssen, durch das auch dieses ins Dasein gerufen wurde; denn durch das Wort ist das Nichtseiende entstanden. Und wenn Gott durch das Wort schafft und macht, dann gehört es nicht selbst zu den Geschöpfen und gemachten Dingen, ist vielmehr das Wort des schaffenden Gottes, das ja aus den Werken des Vaters, die das Wort selbst vollbringt, erkannt wird; denn es ist im Vater und der Vater in ihm, und wer es gesehen, hat den Vater gesehen, weil der Sohn dem Vater wesenseigen und in allem ihm gleich ist. Wie schafft er nun durch das Wort, wenn es nicht sein Wort und seine Weisheit ist? Wie aber wäre es Wort und Weisheit, wenn es nicht eine eigene Zeugung seiner Wesenheit, sondern auch aus Nichtseiendem entstanden wäre? Wenn aber alles aus Nichtseiendem und geschaffen ist, und der Sohn nach ihrer Ansicht eines von den Wesen ist, die geschaffen sind und einmal nicht waren, wie offenbart dann er allein den Vater, und erkennt auch kein anderer als nur Er den Vater? Denn wenn dieser, obschon ein Geschöpf, den Vater erkennen kann, so soll er auch von allen in analoger Weise erkannt werden, je nach der Fähigkeit eines jeden. Geschöpfe sind ja alle wie auch er. Wenn aber die entstandenen Wesen ihn nicht zu sehen noch zu erkennen vermögen, vielmehr sein Anblick und seine Erkenntnis die Kräfte aller übersteigt — Gott sagte ja selbst: „Niemand wird mein Angesicht sehen und leben“, und der Sohn hat gesagt: „Niemand kennt den Vater als der Sohn“ —, so ist wohl das Wort von den entstandenen Wesen verschieden, da es allein den Vater kennt und allein ihn sieht, wie es selbst gesagt hat: „Nicht, daß den Vater jemand gesehen hätte als der, welcher vom Vater ist“ und „Niemand kennt den Vater als der Sohn“, mag es nun auch Arius nicht glauben. Wie nun hätte er ihn allein erkannt, wenn er nicht allein ihm eigen wäre? Man darf nämlich keinen Anstand nehmen, im Interesse des frommen Glaubens öfter dasselbe zu sagen. Gottlos ist also die Ansicht, der Sohn sei einer vom All. Und blasphemisch und unvernünftig klingt die Behauptung, er sei ein Geschöpf, aber nicht wie eines von den Geschöpfen, er sei ein gemachtes Wesen, aber nicht wie eines von den gemachten Wesen, eine Zeugung, aber nicht wie eine von den Zeugungen. Denn wie ist er nicht wie eine von diesen, wenn er doch nach ihrer Ansicht nicht war, bevor er gezeugt wurde? Denn den Geschöpfen und gemachten Wesen kommt es zu, nicht zu existieren, bevor sie werden, und aus Nichtseiendem sich zu bilden, wenn sie auch an Glanz sich gegenseitig übertreffen. Denn insoweit wird man auch alle übrigen Geschöpfe in gegenseitigem Abstand voneinander finden, wie auch der Augenschein es lehrt.</p><p>Aber wenn er, wie die Häretiker meinen, ein Geschöpf oder gemachtes Wesen wäre, doch nicht wie eines von den Geschöpfen, weil er in der Herrlichkeit sich von ihnen unterscheidet, so hätte die Schrift ihn mit den übrigen Geschöpfen bezüglich des Vorzugs vergleichen sollen, und angeben und zeigen müssen, inwiefern er größer als die Erzengel, geehrter als die Throne und leuchtender als die Sonne und der Mond und größer als die Himmel genannt werden müsse. Nun aber wird er nicht in dieser Weise bezeichnet, wohl aber erklärt ihn der Vater als seinen einzigen und eigenen Sohn, wenn er sagt: „Mein Sohn bist Du“, und: „Dieser ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe“. Deshalb dienten ihm auch die Engel als einem, der von ihnen verschieden ist, und er wird von ihnen angebetet, nicht weil er an Herrlichkeit größer, sondern weil er anders ist als alle Geschöpfe und auch als sie und allein des Vaters wesenseigener Sohn ist. Denn wenn er angebetet würde, weil er sie an Herrlichkeit überragt, dann müßte auch jeder von den Niedrigeren den Höheren anbeten. Doch dem ist nicht so; ein Geschöpf betet ein Geschöpf nicht an, dagegen ein Knecht seinen Herrn und ein Geschöpf seinen Gott. Daher wehrt der Apostel Petrus dem Kornelius, der ihn anbeten will und sagt: „Auch ich bin ein Mensch“, und in der Offenbarung hält der Engel den Johannes, der ihn anbeten will, zurück mit den Worten: „Sieh zu, daß du es nicht tust; denn ich bin dein und deiner Brüder, der Propheten, Mitknecht und derer, welche die Worte dieses Buches halten; Gott bete an“. Gott allein also gebührt die Anbetung. Und das wissen auch die Engel, daß sie, wenn sie schon die andern Wesen an Herrlichkeit überragen, doch alle Geschöpfe sind und nicht zu denen gehören, die angebetet werden, vielmehr zu denen, die den Herrn anbeten. So wehrt z. B. auch dem Manoe, dem Vater des Benson, der dem Engel ein Opfer darbringen wollte, der Engel mit den Worten: „Nicht mir, sondern Gott opfere!“ Der Herr wird aber auch von den Engeln angebetet; denn es steht geschrieben: „Und es sollen ihn anbeten alle Engel Gottes“. Aber auch von allen Völkern wird er angebetet, wie Isaias sagt: „Es bemühte sich Ägypten und der Handel der Äthiopier und die hohen Männer von Saba werden zu Dir übergehen und Deine Knechte sein“. Gleich darauf: „Und sie werden Dich anbeten und zu Dir flehen, weil Gott in Dir und außer Dir kein Gott ist“. Von den Jüngern aber nimmt er die Anbetung an und vergewissert sie darüber, wer er sei, mit den Worten: „Nennet ihr mich nicht Herr und Meister? Und mit Recht sagt ihr so; denn ich bin es“. Und da Thomas ihn anredete: „Mein Herr und mein Gott“, läßt er dies zu, oder billigt es vielmehr, indem er es ihm nicht verwehrt. Denn er ist, wie die übrigen Propheten sagen und David singt, „Herr der Mächte“, „Herr Sabaoth“, d.h. „Herr der Heerscharen“, und wahrhaftiger und allmächtiger Gott, mögen auch die Arianer darob bersten.</p><p>Er wäre aber sicher nicht angebetet, noch wäre dies von ihm gesagt worden, wenn er überhaupt zu den Geschöpfen gehört hätte. Nun aber, da er kein Geschöpf ist, sondern die eigene Zeugung der Wesenheit des angebeteten Gottes und von Natur Sohn ist, deshalb betet man ihn an und glaubt an seine Gottheit, und er ist Herr der Heerscharen und Herrscher und Allmächtiger wie der Vater. Hat er doch selbst gesagt: „Alles, was der Vater hat, ist mein“. Denn dem Sohn ist es eigen, das Eigentum des Vaters zu besitzen und so zu sein, daß der Vater in ihm geschaut wird, und daß durch ihn alles gemacht ist und in ihm die Rettung aller geschieht und begründet ist. Denn damit die Widerlegung ihrer Häresie noch deutlicher erscheint, ist es gut, auch folgende Frage an sie zu richten: Wenn nun alle Wesen Geschöpfe sind und alle aus dem Nichtseienden sich gebildet haben, und auch der Sohn nach eurer Meinung ein Geschöpf und gemachtes Wesen ist und eines von den Wesen, die einmal nicht waren, warum hat er dann alles durch dasselbe allein gemacht, und ist ohne dasselbe nichts geworden? Oder, wenn von allem die Rede ist, warum glaubt man nicht, daß unter allem der Sohn gemeint sei, sondern die entstandenen Dinge? Und warum denken die Schriften, wenn sie vom Worte reden, dieses nicht als aus dem All stammend, sondern bringen es mit dem Vater in Verbindung, in dem der Vater dann für alles Vorsorge trifft und Rettung wirkt und schafft, zumal da alles durch denselben Befehl entstehen kann, auf den hin auch jener durch Gott allein geworden ist? <s153>Gott wird nämlich durch Befehlen nicht müde, und er ist auch nicht zu schwach, um alles zu erschaffen, so daß er allein nur den Sohn erschaffen könnte, zur Erschaffung der übrigen Dinge aber des Sohnes als eines Helfers und Dieners bedürfte. Denn es gibt bei ihm auch keinen Aufschub in der Ausführung dessen, was er will, sondern er brauchte nur zu wollen, und es entstand alles, und niemand widerstand seinem Willen. Weshalb ist also nicht alles von Gott allein auf den Befehl hin entstanden, auf den hin auch der Sohn geworden ist? Oder sie sollen uns doch sagen, wenn er doch selbst auch zu den entstandenen Wesen gehört, warum ist durch ihn alles geworden? Bei ihnen herrscht nun zwar lauter Unverstand. Gleichwohl sagen sie hierüber, daß ja Gott, da er die entstandene Natur erschaffen wollte und sah, daß sie an der reinen Hand des Vaters und an seinem Schöpfungsakt nicht teilnehmen könne, zuerst Einen allein bildet und macht und diesen Wort und Sohn nennt, damit, wenn dieser in der Mitte stünde, so nunmehr auch alles durch ihn entstehen könnte. Das haben Eusebius, Arius und Asterius, der [den Götzen] opferte, nicht bloß gesagt, sondern auch zu schreiben gewagt.</s153></p><p>Muß man sie nun deshalb nicht in aller Form wegen ihrer Gottlosigkeit verurteilen, die sie mit einem starken Zusatz von Unverstand mischen, ohne zu erröten, wenn sie so gegen die Wahrheit toben? Denn wenn sie behaupten wollen, Gott habe nur den Sohn geschaffen, weil er zu schwach war zur Erschaffung des übrigen, dann wird die ganze Schöpfung gegen sie ihre Stimme erheben, daß sie nichts Würdiges von Gott zu sagen wissen, und Isaias in seinen Schriften, wo er sagt: „Der ewige Gott, der die Enden der Erde erschaffen, hungert nicht und wird nicht müde, und seine Weisheit ist unerforschlich“. Wenn es aber Gott unter seiner Würde hielt, das übrige zu erschaffen und deshalb den Sohn allein schuf, das übrige aber dem Sohne als einem Gehilfen einhändigte, so ist das Gottes unwürdig; denn Gott kennt keinen Hochmut. Zugleich wird sie der Herr widerlegen mit den Worten: „Kauft man nicht zwei Sperlinge um einen Pfennig? Und doch fällt keiner von ihnen auf die Erde ohne euren Vater, der im Himmel ist“. Und wiederum: „Sorget nicht ängstlich für euer Leben, was ihr essen werdet, noch für euren Leib, was ihr anziehen werdet. Ist nicht das Leben mehr als die Speise und der Leib mehr als die Kleidung? Betrachtet die Vögel des Himmels, sie säen nicht, sie ernten nicht, sie sammeln nicht in die Scheunen; und euer himmlischer Vater ernähret sie. Seid ihr nicht viel mehr als sie? Wer unter euch kann mit seinen Sorgen seiner Lebenslänge eine Elle zusetzen? Und warum sorgt ihr ängstlich für die Kleidung? Betrachtet die Lilien auf dem Felde, wie sie wachsen! sie arbeiten nicht und spinnen nicht; und doch sag ich euch, daß selbst Salomo in all seiner Herrlichkeit nicht bekleidet gewesen ist, wie eine von ihnen. Wenn nun Gott das Gras auf dem Felde, das heute steht und morgen in den Ofen geworfen wird, also kleidet, wieviel mehr euch, ihr Kleingläubigen?“. Denn wenn es Gottes nicht unwürdig ist, auch für so Geringfügiges zu sorgen, für ein Haar des Hauptes, für einen Sperling und für das Gras des Feldes, dann war es seiner auch nicht unwürdig, dieses zu schaffen. Denn wofür er Vorsorge trägt, dessen Schöpfer ist er auch durch sein Wort. Außerdem stoßen die, welche so reden, auch noch auf eine größere Ungereimtheit. Denn sie schieden zwischen den Geschöpfen und der Schöpfung und erklären letztere als ein Werk des Vaters, die ersteren aber als ein Werk des Sohnes. Es hätte aber entweder alles mit dem Sohne durch den Vater entstehen sollen, oder aber, wenn alles Gewordene durch den Sohn entsteht, dann hätte man nicht sagen sollen, er sei eines von den entstandenen Dingen.</p><p>Dann aber kann man ihnen auch auf folgende Weise ihren Unverstand nachweisen. Wenn auch das Wort zur entstandenen Natur gehört, diese aber das unmittelbare Wirken Gottes nicht ertragen kann, wie konnte es dann allein von allen durch die ungewordene und unversehrteste Substanz Gottes entstehen, wie ihr sagt? Denn entweder muß, wenn es das Wort vermag, auch die ganze Natur es vermögen, oder, wenn es die ganze Natur nicht vermag, auch das Wort hierzu unvermögend sein. Denn es ist nach eurer Ansicht auch dieses eines von den entstandenen Wesen. Und ferner, wenn deshalb, weil die entstandene Natur an der unmittelbaren Wirksamkeit Gottes nicht teilnehmen konnte, ein Mittelwesen notwendig geworden ist, so ist, wenn das Wort entstanden und ein Gebilde ist, auch bei seiner Erschaffung ein Mittler absolut notwendig, da es ja auch selbst zur entstandenen Natur gehört, die an der unmittelbaren Wirksamkeit Gottes nicht teilnehmen kann, sondern eines Mittlers bedarf. Wenn dann aber für das Wort ein Mittler gefunden ist, so braucht man wieder einen zweiten Mittler für letzteres, und so wird man, wenn man weiter macht und sinnend nachforscht, auf eine große Menge von herbeiströmenden Mittelwesen stoßen, und so ist es unmöglich, daß die Schöpfung zustande kommt, da sie immer des Mittelwesens bedarf, und der Mittler ohne ein zweites Mittelwesen nicht entstehen kann, weil alle der entstandenen Natur angehören, die an der unmittelbaren Tätigkeit Gottes nicht teilnehmen kann, wie ihr sagt. Wie sind sie doch voll Unverstand, in dem sie wähnen, daß auch das bereits Gewordene nicht entstehen könne? Oder phantasieren sie vielleicht, es sei nicht einmal entstanden und suchen noch nach dem Mittler? Denn nach dieser ihrer so gottlosen und törichten Ansicht wäre auch das Seiende nicht ins Dasein getreten, da sich kein Mittler ausfindig machen läßt.</p><p>Doch jetzt bringen sie folgendes vor: Sieh doch, er hat das Volk auch durch Moses aus Ägypten geführt und durch ihn das Gesetz gegeben, obschon auch er ein Mensch war: so kann also das Ähnliche durch das Ähnliche entstehen. Das hätten sie aber nicht so unverhüllt heraussagen sollen, wenn sie sich eine große Beschämung hätten ersparen wollen. Denn Moses wurde nicht gesandt um zu schaffen, auch nicht, um das Nichtseiende ins Dasein zu rufen und die ähnlichen Menschen zu bilden, sondern nur, um als Diener Worte an das Volk und an den König Pharao zu richten. Es liegt aber darin ein großer Unterschied, weil das Dienen Sache der entstandenen Wesen ist, die Knechte sind. Schaffen und Bilden aber ist allein die Sache Gottes und seines Wortes und seiner Weisheit. Darum also kann man beim Schöpfungsakt niemand andern finden als nur das Wort Gottes; denn „alles ist in Weisheit gemacht worden“, und „ohne das Wort ist nichts entstanden“. Für Dienstverrichtungen aber steht nicht bloß ein einziger, sondern es stehen aus der Gesamtheit viele zur Verfügung, die der Herr nach Belieben absendet. Denn viele Erzengel, viele Throne und Mächte und Herrschaften und Tausende von Tausenden und Myriaden von Myriaden stehen zum Dienste da und stehen bereit, abgesandt zu werden. Und viele Propheten, und zwölf Apostel, und Paulus, und Moses, und zwar nicht bloß Er, sondern auch Aaron mit ihm, und hernach siebzig andere wurden mit dem Heiligen Geiste erfüllt; und den Moses löste ab Jesus, der Sohn des Nave, und diesen die Richter und jene nicht einer, sondern viele Könige. Wenn nun der Sohn ein Geschöpf wäre und zu den entstandenen Wesen gehörte, so müßte es auch viele Söhne geben, damit Gott auch viele solche Diener hätte, wie es auch bei den übrigen Gattungen eine Menge gibt. Wenn man aber so etwas nicht wahrnehmen kann, anderseits es aber viele Geschöpfe, aber nur Ein Wort gibt, wem wird hieraus nicht klar, daß der Sohn von der Gesamtheit sich unterscheidet und nicht mit den Geschöpfen seine Stellung teilt, sondern dem Vater eigen ist? Deshalb gibt es auch nicht viele Worte, sondern nur ein einziges Wort des Einen Vaters und ein einziges Bild des Einen Gottes gibt es. Doch sieh, sagen sie, auch die Sonne ist nur Eine und die Erde nur Eine. Nun sollen sie in ihrem Unverstand behaupten, auch das Wasser sei Eines und das Feuer Eines, damit sie vernehmen, daß jeder geschaffene Gegenstand Einer ist in seiner Wesenheit, für die übertragene Aufgabe und Dienstleistung aber der einzelne allein nicht ausreicht und genügt. Denn Gott sprach: „Es sollen Lichter werden an der Feste des Himmels zur Beleuchtung der Erde, und um den Tag und die Nacht zu trennen, und sie sollen zum Zeichen dienen und zu Zeiten und zu Tagen und zu Jahren“. Dann sagt er: „Und Gott machte die zwei großen Lichter, das Licht zur Herrschaft über den Tag, das kleinere zur Herrschaft über die Nacht und die Sterne; und er setzte sie an die Feste des Himmels, damit sie auf der Erde leuchten und über den Tag und die Nacht herrschten“.</p><p>Sieh, viele Lichter gibt es und nicht bloß die Sonne, auch nicht bloß den Mond, vielmehr ist jedes Licht Eines in seiner Wesenheit, die Dienstleistung aber ist nur Eine und allen gemeinsam, und was dem einzelnen abgeht, wird vom andern ergänzt, und für alle besteht die Notwendigkeit zu leuchten. So hat die Sonne die Macht, den Tag über zu leuchten, und der Mond zur Nachtzeit. Und die Sterne vollenden mit diesen die Zeiten und die Jahre, und jeder wird zum Zeichen für das notwendige Bedürfnis. So ist auch die Erde nicht für alles da, sondern nur für die Früchte und als Aufenthalt für die auf ihr befindlichen Lebewesen; und das Firmament hat das Wasser vom Wasser zu scheiden und bildet das Gezelt für die Sterne. So ist auch das Feuer und das Wasser mit allem übrigen entstanden zur Bildung des Körpers. Und überhaupt nicht Ein Ding allein, sondern alle die entstandenen Wesen, die gleichsam Glieder voneinander sind, bringen das Weltganze wie Einen Leib zustande. Wenn sie nun auch vom Sohne so denken, so mögen alle nach ihnen werfen, da sie glauben, das Wort gehöre zum All und sei als ein Teil nicht fähig, ohne die andern Wesen den ihm übertragenen Dienst zu erfüllen. Wenn aber das offenbar gottlos ist, so mögen sie erkennen, daß das Wort nicht zu den entstandenen Dingen gehört, sondern allein des Vaters eigenes Wort und Schöpfer der gewordenen Dinge ist. Doch sie haben gesagt: Ein Gebilde ist es und gehört zu den entstandenen Dingen; das Schaffen aber hat es wie von einem Lehrer und Künstler gelernt, und so half es Gott, von dem es gelernt hat. Dies hat der Sophist Asterius, der es versteht, den Herrn zu leugnen, zu schreiben sich vermessen, ohne den daraus resultierenden Unsinn zu beachten. Denn ist das Schaffen erlernbar, dann mögen sie achthaben, daß sie nicht von Gott selbst behaupten, er sei nicht von Natur Schöpfer, sondern weil er es gelernt habe, so daß er diese Fähigkeit auch verlieren kann. Wenn die Weisheit Gottes das Schaffen durch den Unterricht erworben hat, wie ist sie noch Weisheit, da sie des Unterrichts bedarf? Was war sie aber vor der Unterweisung? Denn Weisheit war sie nicht, da es ihr an Unterricht gebrach. Sie war also eine inhaltslose Sache und ist nicht wesenhafte Weisheit, sondern erst infolge ihres Fortschrittes erhielt sie den Namen Weisheit. Auch wird sie nur solange Weisheit sein, als sie das Erlernte bewahrt. Denn was einer nicht von Natur besitzt, sondern durch Erlernen sich angeeignet hat, das kann er auch einmal wieder vergessen. Doch so vom Worte Gottes reden ist heidnisch, aber nicht christlich.</p><p>Denn wenn einem durch Unterricht die Fähigkeit zu schaffen zuteil wird, dann unterschieben die Unverständigen Gott Neid und Ohnmacht: Neid, weil er nicht viele das Schaffen gelehrt hat, so daß, wie viele Engel und Erzengel, so auch viele Schöpfer um ihn wären, Ohnmacht aber, weil er nicht allein schaffen konnte, sondern einen Mitarbeiter und Gehilfen nötig hatte, während doch auch die entstandene Natur, wie bewiesen worden ist, durch Gott allein entstehen konnte, wenn ja nach ihrer Ansicht der Sohn, der entstanden ist, durch Gott allein entstehen konnte. Doch Gott kennt kein Bedürfnis. Bewahre! Er sagt ja selbst: „Ich bin satt“. Und so ist das Wort nicht durch Unterricht zum Schöpfer geworden, sondern als Bild und Weisheit des Vaters vollbringt es die Werke des Vaters. Auch hat er den Sohn nicht gemacht, damit er die entstandenen Dinge schaffe. Denn siehe, auch da der Sohn existiert, tritt der Vater nichtsdestoweniger schaffend auf, wie der Herr selbst sagt: „Mein Vater wirkt bis jetzt, und auch ich wirke“. Wenn aber nach eurer Ansicht der Sohn deshalb geworden ist, damit er das schaffe, was nach ihm existiert, der Vater aber auch nach dem Sohn sich wirksam zeigt, so ist auch von diesem Gesichtspunkt aus nach eurer Ansicht die Erschaffung eines solchen Sohnes überflüssig. Übrigens, wenn er uns erschaffen will, warum sucht er denn überhaupt nach einem Mittler, als ob sein Wille unzureichend wäre zu bilden, was ihm immer beliebte? Denn auch die Schriften sagen: „Alles, was er will, tut er“, und: „Wer widersteht seinem Willen?“. Wenn aber schon sein bloßer Wille zur Erschaffung aller Dinge hinreicht, dann ist nach eurer Ansicht die Hilfe eines Mittlers überflüssig. Denn auch euer Beispiel von Moses, der Sonne und dem Monde hat sich als hinfällig erwiesen, und auch das Folgende soll euch wieder zuschanden machen. Wenn Gott, da er die entstandene Natur erschaffen will und ihretwegen mit sich zu Rate geht, nach eurer Ansicht den Sohn ersinnt und bildet, um durch ihn uns zu erschaffen, dann bedenkt, welch große Gottlosigkeit ihr auszusprechen euch unterfangen habt.</p><p>Denn fürs erste gewinnt es den Anschein, daß der Sohn eher unsertwegen geworden ist, als wir seinetwegen. Denn nicht wurden wir seinetwegen geschaffen, sondern er ist unsertwegen gemacht worden, so daß er uns Dank schuldet und nicht wir ihm, wie auch das Weib dem Manne. „Denn nicht wurde der Mann wegen des Weibes erschaffen, sondern das Weib wegen des Mannes“. Wie also „der Mann das Bild und die Ehre Gottes ist, das Weib aber die Ehre des Mannes“, ebenso sind wir Gottes Bild und zu seiner Ehre entstanden; der Sohn aber ist unser Bild und hat zu unserer Ehre das Dasein empfangen. Und wir sind entstanden, um zu sein, das Wort Gottes aber ist nach eurer Ansicht gemacht worden, nicht um zu sein, sondern als Werkzeug zu unserem Nutzen, so daß nicht wir ihm, vielmehr Er unserem Nutzen das Dasein verdankt. Überbieten nicht die, welche dieses auch nur denken, jeglichen Unsinn? Denn wenn das Wort unsertwegen geworden ist, so ist es auch nicht vor uns bei Gott. Und er trägt das Wort auch nicht in sich, da er unsertwegen beratschlagt, sondern uns trägt er in sich, wo er sich, wie jene sagen, wegen seines Wortes berät. Wenn aber dem so ist, so hat vielleicht der Vater den Sohn überhaupt nicht gewollt. Denn nicht, weil er ihn wollte, schuf er ihn, sondern, weil er uns wollte, hat er ihn unsertwegen geschaffen. Erst nach uns dachte er an ihn, so daß nach der Ansicht dieser Gottlosen der Sohn, der als Werkzeug entstanden ist, dann überflüssig war, nachdem jene geworden waren, um derentwillen er auch geschaffen wurde. Wenn aber nur der Sohn unmittelbar von Gott geschaffen worden ist, da nur Er hierfür fähig war, wir aber, die wir hierfür nicht fähig waren, durch den Sohn entstanden sind, warum geht er dann nicht auch zuerst seinetwegen zu Rate, da er doch fähig war, sondern unsertwegen? Oder warum zieht er nicht den Starken dem Ohnmächtigen vor? Oder warum, wenn er ihn zuerst machte, geht er seinetwegen nicht auch zuerst zu Rate? Oder, wenn er sich unsertwegen zuerst berät, warum schafft er nicht auch uns zuerst, da doch sein Wille ausreicht, um alles ins Dasein zu rufen? Doch jenen schafft er zuerst, unsertwegen beratschlagt er sich zuerst, und uns will er früher als den Mittler. Und uns, die er schaffen will und derentwegen er sich berät, nennt er Geschöpfe, das Wort aber, das er unsertwegen schafft, nennt er Sohn und eigenen Erben. Und doch sollten vielmehr wir, um derentwillen er auch diesen schafft, Söhne genannt werden, oder offenbar sollte er an diesen Sohn auch zuerst denken und ihn wollen, um dessentwillen er uns alle macht. Das ist das Erbrechen und der Auswurf der Häretiker.</p><p>Man darf aber die Ansicht der Wahrheit nicht verschweigen, sondern muß gerade diese auch laut verkünden. Denn das Wort Gottes ist nicht unsertwegen entstanden, vielmehr sind wir seinetwegen geworden, und in ihm wurde alles erschaffen. Und nicht ist dieses, weil wir zu schwach waren, es aber stark, unmittelbar durch den Vater entstanden, damit er uns mit ihm wie mit einem Werkzeug erschaffe. Ferne sei es! so ist es nicht. Denn wenn es Gott auch gefallen hätte, die entstandenen Dinge nicht zu machen, so wäre dessenungeachtet das Wort bei Gott, und in ihm wäre der Vater. Die entstandenen Dinge jedoch konnten ohne das Wort nicht entstehen; so sind sie denn auch durch ihn entstanden, und zwar natürlicher Weise. Denn da der Sohn von Natur wesenseigenes Wort Gottes und aus ihm und in ihm ist, wie er es gesagt hat, so konnten die Geschöpfe nur durch ihn entstehen. Denn wie das Licht mit seinem Glanze alles erhellt, und ohne seinen Glanz nichts erleuchtet würde, so hat auch der Vater wie mit einer Hand im Wort alles erschaffen, und ohne dasselbe machte er nichts. Es sagte daher Gott, wie Moses erzählt: „Es werde Licht“ und: „Es sammle sich das Wasser“ und: „Es bringe die Erde hervor“ und: „Laßt uns den Menschen machen“, wie der heilige David singt: „Er sprach, und es ist geworden; er befahl, und es ward geschaffen“. Er sprach es aber nicht, damit, wie bei den Menschen, irgend ein Gehilfe es vernehme, den Willen des Redenden erfahre, weggehe und ihn vollführe; denn das ist den Geschöpfen eigen, vom Worte aber so zu denken oder zu reden ziemt sich nicht. Denn das Wort Gottes ist schöpferisch und wirksam und ist selbst der Ratschluß des Vaters. Deshalb sagte die göttliche Schrift nicht, daß der Hörende gehört und geantwortet habe, wie oder wie beschaffen er die entstehenden Dinge wolle entstehen sehen, sondern Gott sprach nur: „Es werde“ und danach folgen die Worte: „Und es ward so“. Denn das Beschlossene und Gewollte wurde sofort Tatsache durch das Wort und wurde fertig. Wenn aber Gott andern oder Engeln einen Auftrag gibt oder mit Moses verkehrt, oder dem Abraham eine Verheißung macht, dann antwortet der Hörende, und der eine sagt: „Woran werde ich erkennen?“, ein anderer: „Wähle einen andern“ und wieder einer: „Wenn sie mich fragen, welches ist sein Name? Was werde ich zu ihnen sagen?“. Und der Engel sprach zu Zacharias: „Dies spricht der Herr“. Den Herrn aber bat er: „Allmächtiger Herr, wie lange willst Du Dich Jerusalem nicht erbarmen?“. Und er erwartet, gute und tröstliche Reden zu vernehmen. Denn ein jeder von diesen hat zum Mittler das Wort und die Weisheit Gottes, die den Willen des Vaters kundgibt. Wenn aber das Wort selbst wirkt und schafft, dann gibt es nicht Frage noch Antwort; denn in ihm ist der Vater und das Wort im Vater. Vielmehr genügt das Wollen und das Werk entsteht, damit unsertwegen das Wort: „Er sprach“ ein Kennzeichen des Willens wäre, das Wort aber: „Und es ward so“ das Werk des Wortes und der Weisheit anzeigten, in der auch der Wille des Vaters ist. Und auch das Wort: „Es sprach Gott“ wird im Worte verständlich. Denn: „Alles“, heißt es, „hast Du in Weisheit gemacht“, und: „Durch das Wort des Herrn wurden die Himmel befestigt“ und: „Ein Herr Jesus Christus, durch den alles ist, und wir durch ihn“.</p><p>Daraus kann man es verstehen, daß die Arianer mit ihrer Häresie nur scheinbar gegen uns ankämpfen, in der Tat aber gegen die Gottheit selbst den Kampf führen. Denn wenn von uns die Stimme käme, die sagt: „Dieser ist mein Sohn“, dann hätte sie einen leichten Tadel von uns zu erwarten. Wenn aber die Stimme vom Vater kommt, und die Jünger sie vernehmen und auch der Sohn selbst sagt: „Vor allen Hügeln zeugt er mich“, kämpfen sie dann nicht auch wie die Giganten in der Mythologie mit Gott, indem sie ihre Zunge, um mit dem Psalmisten zu reden, als „scharfes Schwert“ für die Gottlosigkeit gebrauchen? Denn sie hatten weder eine Scheu vor der Stimme des Vaters noch auch eine Ehrfurcht vor den Worten des Heilandes, noch auch glaubten sie den Heiligen, von denen einer schreibt: „Der, da er der Abglanz seiner Herrlichkeit und das Ebenbild seines Vaters ist“ und: „Christus, die Kraft Gottes und Weisheit Gottes“ und ein anderer singt: „Denn bei Dir ist die Quelle des Lebens, und in Deinem Lichte schauen wir das Licht“ und: „Alles hast Du in Weisheit gemacht“, und die Propheten sagen: „Und es erging das Wort des Herrn an mich“, Johannes aber: „Im Anfang war das Wort“ und Lukas: „Wie uns jene überliefert haben, die von Anfang an Augenzeugen und Diener des Wortes waren“. Und auch David sagt wieder: „Er sandte sein Wort und heilte sie“. All diese Stellen brandmarken überall die arianische Häresie und zeigen die Ewigkeit des Wortes an, sowie auch, daß es der Wesenheit des Vaters nicht fremd, sondern eigen ist. Denn wann sah man ein Licht ohne den Abglanz? Oder wer wagt zu behaupten, das Ebenbild sei seiner Substanz fremd? Oder tobt nicht der noch mehr, dem es auch nur einfällt, Gott ohne Vernunft [Wort] und ohne Weisheit zu denken. Denn solche Beispiele und Bilder hat die Schrift aufgestellt, damit wir, die ja die menschliche Natur Gott unmöglich begreifen können, wenigstens aus diesen einigermaßen uns eine schwache Vorstellung machen können, soweit es möglich ist. Und wie die Schöpfung hinlänglich zur Erkenntnis vom Dasein eines Gottes und einer Vorsehung führt — „denn aus der Größe und Schönheit der Geschöpfe wird ihr Schöpfer vergleichungsweise erkannt“ —, und wie wir von ihnen keine Stimme erwarten, um zu verstehen, sondern auf die Schriften hören und ihnen glauben und schon bei der Betrachtung der Ordnung und Harmonie aller Dinge zur Einsicht kommen, daß dieser Schöpfer Herr und Gott aller Dinge ist, und dessen wunderbare Vorsehung und Leitung in allen Dingen erfassen, ebenso ist es, da die vorhin angeführten Worte über die Gottheit des Vaters ausreichen, überflüssig oder vielmehr mehr als Wahnsinn, zu zweifeln und in häretischer Weise zu fragen, wie denn der Sohn von Ewigkeit her existieren, oder wie er aus der Substanz des Vaters sein könne, ohne ein Teil von ihm zu sein. Denn das, wovon man sagt, er sei aus etwas, ist ein Teil von ihm; was aber geteilt wird, ist kein Ganzes.</p><p>Dies sind nämlich die spitzfindigen Ränke der Andersgläubigen, und wenn wir auch schon im Vorausgegangenen ihr diesbezügliches hohles Gerede widerlegt haben, so widerlegt gleichwohl auch eine genaue Prüfung dieser Worte und der Sinn der Gleichnisse das Blendwerk ihrer verruchten Lehre. Denn wir sehen, daß das Wort immer existiert und seine Existenz aus Gott hat und der Substanz dessen eigen ist, dessen Wort es auch ist, und daß es kein „früher“ und „später“ kennt. Wir sehen auch, daß der Abglanz der Sonne ihr selbst eigen ist, und daß die Substanz der Sonne weder geteilt noch auch verringert wird, sondern daß sowohl sie selbst ganz bleibt als auch der Abglanz vollkommen und unversehrt ist, und daß dieser die Substanz des Lichtes nicht vermindert, sondern als eine wahrhafte Zeugung aus ihm besteht. Wir sehen auch, daß der Sohn nicht von außen, sondern vom Vater gezeugt ist, daß der Vater unversehrt bleibt, und daß das Abbild der Substanz immer besteht und eine, völlige Ähnlichkeit mit dem Vater bewahrt, und dessen unverändertes Abbild bleibt, so daß wer dieses sieht, in ihm auch die Substanz sieht, deren Abbild es ist. Und aus der Wirksamkeit des Abbildes erkennen wir in Wahrheit die Gottheit der [urbildlichen] Substanz. Denn dies hat auch der Heiland gelehrt mit den Worten: „Der in mir bleibt, der tut die Werke, die ich tue“ und: „Ich und der Vater sind Eins“ und: „Ich bin im Vater und der Vater ist in mir“. So möge also die christusfeindliche Häresie zuerst versuchen, an den von den entstandenen Dingen hergenommenen Beispielen eine Trennung vorzunehmen und zu sagen: „Es war einmal die Sonne ohne Abglanz“, oder: „Dieser ist nicht der Substanz des Lichtes eigen“, oder: „Er ist zwar eigen, doch infolge der Trennung ist er ein Teil vom Lichte“. Dann nehme sie auch eine Trennung vor beim Wort und sage, es habe mit der Vernunft nichts zu tun, oder: „Es war einmal nicht“, oder: „Es ist seiner Wesenheit nicht eigen“, oder: „Es ist durch Trennung ein Teil von ihm“. Sie trenne das Abbild und das Licht und die Kraft sowie das Wort und den Abglanz, und dann mögen sie darüber phantasieren, wie es ihnen beliebt. Wenn aber ein solches Unterfangen ihnen selbst unmöglich erscheint, wie toben sie nicht heftig, wenn sie nach dem, was über die entstandenen Wesen und ihre eigene Natur hinausliegt, vergeblich auslangen und Unmögliches versuchen?</p><p>Denn wenn schon bei diesen entstandenen und leiblichen Dingen die Zeugungen nicht als Teile der Substanzen, aus denen sie stammen, erfunden werden, und nicht unter Leiden ins Dasein treten und die Substanzen der Eltern nicht vermindern, toben sie nicht wieder gegen den unkörperlichen und wahren Gott, wenn sie [in ihm] nach Teilen und Leiden suchen und solche annehmen und dem leidensunfähigen und unveränderlichen Gott Teilungen zuschreiben, um damit die Ohren der Einfältigeren zu betäuben und von der Wahrheit abzulenken? Denn wer kann von einem Sohn reden hören, ohne an das Eigentum der Substanz des Vaters zu denken? Und wer hätte im Anfang des katechetischen Unterrichts vernommen, daß Gott einen Sohn habe, und daß er alles durch sein Wort gemacht habe, ohne es in dem Sinne aufzufassen, wie wir es jetzt verstehen? Als dann die abscheuliche Häresie der Arianer aufkam, wer wurde da nicht alsbald, wenn er ihre Reden vernahm, überrascht, da sie Fremdklingendes vorbrachten und eine andere Lehre verbreiteten als die, welche von Anfang an verbreitet wurde? Denn was von jeher in jedes Herz gelegt wird, ist die Lehre, Gott habe einen Sohn, das Wort, die Weisheit und die Kraft, und dieser sei sein Bild und Abglanz. Aus dem Gesagten ergibt sich aber sofort von selbst das „immer“ und das „Sein aus dem Vater“, die Ähnlichkeit und Ewigkeit der Zeugung der Substanz, und eine Vorstellung von Geschöpf oder gemachten Wesen findet hier nirgends Raum. Als aber ein feindseliger Mensch die Worte: „Geschöpf“ und: „Es war einmal, da er nicht war“ und: „Wie ist es nun möglich?“ aussäte, da entstand nunmehr wie ein Unkraut die verruchte Häresie der Christusfeinde. Und sogleich trieben sie sich, da ihnen jegliche aufrichtige Gesinnung abgeht, nach Art der Räuber geschäftig herum und erfrechen sich zu fragen: „Wie kann also der Sohn mit dem Vater ewig existieren? Denn die Menschen werden mit der Zeit Söhne von Menschen: so zählt der Vater dreißig Jahre, der Sohn aber nimmt dann mit der Zeugung den Anfang, und es existierte überhaupt nie eines Menschen Sohn, ehe er gezeugt wurde“. Dann wieder flüstern sie: „Wie kann der Sohn Wort sein oder das Wort ein Bild Gottes? Denn das Wort des Menschen besteht aus Silben und bringt bloß den Willen des Redenden zum Ausdruck, dann ist es beendigt und verschwunden“.</p><p>Wie wenn sie nun die bereits gegen sie angeführten Beweise vergessen hätten, verwickeln sie sich wieder mit solchen Einfällen in ähnliche Fallstricke der Gottlosigkeit. Das Wort der Wahrheit aber widerlegt sie also: Wenn von einem Menschen die Rede ist, dann mögen sie auch von seinem Worte und seinem Sohne sich menschliche Vorstellungen machen; wenn aber die Rede ist von Gott, der die Menschen erschaffen hat, dann sollen sie sich nicht mehr menschliche, sondern nur mehr übermenschliche Gedanken machen. Denn wie der Erzeuger ist, so muß auch die Zeugung sein, und wie der Vater des Wortes ist, so muß wohl auch sein Wort sein. Der Mensch also, der in der Zeit erzeugt wird, erzeugt auch das Kind in der Zeit, und da er aus dem Nichtseienden ist, deshalb hört auch sein Wort auf und hat keinen Bestand. Gott aber ist nicht wie ein Mensch, denn dies hat die Schrift gesagt, sondern er ist der Seiende und ist immer. Deshalb ist auch sein Wort seiend und existiert ewig mit dem Vater als Abglanz des Lichtes. Und das Wort der Menschen besteht aus Silben, lebt nicht, noch ist es wirksam, sondern bringt nur den Gedanken des Redenden zum Ausdruck, geht nur aus und geht vorüber, ohne wieder zu erscheinen, da es überhaupt auch nicht war, bevor es ausgesprochen wurde. Deshalb lebt es nicht, noch ist es wirksam, noch ist das Wort des Menschen überhaupt ein Mensch. Es leidet aber daran, weil, wie bereits bemerkt, auch der Mensch, der es erzeugt, seiner Natur nach vom Nichtseienden stammt. Das Wort Gottes ist aber nicht, wie man sich vielleicht ausdrücken könnte, ein verlautbares, auch nicht ein Geräusch von Worten, und auch nicht das, was Gott befohlen hat, ist der Sohn, sondern wie ein Abglanz vom Licht, so ist er eine vollkommene Zeugung aus Vollkommenem. Darum ist Gottes Bild auch Gott. Denn „Gott war“, heißt es, „das Wort“. Die Worte der Menschen vermögen nichts zu schaffen. Deshalb arbeitet der Mensch auch nicht mit Worten, sondern mit den Händen, weil diese existieren, ihr Wort aber keinen Bestand hat. Das Wort Gottes aber ist, wie der Apostel gesagt hat, „das lebendige und wirksame Wort Gottes, schärfer als jedes zweischneidige Schwert, und es dringt durch, bis es Seele und Geist, Gelenke wie Mark durchschneidet, und ist ein Richter der Gedanken und Gesinnungen des Herzens. Und kein Geschöpf ist vor seinem Angesicht verborgen; alles ist bloß und offenbar vor den Augen dessen, [bei] dem wir Rechenschaft zu geben haben“. Es ist also Schöpfer, und ohne dasselbe ist nichts entstanden, und es kann auch ohne dasselbe nichts entstehen.</p><p>Doch man braucht nicht erst zu fragen, warum das Wort Gottes nicht so beschaffen ist wie das unsrige, da ja Gott, wie bereits gesagt, nicht ist wie wir. Und es geht auch nicht an, danach zu fragen, wie das Wort von Gott kommt, oder wie es Gottes Abglanz ist, oder wie Gott zeugt, und welches der Charakter der Geburt Gottes ist. Denn wer solches wagt, müßte für wahnsinnig gelten, weil er eine unerklärbare und der Natur Gottes eigene Sache, die nur von ihm und seinem Sohne erkannt wird, in Worten ausgedrückt und erklärt wissen will. Denn solche Leute könnten ebenso gut fragen, wo und wie Gott ist und wie beschaffen der Vater. Wie aber ein solches Fragen gottlos ist und Leute verrät, die Gott nicht kennen, ebenso geht es auch nicht an, so etwas in Betreff der Geburt des Sohnes Gottes sich zu erlauben und an Gott und seiner Weisheit den Maßstab seiner eigenen Natur und Ohnmacht anzulegen. Aber das ist kein Grund, gegen die Wahrheit anzurennen, und wenn man bei einer solchen Untersuchung in Verlegenheit kommt, darf man sich den Schriftworten gegenüber nicht ungläubig zeigen. Denn es ist besser, in der Verlegenheit zu schweigen und zu glauben, als ungläubig zu sein, weil man sich nicht zu helfen weiß. Denn wer keine Lösung findet, kann doch irgendwie noch Verzeihung erlangen, weil er, wenn er auch nachgrübelte, sich doch zufrieden gegeben hat; wer aber deshalb, weil er sich keinen Rat weiß, Ungehöriges ausdenkt und Unwürdiges über Gott aussagt, der empfängt eine unnachsichtliche Strafe für sein Unterfangen. Man kann bei derartigen Schwierigkeiten einige Beruhigung aus den göttlichen Schriften schöpfen, indem man die Schriftworte richtig versteht und unser eigenes Wort sich als Gleichnis denkt. Denn wie dieses uns eigene Wort aus uns stammt und nicht ein Werk außer uns ist, so stammt auch das Gott eigene Wort aus ihm, und nicht ist es ein Geschöpf, noch auch wie das Wort der Menschen. Denn dann müßte man sich Gott als einen Menschen denken. Denn siehe wieder: Viele und verschiedene Worte der Menschen gehen täglich vorüber, weil die ersten nicht bleiben, sondern verschwinden. Es geschieht aber das wiederum, weil auch ihre Väter, die Menschen sind, vorübergehende Lebensalter und abwechselnde Gedanken haben und entsprechend ihrem Denken und Sinnen auch reden, so daß sie auch viele Worte und nach den vielen überhaupt keines mehr davon haben. Denn der Sprechende hört auf, und alsbald ist das Wort dahin. Das Wort Gottes aber ist eines und dasselbe und, wie geschrieben steht, bleibt das Wort Gottes in Ewigkeit, ohne sich zu ändern, und nicht ist ein erstes oder zweites nach einem andern, sondern immer dasselbe. Denn es mußte, da Gott einer ist, auch sein Bild eines sein und eines sein Wort und eine seine Weisheit.</p><p>Deshalb muß ich mich auch wundern, wie diese, da doch ein Gott ist, nach ihren eigenen Einfällen viele Bilder, Weisheiten und Worte annehmen und behaupten, daß das eigene und natürliche Wort des Vaters, in dem er auch den Sohn gemacht habe, ein anderes sei, der wirkliche Sohn aber nur dem Sinne nach Wort genannt werde wie Weinstock, Weg, Türe und Baum des Lebens. Und Weisheit, erklären sie, werde er dem Namen nach genannt; eine andere Weisheit aber sei die eigene und wahrhafte Weisheit des Vaters, die ungezeugt mit ihm existiert, in der er auch den Sohn machte und ihn auf Grund seiner Teilnahme an ihr Weisheit nannte. Hierin kam es aber bei ihnen nicht bloß zu Worten, sondern Arius hat in seiner Thalia solche Behauptungen zusammengestellt und der Sophist Asterius schrieb, wie wir schon früher erwähnt haben, folgendes nieder: “Nicht sagte der selige Paulus, er verkünde Christum, die Kraft oder die Weisheit Gottes, sondern, ohne Beifügung des Artikels: Kraft Gottes und Weisheit Gottes, womit er predigte, eine andere Kraft sei die Gott selbst eigene und natürliche und ohne Zeugung mit ihm bestehende, die offenbar auch Christum gezeugt und die ganze Welt geschaffen habe. Und von dieser lehrt und sagt Paulus im Briefe an die Römer:”Denn das Unsichtbare an ihm wird seit der Erschaffung der Welt in den Geschöpfen erkannt und geschaut, nämlich seine ewige Kraft und Gottheit. Denn wie man nicht sagen könnte, die Gottheit, von der hier die Rede ist, sei Christus, sondern nur, sie sei der Vater selbst, so, glaube ich, ist auch seine ewige Kraft und Weisheit nicht der eingeborene Sohn, sondern sie ist der Vater, der ihn gezeugt hat. Und er lehrt, eine andere Kraft und Weisheit Gottes sei die, welche in Christus kund werde." Kurz hernach sagt derselbe Asterius: “Allerdings ist seine ewige Kraft und Weisheit, die nach den Wahrheitsbeweisen anfangslos und ungezeugt erscheint, doch wohl nur eine und dieselbe; aber viele sind es, die von ihm einzeln geschaffen wurden, und unter diesen ist der Erstgeborene und Eingeborene Christus. Alle sind doch nun in gleicher Weise von ihrem Herrn abhängig und alle werden mit Recht Kräfte dessen genannt, der sie geschaffen hat und sich ihrer bedient. Deshalb sagt der Prophet, die Heuschrecke, die eine von Gott verhängte Strafe für die Sünden der Menschen sei, werde nicht bloß eine Kraft, sondern sogar eine große Kraft von Gott selbst genannt. Der selige David aber fordert in mehreren Psalmen nicht bloß die Engel, sondern auch die Kräfte auf, Gott zu loben.”</p><p>Wenn sie aber das auch nur aussprechen, verdienen sie dann nicht allen Haß? Denn wenn er, wie sie glauben, nicht wegen der Geburt aus dem Vater und wegen der Eigenheit der Substanz Sohn ist, sondern wegen der vernünftigen Wesen Vernunft [Wort] und wegen der mit Weisheit begabten Weisheit und wegen der mit Kraft ausgestatteten Kraft genannt wird, so wurde er wohl jedenfalls auch wegen der angenommenen Söhne Sohn genannt und hat vielleicht auch das Sein wegen der seienden Dinge nur in der Vorstellung. Was ist er aber dann noch? Denn von alldem ist er wohl nichts, wenn das nur Namen für ihn sind, und er existiert nur in der Phantasie und wird nur unsertwegen mit diesem Namen geschmückt. Aber auch das ist vielmehr ein teuflischer Unverstand oder vielleicht noch mehr, daß sie selbst in Wahrheit existieren wollen, aber vom Wort Gottes eine Existenz nur dem Namen nach annehmen. Und sind nicht auch das ungeheuerliche Behauptungen von ihnen, wenn sie sagen, eine Weisheit existiere mit dem Vater, aber diese sei nicht Christus, vielmehr gebe es viele geschaffene Kräfte und Weisheiten, und eine von diesen sei der Herr, den sie auch mit einer Raupe und Heuschrecke vergleichen? Und wenn sie von uns hören, das Wort existiere zugleich mit dem Vater, sind sie dann nicht auch heimtückisch, wenn sie daraufhin murren und sprechen: „So redet ihr also von zwei unentstandenen Wesen“, dabei selbst aber mit ihrer Rede von „seiner ungewordenen Weisheit“ nicht sehen, daß der nichtige Tadel, den sie aussprechen, sie selber trifft? Und ist nicht auch jene ihre Ansicht wieder ganz töricht, wonach die ungewordene Weisheit, die zugleich mit Gott existiert, Gott selber wäre? Denn was zugleich existiert, existiert nicht zugleich mit sich selbst, sondern mit irgendeinem, wie z.B. die Evangelisten vom Herrn berichten, daß er mit seinen Jüngern zusammen war. Denn nicht mit sich selbst, sondern mit seinen Jüngern war er zusammen. Sonst müßten sie sagen, Gott sei zusammengesetzt und habe eine äußerlich verbundene Weisheit oder eine solche, die seine eigene Substanz ergänzt und gleichfalls ungeworden ist, die sie auch als Schöpferin der Welt einschieben, um dem Sohne auch die Schöpfung entziehen zu können. Denn sie suchen alles mögliche zu behaupten, um ja nicht vom Herrn der Wahrheit folgend denken zu müssen.</p><p>Wo fanden sie denn überhaupt in der göttlichen Schrift ausgesprochen oder von wem vernehmen sie, daß ein anderes Wort und eine andere Weisheit neben diesem Sohne existiere, um sich so etwas in den Kopf zu setzen? Wohl steht geschrieben: „Sind nicht meine Reden wie Feuer oder wie ein Beil, das einen Felsen spaltet?“ und in den Sprichwörtern: „Ich will euch in meinen Reden unterrichten“. Aber das sind Befehle und Aufträge, die Gott durch sein eigenes und einziges wahrhaftes Wort an die Heiligen hat ergehen lassen, wovon der Psalmist sagt: „Von jedem bösen Wege halte ich zurück meine Füße, damit ich Deine Worte halte“. Daß nun das andere Worte sind als er selbst, hat der Heiland selber ausgesprochen mit den Worten: „Die Worte, die ich zu euch geredet habe“. Denn es sind ja dergleichen Worte nicht Zeugungen oder Söhne, und nicht gibt es so viele schöpferische Worte, noch so viele Bilder des einen Gottes, noch gibt es so viele, die für uns Mensch geworden sind, noch ist es gleichsam aus der Mitte vieler solcher eines, das nach Johannes Fleisch geworden ist, sondern als einziges Wort Gottes wurde es von Johannes verkündet: „Das Wort ist Fleisch geworden“ und: „Alles ist durch dasselbe geworden“. Deshalb sind auch über unsern Herrn Jesus Christus allein und über seine Einheit mit dem Vater die Zeugnisse aufgeschrieben und niedergelegt: der Vater offenbart, einer sei der Sohn und die Heiligen haben das erfahren und sagen, eines sei das Wort und dieses sei eingeboren. Und auch seine Werke werden [zum Beweis] angeführt. Denn alles Sichtbare und Unsichtbare ist durch das Wort entstanden und ohne dasselbe ist nichts entstanden. Von einem zweiten oder irgendeinem andern aber machen sie sich keine Vorstellungen, und sie ersinnen keine Worte oder Weisheiten, von denen die Schrift weder einen Namen noch ein Werk anzugeben weiß, von denen vielmehr nur diese reden. Denn das ist die Ausgeburt ihrer christusfeindlichen Gesinnung, und sie treiben mit dem Namen „Wort“ und „Weisheit“ Mißbrauch, erdichten sich andere und leugnen das wahre Wort Gottes und die wirkliche und einzige Weisheit des Vaters, und den Manichäern beten nunmehr diese Elenden nach. Denn auch sie leugnen, wenn sie die Werke Gottes sehen, ihn den alleinigen und wahren Gott und ersinnen sich einen andern, für den sie weder ein Werk noch irgendein Zeugnis in den göttlichen Aussprüchen nachweisen können.</p><p>Wenn also in den göttlichen Aussprüchen neben diesem Sohne sich keine andere Weisheit findet, noch auch wir so etwas von den Vätern vernommen haben, von diesen vielmehr bekannt und geschrieben worden ist, daß die Weisheit unentstanden zugleich mit dem Vater existiere, ihm eigen und die Schöpferin der Welt sei, so ist es wohl auch nach ihrer Ansicht der Sohn selbst, der ewig mit dem Vater besteht. Denn er ist auch Schöpfer, wie geschrieben steht: „Alles hast Du in Weisheit gemacht“. Tritt ja doch Asterius selbst, wie wenn er vergessen hätte, was er zuvor geschrieben, nach Art des Kaiphas, ohne es zu wollen, hinterher auch seinerseits gegen die Heiden auf und redet nicht mehr von vielen Weisheiten, noch von der Raupe, sondern bekennt sich nunmehr zu der einzigen Weisheit, wenn er also schreibt: „Einer ist Gott, das Wort [Vernunft], viele Wesen aber sind mit dem Worte [Vernunft] begabt und eine ist die Substanz und Natur der Weisheit, weise und gute Wesen aber gibt es viele“. Und gleich hernach sagt er wieder: Welche möchten es sein, die sie des Namens von Gotteskindern würdig erachten? Denn sie werden doch nicht auch diese für Worte erklären noch behaupten, es gebe mehrere Weisheiten. Denn wenn das Wort eines und die Weisheit, wie nachgewiesen, eine ist, dann ist es nicht möglich, die Wesenheit des Vaters einer Vielheit von Kindern zuzuteilen und ihnen den Zunamen von der Weisheit aus Gnade zu geben. Es fällt also keineswegs auf, wenn die Arianer gegen die Wahrheit ankämpfen, wo sie doch schon bei ihren eigenen Leuten anstoßen und mit einander in Streit geraten, indem sie das einemal von vielen Weisheiten reden, ein andermal nur für eine einzige sich erklären. Und bald bringen sie die Weisheit mit der Raupe in Verbindung, bald behaupten sie, sie existiere zugleich mit dem Vater und sei ihm eigen, und einmal sagen sie, nur der Vater sei unentstanden, ein andermal, auch seine Weisheit und Kraft seien unentstanden. Und sie streiten mit uns, wenn wir sagen, das Wort Gottes bestehe immer, sie selbst aber vergessen ihre eigenen Behauptungen, wenn sie sagen, daß die Weisheit zugleich mit Gott existiere, ohne geworden zu sein. So werden sie vielleicht vom Schwindel erfaßt, leugnen die wahre Weisheit, erfinden eine solche, die nicht existiert, wie die Manichäer, die den wirklichen Gott leugnen und einen andern erdichten.</p><p>Doch vernehmen sollen die übrigen Häresien und die Manichäer, daß einer der Vater Christi ist, der durch sein Wort Herr und Schöpfer der Kreatur ist. Vernehmen sollen noch besonders die Ariomaniten, daß es ein einziges Wort Gottes gibt, das allein eigener und echter Sohn aus seiner Substanz ist und die unteilbare Einheit der Gottheit mit seinem Vater innehat, wie wir schon oft gesagt und vom Heiland vernommen haben. Denn wenn es nicht so ist, warum schafft durch dasselbe der Vater und offenbart sich in ihm allen, denen er will, und erleuchtet diese? Oder warum wird bei der Vollendung in der Taufe mit dem Vater der Sohn genannt? Denn die Antwort, der Vater genüge nicht, ist eine gottlose Rede; genügt er aber, und das sagt man mit Recht, wozu bedarf es dann des Sohnes zur Schöpfung oder zum heiligen Bade? Welche Gemeinschaft besteht zwischen Geschöpf und Schöpfer? Oder warum wird bei der Vollendung aller das Geschaffene mit dem Schöpfer zugleich aufgeführt? Oder warum wird nach eurer Ansicht der Glaube an einen Schöpfer und an ein Geschöpf überliefert? Denn wenn es geschieht, damit wir mit der Gottheit verbunden würden, wozu bedarf es dann des Geschöpfes? Wenn es aber geschieht, damit wir mit dem Sohne, einem Geschöpfe, vereinigt würden, dann ist nach eurer Ansicht die Nennung des Sohnes bei der Taufe überflüssig; denn Gott, der ihn zum Sohne gemacht hat, ist imstande, auch uns zu Söhnen zu machen. Überdies werden, wenn der Sohn ein Geschöpf ist und die vernünftigen Geschöpfe ein und dieselbe Natur haben, Geschöpfe von einem Geschöpf keine Hilfe zu erwarten haben, weil alle der Gnade Gottes bedürfen. Einiges wenige haben wir nun schon früher darüber bemerkt, wie passend alles durch ihn entstanden ist. Da wir aber im Verlauf der Rede auch auf die heilige Taufe zu sprechen gekommen sind, so muß man meines Erachtens und nach meinem Dafürhalten sagen, daß nicht deshalb auch der Sohn mitgenannt werde, weil etwa der Vater nicht genügte, auch nicht so einfachhin und wie zufällig, sondern weil er Gottes Wort und eigene Weisheit ist und als sein Abglanz immer mit dem Vater besteht. Deshalb kann die Gnade, die der Vater verleiht, nur im Sohne gespendet werden; denn im Vater ist der Sohn wie der Abglanz in dem Lichte. Denn nicht als ob Gott bedürftig wäre, sondern als Vater hat er durch seine Weisheit die Erde gegründet und durch das aus ihm stammende Wort alles gemacht und bekräftigt im Sohne das heilige Bad. Denn wo der Vater ist, da ist auch der Sohn, wie auch da der Abglanz ist, wo das Licht. Und wie der Vater, was er wirkt, durch den Sohn wirkt und der Herr selbst sagt: „Was ich den Vater tun sehe, das tue auch ich“, so tauft bei der Erteilung der Taufe, den der Vater tauft, diesen auch der Sohn und, den der Sohn tauft, der wird im Heiligen Geiste eingeweiht. Und wie man wieder, wenn die Sonne scheint, sagen kann, daß auch der Abglanz leuchte — denn eines ist das Licht und es läßt sich nicht trennen noch teilen—, so muß da, wo der Vater ist oder genannt wird, jedenfalls auch der Sohn sein; bei der Taufe aber wird der Vater genannt, es muß also auch der Sohn mitgenannt werden.</p><p>Deshalb sprach er, als er den Heiligen Verheißungen machte, also: „Wir werden kommen, ich und der Vater, und Wohnung bei ihm nehmen“, und wieder: „Damit, wie ich und Du eins sind, so auch jene eins seien in uns“. Und die verliehene Gnade ist eine, die vom Vater und Sohne verliehen wird, wie Paulus in jedem Brief schreibt: „Gnade euch und Friede von Gott, unserem Vater und dem Herrn Jesus Christus“. Denn das Licht muß zugleich mit dem Abglanz vorhanden sein und der Abglanz mit seinem Lichte geschaut werden. Deshalb kennen die Juden, die gleich diesen den Sohn leugnen, auch keinen Vater. Denn da sie die „Quelle der Weisheit“ verließen, wie Baruch ihnen vorhält, warfen sie von sich auch die aus ihr stammende Weisheit, unsern Herrn Jesus Christus — „denn Christus“, sagt der Apostel, „ist Gottes Kraft und Gottes Weisheit“ —, indem sie erklärten: „Wir haben keinen König als den Kaiser“. Die Juden haben nun die gerechte Strafe für ihre Leugnung; denn sie haben mit ihrer Stadt auch ihren Verstand verloren. Diese aber laufen nunmehr Gefahr, auch der Fülle des Geheimnisses — ich meine die Taufe — verlustig zu gehen. Denn wenn auf den Namen des Vaters und des Sohnes die Einweihung erteilt wird, sie aber [dabei] nicht den wahren Vater nennen, weil sie das aus ihm Stammende und Wesensähnliche leugnen, und auch den wahren Sohn in Abrede stellen, und einen andern nennen, den sie sich als ein Geschöpf aus dem Nichtseienden einbilden, ist dann nicht ganz und gar inhaltslos und unnütz, was von ihnen gespendet wird, indem er zwar einen Schein gewährt, in Wahrheit aber für die Gottseligkeit keinen Gewinn bringt? Denn nicht auf den Vater und den Sohn spenden die Arianer die Taufe, sondern auf den Schöpfer und das Geschöpf, auf den Bildner und das Gebilde. Wie aber ein Geschöpf etwas anderes ist als der Sohn, so ist wohl das vermeintlich von ihnen Gebotene etwas anderes als die Wahrheit, mögen sie nun auch mit Rücksicht auf das Schriftwort die Namen „Vater“ und „Sohn“ noch beibehalten. Denn nicht schon der, der nur sagt: „Herr“, gibt damit auch, sondern nur der, der mit dem Namen auch den rechten Glauben besitzt. Deshalb befahl also auch der Heiland nicht einfach zu taufen, sondern er sagt zuerst: „Lehrt“, dann erst: „Taufet im Namen des Vaters und des Sohnes und des Heiligen Geistes“, damit aus dem Unterricht der rechte Glaube erwachse und mit dem Glauben die Vollendung in der Taufe hinzukomme.</p><p>So können denn auch viele andere Häresien, die nur die Namen aussprechen, aber, wie gesagt, nicht die richtige Anschauung noch auch den gesunden Glauben haben, mit dem von ihnen gespendeten Wasser keinen Nutzen schaffen, da es ihnen an der Frömmigkeit gebricht, so daß der, den sie besprengen, eher in Gottlosigkeit beschmutzt als erlöst wird. So trifft auch die Heiden, wenn schon sie den Namen Gottes mit den Lippen aussprechen, der Vorwurf der Gottlosigkeit, weil sie den wirklichen und wahren Gott nicht kennen, den Vater unseres Herrn Jesus Christus. So sind auch die Manichäer und Phrygier und die Schüler des Samosateners, wenn schon sie die Namen aussprechen, nichtsdestoweniger Häretiker. So treiben ferner auch die Gesinnungsgenossen des Arius, mögen sie auch vorlesen, was geschrieben steht, und die Namen aussprechen, mit denen ihr täuschend Spiel, die von ihnen [die Taufe] empfangen, und sind noch gottloser als die übrigen Häresien, die sie nach und nach überholt haben und jetzt mit ihrer frechen Schwatzhaftigkeit auch rechtfertigen. Denn jene lügen irgend etwas zur Wahrheit hinzu und halten an einem Irrtum fest entweder in Bezug auf den Leib des Herrn, indem sie behaupten, er habe nicht aus Maria Fleisch angenommen, oder wenn sie sagen, der Tod sei überhaupt nicht eingetreten und er sei überhaupt nicht Mensch geworden, sondern er sei nur erschienen und habe in Wirklichkeit nicht existiert, und er habe nur scheinbar einen Leib gehabt, ohne ihn wirklich zu haben, und er habe nur scheinbar das Aussehen von einem Menschen gehabt, wie man im Traum solche Gesichte hat. Diese aber freveln offenbar gegen den Vater selbst. Denn obgleich sie in den Schriften seine Gottheit im Sohne wie in einem Bilde bezeugt hören, lästern sie doch und sagen, sie sei ein Geschöpf und tragen überall das auf ihn gemünzte Schlagwort: „Er war nicht“ wie Schmutz in der Tasche mit sich herum und speien es aus wie eine Schlange ihr Gift. Dann, wenn diese ihre Lehre alle zum Erbrechen reizt, sehen sie sich alsbald nach menschlicher Protektion für ihre wankende Häresie um, damit der Einfältigere aus Achtung oder Furcht vor ihr das Verderbliche an ihrer verruchten Lehre nicht wahrnehme. Muß man nun nicht mit denen Mitleid haben, die sich von ihnen betrügen lassen? Oder wäre es nicht angebracht, über sie zu weinen, daß sie um die augenblickliche Vorspiegelung von Vergnügen das preisgeben, was ihnen frommt, und der künftigen Hoffnung verlustig gehen? Da sie nämlich auf den hin, der nicht ist, zu empfangen wähnen, so werden sie nichts empfangen haben. Und da sie sich einem Geschöpfe anschließen, so werden sie vom Geschöpfe keine Hilfe erlangen. Und da sie an einen glauben, der dem Vater der Substanz nach unähnlich und fremd ist, so werden sie mit dem Vater auch keine Verbindung eingehen, da sie seinen eigenen und naturhaften Sohn, der im Vater ist, und in dem auch der Vater ist, wie er selbst gesagt hat, nicht haben. Vielmehr bleiben die Unglücklichen, von diesen verführt, künftig einsam und der Gottheit beraubt. Bei ihrem Tode wird ihnen das Trugbild der irdischen Güter nicht folgen, und auch dann, wenn sie den, den sie verleugnet haben, als Herrn auf dem Throne seines Vaters sitzen sehen, den Richter der Lebendigen und Toten, wird keiner einen von den jetzigen Betrügern zu Hilfe rufen können. Denn sie werden auch über diese das Gericht ergehen und sie bereuen sehen, was sie einst gesündigt und gefrevelt haben.</p><p>Das haben wir vor [der Erklärung] der Stelle aus den Sprichwörtern bisher durchgenommen und haben uns erhoben wider die unvernünftigen Wahngebilde aus dem Grunde ihres Herzens, damit sie einsehen, daß es sich nicht schicke, den Sohn Gottes ein Geschöpf zu nennen, und dann auch die Stelle in den Sprichwörtern richtig lesen lernen, die gleichfalls einen richtigen Sinn hat. Es steht also geschrieben: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“. Da es aber Sprichwörter sind, und dies „sprichwörtlich“ gesagt ist, so darf man den vorliegenden Ausdruck nicht einfachhin so auffassen, sondern man muß nach der Person suchen, und so in [aller] Gottesfurcht den Sinn ihr anpassen. Denn was in den Sprichwörtern ausgesprochen ist, ist nicht offen gesagt, sondern wird verschleiert verkündet, wie der Herr selbst im Evangelium des Johannes gelehrt hat, wenn er sagt: „Dies habe ich in Sprichwörtern zu euch geredet; es kommt aber die Stunde, da ich nicht mehr in Sprichwörtern zu euch reden werde, sondern offen“. Man muß also den Sinn der Stelle enthüllen und nach ihm als einem verborgenen suchen, und man darf die Stelle nicht einfachhin so auffassen, als läge der Sinn erschlossen vor, damit wir nicht mit einer unrichtigen Erklärung von der Wahrheit abirren. Wenn sich nun das Geschriebene auf einen Engel oder sonst irgendein entstandenes Wesen bezieht, so mag der Ausdruck „er schuf mich“ wie bei einem von uns Geschöpfen gebraucht sein. Wenn aber die Weisheit Gottes, in der alle entstandenen Dinge geschaffen worden sind, es ist, die von sich redet, was muß man anders denken, als daß sie mit dem Worte „er schuf“ nichts anderes sagen will als „er zeugte“. Und nicht als ob sie vergessen hätte, daß sie schöpferisch und wirksam sei, oder als ob sie den Unterschied zwischen dem Schöpfer und den Geschöpfen nicht kannte, zählt sie sich mit bei den Geschöpfen, sondern sie deutet einen gewissen Sinn wie in Sprichwörtern nicht offen, sondern verschleiert an. Diesen zu prophezeien, trieb sie die Heiligen an; sie selbst aber deutet bald darauf den Ausdruck „er schuf“ mit einer Parallelstelle in andern Worten, wenn sie sagt: „Die Weisheit hat sich ein Haus gebaut“. Offenbar aber ist das Haus der Weisheit unser Leib, den er annahm, als er Mensch wurde. Und mit Recht sagt Johannes: „Das Wort ist Fleisch geworden“, und durch Salomo spricht die Weisheit mit Bedacht von sich selbst, nicht: „Ich bin ein Geschöpf“, sondern nur: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“, aber nicht: „Er schuf mich, damit ich existiere“, auch nicht, „daß ich Anfang und Ursprung eines Geschöpfes habe“.</p><p>Denn hier hat das Wort durch Salomo nicht die Substanz seiner Gottheit, auch nicht seine ewige und echte Geburt aus dem Vater ausgesprochen, sondern wieder die menschliche Natur und seine für uns getroffene Heilsordnung gemeint. Deshalb sagte er, wie ich vorhin bemerkte, nicht: „Ich bin ein Geschöpf“ oder: „Ich wurde ein Geschöpf“, sondern nur: „Er schuf“. Denn die Geschöpfe, die eine geschaffene Substanz haben, gehören zu den entstandenen Wesen und man sagt von ihnen, sie werden geschaffen und jedenfalls wird das Geschöpf geschaffen. Aber der Ausdruck „er schuf“, nur für sich betrachtet, bezeichnet nicht mit Notwendigkeit die Substanz oder die Geburt, sondern deutet an, daß etwas anderes an dem geschehe, von dem man spricht, und nicht ist das, wovon man sagt, es werde geschaffen, mit Notwendigkeit auch schon der Natur und Substanz nach ein Geschöpf. Diesen Unterschied kennt auch die göttliche Schrift, indem sie von den Geschöpfen sagt: „Es füllte sich die Erde mit Deiner Schöpfung“ und: „Die Schöpfung selbst seufzt und liegt in den Geburtswehen“. In der Offenbarung aber heißt es: „Und es starb der dritte Teil der Geschöpfe in dem Meere, die Leben hatten“. So sagt auch Paulus: „Jedes Geschöpf Gottes ist gut, und nichts ist verwerflich, was mit Danksagung genossen wird“. Und im Buch der Weisheit steht geschrieben: „Du hast mit Deiner Weisheit den Menschen gebildet, damit er über die Geschöpfe herrsche, die durch Dich entstanden sind“. Und daß es von diesen, die Geschöpfe sind, heißt, daß sie geschaffen werden, kann man wieder in folgender Weise vom Herrn hören, welcher sagt: „Er schuf sie im Anfang, als Mann und Weib machte er sie“. Moses aber schreibt in seinem Gesang: „Fraget um die Tage, die vor dir waren, von dem Tage an, an dem Gott den Menschen auf Erden schuf und bis an die höchste Höhe des Himmels“. Und Paulus schreibt im Briefe an die Kolosser: „Welcher ist das Bild Gottes, des Unsichtbaren, der Erstgeborene aller Geschöpfe, weil in ihm alles geschaffen wurde im Himmel und auf Erden, das Sichtbare und das Unsichtbare, seien es Throne, Herrschaften,, Fürstentümer, Mächte. Alles ist durch ihn und auf ihn hin geschaffen, und er ist vor allem“.</p><p>Daß nun die Wesen, die von Natur eine geschaffene Substanz haben, Geschöpfe genannt und auch [wirklich] geschaffen werden, daran zu erinnern mag das Angeführte genügen, während übrigens die Schrift voll solcher Stellen ist. Daß aber der Ausdruck: „Er schuf“ nur für sich genommen nicht notwendig die Substanz und den Ursprung bezeichnet, verkündet David in den Psalmen: „Man schreibe dies dem kommenden Geschlechte, und das Volk, das geschaffen wird, wird den Herrn loben“. Und wieder: „Ein reines Herz erschaffe in mir, o Gott“. Und Paulus sagt im Briefe an die Ephesier: „Indem er das Gesetz der Gebote in Satzungen aufhob, damit er die zwei durch sich selbst zu einem neuen Menschen schaffe“. Und wieder: „Ziehet den neuen Menschen an, der nach Gott geschaffen ist in Gerechtigkeit und Heiligkeit der Wahrheit“. Denn weder sprach David von einem Volke, das der Substanz nach geschaffen wird, noch betete er, ein anderes Herz zu bekommen als das, das er besaß, sondern er wies auf die Erneuerung und Neugestaltung nach Gott hin. Und Paulus sprach nicht von irgend zwei Menschen, die der Substanz nach im Herrn geschaffen werden, ja er riet uns nicht einmal, einen andern Menschen anzuziehen, vielmehr verstand er unter dem „Menschen nach Gott“ das Leben nach der Tugend, unter denen aber, die in Christus geschaffen werden, verstand er die zwei Völker, die in ihm erneuert werden. So ähnlich lautet auch, was bei Jeremias gesagt ist: „Es schuf der Herr ein neues Heil zur Pflanzung und in diesem Heile werden die Menschen wandeln“. Mit diesen Worten deutet er doch nicht irgend eine Substanz eines Geschöpfes an, sondern prophezeit die Erneuerung des Heils unter den Menschen, die uns in Christus geworden ist. Wenn nun zwischen den Geschöpfen und dem bloßen Ausdruck „er schuf“ ein Unterschied besteht, so möget ihr, wenn ihr irgendwo in der göttlichen Schrift den Herrn als Geschöpf bezeichnet findet, es nachweisen und dann streiten. Wenn aber nirgends geschrieben steht, daß er ein Geschöpf sei, er selbst aber in den Sprichwörtern von sich sagt: „Der Herr schuf mich“, so laßt euch durch den bereits genannten Unterschied wie durch die sprichwörtlich gebrauchten Worte eines bessern belehren, und versteht von nun an das Wort „er schuf“ nicht mehr von einem Geschöpf, sondern von der menschlichen Seite des Herrn; denn deren Anteil ist es geschaffen zu werden. Denn tut ihr nicht unrecht, daß ihr den Ausdruck „er schuf“, wenn ihr ihn von David und Paulus vernehmt, nicht von der Substanz und dem Ursprung, sondern von der Erneuerung versteht, aber wenn ihr das „er schuf“ vom Herrn hört, seine Substanz zu den geschaffenen Wesen rechnet? Und wenn ihr wiederum hört: „Die Weisheit hat sich ein Haus gebaut und sieben Säulen aufgerichtet“, faßt ihr „Haus“ in allegorischem Sinne, das Wort „er schuf“ aber so, wie es dasteht, und macht daraus ein Geschöpf. Weder der Umstand, daß er Schöpfer ist, hielt euch davon ab, noch auch gebot der Umstand, daß er einzige eigene Zeugung des Vaters ist, euch ehrfurchtsvolle Scheu, sondern wie wenn ihr euch gegen ihn verschrieben hättet, kämpft ihr einfach darauf los und denkt von ihm noch geringer als von einem Menschen.</p><p>Denn eben diese Stelle zeigt, daß die Behauptung, der Herr sei ein Geschöpf, nur eure Erfindung ist. Denn da der Herr seine Substanz als eingeborene Weisheit und Zeugung des Vaters und als eine andere erkennt denn die gewordenen und natürlichen Geschöpfe, darum sagt er jetzt in menschenfreundlicher Weise: „Der Herr erschuf mich als Anfang seiner Wege“, gerade wie wenn er sagte: „Der Vater hat mir einen Leib bereitet, und schuf mich für die Menschen zum Heil der Menschen“. Wenn wir nämlich von Johannes hören: „Das Wort ist Fleisch geworden“, so denken wir uns das Wort nicht als personifiziertes Fleisch, sondern nehmen an, es habe das Fleisch angezogen und sei Mensch geworden. Und wenn wir hören: „Christus ist für uns zum Fluche geworden“ und: „Den, der von keiner Sünde wußte, machte er für uns zur Sünde“, fassen wir diese Worte nicht so auf, als ob es das ganz, also Fluch und Sünde geworden wäre, sondern nur, daß er den über uns verhängten Fluch auf sich nahm, wie der Apostel gesagt hat: „Er erlöste uns vom Fluche“, und „daß er unsere Sünde trug“ wie Isaias sagt, „und sie“, wie Petrus geschrieben hat, „an seinem Leibe auf das Holz emportrug“. Ebenso wenig dürfen wir, wenn wir in den Sprichwörtern den Ausdruck „er schuf“ vernehmen, uns das Wort seiner Natur nach als reines Geschöpf vorstellen, sondern wir müssen annehmen, daß es den geschaffenen Leib anzog, und daß Gott es für uns schuf, indem er ihm, wie geschrieben steht, um unsertwillen den geschaffenen Leib zubereitete, damit wir in ihm erneuert und vergöttlicht werden könnten. Was hat also euch, ihr Unverständigen, verleitet, den Schöpfer ein Geschöpf zu nennen? Oder woher habt ihr euch diese neue Ansicht geholt, mit der ihr euch brüstet? Denn die Sprichwörter haben den Ausdruck „er schuf“; aber nicht nennen sie den Sohn ein Geschöpf, sondern eine Zeugung und nach der bereits angeführten Unterscheidung, welche die Schrift zwischen „er schuf“ und „Geschöpf“ macht, erkennen sie die naturhafte Eigenheit des Sohnes, daß er nämlich eingeborene Weisheit und Bildner der Geschöpfe ist. Wenn sie aber den Ausdruck „er schuf“ gebrauchen, reden sie nicht von seiner Substanz, sondern deuten an, daß er Anfang vieler Wege werde, so daß das Wort „er schuf“ mit dem Worte „Zeugung“ und der Ausdruck „Anfang der Wege“ damit in Widerspruch steht, daß er eingeborenes Wort ist.</p><p>Denn wenn der Sohn eine Zeugung ist, wie könnt ihr ihn ein Geschöpf nennen? Denn niemand sagt von dem, was er schafft, er zeuge es, und niemand nennt seine Zeugungen Geschöpfe. Und wie wird er wiederum, wenn er eingeboren ist, Anfang der Wege? Denn wenn er als Anfang aller Dinge geschaffen wurde, dann kann er unmöglich mehr allein sein, da er ja die bei sich hat, die nach ihm entstanden sind. Denn auch Ruben, die Erstgeburt unter den Kindern, war nicht eingeboren, sondern war nur der Zeit nach der erste, der Natur und Verwandtschaft nach aber war er einer von denen, die nach ihm kamen. Wenn also auch das Wort Anfang der Wege ist, so ist es wohl auch selbst wie die Wege, und die Wege sind so, wie auch das Wort ist, mag es auch der Zeit nach vor ihnen geschaffen werden. Und auch der Anfang einer Stadt ist so, wie auch die übrigen Teile der Stadt sind, und die Teile selbst stehen mit dem Anfang in Verbindung, wie viele Glieder eines Leibes, und machen so eine ganze und einzige Stadt aus, nicht aber gehört der eine Teil von ihr zu den geschaffenen Dingen und der andere zu den entstehenden, so daß er dem ersteren Teile untergeordnet wäre, sondern die ganze Stadt ist in gleicher Weise Gegenstand der Sorge für den Erbauer und hat durch ihn Bestand. Wenn nun auch der Herr in dieser Weise als Anfang aller Dinge geschaffen wird, so muß er zugleich mit allen Dingen eine Schöpfung ausmachen und darf sich weder von den übrigen unterscheiden, wenn er auch der Anfang aller Dinge ist, noch Herr über die übrigen Teile der Schöpfung sein, wenn er auch der Zeit nach älter ist, — denn auch er hat im Verein mit allen nur e i n schöpferisches Wort und einen Herrn. Doch wie kann er überhaupt, wenn er nach eurer Ansicht ein Geschöpf ist, allein und zuerst geschaffen werden, so daß er auch der Anfang aller Dinge ist, wenn doch aus dem früher Gesagten erhellt, daß unter den Geschöpfen keines für sich allein existiert und zuerst entstanden ist, sondern seinen Ursprung mit allen gemeinsam hat, wenn es auch an Glanz die andern übertrifft? Denn nicht erschien von den einzelnen Gestirnen oder von den großen Lichtern das eine zuerst und das andere hernach, sondern an einem Tage und mit demselben Befehl wurden alle ins Dasein gerufen. So ging auch die Schöpfung der vierfüßigen Tiere, der Vögel, Fische [und Haustiere] und Pflanzen vor sich, und so ist auch das nach dem Bilde [Gottes] geschaffene Menschengeschlecht geworden. Denn wenn auch Adam allein aus Erde gebildet wurde, so waren in ihm die Keime des ganzen nachfolgenden Geschlechtes enthalten.</p><p>Aus der sichtbaren Schöpfung der Welt aber nehmen wir das Unsichtbare in ihr wahr, indem wir es aus den gemachten Dingen begreifen. Und auch da sehen wir nicht jedes einzelne Ding für sich entstehen, nicht das eine zuerst und ein anderes hernach, sondern alles ist gattungsweise zugleich entstanden. Denn nicht jedes einzelne Ding zählt der Apostel auf, so daß er gesagt hätte: „Sei es ein Engel oder Thron oder eine Herrschaft oder Macht“, sondern er führt alle zusammen der Reihe nach auf: „Seien es Engel oder Erzengel oder Herrschaften“; das ist also der Ursprung der Geschöpfe. Wenn also, wie gesagt, das Wort ein Geschöpf wäre, so hätte es nicht vor ihnen entstehen dürfen, sondern mit den andern Mächten entstehen müssen, wenn es auch an Herrlichkeit die andern noch so sehr überragt. Denn auch bei den andern Wesen findet man &lt; s 188&gt;diese Erscheinung, daß sie zugleich entstanden sind, und es kein erstes noch ein zweites gibt und daß sie doch voneinander an Glanz verschieden sind, und die einen zur Rechten, andere ringsum und wieder andere zur Linken sind, und alle miteinander lobsingen und dem Herrn dienend zur Seite stehen. Wenn also das Wort ein Geschöpf ist, ist es wohl nicht das erste von den übrigen Wesen noch auch deren Anfang. Wenn es aber vor allen existiert, wie es nun wirklich der Fall ist, und es allein das erste Wesen und Sohn ist, dann ist es seiner Substanz nach auch nicht Anfang aller Dinge; denn bei allen Dingen wird auch der Anfang von allen mitgezählt. Wenn es aber nicht der Anfang ist, dann ist es auch kein Geschöpf, vielmehr ist es doch wohl ganz klar, daß es der Substanz und Natur nach sich von den Geschöpfen unterscheidet und anders ist als sie, daß es ein Gleichnis und Bild des Einen und wahren Gottes und selbst auch einzig ist. Darum nun setzen es die Schriften auch den Geschöpfen nicht gleich, vielmehr läßt David die, welche so etwas auch nur zu denken wagen, an mit den Worten: „Wer ist Dir ähnlich unter den Geschöpfen, o Herr?“ und: „Wer wird dem Herrn gleichgesetzt werden unter den Gottessöhnen?“ Und Baruch schreibt: „Dieser ist unser Gott, es wird kein anderer neben ihm beachtet werden“. Denn Er schafft, dieses aber wird geschaffen, Er ist des Vaters wesenseigenes Wort und wesenseigene Weisheit, die entstandenen Dinge aber, die zuvor nicht waren, sind durch das Wort selbst gemacht worden.</p><p>Euer allbekanntes Schlagwort also: „Der Sohn ist ein Geschöpf“, ist nicht wahr, sondern bloß euer Hirngespinst, und auch von Salomo müßt ihr die Anklage hören, daß ihr oft auf ihn gelogen habt. Denn er hat ihn nicht ein Geschöpf genannt, sondern Zeugung und Weisheit Gottes, wenn er sagt: „Gott hat durch seine Weisheit die Erde gegründet“ und: „Die Weisheit hat sich ein Haus gebaut“. Und auch die Stelle, die wir eben untersuchen, widerlegt eure Gottlosigkeit. Denn es steht geschrieben: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“. Wenn er also vor allen Dingen ist, aber sagt: „Er schuf mich“, nicht damit ich die Werke vollbringe, sondern „für die Werke“, so ist entweder das „er schuf“ später als Er, oder er wird selbst später als die Werke erscheinen, wenn er sie in dem Augenblick, da er geschaffen wird, als schon vor ihm bestehend vorfindet, für die er ja auch ins Dasein tritt. Wenn aber dies der Fall ist, wie ist er dann noch vor allen Dingen? Und wie ist ferner alles durch ihn geworden und hat in ihm Bestand? Denn siehe, nach eurer Ansicht bestanden auch vor ihm die Werke, für die er geschaffen und abgesandt wird. Doch dem ist nicht so, ferne sei es! Falsch ist die Ansicht der Häretiker. Denn nicht ein Geschöpf, sondern Schöpfer ist das Wort Gottes. Damals aber sagt es sprichwörtlich: „Er schuf mich“, als er das geschaffene Fleisch anzog. Und auch das kann man wieder aus der Stelle selbst entnehmen. Denn da es Sohn ist und Gott zum Vater hat — seine eigene Zeugung ist es ja —, so nennt es gleichwohl jetzt den Vater einen Herrn, nicht weil es Knecht war, sondern weil es die Knechtsgestalt angenommen hatte. Denn es gehörte sich, daß es als das Wort aus dem Vater Gott seinen Vater nannte — denn das kommt dem Sohne dem Vater gegenüber zu —, und nachdem es gekommen war, das Werk zu vollenden und Knechtsgestalt angenommen hatte, den Vater seinen Herrn nannte. Auf diesen Unterschied hat es selbst mit feiner Unterscheidung in den Evangelien aufmerksam gemacht, wenn es sagt: „Ich preise Dich, Vater“, und dann: „Herr des Himmels und der Erde“. Es nennt also Gott seinen Vater, aber Herrn der Geschöpfe, so daß daraus klar erhellt, daß es damals den Vater Herrn genannt hat, als es das Geschaffene anzog. Denn auch im Gebete Davids bringt der Heilige Geist denselben Unterschied zum Ausdruck, wenn er in den Psalmen sagt: „Gib deine Herrschaft deinem Knaben und errette den Sohn deiner Magd“. Denn ein anderer ist der naturhafte und wahre Sohn Gottes, und andere sind die Kinder der Magd, die ja die Natur der gewordenen Dinge hat. Deshalb hat auch der erstere als Sohn die väterliche Macht, die letzteren aber sind rettungsbedürftig.</p><p>Wenn sie aber ein albernes Geschwätz verführen wollen, weil er Knabe genannt wurde, so sollen sie wissen, daß auch Isaak Knabe Abrahams genannt und der Sohn der Sunamitin Knäblein genannt wurde. Natürlich nennt er, uns Knechten gleichgeworden, seinen Vater gleichfalls einen Herrn wie wir. Und dies hat er in seiner Menschenliebe getan, damit auch wir, die wir von Natur Knechte sind und den Geist des Sohnes empfangen haben, Mut gewinnen, den der Gnade nach Vater zu nennen, den wir von Natur zu unserem Herrn haben. Aber wie wir unsere natürliche Knechtschaft nicht in Abrede stellen, wenn wir den Herrn Vater nennen — denn seine Werke sind wir und „er hat uns gemacht und nicht wir“ —, so sollen sie, wenn der Sohn die Knechtsgestalt annimmt und sagt: „Der Herr schuf mich als Anfang seiner Wege“, die Ewigkeit seiner Gottheit nicht bestreiten und leugnen, daß er im Anfang das Wort war und alles durch dasselbe entstanden ist und alles in ihm geschaffen wurde. Die Stelle in den Sprichwörtern aber redet, wie gesagt, nicht von der Substanz, sondern von der menschlichen Seite des Wortes. Wenn es nämlich sagt, es sei für die Werke geschaffen, so will es offenbar nicht seine Substanz, sondern nur seine für die Werke getroffene Heilsordnung bezeichnen, was aber später liegt als die Existenz. Denn was entsteht und gemacht wird, ist in erster Linie gemacht worden, damit es bestehe und existiere, und erst in zweiter Linie, damit es tue, was ihm das Wort befiehlt, wie man dies allenthalben beobachten kann. So wurde Adam geschaffen, nicht damit er arbeite, sondern damit er zunächst Mensch sei. Denn erst später erhielt er den Befehl zu arbeiten. Und Noe wurde nicht wegen der Arche geschaffen, sondern damit er zunächst existiere und Mensch sei; denn erst hernach erhielt er den Auftrag, die Arche zu bauen. Und bei einer speziellen Untersuchung wird man dieser Tatsache überall begegnen. So ist auch der große Moses zuerst Mensch geworden, und erst dann ist er mit der Führung des Volkes betraut worden. Es läßt also auch hier die Sache sich so denken. Denn du siehst, daß das Wort nicht geschaffen wird, um zu existieren, sondern: „Im Anfang war das Wort“, erst hernach wird es für die Werke und deren Anordnung gesendet. Denn auch bevor die Werke entstanden, war der Sohn immer. Und es war nicht erst nötig, daß er geschaffen werde. Als aber die Werke geschaffen waren und es hernach zu deren Wiederaufrichtung einer Veranstaltung bedurfte, da gab sich dann auch das Wort hin, herabzusteigen und den Werken gleich zu werden, was es uns mit dem Ausdruck „er schuf“ geoffenbart hat. Und durch den Propheten Isaias will es etwas Ähnliches zu verstehen geben, wenn es wiederum sagt: „Und nun spricht der Herr, der mich vom Mutterleib an zu seinem Knechte gebildet hat, um Jakob und Israel zu ihm zu versammeln; ich werde versammelt und verherrlicht werden vor dem Herrn“.</p><p>Siehe, auch hier wird er gebildet, nicht um zu sein, sondern um die Stämme zu versammeln, welche auch bestanden, bevor dieser gebildet wurde. Denn wie es dort heißt „er schuf“, so hier „er bildete“, und wie dort „für die Werke“, so hier „um zu sammeln“, so daß es überall deutlich hervortritt, daß „er schuf“ und „er bildete“ erst gesagt wurde, als das Wort bereits existierte. Denn wie schon vor seiner Bildung die Stämme, derentwegen es auch hier gebildet wurde, existierten, so bestanden denn offenbar auch die Werke, für die es geschaffen wurde. Und als im Anfang das Wort war, da waren, wie gesagt, die Werke noch nicht. Als aber die Werke entstanden waren und das Bedürfnis es erheischte, da ist das „er schuf“ gesagt worden. Wenn ein Sohn, falls Sklaven infolge ihrer Unachtsamkeit verloren gegangen wären und sich in des Feindes Hand befänden, im Drange der Not von seinem Vater abgesandt würde, um ihrer wieder habhaft zu werden und sie zurückzuführen, und er auf seiner Reise dieselbe Kleidung anzöge wie jene, damit die, welche sie gefangen halten, ihn nicht als Herrn erkennen und die Flucht ergreifen, und es ihm nicht unmöglich würde, zu denen zu gelangen, die von jenen unter der Erde verborgen gehalten werden, dann würde ein solcher auf die Frage nach dem Warum doch wohl antworten: Der Vater hat mich so gestaltet und für seine Werke ausgerüstet. Und wenn er so redet, bezeichnet er sich weder als einen Sklaven, noch als eines von den Werken, noch auch redet er vom Ursprung seiner Geburt, sondern nur von der ihm später übertragenen Sorge für die Werke. Ebenso würde auch der Herr, der unser Fleisch angezogen hat und im Äußern wie ein Mensch befunden wurde, auf die Frage seitens derer, die ihn in diesem Zustande sehen und sich darob verwundern, zur Antwort geben: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“ und: „Er gestaltete mich, um Israel zu versammeln“. Dies sprach wiederum auch der Geist prophetisch in den Psalmen: „Du hast ihn über die Hände Deiner Werke gesetzt“, was auch der Herr selbst von sich sagt mit den Worten: „Ich bin zum Könige von ihm über Sion gesetzt, seinen heiligen Berg“. Wie er aber, als er nach seiner leiblichen Seite über Sion leuchtete, nicht den Anfang seiner Existenz und seiner Herrschaft nahm, sondern als Gottes Wort und ewiger König sich herabließ, in menschlicher Weise seine Herrschaft auch über Sion leuchten zu lassen, damit er sie und uns von der unter ihnen herrschenden Sünde befreie und unter seine väterliche Herrschaft bringe, so wird er, wenn er über die Werke gesetzt wird, nicht über die gesetzt, die noch nicht sind, sondern über die, welche bereits existieren und besserungsbedürftig sind.</p><p>Die Ausdrücke „er schuf“ und „er bildete“ und „er setzte ein“ haben also denselben Sinn und weisen nicht auf einen Anfang seiner Existenz noch auch darauf hin, daß seine Substanz geschaffen sei, sondern auf die Erneuerung, die nach seiner Huld an uns bewirkt wurde. Wenn er also auch so sich ausdrückte, so lehrte er gleichwohl, daß er auch vordem bestand, da er sagte: „Ehe Abraham ward, bin ich“ und: „Da er den Himmel bereitete, war ich dabei“ und: „Ich war bei ihm ordnend“. Wie er aber war, ehe Abraham wurde, Israel aber nach Abraham entstanden ist, und er offenbar früher bestand und erst später gebildet wurde, und die Bildung nicht den Anfang der Existenz, sondern die Menschwerdung bedeutet, in der er auch die Stämme Israels zusammenführt, so ist er also, da er immer mit dem Vater besteht, selbst Bildner der Schöpfung, und offenbar sind die Werke später als er, und das „er schuf“ gibt nicht den Anfang seiner Existenz, sondern die an den Werken geschehene Heilsordnung, die er im Fleische getroffen hat, zu erkennen. Denn da er von den Werken verschieden oder vielmehr deren Schöpfer ist, so war es in der Ordnung, daß er auch ihre Erneuerung übernahm, um, unsertwegen erschaffen, alles in sich neu zu schaffen. Denn da er sagte: „Er schuf“, fügte er auch alsbald den Grund bei, wenn er „die Werke“ nannte, damit der Ausdruck „für die Werke geschaffen werden“, kund tue, daß er zu ihrer Erneuerung Mensch wurde. Und es ist dies die Art der göttlichen Schrift. Wenn sie nämlich von dem fleischlichen Ursprung des Wortes redet, fügt sie auch den Grund bei, weshalb er Mensch geworden ist. Wenn aber das Wort selbst von seiner Gottheit spricht, oder wenn seine Diener sie verkünden, dann wird alles mit einfachen Worten in absolutem Sinne und ohne Beifügung eines Grundes ausgesprochen. Es ist nämlich der Abglanz des Vaters. Wie aber der Vater nicht aus irgendeinem Grunde ist, so darf man bei seinem Abglanz nicht nach einem Grunde forschen. „Im Anfang also war das Wort und das Wort war bei Gott und Gott war das Wort“. So steht geschrieben, und das Warum steht nicht dabei. Wo es aber heißt: „Das Wort ist Fleisch geworden“, da gibt er auch den Grund an, weshalb es Fleisch geworden ist, indem er sagt: „Und er hat unter uns gewohnt“. Und wo der Apostel sagt: „Der, als er in der Gestalt Gottes war“, gab er wieder keinen Grund an, dagegen bei den Worten: „Er nahm Knechtsgestalt an“. Da fügt er nämlich bei: „Er erniedrigte sich bis zum Tode, ja bis zum Tode des Kreuzes“. Denn deshalb ist es auch Fleisch geworden und hat Knechtsgestalt angenommen.</p><p>Der Herr seinerseits hat auch vieles in Gleichnissen geredet; wo er aber von sich sprach, da hat er absolut gesprochen: „Ich im Vater und der Vater in mir“, und: „Ich und der Vater sind eins“, und: „Wer mich gesehen hat, hat den Vater gesehen“, und: „Ich bin das Licht der Welt“, und: „Ich bin die Wahrheit“. Und er gibt bei keiner Stelle einen Grund an, noch auch das Warum, damit es nicht den Anschein gewinne, als wäre er später denn das, um dessentwillen er entstanden ist. Denn der Grund muß ihm vorausgehen, ohne den auch Er nicht geworden wäre. So z. B. hatte Paulus, „auserlesener Apostel für das Evangelium, welches der Herr durch die Propheten vorherverkündigt hatte“, das Evangelium vor sich, dessen Diener er auch geworden ist, und Johannes, der berufen war, dem Herrn die Wege zu bereiten, hatte den Herrn vor sich. Der Herr hatte aber keinen Grund vor sich, um Wort zu sein, wenn nicht den, daß er Zeugung und eingeborene Weisheit des Vaters ist, und darum gibt er, da er Mensch wird, auch den Grund an, weshalb er das Fleisch tragen will. Seiner Menschwerdung geht nämlich das Bedürfnis der Menschen voran, ohne das er nicht Fleisch angenommen hätte. Welches aber das Bedürfnis war, um dessentwillen er Mensch geworden ist, hat der Herr selbst mit folgenden Worten angegeben: „Ich bin vom Himmel herabgekommen, nicht um meinen Willen zu tun, sondern den Willen dessen, der mich gesandt hat. Das ist aber der Wille dessen, der mich gesandt hat, daß ich von allem, was er mir gegeben hat, nichts verliere, sondern auferwecke am jüngsten Tage. Denn es ist der Wille meines Vaters, daß jeder, der den Sohn sieht und an ihn glaubt, das ewige Leben habe und ich ihn auf erwecke am jüngsten Tage“. Und wiederum: „Ich bin als das Licht in die Welt gekommen, damit keiner, der an mich glaubt, in der Finsternis bleibe“. Und wiederum sagt er: „Ich bin dazu geboren und dazu in die Welt gekommen, daß ich der Wahrheit Zeugnis gebe“. Johannes aber hat geschrieben: „Deshalb erschien der Sohn Gottes, um die Werke des Teufels zu zerstören“.</p><p>Um also Zeugnis zu geben und für uns den Tod auf sich zu nehmen, die Menschen wieder zum Leben zu erwecken und die Werke des Teufels zu zerstören, ist der Heiland gekommen, und das ist die Ursache seiner Erscheinung im Fleische, Denn sonst hätte es keine Auferstehung gegeben, wenn nicht der Tod eingetreten wäre. Wie aber wäre der Tod eingetreten, wenn er nicht einen sterblichen Leib gehabt hätte? Das hat auch der Apostel von ihm erfahren und gesagt: „Da nun die Kinder Fleisch und Blut gemeinsam haben, so hat auch er in ähnlicher Weise daran teilgenommen, damit er durch den Tod dem die Macht nähme, der des Todes Gewalt hatte, das ist der Teufel, und diejenigen erlöste, welche in der Furcht des Todes durch das ganze Leben der Knechtschaft unterworfen waren“. Und: „Denn wie durch einen Menschen der Tod, so auch durch einen Menschen die Auferstehung von den Toten“. Und wieder: „Denn was dem Gesetze unmöglich war, weil es durch das Fleisch geschwächt ward, das hat Gott [bewirkt], indem er seinen Sohn in der Gestalt des sündigen Fleisches sandte und wegen der Sünde die Sünde im Fleische verdammte, damit die Rechtsforderung des Gesetzes in uns erfüllt werde, indem wir nicht nach dem Fleische wandeln, sondern nach dem Geiste“. Johannes aber sagt: „Denn Gott hat seinen Sohn nicht in die Welt gesandt, damit er die Welt richte, sondern damit die Welt durch ihn gerettet werde“. Und wieder sagte der Heiland selbst: „Ich bin zu dem Gerichte in diese Welt gekommen, damit die sehen, welche nicht sehen, und die Sehenden blind werden“. Er ist also nicht seinetwegen, sondern um unseres Heils willen gekommen und, damit der Tod vernichtet, die Sünde gerichtet würde, die Blinden wieder sähen und alle von den Toten auferständen. Wenn er aber nicht seinetwegen gekommen ist, sondern unsertwegen, so wird er füglich nicht seinetwegen, sondern unsertwegen geschaffen. Wird er aber nicht seinetwegen, sondern unsertwegen geschaffen, so ist er doch nicht an sich ein Geschöpf, sondern nur, weil er unser Fleisch anzog, sagte er dies. Und daß die Schriften wirklich diesen Sinn haben, kann man von dem Apostel erfahren. Er sagt nämlich in seinem Briefe an die Ephesier: „Der die in der Mitte stehende Scheidewand niedergerissen hat, die Feindschaft in seinem Fleisch, und das Gesetz der Gebote in Satzungen aufhob, damit er die zwei in sich zu einem neuen Menschen schaffe und Frieden mache“. Wenn aber in ihm die zwei geschaffen werden und sie in seinem Leibe sind, so erscheint er also, indem er die zwei in sich trägt, natürlich selbst als geschaffen. Denn er vereinigte die Geschaffenen in sich und war selbst in ihnen wie jene. Wenn aber die zwei in dieser Weise in ihm geschaffen wurden, so sagt er doch wohl passend: „Der Herr schuf mich“. Denn wie man von ihm, da er unsere Schwächen auf sich nahm, sagt, er sei schwach, obschon er selbst nicht schwach ist — er ist ja die Kraft Gottes —, und wie er Sünde und Fluch für uns geworden ist, obgleich er selbst nicht gesündigt hat, sondern weil er selbst unsere Sünden und unsern Fluch getragen hat, so mag er, wenn er uns in sich schafft, sagen: „Er schuf mich für seine Werke“, obschon er selbst kein Geschöpf ist.</p><p>Denn wenn er nach ihrer Ansicht, wonach also die Substanz des Wortes geschaffen wäre, als Geschöpf sagt: „Der Herr schuf mich“, dann wurde er nicht unsertwegen geschaffen. Wenn er aber nicht unsertwegen geschaffen wurde, dann wurden wir nicht in ihm geschaffen. Wenn wir aber nicht in ihm geschaffen wurden, dann hatten wir ihn nicht in uns, sondern wir hatten ihn von außen, wenn wir ja von ihm den Unterricht wie von einem Lehrer empfangen haben. Wenn es aber mit uns so steht, dann herrscht nichtsdestoweniger die Sünde wieder über das Fleisch, verbleibt in ihm und ließ sich aus ihm nicht vertreiben. Doch der Apostel entgegnet diesen, wenn er kurz zuvor sagt: „Sein Werk sind wir, geschaffen in Christus Jesus“, Wenn wir aber in Christus geschaffen sind, dann ist füglich nicht Er der Geschaffene, sondern wir sind es, die in ihm geschaffen werden, und unsertwegen steht der Ausdruck da: „Er schuf“. Denn wegen unseres Bedürfnisses ließ sich das Wort, wenngleich Schöpfer, die Bezeichnung für die geschaffenen Wesen gefallen, und sie gilt nicht dem Wort als solchem, sondern auf uns, die wir in ihm geschaffen werden, bezieht sich der Ausdruck „er schuf“. Wie auch das Wort immer ist, da der Vater immer existiert, und als immerwährendes sagt: „Ich war es, woran er sich erfreute, und Tag um Tag war ich in Entzücken vor seinem Angesicht“, und: „Ich im Vater und der Vater in mir“, ebenso drückt es sich, weil unseres Bedürfnisses wegen Mensch geworden, folgerichtig auch bezüglich dessen, was uns eigen ist, aus wie wir: „Der Herr schuf mich“, damit durch seine Einwohnung im Fleische die Sünde aus dem Fleische völlig verdrängt würde und wir den Geist frei bekämen. Was anders hätte es, Mensch geworden, sagen sollen? Im Anfang war ich Mensch? Doch dies hätte ja auf ihn nicht gepaßt, noch auch wäre es wahr gewesen. Wie aber solche Rede sich nicht geziemt hätte, so traut und eigen hört es sich bei einem Menschen an: „Er schuf“ und: „Er machte ihn“. Deshalb ist ja auch der Grund für das „er schuf“ beigefügt, nämlich das Bedürfnis der Werke; wo aber die Ursache beigefügt ist, da hellt jedenfalls die Ursache selbst die Stelle deutlich auf. Denn auch hier gibt er in dem „er schuf“ die Werke als den Grund an. Wenn er aber die Geburt aus dem Vater absolut aussprach, fügte er alsbald hinzu: „Vor allen Hügeln zeugte er mich“. Er fügte damit nicht das Warum hinzu, wie bei dem Ausdruck „er schuf mich“ in den Worten „für die Werke“, sondern er sagte absolut: „Er zeugte mich“, wie: „Im Anfang war das Wort“. Wenn auch die Werke nicht geschaffen waren, so war doch das Wort Gottes und Gott war das Wort. Was aber seine Menschwerdung betrifft, so wäre diese nicht eingetreten, wenn nicht das Bedürfnis der Menschen sie veranlaßt hätte. Es ist also der Sohn kein Geschöpf; denn wäre er ein Geschöpf, dann hätte er nicht gesagt: „Er zeugt mich“. Die Geschöpfe sind ja äußerliche Werke des Schaffenden. Die Zeugung aber stammt nicht wie ein Werk von außen, sondern vom Vater als etwas seiner Substanz eigenes. Deshalb sind die ersteren Geschöpfe, das Wort Gottes aber ist eingeborener Sohn.</p><p>Es hat ja auch Moses bei der Schöpfung nicht gesagt: „Im Anfang zeugte“, noch auch: „Im Anfang war“, sondern: „Im Anfang machte Gott den Himmel und die Erde“. Auch David sang nicht: „Deine Hände“ zeugten mich, sondern „machten und bildeten mich“. Und von den Geschöpfen gebraucht er überall den Ausdruck: „Er machte“, bei dem Sohne aber machte er es umgekehrt. Denn er hat nicht gesagt: „Ich machte“, sondern: „Ich zeugte“ und: „Er zeugte mich“ und: „Es entquoll meinem Herzen ein gutes Wort“. Und bei der Schöpfung heißt es: „Im Anfang hat er gemacht“, bei dem Sohne aber: „Im Anfang war das Wort“. Der Unterschied aber liegt darin, daß die Geschöpfe im Anfang gemacht wurden und einen zeitlich geschiedenen Anfang ihres Seins haben. Deshalb ist auch, wenn man von ihnen sagt: „Im Anfang machte“ dies soviel, als sagte man von ihnen wieder: „Von Anfang machte“, wie der Herr, der weiß, was er machte, damals lehrte, als er die Pharisäer zurechtwies mit den Worten: „Der sie von Anfang schuf, hat sie als Mann und Weib gemacht“. Denn aus einem anfänglichen Nichtsein heraus sind einmal die gewordenen Dinge entstanden und erschaffen worden. Das gab auch der Heilige Geist zu verstehen, wenn er in den Psalmen sagt: „Und Du, o Herr, hast im Anfang die Erde gegründet“, und wiederum: „Gedenke Deiner Versammlung, die Du von Anfang her besessen hast“. Offenbar aber hat das, was im Anfang entsteht, einen Anfang der Erschaffung und hat Gott von irgendeinem Anfang an die Versammlung in Besitz genommen. Daß aber der Ausdruck: „Im Anfang machte“, eben weil es heißt „machte“, soviel besagt als „begann zu machen“, das gibt Moses selbst kund, wenn er nach der fertigen Erschaffung aller Dinge sagt: „Und Gott segnete den siebten Tag und heiligte ihn. weil er an ihm von all seinen Werken ausruhte, die Gott zu schaffen angefangen hatte“. Es fingen also die Geschöpfe an zu werden; das Wort Gottes aber, da es keinen Anfang des Seins hat, fing selbstverständlich nicht an, zu sein noch auch zu werden, sondern war immer. Und die Werke haben einen Anfang, indem sie gemacht werden und der Anfang liegt den entstehenden Dingen voraus. Das Wort aber, das nicht zu den entstehenden Dingen gehört, wird vielmehr selbst der Schöpfer derer, die einen Anfang haben. Und das Sein der entstandenen Dinge wird nach dem Entstehen bemessen, und von irgendeinem Anfang an beginnt Gott diese durch sein Wort zu machen, damit man erkenne, daß diese vor ihrer Entstehung nicht existieren. Das Wort aber hat die Existenz nicht in einem andern Anfang, sondern im Vater, der auch nach ihnen anfangslos ist, damit es auch anfangslos im Vater existiere, und zwar als seine Zeugung, nicht als sein Geschöpf.</p><p>So kennt also die göttliche Schrift den Unterschied von Zeugung und Geschöpfen und erweist die Zeugung als Sohn, der nicht mit irgendeinem Anfang begann, sondern ewig ist, die Schöpfung aber bezeichnet sie als ein Werk, das außerhalb von seinem Schöpfer existiert und zu werden begonnen hatte. Denn so kannte auch Johannes, wo er vom Sohne handelte, den Unterschied der Worte und sagte nicht: „Im Anfang ist geworden oder gemacht worden“, sondern: „Im Anfang war das Wort“, damit mit dem „war“ zugleich die Zeugung wahrgenommen würde, und man nicht an eine Unterbrechung dächte, sondern damit man glaube, daß der Sohn immer und ewig existiert. Wenn aber dies so bewiesen ist, wie konntet ihr Arianer dann ohne Verständnis der Stellen im Deuteronomium auch hierin wieder gegen den Herrn zu freveln euch erkühnen und sagen, er sei ein gemachtes Wesen oder Geschöpf oder eine Zeugung? Denn ihr behauptet ja, daß Zeugung und gemachtes Wesen dasselbe bedeute. Gleichwohl wird man euch auch hieraus wieder als unwissende und gottlose Leute erkennen. Die erste Stelle nämlich lautet also: „Hat nicht dieser dein Vater selbst dich erworben, dich gemacht und dich geschaffen?“ Und kurz darauf sagt er in demselben Gesänge: „Gott, der dich erzeugt hat, hast du verlassen und Gott, der dich ernährt, hast du vergessen“. Der Sinn ist recht merkwürdig. Denn er hat nicht zuerst gesagt „gezeugt“, damit der Ausdruck nicht gleichbedeutend wäre mit „gemacht“ und diese nicht einen Vorwand fänden zu behaupten: Moses hat gesagt, daß Gott im Anfang gesprochen habe: „Lasset uns den Menschen machen“; später aber sagte er selbst: „Gott, der dich erzeugt hat, hast du verlassen“, weil die Worte gleichbedeutend sind; denn Zeugung und gemachtes Wesen bedeuten dasselbe. Vielmehr hat er nach dem „erworben“ und „gemacht“ nachher noch „gezeugt“ hinzugefügt, damit die Rede auch mit einer Erklärung dastünde. Denn mit dem Ausdruck „gemacht“ bezeichnet er in Wahrheit das naturhafte Wesen der Menschen, nämlich, daß sie Geschöpfe und gemachte Wesen sind, mit „gezeugt“ offenbart er die Liebe Gottes gegen die Menschen nach ihrer Erschaffung. Und da sie sich gegen diese undankbar erwiesen haben, so schilt sie Moses zunächst mit den Worten: „So vergeltet ihr dem Herrn?“. Dann fährt er fort: „Hat nicht dieser dein Vater selbst dich erworben und dich gemacht und dich geschaffen?“ Und dann sagt er wiederum: „Sie opferten den Dämonen und nicht Gott, Göttern, die sie nicht kannten. Neu und jüngst kamen sie, die ihre Väter nicht verehrten. Gott, der dich erzeugt hat, hast du verlassen“.</p><p>Denn Gott schuf sie nicht bloß als Menschen, sondern er nannte sie auch Söhne, da er sie gezeugt hat. Denn das “er zeugte” ist auch hier das Erkennungszeichen für “Sohn”, wie er auch durch den Propheten spricht: “Söhne habe ich erzeugt und erhöht”. Und überhaupt bezeichnet die Schrift, wenn sie von “Sohn” redet, ihn nicht mit dem Ausdrucke “er schuf”, sondern durchweg mit dem Ausdrucke “er zeugte”. Das scheint auch Johannes wiederum zu sagen: “Er gab ihnen Macht, Kinder”Gottes zu werden, denen, die an seinen Namen glauben, die nicht aus dem Geblüte und nicht aus dem Willen des Fleisches noch aus dem Willen des Mannes, sondern aus Gott geboren sind“. Gar wohl ist auch hier genaues Auseinanderhalten am Platz. Denn des Ausdrucks”werden" bedient er sich, weil sie nicht von Natur, sondern durch Annahme Söhne genannt werden, des Wortes “gezeugt” hat er sich aber bedient, weil sie überhaupt auch den Namen Sohn erhalten haben. Aber das Volk hat, wie der Prophet sagt, seinen Wohltäter verschmäht. Das aber ist die Menschenfreundlichkeit Gottes, daß er denen, deren Schöpfer er ist, in Gnaden später auch Vater wird. Und das wird er, wenn, wie der Apostel gesagt hat, die erschaffenen Menschen den Geist des Sohnes in ihre Herzen aufnehmen, der da ruft: “Abba, Vater!” Dies sind aber alle, die das Wort aufgenommen und von ihm die Macht erlangt haben, Kinder Gottes zu werden. Denn als geschaffene Naturen können sie wohl auf keine andere Weise Söhne werden als dadurch, daß sie den Geist des naturhaften und wahren Sohnes aufnehmen. Eben zu diesem Zweck ist das Wort Fleisch geworden, um die Menschen für die Aufnahme der Gottheit zu befähigen. Diese Auffassung kann man auch beim Propheten Malachias finden, der sagt: “Hat nicht Ein Gott euch erschaffen, habt ihr nicht alle Einen Vater”. Denn er hat hier wieder an erster Stelle das “er hat erschaffen” und an zweiter “Vater” gesetzt, um gleichfalls zu zeigen, daß wir zu Anfang der Natur nach Geschöpfe sind, und Gott unser Schöpfer durch das Wort ist, daß wir aber später zu Söhnen gemacht werden, und nunmehr der Schöpfer-Gott auch unser Vater wird. Das “Vater” gehört also zum “Sohne”, nicht das “Geschöpf” und das “Sohn” gehört zum “Vater”. Daraus geht also hervor, daß wir nicht von Natur Söhne sind, sondern der Sohn in uns, und daß wiederum Gott von Natur nicht unser Vater ist, sondern Vater des Wortes in uns, in dem und durch das wir rufen; “Abba, Vater”. Wie aber dem so ist, so nennt der Vater auch seinerseits diejenigen Söhne, in denen er seinen Sohn sieht, und sagt wiederum: “Ich zeugte”. Denn “zeugen” läßt auf einen Sohn, “machen” aber auf die Werke schließen. Darum also werden wir nicht zuerst gezeugt, sondern gemacht. Denn es steht geschrieben: “Lasset uns den Menschen machen!”. Später aber, wenn wir die Gnade des Geistes empfangen haben, dann heißt es von uns auch, daß wir gezeugt werden. Gewiß hat auch der große Moses in seinem Gesänge in richtigem Sinne zuerst gesagt: “Er hat erworben” und dann erst: “Er hat gezeugt”, damit sie, wenn sie den Ausdruck “er hat gezeugt” vernähmen, ihre ursprüngliche Natur nicht vergessen, vielmehr einsehen sollten, daß sie von Anfang an Geschöpfe sind, wenn es aber später in Gnaden von ihnen wie von Söhnen heißt, sie werden gezeugt, die Menschen nichtsdestoweniger wieder der Natur nach Geschöpfe sind.</p><p>Daß aber Geschöpf und Zeugung nicht dasselbe ist, sondern daß sie der Natur wie der Wortbedeutung nach voneinander verschieden sind, das lehrt der Herr selbst wieder in denselben Sprichwörtern. Denn den Worten: “Der Herr schuf mich als Anfang seiner Wege”, fügte er bei: “Vor allen Hügeln aber zeugt er mich”. Wenn also das Wort von Natur und seiner Substanz nach ein Geschöpf wäre, und kein Unterschied zwischen Zeugung und Geschöpf bestände, dann hätte er nicht hinzugefügt: “Er zeugt mich”, vielmehr hätte er sich mit den Worten “er schuf” begnügt, da dies soviel besagte wie “er zeugte”. Nun aber fügte er den Worten: “Er schuf mich als Anfang seiner Wege für seine Werke” nicht einfach hinzu: “Er zeugt mich”, sondern verbindet damit die Konjunktion “aber”, wie wenn er damit den Ausdruck “er schuf” bekräftigen wollte, und sagt: “Vor allen Hügeln aber zeugt er mich”. Denn das “er zeugt mich” macht erst in Verbindung mit “er schuf” den Einen Gedanken fertig und zeigt, daß “er schuf” aus irgendeinem Grunde gesagt ist, und daß “er zeugt mich” dem “er schuf” vorausliegt. Denn wie wenn er umgekehrt gesagt hätte: “Der Herr zeugt mich” und dann hinzugesetzt hätte: “Vor allen Hügeln aber schuf er mich” dem “er zeugte” das “er schuf” vorausgehen mußte, so zeigt er, wenn er zuerst das “er schuf” ausgesprochen und dann beigefügt hat: “Vor allem aber zeugt er mich”, daß “er zeugte” dem “er schuf” vorausliegen muß. Denn auch mit dem Worte: “Vor allem zeugt er mich” deutet er an, daß er von “allem” verschieden sei, da auch schon aus dem früher Gesagten sich als Wahrheit ergeben hat, daß von den Geschöpfen keines vor den andern entstanden sei, vielmehr alle entstandenen Wesen zusammen auf ein und denselben Befehl ins Dasein traten. Daher steht also auch bei dem “er schuf” nicht dasselbe wie bei dem “er zeugt”, sondern bei dem “er schuf” steht “als Anfang seiner Wege, bei dem”er zeugt mich" sagt er aber nicht: “Er zeugt mich als Anfang”, sondern: “Er zeugt mich vor allem”. Der aber vor allem war, ist nicht der Anfang von allem, sondern ist ein anderer als das All. Ist er aber ein anderer als das All, worin auch der Anfang von allem ausgesprochen liegt, so ist er offenbar ein anderer als die Geschöpfe. Daraus ergibt sich deutlich, daß das Wort, weil verschieden vom All und vor ihm bestehend, später mit der Menschwerdung als Anfang seiner Wege für seine Werke geschaffen wird, damit, wie der Apostel sagte, der, welcher “Anfang” und “Erstgeborener von den Toten” ist, in allem den Vorrang habe.</p><p>Da nun ein solcher Unterschied zwischen „er schuf“ und „er zeugt mich“ und dem „Anfang der Wege“ und dem „von allem“ besteht, so wird Gott, der Schöpfer der Menschen, wie gesagt, durch sein in ihnen wohnendes Wort später auch Vater. Beim Worte aber ist es gerade umgekehrt. Gott, von Natur sein Vater, wird hernach auch sein Schöpfer und Bildner, wenn das Wort das geschaffene und gemachte Fleisch anzieht und Mensch wird. Denn wie die Menschen, indem sie den Geist des Sohnes empfangen, durch ihn zu Kindern werden, so sagt man vom Worte Gottes, es sei damals, als es das Fleisch der Menschen annahm, geschaffen und gemacht worden. Sind wir nun der Natur nach Söhne, dann ist offenbar auch jenes von Natur ein geschaffenes und gemachtes Wesen. Wenn wir aber durch Annahme und in Gnaden Söhne werden, dann hat auch offenbar das Wort, nachdem es in seiner Huld gegen uns Mensch geworden ist, gesagt: „Der Herr schuf mich“. Als es dann das geschaffene Fleisch angezogen und so nach der leiblichen Seite uns ähnlich geworden war, wurde es darum mit Recht unser Bruder und Erstgeborener genannt. Denn wenn es auch nach uns um unsertwillen Mensch und wegen der Ähnlichkeit des Leibes unser Bruder geworden ist, so wird er doch auch in diesem [Leib] unser Erstgeborener genannt und ist es. Denn da alle Menschen in der Übertretung des Adam verloren gingen, so wurde dessen Fleisch vor den übrigen gerettet und befreit, da es der Leib des Wortes selbst wurde, und von nun an werden wir, die wir ihm einverleibt sind, in diesem gerettet. Denn in ihm wurde der Herr auch unser Führer in das Himmelreich und zu seinem Vater, indem er sagt: „Ich bin der Weg und die Türe und durch mich müssen alle eingehen“. Daher wird er auch wieder Erstgeborener von den Toten genannt, nicht weil er vor uns gestorben ist — denn wir waren zuerst gestorben —, sondern weil er den Tod für uns auf sich nahm und ihn vernichtete, stand er zuerst als Mensch auf, indem er für uns seinen Leib auferweckte. Denn erst jetzt, da er auferstanden ist, werden auch wir fürderhin von ihm und seinetwegen von den Toten auf erweckt.</p><p>Wird er aber auch „Erstgeborener der Schöpfung“ genannt, so wird er nicht Erstgeborener genannt, als ob er den Geschöpfen gleich und nur der Zeit nach vor ihnen wäre. Wie wäre dies auch möglich, wo er doch der Eingeborene ist? Vielmehr heißt man ihn so wegen der Herabkunft des Wortes zu den Geschöpfen, in der es auch Bruder vieler geworden ist. Denn der Eingeborene ist eingeboren, weil es andere nicht gibt, die Brüder wären. Der Erstgeborene aber wird wegen seiner übrigen Brüder Erstgeborener genannt. Darum also ist nirgends in den Schriften gesagt: „Erstgeborener Gottes“, auch nicht „Geschöpf Gottes“, sondern die Bezeichnungen: „Eingeborener“ und „Sohn“ und „Wort“ und „Weisheit“ stehen in Beziehung zum Vater und geben seine Eigenheit an. Denn „wir haben seine Herrlichkeit gesehen, die Herrlichkeit als des Eingeborenen vom Vater“. Und „Gott sandte seinen Sohn, den Eingeborenen“, und: „Dein Wort, o Herr, bleibt in Ewigkeit“, und: „Im Anfang war das Wort und das Wort war bei Gott“, und: „Christus, Gottes Kraft und Gottes Weisheit“, und: „Dieser ist mein geliebter Sohn“, und: „Du bist Christus, der Sohn des lebendigen Gottes“. Die Bezeichnung „Erstgeborener“ aber geht auf seine Herabkunft zur Schöpfung; denn ihr Erstgeborener wurde er genannt. Das „er schuf“ schließt in sich den Gnadenerweis gegen die Werke; denn für sie wird er auch geschaffen. Wenn er nun Eingeborener ist, wie er es nun wirklich ist, so möge man die Bezeichnung „Erstgeborener“ [entsprechend] erklären, Ist er aber Erstgeborener, so sei er nicht Eingeborener. Denn es kann nicht derselbe Eingeborener und Erstgeborener sein, außer in verschiedener Beziehung, nämlich so, daß er Eingeborener wegen der Geburt aus dem Vater ist, wie wir gesagt haben, Erstgeborener aber wegen seiner Herabkunft zur Schöpfung und weil er viele zu seinen Brüdern gemacht hat. Gewiß wird man von diesen beiden einander entgegengesetzten Ausdrücken die Benennung mit Recht Eingeborener beim Worte für angezeigter finden, weil es ein zweites Wort und eine zweite Weisheit nicht gibt, sondern dieses allein wahrer Sohn des Vaters ist. Denn, wie wir vorhin gesagt haben, ist nicht mit Angabe irgendeines Grundes, sondern schlechthin von ihm gesagt: „Der eingeborene Sohn, der im Schoße des Vaters ist“. Bei dem Ausdrucke „Erstgeborener“ aber ist die Ursache, nämlich die Schöpfung, beigefügt, die Paulus mit den Worten angegeben hat: „Weil in ihm alles erschaffen wurde“. Wenn aber alle Geschöpfe in ihm erschaffen wurden, dann ist er von den Geschöpfen verschieden, und er ist nicht ein Geschöpf, sondern Schöpfer der Geschöpfe.</p><p>Nicht wegen seiner Abstammung vom Vater wurde er also Erstgeborener genannt, sondern weil in ihm die Schöpfung entstanden ist. Und wie vor der Schöpfung der Sohn selbst war, durch den auch die Schöpfung entstanden ist, so war er auch, ehe er Erstgeborener der ganzen Schöpfung genannt wurde, nichtsdestoweniger das Wort bei Gott, und Gott war das Wort. Doch auch das wollen die Gottlosen nicht einsehen, gehen vielmehr umher und sagen: „Wenn er Erstgeborener der ganzen Schöpfung ist, dann gehört er selbst auch zur Schöpfung“. O die Unverständigen! Wenn er überhaupt Erstgeborener der ganzen Schöpfung ist, dann ist er ja doch von der Schöpfung verschieden. Denn er hat nicht gesagt: Er ist Erstgeborener „der übrigen Geschöpfe“, damit er nicht für eines von den Geschöpfen gehalten werde. Vielmehr steht geschrieben „der ganzen Schöpfung“, weil gezeigt sein will, daß er von der Schöpfung verschieden ist. So wird Ruben nicht Erstgeborener aller Kinder Jakobs genannt, sondern Jakobs selbst und seiner Brüder, damit man ihn nicht von den Kindern Jakobs verschieden finde. Doch auch vom Herrn selbst hat der Apostel nicht gesagt: „Damit er Erstgeborener von allen werde“, damit man nicht glaube, er trage einen andern Leib als wir, sondern „unter vielen Brüdern“ — wegen der Ähnlichkeit des Fleisches. Wenn also auch das Wort eines von den Geschöpfen wäre, so hätte die Schrift auch von ihm gesagt: „Er ist Erstgeborener der übrigen Geschöpfe“. Da nun aber die Heiligen sagen: „Er ist Erstgeborener der ganzen Schöpfung“, so ist das ein augenscheinlicher Beweis dafür, daß der Sohn Gottes von der ganzen Schöpfung verschieden und nicht ein Geschöpf ist. Denn wenn er ein Geschöpf ist, dann wird er auch sein eigener Erstgeborener sein. Wie kann er nun, ihr Arianer, früher und später als er selbst sein? Ferner, wenn er ein Geschöpf ist, und die ganze Schöpfung durch ihn geworden ist, und in ihm ihren Bestand hat, wie kann er dann die Schöpfung schaffen und einer von denen sein, die in ihm ihren Bestand haben? Wenn aber ein solcher Einfall ungereimt erscheint, dann wird ihnen von der Wahrheit bewiesen, daß er „Erstgeborener unter vielen Brüdern“ wegen der fleischlichen Verwandtschaft genannt wurde, „Erstgeborener von den Toten“ aber, weil aus ihm und nach ihm die Auferstehung von den Toten vor sich geht, und „Erstgeborener der ganzen Schöpfung“ wegen der Menschenfreundlichkeit des Vaters, derzufolge nicht nur alles in seinem Worte Bestand hat, sondern auch die Schöpfung selbst, von der der Apostel gesagt hat: „In Erwartung der Offenbarung der Söhne Gottes wird sie einmal aus der Knechtschaft des Verderbens zur Freiheit der Herrlichkeit der Kinder Gottes befreit worden“. Und da sie so befreit ist, so wird ihr Erstgeborener und zugleich der Erstgeborene aller, die zu Kindern gemacht wurden, der Herr sein, damit, wenn er der erste genannt wird, alles, was nach ihm kommt, fortdauere, indem es mit dem Worte wie mit einem gewissen Anfang in Verbindung steht.</p><p>Ich glaube, daß jetzt auch die Gottlosen selbst beschämt diese ihre Ansicht aufgeben werden. Denn wenn es sich nicht so verhält, wie wir gesagt haben, sondern wenn sie ihn als ein wesenhaftes Geschöpf unter Geschöpfen zum Erstgeborenen der ganzen Schöpfung haben wollen, dann mögen sie beachten, daß sie ihn auch als einen Bruder der unvernünftigen und unbeseelten Wesen und als ihnen ähnlich annehmen müssen. Denn auch diese sind Teile der ganzen Schöpfung. Es muß aber der Erstgeborene nur der Zeit nach der erste, der Abstammung und Ähnlichkeit nach aber derselbe sein wie alle. Überbieten sie nicht mit solchen Reden jegliche Gottlosigkeit? Oder wer wird sie ertragen können, wenn sie so reden? Muß man sie nicht schon hassen, wenn sie Solches auch nur denken? Denn es ist allen offenkundig, daß er nicht seinetwegen, als wäre er ein Geschöpf, noch auch weil er der Substanz nach in irgendeiner Verwandtschaft zur Schöpfung steht, ihr Erstgeborener genannt wurde, sondern weil das Wort, das schon im Anfang die Geschöpfe machte, sich zu geschaffenen Dingen herabgelassen hat, damit sie ins Dasein treten könnten. Denn sie hätten seine reine Natur, den väterlichen Glanz nicht ertragen können, wenn er nicht in väterlicher Liebe herabgestiegen wäre, sich ihrer angenommen und in seiner Macht sie ins Dasein gesetzt hätte. Und dann wurde er zweitens wieder so genannt, weil dank der Herabkunft des Wortes auch die Schöpfung selbst durch das Wort zum Sohne gemacht wird, damit es, wie gesagt, in jeder Beziehung auch ihr Erstgeborener werde, sowohl indem es schafft, als auch indem es zugunsten aller in die Welt selbst eingeführt wird. Denn so steht geschrieben: „Wenn er den Erstgeborenen in die Welt einführt, sagt er: Und es sollen ihn anbeten alle Engel Gottes“. Hören sollen es die Christusfeinde und sich zerfleischen. Sein Eintritt in die Welt bewirkte, daß er auch Erstgeborener aller genannt wurde, so daß also der Sohn Eingeborener des Vaters ist, weil er allein aus ihm stammt und Erstgeborener der Schöpfung, weil alle zu Söhnen gemacht wurden. Wie er aber Erstgeborener unter den Brüdern ist und als „Erstlingsfrucht der Entschlafenen“ von den Toten auferstand, so wird er, da er ja in allem der erste sein mußte, deshalb auch als Anfang der Wege geschaffen, damit wir auf diesem wandeln und durch ihn eingehen, der da sagt: „Ich bin der Weg und die Türe“, und indem wir teilnehmen an der Kenntnis vom Vater, auch wir zu hören bekommen: „Selig die Unbefleckten auf dem Wege“ und: „Selig, die reinen Herzens sind, denn sie werden Gott anschauen“.</p><p>Nachdem die Wahrheit gezeigt hat, daß das Wort der Natur nach kein Geschöpf ist, so müssen wir nun im folgenden sagen, warum es „Anfang der Wege“ genannt worden ist? Denn da der erste Weg durch Adam verloren ging, und wir das Paradies mit dem Tode vertauschten und hören mußten: „Du bist Erde und wirst zur Erde zurückkehren“, deshalb zieht das menschenfreundliche Wort Gottes nach dem Willen des Vaters das geschaffene Fleisch an, um dieses Fleisch, das der erste Mensch durch seine Übertretung ertötet hat, selbst im Blute seines eigenen Leibes wieder zu beleben und „uns“, wie der Apostel gesagt hat, „einen neuen und lebendigen Weg durch den Vorhang, d. h. durch sein Fleisch zu bereiten“. Dies drückt er auch an einer andern Stelle aus mit den Worten: „Wenn deshalb ein neues Geschöpf in Christus geworden ist, so hat das alte aufgehört; siehe, alles ist neu geworden“. Wenn aber eine neue Schöpfung entstanden ist, dann muß es irgendeinen Ersten für diese Schöpfung geben. Ein bloßer Mensch nun und ein rein irdisches Wesen, so wie es wir infolge der Übertretung geworden sind, konnte es nicht sein. Denn auch bei der ersten Schöpfung sind die Menschen untreu geworden, und die erste Schöpfung ging durch sie verloren. Es bedurfte eines andern, der auch die erste erneuerte und die neugeschaffene erhielt. Daher wird nicht irgendein anderer, sondern der Herr, ein Anfang der neuen Schöpfung, aus Liebe zu den Menschen als Weg geschaffen, und er sagt mit Recht: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“, damit der Mensch nicht mehr nach jener ersten [Schöpfung] sein Leben gestalte, wir vielmehr, da ein Anfang einer neuen Schöpfung besteht, und wir in Christus einen Anfang ihrer Wege haben, fortan ihm nachfolgen, der da spricht: „Ich bin der Weg“. Denn dies lehrte auch der selige Apostel in seinem Briefe an die Kolosser, wo er sagt: „Er ist das Haupt des Leibes der Kirche, er, der da ist der Anfang, der Erstgeborene von den Toten, damit er in allem den Vorrang habe“.</p><p>Denn wenn er, wie gesagt, wegen der Auferstehung von den Toten selbst Anfang genannt wird, damals aber die Auferstehung eingetreten ist, als er sich mit unserem Fleische für uns dem Tode preisgegeben hat, so bezeichnet doch wohl offenbar auch sein Wort: „Er schuf mich als Anfang seiner Wege“ nicht seine Substanz, sondern seine leibliche Erscheinung. Denn dem Leibe war der Tod eigen. Und wie dem Leibe der Tod eigen ist, so paßt wohl auch auf die leibliche Erscheinung das Wort: „Der Herr schuf mich als Anfang seiner Wege“. Denn da der Heiland auf diese Weise dem Fleische nach geschaffen und der Anfang von dem, was erneuert werden sollte, geworden war und unsere Erstlingsfrucht immer hatte in dem menschlichen Fleische, das er annahm, so wird folglich nach ihm auch das kommende Volk geschaffen, wie David sagt: „Man schreibe dies dem kommenden Geschlechte, und das Volk, das geschaffen werden soll, wird den Herrn loben“. Und wiederum im 21. Psalm: „Es wird dem Herrn das kommende Geschlecht verkündigt werden, und sie werden seine Gerechtigkeit dem Volke verkünden, das geboren werden wird, das der Herr gemacht“. Denn wir werden nicht mehr hören müssen: „An dem Tag, da ihr davon esset, werdet ihr des Todes sterben“, sondern: „Wo ich bin, da werdet auch ihr sein“, so daß wir sagen können: „Sein Werk sind wir, geschaffen für gute Werke“. Da ferner das Werk Gottes, d. h. der Mensch vollkommen geschaffen ist, aber mit der Übertretung bedürftig geworden und an der Sünde gestorben ist, das Werk Gottes aber nicht unvollkommen bleiben durfte, weshalb auch alle Heiligen im 137. Psalm baten: „Herr, Du wirst statt meiner vergelten, Herr, die Werke Deiner Hände verschmähe nicht“, so legte eben darum das vollkommene Wort Gottes sich den unvollkommenen Leib an, und es heißt von ihm, es werde für die Werke geschaffen, damit es an unserer Stelle die Schuld zahle und, was dem Menschen fehlte, durch sich ersetze und bewirke. Verloren aber hatte er die Unsterblichkeit und den Weg ins Paradies. Das meint der Heiland mit dem Worte: „Ich habe Dich verherrlicht auf Erden; ich habe vollbracht das Werk, das Du mir gegeben hast, damit ich es tue“. Und wieder: „Die Werke, die mir der Vater aufgetragen hat, damit ich sie vollbringe, eben diese Werke, die ich tue, geben Zeugnis von mir“. Die Werke aber, von denen er hier sagt, der Vater habe sie ihm zur Vollführung gegeben, diese sind es, für die er geschaffen wird, wie er in den Sprichwörtern sagt: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“. Denn das Wort: „Der Vater gab mir die Werke“ besagt soviel wie das andere: „Der Herr schuf mich für die Werke“.</p><p>Wann nun übernahm er die Werke, um sie zu vollenden, ihr Gottesfeinde? Denn daraus wird man auch den Sinn des Ausdrucks „er schuf“ erkennen. Sagt ihr nun „im Anfang“, als er sie aus dem Nichtseienden ins Dasein setzte, so ist das eine Lüge; denn die waren noch nicht entstanden. Er spricht aber offenbar, wie wenn er die bereits bestehenden Werke empfinge. Es geht aber auch nicht an, die Zeit anzugeben, die der Menschwerdung des Wortes vorangeht, damit nicht seine Ankunft alsdann überflüssig erscheine; denn um ihretwillen erfolgte ja die Ankunft, Es bleibt also nur mehr die Behauptung übrig, daß er damals die Werke empfing, als er Mensch geworden ist. Denn damals vollendete er sie auch, da er unsere Wunden heilte und uns die Auferstehung von den Toten gewährte. Wenn aber damals dem Worte die Werke gegeben wurden, als es Fleisch geworden ist, dann wird es offenbar auch damals für die Werke geschaffen, als es Mensch geworden ist. Nicht also deutet der Ausdruck „er schuf“ auf seine Substanz hin, wie schon oft gesagt worden ist, sondern auf seinen leiblichen Ursprung. Denn weil die Werke infolge der Übertretung unvollkommen und verstümmelt worden sind, heißt es jetzt von ihm, es werde dem Leibe nach geschaffen, damit es diese Werke vollkommen mache und unversehrt wiederherstelle, und die Kirche dem Vater so darstelle, wie der Apostel gesagt hat, nämlich „ohne Makel, ohne Runzel oder etwas dergleichen, sondern daß sie heilig und unbefleckt sei“. Es ist also in ihm das Menschengeschlecht vervollkommnet worden und wurde wieder so hergestellt, wie es auch im Anfang gewesen war oder vielmehr mit noch größerer Gnade. Denn wenn wir von den Toten auferstanden sind, fürchten wir den Tod nicht mehr, sondern wir werden in Christus immer im Himmel herrschen. Das aber ist geschehen, weil das eigene und aus dem Vater stammende Wort Gottes selbst das Fleisch anzog und Mensch geworden ist. Denn wenn es als Geschöpf Mensch geworden wäre, dann wäre der Mensch nichtsdestoweniger geblieben wie er war, nämlich ohne Verbindung mit Gott. Denn wie hätte es als Geschöpf durch ein Geschöpf sich mit dem Schöpfer verbinden können? Oder was für eine Hilfe hätten ähnliche Wesen von ihresgleichen erwarten können, wenn doch auch sie derselben Hilfe bedurften? Wie aber vermochte das Wort, wenn es ein Geschöpf war, das Urteil Gottes aufzuheben und die Sünden nachzulassen, da doch geschrieben steht bei den Propheten, daß dies Sache Gottes ist? „Denn welcher Gott ist wie Du, der Du die Sünden wegnimmst und über die Missetaten hinweggehst“. Denn Gott sprach: „Du bist Erde und wirst zur Erde zurückkehren“. Die Menschen aber sind als Sterbliche entstanden. Wie wäre da möglich gewesen, daß die Sünde von den entstandenen Wesen wäre hinweggenommen worden? Vielmehr hat sie der Herr selbst weggenommen, wie er gesagt hat: „Wenn auch der Sohn nicht befreit“. Und es hat der Sohn, der euch frei gemacht hat, in Wahrheit gezeigt, daß er kein Geschöpf noch auch eines von den gewordenen Wesen ist, sondern das eigene Wort und Bild der Substanz des Vaters, der auch im Anfang das Urteil gesprochen hat und allein die Sünden nachläßt. Denn da im Worte ausgesprochen ist: „Du bist Erde und wirst zur Erde zurückkehren“, so ist folgerichtig durch das Wort selbst und in ihm die Freiheit und die Aufhebung des Verdammungsurteils eingetreten.</p><p>Doch es konnte, wenden sie ein, auch wenn der Heiland ein Geschöpf war, Gott mit einem bloßen Worte den Fluch aufheben. Das nämliche könnten sie selbst aus einem andern Munde vernehmen: Es hätte Gott, ohne überhaupt zu erscheinen, nur ein Wort reden und den Fluch aufheben können. Doch man muß auf das acht haben, was den Menschen frommt, und nicht in allem daran denken, was Gott möglich ist. Denn es hätte Gott auch vor der Arche des Noe die Menschen umkommen lassen können, die damals fehl gegangen waren. Doch er hatte es hernach getan. Er hätte auch ohne Moses bloß ein Wort sprechen und das Volk aus Ägypten führen können; doch der Nutzen erheischte Moses als Werkzeug. Gott hätte auch ohne die Richter das Volk retten können, aber es war für das Volk ersprießlich, daß ihm rechtzeitig ein Richter erweckt wurde. Es hätte der Heiland auch im Anfang zu uns kommen oder nach seiner Ankunft dem Pilatus nicht ausgeliefert werden können, aber er kam in der Fülle der Zeiten, und als man ihn fragte, da sagte er: “Ich bin es”. Denn was er tut, das ist auch den Menschen ersprießlich" und es ziemte sich nicht, daß es anders geschah. Was aber nützt und sich gehört, dafür trägt er auch Fürsorge. Er kam also, nicht um sich bedienen zu lassen, sondern um zu dienen und unser Heil zu wirken. Gewiß hätte er auch vom Himmel her das Gesetz verkünden können; aber er sah, daß es für die Menschen von Nutzen sei, es vom Sinai zu verkünden und er hat das getan, damit Moses hinaufsteigen könnte, wie auch jene, wenn sie das Wort aus der Nähe hörten, eher zum Glauben kommen könnten. Außerdem kann man auch das Wohlberechnete des Geschehnisses aus folgendem ersehen: Wenn er, weil möglich, ein Wort gesprochen hätte und dadurch der Fluch aufgehoben worden wäre, dann wäre die Macht des Befehlenden offenbar geworden, der Mensch jedoch wäre so geworden, wie auch Adam vor der Übertretung war, indem er die Gnade von außen empfangen und sie nicht in Verbindung mit dem Leib erlangt hätte — denn in einem solchen Zustand war er auch damals in das Paradies versetzt worden —, oder er wäre vielleicht minderwertig geworden, weil er zu sündigen gelernt hatte. Wenn er nun, in einem solchen Zustand geschaffen, sich wieder von der Schlange hätte überreden lassen, dann hätte Gott wieder einen Befehl geben und den Fluch aufheben müssen, und so bestände die Notwendigkeit ins Unendliche und die Menschen wären trotzdem Diener und Sklaven der Sünde geblieben. Denn wenn sie immer gesündigt hätten, hätten sie immer den Verzeihenden nötig gehabt und wären nie befreit worden, da sie an sich nur Fleisch sind und wegen der Ohnmacht des Fleisches immer dem Gesetze unterliegen.</p><p>Ferner aber blieb der Mensch, wenn der Sohn ein Geschöpf war, trotzdem sterblich, weil ohne Verbindung mit Gott. Denn ein Geschöpf konnte die Geschöpfe nicht mit Gott verbinden, da es selbst nach dem Verbindenden sich umsehen mußte, und es kann wohl auch nicht ein Teil der Schöpfung das Heil werden für die Schöpfung, da auch dieser der Rettung bedurfte. Um nun dies zu verhüten, sendet er seinen Sohn, und dieser wird Menschensohn, indem er das geschaffene Fleisch annimmt, damit er, da ja alle dem Tode unterworfen sind, verschieden von allen, selbst für alle seinen eigenen Leib dem Tode preisgebe und nunmehr, da alle durch ihn gestorben sind, der Urteilsspruch erfüllt würde — denn alle sind in Christus gestorben —, und alle von nun an durch ihn von der Sünde und ihrem Fluche frei würden und in Wahrheit nach ihrer Auferstehung von den Toten immer blieben, auferstanden von den Toten und mit der Unsterblichkeit und Unverweslichkeit bekleidet. Denn da das Wort das Fleisch angezogen hat, wie schon oft gezeigt wurde, wurde jeder Biß der Schlange an ihm gänzlich ausgetilgt. Wenn irgendein Übel aus den fleischlichen Bewegungen hervorging, wurde es ausgerottet und zugleich damit der auf die Sünde folgende Tod beseitigt, wie der Herr selbst sagt: „Es kommt der Fürst dieser Welt und findet nichts an mir“. Und: „Dazu nämlich ist er erschienen“, wie Johannes geschrieben hat, „um die Werke des Teufels zu zerstören“. Da aber diese am Fleische zerstört wurden, sind wir so infolge der Verwandtschaft des Fleisches befreit worden und wurden nunmehr auch mit dem Worte in Verbindung gesetzt. In der Verbindung mit Gott aber bleiben wir nicht mehr auf der Erde zurück, sondern wir werden, wie er selbst gesagt hat, da sein, wo er ist. Und wir werden von nun an auch die Schlange nicht mehr fürchten — denn sie ist selbst vom Erlöser vernichtet worden, von dem sie im Fleisch verfolgt wurde und die Worte vernehmen mußte: „Weiche von mir, Satan!“ und so ist sie, aus dem Paradies vertrieben, in das ewige Feuer geworfen worden —, noch auch werden wir uns vor einem verführerischen Weibe in acht zu nehmen haben. „Denn in der Auferstehung werden sie weder heiraten noch verheiratet werden, sondern sie sind wie Engel“, und „in Christus Jesus wird eine neue Schöpfung sein“, und: „es wird weder Mann noch Weib, sondern alles in Christus sein“. Wo aber Christus ist, was für eine Furcht oder Gefahr kann da noch herrschen?</p><p>Das wäre aber nicht geschehen, wenn das Wort ein Geschöpf wäre. Denn mit einem Geschöpf wäre der Teufel, selbst ein Geschöpf, immer im Kampfe gestanden, und der Mensch, der in der Mitte steht, wäre immer von der Todesfurcht befangen, weil er niemand hätte, in dem und durch den er mit Gott verbunden jeglicher Furcht losgeworden wäre. Doch es zeigt die Wahrheit, daß das Wort nicht zu den geschaffenen Dingen gehört, daß es vielmehr deren Schöpfer ist. Denn so hat es auch den entstandenen und menschlichen Leib angenommen, um als Schöpfer diesen zu erneuern, in sich zu vergöttlichen und so uns alle nach seiner Ähnlichkeit in das Reich der Himmel einzuführen. Doch in Verbindung mit einem Geschöpf wäre der Mensch wieder nicht vergöttlicht worden, wenn der Sohn nicht wahrer Gott wäre. Auch wäre der Mensch nicht an die Seite des Vaters getreten, wenn der, welcher den Leib anzog, nicht sein natürliches und wahres Wort wäre. Und wie wir von der Sünde und dem Fluche nicht befreit worden wären, wenn das Fleisch, welches das Wort anzog, nicht von Natur das eines Menschen wäre — denn mit dem, was uns fremd ist, haben wir nichts gemein —, so wäre der Mensch nicht vergöttlicht worden, wenn das fleischgewordene Wort nicht seiner Natur nach aus dem Vater stammte und sein wahres und eigenes Wort wäre. Deshalb hat eine solche Verbindung stattgefunden, damit es mit der göttlichen Natur den natürlichen Menschen in Verbindung brächte und dessen Heil und Vergöttlichung gesichert wäre. Die also leugnen, daß der Sohn der Natur nach vom Vater stammt und ihm wesenseigen ist, sollen auch bestreiten, daß er wahres menschliches Fleisch aus der immerwährenden Jungfrau angenommen habe. Denn das Wort hätte uns Menschen keinen weiteren Gewinn gebracht, wenn es nicht wahrer und naturhafter Sohn des Vaters wäre, noch auch das Fleisch, das er anzog, ein wirkliches wäre. Doch er nahm ja wahres Fleisch an, mag auch Valentin rasen — denn das Wort war von Natur und in Wahrheit Gott, mögen auch die Ariomaniten rasen —, und in diesem Fleische ist er uns der Anfang der neuen Schöpfung geworden, indem er als Mensch für uns erschaffen wurde und uns, wie gesagt, jenen Weg neu schuf.</p><p>Das Wort ist also weder ein Geschöpf noch ein Werk. Denn Geschöpf und gemachtes Wesen und Werk besagen dasselbe. Und wenn es ein Geschöpf oder ein gemachtes Wesen wäre, dann wäre es wohl auch ein Werk. Darum also hat er auch nicht gesagt: „Er schuf mich als ein Werk“ noch auch: „Er machte [mich] mit den Werken“, damit man nicht meine, er sei seiner Natur und Substanz nach ein Geschöpf, noch auch hat er gesagt: „Er schuf mich, damit ich Werke verrichte“, damit man nicht wieder der schlimmen Ansicht der Gottlosen folgend zum Glauben komme, er sei unsertwegen ein Werkzeug geworden. Und er verkündete auch nicht: „Er schuf mich vor den Werken“, um nicht glauben zu machen, als besage Zeugung und „er schuf“ dasselbe, wenn er wie eine Zeugung vor allem, so auch vor den Werken geschaffen ist. Er hat vielmehr mit genauer Unterscheidung gesagt: „für die Werke“. Damit wollte er sagen: Der Vater hat mich zu Fleisch gemacht, daß ich Mensch werde, so daß auch hieraus wieder erhellt, daß er nicht ein Werk, sondern eine Zeugung ist. Denn wie der, der ein Haus betritt, nicht ein Teil des Hauses, sondern vom Haus verschieden ist, so ist wohl auch der, welcher für die Werke geschaffen wird, der Natur nach von den Werken verschieden. Denn wenn nach eurer Ansicht das Wort Gottes ein Werk ist, ihr Arianer, in welcher Hand und Weisheit ist es dann seinerseits entstanden? Alles Gewordene ist ja in der Hand und Weisheit geworden, wie Gott selbst sagt: „Meine Hand hat das alles gemacht“. Und David singt: „Und Du hast im Anfang, o Herr, die Erde gegründet und die Werke Deiner Hände sind die Himmel“. Und wiederum im 142. Psalm: „Ich war eingedenk der alten Tage und ich überdachte alle Deine Werke, und ich sann über die Werke Deiner Hände nach“. Wenn also die Geschöpfe in der Hand Gottes geschaffen wurden, und ferner geschrieben steht: „Alles ist durch das Wort entstanden, und ohne es ist nichts entstanden“, und wieder: „Ein Herr Jesus durch den alles“ und: „In ihm ist alles entstanden“, dann ist wohl offenbar der Sohn kein Werk, sondern er ist selbst die Hand und Weisheit Gottes. Dies erkannten auch die Märtyrer in Babylon, Ananias, Azarias, Misael, und widerlegen die Gottlosigkeit der Arianer. Denn wenn sie riefen: „Alle Werke des Herrn, lobet den Herrn“, zählten sie die Wesen im Himmel und auf Erden und die ganze Schöpfung als Werke auf, den Sohn aber nannten sie nicht. Denn sie haben nicht gerufen: „Lobe, Wort“, und „preise, Weisheit!“ so daß sie zu erkennen geben, daß alle übrigen Wesen preisen und Werke sind, das Wort aber kein Werk ist noch auch zu den Lobsingenden gehört, sondern mit dem Vater gepriesen, angebetet und als Gott anerkannt wird, da es sein Wort, seine Weisheit und Bildner der Werke ist. Das hat auch der Geist mit feinster Unterscheidung gesagt: „Aufrichtig ist das Wort des Herrn und alle seine Werke sind treu“, wie er auch an einer andern Stelle sagt: „Wie groß sind Deine Werke, o Herr, alles hast Du in Weisheit gemacht“.</p><p>Wenn aber das Wort ein Werk wäre, so wäre es jedenfalls selbst auch in Weisheit geworden, und die Schrift hätte es weder von den Werken gesondert noch die einen Werke genannt, dieses aber als eigenes Wort und eigene Weisheit Gottes verkündigt. Nun aber die Schrift es von den Werken absondert, gibt sie zu erkennen, daß die Weisheit Bildner der Werke und nicht ein Werk ist. Dieselbe Unterscheidung hat auch Paulus im Briefe an die Hebräer gemacht: “Denn lebendig ist das Wort Gottes und wirksam und schärfer als jedes zweischneidige Schwert und dringt durch bis zur Teilung von Seele und Geist, Mark und Bein, und ist ein Richter der Gedanken und Gesinnungen des Herzens und kein Geschöpf ist vor ihm verborgen, sondern alles liegt offen und enthüllt vor den Augen dessen, [bei] dem wir Rechenschaft zu geben haben”. Sieh also, die entstandenen Wesen nannte er Kreatur, den Sohn aber weiß er als Wort Gottes, der von den Geschöpfen verschieden ist. Und wenn er wieder sagt: “Alles liegt offen und enthüllt vor den Augen dessen, [bei] dem wir Rechenschaft abzulegen haben, so deutet er an, daß er verschieden ist vom All. Darum richtet auch dieser, von den entstandenen Wesen aber schuldet ein jedes, ihm Rechenschaft abzulegen. Und wenn die ganze Schöpfung mit uns seufzt, um vom Verderben der Knechtschaft befreit zu werden, so wird eben damit der Sohn als von den Geschöpfen verschieden erwiesen. Denn wäre er ein Geschöpf, so gehörte er gleichfalls zu den Seufzenden und bedürfte dessen, der auch ihn mit allen zum Sohne machte und befreite. Wenn aber die ganze Schöpfung seufzt, um von dem Verderben der Knechtschaft befreit zu werden, der Sohn aber nicht zu den Seufzenden zählt noch auch zu denen gehört, die der Befreiung bedürfen, wenn er vielmehr selbst alles an Sohnes Statt annimmt und frei macht, wie er zu den damaligen Juden sprach:”Der Knecht bleibt nicht in Ewigkeit zu Hause, der Sohn aber bleibt in Ewigkeit. Wenn nun der Sohn euch befreit, werdet ihr in Wahrheit frei sein“, so ergibt sich auch hieraus sonnenklar, daß das Wort Gottes nicht ein Geschöpf, sondern wahrer und von Natur echter Sohn des Vaters ist. Wenn wir nun auch nur kurz die Stelle:”Der Herr schuf mich als Anfang seiner Wege" erörtert haben, so reicht dies doch meines Erachtens hin, um den Gelehrten mehr Material zur gründlichen Widerlegung der arianischen Häresie darzubieten, Da jedoch die Häretiker auch den folgenden Vers, in dem geschrieben steht: “Vor der Zeit gründete er mich”, unrichtig lesen und auffassen und meinen, es sei auch das in Bezug auf die Gottheit des Wortes und nicht in Hinsicht auf seine Erscheinung im Fleische gesagt, so muß man auch diesen Vers erklären und ihren Irrtum nachweisen.</p><p>Es steht geschrieben: „Gott hat durch seine Weisheit die Erde gegründet“. Wenn also die Erde durch die Weisheit gegründet ist, wie wird dann der Gründer gegründet? Doch auch das ist in der Form des Sprichworts gesagt. Und man muß auch hier nach seinem Sinn forschen, um zu erkennen, daß der Vater durch die Weisheit schafft und die Erde gründet, damit sie fest sei und auch Bestand habe, die Weisheit selbst aber für uns gegründet wurde, damit sie Anfang und Grundlage unserer neuen Schöpfung und Erneuerung würde. Er hat also auch hier nicht gesagt: „Vor der Zeit hat er mich zum Wort oder Sohn gemacht“, damit er nicht gleichsam einen Anfang habe, in dem er geschaffen wird. Denn danach muß man vor allem fragen, ob er Sohn ist, und in diesem Punkte in erster Linie die Schriften befragen. Denn hierauf gab auch Petrus, als die Apostel gefragt wurden, seine Antwort, da er sagte: „Du bist Christus, der Sohn des lebendigen Gottes“. Und danach fragte auch der Vater der arianischen Häresie zuerst [in den Worten]: „Wenn Du der Sohn Gottes bist“. Denn er wußte, daß das die Wahrheit ist und der Kernpunkt unseres Glaubens, und daß die Herrschaft des Teufels ein Ende nehmen werde, wenn er der Sohn wäre. Ist er aber ein Geschöpf, dann ist auch Er ein Nachkomme Adams, der von ihm betrogen wurde, und es brauchte ihm nicht zu bangen. Deshalb waren auch die damaligen Juden darob ungehalten, daß sich der Herr Gottessohn und Gott seinen eigenen Vater nannte. Denn hätte er gesagt, er sei eines von den Geschöpfen oder: „Ich bin ein gemachtes Wesen“, so hätte es sie nicht befremdet, dies zu hören, noch auch hätten sie solche Worte für eine Gotteslästerung gehalten, da sie auch von Engelserscheinungen bei den Vätern wußten. Doch da er sich Sohn nannte, so sahen sie, daß solch ein Erkennungszeichen nicht ein Geschöpf verrät, sondern eine Gottheit und väterliche Natur anzeigt.</p><p>Es hätten also die Arianer wenigstens ihren Vater, den Teufel, nachahmen und sich genau umsehen sollen, um, falls er [der Herr] gesagt hätte: „Er gründete mich als Wort oder Sohn“, so denken zu können, wie sie wirklich denken, falls er aber nicht so gesprochen hätte, sich nicht das Nichtseiende ersinnen zu müssen. Denn er hat nicht gesagt: „Vor der Zeit hat er mich als Wort oder Sohn gegründet“, sondern einfach: „Er gründete mich“, um, wie gesagt, wieder zu zeigen, daß er nicht seinetwegen, sondern um derentwillen, die auf ihn gebaut sind, auch dies sprichwörtlich sagt. Das weiß auch der Apostel, wenn er schreibt: „Denn niemand kann einen andern Grundstein legen als den, der gelegt ist, welcher ist Jesus Christus. Ein jeder aber sehe zu, wie er darauf baue“. Es muß aber der Grundstein so sein, wie das, was auf ihn aufgeführt ist, damit eine Aneinanderfügung stattfinden kann. Das Wort nun hat, insoweit es Wort ist, nicht seinesgleichen, die ihm angepaßt werden könnten; denn es ist eingeboren. Mensch geworden aber findet es ihm ähnliche Wesen, von denen es auch das ähnliche Fleisch angezogen hat. Es wird also seiner menschlichen Seite nach gegründet, damit auch wir auf ihm wie kostbare Steine aufgebaut werden können und ein Tempel des in uns befindlichen Heiligen Geistes werden. Wie aber Er Grundstein und wir auf ihm aufgebaute Steine sind, so ist er auch wieder ein Weinstock und wir sind gleichsam mit ihm verbundene Rebzweige, nicht der Substanz der Gottheit nach — denn das ist ja unmöglich —, sondern wieder der menschlichen Seite nach — die Rebzweige nämlich müssen dem Rebstock ähnlich sein —, da auch wir dem Fleische nach ihm ähnlich sind. Da ja überhaupt die Auffassungsweise der Häretiker nur eine menschliche ist, so muß man sie im gleichen Verfahren mit menschlichen Beispielen widerlegen. Er hat also nicht gesagt: „Er hat mich zum Grundstein gemacht“, damit sie nicht etwa, als wäre er ein Geschöpf und hätte er einen Anfang des Werdens, auch hierin einen unverschämten Vorwand für ihre Gottlosigkeit fänden; vielmehr hat er gesagt: „Er gründete mich“. Was aber gegründet wird, wird mit den Steinen gegründet, die dabei angebracht werden. Dies aber geschieht nicht von selbst, sondern indem ein Stein vom Berge herbeigebracht und in die Tiefe der Erde versenkt wird. Und solange der Stein auf dem Berge liegt, ist er noch nicht als Grundstein gelegt. Sobald es aber das Bedürfnis erheischt, und er herbeigebracht ist und die Tiefe der Erde ihn umschließt, dann könnte der Stein, wenn er eine Stimme bekäme, sagen: „Jetzt hat mich der als Grundstein gelegt, der mich vom Berge hieher versetzte“. Es hat also auch der Herr nicht, als er gegründet worden ist, zu sein begonnen — denn er war auch vordem Wort —, sondern als er unseren Leib anzog, den er als eine Abtrennung von Maria annahm, da sagte er: „Er gründete mich“, was soviel heißt, wie wenn er gesagt hätte: Er umgab mich, das Wort, mit einem irdischen Leibe. Denn so wird er unsertwegen gegründet, da er das Unsrige annimmt, damit wir in Einem Leibe mit ihm zusammengefügt und in ihm durch die Ähnlichkeit des Fleisches verbunden zu einem vollkommenen Manne zusammengelangen und unsterblich und unverweslich bleiben.</p><p>Die Worte „vor der Zeit“ und „bevor er die Erde machte“ und „bevor die Berge befestigt wurden“ sollen keinen verwirren. Denn er hat auch diese Worte ganz richtig mit den Ausdrücken „er gründete“ und „er schuf“ in Verbindung gebracht. Es berührt nämlich auch das wieder die Heilsordnung im Fleische. Denn die vom Erlöser uns gebrachte Gnade ist jüngst erschienen, wie der Apostel gesagt hat, und uns mit seiner Ankunft zuteil geworden; sie war aber vorbereitet, ehe wir wurden oder vielmehr vor Grundlegung der Welt. Und die Ursache ist gar gut und bewundernswert. Es ziemte sich nicht, daß Gott später unsertwegen zu Rate ging, damit es nicht schiene, als kannte er unsere Verhältnisse nicht. Der Gott aller Dinge, der uns durch sein Wort schuf, kannte unsere Verhältnisse besser als wir und wußte vorher, daß wir nach anfänglicher Gerechtigkeit später Übertreter seines Gebotes sein würden und wegen des Ungehorsams aus dem Paradiese würden vertrieben werden. Deshalb bereitete er in seiner Menschenfreundlichkeit und Güte in seinem Wort, durch das er uns schuf, unsere Heilsordnung vor, damit wir, wenn wir auch, von der Schlange betrogen, fallen sollten, nicht endgültig tot blieben, sondern im Besitz der im Worte uns vorbereiteten Erlösung und Rettung wieder auferständen und unsterblich blieben, wenn er selbst für uns als Anfang der Wege geschaffen wird und der Erstgeborene der Brüder wird, und er selbst als Erstlingsfrucht von den Toten aufersteht. Dies lehrt der selige Apostel Paulus in seinen Briefen. Er erklärt nämlich die Ausdrücke in den Sprichwörtern: „vor der Zeit“ und „bevor die Erde wurde“ und spricht also zu Timotheus: „Trage mit die Leiden für das Evangelium in der Kraft Gottes, der uns erlöst und berufen hat mit heiligem Rufe, nicht nach unseren Werken, sondern nach seinem Vorsatz und seiner Gnade, die uns gegeben wurde in Christus Jesus vor ewigen Zeiten, die aber jetzt geoffenbart worden ist durch die Erscheinung unseres Heilandes Jesus Christus, der den Tod vernichtet, das Leben aber erleuchtet hat“. Und an die Ephesier schreibt er: „Gepriesen sei Gott und der Vater unseres Herrn Jesus Christus, der uns gesegnet hat mit jedem geistigen Segen, mit himmlischen Gaben in Christus Jesus, so wie er uns in ihm erwählt hat vor Grundlegung der Welt, daß wir heilig und untadelhaft seien vor ihm in Liebe, indem er uns vorherbestimmt hat zur Kindschaft durch Jesus Christus für sich“.</p><p>Wie hat er also uns erwählt, bevor wir wurden, wenn wir nicht, wie er selbst gesagt hat, in ihm vorgebildet waren? Und wie hat er überhaupt, ehe Menschen geschaffen wurden, uns für die Sohnschaft vorherbestimmt, wenn nicht der Sohn selbst vor der Zeit gegründet war und um unsertwillen die Heilsordnung übernommen hatte? Oder wie sind wir, wie der Apostel hinzufügt, „als Vorherbestimmte der Erbschaft teilhaftig geworden“, wenn nicht der Herr selbst vor der Zeit gegründet worden war, so daß er den Vorsatz haben konnte, jedes Los des Richterurteils über uns im Fleisch für uns auf sich zu nehmen und wir so fortan in ihm die Sohnschaft erlangten? Und wie haben wir vor ewigen Zeiten empfangen, da wir noch nicht waren, sondern in der Zeit entstanden sind, wenn nicht in Christus die uns zukommende Gnade hinterlegt war? Darum sagt er auch beim Gerichte, wenn jeder nach seinem Tun und Handeln empfangen wird: „Kommet, ihr Gesegnete meines Vaters, nehmt das Reich in Besitz, das euch seit Grundlegung der Welt bereitet ist“. Wie nun und in wem wurde es vor unserer Entstehung bereitet, wenn nicht im Herrn, der hiezu vor der Zeit gegründet wurde, damit wir, gleichsam auf ihm erbaut wie wohlgefügte Steine, an seinem Leben und seiner Gnade teilnehmen? Das ist aber geschehen, wie es ja einem schon bei einem bescheidenen Maß von Frömmigkeit in den Sinn kommt, damit wir, wie bereits gesagt, vom kurzen Tode auferstanden ewig leben könnten. Denn als irdischen Menschen wäre uns dies unmöglich, wenn nicht vor der Zeit uns in Christus die Hoffnung des Lebens und der Rettung bereitet worden wäre. Natürlich wird also das Wort, wenn es in unserem Fleische Wohnung nimmt, und in ihm als Anfang der Wege für seine Werke geschaffen wird, so gegründet, wie in ihm der Wille des Vaters war, wie gesagt worden ist, nämlich „vor der Zeit“ und „bevor die Erde wurde“ und „bevor die Berge befestigt wurden“ und „bevor die Quellen hervorbrachen“, damit, wenn auch die Erde, die Berge und Gestalten der Erscheinungswelt am Ende der bestehenden Zeit vorübergehen, nicht auch wir gleich diesen veralteten, sondern auch nachher leben könnten, da wir das vor diesen uns im Worte selbst gemäß der Auserwählung bereitete Leben und den geistigen Segen besitzen. Denn so wird es uns vergönnt sein, nicht ein bloß augenblickliches Leben zu führen, sondern nachher immer in Christus zu leben, da auch vorher unser Leben in Christus Jesus grundgelegt und bereitet war.</p><p>Und es ging auch nicht an, daß unser Leben in einem andern gegründet wurde als in dem Herrn, der vor den Zeiten ist, und durch den auch die Zeiten entstanden sind, damit auch wir ewiges Leben erben könnten, so wie es in ihm war; denn Gott ist gut. Da er aber immer gut ist, so hat er dies gewollt, er, der unsere ohnmächtige Natur seiner Hilfe und Rettung bedürftig fand. Und wie ein weiser Baumeister, der sich vorgenommen hat, ein Haus zu bauen, zugleich mit sich zu Rate geht, wie er dieses Haus, falls es nach seinem Entstehen einmal auch Schaden litte, wieder erneuern könne und in Erwägung dessen Vorbereitungen trifft und dem Werkmeister das zur Erneuerung notwendige Material verschafft, und so vor dem Aufbau des Hauses schon zu dessen Erneuerung die Vorbereitungen trifft, ebenso wird vor uns die Erneuerung unseres Heils in Christus grundgelegt, damit wir in ihm auch wieder geschaffen werden könnten. Der Ratschluß und der Vorsatz wurde vor der Zeit bereitet, das Werk aber ist geschehen, als das Bedürfnis es erheischte und der Heiland ankam. Denn der Herr selbst wird im Himmel die Stelle aller vertreten, indem er uns ins ewige Leben aufnimmt.</p><p>Das reicht nun hin zum Erweis dessen, daß das Wort Gottes nicht ein Geschöpf ist, und daß vielmehr die Stelle einen richtigen Sinn hat. Da aber die Stelle bei der Untersuchung in allweg einen richtigen Sinn ergibt, so hat man also diesen Sinn auch anzugeben. Vielleicht bringen viele Stellen den Unverständigen eine Beschämung. Wir brauchen aber wieder, was wir bereits gesagt haben. Es handelt sich nämlich im Vorliegenden um dasselbe Sprichwort und dieselbe Weisheit. Nicht hat das Wort gesagt, es sei von Natur ein Geschöpf, sondern in den Sprichwörtern hat es gesagt: „Der Herr schuf mich“, und offenbar deutet er einen gewissen Sinn an, freilich nicht offen, sondern nur verhüllt, den auch wir finden können, wenn wir von dem Sprichwort die Hülle wegnehmen. Denn wer kann die schöpferische Weisheit reden hören: „Der Herr schuf mich als Anfang seiner Wege“, ohne sogleich nach dem Sinn zu forschen und nachzusinnen, wie die schaffende erschaffen werden könne? Wer fragt, wenn er den eingeborenen Sohn Gottes sagen hört, er werde als Anfang Wiege erschaffen, nicht nach dem Sinn und wundert sich, wie der eingeborene Sohn Anfang vieler anderer werden könne? Ein Rätsel liegt vor. „Der Verständige aber“, heißt es, „wird eine Parabel und dunkle Reden, Sprüche und Rätsel von Weisen verstehen“.</p><p>Die eingeborene und selbsteigene Weisheit Gottes ist also Schöpferin und Bildnerin von allem; denn „alles“, heißt es, „hast Du in Weisheit gemacht“ und „es wurde die Erde erfüllt von Deiner Schöpfung“. Damit aber das Entstehende nicht nur schlechthin existiere, sondern auch guten Bestand habe, gefiel es Gott, daß seine Weisheit zu den Geschöpfen herabsteige, so daß sie einen Abdruck und eine Vorstellung ihres Bildes allen insgemein und jedem einzelnen einprägte, damit die entstandenen Dinge als weise und Gottes würdige Werke sich erweisen. Denn wie unser Wort ein Bild des Sohnes Gottes ist, insofern es Wort ist, so ist auch die Weisheit in uns wieder ein Bild von ihm, insofern er Weisheit ist. Und da wir in ihr das Wissen und Denken besitzen, werden wir für die schöpferische Weisheit empfänglich und können durch sie ihren Vater erkennen. Denn, „wer den Sohn hat“, sagt er, „hat auch den Vater, und wer mich aufnimmt, nimmt den auf, der mich gesandt hat“. Da nun ein solcher geschaffener Abdruck der Weisheit in uns und in allen Werken ist, so eignet sich die wahre und schöpferische Weisheit das, was zu ihrem Abdruck gehört, mit Recht an und sagt: „Der Herr schuf mich für seine Werke“. Was also die Weisheit in uns sagte, das sagt der Herr von sich gleichsam als ihm eigen aus. Und er ist als Schöpfer selbst keine Kreatur; aber wegen seines in den Werken geschaffenen Bildes sagt er dies wie von sich selbst. Und wie der Herr selbst gesagt hat: „Wer euch aufnimmt, nimmt mich auf“, weil sein Abdruck in uns ist, so sagt er, wenn schon nicht zu den geschaffenen Dingen gehörig, gleichwohl, weil sein Bild und Abdruck in den Werken geschaffen wird, wie wenn er es selbst wäre: „Der Herr schuf mich als Anfang seiner Wege für seine Werke“. Und so ist der Abdruck der Weisheit in den Werken entstanden, damit die Welt, wie gesagt, in ihr ihr Schöpferwort erkenne und durch dasselbe den Vater. Und gerade davon sprach Paulus: „Denn was von Gott erkennbar ist, das ist unter ihnen offenbar; denn Gott hat es ihnen geoffenbart. Denn das Unsichtbare an ihm wird seit der Erschaffung der Welt in den erschaffenen Dingen erkannt und geschaut“. Deshalb ist das Wort nicht der Substanz nach ein Geschöpf, vielmehr ist die Stelle in den Sprichwörtern von der Weisheit zu verstehen, die in uns ist und uns zugesprochen wird.</p><p>Wenn sie aber auch dem keinen Glauben schenken wollen, so sollen sie uns selbst sagen, ob wirklich eine Weisheit in den Geschöpfen ist oder nicht. Wenn nun eine solche fehlt, warum erhebt dann der Apostel Beschwerde mit den Worten: „Denn weil die Welt in der Weisheit Gottes Gott durch die Weisheit nicht erkannte“? Oder, wenn es keine Weisheit gibt, warum findet man dann in der Schrift eine Menge von Weisen? Denn: „Der Weise wendet sich in Furcht vom Bösen ab“ und: „Mit Weisheit wird Dein Haus gebaut“, Der Prediger aber sagt: „Die Weisheit des Menschen wird sein Antlitz erleuchten“ und er weist die Vorlauten zurecht mit den Worten: „Sag nicht: Wie kam es doch, daß die früheren Tage besser waren als die gegenwärtigen? Denn nicht in Weisheit hast du darum gefragt“. Wenn es aber eine solche gibt, wie auch der Sohn des Sirach bezeugt: „Er goß sie aus über alle seine Werke und alles Fleisch gemäß seiner Ausbreitung und gab sie denen, die ihn lieben“. Und wenn eine solche Ausgießung nicht ein Kennzeichen der Substanz der selbsteigenen und eingeborenen, sondern der in der Welt nachgebildeten Weisheit ist, klingt es dann so unglaublich, wenn die schöpferische und wahre Weisheit selbst, deren Abdruck die in der Welt ausgegossene Weisheit und Erkenntnis ist, wie ich schon vorhin bemerkt habe, gleichsam von sich selbst spricht: „Der Herr schuf mich für seine Werke“. Denn die Weisheit in der Welt ist nicht schöpferisch, sie wird vielmehr in den Werken geschaffen, in der „die Himmel Gottes Herrlichkeit erzählen und das Firmament das Werk seiner Hände verkündet“. Wenn aber die Menschen diese in sich tragen, so werden sie zur Erkenntnis der wahren Weisheit gelangen und erkennen, daß sie in Wahrheit nach dem Bilde Gottes geschaffen sind. Wenn irgendein Königssohn, dessen Vater eine Stadt bauen will, seinen Namen auf jedes der entstandenen Werke eingraben ließe, um den Bestand der Bauwerke dadurch, daß auf jedem derselben sein Name erglänzt, sicher zu stellen und um mit dem Namen die Erinnerung an ihn und seinen Vater wachhalten zu können, so würde er nach der Vollendung auf eine Frage nach der Art und Weise der Entstehung der Stadt antworten: Sie ist in sicherem Zustand hergestellt. Denn nach dem Willen des Vaters ist jedem Werk mein Bild aufgedrückt; denn mein Name ist an den Werken angebracht. Mit diesen Worten wollte er aber nicht seine Substanz, sondern seinen Abdruck im Namen als geschaffen bezeichnen. In derselben Weise wie in diesem Beispiele antwortet denen, welche die Weisheit in den Geschöpfen bewundern, die wahre Weisheit: „Der Herr schuf mich für die Werke“. Denn der Abdruck von mir ist in ihnen, und ich habe mich so zur Erschaffung herabgelassen.</p><p>Es darf darum wieder nicht befremden, wenn der Sohn von seinem in uns befindlichen Abdruck wie von sich selbst redet, wie er ja — denn man braucht sich nicht zu scheuen, das Nämliche zu wiederholen — damals, als Saulus die Kirche verfolgte, in der seine Gestalt und sein Bild war, so redete, als wäre er selbst der Verfolgte: „Saulus, warum verfolgst du mich?“ Wie es also, wie gesagt, niemand auffallend gefunden hätte, wenn die Gestalt der Weisheit selbst, die in den Werken ist, gesagt hätte: „Der Herr schuf mich für die Werke“, so soll, wenn auch die wahre und schöpferische Weisheit, das eingeborene Wort Gottes, das, was seinem Bilde zukommt, wie von sich selbst aussagt in den Worten: „Der Herr schuf mich für die Werke“, niemand die der Welt und den Werken anerschaffene Weisheit außer acht lassen und glauben, das Wort „er schuf“ beziehe sich auf die Substanz der selbsteigenen Weisheit, „damit er nicht Wein mit Wasser mische“ und die Wahrheit zu unterschlagen scheine. Denn sie ist Schöpferin und Bildnerin, der Abdruck von ihr aber wird den Werken anerschaffen, wie vom Bild das Ebenbild. „Anfang der Wege“ aber heißt es, weil diese Weisheit gewissermaßen Anfang und Grundlage für die Erkenntnis Gottes wird. Denn wer sie gleichsam als ersten Weg betritt, und in der Furcht Gottes bewahrt, wie Salomo gesagt hat: „Der Anfang der Weisheit ist die Furcht des Herrn“, und dadurch an Einsicht gewinnt und die schöpferische Weisheit in der Schöpfung erkennt, der wird in ihr auch ihren Vater erkennen, wie der Herr selbst gesagt hat: „Wer mich gesehen, hat den Vater gesehen“, und wie Johannes schreibt: „Wer den Sohn bekennt, hat auch den Vater“. Er aber sagt: „Vor der Zeit gründete er mich“, da in ihrer Gestalt die Werke beständig und immer bleiben. Und damit niemand, der von der so in den Werken geschaffenen Weisheit hört, auf die Meinung komme, die wahre Weisheit, der Sohn Gottes, sei von Natur ein Geschöpf, fügte er notwendig bei: „Vor den Bergen“ und „vor der Erde“ und „vor den Wassern“ und „vor allen Hügeln zeugt er mich“, um in dem Ausdruck „vor der ganzen Schöpfung“ — denn mit diesen Ausdrücken wollte er die ganze Schöpfung bezeichnen — anzuzeigen, daß sie nicht der Substanz nach mit den Werken geschaffen wurde. Denn wenn sie für die Werke geschaffen wurde, jedoch vor den Werken existiert, so ist sie offenbar, auch bevor sie geschaffen wurde. Sie ist also nicht der Natur und Substanz nach ein Geschöpf, sondern, wie er selbst hinzufügte, eine Zeugung. Welcher Unterschied und Abstand aber der Natur nach zwischen Geschöpf und Zeugung besteht, ist im Vorausgehenden gezeigt worden.</p><p>Da sie aber redend weiterfährt: „Als er den Himmel bereitete, war ich bei ihm“, so muß man wissen, daß sie das nicht sagt, als hätte der Vater nicht durch sie den Himmel oder die Wolken in der Höhe bereitet. Denn zweifellos wurde alles in der Weisheit geschaffen, und ohne sie entstand gar nichts. Vielmehr will sie das sagen: Alles ist in mir und durch mich entstanden. Da aber die Weisheit den Werken anerschaffen werden mußte, war ich wohl der Substanz nach beim Vater, prägte aber in der Herabkunft zu den entstandenen Wesen meine Gestalt den Werken entsprechend ein, so daß auch die ganze Welt, gleichsam Ein Körper, mit sich nicht zerfiele, sondern in sich ewig wäre. Alle also, die mit der ihnen verliehenen Weisheit geraden Sinnes die Geschöpfe betrachten, können gleichfalls sagen: „Durch Deine Anordnung bleibt alles“. Die aber dies vernachlässigen, werden hören müssen: „Während sie für weise sich ausgaben, wurden sie zu Toren“. Denn „was an Gott erkennbar ist, das ist unter ihnen offenbar, Gott offenbart es ihnen. Denn das Unsichtbare an ihm wird seit der Erschaffung der Welt in den Werken erkannt und geschaut, nämlich seine ewige Kraft und Gottheit, damit sie unentschuldbar wären. Denn nachdem sie Gott erkannt hatten, haben sie ihn nicht als Gott verherrlicht“, sondern „sie haben mehr das Geschöpf verehrt als den Schöpfer des Alls, der gepriesen ist in Ewigkeit. Amen“. Und Schande wird sie treffen, wenn sie hören: „Denn weil die Welt in der Weisheit Gottes“ — in der vorhin angegebenen Weise — „durch die Weisheit Gottes nicht erkannte, so gefiel es Gott, durch die Torheit der Predigt die zu retten, die glauben“. Denn Gott wollte nicht mehr wie in früheren Zeiten durch Bild und Schatten der in den Geschöpfen befindlichen Weisheit erkannt werden, sondern er ließ die wahre Weisheit selbst Fleisch annehmen, Mensch werden und den Kreuzestod erleiden, damit durch den Glauben an das Kreuz von nun an alle Gläubigen gerettet werden könnten. Es ist also die Weisheit Gottes selbst, die zuvor durch ihr Bild in den Geschöpfen, um dessentwillen auch von ihr das Geschaffenwerden ausgesagt wird, sich offenbarte und durch sich ihren Vater. Später aber ist sie, die [auch] das Wort war, Fleisch geworden, wie Johannes gesagt hat, und nachdem sie den Tod vernichtet und unser Geschlecht gerettet hatte, offenbarte sie sich noch mehr und durch sich ihren Vater, wie sie sagte: „Gib ihnen, daß sie Dich, den einzig wahren Gott, erkennen und den Du gesandt hast, Jesum Christum“.</p><p>Es ward also die ganze Erde voll von seiner Erkenntnis. Es gibt ja nur Eine Erkenntnis des Vaters durch den Sohn und des Sohnes vom Vater und an ihm freut sich der Vater und dieselbe Freude genießt der Sohn im Vater, wie er ja sagt: „Ich war es, woran er sich erfreute, Tag um Tag war ich in Entzücken vor seinem Angesicht“. Das zeigt aber wieder, daß der Sohn dem Vater nicht fremd, sondern wesenseigen ist. Denn sieh, nicht unsertwegen ist er entstanden, wie die Gottlosen behaupten, und er ist überhaupt nicht aus dem Nichtseienden. Und Gott hat auch nicht von außen her sich einen Freudenbringer verschafft, vielmehr lassen diese Worte auf etwas Eigenes und Ähnliches schließen. Wann also erfreute sich der Vater nicht? Wenn er sich aber immer freute, so war der immer, an dem er sich erfreute. Worin aber liegt die Freude des Vaters, wenn nicht darin, daß er sich selbst in seinem Bilde schaut, das sein Wort ist. Wenn er aber nach Vollendung der Welt auch in den Menschensöhnen sich freute, wie in denselben Sprichwörtern geschrieben steht, so hat auch das denselben Sinn. Denn auch diese seine Freude hat man nicht so zu denken, als wäre die Freude ihm [von außen her] zuteil geworden, sondern er freute sich, indem er wieder die nach seinem Bilde entstandenen Werke sah; — also auch für diese Freude Gottes liegt die Ursache in seinem Bilde. Und wie anders freut sich auch der Sohn als eben, indem er sich im Vater schaut? Eben dies wollen nämlich die Worte sagen: „Wer mich gesehen, hat den Vater gesehen“, und: „Ich im Vater und der Vater in mir“. Womit ihr euch brüstet, ist also in allweg als nichtig erwiesen, ihr Christusfeinde, und umsonst schwatzt ihr prahlerisch überall herum: „Der Herr schuf mich als Anfang seiner Wege“, indem ihr den Sinn dieser Worte verdreht und eher eure eigenen Einfälle als die Meinung Salomos verkündet. Denn seht, eure Ansicht hat sich als reines Hirngespinst herausgestellt; die Stelle in den Sprichwörtern aber und alles, was wir bisher gesagt haben, beweist, daß der Sohn der Natur und Substanz nach nicht ein Geschöpf, sondern eigene Zeugung des Vaters ist, Weisheit und wahres Wort, durch das alles entstanden ist und ohne das nichts.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung des 19. Jahrhunderts, <em>Vier Reden gegen die Arianer</em> (BKV). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2093/versions/vier-reden-gegen-die-arianer-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "athanasius-four-discourses-against-the-arians-3"

    path: "Athanasius_Gegen_die_Arianer_3"
    title: "Dritte Rede gegen die Arianer"
    menu: { parent: "Dogmatisch-polemische Werke", title: "Dritte Rede gegen die Arianer", priority: 3 }
    update: true
    body: |-
      <p><em>Dritte Rede gegen die Arianer (Bibliothek der Kirchenväter).</em></p><p>Die Ariomaniten haben, wie es scheint, sich nun einmal dafür entschieden, Verräter und Verächter der Wahrheit zu werden, und sie wollen um jeden Preis, daß sie das Schriftwort treffe: „Wenn der Gottlose in die Tiefe der Übel fällt, achtet er es gering“. Denn sie geben sich weder zufrieden, wenn sie widerlegt werden, noch auch schämen sie sich, wenn sie in der Verlegenheit sind, sondern mit der Stirnme einer Buhlerin haben sie in ihren gottlosen Reden jedem Menschen gegenüber das Schamgefühl abgelegt. Denn obschon die Aussprüche, auf die sie sich beriefen, wie: „Der Herr schuf mich“, und: „Vorzüglicher geworden als die Engel“, und: „Der Erstgeborene“, und: „Der dem treu ist, der ihn gemacht hat“ einen richtigen Sinn haben und den frommen Glauben an Christus bekunden, so begannen sie nunmehr wieder in unbegreiflicher Weise, gleichsam vom Gift der Schlange übergossen und ohne zu sehen, was sie sehen sollten, und ohne zu verstehen, was sie lesen, als wollten sie aus der Tiefe ihres gottlosen Herzens sich erbrechen, auch das Herrnwort zu zerzausen: „Ich im Vater und der Vater in mir“. Sie sagen nämlich: Wie kann dieser in jenem und jener in diesem Platz finden? Oder wie kann überhaupt der Vater, der größer ist, im Sohne, der kleiner ist, Platz haben? Oder was ist es besonderes, daß der Sohn im Vater ist, wenn ja auch von uns geschrieben steht: „Denn in ihm leben wir, bewegen wir uns und sind wir“. Aber diesen Verstoß verdanken sie ihrer verkehrten Anschauung, in der sie Gott für einen Körper halten und nicht begreifen, was wahrer Vater und wahrer Sohn, noch auch, was unsichtbares und ewiges Licht und sein unsichtbarer Abglanz, noch was unsichtbares Wesen und unkörperlicher Abriß und unkörperliches Bild ist. Denn hätten sie diese Erkenntnis, dann würden sie nicht den Herrn der Herrlichkeit unter Hohngelächter schmähen, noch vom Unkörperlichen sich eine körperliche Vorstellung machen und richtige Aussprüche falsch auslegen. Sie hätten nun schon auf das bloße Hören dieser Worte hin glauben sollen, da ja der Herr es ist, der redet; denn der Glaube der Einfalt ist besser als eine weitläufige Beweisführung. Da sie aber auch diese Stelle zugunsten ihrer Häresie zu entweihen suchten, so müssen wir ihre verkehrte Ansicht widerlegen und den wahren Sinn aufzeigen, um wenigstens den Gläubigen Sicherheit zu verschaffen. Denn wenn es heißt: „Ich im Vater und der Vater in mir“, so sind sie nicht, wie jene meinen, ineinander eingelassen und füllen wie leere Gefäße sich gegenseitig auf, so daß also der Sohn die Leere des Vaters und der Vater die Leere des Sohnes füllte, und keiner von ihnen voll und vollkommen wäre. So verhält es sich ja bei den Körpern; darum ist es voll Gottlosigkeit, dies auch nur zu sagen. Denn voll und vollkommen ist der Vater, und die Fülle der Gottheit ist der Sohn. Und ferner ist Gott nicht in derselben Weise wie in den Heiligen, die er stärkt, auch im Sohne, der ja selbst die Kraft und Weisheit des Vaters ist. Die entstandenen Wesen werden durch die Teilnahme an ihm im Geiste geheiligt, der Sohn selbst aber ist nicht infolge Teilnahme Sohn, vielmehr ist er eigene Zeugung des Vaters. Auch ist der Sohn wieder nicht im Vater im Sinne der Schriftstelle: „In ihm leben wir, bewegen wir uns und sind wir“. Denn wie aus einem Quell kommt er aus dem Vater als das Leben, in dem alles belebt wird und Bestand hat. Denn es lebt das Leben nicht im Leben, da es dann kein Leben wäre, vielmehr gibt er selbst allem das Leben.</p><p>Wir wollen nun aber auch den Anwalt der Häresie, den Sophisten Asterius, hören. Denn auch er hat im Wetteifer mit den Juden folgendes geschrieben: „Es ist ja ganz klar, daß er deshalb gesagt hat, er sei im Vater und der Vater wieder in ihm, weil er sagen will, daß seine Rede nicht sein, sondern des Vaters sei, noch auch die Werke sein seien, sondern des Vaters, der ihm die Macht gegeben habe“. Wäre es ein Kind, das in naiver Weise geredet hätte, so könnte man es ihm wegen seines Alters verzeihen. Da aber ein sogenannter Sophist und einer, der alles wissen will, es ist, der es geschrieben hat, wie hart gehört nicht ein solcher verurteilt? Und wie deutlich verrät er nicht, daß er vom Apostel abweicht, wenn er in einnehmenden Worten menschlicher Weisheit sich überhebt und mit diesen betrügen zu können wähnt, ohne selbst zu verstehen, was er sagt, noch worüber er Behauptungen aufstellt? Denn was der Sohn als nur zum Sohne gehörig und passend gesagt hat, insoweit er Wort und Weisheit und Bild der Substanz des Vaters ist, das überträgt dieser auf alle Geschöpfe und eignet es dem Sohne und diesen gemeinsam zu, und es behauptet der Gesetzwidrige, die Kraft des Vaters empfange Kraft, um aus seiner Gottlosigkeit folgern zu können, daß auch der Sohn im Sohne zum Sohn gemacht wurde und das Wort die Kraft des Wortes annahm. Und er will nicht mehr, daß er dies als Sohn gesagt habe, sondern wie wenn er es auch in ähnlicher Weise gelernt hätte, stellt er ihn mit allen Geschöpfen zusammen? Denn wenn der Sohn deshalb, weil die Worte, die er äußerte, nicht seine, sondern des Vaters Worte waren, und ebenso die Werke, den Ausspruch tat: „Ich im Vater und der Vater in mir“, und wenn auch David sagt: „Ich will hören, was Gott der Herr in mir reden wird“, und Salomo: „Meine Worte sind vom Herrn gesprochen“, und wenn Moses Diener am Worte Gottes war, und die Propheten jeweils nicht ihre eigenen, sondern Gottes Wort verkündeten — „dies spricht der Herr“ —, und wenn die Heiligen die Werke, die sie verrichteten, nicht als ihre eigenen bezeichneten, sondern als die Werke Gottes, der ihnen die Macht gegeben hat, wie z. B. Elias und Elisäus, die Gott anriefen, damit Er die Toten erwecke, und da Elisäus zu Naaman nach seiner Reinigung vom Aussatz sagt: „Damit du erkennest, daß ein Gott in Israel ist“, ferner auch Samuel in den Tagen der Ernte zu Gott flehte, er möge Regen geben und endlich auch die Apostel sagten, daß sie nicht aus eigener Kraft die Zeichen wirkten, sondern mit der Gnade des Herrn, so könnten nach seiner Ansicht offenbar alle miteinander eine solche Sprache führen, und jeder könnte sagen: „Ich im Vater und der Vater in mir“, und es wäre von nun an dieser [unser] Sohn Gottes, Wort und Weisheit nicht mehr Einer, vielmehr wäre auch Er nur einer von vielen.</p><p>Hätte aber der Herr das sagen wollen, dann hätte er nicht sagen dürfen: „Ich im Vater und der Vater in mir“, sondern: „Auch ich bin im Vater, und der Vater ist in mir“, damit er auch nicht etwas Eigenes und Besonderes dem Vater gegenüber als Sohn hätte, vielmehr mit allen dieselbe Gnade teile. Doch so verhält es sich nicht, wie jene meinen. Denn da sie ihn nicht für den echten Sohn aus dem Vater halten, so lügen sie auf den echten, der allein mit Fug und Recht sagen kann: „Ich im Vater und der Vater in mir“. Es ist nämlich wirklich der Sohn im Vater, wie sich ja begreifen läßt, da das ganze Sein des Sohnes der Substanz des Vaters eigen ist, als der Abglanz aus dem Lichte und der Fluß aus der Quelle, so daß, wer den Sohn sieht, auch das sieht, was dem Vater eigen ist, und begreift, daß die Existenz des Sohnes, wie aus dem Vater, so im Vater ist. Es ist aber auch der Vater im Sohne, weil das, was aus dem Vater stammt und ihm eigen ist, der Sohn ist, wie im Abglanz der Sonne, und im Wort der Geist und im Fluß die Quelle. Denn so schaut, wer den Sohn schaut, das, was der Substanz des Vaters eigen ist, und begreift, daß der Vater im Sohne ist. Denn da die Gestalt und Gottheit des Vaters das Sein des Sohnes ist, so ist folgerichtig der Sohn im Vater und der Vater im Sohne. Darum nämlich fügte er auch mit Recht den vorausgegangenen Worten: „Ich und der Vater sind Eins“ hinzu: „Ich im Vater und der Vater in mir“ um die Identität der Gottheit und die Einheit der Substanz zu erweisen.</p><p>Denn sie sind Eins, nicht wie wenn das Eins wieder in zwei Teile geteilt wäre und diese wieder nichts weiter als Eins wären, auch nicht so, wie wenn das Eins zweimal genannt würde, so daß derselbe das einemal Vater, ein andermal sein eigener Sohn wäre; denn wegen dieser Ansicht wurde Sabellius als Häretiker erklärt. Vielmehr sind es zwei, weil der Vater Vater ist und nicht der nämliche [auch] Sohn ist und der Sohn Sohn, und nicht derselbe [auch] Vater ist. Aber die Natur ist nur Eine. Denn die Zeugung ist dem Erzeuger nicht unähnlich; sie ist ja sein Bild und alles, was der Vater hat, hat auch der Sohn. Darum ist der Sohn auch nicht ein anderer Gott; denn er wurde nicht von außen erdacht, da es dann jedenfalls viele gäbe, wenn eine fremde Gottheit neben der des Vaters ausfindig gemacht würde. Denn wenn der Sohn als Zeugung auch etwas anderes ist, so ist er doch dasselbe als Gott, und Eins sind Er und der Vater durch die Eigenheit und Gemeinsamkeit der Natur und durch die Identität der Einen Gottheit, wie wir gesagt haben. Denn auch der Abglanz ist Licht und zwar kein späteres als die Sonne, auch nicht ein anderes Licht und nicht auf Grund der Teilnahme an ihr, sondern er ist ganz ihre eigene Zeugung. Eine solche Zeugung ist aber notwendig Ein Licht, und man kann wohl nicht sagen, es seien zwei Lichter, wohl aber Sonne und Abglanz seien zwei, Eins aber das Licht aus der Sonne, das im Abglanz alles beleuchtet. Und in dieser Weise ist auch die Gottheit des Sohnes die des Vaters, weshalb sie auch unteilbar ist, und in dieser Weise gibt es nur Einen Gott und es ist kein anderer außer ihm. Da sie also in dieser Weise Eins sind und die Gottheit selbst Eine ist, so wird dasselbe vom Sohne ausgesagt, was man auch vom Vater sagt, nur daß er nicht Vater genannt wird, so z.B. „Gott“: „Und Gott war das Wort“: „Allmächtiger“: „Das spricht, der da war und ist und sein wird, der Allmächtige“; „Herr“: „Ein Herr Jesus Christus“, daß er Licht sei: „Ich bin das Licht“, daß er die Sünden tilge: „Damit ihr aber wisset“, so sagt er, „daß der Menschensohn Macht habe, auf Erden Sünden nachzulassen“, und was man sonst noch finden kann. Denn „alles“, sagt der Sohn selbst, „was der Vater hat, ist mein“, und wieder: „Das Meinige ist Dein“.</p><p>Wer aber das, was dem Vater eigen ist, auf den Sohn bezogen hört, wird so auch den Vater im Sohne sehen. Er wird aber auch den Sohn im Vater schauen, wenn das, was vom Sohne ausgesagt wird, auch vom Vater gilt. Warum aber wird das, was dem Vater eigen ist, vom Sohne ausgesagt, wenn nicht deshalb, weil der Sohn eine Zeugung aus ihm ist? Und warum ist auch, was dem Sohne zukommt, dem Vater eigen, wenn nicht wieder deshalb, weil der Sohn seine wesenseigene Zeugung ist? Und da der Sohn eine der Substanz des Vaters eigene Zeugung ist, so sagt man mit Recht, daß, was dem Vater zukommt, auch ihm gehöre. Daher fügte er treffend und folgerichtig den Worten: „Ich und der Vater sind Eins“ hinzu: „Damit ihr erkennet, daß ich im Vater bin, und der Vater in mir“. Dem aber hat er wieder beigefügt: „Wer mich gesehen hat, hat den Vater gesehen“. Ein und denselben Sinn haben diese drei Stellen. Denn wer zu der Einsicht gelangt ist, daß der Sohn und der Vater Eins sind, weiß, daß er im Vater ist und der Vater im Sohne. Denn die Gottheit des Sohnes ist die des Vaters, und sie ist im Sohne. Wer aber dies begriffen hat, lebt der Überzeugung, daß, wer den Sohn gesehen, den Vater gesehen hat; denn im Sohne wird die Gottheit des Vaters geschaut. Das wird man aber am Beispiel vom Bilde des Königs leichter faßlich und verständlich finden können. Das Bild zeigt nämlich die Gestalt und die Züge des Königs, und im König zeigt sich die im Bilde dargestellte Gestalt. Denn die volle Ähnlichkeit zeigt das Bild des Königs, so daß, wer das Bild betrachtet, in ihm den König sieht, und wer wieder den König sieht, erkennt, daß er der auf dem Bilde ist. Da aber völlige Ähnlichkeit vorliegt, so könnte das Bild auf das Verlangen hin, nach dem Bilde noch den König zu sehen, sagen: „Ich und der König sind Eins; denn ich bin in ihm, und er ist in mir, und was du in mir siehst, das siehst du in ihm, und was du in ihm gesehen hast, das siehst du in mir“. Wer also das Bild anbetet, betet in ihm auch den König an; denn seine Züge und seine Gestalt sind das Bild. Da also der Sohn das Bild des Vaters ist, so ist man zur Einsicht genötigt, daß die Gottheit und die Eigenheit des Vaters das Sein des Sohnes ist, und das bezeichnen die Worte: „Der, da er in der Gestalt Gottes war“ und „der Vater in mir“.</p><p>Aber nicht etwa teilweise die Gestalt der Gottheit, sondern die Fülle der Gottheit des Vaters ist das Sein des Sohnes, und ganz Gott ist der Sohn. Deshalb hielt er es, da er Gott gleich war, nicht für einen Raub, Gott gleich zu sein. Und da wiederum die Gottheit und Gestalt des Sohnes keinem andern als nur dem Vater zukommt, eben deshalb hat er gesagt: “Ich im Vater”, und ebenso heißt es: “Gott hat in Christus die Welt mit sich versöhnt”. Denn was der Substanz des Vaters eigen ist, das ist der Sohn, in dem die Schöpfung mit Gott ausgesöhnt wurde. So sind die Werke, die der Sohn wirkte, Werke des Vaters. Denn der Sohn ist die Gestalt von des Vaters Gottheit, die Werke wirkte. So sieht, wer den Sohn sieht, den Vater. Denn in der väterlichen Gottheit existiert und wird geschaut der Sohn, und die väterliche Gestalt in ihm offenbart in ihm den Vater, und so ist der Vater im Sohne. Und die Eigenheit und Gottheit, die vom Vater ausgehend im Sohne existiert, offenbart den Sohn im Vater und seine immerwährende Untrennbarkeit von ihm. Wer aber hört und sieht, wie das, was vom Vater ausgesagt wird, auch vom Sohne gesagt wird, und zwar nicht als etwas, was seiner Substanz auf Grund der Gnade und Mitteilung zukommt, sondern, weil das Sein des Sohnes selbst eine der väterlichen Substanz eigene Zeugung ist, der wird, wie bereits gesagt, die Stellen richtig verstehen: “Ich im Vater und der Vater in mir” und: “Ich und der Vater sind Eins”, Denn damit, daß der Sohn alles hat, was dem Vater zukommt, ist er wie der Vater. Darum wird er auch zugleich mit dem Vater angezeigt. Denn von einem Vater könnte man nicht reden, wenn es keinen Sohn gäbe. Man kann Gott wohl Schöpfer nennen, ohne damit schon mit Notwendigkeit auch auf die entstandenen Dinge hinzuweisen. Denn er ist auch vor den Geschöpfen Schöpfer; wer ihn aber Vater nennt, zeigt mit dem Vater sofort auch die Existenz des Sohnes an. Darum glaubt auch an den Vater, wer an den Sohn glaubt; denn er glaubt an das, was der Substanz des Vaters eigen ist, und so gibt es nur Einen Glauben an Einen Gott. Und wer den Sohn anbetet und ehrt, der betet im Sohne den Vater an und ehrt ihn in ihm. Denn es gibt nur Eine Gottheit und darum gibt es auch nur Eine Ehre und Eine Anbetung, die im Sohne und durch ihn dem Vater zuteil wird. Wer in dieser Weise anbetet, der betet Einen Gott an; denn Einer ist Gott, und es gibt keinen andern außer ihm. Wenn nun der Vater allein Gott genannt wird, und wenn es nur Einen Gott gibt, und wenn es heißt: “Ich bin” und: “Außer mir ist kein Gott” und: “Ich bin der Erste und ich bin hernach”, so sagt man dies mit Recht; denn es gibt nur Einen und einen alleinigen und ersten Gott. Doch diese Worte führen nicht zur Aufhebung des Sohnes. Ferne sei es! Denn auch Er ist in dem Einen, Ersten und Alleinigen, da er auch des Einen und Alleinigen und Ersten alleiniges Wort, Weisheit und Abglanz ist. Er ist aber gleichfalls auch der Erste, da Er die Fülle der Gottheit des Ersten und Alleinigen und ganz und voll Gott ist. Es sind also diese Worte nicht seinetwegen gesprochen, sondern um Verwahrung einzulegen dagegen, daß ein anderer so sei wie der Vater und dessen Wort; und daß dies wirklich der Gedanke der Propheten ist, ist klar und allen offenbar.</p><p>Doch die Gottlosen führen auch folgende Lästerreden wider den Herrn im Munde und kommen uns mit den Schmähworten: “Seht, Einer und Alleiniger und Erster wird Gott genannt, wie könnt ihr sagen, der Sohn sei Gott? Denn wäre er Gott, so könnte er nicht sagen:”Ich der Alleinige“ und nicht:”Einer ist Gott“. Deshalb müssen wir, so gut es geht, auch den Sinn dieser Worte feststellen, damit alle auch hieraus erkennen, daß die Arianer wirklich Gottesfeinde sind. Wenn also der Sohn mit dem Vater im Kampfe liegt, dann mag er solche Worte vernehmen, und wenn, wie David von Adonias und Absalom hörte, dementsprechend auch der Vater den Sohn sieht, so soll er von sich reden und Äußerungen tun, daß nicht etwa der Sohn sich selbst Gott nennt und den einen und andern vom Vater abwendig macht. Wenn aber, wer den Sohn erkennt, noch mehr den Vater erkennt, da diesen der Sohn ihm offenbart, und wenn er im Worte, wie gesagt, noch mehr den Vater sehen wird, und wenn ferner der Sohn in seiner Ankunft nicht sich selbst, sondern den Vater verherrlichte — wie er ja zu dem, der auf ihn zutrat, sprach:”Was nennst du mich gut? Niemand ist gut als Gott allein“, und auf die Frage, welches das größte Gebot sei im Gesetze, zur Antwort gab:”Höre Israel, der Herr, dein Gott, ist ein einziger Herr“, und zu den Scharen sprach:”Ich bin vom Himmel herabgekommen, nicht, um meinen Willen zu tun, sondern den Willen des Vaters, der mich gesandt hat“, und die Jünger belehrte:”Mein Vater ist größer als ich“ und:”Wer mich ehrt, ehrt den, der mich gesandt hat" —, und wenn der Sohn seinem Vater gegenüber eine solche Stelle einnimmt, wo besteht da ein feindseliges Verhältnis, um solche Aussprüche in diesem Sinne verstehen zu können? Übrigens wenn der Sohn das Wort des Vaters ist, wer wäre — von den Christenfeinden abgesehen — so unverständig um zu glauben, Gott habe dies gesagt, um sein Wort herabzusetzen und aufzuheben? Das ist nicht die Anschauung der Christen, ferne sei dies! Denn nicht wegen des Sohnes steht dies geschrieben, sondern zur Beseitigung der falschen Götter, die sich die Menschen ersonnen haben, und diese Aussprüche haben ihren Sinn und guten Grund.</p><p>Da nämlich die, welche den falschen Göttern anhangen, vom wahren Gotte abfallen, deshalb ruft Gott in seiner Güte und in seiner Fürsorge für die Menschen die Verirrten zurück und spricht: „Ich bin der alleinige Gott“, und: „Ich bin“, und: „Außer mir ist kein Gott“ und dergleichen Worte mehr, um das Nichtseiende zu beseitigen und alle für sich zu gewinnen. Wie wenn einer bei Tag und Sonnenschein einfachhin ein Stück Holz malte, das auch nicht eine Idee von Licht zeigte, und sagen würde, dieses Licht sei die Ursache des Lichtes, und wie dann die Sonne, wenn sie beim Anblick desselben sagen würde: „Ich bin allein das Licht des Tages und es gibt kein anderes Tageslicht außer mir“, dies nicht im Hinblick auf ihren Abglanz sagte, sondern mit Rücksicht auf die Verirrung, die wegen des Bildes vom Holz und wegen der Unähnlichkeit der nichtigen Gestalt sich einstellte, so haben auch die Worte: „Ich bin“, und: „Ich der Alleinige Gott“, und: „Es ist kein anderer außer mir“ den Zweck, die Menschen von den falschen Göttern abzubringen und sie nunmehr zur Erkenntnis seiner als des wahren Gottes zu führen. Gewiß hat Gott, als er dies sagte, durch sein Wort gesprochen, es müßten nur die heutigen Juden auch noch die Behauptung aufstellen, er habe dies nicht durch das Wort gesprochen. Doch auf diese Weise sind jene Worte gesprochen worden, mögen auch die Diabolischen rasen. Denn es erging das Wort des Herrn an den Propheten und man vernahm diese Worte. Wenn aber sein das Wort war, und durch dieses jene Worte gesprochen wurden, und Gott alles, was er sagt und tut, im Worte sagt und tut, so sind sie ja nicht seinetwegen gesagt worden, ihr Gottesfeinde, sondern mit Rücksicht auf das, was ihm fremd ist und nicht von ihm stammt. Denn, um beim genannten Bild zu bleiben, auch die Sonne hätte, wenn sie jene Worte auszusprechen gehabt hätte, mit Rücksicht darauf, daß sie ihren Abglanz nicht außer ihr hat, sondern in ihrem Abglanz ihr Licht zeigt, die Verirrung zurückgewiesen und so sich ausgedrückt. Also nicht zur Aufhebung des Sohnes, auch nicht seinetwegen stehen diese Aussprüche da, sondern zur Beseitigung der Lüge. Im Anfang redete darum Gott zu Adam keine solche Worte, obschon das Wort bei ihm war, durch das alles entstand. Denn es war nicht nötig, da es noch keine Götzen gab. Als aber die Menschen sich gegen die Wahrheit erhoben und sich nach Belieben Götter ersannen, da ist dann zur Beseitigung der nichtseienden Götter das Bedürfnis nach solchen Aussprüchen eingetreten. Und ich erlaube mir noch die Bemerkung, daß solche Aussprüche auch gegen den Unverstand der Christusfeinde schon zum voraus erfolgt sind, damit sie erkennen, daß der Gott, den sie außerhalb der Substanz des Vaters ersinnen, nicht der wahre Gott und nicht Bild und Sohn des alleinigen und ersten Gottes ist.</p><p>Wenn also auch der Vater allein wahrer Gott genannt wird, so ist das nicht zur Beseitigung dessen gesagt, der spricht: „Ich bin die Wahrheit“, sondern wieder nur zur Aufhebung derer, die nicht von Natur wahre Götter sind wie der Vater und dessen Wort. So hat denn auch der Herr alsbald hinzugefügt: „Und den Du gesandt hast, Jesum Christum“. Wenn er aber ein Geschöpf wäre, so hätte er nicht seinem Schöpfer sich zugesellt und zugezählt. Denn welche Gemeinschaft besteht zwischen dem Wahren und Nichtwahren? Nun er sich aber mit dem Vater verband, hat er gezeigt, daß er zur Natur des Vaters gehört, und uns zu erkennen gegeben, daß er wahre Zeugung des wahren Vaters ist. So hatte auch Johannes gelernt und gelehrt, wenn er in seinem Briefe schreibt: „Und wir sind im wahren, in seinem Sohne Jesus Christus. Dies ist aber der wahre Gott und ewiges Leben“. Und da der Prophet von der Schöpfung sagt: „Der allein den Himmel ausgespannt hat“, und Gott: „Ich habe allein den Himmel ausgespannt“, so ist jedermann offenbar, daß in dem Einen auch das Wort des Einen angezeigt wird, in dem alles entstand und ohne das nichts wurde. Wenn also alles durch das Wort entstanden ist, und wenn Gott sagt: „Ich allein“, in dem Einen aber auch der Sohn inbegriffen ist, durch den der Himmel geworden, so wird also auch, wenn es heißt: „Ein Gott“ und: „Ich allein“ und: „Ich der Erste“, in dem Einen, Alleinigen und Ersten das Wort eingeschlossen gedacht wie der Abglanz im Lichte. Dies kann man aber von keinem andern als nur vom Worte annehmen. Denn alles andere trat aus dem Nichtseienden durch den Sohn ins Dasein und steht seiner Natur nach im großen Abstand [von Gott]. Der Sohn aber ist naturhafte und wahre Zeugung aus dem Vater. Darum verrät die Stelle: „Ich der Erste“, welche die Unverständigen zur Verteidigung ihrer Häresie vorbringen zu können glaubten, vielmehr ihre Bosheit Es sagt Gott: „Ich bin der Erste und ich bin hernach“. Wenn er nun den späteren Dingen zugezählt und als deren erster bezeichnet wird, damit sie doch noch später wären als er, dann wird nach eurer Ansicht auch Er den Geschöpfen nur der Zeit nach vorangehen; doch schon das geht über alle Gottlosigkeit. Wenn er aber zum Beweis dafür, daß er nicht aus irgendeinem stamme noch auch jemand vor ihm existiere, sondern daß er Anfang und Ursache von allem sei und zur Widerlegung der heidnischen Fabeln gesagt hat: „Ich der Erste“, so heißt offenbar auch der Sohn, wenn er Erstgeborener genannt wird, nicht deshalb Erstgeborener, weil er zur Schöpfung gezählt wird, sondern um die Erschaffung und Adoption aller durch den Sohn anzuzeigen. Denn wie der Vater Erster ist, so ist auch Er Erster, insofern er Bild des Ersten und der Erste in ihm ist und er Zeugung aus dem Vater ist, und in ihm wird die ganze Schöpfung geschaffen und zum Sohne gemacht.</p><p>Aber auch hiergegen versuchen sie wieder mit ihren Erfindungen anzukämpfen und zu behaupten, Sohn und Vater seien Eins und ähnlich, nicht so, wie die Kirche lehrt, sondern in ihrem Sinne. Sie sagen nämlich: Weil das, was der Vater will, auch der Sohn will, und er weder in den Gedanken noch in den Urteilen widerspricht, sondern in allem mit ihm übereinstimmt, indem er die Identität der Lehren wahrt und in vollem Einklang mit der Unterweisung des Vaters redet und lehrt, darum sind er und der Vater Eins. Das haben nämlich einige von ihnen nicht bloß zu behaupten, sondern sogar zu schreiben sich vermessen. Könnte man aber noch etwas Ungereimteres und Unvernünftigeres behaupten als dieses? Denn wenn deshalb Sohn und Vater Eins sind und das Wort dem Vater in dieser Weise ähnlich ist, dann müssen auch die Engel und die andern uns überragenden Wesen, Mächte und Gewalten, Throne und Herrschaften und die sichtbaren Dinge, Sonne, Mond und Sterne gleichfalls Söhne sein wie der Sohn. Und auch von diesen gilt, daß sie und der Vater Eins sind und daß jedes Wesen Bild und Wort Gottes ist. Denn was Gott will, das wollen auch sie. Und sie stehen weder in ihren Urteilen noch in ihren Lehren mit ihm in Widerspruch, sondern sie sind in allem ihrem Schöpfer Untertan. Sie wären ja in ihrer Herrlichkeit nicht verblieben, wenn nicht auch sie das gewollt hätten, was der Vater wollte. Denn wer nicht beharrte, sondern eine verkehrte Gesinnung annahm, bekam zu hören: „Wie ist Luzifer vom Himmel gefallen, der früh aufging“. Wenn nun diese sich so verhalten, wie ist dann dieser allein eingeborener Sohn und Wort und Weisheit? Oder wenn so viele dem Vater ähnlich sind, wie ist dann dieser allein Bild? Denn auch unter den Menschen werden sich viele finden, die dem Vater ähnlich sind, sehr viele, die Märtyrer geworden sind, und vor ihnen die Apostel und Propheten und vor diesen wieder die Patriarchen. Viele beobachten auch jetzt das Gebot des Heilandes, die barmherzig sind, wie der Vater in den Himmeln, und die Meinung befolgen: „Seid also Nachahmer Gottes als geliebte Kinder und wandelt in Liebe, wie auch Christus uns geliebt hat“. Viele sind auch Nachahmer des Paulus geworden, wie Er Christi Nachahmer; und gleichwohl ist keiner von diesen Wort, noch Weisheit, noch eingeborener Sohn, noch Bild. Und es wagte auch keiner von ihnen zu sagen: „Ich und der Vater sind Eins“ oder: „Ich im Vater und der Vater in mir“. Vielmehr gilt allen das Wort: „Wer ist Dir unter den Göttern ähnlich, o Herr?“ und; „Wer wird dem Herrn unter den Söhnen ähnlich sein?“ Von ihm aber heißt es, er allein sei wahres und naturhaftes Bild des Vaters. Denn wenn wir auch nach dem Bilde geworden sind und Bild und Ehre Gottes heißen, so haben wir ja wieder nicht unsertwegen, sondern dank der Einwohnung des Bildes und der wahren Herrlichkeit Gottes in uns, die ja sein später unsertwegen fleischgewordenes Wort ist, diese Gnade der Berufung.</p><p>Da nun also auch diese ihre Ansicht als unziemlich und unvernünftig sich erweist, so muß man die Ähnlichkeit und Einheit auf die Substanz des Sohnes selbst beziehen. Denn wollte man sich nicht für diese Auffassung entscheiden, dann wird man ihn weder den geschaffenen Wesen gegenüber im Vorteil finden, wie wir gesagt haben, noch wird er dem Vater ähnlich sein, sondern er wird in den Lehren dem Vater ähnlich sein. Er unterscheidet sich vom Vater, weil der Vater Vater ist, die Lehren und der Unterricht vom Vater sind. Wenn also nur hinsichtlich der Lehren und des Unterrichts der Sohn dem Vater ähnlich ist, so wird nach ihrer Ansicht der Vater nur dem Namen nach Vater sein; der Sohn aber wird nicht als unverändertes Bild erscheinen, ja vielmehr überhaupt nicht als dem Vater eigen oder ähnlich. Denn wo kann bei ihm die Rede sein von Ähnlichkeit und Eigenheit, wenn er vom Vater verschieden ist? Denn auch Paulus, der ähnlich wie der Heiland lehrte, war ihm der Substanz nach nicht ähnlich. Sie gehen also in die Irre, wenn sie diese Anschauung haben. Der Solm und der Vater sind vielmehr so Eins, wie wir gesagt haben, und der Sohn ist in der Weise ähnlich und stammt aus dem Vater selbst, wie man den Sohn in seinem Verhältnis zum Vater sehen und erkennen und den Abglanz im Verhältnis zur Sonne sehen kann. Bei dieser Stellung des Sohnes ist nämlich, wenn der Sohn wirkt, der Vater der Wirkende, und wenn der Sohn zu den Heiligen kommt, so ist es der Vater, der im Sohne kommt, wie er selbst verheißen hat in den Worten: „Ich und der Vater werden kommen und Wohnung bei ihm nehmen“. Denn im Bilde wird der Vater geschaut und im Abglanz ist das Licht. Deshalb gibt, wie wir kurz zuvor bemerkt haben, wenn der Vater Gnade und Friede verleiht, dies auch der Sohn, wie Paulus zu verstehen gibt, wenn er in allen Briefen schreibt: „Gnade euch und Friede von Gott, unserem Vater, und dem Herrn Jesus Christus“. Denn eine und dieselbe Gnade ist es, die vom Vater im Sohne gegeben wird, wie das Licht der Sonne und des Abglanzes Eines ist und die Sonne nur durch ihren Abglanz leuchtet. So hat er auch wieder im Segenswunsch für die Thessalonicher: „Er aber, unser Gott und Vater und der Herr Jesus Christus, lenke unsern Weg zu euch“ die Einheit des Vaters und des Sohnes gewahrt. Denn er sagte nicht: „Sie mögen lenken“, wie wenn von beiden, von diesem wie von jenem, die Gnade doppelt verliehen würde, sondern: „Lenke“, um zu zeigen, daß der Vater sie durch den Sohn schenkt. Auf dies hin könnten die Gottlosen wenigstens erröten; doch sie wollen nicht.</p><p>Denn wäre nicht eine Einheit und das Wort nicht des Vaters wesenseigene Zeugung gleich dem Abglanz des Lichtes, wäre vielmehr der Sohn der Natur nach vom Vater verschieden, so genügte es, wenn der Vater allein verliehe, da bei der Verleihung [der Gnaden] keines von den entstandenen Wesen mit dem Schöpfer Gemeinschaft hat. So aber zeigt diese Art von Verleihung auf die Einheit von Vater und Sohn hin. Man würde also nicht von Gott oder den Engeln oder irgendeinem andern Geschöpfe etwas erflehen und nicht sprechen: „Gebe dir Gott und der Engel!“ — sondern vom Vater und Sohne wegen ihrer Einheit und einheitlichen Gabe. Denn durch den Sohn werden die Gaben verliehen und es gibt nichts, was der Vater nicht durch den Sohn wirkt, und so gelangt der Empfänger in den sicheren Besitz der Gnade. Wenn aber der Patriarch Jakob seinen Enkeln Ephraim und Manasse den Segen erteilte mit den Worten: „Der Gott, der mein Hirt ist von meiner Jugend bis auf diesen Tag, der Engel, der mich aus allem Übel errettet hat, segne diese Kinder“, so hat er nicht einen von den geschaffenen, naturhaften Engeln mit Gott, ihrem Schöpfer, in Verbindung gebracht, und nicht mit Umgehung des ihn behütenden Gottes von einem Engel den Segen für seine Enkel erfleht, vielmehr hat er mit den Worten: „Der mich aus allem übel errettet“ gezeigt, daß es nicht einer von den geschaffenen Engeln, sondern das Wort Gottes sei, das er im Segenswünsche mit dem Vater in Verbindung brachte, durch das Gott auch alle rettet, die er retten will. Denn weil er wußte, daß er Engel des großen Rates des Vaters genannt wird, so sagte er von keinem andern als von ihm aus, daß er segne und vom Übel errette. Denn nicht erbat er für sich den Segen von Gott und für seine Enkel vom Engel, sondern von dem, den er selbst also gebeten hatte: „Ich werde Dich nicht entlassen, Du segnest mich denn“. Dieser aber war Gott, wie er selbst sagt: „Ich sah Gott von Angesicht zu Angesicht“. Diesen bat er auch für die Söhne Josephs um den Segen. Es ist also Aufgabe eines Engels, den Auftrag Gottes zu vollziehen, Vielfach zieht er vorher, um den Amorrhiter zu verjagen, und er wird gesandt, um das Volk auf dem Wege zu schützen. Doch auch das ist nicht sein Werk, sondern das Werk Gottes, der ihn beauftragt und abgesandt hat und dessen Sache es auch ist, alle zu retten, die er retten will. Darum war es auch kein anderer als eben Gott, der Herr selbst, der ihm erschien und zu ihm sprach: „Und sieh, ich bin mit dir und behüte dich auf allen Wegen, die du wandelst“. Und kein anderer, sondern wiederum Gott war es, der dem Laban erschien und ihn von seinem Anschlag abhielt, indem er ihm befahl, zu Jakob nichts Böses zu reden, und auch Jakob hat seinerseits niemand andern als Gott, wenn er sagte: „Errette mich aus der Hand meines Bruders Esau; denn ich fürchte mich vor ihm“. Und auch zu seinen Frauen sprach er: „Gott hat dem Laban nicht gestattet, mir Böses zuzufügen“.</p><p>Darum bat auch David niemand andern als Gott selbst um seine Errettung: „Zu Dir, o Herr, rief ich, als ich beängstigt wurde, und Du hast mich erhört. Herr, rette meine Seele von ungerechten Lippen und einer trügerischen Zunge!“ Ihm erstattete er auch seinen Dank und sprach an dem Tage, da ihn der Herr aus der Hand aller seiner Feinde und aus der Hand des Saul befreite, den Lobgesang im 17. Psalm: „Ich will Dich lieben, Herr, meine Stärke; der Herr ist meine Feste und meine Zuflucht und mein Erretter“. Auch Paulus, der viele Verfolgungen ausgestanden hat, dankte niemand anderm als Gott, wenn er sprach: „Aus allem errette mich der Herr, und es wird der erretten, auf den wir gehofft haben“. Und kein anderer als Gott segnete den Abraham und Isaak; und Isaak seinerseits bat für Jakob also um den Segen: „Mein Gott segne dich und lasse dich wachsen und mehre dich, und du sollst zu einer Menge von Völkern werden, und er gebe dir den Segen Abrahams, meines Vaters“. Wenn es aber keines andern, sondern nur Gottes Sache ist, zu segnen und zu retten, und niemand anders es war, der den Jakob errettete als eben der Herr, und der Patriarch ihn als Retter für seinen Jakob anflehte, so brachte er offenbar in seinem Gebete niemand andern mit Gott in Verbindung als dessen Wort, das er darum auch Engel nannte, weil dieses allein es ist, das den Vater offenbart. Dies tat auch der Apostel mit den Worten: „Gnade euch und Friede von Gott, unserem Vater und dem Herrn Jesus Christus“. Denn so war auch der Segen verbürgt wegen der Unzertrennlichkeit des Sohnes vom Vater und weil die gewährte Gnade eine und dieselbe ist. Wenn sie nämlich auch der Vater gewährt, so wird doch die Gabe durch den Sohn verliehen. Und wenn es auch heißt, der Sohn verleihe die Gnade, so ist es doch der Vater, der durch den Sohn und im Sohne sie gewährt. Darum sagt der Apostel im Brief an die Korinthier: „Ich danke meinem Gott allezeit euretwegen für die Gnade Gottes, die euch in Christus Jesus verliehen wurde“. Dies kann man aber auch am Licht und Abglanz sehen. Denn was das Licht beleuchtet, das bescheint auch der Abglanz, und was der Abglanz bescheint, das ist die Beleuchtung durch das Licht. So sieht man auch den Vater, wenn man den Sohn sieht; denn er ist der Abglanz des Vaters, und so sind Vater und Sohn Eins.</p><p>Das kann man aber von den entstandenen und geschaffenen Dingen nicht sagen. Denn wenn der Vater etwas wirkt, dann wirkt dies weder ein Engel noch sonst eines von den Geschöpfen. Denn keines von diesen ist schaffende Ursache, sondern sie gehören zu den entstandenen Wesen. Und da sie zudem auch noch von dem Einen getrennt sind, ihm fernestehen und ihrer Natur nach etwas anderes und Werke sind, so können sie weder wirken, was Gott wirkt, noch, wie bereits gesagt, gemeinsam mit Gott Gnade gewähren, noch wird man, wenn man einen Engel sieht, behaupten können, den Vater gesehen zu haben. Denn die Engel sind dienstbare Geister, zum Dienste abgesandt, wie geschrieben steht, und verkünden die von Gott durch; das Wort gewährten Gaben den Empfängern. Und der sichtbare Engel selbst bekennt, er sei vom Herrn abgesandt worden, wie Gabriel dem Zacharias und der Gottesgebärerin Maria gegenüber bekannte. Und wer die Erscheinung von einem Engel sieht, weiß, daß er den Engel und nicht Gott gesehen hat. Zacharias sah einen Engel, Isaias sah den Herrn. Manoe, der Vater Samsons, sah einen Engel, Moses schaute Gott. Gedeon sah einen Engel, dem Abraham erschien Gott. Und wer Gott sah, sah nicht einen Engel, noch glaubte einer, der den Engel sah, Gott zu sehen. Denn gar sehr oder vielmehr völlig verschieden sind ihrer Natur nach die entstandenen Wesen von Gott, der sie geschaffen hat. Wenn aber einmal einer eine Engelserscheinung hatte und eine Stimme Gottes vernahm, wie es der Fall war im Dornbusch, — „es erschien nämlich der Engel des Herrn in einer Feuerflamme, die aus einem Dornbusch hervorschlug; und es rief der Herr dem Moses aus dem Dornbusch zu: Ich bin der Gott deines Vaters, der Gott Abrahams und der Gott Isaaks und der Gott Jakobs“ — so war hier nicht der Engel der Gott Abrahams, sondern Gott war es, der im Engel redete. Sichtbar war ein Engel, aber in ihm redete Gott. Denn wie Gott in einer Wolkensäule zu Moses im Zelte redete, so erscheint er auch in den Engeln redend. So redete er auch mit dem Sohne des Nave durch einen Engel. Was aber Gott redet, redet er offenbar durch das Wort und durch niemand anders. Da aber das Wort nicht vom Vater getrennt und seiner Substanz nach nicht unähnlich und fremd ist, so sind die Werke, die er wirkt, Werke des Vaters und er setzt ein und denselben Schöpfungsakt. Und was der Sohn gibt, das ist Gabe des Vaters. Und wer den Sohn gesehen, weiß, daß er in diesem nicht einen Engel, auch nicht einen, der größer ist als die Engel, noch überhaupt eines von den Geschöpfen, sondern den Vater selbst gesehen hat. Und wer das Wort hört, weiß, daß er den Vater hört wie der, welcher vom Abglanz beschienen wird, weiß, daß er von der Sonne beleuchtet wird.</p><p>Um diese Anschauung uns beizubringen, hat die göttliche Schrift uns solche Beispiele an die Hand gegeben, wie wir sie oben angeführt haben, mit denen wir die treulosen Juden beschämen und die Anschuldigung der Heiden widerlegen können, die da behaupten und meinen, daß auch wir mit der Dreiheit von vielen Göttern reden. Denn wir führen nicht, wie auch das Gleichnis zeigt, drei Prinzipe oder drei Väter ein, wie die Marcioniten und die Manichäer; denn wir nehmen auch nicht das Bild von drei Sonnen an, sondern die Sonne und ihren Abglanz und das Eine Licht aus der Sonne im Abglanz. So kennen wir nur Ein Prinzip; das schöpferische Wort aber besitzt nach unserer Lehre keine andere Gottheit als die des alleinigen Gottes, weil es aus ihm stammt. Eher verdienten also die Ariomaniten den Vorwurf der Vielgötterei oder auch der Gottesleugnung, weil nach ihrem Geschwätz der Sohn ein Geschöpf von außen und wiederum der Geist aus Nichtseiendem ist. Denn entweder werden sie behaupten, das Wort sei nicht Gott, oder, wenn sie es mit Rücksicht auf die Schrift noch Gott nennen, werden sie sagen, es sei der Substanz des Vaters nicht eigen. Und so müssen sie wohl wegen deren Verschiedenartigkeit viele Götter annehmen, sie müßten denn nur so kühn sein und behaupten, daß wie alles übrige auch das Wort nur auf Grund der Teilnahme Gott genannt werde. Doch wenn auch das ihre Ansicht ist, sind sie gleich gottlos, da sie ja das Wort einen von allen nennen. Uns aber möge so etwas niemals in den Sinn kommen. Denn Eine Gestalt der Gottheit gibt es, die auch im Worte ist, und Einer ist Gott der Vater, der in sich selbst existiert, da er in allem ist, und im Sohne erscheint, da er alles durchdringt, und im Geiste, da er in allem durch das Wort in ihm wirksam ist. Denn so bekommen wir den Einen Gott in der Dreiheit, und wir reden weit gottesfürchtiger als die Häretiker mit ihrer vielgestaltigen und vielteiligen Gottheit, wenn wir die Eine Gottheit in der Dreiheit bekennen.</p><p>Denn wenn es sich nicht so verhält, vielmehr das Wort ein Geschöpf oder Gebilde aus dem Nichtseienden ist, so ist es entweder nicht wahrer Gott, weil es ja eines von den Geschöpfen ist, oder, wenn sie aus Scheu vor der Schrift es doch noch Gott nennen, so müssen sie zwei Götter annehmen: den Schöpfer-Gott und den geschaffenen Gott, und zwei Herren dienen, einem ungewordenen und dem andern, der geworden und geschaffen ist, und sie müssen einen doppelten Glauben haben, einen an den wahren Gott und einen andern an den Gott, der gemacht und von ihnen erdichtet und als solcher bezeichnet wurde. Sie, die so verblendet sind, müssen aber, wenn sie den ungewordenen anbeten, dem gewordenen den Rücken kehren, wenn sie sich aber dem Geschöpf zuwenden, vom Schöpfer sich abkehren. Denn man kann nicht diesen in jenem sehen, weil ihre Naturen und Tätigkeiten sich fremd und voneinander verschieden sind. Ist aber das ihre Anschauung, dann werden sie damit jedenfalls auch mehrere Götter annehmen; denn zu dieser Schlußfolgerung kommen die, die von dem Einen Gott abgefallen sind. Warum zählen sich nun die Arianer, wenn sie so schließen und denken, nicht zu den Heiden? Denn auch diese dienen wie sie der Kreatur anstatt Gott, der alles geschaffen hat. Doch um die Unbesonnenen zu hintergehen, suchen sie den Namen „heidnisch“ von sich fernzuhalten, haben aber insgeheim die gleiche Anschauung wie die Heiden. Denn auch jene ihre Spitzfindigkeit, mit der sie sich gewöhnlich behelfen: „Wir sprechen nicht von zwei Unentstandenen“, bringen sie offenbar nur vor, um die Arglosen zu hintergehen. Sie sagen wohl: „Wir reden nicht von zwei Unentstandenen“, nehmen aber doch zwei Götter an und weisen ihnen verschiedene Naturen zu, die gewordene und die ungewordene. Wenn aber die Heiden Einen Unentstandenen und viele Entstandene verehren, sie aber Einen Unentstandenen und Einen Entstandenen, so unterscheiden sie sich auch damit nicht von den Heiden. Denn der, den sie einen Entstandenen nennen, ist nur einer von vielen; die vielen Götter der Heiden aber haben dieselbe Natur wie dieser Eine. Denn dieser wie jene sind Geschöpfe. Unglücklich sind sie, und zwar umsomehr, als sie mit ihrer christusfeindlichen Anschauung sich selber schaden. Denn sie sind der Wahrheit verlustig gegangen und haben mit ihrer Verleugnung Christi den Verrat der Juden überboten, und die Gotteshasser wälzen sich mit den Heiden, indem sie ein Geschöpf und verschiedenartige Götter anbeten. Denn Einer ist Gott und nicht viele, und Einer ist dessen Wort und nicht viele. Denn Gott ist das Wort, und es allein hat die väterliche Gestalt. Da diese der Heiland selbst war, machte er die Juden zuschanden mit den Worten: „Der Vater, der mich gesandt hat, hat von mir Zeugnis gegeben. Aber ihr habt weder je seine Stimme gehört noch seine Gestalt gesehen, und sein Wort habt ihr nicht bleibend in euch, weil ihr dem nicht glaubt, den er gesandt hat“. Treffend hat er das Wort mit der Gestalt in Verbindung gebracht, um zu zeigen, daß das Wort Gottes selbst Bild, Abriß und Gestalt seines Vaters ist, und daß die Juden, indem sie den nicht aufnahmen, der zu ihnen redete, das Wort nicht aufnahmen, das die Gestalt Gottes ist. Diese hat auch der Patriarch Jakob gesehen, und er wurde gesegnet und erhielt von ihr für Jakob den Namen Israel, wie die göttliche Schrift bezeugt mit den Worten: „Es ging ihm aber die Sonne auf, als er an der Gestalt Gottes vorüberging“. Dieser aber war der, der sagte: „Wer mich gesehen hat, hat den Vater gesehen“, und: „Ich bin im Vater und der Vater ist in mir“, und: „Ich und der Vater sind Eins“. Denn auf diese Weise ist Einer Gott und Einer der Glaube an den Vater und Sohn. Denn da das Wort Gott ist, so ist wiederum der Herr unser Gott ein einziger Herr. Denn des Einen eigener und untrennbarer Sohn ist er gemäß der Eigenheit und Gemeinsamkeit der Substanz.</p><p>Doch auch so kommen die Arianer nicht zur Einsicht und sie sagen: Nicht wie ihr sagt, sondern wie wir wollen. Denn obschon ihr unsere früheren Einfälle widerlegtet, haben wir doch einen neuen gefunden und wir behaupten: So sind Sohn und Vater Eins, und so ist der Vater im Sohne und der Sohn im Vater, wie auch wir in ihm sind. Denn das steht im Johannesevangelium geschrieben, und darum bat Christus für uns in den Worten: „Heiliger Vater, bewahre sie in Deinem Namen, die Du mir gegeben hast, damit sie Eins seien wie auch wir“, und kurz hernach wieder: „Doch nicht allein für diese bitte ich, sondern auch für alle, die durch ihr Wort zum Glauben an mich kommen werden, damit alle Eins seien, wie Du, Vater, in mir und ich in Dir, damit auch sie in uns Eins seien, damit die Welt glaube, daß Du mich gesandt hast. Die Herrlichkeit, die Du mir gegeben hast, habe ich ihnen gegeben, damit sie Eins seien, wie auch wir Eins sind, ich in ihnen und Du in mir, damit sie vollkommen Eins seien, und die Welt erkenne, daß Du mich gesandt hast“. Im Glauben, jetzt einen Vorwand gefunden zu haben, fügen die Hinterlistigen noch folgendes bei: „Wenn, wie wir im Vater Eins werden, so auch Er und der Vater Eins sind, und so auch Er im Vater ist, wie könnt ihr behaupten, er sei der Substanz des Vaters eigen und ähnlich, weil er sagt: “Ich und der Vater sind Eins„ und: “Ich im Vater und der Vater in mir„? Denn entweder müssen auch wir der Substanz des Vaters eigen oder muß auch Er ihr fremd sein, wie auch wir ihr fremd sind“. So lautet ihr albernes Geschwätz. Doch ich sehe in dieser ihrer verkehrten Ansicht nichts anderes als eine unsinnige Tollheit und einen teuflischen Wahnsinn, indem auch sie gleich jenem sprechen: „Zum Himmel wollen wir emporsteigen, und dem Allerhöchsten werden wir gleich sein“. Denn was aus Gnade den Menschen gegeben wird, das wollen sie der Gottheit des Gebers ebenbürtig wissen. Als sie daher vernahmen, daß die Menschen Söhne genannt werden, da wähnten auch sie, dem wahren und naturhaften Sohn gleich zu sein, und da sie jetzt wieder aus dem Munde des Heilands hören: „Damit sie Eins seien wie auch wir“, geben sie sich einer Täuschung hin, und in ihrem Übermut meinen sie, daß auch sie so sein werden wie der Sohn im Vater ist und der Vater im Sohne, und sie beachten nicht, daß der Sturz ihres Vaters, des Teufels, auf Grund eines solchen Wahnes erfolgt ist.</p><p>Wenn also, wie wir schon oft gesagt haben, das Wort Gottes ebenso ist wie wir und sich von uns nur der Zeit nach unterscheidet, so möge es uns ähnlich sein und beim Vater denselben Platz einnehmen wie wir; und es soll weder eingeboren noch einziges Wort oder Weisheit des Vaters heißen, sondern derselbe Name sei uns allen, die wir ihm ähnlich sind, gemeinsam. Denn es gehört sich, daß die, welche eine und dieselbe Natur haben, auch einen gemeinschaftlichen Namen tragen, mögen sie auch zeitlich voneinander verschieden sein. Denn Mensch ist Adam, und Mensch ist auch Paulus, ein Mensch auch, der jetzt entsteht, und die Zeit ändert die Natur des Geschlechtes nicht. Wenn also auch das Wort nur der Zeit nach von uns verschieden ist, dann müßten auch wir wie dieses sein. Doch wir sind weder Wort oder Weisheit, noch ist jenes ein Geschöpf oder Gebilde. Warum sind wir denn alle aus dem Einen entstanden und ist er allein Wort? Doch wenn es auch jenen ansteht so zu reden, für uns schickt es sich nicht, ihre Gotteslästerungen auch nur zu überdenken. Wenn es nun aber auch nicht notwendig wäre, sich mit einer von den Stellen besonders abzugeben, da ihr Sinn so offen liegt und der Gottesfurcht entspricht und wir den rechten Glauben haben, wohlan, so wollen wir gleichwohl, um auch hieraus ihre Gottlosigkeit zu erweisen, so wie wir von unseren Vätern belehrt wurden, in Kürze aus dieser Stelle sie ihrer Andersgläubigkeit überführen. Die göttliche Schrift pflegt für die Menschen die natürlichen Gegenstände zu Bildern und Gleichnissen zu wählen. Das tut sie aber, um aus jenen natürlichen Gegenständen das, was aus freiem Entschluß hervorgeht, als Äußerungen der Menschen kundzugeben. Und auf diese Weise wird ihr Benehmen als schlecht oder als gerecht hingestellt. So kommt sie auf die schlechten Sitten zu sprechen wie, wenn sie mahnt: „Werdet nicht wie Pferd oder Maulesel, die keinen Verstand haben“. Oder wenn er die, welche bereits so geworden sind, also tadelt: „Der Mensch, da er in Ehren stand, begriff es nicht; den unvernünftigen Tieren wurde er gleich und wurde ihnen ähnlich“ und wiederum: „Sie wurden wie geile Pferde“. Und der Heiland sagte, wo er den Herodes charakterisiert: „Saget diesem Fuchse“! Die Jünger aber ermahnte er: „Sieh, ich sende euch wie Schafe mitten unter die Wölfe. Seid also klug wie die Schlangen und einfältig wie die Tauben“! Er sagte aber das nicht, als sollten wir der Natur nach Tiere werden oder Schlangen oder Tauben. Denn so hat er selbst uns nicht gemacht, und darum kennt auch die Natur einen solchen Vorgang nicht. Vielmehr sollten wir die tierischen Triebe der einen fliehen, die Klugheit der Schlange kennen lernen, um von ihr nicht hintergangen zu werden, und die Sanftmut der Taube uns aneignen.</p><p>Aus dem Bereich des Göttlichen aber wählt der Heiland hinwiederum für die Menschen Bilder und sagt: „Seid barmherzig, wie euer Vater im Himmel barmherzig ist“ und: „Ihr sollt vollkommen sein, wie euer himmlischer Vater vollkommen ist“. Aber auch dies sagte er nicht, damit wir wieder werden wie der Vater — denn wie der Vater zu werden, ist uns unmöglich, da wir Geschöpfe sind und aus dem Nichtseienden ins Dasein traten —, nein, so wenig er uns mit den Worten: „Werdet nicht wie ein Pferd“ auffordert, Tiere zu werden, sondern nur, ihr tierisches Wesen nicht nachzuahmen, ebensowenig wollte er mit den Worten: „Seid barmherzig wie der Vater“, daß wir wie Gott werden, sondern nur, daß wir im Hinblick auf seine Wohltaten das Gute, das wir tun, nicht wegen der Menschen, sondern seinetwegen tun, so daß wir von ihm und nicht von den Menschen den Lohn empfangen. Denn wie es einen einzigen, naturhaften, wahren und eingeborenen Sohn gibt und deshalb auch wir Söhne werden, doch nicht wie jener von Natur und in Wahrheit, sondern nach der Gnade dessen, der uns berufen hat, und wir, wenngleich irdische Menschen, Götter genannt werden, nicht wie der wahre Gott oder dessen Wort, sondern so, wie Gott es wollte, der uns diese Gnade gewährt hat, so sind wir auch wie Gott barmherzig, nicht indem wir Gott gleich werden, noch auch von Natur und in Wahrheit Wohltäter sind — denn das Wohltun hat seinen Ursprung nicht in uns, sondern in Gott -, vielmehr sind wir barmherzig, insofern wir das, was von Gott selbst uns in Gnaden zuteil geworden ist, an andere unterschiedslos verteilen und einfach auf alle unsere Wohltätigkeit ausdehnen. Denn wohl nur insoweit und nicht anders können wir seine Nachahmer werden, daß wir seine Gaben einander zukommen lassen. Wie wir aber hierin die treffende und richtige Auffassung haben, so hat auch die Stelle bei Johannes denselben Sinn. Denn er sagt nicht: „Damit wie der Sohn im Vater ist, so auch wir in ihm seien“. Wie wäre das möglich, wo er doch das Wort und die Weisheit Gottes ist, wir aber aus Erde gebildet wurden, und er der Natur und Substanz nach Wort und wahrer Gott ist — denn so sagt auch Johannes: „Wir wissen, daß der Sohn Gottes gekommen ist und uns Einsicht gegeben hat, damit wir den wahren Gott erkennen und wir sind in dem Wahren, in seinem Sohne Jesus Christus. Dieser ist der wahre Gott und das ewige Leben“ —, wir aber durch ihn auf dem Weg der Adoption und der Gnade Söhne werden, da wir an seinem Geiste Anteil haben? „Allen“, sagt er nämlich, „die ihn aufnehmen, gab er Macht, Kinder Gottes zu werden, denen, die an seinen Namen glauben“. Darum ist auch Er die Wahrheit, wie er sagt: „Ich bin die Wahrheit“, und da er sich auch an seinen Vater wandte mit den Worten: „Heilige sie in Deiner Wahrheit; Dein Wort ist Wahrheit“. Wir aber werden nur durch Nachahmung tugendhaft und Söhne.</p><p>Also nicht, damit wir wie er werden, sagte er: „Damit sie Eins seien wie auch wir“, sondern damit so, wie er als Wort im eigenen Vater ist, auch wir im Hinblick auf ihn als unser Vorbild miteinander Eins werden in der Einheit des Herzens und Geistes und nicht geteilter Ansicht seien wie die Korinthier, sondern gleicher Gesinnung wie die Fünftausend in der Apostelgeschichte, die wie Einer waren. Denn es heißt: „wie Söhne“, nicht „wie der Sohn“, und „Götter“, nicht „wie er“, und „barmherzig wie der Vater“, nicht wie der Vater! Vielmehr werden wir, wie gesagt, wenn wir Eins werden wie der Vater und der Sohn, nicht so Eins sein, wie es von Natur der Vater im Sohne ist und der Sohn im Vater, sondern entsprechend unserer Natur und soweit es uns möglich ist, jene Einheit uns zum Vorbild zu nehmen und aus ihr zu lernen, wie wir Eins sein sollen, wie wir auch barmherzig zu sein gelernt haben. Denn naturgemäß bildet Gleiches mit Gleichem eine Einheit, weshalb auch alles Fleisch in der Gattung zusammengehört. Uns ist also das Wort unähnlich, dem Vater aber ähnlich; deshalb ist es von Natur und in Wahrheit mit seinem Vater Eins. Wir aber sind alle miteinander blutsverwandt — denn aus Einem sind wir alle entstanden, und die Natur aller Menschen ist eine und dieselbe —, und werden miteinander Eins erst durch unser Verhältnis, wenn wir nämlich die natürliche Einheit vom Sohne und Vater zum Vorbild nehmen. Wie er nämlich die Sanftmut mit seinem Beispiel lehrte und sagte: „Lernet von mir; denn ich bin sanftmütig und demütig von Herzen“, nicht als sollten wir ihm gleich werden — denn das ist unmöglich —.sondern damit wir im Hinblick auf ihn immer sanft blieben, ebenso nimmt er hier, wo er uns eine echte, feste und unauslöschliche Liebe lehren will, sich zum Beispiel und sagt: „Damit sie Eins seien wie auch wir“. Unsere Einheit ist aber unzertrennlich. So sollen auch sie an unserer unzertrennlichen Natur lernen, in gleicher Weise unter sich die Eintracht zu pflegen. Um aber sicherer zu gehen, wählen die Menschen ihr Vorbild aus dem Bereich des Naturhaften, wie bereits gesagt worden ist. Denn da dieses bleibt und nie sich ändert, wogegen das Verhalten der Menschen sehr wandelbar ist, so ist es ihnen möglich, im Hinblick auf das von Natur Unwandelbare, das Böse zu fliehen und sich nach dem Besten umzubilden. Denn so haben auch die Worte: „Damit auch sie in uns Eins seien“ wieder ihren richtigen Sinn.</p><p>Wenn es also möglich gewesen wäre, daß auch wir wie der Sohn im Vater wären, dann hätte er sagen müssen: „Damit auch sie in Dir Eins sind wie es der Sohn ist im Vater“. Nun aber hat er nicht so gesprochen, sondern er hat mit dem Wort „in uns“ den Abstand und Unterschied angezeigt, nämlich daß nur Er im alleinigen Vater ist, weil allein Wort und Weisheit, wir aber im Sohne und durch ihn im Vater sind. Mit dieser Rede aber gab er nichts anderes zu verstehen als: Durch unsere Einheit sollen auch sie miteinander so Eins werden, wie wir von Natur und in Wahrheit Eins sind; sonst könnten sie nicht Eins werden, wenn sie nicht an uns die Einheit lernten. Und daß die Ausdrucksweise „in uns“ wirklich diese Bedeutung hat, kann man von Paulus vernehmen, der sagt: „Dies aber habe ich auf mich und Apollo übertragen, damit ihr an uns lernt, nicht höher von euch zu denken, als geschrieben steht“. Der Ausdruck „in uns“ bedeutet also nicht: „Im Vater, wie der Sohn in ihm ist“, sondern er ist ein Gleichnis und Bild und steht für den Ausdruck: Von uns sollen sie lernen. Denn wie Paulus für die Korinthier, so ist auch die Einheit des Sohnes und Vaters für alle Vorbild und Muster, an dem sie aufschauend zu der naturhaften Einheit von Vater und Sohn lernen können, wie auch sie unter sich in der Gesinnung Eins werden sollen. Erheischt aber unsere Stelle auch noch eine andere Rechtfertigung, so kann man wiederum die Worte „in uns“ den andern gleichsetzen: Damit sie durch die Kraft des Vaters und des Sohnes Eins werden, da sie dasselbe sagen; denn ohne Gott kann das nicht geschehen. Auch diese Deutung kann man wieder in den göttlichen Aussprüchen finden, so wenn es heißt: „In Gott werden wir Kraft wirken“, und: „In Gott werde ich die Mauer überspringen“, und: „In Dir werden wir unsere Feinde niederstoßen“. Es ist also klar, daß wir, im Namen des Vaters und des Sohnes Eins geworden, das feste Band der Liebe bewahren können. Denn wieder führt der Herr denselben Gedanken weiter und sagt: „Und ich habe die Herrlichkeit, die Du mir gegeben hast, ihnen gegeben, damit sie Eins seien, wie auch wir Eins sind“. Treffend hat er auch hier nicht gesagt: „Damit sie in Dir seien wie ich es bin“, sondern er hat gesagt: „Wie wir“. Denn mit dem Worte „wie“ deutet man nicht die Gleichheit an, sondern ein Bild und Gleichnis von dem in Rede stehenden Gegenstand.</p><p>Das Wort hat also wirklich und wahrhaft mit dem Vater eine und dieselbe Natur. An uns liegt es dann aber, wie gesagt, diese Einheit nachzuahmen. Denn er hat sogleich die Worte hinzugefügt: „Ich in ihnen und Du in mir, damit sie vollkommen Eins seien. Hier erbittet der Herr für uns noch etwas Größeres und Vollkommeneres. Denn offenbar war das Wort in uns; es hat ja unsern Leib angezogen. “Und Du in mir, Vater„; denn Dein Wort bin ich. Und weil Du in mir als Deinem Worte, und ich in ihnen wegen des Leibes, und weil Deinetwegen in mir das Heil des Menschen bewerkstelligt worden ist, so bitte ich Dich, daß auch sie in meinem Leibe und seiner Vollendung Eins werden, indem sie mit ihm eine Einheit bilden und mit ihm Eins werden, damit sie, von mir getragen, zusammen Ein Leib und Ein Geist seien und in einem vollkommenen Manne sich begegnen. Denn wir alle, die wir an demselben teilnehmen, werden Ein Leib, da wir in uns den Einen Herrn haben. Da also dies der Sinn der Stelle ist, so ist die Häresie der Christusfeinde noch schlagender widerlegt. Denn ich muß nochmals darauf zurückkommen und sagen: Hätte er einfach und schlechthin gesagt: Damit sie in Dir Eins seien, oder: Damit sie und ich in Dir Eins seien, dann hätten die Gottesfeinde wenigstens einen unverschämten Vorwand. Nun aber redete er nicht schlechthin so, sondern also: “Wie Du, Vater, in mir, und ich in Dir, damit sie alle Eins seien. Mit dem Worte „wie“ gibt er wieder zu verstehen, daß sie entfernt nicht so sind, wie Er im Vater, und zwar entfernt nicht dem Orte, sondern der Natur nach. Denn nichts ist dem Orte nach Gott fern, sondern nur der Natur nach steht alles ihm fern, und, wie schon gesagt, mit der Partikel „wie“ will man nicht eine Identität oder Gleichheit ausdrücken, sondern ein Gleichnis vorbringen zu einer Aussage über irgendeinen erörterten Gegenstand.</p><p>Auch diese Lehre gibt uns der Heiland wieder selbst, wenn er sagt: „Denn gleichwie Jonas drei Tage und drei Nächte im Bauche des Fisches war, also wird auch der Menschensohn im Herzen der Erde sein“. Doch es war weder Jonas wie der Heiland, noch stieg Jonas in die Unterwelt hinab, noch war der Fisch die Unterwelt. Auch führte der verschlungene Jonas die nicht herauf, die schon zuvor der Fisch verschlungen hatte, sondern er ging allein aus dem Fisch hervor, als diesem geboten wurde. Es wird also mit der Partikel „wie“ keine Identität oder Gleichheit angezeigt, sondern die Verschiedenheit des einen vom andern; aber auf eine gewisse Ähnlichkeit des Jonas weist sie hin wegen der drei Tage. So sind also auch wir, wenn der Herr „wie“ sagt, weder wie der Sohn im Vater, noch sind wir so, wie der Vater im Sohne ist. Denn wie der Vater und Sohn, so werden wir Eins in der Gesinnung und Eintracht des Geistes. Der Heiland wird aber wie Jonas in der Erde sein. Wie aber Jonas nicht der Heiland ist, und der Herr auch nicht so in die Unterwelt hinabstieg, wie jener verschlungen wurde, sondern jeweils ein Unterschied besteht, so werden auch wir, wenn wir Eins werden wie der Sohn im Vater, nicht wie der Sohn noch auch ihm gleich sein; denn wir sind verschiedene Wesen. Deshalb steht bei uns die Partikel „wie“, weil Gegenstände, mit etwas anderem in Beziehung gesetzt, wie dieses werden, wenn sie auch ihrer Natur nach nicht so sind. Deshalb ist der Sohn selbst absolut und ohne jeden Zusatz im Vater. Denn dies kommt ihm von Natur aus zu. Da uns aber dieser naturhafte Besitz abgeht, so benötigen wir ein Bild und Gleichnis, damit er in Bezug auf uns sagen könne: „Wie Du in mir und ich in Dir“. Wenn diese aber, fährt er fort, in dieser Weise vollkommen geworden sind, dann erkennt die Welt, daß Du mich gesandt hast. Denn wäre ich nicht gekommen, und hätte ihren Leib nicht getragen, so wäre keiner von ihnen vollkommen geworden, vielmehr wären alle hinfällig geblieben. Wir also in ihnen, Vater! Und wie Du mir diesen Leib zu tragen gegeben hast, so gib ihnen Deinen Geist, damit auch sie in ihm Eins werden und in mir zur Vollkommenheit gelangen. Denn ihre Vollendung beweist die Ankunft Deines Sohnes, und wenn die Welt sie vollkommen und Gottes voll sieht, wird sie gewiß glauben, daß Du mich gesandt hast und ich erschienen bin. Woher käme ihnen die Vollendung, wenn nicht ich, Dein Wort, ihren Leib angenommen hätte und Mensch geworden wäre und das Werk vollbracht hätte, das Du, Vater, mir gegeben hast? Vollbracht aber ist das Wort, weil die Menschen, erlöst von der Sünde, nicht mehr tot bleiben, sondern vergöttlicht im Aufblick zu uns das Band gegenseitiger Liebe besitzen.</p><p>Wir haben also, soweit die Worte der Stelle selbst eine einfachere Erklärung zuließen, hievon eingehend gehandelt. Der selige Johannes aber wird in seinem Briefe in Kürze und weit genauer als wir den Sinn der Schriftworte dartun und die Auffassung der Gottlosen widerlegen. Er wird uns lehren, wie wir in Gott sind und Gott in uns, und wie wir wieder in ihnen Eins werden, und wie weit der Sohn der Natur nach von uns absteht. Und endlich wird er noch die Arianer von ihrer Meinung abbringen, daß sie wie der Sohn seien, damit nicht auch sie zu hören bekommen: „Du aber bist ein Mensch und nicht Gott“, und: „Setze dich, der du arm bist, nicht dem Reichen gleich“. Darum schreibt Johannes also: „Daran erkennen wir, daß wir in ihm bleiben und er in uns, daß er uns von seinem Geiste gegeben hat“. Wir sind also wegen der uns gewährten Gnade des Geistes in ihm und er in uns. Und da es der Geist Gottes ist, so glaubt man, da Er in uns ist, mit Recht, daß auch wir, weil im Besitze des Geistes, in Gott sind, und so ist Gott in uns. Also nicht so, wie der Sohn im Vater ist, sind auch wir im Vater. Denn der Sohn nimmt am Geiste nicht teil, um dadurch auch im Vater zu sein, noch auch empfängt er den Geist, vielmehr teilt er selbst ihn allen mit. Ferner verbindet nicht der Geist das Wort mit dem Vater, vielmehr empfängt der Geist vom Worte. Und der Sohn ist im Vater als sein eigenes Wort und sein Abglanz, wir aber sind ohne den Geist Gott fremd und ferne. Durch die Teilnahme am Geist werden wir aber mit der Gottheit verbunden, so daß wir unser Sein im Vater nicht uns, sondern dem in uns befindlichen und bleibenden Geist verdanken und zwar solange, als wir ihn durch das Bekenntnis in uns bewahren, wie wiederum Johannes sagt: „Wer bekennt, daß Jesus der Sohn Gottes ist, in dem bleibt Gott und er in Gott“. Wo bleibt also unsere Ähnlichkeit und Gleichheit mit dem Sohne? Oder wird nicht den Arianern von allen Seiten und ganz besonders von Johannes unwiderleglich dargetan, daß in anderer Weise der Sohn im Vater ist und anders wir in ihm sind, und daß weder wir je wie Er sein werden, noch das Wort ist wie wir? Sie müßten denn nur wie immer, so auch jetzt zu behaupten wagen, daß auch der Sohn der Teilnahme am Geiste und der Vervollkommnung seines Wandels seine Existenz im Vater verdankt. Doch es ist wieder mehr als gottlos, eine solche Behauptung auch nur in Erwägung zu ziehen. Er gibt ja, wie gesagt, selbst dem Geiste, und alles, was der Geist hat, hat er vom Worte.</p><p>Wenn also der Heiland in Bezug auf uns sagt: “Wie Du, Vater, in mir und ich in Dir, damit auch sie in uns Eins seien”, so will er damit nicht eine künftige Identität unser mit ihm anzeigen; es wurde dies ja am Beispiel des Jonas nachgewiesen. Vielmehr ist es, wie Johannes geschrieben hat, eine Bitte an den Vater, daß er den Geist durch ihn den Gläubigen gewähre, durch den wir auch in Gott zu sein und insoweit in ihm uns zu verbinden scheinen. Denn da das Wort im Vater ist, der Geist aber vom Worte verliehen wird, so will es, daß wir den Geist empfangen, damit auch wir, wenn wir mit seiner Aufnahme zugleich den Geist des im Vater wohnenden Wortes hätten, durch den Geist im Worte und durch dieses im Vater als Eins erschienen. Wenn er aber sagt: “wie wir”, so heißt dies wieder nichts anderes, als daß diese den Jüngern mitgeteilte Gnade des Geistes dauerhaft und unwiderleglich sein soll. Denn was das Wort von Natur im Vater hat, wie ich vorhin gesagt habe, das will er uns als unwiderrufliche Gabe durch den Geist uns zukommen lassen. Dies erkannte auch der Apostel und darum sagte er: “Wer wird uns von der Liebe Christi scheiden?” “Denn Gottes Gnadengeschenke und die Gnade der Berufung sind unwiderruflich”. Der Geist ist es also, der in Gott ist, und nicht wir an und für sich. Und wie wir wegen des Wortes in uns Söhne und Götter sind, so werden wir im Sohne und Vater sein, und man wird uns im Sohne und Vater als Eins geworden erachten, weil der Geist in uns ist, der in dem im Vater befindlichen Worte ist. Wenn nun jemand wegen einer Schlechtigkeit des Geistes verlustig geht, die Gnade bleibt doch für die, welche wollen, unwiderruflich; es braucht einer nach dem Verlust nur Reue zu erwecken. Es ist aber der nicht mehr in Gott, der gefallen ist, weil der heilige Tröstergeist, der in Gott ist, von ihm gewichen ist, vielmehr wird der Sünder in dem sein, dem er sich unterworfen hat, wie es bei Saul der Fall war. “Denn es wich von ihm der Geist Gottes, und es plagte ihn ein böser Geist”. Wenn nun die Gottesfeinde dies vernehmen, dann sollten sie sich eines Bessern besinnen und sich nicht mehr Gott gleich dünken. Doch sie kommen weder zu dieser Einsicht" — “denn der Gottlose”, heißt es, “weiß nichts von Einsicht” —, noch ertragen sie gottesfürchtige Reden; schon beim bloßen Anhören fallen sie ihnen lästig.</p><p>Sieh doch, wie sie sich nicht erschöpfen können in ihren Gottlosigkeiten, sondern wie Pharao sich verhärten, und wie sie, wenn sie wieder von den menschlichen Äußerungen des Erlösers in den Evangelien hören und solche sehen, schließlich wie der Samosatener die väterliche Gottheit des Sohnes ganz vergessen, und mit ihrer losen Zunge keck behaupten: Wie kann der Sohn von Natur aus dem Vater und ihm wesensgleich sein, wenn er doch sagt: “Mir ist alle Gewalt gegeben”, und: “Der Vater richtet niemand, sondern hat das ganze Gericht dem Sohne übergeben”, und: “Der Vater liebt den Sohn und hat alles in seine Hand gegeben. Wer an den Sohn glaubt, hat das ewige Leben”, und wieder: “Alles ist mir von meinem Vater übergeben worden, und niemand kennt den Vater als der Sohn und dem der Sohn ihn offenbaren will, und ferner:”Alles, was mir der Vater gegeben hat, wird zu mir kommen“. Auf dies hin sagen sie: Wenn er, wie ihr behauptet, Sohn von Natur war, dann hatte er nicht nötig zu empfangen, sondern er hatte dies von Natur als Sohn. Oder wie kann der von Natur und wahrhaft Kraft des Vaters sein, der in der Stunde seines Leidens spricht:”Jetzt ist meine Seele betrübt, und was soll ich sagen? Vater, rette mich aus dieser Stunde! Doch darum bin ich in diese Stunde gekommen. Vater, verherrliche Deinen Namen! Da kam eine Stimme vom Himmel: “Ich habe verherrlicht und werde ferner verherrlichen”. Und ähnlich rief er wieder: “Vater, wenn es möglich ist, so gehe dieser Kelch an mir vorüber!”, und: “Als Jesus dies gesagt hatte, ward er im Geiste betrübt, und er bezeugte und sprach: Wahrlich, wahrlich, ich sage euch, einer von euch wird mich verraten”. Auf dies hin bemerken die Böswilligen: Wenn er eine Macht gewesen wäre, dann hätte er nicht gezagt, hätte vielmehr auch andern das Können gegeben. Und weiter behaupten sie: War er von Natur die wahre und des Vaters eigene Weisheit, warum steht dann geschrieben: “Und Jesus nahm zu an Weisheit und Alter und Gnade vor Gott und den Menschen”. Und als er in die Gegend von Caesarea Philippi kam, fragte er seine Jünger, für wen ihn die Menschen halten. Und wie er nach Bethanien kam, fragte er, wo Lazarus liege. Später fragte er auch die Jünger: “Wieviel Brote habt ihr? Wie nun, wenden sie ein, kann der Weisheit sein, der an Weisheit zunahm und das nicht wußte, was er von andern zu erfahren wünschte. Ferner bekommt man auch das von ihnen zu hören: Wie kann der des Vaters eigenes Wort sein, ohne das der Vater niemals war, und durch das er nach eurer Ansicht alles schafft, der am Kreuze ausruft:”Mein Gott, mein Gott, warum hast Du mich verlassen?“, zuvor aber flehet:”Verherrliche Deinen Namen!“, und: ”Verherrliche Du mich, Vater, mit der Herrlichkeit, die ich bei Dir hatte, ehe die Welt war“. An einsamen Orten aber betete er und hieß seine Jünger beten, damit sie nicht in Versuchung fallen.”Der Geist ist willig“, sprach er,”das Fleisch aber ist schwach“, und:”Jenen Tag und jene Stunde weiß niemand, auch nicht der Engel noch der Sohn". Dazu bemerken dann die Elenden wieder; Wenn, wie ihr meint, der Sohn immer bei Gott wäre, so wäre ihm jener Tag nicht unbekannt, vielmehr wüßte er ihn als Wort. Und wenn er mit ihm existierte, so würde er nicht von ihm verlassen, noch auch würde er um Verherrlichung bitten, wenn er sie im Vater hätte, noch würde er überhaupt flehen; denn als Wort hätte er überhaupt kein Bedürfnis. Doch, weil eben ein Geschöpf und eines von den entstandenen Wesen, darum redete er so und erflehte, was er nicht hatte. Denn den Geschöpfen ist es eigen, bedürftig zu sein und zu erbitten, was sie nicht besitzen.</p><p>Solche Reden bringen also die Gottlosen vor. Doch sie hätten, wenn sie einmal so denken, noch verwegener fragen sollen: „Warum ist überhaupt das Wort Fleisch geworden?“ Und dann hätten sie wieder hinzufügen sollen: „Wie konnte er denn als Gott Mensch werden? Oder wie konnte der Unkörperliche einen Leib tragen?“ Oder sie hätten mehr jüdisch wie ein Kaiphas sagen sollen: „Warum machte überhaupt Christus, der ein Mensch war, sich zu Gott?“ Denn in solchen und ähnlichen Reden murrten damals die Juden, die Augenzeugen waren; jetzt aber verweigern die Ariomaniten, die es lesen, den Glauben und haben sich zu Gotteslästerungen hinreißen lassen. Wenn man nun die Reden der einen und der andern miteinander vergleicht und untersucht, so wird man jedenfalls finden, daß sie in demselben Unglauben zusammentreffen, daß ihr Frevelmut gleich groß ist, und ihr gemeinsamer Kampf uns gilt. Denn die Juden sagten: „Wie kann er, ein Mensch, Gott sein?“ — Die Arianer aber: „Wenn er wahrer Gott aus Gott war, wie konnte er dann Mensch werden?“ Die Juden nahmen Ärgernis und spöttelten: „Wenn dieser Gottessohn wäre, hätte er nicht am Kreuze gelitten“. Die Arianer aber sagen uns umgekehrt: „Wie wagt ihr zu behaupten, dieser, der einen leidensfähigen Leib hat, sei das wesenseigene Wort des Vaters?“ Wie ferner die Juden den Herrn zu töten suchten, weil er Gott seinen Vater nannte und sich ihm gleichmachte, da er wirke, was der Vater wirkt, so lernten auch die Arianer zu behaupten, daß er Gott nicht gleich sei, noch auch Gott der eigene und naturhafte Vater des Wortes; und sie suchen sogar die zu töten, die dieser Anschauung sind. Wieder lassen sich die Juden vernehmen: „Ist dieser nicht der Sohn Josephs, dessen Vater und Mutter wir kennen?“ Wie sagt er also: „Ehe Abraham ward, bin ich, und ich bin vom Himmel herabgekommen?“ Die Arianer horchen auf sie und sprechen auch in gleicher Weise: „Wie kann der Wort oder Gott sein, der wie ein Mensch schläft, weint, fragt?“ Denn die einen wie die andern leugnen wegen der menschlichen Zuständigkeiten, denen der Heiland in seinem Fleisch ausgesetzt war, die Ewigkeit und Gottheit des Wortes.</p><p>Da nun solcher Wahnwitz jüdisch ist und als solcher vom Verräter Judas stammt, so sollen sie sich offen wieder als die Jünger des Kaiphas und Herodes bekennen und nicht den Judaismus unter dem Namen des Christentums verdecken, und sie sollen doch rundweg, wie wir schon oben gesagt haben, die Ankunft des Erlösers im Fleische leugnen; denn das ist die für ihre Häresie charakteristische Anschauung. Oder wenn sie aus Gefälligkeit gegen Konstantius und mit Rücksicht auf die, welche sich von ihnen hintergehen ließen, sich scheuen, offen zum Judentum sich zu bekennen und sich beschneiden zu lassen, so sollen sie auch nicht den Juden nachsprechen. Denn es gehört sich, daß man auch die Anschauung derer von sich weist, deren Namen man sich verbittet. Denn wir sind Christen, Arianer; Christen sind wir und wissen die Frohbotschaft vom Heiland zu würdigen, und nicht steinigen wir ihn mit den Juden, wenn wir ihn über seine Gottheit und Ewigkeit vernehmen, noch nehmen wir mit euch Ärgernis an den demütigen Worten, die er als Mensch für uns spricht. Wenn also auch ihr Christen werden wollt, dann laßt vom Wahnsinn des Arius ab und wascht euer von gotteslästerlichen Reden besudeltes Gehör mit den Reden der Gottesfurcht, und seid versichert, daß ihr auch von der Verkehrtheit der jetzigen Juden ablassen werdet, wenn ihr aufhört, Arianer zu sein, und daß alsbald wie nach einer Finsternis die Wahrheit euch leuchten wird. Auch werdet ihr uns nicht mehr zum Vorwurf machen, daß wir von zwei Ewigen reden, und überdies werdet auch ihr erkennen, daß der Herr wahrer und naturhafter Sohn Gottes ist, und nicht als schlechthin ewig, sondern als mitexistierend in der Ewigkeit des Vaters sich zeigt. Es werden nämlich Dinge ewig genannt, deren Schöpfer er ist. So steht im 23. Psalm geschrieben: „Erhebet, Fürsten, eure Tore, und öffnet euch, ihr ewigen Tore!“ Offenbar sind aber auch diese durch ihn entstanden. Wenn er aber auch selbst vom Ewigen Schöpfer ist, wer von uns wird noch weiter bezweifeln können, daß er auch vor diesem Ewigen existiert? Doch nicht so fast aus seiner Eigenschaft der Ewigkeit wird er als Herr erkannt, als vielmehr daraus, daß er Gottes Sohn ist. Denn als Sohn ist er vom Vater untrennbar, und es war nicht einmal, da er nicht war, sondern er war immer. Und als Bild und Abglanz des Vaters hat er auch die Ewigkeit des Vaters. Daß sie nun der verkehrten Auffassung der Schriftstellen, auf die sie sich berufen, überwiesen sind, kann man wohl aus dem in Kürze oben Gesagten abnehmen. Daß sie aber auch in dem, was sie eben wieder in den Evangelien finden wollen, ihre haltlose Ansicht verraten, ist leicht einzusehen, wenn wir in erster Linie auch hier auf das Endziel unseres christlichen Glaubens achten und mit diesem gleich einer Richtschnur uns nach der Mahnung des Apostels auf die Lektüre der göttlich inspirierten Schrift verlegen. Denn die Christusfeinde irrten vom Weg der Wahrheit ab, weil sie diese Richtschnur nicht kannten, und sie strauchelten am Stein des Anstoßes, weil sie anders dachten als man denken muß.</p><p>Endziel und Signatur der Heiligen Schrift ist nun, wie wir oft gesagt haben, ihre Doppellehre vom Erlöser, wonach er nämlich immer Gott war und Sohn ist als Wort, Abglanz und Weisheit des Vaters, und anderseits später unsertwegen aus der Jungfrau und Gottesgebärerin Maria Fleisch angenommen hat und Mensch geworden ist. Und man kann ihn in der ganzen göttlich inspirierten Schrift angezeigt finden, wie der Herr selbst gesagt hat: „Ihr durchforscht die Schriften; denn sie sind es, die Zeugnis von mir geben“. Um aber nicht mit der Aufzählung aller Stellen weitschweifig zu werden, wollen wir, statt alle anzuführen, uns beschränken auf die Worte des Johannes: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort. Dies war im Anfang bei Gott. Alles ist durch dasselbe entstanden, und ohne dasselbe ist nichts entstanden“, hernach: „Und das Wort ist Fleisch geworden und hat unter uns gewohnt, und wir haben seine Herrlichkeit gesehen als die Herrlichkeit des Eingeborenen vom Vater“, und auf Paulus, der schreibt: „Der, da er in Gottes Gestalt war, es für keinen Raub hielt, Gott gleich zu sein, sondern sich selbst entäußerte, Knechtsgestalt annahm, den Menschen gleich ward und im Äußern wie ein Mensch befunden wurde. Er erniedrigte sich selbst und wurde gehorsam bis zum Tode, ja bis zum Tode am Kreuze“. Darum wird man, wenn man in demselben Sinn die ganze Schrift durchgehen wollte, ersehen, daß im Anfang der Vater zu diesem sagte: „Es werde Licht“, und: „Es werde das Firmament“, und: „Laßt uns den Menschen machen“, in der Fülle der Zeiten aber ihn in die Welt gesandt hat, nicht daß er die Welt richte, sondern daß die Welt durch ihn gerettet werde, und daß von ihm geschrieben steht; „Sieh, die Jungfrau wird empfangen und einen Sohn gebären, und sie werden seinen Namen Emmanuel, d. h. Gott mit uns, nennen“.</p><p>Wer also an die göttliche Schrift sich wendet, der soll die Stellen im Alten Testament verstehen lernen, aus den Evangelien aber soll er abnehmen, daß der Herr Mensch geworden ist. „Denn das Wort“, heißt es, „ist Fleisch geworden und hat unter uns gewohnt“. Es ist aber Mensch geworden und nicht zu den Menschen gekommen. Denn das muß man wissen, damit nicht die Gottlosen auch darauf verfallen und einige hintergehen, und diese dann zum Glauben kommen, daß das Wort wie in früheren Zeiten zu einzelnen Heiligen, so auch jetzt zu einem Menschen kam, ihn heiligte und sich in ihm wie in den andern offenbarte. Denn, wenn dem so wäre, und es bloß im Menschen erschienen wäre, so wäre das nichts Auffallendes, noch auch hätten die, welche es sahen, voll Staunen gefragt: „Woher stammt dieser?“, und: „Warum machst Du Dich, der Du ein Mensch bist, zu Gott?“ Denn sie waren ja gewohnt, zu hören: Und es erging das Wort an die einzelnen Propheten. Jetzt aber, da Gottes Wort, durch das alles entstanden ist, sich herabließ, auch Menschensohn zu werden, und sich erniedrigte und Knechtsgestalt annahm, deshalb ist den Juden das Kreuz Christi ein Ärgernis, uns aber ist Christus Gottes Kraft und Gottes Weisheit. „Denn das Wort ist“, wie Johannes gesagt hat, „Fleisch geworden“. Es pflegt nämlich die Schrift den Menschen Fleisch zu nennen, wie es beim Propheten Joel heißt: „Ich werde von meinem Geist auf alles Fleisch ausgießen“, und wie Daniel zu Astyages gesagt hat: „Ich verehre nicht Gebilde von Menschenhänden, sondern den lebendigen Gott, der den Himmel und die Erde geschaffen hat und die Herrschaft über alles Fleisch besitzt“. Denn unter Fleisch versteht auch Er wie Joel das Menschengeschlecht.</p><p>Vor alters kam es also zu einzelnen Heiligen und heiligte die, die es würdig aufnahmen, und es hat nicht geheißen, das Wort sei Mensch geworden, als jene geboren wurden, noch auch, es habe gelitten, als jene litten. Als es aber einmal in der Fülle der Zeiten aus Maria erschienen war, die Sünde aufzuheben — denn so gefiel es dem Vater und er sandte seinen Sohn, geboren aus dem Weibe, gestellt unter das Gesetz —, damals ist gesagt worden, daß es Fleisch annahm und Mensch geworden ist und im Fleische für uns gelitten hat, wie Petrus sagt: „Da nun Christus im Fleische für uns gelitten“. Damit sollte erwiesen werden, und wir alle sollten zum Glauben kommen, daß er, der immer Gott war und die heiligte, bei denen er Einkehr nahm, und alles nach dem Willen des Vaters anordnete, später auch unsertwegen Mensch geworden ist und die Gottheit leibhaftig, wie der Apostel sagt, im Fleische Wohnung genommen hat. Das heißt soviel, als sagte er: Als Gott hatte er seinen eigenen Leib und ist, indem ihm dieser als Werkzeug diente, unsertwegen Mensch geworden. Deshalb wird das, was dem Fleische eigen ist, ihm zugeschrieben, weil er in ihm war, wie das Hungern, Dürsten, Leiden, Ermüden und Ähnliches, dem das Fleisch ausgesetzt ist. Die Werke aber, die dem Worte selbst zukommen, als: Tote erwecken, Blinden das Gesicht geben, vom Blutfluß heilen, vollbrachte es selbst durch seinen eigenen Leib. Das Wort trug die Schwächen des Fleisches als seine eigenen; denn ihm gehört das Fleisch. Und das Fleisch diente den Werken der Gottheit, weil sie in ihm war; denn Gott gehörte der Leib. Treffend aber hat der Prophet gesagt: „Er trug“ und nicht hat er gesagt: Er heilte selbst unsere Schwächen, damit er nicht als außerhalb des Leibes befindlich und ihn bloß heilend, wie er es immer getan hat, die Menschen wieder dem Tode unterworfen ließe. Unsere Schwächen aber trägt er, und unsere Sünden nimmt er auf sich, damit es klar werde, daß er unsertwegen Mensch geworden, und daß der Leib, der sie trägt, ihm gehört. Er selbst litt keinen Schaden, wenn er unsere Sünden mit seinem Leibe am Holz emportrug, wie Petrus gesagt hat. Wir Menschen aber wurden von unsern Leiden erlöst und mit der Gerechtigkeit des Wortes erfüllt.</p><p>Daher war das Wort nicht außer dem Fleische, als dieses litt; deshalb spricht man auch von seinem Leiden. Wenn aber das Wort in göttlicher Weise die Werke des Vaters wirkte, war das Fleisch nicht außer ihm, vielmehr wirkte diese wieder der Herr gerade im Leibe. Deshalb sagte er auch als Menschgewordener: „Wenn ich die Werke meines Vaters nicht tue, so glaubet mir nicht! Wenn ich sie aber tue, so glaubet, wenn ihr mir nicht glauben wollt, doch meinen Werken, damit ihr erkennet, daß in mir der Vater ist und ich in ihm“. Gewiß streckte er in menschlicher Weise seine Hand aus, da es einmal sein mußte, die fieberkranke Schwiegermutter des Petrus wiederaufzurichten, in göttlicher Weise aber hob er die Krankheit. Und bei dem Blindgeborenen entnahm er dem Fleische den menschlichen Speichel, in göttlicher Weise aber öffnete er mit dem Kote die Augen. Bei Lazarus ließ er als Mensch eine menschliche Stimme hören, in göttlicher Weise aber erweckte er als Gott den Lazarus von den Toten. Dies aber geschah so und nahm man wahr, weil er nicht dem Scheine nach, sondern in Wirklichkeit einen Leib hatte. Es geziemte sich aber, daß der Herr, wenn er menschliches Fleisch anzog, dieses voll und ganz mit all seinen Leiden anzog, damit, wie wir den Leib ihm eigen nennen, so auch die Leiden des Leibes nur ihm zugeschrieben werden, wenn sie auch seine Gottheit nicht berührten. Wenn also der Leib einem andern gehörte, dann könnte man jenem auch die Leiden zuschreiben, wenn aber das Fleisch dem Worte angehört — denn das Wort ist Fleisch geworden —, so müssen auch die Leiden des Fleisches von ihm ausgesagt werden, dem auch das Fleisch gehört. Von dem man aber die Leiden aussagt, wie solche besonders das Verurteiltwerden, Gegeißeltwerden, Dürsten, das Kreuz und der Tod sind und die weiteren Schwächen des Leibes, von dem kommt auch die gute Tat und die Gnade. Deshalb werden also folgerichtig und billig solche Leiden nicht von einem andern, sondern vom Herrn ausgesagt, damit auch die Gnade von ihm komme, und wir nicht Anbeter eines andern, sondern wahre Gottesverehrer werden, weil wir keines von den entstandenen Wesen und nicht irgendeinen gewöhnlichen Menschen, sondern den naturhaften und wahren Sohn aus Gott und zwar ihn auch, nachdem er Mensch geworden ist, gleichwohl als Herrn, Gott und Heiland anrufen.</p><p>Wer aber fände das nicht wunderbar oder wer sähe nicht mit uns hierin etwas wahrhaft Göttliches? Denn wenn die Werke der Gottheit des Wortes nicht durch den Leib erfolgt wären, so wäre der Mensch nicht vergöttlicht worden, und ferner wäre der Mensch nicht voll und ganz von den Schwächen des Fleisches befreit worden, wenn sie nicht dem Worte zugesprochen worden wären. Vielmehr wäre, wenn sie wohl auch auf eine kurze Zeit gewichen wären, wie schon gesagt, die Sünde und das Verderben wieder in ihm geblieben, wie es zuvor bei den Menschen der Fall war. Das läßt sich beweisen. Viele sind nämlich heilig und von jeder Sünde rein gewesen: Jeremias wurde schon vom Mutterleibe an geheiligt, Johannes hüpfte, als er noch im Mutterleibe war, bei der Stimme der Gottesgebärerin Maria freudig auf. Und doch „herrschte der Tod von Adam bis auf Moses auch über die, die nicht durch eine ähnliche Übertretung wie Adam gesündigt haben“. Und so blieben die Menschen trotzdem sterblich und den natureigenen Leiden ausgesetzt. Nun aber das Wort Mensch geworden ist und die Schwächen des Fleisches sich zu eigen gemacht hat, so berühren diese den Leib nicht mehr wegen des in ihm befindlichen Wortes. Vielmehr sind sie von ihm aufgezehrt worden, und nunmehr bleiben die Menschen nicht mehr gemäß der ihnen eigenen Leiden sündhaft und tot, sondern auferstanden in der Macht des Wortes verbleiben sie immer unsterblich und unvergänglich. Und weil das Fleisch aus der Gottesgebärerin Maria geboren wird, deshalb sagt man vom Worte selbst, es sei geboren worden, vom Worte, das nun den andern den Anfang ihrer Existenz gewährt, um auf sich unsere Geburt zu übertragen, und damit wir nicht mehr als bloße Erde zur Erde zurückkehren, sondern, weil mit dem vom Himmel stammenden Worte verbunden, von ihm in den Himmel geführt werden. Es hat also auch die andern Leiden des Leibes nicht ohne Grund auf sich übertragen, sondern damit wir nicht mehr als Menschen, sondern dem Wort zu eigen am ewigen Leben teilnähmen. Denn wir sterben nicht mehr in Adam infolge der ersten Geburt, sondern wir werden nunmehr, da unsere Geburt und jede fleischliche Schwäche auf das Wort übertragen ist, von der Erde auferweckt, da der Fluch der Sünde um dessentwillen aufgehoben ist, der in uns unsertwegen zum Fluch geworden, ist, — was doch ganz natürlich. Denn wie wir alle, die wir von der Erde stammen, in Adam sterben, so werden wir, von oben aus dem Wasser und Geiste wiedergeboren, alle in Christus lebendig gemacht, weil das Fleisch nicht mehr irdisch, sondern nunmehr selbst zum Wort geworden ist — wegen des Wortes Gottes, das unsertwegen Fleisch wurde.</p><p>Um aber die Leidensunfähigkeit der Natur des Wortes und seine wegen des Fleisches ihm zugeschriebenen Schwächen genauer erkennen zu können, ist es gut, den seligen Petrus zu vernehmen. Denn er ist wohl ein glaubwürdiger Zeuge über den Heiland. Er schreibt nun in seinem Briefe also: „Da also Christus für uns im Fleische gelitten hat“. Wenn es also von ihm heißt, daß er hungere, dürste, müde sei, nicht wisse, schlafe, weine, bitte, fliehe, geboren werde, um Abwendung des Kelches bitte, kurz, wenn ihm einfach alle Zuständlichkeiten des Fleisches zugeschrieben werden können, so kann man mit Recht bei jeder einzelnen sagen; Da also Christus für uns im Fleische hungert und dürstet; da er für uns im Fleische nicht zu wissen gestehen muß und gegeißelt wird und ermüdet; da er wieder im Fleische erhöht und geboren wird und zunimmt; da er im Fleische sich fürchtet und verbirgt; da er für uns im Fleische sagt: „Wenn möglich gehe dieser Kelch an mir vorüber“ und geschlagen wird und empfängt und überhaupt bei allem ähnlichen: „für uns im Fleische“. Denn darum hat auch der Apostel selbst gesagt: „Da Christus also gelitten hat“, nicht in der Gottheit, sondern „für uns im Fleische“, damit man nicht die Leiden dem Worte selbst, sondern dem Fleische als natureigen zuerkenne. Man nehme also an den menschlichen Äußerungen kein Ärgernis, erkenne vielmehr, daß das Wort selbst seiner Natur nach leidensunfähig ist, und daß gleichwohl diese ihm wegen des Fleisches, das er anzog, zugeschrieben werden, da sie ja dem Fleische eigen sind, der Leib aber wieder dem Heiland eigen ist. Von Natur leidensunfähig bleibt er, wie er ist, und nimmt an diesen Schwächen keinen Schaden, vielmehr vertilgt und vernichtet er sie. Die Menschen aber, deren Leiden auf den Leidensunfähigen übergegangen und ausgetilgt worden sind, werden nun auch ihrerseits auf ewig leidensunfähig und von den Leiden frei, wie Johannes in den Worten gelehrt hat: „Und ihr wisset, daß jener erschienen ist, um unsere Sünden wegzunehmen; und in ihm ist keine Sünde“. Da aber dem so ist, so wird kein Häretiker mit dem Vorwurf kommen können: „Warum steht das von Natur sterbliche Fleisch wieder auf? Wenn es aber wieder aufersteht, warum hungert und dürstet und leidet es nicht wieder und bleibt unsterblich? Es ist ja doch aus der Erde entstanden, und wie kann das Naturhafte an ihm aufhören zu sein?“ Dann könnte ja das Fleisch einem solch zanksüchtigen Häretiker die Antwort geben: Ich bin aus der Erde, und damit der Natur nach sterblich, doch später bin ich das Fleisch des Wortes geworden, und dieses trug meine Leiden, obschon es leidensfrei ist. Ich bin von diesem frei geworden, und ich gebe mich nicht dazu her, ihnen fürder zu dienen, weil der Herr mich von ihnen befreit hat. Wenn du mir also vorwirfst, daß ich des natürlichen Verderbens losgeworden bin, so sieh zu, daß du es nicht auch tadelst, daß das Wort Gottes meine Knechtsgestalt angenommen hat. Denn wie der Herr mit der Annahme des Leibes Mensch geworden ist, so werden auch wir Menschen vom Worte in seinem Fleische angenommen und vergöttlicht und erben von nun an ewiges Leben.</p><p>Das mußten wir zuerst untersuchen, damit wir, wenn wir sehen, wie er durch das Werkzeug seines Leibes in göttlicher Weise etwas tut oder sagt, erkennen, daß er als Gott dies wirkt und umgekehrt, wenn wir wahrnehmen, wie er in menschlicher Weise sich ausdrückt und leidet, uns wohl bewußt bleiben, daß er das Fleisch an sich trägt und Mensch geworden ist und daß er so handelt und redet. Denn wenn wir uns bewußt bleiben, was jedem Teil eigen ist, und das eine wie das andere von dem Einen vollzogen sehen und erkennen, dann haben wir den richtigen Glauben und werden wohl nie irre gehen. Wenn aber einer deshalb, weil er das Wort Göttliches vollbringen sieht, den Leib leugnen, oder weil er die Äußerungen des Körpers wahrnimmt, die Erscheinung des Wortes im Fleische in Abrede stellen will, oder auf Grund der menschlichen Äußerungen vom Wort eine niedrige Anschauung hat, so ist ein solcher eher ein jüdischer Wirt, der Wasser unter Wein mischt, und er wird das Kreuz für ein Ärgernis und wie ein Heide die Predigt für Torheit halten, wie es ja so auch den Arianern ergangen ist. Denn sie sahen nur auf die menschlichen Äußerungen des Heilandes und hielten ihn darum für ein Geschöpf. Sie hätten nun auch auf die göttlichen Äußerungen des Wortes achten sollen und dann seine leibliche Geburt überhaupt leugnen und sich fortan den Manichäern zuzählen sollen. Doch mögen jene endlich einmal zur Einsicht kommen, daß das Wort Fleisch geworden ist. Wir aber wollen das Endziel des Glaubens festhalten und erkennen, daß das einen richtigen Sinn hat, was diese falsch auffassen. Denn Stellen wie: „Der Vater liebt den Sohn und hat alles in seine Hand gegeben“, und; „Alles ist mir von meinem Vater übergeben worden“, und: „Ich kann aus mir selbst nichts tun, sondern ich richte, wie ich höre“, und alle dergleichen Stellen weisen nicht darauf hin, daß der Sohn dies einmal nicht gehabt habe. Denn wie hätte das, was der Vater hat, der nicht ewig gehabt, der allein der Substanz nach Wort und Weisheit des Vaters ist und der sagt: „Alles, was der Vater hat, ist mein“, und: „Was mein ist, gehört dem Vater“? Denn wenn dem Sohn gehört, was der Vater hat, und der Vater dies immer hat, so gehört offenbar das, was der Sohn besitzt, dem Vater und ist immer in ihm. Er sagt also dies nicht, weil er es einmal nicht hatte, sondern, weil der Sohn, was er hat, von Ewigkeit vom Vater besitzt.</p><p>Denn damit nicht einer, wenn er den Sohn im Besitz alles dessen, was der Vater hat, sieht, auf Grund der unveränderlichen Ähnlichkeit und des Gleichstandes des Besitzes sich in die Gottlosigkeit des Sabellius verirre und glaube, er sei der Vater, deshalb hat er gesagt: „Es wurde mir gegeben“, und: „Ich empfing“, und; „Es wurde mir übergeben“, also nur um zu zeigen, daß nicht Er der Vater ist, sondern das Wort des Vaters und sein ewiger Sohn, der eben wegen seiner Ähnlichkeit mit dem Vater ewig besitzt, was er von ihm hat und, weil er Sohn ist, vom Vater hat, was er ewig hat. Denn daß die Ausdrücke „es wurde gegeben“ und „es wurde übergeben“ und die ihnen ähnlichen die Gottheit des Sohnes nicht abschwächen, sondern ihn vielmehr als wahrhaften Sohn bekunden, kann man den Aussprüchen selbst abnehmen. Wenn nämlich ihm alles übergeben wurde, so ist er fürs erste ein anderer als das All, das er empfing; und wenn er sodann Erbe von allem ist, so ist er allein der Sohn und dem Vater wesenseigen. Denn wenn er einer von allem wäre, so wäre er nicht Erbe von allem, vielmehr hätte jeder empfangen, so wie der Vater gewollt und gegeben hätte; nun aber er alles empfängt, so ist er ein anderer als das All und allein dem Vater eigen. Daß aber wiederum die Ausdrücke „es wurde gegeben“ und „es wurde übergeben“ nicht darauf hinweisen, daß er es einmal nicht besaß, kann man aus einer ähnlichen Stelle und zwar in Bezug auf alles ersehen. Sagt ja doch der Heiland selbst: „Wie der Vater das Leben in sich selbst hat, so hat er auch dem Sohne gegeben, das Leben in sich selbst zu haben“. Mit dem Wort „er hat gegeben“ gibt er zu verstehen, daß er nicht der Vater sei; mit dem Worte „so“ zeigt er aber die natürliche Ähnlichkeit und Eigenheit des Sohnes mit dem Vater an. Wenn es also einmal eine Zeit gab, da der Vater nicht hatte, so hatte offenbar auch einmal der Sohn nicht; denn wie der Vater, so hat auch der Sohn. Ist aber diese Behauptung gottlos, dagegen die gottesfürchtig, daß der Vater immer habe, ist es dann nicht ungereimt, wenn diese trotz der Aussage des Sohnes, der Sohn habe ebenso wie der Vater, behaupten, er habe nicht so, sondern anders? Es verdient doch das Wort mehr Glauben, und alles, was es empfangen zu haben erklärt, hat es immer, und zwar vom Vater — der Vater hat es von niemand, der Sohn aber vom Vater. Denn wie es beim Abglanz der Fall wäre, der, wenn er selbst sprechen würde: „Das Licht hat mir gegeben, jeden Ort zu beleuchten, und ich leuchte nicht aus mir selbst, sondern wie das Licht es will“, damit nicht sagen wollte, daß er einmal nicht gehabt habe, sondern: „Ich gehöre zum Lichte, und alles, was ihm gehört, ist mein“, so und zwar noch eher kann man auch beim Sohne denken. Denn da der Vater alles dem Sohne gegeben hat, so hat der Vater wieder alles im Sohne, und wenn es der Sohn hat, hat es wiederum der Vater. Denn die Gottheit des Sohnes ist die Gottheit des Vaters, und so trifft der Vater im Sohne für alles Fürsorge.</p><p>Das ist also der Sinn solcher Stellen. Was aber die menschlich klingenden Aussagen über den Heiland anlangt, so haben auch sie wieder ihren gottesfürchtigen Sinn. Denn darum haben wir solche Stellen schon zum voraus untersucht, damit, wenn wir ihn fragen hören, wo Lazarus liege, oder wenn er, in die Gegend von Cäsarea gekommen, fragt: „Für wen halten mich die Leute?“, und: „Wieviel Brote habt ihr?“, und: „Was wollt ihr, daß ich euch tue?“, wir aus dem bereits Gesagten den richtigen Sinn der Worte erkennen und kein Ärgernis nehmen wie die christusfeindlichen Arianer. Zunächst hat man die Gottlosen darnach zu fragen, weshalb sie denn glauben, er wisse nicht? Denn wer erst fragt, muß nicht unter allen Umständen aus Unwissenheit fragen, vielmehr kann einer auch fragen, der schon weiß, worüber er Aufschluß will. So weiß gewiß auch Johannes, daß Christus seine Frage: „Wieviel Brote habt ihr?“ nicht aus Unwissenheit stellt, sondern trotz vorhandener Kenntnis. Er sagt ja: „Dies aber sagte er, um den Philippus zu versuchen; denn er wußte wohl, was er tun wollte“. Wenn er aber wußte, was er tun wollte, so fragte er nicht, weil er in Unkenntnis war, sondern trotz vorhandener Kenntnis. Von dem aus kann man auch die ähnlichen Fälle verstehen, also, daß der Herr bei seiner Frage, wo Lazarus liege, nicht aus Unwissenheit fragt, und auch nicht aus Unkenntnis die Frage stellt, für wen ihn die Leute halten, sondern in voller Einsicht in das, wonach er fragte, und was er zu tun gedachte. Auf diese Weise ist ihre Spitzfindigkeit rasch beseitigt. Wenn sie aber deswegen, weil er nun einmal fragt, sich auf ihre Ansicht versteifen, so sollen sie vernehmen, daß es in der Gottheit keine Unwissenheit gibt, daß aber, wie gesagt, dem Fleisch das Nichtwissen eigen ist. Und daß das wahr ist, ersieh daraus, daß der Herr, der fragt, wo Lazarus liege, selbst, nicht da er zugegen, sondern weit weg war, gesagt hat: „Lazarus ist gestorben“, und zwar eben, da er gestorben war. Und Er, der nach ihrer Ansicht als unwissend gilt, erkennt die Gedanken seiner Jünger im voraus und weiß, was im Herzen eines jeden vorgeht und was im Menschen ist, und noch mehr: er allein kennt den Vater und sagt: „Ich im Vater und der Vater in mir“.</p><p>Das ist also wohl jedem klar, daß dem Fleische das Nichtwissen eigen ist, das Wort selbst aber als solches alles auch vor seiner Entstehung erkennt. Denn es hat nicht damit, daß es Mensch geworden ist, aufgehört, Gott zu sein, noch auch scheute es, da es Gott ist, das Menschliche. Ferne sei das! Vielmehr nahm es als Gott das Fleisch an, und im Fleische vergöttlichte es das Fleisch. Denn wie es in ihm fragte, so erweckte es in ihm auch den Toten und zeigte allen, daß der, welcher Tote lebendig macht und die Seele zurückruft, noch weit mehr alles Verborgene weiß, Es wußte, wo Lazarus lag, und doch fragte es. Es tat nämlich dies das allerheiligste Wort Gottes, das unsertwegen alles auf sich genommen hat, um so auch unsere Unwissenheit zu tragen und uns die Gnade zu gewähren, daß wir seinen allein wahren Vater erkennen und ihn, der unsertwegen zum Heile aller gesandt wurde — die größte Gnade, die uns zuteil werden konnte. Wenn nun auch der Heiland in den Stellen, auf die sie sich berufen, sagt: „Es ist mir Macht gegeben“ und: „Verherrliche Deinen Sohn!“ und wenn Petrus sagt: „Es wurde ihm Macht verliehen“, so verstehen wir all dies in demselben Sinne, nämlich, daß er wegen seines Leibes in menschlicher Weise das alles sagte. Denn wenn schon er kein Bedürfnis hatte, so heißt es doch von ihm, er habe empfangen, was er in menschlicher Weise empfangen hat, damit wieder, da der Herr empfing und auf ihm die Gabe ruht, die Gnade festen Bestand habe. Wenn nämlich der Mensch allein empfängt, so kann er auch wieder beraubt werden, wie es sich bei Adam zeigte; denn er empfing und verlor. Damit aber die Gnade unentreißbar würde und den Menschen sicher gewahrt bleibe, deshalb eignet er sich die Gabe an und erklärt, er habe als Mensch die Macht empfangen, die er als Gott immer hat. Und der andere, verherrlicht, sagt: „Verherrliche mich“, um zu zeigen, daß er Fleisch habe, das dessen bedarf. Weil nun dieses empfangen hat und in ihm ist und er durch dessen Annahme Mensch geworden ist, so redet man, wie wann er selbst empfangen hätte.</p><p>Wenn nun, wie schon oft gesagt, das Wort nicht Mensch geworden ist, so soll nach euch dem Wort zukommen zu empfangen und Verherrlichung zu bedürfen und nicht zu wissen. Ist es aber Mensch geworden — es ist es ja wirklich geworden —, und ist es einem Menschen eigen zu empfangen, zu bedürfen und nicht zu wissen, warum stellen wir uns den Geber als Empfänger vor und vermeinen, der, welcher andere ausstattet, habe selbst Bedürfnis, und scheiden das Wort als unvollkommen und bedürftig vom Vater und entziehen der Menschheit die Gnade? Wenn nämlich das Wort selbst als solches und seinetwegen empfängt und verherrlicht wird, und wenn es der Gottheit nach geheiligt wurde und auferstand, wo bleibt dann für die Menschen noch eine Hoffnung? Sie bleiben dann ja, wie jene waren — nackt, furchtsam, tot und ohne jede Gemeinschaft mit dem, was dem Sohne verliehen wurde. Warum ist dann aber das Wort auf die Erde gekommen und Fleisch geworden? Wenn etwa, um das zu empfangen, was es empfangen zu haben erklärt, — dann war es vordem dessen bar, und es wird vielmehr dem Leibe Dank schulden müssen, weil es damals, als es in ihn gekommen ist, das vom Vater erhielt, was es vor seiner Niederkunft im Fleische nicht hatte. Denn damit ist es offenbar eher selbst wegen des Leibes verbessert worden als der Leib seinetwegen. Doch dies ist die jüdische Anschauung. Ist das Wort auf die Erde gekommen, um das Menschengeschlecht zu erlösen, und ist das Wort Fleisch geworden, um die Menschen zu heiligen und zu vergöttlichen — um dessetwillen ist es auch Fleisch geworden —, wem sollte es da nun nicht einleuchten, daß, wenn es Fleisch geworden, etwas empfangen zu haben erklärt, es nicht seinetwegen, sondern wegen des Fleisches so redet? Denn dem Fleische, in dem es so redend war, gehörten auch die durch das Wort vom Vater gewährten Gnadengeschenke. Wir wollen aber sehen, was es war, worum es bat, und was das überhaupt war, was es empfangen zu haben erklärte, damit sie wenigstens auf diese Weise zur Besinnung gebracht werden können. Es bat also um Verherrlichung und sprach: „Alles wurde mir übergeben“. Und nach seiner Auferstehung versichert es, es habe alle Gewalt empfangen. Aber auch bevor es sagte: „Alles wurde mir übergeben“, war es Herr von allem. Denn „alles ist durch dasselbe entstanden“. Es war Ein Herr, durch den alles wurde. Und da es um Herrlichkeit bat, war und ist es der Herr der Herrlichkeit, wie Paulus sagt: „Denn wenn sie dieselbe erkannt hätten, hätten sie den Herrn der Herrlichkeit nicht gekreuzigt“. Und es besaß sie, wenn es um sie bat mit den Worten „mit der Herrlichkeit, die ich bei Dir hatte, ehe die Welt war“.</p><p>Ebenso besaß das Wort die Macht, die es nach der Auferstehung empfangen zu haben erklärte, auch schon vor dem Empfang und vor der Auferstehung. Denn es gebot dem Satan aus eigener Machtvollkommenheit: „Weiche von mir, Satan!“ Seinen Jüngern aber gab es die Macht gegen ihn, da es nach ihrer Rückkehr sagte: „Ich sah den Satan wie ein Blitz vom Himmel fallen“. Doch daß es das, was es empfangen zu haben erklärte, auch vor dem Empfang besaß, dafür gibt es noch einen weiteren Beweis. Es trieb nämlich die Teufel aus und, was der Satan gefesselt, löste es, wie es bei der Tochter Abrahams getan hat. Auch ließ es die Sünden nach, indem es zum Gichtbrüchigen und zum Weibe, das seine Füße salbte, sprach: „Deine Sünden sind dir vergeben“. Tote erweckte es und stellte den Blindgeborenen wieder her, indem es ihm das Gesicht gab. Und so tat das Wort, ohne abzuwarten, bis es dies empfing, sondern aus eigener Machtvollkommenheit. Hieraus erhellt, daß es das, was es als Wort hatte, auch als Menschgewordener hatte, und daß es nach der Auferstehung als Mensch empfangen zu haben erklärte, damit es die Menschen ihm zu danken hätten, wenn sie auf Erden, weil Teilnehmer an der göttlichen Natur geworden, fortan Macht gegen die Dämonen haben, im Himmel aber, weil vom Verderben befreit, ewig herrschen. Man muß sich überhaupt dessen bewußt bleiben, daß es nichts von dem, was es empfangen zu haben erklärt, so empfangen hat, als hätte es dies nicht besessen. Jetzt aber heißt es von ihm wie von einem Menschen, es habe empfangen, damit, wenn das Fleisch in ihm empfängt, die Gabe fortan durch dieses auch in uns beständig bleibe. Denn auch die Worte des Petrus: „Der von Gott Ehre und Herrlichkeit empfing“, „da ihm Engel Untertan wurden“, haben einen solchen Sinn. Wie es als Mensch fragte, aber als Gott den Lazarus erweckte, so ist auch das „er empfing“ von seiner menschlichen Seite gesagt; die Unterordnung der Engel aber beweist die Gottheit des Wortes.</p><p>Haltet also ein, ihr Gottverhaßten und erniedrigt nicht weiter das Wort und raubt ihm seine Gottheit nicht, welche ja die des Vaters ist, als hätte es ein Bedürfnis oder als wäre es unwissend, wenn ihr nicht mit euren Reden Christum bewerfen wollt, wie es die Juden machten, damals als sie ihn steinigen wollten. Denn nicht dem Wort, insofern es Wort ist, kommt dies zu, sondern den Menschen ist dies eigen. Und wie wir, wenn er ausspuckte, die Hand ausstreckte und „Lazarus“ rief, die erfolgte Heilung und Auferweckung nicht als menschliche Werke bezeichneten, wenn sie auch durch den Leib erfolgten, sondern als Gottes Werke, so wollen wir, wenn vom Heiland im Evangelium Menschliches ausgesagt wird, wieder auf die Natur des Gesagten schauen und dies dann als mit Gott unvereinbar nicht der Gottheit des Wortes zumessen, sondern seiner Menschheit. Denn wenn auch das Wort Fleisch geworden ist, so sind doch dem Fleische die Leiden eigen, und wenn auch das Fleisch im Wort von Gott getragen wird, so gehört doch die Gnade und die Kraft dem Worte. Die Werke des Vaters wirkte es also durch das Fleisch und nichtsdestoweniger zeigten sich wieder in ihm die Leiden des Fleisches. So z. B. fragte es und erweckte den Lazarus, gab seiner Mutter einen Verweis mit den Worten: „Meine Stunde ist noch nicht gekommen“, und verwandelte doch alsbald das Wasser in Wein. Er war eben wahrer Gott im Fleische und wahres Fleisch im Worte. Deshalb gab es sich in seinen Werken als Gottes Sohn zu erkennen und offenbarte seinen Vater, in den Leiden des Fleisches aber zeigte es, daß es einen wahren Leib trug und dieser ihm eigen war.</p><p>Da es sich nun so verhält, so wollen wir auch folgende Stellen untersuchen. „Den Tag und die Stunde weiß niemand, auch nicht die Engel, noch der Sohn“. In dieser Stelle glauben sie nämlich eine starke Stütze für ihre Häresie zu haben, indes sie dieselbe auch nicht im mindesten verstehen und hierin im Finstern herumtappen. Ich aber sehe, daß die Häretiker auch mit diesem Vorwand und mit dieser Waffe wieder wie die Giganten gegen Gott kämpfen. Denn über den Herrn des Himmels und der Erde, durch den alles entstanden ist, sitzen sie zu Gericht wegen Tag und Stunde. Sie klagen das Wort, das alles erkennt, an, daß es den Tag nicht wisse, und der Sohn, der den Vater erkennt, weiß nach ihnen des Tages Stunde nicht. Was könnte man noch Unvernünftigeres vorbringen? Oder wer könnte es diesen in solchem Wahne gleichtun? Durch das Wort ist alles entstanden, Zeiten, Augenblicke, Nacht, Tag und die ganze Kreatur, und der Schöpfer soll sein Werk nicht kennen? Es zeigt ja schon der Zusammenhang der Stelle, daß der Sohn Gottes die Stunde und den Tag weiß, mögen auch die Arianer in ihrer Unwissenheit straucheln. Er hat wohl gesagt „noch der Sohn“, erzählt aber den Jüngern die Ereignisse vor dem Tage, da er ja sagt: „Das und das wird geschehen, dann kommt das Ende“. Wer aber die Ereignisse vor dem Tage angeben kann, weiß jedenfalls auch den Tag, der auf die vorausgesagten Ereignisse folgen wird. Wüßte er aber die Stunde nicht, dann könnte er auch nicht das ihr Vorangehende angeben, da er ja nicht wüßte, wann die Stunde kommen wird. Wenn jemand Landfremden ein Haus oder eine Stadt zeigen wollte und ihm beschriebe, was vor dem Hause oder der Stadt liegt, und so alles angäbe und dann sagte: „Dann kommt gleich die Stadt bezw. das Haus“, so weiß jedenfalls der, der diese Angaben macht, wo das Haus bezw. die Stadt liegt. Denn wüßte er es nicht, dann würde er auch nicht angeben, was vor ihnen liegt, damit er nicht etwa mit seiner Unwissenheit die, welche auf ihn hören, weit [vom Ziel] abbringe oder er selbst bei der Angabe der Örtlichkeit unbewußt sich stoße. Ebenso weiß auch der Herr, wenn er die Ereignisse vor dem Tag und vor der Stunde angibt, genau und ist wohl orientiert, wann die Stunde und der Tag eintritt.</p><p>Weshalb er aber von seiner Kenntnis damals den Jüngern gegenüber nicht Gebrauch machte, darnach neugierig zu forschen hat keiner ein Recht, weil er es selbst verschwiegen hat. „Denn wer hat den Sinn des Herrn erkannt, oder wer ist sein Ratgeber gewesen?“ Weshalb er vielmehr trotz vorhandener Kenntnis gesagt hat: „Auch der Sohn weiß nicht“, kann wohl keinem Gläubigen unbekannt sein, — weil er eben auch das immerhin wegen seines Fleisches als Mensch sagen konnte. Denn auch das ist nicht eine Schwäche des Wortes, sondern der menschlichen Natur, der auch das Nichtwissen zukommt. Und man könnte das wohl einsehen, wenn man auch hier in redlicher Absicht nach den Umständen fragen wollte, wann und zu wem der Heiland so sprach. Denn nicht, da der Himmel durch ihn entstand, noch als das Wort beim Vater selbst war und alles ordnete, noch auch, bevor es Mensch wurde, sagte er dies, sondern als das Wort Fleisch wurde. Darum schreibt man auch alles, was er nach seiner Menschwerdung in menschlicher Weise sagt, mit Recht seiner Menschheit zu. Denn dem Worte ist es eigen, die gemachten Dinge zu kennen, nicht aber, ihren Anfang und ihr Ende nicht zu wissen. Denn sein sind die Werke und es weiß, wie vielen und auf wie lange es ihnen die Existenz geschaffen hat. Und da es den Anfang und das Ende eines jeden kennt, so weiß es jedenfalls auch das allgemeine gemeinsame Ende aller. Fürwahr, wenn er im Evangelium mit Bezug auf seine menschliche Seite spricht: „Vater, die Stunde ist gekommen, verherrliche Deinen Sohn“, dann kennt er offenbar als Wort auch die Stunde vom Ende aller Dinge, aber als Mensch weiß er sie nicht. Denn einem Menschen ist es eigen, nicht zu wissen — zumal diese Dinge. Doch auch dies ist der Menschenfreundlichkeit des Heilandes eigen. Denn da er Mensch geworden ist, schämt er sich auch wegen des nichtwissenden Fleisches nicht, zu sagen: „Ich weiß nicht“, um zu zeigen, daß er wohl als Gott weiß, aber dem Fleische nach nicht weiß. Er hat also nicht gesagt: „Auch der Sohn Gottes weiß nicht“, damit nicht die Gottheit als unwissend erscheine, sondern er sagt einfach: „auch der Sohn nicht“, damit auf dem aus den Menschen hervorgegangenen Sohne die Unwissenheit laste.</p><p>Darum hat er auch, als er die Engel erwähnte, nicht noch hinzugefügt: „auch der Heilige Geist nicht“. Vielmehr schwieg er und gab damit ein Zweifaches zu erkennen, nämlich daß, wenn es der Geist weiß, es noch weit eher das Wort weiß, insoweit es Wort ist, von dem es ja der Geist empfängt, und daß er, wenn er vom Geiste schwieg, offenbar gemacht hat, daß er in Bezug auf seine menschliche Tätigkeit sagte: „auch nicht der Sohn“. Ein Beweis dafür ist, daß er, obschon er wie ein Mensch gesagt hat: „Auch der Sohn weiß es nicht“, gleichwohl zu erkennen gibt, daß er als Gott alles weiß. Denn von dem Sohne, der nach ihm den Tag nicht weiß, sagt er, er kenne den Vater. „Niemand“, sagt er ja, „kennt den Vater als der Sohn“. Es wird aber doch jedermann, von den Arianern abgesehen, zugeben, daß, wer den Vater kennt, noch vielmehr die Schöpfung in ihrem ganzen Umfang kenne. Im vollen Umfang aber ist auch ihr Ende inbegriffen. Und wenn der Tag und die Stunde vom Vater bereits bestimmt sind, so sind sie offenbar durch den Sohn festgelegt, und er weiß doch selbst, was durch ihn festgelegt ist. Denn es gibt nichts, was nicht durch den Sohn geworden und festgelegt ist. Da er nun Schöpfer eines jeden Dinges ist, so weiß er, wie und wie groß und mit welcher Dauer es nach dem Willen des Vaters werden sollte. In der Größe und Dauer liegt aber ihre Veränderung. Wenn ferner alles, was dem Vater gehört, dem Sohne gehört — und das hat er selbst gesagt —, dem Vater aber es zukommt, den Tag zu wissen, so weiß ihn offenbar auch der Sohn, da er auch das vom Vater zu eigen hat. Und ferner, wenn der Sohn im Vater ist, und der Vater im Sohne, der Vater aber den Tag und die Stunde weiß, so weiß offenbar auch der Sohn, der im Vater ist, und weiß, was in dem Vater ist — den Tag und die Stunde. Wenn aber der Sohn auch wahres Bild des Vaters ist, und der Vater den Tag und die Stunde weiß, so erstreckt sich die Ähnlichkeit des Sohnes mit dem Vater auch darauf, daß er dies weiß. Es ist doch nichts Auffallendes, wenn der, durch den alles entstanden ist, und in dem alles besteht, selbst das Entstandene kennt und weiß, wann für das Einzelne wie für das Ganze das Ende kommen wird; vielmehr muß man darüber sich wundern, daß auch diese Dreistigkeit, die so recht dem Wahnsinn der Ariomaniten entspricht, uns zu solch ausführlicher Verteidigung genötigt hat. Denn wenn sie den Sohn Gottes, das ewige Wort, zu den entstandenen Dingen zählen, sind sie nahe daran, auch den Vater für geringer zu erklären als die Kreatur. Denn wenn der, welcher den Vater kennt, den Tag und die Stunde nicht weiß, so befürchte ich, es möchte, wie jene in ihrer Raserei wohl behaupten könnten, die Kenntnis von der Schöpfung oder vielmehr die Kenntnis des geringsten Teils der Schöpfung wichtiger sein als die Kenntnis vom Vater.</p><p>Doch sie, die so wider den Hl. Geist lästern, mögen sich keine Hoffnung machen, je einmal für diese Gottlosigkeit Verzeihung zu erlangen, wie der Herr gesagt. Wir aber, die Christus lieben und Christus in uns tragen, wollen erkennen, daß das Wort, insoweit es Wort ist, nicht aus Unwissenheit gesagt hat: „Ich weiß nicht“ — es hat ja Kenntnis —, sondern indem es seine menschliche Natur zu erkennen gab, weil es den Menschen eigen ist, nicht zu wissen, und weil es nicht-wissendes Fleisch anzog und in ihm nach Art des Fleisches sagte: „Ich weiß nicht“. Damals also hat er gesagt: „Auch der Sohn weiß nicht“ und führte beispielsweise die Unwissenheit der Menschen zu Noes Zeit an und fügte dem sogleich bei: „Wachet also, weil auch ihr nicht wißt, zu welcher Stunde der Herr kommt“, und wieder: „Zu der Stunde, da ihr nicht glaubt, kommt der Menschensohn“. Denn euertwegen ward auch ich euch gleich und sprach: „auch der Sohn nicht“. Er hätte aber, wenn er es als Gott nicht gewußt hätte, sagen müssen: „Wachet also, weil ich es nicht weiß“, und „zu der Stunde, da ich nicht glaube“. Nun aber sprach er nicht so. Indem er aber gesagt hat: „Ihr wisset nicht“, und: „zu der Stunde, da ihr nicht glaubt“, hat er gezeigt, daß es den Menschen zukommt, nicht zu wissen, derentwegen er auch selbst ihr ähnliches Fleisch hatte und Mensch geworden sprach: „Auch der Sohn weiß nicht“. Er weiß nämlich dem Fleische nach nicht, obschon er als Wort Kenntnis hat. Auch das Beispiel von der Zeit Noes beweist wieder die Unverschämtheit der Christusfeinde. Denn auch da sagte er nicht: „Ich erkannte es nicht“, sondern: „Sie erkannten es nicht, bis die Flut kam“. Denn die Menschen erkannten nicht, wohl aber der, welcher die Flut herbeiführte — dies war aber der Heiland. Er kannte den Tag und die Stunde, wo er die Schleusen des Himmels öffnete und die Abgründe aufschloß und zu Noe gesagt hat: „Geh du mit deinen Söhnen in die Arche!“ Hätte er es aber nicht gewußt, dann hätte er nicht dem Noe vorhergesagt: „Noch sieben Tage und ich bringe die Flut über die Erde“. Wenn er aber bei dem Bilde von der Zeit Noes den Tag angibt und den Tag der Flut kannte, dann weiß er doch auch den Tag seiner Ankunft.</p><p>Und im Gleichnis von den Jungfrauen hat er wieder, und zwar noch deutlicher gezeigt, wer die sind, die den Tag und die Stunde nicht wissen, indem er sagte: „Wachet also, weil ihr den Tag nicht wißt noch die Stunde“. Er, der kurz zuvor sagte: „Niemand weiß, auch der Sohn nicht“, sprach hier nicht: „Ich weiß nicht“, sondern: „Ihr wißt nicht“. So sagte er dann damals, als die Jünger nach dem Ende fragten, mit Recht wegen des Leibes nach Art des Fleisches: „auch der Sohn nicht“, um zu zeigen, daß er als Mensch nicht weiß; denn Menschen ist das Nichtwissen eigen. Wenn er aber Wort ist und selbst es ist, der kommt, selbst Richter und selbst der Bräutigam ist, so weiß er, wann und zu welcher Stunde er kommt, und wann er sagen will: „Wach auf, der du schläfst und steh auf von den Toten, und Christus wird dich erleuchten“. Denn wie er Mensch geworden, mit den Menschen hungert, dürstet und leidet, so weiß er nicht als Mensch mit den Menschen, in der Gottheit aber, als Wort und Weisheit im Vater, weiß er und es gibt nichts, das er nicht wüßte. So fragt er auch bezüglich des Lazarus wieder als Mensch, da er sich aufmachte, ihn zu erwecken, und da er wußte, von wannen er seine Seele zurückrufen würde. Es heißt aber mehr zu wissen, wo die Seele war, als zu wissen, wo der Körper lag. Doch er fragte nach Menschenart, um wie Gott zu erwecken. So fragt er auch die Jünger, als er in die Gegend von Cäsarea kam, obschon er informiert war, noch ehe die Antwort des Petrus erfolgte. Denn wenn der Vater dem Petrus das offenbarte, wonach der Herr fragte, so ist doch sicher die Offenbarung durch den Sohn erfolgt. „Denn niemand“, sagt er, „kennt den Sohn als nur der Vater und den Vater als nur der Sohn und wem es der Sohn offenbaren will“. Wenn aber durch den Sohn die Kenntnis vom Vater und Sohne geoffenbart wird, so steht es außer Zweifel, daß der Herr selbst, der fragt und zuvor dem Petrus die Offenbarung vom Vater mitgeteilt hat, später nach Menschenart fragte, um auch dadurch zu zeigen, daß er nach Art des Fleisches fragte, als Gott aber wußte, was Petrus sagen würde. Es weiß also der Sohn, der alles und seinen Vater kennt, in einer Weise, daß diese Kenntnis an Größe und Tiefe und Vollkommenheit ihresgleichen nicht hat.</p><p>Das reicht nun hin zu ihrer Widerlegung. Doch ich möchte noch eine Frage stellen, damit sie so noch mehr als Feinde der Wahrheit und Christusgegner dastehen. Es schreibt der Apostel im zweiten Brief an die Korinthier also: „Ich kenne einen Menschen in Christus, vor vierzehn Jahren, ob im Leibe, ich weiß es nicht, oder außer dem Leibe, ich weiß es nicht, Gott weiß es“. Was sagt ihr also? Weiß der Apostel, was im Gesicht ihm begegnet ist, obschon er sagt: „Ich weiß es nicht“, oder weiß er es nicht? Wenn er es nun nicht weiß, dann seht zu, daß ihr, die ihr das Fallen gelernt habt, nicht auch in die Ruchlosigkeit der Phrygier fallet, die behaupten, die Propheten und die übrigen Diener des Wortes wissen weder, was sie tun, noch was sie verkünden. Weiß er aber trotz seines Wortes: „Ich weiß nicht“ — denn er hatte Christus in sich, der ihm alles offenbarte —, ist dann nicht das Herz der Gottesfeinde erst recht verkehrt, und spricht es sich nicht selbst das Urteil, wenn sie vom Apostel, der sagt: „Ich weiß es nicht“, sagen, er wisse, vom Herrn aber, der sagt: „Ich weiß es nicht“, erklären, er wisse nicht, Denn wenn Paulus deshalb, weil Christus in ihm war, das weiß, was er nicht zu wissen erklärt, wie weiß nicht noch mehr Christus selbst, wenn er auch sagt: „Ich weiß nicht“? Der Apostel also weiß, was ihm begegnet ist, da der Herr es ihm offenbarte. Deshalb sagt er ja auch: „Ich kenne einen Menschen in Christus“. Kennt er aber den Menschen, so weiß er auch, wie der Mensch entrückt wurde. So weiß Elisäus, da er den Elias sah, auch, wie er aufgenommen wurde; doch trotz dieser Kenntnis suchte er, da die Söhne des Propheten gleichwohl glaubten, Elias sei vom Geiste auf einen der Berge versetzt worden, anfänglich in der Kenntnis dessen, was er gesehen hat, die Männer zu überzeugen. Als diese aber in ihn drangen, schwieg er und ließ sie ziehen. Fehlte ihm nun die Kenntnis, weil er schwieg? Er hatte also Kenntnis; aber er gab nach, wie wenn er es nicht wüßte, damit diese betreffs der Aufnahme des Elias zur Überzeugung kämen und nicht mehr zweifelten. Noch viel mehr weiß also Paulus, da er selbst entrückt wurde, auch, wie er entrückt wurde. Denn auch Elias wußte es. Und hätte man ihn gefragt, so hätte er es gesagt, wie er aufgenommen wurde. Es sagt aber gleichwohl Paulus: „Ich weiß nicht“, aus folgenden zwei Gründen, wie ich wenigstens glaube: einmal, damit man ihn nicht, wie er selbst gesagt hat, wegen des Übermaßes der Offenbarung für einen andern und für höher halte, als der Augenschein lehrt, sodann, weil die Rücksicht auf das Wort des Heilandes: „Ich weiß nicht“, auch ihn sagen hieß: „Ich weiß nicht“, damit nicht der Knecht über seinem Herrn und der Schüler über dem Lehrer zu stehen scheine.</p><p>Der, welcher dem Paulus das Wissen gegeben, weiß noch viel mehr selbst. Denn er, der die Ereignisse vor dem Tage angibt, weiß auch, wie bereits gesagt, wann der Tag und die Stunde eintritt. Und obschon er es weiß, sagte er: „Auch der Sohn weiß es nicht“. Weshalb sagte er nun damals: „Ich weiß es nicht“, was er doch als Herr weiß? Wenn man nun darnach fragen und eine Vermutung aussprechen soll, so hat er das meines Erachtens unseres Nutzens wegen getan. Doch er möge selber unsere Ansicht als wahr bestätigen. In beiden Fällen hat es der Heiland auf unsern Nutzen abgesehen. Denn die eintretenden Endereignisse hat er geoffenbart, damit wir nicht, wie er selbst gesagt hat, erschreckt und verwirrt werden, wenn sie kommen, vielmehr daraufhin das Ende erwarten. Vom Tag und der Stunde aber wollte er nicht als Gott sagen: „Ich weiß sie“, vielmehr sprach er, wie gesagt, nach Art des Fleisches wegen des nichtwissenden Fleisches: „Ich weiß nicht“, damit sie ihn nicht noch weiter fragten und er dann entweder, wenn er es nicht gesagt hätte, die Jünger betrüben, oder, hätte er es gesagt, etwas tun müßte, was ihnen und uns allen nicht zuträglich gewesen wäre. Denn was er tut, geschieht sicher unsertwegen, da ja das Wort unsertwegen Fleisch wurde. Unsertwegen sagte er also auch: „Auch der Sohn weiß nicht“. Und mit diesen Worten sagte er nicht die Unwahrheit — denn in menschlicher Weise als Mensch sprach er: „Ich weiß nicht“ —, noch auch ließ er sich von seinen Jüngern dazu drängen, es zu sagen. Denn mit den Worten: „Ich weiß nicht“, baute er einer Frage ihrerseits vor. So steht es auch in der Apostelgeschichte geschrieben: Als er zu den Engeln sich erhob und als Mensch emporstieg und das Fleisch, das er trug, zum Himmel hinauftrug, und als die Jünger dies sahen und ihn wieder fragten: „Wann wird das Ende eintreten und wann wirst Du wieder kommen?“, da sagte er ihnen noch deutlicher: „Euch steht es nicht zu, Zeit oder Stunde zu wissen, die der Vater in seiner Macht festgesetzt hat“. Er sagte damals nicht: „auch nicht der Sohn“, wie er vordem als Mensch gesagt hat, sondern: „Euch steht es nicht zu zu wissen“. Denn nunmehr war das Fleisch auferstanden, hatte die Sterblichkeit abgelegt und war vergöttlicht worden. Und es geziemte sich nicht mehr, daß er, wo er in den Himmel hinauffuhr, nach Art des Fleisches antwortete, sondern, daß er von nun an als Gott lehrte: „Euch kommt es nicht zu, Zeit oder Stunde zu wissen, die der Vater in seiner Macht gestimmt hat; doch ihr werdet die Kraft empfangen“. Wer anders ist aber die Kraft des Vaters als der Sohn? Denn „Christus ist Gottes Kraft und Gottes Weisheit“.</p><p>Es weiß also der Sohn als Wort. Denn das gab er zu verstehen mit den Worten: Ich weiß es, aber euch steht es nicht zu, zu wissen. Denn euertwegen sagte ich, als ich auf dem Berge saß, nach Art des Fleisches: „Auch der Sohn weiß nicht“, euch und allen zum Nutzen. Denn es nützte euch, auch von den Engeln und dem Sohne so zu hören wegen der Verführer, die nachher auftreten werden, damit, wenn auch die Dämonen Engelsgestalt annehmen und über die Vollendung zu reden versuchen, ihr ihnen nicht glaubt, da sie es nicht wissen. Und wenn auch der Antichrist eine andere Gestalt annimmt und sagt: „Ich bin Christus“ und auch Er über den Tag und die Vollendung zu sprechen versucht, um die zu täuschen, die auf ihn hören, so möget ihr im Besitze meines Wortes: „auch der Sohn nicht“, auch ihm nicht glauben. Außerdem nützt es auch den Menschen, nicht zu wissen, wann das Ende sein wird oder der Tag des Endes, damit sie nicht in dieser Erkenntnis Verabsäumer der dazwischenliegenden Zeit werden und die dem Ende nahen Tage abwarten; denn sie werden die Ausrede nehmen, erst dann für sich sorgen zu wollen. Deshalb hat er auch den Todestag eines jeden geheim gehalten, damit nicht die Menschen, auf diese Kenntnis gestützt, übermütig werden und dazukommen, die meiste Zeit hindurch sich zu vernachlässigen. Beides also, das allgemeine Ende wie den Ausgang des einzelnen, hat uns das Wort geheim gehalten — denn im allgemeinen Ende ist das des einzelnen und im Ende des einzelnen das allgemeine enthalten —, damit wir bei seiner Unsicherheit und in steter Erwartung täglich Fortschritte machen, wie wenn wir gerufen würden, indem wir nach dem, was vor uns liegt, uns ausstrecken und das, was hinter uns liegt, vergessen. Denn wo wäre einer, der den Tag seines Endes wüßte und dabei die Zwischenzeit nicht unbeachtet ließe, falls er ihn aber nicht weiß, nicht täglich bereit steht? Deshalb fügte der Heiland die Worte hinzu: „Wachet also, weil auch ihr nicht wißt, zu welcher Stunde der Herr kommt“, und: „Zu der Stunde, da ihr nicht glaubt, kommt der Menschensohn“. Also des Vorteils wegen, der aus der Unkenntnis entspringt, hat er dies gesagt. Wenn er nämlich dies sagt, will er, daß wir jederzeit bereit stehen. Denn ihr wißt nicht, sagt er, ich, der Herr aber, weiß, wann ich komme, wenn auch die Arianer mich, das Wort des Vaters, nicht erwarten.</p><p>So stellte also der Herr, der unseren Nutzen besser kennt als wir, seine Jünger gegen die Gefahr sicher, und selbst so unterwiesen, belehrten sie auch die Thessalonicher, die Gefahr liefen hierin irre zu gehen. Da aber die Christusfeinde auch so sich nicht beugen, so will ich ihnen, obschon ich weiß, daß sie ein verhärteteres Herz haben als Pharao, auch folgende Frage vorlegen. Im Paradies fragt Gott: „Adam, wo bist du?“ Er fragt auch den Kain: „Wo ist Abel, dein Bruder?“ Was sagt ihr also dazu? Glaubt ihr, er wisse es nicht und frage deshalb, so habt ihr euch bereits den Manichäern angeschlossen; denn sie haben diese Verwegenheit. Wenn ihr aber aus Furcht offen Manichäer genannt zu werden, euch zur Behauptung zwingt, daß er wissend frage, was findet ihr darin Ungereimtes oder Befremdliches, und was habt ihr euch so sehr daran gestoßen, wenn derselbe Sohn, in dem damals Gott fragte, auch jetzt in der Hülle des Fleisches die Jünger als Mensch fragt? Ihr müßtet dann Manichäer sein und die damals an Adam ergangene Frage tadeln wollen, nur um in eurer boshaften Gesinnung auch Mutwillen treiben zu können. Denn da ihr in allen Punkten widerlegt seid, erhebt ihr wieder ein Gemurmel über die Stelle bei Lukas, die wohl richtig lautet, von euch aber falsch verstanden wird. Wir müssen sie im Wortlaut anführen, damit auch so ihr verdorbener Sinn sich verrate.</p><p>Es sagt also Lukas: „Jesus nahm zu an Weisheit, Alter und Gnade bei Gott und den Menschen“. Das ist also die Stelle. Da sie auch an dieser sich stoßen, so müssen wir an sie wie an die Pharisäer und Sadduzäer die Frage stellen, von wem Lukas spreche, d. h. so: Ist Jesus Christus Mensch wie alle andern Menschen, oder ist er Gott, der das Fleisch trägt? Ist nun auch Er ein gewöhnlicher Mensch nach Art der andern Menschen, so mag er auch als Mensch zunehmen. Das ist ja auch die Ansicht des Samosateners, die der Sache nach auch ihr habt, die ihr aber dem Namen nach nur aus Menschenfurcht ablehnt. Wenn der aber Gott ist, der das Fleisch trägt, wie das ja auch wirklich der Fall ist, und das Wort Fleisch geworden und, da er Gott war, auf die Erde herabgekommen ist, wie konnte der zunehmen, der Gott gleich war? Oder wie konnte der Sohn wachsen, der immer im Vater ist? Denn wenn der, welcher immer im Vater ist, zunimmt, was ist dann jenseits des Vaters, um von diesem Zuwachs zu erhalten? Ferner ist es angebracht, hier dasselbe zu sagen, wie bezüglich des Empfangens und Verherrlichtwerdens. Wenn er Mensch geworden zunahm, so war er offenbar vor seiner Menschwerdung unvollkommen, und eher ist das Fleisch die Ursache für seine Vollkommenheit geworden als er die des Fleisches. Ferner, wenn er als Wort zunimmt, was kann er mehr werden als Wort und Weisheit, Sohn und Kraft Gottes? Denn dies ist das Wort. Und wenn einer gleichsam nur einen Strahl von diesen Eigenschaften bekommen könnte, so wäre ein solcher vollkommen unter den Menschen und den Engeln gleich. Denn auch die Engel, Erzengel, Herrschaften und alle Mächte und Throne, die am Worte teilhaben, sehen immerfort das Angesicht seines Vaters. Wie nun nimmt der, welcher andern die Vollkommenheit gewährt, später als jene zu? Engel dienten ja auch bei seiner menschlichen Geburt, und die Worte bei Lukas sind nach geleistetem Dienst der Engel gesprochen. Wie kann also das überhaupt einem Menschen nur in den Sinn kommen? Oder wie nahm die Weisheit in der Weisheit zu? Oder wie nahm der, welcher andern Gnade spendete, — wie Paulus, der weiß, daß durch ihn die Gnade gespendet wird, in jedem Briefe sagt: „Die Gnade unseres Herrn Jesus Christus sei mit euch allen“ — selbst in der Gnade zu? Denn entweder sollen sie den Apostel der Lüge zeihen oder sie sollen so keck sein und behaupten, der Sohn sei auch nicht Weisheit. Oder, wenn er Weisheit ist, wie Salomo gesagt und Paulus geschrieben hat: „Christus, Gottes Kraft und Gottes Weisheit“, welchen Zuwachses war dann die Weisheit fähig?</p><p>Denn Menschen, die Geschöpfe sind, können sich in der Tugend gleichsam ausdehnen und zunehmen. So ward Henoch entrückt, Moses wuchs und wurde vollkommen, Isaak nahm zu und wurde groß. Und der Apostel sagte, daß er täglich nach dem sich ausstrecke, was vor ihm liege. Denn ein jeder hatte, worin er zunehmen konnte, und jeder konnte auf die vor ihm befindliche Stufe hinsehen. Aber der Sohn Gottes, der allein ist, ist nur im Vater, und von diesem dehnt er sich auch nicht weiter aus, sondern ist und bleibt ewig in ihm. Menschen also ist es eigen zuzunehmen. Der Sohn Gottes aber, der als vollkommenes Wesen im Vater nicht zunehmen konnte, erniedrigte sich für uns, damit in seiner Erniedrigung wir um so mehr wachsen könnten. Unser Wachstum ist aber nichts anderes als die Losschälung von der Sinnenwelt und die Nachbildung des Wortes selbst in uns, wie auch seine Erniedrigung nichts anderes ist als die Annahme unseres Fleisches. Also nicht das Wort als solches war es, das zunahm, da es vollkommen ist aus dem vollkommenen Vater, da es nichts bedarf und vielmehr den andern zur Zunahme verhilft. Nein, auch hier ist das Wort „zunehmen“ in menschlicher Weise gesprochen, da die Zunahme wiederum den Menschen eigen ist. Denn auch der Evangelist, der hier mit feiner Unterscheidung sprach, verband mit der Zunahme das Alter. Wort und Gott lassen sich nicht mit dem Alter messen, sondern den Leibern kommen die Lebensalter zu. Dem Leibe ist also die Zunahme eigen. Denn wenn dieser zunahm, nahm in ihm in den Augen seiner Zeitgenossen auch die Offenbarung der Gottheit zu. Je mehr aber die Gottheit sich offenbarte, desto mehr nahm er als Mensch zu an Gnade bei allen Menschen. Als Kind wurde er getragen, zum Knaben geworden blieb er im Tempel zurück und fragte die Priester nach dem Gesetze. Da aber der Leib allmählich wuchs, und das Wort sich in ihm offenbarte, so wird nunmehr zunächst von Petrus, dann von allen bekannt, daß er in Wahrheit Gottes Sohn ist, mögen auch die alten und diese neuen Juden absichtlich die Augen schließen, um nicht zu sehen, daß „an Weisheit zunehmen“ nicht besagen will, daß die Weisheit zunehme, sondern daß die menschliche Natur in ihr zunehme. Denn auch „Jesus nahm zu an Weisheit und Gnade“. Wenn man sich treffend und wahr ausdrücken soll, so nahm er in sich selbst zu. Denn „die Weisheit baute sich ein Haus“ und machte, daß das Haus in ihr selbst zunahm.</p><p>Welches ist nun jene Zunahme, oder, wie oben gesagt, die vom Worte den Menschen mitgeteilte Vergöttlichung und Gnade, wodurch in ihnen die Sünde und das Verderben infolge der Ähnlichkeit und Verwandtschaft des Fleisches mit dem Worte aufgehoben wurde? Denn indem der Leib so mit dem Alter wuchs, nahm zugleich die Offenbarung der Gottheit in ihm zu, und allen ward es offenbar, daß er im Tempel Gottes ist und Gott im Leibe war. Wenn sie aber das bestreiten, weil das fleischgewordene Wort Jesus genannt wurde und sie auf ihn den Ausdruck: “Er nahm zu” beziehen, so sollen sie hören, daß auch dies das väterliche Licht — denn das ist der Sohn — nicht verringert. Es zeigt vielmehr wieder, daß das Wort Mensch geworden ist und wirkliches Fleisch trug. Und wie wir sagten, daß er im Fleische gelitten hat, im Fleische hungerte, im Fleische müde wurde, so kann man mit Recht wohl auch sagen, daß er im Fleische zunahm. Denn die Zunahme, von der wir gesprochen haben, vollzog sich nicht so, daß das Wort außerhalb war. Denn in ihm war das Fleisch, das zunahm, und ihm wird es zugesprochen, und zwar, damit wieder die Zunahme der Menschen wegen des einwohnenden Wortes unerschütterlich verbleibe. Es kam also weder dem Worte die Zunahme zu, noch war das Fleisch die Weisheit, sondern das Fleisch ist der Leib der Weisheit geworden. Deshalb nahm, wie wir bereits gesagt haben, nicht die Weisheit als solche an und für sich zu, sondern es nahm die Menschheit in der Weisheit zu, indem sie sich allmählich über die menschliche Natur erhob, vergöttlicht ward und der Weisheit ein allgemein sichtbares Werkzeug für die Tätigkeit der Gottheit und ihrer Offenbarung wurde. Deshalb sagte er auch nicht: “Das Wort nahm zu, sondern”Jesus", eine Bezeichnung, die der menschgewordene Herr erhielt, so daß die Zunahme der menschlichen Natur zukommt, so wie wir im Vorausgehenden gesagt haben.</p><p>Wenn also das Fleisch zunimmt, so wird das Wachsen von ihm selbst ausgesagt, weil ihm der Leib zu eigen ist. Ebenso muß man auch die Aussagen über ihn, die mit der Zeit seines Todes zusammenhängen, das Betrübtwerden, Weinen im selben Sinne nehmen. Sie suchen nämlich überall herum und suchen auch damit wieder ihre Häresie zu halten und zu empfehlen, daß sie sagen: „Sieh, er weinte und sprach: “Jetzt ist meine Seele betrübt„ und er rief, es möge der Kelch vorübergeben, — wie ist denn der, der dies gesagt hat, Gott und Wort des Vaters?“ Ja, das steht geschrieben, ihr Gottesfeinde, und auch, daß er sagte: „Ich bin betrübt“, und am Kreuze rief: „Eloi, Eloi, limasabachthani“ d. i.: „Mein Gott, mein Gott, warum hast Du mich verlassen?“ Er bat auch, es möge der Kelch vorübergehen; denn so steht geschrieben. Aber ich möchte von euch jetzt eine Gegenantwort. Denn auf jede eurer Einwendungen gehört die entsprechende Entgegnung. Wenn der Redende bloßer Mensch ist, dann soll er weinen und den Tod fürchten wie ein Mensch. Ist er aber Wort im Fleische — denn man darf unbedenklich immer wieder dasselbe sagen —, wen hatte er als Gott zu fürchten? Oder warum fürchtete er den Tod, der doch selbst das Leben war und andere vom Tode errettete? Oder wie mochte der, welcher sagte: „Fürchtet nicht den, der den Leib tötet“, sich selbst fürchten? Oder wie könnte der, der zu Moses sprach: „Fürchte dich nicht, denn ich bin mit dir“, und der Moses gegen Pharao ermutigte und zum Sohn des Nave sprach: „Sei stark und handle mannhaft“, selbst vor Herodes und Pilatus zaghaft sein? Ferner, wenn er andern zur Furchtlosigkeit verhilft — denn es heißt: „Der Herr ist mein Helfer; ich werde mich nicht fürchten, was wird mir ein Mensch tun?“ — warum fürchtete er selbst maßgebende sterbliche Menschen und bangte ihm vor dem Tod, da er doch gegen den Tod gekommen war? Und ist es nicht ungereimt und gottlos zu behaupten, daß dem vor dem Tod oder der Unterwelt bange, vor dem die Wächter über die Unterwelt schon beim bloßen Anblick entsetzten? Wenn aber nach eurer Ansicht das Wort sich fürchtete, warum ergriff es, das doch lange zuvor vor dem Anschlag der Juden sprach, nicht die Flucht, sondern sagte sogar, als man nach ihm fahndete: „Ich bin es“? Denn es stand in seiner Macht, nicht zu sterben, wie es sagte: „Ich habe Macht, mein Leben zu lassen, und habe Macht, es wieder zu nehmen“, und: „Niemand nimmt es von mir“.</p><p>Doch solche Schwächen waren von Natur dem Worte nicht eigen, insoweit es Wort war, aber in dem Fleische, dem sie anhafteten, war das Wort, ihr Christusfeinde und undankbare Juden! Denn das ist nicht vor dem Fleische gesagt worden, sondern für damals, als das Wort Fleisch und Mensch geworden war, ist das auch in menschlicher Weise in der Schrift gesagt. Gewiß erweckte der, von dem dies geschrieben steht, den Lazarus von den Toten, hat das Wasser in Wein verwandelt, dem Blindgeborenen das Gesicht verliehen und gesagt: „Ich und der Vater sind Eins“. Wenn sie also auf die menschlichen Äußerungen sich berufen, um vom Sohne Gottes niedrig zu denken, ja ihn gar für einen ganz irdischen und nicht himmlischen Menschen halten, warum erkennen sie nicht auch aus den göttlichen Werken das Wort im Vater und lassen dann von ihrer Gottlosigkeit ab? Sie können ja sehen, daß der, der die Werke tut, derselbe ist wie der, welcher einen leidensfähigen Leib zur Schau trägt, indem er ihn weinen und hungern, und das, was dem Leibe eigen ist, in ihm kund werden läßt. Denn in diesen Schwächen gab er zu erkennen, daß er als leidensunfähiger Gott ein leidensfähiges Fleisch annahm, und in den Werken zeigte er sich als Wort Gottes und als später Menschgewordenen, indem er sagt: „Wenn ihr auch mir nicht glaubt“, weil ihr mich in einen menschlichen Leib gehüllt seht, „so glaubet wenigstens den Werken, damit ihr erkennet, daß ich im Vater bin und der Vater in mir ist“. Doch die Christusfeinde scheinen mir die Unverschämtheit und Gottlosigkeit geradezu gepachtet zu haben. Denn wenn sie vernehmen: „Ich und der Vater sind Eins“, so verdrehen sie den Sinn mit Gewalt und trennen die Einheit von Vater und Sohn. Wenn sie dagegen hören, daß er weinte, schwitzte, gelitten hat, schauen sie nicht auf den Leib, sondern zählen auf Grund hiervon den zur Kreatur, durch den die Kreatur entstanden ist. Wie unterscheiden sie sich nun von den Juden? Denn wie diese in ihrer Gottlosigkeit die Werke Gottes dem Beizebub zumaßen, so rechnen auch diese den Herrn, der alles gewirkt hat, zu den Geschöpfen. Und sie wird dasselbe unnachsichtliche Verdammungsurteil treffen.</p><p>Doch wenn sie hörten: „Ich und der Vater sind Eins“, hätten sie die Eine Gottheit und das Eigentum der Substanz des Vaters ersehen müssen, und wenn sie hörten „er weinte“, und ähnliches, sagen sollen, dies sei dem Körper eigen, zumal sie ja für das eine wie für das andere die gute Begründung haben, daß das eine von ihm als Gott geschrieben steht, das andere wegen seines menschlichen Leibes gesagt wird. Denn in einem Leiblosen hätten die Eigenschaften des Leibes auch keinen Platz gehabt, wenn er nicht einen verweslichen und sterblichen Leib angenommen hätte. Denn sterblich war die hl. Maria, aus der auch der Leib stammte. Deshalb muß man, wenn er in einem leidenden, weinenden und ermüdenden Leibe war, mit dem Leibe ihm auch das zusprechen, was dem Fleische eigen ist. Wenn er also weinte und sich betrübte, so war es nicht das Wort als solches, das weinte und sich betrübte, sondern dies war dem Fleische eigen. Und wenn er auch bat, es möge der Kelch vorübergehen, so war es nicht die Gottheit, die zagte, sondern der Menschheit war auch dies Leiden eigen, wie auch die Worte: „Warum hast Du mich verlassen?“ So haben denn von ihm, der doch nach dem oben Gesagten nichts litt, — denn das Wort ist leidensunfähig — die Evangelisten gleichwohl dies berichtet. Denn der Herr ist auch Mensch geworden, und wie von einem Menschen geschieht und sagt man dies, damit er auch diese Leiden des Fleisches wegnehme und es von ihnen frei mache. Daher kann der Herr vom Vater auch nicht verlassen werden, da er immer in ihm ist, sowohl bevor er dies gesprochen hat, als auch da er diesen Ruf ausstieß. Aber es ist auch wieder nicht recht zu sagen, es zage der Herr, vor dem doch die Wächter über die Unterwelt sich entsetzten und die Unterwelt freiließen: es öffneten sich die Gräber und viele Leiber der Heiligen standen auf und erschienen den Ihrigen. Es verstumme also jeder Häretiker und scheue die Behauptung, daß der Herr zage, vor dem doch der Tod wie eine Schlange flieht, vor dem die Dämonen zittern und das Meer erbebt, um dessentwillen die Himmel sich spalten und alle Mächte erschüttert werden. Denn sieh, während er sagte: „Warum hast Du mich verlassen?“, zeigt der Vater, daß er immer und auch damals in ihm war. Denn alsbald zitterte die Erde, da sie die Sprache ihres Herrn erkannte, und der Vorhang zerriß, die Gräber, wie schon erwähnt, öffneten sich und die Toten in ihnen wachten auf. Und wunderbar! Die damals zugegen waren und ihn zuvor verleugnet hatten, später aber Augenzeugen hiervon wurden, bekannten, dieser sei wahrhaft Gottessohn.</p><p>Wenn er aber sagte: „Wenn möglich, so gehe der Kelch vorüber“, so laßt euch sagen, wie Er, der dies gesagt hat, den Petrus anfuhr: „Du denkst nicht auf das, was Gottes ist, sondern auf das, was der Menschen ist“. Denn er wollte das, was er sich verbat, und deshalb war er gekommen. Doch ihm kam es zu, zu wollen — denn dazu war er gekommen —, dem Fleisch aber kam es zu, zu sagen. Deshalb ließ er als Mensch auch solche Rufe vernehmen. Und das eine wie das andere wurde wieder von demselben gesagt, um zu zeigen, daß er Gott war und selbst wollte, Mensch geworden aber das zagende Fleisch trug, wegen dessen er seinen Willen mit der menschlichen Ohnmacht vermischte, um auch diesen wieder zu vernichten und den Menschen gegen den Tod wieder mutig zu machen. Sieh also, eine ganz auffallende Sache! Der, den die Christusfeinde aus Zaghaftigkeit reden zu hören meinen, machte mit der vermeintlichen Zaghaftigkeit die Menschen mutig und furchtlos. So haben denn die seligen Apostel nach ihm auf Grund solcher Rufe den Tod so sehr verachtet, daß sie sich nicht einmal um ihre Richter kümmerten, sondern sprachen: „Man muß Gott mehr gehorchen als den Menschen“. Auch die andern hl. Märtyrer waren so mutig, daß man mehr glauben mochte, sie gehen ins Leben ein als sie erleiden den Tod. Wie ist es also nicht ungereimt, die Mannhaftigkeit der Diener des Wortes zu bewundern, vom Worte selbst aber zu sagen, es zage, in dem doch auch jene den Tod verachteten? Aus der unbesieglichen Willenskraft und Mannhaftigkeit der hl. Märtyrer geht aber hervor, daß es nicht die Gottheit war, die zagte, sondern, daß der Heiland unsere Zaghaftigkeit wegnahm. Denn wie er den Tod durch den Tod überwand und in seiner Menschheit alles Menschliche, so nahm er durch die vermeintliche Zaghaftigkeit unsere Zaghaftigkeit hinweg, und er hat bewirkt, daß die Menschen den Tod nicht mehr fürchten. So sprach er also, und er handelte auch so. Denn menschlich waren seine Worte: „Es gehe der Kelch vorüber“ und: „Warum hast Du mich verlassen?“ In göttlicher Weise aber ließ derselbe die Sonne sich verfinstern und die Toten auferstehen. Und wenn er wieder menschlich sagte: „Jetzt ist meine Seele betrübt“, so sprach er wieder göttlich: „Ich habe Macht, mein Leben zu lassen, und habe Macht, es wieder zu nehmen“. Denn Betrübtwerden war dem Fleische eigen, aber Macht haben, das Leben zu lassen und zu nehmen, wenn man will, das liegt nicht mehr in der Hand von Menschen, sondern kommt der Kraft des Wortes zu. Denn ein Mensch stirbt nicht nach eigenem Belieben, sondern naturnotwendig auch wider seinen Willen. Der Herr aber, der selbst unsterblich war, aber sterbliches Fleisch trug, hatte es als Gott in seiner Macht, sich vom Leibe zu trennen und ihn wieder anzunehmen, wenn er wollte. Hierüber singt auch David: „Du wirst meine Seele nicht in der Unterwelt lassen und Deinen Heiligen nicht schauen lassen die Verwesung“. Denn es gehörte sich, daß das Fleisch verweslich war, seiner Natur nach nicht mehr sterblich bleibe, sondern wegen des Wortes, das es angezogen hat, immer unverweslich sei. Denn wie er, da er in unserm Leibe war, das Unsrige nachahmte, so nehmen auch wir, die wir ihn aufgenommen haben, an seiner Unsterblichkeit teil.</p><p>Vergebens stellen sich also die Ariomaniten, als ob sie Ärgernis nähmen, und denken vom Worte gering, wenn geschrieben steht: „Er wurde betrübt“ und: „Er weinte“. Es scheint ihnen auch die menschliche Empfindung abzugehen, da sie die Natur der Menschen und, was diesen eigen ist, nicht kennen. Deshalb hätten sie sich eher darüber wundern sollen, daß in einem solchen leidenden Fleische das Wort war und es weder denen wehrte, die ihm nachstellten, noch die strafte, die es töteten, obschon es die Macht dazu gehabt hätte, da es bei andern dem Tode wehrte und Tote von den Toten wiedererweckte, daß es vielmehr seinen Leib leiden ließ. Denn deshalb ist es, wie gesagt, auch gekommen, um im Fleische zu leiden und um für die Zukunft das Fleisch leidensunfähig und unsterblich zu machen. Auch sollten, wie wir schon oft gesagt haben, die Unbilden und die andern Zufälle dadurch, daß sie das Wort trafen, die Menschen nicht mehr berühren, sondern von ihm völlig ausgetilgt werden und die Menschen von nun an als ein Tempel des Wortes ewig unverweslich bleiben. Dächten auch die Christusfeinde so und würden sie in der kirchlichen Lehre den Anker ihres Glaubens anerkennen, so hatten sie weder im Glauben Schiffbruch gelitten, noch wären sie so unverschämt, daß sie sogar denen gegenübertreten, die sie vom Fall wieder aufrichten wollen und gar in denen Feinde sehen, die sie zum gottesfürchtigen Glauben auffordern. Aber, wie es scheint, ist der Häretiker in Wahrheit ein Übel und hat ein Herz, das durch und durch von der Gottlosigkeit vergiftet ist. Denn sieh, obschon sie in allen Punkten widerlegt sind, und ihnen offenkundig jegliche Einsicht abgeht, so schämen sie sich doch nicht, sondern wie die sogenannte Hydra in der griechischen Mythologie, jenes Ungetüm, das immer wieder neue Schlangen gebar, wenn die ersten getötet wurden, und im Wettkampf mit dem Mörder immer neue hervorbrachte, so machen auch die Feinde und Widersacher Gottes, wenn ihr Vertrauen auf ihr Beweismaterial sinkt, wie Hydren andere jüdische und törichte Fragen ausfindig und kommen, wie wenn sie mit der Wahrheit in Feindschaft lebten, auf neue Einfälle, um sich noch mehr auf alle mögliche Weise als Christusfeinde zu verraten.</p><p>Denn nach so vielen Gegenbeweisen, auf die hin selbst der Teufel, ihr Vater, beschämt den Rückzug anträte, stoßen sie aus ihrem verkehrten Herzen wieder neue Einfälle hervor, flüstern den einen zu und umsummen die andern wie Mücken also: Es sei so, wie ihr erklärt, und ihr sollt recht haben mit euren Schlüssen und Beweisen! Doch man muß sagen, daß der Sohn durch den Vater nach seinem Entschluß und Willen entstanden ist. Und so täuschen sie viele, indem sie sich auf den Entschluß und Willen Gottes berufen. Wenn das ein Rechtgläubiger in Einfalt sagte, so bestände kein Grund, aus der Äußerung Verdacht zu schöpfen, da der rechtgläubige Sinn über den unbeholfenen Ausdruck der Rede geht. Weil aber die Rede von Häretikern kommt, und die Reden von Häretikern verdächtig sind, und, wie geschrieben steht, “die Gottlosen auf Trug sinnen” und “ihre Reden hinterlistig sind”, wenn sie auch nur winken, — denn sie haben ein verdorbenes Herz — wohlan, so wollen wir auch diese Rede prüfen und sehen, ob sie nicht nach allseitiger Widerlegung jetzt wie Hydren ein neues Schlagwort ersonnen haben, um in solch verschlagener Rede und schlauer Täuschung ihre Gottlosigkeit wieder in anderer Weise auszustreuen. Denn wer sagt: “Der Sohn ist durch den Willen geworden”, gibt dasselbe zu verstehen wie der, welcher sagt: “Es war einmal, da er nicht war”, und: “Aus Nichtseiendem ist der Sohn entstanden und er ist ein Geschöpf”. Doch, da sie sich solcher Reden schämten, suchten sich die Hinterlistigen wieder anders auszudrücken, und suchen hinter dem Willen Schutz, wie die Tintenfische hinter der schwarzen Farbe, um die Arglosen zu blenden, selbst aber ihre Häresie nicht aus den Augen zu verlieren. Denn woher der Ausdruck “nach dem Entschluß und Willen” stammt, oder aus welcher Schrift sie solche Worte wieder hervorholen, das sollen uns die Redeverdächtigen und Erfinder der Gottlosigkeit sagen. Denn der Vater, der vom Himmel herab sein Wort offenbarte, bezeugte: “Dieser ist mein geliebter Sohn”. Und durch David sprach er: “Meinem Herzen entquoll ein gutes Wort”. Den Johannes hieß er sagen: “Im Anfang war das Wort”, und David sagt in den Psalmen: “Bei Dir ist die Quelle des Lebens, und in Deinem Lichte werden wir das Licht schauen”. Der Apostel schreibt: “Der, da er der Abglanz ist”, und wieder: “Der, da er die Gestalt Gottes war”, und: "Der das Bild des unsichtbaren Gottes ist.</p><p>Überall reden alle vom Sein des Sohnes und nirgends behauptet einer, er sei aus dem Willen, noch, er sei überhaupt gemacht. Wo fanden denn sie den Entschluß oder Willen dem Worte Gottes vorausgehen, wenn sie nicht etwa die Schrift preisgeben und sich heimlich zur verruchten Anschauung des Valentin bekennen wollen? Denn Ptolemäus, der Schüler des Valentin, sagte, der Unentstandene habe zwei Genossen, Gedanke und Wille, und zuerst dachte er, dann wollte er, und was er dachte, konnte er nicht vorbringen, außer wenn die Kraft des Willens hinzukam. Hier haben die Arianer gelernt, daß dem Worte Entschluß und Wille vorausgehen. Sie nun mögen sich für die Lehre Valentins ereifern, wir aber, die wir auf die göttlichen Aussprüche uns berufen, haben bei dem Sohne das Wort “war” gefunden und haben vernommen, daß er allein im Vater und Bild des Vaters ist. Nur bei den entstandenen Wesen, die ja auch ihrer Natur nach einmal nicht waren, sondern erst später geworden sind, fanden wir einen vorausgehenden Entschluß und Willen. So singt David im 113. Psalm: “Unser Gott im Himmel und auf Erden hat alles gemacht, was er wollte”, und im 110. Psalm: “Groß sind die Werke des Herrn, ausgesucht für alles, was er will”, und wieder im 134.: “Alles, was der Herr gewollt hat, hat er gemacht im Himmel und auf Erden, in den Meeren und allen Abgründen”. Wenn er nun ein Werk und Geschöpf und einer vom All ist, dann möge man auch von ihm sagen, er sei durch den Willen entstanden. Denn nach der Schrift entstehen die Geschöpfe auf diese Weise. Auch Asterius, der Anwalt der Häresie, stimmt damit überein und schreibt also: “Denn wenn es des Schöpfers unwürdig ist, mit Willen zu machen, so soll das Wollen bei allem in gleicher Weise fernbleiben, damit die Würde ihm ungeschmälert erhalten bleibe. Wenn es sich aber für Gott schickt zu wollen, so möge auch bei der ersten Zeugung das Bessere stattfinden. Denn es ist unmöglich, daß einem und demselben, Gott das Wollen bei Geschöpfen ansteht und auch das Nichtwollen zukommt”. Die größtmögliche Gottlosigkeit hat der Sophist in diesen seinen Worten niedergelegt, nämlich, daß Zeugung und Geschöpf dasselbe seien, und einer von allen bestehenden Zeugungen der Sohn sei, und er hat daraus den Schluß gezogen, daß man mit Recht die Geschöpfe auf Entschluß und Wille zurückführe,</p><p>Wenn er nun von allem verschieden ist — und das wurde im Vorausgehenden gezeigt —, ja vielmehr die Werke durch ihn entstanden sind, so sage man nicht „durch den Willen“, damit nicht auch Er so entstehe, wie das durch ihn Entstandene sich gebildet hat. Denn Paulus, der zuvor nicht war, ist gleichwohl später durch den Willen Gottes Apostel geworden. Unserer Berufung, die einmal nicht da war, jetzt aber eingetreten ist, geht der Wille voraus, und sie ist, wie Paulus selbst wieder sagt, nach dem Ratschluß seines Willens erfolgt. Wenn es aber bei Moses heißt: „Es werde Licht“, und: „Die Erde bringe hervor“, und: „Laßt uns den Menschen machen“, so halte ich dies, wie im Vorausgehenden gesagt worden ist, für eine Willensäußerung des Schaffenden. Denn das, was einmal nicht war, sondern von außen hinzukommt, beschließt der Schöpfer zu schaffen. Mit dem eigenen, von Natur aus ihm gezeugten Worte aber geht er nicht zuvor mit sich zu Rate. Denn in diesem macht der Vater alles übrige, wozu er sich entschließt, und schafft es in diesem, wie auch der Apostel Jakobus lehrte mit den Worten: „Weil er wollte, hat er uns durch das Wort der Wahrheit gezeugt“. Es besteht also ein Wille Gottes in Bezug auf all das, was wiedergeboren werden und einmal entstehen soll im Worte, in dem er auch das Beschlossene macht und wiedergebiert. Dies gibt ja auch wieder der Apostel zu verstehen, wenn er nach Thessalonich schreibt: „Denn das ist Gottes Wille in Bezug auf euch in Christus Jesus“. Wenn aber in dem, in dem er schafft, auch der Wille ist, und in Christus der Wille des Vaters ist, wie kann auch Er im Entschluß und Willen des Vaters bestehen? Denn wenn auch Er nach eurer Ansicht im Willen entstanden ist, so muß auch der Entschluß bezüglich seiner in einem anderen Worte entstehen, durch das auch Er wird. Denn es ist bewiesen worden, daß der Wille nicht in den entstehenden Dingen ist, sondern in dem, durch den und in dem alle Geschöpfe entstehen. Da übrigens der Ausdruck „durch den Willen“ dasselbe besagt wie die Wendung: „Es war einmal, da er nicht war“, so sollen sie sich doch mit der Wendung begnügen: „Es war einmal, da er nicht war“, damit sie aus Scham darob, daß sie damit von Zeiten reden, einsehen, daß sie auch mit der Wendung „durch den Willen“ von Zeiten vor dem Sohne reden. Denn dem, was einmal nicht war, geht wie bei allen Geschöpfen die Beratung voraus. Wenn aber das Wort Schöpfer der Geschöpfe ist und es zugleich mit dem Vater existiert, wie kann dem Ewigen wie einem Nichtseienden die Beratung vorausgehen? Denn wenn der Ratschluß vorausgeht, wie ist durch ihn alles? Er ist ja vielmehr einer vom All und gleichfalls durch den Willen geborener Sohn, wie auch wir durch das Wort der Wahrheit Söhne geworden sind. Dann müssen wir, wie gesagt, ein anderes Wort aufsuchen, durch das auch dieses entstanden ist und mit allem, was Gott wollte, geboren wurde.</p><p>Wenn es also ein zweites Wort Gottes gibt, so soll auch dieses durch ein Wort entstanden sein. Wenn es aber kein anderes gibt — und es gibt wirklich kein zweites —, sondern durch dasselbe alles entstanden ist, was der Vater gewollt hat, verrät dies dann nicht ihre vielköpfige Verschlagenheit. Denn da sie die Ausdrücke “gemachtes Wesen”, “Geschöpf” und: “Das Wort Gottes war nicht, bevor es geboren wurde” scheuen, so nennen sie ihn wieder in anderer Weise Geschöpf, wenn sie den Willen vorschützen und sagen: "Wenn er nicht durch den Willen entstanden ist, dann erhielt Gott einen Sohn gezwungen und ohne ihn zu wollen. Wer legt ihm einen Zwang auf, ihr Verruchte, die ihr alles eurer Häresie entsprechend dreht? Das Gegensätzliche zum Willen haben sie gesehen,’ das Größere und Höherliegende haben sie aber nicht beachtet. Wie nämlich dem Willen das Unerwartete gegenübersteht, so steht das Naturhafte höher als das Produkt der Beratung und geht ihr voran. Wenn einer ein Haus bauen will, geht er mit sich zu Rate, einen Sohn aber zeugt er von Natur. Und was nach dem Willen gebaut wurde, hatte einen Anfang des Werdens und ist außerhalb des Schöpfers, der Sohn ist aber wesenseigene Zeugung des Vaters und ist nicht außer ihm. Darum beratschlagt er sich auch bezüglich seiner nicht, um nicht den Anschein zu erwecken, als gehe er auch über sich selbst zu Rate. So hoch also der Sohn über dem Geschöpfe steht, so hoch steht das Naturhafte über dem Produkt des Willens, und sie hätten, wenn sie davon hörten, nicht das Naturhafte dem Willen zumessen sollen. Doch sie vergessen, daß vom Sohne Gottes die Rede ist, und erkühnen sich, menschliche Gegensätze, Zwang und Widererwartung auf Gott zu übertragen, um die Existenz eines wahren Sohnes Gottes in Abrede stellen zu können. Sie sollen uns selbst sagen: Kommt Gott sein Gut- und Barmherzigsein nach seinem Willen zu oder nicht durch seinen Willen? Wenn nach seinem Willen, so muß man bedenken, daß er anfing, gut zu sein, und es ist möglich, daß er auch nicht gut ist. Denn bei der Beratung und Wahl neigt man nach beiden Seiten, und es ist das ein Leiden der vernunftbegabten Natur. Wenn er aber wegen der darausfolgenden Ungereimtheit nicht durch den Willen gut und barmherzig ist, so sollen sie vernehmen, was sie selbst gesagt haben: Also ist er gezwungen und ohne es zu wollen gut. Und wer tut ihm Zwang an? Wenn es aber ungereimt ist, bei Gott von Zwang zu reden, und er deshalb von Natur gut ist, so ist er wohl noch weit mehr und sicherer von Natur und nicht kraft des Willens Vater des Sohnes.</p><p>Sie sollen aber auch darauf uns wieder eine Antwort geben — ich will nämlich ihrer Unverschämtheit noch eine Frage entgegenhalten, die noch kühner ist, aber gleichwohl auf den frommen Glauben abzielt. Verzeih mir, Herr! — nämlich auf die Frage: Existiert der Vater selbst so, daß er zuerst mit sich zu Rate ging, und dann wollte, oder auch, bevor er sich beriet? Denn sie, die vom Worte dergleichen zu behaupten wagen, müssen solches auch [vom Vater] hören, damit sie einsehen, daß diese ihre Vermessenheit auch den Vater selbst trifft. Wenn sie nun einmal entschlossen, an ihrer Lehre vom „Willen“ festzuhalten, behaupten, auch Er stamme aus dem Willen, was war er dann vor der Beratung? Ist aber eine solche Frage ungereimt und haltlos, und ist es überhaupt nicht recht, so etwas zu sagen denn wir brauchen von Gott nur zu hören, um zu wissen und zu erkennen, daß er der Seiende ist —, wie wäre es nicht unvernünftig, vom Worte Gottes solches zu denken und bei ihm Entschluß und Willen vorzuschützen? Denn wir brauchen auch vom Worte nur zu hören, um zu wissen und zu erkennen, daß Gott, der nicht kraft des Willens existiert, nicht durch den Willen, sondern von Natur sein Wort hat. Doch geht nicht über allen Wahnsinn schon der Gedanke, daß Gott selbst mit sich zu Rate geht und nachdenkt und wählt und sich zum Wollen aufmuntert, damit er nicht unvernünftig [ohne Wort] und unweise sei, sondern Wort und Weisheit habe? Denn über sich selbst scheint der nachzudenken, der über das, was seiner Substanz eigen ist, sich beratschlagt. Da also in dieser Anschauung eine schwere Gotteslästerung liegt, so sagt man wohl gottesfürchüg, daß die entstandenen Dinge durch Beschluß und Wille entstanden sind, der Sohn aber nicht als Werk des Willens erst nachträglich wie die Kreatur geworden ist, sondern als von Natur der Substanz eigene Zeugung existiert. Denn als eigenes Wort des Vaters gestattet er nicht, an einen ihm vorangehenden Willen zu denken, da er ja selbst des Vaters lebendiger Ratschluß und Kraft und Schöpfer dessen ist, was der Vater beschließt. Dies sagt er von sich selbst aus in den Sprichwörtern: „Mein ist der Rat und die Sicherheit, mein die Klugheit, mein die Stärke“. Denn wie er, der selbst die Klugheit, in der er die Himmel bereitete, und selbst die Stärke und Kraft ist — denn „Christus ist Gottes Kraft und Gottes Weisheit“ — jetzt abweichend sagte: „Mein ist die Klugheit und mein die Stärke“, so ist er wohl, wenn er sagte: „Mein ist der Rat“ selbst des Vaters lebendiger Rat, wie wir auch vom Propheten erfahren haben, daß er der „Engel des großen Rates“ ist und er Wille des Vaters genannt wurde. Denn so muß man sie widerlegen, sie, die von Gott menschliche Vorstellungen haben.</p><p>Wenn also die Geschöpfe durch Willen und Beschluß ins Dasein traten und die ganze Schöpfung durch den Willen entstanden ist, ferner auch Paulus durch Gottes Willen zum Apostel berufen wurde, sowie unsere Berufung nach Beschluß und Willen erfolgt, alles aber durch das Wort geworden ist, so ist dieses außerhalb dessen, was durch den Willen entstanden ist. Ja es ist vielmehr selbst des Vaters lebendiger Ratschluß, in dem dies alles entstanden ist, in dem auch der hl. David im 72. Psalm seinen Dank aussprach: „Du hieltest meine rechte Hand, und in Deinem Rate führtest Du mich“. Wie kann nun das Wort als des Vaters Ratschluß und Wille selbst durch Wille und Entschluß wie jeder andere ins Dasein treten? Sie müßten denn nur, wie gesagt, in ihrer Raserei behaupten, es sei durch sich selbst oder durch irgendeinen andern entstanden. Wo ist also der, durch den er entstanden ist? Sie sollen sich ein zweites Wort erdichten, Valentin nachbeten und einen andern Christus nennen. Denn in der Schrift kommt er nicht vor. Aber wenn sie ihn auch erdichten, so entsteht jedenfalls auch jener wieder durch einen andern. Wenn wir nun so weiterschließen und die Folgerungen ziehen, so finden wir, daß die vielköpfige Häresie der Gottlosen auf Vielgötterei und maßlosen Wahnsinn hinausläuft, indem sie den Sohn als Geschöpf und aus Nichtseiendem entstanden wissen wollen. So bringen sie in anderer Weise dasselbe zum Ausdruck, indem sie nämlich Entschluß und Wille vorschützen, wovon man wohl bei den entstandenen und geschaffenen Wesen mit Grund redet. Ist es nun nicht gottlos, auf den Schöpfer zu übertragen, was den entstandenen Wesen zukommt? Oder ist es nicht gotteslästerlich, zu behaupten, der Wille sei vor dem Worte im Vater? Denn wenn im Vater der Wille vorangeht, dann spricht der Sohn nicht die Wahrheit, wenn er sagt: „Ich bin im Vater“. Oder wenn auch Er im Vater ist, so wird er doch als zweiter zu denken sein, und er konnte nicht gut sagen: „Ich bin im Vater“, da ja vor ihm der Wille ist, in dem alles entstanden ist, und in dem auch Er nach eurer Ansicht ins Dasein trat. Denn wenn er sich auch in der Herrlichkeit unterscheidet, so ist er doch immerhin einer von denen, die kraft des Willens entstehen. Aber, wenn dem so ist, so fragen wir wie schon früher: Wie ist dann der eine der Herr und sind die andern die Knechte? Doch Herr über alles ist ersterer, weil er mit der Herrschaft des Vaters vereinigt ist. Und die Kreatur ist jedenfalls in Knechtschaft, weil sie außerhalb der Einheit mit dem Vater steht und, da sie einmal nicht war, geworden ist.</p><p>Wenn sie aber den Sohn kraft eines Ratschlusses entstehen lassen, dann hätten sie sagen sollen, daß er auch durch Klugheit entstanden sei; denn Klugheit und Ratschluß ist nach meinem Dafürhalten dasselbe. Denn worüber einer beratschlagt, darüber denkt er notwendig auch nach, und worüber „einer nachdenkt, darüber beratschlagt er auch. Der Heiland hat daher selbst beides, durch die Analogie gleichsam verschwistert, zusammengenommen, wenn er sagte: “Mein ist der Rat und die Sicherheit, mein die Klugheit, mein die Stärke„. Denn wie Stärke und Sicherheit dasselbe ist — es ist ja dieselbe Macht —, so besagen auch Klugheit und Ratschluß dasselbe — und das ist der Herr. Doch die Gottlosen wollen nicht, daß der Sohn Wort und lebendiger Ratschluß sei, von Gott aber faseln sie, es trete bei ihm in menschlicher Weise Klugheit, Ratschluß und Weisheit ein wie ein Zustand, der eintritt und wieder weicht, und sie setzen alles in Bewegung und schützen das Nachdenken und den Willen des Valentin vor, nur um den Sohn vom Vater trennen und behaupten zu können, er sei nicht des Vaters eigenes Wort, sondern ein Geschöpf. Doch sie sollen hören, wie Simon der Magier hören mußte: Die Gottlosigkeit des Valentin sei mit euch zum Verderben! Jeder aber glaube lieber Salomo, der das Wort selbst als Weisheit und Klugheit bezeichnet. Denn er sagt: “Gott hat in seiner Weisheit die Erde gegründet und hat die Himmel bereitet in Klugheit„. Wie es hier heißt “in Klugheit„, so heißt es in den Psalmen: “Durch das Wort des Herrn wurden die Himmel befestigt„. Wie aber durch das Wort die Himmel wurden, auf solche Weise machte er alles, was er wollte, und wie der Apostel an die Thessalonicher schreibt: “Der Wille Gottes ist in Christus Jesus„. So ist also der Sohn Gottes selbst das Wort und die Weisheit, selbst die Klugheit und der lebendige Ratschluß, und in ihm ist der Wille des Vaters. Er ist Wahrheit, Licht und Kraft des Vaters. Wenn aber der Wille Gottes die Weisheit und die Klugheit ist, der Sohn aber die Weisheit, so sagt man mit der Behauptung, der Sohn sei durch den Willen entstanden, soviel wie mit der andern, die Weisheit sei in der Weisheit entstanden, und der Sohn sei im Sohne gemacht, und das Wort durch das Wort geschaffen worden. Das aber streitet wider Gott und steht mit der von ihm inspirierten Schrift im Widerspruch. Denn auch der Apostel verkündet, daß der Sohn nicht des Willens, sondern der väterlichen Substanz selbst eigener Abglanz und Abriß sei, indem er sagt: “Der, da er Abglanz seiner Herrlichkeit und Abriß seiner Substanz ist„. Wenn aber, wie wir vorhin gesagt haben, die väterliche Substanz und Wesenheit nicht aus dem Willen stammt, so ist doch wohl ganz klar auch das nicht aus dem Willen, was der väterlichen Wesenheit eigen ist. Denn von welcher Art und wie nur immer jene väterliche Wesenheit sein mag, von der Art und so muß auch die Zeugung aus ihr sein. Daher hat auch der Vater selbst nicht gesagt: “Dieser ist der durch meinen Willen entstandene Sohn„, auch nicht: “Der Sohn, den ich durch Beschluß bekommen habe„, sondern einfach: “Mein Sohn„ und weiter: “an dem ich mein Wohlgefallen habe„. Damit will er sagen: “Dieser ist von Natur Sohn und in ihm ist der Wille für all das, was mir gefällt, niedergelegt.</p><p>Wenn nun der Sohn von Natur und nicht kraft eines Entschlusses ist, existiert dann der Sohn gegen den Willen des Vaters und ohne daß der Vater es wollte? Keineswegs, sondern der Sohn ist gewollt vom Vater und, wie er selbst sagt, „liebt der Vater den Sohn und zeigt ihm alles“. Denn wie seine Güte nicht Ausfluß eines Willens war und er doch fürwahr nicht wider Willen und ungewollt gut ist — denn was er ist, das ist er auch mit Willen —, so ist ihm auch die Existenz des Sohnes, wenn sie ihren Anfang auch nicht im Willen hat, doch nicht unliebsam noch wider Erwarten. Denn wie er seine eigene Wesenheit will, so kommt ihm auch der Sohn, der ja seiner Substanz eigen ist, nicht wider seinen Willen. Es soll also der Sohn vom Vater gewollt und geliebt werden. Und so möge man in gottesfürchtiger Weise von Gott denken, daß er wolle und nicht dawider sei. Denn mit dem Willen, mit dem der Sohn vom Vater gewollt wird, liebt und will und ehrt auch Er den Vater; und es besteht Ein Wille aus dem Vater im Sohne, weshalb man auch den Sohn im Vater und den Vater im Sohne schaut. Aber möge niemand wie Valentin noch einen vorausgehenden Ratschluß einführen, und niemand soll sich zwischen den alleinigen Vater und das alleinige Wort eindrängen unter dem Vorwand der Beratung. Denn es müßte einer rasen, wenn er zwischen den Vater und den Sohn Wille und Erwägung stellen wollte. Denn anders lautet die Rede: „Er ist durch den Willen geworden“, und anders die Aussage: „Er liebt seinen natureigenen Sohn und will ihn“. Denn in der Rede: „Er ist kraft des Willens entstanden“ kommt fürs erste zum Ausdruck, daß er einmal nicht war; sodann liegt hierin, wie gesagt, die Neigung nach beiden Seiten ausgesprochen, so daß man denken könnte, der Vater hätte den Sohn auch nicht wollen können. Doch vom Sohne behaupten: „Er hätte auch nicht sein können“, ist eine gottlose Verwegenheit, die auch die Wesenheit des Vaters trifft, wenn ja ein Wesensbestandteil von ihm hätte fehlen können. Denn es ist ungefähr so, wie wenn man sagte: „Es hätte der Vater auch nicht gut sein können“. Aber wie der Vater immer und von Natur gut ist, so ist er auch von Natur immer zeugend. Wenn man aber sagt: „Der Vater will den Sohn“ und: „Das Wort will den Vater“, so weist man damit nicht auf einen vorausgehenden Willen hin, sondern gibt die Echtheit der Natur und die Eigenheit und Ähnlichkeit der Substanz zu erkennen. Denn wie man auch beim Abglanz und beim Lichte sagen könnte, daß der Abglanz nicht einen vorangehenden Willen im Lichte habe, wohl aber seine natürliche Zeugung sei, gewollt von dem ihn auch erzeugenden Lichte, und zwar nicht auf Grund eines erwogenen Entschlusses, sondern von Natur und in Wahrheit, so könnte man auch vom Vater und Sohne mit Recht sagen, daß der Vater den Sohn liebt und will, und der Sohn den Vater liebt und will.</p><p>Man nenne also nicht den Sohn ein Werk des Willens, noch führe man auch die Lehre des Valentins in die Kirche ein, vielmehr nenne man ihn lebendigen Ratschluß und wahrhaft natürliche Zeugung, wie der Abglanz vom Licht. Denn so hat auch der Vater gesprochen: „Meinem Herzen entquoll ein gutes Wort“, und dementsprechend der Sohn: „Ich im Vater und der Vater in mir“. Wenn aber das Wort im Herzen ist, wo ist dann der Entschluß? Und wenn der Sohn im Vater ist, wo ist der Wille? Und wenn er selbst der Wille ist, wie ist der Ratschluß im Willen? Das ist ja ungereimt. Denn sonst müßte auch das Wort im Worte und der Sohn im Sohne sein und die Weisheit in der Weisheit, wie schon oft gesagt worden ist. Denn alles ist der Sohn, was dem Vater gehört, und nichts ist vor dem Worte im Vater, sondern im Worte ist auch der Wille. Und durch ihn werden auch die Äußerungen des Willens ins Werk gesetzt, wie die göttlichen Schriften bewiesen haben. Ich möchte aber, daß die Gottlosen, die ganz dem Unverstand anheimgefallen sind und nach einem Willen fahnden, jetzt nicht mehr ihre gebärenden Frauen fragen, an die sie früher die Frage stellten: „Hattest du einen Sohn, bevor du ihn gebarest?“, sondern, daß sie sich an die Väter wenden und sie fragen: „Werdet ihr mit Beratschlagen Väter, oder von Natur — euren Willen vorausgesetzt? Oder sind die Kinder eurer Natur und Substanz ähnlich?“ So mögen sie die Eltern fragen, um wenigstens von ihnen sich eines Bessern belehren zu lassen. Denn ihnen haben sie ja die Doppelfrage bezüglich der Geburt vorgelegt und von ihnen Aufschluß erwartet. Sie werden ihnen nämlich zur Antwort geben: „Was wir erzeugen, ist nicht dem Willen, sondern uns ähnlich, und wir werden nicht durch vorausgegangene Beratschlagung Eltern, sondern das Zeugen ist der Natur eigen. Denn auch wir sind Bilder der Erzeuger“. Darum sollen sie sich selbst das Urteil sprechen und ihre Fragen an die Frauen bezüglich des Sohnes Gottes einstellen, oder sich von ihnen belehren lassen, daß der Sohn nicht durch den Willen gezeugt wird, sondern in Natur und Wahrheit. Die von menschlichen Verhältnissen ausgehende Widerlegung ist bei diesen schicklich und angezeigt, da ja die Übelgesinnten sich auch von der Gottheit menschliche Vorstellungen machen. Warum rasen also die Christusfeinde immer noch? Denn wir haben doch auch diesen ihren Vorwand wie die andern als bloßes Wahngebilde und Hirngespinst aufgezeigt und nachgewiesen. Und darum müssen sie einmal, wenn auch erst spät, einsehen, in welchen Abgrund von Unverstand sie gefallen sind und auf unsere Mahnungen hin sich emporraffen und dem Fallstrick des Teufels entrinnen. Denn voll Menschenliebe ist die Wahrheit, die immerdar ruft: „Wenn ihr mir nicht glaubt wegen der leiblichen Hülle, so glaubet doch den Werken, damit ihr erkennet, daß ich im Vater bin und der Vater in mir ist“, und: „Ich und der Vater sind Eins“, und: „Wer mich gesehen, hat den Vater gesehen“. Doch der Herr ist in seinem Wesen menschenfreundlich, und er will alle, die gebrochenen Heizens sind, wieder aufrichten, wie es im Lobgesange Davids heißt. Da aber die Gottlosen die Stimme des Herrn nicht hören wollen, und es nicht sehen können, daß der Herr von allen als Gott und Gottessohn bekannt wird, so gehen die Unglücklichen wie Käfer herum und suchen mit ihrem Vater, dem Teufel, Vorwände für ihre Gottlosigkeit. Wie und wo werden sie nun daraufhin wieder solche finden können, wenn sie nicht etwa den Juden und dem Kaiphas die Lästerungen entlehnen und von den Heiden die Gottlosigkeit übernehmen? Denn die göttlichen Schriften sind ihnen verschlossen, und nach allen Seiten wurden sie aus ihnen überführt als Toren und Christusfeinde.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung des 19. Jahrhunderts, <em>Vier Reden gegen die Arianer</em> (BKV). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2093/versions/vier-reden-gegen-die-arianer-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "athanasius-four-discourses-against-the-arians-4"

    path: "Athanasius_Gegen_die_Arianer_4"
    title: "Vierte Rede gegen die Arianer"
    menu: { parent: "Dogmatisch-polemische Werke", title: "Vierte Rede gegen die Arianer", priority: 4 }
    update: true
    body: |-
      <p><em>Vierte Rede gegen die Arianer (Bibliothek der Kirchenväter).</em></p><p>Aus Gott ist Gott das Wort. Denn „Gott war das Wort“, und wieder: „Denen die Väter gehören, und aus denen Christus stammt, der ist über alles, Gott, hochgelobt in Ewigkeit. Amen“. Und da er Gott aus Gott ist, und Gottes Wort, Weisheit, Sohn und Kraft Christus ist, deshalb wird Ein Gott in den göttlichen Schriften verkündet. Denn da das Wort Sohn des Einen Gottes ist, so wird es auf ihn, dem es auch angehört, zurückbezogen, so daß zwar zwei sind, Vater und Sohn, aber eine unzertrennliche und unteilbare Einheit der Gottheit. Man kann so nur von einem Prinzip der Gottheit reden und nicht von zweien. Deshalb besteht im eigentlichen Sinne auch eine Monarchie. Aus dem Prinzip selbst aber ist das Wort Sohn von Natur, und zwar so, daß es nicht als ein zweites Prinzip für sich besteht, noch auch außerhalb desselben geworden ist, damit nicht durch die Verschiedenheit [des Prinzips] eine Dyarchie und Polyarchie entstehe, sondern so, daß es als des Einen Prinzips eigener Sohn, eigene Weisheit, eigenes Wort aus ihm stammend existiert. Denn nach Johannes war in diesem Prinzip das Wort, und das Wort war bei Gott. Denn Gott ist das Prinzip. Und da es aus dem Prinzip ist, deshalb war Gott auch das Wort. Wie es aber Ein Prinzip und dementsprechend Einen Gott gibt, ebenso ist die wirklich, wahrhaft und wesenhaft seiende Substanz und Wesenheit Eine, welche sagt: „Ich bin der Seiende“, und nicht zwei, damit nicht zwei Prinzipe wären. Aus dem Einen aber existiert von Natur und in Wahrheit ein Sohn, das Wort, die Weisheit, die ihm eigene und von ihm ungetrennte Kraft. Wie es aber kein anderes Prinzip gibt, damit es nicht zwei gebe, so ist auch das Wort aus dem Einen nicht ein losgetrenntes oder einfach ein bezeichnender Laut, sondern ein wesenhaftes Wort und wesenhafte Weisheit, die der Sohn in Wahrheit ist. Denn wenn es nicht wesenhaft wäre, so wird Gott in die Luft reden und einen Leib haben und damit nichts mehr als die Menschen. Da er aber kein Mensch ist, so hat wohl auch sein Wort nichts von der Ohnmacht der Menschen. Denn wie das Prinzip Eine Substanz ist, so ist dessen Wort und Weisheit nur Ein wesenhaftes und substanzielles, Denn wie es Gott aus Gott, und Weisheit aus dem Weisen, und Wort [Vernunft] aus dem Vernünftigen, und Sohn aus dem Vater, so ist es aus der Substanz substanziell, und aus der Wesenheit wesenhaft und des Wesens teilhaftig, und aus dem Seienden seiend.</p><p>Denn wenn nicht eine wesenhafte Weisheit und ein substanzielles Wort und ein seiender Sohn existiert, sondern einfach Weisheit, Wort und Sohn im Vater, so ist wohl der Vater selbst aus Weisheit und Wort zusammengesetzt. Wenn aber dem so ist, so werden sich die angeführten Ungereimtheiten ergeben. Er wird auch sein eigener Vater sein, und es wird der Sohn sich selbst zeugen und von sich selbst gezeugt werden, oder es sind Wort, Weisheit und Sohn ein bloßer Name, und es besteht dem Wesen nach der nicht, der so benannt wird, oder vielmehr, der das ist. Wenn er nun nicht dem Wesen nach besteht, dann sind wohl die Namen leer und inhaltslos, außer man wollte sagen, Gott sei die Weisheit selbst und das Wort selbst. Ist aber das der Fall, dann ist er wohl auch sein eigener Vater und Sohn, Vater, da er weise, Sohn, da er Weisheit ist. Oder aber ist das etwa in Gott als irgendeine Eigenschaft? Doch nein! das wäre ungeziemend. Denn Gott würde als aus Substanz und Eigenschaft zusammengesetzt befunden; denn jede Eigenschaft ist in der Substanz. Dementsprechend aber wird die göttliche Einheit, die unteilbar ist, zusammengesetzt erscheinen, geteilt in Substanz und Akzidenz. Man muß also die Vorlauten fragen: Der Sohn wurde als Weisheit und Wort Gottes ver-kündet. Wie ist er es nun? Wenn als Eigenschaft, dann ist die Ungereimtheit erwiesen, wenn aber Gott die Weisheit selbst ist, so hat die daraus folgende Ungereimtheit Sabellius ausgesprochen. Er ist es also als eine eigentliche Zeugung aus dem Vater selbst, wie wir am Lichte ein Beispiel haben. Denn wie das Licht aus dem Feuer, so ist das Wort aus Gott, die Weisheit aus dem Weisen und der Sohn aus dem Vater. Denn so bleibt auch die Einheit ungeteilt und unversehrt, und ihr Sohn ist nicht Substanz- und wesenloses Wort, sondern ein wahrhaft substanzielles. Denn wenn dem nicht so wäre, dann bestände wohl alles, was von ihm gesagt wird, nur im Gedanken und in bloßen Worten. Muß man aber die aus solcher Annahme folgende Ungereimtheit fliehen, so ist er denn wahres substanzielles Wort. Denn wie in Wahrheit ein Vater existiert, so ist in Wahrheit eine Weisheit. Insoweit nun sind es zwar zwei, weil nicht, wie Sabellius lehrt, derselbe Vater und Sohn, sondern der Vater Vater und der Sohn Sohn ist, Eins aber, weil er von Natur Sohn der Substanz des Vaters ist und das ihm eigene Wort. Das sagte der Herr: „Ich und der Vater sind Eins“. Denn weder ist das Wort getrennt vom Vater, noch war oder ist der Vater jemals ohne Wort. Deshalb hat er gesagt: „Ich im Vater, und der Vater in mir“.</p><p>Und wiederum ist Christus Gottes Wort. Ist er nun aus sich selbst entstanden und, da er schon existierte, mit dem Vater vereinigt worden, oder hat ihn Gott gemacht und ihn sein Wort genannt? Wenn nun das erste der Fall ist, ich meine, wenn er für sich selbst bestand und Gott ist, so gibt es wohl zwei Prinzipe; aber er wird natürlich auch dem Vater nicht eigen sein, weil er nicht dem Vater selbst, sondern sich selbst angehört. Ist er aber von außen gemacht worden, so ist er wohl ein Geschöpf. Es bleibt also nur noch übrig, zu sagen, er sei aus Gott selbst. Ist aber das der Fall, so ist wohl etwas anderes das, was aus etwas stammt, und etwas anderes das, woraus es stammt. Sonach sind es also zwei. Sollten es aber nicht zwei sein, und sollte es von einem und demselben Ding ausgesagt sein, so wird das nämliche Grund und Begründetes, Gezeugtes und Zeugendes sein, eine Ungereimtheit, die wir dem Sabellius nachgewiesen haben. Ist es aber aus ihm, ohne etwas anderes zu sein, so wird er zeugend und nicht zeugend sein, zeugend, weil es aus ihm hervorbringt, nicht zeugend aber, weil es nichts anderes als es selbst ist. Ist dem aber so, so würde dem Gedanken nach derselbe Vater und Sohn genannt. Wenn es aber so ungeziemend ist, so sind wohl zwei, Vater und Sohn, aber Eins, weil der Sohn nicht von außen, sondern aus Gott gezeugt ist. Wenn aber jemand Anstand nimmt, ihn eine Zeugung zu nennen, und bloß sagt, daß das Wort mit Gott bestehe, so möge ein solcher sich in acht nehmen, daß er nicht, indem er die Worte der Schrift beanstandet, in eine Ungereimtheit falle und irgendwie einen zweigestaltigen Gott aufstelle. Denn indem er nicht zugibt, daß das Wort aus der Einheit, sondern bloß, daß das Wort mit dem Vater verbunden sei, stellt er eine Zweiheit der Substanz auf, wobei keine Vater der andern ist. Das nämliche gilt auch von der Kraft. Deutlicher kann man das sehen, wenn man auf den Vater schaut. Den Einen Vater gibt es, nicht zwei, aber aus dem Einen ist der Sohn. Wie es also nicht zwei Väter gibt, sondern Einen, so nicht zwei Prinzipe, sondern Eines, und aus dem Einen ist der Sohn wesenhaft. Die Arianer muß man nun aber umgekehrt fragen. Denn die Sabellianisierenden muß man aus dem Begriff „Sohn“, die Arianer aber aus dem Begriff „Vater“ widerlegen.</p><p>Man muß also sagen: Gott ist weise und nicht ohne Wort [Vernunft], oder im Gegenteil: Er ist unweise und ohne Wort [Vernunft]. Trifft nun das letztere zu, so liegt in der Behauptung selbst die Ungereimtheit. Ist aber das erstere der Fall, so muß man fragen: Wie ist er weise und nicht ohne Wort [Vernunft]? Hat er von außen das Wort und die Weisheit empfangen oder aus sich selbst? Wenn nun von außen, dann wird es einen geben, der es ihm gegeben hat, und er ist unweise und ohne Wort, bevor er es empfing, wenn aber aus sich selbst, so ist es offenbar nicht aus Nichtseiendem, und es war auch niemals eine Zeit, da es nicht war; denn es war immer, da auch der immer existiert, dessen Bild es ist. Wenn sie aber sagen, daß er weise und nicht ohne Wort sei, jedoch eine eigene Weisheit und ein eigenes Wort in sich habe, nicht aber Christus, sondern das, in dem er auch Christus gemacht hat, so muß man sagen: Wenn Christus in jenem Wort entstanden ist, dann offenbar auch alles. Und es wäre dasselbe, von dem Johannes sagt: „Alles ist durch dasselbe entstanden“, und der Psalmist: „Alles hast Du in Weisheit gemacht“. Christus wird aber dann als Lügner befunden, da er sagt: „Ich bin im Vater“, wenn doch ein anderer im Vater ist. Und wenn es heißt: „Das Wort aber ist Fleisch geworden“, so ist dies nach ihnen nicht wahr. Denn wenn der, in dem alles geworden, selbst Fleisch geworden ist, Christus aber nicht das Wort im Vater ist, durch das alles geworden, dann ist doch Christus nicht Fleisch geworden, sondern wurde vielleicht Christus Wort genannt. Und wenn dies der Fall ist, so wäre er fürs erste ein anderer als der Name besagt, fürs zweite ist nicht durch ihn alles entstanden, sondern in jenem, in dem auch Christus geworden ist. Wenn sie aber sagen, die Weisheit sei wie eine Eigenschaft im Vater oder er sei selbst die Weisheit, so werden daraus die schon oben genannten Ungereimtheiten sich ergeben; denn er wird zusammengesetzt und selbst sein eigener Vater und Sohn sein. Doch man muß sie überführen und ihnen zur Beschämung beweisen, daß das Wort in Gott kein Geschöpf und auch nicht aus dem Nichtseienden ist. Ist aber einmal ein Wort in Gott, dann ist es wohl Christus selbst, der sagt: „Ich im Vater und der Vater in mir“, der deshalb auch eingeboren ist, da kein anderer aus ihm gezeugt wurde. Einer ist dieser Sohn, der Wort, Weisheit und Kraft ist; denn nicht ist Gott damit zusammengesetzt, sondern er ist dessen Erzeuger. Denn wie er die Geschöpfe durch das Wort erschafft, so hat er das Wort nach der Natur der eigenen Substanz als Zeugung, durch das er alles macht, schafft und anordnet. Denn durch das Wort und die Weisheit ist alles entstanden und durch seine Anordnung bleibt alles erhalten. Dasselbe gilt auch vom Sohne. Wenn Gott nicht zeugt, dann ist er auch untätig; denn seine Zeugung ist der Sohn, durch den er tätig ist, Wenn aber nicht, dann werden diese Unverschämten sich in dieselben Fragen und Ungereimtheiten verwickeln.</p><p>Aus dem Deuteronomium: „Ihr aber, die ihr mit dem Herrn, eurem Gott, verbunden seid, lebt alle am heutigen Tage“. Aus dieser Stelle kann man den Unterschied abnehmen und erkennen, daß der Sohn Gottes nicht ein Geschöpf ist; denn der Sohn sagt: „Ich und der Vater sind Eins“, und: „Ich im Vater und der Vater in mir“, die gewordenen Dinge aber sind, wenn sie zunehmen, mit dem Herrn verbunden. Denn das Wort ist als ein eigenes im Vater; die gewordenen Dinge aber, die von außen stammen, sind als solche verbunden, die von Natur fremd aber dem Willen nach verbunden sind. Denn auch der naturhafte Sohn ist Eins mit dem Erzeuger. Wer aber von außen zum Sohne gemacht wird, der wird mit dem Geschlechte verbunden sein. Deshalb fügte er auch alsbald bei: „Welches ist das große Volk, dem sein Gott nahe tritt?“ und anderswo: „Ich bin ein Gott, der sich naht“. Denn den gewordenen Dingen naht er sich, da sie ihm fremd sind, dem Sohne naht er sich nicht, da er ihm eigen ist, sondern ist in ihm, und der Sohn ist nicht mit dem Vater verbunden, sondern existiert zugleich mit ihm. Daher sagt auch wieder Moses im nämlichen Deuteronomium: „Ihr werdet seine Stimme hören und mit ihm in Verbindung gesetzt werden“. Was aber in Verbindung gesetzt wird, das wird von außen in Verbindung gesetzt.</p><p>Auf die leichtsinnige und menschliche Ansicht der Arianer, in der sie den Herrn bedürftig wähnen, wenn er sagt: „Es ist mir gegeben worden“, und: „Ich empfing“, und wenn Paulus sagt: „Darum erhöhte er ihn“, und: „Er sitzt zur Rechten“ und ähnliches, muß man sagen, daß unser Herr als Wort und Sohn Gottes einen Leib trug und auch Menschensohn geworden ist, um, Mittler zwischen Gott und den Menschen geworden, Gottes Sache bei uns und die unsrige bei Gott zu vertreten. Wenn es nun von ihm heißt, daß er hungere und weine und müde werde und Eloi, Eloi rufe, was menschliche Äußerungen und unsere Leiden sind, so empfängt er dies von uns und bringt es dem Vater dar, indem er für uns eintritt, damit es in ihm getilgt werde. Wenn es aber heißt: „Es ist mir Macht gegeben“, und: „Ich empfing“, und: „Deshalb erhöhte ihn Gott“, so sind das die von Gott durch ihn an uns verteilten Gnadengeschenke. Denn nicht das Wort war bedürftig, noch ist es das jemals gewesen. Auch waren die Menschen wieder nicht fähig, sich dies zu beschaffen. Vielmehr wird uns durch das Wort gegeben. Deshalb wird uns gegeben, da es ihm gegeben wird. Denn darum wurde er auch Mensch, damit das gleichsam ihm Geschenkte auf uns übergehe. Denn als bloßer Mensch wäre er dessen nicht gewürdigt worden; aber als bloßes Wort wäre er wieder dessen nicht bedürftig gewesen. Es verband also das Wort sich mit uns und gab uns damals Macht und erhöhte uns. Denn da das Wort im Menschen war, erhöhte es den Menschen und, da das Wort im Menschen war, empfing der Mensch. Da nun das Wort im Fleische war, wurde der Mensch erhöht und empfing Macht, und deshalb wird dies auf das Wort bezogen, da es seinetwegen gegeben wurde; denn diese Gnaden wurden wegen des Wortes im Menschen gegeben. Und wie das Wort Fleisch wurde, so hat auch der Mensch, was er empfing, durch das Wort empfangen. Denn von allem, was der Mensch empfangen hat, heißt es, das Wort habe es empfangen, damit offenbar würde, daß der Mensch, der seiner Natur nach nicht würdig war, zu empfangen, gleichwohl wegen des fleischgewordenen Wortes empfangen hat. Daher muß man, wenn es heißt, daß irgend etwas dem Herrn verliehen werde oder etwas Ähnliches, denken, es sei nicht ihm als einem Bedürftigen gegeben worden, sondern dem Menschen durch das Wort. Denn jeder, der für einen andern eintritt, empfängt selbst die Gabe, nicht weil er sie nötig hat, sondern um dessentwillen, für den er eintritt.</p><p>Denn wie er unsere Schwächen auf sich nimmt, obwohl er nicht schwach ist und hungert, obschon er nicht hungert, sondern das Unsrige [dem Vater] darbringt, damit es vernichtet werde, so nimmt er auch die anstatt der Schwächen von Gott verliehenen Geschenke wieder in Empfang, damit der mit ihm verbundene Mensch daran Anteil nehmen könne. So sagt ja der Herr: „Alles, was Du mir gegeben hast, habe ich ihnen gegeben“, und wieder: „Für sie bitte ich“. Denn er bat für uns, indem er das Unsrige auf sich nahm, und er gab uns, was er empfing. Da nun wegen der Verbindung des Wortes mit dem Menschen der Vater im Hinblick auf das Wort dem Menschen verlieh, daß er erhöht wurde, alle Macht empfing und alles ähnliche, so wird alles auf das Wort selbst bezogen und wird gleichsam ihm gegeben, was durch ihn wir empfangen. Denn wie er unsertwegen selbst Mensch wurde, so werden wir seinetwegen erhöht, und es ist durchaus nicht ungereimt, wenn man von ihm sagt, er sei unsertwegen erhöht worden, wie er sich unsertwegen erniedrigte. „Er schenkte“ also „ihm“ anstatt: uns seinetwegen, und: „er erhöhte ihn“ anstatt: uns in ihm. Und wenn wir erhöht werden und empfangen und Hilfe erhalten, so dankt das Wort selbst dem Vater, wie wenn er selbst erhöht würde, empfinge und Hilfe erhielte, indem er das Unsrige auf sich überträgt und sagt: „Alles, was Du mir gegeben hast, habe ich ihnen gegeben“.</p><p>Die Ariomaniten, die Anhänger des Eusebius sind, teilen dem Sohne einen Anfang des Seins zu und geben sich dabei den Anschein, als wollten sie ihm nicht einen Anfang der Herrschaft zuschreiben. Es ist aber das lächerlich. Denn wer dem Sohne einen Anfang des Seins zuschreibt, schreibt ihm offenbar auch einen Anfang der Herrschaft zu. Sie geben also in ihrer Blindheit zu, was sie leugnen. Und die, welche sagen, es existiere vom Sohne nur der Name, der Sohn Gottes aber, d. h. das Wort des Vaters, sei nicht wesenhaft und nicht substanziell, geben sich wieder den Anschein, als wären sie ungehalten über die, welche behaupten: „Es war einmal, da er nicht war“. Doch auch das ist lächerlich. Denn die, welche ihm das Sein überhaupt absprechen, halten sich über die auf, die es ihm wenigstens in der Zeit zusprechen. So geben denn diese zu, was sie leugnen, indem sie gegen die andern Vorwürfe erheben. Und wieder leugnen die Eusebianer, die den Sohn bekennen, daß er von Natur Wort sei, und wollen den Sohn nur im Gedanken Wort genannt wissen. Die andern dagegen, die das Wort bekennen, leugnen, daß es Sohn sei und wollen es nur im Gedanken Sohn genannt wissen und reden so in gleicher Weise ins Blaue hinein.</p><p>„Ich und der Vater sind Eins“. Ihr sagt, daß entweder die zwei Eins seien, oder das „Eins“ doppelnamig, oder wieder das Eins in zwei geteilt sei. Wenn nun das Eins in zwei geteilt ist, dann muß das Geteilte ein Leib sein, und keines ist dann vollkommen; denn jedes ist ein Teil und nicht ein Ganzes. Wenn aber das Eins doppelnamig ist, so ist das die Lehre des Sabellius, der denselben Sohn und Vater nennt und beide aufhebt, den Vater, wenn er Sohn, und den Sohn, wenn er Vater ist. Wenn aber die zwei Eins sind, so müssen zwei existieren, aber nur Eins der Gottheit nach und entsprechend der Wesenseinheit des Sohnes mit dem Vater und der Abstammung des Wortes vom Vater, so daß zwar zwei sind, weil der Vater und der Sohn d. h. das Wort sind. Eins aber, weil Ein Gott ist. Denn wenn es nicht so ist, so hätte gesagt werden müssen: „Ich bin der Vater“ oder: „Ich bin auch der Vater“, Nun aber bezeichnet er mit dem „Ich“ den Sohn und mit dem „und der Vater“ den Erzeuger, mit dem „Eins“ aber die Eine Gottheit und seine Wesenseinheit. Denn nicht, wie die Heiden meinen, ist derselbe weise und Weisheit, oder ist derselbe Vater und Wort. Denn es geht nicht an, daß er eigener Vater sei; vielmehr weiß die göttliche Lehre vom Vater und Sohn, weisem und Weisheit, Gott und Wort, hält jedoch nur im allgemeinen aufrecht, daß er in allem ohne Trennung, Spaltung und Teilung ist.</p><p>Sollte aber einer, wenn er hört, daß Vater und Sohn zwei sind, uns verleumden wollen, als verkündeten wir zwei Götter — denn auf dergleichen Einfälle kommen manche und spotten dann alsbald: ihr redet von zwei Göttern —, so muß man solchen erwidern: Wenn der, welcher Vater und Sohn anerkennt, zwei Götter annimmt, so muß auch der, der nur Einen annimmt, den Sohn aufheben und Sabellius beipflichten. Denn wenn der, welcher zwei annimmt, heidnisch denkt, dann ist der, der Eins annimmt, ein Sabellianer. Doch dem ist nicht so, Ferne sei es! Wie vielmehr der, welcher Vater und Sohn für zwei nimmt, Einen Gott annimmt, so mag der, der an Einen Gott glaubt, Vater und Sohn sich als zwei denken, die aber durch die Gottheit Eins sind und dadurch, daß das aus dem Vater stammende Wort ohne Teilung, Trennung und Absonderung von ihm existiert. Ein menschliches Beispiel sei das Feuer und dessen Abglanz, die zwei sind in ihrer Existenz und fürs Auge, Eins aber, insofern sein Abglanz aus ihm stammt und von ihm untrennbar ist.</p><p>Sie fallen in dieselbe Torheit wie die Arianer; denn auch sie behaupten, er sei unsertwegen geschaffen worden, um uns zu schaffen, wie wenn Gott unsere Erschaffung abgewartet hätte, um dann nach der Ansicht jener ihn aus sich hervorgehen zu lassen, nach der Ansicht dieser ihn zu erschaffen. Die Arianer gewähren also uns mehr als dem Sohne. Denn nicht wir sind seinetwegen, so sagen sie, sondern er ist unsertwegen geworden, wenn er ja darum erschaffen wurde und ins Dasein trat, damit Gott uns durch ihn schaffe. Diese aber gewähren mit gleicher oder noch größerer Gottlosigkeit Gott weniger als uns. Denn wir sind oft tätig, auch wenn wir schweigen und nur denken, indem wir uns nämlich das Gedachte auch in Bildern vorstellen. Von Gott aber wollen sie annehmen, daß er schweigend untätig sei und erst redend Kraft besitze, wenn er nämlich schweigend nichts machen konnte, redend aber zu schaffen begann. Man fragt sie da mit Recht, ob das Wort, da es in Gott war, vollkommen gewesen sei, so daß es auch schaffen konnte. Wenn es nun in Gott unvollkommen war, mit der Zeugung aber vollkommen geworden ist, dann waren wir die Ursache seiner Vervollkommnung, wenn es ja unsertwegen gezeugt worden ist. Denn unsertwegen hat es auch die Macht zu zeugen hinzubekommen. War es aber in Gott vollkommen, so daß es auch schaffen konnte, so war seine Geburt überflüssig; denn es konnte auch im Vater wirken. Daher ist es entweder nicht gezeugt oder nicht unsertwegen gezeugt, sondern, weil es immer aus dem Vater ist. Denn seine Geburt zeigt nicht unsere Erschaffung an, sondern seine Herkunft von Gott; denn es war auch vor unserer Erschaffung.</p><p>Es wird sich aber zeigen, daß sie dasselbe sich dem Vater gegenüber erlauben. Denn wenn er schweigend nicht wirken konnte, so muß er zeugend, d. h. redend, Kraft erst angenommen haben. Und woher hat er sie empfangen und warum? Wenn er aber mit dem Worte in sich schaffen konnte, dann zeugt er unnötig, da er auch schweigend wirken konnte. Ferner, wenn das Wort vor seiner Zeugung in Gott war, dann war es also nach der Zeugung außerhalb und nicht in Gott. Wenn aber dem so ist, wie kann es jetzt sagen: „Ich im Vater und der Vater in mir“? Wenn es aber jetzt im Vater ist, dann war es ja immer im Vater, so wie es auch jetzt ist, und es ist überflüssig, zu sagen: Es ist unsertwegen gezeugt worden und kehrt nach uns zurück, um zu sein, wie es war. Denn es war nicht, was es jetzt nicht ist, noch auch ist es jetzt, was es nicht war; vielmehr ist es, wie es immer war, und verhält sich immer auf die gleiche Weise, da es sonst unvollkommen und unveränderlich erscheinen würde. Denn wenn es das, was es war, später sein wird, wie wenn es dies jetzt nicht wäre, so ist es jetzt offenbar nicht, was es war und sein wird. Ich sage aber: Wenn es früher in Gott war und auch hernach wieder in ihm sein wird, so ist offenbar jetzt das Wort nicht in Gott. Doch sie widerlegt der Herr mit den Worten: „Ich im Vater und der Vater in mir“. Denn es ist jetzt so, wie es immer war. Ist es aber jetzt so, wie es immer war, so wurde es offenbar nicht einmal gezeugt, einmal nicht, und nicht war einmal Ruhe in Gott, und ein andermal redete er; sondern er ist immer Vater, und sein Wort ist der Sohn und er ist nicht nur dem Namen nach Wort, noch auch das Wort nur in Gedanken Sohn, sondern es ist wesenseins mit dem Vater und ist nicht unsertwegen gezeugt worden; denn wir sind seinetwegen entstanden. Denn wenn es unsertwegen gezeugt worden wäre, und wir mit seiner Zeugung geschaffen worden wären, und wenn durch seine Geburt die Schöpfung sich gebildet hätte und es zurückkehrte, um zu sein, was es zuvor war, dann wird fürs erste der Gezeugte wieder nicht gezeugt sein. Denn wenn sein Hervorgehen eine Geburt ist, dann ist die Rückkehr wieder das Aufhören der Geburt. Denn wenn es in Gott ist, wird Gott wieder schweigen. Wenn er aber schweigen wird, dann wird sein, was war, da er schwieg, nämlich Ruhe und keine Schöpfung; die Schöpfung wird also wieder aufhören. Denn wie mit dem Hervortreten des Wortes die Schöpfung entstanden ist und existierte, so wird, wenn das Wort wieder zurückgeht, die Schöpfung nicht weiter bestehen. Wozu ist sie nun entstanden, wenn sie aufhören soll? Oder warum redete Gott, um darnach zu schweigen? Warum ließ er das Wort aus sich hervorgehen, wenn er es wieder zurückruft? Und warum zeugte er es, wenn er seiner Geburt wieder ein Ende machen wollte? Was aber wieder sein wird, ist ungewiß. Denn er wird entweder immer schweigen oder er wird wieder zeugen und eine andere Schöpfung ersinnen; denn er wird nicht dieselbe schaffen — sonst wäre nämlich die bereits entstandene geblieben —, sondern eine andere, der er aber folgerichtig auch ein Ende machen wird, um eine neue zu ersinnen und so fort ins Unendliche.</p><p>Vielleicht haben sie das von den Stoikern übernommen, die behaupten, daß Gott sich zusammenziehe und mit der Schöpfung wieder ausdehne und ohne Ende ruhe. Denn was sich erweitert, erweitert sich aus der Enge, und was sich ausdehnt, dehnt sich aus, nachdem es zuvor zusammengezogen war. Und es ist dasselbe und erfährt nichts weiter als ein Leiden. Wenn nun die Einheit durch Erweiterung eine Dreiheit geworden ist, die Einheit aber der Vater ist, die Dreiheit aber Vater, Sohn und Hl. Geist, dann hat fürs erste die Einheit in der Erweiterung ein Leiden erfahren und ist geworden, was sie nicht war; denn sie, die nicht weit war, wurde erweitert. Sodann ist, wenn die Einheit selbst zur Dreiheit erweitert wurde, die Dreiheit aber Vater, Sohn und Hl. Geist ist, derselbe Vater, Sohn und Hl. Geist geworden, wie Sabellius denkt, außer es wäre die von ihm genannte Einheit etwas anderes als der Vater. Dann hätte man nicht mehr von einer Erweiterung sprechen sollen, sondern sagen müssen, die Einheit sei schöpferische Ursache für drei, so daß sie [zunächst] Einheit ist, nachher Vater, Sohn und Geist. Denn wenn diese sich erweiterte und ausdehnte, so ist sie wohl selbst, was sich ausdehnte. Und eine erweiterte Dreiheit ist keine Einheit mehr. Als Einheit aber war sie noch keine Dreiheit. Denn da der Vater war, war noch nicht der Sohn und Geist; ist er aber dies geworden, dann ist er nicht mehr bloß Vater. Eine solche falsche Behauptung aber kann wohl nur der aufstellen, der von einem Leibe Gottes redet und ihn als leidensfähig hinstellt. Denn was bedeutet Sicherweitern anders als ein Leiden dessen, der sich erweitert. Oder was ist das, was sich erweitert, anders, als was zuvor nicht so, sondern enge war. Denn es ist das nämliche und nur der Zeit nach verschieden.</p><p>Das erkennt auch der göttliche Apostel, wenn er an die Korinthier schreibt: „Nehmt keinen engen Raum in uns ein, sondern erweitert auch ihr euch, Korinthier“. Er rät nämlich, sie sollten die Enge mit der Erweiterung vertauschen. Wie aber die Korinthier, wenn sie sich, zuvor auch eingeengt, wieder erweiterten, keine anderen waren, sondern eben wieder Korinthier, so ist auch, wenn der Vater sich zu einer Dreiheit erweiterte, die Dreiheit wieder der Vater allein. Es sagt aber wieder derselbe; „Unser Herz hat sich erweitert“. Und Noe sagt: „Gott erweitere dem Japhet“. Es ist jedoch dasselbe Herz und derselbe Japhet in der Erweiterung. Wenn also die Einheit erweiterte, dann erweiterte sie wohl für andere. Wenn sie aber für sich selbst erweiterte, so ist sie wohl selbst, was erweitert wurde. Was ist es aber anderes als der Sohn und Hl. Geist? Doch ist es gut, wenn man den, der solches redet, fragt: „Worin besteht die Tätigkeit einer solchen Erweiterung?“ oder gleichsam im Angesichte der Wahrheit: „Warum erweiterte sich überhaupt die Einheit?“ Denn was nicht dasselbe bleibt, sondern später sich erweitert, muß doch notwendig einen Grund haben, weshalb es sich auch erweiterte. Wenn nun deshalb, damit Wort und Geist in ihm wohnen, so ist es überflüssig, zu sagen: „Einheit“ und dann: „Sie erweiterte sich“, denn er ist nicht später Wort und Geist, sondern immer, damit nicht Gott, wie die Arianer lehren, ohne Wort sei. Deshalb war er, wenn er immer Wort und Geist war, immer erweitert und nicht zuerst eine Einheit. Wenn er aber später sich erweiterte, dann ist er auch später Wort Wenn er aber wegen der Menschwerdung sich erweiterte und damals Dreiheit geworden ist, dann war also vor der Menschwerdung noch keine Dreiheit. Doch damit will es den Anschein gewinnen, als sei der Vater auch Fleisch geworden, wenn er ja als Einheit in dem Menschen sich erweiterte, und er wird dann wohl Einheit sein und Fleisch und drittens Geist. Wenn er sich aber selbst erweiterte, dann wird er auch nur dem Namen nach Dreiheit sein. Wenn er aber zum Zweck der Erschaffung sich erweiterte, so ist das ungereimt. Denn wenn er auch eine Einheit blieb, hätte er alles erschaffen können. Die Einheit bedurfte ja nicht einer Erweiterung, noch auch war sie vor ihrer Erweiterung ohnmächtig. Denn ungereimt und gottlos ist es, das von der Gottheit zu denken und zu sagen. Es wird sich aber auch eine weitere Ungereimtheit ergeben. Wenn er nämlich zum Zweck der Erschaffung sich erweiterte und, solange die Einheit bestand, die Schöpfung nicht existierte, nach der Vollendung aber statt der Erweiterung wieder eine Einheit sein wird, so wird auch die Schöpfung vergehen. Denn wie er zum Zweck der Erschaffung sich erweiterte, so wird auch die Schöpfung ein Ende nehmen, sobald die Erweiterung ein Ende nimmt.</p><p>Auf dergleichen Ungereimtheiten nun wird man stoßen, wenn man behauptet, die Einheit werde durch eine Erweiterung zur Dreiheit. Da aber die, welche so reden, damit sich vermessen, Wort und Sohn aufzuheben und zu behaupten, das Wort sei ein anderer und der Sohn sei ein anderer, und zuerst sei das Wort und dann der Sohn, nun wohl, so wollen wir uns auch darüber klar werden. Ihre Vermessenheit ist eine verschiedenartige. Die einen behaupten nämlich, der Mensch, den der Erlöser annahm, sei selbst der Sohn. Andere behaupten, beides, der Mensch und das Wort, seien damals Sohn geworden, als sie sich vereinigten. Wieder andere sagen, das Wort selbst sei damals Sohn geworden, als es Mensch wurde. Aus einem Wort, erklären sie, ist ein Sohn geworden, während zuvor kein Sohn war, nur ein Wort. Stoisch ist nun beides: die Lehre von der Erweiterung Gottes wie die Ableitung des Sohnes. Über die Maßen unverständig ist es aber, daß sie von einem Wort reden und leugnen, daß es Sohn sei. Wenn nämlich das Wort nicht aus Gott ist, dann leugnen sie wohl mit Recht, daß es Sohn sei. Wenn es aber aus Gott ist, warum sehen sie dann nicht ein, daß, was aus einem ist, Sohn dessen ist, aus dem es auch stammt. Ferner, wenn Gott Vater des Wortes ist, warum sollte nicht auch das Wort Sohn seines Vaters sein? Denn es ist und heißt einer Vater dessen, der sein Sohn ist, und es ist und heißt einer Sohn dessen, der sein Vater ist. Wenn also Gott nicht der Vater Christi ist, dann ist wohl auch das Wort nicht Sohn. Wenn aber Gott Vater ist, dann ist selbstverständlich auch das Wort Sohn. Wenn er aber später Vater und zuerst Gott ist, so ist das die Anschauung der Arianer. Ferner ist es ungereimt, daß Gott sich ändere; denn das ist eine Eigenschaft des Leibes. Wenn er aber wie bei der Schöpfung später Schöpfer ist, so muß man sich bewußt bleiben, daß der Veränderung die später entstandenen Dinge unterliegen, nicht aber Gott.</p><p>Wäre nun der Sohn ein gemachtes Wesen, so wäre richtig auch bei ihm der Vater später. Ist aber der Sohn kein gemachtes Wesen, dann ist der Vater immer und immer auch der Sohn. Wenn aber der Sohn immer ist, so ist er wohl das Wort. Sollte aber das Wort nicht Sohn sein und sollte das einer zu bestreiten wagen, so nennt er entweder das Wort Vater oder er setzt den Sohn über das Wort. Denn wenn der Sohn im Schoße des Vaters ist, dann kann unmöglich das Wort vor dem Sohne existieren — denn nichts ist vor dem, der im Vater ist —, oder aber ist das Wort, wenn vom Sohne verschieden, dann wohl der Vater, in dem der Sohn ist. Ist aber das Wort nicht Vater, sondern Wort, so ist wohl das Wort außerhalb des Vaters, da der Sohn im Schoße des Vaters ist. Denn nicht beide Wesen, das Wort und der Sohn, sind im Schoße, sondern Einer muß es sein und zwar der Sohn, der eingeboren ist. Und wiederum, wenn ein anderer das Wort ist und ein anderer der Sohn, dann wird man den Sohn höher stehend als das Wort finden. Denn niemand erkennt den Vater als nur der Sohn, nicht das Wort. Entweder kennt also das Wort ihn nicht, oder aber kennt er ihn, und dann sind die Worte: „Niemand kennt“ eine Lüge. Das nämliche gilt auch von dem Ausspruch: „Wer mich gesehen hat, hat den Vater gesehen“, und: „Ich und der Vater sind Eins“. Denn das sind nach ihrer Ansicht Worte des Sohnes und nicht des Wortes. Es erhellt dies aber auch aus den Evangelien. Denn nach Johannes sagt der Herr: „Ich und der Vater sind Eins. Da hoben die Juden Steine auf, um ihn zu steinigen. Jesus entgegnete ihnen: Ich habe euch viele gute Werke von meinem Vater gezeigt, um welches dieser Werke willen steinigt ihr mich? Die Juden antworteten ihm: Wir steinigen Dich nicht eines guten Werkes wegen, sondern um der Gotteslästerung willen, weil Du Dich selbst zu Gott machst, da Du ein Mensen bist. Jesus antwortete ihnen: Steht nicht in euerm Gesetze geschrieben: Ich habe gesagt: Ihr seid Götter? Wenn er diejenigen Götter nannte, an welche die Rede Gottes ergangen ist, und die Schrift nicht aufgehoben werden kann, wie saget ihr zu dem, den der Vater geheiliget und in die Welt gesandt hat: Du lästerst Gott! weil ich gesagt habe: Ich bin der Sohn Gottes? Tu ich die Werke meines Vaters nicht, so möget ihr mir nicht glauben; tu ich sie aber, so glaubet den Werken, wenn ihr mir nicht glauben wollet, damit ihr erkennet und glaubet, daß der Vater in mir ist und ich in dem Vater“. Doch, wie man offenbar erkennen muß, hat er nicht gesagt: „Ich bin Gott“, noch auch: „Ich bin Gottessohn“, sondern: „Ich und der Vater sind Eins“.</p><p>Die Juden nun glaubten, da sie „Eins“ hörten, er habe sich so, wie Sabellius lehrt, selbst als den Vater bezeichnet. Doch unser Heiland zeiht sie der Sünde in der Schlußfolgerung: Wenn ich mich auch Gott genannt hätte, so hättet ihr das Schriftwort kennen sollen: „Ich sprach: Ihr seid Götter“. Als er dann die Worte: „Ich und der Vater sind Eins“ erklärte, hat er dem Sohne die Einheit mit dem Vater durch die Worte zugeeignet: „Weil ich gesagt habe: Ich bin Gottes-Sohn. Denn wenn er es auch nicht ausdrücklich gesagt hat, so hat er doch den Sinn des Wortes: “Wir sind Eins„ auf den Sohn bezogen. Denn nichts ist Eins mit dem Vater als nur das, was aus ihm stammt. Was wäre aber das, was aus ihm kommt, anders als der Sohn? Darum fügte er bei: “Damit ihr erkennet, daß ich im Vater bin und der Vater in mir„. Denn indem er das Eins erklärte, sagte er, daß nicht darin, daß er selbst jenes sei, womit er Eins sei, die Verbindung und Unzertrennlichkeit bestehe, sondern darin, daß er im Vater sei und der Vater im Sohne. Denn auch den Sabellius widerlegt er damit, indem er nicht sagt: “Ich bin der Vater„, sondern “der Sohn Gottes„, und den Arius mit dem Worte: “Wir sind Eins„. Wenn also der Sohn etwas anderes und das Wort etwas anderes ist, dann ist nicht das Wort Eins mit dem Vater, sondern der Sohn, und es hat auch nicht den Vater gesehen, wer das Wort, sondern wer den Sohn gesehen hat. Demnach aber ist entweder der Sohn größer als das Wort, oder das Wort hat dem Sohne nichts voraus. Denn was ist größer oder vollkommener als das “Eins„, und das “Ich im Vater und der Vater in mir„, und “Wer mich gesehen, hat den Vater gesehen„? Denn auch das sind Aussprüche des Sohnes; es berichtet ja derselbe Johannes: “Wer mich gesehen, hat den gesehen, der mich gesandt hat„, und: Wer mich aufnimmt, nimmt den auf, der mich gesandt hat“, und: „Ich bin als das Licht in die Welt gekommen, damit jeder, der an mich glaubt, nicht in der Finsternis bleibe“, und: „Wenn einer meine Worte hört und nicht hält, so richte ich ihn nicht. Denn ich bin nicht gekommen, die Welt zu richten, sondern die Welt zu retten. Das Wort aber, das er hört, das wird ihn richten am jüngsten Tage. Denn ich gehe zum Vater“. Das gepredigte Wort, sagt er, richte den, der das Gebot nicht hält; er sagt nämlich: „Wenn ich nicht gekommen wäre und nicht zu ihnen geredet hätte, hätten sie keine Sünde. Nun aber“, fügt er bei, „werden sie keine Entschuldigung haben“, da sie meine Worte nicht gehört haben, durch welche die das Heil erlangen, die sie beobachten.</p><p>Vielleicht mögen sie nun in unverschämter Weise behaupten, dies seien nicht die Worte des Sohnes, sondern des Wortes. Doch bei den weiter oben angeführten Worten war offenbar der Sohn der Redende; denn der hier spricht: „Ich bin nicht gekommen, die Welt zu richten, sondern zu retten“, ist nachweisbar kein anderer als der eingeborene Sohn Gottes. Es sagt nämlich im Vorausgehenden derselbe Johannes: „So sehr hat Gott die Welt geliebt, daß er seinen eingeborenen Sohn dahingab, damit jeder, der an ihn glaubt, nicht verloren gehe, sondern ewiges Leben habe. Denn Gott hat seinen Sohn nicht in die Welt gesandt, damit er die Welt richte, sondern damit die Welt durch ihn gerettet werde. Wer an ihn glaubt, wird nicht gerichtet; wer aber nicht glaubt, ist schon gerichtet, weil er an den Namen des eingeborenen Gottes nicht geglaubt hat. Das ist aber das Gericht, daß das Licht in die Welt gekommen ist und die Menschen die Finsternis mehr liebten als das Licht; denn ihre Werke sind böse“. Wenn der, welcher sagt: „Ich bin nicht gekommen, die Welt zu richten, sondern sie zu retten“, zugleich der ist, der spricht: „Wer mich sieht, sieht den, der mich gesandt hat“, der aber, der die Welt zu retten und nicht zu richten gekommen ist, der eingeborene Sohn Gottes ist, dann ist es offenbar derselbe Sohn, der auch sagt: „Wer mich sieht, sieht den, der mich gesandt hat“. Denn der, welcher sagt: „Wer an mich glaubt“, und: „Wenn jemand meine Worte hört, richt ich ihn nicht“, ist der Sohn selbst, von dem er folgendes sagt: „Wer an ihn glaubt, wird nicht gerichtet; wer aber nicht glaubt, ist schon gerichtet, weil er an den Namen des eingeborenen Sohnes Gottes nicht geglaubt hat“. Und wieder: „Das ist das Gericht dessen, der nicht an den Sohn glaubt, daß das Licht in die Welt gekommen ist und sie ihm nicht glaubten“, natürlich dem Sohne. Denn Er ist ja doch wohl das Licht, das jeden Menschen erleuchtet, der in die Welt kommt. Und solange er in seiner Menschwerdung auf Erden sich befand, war er das Licht für die Welt, wie er selbst gesagt hat: „Solange ihr das Licht habt, glaubet an das Licht, damit ihr Söhne des Lichtes seid“. „Denn ich bin“, sagt er, „als das Licht in die Welt gekommen“.</p><p>Nach diesen Beweisen also ist offenbar das Wort Sohn. Ist aber der Sohn das Licht, das in diese Welt gekommen ist, dann ist unbestreitbar durch den Sohn die Welt entstanden. Denn im Anfang des Evangeliums sagt der Evangelist über Johannes den Täufer: „Er war nicht das Licht, sondern er sollte Zeugnis geben vom Lichte“. Denn wie wir vorhin gesagt haben, war Christus selbst „das wahre Licht, das jeden Menschen erleuchtet, der in die Welt kommt“. Denn wenn er in der Welt war und die Welt durch ihn entstand, dann muß er das Wort Gottes sein, von dem er auch gesagt hat, durch dasselbe sei alles entstanden. Denn entweder werden sie zwei Welten annehmen müssen, die eine entstanden durch den Sohn, die andere durch das Wort, oder, wenn es nur Eine Welt und eine Schöpfung gibt, so folgt daraus, daß Sohn und Wort vor aller Schöpfung ein und derselbe sind. Denn durch ihn ist sie entstanden. Wenn also wie durch das Wort, so auch durch den Sohn alles entstanden ist, dann wird es keinen Widerspruch geben, vielmehr besagt „Im Anfang war das Wort“ dasselbe wie: Im Anfang war der Sohn. Wenn sie aber deswegen, weil Johannes nicht gesagt hat: Im Anfang war der Sohn, sagen wollen, was dem Worte zukomme, passe nicht auf den Sohn, dann paßt auch das, was dem Sohne zukommt, unmöglich auf das Wort. Es ist aber bewiesen, daß die Worte: „Ich und der Vater sind Eins“ vom Sohne stammen und Er es ist, „der im Schoße des Vaters ist“, und: „Wer mich sieht, sieht den, der mich gesandt hat“, sich auf ihn bezieht. Wenn es also heißt, durch ihn sei die Welt entstanden, so bezieht sich das in gleicher Weise auf das Wort wie auf den Sohn; hieraus erhellt, daß der Sohn vor der Welt ist. Denn notwendig ist der Schöpfer vor den entstehenden Dingen. Auch bezöge sich das Wort an Philippus nach ihrer Ansicht wohl nicht auf das Wort, sondern auf den Sohn. Denn, so heißt es hier, Jesus sprach: „Solange bin ich mit euch und du kennst mich nicht, Philippus? Wer mich gesehen hat, hat den Vater gesehen, und wie sagst du: Zeige uns den Vater? Glaubst du nicht, daß ich im Vater bin und der Vater in mir ist? Die Worte, die ich zu euch rede, rede ich nicht aus mir selbst. Und der Vater, der in mir wohnt, Er tut die Werke. Glaubet mir, daß ich im Vater bin und der Vater in mir ist. Wenn nicht, so glaubet mir doch um der Werke willen. Wahrlich, wahrlich, ich sage euch: Wer an mich glaubt, der wird auch die Werke tun, die ich tue, und er wird noch größere tun als diese; denn ich gehe zum Vater. Und um was ihr immer in meinem Namen bitten werdet, das werde ich tun, damit der Vater in dem Sohne verherrlicht werde“. Wenn also der Vater im Sohne verherrlicht wird, so ist es wohl der Sohn, der spricht: „Ich im Vater und der Vater in mir“, und auch: „Wer mich gesehen, der hat den Vater gesehen“. Denn eben der, der so redet gibt sich als Sohn zu erkennen, wenn er hinzufügt: „Damit der Vater im Sohne verherrlicht werde“.</p><p>Wenn sie nun sagen, der Mensch, den das Wort trug, sei der eingeborene Sohn Gottes und nicht das Wort sei der Sohn, so ist es folglich wohl der Mensch, der im Vater und in dem wieder auch der Vater ist, und der Mensch ist es wohl, der Eins mit dem Vater und im Schoß des Vaters und das wahre Licht ist. Sie werden sich ferner genötigt sehen zu behaupten, auch die Welt sei eben durch den Menschen geworden, und der Mensch sei es, der die Welt nicht zu richten, sondern zu retten gekommen sei, und dieser Mensch existiere, ehe Abraham ward. Denn es heißt: „Jesus sprach zu ihnen: Wahrlich, wahrlich, ich sage euch, ehe Abraham ward, bin ich“. Und ist es nach ihrer Ansicht nicht ungereimt zu behaupten, der, welcher nach zweiundvierzig Geschlechtern aus dem Samen Abrahams entsprossen ist, existiere, ehe Abraham wurde? Und wenn ferner das Fleisch, welches das Wort trug, der Sohn ist, ist es dann nicht ungereimt zu behaupten, das Fleisch und Maria sei es, durch das die Welt entstand? Was aber werden sie dann sagen zu dem Worte: „Er war in der Welt“? Denn um die Existenz des Sohnes vor seiner Geburt im Fleische anzuzeigen, fügt der Evangelist die Worte bei: „Er war in der Welt“. Wie kann er ferner, wenn nicht das Wort Sohn, sondern der Mensch Sohn ist, die Welt retten, da er selbst einer von der Welt ist? Sollten sie sich aber darob nicht schämen, [so mögen sie uns sagen,] wo wird das Wort sein, wenn der Mensch im Vater ist? Wie wird ferner das Wort mit dem Vater zu zählen sein, wenn der Mensch und der Vater Eins sind? Und wenn der Mensch eingeboren ist, welchen Platz wird denn das Wort einnehmen? Denn entweder muß man es als den zweiten bezeichnen, oder es ist, wenn es höher als das Eingeborene steht, wohl selbst der Vater. Denn wie der Vater Einer ist, so ist auch das Eingeborene aus ihm Eines. Was aber hat das Wort dem Menschen voraus, wenn ja nicht das Wort Sohn ist. Denn durch den Sohn und das Wort ist die Welt entstanden, steht geschrieben, und die Erschaffung der Welt ist dem Worte und dem Sohne gemeinsam. Ferner sieht man nach der Schrift den Vater nicht mehr im Worte, sondern [nur] im Sohne und man läßt die Welt nicht mehr durch das Wort, sondern durch den eingeborenen Sohn gerettet werden. Es heißt nämlich: „Jesus sprach: Solange bin ich bei euch und du kennst mich nicht, Philippus? Wer mich gesehen, hat den Vater gesehen“. Und den Vater erkennt nach der Schrift nicht das Wort, sondern der Sohn. Ferner ist nicht vom Worte gesagt, daß es den Vater sehe, sondern vom eingeborenen Sohn, der im Schoße des Vaters ist.</p><p>Wie trägt ferner das Wort zu unserem Heile mehr bei als der Sohn, wenn ja nach ihrer Ansicht ein anderer der Sohn und ein anderer das Wort ist? Denn nicht an das Wort, sondern an den Sohn haben wir zu glauben. Denn Johannes sagt: „Wer an den Sohn glaubt, hat das ewige Leben. Wer aber dem Sohne nicht glaubt, wird das Leben nicht schauen“. Und die hl. Taufe, in der unser ganzer Glaubensbestand wurzelt, wird nicht auf das Wort, sondern auf den Vater, Sohn und Hl. Geist gespendet. Wenn also nach ihrer Ansicht ein anderer das Wort und ein anderer der Sohn und das Wort nicht Sohn ist, dann steht die Taufe in keiner Beziehung zum Worte. Wie existiert also nach ihrer Ansicht das Wort zugleich mit dem Vater, wenn es bei der Spendung der Taufe nicht zugleich mit ihm ist? Doch vielleicht sagen sie: „Im Namen des Vaters ist auch das Wort umschlossen“. Warum also nicht auch der Geist? Oder ist der Geist außerhalb vom Vater? Und wenn das Wort nicht Sohn ist, so wird nach dem Vater der Mensch und nach dem Menschen der Geist genannt; und es wird nach ihrer Ansicht die Einheit auch nicht mehr zu einer Dreiheit erweitert, sondern zu einer Vierheit: Vater, Wort, Sohn und Hl. Geist. Wohl schämen sie sich hierüber und suchen daher einen andern Ausweg, indem sie sagen: Nicht der Mensch an und für sich, den der Herr trug, sondern beides, das Wort und der Mensch zusammen, seien Sohn. Denn beide Teile verbunden, werden, wie sie sagen, Sohn genannt. Welcher Teil ist nun Ursache für den andern, und welcher hat zuerst den andern zum Sohn geschaffen? Oder, um mich klarer auszudrücken, ist das Wort wegen des Fleisches Sohn, oder wird wegen des Wortes das Fleisch Sohn genannt oder keines von beiden, sondern erst die Verbindung beider? Wenn nun das Wort wegen des Fleisches, so muß das Fleisch Sohn sein, und es folgen daraus alle die Ungereimtheiten, die wir bereits aus der Behauptung, der Mensch sei Sohn, abgeleitet haben. Wird aber wegen des Wortes das Fleisch Sohn genannt, so existierte das Wort jedenfalls auch vor dem Fleische und zwar als Sohn. Denn wie könnte jemand andere zu Söhnen machen, wenn er nicht selbst Sohn ist, zumal doch ein Vater besteht? Wenn er nun für sich selbst zu Söhnen macht, so ist er wohl Vater, wenn aber finden Vater, dann muß er Sohn sein oder vielmehr, es muß der Sohn sein, durch den auch die andern zu Söhnen gemacht werden.</p><p>Denn wenn wir Söhne sind, er aber nicht Sohn ist, so ist wohl Gott unser und nicht sein Vater. Wie eignet er aber dann dies sich in besonderer Weise zu, wenn er sagt: „Mein Vater“ und „Ich bin vom Vater“. Denn wenn er gemeinsamer Vater aller ist, dann ist er nicht bloß sein Vater, und nicht bloß Er ist vom Vater ausgegangen. Er sagt aber einmal, daß er auch unser Vater genannt werde, weil er an unserem Fleische teilgenommen habe. Denn deshalb ist das Wort Fleisch geworden, damit er, da das Wort Sohn ist, wegen des in uns wohnenden Sohnes auch unser Vater genannt werde. Denn es heißt: „Er sandte den Geist seines Sohnes in unsere Herzen, der da ruft: Abba, Vater!“ Der Sohn also, der in uns ist, ruft seinen Vater an und macht, daß er auch unser Vater genannt wird. Freilich, in deren Herzen der Sohn nicht ist, deren Vater kann Gott auch nicht genannt werden. Wenn nun der Mensch wegen des Wortes Sohn genannt wird, dann muß das Wort notwendig auch schon vor seiner Ankunft Sohn sein, da schon vor seiner Menschwerdung die Alten Söhne genannt werden. Es heißt ja: „Söhne hab ich erzeugt“, und von der Zeit Noes: „Da die Söhne Gottes sahen“, und im Gesange: „Ist nicht dieser Dein Vater?“ Es existierte also auch der wahrhafte Sohn, dem auch diese ihre Sohnschaft verdanken. Wenn aber nach ihrer Ansicht wieder keines von beidem, sondern erst die Verbindung beider Sohn ist, dann kann keines von beidem Sohn sein, also weder das Wort noch der Mensch, sondern irgendein Grund, aus dem sie sich verbanden; und so wird der Grund, der ja zum Sohne macht, der Verbindung vorangehen. Also existierte auch darnach der Sohn vor dem Fleische. Auf diese Darlegung hin werden sie eine andere Ausflucht suchen und sagen, nicht der Mensch sei Sohn, auch nicht beides, sondern das Wort sei im Anfang einfach Wort, damals aber, als es Mensch wurde, sei es Sohn genannt worden. Denn vor seiner Erscheinung sei es nicht Sohn, sondern nur Wort. Und wie das Wort Fleisch wurde, da es zuvor nicht Fleisch war, so ist das Wort Sohn geworden, da es zuvor nicht Sohn war. Das ist also ihr Geschwätz, das sich aber schlagend widerlegen läßt.</p><p>Denn wenn es überhaupt mit der Menschwerdung Sohn geworden ist, dann ist die Menschwerdung die Ursache. Wenn der Mensch verursacht, daß es Sohn ist oder beides, so werden wir, auf dieselben Ungereimtheiten stoßen. Dann wird er, wenn er zuerst Wort und später Sohn ist, offenbar den Vater erst später gekannt haben und nicht schon früher. Denn er kennt ihn nicht als Wort, sondern als Sohn. Denn: „Niemand kennt den Vater als der Sohn“. Ebenso wird auch das folgen, daß er später im Schoße des Vaters gewesen ist, und Er und der Vater erst später Eins geworden sind, und daß erst später zutrifft: „Wer mich gesehen, hat den Vater gesehen“. Denn das alles ist vom Sohne gesagt worden. Damit werden sie sich genötigt sehen zu behaupten: Das Wort war nichts als ein bloßer Name. Denn es war weder unter uns mit dem Vater, noch sah, wer das Wort gesehen hat, den Vater, noch wurde überhaupt der Vater von jemand erkannt; durch den Sohn wird nämlich der Vater erkannt. So steht ja auch geschrieben: „Und dem der Sohn es offenbart“. Wenn aber das Wort noch nicht Sohn war, so erkannte noch niemand den Vater. Wie konnte er also Moses und den Vätern erscheinen? Denn er sagt selbst in den Büchern der Könige: „Ich habe mich geoffenbart und offenbarte mich allen euren Vätern“. Wenn aber Gott sich offenbarte, so war offenkundig der Offenbarende der Sohn, wie er selbst sagt: „Und dem der Sohn es offenbart“. Es ist also gottlos und unsinnig zu behaupten, ein anderer sei das Wort und ein anderer der Sohn. Man fragt aber mit Recht, woher sie denn diese ihre Anschauung geschöpft haben. Sie sagen nun, weil im Alten Testament nicht vom Sohne die Rede sei, wohl aber vom Worte, und deshalb behaupten sie, den Sohn für jünger zu halten als das Wort, weil nicht im Alten, sondern nur im Neuen Testament von ihm die Rede sei. So reden sie in gottloser Weise. Fürs erste ist nämlich die Trennung der Testamente, so daß also das eine nicht mehr mit dem andern zusammenhängt, das Verfahren der Manichäer und Juden, von denen die einen das Alte, die andern das Neue bekämpfen. Wenn ferner nach ihrer Ansicht der Inhalt des Alten Testamentes der Zeit nach vorausliegt, der des Neuen aber neueren Datums ist und nach den Schriften die Zeiten beurteilt werden, dann müssen die Worte: „Ich und der Vater sind Eins“, und: „Eingeborener“, und: „Wer mich gesehen, hat den Vater gesehen“ wieder jüngeren Ursprungs sein. Denn nicht aus dem Alten, sondern aus dem Neuen Testamente stammen diese Zeugnisse.</p><p>Doch dem ist nicht so. Vielmehr wird im Alten Testament vieles vom Sohne ausgesagt, wie z. B. im 2. Psalm: „Mein Sohn bist Du, heute habe ich Dich gezeugt“, und im 9. die Aufschrift: „Zum Ende für die Geheimnisse des Sohnes, Psalm Davids“, und im 44.: „Zum Ende für die, welche umgewandelt werden, den Söhnen des Koreh zur Unterweisung ein Lobgesang für den Geliebten“. Und bei Isaias: „Ich will dem Geliebten ein Lied singen, von dem Geliebten in meinem Weinberge. Der Geliebte hatte einen Weinberg“. Wer anders ist aber der Geliebte als der eingeborene Sohn? So heißt es auch im 109. Psalm: „Aus dem Mutterleib hab ich Dich vor dem Morgenstern gezeugt“, wovon später die Rede sein wird, und in den Sprichwörtern: „Vor allen Hügeln zeugt er mich“, und bei Daniel: „Und die Gestalt des vierten war dem Sohne Gottes ähnlich“ und anderes mehr. Wenn also im Alten Testament das Altertum enthalten ist, dann ist wohl auch der Sohn alt, der im Alten Testament an vielen Stellen kenntlich gemacht ist. Freilich kommt er darin vor, sagen sie; doch das wollen prophetische Worte sein. Nun könnte man aber sagen: Auch die Stellen über das Wort lauten prophetisch. Denn nicht ist dies dort der Fall, hier aber nicht. Denn wenn die Worte: „Mein Sohn bist Du“ auf die Zukunft gehen, dann offenbar auch die andern: „Durch das Wort des Herrn wurden die Himmel befestigt“. Denn er sagte nicht: „Sie Würden“, oder: „Er machte“. Weil aber das Wort „er befestigte“ von der Zukunft zu verstehen ist, so heißt es: „Der Herr herrschte“ und hierauf: „Denn er befestigte den Erdkreis, der nicht erschüttert werden wird“. Und wenn die Worte im 44. Psalm „für den Geliebten“ sich auf die Zukunft beziehen, dann offenbar auch der Zusatz: „Meinem Herzen entquoll ein gutes Wort“. Und wenn die Worte „aus dem Mutterleibe“ von Menschen gesagt sind, dann auch die andern „aus dem Herzen“. Denn wenn der Mutterleib zum Menschen gehört, so gehört auch das Herz zum Leibe. Wenn aber das, was „aus dem Herzen“ stammt, ewig ist, dann ist auch das ewig, was „aus dem Mutterleibe“ stammt. Und wenn der Eingeborene im Schoße ist, so ist auch der Geliebte im Schoße. Denn das Eingeborene ist soviel wie das Geliebte, wie die Worte zeigen: „Dieser ist mein geliebter Sohn“. Denn nicht um die Liebe zu ihm auszudrücken sagt er: „Geliebter“, damit es nicht den Anschein habe, als hasse er die andern, sondern um anzuzeigen, daß er allein aus ihm stamme. So sagt denn auch das Wort, da es dem Abraham das Eingeborene bezeichnen will: „Opfere deinen geliebten Sohn“. Jedermann aber ist es klar, daß bloß Isaak, der Sohn der Sara, gemeint ist. Es ist also das Wort Sohn, nicht erst Sohn geworden oder genannt, sondern immer Sohn. Denn ist der Sohn nicht, dann ist auch das Wort nicht, und ist das Wort nicht, dann ist auch der Sohn nicht. Denn was aus dem Vater stammt, ist Sohn. Was stammt aber aus dem Vater, wenn nicht das Wort, das aus dem Herzen hervorging und aus dem Mutterleibe gezeugt ward? Denn nicht der Vater ist das Wort, noch das Wort Vater, sondern ersterer ist Vater, letzterer Sohn; ersterer zeugt, letzterer wird gezeugt.</p><p>Es rast also Arius, wenn er sagt, „der Sohn sei aus dem Nichtseienden“, und: „Es war einmal, da er nicht war“. Es rast aber auch Sabellius mit seiner Behauptung, der Vater sei Sohn und umgekehrt, der Sohn Vater, der Wesenheit nach Eins, dem Namen nach zwei. Er rast ferner auch, wenn er die Gnade des Geistes zum Beispiel nimmt. Er sagt nämlich: Wie es „verschiedene Gnadengaben gibt, aber der Geist derselbe ist“, so ist auch der Vater derselbe, erweitert sich aber zum Sohn und Geist. Doch das ist voll Ungereimtheit; denn wenn es sich bei Gott so wie beim Geiste verhält, dann wird der Vater Wort und Hl. Geist sein, indem er dem einen Vater, dem andern Wort, dem dritten Geist wird und sich so dem Bedürfnis eines jeden anbequemt. Dem Namen nach wird er also Sohn und Geist, in Wirklichkeit nur Vater sein, und er kennt einen Anfang, da er Sohn wird, und wo er aufhört, Vater genannt zu werden, und er wurde nur dem Namen nach Mensch, in Wirklichkeit aber kam er nicht einmal auf die Erde. Und er lügt, wenn er sagt: „Ich und der Vater“, da er ja in Wirklichkeit selbst der Vater ist, und was wir sonst noch an Ungereimtheiten bei Sabellius finden. Es wird auch der Name des Sohnes und Geistes aufhören müssen, wenn das Bedürfnis befriedigt ist, und es wird der Vorgang nur mehr eine Spielerei sein, weil er nicht in Wahrheit, sondern bloß dem Namen nach gespielt hat. Wenn aber nach ihrer Ansicht der Name des Sohnes aufhört, wird auch die Gnade der Taufe aufhören, die auf den Sohn gespendet wurde. Und was wird weiter darauf folgen, wenn nicht eine Vernichtung der Schöpfung? Wenn nämlich das Wort hervorgegangen ist, damit wir geschaffen würden und wir seinem Hervorgehen unsere Existenz verdanken, so werden wir offenbar, wenn es, wie sie sagen, zum Vater zurückkehrt, nicht mehr sein. Denn es wird so sein, wie es war, und wir werden so nicht mehr sein, wie wir ja nicht waren. Denn weil es nicht mehr hervorgeht, wird die Schöpfung nicht mehr sein.</p><p>Das ist nun ungereimt. Daß aber der Sohn keinen Anfang des Seins hat, sondern immer auch vor seiner Menschwerdung bei dem Vater ist, zeigt Johannes, wenn er in seinem ersten Briefe also spricht: „Was von Anfang an war, was mir gehört, was wir mit unseren Augen gesehen, was wir geschaut und unsere Hände berührt haben, von dem Worte des Lebens; und das Leben hat sich geoffenbart und wir haben es gesehen und geben Zeugnis davon und verkünden auch das ewige Leben, das beim Vater war und uns sichtbar erschienen ist“. Hier sagt er also, daß das Leben nicht entstanden ist, sondern beim Vater war; am Schluß des Briefes aber sagt er, der Sohn sei das Leben. Er schreibt nämlich: „Wir sind im wahren, in seinem Sohne Jesus Christus. Dieser ist der wahre Gott und das ewige Leben“. Wenn aber der Sohn das Leben ist und dieses beim Vater ist, und wenn der Sohn beim Vater war und wenn derselbe Johannes sagt: „Und das Wort war bei Gott“, so ist wohl der Sohn das Wort, das immer beim Vater ist. Wie aber der Sohn das Wort ist, so ist wohl auch Gott der Vater selbst. Der Sohn ist ja nach Johannes Gott nicht einfachhin, sondern wahrer Gott. Denn eben nach Johannes „war Gott das Wort“ und sagte der Sohn: „Ich bin das Leben“. Es ist also der Sohn das Wort und Leben, das beim Vater ist. Und wenn es wieder bei demselben Johannes heißt: „Der eingeborene Sohn, der im Schoß des Vaters ist“, so beweist das, daß der Sohn immer ist. Den nämlich Johannes Sohn nennt, den besingt David als Hand in den Worten: „Warum ziehst Du Deine Hand zurück und Deine Rechte heraus aus dem Busen?. Ist nun die Hand im Busen und der Sohn im Busen, so ist wohl der Sohn die Hand und die Hand ist wohl der Sohn, durch den der Vater alles gemacht hat. Denn es heißt: “Deine Hand hat das alles gemacht„, und: “Mit seiner Hand hat er das Volk herausgeführt„, also durch den Sohn. Wenn es aber heißt: “Das ist die Veränderung der Rechten des Höchsten„, und wieder: “Zum Ende für die, welche umgewandelt werden sollen, Gesang für den Geliebten, dann ist also der Geliebte die umgewandelte Hand, von dem auch die göttliche Stimme sagt: „Dieser ist mein geliebter Sohn“. „Dieses ist meine Hand“ ist also dasselbe wie: „Dieser ist mein Sohn“.</p><p>Da aber einige Unwissende, die nicht zugeben, daß er Sohn ist, die Worte: „Aus dem Mutterleibe vor der Morgenröte habe ich Dich gezeugt“ gering achten, als ziemte sich dies für Maria nicht, und behaupten, daß er vor dem Morgenstern aus Maria gezeugt sei — denn es schicke sich doch nicht, bei Gott von einem Mutterleib zu reden —, so muß man hierüber einiges wenige sagen. Wenn nun der Mutterleib deshalb, weil er etwas Menschliches ist, mit Gott in keiner Beziehung steht, dann ist offenbar auch „Herz“ die Bezeichnung für etwas Menschliches. Denn wer ein Herz hat, hat folgerichtig auch einen Mutterleib. Da also beides zum Menschen gehört, so muß man entweder beides aufheben, oder man muß den Sinn von beidem erforschen. Denn wie aus dem Herzen das Wort, so kommt die Zeugung aus dem Mutterleib. Und wie wir, wenn wir von einem Herzen Gottes reden, es uns nicht menschlich vorstellen, so darf man auch, wenn die Schrift sagt: „aus dem Mutterleib“, diesen nicht als einen leiblichen sich vorstellen. Denn die göttliche Schrift pflegt in menschlicher Weise vorzubringen und zu bezeichnen, was über den Menschen hinausliegt, Darum sagt er ja, wo er von der Schöpfung redet: „Deine Hände haben mich gemacht und gebildet“, und: „Meine Hand machte das alles“, und: „Er befahl und sie wurden geschaffen“. Passend ist also seine Bezeichnung für das einzelne, wenn er vom Sohne die Eigenheit und Echtheit und von der Schöpfung den Anfang des Seins aussagt. Denn diese macht und schafft er, jenen aber zeugt er aus sich selbst als Wort und Weisheit. Denn Mutterleib und Herz weisen auf die Eigenheit und Echtheit hin. Denn auch wir haben die Echtheit aus dem Mutterleibe, die Werke aber verrichten wir mit der Hand.</p><p>Was wollen nun, fragen sie, die Worte „vor dem Morgenstern“ besagen? Ich möchte ihnen erwidern: Wenn der Ausdruck „vor dem Morgenstern“ seine wunderbare Geburt aus Maria anzeigt, dann sind auch viele andere vor dem Aufgang des Sternes erzeugt worden. Was wäre also damit besonderes gesagt — er erwähnt nämlich dies als eine Ausnahme —, wenn es doch vielen gemeinsam zukommt? Sodann ist ein Unterschied zwischen „zeugen“ und „hervorbringen“. Denn „zeugen“ heißt, den Anfang mit einer Neuschaffung machen, „hervorbringen“ aber heißt nichts anderes als das Bestehende zutage fördern. Wenn also dieses Wort für den Leib paßt, so muß man wissen, daß er nicht damals den Anfang seiner Entstehung genommen hat, als den Hirten bei Nacht die Botschaft verkündigt wurde, sondern damals, als der Engel zur Jungfrau sprach. Aber damals war es nicht Nacht; denn das ist nicht gesagt. Nacht aber war es, als er aus dem Mutterleib hervorging. Diesen Unterschied macht die Schrift. Das eine Mal redet sie von dem Gezeugtwerden vor dem Morgenstern, das andere Mal spricht sie von dem Hervorgehen aus dem Mutterleib wie im 21. Psalm: „Du hast mich aus dem Mutterleib hervorgezogen“. Übrigens hat er nicht gesagt: vor dem Aufgang des Morgensterns, sondern einfach: „vor dem Morgenstern“. Ist also die Stelle auf den Leib zu beziehen, dann muß entweder der Leib vor Adam existieren — denn vor Adam sind die Sterne —, oder man muß den Sinn des Schriftwortes erforschen, worüber man sich bei Johannes Rat holen kann. Denn in der Geheimen Offenbarung sagt er: „Ich bin das Alpha und das Omega und der erste und der letzte und der Anfang und das Ende. Selig, die ihre Kleider erweitern, damit sie Macht erlangen am Holz des Lebens und durch die Tore in die Stadt eingehen. Draußen sind die Hunde und die Zauberer, die Unzüchtigen und Mörder, die Götzendiener und alle, welche die Lüge tun und lieben. Ich Jesus sandte meinen Engel, um euch dieses in den Gemeinden zu bezeugen. Ich bin die Wurzel und das Geschlecht Davids, der helleuchtende Morgenstern. Und der Geist und die Braut sprechen: Komm! Und wer es hört, der spreche: Komm! Und wen dürstet, der komme, und wer will, der nehme Wasser des Lebens umsonst“. Ist also das Geschlecht Davids der helleuchtende Morgenstern, so ist offenbar mit Rücksicht auf das Fleisch des Heilandes vom Morgenstern die Rede. Aber schon vor ihm bestand die Zeugung aus Gott, so daß die Psalmstelle folgenden Sinn hat: Ich habe Dich aus mir erzeugt vor Deiner Erscheinung im Fleische. Denn „vor dem Morgenstern“ heißt soviel als: vor der Geburt des Wortes im Fleische.</p><p>Es sind also auch im Alten Testament Stellen enthalten, in denen offenbar vom Sohne die Rede ist, obschon es überflüssig ist, darüber zu streiten. Denn wenn das, was im Alten Testament nicht vorkommt, neueren Datums ist, dann sollen diese Zanksüchtigen sagen, wo im Alten Testament vom Tröster-Geist die Rede ist. Vom Heiligen Geist wird wohl geredet, vom Tröster nirgends. Ist also der Heilige Geist ein anderer, und der Tröster ein anderer, und ist der Tröster jünger, da er im Alten Testament nicht vorkommt? Doch nein, man nenne nicht den Geist jünger oder teile ihn, und nenne den Heiligen Geist einen andern und den Tröster einen andern. Denn der Geist ist ein und derselbe, der damals die, die ihn aufnahmen, heiligte und auch jetzt heiligt und tröstet, so wie auch ein und dasselbe Wort Sohn ist, der auch damals die Würdigen zur Sohnschaft erhob. Denn es gab auch im Alten Testament Söhne, die nur eben durch den Sohn zu Kindern gemacht wurden. Denn wenn er nicht auch vor Maria Gottessohn war, wie ist er denn vor allen, wenn vor ihm Söhne waren? Wie wäre er ferner Erstgeborener, wenn er als zweiter hinter vielen befunden wird? Doch weder er Tröster ist der zweite — denn er war vor allen —, noch ist der Sohn jünger — denn „im Anfang war das Wort“. Und wie der Geist und der Tröster ein und dasselbe ist, so ist auch ein und dasselbe der Sohn und das Wort. Und wie der Heiland vom Geiste sagt: „Der Tröster, der Hl. Geist, den der Vater in meinem Namen senden wird“, wobei er ihn als ein und denselben bezeichnet und nicht teilt, so sagt Johannes in ähnlicher Weise: „Und das Wort ist Fleisch geworden und es hat unter uns gewohnt, und wir haben seine Herrlichkeit gesehen als des Eingeborenen vom Vater“. Denn auch hier trennte er nicht, vielmehr verkündete er hier die Gleichheit. Und wie nicht ein anderer der Tröster und ein anderer der Hl. Geist, vielmehr sie ein und dasselbe sind, so ist nicht ein anderer Wort und ein anderer Sohn, sondern das Wort ist der Eingeborene. Denn nicht von einer Herrlichkeit des Fleisches, sondern des Wortes sprach er. Wer also Wort und Sohn zu trennen wagt, der soll auch Geist und Tröster trennen. Ist aber der Geist untrennbar, dann ist untrennbar auch das Wort, welches eben Sohn, Weisheit und Kraft ist. Daß aber der Ausdruck „geliebt“ dem Ausdruck „eingeboren“ gleichkommt, das wissen auch die in den Wortbedeutungen kundigen Griechen. Es spricht nämlich Homer über Telemach, den Sohn des Odysseus, der sein Eingeborener war, im zweiten Gesang der Odyssee also aus:</p><p>Wie doch, o trautestes Kind, wie kam ein solcher Gedanke Dir in das Herz? Was willst du hinausgehen weit in die Ferne, Einziger Sohn und geliebter? In weitentlegenem Lande Starb ja der Heimat fern der erhabene Herrscher Odysseus.</p><p>Der also des Vaters „einziger“ ist, heißt „Geliebter“.</p><p>Einige Samosatener trennen das Wort vom Sohne und behaupten, der Sohn sei Christus, das Wort aber sei ein anderer; und ihren angeblichen Grund hiefür entnehmen sie der Apostelgeschichte, indem sie ein richtig lautendes Wort von Petrus verkehrt auffassen. Es ist das folgende Stelle: „Er sandte das Wort den Söhnen Israels und verkündete Friede durch Jesus Christus. Dieser ist aller Herr“. Weil nämlich das Wort durch Christus gesprochen hat, und es auch bei den Propheten heißt: „Dies spricht der Herr“, so sagen sie: „Ein anderer war der Prophet und ein anderer der Herr“. Doch wir können dieser Stelle eine andere ähnliche entgegenhalten, nämlich die Stelle im ersten Brief an die Korinthier: „Indem ihr erwartet die Offenbarung unseres Herrn Jesus Christus, der euch auch bis ans Ende befestigen wird, daß ihr unsträflich seid am Tage unseres Herrn Jesus Christus“. Denn wie nicht ein anderer Christus den Tag eines zweiten Christus befestigt, sondern er selbst an seinem Tage die befestigt, die ihn erwarten, so sandte der Vater das fleischgewordene Wort, damit er Mensch geworden selbst Botschaft brächte. Er fügt also sofort bei: „Dieser ist der Herr aller“. Der Herr aller aber ist das Wort.</p><p>„Und Moses sprach zu Aaron: Tritt hinzu zum Altare und opfere für deine Sünde und bring dein Brandopfer dar und leiste Abbitte für dich und dein Haus und bring die Geschenke des Volkes dar und bete für sie, wie der Herr dem Moses geboten hat“. Sieh also, hier redet Moses selbst, wenn schon es nur Einen Moses gibt, wie von einem zweiten Moses: „Wie der Herr dem Moses befohlen hat“. So darf man also auch, wenn der selige Petrus vom göttlichen Worte spricht, das den Söhnen Israels gesandt wurde, nicht das Wort als einen andern und Christus als einen andern sich denken, sondern als einen und denselben wegen der Vereinigung in seiner göttlichen und menschenfreundlichen Herabkunft und Menschwerdung. Wenn man aber ihn sich auch doppelt denken wollte, dann doch nicht so, als wäre das Wort getrennt, sondern entsprechend den Worten des göttlichen Johannes: „Und das Wort ist Fleisch geworden und hat unter uns gewohnt“. Was also der selige Petrus trefflich und richtig ausgesprochen hat, das verstehen die Samosatener falsch und verkehrt und bleiben nicht bei der Wahrheit. Denn Christus wird in der göttlichen Schrift als beides gedacht, wie wenn sie sagt: „Christus, Gottes Kraft und Gottes Weisheit“. Wenn also Petrus sagt, das Wort sei durch Jesus Christus abgesandt worden zu den Söhnen Israels, so will er dahin verstanden sein, daß das fleischgewordene Wort den Söhnen Israels erschienen sei, so daß seine Worte im Einklang stehen mit den Worten: „Und das Wort ist Fleisch geworden“. Wenn sie aber dies anders verstehen und das Wort wohl als göttlich bekennen, wie das auch wirklich der Fall ist, den Menschen aber, den es angenommen und mit dem es sich, wie wir glauben, vereinigt hat, von ihm trennen und sagen, es sei durch Jesus Christus abgesandt worden, so widersprechen sie sich selbst, ohne es zu merken. Denn während sie es hier von der göttlichen Inkarnation trennen und als göttlich sich denken, verkleinern sie es ja, wenn sie hören, es sei Fleisch geworden und denken heidnisch, wie sie das auch wirklich tun, wenn sie in der göttlichen Inkarnation eine Verwandlung des Wortes wähnen.</p><p>Doch dem ist nicht so. Ferne sei es! Denn wie hier Johannes die unaussprechliche Einigung verkündigt, indem das Sterbliche vom Leben und dem verschlungen wurde, der das Leben selbst ist, wie der Herr zu Martha gesagt hat: “Ich bin das Leben, so zeigt auch der selige Petrus mit den Worten, durch Jesus Christus sei das Wort abgesandt worden, die göttliche Einigung an. Denn wie einer, wenn er hört:”Das Wort ist Fleisch geworden“, wohl nicht auf die Meinung kommt, es sei deshalb nicht mehr Wort, was, wie gesagt, ungereimt wäre, so soll er auch, wenn er hört, daß der mit dem Fleische Verbundene das Wort sei, sich das göttliche Geheimnis als Eines und einfaches vorstellen. Deutlicher aber als jeder Vernunftschluß und mit Ausschluß jedes Zweifels beweist wohl, was zur Gottesgebärerin selbst der Erzengel sprach, die Einheit des göttlichen Wortes und des Menschen. Er sagt nämlich:”Der Hl. Geist wird auf dich herabkommen und die Kraft des Höchsten wird dich überschatten; darum wird auch das Heilige, das geboren wird, Sohn Gottes genannt werden“. In unverständiger Weise trennen also die Samosatener das Wort, von dem doch deutlich bewiesen wurde, daß es mit dem Menschen aus Maria vereinigt sei. Es wurde also nicht durch ihn abgesandt; vielmehr sandte es in ihm mit den Worten:”Gehet hin und lehret alle Völker".</p><p>Die Schrift liebt es aber, sich bündig und einfach auszudrücken. So kann man auch im Buche Numeri finden: “Moses sprach zu Raguel, dem Madianiten, dem Schwiegersohn des Moses. Es war doch nicht ein anderer Moses, der sprach, und ein anderer, dessen Schwiegersohn Raguel war, sondern es war ein einziger Moses. Wenn also das Wort Gottes in gleicher Weise die Namen: Weisheit, Kraft, Rechte, Arm und sonstige dergleichen führt, und in menschenfreundlicher Weise mit uns verbunden ist, indem es unsere Erstlingsfrucht anzog und mit dieser sich vermischte, so hat also das Wort selbst mit Recht auch die übrigen Benennungen erhalten. Denn wenn Johannes gesagt hat, daß im Anfang das Wort war, und dieses bei Gott und selbst Gott war, und daß durch dasselbe alles und ohne dasselbe nichts entstanden sei, so beweist das deutlich, daß auch der Mensch ein Gebilde Gottes des Wortes ist. Wenn er nun diesen, der hinfällig geworden war, in sich aufnimmt und durch seine dauerhafte Erneuerung zu ewigem Bestand wiederherstellt und deshalb sich mit ihm vereinigt und ihn zu einem göttlicheren Los emporhebt, wie kann man da behaupten, das Wort sei durch den aus Maria geborenen Menschen abgesandt worden, und den Herrn der Abgesandten zu den übrigen Abgesandten, also den Propheten, die von ihm abgesandt waren, zählen? Und wie kann auch ein bloßer Mensch Christus genannt werden? Vereint aber mit dem Wort heißt er wohl mit Recht Christus und Sohn Gottes, wie der Prophet vor Zeiten seine väterliche Wesenheit laut verkündete, da er sagte:”Und ich werde meinen Sohn absenden, den Gesalbten“. Und am Jordan ließ sich die Stimme hören:”Dieser ist mein geliebter Sohn". Als er nämlich die Verheißung erfüllt hatte, da gab er mit Recht zu verstehen, daß dieser es sei, den er zu senden versprochen hatte.</p><p>Wir wollen also unter “Christus” beides verstehen: das göttliche Wort mit dem Menschen aus Maria vereint in Maria. Denn in ihrem Mutterleibe bildete sich das Wort sein Haus in der Weise, wie im Anfang den Adam aus der Erde, oder vielmehr in einer erhabeneren Weise. Von ihm sagt auch Salomo, der offenbar weiß, daß das Wort auch Weisheit genannt werde: “Die Weisheit hat sich ein Haus gebaut”. Und auch der Apostel deutet auf dasselbe hin mit den Worten: “Dessen Haus wir sind”, und nennt es anderswo einen Tempel, weil es sich für Gott geziemt, in einem Tempel zu wohnen, von dem er auch ein Bild aus Stein für die Väter durch Salomo herstellen ließ. Deshalb ist das Bild, nachdem die Wahrheit erschienen war, verschwunden. Als nun die Unverständigen das Bild als Wahrheit darstellen, die wahre Wohnung aber, die wir in der Vereinigung wissen und erblicken, zerstören wollten, da drohte er ihnen nicht, sondern, da er ihr vermessenes Vorgehen gegen sich selbst kannte, spricht er zu ihnen: “Zerstöret diesen Tempel und in drei Tagen werde ich ihn wieder aufbauen”, und unser Heiland gibt damit deutlich zu verstehen, daß die Werke der Menschen von selbst zerfallen. Denn “wenn der Herr das Haus nicht baut und die Stadt nicht bewacht, so bemühen sich die Bauleute vergebens und wachen die Wächter umsonst. Es wurden also die Zustände der Juden aufgehoben — denn Schatten waren sie —, die Sache der Kirche aber ist befestigt; denn sie ist auf den Felsen gegründet und die Pforten der Hölle werden sie nicht überwältigen. Aus dem Munde der Juden kamen die Worte:”Wie machst Du, da Du ein Mensch bist, Dich selbst zum Gotte?" Und ihr Jünger ist der Samosatener. Deshalb verkündet er natürlich seine Lehre den Seinigen. Doch wir haben Christus nicht so kennen gelernt, wenn anders wir ihn hörten und von ihm uns belehren ließen, indem wir den alten Menschen ablegten, der durch des Irrtums Lüste verderbt ist, und den neuen anzogen, der nach Gott geschaffen ist in Gerechtigkeit und Heiligkeit der Wahrheit. Man stelle sich also Christus in gottesfürchtiger Weise als beides vor.</p><p>Wenn aber die Schrift vielfach auch den Leib Christus [den Gesalbten] nennt, wie wenn der selige Petrus zu Kornelius spricht und ihn belehrt über “Jesus von Nazareth, den Gott mit dem Hl. Geiste salbte”, und wieder zu den Juden von “Jesus, dem Nazarener, einem Mann, von dem Gott auch Zeugnis gab”, redete, und wieder der selige Paulus zu den Athenern: “Durch einen Mann, den er dazu bestimmte und dem er bei allen Glauben verschaffte, indem er ihn von den Toten auferweckte”, so finden wir vielfach, daß die Darstellung und Sendung dasselbe ist wie die Salbung. Hieraus kann jeder, wenn er nur will, ersehen, daß in den Aussprüchen der Heiligen kein Widerspruch obwaltet, sondern daß sie nur in verschiedener Weise die Einigung Gottes des Wortes mit dem Menschen aus Maria benennen, und sie also bald als Salbung, bald als Sendung und ein andermal als Darstellung bezeichnen. Das Wort des seligen Petrus ist also richtig und verkündet deutlich die Gottheit des Eingeborenen, ohne die Wesenheit Gottes des Wortes von dem Menschen aus Maria zu scheiden. Das sei ferne! Denn wie könnte er es, der oft vernahm: “Ich und der Vater sind Eins”, und: “Wer mich gesehen, hat den Vater gesehen”, und denselben auch nach der Auferstehung sah, als er bei verschlossenen Türen inmitten des ganzen Apostelkreises erschien und, wenn irgendein Zweifel daran laut wurde, ihn löste mit den Worten: “Rühret mich an und sehet! Denn ein Geist hat nicht Fleisch und Bein, wie ihr sehet, daß ich es habe”? Er sagte nicht “diesen” oder “meinen Menschen, den ich angenommen habe”, sondern “mich”. Daher kann der Samosatener keine Nachsicht finden, da er so vielfach die Einigung Gottes des Wortes bewiesen und sich widerlegt sieht, und zwar auch von Gott dem Worte selbst, der, wie wir eben gesehen, mit allen ein Gespräch anknüpft und sie vergewissert, indem er ißt und sich berühren läßt, was ja auch wirklich geschehen ist. Denn gewiß hat der, der ihm die Speise darbot, bzw. haben die, welche sie ihm darreichten, seine Hände berührt. Es heißt nämlich: “Sie legten ihm ein Stück von einem gebratenen Fisch und einen Honigkuchen vor, und als er vor ihren Augen gegessen hatte, nahm er die Überreste und gab sie ihnen zurück. Sieh also, er verschaffte ihnen, wenn auch nicht so wie bei Thomas, so doch auf eine andere Weise Gewißheit, indem er sich berühren ließ. Wolltest du aber auch die Wundmale sehen, so lerne von Thomas. Es heißt nämlich:”Reiche deine Hand her und lege sie in meine Seite, und lege deinen Finger herein und sieh meine Hände!" Seine eigene Seite und seine Hände nennt Gott das Wort und gibt sich als Ganzes, als Mensch und Gott zugleich, zu erkennen, da eben hier das Wort, wie man ersehen kann, den Heiligen auch die sinnliche Empfindung im Leibe darbot, indem es bei verschlossenen Türen eindrang und plötzlich mit seinem Leibe zugegen war und ihnen die Gewißheit verschaffte. Das sei den Gläubigen zur Befestigung und den Ungläubigen zur Besserung in passender Weise gesagt.</p><p>Es möge also Paul von Samosata sich eines Bessern besinnen und auf die göttliche Stimme dessen horchen, der sagt: „Mein Leib“ und nicht: „ein zweiter Christus außer mir, dem Worte“, sondern „er mit mir und ich mit ihm“. Denn die Salbe bin ich, das Wort, und was von mir gesalbt wurde, ist der Mensch. Ohne mich würde er also nicht Christus heißen, wohl aber, da er mit mir ist und ich in ihm. Wenn also von einer Sendung des Wortes die Rede ist, so zeigt dies seine Einigung mit dem Jesus aus Maria, der Heiland bedeutet, an, und zwar aus keinem andern Grunde als wegen der Vereinigung mit Gott dem Worte. Diese Stelle besagt also dasselbe wie die andere: „Der Vater, der mich gesandt hat“, und: „Ich bin nicht von mir selbst gekommen, sondern der Vater hat mich gesandt“. Die Einigung mit dem Menschen nämlich, in dem die unsichtbare Natur durch die sichtbare den Menschen erkennbar gemacht werden konnte, nannte er Sendung. Nicht ändert ja Gott seinen Aufenthalt so wie wir, die wir an bestimmten Orten verborgen sind, wenn er unsere niedrige Gestalt annimmt und in seiner Existenz im Fleische sich kundgibt. Denn wie wäre das möglich bei ihm, der Himmel und Erde erfüllt? Vielmehr wählten die Gerechten für seine Erscheinung im Fleische den Ausdruck Sendung. Dann ist er also auch selbst Gott das Wort. Christus ist also der Gottmensch aus Maria. Es gibt keinen zweiten Christus, sondern nur einen und denselben. Er ist vor den Zeiten aus dem Vater und Er in den letzten Zeiten aus der Jungfrau, zuvor unsichtbar selbst den heiligen Mächten im Himmel, jetzt sichtbar wegen seiner Einigung mit dem sichtbaren Menschen, sichtbar, sage ich, nicht in der unsichtbaren Gottheit, sondern in der Tätigkeit der Gottheit im menschlichen Leibe und im ganzen Menschen, den er zu eigen nahm und dadurch wieder erneuerte. Ihm sei die Ehre und die Anbetung, der zuvor war und jetzt und immer ist und in alle Ewigkeit! Amen.</p>
