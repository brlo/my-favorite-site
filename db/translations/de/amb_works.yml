      <p><em>Exameron, übersetzt von Joh. Ev. Niederhuber (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>So großem Wahne denn konnten Menschen verfallen, daß einige von ihnen drei Prinzipien alles Seienden aufstellten: Gott, die Idee und die Materie! So Plato und seine Schule. Dieselben seien, versichern sie, unvergänglich, ungeschaffen und anfangslos. Und Gott habe nicht als Schöpfer der Materie, sondern nur als Bildner, dem ein Bild, d. i. die Idee vorschwebte, die Welt aus der Materie, Hyle genannt, gemacht. Diese habe, behaupten sie, für alle Dinge die Entstehungsursache abgegeben. Sogar auch die Welt halten sie für unvergänglich und nicht für geschaffen oder gemacht. Wieder andere ― Aristoteles und seine Schule glaubten diese Anschauung vertreten zu sollen ― nahmen zwei Prinzipien an, Materie und Form, und in Verbindung damit ein drittes, das „wirkende“ genannt, hinlänglich genug das zu verwirklichen, was nach seinem Ermessen ins Werk zu setzen sei.</p><p>Was wäre nun so ungereimt als ihre (der Philosophen) Verquickung der Ewigkeit der Schöpfung mit der Ewigkeit des allmächtigen Gottes, oder ihre Identifizierung der Schöpfung mit Gott, so daß sie dem Himmel und der Erde und dem Meere göttliche Ehre erwiesen? Die Folge war, daß sie in den Teilen der Welt Gottheiten erblickten, wiewohl über die Welt selbst nicht geringe Meinungsverschiedenheit unter ihnen besteht.</p><p>[Forts. v. ] Pythagoras nimmt nur <em>eine</em> Welt an. Andere behaupten das Dasein zahlloser Welten, wie Demokrit in seinen Schriften, dem das Altertum die größte Autorität in der Naturwissenschaft zuerkannte. Aristoteles eignet sich den Satz an: Die Welt war und wird immerfort sein. Dem stellt Plato die Behauptung entgegen: Sie hat nicht immer bestanden, wird aber immer fortbestehen. Gar viele Autoren aber treten in ihren Schriften für die Anschauung ein: Sie hat nicht immer bestanden und wird nicht immer bestehen.</p><p>[Forts. v. ] Wie ließe sich bei diesen widersprechenden Ansichten der wahre Sachverhalt ermitteln? Geben doch die einen die Welt selbst, insofern ihr nach ihrem Dafürhalten anscheinend göttlicher Geist innewohne, für Gott aus, andere die Bestandteile derselben, wieder andere beides zugleich. Da läßt sich doch unmöglich eine Vorstellung gewinnen von der Gestalt der Götter, von deren Zahl, von deren Wohnsitz oder Leben und Treiben. Nach der Welt zu urteilen müßte man sich ja die Gottheit füglich rotierend, rund, lohend, in gewisse Bewegungen versetzt, bewußtlos und fremder Bewegung, nicht der eigenen folgend denken.</p><p>Folgenden Satz stellte der heilige Moses, da er im göttlichen Geiste voraussah, daß solche menschliche Irrtümer hervortreten würden und vielleicht schon hervorzutreten anfingen, an die Spitze seines Berichtes: <em>„Im Anfang hat Gott den Himmel und die Erde geschaffen“</em>. Er spricht damit den Anfang der Dinge, den Urheber der Welt und die Erschaffung der Materie zugleich aus. Man sollte daraus ersehen: Gott war vor dem Anfange der Welt da, bezw. <em>er</em> gerade ist der Anfang des Alls gemäß der Antwort, die der Gottessohn im Evangelium auf die Frage: „wer bist du?“ gegeben hat: „Der Anfang, der ich auch zu euch rede“; und <em>er</em> gerade hat den Dingen den Anfang ihres Entstehens gegeben und <em>er</em> ist der Schöpfer der Welt, nicht aber gleichsam nur an der Hand einer Idee der Nachformer der Materie, aus der er nicht nach seinem freien Ermessen, sondern nach gegebenem Muster seine Werke gestaltete. Zutreffend gebrauchte er desgleichen die Wendung: „Im Anfang <em>hat er geschaffen</em>“. Er wollte damit, daß er in seiner Darstellung gleich das Ergebnis der vollendeten Schöpfung der folgenden Aufzeigung der anfangenden voranstellte, die unbegreifliche Schnelligkeit der Schöpfung zum Ausdruck bringen.</p><p><em>Wer</em> es spricht, müssen wir beachten. Doch Moses, der in jeglicher Weisheit der Ägypter wohlbewanderte, den die Tochter des Pharao aus dem Flusse heben ließ und wie ihr Kind lieb gewann und auf königliche Kosten in allen Lehren der Weltweisheit unterweisen und ausbilden zu lassen wünschte. Obschon nach dem Wasser benannt, glaubte er dennoch nicht behaupten zu dürfen, daß alles aus Wasser bestehe, wie Thales behauptet. Und obschon am Königshofe erzogen, wollte er aus Liebe zur Gerechtigkeit eher das Brot freiwilliger Verbannung essen, denn als hoher Würdenträger der Zwingherrschaft in weichlicher Genußsucht in den Dienst der Sünde treten. Bevor er noch zur Aufgabe berufen wurde, sein Volk zu befreien, setzte er sich dadurch, daß er im Übereifer seines natürlichen Rechtlichkeitssinnes einen ungerecht behandelten Volksgenossen rächte, der Ungnade aus, riß sich vom Genußleben los, floh das ganze unruhige Treiben am Königshofe, suchte die Einsamkeit Äthiopiens auf und versenkte dort seinen Geist, fern allen sonstigen Beschäftigungen, ganz in die Erkenntnis des Göttlichen, so daß er die Herrlichkeit Gottes von Angesicht zu Angesicht schaute. Ihm gibt die Schrift das Zeugnis, daß „kein Prophet fürder aufstand in Israel gleich Moses, welcher den Herrn kannte von Angesicht zu Angesicht“. Nicht im Gesicht und nicht im Traum, sondern von Mund zu Mund durfte er mit Gott dem Allerhöchsten sprechen und ward der Gnade gewürdigt, Gottes Gegenwart nicht nur im Bilde oder im Rätsel, sondern in Klarheit und Wahrheit zu schauen.</p><p>Er (Moses) nun öffnete seinen Mund und goß aus die Worte, welche der Herr zu ihm redete gemäß der Verheißung, die er ihm gegeben hatte, da er ihn zu König Pharao sendete: „Zieh hin! Und ich werde deinen Mund öffnen und dich lehren, was du sprechen sollst“. In der Tat, wenn er schon die Worte, die er zur Entlassung seines Volkes vorbringen sollte, von Gott empfangen hatte, wieviel mehr jene, die er über den Himmel aussprechen sollte! „Nicht in Überredung menschlicher Weisheit“, nicht in philosophischen Trugschlüssen, „sondern in Erweisung von Geist und Kraft“, gleichsam als Zeuge der göttlichen Schöpfung, wagte er denn zu sprechen: „Im Anfange hat Gott den Himmel und die Erde geschaffen“. <em>Er</em> wartete nicht erst den langwierigen und vergeblichen Prozeß ab, wonach die Welt aus Atomverbindungen sich zusammenfügte, und (wartete) nicht sozusagen auf einen Schüler der Materie, der letztere erst studieren mußte, um die Welt formen zu können, sondern glaubte gleich Gott als ihren Urheber aussprechen zu sollen. Ein Mann voll Weisheit, merkte er wohl, daß allein in Gottes Geist Wesen und Grund der sichtbaren und unsichtbaren Dinge beruhten, und nicht, wie die Philosophen lehren, eine nachhaltige Verbindung der Atome ihre stetige Fortdauer bedinge. Ihm dünkte es, als spännen sie nur ein Spinngewebe, sie, die so kleinliche und wesenlose Prinzipien für Himmel und Erde ansetzten. Müßten doch diese, wie zufällig verbunden, so auch zufällig und aufs Geratewohl sich auflösen, hätten sie nicht in der göttlichen Macht ihres Lenkers den festen Bestand. Kein Wunder übrigens, wenn die, welche Gott nicht kennen, auch vom Lenker (der Welt), der alles leitet und regiert, nichts wissen. So folgen wir also dem, der sowohl den Schöpfer als auch den Lenker kannte, und lassen wir uns nicht von eitlen Meinungen irreführen!</p><p>„Im Anfang“ so beginnt (Moses). Eine treffliche Anordnung! Erst betont er, was man zu leugnen pflegt; (erst) sollte der Mensch erkennen, daß die Welt einen Anfang hatte, damit er die Welt nicht für anfangslos halte. Darum hebt auch David, da er vom Himmel und der Erde und dem Meere redete, hervor: „Alles hast du mit Weisheit gemacht“. Er (Moses) sprach sonach der Welt einen Anfang, sprach desgleichen der Schöpfung Unzulänglichkeit zu, daß wir sie nicht für <em>ἄναρχος</em> [anarchos] (anfangslos), nicht für ungeschaffen und göttlicher Wesenheit teilhaftig hielten. Und dazu das treffliche „hat geschaffen“, womit der Annahme eines zeitlichen Verlaufes des Schöpfungsaktes vorgebeugt werden sollte. So doch wenigstens sollten die Menschen einsehen, wie unvergleichlich der Schöpfer ist, der ein so gewaltiges Werk in einem so winzig kurzen Augenblick seines Wirkens vollführte, daß die Ausführung seiner Willenstat jedem merklichen Zeitverlauf vorausging. Niemand sah ihn schaffen, er sah vielmehr nur das geschaffene Werk vor sich. Wo könnte auch von einer Zeitfrist die Rede sein, wenn man liest: „Er sprach und es ward, er befahl und es war erschaffen“? Nicht also eines Kunst-, nicht eines Kraftaufwandes bedurfte es für den, der im Nu mit seinem Willensakte die majestätische Pracht eines so gewaltigen Werkes vollendete, so daß er das Nichtseiende plötzlich so ins Dasein setzte, daß weder die Schöpfung dem Willensakte noch der Willensakt der Schöpfung vorausging.</p><p>Du staunst über das Werk, fragst nach dem Meister: wer dem so gewaltigen Werke den Anfang gegeben, wer es so plötzlich ins Dasein gerufen? Da fügte er (Moses) auch schon die Antwort bei: „<em>Gott</em> hat den Himmel und die Erde geschaffen“. Du hast den Schöpfer vernommen, darfst nicht zweifeln. Dieser ist’s, in welchem Melchisedech den Abraham, den Stammvater der vielen Völker, gesegnet hat mit den Worten: „Gesegnet sei Abraham von Gott dem Höchsten, der geschaffen hat den Himmel und die Erde!“ Und es glaubte Abraham und sprach: „Ich hebe meine Hand auf zu Gott dem Höchsten, der geschaffen hat den Himmel und die Erde“. Du siehst, das ist nicht eines Menschen Einfall, sondern Gottes Botschaft. Gott nämlich ist der Melchisedech; denn er ist „der König des Friedens und der Gerechtigkeit“, „ohne Anfang und Ende seiner Tage“. Kein Wunder also, wenn Gott, der Anfangslose, allen Dingen den Anfang gegeben hat, so daß sie, die Nichtseienden zu sein anfingen. Kein Wunder, wenn Gott, der alles mit seiner Macht umfängt und alles mit unbegreiflicher Hoheit in sich begreift, die sichtbare Welt geschaffen hat, nachdem er auch die unsichtbare Welt geschaffen hat. Wer möchte aber leugnen, daß dem Unsichtbaren der Vorzug vor dem Sichtbaren gebührt? Ist doch „das Sichtbare zeitlich, ewig hingegen das Unsichtbare“. Wer möchte zweifeln, daß Gott dies geschaffen hat, der durch den Mund des Propheten gesprochen: „Wer maß mit der Hand das Wasser und mit der Spanne den Himmel und mit der geschlossenen Hand die ganze Erde? Wer wog die Berge nach dem Gewicht und die Felsmassen nach der Wage und das Gelände nach dem Joch? Wer nahm Einsicht in den Geist des Herrn, oder wer war ihm Berater, oder wer unterwies ihn?“ Auch an einer anderen Stelle lesen wir von ihm: „Er hält den Umkreis der Erde und hat die Erde wie ein Nichts geschaffen“. Und Jeremias ruft aus: „Die Götter, welche den Himmel und die Erde nicht geschaffen haben, sollen verschwinden von der Erde und unter dem Himmel dort! Der Herr ist’s, der geschaffen die Erde in seiner Macht und geordnet den Erdkreis in seiner Weisheit und in eigener Einsicht ausgespannt den Himmel und die Menge des Wassers am Himmel“. Und er fügte bei: „Betört ward der Mensch von seinem Wissen“. Wie sollte denn einer, der den vergänglichen Dingen der Welt folgt und aus diesen die Wahrheit über Gottes Natur erfahren zu können glaubt, nicht durch die Kniffigkeit der gewandten Sophistik betört werden?</p><p>So viele Aussprüche also vernimmst du, worin Gott bezeugt, daß er die Welt geschaffen hat: halte sie nicht für anfangslos, weil sie kugelförmig sein soll, so daß anscheinend jeder Anfang an ihr fehlt; und weil alles, wenn sie erdröhnt, rings im Unkreis erbebt, so daß sich Anfang und Ende an ihr unmöglich wahrnehmen läßt; den Anfang eines Kreises sinnenfällig zu bestimmen, gilt ja als ein Ding der Unmöglichkeit. Auch an einer Kugel läßt sich der Anfangspunkt nicht ausfindig machen: wo etwa die Mondscheibe anfängt, wo sie nach der monatlichen Abnahme des Mondes aufhört. Doch wenn du’s auch selbst nicht merkst, folgt daraus nicht, daß sie überhaupt keinen Anfang und keinerlei Ende hat. Wenn du eigenhändig einen Kreis mit Tinte oder Stift ziehst oder mit dem Zirkel beschreibst, wirst du’s nach einiger Zeit unmöglich mehr mit den Augen merken oder dich geistig erinnern, wo du angefangen und wo du aufgehört hast. Und trotzdem bist du dein eigener Zeuge, daß du angefangen und aufgehört hast. Denn wenn es auch dem Auge entgeht, die Wahrheit stößt’s nicht um. Was aber einen Anfang hat, hat auch ein Ende, und was ein Ende nimmt, hat auch, das steht fest, einen Anfang genommen. Daß aber die Welt ein Ende nehmen wird, lehrt der Heiland selbst in seinem Evangelium mit den Worten: „Denn die Gestalt dieser Welt vergeht“; ferner: „Himmel und Erde werden vergehen“; und im folgenden: „Siehe, ich bin bei euch bis an das Ende der Welt“.</p><p>[Forts. v. ] Wie können sie also die Welt für gleichewig mit Gott erklären, die Schöpfung mit dem Schöpfer des Alls auf dieselbe Stufe stellen und für gleichartig mit ihm ausgeben sowie die materielle Körperwelt mit der unsichtbaren und unnahbaren göttlichen Natur vermengen zu dürfen glauben, nachdem sie doch ihrer eigenen Anschauung gemäß nicht in Abrede stellen können, daß ein Ding, dessen Teile der Vergänglichkeit und Veränderlichkeit unterliegen, notwendig auch als Ganzes den nämlichen Einflüssen wie seine Teile ausgesetzt und unterworfen ist?</p><p><strong>Der Schöpfungsanfang ein Schöpfungsfrühling, die Osterzeit. Christus, der mystische Anfang. Anfang gleichbedeutend mit Inbegriff.</strong></p><p>Daß es nun einen (Welt-) Anfang gibt, lehrt der, welcher spricht: „<em>Im Anfang</em> hat Gott Himmel und Erde geschaffen“. „Anfang“ kann entweder auf die Zeit oder auf die Zahl oder auf das Fundament bezogen werden, wie bei einem Hausbau das Fundament den Anfang bildet. Daß man auch von dem Anfang einer Bekehrung, einer Entartung reden kann, wissen wir auf Grund der Schrift. Desgleichen hat die Kunst ihren Anfang gerade im Können, von dem in der Folgezeit das Schaffen der verschiedenen Künstler seinen Ausgang nahm. Es haben ebenso die guten Werke ihren Anfang, (nämlich) den guten Endzweck. So besteht der Anfang der Barmherzigkeit darin, es möchte dein Tun Gott gefallen: der stärkste Beweggrund zur Hifeleistung an die Menschen. Es gibt übrigens auch eine Eigenschaft Gottes, die man so bezeichnet. ― Eine Zeitbeziehung liegt vor, wenn man ausdrücken wollte, in welchem Zeitpunkte Gott den Himmel und die Erde geschaffen hat, d. i. im Augenblicke der Weltentstehung, als sie zu werden anfing. So spricht die Weisheit: „Als er bereitete den Himmel, war ich mit ihm“. ― Falls wir aber die Beziehung auf die Zahl machen wollten, würde man’s am besten so verstehen: Zuerst hat er den Himmel und die Erde geschaffen, sodann die Anhöhen, das Gelände, die bewohnbaren Gegenden; oder so: Vor allen anderen sichtbaren Geschöpfen, vor dem Tage, der Nacht, den Fruchtbäumen, den verschiedenen Tierarten, hat er den Himmel und die Erde geschaffen. ― Macht man aber die Beziehung auf das Fundament, so beruht, wie du gelesen, der Erde Anfang in einer Grundfeste; denn so spricht die Weisheit: „Als er schuf die starken Grundfesten der Erde, war ich ordnend bei ihm“. ― Auch eine tüchtige Schulung hat ihren Anfang. Darauf bezieht sich das bekannte Wort: „Der Weisheit Anfang ist die Furcht des Herrn“. Wer nämlich den Herrn fürchtet, meidet die Sünde und lenkt seine Wege nach der Tugend Pfad; wer Gott nicht fürchtet, vermag ja der Sünde nicht zu entsagen.</p><p>Wir könnten dies ebenso auch von der folgenden Stelle annehmen: „Dieser Monat (Nisan) soll euch der Anfang der Monate sein“. Sie muß freilich auch zeitlich verstanden werden, weil eben vom Pascha des Herrn die Rede war, dessen Feier in den Frühlingsanfang fällt. An diesem „Anfang der Monate“ nun hat Gott den Himmel und die Erde geschaffen; denn die Entstehung der Welt sollte zu der Zeit statthaben, da allen Dingen warmer günstiger Frühlingshauch wehte. So spiegelt denn das Jahr das Bild der werdenden Welt wider: Auf Winterfrost und Winternacht erstrahlt freundlicher denn sonst des Frühlings Pracht. Ein Bild der künftigen Jahresläufte also bot das erste Entstehen der Welt: Demselben Gesetze folgend ziehen im Wechsel die Jahreszeiten herauf und sproßt zu Beginn jedes Jahres die Erde neue keimende Saat hervor, seitdem zum ersten Mal Gott der Herr gesprochen hatte: „Es sprosse die Erde das Grün des Grases, Samen treibend nach seiner Art und nach seiner Beschaffenheit, und fruchttragende Fruchtbäume. Und sogleich brachte die Erde das Grün des Grases hervor und die Fruchtbäume“. Sowohl die göttliche Vorsehung, die ewig lenkende, als auch die rasch sprossende Erde sprechen für unsere Deutung auf die Frühlingszeit. Denn wenn es auch zu jedweder Zeit Gott zugestanden hätte, zu gebieten, der Erdennatur, zu gehorchen, so daß sie auch bei Wintereis und Winterfrost unter dem belebenden Hauche des himmlischen Gebotes geknospet und Frucht getrieben haben würde, so lag es doch nicht im ewigen Ratschlusse, vor eisiger Kälte starrende Flächen mit einem Mal zu grünen Fruchtgefilden auftauen zu lassen und in rauhen Frost zarte Blüten zu streuen. Um also die Frühlingszeit bei der Erschaffung der Welt anzuzeigen, spricht die Schrift: „Dieser Monat ist euch der Anfang der Monate, der erste ist er euch unter den Monaten des Jahres“, mit dem „ersten Monat“ die Frühlingszeit bezeichnend. Denn füglich sollte der Schöpfung Anfang mit dem Jahresanfang zusammenfallen und die Schöpfung selbst durch linder Lüfte Wehen befruchtet werden. Sonst wären nämlich der Dinge zarte Anfänge nicht imstande gewesen, sei es den Druck allzu rauher Kälte zu ertragen, sei es die Unbill versengender Hitze zu überstehen.</p><p>Zugleich mag man, weil es mit Recht hierher gehört, beachten, daß der gnadenvolle Eintritt in diese Schöpfung und in diese Lebenssphäre sichtlich zu der Zeit erfolgen sollte, da auch der ordnungsmäßige Übergang von dieser Welt (generatio) in die Welt der Wiedergeburt (regeneratio) statthat. Hielten doch auch die Kinder Israels zur Frühlingszeit den Auszug aus Ägypten und den Durchzug durch das Meer, „getauft in der Wolke und im Meere“, wie der Apostel sich ausdrückte. Und zu dieser Jahreszeit wird auch das Pascha des Herrn Jesus Christus gefeiert, d. i. der Übergang der Seelen vom Sündenleben zur Tugend, von den Leidenschaften des Fleisches zur Gnade und zur Enthaltsamkeit des Geistes, vom „Sauerteig der Bosheit und Verderbtheit“ zur „Wahrheit und Lauterkeit“. Auf die Wiedergeborenen geht sonach das Wort: „Dieser Monat ist euch der Anfang der Monate, der erste ist er euch unter den Monaten des Jahres“. Es verläßt und flieht nämlich der Täufling den Pharao im geistigen Sinn, den Fürsten dieser Welt, indem er spricht: „Ich widersage dir, Teufel, und deinen Werken und deiner Herrschaft“. Und er wird ihm nicht mehr frönen, noch den irdischen Leidenschaften dieses Leibes, noch den Verirrungen des verderbten Geistes, vielmehr versenkt er alle Bosheit wie mit Bleigewicht in die Tiefe, wappnet sich zur Rechten und zur Linken mit guten Werken: so bemüht er sich, ungehemmten Schrittes durch das Meer dieser Welt hindurchzuschreiten. Auch die Schrift spricht im Buche Numeri: „Der Erstling der Völker ist Amalek, und seine Nachkommenschaft wird untergehen“. Gewiß ist Amalek nicht an sich das erste unter allen Völkern, wohl aber, insofern man Amalek verdolmetscht für „König der Gottlosen“ nimmt. Die Gottlosen aber sind die Heiden. Sieh also, ob wir nicht den Fürsten dieser Welt darunter zu verstehen haben, der über die Heidenvölker herrscht, die ihm zu Willen sind. „Seine Nachkommenschaft wird untergehen“. Seine Nachkommenschaft aber sind die Gottlosen und Ungläubigen, denen des Herrn Wort gilt: „Ihr habt den Teufel zum Vater“.</p><p>[Forts. v. ] Es gibt auch einen mystischen Anfang, so wenn es heißt: „Ich bin der Erste und der Letzte, der Anfang und das Ende“, und insbesondere, wenn der Herr im Evangelium auf die Frage, wer er sei, erwiderte: „Der Anfang, der ich auch zu euch rede“. Er ist in Wahrheit seiner Gottheit nach der Anfang von allem, weil niemand vor ihm ist, und das Ende, weil niemand nach ihm ist. Nach dem Evangelium ist er der Anfang der Wege des Herrn zur Vollbringung seiner Werke: durch ihn soll das Menschengeschlecht die Wege des Herrn gehen und die Werke Gottes vollführen lernen. In diesem Anfang also, d. h. in Christus, hat Gott den Himmel und die Erde geschaffen; denn „durch ihn ist alles geworden und ohne ihn ist nichts geschaffen, was geschaffen ist“; aber auch in ihm, weil „alles in ihm besteht“. Und er ist „der Erstgeborene der ganzen Schöpfung“, sei es weil er vor aller Schöpfung ist, sei es weil er der Heilige ist; denn die Erstgeborenen sind heilig, so Israel, „der Erstgeborene“, nicht weil es vor allen (Völkern) war, sondern weil es vor allen übrigen heilig war. Der Herr aber ist heilig vor jedem Geschöpfe, auch der Menschheit nach, die er angenommen hat; denn er allein ist sündelos, er allein unvergänglich, „die ganze Schöpfung aber der Vergänglichkeit unterworfen“.</p><p>Wir können’s auch so verstehen: „Im Anfange hat Gott den Himmel und die Erde geschaffen“, d. i. vor der Zeit. So ist der Anfang eines Weges noch nicht der Weg, und der Anfang eines Hauses noch nicht das Haus. So haben denn auch andere die Lesart * ἐν κεφαλαίῳ* [en kephalaio], gleichsam „im Haupte“, wodurch angedeutet wird, daß der Hauptinhalt der Schöpfung in einem kurzen, winzigen Augenblick vollendet war. Es gibt sonach auch Autoren, welche das Wort Anfang nicht zeitlich, sondern vorzeitlich, und * κεφάλαιον* [kephalaion] oder caput, wie wir lateinisch sagen, als den Inbegriff des Schöpfungswerkes fassen. Himmel und Erde sind ja der Inbegriff der sichtbaren Dinge. Diese aber scheinen nicht allein die Ausschmückung dieser Welt, sondern auch die Versinnbildung der unsichtbaren Dinge und sozusagen „die Beglaubigung jener Dinge, die nicht in die Sichtbarkeit treten“, zu bezwecken. So lautet auch des Propheten Wort: „Die Himmel erzählen die Herrlichkeit Gottes und die Werke seiner Hände verkündet das Firmament“. Und daran anknüpfend spricht der Apostel mit anderen Worten den gleichen Gedanken aus, wenn er versichert: „Was an ihm unsichtbar ist, wird durch die geschaffenen Dinge erkennbar“. Als den Schöpfer der Engel und Herrschaften und Gewalten nämlich erkennen wir leicht denjenigen, der im Nu mit seinem gebieterischen Worte diese so wunderbare Schönheit der Welt, die nicht da war, aus dem Nichts ins Dasein rief, und die Dinge oder Ursachen, die nicht existierten, in den Besitz ihrer Wesenheit setzte.</p><p>Es ist diese Welt ein Spiegelbild des göttlichen Schaffens: das Schauen des Werkes führt zum Lobe des Meisters. Es verhält sich da ähnlich wie mit den Künsten. Diese sind teils praktischer Art, beruhend in Körperbewegung oder im Ton der Stimme ― die Bewegung oder der Ton geht vorüber, und nichts bleibt den Zuschauern oder Zuhörern hiervon übrig und zurück ―; teils theoretischer Art, die ihre Anforderungen an die geistige Kraft stellen; teils derart, daß das Werk als solches, wenn auch der Akt des Wirkens vorübergeht, noch wahrnehmbar bleibt, wie ein Bau, ein Gewebe. Schweigt auch der Künstler, geben diese doch Kunde von seinem Können, so daß das Werk den Meister lobt. Ähnlich ist auch diese Welt ein Spiegel der göttlichen Majestät, aus welchem Gottes Weisheit widerstrahlt. Sie betrachtete der Prophet und richtete zugleich das Auge seines Geistes zum Unsichtbaren empor: da rief er aus: „Wie erhaben sind deine Werke, o Herr! Alles hast du in Weisheit gemacht“.</p><p>Nicht umsonst sicherlich lesen wir: „geschaffen“; denn gar manche Heiden, welche die Welt gerne als den Schatten der göttlichen Kraft, gleichewig mit Gott hinstellen möchten, behaupten, sie subsistiere von selbst. Wiewohl sie zugestehen, daß sie ihren Grund in Gott hat, wollen sie doch diesen Grund nicht aus seinem Willen und Walten hergeleitet wissen, sondern nach Analogie des Schattens, der seinen Grund in einem Körperding hat. Der Schatten folgt ja dem Körper, und der Strahl dem Lichte mehr infolge einer natürlichen Zugehörigkeit als einer freien Willensbestimmung. Mit feiner Berechnung also betonte Moses: „Gott hat den Himmel und die Erde <em>geschaffen</em>“. Er sagte nicht: Er hat sie subsistieren gemacht; er sagte nicht: er hat der Welt die Ursache des Seins mitgeteilt, sondern: er schuf als der Gütige, was da frommte, als der Weise, was ihm als das Beste dünkte, als der Allmächtige, was er als das Erhabenste voraussah. Wie aber hätte die Welt ein Schattenwurf sein können, nachdem kein Körperding da war? Von der unkörperlichen Gottheit konnte doch kein Schatten fallen. Wie könnte desgleichen von einem immateriellen Lichte ein materieller Glanz ausstrahlen?</p><p>Doch wenn du nach dem Abglanze Gottes fragst: Der Sohn ist das Bild des unsichtbaren Gottes. Wie also Gott, so auch das Bild: Unsichtbar ist Gott, unsichtbar auch das Bild. Es ist nämlich der Sohn der Abglanz der Herrlichkeit des Vaters und das Bild seiner Wesenheit. „Im Anfang“, heißt es, „hat Gott den Himmel und die Erde geschaffen.“ Geschaffen also ward die Welt, und zu sein angefangen hat sie, die nicht war; das Wort Gottes aber war am Anfange und war immerdar. Aber auch die Engel, Herrschaften und Gewalten, die zwar einmal zu sein anfingen, waren bereits da, bevor diese Welt geschaffen wurde. Denn „alles ist erschaffen und gemacht worden, das Sichtbare und das Unsichtbare, seien es Throne oder Herrschaften oder Fürstentümer oder Gewalten: Alles, heißt es weiter, ist durch ihn und für ihn erschaffen worden“. Warum „für ihn erschaffen“? Weil er der Erbe des Vaters ist, indem vom Vater das Erbe auf ihn übergegangen ist, wie es der Vater beteuert: „Verlange von mir, und als dein Erbe will ich dir die Völker geben“. Indes vom Vater ging dieses Erbe auf den Sohn über, und auf den Vater fällt es vom Sohne zurück. Nachdrucksvollst bezeichnet also der Apostel einerseits an der obigen Stelle den Sohn als den Urheber aller Dinge, dessen Majestät alles umfaßt; andrerseits schreibt er an die Römer von dem Vater: „Denn aus ihm und durch ihn und für ihn ist alles“: „aus ihm“ der Anfang und Ursprung der Wesenheit aller Dinge, d. i. aus seinem Willen und seiner Macht ― aus seinem Willen nämlich nahm alles seinen Anfang; denn der eine Gott ist der Vater, aus dem alles ist; aus dem Seinigen gleichsam schuf er, der da schuf, woraus er wollte ― „durch ihn“ der Fortbestand, „für ihn“ das Endziel: „aus ihm“ also der Stoff, „durch ihn“ die Kraft, die das All in bindende und zwingende Gesetze fügte, „für ihn“ alles, weil es, solange er will, durch seine Kraft fortdauert und fortbesteht und sein Endziel, zu dem es zurückstrebt, in Gottes Willen hat und nach dessen freiem Belieben der Auflösung anheimfällt.</p><p>Am Anfange der Zeit hat Gott den Himmel und die Erde geschaffen. Eine Zeit gibt es nämlich erst seit dieser Welt, nicht vor der Welt; der Tag aber ist ein Teil, nicht der Anfang der Zeit. Wir könnten nun zwar an der Hand des verlesenen Schrifttextes dartun, wie der Herr zuerst den Tag und die Nacht, den Wechsel der Zeiten, schuf, und am zweiten Tage sodann eine Feste schuf, durch welche er das Wasser unter dem Himmel und das Wasser über dem Himmel schied. Doch für die gegenwärtige Erörterung genügt vollauf der Hinweis, daß Gott am Anfang den Himmel schuf mit dem (zeitlichen) Vorrecht der Hervorbringung (der Dinge am Himmel) und der Ursache hiervon, und die Erde schuf mit dem Grundstoff zur Hervorbringung (der Dinge auf der Erde). In ihnen wurden nämlich die vier Elemente erschaffen, aus welchen alle diese Dinge in der Welt bei ihrem Werden bestehen. Die vier Elemente aber sind: Himmel, Feuer, Wasser und Erde, die in allen Dingen vermischt vorhanden sind. So findet sich in der Erde Feuer vor, das sich häufig aus Gestein und Eisen schlagen läßt; auch ist es wohl begreiflich, daß im Himmel, nachdem er eine feurige, von funkelnden Sternen schimmernde Zone ist, Wasser vorhanden ist, das teils über dem Himmel ist, teils von jener höheren Region in häufigem, reichlichem Regen niederströmt. Wir könnten dies noch an vielen Erscheinungen erhärten, wenn uns solches irgendwie zur Erbauung der Kirche ersprießlich dünkte. Da es aber ein fruchtloses Mühen wäre, sich damit zu beschäftigen, wollen wir unseren Geist lieber auf jene Wahrheiten lenken, die für das ewige Leben förderlich sind.</p><p>Es mag also genügen, über die Beschaffenheit und Substanz des Himmels das vorzubringen, was wir bei Isaias [Jesaia] niedergeschrieben finden, der in schlichten und gebräuchlichen Wendungen die Beschaffenheit der Himmelsnatur mit den Worten zum Ausdruck brachte: (Gott) habe den Himmel „wie Rauch gefestigt“. Er wollte damit erklären, daß dessen Substanz von feiner, nicht kompakter Art sei. Auch die Gestalt desselben wird genugsam durch das angedeutet, was er von der Himmelsfeste aussagte: Gott habe den Himmel „wie ein Gewölbe geschaffen“, insofern nämlich alles, was im Meere oder auf dem Lande sich regt, vom weiten Himmelsraume umschlossen wird. Das wird in ähnlicher Weise auch angedeutet, wenn man liest, Gott habe „den Himmel ausgespannt“. Ausgespannt ist er nämlich: sei es wie ein Fell zu Gezelten, den Wohngezelten der Heiligen, sei es wie eine Buchrolle zur Einschreibung der Namen jener Ungezählten, die Christi Gnade durch Glaube und Frömmigkeit sich verdienten, denen die Versicherung gilt: „Freuet euch, denn eure Namen stehen eingeschrieben im Himmel!“</p><p>Auch von der Erde Beschaffenheit oder Lage zu handeln, würde in betreff der Zukunft nichts frommen. Es mag genügen zu wissen, daß der Text der heiligen Schriften die Bemerkung enthält: „Er hing die Erde auf im Nichts“. Was hätten wir von langen Untersuchungen, ob er sie in der Luft oder über dem Wasser aufhing? Es würde sofort die Frage entstehen, wie denn die leichte und weichere Luftnatur die schwere Erdenmasse tragen könne? Oder, wenn über den Wassern, wie die Erde nicht in jähem Sturz ins Wasser versinke? Oder wie die Meeresflut derselben nicht weiche und die seitlich angrenzenden Teile, sobald sie von ihrer Stelle gewichen, überströme? Viele behaupteten auch, die Erde schwebe mitten in der Luft und beharre unbeweglich mit ihrer Masse, weil sie sich so nach allen Seiten erstrecke, daß eine Bewegung hier- und dorthin sich paralysiere. Hierzu genügt, wie ich glaube, des Herrn Äußerung an seinen Diener Job, da er durch eine Wolke sprach und fragte: „Wo warst du, da ich grundlegte die Erde? Sage es mir, wenn du Einsicht hast! Wer setzte fest ihr Maß, wenn du’s weißt? Oder wer ist’s, der über sie ausgespannt die Meßschnur? Oder worauf werden ihre Zonen befestigt?“ Und im folgenden: „Ich schloß mit Toren ein das Meer und sprach: Bis hierher sollst du kommen und nicht weiter dringen, sondern in dir sollen sich brechen deine Wogen“. Hat Gott damit nicht klar gezeigt, daß alles in seiner Größe gründet, nicht in Zahl, Gewicht und Maß? Denn das Geschöüf gibt kein Gesetz, sondern empfängt es, bezw. wahrt das empfangene. Nicht wegen ihrer zentralen Lage schwebt also die Erde im Gleichgewicht, sondern weil Gottes Majestät durch das Gesetz seines Willens sie zwingt, daß sie über dem unsteten Gewoge, bezw. im leeren Raume stetig beharre. So bezeugt es auch der Prophet David mit den Worten: „Er hat gegründet die Erde auf ihre Festigkeit; sie wird nicht wanken in alle Ewigkeit“. Da wird doch Gott nicht bloß als Künstler, sondern als der Allmächtige gefeiert, der die Erde nicht kraft einer gewissen Zentralität, sondern seines Gebotes in Schwebe hält und nicht ins Wanken geraten läßt. Nicht die zentrale Lage, sondern Gottes Ermessen müssen wir für das Maßgebende halten: nicht Kunst, sondern die Macht ist da maßgebend, die Gerechtigkeit ist maßgebend, das Wissen ist maßgebend; denn das All übersteigt nicht als etwas Unermeßliches sein Wissen, sondern unterliegt als etwas Endliches seinem Erkennen. Wenn wir lesen: „Ich festigte ihre Säulen“, können wir doch nicht glauben, sie ruhe wirklich auf Säulen, sondern auf jener Kraft, welche der Erde Substanz trägt und erhält. Wie sehr der Bestand der Erde in der Macht Gottes gründet, folgere endlich auch daraus, daß geschrieben steht: „Er, der anblickt die Erde und sie erzittern macht“; und an einer anderen Stelle: „Noch einmal erschüttere ich die Erde“. Nicht also unbeweglich beharrt sie infolge ihres Gleichgewichtes, sie wird vielmehr häufig auf Gottes Wink und Willen erschüttert, wie auch Job es ausspricht: „Der Herr schüttert sie weg von ihren Grundfesten, ihre Säulen aber wanken“; und an anderer Stelle: „Nackt ist das Totenreich vor ihm, und keine Hülle deckt den Tod. Er spannt den Nord aus vor dem Nichts, hängt die Erde auf im Nichts, bindet die Wasser in seinen Wolken... Des Himmels Säulen fahren empor und erbeben vor seinem Dräuen. Durch seine Kraft besänftigt er das Meer, durch seine Zuchtrute streckt er hin des Meeres Ungeheuer, des Himmels Tore aber fürchten ihn“. Durch Gottes Willen also beharrt sie unbeweglich und „steht in Ewigkeit“ nach des Predigers Spruch, und kraft Gottes Willen bewegt sie sich und schwankt. Nicht weil auf ihre Grundfesten gestützt, besteht sie, und nicht weil auf ihren Säulen ruhend, beharrt sie sonder Wanken, sondern der Herr gibt ihr Bestand und Halt mit der Festigkeit seines Willens, „denn in seiner Hand sind alle Enden der Erde“. Und dieser schlichte Glaube geht über alles Vernünfteln. Mögen andere beifällig der Ansicht beipflichten, die Erde senke sich deshalb an keinem Punkte, weil sie von Natur ihre Lage in der Mitte habe, sie beharre eben mit Notwendigkeit in dieser Lage, ohne nach einer anderen Seite sich zu neigen, solange sie sich nicht naturwidrig, sondern naturgemäß bewege; mögen sie des göttlichen Bildners, des ewigen Meisters Erhabenheit rühmen ― welcher Künstler verdankte denn nicht ihm seine Begabung, oder wer „gab den Frauen die Kenntnis der Webekunst oder das Verständnis für Stickerei?“ ―: ich, der die Tiefe seiner Majestät und die Erhabenheit seiner Kunst nicht zu fassen vermag, verlasse mich nicht auf Gleichgewicht und Maß in der Wissenschaft, sondern halte dafür, daß alles in Gottes Willen beruht, insofern sein Wille die Grundfeste des Alls ist und seinetwegen diese Welt fortbesteht. Zum Beweise hierfür mag beispielsweise auch des Apostels Autorität angezogen werden; denn so steht geschrieben: „Der Vergänglichkeit ward die Schöpfung unterworfen, nicht freiwillig, sondern um dessen willen, welcher sie unterworfen hat, auf Hoffnung hin. Indes wird auch die Schöpfung befreit werden von der Knechtschaft des Verderbens“, wenn das Gnadenlicht der göttlichen Vergeltung aufleuchten wird.</p><p>Was soll ich aber der Reihe nach das anführen, was die Philosophen in ihren Erörterungen über die Natur und Beschaffenheit des Himmels ersonnen haben. „Die einen nämlich behaupten eine Zusammensetzung des Himmels aus den vier Elementen..., andere führen zu dessen Konstitution eine fünfte Wesenheit von neuer körperlicher Art ein“ und stellen sich dieselbe als ätherische Körpersubstanz vor, frei von Vermischung mit Feuer, Luft, Wasser und Erde. Diese Weltelemente hätten nämlich ihre bestimmte natürliche Richtung und Betätigung und Bewegung, so daß die schwereren niedersänken und zu Boden fielen, die leeren und leichten nach oben strebten ― jedes folgt eben seiner eigenen Bewegung ―, an der Peripherie der Weltkugel aber gingen sie ineinander über und verlören die Fähigkeit zur Einhaltung ihrer Richtung; denn die Kugel drehe sich im Kreise und das obere kehre sich zu unterst, das untere zu oberst. Dinge aber, deren naturmäßige Bewegung verändert werde, erlitten damit, sagen sie, in der Regel auch eine Veränderung ihrer Wesenseigenschaften. Was brauchen wir für das Vorhandensein einer ätherischen Körpersubstanz eintreten, damit sie nicht der Vergänglichkeit verfallen erscheine? Was nämlich aus vergänglichen Elementen sich zusammensetzt, verfällt notwendig der Auflösung. Schon dadurch, daß eben diese Elemente entgegengesetzter Natur sind, können sie nicht eine schlechthin unveränderliche Bewegung haben; muß sich doch ihre entgegengesetzte Bewegung gegenseitig hemmen. Es kann nämlich nicht <em>eine</em> Bewegung für alle passen und für so verschiedenartige Elemente sich eignen: ist sie den leichten Elementen angepaßt, ist sie das für die schwereren nicht. Soll eine Bewegung zu des Himmels Höhen statthaben, leidet sie unter dem Schwergewicht des Irdischen; will man die Richtung nach unten nehmen, zerrt man das Kraftelement des Feuers gewaltsam nieder, indem es wider seine gewohnte Natur nach abwärts gezwungen wird. Alles aber, was nicht der Natur, sondern dem Zwange unterworfen, gewaltsam in sein Gegenteil verkehrt wird, fällt rasch der Auflösung und Zersetzung in jene Elemente anheim, aus welchen es zusammengesetzt ist, und von denen jedes in sein Bereich zurückkehrt. Die Erwägung nun, daß diese (Elemente) nichts Beharrendes sein können, brachte jene anderen Autoren zur Annahme eines ätherischen Stoffes für den Himmel und die Gestirne, indem sie eine fünfte Wesenheit materieller Art einführten, kraft welcher ihrer Ansicht nach die Himmelssubstanz eine ewig dauernde sein wird.</p><p>Doch diese Annahme vermochte dem Ausspruch des Propheten nicht zu derogieren, der noch dazu durch die göttliche Majestät des Herrn Jesus Christus, unseres Gottes, im Evangelium seine Bestätigung fand. Es sprach nämlich David: „Im Anfange hast Du, o Herr, die Erde gegründet, und Deiner Hände Werk sind die Himmel. Sie werden vergehen, Du aber bleibst. Und alles wird altern wie ein Kleid, und wie ein Gewand wechselst Du es, und es ist gewechselt. Du aber bist derselbe, und Deine Jahre werden kein Ende nehmen“. Und das bestätigte nun der Herr im Evangelium so bestimmt, daß er erklärte: „Himmel und Erde werden vergehen, meine Worte aber werden nicht vergehen“. Nichts denn bezwecken jene, welche, um die Ewigkeit des Himmels behaupten zu können, eine fünfte ätherische Körpersubstanz einführen zu sollen glaubten; müssen sie doch ebenso (wie wir) merken, daß ein Fremdkörper auch nur in einem Gliede dem Organismus gewöhnlich mehr nachteilig ist. Beachte zugleich, wie David auch dadurch, daß er die Erde an erster Stelle nannte und dann erst den Himmel, letzteren als Geschöpf Gottes erklären zu sollen glaubte; denn wenn „er sprach, und sie waren geschaffen“, ist es (an sich) belanglos, was man zuerst nennt, da ja beide zugleich geschaffen wurden ― ‚zugleich‘, damit es nicht den Anschein gewänne, als sei dem Himmel wenigstens in der Form die Prärogative göttlicher Substanz zugesprochen, daß er wegen seines Vorrechtes als Erstlingsgeschöpf für vorzüglicher gehalten werden müsse. Überlassen wir denn jene (Weltweisen), die sich selbst gegenseitig in ihren Streitreden widerlegen, ihren Streitigkeiten. Uns aber genügen zum Heile nicht strittige Meinungen, sondern wahre Lehren, nicht sophistische Begründungsweise, sondern der gläubige Sinn, um lieber als einem Geschöpfe dem Schöpfer dienstbar zu sein, der da ist „Gott hochgelobt in Ewigkeit“.</p><p><strong>Eine ewige Hyle ein Nonsens. Sinn von “unsichtbar”. Warum geht die Schöpfung nicht in voller Ausstattung aus des Schöpfers Hand hervor?</strong></p><p>* „Die Erde aber war unsichtbar und ungestaltet“*. Ein tüchtiger Baumeister legt zuvor das Fundament, dann, wenn er das Fundament gelegt, führt er die Teile des Baues, einen nach dem andern, auf und fügt dazu die Ausschmückung. Erst also nachdem die Grundfeste der Erde gelegt und des Himmels Bau gefestigt war ― diese beiden sind ja das Grundwesentliche des Alls ― folgt die Bemerkung: „Die Erde aber war unsichtbar und ungestaltet“. Warum „war“? Daß man nur nicht etwa seine Meinung überspanne bis zu einer End- und Anfangslosigkeit und sage: Sieh, die Materie, d. i. nach philosophischer Ausdrucksweise die Hyle, nahm auch nach der göttlichen Schrift keinen Anfang. Denen, die das behaupten, kann man entgegenhalten, daß auch geschrieben steht: „Es ‚war‘ aber Kain ein Ackerbauer“; und von Jubal, so heißt er, sagt die Schrift: „Er ‚war‘ der Vater, welcher Psalter und Zither aufzeigte“; ferner: „Ein Mann ‚war‘ im Lande Hus namens Job“. Mögen sie also den Streit um Worte lassen, zumal Moses im vorausgehenden bereits hervorhob, daß Gott die Erde geschaffen habe. Sie „war“ also von der Zeit an, da sie geschaffen wurde. Denn ist sie, wie sie behaupten, anfangslos, ist eben ihrer Behauptung zufolge nicht bloß Gott, sondern auch die Hyle anfangslos. Dann aber mögen sie angeben, wo sie denn war? Wenn im Raume, dann folgt, daß auch der Raum, worin der anfangslose Grundstoff der Dinge war, anfangslos gewesen ist. Scheint diese Auffassung vom Raume widersinnig, seht zu, ob wir uns die Erde nicht vielleicht mit Flügeln denken müssen, so daß sie in Ermangelung einer Grundfeste mit der Fittiche Schwungfedern sich in Schwebe hielt. Aber wo sollen wir denn die Fittiche für sie hernehmen? Wir müßten denn jenen prophetischen Ausspruch so deuten und hierher beziehen: „Vor den Schwingen der Erde vernahmen wir Unheilvolles, und jenes Wehe der Erde war wie Ruderschlag der Schiffe“. Doch um es so zu verstehen: in welchem Luftkreis schwebte dann die Erde? Ohne Luft konnte sie ja nicht schweben. Luft aber konnte es noch nicht geben, weil es unterschiedliche Elemente unabhängig vom Stoff der Dinge nicht gab; waren doch die Elemente überhaupt noch nicht geschaffen. Wo befand sich also diese Hyle, von der Fittiche Schwungkraft getragen? In der Luft war sie nicht, weil die Luft etwas Körperliches innerhalb der Welt ist. Daß aber die Luft etwas Körperliches ist, lehrt die Schriftlesung: denn sobald der Pfeil nach dem Punkte, nach welchem der Schütze zielt, abgeschnellt ist, schließt sich sofort auch die Luft, die er durchschnitten. Wo also befand sich die Hyle? Es müßte denn etwa die fast verrückte Antwort lauten: In Gott war sie. Also Gott mit seiner unsichtbaren und unverweslichen Natur, der „in unnahbarem Lichte wohnt“, der unfaßbare und reinste Geist, war der Raum für die Weltmaterie? Und in Gott ruhte ein Teil der Welt? Ist doch nicht einmal der Geist seiner Diener von dieser Welt, wie wir es geschrieben finden: „Sie sind nicht von dieser Welt, wie auch ich nicht von dieser Welt bin“.</p><p>Welche Verquickung also des Unsichtbaren mit dem Sichtbaren, des Ungestalteten mit dem, der allem Ordnung und Schönheit gab! Es müßte denn sein, daß man deshalb, weil es heißt: „die Erde aber war unsichtbar“, diese ihrer Substanz nach für unsichtbar hielte, und nicht deshalb, weil sie von den Wassern bedeckt, dem leiblichen Auge nicht sichtbar sein konnte, wie ja gar manche Dinge in der Tiefe der Wasser dem scharfen Blick des Auges sich entziehen. Für Gott gibt es nichts Unsichtbares; vielmehr wird die Weltschöpfung (an der obigen Stelle) lediglich vom geschöpflichen Standpunkt aus beurteilt. Unsichtbar war die Erde auch insofern, als noch kein Licht da war, das die Welt erhellte, noch keine Sonne; denn erst nachher wurden die Leuchten am Himmel erschaffen. Wenn nun schon der Sonne Strahl vielfach auch die vom Wasser bedeckten Gegenstände aufhellt und durch seinen Lichtglanz die Dinge in der Tiefe aufdeckt, wer dürfte zweifeln, daß es für Gott keine unsichtbaren Dinge geben kann? Wir müßten denn die „unsichtbare Erde“ so verstehen, daß sie doch noch nicht der Heimsuchung des Wortes Gottes und seines Schutzes erfreute, indem sie noch keinen Menschen trug, um dessentwillen Gott zur Erde herabgeblickt hätte; denn so steht geschrieben: „Der Herr schaut vom Himmel auf die Menschenkinder, zu sehen, ob ein Weiser sei oder ein Gottsuchender“. Und an einer anderen Stelle: „Vom Himmel schleudertest Du Dein Gericht, die Erde erzitterte und ward still“. Sodann mit Recht auch „unsichtbar“, weil noch ungestaltet; noch hatte ja (die Erde) von ihrem Schöpfer nicht die ihr gebührende Gestalt und Schönheit empfangen.</p><p>Vielleicht möchte man einwenden: Warum hat denn Gott ― entsprechend dem: „Er sprach und es ward“ ― den Dingen bei ihrem Entstehen nicht zugleich die gebührende Ausstattung verliehen? Konnte etwa der Himmel nicht im Augenblick seiner Erschaffung im Glanze der Sterne erstrahlen, die Erde nicht in den Schmuck der Blumen und Früchte sich kleiden? Gewiß, sie konnten es. Doch die Feststellung, sie seien zuvor geschaffen, dann erst ausgestattet worden, dient dazu, daß man sie nicht im Ernst für unerschaffen und anfangslos hielte, wenn die Arten der Dinge, als wären sie von Anfang an ursprungslos, nicht augenscheinlich später hinzugekommen wären. „Ungestaltet war die Erde“, steht zu lesen, und doch wird sie von den Philosophen mit denselben Ewigkeitsprivilegien ausgezeichnet wie Gott: was würden sie erst sagen, wenn ihre Schönheit gleich anfänglich in voller Pracht erblüht wäre? Im Wasser versunken, wird sie beschrieben, als wäre sie bestimmt gewesen, gleichsam in ihren Anfängen Schiffbruch zu leiden, und immer noch wird sie von einigen nicht für geschaffen gehalten: was erst, wenn ihr (die Schrift) ursprüngliche Wohlgestalt zuschriebe? Dazu kommt, daß uns Gott zu seinen Nachahmern haben wollte: wir sollten zuerst etwas fertigen, dann erst ausschmücken, damit wir nicht, wenn wir beides zugleich in Angriff nähmen, keines vollenden könnten. Unser Glaube erfährt so ein stufenweises Wachstum. Gott ließ darum die Erschaffung vorausgehen, die Ausstattung folgen, damit wir glauben, daß der nämliche, der die Schöpfung, auch die Ausschmückung, und der die Ausschmückung, auch die Schöpfung vollführte, und nicht meinen, einer habe die Ausschmückung, ein zweiter die Schöpfung vollzogen, sondern ein und derselbe habe beides vollbracht, erst die Schöpfung, dann die Ausschmückung, so daß eines durch das andere beglaubigt wird. Im Evangelium hast du ein klares Zeugnis hierfür. Da nämlich der Herr daran ging, den Lazarus aufzuerwecken, hieß er die Juden den Stein vom Grabe wegnehmen, damit sie sich erst mit eigenen Augen von dessen Tod überzeugten, hernach an dessen Auferweckung glaubten. Darauf rief er den Lazarus mit Namen; er stand auf und kam mit den Binden an Händen und Füßen heraus. Hätte der, welcher einen Toten zu erwecken vermochte, nicht auch einen Stein zu beseitigen vermocht? Und hätte der, welcher einem Verstorben das Leben zurückzugeben vermochte, nicht auch der Bande Knoten zu lösen vermocht? Hätte er dem, welchen er trotz den Fesseln an den Füßen gehen machte, nicht durch Zerreißen der Binden das Schreiten ermöglichen können? Doch wir sehen eben, wie es ihm darum zu tun war, zuerst den Toten (als solchen) zu zeigen, damit die Juden ihren Augen trauten, sodann ihn aufzuerwecken, endlich sie selbst die Leichenbinden lösen zu heißen, damit sich ihrem Unglauben während dieser Vorgänge der Glaube mitteilte und ihre Glaubenswilligkeit gleichsam stufenweise entwickelte.</p><p><strong>Was heißt “ungestaltet”? Der Geist Gottes über den Wassern der Heilige Geist: die Schöpfung das Werk der Trinität. Die “Finsternis über dem Abgrunde” nicht die bösen Geister das Böse überhaupt nichts Erschaffenes, nichts Substanzielles, sondern ein sittlicher Defekt, das einzige wahre Übel sondern der Schattenwurf des Himmels auf die Erde.</strong></p><p>So schuf also Gott zuerst den Himmel und die Erde ― doch nicht für ewig; er wollte vielmehr, daß sie, eine vergängliche Schöpfung, ein Ende hätten. Darum spricht er im Buche des Isaias [Jesaja]: „Erhebet zum Himmel euere Augen und blicket hin zur Erde unten! Denn der Himmel ist gefestigt wie Rauch, die Erde aber wird morschen wie ein Kleid“. Das ist die Erde, die ehedem „ungestaltete“. Es gab ja noch keine durch eigene Abgrenzung in sich abgesonderten Meere, und die Erde war eben darum noch über und über von unstet wogender Flut und abgrundtiefem Wasser bedeckt. Bedenke, wie auch jetzt noch die Erde häufig von Sumpfschlamm starrt und dort, wo zu reichliche Flüssigkeit in den Boden gesickert ist, keine Pflugschar trägt. Sie war sonach „ungestaltet“, weil ungepflügt für die Aussaat des emsigen Landmannes, indem ein Bebauer noch nicht da war. Sie war „ungestaltet“, weil brach an Erzeugnissen und ohne Pflanzenwachstum an schwellenden Ufergeländen und nicht umgürtet von dunklen Hainen, und nicht saatenfroh und nicht beschattet von Bergesgipfeln und nicht blumenduftend und nicht rebenwinkend; mit Recht „ungestaltet“, da sie allen Schmuckes entbehrte, da sie der sprossenden Rebengewinde mangelte. Es wollte nämlich Gott zeigen, daß die Welt an sich ohne Reiz gewesen wäre, wenn kein Bebauer sie mit mannigfacher Anpflanzung geschmückt hätte. Selbst der bewölkte Himmel pflegt beim Anblick Grauen und Angst in der Seele zu wecken, die von Regen aufgeweichte Erde Widerwillen; und das von Stürmen gepeitschte Meer: welchen Schrecken jagt es nicht ein! Wunderschön ist der Dinge Gestalt. Doch was wäre sie ohne das Licht? Was ohne die Wärme? Was ohne Sammlung der Wasser, in deren Tiefen vordem die Anfänge unseres Weltkörpers versenkt lagen. Nimm der Erde die Sonne, nimm dem Himmel die Sternenbälle: alles starrt vor Finsternis. So war es, bevor der Herr dieser Welt das Licht eingoß. Darum sagt die Schrift: „Finsternis lag über dem Abgrunde“. Finsternis lag darüber, weil der Glanz des Lichtes erst folgte. Finsternis war, weil die Luft an sich finster ist. Selbst das Wasser unter der Wolke ist finster; denn „finsteres Wasser ist im Gewölke der Luft“. ― „Finsternis lag über den Abgründen der Wasser.“ Ich glaube nämlich nicht, daß man an die bösen Mächte zu denken hat, als hätte der Herr ihre Bosheit erschaffen; ist doch die Bosheit sicherlich nichts Wesenhaftes, sondern etwas Zufälliges, bestehend im Abweichen vom sittlich Guten der Natur.</p><p>Bei der Erschaffung der Welt nun möge unsere Auffassung vom Bösen einstweilen noch zurückgestellt werden, um nicht den Anschein zu wecken, mit Häßlichem Gottes Werk und der Schöpfung Schönheit zu entstellen, zumal da es im folgenden heißt: <em>“Und der Geist Gottes war über den Wassern schwebend“</em>. Mögen auch einige Autoren ersteren von der Luft verstehen, andere vom Hauche des Lebensodems, den wir aus- und einatmen, so verstehen <em>wir</em> doch im Einklange mit der Auffassung der Heiligen und Gläubigen den Heiligen Geist darunter, so daß also bei der Weltschöpfung das Wirken der Trinität aufleuchtet. Voraus ging nämlich: „<em>Im Anfang</em> hat Gott den Himmel und die Erde geschaffen“, d. i.: In Christus hat Gott geschaffen, oder: der Sohn Gottes hat als Gott geschaffen, oder: durch den Sohn hat Gott geschaffen, indem „alles durch ihn geschaffen ist und ohne ihn nichts geschaffen ist“. Noch war nachzutragen die Fülle der Wirksamkeit im Geiste; denn so steht geschrieben: „Durch das Wort des Herrn sind die Himmel gefestigt und durch seines Mundes Hauch (Geist) all ihre Kraft“. Wie wir also durch das Psalmwort über die Wirksamkeit des Wortes, d. i. des Wortes Gottes, sowie über die Kraft belehrt werden, die der Heilige Geist (den Himmeln) verlieh, so ertönt hier wie im Echo der prophetische Ausspruch: „Es sprach Gott“ und: „Es schuf Gott“, desgleichen: „Der Geist Gottes war schwebend über den Wassern“. Während der Himmel der Ausschmückung sich erfreuen sollte, schwebte, wie es so schön heißt, über der Erde, die sprossen sollte, der Geist Gottes; denn ihm verdankten die Samen für die neuen Erzeugnisse ihre Triebkraft nach des Propheten Wort: „Sende Deinen Geist und sie werden geschaffen, und Du erneuest das Angesicht der Erde“. Der syrische Text, der mit dem hebräischen sich nahe berührt und zumeist wörtlich damit sich deckt und übereinstimmt, hat so: „Und der Geist Gottes brütete über den Wassern“, d. i. belebte sie: er zwang sie zur Hervorbringung neuer Geschöpfe und weckte sie durch sein Brüten zum Leben. Denn auch vom Heiligen Geiste lesen wir, daß er der Schöpfer ist. So spricht Job: „Gottes Geist ist’s, der mich geschaffen hat“. Sei es also, daß es der Heilige Geist war, der über den Wassern schwebte: dann konnte nicht die Finsternis feindlicher Mächte dort lagern, wo so großes Gnadenwalten Platz griff; sei es daß man, wie andere wollen, die Luft darunter versteht: dann mögen sie Antwort stehen, warum vom „Geiste Gottes“ die Rede ist, nachdem der Ausdruck ‚Geist‘ genügt hätte.</p><p>Jene nun wollen vom Herrn unserem Gotte zuerst die vier Elemente: Himmel, Erde, Meer und Luft hervorgebracht wissen, deshalb weil Feuer und Luft, Erde und Wasser die Grundstoffe der Dinge bilden, aus welchen der Welt Schönheit und Form besteht. Wo nun hätte die Finsternis der Geister der Bosheit noch Platz haben sollen, als die Welt das Prachtgewand ihrer jetzigen herrlichen Gestalt anzog? Oder hat Gott zugleich auch das Böse erschaffen? Doch nein, das nahm seinen Ursprung aus uns und ging nicht aus Gottes Schöpferhand hervor: die Ausgeburt eines leichtsinnigen sittlichen Wandels, ohne alles geschöpfliche Vorrecht und Ansehen einer Natursubstanz, vielmehr mit dem schlimmen Hang zur Unbeständigkeit und der Verirrung in die Sünde behaftet. Ausgerottet will es Gott haben aus eines jeglichen Seele: wie sollte <em>er</em> es eingepflanzt haben? Laut mahnt der Prophet: „Lasset ab von eurer vielen Bosheit!“ Und insbesondere der heilige David: „Laß ab vom Bösen und tu Gutes!“ Wie dürften wir ihm den Ursprung aus dem Herrn beilegen? Und doch ist dies die unselige Ansicht derer, die da Verwirrung in der Kirche anrichten zu müssen glaubten. Hier machten die Marcioniten, dort die Valentiner, dort die Pest der Manichäer den Versuch, in den Geist der Heiligen die Todeskeime ihrer ansteckenden Seuche zu senken. Was sollten <em>wir</em> uns im Lichte des Lebens die Finsternis des Todes aufsuchen? Die göttliche Schrift träufelt den Balsam des Heils, duftet den Wohlgeruch des Lebens, so daß du süße Frucht aus ihrer Lesung ziehen, nicht Gefahr zu jähem Sturz laufen sollst. In Einfalt lies, o Mensch! Grab dir nicht selbst, ein verkehrter Ausleger, eine Grube! Der einfache Wortlaut sagt: „Gott hat den Himmel und die Erde geschaffen“: er hat geschaffen, was nicht da war, nicht, was da war. Ferner: „Die Erde war unsichtbar“: seit dem Augenblicke der Erschaffung war sie da, und zwar unsichtbar, weil Wasser sie überflutete und bedeckte. Und Finsternis war ausgegossen über ihr, weil noch kein Tageslicht, noch kein Sonnenstrahl da war, der selbst die unter dem Wasser verborgenen Dinge zu erhellen pflegt. Wie kann man also sagen, daß Gott das Böse erschaffen hat, da doch aus konträren, sich entgegengesetzten Prinzipien nichts hervorgeht, was gerade das Gegenteil von ihnen ist: Leben erzeugt nicht Tod und Licht nicht Finsternis. Denn nicht wechselnden Launen gleichen Zeugungsprozesse. Jene kehren sich mit der Änderung des Vorsatzes von einem Gegenteil ins andere, diese lassen sich nicht von einem Gegenteil ins andere verändern, sondern stehen, aus gleichartigen Urhebern, bezw. Ursachen entstanden, in einem Ähnlichkeitsverhältnisse zu ihrem Urheber.</p><p>Was also werden wir sagen? Wenn das Böse weder als unerschaffen anfangslos, noch auch von Gott geschaffen ist, woher hat es die Natur? Denn daß es Böses in dieser Welt gibt, hat noch kein Vernünftiger geleugnet; kommt es doch so häufig in diesem Leben zum Fall in den (Sünden-) Tod. Indes schon aus dem oben (8, 28) Gesagten können wir schließen, daß das Böse keine usprüngliche Wesenheit ist, sondern eine auf die Abkehr vom Tugendpfade zurückgehende Entstellung des Geistes und Sinnes, die nur der Sorglosen Sinn häufig beschleicht. Nicht also von außen, sondern von uns selbst droht uns die größere Gefahr. Im Innern lauert der Widersacher, im Innern der Anstifter der Sünde, im Innern, ich wiederhole es, in uns selbst ist er verschlossen. Laß deinen Vorsatz nicht aus dem Auge, prüfe das Verhalten deines Geistes, sei wachsam wider die Gedanken deines Geistes und die Begierden deines Herzens! Du selbst bist schuld an deiner Sündhaftigkeit, du selbst der Anführer bei deinen Schandtaten und der Verführer zu deinen Missetaten. Was ziehst du eine fremde Natur zur Entschuldigung deiner Fehltritte herein? O daß du dich nur nicht selbst hineingezerrt, daß du dich nicht hineingestürzt, daß du dich nicht hineingewälzt hättest, sei es durch allzu ungezügeltes Streben, sei es aus Gereiztheit, sei es infolge der Begierden, die uns wie mit einem Netz umstrickt halten! Ja fürwahr, wir haben es in unserer Gewalt, unser Streben zu zügeln, den Zorn zu dämpfen, die Begierden zu bezähmen, aber auch in unserer Gewalt, der Lüsternheit zu frönen, die Lüste zu entfachen, den Zorn zu schüren oder dem Schürenden das Ohr zu leihen, uns lieber in Hochmut zu überheben und zu Grausamkeit fortreißen zu lassen, als in Demut uns zu überwinden und die Sanftmut zu lieben. Was klagst du deine Natur an, o Mensch? Wohl sind Alter und Krankheit gewisse Hindernisse, die sie hat, aber gerade das Alter reift sittlich die süßere Frucht in uns aus, erweist sich an Einsicht nützlicher, zur standhaften Ertragung des Todes bereitwilliger, zur Unterdrückung der Begierden stärker. Desgleichen bedeutet des Leibes Schwachheit des Geistes Gesundheit. Darum des Apostels Wort: „Wenn ich schwach bin, bin ich stark“. Nicht seiner Kräfte, sondern seiner Schwachheiten rühmt er sich darum. Ein göttlicher Ausspruch leuchtete auch aus jenem Heilsworte auf: „Die Kraft kommt in der Schwachheit zur Vollendung“. Zu meiden sind jene „Sünden der Jugend“, die unserem Willen entspringen, sowie die unvernünftigen Leidenschaften des Fleisches. Suchen wir also die Ursachen von dem, worüber wir selbst Herr sind, nicht außer uns, und führen wir sie nicht auf andere zurück, sondern erkennen wir an, was unser ist! Denn wenn wir uns für etwas, was wir, falls wir nicht wollen, auch nicht tun brauchen, entscheiden, so müssen wir doch lieber uns als anderen die Schuld zuschreiben. Darum bindet auch vor den weltlichen Gerichten die Verbrecher, die freiwillig und nicht gezwungen handelten, Schuld, trifft sie Strafe. Tötet einer im Wahnsinn einen Unschuldigen, verfällt er nicht der Todesstrafe. Ja selbst auch nach dem Ausspruche des göttlichen Gesetzes erhält einer, der ohne Vorbedacht Totschlag verübte, Straflosigkeit in Aussicht gestellt, Gelegenheit zur Zuflucht, so daß er sich (der Strafe) entziehen kann. ― Soviel also vom Übel im eigentlichen Sinn. Denn Übel sind nur jene, die mit Schuld den Geist binden und das Gewissen schnüren. Im übrigen wird kein Vernünftiger Armut, Niedrigkeit, Krankheit, Tod als Übel bezeichnen oder in die Kategorie der Übel rechnen, weil auch ihre Gegensätze nicht als die höchsten Güter gelten; von diesen kommen uns ja augenscheinlich die einen von Natur, die andern durch glückliche Umstände zu.</p><p>Nicht umsonst schickten wir diesen Exkurs voraus, um zu beweisen, daß „Finsternis“ und „Abgrund“ wörtlich zu nehmen sind. Die Finsternis stammte nämlich vom Schattenwurf des Himmels. Jeder Körper wirft nämlich einen Schatten, mit dem er die in seiner Nähe oder unter sich befindlichen Gegenstände, insbesondere jene, die er sichtlich bedeckt und einschließt, verdunkelt. Der Himmelsraum aber schließt (die Erde) ein, weil der Himmel, wie wir oben (6, 21) gezeigt haben, wie ein Gewölbe ausgespannt ist. Die dichte Finsternis war also nicht eine ursprüngliche Finsternissubstanz, sondern gleichsam nur der Schatten, welcher der körperlichen Welt folgte. So grenzte denn die Welt, da sie im Augenblicke des göttlichen Befehles auftauchte, nach innen einen Schattenbereich ab. Oder wird nicht ebenso, wenn jemand mitten auf einem Felde, das die Mittagssonne bescheint, mit einem Mal einen Platz abzäunt und mit dichtem Laubwerk überdeckt, diese Hütte mit ihrem schaurig dichten Laubwerk darüber um so finsterer werden, je heller die Außenseite dieser Stelle im Lichte erstrahlt? Oder warum nannte man einen solchen von allen Seiten abgeschlossenen Raum antrum (Höhle)? Doch nur wegen des Schaurigen seines schwarzen Aussehens und der darin lagernden Finsternis. Solche Finsternis nun lag auch über den Abgründen der Wasser. Denn daß man große und tiefe Wassermassen Abgrund nennt, lehrt die Lesung des Evangeliums an jener Stelle, wo die Dämonen den Heiland „baten, er möchte ihnen nicht befehlen, in den Abgrund zu fahren“. Er indes, der lehrte, daß man den Dämonen nicht zu Willen sein dürfe, befahl ihnen, in die Schweine zu fahren, die Schweine aber stürzten sich hinab in den Wasserschlund. Es sollten die Dämonen dem Lose, gegen das sie sich sträubten, nicht entrinnen, sondern in jähem, verdientem Sturz in die Tiefe versenkt werden. ― Also war diese Welt nach Aussehen und Form „ungestaltet“.</p><p><strong>Das Licht der erste und notwendigste Schmuck der Schöpfung. Sein plötzliches Aufleuchten durch das ganze All. Auge und Licht. Die Ausscheidung des Lichtes (= Tag) von der Finsternis (= Nacht). Das Licht, nicht die Sonne gebiert den Tag.</strong></p><p>„Und der Geist Gottes schwebte über den Wassern. <em>Und es sprach Gott: Es werde Licht“</em>. Mit Recht nun war zuvor noch vom Geiste Gottes die Rede, da wo Gottes Wirken seinen Anfang zu nehmen hatte. „Es werde Licht.“ Womit hätte auch Gottes Wort in der göttlichen Schrift beginnen sollen als mit dem Lichte? Womit hätte die Ausschmückung der Welt ihren Anfang nehmen sollen als mit dem Lichte? Sie würde ja umsonst dagewesen sein, wenn sie nicht sichtbar gewesen wäre. Gott selbst war zwar im Lichte, denn „er wohnt in unnahbarem Lichte“, und er „war das wahre Licht, welches jeden Menschen erleuchtet, der in diese Welt kommt“: aber er wollte ein Licht schaffen, das auch dem leiblichen Auge wahrnehmbar sein sollte. Wenn ein Familienvater ein Haus zu bauen wünscht, worin sich menschenwürdig wohnen lassen soll, fragt er sich, bevor er noch den Grund legt, woher er ihm Licht zuführen kann. Und das ist sein Hauptschmuck. Fehlt er, mutet das ganze Haus unschön und unwohnlich an. Das Licht ist es, das den sonstigen Schmuck des Hauses erst zur Geltung bringt. ― „Es werde Licht.“ Der lichtvolle Ausdruck selbst deutet nicht erst auf langwierige Vorkehrung, sondern strahlt wider vom Glanze der vollbrachten Tat. Der Schöpfer der Natur sprach „Licht“ und schuf es. Das Wort Gottes ist der Wille (Gottes), das Werk Gottes die Natur. Er schuf das Licht, hellte auf die Finsternis: „Und es sprach Gott: es werde Licht. Und es ward Licht“. Nicht deshalb sprach er, daß die Wirkung (zeitlich) folgen sollte, sondern mit dem gesprochenen Worte vollbrachte er (gleichzeitig) das Werk. Darum die treffende Ausdrucksweise Davids: „Er sprach, da waren sie geschaffen“. Das Vollbringen war die Erfüllung des Wortes. ― Der Schöpfer des Lichtes ist demnach Gott, Ort und Ursache der Finsternis hingegen die Welt. Es sprach aber der gütige Schöpfer in der Weise „Licht“, daß er mit dessen Strahl die Welt erschloß und ihrer Gestalt Schönheit verlieh. Es erstrahlte plötzlich der Luftkreis, und es schwand die Finsternis vor der Helle des neuen Lichtes; der Glanz, der mit einem Mal durch das Weltall flutete, verdrängte und versenkte sie gleichsam in die Abgründe. Schön und einzigartig heißt es darum: „Es ward Licht“. Gleichwie nämlich das Licht im Nu Himmel, Länder und Meere aufhellt und in einem Augenblick, sobald völlig unvermerkt im Glanze des aufgehenden Tages die Lande sich erschließen, rings vor unserem Auge sich ergießt, so sollte auch (der Bericht über) seine Entstehung nur kurz beleuchtet werden. Was Wunder auch, wenn Gott „Licht“ sprach und Licht über der dunklen Welt aufschimmerte? Kann doch schon ein Taucher im Wasser, wenn er aus dem Munde Öl ausfließen läßt, die Dinge, welche die verborgene Tiefe deckte, einigermaßen aufhellen. ― Es sprach Gott nicht so, daß mittels des Stimmorganes ein Ton beim Sprechen lautbar wurde, die Bewegung der Zunge das himmliche Wort formte und der Worte Schall diese Luft traf, sondern so, daß er seinen Willen durch die vollbrachte Tat nach außen zu erkennen gab.</p><p><em>“Und er schied das Licht von der Finsternis. Und Gott sah das Licht, daß es gut ist“</em>. Er sprach, und niemand vernahm den Laut einer Stimme; er schied aus, und niemand merkte seines Schaffens Mühe; er sah, und niemand gewahrte seines Auges Blick. ― „Und Gott sah das Licht, daß es gut ist.“ Nicht etwas, was ihm unbekannt war, sah er, und nicht etwas, das er vorher nicht kannte oder nicht gesehen hatte, billigte er; guten Werken ist es vielmehr eigen, daß sie einer äußeren Empfehlung nicht bedürfen, sondern selbst bei ihrem Anblick von ihrer Vortrefflichkeit Zeugnis geben. Mehr besagt die Billigung des Auges als das Lob des Mundes; denn das Auge stützt sich auf das eigene Zeugnis, nicht auf fremde Empfehlung. Wenn nun schon bei uns mittels der Augen, die ein Schauen der anmutvollen Schönheit und der natürlichen Beschaffenheit der Dinge zugleich ermöglichen, ein Urteil sich fällen läßt, wieviel mehr sieht Gott, was er billigt, und billigt er, was er ansieht, nach dem Ausspruch der Schrift: „Des Herrn Augen ruhen auf den Gerechten“. Die Natur des Lichtes ist derart, daß seine ganze Vorzüglichkeit nicht in der Zahl, nicht im Maß, nicht im Gewicht liegt wie sonst ein Vorzug, sondern im Anblick. Mit besonderen Wendungen bezeichnete also (die Schrift) die Natur des Lichtes, das deshalb beim Sehen Gefallen weckt, weil es selbst das Sehen ermöglicht. Und nicht umsonst war ihm ein so berufener Herold beschieden, von dem es mit Recht an erster Stelle Lob erntet, weil <em>es</em> gerade die Vorbedingung für das Lob bildete, dessen auch die übrigen Bestandteile der Welt würdig sind. ― „Gott sah das Licht“ und hellte es mit seinem Blicke auf und sah, „daß es gut ist“. Nicht ein teilweises, sondern ein allseitiges Urteil Gottes liegt hierin: sonach eine Gutheißung der Vorzüglichkeit des Lichtes nicht bloß hinsichtlich seines Glanzes, sondern seiner ganzen Nützlichkeit überhaupt. Darum hat auch die Ausscheidung zwischen Licht und Finsternis statt. Es soll sich zeigen, daß die ausgesonderte Natur des Lichtes mit der der Finsternis nichts gemein hat.</p><p>[Forts. v. ] * „Und Gott nannte das Licht Tag und die Finsternis nannte er Nacht“*, um auch dem Namen nach Tag und Nacht zu unterscheiden. Wir sehen also, wie augenscheinlich der Aufgang des Lichtes vor dem der Sonne den Tag erschließt: der anbrechende Tag beschließt die endende Nacht, und eine bestimmte Zeitgrenze und beschränkte Dauer des Bestehens ist der Nacht und dem Tag gesetzt. Dem Tage gibt dieSonne den Glanz, das Licht das Sein. Häufig ist der Himmel mit Wolken überzogen, so daß die Sonne verdeckt und kein Strahl derselben sichtbar ist: dennoch zeigt das Licht den Tag an und verscheucht die Finsternis.</p><p><strong>Der Tag geht der Nacht voraus. Der Tag als Zeitmaß von 24 Stunden. Sein Ende der Morgen.</strong></p><p><em>„Und es ward Abend und es ward Morgen, ein Tag“</em>. Einige werfen hier die Frage auf, warum die Schrift zuerst den Abend, dann den Morgen erwähnt? Ob sie damit nicht sichtlich die Nacht vor dem Tag bezeichnet? Sie beachten erstens nicht, daß dieselbe im vorausgehenden den Tag voranstellte, wenn sie hervorhebt: „Und Gott nannte das Licht Tag und die Finsternis nannte er Nacht“; ferner nicht, daß der Abend das Ende des Tages und der Morgen das Ende der Nacht ist. Um also dem Tage sein Vorrecht und seinen Vorrang in der Entstehung einzuräumen, nannte sie zuvor das Ende des Tages, auf welchen die Nacht folgen sollte. Dann erst hernach nannte sie beifügend das Ende der Nacht. Undenkbar aber konnte die Schrift der Nacht so den Vorrang vor dem Tage einräumen, daß sie sowohl die Tag- wie Nachtzeit mit der Bezeichnung „Tag“ zusammenfaßte und für die Wahl der letzteren der vorzüglichere Name entscheidend war. Daß auch dies Gepflogenheit der Schrift ist, den Namen auf das Hauptsächlichere zu übertragen, können wir mit zahlreichen Beispielen belegen. So sprach auch Jakob: „Die Tage meines Lebens sind kurz und schlimm“. Und wiederum: „Alle Tage meines Lebens“. Auch David gebraucht die Wendung: „Die Tage meiner Jahre“; er nannte nicht auch die Nächte. Daraus ersehen wir, daß jene Gepflogenheiten, die heute als geschichtliche Tatsachen vorgetragen werden, eine ständige Regel für die Zukunft begründet haben. ― Der Anfang des Tages geht sonach auf Gottes Wort zurück: „Es werde Licht. Und es ward Licht.“ Das Ende des Tages ist der Abend. Unmittelbar auf das Ende der Nacht folgt der nächste Tag. Gottes Ausspruch aber ist klar: er nannte an erster Stelle „das Licht Tag“ und erst an zweiter „nannte er die Finsternis Nacht“.</p><p>Recht auffallend heißt es auch: „<em>ein</em> Tag“, nicht der „erste Tag“. Es hätte ja (Moses), nachdem ein zweiter und dritter Tag und der Reihe nach die übrigen folgten, „erster“ sagen können ― die Aufzählung schien dies sogar zu verlangen ―; indes wollte er zur Regel machen, daß die vierundzwanzig Stunden des Tages und der Nacht bloß mit dem Namen „Tag“ bezeichnet würden. Er wollte gleichsam sagen: „Vierundzwanzig Stunden sind das Zeitmaß des Tages“. Wie der Stammbaum der Männer zugleich für den der Frauen zählt und gilt, indem das Sekundäre mit dem Primären in eins zusammengefaßt wird, so zählt man auch nur die Tage und läßt die Nächte miteinbegriffen sein. Wie es also nur einen Umlauf gibt, so nur einen Tag. Bezeichnen doch manche eine ganze Woche als <em>einen</em> Tag, insofern sie in sich wie in einen einzigen Tag zurückkehrt, und zwar siebenmal in sich zurückläuft. „Das ist aber das Bild des Kreises: von sich ausgehen und in sich zurückkehren“. Darum spricht auch die Schrift da und dort nur von einer Weltzeit ― denn gebraucht sie auch an anderen Stellen „Welt“ in der Mehrzahl, so scheint sie damit mehr die verschiedenen öffentlichen Stände und Ämter zu bezeichnen, als bestimmte sich abfolgende Weltzeiten zu nennen ―: „Groß ist der Tag des Herrn und herrlich“; und an einer anderen Stelle: „Was fällt euch ein, nach dem Tag des Herrn zu verlangen?“ Auch da gibt es Finsternis, nicht bloß Licht; denn es ist klar, daß für Leute mit schlechtem Gewissen und für Unwürdige jener Tag voll Finsternis ist. Die Unschuld wird an ihm leuchten, der straffällige Geist Qual erleiden. Im übrigen lehrt uns die Schrift, daß jener unvergängliche Tag der ewigen Vergeltung ohne nächtliche Unterbrechung und wiederkehrende Finsternis fortdauern wird.</p><p>Sinnig aber ließ (Moses), nachdem er einmal die beiden wechselnden Zeiten als <em>einen</em> Tag bezeichnen wollte, letzteren mit dem Morgen bechließen, um zu zeigen, wie der Tag mit Licht anfängt und in Licht endigt; denn erst mit dem Ende ist die volle Frist des Tages und der Nacht gegeben. ― So laßt denn auch uns stets „wie am Tage ehrbar wandeln“ und „ablegen die Werke der Finsternis!“ Zur leiblichen Ruhe, wie wir wissen, ist die Nacht gegeben, nicht zur Verrichtung eines Geschäftes oder Werkes: in Schlaf und Vergessen bringt man sie zu. Fern sei von uns Schmauserei und Trunkenheit, Beilager und Unzucht! Sprechen wir nicht: „Die Finsternis und die Wände decken uns“, und wer weiß, ob des Höchsten Auge es gewahren wird? Nein, Liebe zum Lichte und Streben nach Ehrbarkeit bleibe in uns! Am Tage wandelnd laßt uns trachten, daß unsere Werke leuchten vor Gott, dem Ehre, Lob, Ruhm und Macht ist mit unserem Herrn Jesus Christus und dem Heiligen Geiste von Ewigkeit und jetzt und immerdar und in alle Ewigkeiten. Amen.</p><h2>2</h2><p><strong>Die Schöpfung kraft des göttlichen Willens ein einheitlicher Organismus. Der Schöpfer der Materie ihr Bildner. Maßstab für die Beurteilung der Schöpfung ist nicht sophistische Scheinwahrheit, sondern die Regel der Schriftwahrheit: nicht Menschenauge, sondern Gottesauge.</strong></p><p>Den ersten oder vielmehr „<em>einen</em> Tag“ ― die Prärogative der prophetischen Bezeichnung soll ihm gewahrt bleiben ― haben wir, so gut wir’s konnten, erledigt. An ihm ward, wie wir gesehen haben, durch die Schöpfungstat des allmächtigen Gottes und des Herrn Jesus Christus sowie des Heiligen Geistes der Himmel gegründet, die Erde erschaffen, darüber die Fülle des Wassers und die Luft ringsum ausgegossen, die Ausscheidung des Lichtes und der Finsternis vollzogen. Wer nun sollte sich nicht wundern, wie die infolge der ungleichen Bestandteile ungleichartige Welt zu einem einheitlichen Organismus erstehen und so Verschiedenartiges kraft eines unlöslichen Gesetzes der Eintracht und Liebe zu einem festen Verbande und Gefüge gegenseitig sich zusammenschließen konnte, so daß Dinge von ganz verschiedener Natur, als gehörten sie unzertrennlich zusammen, zu einem Bund der Eintracht und des Friedens verknüpft sind? Oder wer hättte angesichts derselben mit seiner schwachen Vernunfterkenntnis solches auch nur für möglich gehalten? Und doch hat die dem Menschengeiste unfaßbare und für unser Menschenwort unaussprechliche göttliche Macht dies alles kraft ihres Willens zusammengeordnet.</p><p>Gott nun hat den Himmel und die Erde geschaffen und als Urheber mit seinem Befehlswort ins Dasein gerufen: nicht Bildner ihrer Form, sondern Schöpfer ihrer Natur. Wie könnten denn auch die unveränderliche schöpferische Kraft Gottes und die veränderliche Natur der Materie ineinander wirken, gleichsam voneinander entlehnend, was ihnen gebricht? Denn ist die Materie unerschaffen, hat folgerichtig Gott in sichtlicher Ermangelung der Schöpfergewalt über die Materie von dieser das Substrat für sein Schaffen entlehnt. War sie aber ungestaltet, ist es mehr als wunderlich, daß die mit Gott gleichewige Materie sich nicht selbst die Ausstattung geben konnte, nachdem sie ihre Substanz nicht von einem Schöpfer empfing, sondern in zeitloser Dauer selbst besaß. Der Schöpfer des Alls hatte darnach mehr vorgefunden denn verliehen: vorgefunden die Materie, um an sie Hand anlegen zu können, verliehen aber die Form, die den vorgefundenen Dingen Schönheit geben sollte.</p><p>Der „<em>eine</em> Tag“ ist nun als solcher von den übrigen auszunehmen und nicht als „erster Tag“ mit den übrigen auf gleiche Stufe zu stellen; denn an ihm wurden die Grundfesten aller Dinge gelegt und nahmen jene Ursachen ihren Anfang, auf welchen der Bestand dieser Welt und der ganzen sichtbaren Schöpfung beruht. ― So mag denn unser Vortrag an die Wunderwerke des zweiten Tages herantreten, deren Großartigkeit nicht nach unserem Darstellungsvermögen, sondern nach der Schrift zu Gottes Preis zu beurteilen ist.</p><p>Euch nun bitte ich, das, was wir glaubhaft aussprechen, gütigst im natürlichen Sinn verstehen und mit Herzenseinfalt und geistigem Interesse überdenken zu wollen, nicht nach Maßgabe philosophischer Schulmeinungen und „eitlen Trugs“, die mit ihren Schlüssen nur den Schein des Wahren wecken, sondern nach Maßgabe der Wahrheitsregel, die in den Aussprüchen des Gotteswortes vorliegt und mit der Betrachtung ihrer so wunderbaren Erhabenheit den Herzen der Gläubigen sich einsenkt. Denn so steht geschrieben: „Befestige mich in Deinen Worten!“ „Die Ungerechten erzählten mir ihre Gepflogenheiten, aber nicht wie Dein Gesetz, o Herr: nur Deine Gebote alle sind Wahrheit“. Also nicht die Natur der Dinge selbst, sondern Christus, der in der Überfülle seiner Gottheit alles, was er wollte, geschaffen, soll uns maßgebend sein für die Beurteilung der Geschöpfe und die Frage, was die natürliche Kraft zu leisten vermag. So fragte, als er im Evangelium einen Aussätzigen heilte und Blinden das Augenlicht wiederschenkte, das Volk, das zugegen war und es sah, nicht lange nach den Regeln der Heilkunst, sondern bewunderte die Macht des Herrn und „lobte Gott“, wie geschrieben steht. Auch den Moses bestimmten nicht die Zahlenkünste der Ägypter oder die Konstellation der Gestirne oder die Bemessungen der Elemente, daß er seine Hand ausstreckte, das Rote Meer zu teilen, sondern der Gehorsam gegen den göttlichen Machtbefehl. Darum bekennt er selbst: „Deine Rechte, Herr, ward verherrlicht in Macht; Deine Rechte, Herr, schlug nieder die Feinde“. Dorthin, heiliges Volk, erhebe also deinen Geist, dahin lenke all’ deinen Sinn! Nicht so wie des Menschen Auge sieht Gottes Auge. Gott sieht ins Herz, der Mensch ins Gesicht. Und nicht so wie Gottes Auge sieht sonach des Menschen Auge. Du vernimmst, wie Gott sah und guthieß: So miß denn die geschaffenen Dinge nicht nach deinem Augenmaß und beurteile sie nicht nach deinem Dafürhalten, glaube vielmehr, was Gott sah und guthieß, nicht nachprüfen zu sollen.</p><p><strong>Die “Veste inmitten des Wassers” von Gott gefestigt. Die Existenz nicht einer Einzahl, auch nicht einer Unzahl, sondern einer Mehrzahl von Himmeln. Die Sphärenmusik eine Fiktion der Philosophie.</strong></p><p>* „Und es sprach Gott: Es werde eine Veste inmitten des Wassers, und sie sei die Scheide zwischen dem Wasser. Und es ward also“*. Vernimm die Worte Gottes! „Es werde“, spricht er. Es ist die Sprache eines Befehlenden, nicht eines Abwägenden. Er gebietet der Natur, folgt nicht ihrer Kraft, berechnet nicht ihre Größe, wägt nicht ihr Gewicht: Sein Wille ist der Dinge Maß, sein Wort des Werkes Vollbringung. ― „Es werde“, spricht er, „eine Veste inmitten des Wassers.“ Fest ist alles, dem Gott Bestand gibt. Und vollends zutreffend ließ er das „Es werde eine Veste“ dem folgenden Zusatz „inmitten des Wassers“ vorausgehen. Man sollte erst an die Erschaffung des Firmamentes kraft göttlichen Befehles glauben, bevor man über die Flüssigkeitsqualität des Wassers hinterdenklich würde. Faßt man nun die Natur der Elemente ins Auge: wie ließ sich „zwischen den Wassern“ eine Veste gründen? Jene sind doch flüssiger, diese fester Art; jene in Bewegung, diese in Ruhe. „Und sie sei Scheide zwischen den Wassern“, spricht er. Doch das Wasser liebt Vermischung, nicht Scheidung: wie kann er etwas anbefehlen, von dem er weiß, daß es nach der Eigenart der Elemente einen Widerspruch in sich schließt? Doch da sein Wort der Ursprung der Natur ist, hält er sich mit Recht befugt, der Natur Gesetze zu geben, nachdem er ihr auch den Ursprung gegeben hat.</p><p>Doch erst wollen wir erwägen, was das Firmament ist? Ob es identisch ist mit dem, was er im vorausgehenden „Himmel“ genannt hat, oder etwas anderes? Und ob es zwei oder mehrere Himmel gibt? Einige behaupten nämlich, es gebe nur <em>einen</em> Himmel; für einen zweiten Himmel habe, nachdem es auch nach ihrer Meinung nur <em>eine</em> Hyle gibt, der Grundstoff unmöglich ausgereicht. Nachdem nämlich diese für den ersten Himmel vollständig aufgebraucht wurde, erübrigte nichts mehr für den Aufbau eines zweiten oder dritten Himmels. Andere dagegen nehmen unzählige Himmel und Welten an, ernten aber aus den eigenen Reihen Spott damit ― sie liegen nämlich mit uns nicht in größerem Streit als mit ihresgleichen ―; letztere erbieten sich nämlich, mit mathematischen Zahlen und zwingenden Gründen den Nachweis zu erbringen, daß es einen weiteren Himmel nicht geben könne. Weder vertrage sich ein zweiter oder dritter Himmel mit der Natur, noch reiche die Kraft des Schöpfers zur Erschaffung eine Vielheit von Himmeln aus. Und doch, wer müßte nicht über dieses ihr künstliches Phrasentum lachen? Vom Menschen leugnen sie nicht, daß er aus ein und demselben Stoff eine Mehrzahl von gleichartigen Dingen herstellen kann, vom Schöpfer des Alls bezweifeln sie, ob er mehrere Himmel zu schaffen imstande war, da doch von ihm geschrieben steht: „Der Herr aber schuf die Himmel“; und an einer anderen Stelle: „Alles, was er wollte, schuf er“. Was auch könnte für den zu schwer sein, für den Wollen Vollbringen ist? So zerrinnt ihnen denn bei ihren Sophistereien über Gott jeder Grund für ein Unmöglich; denn auf ihn geht in Wahrheit das Wort: „Dir ist nichts unmöglich“.</p><p>Wir können sonach die Existenz nicht bloß eines zweiten, sondern auch eines dritten Himmels nicht in Abrede stellen, nachdem doch auch der Apostel nach Ausweis seiner Schriften versichert, in den dritten Himmel entrückt worden zu sein. Auch David führt „die Himmel der Himmel“ im Chor der gottlobenden Wesen auf. Ihn nachäffend brachten die Philosophen die Idee einer harmonisch erklingenden Bewegung von fünf Sternen (Planeten) sowie des Mond- und Sonnenballes auf, mit deren Sphären oder besser Bällen das Universum in enger Beziehung stehen soll. Diesem, wie sie glauben, eingefügt und gleichsam eingegliedert, seien sie in rückläufiger Bewegung begriffen und erlitten wegen ihrer Gegenbewegung zu den übrigen (Himmelskörpern) einen Zusammenstoß. Durch diesen Anprall nun sowie durch die Bewegung der Sphären selbst entstehe ein süßes Tönen voll Lieblichkeit und Kunstmäßigkeit und entzückendem Wohlklang. Bei ihrer gewaltsamen Teilung löse nämlich die Luft infolge einer kunstgerechten Bewegung, welche die hohen und tiefen Töne melodisch ausgleiche, mannigfache Harmonien voll Ebenmaß aus, so daß sie jegliche Lieblichkeit musikalischen Sanges überböten.</p><p>Fragt man nach der Glaubwürdigkeit dessen und verlangt man, sie möchten unsere Sinne, unser Gehör hiervon sich überzeugen lassen, sind sie verlegen. Wäre nämlich dem wirklich so, wie könnte es unserem Gehör, das selbst leisere Töne zu vernehmen pflegt, entgehen, wenn die Himmelskörper mit so gewaltigem Anprall aufeinanderplatzen? Wenn dort die Himmelssphäre, an welche man den Lauf der unaufhörlich rotierenden Sterne gebunden hält, eine von größeren Erschütterungen begleitete Umdrehung macht und akutes Getöse auslöst, hier ebenso gewaltiges der Mond? Wenn wir also darauf bestehen, daß wir von der Glaubwürdigkeit ihrer Behauptungen uns selbst durch unseren Gehörsinn überzeugen möchten, schützen sie vor, es seien unsere Ohren taub, es sei uns das Gehör abgestumpft geworden, weil wir vom ersten Augenblick unserer Geburt an das Getöse gewohnt seien; und sie verweisen auf das Beispiel, wonach der Nil, der größte der Ströme, gerade dort, wo er in Katarakten von gewaltigen Bergeshöhen niederstürzt, mit seinem mächtigen Getöse die Ohren der Anwohner so betäube, daß ihnen das Hören vergehen soll. Doch die Wirklichkeit selbst gibt ihnen die leichte Antwort. Denn wenn wir den Donner vernehmen, der durch den Zusammenstoß der Wolken erzeugt wird, sollten wir die Rotationen so gewaltiger Himmelskörper nicht vernehmen, die doch ein um so mächtigeres Getöse erzeugen müßten, je größer die Geschwindigkeit ist, mit der sie angeblich aufeinanderstoßen? Sie fügen außerdem noch bei, daß dieses Tönen deshalb nicht zur Erde dringe, damit die Menschen nicht, entzückt von der Lieblichkeit und dem Wohlklang, den jene rasche Bewegung der Himmelskörper auslöst, vom Aufgang bis zum Niedergang ihre Beschäftigungen und Arbeiten verließen und alles dahier infolge einer Art Verzückung des menschlichen Geistes in die himmlichen Töne müßig liegen bleibe. Doch überlassen wir das, was unserem Interessenkreis und dem Texte der göttlichen Lesung gleich fernliegt, „denen, die draußen sind“. Wir unserseits wollen uns an die Lehren der himmlischen Schriften halten.</p><p><strong>“Das Wasser über der Himmelsveste”: seine Möglichkeit, Wirklichkeit, Zweckmäßigkeit. Feuer und Wasser paralysieren gegenseitig ihre verheerenden Wirkungen. Der Sternenhimmel eine glühende Feuerzone, die Sonne ein Feuerball.</strong></p><p>Unser Thema ist Gottes Ausspruch: „Es werde eine Veste inmitten des Wassers, und sie sei Scheide zwischen dem Wasser“; und zwar handelt es sich um die Frage, ob er „Firmament“ das nennt, was er bereits geschaffen, worauf also das Schriftwort sich bezieht: „Im Anfang hat Gott den Himmel und die Erde geschaffen“. Es entgeht (mir) nicht, daß einige vor uns die Stelle dahin verstanden, daß die Schrift, weil sie im vorausgehenden die Erschaffung und Festigung des Himmels durch den Schöpfer-Gott konstatiert habe, hier nur eine nähere Erklärung über das Schöpfungswerk gebe: dort habe sie eine kurze summarische Zusammenfassung des Schöpfungsinhaltes gegeben, hier eine genauere Ausführung über das Wie des Schöpfungsaktes auf Grund der spezifischen Beschaffenheit der gleichzeitig ins Dasein tretenden Dinge geboten. Doch hiergegen muß es unser Bedenken erregen, daß eine andere Namensbezeichnung („Firmament“) gewählt, die festere Art („Veste“) und der wirkursächliche Charakter („sie sei Scheide“) unterschieden und in Verbindung damit die Person des Mitwirkenden (Gott) genannt wird; denn so steht geschrieben: „Und es machte Gott eine Scheide mitten zwischen dem Wasser, das unter der Veste war, und mitten zwischen dem Wasser, das über der Veste war“.</p><p>Zunächst nun wollen sie mit jener Auffassung, die sich mit der häufigen Schriftlesung unserem Geiste eingebürgert und eingeprägt hat, aufräumen: es könne über den Himmeln keine Wasser geben; denn die Himmelskugel, in deren Mitte die Erde schwebe, sei rund, und an ihrer Peripherie könne sich unmöglich Wasser halten; es müsse notwendig abfließen und herabrinnen, indem es seinen Lauf von oben nach unten nehme. Denn wie könnte es, sagen sie, stehendes Wasser über einer Kugel geben, wenn die Kugel sich dreht? Das ist die berüchtigte Kniffigkeit der Sophistik. Gib mir Gelegenheit, dir zu antworten! Wird sie verweigert, braucht kein weiteres Wort verschwendet werden. Sie verlangen, man solle ihnen zugeben, die Himmelsachse sei in starker Bewegung begriffen, die Erdkugel hingegen unbeweglich; sie wollen damit beweisen, es könne keine Wasser über den Himmeln geben, weil die Himmelsachse sie samt und sonders wegschleudere: als ob sie, um ihrem Verlangen stattzugeben und bei der Antwort auf ihre Ansichten einzugehen, leugnen könnten, daß es bei jener Höhe und Tiefe (des Himmels) doch auch eine Länge und Breite geben müsse, die nur derjenige voll zu ermessen vermag, der nach des Apostels Wort voll bis zur ganzen Fülle der Gottheit erfüllt ist! Wer (sonst) denn wird so leicht Gottes Schöpfung ausmessen können? Es gibt sonach in der Höhe des Himmels eine Ausdehnung nach der Breite. So gibt es ja auch, um von Dingen zu reden, die unserem Wissen zugänglich sind, so manche Gebäude, die außen rund, innen viereckig, oder aber außen viereckig und innen rund sind, während sie in der Höhe abgeflacht sind, so daß darauf gern stehendes Wasser sich befindet. Wir führen das jedoch nur deshalb an, damit sie einsehen möchten, wie ihre Hypothesen durch noch wahrscheinlichere sich widerlegen lassen, und daß sie davon abstehen möchten, Gottes so großartiges Schöpfungswerk unter dem Gesichtspunkt menschlichen Tuns und unserer Leistungsfähigkeit zu bemessen.</p><p>Wir aber halten uns an den Text und die Anordnung der Schrift und richten bei der Beurteilung des Schöpfungswerkes den Blick auf den Schöpfer. Was ward gesprochen? Wer hat gesprochen? Zu wem hat er gesprochen? „Es werde eine Veste inmitten des Wassers, und sie sei Scheide zwischen den Wassern.“ Ich höre, wie auf sein Geheiß eine Veste wurde, durch welche das Wasser geschieden und das obere vom unteren getrennt werden sollte. Gibt es etwas Klareres als das? Und er, der auf sein Geheiß das Wasser schied, indem er dazwischen und mittenhinein eine Veste schuf, sorgte auch vor, wie es nach der Scheidung und Absonderung beharren könne. Das Wort Gottes gibt der Natur ihre Kraft und der Substanz ihre Dauerhaftigkeit, solange er, der ihr den Bestand gab, sie fortdauern lassen will; denn so steht geschrieben: „Er stellte sie hin auf ewig und für alle Ewigkeit; ein Gesetz stellte er auf, und es wird nicht vergehen“. Und damit du dich überzeugest, daß diese Worte eben von jenen Wassern gesprochen wurden, deren Vorhandensein über dem Himmel dir unmöglich dünkt, so höre die vorausgehenden: „Lobet ihn, ihr Himmel der Himmel! Und die Wasser, die über den Himmeln sind, sollen loben den Namen des Herrn“. Galt nicht dir, dem Leugner, die weitere Beteuerung: „Denn <em>er</em> sprach, und sie waren da, <em>er</em> gebot, und sie waren geschaffen: Er stellte sie hin auf ewig und für alle Ewigkeit; ein Gesetz stellte er auf, und es wird nicht vergehen“. Oder dünkt dir der Schöpfer nicht mächtig genug, um seiner Schöpfung ein Gesetz zu geben? Gott ist’s, der da spricht, verehrungswürdig seiner Natur nach, unermeßlich an Größe, unendlich in seinen Vergeltungen, unbegreiflich in seinen Werken. Wer vermag die Tiefe seiner Weisheit zu ergründen? Doch er spricht es zum Sohne, d. i. seinem Arme, er spricht es zu seiner Kraft, er spricht es zu seiner Weisheit, er spricht es zu seiner Gerechtigkeit. Und es schafft der Sohn als der Mächtige, er schafft als die Kraft Gottes, er schafft als die Weisheit Gottes, er schafft als Gottes Gerechtigkeit. Wenn du dies hörst, wie willst du dich wundern, wenn über der Himmelsveste durch die Schöpferhand der so unendlichen Majestät Wasserflut sich festigen ließ?</p><p>Noch aus anderen Tatsachen mögt ihr das folgern, aus solchen, welche in den Gesichtskreis des menschlichen Auges fallen. Wie konnte sich, wenn du die Vernunft fragst, beim Durchzug der Juden die Flut teilen? Es liegt das nicht im gewöhnlichen Lauf der Natur, daß das Wasser sich teilt und Wasser, die in der Tiefe strömen, durch eine dazwischen führende Festlandsschicht sich trennen lassen. „Es stockten die Fluten“, heißt es, und setzten wie eine Feste ihrem Wogengang ein ungewohntes Ende. Hätte etwa Gott das Hebräervolk nicht auch anders befreien können? Doch er wollte dir zeigen, wie du dich durch ein solches Schauspiel zum Glauben dessen, was sich deinem Auge entzieht, bestimmen lassen solltest. Auch der Jordan kehrte, indem seine Strömung zurückgestaut ward, zu seiner Quelle zurück. Daß Wasser, während es noch dahingleitet, stillsteht, gilt für etwas Ungewöhnliches, daß es ohne jegliches Stauwerk den Lauf aufwärts nimmt, für eine Unmöglichkeit. Doch was wäre dem unmöglich, der den Schwachen das Vermögen gibt, so daß ein solcher Schwacher bekennt: „Ich vermag alles in dem, der mich stärkt“. Mögen doch jene sagen, wie „Luft zu Gewölk sich verdichtet?“ Ob der Regen aus den Wolken entsteht oder im Schoß der Wolken sich ansammelt? Wir sehen so häufig die Wolken von den Bergen niederwallen. Ich frage: steigt das Wasser von der Erde auf oder strömt das über den Himmeln befindliche in reichlichem Regen nieder. Steigt es auf, ist’s doch wider die Natur, wenn es als das schwerere Element emporsteigt und von der Luft, dem leichteren Element, getragen wird. Oder wird das Wasser von der Bewegung der ganzen rasch rotierenden Himmelskugel mitgerissen, so wird es, wie es von der Tiefe mitemporgerissen wird, ebenso von der Kugelhöhe fort herabgeschleudert. Wird es, wie jene wollen, unaufhörlich herabgeschleudert, so wird es auch unaufhörlich mitemporgerissen; denn wenn die Himmelsachse sich immerfort dreht, wird auch das Wasser immerfort absorbiert. Strömt es herab, muß es folgerichtig andauernd über den Himmeln vorhanden sein, wenn es von dort soll herabströmen können. Welche Schwierigkeit soll denn auch der Annahme entgegenstehen, daß über den Himmeln Wasser gefestigt wurde? Wie wollen sie denn sonst das Wort in den Mund nehmen und sagen, die Erde, die doch schwerer ist als die Luft, schwebe in der Mitte und beharre unbeweglich? Aus demselben Grund könnten sie zugeben, daß das Wasser, welches über dem Himmel vorhanden ist, durch die Umdrehung der Himmelskugel nicht herabstürze. Wie nämlich die Erde im leeren Raume schwebt und unbeweglich nach allen Seiten im Gleichgewicht beharrt, so wird auch das Wasser durch ein noch größeres oder gleiches Gewicht wie die Erde in Schwebe erhalten. Eben darum kann das Meer auch das Festland nicht überschwemmen, es müßte denn auf (Gottes) Befehl aus den Ufern treten.</p><p>Wenn ferner, was jene selbst zugeben, die von feurigen Gestirnen erstrahlende Himmelssphäre in rotierender Bewegung ist, mußte dann nicht die göttliche Vorsehung notwendig Vorsorge treffen, daß unterhalb und oberhalb derselben reichlich Wasser sich ergieße, um jene lohende Hitze oder glühende Achse zu dämpfen? Deshalb, weil übergroß und glühendheiß das Feuer ist, ist überreich auch Wasser auf Erden vorhanden, daß nicht der Brand der aufgehenden Sonne und der funkelnden Sterne sie versenge und die ungewohnte Hitzestrahlung das erste zarte Wachstum der Dinge schädige. Wie viele Quellen, Flüsse, Seen bewässern das Festland, weil im Innern Feuer es durchglüht! Wie könnten denn die Bäume knospen oder das Getreide und die Saaten hervorkeimen oder die aufgegangenen reifen, wenn nicht Feuer auch im Innern sie belebend erwärmte? Auch aus Gestein läßt es sich häufig schlagen, und selbst aus Holz züngelt es oft beim Spalten hervor.</p><p>Wie nun das erschaffene Feuer zum Fortbestand der planmäßigen Ordnung der Dinge und zur Temperierung des eiskalten Wassers durch einen milden (Luft-) Himmel notwendig ist, so ist auch die überreichliche Menge des Wassers nicht umsonst: es soll das eine Element vom andern nicht aufgezehrt werden. Dann wären beide nicht in erforderlichem Maße vorhanden, würde ebenso das Wasser das Feuer auslöschen, wie das Feuer das Wasser auftrocknen. Nach Gewicht und Maß hat darum der Schöpfer alles abgewogen. Selbst die Zahl der Regentropfen ist ihm bekannt, wie wir es im Buche Job lesen. Er wußte, wie leicht die Dinge ihrem Ende, das Universum seiner Auflösung anheimfiele, würde ein Element im Vergleich zum anderen zu reichlich vorhanden sein. Darum ließ er eine Verminderung beider nur in der Einschränkung zu, daß das Feuer nicht zuviel absorbiere, das Wasser nicht zuviel überfließe: beide sollten soweit verringert werden, daß einerseits der Überfluß beseitigt würde, andrerseits das notwendige Maß erhalten bliebe. So große, zu übergewaltigen Strömen anschwellende Flutmassen brechen doch aus der Erde hervor: der Nil, der austretend Ägypten überschwemmt; die Donau, die vom Westen her die Scheide zwischen den Barbarenstämmen und Roms Völkern bildet, bis das Schwarze Meer sie aufnimmt; der Rhein, der seinen Lauf von der Kammhöhe der Alpen zu den Tiefen des Ozeans nimmt, der berühmte Schutzwall des römischen Reiches gegen die wilden Völkerstämme; der Po, die sichere Einfuhrstraße für die Seehandelsprodukte zur Versorgung Italiens: die Rhone teilt, mit raschem Lauf daherstürmend, die Flut des Tyrrhenischen Meeres, und keine geringe Gefahr entsteht den Schiffen aus dem Ringen der Meereswogen und des Flusses Strömung; desgleichen ergießt sich von Mitternacht her, dem Kaukasusgebirge entspringend, der Phasis mit mehreren anderen Flüssen ins Schwarze Meer ― es würde zu weit führen, den einzelnen Flüssen namentlich nachzugehen, die teils unserem Meere zueilen, teils vom Ozean verschlungen werden ―: so groß doch (sage ich) ist die Fülle des Wassers, und dennoch wird die Erde in der Mittagsgegend so häufig von versengender Wärme ausgebrannt und zerstäubt vor Hitze, und zunichte ist des bedauernswerten Landmannes Arbeit, so daß ihm oft, wenn die Brunnen bis auf den morschen Grund vertrocknen, der zum Leben notwendige Trunk fehlt. Zwar wird der Zeitpunkt erst kommen, da der Herr zur Tiefe sprechen wird: „Zur Wüste werde und deine Ströme trockne ich aus“, wie er es durch Isaias [Jesaja] für die Zukunft angekündigt hat: aber auch schon bevor jener von Gottes Willen frei vorausbestimmte Tag kommen wird, liegt die Natur der Elemente in nicht geringem Kampfe unter sich. Häufig wird daher diese Welt entweder von Überschwemmungen betroffen oder von übergroßer Hitze und Dürre heimgesucht.</p><p>So halte denn das Vorhandensein einer großen Wassermenge nicht für unglaubhaft, bedenke vielmehr die gewaltige Hitze, und du wirst nicht mehr ungläubig sein! Viel ist es, was das Feuer auftrocknet. Das muß uns wenigstens aus folgenden Experimenten klar werden: Wenn ein Arzt ein Glas mit enger Mündung, flachem Rande und hohlem Raume mit einem schwachen Lampenlicht darunter an einen Leib drückt, wie zieht da die Wärme alle Feuchtigkeit an sich! Wer könnte also zweifeln, daß jener feurige, von großer Hitze erglühende Äther, würde er nicht durch ein Gesetz seines Schöpfers daran verhindert, alles in Brand und Asche legen würde, so daß weder Flüsse noch Seen noch selbst die Meere seine Glut löschen könnten? Eben darum strömt so häufig wie auf einen Anprall hin Wasser von der Höhe und ergießt sich in so gewaltigen Regengüssen, daß mit einem Mal Flüsse und Seen sich füllen, selbst die Meere austreten. Deshalb sehen wir häufig auch die Sonne von Feuchtigkeit und Dunst umflort. Sie verrät damit deutlich, wie sie sich des Wasserelementes zu ihrer Abkühlung bedient.</p><p>Eine so leidenschaftliche Sucht zur Bekämpfung der Wahrheit aber steckt in jenen, daß sie der Sonne selbst den natürlichen Hitzezustand absprechen, deshalb weil sie weiß und nicht nach Art des Feuers rot oder rötlich sei. Sie sei, behaupten sie darum, überhaupt von Natur nicht feurig, und wenn sie etwas Wärmegehalt besitze, so sei dies, wie sie meinen, eine zufällige Wirkung aus der übergroßen Drehungsbewegung. Sie glauben dies deshalb behaupten zu sollen, damit es nicht scheine, als absorbiere sie irgendwelche Feuchtigkeit, nachdem sie eine natürliche Wärme nicht besitze, durch welche die Feuchtigkeit verringert oder so manches Mal aufgezehrt werde. Doch sie erreichen nichts mit ihrer Finte, weil es gleichgültig ist, ob ein Ding von Natur oder durch äußere Einwirkung oder sonst aus einem Grund Wärme besitzt; denn jedes Feuer zehrt Feuchtigkeit oder ähnlichen derartigen Stoff, den Feuer zu verbrennen pflegt, auf. Mag man mit Blattwerk das Feuer auffangen, das man nicht einmal aus halbverbrannten, sondern nur aneinandergestoßenen Holzklötzen schlägt: es lodert die Flamme auf, als würde man eine Fackel am Feuer anzünden. Oder mag man das Licht an einer Flamme anfachen: die Art und Natur des Lichtes ist die gleiche, als hätte nicht natürliches Feuer es entfacht, sondern eine zufällige Ursache es erzeugt. Man sollte doch wenigstens von dem Gesichtspunkt aus die Sonnenwärme ins Auge fassen, daß Gott ihr deshalb auf ihrem Lauf verschiedene Standorte und Zeiten festgesetzt hat, damit sie nicht, wenn sie stets an den gleichen Orten verweilte, dieselben durch ihre tägliche Hitzeausstrahlung versenge. Vom Meere geben sie selbst zu, es habe deshalb salzhaltiges und bitteres Wasser, weil das Flußwasser, das in seine Becken einmünde, durch die Wärme absorbiert werde. Und zwar werde soviel durch die Wärme tagüber absorbiert, als Tag für Tag durch der Ströme Lauf von verschiedenen Seiten her zugeführt werde. Man führt den Grund hiervon auf eine unterschiedliche Wirkung der Sonne zurück, die was klar und leicht ist an sich zieht, was schwer und erdenhaft ist zurückläßt. Aus letzterem Grund bleibt nun das Salzhaltige und Trockene zurück.</p><p><strong>Die lateinische (caelum) und griechische (ouranos) Bezeichnung für Himmel. Der “verschlossene” bezw. “eiserne” Himmel der Hl. Schrift. Allegorische Deutungen des Himmels, des Firmamentes, der Wasser über dem Himmel: der Literalsinn ist vorzuziehen.</strong></p><p>Doch kehren wir zum Thema zurück: „Es werde eine Veste inmitten des Wassers“. Man nehme, wie ich schon betonte, keinen Anstoß, wenn er (Moses) vorher den Ausdruck „Himmel“ gebrauchte, hier die Bezeichnung „Firmament“; denn auch David spricht: „Die Himmel erzählen die Herrlichkeit Gottes und die Werke seiner Hände verkündet das Firmament“, das heißt: Die Weltschöpfung lobt, wenn man sie schaut, ihren Meister, weil dessen unsichtbare Größe durch das Sichtbare erkennbar wird. Und zwar dünkt mir der Name „Himmel“ ein Allgemeinbegriff zu sein, weil es nach dem Zeugnisse der Schrift sehr viele Himmel gibt; der Name „Firmament“ hingegen ein besonderer, zumal es auch an unserer Stelle so heißt: „Und er nannte die Veste (Firmament) Himmel“. Sonach sprach er augenscheinlich im vorausgehenden nur allgemein die Erschaffung des Himmels im Anfang aus, um damit den Gesamtkomplex der Himmelsschöpfung zusammenzufassen, an unserer Stelle hingegen die besondere Festigkeit dieses nach außen sichtbaren Firmamentes, das eben darum Himmelsveste heißt, wie wir’s in des Propheten Lobgesang lesen: „Gepriesen bist Du in der Veste des Himmels“. Der Himmel, griechisch * οὐρανός* [ouranos], heißt lateinisch „der Geprägte“, weil er der Gestirne Leuchten gleich Münzzeichen aufgeprägt trägt; so nennen wir auch eine Sibermünze mit erhabenen Charakteren „geprägt“. <em>Οὐρανός</em> [Ouranos] hingegen heißt er von * ὁρᾶσθαι* [horasthai] (gesehen werden), weil er sichtbar ist. Im Gegensatz also zur Erde, die dunkler ist, wird er <em>οὐρανός</em> [ouranos] genannt, der „Sichtbare“, insofern er hell erstrahlt. Daher auch, wie ich glaube, jener Ausspruch: „Die Vögel des Himmels sehen immerdar das Angesicht meines Vaters, der im Himmel ist“, sowie (der Ausspruch) von den „Vögeln im Umkreise der Himmelsveste“. Die (Engels-) Mächte nämlich, die an jenem sichtbaren Orte weilen, schauen dies alles und sehen es unter sich vor ihren Blicken ausgebreitet.</p><p>Von einem „verschlossenen“ Himmel ist sodann die Rede in den Zeiten des Elias, als in Achab und Jezabel die Gottlosigkeit das Szepter führte, während das Volk dem frevlen Treiben des Königs willfahrte: niemand nämlich richtete seine Augen gen Himmel, niemand verehrte den Schöpfer desselben, sie beteten vielmehr Holz- und Steingebilde an. Woraus nun schließen wir dies? Weil Gott auch beim Fluche über das Volk Israel, als das Judenvolk zur Buße für seine Gottlosigkeit mit der Ungunst des Himmels und der Unfruchtbarkeit der Erde bestraft wurde, die Wendung gebrauchte: „Der Himmel über deinem Haupte soll dir Erz sein und dein Land Eisen“. Im Himmel nämlich hat die Fruchtbarkeit ihren Grund. So erflehte auch Moses in seinen Segensgebeten dem Stamme Joseph als Gabe jene „von den Enden des Himmels und vom Tau der Bronnen unten in der Tiefe und nach der Jahreszeit von der Sonne Lauf und den einfallenden Monden und vom Gipfel der Berge und der ewigen Hügel“. Denn aus der Milde des Himmels schöpft die Fruchtbarkeit der Erde ihre Nahrung. „Eisern“ ist der Himmel, der keine Feuchtigkeit taut, wann kein Regen aus den Wolken bricht. Ein „eiserner“ Himmel ist auch die düstere Luft, die drückende und nebelige von eisengrauer Färbung, wann die Erde in den Fesseln grimmiger Kälte starrt. Da scheint dann die Regenwolke über unserem Haupte zu schweben und jeden Augenblick sich zu entladen. Gar häufig auch verdichtet sich das vor eisigem Windeswehen starrende Wasser zu Schnee, die Luft teilt sich und der Schnee wallt herab. Nicht die Himmelsveste kann sich teilen, sie müßte denn irgendwie gewaltsam geteilt werden. Darum auch die Bezeichnung „Veste“, weil sie nicht ohne Festigkeit und Widerstandskraft ist. Deshalb ferner das Schriftwort über den Donner, der mit lautem Hall erdröhnt, wenn die gewitterschwangere Luft im Wolkenschoß zu heftiger Entladung aufeinanderprallt: „Ich festige den Donner“. Nach ihrer Festigkeit ward also die Himmelsveste benannt, bezw. nach ihrer Festigung durch Gottes Kraft. So lehrt es uns auch die Schrift mit der Aufforderung: „Lobt ihn in der Veste seiner Kraft“.</p><p>Es entgeht uns nicht, daß einige „die Himmel der Himmel“ auf die ‚unsichtbaren‘ Kräfte, „Firmament“ auf die ‚wirksamen‘ bezogen haben. Darum betonen wir: wohl „loben die Himmel“ oder „erzählen sie die Herrlichkeit Gottes“, „kündet das Firmament (die Werke seiner Hände) an“ ― doch nicht als geistige Wesen, sondern als die geschöpflichen Dinge der Welt im Sinne unserer obigen Darstellung. Andere desgleichen erklärten die „Wasser über den Himmeln“ als die ‚reinigenden‘ Kräfte. Wir nehmen nur gleichsam zur Ausschmückung unserer Rede hiervon Notiz. Indes dünkt es <em>uns</em> aus dem schon genannten Grund nicht für befremdlich und ungereimt, wirkliches Wasser darunter zu verstehen. Denn auch Tau und Frost und Kälte und Hitze preisen nach des Propheten Lobgesang den Herrn; es preist ihn desgleichen die Erde. Auch die Sterne beziehen wir nicht auf die unsichtbaren Wesen, sondern auf die Wirklichkeit. Es loben selbst auch die Drachen den Herrn, insofern ihre Natur und ihr Anblick beim näheren Zusehen nicht geringe Schönheit aufweist, nicht geringe Zweckmäßigkeit verrät.</p><p><strong>Mystische Erklärungen: die Wesensgleichheit des Sohnes mit dem Vater; Gen 1,10 von der Gutheißung (Lob) der Schöpfung durch Gott, nicht von einem Mangel seiner Allwissenheit zu verstehen. Moralische Anwendungen: Gottes Urteil maßgebend für die Beurteilung der Schöpfung und des Schöpfers; Gottes Wissen und Können das menschliche in Schatten stellend.</strong></p><p><em>“Und Gott sah, daß es gut sei“</em>. Es schafft der Sohn, was der Vater will; es lobt der Vater, was der Sohn schafft. Keine Spur von einer unebenbürtigen Natur im letzteren, nachdem dessen Werk nicht unebenbürtig hinter dem des Vaters zurückbleibt. „Er sah“ ― doch nicht mit leiblichem Auge sah er hin, er gab vielmehr nur bestimmt zu verstehen, wie es der Fülle seiner Gnade angemessen war, daß mir sein Urteil hierüber bekannt würde. Wir unserseits pflegen ja auch über göttliche Dinge Erörterungen anzustellen. Und was Wunder, wenn Leute, die über den Ursprung des Schöpfers selbst Fragen aufwerfen, imstande sind, auch an der Schöpfung zu nörgeln? Sie fordern ihn vor die Schranken ihres Urteils und suchen ihn für ungleichartig und unebenbürtig zu erklären. Darum liest man sowohl: „Gott sprach“ als auch: „Gott schuf“. Mit dem gleichen Hoheitstitel werden Vater und Sohn ausgezeichnet. „Und es sah Gott, daß es gut sei.“ „Er sprach“ wie zu einem, der alles wußte, was der Vater wollte, und „er sah“ wie einer, der alles wußte, was der Sohn tat und in gemeinschaftlichem Wirken mit ihm vollführte.</p><p>„Gott sah, daß es gut sei.“ Er gelangte damit nicht etwa zur Kenntnis von etwas, was er noch nicht wußte, sondern hieß gut, worauf sein Wohlgefallen ruhte. Nicht ein unbekanntes Werk fand sein Wohlgefallen, wie auch der Vater nicht unbekannt war, der am Sohne sein Wohlgefallen hatte; denn so steht geschrieben: „Das ist mein geliebter Sohn, an dem ich Wohlgefallen habe“. Es kennt aber der Sohn immerdar den Willen des Vaters und der Vater den des Sohnes; und es hört der Sohn immerdar den Vater und der Vater den Sohn kraft der Einheit der Natur, des Willens und der Wesenheit. Bezeugt es doch der Sohn selbst in seinem Evangelium, indem er zum Vater spricht: „Ich wußte es, daß Du mich allzeit hörst“. Denn es ist der Sohn „das Bild des unsichtbaren Gottes“. Alles, was der Vater ist, prägt der Sohn als Bild aus; alles, was er ist, macht er uns als „Abglanz seiner Herrlichkeit“ klar und offenbar. Es schaut der Sohn das Wirken des Vaters, wie umgekehrt der Vater das des Sohnes. So hat es der Herr selbst erklärt: „Es kann der Sohn nichts aus sich tun, außer was er den Vater tun sieht“. Er sieht sonach den Vater wirken und sieht ihn im Verborgenen seiner unsichtbaren Natur und hört ihn desgleichen. So spricht er denn: Wie ich’s höre, so richte ich auch „und mein Gericht ist wahr; denn ich bin nicht allein, sondern ich und der Vater, der mich gesendet hat“.</p><p>Dies der mystische Sinn. Der moralische ist der: Mir zunutze „sah er“, mir zunutze „hieß er gut“. Was Gott guthieß, darfst du nicht schelten; denn du erinnerst dich der Schriftmahnung an dich: „Was Gott rein erklärt, nenn du nicht gemein“. Niemand lästere also das, was vor Gott gut ist! Und wenn schon die Himmelsveste gut ist, wieviel mehr ist ihr Schöpfer gut, wenn es auch den Arianern nicht gefällt, die Eunomianer dagegen Einspruch erheben, der entarteten Wurzel noch mindere Frucht.</p><p>[Forts. v. ] „Es sah Gott, daß es gut sei.“ Künstler pflegen erst die einzelnen Teile fertigzustellen und dann in entsprechender Zusammenstellung miteinander zu verbinden: so Meister, welche menschliche Büsten oder Gestalten aus Marmor meißeln oder aus Erz formen oder aus Wachs prägen. Sie wissen indes nicht, wie möglicherweise die einzelnen Glieder zueinander harmonieren werden, und welchen Genuß die künftige Verbindung bieten wird. Daher getrauen sie sich entweder noch gar kein Lob oder nur ein teilweises auszusprechen. Gott hingegen, der das Künftige vorausweiß, spendet als der berufene Beurteiler des Universums der in den ersten Anfängen begriffenen Schöpfung, als wäre sie schon vollendet, sein Lob, indem sein Wissen dem Schluß der Schöpfung vorauseilte. Kein Wunder. Beruht doch bei ihm die Vollendung eines Dinges nicht in einem letzten Handanlegen ans Werk, sondern in der Vorherbestimmung seines Willens. Sein Lob gilt dem Einzelnen, insofern es zum künftigen Ganzen paßt, sein Lob gilt dem Ganzen, insofern es aus prächtigen Einzelheiten sich zusammensetzt. Denn darin besteht die wahre Schönheit, daß in den einzelnen Gliedern wie im Ganzen die erforderlichen Bedingungen eingelöst sind: dem Einzelnen muß Zierlichkeit, dem Ganzen entsprechende Formvollendung nachgerühmt werden können.</p><p>Doch zum Schluß jetzt mit dem zweiten Schöpfungstag, damit wir nicht, während wir den Schöpfungsbau der Himmelsveste emporführen, die Zuhörer durch zu langes Reden mehr und mehr entkräften und der Vortrag damit, daß er sich in die Nacht hineinzieht, die noch des Mond- und Sternenlichtes entbehrt ― noch sind ja die „Leuchten am Himmel“ nicht erschaffen ―, über die Heimkehrenden Finsternis heraufführe: zugleich aber auch, damit der Leib an Speise und Trank sich labe, daß nicht das schwache Fleisch sich beschwere über das noch in die Nacht hineindauernde Fasten, während die Seele in Genüssen schwelge.</p><h2>3</h2><p><strong>Das unvernünftige Wasser Vorbild des Gehorams für den vernünftigen Menschen. Der eine Sammelort des Wassers Typus der einen Kirche; seine Sammlung von überallher Typus ihres Universalismus: die “Meere und Ströme” das gläubige Volk.</strong></p><p>Der dritte Schöpfungstag wird uns im heutigen Vortrag geboren. Schon hat er aufgeleuchtet in der Schriftlesung, der herrliche Tag, der die Erde vor dem Untergang rettete, indem Gott sprach: <em>“Es sammle sich das Wasser, so unter dem Himmel ist, an einen Sammelort“</em>. Hiervon nun mag die Einleitung ihren Ausgangspunkt nehmen. „Es sammle sich das Wasser“, so ward gesprochen: und es sammelte sich. So wird auch oftmals gesprochen: „Es sammle sich das Volk“: und es sammelt sich nicht. Es ist keine kleine Schande, daß die Elemente, die keinen Verstand haben, dem Befehle Gottes gehorchen, und die Menschen, denen eben der Schöpfer den Verstand verliehen hat, nicht folgen. Nun, vielleicht war diese Schande Anlaß, daß ihr heute besonders zahlreich euch eingefunden habt, damit nicht auch am heutigen Tage, da „das Wasser an <em>einen</em> Sammelort sich sammelte“, das Volk nicht gesammelt erscheine zur Kirche des Herrn.</p><p>Wir haben hier nicht das einzige Beispiel dafür, daß das Wasser sich unterwürfig erweist. Denn auch an einer andern Stelle steht geschrieben: „Es sahen Dich die Wasser, o Gott, es sahen Dich die Wasser und erschraken“. Es ist nämlich nicht unwahrscheinlich, daß wirkliches Wasser gemeint ist, nachdem auch anderen Orts der Prophet desgleichen spricht: „Das Meer sah es und floh, der Jordan wendete sich zurück“. Wer wüßte denn nicht, wie es sich als wahre Begebenheit zugetragen hat, daß beim Durchzug der Hebräer das Meer floh. Da die Flut sich teilte, zog das Volk staubtrockenen Fußes hindurch im Glauben, es sei das Meer entschwunden, die Flut entflohen. So glaubte es denn auch der Ägypter und zog hinein: doch da kehrte zu seinem Verderben die entflohene Flut wieder. Es wußte also das Wasser sich zu sammeln, zu fürchten, zu fliehen, sobald Gott es befahl. Dieses Wasser laßt uns nachahmen und nur „<em>eine</em> Sammlung“ des Herrn, die <em>eine</em> Kirche, kennen!</p><p>Es sammelte sich dahier einstens Wasser aus jedem Tal, aus jedem Sumpf, aus jedem See. Ein Tal bedeutet die Irrlehre, ein Tal bedeutet das Heidentum; denn Gott ist „ein Gott der Berge, nicht der Täler“. So herrscht auch nur in der Kirche froher Jubel, in Häresie und Heidentum Tränen und Trauer. Daher das Wort: „Er traf Anordnung im Tale der Tränen“. So sammelte sich also aus jedem Tale das katholische Volk. Keine Vielzahl von Sammlungen gibt es mehr, sondern nur „<em>eine</em> Sammlung“; die <em>eine</em> Kirche. Hier erging das Wort: „Es sammle sich das Wasser aus jedem Tale“. Und es entstand eine Sammlung geistlicher Art, es entstand <em>ein</em> Volk. Aus Irr- und Ungläubigen füllte sich die Kirche. Eine Talestiefe ist das Theater, eine Talestiefe die Rennbahn, wo „trügerisch das Roß zum Siege läuft“, wo nichtiger, verwerflicher Wettstreit, wo das häßliche Zerrbild des Kampfes sich darbietet. Auch aus solchen Kreisen nun, die dem Zirkus sich hinzugeben pflegten, gewann der Glaube der Kirche Zuwachs, gewinnt täglich der Gläubigen Schar Mehrung.</p><p>[Forts. v. ] Einen Sumpf bedeutet die Völlerei, einen Sumpf die Unmäßigkeit, einen Sumpf die Unenthaltsamkeit. Darin wälzen sich die bösen Lüste, wird vernehmlich tierisches Grunzen, birgt sich das Versteck der Leidenschaften; da sinkt unter, wer immer hinein gerät, und taucht nicht mehr auf; da gleitet aus des Fußes Tritt und gerät ein jeder beim Gehen auf entweichenden Grund; da beschmutzt sich das Bläßchen, wenn es sich badet; da tönt darüber der Tauben klagendes Gurren; da klebt auf morastischem Grund die faule Kröte. Daher denn (die Wendungen): „der Eber im Sumpf“, „der Hirsch an der Quelle“. Aus jedem Sumpfe nun, worin gleichsam die Frösche „ihr altes Klagelied leierten“, sammelte sich der Glaube, sammelte sich des Herzens Reinheit und des Geistes Einfalt.</p><p>Es sammelte sich das Wasser aus jedem See und aus jeder Grube. Niemand soll daher seinem Bruder eine Grube graben, in die er selbst fallen würde, sondern alle sollen einander lieben, alle einander hegen und pflegen, und wie <em>ein</em> Leib die verschiedenen Glieder sich gegenseitig stützen. Nicht an den todträufelnden Liedern der Komödianten auf der Bühne, die den Geist verweichlichend zu sinnlicher Liebe entfachen, sondern an den gemeinsamen Kirchengesängen, an der zu Gottes Lob gemeinsam erschallenden Stimme des Volkes und am frommen Leben sollen sie ihre Freude haben. Nicht Purpurstoffe, nicht kostbare Draperien sollen ihnen Augenweide sein, sondern dieser wunderschöne Weltbau, diese Verbindung einander entgegengesetzter Elemente, der Himmel, der wie ein Gewölbe ausgespannt ist, daß er die Bewohner auf dieser Welt schützend decke, die Erde, die uns zum Schaffen gegeben wurde, die ringsum ausgegossene Luft, die eingeschlossenen Meere, das Volk hier, das Instrument in der Meisterhand Gottes, das von den melodischen Klängen des Gotteswortes widertönt, in dessen Innerem Gottes Geist wirkt, der Tempel hier, das Heiligtum des dreieinigen Gottes, die Stätte der Heiligkeit, die heilige Kirche, worin himmlische Prachtstoffe schimmern, auf welche sich das Wort bezieht: „Weite den Raum deiner Zelttücher und deiner Vorhänge, festige sie, spare nicht, mache länger deine Seile und fest deine Pflöcke, erweitere sie noch mehr gen rechts und links: und deine Nachkommenschaft wird als Erbe die Völker besitzen und verödete Städte wirst du bewohnen“. So besitzt sie denn Prachtstoffe zum Schmuck des sittlichguten Lebens, zur Zudeckung der Sünden, zur Verhüllung der Schuld.</p><p>[Forts. v. ] Das ist die Kirche, die „auf Meere gegründet und auf Ströme gestellt ist“. Über euch nämlich ist sie gefestigt und gestellt, die ihr wie Ströme rein aus klarem Quell ihr zueilt; von denen gesprochen ward: „Es erheben Ströme, o Herr, es erheben Ströme ihre Stimmen mehr denn das Brausen vieler Wasser“, und dazu: „Wunderbar ist die Hochflut des Meeres, wunderbar in der Höhe der Herr“. Herrliche Ströme! Ihr tranket aus jenem unversieglichen und vollen Quell, dessen Flut ihr strömt; der euch zuruft: „Wer an mich glaubt, in dessen Innerem werden, wie die Schrift sich ausdrückte, Ströme lebendigen Wassers fließen. Dies sagte er aber von dem Geiste, welchen jene empfangen sollten, die an ihn glauben würden“. Doch als echte Jordanfluten zurück nun mit mir zum Ausgang!</p><p><strong>Das Flüssigsein keine ursprüngliche Eigenschaft des Wasserelementes, sondern nachträglich vom Schöpfer ihm einerschaffen: Einwände, Kongruenzgründe. Gottes Macht sammelte alles Wasser an einen Ort und setzte ihm feste Grenzen. Des Sesostris und des Darius Versuche einer Verbindung des Roten Meeres mit dem Ägyptischen (Mittelländischen).</strong></p><p>„Es sammle sich das Wasser, so unter dem Himmel ist, an einen Sammelort <em>und es komme zum Vorschein das Trockene. Und also ward es“</em>. Vielleicht hat jemand unseren obigen Ausführungen nur wenig Glauben geschenkt: wir legten nämlich hier dar, es sei die Erde deshalb „unsichtbar“ gewesen, weil sie von den Wassern überdeckt war, so daß sie dem Blick des leiblichen Auges entzogen war; denn von seinem, d. i. unserem geschöpflichen, nicht vom Standpunkt der erhabenen göttlichen Natur, die ja alles sieht, hat der Prophet gesprochen. Doch damit ihr euch überzeugt, daß wir uns dieser mühsamen Abhandlung nicht unterzogen haben, um unserseits den Geistreichen zu spielen, sondern zum Zwecke euerer Unterweisung, rufen wir den Text der Schriftlesung als Zeugen auf, der uns recht gibt und mit klaren Worten bestätigt, daß erst nach der Sammlung des Wassers, das über der Erde lag, und nach dessen Ableitung zu den Meeren das trockene Land zum Vorschein kam. Man verschone uns darum und mache uns nicht mit Sophistereien Schwierigkeiten, indem man fragt: Wie konnte die Erde unsichtbar sein, da doch allem Körperlichen von Natur Gestalt und Farbe eignet, jede Farbe aber dem Auge sichtbar ist? Laut antwortet Gottes Stimme: „Es sammle sich das Wasser, und es komme zum Vorschein das Trockene!“ Und nochmals versichert die Schrift: „Es sammelte sich das Wasser an einen Sammelort, und zum Vorschein kam das Trockene“. Wozu die Wiederholung, hätte der Prophet es nicht für notwendig befunden, jenen Fragen zu begegnen? Will er nicht augenscheinlich beteuern: ich nannte sie nicht ihrer Natur nach unsichtbar, sondern in Rücksicht auf die Wasser, die über ihr ausgegossen lagen? Nach Beseitigung dieser Deckschicht sodann, wollte er weiter sagen, kam das trockene Land zum Vorschein, das vorher nicht sichtbar war.</p><p>Andere Fragen hinwiederum werfen sie auf und meinen: Wenn das Wasser an so verschiedenen Sammelorten lagerte, wie floß es dann, wenn diese Sammelbecken höher gelegen waren, nicht (von selbst) an jenen Ort ab, wohin es durch des Herrn Befehl nachmals abgeleitet wurde? ― Das Wasser nimmt ja von Natur seinen Lauf abwärts. ― Waren aber jene Sammelbecken tiefer gelegen, wie konnte dann das Wasser wider seine Natur den Lauf nach oben nehmen? Einesteils also bedurfte es für seinen natürlichen Lauf keines Befehles, andernteils aber konnte es wider seine Natur einem Befehle nicht folge leisten. Ich werde auf diese Frage dann die leichte Antwort geben, wenn sie mir zuvor antworten (und beweisen), daß das Gleiten, das Fließen notwendig zur Natur des Wassers gehöre. Denn tatsächlich kommt ihm diese Eigenschaft nicht aus der Verbindung mit den übrigen Elementen zu, sondern als spezifische Eigentümlichkeit; nicht als Ausfluß gleichsam der Naturordnung, sondern vielmehr des Willens und der Wirksamkeit Gottes des Höchsten. Gottes Befehlswort hören sie. Gottes Wort aber ist die Wirkursache der Natur. Dieses Wort kommt mit der eintretenden Wirkung zum Vollzug. Das Wasser fing erst dahinzugleiten und nach einem Sammelort zusammenzufließen an, nachdem es zuvor überall über die Erde ausgegossen war und an unzähligen Standorten lagerte. Von einem Lauf vorher las ich nicht, von einer Fortbewegung vorher vernahm ich nicht: mein Auge hat es nicht gesehen, mein Ohr nicht gehört. Stehendes Wasser war es an den verschiedenen Orten, auf Gottes Wort kam es in Bewegung: hat also nicht augenscheinlich Gottes Wort ihm diese natürliche Eigenschaft einerschaffen? Es folgte das Geschöpf dem Gebote und machte aus dem Gesetz eine Gepflogenheit; denn das für die ursprüngliche Konstitution der Dinge wirksame Gesetz blieb vorbildlich für die Zukunft. So schuf Gott auch ein für allemal den Tag und die Nacht: seitdem dauert der tägliche Wechsel, die tägliche Wiederkehr beider fort. Desgleichen erging an das Wasser der Befehl, nach dem Sammelort zu strömen. Seitdem strömt es: die Quellen fließen über in Flüsse, die Flüsse strömen in die Sunde; die Seen werden abgeleitet in die Meere; im Wasser selbst zieht Woge vor Woge, drängt und folgt (Woge auf Woge). <em>Ein</em> Wellengang ist’s, <em>ein</em> Ganzes. Und mag die Tiefe verschieden sein, ununterbrochen gleich und eben doch ist die Oberfläche. Daher auch meines Erachtens die Bezeichnung ‚aequor‛ (Fläche) für Meer, weil sein Spiegel flach ist.</p><p>Das ist meine Antwort auf ihre vorgelegte Frage. Nun mögen sie mir Antwort stehen, ob sie denn niemals Quellen aus den Tiefen sprudeln, Wasser aus dem Boden aufströmen sahen? Wer zwingt es dazu? Von wo bricht es hervor? Wie geht es nicht aus? Wie kommt es, daß des Bodens tiefste Schicht Wasser speit? Das sind Geheimnisse der verborgenen Natur. Wer wüßte übrigens nicht, daß oft Wasser, das mit reißendem Lauf zur Tiefe stürzt, wieder bergauf läuft und berghoch emporstürmt? desgleichen daß es, von Menschenhand künstlich durch Kanäle geleitet, genau wiederum so hoch emporsteigt, als es sinkt? Wenn es sich also wider seine Natur, sei es durch eigene Kraft vorwärtstreiben, sei es durch den schaffenden Menschengeist ablenken und aufwärtsleiten läßt: was Wunder, wenn kraft göttlicher Anordnung zu seiner natürlichen Art noch etwas hinzukam, was vorher nicht in seiner Art lag? Sie sollen mir jetzt einmal sagen, wie Gott nach dem Schriftworte „die Wasser des Meeres wie in einen Schlauch sammeln“, wie er „Wasser aus dem Felsen schlagen“ konnte? Er, der nicht vorhandenes Wasser aus dem Felsen herausleitete, sollte außerstande gewesen sein, vorhandenes Wasser fortzuleiten? „Er schlug an den Felsen“, ruft es David laut, „und Wasser rannen, und die Bäche strömten über“. Und an einer anderen Stelle: „Über den Bergen standen die Wasser“. Im Evangelium liest man, wie die Apostel, da ein heftiger Sturm und eine große Bewegung im Meere war, so daß sie Gefahr des Schiffbruchs befürchteten, den Herrn Jesus aufweckten, der im Schiffe schlief. Und er stand auf und gebot dem Winde und dem Meere; der Sturm legte sich, und Ruhe kehrte wieder. Der mit gebieterischem Worte das ganze Meer zu stillen vermochte, sollte nicht imstande gewesen sein, mit gebieterischem Worte Wasser in Fluß zu bringen? Wir haben doch bei der Sintflut solches vernommen, daß die Quellen des Abgrundes hervorbrachen, und daß Gott nachher den Wind darüber wehen ließ und das Wasser auftrocknete. Wenn man einen Gehorsam der Natur und eine Änderung des Verhaltens eines Elementes auf Gottes Befehl nicht zugeben will, so möge man wenigstens soviel zugestehen, daß die Wasser durch einen Windstoß, der in sie fuhr, in Fluß kommen konnten. Die Beobachtung läßt sich ja täglich auf dem Meere machen, daß die Wasser von der Richtung ihren Wogengang nehmen, von welcher der Wind weht. Wenn zur Zeit des Moses das Meer durch Entfachung eines starken Südwindes vertrocknete, konnte nicht in der gleichen Weise ein Sammelbecken des Wassers vertrocknen? Nicht das Wasser zum Meere sich fortbewegen, nachdem es nachmals vom Meeresgrund sich loslöste? Dann doch sollte man die Möglichkeit einer Naturveränderung begreiflich finden, nachdem ein Fels Wasser strömte und Eisen auf dem Wasser schwamm, (ein Wunder,) das Elisäus wenigstens bitt-, nicht befehlsweise zu wirken verdiente. Wenn ein Elisäus Eisen wider dessen Natur an die Oberfläche trieb: Christus sollte nicht vermocht haben, Wasser in Fluß zu bringen? Doch er, der zu sprechen vermochte: „Lazarus, komm heraus!“ und den Toten zum Leben erweckte, brachte es in Fluß. In ganz ähnlichem Sinn gesprochen versteh die Worte: „Es sammle sich das Wasser, und es sammelte sich“. Mit dem Befehlsworte aber „es sammle sich“ bewegte Gott es nicht bloß von der Stelle fort, sondern bannte es zugleich an eine Stelle, daß es nicht darüber hinausströmte, sondern darin beharrte.</p><p>Folgendes nun zeigt von einem noch größeren Wunder: wie sämtliche Sammelbecken an <em>einen</em> Sammelort abfließen konnten, ohne daß der <em>eine</em> Sammelort überfüllt wurde. Auch die Schrift nämlich rechnet das unter die Wunder, indem sie ausruft: „Alle Ströme gehen ins Meer, und das Meer wird nicht übervoll“. Beides nun beruht auf Gottes Anordnung: daß das Wasser fließt und daß es nicht überfließt. Rings umzogen von einer Grenze, die ihnen gesetzt ist, sind die Meere eingeschlossen, daß sie nicht, über die Lande sich ergießend, alles überschwemmen, die bebauten Felder vernichten und den Segen irdischer Fruchtbarkeit verhindern. Möchte man also einsehen, daß dies auf göttlicher Anordnung und himmlischer Wirkung beruht! Es spricht ja der Herr zu Job durch die Wolke unter anderem auch von des Meeres Riegel: „Ich steckte ihm Grenzen, Riegel ihm setzend und Tore. Ich sprach aber zu ihm: bis hierher sollst du kommen und nicht darüber hinausgehen, sondern in dir sollen deine Wogen zerschellen“. Sind wir nicht selbst häufig Augenzeugen, wie das Meer, ob es auch stürmisch flutet, daß seine Wogen wie jähe Wasserberge sich türmen, sobald es brandend ans Ufer schlägt, an dessen niederen Sandwällen zurückprallt und in schäumenden Gischt sich auflöst gemäßt dem Schriftworte: „Oder wollt ihr mich nicht fürchten, spricht der Herr, der ich Sand dem Meere zur Grenze setzte?“ Von dem allerleichtesten, winzigen Kieselsande wird also die stürmische Gewalt des Meeres in Schranken gehalten und wie mit Zügeln kraft der himmlischen Anordnung in die ihr bestimmte Grenze gewiesen: die Hochflut des ungestümen Meeres bricht in sich zusammen und zerteilt sich in ihre landeinwärts gezogenen Wogenringe.</p><p>[Forts. v. ] Geböte übrigens nicht die Kraft einer göttlichen Anordnung Einhalt, was würde denn hindern, daß das Rote Meer über die Gefilde Ägyptens hin, das größtenteils über niedere Talgründe sich erstreckendes Flachland sein soll, mit dem Ägyptischen Meer sich vereinigt? Das beweisen letzten Endes jene (Herrscher), welche tatsächlich eine gegenseitige Verbindung und Vereinigung dieser beiden Meere anstrebten: der Ägypter Sesostris, der am frühesten lebte, und der Meder Darius, der anbetracht seiner noch größeren Macht das Unternehmen, das vordem der einheimische Herrscher versucht hatte, zur Ausführung bringen wollte. Diese Tatsache verrät, daß das Indische Meer, zu dem das Rote Meer gehört, höher gelegen ist denn das Ägyptische, das tieferliegend das Land bespült. Und vielleicht stellten die beiden Könige deshalb ihr Riesenunternehmen wieder ein, daß nicht das von der Höhe zur Tiefe stürzende Meer allzu weithin sich ergösse.</p><p><strong>Wie konnte das eine Weltmeer alle Wasser fassen? Drei Erklärungsversuche: 1) Ausdehnung des Flächeninhaltes der Erde, 2) Vertiefung des Meeresgrundes, 3) Ableitung großer Wassermengen in die Binnengewässer.</strong></p><p>Jetzt eine Frage. Wenn es heißt: „Es sammle sich das Wasser... an <em>einen</em> Sammelort“, wie konnte denn ein einziges Sammelbecken alles Wasser fassen, das, Seen, Sümpfe, Weiher füllend und Täler und Ebenen und alles Flachland bedeckend, in Quellen und Flüssen abfloß? Oder wie kann von einem einzigen Becken die Rede sein, nachdem es doch heutzutage verschiedene Meere gibt? Wir nennen den Ozean Meer und reden von einem Tyrrhenischen, Adriatischen, Indischen, Ägyptischen, Pontischen, Propontischen, Hellespontischen, Euxinischen, Ägäischen, Jonischen, Atlantischen Meere; manche nennen dazu noch das Kretische und das Kaspische Meer in der Mitternachtsgegend. Wir wollen darum den Wortlaut der Schrift, der mit genauer Wage abgewogen ist, näher ins Auge fassen.</p><p>„Es sammle sich das Wasser an <em>einen</em> Sammelort“. „Nur <em>einen</em> ununterbrochen zusammenhängenden Sammelort der Wasser gibt es, hingegen verschiedene Meerbecken, wie schon ein Profanschriftsteller hervorhebt. Denn auch der Pontus ist nur ein unermeßlich weites Becken unseres Meeres. Und mit Recht führt es an den verschiedenen Orten verschiedene Namen, indem die Bezeichnung der Gegenden sich auf die Gewässer übertrug. Nur „<em>einen</em> Sammelort der Wasser“ aber gibt es, weil es nur <em>eine</em> ununterbrochen zusammenhängende Flut ist, die vom Indischen Meere bis an den gaditanischen Küstenstrich und von da zum Roten Meere die Enden des Erdkreises einschließt, vom Ozean umgürtet, der ringsum wogt. Auch innnerhalb desselben geht die Adria in das Tyrrhenische, die übrigen Meere, die nur dem Namen, nicht der Flut nach unterschieden sind, in die Adria über. Darum die zutreffende Wendung: Gott „nannte die Sammlungen der Wasser Meere“. So gibt es also einesteils nur <em>ein</em> allgemeines Sammelbecken, das ‚Meer‘ genannt wird, andernteils viele Becken, die, nach den Gegenden zubenannt, ‚Meere‘ heißen. Wie es nämlich viele nach dem Namen der Gegenden bezeichnete Erdenländer (‚terrae‘) gibt, wie Afrika, Spanien, Thrakien, Mazedonien, Syrien, Ägypten, Gallien, Italien, und nur <em>eine</em> Erde (‚terra‘), so redet man auch je nach den Namen der Gegenden von vielen Meeren, und hinwiederum nur von <em>einem</em> Meere, wie es der Prophet bestätigt, wenn er spricht: „Dein ist der Himmel und Dein ist die Erde. Den Erdkreis und seine Fülle hast Du gegründet; Nord und Meer: Du hast sie erschaffen“. Und zu Job spricht der Herr selbst: „Ich aber schloß das Meer ein mit Toren“.</p><p>Jetzt, da wir von dem <em>einen</em> Sammelbecken gesprochen haben, ergibt sich die weitere Frage: Wenn fast auf der ganzen Erde und über der Erde Wasser ausgegossen lag, über den Niederungen der Gefilde, den Taleinschnitten der Gebirge, dem ebenen Flachlande: konnte dann ein einziges Sammelbecken nach Art eines Meeres alle jene Wasser fassen und das Festland, das zuvor seiner ganzen Ausdehnung nach unter Wasser stand, davon befreien? Denn wenn alles in solcher Weise bedeckt war ― die Schrift würde sonst nicht bemerkt haben: „es kam die Erde zum Vorschein“, hätte sie dieselbe nicht allerorts als bedeckt erscheinen lassen wollen ―, wenn die Sintflut zu Noes Zeit, da die Ausscheidung der Wasser über den Himmeln und unter dem Firmamente bereits vor sich gegangen war, selbst die Berge einhüllte, wieviel mehr waren zweifelsohne von jener Überschwemmungsflut auch noch die Scheitel der Berge verdeckt? Wohin nun wurden jene ganze übergroße Wasserfülle abgeleitet? Welches sind die so ununterbrochen zusammenhängenden Behälter, die sie aufzunehmen vermochten?</p><p>Darauf ließe sich nun vieles erwidern: fürs erste, daß der Schöpfer des Alls den Flächeninhalt der Erde hätte erweitern können, eine Behauptung, welche auch einige vor uns als ihre subjektive Ansicht vortrugen. Ich meinerseits will nicht verschweigen, was er möglicherweise hätte tun können: was er wirklich getan, darüber will ich, weil ich von der Autorität der Schrift nichts Bestimmtes erfahre, wie über Verborgenes schweigen, damit man nicht auch das noch als Anlaß zu weiteren Fragen auszunützen suche. Gleichwohl möchte ich im Einklang mit der Schrift betonen: Es konnte Gott des Geländes Niederungen und des Flachlandes freie Strecken weiter ausdehnen, wie er selbst versicherte: „Ich werde vor dir herziehen und die Berge eben machen“. Es konnte ferner der Wasser Gewalt selbst die Stellen vertiefen, die mit so reißender Strömung und so wilder Brandung des stürmischen Elementes, die noch täglich die Meerestiefen aufzuwühlen und die Kiesmassen vom tiefen Grund fortzuwälzen pflegen, eingeströmt war. Wer weiß ferner, wie weit jenes große Meer, in das noch kein Schiffer sich hinauswagte und das noch kein Seefahrer durchquerte, sich ergießt, das mit seiner gewaltigen Wasserzone Britannien umgürtet und noch höher hinauf nach unbekannten, selbst der Sagenwelt verschlossenen Ländern sich erstreckt? Wer wollte endlich nicht in Erwägung ziehen, welche Wassermenge das einströmende Meer an den Lukriner-und Avernersee in Italien abgibt, ferner an den See von Tiberias in Palästina und an jenen, der zwischen Palästina und Ägypten Arabiens Wüste vorlagert, sowie an die verschiedenen Hafenanlagen des Augustus und Trajan und so viele andere auf dem ganzen Erdkreis?</p><p>Es gibt freilich auch Seen und Gewässer, die nicht (mit dem Meere) verbunden sind, die mit ihrer Flut sich nicht darein ergießen, wie der Comersee und Gardasee, ferner der Albanersee und andere mehr. Wie kann da von „<em>einer</em> Sammlung der Wasser“ die Rede sein? Doch wie es heißt, Gott habe zwei Leuchten geschaffen, d. i. die Sonne und den Mond, obschon es doch auch noch die leuchtenden Sterne gibt, so ist auch nur von <em>einer</em> Sammlung der Wasser die Rede, wiewohl es deren gar viele gibt. Sie kommen nämlich für die Aufzählung nicht in Betracht, weil sie nicht erwähnt werden.</p><p><strong>Eine Näherbestimmung der spezifischen Eigentümlichkeit dieses Elementes. Die Grundeigenschaften der übrigen Elemente. Ihre gegenseitige Verbindung. Das Eigenartige und Grundwesentliche des einen Elementes inhäriert dem andern als etwas Fremdartiges und Zufälliges.</strong></p><p>Doch es scheint, weil ich vom Meere sprach, floß unsere Rede etwas über. Kehren wir zum Thema zurück und erwägen wir die Bewandtnis, die es mit der Ausdrucksweise des Herrn hat: „Es sammle sich das Wasser an einem Sammelort und komme <em>‚das Trockene‘</em> zum Vorschein“ ― nicht ‚die Erde‘. Ein passend gewählter Ausdruck: wer würde das nicht merken? Die Erde kann ja auch schlammig, aufgeweicht, ihr Aussehen wegen des darüber ausgegossenen Wassers unkenntlich sein. ‚Trocken‘ indes bezieht sich nicht nur auf eine allgemeine, sondern vielmehr auf eine besondere Beschaffenheit des Festlandes, derzufolge es nutzbar, entwässert und zum Anbau geeignet und tauglich ist. Zugleich ward vorgesehen, daß es nicht den Anschein gewänne, als verdankte es mehr der Sonne denn Gottes Anordnung das Trockensein; denn es wurde trocken, bevor die Sonne erschaffen wurde. Darum unterscheidet auch David zwischen Meer und Land und versichert vom Herrn und Gott: „Sein ist das Meer, und er hat es erschaffen, und seine Hände haben das Trockene gegründet“. ‚Trocken‘ ist eine nähere natürliche Bestimmung, ‚Erde‘ eine einfache Sachbenennung, die wohl eine besondere Eigentümlichkeit in sich begreifen mag. Wie nämlich ‚Lebewesen‘ ein Allgemeinbegriff ist, der das Eigentümliche und Besondere einer Art einschließt, ‚Vernunftwesen‘ hingegen die spezifische Bezeichnung des Menschen, so läßt sich auch von der Erde allgemein beides aussagen: sie ströme von Wasser, oder aber sie sei „wüst und unwegsam und wasserlos“. Jene Erde, die von Wasser strömt, trägt sonach auch die Möglichkeit des Trockenseins in sich; sobald nämlich das Wasser entfernt ist, fängt sie zu trocknen an. Ähnlich liest man in der Schrift: „Er hat Flüsse gewandelt in Wüste und Wasserquellen in durstendes Land“, d. i. er hat aus wasserreichem Land trockenes geschaffen.</p><p>Es hat also die Erde ihre besondere Beschaffenheit, wie überhaupt alle Elemente sie haben. So eignet der Luft Feuchtigkeit, dem Wasser Kälte, dem Feuer Wärme. Und zwar ist dies die Haupteigentümlichkeit eines jeden Elementes, wie wir sie mit der Vernunft erschließen. Wollten wir sie aber nur nach dem Sinnenfälligen und Äußeren ins Auge fassen, so finden wir sie verbunden und zusammengesetzt: die Erde ist trocken und kalt, das Wasser kalt und naß, die Luft warm und feucht, das Feuer warm und trocken. Und so gehen infolge dieser Doppelqualitäten die Elemente gegenseitige Verbindungen ein. Die Erde nämlich, an Beschaffenheit trocken und kalt, verbindet sich, weil wegen der Kältequalität damit verwandt, mit dem Wasser und mittels des Wassers mit der Luft, insofern die Luft feucht ist. Sonach umfängt das Wasser mit seiner Kälte und Feuchtigkeit wie mit zwei Armen hier die Erde, dort die Luft, mit der Kälte die Erde, mit der Feuchtigkeit die Luft. Auch die Luft nimmt eine Mittelstellung ein zwischen zwei von Natur sich widerstreitenden Elementen, d. i. zwischen Wasser und Feuer, und freundet sich diesen beiden Elementen an, indem sie einerseits durch die Feuchtigkeit mit dem Wasser, andrerseits durch die Wärme mit dem Feuer sich verbindet. Desgleichen vereinigt sich das Feuer, da es von Natur warm und trocken ist, durch die Wärme mit der Luft, durch das Trockensein aber geht es hinwiederum die Vereinigung und Verbindung mit der Erde ein. So reichen sich in diesem Kreislaufe, gleichsam in diesem Reigen von Eintracht und Geselligkeit, die Elemente die Hand. Darum heißen sie auch griechisch <em>στοιχεῖα</em> [stoicheia] ― was wir lateinisch mit ‚Elemente‛ wiedergeben ―, weil sie sich gegenseitig zusammenfinden und zusammenreihen.</p><p>Hierauf aber sind wir zu sprechen gekommen, weil die Schrift bemerkt, Gott habe die Erde „das Trockene“ genannt, d. i. weil sie mit dieser natürlichen Eigentümlichkeit die Haupteigenschaft derselben namhaft gemacht hat. Von Natur eignet nämlich dem Festlande die Trockenheit. Dieser eigentümliche Vorzug blieb ihm. So ist demnach seine Haupteigenschaft die Trockenheit. Dann erst kommt auch noch die Kältequalität hinzu; doch geht das Sekundäre dem Primären nicht vor. Die Feuchtigkeit aber zieht es aus der Verwandtschaft mit dem Wasser. Jene erstere Qualität also ist ihm eigen, diese letztere fremd: eigen das Trockensein, fremd das Feuchtsein. Der Schöpfer der Natur hielt sich also (in der Ausdrucksweise) an das, was er dem Festlande ursprünglich verliehen hatte; denn das gründet in der Natur, jenes andere auf einer (äußeren) Ursache. Nach dem Ursprünglichen, nicht nach dem zufällig Hinzugekommenen mußte die Eigentümlichkeit der Erde gekennzeichnet werden, damit unsere Kenntnis an jener Beschaffenheit, die ihr vorzugsweise eignet, sich informierte.</p><p><strong>Die wunderbare Schönheit des Meeres. Sein “Gut sein” (Gen 1,10) beruhend in der Übereinstimmung mit dem Schöpferwillen. Der Nutzen des Meeres.Die Inseln des Meeres Asyle der christlichen Vollkommenheit (Anachoretentum). Das Meer ein Bild der Kirche. Vom kirchlichen Volksgesang. Predigtschluß.</strong></p><p>* „Und Gott sah, daß es gut war.“* Wir verhehlen uns nicht, daß nach der Ansicht einiger Ausleger weder im Hebräischen noch in sonstigen Übersetzungen steht: „Es sammelte sich das Wasser an seine Sammelorte, und es kam zum Vorschein das Trockene. Und es nannte Gott das Trockene Erde, und die Sammlungen der Wasser nannte er Meere“. Nachdem Gott einmal gesprochen: „und also ward es“, dünkt ihnen nämlich dieses Schöpferwort für hinlänglich genug, um das Schöpfungswerk als vollendet anzuzeigen. Doch da er auch bei den übrigen Schöpfungswerken sowohl den genauen Wortlaut des Schöpfungsbefehles, als auch eine wiederholte Andeutung bezw. Konstatierung des Schöpfungsvollzuges bringt, halten auch wir den angeblichen Zusatz nicht für ungereimt, mag man auch den gelehrten Einwand machen, es sprächen Wahrheit und Autorität mehr zugunsten der übrigen Übersetzungen; nicht umsonst nämlich stoßen wir auf die vielerlei Zusätze und Ergänzungen aus der Hand der Siebzig Männer (Septuaginta) zum hebräischen Text.</p><p>Gott nun sah, daß das Meer „gut war“. Wohl ist der Anblick dieses Elementes schön, wenn schimmernde Wogenberge und -kämme darin sich türmen und die Riffe von schneeweißem Gischte traufen, oder wenn es über seiner Wasserfläche, die vor sanftem Windeswehen sich kräuselt und freundlich blinkt, seiner heiteren Ruhe purpurfarbene Pracht aufleuchten läßt, die so oft von ferne das Auge des Beschauers entzückt, wenn es nicht mit gewaltigen Wogen an die nahen Ufer schlägt, sondern sie gleichsam in friedlicher Umarmung umfängt und grüßt. Wie süß ist da sein Tönen, wie lieblich sein Wellenschlag, wie traut und melodisch sein Wogenrauschen! Gleichwohl glaube ich, daß (oben) nicht der (Meeres-) Schöpfung Schönheit nach Maßgabe der Augen eingeschätzt, sondern bestimmt hervorgehoben werden sollte, daß sie dem Schöpfungszwecke gemäß mit dem Urteile des Schöpfers übereinstimmt und harmoniert.</p><p>Gut nun ist das Meer, vor allem weil es das Festland mit der nötigen Feuchtigkeit versorgt, indem es ihm wie mittels eines Adernetzes unversehens den wahrlich nicht unnützen Lebenssaft zuleitet. Gut ist das Meer: der gastliche Schoß der Flüsse, die Quelle des Regens, die Ablagerung des Alluvialbodens, die Einfuhrstraße für den Handel, die Verbindungsbrücke zwischen den entlegenen Völkern, der Wehrwall gegen Kriegsgefahren, die Sperre wider der Barbaren Wut, die Hilfe in Nöten, die Zuflucht in Gefahren, das reizende Ziel für Vergnügungsfahrten, das Heilbad zur Genesung, die Verbindungsstraße für Getrennte, die bequeme Route zum Reisen, der Rettungspfad für notleidende Auswanderer, die Einnahmequelle von Zöllen, die Lebensmittelzufuhr im Fall einer Mißernte. Aus dem Meere stammt der Regen, der zur Erde niederströmt; aus dem Meere wird ja durch die Sonnenstrahlen das Wasser absorbiert und, was an ihm leicht befunden wird, fortgeführt. Sodann, je höher es emporgetragen wird, umso mehr verdichtet es sich in der Schattenkühle der Wolken und wird zu Regen, der nicht nur der Dürre der Erde Einhalt tut, sondern auch die dürstenden Gefilde befruchtet.</p><p>Was sollte ich die Inseln aufzählen, die das Meer so vielfach wie Perlenschmuck im Kleidessaum birgt? Worauf jene, welche den Lockungen der Weltlust entsagen, in treuer Befolgung ihres Vorsatzes der Enthaltsamkeit lieber ein weltverborgenes Leben führen und den gefährlichen Abwegen dieses Lebens ausweichen? So ist also das Meer ein stilles Heim der Enthalssamkeit, eine Schule der Entsagung, ein Asyl des Lebensernstes, ein Port der Sicherheit, eine Stätte der Ruhe im Diesseits, ein Verzicht auf diese Welt, sodann ein Ansporn der Frömmigkeit für die gläubigen und frommen Männer, so daß mit dem Rauschen der Wogen, die sanft ans Ufer schlagen, der Sang der Psalmenbeter wetteifert, die Inseln mit dem friedlichen Reigen der heiligen Fluten freudig einstimmen und von den Lobgesängen der Heiligen widerhallen. Wie wäre es mir möglich, die ganze Schönheit des Meeres zu ergründen, wie sie der Schöpfer schaute? Wozu auch mehr? Was anders bedeutet jenes melodische Rauschen der Wogen als den melodischen Sang des Volkes? Passend vergleicht man darum so häufig die Kirche mit dem Meere. Erst speit sie mit dem scharenweise eintretenden Volke ihre Fluten über alle Eingänge; sodann erbraust sie beim (gemeinsamen) Gebete des ganzen Volkes wie vor hin- und wiederflutenden Meereswogen, so oft im Wechselsang der Psalmen der Sang der Männer, Frauen, Jungfrauen und Kinder ― ein melodisches Wogenrauschen ― widerhallt. Wozu sollte ich denn auch das noch hervorheben, daß ihre (Tauf-) Flut die Sünde wegspült und des Heiligen Geistes heilwirkender Hauch darin weht?</p><p>[Forts. v. ] Das verleihe uns der Herr: Glückliche Fahrt bei günstigem Winde, Landung im sicheren Porte, Verschontbleiben von Anfechtungen der bösen Geister, die unsere Kräfte übersteigen. Freibleiben von Schiffbruch im Glauben, den Besitz tiefen Friedens und, sollte je ein Fall die dräuenden Fluten dieser Welt wider uns erregen, den Herrn Jesus als Steuermann, der für uns wacht, mit seinem Worte gebeut, den Sturm stillt, die Ruhe des Meeres wiederherstellt! Ihm ist Ehre und Ruhm, Lob und Unsterblichkeit von Ewigkeit und jetzt und immerdar und in alle Ewigkeit der Ewigkeiten. Amen.</p><p><strong>Das Schöpferwort “es sprosse die Erde…” das dauernde Naturgesetz der Pflanzenwelt. Dem Schöpfer, nicht der Sonne, verdankt die Erde ihre üppige Vegetation.</strong></p><p>Beim Abfließen des Wassers war es wohl angezeigt, der Erde Wohlgestalt und Anmut zu verleihen, daß sie aufhörte, „unsichtbar und ungestaltet“ zu sein. Gar manche nämlich nennen auch das ‚invisibile‘, was keine Wohlgestalt hat, und verstehen darum die Wendung „die Erde sei unsichtbar gewesen“ nicht in dem Sinn, daß sie vor Gott dem Höchsten und seinen Engeln nicht sichtbar war ― Menschen, oder auch Tiere waren ja noch nicht erschaffen ―, sondern daß sie den ihr eigentümlichen Schmuck noch nicht hatte. Der Schmuck der Erde aber ist ein sprossendes und grünendes Gefilde. Um ihr nun Ansehen und Wohlgestalt zu geben, sprach Gott: * „Es sprosse die Erde das Grün des Grases, Samen treibend nach seiner Art, und die Fruchtbäume, fruchtbringend nach ihrer Art, deren Samen in sich selbst enthaltend“*.</p><p>[Forts. v. ] Hören wir die Worte der Wahrheit! Ihr Inhalt ist das Heil der Hörenden. Jenes erstmalige Wort Gottes nämlich bildet nun das Naturgesetz, das allen entstehenden Geschöpfen auferlegt wurde, das für alle Zeit für die Erde in Kraft blieb und die künftige Fortpflanzung, die Art und Weise, wie künftig Zeugung oder Befruchtung vor sich ginge, regelte. Darnach ist das erste das Sprossen, wenn man die Keime hervortreten sieht; sodann entwickelt sich, wenn die Keime hervorgetreten sind und zugesetzt haben, das junge Grün; das Grün desgleichen entwickelt sich nach kurzem Wachstum zum Gras. Ein wie segensvolles, wie gewaltiges Wort: „Es sprosse die Erde das Grün des Grases!“ Das heißt: aus sich sprosse die Erde, keines Anderen Hilfe suche sie, keines Fremden Dienst benötige sie!</p><p>Gar manche pflegen nämlich zu behaupten: Wenn nicht milder, warmer Sonnenschein die Erde erwärmt und gewissermaßen mit seinem Strahl befruchtet, kann die Erde nicht sprossen. Und die Heiden erweisen der Sonne gerade deshalb göttliche Ehre, weil sie kraft ihrer Wärme in den Schoß der Erde dringe und deren Saaten befruchte, bezw. die vor Kälte gefrorenen Saftadern der Bäume auftauen mache. So höre denn Gott, der gleichsam also sich vernehmen läßt: Verstummen soll der Menschen Gerede in den künftigen Tagen, schwinden ihr eitles Wähnen! Bevor noch der Sonne Leuchte ersteht, soll das Gras hervorwachsen. Ihm sei der zeitliche Vorrang vor der Sonne eingeräumt. Daß kein Irrtum unter den Menschen Platz greife, sprosse die Erde, bevor sie noch der Sonne befruchtende Strahlen aufnehmen kann. Alle sollen wissen, daß nicht die Sonne die Urheberin des Werdenden ist. Gottes Milde öffnet der Erde Schoß, Gottes Huld läßt ihre Frucht hervorbrechen. Wie soll die Sonne die Lebenspenderin der entstehenden Wesen sein, wenn diese durch die schöpferische Tat Gottes belebt und ins Dasein gesetzt wurden, bevor noch die Sonne in diesen Lebensbereich eintrat? Sie ist jünger als das junge Grün, jünger als das Gras.</p><p><strong>Empfehlung der ersteren, Warnung vor der letzteren aus hygienischen und ethischen Gründen. Die Pflanzenwelt ein Bild des Menschenwesens und lebens. Ergreifende Beispiele zur Beleuchtung des Schriftwortes: “Alles Fleisch ist Gras und alle Herrlichkeit des Menschen wie des Grases Blume”. Gleich der Pflanze sollen auch wir, “das Geschlecht Gottes”, nicht aus der Art schlagen, sondern Nachbild des “Bildes Gottes” bleiben. Die Wesensgleichheit des “Bildes Gottes” mit dem Vater.</strong></p><p>Vielleicht wundert sich jemand, daß die Nahrung für das Tier früher denn die Speise für den Menschen erschaffen wurde. Fürs erste nun müssen wir hierin die Tiefe Gottes beachten, die selbst des Kleinsten nicht vergißt. So spricht im Evangelium die Weisheit Gottes: „Sehet auf die Vögel des Himmels: sie säen nicht und ernten nicht und sammeln nicht in die Scheuern, und euer himmlischer Vater ernährt sie. Seid ihr nicht mehr als sie?“ Danken nämlich diese Gottes Huld ihre Nahrung, dann darf niemand auf seinen Fleiß und seine Tüchtigkeit sich etwas einbilden. Fürs zweite sollte er der einfachen Lebensweise und der Natur-Kost vor jeder anderen den Vorzug geben; denn sie ist die Speise der Mäßigkeit, jene andere die der Genußsucht und Völlerei; sie ist die allen lebenden Wesen gemeinsame Speise, jene die von wenigen. Ein Fingerzeig zur Genügsamkeit also, eine lehrreiche Mahnung zu karger Lebensweise liegt hierin: alle sollen sich mit der Kost aus einfachen Planzen und gewöhnlichem Gemüse oder Obst begnügen, wie sie die Natur darbietet, wie sie Gottes Freigebigkeit als Erstlingsspeise darreichte. Jene gesunde, jene zuträgliche Kost ist’s, die den Krankheiten wehrt, die Verdauungsbeschwerden hintanhält, nicht das Erzeugnis menschlicher Arbeit, sondern Ausfluß göttlichen Wohltuns ist: ein Erntesegen ohne Aussaat, eine Frucht ohne Samen, so süß und wohlschmeckend, daß sie selbst dem Satten noch mundet und frommt; so blieb sie denn, ursprünglich als Hauptmahlzeit zugedacht, wenigstens noch für den Nachtisch aufbewahrt.</p><p>Was aber sollte ich das Wunderbare dieser (Pflanzen-) Schöpfung ausmalen und einen förmlichen Beweis für die schöpferische Weisheit liefern? Hier bietet sich im Anblick der Knospen, dort im Wachstum des jungen Grünes ein Bild des menschlichen Lebens, begegnet dem Auge ein charakteristischer Zug unserer Natur und Beschaffenheit und strahlt deren Spiegelbild wider. Dieses Grases Grün und Blume ist ein Sinnbild des menschlichen Fleisches, wie es der treue Dolmetsch der Gottheit mit seinem Stimmorgan ausdrücklich versicherte: „Rufe! Was soll ich rufen? Alles Fleisch ist Gras und alle Herrlichkeit des Menschen wie des Grases Blume. Es verdorrt das Gras, und die Blume fällt ab, das Wort des Herrn aber währt in Ewigkeit“. Gottes Urteil spricht aus des Menschen Stimme. Gott spricht: „rufe“, doch er spricht es in Isaias [Jesaja]. Dieser nun erwiderte: „Was soll ich rufen?“ Und als hätte er vernommen, was er sprechen sollte, fügte er bei: „Alles Fleisch ist Gras“. Und so ist es. Wie Gras blüht die Herrlichkeit des Menschen im Fleische auf und ist, so erhaben sie einem dünkt, nichtig wie junges Grün. Früh reif wie die Blume, vergänglich wie das Gras, entfaltet sie wohl äußerlich blühenden Reiz, doch an Frucht keinen dauernden Ertrag; des heiteren Lebens Blüte, duftet sie frohe Anmut, um nur allzu bald dahinzuwelken wie des Grases Grün, „das verdorrt, ehe man es ausrauft“. Wo ist denn die Kraft im Leibe, wo die Gesundheit, die von Dauer sein könnte?</p><p>Heute magst du einen kräftigen Jüngling, strotzend in der Blüte der reifenden Jahre, von prächtiger Gestalt und reizendem Teint sehen; morgen begegnet er dir, an Aussehen und Gesichtszügen verändert. Gestern noch im Zauber seiner Wohlgestalt eine stattliche Erscheinung, tags darauf das Bild des Jammers, geschwächt und entkräftet durch irgendeine Krankheit. So manchen macht die Arbeit gebrechlich oder zehrt die Not aus oder quält Verdauungsbeschwerde oder richtet der Wein zugrunde oder schwächt das Alter oder entnervt Genußsucht, entstellt Unzucht. Bewahrheitet sich da nicht: „Es verdorrt das Gras, und die Blume fällt ab“? Ein anderer, ein Edler, der auf Ahnen und Vorahnen zurückschaut, den der Vorfahren Stirnbinden ehren, eines alten Geschlechtes Wappen auszeichnet, ein zahlreicher Freundeskreis umgibt, eine dichte Schar von Schutzbefohlenen umringt und zu beiden Seiten schützend geleitet, der hin und zurück eine Menge Diener mit sich führt, wird plötzlich von einem zufälligen schweren Unglücksschlag getroffen und seiner ganzen Habe beraubt, von seinen Freunden verlassen, von seinen Verwandten angefeindet. Sieh, wahr ist’s: „Wie Gras ist das Leben des Menschen; bevor man es ausrauft, verdorrt es“. Da gibt es sodann einen, der eben noch im Überflusse seines Reichtums schwimmt, durch den Ruf der Freigebigkeit in aller Munde lebt, wegen seiner Ehrenstellen in hohem Ansehen steht, hervorragende Ämter bekleidet, den ersten Platz bei Amtshandlungen einnimmt, auf erhabenem Throne sitzt, ein Glücklicher in den Augen der Menge, wenn er unter dem Rufe der Herolde einherzieht: da ändert sich mit einem Mal die Lage. Man schleppt ihn in den Kerker, wohin er selbst andere verstoßen hatte, und er muß inmitten derer, die als Angeklagte vor ihm gestanden, das traurige Los beweinen, das ihm bevorsteht. Wie vielen hat gestern noch der Jubel der Massen, der vielbeneidete Triumphzug einer zahlreichen Volksschar das Geleite nach Hause gegeben: und eine einzige Nacht hat diesen Glanz des Ehrengeleites zum bleichen gebracht. Ein plötzlich auftretender Schmerz in der Seite mischte in die übervollen Freudenklänge das wehmütige Nachspiel tiefer Trauer. So denn ist „die Herrlichkeit des Menschen wie des Grases Blume“. Auch wenn sie einem zuteil wird, mehrt sie in nichts seine Werke, wird keine Frucht an ihr erzielt. Und verliert man sie, schwindet sie dahin und zerstört mit einem Mal den ganzen Nimbus eines Menschen, dessen (= des Nimbus) äußeren Schein und inneres Sein sie ausmachte.</p><p>O daß wir doch dieses junge Grün nachahmen möchten, von dem der Herr gesprochen: „Es sprosse die Erde das Grün des Grases, Samen treibend nach seiner Art und seinem Gleichnis“. So säen wir denn Samen nach seiner Art! Welche Art (Geschlecht) gemeint ist, darüber höre den Apostel, der da mahnt, wir sollten nach dem Göttlichen trachten, „ob wir es etwa tasten oder finden möchten, obwohl Gott nicht fern sei von einem jeden aus uns; denn in ihm leben wir und sind wir und bewegen wir uns, wie auch“, so fügt er bei, „einige von euren Dichtern gesagt haben: Sein Geschlecht sogar sind wir“. Diesem Geschlechte gemäß laßt uns Samen säen nicht im Fleische, sondern im Geiste! Denn nicht fleischliche, sondern geistige Saat müssen wir säen, die wir zum ewigen Leben gelangen wollen. Was aber mit ‚Gleichnis‘ gemeint ist, weißt du, der du selbst nach Gottes Bild und Gleichnis geschaffen bist. Die Pflanze hält sich an ihre Art: du willst aus deiner Art schlagen? Das in die Erde gestreute Weizenkorn gibt gleichartigen Fruchtsegen zurück: du willst entarten? Die Erntefrucht schändet nicht die unverfälschte Art ihres Samens: du wolltest die Reinheit der Seele, die Kraft des Geistes, die Keuschheit des Leibes schänden?</p><p>[Forts. v. ] Erkennst du nicht, daß du Christi Geschöpf bist? Mit seinen Händen, wie wir’s lesen, hat er dich geformt: und du, Manichäer, verlangst dir einen anderen Schöpfer. Gott Vater spricht zum Sohne: „Laßt uns schaffen den Menschen nach unserem Bild und Gleichnis“: und du, Photinianer, sagst: bei der Erschaffung der Welt gab es noch keinen Christus; und du, Eunomianer, sagst: der Sohn ist dem Vater unähnlich. Ist er sein Bild, dann kann er ihm doch nicht unähnlich sein, sondern muß den Vater seinem ganzen Wesen nach darstellen, nachdem der Vater ihn auf Grund der Wesenseinheit mit sich (als Bild) geprägt hat. Der Vater spricht: „Laßt uns schaffen“: und du leugnest den Mitschaffenden. Was der Vater sprach, vollführte der Sohn: und du leugnest den Wesensgleichen, an welchem der Vater sein Wohlgefallen hat.</p><p><strong>Die Entwicklungsphasen des Samenkorns: Ein Blick in die Wunder der Pflanzenwelt wie in das wunderbare Walten Gottes. Die Mutter-Erde zahlt dem Landmann, ihrem Gläubiger, mit Zinseszins zurück. Die wundervolle Schönheit der Pflanzenwelt: des “vollen Feldes”, der Lilie. Von der Heilkraft der Pflanzen.</strong></p><p>* „Es sprosse die Erde das Grün des Grases nach seiner Art“*. Von allem, was man mit dem Namen ‚Bodenerzeugnisse‘ zusammenfaßt, ist der Keim das erste. Sobald er sich ein wenig über dem Boden erhoben hat, entwickelt er sich zum Grün, dann zur Pflanze, und reift hierauf zur Frucht heran. Es gibt nun Erzeugnisse, die aus einer Wurzel sprossen; so wächst der Baum ohne Saat aus der Wurzel anderer Bäume hervor. An einem Rohrschafte können wir beobachten, wie ganz unten seitlich eine Knotenbildung sich ansetzt und daraus ein zweiter Schaft hervorschießt. So ruht denn in der Wurzel eine Art Samentriebkraft. Pfropfreiser treiben auch an höher gelegenen Stellen. Für die einen Pflanzen läßt sich demnach die Fortpflanzung aus der Wurzel, für andere auf eine davon verschiedene Weise erzielen; entweder bedingt nämlich ein Same die Entstehung der einzelnen oder aber irgendeine samenartige Triebkraft, und zwar von derselben Art: was aus ihr ersteht, läßt ein dem Saatsamen bezw. der Pflanze, aus deren Wurzel es wächst, gleichartiges Erzeugnis emporsprossen: aus Weizen Weizen, aus Hirse Hirse; aus dem Birnbaum treibt der in weißem Blütenschmuck prangende Birnbaum, ebenso ersteht aus der Wurzel der Kastanie eine Kastanie.</p><p>„Es sprosse die Erde das Grün des Grases nach seiner Art.“ Und sogleich öffnete die Erde ihren Schoß und verjüngte sich in neuen Erzeugungen, legte an das Kleid frischen Grünes, schmückte sich mit der Anmut üppiger Fruchtbarkeit und empfing mit der bunten Zier sprossender Pflanzen ihren eigenen Schmuck. Wir wundern uns, wie sie ihre Erzeugnisse so schnell hervorbrachte. Wie unvergleichlich größere Wunder erschließen sich dem Auge bei der Betrachtung des einzelnen! Wie beispielsweise das Samenkorn, das in die Erde gelegt wird, verwest und, wenn es nicht abstirbt, keinerlei Frucht bringt, wenn es aber gleichsam sich selbst abstirbt und der Verwesung anheimfällt, zu überreicher Frucht ersteht! Die gelockerte Scholle nimmt das Weizenkorn auf, die Egge deckt die Saat ein und die Erde hegt und befruchtet sie wie in einem Mutterschoße. Wenn sodann das Samenkorn sich auflöst, treibt das sprossende Pflänzlein, das selbst schon einen lieblichen Anblick gewährt, das junge Grün, das sofort seine Art durch die Ähnlichkeit mit seinem Samen verrät: Schon beim ersten Wachstum des Pflänzchens läßt sich die Art des jungen Grüns erkennen und im jungen Grün die (künftige) Frucht ersehen. Allmählich nun entwickelt sich dasselbe zur Pflanze, richtet sich zum Halme erstarkend auf und wächst in die Höhe. Sobald aber die schon mit knotenförmigen Ansätzen versehene Ähre hervorsticht, bilden sich darin Kapseln für die künftige Frucht. Hier nun bildet sich das Korn ― im Inneren, daß nicht die Kälte seine ersten zarten Anfänge schädige oder die Sonnenhitze sie versenge oder rauhe Winde und heftige, stürmische Regenschauer sie ausschlügen. An der Ähre setzen sich allmählich wunderbar kunstvoll geformte Körnerreihen an, die ebenso köstlichen Anblick gewähren wie sicheren Schutz, indem sie durch ein natürliches Gefüge, das die göttliche Vorsehung formte, eng miteinander verbunden sind. Und damit nicht infolge der Schwere der überreichen Frucht die Stützkraft des Halmes versage, ruht er selbst in einer Art Schaft, so daß er, doppeltstark, imstande ist, die vielfältige Frucht zu tragen ohne, weil etwa der Last nicht gewachsen, zur Erde geknickt zu werden. Über die Ähre selbst sodann türmt sich der Wall der Grannen: wie in einer Festung lagernd schiebt sie ihn vor, damit sie nicht unter den pickenden Hieben kleinerer Vögel Schaden leide oder ihrer Frucht beraubt oder durch deren Krallen auf den Boden gestreut werde.</p><p>[Forts. v. ] Was brauche ich erwähnen, wie doch Gottes Mildtätigkeit zu Nutz und Frommen des Menschen Vorsorge traf? Mit Zinseszinsen und reichem Fruchtertrag gemehrt, stattet die Erde zurück, was sie empfangen. Menschen betrügen oft und bringen ihren Gläubiger um sein Eigentum, die Erde bleibt verlässig, und wenn sie einmal nicht heimbezahlte, wenn etwa rauhe Kälte oder übermäßige Dürre oder endloser Regen das verhinderten, so leistet sie in einem anderen Jahre Schadenersatz für das vorausgehende. Einerseits läßt es also die Erde auch dann keineswegs fehlen, wenn einmal die Ernte die Hoffnung des Landmannes enttäuscht; andrerseits ist es, wenn ihm dieselbe lacht, gerade die große Fruchtbarkeit der Mutter-Erde, die in Fruchterzeugungen überquillt. Nimmer läßt sie ihren Gläubiger irgendwie zu Schaden kommen.</p><p>Wie schönen Anblick gewährt doch ein „volles Feld“! Welchen Duft, welche Anmut, welche Freude für den Landmann! Wie könnten wir’s geziemend darstellen, wenn wir auf unsere eigenen Worte angewiesen wären? Doch wir haben die Schriftzeugnisse, durch welche wir des Feldes Anmut mit der Segens- und Gnadenfülle der Heiligen verglichen finden. So spricht der heilige Isaak: „Der Wohlgeruch meines Sohnes ist wie der Wohlgeruch eines vollen Feldes“. Wozu also eine Schilderung der purpurblauen Veilchen, der weißschimmernden Lilien, der rötlich glühenden Rosen, der bald von goldigen, bald von buntfarbenen, bald von lichtgelben Blumen prangenden Gefilde, von denen man nicht weiß, ob mehr ihrer Blumen Pracht oder deren würziger Duft erfreuen? Es weidet das Auge sich am entzückenden Anblicke, weit und breit strömt Wohlgeruch aus, dessen süßer Duft uns erfüllt. Daher das würdige Wort des Herrn: „Und des Feldes Zierde ist bei mir“.Bei ihm ist sie, weil er sie geschaffen hat. Denn welcher Meister sonst hätte eine so wunderbare Schönheit in die einzelnen Dinge legen können? „Betrachtet die Lilien des Feldes“: welch wundervolles Weiß doch in ihren Blättern schimmert! Wie die Blätter selbst, eines nach dem anderen, so zur Höhe streben, daß sie die Form eines Bechers bilden; daß ihr Inneres wie funkelndes Gold leuchtet, das indes, weil ringsum die Blüte von einem Walle umfriedet ist, keiner Verletzung ausgesetzt ist! Wollte man diese Blume pflücken und in ihre Blätter auflösen: wo wäre eine so geschickte Künstlerhand, die der Lilie Anmut von neuem formen könnte? Wo der Meister, der die Natur so treu nachzuahmen verstünde, daß er sich an die Wiederherstellung dieser Blume wagen dürfte? Hat ihr doch der Herr ein so herrliches Zeugnis ausgestellt, daß er versicherte: „Selbst Salomo in all seiner Pracht war nicht also gekleidet wie eine von diesen“. Der reichste und weiseste König steht nach diesem Urteile der Schönheit dieser Blume nach.</p><p>[Forts. v. ] Was sollte ich noch die Heilsäfte in den Pflanzen, was die Heilkräfte in den Sträuchern und Blättern anführen? Der kranke Hirsch kaut die zarten Zweige des Ölbaumes und gesundet. Den Heuschrecken bringen desgleichen die Olivenblätter, die sie verzehren, Genesung von Krankheit. Brombeerblätter, die man auf eine Schlange wirft, töten sie. Die Schnaken werden dich nicht berühren, wenn du Wermut abkochst und dich damit einreibst.</p><p><strong>sie tragen in ihrer Art zum Ganzen der Schöpfung bei. Die Giftpflanzen Heilmittel, für gewisse Tiere Nahrungsmittel. Ihrer Gefahr läßt sich vorbeugen, ihr Nutzen wahrnehmen: wie versteht sich selbst das unvernünftige Tier auf beides! Der vernünftige Mensch sollte für Gottes Gaben kein Verständnis haben?</strong></p><p>Doch vielleicht möchte der eine oder andere einwenden: Wie kommt es, daß mit den nützlichen (Pflanzen) auch tod- und verderbenbringende aufwachsen? mit dem Weizen Schierling, eine Giftpflanze, die unter den Lebensmitteln sich vorfindet und, wenn man nicht Obacht gibt, der Gesundheit zu schaden pflegt? Unter anderen Lebensmitteln hinwiederum trifft man die Nieswurz an. Auch Eisenhut trügt und täuscht häufig den Sammler. Doch das wäre so, als wollte man die Erde tadeln, weil nicht alle Menschen gut sind. Indes höre, was noch mehr heißt: Nicht einmal alle Engel im Himmel blieben gut; auch die Sonne macht durch ihre übermäßige Hitze die Ähren dorren, das erste Wachstum der keimenden Saat aber verdorren; der Mond desgleichen zeigt den Pilgern den Pfad, fristet aber den Räubern die Zeit zu Nachstellungen. Wäre es nun anbetrachts der Geschöpfe, die uns frommen, recht, mit dem Lobpreis auf des Schöpfers Huld zurückzuhalten und wegen der paar Schädlinge unter den Lebensmitteln des Schöpfers Fürsorge herabzusetzen? Als ob wirklich alle Dinge nur der Gaumenlust wegen hätten erzeugt werden müssen! Oder als ob das so wenig wäre, was Gottes gnädige Hand unserem Bauche dargeboten! Wir haben unsere bestimmten Speisen, allen sind sie bekannt: Genuß sollen sie erzeugen und Wohlfahrt für den Leib.</p><p>Alles aber, was der Erde entsproßt, hat seine besondere Zweckbestimmung und trägt nach Kräften bei zur Vollendung der Gesamtschöpfung. Die einen Erzeugnisse dienen zur Nahrung, andere zu anderweitigem Gebrauch. Nichts ist umsonst, nichts unnütz, was die Erde sproßt. Was dir nutzlos dünkt, nützt anderen, ja nützt häufig dir selbst bei anderweitigem Gebrauch. Was nicht zur Speise dient, wirkt als Heilmittel, und oftmals bietet das nämliche, was für dich schädlich ist, Vögeln und wilden Tieren eine unschädliche Nahrung. So verzehren die Stare, ohne daß es ihnen schadet, den Schierling, indem sie durch ihre physische Beschaffenheit gegen den tödlichen Giftsaft gefeit sind. Dieser Saft nämlich erzeugt ein Frösteln, das sie überschauert. Bevor ihn nun die feinen Poren in die Herzkammer leiten, treiben sie ihn noch rechtzeitig, ehe er die Lebensorgane gefährdet, auf dem Wege der Verdauung ab. Kenner der Nieswurz aber behaupten, sie diene den Wachteln zu Fraß und Futter, indem diese infolge ihrer glücklichen natürlichen Körperbeschaffenheit der Wirkung der schädlichen Speise entgehen. Wenn sich dieselbe nämlich gar häufig als Medizin zur Heilung des menschlichen Leibes zubereiten läßt, dem sie doch an sich schädlich zu sein scheint, wieviel mehr muß sie, die durch die Hand des Arztes zum Heilmittel sich wandeln läßt, kraft ihrer natürlichen Beschaffenheit ein zuträgliches Nahrungsmittel sein? Ebenso verschafft die Mandragora (Alraun) häufig denen, die am Übel der Schlaflosigkeit leiden, Schlaf. Was soll ich vom Mohnsaft reden, der auch bei uns bekannt geworden ist und fast täglich als Betäubungsmittel bei recht heftigen innerlichen Schmerzen gebraucht wird. Auch das ist nicht unbekannt, daß auf Schierling schon oft das Toben der sinnlichen Begierden sich legte und mit Nieswurz alte Leiden eines siechen Körpers gehoben wurden.</p><p>Es liegt also in diesen Giftpflanzen nicht bloß kein Grund zum Tadel des Schöpfers vor, sondern vielmehr ein Anlaß zu erhöhtem Dank, da ja das Erzeugnis, in welchem du nur Gefahr vermutetest, ein wirksames Heilmittel für deine Gesundheit ist. Dem Gefährlichen läßt sich durch Vorsicht aus dem Wege gehen, des Heilsamen geht man bei Achtsamkeit nicht verlustig. Oder haben Schafe und Ziegen, was ihnen schädlich ist, erst meiden lernen müssen? Verstehen sie nicht, obschon sie unvernünftige Tiere sind, vernünftigerweise mit dem bloßen Geruchsinn infolge eines geheimen Naturinstinktes der Gefahr auszuweichen und das Leben zu schützen? Und wissen sie nicht zwischem dem Schädlichen und Nützlichen gleicherweise zu unterscheiden, so daß sie, wie man sich erzählt, falls sie sich von giftgetränkten Geschossen getroffen fühlen, wohlbekannte Kräuter aufsuchen und daraus ein Heilmittel für die Wunde sich verschaffen? Die Nahrung selbst dient ihnen zur Arznei: Die Pfeile sieht man aus der Wunde treten, das Gift entweichen, nicht mehr schleichen. So ist auch dem Hirsche die Speise ein Gegengift. Die Schlange flieht den Hirsch, tötet den Löwen. Eine Riesenschlange umschlingt den Elefanten. Sein Sturz würde den Tod der Siegerin bedeuten. Mit äußerster Kraftanstrengung wird darum beiderseits der Kampf geführt. Erstere sucht den Fuß des letzteren zu umschnüren, weil so des Umwundenen Fall ihr nicht schaden könne. Dieser trachtet, daß er nicht als letzter oder nicht an einem Engpaß am Hinterfuß angefallen werde, wo er weder selbst sich wenden und mit einem starken Fußtritt die Schlange zerstampfen, noch von einem nachkommenden Elefanten Hilfe erlangen könnte.</p><p>Wenn nun die unvernünftigen Tiere die Kräuter kennen, mit welchen sie Heilung, die Mittel, mit welchen sie Hilfe sich schaffen: sollte der Mensch mit dem ihm angeborenen vernünftigen Sinn es nicht? Oder sollte er der Wirklichkeit so fremd gegenüberstehen, daß er gar nicht einsieht, was sich jeweils zum Gebrauch eignet? Oder wollte er für die Gaben der Natur so undankbar sein und glauben, es hätte, weil ein Schluck Stierblutes für den Menschen todbringend ist, das Zugtier entweder gar nicht ins Dasein oder aber ohne Blut ins Leben treten sollen? Und doch ist seine Kraft ― so nützlich für den Ackerbau, so tauglich für den Wagendienst, so köstlich zum Genusse ― in mannigfacher Dienstleistung eine starke Stütze für die Landleute. Diesen hat Gott überhaupt, „wenn sie ihre Güter erkennen wollten“, mit den Worten: „Es sprosse die Erde das Grün des Grases, Samen treibend nach seiner Art“ alles geschenkt. Er meinte nämlich darunter nicht bloß die von selbst sich darbietende Nahrung, wie sie an Kräutern, Bäumen und sonstigen Fruchtpflanzen hängt, sondern auch die durch wirtschaftlichen Fleiß gewonnene und durch ländlichen Ackerbau mühsam erworbene.</p><p>[Forts. v. ] Wie geziemend aber, daß Gott die Erde nicht mit einem Male Samen und Frucht hervorbringen hieß, sondern bestimmte, es sollten die Gefilde erst keimen, dann sprossen, hierauf die Saat ihrer Art entsprechend heranreifen, so daß es den Feldern zu keiner Zeit an Anmut gebräche! Erst sollten sie in lieblicher Pracht erblühen, dann der Früchte Segen spenden.</p><p><strong>Lolch und Unkraut überhaupt spezifische Pflanzenarten. Das Schöpferwort: “es sprosse die Erde” weckte eine Fruchtbarkeit, welche die Erde nach dem Sündenfall nicht mehr schaute. Sie muß seitdem dem Boden abgerungen werden. Zum Teil bietet die Erde auch jetzt noch von selbst die Fülle des Fruchtsegens.</strong></p><p>Doch vielleicht möchte jemand einwenden: Wie bringt denn die Erde Samen „nach seiner Art“ hervor, nachdem doch der ausgestreute Same gar vielfach aus der Art schlägt: wenn eine gute Weizensorte gesät wurde, eine mindere Farbe und minderwertige Form daraus erzielt wird? Indes ist dieser Fall, wenn er dann und wann eintritt, augenscheinlich nicht auf eine Artveränderung, sondern auf eine krankhafte und anormale Beschaffenheit des Samens zurückzuführen. Denn der Weizen hört nicht auf, Weizen zu sein, wenn er entweder bei Kälte brandig wird oder unter Nässe fault. Die Änderung ist mehr am Aussehen als an der Art, sowie desgleichen an der Farbe und infolge der Verkümmerung vor sich gegangen. So nimmt ja häufig Getreide, das unter Nässe gelitten, sein ursprüngliches Aussehen wiederum an, wenn es an der Sonne oder am Feuer trocknet oder unter der pflegenden Hand der fleißigen Landleute an der milden Luft oder im fetten fruchtbaren Boden neubelebt wird. So verjüngt sich in der folgenden Generation der Same, der in der vorausgehenden degenerierte. Wir brauchen darum nicht fürchten, daß jene Anordnung Gottes, die zum ständigen Naturgesetze ward, in der Folgezeit etwa durch mangelnde Fortpflanzung eingebüßt hat: heute noch wird im Samen die (ursprüngliche) unverfälschte Art bewahrt.</p><p>Daß man Lolch und die übrigen unechten Samenarten, die sich häufig unter den Feldfrüchten vorfinden, Unkraut nennt, ersehen wir aus dem verlesenen Evangelium. Sie stellen indes eine eigene Art dar, nicht eine verkümmerte Natur, die sie angenommen haben, indem sie etwa, zum Schlechteren sich verändernd, aus Weizensamen in eine andere Samenart übergingen. Dies lehrt ja auch der Herr, wenn er spricht: „Das Himmelreich ist gleich einem Manne, der guten Samen auf seinen Acker säte. Während aber die Leute schliefen, kam sein Feind und säte darüberhin Unkraut unter den Weizen“. Wir ersehen doch daraus, daß Unkraut und Weizen wie dem Samen so der Art nach augenscheinlich verschieden sind. Es sprechen denn auch die Knechte zum Hausvater: „Herr, hast du nicht guten Samen auf deinen Acker gesät? Woher hat er also das Unkraut? Und er sprach: Ein feindlicher Mensch hat das getan“. Ein anderer ist der Same des Teufels, ein anderer der Same Christi, der gesät wird zur Gerechtigkeit. Ist doch auch eine andere die Saat, die der Menschensohn, eine andere die, welche der Teufel ausstreute. In dem Grade ist die Natur beider Samenarten verschieden, als der (eine) Sämann das Gegenteil (vom andern) ist. Was Christus sät, ist das Reich Gottes, was der Teufel sät, ist die Sünde. Wie könnte denn das Reich und die Sünde ein und derselben Art sein? „Also, heißt es, ist das Reich Gottes, wie wenn jemand Samen auf die Erde streut“.</p><p>Es gibt auch einen Sämann, der das Wort sät. Von ihm steht geschrieben: „Der, welcher sät, sät das Wort“. Dieser Sämann hat das Wort über die Erde gesät, als er sprach: „Es sprosse die Erde das Grün“. Und sogleich sproßten hervor die Keime in der Erde, und mannigfacher Art waren die Dinge, die zum Vorschein kamen. Hier bot der Wiesen anmutiges Grün überreiche Weide, dort goldene Ährenfelder mit ihrer schwankenden übervollen Saat das Bild des wogenden Meeres. Von selbst bot die Erde alle Frucht dar. Konnte auch ohne den Pflüger ― es war ja noch kein Ackersmann erschaffen ― kein Pflug sie furchen: ungepflügt doch prangte sie in überreichen fetten Saaten und, wie ich nicht zweifle, noch in größerer Fruchtfülle (als nachmals), da ja noch keine Lässigkeit des Ackerbauers ihre Fruchtbarkeit beeinträchtigen konnte. Jetzt entspricht, wohin der Blick auf bebautes Land fällt, die Fruchtbarkeit, die einer erzielt, dem Verdienste seiner Arbeit: bei Nachlässigkeit oder Fahrlässigkeit, bei Regenschauer, anhaltender Dürre des Bodens, Hagelschlag oder welcher Ursache immer straft ihn der ergiebige Boden mit Unfruchtbarkeit. Damals aber erfüllte die Erde alle Lande mit Früchten, die sie von selbst hervorbrachte, weil es derjenige befohlen hatte, der die Fülle von allem ist. Das Wort Gottes weckte die Fruchtbarkeit auf dem Festlande. Dazu war die Erde noch von keinem Fluch getroffen. Denn weiter als unsere Sünden liegen die Anfänge der werdenden Welt zurück, jünger ist die Schuld, derentwegen wir verurteilt wurden, „im Schweiße unseres Angesichtes das Brot essen“, ohne Schweiß der Nahrung entbehren zu müssen.</p><p>[Forts. v. ] Doch entfaltet endlich auch heute noch der Erde Fruchtbarkeit das reiche Wachstum von ehedem, indem sie von selbst ihres Schoßes Fülle öffnet. Denn wie viele Erzeugnisse gibt es nicht, die jetzt noch von selbst wachsen! Aber sogar auch in jenen, welche der Arbeit Frucht sind, warten großenteils nur Gottes Gaben unser: so gerade im Getreide, das herangedeiht, während wir ruhen. Das lehrt auch das Gleichnis des vorliegenden Lesestückes, worin der Herr spricht: „Also ist das Reich Gottes, wie wenn jemand Samen auf die Erde streut. Er mag“, fährt er fort, „schlafen oder aufstehen bei Tag und bei Nacht: der Same keimt und wächst auf, ohne daß er es wahrnimmt. Die Erde trägt von selbst Frucht, zuerst den Halm, dann die Ähre, endlich die volle Frucht in der Ähre. Und wenn sie die Frucht hervorgebracht hat, so legt er alsbald die Sichel an, weil die Ernte da ist“. Während du also schläfst, o Mensch,und nichts davon merkst, bringt die Erde von selbst ihre Früchte hervor. Du schläfst und stehst auf und staunst, wie das Getreide über Nacht zugesetzt hat.</p><p><strong>Die Rose ursprünglich ohne Dornen, nachmals mit Dornen: ein Bild des Menschenlebens.</strong></p><p>Wir haben vom Grün des Grases gesprochen. Jetzt wollen wir sprechen von den <em>“Fruchtbäumen, welche Frucht bringen nach ihrer Art, deren Samen in ihnen selbst ist“</em>. „Er sprach und sie waren“, und mit einem Male prangte die Erde, wie vorher im Blumenschmuck und frischem Grün der Kräuter, so jetzt im Schmuck der Wälder. Bäume an Bäume reihten sich, Wälder an Wälder erhoben sich, die Höhen der Berge bedeckten sich plötzlich mit Laub. Hier strebte eine Pinie, dort eine Zypresse zur Höhe auf. Zedern und Kiefern gesellten sich dazu. Die Tanne desgleichen schoß auf: nicht zufrieden, die Wurzeln in den Boden zu schlagen, den Wipfel in die Luft zu tragen, wollte sie mit sicherem Ruderschlag den Gefahren des Meeres trotzen und nicht bloß mit den Stürmen, sondern auch mit den Wogen kämpfen. Der Lorbeer auch, der nie sein Kleid ablegen sollte, wuchs empor und verbreitete seinen Duft. Desgleichen trugen schattige Steineichen ihren Wipfel in die Luft. Auch sie sollten ihr struppiges Laub künftig bewahren. Jene eigenartige Ausstattung nämlich, welche die Natur im Augenblick der Weltentstehung empfing, behielt sie für allzeit in den Einzeldingen bei. Sonach bleibt den Eichen, bleibt den Zypressen ihr Vorzug gewahrt, daß kein Sturm sie ihres Laubgewandes beraubt.</p><p>Ohne Dornen war ehedem die Rose unter den Blumen der Erde emporgewachsen und ohne Falsch blühte der Blumen schönste; nachher umzäunte sie ihrer Blüte Anmut mit dem Dorn: ein Spiegelbild des Menschenlebens, das die süße Lust seines Tuns und Treibens so oft durch der Sorgen nachbarliche Stacheln in stechenden Schmerz wandelt. Denn wie von einem Walle, wie von einem Zaune quälender Sorgen ist unseres Lebens holder Reiz eingeschlossen, so daß Lust und Trauer sich nahe berühren. Mag einer der köstlichen Gabe der Vernunft oder eines fortgesetzt glücklicheren Lebenslaufes sich freuen, soll er sich billig der Schuld erinnern, um derentwillen durch rechtskräftiges Strafurteil Dornen im Geiste und Stacheln im Herzen unser Teil wurden, nachdem wir zuvor in des Paradieses Wonne blühten. Magst du also im Ruhmesglanz des Adels strahlen, o Mensch, oder durch Hoheit der Macht oder durch Glanz der Tugend: stets steht dir der Dorn, stets der Stachel in nächster Nähe, stets denk an das Niedere in dir! Zwischen Dornen blühst du empor und nicht lange währt die Anmut: rasch entfliehen die Jahre und welkt einer in der Blüte dahin.</p><p>[Forts. v. ] Wahrlich du weißt: wie mit der Blume die Vergänglichkeit, so teilst du mit dem Weinstock die Freude. Von ihm kommt der Wein, an dem des Menschen Herz sich freut. O daß du, o Mensch, ein derartiges Vorbild nachahmen möchtest, um auch selbst dir der Freude und des Frohsinns Frucht zu ziehen! In dir selbst ruht die Süßigkeit deiner Lust und Wonne, aus dir blüht sie hervor, in dir verbleibt sie, in deinem Inneren besitzest du sie, in dir selbst hast du den Frohsinn deines Gewissens zu suchen. Darum die Aufmunterung: „Trink Wasser aus deinen eigenen Gefäßen und aus deiner Brunnen Quellen!“</p><p>Allererst gibt es nichts Lieblicheres als den Duft eines blühenden Weinstocks: gibt doch der aus der Blüte reifende, gekelterte Saft einen Trank, der dem Genuß und der Gesundheit zugleich frommt. Sodann, wer müßte nicht staunen, wie aus dem Weinbeerkern ein Rebstock bis zur vollen Wipfelhöhe eines Baumes hervorsproßt, letzteren sozusagen kosend umfängt, wie mit Händen umklammert und mit Armen umschlingt, mit Rankenlaub kleidet, mit Traubengewinden kränzt? Ein Vorbild unseres Lebens senkt er zuerst die lebenskräftige Wurzel in den Boden, umfaßt sodann, weil er von Natur schwächlich und hinfällig ist, wie mit Armen alles, was er erreicht, rankt sich daran empor und schwingt sich in die Höhe.</p><p>Ihm gleicht das Volk der Kirche, das gleichsam mit des Glaubens Wurzel gepflanzt und mit der Demut Senker gezogen wird; von dem der Prophet so schön spricht: „Einen Weinstock siedeltest Du aus Ägypten herüber und pflanztest seine Wurzeln, und vollbedeckt ward das Land. Berge überdeckte sein Schatten und seine Zweige die Zedern Gottes. Er dehnte seine Ranken bis an das Meer und bis an den Strom seine Schößlinge“. Und durch Isaias [Jesaja] hat der Herr selbst gesprochen: „Ein Weinberg ward meinem Lieblinge auf der Höhe an ergiebiger Stelle. Und ich führte eine Mauer und führte einen Graben um den Sorekweinberg herum und erbaute einen Turm in seiner Mitte“. Wie mit einem Walle umgab er ihn nämlich mit himmlischen Geboten und mit der Engel Hut. Denn „lagern wird sich der Engel des Herrn rings um jene, die ihn fürchten“. Er stellte in die Kirche sozusagen den Turm der Apostel, der Propheten und Lehrer, welche die Friedenswehr der Kirche zu sein pflegen. „Er zog einen Graben um sie herum“, als er von ihr den schwerlastenden Wust der irdischen Sorgen nahm; nichts belastet ja den Geist mehr als die weltliche Sorge und die Sucht sei es nach Geld- oder sei es nach Machtbesitz. Den Beweis hierfür hast du im Evangelium, wenn du liest, wie jene Frau, welche den Geist der Schwachheit hatte, zusammengekrümmt war, so daß sie nicht aufzublicken vermochte. Gekrümmt war nämlich ihre Seele, weil sie auf irdischen Gewinst gerichtet war und den Blick für die himmlische Gnade verloren hatte. Da sah Jesus das Weib an und rief es, und sogleich entledigte es sich des Irdischen, das sie beschwerte. Mit solchen irdischen Gesinnungen waren auch, wie er zeigt, jene belastet, zu welchen er sprach: „Kommet zu mir alle, die ihr mühselig und beladen seid, und ich werde euch erquicken“. So atmete und richtete sich denn die Seele jener Frau von neuem auf, nachdem so gleichsam um sie gegraben war.</p><p>Doch der nämliche Weinstock wird, nachdem er rings umgraben ist, auch in die Höhe gebunden, daß er nicht zur Erde niederhänge. Die Rebzweige werden teils zurückgeschnitten, teils wachsen gelassen: zurückgeschnitten werden die Schößlinge, die zwecklos treiben und wuchern; wachsen gelassen jene, die der kundige Pflanzer für triebkräftig hält. Was soll ich des näheren hinweisen auf die Pfahlzeilen und die zierliche Rankenbindung? Sie gemahnen wahr und klar an die Gleichheit, die in der Kirche festzuhalten ist. Kein Reicher und Hochgestellter darf sich da überheben, kein Armer verächtlich und kein Niedriger wegwerfend von sich denken. Allen fromme in der Kirche die gleiche und eine Freiheit, allen widerfahre die gemeinsame Gerechtigkeit und Gnade! Darum der Turm in ihrer Mitte. Er soll rings in die Runde das Beispiel von jenen Landleuten, von jenen Fischern hinaustragen, die der Tugenden Feste zu behaupten das Verdienst hatten. An ihrem Beispiele soll unsere Gesinnung sich aufrichten und nicht niedrig und verächtlich am Boden haften, eines jeglichen Geist soll vielmehr sich emporschwingen, um das kühne Wort nachzusprechen: „Unser Wandel aber ist im Himmel“. Damit kein Sturm der Welt ihn niederwerfen, kein Ungewitter ihn zu Boden schlagen könne, umfängt er mit jenen seinen Ranken und Ringeln wie mit Armen der Liebe jeden, der ihm naht, und ruht aus in der Verbindung mit ihm. Die Liebe also ist es, die uns an das Höhere bindet und in den Himmel verpflanzt; denn „wer in der Liebe bleibt, in dem bleibt Gott“. Darum auch des Herrn Mahnung: „Bleibet in mir und ich in euch! Gleichwie die Rebe keine Frucht bringen kann aus sich, wenn sie nicht am Weinstocke bleibt, so auch ihr, wenn ihr nicht in mir bleibt. Ich bin der Weinstock, ihr seid die Reben“.</p><p>Damit nun gab er deutlich zu verstehen, wir sollten das Beispiel des Weinstockes zu unserer Lebensunterweisung heranziehen: Erstlich nun hindert man denselben, in der warmen Frühlingsluft Knospen, sodann an den Blattwinkeln Frucht anzusetzen, weil eine Traube daraus entsteht und sich formt und allmählich entwickelt mit dem säuerlichen Geschmack eines unreifen Erzeugnisses; denn süß kann nur die vollreife und gekochte Traube munden. Inzwischen schmückt sich der Weinberg mit grünem Laubgewande, das ihm nicht geringen Schutz gegen Kälte und jegliche Unbill gewährt und gegen die Sonnenhitze deckt. Was aber gäbe es für ein schöneres Schauspiel oder einen süßeren Genuß als den Anblick des hängenden Traubengewindes, gleichsam des Schmuckgehänges des reizenden Geländes, und die Lese der gold- und purpurschimmernden Traubenfrucht? Hyazinth und anderes Edelgestein glaubt man funkeln, Indigoblau leuchten, Weißperlenglanz blitzen zu sehen. Und du, o Mensch, willst die warnende Stimme daraus nicht vernehmen, daß der jüngste Tag nicht unreife Früchte an dir treffen und der Erntetag des vollreifen Lebens nicht unzeitige Werke aufweisen darf. Denn unreife Frucht schmeckt allzu bitter, süß kann nur munden, was zur vollen Reife herangewachsen ist. Einem solchen vollkommenen Menschen pflegt weder die schauerliche Todeskälte noch die Hitze der Leidenschaft zu schaden, da ihm die geistliche Gnade Kühlung weht und alle Glut weltlicher Lust und fleischlicher Begierlichkeit löscht, ihrem Brand wehrt. Preisen soll dich, wer nur immer dich schaut und die Scharen der Kirche wie Traubengehänge an Rebzweigen dich bewundern! Schauen soll jeglicher unter den Gläubigen der Seelen herrliches Geschmeide, sich ergötzen an der Reife der Einsicht, am Glanz des Glaubens, an der Herrlichkeit des Bekenntnisses, an der Schönheit der Gerechtigkeit, an der Fülle der Barmherzigkeit, so daß man dir zuruft: „Deine Gattin ist wie ein fruchtbarer Weinstock an den Wänden deines Hauses“, weil du die Fülle des fruchttragenden Weinstockes durch Ausübung reichlich spendender Freigebigkeit nachahmst.</p><p><strong>Große Mannigfaltigkeit der Bäume und ihres Schmuckes. Geschlechtsverschiedenheit und Befruchtung der Bäume (Palme). Künstliche Befruchtung (Kaprifikation, Pfropfreis). Vom Obste. Das Obst eine gesunde Kost, eine natürliche Arznei, neben den Kräutern das älteste Heilmittel der Menschen.</strong></p><p>Doch wie dürfte ich beim Weinstock allein stehen bleiben, da doch sämtliche Arten von Bäumen nutzbar sind? Die einen traten als Fruchtbäume ins Dasein, andere wurden als Nutzholz verliehen. Denn auch jene, welche keine reichere Frucht tragen, lassen sich umso wertvoller verwenden. So eignet sich die Zeder zur Aufrichtung von Dachgiebeln; denn solches Bauholz läßt sich über weite Räume spannen und drückt nicht schwer auf das Mauerwerk. Zur Deckentäfelung desgleichen und zur Ausschmückunng des Vordergiebels paßt Zypressenholz. Daher spricht auch die Kirche im Hohen Liede: „Das Gebälke unserer Behausung sind Zedern, unser Getäfel Zypresse“. Auf denen, will sie sagen, beruht der zierliche Schmuck ihres Giebelbaues, die wie Balken mit ihrer Tugendkraft den Hochbau der Kirche stützen und ihre Front schmücken. ― Lorbeer und Palme sind Sinnbild des Sieges: der Lorbeer bekränzt des Siegers Haupt, die Palme in der siegreichen Hand ist sein Schmuck. Daher jubelt auch die Kirche: „Ich habe es gesagt, hinaufsteigen will ich auf die Palme und erfassen ihre Höhen“. Sie schaut die Erhabenheit des Wortes, und voll Zuversicht, zu seiner Höhe und zum Gipfel seiner Weisheit emporsteigen zu können, spricht sie: „Ich will hinaufsteigen auf die Palme“. Alles Niedrige will sie zurücklassen und nach dem Höheren streben, in die Arme Christi, um seine süße Frucht zu pflücken und zu kosten; denn süß ist der Tugend Frucht. ― Worauf anders ferner deutet mystisch die Pappel, der schattige Baum mit der Siegeskrone, und die gefügige, zum Binden der Reben sich eignende Weide als auf den Segen der Bande Christi, die nicht schaden, der Bande der Gnade, der Bande der Liebe, so daß jeder seiner Bande sich rühmen darf, wie Paulus sich rühmt mit den Worten: „Paulus, der Gefesselte Jesu Christi“? In diese Fesseln geschlagen pflegte er auszurufen: „Wer soll uns scheiden von der Liebe Jesu Christi?“ ― in die Fesseln der Entsagung, in die Fesseln der Liebe geschlagen. In diese Fesseln geschlagen bekennt auch David: „An die Weiden in ihrer Mitte hingen wir unsere Harfen auf“. ― Der Buxbaum desgleichen, der mit seinem weichen Holze sich vorteilhaft zum Schnitzen von Buchstaben eignet, lehrt die Kinderhand. Darum das Schriftwort: „Schreib es in Buxbaum!“ Zugleich soll das Schreibmaterial, das immer grün ist und nimmer sein Laub verliert, dich gemahnen, daß du niemals deine Hoffnung aufgebest und ablegest, sondern daß dir immerdar durch den Glauben die Hoffnung des Heils erblühe.</p><p>[Forts. v. ] Was sollte ich aufzählen, wie groß die Mannigfaltigkeit unter den Bäumen ist? Wie abwechslungsreich und schön der Schmuck jedes einzelnen Baumes? Wie breitästig die Buche ist, wie schlank die Tanne, wie nadelreich die Pinie, wie schattig die Eiche, wie doppelfarbig die Pappel, wie dichtbelaubt und neu sich verjüngend die Kastanie, die, sobald sie gefällt ist, fast einen Wald neuer Sprößlinge zu treiben pflegt? Wie sich selbst auch an den Bäumen ein hohes oder jugendliches Alter unterscheiden läßt? Die jüngeren haben schmächtigere Zweige, ältere strecken kräftigere und knorrige Arme aus; erstere tragen glatte und flache Blätter, letztere mehr zusammengeschrumpfte und rauhe. Auch gibt es Bäume, die aus ihrem altersschwachen und abgestorbenen Wurzelstocke, wenn sie gefällt werden, keinen neuen Nachwuchs zu treiben vermögen; andere, denen frische Jugendkraft und größere natürliche Fruchtbarkeit eignet, denen die fällende Axt mehr frommt denn schadet, so daß sie von neuem nachsprossen und in vielen Schößlingen sich verjüngen und fortvererben.</p><p>Merkwürdigerweise ist sogar auch in den Obstbäumen eine Geschlechtsanlage, ist in den Bäumen ein Geschlechtsunterschied vorhanden. So kann man wahrnehmen wie die Palme, welche die Dattelfrucht hervorbringt, so manchmal ihre Äste zu einem Baum herabläßt, den die Landkinder Palmmännchen nennen, sich darunter neigt und eine Art Geschlechtsverlangen und -verkehr an den Tag legt. Sie ist sonach die weibliche Palme und verrät durch dieses Sichherabneigen ihr Geschlecht. Daher streuen die Pflanzer von Palmenhainen über die Palmzweige männlichen Dattel- oder Palmensamen, durch welchen in jenem weiblichen Baume eine Art instinktmäßige Geschlechtsbetätigung geweckt und die ersehnte Geschlechtsbefriedigung geboten wird. Damit beglückt, richtet er sich wiederum auf, streckt seine Zweige aufwärts und trägt seine Fächerkrone zur früheren Höhenlage empor.</p><p>Auch über den Feigenbaum herrscht die gleiche Ansicht. Man bindet vielfach, wie es gerüchtweise heißt, den wilden Feigenbaum an der zahmen Edelfeige entlang, weil sonst die Frucht dieser zahmen Edelfeige durch irgendwelche schädliche Einwirkung sei es der Luft sei es der Hitze zur Erde fallen soll. Wer darum von diesem Mittel weiß, bindet die Feigen des wilden Baumes an jenen Fruchtbaum und heilt ihn von seiner Schwäche, so daß er seine Frucht, die ohne das künstliche Mittel abfallen würde, zu behalten vermag. Wie aus einem Naturrätsel spricht daraus die Mahnung zu uns, jene, die von unserem Glauben und unserer Gemeinschaft getrennt leben, nicht zu meiden. Es kann ja ein Heide, der gewonnen wird, aus einem leidenschaftlichen Anhänger des Irrtums ein umso eifrigerer Verteidiger des Glaubens werden. Und ein Irrgläubiger, der sich bekehrt, mag doch gewiß jene Seite (des Glaubens) verfechten, der er sich nach Änderung seiner Anschauung zuwandte, insbesondere dann, wenn er etwa ein besonderes natürliches Geschick besitzt, seiner Überzeugung lebendig Ausdruck zu geben, wenn Nüchternheit, deren er sich befleißigt, und Keuschheit, die er beobachtet, ihn empfiehlt. So bemühe dich denn um ihn, um womöglich gleich jener Fruchtfeige aus der unmittelbaren Nähe und Verbindung mit jenem wilden Baume Stärkung deiner eigenen Tugendhaftigkeit zu erzielen. So wird dir nämlich einerseits das eigene Tugendstreben nicht erlahmen, andrerseits die Frucht der Liebe und des Wohlwollens aufbewahrt bleiben.</p><p>Wie viele Tatsachen aber sprechen dafür, daß sich der natürlichen Sprödigkeit eines Dinges durch Fleiß und Eifer begegnen lasse. Ein Beispiel hierfür bietet der Landbau. Gar manchmal nämlich blüht der Granatapfelbaum zu rasch auf und vermag dann, wenn nicht Sachkundige ihm durch geeignete Mittel sorgsame Pflege angedeihen lassen, keine Frucht hervorzubringen. Gar manchmal schwindet seine innere Saftfülle dahin, während äußerlich sein Aussehen einen prächtigen Anblick gewährt. Man vergleicht dasselbe nicht mit Unrecht mit der Kirche. So findet sich im Hohen Liede in Hinblick auf die Kirche die Wendung: „Wie die Schale des Granatapfels sind deine Wangen“; und im folgenden (die Frage): „Ob wohl blühe der Weinstock, blühen die Granatäpfel“. Die Kirche nämlich strahlt den hehren Glanz des Glaubens und des Bekenntnisses aus, herrlich schimmernd vom Blute so vieler Märtyrer und, was noch mehr besagt, beglückt mit dem Blute Christi. Mit diesem Fruchtgenuß wahrt sie zugleich noch eine Menge Früchte unter gleich sorgfältiger Hut in ihrem Schoße und vereinigt in ihrer Hand tausend Bemühungen auf dem Feld des Tugendlebens: der Weise müht sich ja in stiller Geistesarbeit.</p><p>Auch den Mandelbaum soll der Landmann, um aus dessen bitterer Frucht süße zu erzielen, folgendermaßen behandeln: Er bohrt die Wurzel dieses Baumes an und pfropft ihr ein Reis von jenem Baum auf, den die Griechen * πεύκη* [peukē], wir Pechföhre nennen. Durch dieses Verfahren nämlich wird seinem Safte die Bitterkeit genommen. Wenn nun schon der Landbau die Beschaffenheit eines Wurzelstockes verändern kann, sollte nicht auch Streben nach Erkenntnis und Zuchtbeflissenheit krankhafte Leidenschaften aller Art dämpfen können? Niemand, der auf der Jugend oder der Unenthaltsamkeit schlüpfrigem Pfade steht, gebe demnach die Hoffnung auf seine Bekehrung auf! Holz läßt sich so häufig für bessere Zwecke ändern: Menschenherzen sollen sich nicht wandeln lassen?</p><p>[Forts. v. ] Wir haben nicht bloß gezeigt, wie an verschiedenen Baumsorten eine Verschiedenheit der Früchte hervortritt, sondern wie vielfach an gleichartigen Bäumen ungleichartige Früchte reifen. So ist die männliche Frucht spezifisch von der weiblichen verschieden, wie wir es von den Datteln bereits oben erwähnten. Wer aber könnte die Mannigfaltigkeit, Pracht und Lieblichkeit des Obstes vollauf würdigen, desgleichen die Nützlichkeit jeder Fruchtsorte und die Säfte, die dem Obste eignen? Es scheint für jeden Gebrauch tauglich zu sein. Wie heilsam ist nicht säuerliches Obst für erkrankte innere Organe des Menschen? Wie lindernd wirkt es nicht bei innerer Blähung und Störung? Wie läßt sich nicht hinwiederum das Herbe der Bittersäfte mittels süßer Obstessenzen mildern? War doch jene Heilkunst, welche mit Kräutern und Säften kurierte, die ursprüngliche. Und keine kräftigere Gesundheit gibt es als jene, die auf gesunder Kost beruht. So sagt uns denn schon die natürliche Erfahrung: die Kost allein ist Arznei für uns. In der Tat durch Kräuter lassen sich offene Wunden schließen, durch Kräuter innerliche ausheilen. Aufgabe der Ärzte ist es darum, die Heilkräfte der Kräuter zu studieren; denn von da nahm die Heilpraxis, die sich einführte, ihren Ausgang.</p><p><strong>Feineres Obst durch stärkeres Blattwerk geschützt. Zweckmäßigkeit und Schönheit des Rebenblattes, des Siegespreises über der Traubenfrucht; Form und Zweckmäßigkeit des Feigenblattes, Verschiedenheit der Blätter.</strong></p><p>Um indes die Rede wiederum auf das gewöhnliche Obst zu bringen, so gibt es teils Sorten, die an der Sonne reifen, teils Sorten, welche in Schalen und Hülsen verschlossen zur Vollreife gelangen. Äpfel und Birnen, desgleichen sämtliche Traubensorten, sind offen der Sonne ausgesetzt, Wal- und Haselnußfrucht sowie der Fruchtkern der Pinie durch Schale und Schuppenhülse verdeckt. Gleichwohl bedarf auch ihre Frucht der Sonnenwärme, und so sehr die Pinienfrucht im tiefen Schatten der Pinie sich birgt, so sehr bedarf sie doch der nährenden Sonnenwärme.</p><p>Wie groß ferner ist des Herrn Vorsehung, daß da, wo eine feinere Frucht heranreift, dichtes Blattwerk dem Obst eine stärkere Schutzhülle beut, wie wir es bei der Feigenfrucht beobachten! Zartere Dinge bedürfen eines stärkeren Schutzes; so lehrt es der Herr selbst, wenn er durch Jeremias beteuert: „Wie diese gute Feigenfrucht will ich die Gefangenen aus Juda, die ich in das Land der Chaldäer wegführen ließ, wieder anerkennen zum Guten und meine Augen heften auf sie zum Guten“. Als etwas Zartes umgab sie der Herr mit der starken Hülle seiner Barmherzigkeit, daß die zarte Frucht nicht vorzeitig zugrunde ginge. So spricht er denn auch im folgenden von ihnen: „Meine Zarten wandelten rauhe Wege“. Und nachher mahnt er sie: „Seid standhaft, Kinder, und rufet zum Herrn!“ Das allein ist das unverwüstliche Deckblatt, die undurchdringliche Schutzhülle wider alle Stürme und Unbilden. Wo also zarte Frucht, dort stärkere Hülle, stärkerer Schutz der Blätter. Aber auch umgekehrt: wo kräftigere Frucht, dort zartere Blätter, wie der Apfelbaum es zeigt. Denn ein kräftigerer Apfel bedarf nicht viel der schirmenden Hülle. Gerade die allzu dichte dunkle Hülle könnte dem Apfel mehr schaden.</p><p>Das Rebenblatt mag uns sodann über die Schönheit der Natur und über die inneren Geheimnisse der göttlichen Weisheit aufklären. Wir sehen es nämlich so gespaltet und geteilt, daß es eine dreiblätterige Form aufzuweisen scheint. So tief ist das Mittelstück eingeschnitten, daß es, würde es nicht mit dem unteren Teile noch zusammenhängen, dem Beschauer wie abgetrennt erschiene. Das aber ist sichtlich die natürliche Zweckbestimmung, die damit gewahrt ist: einerseits der Sonne leichteren Zutritt zu verschaffen, andrerseits schützenden Schatten zu gewähren. Sodann ist das Mittelstück etwas länglich gestreckt und verjüngt sich oben an der Spitze, so daß es mehr den Eindruck eines Zierstückes als Deckblattes macht. Es scheint nämlich der Form nach einen Siegespreis darzustellen, sinnbildend, daß der Traube unter allen Hängefrüchten der Vorrang gebührt. Durch einen stillen Schiedsspruch der Natur, der sich aber deutlich verrät, trägt sie von Haus aus das Bild und Merkmal des Sieges an sich. So führt sie denn ihren Siegespreis (das Blatt) mit sich: er gewährt ihr einerseits gleicherweise Schutz gegen die Unbilden der Luft wie gegen heftigen Regen, setzt ihr andrerseits kein Hindernis für die Aufnahme von Sonnenwärme, aus deren milden Strahl sie Nahrung, Farbe und Wachstum zieht.</p><p>Fast genau so wie das Rebenblatt ist auch das Feigenblatt vierteilig eingeschnitten, was umso deutlicher in die Augen springt, je größer das Blatt ist. Freilich weist weder der ganze Rand noch die Spitze die zierliche Form des Rebenblattes auf. Wie nämlich das Feigenblatt durch kräftigere Dicke sich auszeichnet, so das Rebenblatt durch elegantere Form. Die Dickblätterigkeit dient dazu, Witterungsunbill abzuwehren, der Blatteinschnitt dem Fruchtsegen Wärme zu fächeln. So ist denn diese Obstart nicht leicht Hagelschauer ausgesetzt, leicht doch der Reife zuführbar; denn sie ist ungünstigen Einflüssen ebenso verschlossen, wie sie günstigen offen steht.</p><p>[Forts. v. ] Was sollte ich denn die Verschiedenheit der Blätter beschreiben, wie sie bald rundlich, bald länglich, bald biegsam, bald steifer sind, teils bei keinem Sturme abfallen, teils schon bei leichter Luftbewegung abgeschüttelt werden?</p><p><strong>Sie bedingt auch den Unterschied der Harze. Der Bernstein pflanzlicher Herkunft. Selbst Salomos Auge durchschaute nicht die letzten Geheimnisse der Natur.</strong></p><p>Es würde an kein Ende führen, wollte man den Eigentümlichkeiten der einzelnen Dinge nachgehen, ihre Verschiedenheiten mit überzeugender Klarheit auseinandersetzen oder ihre verborgenen und geheimen Ursachen mit endlosen Nachweisen aufdecken. So ist doch das Wasser ein und dasselbe, und nimmt gar oft verschiedenartige Veränderungen an. Die Farbe nach dem Gelände wechselnd, das es bespült, fließt es durch Sandsteppen gelblich dahin, durch Felsenriffe wildschäumend, durch Haine grünlich, durch Blumengefilde verschiedenfarbig: heller leuchtend durch Lilienbeete, rötlich schimmernd durch Rosengärten, reiner ist es im Tau des Grases, trüber im Sumpfe, durchsichtiger im Quell, dunkler im Meere. ― Gleicherweise ändert es auch seinen Kältegrad: in der Hitze wird es siedend heiß, im Schatten kühlt es ab, vom Sonnenstrahl getroffen verdampft es, bei Schneefall gefriert es zu Eis und wird grau. ― Wie wechselt doch auch sein Geschmack! Verschiedentlich mundet es nach der Beschaffenheit der beigemischten Ingredienzien, bald herb, bald bitter, bald scharf, bald widerlich, bald süß. Herben Geschmack nimmt es an von unreifem Fruchtsaft, zerstoßener Nußrinde und ausgepreßten Nußblättern, bitteren von Wermut, scharfen von Wein, widerlichen von Knoblauch, ätzenden von Gift, süßen von Honig. Wird ihm aber Mastix, desgleichen Terpentin oder der Fruchtsaft im Nußinneren beigemischt, läßt es sich leicht in lindes natürliches Öl überführen. ― Als Nährsaft aller Pflanzen aber leistet es jeder einzelnen die verschiedensten Dienste. Ob es die Wurzeln bespült oder aus den Wolken strömend darauf niederrieselt, es strömt allen Teilen in verschiedener Weise Kraft zu: es macht die Wurzel schwellen, den Stamm wachsen, die Äste sich breiten, die Blätter grünen, nährt den Fruchtsamen, mehrt das Obst. Obschon es also der gemeinsame Nährquell aller Bäume ist, erzeugen die einen Arten herbere, andere süßere, die einen spät-, andere frühreife Fruchtsäfte. Sogar auch in der Süßigkeit macht sich ein Unterschied merklich: anders kostet sie sich beim Weinstock, anders bei der Olive, anders beim Kirschbaum, anders bei der Feige, verschieden davon beim Apfelbaum, ungleich anders beim Dattelbaum.</p><p>Selbst für den Tastsinn fühlt sich das Wasser hier weich, dort rauher, so manchmal auch fettig an. Desgleichen ist es häufig wie an Aussehen so an Gewicht verschieden: an manchen Stellen wiegt es schwerer, an manchen leichter. Kein Wunder also, daß, wenn das Wasser selbst schon Unterschiedlichkeiten aufweist, auch das Harz der Bäume, das aus einer Aussonderung aus eben dem Wasser besteht, solche zeigt. Obwohl sonach der Entstehungsgrund bei sämtlichen Harzen der gleiche ist, ist doch ihr Gebrauch und ihre Natur verschieden. Eine andere Wirkung eignet dem Kirschbaumharz, eine andere dem Mastixharz. Verschieden davon ist der Balsam, den wohlriechende Bäume des Orients ausschwitzen sollen, verschieden desgleichen die Flüssigkeit, welche die Narthexpflanze in Ägypten und Libyen kraft einer mehr verborgenen Naturbeschaffenheit träufelt. Was aber brauche ich dir erst melden ― die Rede mag weich bleiben ―, daß selbst Bernstein ein Pflanzenharz ist, und daß ein Harz zu so fester Masse sich verhärtet? Nicht auf schwache Gründe stützt sich das, da häufig Blätter oder kleine Teilchen von Zweigen, oder gewisse Arten von Tierchen im Bernstein sich vorfinden, die er anscheinend, da er noch ein weicherer Tropfen war, aufgenommen und nach der Versteinerung festgehalten hat.</p><p>[Forts. v. ] Doch wie darf mein schwaches Wort sich messen mit der tiefen und großartigen Zweckmäßigkeit der Natur, da doch dieses Wort nur von Menschengeist gespeist wird, die Natur aller Dinge aber aus der schöpferischen Hand der göttlichen Vorsehung hervorging? Darum muß dem Zuviel der Worte wie mit Zügeln Einhalt getan werden, daß wir nicht, wie geschrieben steht, „über die Unterschiede der Bäume, die Kräfte der Wurzeln und das sonst Verborgene und Unwahrnehmbare“ anmaßende Erörterungen anstellen: eine besondere Gabe der Weisheit, die anscheinend dem Salomo von Gott verliehen wurde. Und selbst von ihm wurde das nicht ans volle Licht gestellt. Meines Erachtens hätte er wohl über die Pflanzenarten sich des näheren verbreiten, doch nicht volleren Aufschluß über deren tieferes Wesen geben können.</p><p><strong>Die Baumfrucht nach des Schöpfers Absicht die gemeinsame Nahrung aller lebenden Wesen. Die schöpferische Zeugungskraft versagt in keiner Pflanze. Gottes Größe im Kleinen. Die Pinie mit ihrem wunderbaren symmetrischen Bau ein Bild der Natur überhaupt, die Tamariske ein Typus doppelsinniger Charakterlosigkeit.</strong></p><p>Wenn Wasser sie erfrischen, sprießen fröhlicher zumal die Saaten, grünen die Bohnen, blüht auf und blüht neu der Gärten bunte Zier. Wenn die Flüsse überströmen, schmückt das Ufergelände sich mit grünenden, schwellenden Matten: Wie erst ist auf das Wort des Herrn, das reichlicher denn jegliches strömende Wasser quillt, mit einem Mal die ganze Pflanzenschöpfung aufgeblüht! Flugs boten die Gefilde die Ernte, die ihrem Schoße nicht anvertraut war, sproßten die Gärten die Gemüsearten und der Blumen wunderbare Pracht, die ihnen unbekannt waren, gürteten der Flüsse Gestade sich mit Myrtenschmuck. Die Bäume eilten, sich hurtig zu erheben, hurtig in ihr Blütengewand sich zu kleiden, den Menschen Speise, den Tieren Nahrung zu bieten. Ihre Frucht gehört allen gemeinsam, in ihre Nutznießung desgleichen teilen sich alle. Beide Gaben zugleich sproßten die Bäume: sie sollten uns einerseits Genuß, andrerseits mit ihrem kühlenden Schatten Schutz vor der Sonne gewähren. Nahrung winkte in der Frucht, eine Labe voll Annehmlichkeit im Laub. Weil indes die Vorsehung des Schöpfers vorauswußte, daß hauptsächlich der Menschen Gier die Frucht für sich in Anspruch nehmen werde, traf sie für die übrigen lebenden Wesen in der Weise Vorsorge, daß er ihnen eine besondere Nahrung bot. So birgt das Laub und die Rinde der Waldbäume nicht geringe Speise für sie. Ebenso wurde etwas, was für Heilzwecke dienlich wäre, d. i. der aus jungem Gezweige quellende Saft vorgesehen. So hieß also der Schöpfer das Nützliche, auf das wir (Menschen) erst später durch Probieren, Üben und Nachmachen kamen, von Anfang an aus dem Schoß der Erde hervorsprossen, um es auf Grund seines erhabenen Vorauswissens dem ihm angemessenen Zweck zuzuführen.</p><p>Und da der Herr befahl: „Es sprosse die Erde das Grün des Grases und die Fruchtbäume fruchttreibend nach ihrer Art, deren Same in ihnen selbst ruhe“, wende niemand etwa ein, man gewahre an vielen Bäumen weder Frucht noch Samen, und glaube, es sei das göttliche Gebot auch nur in einem Punkte unsicherer Art, darum statt von wahrem nur von zweifelhaftem Erfolge; er beachte vielmehr, wie es ganz ausgeschlossen ist, daß nicht alles, was da sproßt, auf Samen beruht oder auf Ursachen zurückgeht, welche augenscheinlich der Triebkraft des Samens ähneln. Faßt einer das genau ins Auge, wird er sich klar hiervon überzeugen und es begreifen können. Die Weiden scheinen keinerlei Samen zu haben, bergen aber dennoch in den Blättern ein gewisses Fruchtkorn, das Samenkraft in sich enthält. Wird es darum der Erde anvertraut, entsteht daraus wie aus einem Setzpflänzchen ein Baum und verjüngt sich wie aus einem Samen: Kraft jenes Kornes bildet sich die erste Wurzelfaser, aus der Wurzel sproßt nicht bloß der Stockausschlag der Weiden, sondern auch der anderer, der Weidenart ähnlicher Bäume (Bastarde). Aber auch die Wurzel selbst, die sich bildete, trägt Samentriebkraft in sich. Darum fristeten so manche mit dieser Art Pflanzung das Wachstum ihres Waldbestandes fort.</p><p>Groß ist Gottes Kraft in jedem Dinge. Und niemand wundere sich, wenn ich von der Größe der Kraft Gottes in den Gesträuchern redete; hat er selbst doch von der Größe seiner Kraft in den Heuschrecken und Käfern gesprochen, weil nämlich eine große Beleidigung seiner Majestät durch die Heimsuchung des Judenvolkes mit Unfruchtbarkeit und Not (Heuschreckenplage) ihre Sühne fand. Eine große Kraft nämlich bedeutet seine Geduld, eine große Kraft seine Vorsehung. Jene waren nicht mehr wert, der Erde Fruchtbarkeit zu genießen, nachdem sie den Schöpfer der Erde beleidigt hatten. Ja wahrhaft groß ist, wer mit bitterer Hungersnot den Frevel so großer Gottlosigkeit sühnen kann. Wenn nun groß ist Gottes Kraft, mit der die Erde den fruchttilgenden Käfer erzeugte, wieviel mehr groß die Kraft, mit der sie die fruchtbaren Geschöpfe hervorbrachte!</p><p>[Forts. v. ] Wer müßte nicht beim Anblick einer Pinie staunen über die so große Kunstmäßigkeit, die Gottes Anordnung ihrer Natur einerschuf und aufdrückte? Wie sie von der Mitte aus, wenn auch in gemessenen Abständen, mit ihrem ebenmäßig geformten Geäste, worin sie ihre Frucht hegt, aufstrebt? Also wahrt sie rings die gleiche Form und Anordnung. Und an jeder Stelle reift eine Überfülle von Fruchtkernen, verjüngt sich im Kreislauf (der Jahre) der Segen der Frucht. So scheint denn die Natur in dieser Pinie ein Bild von sich selbst auszuprägen: auch sie wahrt vom Augenblick jener ersten göttlichen und himmlischen Anordnung an die eigentümlichen Vorzüge, die sie empfangen, und bringt im Wechsel und in der Abfolge der Jahre ihre Erzeugnisse hervor, bis das Ende der Zeit sich erfüllen mag.</p><p>[Forts. v. ] Wie sie aber im obigen Fruchtbaum nur ihr eigenes anmutiges Bild zeichnet, so desgleichen in der Tamariske, d. i. einem niederen Gesträuche, den Typus boshafter Verschlagenheit. Wie es nämlich überall Leute mit doppelsinnigem Herzen gibt, die in der Gegenwart von Guten Wohlwollen und Aufrichtigkeit heucheln und zugleich mit den Lasterhaftesten gemeinsame Sache machen, so zeigt auch dieser Strauch ein Zwitterverhalten: er wächst ebenso im Sumpfboden wie in dürren Steppen. Darum vergleicht auch Jeremias zweifelhafte und unaufrichtige Charaktere mit Tamarisken.</p><p><strong>Gottes Vorsehung in der Bekleidung der Bäume: die einen verlieren das Laubgewand, andere wechseln es, wieder andere behalten es. Noe der Pflanzer des Weinstockes. Gebrauch und Mißbrauch, Segen und Fluch der Gottesgabe des Weines. “Der Duft vollen Feldes” in Isaaks Segen.</strong></p><p>„Es sprosse die Erde!“ ― und sogleich war die Erde vollbedeckt von aufsprossendem Grün. Auch an den Menschen ergeht das Wort: „Liebe den Herrn, deinen Gott!“ ― und nicht ergießt sich die Liebe Gottes in aller Herzen. Tauber denn hartes Felsgestein ist des Menschen Herz. Die Erde bietet uns, ohne es zu schulden, ihre Früchte dar in Willfährigkeit gegen den Schöpfer: wir verweigern selbst den schuldigen Dienst in unserer Unehrerbietigkeit gegen den Schöpfer.</p><p>Achte auf die Vorsehung Gottes im Kleinen! Und weil du sie nicht begreifen kannst, so staune doch, wie sie die einen Pflanzen immer grün erhalten, andere abwechselnd entkleidet und bekleidet haben wollte. Unter der weißen Schneedecke, bei frostiger Kälte behalten die Saatfelder ihr Grün: während sie selbst in Eis gehüllt sind, legt die ihrem Schoß entwachsene Saat das nimmer dürftige Schmuckgewand des Grünes an. Sogar jene Baumarten, die ihr Laubkleid ständig tragen, weisen einen nicht geringen Unterschied auf. So behalten zwar Ölbaum oder Pinie stets ihren Schmuck bei, wechseln aber gleich oftmals die Blätter; nicht eine dauernde, sondern eine nach und nach sich verjüngende Zierde ist es, welche sie über ihres Baumes Pracht ausgießen und lassen damit, daß sie fortwährend in vollem Schmucke prangen, den Wechsel ihrer Ausstattung nicht merken. Die Palme hingegen bleibt immer grün, indem sie ihren Blätterschmuck andauernd behält und nicht wechselt: die Blätter, die sie ursprünglich treibt, behält sie bei, ohne sie irgendwie durch neue zu ersetzen.</p><p>Ahme sie denn nach, o Mensch, daß auch dir das Wort gelte: „Dein Wuchs ward gleich der Palme!“ Wahre das Immergrün deiner Kindheit und jener natürlichen Unschuld, die du am Anfang empfangen hast, auf daß du an Wasserbächen gepflanzt, zu deiner Zeit deine Frucht bereit habest und dein Laub nicht abfalle! Diesem Immergrün der in Christus blühenden Gnade folgend ruft die Kirche aus: „Unter seinen Schatten verlangte es mich und weile ich“. Dieses Vorrecht (immer) grünender Gnadengabe empfingen die Apostel, deren Laub nimmer abzufallen vermochte, so daß schon ihr Schatten die Kranken heilte; der Glaube ihres Geistes nämlich und ihre blühenden Tugendverdienste warfen ihren Schatten auf die Krankheiten des Leibes. Bleib also gepflanzt im Hause des Herrn, daß du in seinen Vorhöfen blühest gleich der Palme und die Gnade der Kirche zu dir emporsteige: „Und der Geruch deiner Nase sei wie Äpfel und dein Gaumen wie der beste Wein“, auf daß du trunken werdest in Christus!</p><p>Gut, daß dieser Schriftvers uns gemahnte, den fast verlorenen Faden wieder aufzugreifen. Wir sprachen nämlich davon, wie auf das Befehlswort des Herrn auch der Weinstock gesproßt sei, der später nach der Sintflut, wie wir wissen, von Noe gepflanzt wurde; denn so liest man: „Noe war ein Landbebauer und pflanzte einen Weinstock. Und er trank von dessen Wein und schlief ein“. Noe ist also nicht der Urheber des Weinstockes, sondern nur seiner Pflanzung; und er hätte ihn nicht pflanzen können, wenn er ihn nicht schon als Erzeugnis vorgefunden hätte. Nur der Pflanzer, nicht der Schöpfer des Weinstockes also ist er. Gott aber, der wußte, daß der Wein, mäßig genossen, Gesundheit verleiht, das Denken fördert, unmäßig genommen, Anlaß zur Sünde gibt, bot die geschöpfliche Gabe dar und überließ deren reichlichere Produktion dem menschlichen Belieben: Das karge Maß der Natur sollte eine Mahnung zur Mäßigkeit sein, das Schädliche des Übermaßes und den Fall der Trunkenheit das Menschengeschöpf sich selbst zuschreiben. Selbst auch Noe wurde denn berauscht und schlief von Wein trunken ein. Beim Weingenuß erwies er sich, der bei der Sintflut zu so hohem Ruhm gelangte, schimpflicher Verirrung zugänglich.</p><p>Doch auch darin wahrte der Herr diesem seinem Geschöpfe einen Vorzug, daß er uns dessen Frucht zum Heile wandelte, und durch sie uns Nachlaß der Sünden werden sollte. Frommes Sinnes sprach darum Isaak: „Der Geruch Jakobs ist der Geruch vollen Feldes“, d. i. natürlicher Wohlgeruch. Was gibt es denn auch Lieblicheres als ein volles Ackerfeld, was Köstlicheres als Rebenduft, was Anmutigeres als Bohnenblüte? Mag daher ein Autor vor uns noch so geistreich bemerkt haben: „Nicht den Duft der Rebe oder der Feige oder der Getreidefrucht, sondern den Wohlgeruch der Tugend strömte der Patriarch aus“: ich doch verstehe die schönen Segensworte zugleich auch von jenem echten und reinen irdischen Wohlgeruch, den keine Fälschung künstlich herstellte, sondern die Wahrheit der himmlischen Huld träufelte. Erscheint doch auch unter den hochheiligen Segensgebeten die Bitte aufgenommen, es möge der Herr uns vom Tau des Himmels die Kraft des Weines, des Öles und des Getreides verleihen. Ihm ist Ehre, Lob, Ruhm, Unvergänglichkeit von Ewigkeit und jetzt und immerdar und in alle Ewigkeiten der Ewigkeiten. Amen.</p><h2>4</h2><p><strong>Die Sonne bei aller Vorzüglichkeit ein Geschöpf, dessen Herrlichkeit von der des Schöpfers unvergleichlich überstrahlt wird, das Mitgeschöpfen den Vorzug der zeitlichen Priorität einräumen muß. Der Erde Fruchtbarkeit nicht wesentlich durch Sonnenlicht und wärme bedingt.</strong></p><p>Wer Weinlese hält, pflegt zuvor die Gefäße, in welche der Wein gegossen wird, zu reinigen, daß keinerlei Schmutz des Weines Klarheit trübe. Denn was nützte es, den Weinstock reihenweise zu setzen, alljährlich aufzugraben, mit dem Pfluge Furchen zu ziehen, ihn zu beschneiden, emporzurichten, an die Ulmen zu binden und mit ihnen gleichsam zu vermählen, wenn der so mühsam gewonnene Wein im Gefäße verdürbe? Ebenso reinigt einer, der den Aufgang der Morgensonne betrachten möchte, seine Augen, daß kein Stäubchen, daß keine Unreinigkeit darin stecke, die den Blick beim Schauen hemmte, daß kein nebeliges Dunkel beim Betrachten das Auge umflore. Uns soll nun bei der Schriftlesung die Sonne aufgehen, die zuvor noch nicht da war. Schon durchwanderten wir ohne die Sonne den ersten Tag, durchschritten ohne die Sonne den zweiten, vollendeten ohne die Sonne den dritten. Am vierten Tag nun ergeht Gottes Befehl, es sollen Leuchten entstehen: die Sonne, der Mond und die Sterne. Die Sonne macht den Anfang. Reinige das Auge des Geistes, o Mensch, und den inneren Blick der Seele, daß kein Sündensplitter die Sehkraft deines Geistes hemme und das Schauen des reinen Herzens trübe! Reinige das Ohr, um in reinem Gefäß die klare Flut des göttlichen Schriftwortes aufzunehmen, daß keine Befleckung eindringe! Mit großer Pracht zieht die Sonne dem Tage voraus, mit großer Lichtfülle die Welt durchflutend und wärmedampfend. Hüte dich, o Mensch, nur auf ihre Größe deinen Blick zu richten, daß nicht ihr übergroßer Lichtglanz das Auge deines Geistes blende, wie einem, der die Sonne im Zenith hat und den Blick in ihren Strahl taucht, von ihrem Licht getroffen augenblicklich alles Sehen vergeht. Wendet er Gesicht und Auge nicht anderswohin, glaubt er überhaupt nicht mehr schauen zu können und das Sehvermögen eingebüßt zu haben; kehrt er hingegen den Blick ab, erfreut er sich der vollen Funktion des letzteren weiterhin. Hüte dich also, daß nicht der Sonne aufgehender Strahl auch deinen Blick verwirre! Und darum schaue zuerst hin auf das Firmament, das vor der Sonne geschaffen wurde! Schaue hin auf die Erde, die, bevor die Sonne hervortrat, anfing, sichtbar und wohlgestaltet zu sein! Schaue hin auf ihren Pflanzenschmuck, der vor dem Sonnenlichte prangte! Früher denn die Sonne war der Käfer, älter denn der Mond ist der Grashalm. So halte sie denn nicht für Gott, nachdem du ihr Geschöpfe vorgezogen siehst, die Gott ihr Dasein verdanken! Drei Tage sind vorübergegangen, und niemand fragte nach der Sonne. Genug Helligkeit war da, denn auch der Tag hat sein Licht, den Vorläufer der Sonne.</p><p>Traue also nicht blindlings dem so wundervollen Glanze der Sonne ― sie ist das Auge der Welt, die Freude des Tages, des Himmels Schönheit, der Natur Anmut, der Juwel der Schöpfung ―, sondern denk, so oft du sie schaust, an ihren Meister! Preise, so oft du sie bewunderst, ihren Schöpfer! Wenn schon die Sonne, die Sein und Schicksal der Schöpfung teilt, so lieblich strahlt, wie gut muß jene „Sonne der Gerechtigkeit“ sein! Wenn jene solche Schnelligkeit besitzt, daß sie auf ihrem gewaltigen Lauf bei Tag und Nacht alles bescheint, wie groß muß der sein, der immer und überall ist und mit seiner Majestät alles erfüllt! Wenn jene wunderbar ist, die auf Geheiß hervortritt, wie über die Maßen wunderbar der, welcher, wie zu lesen steht, „der Sonne gebeut, und sie geht nicht auf!“ Wenn jene groß ist, die im Wechsel der Stunden täglich über die Lande her- und wegzieht, wie muß jener sein, der auch noch in seiner Entäußerung, da wir ihn sichtbar schauen konnten, „das wahre Licht war, das jeden Menschen erleuchtet, der in diese Welt kommt!“ Wenn jene unvergleichlich vorzüglich ist, die so oft, wenn sie die Erde gegenüber hat, verblaßt, wie groß muß die Majestät dessen sein, der da spricht: „Noch bin ich einmal da und will erschüttern die Erde!“ Die Erde macht jene schwinden, des Herrn Erschütterung könnte sie nicht bestehen, würde sie nicht kraft seines Willens gestützt werden. Wenn es für den Blinden ein Unglück ist, daß er das holde Licht dieser Sonne nicht schaut, welches Unglück für den Sünder, wenn er der Wohltat des „wahren Lichtes“ beraubt, die Finsternis ewiger Nacht erleiden muß!</p><p>Wenn du also die Sonne schaust, so denk an die Erde, die vor ihr gefestigt wurde, denk an das Grün des Grases, das die zeitliche Priorität vor ihr voraus hat, denk an die Bäume, die freudig rauschen, weil sie eher denn die Leuchten des Himmels ins Dasein traten! Hatte etwa das Gras es mehr verdient als die Sonne? Oder hatten etwa die Bäume ein besonderes Vorrecht? Fern sei es, daß wir bewußtlose Wesen der Spenderin so großen Segens vorziehen! Was anders also bezweckte „die Tiefe der Weisheit und Erkenntnis Gottes“ mit der zeitlichen Priorität der Bäume vor jenen beiden Leuchten der Welt, gleichsam den Augen der Himmelsveste, als daß alle auf Grund des Zeugnisses der Schriftlesung erkennen möchten, daß auch ohne Sonne eine Fruchtbarkeit der Erde möglich ist. Denn konnte diese ohne Sonne die ersten Samen der Dinge zum Sprossen bringen, kann sie auch ohne Sonnenwärme den aufgenommenen Samen zur Entwicklung bringen und aus eigener belebender Kraft ihre Früchte erzeugen.</p><p>[Forts. v. ] So ruft gleichsam laut die Natur mit der Stimme ihrer Gaben: Gut ist die Sonne, doch nur meine Dienerin, nicht Herrin; gut die Förderin, doch nicht die Schöpferin meiner Fruchtbarkeit; gut die Nährerin, doch nicht die Urheberin meiner Früchte! Zuweilen versengt gerade auch sie meine Erzeugnisse; häufig wird gerade auch sie mir schädlich und läßt da und dort mich mit leeren Händen zurück. Nicht undankbar bin ich deshalb meiner Mitgehilfin: mir ist sie zu Nutz und Frommen verliehen, mit mir ist sie der Mühseligkeit anheimgegeben, mit mir der Vergänglichkeit unterworfen, mit mir der Knechtschaft des Verderbens unterstellt. Mit mir seufzt sie, mit mir liegt sie in Wehen, daß kommen möchte die Aufnahme zur Kindschaft und die Erlösung des Menschengeschlechtes, um auch uns Befreiung aus der Knechtschaft zu ermöglichen. An meiner Seite preist sie den Schöpfer, an meiner Seite jubelt sie Lob dem Herrn, unserem Gott. Wo ihr Wohltun am reichlichsten fließt, dort teile ich mich gemeinsam mit ihr darein. Wo die Sonne Segen spendet, dort spendet Segen die Erde, spenden mit mir Segen die Fruchtbäume, Segen die Tiere, Segen die Vögel. Der Schiffer auf dem Meere beklagt sich über sie, nach mir verlangt es ihn. Der Hirte auf den Bergen weicht ihr aus, unter mein Laubdach, unter meine Bäume eilt er, deren Schatten dem Erhitzten Kühlung fächelt; zu meinen Quellen lenkt er durstig und müde den raschen Schritt.</p><p><strong>Nicht der Sonne, sondern Gottes Huld dankt die Erde ihre Fruchtbarkeit. Die untergehende Sonne ein Bild des sterbenden Heilandes, der wechselnde Mond ein Bild der Kirche. An Licht, nicht an Umfang nimmt derselbe ab.</strong></p><p>Um aber das Zeugnis der Augen nicht zu unterschätzen, reinige das Ohr und leih es den himmlischen Aussprüchen; denn „auf der Aussage zweier oder dreier Zeugen steht fest jedes Wort“. Höre den, der spricht: * „Es sollen Leuchten entstehen an der Veste des Himmels zur Beleuchtung der Erde!“* Wer spricht das? Gott spricht es. Und zu wem anders spricht er es als zum Sohne? Gott Vater spricht: „es werde die Sonne“, und der Sohn schuf die Sonne; denn so gebührte es sich, daß „die Sonne der Gerechtigkeit“ die Sonne der Welt schuf. Er also führte sie in das Lichtreich ein, er gab ihr den Glanz, er verlieh ihr die Leuchtkraft. Nur Geschöpf also ist die Sonne, darum auch sie dienstbar; denn geschrieben steht: „Du hast die Erde gegründet, und sie besteht fort. Nach Deiner Anordnung währt der Tag, weil alles Dir dienstbar ist“. Wenn der Tag dienstbar ist, wie sollte die Sonne nicht dienstbar sein, die „unter die Herrschaft des Tages gegeben ward“? Wie sollten Mond und Sterne nicht dienstbar sein, die „unter die Herrschaft der Nacht gestellt wurden?“ Je größer die Schönheit ist, die ihnen der Schöpfer verliehen, so daß die Luft vom Glanze der Sonne heller denn sonst erstrahlt, der Tag freundlicher leuchtet, das Dunkel der Nacht durch des Mondes und der Sterne Gefunkel aufgehellt wird, der Himmel im Schimmer feuriger Lichtgestirne schwimmt, wie von Blumen besät, als ob ein Paradies erblühte, als ob er farbenprächtig vom lebendigen Schmucke duftatmender Rosen erglühte: je größer also die Pracht erscheint, mit der sie bedacht wurden, um so mehr schulden sie; denn wem mehr anvertraut wird, der schuldet auch mehr. „Schmuck des Himmels“ hat man das vielfach genannt, insofern die Gestirne das kostbare Geschmeide desselben seien.</p><p>[Forts. v. ] Damit wir ferner wüßten, daß die Fruchtbarkeit der Erde nicht der Sonnenwärme zuzuschreiben, sondern Gottes Huld zu danken ist, spricht der Prophet: „Sie alle erwarten von Dir, daß Du ihnen Speise gebest zu seiner Zeit. Du gibst ihnen, und sie sammeln ein für sich; Du tust auf Deine Hand, und alles wird gesättigt von Deiner Güte“. Und im folgenden: „Sende Deinen Geist, und sie werden geschaffen, und Du erneust das Angesicht der Erde“. Und im Evangelium: „Betrachte die Vögel des Himmels! Sie säen nicht, sie ernten nicht, und euer himmlischer Vater ernährt sie“. Nicht also die Sonne oder der Mond sind die Urheber der Fruchtbarkeit, sondern Gott der Vater verleiht die Fruchtbarkeit allen Dingen durch den Herrn Jesus in freigebigem Maße.</p><p>Die schöne Erklärung aber über den Sinn seiner Worte: „Gott habe die Sonne unter die Herrschaft des Tages und den Mond unter die Herrschaft der Nacht gestellt“, gab uns der Prophet selbst. Eben im 103. Psalme [Hebr. Ps. 104], den wir oben angezogen haben, schrieb er nämlich: „Er schuf den Mond für die (wechselnden) Zeiten, die Sonne erkannte ihren Niedergang“. Beschließt der Tag mählich seiner Stunden Lauf, so erkennt die Sonne, daß sie niedergehen müsse. So steht also die Sonne unter der Herrschaft des Tages ― und der Mond unter der Herrschaft der Nacht. Er muß sich dem Wechsel der Zeiten fügen: eben noch erstrahlt er im Vollglanze: da verblaßt er.</p><p>[Forts. v. ] Die meisten Autoren freilich scheinen unsere Stelle mystisch auf Christus und die Kirche zu beziehen. Christus habe, da er sprach: „Vater, die Stunde ist gekommen, verherrliche Deinen Sohn“, den Leidenstod seiner Menschheit erkannt, auf daß durch diesen seinen Untergang der Vater allen, die vom Untergange des ewigen Todes bedroht waren, das ewige Leben verleihe, und die Kirche ihre Zeiten habe, die der Verfolgung und des Friedens. Denn gleich dem Monde scheint sie abzunehmen, nimmt aber tatsächlich nicht ab. Dunkle Schatten können sie verhüllen, abnehmen kann sie nicht. Sie nimmt mit dem Abfalle des einen und anderen bei Verfolgungen nur ab, um mit dem Bekenntnisse der Märtyrer zum Vollglanze zu gelangen; um, vom Ruhme des sieghaft für Christus vergossenen Blutes überstrahlt, noch herrlicheres Licht der Frömmigkeit und des Glaubens über den ganzen Erdkreis auszuströmen. Denn nur eine Abnahme des Lichtes, nicht des Umfanges erleidet der Mond, wenn er allmonatlich sein Licht abzugeben scheint, um es der Sonne wiederum zu entlehnen, eine Erscheinung, die sich bei reiner klarer Luft, wenn keine Nebelhülle ihn verdunkelt, leicht beobachten läßt: die Mondscheibe bleibt ganz, wenn sie auch nicht ganz im nämlichen Lichte erstrahlt wie ein Teil derselben. An Umfang ist sie genau so groß, wie man sie bei Vollmond sieht; sie sieht aber infolge der Verdunkelung so her, als wäre sie ihres Lichtes beraubt. Es glänzen daher nur noch ihre Sicheln; ihre Gestalt ist nämlich kreisförmig und wird als solche noch angedeutet, wenn ihr Licht teilweise abnimmt.</p><p><strong>Letzteres verleiht dem ersteren größere Helligkeit und Glanz. Beide dienen zur Scheidung von Tag und Nacht. Die Leuchtkraft ist beiden gemeinsam, Wärme und Hitzestrahlung nur dem feurigen Sonneball eigen. Das Feuer der Gottheit ein leuchtendes Licht für die Guten, ein “verzehrendes Feuer” für die Gottlosen. Licht und Finsternis ausschließende Gegensätze. Die Nacht der natürliche Schatten der Erde.</strong></p><p>Zu denken aber könnte es geben, daß es heißt: „Es sollen Leuchten entstehen zur Beleuchtung der Erde, die da scheiden den Tag von der Nacht“. Denn auch oben, wo Gott das Licht geschaffen, hatte es geheißen: „Gott schied zwischen dem Lichte und der Finsternis. Und es ward Abend und es ward Morgen, ein Tag“. Doch bedenken wir, daß das Licht des Tages verschieden ist vom Lichte der Sonne und des Mondes und vom Sternenlichte! Denn die Sonne verleiht mit ihren Strahlen dem Tageslichte nur größere Helligkeit: ein Vorgang, den Anbruch wie Ende des Tages ersehen lassen. Denn wohl bricht das Tageslicht vor der Sonne an, doch es strahlt nicht, weil es heller erst im Glanze der Mittagssonne schimmert. Das spricht auch der Prophet deutlich aus mit den Worten: „Und er wird hervorführen wie Licht Deine Gerechtigkeit und Dein Recht wie den Mittag“. Nicht dem Lichte überhaupt, sondern gerade dem Mittagslichte verglich er die Gerechtigkeit des Heiligen.</p><p>Ferner nicht bloß <em>ein</em> Zeichen, sondern vielmehr <em>zwei</em> wollte er zur Scheidung von Tag und Nacht haben: sowohl das Tageslicht wie der Sonnenaufgang sollte diese Scheidung bewirken, und umgekehrt des Lichtes Erlöschen wie der Sterne Aufgang den untergehenden Tag vor der beginnenden Nacht unterscheiden. Auch nach Sonnenuntergang bleibt nämlich einige Tageshelle zurück, bis die Dunkelheit die Erde deckt: und jetzt geht der Mond auf und die Sterne. Und zwar ist das hinsichtlich der Nacht offenkundig und klar: des Mondes und der Sterne Scheinen, der Nacht Bereich selbst sind Zeugen davon; macht doch tagüber die Sonne mit ihrem Aufgang dem Funkeln des Mondes und des ganzen Sternenhimmels ein Ende. Hinsichtlich des Tages aber kann uns schon der bloße Glanz der Sonne überzeugen, daß das Tageslicht und das Sonnenlicht ihrer Natur nach verschieden und selbst ihrer Erscheinung nach ungleichartig sind. Einfach ist des Lichtes Schein: es leuchtet nur. Dagegen kommt der Sonne nicht bloß Leuchtkraft, sondern auch Wärmestrahlung zu; denn sie ist ein Feuerball, Feuer aber leuchtet und brennt. Darum erschien Gott, da er dem Moses sein wunderbares Wirken offenbaren wollte, um ihn zu gewissenhaftem Gehorsam anzuspornen und sein Herz zum Glauben zu entflammen, im Dornbusche in Feuer. Und der Dornbusch verbrannte nicht, sondern schien nur nach Art eines Feuers zu brennen. Die eine Funktion des Feuers fehlte also, die andere Wirkung war da: es fehlte seine verzehrende Kraft, seine Leuchtkraft war wirksam. Es stutzte darum Moses, wie das Feuer wider seine Natur den Dornbusch nicht verzehrte, nachdem es selbst widerstandsfähigeren Stoff zu verzehren pflegt. Doch des Herrn Feuer pflegt eben zu erleuchten, pflegt nicht zu verzehren.</p><p>Vielleicht möchtest du einwenden: Wie kann geschrieben stehen: „Ich bin ein verzehrendes Feuer?“ Gut, daß du daran erinnert hast. Es pflegt nicht zu verzehren ― außer allein die Sünden. Auch bei der Vergeltung der Verdienste gewinnen wir Einsicht in die Natur des göttlichen Feuers: die einen erleuchtet es, die anderen brennt es aus: es erleuchtet die Gerechten, es brennt aus die Gottlosen. Nicht brennt es zugleich jene aus, die es erleuchtet, und erleuchtet es die, welche es ausbrennt; sein Erleuchten, das unauslöschliche, bezweckt vielmehr die Vollendung der Guten, sein heftiges Brennen die Bestrafung der Sünder.</p><p>[Forts. v. ] Doch kehren wir zurück zur Scheidung zwischen Tag und Nacht. Beim Anbruch des Tageslichtes muß die Nacht entfliehen, beim Scheiden des Tages breitet die Nacht sich aus. Denn das Licht hat nichts gemein mit der Finsternis. Schon bei der Urschöpfung hat der Herr dies durch ein Naturgesetz so bestimmt. Denn als er das Licht schuf, schuf er zugleich die Scheidung des Lichtes von der Finsternis. So können wir am hellen Tage, da schon das Sonnenlicht über die Erde ausgegossen ist, beobachten, wie der Schatten eines Menschen oder eines Strauches vom Lichte sich abhebt, so daß er am Morgen in der Richtung gen Niedergang fällt, am Abend umgekehrt gen Aufgang, in den Mittagsstunden gen Mitternacht sich neigt. Doch vermengt und vermischt er sich nicht mit dem Lichte, sondern weicht und flieht davor. Ähnlich weicht auch die Nacht dem Tage und zieht sich vor seinem Lichte zurück; denn sie ist, wie es ausgezeichnete Gelehrte, die uns an Alter und Begabung voraus sind, nachgewiesen haben, der Schatten der Erde. Dem Körperlichen haftet nämlich naturgemäß der Schatten an, so wesentlich, daß auch die Maler den Schatten von Körperdingen, die sie malen, darzustellen sich bemühen; sie behaupten, es gehöre das zur Kunst, eine Auswirkung der Natur nicht zu übergehen, und glauben, es habe ein Künstler, dessen Gemälde nicht auch seinen Schatten aufweist, wider eine natürliche Forderung verstoßen. Wie nun bei Tag an einem Körperding, das der Sonne gegenüber sich befindet, auf der Seite, wo das Licht zurückgestrahlt wird, ein Schatten entsteht, so deckt dunkler Schatten auch die Luft, wenn beim Scheiden des Tages die Erde dessen (des Tages) oder der Sonne Licht gegenüber zu liegen kommt. Daraus geht klar hervor, daß der Schattenwurf der Erde die Nacht verursacht.</p><p><strong>Letztere ist in religiös-sittlicher Beziehung ein verderblicher Aberglaube, in physischer eine Unmöglichkeit, in mehr als einer Hinsicht eine Absurdität. Sie gleicht dem Spinnengewebe: schwache Geister bleiben darin hängen, starke durchreißen es: die Allgemeinheit und das Alltagsleben gehen darüber zur Tagesordnung über.</strong></p><p>So schuf denn Gott die Sonne, den Mond und die Sterne und wies ihnen zum voraus eine bestimmte Zeit an, der Sonne die Tag-, dem Mond und den Sternen die Nachtzeit. Erstere sollte des Tages holdes Licht mehren, letztere die Dunkelheit und Finsternis aufhellen. „<em>Und sie sollen sein zu Zeichen</em> und zu Zeiten und zu Tagen und zu Jahren“. Unterschiedliche Zeiten und gleiche Zeitmaße, abwechselnd zugemessen, haben die Sonne und der Mond samt den Sternen. „Und sie sollen sein zu Zeichen.“ Wir können nicht leugnen, daß sich der Sonne und dem Monde manche Zeichen entnehmen lassen. Denn auch der Herr sprach: „Und es werden Zeichen an der Sonne und dem Monde und den Sternen sein“. Und den Aposteln gab er auf die Frage, welches das Zeichen seiner Wiederkunft sein werde, zur Antwort: „Die Sonne wird verfinstert werden und der Mond sein Licht nicht geben und die Sterne vom Himmel fallen“. Das, wollte er sagen, werden die Anzeichen des künftigen Endes sein. Doch muß, wenn wir uns darum kümmern, ein entsprechendes Maßhalten beobachtet werden.</p><p>Manche haben denn versucht, die Nativität, die Zukunft jedes Neugeborenen, festzustellen. Und doch ist das nicht bloß ein eitles, sondern auch ein verderbliches Beginnen für den Fragesteller, eine Unmöglichkeit für den Auskunfterteiler. Was wäre auch so verderblich für einen jeden als die Selbsteinrede, er sei das, was die Geburt aus ihm gemacht hat? Niemand darf demnach sein Leben, seinen Stand, seinen Charakter ändern und ernstlich der Besserung sich befleißigen, sondern bei jener Einrede es bewenden lassen. Den Rechtschaffenen kann man nicht loben, den Ungerechten nicht verurteilen, da er ja augenscheinlich seinem Geburtsverhängnis entsprechend handelte. Und wie konnte der Herr den Guten Lohn oder den Ungerechten Strafe in Aussicht stellen, wenn die sittliche Führung auf innerer Nötigung beruht und den Wandel der Gestirne Lauf vorzeichnet? Nichts der Charakter-, nichts der Verstandesbildung, nichts dem Willensstreben überlassen, was heißt das anders als dem Menschen den Menschen ausziehen? Wie viele sehen wir, die dem Laster und Sündenleben entrissen, zu einem besseren Zustande sich bekehrt haben! Nicht die Geburtsstunde erlöste und berief die Apostel aus Sündern, sondern Christi Ankunft heiligte sie, und die Stunde des Leidens des Herrn erlöste sie vom Tode. Der verurteilte Schächer, der mit dem Herrn gekreuzigt wurde, ging nicht dank seiner Geburt, sondern kraft seines Glaubensbekenntnisses in die Ewigkeit des Paradieses ein. Den Jonas warf nicht ein Geburtsverhängnis ins Meer, sondern die Sünde, mit der er sich der göttlichen Verkündigung entzog. Und ein Fischungeheuer nahm ihn auf und spie ihn zur Sinnbildung eines künftigen Geheimnisses nach drei Tagen wiederum aus und gab ihn dem Verdienste des Prophetenamtes zurück. Den Petrus, der schon vor Tod und Hinrichtung stand, befreite Christi Engel, nicht der Sterne Lauf aus dem Kerker. Den Paulus bekehrte die Blindheit zur Gnade und retteten, als er vom Vipernbiß getroffen war und als er im Schiffbruch trieb, nicht die Heilmittel der Geburt, sondern die Verdienste seiner Frömmigkeit. Was brauchen wir jener Erwähnung tun, die auf das Gebet (der Apostel) wieder aufstanden, nachdem sie gestorben waren? Rief sie ihr Geburtsstern oder der Apostel Gnadenerweis ins Leben zurück? Wozu war es (für letztere) nötig, sich Fasten und Gefahren hinzugeben, wenn sie dank ihrer Geburt an das gewünschte Ziel gelangen konnten? Hätten sie das geglaubt, würden sie bei ihrem Zuwarten auf das notwendige Eintreten des Fatums nimmer zu so großem Gnadenbesitz gelangt sein. ― Verderblich also ist solche Einrede.</p><p>Aber auch wie unmöglich ist sie! Denn um nur einiges aus ihren (der Astrologen) Aufstellungen zum Zwecke der Widerlegung, nicht der Billigung herauszugreifen, so betonen sie die große Bedeutung der Nativität, wie ferner dieselbe aus gewissen kleinsten und bestimmten Momenten erschlossen werden müsse und wie, wenn nicht genau verfahren werde, ein völlig abweichendes Resultat sich ergebe; denn nur ein winziger Augenblick, ein kurzer Moment trenne die Geburt des Schwachen und Mächtigen, des Armen und Reichen, des Schuldlosen und Schuldigen, und die gleiche Stunde führe oft den für ein langes Leben bestimmten und den schon in der ersten Kindheit dem Tode geweihten Menschen ins Dasein, wenn der sonstige Befund ungleich und auch nur in einem Punkte abweichend sei. Wie sie das beweisen können, dafür mögen sie Antwort stehen! Vergegenwärtige dir die Niederkunft einer Frau. Die Hebamme erfährt doch zuerst hiervon, horcht auf einen Wimmerlaut, um ein Lebenszeichen zu bekommen, sieht zu, ob es ein Knäblein oder Mägdlein sei. Wie viele Augenblicke willst du inzwischen verstrichen lassen sein? Denk dir dazu einen Astrologen in Bereitschaft. Kann ein Mann überhaupt am Geburtsakt sich beteiligen? Während nun die Hebamme Weisungen erteilt, der Chaldäer darauf achtet, das Horoskop einstellt, ist das Fatum des Neugeborenen auch schon in das Geburtslos eines andern eingerückt: dem andern gilt die Untersuchung, des andern Nativität wird gestellt. Angenommen, es beruhe ihr Nativitätsfatalismus auf Wahrheit, so kann doch dessen Feststellung nicht der Wahrheit entsprechen. Es eilen vorüber die Augenblicke, „es flieht dahin die unwiederbringliche Zeit“. Es ist kein Zweifel, daß die Zeit in Momenten und Augenblicken besteht, zu dieser Annahme werde ich bestimmt, da einmal alle in einem Moment, in einem Augenblick auferweckt werden. So bezeugt es der Apostel mit den Worten: „Sehet, ein Geheimnis spreche ich aus: Alle zwar werden wir auferstehen, nicht alle aber verwandelt werden in einem Moment, in einem Augenblick, bei der letzten Posaune, und die Toten werden auferstehen in Unverweslichkeit, und wir werden verwandelt werden“. Bis das Kind geboren und aufgenommen und niedergelegt wird, bis ein Laut von ihm festgestellt und gemeldet wird: wieviele Zeitmomente sind inzwischen verstrichen! Soviel, um nur einfach diese Vorgänge zu nennen. Denn jene selbst teilen auch noch den Kreis der zwölf (Tier-) Zeichen, der von vitaler Bedeutung sei, in zwölf Teile ein, zerlegen, weil die Sonne in dreißig Tagen ein Zwölftel dieses nicht näher bestimmbaren Kreises zurücklegt ― sie vollendet somit ihre Bahn im Laufe eines Jahres ―, jeden dieser zwölf Teile in dreißig Teilchen, griechisch Moiren genannt, teilen das Teilchen selbst wiederum sechzigmal ab und zerstückeln jedes von diesen sechzig nochmals sechzigmal. Wie unfaßlich! Ein Sechzigstel von einem Sechzigstel soll den Augenblick der Geburt ausmachen! Die Bewegung oder die Art des jedesmaligen Zeichens im Augenblick der Geburt eines Neugeborenen soll sich feststellen lassen! So ist also, da eine genaue Bestimmung so winziger Zeitteilchen unmöglich ist, die geringste Abweichung aber eine irrtümliche Feststellung des ganzen Falles zur Folge hat, das ganze Verfahren voll eitlen Truges. Seine Vertreter kennen ihr eigenes Schicksal nicht: wie wollen sie fremdes kennen? Was ihnen selbst bevorsteht, wissen sie nicht: können sie anderen die Zukunft verkünden? Lächerlich wäre es, das zu glauben; denn vermöchten sie es, würden sie doch lieber für sich selbst Vorsorge treffen.</p><p>Jetzt nun Folgendes. Wie ungereimt ist es, einen, der angeblich im Zeichen des Widders geboren ist, zufolge der Art dieses Tieres, das unter der Herde aus seinesgleichen herausragt, für besonders hervorragend an Einsicht zu halten! Oder für besonders reich, weil der Widder von Natur ein Vlies trage und alljährlich ein kostspieliges Fell bekomme, und darum jenem Menschen anscheinend einträglicher Erwerb beschieden sei! Ähnliche Schlüsse zieht man auch aus dem Zeichen des Stieres und der Fische. Aus der natürlichen Beschaffenheit gemeiner Tiere glaubt man also, die Bewegungen am Himmel und die Bedeutung der Himmelszeichen erklären zu dürfen. Was uns zur Speise dient, stellt unsere bindenden Lebensnormen fest! Was uns Nahrung ist: Widder, Stier, Fische, prägt uns das Sittengesetz ein! Wie wollen sie uns denn die Ursachen der Dinge und die Grundbedingungen dieses Lebens vom Himmel herleiten, wenn sie selbst den Himmelszeichen nur Bewegungsursachen zuteilen, welche sie der Beschaffenheit gemeiner Speise entnehmen? Als freigebig gilt ihnen, wer im Zeichen des Widders geboren ist, weil der Widder nicht ungern von seiner Wolle lasse. Sie wollen eine derartige Tugend lieber auf die Natur eines gemeinen Tieres als auf den Himmel zurückführen, von wo uns heiterer Sonnenschein lacht und häufig Regen niederträufelt. Arbeitsam und dienstwillig sollen jene sein, die bei ihrer Geburt der Stier anglotzte, weil dieses Zugtier bereitwillig seinen Nacken dem Joche beuge; ein Meuchler desgleichen, den der Skorpion bei seiner Geburt umklammerte; das Gift der Bosheit soll er speien, weil es ein giftiges Tier sei. Was schützt du also vor, auf Grund erhabener Himmelszeichen die maßgebende Lebensnorm feststellen zu wollen, und entnimmst doch nur gewissen Lächerlichkeiten den Grund deiner Behauptung? Werden nämlich einem kraft der Himmelsbewegungen solche von Tieren herübergenommene sittliche Proprietäten eingeboren, dann scheint der Himmel selbst dem Einflusse der tierischen Natur zu unterstehen; denn von ihr empfing er den grundwesentlichen Lebensinhalt, den er dem Menschen beschied. Wenn nun das der Wahrheit Hohn spricht, so ist es umso lächerlicher, wenn jene, von aller Wahrheit verlassen, gerade hieraus die Glaubwürdigkeit ihrer Behauptungen schöpfen.</p><p>[Forts. v. ] Laßt uns sodann die weitere Tatsache ins Auge fassen, daß sie jene Zeichen, durch deren Bewegungen ihrer Behauptung zufolge die unabänderlichen Geschicke unseres Lebens bestimmt werden, Planeten nennen. Sei es nun daß diese, was ihr Name sagt, stets unstet schweifen, sei es daß sie sich, was jene selbst behaupten, rasch vorwärts bewegen und zehntausendmal im Tag oder, wenn das unglaublich scheinen sollte, doch recht oftmals infolge unzähliger Selbstumdrehungen ihr Bild ändern: unglaublich bleibt es, daß sie uns mit ihrem so unsteten Irren und so raschen Drehen einen unabänderlich feststehenden Lebensinhalt und Lebensgang bestimmen. Es sollen übrigens nach ihnen nicht alle Planeten die gleiche Geschwindigkeit besitzen, vielmehr die einen schneller, die anderen langsamer ihren Umlauf betätigen, so daß sie sich in derselben Stunde beim Vorüberziehen aneinander häufig zeigen und häufig dem Blick entschwinden.</p><p>Sehr viel aber soll, wie sie behaupten, darauf ankommen, ob günstige oder ungünstige und schädliche Zeichen auf den Geburtsvorgang niederschauen, und bei der Nativität der Unterschied bestehen, daß der Anblick eines günstigen Zeichens Vorteil, der eines ungünstigen und nachteiligen Zeichens Nachteil über Nachteil bedeute. So pflegen sie nämlich die Zeichen, zu denen sie abergläubisch aufblicken, zu benennen: ich muß mich, nachdem ich mich auf ihre Behauptungen beziehe, auch ihrer Bezeichnungen bedienen, damit sie nicht sagen, man habe ihre Beweisführungen nicht sowohl entkräftet und widerlegt, als vielmehr nicht gekannt. Weil sie nun jene unstete und rasche Bewegung nicht genau bestimmen können, kommt es häufig vor, daß sie wegen der Winzigkeit des unbestimmbaren Zeitpunktes und Zeitmomentes den Anblick eines günstigen Zeichens feststellen, wo das Dräuen eines unheilvollen und schädlichen in Sicht kam. Was Wunder, wenn da, wo unschädliche Zeichen verlästert werden, nur Menschen genarrt werden? Hält man sie ihrer Natur nach für schädlich, trifft Gott den Höchsten der Vorwurf, wenn er etwas Schlechtes schuf und zum Urheber eines Unrechts wurde. Hält man aber dafür, daß sie das Unheil, das sie über Schuldlose, die noch keines verworfenen Verbrechens sich bewußt sind, denen vielmehr vor Schuld Strafe zuerkannt wird, heraufbeschwören, aus ihrem eigenen Übelwollen schöpfen: was wäre so unvernünftig und über den rohen Unverstand unvernünftiger Tiere noch hinausgehend, als ein solches gehässiges, oder aber wohlwollendes Verhalten nicht auf Rechnung des Menschen zu setzen, sondern den Bewegungen der Gestirne zuzuschreiben? Nichts, hieße es da, hat der Mensch verschuldet, sondern ein Unglücksstern hat ihn angeblickt; das Saturngestirn trat ihm in den Weg; ein bißchen Ausweichen würde das Unglück abgewendet, das Verbrechen hintangehalten haben.</p><p>Diese ihre Weisheit indes gleicht dem Spinnengewebe. Gerät eine Mücke oder Fliege darein, kann sie sich nicht davon losmachen, sieht man hingegen ein kräftigereres Tierchen irgendwelcher Art hineingelangen, ist es auch schon darüber hinaus, hat das schwache Gewebe durchschlagen und die nichtigen Fäden zerrissen. So ist das Netz der Chaldäer. Schwache Geister bleiben darin hängen, stärkere können nicht zu Schaden kommen. Seht ihr also, die ihr zu den stärkeren zählt, Astrologen, so sagt euch: Ein Spinnengewebe weben sie, keinerlei Nutzen kann es bergen, aber auch keine Schlingen, wenn du nicht, ein Opfer der eigenen Schwachheit, der Mücke oder der Fliege gleich darin dich verstrickst, sondern dem Sperlinge oder der Taube gleich das schwache Gespinst in raschem, kühnem Flug zerteilst. Welcher vernünftige Mensch wollte denn glauben, daß einem die Bewegungen der Gestirne, die so oft binnen Tagesfrist wechseln und vielfach in sich zurückkehren, die Abzeichen der Herrschergewalt in die Wiege legen? Wenn dem so wäre, wieviele Zeichen würden binnen Tagesfrist die Geburt von Königskindern melden! Tagtäglich würden sonach Könige geboren und ein Übergang der Königskrone auf die Söhne ausgeschlossen sein. Es würden vielmehr stets aus anderen Ständen Prätendenten hervortreten, welche auf die Herrschaft Anspruch erheben. Welcher Herrscher nun braucht seinem Sohne die Nativität stellen lassen, wenn demselben ohnehin die Herrschaft notwendig gebührt, und wenn er die Nachfolge in der Regierung gar nicht nach eigenem Befinden auf die Seinigen übertragen kann? Wir lesen aber fürwahr: „Abias zeugte den Asaph, Asaph zeugte den Josaphat, Josaphat zeugte den Joram, Joram zeugte den Ozias“; und die ganze übrige, bis zur Gefangenschaft herabgeführte Reihenfolge der Könige beruhte auf dem Adel der Geburt. Oder konnten etwa die Könige als solche den Gestirnen die Bewegungen vorschreiben, die sie zu machen hatten? Wo wäre denn der Mensch, der über sie Gewalt hätte?</p><p>Wenn ferner für unsern Handel und Wandel das Fatum der Geburt, nicht die Sittenlehre bestimmend ist: warum wurden dann Gesetze hinausgegeben, desgleichen rechtskräftige Bestimmungen veröffentlicht, durch welche den Ruchlosen Strafe zuerkannt, den Schuldlosen Schutz zugesichert wird? Warum werden Schuldige nicht freigesprochen, nachdem sie doch nach der Behauptung jener (Astrologen) nicht zufolge ihrer Selbstbestimmung, sondern zufolge des Fatums gefehlt haben? Warum müht sich der Landmann und gibt sich nicht lieber der Erwartung hin, die Erntefrucht ob seines Geburtsvorrechtes mühelos in die Scheuerräume sammeln zu können? Ging seine Geburt unter Umständen vor sich, daß ihm sonder Mühe Wohlstand ströme, darf er doch erwarten, daß ihm der Boden von selbst, ohne jede Aussaat, die Erträgnisse erzeuge, daß er die Pflugschar nicht in den Acker senken, die Hand nicht an die krumme Sichel legen, nicht der mühsamen Weinlese sich unterziehen brauche, daß sich ihm vielmehr der strömende Wein von selbst in alle Traubengehänge ergieße, die Olive von freien Stücken, ohne dem Stamm des wilden Ölbaums eingepfropft zu sein, das Öl träufle. Und der geschäftige Kaufmann braucht, da er das weithin wogende Meer durchquert, für sein Leben besorgt, nicht vor Gefahr sich fürchten, wenn ihm des Reichtums Schatz, wie sie sagen, infolge des Geburtsloses müßig in den Schoß fallen kann. Doch so denkt die Allgemeinheit nicht. Unverdrossen durchfurcht daher der Landmann mit „tiefeingelassener Pflugschar“ den Boden, bloß pflügt er, bloß sät er, bloß drischt er in der Sonne Glut die vor Hitze dürre Frucht. Und der Kaufmann kann es, wenn der Süd weht, kaum mehr erwarten, mit dem so oft gefährdeten Fahrzeug das Meer zu durchfurchen. Daher des Propheten Warnung, mit der er deren Kühnheit und Waghalsigkeit verurteilt: „Erröte Sidon, spricht das Meer!“ Das heißt: wenn Gefahren euch nicht hierzu bewegen, soll Scham euch zurückhalten, Scheu einschüchtern. „Erröte Sidon!“ Denn du hast nicht Raum für die Tugend, keine Sorge um das Heil, keine Jugend kampfgewöhnt und kriegsgeschult zur Hut des Vaterlandes, sondern deine ganze Sorge gilt dem Erwerb, dein ganzes Interesse dem Handel. „Wie die Saat des Kaufmanns, so seine Ernte“, heißt es da. Welchen Lohn aber soll der Christ ernten, wenn er in seinem Sinnen und Trachten nicht dem Willen, sondern dem Zwange folgt? Wo Zwangsgebot ― kein Mühelohn.</p><p><strong>Die Synagoge in Halbdunkel und Winterszeit, die Kirche in Mittagshelle und Sommerzeit. Je länger der Tag (des Herrn), je höher die Sonne (der Gerechtigkeit), um so weniger Schatten (Askier, Amphiskier). Die Sonne die Beherrscherin des Tages. Das Mond und Sonnenjahr.</strong></p><p>[Forts. v. ] Vieles haben wir angeführt, mehr wollen wir nicht, damit nicht einer glaube, es seien die Punkte, die wir aus den Aufstellungen der Astrologen zum Zweck der Widerlegung herausgriffen, zur Einführung in dieselben angezogen worden. Wie könnten wir denn Dinge, über die wir schon als Kinder lachten, als Greise noch in den Mund nehmen? ― Jetzt wollen wir uns der Besprechung dessen zuwenden, was nach der Schriftlesung noch erübrigt.</p><p>„Es sollen Leuchten sein, heißt es, zu Zeichen und <em>zu Zeiten und zu Tagen und zu Jahren</em>“. Die Zeichen haben wir besprochen. Welche Zeiten aber wären gemeint als die in stetem Wechsel sich ändernden: Winter, Frühling, Sommer und Herbst? In diesen Zeiten nun zieht die Sonne bald schneller, bald langsamer ihre Bahn; das eine nämlich streift sie nur mit ihrem Strahle, anderes macht sie vor Hitze glühen. Steht die Sonne im Süden, haben wir Winter; denn ist sie weit entfernt, gefriert die Erde vor Frost und starrt vor Kälte, und bedeckt viel Nacht und Finsternis die Lande, so daß die Zeit der Nacht viel länger als die des Tages währt. Damit hängt zusammen, daß während des winterlichen Stürmens übergroße Schnee- und Regenmassen sich ergießen. Kehrt jedoch die Sonne vom Süden her ins Land zurück, bewirkt sie die Nacht- und Taggleiche. Und je mehr ihr Lauf an Dauer zunimmt, um so größere Wärme führt sie allmählich wiederum unserer Atmosphäre zu, um so milderes Windeswehen weckt sie von neuem, dessen belebender Hauch alles zu neuer Fruchtbarkeit anregt, so daß die Erde sproßt und die in den Furchen erstorbenen Samen wieder aufleben, die Bäume grünen und, was auf dem Festlande sich regt und in den Wassern alljährlich der Brut sich erfreut, zur Forterhaltung der Art sich fortpflanzt. Nimmt dagegen die Sonne gegen die Sommerwende den Lauf noch mehr gen Norden, fristet sie die Zeit des Tages hinaus, engt und schränkt dagegen die Nachtzeit ein. Je mehr sie sich nun mit ihrem ständigen Strahlen unserer Atmosphäre verbindet und mitteilt, um so mehr erwärmt sie die Atmosphäre, trocknet der Erde Nässe auf, macht die Samen sprossen und die Obsthaine zu triebkräftiger Säftebildung heranreifen. Zu dieser Zeit, da sie am hellsten strahlt, wirft sie auch mittags die kürzesten Schatten, weil sie die betreffende Stelle von der (Mittags-) Höhe bescheint.</p><p>Daher ruft denn auch die Synagoge im Hohen Liede aus: „Sage mir an, du, den meine Seele geliebt hat, wo du weidest, wo du weilest am Mittag, daß ich nicht etwa werde wie eine Verschleierte bei den Herden deiner Genossen“. Das heißt: Sage mir an, Christus, den meine Seele geliebt hat. Warum nicht besser ‚liebt‛? Doch die Synagoge ‚hat ihn geliebt‘, die Kirche ‚liebt‘ ihn und ändert nimmer ihre Gesinnung gegen Christus. „Wo weidest du,“ fragt sie, „wo weilest du am Mittag?“ Ich verlange als Jüngerin dir zu folgen, die ehedem als Vermählte dich umfing; und deine Herden aufzusuchen, da ich die meinigen verloren habe. „Am Mittag“ weidest du, auf dem Weideplatz der Kirche, wo die Gerechtigkeit erstrahlt und das Recht leuchtet wie die Mittagssonne, wo kein Schatten sichtbar ist, wo die Tage länger sind, weil an ihnen die „Sonne der Gerechtigkeit“ wie in den Sommermonaten länger weilt. So ist denn auch der Tag des Herrn nicht kurz, sondern von großer Dauer, wie geschrieben steht: „Bis der Tag des Herrn kommt, der große“. Daher auch Jakobs Klage: „Die Tage meines Lebens insgesamt, die ich verlebe, sind kurz und schlimm“. Schlimm nämlich ist das Halbdunkel. Über kurzen Tagen lagern Halbdunkel und lange Schatten, in Tage von großer Dauer fällt kein Schattendunkel, wie es beispielsweise und erfahrungsgemäß schon Unzählige in heißeren Gegenden, wo sie auch liegen, erlebt haben. So litt denn die Synagoge ― ihr Vorbild stellt zumal Jakob, sei es in eigener Person, sei es als Repräsentant dieses Volkes dar ― unter gar vielem Dunkel: sie schaute die Sonne der Gerechtigkeit nicht, schaute sie nicht in der Mittagshöhe über ihrem Haupte leuchten, sondern nur aus dem (fernen) Süden, da es Winter für sie war. Der Kirche aber gilt die Botschaft: „Der Winter ist vorbei, vorüber ist’s mit ihm. Blumen kamen auf der Erde zum Vorschein, die Zeit der Ernte ist da“. Vor der Ankunft Christi war es Winter, nach der Ankunft Christi grüßen Frühlingsblumen und des Sommers Ernte. Im Schattendunkel schmachtet jene, aus dem (fernen) Süden, aus der bekehrten Heidenwelt sieht sie ihn leuchten. Das Heidenvolk hingegen, das schmachbedeckte, die Heiden, „die in Finsternis saßen, sahen ein großes Licht“; „die im Bereich des Todesschattens saßen, ihnen strahlte ein Licht auf“, das große Licht der Gottheit, das kein Todesschatten verdunkelt. Aus der Mittagshöhe leuchtet es darum. Auch das steht geschrieben, indem Zacharias beteuert: „Worin uns heimgesucht hat der Aufgang aus der Höhe, um denen zu leuchten, die in Finsternis und im Todesschatten sitzen“. Es gibt freilich auch eine Art Heils-, nicht bloß Todesschatten. So besagt: „im Schatten deiner Fittiche wirst du mich bergen“ zwar einen Schatten, weil von einem Körper herrührend, einen Schatten, weil vom Kreuze fallend, aber einen Schatten des Heils, weil er die Vergebung der Sünden und die Auferstehung der Toten in sich barg.</p><p>Beispielsweise nun können wir anführen, daß die Wintertage kurz sind und längere Schatten werfen, die Sommertage länger, aber kürzere Schatten werfen. Desgleichen fällt am Mittag kürzerer Schatten als zu Tagesanfang oder -ende. So ist es bei uns im Abendlande. Dagegen gibt es in den Mittagsgegenden Bewohner, die volle zwei Tage während des ganzen Jahres ohne Schatten sind, indem sie die Sonne in ihrem Scheitelpunkte haben und darum ihr Licht rings um sich auf allen Seiten. Sie heißen deshalb auf griechisch Askier (Schattenlose). Vielfach auch wird versichert, daß die Sonne so direkt in der Mittagshöhe über uns zu stehen kommt, daß man durch einen engen Brunnenschacht das Wasser in der Tiefe heraufleuchten sieht. Es soll aber in der Mittagszone auch sogenannte Amphiskier (Zweischattige) geben, weil sie nach zwei Seiten Schatten werfen. Wer nämlich die Richtung der Sonne zu einschlägt, hat den Schatten im Rücken: so wenn man in den Morgenstunden gen Osten geht, wenn man am Mittag gen Süden, wenn man bei Tagesuntergang gen Westen sich wendet. Von drei Seiten also kann man die Sonne sich gegenüber haben: von Osten, von Süden, von Westen. Morgens und ebenso abends kann man sie im Rücken, mittags zur Seite haben; dagegen im Norden steht die Sonne niemals, darum kann auch, ob man morgens oder abends oder mittags seine Schritte gen Norden lenkt, kein Schatten im Rücken fallen. Auf dem von uns bewohnten Erdkreise scheinen nur allein die Bewohner der Mittagsgegend den Schatten gen Süden zu werfen. Das soll aber nur im Hochsommer der Fall sein, wenn die Sonne gen Norden sich wendet.</p><p>Sodann nimmt uns der Herbst auf. Er macht nun zwar der großen Hitze ein Ende, führt uns aber, wenn die Hitze bei mittlerer Temperatur mehr und mehr nachläßt und aufhört, sonder Falsch und Arg dem winterlichen Wehen entgegen.</p><p>[Forts. v. ] „Zu Tagen“ auch sollen sie (Sonne und Mond) sein. Sie sollen die Tage nicht schaffen, wohl aber darüber die Herrschaft führen. Es soll die Sonne den anbrechenden Tag mit reichlicherem Glanze aufhellen, soll die Macht haben, mit ihrem Leuchten ihm den Lauf den ganzen Tag über aufzuzeigen. Manche verstehen des Propheten Worte: „Die Sonne (hat er geschaffen) zur Herrschaft über den Tag, den Mond und die Sterne zur Herrschaft über die Nacht“ so: sie sollen rings Licht verbreiten.</p><p>„Zu Jahren“ sind desgleichen Sonne und Mond gesetzt. Der Mond vollendet in je dreißig Tagen zwölfmal seinen Umlauf, bis er das Jahr beschließt, wobei nach jüdischer Observanz noch mehrere Tage ergänzt werden, nach römischer alle vier Jahre einmal durch Einfügung eines Tages der Schalttag begangen wird. Ein Sonnenjahr desgleichen liegt vor, wenn die Sonne nach Vollendung ihres Umlaufes durch den ganzen Tierkreis an den Punkt zurückkehrt, wo sie den Ausgang genommen hat; sie soll nämlich ein Jahr brauchen, bis sie ihre ganze Bahn zurücklegt.</p><p><strong>Beweis: sie erscheint allen Menschen aller Lande im gleichen Augenblicke gleich groß, gleich nah und fern: ihr scheinbar ellengroßer Umfang nur Sinnestäuschung. Gottes weise Vorsehung in der Regelung der Sonnenwärme für die Erde.</strong></p><p><em>„Es schuf also Gott diese beiden großen Leuchten“</em>: ‚groß‘ ― so können wir es verstehen ― nicht sowohl im Vergleich zu den anderen Dingen, als vielmehr in ihrer Ausstattung selbst. So ist der Himmel groß, das Meer groß. Ja groß ist auch die Sonne, die mit ihrer Wärme den Erdkreis, bezw. der Mond, der mit seinem Lichte nicht bloß die Erde, sondern auch die Luft und das Meer und den sichtbaren Himmel erfüllt. Wo immer sie am Himmel stehen, leuchten sie allen Wesen und werden allen gleicherweise sichtbar. So meint jedes Volk, sie weilten nur in ihrem Bereiche und seien da und leuchten nur für sie, während sie gleicherweise allen übrigen leuchten. Niemand darf glauben, es stünde jemand anderer denselben näher als er selbst. Beispielsweise spricht augenscheinlich für ihre Größe, daß die Mondscheibe allen gleich erscheint; denn wenn auch ihr Licht zeitweise zu- oder abnimmt, so erscheint sie doch in der gleichen Nacht allen genau so wie mir. Käme sie nämlich Fernstehenden kleiner, Näherstehenden größer vor, würde sie damit ein Anzeichen beschränkten und geringen Umfanges geben. Alles andere dünkt uns ja aus der Ferne kleiner; beim Besehen aus größerer Nähe halten wir’s schon für größer; und je mehr man in die nächste Nähe kommt, um so mehr wächst einem der Gegenstand, den man sieht, an Umfang. Der Sonne Strahl hingegen ist keinem näher, keinem ferner. Ähnlich ist auch der Mond für alle gleich groß. Die gleiche Sonne wird im nämlichen Augenblick, da sie aufgeht, den Indern und Britannen sichtbar; und da sie im Westen hinabsinkt, erscheint sie dem Morgenländer nicht kleiner als dem Abendländer; und da sie aufgeht, dünkt sie dem Abendländer nicht geringer als dem Morgenländer. „Wie weit doch, heißt es, liegt der Aufgang vom Niedergange!“ Weitab liegen beide voneinander, doch die Sonne liegt keinem weitab, liegt keinem näher, keinem ferner.</p><p>[Forts. v. ] Stoße dich nicht daran, weil dir der Sonnenball, wenn er aufleuchtet, nur ellengroß erscheint, bedenke vielmehr, welch unermeßlicher Raum zwischen der Sonne und der Erde sich dehnt, den unser schwacher Blick nicht ohne große Selbsteinbuße zu durchmessen vermag. Es dunkelt vor unserem Auge: dunkelt darum auch die Sonne oder der Mond? Eng begrenzt ist unser Blick: verengt und verkleinert er darum auch die Gegenstände, auf die er fällt? Nur scheinbar nehmen sie ab, ihre Größe leidet keine Einbuße. Wir dürfen eben die Mangelhaftigkeit, an der wir leiden, nicht auf die Himmelsleuchten übertragen, als ob diese daran litten. Unser Auge trügt, halte darum sein Urteil nicht für sicher! Es verringert sich vielmehr nur das Bild, das sich das Auge von den Himmelskörpern macht, nicht die wirkliche Gestalt. Verlangt es dich, von einem hohen Berggipfel das Gefilde, das tief unten vor deinen Augen sich breitet, und die weidenden Herden darauf zu schauen: werden dir ihre Leiber nicht wie Ameisen vorkommen? Läßt du von irgendeinem Aussichtspunkte am Gestade den Blick über das Meer schweifen: kommen dir nicht die größten Schiffe, die ihre weißen Segel aus der blauen Flut aufschimmern lassen, wie Tauben vor, die in der Ferne über dem Meere schweben? Wie? Selbst die Inseln, die das Meer teilen, die hier und dort fruchtbares Festland darin einbetten: wie knapp dünkt einem der Ufersaum, der sie einschließt? Wie abgerundet erscheinen sie trotz ihrer Zerrissenheit! Wie dicht aneinanderliegend trotz ihrer sporadischen Vereinzelung! Diese Schwächen deines Auges also bedenke, und du wirst, ein richtiger Beurteiler, aus dir selbst die Glaubwürdigkeit unserer Ausführungen schöpfen.</p><p>Doch willst du die Größe der Sonne nicht bloß mit dem geistigen, sondern auch mit dem leiblichen Auge messen? Betrachte, wie viele Sternenbälle die Himmelsachse verbrämen und mit unzähligen Lichtern prägen! Und doch vermögen sie das Dunkel der Nacht und des Himmels finstere Wolken nicht zu verscheuchen. Sobald die Sonne die Zeichen ihres Aufganges voraussendet, verblaßt aller feuriger Glanz der Sterne vor dem Strahl des einen Lichtgestirnes, der Luftkreis erschließt sich und purpurrot flammt rings des Himmels Flur. Ein erstes Aufleuchten nur:und schon erstrahlt mit Blitzesschnelle voller Lichtglanz, und haucht der aufgehenden Sonne süßes Wehen. Sage mir doch: wäre der Sonnenball nicht groß, wie könnte er den großen Erdkreis mit Licht erfüllen?</p><p>[Forts. v. ] Was aber soll ich von der so genau abwägenden und abmessenden Fürsorge des Schöpfers sprechen, der die Tätigkeit der Sonne derart regelte, daß ihre, wie es scheint, lohende Glühhitze weder die Wasseradern der Erde und der Dinge Anmut aufzehren, noch umgekehrt beim Hindurchgehen durch die so unermeßlichen Welträume soweit abkühlen sollte, daß sie der Erde keine befruchtende Wärme mehr zuführt, sondern, statt mit warmem Hauche den Segen ihrer Fruchtbarkeit zu wecken, sie arm und bar an Früchten läßt?</p><p><strong>Der ab und zunehmende Mond, sein Einfluß auf gewisse Naturvorgänge. Doch nicht der Neumond, sondern Gottes Vorsehung spendet den Regen. Der zunehmende Mond die Ursache von Ebbe und Flut.</strong></p><p>Auch vom Monde trifft Ähnliches zu, was wir von seiner Genossin und Schwester hervorgehoben haben. Er bekleidet ja mit der Schwester den nämlichen Dienst; hellt die Finsternis auf, hegt die Samen, fördert die Frucht. Manches auch hat er verschieden von der Schwester: so ersetzt der Tau in der kurzen Spanne der Nacht genau die Feuchtigkeit, welche die Hitze den ganzen Tag über auftrocknet. Auch der Mond selbst soll ja reichlich von Tau triefen. So ergießt sich denn, wie man versichert, gerade bei heiterer Nacht und nächtlichem Mondschein besonders reichlicher Tau über die Fluren. Und gar mancher, der im Freien nächtigte, machte die Wahrnehmung, daß auf seinem Haupte um so mehr Feuchtigkeit sich ansetzte, je mehr er dem Mondlicht ausgesetzt war. Darum auch Christi Entgegnung im Hohen Liede der Kirche gegenüber: „Mein Haupt ist voll des Taues und meine Locken perlen von nächtlichen Tropfen“. ― Ferner sodann nimmt der Mond ab und zu. Den geringsten Umlauf hat er bei seiner Verjüngung als Neumond; zu nimmt er auf seine Abnahme hin. Darin nun liegt ein großes Geheimnis. Es machen nämlich die Naturdinge sowohl seine Abnahme mit, wie sie auch nach ihrer Abnahme mit seinem Wachstum zunehmen: so das Hirn der lebenden Wesen, die Saftmenge der Seetiere; am vollsaftigsten sollen ja die Austern und die vielen anderen (Muscheltiere) bei zunehmendem Monde sein. Vom Inneren der Bäume berichten Leute, die aus eigener Erfahrung schöpfen, dasselbe. Daraus sehen wir also, daß die Zunahme und Abnahme des Mondes auf Zweckmäßigkeit beruht, nicht Mangelhaftigkeit verrät. Er würde ja nimmer eine so große Veränderung bei den Dingen hervorrufen, käme ihm nicht ein besonderes Maß von Kraft und Vorzüglichkeit zu, das ihm vom Schöpfer verliehen wurde.</p><p>Ebenso soll sich, wofür auch einige christliche Gelehrte sich aussprachen, die Luft regelmäßig ändern, sobald der Mond von neuem zunimmt. Doch würde das eine notwendige Wirkung des Mondwechsels sein, müßte der Himmel jedesmal bei zunehmendem Monde sich mit Wolken bedecken, strömender Regen fallen. So äußerte jemand, als vor Tagen vom Regen die Rede war und dabei die Bemerkung fiel, wie nützlich er wäre: „Sehet! Der Neumond wird ihn bringen.“ Und doch, so sehr wir den Regen herbeisehnten, wünschte ich nicht, daß solche Behauptungen sich bewahrheiteten. So war ich denn froh, daß kein Regen fiel, bis er dann auf die Bitten der Kirche gespendet wurde: ein klarer Beweis dafür, daß er nicht von der beginnenden Zunahme des Mondes zu erhoffen ist, sondern von der Vorsehung und der Barmherzigkeit des Schöpfers. ― Die Sunde nun freilich stehen, während sie bei den übrigen Mondphasen ringsum mächtig wogen, die Wassermassen, die sie aufgenommen, zurückwälzen, oder aber selbst von deren gewaltigen Strömung fortgerissen werden, beim Eintritt des Neumondes, solange er ohne Licht ist, stille. Sobald ihn aber die folgenden Tage wieder in Sicht bringen, beginnen sie von neuem den hin- und wiederflutenden Wogengang. Auch die Ebbe, wie sie vom Ozean berichtet wird, soll, während sie an den sonstigen Tagen ihren regelmäßigen Verlauf nimmt, bei wiederzunehmendem Monde eine auffallende Änderung zeigen. Es wogt das Westmeer, welches das Schauspiel der Ebbe bietet, weiter als sonst hin und zurück. Es schlägt mit größerer Brandung ans Gestade, wird unter gewissen Einflüssen des Mondes zurückgeworfen, unter den nämlichen Einflüssen von neuem herangewälzt und zurückgeschleudert, bis es wiederum seinem normalen Wogengange anheimgegeben wird.</p><p><strong>Die Lächerlichkeiten der Magie scheitern an Mond und Kirche: Paulus und Elymas: Petrus und Simon Magus.</strong></p><p>Solltest du dich nun wundern, wie der Mond eine Abnahme erleiden kann, nachdem doch sein Wechsel eine so gewaltige Kraftwirkung äußert, so bedenke, daß auch hierin ein großes Geheimnis liegt. An seinem Beispiele erkennst du, o Mensch, daß es unter den menschlichen Dingen und in der ganzen Weltschöpfung nichts geben kann, was nicht einmal vergehen wird. Wenn selbst der Mond, den der Herr mit dem so erhabenen Dienste, den Erdkreis zu beleuchten, betraute, wächst und wieder abnimmt alles eben, was aus dem Nichts hervorgegangen zur vollen Entwicklung gelangt, nimmt ab und nimmt von neuem ab, wenn es von neuem zur Entwicklung gelangt; denn „Himmel und Erde werden vergehen“; wie sollten wir daraus nicht die Lebensregel ableiten einerseits in Widerwärtigkeit die Fassung nicht zu verlieren er, der alles aus dem Nichts gemacht hat, ist ja leicht imstande, dich auch zum Höchsten und Vollkommenen emporzuführen, anderseits im Glück uns nicht zu überheben, nicht irgendwie auf Macht und Reichtum uns etwas zugute zu tun. nicht auf Körperkraft und schönheit, die so leicht der Vergänglichkeit, so häufig der Veränderlichkeit anheimfallen, zu pochen, sondern nach geistigem Gnadenbesitz von bleibendem Wert für die Zukunft zu streben. Denn wenn dich schon die Abnahme des Mondes traurig stimmt, der sich doch stets verjüngt und erneut; viel trauriger muß es dich stimmen, wenn die Seele,nachdem sie im Tugendfortschritt bereits zur Vollkommenheit gelangt war, nachher wiederum so häufig ihrem Vorsatze untreu wird und aus Unbeständigkeit und Unbedachtsamkeit des Geistes ihren Eifer ändert: ein Beginnen, das Torheit und Unwissenheit verrät. Darum das Schriftwort: „Der Tor wechselt wie der Mond“. Der Weise also wechselt nicht mit dem Monde, sondern „wird beharren mit der Sonne“. Nicht den Mond nun trifft der Vorwurf der Torheit; denn nicht der Mond wechselt wie der Tor, sondern „der Tor wechselt wie der Mond“. So währt ja des Gerechten Nachkommenschaft „gleich dem Vollmond auf ewig, und der Zeuge im Himmel ist getreu“. Etwas anderes besagt: dienstbar sein müssen, etwas anderes bewußt bald so bald anders sich bestiommen lassen und aus schwächlicher Gesinngung keine feste Geistesrichtung einschlagen. Für dich müht der Mond sich, des Willens Gottes wegen ist er unterwürfig; „denn der Vergänglichkeit ist die Schöpfung unterworfen, nicht freiwillig, sondern um dessen willen, welcher sie unterworfen hat auf Hoffnung hin“. Der Mond ändert sich sonach nicht freiwillig, du änderst dich freiwillig. Er „seufzt und liegt in Wehen“, ob seiner Veränderlichkeit, du hast kein Einsehen und lachst häufig dazu. Er harrt mit vieler Sehnsucht auf deine Erlösung, um zur Befreiung aus der allgemeinen Dienstbarkeit der ganzen Schöpfung zu gelangen, du setzt deiner Erlösung wie seiner Befreiung nur Hindernisse entgegen. Deine, nicht seine Torheit ist also schuld, daß auch er noch der Veränderlichkeit unterliegt, solange du auf dich warten läßt und selbst spät dich nicht bekehrst.</p><p>Beurteile also den Mond nicht nach dem leiblichen Auge, sondern mit dem klaren Blick des Geistes!. Der Mond nimmt ab, um den Dingen ihre Fülle zu geben. Das ist nun ein großes Geheimnis. Dem verdankt er das, der allen Dingen ihre Ausstattung verliehen hat. Jener entäußerte ihn, daß er diese Fülle spende, der auch sich selbst entäußert hat, um alle Dinge zu erfüllen. Er hat sich nämlich entäußert, um für uns herabzusteigen, um für alle aufzufahren; denn „aufgefahren, so heißt es, ist er über die Himmel, damit er alles erfülle“. Er also, der in Selbstentäußerung erschienen, hat aus seiner Fülle die Apostel erfüllt. Darum versichert einer von ihnen: „Denn aus seiner Fülle haben wir alle empfangen“. So kündete also der Mond das Geheimnis Christi an. Nichts Geringes ist er, in welchen Christus sein Zeichen setzte; nichts Geringes, der ein Bild der geliebten Kirche darstellt. Das zeigte der Prophet mit den Worten an: „Aufgehen wird in seinen Tagen die Gerechtigkeit und des Friedens Fülle, bis weggenommen wird der Mond“. Und im Hohen Liede spricht der Herr von seiner Braut: „Wer ist doch die, welche hervorschaut wie das Morgenrot, herrlich wie der Mond, auserlesen wie die Sonne?“ Und mit Recht gleicht die Kirche dem Monde: Auch sie leuchtet der ganzen Welt und ruft, die Finsternis dieser Welt aufhellend,aus: „Die Nacht ist vorgerückt, der Tag hat sich genaht“. Sinnig heißt es: „welche hervorschaut“, als blickte sie von der Höhe auf die Ihrigen herab. So heißt es ähnlich: „ Der Herr schaut vom Himmel auf die Menschenkinder“. Auch die Kirche nun, die hervorschaut, hat wie der Mond ihre oftmalige Abnahme und Zunahme, aber auf ihre Abnahme wuchs sie und verdiente sich neuen Zuwachs: die Verfolgungen bringen ihr Verlust, das Martyrium der Bekenner Siegeskronen. Sie ist der wahre Mond. Vom unvergänglichen Lichte ihres Brudergestirnes borgt sie das Licht der Unsterblichkeit und Gnade. Denn die Kirche leuchtet nicht im eigenen, sondern im Lichte Christi und entlehnt ihren Glanz von der „Sonne der Gerechtigkeit“, so daß sie sprechen kann: „Ich lebe aber: nicht mehr ich, es lebt aber in mir Christus“. Selig wahrlich [ o Mond], der du so großer Auszeichnung gewürdigt wardst! Selig möchte ich dich preisen nicht wegen deiner Neumonde, sondern als Typus der Kirche. In ersterer Beziehung bist du ja nur unser Diener, in letzterer unser Liebling.</p><p>Wie lächerlich aber, daß man vielfach wähnt dich mit Zauberforneln beschwören zu können! Alte Weibermärchen und Volksaberglaube! Wer wollte denn glauben, daß ein zu so erhabenem Dienst berufenes Geschöpf Gottes durch chaldäischen Aberglauben sich versuchen ließe? Jener mochte fallen, der in einen Engel des Lichtes sich wandelt und durch seinen eigenen Willen, nicht durch Zaubersprüche von der Höhe gestürzt wurde. Freilich auch damit glaubt man dich, o Kirche, von deiner Stellung und deinem Stande herabstürzen zu können. Viele nahen verführerisch der Kirche, doch der Wahrsagekunst Zaubersprüche können ihr nicht schaden. Nichts vermögen die Zauberer, wo täglich Christi bezaubernder Lobgesang gesungen wird. Ihren ‘Wahrsager’ hat die Kirche am Herrn Jesus, durch welchen sie die Sprüche der wahrsagenden Magier und der Schlangen Gift unwirksam machte. Sie tilgt gleich der erhöhten Schlange die giftigen Nattern und der Ägypter noch so verhängnisvoller Murmelspruch wird im Namen Jesu zu stumpfer Waffe. So hat auch Paulus den Zauberer Elymas mit Blindheit geschlagen, indem er ihm nicht bloß den Seherblick der Wahrsagekunst, sondern auch das Augenlicht nahm. So hat Petrus den Simon, der auf dem Fittiche der Magie zur Himmelshöhe aufstrebte, herabgeschleudert und niedergestreckt, indem er der Gewalt seiner Zaubersprüche den Flügel lähmte.</p><p>Einen schönen Verlauf, wie ich glaube, vernahm der vierte Tag. Wie kann also ‘der Vierte’ gar manchem, wie es so häufig vorkommt, als verrufen und ein Beginnen an diesem Datum für nachteilig gelten, an welchem doch die ganze Welt im Glanze neuen Lichtes erstrahlte? Oder nahm etwa die Sonne unter ungünstigen Zeichen ihren Anfang? Wie kann sie dann, die ihren eigenen Geburtstag nicht [glücklich] zu wählen verstand, einem anderen Gutes anzeigen? Oder wie will man auf ihre Zeichen etwas geben, wenn man auf ihren Ursprung nichts gibt? Was sollen wir ferner vom Monde sagen, der ebenfalls am vierten Tage seinen Anfang nahm und mit dem vierzehnten [Nisan] den Tag des Heils anzeigt? Oder gefällt das Datum nicht, an dem die Feier des Geheimnisses unserer Erlösung einfällt? Deshalb suchen die Dämonen diesen Vierten in Verruf zu bringen, weil an ihm ihre Bosheit zunichte wurde. Darum soll man nach der Behauptung der Heiden nichts an ihm beginnen, weil sie wissen, daß damals zum ersten Mal ihre Zauberkünste mehr und mehr verlassen wurden und die heidnischen Volksmassen zur Kirche übertraten. Der vierte Monatstag wie sie glauben, bedeutet, wenn er klar und die Sicht dunstfrei ist, für die folgenden Tage bis zum Schluß des Monats heiteres Wetter. Daß die beginnende Heiterkeit bereits mit seinen Anfängen zusammenfällt, das wollen sie nicht.</p><p>Doch laßt uns jetzt Obacht geben, daß uns nicht etwa während des Vortrages der vierte Tag untergehe! Denn schon fallen ziemlich lange Schatten von den Bergen, das Licht nimmt ab, die Dunkelheit zu.</p><h2>5</h2><p><strong>ihr besonderer Vorzug. Die unbeschreibliche Fülle des Lebens in den Wassern. Die Wassertiere im gewissen Sinn ‘Reptilien’.</strong></p><p>Schon prangte das ganze Festland im Gewande mannigfaltigen Grünes, schon erstrahlte desgleichen der Himmel im Glanze der Sonne und des Mondes, der beiden Augen seines Antlitzes, sowie der Sternenpracht: Noch erübrigte das dritte Element, nämlich das Meer, daß auch ihm der Segen des Lebens durch Gottes Geschenk würde. Vom Lufthauch genährt, regten sich alle Keime auf dem Festlande, die Erde löste jegliche Samen auf und weckte sie zum Leben und sproßte dank ihrer Belebung am üppigsten gerade damals, da zum ersten Mal das Wort Gottes sie aufblühen hieß: Nur das Wasser stand noch leer und schien der Spende aus Gottes schaffender Hand entraten zu müssen. Noch verfügte indes der Schöpfer über eine Ausstattung, die er ihm verliehen, durch die er die Gabenfülle des Festlandes aufwägen wollte. Auch dem Wasser wahrte er das Anrecht auf einen besonderen und einzigartigen Vorzug in der Ausstattung, die ihm verliehen wurde. Wohl erzeugt zuerst das Festland Leben, doch nur in Wesen ohne atmende Seele: Das Wasser aber bringt auf Gottes Geheiß Erzeugnisse hervor, ausgezeichnet mit der Kraft und Würde einer lebendigen Seele und ausgestattet mit dem Instikte zum Schutze des Lebens und zur Vermeidung des Todes.</p><p>Es sprach also Gott: „Es sollen hervorbringen die Wasser die kriechenden Tiere mit lebendiger Seele nach ihrer Art und die Vögel, daß sie hinfliegen an der Veste des Himmels“. Der Befehl erging und mit einem Mal öffnete sich der Schoß des Wassers zu den Erzeugungen, die anbefohlen waren: Es gebaren die Flüsse, es zeugten die Seen, selbst das Meer begann kreißend die verschiedenen Arten der kriechenden Tiere hervorzubringen und, was immer es geformt hatte, nach seiner Art zeugend ins Dasein zu setzen. Kein Tümpel so klein, kein Sumpf so morastig, daß sie leer geblieben wären, daß sie nicht alle vielmehr die ihnen verliehene Zeugungskraft genutzt hätten. Da hüpften Fische aus dem Flusse auf, Delphine spielten, den Reigen eröffnend in den Fluten, Purpurschnecken hingen an den Felsenriffen, Austern in den Tiefen, Echinen wuchsen heran weh mir!: vor dem Menschen schon fängt der Sinnenreiz, der Vater unserer Völlerei, vor dem Menschen schon fangen die Leckerbissen an! Des Menschen Verführung regt sich früher denn das Menschengeschöpf. Doch nicht die Natur trifft irgendwelche Schuld. Nur Nahrung bot sie, nicht sündhaften Mißbrauch gebot sie. Allen mitsammen reichte sie dieselbe dar, daß du dir nicht das eine und andere als dein Eigen anmaßest. Für dich bringt das Festland seine Früchte hervor, für dich erzeugen die Wasser Skarus und Azipenser und ihre sonstigen Erzeugnisse alle. Und damit nicht zufrieden, kostetest du von verbotener Speise! Dir zum Unheil bietet alles sich in Fülle, um die Sündenlast deiner Gier zu häufen.</p><p>Doch wir vermögen nicht einmal die vielen Arten und Namen der Wesen aufzuzählen, die alle im Augenblick des göttlichen Schöpfungsbefehles ins Leben gerufen wurden. Gleichzeitig nahm der Leib seine Gestalt an und trat das animalische Prinzip in Wirksamkeit und mit ihm eine Art vitale Lebenskraft. Bedeckt war das Festland von sprossendem Grün, das Meer wurde erfüllt von lebenden Wesen. Dort erblüht üppiges vegetatives, hier regt sich animalisches Leben. Sogar am Festlande verlangt sich das Wasser seinen Anteil: Es beschnuppern die Fische im Wasser das Land und holen sich Beute daraus;desgleichen machen Schnaken und Frösche sich vernehmlich am Rande ihrer heimischen Sümpfe: auch sie haben des Herrn Befehl vernommen, da er sprach: „Es sollen hervorbringen die Wasser die kriechenden Tiere mit lebendiger Seele“.</p><p>Reptilien [Kriechtiere] nennt man, wie wir wissen, die verschiedenen Arten von Schlangen, weil sie über der Erde dahinkriechen. Doch in viel höherem Grade hat jedes Schwimmtier das Aussehen und die Natur eines Reptils. Denn wenn sie auch beim Untertauchen in die Tiefe das Wasser durchschneiden, schlängeln sie sich doch beim Schwimmen an der Oberfläche mit dem ganzen Körper dahin und ziehen letzteren gleichsam über dem Rücken des Wassers nach sich. Darum ruft auch David aus: „Das ist das Meer, das große und weite; darin Kriechtiere ohne Zahl“. Noch mehr. Viele derselben haben Füße und gebrauchen sie zum Gehen, indem sie Amphibien sind, die teils im Wasser, teils auf dem Lande leben, wie die Robben, die Krokodile, die Flußpferde, Nilpferde genannt, weil sie im Nilstrom zur Welt kommen: dennoch wandeln sie nicht, wenn sie sich an der Oberfläche des Wassers aufhalten, sondern schwimmen, und bedienen sich des Fußes nicht zum Gehen, sondern wie eines Ruders zum Gleiten. Auch das Schiff gleitet ja, vom Ruderschlag bewegt, dahin, und sein Kiel durchfurcht die Wasser.</p><p><strong>Arten und Namen derselben übertragen sich auf die Landtiere. Als Landtiere schädlich und furchtbar, sind sie als Wassertiere nützlich und zahm. Der tiefe Friede in den Wassern.</strong></p><p>„Es sollen hervorbringen die Wasser die kriechenden Tiere“, sprach der Herr: ein kurzes Wort, aber ein machtvolles und weithin wirkendes, das den kleinsten wie dem größten Wesen die gemeinsame [Reptilien]Natur einpflanzte. Im nämlichen Augenblick tritt der Walfisch ins Dasein, da kraft des gleichen Schöpfungsaktes der Frosch ins Leben tritt. Mühelos legt Gott an die größten, unverdrossen an die kleinsten Werke Hand an. Ohne Wehen gebiert die Natur den Delphin, wie sie ohne Wehen die kleine Purpur und Meerschnecke erzeugte. Beachte, o Mensch, wie im Meere noch unvergleichlich mehr Wesen sich regen als auf dem Lande! Zähle, wenn du kannst, alle Fischarten von den kleinsten bis zu den größten: die Tintenfische, Polypen, Austern, Meerund Flußkrebse, und innerhalb derselben die unzähligen Individuen ihrer Art! Was soll ich die Schlangenarten nennen: die Drachen, Muränen, Aale? Nicht will ich übergehen die Skorpione, Frösche, Schildkröten, ferner die Meerottern und Seehunde, die Meerkälber, Walungeheuer, Delphine, Robben, Seelöwen. Was soll ich noch anreihen die Meeramseln und Drosseln und Pfaue, deren Farbe wir auch in der Vogelwelt wiederbegegnen? So sind die Amseln schwarz, die Pgauen an Rücken und Hals schillernd, die Drosseln am Bauche gefleckt. Was [soll ich anreihen] die übrigen Seetiere, deren Arten und Namen auch das Festland sich belegte? Zuerst nämlich traten diese im Meere und in den verschiedenen Flüssen hervor, da ja das Wasser zuerst auf das göttliche Willensgebot hin „die kriechenden Tiere mit lebendiger Seele“ hervorbrachte.</p><p>Dazu kommt der weitere Vorzug, daß die Tiere, die wir auf dem Festlande fürchten, im Wasser unsere Lieblinge sind. Als Landtiere schädlich, sind sie als Wassertiere unschäflich und selbst die Schlange ohne Gift. Der Löwe, der Schrecken auf dem Festlande, ist in den Fluten sanft; die Muräne, nicht ganz ungiftig, wie es heißt, ein um so köstlicherer Leckerbissen; der Frosch, das widerliche Sumpftier, als Wassertier [Seefisch] lieblich und an Güte fast alle Speisen übertreffend. Will jemand noch mehr darüber erfahren, mag er sich bei den verschiedenen Fischern an Ort und Stelle erkundigen; denn man kann nicht alles wissen. Vor den Hunden freilich hüte dich selbst im Wasser, wie sie auch in der Kirche eine unliebsame Erscheinung und zu fliehen sind nach des Apostels Wort und Weisung: „Hütet euch vor den Hunden, hütet euch vor den schlechten Arbeitern!“ Die Mustela [Marder] verbreitet auf dem Lande üblen, im Wasser lieblichen Geruch. Sie weiß als Landtier mit der Strafe ihres Gestankes sich zu rächen. Als Wassertier ist sie gefangen ebenso lieblich wie in der Freiheit. Auch dich, Thymallus, will ich nicht ohne ehrendes Gedenken unsererseits übergehen. Den Namen hast du von der [Thymian]Blume. Ob dich die Flut des Tessinflusses oder die Flut der lieblichen Etsch aufgenährt: eine Blume bist du. Das bezeugt denn auch zu deutlich die Redeweise, wonach man von einem, der lieblichen Wohlgeruch verbreitet, die feine Wendung gebraucht: ‘er duftet nach Fisch’ oder ‘nach Blume’; so sind also Fisch und Blumenduft nach dem Sprachgebrauch dasselbe. Was kann es Zierlicheres geben als deine Gestalt, was Entzückenderes als deine Anmut, was Duftigeres als deinen Wohlgeruch? Den Duft, den der Honig verbreitet, den atmest du mit deinem Leibe aus. Was soll ich dann sprechen von der zarten Art der Rabenfische, was von jener der Seelöwen? Vor diesen Löwen kennt das Lamm keine Furcht. So friedlich geht es im Wasser her, daß die Löwen den [Meer]Kälbern weichen. so daß mit Recht auf sie jener prophetische Ausspruch über die Heiligkeit der Kirche zutrifft: „Dann werden Wölfe und Lämmer zusammen weiden, Löwe und Rind zusammen Stroh verzehren“. Kein Wunder, da ja auch in der Kirche das [Tauf]Wasser die Wirkung hat, Räuber kraft der Abwaschung ihrer Verruchtheit den Unschuldigen gleichzumachen. Was soll ich desgleichen die Purpurschnecke erwähnen, welche Königstafeln zieren, Königsmäntel färben? Vom Wasser also stammt die Pracht an den Königen, von der man huldigend niedersinkt; vom Wasser die Herrlichkeit, die an ihnen strahlt. Nimm dazu die Meerschweinchen, die auch den Juden munden; denn es gibt nichts Unreines, was das Wasser nicht reinigte. Eben darum können sie dieselben nicht gleich den Schweinen auf dem Festlande für unrein halten.</p><p><strong>Deren einzigartige Pietät. Die Reinheit der Fortpflanzung innerhalb der gleichen Art: sie ist ein Protest ebenso gegen naturschänderische Bastardzüchtung wie gegen frevle Entmannung.</strong></p><p>Zahllos nun sind die Gepflogenheiten, zahllos die Arten der Fische. Die einen, wie jene größeren, gefleckten, die man Forellen nennt, erzeugen Eier und legen sie zur Ausbrütung ins Wasser. Das Wasser also gibt ihnen, gleichsam eine zärtliche Mutter der lebenden Wesen, Leben und Dasein und vollzieht so heute noch die Aufgabe, die ihm jenes erstmalige Gebot wie ein dauerndes Gesetz übertragen hat. Andere Fischarten erzeugen lebendige Junge aus ihrem Leibe, wie die Meerottern und Seehunde und Walungeheuer, die Delphine und Robben und andere derartige Seetiere. Wenn nun diese, nachdem sie geboren, merken, daß etwa jemand ihre Jungen irgendwie gefährde und bedrohe, sollen sie, um dieselben zu schützen oder der zarten Brut mit mütterlicher Besorgnis die Angst zu beheben, den Rachen öffnen und die Jungen schonend zwischen die Zähne nehmen, sogar in ihr Inneres aufnehmen und im Mutterschoße bergen. Welche menschliche Liebe könnte es solcher Mutterliebe bei den Fischen gleichtun? Mit dem Kusse müssen wir uns begnügen; ihnen genügt er nicht; sie öffnen ihr Inneres, nehmen die Jungen wohlbehalten darin auf und dahin zurück, beleben sie gleichsam von neuem mit dem Hauche ihrer Wärme, kosen sie mit ihrem Odem und leben solange zu zwei in einem Leib, bis sie ihrer Brut entweder Sicherheit, oder aber im Bollwerk ihres Leibes Schutz vor Gefahren verschaffen. Wer wollte nicht angesichts dessen der so zärtlichen Liebe der Fische schonen, auch wenn er ihrer habhaft werden könnte? Wer würde nicht von Bewunderung und Erstaunen darüber ergriffen, daß die Natur bei den Fischen treu wahrt, was sie bei den Menschen nicht wahrt? Gar manche töteten aus Argwohn in stiefmütterlicher Gehässigkeit ihre heißersehnten Kinder, andere zehrten in Hungersnot, wie wir lesen, ihre eigene Leibesfrucht auf. Menschenlieblingen ward „die Mutter zum Grab“, der Fischbrut der Mutterschoß, der die Lieblinge mit seinen innerlichen Organen wie mit einem Walle unversehrt beschützt, zur Wehr.</p><p>Es haben nun die verschiedenen Fischarten ihre verschiedenen Gepflogenheiten. Die einen erzeugen Eier, die anderen bringen lebendige und ausgestaltete Junge zur Welt. Und auch die Eiererzeugenden bauen bauen nicht gleich den Vögeln Nester, unterziehen sich nicht der Mühe langwierigen Brütens und obliegen nicht unter eigener Entbehrung der Aufzucht. Das Ei tritt kaum aus und schon nimmt es das Wasser wie eine zärtliche Amme gleichsam in seinen Naturschoß und brütet es aus; denn das ist e i n Prozeß; kaum ist das Ei durch die Berührung des Männchens begattet, fällt es auch schon nieder und das Fischlein schlüßft aus.</p><p>Ferner sodann: wie rein und unversehrt geht die Fortpflanzung vor sich! Kein Fisch geht mit einem fremden, sondern nur mit seinesgleichen die Vermischung ein, der Thymallus mit dem Thymallus, der Seewolf mit dem Seewolf. Auch der Drachenkopf wahrt die Lauterkeit unversehrter Verbindung mit seinesgleichen. Er teilt somit die Keuschheit mit seinem [Schlangen]Geschlecht, teilt aber nicht das Gift mit seinem Geschlecht; denn der Drachenkopf verwundet nicht, sondern mundet nur. So wissen denn die Fische nichts von unnatürlichen Verbindungen zwischen Angehörigen einer fremden Art, wie es jene zwischen Esel und Pferd sind, die von den Menschen mit großer Beflissenheit betrieben werden, oder wie es umgekehrt die Vermischungen zwischen Pferd und Eselin sind: wahre Schändungen der Natur. Denn ein größeres Vergehen ist doch sicherlich ein Handeln, das nur Entweihung der Natur denn zur Verletzung einer Person führt. Und das treibst du, Mensch, als Kuppler tierischer Unzucht und hältst den Bastard wertvoller als die echte Rasse. Du paarst fremde Arten, mischest ungleichartige Samen, zwingst Individuen sooft wider ihren Willen die verbotene Begattung auf: und das heißt du ‘wirtschaften’. Und weil du solches beim Menschen nicht treiben kannst, nimmst du ihm, um eine Zeugung aus dem Geschlechtsverkehrt mit Nichtseinesgleichen zu verhüten, was er von Geburt ist, raubst dem Manne die Mannbarkeit, hebst durch Verstümmelung eines Körpergliedes sein Geschlecht auf, machst ihn zum Kastraten: Frivolität soll am Menschen vollführen, wozu die Natur nimmer die Hand bot.</p><p><strong>Was die Luft für die übrigen lebenden Wesen, ist das Wasser für die Fische. Lungenund Kiemenatmung.</strong></p><p>Ein wie guter Mutterschoß aber das Wasser ist, das schließ auch aus Folgendem: Du, o Mensch, hast Enterbung der Kinder durch die Eltern, Verstoßung derselben, Haß und Mißgunst gelehrt: so lerne, wie innige Bande Eltern und Kinder verknüpfen sollen! Es können die Fische nicht ohne das Wasser leben, lassen sich nicht von der Verbindung mit ihrem Mutterelement trennen, nicht der Wartung ihrer Amme entreißen und sterben naturgemäß auf der Stelle, sobald sie davon getrennt werden. Sie fristen nämlich ihr Leben nicht wie alle sonstigen Wesen durch Luftatmung; sie bedürfen des natürlichen Einund Ausatmens nicht, sonst könnten sie ja nicht ständig ohne Luft zu schöpfen unter Wasser leben. Was für uns die Luft ist, das ist für sie das Wasser. Wie für uns die Luft, so ist für sie das Wasser das wesentliche Lebenselement. Wird uns die Luftzufuhr abgeschnitten, geht uns sogleich das Leben aus, weil wir nicht die geringste Zeit des Lebensodems entbehren können. So vermögen auch die Fische, wenn man sie aus dem Wasser nimmt, ohne ihr Lebenselement nicht zu existieren.</p><p>Der Grund ist einleuchtend. Bei uns nimmt die Lunge Luft in das sich weitende Innere der Brust auf und dämpft mit der infolge ihrer großen Durchlässigkeit einströmenden Luft die innerliche Hitze. Wie nämlich die Brusthöhle die Nahrung aufnimmt, so sondert sie auch die überflüssigen Speisereste wie die der Gesundheit zuträglichen Säfte und das Blut aus: da nun wird die Lunge durchlässig, und die eingeatmete Luft vermag daher leichter dahin einzuströmen. Die Fische hingegen haben Kiemen, die sie bald zusammenziehen und schließen, bald auseinanderziehen und öffnen. Mit diesem Schließen und Öffnen beim Aufnehmen, Hindurchleiten und Eindringen des Wassers scheint nun [bei ihnen] die Atmungsfunktion vor sich zu gehen. So haben denn die Fische ihre eigenartige Natur, die sie mit den übrigen Wesen nicht teilen, ihre besondere Lebensweise und ihr von den übrigen geschiedenes und abgesondertes Lebenselement. Sie werden darum nicht aufgenährt und empfinden auch nicht gleich den Tieren des Festlandes Ergötzen an der Streichelund Schmeichelhand des Menschen, ob sie auch wohlverwahrt in Behältern leben.</p><p><strong>Der Raubfisch der Typus der Habsüchtigen; Warnung vor der Habsucht.</strong></p><p>Was soll ich von ihrem dichtgereihten Zahngebiß sagen? Sie haben nicht bloß wie die Schafe und Rinder einseitig gereihte Zähne, sondern sind doppelseitig mit Zähnen bewaffnet. Sie leben nämlich im Wasser, und es könnte die Speise, falls sie dieselbe länger hin und her wenden und nicht sogleich verschlingen, durch das anflutende Wasser aus dem Zahngehege fortgerissen und hinweggespült werden. Sie haben darum auch dichtgereihte und spitze Zähne, damit sie die Speise rasch zerteilen, rasch zerkauen, leicht und ohne Aufschub und Verzögerung verschlingen können. Endlich wiederkäuen sie nicht. Nur der Skarus soll ein Wiederkäuer unter ihnen sein, wie Leute berichten, denen Zufall oder Praxis oder Studium Gelegenheit zu solchen Beobachtungen gab.</p><p>Freilich selbst auch die Fische sind nicht verschont geblieben von gewalttätiger Bedrückung durch ihresgleichen. Allenthalben sind die Schwächeren der Gier der Stärkeren ausgesetzt. Und je schwächer einer ist, um so mehr muß er gewärtigen, eine Beute zu werden. Die meisten [Fische] nähren sich zwar von Pflanzen und kleinen Würmern, doch gibt es auch solche, die einander auffressen und vom eigenen Fleische sich mästen. Der kleinere dient bei ihnen dem größeren zum Fraß, der größere hinwiederum wird von dem noch stärkeren überfallen und, selbst Raubfisch, die Beute eines anderen. So kommt es erfahrungsgemäß vor, daß ein Fisch in dem Augenblick, da er selbst einen anderen verschlang, von einem dritten verschlungen wird, und beide, der Verschlungene samt seinem Verschlinger, zusammen in einen Bauch wandern, und ein Leib gleichzeitig und gemeinsam Beute und Strafe dafür einschließt. Auch bei ihnen [den Raubfischen] bürgerte sich das Unrechttun vielleicht auf Grund ihres eigenen Verhaltens ein, wie es bei uns nicht von der Natur, sondern von der Begehrlichkeit seinen Ausgang nahm; oder aber sie wurden, wie sie eine Gabe zu Nutz und Frommen der Menschen sind, so auch zum Zeichen für sie geschaffen: wir sollten in ihnen das Bild unseres lasterhaften Wandels vor Augen haben und vor solchen Beispielen uns hüten. Kein Szärkerer soll über den Schwächeren herfallen und so dem noch Mächtigeren das Beispiel zum Unrecht wider sich selbst geben: wer dem Nächsten unrecht tut, legt sich selbst die Schlinge, in die er fällt.</p><p>Auch du bist ein [Raub]Fisch, der du über fremdes Gut und Blut herfällst; der du den Schwachen in die Tiefe ziehst, den Fliehenden bis auf den Grund verfolgst. Gib acht, daß du nicht, während du ihn verfolgst, selbst auf einen Stärkeren stößt, und jener, während er deinen Nachstellungen ausweicht, dich den Nachstellungen eines anderen ins Garn führt und zuvor noch Zeuge deines Mißgeschickes wird, nachdem er, solange du den Verfolger spieltest, sein eigenes befürchten mußte. Was wäre für ein Unterschied zwischen dem Reichen, der mit der Unersättlichkeit ruchloser Habgier das Vatergut hilfloser [Kinder] aufzehrt, und zwischen dem Waller, der den Bauch voll kleiner Fischleiber hat?</p><p>„Da ging der Reiche mit Tod ab“, und nichts halfen ihm seine erbeuteten Schätze, ja nur verwerflicher machte ihn die Schande seines Raubes. Da ging der Waller ins Netz, und seine nichtsnutzige Beute ward aufgedeckt: wie viele Fische wurden in ihm vorgefunden, die andere verschlungen hatten! Auch du, Reicher, trägst in deiner Tasche den Räuber, der den Nächsten geplündert. Er hatte die Habe eines Armen inne, dessen er sich bemächtigt hatte. Mit seiner Vergewaltigung hast du deinem Besitztum zwei Vermögen einverleibt. Und noch hast du mit dem so gewaltigen Vermögenszuwachs nicht genug. Du gibst vor,nur andere rächen zu wollen, während du das gleiche tust, was du bestrafst, an Ungerechtigkeit den Ungerechten, an Schuld den Schuldigen, an Habsucht den Habsüchtigen noch überbietend. Sieh zu, daß es mit dir nicht das gleiche Ende nimmt wie mit jenem Fische! Hüte dich vor Angel und Netz! Doch du pochst auf deine Macht, niemand könne dir widerstehen. Auch der Waller verließ sich darauf, daß ihm, niemand eine Angel legen, niemand ein Netz werfen werde, und daß er, wenn er darein geriete, alles zerreißen würde: Und doch entging er der Harpune nicht, oder aber geriet in ein so starkes Fangnetz, daß er sich demselben nicht zu entwinden vermochte. So wird zweifelsohne auch menschliches Unrecht umso weniger, je schwerer es sich verging, in seinem frevlen Tun sich sicher fühlen können, daß es nicht einmal die Strafe büßen werde, die zur Sühne der Freveltaten sicher schwerlich sich abwenden läßt.</p><p><strong>Der wahre Christ Petri Fischlein mit Christi Steuermünze im Bekennermund: so der Blutzeuge Stephanus.</strong></p><p>Ein Fisch bist du, o Mensch. Vernimm es, daß du ein Fisch bist: „Das Himmelreich gleicht einem Netze, das ins Meer geworfen, aller Art Fische einfing. Da es aber angefüllt war, zog man es ans Ufer, setzte sich und sammelte die besten Fische in ihre Gefäße, die schlechten aber warf man hinaus. So wird es auch am Ende der Welt gehen. Die Engel werden ausgehen und die Bösen aus der Mitte der Gerechten aussondern und sie in den Feuerofen werfen“. Es gibt also gute und schlechte Fische. Die guten werden aufbewahrt zur Belohnung, die schlechten sogleich vom Feuer ergriffen. Den guten Fisch umgarnt das Netz nicht, sondern trägt ihn zur Höhe, noch zerfleischt und tötet ihn die Angel, sondern rötet ihn nur mit dem Blute, das der kostbaren Wunde entquillt. Und in seinem Bekennermunde findet sich die Edelmünze vor, um damit die Abgabe der Apostel und die Steuer Christi entrichten zu können. Denn so, steht geschrieben, sprach der Herr: „Von wem nehmen der Erde Könige Zoll oder Steuer? Von ihren Söhnen oder von den Fremden? Und auf die Antwort des Petrus: ’von den Fremden sprach der Herr: Geh hin an das Meer und wirf die Angel aus, und den Fisch, der zuerst heraufkommt, nimm! Und wenn du ihm den Mund öffnest, wirst du da einen Stater finden; diesen nimm und gib für mich und dich!“</p><p>Fürchte also, gutes Fischlein, Petri Angel nicht! Sie tötet nicht, sondern heiligt. Halte dich nicht angesichts des schwachen Leibes verächtlich für ein wertloses Ding! In deinem Munde hast du, was du für Petrus und für Christus entrichten sollst. Fürchte Petri Netz nicht! Zu ihm spricht Christus: „Fahr auf die hohe See und wirf das Netz aus!“. Nicht zur Linken, sondern zur Rechten wirft er es aus, wie er von Christus geheißen wurde. Fürchte seinen Schoß nicht! Denn zu ihm ward gesagt: „Von jetzt an wirst du Menschen das Leben geben“. So warf er denn das Netz aus und fing Stephanus, der zuerst aus der Tiefe des Evangeliums heraufkam, mit dem Stater der Gerechtigkeit im Munde. Darum ruft er in standhaftem Bekenntnis aus: „Sieh, ich schaue die Himmel offen und den Sohn des Menschen stehen zur Rechten Gottes“. Auf diesen Fisch bestand der Herr Jesus; denn er wußte, daß in dessen Mund seine Steuermünze sich vorfand. Mit einem glorreichen Martyrium besiegte denn auch Stephanus des Petrus Urteil [über ihn] und Lehre und Christi Gnade: ein gar eifriger Streiter derselben.</p><p><strong>Viper und Muräne ebenso ein ideales Vorbild ehelicher Liebe und Treue wie ein abschreckendes Beispiel ehebrecherischen Verkehres.</strong></p><p>Du darfst dich nicht daran stoßen, daß ich für ‘Meer’ ‘Evangelium’ setzte. Das Evangelium ist es, worin Petrus, ob er auch bei der Verleugnung schwankte durch Christi Rechte die Stärkung im Glauben und die Gnade der Standhaftigkeit fand. Das Evangelium ist es, aus dem der Märtyrer heraufkommt. Das Evangelium ist das Meer, worin die Apostel fischen, wo das Netz ausgeworfen wird, das dem Himmelreiche gleicht. Das Evangelium ist das Meer, worin Christi Geheimnisse vorgebildet wurden. Das Evangelium ist das Meer, worin der Hebräer Rettung, der Ägypter Untergang fand. Das Evangelium ist das Meer; denn über den Meeren ist die Braut Christi, die Kirche, und die Fülle der göttlichen Gnade gegründet nach des Propheten Wort: „Er hat über den Meeren sie gegründet“. Hüpfe auf, o Mensch, über den Fluten; denn ein Fischlein bist du! Nicht sollen die Wogen dieser Welt dich bedecken! Braust der Sturm, tauche zur Tiefe auf den Grund! Lacht heiterer Himmel, spiele in den Fluten! Stürmt die See, gib acht auf den klippenreichen Strand, daß nicht die wütende Brandung dich an ein Felsenriff schleudert! Denn es steht geschrieben: „ Seid listig wie die Schlangen!“</p><p>Und weil gerade das Beispiel von den listigen Schlangen angezogen wurde: Seien wir listig auch in der Eingehung und Wahrung der Ehen, halten wir in Liebe an der Lebensgemeinschaft fest, die unser Teil ward! Ob solche, die im Augenblick ihrer Geburt ferne Lande getrennt hatten, sich zusammenfanden, ob der Mann in die Fremde zog: keine Ferne, keine Enthaltung darf die Zuneigung und Liebe mindern. Dasselbe Gesetz bindet sie, ob sie anwesend oder abwesend sind; dasselbe Band der Natur knüpft zwischen ihnen, ob sie fern oder nahe sind, die Rechte der ehelichen Liebe; dasselbe Joch der Einsegnung ruht auf beider Nacken, mag auch ein Eheteil für lange Zeit scheiden und in abgelegene Lande ziehen; denn nicht auf den Nacken des Leibes, sondern des Geistes nehmen sie das Joch der Gnade.</p><p>Die Viper, die verworfenste Art von Tieren und die hinterlistigste aller Schlangenarten, begehrt, wenn Lust sie anwandelt, nach der Vermischung mit der Seemuräne, die sie längst gewohnt ist, oder die sie neu vorbereitet. Sie kriecht an das Gestade vor, bekundet mit Zischen ihre Anwesenheit und lockt so jene als Gatten zum Verkehre an. Die Muräne aber bleibt auf diese Einladung nicht fern und gewährt der Giftschlange den ersehnten Umgang mit ihr. Was bezweckt nun ein derartiger Hinweis anders als die Einschärfung der Pflicht, den Gatten, wie er auch geartet ist, zu ertragen und, falls er abwesend ist, sein Erscheinen abzuwarten? Mag er rauh, falsch, ungeschlacht, ein Leichtfuß, ein Trunkenbold sein. Was wäre schlimmer als Gift? Und doch flieht es die Muräne im Gatten nicht. Gerufen bleibt sie nicht fern und umfängt in beflissener Liebe die schlüpfrige Schlange. Er [der Gatte] muß das Schlimme an dir und die Unbeständigkeit deiner weiblichen Laune ertragen: du, Weib, wolltest deinen Mann nicht aushalten können? Adam wurde durch Eva verführt, nicht Eva durch Adam. Es ist also nur gerecht, daß das Weib den Mann, den es zur Schuld verleitete, zum Führer nimmt, um nicht wiederum in weibliche Unbeständigkeit zu fallen. Aber er ist so struppig und ungeschlachtet: er hat dir ein für allemal gefallen! Oder ist die Wahl des Mannes öfter zu treffen? Das Rind verlangt nach seinem Jochgenossen und das Pferd ist ihm zugetan, und ob auch an dessen Statt ein neuer tritt, weiß es als Genosse des anderen das Joch nicht mehr zu tragen und dünkt sich nicht mehr ganz: du willst deinen [Ehe]Genossen verschmähen, glaubst ihn oftmals wechseln zu dürfen, führst, wenn er nur einen Tag abwesend ist, hinter seinem Rücken den Nebenbuhler ein und läßt dir ohne weiteres, als wäre der ungewohnte Verkehr ein gewohnter, die Verletzung der Keuschheit zuschulden kommen. Die Viper verlangt nach dem abwesenden Genossen, ruft und lockt den abwesenden mit einschmeichelndem Zischen und speit, sobald sie ihn herankommen sieht, aus Achtung vor dem Gatten, aus Ehrfurcht vor der Ehe das Gift aus: du, Weib, wolltest den Gatten bei der Rückkehr aus der Ferne unter Schmähungen abweisen? Die Viper blickt hinaus auf das Meer, spät nach des Gatten Spur: Du wolltest dem Manne mit Grobheiten den Weg verlegen? Du wolltest des Zankes Gift statt auszuspeien in Wallung setzen? Du wolltest in dem Augenblick, da der Gatte dich umarmen will, aufbrausend tödliches Gift ausspritzen, ohne Ehrfurcht vor der Ehe, ohne Achtung vor dem Gatten?</p><p>Aber auch du, Mann auch so können wir’s nehmen lege das aufbrausende Wesen im Herzen, deine Schroffheit im Benehmen ab,sooft dir die treubeflissene Gattin entgegenkommt. Fort mit dem Unwillen, wenn die liebenswürdige Gattin dich zur Gegenliebe herausfordert! Nicht Herr, sondern Gemahl bist du; nicht eine Magd, sondern eine Gattin hast du dir heimgeführt; zum Leiter über das schwache Geschlecht wollte Gott dich bestellen, nicht zum Allgewaltigen. Erwidere Aufmerksamkeit mit Aufmerksamkeit, erwidere Liebe mit Liebenswürdigkeit! Die Viper läßt ihr Gift ausfießen: du vermöchtest deine Hartnäckigkeit nicht abzulegen? Doch du besitzest von Natur ein frostiges Wesen: du hast die Pflicht, es in Anbetracht der Ehe zu mildern und sollst aus Ehrfurcht vor ihrem Bande deine rohe Gesinnun ablegen!</p><p>Auch so kann man’s fassen; Begehret, Männer, nicht nach fremdem Ehebett, lauert nicht nach fremdem Umgang! Schwer [sündhaft] ist der Ehebruch, eine Verletzung der Natur. Zwei Menschen hat Gott ursprünglich erschaffen, Adam und Eva, d.i. Mann und Weib, und zwar das Weib vom Manne, d.i. von einer Rippe Adams, und er hieß beide in e i n e m Leibe wandeln und in e i n e m Geiste leben. Wie dürftest du die Leibeseinheit trennen. Wie die Geisteseinheit lösen? Eine Schändung der Natur wäre es. Das lehrt der Umgang, nach welchem nicht das in der [gleichen] Art begründete Recht, sondern das Feuer der Begierlichkeit Muräne und Viper verlangen macht. Höret, Männer! Solcher Schlangen Beilager verschafft sich, wer eine fremde Gattin zu beschlafen sucht, solcher Schlange auch gleicht er selbst. Er eilt der Viper entgegen, die nicht auf dem geraden Wege der wahren, sondern auf dem schlüpfrigen Abwege der sinnlichen Liebe in den Schoß des Mannes dringt. Er eilt zu einer, die den Giftzahn füllt gleich der Viper, die nach Beendigung des Beischlafes das Gift, das sie ausgespien hatte, wieder einschlürfen soll. Eine Buhlerin ist eben die Viper. Darum spricht auch Salomo, da auf Wein die Begierlichkeit zu entbrennen pflegt: es werde der Trunkene wie vom Natternbiß aufgebläht und es werde ihm wie von einer Hornschlange Gift durch die Glieder geträufelt. Und daß man erkenne, daß er die Ehebrecherin meinte, fügte er hinzu: „Wenn deine Augen nach einer Fremden blicken, wird dein Mund Verkehrtes reden“.</p><p>Niemand glaube, wir bewegten uns in Widersprüchen damit, daß wir uns sowohl in Beziehung auf das Gute wie auf das Böse des Beispiels dieser Viper bedienten. Zeitigt doch beides eine Frucht der Belehrung, wenn wir uns schämen, sei es dem Geliebten die Treue nicht zu wahren, dem selbst die Schlange sie wahrt, sei es über den heiligen Ehebund hinweg eine schlüpfrige und verderbliche Verbindung der heilsamen vorzuziehen, wie es jene [Muräne] tut, die sich mit der Schlange vermischt.</p><p><strong>Besser Armut mit Gottesfurcht, denn Reichtum ohne Gottesfurcht.</strong></p><p>Weil wir gerade auf die Hinterlist zu sprechen kamen, mit der ein jeder seinen Bruder zu täuschen und hintergehen trachtet, um auf neuen Trug zu sinnen, ihn, den er mit Gewalt nicht fassen kann, mit List zu umgarnen und gleichsam mit einem Trick zu betören, will ich das bekannte Verstellungsvermögen des Tintenfisches nicht unerwähnt lassen. Errreicht nämlich derselbe am seichten Gestade eine Felsenbank, so klammert er sich daran fest, nimmt durch ein rätselhaftes Anpassungsvermögen [Mimikry] dessen Farbe und am Rücken felsenähnlich Gestalt an. Ohne die geringste Ahnung des Truges gleiten nun die Fischlein, indem sie sich vor den ihnen gewohnten Stellen nicht in acht nehmen und Felsengestein vermuten, heran, da schließt der Polyp sie in das Fangnetz seiner Verstellungskunst und sperrt sie gewissermaßen in den Behälter seines Leibes ein. So kommt von selbst die Beute heran und läßt sich durch ähnliche Vorspiegelungen in die Falle locken, wie sie jene belieben, die häufig in der Gesinnung die Farbe wechseln und verschiedene verfängliche Machinationen anwenden, um Geist und Sinn eines jeden zu ködern: in Mitte von Enthaltsamen voll des Lobes auf die Enthaltsamkeit, in Gesellschaft von Unenthaltsamen weit entfernt vom Streben nach Keuschheit und versunken in Schlamm der Unenthaltsamkeit. Wer sie folglich mit unachtsamer Leichtfertigkeit hört oder sieht, traut ihnen und kommt umso rascher zu Fall. Er weiß dem, was sein Verderben ist, nicht aus dem Weg zu gehen und sich davor zu hüten, während doch die Ruchlosigkeit doppelt gefährlich und verderblich ist, wenn sie sich in die Maske der Leutseligkeit hüllt. Auf der Hut darum vor jenen, welche die Fangnetze und Fangarme ihres Truges weit und breit ausstrecken und alle möglichen Farben annehmen! Denn Polypen sind sie. Über tausend Schlingen und Schliche verfügt ihr verschlagener Sinn, um wo möglich alles, was sich in die Klippen ihres Truges verirrt, zu umgarnen.</p><p>In welche Schlinge ferner weiht uns nicht der Krebs ein, wenn es gilt, einen Fang zu machen! Auch er nämlich liebt die Auster und sieht sich gern um den Leckerbissen ihres Fleisches um. Doch er achtet ebenso vorsichtig auf die Gefahr, als er gierig nach der Speise fahndet. Die Jagd danach ist nämlich ebenso schwierig wie gefährlich: schwierig, weil der Bissen mit starken Schalen im Inneren [der Muschel] verschlossen liegt; denn die Natur, die Dolmetscherin des [schöpferischen] Herrschergebotes, umgab wie mit Mauern schützend die weiche Fleischmassen und hegt und pflegt sie zwischen den Schalen wie in einem konkaven Schoß und bettet sie darin wie in ein Becken ein; darum bleiben alle Bemühungen des Krebses umsonst, da er die verschlosene Muschel bei aller Anstrengung nicht zu öffnen vermag. Und gefährlich ist’s: sie könnte seine Schere einklemmen. Da besinnt er sich auf Kniffigkeiten und betreibt mit neuer List seine Nachstellungen. Weil alle Arten [von Wesen] an Wohlbehagen sich ergrötzen, lauert er, ob nicht die Auster an einsamen, ganz windstillen Stellen den Sonnenstrahlen gegenüber ihre Doppelklappe auftue und den Schalenverschluß öffne, um, an der freien Luft leibliches Behagen zu genießen. Durch ein Steinchen sodann, das er unvermerkt dazwischen hineinschiebt, verhindert er die Schließung der Muschel; durch die Öffnung, die er vor sich hat, streckt er nun ungefährdet die Scheren hinein und läßt sich den Weichkörper darin schmecken.</p><p>So gibt es nun Leute, die nach Art des Krebses auf fremde Übervorteilung es absehen, der eigenen Ohnmacht durch gewisse Finten nachhelfen, dem Bruder des Truges Schlingen legen und von fremder Not sich mästen. Du aber sei mit dem Deinigen zufrieden, und fremder Nachteil sättige dich nicht! Ein würziges Mahl ist der Unschuld Einfalt. Im Besitz ihrer eigenen Güter kennt sie kein Fahnden nach fremden und entbrennt nicht vom Feuer der Habsucht, bei der aller Gewinst nur Verlust für die Tugend, Zündstoff für die Begehrlichkeit bedeutet. Darum selig „wenn sie sich ihrer Güter bewußt ist“ die Armut im Bunde mit Ehrlichkeit und vorzüglicher den alle Schätze! Denn besser ist die Gabe kleiner Habe mit Gottesfurcht als große Schätze ohne Furcht. Wieviel bedarf es denn zum Unterhalt eines Menschen? Oder wenn du auch für andere etwas zu erübrigen suchst: auch das braucht nicht viel sein; denn besser mundet Gemüse von gastlicher Hand mit Herzlichkeit gereicht, als fette Kälber in Zwietracht zubereitet. Nutzen wir denn unsere Fähigkeiten zu Gnadenerwerb und zur Fristung des Lebens, nicht zur Übervorteilung fremder Unschuld! Wir dürfen uns die Vorbilder des Meeres wohl zur Förderung unserer eigenen Wohlfahrt, nicht aber zur Gefährdung anderer zunutzen machen.</p><p><strong>Gottes Huld verdankt er den Instinkt. Der Mensch das bevorzugte Kind der göttlichen Vorsehung.</strong></p><p>Der Igel, ein kleines, unscheinbares und verächtliches Tierchen ich spreche vom Seeigel pflegt den Schiffern künftigen Sturm anzuzeigen oder heiteres Wetter zu verkünden. So liest er denn, sobald er Sturmwind wittert, ein schweres Steinchen auf, führt es wie Ballast und schleppt es wie Anker mit sich, um nicht von den Fluten ausgeworfen zu werden. Nicht aus eigener Kraft also hält er sich im Gleichgewicht, sondern mit fremdem Gewichte bleibt er seiner mächtig und Herr. Das ist nun ein Fingerzeig, den die Schiffer als Zeichen auf künftigen Sturm deuten und demzufolge sie sich vorsehen, daß nicht der plötzliche Sturm sie unvorbereitet treffe. Welcher Mathematiker, welcher Astrologe oder welcher Chaldäer verstünde sich so genau auf der Gestirne Lauf, so genau auf die Bewegungen und Zeichen am Himmel? Woher die Fähigkeit zu solcher Beobachtung? Von welchem Lehrer stammt solches Wissen? Wer war der Vermittler so sicherer Zeichendeutung? Menschen merken, wie die Luft sich verdichtet, und täuschen sich oft, indem dieselbe ohne Sturm den Flor teilt: Der Igel täuscht sich nicht, den Igel trügen nimmer seine Zeichen.</p><p>Woher im kleinen Tierchen so großes Wissen, daß es Künftiges vorausverkünden kann? Je sicherer nichts in ihm vorhanden ist, was es zu so großer Einsicht befähigte, [umso sicherer] glaube, daß es auch der Huld des Herrn aller Wesen die Gabe dieses Vorauswissens dankt. Wenn Gott die Pflanze so herrlich kleidet, daß wir staunen, wenn er die Vögel nährt, wenn er „dem Raben Speise bereitet“ denn „seine Jungen schreien zum Herrn“, wenn er den Frauen Einsicht verleiht in die Webekunst„, wenn er die Spinne, die so fein und verständig ihr weitmaschiges Gewebe an Öffnungen anbringt, an Einsicht nicht leer ausgehen ließ, wenn er dem Rosse die Kraft verlieh und von seinem Nacken die Furcht scheuchte, daß es auf dem Schlachtfelde kampffroh aufwiehert und Königen entgegensprengt und ihrer spottet, von ferne Schlachtenblut wittert, bei der Trompete Schall zu Mut sich entflammt: wenn die waltende Hand seiner Weisheit diese großenteils animalischen und teilweise nichtanimalischen Wesen wie die Pflanzen, wie die Lilien vollends ausstattete, wie dürften wir zweifeln, daß er auch in den Seeigel den Vorzug jenes Vorauswissens hineingelegt hat? Denn nichts entging seinem prüfenden Blicke, nichts seiner sorgenden Hand. Alles sieht er, der alles nährt; alles erfüllt er mit Weisheit, der alles mit Weisheit gemacht hat, wie geschrieben steht. Wenn er also dem Igel seine gnädige Heimsuchung nicht entzog, wenn er sein gedenkt und ihm die Zeichen des Zunünftigen deutet: soll er sein nicht gedenken? Ja, fürwahr, er ist deiner eingedenk, wie es seine göttliche Weisheit mit den Worten bezeugt: Wenn er auf die Vögel niederschaut, “wenn er sie nährt, seid ihr nicht mehr als sie? „Denn wenn Gott das Gras des Feldes, das heute ist und morgen ins Feuer geworfen wird, also kleidet, wieviel mehr euch, ihr Kleingläubigen?“</p><p><strong>des Menschen Hab und Genußsucht kennt keine Grenzen. Der Wanderzug einiger Fischarten nach dem Pontus und deren Rückkehr gemäß dem göttlichen Naturgesetz. Die wunderbare Kraft sowie die große Gefährlichkeit einiger Fischgattungen.</strong></p><p>Oder können wir uns desgleichen ohne Naturinstinkt bei den Fischen jene schöne, ständige Einrichtung denken, wonach jede Fischgattung ihre bestimmten Standorte hat, welche kein Individuum seiner Gattung verlassen, kein anderes betreten darf? Welcher Geometer steckte ihnen die Quartiere ab, deren Schranken zu keiner Zeit durchbrochen werden dürfen? Indes von einem ‘Erdmesser’haben wir gehört, von einem ’Meermesser’ haben wir niemals gehört. Und dennoch kennen die Fische das ihnen zugemessene Gebiet, nicht durch Stadtmauern und tore abgegrenzt, nicht durch Häuserbauten, nicht durch Feldraine abgesteckt: ein Gebiet nach Bedarf, so daß sich jede Fischgattung mit voviel Platz zu gegnügen hat, als sie bequem braucht, nicht als maßlose Habgier sich anmaßen möchte. Es ist das gleichsam ein Naturgesetz: soviel Erwerb, als zum Leben genügt, und ein Vermögensstand, der sich nach den Lebensbedürfnissen bemißt. Diese Fischgattung nun findet in jener Meeresbucht, jene in einer anderen ihre Nahrung und Fortpflanzung. So findet man denn die verschiedenen Fischgattungen nicht vermischt vor, sondern die Gattung, die hier zahlreich vorhanden, fehlt hinwiwederum anderswo. Diese Meeresbucht hegt Kopffüßer, jene Seewölfe, jene Klippenfische, eine andere Heuschreckenkrebse [Squilliden]. Eine Freizügigkeit gibt es nicht, ohne daß jedoch die Möglichkeit hierzu etwa durch Bergvorsprünge abgeschnitten oder die Abwanderung durch einmündende Flüsse verhindert würde, vielmehr wohnt jedem Fische von Natur die Gepflogenheit inne, sich sozusagen an die heimischen Grenzen zu halten, und ein Hinausgehen über den bewohnten Bereich gilt für gefährlich.</p><p>Wir entgegen huldigen ganz anderer Auffassung. Wir vertauschen das Vaterhaus mit der Fremde, sind seiner Bewohner satt, haschen nach der Gunst der Ausländer, rücken die unvordenklichen Grenzmarken, die unsere Väter absteckten, hinaus, „fügen Acker an Acker, Haus an Haus“. Das Festland reichte dem Menschen nicht mehr aus, auch die Meere werden überbaut, umgekehrt das Festland nach eines jeden Belieben eingeschnitten und das Meer dahin abgeleitet, um Inseln zu bilden, den Besitz auf das Meer auszudehnen. Man maßt sich über weite Meeresstrecken ein förmliches Eigentumsrechts an und rühmt sich,es seien einem die Fische rechtlich wie hausgeborenes Gesinde leibeigen unterworfen. Diese Meeresbucht, prahlt man, gehört mir, jene dem Nachbar. Es teilen sich die Vermöglichen in den Besitz der Elemente. Ihnen gehören die Austern, die in den Gewässern gezüchtet werden, ihnen der Fisch, der im Behälter aufbewahrt wird. Ihrer Völlerei genügte das Meer nicht einmal, besäßen sie dazu nicht aufgespeicherte Vorräte an Austern. Daher benennen sie dieselben nach Jahrgängen. Und sie bauen Fischteiche, [fürchtend] es möchte das Meer den vollen Bedarf für das Mahl eines Prassers nicht liefern. Und der Nachbar! Wie klingt ihnen sein Name im Ohr! Wie schielt ihr Auge nach seinem Besitz! Wie sinnen sie Tag und Nacht, um nur etwas vom Nächsten zu ergattern! „Wollt ihr denn allein auf der Erde wohnen?“ ruft der Prophet aus. Der Herr weiß dies und bewahrt es auf zur Bestrafung.</p><p>Wie fern liegt den Fischen räuberische Habgier. Jene aber haschen nach den verborgenen Schätzen der Natur und kennen über des Erdkreises Grenzen hinaus das Meer, das keine Inseln mehr unterbrechen, in das kein Land mehr eingebettet ist, über das hinaus keines mehr liegt. Dort nun, wo das endlos wogende Meer allem Spähen des Auges, aller Kühnheit gewinnsüchtigen Seefahrens die Grenze setzt, sollen die Wale hausen, jene unermeßlich großen Fischarten, deren Leiber nach dem Berichte von Augenzeugen Bergen gleichen. Dort verbringen sie ungestört ihr Leben, fernab von den Inseln, und nehmen, abgeschnitten von aller Berührung mit den Seestädten, jene Bezirke und Quartiere ein, die ihnen zugewiesen sind. Sie bleiben darin ohne angrenzendes Gebiet zu betreten und suchen nicht in unsteter Abwanderung die Standorte zu wechseln, hangen vielmehr sozusagen in Liebe dem heimatlichen Boden an und halten das Weilen darauf für süße Lust. Jene [Standorte] aber erkoren sie, um, ihr einsames Leben ungestört von Beobachtern hinbringen zu können.</p><p>Gleichwohl gibt es einige Fischarten, die ihre Standorte wechseln, nicht aus Unbeständigkeit, sondern weil das Brutgeschäft es erheischt. Um nämlich zur rechten und festgesetzten Zeit hierfür Vorsorge zu treffen, sammeln sie sich wie auf eine gemeinsame Verabredung hin aus den zahlreichen Standorten und den verschiedenen Meeresbuchten, warten in Scharen geeint das Wehen des Nords ab und ziehen dann einem Naturgesetz folgend nach jenem Meere in den Mitternachtsgegenden. Man möchte sie, wenn man sie hinaufziehen sieht, für eine Golfströmung halten, so stürmen sie voran und durchschneiden die Flut im gewaltigen Vorwärtsdrängen durch die Propontis zum Schwarzen Meere wallend. Wer bringt den Fischen Kunde von diesen Gegenden, bestimmt ihnen die Zeitpunkte? Wer gibt ihnen die Reiseroute, die Zugordnung, Ziel und Zeit der Rückkehr an? Die Menschen freilich haben ihren Herrscher, dessen Befehles man gewärtig ist, dessen Kommmando ergeht, dessen Edikte den Untertanen in den Provinzen bekannt gegeben werden, um sich einzufinden; den Kriegstribunen wird schriftlich Anweisung zugeschlossen und Termin gestellt: und doch vermögen so manche zu den festgesetzten Terminen nicht zu erscheinen. Welcher Beherrscher gab nun den Fischen Befehl? Welcher Lehrer gibt jene Anleitung? Welche Meßbehörde zeichnet die Route vor? Welche Führer weisen den Weg, daß jeder eintrifft, keiner fehlt? Doch ich erkenne, wer jener Herrscher ist, der kraft göttlicher Anordnung allen Wesen seinen Willen in den Sinn legt, der schweigend stummen Tieren ihre natürlichen Verhaltungsmaßregeln erteilt, der nicht bloß das Große durchdringt, sondern auch jenem Kleinsten sich mitteilt. Der Fisch gehorcht dem göttlichen Gesetze, und die Menschen lehnen sich dagegen auf. Der Fisch fügt sich jederzeit den himmlischen Anordnungen, und die Menschen schlagen Gottes Gebote in den Wind. Oder dünkt dir etwa der Fisch verächtlich, weil er stumm ist und keine Vernunft hat? Doch sieh zu, daß du dir nicht noch viel verächtlicher vorkommen mußt, wenn du als unvernünftiger denn ein unvernünftiges Tier betroffen wirst! Was wäre indes vernünftiger als jener Wanderzug der Fische, dessen Zweckmäßigkeit sie zwar nicht mit Worten dartun, aber durch ihr Tun ausdrücken? Sie ziehen nämlich deshalb zur Sommerszeit zum Schwarzen Meere, weil dieses Becken mehr Flußwasser besitzt als jedes andere. Denn es verweilt bei ihm die Sonne nicht solange in der Flut als bei den übrigen. So kommt es, daß sie nicht alles Süß und Trinkwasser absorbiert! Wer aber wüßte nicht, daß auch die Seetiere gern an Süßwasser sich laben? Ziehen sie nun infolge dessen den Flüssen nach und deren Bett hinauf, werden sie häufig als fremde Fischarten gefangen. Schon dieser Grund macht ihnen den Pontus, bezw. das ständige Wehen des Nords daselbst, der die Hitze dämpft, annehmlicher; insbesondere aber halten sie ihn mehr als die übrigen [Meere] gheeignet zur Erzeugung und Aufzucht ihrer Brit darin. Weil aber die zarte Brut das rauhe Klima in der Fremde schwerlich ertragen könnte, während dort sanfte, milde Luft sie kost, daher treten sie nach Vollendung des Brutgeschäftes, alle gleichzeitig im gleichen Zuge, wie sie gekommen, den Heimweg an.</p><p>Wir wollen nun diesen Grund noch genauer erwägen. Das Schwarze Meer ist dem heftigen Brausen des Nords und der übrigen Winde ausgesetzt. Wenn nun daselbst ein schwerer Orkan wütet, erheben sich stürmische Wogen, daß der Sand vom tiefen Grunde aufgewirbelt wird. Das zeigt auch die sandige Flut an. Da diese unter den Windstößen immer höher sich türmt, sodann auch immer schwerer wird, glauben nicht bloß die Schiffer, sondern zweifelsohne selbst die Tiere, im Meer sich nicht mehr halten zu können. Dazu kommt, daß einerseits zwahlreiche und mächtige Ströme in den Pontus sich ergießen, andererseits insbesondere der Pontus selbst zur Winterszeit eine allzu große und wegen der einmündenden Flüsse eisige Kälte aufweist. Deshalb pflegen die Fische, die genauen Kenner der Gewässer, wohl im Sommer daselbst das milde, kühlere Klima zu genießen, ziehen sich aber, wenn die Annehmlichkeit zu Ende geht, vor dem rauhen Winter zurück und eilen, die grimmige Kälte des Nordens fliehend, nach den übrigen Meeren, wo linde Winde sanfter wehen oder der Sonne milder Strahl Frühlingslüfte zu wecken pflegt. So kennt also der Fisch „die Zeit des Gebährens“, was schon Salomos Weisheit für ein großes Geheimnis klärte, kennt die Zeit der Hinund Rückkehr, kennt die Zeit des Verrichtens [Laichens] und des unsteten Hin und Her, und weiß es, daß er sich nicht täuschen kann, weil er nicht Vernunfterwägung und wissenschaftlicher Begründung folgt,spondern dem natürlichen Instinkte, dem wahren Lehrer der Elternliebe. So haben überhaupt alle lebenden Wesen ihre bestimmte Brutzeit, nur der Mensch gebraucht sie unterschied und wahllos. Alle anderen Arten ziehen eine milde Zeit vor, nur die Frauen setzen der Milde vergessend ihre Kinder ins Dasein. Die Geschlechtslust, die keine Zeit und Entsagung im Zeugen kennt, hält eben auch keine Zeit im Gebären ein. Der Fisch durchwandert so große Meeresstrecken, um seiner Brut einigen Vorteil zu verschaffen, auch wir durchqueren weite Meeresflächen: doch wie unvergleichlich ehrenhafter ist, was aus Kindesliebe denn aus Geldgier unternommen wird! So muß denn jenen dier Durchquerung [des Meeres] als Pietät, uns als Gewinnsucht ausgelegt werden. Jene führen Kindersegen heim, teurer denn alle Handelsprodukte, wir bringen in schnöder Gewinnsucht Handelsware zurück, die nicht entfernt im Verhältnis steht zur Gefahr. So trachten jene nach der Heimat zurück, wir verlassen sie. Jenen mehrt sich, da sie das Meer durchschwimmen, das Geschlecht, uns verringert es sich, da wir es durchschiffen.</p><p>Wer möchte nun leugnen, daß den Fischen von Gott solcher Instinkt und solche Kraft eingesenkt ward? Sieht er doch, wie die einen mit sicherem Instinkt den so regelmäßigen Wanderzug nach dem Norden zu Laichzwecken antreten, andere mit winzigem Körper ein so großes Maß von Kraft fassen, daß sie die größten, mit vollen Segeln eilenden Schiffe mitten im Wasser aufhalten. So soll ja das kleine Fischlein Echeneis mit so erstaunlicher Leichtigkeit einen Schiffskoloß zum Stehen bringen, daß man ihn wie angewachsen im Meere stocken und nicht mehr sich fortbewegen sieht; denn das Fischlein hält ihn für geraume Zeit unbeweglich fest. Oder glaubst du, es könne auch diesem die so erstaunliche Kraft ohne des Schöpfers Gabe eignen? Was sollte ich die Schwertfische nennen oder die Sägefische oder die Seehunde oder die Wale oder die Hammerfische, was auch des Rochen Stachel, und zwar des toten? Wie nämlich nur der frischerlegte Rachen der Viper für den, der darauf tritt, noch schädlicher als Gift wirkt und dessen Wundgift unheilbar schleichen soll, so sagt man auch vom Rochen, er sei mit seinem Stachel tot gefährlicher denn lebend. Auch das Häschen, ein furchtsames Landtier, ein gefürchtetes Seetier, bringt schnelles Verderben, das sich nicht leicht abwenden läßt. Es wollte nämlich dein Schöpfer, daß du auch auf dem Meere nicht völlig sicher seiest vor nachstellenden Feinden, auf daß du wegen der nur wenigen Unheil drohenden Gefahren, gleichsam auf dem Wachtposten stehend. stets mit den Waffen des Glaubens und dem Schilde der Frömmigkeit gegürtet, von deinem Herrn des Heiles Schutz erhoffest.</p><p><strong>Die furchtbaren Walungeheuer daselbst. Die Schätze des Meeres: Marmorwänden gleiche Salzlager, Korallen und Perlen. Goldvließ und Purpur. Die Vorzüge der Schiffahrt. Jonas im Bauche des Fisches Christi Vorbild.</strong></p><p>Wir wollen nun den Schritt nach dem Atlantischen Meere lenken. Welche Walungeheuer von unermeßlicher Größe daselbst! Man möchte sie, wenn sie dann und wann an der Oberfläche des Wassers schwimmen, für wandelnde Inseln halten, für gewaltige hohe Berge, die mit ihrer Spitze gen Himmel ragen. Nicht an Küsten und Gestaden, sondern in der Tiefe des Atlantischen Meeres sollen sie zu sichten sein [so furchtbar], daß Schiffer auf ihren Anblick von dem Wagnis abstehen, nach jenen Stellen hinauszusegeln, und ohne die äußerste Todesgefahr sich nicht in die verborgenen Fernen des Elementes hinauszusteuern getrauen.</p><p>Doch auch wir wollen jetzt aus der Tiefe des Meeres heraufsteigen, unser Wort soll eine Weile auftauchen und sich zur Höhe richten. Betrachten wir, was vielen ein gewohnter Anblick voll Anmut ist, wie nämlich Wasser in feste Salzmasse sich wandelt, so daß es oft mit Eisen behauen wird gar nichts Ungewöhnliches bei den britischen Salzlagern, die wie harter Marmor im schneeweißen Schimmer des Gesteins glänzen: eine gesunde Würze für die leibliche Speise und für den Trank überaus schmackhaft. [Betrachten wir desgleichen, wie die nicht unschöne Koralle im Meere, eine Pflanze ist, an die Luft versetzt aber zu festem Gestein kristallisiert; woher ferner die kostbare Perle stammt, welche die Natur in die Muscheln einbettete; wie das Meerwasser sie in der so weichen Fleischmasse verhärtete. Schätze, wie sie kaum bei Königen zu finden sind, liegen wie wertlose Dinge offen an den Gestaden und lassen sich an rauhen Felsen und Riffen auflesen. Auch goldenes Vließ erzeugt das Meer, und Wolle nach Art des genannten [Gold]Metalles bringen die Küsten hervor, und noch keiner der Meister, die mit verschiedenen Farbstoffen die Fälle färben, vermochten seine Farbe nachzuahmen. So wenig versteht menschlicher Fleiß, die über den Naturbereich des Meeres ausgegossene Schönheit vollendet wiederzugeben! Wir wissen, welche Sorgfalt die Herstellung der Vließe, auch der minder kostbaren, verlangt: und ob es die feinsten sind, sie haben keine angeborene Farbe. Dort haben wir Naturfarbe, der noch keine Kunstfarbe gleichtat. Auch in unserem Fall handelt es sich um eines Fisches Vließ. Aber auch die Purpurschnecken, die den Schmuck der Könige liefern, sind Seetiere.</p><p>Und welcher Wiesenflor oder welche Gartenzier könnte wetteifern mit der Farbenpracht des blauen Meeres? Goldig mögen auf den Wiesen die Blumen prangen: des Goldes Gefunkel im Meer strahlt die [purpurfarbene] Wolle wieder; jene welken rasch ab; diese hält sich lange Zeit. In den Gärten schimmern von weitem die Lilien, auf den Schiffen die Segel. Dort atmet Duft, hier Windeshauch. Welcher Nutzen liegt im Blatt! Wieviel Proviant liegt aufgespeichert in den Schiffen! Die Lilien fächeln der Nase Duft, die Segel dem Menschen Heil. Dazu hüpfende Fischlein, spielende Delphine. Dazu rauschende Wogen mit dumpfem Getöse. Dazu Schiffe, die zu den Gestaden eilen oder von den Gestaden kommen. Wenn ferner die Viergespanne aus den Schranken starten, mit welcher Begeisterung und Liebe folgen die Zuschauer dem Wettkampfe! Und doch läuft das Roß vergeblich, nicht vergeblich die Schiffe; jenes vergeblich, weil leer, diese nutzbringend, weil vollbeladen mit Getreide. Was gäbe es prächtigeres als die Schiffe? Nicht mit Schlägen werden sie vorwärts getrieben, sondern durch der Winde Wehen. Da gibt es keinen Partner, sondern lauter Gönner; da gibt es keinen Besiegten, wer immer ankommt, sondern nur Kränze für alle Schiffer, die glücklich landen; da winkt die Palme als Preis der glücklichen Fahrt, der Sieg als Lohn der Heimkehr. Denn welch großer Unterschied zwischen dem rechten und dem verfehlten Kurs! Ersterer wird ständig eingehalten, letzterer verlassen. Nimm dazu die von Rudern starrenden Ufer. Das Wehen vom Himmel gibt ihnen das Zeichen zur Abfahrt. Während nun die Wettfahrer eitlen Beifall ernten, lösen die Schiffer nach glücklicher Fahrt ihre Gelübde ein.</p><p>Wie werde ich würdig über Jonas sprechen, den der Walfisch zum Leben aufnahm, dem Prophetenberuf zurückgab? Das Wasser brachte den zur Einsicht, den das Festland beirrt hatte, im Bauche des Fisches lobsang dem Herrn, der auf dem Festlande traurig verstummte. Damit es nicht an einem Hinweis auf die Erlösung beider Elemente fehle, ging der Errettung [Ninives] auf dem Festlande die [des Jonas] im Meere voraus; denn das Zeichen des Jonas wurde das Zeichen des Menschensohnes. Wie jener im Bauche des Fisches lag, so Jesus im Herzen der Erde. Hier wie dort gab es Heil. Doch das Meer bot das größere Vorbild der Liebe; denn die Fische nahmen den auf, welchen die Menschen verwarfen, und erhielten am Leben, welchen die Menschen kreuzigten. Auch Petrus schwankte wohl auf dem Meere, aber er fällt nicht, und ein Bekenner in den Fluten, wird er doch ein Verleugner auf dem Festlande. Dort wird er als Frommgläubiger von [des Herrn] Hand erfaßt, hier trifft ihn als Gottvergessenen sein strafender Blick.</p><p>Doch laßt uns jetzt den Herrn bitten, daß unsere Rede wie Jonas ans Festland gesetzt werde, um nicht länger in der Salzflut zu treiben. Gut auch, daß eine Kürbispflanze aufgesprossen, deren Schatten uns von unserem bösen Tun weg aufnehmen mag. Doch gemahnt auch ihr Verdorren bei aufsteigender Sonne zur Ruhe, daß nicht der Geist uns zu vertrocknen beginne und selbst die Worte versagen. Soviel ist gewiß mehr als den Niniviten ward uns im [Tauf] Wasser Vergebung unserer Sünden zuteil.</p><p><strong>Die Vogelwelt das dritte Tierreich. Einleitende Bemerkungen.</strong></p><p>Und nach kurzer Pause griff er den Faden der Rede wiederum auf und fuhr fort: Entgangen war uns, geliebteste Brüder, die notwendige Besprechung über die Natur der Vögel und die bezügliche Rede mit den Vögeln selbst entflogen. Es liegt ja gleichsam in der Natur der Sache, daß die, welche etwas genau sich ansehen und mit Worten beschreiben wollen, die Eigenart jener Dinge, die man sich betrachtet oder bespricht, sich aneignen: bei langsameren Dingen verweilen wir länger, mit schnellen zieht es uns mit raschem Blick mit fort, und so fließt auch unsere Rede bald langsamer bald rascher. Bei meinem sorglichen Streben also, die in der Meerestiefe ruhenden Dinge nicht zu übersehen, ist mir die ganze Vogelwelt entflogen. Denn während ich mich hinabbückte und die untersten Wasserschlünde durchspähte, merkte ich des Vogelfluges in den Lüften nicht, und nicht einmal der Schatten des raschen Fittichs, der im Wasser sich widerspiegeln mochte, lenkte mich ab. Doch da ich bereits die ganze Aufgabe für erledigt erachtete und mich am Ende glaubte und den fünften Schöpfungstag für vorübergegangen hielt, da fuhren mir die Vögel durch den Sinn, die beim Schlafengehen noch „die Luft mit süßem Sang erfüllen“, als freuten sie sich des vollbrachten Tagewerkes. Und sie erneuen ihn regelmäßig wie zu Tagesanbruch so zu Tagesende, um nach Ablauf und zu Beginn der Nachtzeit ebenso wie der Tagzeit ihrem Schöpfer Lob und Preis darzubringen, So habe ich mir denn einen mächtigen Ansporn für uns zur Frömmigkeit entgehen lassen. Denn welcher menschlich Fühlende würde sich nicht schämen, ohne feierlichen Psalmengesang den Tag zu beschließen, nachdem sogar die kleinen Vögelchen in gewohnter Andacht und mit süßem Lied den Anbruch der Tage und Nächte begehen?</p><p>So kehre uns denn die beschwingte Rede wieder, die unseren Augen fast entschwunden wäre und bei ihrem Adlerflug zur Höhe sich in die Wolken verloren hätte, würde es uns nicht, da wir nach dem Wasserbad die Augen von der Tiefe zum Himmel aufschlugen und des Flügelschlages im leeren Luftraum gewahrten, an dieses Zurück zum notwendigen Thema gemahnt haben. Ihr, die ihr wie Vogelsteller nach meinem Worte hascht, sollt Richter sein, ob es besser entflöge oder nutzbringend wiederum in euer Garn gegangen sei. Und ich besorge nicht, daß uns etwa bei der Beobachtung des Vogelfluges Unlust anwandle, die uns auch bei der Durchforschung der Meeresschlünde nicht angewandelt, oder daß jemand aus uns während des Vortrages einschlafe, da ihn der Vogelsang aufwecken müßte. Ich halte es vielmehr für ganz ausgeschlossen, daß einen, der unter den stummen Fischen wachblieb, unter den hellsingenden Vögeln Schlaf anwandeln könnte, da doch solch liebliche Laute ihn zum Wachen einladen. Sodann aber darf, was der Gefahr des Übergangenwerdens ausgesetzt war, nicht für gering erachtet werden; denn es ist das dritte Tierreich der Schöpfung. In drei Klassen zerfallen ja zweifelsohne die Tiere: in Land,Flug und Wassertiere. So steht ja geschrieben: „Es sollen hervorbringen die Wasser die kriechenden Tiere mit lebendiger Seele nach ihrer Art und die Vögel, daß sie flögen über der Erde an der Veste des Himmels nach ihrer Art“.</p><p>Wir werden zum früheren Thema gemahnt gleich vergeßlichen Wanderern, die gedankenlos dahinziehend wiederum in ihre eigenen Spuren einlenken und ihre Unbedachtsamkeit damit büßen, daß sie nochmals dem mühevollen Wandern sich unterziehen müssen. Und doch: auch ein tüchtiger Wanderer muß es sein, wenn er die durch das Zurückgehen verlorene Zeit dadurch hereinholt, daß er die noch erübrigende Wegstrecke beschleunigten Schrittes zurücklegt. So glaube ich es auch halten zu sollen, zumal in einem Vortrage über die Vögel, die mit allzu flüchtigem Fluge am Auge des Menschen vorüberstreichen. Wie wäre auch ein Weilen am Platze bei Wesen, an denen gerade die Schnelligkeit zu gefallen pflegt? Möge denn unsere pfadlos schweifende, auf diesem Gebiete unbewanderte Rede „vom melodischem Vogelsang erschallen“ und widerhallen!</p><p>Doch wer gibt mir des Schwanen Gesang, der selbst unter des nahenden Todes schwerer Angst noch ergötzt? Wer gibt mir jene natürlichen Sangesweisen, von deren anmutssüßen Klängen selbst die Sümpfe widerhallen? Wer gibt mir die Laute des Papageies und den süßen Schlag der Amseln? Oder möchte doch der Nachtigall Lied erschallen, die den Schläfer aus dem Schlummer weckt! Es pflegt nämlich dieser Vogel den Anbruch des aufgehenden Tages anzuzeigen und durch den dämmernden Morgen weithin Frohsinn zu wecken. Gebricht es an ihrem lieblingen Sange, sind doch die klagenden Turteln zur Stelle und die gurrenden Tauben; auch die Krähe sodann „kündet mit lautem Ruf den Regen an“. So laßt uns denn, so gut es geht, mit dem Wissen, das wir den Landleuten verdanken, an die Besprechung der Vogelwelt auf dem Festlande herantreten</p><p><strong>Die nächtliche Wachsamkeit der Gänse: “Roms Götter schliefen, die Gänse wachten”.</strong></p><p>Nachdem wir eben von den Kriechtieren des Wassers gesprochen haben, fällt es schwer, mit unserer Rede uns sogleich zu den Vögeln des Himmels aufzuschwingen. Daher wollen wir vorerst von jenen Vögeln sprechen, die an den Gewässern des Meeres und der Flüsse sich aufhalten; mit ihnen vermögen wir aus den Fluten aufzutauchen. Mit dem Eisvogel nun wollen wir die Besprechung beginnen. Er ist ein Seevogel, der gewöhnlich an den Küsten seine Jungen ausbrütet, so zwar, daß er fast mitten im Winter seine Eier in den Sand legt. Denn das ist die ihm beschiedene Brutzeit, wann das Meer am höchsten geht und dessen Flut besonders heftig an die Ufer schlägt. Die plötzlich eintretende Stille, die regelmäßig darauf folgt, läßt in um so hellerem Lichte den feinen Instinkt dieses Vogels erscheinen. Denn sobald das Meer seinen höchsten Wogengang erreicht hat, wird es, nachdem die Eier gelegt sind, mit einem Mal ruhig, aller Sturmwind legt sich, das Brausen in den Lüften läßt nach und „windstill ruhet das Meer“, solange der Eisvogel über seinen Eiern brütet. Sieben Tage aber beträgt die Brutzeit, nach deren Ablauf er die Küchlein ausschlüpfen läßt und das Brutgeschäft beendet. Damit verbindet er unmittelbar noch weitere sieben Tage zur Aufnährung seiner Jungen, bis sie mählich flügge werden. Man wundere sich nicht über die so kurze Frist der Aufzucht, nachdem doch auch das Brutgeschäft in so wenigen Tagen vollendet ist. So zuverlässig aber ist der glückliche Instinkt, den dieser winzig kleine Vogel von Gottes Huld empfangen, daß die Schiffer auf diese vierzehn Tage, die ruhige See erwarten lassen, genau achten. Sie nennen sie darum auch die alkyonischen [Eisvogel] Tage, an welchen sie keinen Ausbruch stürmischen Wetters besorgen.</p><p>„Seid ihr nicht mehr wert als die Sperlinge?“ fragt der Herr. Wenn nun schon um eines winzigen Vogels willen das Meer sich hebt und plötzlich legt und zur rauhen Winterszeit inmitten des heftigen Tobens und Brausens der Stürme allen Elementen plötzlich Ruhe wiederkehrt, die den Wolkenflor am Himmel teilt und die Wogen glättet: wie hoch und kühn du erkennst es darfst du, o Mensch, Gottes Nachbild, die Hoffnung spannen, wenn sonst du dieses Vögelchens Glaubenszuversicht in frommem Streben nachahmst? Dieses läßt sich nicht angesichts der losbrechenden Stürme und der rasenden Winde mitten im Dräuen des Winters beirren und abschrecken, sondern vielmehr ermuntern. So legt es denn seine Eier an die Küste, woselbst sie der von der zurückebbenden Flut noch feuchte Sand aufnimmt, und fürchtet nicht die sich türmenden Wogen, die sie tosen und sich heranwälzen sieht.</p><p>Glaube nicht, daß er sich um die Eier anscheinend nicht kümmere. Sogleich, nachdem er die Eier gelegt, nistet er und brütet mit eigenem Leibe die Jungen aus und fürchtet nicht für das eigene Wohl, ob auch die Wogen ans Gestade schlagen, sondern setzt sich ruhig auf Gottes Huld bauend Wind und Wogen aus. Noch nicht genug. Er verbindet damit noch ebenso viele weitere Tage zur Aufnährung, ohne zu besorgen, es möchte während der so vielen Tage die Ruhe des tückischen Meeres gestört werden, und erprobt seinen längst gewohnten, in seiner Natur begründeten Vorzug [des Vorauswissens]. Er birgt die zarten Küchlein nicht in irgendwelchen Verstecken oder unter Dächern, und schließt sie nicht in Felsenlöchern ein, sondern vertraut sie dem nackten, kalten Boden an; er schützt sie nicht vor Kälte, sondern glaubt sie um so sicherer in Gottes Hut, je mehr er auf alles andere verzichtet. Wer von uns hüllte seine Kleinen nicht in Kleider, bärge sie nicht unter schützenden Dächern? Wer schlösse sie nicht hinter die schützenden Wände der Gemächer? Wer verrammelte nicht von allen Seiten sogleich die Fenster, daß auch nicht der leiseste Luftzug eindringen könne? Und während wir sie so ängstlich hüllen und hegen, streifen wir ihnen so recht das Gewand der himmlischen Milde ab; der Eisvogel hingegen kleidet sie, da er sie nackt aussetzt, in Gottes hüllenden Schutz.</p><p>Auch euch, ihr Taucher dieser Name haftet ihnen von der ständigen Gepflogenheit des Tauchens an, will ich nicht übergehen. Wie merkt ihr doch bei euerem steten Tauchen die Anzeichen der Luft und fliegt eilig, den nahenden Sturm voraussehend, mitten aus dem Meere auf und flüchtet euch mit Geschrei an den sicheren Strand! Wie flieht auch ihr, Wasserhühnchen sie lieben die Meerestiefen, den Aufruhr des Meeres, den ihr vorauswißt, und spielt [lieber] am sicheren Strande! Selbst der Reiher, der gewöhnlich an Sümpfen sich aufhält, verläßt die gewohnten Wohnsitze und fliegt aus Furcht vor Regenschauer über die Wolken hinaus, um vor deren Dräuen verschont zu bleiben. Betrachten wir also die verschiedenen Seevögel, wie sie, wenn Stürme sich zu erheben drohen, die geschützteren und während dieser Zeit für sie annehmlicheren Stellen aufsuchen und an einem einsamen Winkel des Festlandes ihre gewohnte Nahrung suchen!</p><p>Wer aber bewunderte nicht das Nachtwachen der Gänse, die ihr Wachen auch durch ständiges Schnattern bekunden? Haben sie doch damit sogar das römische Kapitol vor dem gallischen Feind gerettet. Ihnen verdankst du Rom, so recht deine Herrschaft. Deine Götter schliefen, und die Gänse wachten. Darum opferst du an jenen Tagen der Gans und nicht dem Jupiter, denn euere Götter räumen den Gänsen den Platz, in deren Hut sie, wie sie wissen, gestanden, daß nicht auch sie in die Gefangenschaft der Feinde gerieten.</p><p><strong>Einteilung der Vogelarten: Raubvögel, Zugvögel, zahme Vögel, Singvögel. Sonstige Unterschiedlichkeiten.</strong></p><p>Passend folgte auf die Beschreibung der Fische die Besprechung derjenigen Vögel, die gewöhnlich im Wasser sich aufhalten; denn auch sie erfreuen sich gleicherweise der Gepflogenheit und Funktion des Schwimmens. Darum scheint auch die erste Verwandtschaft zwischen diesen Vögeln und den Fischen darin zu liegen, daß beiden Gattungen gemeinsam das Schwimmen eignet. Noch eine zweite Verwandtschaft der Vögel und Fische besteht insofern, als die Flugbewegung eine Art Schwimmbewegung ist. Wie nämlich der Fisch schwimmend das Wasser durchschneidet, so teilt der Vogel raschen Flugs die Luft. Und beiden Gattungen dient gleicherweise Schwanz und Flügel [Flossen] als Ruder. So schwingen sich die Fische mit den Flossen nach vorne zur Höhe und dringen vor bis zum äußersten Rand, steuern desgleichen mit der Schwanzflosse, wohin sie wollen, oder nehmen wie im Anlauf den Weg über ihren Bereich hinaus. Und auch die Vögel schwimmen mit ihren Fittichen wie im Wasser in der Luft und breiten sie wie Flossen aus, schwingen sich ebenso zur Höhe auf oder tauchen zur Tiefe nieder. Weil sonach in mancher Beziehung Lebensbrauch und art sich gleichen, nahmen beide Gattungen auf Gottes Befehl ihre Entstehung aus dem Wasser.Es sprach nämlich Gott: „Es sollen hervorbringen die Wasser die kriechenden Tiere mit lebendiger Seele nach ihrer Art und die Vögel, daß sie an der Veste des Himmels dahinfliegen nach ihrer Art“. Nicht mit Unrecht also ist, da beide Gattungen aus dem Wasser hervorgebracht wurden, auch beiden das Schwimmen eigentümlich.</p><p>Während freilich die schlüpfrige Hausschlange und alle übrigen Schlangen davon hat ja die Schlange ihren Namen, daß sie nicht gehen, sondern nur sich schlängeln kann, auch die Wasserschlangen ebenso wie die Fische keine Füße haben, entbehrt keine Vogelart der Funktion derselben; denn alle beziehen ihre Nahrung von der Erde und bedienen sich darum der Füße als Stelzen, indem sie solches Dienstes zur Nahrungssuche benötigen. So sind auch die einen Vögel mit Krallen bewaffnet zum Rauben, wie Habicht und Adler, die auf räuberische Jagd ausgehen, andere gebrauchen und benützen sie zweckdienlich zum Gehen oder zur Beschaffung der Nahrung.</p><p>Die Bezeichnung ’Vögel` ist nur eine, doch die Arten sind verschieden. Und wer könnte diese mit dem Gedächtnis oder dem Verstande beherrschen? So gibt es Vögel, die sich von Fleisch nähren. Sie haben darum, weil sie von Raub leben, scharfe Krallen, krummen spitzen Schnabel und schnellen Flug, um die Beute, nach der sie fahnden, leicht erhaschen und rasch mit dem Schnabel oder den Krallen zerfleischen zu können. Es gibt auch Vögel, die sich vom Samen, den sie finden, andere, die sich von verschiedenartiger Speise, auf die sie zufällig stoßen, nähren. Sie gesellen sich desgleichen verschiedentlich zusammen; nur jene, die auf Raub ausgehen, entraten dieser Annehmlichkeit; denn in ihrer Beutegier und bei ihrem hinterlistigen Auflauern suchen sie nicht einmal unter sich selbst Führung und verschmähen darum einen gegenseitigen Zusammenschluß die Habsucht will ja nicht mit vielen Gemeinschaft machen. Dazu könnte ein Zusammenrotten vieler leicht sich selbst verraten. Diese Lebensweise nun führen Adler und Habichte, dagegen lieben Tauben, Kraniche, Stare und Krähen in hohem Grade die Geselligkeit.</p><p>Sodann unterscheidet man enchorische Vogelarten, die stets im Lande bleiben, und Zugvögel, die in fremde Gegenden ziehen und nach Ablauf des Winters wiederkehren. Wieder andere gibt es, die im Winter zurückkommen und im Sommer von uns fortwandern. Die einen suchen zur Winterszeit ein wärmeres Klima auf, andere hinwiederum bringen zumeist den Sommer in solchen Gegenden zu, die ihnen, wie sie wissen, mehr Annehmlichkeit bieten. So kehren die Drosseln Ende des Herbstes wieder, wenn der Winter naht und der Sommer vorüber ist. Und wir bereiten ihnen dabei mit ungastlicher Grausamkeit Nachstellungen und trachten sie auf verschiedene Art bald durch ein falsches Ruheplätzchen zu überlisten, bald durch Lockrufe zu täuschen, bald mit Schlingen einzufangen. Der heimkehrende Storch hißt die Flagge des Lenzes. Die Kraniche wandern gern und häufig, weil sie den Hochflug lieben.</p><p>Die einen Vögel lassen sich auf die Hand nieder, gewöhnen sich an den Tisch und lassen sich streicheln und kosen, andere sind scheu. Die einen freuen sich der gemeinsamen Wohnstätten mit den Menschen, andere lieben ein einsames Leben in den Wüsten; mag die Beschaffung des Lebensunterhaltes schwierig sein, die Liebe zur Freiheit entschädigt sie dafür. Die einen schreien nur mit der Stimme, andere erfreuen durch melodische und süße Weisen. Manche bringen von Natur, andere durch Trill mannigfach unterschiedliche Laute hervor, die man für Menschenstimmen halten möchte, wiewohl sie nur Vogellaute sind. Wie süß ist der Nachtigallen, wie schrill des Papageis Stimme! Sodann gibt es Vögel teils einfältig wie die Tauben, teils heimtückisch wie die Kiebitze. Der Hahn zeigt mehr stolzes, der Pfau mehr zierliches Wesen. Auch im Leben und Handeln treten bei den Vögeln Unterschiedlichkeiten hervor: die einen sind eifrig für das allgemeine Beste bedacht und tragen gleichsam mit vereinten Kräften Sorge für das Gemeinwohl und leben gewissermaßen unter einem Herrscher; von den anderen möchte jeder nur für sich sorgen, jede Herrschaft ablehnen und im Falle der Gefangennahme der unwürdigen Knechtschaft loswerden.</p><p><strong>Ihr Gesellschaftsleben das Vorbild für den menschlichen Idealstaat in der Urzeit. Verfall des letzteren.</strong></p><p>Mit jenen Vögeln nun wollen wir beginnen, die für unsere Lebensweise vorbildlich geworden sind. Bei ihnen nämlich ist sozusagen der Staatsund Kriegsdienst etwas Natürliches, bei uns Zwang und Dienstbarkeit. Wie halten nicht die Kraniche ohne Befehl, aus freiwilliger Gepflogenheit bei Nacht sorgsame Wache! Hier und dort sieht man Wachtposten stehen, andere ziehen, während die übrigen Kameraden ruhen, herum und spähen, ob nicht von irgendwelcher Seite Überfall versucht würde, und leisten mit unverdrossener Selbsthingabe jeglichen Schutz. Ist für einen die Wachtzeit abgelaufen, geht er nach Beendigung seines Dienstes schlafen, gibt aber zuvor noch ein lautes Signal, um den Schläfer, dem er seinen Posten abtritt, zu wecken. Und willig übernimmt dieser seine Funktion und verzichtet nicht, wie wir’s gewohnt, nur ungern und allzu träge auf den Schlaf, sondern läßt sich unverzüglich vom Lager aufrütteln, tritt seinen Posten an und vertritt mit der gleichen Sorgfalt und Dienstbeflissenheit das Amt, das er übernommen hat. Darum auch keine Desertion, weil natürliche Hingabe, darum sichere Wache, weil freiwillig geleistet.</p><p>Auch halten sie die Ordnung beim Fluge ein, gehen mit der Regelung bei allem zu Werke, daß sie abwechselnd die Führerrolle übernehmen. Es tritt nämlich einer zu der ihm vorausbestimmten Zeit vor die übrigen und zieht gleichsam vor der Linie einher. Sodann tritt er zurück und gibt dem Folgenden die Führerrolle hinüber. Was gäbe es Schöneres als dies? Bürde und Würde teilen alle gemeinsam, und nicht maßen sich einige wenige die Macht an, sondern auf alle geht sie gleichsam in freier Bestimmung über.</p><p>Dies war die Verwaltungsform des antiken Gemeinwesens, dies das Bild des freien Staates. So begannen ursprünglich die Menschen die von Natur überkommene Staatsgewalt nach dem Vorgange der Vögel auszuüben. Gemeinsam sollte die Bürde, gemeinsam die Würde sein; jeder sollte abwechselnd seinen Teil in der Sorge [für das Ganze] beitragen lernen, in Gehorsam und Befehl sich teilen, niemand von der Würde ausgeschlossen, keiner der Arbeit enthoben sein. Das war ein Idealzustand. Keiner pochte auf eine lebenslängliche Amtsgewalt, keiner brach zusammen unter einem ständigen Sklavenjoch. Neidlos wurde einem nach dem amtlichen Turnus und fälligen Zeittermin Beförderung zuteil, und leichter trug sich deren Bürde, weil sie das Aufsichtsamt mit anderen teilten. Niemand wagte einen anderen im Dienste zu schikanieren, um nicht seinerseits dessen Mißmut fühlen zu müssen, sobald er ihm im Ehrenamte folgte. Niemand fiel die Arbeit schwer, von der die künftige Würde ihn befreite. Doch seitdem die zu müssen, sobald er ihm im Ehrenamte folgte. Niemand fiel die Arbeit schwer, von der die künftige Würde ihn befreite. Doch seitdem die Herrschsucht anfing, überkommene Ämter sich anzumaßen, übernommene nicht mehr niederlegen zu wollen; seitdem der Kriegsdienst anfing, nicht mehr ein gemeinsames Recht, sondern Dienstbarkeit zu sein; seitdem kein Turnus mehr in der Übernahme der Amtsgewalt eingehalten wurde, sondern Strebertum sie an sich riß, begann auch die Verrichtung der Arbeit, der man sich unterzieht, drückender zu werden; und unfreiwillige Arbeit artet bald in Lässigkeit aus. Wie ungern unterziehen sich nicht die Menschen den Nachtwachen! Wie hart tritt ein jeder im Lager den Wachtdienst auf einem gefährlichen Posten an, dessen Schutz ihm auf des Königs Befehl anvertraut wird! Strafe ist auf Fahrlässigkeit gesetzt, und dennoch schleicht sich oft Nachlässigkeit ein und wird der Wachtdiuenst nicht eingehalten. Denn der Zwang, der einem wider seinen Willen eine Pflicht auflegt, erzeugt zumeist Unlust. Nichts ist so leicht, daß es nicht Schwierigkeit machte, sobald man’s ungern tut. So verleitet einem denn ununterbrochene Arbeit die Lust und erzeugt ständig dauernde Macht Selbstüberhebung. Wo findet man denn einen Menschen, der von freien Stücken die Herrschaft niederlegte, seinen Feldherrenstab abträte und, statt erster, freiwillig der letzte würde? Wir streiten uns aber oft nicht bloß um den ersten Rang, sondern auch schon um einen mittleren und beanspruchen bei einem Mahle die ersten Plätze und wollen den einmel eingeräumten Rang für immer haben.</p><p>So herrscht also unter den Kranichen Zufriedenheit bei der Arbeit, Demut in Ämtern. Einer Mahnung bedarf es nur zur Ablösung im Wachtdienst, keiner Mahnung zum Rücktritt vom [Führer] Amt; dort nämlich handelt es sich um die Unterbrechung der natürlichen Schlafesruhe, hier um die edle Tat freiwilliger Dienstbeflisseneheit.</p><p><strong>Ihr Wanderzug ein geordneter Heereszug. Die Krähen ihre treuen Begleiterinnen und Streiterinnen. Von der Pflicht der Gastfreundschaft. Die Pietät der Störche ein Ideal von Kindesliebe. Der Storch, der ‘fromme Vogel’; ‘Storchendank’.</strong></p><p>Von den Störchen erzählt man, sie zögen in geschlossenem Zuge, wenn sie wohin wandern zu sollen glauben, hielten gemeinsam Einzug zumeist in die Gegenden gen Aufgang und brächen wie auf ein militärisches Zeichen alle zugleich auf. Man möchte glauben, ein Heer ziehe in Reih`und Glied daher: so behalten alle im Zuge oder an den Flanken oder an der Spitze ihren Platz bei. Krähen aber führen sie, weisen ihnen die Richtung und folgen ihnen wie Trabantenscharen in einer Weise, daß man glauben möchte, sie seien gleichsam ihre Hilftruppen im Kampfe wider die feindlichen Vögel und unterzögen sich unter eigener Gefahr fremden Kriegsstrapazen. Beweis hierfür ist, daß man die ganze Zwischenzeit über keine Krähen in jenen Gegenden tifft, und daß sie wundenbedeckt zurückkehrend gleichsam mit der Stimme des Blutes und sonstigen Antzeichen es deutlich verraten, daß sie schwererer Kämpfe Streit bestanden hätten. Wer nun hätte ihnen mit Strafe auf Fahnenflucht gedroht, wer auf Verweigerung des Waffendienstes furchtbare Strafen gesetzt, auf daß keine sich dem Dienste gegen die befreundeten Scharen zu entziehen suche, sondern alle wetteifernd der Aufgabe und Pflicht des Geleites oblägen?</p><p>Es lerne der Mensch das Gastrecht wahren! Und von den Vögeln lerne er kennen, wie heilige Ehrfurcht Gästen zu erweisen, welche Dienste ihnen zu leisten sind, wenn Krähen nicht anstehen, selbst persönliche Gefahren für sie auf sich zu nehmen! Wir verschließen ihnen die Türen, während die Vögel selbst ihr Leben für sie einsetzen. Während jene dienstbeflissen die äußerste Gefahr mit ihnen teilen, verweigern wir ihnen ein gastliches Obdach. Während jene die Kriegsstrapazen ihnen abnehmen, begriegen wir sie häufig. Ein Lügner soll ich sein, wenn nicht für die Sodomiten gerade das der Grund des Strafgerichtes war; oder wenn die Wut der Ägypter, da sie das gastliche Volk [der Hebräer] zu bekriegen suchte, den Treubruch des Gastrechtes nicht mit dem Untergang des Volkes büßen mußte.</p><p>Zu erwägen aber ist, wie die Mildherzigkeit selbst vernünftiger Wesen die Liebe und Findigkeit unseres Vogels nicht überbietet, wie niemand von uns das Beispiel der unvernünftigen Tiere, selbst nachdem es vorliegt, nachzuahmen vermag. Sind nämlich die Glieder eines siechen Alten ob des hohen Alters der hüllenden Federn und des Steuers der Fittiche entblößt, drängen sich die Jungen rings heran und wärmen ihn mit ihrem Gefieder und was soll ich sagen? atzen ihn mit Nahrung, die sie herbeischleppen, und helfen sogar mitunter dem Kräfteverfall der Natur damit ab, daß sie den Alten dann und wann mit der Sänfte ihrer Fittiche zur Höhe heben und im Fliegen üben und so die bereits entwöhnten Glieder des guten Alten dem früher gewohnten Gebrauche zurückgeben. Wer von uns empfände nicht Widerwillen vor der Pflege eines kranken Vaters? Wer nähme den vor Alter Erschöpften auf seine Schultern? Ein selbst in der Geschichte fast unerhörter Fall! Wer würde nicht, um seiner Kindespflicht zu genügen, solchen Dienst den Sklaven aufbürden? Doch den Vögeln fällt das pietätsvolle Verhalten nicht schwer, die natürliche Pflichterfüllung nicht hart, dem Alten die Pfege nicht, welche die Menschen so vielfach trotz der unter schwersten Strafen vorgeschriebenen Pflicht verweigern. Die Vögel bindet „kein geschriebenes, sondern ein angeborenes Gesetz“. Den Vögeln obliegen zu solchem Liebeserweise keine Vorschriften, sondern nur die Pflichten der natürlichen Dankbarkeit. Die Vögel schämen sich nicht, den Leib des Alten, dem Ehrfurcht gebührt, zu tragen. Er [der Storch] ist nämlich der Träger frommer Pietät. Das ist, weil häufig erwiesen, so allgemein bekannt, daß er auch den verdienten Lohn hierfür fand. Nach römischem Brauch heißt er nämlich der ‘fromme Vogel’. Dieses Namens, der kaum einem Kaiser durch Senatsbeschluß beigelegt ward, wurden diese Vögel insgesamt gewürdigt. Auf der Väter Urteil beruht also der Ehrenname, den diese Vögel ob ihrer Mildherzigkeit haben. Der frommen Kinder Lob sollte vor allem im Urteil der Väter gegründet sein. Aber auch die Allgemeinheit stimmt dem bei. So nennt man die Wiedervergeltung von Wohltaten antipelargosis [Storchendank]; pelargos bedeutet nämlich Storch. Von diesem also erhielt sogar eine Tugend ihren Namen, indem die Dankbarkeit nach dem Storche benannt wird.</p><p>Wir haben [oben] ein Beispiel der Kindesliebe junger Vögel gegen ihre ehrwürdigen Alten: laßt uns jetzt von einem großartigen Erweis mütterlicher Sorge gegen die Jungen vernehmen. Die Schwalbe [meine ich], winzig klein an Körper, doch hervorragend groß an zärtlicher Liebe, die aller Dinge bar Nester baut, kostbarer denn Gold, weil sie weise baurt;. denn „das Nest der Weisheit ist wertvoller denn Gold“. Was gäbe es denn Weiseres? Sie sichert sich einerseits ungehinderte Flugfreiheit, vertraut andererseits ihre Jungen und ihr Obdach der Hut menschlicher Behausungen an, woselbst niemand der Brut nachstellen könne. Auch das ist ein schöner Zug, daß sie vom ersten Anfang an ihre Jungen an menschlichen Umgang und Verkehr gewöhnt und so gegen den Überfall feindlicher Vögel sicherer stellt. Allbekannt ist sodann die Zierlichkeit, mit der sie sich ohne jeden Berater ihr Haus als kunstverständige Meisterin baut. Sie liest nämlich mit ihrem Schnabel Hälmchen auf und bestreicht sie mit Schlamm, um sie zusammenkleben zu können. Weil sie aber den Schlamm nicht mit den Füßen herbeizuschleppen vermag, taucht sie die Spitzen ihrer Fittiche in Wasser, damit leicht Staub daran kleben bliebe und zu Schlamm sich verdichte.So nun sammelt sie sich ein Hälmchen und Spänchen um das andere und macht es festkleben. Auf diese Weise führt sie den hanzen Nestbau zu Ende. Da tummeln sich ihre Jungen nun innerhalb ihrer Behausung wie auf einem Estrich ohne anzustoßen, ohne daß eines den Fuß in bauliche Fugen einklemmte oder Kälte die zarte Brut befiele.</p><p>Doch darin teilen sich viele Vögel fast wie in eine gemeinsame Obliegenheit: einzigartig hingegen bleibt jener erstere Zug, in welchem sich eine ausnehmend besorgte Mutterliebe, eine ausgezeichnete kluge Einsicht und Erkenntnis, sodann auch eine gewisse Erfahrung in der Heilkunst begegnen; denn wenn etwa die Augen der Jungen am Erblinden sind oder an stechenden Schmerzen leiden, besitzt sie ein gewisses Heilverfahren, das es ermöglicht, deren Augenlicht den zeitweilig gestörten Gebrauche zurückzugeben.</p><p>Klage denn niemand über seine Not, daß er sein Haus mit leerem Beutel verlassen mußte! Ärmer noch ist die Schwalbe. Keinen Heller an Besitz, ist sie nur überreich an Mühe, baut und macht keinen Aufwand, bringt den Bau unter Dach und nimmt dem Nachbar nichts weg, fügt niemand im Zwang der Not und Armut einen Schaden zu und verzagt nicht angesichts der noch gänzlich hilflosen Jungen. Uns hingegen regt die Armut auf, quält der Dürftigkeit Not, verleitet und treibt Mangel vielfach zu Schandtat und Verbrechen; aus Gewinnsucht richten wir unser Sinnen, lenken wir unser Trachten auf List und Trug, lassen in schweren Leiden die Hoffnung sinken, verlieren gebrochenen Herzens die Fassung, kauern ratund tatlos am Boden, da man doch gerade dann am meisten auf Gottes Erbarmen hoffen soll, wenn Menschenhilfe versagt.</p><p><strong>Des Habichts und Adlers scheinbare Grausamkeit gegen ihre Jungen. Die Mildtätigkeit des Seeadlers gegen den verstoßenen jungen Adler.</strong></p><p>Möchten die Menschen aus dem Verhalten und der Elternliebe der Krähen Liebe zu ihren Kindern lernen! Folgen doch jene sogar noch den flügge gewordenen Jungen mit achtsamem Geleite und tragen den zarten Lieblingen in ängstlicher Sorge, sie möchten sonst etwa umkommen, Nahrung zu und lassen lange nicht vom Liebesdienst der Aufnährung. Hingegen entwöhnen bei unserem [Menschen] Geschlechte die Frauen so rasch ihre Kinder, selbst Lieblinge, oder verschmähen es wenn sie den reicheren Klassen angehören, ihnen die Brust zu reichen. Ärmere verstoßen ihre Kleinen, setzten sie aus und verleugnen Findelkinder. Selbst auch Reiche töten, damit ihr Vermögen sich nicht auf zu viele verteile, die eigene Leibesfrucht im Schoße, führen durch fruchtabtreibende Säfte schon im Mutterschoße den Tod der eigenen leiblichen Kinder herbei: man nimmt ihnen das Leben, bevor man es ihnen gibt. Wer außer dem Menschen wäre auf den Gedanken gekommen, ein Kind zu verstoßen? Wer hätte die so grausamen Vaterrechte erfunden? Wer hätte jene, um welche die Natur ein gemeinsames Bruderband geschlungen, zu unebenbürtigen Brüders gemacht? Söhne vom gleichen reichen Vater stammend trifft ein ungleiches Los: der eine wird mit dem ganzen väterlichen Vermögen, das ihm zugeschriebnen wird, förmlich überschüttet, der andere muß über seinen mageren, dürftigen Anteil am reichen väterlichen Erbe klagen. Hat etwa auch die Natur einen Unterschied gemacht in der Ausstattung, die den Kindern gebührt? Gleichmäßig spendet sie allen, was ihnen als Voraussetzung zur Geburt und zum Leben dienlich sein kann. Sie lehre euch jene, welche ihr mit dem Brudernamen gleichstellt, in Vermögenssachen nicht ungleich zu behandeln! Ihnen, denen ihr es gegeben habt, daß sie gemeinsam sind, was sie von Geburt sind, dürft ihr doch nicht mißgönnen, daß sie auch gemeinsam haben, in was sie von Natur eingesetzt sind.</p><p>Die Habichte sollen darin mit grausamer Härte gegen die eigenen Jungen verfahren, daß sie letztere, sobald sie dieselben zum ersten Flugversuch sich anschicken sehen, aus ihren Nestern stoßen und fort und fort davon abwehren und, falls sie zaudern, mit den Fittichen fortjagen und werfen, mit den Flügeln schlagen und zwingen, den Flug zu wagen, vor dem sie sich fürchten. Auch erweisen sie ihnen fortab keinerlei Auffütterung mehr. Was Wunder doch, wenn raubgewohnte Vögel keine Lust zur Aufnährung haben? Bedenken wir sodann, daß sie dazu ins Dasein gesetzt sind, daß auch die Vögel Furcht zur Vorsicht mahne, und daß sie sich nicht in allweg in Sorglosigkeit wiegen, sondern vor Gefahren von seiten der Raubvögel wohl vorsehen sollten. Da ferner letzteren das Ausgehen auf Raub sozusagen zur zweiten Natur geworden, scheint es ihnen mehr darum zu tun zu sein, ihre Jungen von zarter Jugend an zum Beutefang anzuleiten, als durch Nahrungsentziehung zu verstoßen. Sie sehen vor, daß sie nicht im zarten Alter der Bequemlichkeit verfallen, nicht in Genüssen verweichlichen, nicht in Müßiggang verkommen, nicht auf Nahrung warten statt ausgehen lernen, nicht ihre Naturkraft einbüßen. Sie entledigen sich der emsigen Aufnährung nur, um sie zu zwingen, sich an Raub zu wagen.</p><p>Gar vielfach sagt man auch dem Adler nach, daß er seine Jungen verstoße, freilich nicht beide, sondern nur eines davon. Einige nun erklärten sich das aus dessen Unlust, doppelte Portionen an Nahrung zu beschaffen. Doch mir dünkt diese schwerlich glaubhaft, zumal da Moses diesem Vogel ein so herrliches Zeugnis über die Liebe zu seinen Jungen ausstellte, daß er den Ausspruch tat; „Wie der Adler sein Nest beschützt und voll Zuversicht über seinen Jungen schwebt, so breitete [der Herr] seine Fittiche und nahm sie zu sich und lud sie auf seine Schultern. Der Herr allein war Führer ihnen“. Wie soll der Adler [über die Jungen] seine Fittiche breiten, wenn er eines tötet? Darum erblicke ich den Grund seines grausamen Vorgehens nicht im Knausern mit der Nahrung, sondern in einer Probe, die er anstellt. Er soll nämlich stets seine Brut prüfen, daß nicht die Minderwertigkeit eines entarteten Sprößlings gleichsam die hehre Königswürde, die sein Geschlecht im ganzen Vogelreiche bekleidet, entstellt. Wie nun versichert wird, hält er seine Jungen gegen die Sonnenstrahlen und läßt sie an den Krallen mitten in der Luft schweben. Und wenn nun eines vom Sonnenlicht getroffen, des Auges scharfen Blick ohne zu zucken, ohne an Sehkraft einzubüßen herhält, wird es für bewährt befunden; denn der unverwandte, unversehrte Blick bewies die Unverfälschtheit seiner Natur. Wenn eines hingegen vom Sonnenstrahl geblendet, das Auge abwendet, wird es als unebenbürtig und eines so erhabenen Vaters unwürdig verstoßen und, nachdem es der Anerkennung nicht wert war, auch der Aufzucht nicht wert erachtet. Nicht also aus natürlicher Hartherzigkeit, sondern kraft unbestechlichen Urteils entscheidet er wider ihn: er verstößt nicht seinesgleichen, sondern weist einen fremdartigen ab.</p><p>Doch diese Hartherzigkeit manchen dünkt es so des Vogelkönigs wird durch die Mildherzigkeit eines Individuums aus dem Vogelvolke aufgewogen. Ein Vogel nämlich namens Fulika, griechisch Phene [phene] genannt, nimmt jenen verstoßenen, bezw, nicht anerkannten jungen Adler unter seine eigene Brut auf und hegt und pflegt ihn zusammen mit den Seinigen mit derselben emsig beflissenen Mutterliebe und gleichen Nahrungsreichung wie die eigenen Jungen. So pflegt die Phene fremde Kinder: wir hingegen setzen die unsrigen aus. Der Adler aber setzt im Falle der Aussetzung nicht seinesgleichen, sondern versagt nur einem unebenbürtigen die Anerkennung: wir und das ist schlimmer verstoßen Kinder, die wir als die unsrigen anerkennen.</p><p>Doch laßt uns zur Turteltaube übergehen, welche das Gesetz Gottes als keusche Opfergabe erkor. So wurde sie denn auch bei der Beschneidung des Herrn dargebracht, denn es stand im Gesetz des Herrn geschrieben, sie sollten als Opfer geben ein Paar Turteltauben oder zwei junge Tauben. Das ist nämlich das wahre Opfer Christi: leibliche Keuschheit und geistige Gnade. Die Keuschheit bezieht sich auf die Turtel, die Gnade auf die Taube. Es soll nämlich die Turteltaube, sobald sie nach Verlust des Männchens Witwe geworden, tiefen Abscheu gegen das, was Paarung ist und heißt, hegen, weil die erste Liebe sie durch des Geliebten Tod enttäuschte und betrog, weil dieselbe an Dauer unbeständig war und an Bescherung bitter, indem sie noch größere Todestrauer als Liebeswonne zeitigte. So verzichtet sie denn auf eine nochmalige Verbindung und verletzt nicht die Rechte der Keuschheit und den Bund, den sie mit dem geliebten Gatten eingegangen: ihm allein wahrt sie ihre Liebe, ihm, hütet sie den Namen Gattin. Lernet, Frauen, wie erhaben der Witwenstand ist, dessen Lob selbst in der Vogelwelt sich ankündigt.</p><p>Wer nun gab der Turteltaube diese Gesetze? Frage ich nach einem Menschen: niemand, Denn kein Mensch hätte das gewagt, nachdem selbst Paulus es nicht gewagt hat, die Beobachtung der Witwenschaft zur Gesetzesvorschrift zu erheben. So spricht er denn: „Ich will also, daß die jüngeren [Witwen] heiraten, Kinder gebären, als Hausfrauen walten, dem Widersacher keine Gelegenheit geben“. Und an einer anderen Stelle: „Gut ist es für sie, wenn sie so bleiben; wenn sie aber nicht enthaltsam sind, mögen sie heiraten; denn es ist besser heiraten als brennen“. Nur als Wunsch spricht Paulus bei den Frauen aus, was bei den Turteltauben steter Brauch ist. Und an der anderen Stelle mahnt er sogar die jüngeren zur Heirat, indem unsere Frauen kaum instande sind, die Keuschheit der Turteltauben zu beobachten. Gott also senkte den Turteltauben diesen Trieb ein, gab ihnen diese Kraft der Enthaltsamkeit; denn nur er vermag ein allgemein bindendes Gesetz hierzu zu geben. Die Turteltaube entbrennt nicht vor blühender Jugend, läßt sich durch keine lockende Gelegenheit verführen. Die Turteltaube kennt keine Verletzung der ersten Treue; denn sie weiß die Keuschheit zu wahren, die sie bei der ersten Verbindung, die ihr beschieden war, gelobte.</p><p><strong>sie bezeugen die Möglichkeit und Glaubwürdigkeit der Jungfraugeburt der Gottesmutter.</strong></p><p>Wir sprachen von der Witwenschaft der Vögel, und wie diese Tugend ihren ersten Usprung bei ihnen nahm. Jetzt wollen wir von der Jungfrauschaft sprechen, die sogar, wie versichert wird, bei mehreren Vögeln vorkommt. So kann sie auch bei den Geuern wahrgemommen werden. Die Geier sollen nämlich keinem Geschlechtsverkehr huldigen. Ihre Empfängnis soll sonach ohne jedwede Begattung, ihre Zeugung ohne Männchen vor sich gehen, ihre Jungen sollen ferner in einem langen Leben ein so hohes Alter erreichen, daß sich ihre Lebenstage bis zu hundert Jahren fortfristen, und nicht leicht eine kurzbemessene Altersgrenze ihrer wartet.</p><p>Was sagen dazu die Spötter, welche so gerne unsere Geheimnisse verlachen, wenn sie hören, daß eine Jungfrau geboren hat, und welche die Geburt einer Unvermählten, deren Scham keines Mannes Beischlaf verletzt hat, für unmöglich halten? Für unmöglich will man bei der Gottesmutter das halten, dessen Möglichkeit man bei den Geiern nicht in Abrede stellt? Ein Vogel gebiert ohne Männchen, und niemand widerspricht dem: und weil Maria als Verlobte geboren hat, stellt man ihre Keuschheit in Frage. Merken wir denn nicht, wie der Herr gerade im Naturleben eine Menge Analogien vorausgehen ließ, um durch dieselben das Schickliche seiner Menschwerdung zu beleuchten und deren Wahrheit zu beglaubigen?</p><p><strong>Wahl der Königin; natürliche Vorzüge prädestinieren sie dazu. Wie kein Volk respektiert das Bienenvolk seine Königin. Der Bienenstock ein Heerlager. Die Biene das Ideal der Arbeitsamkeit. Der Honig Genuß und Heilmittel. Die außergewöhnliche Fruchtbarkeit der Biene.</strong></p><p>Jetzt wohlan will ich mich über jene Vögel verbreiten, die sozusagen ein Staatswesen zu führen und diese Lebenszeit unter Gesetzen zuzubringen scheinen. Von ihnen nämlich stammt die Einrichtung im Staate, daß es für alle gemeinsame Gesetze gibt und dieselben in gemeinsamer Unterwürfigkeit beobachtet werden; daß alle ein Band bindet, daß nicht für den einen Rechtens ist, was der andere für unerlaubt nehmen soll, daß vielmehr, was erlaubt ist, allen erlaubt, was unerlaubt ist, allen unerlaubt ist; daß ferner alle gemeinsam den Vätern, durch deren Einsicht der Staat regiert wird, Hochachtung entgegenbringen, gemeinsam in einer Stadt zusammenwohnen, durch gemeinsame Umgangsformen sich gebunden fühlen, daß alle nur ein verpflichtendes Gesetz, ein Sinn beherrscht.</p><p>Das ist etwas Großes. Doch wie unvergleichlich Erhabeneres [haben wir] bei den Bienen! Sie besitzen allein unter jeglicher Art von lebenden Wesen eine allen gemeinsame Brut, bewohnen alle nur eine Behausung, leben innerhalb der Schwelle einer Heimstätte. Gemeinsam teilen sich alle in die Arbeit, gemeinsam teilen sie den Tisch, gemeinsam alle das Wirken,. gemeinsam Erwerb und Verdienst, gemeinsam das Schwärmen wozu mehr? gemeinsam alle den Ursprung. Auch die Unversehrtheit des jungfräulichen Leibes und der Zeugung ist allen gemeinsam; denn sie begatten sich gegenseitig nicht, frönen nicht weichlicher Lust, erleiden nicht Geburtswehen und setzen mit einem Mal einen zahllosen Schwarm junger Bienen ins Dasein, eine Brut, die sie „mit dem Munde aus Blüten und Blumen sogen“.</p><p>Sie selbst bestellen sich die Königin, sie selbst schaffen das Volk und bleiben, wenn auch der Königin untertan, doch frei; denn sie halten ebenso fest am Vorrecht ihrer Entscheidung [in der Königinwahl] wie an treuergebener Gesinnung, indem sie dieselbe als ihre Erkorene lieben und ein so gewaltiger Schwarm ehren. Nicht aber das Los bestimmt die Königin. Denn beim Los entscheidet der Zufall, nicht das Urteil, und häufig gibt das blinde Los, das fällt, jedem Letzten den Vorzug vor dem Besseren. Auch nicht der allgemeine Zuruf der unverständigen Menge bestimmt sie; denn diese wägt nicht die Tugendverdienste und erwägt nicht die Interessen des öffentlichen Wohles, sondern treibt in der Unverlässigkeit beweglichen Wankelmutes. Auch nicht kraft der Erbfolgeoder Geburtsrechtes hat sie den Königsthron inne; denn das dem öffentlichen Leben entrückte [Königskind] wird ja unmöglich die nötige Umsicht und Einsicht haben. Nimm dazu die Verhätschelungen und Genüsse, die im zarten Alter gewohnt, selbst den gewecktesten Geist zu entnerven pflegen; sodann den Unterricht der Eunuchen, die zumeist den Sinn des Königs mehr auf den eigenen Vorteil als auf das öffentliche Wohl hinlenken. Den Bienen indes wächst eine Königin heran, die schon durch natürliche Vorzüge deutlich als solche gekennzeichnet wird: so durch hervorragende Körpergröße und schönheit, ferner durch den Hauptvorzug an einem König, die Charaktermilde. Denn trägt sie auch einen Stachel, gebraucht sie ihn doch nicht zur Bestrafung. Es gibt nämlich Naturgesetze, die nicht auf Papier geschrieben, sondern dem sittlichen Bewußtsein eingegraben sind: darnach sollten die, welche die höchste Macht innehaben, in der Bestrafung besonders milde verfahren. Doch selbst jene Bienen, die den Anordnungen der Königin nicht folgen, überantworten sich selbst dem rächenden Strafgerichte: sie sterben vom eigenen Stachel getroffen. Das Perservolk soll heute noch an diesem Brauch festhalten, wonach Schuldige zur Sühne ihrer Tat selbst das Todesurteil an sich vollstrecken. Keine Völker nun, nicht die Perser trotz ihrer äußerst strengen Gesetze für die Untertanen, nicht die Inder, nicht die sarmatischen Stämme bringen ihrem König so große Ehrfurcht und Ergebenheit entgegen wie die Bienen: keine wagt das Haus zu verlassen, keine auf Weide zu ziehen, bevor nicht die Königin auszieht und die Führerrolle im Fluge übernimmt.</p><p>Der Zug aber bewegt sich über duftende Gefilde, wo „Gärten Blütenduft atmen“, wo ein flüchtiges Bächlein durch grüne Matten eilt, wo der Ufer Anmut grüßt: dort beginnt das heitere Spiel der Jugend, dort sammelt man sich im Freien, dort vergißt man der Sorgen. Die Arbeit selbst ist Genuß. Aus süßen Blüten und Kräutern werden zuerst die Grundfesten des Lagers gelegt: was wäre denn der Wabenbau anders als eine Art Lager? So bildet er denn auch den Wehrwall gegen die Drohnen. Und welches Lager im Gevierte könnte so künstlich und zierlich gebaut sein wie der Wabenstock, in welchem die kleinen runden Zellen durch die gegenseitige Verbindung einander stützen? Welcher Meister lehrte die Bienen diesen Zellenbau mit seinen ununterschiedlich gleichmäßigen Wandungen herstellen, das zarte Wachs im Inneren des Walles der Behausung anbringen, den Honig aufspeichern und die aus Blüten gewobenen Behälter wie mit Nektar voll füllen? Da kann man sehen, wie sie alle wetteifern im Dienste: die einen auf nimmer ruhender Nahrungssuche, andere in der sorglichen Bewachung des Lagers, wieder andere nach dem Ausschau nach dem Regen, der bevorsteht und in der Achtsamkeit auf die Wolken, die sich zusammenziehen, andere im Bau der Wachswaben aus Blütenstoff, andere im Sammeln des Blütentaues mit dem Munde, keine jedoch in hinterlistiger Aneignung fremder Arbeitsfrucht und räuberischem Erwerbe des Lebensunterhaltes. Daß nur sie keine räuberischen Nachstellungen gewärtigen müßten! Sie haben indes ihren Stachel und träufeln Gift in den Honig, wenn sie gereizt werden, und setzen vor brennendem Rachedurst beim Stiche das Leben ein. Inmitten der Lagerschanzen wird jener [Blüten] Tau ausgelassen, gerinnt, anfänglich flüssig, mit der Zeit allmählich zu Honig und beginnt aus geronnenem Wachs und Blütenduft dessen Süßigkeit auszuströmnen.</p><p>Mit Recht rühmt die Schrift die Biene als fleißige Arbeiterin, indem sie spricht: „Geh zur Biene und sieh, wie arbeitsam sie ist, ein wie ehrbares Gewerbe sie desgleichen treibt! Ihre Arbeit nutzen Könige und gewöhnliche Leute zur Wohlfahrt; denn begehrenswert ist dieselbe allen und wohlbekannt“. Du hörst, was der Prophet spricht. Er schickt dich schlecherdings hin, daß du dem Beispiele der Biene folgest, ihre Arbeitsamkeit nachamest. Du siehst, wie arbeitsam, wie beliebt sie ist. Alles verlangt und begehrt nach ihrer Frucht. Da gibt es keinen Personenunterschied, sondern unterschiedslos mundet ihre Gabe gleich köstlich den Königen wie den gewöhnlichen Leuten. Und dieselbe ist nicht bloß Genußmittel, sondern auch Heilmittel. Dem Gaumen mundet sie, und Wunden heilt sie, selbst innerem Wundweh träufelt sie Gesundung, Ist also die Biene auch schwach an Kraft, so doch stark an Weisheitsmacht und Tugendliebe.</p><p>Ihre Königin endlich schirmen sie aufs äußerste und für sie in den Tod zu gehen, dünkt ihnen schön. Solange die Königin am Leben ist, wissen sie nichts von Gesinnungswechsel und Sinnesänderung; verlieren sie dieselbe, dann ist’s vorüber mit der Treue im Dienste und plündern sie selbst den eigenen Honig, weil die Vorsteherin im Dienste tot ist.</p><p>Während nun andere Vögel zur Not einmal im Jahre Junge ausbrüten, bringen die Bienen zweimal solche hervor und übertreffen die übrigen um das Doppelte an Fruchtbarkeit.</p><p><strong>Ihre Verschiedenheit in Fußbildung, Halslänge, Gesang, Atmung usw.</strong></p><p>Erwägen wir jetzt den Sinn der Worte: „Es sollen hervorbringen die Wasser die kriechenden Tiere mit lebendiger Seele und die Vögel, daß sie fliegen über der Erde und an der Veste des Himmels“. Der Sinn von „über der Erde“ ist bestimmt: weil sie die Nahrung von der Erde beziehen. Wie ist aber „an der Veste des Himmels“ zu verstehen, da doch die Adler am höchsten unter den Vögeln fliegen und gleichwohl auch sie nicht „an der Veste des Himmels dahinfliegen“? Doch was wir lateinisch ‘caelum’[Himmel] nennen, heißt griechisch ‘ouranos’, ouranus aber kommt von ‘horasthai’ d.h. von „sichtbar sein“; weil nun die Luft durchsichtig und zum Sehen besonders klar ist, meinte die Schrift [oben] die in der Luft fliegenden Arten von lebenden Wesen. Auch die Wendung „an der Veste des Himmels“ darf nicht befremden; denn nicht im eigentlichen Sinn steht hier ‘Veste`, sondern im uneigentlichen, insofern im Vergleich zu jenner Äthersubstanz die Luft, die wir mit den Augen sehen können, gewissermaßen kompakt und dichter ist und darum für ’Himmelsveste’ steht.</p><p>Wir haben bis jetzt die Arten der Vögel, deren Natur und Vorzüglichkeit besprochen: freilich nur wenige Arten von den vielen; denn alle zu beschreiben, würde wegen ihrer Ähnlichkeit und Gleichartigkeit nur Zeitvergeudung sein. Indes wollen wir noch die Verschiedenheit ins Auge fassen, welche die Vögel unter sich aufweisen. So finden wir die Füße der Krähe gleichsam in auseinanderstehenden Krallen gespaltet und geteilt, wiederum anders des Raben und seiner Jungen. Füße von Natur gestaltet, die der fleischfressenden Vögel wie raubbereit gekrümmt und eingebogen; die Schwimmvögel hingegen haben breite Füße und die Zehen an den Füßen durch eine Art Haut miteinander verbunden. Auch darin offenbart sich eine wunderbare Zweckmäßigkeit der Natur, daß erstere Vögel die Füße als bequemen Behelf zum Auffliegen oder zum Nahrungsfang gebrauchen, letztere als passendes Hilfsmittel zum Schwimmen: sie können sich damit leichter über dem Wasser halten und mit ihren durch Anspannung der Haut sich weitenden Fußflächen wie mit Rudern gegen die Wasserflut stemmen.</p><p>Der Grund, warum der Schwan einen schlanken Hals trägt, liegt ebenfalls auf der Hand. Da er einen etwas schwerfälligen Körper hat und nicht so leicht in die Tiefe tauchen kann, braucht er nur den Hals nach der Beute ausstrecken, der flinker denn der übrige Körper die Nahrung, die er findet, wegrafft und aus der Tiefe heraufholt. Dazu kommt, daß durch den langgestreckten Hals hindurch sein Sang eine distinguiertere, darum lieblichere und wohltönendere Klangfarbe annimmt und, weil durch die längere Modulation reiner, weithin seinen Schall trägt.</p><p>Wie süßer Sang entringt sich nicht auch der Zikade kleiner Kehle! Mitten in der Sonnenhitze „durchschmettern ihre Weisen das Gestrauch“; denn zur heißen Mittagszeit zirpen sie am schönsten: je reinere Luft sie zu dieser Zeit einatmen, um so heller ertönen ihre Weisen.</p><p>Selbst der Bienen Summen entbehrt nicht des Lieblichen. Sie besitzen nämlich im surrenden Gesumme ihrer Stimme jenen annehmlichen, lieblichen Laut, den wir, spät genug, erstmals, wie es scheint, durch der Trompete gebrochenen Ton nachahmten, deren Dröhnen wie nichts anderes den Mut zu Kraft entflammt. Und unausgesetzt tönt ihr liebliches Singen, da sie keine Lunge und keine regelmäßige Atmungsfunktion besitzen, sondern den Lufthauch einschlürfen sollen. Eben darum gehen sie auch, wenn man sie mit Öl begießt, rasch ein, weil ihnen die Poren verstopft und damit die Möglichkeit jenes Einschlürfens benommen wird; gießt man ihnen aber sogleich Essig auf, leben sie sofort wieder auf, indem der Essig mit seiner ätzenden Flüssigkeit rasch die Poren, welche das dickflüssige Öl verstopft, öffnen soll.</p><p><strong>Ihre Metamorphose, wie der Farbwechsel des Chamäleons und des Hasen sowie der wiedererstehende Phönix Sinnbild und Beweis der Auferstehung. Der Geier als Totenvogel. Die Heuschrecke als Gottesgeißel, der Seleuzisvogel ihrer Plage Ende.</strong></p><p>Weil wir eben von den Vögeln reden, halten wir es nicht für unangebracht, das, was Geschichte oder Augenzeugenberichte über die Seidenraupe anführen, hereinzubeziehen. Es soll diese Hornraupe erst die Form eines Blattstieles und dessen natürliche Beschaffenheit annehmen, sodann mehr und mehr zur Puppe sich fortentwickeln. Aber auch diese Form und Gestalt behält sie nicht bei, sondern scheint aus losen und breiteren Blättern Flügel anzunehmen. Von diesen Blättern kämmen [die Raupen] jene weichlichen Seidengewebe ab, welche die Reichen ausschließlich nur zu ihrem Gebrauch sich anmaßten. Darum auch des Herrn Wort: „Was seid ihr hinausgegangen zu sehen? Einen Menschen mit weichlichen Kleidern angetan? Sieh, die weichliche Kleider tragen, sind an den Höfen der Könige“.</p><p>Auch das Chamäleon soll seine Farbe wechseln und sobald dieses, bald jenes Aussehnen vorspiegeln. Zweifellos sicher nehmen die Hasen, wie wir es aus unserer nächsten Nähe leicht beobachten können, im Winter eine weiße Farbe an, während sie im Sommer darauf zu ihrer eigentlichen Farbe zurückkehren</p><p>Dies streifte ich deshalb kurz, damit auch diese Beispiele uns im Glauben an jene Umwandlung bestärken möchten, welche bei der Auferstehung statthaben wird: jene Umwandlung meine ich, welche der Apostel mit den Worten deutlich zum Ausdruck brachte: „Alle zwar werden wir auferstehen, nicht alle aber verwandelt werden“. Und im folgenden: „Und die Toten werden unverweslich auferstehen, und wir werden verwandelt werden. Denn dieses Verwesliche muß anziehen die Unverweslichkeit, und dieses Sterbliche anziehen die Unsterblichkeit“. So manche nämlich sprechen sich über die Art und Weise dieser Verwandlung in einem Sinne aus, den sie nicht der Überlieferung entnehmen, und ließen es bei ihrem ungehörigen und eigenmächtigen Vorgehen keineswegs an ungebührlicher Anmaßung fehlen.</p><p>Der Vogel Phönix desgleichen soll sich in den Gegenden Arabiens aufhalten und sein langes Leben bis zu fünfhundert Jahren fristen. Wenn er nun sein Lebensende nahen sieht, bereitet er sich aus Weihrauch, Myrrhe und sonstigen wohlriechenden Gewürzen einen Sarg, worin er nach Ablauf seiner Lebenszeit eintritt und stirbt. Aus seinem modernden Fleische ersteht ein Würmlein, wächst mählich heran, bekommt im Laufe einer bestimmten Frist Flügel und nimmt von neuem die Gestalt und Form des früheren Vogels an. Möchte denn dieser Vogel, der ohne ein Vorbild zu haben und ohne die Bewandtnis dessen zu begreifen, sich selbst die Sinnbilder der Auferstehung zubereitet, wenigstens durch das Vorbild, das er selbst gibt, den Auferstehungsglauben lehren! Sind doch die Vögel des Menschen wegen da, nicht der Mensch um eines Vogels willen. Er sei uns sonach ein Vorbild dafür, daß der Urheber und Schöpfer der Vogelwelt seine Heiligen nicht für immer dem Untergang verfallen läßt: ließ er doch nicht einmal diesen einen Vogel untergehen, sondern wollte, daß er aus seinem eigenen Samen erstehe und forterhalten werde. [Oder] wer zeigt ihm den Todestag an, daß er sich den Sarg bereite, mit Gewürzen ihn fülle, in denselben trete und da sterbe, wo lieblicher Duft den üblen Leichengeruch zu absorbieren vermag?</p><p>So sarge auch du, o Mensch, dich ein! „Zieh den alten Menschen mit seinem Tun aus und zieh einen neuen an!“ Dein Sarg, deine Hülle ist Christus, der dich schützen und bergen mag an schlimmem Tag. Willst du’s vernehmen, daß er dir eine Schutzhülle ist? „In meinem Köcher“, versichert er, „schütze ich ihn“. Dein Sarg ist der Glaube. Fülle ihn mit den Wohlgerüchen deiner Tugenden, d.i. der Keuschheit, der Barmherzigkeit und der Gerechtigkeit, und tritt ganz ins Innere des Glaubenslebens ein, das vom süßen Wohlgeruch herrlicher Taten duftet! In diesen Glauben gehüllt, treffe dich die Stunde des Scheidens von diesem Leben, auf daß deine Gebeine mit Mark sich füllen und „wie ein wohlgetränkter Garten“ seien, der rasch in frischem Grün ersteht! Erkenn deinen Sterbetag, wie auch Paulus ihn kannte, da er beteuert: „Ich habe den guten Kampf gekämpft, den Lauf vollendet, den Glauben bewahrt: hinterlegt ist mir die Krone der Gerechtigkeit“. So also sargte Paulus wie ein guter Phönix sich ein und erfüllte seinen Sarg mit dem Wohlgeruche des Martyriums.</p><p>Ich will dich fragen, du aber antworte mir: Woher haben denn die Geier gewisse Zeichen, mit denen sie den Menschen den Tod anzumelden pflegen? Welches Anzeichen lehrt und leitet die vorgenannten Vögel an, daß sie, wenn feindliche Heere gegenseitig zu unseligem Kampf sich rüsten, in großer Schar folgen und damit zu erkennen geben, daß eine Menge Menschen als künftige Beute der Geier im Kampfe fallen werden? Traun, es scheint, als ob sie das nach Art menschlicher Schulung wie durch einen Vernunftschluß folgerten.</p><p>Selbst bis zur Heuschrecke erstreckte sich Gottes Huld. Überzieht dieselbe nämlich in dichtem Schwarm eine Gegend ihrer ganzen Ausdehnung nach, verhält sie sich vorerst ruhig darin ohne Schaden anzurichtebn und weidet keine Früchte ab, ungastlich darüber herfallend, es sei denn auf das Zeichen des göttlichen Befehles. Denn wie wir im Buche Exodus lesen, vollstreckt auch sie nur, eine Dienerin heiliger Rache, die Strafe für eine Beleidigung des Himmels.</p><p>Diese nun vertilgt der Seleuzisvogel so heißt dieser Vogel mit seinem griechischen Namen zur Abwendung des Unheils, das die Heuschrecke anzurichten pflegt. In seine Natur legte nämlich der Schöpfer einen unersättlichen Vertilgungstrieb, so daß er, nimmer satt sie aufzehrend, imstande ist, der obigen Plage ein Ende zu bereiten.</p><p><strong>Der Nachtigall Lied ihr süßer Trost in Wachen und Mühen. Die lichtscheue Nachteule das Bild der gottfremden Weltweisheit. Die Fledermaus. Der Hahnenruf nach seiner physischen, sittlichen und heilsgeschichtlichen Bedeutung.</strong></p><p>Doch was sehe ich da? Während wir den Vortrag in die Länge ziehen, sieh, da umkreisen doch schon die Nachtvögel und geben gerade dadurch, daß sie an den Schluß gemahnen, noch Anlaß, ihrer zu gedenken. Schon suchen die verschiedenen Vögel, die der Abend zwingt, der Nacht zu weichen, ihre Behausungen auf und verbergen sich in ihren Verstecken, den untergehenden Tag noch ein helles Lied weihend, daß er nicht ohne des Dankes Zoll scheide, den jedes Geschöpf lobpreisend seinem Schöpfer mitdarbringt.</p><p>Es hat auch die Nacht ihre Lieder, mit denen sie die Nachtwachen des Menschen zu versüßen pflegt. Es hat selbst die Nachteule ihre Weisen. Was soll ich aber erst von der Nachtigall sagen, der stets wachen Wächterin, die, während sie mit des Leibes Busen und Schoß über den Eiern brütet, über das schlaflose Mühen der langen Nacht mit ihrem lieblichen Sange sich tröstet? Es scheint mir ihre Hauptabsicht hierbei gerade die zu sein, die Bruteier womöglich nicht weniger mit ihren süßen Weisen denn mit ihrer Lebenswärme zu beseelen. Ihr hat es jene zarte, aber züchtige Frau abgelauscht, die mit ihrem Arm den geschärften Mühlstein dreht, daß es ihren Kleinen nicht an der Nahrung des Brotes gebrechen könne: mit nächtlichem Singen heitert sie sich die trübselige Stimmung über ihre Armut auf; und vermag sie es auch der Nachtigall nicht an lieblichen Sang gleichzutun, so doch an unermüdlicher Mutterliebe.</p><p>Die Nachteule wie merkt sie doch mit ihren großen blauen Augensternen nichts vom dunklen Schauer der nächtlichen Finsternis und betätigt gegen die Gepflogenheit der übrigen Vögel gerade im tiefsten Dunkel der Nacht am ungehindertsten ihren Flug, während mit Tagesanbruch ihr Blick vor dem rings ausgegossenen Sonnenlichte erblindet und gleichsam im Dunkel irrt! So erinnert ihr Verhalten deutlich daran, daß es Leute gibt, die, ob sie schon Augen haben zu sehen, nicht zu sehen pflegen und ihres Augenlichtes nur im Finstern sich bedienen. Von des Herzens Augen spreche ich. Die Weisen der Welt haben sie und sehen nicht; im Lichte schauen sie nichts; in der Finsternis wandeln sie, während sie über die Finsternis der Dämonen nachgrübeln und des Himmels Höhen zu schauen wähnen, die Welt mit dem Zirkel berechnend und selbst die Ausdehnung des Luftraumes bemessend. Schließlich aber verfallen sie, vom Glaubenspfade abgeirrt, trotz des Tages Christi und des Lichtes der Kirche, die ihnen aus nächster Nähe leuchten, der Finsternis ewiger Blindheit. Sie sehen nichts, nehmen aber den Mund voll als wären sie allwissend; scharsinnig in bezug auf das Vergängliche, stumpfsinnnig in bezug auf das Ewige, in der Gewundenheit ihrer langen Streitreden nur die Blindheit ihres Wissens verratend. Mit feinbeschwingten Worten wollen sie zum Fluge ausholen: da erlischt ihnen auch schon gleich der Nachteule das Auge im Lichte.</p><p>Die Fledermaus [vespertilio], ein unansehnliches Tierchen, hat ihren Namen vom Abendstern [vesper]. Sie hat Flügel und zugleich vier Füße und ist im Gebrauch von Zähnen, die man sonst bei Vögeln nicht zu treffen pflegt. Sie setzt wie die Vierfüßler statt der Eier lebendige Junge ins Dasein, fliegt aber nach Art der Vögel in der Luft, doch gewöhnlich erst zur Zeit der Abenddämmerung. Sie fliegt aber nicht mittels Fittichen irgendwelcher Art, sondern mittels ihrer Flughaut. Von dieser wie von Flugfedern in Schwebe gehalten, fliegt und flattert sie herum. Auch das ist diesem unscheinbaren Tierchen eigen: daß sie sich aneinander heften und gleich einer Traube an irgendeiner Stelle hängen, und der ganze Knäuel sich erst auflöst, wenn je die äußerste sich davon losmacht. Es ist dies das Gebaren einer Liebe, wie sie kaum bei den Menschen auf dieser Welt zu treffen ist.</p><p>Lieblich ist auch der Hahnenruf in der Nacht nicht bloß lieblich, sondern auch nützlich. Ein guter Hausgenosse weckt er den Schlummernden, mahnt den Wachenden, tröstet den Wandernden, indem er mit hellklingendem Signale es binausruft: die Nacht ist vorgeschritten. Auf seinen Ruf läßt der Räuber von seinen Nachstellungen: durch ihn läßt selbst der Morgenstern sich wecken und geht auf und erhellt den Himmel. Auf seinen Ruf vergißt der zagende Schiffer der Niedergeschlagenheit, und legt sich aller Wind und Sturm, den sie Abendlüfte häufig anfachen. Auf seinen Ruf erhebt der Frommsinn sich hurtig zum Gebet und geht von neuem an die Übung der [Schrift]Lesung. Auf seinen letzten Ruf wusch selbst der Fels der Kirche [Petrus] seine Schuld ab, die er begangen, ehe der Hahn krähte. Auf seinen Ruf schöpft alles von neuem Hoffnung, des Kranken Schmerz läßt nach, sein Wundweh lindert sich, die Fieberhitze geht zurück, Gefallenen kehrt der Glaube wieder, Strauchelnde trifft Jesu Blick, Irrende führt er auf rechten Pfad. So traf sein Blick den Petrus, und sogleich wich die Verirrung, ward abgetan die Verleugnung, folgte das Bekenntnis. Daß dies nicht zufällig so kam, sondern gemäß dem Ausspruche des Herrn, lehrt die Schriftlesung; denn also, steht geschrieben, sprach Jesus zu Simon: „Es wird der Hahn nicht krähen, bevor du mich dreimal verleugnest“. Richtig: bei Tag ist Petrus standhaft, in der Nacht läßt er sich einschüchtern und fällt vor dem Hahnenruf und fällt schon zum dritten Mal. Man sieht daraus, daß sein Fall nicht in einer unüberlegten Äußerung beim Reden bestand, sondern daß seine Einschüchterung ihren Grund auch im Schwanken des Geistes hatte. Derselbe Petrus indes erstarkt nach dem Hahnenruf, nunmehr würdig, daß der Herr ihn anblickte; denn „die Augen des Herrn ruhen auf den Gerechten“. Er erkannte, da0 das Heil nahte, das ein fernes Irren ausschloß, wandte sich vom Irrtum der Tugend zu und fing „bitterlich zu weinen “ an, um mit seinen Tränen den Irrtum abzuwaschen.</p><p>Blicke auch uns an, Herr Jesus, daß auch wir unsere Fehler einsehen, mit frommen Zähren die Schuld tilgen und des Sündennachlasses uns würdig machen! Wir haben deshalb absichtlich die Predigt in die Länge gezogen. daß auch uns der Hahnenruf ertöne und dem Prediger dazu verhelfe, daß Du, Christus, die Schuld ihm vergebest, wenn etwa Mangelhaftigkeit in sein Wort sich eingeschlichen hat. Geb mit doch die Tränen des Petrus, ich will nicht die Freude des Sünders! Die Hebräer weinten, und die Flut teilte sich, und sie zogen befreit durch das Meer; Pharao freute sich, daß er die Hebräer eingeschlossen in seiner Gewalt hatte, und er ward ins Meer versenkt und ging samt seinem Volke unter. Auch Judas freute sich des Lohnes für seinen Verrat, doch gerade mit diesem seinem Lohne erwarb er den Strick, mit dem er sich aufknüpfte. Petrus beweinte seine Verirrung und verdiente die Gnade, anderer Verirrungen zu tilgen.</p><p>Doch schon ist da die Zeit, da wir den Vortrag endigen und schließen müssen; es ist da die Zeit, da man besser schweigt und weint; es ist da die Zeit, da die Feier des Sündennachlasses statthat. Es lasse uns der Herr im mystischen Sinn [Christus] auch bei der heiligen Handlung seine Stimme vernehmen, nachdem in unserem Vortrage Prtri Hahn sie hat erschallen lassen! Es flehe Petrus mit Tränen für uns, der so heilsam sie für sich vergossen, und wende Christi heiliges Angesicht uns zu! Schleunig nahe des Herrn Jesu Leidenstod, der täglich unsere Sünden vergibt und die Gnade des Nachlasses bewirkt.</p><p>Der Herr in seiner Güte will niemand ungespeist entlassen, daß keiner auf dem Wege erliege. Wenn er spricht: „Mich erbarmt dieses Volkes, denn drei Tage sind es, daß sie bei mir ausharren und nichts zu essen haben, und ich will sie nicht ungespeist entlassen, damit sie nicht auf dem Wege erliegen!“ seinem Worte lauschend hat auch Maria die Zubereitung des Mahles verschmäht: wieviel mehr müssen wir bedenken, daß es nicht viele sind, die im Worte Gottes leben, und daß darum das Verlangen nach leiblicher Erquickung sich regt? Gewiß, eine größere Anforderung als jenes Triduum stellt dieses unser Postridie.</p><p>So laßt uns denn jetzt, nachdem wir der Vögel heiteres Lied mitgesungen, in den Hahnenruf miteingestimmt haben, des Herrn Geheimnisse singen! Bei Jesu Leib sollen sich einfinden die Adler, verjüngt durch die Reinigung von den Sünden! Denn schon hat uns jener große Walfisch den wahren Jonas [Christus] an das Land getragen. Und freuen wollen wir uns, daß es für uns Abend geworden ist: und Morgen soll es werden der sechste Tag!</p><h2>6</h2><p><strong>der Prediger ein geistiger Ringkämpfer, der Siegespreis in der Hand der Zuhörer. Der Mensch die Krone der Schöpfung.</strong></p><p>Der sechste [Schöpfungstag] ist dieser heutige. An ihm findet die Entstehung der Weltschöpfung ihren Abschluß und darum auch unser Predigtwort über den Ursprung der Dinge sein Ende. Obwohl dasselbe schon während der vorausgehenden fünf Tage uns nicht geringe Mühe kostete, erheischt es am heutigen Tage noch eines größeren Kapitals an Sorgfalt; denn er bringt einerseits das Risiko der vorausgehenden Tage, andrerseuts die Entscheidung des ganzen Ringens. Schon bei den Wettspielen in Saitenspiel oder Sang und bei den Ringkämpfen der Athleten verlaufen die vorausgehenden Tage, mögen die Spiele noch so häufig und hitzig sein, ohne allen Verlust der Siegeskrone, der letzte Tag aber entscheidet über die Krone, führt mit sich das Risiko der Entscheidung: für den Unterliegenden Schande, für den Obsiegenden Preis. Wie unvergleichlich größere Besorgnis ängstigt uns in diesem so heißen Kampf der Weisheit, so entscheidenden Urteil nicht weniger, sondern der Gesamtheit, da uns heute gleichsam des Kampfes Krone zufallen soll [die Besorgnis], wir möchten die Mühe der vorausgehenden Tage noch vereiteln und am heutigen der Beschämung entgegengehen. Denn nicht in der gleichen Lage befindet sich der Redner wie der Sänger und Athlet: diese riskieren nur ein Spiel, das anstoßen mag, jener Todesverderben. Hier hat der Fehler, den man macht, nur Mißfallen bei den Zuschauern, dort aber Schaden für die Zuhörer im Gefolge.</p><p>So tretet denn an mich heran als Preisrichter über die Krone und tretet mit mir ein in diese große und wunderbare Schaubühne der ganzen sichtbaren Schöpfung! Denn wenn schon jemand fremden Gästen, von deren Ankunft er hört, nicht geringe Aufmerksamkeit erweist, indem er sie in der ganzen Stadt herumführt und ihnen alle berühmteren Sehenswürdigkeiten zeigt, wieviel weniger dürft ihr es euch verdrießen lassen, wenn ich euch bei dieser gemeinschaftlichen Zusammenkunft gleichsam an der Hand meines Vortrages auf dem heimischen Boden [der Schöpfung] herumführe und euch die Arten und Gattungen der einzelnen Dinge aufzeige, vom Wunsche beseelt, aus all dem den Beweis zu erbringen, wie gerade euch der Schöpfer des Alls die reichste Ausstattung von allen Wesen verliehen hat. Euch winkt sonach jene Siegeskrone, euch wünsche ich heute euerem eigenen Schiedsspruch gemäß zu kränzen. Denn nicht verlangt es uns nach Art der Ringkämpfer nach Kränzen, die verwelken, sondern nach dem Immergrün des Schiedsspruches euerer Heiligkeit, demgemäß euere Entscheidung lautet: Durch alle Geschöpfe zwar waltet Gottes Vorsehung, doch nur ihr besteht, mögt ihr mit allen andern die Gebrechlichkeit des Leibes teilken, vor allen anderen aus des Geistes Kraft, die allein mit den übrigen nichts gemein hat.</p><p><strong>Der mosaische Schöpfungsbericht dient nicht wie die Weltweisheit dem Vorwitz, sondern der religiös-sittlichen Förderung des Menschen.</strong></p><p>Jetzt wohlan laßt uns von der Natur der Tiere und der Entstehung des Menschen sprechen. Schon längst höre ich ja schon einige raunen und sagen; Wie lange noch bekommen wir über fremde Dinge zu hören und bleiben über die eigenen in Unwissenheit? Wie lange noch werden wir in die Kenntnis der übrigen lebenden Wesen eingeführt und bleiben über uns selbst in Unkenntnis? Die Klage ist berechtigt doch ist die Reihenfolge einzuhalten, welche der Schrifttext vorzeichnet, zumal ein tieferes Verständnis unserer selbst die Kenntnis von der Natur aller lebenden Wesen zur notwendigen Voraussetzung hat.</p><p>„Es bringe die Erde hervor lebendige Wesen nach ihrer Art, die Vierfüßer und die Schlangen und die [wilden] Tiere der Erde und das [zahme] Vieh nach seiner Art und alles Gewürm nach seiner Art. Und es schuf Gott die Tiere der Erde und alles Vieh nach seiner Art und alles Gewürm der Erde nach seiner Art. Und Gott sah, daß es gut war. Und es sprach Gott: Laßt uns den Menschen machen.“ Es entgeht mir nicht, daß an dieser Stelle einige die Arten der Tiere, des Viehs und des Gewürms der Erde dahin deuten, daß sie dieselben auf das Unmenschliche der Verbrechen, auf die Unvernünftigkeit der Sünden und die Nichtsnutzigkeit der Gedanken bezogen: ich hingegen verstehe darunter die [physische] Natur einer jeglichen Art im gewöhnlichen Sinn.</p><p>Ich fürchte nicht, daß man mich mit dem Unterfangen eines armseligen Gastgebers in Zusammenhalt bringen zu sollen glaubt, der aus Menschenfreundlichkeit eine größere Zahl von Gästen zu sich bittet und denselben nur gewöhnliche Alltagsspeisen vorsetzt, so daß er ob des knapp zubereiteten, ärmlichen Tisches mehr Tadel von den verdrießlichen Gästen als Dank ob seiner gastlichen Gesinnung erntet; denn auch den Elisäus haben die Freunde, da er ihnen nur Feldkräuter vorsetzten ließ, nicht als schlechten Gastgeber abgewiesen.</p><p>Den nichtigen Schriftdeutungen gleicht jenes exquisite und raffiniert feine Mahl, bei welchem Fasan oder Turtel, mit Huhn als Einlage, aufgetragen oder Huhn, mit Austern oder Kammuschel garniert, serviert oder verschnittener, in Geschmack wie in Farbe und Bukett veränderter Wein getrunken wird. Festlandserzeugnisse bilden das Gefüllsel maritimer Genüsse, maritime das der festländischen: das heißt doch die Vorsehung des Schöpfers, der uns alles zum Lebensunterhalte dargeboten, tadeln, daß sie uns dieselbe nicht gleich vermischt dargereicht hat. Doch ein solches Mahl schmeckt anfänglich süß und nachher bitter; denn je üppiger die Völlerei, desto schlimmer die Folgen der Unmäßigkeit. Elisäus hingegen ließ bittere Kräuter auftragen, doch nachher mundeten sie süß. So fanden denn die Genossen, die anfänglich in jener Speise den Tod befürchteten, nachher süße Labe und Lebensgenuß darin.</p><p>Auch das hinwiederum besorge ich nicht, daß ich mehr Gäste zum Mahle geladen zu haben scheine, als ich bewirten kann, und daß euch das Brot meiner Worte ausgehen möchte. Denn auch Elisäus, an Verdienst zwar unnachahmlich, an Glauben aber unser nachzuahmendes Vorbild, erwog nicht lange, wie viele Brote er habe, sondern wollte die, welche er hatte, an alle verteilen und vertraute, daß sie für alle reichen würden. So hieß er also den Diener die zehn Gerstenbrote unter das Volk verteilen. Und der Diener versetzte: „Wozu soll ich das reichen angesichts der hundert Leute?“ Und er erwiderte: „Reiche es und essen sollen sie; denn dies spricht der Herr: sie werden essen und übrig lassen“. Euer Glaube also wird der armseligen Zunge Mahl überzeichlich mehren.</p><p>Auch fürchte ich nicht, daß euch das Fasten allzu große Gier nach Speise weckt; denn satt sollt ihr heimkehren, ob ihr auch Hunger und Leere verspürt, indem geschrieben steht: „Es stärkt der Herr die Gerechten und in den Tagen des Hungers werden sie gesättigt werden.“ Viel schöner ferner ist’s, der Gerstenbrote sich nicht zu genieren und, was man hat, vorzusetzen statt es vorzuenthalten. Elisäus, der für sich nichts zurückbehielt, verfügte über mehr denn genug für das Volk.</p><p>Elisäus schämte sich nicht, gewöhnliche Gerstenbrote vorzusetzen. wir sollten uns schämen, gewöhnliche Geschöpfe zu verstehen, die mit dem gewöhnlichen Namen, den sie tragen, bezeichnet werden? ‘Himmel’ lesen wir, den Himmel wollen wir annehmen: ’Erde ’lesen wir, die fruchttragende Erde wollen wir verstehen.</p><p>Was frommt es mir, den Umfang der Erde zu bemessen, den die Geometer auf hundertachtzigtausen Städten berechnet haben? Gerne gestehe ich in dem, was ich nicht weiß, meine Unwissenheit, oder vielmehr mein Wissen, wie wertlos solches Wissen für die Zukunft ist. Besser ist die Kenntnis über die Dinge auf Erden als über deren Ausdehnung. Wie könnten wir diese messen, nachdem ringsum das Meer wogt, der Barbaren Länder dazwischen sich erstrecken und wasserunterspülter, unzugänglicher Sumpfboden? Das MenschenUnmögliche dessen bezeugt die Schrift, indem Gott spricht: „Wer maß mit der Hand das Wasser und mit der Spanne den Himmel! und mit der geschlossen Hand die gesamte Erde? Wer stellte die Berge hin nach dem Gewichte und die Felsen nach der Wage und die Haine nach dem Joche?“ Und im folgenden: „Er hält den Erdkreis und dessen Bewohner wie Heuschrecken, er festigte den Himmel wie ein Gewölbe“. Wer also darf es wagen, sich ein Wissen gleich Gott anzumaßen? Wie der Mensch zum kühnen Wahn sich versteigen, es sei seinem Wissen erreichbar, was Gott durch einen eigenen Ausspruch als Vorrecht seiner Majestät bezeichnete?</p><p>Fürwahr Moses war mit der ganzen Weisheit der Ägypter vertraut; doch da er den Geist Gottes empfangen, stellte er als Diener Gottes jene eitle und anmaßende Lehre der Philosophie dem höheren Wahrheitszweck nach und schrieb mir nur das nieder, was ihm für unsere [Heils]Hoffnung förderlich dünkte: daß Gott die Erde schuf, daß die Erde auf Geheiß des allmächtigen Gottes und die Wirksamkeit des Herrn Jesus die Pflanzen aus dem Boden und jegliches lebende Wesen nach seiner Art hervorbrachte. Doch darüber glaubte er nicht sprechen zu sollen, wieviel Luftraum der Erdschatten bedeckte, wenn die Sonne von uns scheidet und den Tag entführt um die untere Hemisphäre zu beleuchten; ferner wie sich die Mondfinsternis erklärt, wenn der Mond dieser Welt gegenübersteht. Denn da diese Vorgänge uns nichts angehen, überging er sie als belanglos für uns. Er schaute im Heiligen Geiste, wie er nicht den Eitelkeiten der bereits verblassenden Weltweisheit, die unseren Geist mit unentwirrbaren Problemen beschäftigen und seiner Anstrengung spotten, folgen, sondern lieber das niederschreiben soll, was den Tugendfortschritt beträfe.</p><p><strong>Das Tier an äußerer Gestalt wie innerem Gelüste erdwärts gerichtet zum Niedrigen, der Mensch aufwärts zum Höheren. Der faule Esel, der tückische Fuchs. der hinterlistige Kiebitz, der stolze Löwe, der gefleckte Panther als abschreckende Beispiele.</strong></p><p>Halten wir uns denn streng an den prophetischen Wortlaut und mißachten wir die Aussprüche des Heiligen Geistes nicht als etwas Nichtssagendes! „Es bringe die Erde hervor“, heißt es, „die lebendigen Wesen des Viehes und der Tiere und des Gewürmes“. Wie dürften wir da anderes herauslesen, wo doch klar von der natürlichen Entstehung der Tiere des Festlandes die Rede ist? Es geht im Augenblick der Weltentstehung Gottes Wort durch die ganze Schöpfung: mit einem Mal sollten alle Arten von Tieren, wie Gott sie bestimmte, aus der Erde hervorkommen und kraft eines Gesetzes künftighin nach ihrer Art und Ähnlichkeit sich fortpflanzen: der Löwe sollte einen Löwen, der Tieger einen Tieger, das Rind ein Rind, der Schwan einen Schwan, der Adler einen Adler erzeugen. Der einmal ergangene Befehl ward zum dauernden Naturgesetz. Darum hört die Erde nicht auf, ihres Dienstes willfährig zu walten, so daß die ursprünglichen Tierarten in steter Geschlechtsfolge sich neu verjüngen.</p><p>Doch willst du [die Tiere], die ins Dasein gesetzt wurden, mit dem Menschen in Vergleich setzen? Verkenne die wahre Natur, die jeder Art eignet, nicht, und dein Vergleich wird noch in viel höherem Grade zugunsten des Menschen ausfallen! Denn vor allem hat die Natur alle Arten von Vieh und Getier und Fischen auf den Bauch gestreckt, die einen schlängeln sich auf dem Bauch, die anderen, die auf Füßen gehen, zieht es beim Gehen auf den Vieren statt frei aufwärts vielmehr abwärts: sie haften gleichsam am Boden, suchen sie doch, außerstande sich emporzurichten, ihre Nahrung auf dem Boden und frönen allein nur den Genüssen des Bauches, zu dem es sie niederzieht. Hüte dich, o Mensch, nach Art der Tiere dich [zur Erde] zu beugen! Hüte dich, nicht so sehr dem Leibe denn der Begierde nach zum Bauche dich zu erniedrigen! Denk an deines Leibes Gestalt und nimm dementsprechend auch geistig die Richtung nach der Höhe! Laß allein das Tier zur Erde gerichtet dem Genusse nachhängen! Warum willst du dich in Völlerei auf den Bauch werfen, da doch die Natur dich nicht auf den Bauch gestreckt hat? Warum an dem dich ergötzen, was die Natur schändet? Warum Tag und Nacht auf das Essen bedacht nach Art der Tiere am Irdischen dich weiden? Warum den fleischlichen Lüsten hingegeben dich selbst entehren, indem du dem Bauche und seinen Lastern frönst? Warum dich deines Verstandes berauben, den dir der Schöpfer gegeben? Warum dich auf gleiche Stufe mit dem Tiere stellen, von dem dich Gott unterschieden wissen will, indem er mahnt: „Werdet nicht wie Roß und Maultier, die keinen Verstand haben“? Oder macht dir die Gefräßigkeit und Geilheit eines Gaules Vergnügen, Weibern zuzuwiehern Lust, mag es dir auch Vergnügen bereiten, daß „Gebiß und Zaum deine Backen schnüren!“. Macht die Grausamkeit Ergötzen Raubtieren, die man wegen ihrer Blutgier erschlägt, eignet solches Wüten, so sieh zu, da0 nicht auch bei dir unmenschliche Grausamkeit den eigenen Herrn schlägt!</p><p>Der faule Esel, so leicht ein Opfer der Beutegier und allzu langesamer Sinnesart: wozu anders gemahnt er als zur Pflicht, uns reger zu betätigen, nicht körperlicher und geistiger Trägheit zu verfallen, unsere Zuflucht zum Glauben zu nehmen, der die drückenden Lasten zu erleichtern pflegt.</p><p>Der heimtückische Fuchs, der sich tief in Höhlen und Verstecken vergräbt: verrät er sich nicht damit als ein nichtsnutziges, ob reiner Raubgier hassenswertes, ob seiner Hilflosigkeit verächtliches Tier, das leichtsinnig sein eigenes Leben gefährdet, während es fremdem nachstellt?</p><p>Der hinterlistige Kiebitz raubt fremde, d.i. eines anderen Kiebitzes Eier und brütet sie mit seinem Leibe aus, kann aber von seinem Truge keine Frucht ernten; denn sobald er seine Jungen ausschlüpfen läßt, verliert er sie. Sobald nämlich diese den Lockruf jenes Kiebitzes hören, der die Eier legte, verlassen sie ihn und eilen von einem gewissen natürlichen Instinkt und Trieb geleitet, zu jenem; denn in diesem erkennen sie ihre Mutter, von der die Eier stammen. Sie geben damit zu verstehen, daß jener andere ihnen nur Ammendienst, dieser Mutterdienst leistete. Umsonst also vergeudet jener seine Mühen und findet die verdiente Strafe für seinen Trug. Darum auch des Jeremias Ausspruch: „Es schreit der Kiebitz und sammelt, was er nicht erzeugte“, d.i. er sammelt Eier und schreit gleichsam voll Jubel über das Gelingen seines Truges. Doch eitle Freude! Denn die Mühe, die er aufwendet, gilt einem anderen; ihm zieht er die Küchlein auf, die er in langem, emsigen Brüten beseelte. Sein Nachäffer ist der Teufel. Auch er trachtet die Erzeugnisse des ewigen Schöpfers zu ergattern. Und ob es ihm auch gelingt, manche Toren, denen es an eigener geistiger Mündigkeit fehlt, um sich zu sammeln, mit fleischlichen Lüsten sie hegend:sobald der Ruf Christi an die Kleinen ergeht,entfliehen sie und eilen zur Mutter [Kirche], die ihre Kinder wie ein Vogel mit mütterlicher Liebe umfängt. Es sammelte der Teufel die Heiden, die er nicht erschaffen hatte. Doch sobald Christus in seinem Evangelium die Stimme erhob, da eilten sie flugs zu ihm, und er nahm sie unter den Schatten seiner Fittiche und übergab sie der Mutter Kirche zur Aufziehung.</p><p>Der Löwe, stolz auf die unbändige Kraft seiner Natur, mengt sich nimmer unter die übrigen wilden Tiere, hält vielmehr als deren König das Zusammenleben mit dem Haufen unter seiner Würde. Er verschmäht ferner Speisen vom Vortag, rührt selbst Speisereste, die er selbst erübrigte, nicht mehr an. Welches Wild aber getraute sich in seine Nähe? Wohnt doch seiner Stimme von Natur eine so fürchterliche Gewalt inne, daß viele Tiere, die sich wegen ihrer Geschwindigkeit vor seinem Raubanfalle retten könnten, vom Donner seines Gebrülles wie vom Schlage betäubt und getroffen, die Möglichkeit hierzu verlieren.</p><p>Was das Äußere des Panthers betrifft, hat ja selbst die Schrift die Tatsache nicht stillschweigend übergangen, daß er durch seine bunt wechselnden Farben nur den Wechsel seiner inneren Regungen verrate. So fragt Jeremias, „ob der Mohr seine Haut und der Panther seine Flecken ändern wird?“ Diese Frage nämlich ist nicht bloß vom Äußeren, sondern auch von der Unbeständigkeit der [inneren] Wildheit zu verstehen. Durch die der Finsternis zugewandte, ruhelose und veränderliche Wankelmütigkeit seiner untzuverlässigen geistigen Gesinnung entartet, ist nämlich das Judenvolk nicht mehr imstande, die Gnade eines guten Vorsatzes festzuhalten und den Rückweg zur Umkehr und Besserung zu finden, nachdem es einmal unmenschliche, tierische Gesinnung angenommen hat.</p><p><strong>die Arbeitsamkeit der Ameisen, die Treue des Hundes, die Kindesliebe des Bären. Der wunderbare Instinkt der Tiere: kranke Tiere (Bär, Schlange, Schildkröte, Fuchs) kennen ihre Arznei. Tiere (Schwalbe, Ameise, Schaf, Igel) als Wetterpropheten. Sicherheit des Tierinstinktes. Die Natur die beste Lehrerin, die selbst die wilde Bestie (Tigerin) zur zärtlichsten Mutter wandelt. Der Spürsinn des Hundes; der Hund als Wächter und Rächer seines Herrn. Das Lamm das Bild der Kindesunschuld, seine Anhänglichkeit an das Mutterschaf. Der Tierinstinkt äußert seine Funktionen vom ersten Dasein an. Der Knoblauch nicht Speise, sondern Medizin; die beste Medizin das Fasten. Der feine Instinkt selbst kleiner Tiere.</strong></p><p>Es weist auch die Natur der Vierfüßer Züge auf, die uns das prophetische [Schrift] Wort zur Nachahmung ans Herz legt. So sollen wir uns nach ihrem Beispiel vor Müßiggang hüten, durch die Schmächtigkeit oder Schwächlichkeit des Leibes nicht im Tugendstreben beirren, durch die Größe solches Vorhabens nicht abschrecken lassen. Schmächtig ist die Ameise und doch wagt sie sich an Dinge, die ihre Kräfte übersteigen. Nicht Dienstbarkeit zwingt sie zur Arbeit, sondern freiwillig nimmt sie sich vor, sich vorzusehen und die nötigen Nahrungsmittel für die Zukunft sich vorauszubeschaffen. Zur Nachahmung ihrer Arbeitsamkeit mahnt darum die Schrift mit den Worten: „Geh hin zur Ameise, du Fauler, und ahme ihre Wege nach und sei weiser denn sie“. Sie treibt keinen Feldbau, hat niemand, der sie antreiben könnte, steht unter keines Herrn Gewalt und doch, wie sorgt sie für Nahrung vor, indem sie von deiner Hände Arbeit sich Erntevorrat zurücklegt! Und während du vielfach in Not lebst, darbt sie nicht. Keine Scheunen sind ihr verschlossen, keine Speicher unzugänglich, keine Vorräte unantastbar. Der Wächter sieht es und wagt es nicht, die Entwendungen hintanzuhalten, der Besitzer merkt seine Benachteiligungen und schreitet nicht ein. In Schwarzem Zug wird die Beute durchs Freie fortgeschleppt. Es wimmeln die Wege von der daherziehenden Karawane. Die großen Körner, die der kleine Rüssel nicht fassen kann. werden auf den Schultern fortgeschafft. Das sieht der Herr der Ernte und er würde sich schämen, der liebevollen Erwerbstätigkeit so kargen Ertrag vorzuenthalten.</p><p>Was soll ich aber von den Hunden sagen, denen die Dienstgefälligkeit und die ängstliche Wachsamkeit über die Wohlfahrt ihres Herrn gleichsam angeboren ist? Darum der Vorwurf der Schrift gegenüber den Pflichtvergessenen, Nachlässigen und Feiglingen: „Stumme Hunde, die nicht zu bellen verstehen!“ Zu einem Hunde also gehört, daß er zum Schutze seines Herrn zu bellen, daß er dessen Haus zu behüten weiß. So lerne denn auch du deine Stimme für Christus erheben, wenn gefährliche Wölfe in die Hürde Christi einbrechen! Lerne das Wort in deinem Munde bewahren, daß du nicht, ein stummer Hund, durch sündhaftes Schweigen der dir anvertrauten Glaubenshut untreu geworden zu sein scheinest!</p><p>Ein solcher [treuer] Hund ist Weggefährte und Begleiter eines Engels. Nicht umsonst glaubte nämlich Raphael im prophetischen Buche [Tobias], ihn zu seinem und des Tobias’Sohnes Schutz mitführen zu sollen, da er sich auf den Weg machte, den Asmodäus zu vertreiben und der Ehe [des Tobias] festen Bestand zu sichern. Dankbares Gedenken führte zur Austreibung des Dämons und zur Festigung der Ehe. Mit dem Hinweis auf das Verhalten des stummen Tieres leitete der heilige Engel Raphael das Herz des jungen Tobias, seines Schutzbefohlenen, zur Dankbarkeit an. Wer auch würde sich nicht schämen, gegen seine Wohltäter undankbar zu sein, wenn er selbst die Tiere eines Undankbaren Laster fliehen sieht? Sie bleiben der Speise eingedenk, die man ihnen reicht: du willst des empfangenen Heiles nicht eingedenk sein?</p><p>Der Bär, ein Auflauerer zwar, wie die Schrift sich ausdrückt er ist ja ein Tier voll Hinterlist, soll seine Leibesfrucht unausgestaltet zur Welt bringen, doch nach der Geburt mit der Zunge formen und nach seinem Bilde und Gleichnis gestalten. Muß nicht an diesem wilden Tiere der zärtliche Liebesdienst, den es mit dem Rachen zur Ausformung der Natur leistet, zur Bewunderung fortreißen? Der Bär formt seine Jungen sich gleichgestaltig: du solltest außerstande sein, dir gleichartige Kinder heranzubilden?</p><p>Noch mehr. Sogar das Studium der Heilkunde versäumte er nicht. Versteht er doch, vom schweren Todesgeschoß getroffen und von Wunden bedeckt, sich dadurch zu helfen, daß er die Wundstellen unter ein Kraut, das Flomiskraut, wie die Griechen es heißen, hält, um durch die bloße Berührung damit zu genesen. Auch die Schlange vertreibt durch Genuß von Fenchel die Blindheit, von der sie befallen ist. Sobald sie merkt, daß ihre Augen sich verschleiern, sucht sie nach dem wohlbekannten Heilkraut und wird von dessen Wirkung nicht enttäuscht. Die Schildkröte gebraucht, wenn sie nach dem Genusse von Natternfleisch des schleichenden Giftes in sich gewahr wird, Dosten als Heilmittel zur Rettung. Steckt sie noch so tief im Sumpfschlamme, kennt sie doch das Gegengift, das sie zur Heilung anwenden muß, und beweist damit, daß auch sie um die Heilkräfte der Kräuter als sicheres Genesungssmittel weiß. Auch den Fuchs kann man beobachten, wie er mit Fichtenharz sich heilt und die Zeit des Todes, der ihm schon bevorstand, hinausschiebt.</p><p>Der Herr selbst ruft im Buche des Jeremias: „Turtel und Schwalbe und des Feldes Sperlinge halten die Zeit ihres Kommens ein, mein Volk aber kennt nicht die Bestimmungen des Herrn“. Es weiß die Schwalbe, wann sie zu kommen, wann sie zurückzukehren hat; es weiß der fromme Vogel desgleichen mit seiner Ankunft den Frühling anzuzeigen. Es weiß auch die Ameise auszukundschaften, wann heitere Zeiten einfallen; denn merkt sie, daß ihre Früchte vom Regen benetzt, feucht geworden sind, öffnet sie erst dann, wenn auf Grund genauerer Beobachtungen die Luft andauernd schönes Wetter verspricht, ihre Vorräte und trägt sie auf dem Rücken aus den Kammern heraus, um ihr Getreide unter dem anhaltenden Sonnenschein trocknen zu lassen. So wird man denn schwerlich während aller jener Tage jemals Regenschauer aus den Wolken brechen sehen, bis nicht die Ameise ihre Früchte wiederum in ihre Vorratskammern verbracht hat. Die Rinder wissen bei bevorstehendem Regen an den Hürden sich zu halten. Ebenso lugen sie alle auf gleiche Weise, sobald sie mit ihrem natürlichen Instinkt den Witterungsumschlag am Himmel fühlen, aus und strecken ihren Hals über die Hürden hinaus um anzudeuten, daß sie ins Freie möchten. Das Schaf rafft beim Nahen des Winters mit unstillbarer Freßgier nimmer satt Gras ab; es ahnt voraus, daß es ihm zur rauhen Winterszeit daran gebrechen werde, so daß es sich zuvor noch mit Grünfutter sattfrist, bevor alles Grün vor dem versengenden Froste abstirbt. Der Landigel, im Volksmund Iricus genannt, schließt sich, wenn er irgendwie Nachstellungen wittert, in seine Stacheln ein und sucht Deckung hinter seiner eigenen Waffenwehr, so daß, wer immer ihn berühren zu sollen glaubt, sich verwundet. Der gleiche Igel verschanzt sich auch in der Vorahnung des Zukünftigen die beiden Luftzugänge: Wittert er Nordwind, verrammelt er den nördlichen Zugang, sieht er vom Süd die Wolken in der Luft verjagt werden, sucht er den nördlichen Zugang auf, um dem ständigen Gegenzug auf der anderen Seite auszuweichen.</p><p>Ein würdiges Lob spendete darob der Prophet dem Herrn mit dem Ausruf: „Wie groß sind deine Werke, o Herr! alle hast du in Weisheit gemacht“. Alle durchdringt die göttliche Weisheit, alle erfüllt sie. Überzeugender noch läßt sich das aus dem Instinkte der unvernünftigen Wesen als aus dem gelehrten Dispute der vernünftigen erschließen. Denn schwerer wiegt das Zeugnis der Natur als wissenschaftliche Begründung. Welchem Tiere wäre es unbekannt wie es sein Leben zu schützen habe: bei genügender Kraft durch Widerstand, bei Geschwindigkeit durch Flucht, bei Schlauheit durch Vorsichtsmaßregel? Welcher Lehrer hätte es in die Heilpraxis und Kräuterkunde eingeführt? Wir sind Menschen und irren uns oft in der Art der Kräuter und finden gar häufig, daß uns Kräuter, die wir für Heilkräuter hielten, schaden. Wie oft schlich sich nicht schon in ein süßes Mahl ein tödlicher Bissen ein, und drang nicht ein verhängnisvoller Schluck bei aller Wachsamkeit der Hofbediensteten ins Lebensmark der Könige! Die Tiere wissen am bloßen Geruche zwischen dem Schädlichen und Nützlichen zu unterscheiden. Keines braucht [mit seinem Beispiel] vorausgehen, keines vorauskosten: das Pflänzchen wird abgegrast und schadet nicht. Die beste Leherin der Wahrheit ist die Natur. Sie senkt, ohne daß es der Unterweisung irgendeines Lehrers bedarf, unserem Herzen den Sinn für das köstliche Gut der Gesundheit ein; sie hinwiederum lehrt uns herben Schmerz fliehen. So ward das Leben süßer, so der Tod bitterer. Sie vertraut der Löwin Junge an und läßt die fühllose Bestie von sanfter Mutterliebe angewandelt werden. Sie nimmt dem Tieger für einige Augenblicke die Wildheit und hält ihn von der Beute zurück, auf die er sich stürzten will. Sobald er nämlich seine Lagerstätte leer und seine Jungen geraubt findet, verfolgt er unverzüglich die Spur des Räubers. Merkt dieser, daß er trotz des flüchtig eilenden Rosses, das ihn trägt, vom schnellen Raubtier eingeholt werde und jede Möglichkeit des Entrinnens ausgeschlossen sei, sucht er sich künstlich mit folgender List zu retten: In dem Augenblick, da er sich eingeholt sieht, wirft er eine Glasscheibe hin, und wirklich: die Bestie läßt sich vom eigenen Bilde täuschen und hält es für ihr Junges. Verlangen, es zu bergen, steht sie vom Überfall ab. Von neuem aber wirft sie sich, vom Trugbilde aufgehalten, mit allen Kräften auf die Verfolgung des Reiters. Von Wut aufgestachelt, beflügelt sie den Lauf. Schon droht sie über den Flüchtling herzufallen: wieder wirft ihr dieser eine Scheibe vor und hält sie so in ihrer Verfolgung auf. Sie erinnert sich des Truges, doch das beirrt sie in ihrem mütterlichen Eifer nicht. Sie kehrt das Trugbild zu sich und bleibt wie zur Säugung der Jungen zurück. So büßt sie, vom Eifer ihrer Mutterliebe getäuscht, beides ein: die Rache und das Junge.</p><p>Was uns die Schrift mit den Worten ans Herz legt: „Kinder, liebt eure Eltern! Eltern, reizt eure Kinder nicht zum Zorne!“ das senkte den Tieren die Natur ein, so daß sie ihre Jungen gern, ihre Brut lieb haben. Fremd ist ihnen stiefmütterlicher Haß. Nicht gehen bei ihnen den Kindern die Eltern durch Eingehung einer zweiten Ehe verloren, noch gibt es eine Bevorzugung der Kinder aus zweiter Ehe, eine Zurücksetzung dagegen jener aus erster Ehe. Sie kennen ihre Lieblinge, kennen aber keinen Unterschied in der Liebe, kein Entbrennen des Hasses, keine Grade im Sichbeleidigtfühlen. Schlicht gibt sich die Natur des Tieres, sie kennt kein Falsch, das die Wirklichkeit entstellt. So hat nämlich der Herr alles geregelt: je weniger Vernunft er einem Wesen gab, umso mehr Liebe legte er in dasselbe. Welches Tier setzte sich nicht am liebsten selbst der Todesgefahr für seine Jungen aus? Welches Tier deckte nicht mit dem eigenen Leibe, ob tausend bewaffnete Scharen es bedrängen, seine Brut? Mag es einen Hagel von Geschossen regnen, es deckt die Kleinen mit seinem Körper wie mit einem Mauerwall und sichert sie vor Gefahr. Was sagt dazu der Mensch, der über alles Gebot sich hinwegsetzt, seiner Natur vergißt? Der Sohn mißachtet den Vater, der Vater verstößt den Sohn. Das hält man für Recht, wo es sich doch um die Verurteilung des eigenen Blutes, besser um die Selbstverurteilung des Vaters handelt, der seine eigene Zeugung zunichte macht; das hält man für [väterliche] Gewalt, wo die Natur mit Unfruchtbarkeit geschlagen wird.</p><p>Niemand zweifelt wohl, daß der Hund keine Vernunft besitzt. Und doch, wenn man seinen Scharfsinn beobachtet, möchte man meinen, er bediene sich bei seinem feinen Spürsinn der Vernunfttätigkeit. Was beispielsweise kaum die wenigsten an den Schulen fertig zu bringen vermögen, ob sie auch ihr ganzes langes Leben im Lernen zubringen, syllogistische Kettenschlüsse zu machen, darauf verstehen sich, wie sich leicht einsehen lassen wird, die Hunde kraft natürlicher Belehrung. Entdeckt nämlich ein Hund die Spur eines Hasen oder Hirsches und gelangt er hierbei an eine Wegscheide, an eine Art Wegkreuzung, die nach vielen Richtungen auseinanderführt, so überlegt er, während er die einzelnen Pfadmündungen abläuft, still für sich und äußert gleichsam mit dem Scharfsinn, mit welchem er die Spur auffindig macht, die syllogistische Schlußfolgerung: „Entweder schlug er diese Richtung ein oder jene oder bog gewiß in diesen Seitenpfads ein; nun aber nahm er weder letzteren noch ersteren Weg, also bleibt nur übrig, daß er zweifellos dieser Richtung hier folgte“. Was Menschen trotz langen, regelrecht geschulten Denkens kaum fertig bringen, ergibt sich für die Hunde auf natürliche Weise: Erst überzeugen sie sich vom Unrichtigen, sodann gelangen sie nach Ausscheidung des Falschen zur Wahrheit. Vergeuden nicht die Philosophen ganze Tage mit der Zerlegung der [syllogistischen] Sätze auf dem Staubtisch? Sie tragen jeden einzelnen mit dem Stifte ein, löschen zunächst von den dreien, da ja notwendig nur einer wahr sein kann, zwei als irrtümlich aus und stellen schließlich fest, daß nur der übrig gebliebene sich als wahr herausstelle.</p><p>Wer wäre so hilfsbeflissen und dienstgefällig [wie die Hunde]? Verstehen sie doch für ihren Herrn selbst auf Räuber loszustürzen, verwehren Fremden bei Nacht den Zutritt und sind bereit, sei es für ihre Herren zu sterben, sei es mit ihren Herren mitzusterben. Schon oft haben desgleichen Hunde im Fall einer Mordtat deutliche Spuren zur Überführung der Schuldigen aufgedeckt, so daß man schon so manchesmal ihren stummen Zeugenaussagen Glauben schenkte.</p><p>Zu Antiochien wurde, wie man erzählt, in einem abgelegeneren Stadtteile gegen den anbrechenden Morgen ein Mann ermordet, der einen Hund an seiner Seite hatte. Ein Soldat war aus Raubgier zum Mordbuben geworden. Im schützenden Dunkel des anbrechenden Tages war er nach anderen Stadtteilen entwichen. Noch lag der Leichnam unbeerdigt da. Eine zahlreiche Menge von Neugierigen stand herum. Mit jämmerlichen Gewinnsel beklagte der Hund das unglückliche Los seines Herrn. Da mengte sich wie von ungefähr der Mörder in den rings herumstehenden Zuschauerkreis und drängte sich Mitleid heuchelnd an den Leichnam heran, so hält es ja menschliche List gerne: das Verkehren mitten unter den Leuten soll von vorneherein den Anschein der Unschuld erwecken. Da ließ nun der Hund für einige Augenblickt die Trauerklage verstummen, rüstete sich zur Rache, faßte den Mörder und hielt ihn fest. Mit den Schlußtönen gleichsam seiner Trauermelodie, die er stöhnte, rührte er alles zu Trönen und machte die Überführung [des Verbrechers] dadurch glaubhaft, daß er ihn allein aus dem großen Haufen stellte und nicht mehr losließ. In der Verlegenheit schließlich vermochte dieser, weil er den so offenkundigen Verräter der Tat auch nicht mit der Ausrede, es sei Haß oder Feindschaft oder Eifersucht oder Unrecht von irgendeiner Seite im Spiele, entkräften konnte, sein Verbrechen nicht länger zu leugnen. So hatte also, was schwieriger war, der Hund [seinem Herrn] Sühne verschafft, da er ihm keinen Schutz leisten konnte. Welch würdigen Dienst leisten wir unserem Schöpfer, dessen Brot wir essen? Wird er beleidigt, drücken wir die Augen zu und setzen oft Feinden Gottes gastlich jene Speisen vor, die wir von Gott empfangen haben.</p><p>Was gibt es Unschuldigeres als die Lämmlein? Sie gleichen der zarten Kindheit unserer Kleinen. Oftmals irrt eines derselben in der großen Herde, getrennt vom Mutterschafe, unstet durch die ganzen Hürdenräume und ruft, wenn es dasselbe nicht finden kann, mit häufigem Blöcken nach dem abwesenden, um es zu einem erwidernden Laut zu veranlassen und auf seinen Ruf hin aus der Irre den Pfad wieder heim zu finden. Ob es auch unter vielen Tausenden von Schafen schweift, es erkennt die Stimme der Mutter, eilt zu ihr und verlangt desgleichen nach dem ihm gewohnten Born der Muttermilch. Mag es noch so sehr nach Speise und Trank lechzen, es eilt an den übrigen vollen,noch so milchstrotzenden Eutern vorüber, begehrt allein nach dem Mutterschaf und gibt zu erkennen, daß ihm die kargen Züge an dessen Euter überreich genügen. Aber auch das Mutterschaft kennt unter vieltausend Lämmlein einzig nur das seinige. Das Blöcken mag bei vielen dasselbe, das Aussehen das gleiche sein: es kennt dennoch sein Junges von allen anderen heraus und anerkennt es mit der stummen Bezeugung seiner Mutterliebe allein als das Seinige. Der Hirte irrt in der Unterscheidung der Schafe, beim Lämmlein ist solcher Irrtum im Erkennen der Mutter ausgeschlossen. Der Hirte läßt sich täuschen von der Gestalt, doch nicht das Lämmlein in seiner Mutterliebe. Alle haben den gleichen Geruch, doch kennt die Natur noch einen besonderen, den der kleine Liebling als ihm speziell eigen auszudunsten scheint.</p><p>Die Natur [eines Tieres] besitzt von Haus aus ihre eigentümlichen Gepflogenheiten und Instinkte. Kaum brechen beim kleinen Jungen die ersten Zähne hervor, und schon weiß es diese seine Waffen zu gebrauchen. Noch hat der junge Löwe keine Zähne, und als ob er sie hätte, sucht er sich mit seinem Rachen zu rächen. Noch trägt der Hirsch kein Geweih und dennoch plänkelt er bereits mit seiner Stirne und dräuet mit den Waffen daran, bevor er sie erprobte. Der Wolf nimmt dem Menschen, wenn er ihm mit seinem Anblick zuvorkommt, die Sprache und spottet gleichsam seiner als Sieger über die geraubte Sprache. Derselbe Wolf legt, wenn er sich zuvor von dessen Blick getroffen fühlt, die Wildheit ab und kann nicht mehr laufen. Der Löwe fürchtet sich vor dem Hahn, insbesondere dem weißen. Die verwundete Ziege sucht Distanz auf und entfernt damit die Geschosse aus der Wunde. Auch die Tiere kennen ihre Heilmittel. Der kranke Löwe fahndet nach einem Affen, um ihn zu verschlingen und so zu gesunden. Der Leopard schlürft das Blut der wilden Ziege ein und tut so dem fortschreitenden Siechtume Einhalt. Jedes kranke Tier findet mit einem Schluck Hundeblut Genesung. Der kranke Bär vertilgt Ameisen, der Hirsch kaut junge Olivenzweige.</p><p>So wissen also die Tiere zu suchen, was ihnen frommt: du kennst, o Mensch, deine Heilmittel nicht! Du weißt nicht, wie du dem Gegner die Kraft rauben kannst, daß er gleich dem Wolfe, dem man zuvorkommt, dir nicht entrinnen kann; daß du mit dem Auge deines Geistes seine Gottlosigkeit durchschauest und seinen Worten zum voraus den Weg abschneidest, der Unverfrorenheit und Kniffigkeit seiner Streitrede die Spitze brechest! Wenn er es dir zuvortut, wird er dich mundtot machen. Und wenn du verstummt bist, löse deine [Fuß] Bekleidung, um die Zunge zu lösen! Wenn der Wolf dich anfällt, heb ein Felsstück auf und er flieht! Dein Fels ist Christus. Nimmst du zu Christus deine Zuflucht, flieht der Wolf und wird dich nicht schrecken. Nach diesem Fels langte Petrus aus, da er in den Fluten wankte, und erreichte ihn, indem er die Rechte Christi erfaßte.</p><p>Was brauche ich erwähnen, daß die Leute gerne Knoblauch kosten und somit etwas verspeisen, was selbst der Leopard flieht. Sobald nämlich einer glaubt Knoblauch kauen zu sollen, springt der Leopard davon und kann dem nicht widerstehen. Ein Gewächs also, dessen Geruch nicht einmal ein giftiges Raubtier aushalten kann, das willst du als Speise gebrauchen und in dein Inneres aufnehmen! Doch es hilft mitunter gegen Schmerzen: dann gebrauche man’s als Medizin, aber nicht als Speise! Dann gebrauche man’s in Krankheit, nicht zum Mahle! Nach Medizin greifst du und gehst dem Fasten aus dem Weg, als ob du sonst ein besseres Heilmittel auftreiben könntest! Leckt die Schlange den Speichel eines nüchternen Menschen, verendet sie.Du siehst daraus, welch große Wirkung dem Fasten zukommt: mit seinem Speichel tötet ein solcher Mensch die Schlange im physischen, mit seinem Verdienst die im geistigen Sinn.</p><p>Welche Klugheit legte Gott selbst in kleine Tierchen! Die Turtel legt über ihr Nest, daß nicht der Wolf über ihre Brut kommt, Zwiebelblätter. Sie weiß nämlich, daß Wölfe solchen Blättern aus dem Weg zu gehen pflegen. Es weiß auch das Füchslein, wie es seine Nachkommenschaft zu pflegen hat; und du weißt es nicht! Du kümmerst dich nicht, wie du deine Nchkommenschaft in diesem Leben in noch sicherere Hut vor den Wölfen der geistigen Bosheit bringen kannst!</p><p><strong>Der eigenartige aber zweckmäßige Körperbau des Elefanten. Seine Erlegung. Seine Bedeutung, besser Furchtbarkeit im Kriege. Seine natürliche Waffenrüstung und Gepflogenheiten.</strong></p><p>Kehren wir zum Schöpfungsbericht zurück und erwägen wir weshalb der Herr den einen Tieren wie den Löwen und Tiegern, ebenso den Bären einen kürzeren, anderen, wie den Elefanten und Kamelen, einen längeren Hals geschaffen hat. Liegt der Grund nicht offensichtlich darin, daß die Raubtiere, die von Fleisch sich nähren, keinen langen Nacken brauchen? Sie strecken ja nicht Hals und Nacken zum Grasen zu Boden, sondern fallen Hirsch oder Rind an und zerreißen das Schaf. Wie könnte hingegen das Kamel mit seinem hohen Wuchs das kurze Gras abweiden, wenn es den langen Hals nicht zum Fressen bis zur Erde niederstrecken könnte? So hat also das Kamel seinen hohen Wuchs entsprechend, das Pferd dem seinigen gemäß, ähnlich auch das Rind einen längeren Hals empfangen: denn sie nähren sich von Pflanzen.</p><p>Der Elefant aber hat einen langen Rüssel; denn da er an Größe alle anderen [Tiere] überragt, kann er sich zum Fressen nicht zu Boden böcken. So bedient er sich denn des Rüssels zur Aufnahme der Speise. Derselbe führt dem ungeschlacht großen Tiere auch das reichliche Trinkwasser zu und ist darum hohl. Ganze Teiche saugt er zur Stillung des Durstes auf, um ein solches Riesentier mit der eingesogenen Wasserflut volltränken zu können. Der Nacken freilich ist im Verhältnis zur gewaltigen Körpermasse stumpf, um nicht auch noch mehr zu belasten als zu nützen. Auch die Knie kann er eben darum nicht abbeugen; er brauchht nämlich starre Beine, auf welchen der gewaltige Gliederbau wie auf Säulen ruhen kann. Mur die Ferse vermag er ein wenig zu biegen, alles andere an seinen Fü0en von oben bis unten ist steif. Das Riesentier kann sich auch nicht abbeugen, so wie wir uns oft auf die Kniee niederlassen, und kann füglich auch nicht mit den übrigen Tieren die Gepflogenheit teilen, sich niederzulegen und zusammenzukauern. Man gibt ihm auf beiden Seiten starke Planken zur Stütze, damit es sich im Schlafe ohne Gefahr ein wenig auf die Seite lehnen kann;denn der Fuß setzt sich überhaupt nicht aus unterschiedlichen Gliedmaßen zusammen. Für zahme Elefanten wird folglich von den Leuten, die sich handwerksmäßig darauf verstehen, eine Art Gerüst hergestellt, wilden und frei lebenden aber pflegt gewöhnlich gerade daraus, daß ihnen niemand ein solches Gestell als Stütze bereitstellt, Gefahr zu erwachsen.</p><p>Sie stemmen sich nämlich gegen einen Baum, um daran die Rippen zu reiben oder im Schlafe sich auszuruhen. Derselbe gibt mitunter nach, biegt sich und bricht unter der wuchtigen Körpermasse zusammen. Und der Elefant, der sich daran gelehnt hatte, stürzt nieder und kann sich nicht mehr aufrichten und erheben. Er bleibt dort liegen und kommt um oder er verrät sich mit seinem Gestöhn und wird zur Strecke gebracht, indem er am Bauche und den übrigen nächstliegenden Weichstellen verwundbar ist: den Rücken nähmlich und die sonstigen Außenteile pflegt nicht leicht ein Geschoß zu durchchlagen. Es gibt aber Leute, die wegen des Elfenbeins den Elefanten folgende Falle stellen: Sie schneiden die Bäume, an welche sie sich zu lehnen pflegen, an der entgegengesetzten Seite, die sie seltener hierzu benützen, teilweise ein, so daß dieselben, wenn der Elefant sich hinlehnt, der Schwere seiner Gliedmaßen nicht mehr widerstehen können und so seinen Sturz herbeiführen.</p><p>Doch sollte sich jemand darüber aufhalten, dann halte er sich auch über Hochbauten auf, weil sie leichter der schweren Gefahr des Einsturzes ausgesetzt sind und nach dem Einsturz sich schwieriger herstellen lassen. Fürwahr, wenn wir dieselben häufig ob ihrer Schönheit oder aber als Hochwarten rühmen, dann müssen wir diese Eigenschaften auch an den Elefanten billigen, da sie von großer praktischer Bedeutung für den Krieg sind. Deshalb gerade ist das Perservolk furchtbar im Kriege, überlegen im Pfeilschießen und jeder Art von Wurfgeschossen, weil sie die Geschosse von oben, [darum] mit strafferer Spannung nach unten schleudern und ihr Heer wie von wandelnden Türmen gedeckt vorrückt. Mitten auf den Schlachtfeldern kämpfen sie wie von einem Mauerwall herab. Wie hinter einer Feste, einem Höhenzug verschanzt, sind sie mehr Zuschauer denn Streiter im Kampfe und finden so sichtlich der Gefahr entrückt, an der Körpermasse der Tiere sichere Wehr. Wer wollte denn einen Angriff auf sie wagen? Von oben her kann leicht ein Pfeil ihn durchbohren, von unten die anstürmenden Elefanten ihn zertreten! Müssen doch Heere, in Linien aufgestellt oder keilförmig formiert, vor ihnen zurückweichen, Lager im Gevierte geräumt werden. Denn mit einer Wucht, der nicht zu widerstehen, stürzen sie sich auf den Feind: keine Marschkolonne von Kriegern, keine noch so dicht geschlossene Schar von Streitern, keine vorgehaltene Schildwehr hält sie auf; wie wandelnde Berge gewegen sie sich in der Schlacht, wie hoch sich türmende Hügel ragen sie auf und rauben allen mit ihrem dröhnenden Gebrüll Fassung und Zuversicht. Was will der Fußsoldat mit noch so starkem Arm und kampfgeübter Faust dagegen anfangen, wenn eine solche Mauer von Scharen von Bewaffneten starrend, sich heranbewegt und ihm gegenübertritt? Was will der Reiter anfangen, wenn sein Roß vor dem Ungetüm eines solchen Riesentieres scheut und flieht? Was will der Schütze anfangen, wenn der bepanzerte Oberkörper des Feindes den Pfeil nicht fühlt, der ihn trifft, aber auch die Bestie, selbst ohne Wehr, nicht leicht von einem Geschosse durchbohrt werden, in der Panzerwehr aber erst recht ohne eigene Gefahr die Schlachtlinie durchbrechen, die Kriegerscharen niederstampfen kann?</p><p>Wie riesige Bauten, so ruhen die Elefanten auf einem festeren Unterbau; sie müßten sonst, würden die stützenden Füße [der Last] nicht gewachsen sein, innerhalb kurzer Zeit zusammenbrechen. So aber sollen sie ihr Leben dreihundert Jahre und darüber fristen, indem alle Glieder ihrer Größe angemessen sind. Die Gliedmaßen setzen sich darum auch nicht, wie bei uns, aus verschiedenen Teilgliedern zusammen, sondern bilden ein Ganzes, was ihre Kraft noch steigert. Wie schnell schmerzen nicht den Menschen, wenn er lange steht oder zu schnell läuft oder immerfort geht, die Knie oder die Sohlen! Zusammengesetzt aus Teilgliedern, sind sie sämtlich leichter dem Schmerzgefühl oder der Gefahr des Strauchelns ausgesetzt denn als einheitliche und kompakte Masse.</p><p>Und was Wunder auch, wenn der Elefant in Waffenrüstung Gegenstand des Schreckens ist? Sind doch schon seine Zähne gleichsam natürliche Speere, mit denen er bewaffnet ist. Mit dem Rüssel zermalmt er alles, was er umschlingt, mit dem Fuße aber vernichtet er alles, worauf er tritt, wie unter gewaltigem Trümmersturz es begrabend. Er umpfängt mit dem Rüssel ganze Plantagen, um sie aufzuzehren, und umschnürt damit wie ein hochaufgerichteter Drachen die Opfer, die er erfaßt, nach Schlangenart sie umwindend. Vielfach, namentlich beim Auflesen der Nahrung von der Erde und beim Einschlürfen des Trinkwassers, krümmt er den Rüssel kreisförmig. So ist uns denn der Elefant ein Beweis dafür, daß es kein Geschöpf gibt, das überflüssig wäre. Und doch ist auch dieser gewaltige Tierkoloß uns unterwürfig und menschlichem Gebote dienstbar.</p><p><strong>Jedes Tier furchtbar und furchtsam zugleich. Die giftigen Tiere eine Zuchtrute zu Nutz und Frommen des Menschenkindes. Die biblische Provenienz des ‘Erkenne dich selbst’. Die Schönheit der Menschenseele. In der Seele ruht das ganze Sein, das bessere Ich des Menschen; der Leib nur Kleid der Seele.</strong></p><p>Weil wir nachher vom Menschengeschöpfe sprechen werden, müssen wir sein Lob vorbereiten und vorwegnehmen. Wie sich zeigte, weist die Schöpfung nichts Stärkeres auf als den Elefanten, nichts so Furchtbares oder Stattliches, nichts so Wildes wie den Löwen oder den Tiger. Und doch sind diese dem Menschen dienstbar und legen unter menschlicher Dressur ihre Natur ab. Sie vergessen ihrer angeborenen Eigenart und nehmen jene an, die ihnen aufgezwungen wird. Wozu viele Worte? Sie sind gelehrig wie Kinder, dienstbar als hätten sie keine Kraft, lassen sich schlagen wie eingeschüchtert, zurechtweisen wie Untergebene, nehmen unsere Bräuche an, weil sie eben ihre Eigenart eingebüßt haben.</p><p>Wunderbar ist sonach die Natur im Großen denn „wunderbar ist der Herr im Erhabenen“, wunderbar aber auch im Kleinen. Denn wie wir die ebenen Gefilde nicht weniger bewundern wie der Berge Höhen, und den stolzen Wuchs der Zeder nicht mehr als des niederen Weinstocks oder Ölbaums Fruchtbarkeit, so flöst mir auch der Elefant nicht mehr Bewunderung ein als die Maus, vor der er sich fürchtet. Diesen Zug nun weist die Natur [der Tiere] überhaupt auf, daß sie in einer Hinsicht furchtbar, in anderer furchtsam sind. Jedes Geschöpf erfreut sich nämlich des besonderen Vorzugs, daß es an gewissen Sondereigenschaften, die es besitzt, einen Schutz hat. Der Elefant, dem Stiere furchtbar, fürchtet die Maus. Den Löwen, den König der Tiere, quält der winzige Stachel des Skorpion, tötet das Gift der Schlange. Einzigartig wohl ist des Löwen Schönheit: mit seinem Nacken schüttelt er die behaarte Mähne, die Brust emporgerichtet, öffnet er den Rachen. Doch wer müßte nicht auch den Skorpion bewundern? Seinen Stachel, so klein, daß man ihn für nichts Körperliches halten möchte, entquillt der Tod von Riesenleibern.</p><p>Niemand aber tadle es, daß der Schöpfer der Schlange unter seine Geschöpfe auch noch andere giftige Tier oder Pflanzenarten aufgenommen hat. Denn diese sind zu unserer Besserung, nicht zur Entstellung [der Schöpfung] ins Dasein gesetzt worden. Was Feiglingen oder Schwächlingen oder Gottlosen zumeist Stein des Anstoßes und Gegenstand der Furcht ist, frommt den anderen wie der Zuchtmeister den Kleinen. Anscheinend rauh, streng und pedantisch, mit seiner Rute gefürchtet, wehrt er nur der ungebundenen Ausgelassenheit, dringt auf die notwendige Zucht, hält die jugendlichen Gemüter mit der Furcht im Zaume, daß sie nicht zu üppig werden. So macht seine Strenge sie genügsam, nüchtern, enthaltsam, mehr auf löbliches Betragen als auf Spiel bedacht. Siehst du, wie nützlich die gefürchtete Rute ist? So sind auch die Schlangen Zuchtruten für jene, die geistig noch in den Kinderjahren stehen und deren Tugend noch etwas Knabenhaftes an sich hat. Im übrigen vermögen sie Erwachsenen nicht zu schaden. So gilt denn dem, der auf den Herrn vertraut, das Wort: „Über Natter und Schlange wirst du hingehen und niedertreten Leu und Drachen“. Den Paulus biß eine Viper, und man glaubte, er würde, ein sündiger Mensch, kaum dem Schiffbruche entgangen, durch Gift umkommen. Doch als er die Viper ins Feuer schleuderte und unversehrt am Leben blieb, fand er von denen, die es sahen, um so größere Hochachtung. Aber auch der Herr selbst richtet an alle das Wort: „Wer glaubt und sich taufen läßt, wird selig werden; wer aber nicht glaubt, wird verdammt werden. Es werden aber,“ fügt er bei, „denen, die glauben, diese Zeichen folgen: sie streicheln Schlangen mit der Hand, ob sie auch Gift und jegliches Tötliche getrunken, es kann ihnen nicht schaden“. Mehr denn vor Schlangengift muß dir nun, o Mensch, vor der eigenen Ungläubigkeit grauen. Fürchte immerhin jenes, damit es dich wenigstens als Schreckmittel womöglich zum Glauben bewege! Fehlt es dir an Gottesfurcht, so magst du mindestens bangen vor dem rächenden Gift des Unglaubens.</p><p>Jetzt, da du selbst die Elefanten und Löwen dir untertan siehst, „erkenne dich selbst“, o Mensch! Dieser Ausspruch stammt nicht, wie man meint, vom pythischen Apollo, sondern vom heiligen Salomo, der da spricht: „Wenn du dich nicht erkennst, herrliche unter den Frauen …“ Übrigens schrieb längst vorher Moses im Deuteronomium die Worte nieder: „Hab acht auf dich, o Mensch!“ „Hab acht auf dich“, so spricht das Gesetz, und der Prophet: „Wenn du dich nicht erkennst“. Zu wem spricht er dies? „Herrliche unter den Frauen“, fügt er bei. Wer anders ist die Holde unter den Frauen als die Seele, die in beiden Geschlechtern den Adel der Schönheit besitzt? Ja mit Recht: herrlich ist sie, die nicht nach dem Irdischen, sondern nach dem Himmlischen, nicht nach dem Vergänglichen, sondern nach dem Unvergänglichen verlangt, woselbst die Schönheit nicht zu schwinden pflegt. Alles Körperliche welkt ja mit den fortschreitenden Jahren oder durch eine abzehrende Krankheit dahin. Auf diese Seele hab acht, mahnt Moses; denn in ihr ruht dein ganzes Sein, in ihr der bessere Teil deines Ichs. So sagt dir denn auch der Herr, wer du bist, wenn er mahnt: „Hab acht vor den falschen Propheten!“. Diese nämlich schwächen die Seele, untergraben den Geist. Nicht Fleisch also bist du. Was ist auch das Fleisch ohne die Herrschaft der Seele, ohne die Kraft des Geistes? Heute zieht man des Fleisches Hülle an, morgen legt man sie ab. Das Fleisch ist vergänglich, die Seele unvergänglich. Das Fleisch ist das Kleid der Seele, die sich gleichsam in das Gewand des Leibes hüllt. Nicht das Kleid also bist du, sondern der Nutznießer des Kleides. Darum die Aufforderung, die an dich ergeht, „den alten Menschen mit seinem Tun auszuziehen und einen neuen anzuziehen“, der nicht äußerlich im Fleische, sondern innerlich an Geist und Erkenntnis sich verhjüngt. Nicht Fleisch, sage ich, bist du; nicht nämlich dem Fleische gilt das Wort: „Denn der Tempel Gottes ist heilig, der seid ihr“, und an einer anderen Stelle: „Ein Teempel Gottes seid ihr, und Gottes Heiliger Geist wohnt in euch“, vielmehr den Verjüngten und Gläubigen gilt es, denen der Geist Gottes dauerd einwohnt. Im Fleischlichen aber bleibt er nicht, denn geschrieben steht: „Nicht wird mein Geist in diesen Menschen bleiben, da sie Fleisch sind“.</p><p><strong>Die Engel können nicht Mitschöpfer der Welt. noch weniger “Bild Gottes” sein. Das “Bild Gottes” ist der Gottessohn. Die begnadete Menschenseele nur sein “Nachbild”.</strong></p><p>Doch fassen wir den Bericht über unsere eigene Erschaffung näher ins Auge: „Laßt uns, so heißt es, den Menschen machen nach unserem Bilde und Gleichnisse“. Wer spricht das? Nicht Gott, der dich erschaffen hat? Was ist Gott? Fleisch oder Geist? Doch nicht Fleisch, sondern Geist, dem das Fleisch nicht ähneln kann; denn er ist unkörperlich und unsichtbar, das Fleisch aber tastbar und wahrnehmbar. Zu wem spricht Gott? Offenbar nicht zu sich; denn er spricht nicht: „laßt mich machen“,sondern: „laßt uns machen“. Auch nicht zu den Engeln, denn sie sind seine Diener; zwischen Knecht und Herr, zwischen Geschöpf und Schöpfer kann es aber keine Gemeinschaft des Wirkens geben. Vielmehr spricht er es zum Sohne, mag es auch den Juden nicht genehm sein, mögen auch die Arianer sich dagegen sträuben. Doch die Juden mögen schweigen, die Arianer samt ihren Vätern verstummen! Denn während sie einen von der Gemeinschaft des göttlichen Wirkens ausschließen, führen sie eine Mehrzahl ein und übertragen das Vorrecht, das sie dem Sohne absprechen, auf die Diener.</p><p>Doch gesetzt auch den Fall, es habe wirklich Gott, wie ihr meint, der Mithilfe der Engel zu seinem schöpferischen Wirken bedurft: wenn Gott das Wirken mit den Engeln gemeinsam hat, haben Gott und die Engel auch das Bild gemeinsam? Würde er zu den Engeln gesprochen haben: „Laßt uns den Menschen machen nach unserem Bild und Gleichnis“? Wer aber das Bild Gottes ist, darüber vernimm des Apostels Antwort: „der, welcher uns aus der Gewalt der Finsternis befreit und uns in das Reich des Sohnes seiner Herrlichkeit versetzt hat, in welchem wir die Erlösung und Vergebung der Sünden haben, welcher das Bild Gottes ist, des Unsichtbaren, und der Erstgeborene vor aller Schöpfung“. Der ist das Bild des Vaters, welcher immer ist und im Anfange war. Der endlich ist das Bild, der da spricht: „Philippus, wer mich sieht, sieht auch den Vater“. „Wie darfst du“, da du das lebendige Bild des lebendigen Vaters vor Augen hast, „sagen: zeige uns den Vater? Glaubst du nicht, daß ich im Vater bin und der Vater in mir ist?“ Das Bild Gottes ist Kraft, nicht Schwachheit, das Bild Gottes ist Weisheit, das Bild Gottes ist Gerechtigkeit, und zwar die göttliche Weisheit, die ewige Gerechtigkeit. Nur jener allein ist Gottes Bild, der gesprochen hat: „Ich und der Vater sind eins“, so dem Vater ähnlich, daß er die Einheit seiner Gottheit und Fülle besitzt. Wenn er spricht: „laßt uns machen“, wie soll daraus eine Unähnlichkeit sprechen? Wenn er hinwiederum beifügt „nach unserem Gleichnisse“, wo ist da von einer Ungleichheit die Rede? So auch im Evangelium. Wenn [Christus] spricht: „ich und der Vater“, ist eine Einheit der Person ausgeschlossen; wenn er fortfährt: „sind eins“, ist aller Unterschied im göttlichen Sein und Wirken ausgeschlossen. Nicht also e i n e Person, wohl aber nur e i n e Wesenheit haben beide inne. Dazu das bezeichnende „sind“; denn ein immerwährendes Sein kommt nur Gott zu. So halte also den, der dir ungleich mit dem Vater dünkt, gleichewig mit ihm! Denn ewig ist, von dem Moses spricht: „Der Seiende hat mich gesendet“. Sinnig auch stellte er an den Anfang; „ich und der Vater“. Hätte er „Vater“ vorangestellt, würdest du den Sohn für geringer achten. So aber setzte er den Sohn voraus ihn über den Vater zu stellen, war keine Gefahr und „Vater“ hinzu, auf daß du merkest, daß es zwischen Gott Vater und seinem Sohne keinen strengen Vorrang in der Ordnung gebe.</p><p>“Hab acht allein auf dich”, heißt es. Es ist nämlich zu unterscheiden zwischen ‘uns’dem ’unsrigen’, und dem, was ‘um uns ’ist. Ersteres sind wir, d.i.Seele und Geist; ’unser’ sind die Glieder des Leibes und seine Sinne; ’um uns ’aber ist das Geld, sind die Sklaven und was alles zu diesem Leben gehört. “Auf dich denn hab acht”, “dich selbst lerne kennen!” Das heißt: Nicht auf die Muskelkraft deiner Arme, nicht auf die Größe deiner Leibesstärke, nicht auf den Umfang deiner Besitzungen, auf die Fülle deiner Macht hab acht, sondern auf die Beschaffenheit deiner Seele und deines Geistes; denn von der Seele gehen alle Entschließungen aus, auf sie geht die Frucht deines Wirkens zurück. Sie nur ist voll Weisheit, voll Frömmigkeit und Gerechtigkeit; denn jegliche Tugend stammt von Gott. Und ihr gilt Gottes Ausspruch: “Sieh, Jerusalem, ich habe deine Mauern gemalt”. Jene Seele wird von Gott gemalt, die in sich der Tugend strahlende Schönheit und den Glanz der Frömmigkeit trägt. Jene Seele ist trefflich gemalt, die das Bild der göttlichen Schöpfung widerspiegelt. Jene Seele ist schön gemalt, worin “der Abglanz der Herrlichkeit und das Bild der Wesenheit des Vaters” strahlt. Nur ein Gemälde nach diesem Bilde, das darin aufleuchtet, ist von Wert. Nach diesem Bilde war Adam vor der Sünde; nach dem Falle aber, verlor er das Bild des Himmlischen und nahm die Züge des Irdischen an. Doch fliehen wir letzteres Bild, dem der Zutritt in die Stadt Gottes verwehrt ist, weil geschrieben steht: “Herr, in deiner Stadt wirst du ihr Bild zunichte machen”. Kein unwürdiges Bild hat Zutritt, und wenn es Zutritt gehabt, wird es ausgeschlossen; denn “nichts Unreines”, heißt es, “wird in sie eingehen, noch wer Greuel übt und Lüge”; nur der wird vielmehr in sie eingehen, "auf dessen Stirne der Name des Lammes geschrieben steht.</p><p>So ist also unsere Seele das Nachbild Gottes. In ihr, o Mensch, ruht dein ganzes Sein; denn ohne sie bist du nichts, sondern bist Erde und wirst in Erde aufgelöst. Damit du denn erkennen möchtest, daß der Leib ohne die Seele nichts ist, heißt es: „Fürchtet euch nicht vor denen, welche den Leib töten, die Seele aber nicht töten können!“ Was also setzt du mit dem Leibe auf das Spiel, wenn du mit dem Verluste des Leibes nichts verlierst? Davor aber bange dir, der Hilfe der Seele verlustig zu gehen! Denn was kann der Mensch geben als Entgelt für seine Seele, in der nicht bloß ein winziger Teil seines Ichs, sondern die ganze Totalität des Menschen beruht? Sie ist es, durch welche du Herr bist über alle übrigen Wesen der Tierund Vogelwelt. Sie ist das Nachbild Gottes, der Leib aber ist dem Tiere nachgeformt. Sie trägt das heilige Siegel der Gottähnlichkeit, der Leib teilt die niedrigen Züge mit den Tieren und Ungetümen.</p><p><strong>‘Seele’ nach der Heiligen Schrift auch Bezeichnung für ‘Mensch’. Die Entstellung des Nachbildes Gottes im eigenen Innern oder dessen Zerstörung im Nächsten schwere Sünde. Vom “Ruhen Gottes” (Gen 2,3) in der gottnachbildlichen Seele’. “Erkenne dich selbst!” (Mahnungen.) “Hab acht auf dich!” (Warnungen).</strong></p><p>Wir wollen den Begriff der Gottnachbildlichkeit noch genauer bestimmen. Ist etwa der Leib Gottes Nachbild? Ist Gott demnach Erde? Der Leib ist ja Erde. Ist Gott demnach körperlich? Ist er gebrechlich wie der Leib und Leiden unterworfen? Vielleicht dünkt dir das Haupt Gott ähnlich, weil es zur Höhe ragt, oder die Augen, weil sie sehen, oder die Ohren, weil sie hören? Was die Höhe betrifft: sind wir denn so riesengroß, weil wir mit dem Scheitel ein bißchen über den Boden emporragen? Doch schämen wir uns nicht, uns deshalb gottähnlich zu nennen, weil wir etwas höher gewachsen sind als die Schlangen und die übrigen Kriechtiere oder als die Rehe und Schafe oder die Wölfe? Wie weit übertreffen uns nach dieser Seite die Kamele und Elefanten an Wuchs! Etwas Großartiges gewiß ist es um das Auge, um das Schauen der Dinge in der Welt, um das Wissen von etwas, was niemand berichten braucht, sondern dein Blick selbst erreicht! Doch wieviel ist das, was unser Auge sieht, daß wir uns deshalb schon Gott ähnlich nennen wollen, der alles sieht, alles schaut, die himmlischen Regungen der Seele wahrnimmt, das Verborgene des Herzens erforscht? Müßte ich mich nicht schämen, das zu sagen, nachdem ich doch nicht einmal mich selbst ganz sehen kann? Was vor meinen Füßen liegt, sehe ich, was hinter meinem Rücken, kann ich nicht sehen. Meinen Nacken kenne ich nicht, desgleichen nicht den Hinterkopf, nicht vermag ich meine Nieren zu sehen. Ähnlich verhält es sich mit dem Gehr. Was einigermaßen entfernt ist, vermag ich nicht zu sehen und zu hören. Ist eine Wand dazwischen, ist der Blick, ist das Gehör abgeschnitten. Außerdem ist unser Leib an einen bestimmten Ort gebunden, an einen engen Raum gefesselt; jedes Tier bewegt sich freier, jedes auch schneller als der Mensch.</p><p>Nicht der Leib also kann gottnachbildlich sein, sondern nur unsere Seele. Sie ist frei und streift und schweift mit ihren Gedanken und Plänen hierhin und dorthin, indem sie alles mit geistigem Auge schaut. Sieh, eben befinden wir uns in Italien und stellen uns in Gedanken vor, was gen Osten oder Westen zu liegen scheint, denken uns unter die Bewohner Persiens versetzt, stellen uns die Einwohner Afrikas vor Augen, folgen unseren Bekannten, die etwa dieser Erdteil aufnimmt, auf dem Wege, weilen bei ihnen in der Fremde, nahen uns ihnen in der Ferne, reden mit ihnen in der Abwesenheit; auch selbst Verstorbene rufen wir zum Zwiegespräch zurück, umpfangen und halten sie fest, als wären sie am Leben, und legen ihnen die Funktionen und Gepflogenheiten des Lebens bei. Nur die Seele ist sonach Gottes Nachbild, die nicht nach der Kraft des Leibes, sondern des Geistes einzuschätzen ist; deren Auge Abwesende schaut, deren Blick nach überseeischen Ländern trägt, sie spähend durchstreift und entlegene Striche durchforscht; die ihre Gedanken im Nu hierhin und dorthin nach allen Enden des Erdkreises und durch die verborgenen Räume der Welt schweifen läßt; die Gott vereint, Christo anhängend, zur Unterwelt hinabund emporsteigt, frei im Himmel wandelt. So höre denn den Apostel versichern:„Unser Wandel aber ist im Himmel“.Und die Seele soll nicht gottnachbildlich sein, der Gott immerdar einwohnt? Doch vernimm es, daß sie Gottes Nachbild ist. Es beteuert nämlich der Apostel: „Wir alle also schauen mit enthülltem Angesicht die Herrlichkeit Gottes und werden umgestaltet in dasselbe Bild von Herrlichkeit zu Herrlichkeit wie vom Geiste des Herrn“. n</p><p>Nachdem wir uns von der Gottnachbildlichkeit der Seele überzeugt haben, wollen wir jetzt nun erwägen, ob nicht mit dem Ausdruck „laßt uns den Menschen machen“ die Seele gemeint sein könnte. Doch vernimm auch das [aus der Schrift], daß die Seele mit dem Namen ‘Mensch’ bezeichnet wird. Es steht nämlich in der Genesis geschrieben: „Die Söhne Josephs aber, welche ihm in Ägypten geboren wurden, waren neun Seelen. Alle Seelen nun, die mit Jakob in Ägypten einzogen, waren fünfundsiebzig“. Viel passender heißt es im Lateinischen ‘homo’, im Griechischen ‘anthropos’ für ‘Seele’. Bezeichnungen die eine von der Menschlichkeit [humanitas], die andere von der Sehkraft herrührend, die zweifellos mehr für die Seele als für den Leib zutreffen. Dazu stimmt so recht auch jener Ausspruch in den Klageliedern des Jeremias: „Gut ist der Herr denen, so auf ihn harren, der Seele, die ihn sucht“. Von Menschen spricht er und glaubte die Apposition ‘Seele’ machen zu sollen; denn besser sucht diese [Gott], wenn sie allein ist und von leiblicher Befleckung und fleischlicher Lust sich fernhält. Nur sie ist gottnachbildlich und dem Herrn Jesus gleichförmig; die aber dem Sohne Gottes gleichförmig sind, sind heilig. Denn so lesen wir es bei Paulus, der da spricht: „Wir wissen aber, daß denen, die Gott lieben, alles zum Guten gereicht, denen, die nach dem Ratschlusse zu Heiligen berufen sind. Denn die er vorher erkannt hat, hat er auch vorherbestimmt, dem Bilde seines Sohnes gleichförmig zu werden, daß er der Erstgeborene sei unter vielen Brüdern. Die er aber vorherbestimmt hat, diese hat er auch berufen; und die er berufen, diese hat er auch gerechtfertigt; die er aber gerechtfertigt, diese hat er auch verherrlicht“. Wird nun die Rechtfertigung deiner Ansicht zufolge dem Leibe oder der Seele nach erteilt? Antworte doch! Indes du kannst nicht zweifeln, da doch die Gerechtigkeit, von ‘Rechtfertigung’ abgeleitet, eine Tugend der Seele, nicht des Leibes ist.</p><p>Bild also bist du, o Mensch, ein Bild aus der Hand des Herrn deines Gottes. Einen guten Künstler und Bildner hast du. Zerstöre das schöne Bild nicht, das nicht von Schein, sondern von Wahrheit strahlt, nicht von Wachs, sondern von der Gnade geprägt ist! Du zerstörst, Weib, das Bild, wenn du dein Gesicht mit stofflicher Schminke bestreichst, mit künstlicher Röte übergießest. Das ist ein Bild von falscher, nicht von wahrer Schönheit; das ist ein Trugbild, das nicht der echten Wirklichkeit entspricht; das ist ein vergängliches Bild Regen oder Schweiß verwischt es; dieses Bild lügt und trügt. Es gefällt schon dem nicht, dem du gefallen möchtest und der weiß, daß nicht deine, sondern fremde Schönheit Gefallen erwecken soll; und es mißfällt deinem Schöpfer, der sein Meisterwerk zerstört sieht. Sage mir: wenn du hinter dem Rücken eines Meisters einen zweiten beiziehen wolltest, der jenes ersteren Werk mit neuen Malereien überarbeitete, müßte jener nicht ungehalten sein, wenn er sein Werk verfälscht fände? Gib das Bild Gottes nicht preis und tausche dir nicht dafür das Bild einer Buhlerin ein! Denn es steht geschrieben: „Sollte ich die Glieder Christi nehmen und zu Gliedern einer Buhlerin machen? Das sei ferne!“ Wer also das Werk Gottes fälscht, begeht einen großen Frevel. Denn ein großer Frevel wäre es zu glauben, daß ein Mensch dich besser malen könne als Gott. Schlimm wäre es, wenn Gott von dir sagen müßte: „Das sind nicht meine Farben, die ich sehe, nicht mein Bild, das ich schaue, nicht das Antlitz, das ich geformt habe. Fort damit, es ist nicht mein! Geh zu dem, der dich gemalt hat, mit ihm halt es, von ihm laß dich entlohnen, dem du zu verdienen gegeben hast!“ Was willst du antworten?</p><p>Wenn es schwere Sünde ist, Gottes Werk zu schänden, was sollen wir von jenen sagen, die Gottes Werk töten, die Menschenblut vergießen, die das Leben, das Gott geschenkt hat, vernichten, die sprechen: „Laßt und den Gerechten aus dem Weg räumen; denn er ist uns unnütz“? Trefflich heißt es darum in der heutigen Lesung: „Die Füchse haben Höhlen, und die Vögel des Himmels Nester, wo sie ruhen, der Sohn des Menschen aber hat nicht, wo er sein Haupt niederlege“. Der Fuchs kann sich bergen in der Höhle, die Vögel sich schützen im Neste: für den Menschen aber ist die Höhle kein bergendes Heim, sondern eine Falle. Die Höhle aber ist der Mund des Menschen, die tiefe Höhle ist die Brust des Menschen, woselbst die verderblichen und hinterlistigen Anschläge, die bösen Gedanken hausen. Du gehst des Weges, da gräbt dir ein anderer eine Höhle. Dein Pfad führt zwischen Fallstricken, die dir deine Feinde heimlich in den Weg gelegt haben. Gib denn acht auf alles ringsum, daß du gleich dem Rehe den Schlingen, gleich dem Vogel dem Garn entfliehest! Das Reh entgeht den Schlingen mit des Auges scharfem Blick, der Vogel entrinnt dem Garn, wenn er seinen Flug aufwärts zur Höhe richtet und über den irdischen Bereich hinausfliegt. Denn in der Höhe spannt niemand Netze aus, legt niemand heimliche Schlinge. Wessen Wandel darum in der Höhe ist, pflegt nicht gefangen eine Beute zu werden. Doch was Wunder, wenn Mensch den Menschen trügt? Hatte doch der Menschensohn nicht einmal, wo er hätte ausruhen können. Er schuf freilich einen solchen Menschen, daß er in ihm sein Haupt niederlege. Doch nachdem unsere Brust statt Ruhestätte für den Nächsten eine [Räuber] Höhle zu werden begann, nachdem einer dem anderen statt zu helfen, wie sich’s gehörte, Nachstellungen zu bereiten anfing, wandte Christus sein Haupt von uns ab. Doch nachher freilich wollte er es für uns lieber dem Tode weihen. So sei denn nicht hinterlistig, grausam, unmenschlich, damit Christus in dir sein Haupt zur Ruhe lege!</p><p>Als Gott die Fischungeheuer geschaffen, als er die Gattungen der wilden Tiere und Bestien geschaffen hatte, ruhte er nicht: „er ruhte aber“,nachdem er den Menschen nach seinem Bilde geschaffen hatte. In welchem Menschen er ruhen wollte, darüber höre den Propheten, der spricht: „Oder über wem werde ich ruhen, wenn nicht über dem Demütigen und Friedsamen und dem, der meine Worte fürchtet?“ So sei also demütig und friedsam, daß Gott in deinem Herzen ruhe! Er, der im Tiere nicht ruhte, ruht viel weniger noch in einer tierischen Brust. Es gibt nämlich auch tierische Affekte, es gibt Tiere in Menschengestalt. Diese meint der Herr, wenn er warnt: „Hütet euch vor den falschen Propheten, die im Schafskleide zu euch kommen, inwendig aber reißende Wölfe sind!“ In solchen aber ruht Gott nicht, er ruht vielmehr nur in gesitteten Menschen, die er nach seinem Bilde und Gleichnisse geschaffen hat, damals als er den Mann geschaffen hat, der „das Haupt nicht verhüllen darf, weil er das Bild und der Ruhm Gottes ist“. Der Seele dieses Mannes gilt das Wort:„Sieh, ich, Jerusalem, habe deine Mauern gemalt“. Er spricht nicht: „ich habe deinen Bauch gemalt“, nicht: „ich habe das Niedrige an dir gemalt“, sondern „ich habe deine Mauern gemalt“ und versichert damit, dem Menschen feste Schutzmauern gegeben zu haben, daß er, ein wachsamer Wächter auf den Mauern, gefährlichen Angriffen abschlagen könne; er spricht sonach: Nicht Genüsse habe ich dir gegeben, nicht lockende Begierden, nicht reizende Wollust, nicht Begierlichkeit nach fremder Schönheit, sondern Grundfesten vom Mauern habe ich dir gegeben, ragende Turmzinnen habe ich dir gegeben, hinter welchen du keine Überwältigung durch den Feind fürchten, nicht vor den furchtbarsten Angriffen anstürmender Legionen bangen brauchst. So spricht darum, wie du beimo Jesaja liest, des Gerechten Seele, bezw. die LKirche: „Ich bin eine befestigte Stadt, ich bin eine belagerte Stadt“, befestigt durch Christus, belagert durch den Teufel; doch darf, wer Christus zum Helfer hat, die Belagerung nicht fürchten. Befestigt nämlich wird er von der geistigen Gnade und belagert von den weltlichen Gefahren. Darum die Beteuerung im Hohen Liede: „Ich bin eine Mauer und meine Brüste Bollwerke“. Eine Mauer ist die Kirche, ihre Bollwerke sind die Priester, die in Sachen der Weltanschauung [de naturalibus] über die Fülle des Wortes in Sachen der sittlichen Lebensführung [de moralibus] über die Fülle der Zucht verfügen.</p><p>So erkenne dich denn, herrliche Seele: das Bild Gottes bist du! Erkenne dich, o Mensch; der Ruhm Gottes bist du! Vernimm, inwiefern sein Ruhm. Es spricht der Prophet: „ Wunderbar ward dein Wissen an mir“, d.i. in meinem geschöpflichen Ich erstrahlt noch wunderbarer deine Größe, in der Einsicht des Menschen findet deine Weisheit ihr Lob. Da ich mein Ich betrachte, das Du selbst in seinen verborgensten Gedanken und innersten Regungen durchdringst, treten mir die Geheimnisse Deines Wissens vor die Seele.</p><p>So erkenne dich denn, o Mensch, [erkenne] wie groß du bist, und „hab acht auf dich“, daß du nicht gegebenen Augenblicks in die Fallstricke des Teufels gerätst, und eine Beute seiner Nachstellungen wirst! Daß du nicht gegebenen Falles jenem unheilvollen Löwen in den Rachen gerätst, der „brüllt und umhergeht, suchend, wen er verschlinge!“ „Hab acht auf dich“, daß du genau merkest, was zu dir eingeht, was aus dir herauskommt! Nicht die Speise meine ich, die verzehrt und ausgesondert wird, sondern die Gedanken meine ich, von den Worten spreche ich. Nicht gehe zu dir ein die Begierde nach fremden Ehebette, nicht schleiche sie sich ein in deinen Geist! Nicht fahnde dein Auge nach der Schönheit eines vorübergehenden Weibes, nicht schließe das Herz sie ein! Nicht knüpfe deine Rede der Verführungskünste Netz, nicht übe sie hinterlistig Verrat am Nächsten, nicht begeifere sie ihn mit Hohn und Spott! Zum Jäger, nicht zum Räuber hat dich Gott gemacht, da er sprach: „Sieh, ich sende viele Jäger“: Jäger, nicht nach Missetat, sondern nach Loslösung davon, Jäger nicht nach Schuld, sondern nach Gnade. Ein Fischer Christi bist du, an den das Wort ergeht: „Von jetzt an wirst die Menschen lebendig machen“. So wirf aus dein Netz, so wirf aus deiner Augen, so wirf aus deiner Worte Netz, daß du kein Fischlein in der Flut zerdrückest, sondern es heraufziehest. „Hab acht auf dich!“ So stehe, daß du nicht fallest! So laufe, daß du den Preis erringest. So sollst du kämpfen, daß du oftmals den entscheidenden Sieg davontragest, weil nur dem rechtmäßigen Kampfe die Siegeskrone gebührt! Ein Krieger bist du: spähe den Feind aus, daß er nicht nächtlich dich überfalle! Ein Ringkämpfer bist du: halte dich dem Gegner näher mit den Händen, als mit dem Gesichte, daß er nicht dein Auge treffe! Frei bleibe der Blick, fest und sicher der Schritt, daß du ihn, falls er angreift, niederstreckest, falls er weicht in deine Gewalt bekommest, mit achtsamem Auge der Verwundung entrinnest, in kühnem Waffengang sie abschlagest! Wirst du dennoch verwundet, „hab acht auf dich“; eile zum Arzt, sieh dich nach dem Heilmittel der Buße um! „Hab acht auf dich“, denn du trägst Fleisch, das rasch zu Fall kommt! Es suche dich heim der gute Seelenarzt, das Gotteswort! Es träufle dir die Aussprüche des Herrn wie heilsamen Balsam! „Hab acht auf dich“, daß das Wort, das in deinem Herzen verborgen ruht, nicht in Unheil umschlägt, denn es gleicht dann schleichendem Gifte und senkt ansteckende Todeskeime ein! „Hab acht auf dich“, daß du Gott nicht vergessest, der dich erschaffen hat, und daß du seinen Namen nicht umsonst empfangest!^</p><p>“Hab acht auf dich”, mahnt das Gesetz, daß du nicht, nachdem du gegessen und dich gesättigt und Häuser gebaut und darinnen zu wohnen angefangen hast und Vieh in Fülle besitzest und in Überfluß Gold und Silber und alles, was immer du in Menge empfangen, im Herzen dich überhebest und des Herrn deines Gottes vergessest!" “Denn was hast du, Mensch, das du nicht empfangen hättest?” Geht nicht dies alles wie ein Schatten vorüber? Ist nicht dein Haus hier Staub und Schutt? Ist nicht dies alles trügerisch? Ist nicht der Welt Reichtum Eitelkeit? Bist nicht du selbst Asche? Schau hinein in Menschengräber und sieh, was von dir, d.i. von deinem Leibe, außer Asche und Gebein übrig bleiben wird. Schau hinein, sage ich, und gib mir an, wer hier der Reiche und der Arme ist! Unterscheide den Dürftigen vom Besitzenden! Nackt treten wir alle ins Leben, nackt verlassen wir’s. Keinen Unterschied gibt es zwischen den Leichnamen der Verstorbenen, es sei denn, daß die von Genußsucht gemästeten Leiber der Reichen den übleren Geruch verbreiten. Von welchem Armen hast du je gehört, er sei an Verstopfung gestorben? Seine Dürftigkeit bekommt ihm wohl, sie regt den Körper an, überlädt ihn nicht. “Nicht doch hörten wir, daß ein Gerechter verlassen ward und seine Nachkommenschaft um Brot bettelt”. Denn wer tüchtig sich müht auf seiner Scholle, hat mehr denn genug zu essen. So “hab denn acht auf dich”, Reicher, weil auch du Fleisch trägst gleich dem Armen!</p><p>„Hab acht auf dich“, Armer, denn deine Seele ist kostbar! Mag der Leib sterblich sein, die Seele ist unsterblich. Mag es dir an Geld mangeln, nicht mangelt es an Gnade. Mag dein Haus auch nicht geräumig, dein Besitz nicht ausgedehnt sein: weit wölbt sich der Himmel, frei dehnt sich die Erde. Als gemeinsamer Besitz sind allen die Elemente verliehen worden, gleicherweise stehen Reichen und Armen die Herrlichkeiten der Welt offen. Ist etwa die vergoldete Deckentäfelung der Prunkbauten schöner als die von funkelnden Sternen besäte Himmelsflur? Dehnen die Ländereien der Reichen sich weiter aus als die Strecken der Erde? Darum der Vorwurf gegen jene, die Haus an Haus und Hof an Hof reihen: „Wollt ihr denn allein wohnen auf der Erde?“ Größer ist das Haus, das du, Armer, besitzest, worin du rufst und Erhörung findest. „O Israel, ruft der Prophet aus, wie groß ist das Haus Gottes und endlos die Stätte seines Besitztums! Groß und ohne Grenzen, hoch und unermeßlich!“ Dem Reichen wie dem Armen gehört gemeinsam das Haus Gottes; „schwer doch ist’s, daß ein Reicher in das Himmelreich eingeht“. Aber es fällt dir vielleicht hart, daß dir kein Licht von goldenen Leuchtern schimmert? Doch viel heller funkelt dir, rings Licht ausstrahlend, der Mond. Über den Winter vielleicht klagst du, weil kein Hypokaustum mit dampfender Hitze dir Wärme haucht? Doch du erfreust dich der Sonnenhitze, die dir den Erdkreis erwärmt und dich vor Winterkälte schützt. Oder dünken dir jene glücklich, die von dichten Sklavenscharen gefolgt und umringt sind? Doch wer fremder Füße sich bedient, kennnt nicht die Wohltat der eigenen; so läßt er denn etliche Sklaven vor sich herziehen, von der großen Mehrzahl sich tragen. Du müßtest denn seinen Überfluß an Gold, Silber und Geld bewundern? Was er alles in Fülle besitzt, siehst du, was er alles entbehrt, siehst du nicht. Auf Betten von Elfenbein ruhen dünkt dir kostbar und denkst nicht daran, daß die Erde kostbarer ist, die dem Armen den Teppich grüner Matten breitet, worauf ihn süße Ruhe, erquickender Schlaf umfängt, den der auf goldenes Lager gebettete Reiche die ganze Nacht durchwachend herbeisehnt und nicht kostet. O wie unendlich glücklicher schätzt er dich, der Wache den Ruhenden! Dazu kommt, und das besagt noch viel mehr, daß der Gerechte, der hier darbte, dort Überfluß, der hier Mühseligkeit erduldete, dort Tröstung finden wird, daß aber der, welcher hier schon das Gute empfangen, dort keinen Lohn hierfür gewärtigen kann; denn die Armut legt sich ihren Lohn zurück, der Reichtum zehrt ihn auf.</p><p>„Hab denn acht auf dich“, Armer, „hab acht“, Reicher! Denn Armut sowohl wie Reichtum haben ihre Gefahren. Darum betet der Weise: „Reichtum und Armut gib mir nicht!“ Und er führt auch den Grund an, warum er so flehte: Es genügt für den Menschen zu haben, was er bedarf; denn der Reichtum bläht wie den Bauch mit Speisen so den Geist mit Sorgen und Ängsten auf. Darum sein Flehen, es möge ihm nur zugedacht werden, was nötig sei und genügend, „damit ich nicht, wie er sich ausdrückt, übersättigt zum Lügner werde und spreche: wer sieht mich? oder in Armut geraten Diebstahl begehe und schwöre beim Namen des Herrn“. Fliehen oder meiden soll man sonach die Gefahren der Welt: der Arme soll nicht verzagen, der Vermögliche sich nicht überheben, denn es steht geschrieben: Wenn du die Heiden [Kanaaniter] vertrieben hast und ihr Land zu nutzen anfängst, dann sprich nicht: „meine Kraft und meine Hand hat mir diesen Besitz verschafft“. So hält’s der, welcher sein Vermögen seinem Verdienste zuschreibt und darum, als hätte er Siegel und Brief darauf, seinen Irrtum nicht einsieht, sondern am langen Seil die Sünde nachschleppt. Würde er`s nämlich glauben, daß er seinen Vermögenszuwachs nur glücklichem Zufall oder schändlicher Übervorteilung verdankt, bliebe ihm kein Grund, sich auf Dinge etwas zugute zu tun, die entweder eitle Mühe und kein Lob, oder aber schamlose Habgier bedeuten, die der Genußsucht keine Schranke zu setzen weiß.</p><p><strong>Das Haupt eine ragende Burg, Thron der Weisheit, beherrschendes Prinzip des Leibes. Die Augen zwei Leuchten, zwei Wächter auf hoher, geschützter Warte. Das Haupthaar Schutz und Schmuck. Die freie Stirne Spiegel der Seele. Die Augenbrauen zwei Schutzwälle. Der Augapfel Sitz des Sehvermögens. Das Gehirn Zentralorgan des freien Bewegungsvermögens und der Sinnesfunktionen. Das Herz Quellpunkt für die Arterien und Herd der vitalen Körperwärme. Der zweck und kunstvolle Organismus des Ohres (Gehörsinn) und der Nase (Geruchsinn). Vorzüge des Tastsinnes. Mund und Zunge als Kau und Sprachorgane. Der Kuß Sinnbild und Unterpfand der Liebe. Die Bedeutung der Gurgel, der Arme, der Hände. Die Hand im liturgischen Dienst. Die übrigen Organe: Brustkasten und Bauchhöhle, Lunge und Herz, Milz und Leber, Gedärme, After, Adern, Knochen, Genitalien, Füße und Knie.</strong></p><p>Doch noch erübrigt jetzt, einiges über den menschlichen Leib zu sprechen. Wer möchte denn leugnen, daß er an Schönheit und Vorzüglichkeit alles andere überragt? Mag der Grundstock bei allen Körperdingen der Erde gleich, Stärke und Wuchs bei gewissen Tieren größer sein: an Gestalt gebührt dem menschlichen Leibe die Palme, seine Haltung ist aufrecht und zur Höhe gerichtet, [an Wuchs] die Mitte haltend zwischen unförmiger Größe und unansehnlicher, verächtlicher Kleinheit, das Äußere des menschlichen Körpers ist einnehmend und gefällig, ohne daß tierische Ungeschlachtheit abschreckend wirkte oder Schlankheit in Schwächlichkeit überginge.</p><p>Allererst nun wollen wir uns zum Bewußtsein bringen, daß der Bau des menschlichen Körpers ein Bild der Welt ist. Wie nämlich der Himmel über Luft, Erde und Meer, gleichsam die Glieder des Weltorganismus, hinausragt, so sehen wir auch das Haupt über die übrigen Glieder unseres Körpers hinausragen, [sehen es] als das vorzüglichste unter allen, gleich dem Himmel unter den Elementen, gleich der Burg unter den sonstigen Festungswerken einer Stadt. In dieser Burg thront wie eine Königin die Weisheit nach des Propheten Wort: „Die Augen des Weisen befinden sich in dessen Haupt“. Sie hat die geschützteste Lage von allem; aus ihr strömt allen Gliedern Kraft und Fürsorglichkeit zu. Denn was nützt die Kraft und Stärke der Arme, was die Schnelligkeit der Füße, wenn nicht das Haupt wie ihr gebietender Herrscher mit seiner Gewalt sich mit ihnen verbände? Von ihm hängt, wie der Verfall des Ganzen, so der Bestand von allem ab. Was will die Tapferkeit erzielen, wenn sie nicht der Führung des Auges zum Kampfe sich bedienen könnte? Was die Flucht, wenn das Sehvermögen fehlte? Ein Kerker wäre der ganze Leib, vor Finsternis starrend, würde er nicht vom Blicke des Auges erhellt. Was sonach die Sonne und der Mond am Himmel, das sind die Augen am Menschen. Sonne und Mond aind die beiden Leuchten der Welt, die Augen aber glöeichsam die Sterne am Haupte: sie leuchten von der Höhe bestrahlen das Untenliegende mit hellem Lichte und lassen uns nicht von der Finsternis der Nacht eingehüllt werden. Gleichsam unsere Wächter, sind sie Tag und Nacht auf der Hut. Denn sie lassen sich schneller als die übrigen Glieder aus dem Schlafe wecken und spähen wachsam alles ringsum ab; sie befinden sich ja in nächster Nähe vom Gehirn, dem Sitze des gesamten Sehvermögens. Niemand glaube aber, ich sei, weil mein Lob jetzt, vom Haupte weg, den Augen gilt, zu voreilig zu diesen herabgestiegen; denn das Lob des Ganzen in einem Teilgliede nachzuweisen, ist nichts Ungewöhhnliches. Die Augen sind ja sicherlich ein Teil des Hauptes; das Haupt ist es, das mittels der Augen alles zu erspähen, mittels der Ohren das Heimliche zu erlauschen sucht, von verborgenen Dingen erfährt und von Vorgängen vernimmt, die in anderen Ländern spielen.</p><p>Schon der Scheitel des Hauptes: wie fein und zierlich ist er! Wie köstlich das Haupthaar, wie ehrwürdig an Greisen, wie verehrungswürdig an Priestern, wie trutzig an Kriegern, wie hold an Jünglingen, wie wohlgepflegt an Frauen, wie weichfließend an Kindern! Für das eine Geschlecht ist langes Haar ungeziemend, dem anderen geziemt geschorenes nicht. Ein Blick auf die Bäume mag die Schönheit des menschlichen Hauptes würdigen lassen. Zu oberst am Baume hängt alle Frucht, dort birgt alle Schönheit sich, sein Laub schirmt uns vor dem Regen oder schützt uns vor der Sonne. Nimm dem Baum das Laub, und der ganze Baum ist unschön. Wie wunderbar ist also der Schmuck des menschlichen Hauptes! Mit seinem Haupthaar schirmt und hüllt es unser Hirn und damit den Sitz und Herd unserer Sinne, daß es nicht unter Kälte oder unter Hitze leide. Hier ruht ja der Quellpunkt des Gesamtorganismus, und darum tritt hier, wo Unbill Schaden anrichten könnte, eine besondere gnädige Fürsorglichkeit zutage.</p><p>Was wäre der Mensch ohne das Haupt, da doch das Haupt sein ganzes Ich widerspiegelt! Siehst du das Haupt, erkennst du den Menschen; fehlt das Haupt, ist ein Erkennen unmöglich: der Rumpf liegt da, nichts verrät den Adel, die Stellung, den Namen. Nur das Haupt der Fürsten, aus Erz gegossen, und deren Gesichtszüge, aus Erz oder Marmor geformt, erfreuen sich der Huldigung der Menschen. Nicht mit Unrecht sind daher dem Haupte die übrigen Glieder wie ihrem obersten Berater dienstbar, führen es, gleich Sklaven mit der Tragbahre, wie ihren Genius herum und tragen es hoch erhoben hier und dorthin. Mit der Gewalt des Zensors bestimmt es nach Belieben den Dienst der unterwürfigen Glieder und teilt jedem die ihm vorgeschriebenen Funktionen zu.Da kann man alle freiwillig ohne Sold im Dienste ihres Herrschers sich mühen sehen, die einen als Lastträger, die anderen als Proviantbesorger, wieder andere als Verteidiger oder als Vollstrecker des ihnen obliegenden Dienstes. Sie gehorchen dem Haupte als ihrem Herrscher, dienen ihm als ihrem Herrn. Von da ergeht gleichsam die Parole, nach welchem Gelände der Fuß schreiten, welche Kampfesarbeit die Hand zur Vollbringung vollkommener Werke verrichten, an welche Norm des ihm auferlegten Sittengesetzes der Bauch sich halten solle, ob er fasten oder essen solle.</p><p>Eine freie Stirne schmückt das Haupt, eine offene mit freien Schläfen. Bald heiter, bald düsterer, bald straff gezogen zu Ernst, bald weniger straff zu Milde, verrät sie in ihrem Aussehen die Stimmung des Geistes, drückt durch äußere Kennzeichen das innere Wollen aus: ein Spiegelbild des Geistes mit sprechenden Zügen, ein Piedestal des Glaubens, worauf täglich der Name des Herrn gezeichnet und bewahrt wird.</p><p>In der gleichen Richtung läuft der Doppelwall der Brauen, der als Schutzwehr den Augen vorgeschoben ist, als Zierde davorhängt, so daß denselben zugleich anmutige Schönheit lacht und treue Hut wacht. Fällt irgendein Unrat vom Haupte oder ein Sandstäubchen oder Nebeltropfen oder Schweiß vom triefenden Scheitel: es wird von den Brauen aufgefangen, daß es nicht die Sehkraft des empfindlichen Auges verletze, deren feinen Blick störe.</p><p>Wie an Höhenhängen sind die Augen eingebettet. Sie sollen sich so einerseits unter dem schützenden Berggipfel größerer Sicherheit erfreuen, andererseits, weil in Höhenlage, wie von einer Hochbühne aus alles überschauen. Sie durften nämlich nicht an niederer Stelle angebracht werden wie die Ohren oder der Mund und auch die inneren Nasenkanäle; denn der Posten gehört immer auf hohe Warte, um das Nahen feindlicher Scharen ausspähen zu können, daß die nicht unversehens die Stadtbevölkerung oder des Kaisers Heer, während sie sich in Ruhe wiegen, überrumpeln. Nur so läßt sich auch räuberischen Überfällen vorbeugen, wenn Kundschafter auf Zinnen oder Türme oder auf ragende Bergeshöhe gestellt sind, um von der Höhe aus das flache Land abzuspähen, so daß der räuberische Überfall nicht verborgen bleiben kann. So klettert auch ein Seefahrer, wenn er vermuten darf, es gehe dem Festlande zu, hoch auf den Mast und die ragenden Spitzen der Segelstangen, um nach dem Ziele seiner Sehnsucht zu spähen, und grüßt aus der Ferne das Land, das sich den Blicken der übrigen noch entzieht.</p><p>Vielleicht möchtest du einwenden; Wenn es eines Wächters auf höherer Warte bedurfte, warum wurden dann die Augen nicht zu oberst auf dem Scheitel des Hauptes angebracht, wie sie bei den Krebsen oder Käfern zu oberst sind? Denn merkt man auch bei diesen Tieren keinen Kopf, so treten doch Hals und Rücken über den sonstigen Körper hervor. Indes diese besitzen eine starke Hornhaut und keine so zarte Membrane wie wir, die leicht verletzt und durch Dorngestrüpp oder Hecken geritzt werden kann. Auch noch andere Tiere sind derart gebaut, daß sie entweder die Augen zum Nacken zurückwenden können, wie Pferd oder Rind und fast alle wilden Tiere, bezw. zu ihren Flügeln wie die Vögel, die so sicherer Rast sich erfreuen. Wir hingegen brauchten Augen, die zu oberst am Körper wie auf einer Burg anzubringen und von jeder, selbst der geringsten Verletzung zu schützen waren: zwei Erfordernisse, die sich zu widersprechen schienen. Wenn sie nämlich des Schutzes wegen an einer niederen Stelle angebracht wären, würden sie in ihrer Funktion behindert, wenn auf dem Scheitel, leicht Verletzung ausgesetzt sein. Damit nun einerseits ihrer Funktion keinerlei Eintrag geschähe, andrerseits Vorsorge zur Verhütung von Verletzungen getroffen würde, versetzte sie [der Schöpfer] an jene Stelle, der die Brauen von oben her nicht geringe Deckung böten, zu deren Schutz von unten die etwas hervortretenden Wangen nicht wenig beitrügen, während innen die Nase sie schirmen, außen desgleichen Stirne und Backen wie ein hochaufgeworfener Wall sie rings umschließem sollten sowie die angrenzenden Teile, ob sie auch nur mit dem Knochengefüge in Verbindung damit stehen und flach sind. Dazwischen nun liegen die Augen in sicherer Hut, mit freiem Blick, von bezaubernder Anmut, funkelnd wie Kristall. In ihrer Mitte glänzen die Augensterne, die Kraftzentren des Sehvermögens. Sie werden, damit kein Ungemach sie treffe und verletze, oben und unten von dichtgesäten Haaren wie von einem Walle ringsum geschützt. Darum flehte der Prophet, da er sichere Hilfe sich erbat: „Schütze mich, Herr, wie des Auges Apfel!“ So sorgfältige und sichere Hut sollte ihm Gottes Schutz sein, wie es dem Augapfel der feste natürliche Schutzwall ist, mit welchem Gott ihn zu schirmen sich würdigte. Zudem werden ja Unschuld und Reinheit schon durch den geringsten Schmutz verletzt und verlieren den Reiz ihrer Anmut. Und darum ist Vorsicht geboten, daß kein Staub der Sünde sie beflecke und kein Splitter der Schuld sie verletze; denn so steht geschrieben: „Zieh erst den Balken aus deinem Auge, und dann sieh zu, daß du den Splitter aus dem Auge deines Bruders ziehest“.</p><p>Der Augen wegen, behaupten daher die Heilkundigen, habe das menschliche Gehirn seinen Sitz im Haupte, den übrigen Sinnen unseres Leibes aber sei umgekehrt des Gehirnes wegen der Platz in dessen Nähe angewiesen. Das Gehirn ist nämlich der Ausgangspunkt des Nervensystems sowie sämtlicher Regungen des freien Bewegungsvermögens, und von da leitet sich der ganze Grund für die eben genannten Vorgänge her.</p><p>Als Quellpunkt des Arteriennetzes sowie der natürlichen Körperwärme, welche die Lebensorgane beseelt und warm erhält, gilt den meisten das Herz. Das Organ für die einzelnen Sinne hingegen sind die Nerven. Sie gehen wie Saiten und Stimmbänder vom Gehirn aus und verzweigen sich durch den ganzen Körper, um so ihren jeweiligen Funktionen zugeleitet zu werden. Das Gehirn ist deshalb weicher als die übrigen Organe, weil es die Sinneseindrücke aufzunehmen hat; desgleichen eben darum auch die Nerven, welche alles vermitteln, was das Auge sieht oder das Ohr hört oder der Geruchsinn einatmet oder die Zunge tönt oder der Mund als schmackhaft empfindet. Für ein Nachempfinden [von Sinneseindrücken] eignet sich nämlich besser ein weiches Organ, zum Handeln hingegen wirksamer ein durch Muskelanspannung irgendwelchee Art steifes Glied.</p><p>Eine ganz vorzügliche Gabe, die dem Gesichte wenig nachsteht, ist auch das Gehör. Die Ohren treten deshalb etwas hervor, damit sie einerseits ihren zierlichen Schmuck zur Schau trügen, andererseits allen Unrat und Schweiß auffingen, der vom Haupte trieft, zugleich endlich, damit sich in ihren Vertiefungen der Schall breche und so ohne Schaden anzurichten in die inneren Gänge dringe. Denn wäre dem nicht so, wer würde nicht bei jedem zu starkem Schallaut betäubt werden. Machen wir doch noch trotz dieser nützlichen Einrichtung die Erfahrung, daß uns häufig durch einen unvermuteten Schall das Gehör verschlagen wird. Als Bollwerke sodann mag man sie betrachten, die gegen grimmige Kälte wie glühende Hitze vorgeschoben sind, daß nicht die Kälte in die offenen Gänge dringe, noch die übergroße Hitze ihre versengende Wirkung äußere. Die Spiralförmigkeit des inneren Ohres aber moduliert rhythmisch und dynamisch den Ton, insofern eben infolge der Krümmungen des Ohres ein gewisser Rhythmus erzeugt wird und der eingedrungene Laut gewisse Modulationen erfährt. Daß außerdem diese Krümmungen den aufgenommenen Laut länger festhalten, lehrt die bloße Erfahrung, insofern in hohlen Bergschluchten oder Felseneinschnitten oder an Flußkrümmungen der Schall dem Ohre süßer tönt und das Echo im Widerhall liebliche Antwort jauchzt. Selbst das Ohrenschmalz ist nicht nutzlos, es bindet den Laut, so daß die Erinnerung daran wie sein Wohlklang länger in uns nachhält.</p><p>Was soll ich nun aber von der Nase sagen? Eine Grotte mit stattlichem Doppeleingange zur Aufnahme der Wohlgerüche, daß der Duft nicht rasch sich verflüchtige, sondern länger in der Nase verbleibe und durch ihren Kanal aufsteigend Gehirn und Sinne ergötze! Länger darum als Worte tönen oder ein Anblick leuchtet, duftet Wohlgeruch fort, den man eingesogen. Gar oft hat man den Duft von etwas, woran man einen kurzen Augenblick gerochen hat, den ganzen Tag in der Nase. Durch diese fließen ferner die unreinen Säfte des Hauptes ab und werden ohne allen Schaden und Nachteil des Leibes fortbefördert.</p><p>Kein unbedeutender Sinn liegt auch im Tastsinn. Und zwar eignet ihm gar köstliches Behagen und richtiges Urteil; denn so manchesmal prüfen wir mit tastender Hand, was wir mit den Augen nicht zu prüfen vermögen.</p><p>Einen recht niedrigen Dienst versehen ferner Mund und Zunge; er führt indes dem ganzen Organismus die nötigen Kräfte zu. Denn es würden die Augen ohne die stoffliche Nährkraft, welche durch Speise und Trank vermittelt wird, das Sehvermögen einbüßen und die Ohren das Gehör und die Nase den Geruch und die Hände das Gefühl, wenn nicht der ganze Organismus durch die Nahrung gestärkt würde. Wir fielen von Kräften, würden wir sie nicht fortwährend mit der nötigen Speise ersetzen. So finden denn auch Leute, die von Hunger ausgezehrt sind, kein Ergötzen an sinnlichen Genüssen, sondern sind teilnahmslos und abgestumpft gegen deren Reize.</p><p>Was soll ich den „Wall der Zähne“ beschreiben, womit die Speise gekaut und das Aussprechen volltönender Laute ermöglicht wird? Wie gäbe es ohne die Zähne einen mundenden Bissen? Sehen wir doch vielfach Leute in der Reife der Jahre gerade deshalb vorzeitig altern, weil sie nach dem Verlust der Zähne keine kräftigere Speise zu sich nehmen können. Das Kindesalter ist darum stumm, weil es noch kein Stimmorgan hat.</p><p>Ebenso leistet die Zunge nicht bloß beim Sprechen, sondern auch beim Essen sehr wertvollen Dienst. Sie ist nämlich für den Sprechenden sozusagen die Laute, und für den Essenden sozusagen die Hand, welche die abgleitende Speise den Zähnen zuführt und unterbreitet. Ihr Wort schwingt sich durch die Luft wie auf einem Fittiche auf und schwebt durch den leeren Raum und schlägt desgleichen mit seinem Schall die Luft, dringt bald mahnend, bald besänftigend an des Hörenden Ohr, beschwichtigt den Erzürnten, richtet den Verzagten auf, tröstet den Leidenden. Mögen wir daher den Wohllaut der Stimme mit den Vögeln gemeinsam haben, welcher Ton indes diesem, welcher jenem gegenüber anzuschlagen ist, das setzt Vernunft voraus, das ist unmöglich allen Wesen die unvernünftigen meine ich gemeinsam. Haben wir doch auch die Sinne mit den übrigen lebenden Wesen gemeinsam: gleichwohl gebrauchen sie die übrigen nicht mit derselben Beflissenheit. Auch das Kalb hebt seine Augen zum Himmel auf, aber es weiß nicht, was es anblickt; die Tiere im Freien heben sie empor, die Vögel heben sie empor, alle erfreuen sich des freien Blickes, doch nur dem Menschen wohnt der Sinn inne, der ihm auslegt, was er schaut. Er betrachtet nachdenklich mit seinen Augen der Gestirne Aufund Niedergang, gewahrt des Himmels Zier, staunt an der Sterne Bälle, kennt desgleichen den unterschiedlichen Lichtglanz eines jeden, [weiß,] wann der Abendstern aufgeht, wann der Morgenstern, warum jener des Abends, dieser des Morgens aufleuchtet, welche Bahnen der Orion, welche Phasen der abnehmende Mond durchläuft, wie die Sonne ihren Niedergang kennt, ebenso Jahr für Jahr in ihrem Umlaufe genau ihre Bahn einhält. Auch die übrigen lebenden Wesen erfreuen sich des Gehöres: doch wer außer dem Menschen gelangte durch Hören zum Erkennen? Von allen Wesen auf Erden dringt nur der Mensch auf dem Wege des Hörens, des Erwägens und Überdenkens zu den Geheimnissen der Weisheit. Nur er spricht: „Hören will ich, was Gott der Herr in mir sprechen wird“. Das ist des Menschen köstlichste Auszeichnung, daß durch seinen Mund Gottes Stimme spricht, daß er mit leiblichen Lippen himmlische Worte ausspricht. So heißt es:„Rufe! Was soll ich rufen? Alles Fleisch ist Gras“. Erst empfing der Prophet, was er sprechen sollte und dann rief er. Sie mögen ihre Weisheit für sich behalten, die mit den Maßstäbchen die Räume des Himmels und der Erde bemessen! Sie mögen ihre Einsicht für sich behalten, von der der Herr spricht: „Die Einsicht der Weisen werde ich verwerfen!“ Weder den Rhythmus der Rede, noch die Weise und die Weisen des Gesanges lasse ich an dieser Stelle für Weisheit gelten, sondern das nenne ich Weisheit, von der auch der Prophet spricht: „Das Unbekannte und Verborgene Deiner Weisheit hast du mir kundgemacht“.</p><p>Was aber soll ich vom Kusse des Mundes sagen, dem Zeichen der Zärtlichkeit und Liebe? Auch die Tauben küssen sich. Doch wie ließe sich das mit dem Liebreiz des menschlichen Kusses vergleichen, dem leuchtenden Wahrzeichen der Freundschaft und Freundlichkeit, dem treuen Ausdruck liebevoller Gesinnung? Darum brandmarkt der Herr an seinem Verräter gleichsam ein Verhalten unerhörter Art, wenn er spricht: „Judas, mit einem Kusse verrätst du den Menschensohn?“ d.i. das Wahrzeichen der Liebe verkehrst du in ein Kennzeichen des Verrates, in ein Anzeichen des Unglaubens? Dieses Band des Friedens mißbrauchst du zum Mittel der Grausamkeit? Nicht sowohl den Freund, welcher der Liebe Unterpfand reichte, als vielmehr den Mörder, der nach Art einer Bestie des Mundes sich bedint, tadelte der Herr mit dem Ausspruche seines göttlichen Mundes.</p><p>Auch das ist ein Vorzug von uns Menschen, daß nur wir den Gefühlen des Herzens mit dem Munde Ausdruckl verleihen und so die heimlichen Gedanken des Geistes mit des Mundes Wort anzeigen können. Was anders ist demnach der Mund des Menschen als gleichsam das Heiligtum der Sprache, der Quell der Rede, der Palast des Wortes, das Magazin des Willens?</p><p>Damit haben wir nun sozusagen die Königsburg des menschlichen Leibes, die zwar an Umfang nur ein Glied desselben ist, an Gestalt aber das Ganze repräsentiert, zu Ende besprochen.</p><p>Es folgt die Gurgel, durch welche dem ganzen Körper der Lebensbedarf und die Luftzufuhr vermittelt wird. Dann kommen die Arme und die kraftschwellenden Armmuskeln, sowie die arbeitskräftigen, mit ihren langgestreckten Fingern zum Halten geeigneten Hände. Sie ermöglichen eine erhöhte Arbeitsleistung, sie ermöglichen eine zierliche Schrift und jenen „Griffel des hurtigen Schreibers“, der die Aussprüche des göttlichen Mundes widergibt. Die Hand ist es, welche die Speise zum Munde führt. Die Hand ist es, die durch herrliche Taten sich auszeichnet; die als Mittlerin der göttlichen Gnade zum Altare ausgestreckt wird; mittels der wir die himmlischen Geheimnisse darbringen und empfangen. Die Hand ist es, welche die göttlichen Mysterien zugleich setzt und spendet; deren Namen der Sohn Gottes als Selbstbezeichnung nicht verschmähte, indem David beteuert: „Die Rechte des Herrn hat Macht gewirkt, die Rechte des Herrn hat mich erhöht“. Die Hand ist es, die alles gemacht, wie Gott der Allmächtige es bezeugt hat: „Hat nicht dies alles meine Hand gemacht?“ Die Hand ist die Schutzwehr des ganzen Körpers, des Hauptes Schirmerin. Ob sie auch ihren Platz ziemlich unten einnimmt: sie kämmt den ganzen Scheitel und ziert das Haupt mit ehrbarem Schmucke.</p><p>Wer fände geziemende Worte zur Besprechung des Brustkorbes und der Weichmasse des Bauches? Anders nämlich könnten die Weichteile im Innern nicht warm gehalten werden und würde der Bausch der Eingeweide zweifelsohne von den harten Knochen verletzt werden. Was wäre so heilsam wie die unmittelbare Verbindung der Lunge mit dem Herzen, derzufolge das Herz, wenn es in Zorn und Unwillen entbrennt, durch das Blut und die Feuchtigkeit der Lunge rascher gedämpft wird. Auch weich ist die Lunge; sie ist nämlich stets von Flüssigkeit durchtränkt und soll zugleich die Starrheit des Unwillens erweichen.</p><p>Über diese Organe gehen wir deshalb rasch hinweg, um uns als Nichtfachleute, die nur das Nächstliegende streifen, nicht als Heilkundige zu gerieren, die dem genauer nachforschen und nachgehen müssen, was im heimlichen Inneren der Natur verborgen ist.</p><p>Der Milz ferner kommt die Nachbaraschaft der Leber zunutze. Sie scheidet nämlich bei Aufnahme der Nahrungsstoffe alle unreinen Bestandteile, auf die sie stößt, aus; so können durch die feineren Poren der Leber nur jene zarten und winzigen Speiseteile hindurchdringen, die sich in Blut überführen lassen und zur Kräftigung dienen, nicht aber mit den Exkrementen des Darmes ausgeschieden werden.</p><p>Die Windungen der Gedärme aber, die ineinander geschlungen dennoch keineswegs sich verknüpfen: wovon anders zeugen sie als von der Fürsorge des Schöpfers? Es soll die genossene Speise nicht zu rasch abgehen und sogleich aus dem Magen austreten. Wäre nämlich das der Fall, würde ständiger Hunger und fortwährende Eßgier beim Menschen sich einstellen. Sobald mit dem augenblicklichen Abgange der Speisen die Gedärme vollständig entleert wären, würde ein unstillbares und unersättliches Verlangen nach Speise und Trank die notwendige Folge sein, dem ohne Zweifel ein sofortiger Tod folgen müßte. Vorsorglich wird darum die genossene Speise erst in der oberen Bauchhöhle verdaut, sodann in der Leber zersetzt. Durch deren Wärme ausgesondert, teilt sich ihr Saft den übrigen Körperteilen mit; er wird der Nährstoff für die menschlichen Glieder, den junge Leute zum Wachstum, alte zur Selbsterhaltung aufnehmen. Die übrigen Stoffe aber werden durch die Gedärme weiter befördert und durch jene „Öffnung an der Rückseite“ ausgeschieden.</p><p>Es wird ja auch in der Genesis die Arche Noes nach dem Bau des menschlichen Leibes angeordnet. Es verfügte nämlich Gott beszüglich derselben: „Mach dir eine Arche aus gezimmertem Holze. Und Zellen sollst du in ihr fertigen und sie innen und außen mit Pech verpichen. Und also sollst du die Arche machen“. Ferner: „Eine Öffnung aber sollst du anbringen an der Rückseite, die unteren Räume der Arche aber mit je zwei und drei Kammern ausstatten“. Damit nun weist der Herr auf die Öffnung hin, welche an der Rückseite sich befindet und durch welche die überflüssigen Speisereste ausgeschieden werden sollen. Aus Gründen der Schicklichkeit entzog nämlich unser Schöpfer den Abgang der Überreste dem Auge des Menschen: wir sollten während des Vorganges unseren Blick nicht verunreinigen. Zugleich beachte, wie die Schamteile des Körpers dort angebracht sind, wo sie von der Kleidung bedeckt, keinen Anstoß erregen können.</p><p>Der Adern Pulschlag kündet Krankheit oder Gesundheit. Durch den ganzen Körper verzweigt, liegen sie doch einerseits nicht offen und bloß, sind aber andererseits nur mit einer so dünnen Schicht überdeckt, daß man sie leicht finden und rasch fühlen kann, nachdem eine dicke nicht da ist, die den Puls verdecken könnte. Auch die Knochen sind samt und sonders von einer dünnen Masse umhüllt und von Sehnen umzogen, insbesondere sind die des Hauptes mit einer leichten Hautmasse umgeben und, um einigen Schutz gegen Regen und Kälte zu bieten, mit dichterem Haarwuchse nelöeidet.</p><p>Was brauche ich der Genitalien Erwähnung tun, die durch Äderchen, welche von der Nackengegend ausgehend durch Nieren und Lenden führen und den Geschlechtssamen zur Betätigung und Befriedigung des Zeugungstriebes aufnehmen?</p><p>Wozu der Füße Dienst hervorheben, welche den ganzen Körper tragen ohne im geringsten unter dessen Last zu leiden? Biegsam ist das Knie, das mehr denn alles andere den beleidigten Herrn zur Milde stimmt, seinen Zorn besänfftigt, seine Huld erzwingt? Das ist ja des höchsten Vaters Geschenk an seinen Sohn, „daß im Namen des Herrn alle das Knie beugen im Himmel und auf Erden und unter der Erde, und jede Zunge bekennt, daß der Herr Jesus in der Herrlichkeit Gottes des Vaters ist“. Zwei Dinge nämlich sind es, die vor allem anderen Gott gefallen: Demut und Glaube. Der Fuß nun bringt die demütige Gesinnung und die emsige Dienstbeflissenheit zum Ausdruck, der Glaube schaut den Sohn gleich dem Vater und bekennt, daß beider Herrlichkeit die gleiche ist. Mit Recht aber hat der Mensch nicht eine größere Anzahl von Füßen, sondern nur zwei. Die wilden Tiere nämlich und Bestien haben vier Füße; die Vögel haben zwei: so ist der Mensch wie ein Vogel, der seinen Blick zur Höhe richten und mit der Schwungkraft erhabener Gesinnung wie mit Fittichen sich aufschwingen soll. Darum das Wort, das auf ihn gesprochen ist: „Erneuen soll sich, wie die des Adlers, deine Jugend!“ Näher als der Adler ist dem Himmel und an Hochflug ihn überholend, wer sprechen kann: „Unser Wandel aber ist im Himmel“.</p><p><strong>Vom Ruhen Gottes im gerechten Menschen im allgemeinen, in der Menschheit Christi im besonderen.</strong></p><p>Doch jetzt zum Schluß unseres Vortrages! Schon ist ja der sechste Tag vorüber und die Weltschöpfung ihrem vollen Umfange nach abgeschlossen, nachdem der Mensch fertig da ist, der in sich die Herrschaft über alle lebenden Wesen trägt, gleichsam summarisch das Universum verkörpert und die Schönheit der ganzen Weltschöpfung widerspiegelt. Ja, wir wollen Ruhe geben; denn auch Gott „ruhte aus von allen Werken der Welt“. Er ruhte aber im Inneren des Menschen, er ruhte in dessen Geist und Willen; denn er hatte den Menschen zu einem vernunftbegabten Wesen gemacht, zu seinem eigenen Nachbilde, zu einem Eiferer in der Tugend, zu einem Streber nach den himmlischen Gnaden. Nur in solchen ruht Gott, der spricht: „Oder über wem anders werde ich ruhen als über dem Demütigen und Friedfertigen und dem, der meine Worte fürchtet?“</p><p>Ich danke dem Herrn, unserem Gott, der ein solches Geschöpf geschaffen hat, in welchem er ruhen konnte. Den Himmel hat er geschaffen: ich lese nicht, daß er ruhte. Die Erde hat er geschaffen, ich lese nicht, daß er ruhte. Die Sonne und den Mond und die Sterne hat er geschaffen: auch da lese ich nicht, daß er ruhte. Wohl aber lese ich, daß er den Menschen geschaffen und dann geruht habe, indem er ein Geschöpf hatte, dem er die Sünden verzeihen konnte. Oder es hatte schon damals ein geheimnisvoller Hinweis auf das künftige Leiden des Herrn statt; denn da ward das Ruhen Christi im Menschen offenbar: er nahm sich nämlich die [Todes]Ruhe im Leibe zur Erlösung des Menschen zum voraus vor, wie er selbst bezeugt hat: „Ich schlief und ruhte und stand auf, weil der Herr mich aufnahm“. Er, der Schöpfer, ruhte. Ihm ist Ehre, Ruhm und Unsterblichkeit von Ewigkeit und jetzt und immerdar und in alle Ewigkeiten der Ewigkeiten. Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Joh. Ev. Niederhuber, <em>Exameron</em> (Bibliothek der Kirchenväter). Text nach <a href="https://bkv.unifr.ch/de/works/cpl-123/versions/exameron-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "hRFw_О_покаянии_две_книги"
    path: "Ambrosius_De_paenitentia"
    title: "Über die Buße"
    menu: { parent: "Moralisch-asketische Werke", title: "Über die Buße", priority: 1 }
    update: true
    body: |-
      <p><em>Über die Buße, übersetzt von Franz Xaver Schulte (Bibliothek der Kirchenväter).</em></p><h2>Buch Buch</h2><h2>0</h2><p>Wenn das letzte und höchste Ziel aller Tugend dahin geht, dem geistigen Nutzen des Nebenmenschen in möglichster Ausdehnung zu dienen, so darf man als eine der schönsten Tugenden das milde Maßhalten bezeichnen, welches nicht einmal diejenigen verletzen will, die seiner Verurtheilung unterliegen, während es dieselben gleichzeitig gerade durch die Verurtheilung wieder der Lossprechung würdig zu machen strebt. Diese Milde ist es einzig, welcher die Kirche, die der Herr in seinem Blute gestiftet hat, ihre Ausbreitung verdankt. Sie ahmt den himmlischen Wohlthäter nach; indem sie auf die Rettung Aller bedacht ist, verfolgt sie jenes heilbringende Ziel mit einer Milde, daß die Herzen nicht zurückweichen, die Geister nicht erschrecken können.</p><p>In der That muß ja auch derjenige, welcher die Fehler menschlicher Schwäche bessern will, diese Schwäche selbst ertragen; er muß sie gewissermaßen auf seine Schultern legen, nicht aber verdrießlich abwerfen. Lesen wir doch auch, daß jener Hirt des Evangeliums das verirrte, müde Schaf heimgetragen, aber nicht abgeworfen habe. Darum sagt auch Salomon: „Sei nicht allzu gerecht“, denn weises Maßhalten muß die Gerechtigkeit sänftigen. Wie möchte sich sonst Jemand dir zur Heilung anvertrauen, wenn du ihm Widerwillen entgegenbringst, wenn er glauben muß, daß er seinem Arzte nicht Mitleid, sondern Verachtung einflößt?</p><p>Deßhalb hat der Herr Jesus Mitleid mit uns getragen, um uns nicht abzuschrecken, sondern zu sich zu rufen. Er kam voll Sanftmuth und Demuth, und so sprach er: „Kommet zu mir Alle, die ihr mühselig und beladen seid, ich will euch erquicken.“ Der Herr Jesus erquickt die Mühseligen, er weis’t sie nicht zurück; darum hat er denn auch solche Jünger sich erwählt, die im richtigen Verständnisse seines göttlichen Willens das Volk Gottes sammeln, aber nicht zurückstoßen. Es erhellt somit, daß diejenigen nicht als Christi Jünger gelten können, welche der Meinung sind, daß man harten und stolzen Grundsätzen statt milder und demüthiger folgen müsse. Sie verweigern ja Anderen die Barmherzigkeit des Herrn, während sie selbst sie suchen: so sind die Lehrer der Novatianer, welche sich als „die Reinen“ bezeichnen.</p><p>Kann es denn ein stolzeres Treiben geben, da doch die Schrift sagt: „Niemand ist rein von Schuld, nicht einmal das Kind von einem einzigen Tage;“ während David ausruft: „Von meiner Missethat reinige mich!“ Sind denn diese Menschen etwa heiliger als David, aus dessen Geschlecht der Herr im Geheimniß der Menschwerdung hat wollen geboren werden? dessen Tochter jenes himmlische auserwählte Gefäß ist, das im jungfräulichen Schooße den Heiland der Welt empfangen hat? Gibt es denn etwas Härteres, als Buße aufzulegen, ohne Nachlaß zu gewähren? Nimmt man denn nicht den Antrieb zur Buße hinweg, wenn man immerfort die Verzeihung versagt? Kann doch füglich keiner Buße thun, der nicht auf Verzeihung hofft!</p><h2>0</h2><p>Diese Irrlehrer bestreiten, daß diejenigen zur kirchlichen Gemeinschaft wieder dürfen zugelassen werden, welche durch Verleugnung ihres Glaubens gefallen sind. Wenn sie lediglich das Verbrechen des Sacrilegiums ausnähmen und ihm die Verzeihung versagten, so wäre das zwar hart und würde auch durch göttliche Aussprüche als durchaus falsch verworfen: es stimmte aber doch wenigstens mit ihren eigenen sonstigen Behauptungen überein. Der Herr, welcher alle Sünden vergeben hat, nahm kein Verbrechen aus. Da Jene aber nach Art der Stoiker annehmen, daß alle Sünden hinsichtlich ihrer Schwere als unter sich gleich zu betrachten seien, und daß also Jemand, der einen Haushahn, ebenso wie derjenige, welcher seinen Vater erdrosselt, für immer von den heiligen Geheimnissen fern zu halten sei: wie greifen sie jetzt ein einziges Verbrechen heraus, während sie doch selbst nicht leugnen können, daß es geradezu unerträglich sein würde, wenn die Strafe einiger Weniger — der Abgefallenen nämlich — auf Viele sich ausdehnte?</p><p>Sie sagen freilich, daß sie dem Herrn eine ganz besondere Verehrung entgegenbringen, wenn sie ihm ausschließlich die Macht, Sünden zu vergeben, vorbehalten. In Wirklichkeit kann aber Niemand Gott größere Schmach anthun, als derjenige, welcher Gottes Aufträge einschränken und das von ihm übertragene Amt wirkungslos machen möchte. Wenn der Herr Jesus selbst gesagt hat: „Empfanget den heiligen Geist; denen ihr die Sünden erlasset, denen sind sie erlassen; denen ihr sie behaltet, denen sind sie behalten;“ wer ehrt ihn dann mehr: derjenige, welcher seinen Weisungen Folge leistet, oder derjenige, welcher sich denselben widersetzt?</p><p>Die Kirche übt nach beiden Seiten den rechten Gehorsam, sowohl wenn sie bindet, als wenn sie löset. Der Irrthum dagegen zeigt sich in dem einen Falle hart, in dem anderen ungehorsam: er will binden, was er nicht lösen mag; er will nicht lösen, was er gebunden hat, und so richtet er sich durch seinen eigenen Urtheilsspruch. Der Herr wollte, daß das Recht zu lösen und zu binden neben einander bestehe, und darum hat er beides unter der gleichen Voraussetzung der Gegenseitigkeit verliehen. Wer darnach nicht das Recht hat, zu lösen, der hat auch nicht das Recht, zu binden. So erstickt denn die Lehre jener Irrlehrer sich in sich selbst: da sie sich das Recht zu lösen absprechen, so müssen sie sich auch das Recht zu binden versagen. Oder wie kann das Eine ihnen gestattet, das Andere verwehrt sein? Es ist doch unzweifelhaft sicher, daß denjenigen, welchen Beides übertragen wurde, entweder beides oder keines zusteht. So ist es: der Kirche steht beides, dem Irrthum steht keines zu, weil das Recht einzig den Priestern verliehen wurde. Die Kirche nimmt darnach mit Recht beides für sich in Anspruch, weil sie wahre Priester hat: der Irrthum, der keine Priester Gottes hat, kann Nichts beanspruchen. Gerade dadurch, daß er keine von beiden Vollmachten beansprucht, bekennt er aber von sich selbst, daß er, eben weil er keine Priester hat, auch nicht berechtigt ist, ein priesterliches Amt für sich zu beanspruchen. So tritt uns in schamloser Verstocktheit ein recht schämiges Bekenntniß entgegen.</p><p>Dabei ist noch besonders zu beachten, daß derjenige, welcher den heiligen Geist empfing, auch die Vollmacht erhielt, Sünden zu vergeben und zu behalten. So sprach der Herr: „<em>Empfanget den heiligen Geist</em>; denen ihr die Sünden nachlasset, denen sind sie nachgelassen; denen ihr sie behaltet, denen sind sie behalten.“ Wer also die Lösegewalt nicht besitzt, der hat auch den heiligen Geist nicht. Das Amt des Priesters ist eine Gabe des heiligen Geistes, und dessen Recht besteht gerade im Nachlassen oder Behalten der Sünden: wie können nun diejenigen die Gabe des heiligen Geistes beanspruchen, die dem Rechte und der Macht desselben mißtrauen?</p><p>Kann es denn nun anmaßendere Menschen geben? Obwohl der Geist Gottes geneigter zum Erbarmen als zum Strafen ist, wollen sie doch das nicht, was er nach seinem eigenen Worte will, während sie das, was er nicht will, thun. Und doch ist es Sache der Gerechtigkeit, zu strafen, während der Barmherzigkeit Verzeihen geziemt. Immerhin also, Novatian, wäre es erträglicher, wenn du statt der Binde- die Lösegewalt dir beilegtest: einmal würde die Anmaßung und in Folge dessen das Vergehen geringer sein, zum Anderen wäre zu beachten, daß du eben durch Mitleiden mit der Niederlage des Sünders dich zur Gewährung der Verzeihung hättest bestimmen lassen.</p><h2>0</h2><p>Die Novatianer sagen nun, daß sie, mit Ausschluß freilich der schwereren Verbrechen, den leichteren Verzeihung gewähren. In diesem Punkte kann aber Novatian, der bekanntlich annahm, daß <em>Niemand</em> zur Bußübung zuzulassen sei, nicht als Urheber des Irrthums gelten, antworte ich ihnen. Er ging von der Betrachtung aus, daß er da nicht binden dürfe, wo er nicht lösen könne, um es zu vermeiden, daß Jemand eben wegen der Zulassung zur Buße auch die Lossprechung von ihm zu erlangen hoffe. Darin also verurtheilt ihr eueren Vater durch euere eigene Meinung, nach welcher ein Unterschied der Sünden derart zulässig erscheint, daß ihr die einen nachlassen zu dürfen glaubt, während ihr die anderen keines Heilmittels fähig erachtet. Gott aber, der seine Erbarmung Allen erweiset, und der den Priestern die Macht, Sünden nachzulassen, ohne jede Einschränkung gegeben hat, — Gott macht keinen derartigen Unterschied bei den Sünden. Wer freilich die Sünden anhäuft, der muß auch die Buße mehren, und größere Vergehen werden auch durch reichere Ströme der Bußthränen abgewaschen. So findet weder Novatian Bestätigung, der Allen die Verzeihung verschließt; noch findet ihr, die ihr seine Nachfolger und Verurtheiler zugleich seid, Zustimmung: denn ihr vermindert den Bußeifer, wo er müßte vermehrt werden, da Christi Barmherzigkeit es so geordnet hat, daß schwerere Sünden auch härter gebüßt werden.</p><p>Was ist das aber doch für eine Verkehrtheit, daß ihr für euch dasjenige herausnehmt, was vergeben, und daß ihr Gott das belasset, was nicht vergeben werden kann? Das heißt ja, für sich die Gegenstände des Erbarmens vorwegnehmen und Gott die Rolle des strengen Bestrafers überlassen. Und wie verhält es sich denn mit jenem Worte der Schrift: „Gott ist wahrhaftig, jeder Mensch aber ein Lügner, wie geschrieben steht: Auf daß du gerecht befunden werdest in deinen Worten und den Sieg erhaltest, wenn du gerichtet wirst?“ Damit wir selbst wohl erkennen, daß Gott mehr zum Erbarmen neigt, als er an der Strenge festhält, hat er gesagt: „Barmherzigkeit will ich lieber als Brandopfer.“ Wie kann denn nun euer Opfer Gott wohlgefällig sein, da ihr seine Barmherzigkeit leugnet; während er doch selbst sagt, daß er nicht den Tod des Sünders, sondern seine Bekehrung wolle?</p><p>Der Apostel erklärt uns das: „Gott sandte seinen Sohn in der Aehnlichkeit des Fleisches der Sünde und zwar wegen der Sünde, und so verurtheilte er die Sünde im Fleische, damit die Rechtfertigung des Gesetzes in uns erfüllt würde.“ Er sagt nicht: „in der <em>Aehnlichkeit</em> des Fleisches“, weil Christus die Wirklichkeit, nicht bloß die Aehnlichkeit des menschlichen Fleisches angenommen hat; er sagt auch nicht, „in der Aehnlichkeit der <em>Sünde</em>“, weil der Herr nie eine Sünde begangen hat, sondern zur Sünde für uns geworden ist. Nein, er kam „in der Aehnlichkeit des Fleisches der Sünde“, d. h. er nahm die Aehnlichkeit des sündigen Fleisches an: die „Aehnlichkeit“ aber, weil geschrieben steht: „Es ist ein Mensch, und wer wird ihn erkennen?“ Er war Mensch im Fleische nach Menschenart, so daß er erkannt wurde. Aber er war an Kraft weit über den Menschen hinaus, so daß er nicht erkannt wurde. So hat er also hier unser Fleisch angenommen, aber die Sünden dieses Fleisches hat er nicht angenommen.</p><p>Nicht wie jeder andere Mensch ist ja der Herr geworden; nein, er ist geboren vom heiligen Geiste aus der Jungfrau Maria, und so hatte er einen makellosen Leib empfangen, den nie eine Sünde befleckt hat, der auch in seinem Entstehen nicht von der leisesten Makel des Fleisches berührt ist. Alle Menschen werden sonst unter dem Gesetze der Sünde geboren, wie David gesagt hat: „Siehe in Ungerechtigkeit bin ich empfangen, in Sünden hat mich geboren meine Mutter.“ Deßhalb spricht Paulus von dem Leibe des Todes, wenn er sagt: „Wer wird mich retten aus dem Leibe dieses Todes?“ Christi schuldloses Fleisch hat also die Sünde verurtheilt, die bei der Geburt ihn nicht berührte, die er sterbend gekreuzigt hat, so daß nun in unserem Fleische die Rechtfertigung durch die Gnade war, während vorher der Augenblick unseres Werdens nicht ohne Schuld war.</p><p>Was anders sollen wir nun dazu sagen, als was der Apostel gesagt hat: „Wenn Gott für uns ist, wer ist wider uns? Er, der selbst seines eigenen Sohnes nicht geschont, sondern ihn für uns alle dahingegeben hat; wie sollte er uns nicht Alles mit ihm geschenkt haben? Wer wird die Auserwählten Gottes anklagen? Gott, der gerecht macht? Wer wird verurtheilen? Christus Jesus, der gestorben ist, ja, der auch auferstanden ist, der zur rechten Hand Gottes sitzet, der auch fürbittet für uns?“ Diejenigen, für welche Christus Fürbitte einlegt, klagt also Novatian an. Diejenigen, welche Christus zum Leben erlöst hat, die verurtheilt Novatian zum Tode. Denjenigen, zu welchen Jesus gesagt hat: „Nehmet mein Joch auf euch, und lernet von mir, denn ich bin sanftmüthig,“ ruft Novatian zu: „Ich bin ohne Erbarmen, ohne Sanftmuth.“ Denjenigen, zu welchen Christus sagt: „Ihr werdet Ruhe finden für eure Seelen, denn mein Joch ist sanft und meine Bürde ist leicht,“ legt Novatian ein schweres und hartes Joch auf.</p><h2>0</h2><p>Obgleich das Gesagte uns schon hinreichend belehrt, wie sehr der Herr Jesus zum Erbarmen geneigt ist, so möge er doch mit jenen Worten uns belehren, mit denen er uns dem Schreckenseindruck der Verfolgung gegenüber unterweisen wollte. „Fürchtet nicht diejenigen,“ sagt er, „welche den Leib tödten, die Seele aber nicht tödten können: fürchtet vielmehr denjenigen, der Leib und Seele zugleich in die Hölle stürzen kann.“ Und weiter: „Jeden, der mich bekennen wird vor den Menschen, den werde auch ich bekennen vor meinem Vater, der im Himmel ist. Wer aber mich vor den Menschen verleugnet hat, den werde auch ich verleugnen vor meinem Vater, der im Himmel ist.“</p><p>Wo er sagt: „Ich werde bekennen,“ da tritt er für Alle ein, da umfaßt er Alle; wo er sagt: „Ich werde verleugnen,“ da schließt er nicht Alle ein. Da er zuerst sagt: „<em>Jeden</em>, der mich bekennet, den werde ich bekennen,“ sollte man erwarten, daß er auch ferner sagte: „<em>Jeder</em>, der mich verleugnet.“ Damit es nicht den Anschein gewänne, als meine er auch hier <em>Alle</em>, so fügt er weniger bestimmt hinzu: „Wer aber mich verleugnet, den werde ich verleugnen.“ Die Gnade verspricht er Allen, aber er droht keineswegs Allen die Strafe an. Das Erbarmen dehnt er aus, das Rächen schränkt er ein.</p><p>Dabei ist zu bemerken, daß das nicht allein in dem Evangelium des heiligen Matthäus, sondern auch in dem des heiligen Lukas sich aufgezeichnet findet: wir sollen eben erkennen, daß beides nicht obenhin, ohne Grund gesagt ist.</p><p>Haben wir so das Wort der Schrift uns vorgeführt, so erfassen wir jetzt den Sinn der Worte! „<em>Jeder</em>, der mich bekennen wird,“ sagt er, d. h.: „In welchem Alter, in welcher Lebensstellung mich Jemand bekennen wird, der wird der Vergeltung, daß ich auch ihn bekenne, nicht entbehren.“ Wenn er sagt: „Jeder“, so wird Keiner von der Belohnung ausgeschlossen, der ihn bekannt hat. Dagegen wird keineswegs <em>in gleicher Weise</em> Jeder, der ihn verleugnet hat, auch wieder verleugnet; kann es ja doch geschehen, daß Jemand, überwältigt durch die Qualen, mit dem Munde ihn verleugnet, während er ihn im Herzen anbetet.</p><p>Ist denn die Sachlage ganz gleich bei demjenigen, der aus sich selbst, so ganz ohne äußere Veranlassung den Herrn verleugnet, und demjenigen, den die Qualen, nicht der eigene Wille zu diesem Verrathe gegen Gott gebracht haben? Wie unzulässig wäre das, wenn bei den Menschen milde Nachsicht im Kampfe gelten sollte, während Gott dem Herrn gleiche Milde abgesprochen wird? Pflegt doch oftmals das Volk bei den Gladiatorenkämpfen auch die Besiegten, wenn ihr Kampf Billigung fand, zugleich mit den Siegern mit dem Siegeskranze zu belohnen; zumal dann, wenn man erkannt, daß sie durch List oder Betrug des Sieges verlustig wurden. Wird denn nun Christus zugeben, daß seine treuen Kämpfer, die er unter wuchtigen Qualen für einen Augenblick erliegen sah, ganz ohne Verzeihung bleiben?</p><p>Sollte der Herr, der selbst die, welche er verstößt, nicht für ewig verstößt, ihr Mühen und Kämpfen denn nicht in Anschlag bringen? Sagt doch David: „Nicht ewiglich wird der Herr verstoßen“ und der Irrthum sagt dagegen: „Er wird doch ewiglich verstoßen?“ „Nicht für immer wird er sein Erbarmen zurückziehen von Geschlecht zu Geschlecht, nicht für immer wird Gott vergessen gnädig zu sein.“ So der königliche Sänger, und es gibt Menschen, die Gottes Erbarmen eindämmen wollen?</p><h2>0</h2><p>Die Irrlehrer behaupten freilich, daß sie nur um deßwillen ihre Meinung aufrecht halten, damit sie den Schein vermeiden, Gott als wandelbar hinzustellen, sofern er nämlich denjenigen Verzeihung gewähre, denen er doch vorher gezürnt habe. Aber wie? sollen wir die ewigen Gottessprüche zurückweisen und den Meinungen dieser Menschen folgen? Gott ist doch nicht nach fremden Meinungen, sondern nach seinen eigenen Worten zu beurtheilen. Welches sprechendere Zeugniß seines Erbarmens können wir anführen, als daß er selbst beim Propheten Osee denen, welchen er in seinem Zorne Strafe androhte, alsbald wieder versöhnt Verzeihung ankündigt? Zuerst sagt er: „Was soll ich dir thun, Ephraim? was soll ich dir thun, Juda? da eure Liebe ist wie Morgengewölk und wie der Thau, der frühe davon geht.“ Dann aber sagt er später: „Wie könnte ich dich hingeben, Ephraim, dich preisgeben Israel? ich könnte dich hingeben, wie Adama und Seboim.“ Mitten in seinem Zorne hält er inne, wie überwältigt von väterlichem Erbarmen, und erwägt, wie er den Irrenden zur Buße führen möchte. Wie sehr Juda auch schuldig ist, geht Gott doch mit sich selbst zu Rathe. Er sagt: „Ich könnte dich hingeben, wie Adama und Seboim,“ wie jene Städte, welche, Sodoma benachbart, auch gleiches Schicksal, gleichen Untergang erlitten; aber er fügt alsbald hinzu: „Umgewandt hat in mir sich mein Herz, mit eins ist erregt mein Mitleiden. Nicht werde ich ausführen meines Zornes Gluth.“</p><p>Scheint es nicht, als ob der Herr Jesus uns sündigen Menschen nur deßhalb zürnt, um uns durch die Furcht vor seinem Zorne zu bekehren? So ist denn sein Unwille nicht die Ausführung seiner Rache, sondern vielmehr die Vorbereitung der Verzeihung: denn so hat er gesagt: „Wenn du umkehrest und in Reueschmerz seufzest, wirst du gerettet werden.“ Er erwartet unser Seufzen hier in der Zeit, damit er es in der Ewigkeit uns erlassen, er erwartet unsere Thränenströme, damit er seine Milde über uns ergießen kann. So hat er im Mitleid mit den Thränen jener verwittweten Mutter im Evangelium den Sohn derselben wieder erweckt. Er erwartet unsere Umkehr, damit er selbst sich wieder zur Gnade wende. In uns würde die Gnade dauernd bleiben, wenn kein Sündenfall sich in unsere Seele einschliche; da wir aber durch unsere Sünden ihn beleidigen, zeigt er sich unwillig, damit wir gedemüthigt werden. Wir werden aber gedemüthigt, damit wir mehr der Erbarmung als der Strafe würdig erscheinen.</p><p>Auch das Wort des Propheten Jeremias möge zur Belehrung dienen: „Nicht auf ewig verwirft der Herr; denn wenn er auch betrübet hat, so erbarmt er sich doch nach der Menge seiner Erbarmungen; nicht mit Lust demüthigt und verwirft er die Menschenkinder.“ Aus dem, was auf diese Worte folgt, dürfen wir dann schließen, daß gerade deßhalb der Herr „alle Gefangenen des Landes unter seine Füße erniedrigt“, damit wir seinem Strafurtheile entgehen. Wahrlich nicht freudig und mit Lust erniedrigt er den Sünder bis zur Erde, da er ja von der Erde aufrichtet den Schwachen und aus dem Staube erhebt den Armen. Nicht mit Lust erniedrigt derjenige, der sich die Verzeihung vorbehält.</p><p>Wenn er nun überhaupt nicht mit Lust den Sünder demüthigt, um wie viel mehr trifft das bei demjenigen zu, der gleichfalls nicht mit voller Herzenshingabe gesündigt hat! Wenn er von den Juden sagte: „Dieses Volk ehret mich mit den Lippen, aber ihr Herz ist weit von mir entfernt,“ dann sagt er vielleicht von manchen Gefallenen: „ Sie haben mit den Lippen mich verleugnet, aber im Herzen sind sie mit mir vereint. Die Qual hat diese Armen überwältigt, keineswegs hat Treulosigkeit sie verführt.“ Und doch verweigern Manche diesen die Verzeihung, während ihr Verfolger selbst für ihren treuen Glauben Zeugniß abgelegt hat, indem er durch Marter und Qualen ihn zu brechen versuchte. Sie haben <em>einmal</em> den Herrn verleugnet, <em>aber seitdem bekennen sie ihn tagtäglich</em>; einmal haben sie ihn verleugnet im Worte, aber seitdem bekennen sie ihn mit ihren Seufzern und Klagerufen, mit ihren Thränen und mit Worten, die freiwillig dem Herzen entströmen, die nicht erzwungen sind. Sie sind freilich auf kurze Zeit der Versuchung des Teufels erlegen: aber bald nachher hat der Teufel wieder von ihnen weichen müssen, da er sie als sein Eigenthum nicht erwerben konnte. Er hat vor ihren Thränen, ihrer Buße weichen müssen; er hatte sich in sie hineingeschlichen, da sie ihm nicht gehörten, er hat sie wieder verloren, nachdem sie sein gewesen.</p><p>Verhält sich das nicht genau so, als wenn ein Eroberer die Bewohner einer bezwungenen Stadt gefangen hinwegführt? Sie werden gefangen hinweggeführt, aber gegen ihren Willen. Gezwungen wandern sie dem fremden Lande zu, aber ihr Herz zieht nicht mit, es eilt zur Heimat zurück und sinnt auf Mittel, dorthin den Weg wieder zu finden. Und wenn sie nun heimkehren, wer kann dann rathen, sie nicht wieder aufzunehmen? Ihre Ehre mag in etwas gemindert sein, aber ihr Eifer ist nur um so größer und hingebender, Alles zu vermeiden, was der Feind gegen sie ausbeuten könnte. Während du dem Bewaffneten, der noch kämpfen konnte, verzeihest, willst du dem nicht verzeihen, in dem einzig der Glaube kämpfte.</p><p>Und wenn wir die Meinung des Teufels selbst über diese Gefallenen erforschen wollten, scheint es nicht, als müßte er sagen: „Dieses Volk ehrt mich mit den Lippen, aber ihr Herz ist weit von mir entfernt. Wie kann es mit mir halten, während es von Christus nicht gewichen ist? Die scheinen zu Unrecht mich zu ehren, welche die Lehre Jesu befolgen: ich aber glaubte, daß sie meine Lehre verkündigten“? Sie verurtheilen in der That nur noch mehr und schärfer, wovon sie sich nach trauriger Erfahrung abgewandt haben. Wenn Jesus sie bei ihrer Rückkehr wieder aufnimmt, so wird er in ihnen nur um so mehr verherrlicht. Alle Engel jubeln; denn es ist im Himmel mehr Freude über einen Sünder, der Buße thut, als über neunundneunzig Gerechte, die der Buße nicht bedürfen. „Ueber mich“, muß der Teufel bekennen, „wird so im Himmel, wie auf Erden triumphirt. Nichts geht doch Christus verloren, da diejenigen, welche in den Thränen ihrer Martern zu mir kamen, sehnsuchtsvoll zur Kirche zurückeilen. Durch ihr Beispiel laufe ich obendrein noch Gefahr, auch die zu verlieren, welche sich mir verschrieben haben, und welche nun zu der Einsicht gekommen sind, daß hier, wo die Menschen mit Belohnung der Gegenwart verlockt werden, doch eigentlich Nichts ist; daß dort aber gar viel sein muß, wo Seufzen, Thränen, Fasten und Abtödtungen meinen Ueppigkeitsmahlen vorgezogen werden.“</p><h2>0</h2><p>Diese nun schließet ihr Novatianer aus? Oder ist das etwa nicht ausschließen, wenn ihr ihnen die Hoffnung auf Verzeihung versagt? Aber der Samaritaner ging doch an dem Menschen, den die Räuber halbtodt hatten liegen lassen, nicht mitleidslos vorüber! Nein, er träufelte Oel und Wein in seine Wunden, Oel zuerst, um sie zu erquicken. Dann lud er den Verwundeten auf sein Lastthier: so trug er stets alle Seelenwunden der Sünder hinweg. Auch der gute Hirt verachtete nicht das verirrte Schaf.</p><p>Ihr aber saget: „Rühre mich nicht an!“ Ihr, die ihr euch gerne gerecht machen wollet, ihr saget: „Es ist nicht unser Nächster.“ So seid ihr noch stolzer, als jener Gesetzesgelehrte, der den Herrn versuchen wollte und sprach: „Wer ist mein Nächster?“ Dieser <em>fragte</em> doch nur, ihr leugnet es geradezu. Jenem Priester vergleichbar schreitet ihr einher, wie jener Levit geht ihr vorüber an dem, welchen ihr zur Heilung aufnehmen müßtet; ihr nehmet in die Herberge, der Christus die beiden heiligen Münzen zurückließ, den nicht auf, dessen Nächster ihr sein sollt, damit ihr an ihm Barmherzigkeit übet. Gerade der ist euer Nächster, den nicht bloß gleiche Natur, sondern auch das Erbarmen mit euch verbunden hat. In eurem Stolze erachtet ihr euch als fremd gegen ihn, und indem ihr euch ganz ohne Grund in eurem fleischlichen Stolze erhebet, haltet ihr nicht Gemeinschaft mit dem Haupte. Hieltet ihr an diesem fest, so müßtet ihr wissen, daß ihr den nicht verlassen dürft, für welchen Christus gestorben ist; ihr müßtet dann wissen, daß der ganze Leib mehr durch innigeres Zusammenschließen, als durch Ablösen zur Ehre Gottes durch das Band der Liebe, durch die Erlösung des Sünders wächst.</p><p>Wenn ihr nun so jede Frucht der Buße hinwegnehmt, was sagt ihr dann anders, als dieses: „Keiner von den Verwundeten mag in unsere Herberge eintreten? In unserer Kirche wird ja Niemand geheilt. Bei uns genesen keine Kranke; wir sind allesammt gesund und bedürfen keines Arztes, ganz so wie der Herr selbst gesagt hat: „Nicht die Gesunden bedürfen des Arztes, sondern die Kranken.“</p><h2>0</h2><p>So komme denn du, Herr Jesu, ganz zu deiner Kirche, da Novatian Ausreden vorbringt. Er sagt: „Ich habe ein Joch Ochsen gekauft;“ er nimmt das sanfte Joch Christi nicht auf und legt seinem Halse eine schwere Last auf, die er nicht tragen kann. Novatian hielt deine Diener, von welchen er eingeladen wurde, zurück, that ihnen Schmach an und tödtete sie, weil er ihnen die Beleidigung einer wiederholten Taufe zufügte. Sende also an die Ausgänge der Wege und rufe Gute und Böse herbei; führe Schwache, Blinde, Lahme in deine Kirche. Laß dein Haus sich füllen, rufe Alle zu deinem Mahle: du wirst ja den, welchen du rufst, auch würdig machen, wenn er nur dir folgt. Jener wird freilich verworfen, der kein hochzeitlich Kleid trägt, d. h. der das Kleid der Gnade, den Mantel der Liebe nicht besitzt: Sende denn, sage ich, zu Allen!</p><p>Deine Kirche, Herr! bleibt nicht von deinem Mahle zurück, wie Novatian das thut. Deine Familie sagt nicht: „Ich bin gesund und bedarf keines Arztes.“ Wohl aber sagt sie: „Heile mich, Herr, so werde ich geheilt werden; hilf mir, so ist mir geholfen!“ Das Bild deiner Kirche ist jenes Weib des Evangeliums, das rückwärts hinzutrat und den Saum deines Gewandes berührte, indem sie bei sich sprach: „Wenn ich nur sein Gewand berühre, werde ich gesund werden.“ So bekennt die Kirche ihre Wunde, aber sie gibt auch dem Wunsche Ausdruck, geheilt zu werden.</p><p>Auch du, Herr! wünschest ja, Alle zu heilen, aber nicht Alle wollen geheilt werden. Novatian will es nicht, da er sich für gesund hält. Du, o Herr, der du in dem Geringsten unsere Schwäche fühlest, sagst selbst, daß du in uns krank seiest: „Ich war krank und ihr habt mich besucht.“ Novatian unterläßt es, jenen Geringsten zu besuchen, in dem du, o Herr, besucht zu werden verlangst. Du sagst dem Petrus, der sich die Füße von dir nicht wollte waschen lassen: „Wenn ich dir die Füße nicht wasche, hast du keinen Theil an mir.“ Wie können dann jene Theil an dir haben, o Herr, welche die Schlüssel des Himmelreiches nicht annehmen, weil sie leugnen, daß sie Sünden nachlassen dürften?</p><p>Begründet ist freilich dieses Bekenntniß; denn sie haben keinen Theil an Petri Erbe, weil sie den Stuhl Petri, von dem sie in gottloser Spaltung sich losgerissen, nicht fest halten. Verwerflich aber ist die fernere Behauptung, daß auch in der Kirche die Sünden nicht könnten vergeben werden. Und doch hat der Herr zu Petrus gesagt: „Dir will ich die Schlüssel des Himmelreiches geben; was immer du auf Erden binden wirst, das soll auch im Himmel gebunden sein; was aber du auf Erden lösen wirst, das soll auch im Himmel gelöset sein.“ Der Apostel aber, der als das Gefäß der Auserwählung bezeichnet wird, sagt ausdrücklich: „Wem ihr verziehen habt, dem habe auch ich verziehen; was ich aber vergeben habe, das geschah um euretwillen an Christi Statt.“ Warum lesen nun Jene noch die Briefe Pauli, wenn sie glauben, daß derselbe in so gottloser Weise geirrt habe, daß er sich das Recht seines Herrn anmaßte? Nein, der Apostel nahm in Anspruch, was er empfangen hatte; keineswegs maßte er sich Ungebührliches an.</p><h2>0</h2><p>Der Herr will, daß seine Jünger volle Gewalt haben; er will, daß in seinem Namen von seinen Jüngern alles das vollbracht werde, was er selbst gewirkt, so lange er auf der Erde weilte. Hat er ihnen ja sogar gesagt: „Ihr sollet noch Größeres thun, als dieses.“ Er gab ihnen die Macht, Todte zu erwecken. Obwohl er selbst dem Saulus das Augenlicht wieder herstellen konnte, sandte er ihn doch zu seinem Diener Ananias, damit durch dessen Segnung das geschwundene Augenlicht wieder erschlossen würde. So hieß er auch den Petrus auf dem Meere wandeln, und nur als er bange zitterte, da tadelte er ihn, daß er die Gnadengabe des Glaubens durch Kleingläubigkeit verminderte. So verlieh er auch den Jüngern, daß sie das Licht der Welt sein könnten, wie er selbst das Licht der Welt war. Da er aus dem Himmel auf die Erde herabsteigen und wieder zum Himmel zurückkehren wollte, hat er auch den Elias zum Himmel erhoben, um auch ihn zur gegebenen Zeit wieder auf die Erde herabzusenden. Da er selbst im Feuer und dem heiligen Geiste taufen wollte, hat er durch Johannes die Geheimnisse der Taufe zum Voraus angedeutet.</p><p>Ja, Alles hat er seinen Jüngern gegeben, da er zu ihnen sagt: „In meinem Namen werden sie Teufel austreiben, sie werden in neuen Sprachen reden, Schlangen aufbeben, und wenn sie Tödtliches trinken, wird es ihnen nicht schaden; den Kranken werden sie die Hände auflegen und diese werden genesen.“ Alles hat er ihnen also verliehen; aber da ist nicht von menschlicher Macht und Gewalt die Rede, wo nur die Gnade des göttlichen Geschenkes gilt.</p><p>Warum leget ihr denn nun die Hände auf und glaubet an den Erfolg der Segnung, ob etwa der Kranke doch vielleicht genese? Warum nehmt ihr an, daß Einige von dem Einfluß des Teufels durch euch könnten befreit werden? Warum taufet ihr. wenn durch Menschen überhaupt keine Sünden dürfen nachgelassen werden? In der Taufe findet doch auch der Nachlaß aller Sünden statt: was ist denn für ein Unterschied vorhanden, ob die Priester im Sakramente der Buße oder im Sakramente der Taufe dieses ihnen verliehene Recht für sich in Anspruch nehmen? Dasselbe Geheimniß ist hier, wie dort.</p><p>Du entgegnest mir, daß im Bade der Wiedergeburt die Gnade der <em>Geheimnisse</em> wirkt. Was wirkt denn in der Buße? Oder wirkt dort nicht auch der Name und die Kraft Gottes? Wie nun? laßt ihr die Gnade da eintreten, wo es euch gefällt, während ihr sie zurückweiset, wenn es euch beliebt? Aber das ist doch unerträgliche Anmaßung, nicht heilige Furcht, wenn euch diejenigen zuwider sind, welche Buße thun wollen. Ihr könnet wohl die Thränen der Büßenden nicht ertragen? Eure Augen werden wohl verletzt durch die Armuth der Bußgewänder, durch den Schmutz des Trauerkleides? Stolzen Auges, hochmüthigen Herzens saget ihr zarten Seelen mit unwilliger verächtlicher Stimme: „Rühre mich nicht an; denn ich bin rein.“</p><p>Der Herr sagt freilich zu Maria Magdalena: „Rühre mich nicht an;“ aber er, der doch ganz rein war, setzt nicht hinzu: „denn ich bin rein.“ Und du, Novatian, du wagst es, dich rein zu nennen? Wärest du rein in deinen Handlungen, dieses hochmüthige Wort allein machte dich unrein. Isaias rief einst: „Weh mir armen zerschlagenen Manne! ich bin ein Mensch, habe unreine Lippen und soll in der Mitte eines Volkes wohnen, das auch unreine Lippen hat.“ Du sagst: ich bin rein; und doch ist nach den Worten der Schrift nicht das Kind von einem einzigen Tage rein. David flehte: „Von meiner Missethat, Herr, reinige mich;“ und doch hat ihn, da er barmherzig war, die Gnade des Herrn so oft gerechtfertigt. Du willst rein sein und bist doch so ungerecht, daß du kein Erbarmen fühlst, daß du vielmehr den Splitter im Auge deines Bruders siehest, während du den Balken im eigenen Auge nicht beachtest? Jeder, der unbillig handelt, ist aber bei Gott unrein. Und was kann es Unbilligeres geben, als wenn man die Nachlassung der eigenen Sünde beansprucht, während man Anderen die Bitte abschlagen zu müssen glaubt. Was gibt es Ungerechteres, als dich selbst gerechtfertigt zu erachten, während du den Nächsten verurtheilst, obwohl du schwerere Verbrechen begehst.</p><p>Uebrigens wollte der Herr Jesus die Verzeihung unserer Sünden auch damals deutlich genug kundgeben, als er dem Johannes auf dessen Ausruf: „Ich sollte von dir getauft werden, und du kommst zu mir?“ antwortete: „Laß es nur geschehen, denn es geziemt uns, alle Gerechtigkeit zu erfüllen.“ So kam der Herr zu einem Sünder, da er doch selbst ganz ohne Sünde war; er wollte getauft sein, obwohl er keiner Reinigung bedurfte. Wer kann denn nun euch ertragen, die ihr keiner Reinigung durch die Buße zu bedürfen glaubt, weil ihr durch die Taufgnade gereinigt zu sein behauptet, gleichsam als wenn es für euch unmöglich wäre, zu sündigen?</p><h2>0</h2><p>Freilich wendest du ein, daß geschrieben steht: „Wenn Mensch gegen Mensch sündigt, so wird man Fürbitte für ihn einlegen bei Gott; wenn aber ein Mensch wider Jehovah sündigt, <em>wer</em> mag dann bittend für ihn eintreten?“ Zunächst wiederhole ich, daß ich diesen Einwurf (von deinem Standpunkte aus) allenfalls würde hingehen lassen, wenn du lediglich die Abgefallenen von der Verzeihung ausschlössest. Dann aber frage ich: welche Bedenklichkeit bringt denn jene Frage? Es steht ja nicht geschrieben: „<em>Niemand</em> wird für ihn bitten,“ sondern: „<em>Wer</em> wird bittend eintreten?“ Damit wird nur die Frage aufgeworfen, wer in solchem Falle sich finden würde, der bittend eintreten könnte; keineswegs wird diese Möglichkeit ausgeschlossen.</p><p>So liesest du im vierzehnten Psalm [Hebr. Ps. 15]: „Herr, <em>wer</em> wird wohnen in deinem Zelte, oder <em>wer</em> wird ruhen auf deinem heiligen Berge?“ Damit ist nicht gesagt, daß Keinem dieses Loos zu Theil werde, sondern lediglich, daß nur der Bewährte, nur der Auserwählte dort wohnen und ruhen werde. Um zu beweisen, daß das der wahre Sinn der Worte ist, genügt es, die folgenden Worte des dreiundzwanzigsten Psalmes [Hebr. Ps. 24] anzuführen: „Wer wird hinaufsteigen den Berg des Herrn? oder wer wird stehen an seinem heiligen Orte?“ Der Psalmist will sagen: Nicht jeder gewöhnliche Mensch aus dem großen Haufen, sondern nur ein Mann von hervorragendem Lebenswandel und besonderem Verdienste wird hinaufsteigen. Das <em>„Wer?“</em> ist nicht gleichbedeutend mit <em>„Keiner,“</em> sondern mit <em>„Irgend ein bestimmter.“</em> Darum antwortet David auf die Frage: „Wer wird hinaufsteigen?“ auch sofort: „Derjenige, welcher unschuldig an Händen und rein von Herzen ist.“ Anderswo heißt es: „Wer ist weise und versteht dieses?“ Soll denn damit gesagt werden, daß Keiner es verstehe? Im Evangelium aber heißt es: „Wer ist der treue und kluge Haushalter, den der Herr setzen wird über sein Gesinde, damit er zur rechten Zeit ihnen den angemessenen Unterhalt reiche?“ Und um zu zeigen, daß er hier von Jemanden rede, der allerdings vorhanden sei, fügt der Heiland hinzu: „Selig ist derselbe Knecht, den der Herr, wenn er kommt, also thun findet.“ Dahin gehört, meines Erachtens, auch jenes Wort: „Wer, o Gott, ist dir gleich?“ Darauf ist nicht zu antworten: schlechthin Keiner; denn der Sohn ist ja der Abglanz des Vaters.</p><p>In gleicher Weise ist auch das Wort zu fassen: „Wer wird bittend für ihn eintreten?“ Es heißt: Jemand muß von besonders heiligmäßigem Lebenswandel sein, wenn er für den eintreten will, der gegen den Herrn gesündigt hat. Je größer die Schuld ist, desto würdigere Fürsprecher muß man suchen. Nicht irgend ein Beliebiger aus der Menge, sondern Moses selbst bat für das Volk der Juden, als sie uneingedenk des geschlossenen Bundes das goldene Kalb anbeteten. Befand sich nun Moses damals im Irrthum? Gewiß nicht, denn er hat das, um was er bat, verdient und erhalten. Was sollte auch eine solche Liebe nicht erlangen, die sich selbst für das Volk darbietet, mit den Worten: „Wenn du ihnen die Sünde verzeihest, wohl dann; wenn nicht, dann tilge mich aus dem Buche des Lebens.“ Da sehet ihr, daß er nicht als ein gezierter ängstlicher Fürsprecher mit sich zu Rathe geht, ob darin etwa eine Beleidigung liege: was Novatian zu fürchten behauptet. Er denkt an das ganze Volk, an sich denkt er nicht, und so fürchtet er auch nicht, Gott dadurch zu beleidigen, daß er das Volk von der Gefahr der Beleidigung Gottes befreit.</p><p>Mit Recht steht also geschrieben: „Wer wird bittend für ihn eintreten?“ d. h. Jemand, wie Moses, der sich selbst für die Schuldigen darbot; Jemand, wie der Prophet Jeremias, dem der Herr gesagt hatte: „Bitte nicht für jenes Volk,“ und der doch bat und Verzeihung erwirkte. Auf die Fürbitte des Propheten nämlich, und bewegt durch das Flehen des erhabenen Sehers, wendete sich der Herr wieder zu Jerusalem, das inzwischen auch Buße für seine Vergehungen gethan hatte, da es flehte: „Und nun, allmächtiger Herr, Gott Israels, eine Seele in Aengsten und ein beklommener Geist rufet zu dir! Höre, o Herr, und erbarme dich; du bist ja ein barmherziger Gott, erbarme dich unser, denn wir haben gesündigt.“ Der Herr befahl dann, die Trauergewande abzulegen und den Bußthränen zu wehren. So steht ja geschrieben das Wort des Herrn: „Zeuch aus, Jerusalem, das Kleid deiner Trauer und Qual und thue an die Zier und Ehr’ jener ewigen Herrlichkeit, die Gott dir verleiht.“</p><h2>0</h2><p>Solche Fürsprecher muß man also bei dem schwersten Vergehen suchen. Wenn dagegen gewöhnliche Menschen aus dem Volke bittend eintreten, so werden sie freilich keine Erhörung finden.</p><p>Deßhalb kann die fernere Frage, die ihr aus dem Briefe des heiligen Johannes herübernehmt, keinerlei Bedenken erregen. „Wer da weiß,“ sagt der Apostel, „daß sein Bruder sündige, aber nicht zum Tode, der bitte, und es wird dem, der nicht zum Tode sündiget, das Leben gegeben werden. Es gibt eine Sünde zum Tode, und nicht für diese sage ich, daß Jemand bitten solle.“ Er redet nicht zu Moses und Jeremias, sondern zu dem Volke, welches für seine Sünden einen anderen Fürsprecher haben mußte. Ihm, dem Volke, mußte es genug sein, für die leichteren Vergehen bei Gott Fürbitte einzulegen, während es sich überzeugt halten mußte, daß nur die Gebete der Gerechten Gnade für die schwereren Sünden erwirken könnten. Wie sollte sonst Johannes behaupten können, man dürfe für schwerere Vergehen nicht bittend auftreten, da er doch wußte, daß Moses bei seiner Fürbitte Erhörung gefunden, als es sich um einen ganz freiwilligen Abfall handelte? Nicht minder wußte er, daß Jeremias mit gleichem Erfolge gebeten hatte.</p><p>Wie sollte nun Johannes behaupten können, man dürfe nicht für die Sünde, welche zum Tode ist, eintreten, da er doch in der geheimen Offenbarung jenes Gebot an den Engel der Kirche von Pergamos schrieb? „Du hast daselbst Einige, welche die Lehre Balaams halten, der den Balak lehrte, ein Aergerniß anzurichten vor den Kindern Israels, Götzenopfer zu essen und Hurerei zu treiben: so hast auch du, welche die Lehre der Nicolaiten halten. Thue auch du Buße: wo nicht, so komme ich dir schnell.“ Seht ihr, wie Gott, der die Buße fordert, auch Verzeihung zusagt? Er fügt nämlich hinzu: „Wer Ohren hat, der höre, was der Geist den Gemeinden sagt: wer überwindet, dem will ich von dem verborgenen Manna zur Speise geben.“</p><p>Hatte etwa Johannes nicht erfahren, daß Stephanus für seine Verfolger betete, obwohl diese nicht einmal den Namen Christi hören konnten? Für diejenigen, welche ihn steinigten, flehte er: „Herr, rechne es ihnen nicht zur Sünde.“ Wie wirksam dieses Gebet war, zeigt uns der Apostel. Es wurde ja Paulus, der die Kleider der Steiniger bewacht hatte, nicht lange nachher durch die Gnade Christi ein Apostel des Herrn, wie er vorher sein Verfolger gewesen war.</p><h2>0</h2><p>Da wir nun einmal des Briefes Johannis erwähnt haben, so wollen wir auch betrachten, was in seinem Evangelium geschrieben steht, um zu erkennen, ob das mit eurer Auslegung übereinstimmt. Hier erzählt er, daß der Herr gesagt habe: „So sehr hat Gott die Welt geliebt, daß er seinen eingebornen Sohn dahin gab, so daß Jeder, der an ihn glaubt, nicht verloren gehe, sondern das ewige Leben habe.“ Wenn du nun einen Gefallenen zurückzuführen wünschest, wirst du ihn ermahnen, daß er glaube, oder daß er nicht glaube? Sicher, daß er glaube. Aber wer glaubt, der hat nach dem Worte des Herrn das ewige Leben. Wie willst denn du nun wehren, für den bittend einzutreten, dem das ewige Leben zu Theil werden soll? da doch der Glaube ein Geschenk der göttlichen Gnade ist, wie das der Apostel, wo er von der Vertheilung der Gnadengaben spricht, ganz ausdrücklich lehrt. So flehen auch die Jünger: „Mehre uns den Glauben.“ Wer also den Glauben hat, der hat das Leben; wer aber das Leben hat, der ist doch wahrhaftig nicht ausgeschlossen von der Verzeihung. „Jeder, der an mich glaubt,“ sagt der Herr, „wird nicht verloren gehen.“ „Jeder" sagt er: so ist denn Keiner zurückgewiesen, Keiner ausgeschlossen. Der Herr schließt auch denjenigen nicht aus, der gefallen ist, wenn er nur nachher zum vollen Glauben gelangt.</p><p>Wir wissen aus eigener Erfahrung, daß gar Viele nach ihrem Falle sich wieder gebessert und für den Namen Gottes gelitten haben: Können wir nun diesen die Gemeinschaft der Martyrer verweigern, da der Herr Jesus selbst sie ihnen nicht weigert? Wagen wir zu behaupten, daß denen das Leben nicht zurückgegeben sei, denen Christus den Siegeskranz verliehen hat? Wie nun so Manchen, wenn sie nach dem Falle Martern ertragen, der Siegeskranz zu Theil wird, so erhalten sie auch, wenn sie vertrauensvoll zum Herrn sich wenden, <em>die Gnade des Glaubens</em> wieder. Dieser Glaube ist ja ein Geschenk Gottes. Denn so steht geschrieben: „Euch ist in Beziehung auf Christum gegeben, nicht nur an ihn zu glauben, sondern auch für ihn zu leiden.“ Kann nun der, welcher vom Herrn diese Gnadengabe besitzt, nicht auch Verzeihung erlangen?</p><p>Diese Gnadengabe ist aber eine doppelte: einmal an den Herrn Jesus zu <em>glauben</em>, dann für ihn zu <em>leiden</em>. Derjenige, welcher glaubt, besitzt die eine Gnade; die andere besitzt er, wenn sein Glaube durch Martern und Leiden verherrlicht wird. So war Petrus, ehe er litt, keineswegs ohne Gnade; aber in seinem Leiden ward er auch der anderen theilhaftig. Und gar Viele gibt es, die die Gnade, für Jesus zu leiden, nicht erlangten; gleichwohl hatten sie die Gnade, an ihn zu glauben.</p><p>Deßhalb heißt es auch: „Jeder, der an ihn glaubt, wird nicht verloren gehen.“ <em>„Jeder,“</em> d. h. in welchem Stande er sein mag, von welchem Falle er sich erheben muß, er darf nicht fürchten, verloren zu gehen, wenn er glaubt. Es kann ja geschehen, daß Jemand von Jerusalem nach Jericho wieder hinabsteigt, d. h. daß Jemand von dem Kampfe des Martyriums wieder in die Lust dieses Lebens, in die Freuden, die die Welt bietet, sich verliert, daß dieser von den Räubern, d. h. hier von den Verfolgern verwundet und halbtodt liegen gelassen wird. So findet ihn dann jener Samaritan des Evangeliums, welcher der Hüter unserer Seelen ist, — heißt ja doch Samaritan so viel als <em>Wächter;</em> — er geht nicht vorüber, nein, er sorgt für ihn und heilt ihn.</p><p>Wohl mir! deßhalb geht der Samaritan nicht vorüber, weil er noch Leben in dem Verwundeten erkennt, so zwar, daß er das volle Leben wieder erlangen kann. Scheint nun derjenige, welcher gefallen ist, nicht halbtodt, wenn der Glaube noch einen Lebensfunken bewahrt hat? Wer Gott <em>gänzlich</em> aus seinem Herzen vertreibt, <em>nur der</em> ist todt. Wer aber nur unter der Wucht der Martern zeitweise ihn verleugnet hat, der ist nur halbtodt. Oder aber, wenn er ganz todt ist, wie kannst du ihm, der nicht mehr geheilt werden kann, auflegen, Bußwerke zu übernehmen? Wenn er halbtodt ist, dann gieße Oel und Wein in seine Wunden; Oel und Wein <em>zugleich</em>: zum Heilen, aber zum schmerzhaften Heilen. Ja, lade ihn nur auf dein Lastthier, übergib ihn dem Wirthe, wende die beiden Münzen auf seine Heilung und beweise dich ihm als Nächster. Das kannst du aber nicht sein, wenn du nicht Barmherzigkeit an ihm übst: nur der kann als Nächster gelten, der nicht tödtet, sondern heilt. „Willst du sein Nächster sein,“ sagt Christus, „so gehe hin und thue deßgleichen.“</p><h2>0</h2><p>Ein anderes Wort sagt: „Wer an den Sohn glaubt, der hat das ewige Leben; wer aber dem Sohne nicht glaubt, der wird das Leben nicht sehen, sondern der Zorn Gottes bleibt über ihm.“ Was nun <em>bleibt</em>, das hat doch sicher irgendwo angefangen, und zwar hier bei der Sünde, vorher nicht geglaubt zu haben. Sobald nun Jemand glaubt, weicht der Zorn Gottes und das Leben kehrt zurück. An Christus glauben, ist also Gewinn des Lebens: denn wer an ihn glaubt, der wird nicht gerichtet.</p><p>Hier bemerken die Gegner, daß derjenige, welcher an Christus glaube, auch sein Wort bewahren müsse nach dem Ausspruche des Herrn: „Ich bin als das Licht in die Welt gekommen, damit Jeder, der an mich glaubt, nicht in der Finsterniß bleibe; wenn aber Jemand meine Worte hört und sie bewahrt, <em>den</em> werde ich nicht richten.“ Er richtet also nicht, und du willst richten. Er sagt: „Damit, wer an mich glaubt, nicht in der Finsterniß bleibt“, d. h. damit er, wenn er in der Finsterniß war, nicht in ihr bleibe, sondern seinen Fehler bessere, seine Schuld gutmache und meine Gebote darnach beachte. Ich habe ja gesagt: „Ich will nicht den Tod des Sünders, sondern seine Bekehrung;“ und ferner: „Wer an mich glaubt, der wird nicht gerichtet.“ Ich halte fest an meinem Worte: „Ich bin nicht in die Welt gekommen als ihr Richter, sondern daß die Welt durch mich selig werde.“ Ich verzeihe gerne, bereitwillig erweise ich mein Erbarmen; ich will ja lieber Barmherzigkeit, als Brandopfer. Durch das Opfer empfiehlt sich der Gerechte; aber durch die Barmherzigkeit wird der Sünder gewonnen; „ich bin ja gekommen, nicht die Gerechten zu berufen, sondern die Sünder.“ Im Gesetze galt das Opfer, im Evangelium gilt Barmherzigkeit; das Gesetz ist durch Moses gegeben, durch mich aber ist die Gnade vermittelt. Kann es nun etwas Deutlicheres geben, als diese Worte?</p><p>Der Herr fährt fort: „Wer mich verachtet und meine Worte nicht annimmt, der hat seinen Richter.“ Scheint dir denn nun, daß derjenige die Worte Christi annimmt, der sich nicht bekehrt? Sicherlich scheint es dir nicht so. Aber wer sich bekehrt, der nimmt das Wort des Herrn an; jenes Wort, nach welchem „ein Jeglicher sich abwenden soll von seiner Schuld.“ Entweder mußt du diesen Ausspruch des Herrn aus seinen Worten tilgen, oder wenn du ihn nicht leugnen kannst, mußt du dich dabei beruhigen.</p><p>Darnach muß also doch auch derjenige wohl die Gebote des Herrn beobachten, der zu sündigen aufhört, der von seinen Vergehungen abläßt. Du darfst somit den Ausspruch Christi nicht so auslegen, als habe er gesagt: „Wer mein Wort <em>allezeit</em> beobachtet hat.“ Hätte der Herr das sagen wollen, so hätte er auch das Wort „allezeit“ hinzugesetzt. Da er das nicht gethan hat, so hat er von dem gesprochen, welcher das, was er gehört hat, auch befolgt. Nun hat dieser gehört, daß er seinen Fehler bessern solle; indem er das that, hat er befolgt, was er gehört hat.</p><p>Wie hart es aber sei, Jemanden zur <em>ständigen</em> (aussichtslosen) Bußübung zu verpflichten, der doch nachher die Gebote des Herrn beachtet, davon mag dich derjenige überzeugen, der selbst den Uebertretern seiner Gebote die Verzeihung nicht verweigert hat. So spricht er: „Wenn sie meine Satzungen entheiligen und meine Gebote nicht halten: so werde ich heimsuchen mit der Ruthe ihre Missethaten und mit Schlägen ihre Sünden; doch meine Barmherzigkeit will ich nicht von ihnen hinwegnehmen.“ Allen verspricht er also Erbarmung.</p><p>Damit diese Erbarmung aber nicht als ohne Unheil und Recht erscheine, so ist ein Unterschied gemacht zwischen denjenigen, welche unausgesetzt den himmlischen Geboten sich gehorsam gezeigt haben und denjenigen, welche zeitweilig, von Irrthum verführt oder durch Zwang veranlaßt, zum Falle gebracht sind. Um dem Vorwurfe, als solle die eigene Beweisführung hier überreden, zu entgehen, möge das Urtheil des Herrn selbst entscheiden. „Jener Knecht“, sagt er, „der den Willen seines Herrn gekannt und doch nicht gethan hat, was er wollte, wird viele Streiche bekommen; der ihn aber nicht gekannt, wird weniger bekommen.“ Beide werden, wenn sie glauben, aufgenommen nach dem Wort des Apostels: „Wen der Herr lieb hat, den züchtigt er; er schlägt jedes Kind, das er aufnimmt.“ Den er züchtigt, den übergibt er dem Tode nicht, wie geschrieben steht: „Hart gezüchtigt hat mich der Herr, aber dem Tode nicht übergeben.“</p><h2>0</h2><p>Uebrigens lehrt der Apostel Paulus keineswegs, daß man diejenigen, welche eine Sünde zum Tode begangen haben, schlechtweg im Stich lassen dürfe: vielmehr soll man dieselben durch das Brod, das sie unter Trauer essen, durch den Trank, den sie mit Thränen trinken müssen, zur Umkehr zwingen, immer aber wieder so, daß auch die Traurigkeit das rechte Maß innehalte. Das besagen die Worte des Psalmisten: „Wie lange, Herr, willst du uns tränken mit Thränen im vollen Maße?“ Auch die Traurigkeit soll ihr Maß haben, damit derjenige, welcher Buße thut, nicht in übermäßiger Trauer sich verzehre. So schreibt auch der Apostel an die Korinther: „Was wollet ihr? Soll ich mit der Ruthe zu euch kommen, oder mit Liebe und im Geiste der Sanftmuth?“ Aber auch die Ruthe ist nicht verderbenbringend; denn der Apostel hatte ja gelesen im Buche der Sprüche: „Schlägst du ihn mit der Ruthe, so wirst du seine Seele von der Hölle befreien.“</p><p>Was der Apostel unter dem Worte „mit der Ruthe kommen“ versteht, das zeigt der Tadel, den er über die Unlauterkeit ausspricht, die Anklage, die er gegen den Blutschänder erhebt, die scharfe Zurechtweisung, die er dem Stolze derjenigen zu Theil werden läßt, welche sich aufblähen, wo sie billig trauern sollten. Zumeist aber erhellt es aus der Verurtheilung des Schuldigen, der von der heiligen Gemeinschaft ausgeschlossen, dessen Seele dem Widersacher übergeben wurde, zum Verderben nicht des Geistes, sondern des Fleisches. Denn wie der Herr dem Satan nicht Macht gab über die Seele Job’s, sondern nur über seinen Leib: so wird auch dieser dem Widersacher zum Verderben des Fleisches übergeben, damit er, „wie die Schlange den Staub leckt“, so das Fleisch, nicht aber die Seele schädige.</p><p>So sterbe denn unser Fleisch den Gelüsten; es sei gefangen und unterthan und ohne Widerspruch gegen das Gesetz unseres Geistes; heiliger Knechtschaft ergeben möge es sterben. So war es bei Paulus, der seinen Leib züchtigte, damit er ihn in Dienstbarkeit brächte, um dadurch, wenn nämlich in ihm das Gesetz des Fleisches dem Gesetze des Geistes entspräche, zugleich seine Predigt zu bewähren. Es stirbt ja das Fleisch, wenn sein Wollen und Verlangen übergeht auf den Geist, so daß es nun nicht mehr darnach trachtet, was des Fleisches, sondern was des Geistes ist. Möchte ich nun an mir selbst erfahren, daß das Fleisch schwach wird; möchte es nur nicht gefangen werden unter das Gesetz der Sünde; möchte ich nur leben nicht im Fleische, sondern im Glauben Christi! So wird dann der Gnadenerweis Gottes größer in der Schwachheit des Fleisches, als in dessen Stärke. Deßhalb wollte ja der Herr auch seinen Apostel, den er doch so sehr liebte, nicht von der Armseligkeit des Fleisches befreien. „Es genügt dir“, antwortete er ihm, als er ihn um Befreiung von derselben bat, „es genügt dir meine Gnade; denn die Kraft wird in der Schwachheit vollkommen.“ Und Paulus selbst hatte Wohlgefallen an seinen Schwachheiten: „Wenn ich schwach bin,“ sagt er. „dann bin ich stark.“ Die Stärke des Geistes kommt eben in den Armseligkeiten des Fleisches zur Vollendung.</p><p>Haben wir bis jetzt den Sinn des Paulinischen Wortes erörtert, so erübrigt noch, die Worte selbst zu betrachten, in wiefern der Apostel nämlich sagen kann, daß er den Sünder dem Satan übergebe zum Verderben des Fleisches, da doch der Teufel unser Versucher ist. Er thut einzelnen Gliedern Gebrechen an und pflegt auch wohl den ganzen Körper in Krankheit zu versenken. So schlug er Job mit bösem Geschwür von den Füßen bis zum Haupte, weil er Gewalt über den Leib des heiligen Dulders erhalten hatte durch das Wort des Herrn: „Siehe, ich gebe ihn in deine Hand, nur schone seines Lebens.“ Genau so handelte der Apostel, da er sagte, daß er den Sünder dem Satan übergebe zum Verderben des Fleisches, damit sein Geist gerettet würde auf den Tag unseres Herrn Jesu Christi.</p><p>Das ist eine große Gewalt, eine mächtige Gnadengabe, dem Teufel gebieten zu können, sich selbst zu schädigen, sein eigen Werk zu vernichten. Das thut er ja wirklich, wenn er einen Menschen, den er zu unterjochen bemüht ist, gerade dadurch, daß er ihn quält, statt schwächer, stärker macht. Denn indem er das Fleisch mit Schwäche heimsucht, stärkt er den Geist. Die Krankheit des Fleisches vertreibt ja die Sünde, während die Ueppigkeit des Fleisches die Schuld auflodern läßt.</p><p>So wird der Teufel hintergangen, daß er sich selbst mit seinem Bisse verwundet und gegen sich denjenigen bewaffnet, den er zu schwächen glaubte. So hat er auch dem heiligen Dulder Job stärkere Waffen verliehen, da er ihn mit Wunden geschlagen. An seinem ganzen Leibe mit Wunden überdeckt, ertrug er allerdings den Biß der höllischen Schlange, aber ihr Gift hat er nicht in sich aufgenommen. Darum wurde ihm denn auch mit Fug gesagt: „Du wirst den Leviathan mit der Angel herausziehen, mit ihm spielen wie mit einem Vogel; du wirst ihn fesseln, wie der Knabe den Sperling bindet, auf ihn die Hand legend.“</p><p>Du siehst nun, wie sehr der Satan von dem Apostel überlistet wird. Es wiederholt sich, was der Prophet sagt: „In die Höhle des Basilisken streckt das Kind seine Hand, und die Natter schadet ihm nicht.“ Ja, der Apostel zieht die alte Schlange heraus und aus ihrem Gifte bereitet er ein geistiges Gegengift: so wird das, was vordem Gift war, jetzt Heilmittel. Es ist Gift zum Verderben des Fleisches, aber Arznei zum Heile der Seele. Was dem Körper schadet, das rettet den Geist.</p><p>So möge denn die Schlange den Staub des Leibes verschlingen, ihren Zahn mag sie in das Fleisch einsenken! Immerhin mag sie den Leib verwunden nach dem Worte des Herrn: „Ich übergebe ihn dir, nur bewahre seine Seele.“ Wie groß ist doch die Gewalt Jesu Christi, daß er die Hut des Menschen selbst dem Satan aufzwingt, der doch ständig schädigen will. So versöhnen wir denn uns den Herrn Jesus; wenn Christus gebietet, dann wird selbst der Satan der Hüter seiner Beute, — ja wider seinen Willen muß er den himmlischen Geboten mithelfen: selbst grausam, muß er den milden Befehlen des Herrn gehorchen.</p><p>Aber will ich denn seine Folgsamkeit hier rühmen? Nein, er soll immer böse bleiben, damit Gott, der seine Bosheit in Gnade verkehrt, immer gut sei. Jener will schaden, aber er kann nicht, wenn Christus sich ihm entgegenstellt: er verwundet das Fleisch, aber er bewahrt die Seele; er weidet sich an dem Staube der Erde, aber er bewahrt den Geist. Das ist es, was der Prophet gesagt hat: „Dann wohnet der Wolf bei dem Lamme, Löwe und Stier weiden zusammen; die Schlange nimmt als Speise den Staub der Erde. Sie schaden nichts und tödten nichts auf meinem heiligen Berge, spricht der Herr.“ Ist es ja das Verdammungsurtheil der Schlange: „Staub sollst du fressen.“ Was für Staub? Doch wohl den, von welchem gesagt ist: „Du bist Staub und sollst zum Staube wieder werden.“</p><h2>0</h2><p>An diesem Staube sättigt sich die Schlange, wenn der Herr uns versöhnt und gnädig ist, so daß dann die Seele nicht mitleidet unter der Schwäche des Fleisches, daß sie nicht mitentbrennt in der Begierlichkeit des Fleisches, in der Gluth des Leibes. „Es ist besser,“ sagt der Apostel, „zu heirathen, als brennen;“ denn das ist eine Flamme, welche die Seele verzehrt. Gestatten wir diesem Feuer keinen Zugang zum Heiligthume unserer Seele und zur Tiefe unseres Herzens, damit wir nicht die innere Hülle der Seele verbrennen, damit nicht die Flamme auch unsere äußere Leibeshülle, dieses so lüsterne Fleisch verzehre. Nein, schreiten wir vielmehr durch das Feuer hindurch. Wenn aber Jemand unversehens in Liebesgluth versenkt wird, so schreite er eilenden Fußes hindurch: er umschlinge das lüsterne Begehren nicht mit den Fesseln der Gedanken; er schürze sich nicht die Knoten der Lust mit der Schlinge steten Erwägens. Nicht wiederholt blicke er auf die Gestalt eines buhlerischen Weibes, wie auch die Jungfrau ihr Auge nicht heften soll auf das Antlitz des Jünglings. Wenn sie schon beim zufälligen Anblicke gefangen wird, um wie viel sicherer wird sie der Gefangenschaft erliegen, wenn sie vorwitzig hinblickt?</p><p>Der gewöhnliche Brauch mag uns belehren. Das Weib umhüllt ihr Haupt, um auch im öffentlichen Verkehr ihre Zucht und Scham gesichert zu halten. Nicht leicht soll ihr Antlitz den Augen eines Jünglings sich darbieten, darum soll sie mit dem hochzeitlichen Schleier bedeckt sein. So wird sie nicht einmal zufälligen Blicken sich bieten, die leicht Wunden schlagen dem fremden oder dem eigenen Herzen: in beiden Fällen trifft die Wunde sie selbst. Wenn sie nun ihr Haupt verhüllt, um weder zu sehen, noch gesehen zu werden: um wie viel mehr muß sie dann mit dem Schleier der Scham sich umhüllen, daß sie auch im öffentlichen Verkehr ihr Heiligthum bewahrt!</p><p>Aber angenommen, das Auge habe einen unachtsamen, unbewachten Blick gethan, so soll wenigstens das innere Wollen und Fühlen dem Blicke nicht folgen. Der Blick ist noch kein Verbrechen; nur muß man sich hüten, daß er nicht Keim und Anfang eines Verbrechens werde. Das leibliche Auge blickt hin; dann möge man nur das Auge des Herzens geschlossen halten, damit die Lauterkeit der Seele unbefleckt bleibe. Wir haben einen treuen und milden Herrn. Der Prophet sagt: „Blicke nicht hin auf die Gestalt eines buhlerischen Weibes;“ der Herr aber sagt: „Wer ein Weib ansieht, ihrer zu begehren, der hat schon im Herzen die Ehe mit ihr gebrochen.“ Er sagt nicht: „Wer hinsieht,“ sondern „Wer sie ansieht, ihrer zu begehren;“ er verurtheilt nicht schon das Sehen, sondern er beachtet das Fühlen und Wollen der Seele. Heilsam ist aber wahrhaftig auch die Schamhaftigkeit, welche selbst die leiblichen Augen so vollkommen gezügelt hat, daß man oftmals auch das nicht sieht, was man erblickt. Wohl scheint es, als ob wir beim Anblicke in unsere Augen aufnehmen, was uns begegnet; solange aber das Aufmerken der Seele nicht hinzutritt, verschwindet auch, der Aufgabe des Leibes entsprechend, der Anblick alsbald: wir sehen also eigentlich mehr mit dem Geiste, als mit den Augen des Leibes.</p><p>Wenn nun das leibliche Auge den Funken, der zum Feuer werden kann, gewahrt, so sollen wir nur nicht das Feuer im Busen bergen, d. h. in der Tiefe der Seele, in dem Heiligthume des Herzens. Wir sollen dieses Feuer nicht dem Marke der Gebeine beimischen, wir sollen uns nicht selbst Fallstricke bereiten. Darum sollen wir auch die Unterredung mit Personen fliehen, welche das Feuer unreiner Lust in uns entfachen können. Das Reden mit einer jungen Person ist ein Fallstrick für den Jüngling; die Worte des Jünglings sind Fesseln der Liebesneigung.</p><p>Joseph erkannte dieses Feuer, als jenes Weib mit ihrem ehebrecherischen Gelüste ihn anredete. Mit verlockender Rede wollte sie ihn fangen, ihren Lippen sollten, Schlingen gleich, die Worte entsprudeln: aber den keuschen Jüngling vermochte sie nicht zu fangen; denn des Weibes Bande zerriß der schamhafte Ton, das ernste Wort, die zügelnde Vorsicht, der schützende Glaube, die keusche Zucht. Mit dem Netze ihrer Worte konnte das lüsterne Weib ihn also nicht fangen: da streckte sie ihre Hand aus und erfaßte sein Kleid, um ihn so an sich zu fesseln. Die schmeichelnden Reden eines üppigen Weibes sind Netze für die Begierden, und ihre Hand ist eine Fangmasche für die Liebe; aber die züchtige Seele konnte weder in den Netzen noch in der Masche gefangen werden; das Kleid ist abgeworfen, die Fangmasche zerrissen; und darum, weil sie (die züchtige Seele) der wilden Gluth keinen Zugang zu ihrem Innern gestattete, blieb auch ihr Fleisch vor dem Brande gesichert.</p><p>Siehst du nun, daß unsere Seele die Urheberin der Sünde ist? Das Fleisch ist an sich schuldlos, aber oft genug muß es der Sünde dienen. Lasse dich also nicht gelüsten nach der Schönheit eines Weibes! Lasse dich nicht besiegen von dem Teufel, der gar viele Netze und Fallstricke auswirft. Das Auge der Buhlerin ist ein verlockender Fallstrick; aber auch unsere eigenen Augen können uns zu Fallstricken werden, wie geschrieben steht: „Lasse dich nicht fangen durch deine Augen.“ Wir flechten uns sonst selbst die Bande, wie wir lesen: „Jeder wird gefesselt durch die Bande der eigenen Sünden.“</p><p>So lassen wir denn hinter uns das Feuer der Jugend, die Gluth des Jünglings: schreiten wir durch die Fluthen hindurch, weilen wir nicht in ihnen, daß die tiefen Wasser uns nicht umschließen. Schreiten wir hindurch, damit wir mit dem Psalmisten sagen können: „Durch einen Strom ist unsere Seele gegangen.“ Wer hindurchschreitet, der ist gerettet. So sagt auch der Herr beim Propheten: „Wenn du durch Gewässer gehst, will ich bei dir sein, und die Ströme werden dich nicht decken.“ So sagt auch der königliche Sänger: „Ich sah einen Gottlosen überaus erhöhet und hochgewachsen, wie die Cedern des Libanon; und ich ging vorüber und siehe, er war nicht mehr.“ Gehe nur durch die Welt hindurch: du wirst sehen, wie die Größe der Gottlosen zusammenbricht. Auch Moses, da er an dem Irdischen vorüberging, sah eine große Erscheinung: „Ich will hingehen,“ sprach er, „und schauen dieses große Gesicht.“ Wäre er den Lastern des Fleisches ergeben, wäre er in die Lüste dieser Welt versenkt gewesen, so hätte er niemals diese Geheimnisse geschaut.</p><p>So gehen denn auch wir an diesem Feuer der Begierlichkeit vorüber. Paulus fürchtete dasselbe und zwar für uns; da er sein Fleisch kasteiete, so brauchte er für sich nicht mehr zu fürchten; uns aber sagt er: „Fliehet die Unlauterkeit.“ Ja fliehen wir sie, die uns verfolgt, und zwar nicht außerhalb unserer Person, sondern in uns selbst verfolgt sie uns. Wir haben allen Grund, genau darauf zu achten; sonst können wir sie allerdings, während wir fliehen, in und mit uns forttragen. Wir wollen ja wohl meistens fliehen; aber wenn wir die Unlauterkeit nicht gänzlich aus unserer Seele vertreiben, so hegen wir sie, statt sie zu tilgen. Eilenden Fußes müssen wir an ihr vorübergehen, damit nicht das Wort des Propheten auf uns paßt: „Wandlet nur in dem Lichte eueres Feuers und in den Flammen, die ihr selbst angezündet.“ Da aber fragt der weise Mann: „Kann denn Jemand Feuer in seinem Busen verbergen, ohne daß seine Kleider brennen? oder kann Jemand auf glühenden Kohlen gehen, ohne seine Fußsohlen zu verbrennen?“</p><p>Gefährlich ist dieses Feuer; geben wir ihm also keine Nahrung durch Weichlichkeit. Die Lust wird genährt durch Gastmahle, unterhalten durch Genüsse, entzündet durch Wein und zur wilden Gluth entflammt durch Trunkenheit. Schlimmer noch sind die Lockungen schmeichelnder Worte, welche wie Wein aus Sodoma die Seele berauschen. Hüten wir uns also vor dem Uebermaße dieses Weines; wo das Fleisch trunken wird, da wankt der Geist, da überfluthet das Herz. So ist das Mahnwort des Apostels hier in Geltung: „Ein wenig Wein magst du trinken um deiner häufigen Schwächen willen.“ Wenn der Leib glühet, dann versetzt er auch die Seele in Gluth; wenn aber das Fleisch unter dem kalten Hauche der Krankheit seufzet, dann wird die Seele sich erquickt fühlen. Empfindet dein Leib Schmerz, so ist dein Geist zwar auch traurig, aber deine Traurigkeit wird in Freude verwandelt werden.</p><p>Fürchte also nicht, wenn der Feind deinen Leib belästigt, deine Seele wird er nicht verschlingen. So sagt auch David, daß er sich nicht fürchte, obwohl die Feinde sein Fleisch, nicht aber die Seele schädigen. „Wenn die Uebelthäter mir nahen, mein Fleisch zu fressen, sie, meine Feinde, die mich quälen, so werden sie kraftlos und fallen zu Boden.“ So bereitet die Schlange sich selbst eine Niederlage; derjenige wird der Schlange übergeben, der von der Schlange verwundet war, damit sie ihn, den sie bezwang, wieder aufrichte, und damit die Niederlage der Schlange also zur Auferstehung des Sünders werde. Die Schrift selbst stellt übrigens den Satan als den Urheber dieser körperlichen Qual und Schwächung hin. Sagt doch der Apostel: „Es wurde mir ein Stachel in mein Fleisch gegeben, ein Engel des Satans, daß er mir Faustschläge gebe, damit ich mich nicht überhebe.“ So hat Paulus gelernt zu heilen, wie er selbst die Genesung gefunden.</p><h2>0</h2><p>Das ist ein guter, treuer Lehrer, der Eins verspricht und Beides gewährt. Er kommt mit der Ruthe, sofern er den Gefallenen aus der heiligen Gemeinschaft entfernt. Mit Recht sagt er, daß der dem Satan überliefert wird, der vom Leibe Christi getrennt wird. Er kommt aber auch in Liebe und im Geiste der Milde, weil er den Sünder so ausschließt, daß er seine Seele rettet, oder auch weil er den, welchen er vorher ausgeschlossen, den heiligen Geheimnissen wieder zurückgibt.</p><p>Er muß ja auch den so tief Gefallenen ausschließen, damit dieser nicht, dem Sauerteig vergleichbar, die ganze Gemeinde verderbe. Der alte Sauerteig muß ausgefegt werden. Das gilt bei den Einzelnen von dem alten, dem äußerlichen Menschen mit seinen Handlungen, bei der Gemeinde von dem in Sünden und Lastern Verhärteten. Mit Recht spricht der Apostel vom <em>„Ausfegen“</em> des alten Sauerteiges, weil es sich um eine Reinigung, nicht aber um gänzliche Verwerfung handelt. Es wird also nicht geradezu Alles als unnütz und schlecht bezeichnet; es soll vielmehr das als Zweck der Säuberung gelten, daß das Nützliche vom Unnützen geschieden wird; was aber verworfen wird, darin ist überhaupt nichts mehr nütze.</p><p>Gleich damals hat also der Apostel dafür gehalten, den Sünder zu den himmlischen Geheimnissen wieder zuzulassen, wenn dieser nur selbst den Wunsch hegte, gereinigt zu werden. Darum sagt er auch zutreffend: <em>„Feget aus!“</em> An dem wird ja durch Vermittelung des Volkes, durch seine Werke und Thränen die Reinigung vollzogen, welcher durch Gebet und Seufzen des Volkes von der Sünde befreit und in seinem inneren Menschen gereinigt wird. Christus hat seiner Kirche verliehen, den Einen durch die Anderen zu retten, wie sie selbst der Ankunft des Herrn Jesus gewürdigt wurde, damit durch den Einen alle die Anderen erlöset würden.</p><p>Das ist der Sinn des Apostels, der freilich durch die Worte dunkel wird. Betrachten wir nur diese Worte selbst: „Feget aus den alten Sauerteig, damit ihr seid ein neuer Teig, da ihr ja ungesäuert seid.“ Darnach übernähme also die ganze Kirche die Sündenlast des Einzelnen, für den sie in Thränen, Gebet und Schmerz mitleiden muß; sie bedeckt sich selbst gewissermaßen mit dem Sauerteige der Sünde ihrer einzelnen Mitglieder, so zwar, daß durch Alle das, was in dem einzelnen Büßenden zu tilgen ist, gleichsam vermittelst eines gemeinschaftlichen Zusatzes von Erbarmen und Mitleiden, woran Männiglich Theil hat, gereinigt und ersetzt wird. Oder man kann die Worte so fassen, wie jenes Weib im Evangelium uns lehrt, welche ein Vorbild der Kirche ist, sofern sie nämlich den Sauerteig in der Masse des Mehles barg, bis Alles durchsäuert wäre; so soll Alles rein dargestellt werden.</p><p>Was aber unter dem Sauerteig sonst noch zu verstehen sei, hat der Herr selbst uns im Evangelium gelehrt. „Warum begreift ihr nicht“, sagte er zu seinen Jüngern, „daß ich nicht vom Brode zu euch redete, da ich sprach: Hütet euch vor dem Sauerteige der Pharisäer und Sadducäer?“ Da verstanden sie, — setzt der Evangelist hinzu, — daß er nicht gesagt hatte, sie sollten sich vor dem Sauerteige des Brodes, <em>sondern vor der Lehre der Pharisäer und Sadducäer hüten</em>. Diesen Sauerteig nun, d. h. die Lehre der Pharisäer, die anmaßenden Behauptungen der Sadducäer birgt die Kirche in ihrem geistigen Mehlvorrathe, wenn sie den strengen Buchstaben des Gesetzes durch ihre geistige Auslegung mildert. Man könnte sagen: sie durchbricht auf der Mühle ihrer Auslegung den harten Buchstaben, und wie jene aus den Getreidehülsen das Korn ausschält, so bringt sie aus der Hülle des Buchstabens den tiefen Sinn des Gnadengeheimnisses hervor, und so bekräftigt sie den Glauben an die Auferstehung, der Gottes Erbarmen verkündet, der uns lehrt, daß das Leben der Gestorbenen zurückerstattet wird.</p><p>Die Anziehung dieses Vergleiches an diesem Orte erscheint keineswegs thöricht und unberechtigt. Das Himmelreich ist ja die Erlösung der Sünder, und gerade deßhalb werden wir Alle — Gute wie Böse — mit dem Sauerteige der Kirche vermischt, damit wir ein neuer Teig werden. Damit aber Niemand fürchte, es möchte die Beimischung verdorbenen Sauerteiges die ganze Masse verderben, hat der Apostel hinzugefügt: „Damit ihr ein neuer Teig seid, da ihr ja ungesäuert seid,“ d. h. der Sauerteig der Kirche wird euch wieder herstellen, wie ihr vordem waret in der vollen Reinheit euerer Unschuld. Wenn wir in solcher Weise uns erbarmen, so werden wir durch fremde Sünde nicht befleckt; wir erwirken vielmehr die Rettung des Sünders noch zum eigenen Gnadenschmuck, so daß die Reinheit dauernd bleibt, wie sie war. Deßhalb sagt auch der Apostel ferner: „Denn als unser Osterlamm ist Christus geopfert worden,“ d. h. das Leiden des Herrn hat Allen genützt und den Sündern, die über ihre begangenen Fehler Reue fühlen, Errettung bereitet.</p><p>So laßt uns denn (um mit dem Apostel zu reden) das Mahl halten in reiner, guter Speise, bei aller Buße doch erfreut über die Rettung. Nun ist keine Speise besser, als Güte und Wohlwollen: darum soll unser Opfermahl und unsere Freude durch kein Gefühl des Neides über den geretteten Sünder getrübt werden, damit wir uns nicht, wie jener neidische Bruder im Evangelium, selbst vom Vaterhause ausschließen. Dieser empfand Schmerz über die Wiederaufnahme des Bruders; er hätte sich gefreut, wenn die Ausschließung für immer gegolten hätte.</p><p>Daß ihr ihm ähnlich seid, könnet ihr, Novatianer, nicht leugnen. Ihr wollet ja gerade deßhalb nach euerer eigenen Versicherung nicht zur Kirche ferner eingehen, weil denen, welche gefallen sind, die Hoffnung der Rückkehr gewährt ist. Uebrigens ist das nur zum Scheine vorgeschoben; sonst weiß Jeder, daß den Novatian der Schmerz über den Verlust der bischöflichen Würde zum Schisma getrieben hat.</p><p>Ihr wollet nicht einsehen, daß der Apostel jenes Wort auch von Euch zum Voraus gebraucht hat, welches er den Korinthern schrieb: „Und ihr seid aufgeblasen und nicht vielmehr in Trauer versetzt, damit der aus euerer Mitte geschieden werde, welcher diese That begangen hat?“ Immerhin wird er für solange vollständig beseitigt, als seine Sünde getilgt wird; keineswegs aber sagt der Apostel, daß derjenige gänzlich aus der Kirche ausgeschlossen werde, welcher nach seinem Rathe und Wunsche gereinigt werden soll.</p><h2>0</h2><p>Da also der Apostel die Sünde nachließ, auf welche Auctorität hin verweigert ihr die Nachlassung? Wer ist denn wohl ein treuerer Verehrer Christi, Novatian oder Paulus? Aber Paulus kannte die Barmherzigkeit des Herrn, er wußte, daß der Herr Jesus mehr durch die harte Strenge, als durch das Erbarmen seiner Jünger beleidigt wurde.</p><p>Um nur <em>ein</em> Beispiel anzuführen: Als Johannes und Jakobus sagten, sie wollten Feuer vom Himmel herabflehen, die zu vernichten, welche dem Herrn die Aufnahme verweigert hatten, da wies sie der Herr zurück mit den Worten: „Ihr wisset nicht, weß Geistes Kinder ihr seid: des Menschen Sohn ist nicht gekommen, die Seelen der Menschen zu verderben, sondern sie selig zu machen.“ Jenen sagte er: „Ihr wisset nicht, weß Geistes Kinder ihr seid,“ und doch waren sie <em>seines</em> Geistes. Euch aber sagt er: „Ihr seid nicht meines Geistes, weil ihr meine Milde nicht bewahret, weil ihr mein Erbarmen zurückweiset, weil ihr die Buße ausschließet, die ich doch durch meine Apostel in meinem Namen gepredigt wissen wollte.“</p><p>Ihr saget ohne allen Grund, daß auch ihr Buße predigt, da ihr ja die Frucht der Buße ausschließet. Die Menschen werden nämlich lediglich durch Belohnung oder durch die Aussicht auf die Frucht ihrer Bemühungen zu ernstem Streben angeeifert; und jedes Streben ermattet durch die Verzögerung dieser Frucht. Gerade deßhalb sagte auch der Herr, um den Eifer und die Hingabe seiner Jünger zu steigern, daß derjenige, welcher Alles verlassen und <em>ihm</em> gefolgt sei, Hundertfältiges erhalten werde, sowohl hier als im Jenseits. Zuerst verheißt er den Lohn in der Gegenwart, um den Widerwillen, der aus der Hinhaltung des Lohnes hervorgeht, zu heben; dann weiset er auf das Jenseits hin, damit wir lernen, gläubig zu vertrauen, wie auch im Jenseits der Lohn unser wartet. Die Belohnung in der Gegenwart ist ein Zeugniß für die Belohnung in der Ewigkeit.</p><p>Wenn nun Jemand, mit geheimen Vergehen belastet, um Christi willen doch eifrig der Buße sich unterzogen hat, wie wird ihm jene Belohnung zu Theil, wenn ihm die Gemeinschaft mit der Kirche nicht erschlossen wird? Ich will, daß der sündige Mensch auf Verzeihung hoffe, daß er sie erflehe mit Thränen und Seufzern, daß mit ihm die Thränen des ganzen Volkes um Verzeihung flehen. Wenn dann zum zweiten und dritten Male die Wiedervereinigung ihm versagt ward, so möge er sich überzeugt halten, daß er immer noch zu wenig ausdauernd gefleht hat: seine Thränen mögen reicher fließen, er möge jammervoller zurückkehren, er möge die Füße der Vorübergehenden mit seinen Armen umfassen, mit Küssen bedecken, mit seinen Thränen baden und nicht nachlassen, bis der Herr Jesus auch zu ihm sagt: „Ihm sind viele Sünden vergeben, weil er viel geliebet hat!“</p><p>Ich habe Büßer kennen gelernt, deren Antlitz die Trauer durchfurcht, in deren Wangen die steten Thränenströme tiefe, scharfe Linien gegraben hatten. Sie lagen am Boden, als wollten sie Allen ihren Leib darbieten, über ihn hinzuschreiten; ihrem todtbleichen Antlitz war der Stempel der Entbehrung und des Fastens aufgedrückt.</p><h2>0</h2><p>Was warten wir denn darauf, daß diejenigen, welche im Leben sich den Tod gaben (d. i. durch Buße sich abtödteten), erst nach ihrem (leiblichen) Tode Verzeihung erhalten? „Es ist für einen solchen Sünder“, sagt der Apostel, „genügend diese Züchtigung, die von Vielen geschehen, so daß ihr im Gegentheile ihm vielmehr vergeben und ihn trösten sollet, damit er, der ein solcher ist, nicht etwa in allzugroße Traurigkeit versinke.“ Wenn die Züchtigung, die von Vielen geschehen, hinreicht zur Bestrafung, wie sollte dann das Flehen, das Viele zum Himmel emporsenden, nicht genügen zur Verzeihung der Sünde? Der Lehrer, der die Sitte, aber auch die menschliche Schwäche kennt, der Verkündiger göttlichen Erbarmens: er will, daß die Sünde vergeben, daß die Tröstung gewährt werde, damit nicht die Traurigkeit über die zu lange Verschiebung der Lossprechung ihn im Elend vernichte.</p><p>Darum also verzieh der Apostel, und er <em>verzieh</em> nicht bloß, sondern er wollte auch, daß die Liebe zu dem gebesserten Sünder sich wieder stärke. Derjenige, welcher in Liebe ergeben ist, der kennt keine Härte, der kennt nur Milde. Auch verzieh er nicht bloß für sich selbst; er wollte auch, daß Alle ihm verzeihen möchten, und er erklärte ausdrücklich, daß er um der Anderen willen verziehen habe, damit nicht Viele wegen des Einen länger trauerten. „Wem ihr etwas verziehen habt, dem habe auch ich verziehen: denn was ich vergeben habe, das geschah euretwillen an Christi Statt, damit wir nicht vom Satan übervortheilt werden; denn seine Anschläge sind uns nicht unbekannt.“ Der kann wohl auf der Hut sein vor der Schlange, welcher ihre listigen Anschläge nicht verkennen kann, deren ja so viele sind, um uns zu schaden. Die Schlange will immer schaden, immer täuschen, um uns den Tod zu bringen: aber wir müssen Sorge tragen, daß unser Heilmittel nicht zum Triumphe für den Satan werde. Wir werden überlistet, wenn Jemand in zu großer Trauer zu Grunde geht, während er durch erbarmungsvollen Nachlaß gerettet werden konnte.</p><p>Damit wir aber nicht im Zweifel seien, daß er von Getauften redet, fügt er hinzu: „Ich habe euch geschrieben, daß ihr mit Unkeuschen keine Gemeinschaft haben solltet; das meinte ich aber nicht von den Unkeuschen dieser Welt; denn sonst müßtet ihr aus der Welt gehen. Ich schrieb euch vielmehr, da keine Gemeinschaft zu haben, wenn einer, <em>der Bruder heißet</em>, ein Unkeuscher oder ein Geiziger oder ein Götzendiener ist.“ Verbindet er nun diese verschiedenen Arten von Sünden mit einander behufs Duldung der Strafe, so wollte er auch, daß Alle in Beziehung zur Sühne stünden. „Mit einem solchen“, sagt der Apostel, „sollet ihr nicht einmal essen.“ Wie strenge ist der Apostel gegen die hartnäckigen und verstockten Sünder, wie nachsichtig gegen die, welche um Verzeihung bitten! Gegen jene wird die Beleidigung, die dem Herrn zugefügt würde, aufgerufen, diesen kommt die Anrufung Christi zu Hilfe.</p><p>Nun könnte Jemand dadurch gestört werden, daß geschrieben steht: „Ich habe diesen Menschen dem Satan zum Verderben des Fleisches übergeben.“ Man könnte sagen: Wie mochte derjenige Anspruch auf Verzeihung haben, dessen Fleisch ganz dem Verderben geweiht war, da es doch offenbar ist, daß der Mensch nach beiden Seiten erlöset ist und gerettet wird: die Seele nicht ohne den Leib, und der Leib nicht ohne die Seele? Während beide durch die Theilnahme an ihren Werken mit einander verbunden sind, sollen sie nun ohne gleiche Theilnahme an Lohn und Strafe sein? Wenn Jemand so spricht, so möge ihm zur Antwort dienen, daß unter „dem Verderben des Fleisches“ hier nicht die vollendete Vernichtung, sondern die Züchtigung des Fleisches zu verstehen ist. Wie nämlich derjenige, welcher der Sünde abgestorben ist, Gott lebt, so gehen die Lüste des Fleisches zu Grunde, und es stirbt das Fleisch seinen Begierden ab, damit es wieder zur Keuschheit und zu den anderen guten Werken erstehe.</p><p>Woher können wir ein passenderes Beispiel nehmen, als von unserer gemeinsamen Mutter? Die Erde, von der wir genommen sind, erscheint ja auch, wenn ihre Bebauung zeitweise unterbleibt, öde und verlassen; sie ist dann für die Wein- und Oelpflanzungen, denen sie sonst diente, gestorben: aber ihren Lebenssaft, ihre Seele gleichsam, verliert sie nicht. Tritt die Bebauung wieder ein, werden die Saatkörner, zu deren Aufnahme sie geeignet erscheint, ihr wieder anvertraut, so ersteht sie wieder, <em>nur reicher an Früchten</em>. Es ist also nicht etwas so ganz Fremdes, wenn auch von unserem Fleische in diesem Sinne gesagt wird, daß es verderbe: es soll eigentlich nur gebändigt, nicht vernichtet werden.</p><h2>Buch Buch</h2><h2>0</h2><p>Wenngleich in dem ersten Buche dieser Schrift Manches beigebracht ist, was der Ermunterung zur Buße dient, so möchten wir doch nicht den Anschein geben, als wollten wir gleichsam bei halber Mahlzeit uns erheben. Da ohnehin noch Vieles hinzugefügt werden kann, so führen wir das Mahl, das wir mit Vorlegung unserer Worte begonnen, nunmehr fort.</p><p>Die Buße soll nun nicht bloß mit Eifer, sondern auch <em>bis zur Reife</em> geübt werden. Sonst möchte etwa jener Hausvater des Evangeliums, der einen Feigenbaum in seinen Weinberg pflanzte, auch zu uns kommen, und wenn er dann die Frucht suchte, ohne sie zu finden, würde er wohl zum Weingärtner sagen: „Haue ihn um; was soll er noch das Land einnehmen?“ Vielleicht träte dann wohl der Gärtner ein mit den Worten: „Herr, laß ihn auch noch dieses Jahr, bis ich um ihn her aufgegraben und Dünger daran gelegt habe, ob er nicht etwa doch noch Früchte bringt; wenn nicht, so magst du ihn für die Zukunft weghauen.“</p><p>Verfahren wir mit dem Acker, den wir besitzen, auch so, und ahmen wir den sorgsamen Landwirth nach, der nicht Anstand nimmt, mit fettem Dünger die Erde zu sättigen, mit schmutziger Asche das Land zu bedecken, um auf diese Weise reichlichere Frucht zu erzielen.</p><p>In welcher Weise wir aber dabei verfahren sollen, lehrt uns der Apostel, wenn er sagt: „Ich achte Alles für Koth, damit ich Christum gewinne“; so hat er es verdient, in Schmach und in Ehre Christo zu gefallen. Er hatte ja gelesen, daß Abraham, da er sich als Staub und Asche vor dem Herrn bekannte, durch die tiefste Demuth der Gnade Gottes theilhaftig wurde; er hatte ferner gelesen, daß Job, da er auf dem Düngerhaufen saß, Alles wiedergewann, was er verloren. Nicht minder hatte er gelesen, was David prophetischen Geistes verkündigt, „daß Gott den Geringen aufrichtet aus dem Staube und aus dem Kothe erhöhet den Armen.“</p><p>Und wir sollten uns scheuen, dem Herrn unsere Sünden zu bekennen? Wohl mag es Scham hervorrufen, wenn ein Jeder seine Vergehen offenlegen soll: aber diese Scham durchpflügt den Acker des Geistes, nimmt die immer wieder keimenden Dornen hinweg, schneidet die Sträuche und haucht den Früchten, die ihm schon gestorben schienen, neuen Lebensduft ein. Folge nur dem Apostel, der seinen Acker tüchtig pflügend Früchte für die Ewigkeit zu gewinnen trachtete. „Man verfluchet uns“, sagt er, „und wir segnen; man verfolgt uns, und wir dulden; man lästert uns, und wir beten; wie ein Auswurf der Welt sind wir geworden.“ Wenn auch du deinen Geistesacker so durchpflügt hast, dann wirst du geistige Saat ausstreuen. Ja, bebaue nur so, daß du die Sünde fortschaffest, so wirst auch du Frucht erzielen. Der Apostel hat so gearbeitet, daß er die letzte Regung des <em>Verfolgers</em> in sich austilgte. Wie konnte Christus uns mächtiger zum Eifer in der Lebensbesserung anregen, als dadurch, daß er den Verfolger bekehrte und aus ihm uns den Lehrer bereitete?</p><h2>0</h2><p>Obwohl aber die Irrgläubigen durch das offene Verfahren des Apostels und durch die klaren Worte seiner Sendschreiben widerlegt werden, so wollen sie gleichwohl auf ihn sich stützen und behaupten, daß seine Auctorität ihre Meinung begünstige. Sie berufen sich auf jenes an die Hebräer gerichtete Wort: „Es ist unmöglich, Solche, die einmal erleuchtet wurden und die himmlische Gabe gekostet haben, die des heiligen Geistes theilhaftig geworden sind und das köstliche Gotteswort und die Kräfte der neuen Welt gekostet haben, und die doch abgefallen sind, wiederum zur Sinnesumkehr zu erneuern, da sie den Sohn Gottes wiederum kreuzigen und ihn der Schmach preisgeben.“</p><p>Konnte denn nun Paulus wohl etwas lehren, was im vollen Gegensatze zu seiner eigenen Handlungsweise stünde? Er erließ dem Sünder in Korinth seine Vergehen auf Grund der Buße; wie sollte er denn nun selbst seinen eigenen Richterspruch vernichten können? Da er nicht niederreissen kann, was er selbst aufgebaut, so nehmen wir an, daß er hier nicht etwas Entgegengesetztes, sondern nur etwas Verschiedenes gesagt habe. Was entgegengesetzt ist, das widerstreitet sich selbst; was aber verschieden ist, das pflegt nur eine besondere Weise zu haben. Das Entgegengesetzte ist nicht so beschaffen, daß das Eine das Andere stützt. Da nun der Apostel von dem Nachlasse der Buße gepredigt hatte, so durfte er auch nicht von denjenigen schweigen, welche glauben, die Taufe sei zu wiederholen. Zuerst mußte uns die bange Sorge genommen werden, auf daß wir wüßten, auch diejenigen, welche nach der Taufe gesündigt, können Verzeihung ihrer Sünden erlangen, damit nicht etwa die der Hoffnung auf Verzeihung Beraubten von der nichtigen Meinung, als könnte <em>die Taufe</em> wiederholt werden, sich bethören ließen. Dann mußte er in begründeter Auslegung darthun, daß die Taufe in keinem Falle wiederholt werden könne.</p><p>Daß aber der Apostel hier von der Taufe gesprochen, das beweisen die Worte selbst, indem er sagt, „es sei unmöglich, daß die Gefallenen zur Buße <em>erneuert</em> würden“. <em>Erneuert werden wir ja gerade durch das Bad der Wiedergeburt,</em> wie der Apostel selbst sagt: „Denn wir sind mit ihm durch die Taufe zum Tode begraben, damit, gleichwie Christus auferstanden ist von den Todten durch die Herrlichkeit des Vaters, also auch wir <em>in der Neuheit</em> des Lebens wandeln.“ Anderswo sagt er: „<em>Erneuert euch</em> im Geiste eures Gemüthes, und ziehet den <em>neuen</em> Menschen an, der nach Gott geschaffen ist.“ Bei dem Psalmisten aber heißt es: „Deine Jugend wird sich, wie die des Adlers, <em>erneuern</em>.“ Es ersteht ja der Adler, nachdem er gestorben, aus seiner Asche, wie wir, in der Sünde erstorben, durch das Sakrament der Taufe für Gott wiedergeboren und umgeschaffen werden. Der Apostel lehrt also an der obigen Stelle <em>Eine Taufe</em>, wie er das auch anderswo sagt: „Ein Glaube, Eine Taufe.“</p><p>Auch das ist offenbar, daß in dem, der getauft wird, das Bild des Gekreuzigten abgeprägt wird; denn das Fleisch kann die Sünde nicht abthun. wenn es nicht in Christo Jesu gekreuzigt ist. So ist denn ja auch geschrieben, daß alle diejenigen, welche in Christo Jesu getauft sind, auf seinen Tod getauft sind. Wenn wir nun mit ihm zusammengepflanzt sind zur Ähnlichkeit seines Todes, so werden wir es auch zur Aehnlichkeit der Auferstehung sein; denn das wissen wir, daß unser alter Mensch mit angeheftet ist ans Kreuz. An die Kolosser schreibt der Apostel: „Mit dem seid ihr in der Taufe begraben, in welchem ihr auch auferstanden seid.“ Er schreibt so, damit wir glauben, daß er selbst in uns gekreuzigt wird, wie durch ihn unsere Sünden getilgt werden, daß er, der allein die Sünden nachlassen konnte, den Schuldbrief, der gegen uns lautete, an das Kreuz heftet. Ja in uns triumphirt er über die Gewalten und Mächte nach dem Worte des Apostels: „Er entwaffnete die Oberherrschaften und die Gewalten, führte sie einher und triumphirte über sie öffentlich durch sich selbst.“</p><p>Wenn der Apostel nun in dem an die Hebräer gerichteten Briefe sagt, „es sei unmöglich, die Gefallenen zur Sinnesumkehr zu erneuern, da sie den Sohn Gottes wiederum kreuzigen und ihn der Schmach preisgeben“, so meint er das so, daß wir annehmen müssen, er spreche von der Taufe, in welcher wir den Sohn Gottes in uns gekreuzigt darstellen, damit durch ihn die Welt auch uns gekreuzigt werde, die wir in einem gewissen Sinne triumphiren, indem wir die Aehnlichkeit des Todes desjenigen annehmen, der die Oberherrschaften und Gewalten am Kreuze siegreich entwaffnete und über sie triumphirte. Indem wir, eintretend in die Aehnlichkeit seines Todes, ihr Joch abwerfen, triumphiren auch wir über diese Mächte. Nun ist aber Christus nur einmal gekreuzigt, nur einmal der Sünde gestorben: und deßhalb gibt es nur eine, nicht mehrere Taufen.</p><p>Aber wie verhält es sich damit, daß er vorher „die Lehre von den verschiedenen Taufen“ vorausgeschickt hat? Da es im Gesetze viele Taufen gab, so tadelt der Apostel mit Recht diejenigen, welche das Vollkommene verlassen und zu den Anfangsgründen zurückkehren. Er lehrt uns, daß wir wissen müssen, wie die Taufen des alten Bundes alle zumal ihre Geltung verloren haben, und wie es unter den Geheimnissen der Kirche <em>nur eine Taufe</em> gibt. Er ermahnt uns aber auch, daß wir die Anfangsgründe der Lehre übergehen und zum Vollkommenen eilen. „Ja, dieses wollen wir thun“, sagt er, „wenn anders Gott es zuläßt“, denn ohne Gottes Hilfe kann Niemand vollkommen sein.</p><p>Uebrigens könnte ich demjenigen, der die Worte des Apostels von der Buße versteht, auch antworten, daß das, was bei den Menschen unmöglich, doch möglich ist bei Gott. Der Herr kann, wenn er will, die Sünden nachlassen auch da, wo uns die Nachlassung unmöglich scheinen möchte. Schien es doch auch unmöglich, daß das Wasser die Sünde abwaschen könnte, und ebenso glaubte auch Naaman der Syrer nicht, daß sein Aussatz durch das Wasser könnte hinweggenommen werden. Was aber in der That unmöglich war, das hat Gott, der uns so wunderbare Gnade verliehen, möglich gemacht. So schien es denn auch unmöglich, daß in der Buße die Sünden nachgelassen würden. Christus aber verlieh den Aposteln diese Gewalt, die von ihnen auf das priesterliche Amt übergegangen ist. Was also unmöglich schien, ist möglich geworden. — Gleichwohl überzeugt uns die richtige, begründete Auslegung, daß der Apostel hier von der Taufe spricht, daß sie nämlich nicht wiederholt werden soll.</p><h2>0</h2><p>Uebrigens würde der Apostel doch auch nicht gegen die offenbare Lehre Christi ankämpfen. Der Herr hat uns ein Gleichniß von einem Sünder, der Buße thut, in dem verlornen Sohne vorgeführt, der in ein fremdes Land ging und das Erbtheil, welches er von seinem Vater empfangen, in üppigem Leben verschwendete. Dann aber, als er seinen Hunger mit Träbern stillte, sehnte er sich nach dem Brode im Hause seines Vaters zurück. So erwarb er sich wieder das Ehrenkleid, den Ring an seine Hand, Schuhe an seinen Fuß: ihm zur Ehre wurde das Kalb geschlachtet, eine Hindeutung auf das Leiden des Herrn, durch welches uns das himmlische Sakrament bereitet ist.</p><p>Mit Recht heißt es: <em>„er ging in ein fremdes Land“</em>, weil er von den heiligen Altären getrennt war; so ist der Sünder von dem himmlischen Jerusalem, der vollen, wahren Heimath der Heiligen getrennt. Daß dort aber unsere Heimath ist, sagt auch der Apostel: „So seid ihr nicht mehr Gäste und Fremdlinge, sondern ihr seid Mitbürger der Heiligen und Hausgenossen Gottes.“</p><p>„Er verschwendete seine Vermögenssubstanz“ heißt es weiter. Mit Recht; denn der Sünder, dessen Glaube in den Werken schwach ist, verschwendet in gleicher Weise. Der Glaube ist ja nach den Worten des Apostels die „Substanz, der zu hoffenden Dinge und die Gewißheit von Dingen, die nicht gesehen werden.“ Fürwahr eine edle Substanz ist der Glaube, das Erbtheil unserer Hoffnung.</p><p>Es kann uns ferner nicht Wunder nehmen, daß derjenige dem Hungertode nahe kommt, welcher der himmlischen Nahrung entbehrt. „Ich will mich aufmachen“, spricht er dann voll Sehnsucht, „und zu meinem Vater gehen und ihm sagen: Mein Vater, ich habe gesündigt wider den Himmel und vor dir.“ Erkennet ihr nicht, daß uns dieses so bestimmt vorgehalten ist, weil wir zum Bitten angetrieben werden, um die Theilnahme an dem Geheimnisse uns zu erwerben: und ihr wollet wegnehmen, um deßwillen doch die Buße einzig übernommen wird? Nimm dem Steuermann die Hoffnung, zum Hafen zu gelangen: er wird mitten auf den Meeresflächen trostlos umherirren. Nimm dem Kämpfer den Siegeskranz: er wird ermattet in der Arena zusammenbrechen. Nimm dem Fischer die Aussicht auf den Fang: er wird ablassen, ferner noch die Netze auszuwerfen. Wie soll denn nun derjenige, welcher den Hunger seiner Seele ertragen muß, mit größerem Eifer Gott bitten können, wenn er verzweifelt, zu dem heil. Mahle wieder zugelassen zu werden?</p><p>„Ich habe gesündigt“ lautet die Anklage, „wider den Himmel und vor dir.“ Das ist das Bekenntniß einer Sünde zum Tode, damit ihr nicht etwa glauben möchtet, es könne Jemand, der Buße — gleichviel über welche Sünde — thut, rechtlich ausgeschlossen werden. Derjenige, welcher wider den Himmel gesündigt hat, der hat entweder gegen das Himmelreich oder gegen die eigene Seele gesündigt, und <em>das ist</em> eine Sünde zum Tode; er hat vor Gott gesündigt nach dem Worte des Psalmisten: „Dir allein habe ich gesündigt und Böses vor dir gethan.“</p><p>So rasch erwirkt er die Verzeihung, daß der Vater dem Ankommenden, aber noch weit Entfernten entgegeneilt; daß er ihm den Kuß, das Zeichen heiligen Friedens, gewährt, daß er das Kleid, das hochzeitliche Gewand, herbeibringen läßt, ohne welches man von der Theilnahme an dem Hochzeitsmahle ausgeschlossen wird. Den Ring gibt ihm der Vater an die Hand als Unterpfand der Treue, als Siegel des heiligen Geistes. Er läßt Schuhe bringen für die Füße des Heimgekehrten: muß ja auch derjenige, welcher das Ostermahl des Herrn feiert, von dem Osterlamme essen will, seine Füße bedeckt haben gegen alle Anfechtungen und Bisse der alten Schlange. Dann befiehlt der Vater, daß das Mahl bereitet werde: „Als unser Osterlamm ist ja Christus geopfert.“ Wie oft wir nun den Kelch des Herrn empfangen, verkündigen wir den Tod des Herrn. Wie er einmal für Alle gestorben ist, so nehmen wir, so oft die Sünden nachgelassen werden, Theil an dem Sakramente seines Leibes, so daß allezeit durch sein Blut die Nachlassung der Sünden bewirkt wird. So ist denn auf das Klarste durch das Wort des Herrn geboten, daß auch den schwersten Sündern, wenn sie aus ganzem Herzen und mit offenem Bekenntnisse ihrer Sünde Buße thun, die Gnade des himmlischen Geheimnisses wieder zu Theil werden soll. So ist denn außer Zweifel gestellt, daß für euch, ihr Novatianer, nichts zur Entschuldigung bleibt.</p><h2>0</h2><p>Es ist aber ferner zu unserer Kunde gekommen, daß ihr auch aus jenem Worte des Heilandes einen Einwurf nehmet: „Jede Sünde und Lästerung wird den Menschen nachgelassen; aber die Lästerung wider den heiligen Geist wird nicht nachgelassen werden. Und wer ein Wort wider des Menschen Sohn redet, dem wird vergeben werden: wer aber wider den heiligen Geist redet, dem wird weder in dieser, noch in der künftigen Welt vergeben werden.“ Mit dieser Anführung wird indeß euere ganze Behauptung umgestoßen und vernichtet. Es heißt ja: <em>„Jede Sünde und Lästerung wird den Menschen vergeben werden.“</em> Warum vergebet ihr denn nicht? Warum ziehet ihr Bande, die ihr nicht löset? Warum schlinget ihr Knoten, die ihr nicht lockert? Oder gewähret doch den Uebrigen Verzeihung und beschränket euch auf diejenigen, von denen ihr unter Berufung auf das Evangelium annehmet, daß sie als Sünder wider den heiligen Geist für immer gebunden sind.</p><p>Beachten wir dabei aber, welche Menschen der Heiland so belastet. Rufen wir uns, um das besser zu erkennen, ins Gedächtniß zurück, was jenem Worte des Herrn vorausgeht. Die Juden hatten erklärt: „Er treibt durch Beelzebub, den Obersten der Teufel, die Teufel aus.“ Jesus antwortete ihnen: „Ein jedes Reich, das wider sich selbst uneins ist, wird verwüstet werden, und eine jede Stadt und ein jedes Haus, das wider sich selbst uneins ist, wird nicht bestehen. Wenn nun ein Teufel den andern austreibt, so ist er wider sich selbst entzweit; wie wird dann sein Reich bestehen? Und wenn ich durch Beelzebub die Teufel austreibe, durch wen treiben dann eure Kinder sie aus?“</p><p>Von denen also ist hier, wie wir sehen, ausdrücklich die Rede, welche behaupten, der Herr Jesus treibe die Teufel durch Beelzebub aus. Ihnen antwortete der Herr so, weil das Erbe des Satan in ihnen wucherte, da sie den Erlöser der ganzen Welt mit dem Satan verglichen und die Gnadenerweise Christi in das Reich des Teufels verwiesen. Um es uns zweifellos zu machen, daß er von dieser Lästerung rede, fügt er hinzu: „Ihr Schlangengezücht, wie könnet ihr Gutes reden, da ihr böse seid?“ <em>Daß ihnen also, die so reden,</em> Verzeihung zu Theil werde, das leugnet er.</p><p>Als ferner Simon, durch die längst geübte Zauberei verdorben, glaubte, er könne die Gnadengabe Christi, welche durch Handauflegung und Eingießung des heiligen Geistes ertheilt wird, um Geld erkaufen, da sprach Petrus zu ihm: „Du hast keinen Antheil noch Erbe an dieser Lehre; denn dein Herz ist nicht aufrichtig vor Gott. Darum thue Buße über diese deine Bosheit und bitte Gott, daß dir etwa dieser Anschlag deines Herzens vergeben werde. Denn ich sehe dich voll bitterer Galle und von den Banden der Ungerechtigkeit umstrickt.“ Du siehst hier, daß Petrus kraft apostolischen Ansehens den Simon, der in thörichtem Zauberglauben befangen gegen den hl. Geist lästerte, verurtheilt und zwar mit um so größerem Rechte, weil jener das reine Bewußtsein des Glaubens nicht hatte. Gleichwohl verschloß er ihm nicht die Hoffnung auf Verzeihung, da er ihn ausdrücklich zur Buße einlud.</p><p>Der Herr hat also auf die Lästerung der Pharisäer die Antwort ertheilt. Er verweigerte denjenigen den Gnadenerweis seiner Macht, wie sie in der Nachlassung der Sünden sich offenbart, welche ihrerseits diese göttliche Macht der Hilfe und Stütze des Satan zuschrieben. Damit erklärt der Herr aber auch, daß diejenigen dem höllischen Geiste dienen, welche die Kirche des Herrn zertheilen, und so hat er die Häretiker und Schismatiker aller Zeiten zu denen gezählt, welchen er die Verzeihung versagt, weil jede andere Sünde gegen Einzelne gerichtet ist, während diese die Gesammtheit trifft. Diese Menschen allein sind es, welche die Gnade Christi entkräften wollen, welche die Glieder der Kirche zerreissen, um deretwillen der Herr Jesus gelitten, der er den heiligen Geist verliehen hat.</p><p>Damit ihr ferner nicht im Unklaren sein möchtet, daß er wirklich von den Zerstörern der Einheit redet, ist das weitere Wort gesprochen: „Wer nicht mit mir ist, der ist gegen mich, und wer nicht mit mir sammelt, der zerstreuet.“ Und dann fügt der Herr zur Erläuterung, von wem dieses Wort gilt, hinzu: „Darum sage ich euch: Jede Sünde und Lästerung wird den Menschen vergeben werden, aber die Lästerung wider den heiligen Geist wird ihnen nicht vergeben werden.“ Die Betonung der Worte: <em>„Darum sage ich euch,“</em> zeigt uns deutlich genug, daß gerade die folgenden Worte vor den übrigen von uns sollen besonders beachtet werden. Mit vollem Rechte setzte der Herr dann hinzu: „Ein guter Baum bringt gute Früchte, ein schlechter Baum aber bringt schlechte Früchte;“ also kann auch eine schlechte Genossenschaft keine guten Früchte bringen. Der <em>Baum</em> deutet auf eine Genossenschaft, die <em>guten Früchte</em> des Baumes aber sind die Kinder der Kirche.</p><p>So kehret denn zur Kirche zurück, die ihr euch gottloser Weise von ihr getrennt habt. Allen, die sich bekehren, wird Verzeihung zugesagt, wie geschrieben steht: „Jeder, der den Namen des Herrn anruft, wird gerettet werden.“ Um nur <em>ein</em> Beispiel anzuführen: das Volk der Juden, das von dem Herrn gesagt: „er hat einen Teufel“; das gelästert hat: „er treibt durch Beelzebub die Teufel aus“; dieses Volk, das den Herrn Jesus kreuzigte, wurde doch durch die Predigt des Apostels Petrus zur Taufe berufen, damit es die Schuld so schwerer Verbrechen ablege.</p><p>Was braucht es uns aber Wunder zu nehmen, wenn ihr das Heil Anderen verweigert, da ihr ja euer eigenes zurückweiset. Dabei geht dann freilich Jenen nichts verloren, welche von euch die Buße sich erbitten. Ich glaube in der That, daß auch Judas durch die unermeßliche Barmherzigkeit Gottes nicht von der Verzeihung ausgeschlossen wäre; nur hätte er die Buße nicht bei den Juden, sondern bei Christus übernehmen müssen. „Ich habe gesündigt,“ rief er, „weil ich unschuldiges Blut verrathen habe.“ Die Juden antworteten: „Was geht das uns an? da siehe du zu.“ Lautet eure Sprache vielleicht anders, wenn Jemand, der auch nur eines geringeren Vergehens schuldig ist, seine eigene That euch bekennt? Was antwortet ihr denn anders, als: „Was geht das uns an? da siehe du zu.“ Jenem Worte folgte dann der Strick der Verzweiflung: um so furchtbarer aber ist <em>die</em> Strafe, je kleiner die Schuld ist.</p><p>Wenn aber nun Jene sich nicht bekehren, so bekehret ihr wenigstens euch, die ihr Fall um Fall von der erhabenen Höhe der Unschuld und des Glaubens herabgestürzt seid. Wir haben einen guten, milden Herrn, der Allen verzeihen will, der auch dich durch den Propheten ruft: „Ich bin es“, sagt er, „ich allein bin es, der deine Übertretungen tilgt; und deiner Sünden gedenke ich nicht; du aber sei eingedenk und wir wollen rechten mit einander.“</p><h2>0</h2><p>Die Novatianer werfen aber auch noch eine Frage auf in Betreff der Worte des Apostels Petrus. Weil er zu Simon sagte: <em>„ob vielleicht</em> dir vergeben werde,“ glauben Jene, Petrus habe hier keineswegs <em>behauptet</em>, daß demjenigen, der Buße thue, die Sünden nachgelassen würden. Aber sie sollten doch bedenken, von wem der Apostel so redet: von Simon, dessen Glaube nicht in der treuen Hingabe wurzelte, der vielmehr nur auf falsche List sann. So sprach auch der Herr zu jenem Jünglinge, der ihm erklärte: „Ich will dir folgen“, — eben weil Jesus erkannte, daß seine Absichten nicht ganz rein seien —: „Die Füchse haben Höhlen.“ Wenn nun der Herr demjenigen, welchen er als nicht aufrichtig erkannte, vor der Taufe die Nachfolge verwehrte: wunderst du dich dann, wenn der Apostel denjenigen, welcher nach der Taufe so fehlte, nicht losspricht, da er ausdrücklich erklärt, jener werde in den Fesseln der Ungerechtigkeit verharren?</p><p>Diese Antwort mag den Gegnern genügen. Sonst behaupte ich aber, daß Petrus gar nicht gezweifelt hat, und ich glaube auch nicht, daß man den ganzen Vorgang mit der Ausdeutung eines einzigen Wortes — ich möchte sagen — erwürgen darf. Wenn sie behaupten, Petrus habe seinem Zweifel hier Ausdruck gegeben, hat dann vielleicht auch Gott gezweifelt? Aber er sagt doch beim Propheten Jeremias: „Stelle dich in den Vorhof am Hause des Herrn und sprich zu allen Städten Judas, aus denen man kommt, um anzubeten, alle Worte, die ich dir gebiete, zu ihnen zu reden; nimm kein Wort hinweg: <em>vielleicht</em>, daß sie hören und sich bekehren.“ So mögen denn die Gegner auch behaupten, <em>Gott sei gleichfalls die Zukunft unbekannt.</em></p><p>Keineswegs ist in diesem Worte die Unkenntniß der Zukunft ausgedrückt: es ist hier vielmehr der gewohnte einfache Sprachgebrauch der heil. Schrift beachtet. Sagt ja auch der Herr zum Propheten Ezechiel: „Menschensohn, ich sende dich zu den Söhnen Israels, zu abtrünnigen Völkern, die von mir abgewichen sind: sie und ihre Väter haben meinen Bund gebrochen bis auf diesen Tag. Du sollst nun zu ihnen sagen: So spricht Gott der Herr! <em>Vielleicht</em>, daß sie hören und erschrecken.“ Wußte denn nun vielleicht Gott nicht, ob Jene sich bekehren könnten oder nicht? Die angeführte Ausdrucksweise ist also keineswegs immer die Bezeichnung des <em>Zweifels</em>.</p><p>Uebrigens gebrauchen auch die weltlichen Schriftsteller, die doch ihren ganzen Ruhm in die zutreffende Wahl der Worte setzen, das gedachte Wort nicht ständig für den Ausdruck des Zweifels. Das lateinische ‚forte‘ entspricht dem griechischen <em>‚τάχα‘</em> [tacha]. Der erste unter den griechischen Dichtern sagt nun:</p><p>........ <em>ἥ τάχα χήρη Σεῦ ἔσομαι· τάχα γάρ σε κατακτανέουσιν Ἀχαιοί, Πάντες ἐφορμηθέντες</em>..... [hē tacha chērē seu esomai tacha gar se kataktaneousin Achaioi pantes ephormēthentes]</p><p>In diesen Worten sollte doch nicht der <em>Zweifel</em> daran Ausdruck finden, daß, wenn Alle anstürmten, leichtlich ein Einzelner von der ganzen Masse könnte niedergeworfen werden.</p><p>Wir bleiben indessen lieber bei den Beispielen aus unseren eigenen Schriftstellern, als daß wir zu fremden unsere Zuflucht nehmen. So lesen wir im Evangelium, daß der Vater, der seine Knechte bereits zu seinem Weinberge gesandt hatte, die aber getödtet waren, ausruft: „Ich will meinen geliebtesten Sohn senden; <em>vielleicht</em> daß sie vor ihm Ehrfurcht haben.“ Und anderswo sagt der Sohn von seiner eigenen Person redend: „Ihr kennet weder mich noch meinen Vater; wenn ihr mich känntet, so würdet ihr <em>wohl auch</em> meinen Vater kennen.“</p><p>Wenn nun Petrus Worte gebraucht, deren Gott sich bedient, ohne seinem Wissen irgend Eintrag zu thun: warum sollen wir nicht annehmen, daß Petrus dieselben Worte gebraucht, ohne seiner Ueberzeugung damit Abbruch thun zu wollen? Er konnte ja gar keinen Zweifel hegen hinsichtlich des Gnadengeschenkes Christi, der ihm die Gewalt, Sünden nachzulassen, gegeben hatte. Er konnte das um so weniger, als er doch den listigen Anschlägen der Häretiker keinen Spielraum gewähren durfte, die nur um deßwillen die Hoffnung des Menschen vernichten wollen, damit sie bei den Verzweifelnden um so leichter Eingang finden mit ihrer Lehre von der Wiederholung der Taufe.</p><p>Die Apostel aber, welche die Taufe festhalten, haben, der Unterweisung des Herrn folgend, auch die Buße verkündigt, haben Verzeihung verheißen, haben die Schuld nachgelassen. So hat auch David gelehrt, wenn er sagt: „Selig, deren Missethaten vergeben, deren Sünden bedeckt sind. Selig der Mann, dem der Herr die Sünde nicht angerechnet hat.“ Beide preiset David selig, sowohl denjenigen, dessen Missethat durch das Bad der Wiedergeburt getilgt, als auch denjenigen, dessen Sünde durch gute Werke bedeckt wird. Wer nämlich Buße thut, der muß seine Sünde nicht bloß mit Thränen abwaschen, sondern er muß auch die früheren Vergehen mit <em>gebesserten</em> Werken verhüllen und bedecken, damit ihm die Sünde nicht angerechnet werde.</p><p>So bedecken wir denn unsere Fehltritte mit den nachfolgenden Werken, tilgen wir sie mit den Thränen der Reue. Dann wird der Herr auch unser Seufzen hören, wie er Ephraim einst klagen hörte. Es steht ja geschrieben, daß der Herr gesprochen: „Aufhorchend hörte ich Ephraim, da er weinend klagte.“ Und er gibt selbst die Worte an, in welchen Ephraim seinen Schmerz ergossen: „Du hast mich gestraft, und du hast mich gezüchtigt, wie ein ungebändigt Kalb.“ Das Kalb springt unbändig und enteilt dem Stalle: Ephraim aber ist ungebändigt wie das Kalb und weit von der Heerde entfernt, weil es die Hut des Herrn verlassen hat und Jeroboam nachfolgend die Kälber verehrt hat, wie schon Aaron prophetischen Geistes vorausgesagt hatte, daß das Volk der Juden so fallen würde. Darum spricht Ephraim auch in seiner Buße: „Bekehre mich, so werde ich bekehrt, denn du bist der Herr mein Gott; in den letzten Tagen meiner Gefangenschaft habe ich Buße gethan. Seit ich zur Erkenntniß gekommen, seufze ich über die Tage meiner Schmach und bin dir unterworfen; ich bin beschämt und erröthe; denn ich trage die Schmach meiner Jugend. Ich habe Schmach empfunden, dann aber dich (den Anderen) gezeigt.“</p><p>Wir sehen hier, wie die Buße geübt werden, in welchen Worten und wie sie in Thränen Ausdruck finden muß; wir hören, daß die Tage der Sünde Tage der Schmach genannt werden und es ist in der That eine Schmach, wenn Christus verleugnet wird.</p><p>So unterwerfen wir uns denn Gott und seien wir nicht ferner unterthan der Sünde: wenn wir dann unserer Missethaten gedenken, so müssen wir über dieselben wie über eine tiefe Schmach erröthen. Wir dürfen sie nicht als Ehre ausgeben, wie manche Menschen, welche ihrer Sünden sich rühmen, nachdem sie freilich alle Scham vertrieben und das Gefühl der Gerechtigkeit gänzlich in sich erstickt haben. So vollkommen soll unsere Bekehrung werden, daß wir, die wir Gott vordem nicht erkannten, nun ihn sogar Anderen zur Erkenntniß bringen. Der Herr aber, durch unsere Umkehr bewegt, mag dann auch wohl zu uns sagen: „Von früher Zeit an ist Ephraim mir ein geliebter Sohn, ein zärtlich Kind; denn seit ich von ihm rede, gedenke ich sein auch; darum ist mein Inneres in Bewegung um seinetwillen, und ich erbarme mich sein, spricht der Herr.“</p><p>Welche Barmherzigkeit der Herr uns aber verspricht, das zeigt er uns mit den weiteren Worten: „Ich will trunken machen die erschöpften Seelen und sättigen jede hungernde. Darum bin ich, wie vom Schlafe erwacht und schaue, und mein Schlaf war mir angenehm.“ Wir erkennen daraus, daß der Herr den Sündern seine Gnadengeheimnisse verheißt: so bekehren wir uns denn sämmtlich zum Herrn.</p><h2>0</h2><p>Wollen nun die Anderen sich nicht bekehren, dann kehret ihr wenigstens um, die ihr in wiederholtem Falle von der erhabenen Höhe der Unschuld und des Glaubens herabgefallen seid. Wir haben ja einen guten, milden Herrn, der Allen gerne verzeihen will, der durch den Propheten dich gerufen hat mit den Worten: „Ich bin es, ich allein, der deine Missethaten tilgt; und deiner Sünden gedenke ich nicht; du aber sei eingedenk und wir wollen rechten mit einander.“ „Ich gedenke nicht“, sagt der Herr; „du aber gedenke daran“, mit anderen Worten: „Ich rufe die Sünden, welche ich dir verziehen habe, nicht in mein Gedächtniß zurück; mit Vergessenheit sind sie bedeckt; du aber gedenke daran. Ich denke ihrer nicht um der Gnade willen, die ich dir verliehen; du aber denke daran um der Besserung willen, damit du dir bewußt bleibst, daß die Sünde dir nachgelassen ist; damit du dich nicht rühmest, als seiest du unschuldig, damit du, indem du dich selbst rechtfertigst, dich nicht ärger belastest. Willst du gerechtfertigt sein, dann bekenne vielmehr deine Missethat. Das Band der Verbrechen wird durch schamerfülltes Bekenntniß gelöst.“</p><p>Du siehst also, was Gott von dir fordert: du sollst der Gnade eingedenk sein, die du empfangen hast, und sollst dich nicht überheben, als hättest du nicht empfangen. Du siehst, wie er durch das Versprechen der Verzeihung dich zum Bekenntniß auffordert. Siehe aber auch zu, daß du nicht durch Widerstand gegen die himmlischen Gebote in die Unbotmäßigkeit der Juden verfällst, zu denen der Herr Jesus gesagt hat: „Wir haben euch gespielt, da habt ihr nicht getanzt; wir haben geklagt, und ihr habt nicht geweint.“</p><p>Das scheint eine gewöhnliche Redensart, aber es birgt sich hier kein gewöhnliches Geheimniß. Deßhalb muß man vor Allem sich hüten, durch eine flache Auslegung dieser Worte getäuscht, anzunehmen, als würden hier die unzüchtigen Tänze des Theaters, die Thorheiten der Bühne empfohlen. Die bleiben auch für das jugendliche Alter sündhaft und verwerflich: es wird vielmehr ein heiliger Tanz empfohlen, wie David tanzte vor der Lade des Bundes. Das ziemt sich immer, was der Gottesverehrung gewidmet wird, und wir brauchen uns keines Dienstes, der sich auf die Verehrung Christi bezieht, zu schämen.</p><p>Der Tanz wird also nicht empfohlen, wie er als Genosse üppiger Lust auftritt, sondern in geistiger Uebertragung, wie er den Leib sich freudig erheben, wie er die Glieder nicht träge am Boden haften läßt, wie er die ausgetretenen Geleise zu verlassen zwingt. Es war ein geistiger Tanz des Apostels, als er nach seinen eigenen Worten „vergaß, was hinter ihm lag, und für uns nach dem sich ausstreckte, was vor ihm lag, als er dem Ziele zueilte, dem Siegespreise Jesu Christi.“ So wirst auch du, wenn du zur Taufe kommst, gemahnt, deine Hände zu erheben, deine Füße auf dem Gange zur Ewigkeit zu schnellerem Schritte anzutreiben. So ist der Tanz Genosse des Glaubens und der Gnade.</p><p>Da also liegt das Geheimniß: „Wir haben euch gesungen“, den Gesang nämlich des neuen Testamentes; „ihr aber habt nicht getanzt“, d. h. ihr habt euren Geist nicht zu himmlischer Gnade erhoben. „Wir haben geklagt, und ihr habt nicht geweint“, d. h. ihr habt nicht Buße gethan. Darum aber gerade ist das Volk der Juden verworfen, weil es nicht Buße gethan, weil es die Gnade zurückgewiesen hat. Durch Johannes ward die Buße, durch Christus die Gnade geboten. Diese <em>schenkt</em> der <em>Herr</em>, jene <em>verkündet</em> der <em>Diener</em>. Beides beobachtet aber die Kirche, und so erlangt sie die Gnade, während sie die Buße nicht verwirft: denn die Gnade ist Geschenk des verzeihenden Gottes, die Buße ist das Heilmittel des sündigen Menschen.</p><p>So wußte Jeremias, welches Heilmittel in der Buße lag, die er in seinen Klageliedern für Jerusalem übernahm. Darum führt er Jerusalem büßend ein mit den Worten: „Sie weinet des Nachts ohne Aufhören, und die Thränen laufen ihr über die Wangen: keiner von allen ihren Lieben tröstet sie. Die Wege nach Sion trauern.“ Dann fügt er hinzu: „<em>Darum</em> weine ich, und meinen Augen entströmen die Thränen, weil der Tröster, der mich wieder belebet, fern ist von mir.“ Das also war das herbste, bitterste Leid, daß der ferne war, welcher die Klagende tröstete. Wie könnet ihr nun selbst den Trost wegnehmen, indem ihr die Hoffnung auf Beendigung der Buße vorenthaltet?</p><p>Es mögen aber die, welche Buße thun, vernehmen, wie sie dieselbe üben sollen, mit welchem Eifer, mit welcher Gesinnung, mit welcher Absicht, mit welcher inneren Zerknirschung. „Siehe, Herr“, sagt der Prophet, „wie ich geängstet bin, mein Innerstes bebt, mein Herz wendet sich um in mir selbst.“</p><p>Das ist die innere Erschütterung der Seele: und wie ist die Treue der Gesinnung und die Haltung des Körpers? „Es sitzen auf dem Boden und schweigen die Aeltesten der Tochter Sions: sie bestreuen mit Asche ihre Häupter, gürten sich mit Trauergewand: zu Boden senken ihr Haupt die Jungfrauen Jerusalems, meine Augen vergehen vor Thränen; meine Eingeweide beben; ausgegossen auf die Erde ist mein Ruhm.“</p><p>So weinte auch das Volk Ninive’s und entging dadurch dem angedrohten Untergange der Stadt: so groß also ist die heilende Kraft der Buße, daß Gott um ihretwillen sogar seine Rathschlüsse zu ändern scheint. In dir ist es darnach gelegen, dem Urtheilsspruche zu entgehen; der Herr will gebeten sein, er will, daß du hoffnungsvoll zu ihm deine Zuflucht nimmst. Du bist ein <em>Mensch und willst gebeten</em> sein, ehe du verzeihest, und du glaubst, daß Gott dir verzeiht, ohne daß du ihn bittest?</p><p>Der Herr weinte einst selbst über Jerusalem, damit die heilige Stadt, selbst thränenlos, durch die Thränen des Herrn zur Verzeihung gelangen möchte. Er will aber, daß wir selbst weinen, damit wir dem Gerichte entgehen, wie er einst auch gesagt hat: „Ihr Töchter Jerusalems, weinet nicht über mich, sondern weinet über euch selbst!“</p><p>Auch David weinte einst und erwirkte dadurch, daß die göttliche Erbarmung dem Sterben des Volkes Einhalt that: unter dreien war ihm die Wahl gelassen, und er erwählte dasjenige, wobei die göttliche Barmherzigkeit in hellerem Lichte sich zeigen konnte. Was schämst du dich denn nun, über deine Sünden zu weinen, da doch Gott wollte, daß die Propheten weinten für die Völker?</p><p>So wurde auch Ezechiel geboten, über Jerusalem zu weinen, da er das Buch empfing, dessen Titel lautete: „Klagen, Gesang, Wehe!“ Zwei Trauerbezeichnungen, eine Freudenbezeichnung, weil ja derjenige in der Ewigkeit selig wird, der in diesem Leben geweint hat: „Das Herz des Weisen,“ sagt der Prediger, „ist da, wo Traurigkeit ist, und das Herz der Thoren ist im Hause der Ueppigkeit.“ Der Herr selbst aber sagt: „Selig, die ihr jetzt weinet: ihr werdet dereinst lachen.“</p><h2>0</h2><p>Wir wollen also weinen in der Zeit, damit wir dereinst jubeln in der Ewigkeit. Wir wollen den Herrn fürchten, wir wollen ihm zuvorkommen, indem wir unsere Sünden bekennen; wir wollen unsere Fehler bessern, unsere Verirrungen gut machen, damit nicht auch von uns das Wort gilt: „Weh’ mir, meine Seele! Verschwunden ist von der Erde der Fromme, und der sich besserte, findet sich nicht unter den Menschen.“</p><p>Was scheuest du dich denn nun, bei dem milden guten Herrn deine Missethaten zu bekennen? „Bekenne“, sagt doch der Prophet, „deine Missethaten, damit du gerechtfertigt werdest.“ So wird dem Schuldbeladenen der Lohn der Rechtfertigung in Aussicht gestellt; denn derjenige wird gerechtfertigt, der das eigene Vergehen freiwillig anerkennt: und zudem „ist der Gerechte zuerst, beim Beginne des Redens sein eigener Ankläger.“</p><p>Der Herr weiß freilich Alles, aber er erwartet gleichwohl das Wort deiner Anklage, nicht um dich zu strafen, sondern um dir zu verzeihen: er will eben nicht, daß der Teufel dir Schmach zufügt und dich anklagt, da du deine Vergehen verheimlichst. Komme diesem Ankläger zuvor: wenn du dich selbst anklagst, brauchst du keinen Ankläger zu fürchten; gibst du selbst dich an, so wirst du das getödtete Leben der Seele zurückerlangen.</p><p>Christus wird zu deinem Grabe kommen: wenn er dann sieht, daß Martha, das Weib des treuen Dienstes, um deinetwillen weint; wenn er Maria weinen sieht, die voll Aufmerksamkeit dem Worte des Herrn lauschte und so, der Kirche vergleichbar, den besten Theil erwählte: dann wird er, im Anblick so vieler Thränen, die um deinen Hingang fließen, von Mitleid bewegt werden und fragen: „Wo habt ihr ihn hingelegt?“ d. h. in welcher Klasse der Schuldigen, auf welcher Stufe der Büßenden befindet er sich? Ich will den sehen, um welchen ihr weinet, auf daß er selbst durch seine Thränen mich rühre; ich will sehen, ob er der Sünde, für welche Verzeihung erfleht wird, schon gestorben ist.</p><p>Dann wird das Volk ihm antworten: „Komm und siehe!“ Was soll das Wort: „Komme“? Das heißt: kommen soll die Verzeihung der Sünden, das Leben der Gestorbenen, die Auferstehung der Todten, kommen soll auch zu diesem Sünder dein Reich.</p><p>Er wird kommen und dann befehlen, daß der Stein gehoben werde, den die Fehltritte dem Nacken des Sünders aufgelegt haben. Er konnte den Stein entfernen mit dem Machtworte seines Mundes: es weiß ja auch die fühllose Natur dem Gebote Christi Folge zu geben. Es hätte selbst mit der lautlosen Macht unsichtbarer Willensthätigkeit Derjenige den Stein des Grabes entfernen können, bei dessen Leiden plötzlich die Grabsteine sich hoben und die Gräber vieler Todten sich öffneten. Gleichwohl befahl er den Umstehenden, den Stein wegzuwälzen, in <em>Wirklichkeit</em> um die Ungläubigen zum Glauben zu bringen, wenn sie den Gestorbenen erstehen sähen; <em>vorbildlich</em> aber, weil er uns auftragen wollte, die Lasten der Sünden, welche wie schwere Steine auf den Büßern liegen, zu erleichtern. So ist es denn unseres Amtes, die Lasten zu heben; sein Werk wird es sein, zu erwecken, die ihrer Todesfesseln Entledigten aus dem Grabe herauszuführen.</p><p>Im Anblicke der schweren Sündenlast weint dann auch der Herr Jesus: er erträgt es nicht, daß die Kirche <em>allein</em> weint. Er fühlt Mitleid mit seiner geliebten Braut und ruft dem Gestorbenen zu: „Komme heraus!“ d. h. du, der du in der Finsterniß deines schuldbeladenen Gewissens, in dem Schmutz deiner Sünden — das ist ja gleichsam der Kerker des Schuldigen — wie begraben liegst, komme heraus, gib kund deine Schuld, damit du die Rechtfertigung erlangest: „denn mit dem Munde geschieht das Bekenntniß zum Heile.“</p><p>Wenn du, von Christus gerufen, das Bekenntniß abgelegt hast, dann zerbrechen die Bande, dann lösen sich die Fesseln, wäre die Verwesung auch schon weit vorgeschritten. Lazarus hatte vier Tage im Grabe gelegen und das Fleisch verbreitete bereits den Geruch der Verwesung. Er aber, dessen Fleisch die Verwesung nicht schaute, lag nur bis zum dritten Tage im Grabe: ihm war fremd die Gebrechlichkeit des Fleisches, das aus Theilen der <em>vier</em> Elemente besteht. Wie durchdringend aber der Geruch der Verwesung auch sein mag, er verschwindet ganz, sobald der Duft heiliger Salbung sich ergießt. Dann erhebt sich der Todte: auf Befehl des Herrn werden die Bande desjenigen gelöset, der bislang in der Sünde begraben lag; von seinem Antlitze wird die Hülle genommen, welche die Gnade, die er in Wahrheit empfangen hatte, verschleierte. Da er aber jetzt mit der Verzeihung beschenkt ist, so erfolgt der Befehl, die Hülle zu entfernen, das Antlitz offen zu legen: der hat ja keinen Grund mehr zu erröthen, dem die Sünde erlassen ist.</p><p>Bei einer solchen Gnadenergießung, bei einem so erhabenen Wunder göttlicher Huld sollten doch Alle von Freude erfüllt werden; aber die Gottlosen werden zornig und halten einen Rath wider Christus, wie einstmals, da sie sogar den Lazarus zu tödten suchten. Erkennet ihr Novatianer aber nicht, daß ihr die Nachfolger jener Pharisäer seid, da ihr als die Erben ihrer Härte euch bewährt? Auch ihr seid ingrimmig und haltet einen Rath wider die Kirche, weil ihr sehet, daß in der Kirche die Todten wieder aufleben und durch die verliehene Verzeihung der Sünden wieder erweckt werden. So viel an euch liegt, möchtet ihr durch eure neidische Bosheit die Erstandenen wieder tödten.</p><p>Jesus aber widerruft seine Wohlthaten nicht, er erweitert sie vielmehr durch neuen Erguß seiner Freigebigkeit. Voll zarter Sorge betrachtet er den Erweckten, und hocherfreut über die gnadenvolle Auferstehung kommt er zu dem Mahle, das seine heilige Kirche bereitet hat, bei dem der Gestorbene zugleich mit den anderen Gästen bei Christus gefunden wird.</p><p>Dann sind voll freudigen Erstaunens Alle, welche mit reinem Geistesauge auf ihn sehen, welche den scheelen Blick des Neides nicht kennen: denn solche Kinder hat die Kirche: sie sind erstaunt, daß Jener, der gestern und vorgestern noch im Grabe lag, nun unter den anderen Geladenen mit dem Herrn Jesus zum Mahle niedersitzt.</p><p>Maria selbst gießt Salböl auf die Füße des Herrn Jesus: auf die Füße wohl um deßwillen, weil Einer aus den Geringsten dem Tode entrissen ist; wir Alle sind zwar der Leib Christi, aber Einige sind doch wohl erhabenere Glieder. So war der Apostel nach seinen eigenen Worten der Mund des Herrn. „Verlanget ihr einen Beweis, sagt er, für den aus mir redenden Christus?“ Auch die Propheten, durch welche der Herr die Zukunft verkündete, waren sein Mund: ach <em>ich</em> wünschte nur, wie der Fuß des Herrn zu sein. Wenn dann Maria doch ihr Salböl auch über mich ausgöße und so die Sünden tilgte!</p><p>Was wir nun von Lazarus lesen, das müssen wir von jedem bekehrten Sünder annehmen: wie häßlich auch der Geruch seiner Sünden sein mag, so wird er doch durch das kostbare Salböl des Glaubens gereinigt. Solch’ große Kraft hat der Glaube, daß, wo Tags zuvor noch Todtengeruch sich verbreitete, jetzt das ganze Haus mit dem Geruche der Heiligkeit erfüllt wird.</p><p>Häßlicher Sündengeruch lag auf jenem Hause in Korinth, als der Apostel schrieb: „Man hört von Unzucht unter euch und zwar von einer solchen Unzucht, dergleichen selbst unter Heiden nicht vorkommt.“ So hatte der Sauerteig des <em>einen</em> Sünders die ganze Masse verdorben. Bald aber stieg wiederum Wohlgeruch empor, als der Apostel sagte: „Wem ihr etwas verziehen habt, dem habe auch ich verziehen: denn was ich vergeben habe, das geschah euretwillen an Christi Statt.“ So herrschte denn um des bekehrten Sünders willen große Freude, und das ganze Haus duftete von dem Wohlgeruche der Gnade. Deßhalb konnte denn auch der Apostel, überzeugt, daß auf Alle das Salböl apostolischer Verzeihung sich ergieße, sagen: „Nun sind wir ein guter Geruch Christi vor Gott in denjenigen, welche gerettet werden.“</p><p>Als Maria das Salböl ausgoß, da freuten sich Alle; nur Judas widersprach. So widerspricht auch jetzt derjenige, der ein Verbrecher ist; es tadelt derjenige, der ein Verräther ist: von Christus aber wird er selbst getadelt, weil er das Heilmittel, das dem Tode des Herrn entquillt, verkennt, weil er das Geheimniß solchen Begrabens nicht faßt. Deßhalb hat ja Christus gelitten und ist gestorben, daß er uns von dem Tode erlösete. Das ist der erhabene Preis seines Todes, durch welchen der Sünder losgesprochen und zu neuer Gnade aufgenommen wird, damit Alle kommen und staunen, wenn er mit dem Herrn zu Tische sitzt. Dann preisen sie Gott und sagen: „Nun wollen wir essen und trinken: denn dieser war todt und lebet wieder: er war verloren und ist wieder gefunden.“ Sollte dann aber Jemand ungläubigen, widerspänstigen Herzens einwenden, warum doch der Herr mit Zöllnern und Sündern speise, dann wird ihm die Antwort werden: „Nicht die Gesunden bedürfen des Arztes, sondern die Kranken.“</p><h2>0</h2><p>Zeige also dem Arzte deine Wunde, damit Heilung eintreten kann. Er kennt sie freilich, wenn du sie auch nicht aufdeckst: aber er will nun einmal von dir das Wort der Anklage hören. Wasche mit deinen Thränen die Wunden deiner Seele. So hat jenes Weib im Evangelium ihre Sünde und den bösen Geruch ihrer Verirrung getilgt und ihre Schuld gelöscht, als sie mit ihren Thränen die Füße des Herrn netzte.</p><p>Möchtest du doch, o mein Jesus, auch mir überlassen, deine heiligen Füße zu waschen, die befleckt sind, seit du in mir wandelst! Wenn du doch mir gestatten wolltest, den Schmutz zu tilgen, mit welchem ich durch mein Handeln deine Schritte verunehrt habe! Aber ach woher will ich lebendiges Wasser nehmen, womit ich deine Füße waschen könnte? Habe ich nicht solches Wasser, so habe ich doch Thränen, und während ich mit meinen Thränen deine Füße benetze, reinige ich wohl auch mich selbst. Woher, o mein Jesus, soll mir die Gnade kommen, daß du auch zu mir sagst: „Ihm sind viele Sünden vergeben, weil er viel geliebet hat“? Ich muß es bekennen, daß ich mehr (viel) schuldete und daß mehr mir erlassen wurde, da ich von dem Lärm der Gerichtshändel, von den Schrecknissen öffentlicher Verwaltung zum Priesterthume berufen bin. Gerade deßhalb aber fürchte ich auch undankbar befunden zu werden, wenn ich, dem mehr nachgelassen ist, weniger liebe.</p><p>Freilich nicht Alle können jenem Weibe gleich kommen, die auch dem Simon mit Recht vorgezogen wurde, der doch dem Herrn das Mahl bereitet hatte. Sie hat für Alle, welche Verzeihung verdienen wollen, das Lehramt übernommen, da sie die Füße des Herrn mit Küssen bedeckte, mit Thränen benetzte, mit ihren Haaren abtrocknete und mit kostbarem Oele salbte.</p><p>Im Kusse liegt das Zeichen der Liebe; und deßhalb sagt der Herr Jesus mit dem Bräutigam des hohen Liedes: „Sie möge mich küssen mit dem Kusse ihres Mundes.“ Was bedeuten die aufgelösten Haare anders, als die Verzichtleistung auf jede Würde, welche die Welt dem Schmucke der Kopfbinde beilegt, und die dringende Bitte um Verzeihung? So sollst du selbst dich unter Thränen zu Boden werfen, und da liegend das Erbarmen Gottes erwirken. Unter dem Salböl ist der Wohlgeruch aufrichtiger Bekehrung verstanden. David war König, als er sprach: „Allnächtlich wasche ich mein Bett mit Weinen und benetze mit meinen Thränen mein Lager.“ Um deßwillen ist er aber auch des Gnadenvorzuges gewürdigt worden, daß aus seiner Familie die Jungfrau gewählt wurde, welche uns in ihrem Sohne den Messias geschenkt hat. Deßhalb wird denn auch dieses Weib im Evangelium selig gepriesen.</p><p>Wenn wir indessen jenes Weib in keiner Weise erreichen können, so weiß der Herr Jesus auch den Schwachen zu Hilfe zu kommen. Wo keine Maria vorhanden ist, das Mahl zu bereiten, das Salböl zu bringen, den Quell lebendigen Wassers mit sich zu tragen, da kommt er selbst zum Grabmale.</p><p>Ach Herr Jesus! wenn du dich doch herabließest, auch zu meinem Geistesgrabe zu kommen, um mich mit deinen Thränen zu baden! Ich berge in meinen nur zu sehr verschlossenen Augen keine Thränen, die meine Sünden tilgen könnten. Wenn <em>du</em> für mich Thränen vergossen hast, dann werde ich gerettet werden; werde ich <em>deiner</em> Thränen gewürdigt, dann tilge ich den bösen Geruch meiner Vergehen. Werde ich gewürdigt, daß du nur ein wenig über mich weinest, dann wirst du auch mich aus dem Grabe dieses Leibes rufen mit den Worten: „Komme heraus!“ Dann werden meine Gedanken nicht mehr in das enge Gefängniß der Leiblichkeit eingeschlossen bleiben; sie werden vielmehr herausgehen zu Christus, sie werden im Lichte sich bewegen: dann denke ich nicht mehr auf Werke der Finsterniß, sondern auf Werke des Lichtes. Wer auf Sünden denkt, der ist bestrebt, in seinem eigenen Bewußtsein sich einzuschließen.</p><p>Rufe denn deinen Knecht heraus! Gebunden zwar mit den Fesseln meiner Sünden, mit festumschlungenen Händen und Füßen, längst begraben in todten Gedanken und Werken, werde ich auf deinen Ruf doch fessellos, frei hervorgehen. Auch ich werde erfunden als Einer deiner Tischgenossen, und dein heiliges Haus wird mit kostbarem Salbenduft erfüllt werden: und wen du zu <em>erlösen</em> dich gewürdigt hast, den wirst du auch <em>bewahren</em>. Dann wird man sagen dürfen: „Siehe, er ist nicht von Kindheit an im Schooße der Kirche genährt und erzogen; er ist vielmehr vom Richterstuhle weggenommen, den Eitelkeiten dieser Welt entführt; er ist von dem Streiten des Gerichtssaales zum Psalmengesange gewöhnt: und bleibt jetzt im Priesterthume nicht um seiner Tugend willen, sondern lediglich durch die Gnade Jesu Christi und sitzt unter den Genossen des himmlischen Mahles!“</p><p>Behüte, Herr, dein Werk, schütze deine Gnadengabe, die du mir bereitet hast trotz meiner Flucht. Ich wußte ja, daß ich nicht würdig war, als Bischof berufen zu werden, weil ich der Welt mich ergeben hatte: aber durch deine Gnade bin ich nun, was ich bin. Ich bin zwar in Wahrheit der geringste und niedrigste unter allen Bischöfen; da ich aber doch irgendwelche Arbeit für deine heilige Kirche vollbracht habe, so schütze immerhin diese Frucht. Du hast mich als ein verloren Menschenkind zum Priesterthum berufen: laß jetzt nicht zu, daß ich als Priester verloren gehe! Vor Allem aber gib mir die Gnade, daß ich lerne, aus tiefstem Herzensgrunde Mitleid zu tragen mit den Sündern. Das ist ja die höchste Tugend, wie geschrieben steht: „Du hättest dich nicht freuen sollen über die Kinder Israels am Tage ihres Verderbens, nicht großsprechen am Tage ihrer Angst“ Gib, daß ich, so oft mir die Sünde eines Gefallenen entgegentritt, Mitleid trage: daß ich nicht übermüthig tadele, sondern mit ihm weine und traure. Gib, daß ich, während ich den Nächsten beweine, auch mich selbst beweine, auf mich das Wort anwendend: „Thamar ist gerechter, als ich.“</p><p><em>Sie</em> hat wohl in ihrer Jugend gesündigt, bethört und hingerissen durch die Gelegenheiten — allzeit Herd und Ursprung der Sünden —: aber auch wir sündigen noch trotz unseres Alters. Es streitet in uns das Gesetz des Fleisches gegen das Gesetz unseres Geistes und führt uns gefangen unter die Botmäßigkeit der Sünde, daß wir thun, was wir nicht wollen. Dort liegt noch eine Entschuldigung in dem jugendlichen Alter, <em>ich habe keine</em> Entschuldigung: die Jugend muß lernen, wir müssen lehren. Darum sage auch ich: „Thamar ist gerechter, als ich.“</p><p>Wir beschuldigen Jemanden des Geizes: aber dann denken wir doch auch nach, ob wir selbst niemals dem Geize gefröhnt haben! Ist das der Fall, dann sagen wir, da der Geiz die Wurzel aller Uebel ist und verborgen, gleichsam unterirdisch in unseren Herzen fortschleicht, ja sagen wir Mann für Mann: „Thamar ist gerechter, als ich.“</p><p>Wenn wir gegen Jemanden heftig erregt sind, so ist es für den Laien eine geringere Sache, in der Aufregung etwas gethan zu haben, als für den Bischof. Erwägen wir das nur bei uns und dann sagen wir: „Derjenige, welcher der Erregtheit beschuldigt wird, ist wohl weniger schuldig als ich.“ Wenn wir so reden, dann bewahren wir uns selbst davor, daß der Herr oder einer seiner Jünger zu uns sagt: „Du siehst den Splitter im Auge deines Bruders, aber den Balken im eigenen Auge siehest du nicht. Du Heuchler! ziehe zuerst den Balken aus dem eigenen Auge, und dann mögest du zusehen, auch den Splitter aus dem Auge des Nächsten zu ziehen.“</p><p>Schämen wir uns also nicht, zu gestehen, daß unsere Schuld schwerer ist, als die desjenigen, den wir glauben anklagen zu dürfen. So sprach auch Juda, da er die Thamar beschuldigte, aber zugleich an die eigene Schuld erinnert wurde: „Sie ist gerechter, als ich bin.“ Darin liegt aber ein tiefes Geheimniß und ein heiliges Gebot; und gerade deßhalb ist es seiner Schuld nicht zugerechnet, weil er sich eher selbst anklagte, als er von Anderen angeklagt wurde.</p><p>Freuen wir uns also nicht über die Sünden eines Anderen, trauern wir vielmehr, wie auch geschrieben steht beim Propheten: „Freue dich nicht über mich, meine Feindin; wenn ich gefallen, werde ich wieder auferstehen; wenn ich im Dunkel sitze, wird der Herr mein Licht sein. Den Grimm des Herrn will ich tragen, — denn ich sündigte wider ihn, — bis er meinen Handel schlichtet, und mir Recht schafft: er wird mich an’s Licht bringen, und ich werde seine Gerechtigkeit schauen. Sehen wird es meine Feindin, und Scham wird sie decken, die da sprach zu mir: Wo ist der Herr, dein Gott? Meine Augen werden sich an ihr letzen; bald wird sie zertreten sein, wie Koth der Gasse.“ Nicht mit Unrecht geschieht das; denn derjenige, welcher sich am Falle des Nächsten ergötzt, freut sich über den Sieg des Teufels. So beklagen wir es denn tief, wenn wir hören, daß ein Mensch zu Grunde gegangen, für den Christus doch in den Tod gegangen ist: er, der auch des Halmes bei der Ernte nicht vergißt.</p><p>O daß er doch bei der Ernte auch <em>diesen</em> Halm, das heißt den tauben Haferhalm, der <em>meine</em> Frucht ausmacht, nicht wegwerfen, sondern sammeln möchte, wie Einer sagt: „Weh mir! ich bin geworden, wie einer, der Halmen sammelt zur Erntezeit, wie einer, der Trauben sammelt bei der Weinlese!“ Vielleicht fände er doch wenigstens die Erstlinge seiner Gnade in mir genießbar, wenn er auch das Spätere nicht billigen könnte.</p><h2>0</h2><p>Nach dem Gesagten ist es also durchaus zutreffend, daß wir sowohl an die Nothwendigkeit der Buße, als an die Möglichkeit der Verzeihung glauben; freilich mit der Beschränkung, daß wir die Verzeihung nur auf dem Grunde des Glaubens, nicht als eine pflichtmäßige Leistung hoffen. Es ist ja doch ein Anderes, etwas <em>verdienen</em>, und etwas <em>von vornherein in Anspruch nehmen</em>. Der Glaube <em>erbittet</em> die Verzeihung gleichsam auf Grund eines Vertrages; die Verzeihung aber ohne Weiteres <em>fordern</em>, steht thörichter Anmaßung näher als demüthiger Bitte. Zahle du zuerst, was du schuldig bist; dann verdienst du vielleicht, daß du darum bitten mögest, was du gehofft hast. Biete dar die Gesinnung eines guten Schuldners, damit du nicht gezwungen wirst, deine Schuld mit einer neuen Anleihe zu decken, damit du vielmehr mit der Münze deines Glaubens die eingegangene schwere Verpflichtung lösest.</p><p>Derjenige, welcher Gott schuldet, hat übrigens reichere Hilfsmittel, zu zahlen, als derjenige, welcher einem Menschen schuldig ist. Der Mensch verlangt für das dargeliehene Geld eben Geld zurück, und das steht dem Schuldner nicht immer zur Verfügung: Gott verlangt die innere Gesinnung, und die liegt allezeit in deiner Willensmacht. Niemand, der Gott schuldet, ist arm, es sei denn, daß er sich selbst arm gemacht hat. Hat er nichts, was er verkaufen könnte, so hat er doch genug, womit er zahlen kann. Beten, Weinen, Fasten bildet für den willigen Schuldner einen Vermögensstand, der weit reicher ist, als wenn Jemand von dem Kaufpreise seiner Aecker das Geld darbietet ohne Glauben.</p><p>So war Ananias arm, als er nach dem Verkaufe seines Ackers das Geld zu den Aposteln trug: er konnte seine Schuld damit nicht tilgen, verwickelte sich vielmehr nur noch tiefer hinein. Reich aber war jene Wittwe, welche die beiden geringen Münzen in den Schatzkasten warf, von der gesagt wurde: Sie hat mehr als Alle hineingelegt. Was Gott heischt, ist nicht die Gabe an Geld, sondern der (treue) Glaube.</p><p>Uebrigens leugne auch ich keineswegs, daß durch Freigebigkeit gegen die Armen die Sünde vermindert wird; nur muß der Glaube die Gaben empfehlen. Oder was nützt die Hingabe des Vermögens ohne die Liebe?</p><p>Es gibt Menschen, die lediglich um des äußeren Ruhmes willen die Zierde der Freigebigkeit an den Tag legen, so zwar, daß sie für ganz besonders erprobt wollen angeschen sein, weil sie nichts für sich zurückbehalten. Da sie aber den Lohn <em>dieser</em> Welt suchen, so sichern sie sich den der zukünftigen Welt nicht: da sie hier den Lohn empfangen haben, so können sie weiteren nicht hoffen.</p><p>Es gibt aber auch Andere, welche in augenblicklicher, gewaltsamer Erregtheit, nicht nach ruhiger Ueberlegung ihre Mittel erst der Kirche schenkten und dann nachher glaubten, die Gabe widerrufen zu müssen. Diesen ist weder der erste noch der zweite Lohn bestimmt; die Gabe war ohne Ueberlegung gemacht und der Widerruf derselben ein Sacrilegium.</p><p>Es gibt endlich Menschen, welche es bereuten, daß sie ihr Vermögen den Armen gegeben hatten: aber diejenigen, welche Buße thun, dürfen das in keinem Falle bereuen, damit sie nicht etwa über ihre Buße selbst wieder Buße thun. Denn gar Viele erbitten sich die Buße im Bewußtsein ihrer Sünden aus Furcht vor der künftigen Strafe; haben sie dieselbe dann empfangen, so lassen sie sich abschrecken durch die Beschämung der öffentlichen Bitte. Solche scheinen die Buße allerdings für böse Handlungen erbeten zu haben, aber dann gerade für <em>diese gute That</em> zu verrichten.</p><p>Einige fordern geradezu deßbalb die Buße, um alsbald der kirchlichen Gemeinschaft wieder zurückgegeben zu werden. Sie wünschen eigentlich gar nicht sich zu lösen, sondern nur den Priester zu binden. Sie befreien ihr Gewissen nicht von der Schuld und belasten das Gewissen des Priesters, dem gesagt ist: „Gebet das Heilige nicht den Hunden und werfet die Perlen nicht vor die Säue:“ d. h. den unreinen Herzen ist die Zulassung zur heiligen Gemeinschaft nicht zu gewähren.</p><p>Dann magst du sie vielleicht sehen, wie sie in rasch gewechseltem Kleide einherschreiten, während sie trauern und seufzen sollten, weil sie das Kleid des Taufbades und der Gnade befleckt haben. Du kannst sehen, wie Frauen ihre Ohren mit Perlen belasten, und wie ihre Nacken sich krümmen, die sie wahrlich nicht für Christus mit Gold niederbeugen: und doch müßten sie sich selbst beweinen, weil sie die Perle, die vom Himmel stammt, verloren haben.</p><p>Andere glauben, darin bestehe die Buße, daß sie von den himmlischen Geheimnissen sich ferne halten. Die sind aber doch zu grausame Richter gegen sich selbst, welche sich eine Buße auflegen und das Heilmittel versagen; sie hätten wohl Grund, über ihre Buße selber Schmerz zu empfinden, weil sie um die himmlische Gnade betrogen wurden.</p><p>Wieder Andere glauben, die in Aussicht gestellte Hoffnung, Buße thun zu dürfen, erweitere ihnen die Freiheit zu sündigen, während doch die Buße das Heilmittel der Sünde, aber nicht das Reizmittel zum Sündigen ist. Für die Wunde ist das Heilmittel nothwendig, nicht aber umgekehrt für das Heilmittel die Wunde: denn jenes wird wegen dieser gesucht, aber keineswegs wird die Wunde um des Heilmittels willen begehrt. Schwach ist die Hoffnung, welche zukünftiger Zeit anvertraut wird; denn alle Zeit ist ungewiß und in keinem Fall überdauert die Hoffnung alle Zeit.</p><h2>0</h2><p>Sollte denn wohl Jemand billigen, daß du Gott zu bitten erröthest, während du Menschen zu bitten nicht erröthest? daß du dich schämst, vor Gott, dem du doch nicht verborgen bist, als Flehender zu stehen, während du dich nicht schämst, einem Menschen, der dich nicht kennt, deine Sünden zu bekennen? Du fliehest Zeugen deines Bußgebetes, während du doch, wo es sich um eine Leistung an Menschen handelt, gar Viele angehen und bitten mußt, daß sie für dich eintreten: da mußt du auf den Knieen liegen, den Staub ihrer Füße mußt du küssen, du mußt deine Kinder sogar, die deiner Schuld doch fremd sind, als Fürsprecher darbieten, um dem Vater die Verzeihung zu erwirken. In der <em>Kirche</em> Alles dieses zu thun: <em>Gott</em> flehentlich zu bitten, bei <em>seinem heiligen Volke</em> Schutz und Fürsprache nachzusuchen, — davor schreckst du zurück; — und doch ist hier gar keine Veranlassung zum Schämen, oder höchstens im Nichtbekennen gegeben, da wir ja Alle Sünder sind. Je demüthiger Jemand ist, desto mehr ist er des Lobes würdig; je verächtlicher er sich erscheint, desto gerechter ist er.</p><p>Laß nur die Kirche, unsere Mutter, für dich weinen, laß sie nur mit ihren Thränen deine Schuld abwaschen! Möchte nur Christus dich traurig sehen, damit er auch zu dir sagt: „Selig sind die Traurigen, denn sie werden sich freuen.“ Es ist ihm lieb, wenn Viele für Einen bitten. So hat er ja auch nach dem Evangelium, durch die Thränen der Wittwe bewegt, weil Viele für sie weinend baten, den Sohn derselben zum Leben erweckt. Aus demselben Grunde hat er auch schneller den Petrus erhört, so daß die Dorkas sich wieder erhob, weil eben die Armen den Tod derselben beweinten. Ebenso hat er dem Petrus verziehen, weil er so bitterlich weinte. Und wenn auch du so bitterlich weinest, dann wird Christus auf dich hinsehen, und die Schuld wird schwinden. Die Anwendung des Schmerzes vertreibt die Ueppigkeit des Lasters, die Lust der Sünde. Wenn wir demnach die begangenen Sünden betrauern, so schließen wir künftige aus, und so entsteht aus der Verurtheilung der Schuld eine Zuchtschule der Unschuld.</p><p>So laß dich denn durch Nichts von der Buße abziehen: sie ist dir ja mit den Heiligen gemein: wäre sie nur so nachzuahmen, wie sie in dem Weinen der Heiligen sich kundgab! David aß Asche wie Brod und mischte seinen Trank mit Thränen: darum freut er sich jetzt auch mehr, weil er mehr geweint hat: „Fluthen von Wasser, sagt er, rinnen nieder meine Augen.“</p><p>Auch Johannes weinte sehr, und <em>dann</em> sagt er, daß ihm die Geheimnisse Christi offenbart seien. Jenes Weib aber, welches, während es hätte weinen sollen, weil es in Sünden war, sich freuete, mit Purpur und Scharlach sich bekleidete und mit Gold und kostbaren Steinen sich schmückte: dieses Weib beklagt nun das schreckliche Loos ewigen Weinens.</p><p>Mit Recht werden deßhalb diejenigen getadelt, welche glauben, die Buße sei öfter zu üben; sie sündigen durch Leichtfertigkeit gegen Christus. Wenn sie aufrichtig die Buße übten, so würden sie nicht meinen, sie könnten diese Uebung wiederholen; denn wie es nur <em>eine</em> Taufe gibt, so gibt es auch nur <em>eine</em> Buße, <em>sofern sie öffentlich geübt wird</em>. Die täglichen Fehler freilich muß man immer wieder sühnen; solche Buße gilt aber den leichteren, jene öffentliche den schwereren Sünden.</p><p>Ich finde übrigens wohl leichter Menschen, welche ihre Unschuld bewahrt haben, als solche, welche in entsprechender Weise Buße geübt haben. Kann man da an Buße glauben, wo das Streben nach Würden fortbesteht, wo der Wein fließt, wo sogar der eheliche Umgang fortgesetzt wird? Nein, man muß den Genüssen der Welt entsagen: selbst dem Schlafe soll man weniger nachgeben, als die Natur fordert: mit Weinen muß man ihn stören, mit Seufzern unterbrechen, mit Gebeten zurückdrängen. So muß das Leben sich gestalten, daß wir der gewöhnlichen Lebensweise absterben; der Mensch muß sich verleugnen und ein ganz anderer werden. Es paßt eben die Geschichte von jenem Jünglinge, welcher, um den Banden einer buhlerischen Liebe zu entgehen, weit fortreiste und erst zurückkehrte, als die Liebe in seinem Herzen ertödtet war. Da begegnete er einst der früheren Geliebten, welche verwundert darüber, daß er sie nicht anredete, der Meinung war, sie sei von ihm nicht wieder erkannt. Ihm entgegeneilend rief sie deßhalb: <em>„Ich bin es ja.“</em> Der Jüngling antwortete das kurze Wort: <em>„Gewiß, aber ich bin nicht mehr Ich.“</em></p><p>Mit Recht sagt also der Herr: „Wer mir nachfolgen will, der verleugne sich selbst, nehme sein Kreuz auf sich und folge mir nach.“ Die gestorben und begraben sind in Christo, die dürfen (zum Leben zurückgekehrt) nicht wieder urtheilen, als lebten sie noch in der Welt; deßhalb setzt der Apostel hinzu: „Rühret nicht an, tastet nicht an, was Alles zum Verderben gereicht schon durch den Gebrauch“, weil schon die gewöhnliche Art, das Leben zu genießen, zum Verderben gereicht für die Unschuld.</p><h2>0</h2><p>Um die Buße ist es also etwas Gutes: bestände sie nicht, so würden wohl Alle, die Taufgnade zu empfangen, bis ins hohe Alter zögern. Denen, welche so denken, mag ein Wort zur Erwiderung dienen: es ist doch besser ein Kleidungsstück zu haben, das man flicken, als überhaupt Nichts zu haben, womit man sich bekleiden kann. Freilich wird <em>nur das einmal</em> Geflickte wieder haltbar, während das wiederholt Geflickte zerreißt.</p><p>Diejenigen aber, welche ihre Buße verschieben, hat der Herr selbst deutlich genug gemahnt mit den Worten: „Thuet Buße, denn das Himmelreich hat sich genahet.“ Wir wissen ja nicht, zu welcher Stunde der Dieb kommt; wir wissen nicht, ob nicht in der nächsten Nacht unsere Seele von uns gefordert wird. Den <em>Adam</em> verjagte Gott unmittelbar nach der Sünde aus dem Paradiese, ohne damit zu warten: aber er trennte ihn und Eva von dem Lustgarten, damit sie eben Buße übten. Darum bekleidete er sie auch sogleich mit einem Gewande von Thierfellen, nicht von Seide.</p><p>Warum verschiebst du also die Buße? Etwa, um noch weitere Sünden zu begehen? Also weil Gott gut ist, darum bist du böse und verachtest den Reichthum der Güte und Langmuth Gottes? Und doch sollte die Güte des Herrn dich nur noch mehr zur Buße führen! Deßhalb sagt auch David zu Allen: „Kommt, wir wollen anbeten und niederfallen vor dem Herrn, weinen vor ihm, der uns geschaffen hat.“ Daß aber hinsichtlich des Sünders, der ohne Buße gestorben ist, nur noch tiefes Klagen und Weinen Platz greift, das zeigt uns David, da er weint und klagt: „Mein Sohn Absalon, mein Sohn Absalon!“ Wer eben völlig todt ist, der wird ohne jede Hoffnung beweint.</p><p>Von Jenen aber, welche verbannt und den väterlichen Grenzen, die das heilige Gesetz dem Moses vorzeichnete, entrissen in die Irrungen der Welt sollten verwickelt werden, hörst du den Psalmisten singen: „An den Flüssen Babylons, da saßen wir und weinten, wenn wir Sions gedachten.“ Die Seufzer der Gefallenen zeigen ja, daß diejenigen zurückkehren müssen, welche noch in dem Zustande der laufenden Zeit, der schwindenden Welt sich befinden: nach dem Beispiele Jener, welche eben zur Sühne ihrer Vergehen in die Schmach der Gefangenschaft geführt waren.</p><p>Nichts aber ist so sehr schmerzlich, als wenn Jemand unter der Herrschaft der Sünde sich erinnert, <em>wie er zum Falle gekommen ist;</em> weil er damals von der erhabenen reinen Richtung auf die göttliche Erkenntniß sich zum Irdischen und Vergänglichen hat abwenden lassen.</p><p>So siehst du, wie Adam sich verbirgt, sobald er erkannt hat, daß der Herr zugegen ist. Er wollte sich verbergen, da er gesucht, da er gerufen ward von dem Herrn mit jenem Worte, welches das Gemüth des Verstockten verwundete. „Adam, wo bist du?“ rief der Herr, das heißt: Warum verbirgst du dich? warum fliehest du denjenigen, den du sonst zu schauen verlangtest? So groß ist das Schuldbewußtsein des Gewissens, daß es auch ohne Richter sich selbst straft und sich zu verbergen wünscht, während es freilich vor Gott offen daliegt.</p><p>Deßbalb darf denn auch Jemand, der noch in der Leidenschaft haftet, in keinem Falle die Theilnahme an den Gnadengeheinmissen für sich in Anspruch nehmen. Es steht ja das Wort geschrieben: „Du hast gesündigt, stehe also ab.“ So sagt auch David: „An den Weidenbäumen hingen wir auf unsere Harfen“; und bald darnach: „Wie sollten wir singen des Herrn Gesang im fremden Lande?“ Wenn nämlich das Fleisch dem Geiste widerstreitet und dem Steuer der Seele, der Herrschaft des Geistes nicht unterthan ist, so ist das „fremdes Land“, noch nicht bewältigt durch das Mühen des Bebauers, und darum kann es denn auch die Früchte der Liebe, Geduld und des Friedens nicht hervorbringen. Es ist also dann besser, abzustehen, weil du die Werke der Buße nicht üben kannst, damit nicht während der Buße selbst etwas geschieht, was nachher wiederum der Buße bedürfte. Ist die Buße <em>einmal</em> angemaßt und nicht rechtlich gefeiert, dann erzielt sie nicht die Frucht der früheren und hindert gleichzeitig den Gebrauch der späteren.</p><p>Wenn nun das Fleisch widerstreitet, dann muß der Geist auf Gott gerichtet sein, und wenn die Werke nicht folgen, dann soll doch der Glaube nicht weichen. Wenn des Fleisches Lüste oder feindliche Mächte uns anfechten, muß der Geist ergeben bleiben; denn am meisten werden wir dann bedrängt, wenn das Fleisch unterliegt; und es gibt Solche, die mit aller Gewalt sich auf die arme Seele werfen, bestrebt, ihr allen Schutz zu entziehen. Da gilt also das Wort: „Vernichtet, vernichtet sie <em>bis auf den Grund</em>!“</p><p>Wie mitleidvoll sagt David: „<em>Arme</em> Tochter Babylons!“ In der That „arm“, weil die Tochter Babylons jene ist, welche aufgehört hat, Gottes Tochter zu sein. Gleichwohl ladet er für sie den Arzt, da er sagt: „Wohl dem, der deine Kinder nimmt und zerschmettert am Felsen!“ Das will sagen: Wohl dem, der deine schlechten schlüpfrigen Gedanken vertreibt und dein Denken auf Christus richtet, der alle unzulässigen Bewegungen deines Geistes durch die Ehrfurcht, die er einflößt, und durch seinen Zuspruch niederdrückt. So sehr ist das der Fall, daß, wenn Jemand in ehebrecherischer Liebe entbrannt ist, er dann die Gluth dämpft, die Bande der Lust zerreißt und sich selbst seinen früheren Bestrebungen entzieht, damit er Christus gewinne.</p><p>So haben wir denn erkannt, daß einerseits Buße geübt, daß sie andererseits aber zu einer Zeit geübt werden muß, wann die Lust der Leidenschaft schwindet; wir haben erkannt, daß wir während der Herrschaft der Sünde eben ehrfurchtsvoller im Enthalten, als anmaßend im widerrechtlichen Begehren sein müßten. Wenn schon dem Moses, der näher hinzutreten wollte, um die Erkenniß des himmlischen Geheimnisses zu schöpfen, von dem Herrn das Wort zugerufen wurde: „Löse die Schuhe von deinen Füßen“: wie viel mehr müssen wir dann die geistigen Füße von den körperlichen Banden lösen und unsere Schritte von jedem Zusammenhange mit dieser Welt befreien!</p>
