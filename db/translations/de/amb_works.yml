      <p><em>Über die Mysterien, übersetzt von BKV-Ausgabe (Bibliothek der Kirchenväter).</em></p><p><strong>Die moralische Unterweisung der Katechumenen [1], die mystagogische der Neophyten [2].Die Taufzeremonie der apertio [Öffnung der Ohren] [3—4].</strong></p><p>Von dem sittlichen Verhalten hat täglich unser Vortrag im Anschluß an die Lesung, sei es der Geschichte der Patriarchen, sei es der Vorschriften des Spruchbuches gehandelt. Ihr solltet euch durch die Einführung und Unterweisung hierin daran gewöhnen, in die Pfade der Altvordern einzutreten, ihren Weg zu wandeln und den göttlichen Aussprüchen zu folgen, um nach der Neugeburt durch die Taufe jene Lebensführung einhalten zu können, welche den Getauften ziemt.</p><p>[Forts. v. ] Jetzt mahnt die Zeit zur Besprechung der Mysterien und zur Enthüllung des Wesens der Sakramente selbst. Hätten wir das vor der Taufe Nichttäuflingen mitteilen zu sollen geglaubt, hätte man uns das mehr als Verrat denn als Enthüllung verübeln müssen. Und noch ein Grund: es sollte den Ahnungslosen das Licht der Geheimnisse besser unmittelbar sich eingießen, statt daß ihm irgendeine Besprechung vorausging.</p><p>So öffnet denn eure Ohren und kostet des süßen Wohlgeruches des ewigen Lebens, der euch mit der Gabe der Sakramente eingehaucht wurde! Denn das wollten wir euch zu verstehen geben, als wir bei der geheimnisvollen Zeremonie der apertio die Worte sprachen: „Epheta, das heißt öffne dich!“ Jeder, der zum Gnadenborn hinzutreten sich anschickte, sollte wissen, wonach gefragt würde, mußte im Gedächtnis haben, was er zu antworten hätte.</p><p>[Forts. v. ] Dieses Geheimnis, wie wir lesen, vollzog schon Christus im Evangelium, als er den Taubstummen heilte. Doch <em>er</em> berührte auch den Mund, weil seine Heilung zugleich einem Stummen und einem Manne galt: an dem einen (nahm er die Berührung vor), um dessen Mund durch Mitteilung der Sprache zu öffnen, an dem anderen, weil eine solche Berührung beim Manne wohl am Platze war, bei einer Frau nicht.</p><p><strong>Der Eintritt ins Baptisterium [5—6].Die feierliche Abschwörung [renuntiatio] daselbst [7].</strong></p><p>[Forts. v. ] Hierauf ward dir das Allerheiligste erschlossen, du tratest ein in das Heiligtum der Wiedergeburt. Erinnere dich, wonach du gefragt worden bist, denk daran, was du geantwortet hast! Du hast widersagt dem Teufel und seinen Werken, der Welt und ihrer Pracht und ihren Lüsten. Dein Wort steht nicht in einer Totengruft, sondern im Buche der Lebendigen verewigt.</p><p>Dort hast du den Leviten, hast du den Priester, hast du den Bischof gesehen. Laß deinen Blick nicht an leiblichen Gestalten, sondern an der Geheimnisse Gnade haften! In Gegenwart von Engeln hast du gesprochen, wie geschrieben steht: „Die Lippen des Priesters bewahren die Wissenschaft, und aus seinem Munde erbitten sie das Gesetz; denn ein Engel des Herrn des Allmächtigen ist er“. Da gibt es kein Trügen, kein Leugnen: ein Engel ist‘s, der das Reich Christi und das ewige Leben ankündigt. Nicht wegen seiner äußeren Erscheinung, sondern wegen seines Amtes zollst du ihm Hochachtung. Was er dir verliehen, das überdenke! Seine Handlung erwäge, aber auch seinen Stand erkenne!</p><p>[Forts. v. ] So bist du denn eingetreten, um deinem Widersacher fest ins Auge zu blicken, indem du ihm ins Angesicht widersagen zu müssen glaubtest. Gen Osten wendetest du dich; denn wer dem Teufel widersagt, wendet sich Christus zu, <em>ihm</em> schaut er geraden Blickes ins Auge.</p><p><strong>Gottes Gegenwart und Wirksamkeit im Taufwasser [8]. Das Taufbad durch das Kreuz Christi ein Heilsbad. Biblische Vor- und Sinnbilder [9—18].</strong></p><p>Was hast du geschaut? Wasser — ja, doch nicht allein, Leviten (sahst du), wie sie daselbst Dienste taten, den Hohenpriester, wie er Fragen stellte und die Weihe (des Taufwassers) vornahm. Allen voran belehrte dich schon der Apostel, daß wir „nicht auf das Sichtbare, sondern auf das Unsichtbare sehen“ sollten; „denn das Sichtbare ist zeitlich, das Unsichtbare aber ewig“. Auch anderswo liest man ja: „Denn das Unsichtbare an Gott läßt sich seit der Weltschöpfung an den geschaffenen Dingen wahrnehmen, desgleichen seine ewige Macht und Gottheit“ an den Werken ermessen. Daher spricht auch der Herr selbst: „Wenn ihr mir nicht glaubt, glaubt wenigstens meinen Werken!“ So glaube denn an Gottes Gegenwart dortselbst! An seine Wirksamkeit glaubst du: an seine Gegenwart wolltest du nicht glauben? Wie könnte seine Wirksamkeit folgen, wenn nicht erst seine Gegenwart vorausginge?</p><p>Bedenk aber, wie alt das Geheimnis ist. Schon bei der Weltentstehung ward es vorgebildet. Schon am Anfange, da Gott den Himmel und die Erde schuf, „schwebte“, so heißt es, „der Geist über den Wassern“. Er, der über den Wassern schwebte, wirkte er nicht auch über den Wassern? Doch was sage ich ‚wirkte‘? ‚Er schwebte‘, das bezieht sich auf seine Gegenwart. Er, der da schwebte, wirkte nicht? Überzeuge dich, daß er beim Bau der Welt wirksam war, nachdem der Prophet dich versichert: „Durch das Wort des Herrn sind die Himmel gefestigt, und durch den Geist seines Mundes all ihre Kraft“. Beides, daß er schwebte und daß er wirkte, stützt sich auf ein prophetisches Zeugnis: daß er schwebte, versichert Moses; daß er wirkte, bezeugt David.</p><p>[Forts. v. ] Vernimm ein weiteres Zeugnis! Verderbt war alles Fleisch ob seiner Ungerechtigkeiten. „Nicht soll“, sprach Gott, „mein Geist in den Menschen bleiben; denn sie sind Fleisch“. Gott wollte damit zeigen, wie durch die fleischliche Unreinheit und die Makel schwererer Sünde die geistige Gnade vertrieben wird. Darum ließ Gott, da er wiederherstellen wollte, was verloren war, die Sintflut entstehen und hieß den gerechten Noë in die Arche steigen. Als nun die Flut nachließ, entließ dieser, während er zuvor einen Raben entsandt hatte, der nicht zurückkehrte, eine Taube, die, wie man liest, mit einem Ölzweige wiederkehrte. Da siehst du Wasser, siehst du Holz, erblickst du eine Taube: und du zweifelst, ob ein Geheimnis vorliegt?</p><p>Das Wasser nun ist es, worin das Fleisch zur Abwaschung jeglicher fleischlichen Sünde getaucht wird; jegliche Schandtat wird dort begraben. Das Holz ist es, an welches der Herr Jesus angeheftet wurde, als er für uns litt. Die Taube ist es, in deren Gestalt, wie du aus dem Neuen Testamente weißt, der Heilige Geist herabstieg, der dir den Frieden der Seele, die Ruhe des Geistes einhaucht. Der Rabe ist ein Bild der Sünde: sie zieht aus und kehrt nicht wieder, wenn nur auch in dir des Gerechten Hut und Norm gewahrt wird.</p><p>[Forts. v. ] Noch ein drittes Zeugnis liegt vor, wie der Apostel dich lehrt: „daß unsere Väter alle unter der Wolke waren und alle durch das Meer hindurchgingen und alle auf Moses getauft wurden in der Wolke und im Meere“. So singt denn auch Moses selbst in seinem Lobgesang: „Du sendetest Deinen Geist, und es bedeckte sie das Meer“. Du gewahrst, wie schon damals in jenem Durchzug der Hebräer die heilige Taufe vorgebildet ward: der Ägypter fand darin Untergang und der Hebräer Rettung. Denn was anders wird uns tagtäglich in diesem Sakramente kund, als daß die Schuld versenkt und die Sünde getilgt wird? Die Frömmigkeit und Unschuld hingegen blieben sicher.</p><p>[Forts. v. ] Unter einer Wolke, wie du hörst, waren unsere Väter, und zwar unter einer Segenswolke, welche die Glut der Leidenschaften des Fleisches abkühlte. Eine Segenswolke überschattet jene, welche der Heilige Geist heimsucht. So kam er über die Jungfrau Maria, „und die Kraft des Allerhöchsten überschattete sie“, da sie dem Menschengeschlechte die Erlösung gebar. Und zwar hatte jenes Wunder, das durch Moses geschah, sinnbildliche Bedeutung. Wenn folglich der Geist nur sinnbildlich zugegen war, kann von keiner wirklichen Gegenwart die Rede sein gemäß der Versicherung, welche dir die Schrift gibt: „Das Gesetz ist durch Moses gegeben worden, die Gnade aber und die Wahrheit ist durch Christus geworden“.</p><p>Zu Mara war eine Quelle mit Bitterwasser. Da warf Moses ein Holz hinein und sie ward süß. Das Wasser nämlich ohne die Predigt vom Kreuze des Herrn nützt ganz und gar nichts zum künftigen Heile. Da es aber, durch das Geheimnis des Kreuzes eingeweiht, zum Heilswasser geworden: da nun dient es bestimmungsgemäß zum Geistesbad und Heilstrank. Gleichwie also in jene Quelle Moses, d. i. der Prophet, Holz warf, so senkt auch in diesen Quell der Priester die Predigt vom Kreuze des Herrn, und sein Wasser wird zum süßen Gnadenborn.</p><p>[Forts. v. ] Du darfst also nicht lediglich nur deinen leiblichen Augen glauben. Mehr des Schauens bietet das Unsichtbare; denn ersteres gewährt nur zeitlichen, letzteres, das nicht mit den Augen sich sehen, wohl aber mit dem geistigen Sinn sich schauen läßt, ewigen Anblick.</p><p>Endlich mag dich die Lesung der Königsbücher, die wir durchgegangen, belehren. Naaman war ein Syrer und litt am Aussatze und vermochte von niemand gereinigt zu werden. Da sprach ein Mägdlein von den Gefangenen, es sei ein Prophet in Israel, der ihn von der ansteckenden Krankheit des Aussatzes reinigen könne. Er nahm nun, wie es heißt, Gold und Silber und zog zum König von Israel. Dieser zerriß, da er den Grund seines Kommens erfuhr, seine Kleider und meinte, es handle sich mehr um einen Anschlag wider ihn, da man von ihm Dinge verlange, die nicht in der Gewalt eines Königs lägen. Elisäus indes legte dem König nahe, er solle den Syrer zu ihm kommen lassen, damit er erfahre, daß es einen Gott in Israel gebe. Und als er gekommen war, befahl er ihm, siebenmal im Jordanflusse unterzutauchen.</p><p>[Forts. v. ] Da begann jener bei sich zu denken, daß doch seine heimatlichen Gewässer besser seien, in die er so oft getaucht, ohne je einmal vom Aussatze abgewaschen zu werden. Und er wollte, hierdurch beirrt, den Anweisungen des Propheten nicht Folge leisten. Doch gab er dem Mahnen und Zureden seiner Diener nach und tauchte unter. Da ward er auf der Stelle rein und sah ein, daß die Reinigung eines Menschen nicht vom Wasser, sondern von der Gnade ausgeht.</p><p>[Forts. v. ] Vernimm nun, wer jenes jüngere Mägdlein aus den Gefangenen sei! Es ist die Heidenkirche, d. i. die Kirche des Herrn, die vordem, da sie sich noch nicht der Freiheit der Gnade erfreute, unter der Gefangenschaft der Sünde schmachtete. Auf ihren Rat hörte jenes törichte Heidenvolk auf der Propheten Wort, an dem es vordem solange zweifelte, während es indes nachher, sobald es dasselbe befolgen zu sollen glaubte, von jeglicher Sündenbefleckung reingewaschen wurde. Jener Naaman zweifelte wohl, bevor er geheilt wurde: du bist schon geheilt und darfst darum nicht zweifeln.</p><p><strong>„Ohne den Geist keine Reinigung durch das Wasser“ [19], „ohne das Wasser kein Geheimnis der Wiedergeburt“ [20], Biblische Zeugnisse und Vorbilder [21-25].</strong></p><p>Darum wurde dir vorhin eingeschärft, nicht lediglich nur das zu glauben, was du sahst, daß nicht auch du etwa sprächest: das nun soll jenes große Geheimnis sein, „das kein Auge gesehen und kein Ohr gehört hat und in kein Menschenherz gekommen ist?“ Wasser nur sehe ich, wie ich es alle Tage gesehen: das soll mich reinigen? So oft stieg ich hinein und nimmer ward ich rein? Lerne daraus, daß das Wasser ohne den Geist nicht reinigt!</p><p>[Forts. v. ] Eben darum hast du gelesen, daß die drei Zeugen bei der Taufe <em>eins</em> sind: Wasser, Blut und Geist; denn wenn du sie auf einen derselben einschränkst, besteht das Sakrament der Taufe nicht zu recht. Was ist denn das Wasser ohne das Kreuz Christi? Ein gewöhnliches Element ohne irgendwelche sakramentale Wirkung. Und umgekehrt: ohne Wasser kein Geheimnis der Wiedergeburt; denn „wer nicht wiedergeboren ist aus dem Wasser und dem Geiste, kann in das Reich Gottes nicht eingehen“. Es glaubt aber auch der Katechumene an das Kreuz des Herrn Jesus, mit dem auch er bezeichnet wird; doch wenn er nicht getauft wird im Namen des Vaters und des Sohnes und des Heiligen Geistes, kann er den Nachlaß der Sünden nicht empfangen und der geistigen Gnade Geschenk nicht eintrinken.</p><p>[Forts. v. ] Jener Syrer tauchte siebenmal kraft des Gesetzes unter; du aber wardst getauft im Namen des dreieinigen Gottes: du hast den Vater bekannt — sei dessen eingedenk, was du getan! — hast den Sohn bekannt, hast den Heiligen Geist bekannt. Halte Punkt für Punkt fest an diesem Glauben! Der Welt bist du abgestorben und Gott bist du auferstanden. In jenem irdischen Elemente gleichsam begraben und der Sünde gestorben, bist du zum ewigen Leben wiedererweckt worden. Glaube also, daß das Wasser nicht bedeutungslos ist!</p><p>Darum gilt dir das Wort: „Ein Engel des Herrn stieg von Zeit zu Zeit in den Schwimmteich hinab und das Wasser kam in Bewegung. Wer nun zuerst nach der Bewegung des Wassers in den Schwimmteich hinabstieg, wurde gesund, mit welchem Siechtum er immer behaftet war“. Dieser Teich war in Jerusalem, und ein einziger nur erhielt alljährlich seine Gesundheit wieder: doch niemand erhielt dieselbe, bevor nicht der Engel hinabgestiegen war. Um anzuzeigen, daß der Engel hinabgestiegen war, kam das Wasser in Bewegung — der Ungläubigen wegen: diesen frommte das Zeichen, dir der Glaube; für sie stieg ein Engel hinab, für dich der Heilige Geist; für sie trat ein Geschöpf in Bewegung, für dich tritt Christus, der Herr der Schöpfung selbst, in Wirksamkeit.</p><p>[Forts. v. ] Damals wurde nur <em>einer</em> geheilt, jetzt finden alle Heilung, oder doch allein nur das eine Christenvolk; denn es gibt auch welche mit „trügerischem Wasser“. Nicht heilt die Taufe der Ungläubigen, nicht reinigt sie, sondern befleckt nur. Der Jude spült Krüge und Becher ab, als könnten unvernünftige Dinge für Schuld oder Gnade empfänglich sein: du spüle in der Taufe den Kelch dieses deines vernünftigen Wesens ab, daß darin deine guten Werke leuchten, daß darin deiner Gnade Glanz erstrahle! Auch jener Teich hatte also typische Bedeutung: du solltest glauben, daß Gottes Kraft in diesen (Tauf-) Bronnen niedersteigt.</p><p>„Einen Menschen“ endlich erwartete jener Gichtbrüchige. Wen anders als den Herrn Jesus, den aus der Jungfrau Geborenen, kraft dessen Ankunft nicht mehr der Schatten nur je einen, sondern die Wahrheit alle heilen sollte? Er ist es sonach, der erwartet wurde, daß er herniedersteige. Von ihm sprach Gott der Vater zu Johannes dem Täufer: „Der, auf den du den Geist vom Himmel herabsteigen und ruhen siehst darauf, ist es, der mit dem Heiligen Geiste tauft“. Von ihm bezeugte Johannes: „Ich sah den Geist wie eine Taube vom Himmel herabsteigen und auf ihm ruhen“. Und warum stieg hier der Geist „wie eine Taube“ herab, als daß du sehest, als daß du erkennest, daß auch jene Taube, die der gerechte Noë aus der Arche entsendete, nur ein Bild jener obigen Taube war? Als daß du hierin einen Typus des Sakramentes erblickest?</p><p>Vielleicht möchtest du einwenden: Wenn jene Taube, die entsendet ward, eine wahre Taube war, hier „wie eine Taube“ herabstieg: wie können wir dort vom Bilde, hier von der Wahrheit reden? Lesen wir doch nach dem griechischen Schrifttexte, es sei der Geist „im Bilde der Taube“ herabgestiegen. Doch was wäre so wahr als die Gottheit, die ewig währt? Das Geschöpfliche hingegen, das so leicht vergeht und wechselt, kann nicht die Wahrheit, sondern nur deren Bild sein. Zugleich ein anderer Grund: die Herzenseinfalt derer, die sich taufen lassen, darf nicht Schein, sondern muß Wahrheit sein. Darum auch des Herrn Mahnung: „Seid listig wie die Schlangen und einfältig wie die Tauben!“ Mit Recht also stieg er wie eine Taube herab, um uns die Taubeneinfalt als Pflicht einzuschärfen. Daß aber species (Bild, Gestalt) auch gleichbedeutend mit veritas (Wahrheit) genommen werden muß, lesen wir sowohl von Christus — „Und an Gestalt ward er als ein Mensch befunden“ — als auch von Gott dem Vater: „Und nicht hast du seine Gestalt geschaut“.</p><p><strong>Die Gegenwart Christi in der Taufe kraft der priesterlichen Handlung [26—27]. Der Glaube an die Wesensgleichheit der drei göttlichen Personen durch den Wortlaut des Taufbekenntnisses gewährleistet [28].</strong></p><p>[Forts. v. ] Bleibt da noch Raum zu Zweifeln, da dir klar und laut im Evangelium des Vaters Stimme tönt, der beteuert: „Dieser ist mein Sohn, an dem ich mein Wohlgefallen habe“, des Sohnes Stimme tönt, über welchem der Heilige Geist wie eine Taube sich zeigte, auch des Heiligen Geistes Stimme tönt, der wie eine Taube herabstieg, Davids Stimme tönt: „Die Stimme des Herrn erscholl über den Wassern, der Gott der Herrlichkeit ließ seine Donner erdröhnen, der Herr über vielen Wassern“, da dir die Schrift bezeugt, wie auf der Baalspriester Bitten kein Feuer vom Himmel fiel und umgekehrt auf des Elias Flehen Feuer gesendet ward, das den Frevel sühnte?</p><p>Sieh nicht auf die persönlichen Verdienste, sondern auf der Priester Dienste! Und wenn du auf Verdienste schauen willst: wie du auf Elias siehst, so schaue auch auf des Petrus oder des Paulus Verdienste, die uns dieses vom Herrn Jesus überkommene Geheimnis überliefert haben! Jenen ward ein sichtbares Feuer gesendet, daß sie glauben: uns zum Heil wirkt ein unsichtbares, die wir glauben; ihnen diente es zum Sinnbild, uns zur Mahnung. So glaube denn, daß der Herr Jesus zugegen ist, herabgerufen durch das Gebet der Priester! Versichert er doch: „Wo zwei oder drei sind, da bin auch ich“. Wieviel mehr läßt er sich da, wo die Kirche ist, wo seine Geheimnisse sind, mit dem Geschenk seiner Gegenwart herab!</p><p>[Forts. v. ] Du bist hinabgestiegen. Erinnere dich, was du geantwortet: du wollest glauben an den Vater, glauben an den Sohn, glauben an den Heiligen Geist! Da heißt es nicht: ich glaube an einen Größeren und an einen Geringeren und an einen Letzten. Vielmehr liegt schon im gleichlautenden Bekenntnisse deines Mundes die Pflicht verbürgt, daß du gleicherweise an den Sohn glaubst, wie du an den Vater glaubst, gleicherweise an den Heiligen Geist glaubst, wie du an den Sohn glaubst. Eine einzige Ausnahme bildet dein Bekenntnis auf den Glauben: der Herr Jesus allein ist gekreuzigt worden.</p><p><strong>Die Salbung des Hauptes nach dem Taufakt [29—30]. Die zweifache Bedeutung der Fußwaschung beim letzten Abendmahl [31—33].</strong></p><p>Sodann bist du heraufgestiegen zum Priester. Bedenke, was dann folgte! Nicht der Vorgang, den David ausgesprochen: „Wie Salböl auf dem Haupte, das herniederfließt auf den Bart, auf den Bart Aarons?“ Es ist dies das Salböl, von dem auch Salomo gesprochen: „Ausgegossenes Salböl ist Dein Name, darum gewannen Dich die Mägdlein lieb und zogen Dich an sich“. Wie viele neugetaufte Seelen entbrannten heute in Liebe zu Dir, Herr Jesus, und riefen: „Zieh uns nach Dir! Dem Wohlgeruche Deiner Kleider laufen wir nach“, um den Wohlgeruch der Auferstehung einzuschlürfen.</p><p>[Forts. v. ] Wisse, warum das geschieht! Weil „die Augen des Weisen in seinem Haupte sind“. Darum floß das Salböl zum Bart, d. i. zur Zierde der Jugend hernieder; darum zum Bart Aarons hernieder, daß du ein auserwähltes, ein priesterliches, ein kostbares Geschlecht würdest; denn alle werden wir zum Reich Gottes und zum Priestertum durch die geistige Gnade gesalbt.</p><p>[Forts. v. ] Du bist heraufgestiegen aus dem Taufbronnen. Erinnere dich an das Lesestück des Evangeliums! Unser Herr Jesus nämlich hat im Evangelium seinen Jüngern die Füße gewaschen. Da er nun zu Simon Petrus kam, rief Petrus aus: „Du wäschst mir die Füße in Ewigkeit nicht!“ Er verstand das Geheimnis nicht, und darum lehnte er den Dienst ab; es dünkte ihn nämlich für zuviel für die Demut eines Dieners, wenn er den Dienst des Herrn sich ruhig gefallen ließe. Der Herr aber erwiderte ihm: „Wenn ich dir die Füße nicht wasche, wirst du keinen Teil an mir haben“. Da Petrus dies hörte, rief er aus: „Herr, nicht allein die Füße, sondern auch die Hände und das Haupt“. Da antwortete der Herr: „Wer gewaschen ist, bedarf nicht mehr, als daß er die Füße wasche, sondern ist ganz rein“.</p><p>Petrus war rein. Aber den Fuß mußte er waschen; denn er war als Erbfolger des ersten Menschen sündebehaftet, nachdem einmal die Schlange dessen Fuß nachgestellt und ihn irregeführt hatte. Die Fußwaschung an ihm bezweckt sonach die Tilgung des Erbsündlichen; denn unsere eigenen Sünden werden durch die Taufe nachgelassen.</p><p>[Forts. v. ] Erkenn zugleich, wie der Dienst der Niedrigkeit selbst ein Geheimnis birgt! Denn es spricht (der Heiland): „Wenn <em>ich</em>, der Herr und Meister, euch die Füße gewaschen, wieviel mehr müßt auch ihr euch gegenseitig die Füße waschen!“ Nachdem er, der Urheber des Heils, auf dem Wege des Gehorsams uns erlöste, wieviel mehr müssen auch wir, seine Knechte, der Demut und des Gehorsams willfährigen Dienst leisten!</p><p><strong>Die weißen Kleider der Neophyten das Symbol der Taufunschuld, das Brautgewand der Seele, bezw. der Kirche bei ihrer mystischen Vereinigung mit Christus [34—41]. Vom Sakrament der Firmung [42].</strong></p><p>Danach hast du das weiße Kleid empfangen zum Zeichen, daß du ausgezogen die Hülle der Sünden und angezogen der Unschuld reines Gewand. Darauf bezieht sich das Wort des Propheten: „Besprenge mich mit Ysop, und rein werde ich sein; wasche mich, und weißer werde ich sein denn Schnee“. Der Getaufte nämlich erscheint nach Gesetz und Evangelium rein: nach dem Gesetz, weil Moses mit dem Ysopbüschel das Blut des Lammes aussprengte; nach dem Evangelium, weil Christi Kleider weiß waren wie Schnee, als er seine Auferstehungsherrlichkeit im Evangelium zeigte. „Weißer denn Schnee“ wird, wem die Schuld nachgelassen wird. Darum spricht auch der Herr durch den Propheten: „Wären eure Sünden rot wie phönizischer Purpur: weiß wie Schnee will ich sie machen“.</p><p>Mit diesen Kleidern angetan, die sie aus dem Bad der Wiedergeburt nahm, ruft die Kirche im Hohen Lied aus: „Ich bin schwarz und schön, Töchter Jerusalems: schwarz ob der Gebrechlichkeit der menschlichen Natur, schön infolge der Gnade; schwarz, weil aus Sündern hervorgegangen, schön durch das Sakrament des Glaubens. Dieser Kleider ansichtig, fragen die Töchter Jerusalems voll Verwunderung: „Wer ist die, welche weißgekleidet heraufsteigt?“ Sie war schwarz, wie ward sie plötzlich weiß?</p><p>[Forts. v. ] So wurden auch die Engel irre, als Christus auferstand, so wurden die Gewalten irre, als der Fleischgewordene in den Himmel auffuhr. So fragten sie denn: „Wer ist dieser König der Herrlichkeit?“ Und während die einen riefen: „Hebet auf die Pforten eures Fürsten und erhebet euch, ihr ewigen Pforten, und einziehen wird der König der Herrlichkeit“, zweifelten andere und fragten: „Wer ist dieser König der Herrlichkeit?“ Auch bei Isaias liest man, wie die himmlischen Mächte ausriefen: „Wer ist der, so heraufkommt von Edom? Das Rot seiner Kleider stammt aus Bosra, herrlich prangt er in weißem Kleide“.</p><p>[Forts. v. ] Christus aber spricht, da er seine Kirche, für welche er selbst, wie man im Buche des Propheten Zacharias liest, „schmutzige Kleider“ angenommen hatte, bezw. da er die im Bade der Wiedergeburt rein gewordene und abgewaschene Seele schaut: „Sieh, schön bist du, meine Schwester, sieh, schön bist du! Deine Augen gleichen Taubenaugen“. In Gestalt der Taube stieg der Heilige Geist vom Himmel herab. Schön sind ihre Augen, wie Taubenaugen, weil in Taubengestalt der Heilige Geist vom Himmel herniederstieg.</p><p>Und im folgenden: „Deine Zähne sind wie eine Herde geschorener Ziegen [besser ist: Schafe? grex tonsarum], die aus der Schwemme heraufgestiegen sind, alle zwillingsträchtig, und kein unfruchtbares ist unter ihnen. Wie eine Purpurschnur sind Deine Lippen“. Kein geringes Lob. Erst der liebliche Vergleich mit Schurziegen. Die Ziegen weiden ja bekanntlich sonder Fährde auf den Höhen und grasen sicheren Trittes an steilen Hängen. Ihre Schur sodann befreit sie von überflüssigem Ballast. Mit einer Herde solcher Ziegen wird die Kirche verglichen ob der Tugendfülle der Seelen, welche durch die Taufe den Ballast der Sünden ablegen, welche Christus den Glauben der Eingeweihten und die sittliche Gnadenschönheit entgegenbringen, welche das Kreuz des Herrn im Munde führen.</p><p>[Forts. v. ] In ihnen spiegelt sich die Kirche als „die Schöne“. Darum der Lobpreis Gottes des Wortes an sie: „Ganz schön bist du, meine Schwester, und Tadeliges ist nicht an dir“. Ihre Schuld ist nämlich versenkt worden. „Du bist hierher gekommen vom Libanon, Braut, du bist hierher gekommen vom Libanon: vom Glauben ausgehend wirst du vorübergehen, zum Ziele gehen“. Der Welt widersagend ist sie nämlich am Zeitlichen vorübergegangen, zu Christus übergegangen. „Wie bist du schön und anmutsvoll geworden, meine Liebe, in deinen Reizen? Dein Wuchs gleicht der Palme, deine Brüste Trauben“.</p><p>[Forts. v. ] Da erwidert ihm die Kirche: „Wer wird dich, Bruder, mir geben, daß du der Mutter Brüste saugest? Wenn ich dich draußen finde, werde ich dich küssen, und nicht soll man mich verachten. Ich will dich mitnehmen und dich führen in das Haus meiner Mutter, in das geheime Gemach derer, die mich empfangen. Da wirst du mich lehren“. Du siehst, wie sie, über die Gnadengabe entzückt, ins Innere der Geheimnisse einzudringen und all ihr Sinnen Christus zu weihen begehrt. Noch sucht, noch weckt sie die Liebe und fleht, sie möchte auch von den Töchtern Jerusalems erweckt werden. Durch der letzteren, d. i. der gläubigen Seelen Gnadenanmut soll, das wünscht sie, der Bräutigam zu noch innigerer Liebe zu ihr bewogen werden.</p><p>Daher ruft ihr der Herr Jesus, auch selbst angezogen vom Eifer so großer Liebe, von der Schönheit so holder Gnade — kein Sündenschmutz haftet ja mehr an den Getauften — entgegen: „Lege mich wie einen Siegelring in dein Herz, wie ein Siegel auf deinen Arm!“ Das heißt: Holdselig bist du, meine Schwester, ganz schön bist du, nichts mangelt dir. „Lege mich wie einen Siegelring in dein Herz!“ So soll dein Glaube in der Fülle des Sakramentes leuchten. Aber auch deine Werke sollen leuchten und das Bild Gottes widerstrahlen; denn nach seinem Bild bist du geschaffen. Keine Verfolgung darf deine Liebe verringern, die „vieles Wasser nicht fortreißen, Ströme nicht überfluten können“.</p><p>[Forts. v. ] So denk denn daran, daß du die Geistesbesieglung (signaculum spiritale) empfangen hast: „den Geist der Weisheit und des Verstandes, den Geist des Rates und der Stärke, den Geist der Erkenntnis und der Frömmigkeit, den Geist der heiligen Furcht“! Und wahre, was du empfangen hast! Gott Vater hat dich besiegelt, Christus der Herr dich gestärkt (confirmavit) und das Pfand des Geistes in dein Herz gegeben, wie du aus der apostolischen Lesung weißt.</p><p><strong>Das hl. Altarsakrament: Es ist, wie alle Mysterien der Kirche, älter und vorzüglicher als die Riten der Synagoge [43—44]. Ersteres folgt aus dem vorbildlichen Opfer Melchisedechs [45—46], letzteres beweist ein Vergleich mit dem Manna [47—49].</strong></p><p>So gereinigt eilt die Schar im reichen Schmuck ihrer Insignien zu Christi Altar und spricht: „Und ich darf hintreten zum Altare Gottes, zu Gott, der meine Jugend erfreut“. Sie hat das Kleid der alteingewurzelten Sündenschuld ausgezogen, und verjüngt zur Jugend des Adlers tritt sie eilends zu jenem himmlischen Mahle hinzu mit dem lauten Jubelruf: „Du hast einen Tisch bereitet vor meinem Angesicht“. Sie ist‘s, die David sprechen läßt: „Der Herr weidet mich, und nichts wird mir mangeln. Auf einem Weideplatz, da hat er mich gelagert, am Wasser der Erquickung mich aufgezogen“. Und im folgenden: „Denn wenn ich auch wandelte mitten im Todesschatten, brauche ich kein Unheil fürchten, weil Du mit mir bist. Deine Rute und Dein Stab sind mein Trost geworden. Du hast einen Tisch bereitet vor meinem Angesicht wider die, so mich bedrängen. Du hast in Öl gesalbt mein Haupt, und Dein Becher, wie herrlich ist er!“</p><p>Jetzt noch ein Punkt, den wir erwägen wollen, damit keiner etwa im Anblick der sichtbaren Gestalten — was unsichtbar ist, läßt sich ja nicht schauen und mit menschlichen Augen unmöglich erfassen — spreche: „Den Juden taute Gott den Mannaregen, taute er die Wachteln“, für die Kirche hingegen, die geliebte, soll er nur dies bereitet haben, wovon geschrieben steht: „Kein Auge hat es gesehen und kein Ohr gehört und in kein Menschenherz ist es gedrungen, was Gott denen bereitet hat, die ihn lieben“? Damit also niemand so spreche, wollen wir mit peinlichster Beflissenheit den Nachweis führen, daß die Sakramente der Kirche sowohl älter sind als jene der Synagoge, als auch vorzüglicher als das Manna.</p><p>[Forts. v. ] Ihr höheres Alter lehrt die Lesung der Genesis, die besprochen wurde. Denn die Synagoge nahm danach ihren Anfang mit dem mosaischen Gesetze. Abraham dagegen lebte weit früher. Als dieser die Feinde überwältigt und den eigenen Neffen zurückgewonnen hatte und den Sieg davontrug, da kam ihm Melchisedech entgegen und bot ihm (Brot und Wein) dar. Und Abraham bezeugte ihm seine Ehrfurcht und nahm die Gabe in Empfang. Nicht Abraham brachte sie, sondern Melchisedech, der ohne Vater, ohne Mutter, ohne Anfang und ohne Ende der Tage, vielmehr Christus ähnlich eingeführt wird. Von ihm schreibt Paulus an die Hebräer, „er bleibt Priester in Ewigkeit“, der Name aber, der ihm beigelegt wird, bedeutet in lateinischer Übersetzung „König der Gerechtigkeit“, „König des Friedens“.</p><p>[Forts. v. ] Merkst du nicht, wer es ist? Kann ein Mensch „der König der Gerechtigkeit“ sein, nachdem er kaum ein Gerechter ist? Kann er „der König des Friedens“ sein, nachdem er kaum ein Friedfertiger zu sein vermag? „Ohne Mutter“ — der Gottheit nach; denn er ist aus Gott Vater erzeugt, <em>einer</em> Wesenheit mit dem Vater. „Ohne Vater“ — der Menschwerdung nach, da er aus einer Jungfrau geboren wurde. „Ohne Anfang und Ende“, weil gerade er „der Anfang und das Ende“ von allem, „der Erste und Letzte“ ist. Nicht Menschen-, sondern Gottesgabe ist darum das Sakrament, das du empfangen hast, von jenem dargeboten, der den Abraham segnete, den Vater des Glaubens, jenen Mann, dessen Gnade und Taten du bewunderst.</p><p>So steht nachweislich fest, daß die Sakramente der Kirche älter sind. Jetzt erkenne ihre größere Vorzüglichkeit. Fürwahr etwas Wunderbares war der Mannaregen, den Gott den Vätern spendete, und die tägliche Himmelsspeise, mit der sie gesättigt wurden. Daher das Wort: „Das Brot der Engel aß der Mensch“. Doch gleichwohl sind alle, die jenes Brot aßen, in der Wüste gestorben. Diese Speise aber, die du empfängst, dieses „lebendige Brot, das vom Himmel gekommen“, verleiht die Substanz des ewigen Lebens, und wer immer dieses Brot ißt, wird nicht sterben in Ewigkeit. Es ist der Leib Christi.</p><p>[Forts. v. ] Erwäge jetzt, ob das Brot der Engel, oder aber das Fleisch Christi, der Leib des Lebens, vorzüglicher ist! Jenes Manna stammte vom Himmel, dieser (Leib) thront über dem Himmel; jenes war nur Himmelssubstanz, das ist der Leib des Herrn der Himmel; jenes war im Fall seiner Aufbewahrung bis zum folgenden Tage der Gefahr der Verwesung ausgesetzt, diesem ist alle Verwesung fremd: wird doch, wer immer es frommen Sinnes genießt, die Verwesung nicht kosten können; jenen strömte Wasser vom Felsen, dir aus Christus; jene tränkte das Wasser für eine Stunde, dich läutert das Blut auf ewig; der Jude trinkt und durstet, du wirst nicht dursten können, wenn du trinkst; jenes Brot endlich war nur der Schatten, dieses ist die Wahrheit.</p><p>Wenn jenes Brot, das du bewunderst, nur Schatten ist, wie erhaben muß dieses hier sein, dessen bloßen Schatten du bewunderst! Vernimm, daß es der Schatten ist, was bei den Vätern sich zugetragen hat: „Sie tranken“, heißt es, „aus dem ihnen folgenden Felsen, der Felsen aber war Christus. Aber an der Mehrzahl von ihnen hatte Gott kein Wohlgefallen; denn sie wurden niedergestreckt in der Wüste“. Das aber geschah zum Vorbild für uns. Du hast dich von der größeren Vorzüglichkeit (der Eucharistie) überzeugt; denn vorzüglicher ist das Licht als der Schatten, die Wahrheit als der Typus, der Leib des Schöpfers (des Himmels) als das Manna vom Himmel.</p><p><strong>Die Wesensverwandlung und reale Gegenwart des Fleisches und Blutes Christi in der Eucharistie kraft der Konsekrationsworte, d. i. der Einsetzungsworte Christi: erstere in ihrer Möglichkeit beleuchtet durch analoge biblische Verwandlungswunder, letztere in ihrer mystischen Erhabenheit und praktischen Bedeutung gefeiert mit der Sprache des Hohen Liedes [50—59].</strong></p><p>[Forts. v. ] Vielleicht möchtest du einwenden: Ich sehe etwas anderes, wie kannst du mir behaupten, daß ich Christi Leib empfange? Auch dies erübrigt uns noch zu beweisen. Wie triftiger Belege können wir uns bedienen! Wir wollen nachweisen, daß hier nicht etwas vorliegt, was die Natur gebildet, sondern was die Segnung konsekriert hat, und daß die Wirksamkeit der Segnung über die der Natur hinausgeht, indem sogar die Natur selbst kraft der Segnung verwandelt wird.</p><p>Moses hielt den Stab in der Hand. Da warf er ihn nieder, und er ward zur Schlange. Er faßte hinwiederum die Schlange am Schwanz, und sie wandelte sich wieder zum natürlichen Stab. Zweimal also wurde, wie du siehst, durch das prophetische Gnadenwirken die Natur verwandelt: die der Schlange und die des Stabes. — Es nahmen Ägyptens Flüsse reinen Wassers ihren Lauf. Da fing plötzlich Blut aus den Quelladern hervorzubrechen an, und es gab kein Trinkwasser mehr in den Flüssen. Wiederum schwand auf des Propheten Gebet das Blut in den Flüssen, und die natürliche Beschaffenheit der Wasser kehrte zurück. — Das Volk der Hebräer war rings eingeschlossen, auf der einen Seite von den Ägyptern wie von einem Wall umlagert, auf der anderen vom Meere abgeschnitten. Da erhob Moses den Stab, es teilte sich das Wasser und erstarrte wie zu Mauern, und ein Fußweg erschien zwischen den Wogenwällen. Der Jordan wurde wider seine Natur zurückgestaut und strömte zu seiner Ursprungsquelle hinauf. Geht daraus nicht klar hervor, daß die Natur der Meereswogen ebenso wie die des Flußlaufes gewandelt wurde? — Es durstete das Volk der Väter: Da berührte Moses den Felsen, und Wasser strömte aus dem Felsen. Wirkte da nicht die Gnade etwas Übernatürliches, daß ein Felsen Wasser spie, das er natürlicherweise nicht barg? — Mara war ein Bronnen mit starkem Bitterwasser, so daß das durstende Volk nicht daraus trinken konnte. Da warf Moses ein Holzstück ins Wasser, und die Natur des Wassers verlor unter der Wirkung der plötzlichen Gnadenströmung ihre Bitterkeit. — Unter dem Propheten Elisäus sprang einem der Prophetensöhne das Eisen von der Axt ab und sank sogleich unter. Der Verlustleidende bat den Elisäus zu sich. Da warf auch Elisäus ein Holzstück ins Wasser, „und das Eisen schwamm“. Auch das geschah sicherlich, wie begreiflich, übernatürlicherweise; denn Eisen ist schwerer als flüssiges Wasser.</p><p>So äußert denn, wie wir sehen, die Gnade eine größere Kraft als die Natur. Und wir sollten gleichwohl noch eine weitere Gnadenwirkung prophetischer Segnung aufzählen? Wenn nun schon ein menschlicher Segensspruch soviel vermochte, daß er eine Natur verwandelte: was sollen wir erst von der göttlichen Konsekration sagen, wo die Worte des Herrn und Heilandes selbst wirksam sind? Denn dieses Sakrament, das du empfängst, wird durch Christi Wort vollzogen. Wenn das Wort des Elias soviel vermochte, daß es Feuer vom Himmel herabzog: soll Christi Wort es nicht vermögen, daß die Gattung von Dingen sich verwandelt? Von den Schöpfungswerken der ganzen Welt hast du gelesen: „Er sprach und sie wurden, er befahl und sie waren geschaffen“. Das Wort Christi, welches das Nichtseiende aus dem Nichts zu schaffen vermochte, soll Seiendes nicht in etwas verwandeln können, was es vorher nicht war? Nichts Geringeres ist es, neue Dinge zu setzen, als Naturen zu verwandeln.</p><p>[Forts. v. ] Doch was bedarf es da der Beweise? Greifen wir zurück auf sein eigenes vorbildliches Leben! Am Beispiel seiner Menschwerdung laßt uns die Wahrheit des Geheimnisses begründen! Oder wiederholte sich etwa mit der Geburt des Herrn Jesus ein vorausgegangener Naturvorgang? Fragen wir nach der gewöhnlichen Ordnung, so ist der Kindersegen einer Frau regelmäßig vom Beischlaf des Mannes bedingt. Daraus erhellt nun, daß die Jungfrau außer der Ordnung der Natur geboren hat. Und eben der Leib, den wir gegenwärtig setzen, stammt aus der Jungfrau. Was willst du hier bei Christi Leib nach der Ordnung der Natur fragen, nachdem der Herr Jesus selbst übernatürlicherweise aus der Jungfrau geboren wurde? Ein wahres Fleisch war doch das Fleisch Christi, das gekreuzigt und begraben wurde: in Wahrheit ist es darum das Sakrament jenes Fleisches.</p><p>Der Herr Jesus selbst versichert mit lauter Stimme: „Das ist mein Leib“. Vor den himmlischen Segensworten heißt die Wesenheit anders, nach der Konsekration wird sie als „Leib“ bezeichnet. Er selbst spricht von seinem Blut. Vor der Konsekration heißt es anders, nach der Konsekration wird es „Blut“ genannt. Und du sprichst „Amen“, d. i. „wahr ist‘s“. Was der Mund spricht, soll der Geist innerlich bekennen; was das Wort tönt, soll das Herz fühlen.</p><p>[Forts. v. ] Mit diesen Mysterien nährt Christus seine Kirche, daraus schöpft die Seelensubstanz ihre Kraft. Und mit Recht jubelt er ihr zu, da er sie in der Fülle des Gnadenfortschrittes schaut: „Wie herrlich sind deine Brüste, meine Schwester Braut! Wie herrlich sind sie geworden vom Weine! Und der Duft deiner Kleider übertrifft alle Gewürze. Träufelnder Honigseim sind deine Lippen, o Braut, Honig und Milch unter deiner Zunge, und der Duft deiner Kleider gleich dem Dufte des Libanon. Ein verschlossener Garten bist du, meine Schwester Braut, ein verschlossener Garten, eine versiegelte Quelle“. Versiegelt, das will er damit andeuten, muß das Geheimnis in dir bleiben: nicht darf es durch einen schlechten Lebenswandel und durch Entweihung der Keuschheit verletzt, nicht Unberufenen mitgeteilt, nicht durch Altweiberklatsch in die Kreise der Ungläubigen ausgestreut werden. Treu also muß deines Glaubens Hut sein, daß die Unversehrtheit deines Lebens und deines Schweigens rein bewahrt bleibe.</p><p>Kraft der erhabenen himmlischen Geheimnisse, die sie wahrt, schlägt denn auch die Kirche die allzu heftig dräuenden Stürme ab und zieht der blühenden Gnade holden Reiz an sich. Und weil sie weiß, daß ihr Garten Christus nicht mißfallen kann, ruft sie den Bräutigam selbst herbei und spricht: „Heb dich, Nord, und komm, Süd, durchwehe meinen Garten, und träufeln mögen meine Salben! Mein Bruder soll herabkommen in meinen Garten und die Frucht seiner Obstbäume genießen!“ Denn nur edle und fruchtbare Bäume besitzt die Kirche, die ihre Wurzeln in den frischen Sprudel des heiligen Borns getaucht und in verjüngter Fruchtbarkeit schwellende Knospen getrieben, edle Früchte gezeitigt haben, so daß sie nicht von des Propheten Axt gefällt, sondern von der Fülle des Evangeliums neubefruchtet werden.</p><p>[Forts. v. ] Von deren Fruchtbarkeit auch seinerseits entzückt, erwidert darum der Herr: „Ich trat in meinen Garten, meine Schwester Braut, ich las meine Myrrhe samt meinen Salbölen, ich aß meine Speise samt meinem Honig, ich schlürfte meinen Trank samt meiner Milch“. Erkenne als Gläubiger, warum er „Speise“ und „Trank“ sagte! Das aber unterliegt keinem Zweifel, daß er in uns ißt und trinkt, wie er auch der Schriftlesung zufolge sich in uns eingekerkert nennt.</p><p>Angesichts so großer Gnade mahnt denn auch die Kirche ihre Kinder, mahnt ihre Getreuen, zum Sakramente hinzuzutreten und lädt sie ein: „Esset, meine Getreuen, und trinket und berauschet euch, meine Brüder!“ Was wir essen, was wir trinken sollen, hat dir der Heilige Geist an einer anderen Stelle ausdrücklich durch den Propheten mit den Worten angekündigt: „Kostet und sehet! Denn süß ist der Herr. Selig der Mann, der auf ihn vertraut“. In jenem Sakramente ist Christus, weil es der Leib Christi ist. Es ist darum keine physische, sondern eine geistliche Speise. Darum hebt auch der Apostel von dessen Vorbild hervor: „Unsere Väter haben eine ‚geistliche Speise genossen‘ und einen ‚geistlichen Trank getrunken‘“. Denn Gottes Leib ist ein geistlicher Leib, der Leib Christi ist der Leib des göttlichen Geistes; denn Christus ist Geist, wie wir lesen: „Ein Geist vor unserem Angesicht ist Christus der Herr“. Auch im Petrusbrief lesen wir: „Christus ist für uns gestorben“. Diese Speise endlich stärkt unser Herz, und dieser Wein erfreut das Herz des Menschen, wie der Prophet es aussprach.</p><p>[Forts. v. ] Nach dem Empfang sämtlicher Geheimnisse mögen wir uns der Tatsache unserer Wiedergeburt bewußt sein, doch nicht lange nach dem Wie unserer Wiedergeburt fragen. Sind wir etwa wiederum in unserer Mutter Schoß eingegangen und wiedergeboren worden? Ich kenne keinen solchen Vorgang in der Natur. Doch da waltet nicht die Naturordnung, wo die höhere Kraft der Gnade waltet. Nicht immer bedingt denn auch der Naturlauf die Geburt. So bekennen wir, daß Christus der Herr aus einer Jungfrau geboren wurde und lehnen hier die Naturordnung ab. Denn nicht von einem Manne empfing Maria, sondern vom Heiligen Geiste empfing sie in ihrem Schoß, wie Matthäus bezeugt: „Sie ward befunden gesegneten Leibes aus dem Heiligen Geiste“. Wenn also der Heilige Geist, der über die Jungfrau kam, die Empfängnis bewirkte und die Zeugung vollbrachte, darf doch nicht gezweifelt werden, daß er auch in Wahrheit die Wiedergeburt bewirkt, wenn er über den Taufbronnen, bezw. über die Täuflinge herabkommt.</p>
