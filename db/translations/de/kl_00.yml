    body: |-
      <p>Den Abschnitt mit den Werken des Klemens von Rom <strong>auf Griechisch</strong> finden Sie <a href="https://bibleox.com/de/grc/w/%CE%9A%CE%BB%CE%AE%CE%BC%CE%B7%CF%82_%CE%A1%CF%8E%CE%BC%CE%B7%CF%82/">hier</a>. Die übrigen Sprachen lassen sich oben über der Werkliste umschalten.</p>

      <p><strong>Gedenktag</strong>: 25. November (8. Dezember)</p>

      <h2>Leben</h2>

      <p>Klemens wurde im 1. Jahrhundert nach der Geburt Christi geboren. In der alten Kirche wurde er als einer der bedeutendsten und hervorragendsten christlichen Heiligen verehrt; er war ein Schüler der Apostel Petrus und Paulus. Möglicherweise ist er derjenige, den der Apostel Paulus im Brief an die Philipper erwähnt (<a href="https://bibleox.com/de/ge-sch/fil/4/#L3">Phil. 4,3</a>).</p>

      <p>Einige Autoren (Tertullian, der selige Hieronymus von Stridon und der heilige Epiphanius von Zypern) behaupten, Klemens sei vom Apostel Petrus zum Bischof geweiht worden. Über seinen Dienst und seinen Tod sind keine zuverlässigen Nachrichten erhalten. So erklärte der heilige Irenäus von Lyon in den 80er oder 90er Jahren des 2. Jahrhunderts, dass von den Bischöfen Roms nur der heilige Telesphorus (127/8–137/8) den Märtyrertod erlitten habe. Doch seit dem 4. Jahrhundert wurde Klemens zum Gegenstand zahlreicher Legenden. Seit dem 6. Jahrhundert sind die Erzählungen über seinen Märtyrertod in Cherson (Krim) weithin bekannt, wodurch sich die Verehrung des Heiligen später auch in Russland verbreitete.</p>

      <p>Bis heute ist eines der hellsten und unbestreitbaren Zeugnisse über seine Person und seinen Dienst der Brief an die Gemeinde von Korinth, der in Abschriften auf uns gekommen ist. Klemens schrieb ihn wegen der Unruhen, die unter den dortigen Christen ausgebrochen waren. Der Brief zeigt neben der Autorität seines Verfassers seinen Eifer, seine Liebe und seine geistliche Weisheit.</p>

      <p>Über diesen Brief schreibt der heilige Irenäus von Lyon im 2. Jahrhundert:</p>

      <blockquote><p><strong>Klemens erhielt das Bischofsamt</strong>, der die seligen Apostel gesehen und mit ihnen verkehrt hatte, dem die Predigt der Apostel noch in den Ohren klang und ihre Überlieferung vor Augen stand; und er war nicht allein, denn viele blieben damals noch übrig, die von den Aposteln unterrichtet worden waren. <strong>Unter diesem Klemens</strong>, als unter den Brüdern in Korinth eine nicht geringe Zwietracht entstanden war, <strong>schrieb die Kirche von Rom einen sehr tüchtigen Brief an die Korinther</strong>, ermahnte sie zum Frieden, erneuerte ihren Glauben und verkündete die Überlieferung, die sie soeben von den Aposteln empfangen hatte.</p></blockquote>

      <p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-3">Irenäus von Lyon, Gegen die Häresien, Buch III, Kap. 3</a>, englische Übersetzung)</p>

      <h2>Der Brief an die Korinther</h2>

      <p>Der erste Klemensbrief ist auf 96–97 datiert. Anlass war ein Aufstand in Korinth gegen die von den Aposteln eingesetzten Presbyter: Einige wenige hitzige und verwegene Männer hatten die Gemeinde gespalten. Die Kirche von Rom antwortete mit einem ausführlichen Schreiben, das zur Eintracht, zur Demut und zum Gehorsam gegenüber der von Gott gesetzten kirchlichen Ordnung aufruft. Der Brief wurde in der alten Kirche hoch geschätzt und in einigen Gemeinden sogar in der Liturgie gelesen; er ist im Codex Alexandrinus überliefert.</p>

      <p>Der Brief verbindet die Mahnung zu einem Leben in guten Werken mit dem Bekenntnis, dass der Mensch nicht durch sich selbst, sondern durch den Glauben gerechtfertigt wird:</p>

      <blockquote><p>Und auch wir, die wir durch seinen Willen in Christus Jesus berufen sind, werden nicht durch uns selbst gerechtfertigt noch durch unsere Weisheit oder Einsicht oder Frömmigkeit oder durch die Werke, die wir vollbracht haben in der Heiligkeit des Herzens, sondern <strong>durch den Glauben</strong>, durch den alle von Anbeginn an der allmächtige Gott gerechtfertigt hat. (<a href="https://bibleox.com/de/de/w/KlemRm_Kor1#HH-32">1. Klemensbrief 32</a>)</p></blockquote>

      <p>Zugleich betont er, dass der Glaube sich in der Tat bewähren muss: „Durch Werke gerechtfertigt und nicht durch Worte“ (<a href="https://bibleox.com/de/de/w/KlemRm_Kor1#HH-30">1. Klemensbrief 30</a>).</p>

      <p>Das zweite, dem Klemens zugeschriebene Schreiben ist eine anonyme Homilie aus der Mitte des 2. Jahrhunderts; die Verfasserschaft des Klemens wird in der Forschung bezweifelt. Beide Texte finden Sie in der Werkliste.</p>

