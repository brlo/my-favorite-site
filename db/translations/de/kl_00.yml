    body: |-
      <p><em>Der erste Brief des Klemens von Rom an die Gemeinde von Korinth (um 96–97).</em></p>

      <h2>0</h2><p>Die Kirche Gottes, die zu Rom in der Fremde lebt, an die Kirche Gottes, die zu Korinth in der Fremde lebt, den Berufenen, nach dem Willen Gottes durch unseren Herrn Jesus Christus Geheiligten, Gnade sei euch und Friede in reicher Fülle von dem allmächtigen Gott durch Jesus Christus.</p>
      <h2>1</h2><p>1. Wegen der plötzlichen und einander nachfolgenden Drangsale und Leiden bei uns, Brüder, glauben wir, etwas lässig sein zu dürfen, bis wir unsere Aufmerksamkeit den bei euch lebhaft verhandelten Dingen zuwendeten; wir meinen, Geliebte, den für die Auserwählten Gottes unpassenden und fremdartigen, den ruchlosen und unseligen Streit, den einige wenige hitzige und verwegene Leute, die da sind, bis zu einem solchen Grade von Unverstand angefacht haben, dass euer ehrwürdiger, hochgerühmter und bei allen Menschen beliebter Name in hohem Grade beschimpft wurde. 2. Denn wer ist bei euch eingekehrt und hätte nicht euren tüchtigen und festen Glauben gerühmt? Wer hätte nicht eure besonnene und geziemende Frömmigkeit in Christus bewundert? Wer hätte nicht die großartige Weise eurer Gastfreundschaft verkündet? Wer nicht eure vollkommene und zuverlässige Erkenntnis gerühmt? 3. Denn ohne Ansehen der Person tatet ihr alles und nach den Gesetzen des Herrn war euer Wandel, da ihr untertänig waret euren Vorgesetzten und die geziemende Ehrfurcht euren Priestern erzeigtet; die Jungen wieset ihr an, eine gemäßigte und heilige Gesinnung zu hegen, den Frauen befahlet ihr, alles in einem tadellosen, heiligen und reinen Gewissen zu tun und ihre Männer in der richtigen Weise zu lieben; auch lehrtet ihr sie, in den Schranken der Unterwürfigkeit sich zu halten und das Hauswesen würdevoll zu besorgen und sich in jeglicher Hinsicht verständig zu benehmen.</p>
      <h2>2</h2><p>1. Alle waret ihr demütiger Gesinnung, fern jeder Überhebung, lieber Untergebene als Gebieter, freudiger zum Geben als zum Nehmen; ihr waret zufrieden mit den Gütern, die Christus für den Lebensweg euch gab und auf sie bedacht; seine Worte habt ihr gar sorgfältig eingeschlossen in euer Inneres (Herz), und seine Leiden standen euch vor Augen. 2. So war allen ein tiefer und gedeihlicher Friede beschieden und ein unstillbares Verlangen, Gutes zu tun, und in vollen Strömen ergoss sich der Heilige Geist über (euch) alle. 3. Voll heiligen Eifers habt ihr in guter Absicht mit frommem Vertrauen eure Hände ausgestreckt zu dem allmächtigen Gotte und ihn angefleht, er möge euch gnädig sein, wenn ihr wider Willen einen Fehler begangen hattet. 4. Ein Wetteifer war unter euch Tag und Nacht zum Frommen der ganzen Gemeinde von Brüdern, auf dass mit Erbarmen und Gewissenhaftigkeit die Zahl seiner Auserwählten gerettet werde. 5. Ihr waret aufrichtig und arglos und truget einander Schlimmes nicht nach. 6. Jeder Streit und jede Spaltung war euch ein Gräuel. Über die Fehltritte des Nächsten empfandet ihr Schmerz; seine Sünden sahet ihr an als eure eigenen. 7. Keine gute Tat hat euch gereut, „zu jedem guten Werke waret ihr bereit". 8. Geschmückt durch einen ganz tugendhaften und ehrwürdigen Wandel, vollbrachtet ihr alles in seiner (= des Herrn) Furcht; die Gebote und Satzungen des Herrn waren eingeschrieben auf die Wände eures Herzens.</p>
      <h2>3</h2><p>1. Jeglicher Ruhm und volles Gedeihen ward euch zuteil, und es hat sich erfüllet das Wort der Schrift: „Er aß und trank, wurde dick und fett, da schlug er aus, der Geliebte“. 2. Daher kommt Eifersucht und Neid, Streit und Aufruhr, Verfolgung und Unordnung, Krieg und Gefangenschaft. 3. So erhoben sich die Unbeachteten gegen die Geachteten, die Ruhmlosen gegen die Berühmten, die Unverständigen gegen die Weisen, die Jungen gegen die Alten. 4. Deshalb ist weit weg geflohen die Gerechtigkeit und der Friede, indem jeder ablegte die Furcht Gottes und in seinem Glauben an ihn erblindete, nicht mehr wandelte auf dem gesetzlichen Pfad seiner Gebote noch ein Christus würdiges Leben führte, sondern indem jeder den Leidenschaften seines bösen Herzens nachging: so nahmen sie die ungerechte und gottlose Eifersucht in sich auf, durch welche auch „der Tod in die Welt gekommen ist”.</p>
      <h2>4</h2><p>1. So steht nämlich geschrieben: „Und es geschah nach einigen Tagen, da brachte Kain von den Früchten der Erde Gott ein Opfer dar, und Abel seinerseits brachte dar von der Erstgeburt der Schafe und von ihrem Fette. 2. Und Gott sah auf Abel und seine Gaben, Kain aber und seine Opfer beachtete er nicht. 3. Und Kain war gar sehr betrübt und sein Angesicht fiel ein. 4. Und Gott sprach zu Kain: Warum bist du gar so betrübt geworden und warum ist eingefallen dein Angesicht? Hast du nicht gesündigt, wenn du zwar richtig dargebracht, aber nicht richtig geteilt hast? 5. Beruhige dich; es kehrt zu dir zurück deine Gabe, und du sollst verfügen über sie. 6. Und Kain sprach zu seinem Bruder Abel: Wir wollen auf das Feld hinausgehen. Und es geschah, während sie auf dem Felde waren, erhob sich Kain gegen seinen Bruder Abel und schlug ihn tot“. 7. Sehet, Brüder, Eifersucht und Neid hat den Brudermord verschuldet. 8. Wegen der Eifersucht musste unser Vater Jakob fliehen vor dem Angesicht Esaus, seines Bruders. 9. Die Eifersucht war schuld, dass Joseph bis zum Tode verfolgt wurde und dass er in Knechtschaft geriet. 10. Eifersucht zwang Moses, vor dem Angesichte des ägyptischen Königs Pharao zu fliehen, da er von einem Stammesgenossen hören musste: „Wer hat dich zum Richter oder Rächer über uns gesetzt? Willst du etwa auch mich umbringen, wie du gestern den Ägypter erschlagen hast?” 11. Wegen Eifersucht mussten Aaron und Mariam außerhalb des Lagers bleiben. 12. Eifersucht führte Dathan und Abiron lebend in die Unterwelt hinab, weil sie sich widersetzten gegen Moses, den Diener Gottes. 13. Wegen Eifersucht musste David Mordanschlag erleiden nicht nur von Leuten fremder Stämme, sondern auch von Saul, dem Könige Israels, wurde er verfolgt.</p>
      <h2>5</h2><p>1. Aber, um mit den alten Beispielen aufzuhören, wollen wir nun auf die Kämpfer der neuesten Zeit kommen; wir wollen die hervorstechendsten Beispiele unseres Zeitalters herausgreifen. 2. Wegen Eifersucht und Neid haben die größten und gerechtesten Männer, Säulen waren sie, Verfolgung und Kampf bis zum Tode getragen. 3. Stellen wir uns die guten Apostel vor Augen: 4. einen Petrus, der wegen ungerechter Eifersucht nicht ein oder zwei, sondern vielerlei Mühseligkeiten erduldet hat und, nachdem er so sein Zeugnis (für Christus) abgelegt hatte, angelangt ist an dem ihn gebührenden Orte der Herrlichkeit. 5. Wegen Eifersucht und Streit hat Paulus den Beweis seiner Ausdauer erbracht. 6. Siebenmal gefesselt, vertrieben, gesteinigt, Herold (des Evangeliums) im Osten und Westen, holte er sich den herrlichen Ruhm seines Glaubens. 7. Er hatte Gerechtigkeit der ganzen Welt gelehrt, war bis in den äußersten Westen vorgedrungen und hatte vor den Machthabern sein Zeugnis abgelegt, so wurde er weggenommen von dieser Welt und ging ein in den heiligen Ort, das größte Beispiel der Geduld.</p>
      <h2>6</h2><p>1. Diesen Männern, die einen heiligen Wandel geführt haben, ward zugesellt eine große Zahl Auserwählter, die wegen der Eifersucht durch viele Misshandlungen und Prüfungen gelitten haben und so unter uns zum herrlichsten Vorbild geworden sind. 2. Frauen wurden wegen der Eifersucht verfolgt, wie Danaiden und Dirken, ertrugen fürchterliche und grauenhafte Peinen, wandelten so auf dem sicheren Pfade des Glaubens und holten sich den herrlichen Preis, obwohl sie schwach am Leibe waren. 3. Eifersucht hat schon Frauen ihren Männern entfremdet und hat das Wort unseres Vaters Adam geändert: „Das nun ist Bein von meinem Beine und Fleisch von meinem Fleische". 4. Eifersucht und Streit hat große Städte zerstört und große Völker mit der Wurzel ausgerottet.</p>
      <h2>7</h2><p>1. Dies, meine Geliebten, schreiben wir nicht nur zu eurer Ermahnung, sondern auch zu unserer eigenen Beherzigung; wir befinden uns ja auf demselben Kampfplatz, und der gleiche Kampf ist uns auferlegt. 2. Deshalb wollen wir die leeren und eitlen Sorgen aufgeben und wollen uns zuwenden der ruhmvollen und heiligen Regel der uns übergebenen Lehre, 3. und wollen sehen, was schön, erfreulich und angenehm ist in den Augen unseres Schöpfers. 4. Wir wollen hinblicken auf das Blut Christi und erkennen, wie kostbar es auch Gott seinem Vater ist, weil es, wegen unseres Heiles vergossen, der ganzen Welt die Gnade der Reue gebracht hat. 5. Lasset uns alle Geschlechter durchwandeln und erkennen, dass der Herr einem jeden Geschlechte Gelegenheit zur Buße gab, allen, die sich zu ihm bekehren wollten. 6. Noe predigte Buße, und die auf ihn hörten, wurden gerettet. 7. Jona kündigte den Niniviten ihren Untergang an; sie taten Buße für ihre Sünden, versöhnten durch Gebet ihren Gott und erlangten Rettung, obwohl sie nicht zum Volke Gottes gehörten.</p>
      <h2>8</h2><p>1. Die Diener der Gnade Gottes haben durch den Heiligen Geist über die Buße geredet, 2. ja auch er selbst, der Gebieter über alle, hat über die Buße gesprochen unter einem Eidschwur: „So wahr ich lebe, spricht der Herr, ich will nicht den Tod des Sünders, sondern dass er Buße tue“; und er fügt den guten Rat hinzu: 3. „Haus Israel, bekehre dich von deiner Gottlosigkeit“. Sprich zu den Kindern meines Volkes: Wenn eure Sünden reichen von der Erde bis zum Himmel und wenn sie rot sind wie Scharlach und schwarz wie ein Bußsack und ihr euch aus ganzem Herzen zu mir bekehret und sprechet: „Vater“, dann werde ich euch erhören wie ein heiliges Volk. 4. Und an einer anderen Stelle spricht er also: „Waschet und reiniget euch, entfernet eure Schlechtigkeit von euren Seelen vor meinen Augen. Lasset ab von eurer Bosheit, lernet Gutes tun, suchet gerecht zu sein, helfet den Unrecht Leidenden, seid ein Anwalt dem Waisenkind, und der Witwe verschaffet Recht! Dann kommt hierher, und wir wollen rechten miteinander, spricht der Herr. Und wenn eure Sünden sind wie Purpur, werde ich sie weiß machen wie Schnee, und wenn sie sind wie Scharlach, will ich sie weiß machen wie Wolle. Und wenn ihr guten Willen habt und auf mich höret, sollt ihr die Güter der Erde genießen; wenn ihr aber keinen guten Willen habt und nicht auf mich höret, wird das Schwert euch fressen. Der Mund des Herrn hat dies gesprochen”. 5. Da er also wollte, dass alle seine Lieblinge teilhaben an der Buße so bestärkte er sie mit seinem allmächtigen Willen.</p>
      <h2>9</h2><p>1. Deshalb wollen wir hören auf seinen heiligen, ruhmvollen Willen, sein Erbarmen und seine Güte erflehend, niederfallen und uns zuwenden seinen Erbarmungen, nachdem wir aufgegeben haben die nutzlose Mühe, den Streit und die Eifersucht, die zum Tode führt. 2. Hinschauen wollen wir auf die, die in Vollkommenheit seiner erhabenen Herrlichkeit gedient haben. 3. Nehmen wir Enoch, der in Gehorsam gerecht befunden und entrückt wurde, ohne dass von seinem Tod eine Spur entdeckt wurde. 4. Noe wurde als gläubig befunden und verkündete durch seinen (Gottes-) Dienst der Welt ihre Wiedergeburt, und durch ihn hat der Herr die Tiere gerettet, die in Eintracht in die Arche gegangen waren.</p>
      <h2>10</h2><p>1. Abraham, der Freund genannt, wurde als gläubig befunden, weil er den Worten Gottes gehorsam war. 2. Dieser ging in Gehorsam weg aus seinem Lande, aus seiner Verwandtschaft und aus seinem Vaterhause, um ein kleines Land, eine schwache Verwandtschaft und ein kleines Haus zu verlassen und dafür die Verheißungen Gottes zu erben. Denn er sagt ihm: 3. „Gehe hinweg aus deinem Lande und aus deiner Verwandtschaft und aus dem Hause deines Vaters in das Land, das ich dir zeigen werde; und ich werde dich zu einem großen Volke machen und ich werde dich segnen und werde deinen Namen groß machen, und du wirst gesegnet sein; und ich werde segnen, die dich segnen, und verfluchen, die dich verfluchen, und in dir werden gesegnet werden alle Geschlechter der Erde“. 4. Und wiederum bei seinem Abschied von Lot sagte ihm Gott: „Erhebe deine Augen und schaue von dem Orte, wo du jetzt bist, nach Norden und Süden, nach Osten und Westen; denn alles Land, das du siehst, ich werde es dir und deinem Samen geben auf ewig. 5. Und ich werde deine Nachkommen machen wie den Staub der Erde; wenn einer den Staub der Erde zählen kann, wird man auch deinen Samen zählen können“. 6. Und wiederum sagt er: „Gott führte den Abraham heraus und sagte zu ihm: Schaue auf zum Himmel und zähle die Sterne, wenn du sie zählen kannst; so wird dein Same sein. Abraham glaubte aber seinem Gott, und es wurde ihm angerechnet zur Gerechtigkeit”. 7. Wegen seines Glaubens und seiner Gastfreundschaft wurde ihm im Alter ein Sohn geschenkt, und im Gehorsam brachte er ihn Gott als Opfer hin auf einen der Berge, die er ihm gezeigt hatte.</p>
      <h2>11</h2><p>1. Wegen Gastfreundschaft und Frömmigkeit wurde Lot aus Sodoma gerettet, während die ganze Umgebung durch Feuer und Schwefel gerichtet wurde; der Herr hatte es ja vorher verkündet, dass er die nicht verlässt, die auf ihn hoffen, dass er aber den Abtrünnigen Strafe und Qual auferlegt. 2. Denn sein Weib, das mit ihm herausgezogen, aber anderer Meinung und nicht eines Sinnes mit ihm war, wurde zu dem Zweck als Wahrzeichen hingestellt - sie wurde nämlich zu einer Salzsäule bis auf den heutigen Tag -, damit allen es ersichtlich sei, dass die mit geteiltem Herzen und die, welche an der Macht Gottes zweifeln, zum Gericht und zum Warnungszeichen für alle Geschlechter werden.</p>
      <h2>12</h2><p>1. Wegen ihres Glaubens und ihrer Gastfreundschaft wurde Raab, die Dirne, gerettet. 2. Als nämlich Jesus, der Sohn Naves, Späher nach Jericho geschickt hatte, erfuhr der König des Landes, dass sie gekommen waren, um ihr Land auszukundschaften, und er sandte Männer aus, sie zu ergreifen, um sie dann zu töten. 3. Die gastliche Raab nahm sie nun auf und verbarg sie im Obergemach unter dem Flachse. 4. Als aber die Leute des Königs vor ihr standen und sagten: „Bei dir sind die eingekehrt, die unser Land auskundschaften, führe sie heraus, denn der König gebietet es so“, erwiderte sie: „Die Leute, die ihr suchet, sind zwar zu mir gekommen, aber sogleich sind sie wieder weggegangen und sie ziehen ihres Weges weiter”, dabei zeigte sie ihnen eine andere Richtung. 5. Und sie sprach zu den Männern: „Ich sehe es klar ein, dass Gott der Herr euch dieses Land gibt; denn Angst und Furcht vor euch hat die Bewohner desselben ergriffen. Wenn es nun geschieht, dass ihr das Land in Besitz nehmet, rettet mich und das Haus meines Vaters“. 6. Und sie sagten zu ihr: „So soll es sein, wie du uns gesagt hast. Wenn du uns also heranrücken siehst, dann versammle alle deine Angehörigen unter deinem Dache, und sie werden gerettet werden; denn alle, die man außerhalb des Hauses antrifft, werden verloren sein”. 7. Und sie rieten ihr, ein Zeichen zu geben, dass sie zu ihrem Hause ein rotes (Seil) heraushängen solle; damit offenbarten sie, dass durch das Blut des Herrn Erlösung zuteil werden soll allen, die an Gott glauben und auf ihn hoffen. 8. Sehet, Geliebte, nicht nur Glaube, sondern sogar die Prophetengabe hat in dem Weibe gewohnt.</p>
      <h2>13</h2><p>1. Daher wollen wir, Brüder, demütigen Sinnes sein, ablegen jede Prahlerei, Hochmut, Unbesonnenheit, Zorn und erfüllen, was geschrieben steht [es sagt nämlich der Heilige Geist: „Nicht rühme sich der Weise in seiner Weisheit noch der Starke in seiner Stärke noch der Reiche in seinem Reichtum, sondern wer sich rühmt, rühme sich im Herrn, damit er ihn suche und Recht und Gerechtigkeit übe"]. Dabei wollen wir vor allem eingedenk sein der Worte des Herrn Jesus, die er sprach, da er uns Geduld und Langmut lehrte. 2. Denn so hat er gesprochen: „Seid barmherzig, damit ihr Barmherzigkeit erlanget; verzeihet, damit ihr Verzeihung findet; wie ihr tuet, so wird man euch tun; wie ihr gebet, so wird euch gegeben werden; wie ihr richtet, so werdet ihr gerichtet werden; wie ihr Milde übet, so werdet ihr Milde erfahren; mit welchem Maße ihr messet, mit dem wird euch gemessen werden“. 3. Mit diesem Gebote und diesen Vorschriften wollen wir uns stärken, damit wir wandeln im Gehorsam gegen seine heiligen Worte, demütigen Sinnes; denn also spricht das heilige Wort: 4. „Wen werde ich ansehen, außer den Sanftmütigen und den Ruhigen und den, der meine Worte fürchtet?”.</p>
      <h2>14</h2><p>1. Es ist daher recht und heilig, Männer, Brüder, mehr Gott Untertan zu sein, als denen zu folgen, die in Prahlerei und Abfall Führer zu verruchter Eifersucht sind. 2. Denn wir werden nicht in den nächsten besten (= geringen) Schaden, vielmehr in große Gefahr uns stürzen, wenn wir uns verwegen dem Willen von Leuten ausliefern, die es auf Streit und Zwist abgesehen haben, um uns von dem, was gut ist, abzubringen. 3. Lasst uns freundlich sein gegen uns selbst, gemäß der Freundlichkeit und Liebe unseres Schöpfers. 4. Denn es steht geschrieben; „Mildherzige werden wohnen im Lande, und Unschuldige werden in demselben bleiben, die Gottlosen aber werden daraus vertilgt werden“. 5. Und wiederum sagt er: „Ich sah den Gottlosen hochragend und erhaben wie die Zedern Libanons; und ich ging vorüber und siehe, er war nicht mehr, und ich suchte seinen Ort, aber ich fand ihn nicht. Bewahre die Unschuld und schaue auf Rechtlichkeit, weil ein Erbe beschieden ist dem friedfertigen Menschen”.</p>
      <h2>15</h2><p>1. Deshalb wollen wir uns denen anschließen, die in Frömmigkeit den Frieden lieben, aber nicht denen, die in Verstellung den Frieden wollen. 2. Er sagt nämlich an einer Stelle: „Dieses Volk ehrt mich mit den Lippen, aber ihr Herz ist ferne von mir“. 3. Und wiederum: „Mit ihrem Munde sprachen sie Lob, mit ihrem Herzen aber Fluch”. 4. Und wieder sagt er: „Sie liebten ihn mit dem Munde, und mit ihrer Zunge täuschten sie ihn, ihr Herz aber meint es nicht aufrichtig mit ihm, und sie wurden nicht für treu erachtet in seinem Testamente“. 5. „Deshalb sollen stumm werden die trügerischen Lippen, da sie Schlimmes reden wider den Gerechten”. Und wiederum; „Verderben wird der Herr alle die trügerischen Lippen, eine prahlerische Zunge, Leute, die sprechen: Unsere Zunge wollen wir berühmt machen, unsere Lippen stehen uns bei; wer ist unser Herr? 6. Wegen des Elends der Darbenden und wegen des Seufzens der Armen will ich jetzt mich erheben, spricht der Herr; ich will Rettung bringen; 7. offen werde ich dabei zu Werke gehen".</p>
      <h2>16</h2><p>1. Den Demütigen gehört nämlich Christus, nicht denen, die sich erheben über seine Herde. 2. Das Szepter der Majestät Gottes, der Herr Jesus Christus, ist nicht erschienen in prahlerischem und auffallendem Prunke, obwohl er es gekonnt hätte, sondern in Demut, wie der Heilige Geist von ihm verkündet hatte; er sagt nämlich: „Herr, wer hat unserer Predigt geglaubt? wem ist der Arm des Herrn offenbar geworden? Wir redeten angesichts seiner: er ist wie ein Kindlein, wie ein Schössling in dürstendem Erdreich; er hat nicht Gestalt noch Würde; und wir haben ihn gesehen, und er hatte weder Gestalt noch Schönheit,, vielmehr ist seine Gestalt unscheinbar, zurückbleibend hinter der Gestalt der Menschen; er ist ein Mann in Wunden und Weh und versteht Krankheit zu tragen; weil sich abgewendet hat sein Antlitz, deshalb wurde er zurückgesetzt und nicht beachtet. 4. Er trägt unsere Sünden und leidet für uns, und wir glaubten, er selbst sei in Weh und Schmerz und Elend. 5. Aber er ist verwundet unserer Sünden wegen und gezüchtigt ob unserer Missetaten. Zu unserem Frieden liegt auf ihm die Züchtigung, durch seine Striemen sind wir geheilt. 6. Alle gingen wir irre wie Schafe, der Mensch verirrte sich auf seinem Wege. 7. Und der Herr gab ihn dahin für unsere Sünden, und er selbst öffnete den Mund nicht wegen seiner Misshandlung. Wie ein Lamm wurde er zur Schlachtbank geführt, und wie ein Schaf stumm bleibt vor dem Scherer, so tat er seinen Mund nicht auf. In seiner Erniedrigung wurde seine Verurteilung aufgehoben. 8. Wer wird sein Geschlecht aufzählen? da von der Erde sein Leben weggenommen wird. 9. Wegen der Missetaten meines Volkes wird er zum Tod geführt. 10. Und ich will hingeben die Bösen für sein Grab und die Reichen für seinen Tod; denn er hat nichts Böses getan, und in seinem Mund ward kein Trug gefunden. Und der Herr will ihn befreien von seiner Qual. 11. Wenn ihr Opfer bringt für eure Sünden, wird eure Seele lang lebende Nachkommen sehen. 12. Und der Herr will mindern die Mühsal seiner Seele, will Licht ihm zeigen und durch Einsicht bilden, rechtfertigen den Gerechten, der vielen gut dient; und ihre Sünden will er selbst hin wegnehmen. 13. Deshalb wird er viele beerben und die Beute der Starken teilen dafür, dass seine Seele hingegeben wurde in den Tod und er gezählt wurde unter die Bösen. 14. Und er selbst hat die Sünden vieler getragen, und wegen ihrer Sünden wurde er dahingegeben“. 15. Und wiederum sagt er selbst: „Ich aber bin ein Wurm und kein Mensch, der Spott der Menschen und die Verachtung des Volkes. 16. Alle, die mich sahen, verlachten mich, schwatzten mit den Lippen und schüttelten das Haupt: Er hat auf Gott gehofft, er erlöse ihn, rette ihn, da er ihm geneigt ist”. 17. Ihr sehet, Geliebte, wer das Vorbild ist, das uns gegeben ist; wenn nämlich der Herr sich so erniedrigt hat, was sollen dann wir tun, die wir unter das Joch seiner Gnade durch ihn selbst gekommen sind?</p>
      <h2>17</h2><p>1. Wir wollen Nachahmer sein auch derjenigen, die in Ziegen- und Schaffellen einherzogen und die Ankunft Christi verkündeten; wir meinen die Propheten Elias, Elisäus und dazu noch Ezechiel, ferner die ein gutes Zeugnis erhalten haben (von Gott). 2. Ein herrliches Zeugnis wurde dem Abraham gegeben, Freund Gottes wurde er zubenannt, und er sprach die Herrlichkeit Gottes betrachtend in Demut: „Ich aber bin Erde und Asche“. 3. Ferner steht auch über Job also geschrieben: „Job aber war gerecht und untadelig, wahrheitsliebend, gottesfürchtig, von allem Bösen ferne”. 4. Aber er selbst klagt sich an mit den Worten: „Keiner ist rein von Schmutz, auch wenn sein Leben nur einen Tag dauert“. 5. Moses wurde treu in seinem (Gottes) ganzen Hause genannt, und durch seinen Dienst strafte Gott Ägypten durch die Geißeln und Plagen, (die er) gegen sie (sandte); aber auch er führte, obwohl hochgeehrt, keine hochfahrenden Reden, sondern sprach, als ihm die Offenbarung im Dombusch gegeben wurde: „Wer bin ich, dass Du mich sendest? Ich habe eine schwache Stimme und eine schwere Zunge”. 6. Und wieder sagt er: „Ich aber bin Dunst, (der) von einem Kochtopfe (aufsteigt)".</p>
      <h2>18</h2><p>1. Was aber sollen wir sagen von David, der ein so gutes Zeugnis erhielt? Zu ihm sprach Gott: „Ich habe gefunden einen Mann nach meinem Herzen, David, Jesses Sohn, in ewigem Erbarmen habe ich ihn gesalbt“. 2. Aber auch er sprach zu Gott: „Erbarme Dich meiner, Gott, nach Deiner großen Barmherzigkeit, und nach der Menge Deiner Erbarmung lösche aus meine Missetat, 3. Mehr und mehr wasche mich von meiner Ungerechtigkeit, und von meiner Sünde reinige mich; denn mein Unrecht sehe ich ein, und meine Sünde steht vor meinem Auge immerdar. 4. Dir allein habe ich gesündigt und das Böse habe ich vor Dir getan, damit Du für gerecht befunden werdest in Deinen Worten und den Sieg erhaltest, wenn man Dich richtet. 5. Denn siehe, in Ungerechtigkeit bin ich empfangen, und in Sünden hat meine Mutter mich empfangen. 6. Denn siehe, die Wahrheit hast Du geliebt; das Verborgene und Geheime Deiner Weisheit hast Du mir geoffenbart. 7. Du wirst mich mit Hyssop besprengen und ich werde rein sein; Du wirst mich waschen, und ich werde weißer sein als Schnee. 8. Du wirst mich Freude und Wonne hören lassen, dann werden frohlocken die zerschlagenen Gebeine. 9. Wende weg Dein Angesicht von meinen Sünden und lösche aus alle meine Missetaten. 10. Ein reines Herz erschaff in mir, mein Gott, und einen geraden Geist mache neu in meinem Innern. 11. Verstoße mich nicht von Deinem Angesicht, und Deinen Heiligen Geist nimm nicht von mir. 12. Gib mir zurück die Freude Deines Heiles, und mit fürstlichem Geiste stärke mich. 13. Lehren werde ich Ungerechte Deine Wege, und Gottlose werden sich zu Dir bekehren. 14. Errette mich von Blutschuld, mein Gott, Du Gott meines Heiles. 15. Preisen wird meine Zunge Deine Gerechtigkeit; Herr, Du wirst öffnen meinen Mund, und meine Lippen werden verkünden Dein Lob. 16. Denn wenn Du ein Opfer gewollt hattest, hätte ich es gegeben; an Brandopfern wirst Du kein Gefallen haben. 17. Ein Opfer für Gott ist ein zerknirschter Geist; ein zerknirschtes und gedemütigtes Herz wirst Du, o Gott, nicht verschmähen”.</p>
      <h2>19</h2><p>1. Die Demut also und Bescheidenheit so großer und solcher mit herrlichem Zeugnis ausgezeichneter Männer hat durch den Gehorsam nicht nur uns, sondern auch die Geschlechter vor uns besser gemacht, und zwar diejenigen, welche die Worte in Furcht und Wahrheit aufgenommen haben. 2. Da wir nun an vielen großen und herrlichen Taten Anteil bekommen haben, wollen wir dem von Anfang an uns gesteckten Friedensziele von neuem zueilen, den Blick richten auf den Vater und Schöpfer der ganzen Welt und uns eng verbinden mit seinen großartigen und überschwenglichen Segnungen des Friedens und seinen Wohltaten. 3. Betrachten wir ihn im Geiste und schauen wir mit den Augen der Seele auf die Langmut seines Willens; betrachten wir, wie gütig er sich gegen seine ganze Schöpfung erzeigt.</p>
      <h2>20</h2><p>1. Die Himmel, die nach seiner Anordnung sich bewegen, gehorchen ihm in Frieden. 2. Tag und Nacht vollenden sie den von ihm bestimmten Lauf, ohne einander im geringsten zu hindern. 3. Sonne und Mond und der Sterne Reigen durchkreisen nach seinem Gesetze einträchtig ohne jede Abschweifung die ihnen vorgeschriebenen Bezirke. 4. Die Erde bringt Frucht nach seinem Willen zur rechten Zeit und erzeugt für Menschen und Tiere und jegliches Wesen, das auf ihr lebt, reichliche Nahrung; dabei zögert sie nicht noch ändert sie etwas an seinen Befehlen. 5. Der Abgründe unzugängliche und der Unterwelt unerforschliche Gerichte bestehen durch die gleichen Gesetze. 6. Das Becken des unendlichen Meeres - nach seiner Schöpfung zur Sammlung (der Wasser) festgebaut - überschreitet nicht die ihm rings gesetzten Schranken, sondern wie er ihm befohlen, so tut es. 7. Er sagte nämlich: „Bis hierher sollst du kommen, und deine Wogen sollen in dir selbst zerfallen“. 8. Der Ozean, den Menschen nicht durchfahren können, und die Welten hinter ihm, werden durch die nämlichen Gesetze des Herrn regiert. 9. Des Frühlings, Sommers, Herbstes und Winters Zeiten lösen einander in friedlichem Wechsel ab. 10. Der Winde Posten tun zur bestimmten Zeit ohne Anstoß ihren Dienst. Nichtversiegende Quellen, zum Gebrauch, für die Gesundheit geschaffen, reichen unaufhörlich ihre den Menschen Leben spendenden Brüste; auch die kleinsten Tiere halten ihre Versammlungen in Eintracht und Friede. 11. Dies alles besteht nach des großen Schöpfers und Herrn der Welt Befehl in Friede und Eintracht, da er allen Wohltaten spendet, in reichstem Übermaße aber uns, die wir unsere Zuflucht genommen zu Seinen Erbarmungen durch unseren Herrn Jesus Christus. 12. Ihm sei Ruhm und Herrlichkeit von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>21</h2><p>1. Sehet zu, Geliebte, dass nicht seine vielen Wohltaten uns allen zum Gerichte werden, wenn wir nicht seiner würdig wandeln und das Gute und Wohlgefällige vor ihm tun in Eintracht. 2. Er sagt nämlich irgendwo: „Der Geist des Herrn ist eine Leuchte, die das Innere des Leibes durchforscht". 3. Betrachten wir, wie nahe er ist, und dass ihm nichts verborgen ist von unseren Gedanken oder von den Plänen, die wir schmieden. 4. Es ist also recht, dass wir uns seinem Willen nicht entziehen. 5. Lieber wollen wir bei Menschen, bei törichten, unverständigen, stolzen, die eingebildet sind auf ihre prahlerischen Reden, Anstoß erregen als bei Gott. 6. Unseren Herrn Jesus Christus, dessen Blut für uns hingegeben wurde, wollen wir verehren, unsere Vorgesetzten wollen wir achten, die Älteren ehren, die Jugend wollen wir erziehen in der Zucht der Gottesfurcht, unsere Frauen wollen wir zum Guten anleiten: 7. Sie sollen der Keuschheit liebenswürdige Sitte zeigen, sollen ihrer Sanftmut unversehrte Gesinnung an den Tag legen, die Mäßigung ihrer Zunge durch ihr Schweigen kund tun; ihre Liebeswerke sollen sie nicht tun nach Neigung, sondern sie in heiliger Gesinnung gleichermaßen allen zuwenden, die Gott fürchten. 8. Unsere Kinder sollen der Erziehung in Christus teilhaftig werden; sie sollen lernen, was demütiger Sinn bei Gott vermag, wie mächtig reine Liebe bei Gott ist, wie Gottesfurcht gut und groß ist und wie sie alle rettet, die in ihr ein heiliges Leben führen in reiner Gesinnung. 9. Er erforscht nämlich die Gedanken und Gesinnungen; sein Odem wohnt in uns, und wenn er will, nimmt er ihn weg.</p>
      <h2>22</h2><p>1. All dies befestigt der Glaube an Christus. Denn auch er selbst redet durch den Heiligen Geist uns also an: „Kommet her, Kinder, höret mich, Gottesfurcht will ich euch lehren. 2. Wer ist der Mensch, der das Leben liebt, gerne gute Tage sieht? 3. Halte ab deine Zunge vom Bösen, und deine Lippen, dass sie keine Lüge reden! 4. Wende dich weg vom Bösen und tue Gutes! 5. Suche den Frieden und jage ihm nach! 6. Die Augen des Herrn (sind gerichtet) auf die Gerechten und seine Ohren auf ihre Bitten. Das Antlitz des Herrn kehrt sich gegen die, die Böses tun, damit er ihr Andenken vertilge von der Erde. 7. Es rief der Gerechte, und der Herr erhörte ihn und befreite ihn aus all seiner Trübsal. 8. Zahlreich sind die Kümmernisse des Gerechten, aber aus allen wird ihn erretten der Herr“. 9. Sodann: „Zahlreich sind die Geißeln des Sünders, aber die auf den Herrn vertrauen, wird Erbarmen umgeben”.</p>
      <h2>23</h2><p>1. Der in allem barmherzige und gütige Vater hat ein Herz für die, die ihn fürchten, gerne und freudig gibt er seine Gnadenerweisungen denen, die einfältigen Herzens zu ihm kommen. 2. Deshalb sollen wir nicht zweifeln, und unsere Seele soll sich nicht aufblähen ob seiner überreichen und herrlichen Gnadengaben. 3. Nimmer passe auf uns dieser Schrifttext, wo es heißt: „Unglücklich sind die Zweifler, die geteilten Herzens sind und sagen: Dies haben wir gehört auch schon zur Zeit unserer Väter, und siehe, wir sind alt geworden, und nichts davon ist uns zugekommen. 4. O ihr Toren, vergleichet euch mit einem Baum; nehmet einen Weinstock: zuerst verliert er die (alten) Blätter, dann wächst eine Knospe, dann ein Blatt, dann eine Blüte, hernach eine saure Traube, und dann erst ist die reife Traube da“. Ihr sehet, dass in kurzer Zeit die Frucht des Baumes zur Reife gelangt. 5. Wahrhaftig, schnell und plötzlich wird sein Wille Vollendung finden, da ja auch die Schrift selbst hierfür Zeugnis gibt: „Schnell wird er kommen und nicht zögern, und plötzlich wird einziehen der Herr in seinen Tempel und der Heilige, den ihr erwartet”.</p>
      <h2>24</h2><p>1. Erwägen wir, Geliebte, wie der Herr fortwährend uns zeigt, dass es eine künftige Auferstehung geben werde, zu deren Anfang er den Herrn Jesus Christus selbst machte, da er ihn von den Toten erweckte. 2. Lasst uns, Geliebte, die Auferstehung betrachten, die zu seiner Zeit sich vollzieht. 3. Tag und Nacht zeigen uns die Auferstehung; die Nacht legt sich zur Ruhe, der Tag steht auf; der Tag zieht ab, die Nacht kommt heran. 4. Nehmen wir die Früchte! Wie und auf welche Weise wächst der Same? 5. „Es ging aus der Säemann" und warf auf die Erde jegliches Saatkorn; alle fallen trocken und nackt zur Erde und gehen in Verwesung über; hernach erweckt sie aus der Verwesung die fürsorgliche Macht des Herrn, und aus einem wachsen viele und tragen Frucht.</p>
      <h2>25</h2><p>1. Betrachten wir auch das auffallende Zeichen, das im Morgenlande geschieht, das heißt in den Gegenden bei Arabien. 2. Es ist nämlich ein Vogel, der Phönix genannt wird. Dieser ist der einzige seiner Art und lebt fünfhundert Jahre; wenn er bereits der Auflösung im Tode nahe ist, baut er sich ein Nest aus Weihrauch, Myrrhe und sonstigen wohlriechenden Gewächsen; ist seine Zeit erfüllt, so geht er in dies Nest und stirbt. 3. Wenn dann das Fleisch verfault, entsteht ein Wurm, welcher sich von dem verfaulenden Leichnam des Tieres nährt und Flügel bekommt; wenn er dann kräftig geworden ist, hebt er jenes Nest, in dem die Knochen des früheren sind, und fliegt mit ihnen von Arabien bis nach Ägypten in die Stadt Heliopolis 4. Und bei Tag, wenn alle es sehen, fliegt er auf den Altar des Helios, legt sie dort nieder und kehrt wieder zurück. 5. Die Priester sehen dann genau die Aufzeichnungen der Zeiten nach und finden, dass er nach Verfluss von fünfhundert Jahren gekommen ist.</p>
      <h2>26</h2><p>1. Halten wir es nun für etwas Großes und Wunderbares, wenn der Schöpfer des Weltalls die auferwecken wird, die ihm heilig gedient haben in der Zuversicht eines guten Glaubens, wo er uns sogar durch einen Vogel die Größe seiner Verheißung kund tut? 2. Er sagt nämlich einmal: „Und Du wirst mich auferwecken, und ich werde Dich preisen“, und: „Ich legte mich nieder und schlummerte ein, ich erwachte, weil Du mit mir bist”. Und wieder sagt Job: „Und Du wirst auferwecken dieses mein Fleisch, das all dies erduldet hat".</p>
      <h2>27</h2><p>1. Durch diese Hoffnungen also sollen unsere Seelen fest gekettet sein an den, der treu ist in seinen Verheißungen und gerecht in seinen Gerichten. 2. Der verboten hat zu lügen, wird viel weniger selber lügen; denn bei Gott ist nichts unmöglich außer die Lüge. 3. Entzünden soll sich daher in uns der Glaube an ihn, und wir wollen beherzigen, dass ihm alles nahe ist. 4. In seinem mächtigen Worte hat er das All aufgebaut, und in seinem Worte kann er es niederreißen. 5. „Wer wird ihm sagen: Was hast Du gemacht? oder wer wird entgegentreten seiner gewaltigen Stärke?“ Wann er will und wie er will, wird er alles machen, und nichts darf vergehen von dem, was er bestimmt hat. 6. Alles liegt da vor seinem Auge, und nichts ist seinem Rate verborgen. 7. „Wenn die Himmel den Ruhm Gottes verkünden, so erzählt das Firmament seiner Hände Werk. Ein Tag ruft es dem anderen zu, und eine Nacht gibt es der anderen kund; und es sind nicht Reden noch Worte, deren Stimme man nicht hört“.</p>
      <h2>28</h2><p>1. Da er also alles sieht und hört, wollen wir ihn fürchten und die schmutzigen Begierden nach schlechten Werken aufgeben, damit wir durch sein Erbarmen Schutz finden vor den kommenden Gerichten. 2. Denn wohin kann einer aus uns fliehen vor seiner starken Hand? und welche Welt wird aufnehmen einen Überläufer, der ihm entronnen? Es sagt nämlich einmal die Schrift: 3. „Wohin werde ich entkommen und wo mich verbergen vor seinem Angesicht? Wenn ich hinaufsteige in den Himmel, bist Du dort; wenn ich wegziehe an die Grenzen der Erde, ist Deine Rechte dort, und wenn ich mein Lager bereite in der Unterwelt, so ist Dein Geist dort“. 4. Wohin also soll man fliehen, und wo soll man entrinnen dem, der das All umspannt?</p>
      <h2>29</h2><p>1. Wir wollen also zu ihm hinzutreten in Heiligkeit des Herzens, rein und unbefleckt die Hände zu ihm erhebend, voll Liebe zu unserem milden und gütigen Vater, der sich uns gemacht hat zu seinem auserwählten Teil. 2. So steht nämlich geschrieben: „Als der Höchste die Völker teilte, da er zerstreute die Kinder Adams, setzte er die Grenzen für die Volker fest nach der Zahl der Engel Gottes. Und es ward der Teil des Herrn sein Volk Jakob, sein zugemessenes Erbe Israel“. 3. Und an einer anderen Stelle sagt er: „Siehe, der Herr nimmt sich ein Volk mitten aus den Völkern, so wie ein Mann das Erstlingsopfer nimmt von seiner Tenne; und aus jenem Volke wird hervorgehen das Allerheiligste“.</p>
      <h2>30</h2><p>1. Da wir nun ein heiliger Teil sind, wollen wir alle Werke der Heiligung tun, fliehen die üblen Nachreden, Befleckungen und sündhafte Umarmungen, Trunkenheit, Neuerungssucht, verwerfliche Begierden, abscheuungswürdigen Ehebruch, verwerflichen Stolz. 2. „Denn Gott", sagt er, „widersteht den Hoffärtigen, den Demütigen gibt er seine Gnade“ 3. Wir wollen es also mit denen halten, welchen von Gott die Gnade verliehen ist. Lasset uns anziehen die Eintracht, voll Demut und Enthaltsamkeit, von jeder Ohrenbläserei und Verleumdung uns ferne haltend, durch Werke gerechtfertigt und nicht durch Worte. 4. Er sagt nämlich: „Wer viel redet, muss auch wieder viel hören; oder glaubt der Geschwätzige, er sei gerecht? 5. Glücklich der vom Weibe Geborene, der kurze Zeit lebt. Verlege dich nicht aufs viele Reden. 6. Unser Lob komme von Gott, nicht von uns selbst; denn die sich selbst loben, hasst Gott. 7. Das Zeugnis, dass wir recht handeln, soll von anderen gegeben werden, so wie es unseren gerechten Voreltern gegeben wurde. 8. Kühnheit, Keckheit, Vermessenheit ist bei denen, die Gott verflucht hat. Einfalt, Demut, Milde ist bei denen, die Gott gesegnet hat.</p>
      <h2>31</h2><p>1. Suchen wir uns also seinen Segen und schauen wir, welches die Wege seines Segens sind! Lasset uns die Geschichte von Anfang an betrachten! 2. Weswegen wurde unser Vater Abraham gesegnet? Nicht deshalb, weil er Gerechtigkeit und Wahrheit übte durch Glauben? 3. Isaak ließ sich voll Vertrauen, da er die Zukunft kannte, freudig zum Opfer bringen. 4. Jakob verließ demütigen Sinnes seine Heimat wegen des Bruders, ging zu Laban und diente ihm, und ihm wurden verliehen die zwölf Stämme Israels.</p>
      <h2>32</h2><p>1. Wenn dies jemand im einzelnen genau überdenkt, wird er die Größe der von ihm verliehenen Gaben erkennen. 2. Von ihm nämlich stammen alle Priester und Leviten ab, die am Altare Gottes dienen; von ihm stammt der Herr Jesus ab, dem Fleische nach; von ihm die Könige, Herrscher und Führer durch Juda; auch die übrigen Stämme stehen in nicht geringem Ansehen, wie Gott es verheißen hatte, dass „deine Nachkommenschaft sein werde wie die Sterne des Himmels“. 3. Alle haben demnach Ehre und Herrlichkeit erlangt nicht durch sich selbst oder durch ihre Werke oder wegen ihrer Gerechtigkeit, die sie übten, sondern durch seinen Willen. 4. Und auch wir, die wir durch seinen Willen in Christus Jesus berufen sind, werden nicht durch uns selbst gerechtfertigt noch durch unsere Weisheit oder Einsicht oder Frömmigkeit oder durch die Werke, die wir vollbracht haben in der Heiligkeit des Herzens, sondern durch den Glauben, durch den alle von Anbeginn an der allmächtige Gott gerechtfertigt hat. Ihm sei Ehre von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>33</h2><p>1. Was sollen wir demnach tun, Brüder? Sollen wir ablassen von guten Werken und die Liebe aufgeben? Möge es der Herr niemals zugeben, dass dies bei uns geschehe, sondern beeilen wir uns, mit Beharrlichkeit und Bereitwilligkeit jedes gute Werk zu vollbringen. 2. Denn der Schöpfer und Herr des Weltalls frohlockt über seine Werke. 3. Denn mit seiner unendlich großen Macht hat er die Himmel gegründet, und mit seiner unerschöpflichen Weisheit hat er sie geordnet; die Erde hat er von dem es umgebenden Wasser geschieden und hat sie festgestellt auf das unerschütterliche Fundament seines Willens; den Tieren, die auf ihr leben, befahl er, nach seiner Anordnung sich zu bewegen; das Meer und seine Tiere, die in ihm sind, hat er geschaffen und hat sie eingeschlossen mit seiner Macht. 4. Zu allem hin schuf er das Herrlichste und Großartigste wegen seiner Vernunft, den Menschen; mit seinen heiligen und untadeligen Händen schuf er seines Bildes Abbild. 5. So nämlich spricht der Herr: „Lasset uns den Menschen machen nach unserem Bild und Gleichnis, und Gott schuf den Menschen, als Mann und Weib schuf er sie“. 6. Nachdem er nun all dieses vollendet hatte, lobte er es und pries es und sprach: „Wachset und mehret euch“. 7. Beachten wir, dass alle Gerechte mit guten Werken verherrlicht waren und dass der Herr selbst, nachdem er sich selbst durch gute Werke verherrlicht hatte, darüber erfreut war. 8. Da wir nun ein solches Vorbild haben, wollen wir unverzüglich seinem Willen nachkommen; mit all unserer Kraft wollen wir Werke der Gerechtigkeit tun.</p>
      <h2>34</h2><p>1. Der gute Arbeiter nimmt freimütig das Brot für seine Arbeit, der faule und untätige aber wagt nicht, dem Blicke seines Arbeitgebers zu begegnen. 2. Daher ist es nötig, dass wir bereit sind zu guten Werken; von ihm kommt ja alles. 3. Er sagt nämlich zu uns: „Siehe, hier ist der Herr und sein Lohn ist vor ihm, damit er jedem gebe nach seinem Werke“. 4. Deshalb ermahnt er uns, die wir aus ganzem Herzen ihm vertrauen, weder träge noch nachlässig zu sein „in jeglichem guten Werke“. 5. Unser Ruhm und unsere Zuversicht sei in ihm; seinem Willen wollen wir uns fügen; denken wir an die ganze Schar seiner Engel, wie sie bereit stehen, seinen Willen zu erfüllen. 6. Denn die Schrift sagt: „Zehntausendmal zehntausend standen vor ihm, und tausendmal tausend dienten ihm und riefen: Heilig, heilig, heilig ist der Herr Sabaoth, die ganze Schöpfung ist voll seiner Herrlichkeit“. 7. Auch wir, in Eintracht versammelt, einmütigen Sinnes, wollen wie aus einem Munde anhaltend zu ihm rufen, damit wir teilhaftig werden seiner großen und herrlichen Verheißungen. 8. Er sagt ja: „Kein Auge hat es gesehen, kein Ohr hat es gehört, und in keines Menschen Herz ist es gedrungen, was Gott denen bereitet hat, die auf ihn harren“.</p>
      <h2>35</h2><p>1. Wie selig und wunderbar sind die Geschenke Gottes, Geliebte! 2. Leben in Unsterblichkeit, Glanz in Gerechtigkeit, Wahrheit in Freimut, Glaube in Vertrauen, Enthaltsamkeit in Heiligung; und dies alles ist schon in unser Verständnis gedrungen. 3. Was nun fürwahr ist denen bereitet, die ausharren? Der Schöpfer und Vater der Ewigkeit, der Allheilige selbst kennt die Größe und Schönheit dieser Güter. 4. Wir nun wollen kämpfen, damit wir erfunden werden in der Zahl derer, die ausharren, auf dass wir teilhaben an den versprochenen Gütern. 5. Wie aber wird das geschehen, Geliebte? Wenn unsere Gesinnung in Treue gefestigt ist gegen Gott, wenn wir nachstreben dem, was ihm angenehm und wohlgefällig ist, wenn wir tun, was seinem heiligen Willen entspricht, wenn wir gehen auf dem Wege der Wahrheit, wenn wir wegwerfen von uns alles Unrecht und alle Schlechtigkeit, Habsucht, Streit, Bosheit und Hinterlist, Verleumdung und üble Nachrede, Hass gegen Gott, Aufgeblasenheit und Prahlerei, Eitelkeit und ungastliches Wesen. 6. Denn wer solches tut, ist bei Gott verhasst; aber nicht allein die solches tun, sondern auch die, welche ihnen zustimmen. 7. Es sagt nämlich die Schrift: „Zu dem Sünder aber sprach Gott: Warum zählst du meine Satzungen auf und warum nimmst du meinen Bund in deinen Mund? 8. Du hast die Zucht gehasst und hast meine Worte verworfen. Wenn du einen Dieb sähest, gingst du mit ihm, bei den Ehebrechern hattest du Anteil. Dein Mund ging über von Schlechtigkeit, und deine Zunge spann trügerische Tücke. Du setztest dich hin und sprachest gegen deinen Bruder, und dem Sohn deiner Mutter stelltest du eine Falle. 9. Das tatest du, und ich habe geschwiegen. Du nahmst an, Gottloser, dass ich dir gleich sei. 10. Ich werde dich überführen und dein Antlitz gegen dich kehren. 11. Beherziget dies, ihr Gottvergessenen, damit er euch nicht wegschleppe wie ein Löwe und niemand da sei, der rettet; ein Lobopfer wird mich ehren, und dort ist der Weg, den ich ihm zeigen will, das Heil Gottes“.</p>
      <h2>36</h2><p>1. Das ist der Weg, Geliebte, auf dem wir unser Heil finden, Jesus Christus, den Hohenpriester unserer Opfergaben, den Anwalt und Helfer in unserer Schwäche. 2. Durch ihn streben wir standhaft nach den Höhen des Himmels, durch ihn schauen wir sein heiliges und erhabenes Antlitz, durch ihn wurden die Augen unseres Herzens geöffnet, durch ihn ringt sich unser unweiser und dunkler Verstand durch zum Licht, durch ihn wollte der Herr uns kosten lassen von dem unsterblichen Wissen, der, „da er der Abglanz ist seiner Majestät, um soviel größer ist als die Engel, um wieviel sein Name sich unterscheidet, den er erhalten hat“. Es steht nämlich also geschrieben: „Der Geister zu seinen Boten macht und Feuerflammen zu seinen Dienern“. 4. Zu seinem Sohne aber sprach der Herr also: „Mein Sohn bist du, heute habe ich dich gezeugt; verlange von mir, und ich will dir Völker geben zum Erbe und zu deinem Besitze die Enden der Erde“. 5. Und wiederum sagt er zu ihm: „Setze dich zu meiner Rechten, bis ich deine Feinde zum Schemel deiner Füße lege“. 6. Welches sind aber die Feinde? Die Schlechten, die Gottes Willen sich widersetzen.</p>
      <h2>37</h2><p>1. Lasset uns also kämpfen, Männer, Brüder, mit aller Ausdauer unter seinen untadeligen Gesetzen. 2. Schauen wollen wir auf die, die unter unseren Führern kämpfen, wie sie wohlgeordnet, geziemend und gehorsam die Befehle vollziehen. 3. Nicht alle sind Tribunen, oder Oberste, oder Hauptleute, oder Führer von Abteilungen usw., sondern jeder erfüllt auf seinem richtigen Posten die Anordnungen des Königs und der Führer. 4. Die Großen können nicht sein ohne die Kleinen und die Kleinen nicht ohne die Großen; überall gibt es eine Art Mischung, und darin liegt der Vorteil, 5. Nehmen wir unseren Körper; der Kopf ist nichts ohne die Füße, ebenso die Füße nichts ohne den Kopf; und die kleinsten Glieder unseres Leibes sind notwendig und nützlich für den ganzen Körper; aber alle halten zusammen, und es bedarf eines einmütigen Gehorsams zum Wohle des ganzen Körpers.</p>
      <h2>38</h2><p>1. So soll denn unser ganzer Körper gerettet werden in Christus Jesus, und jeder soll seinem Nächsten sich fügen, wie es in seiner Gnadengabe begründet ist. 2. Der Starke sorge für den Schwachen, und der Schwache kümmere sich um den Starken; der Reiche unterstütze den Armen, der Arme aber danke Gott dafür, dass er jenem gegeben, wodurch seinem Mangel abgeholfen werde; der Weise zeige seine Weisheit nicht in Worten, sondern in guten Werken; der Demütige stelle sich selbst kein Zeugnis aus, sondern lasse einen anderen über sich Zeugnis geben; wer keusch ist im Fleische, rühme sich nicht in der Erkenntnis, dass ein anderer es ist, der ihm die (Gnade der) Enthaltsamkeit verleiht. 3. Betrachten wir nun, Brüder, aus welchem Stoff wir geschaffen wurden, welcher Art und was wir waren beim Eintritt in diese Welt, aus welch dunkler Gruft unser Bildner und Schöpfer uns in seine Welt geführt, da er seine Wohltaten bereit hielt, schon bevor wir geboren waren. 4. Da wir nun dies alles von ihm bekommen haben, schulden wir ihm in allem Dank. Ihm sei die Ehre von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>39</h2><p>1. Unverständige, törichte, dumme und ungebildete Leute sind es, die uns verhöhnen und verspotten, da sie sich selbst überheben wollen in ihren Gedanken. 2. Was vermag denn ein sterblicher Mensch? oder was ist es mit der Kraft des Erdgeborenen? 3. Es steht ja geschrieben: „Es war keine Gestalt vor meinen Augen, sondern ich hörte Odem und eine Stimme. 4. Wie denn? Soll denn ein Sterblicher rein sein vor Gott? Oder ist ein Mann von seinen Werken her ohne Fehl, wenn er seinen Knechten misstraut und bei seinen Boten Unrechtes wahrnimmt? 5. Der Himmel ist nicht rein vor ihm, wieviel weniger Menschen, die wohnen in Häusern aus Lehm, zu denen auch wir gehören, die wir aus demselben Lehm gebildet sind. Er schlug sie wie eine Motte, und vom Morgen bis zum Abend sind sie nicht mehr; weil sie sich selbst nicht helfen konnten, gingen sie zugrunde. 6. Er hauchte sie an, und sie starben, weil sie keine Weisheit hatten. 7. Rufe, ob einer auf dich hören wird, oder ob du einen der heiligen Engel sehen wirst; denn den Törichten reibt der Zorn auf, und den Irrsinnigen tötet Eifersucht 8. Ich aber habe gesehen, dass Toren Wurzel schlugen, aber sogleich ward ihr Lebensgut aufgezehrt. 9. Ferne bleiben mögen, ihre Söhne vom Heile; sie mögen zertreten werden vor den Türen der Schwachen, und es wird niemand sein, der sie aufhebt. Denn, was für jene bereitet war, essen Gerechte; sie selbst aber werden aus den Übeln nicht erlöst werden“.</p>
      <h2>40</h2><p>1. Da uns also dieses ganz klar ist, und wir weit hinabgedrungen sind in die Tiefen der göttlichen Erkenntnis, müssen wir alles ordnungsgemäß tun, was der Herr an bestimmten Zeiten zu erfüllen angeordnet hat. 2. Er wollte, dass Opfer und Gottesdienst gehalten werde, aber nicht aufs Geratewohl und ohne Ordnung solle es geschehen, sondern zu festgesetzten Zeiten und Stunden. 3. Wo und durch wen er es verrichtet wissen will, hat er nach seinem allerhöchsten Willen selbst bestimmt, damit alles heiligmäßig geschehe und so in Wohlgefallen aufgenommen werde von seinem Willen. 4. Die nun ihre Opfer darbringen zur vorgeschriebenen Zeit, sind wohlgefällig und selig; denn wenn sie den Gesetzen des Herrn nachkommen, sündigen sie nicht. 5. Dem obersten Priester sind nämlich eigene Verrichtungen zugeteilt, auch den Priestern ist ihr eigener Platz angewiesen, und den Leviten obliegen eigene Dienstleistungen; der Laie ist an die Laienvorschriften gebunden.</p>
      <h2>41</h2><p>1. Jeder von uns, Brüder, soll in seinem Stande Gott danken, indem er sich ein gutes Gewissen bewahrt und die für seine Verrichtung festgesetzte Regel nicht übertritt, in würdigem Wandel. 2. Nicht an allen Orten, Brüder, werden Gott immerwährende Opfer oder Gelübdeopfer oder Sühnopfer oder Schuldopfer dargebracht, sondern nur in Jerusalem; aber auch dort wird nicht überall geopfert, sondern vor dem Heiligen am Altare, wobei die Opfergabe genau untersucht wird durch den Oberpriester und die vorerwähnten Diener des Heiligtums. 3. Wer nun nicht seinem Willen entsprechend etwas tut, erleidet den Tod als gebührende Strafe. 4. Ihr sehet, Brüder, je größer die Erkenntnis ist, deren wir gewürdigt worden sind, um so größer ist auch die Gefahr, der wir ausgesetzt sind.</p>
      <h2>42</h2><p>1. Die Apostel haben uns das Evangelium verkündet, (das sie) vom Herrn Jesus Christus (bekommen haben), Jesus Christus aber ist gesandt von Gott. 2. Christus ist also von Gott und die Apostel von Christus (gesandt); beides ist demnach geschehen in aller Ordnung nach dem Willen Gottes. 3. Sie empfingen also ihre Aufträge, wurden durch die Auferstehung unseres Herrn Jesus Christus mit Gewissheit erfüllt, wurden im Glauben an das Wort Gottes gefestigt, und dann zogen sie voll des Heiligen Geistes hinaus zur Predigt, dass das Reich Gottes nahe sei. 4. Indem sie nun in Ländern und Städten predigten, setzten sie die Erstlingsfrüchte ihrer (Predigt), nach vorhergegangener Prüfung im Geiste, zu Bischöfen und Diakonen der zukünftigen Gläubigen ein. 5. Und dies war nichts Neues; denn schon seit langer Zeit war geschrieben über Bischöfe und Diakone. So nämlich sagt einmal die Schrift: „Ich will einsetzen ihre Bischöfe in Gerechtigkeit und ihre Diakone in Treue“.</p>
      <h2>43</h2><p>1. Und ist es zu verwundern, wenn die von Christus mit einem solchen Werke Betrauten die oben Genannten eingesetzt haben? Da ja auch der selige Moses, „der getreue Diener im ganzen Hause“, die an ihn ergangenen Befehle sämtlich in den heiligen Büchern verzeichnet hat, dem auch die übrigen Propheten gefolgt sind, indem auch sie Zeugnis geben für das, was von ihm gesetzlich angeordnet wurde. 2. Als nämlich Eifersucht entstand wegen der Priesterwürde und die Stämme darüber stritten, welcher von ihnen mit dem rühmlichen Namen geschmückt werden sollte, befahl jener den zwölf Stammeshäuptern, sie sollten Stäbe mit dem Namen jedes einzelnen Stammes bezeichnen und diese ihm bringen. Und er nahm sie, band sie zusammen, versiegelte sie mit den Ringen der zwölf Vorsteher, hinterlegte sie in dem Zelte des Zeugnisses auf dem Tische Gottes. 3. Und nachdem er das Zelt abgeschlossen hatte, versiegelte er den Verschluss ebenso wie die Stäbe 4. und sprach zu ihnen; Männer, Brüder! Der Stamm, dessen Stab ausschlägt, den hat Gott auserwählt, auf dass er ihm opfere und diene. 5. Am anderen Morgen nun versammelte er ganz Israel, die sechshunderttausend Männer, zeigte den Stammeshäuptern die Siegel, öffnete das Zelt des Zeugnisses und nahm die Stäbe heraus; und es fand sich, dass der Stab Aarons nicht nur Knospen, sondern sogar Früchte hatte. 6. Was meint ihr, Geliebte:? Wusste Moses nicht zum voraus, dass es so kommen werde? Ganz gewiss. Aber damit in Israel kein Aufruhr entstände, handelte er so, damit verherrlicht werde der Name des wahrhaftigen und einen Gottes; ihm sei die Ehre von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>44</h2><p>1. Auch unsere Apostel wussten durch unseren Herrn Jesus Christus, dass Streit entstehen werde um die Bischofswürde. 2. Aus diesem Grunde setzten sie auch, da sie eine genaue Kenntnis hiervon zum voraus erhalten hatten, die oben Genannten ein und gaben ihnen dazu Auftrag, dass, wenn sie entschlafen wären, andere erprobte Männer ihren Dienst übernähmen. 3. Die also von jenen oder hernach von anderen ausgezeichneten Männern unter Zustimmung der ganzen Gemeinde eingesetzten (Bischöfe), die das Hirtenamt Christi in Demut untadelig, ruhig, uneigennützig verwaltet haben, die lange Zeit hindurch von allen ein gutes Zeugnis erhalten haben, diese von ihrem heiligen Amte abzusetzen, ist nach unserer Ansicht ein Unrecht. 4. Denn es wird für uns keine kleine Sünde sein, wenn wir Männer, die tadellos und heiligmäßig ihre Opfer dargebracht haben, aus ihrem Bischofsamte vertreiben. 5. Selig sind die Presbyter, die ihren Lebensweg bereits durchlaufen und eine vollkommene, an Früchten reiche Auflösung erreicht haben; denn sie müssen nicht fürchten, dass man sie verdrängt von dem für sie festbestimmten Platze. 6. Wir müssen es nämlich erleben, dass ihr einige, die einen guten Wandel führten, vertrieben habt aus dem heiligen Dienste, dem sie durch tadellose Verwaltung alle Ehre gemacht hatten.</p>
      <h2>45</h2><p>1. Streitsüchtig seid ihr, Brüder, und eifersüchtig in den Dingen, die zum Heile nötig sind. 2. Die heiligen Schriften, die wahren, die vom Heiligen Geist eingegebenen, habt ihr genau durchforscht. 3. Ihr wisst, dass nichts Unrechtes und nichts Verkehrtes in denselben geschrieben steht. (Da) werdet ihr nicht finden, dass Gerechte abgesetzt worden sind von heiligen Männern. 4. Es wurden zwar Gerechte verfolgt, aber von Bösen; sie wurden eingekerkert, aber von Gottlosen, sie wurden gesteinigt von Missetätern, sie wurden getötet von solchen, die mit verruchter und sündhafter Eifersucht erfüllt waren. 5. Solches haben sie in rühmlicher Geduld ertragen. 6. Was sollen wir denn sagen, Brüder? Wurde Daniel von Gottesfürchtigen in die Löwengrube geworfen? 7. Oder Ananias, Azarias und Misael, wurden die von Leuten, die sich dem erhabenen und herrlichen Dienste des Allerhöchsten widmeten, in den Feuerofen gesperrt? Das sei ferne! Was für Leute sind es nun, die solches verübten? Die Verhassten, die von jeglicher Schlechtigkeit erfüllt sind, haben ihren Zorn bis zu dem Grade entflammt, dass sie Männer, die in heiliger und untadeliger Absicht Gott dienten, schmählich behandelten, ohne zu wissen, dass der Höchste ein starker Verteidiger und Beschützer derer ist, die in reinem Gewissen seinem hochgelobten Namen dienen; ihm sei die Ehre von Ewigkeit zu Ewigkeit. Amen. 8. Die aber in Zuversicht duldeten, haben Ruhm und Ehre erlangt, sie sind erhöht und ihre Namen von Gott eingeschrieben worden auf ihr Denkmal für alle Ewigkeit. Amen.</p>
      <h2>46</h2><p>1. An solche Vorbilder müssen auch wir uns halten, Brüder. 2. Es steht nämlich geschrieben: „Gehet mit den Heiligen, denn die mit ihnen gehen, werden geheiligt werden“. 3. Und wieder an einer anderen Stelle heißt es: „Mit einem unschuldigen Manne wirst du unschuldig sein, und mit einem auserwählten wirst du auserwählt sein, und mit einem verkehrten wirst du verkehrt sein“. 4. Wir wollen deshalb mit den Unschuldigen und Gerechten verkehren; denn diese sind die Auserwählten Gottes. 5. Warum herrschen Streit, Zorn, Gegensätze, Zwiespalt und Krieg unter euch? 6. Etwa deshalb, weil wir <strong>einen</strong> Gott haben, <strong>einen</strong> Christus, <strong>einen</strong> Geist der Gnade, der über uns ausgegossen ist, und weil <strong>eine</strong> Berufung ist in Christus? 7. Weshalb reißen und zerren wir die Glieder Christi auseinander und weshalb sind wir uneins gegen den eigenen Leib, und weshalb gehen wir soweit in der Torheit, dass wir vergessen, dass wir untereinander Glieder sind? Denket an die Worte unseres Herrn Jesus! 8. Er sprach nämlich: „Wehe jenem Menschen, besser wäre es für ihn gewesen, wenn er nicht geboren worden wäre, als dass er einem meiner Auserwählten Ärgernis gibt; nützlicher wäre es für ihn, wenn ihm ein Mühlstein umgehängt und er in die Tiefe des Meeres versenkt würde, als dass er einen meiner Auserwählten verführt“. 9. Eure Spaltung hat viele verführt, viele in Mutlosigkeit versetzt, viele in Wankelmut, euch, alle in Trauer; und euer Zwist dauert noch immer fort.</p>
      <h2>47</h2><p>1. Nehmet den Brief des seligen Paulus, des Apostels. 2. Was hat er euch im Anfang seiner Predigt geschrieben? 3. Wahrhaft vom Geiste angeregt, hat er euch belehrt über sich selbst und über Kephas und über Apollo, weil ihr auch damals Parteien gebildet hattet 4. Aber jene Parteiung hat euch geringere Schuld eingetragen; denn ihr habt damals Partei ergriffen für Apostel, denen ein gutes Zeugnis gegeben war, und für einen Mann, der erprobt war von ihnen. 5. Jetzt aber beherziget, was für Leute euch verführt und die Erhabenheit eurer weitgerühmten Bruderliebe geschmälert haben. 6. Eine Schande, Geliebte, eine große Schande und eine Schmach für den Wandel in Christo, wenn man hören muss, wie die festgegründete und uralte Kirche von Korinth wegen einer oder zweier Personen sich empört gegen ihre Presbyter. 7. Und diese Kunde ist nicht nur zu uns gedrungen, sondern auch zu den Andersgesinnten, so dass dem Namen des Herrn Schmach angetan wird wegen eures Unverstandes, für euch selbst aber Gefahr entsteht.</p>
      <h2>48</h2><p>1. Schleunig wollen wir daher diesen Missstand beseitigen und niederfallen vor dem Herrn und unter Tränen ihn anflehen, dass er in Gnaden sieh versöhne mit uns und uns zurückbringe zu dem erhabenen heiligen Wandel gegenseitiger Bruderliebe. 2. Denn das ist eine Pforte der Gerechtigkeit, die geöffnet ist zum Leben, gemäß dem Schriftwort: „öffnet mir Tore der Gerechtigkeit; ich will eintreten durch sie und lobsingen dem Herrn. 3. Das ist das Tor des Herrn: Gerechte sollen durch dasselbe einziehen“. 4. Obgleich Tore offen stehen, so ist das Tor der Gerechtigkeit das Tor Christi; selig sind alle, die durch dieses eingehen und die geraden Weges wandeln „in Heiligkeit und Gerechtigkeit“, indem sie unbeirrt alles vollbringen. 5. Mag einer gläubig sein, mag einer tüchtig sein, Weisheit zu reden, mag einer verstehen die Reden zu unterscheiden, mag einer heilig sein in (seinen) Werken, 6. er muss eben um so demütiger sein, je mehr er sich erhaben dünkt, und er muss das suchen, was allen gemeinsam, nicht ihm allein nützlich ist.</p>
      <h2>49</h2><p>1. Wer Liebe in Christus hat, der halte die Gebote Christi. 2. Wer kann das Band der Liebe Gottes beschreiben? 3. Wer ist imstande, seine erhabene Schönheit zu schildern? 4. Die Höhe, zu der die Liebe emporführt, ist unbeschreiblich. 5. Liebe verbindet uns mit Gott, „Liebe deckt eine Menge Sünden zu“, Liebe erträgt alles, Liebe ist in allem langmütig; nichts Gemeines gibt es in der Liebe, nichts Hoffärtiges; Liebe kennt keine Spaltung, Liebe lehnt sich nicht auf, Liebe tut alles in Eintracht; in der Liebe haben alle Auserwählten Gottes ihre Vollkommenheit erlangt, ohne Liebe ist Gott nichts wohlgefällig. 6. In Liebe hat der Herr uns angenommen; wegen der Liebe, die er zu uns trug, hat unser Herr Jesus Christus sein Blut hingegeben für uns nach Gottes Willen, sein Fleisch für unser Fleisch, seine Seele für unsere Seelen.</p>
      <h2>50</h2><p>1. Geliebte, ihr sehet, wie groß und wunderbar die Liebe ist, und ihre Vollkommenheit lässt sich nicht darlegen. 2. Wer ist fähig, in der Liebe erfunden zu werden, außer wen Gott derselben für würdig erachtet? Flehen und beten wir daher zu seiner Erbarmung, dass wir erfunden werden in Liebe ohne menschliche Parteiung, frei von Tadel. 3. Alle Geschlechter sind dahingegangen von Adam bis auf den heutigen Tag; aber die in Liebe vollkommen waren, besitzen nach der Gnade Gottes den Platz der Frommen, sie werden offenbar werden bei der Besichtigung des Reiches Christi. 4. Es steht nämlich geschrieben: „Tretet ein in die Kammern auf einen ganz kurzen Augenblick, bis mein Zorn und meine Erregung vorbei ist, und ich will eines guten Tages gedenken und euch auferwecken aus euren Gräbern“. 5. Selig sind wir, Geliebte, wenn wir die Gebote Gottes halten in einträchtiger Liebe, auf dass uns durch die Liebe die Sünden nachgelassen werden. 6. Es sieht nämlich geschrieben: „Selig (sind die), deren Vergehen nachgelassen und deren Sünden zugedeckt sind; glückselig der Mann, dem der Herr die Sünde nicht zurechnet und in dessen Mund kein Trug ist“. 7. Diese Seligpreisung ist erfolgt auf die von Gott Auserwählten durch unseren Herrn Jesus Christus, dem die Ehre sei von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>51</h2><p>1. Was wir nun gefehlt haben und was wir durch einen aus der Schar des Widersachers (verführt) getan haben, dafür wollen wir uns Verzeihung erflehen; aber auch diejenigen, die Führer der Empörung und Entzweiung gewesen sind, müssen die gemeinsame Hoffnung ins Auge fassen. 2. Denn die in Furcht und Liebe wandeln, wollen lieber, dass sie selbst der Züchtigung verfallen als der Nächste; sie wollen lieber selbst Verachtung tragen, als die (Verachtung) der uns gut und gerecht überlieferten Einheit (mit ansehen). 3. Denn es ist besser für den Menschen, sich über seine Verfehlungen anzuklagen, als sein Herz zu verhärten, wie das Herz derer verhärtet worden ist, die sich erhoben wider Moses, den Diener Gottes, deren Verdammung offenkundig geworden ist: 4. „Sie stiegen ja lebend hinab in die Unterwelt“ und der Tod weidet sie. 5. Pharao und sein Heer, alle Fürsten Ägyptens, die Wagen und deren Führer wurden nur deswegen in das Rote Meer versenkt und kamen nur deshalb um, weil ihre törichten Herzen sich verhärtet hatten, (und zwar) nachdem Zeichen und Wunder in Ägypten geschehen waren durch Moses, den Diener Gottes.</p>
      <h2>52</h2><p>1. Brüder, der Herr bedarf gar nichts, er braucht von niemand etwas, nur dass man ihm ein Bekenntnis ablege. 2. Denn so sagt David, der Auserwählte: „Bekennen will ich dem Herrn, und das wird ihm besser gefallen als ein junges Rind, das Hörner und Klauen ansetzt; sehen sollen es Arme und sich freuen“. 3. Und wiederum heißt es: „Opfere Gott ein Opfer des Lobes und weihe dem Höchsten deine Gebete. Und rufe mich an am Tage deiner Trübsal, und ich will dich erlösen, und du sollst mich verherrlichen“. 4. „Denn ein Opfer vor Gott ist ein zerknirschter Geist“.</p>
      <h2>53</h2><p>1. Die heiligen Schriften kennet ihr, Geliebte, und zwar gut, und ihr habt euch vertieft in die Worte Gottes; deshalb schreiben wir euch dies als Erinnerung. 2. Als Moses auf den Berg gestiegen war und vierzig Tage und vierzig Nächte in Entbehrung und Fasten zugebracht hatte, da sprach Gott zu ihm: „Moses, Moses, steige eilends hinab von hier, denn dein Volk, das du aus Ägypten geführt, hat gesündigt; gar schnell hat es den Weg verlassen, den du ihnen vorgeschrieben hattest; sie haben sich Bilder gegossen“. 3. Und der Herr sprach zu ihm: „Einmal und zweimal habe ich zu dir also geredet: Ich habe dieses Volk mir angeschaut, und siehe, es ist halsstarrig; lass mich sie ausrotten, und ich will ihren Namen auslöschen unter dem Himmel, und ich will dich zu einem großen, wunderbaren Volke machen, viel größer als dieses“. 4. Und Moses erwiderte: „Niemals, Herr! Verzeihe diesem Volk seine Sünde oder tilge auch mich aus dem Buche der Lebenden“. 5. O große Liebe, o unübertreffliche Vollkommenheit! Voll Freimut redet der Diener zum Herrn, er bittet um Verzeihung für das Volk, oder er verlangt, dass er selbst mit ihnen ausgetilgt werde.</p>
      <h2>54</h2><p>1. Wer ist nun unter euch edelmütig, wer barmherzig, wer voll Liebe? 2. Der soll sprechen: Wenn ich schuld bin an Aufruhr, Streit und Zwietracht, so wandere ich aus, ziehe fort, wohin ihr wollt, und tue, was die Mehrheit vorschreibt; nur soll die Herde Christi in Frieden leben mit ihren bestellten Presbytern. 3. Wer so handelt, wird sich großen Ruhm in Christus erwerben, und jeglicher Ort wird ihn aufnehmen. „Denn dem Herrn gehört die Erde und was in ihr ist“. 4. So haben gehandelt und so werden handeln, die ohne Vorwurf den Weg Gottes gehen.</p>
      <h2>55</h2><p>1. Um auch Beispiele (aus der Geschichte) der Heiden anzuführen: Viele Könige und Fürsten haben, wenn eine Pest herrschte, auf den Rat des Orakels hin sich selbst dem Tode preisgegeben, um durch ihr eigenes Blut die Mitbürger zu retten. Viele haben ihre Stadt verlassen, um die Fortdauer des Zwistes zu verhüten. 2. Wir kennen unter uns viele, die sich selbst den Ketten überliefert haben, um andere zu befreien; viele haben sich in Knechtschaft begeben, und mit ihrem Verdienste (Lohne) haben sie andere gespeist. 3. Viele Frauen haben, gestärkt durch die Gnade Gottes, manch männliche Tat vollbracht. 4. Judith, die selige, bat bei der Belagerung ihrer Vaterstadt die Ältesten, man möge sie hinausgehen lassen in das Lager der Feinde. 5. Und aus Liebe zum Vaterlande und zu ihrem eingeschlossenen Volke ging sie hinaus, sich selbst in Gefahr stürzend, und der Herr übergab den Holophernes in die Hand eines Weibes. 6. Auch die glaubensstarke Esther setzte sich keiner geringeren Gefahr aus, um die zwölf Stämme Israels zu retten, als ihnen der Untergang drohte; denn durch ihr Fasten und ihre Demut bestürmte sie den allsehenden Herrn, den Gott der Ewigkeiten; er sah an die Verdemütigung ihrer Seele und errettete das Volk, um dessetwillen sie die Gefahr auf sich genommen hatte.</p>
      <h2>56</h2><p>1. Deshalb wollen auch wir beten für die, die in einer Sünde leben, auf dass ihnen Nachgiebigkeit und Demut verliehen werde, damit sie nicht uns, sondern dem Willen Gottes gehorchen; so wird ihnen nämlich zum Nutzen und zur Vollkommenheit gereichen, dass wir ihrer bei Gott und den Heiligen mit Seufzern gedenken. 2. Wir wollen, Geliebte, die Zurechtweisung annehmen, über die sich niemand ärgern darf. Die Ermahnungen, die wir einander gegenseitig geben, sind gut und überaus nützlich; denn sie verbinden uns mit dem Willen Gottes. 3. Denn also sagt das heilige Wort: “Gar sehr hat mich der Herr in Zucht genommen, aber dem Tode hat er mich nicht preisgegeben”. 4. “Wen nämlich der Herr lieb hat, den züchtigt er; jedem Kind, das er annimmt, gibt er die Rute zu fühlen”. 5. “Ja er wird als Gerechter”, so heißt es, “mich züchtigen mit Erbarmen und mich zurechtweisen, aber Öl von Sündern soll mein Haupt nicht salben”. 6. Und wiederum sagt er: “Glückselig der Mann, den der Herr zurechtgewiesen hat; denn einen Tadel des Allmächtigen weise nicht zurück; er verursacht nämlich Schmerz, aber er macht wieder gut. 7. Er hat geschlagen, aber seine Hände haben wieder geheilt. 8. Sechsmal wird er aus der Not dich herausreißen, und das siebente Mal wird dich Unglück nicht erfassen. 9. Zur Zeit der Hungersnot wird er dich vor dem Tode retten, und im Kriege dich bewahren vor der Gewalt des Schwertes. 10. Vor der Zunge Geißel wird er dich verbergen, und du brauchst dich nicht zu fürchten vor drohendem Übel. 11. Über Ungerechte und Missetäter darfst du lachen, vor wilden Tieren musst du dich nicht fürchten. 12. Denn die wilden Tiere werden dich in Ruhe lassen. 13. Dann wirst du erkennen, dass dein Haus in Frieden leben wird, der Vorrat deines Zeltes soll nicht ausgehen. 14. Du wirst sehen, dass deine Kinder zahlreich sind, deine Nachkommen wie das Gras des Feldes. 15. Du wirst ins Grab steigen wie reife Frucht, geerntet zur rechten Zeit, oder wie ein Haufen Frucht auf der Tenne, den man zur rechten Zeit eingebracht hat”. 16. Ihr sehet, Geliebte, wie stark der Schutz ist für die, welche der Herr in seine Zucht nimmt. Da er nämlich ein guter Vater ist, züchtigt er, damit wir durch seine heilige Zucht Erbarmen finden.</p>
      <h2>57</h2><p>1. Ihr nun, die ihr den Grund zum Aufruhr gelegt habt, unterwerfet euch den Presbytern, lasset euch die Züchtigung dienen zur Umkehr, beuget die Knie eures Herzens. 2. Lernet Unterwürfigkeit, leget ab die großsprecherische und hochfahrende Kühnheit eurer Zunge; es ist nämlich besser für euch, wenn ihr in der Herde Christi klein, aber ehrenhaft befunden werdet, als wenn ihr in scheinbarer Größe ausgeschlossen seid von ihrer Hoffnung, 3. Denn also spricht die hochgerühmte Weisheit: “Sehet, ich will euch heraussagen eine Rede meines Hauches, lehren will ich euch mein Wort. 4. Weil ich rief und ihr nicht darauf hörtet, weil ich entwickelte meine Worte und ihr darauf nicht achtgabet, vielmehr nutzlos machtet meine Pläne und meinen Warnungen nicht folgtet: deshalb werde nun auch ich spotten über euren Untergang und mich freuen, wenn Verderben über euch kommt, und wenn plötzlich über euch Aufruhr hereinbricht, wenn euer Untergang ähnlich wie ein Sturm vor euch steht, oder wenn Trübsal und Belagerung euch heimsucht. 5. Denn kommen wird die Zeit, da ihr zu mir ruft, ich aber euch nicht erhören werde; suchen werden mich die Bösen, aber sie werden mich nicht finden; denn die Weisheit haben sie gehasst, die Furcht des Herrn haben sie nicht angenommen, noch wollten sie achten auf meine Ratschläge, meine Warnungen haben sie verspottet. 6. Deshalb sollen sie essen die Früchte ihres Wandels und sollen satt werden von ihrer Gottlosigkeit. 7. Dafür, dass sie gegen Unmündige gefrevelt haben, sollen sie getötet werden, und das Gericht soll die Gottlosen vernichten; wer aber auf mich hört, der soll in Hoffnung und Vertrauen sein Zelt bewohnen und ohne Furcht Ruhe haben vor jeglichem Unglück”.</p>
      <h2>58</h2><p>1. Wir wollen daher gehorchen seinem allheiligen und herrlichen Namen, um zu entgehen den erwähnten Drohungen, die seine Weisheit gegen die Ungehorsamen gerichtet hat, damit wir wohnen im Vertrauen auf seinen heiligsten und erhabensten Namen. 2. Nehmet an unseren Rat, und es wird euch nicht gereuen. Denn es lebt Gott und es lebt der Herr Jesus Christus und der Heilige Geist, der Glaube und die Hoffnung der Auserwählten, dass der, welcher in Demut mit beharrlichem Gehorsam ohne Wanken die von Gott gegebenen Satzungen und Gebote hält, dass dieser wird eingeordnet und eingereiht werden in die Zahl der durch Jesus Christus Geretteten, durch den ihm die Ehre sei von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>59</h2><p>1. Wer aber ungehorsam ist gegen das, was er durch uns gesagt hat, der soll wissen, dass er sich in Sünde und nicht geringe Gefahr verstrickt. 2. Wir aber werden keine Schuld haben an dieser Sünde und werden in andauernden Bitten und Flehen anhalten, dass der Schöpfer des Weltalls die abgezählte Zahl seiner Auserwählten auf der ganzen Welt unversehrt erhalten wolle durch seinen geliebten Sohn Jesus Christus durch den er uns berufen hat von der Finsternis zum Licht, von der Unwissenheit zur Erkenntnis der Herrlichkeit seines Namens, 3. auf dass wir hoffen auf Deinen Namen, der aller Schöpfung den Anfang gab, da Du uns geöffnet hast die Augen unseres Herzens, damit wir Dich erkennen, den einzigen “Höchsten in der Höhe, den Heiligen, der im Heiligtume ruht”, “Dich, der Du den Stolz der Prahler demütigst”, “die Pläne der Heiden vereitelst”, “die Demütigen erhöhst und die Hohen erniedrigst”, “der Du reich machst und arm”, “tötest und rettest und Leben weckst”, “Dich, den einzigen Wohltäter der Geister und den Gott alles Fleisches”, “der Du hineinsiehst in die Unterwelt”, schaust auf die Werke der Menschen, den Helfer in Gefahr, “den Retter in der Verzweiflung”, den Schöpfer und Aufseher jeglichen Geistes; der Du die Völker zahlreich machst auf der Erde und von allen die erwählt hast, die Dich lieben durch Jesus Christus, Deinen geliebten Sohn, durch den Du uns erzogen, geheiligt und geehrt hast. 4. Wir bitten Dich, Herr, Du mögest unser “Helfer und Beistand” sein. Unsere Bedrängten errette, mit den Bedrückten habe Erbarmen, die Gefallenen richte auf, den Betenden zeige Dich, die Kranken heile, die Irrenden aus Deinem Volke führe den rechten Weg; gib Nahrung den Hungernden, befreie unsere Gefangenen, richte auf die Schwachen, tröste die Kleinmütigen; “erkennen sollen Dich alle Völker, dass Du bist der einzige Gott” und Jesus Christus Dein Sohn und “wir Dein Volk und die Schafe Deiner Weide”.</p>
      <h2>60</h2><p>1. Denn Du hast den bleibenden Bestand der Welt durch das Geschaffene geoffenbart; Du, Herr, hast den Erdkreis gegründet, treu in allen Geschlechtern, gerecht in Deinen Gerichten, bewunderungswürdig in der Macht und Majestät, weise im Erschaffen und verständig im Erhalten des Geschaffenen, gut in dem, was man sieht, und treu gegen die auf Dich Hoffenden, “barmherzig und voll Huld”; vergib uns unsere Sünden und Missetaten, unsere Fehltritte und Vergehen. 2. Rechne nicht jede Sünde Deiner Diener und Dienerinnen an, reinige uns so, wie Deine Wahrheit rein macht, “und leite unsere Schritte, dass wir wandeln in Heiligkeit des Herzens, das Gute tun und was vor Dir wohlgefällig ist” und vor unseren Vorgesetzten. 3. Ja, Herr, “zeige uns Dein Angesicht, damit wir Gutes (erhalten) im Frieden, auf dass wir beschützt seien durch Deine starke Hand” und errettet werden von jeder Sünde “durch Deinen erhabenen Arm”, und dass Du uns erlösest von denen, die uns ungerecht hassen. 4. Gib Friede und Eintracht uns und allen Bewohnern der Erde, wie Du ihn verliehen hast unseren Vätern, “die fromm Dich angerufen haben in Glaube und Wahrheit”, da sie untertan waren Deinem allmächtigen und hochgepriesenen Namen und unseren Herren und Fürsten auf der Erde.</p>
      <h2>61</h2><p>1. Du, o Herr, hast ihnen die Vollmacht zu herrschen gegeben durch Deine übergroße und unbeschreibliche Stärke, damit wir die von Dir ihnen verliehene Herrlichkeit und Ehre anerkennend ihnen gehorchen, ohne irgendwie Deinem Willen zu widersprechen; schenke ihnen, Herr, Gesundheit, Frieden, Einigkeit und Stärke, damit sie ohne Anstoß ihre von Dir verliehene Herrschaft führen. 2. Denn Du, o Herr, himmlischer König der Ewigkeiten, verleihest den Menschenkindern Ehre und Ansehen und Macht über das, was auf Erden ist; leite Du, o Herr, ihren Sinn so wie es “gut und Dir wohlgefällig ist”, damit sie gottesfürchtigen Sinnes in Frieden und Milde ihre von Dir verliehene Gewalt ausüben und so Deiner Gnade teilhaftig werden. 3. Der Du allein imstande bist, diese und noch größere Wohltaten unter uns zu wirken, Dich preisen wir durch den obersten Priester und Führer unserer Seelen Jesus Christus; durch ihn sei Dir die Ehre und die Verherrlichung jetzt und von Geschlecht zu Geschlecht und von Ewigkeit zu Ewigkeit. Amen.</p>
      <h2>62</h2><p>1. Darüber, was unser Gottesdienst erfordert und was am meisten nützlich ist für die, welche ein tugendhaftes Leben in Frömmigkeit und Gerechtigkeit führen wollen, habe ich euch genug geschrieben, Männer, Brüder. 2. Denn über Glaube und Reue und über echte Liebe, Enthaltsamkeit, Keuschheit, Geduld haben wir allerorts gesprochen und daran erinnert, dass ihr in Gerechtigkeit, Wahrheit und Langmut heiligen Sinnes dem allmächtigen Gott gefallen müsst, indem ihr ohne Böses nachzutragen in Liebe und Friede mit dauernder Nachgiebigkeit einmütig lebet, wie auch unsere oben gerühmten Väter Gott wohlgefällig waren dadurch, dass sie demütig waren in dem, was den Vater und Gott und Schöpfer und alle Menschen angeht. 3. Und daran haben wir euch um so lieber erinnert, als wir wohl wussten, dass wir an gläubige und ausgezeichnete Männer schreiben, die wohlbewandert sind in den Worten der göttlichen Lehre.</p>
      <h2>63</h2><p>1. Daher ist es am Platze, dass wir solchen und so vielen Vorbildern uns anschließen, den Nacken beugen und die Pflicht des Gehorsams erfüllen, auf dass wir von dem nutzlosen Streite ablassen und dem uns in Wahrheit vorgesteckten Ziele ohne Tadel zueilen. 2. Ihr werdet uns Freude und Vergnügen bereiten, wenn ihr, gehorsam gegen das, was wir durch den Heiligen Geist (geleitet) geschrieben haben, den sündhaften Zorn eurer Erbitterung ableget, entsprechend der Mahnung, die wir euch über Frieden und Eintracht in diesem Briefe gegeben haben. 3. Wir haben euch zuverlässige und verständige Männer geschickt, die von Jugend auf bis in ihr Alter einen tadellosen Wandel unter uns geführt haben, diese sollen auch Zeugen zwischen euch und uns sein. 4. Dies haben wir getan, damit ihr einsehet, dass wir jede Sorgfalt angewendet haben und anwenden, damit ihr in Bälde den Weg zum Frieden findet.</p>
      <h2>64</h2><p>Im übrigen wolle der allsehende “Gott, der Gebieter der Geister und Herr alles Fleisches”, der den Herrn Jesus Christus und durch ihn uns erwählt hat zu einem bevorzugten Volke, jeder Seele, die seinen erhabenen und heiligen Namen anruft, verleihen Glaube, Furcht, Friede, Geduld und Langmut, Enthaltsamkeit, Keuschheit und Mäßigung, auf dass sie wohlgefällig sei seinem Namen durch unseren obersten Priester und Führer Jesus Christus, durch den ihm Ruhm und Verherrlichung, Stärke und Ehre sei jetzt und in alle Ewigkeit der Ewigkeiten. Amen.</p>
      <h2>65</h2><p>1. Unsere Abgesandten Klaudius Ephebus, Valerius Biton und Fortunatus schicket uns bald und in Frieden mit Freuden zurück, damit sie recht schnell Kunde bringen, dass der von uns sehnlichst erwünschte Friede und die Eintracht hergestellt sei, auf dass auch wir uns schneller freuen können über eure wohlgeordneten Verhältnisse.</p><p>Die Gnade unseres Herrn Jesus Christus sei mit euch und überall mit allen, die berufen sind von Gott und durch ihn, durch den ihm Ruhm, Ehre, Stärke und Verherrlichung, ewige Herrschaft sei von Ewigkeit in alle Ewigkeit. Amen.</p>

      <hr>

      <p><strong>Quelle:</strong> Übersetzung von Franz Zeller, <em>Die Apostolischen Väter</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 35), München 1918, S. 25–69. Text nach <a href="https://bkv.unifr.ch/works/cpg-1001/versions/clem-1clem-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "КлРим_Кор2"
