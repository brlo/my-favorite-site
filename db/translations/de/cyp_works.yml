    title: "Über das Gebet des Herrn"
    menu: { parent: "Abhandlungen", title: "Über das Gebet des Herrn", priority: 8 }
    update: true
    body: |-
      <p><em>Über das Gebet des Herrn, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Die Gebote des Evangeliums, geliebteste Brüder, sind nichts anderes als göttliche Lehren, Grundlagen zur Erbauung der Hoffnung, Stützen zur Festigung des Glaubens, Speisen zur Erquickung des Herzens, ein Steuerruder auf den richtigen Weg und ein Hilfsmittel zur Behauptung des Heils, und indem sie den gelehrigen Sinn der Gläubigen auf Erden unterweisen, führen sie zum himmlischen Reiche. Vieles wollte Gott auch schon durch den Mund seiner Diener, der Propheten, verkündigen und uns vernehmen lassen; doch wieviel erhabener ist das, was der Sohn spricht, was das Wort Gottes, das in den Propheten wohnte, mit eigener Stimme bezeugt! Denn es befiehlt nicht mehr, dem Kommenden den Weg zu bereiten, sondern es kommt selbst und eröffnet und zeigt uns den Weg, damit wir, die wir in der Finsternis des Todes umherirrten und zuvor unachtsam und blind waren, erleuchtet durch das Licht der Gnade, unter der Führung und Leitung des Herrn den Weg des Lebens wandeln.</p><p>Unter seinen übrigen heilsamen Mahnungen und göttlichen Vorschriften, mit denen er für das Heil seines Volkes Sorge trägt, hat er selbst uns auch die richtige Fassung für unser Gebet angegeben, hat er selbst uns gemahnt und unterwiesen, um was wir flehen sollen. Er, der uns das Leben verlieh, hat uns auch gelehrt, zu beten, mit der gleichen Güte eben, in der er uns auch schon alles übrige zu geben und zu gewähren die Gnade hatte, damit wir um so leichter erhört werden, wenn wir mit der Bitte und dem Gebete zum Vater sprechen, das der Sohn gelehrt hat. Schon im voraus hatte er verkündigt, es werde die Stunde kommen, wo die wahren Anbeter den Vater im Geist und in der Wahrheit anbeten würden, und er hat sein einstiges Versprechen erfüllt, und wir, die wir den Geist und die Wahrheit durch seine Heiligung empfangen haben, können auch nach seiner Anweisung in der Wahrheit und im Geiste Gott anbeten. Denn welches Gebet verdiente eher ein Gebet im Geiste zu heißen als das, welches von Christus uns zuteil geworden ist, von dem uns auch der Heilige Geist gesandt ward? Welches Gebet wäre eher vor dem Vater ein Flehen in der Wahrheit als das, welches aus dem Munde seines eigenen Sohnes stammt, der die Wahrheit ist? Anders zu beten, als er gelehrt hat, wäre daher nicht nur Unwissenheit, sondern auch ein Vergehen, da er selbst geäußert und gesagt hat: „Ihr verwerft das Gebot Gottes, um eure Überlieferung aufzustellen".</p><p>Laßt uns also beten, geliebteste Brüder, wie Gott unser Meister es gelehrt hat! Ein willkommenes und trautes Gebet ist es, wenn man zu Gott in seinen eigenen Worten flehen kann, wenn Christi Gebet zu seinen Ohren emporsteigt. Laßt den Vater seines Sohnes Worte wiedererkennen, wenn wir unser Gebet verrichten! Laßt ihn, der drinnen in unserer Brust wohnt, auch auf unseren Lippen wohnen, und da wir an ihm selbst bei dem Vater einen Fürsprecher haben für unsere Sünden, so wollen wir uns auch der Worte unseres Fürsprechers bedienen, wenn wir Sünder um Verzeihung für unsere Vergehen bitten! Denn da er sagt: „Was immer wir vom Vater erbitten werden in seinem Namen, das wird er uns geben", um wieviel wirksamer erreichen wir dann das, was wir in Christi Namen erbitten, wenn wir unsere Bitte in seinen eigenen Worten ihm vortragen?</p><p>Wenn wir aber beten, so sollen unsere Worte und unser Flehen in aller Zucht Ruhe und Ehrerbietung vereinigen. Wir müssen bedenken, daß wir vor Gottes Angesicht stehen. Zu gefallen gilt es da den Augen Gottes nicht nur in der Haltung unseres Körpers, sondern auch durch den Ton unserer Stimme. Denn während es die Art eines Unverschämten ist, laut zu schreien und zu lärmen, ziemt es hingegen dem Ehrerbietigen, mit aller Bescheidenheit zu bitten und zu beten. Hat ja doch der Herr in seiner Lehre uns geboten, im geheimen zu beten, an verborgenen und abgelegenen Orten, ja sogar in unserem Kämmerlein, weil es so dem Glauben besser entspricht. Denn wir sollen wissen, daß Gott überall gegenwärtig ist, daß er alle Menschen hört und sieht und kraft der Fülle seiner Majestät auch in die geheimste Verborgenheit eindringt, wie geschrieben steht: „Ich bin ein Gott in der Nähe und nicht ein Gott aus der Ferne. Wenn sich ein Mensch im Verborgenen verbirgt, werde ich ihn deshalb nicht sehen? Erfülle ich nicht Himmel und Erde?„ und wiederum: „Allerorten sehen die Augen Gottes die Guten und die Bösen“. Auch wenn wir gemeinsam mit unseren Brüdern zusammenkommen und das göttliche Opfer mit dem Priester Gottes feiern, müssen wir der Ehrerbietung und Zucht gedenken und dürfen nicht so ohne weiteres unsere Bitten in nachlässigen Worten hinwerfen oder unser Anliegen, das wir in aller Bescheidenheit Gott anheimzustellen haben, in geräuschvoller Geschwätzigkeit heraussprudeln. Denn Gott horcht nicht auf die Stimme, sondern auf das Herz, und es ist nicht nötig, ihn, der die Gedanken sieht, erst durch lautes Geschrei zu mahnen. Das bestätigt der Herr, wenn er sagt: „Was denkt ihr Böses in eurem Herzen?„ und an einer anderen Stelle: „Und alle Gemeinden werden erkennen, daß ich der Erforscher der Nieren und des Herzens bin“.</p><p>Dieses Gebot hat im ersten Buch der Könige Anna beobachtet und befolgt, die ein Sinnbild der Kirche darstellt. Nicht mit lautschreiender Bitte flehte sie zu Gott, sondern still und bescheiden tief im Grunde ihres Herzens. Sie redete in verborgenem Flehen, aber in deutlich sichtbarem Glauben, sie redete nicht mit den Lippen, sondern mit dem Herzen; denn sie wußte, daß der Herr darauf hörte. Und sie erlangte auch tatsächlich, was sie erflehte, weil sie glaubensvoll ihre Bitte vortrug. Das beweist die göttliche Schrift, die also sagt: „Sie redete in ihrem Herzen, und ihre Lippen bewegten sich, und ihre Stimme wurde nicht gehört, und Gott erhörte sie“. Ebenso lesen wir in den Psalmen: „Sprechet in euren Herzen, und auf euren Lagern empfindet Reue!” Auch durch den Mund des Jeremias gibt der Heilige Geist die gleiche Mahnung und Lehre mit den Worten: „Im Herzen aber muß man zu Dir beten, o Herr".</p><p>Wer aber anbetet, geliebteste Brüder, der möge auch das nicht übersehen, wie im Tempel neben dem Pharisäer der Zöllner betete. Nicht mit dreist zum Himmel erhobenen Augen, nicht mit keck empor gestreckten Armen flehte er die Hilfe der göttlichen Barmherzigkeit an, sondern indem er an seine Brust schlug und die in seinem Innern verschlossenen Sünden offen bekannte. Und während der Pharisäer sich selbst gefiel, verdiente er, der also flehte, viel eher geheiligt zu werden; denn er setzte die Hoffnung des Heils nicht in das Vertrauen auf seine Unschuld, da ja kein Mensch unschuldig ist, sondern er gestand seine Sünden ein und betete voll Demut. Und er, der den Demütigen verzeiht, erhörte auch sein Gebet. Dies berichtet der Herr in seinem Evangelium und sagt: „Zwei Menschen stiegen hinauf in den Tempel um zu beten, der eine ein Pharisäer, der andere ein Zöllner. Als der Pharisäer hingetreten war, betete er bei sich also: ‘Gott, ich danke Dir, daß ich nicht bin wie die übrigen Menschen, Ungerechte, Räuber Ehebrecher oder auch wie dieser Zöllner da. Ich faste zweimal am Sabbat, den Zehnten gebe ich von allem, was ich besitze.’ Der Zöllner aber stand von ferne und hob nicht einmal seine Augen zum Himmel, sondern schlug an seine Brust und sagte:,Gott sei mir Sünder gnädig!’ Ich sage euch, dieser stieg besser gerechtfertigt in sein Haus hinab als jener Pharisäer; denn jeder, der sich erhebt, wird erniedrigt werden, und wer sich erniedrigt, wird erhöhet werden".</p><p>Indem wir dies aus der göttlichen Schrift lernen und nachdem wir ersehen haben, in welcher Weise wir an das Gebet herangehen sollen, wollen wir von dem Herrn uns auch darüber belehren lassen, was wir beten sollen! Er sagt: „Betet also: „Vater unser, der Du bist im Himmel, geheiliget werde Dein Name, Dein Reich komme, Dein Wille geschehe im Himmel und auf Erden, unser tägliches Brot gib uns heute, und vergib uns unsere Schulden, wie auch wir vergeben unseren Schuldigern, und laß uns nicht in Versuchung kommen, sondern erlöse uns von dem Übel!“.</p><p>Vor allem wollte der Lehrer des Friedens und der Erzieher zur Einheit nicht haben, daß wir unser Gebet einzeln und besonders verrichten, so daß etwa einer, wenn er betet, nur für sich allein betete. Wir sagen nicht: „M e i n Vater, der Du bist im Himmel„, auch nicht: „M e i n Brot gib mir heute“, und ebensowenig fleht der einzelne nur für sich um Vergebung seiner Schuld oder bittet für sich allein, nur e r möge nicht in Versuchung geführt, nur e r möge von dem Übel erlöst werden. Öffentlich ist unser Gebet, und es gilt allen; und wenn wir beten, so beten wir nicht für einen einzigen, sondern für das ganze Volk, weil wir alle eins sind. Gott, der Lehrmeister des Friedens und der Eintracht, der die Einheit gelehrt hat, wollte, daß ebenso einer für alle bete, wie er selbst alle in einem getragen hat. Diese Vorschrift für das Gebet beobachteten die drei im Feuerofen eingeschlossenen Jünglinge, die in ihrem Flehen übereinstimmten und in der Eintracht ihres Geistes einmütig waren. Das beweist der glaubwürdige Bericht der göttlichen Schrift, und indem sie lehrt, wie diese Jünglinge gebetet haben, gibt sie uns ein Beispiel, das wir beim Beten nachahmen sollen, damit auch wir ihnen ähnlich werden können. „Darauf„, sagt sie, „sangen jene drei wie aus einem Munde einen Lobgesang und priesen Gott“. Sie sprachen „wie aus einem Munde„, und doch hatte Christus sie noch nicht beten gelehrt. Und die Worte der Betenden waren deshalb erfolgreich und wirksam, weil das friedfertige, schlichte und geistliche Gebet die Huld des Herrn gewann. Ebenso haben auch, wie wir finden, die Apostel mit den Jüngern nach der Himmelfahrt des Herrn gebetet. „Sie verharrten“, heißt es, „alle einmütig im Gebete mit den Frauen und Maria, die Jesu Mutter gewesen war, und mit seinen Brüdern„. „Sie verharrten im Gebete einmütig“, indem sie durch die Dringlichkeit und zugleich durch die Eintracht ihres Gebetes zeigten, daß Gott, der nur Einmütige im Hause wohnen läßt, auch in die göttliche und ewige Behausung nur solche zuläßt, die ihr Gebet einmütig verrichten.</p><p>Welcher Art nun, geliebteste Brüder, sind die heiligen Geheimnisse, die im Gebete des Herrn enthalten sind, wie zahlreich sind sie, wie bedeutsam, in Worten zwar kurz zusammengefaßt, aber in der Kraft dem Geiste nach überreich; nicht das Mindeste ist da Übergängen, und es gibt nichts, was nicht in unseren Bitten und Gebeten trotz der kurzen Zusammenfassung der himmlischen Lehre mit einbegriffen wäre. „Betet also“, sagt er: „Vater unser, der Du bist im Himmel”! Der neue, wiedergeborene und seinem Gott durch dessen Gnade zurückgegebene Mensch sagt zu allererst: „Vater“, weil er bereits angefangen hat, sein Sohn zu sein. „In sein Eigentum”, heißt es, „kam er, und die Seinigen nahmen ihn nicht auf. Soviele ihn aufnahmen, denen gab er die Macht, Gottes Söhne zu werden, die an seinen Namen glauben“. Sobald einer also „an seinen Namen glaubt” und ein Sohn Gottes geworden ist, muß er damit beginnen, daß er Dank sagt und sich offen als einen Sohn Gottes bekennt, indem er Gott seinen Vater im Himmel nennt. Auch soll er gleich bei den ersten Worten nach seiner Wiedergeburt bezeugen, daß er dem irdischen und fleischlichen Vater entsagt und nunmehr angefangen hat, nur den als seinen Vater zu kennen und anzusehen, der im Himmel ist, wie geschrieben steht: „Die zu Vater und Mutter sagen:,Ich kenne dich nicht’ und ihre Söhne nicht anerkennen, diese haben Deine Gebote beobachtet und Deinen Bund bewahrt“. Ebenso hat der Herr in seinem Evangelium geboten, wir sollten niemand auf Erden unseren Vater nennen, weil wir eben nur den einen Vater haben, der im Himmel ist. Und einem Jünger, der seines verstorbenen Vaters Erwähnung tat, erwiderte er: „Laß die Toten ihre Toten begraben!” Er hatte nämlich gesagt, sein Vater sei tot, während der Vater der Gläubigen doch lebendig ist.</p><p>Aber nicht nur darauf, geliebteste Brüder, müssen wir achten und merken, daß wir ihn einen „Vater" nennen, „der im Himmel ist“, sondern wir fügen noch etwas hinzu und sagen: „Vater u n s e r”, das heißt: derer, die glauben, derer, die durch ihn geheiligt und durch die Geburt der Geistesgnade erneuert, Söhne Gottes geworden sind. Dieser Ausdruck enthält auch einen Vorwurf und eine Zurückweisung für die Juden, weil sie Christus, der ihnen durch die Propheten angekündigt und zu ihnen zuerst gesandt worden war, nicht nur ungläubig verachtet, sondern auch grausam getötet haben. Sie können nun Gott nicht mehr ihren Vater nennen, da der Herr sie abweist und von sich stößt, indem er sagt: „Ihr habt den Teufel zum Vater, und die Gelüste eures Vaters wollt ihr befriedigen. Denn er war ein Mörder von Anfang und bestand nicht auf der Wahrheit, weil die Wahrheit nicht in ihm ist“. Auch durch den Mund des Propheten Isaias ruft Gott voll Unwillen: „Söhne habe ich gezeugt und erhöht, sie aber haben mich verachtet. Der Ochse kennt seinen Besitzer und der Esel die Krippe seines Herrn; Israel aber kennt mich nicht, und mein Volk hat mich nicht verstanden. Wehe dem sündigen Geschlechte, dem Volke voller Missetaten; nichtswürdiger Same, ruchlose Söhne! Verlassen habt ihr den Herrn und in Unwillen versetzt ihn, den Heiligen Israels”. Für sie ist es ein Vorwurf, wenn wir Christen beim Beten sagen: „Vater unser“, weil er nunmehr der unsrige geworden ist und aufgehört hat, der Vater der Juden zu sein, die ihn verlassen haben. Ebensowenig kann ein sündhaftes Volk ein Sohn Gottes sein, sondern nur denen, die Vergebung der Sünden erhalten, wird die Bezeichnung „Söhne” beigelegt; nur ihnen wird auch die Ewigkeit verheißen in den Worten des Herrn selbst: „Jeder, der Sünde tut, ist ein Knecht [der Sünde]. Doch der Knecht bleibt nicht auf ewig im Hause, der Sohn aber bleibet ewiglich".</p><p>Welch große Nachsicht aber ist es von dem Herrn, welch reiche Fülle seiner Gnade und Güte gegen uns, daß er nicht nur wünschte, wir sollten unser Gebet im Angesichte Gottes in der Weise verrichten, daß wir Gott unseren Vater nennen, sondern daß auch wir ebensogut Söhne Gottes heißen, wie Christus Gottes Sohn ist! Diese Bezeichnung würde keiner von uns beim Gebete in den Mund zu nehmen wagen, hätte nicht er selbst uns gestattet, so zu beten. Darum sollten wir, gehebteste Brüder, stets daran denken und uns dessen bewußt bleiben: wenn wir Gott unseren Vater nennen, dann müssen wir auch als Söhne Gottes uns benehmen, damit ebenso, wie wir uns darin gefallen, Gott zum Vater zu haben, auch er an uns sein Gefallen hat. Laßt uns wandeln als Tempel Gottes, damit man sieht, daß Gott in uns wohnt! Laßt uns in unserem ganzen Handeln den Geist nicht verleugnen, und wollen wir, die wir geistlich und himmlisch geworden sind, auch nur Geistliches und Himmlisches denken und tun! Hat doch Gott der Herr selbst gesagt: „Diejenigen, die mich verherrlichen, werde ich verherrlichen, und die mich verachten, werden verachtet werden„. Auch der selige Apostel hat in seinem Brief geschrieben: „Ihr seid nicht euer; denn ihr seid um einen hohen Preis erkauft. Verherrlichet und traget Gott in eurem Leibe!“</p><p>Wir fahren dann fort: „Geheiliget werde dein Name“, nicht als ob wir Gott wünschten, er möge durch unsere Gebete geheiligt werden, sondern weil wir Gott darum bitten, daß sein Name i n u n s geheiligt werde. Von wem könnte aber auch Gott geheiligt werden, der doch selbst heiligt? Aber weil er selbst gesagt hat: „Seid heilig, weil auch ich heilig bin”, so bitten und flehen wir darum, daß wir, die wir in der Taufe geheiligt worden sind, in dem verharren, was wir zu sein angefangen haben. Und darum beten wir Tag für Tag: denn uns tut tägliche Heiligung not, damit wir, die wir tagtäglich sündigen, unsere Sünden durch beständige Heiligung wieder reinwaschen. Worin aber diese Heiligung besteht, die uns durch Gottes Gnade zuteil wird, das verkündigt der Apostel mit den Worten: „Weder die Hurer noch die Götzendiener noch die Ehebrecher noch die Weichlinge noch die Knabenschänder noch die Diebe noch die Betrüger noch die Trunkenbolde noch die Schmähsüchtigen noch die Räuber werden das Reich Gottes erlangen. Und das seid ihr gewesen, aber ihr seid reingewaschen, aber ihr seid gerechtfertigt, aber ihr seid geheiligt im Namen des Herrn Jesu Christi und im Geiste unseres Gottes“. „Geheiligt” nennt er uns „im Namen des Herrn Jesu Christi und im Geiste unseres Gottes". Daß diese Heiligung in uns verbleiben möge, darum beten wir; und weil unser Herr und Richter dem von ihm Geheiligten und Neubelebten drohend einschärft, nun nicht mehr zu sündigen, damit ihm nicht Ärgeres widerfahre, so bitten wir in unablässigen Gebeten, so flehen wir Tag und Nacht darum, die Heiligung und Wiederbelebung, die von Gottes Gnade kommt, möge uns durch seinen Schutz erhalten bleiben.</p><p>Dann heißt es im Gebete weiter: „Dein Reich komme!„ Daß Gottes Reich bald erscheinen möge, auch das erbitten wir ebensogut f ü r u n s, wie wir wünschen, daß auch sein Name i n u n s geheiligt werde. Denn wann bestünde Gottes Reich nicht? Oder wann finge bei ihm das an, was schon immer gewesen ist und nie zu sein aufhört? Unser Reich, so bitten wir, möge zu uns kommen, das Reich, das von Gott uns verheißen, das durch Christi Blut und Leiden erworben ist, auf daß wir, die wir in der Welt vorher gedient haben, nachmals in Christi Reich herrschen, wie er selbst verspricht und sagt: „Kommet, ihr Gesegneten meines Vaters, empfanget das Reich, das euch bereitet ist von Anbeginn der Welt!“ Es kann aber, geliebteste Brüder, auch Christus selbst das Reich Gottes sein, nach dessen Kommen wir täglich verlangen, dessen baldige Ankunft wir sehnsüchtig wünschen. Denn da er selbst die Auferstehung ist, weil wir in ihm wieder auferstehen, so kann er auch selbst als das Reich Gottes aufgefaßt werden, weil wir in ihm herrschen sollen. Mit Recht aber bitten wir um das Reich Gottes, das heißt: um das himmlische Reich, denn es gibt ja auch ein irdisches Reich. Wer jedoch der Welt bereits entsagt hat, der ist erhaben über ihre Ehren und über ihr Reich; wer sich also Gott und Christus weiht, der sehnt sich nicht nach einem irdischen, sondern nach dem himmlischen Reiche. Unablässiges Bitten und Flehen aber tut not, damit wir nicht ebenso des himmlischen Reiches verlustig gehen wie die Juden, denen es zuerst verheißen war. Das verkündigt und bestätigt uns der Herr. „Viele„, sagt er, „werden kommen vom Aufgang und vom Untergang und werden mit Abraham und Isaak und Jakob im Himmelreich sich niederlassen. Die Kinder des Reiches aber werden hinausgestoßen werden in die äußerste Finsternis; dort wird sein Heulen und Zähneknirschen“. Er zeigt, daß vordem die Juden Söhne des Reiches waren, solange sie eben auch Söhne Gottes blieben; seitdem aber der väterliche Name für sie verloren war, war es auch mit dem Reiche für sie zu Ende. Und deshalb bitten wir Christen, die wir Gott im Gebete unseren Vater nennen dürfen, auch darum, daß das Reich Gottes zu uns komme.</p><p>Wir fügen auch noch die weiteren Worte hinzu: „Dein Wille geschehe im Himmel und auf Erden“, nicht etwa, damit Gott tun kann, was er will, sondern damit wir zu tun vermögen, was Gott will. Denn wer hindert Gott daran, seinen Willen zu tun? Weil hingegen wir vom Teufel verhindert werden, in unserem Tun und Trachten in allen Stücken Gott zu gehorchen, so beten und flehen wir darum, daß i n u n s der Wille Gottes geschehe. Damit dieser aber in uns geschieht, brauchen wir Gottes Willen, das heißt: seine Hilfe und seinen Schutz. Denn niemand ist stark aus eigener Kraft, sondern nur Gottes Gnade und Barmherzigkeil bietet sicheren Schutz. So sagte auch der Herr, indem er die Schwäche der menschlichen Natur verriet, die er an sich trug: „Vater, wenn es möglich ist, so gehe dieser Kelch an mir vorüber!” Um aber seinen Jüngern ein Beispiel zu geben, daß sie nicht ihren, sondern Gottes Willen tun sollten, setzte er noch die Worte hinzu: „Doch nicht, was ich will, sondern was Du willst“. Und an einer anderen Stelle sagt er: „Ich bin nicht vom Himmel herabgestiegen, um meinen Willen zu tun, sondern den Willen dessen, der mich gesandt hat”. Wenn nun aber der Sohn gehorchte und den Willen seines Vaters tat, wieviel mehr muß dann der Knecht gehorchen, um den Willen seines Herrn zu erfüllen? So ermahnt und lehrt uns ja auch Johannes in seinem Briefe, den Willen Gottes zu tun, indem er sagt: „Liebet nicht die Welt noch das, was in der Welt ist! Wenn jemand die Welt liebt, so ist die Liebe des Vaters nicht in ihm; denn alles, was in der Welt ist, ist Begehrlichkeit des Fleisches und Begehrlichkeit der Augen und weltliche Hoffart, die nicht vom Vater ist, sondern von der Begehrlichkeit der Welt. Und die Welt wird vergehen und ihre Begehrlichkeit; wer aber den Willen Gottes tut, bleibet in Ewigkeit, wie auch Gott bleibet in Ewigkeit". Wenn wir also in Ewigkeit bleiben wollen, müssen wir den Willen Gottes tun, der ewig ist.</p><p>Der Wille Gottes aber, den Christus erfüllt und gelehrt hat, ist Demut im ganzen Verhalten, Beständigkeit im Glauben, Bescheidenheit in unseren Worten, Gerechtigkeit in unseren Taten, Barmherzigkeit in unseren Werken und Zucht in unseren Sitten. Anderen niemals Unrecht tun, erlittenes Unrecht aber willig ertragen, mit den Brüdern Frieden halten, den Herrn von ganzem Herzen verehren, ihn lieben als unseren Vater, ihn fürchten als unseren Gott, Christus über alles stellen, weil auch er nichts über uns gestellt hat, ihm in unzertrennlicher Liebe anhangen, voll Mut und Vertrauen zu seinem Kreuze stehen, wenn um seinen Namen und seine Ehre der Streit tobt, mit unserem Munde voll Standhaftigkeit das Bekenntnis ablegen, beim gerichtlichen Verhör voll Zuversicht in den Kampf gehen und im Tode durch Geduld die Krone erringen: das heißt danach streben, ein Miterbe Christi zu sein, das heißt dem Gebote Gottes nachkommen, das heißt den Willen des Vaters erfüllen.</p><p>Wir bitten aber, der Wille Gottes möge geschehen „im Himmel und auf Erden“; dies läuft beides auf die Vollendung unserer Wohlfahrt und unseres Heils hinaus. Denn da wir einen Leib von der Erde und einen Geist vom Himmel besitzen, so sind wir selbst Erde und Himmel und bitten darum, es möge in beiden, das heißt: nicht nur im Leibe, sondern auch im Geiste, Gottes Wille geschehen. Denn Fleisch und Geist liegen miteinander in Fehde, und bei ihrem gegenseitigen Zwist kommt es täglich zum Kampfe; und so können wir gerade das, was wir wollen, nicht ausführen, da der Geist das Himmlische und Göttliche sucht, während das Fleisch nach dem Irdischen und Zeitlichen verlangt. Deshalb bitten wir darum, es möge zwischen diesen beiden Gegnern mit Gottes Beistand und Hilfe Eintracht hergestellt werden, damit die durch ihn wiedergeborene Seele gerettet wird, indem nicht nur im Geiste, sondern auch im Fleische Gottes Wille sich vollzieht. Dies erklärt in offenen und deutlichen Worten der Apostel Paulus. „Das Fleisch„, sagt er, „begehrt wider den Geist und der Geist wider das Fleisch. Denn diese widerstreben einander, so daß ihr eben das nicht tut, was ihr wollt. Offenkundig aber sind die Werke des Fleisches, als da sind Ehebruch, Hurerei, Unlauterkeit, Unzucht, Götzendienst, Zauberei, Totschlag, Feindschaft, Streit, Eifersucht, Zorn, Aufreizung, Groll, Zwietracht, Zerwürfnis, Mißgunst, Trunkenheit, Schwelgerei und dergleichen; die solches tun, werden das Reich Gottes nicht besitzen. Die Frucht aber des Geistes ist Liebe, Freude, Friede, Großmut, Güte, Glaube, Sanftmut, Enthaltsamkeit, Keuschheit“. Das ist der Grund, warum wir in täglichen, ja in unablässigen Gebeten darum flehen, es möge nicht nur im Himmel, sondern auch auf Erden der Wille Gottes an uns geschehen. Denn der Wille Gottes geht dahin, daß das Irdische vor dem Himmlischen zurücktrete und daß das Geistliche und Göttliche die Oberhand gewinne.</p><p>Man kann es auch so verstehen, geliebteste Brüder: nachdem der Herr befiehlt und uns mahnt, sogar die Feinde zu lieben und auch für die zu beten, die uns verfolgen, sollen wir auch für die bitten, die noch Erde sind und noch nicht angefangen haben, himmlisch zu sein, damit auch an ihnen der Wille Gottes geschehe, den Christus durch die Erhaltung und Erneuerung des Menschen erfüllt hat. Denn die Jünger werden von ihm nicht mehr Erde, sondern das Salz dar Erde genannt, und der Apostel sagt, der erste Mensch stamme vom Lehm der Erde, der zweite aber vom Himmel. Deshalb ist es nur recht und billig, wenn auch wir, die wir Gott dem Vater ähnlich sein sollen, der seine Sonne aufgehen läßt über Gute und Böse und regnen läßt über Gerechte und Ungerechte, — wenn auch wir nach der Mahnung Christi in der Weise beten und flehen, daß wir für das Heil aller Menschen Fürbitte einlegen, damit ebenso wie im Himmel, das heißt: an uns, durch unseren Glauben der Wille Gottes geschehen ist, so daß wir vom Himmel sind, nun auch auf Erden, das heißt: an jenen noch Ungläubigen, der Wille Gottes geschehe und damit sie, die noch von ihrer ersten Geburt her irdisch sind, aus Wasser und Geist neugeboren werden und anfangen, himmlisch zu sein.</p><p>Im weiteren Verlauf des Gebetes bitten und sagen wir: „Unser tägliches Brot gib uns heute!" Dies kann sowohl in geistlichem als auch in wörtlichem Sinne verstanden werden; denn beide Arten der Auffassung bergen einen göttlichen Nutzen und dienen zum Heile. Das Brot des Lebens nämlich ist Christus, und dieses Brot gehört nicht allen, sondern nur uns. Und wie wir beten: „Vater unser“, weil er der Vater der Erkennenden und Gläubigen ist, so sagen wir auch: „unser Brot”, weil Christus das Brot derer ist, die wie wir seinen Leib berühren dürfen. Daß aber dieses Brot uns täglich zuteil werden möge, darum bitten wir deshalb, damit wir, die wir in Christus sind und seine Eucharistie jeden Tag als Speise des Heils empfangen, vom Leibe Christi nicht getrennt werden, indem irgendein schwereres Vergehen dazwischentritt, das uns aus jeder Gemeinschaft ausscheidet und uns den Genuß des himmlischen Brotes verschließt. Verkündet und sagt er doch selbst: „Ich bin das Brot des Lebens, der ich vom Himmel herabgestiegen bin. Wenn jemand ißt von meinem Brote, so wird er leben in Ewigkeit. Das Brot aber, das ich gebe, ist mein Fleisch für das Leben der Welt“. Wenn er also sagt: wer von seinem Brote esse, der lebe in Ewigkeit, so ist es zwar offenbar, daß alle die leben, die seinen Leib berühren und die Eucharistie nach dem Rechte der Gemeinschaft empfangen, andererseits aber muß es unsere Sorge und unser Gebet sein, daß keiner von der Gemeinschaft ausgeschlossen und vom Leibe Christi getrennt werde und so des Heiles verlustig gehe. Damit droht er selbst in den Worten: „Wenn ihr nicht esset das Fleisch des Menschensohnes und trinket sein Blut, so werdet ihr nicht das Leben in euch haben”. Und deshalb bitten wir darum, daß unser Brot, das heißt: Christus, täglich uns gegeben werde, damit wir, die wir in Christus bleiben und leben, von seiner Heiligung und seinem Leibe uns nicht entfernen.</p><p>Man kann es aber auch so auffassen, daß wir, die wir der Welt entsagt und ihren Reichtum und Prunk im Vertrauen auf die geistliche Gnade abgeworfen haben, nur um Speise und Lebensunterhalt für uns bitten, weil der Herr lehrt und sagt: „Wer nicht allem entsagt, was sein ist, der kann nicht mein Jünger sein„. Wer aber angefangen hat, Christi Jünger zu sein und nach dem Worte seines Meisters allem entsagt, der darf nur um die gleiche Nahrung flehen und nicht auf lange hinaus Wünsche und Bitten äußern, wie abermals der Herr selber vorschreibt und sagt: „Sorget nicht für morgen; denn der morgige Tag wird selbst für sich sorgen. Jedem Tage genügt seine Plage“. Mit Recht also bittet der Jünger Christi, dem es verboten ist, für den kommenden Tag zu sorgen, immer nur für e i n e n Tag um seinen Lebensunterhalt; denn es wäre ein unvereinbarer Widerspruch, wenn wir lange auf dieser Welt zu leben suchten, obwohl wir doch darum bitten, daß das Reich Gottes bald zu uns kommen möge. Ebenso mahnt auch der selige Apostel, indem er die Festigkeit unserer Hoffnung und unseres Glaubens sichert und kräftigt. „Nichts„, sagt er, „haben wir in diese Welt hereingebracht, wir können aber auch nichts mit uns fortnehmen. Haben wir also Nahrung und Kleidung, so lasset uns damit zufrieden sein! Die aber reich werden wollen, fallen in Versuchung und Fallstricke und viele schädliche Lüste, die den Menschen in Verderben und Untergang versenken. Denn die Wurzel aller Übel ist die Habsucht; und einige, die ihr anhingen, haben am Glauben Schiffbruch gelitten und haben sich in viele Schmerzen gestürzt“.</p><p>Der Reichtum, so lehrt er, ist nicht nur zu verachten, sondern er ist auch gefährlich: hier liege die Wurzel verführerischer Übel, die den verblendeten Geist des Menschen in geheimem Truge betören. Deshalb tadelte auch Gott den reichen Toren, der nur auf zeitlichen Wohlstand bedacht war und sich mit der Fülle seiner überreichen Ernte brüstete, indem er zu ihm sagte: „Du Tor, heute Nacht wird deine Seele von dir gefordert! Wem wird nun gehören, was du erworben hast?". Der Tor freute sich seiner Ernte, und er sollte doch noch in derselben Nacht sterben, und während sein Leben schon dem Ende nahe war, dachte er noch an die reichen Vorräte für sein Leben. Umgekehrt aber wird nach des Herrn Lehre derjenige vollkommen und vollendet, der seine ganze Habe verkauft, und zum Besten der Armen verteilt und sich so einen Schatz im Himmel sammelt. Nur der, sagt er, könne ihm folgen und den Herrn in dem Ruhm des Leidens nachahmen, der, gewappnet und gerüstet, von keinen Fesseln seines irdischen Besitzes umstrickt ist, sondern los und ledig selbst seiner Habe nachfolgt, die er vorher zum Herrn vorausgesandt hat. Damit sich jeder von uns zu gleichem Tun bereiten kann, lernt er in dieser Weise beten und aus dem vorgeschriebenen Wortlaut des Gebetes erkennen, wie er sein soll.</p><p>Denn dem Gerechten kann es gar nicht an der täglichen Nahrung fehlen, da geschrieben steht: „Der Herr wird eine gerechte Seele nicht durch Hunger töten„, und abermals: „Ich bin jung gewesen und alt geworden und habe noch keinen Gerechten verlassen gesehen noch, wie sein Same nach Brot ging“. Ebenso verspricht der Herr und sagt: „Ihr sollt nicht sorgen und sagen: „‘Was werden wir essen, oder was werden wir trinken, oder womit werden wir uns kleiden?’ Denn danach trachten die Heiden. Euer Vater aber weiß, daß ihr dies alles bedürfet. Trachtet zuerst nach dem Reiche und nach der Gerechtigkeit Gottes, und dies alles wird euch auch zuteil werden“. Denen, die nach dem Reiche und nach der Gerechtigkeit Gottes trachten, soll nach seiner Verheißung auch alles andere zuteil werden. Denn da alles Gott gehört, so wird es dem, der Gott hat, an nichts fehlen, wenn er selbst es Gott gegenüber an nichts fehlen läßt. So wird für Daniel durch göttliche Fügung ein Mahl beschafft, während er auf Befehl des Königs in der Löwengrube eingeschlossen ist, und der Mann Gottes wird inmitten der wilden Tiere gespeist, die trotz ihres Hungers ihn verschonen. So wird Elias auf der Flucht und in der Einsamkeit durch Raben unterhalten, die ihm dienen, und durch Vögel, die ihm Speise zutragen, wird er in der Verfolgung ernährt. Und — welch verabscheuenswerte Grausamkeit menschlicher Bosheit! — die wilden Tiere üben Schonung, die Vögel bringen Nahrung, und die Menschen — sinnen auf Nachstellungen und Wut!</p><p>Sodann flehen wir auch für unsere Sünden mit den Worten: „Und vergib uns unsere Schulden, wie auch wir vergeben unsern Schuldigern!„ Auf die Bitte um Gewährung der Nahrung folgt die Bitte um Vergebung der Sünde, auf daß derjenige, der von Gott gespeist wird, auch in Gott lebt und damit nicht nur für das gegenwärtige und zeitliche, sondern auch für das ewige Leben Sorge getragen wird. Denn zu diesem kann man nur gelangen, wenn die Sünden vergeben werden, die der Herr Schulden nennt, wie er in seinem Evangelium sagt: „Ich habe dir die ganze Schuld erlassen, weil du mich gebeten hast“. Wie notwendig aber, wie vorsorglich und heilsam ist für uns die Erinnerung daran, daß wir Sünder sind, und die Nötigung, für unsere Sünden zu flehen; denn die Seele gedenkt so ihrer Schuld, indem Gott um Nachsicht angegangen wird. Damit ja keiner voll Selbstgefälligkeit tut, als wäre er unschuldig, und durch seine Selbstüberhebung nur noch unrettbarer dem Verderben verfällt, wird jeder unterrichtet und belehrt, daß er täglich sündigt, indem er aufgefordert wird, täglich für seine Sünden zu beten. So mahnt uns ja auch Johannes in seinem Briefe mit den Worten: „Wenn wir sagen, wir haben keine Sünde, so betrügen wir uns selbst, und die Wahrheit ist nicht in uns, Wenn wir aber unsere Sünden bekennen, so ist der Herr getreu und gerecht, daß er uns die Sünden vergibt. In seinem Briefe hat er beides zusammengefaßt, erstens, daß wir für unsere Sünden bitten müssen, und zweitens, daß wir Verzeihung erlangen, wenn wir das tun. Deshalb hat er auch gesagt, der Herr sei getreu, die Sünden zu vergeben, weil er sein Versprechen getreulich hält. Denn er, der uns gelehrt hat, für unsere Schulden und Sünden zu beten, hat uns auch verheißen, daß die väterliche Barmherzigkeit und die Verzeihung nachfolgen wird.</p><p>Indem er uns durch eine feste Bedingung und feierliche Verpflichtung bindet, hat er allerdings noch die Vorschrift beigefügt und hinzugesetzt: wir sollten für uns um Vergebung unserer Schulden ebenso bitten, wie wir auch selbst unseren Schuldigern vergeben, in der Gewißheit, daß wir das, was wir für unsere Sünden erbitten, nicht erlangen können, wenn wir nicht selbst auch an unseren Schuldigern das gleiche tun. Deshalb sagt er auch an einer anderen Stelle: „Mit dem Maße, mit dem ihr messet, wird auch euch wieder gemessen werden“. Und der Knecht, der seinem Mitknecht die Schuld nicht nachlassen wollte, nachdem ihm doch sein Herr die ganze Schuld erlassen hatte, wird ins Gefängnis geworfen. Weil er mit seinem Mitknecht keine Nachsicht haben wollte, verlor er das, was ihm von dem Herrn vorher schon nachgesehen worden war. Dies hält uns Christus in seinen Geboten noch nachdrücklicher vor Augen in der vollen Strenge seines Gerichts.”Wenn ihr dasteht„, sagt er, „zum Gebet, so vergebet. wenn ihr gegen irgendeinen etwas habt, damit auch euer Vater, der im Himmel ist, euch eure Sünden vergibt! Wenn aber ihr nicht vergebt, dann wird auch euer Vater, der im Himmel ist, euch eure Sünden nicht vergeben“. Gar keine Entschuldigung bleibt dir da am Tage des Gerichts übrig, denn du wirst nach deinem eigenen Urteil gerichtet, und was du anderen getan hast, das hast du auch selbst zu erleiden. Gott hat uns ja doch geboten, friedfertig, einträchtig und einmütig in seinem Hause zu wohnen, und er will, daß wir nach unserer Wiedergeburt so bleiben, wie er uns durch die zweite Geburt geschaffen hat. So sollen also wir, nachdem wir angefangen haben, Gottes Söhne zu sein, in Gottes Frieden verharren, und wie wir einen Geist haben, auch eines Herzens und eines Sinnes sein. Deshalb nimmt auch Gott das Opfer eines unversöhnlichen Menschen nicht an und fordert ihn auf, vom Altar wegzutreten und sich zuvor mit seinem Bruder auszusöhnen, damit er dann durch seine friedfertigen Bitten auch bei Gott Frieden finde. Ein größeres Opfer in Gottes Augen ist es, wenn Friede und brüderliche Eintracht unter uns herrscht und wenn das Volk in der Einheit des Vaters und des Sohnes und des Heiligen Geistes verbunden ist.</p><p>Denn auch bei den Opfern, die Abel und Kain zuerst darbrachten, sah Gott nicht auf ihre Gaben, sondern auf ihre Herzen, so daß der mit seiner Gabe Gnade fand, der mit seinem Herzen wohlgefiel. Indem der friedfertige und gerechte Abel Gott in Unschuld opferte, lehrte er auch die übrigen: wenn sie am Altar ihre Gaben darbringen, sollten sie ebenso hintreten in der Furcht Gottes, in der Einfalt des Herzens, nach dem Gesetze der Gerechtigkeit und in dem Frieden der Eintracht. Mit Recht ist er, der Gott in dieser Weise sein Opfer darbrachte, später selbst für Gott ein Opfer geworden, und als der erste Märtyrer wurde gerade er mit dem Ruhme seines Blutes der Vorläufer für das Leiden des Herrn, der nicht nur die Gerechtigkeit, sondern auch den Frieden des Herrn gehabt hatte. Solche also sind es, die von dem Herrn gekrönt werden, solche werden am Tage des Gerichts an der Seite des Herrn als Richter sitzen. Wer aber in Uneinigkeit und unversöhnlicher Feindschaft lebt und mit den Brüdern keinen Frieden hält, der wird nach dem Zeugnis des seligen Apostels und der Heiligen Schrift dem Vorwurf des Bruderzwistes nicht einmal dann entgehen, wenn er für den Namen [Christi] den Tod erlitten hat; denn, wie geschrieben steht, ist der ein Totschläger, der seinen Bruder haßt; ein Totschläger aber gelangt nicht zum Himmelreich und lebt nicht mit Gott. Mit Christus kann einer nicht sein, wenn er lieber ein Nachahmer des Judas hat sein wollen als ein Nachahmer Christi. Welch schweres Vergehen muß das sein, wenn man es nicht einmal durch die Bluttaufe abwaschen kann! Welch furchtbare Sünde ist es, wenn sie sich nicht einmal durch den Märtyrertod sühnen läßt!</p><p>Auch das ist notwendig, daß der Herr uns mahnt, im Gebete zu sprechen: „Und laß uns nicht in Versuchung kommen!„ Aus diesen Worten geht hervor, daß der Widersacher nichts gegen uns ausrichten kann, wenn nicht Gott es vorher zuläßt; deshalb soll sich all unsere Furcht, unsere Ergebenheit und unser Gehorsam Gott zuwenden, da der Böse bei seinen Versuchungen nichts gegen uns vermag, wenn ihm nicht von dorther die Macht erteilt wird. Das bestätigt die göttliche Schrift, wenn sie sagt: „Nabuchodonosor, der König von Babylonien, kam nach Jerusalem und eroberte es, und der Herr gab es in seine Hand“. Gegeben aber wird dem Bösen die Macht über uns nur infolge unserer Sünden, wie geschrieben steht: „Wer hat Jakob zur Plünderung hingegeben und Israel den Räubern? War es nicht der Herr, an dem sie gesündigt haben? Und sie wollten auf seinen Wegen nicht wandeln und nicht hören auf sein Gesetz, und er hat über sie ausgeschüttet den Grimm seiner Entrüstung„. Und abermals heißt es, als Salomo sündigte und von den Geboten und Wegen des Herrn abwich: „Und der Herr erweckte den Satan gegen Salomo selbst“.</p><p>Gewalt aber wird ihm zu zweierlei Zwecken gegen uns gegeben: entweder zur Strafe, wenn wir sündigen, oder zur Verherrlichung, wenn wir uns bewähren. So war es, wie wir sehen, bei Hiob der Fall, da Gott erklärt und sagt: „Siehe, alles, was er hat, gebe ich in deine Hände; aber hüte dich, ihn selbst zu berühren!“ Und der Herr spricht im Evangelium in der Zeit seines Leidens: „Du hättest keine Gewalt wider mich, wenn sie dir nicht verliehen wäre von oben”. Wenn wir aber darum bitten, daß wir nicht in Versuchung kommen, so werden wir an unsere eigene Ohnmacht und Schwäche erinnert; denn wir beten so, damit keiner voll Vermessenheit sich überhebe, damit keiner voll Stolz und Eitelkeit sich etwas anmaße, damit keiner den Ruhm des Bekenntnisses oder des Leidens für sich in Anspruch nehme. Hat doch der Herr selbst Demut gelehrt und gesagt: „Wachet und betet, damit ihr nicht in Versuchung kommt; der Geist zwar ist willig, aber das Fleisch ist schwach". Indem man also ein demütiges und unterwürfiges Bekenntnis vorausschickt und alles Gott zuschreibt, erhält man all das von seiner liebevollen Güte gewährt, was man in Furcht und Ehrerbietung vor Gott flehentlich erbittet.</p><p>Nach all dem kommt am Ende des Gebetes ein Schlußsatz, der alle unsere Bitten und Anliegen in gedrängter Kürze in sich begreift. Denn wir schließen mit den Worten: „Sondern erlöse uns von dem Übel“, indem wir alle Widerwärtigkeiten zusammenfassen, die der Feind in dieser Welt gegen uns im Schilde führt. Vor ihnen kann es nur dann einen festen und zuverlässigen Schutz geben, wenn uns Gott erlöst, wenn er uns auf unser Bitten und Flehen hin seine Hilfe angedeihen läßt. Wenn wir aber sagen: „Erlöse uns von dem Übel”, so bleibt uns nichts weiter zu erflehen übrig, da wir damit ein für allemal Gottes Schutz gegen das Übel erbitten. Haben wir aber diesen erlangt, so stehen wir sicher und ungefährdet da gegen alles, was der Teufel und die Welt gegen uns im Werke haben. Denn wie kann einer sich fürchten vor der Welt, wenn ihm Gott in der Welt als Beschützer zur Seite steht?</p><p>Was Wunder, geliebteste Brüder, wenn das Gebet von so trefflicher Kürze ist! Hat es doch Gott gelehrt, der durch eine Unterweisung all unser Flehen in heilsamen Worten kurz zusammenfaßte. Dies war schon durch den Propheten Isaias vorherverkündigt worden, als er, des Heiligen Geistes voll, von Gottes Majestät und Güte sprach: „Das Wort vollendend“, sagt er, „und abkürzend in Gerechtigkeit; denn kurze Worte wird Gott machen auf dem ganzen Erdkreise”. Denn da das Wort Gottes, unser Herr Jesus Christus, für alle gekommen ist, da er ohne Unterschied Gelehrte wie Ungelehrte um sich gesammelt und jedem Geschlecht und Alter seine Heilsgebote gegeben hat, so stellte er seine Vorschriften in einem vollständigen Auszug zusammen, damit das Gedächtnis der Lernenden mit der himmlischen Lehre keine Mühe habe, sondern das für einen schlichten Glauben Notwendige schnell erlernen könne. Als er zum Beispiel lehrte, was das ewige Leben sei, da faßte er das heilige Geheimnis des Lebens in vorzüglicher und göttlicher Kürze zusammen in den Worten: „Dies aber ist das ewige Leben, daß sie erkennen Dich, den einzigen und wahren Gott, und den Du gesandt hast, Jesus Christus“. Ebenso sagte er, als er aus dem Gesetze und den Propheten die ersten und wichtigsten Gebote auswählte: „Höre, Israel: der Herr, dein Gott, ist ein einziger Herr; und du sollst den Herrn, deinen Gott, lieben aus deinem ganzen Herzen und aus deiner ganzen Seele und aus deiner ganzen Kraft! Dies ist das erste Gebot; und das zweite ist diesem gleich: du sollst deinen Nächsten lieben wie dich selbst! An diesen beiden Geboten hängt das ganze Gesetz und die Propheten”. Und wiederum: „Alles, was ihr wollt, daß euch die Menschen Gutes tun, das tuet auch ihr innen ebenso! Denn dies ist das Gesetz und die Pro pheten".</p><p>Aber nicht nur in Worten, sondern auch durch die Tat hat der Herr uns beten gelehrt, indem er selbst häufig betete und flehte und durch das Zeugnis seines eigenen Beispiels zeigte, was wir zu tun haben. So steht geschrieben: „Er selbst aber entwich in die Wüste und betete„, und wiederum: „Er ging hinaus auf den Berg, zu beten, und verbrachte die Nacht im Gebete des Herrn“. Wenn nun aber er betete, der doch ohne Sünde war, wieviel mehr müssen dann die Sünder beten? Und wenn er die ganze Nacht hindurch ununterbrochen wachte und in beständigem Gebete flehte, wieviel mehr müssen dann wir in fleißigem Gebet die Nacht durchwachen?</p><p>Der Herr aber betete und flehte nicht für sich, — denn was hätte er, der Schuldlose, für sich erbitten sollen? — sondern für unsere Sünden. Das tut er auch selbst kund, indem er zu Petrus sagt: „Siehe, der Satan hat verlangt, euch zu sieben wie den Weizen, Ich aber habe für dich gebeten, daß dein Glaube nicht aufhöre„’. Und hernach legt er bei dem Vater Fürbitte ein für alle mit den Worten; „Ich bitte aber nicht für diese allein, sondern auch für jene, die durch ihr Wort an mich glauben werden, auf daß sie alle eins seien, gleichwie Du, Vater, in mir und ich in Dir, daß auch sie in uns seien“. So groß ist die Güte und zugleich die Liebe des Herrn um unseres Heiles willen, daß er sich nicht damit begnügte, uns durch sein Blut zu erlösen, sondern für uns auch überdies noch bat. Beachtet aber, wie sein sehnlichster Wunsch bei dieser Bitte dahin ging, es möchten ebenso, wie der Vater und der Sohn eins sind, auch wir in eben dieser Einheit verharren! So kann man auch daraus ersehen, wie schwer sich einer versündigt, der die Einheit und den Frieden zerreißt, wenn der Herr sogar dafür gebetet hat. Er wollte eben, daß sein Volk lebe, und er wußte, daß die Zwietracht nicht ins Reich Gottes gelangt.</p><p>Wenn wir aber dastehen und beten, geliebteste Brüder, so müssen wir wachsam und mit ganzem Herzen auf das Gebet bedacht sein. Jeder fleischliche und weltliche Gedanke sei dann ferne, und der Geist denke an nichts als allein an das, um was er betet! Deshalb schickt auch der Priester vor dem Gebet einige einleitende Worte voraus und bereitet die Herzen der Brüder vor, indem er sagt: „Die Herzen in die Höhe!“, damit die Gemeinde, die darauf antwortet: „Wir haben sie beim Herrn”, daran erinnert wird, daß sie an nichts anderes als an den Herrn denken darf. Verschließen soll sich das Herz gegen den Widersacher, Gott allein soll es offen stehen und dem Feinde Gottes in der Stunde des Gebets keinen Zutritt verstatten. Denn er schleicht sich gar häufig heran und drängt sich bei uns ein und lenkt durch schlauen Trug unser Gebet von Gott ab, so daß wir etwas anderes im Herzen haben als auf der Zunge. Und doch ist es nicht der Klang der Stimme, sondern Herz und Sinn, die den Herrn in lauterer Andacht anflehen sollen. Von welcher Lässigkeit aber zeugt es, durch ungehörige und sündige Gedanken sich ablenken und fesseln zu lassen, wenn man zum Herrn fleht, gleich als ob es etwas anderes gäbe, woran man mehr denken dürfte als an das, was man mit Gott spricht. Wie kannst du verlangen, daß Gott auf dich hört, wenn du selbst nicht auf dich hörst? Du willst, daß der Herr an dich denke, wenn du bittest, obwohl du selbst nicht an dich denkst? Das heißt alle Vorsicht vor dem Feinde außer acht lassen, das heißt beim Gebete zu Gott die göttliche Majestät durch die Nachlässigkeit im Beten beleidigen, das heißt mit den Augen wachen und mit dem Herzen schlafen; und doch soll der Christ selbst dann, wenn er mit den Augen schläft, mit dem Herzen wachen, wie geschrieben steht im Hohen Liede, wo die Kirche von sich sagt: „Ich schlafe und mein Herz wacht“. Deshalb mahnt uns der Apostel mit eindringlicher Vorsicht und sagt: „Oblieget dem Gebete und wachet darin”, indem er offenbar lehren und zeigen will, daß nur solche die Erfüllung ihrer Wünsche von Gott erlangen können, die Gott im Gebete wachen sieht.</p><p>Die Betenden aber sollen nicht mit unfruchtbaren und leeren Bitten zu Gott kommen. Unwirksam ist unser Flehen, wenn wir uns in fruchtlosem Gebet an Gott wenden. Denn da jeder Baum, der keine Frucht bringt, herausgehauen und ins Feuer geworfen wird, so können natürlich auch Worte, die keine Frucht tragen, Gottes Gnade nicht erwirken, weil sie nicht ergiebig sind an guten Werken. Und deshalb lehrt die göttliche Schrift und sagt: „Gut ist das Gebet mit Fasten und Almosen“. Denn er, der am Tage des Gerichtes die guten Werke und Almosen belohnen wird, leiht auch heute schon jedem ein gnädiges Ohr, der mit guten Werken zum Gebete kommt. So wurde ja auch dem Hauptmann Cornelius die Gnade zuteil, daß sein Gebet erhört wurde; denn „er spendete dem Volke viele Almosen und betete stets zu Gott”. Zu ihm trat um die neunte Stunde, während er betete, ein Engel, der ihm seine guten Werke bezeugte und sagte: „Cornelius, deine Gebete und deine Almosen sind emporgestiegen zum Gedächtnis vor Gott".</p><p>Schnell steigen die Gebete zu Gott empor, wenn sie durch das Verdienst unserer guten Werke vor Gott gebracht werden. So trat auch der Engel Raphael zu Tobias, der immerdar betete und stets Gutes tat, und sagte: „Die Werke Gottes zu enthüllen und zu bekennen, ist ehrenvoll. Denn als du mit Sarra betetest, brachte ich das Gedächtnis eures Gebetes vor das Angesicht der Herrlichkeit Gottes. Und da du die Toten in Einfalt begrubest und weil du nicht säumtest, aufzustehen und dein Mahl zu verlassen, sondern fortgingst und den Toten verbärgest, wurde ich gesandt, dich zu versuchen. Und wiederum hat mich Gott geschickt, dich zu heilen und Sarra, deine Schwiegertochter. Denn ich bin Raphael, einer von den sieben gerechten Engeln, die wir stehen und wandeln vor der Herrlichkeit Gottes„. Auch durch Isaias mahnt und lehrt der Herr, indem er Ähnliches bezeugt: „Löse“, sagt er, „jeden Knoten der Ungerechtigkeit, löse den erstickenden Zwang unmäßiger Forderungen, laß die Bedrängten in Ruhe und zerreiße jede ungerechte Verbriefung! Brich dem Hungrigen dein Brot und die obdachlosen Armen führe in dein Haus! Siehst du einen Nackten, so kleide ihn, und die Angehörigen deines Samens verachte nicht! Dann wird hervorbrechen dein Licht zur rechten Zeit, und deine Kleider werden eilends sich erheben, und vor dir hergehen wird die Gerechtigkeit, und die Herrlichkeit Gottes wird dich umgeben. Dann wirst du rufen, und Gott wird dich erhören. Während du noch sprichst, wird er sagen:.Siehe, da bin ich’„. Er verspricht da zu sein und versichert, diejenigen zu erhören und zu beschützen, die die Knoten der Ungerechtigkeit vom Herzen lösen und Almosen unter die Angehörigen Gottes nach seinen Geboten verteilen und die so ihrerseits verdienen, von Gott erhört zu werden, indem sie auf das hören, was Gott zu tun befiehlt. Als der selige Apostel Paulus in der schlimmen Zeit der Bedrängnis bei den Brüdern Unterstützung fand, da nannte er die guten Werke, die man verrichtet, Opfer für Gott. „Ich bin gesättigt“, sagt er, „indem ich von Epaphroditus das empfange, was von euch geschickt worden ist, einen lieblichen Geruch, ein angenehmes und Gott wohlgefälliges Opfer”. Denn wenn einer, der des Armen sich erbarmt, Gott auf Zinsen leiht, und einer, der den Geringsten gibt, Gott beschenkt, so opfert er damit Gott in geistlichem Sinne liebliche Wohlgerüche.</p><p>Was aber die Verrichtung der Gebete betrifft, so finden wir, daß Daniel und die drei Jünglinge, die im Glauben so stark und in der Gefangenschaft so siegreich blieben, die dritte, sechste und neunte Stunde eingehalten haben, offenbar im Hinblick auf das heilige Geheimnis der Dreieinigkeit, die in den letzten Zeiten geoffenbart werden sollte. Denn die erste bis zur dritten Stunde weist eine vollkommene Dreizahl auf; ebenso deutet der Zeitraum von der vierten bis zur sechsten Stunde eine zweite Dreizahl an, und auch mit den drei Stunden, die von der siebenten bis zur neunten verlaufen, ergibt sich wieder die volle Zahl drei. Diese Stundeneinteilung setzten die Anbeter Gottes schon vor langer Zeit in geistlicher Weise fest, und sie dienten ihm zu den für das Gebet bestimmten und verordneten Zeiten. Und wirklich wurde es nachmals offenbar, daß einst geheimnisvolle Beziehungen zugrunde lagen, wenn die Gerechten vordem gerade zu diesen Stunden beteten. Denn in der dritten Stunde senkte sich auf die Jünger der Heilige Geist herab, der die gnadenvolle Verheißung des Herrn erfüllte. Ebenso ward Petrus in der sechsten Stunde, als er oben auf das Dach hinaufstieg, durch ein Zeichen und zugleich durch die mahnende Stimme Gottes angewiesen, alle zur Gnade des Heils zuzulassen, da er vorher wegen der Reinigung der Heiden im Zweifel war. Und der Herr ward in der sechsten Stunde gekreuzigt und bis zur neunten Stunde wusch er unsere Sünden durch sein Blut rein und errang damals durch sein Leiden den vollen Sieg, um uns erlösen und zu neuem Leben erwecken zu können.</p><p>Für uns jedoch, geliebteste Brüder, sind außer den von alters her beobachteten Stunden jetzt nicht nur die Gebetszeiten zahlreicher geworden, sondern auch die geheimnisvollen Beziehungen des Betens haben sich vermehrt. Denn auch in der Frühe muß man beten, um die Auferstehung des Herrn in der Morgenandacht zu feiern. Das deutete einst der Heilige Geist in den Psalmen an mit den Worten: „Mein König und mein Gott, denn zu Dir will ich beten, mein Herr, in der Frühe. Und Du wirst meine Stimme hören; frühe will ich vor Dich treten und Dich ansehen“. Und abermals spricht der Herr durch den Mund des Propheten: „Mit dem dämmernden Morgen werden sie zu mir erwachen und sagen:,Laßt uns gehen und zurückkehren zu dem Herrn, unserem Gott!’” Ebenso hat man unbedingt wieder zu beten, wenn die Sonne untergeht und der Tag sich neigt; denn Christus ist die wahre Sonne und der wahre Tag. Wenn wir also beim Untergang der zeitlichen Sonne und beim Schwinden des zeitlichen Tages darum beten und bitten, das Licht möge von neuem über uns aufgehen, so flehen wir um die Ankunft Christi, die uns die Gnade des ewigen Lichtes bringen soll. Daß aber Christus mit dem Tag gemeint ist, das beweist der Heilige Geist in den Psalmen: „Der Stein“, sagt er, „den die Bauleute verworfen haben, der ist zum Eckstein geworden. Von dem Herrn ist er gemacht und ist wunderbar in unseren Augen. Dies ist der Tag, den der Herr gemacht hat; wollen wir uns freuen und fröhlich sein in ihm!”. Ebenso bezeugt von ihm der Prophet Malachias, daß er als die Sonne bezeichnet ist, indem er sagt: „Euch aber, die ihr den Namen des Herrn fürchtet, wird die Sonne der Gerechtigkeit aufgehen, und unter ihren Flügeln ist Heil". Wenn nun aber in den heiligen Schriften Christus die wahre Sonne und der wahre Tag ist, so dürfen die Christen keine Stunde vorübergehen lassen, ohne Gott fleißig und unablässig anzubeten. Deshalb sollen wir, die wir in Christus sind, das heißt: in der wahren Sonne und in dem wahren Tage, auch den ganzen Tag über dem Flehen und dem Gebete obliegen. Und wenn dem Weltgesetze folgend in stetem Wechsel die Nacht wiederkehrt und den Tag ablöst, so kann den Betenden auch die nächtliche Finsternis keinen Abbruch tun, weil es für die Kinder des Lichtes auch in der Nacht Tag ist. Denn wann wäre der ohne Licht, der das Licht im Herzen hat? Oder wann fehlte dem Sonne und Tag, für den Christus Sonne und Tag ist?</p><p>Wir aber, die stets in Christus, das heißt: im Lichte sind, wollen auch des Nachts nicht vom Gebete ablassen! So war die Witwe Anna in beständigem Beten und Wachen ohne Unterlaß bemüht, sich bei Gott Verdienste zu erwerben, wie im Evangelium geschrieben steht: „Sie wich nicht vom Tempel und diente Gott mit Fasten und Gebeten Tag und Nacht". Was kümmern uns die Heiden, die noch nicht erleuchtet sind, oder die Juden, die das Licht verlassen haben und in der Finsternis geblieben sind? Wir, geliebteste Brüder, die wir stets in dem Lichte des Herrn sind, die wir bedenken und festhalten, was wir seit dem Empfang der Gnade zu sein angefangen haben, wir wollen die Nacht als Tag betrachten! Wollen wir daran glauben, daß wir stets im Lichte wandeln, und uns nicht hindern lassen von der Finsternis, der wir entronnen sind! Die Stunden der Nacht dürfen unserem Flehen keine Störung bringen, Trägheit und Lässigkeit soll unseren Gebeten keinen Abbrach tun. Durch Gottes Gnade geistig neugeschaffen und wiedergeboren, wollen wir uns in dem üben, was wir sein werden! Da wir im Himmelreich, durch keine Nacht gestört, nur Tag haben werden, so laßt uns des Nachts ebenso wie am hellen Tage wachen; und da wir einst immerdar beten und Gott danken werden, so wollen wir auch hier unablässig beten und Dank sagen!</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Julius Baer, <em>Über das Gebet des Herrn</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-43/versions/uber-das-gebet-des-herrn-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "sgL9EHzT_Книга_о_благотворении_и_милостынях__Киприан_Карфагенский"
    path: "Cyprian_De_opere"
    title: "Über gute Werke und Almosen"
    menu: { parent: "Abhandlungen", title: "Über gute Werke und Almosen", priority: 10 }
    update: true
    body: |-
      <p><em>Über gute Werke und Almosen, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Zahlreich und groß, liebste Brüder, sind die göttlichen Wohltaten, in denen die reiche und überschwängliche Güte Gottes des Vaters und Christi sich zu unserem Heile wirksam erwiesen hat und noch stets erweist, indem zu unserer Erhaltung und Wiederbelebung der Vater seinen Sohn sandte, um uns erlösen zu können, und indem der Sohn gesandt sein und des Menschen Sohn heißen wollte, um uns zu Gottes Kindern zu machen. Er hat sich erniedrigt, um das Volk, das zuvor daniederlag, wieder emporzurichten, er ließ sich knechten, um die Geknechteten zur Freiheit zu führen, er erlitt den Tod, um den Sterblichen die Unsterblichkeit zu verleihen. Zahlreich und groß sind diese Gaben der göttlichen Barmherzigkeit. Aber was ist das erst für eine große Fürsorge und Güte, das für uns in heilsamer Weise Sorge getragen und für die Bewahrung des Menschen, der erlöst worden ist, noch ganz besondere Vorkehrung getroffen wird! Denn nachdem der Herr bei seiner Ankunft jene Wunden, die Adam getragen hatte, geheilt und das alte Gift der Schlange unschädlich gemacht hatte, gab er dem Geheilten ein Gesetz und gebot ihm, fernerhin nicht mehr zu sündigen, damit ihm, dem Sünder, nicht etwas Schlimmeres widerfahre. Eingezwängt waren wir und in die Enge getrieben durch die Vorschrift der Unsträflichkeit. Und die Schwäche und Ohnmacht der menschlichen Gebrechlichkeit wüsste sich nicht zu helfen, wenn nicht abermals die göttliche Liebe zur Hilfe käme und durch den Hinweis auf die Werke der Gerechtigkeit und Barmherzigkeit uns gewissermaßen einen Weg zur Sicherung des Heils eröffnete, um nachträglich all den Schmutz, mit dem wir uns bedecken, durch Almosen abzuwaschen.</p><p>In der Schrift spricht der Heilige Geist und sagt: „Durch Almosen und Treue werden die Vergehen gereinigt “. Natürlich nicht jene Vergehen, die vorher schon begangen waren; denn diese werden durch Christi Blut und Heiligung gereinigt. Ebenso sagt er wiederum: „Wie Wasser das Feuer löscht, so wird Almosen die Sünden auslöschen“. Auch hier wird gezeigt und bestätigt, dass ebenso, wie durch das Bad des heilbringenden Wassers das Feuer der Hölle gelöscht wird, durch Almosen und gerechte Werke auch die Flamme der Sünden sich ersticken lässt. Und weil schon einmal in der Taufe Vergebung der Sünden gewährt wird, so möge beständige und unablässige Mildtätigkeit geradeso wie die Taufe wiederum Gottes Gnade spenden. Dies lehrt auch der Herr im Evangelium. Denn als gegen seine Jünger der Vorwurf erhoben wurde, dass sie äßen, ohne vorher die Hände gewaschen zu haben, da antwortete er und sagt: „Wer geschaffen hat, was inwendig ist, hat auch geschaffen, was außen ist. Gebt vielmehr Almosen und seht, alles ist euch rein!“. Damit wollte er natürlich lehren und zeigen, dass man nicht die Hände, sondern das Herz waschen und dass man viel mehr inwendig als äußerlich den Schmutz beseitigen müsse, dass aber derjenige, der gereinigt habe, was inwendig ist, auch sein Äußeres gesäubert hat und damit der Reinigung des Herzens auch an Haut und Körper rein geworden ist. Indem er aber des Weiteren mahnte und zeigte, wodurch wir lauter und rein werden können, fügte er noch hinzu, man müsse Almosen spenden. Er, der Barmherzige, mahnt, Barmherzigkeit zu üben, und weil er die zu bewahren sucht, die er teuer erkauft hat, so lehrt er, dass diejenigen, die sich nach dem Empfang der Taufgnade wieder beschmutzt haben, von neuem gereinigt werden können.</p><p>Lasst uns also, geliebteste Brüder, das heilbringende Geschenk der göttlichen Gnade anerkennen, indem wir uns von unseren Sünden läutern und reinigen, und wollen wir, die wir doch nicht von jeder Wunde des Gewissens frei sein können, durch geistliche Heilmittel unsere Wunden heilen! Und keiner tue sich so viel zugute auf sein reines und unbeflecktes Herz, dass er im Vertrauen auf seine Unschuld sich einbildete, er brauche kein Heilmittel für seine Wunden anzuwenden; steht doch geschrieben: „Wer wird sich rühmen, dass er ein keusches Herz habe, oder wer wird sich rühmen, er sei rein von Sünden?“, und Johannes in seinem Briefe hinwiederum äußert sich in den Worten: „Wenn wir sagen, wir haben keine Sünde, so täuschen wir uns selbst, und die Wahrheit ist nicht in uns “: Kann aber niemand ohne Sünde sein und ist jeder, der sich für schuldlos erklärt, entweder hochmütig oder töricht, wie unentbehrlich, wie gnädig ist dann die göttliche Güte, die uns heilbringende Mittel zur abermaligen Pflege und Heilung der Wunden an die Hand gegeben hat, da sie weiß, dass es auch bei den Geheilten nachträglich ohne manche neue Wunden nicht abgeht!</p><p>Niemals, geliebteste Brüder, hat denn auch die göttliche Mahnung davon abgelassen und darauf verzichtet, in den heiligen Schriften, den alten wie den neuen, immer und überall Gottes Volk zu den Werken der Barmherzigkeit aufzurufen und durch die ermunternde Stimme des Heiligen Geistes jeden, der zur Hoffnung des Himmelreichs angewiesen wird, zum Almosengeben aufzufordern. Dem Isaias erteilt Gott den Auftrag und Befehl: “Rufe”, sagt er, “mit Macht und schone nicht! Wie eine Posaune erhebe deine Stimme und verkündige meinem Volke seine Sünden und dem Hause Jakob seine Missetaten!”. Und nachdem er ihnen ihre Sünden vorzuhalten geboten und im vollen Ungestüm seines Unmuts ihre Missetaten aufgedeckt und erklärt hatte, nicht einmal wenn sie zu Bitten und Gebeten und zu Fasten ihre Zuflucht nähmen, könnten sie für ihre Vergehen Genugtuung leisten, nicht einmal wenn sie in Sack und Asche sich wälzten, vermöchten sie Gottes Zorn zu besänftigen, da zeigte er trotzdem am Schlusse noch, dass Gott nur durch Almosen sich versöhnen lasse, und fügte die Worte hinzu: “Brich dem Hungrigen dein Brot und die obdachlosen Armen führe in dein Haus! Siehst du einen Nackten, so kleide ihn, und die Angehörigen deines Samens verachte nicht! Dann wird hervorbrechen dein Licht zur rechten Zeit, und deine Kleider werden eilends sich erheben, und vor dir hergehen wird die Gerechtigkeit, und die Herrlichkeit Gottes wird dich erhören. Während du noch sprichst, wird er sagen:”Siehe, da bin ich."</p><p>Die Mittel, Gott zu versöhnen, sind uns durch Gottes eigene Worte gegeben worden; was die Sünder tun sollen, haben die göttlichen Lehren gezeigt: dass man nämlich durch gerechte Werke Gott Genugtuung leistet, dass man durch die Verdienste der Barmherzigkeit sich von den Sünden reinigt. Auch bei Salomo lesen wir: „Verschließe das Almosen im Herzen des Armen, und es [das Almosen] wird für dich flehen um Schutz vor allem Übel! “ und wiederum: „Wer seine Ohren verstopft, um den Schwachen nicht zu hören, wird auch selbst Gott anrufen, und niemand wird da sein, der ihn erhöht“ Denn Gottes Barmherzigkeit wird sich einer nicht verdienen können, wenn er selbst nicht barmherzig gewesen ist, und ebenso wenig wird derjenige in seinen Gebeten von der göttlichen Liebe etwas erreichen, der auf die Bitte des Armen sich nicht liebreich erwiesen hat. Das zeigt und bestätigt auch in den Psalmen der Heilige Geist, indem er sagt: „Selig, wer auf den Dürftigen und Armen bedacht ist; in der schlimmen Zeit wird ihn befreien der Herr“. Dieser Gebote eingedenk hat Daniel, als der König Nabuchodonosor [Nebukadnezar] durch einen bösen Traum erschreckt und in Angst und Sorge war, zur Abwendung des Unheils ein Heilmittel gegeben, um die göttliche Hilfe zu erlangen, indem er sagte: „Deshalb möge dir, König, mein Rat gefallen: Kaufe deine Sünden los durch Almosen und deine Ungerechtigkeit durch Wohltaten an den Armen, und Gott wird geduldig sein gegenüber deinen Sünden!“ Da ihm aber der König nicht gehorchte, hatte er die Heimsuchungen und Drangsale, die er [im Träume] gesehen hatte, wirklich zu erdulden; all dem hätte er entfliehen und entrinnen können, wenn er sich durch Almosen von seinen Sünden losgekauft hätte. Auch der Engel Raphael bezeugt das Gleiche und mahnt dazu, gerne und reichlich Almosen zu geben, indem er sagt: „Gut ist das Gebet, verbunden mit Fasten und Almosen; denn das Almosen befreit vom Tode und reinigt selbst von Sünden“. Er zeigt, dass unsere Gebete und unser Fasten weniger vermögen, wenn sie nicht durch Almosen unterstützt werden, dass unser Flehen allein zu schwach ist, um Erhörung zu finden, wenn nicht gute Taten und Werke als entsprechende Verstärkung hinzukommen. So offenbart der Engel und bestätigt und bekräftigt, dass erst durch Almosen unsere Bitten wirksam werden, dass erst durch Almosen unser Leben aus den Gefahren erlöst, dass erst durch Almosen unsere Seele von Tode befreit wird.</p><p>Doch dies führen wir, geliebteste Brüder, nicht nur etwa so an, ohne den Ausspruch des Engels Raphael auch durch einen tatsächlichen Beweis zu bestätigen. In der Apostelgeschichte findet sich eine Beglaubigung durch die Tat, und dass durch Almosen die Seelen nicht nur von dem zweiten, sondern auch von dem ersten Tode befreit werden, das hat man aus der Bestätigung eines wirklich eingetretenen und vorgefallenen Ereignisses ersehen. Als Tabitha, die sich gerechten Werken und im Spenden von Almosen überaus eifrig gezeigt hatte, krank wurde und starb, da rief man Petrus zur Leiche der Entseelten. Und nachdem dieser in seiner echt apostolischen Liebe ungesäumt gekommen war, umringten ihn die Witwen unter Tränen und Bitten, indem sie die Mäntel und Röcke und die Kleidungsstücke, die sie früher von ihr bekommen hatten, ihm zeigten und für die Verstorbene nicht mit ihren Worten, sondern mit deren eigenen Werken Fürbitte einlegten. Petrus sah, dass etwas zu erlangen sei, dass in solcher Weise erbeten wurde, und dass die Hilfe Christi den flehenden Witwen nicht mangeln werde, da er ja selbst in den Witwen gekleidet worden sei. Als er deshalb auf den Knien liegend gebetet und als wirksamer Anwalt der Witwen und Armen die ihm aufgetragenen Bitten vor den Herrn gebracht hatte, da rief er, zu der Leiche gewandt, die bereits gewaschen auf der Bahre lag: „Tabitha, stehe auf im Namen Jesu Christi!“ Und er verfehlte nicht, dem Petrus sofort Hilfe zu bringen, er, der im Evangelium gesagt hatte, alles werde gewährt, was man in seinem Namen erbitte. Und so wird der Tod aufgehoben und der Geist zurückgegeben, und zur Verwunderung und zum Staunen aller wird der wiederbelebte Körper aufs Neue für dieses Licht der Welt beseelt. So viel vermochten die Verdienste der Barmherzigkeit, so viel wirkten die gerechten Werke. Sie, die den Not leidenden Witwen reiche Mittel zum Leben gespendet hatte, wurde zum Lohn dafür auf die Bitten der Witwen wieder ins Leben zurück gerufen.</p><p>Daher wird uns im Evangelium von dem Herrn, dem Lehrer unseres Lebens und dem Führer zum ewigen Heile, der das Volk der Gläubigen zu neuem Leben erweckt und für die Neubelebten auf die Ewigkeit bedacht ist, unter seinen göttlichen Geboten und himmlischen Lehren nichts häufiger eingeschärft und vorgeschrieben als das eine: wir sollten uns eifrig zeigen im Almosengeben und nicht an irdischem Besitz hängen, sondern vielmehr himmlische Schätze sammeln. “Verkaufet”, sagt er, “Eure Habe und gebt Almosen!” und wiederum: “Sammelt euch keine Schätze auf Erden, wo Motte und Rost sie verzehren und wo die Diebe nachgraben und stehlen! Sammelt euch aber Schätze im Himmel, wo weder Motte noch Rost sie verzehren und wo die Diebe nicht nachgraben [und stehlen]! Denn wo dein Schatz ist, dort wird auch dein Herz sein”. Und als er uns einen durch die Beobachtungen das Gesetzes Vollkommenen und Vollendeten vor Augen stellen wollte, sagte er: “Willst du vollkommen sein, so gehe hin und verkaufe all das Deinige und gib es den Armen, und du wirst einen Schatz im Himmel haben; und komm, folge mir nach! Ebenso sagt er an einer anderen Stelle, wer sich die himmlische Gnade erkaufen und das ewige Heil erwerben wolle, der müsse seine ganze Habe veräußern und die kostbare Perle, das heißt das durch Christi Blut so kostbare ewige Leben, von dem Betrage seinen Vermögens erstehen.”Das Himmelreich“, sagt er,”ist ähnlich einem Kaufmann, der gute Perlen suchte. Sobald er aber eine kostbare Perle gefunden hatte, ging der hin und verkaufte alles, was er hatte, und kaufte sie".</p><p>So nennt er ferner alle diejenigen auch Kinder Abrahams, die er mit der Unterstützung und Unterhaltung der Armen beschäftigt sieht. Denn als Zachäus sagte: „Siehe, die Hälfte meiner Habe gebe ich den Dürftigen, und wenn ich einen um etwas betrogen habe, so gebe ich das Vierfache zurück“, da antwortete Jesus: „Heute ist diesem Hause Heil widerfahren, weil auch dieser ein Sohn Abrahams ist“. Denn so gewiss „Abraham an Gott glaubte und ihm dies zur Gerechtigkeit angerechnet wurde“, so gewiss glaubt doch auch derjenige an Gott, der nach Gottes Gebot Almosen gibt; und wer den wahren Glauben hat, der bewahrt die Furcht Got-tes; wer aber die Furcht Gottes bewahrt, der denkt bei seiner Barmherzigkeit gegenüber den Armen an Gott. Denn er ist deshalb wohltätig, weil er an Gott glaubt, weil er weiß, dass all das wahr ist, was in Gottes Worten vorhergesagt wurde, und dass die Heilige Schrift nicht lügen kann, und dass die unfruchtbaren Bäume, das heißt die unnützen Menschen, herausgehauen und ins Feuer geworfen, die Barmherzigen aber zum Himmelreich berufen werden. Auch an einer anderen Stelle nennt er die Wohltätigen und Fruchtbaren seine Getreuen, während er den Unfruchtbaren und Unnützen die Treue abspricht mit den Worten: „Wenn ihr in dem ungerechten Mammon nicht treu gewesen seid, wer wird euch anvertrauen, was wahr ist? Und wenn ihr im Fremden nicht treu gewesen seid, wer wird euch das Eurige geben? “</p><p>Aber du besorgst und fürchtest, wenn du nun anfängst, reichlich Wohltaten zu üben, so könntest du vielleicht in Armut geraten, sobald dein Vermögen durch die freigebigen Spenden erschöpft ist. Sei nur in dieser Beziehung ohne Angst, sei ganz außer Sorge! Erschöpfen kann sich nicht etwas, was einem himmlischen Werke dient. Und das versichere ich dir nicht etwa nur aus persönlicher Überzeugung, sondern ich verspreche es dir auf Grund der Zuverlässigkeit der heiligen Schriften und der Glaubwürdigkeit der göttlichen Verheißung. Durch Salomos Mund spricht der Heilige Geist und sagt: „Wer den Armen gibt, wird niemals darben; wer aber sein Auge abwendet, wird in großer Not sein“. Damit zeigt er doch, dass die Barmherzigen und Wohltätigen nicht Mangel leiden können, dass vielmehr die Knauserigen und Unfruchtbaren nachmals in Not geraten. Ebenso sagt der selige Apostel Paulus, erfüllt von der Gnade der Eingebung des Herrn: „Wer Samen reicht dem Säenden, der wird auch Brot darbieten zum Essen und wird eure Saat vervielfältigen und wird das Wachstum der Früchte eurer Gerechtigkeit vermehren, auf dass ihr in allem reich werdet“. Und wiederum: „Die Erfüllung dieser Pflicht wird nicht das ersetzen, was dem Heiligen abgeht, sondern sie wird auch Überfluss haben durch die vielfache Dankerstattung bei dem Herrn“. Denn indem sich die Danksagung für unsere Almosen und guten Werke in dem Gebet der Armen an Gott wendet, häuft sich infolge der Wiedervergeltung Gottes das Vermögen des Wohltätigen immer mehr an. Und der Herr, der schon damals die Herzen derartiger Menschen kannte, bezeugt und sagt im Evangelium, indem er den Treulosen und Ungläubigen mit weissagender Stimme zuruft: „Denket und saget nicht: “Was werden wir essen, oder was werden wir trinken, oder womit werden wir uns kleiden?„ Denn danach trachten die Heiden. Euer Vater aber weiß, dass ihr alles dessen bedürftet. Trachtet zuerst nach dem Reiche und der Gerechtigkeit Gottes, und all dies wird euch zugeteilt werden!“. Denen, sagt er, werde alles zugeteilt und übergeben, die nach dem Reiche und der Gerechtigkeit Gottes trachten; denn wenn der Tag des Gerichts komme, so versichert der Herr, dann werden diejenigen zugelassen werden, um das Reich zu empfangen, die in seiner Kirche Gutes getan haben.</p><p>Du fürchtest, es könnte vielleicht dein Erbgut dahinschwinden, wenn du anfängst, davon reichlich Wohltätigkeit zu üben, und du Unseliger weißt nicht, dass nichts Geringeres als dein Leben und dein Heil dahinschwindet, während du das Versiegen deines Vermögens fürchtest? Und während du darauf bedacht bist, ja nicht etwa an deiner Habe Einbuße zu leiden, merkst du gar nicht, dass du an dir selbst Schaden nimmst, da du den Mammon mehr liebst als deine Seele; du merkst nicht, dass du um deines Vermögens willen selbst zugrunde gehst, während du fürchtest, du könntest um deinetwillen dein Vermögen zugrunde richten. Und deshalb ruft und sagt der Apostel mit Recht: Nichts haben wir in diese Welt hineingebracht, aber wir können auch nichts mit hinwegnehmen. Haben wir also Nahrung und Kleidung, so lasst uns damit zufrieden sein.„ Die aber reich werden sollen, fallen in Versuchung und Fallstricke und in viele schädliche Begierden, die den Menschen versenken in Verderben und Untergang. Denn die Wurzel aller Übel ist die Habsucht, und manche, die ihr nachhingen, haben im Glauben Schiffbruch gelitten und haben sich in viele Schmerzen gebracht“.</p><p>Du fürchtest, es könnte vielleicht dein Erbgut dahinschwinden, wenn du anfängst, davon reichlich Wohltätigkeit zu üben. Wann ist es denn schon vorgekommen, dass es dem Gerechten an den Mitteln zum Leben hätte gebrechen können? Steht doch geschrieben: „Der Herr wird die gerechte Seele nicht durch Hunger töten!“ Elias wird in der Wüste durch Raben gespeist, die ihm dienen, und als Daniel auf Befehl des Königs in die Löwengrube eingeschlossen ist, da wird ihm durch göttliche Fürsorge ein Mahl bereitet; und du fürchtest, es möchte dir, wenn du Gutes tust und dir bei dem Herrn Verdienste erwirbst, an Nahrung mangeln? Bezeugt und sagt er doch selbst zur Zurechtweisung der Zweifler und Kleingläubigen im Evangelium: „Seht die Vögel des Himmels an: sie säen nicht, sie ernten nicht, sie sammeln nicht in Scheunen, und euer himmlischer Vater nähret sie doch! Seid ihr denn nicht mehr als sie?“ Die Vögel speist Gott, und den Sperlingen wird ihre tägliche Nahrung zuteil, und auch denen, die keinen Sinn haben für etwas Göttliches, gebricht es weder an Trank noch an Speise: und du glaubst, es könne einem Christen, es könne einem Diener Gottes, du meinst, es werde einem, der sich in guten Werken eifrig zeigt, einem, der seinem Herrn teuer ist, an irgendetwas mangeln?</p><p>Oder hältst du es etwa für möglich, dass einer, der Christus speist, nicht auch selbst wieder von Christus gespeist wird, oder dass es denen an irdischen Gütern gebrechen werde, denen himmlische und göttliche zuteil werden? Woher dieser ungläubige Sinn, woher diese gottlosen und verwerflichen Gedanken? Was will im Hause des Glaubens ein ungläubiges Herz? Was nennt und heißt sich der einen Christen, der zu Christus nicht das geringste Vertrauen hat? Du verdienst ja vielmehr den Namen eines Pharisäers! Denn als der Herr im Evangelium von den Almosen sprach und uns die treue und heilsame Mahnung gab, wir sollten uns von dem irdischen Gewinn durch vorsorgliche Wohltätigkeit Freunde machen, die uns nachmals in die ewigen Wohnungen aufnähmen, da fügte danach am Schlusse die Heilige Schrift noch die Worte hinzu: „Es hörten aber dies alles die Pharisäer, die sehr habgierig waren, und sie verlachten ihn“. So sehen wir auch jetzt manche in der Kirche, deren verschlossene Ohren und verblendete Herzen von den geistlichen heilsamen Mahnungen keinen Lichtstrahl einlassen, bei ihnen darf man sich nicht darüber wundern, dass sie den Diener in seinen Predigten missachten, da wir ja schon sehen, dass diese Art von Leuten den Herrn selbst missachtet hat.</p><p>Darum gefällst du dir in diesen albernen und törichten Gedanken, als ob du nur durch die Furcht und Besorgnis um die Zukunft von guten Werken dich abhalten ließest? Warum schützest du sozusagen das verhüllende Blendwerk einer nichtigen Entschuldigung vor? Gestehe doch lieber die Wahrheit und enthülle die verborgenen Geheimnisse deines Herzens; denn die Kundigen kannst du doch nicht täuschen! Die Finsternis der Unfruchtbarkeit hat deinen Sinn umlagert, und während das Licht der Wahrheit daraus entwich, hat das dichte und undurchdringliche Dunkel des Geizes dein fleischliches Herz umnachtet. Ein Gefangener und Sklave deines Geldes bist du, mit den Ketten und Banden der Habsucht bist du gefesselt, und du, den Christus bereits erlöst hat, bist von neuem in Bande geschlagen. Du behütest dein Geld, das, wenn auch noch so gut von dir behütet, doch dich nicht behütet; du häufst dein Vermögen, das dich mit seiner Last nur erdrückt, aber du denkst nicht an die Antwort, die Gott dem Reichen gab, als er mit der Fülle einer überreichen Ernte in törichtem Jubel sich brüstete. „Du Tor“, sagte er, „in dieser Nacht wird deine Seele abgefordert! Wem wird nun gehören, was du bereitet hast?“ Warum brütest du allein über deinem Reichtum, warum türmst du dir selbst zur Pein die Masse deines Erbgutes immer höher auf, nur um vor Gott umso ärmer zu werden, je reicher du vor der Welt bist? Teile deine Einkünfte mit deinem Gott, lass Christus an deinem Gewinn teilnehmen, mache dir Christus zum Teilhaber an deinem Besitz, damit auch er dich zum Miterben seines himmlischen Reiches macht!</p><p>Du irrst und täuschest dich, wie jeder, der sich in der Welt für reich hält. Höre in der Offenbarung die Stimme deines Herrn, wie sie derartige Menschen mit berechtigten Vorwürfen zurechtweist! “Du sprichst”, heißt es dort, "ich bin reich und bin begütert und bedarf nichts: Und du weißt nicht, dass du elend bist und arm und blind und nackt! Ich rate dir, von mir im Feuer geläutertes Gold zu kaufen, damit du reich seiest, und ein weißes Gewand, damit du dich kleidest und an dir nicht die Hässlichkeit deiner Blöße offenbar werde, und mit Salbe bestreiche dei-ne Augen, damit du sehest! Wenn du also wohlhabend und reich bist, so kaufe dir von Christus im Feuer geläutertes Gold, damit dein Schmutz gleichsam durch Feuer ausgeschieden wird und du reines Gold sein kannst, wenn du durch Almosen und gerechte Werke dich läuterst! Kaufe dir ein weißes Gewand, damit du, der wie Adam nackt gewesen und vorher vor Hässlichkeit starrte, in das blinkende Gewand Christi dich kleidest! Und du, die du eine wohlhabende und reiche Matrone bist, salbe deine Augen nicht mit der Schminke des Teufels, sondern mit der Salbe Christi, damit du dazu gelangen kannst, Gott zu schauen, indem du dir durch deinen Wandel und deine Werke bei Gott Verdienste erwirbst!</p><p>Aber so, wie du bist, kannst du ja gar nicht in der Kirche Wohltätigkeit üben. Deine Augen, die mit schwarzer Schminke überstrichen, die in dunkle Nacht gehüllt sind, sehen ja gar nicht den Dürftigen und Armen. Wohlhabend und reich, wie du bist, glaubst du den Tag des Herrn zu feiern, obwohl du in das Haus des Herrn ohne Opfergabe kommst und obwohl du den Opferkasten gar nicht beachtest, obwohl du einen Teil von dem Opfer nimmst, das ein Armer dargebracht hat? Betrachte die Witwe im Evangelium, die, der himmlischen Gebote eingedenk, selbst inmitten ihrer Not und ihrer drückenden Armut sich wohltätig zeigte und in den Opferstock zwei Heller einwarf, die einzigen, die sie noch hatte! Als der Herr sie bemerkte und sah, da beurteilte er ihre Gabe nicht nach ihrem Vermögen, sondern nach ihrer Gesinnung, und sah nicht darauf, wie viel, sondern von wie vielem sie weggegeben hatte, und antwortete und sprach: „Wahrlich, ich sage euch: Diese Witwe hat mehr als alle in die Gottesgaben eingelegt. Denn diese alle haben von ihrem Überflusse in die Gottesgaben eingeworfen, sie aber hat von ihrer Armut den ganzen Lebensunterhalt, den sie hatte, eingelegt“. Welch hochseliges und ruhmvolles Weib, das sogar schon vor dem Tage des Gerichts sich würdig erwies, durch den Mund des Richters gepriesen zu werden! Schämen mögen sich die Reichen ihrer Unfruchtbarkeit und Unseligkeit! Eine Witwe, und noch dazu eine arme, wird wohltätig befunden, und während alle Gaben für die Waisen und Witwen bestimmt sind, gibt gerade sie, die doch hätte empfangen sollen. Daraus können wir entnehmen, welche Strafe den unfruchtbaren Reichen erwartet, nachdem nach diesem Vorbild sogar die Armen Wohltätigkeit üben sollen. Und damit wir erkennen, dass diese guten Werke Gott erwiesen werden und dass jeder, der sie tut, sich bei Gott Verdienste erwirbt, so nennt sie Christus „Gottesgaben“ und weist darauf hin, dass die Witwe in die Gottesgaben ihre zwei Scherflein eingelegt hat, damit es mehr und mehr an den Tag treten kann, dass jeder, der sich eines Armen erbarmt, sich Gott zum Schuldner macht.</p><p>Aber auch der Umstand, liebste Brüder, soll den Christen nicht von guten und gerechten Werken abhalten und abziehen, dass einer etwa glaubt, er könne sich mit der Rücksicht auf seine Kinder entschuldigen. Denn bei geistlichen Aufwendungen müssen wir an Christus denken, der sich als den [eigentlichen] Empfänger bekannt hat, und wir ziehen nicht unsere Mitknechte, sondern den Herrn unseren Kindern vor, wie er selbst lehrt und mahnt: “Wer Vater oder Mutter”, sagt er, “mehr liebt als mich, ist meiner nicht wert, und wer Sohn oder Tochter mehr liebt als mich, ist meiner nicht wert”. Auch im Deuteronomium steht zur Stärkung unseres Glaubens und unserer Liebe zu Gott das Gleiche geschrieben: “Diejenigen”, heißt es dort, “die zu Vater und Mutter sagen:”Ich kenne dich nicht" und ihre Kinder nicht anerkannt haben, diese haben Deine Gebote gehalten und Deinen Bund bewahrt“. Denn wenn wir Gott von ganzem Herzen lieben, dürfen wir weder unsere Eltern noch unsere Kinder Gott vorziehen. Schreibt doch auch Johannes in seinem Briefe, die Liebe Gottes sei nicht bei denen, die, wie wir sähen, gegen den Armen keine Barmherzigkeit üben wollten.”Wer Güter der Welt hat“, sagt er,”und seinen Bruder darben sieht und sein Herz verschließt, wie bleibt die Liebe Gottes in ihm? Denn wenn durch die Almosen an die Armen Gott unser Schuldner wird und wenn Christus der Empfänger ist, so oft man an die Geringsten gibt, so hat man keine Ursache, das Irdische dem Himmlischen vorzuziehen und das Menschliche über das Göttliche zu stellen.</p><p>Als so jene Witwe im dritten Buch der Könige, nachdem bei der Dürre und Hungernot alles aufgezehrt war, von dem wenigen Mehl und Öl, das noch geblieben, ein Aschenbrot gebacken hatte, nach dessen Genuss sie mit ihren Kindern sterben wollte, da kam Elias hinzu und bat sie, zuerst ihm zu essen zu geben und dann erst das, was noch übrig bleibe, selbst mit ihren Kindern zu verzehren. Und sie gehorchte ohne Bedenken, und trotz Hunger und Not gab sie, die Mutter, ihren Kindern doch nicht den Vorzug vor Elias. Nein, es geschieht vielmehr im Angesichte Gottes etwas, was Gott gefällt. Rasch und gerne wird das Erbetene dargereicht, und es wird nicht etwa nur ein Teil vom Überfluss, sondern trotz geringen Vorrats das Ganze hingegeben; und obwohl die eigenen Kinder hungern, wird der Fremde zuerst gespeist, und trotz Mangel und Hunger wird an das Essen nicht eher gedacht als an die Übung der Barmherzigkeit. So wird [in geistlicher Weise] die Seele gerettet, während bei dem heilbringenden Werke das Leben dem Fleische nach verachtet wird. Indem daher Elias, der Christi Gestalt an sich trägt, zeigte, dass dieser jedem nach seiner Barmherzigkeit wieder vergilt, antwortete er und sprach: „So spricht der Herr: Der Mehltopf wird nicht leer werden, und der Ölkrug wird nicht versiegen bis auf den Tag, an dem der Herr Regen geben wird über die Erde“. Nach der glaubwürdigen Versicherung der göttlichen Verheißung wurde der Witwe das, was sie gab, vielfältig und reichlich vergolten, und indem ihre gerechten Werke und die Verdienste ihrer Barmherzigkeit die reichsten Früchte trugen, füllten sich die Mehl- und Ölgefäße. Auch entzog nicht etwa die Muttern ihren Kindern das, was sie dem Elias gab, sondern sie wandte vielmehr ihren Kindern das zu, was sie gütigen und frommen Herzens tat. Und doch wusste sie noch nichts von Christus, hatte noch nicht seine Gebete vernommen, war nicht durch sein Kreuz und sein Leiden erlöst, sodass sie Speise und Trank nur für sein Blut hingegeben hätte. So geht also daraus hervor, wie schwer in der Kirche derjenige sich versündigt, der sich und seine Kinder über Christus stellt und seinen Reichtum behält, statt sein stattliches Vermögen mit der Armut der Dürftigen zu teilen.</p><p>Aber freilich, du hast viele Kinder im Hause, und nur die Größe deiner Familie hindert dich daran, in reichlichem Maße dich der guten Werke zu befleißigen. Doch gerade deshalb solltest du umso mehr Wohltätigkeit üben, weil du der Vater vieler Kinder bist. Umso mehr sind es, für die du den Herrn anflehen musst, die Sünden vieler gilt es zu sühnen, das Gewissen vieler zu reinigen, die Seelen vieler zu erlösen. Wie in diesem zeitlichen Leben die Ausgaben für die Ernährung und den Unterhalt der Kinder umso größer sind, je größer ihre Zahl ist, so muss auch im geistlichen und himmlischen Leben der Aufwand an guten Werken umso größer sein, je stattlicher die Schar der Liebsten ist. So brachte auch Job zahlreiche Opfer für seine Kinder dar, und so groß im Hause die Anzahl der Kinder war, so groß war auch die Zahl der Opfertiere, die Gott von ihm gespendet wurden. Und weil kein Tag vergeht, ohne dass man im Angesichte Gottes sündigte, so ließ er es auch nicht an täglichen Opfern fehlen, um durch sie die Sünden abwaschen zu können. Das bestätigt die Schrift mit den Worten: „Job, ein wahrhaftiger und gerechter Mann, hatte sieben Söhne und drei Töchter, und er reinigte sie, indem er für sie Gott Opfer darbrachte nach ihrer Anzahl und für ihre Sünden ein Kalb“. Wenn du also deine Kinder wahrhaftig liebst, wenn du ihnen die volle, süße Innigkeit der väterlichen Lie-be entgegenbringst, dann musst du umso mehr Gutes tun, um deine Kinder durch deine gerechten Werke Gott zu empfehlen.</p><p>Sieh auch nicht den wirklichen Vater für deine Kinder in einem Menschen, der der Zeit unterworfen und schwach ist, sondern gib ihnen einen Vater in dem, der ein ewiger und starker Vater seiner geistlichen Kinder ist! Ihm überantworte deine Habe, die du jetzt für deine Erben auf bewahrst, er sei deinen Kindern der Vormund, er der Verwalter, er kraft seiner göttlichen Herrlichkeit ihr Beschützer gegen alle Unbilden der Welt! Das Vermögen, das man Gott anvertraut, reißt weder der Staat an sich, noch vergreift sich an ihm der Fiskus, noch wird es durch irgendwelche gerichtlichen Schikanen zerrüttet. Sicher ist das Erbe angelegt, das unter Gottes Obhut ruht. Das heißt auf die Zukunft seiner treuen Lieblinge bedacht sein, das heißt für die künftigen Erben mit väterlicher Liebe sorgen nach der Versicherung der Heiligen Schrift, die da sagt: “Jung bin ich gewesen und bin alt geworden, und ich habe noch keinen Gerechten verlassen gesehen noch seinen Samen Brot suchen. Den ganzen Tag ist er barmherzig und leiht weg, und sein Same wird gesegnet sein, und wiederum:”Wer ohne Tadel in Gerechtigkeit wandelt, wird glückliche Kinder hinterlassen". Ein pflichtvergessener und verräterischer Vater bist du demnach, wenn du nicht getreulich für deine Kinder sorgst, wenn du nicht in gewissenhafter und wahrer Liebe auf ihre Erhaltung dein Augenmerk richtest. Warum trachtest du mehr nach irdischem als nach himmlischem Gut und willst deine Kinder lieber dem Teufel als Christus empfehlen? Zweimal vergehst du dich, einmal, weil du deinen Kindern nicht die Hilfe Gottes des Vaters verschaffst, und dann, weil du deine Kinder lehrst, das Vermögen mehr zu lieben als Christus.</p><p>Sei lieber deinen Kindern ein solcher Vater, wie Tobias es war! Gib deinen Lieben nützliche und heilsame Lehren, wie er sie seinem Sohne gab, schärfe deinen Kindern ein, was auch er [seinem Sohne] einschärfte, indem er sagte: “Und jetzt, mein Sohn, trage ich euch auf: dienet Gott in der Wahrheit und tut vor ihm, was ihm gefällt! Und euren Kindern tragt auf, dass sie Gerechtigkeit üben und Almosen geben und Gottes gedenken und seinen Namen preisen jederzeit!” Und wiederum: "Alle Tage deines Lebens, mein Sohn, habe Gott im Herzen und übertritt nicht seine Gebote! Übe Gerechtigkeit alle Tage deines Lebens und wandle nicht den Weg der Ungerechtigkeit! Denn wenn du nach der Wahrheit handelst, so wird Rücksicht genommen werden auf deine Werke. Von deinem Vermögen spende Almosen und wende dein Antlitz nicht ab von irgendeinem Armen! So wird es geschehen, dass auch von dir sich Gottes Antlitz nicht abwendet. Je nachdem du hast, mein Sohn, so tue! Hast du ein stattliches Vermögen, so gib davon umso mehr Almosen; hast du wenig, so teile selbst von diesem Wenigen mit! Und sei ohne Furcht, wenn du Almosen spendest: einen guten Lohn legst du dir zurück auf den Tag der Not, weil das Almosengeben vom Tode befreit und nicht in die Finsternis kommen lässt. Eine gute Spende ist das Almosen für alle, die es geben vor dem höchsten Gott.</p><p>Welch herrliche Festspende ist es, deren Veranstaltung unter Gottes Au-gen begangen ist! Wenn es bei einem Schauspiel der Heiden als etwas Großes und Rühmliches erscheint, dass Prokonsuln oder Imperatoren als Festteilnehmer zugegen sind, und wenn dann die Pracht und der Aufwand von Seiten der Spender des Festes umso größer ist, um ja den Beifall der Großen finden zu können, wie viel herrlicher und größer ist da erst der Ruhm bei einer Spende, wenn man Gott und Christus als Zuschauer hat! Wie viel umfassendere Zurüstungen gilt es hier zu treffen, ein wie viel reicherer Aufwand ist hier erforderlich, wo die Mächte [Heerscharen] des Himmels herbeikommen, um zuzusehen, wo alle Engel sich einfinden, wo es sich für den Spender nicht um ein Viergespann oder um die Konsulwürde handelt, sondern um die Verleihung des ewigen Lebens, wo man nicht nach der eitlen und rasch wandelbaren Gunst des Volkes hascht, sondern den ewigen Lohn des himmlischen Reiches empfängt.</p><p>Und damit die Trägen und Unfruchtbaren, die in ihrer Geldgier sich nicht im Geringsten durch gute Werke um die Frucht des Heils bemühen, umso mehr erröten, damit die Scham über ihre eigene Schande und Schmach ihr unreines Gewissen noch schwerer trifft, so stelle sich jeder einzelne den Satan vor Augen, wie er mit seinen Dienern, das heißt mit dem Volke des Verderbens und des Todes, in die Mitte hervorstürzt und die Gemeinde Christi, während dieser selbst als Richter zugegen ist, zu vergleichender Prüfung herausfordert, indem er sagt: „Ich habe für diese hier, die du bei mir siehst, weder Backenstreiche empfangen noch Geißelhiebe zu spüren bekommen noch das Kreuz getragen noch mein Blut vergossen noch auch meine Angehörigen um den Preis meines Leidens und Blutes erkauft. Ja, ich verheiße ihnen nicht einmal das himmlische Reich, noch auch rufe ich sie durch Wiederverleihung der Unsterblichkeit von neuem ins Paradies zurück; und dennoch: Welch kostbare, welch herrliche, mit welch gewaltiger und langwieriger Mühe vorbereitete Schauspiele sind es, die sie mir mit dem kostspieligsten Aufwand bereiten, indem sie Hab und Gut für die Ausstattung des Schauspiels entweder verpfänden oder verkaufen! Und fällt dann die Aufführung nicht ehrenvoll aus, so werden sie unter Hohnrufen und Zischen hinausgeworfen und von der Volkswut manchmal fast gesteinigt. Zeige mir du, Christus, unter den Deinigen solche Festspender, zeige mir jene Reichen, jene Wohlhabenden, die im Überfluss schwelgen, ob sie in der Kirche unter deinem Vorsitz und vor deinen Augen ein derartiges Schauspiel bieten, indem sie ihre Habe verpfänden oder veräußern oder sie vielmehr zu den himmlischen Schätzen legen und so ihren Besitz gegen Besseres vertauschen! Bei diesen meinen vergänglichen und irdischen Schauspielen wird niemand gespeist, niemand gekleidet, niemand durch den Trost irgendeiner Speise oder eines Trankes aufgerichtet. Inmitten der Verblendung des Festgebers und der Verirrung des Zuschauers geht alles in der verschwenderischen und törichten Nichtigkeit trügerischer Lustbarkeiten zugrunde. Dort in deinen Armen wirst du gekleidet und gespeist, du versprichst den Wohltätigen das ewige Leben; und dennoch lassen sich die Deinigen, die du mit göttlichen Belohnung und himmlischen Gaben auszeichnest, kaum mit den Meinigen vergleichen, die doch dem Verderben geweiht sind“.</p><p>Was erwidern wir auf diese Worte, liebste Brüder? Mit welchen Gründen verteidigen, mit welcher Entschuldigung rechtfertigen wir die gottlose Unfruchtbarkeit [an guten Werken] und den sozusagen in finstere Nacht gehüllten Sinn der Reichen, wir, die wir hinter den Dienern des Satans zurückstehen und gegenüber Christus für den Preis seines Leidens und Blutes nicht einmal im Kleinen Vergeltung üben? Gebote hat er uns gegeben, er hat uns gelehrt, was seine Diener tun sollen, indem er den Wohltätigen Belohnung verhieß und den Unfruchtbaren Strafe androhte, hat er sein Urteil kundgegeben; wie er richten werde, hat er vorhergesagt. Wie kann es da eine Entschuldigung geben für den Saumseligen, wie eine Verteidigung für den Unfruchtbaren? Wenn der Knecht nicht tut, was ihm befohlen, dann wird eben der Herr tun, was er androht. Er sagt ja auch: “Wenn der Sohn des Menschen kommen wird in seiner Herrlichkeit und alle Engel mit ihm, dann wird er sitzen auf dem Throne seiner Herrlichkeit, und es werden vor ihm versammelt werden alle Völker, und er wird sie voneinander scheiden, wie der Hirte die Schafe scheidet von den Böcken; und er wird die Schafe stellen zu seiner Rechten, die Böcke aber zur Linken. Dann wird der König zu denen sagen, die zu seiner Rechten sind:” Kommt, ihr Gesegneten meines Vater; empfanget das Reich, das euch bereitet ist von Anbeginn der Welt! Denn ich bin hungrig gewesen, und ihr habt mir zu essen gegeben, ich bin durstig gewesen, und ihr habt mich getränkt, ich bin ein Fremdling gewesen, und ihr habt mich beherbergt, ich bin nackt gewesen, und ihr habt mich bekleidet, ich bin krank geworden, und ihr habt mich besucht, ich bin im Gefängnis gewesen, und ihr seid zu mir gekommen" Dann werden ihm die Gerechten antworten und sagen: “Herr, wann haben wir Dich hungrig gesehen und haben Dich gespeist, durstig und haben Dich getränkt? Wann haben wir Dich als Fremdling gesehen und haben Dich beherbergt, nackt und haben Dich gekleidet? Wann ferner haben wir Dich krank oder im Gefängnis gesehen und sind zu Dir gekommen?” Dann wird der König ihnen antworten und sagen: “Wahrlich, ich sage euch: soweit ihr es einem unter diesen meinen geringsten Brüdern getan hat, habt ihr es mir getan. Dann wird er zu denen sagen, die zu seiner Linken sind:”Weichet von mir, ihr Veruchten, ins ewige Feuer, das mein Vater bereitet hat dem Teufel und seinen Engeln! Denn ich habe gehungert, und ihr habt mir nicht zu essen gegeben, ich habe gedürstet und ihr habt mich nicht getränkt, ich ein Fremdling gewesen, und ihr habt mich nicht beherbergt, ich bin nackt gewesen, und ihr habt mich nicht gekleidet, ich bin krank und im Gefängnis gewesen, und ihr seid nicht zu mir gekommen." Dann werden auch sie antworten und sagen. “Herr, wann haben wir Dich hungrig oder durstig oder als Fremdling oder nackt oder krank oder im Gefängnis gesehen und haben Dir nicht gedient?” und er wird ihnen antworten: “Wahrlich, ich sage euch: soweit ihr es nicht einem unter diesen Geringsten getan hat, habt ihr es auch mir nicht getan.” Und diese werden hingehen in das ewige Feuer, die Gerechten aber in das ewige Leben". Was hätte uns Christus Größeres verkünden, wie hätte er uns eindringlicher zu den Werken der Gerechtigkeit und Barmherzigkeit anregen können als dadurch, dass er erklärte, man kränke ihn, wenn man einem Dürftigen und Armen nicht spendet. So soll derjenige, der sich durch die Rücksicht auf den Bruder in der Kirche nicht bewegen lässt, wenigstens durch den Hinblick auf Christus sich bestimmen lassen, und wer an seinen Mitknecht trotz Not und Armut nicht denkt, wenigstens des Herrn gedenken, der in eben dem Armen verkörpert ist, den er verachtet.</p><p>Und somit, liebste Brüder, deren Furcht Gott zugewandt ist, deren Geist die Welt verachtet und verschmäht und bereits zu dem Himmlischen und Göttlichen emporgerichtet ist, wollen wir versuchen, in vollem Glauben, mit gottergebenem Sinn und in beständigem Wohltun uns bei Gott Verdienste zu erwerben und ihm unseren Gehorsam zu bezeugen! Lasst uns Christus unsere irdischen Kleider geben, um himmlische Gewänder dafür zu empfangen! Lasst uns ihm zeitliche Speise und zeitlichen Trank spenden, um dafür mit Abraham und Isaak und Jakob zum himmlischen Mahle zu gelangen! Um nicht zu wenig zu ernten, lasst uns nur recht viel säen! Für unsere ewige Sicherheit und Wohlfahrt lasst uns sorgen, solange es noch Zeit ist, nach der Mahnung und den Worten des Apostels Paulus: „Lasst uns daher, solange wir Zeit haben, Gutes tun an allen, am meisten aber an den Genossen des Glaubens! Lasst uns aber nicht müde werden, Gutes zu tun, denn seinerzeit werden wir ernten!“</p><p>Bedenken wir nur, geliebteste Brüder, was zur Zeit der Apostel das Volk der Gläubigen geleistet hat, als gerade in den Anfängen das Herz noch in größeren Tugenden sich lebendig zeigte, als der Glaube der Frommen noch in frischer Glaubenswärme glühte! Sie verkauften damals Haus und Hof und gaben den Erlös gern und freigiebig zur Verteilung unter die Armen den Aposteln hin, indem sie nach dem Verkauf und der Veräußerung ihres irdischen Besitzers ihre Güter dorthin verlegten, wo sie Früchte ewigen Besitzes ernten, indem sie sich dort Häuser erwarben, wo sie für immer Wohnung nehmen sollten. Ebenso groß wie die Eintracht in der Liebe war damals der Reichtum an guten Werken, wie wir in der Apostelgeschichte lesen: „Die Schar derer aber, die gläubig geworden waren, lebte eines Herzens und eines Sinnes, und es gab keinen Unterschied unter ihnen, und sie hielten nichts von den Gütern, die sie besaßen, für ihr Eigentum, sondern es war ihnen alles gemeinsam“. Das heißt kraft der geistlichen Geburt in Wahrheit ein Kind Gottes werden, das heißt nach dem himmlischen Gesetze das gleichheitliche Verfahren Gottes des Vaters nachahmen. Denn alles, was von Gott kommt, dient uns allen gemeinsam zu Gebrauche, und niemand ist von seinen Wohltaten und Gaben ausgeschlossen, sondern das ganze Menschengeschlecht hat sich der göttlichen Güte und Freigebigkeit in gleicher Weise zu erfreuen. So leuchtet der Tag, so strahlt die Sonne, so strömt der Regen, so weht der Wind für alle ohne Unterschied, die Schlafenden haben einen und denselben Schlummer, und der Glanz der Sterne und des Mondes leuchtet allen gemeinsam. Der Besitzer also, der auf Erden nach diesem Vorbild der Gleichheitlichkeit seine Einkünfte und Erträgnisse mit seinen Brüdern teilt, ahmt Gott den Vater nach, indem er in seinen freiwilligen Spenden die Gleichheit wahrt und Gerechtigkeit übt.</p><p>Was wird das, liebste Brüder, für eine Herrlichkeit sein für die Wohltätien, welch große und erhabene Freude, wenn der Herr damit beginnen wird, sein Volk zu mustern, unseren Verdiensten und guten Werken die verheißenen Belohnungen zuzuweisen und für das Irdische Himmlisches, für das Zeitliche Ewiges, für das Kleine Großes zu gewähren, wenn er beginnt, uns dem Vater darzustellen, dem er uns durch seine Heiligkeit wiedergegeben, die Ewigkeit und die Unsterblichkeit uns zu spenden, die er für uns durch sein Leben spendendes Blut wiedergewonnen hat, uns von neuem zum Paradies zurückzuführen und nach der Gewissheit und der Wahrheit seiner Verheißung uns das Himmelreich zu eröffnen. Dies lasst fest in unserem Sinne haften, dies lasst uns mit vollem Glauben erkennen, dies von ganzem Herzen lieben, dies durch hochherziges, unablässiges Wohltun erkaufen! Etwas Herrliches und Göttliches, liebste Brüder, ist heilbringende Wohltätigkeit, ein starker Trost der Gläubigen, ein heilsamer Hort unserer Sicherheit, ein Bollwerk der Hoffnung, ein Schutz des Glaubens, ein Heilmittel gegen die Sünde; eine Sache, die ganz in der Macht des Einzelnen steht, eine Sache, erhaben und doch leicht zugleich, frei von der Gefahr der Verfolgung, die Krone des Friedens, der wahre und größte Gottesdienst, notwendig für die Schwachen, ruhmvoll für die Starken, ein Gottesdienst, mit dessen Hilfe der Christ die geistliche Gnade erlangt, mit dem er Christus als huldvollen Richter gewinnt und Gott zu seinem Schuldner macht. Nach dieser Palme heilsamer Werke lasst uns gerne und willig streben, bei dem Wettkampf in der Gerechtigkeit unter den Augen Gottes und Christi wollen wir alle als Läufer teilnehmen und uns in unserem Lauf durch keine zeitliche und weltlich Begierde hemmen lassen, nachdem wir bereits angefangen haben, über Zeit und Welt erhaben zu sein! Wenn uns der Tag der Vergeltung oder der Verfolgung gerüstet, wenn er uns behend, wenn er uns als Läufer bei diesem Wettkampf in gu-ten Werken findet, dann wird es der Herr auf keinen Fall unseren Verdiensten am Lohne fehlen lassen. Im Frieden wird er den Siegern für ihre guten Werke die weiße Krone verleihen, in der Verfolgung aber wird er ihnen für ihr Leiden die purpurne [Krone] noch dazu reichen.</p>
