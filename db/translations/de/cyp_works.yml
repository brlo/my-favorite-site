    path: "Cyprian_De_zelo"
    title: "Über Eifersucht und Neid"
    menu: { parent: "Abhandlungen", title: "Über Eifersucht und Neid", priority: 12 }
    update: true
    body: |-
      <p><em>Über Eifersucht und Neid, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Eifersüchtig zu sein auf das Gute, das man sieht, und die Besseren zu beneiden, erscheint manchen nur als ein leichtes und geringes Vergehen, geliebteste Brüder, und indem man es nur für leicht und gering hält, fürchtet man es nicht, indem man es nicht fürchtet, achtet man nicht darauf, indem man nicht darauf achtet, läßt es sich nur schwer meiden, und so entsteht daraus ein verborgenes und verstecktes Unheil, das die unvorsichtigen Herzen unvermerkt zugrunde richtet; denn man durchschaut es zu wenig, als daß man sich vorsichtig davor hüten könnte. Nun hat doch aber der Herr uns befohlen, klug zu sein, und uns eingeschärft, mit ängstlicher Sorge zu wachen, damit nicht unser Widersacher, der selbst stets wachsam ist und beständig lauert, die Funken zum Brand entfache, sobald er in die Brust sich eingeschlichen hat, damit er nicht aus Kleinem Großes mächtig aufhäufe und durch Sturm und Wetter, die er erregt, den Zusammensturz des Glaubens und des Heiles und den Schiffbruch des Lebens herbeiführe, indem er die Lässigen und Arglosen mit milderem Hauch und sanfterem Wehen umschmeichelt. Auf der Hut zu sein, gilt es also, geliebteste Brüder, und mit allen Kräften darauf hinzuarbeiten, daß wir dem wütenten Feinde, der seine Geschosse gegen alle Teile unseres Körpers richtet, an denen wir zu treffen und zu verwunden sind, mit sorgsamer und unermüdlicher Wachsamkeit Widerstand leisten, wie der Apostel Petrus in seinem Briefe mahnt und lehrt mit den Worten: „Seid nüchtern und wachet; denn euer Widersacher, der Teufel, geht umher wie ein brüllender Löwe und sucht etwas zu verschlingen!"</p><p>Er schleicht um jeden, von uns herum, und wie ein Feind, der die wohlverwahrten Mauern [einer Stadt] belagert, forscht und sucht er, ob nicht vielleicht irgendein Teil unserer Glieder weniger stark und weniger zuverlässig ist, um hier Zugang zu finden und ins Innere einzudringen. Unseren Augen bietet er verführerische Bilder und lockende Genüsse dar, um durch ihren Anblick die Keuschheit zu zerstören. Die Ohren bezaubert er durch liebliche Musik, um durch das Anhören der allzu süßen Töne den starken christlichen Sinn zu entkräften und zu verweichlichen. Die Zunge reizt er durch Beschimpfung, die Hand treibt er durch herausfordernde Kränkungen zu unbedachtem Mord an. Um den Menschen zum Betrüger zu machen, stellt er ihm ungerechten Gewinn in Aussicht, um seine Seele durch Geld zu berücken, überhäuft er ihn mit unheilvollen Schätzen. Irdische Ehren verheißt er ihm, um ihm die himmlischen zu rauben. Er spiegelt ihm Falsches vor, um ihm unvermerkt die Wahrheit zu entziehen, und wenn er nicht heimlich täuschen kann, dann droht er ganz frei und offen, indem er den Schrecken stürmischer Verfolgung schickt, stets voll Unruhe und Feindschaft darauf bedacht, die Diener Gottes zu bekriegen, voll Tücke im Frieden, voll Gewalttätigkeit in der Verfolgung.</p><p>Deshalb, geliebteste Brüder, muß gegen alle tückischen Nachstellungen oder offenen Drohungen des Teufels der Geist wohlgerüstet und bewaffnet dastehen, stets zum Widerstand ebenso bereit, wie der Feind allezeit zum Angriff entschlossen ist. Und weil diejenigen seiner Geschosse häufiger sind, die unvermerkt eindringen, und infolge der mehr verborgenen und heimlichen Beschießung um so schwerer und häufiger uns treffen und verwunden, je weniger man sie bemerkt, so laßt uns wachen, um auch sie wahrzunehmen und abzuwehren! Zu ihnen gehört das Laster der Eifersucht und des Neides. Denn wenn einer dieses Übel genau besieht, so wird er finden, daß ein Christ vor nichts sich mehr hüten, vor nichts sich sorgfältiger vorsehen muß als davor, daß ihn etwa Mißgunst und Neid bestricke und daß er in die verborgenen Schlingen des trügerischen Feindes verwickelt, ohne es selbst zu merken, durch sein eigenes Schwert falle, indem er aus Eifersucht sich zum Haß gegen den eigenen Bruder verleiten läßt. Um dies vollständiger überblicken und deutlicher einsehen zu können, wollen wir auf die Quelle und den Ursprung dieses Übels zurückgehen! Sehen wir zu, wo, wann und wie die Eifersucht ihren Anfang genommen hat! Denn ein so verderbliches Laster wird für uns leichter zu meiden sein, wenn man den Ursprung sowie die Größe eben dieses Übels kennen lernt.</p><p>Nur dieses Laster ist der Grund, daß gleich zu Anbeginn der Welt der Satan selbst ins Verderben geriet und auch andere mit sich riß. Nachdem er, der sich seiner Hoheit als Engel rühmen konnte, er, der Gott lieb und wert gewesen, den Menschen nach Gottes Bild geschaffen sah, da brach er voll gehässigen Neides in Eifersucht aus. Dabei brachte er jedoch den anderen, von Eifersucht getrieben, nicht eher zu Fall, als bis er selbst zuvor durch Eifersucht gestürzt war; er wurde selbst gefangen, bevor er gefangen nahm, er ging selbst zugrunde, bevor er andere zugrunde richtete, und während er, vom Neid angestachelt, dem Menschen die Gnade der ihm verliehenen Unsterblichkeit entriß, verlor er auch selbst all das, was er ehedem gewesen war. Wie groß muß ein Übel sein, geliebteste Brüder, durch das ein Engel zu Fall kam, durch das jene hohe und herrliche Erhabenheit umgarnt und gestürzt werden konnte, durch das der Betrüger selbst betrogen wurde! Seitdem wütet die Mißgunst auf Erden, indem jeder, der durch den Neid dem Verderben geweiht ist, dem Lehrmeister des Verderbens willig folgt, indem jeder, der Eifersucht hegt, den Teufel nachahmt, wie geschrieben steht: „Durch den Neid des Teufels aber ist der Tod in die Welt gekommen. Ihn also ahmen alle nach, die auf seiner Seite stehen".</p><p>Nur daraus entsprang auch der erste Haß unter den neuen Brüdern, daraus der ruchlose Brudermord, indem der ungerechte Kain eifersüchtig wurde auf den gerechten Abel, indem der Böse den Guten voll Mißgunst und Neid verfolgte. Mit solcher Macht trieb die Wut der Eifersucht zur Vollendung der Untat, daß weder die Bruderliebe noch die Entsetzlichkeit des Verbrechens, weder die Furcht Gottes noch die Strafe für das Vergehen bedacht wurde. Gegen alles Recht wurde der erschlagen, der als erster Gerechtigkeit an den Tag gelegt hatte; Haß mußte der erdulden, der den Haß nicht kannte; in gottloser Weise wurde der ermordet, der selbst beim Tode keinen Widerstand leistete. Und auch daran, daß Esau mit seinem Bruder Jakob sich verfeindete, war nur Eifersucht schuld. Denn weil der eine den Segen des Vaters empfangen hatte, entbrannte durch die Flammen des Neides in dem anderen der Grimm der Verfolgung. Auch wenn Joseph von seinen eigenen Brüdern verkauft wurde, so ist der Grund für den Verkauf nur in der Eifersucht zu suchen. Denn nachdem er das Glück, das ihm in Traumerscheinungen verheißen worden war, ganz offen und ehrlich als Bruder seinen Brüdern kundgetan hatte, da verfiel ihr übelwollendes Herz dem Neide. Und daß König Saul den David haßte, daß er in oft wiederholten Verfolgungen den Unschuldigen, den Barmherzigen, den in milder Sanftmut Geduldigen zu töten wünschte, was trieb ihn anderes dazu an als der Stachel der Eifersucht? Nur weil das Volk voll Bewunderung mit rühmendem Beifall in Lobeserhebungen auf David sich erging, als er Goliath getötet und mit Gottes Hilfe und Gnade den mächtigen Feind vernichtet hatte, steigerte sich Sauls Neid darüber zu wütender Feindschaft und Verfolgung. Und um mich nicht zu lange mit der Aufzählung von Einzelbeispielen aufzuhalten, laßt uns nur den Untergang eines ganzen Volkes betrachten, das mit einem Male dem Verderben geweiht war! Sind die Juden nicht deshalb zugrunde gegangen, weil sie lieber Christus mit Neid verfolgen als an ihn glauben wollten? Indem sie die großen Wundertaten, die er vollbrachte, herabzusetzen suchten, ließen sie sich von blinder Eifersucht betören und vermochten nicht die Augen ihres Herzens zu öffnen, um das Göttliche zu erkennen.</p><p>In dieser Erwägung nun, geliebteste Brüder, laßt uns gegen dieses so verderbliche Übel wachsam und mutig unser Gott geweihtes Herz sichern! Möge der Tod anderer zu unserem Heile dienen, möge die Strafe der Unachtsamen die Vorsichtigen unversehrt erhalten! Niemand darf aber etwa glauben, dieses Übel beschränke sich nur auf eine Erscheinungsform oder es sei nur auf einen kleinen Raum und in enge Grenzen eingeschlossen. Nein, weithin erstreckt sich das vielgestaltige und verhängnisvolle Verderben der Eifersucht. Sie ist die Wurzel aller Übel, die Quelle alles Unheils, die Pflanzschule der Verbrechen und der Zündstoff zu Sünden. Aus ihr erhebt sich der Haß, aus ihr entspringt der Zorn. Zur Habsucht entflammt die Eifersucht, indem man mit dem Seinigen sich nicht mehr zu begnügen vermag, wenn man einen anderen sieht, der reicher ist. Den Ehrgeiz erregt die Eifersucht, wenn man einen anderen erblickt, der höher in Ehren steht. Wenn die Eifersucht unseren Sinn verblendet und das Innere unseres Herzens in ihren Bann zwingt, dann wird die Furcht Gottes verschmäht, die Lehre Christi mißachtet, dann wird an den Tag des Gerichtes nicht mehr gedacht. Da macht sich aufgeblasener Hochmut breit und erbitterte Wut, da treibt die Treulosigkeit ihr falsches Spiel, und die Ungeduld erregt den Sinn, da wütet die Zwietracht und entbrennt der Zorn, und wer einmal in fremde Gewalt geraten ist, der kann sich nicht mehr im Zaume halten und beherrschen. Durch sie [die Eifersucht] wird das Band des Friedens unseres Herrn zerrissen, durch sie wird die brüderliche Liebe verletzt, durch sie wird die Wahrheit gefälscht und die Einheit zerstört, durch sie läßt man sich zu Ketzereien und Spaltungen hinreißen, indem man die Priester anfeindet und die Bischöfe beneidet und indem man sich darüber beklagt, daß man nicht lieber selbst das Amt erhalten hat, oder es als unvereinbar mit seiner Würde ablehnt, einen anderen als seinen Vorgesetzten anzuerkennen. Deshalb zeigt man sich widerspenstig, deshalb lehnt man sich auf hochmütig aus Eifersucht und ein Opfer des Neides; aus Haß und Mißgunst feindet man nicht die Person des anderen an, sondern seine Würde.</p><p>Welch nagender Wurm aber ist es für die Seele, welch verzehrende Seuche für die Gedanken, welch fressender Rost für das Herz, auf die Tüchtigkeit oder das Glück des Nächsten eifersüchtig zu sein, das heißt: die eigenen Verdienste oder die göttlichen Wohltaten an ihm zu hassen, eines anderen Güter zum eigenen Schaden zu kehren, wegen der Erfolge angesehener Männer sich abzuquälen, den Ruhm anderer zu seiner eigenen Pein zu machen, sozusagen Henker auf seine eigene Seele zu hetzen und für seine Gedanken und Sinne Folterknechte herbeizurufen, um sich von ihnen bis aufs Blut mit Martern zerfleischen, um sich von ihnen die geheimsten Tiefen seines Herzens mit den „Krallen" der Mißgunst zerreißen zu lassen! Keine Speise kann solchen Menschen schmecken, kein Getränk ihnen munden. Nur Seufzen und Stöhnen und Jammern hört man beständig, und da Mißgünstige ihren Neid niemals ablegen, so wird ihr Herz Tag und Nacht bedrängt und ohne Unterlaß zerfleischt. Die anderen Übel haben doch wenigstens ihre Grenze, und jedes Vergehen, das begangen wird, ist mit seiner Ausführung eben zu Ende. Bei dem Ehebrecher hört das Verbrechen auf, sobald er die Schändung begangen hat, bei dem Wegelagerer kommt der Frevel zur Ruhe, sobald der Totschlag vollbracht ist, bei dem Räuber macht die Raubgier halt, sobald er in den Besitz der Beute gelangt ist, und auch dem Fälscher setzt die Vollführung seines Betrugs ein Ziel. Die Eifersucht aber hat keine Grenze, sie ist ein ununterbrochen fortdauerndes Übel, eine Sünde ohne Ende, und mit je besserem Erfolge der Beneidete vorwärts kommt, zu desto mächtigerem Brande entzünden sich bei dem Neidischen die Flammen der Mißgunst,</p><p>Daher die drohende Miene, der finstere Blick, daher die Blässe im Gesicht, das Zittern der Lippen, das Knirschen der Zähne, daher die wilden Reden, die zügellosen Schmähungen, daher die zu gewalttätigem Mord entschlossene Hand, die wenigstens mit dem Hasse eines wutentflammten Sinnes bewaffnet ist, wenn sie auch nicht gleich zum Schwerte greift. Und deshalb sagt der Heilige Geist in den Psalmen: „Sei nicht eifersüchtig auf den, der glücklich wandelt auf seinem Wege!“ und wiederum: „Es wird beobachten der Sünder den Gerechten und knirschen gegen ihn mit seinen Zähnen. Gott aber wird lachen über ihn; denn er sieht voraus, daß kommen wird dessen Tag”. Auf sie zeigt und weist der selige Apostel Paulus hin, wenn er sagt: „Natterngift ist unter ihren Lippen, und ihr Mund ist voll von Fluchen und Bitterkeit. Rasch sind ihre Füße zum Blutvergießen; Not und Elend ist auf den Wegen derer, die den Weg des Friedens nicht kennen, und Gottesfurcht ist nicht vor ihren Augen".</p><p>Viel leichter ist das Übel und viel geringer die Gefahr, wenn die Glieder durch das Schwert verwundet werden. Leicht ist die Heilung da, wo der Hieb deutlich sichtbar ist, und ein Übel, das man sieht, läßt sich mit Hilfe von Heilmitteln rasch der Genesung entgegenführen. Die Wunden der Eifersucht hingegen sind versteckt und verborgen und sind keinem Mittel der Heilkunst zugänglich, da sie sich in der geheimen Tiefe des Bewußtseins verschlossen haben, ohne daß das Leiden wahrnehmbar ist. Du, der du neidisch und mißgünstig bist, bist ja wohl zunächst hinterlistig, verderblich und feindselig gegen die, die du hassest; vor allem bist du aber doch der Feind deines eigenen Wohles. Wer es auch sein mag, den du mit deiner Eifersucht verfolgst, er wird sich vor dir flüchten und hüten können; du aber kannst dir selbst unmöglich entfliehen. Wo immer du auch weilst, dein Widersacher ist bei dir, der Feind wohnt stets in deiner Brust, das Verderben ist in deinem Innern eingeschlossen. In unlösbar verschlungenen Ketten liegst du gebunden und gefesselt; du bist der Gefangene der Eifersucht, die dich beherrscht, und kein Trost kann dir helfen. Ein nie endendes Übel ist es, einen Menschen zu verfolgen, der der Gnade Gottes untersteht; ein unheilbares Unglück ist es, einen Glücklichen zu hassen.</p><p>Und deshalb, geliebteste Brüder, hat der Herr dieser Gefahr vorgebeugt, damit keiner durch die Eifersucht auf seinen Bruder in die Schlingen des Todes gerate, und auf die Frage seiner Jünger, wer unter ihnen der Größte sei, zur Antwort gegeben: „Wer der Kleinste unter euch allen ist, der wird groß sein„. Alle Eifersucht hat er durch seine Antwort abgeschnitten, alle Ursache und allen Stoff zu bissigem Neid hat er zerstört und entfernt. Einem Jünger Christi ist es nicht erlaubt, Eifersucht zu zeigen, ist es nicht gestattet, Neid zu hegen. Um Erhöhung kann es bei uns keinen Wettstreit geben. Aus der Niedrigkeit wachsen wir ja zu Hohem empor. Wir haben also gehört, wodurch wir gefallen können. So lehrt und mahnt auch der Apostel Paulus: wir, die wir durch Christi Licht erleuchtet dem Dunkel des nächtlichen Wandels entronnen sind, sollten in den Taten und Werken des Lichtes wandeln, indem er schreibt und sagt: „Die Nacht ist vorübergegangen, der Tag aber ist herangekommen. Laßt uns also abwerfen die Werke der Finsternis und anlegen die Waffen des Lichtes! Wie am Tage lasset uns ehrbar wandeln, nicht in Gelagen und Trunkenheit, nicht in Begehrlichkeit und Unzucht, nicht in Streit und Eifersucht!“ Ist die Finsternis aus deinem Herzen gewichen, ist die Nacht daraus vertrieben, ist das Dunkel verscheucht, hat Tageshelle deine Sinne erleuchtet und hast du einmal angefangen, ein Mensch des Lichtes zu sein, dann tue nur das, was Christi ist; denn Christus ist das Licht und der Tag.</p><p>Was stürzest du dich in die Finsternis der Eifersucht, was hüllst du dich in die Wolke des Neides, was bringst du durch das Dunkel der Mißgunst alles Licht des Friedens und der Liebe zum Verlöschen, was kehrst du zu dem Teufel zurück, dem du entsagt hattest, und warum zeigst du dich dem Kain ähnlich? Denn daß sich jeder des Verbrechens des Mordes schuldig macht, der seinen Bruder mit Eifersucht und Haß verfolgt, das verkündigt der Apostel in seinem Briefe mit den Worten: „Wer seinen Bruder haßt, ist ein Mörder, und ihr wißt, daß kein Mörder das Leben bleibend in sich hat“, und wiederum: „Wer sagt, er sei im Lichte, und seinen Bruder haßt, ist noch in der Finsternis und wandelt in der Finsternis und weiß nicht, wohin er geht; denn die Finsternis hat seine Augen geblendet”. Wer seinen Bruder haßt, sagt er, der wandelt in der Finsternis und weiß nicht, wohin er geht. Er geht nämlich, ohne es zu wissen, in die Hölle, ahnungslos und blindlings stürzt er in die Pein, da er sich ja von dem Lichte Christi entfernt, der da mahnt und sagt: „Ich bin das Licht der Welt. Wer mir nachfolgt, wird nicht wandeln in der Finsternis, sondern wird das Licht des Lebens haben". Dem Herrn aber folgt nach, wer sich an seine Gebote hält, wer auf dem Wege seiner Lehre dahinschreitet, wer seinen Fußtapfen und seiner Bahn folgt, wer das, was Christus gelehrt und getan hat, nachahmt, wie auch Petrus ermuntert und mahnt mit den Worten: „Christus hat gelitten für euch, indem er euch ein Vorbild hinterließ, damit ihr nachfolget seinen Fußtapfen.</p><p>Wir müssen bedenken, mit welchem Ausdruck Christus sein Volk benennt, mit welchem Namen er seine Herde bezeichnet. „Schafe„ heißt er sie, damit die christliche Unschuld der der Schafe ähnlich werde; „Lämmer“ nennt er sie, damit ihr schlichter Sinn das einfältige Wesen der Lämmer sich zum Vorbild nehme. Was verbirgt sich der Wolf unter dem Schafskleide, was schändet mancher den guten Ruf der Herde Christi, der nur fälschlich vorgibt, ein Christ zu sein? Christi Namen sich beizulegen, ohne auf Christi Weg zu wandeln was ist das anderes als ein Betrug am göttlichen Namen, als ein Abirren vom Wege des Heils? Lehrt und sagt er doch selbst, nur der gelange zum Leben, der die Gebote Gottes halte, und nur der sei weise, der seine Worte höre und danach tue; auch werde nur der ein wirklich großer Lehrer im Himmelreich genannt, der nach seiner Lehre auch handle, und dem Prediger werde das, was er treffend und mit Nutzen verkündigt habe, nur dann zugute kommen, wenn er dem, was sein Mund spricht, nachher auch die Tat folgen lasse. Was aber hat der Herr seinen Jüngern häufiger ans Herz gelegt, was hat er ihnen unter seinen heilsamen Mahnungen und himmlischen Lehren gewissenhafter zu halten und zu beobachten geboten, als daß mit derselben Liebe, die er selbst seinen Jüngern entgegenbrachte, auch wir uns gegenseitig lieben sollten? Wie aber bewahrt der den Frieden oder die Liebe des Herrn, der vor lauter Eifersucht weder friedlich noch liebreich sein kann?</p><p>Als deshalb der Apostel Paulus die Segnungen des Friedens und der Liebe schilderte und ausdrücklich versicherte und lehrte, weder der Glaube noch das Almosengeben noch selbst das Leiden als Bekenner und Märtyrer werde ihm etwas helfen, wenn er nicht den Bund der Liebe rein und unverletzt erhalte, da hat er auch noch die Worte hinzugefügt: „Die Liebe ist großmütig, die Liebe ist gütig, die Liebe eifert nicht„. Damit wollte er doch offenbar lehren und zeigen, daß nur der die Liebe bewahren kann, der großmütig und gütig sei und die Eifersucht und den Neid nicht kenne. Ebenso äußert und sagt er an einer anderen Stelle, wo er mahnt, der Mensch, der nunmehr des Heiligen Geistes voll und durch die himmlische Geburt ein Kind Gottes geworden sei, solle nur noch dem Geistlichen und Göttlichen nachtrachten: „Und ich nun, ihr Brüder, konnte nicht zu euch reden als zu Geistlichen, sondern als zu Fleischlichen, als zu Kindern in Christo. Mit Milch habe ich euch getränkt, nicht mit Speise. Denn ihr wart noch nicht dazu imstande; aber auch jetzt seid ihr es noch nicht, denn noch seid ihr fleischlich. Denn wo unter euch Eifersucht herrscht und Streit und Zwietracht, seid ihr da nicht fleischlich und wandelt nach menschlicher Weise?“</p><p>Zu zermalmen gilt es, geliebteste Brüder, die fleischlichen Laster und Sünden, tilgen müssen wir die gefährliche Befleckung des irdischen Leibes mit der Kraft des Geistes, damit wir nicht in die Schlingen des Todes uns verwickeln, indem wir abermals in den Wandel des alten Menschen zurückfallen. Warnt doch auch der Apostel mit klugem Blick und zu unserem Heile schon im voraus gerade davor. „Laßt uns daher, ihr Brüder“, sagt er, „nicht nach dem Fleische leben! Denn wenn ihr nach dem Fleische lebt, werdet ihr anfangen zu sterben; wenn ihr aber durch den Geist die Werke des Fleisches ertötet, so werdet ihr leben. Denn alle, die von dem Geiste Gottes getrieben werden, die sind Kinder Gottes”. Sind wir also wirklich Kinder Gottes, haben wir bereits angefangen, sein Tempel zu sein, haben wir den Heiligen Geist empfangen und führen wir ein heiliges und geistliches Leben, haben wir unsere Augen von der Erde zum Himmel erhoben, haben wir unser von Gott und Christus erfülltes Herz zum Hohen und Göttlichen emporgerichtet, so laßt uns auch nur noch tun, was Gottes und Christi würdig ist, wie der Apostel ermuntert und mahnt! „Seid ihr mit Christus auferstanden“, sagt er, „so suchet, was droben ist, wo Christus ist, der zur Rechten Gottes sitzt! An das, was droben ist, denket, nicht an das, was auf Erden ist! Denn ihr seid gestorben, und euer Leben ist mit Christus in Gott verborgen. Wenn aber Christus, euer Leben sich offenbaren wird, dann werdet auch ihr [mit ihm] offenbar werden in der Herrlichkeit”. Nachdem wir also in der Taufe den fleischlichen Sünden des alten Menschen nach gestorben und begraben, nachdem wir kraft der himmlischen Wiedergeburt mit Christus auferstanden sind, so laßt uns auch das, was Christi ist, nicht nur denken, sondern auch tun, wie ja der gleiche Apostel wiederum lehrt und mahnt mit den Worten: „Der erste Mensch ist von dem Lehm der Erde, der zweite Mensch vom Himmel. Wie jener vom Lehme ist, so sind auch die, die vom Lehme sind; und wie der himmlische ist, so sind auch die Himmlischen. Wie wir getragen haben das Bild dessen, der von Lehm ist, so laßt uns auch das Bild dessen tragen, der vom Himmel ist!" Das himmlische Bild aber können wir nicht tragen, wenn wir nicht in dem, was wir nunmehr zu sein angefangen haben, uns Christus ähnlich zeigen.</p><p>Denn erst dann hast du geändert, was du gewesen bist, erst dann hast du angefangen, das zu sein, was du früher nicht warst, wenn in dir die Geburt aus Gott deutlich sichtbar wird, wenn die von Gott verordnete Zucht [in dir] auch Gott dem Vater entspricht und wenn in einem ehrenvollen und rühmlichen Lebenswandel auch Gott im Menschen offenbar wird, wie er selbst ermuntert und mahnt und denen, die ihn verherrlichen, Wiedervergeltung verheißt. „Diejenigen“, sagt er, „die mich verherrlichen, werde ich verherrlichen, und wer mich verachtet, wird verachtet werden”. Indem uns der Herr und Sohn Gottes zu dieser Verherrlichung heranbildet und vorbereitet, legt er es uns ans Herz, Gott dem Vater ähnlich zu werden, und sagt in seinem Evangelium: „Ihr habt gehört, daß gesagt worden ist:,Du sollst deinen Nächsten lieben und hassen deinen Feind!’ Ich aber sage euch:,Liebet eure Feinde und betet für die, die euch verfolgen, damit ihr ähnlich seid eurem Vater, der im Himmel ist, der seine Sonne aufgehen läßt über Gute und Böse und regnen läßt über Gerechte und Ungerechte]’“ Wenn es für Menschen schon erfreulich und ruhmvoll ist, möglichst ähnliche Kinder zu haben, und die Vaterfreude dann um so größer ist, wenn die Nachkommenschaft in den Gesichtszügen dem Vater ganz und gar ähnelt, wieviel größer ist dann die Freude bei Gott dem Vater, wenn einer so dem Geiste nach geboren wird, daß in seinem rühmlichen Wandel der göttliche Adel verherrlicht wird! Welche Palme der Gerechtigkeit, welche Ruhmeskrone ist es für dich, ein solcher zu sein, von dem Gott nicht sagt: „Söhne habe ich gezeugt und erhöht, sie selbst aber haben mich verschmäht!” Möge dich vielmehr Christus beloben und zur Belohnung rufen mit den Worten: „Kommet, ihr Gesegneten meines Vaters, empfanget das Reich, das euch bereitet ist seit Anbeginn der Welt!"</p><p>Durch solche Betrachtungen, geliebteste Brüder, gilt es den Geist zu stärken, durch derartige Übungen ihn gegen alle Geschosse des Teufels zu sichern. Laßt uns in den Händen die göttliche Schrift halten, im Sinne nur den Gedanken an den Herrn wohnen; beständiges Gebet möge gar nie verstummen, heilbringende Wohltätigkeit keinen Augenblick erlahmen! Laßt uns stets in geistlichen Werken uns betätigen, damit der Feind, so oft er einen Angriff versucht, unsere Brust gegen ihn wohlverwahrt und gerüstet findet! Denn für den Christen gibt es nicht nur die eine Krone, die man in der Zeit der Verfolgung erlangt, nein, auch der Frieden hat seine Kronen, mit denen wir gekrönt werden, wenn wir aus den verschiedenartigen und mannigfachen Kämpfen als Sieger hervorgehen und den Widersacher zu Boden gestreckt und niedergeworfen haben. Die Wollust bezwungen zu haben, ist die Palme der Enthaltsamkeit Gegen den Jähzorn, wider die Ungerechtigkeit erfolgreich angekämpft zu haben, ist die Krone geduldiger Ausdauer. Ein Triumph über die Habsucht ist es, das Geld zu verachten. Der Ruhm des Glaubens ist es, im Vertrauen auf die Zukunft das Ungemach der Welt zu ertragen, Und wer im Glück nicht übermütig ist, der erntet Ruhm von seiner Demut. Und wer bereit ist, voll Barmherzigkeit die Armen zu unterstützen, erhält dafür himmlische Schätze als Gegengabe. Und wer Eifersucht nicht kennt, sondern in Einmütigkeit und Sanftmut seine Brüder liebt, wird durch den Preis der Liebe und des Friedens ausgezeichnet. In dieser Rennbahn der Tugenden laufen wir täglich, zu diesen Palmen und Kronen der Gerechtigkeit können wir ohne Unterbrechung jederzeit gelangen.</p><p>Damit nun auch du zu ihnen gelangen kannst, der du bisher von Eifersucht und Neid beherrscht warst, wirf all die Bosheit von dir ab, die dich früher gefesselt hielt, und wende dich heilsamen Schrittes dem Wege des ewigen Lebens zu! Reiß aus deiner Brust die Dornen und Disteln heraus, damit dir der Same des Herrn reichen Ertrag beschere und die göttliche und geistliche Saat zur üppigen Fülle einer gesegneten Ernte emporsprieße! Speie aus die Galle der Gehässigkeit, tu ab von dir das Gift der Zwietracht; rein werde wieder dein Sinn, der von Schlangenneid angesteckt war, und alle Bitterkeit, die sich in deinem Inneren festgesetzt hatte, möge durch Christi Süßigkeit gemildert werden! Nimmst du vom Sakrament des Kreuzes Speise und Trank, dann möge das Holz, das bildlich bei Merrha dazu diente, den bitteren Geschmack des Wassers zu vertreiben, in Wirklichkeit bei dir dazu beitragen, dein Herz zu mildern und zu sänftigen, und du wirst um ein Heilmittel zur glücklichen Herstellung deiner Gesundheit nicht in Verlegenheit sein. Laß dich dort heilen, wo du seinerzeit deine Wunden empfingst! Liebe die, die du vordem haßtest, ehre die, die du in ungerechter Mißgunst beneidetest! Die Guten ahme nach, wenn du es ihnen gleichtun kannst; vermagst du das aber nicht, so freue dich wenigstens mit ihnen und beglückwünsche sie als die Besseren! In Liebe mit ihnen vereint, geselle dich zu ihnen als Genosse, durch das einigende Band brüderlicher Zuneigung mache dich zu ihrem Miterben! Vergeben wird dir deine Schuld, wenn du selbst vergibst; angenommen werden deine Opfer, wenn du als ein Friedfertiger zu Gott kommst. Dein Denken und Tun wird von Gott geleitet werden, wenn du an das denkst, was göttlich und gerecht ist, wie geschrieben steht: „Das Herz des Mannes denke an Gerechtes, damit von Gott seine Schritte gelenkt werden!"</p><p>Zu denken aber hast du an vieles. Denke an das Paradies, in das Kain nicht eingeht, der aus Eifersucht seinen Bruder erschlug! Denke an das himmlische Reich, in das der Herr nur die Einträchtigen und Einmütigen zuläßt! Denke daran, daß Kinder Gottes allein die genannt werden können, die friedfertig sind, die, durch die [himmlische] Geburt und das göttliche Gesetz geeinigt, Gott dem Vater und Christus ähneln und entsprechen! Denke daran, daß wir unter den Augen Gottes stehen, daß wir unter seinem Richterblick die Bahn unseres [irdischen] Wandels und Lebens durchmessen und daß wir dann erst zu dem Glück gelangen können, ihn zu schauen, wenn wir ihn, der jetzt auf uns schaut, durch unser Tun erfreuen, wenn wir uns seiner Gnade und Huld würdig erweisen und wenn wir, die wir ihm in seinem Reiche immerdar gefallen wollen, ihm zuvor in dieser Welt zu gefallen wissen!</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Julius Baer, <em>Über Eifersucht und Neid</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-49/versions/uber-eifersucht-und-neid-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "02jQL1xq_Книга_о_падших__Киприан_Карфагенский"
    path: "Cyprian_De_lapsis"
    title: "Über die Gefallenen"
    menu: { parent: "Abhandlungen", title: "Über die Gefallenen", priority: 7 }
    update: true
    body: |-
      <p><em>Über die Gefallenen, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Den Frieden, geliebteste Brüder, seht ihr der Kirche wiedergegeben, und – was vor kurzem noch den Ungläubigen schwer und den Abtrünnigen unmöglich erschien – dank der göttlichen Hilfe und Rache ist unsere Sicherheit wiederhergestellt. Freude zieht wieder ein in die Herzen, verscheucht ist der Sturm und die Wolke der Bedrängnis, und von neuem lacht ein ruhiger, heiterer Himmel. Lauter Preis gebührt Gott; seine Wohltaten und Gaben haben wir mit Danksagung zu feiern, obwohl ja unser Mund auch in der Zeit der Verfolgung nicht abgelassen hat, ihm zu danken. Denn so viel Macht kann dem Feinde nicht verstattet sein, daß wir, die wir Gott aus ganzem Herzen und aus ganzer Seele und aus allen Kräften lieben, seinen Segen und sein Lob nicht immer und überall rühmend verkündigten. Erschienen ist der von uns allen so sehnlich erwünschte Tag, und nach dem grauenvollen und schrecklichen Dunkel einer langen Nacht ist die Welt, von des Herrn Licht bestrahlt, zu neuem Glanze erwacht.</p><p>Mit freudigen Blicken sehen wir hin auf die Bekenner, die sich durch den Ruf eines guten, unbefleckten Namens und durch das Lob ihrer Glaubensstärke Ansehen und Ruhm erworben haben, mit heiligen Küssen umfassen und umarmen wir in göttlichem und unersättlichem Verlangen die Heißersehnten. Da steht die glänzende Schar der Streiter Christi, die die stürmische Wut der drängenden Verfolgung in unerschütterlichem Kampfe gebrochen haben, bereit, die Schrecken des Kerkers zu erdulden, und gerüstet, selbst den Tod zu erleiden. Heldenmütig habt ihr der Welt widerstanden, ein ruhmvolles Schauspiel habt ihr Gott geboten, ein Vorbild habt ihr gegeben allen Brüdern, die euch nachfolgen wollen. Eure gottesfürchtigen Lippen haben von Christus Zeugnis abgelegt, an den sie einmal zu glauben bekannt haben. Eure unbefleckten Hände, die nur an göttliche Werke gewöhnt waren, haben sich den gotteslästerlichen Opfern widersetzt; der durch die himmlischen Speisen geheiligte Mund hat nach dem Genuß des Leibes und Blutes unseres Herrn die sündige Befleckung mit den Überresten der Götzenopfer voll Abscheu gemieden. Von der ruchlosen und frevelhaften Hülle, mit der dort die Opfernden ihr geknechtetes Haupt bedeckten, ist euer Haupt frei geblieben. Eure durch Gottes Zeichen geschützte, reine Stirne konnte unmöglich die Krone des Teufels tragen: nein, für des Herrn Krone erhielt sie sich würdig. Mit welcher Freude nimmt euch eure Mutter, die Kirche, bei eurer Rückkehr aus dem Kampfe wieder in ihrem Schoße auf! Wie selig, wie froh öffnet sie euch ihre Pforten, damit ihr in geschlossenem Zuge zusammen einzieht mit den Trophäen des Sieges über den niedergestreckten Feind! Mit den triumphierenden Männern kommen auch Frauen gezogen, die nicht nur die Welt, sondern auch ihr Geschlecht überwunden haben. Es kommen, mit doppeltem Kriegsruhm bedeckt, sogar Jungfrauen und Kinder, die an Tugendkraft ihren Jahren weit voraus sind. Aber auch die noch übrige Menge der Aufrechtgebliebenen hat Teil an eurem Ruhm und folgt euren Spuren, ausgezeichnet durch einen Ruhm, der dem euren ganz nahe, ja fast gleich kommt. Auch in ihnen wohnt dieselbe Lauterkeit des Herzens, die gleiche Reinheit beharrlichen Glaubens. Gestützt auf die unerschütterlichen Wurzeln der himmlischen Lehren und gefestigt durch die Überlieferungen des Evangeliums, haben sie sich weder durch die Androhung der Verbannung noch durch die angeordneten Martern oder durch die Strafen an Gut und Blut schrecken lassen. Zur Prüfung des Glaubens waren bestimmte Tage festgesetzt; wer aber nicht vergißt, daß er der Welt entsagt hat, der kennt auch keinen Tag der Welt, und mit der irdischen Zeit rechnet der nicht mehr, der von Gott die Ewigkeit erhofft.</p><p>Niemand, liebe Brüder, niemand wolle diesen Ruhm verkürzen, keiner suche die unwandelbare Festigkeit der Stehenden in böswilliger Verkleinerung herabzuziehen! Wenn die zum Abschwören gestellte Frist verstrichen ist, so hat sich jeder, der innerhalb dieser Frist nicht abgeschworen hat, damit als Christ bekannt. Der erste Ruhmestitel des Sieges ist es, wenn einer, von den Händen der Heiden ergriffen, den Herrn bekennt; die zweite Stufe zum Ruhme besteht darin, sich in vorsichtiger Flucht den Häschern zu entziehen und sich einstweilen für Gott noch aufzubewahren. Das erste ist ein öffentliches, dieses ein privates Bekenntnis; der erste ist Sieger über den weltlichen Richter, dieser begnügt sich damit, Gott zum Richter zu haben, und bewahrt sich in der Unschuld seines Herzens ein reines Gewissen. Dort zeigt sich mehr entschlossene Tapferkeit, hier mehr auf Sicherheit bedachte Vorsicht. Jener ward bereits reif befunden, als seine Stunde nahte, dieser aber, der Hab und Gut verließ und nur deshalb entwich, weil er nicht abschwören wollte, ist vielleicht nur zurückgestellt; er würde sicher bekennen, wenn er gleichfalls ergriffen worden wäre,</p><p>Diese himmlischen Kronen der Märtyrer, diesen geistlichen Ruhm der Bekenner, diese großen, herrlichen Verdienste der aufrecht gebliebenen Brüder trübt nur die Trauer darüber, daß der wütende Feind einen Teil von unserem Fleisch und Blut losgerissen und mit seinem verheerenden Schlage zu Fall gebracht hat, Was soll ich hier tun, geliebteste Brüder, von den schwankenden Wogen meines Gemüts unschlüssig hin- und hergetrieben, was oder wie ich reden soll? Mehr der Tränen bedarf es als der Worte, um dem Schmerze Ausdruck zu geben, mit dem die unserem Körper geschlagene Wunde zu beweinen, mit dem der vielfache Verlust an dem einst so zahlreichen Volke zu beklagen ist. Denn wer wäre so hart und gefühllos, wer so aller brüderlichen Liebe bar, daß er inmitten des mannigfachen Sturzes der Seinigen, inmitten der traurigen, durch reichlichen Schmutz entstellten Trümmer seine Augen trocken zu halten vermöchte und nicht allsogleich in Weinen ausbräche und seinem Jammer eher in Tränen als in Worten freien Lauf ließe? Ich leide, ihr Brüder, ich leide mit euch, und die eigene Erhaltung und das persönliche Wohlbefinden tröstet mich nicht über meinen tiefen Schmerz hinweg, da ja der Hirte in der Verletzung seiner Herde noch schwerer betroffen wird. Mit jedem einzelnen fühle ich mich im Herzen eins, mit jedem einzelnen teile ich die jammervolle Last der Trauer um den schweren Verlust. Mit den Klagenden klage ich, mit den Weinenden weine ich, mit den Niedergeschmetterten fühle ich mich selbst niedergeschmettert. Von jenen Geschossen des tobenden Feindes wurden gleichzeitig auch meine Glieder durchbohrt, seine wütenden Dolchstöße sind auch mir durchs Herz gedrungen. Von dem Ungestüm der Verfolgung konnte auch mein Herz nicht frei und unberührt bleiben; in den niedergestreckten Brüdern hat das Mitgefühl auch mich zu Boden geworfen.</p><p>Und dennoch, geliebteste Brüder, muß man der Wahrheit die Ehre geben, und das düstere Dunkel der feindseligen Verfolgung darf Herz und Sinn nicht so mit Blindheit geschlagen haben, daß gar kein helles Licht mehr übrig geblieben wäre, um die göttlichen Vorschriften überblicken zu können. Erkennt man die Ursache des Unheils, so läßt sich auch ein Heilmittel für die Wunde finden. Der Herr wollte seine Familie prüfen, und weil die uns von Gott überlieferte Lehre durch den langen Frieden gelitten hatte, so hat das himmlische Strafgericht den gesunkenen und, fast hätte ich gesagt, schlafenden Glauben wieder aufgerichtet; und obwohl wir durch unsere Sünden mehr verdienten, hat der Herr in seiner großen Milde alles so gnädig gefügt, daß alles Geschehene eher einer Prüfung glich als einer Verfolgung.</p><p>Da war jeder nur auf die Vergrößerung seines Vermögens bedacht, und ohne daran zu denken, was die Gläubigen früher zur Zeit der Apostel getan hatten und immer tun sollten, verlegte man sich, von unersättlicher Habgier entflammt, nur auf die Mehrung seines Besitzes. Vergebens suchte man die ergebene Gottesfurcht bei den Priestern, die unbefleckte Treue bei den Dienern; da kannte man keine Barmherzigkeit in den Werken, keine Zucht in den Sitten. Die Männer fälschten den Bart, die Frauen schminkten ihr Gesicht; entstellt wurden die von Gottes Hand geschaffenen Augen und die Haare mit lügnerischen Mitteln gefärbt. Schlauer Trug diente dazu, die Herzen der Einfältigen zu täuschen, tückische Ränke halfen die eigenen Brüder überlisten. Mit Ungläubigen knüpfte man das Band der Ehe, Heiden gab man die Glieder Christi preis. Man war nicht nur leichtfertig im Schwören, sondern man schwur auch Meineide; die Vorgesetzten verachtete man in übermütigem Dünkel, mit vergiftetem Munde verleumdete man einander, mit unerbittlichem Haß lebte man in gegenseitiger Feindschaft. Gar viele Bischöfe, die doch den übrigen eine Mahnung und ein Vorbild sein sollten, vernachlässigten ihr göttliches Amt und wurden die Beamten weltlicher Herrscher; sie verließen ihren Stuhl, ließen die Gemeinde im Stiche, reisten durch fremde Provinzen und trieben auf den Märkten ihr einträgliches Geschäft. Während die Brüder in der Gemeinde darbten, wollten sie Geld im Überflusse haben, brachten Grundstücke durch tückischen Betrug an sich und mehrten durch hohen Wucherzins ihr Kapital. Was hätten wir demnach nicht alles für derartige Sünden zu erdulden verdient, da ja schon längst die göttliche Strenge im voraus gemahnt und gesagt hat: „Wenn sie mein Gesetz verlassen und in meinen Rechten nicht wandeln, wenn sie meine Satzungen entheiligen und meine Gebote nicht halten, so will ich mit der Rute ihre Missetaten heimsuchen und mit Geißeln ihre Vergehen“.</p><p>Das alles ist uns vorausverkündigt und vorhergesagt. Ohne aber an das gegebene Gesetz und seine Beobachtung zu denken, haben wir selbst es durch unsere Sünden dahin gebracht, daß wir die Ahndung unseres Vergehens und die Prüfung unseres Glaubens durch strengere Mittel nötig machten, indem wir die Gebote des Herrn verachteten. Ja, nicht einmal nachträglich ließen wir uns zur Furcht des Herrn bekehren, so daß wir dieser unserer Bestrafung und der göttlichen Prüfung uns geduldig und mutig unterzogen hätten. Gleich bei den ersten Worten des drohenden Feindes hat eine ganz große Anzahl von Brüdern ihren Glauben preisgegeben, und nicht der Sturm der Verfolgung hat sie zu Boden geschmettert, sondern sie haben sich selbst in freiwilligem Falle niedergeworfen. Was war denn, ich bitte euch, so Unerhörtes, was war denn so Außerordentliches vorgefallen, daß man den Christus geleisteten Treueid in jäher Hast brach, gleich als ob ganz unbekannte und unvermutete Ereignisse eingetreten wären? Haben das alles nicht Schon zuerst die Propheten und dann später die Apostel verkündigt? Haben sie, des Heiligen Geistes voll, nicht stets die Drangsale der Gerechten und die übergriffe der Heiden vorhergesagt? Heißt es nicht in der göttlichen Schrift, die stets unseren Glauben waffnet und Gottes Diener durch himmlischen Zuspruch stärkt: „Den Herrn, deinen Gott, sollst du anbeten und ihm allein dienen“? Sagt sie nicht abermals, indem sie auf den Zorn des göttlichen Unwillens hinweist und zur Furcht vor der Strafe mahnt: „Sie haben solche angebetet, die ihre Finger gemacht haben, und der Mensch bückte sich, und der Mann demütigte sich, und ich werde es ihnen nicht vergeben“? Und wiederum spricht Gott und sagt: „Wer Göttern opfert außer dem Herrn allein, der wird ausgerottet werden“. Hat nicht auch im Evangelium nachmals der Herr, ein Lehrer in Worten, ein Vollbringer in Taten – denn er hat gelehrt, was zu tun sei, und getan, was er gelehrt hatte –, hat nicht auch er all das mit mahnender Stimme vorhergesagt, was jetzt geschieht und noch geschehen wird? Hat er nicht schon im voraus den Leugnern ewige Strafen und den Bekennern heilbringende Belohnungen in Aussicht gestellt?</p><p>Aber einigen – welch ein Frevel! – ist das alles entfallen und aus dem Gedächtnis entschwunden. Sie warteten nicht einmal mit dem Emporsteigen zum Kapitol, bis sie etwa ergriffen, mit dem Ableugnen, bis sie gefragt wurden. Vor der Schlacht schon besiegt, ohne Kampf schon niedergestreckt, retteten viele für sich nicht einmal den Schein, als ob sie etwa nur widerwillig den Götzen geopfert hätten. Nein, aus freien Stücken liefen sie auf das Forum, freiwillig eilten sie ihrem geistlichen Tode entgegen, gerade als ob sie das schon längst ersehnt, als ob sie nur eine sich bietende Gelegenheit ergriffen, die sie von Herzen gewünscht hätten. Wie viele wurden da von den Behörden zurückgestellt, weil der Abend hereinbrach, wie viele baten sogar noch darum, ihren Untergang nur ja nicht zu verschieben! Wie kann ein solcher Mensch Gewalt vorschützen, um damit sein Vergehen zu rechtfertigen, da er vielmehr selbst Gewalt angewandt hat, um sein Verderben herbeizuführen? Als er freiwillig zum Kapitol kam, als er aus freien Stücken zur gehorsamen Ausführung der grausigen Tat vortrat, mußte da nicht sein Schritt wanken, wurde es ihm da nicht dunkel vor den Augen, schlug ihm da nicht zitternd das Herz, brachen nicht seine Glieder zusammen? Sind ihm da nicht die Sinne geschwunden, hat da nicht die Zunge gestockt, die Sprache versagt? Vermochte wirklich ein Diener Gottes dort zu stehen und zu sprechen und Christus zu entsagen, er, der bereits dem Teufel und der Welt entsagt hatte? Bedeutete nicht jener Altar, an den er, um zu sterben, herantrat, für ihn den Scheiterhaufen? Hätte er nicht vor des Teufels Opferherd, von dem er den gräßlich duftenden Rauch aufsteigen sah, als vor seiner Todes- und Grabesstätte schaudernd fliehen sollen? Wozu bringst du, Unseliger, erst noch eine Opfergabe mit, wozu ein Opfertier, das du demütig darbringen willst? Du selbst bist ja als Schlachtopfer, du selbst bist als Opfertier an den Altar gekommen; geopfert hast du hier dein Heil, deine Hoffnung; deinen Glauben hast du hier in den unheilvollen Flammen verbrannt.</p><p>Und vielen genügte noch nicht einmal der eigene Untergang. Durch gegenseitige Ermunterung wurde das Volk ins Verderben getrieben, aus verderbenbringendem Becher trank man sich untereinander den Tod zu. Und damit ja nichts fehle, um das Maß des Frevels voll zu machen, wurden sogar die Kinder von den Eltern auf den Armen herbeigetragen oder [an der Hand] herangeschleppt, um in frühester Jugend das zu verlieren, was sie gleich beim Eintritt in das Leben erlangt hatten. Werden diese Kleinen, wenn der Tag des Gerichts gekommen ist, nicht sagen: „Wir haben nichts begangen, wir haben nicht des Herrn Speise und Trank verlassen, um freiwillig zur ruchlosen Befleckung zu eilen: fremder Treubruch hat uns ins Verderben gestürzt, von unseren Eltern mußten wir den Tod erleiden. Sie haben uns durch ihr Leugnen in der Kirche die Mutter, sie haben uns in Gott den Vater geraubt, so daß wir fremdem Trug zum Opfer fielen, während wir, noch klein und ahnungslos und ohne Kenntnis von einem solchen Frevel, durch andere in die Gemeinschaft des Verbrechens mit hineingezogen wurden“?</p><p>Dabei gibt es aber, leider Gottes, gar keinen triftigen und schwerwiegenden Grund, der einen solchen Frevel zu entschuldigen vermöchte. Man hätte ja nur die Heimat zu verlassen und sein Vermögen preiszugeben brauchen. Muß denn nicht jeder, der geboren wird und wieder stirbt, irgendeinmal die Heimat wieder verlassen und sich von seinem Vermögen trennen? Christus darf auf keinen Fall verlassen werden, vor dem Verlust des ewigen Heils und der ewigen Heimat muß man sich sorgsam hüten. Siehe, durch den Mund des Propheten ruft der Heilige Geist: „Weichet, weichet, ziehet von dannen und berühret nichts Unreines; geht aus seiner Mitte weg, sondert euch ab, die ihr die Gefäße des Herrn traget!“ Und doch gehen und weichen sie, die die Gefäße des Herrn und der Tempel Gottes sind, nicht aus der Mitte, um nichts Unreines berühren, um nicht mit todbringenden Speisen sich beflecken und besudeln zu müssen? Auch an einer anderen Stelle läßt sich eine Stimme vom Himmel vernehmen, die da mahnt, was die Diener Gottes tun sollen, mit den Worten. „Geh aus von ihr, mein Volk, auf daß du nicht teilhaftig werdest ihrer Sünden und damit du nicht betroffen wirst von ihren Heimsuchungen!“ Wer herausgeht und entweicht, wird der Sünde nicht teilhaftig; wer aber als Mitschuldiger an dem Verbrechen befunden wird, der wird von ihren Heimsuchungen gleichfalls betroffen. Und deshalb hat der Herr dazu aufgefordert, in der Verfolgung zu entweichen und zu fliehen, und damit dies befolgt werde, hat er es nicht nur gelehrt, sondern auch getan. Denn da die Krone von der Gnade Gottes kommt und da man sie nicht erlangen kann, wenn nicht die Stunde da ist, sie in Empfang zu nehmen, so verleugnet einer, der in Christo bleibt und nur für eine Weile entweicht, nicht etwa seinen Glauben, sondern er wartet nur seine [richtige] Zeit ab. Wer aber gefallen ist, da er nicht entwich, der ist zurückgeblieben in der Absicht, zu leugnen.</p><p>Die Wahrheit, liebe Brüder, darf nicht verschleiert, die Ursache und der Grund unserer Wunder nicht verschwiegen werden. Viele hat die blinde Liebe zu ihrem Mammon verführt, und allerdings konnten solche unmöglich dazu bereit und gerüstet sein, zu entweichen, die von ihren Schätzen wie von Fesseln festgehalten wurden. Das waren für die Zurückbleibenden die Bande, das die Ketten, die ihren Mut lähmten, die ihre Glaubenstreue niederhielten, die ihren Sinn umstrickten und ihnen den Atem beengten, und so wurden sie, die dem Irdischen anhingen, eine Beute und ein Fraß der Schlange, die nach Gottes Ausspruch Erde frißt. Und deshalb sagt der Herr, der Lehrer alles Guten, indem er für die Zukunft im voraus mahnt: „Willst du vollkommen sein, so verkaufe all das Deinige und gib es den Armen, und du wirst einen Schatz im Himmel haben; und komm und folge mir!“ Täten dies die Reichen, so gingen sie nicht durch ihren Reichtum zugrunde; indem sie sich einen Schatz im Himmel sammelten, hätten sie jetzt nicht im eigenen Haus einen Feind, der sie überwindet. Im Himmel weilte dann ihr Herz, Sinn und Gefühl, wenn sie ihren Schatz im Himmel hätten, und der Welt könnte der nicht unterliegen, der in der Welt nichts hätte, was ihn zu besiegen vermachte. Frei und ledig könnte er dem Herrn folgen, wie es die Apostel und zur Zeit der Apostel noch viele andere und manche auch sonst schon oftmals getan haben, die ihre Habe und ihre Eltern verließen und in unzertrennlicher Vereinigung Christus anhingen.</p><p>Wie können aber solche Leute Christus folgen, die durch die Fesseln ihres Vermögens festgehalten sind? Oder wie sollten solche zum Himmel emporstreben und zum Erhabenen und in die Höhen sich aufschwingen, die durch irdische Begierden herabgezogen werden? Sie bilden sich ein, zu besitzen und sind doch vielmehr selbst fremder Besitz, die Sklaven ihres Vermögens; und nicht etwa Herren über das Geld sind sie, sondern vielmehr die Leibeigenen ihres Mammons. Auf diese Zeit, auf diese Menschen weist der Apostel hin, wenn er sagt: „Die aber reich werden wollen, fallen in Versuchung und Fallstricke und viele schädliche Begierden, die den Menschen in Verderben und Untergang stürzen. Denn die Wurzel aller Übel ist die Habsucht, und etliche, die ihr nachjagten, sind vom Glauben abgeirrt und sind in viele Schmerzen geraten“. Durch welch lockende Belohnungen aber fordert uns der Herr auf zur Verachtung des Vermögens! Mit welch reichem Lohn wiegt er die kleinen und geringfügigen Verluste dieses zeitlichen Lebens auf! „Es gibt keinen“, sagt er, „der Haus oder Feld oder Eltern oder Brüder oder Weib oder Kinder wegen des Reiches Gottes verließ und nicht siebenmal so viel in dieser Zeit empfinge, in der künftigen Welt aber das ewige Leben“. Nachdem wir dies gehört und auf Grund der Wahrhaftigkeit der Verheißungen des Herrn als sicher vernommen haben, genügt es noch nicht, einen derartigen Verlust nicht zu fürchten, sondern man muß ihn sogar wünschen, wie ja der Herr selbst von neuem preisend verkündigt und mahnt: „Selig werdet ihr sein, wenn sie euch verfolgen und euch absondern und vertreiben und euren Namen als nichtswürdig schmähen um des Menschensohnes willen. Freuet euch an jenem Tage und frohlocket, denn seht, euer Lohn ist reich im Himmel“.</p><p>„Aber hernach waren die Folterqualen gekommen, und den Widerspenstigen drohten schwere Martern“. Über Foltern kann sich aber doch nur der beklagen, der durch die Foltern schließlich überwunden wurde; den Schmerz kann nur der zu seiner Entschuldigung vorbringen, der im Schmerze unterlag. Ein solcher kann bitten und sagen: „Ich wollte ja tapfer streiten und, meines Treuschwurs eingedenk, ergriff ich die Waffen der frommen Ergebung und des Glaubens; aber mitten im Kampfe erlag ich den mannigfachen Martern und der langen Pein. Fest blieb mein Sinn und stark der Glaube, und lange rang die Seele unerschütterlich mit den folternden Qualen. Als aber die Wut des grausamen Richters von neuem erwachte und man mich, den schon Erschöpften, bald auch noch mit Geißeln zerfleischte, bald mit Knütteln zerschlug, bald auf der Folterbank verrenkte, bald mit der Kralle zerriß, bald mit der Flamme versengte, da ließ mich das Fleisch inmitten des Kampfes im Stiche, da gab mein schwacher Leib nach, und so erlag nicht mein Geist, sondern nur mein Körper unter dem Schmerze.“ Ein solcher Fall kann freilich schnell Verzeihung finden, eine derartige Entschuldigung vermag allerdings Mitleid zu erwecken. Unter solchen Umständen hat einst der Herr dem Castus und Ämilius verziehen, aus solchen Gründen hat er sie, die beim ersten Angriff unterlegen waren, im zweiten Kampfe zu Siegern gemacht, so daß dieselben, die vorher vor dem Feuer zurückgewichen waren, sich nun stärker erwiesen als die Flammen und gerade da als Sieger hervorgingen, wo sie vorher besiegt worden waren. Sie baten um Gnade nicht mit mitleiderregenden Tränen, sondern mit Wunden, und nicht mit klagender Stimme, sondern mit ihrem zerfleischten und zermarterten Körper: statt zu weinen vergossen sie ihr Herzblut, und statt der Zähren quoll ein dicker Blutstrom an dem halbversenkten Leibe herab.</p><p>Welche Verletzungen aber vermögen denn jetzt die Besiegten aufzuweisen, welche tiefklaffenden Wunden an ihrem, Körper, welche Martern ihrer Glieder, jetzt, wo der Glaube nicht im Kampfe zu Falle gekommen ist, sondern der Abfall dem Kampfe zuvorkam? Der Unterlegene kann sein Verbrechen auch nicht mit einem Zwang entschuldigen, wo doch das Verbrechen seinem [freien] Willen entspringt. Ich sage das aber nicht etwa deshalb, um die Lage der Brüder noch zu erschweren, sondern nur, um unsere Brüder noch mehr zu bußfertigem Gebet anzueifern. Denn da geschrieben steht: „Die euch glücklich nennen, führen euch in die Irre und stören den Weg eurer Füße“, so liefert jeder, der dem Sünder mit schmeichelnden Koseworten schöntut, nur neue Nahrung zum Sündigen, und er dämmt die Vergehungen nicht ein, sondern fördert sie noch, Wer hingegen durch gesunde Ratschläge den Bruder zurechtweist und zugleich belehrt, der bringt ihn vorwärts auf dem Wege zum Heil. „Die ich liebe“, sagt der Herr, „die strafe und züchtige ich“. So darf auch ein Priester des Herrn nicht in täuschender Willfährigkeit irreführen, sondern er muß mit heilsamen Mitteln Vorsorge treffen. Ein unerfahrener Arzt ist es, der die angeschwollenen Wundbeulen nur mit schonender Hand betastet und das in den tiefen Höhlungen des Körpers eingeschlossene Gift nur noch vermehrt, indem er es beläßt. Geöffnet muß die Wunde werden und aufgeschnitten, und nachdem das Faule mit dem Messer beseitigt ist, gilt es, sie mit einem kräftigen Mittel zu behandeln Mag auch der Kranke schreien und rufen und jammern, weil er es vor Schmerzen kaum mehr aushält, er wird nachher um so dankbarer sein, wenn er sich wieder gesund fühlt.</p><p>Es ist nämlich, geliebteste Brüder, eine ganz neue Art von Unheil aufgetaucht und, gleich als ob der Sturm der Verfolgung noch zu wenig gewütet hätte, ist zu allem Überfluß unter dem Scheine der Barmherzigkeit ein trügerisches Übel und ein verführerisches Verderben noch hinzugekommen. Im Widerspruche mit der Strenge des Evangeliums, im Widerspruche mit dem Gesetze unseres Herrn und Gottes wird von einigen voll Leichtfertigkeit den Unvorsichtigen wieder ohne weiteres die Gemeinschaft gewährt, ein ungültiger und falscher Friede, gefährlich für die Spender und ohne Nutzen für die Empfänger. Sie verlangen kein geduldiges Warten auf die Rückkehr der Gesundheit, nicht das wahre Heilmittel der Genugtuung; die Buße ist aus ihrem Herzen gebannt, die Erinnerung an die so schwere und schreckliche Sünde ist getilgt. Verdeckt werden die Wunden der Sterbenden, und den tödlichen Stoß, der tief im Innersten sitzt, verhüllt man, indem man das Leiden verborgen hält. Von den Altären des Teufels kommen sie zurück und treten mit ihren unreinen, noch von dem Opferqualm befleckten Händen an das Heilige des Herrn heran; die todbringenden Speisen der Götzen stoßen ihnen fast noch auf, aber während noch ihr Schlund sein Verbrechen durch den Atem und die unheilvolle Befleckung durch den Geruch verrät, wagen sie sich an den Leib des Herrn. Und doch tritt ihnen die göttliche Schrift entgegen und ruft und sagt: „Jeder Reine soll von dem Fleische essen, und jede Seele, die von dem Fleische des Heilsopfers ißt, das dem Herrn zugehört, und hat eine Unreinigkeit an sich, diese Seele soll aus ihrem Volke verschwinden“, und auch der Apostel bezeugt und sagt; „Ihr könnt nicht den Kelch des Herrn trinken und den Kelch der bösen Geister; ihr könnt nicht am Tische des Herrn teilhaben und am Tische der bösen Geister“. Der gleiche Apostel droht ja auch den Trotzigen und Hartnäckigen und ruft ihnen die Worte zu: „Wer immer unwürdig von dem Brote ißt und von dem Kelche des Herrn trinkt, wird schuldig sein an dem Leib und Blut des Herrn“.</p><p>Ohne jedoch auf dies alles zu achten und zu merken, bevor man noch den Frevel gesühnt und das Verbrechen offen eingestanden hat, ehe noch das Gewissen durch das Opfer und die Hand des Priesters gereinigt und der Groll des empörten und drohenden Herrn versöhnt ist, tut man seinem Leibe und Blute Gewalt an, und sie vergehen sich jetzt an dem Herrn mit Hand und Mund noch mehr wie damals, als sie den Herrn verleugneten. Für Frieden halten sie das, was einige mit trügerischen Worten anpreisen. Nicht Frieden ist das, sondern Krieg; und wer vom Evangelium sich losreißt, der bleibt nicht mit der Kirche vereinigt. Warum nennen sie das Unrecht eine Wohltat? Warum bezeichnen sie die Gottlosigkeit mit dem Namen Frömmigkeit? Warum halten sie Sünder, die beständig weinen und zu ihrem Herrn flehen sollten, von bußfertiger Wehklage zurück und stellen sich, als könnten sie ihnen die Aufnahme in die Gemeinschaft erteilen? Solche Leute sind für die Gefallenen das nämliche wie der Hagel dem Getreide, wie stürmisches Wetter den Bäumen, wie eine verheerende Seuche den Herden, wie ein wütender Sturm den Schiffen. Sie rauben [ihnen] nur den Trost der Hoffnung, sie reißen den Stamm mit der Wurzel aus, in gefährlicher Rede schleichen sie sich heran, um tödliches Gift zu verbreiten, und schleudern das Schiff an die Klippen, damit es ja nicht in den Hafen gelangt. Solches Entgegenkommen bietet nicht den Frieden, sondern macht ihn unmöglich, und es gewährt nicht die Gemeinschaft, sondern ist nur hinderlich auf dem Wege zum Heil. Eine neue Verfolgung ist das, eine neue Versuchung, durch die der schlaue Feind in heimlicher Verheerung wütet, um auch die Gefallenen noch zu bekämpfen, damit ihr Wehklagen zur Ruhe komme, damit der Schmerz verstumme, damit die Erinnerung an das Verbrechen schwinde, damit das Seufzen des Herzens unterdrückt, der Tränenstrom der Augen zum Versiegen gebracht und der schwergekränkte Herr ja nicht in anhaltender, tiefer Buße flehentlich um Verzeihung angegangen werde, obwohl doch geschrieben steht: „Gedenke, wovon du gefallen bist, und tue Buße!“</p><p>Keiner täusche, keiner betrüge sich! Der Herr allein ist es, der Barmherzigkeit üben kann. Verzeihung für die Sünden, die gegen ihn begangen sind, kann er allein spenden, der unsere Sünden getragen, der für uns gelitten, den Gott für unsere Sünden dahingegeben hat. Der Mensch kann doch nicht größer sein als Gott, und der Knecht kann nicht durch seine Nachsicht das erlassen und vergeben, was in schwerem Frevel gegen den Herrn begangen worden ist. Sonst kommt zu der Schuld des Gefallenen auch noch ein weiteres Vergehen hinzu, wenn er nicht weiß, daß vorhergesagt ist: „Verflucht der Mensch, der seine Hoffnung setzt auf einen Menschen!“ Den Herrn muß man bitten, den Herrn gilt es durch unsere Genugtuung zu versöhnen, ihn, der erklärt hat, er verleugne den, der ihn verleugne, ihn, der das ganze Gericht allein vom Vater empfangen hat. Wir glauben zwar, daß die Verdienste und die Werke der Märtyrer bei dem Richter sehr viel vermögen, aber erst dann, wenn der Tag des Gerichts gekommen ist, erst dann, wenn nach dem Untergang dieser zeitlichen Welt Christi Volk vor seinem Richterstuhle steht.</p><p>Glaubt aber jemand in überstürzter Eile, so ohne weiteres allen insgesamt Vergebung ihrer Sünden gewähren zu können, oder wagt er es, die Gebote des Herrn aufzuheben, so bringt er den Gefallenen nicht nur keinen Nutzen, sondern sogar Schaden. Es heißt den Zorn des Herrn herausfordern, wenn man seine Willensmeinung nicht beachtet, wenn man es nicht für nötig hält, zuerst seine Barmherzigkeit anzuflehen, sondern sich erlaubt, voll Eigenmächtigkeit sie selbst zu üben, ohne auf den Herrn zu achten. Unter Gottes Altar rufen die Seelen der getöteten Märtyrer mit mächtiger Stimme und sagen: „Wie lange noch, Herr, Du Heiliger und Wahrhaftiger, richtest Du nicht und rächest unser Blut an denen, die auf Erden wohnen?“. Und ihnen wird geboten, noch eine Weile zu ruhen und Geduld zu haben. Und da glaubt noch jemand, es könne irgendeiner [der Märtyrer] in Widerspruch mit dem Richter sich gütig zeigen wollen, indem er ganz nach Willkür Sünden erläßt und vergibt, oder es vermöge einer andere zu schützen, noch bevor er selbst gerächt ist? „Die Märtyrer wünschen, daß etwas geschehe“; ja, wenn es sich um etwas Gerechtes, um etwas Erlaubtes handelt, wenn sich der Priester Gottes dabei nicht mit dem Herrn selbst in Widerspruch zu setzen braucht; gerne und willig gewähre der willfahrende Priester seine Zustimmung, wenn der Bittende fromme Mäßigung bewahrt. „Die Märtyrer wünschen, daß etwas geschehe“; wenn aber im Gesetze des Herrn nicht geschrieben steht, was sie verlangen, so müssen wir zuerst wissen, daß sie von dem Herrn das erlangt haben, was sie fordern, dann erst dürfen wir tun, was sie wünschen. Denn man kann nicht annehmen, durch die göttliche Majestät sei sofort alles zugestanden, was menschliches Versprechen verheißt.</p><p>Hat doch auch Mose für die Sünden des Volkes gebeten und dennoch für die Sündigen die erbetene Verzeihung nicht erlangt, „Ich bitte Dich, Herr“, sprach er, „dieses Volk hat eine große Sünde begangen [und sie haben sich goldene Götter gemacht]; und nun, wenn Du ihnen ihre Sünde vergibst, so vergib sie; wenn aber nicht, so tilge mich aus dem Buche, das Du geschrieben hast!“ Und der Herr sprach zu Moses: „Wenn einer vor mir gesündigt hat, den will ich aus meinem Buche tilgen“. Er, ein Freund Gottes, er, der oftmals von Angesicht zu Angesicht mit, dem Herrn gesprochen hat, vermochte seine Bitte nicht durchzusetzen, und es gelang ihm nicht, den Groll des zürnenden Gottes durch seine Fürbitte zu besänftigen. Den Jeremia lobt und rühmt Gott mit den Worten: „Ehe ich dich im Mutterleibe bildete, habe ich dich gekannt, und ehe du aus dem Mutterschoße hervorgingst, habe ich dich geheiligt und dich zum Propheten gesetzt für die Völker“. Und doch sprach er zu dem nämlichen, der gar häufig Fürbitte und Gebet für die Sünden des Volkes einlegte: „Bete nicht für dieses Volk und verlange nichts für sie in Bitten und Gebet; denn ich will nichts hören zu der Zeit, zu der sie mich anrufen, zu der Zeit ihrer Bedrängnis“. Wo gäbe es vollends einen Gerechteren als Noach, der damals, als die ganze Erde mit Sünden erfüllt war, allein auf Erden als gerecht befunden wurde? Wer wäre ruhmreicher als Daniel? Wer hätte in der Festigkeit des Glaubens mehr Kraft gezeigt, das Martyrium zu erdulden, wer wäre in der Gnade Gottes glücklicher gewesen als er, der so oftmals, wenn er kämpfte, den Sieg errang, und wenn er siegte, am Leben blieb? Wer wäre eifriger in guten Werken als Ijob, wer wäre in Versuchungen stärker, geduldiger im Schmerze, demütiger in der Furcht, wahrhaftiger im Glauben als er? Und doch hat Gott erklärt, nicht einmal ihre Bitten wolle er erhören. Als der Prophet Ezechiel für die Sünde des Volkes um Vergebung flehte, sprach er: „Wenn sich irgendein Land gegen mich verfehlt, so daß es eine Sünde begeht, so will ich meine Hand über dieses [Land] ausstrecken und die Stütze des Brotes zermalmen, und ich will Hunger hineinschicken und Menschen und Vieh von ihm hinwegnehmen. Und wären auch jene drei Männer in seiner Mitte: Noach und Daniel und Ijob, so werden sie weder Söhne noch Töchter befreien, nur sie selbst sollen unversehrt bleiben“. So sehr beruht alles, um das man bittet, nicht etwa auf der vorgreifenden Einbildung des Bittenden, sondern vielmehr auf der Entscheidung des Gebers, und nichts darf menschliche Meinung sich anmaßen und für sich in Anspruch nehmen, wenn nicht auch der göttliche Wille seine Zustimmung gibt.</p><p>Im Evangelium spricht der Herr und sagt: „Wer mich bekennet vor den Menschen, den will auch ich bekennen vor meinem Vater, der im Himmel ist; wer mich aber verleugnet, den werde auch ich verleugnen“. Verleugnet er den, der ihn verleugnet, nicht, dann bekennt er auch nicht den, der ihn bekennt. Das Evangelium kann nicht in einem Teile bestehen und in dem anderen Teile wanken. Entweder muß beides seine Geltung behalten, oder es muß beides die Kraft der Wahrheit verlieren. Sind die Verleugnenden eines Verbrechens nicht schuldig, dann empfangen auch die Bekennenden keinen Lohn für ihr Verdienst. Wird hingegen der Glaube gekrönt, der gesiegt hat, dann muß unbedingt auch der Unglaube bestraft werden, der unterlegen ist. So vermögen also die Märtyrer entweder nichts, falls das Evangelium seine Gültigkeit verlieren kann, oder es können, wenn das unmöglich ist, nicht dieselben dem Evangelium zuwider handeln, die auf Grund des Evangeliums zu Märtyrern werden. Keiner, geliebteste Brüder, keiner trete der Würde der Märtyrer zu nahe, keiner raube ihnen ihren Ruhm und ihre Krone! Ungeschwächt bleibt die Stärke ihres unverletzten Glaubens, und wider Christus kann der nichts reden und tun, dessen Hoffnung und Glaube, dessen Verdienst und Ruhm gänzlich auf ihm beruht. Daß die Bischöfe gegen Gottes Gebot handeln, können solche nicht verlangen, die selbst Gottes Gebote erfüllt haben. Oder gibt es einen, der größer wäre als Gott oder barmherziger als Gottes Güte und der das ungeschehen wünschte, was Gott geschehen ließ, oder sich einbildete, uns durch seine Hilfe retten zu können, gleich als ob Gott zu wenig Macht hätte, um seine Kirche zu schützen?</p><p>Wenn nun dies nicht etwa ohne Wissen Gottes geschehen oder all das ohne seine Erlaubnis so gekommen ist, so möge die göttliche Schrift die Ungelehrigen belehren und die Vergeßlichen erinnern, die da spricht und sagt: „Wer hat Jakob übergeben zur Plünderung und Israel den Räubern? War es nicht Gott, an dem sie gesündigt haben? Und sie wollten nicht auf seinen Wegen wandeln und nicht hören auf sein Gesetz. Und er hat über sie ausgeschüttet den Grimm seines Zornes“. Und an einer anderen Stelle bezeugt sie und sagt: „Ist etwa die Hand Gottes nicht stark genug, zu retten, oder hat er sein Ohr taub gemacht, daß er nicht höre? Nein, eure Sünden stehen trennend zwischen euch und Gott, und wegen eurer Sünden wendet er sein Antlitz von euch ab, damit er sich nicht erbarme“. Laßt uns lieber unsere Sünden betrachten, laßt uns die Geheimnisse unseres Denkens und Handelns durchforschen und die Schuld unseres Gewissens prüfen! Wollen wir es uns ins Bewußtsein zurückrufen, daß wir nicht gewandelt sind auf den Wegen des Herrn, daß wir das Gesetz Gottes verworfen haben, daß wir seine heilsamen Gebote und Mahnungen niemals haben beobachten mögen!</p><p>Was kann man von dem Gutes denken, wie kann man Gottesfurcht, wie kann man Glauben bei dem voraussetzen, den nicht einmal die Angst zu bessern vermochte, den auch die Verfolgung nicht umgewandelt hat? Der hocherhobene Nacken beugte sich nicht einmal deshalb, weil er gefallen war; der stolze, übermütige Sinn ließ sich nicht einmal dadurch brechen, daß er unterlag. Der Gestürzte droht den Stehenden, der Verwundete den Unverletzten, und weil er nicht sofort den Leib des Herrn mit seinen besudelten Händen empfangen oder das Blut des Herrn mit seinem befleckten Munde trinken darf, zürnt der Gottesschänder den Gottesdienern. Und so grollst du – welch gewaltige Torheit, du Rasender! – gerade ihm, der sich bemüht, den Zorn Gottes von dir abzuwenden, und du drohst dem, der für dich die Barmherzigkeit des Herrn erfleht, der deine Wunde fühlt, für die du selbst kein Gefühl hast, der für dich die Tränen vergießt, die du selbst vielleicht nicht fließen lässest. Du vergrößerst und häufst nur noch deine Schuld, und während du selbst gegen die Vorsteher und Priester Gottes unversöhnlich bleibst, bildest du dir ein, der Herr könne sich mit dir versöhnen lassen?</p><p>Vernimm und beherzige doch lieber unsere Worte! Warum hören deine tauben Ohren nicht auf die heilsamen Mahnungen, die wir dir geben? Warum sehen deine blinden Augen nicht den Weg der Buße, den wir dir zeigen? Warum will dein verschlossener und betörter Sinn nichts wissen von den lebenspendenden Heilmitteln, die wir auf Grund der himmlischen Schriften lehren und lernen? Oder wenn einige Ungläubige weniger an die Zukunft glauben, so mögen sie sich wenigstens durch die Gegenwart schrecken lassen! Seht nur: welche Strafen werden vor unseren Augen über die verhängt, die geleugnet haben! Welch trauriges Ende haben wir an ihnen zu beweinen! Nicht einmal hier auf Erden können sie ungestraft bleiben, obwohl noch gar nicht der Tag des Gerichts gekommen ist. Nur ein Teil allerdings wird einstweilen zur Strafe gezogen, damit die übrigen sich danach richten. Ein warnendes Beispiel aber für alle sind die Qualen dieser wenigen.</p><p>Einer von ihnen, der aus freien Stücken auf das Kapitol hinaufstieg, um abzuleugnen, wurde stumm, gleich nachdem er Christus verleugnet hatte. Die Strafe begann da, wo auch das Verbrechen seinen Ausgang genommen hatte, und der Bestrafte konnte nicht einmal mehr [um Vergebung] bitten, da er keine Worte hatte, um Barmherzigkeit zu erflehen. Eine andere, die gerade in den Bädern weilte – denn das fehlte noch zu ihrer Schuld und ihrem Elend, daß sie, die die Gnade des lebenspendenden Bades verloren hatte, auch noch sogleich in die Bäder eilte! –, wurde dort, unrein, wie sie war, von einem unreinen Geiste ergriffen und zerbiß sich mit den Zähnen die Zunge, mit der sie Ruchloses gegessen oder Gotteslästerliches gesprochen hatte. Nach dem Genuß der frevelhaften Speise waffnete sich die Wut ihres Mundes zum eigenen Verderben. Sie wurde ihre eigene Mörderin und konnte danach nicht mehr lange am Leben bleiben; unter qualvollen Schmerzen im Leib und in den Eingeweiden gab sie ihren Geist auf.</p><p>Vernehmt weiter einen Fall, der sich in meiner Gegenwart und vor meinen eigenen Augen zugetragen hat! Ein Elternpaar, das sich gerade flüchtete und in seiner Angst die nötige Vorsicht vergaß, ließ unter der Pflege einer Amme sein kleines Töchterchen zurück. Die Amme aber brachte das ihr überlassene Kind vor die Behörden. Hier gab man ihm vor einem Götzenbilde, bei dem das Volk zusammenströmte – denn bei seinem jugendlichen Alter konnte es noch kein Fleisch essen –, ein Stückchen Brot, in Wein getaucht, der jedoch gleichfalls von dem Opfer der Verlorenen noch übrig war. Später nahm die Mutter ihre Tochter wieder zu sich; allein das Mädchen konnte den begangenen Frevel ebensowenig erzählen und mitteilen, als es ihn seinerzeit hätte verstehen und verhindern können. Aus Unkenntnis also geschah es unvermerkt, daß die Mutter ihr Kind zu unserem Opfer mitbrachte. Als nun aber das Mädchen inmitten der Gemeinschaft von Unbefleckten sich fand, da vermochte es unsere Bitten und Gebete nicht zu ertragen, sondern brach bald in lautes Weinen aus, bald warf es sich, von innerer Unruhe ergriffen, stürmisch hin und her. Wie unter dem Zwang der Folter gab die noch in den Jahren kindlicher Einfalt stehende unwissende Seele die Beteiligung an der Tat durch alle möglichen Anzeichen zu erkennen. Als dann gar nach der Beendigung der Feier der Diakon damit begann, den Anwesenden den Kelch zu reichen, und, indem die anderen ihn empfingen, die Reihe auch an die Kleine kam, da wandte sie auf Eingebung der göttlichen Majestät ihr Gesicht ab, preßte den Mund und die Lippen fest zusammen und wies den Kelch zurück. Der Diakon jedoch gab nicht nach und goß ihr, so sehr sie sich auch sträubte, etwas von dem heiligen Inhalt des Kelches hinein, Da stellte sich heftiger Schlucken mit Erbrechen ein. In dem entweihten Körper und Munde konnte unmöglich die Eucharistie bleiben, und den im Blute des Herrn geheiligten Trank mußte der schuldbefleckte Magen wieder von sich geben. So groß ist die Macht des Herrn, so groß seine Majestät! Die Geheimnisse der Dunkelheit wurden unter den Strahlen seines Lichtes enthüllt, dem Priester Gottes blieben selbst die versteckten Verbrechen nicht verborgen.</p><p>Dies trug sich mit einem Kinde zu, das noch nicht das Alter hatte, um das von einem anderen an ihm begangene Verbrechen kundzutun. Bei einer Frau hingegen, die schon in vorgerückterem Alter und reiferen Jahren stand und sich bei unserem Opfer einschlich wirkte die [heilige] Speise, die sie genoß, wie ein Dolch, und wie wenn sie irgendein tödliches Gift in Hals und Brust aufgenommen hätte, bekam sie Beklemmungen und danach Erstickungsanfälle, wobei ihr Atem keuchend ging. Und unter dem Drucke nicht mehr der Verfolgung, sondern ihres eigenen Verbrechens brach sie zuckend und zitternd zusammen. Nicht lange blieb das Verbrechen, daß sie ihre Schuld verheimlicht hatte, ungestraft und verborgen. Sie, die den Menschen getäuscht hatte, mußte Gottes Rache fühlen. Und als eine andere Frau ihr Kästchen, in dem sie den heiligen Leib des Herrn aufbewahrt hatte, mit ihren unreinen Händen zu öffnen versuchte, schlug Feuer daraus hervor, und sie erschrak so, daß sie ihn nicht zu berühren wagte. Und auch ein anderer, der gleichfalls befleckt war, sich aber dennoch erlaubte, nach der Feier des Opfers durch den Priester einen Teil gleich den übrigen heimlich in Empfang zu nehmen, vermochte den heiligen Leib des Herrn nicht zu genießen und zu berühren: als er die Hände öffnete, fand er, daß er Asche darin trug. An dem Beispiel dieses einen hat es sich gezeigt, daß der Herr entschwindet, wenn er verleugnet wird, und daß dem Unwürdigen das, was er sich nimmt, nicht zum Heile dient, da das Heilige entweicht und die heilbringende Gnade sich in Asche verwandelt. Wie viele werden täglich von unreinen Geistern erfüllt, indem sie keine Buße tun und die Schuld ihres Verbrechens nicht bekennen! Wie viele werden bis zu geistiger Umnachtung verblendet und mit Raserei und Wahnsinn geschlagen! Doch es ist nicht nötig, das Ende einzelner zu erzählen, da bei dem mannigfaltigen Verderben, das über die Welt hereinbricht, die Strafe für die Sünden ebenso verschiedenartig ausfällt, wie die Menge der Sünder zahlreich ist. Ein jeder beherzige, nicht was ein anderer zu erleiden hatte, sondern was er selbst zu erleiden verdient, und er glaube nicht schon glücklich entronnen zu sein, wenn ihn vorerst die Strafe noch verschont hat, denn gerade der muß nur um so mehr in Angst sein, den der Zorn des richtenden Gottes sich noch zurückbehalten hat.</p><p>Vor der Einbildung, als ob sie weniger Buße zu tun brauchten, mögen sich auch die anderen hüten, die zwar nicht ihre Hände mit verbrecherischen Opfern besudelt, wohl aber ihr Gewissen durch Opferzeugnisse befleckt haben. Auch dies ist das Bekenntnis eines Verleugners, das Geständnis eines Christen, der das in Abrede stellt, was er gewesen war. Er hat behauptet, all das getan zu haben, was in Wirklichkeit ein anderer begangen hat, und obwohl geschrieben steht: „Ihr könnt nicht zwei Herren dienen“, hat er dem weltlichen Herrn gedient, hat er seinem Gebot Folge geleistet und der menschlichen Obrigkeit mehr gehorcht als seinem Gott. Mag er zusehen, ob ihm die Veröffentlichung seines Vergehens in den Augen der Menschen vielleicht weniger Schande oder Vorwürfe einträgt: Gott jedoch, seinem Richter, wird er nicht entfliehen und entrinnen können. Sagt doch der Heilige Geist in den Psalmen: „Was unvollendet an mir ist, sahen Deine Augen, und in Deinem Buche werden alle eingeschrieben werden“. und wiederum: „Der Mensch sieht auf das Äußere, Gott aber in das Herz“.. Und auch der Herr selbst mahnt und bereitet uns vor mit den Worten: „Und alle Gemeinden werden erkennen, daß ich es bin, der Nieren und Herz durchforscht“. Er durchforscht das Verborgene und sieht das Geheime und Versteckte, und keiner vermag den Augen Gottes zu entgehen, der da sagt: „Ich bin ein Gott, der nahe ist, und nicht ein Gott von ferne her. Wenn ein Mensch sich verborgen hält im Verborgenen, werde ich ihn deshalb nicht sehen? Erfülle ich nicht Himmel und Erde?“ Er sieht in das Herz und in die Brust eines jeden, und er, der nicht nur über unsere Handlungen, sondern auch über unsere Worte und Gedanken richten wird, erblickt die Gesinnungen und die Wünsche, die jeder einzelne hegt, selbst in den innersten Winkeln des noch verschlossenen Herzens.</p><p>Wieviel größer ist demnach der Glaube, wieviel besser die Gottesfurcht derer, die sich zwar durch kein wirkliches Opfer oder Opferzeugnis eines Vergehens schuldig gemacht haben, die aber dennoch, weil sie daran vielleicht nur dachten, dies allein schon vor den Priestern Gottes mit Betrübnis und Aufrichtigkeit bekennen und ein Geständnis ihrer Schuld ablegen, die sich der auf ihrem Herzen ruhenden Last entledigen und für ihre wenn auch nur kleinen und unbedeutenden Wunden rettende Heilung suchen! Sie wissen eben, daß geschrieben steht: „Gott läßt sich nicht verspotten“. Unmöglich ist es, Gott zu verspotten und zu hintergehen oder durch irgendwelche trügerische Arglist irrezuführen. Ja, nur noch schwerer versündigt der sich, der Gott nach menschlicher Art sich vorstellt und der Strafe für seinen Frevel zu entgehen glaubt, wenn er das Verbrechen nicht öffentlich begangen hat. Christus sagt in seinen Geboten: „Wer sich meiner schämt, dessen wird sich auch des Menschen Sohn schämen“ und da hält sich noch einer für einen Christen, der sich schämt oder scheut, ein Christ zu sein? Wie kann denn der mit Christus sein, der darüber errötet oder sich fürchtet, Christus anzugehören? Mag er immerhin weniger schwer sich versündigt haben, weil er die Götzenbilder nicht ansah und nicht unter den Augen des herumstehenden und höhnenden Volkes die Heiligkeit des Glaubens entweihte, weil er nicht seine Hände mit den unheilvollen Opfern besudelte und seinen Mund nicht mit den verruchten Speisen befleckte. Das hilft ihm so viel, daß seine Schuld geringer ist, nicht aber, daß sein Gewissen völlig rein wäre. Er kann leichter Verzeihung für sein Vergehen erlangen, aber er ist dennoch nicht frei von Schuld. Und er lasse ja nicht ab, Buße zu tun und die Barmherzigkeit des Herrn anzuflehen, damit nicht seine Sünde, wenn er die Genugtuung verabsäumt, um soviel schwerer wird, als sie ihrer Beschaffenheit nach leichter erscheint!</p><p>Jeder – ich bitte euch, liebe Brüder! – bekenne seine Sünde, solange, er, der gesündigt hat, noch auf der Welt ist, solange sein Bekenntnis noch angenommen werden kann, solange noch seine Genugtuung und die durch die Priester gewährte Vergebung bei dem Herrn genehm ist. Wollen wir uns von ganzem Herzen an den Herrn wenden und Gottes Barmherzigkeit anflehen, indem wir der Buße über unsere Sünde in aufrichtigem Schmerze Ausdruck geben! Vor ihm beuge sich unsere Seele, ihm leiste unsere Trauer Genugtuung, auf ihn werfe sich all unsere Hoffnung! Wie wir bitten sollen, das sagt er selbst: „Bekehret euch zu mir“, spricht er, „aus eurem ganzen Herzen und zugleich mit Fasten und Weinen und Wehklagen, und zerreißet eure Herzen und nicht eure Kleider!“. Zum Herrn also laßt uns von ganzem Herzen zurückkehren, seinen Zorn und Grimm laßt uns nach seiner eigenen Mahnung mit Fasten, Weinen und Wehklagen beschwichtigen!</p><p>Glauben wir, daß der von ganzem Herzen jammert und mit Fasten, Weinen und Wehklagen den Herrn anfleht, der vom ersten Tage seines Vergehens an tagtäglich die Bäder besucht, der lieber an üppiger Tafel schwelgt und mit allzu reichlichen Speisen sich den Magen überlädt, so daß er tags darauf noch das Unverdaute von sich gibt, anstatt Speise und Trank mit der Not der Armen zu teilen? Beweint etwa der seinen Tod, der heiter und fröhlich einhergeht und, obwohl geschrieben steht: „Ihr sollt die Gestalt eures Bartes nicht entstellen“, den Bart zustutzt und sein Gesicht herausputzt? Und da sucht jetzt einer, der Gott mißfällt, noch jemand anderem zu gefallen? Oder seufzt und wehklagt etwa sie, die zwar Muße findet, sich in kostbare Prachtgewänder zu kleiden, aber nicht, an das Kleid Christi zu denken, das sie verloren hat; die zwar Zeit hat, wertvollen Schmuck und feingearbeitetes Geschmeide anzulegen, aber nicht, den Verlust des göttlichen und himmlischen Schmuckes zu beweinen? Magst du auch fremdländische Gewänder und seidene Kleider anlegen, du bleibst dennoch nackt; magst du auch mit Gold und Perlen und Edelsteinen dich schmücken, ohne den Schmuck Christi bist du dennoch häßlich. Und während du sonst deine Haare färbst, laß wenigstens jetzt in deinem Schmerz davon ab, und wenn du sonst mit schwarzem Pulver die Linien deiner Augenbrauen nachziehst, bade wenigstens jetzt deine Augen in Tränen! Hättest du eines deiner Lieben durch einen Todesfall verloren, so würdest du gar betrübt seufzen und weinen, du würdest dein Gesicht ungepflegt lassen und Trauerkleider anlegen, du würdest dein Haar vernachlässigen, eine traurige Miene zeigen, dein Haupt senken und durch diese Zeichen deine Trauer zu erkennen geben. Deine eigene Seele ist es, du Unglückliche, die du verloren hast, geistig bist du gestorben, und du hast angefangen, hier dich selbst zu überleben und im Umherwandeln deine eigene Leiche herumzutragen: und du ringst nicht voll Verzweiflung die Hände, du mußt nicht in einem fort seufzen, du hältst dich nicht verborgen aus Scham über dein Vergehen, oder um dich ohne Unterbrechung den Wehklagen hinzugeben? Siehe, das sind noch ärgere Wunden der Sünde, das sind noch größere Verbrechen, wenn man gesündigt hat und dann keine Genugtuung leistet, wenn man sich vergangen hat und dann die Vergehungen nicht einmal beweint.</p><p>Hananias, Azarja und Mischael, diese edlen, vornehmen Jünglinge, ließen nicht einmal inmitten der Flammen und im glühenden Brande des lodernden Ofens davon ab, vor Gott das Bekenntnis ihrer Sünden abzulegen. Obwohl sie ein gutes Gewissen hatten und sich oftmals durch ihren Gehorsam im Glauben und in der Furcht bei dem Herrn Verdienste erworben hatten, so hörten sie auch inmitten der ruhmvollen Martern, die sie um ihrer Tugenden willen zu erdulden hatten, dennoch nicht auf, an der Demut festzuhalten und Gott Genugtuung zu leisten. Die göttliche Schrift spricht und sagt: „Stehend betete Azarja und öffnete seinen Mund und legte Gott sein Bekenntnis ab zugleich mit seinen Genossen mitten im Feuer“. Auch Daniel sucht sich noch durch Fasten Gottes Huld zu erwerben, auch nachdem sein Glaube und seine Unschuld vielfach Gnade gefunden, auch nachdem ihm der Herr ob seiner Tugenden und Verdienste des öfteren seine Anerkennung wiederholt hat; in Sack und Asche wälzt er sich, indem er schmerzbewegt sein Bekenntnis ablegt und sagt: „Ach Herr, Du großer, starker und furchtbarer Gott, der Du Bund und Erbarmen hältst denen, die Dich lieben und Deine Gebote halten, wir haben gesündigt wir haben Unrecht getan, wir sind gottlos gewesen, wir haben Deine Gebote und Deine Satzungen übertreten und verlassen, wir haben nicht gehört auf die Worte Deiner Diener, der Propheten, die sie in Deinem Namen über unsere Könige und alle Völker und über die ganze Erde gesprochen haben. Dein, Herr, Dein ist die Gerechtigkeit, uns aber gebührt Scham“.</p><p>Dies haben Sanftmütige, dies haben Herzenseinfältige, dies haben Unschuldige getan, um sich bei der göttlichen Majestät Verdienste zu erwerben; und jetzt weigern sich solche, dem Herrn Genugtuung zu leisten und ihn anzuflehen, die ihn verleugnet haben! Ich bitte euch, ihr Brüder, bleibt bei den segenbringenden Heilmitteln, gehorchet den besseren Ratschlägen, verbindet eure Tränen mit den unseren, mit unseren Seufzern vereinigt eure eigenen! Euch bitten wir, um für euch den Herrn bitten zu können; und mit dem gleichen Flehen, mit dem wir Gott um Erbarmen für euch angehen, wenden wir uns zuerst an euch. Tut volle Buße und laßt die Betrübnis eines schmerzbewegten und wehklagenden Herzens erkennen!</p><p>Laßt euch auch nicht beeinflussen durch den unvorsichtigen Irrtum oder eitlen Unverstand von einigen, die, obwohl mit so schwerer Schuld behaftet, derart mit Geistesblindheit geschlagen sind, daß sie ihre Vergehen weder einsehen noch beklagen! Das ist nur eine noch größere Strafe des zürnenden Gottes, wie geschrieben steht: „Und Gott gab ihnen den Geist der Verblendung“, und wiederum: „Die Liebe zur Wahrheit haben sie nicht angenommen, auf daß sie selig würden. Und deshalb schickt ihnen Gott das Wirken des Irrtums, so daß sie der Lüge glauben, damit alle gerichtet werden, die der Wahrheit nicht geglaubt haben, sondern sich in der Ungerechtigkeit gefallen“. Die in der Ungerechtigkeit sich gefallen und durch die Verrücktheit ihres verblendeten Sinnes betört sind, die verachten die Gebote des Herrn, vernachlässigen die Heilung der Wunde und wollen nichts von Buße wissen. Vor dem Begehen der Sünde unvorsichtig, nach der Sünde verstockt, zuerst ohne festen Halt und nachher ohne demütiges Flehen, lagen sie am Boden, als sie aufrecht hätten stehen sollen, und bilden sich ein, zu stehen, wenn sie vor Gott sich niederwerfen und am Boden liegen sollten. Den Frieden haben sie eigenmächtig sich selbst angeeignet, ohne daß ihn jemand ihnen gegeben hätte; durch falsche Verheißung verleitet und mit Abtrünnigen und Treulosen im Bunde, nehmen sie den Irrtum an für die Wahrheit, halten sie die Gemeinschaft mit solchen für gültig, die selbst an der Gemeinschaft gar nicht teilhaben, und glauben den Menschen gegenüber Gott, obwohl sie doch Gott nicht glauben wollten gegenüber den Menschen.</p><p>Derartige Menschen fliehet, so viel ihr könnt: sie, denen das verderbliche Gift der Ansteckung anhaftet, meidet in heilsamer Scheu! Ihre Rede frißt um sich wie der Krebs, ihr Gespräch greift weiter wie eine Seuche, ihre schädliche und vergiftete Überredungskunst bringt schlimmeren Tod als die Verfolgung selbst. Dort bleibt wenigstens die Buße noch übrig, um Genugtuung zu leisten. Wer aber die Buße für das Vergehen aufhebt, der versperrt den Weg der Genugtuung. So kommt es, daß die Hoffnung auf das wahre Heil zunichte wird, indem durch die Leichtfertigkeit gewisser Leute ein falsches Heil verheißen wird oder Glauben findet.</p><p>Ihr aber, liebe Brüder, deren Furcht auf den Herrn gerichtet ist und deren Seele selbst nach dem Sturz ihres Unglücks gedenkt, prüfet voll Reue und Schmerz eure Sünden, erkennet die schwere Schuld eures Gewissens, öffnet die Augen des Herzens, um euer Vergehen einzusehen, ohne an der Barmherzigkeit des Herrn zu verzweifeln, aber auch ohne bereits im voraus seine Verzeihung euch anzumaßen! So gnädig und gütig Gott stets in seiner väterlichen Liebe ist, so sehr ist er in seiner Majestät als Richter zu fürchten. So schwer unsere Vergehen gewesen sind, so bitterlich laßt sie uns beweinen! Wollen wir es nicht an einer sorgfältigen und anhaltenden Heilung der tiefen Wunde fehlen lassen: die Buße darf nicht geringer sein als das Vergehen! Glaubst du, Gott läßt sich so schnell versöhnen, er, den du in treulosen Worten verleugnet, dem du lieber Hab und Gut vorgezogen und dessen Tempel du durch gottlose Befleckung entweiht hast? Glaubst du, der erbarme sich deiner so leicht, den du als den Deinigen abgelehnt hast? Um so inständiger gilt es jetzt zu bitten und zu beten, den Tag in Trauer zu verleben, die Nächte wachend und weinend zu verbringen, jeden Augenblick mit tränenvollen Wehklagen auszufüllen, hingestreckt am Boden zu liegen, in Sack und Asche und im Schmutze sich zu wälzen, nach dem Verlust des Gewandes Christi nach keinem Kleid mehr zu verlangen, nach dem Genuß der Speise des Teufels lieber zu fasten, gerechten Werken obzuliegen, wodurch die Sünden getilgt, und häufig Almosen zu spenden, wodurch die Seelen von dem Tode befreit werden. Was der Widersacher euch rauben wollte, das möge Christus empfangen, und Hab und Gut, wodurch man sich hat betrügen und überwinden lassen, darf man nicht mehr festhalten und lieben. Wie einen Feind gilt es den Besitz zu meiden, wie einen Räuber ihn zu fliehen, wie Dolch und Gift haben ihn die Besitzenden zu fürchten. Nur dazu möge die noch verbliebene Habe dienen, daß man sich damit von Verbrechen und Schuld loskaufe! Unverzüglich und reichlich gilt es Wohltätigkeit zu üben, das ganze Vermögen zur Heilung der Wunde zu verwenden und unsere Reichtümer und Schätze dem Herrn auf Zinsen zu leihen, der über uns dereinst richten wird. So lebendig war der Glaube zur Zeit der Apostel, so treu hielt die erste Gemeinde der Gläubigen die Gebote Christi: sie waren willig, sie waren freigebig; alles gaben sie hin zur Verteilung durch die Apostel, und doch hatten sie keine solchen Vergehen zu tilgen.</p><p>Wenn einer von ganzem Herzen sein Flehen vorbringt, wenn er mit aufrichtigen Klagen und mit Tränen der Reue seufzt, wenn er durch gerechte und beständige Werke den Herrn um Verzeihung seines Vergehens zu bewegen sucht, so kann er über solche sich erbarmen, er, der ja auch seine Barmherzigkeit kundgegeben hat mit den Worten: „Wenn du dich bekehrst und seufzest, dann wirst du gerettet werden und wirst wissen, wo du gewesen bist“, und wiederum: „Ich will nicht den Tod des Sterbenden, spricht der Herr, sondern vielmehr, daß er umkehre und lebe“. Auch der Prophet Joel verkündet die Güte des Herrn nach der Mahnung des Herrn selbst: „Kehret zurück“, sagt er, „zu dem Herrn, eurem Gott; denn er ist barmherzig und gütig und geduldig und von reichem Erbarmen und ändert sein Urteil gegen verhängtes Leid“. Er kann Nachsicht gewähren, er kann sein Urteil abändern. Dem Reumütigen, dem Wohltätigen, dem Bittenden kann er gnädig verzeihen, er kann all das zugute rechnen, was für einen solchen die Märtyrer erfleht und die Priester getan haben. Oder wenn ihn einer mehr durch seine eigene Genugtuung gerührt, wenn er seinen Grimm, wenn er die Erbitterung des Zürnenden durch gebührende Abbitte besänftigt hat, dann reicht er auch wieder die Waffen dar, um den Unterlegenen damit zu rüsten, dann erfrischt und stärkt er seine Kräfte, um damit den erneuerten Glauben wieder zu beleben. Von neuem wird der Krieger seinen Kampf aufnehmen, er wird die Schlacht wieder beginnen und den Feind herausfordern, und zwar tüchtiger geworden für den Kampf durch den Schmerz. Wer in dieser Weise Gott Genugtuung geleistet, wer aus Reue über seine Tat, wer aus Scham über sein Vergehen gerade aus dem Schmerz über seinen Fall mehr Kraft und größere Glaubenstreue gewonnen hat, der wird, erhört und unterstützt von dem Herrn, die Kirche fröhlich machen, die er vor kurzem so betrübt hatte, und er wird nicht nur die Verzeihung Gottes sich erwerben, sondern die Krone.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Julius Baer, <em>Über die Gefallenen</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-42/versions/uber-die-gefallenen-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "hag3Fns9_О_молитве_Господней__Киприан_Карфагенский"
