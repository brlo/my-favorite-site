    path: "Cyprian_De_zelo"
    title: "Über Eifersucht und Neid"
    menu: { parent: "Abhandlungen", title: "Über Eifersucht und Neid", priority: 12 }
    update: true
    body: |-
      <p><em>Über Eifersucht und Neid, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Eifersüchtig zu sein auf das Gute, das man sieht, und die Besseren zu beneiden, erscheint manchen nur als ein leichtes und geringes Vergehen, geliebteste Brüder, und indem man es nur für leicht und gering hält, fürchtet man es nicht, indem man es nicht fürchtet, achtet man nicht darauf, indem man nicht darauf achtet, läßt es sich nur schwer meiden, und so entsteht daraus ein verborgenes und verstecktes Unheil, das die unvorsichtigen Herzen unvermerkt zugrunde richtet; denn man durchschaut es zu wenig, als daß man sich vorsichtig davor hüten könnte. Nun hat doch aber der Herr uns befohlen, klug zu sein, und uns eingeschärft, mit ängstlicher Sorge zu wachen, damit nicht unser Widersacher, der selbst stets wachsam ist und beständig lauert, die Funken zum Brand entfache, sobald er in die Brust sich eingeschlichen hat, damit er nicht aus Kleinem Großes mächtig aufhäufe und durch Sturm und Wetter, die er erregt, den Zusammensturz des Glaubens und des Heiles und den Schiffbruch des Lebens herbeiführe, indem er die Lässigen und Arglosen mit milderem Hauch und sanfterem Wehen umschmeichelt. Auf der Hut zu sein, gilt es also, geliebteste Brüder, und mit allen Kräften darauf hinzuarbeiten, daß wir dem wütenten Feinde, der seine Geschosse gegen alle Teile unseres Körpers richtet, an denen wir zu treffen und zu verwunden sind, mit sorgsamer und unermüdlicher Wachsamkeit Widerstand leisten, wie der Apostel Petrus in seinem Briefe mahnt und lehrt mit den Worten: „Seid nüchtern und wachet; denn euer Widersacher, der Teufel, geht umher wie ein brüllender Löwe und sucht etwas zu verschlingen!"</p><p>Er schleicht um jeden, von uns herum, und wie ein Feind, der die wohlverwahrten Mauern [einer Stadt] belagert, forscht und sucht er, ob nicht vielleicht irgendein Teil unserer Glieder weniger stark und weniger zuverlässig ist, um hier Zugang zu finden und ins Innere einzudringen. Unseren Augen bietet er verführerische Bilder und lockende Genüsse dar, um durch ihren Anblick die Keuschheit zu zerstören. Die Ohren bezaubert er durch liebliche Musik, um durch das Anhören der allzu süßen Töne den starken christlichen Sinn zu entkräften und zu verweichlichen. Die Zunge reizt er durch Beschimpfung, die Hand treibt er durch herausfordernde Kränkungen zu unbedachtem Mord an. Um den Menschen zum Betrüger zu machen, stellt er ihm ungerechten Gewinn in Aussicht, um seine Seele durch Geld zu berücken, überhäuft er ihn mit unheilvollen Schätzen. Irdische Ehren verheißt er ihm, um ihm die himmlischen zu rauben. Er spiegelt ihm Falsches vor, um ihm unvermerkt die Wahrheit zu entziehen, und wenn er nicht heimlich täuschen kann, dann droht er ganz frei und offen, indem er den Schrecken stürmischer Verfolgung schickt, stets voll Unruhe und Feindschaft darauf bedacht, die Diener Gottes zu bekriegen, voll Tücke im Frieden, voll Gewalttätigkeit in der Verfolgung.</p><p>Deshalb, geliebteste Brüder, muß gegen alle tückischen Nachstellungen oder offenen Drohungen des Teufels der Geist wohlgerüstet und bewaffnet dastehen, stets zum Widerstand ebenso bereit, wie der Feind allezeit zum Angriff entschlossen ist. Und weil diejenigen seiner Geschosse häufiger sind, die unvermerkt eindringen, und infolge der mehr verborgenen und heimlichen Beschießung um so schwerer und häufiger uns treffen und verwunden, je weniger man sie bemerkt, so laßt uns wachen, um auch sie wahrzunehmen und abzuwehren! Zu ihnen gehört das Laster der Eifersucht und des Neides. Denn wenn einer dieses Übel genau besieht, so wird er finden, daß ein Christ vor nichts sich mehr hüten, vor nichts sich sorgfältiger vorsehen muß als davor, daß ihn etwa Mißgunst und Neid bestricke und daß er in die verborgenen Schlingen des trügerischen Feindes verwickelt, ohne es selbst zu merken, durch sein eigenes Schwert falle, indem er aus Eifersucht sich zum Haß gegen den eigenen Bruder verleiten läßt. Um dies vollständiger überblicken und deutlicher einsehen zu können, wollen wir auf die Quelle und den Ursprung dieses Übels zurückgehen! Sehen wir zu, wo, wann und wie die Eifersucht ihren Anfang genommen hat! Denn ein so verderbliches Laster wird für uns leichter zu meiden sein, wenn man den Ursprung sowie die Größe eben dieses Übels kennen lernt.</p><p>Nur dieses Laster ist der Grund, daß gleich zu Anbeginn der Welt der Satan selbst ins Verderben geriet und auch andere mit sich riß. Nachdem er, der sich seiner Hoheit als Engel rühmen konnte, er, der Gott lieb und wert gewesen, den Menschen nach Gottes Bild geschaffen sah, da brach er voll gehässigen Neides in Eifersucht aus. Dabei brachte er jedoch den anderen, von Eifersucht getrieben, nicht eher zu Fall, als bis er selbst zuvor durch Eifersucht gestürzt war; er wurde selbst gefangen, bevor er gefangen nahm, er ging selbst zugrunde, bevor er andere zugrunde richtete, und während er, vom Neid angestachelt, dem Menschen die Gnade der ihm verliehenen Unsterblichkeit entriß, verlor er auch selbst all das, was er ehedem gewesen war. Wie groß muß ein Übel sein, geliebteste Brüder, durch das ein Engel zu Fall kam, durch das jene hohe und herrliche Erhabenheit umgarnt und gestürzt werden konnte, durch das der Betrüger selbst betrogen wurde! Seitdem wütet die Mißgunst auf Erden, indem jeder, der durch den Neid dem Verderben geweiht ist, dem Lehrmeister des Verderbens willig folgt, indem jeder, der Eifersucht hegt, den Teufel nachahmt, wie geschrieben steht: „Durch den Neid des Teufels aber ist der Tod in die Welt gekommen. Ihn also ahmen alle nach, die auf seiner Seite stehen".</p><p>Nur daraus entsprang auch der erste Haß unter den neuen Brüdern, daraus der ruchlose Brudermord, indem der ungerechte Kain eifersüchtig wurde auf den gerechten Abel, indem der Böse den Guten voll Mißgunst und Neid verfolgte. Mit solcher Macht trieb die Wut der Eifersucht zur Vollendung der Untat, daß weder die Bruderliebe noch die Entsetzlichkeit des Verbrechens, weder die Furcht Gottes noch die Strafe für das Vergehen bedacht wurde. Gegen alles Recht wurde der erschlagen, der als erster Gerechtigkeit an den Tag gelegt hatte; Haß mußte der erdulden, der den Haß nicht kannte; in gottloser Weise wurde der ermordet, der selbst beim Tode keinen Widerstand leistete. Und auch daran, daß Esau mit seinem Bruder Jakob sich verfeindete, war nur Eifersucht schuld. Denn weil der eine den Segen des Vaters empfangen hatte, entbrannte durch die Flammen des Neides in dem anderen der Grimm der Verfolgung. Auch wenn Joseph von seinen eigenen Brüdern verkauft wurde, so ist der Grund für den Verkauf nur in der Eifersucht zu suchen. Denn nachdem er das Glück, das ihm in Traumerscheinungen verheißen worden war, ganz offen und ehrlich als Bruder seinen Brüdern kundgetan hatte, da verfiel ihr übelwollendes Herz dem Neide. Und daß König Saul den David haßte, daß er in oft wiederholten Verfolgungen den Unschuldigen, den Barmherzigen, den in milder Sanftmut Geduldigen zu töten wünschte, was trieb ihn anderes dazu an als der Stachel der Eifersucht? Nur weil das Volk voll Bewunderung mit rühmendem Beifall in Lobeserhebungen auf David sich erging, als er Goliath getötet und mit Gottes Hilfe und Gnade den mächtigen Feind vernichtet hatte, steigerte sich Sauls Neid darüber zu wütender Feindschaft und Verfolgung. Und um mich nicht zu lange mit der Aufzählung von Einzelbeispielen aufzuhalten, laßt uns nur den Untergang eines ganzen Volkes betrachten, das mit einem Male dem Verderben geweiht war! Sind die Juden nicht deshalb zugrunde gegangen, weil sie lieber Christus mit Neid verfolgen als an ihn glauben wollten? Indem sie die großen Wundertaten, die er vollbrachte, herabzusetzen suchten, ließen sie sich von blinder Eifersucht betören und vermochten nicht die Augen ihres Herzens zu öffnen, um das Göttliche zu erkennen.</p><p>In dieser Erwägung nun, geliebteste Brüder, laßt uns gegen dieses so verderbliche Übel wachsam und mutig unser Gott geweihtes Herz sichern! Möge der Tod anderer zu unserem Heile dienen, möge die Strafe der Unachtsamen die Vorsichtigen unversehrt erhalten! Niemand darf aber etwa glauben, dieses Übel beschränke sich nur auf eine Erscheinungsform oder es sei nur auf einen kleinen Raum und in enge Grenzen eingeschlossen. Nein, weithin erstreckt sich das vielgestaltige und verhängnisvolle Verderben der Eifersucht. Sie ist die Wurzel aller Übel, die Quelle alles Unheils, die Pflanzschule der Verbrechen und der Zündstoff zu Sünden. Aus ihr erhebt sich der Haß, aus ihr entspringt der Zorn. Zur Habsucht entflammt die Eifersucht, indem man mit dem Seinigen sich nicht mehr zu begnügen vermag, wenn man einen anderen sieht, der reicher ist. Den Ehrgeiz erregt die Eifersucht, wenn man einen anderen erblickt, der höher in Ehren steht. Wenn die Eifersucht unseren Sinn verblendet und das Innere unseres Herzens in ihren Bann zwingt, dann wird die Furcht Gottes verschmäht, die Lehre Christi mißachtet, dann wird an den Tag des Gerichtes nicht mehr gedacht. Da macht sich aufgeblasener Hochmut breit und erbitterte Wut, da treibt die Treulosigkeit ihr falsches Spiel, und die Ungeduld erregt den Sinn, da wütet die Zwietracht und entbrennt der Zorn, und wer einmal in fremde Gewalt geraten ist, der kann sich nicht mehr im Zaume halten und beherrschen. Durch sie [die Eifersucht] wird das Band des Friedens unseres Herrn zerrissen, durch sie wird die brüderliche Liebe verletzt, durch sie wird die Wahrheit gefälscht und die Einheit zerstört, durch sie läßt man sich zu Ketzereien und Spaltungen hinreißen, indem man die Priester anfeindet und die Bischöfe beneidet und indem man sich darüber beklagt, daß man nicht lieber selbst das Amt erhalten hat, oder es als unvereinbar mit seiner Würde ablehnt, einen anderen als seinen Vorgesetzten anzuerkennen. Deshalb zeigt man sich widerspenstig, deshalb lehnt man sich auf hochmütig aus Eifersucht und ein Opfer des Neides; aus Haß und Mißgunst feindet man nicht die Person des anderen an, sondern seine Würde.</p><p>Welch nagender Wurm aber ist es für die Seele, welch verzehrende Seuche für die Gedanken, welch fressender Rost für das Herz, auf die Tüchtigkeit oder das Glück des Nächsten eifersüchtig zu sein, das heißt: die eigenen Verdienste oder die göttlichen Wohltaten an ihm zu hassen, eines anderen Güter zum eigenen Schaden zu kehren, wegen der Erfolge angesehener Männer sich abzuquälen, den Ruhm anderer zu seiner eigenen Pein zu machen, sozusagen Henker auf seine eigene Seele zu hetzen und für seine Gedanken und Sinne Folterknechte herbeizurufen, um sich von ihnen bis aufs Blut mit Martern zerfleischen, um sich von ihnen die geheimsten Tiefen seines Herzens mit den „Krallen" der Mißgunst zerreißen zu lassen! Keine Speise kann solchen Menschen schmecken, kein Getränk ihnen munden. Nur Seufzen und Stöhnen und Jammern hört man beständig, und da Mißgünstige ihren Neid niemals ablegen, so wird ihr Herz Tag und Nacht bedrängt und ohne Unterlaß zerfleischt. Die anderen Übel haben doch wenigstens ihre Grenze, und jedes Vergehen, das begangen wird, ist mit seiner Ausführung eben zu Ende. Bei dem Ehebrecher hört das Verbrechen auf, sobald er die Schändung begangen hat, bei dem Wegelagerer kommt der Frevel zur Ruhe, sobald der Totschlag vollbracht ist, bei dem Räuber macht die Raubgier halt, sobald er in den Besitz der Beute gelangt ist, und auch dem Fälscher setzt die Vollführung seines Betrugs ein Ziel. Die Eifersucht aber hat keine Grenze, sie ist ein ununterbrochen fortdauerndes Übel, eine Sünde ohne Ende, und mit je besserem Erfolge der Beneidete vorwärts kommt, zu desto mächtigerem Brande entzünden sich bei dem Neidischen die Flammen der Mißgunst,</p><p>Daher die drohende Miene, der finstere Blick, daher die Blässe im Gesicht, das Zittern der Lippen, das Knirschen der Zähne, daher die wilden Reden, die zügellosen Schmähungen, daher die zu gewalttätigem Mord entschlossene Hand, die wenigstens mit dem Hasse eines wutentflammten Sinnes bewaffnet ist, wenn sie auch nicht gleich zum Schwerte greift. Und deshalb sagt der Heilige Geist in den Psalmen: „Sei nicht eifersüchtig auf den, der glücklich wandelt auf seinem Wege!“ und wiederum: „Es wird beobachten der Sünder den Gerechten und knirschen gegen ihn mit seinen Zähnen. Gott aber wird lachen über ihn; denn er sieht voraus, daß kommen wird dessen Tag”. Auf sie zeigt und weist der selige Apostel Paulus hin, wenn er sagt: „Natterngift ist unter ihren Lippen, und ihr Mund ist voll von Fluchen und Bitterkeit. Rasch sind ihre Füße zum Blutvergießen; Not und Elend ist auf den Wegen derer, die den Weg des Friedens nicht kennen, und Gottesfurcht ist nicht vor ihren Augen".</p><p>Viel leichter ist das Übel und viel geringer die Gefahr, wenn die Glieder durch das Schwert verwundet werden. Leicht ist die Heilung da, wo der Hieb deutlich sichtbar ist, und ein Übel, das man sieht, läßt sich mit Hilfe von Heilmitteln rasch der Genesung entgegenführen. Die Wunden der Eifersucht hingegen sind versteckt und verborgen und sind keinem Mittel der Heilkunst zugänglich, da sie sich in der geheimen Tiefe des Bewußtseins verschlossen haben, ohne daß das Leiden wahrnehmbar ist. Du, der du neidisch und mißgünstig bist, bist ja wohl zunächst hinterlistig, verderblich und feindselig gegen die, die du hassest; vor allem bist du aber doch der Feind deines eigenen Wohles. Wer es auch sein mag, den du mit deiner Eifersucht verfolgst, er wird sich vor dir flüchten und hüten können; du aber kannst dir selbst unmöglich entfliehen. Wo immer du auch weilst, dein Widersacher ist bei dir, der Feind wohnt stets in deiner Brust, das Verderben ist in deinem Innern eingeschlossen. In unlösbar verschlungenen Ketten liegst du gebunden und gefesselt; du bist der Gefangene der Eifersucht, die dich beherrscht, und kein Trost kann dir helfen. Ein nie endendes Übel ist es, einen Menschen zu verfolgen, der der Gnade Gottes untersteht; ein unheilbares Unglück ist es, einen Glücklichen zu hassen.</p><p>Und deshalb, geliebteste Brüder, hat der Herr dieser Gefahr vorgebeugt, damit keiner durch die Eifersucht auf seinen Bruder in die Schlingen des Todes gerate, und auf die Frage seiner Jünger, wer unter ihnen der Größte sei, zur Antwort gegeben: „Wer der Kleinste unter euch allen ist, der wird groß sein„. Alle Eifersucht hat er durch seine Antwort abgeschnitten, alle Ursache und allen Stoff zu bissigem Neid hat er zerstört und entfernt. Einem Jünger Christi ist es nicht erlaubt, Eifersucht zu zeigen, ist es nicht gestattet, Neid zu hegen. Um Erhöhung kann es bei uns keinen Wettstreit geben. Aus der Niedrigkeit wachsen wir ja zu Hohem empor. Wir haben also gehört, wodurch wir gefallen können. So lehrt und mahnt auch der Apostel Paulus: wir, die wir durch Christi Licht erleuchtet dem Dunkel des nächtlichen Wandels entronnen sind, sollten in den Taten und Werken des Lichtes wandeln, indem er schreibt und sagt: „Die Nacht ist vorübergegangen, der Tag aber ist herangekommen. Laßt uns also abwerfen die Werke der Finsternis und anlegen die Waffen des Lichtes! Wie am Tage lasset uns ehrbar wandeln, nicht in Gelagen und Trunkenheit, nicht in Begehrlichkeit und Unzucht, nicht in Streit und Eifersucht!“ Ist die Finsternis aus deinem Herzen gewichen, ist die Nacht daraus vertrieben, ist das Dunkel verscheucht, hat Tageshelle deine Sinne erleuchtet und hast du einmal angefangen, ein Mensch des Lichtes zu sein, dann tue nur das, was Christi ist; denn Christus ist das Licht und der Tag.</p><p>Was stürzest du dich in die Finsternis der Eifersucht, was hüllst du dich in die Wolke des Neides, was bringst du durch das Dunkel der Mißgunst alles Licht des Friedens und der Liebe zum Verlöschen, was kehrst du zu dem Teufel zurück, dem du entsagt hattest, und warum zeigst du dich dem Kain ähnlich? Denn daß sich jeder des Verbrechens des Mordes schuldig macht, der seinen Bruder mit Eifersucht und Haß verfolgt, das verkündigt der Apostel in seinem Briefe mit den Worten: „Wer seinen Bruder haßt, ist ein Mörder, und ihr wißt, daß kein Mörder das Leben bleibend in sich hat“, und wiederum: „Wer sagt, er sei im Lichte, und seinen Bruder haßt, ist noch in der Finsternis und wandelt in der Finsternis und weiß nicht, wohin er geht; denn die Finsternis hat seine Augen geblendet”. Wer seinen Bruder haßt, sagt er, der wandelt in der Finsternis und weiß nicht, wohin er geht. Er geht nämlich, ohne es zu wissen, in die Hölle, ahnungslos und blindlings stürzt er in die Pein, da er sich ja von dem Lichte Christi entfernt, der da mahnt und sagt: „Ich bin das Licht der Welt. Wer mir nachfolgt, wird nicht wandeln in der Finsternis, sondern wird das Licht des Lebens haben". Dem Herrn aber folgt nach, wer sich an seine Gebote hält, wer auf dem Wege seiner Lehre dahinschreitet, wer seinen Fußtapfen und seiner Bahn folgt, wer das, was Christus gelehrt und getan hat, nachahmt, wie auch Petrus ermuntert und mahnt mit den Worten: „Christus hat gelitten für euch, indem er euch ein Vorbild hinterließ, damit ihr nachfolget seinen Fußtapfen.</p><p>Wir müssen bedenken, mit welchem Ausdruck Christus sein Volk benennt, mit welchem Namen er seine Herde bezeichnet. „Schafe„ heißt er sie, damit die christliche Unschuld der der Schafe ähnlich werde; „Lämmer“ nennt er sie, damit ihr schlichter Sinn das einfältige Wesen der Lämmer sich zum Vorbild nehme. Was verbirgt sich der Wolf unter dem Schafskleide, was schändet mancher den guten Ruf der Herde Christi, der nur fälschlich vorgibt, ein Christ zu sein? Christi Namen sich beizulegen, ohne auf Christi Weg zu wandeln was ist das anderes als ein Betrug am göttlichen Namen, als ein Abirren vom Wege des Heils? Lehrt und sagt er doch selbst, nur der gelange zum Leben, der die Gebote Gottes halte, und nur der sei weise, der seine Worte höre und danach tue; auch werde nur der ein wirklich großer Lehrer im Himmelreich genannt, der nach seiner Lehre auch handle, und dem Prediger werde das, was er treffend und mit Nutzen verkündigt habe, nur dann zugute kommen, wenn er dem, was sein Mund spricht, nachher auch die Tat folgen lasse. Was aber hat der Herr seinen Jüngern häufiger ans Herz gelegt, was hat er ihnen unter seinen heilsamen Mahnungen und himmlischen Lehren gewissenhafter zu halten und zu beobachten geboten, als daß mit derselben Liebe, die er selbst seinen Jüngern entgegenbrachte, auch wir uns gegenseitig lieben sollten? Wie aber bewahrt der den Frieden oder die Liebe des Herrn, der vor lauter Eifersucht weder friedlich noch liebreich sein kann?</p><p>Als deshalb der Apostel Paulus die Segnungen des Friedens und der Liebe schilderte und ausdrücklich versicherte und lehrte, weder der Glaube noch das Almosengeben noch selbst das Leiden als Bekenner und Märtyrer werde ihm etwas helfen, wenn er nicht den Bund der Liebe rein und unverletzt erhalte, da hat er auch noch die Worte hinzugefügt: „Die Liebe ist großmütig, die Liebe ist gütig, die Liebe eifert nicht„. Damit wollte er doch offenbar lehren und zeigen, daß nur der die Liebe bewahren kann, der großmütig und gütig sei und die Eifersucht und den Neid nicht kenne. Ebenso äußert und sagt er an einer anderen Stelle, wo er mahnt, der Mensch, der nunmehr des Heiligen Geistes voll und durch die himmlische Geburt ein Kind Gottes geworden sei, solle nur noch dem Geistlichen und Göttlichen nachtrachten: „Und ich nun, ihr Brüder, konnte nicht zu euch reden als zu Geistlichen, sondern als zu Fleischlichen, als zu Kindern in Christo. Mit Milch habe ich euch getränkt, nicht mit Speise. Denn ihr wart noch nicht dazu imstande; aber auch jetzt seid ihr es noch nicht, denn noch seid ihr fleischlich. Denn wo unter euch Eifersucht herrscht und Streit und Zwietracht, seid ihr da nicht fleischlich und wandelt nach menschlicher Weise?“</p><p>Zu zermalmen gilt es, geliebteste Brüder, die fleischlichen Laster und Sünden, tilgen müssen wir die gefährliche Befleckung des irdischen Leibes mit der Kraft des Geistes, damit wir nicht in die Schlingen des Todes uns verwickeln, indem wir abermals in den Wandel des alten Menschen zurückfallen. Warnt doch auch der Apostel mit klugem Blick und zu unserem Heile schon im voraus gerade davor. „Laßt uns daher, ihr Brüder“, sagt er, „nicht nach dem Fleische leben! Denn wenn ihr nach dem Fleische lebt, werdet ihr anfangen zu sterben; wenn ihr aber durch den Geist die Werke des Fleisches ertötet, so werdet ihr leben. Denn alle, die von dem Geiste Gottes getrieben werden, die sind Kinder Gottes”. Sind wir also wirklich Kinder Gottes, haben wir bereits angefangen, sein Tempel zu sein, haben wir den Heiligen Geist empfangen und führen wir ein heiliges und geistliches Leben, haben wir unsere Augen von der Erde zum Himmel erhoben, haben wir unser von Gott und Christus erfülltes Herz zum Hohen und Göttlichen emporgerichtet, so laßt uns auch nur noch tun, was Gottes und Christi würdig ist, wie der Apostel ermuntert und mahnt! „Seid ihr mit Christus auferstanden“, sagt er, „so suchet, was droben ist, wo Christus ist, der zur Rechten Gottes sitzt! An das, was droben ist, denket, nicht an das, was auf Erden ist! Denn ihr seid gestorben, und euer Leben ist mit Christus in Gott verborgen. Wenn aber Christus, euer Leben sich offenbaren wird, dann werdet auch ihr [mit ihm] offenbar werden in der Herrlichkeit”. Nachdem wir also in der Taufe den fleischlichen Sünden des alten Menschen nach gestorben und begraben, nachdem wir kraft der himmlischen Wiedergeburt mit Christus auferstanden sind, so laßt uns auch das, was Christi ist, nicht nur denken, sondern auch tun, wie ja der gleiche Apostel wiederum lehrt und mahnt mit den Worten: „Der erste Mensch ist von dem Lehm der Erde, der zweite Mensch vom Himmel. Wie jener vom Lehme ist, so sind auch die, die vom Lehme sind; und wie der himmlische ist, so sind auch die Himmlischen. Wie wir getragen haben das Bild dessen, der von Lehm ist, so laßt uns auch das Bild dessen tragen, der vom Himmel ist!" Das himmlische Bild aber können wir nicht tragen, wenn wir nicht in dem, was wir nunmehr zu sein angefangen haben, uns Christus ähnlich zeigen.</p><p>Denn erst dann hast du geändert, was du gewesen bist, erst dann hast du angefangen, das zu sein, was du früher nicht warst, wenn in dir die Geburt aus Gott deutlich sichtbar wird, wenn die von Gott verordnete Zucht [in dir] auch Gott dem Vater entspricht und wenn in einem ehrenvollen und rühmlichen Lebenswandel auch Gott im Menschen offenbar wird, wie er selbst ermuntert und mahnt und denen, die ihn verherrlichen, Wiedervergeltung verheißt. „Diejenigen“, sagt er, „die mich verherrlichen, werde ich verherrlichen, und wer mich verachtet, wird verachtet werden”. Indem uns der Herr und Sohn Gottes zu dieser Verherrlichung heranbildet und vorbereitet, legt er es uns ans Herz, Gott dem Vater ähnlich zu werden, und sagt in seinem Evangelium: „Ihr habt gehört, daß gesagt worden ist:,Du sollst deinen Nächsten lieben und hassen deinen Feind!’ Ich aber sage euch:,Liebet eure Feinde und betet für die, die euch verfolgen, damit ihr ähnlich seid eurem Vater, der im Himmel ist, der seine Sonne aufgehen läßt über Gute und Böse und regnen läßt über Gerechte und Ungerechte]’“ Wenn es für Menschen schon erfreulich und ruhmvoll ist, möglichst ähnliche Kinder zu haben, und die Vaterfreude dann um so größer ist, wenn die Nachkommenschaft in den Gesichtszügen dem Vater ganz und gar ähnelt, wieviel größer ist dann die Freude bei Gott dem Vater, wenn einer so dem Geiste nach geboren wird, daß in seinem rühmlichen Wandel der göttliche Adel verherrlicht wird! Welche Palme der Gerechtigkeit, welche Ruhmeskrone ist es für dich, ein solcher zu sein, von dem Gott nicht sagt: „Söhne habe ich gezeugt und erhöht, sie selbst aber haben mich verschmäht!” Möge dich vielmehr Christus beloben und zur Belohnung rufen mit den Worten: „Kommet, ihr Gesegneten meines Vaters, empfanget das Reich, das euch bereitet ist seit Anbeginn der Welt!"</p><p>Durch solche Betrachtungen, geliebteste Brüder, gilt es den Geist zu stärken, durch derartige Übungen ihn gegen alle Geschosse des Teufels zu sichern. Laßt uns in den Händen die göttliche Schrift halten, im Sinne nur den Gedanken an den Herrn wohnen; beständiges Gebet möge gar nie verstummen, heilbringende Wohltätigkeit keinen Augenblick erlahmen! Laßt uns stets in geistlichen Werken uns betätigen, damit der Feind, so oft er einen Angriff versucht, unsere Brust gegen ihn wohlverwahrt und gerüstet findet! Denn für den Christen gibt es nicht nur die eine Krone, die man in der Zeit der Verfolgung erlangt, nein, auch der Frieden hat seine Kronen, mit denen wir gekrönt werden, wenn wir aus den verschiedenartigen und mannigfachen Kämpfen als Sieger hervorgehen und den Widersacher zu Boden gestreckt und niedergeworfen haben. Die Wollust bezwungen zu haben, ist die Palme der Enthaltsamkeit Gegen den Jähzorn, wider die Ungerechtigkeit erfolgreich angekämpft zu haben, ist die Krone geduldiger Ausdauer. Ein Triumph über die Habsucht ist es, das Geld zu verachten. Der Ruhm des Glaubens ist es, im Vertrauen auf die Zukunft das Ungemach der Welt zu ertragen, Und wer im Glück nicht übermütig ist, der erntet Ruhm von seiner Demut. Und wer bereit ist, voll Barmherzigkeit die Armen zu unterstützen, erhält dafür himmlische Schätze als Gegengabe. Und wer Eifersucht nicht kennt, sondern in Einmütigkeit und Sanftmut seine Brüder liebt, wird durch den Preis der Liebe und des Friedens ausgezeichnet. In dieser Rennbahn der Tugenden laufen wir täglich, zu diesen Palmen und Kronen der Gerechtigkeit können wir ohne Unterbrechung jederzeit gelangen.</p><p>Damit nun auch du zu ihnen gelangen kannst, der du bisher von Eifersucht und Neid beherrscht warst, wirf all die Bosheit von dir ab, die dich früher gefesselt hielt, und wende dich heilsamen Schrittes dem Wege des ewigen Lebens zu! Reiß aus deiner Brust die Dornen und Disteln heraus, damit dir der Same des Herrn reichen Ertrag beschere und die göttliche und geistliche Saat zur üppigen Fülle einer gesegneten Ernte emporsprieße! Speie aus die Galle der Gehässigkeit, tu ab von dir das Gift der Zwietracht; rein werde wieder dein Sinn, der von Schlangenneid angesteckt war, und alle Bitterkeit, die sich in deinem Inneren festgesetzt hatte, möge durch Christi Süßigkeit gemildert werden! Nimmst du vom Sakrament des Kreuzes Speise und Trank, dann möge das Holz, das bildlich bei Merrha dazu diente, den bitteren Geschmack des Wassers zu vertreiben, in Wirklichkeit bei dir dazu beitragen, dein Herz zu mildern und zu sänftigen, und du wirst um ein Heilmittel zur glücklichen Herstellung deiner Gesundheit nicht in Verlegenheit sein. Laß dich dort heilen, wo du seinerzeit deine Wunden empfingst! Liebe die, die du vordem haßtest, ehre die, die du in ungerechter Mißgunst beneidetest! Die Guten ahme nach, wenn du es ihnen gleichtun kannst; vermagst du das aber nicht, so freue dich wenigstens mit ihnen und beglückwünsche sie als die Besseren! In Liebe mit ihnen vereint, geselle dich zu ihnen als Genosse, durch das einigende Band brüderlicher Zuneigung mache dich zu ihrem Miterben! Vergeben wird dir deine Schuld, wenn du selbst vergibst; angenommen werden deine Opfer, wenn du als ein Friedfertiger zu Gott kommst. Dein Denken und Tun wird von Gott geleitet werden, wenn du an das denkst, was göttlich und gerecht ist, wie geschrieben steht: „Das Herz des Mannes denke an Gerechtes, damit von Gott seine Schritte gelenkt werden!"</p><p>Zu denken aber hast du an vieles. Denke an das Paradies, in das Kain nicht eingeht, der aus Eifersucht seinen Bruder erschlug! Denke an das himmlische Reich, in das der Herr nur die Einträchtigen und Einmütigen zuläßt! Denke daran, daß Kinder Gottes allein die genannt werden können, die friedfertig sind, die, durch die [himmlische] Geburt und das göttliche Gesetz geeinigt, Gott dem Vater und Christus ähneln und entsprechen! Denke daran, daß wir unter den Augen Gottes stehen, daß wir unter seinem Richterblick die Bahn unseres [irdischen] Wandels und Lebens durchmessen und daß wir dann erst zu dem Glück gelangen können, ihn zu schauen, wenn wir ihn, der jetzt auf uns schaut, durch unser Tun erfreuen, wenn wir uns seiner Gnade und Huld würdig erweisen und wenn wir, die wir ihm in seinem Reiche immerdar gefallen wollen, ihm zuvor in dieser Welt zu gefallen wissen!</p>
