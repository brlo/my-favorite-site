      <p><em>Über die Einheit der katholischen Kirche, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Da der Herr mahnt und sagt: „Ihr seid das Salz der Erde“, und da er uns auffordert, in Unschuld einfältig und dennoch bei aller Einfalt klug zu sein, was haben wir da anderes zu tun, geliebteste Brüder, als alle Vorsicht aufzubieten und sorgsamen Herzens wachend die Nachstellungen des arglistigen Feindes zu erkennen und uns zugleich dagegen vorzusehen? Es könnte sonst scheinen als ob wir, die wir Christus, die Weisheit Gottes des Vaters, angezogen haben, in der Fürsorge für unser Heil zu wenig weise wären. Denn nicht nur die Verfolgung ist zu fürchten und all das, was in offenem Kampfe darauf ausgeht, die Diener Gottes zu stürzen und zu Fall zu bringen. Leichter ist es ja, auf seiner Hut zu sein, wenn der Gegenstand der Furcht klar vor Augen liegt, und der Geist rüstet sich schon vorher zum Kampfe, wenn der Widersacher sich offen zu erkennen gibt. Mehr muß man sich vor einem Feinde fürchten und hüten, wenn er heimlich heranschleicht, wenn er unter dem Scheine des Friedens uns berückt und sich auf verborgenen Wegen heranschlängelt, weshalb er auch den Namen „Schlange“ bekommen hat. Darin besteht ja von jeher seine Hinterlist, darin seine geheime und versteckte Kunst, den Menschen tückisch zu umgarnen. So hat er gleich von Anbeginn der Welt betrogen und mit lügnerischen Worten schmeichelnd die noch unerfahrenen Seelen in ihrer unvorsichtigen Leichtgläubigkeit hintergangen. So unternahm er es sogar, den Herrn selbst zu versuchen, und näherte sich verstohlen, wie wenn er wiederum heimlich heranschleichen und täuschen könnte; doch er wurde bemerkt und zurückgewiesen und eben deshalb niedergeschmettert, weil er erkannt und entlarvt wurde.</p><p>Damit ist uns ein mahnendes Vorbild gegeben, den Weg des alten Menschen zu meiden und in die Fußtapfen des siegreichen Christus zu treten, auf daß wir nicht von neuem durch unsere Unvorsichtigkeit in die Schlingen des Todes uns verwickeln, sondern, vor der Gefahr sorgfältig auf unserer Hut, der erlangten Unsterblichkeit teilhaftig werden. Wie aber sollten wir der Unsterblichkeit teilhaftig werden können, wenn wir nicht das, wodurch der Tod bezwungen und besiegt wird, die Gebote Christi, halten wollen? Mahnt und sagt er doch selbst: „Willst du zum Leben gelangen, so halte die Gebole!“ und wiederum: „Wenn ihr tut, was ich euch gebiete, so nenne ich euch nicht mehr Knechte, sondern Freunde“. Von solchen sagt er des weiteren auch, sie seien mutig und standhaft, sie seien in starkem Bau auf Felsen gegründet, sie seien gegen alle Ungewitter und Stürme der Welt mit unbeweglicher und unerschütterlicher Festigkeit gesichert. „Wer meine Worte hört“, sagt er, „und sie tut, den will ich einem weisen Manne vergleichen, der sein Haus auf einen Felsen baute. Der Regen fiel herab, die Flüsse kamen heran, die Winde erhoben sich und stürmten an gegen jenes Haus: und es fiel nicht; denn es war auf einen Felsen gegründet“. An seinen Worten müssen wir also festhalten, alles, was er gelehrt und getan hat, müssen wir lernen und tun. Wie kann aber einer sagen, er glaube an Christus, wenn er nicht tut, was Christus zu tun geboten hat? Oder wie kann der zur Belohnung treuen Glaubens gelangen, der das Gebot nicht getreulich halten will? Haltlos wanken muß er notgedrungen und unstet umherirren und, vom Geiste des Irrtums fortgerissen, hin- und hertreiben wie der Staub, den der Wind emporwirbelt; und dem Heile wird der auf seiner Bahn nicht näher kommen, der nicht festhält an der Wahrheit des Heilsweges.</p><p>Auf der Hut zu sein aber, [geliebteste Brüder,] gilt es nicht nur vor dem, was offen und klar zutage liegt, sondern auch vor allem, was durch die Schlauheit arglistigen Truges täuscht. Was gibt es aber Arglistigeres oder Schlaueres, als daß der durch Christi Ankunft entlarvte und niedergeworfene Feind, nachdem das Licht zu den Völkern gekommen und die Leuchte des Heils zur Errettung der Menschen aufgegangen war, so daß die Tauben die Verkündigung der Geistesgnade vernahmen, die Blinden ihre geöffneten Augen zum Herrn erhoben, die Kranken zu ewiger Gesundheit genasen, die Lahmen zur Kirche eilten, die Stummen in lauten Worten und Gebeten flehten, — als daß er gerade jetzt, wo er die Götzenbilder verlassen und wegen der übergroßen Menge der Gläubigen seine Stätten und Tempel verödet sah, einen neuen Betrug ersann, um gerade unter dem Deckmantel des christlichen Namens die Unvorsichtigen zu täuschen? Irrlehren und Spaltungen erfand er da, um durch sie den Glauben zu untergraben, die Wahrheit zu fälschen, die Einheit zu zerreißen. Diejenigen, die er in der Finsternis des alten Weges nicht festzuhalten vermag, die umgarnt und verleitet er auf einem neuen Irrpfad. Aus der Kirche selbst reißt er die Menschen los, und während sie sich einbilden, bereits dem Lichte nahe gekommen und dem Dunkel der Welt entronnen zu sein, hüllt er sie, ohne daß sie es merken, wieder in eine andere Finsternis. So nennen sie sich Christen, obwohl sie sich an das Evangelium Christi, an seine Beobachtung und an das Gesetz gar nicht halten, und sie glauben das Licht zu haben, obgleich sie in der Finsternis wandeln, indem der Widersacher sie berückt und irreführt, der nach dem Ausspruch des Apostels sich als einen Engel des Lichtes hinstellt und seine Diener als Diener der Gerechtigkeit erscheinen läßt. Und doch bieten sie nur die Nacht statt des Tages, das Verderben statt des Heils, hoffnungslose Verzweiflung unter dem Scheine der Hoffnung, Abfall und Unglauben unter dem Vorwande des Glaubens, den Antichrist unter dem Namen Christi, um so durch schlauen Trug die Wahrheit zu entstellen, indem sie mit ihren Lügen den Schein der Wahrheit erwecken. Dies kommt daher, geliebteste Brüder, daß man nicht auf den Ursprung der Wahrheit zurückgeht, daß man nicht die Quelle aufsucht und die Lehre der himmlischen Unterweisung nicht beachtet.</p><p>Erwägt und prüft man dies, so bedarf es nicht erst noch einer langen Abhandlung und vieler Beweise. Die Beweisführung vermag leicht zu überzeugen schon bei kurzer Zusammenfassung der Wahrheit. Der Herr spricht zu Petrus die Worte: „Ich sage dir: Du bist Petrus, und auf diesen Felsen werde ich bauen meine Kirche, und die Pforten der Unterwelt werden sie nicht überwältigen. Ich will dir die Schlüssel des Himmelreiches geben; und was du binden wirst auf Erden, wird auch im Himmel gebunden sein, und alles, was du lösen wirst auf Erden, wird auch im Himmel gelöst sein“. Auf e i n e n baut er die Kirche, und obwohl er den Aposteln allen nach seiner Auferstehung gleiche Gewalt erteilt und sagt: „Gleichwie mich der Vater gesandt hat, so sende auch ich euch. Empfanget den Heiligen Geistt. Wenn ihr einem die Sünden erlasset, so werden sie ihm erlassen werden; wenn ihr sie einem behaltet, so werden sie ihm behalten werden“, so hat er dennoch, um die Einheit deutlich hervorzuheben, durch sein Machtwort es so gefügt, daß der Ursprung eben dieser Einheit von e i n e m sich herleitet. Gewiß waren auch die übrigen Apostel das, was Petrus gewesen ist, mit dem gleichen Anteil an Ehre und an Macht ausgestattet, aber der Anfang geht von der Einheit aus, damit die Kirche Christi als e i n e erwiesen werde. Auf diese eine Kirche weist auch im Hohen Liede der Heilige Geist hin aus der Person des Herrn heraus und sagt: „E i n e ist meine Taube, meine Vollkommene, sie ist die einzige ihrer Mutter, die Auserwählte ihrer Gebärerin“. Wer an dieser Einheit der Kirche nicht festhält, vermeint der an dem Glauben festzuhalten? Wer der Kirche widerstrebt und sich widersetzt, ist der noch überzeugt, innerhalb der Kirche zu stehen? Lehrt doch auch der selige Apostel Paulus das gleiche, indem er auf das heilige Geheimnis der Einheit hinweist mit den Worten: „E i n Leib und e i n Geist, e i n e Hoffnung eurer Berufung, e i n Herr, e i n Glaube, e i n e Taufe, e i n Gott“.</p><p>Diese Einheit müssen wir unerschütterlich festhalten und verteidigen, vor allem wir Bischöfe, die wir in der Kirche den Vorsitz haben, damit wir auch das Bischofsamt selbst als ein einziges und ungeteiltes erweisen. Niemand täusche die Gemeinde der Brüder durch eine Lüge, niemand fälsche die Wahrheit des treuen Glaubens durch treulose Entstellung! Das Bischofsamt ist nur eines, an dem jeder einzelne nur unter Wahrung des Ganzen seinen Anteil hat. Auch die Kirche ist nur eine, die sich zur Vielheit bloß durch ihr üppiges Wachstum immer weiter ausbreitet, ebenso wie die Sonne viele Strahlen hat, aber nur ein Licht, und wie der Baum zwar viele Zweige besitzt, aber nur einen auf fester Wurzel gegründeten Stamm; und wenn aus einem Quell noch so zahlreiche Bäche entspringen, die Einheit bleibt dennoch im Ursprung gewahrt, mag auch eine recht stattliche Zahl [von Gewässern] in dem Reichtum überquellender Fülle zu entströmen scheinen. Reiß einen Strahl los von dem Lichtkörper [der Sonne]: die Einheit des Lichtes läßt eine Absonderung nicht zu; brich vom Baume einen Zweig: einmal abgebrochen, wird nicht mehr zu sprossen vermögen; schneide einen Bach ab von seiner Quelle; sofort wird er vertrocknen. Ebenso sendet auch die von des Herrn Licht durchströmte Kirche über den ganzen Erdkreise ihre Strahlen aus; dennoch ist es nur ein Licht, das überallhin flutet, ohne daß die Einheit ihres Körpers getrennt wird. Ihre Zweige streckt sie in reicher Fülle aus über die ganze Erde hin, mächtig hervorströmende Bäche läßt sie immer weiter sich ergießen; und nut eine Mutter, die mit glücklicher Fruchtbarkeit ihrer Milch genährt, von ihrem Geiste beseelt.</p><p>Zum Ehebruch läßt sich die Braut Christi nicht verführen, sie ist unbefleckt und züchtig. Nur ein Haus kennt sie, die Heiligkeit eines Schlafgemachs bewahrt sie in keuscher Scham. Sie ist es, die nur für Gott errettet, sie weist die Kinder, die sie geboren hat, seinem Reiche zu. Jeder, der sich von der Kirche trennt und sich mit einer Ehebrecherin verbindet, schließt sich aus von den Verheißungen der Kirche, und wer die Kirche Christi verläßt, wird nicht zu den Belohnungen Christi gelangen. Er ist ein Fremder, er ist ein Unheilige, er ist ein Feind. Gott kann der nicht mehr zum Vater haben, der die Kirche nicht zu Mutter hat. Wenn irgendeiner zu entrinnen vermochte, der außerhalb der Arche Noes war, nur dann mag auch einer entkommen, der draußen, außerhalb der Kirche steht. Der Herr mahnt und sagt: “Wer nicht mit mir ist, ist wider nicht, und wer nicht mit mir sammelt, der zerstreut”. Wer den Frieden und die Eintracht Christi bricht, der handelt wider Christus; wer anderwärts, außerhalb der Kirche sammelt, der zerstreut die Kirche Christi. Der Herr sagt. “Ich und der Vater sind eins”. Und wiederum, steht über den Vater und den Sohn und den Heiligen Geist geschrieben:" Und diese drei sind eins!. Und da glaubt jemand, diese der göttlichen Festigkeit entstammende und mit himmlischen Geheimissen engverbundene Einheit könne bei der Kirche zerrissen und durch den Widerstreit einander widerstrebender Meinungen aufgelöst werden? Wer an dieser Einheit nicht festhält, der hält nicht fest an Gottes Gesetz, der hält nicht fest den Glauben an den Vater und den Sohn, der hält nicht fest am Leben und am Heile.</p><p>Dieses heilige Geheimnis der Einheit, dieses Band unzertrennlich verbundener Eintracht ist gemeint, wenn im Evangelium der Rock des Herrn Jesu Christi keineswegs etwa geteilt oder zerrissen, sondern das Kleid unversehrt in Empfang und der Rock unverletzt und ungeteilt in Besitz genommen wird, als man damals um das Kleid Christi loste, wer nun eigentlich Christus anziehen dürfe. Die göttliche Schrift spricht und sagt. " Wegen des Rockes aber, weil er von oben herab nicht zusammengenäht, sondern im ganzen gewoben war, sagten sie zueinander: “Wollen wir ihn nicht zerreißen, sondern um ihn losen, wem er gehören soll’!” Dieser Rock trug [bildlich] die Einheit an sich, die von oben, das heißt: vom Himmel und vom Vater, herabkam und die von dem Empfänger und Besitzer auf keinen Fall zerrissen werden konnte, sondern ein für allemal die ganze und volle Festigkeit unzertrennlich bewahrte. Das Gewand Christi kann nicht besitzen, wer die Kirche Christi zerreißt und spaltet. Als hingegen beim Tode Salomos sein Reich und Volk sich spaltete, da riß der Prophet Achias, als er dem König Hieroboam auf dem Felde begegnete, sein Kleid in zwölf Stücke auseinander mit den Worten: “Nimm dir zehn Stücke; denn so spricht der Herr: ‘Siehe, ich reiße das Reich aus der Hand Salomos und will dir zehn Szepter geben, und zwei Szepter werden ihm bleiben wegen meines Dieners David und wegen der Stadt Jerusalem, die ich auserwählt habe, um meinen Namen dort aufzurichten’.” Als die zwölf Stämme Israels zerrissen wurden, riß der Prophet Achias sein Kleid auseinander. Weil dagegen das Volk Christi nicht zerrissen werden kann, wurde sein im ganzen gewobener und unzertrennlicher Rock von den Besitzern nicht geteilt. Ungeteilt, engverbunden und in eins verwoben, weist er auf die innig vorknüpfte Eintracht unseres Volkes hin, auf uns, die wir Christus angezogen haben; mit dem geheimnisvollen Zeichen seines Kleides hat er die Einheit der Kirche deutlich kundgetan.</p><p>Wer also wäre so verrucht und treulos, wer so von der Raserei der Zwietracht betört, daß er glaubte, die Einheit Gottes, das Kleid des Herrn, die Kirche Christi könne zerrissen werden, oder daß er es gar wagte, sie zu zerreißen? Er selbst mahnt und lehrt in seinem Evangelium, indem er sagt: „Und es wird eine Herde und ein Hirte sein“. Und da wähnt noch jemand, es könne an einem Orte viele Hirten oder mehrere Herden geben? Ebenso beschwört, mahnt und spricht der Apostel Paulus, indem er uns diese gleiche Einheit ans Herz legt: „Ich beschwöre euch“, sagt er, „ihr Brüder, bei dem Namen unseres Herrn Jesu Christi, daß ihr alle die gleiche Rede führet und daß es unter euch keine Spaltungen gebe; seid aber geeinigt in gleichem Sinne und in gleicher Meinung!“ Und wiederum sagt er: „... einander tragend in Liebe, eifrig bemüht, zu wahren die Einheit des Geistes in der Verbindung des Friedens“. Glaubst du, es könne einer stehen und leben, der von der Kirche sich trennt, der sich einen anderen Wohnsitz und eine gesonderte Behausung gründet? Ist doch zu Rhaab, in der die künftige Kirche im Bilde dargestellt war, gesagt worden: „Deinen Vater und deine Mutter und deine Brüder und das ganze Haus deines Vaters wirst du zu dir selbst versammeln in dein Haus, und jeder, der zur Türe deines Hauses herausgeht, wird für sich verantwortlich sein“. Ebenso enthält doch das Geheimnis des Paschafestes im Gesetze des Exodus nichts anderes, als daß das Lamm, das als Vorbild für Christus geschlachtet wird, in einem Hause gegessen werden soll. Gott spricht und sagt: „In einem Hause soll es verzehrt werden, ihr sollt das Fleisch nicht aus dem Hause hinausbringen!“ Das Fleisch Christi und der heilige Leib des Herrn kann nicht hinausgebracht werden, und für die Gläubigen gibt es kein anderes Haus außer der einen Kirche. Dieses Haus, diese Stätte der Einmütigkeit bezeichnet und verkündigt der Heilige Geist in den Psalmen mit den Worten: „Gott, der die Einmütigen wohnen macht im Hause“. Nur im Hause Gottes, in der Kirche Christi wohnt man einmütig beisammen, nur hier verharrt man in Eintracht und Herzenseinfalt.</p><p>Deshalb kam auch der Heilige Geist in Gestalt einer Taube. Ein einfältiges und munteres Geschöpf ist es, ohne bittere Galle, ein Tier, das nicht wütend um sich beißt, nicht gewaltsam mit den Krallen zerfleischt: die menschlichen Wohnungen liebt sie, und sie kennt das Zusammenwohnen in einem Hause. In der Brutzeit brüten sie ihre Jungen gemeinsam aus; wenn sie ausfliegen, halten sie sich im Fluge nahe aneinander; in engem Zusammensein verbringen sie ihr Leben, schnäbelnd und kosend bezeugen sie die Eintracht des Friedens, und in allem erfüllen sie das Gesetz der Einmütigkeit. Diese Herzenseinfalt sollte man in der Kirche wahrnehmen, solche Liebe gilt es auch hier festzuhalten, auf daß die Brüderschaft in Zärtlichkeit die Tauben nachahme, an Sanftmut und Milde den Lämmern und Schafen gleichkomme. Was soll in einem christlichen Herzen die Wildheit der Wölfe, die Wut der Hunde, was das tödliche Gift der Schlangen und die blutdürstige Grausamkeit reißender Tiere? Beglückwünschen darf man sich, wenn solche Glieder aus der Kirche ausscheiden, damit sie nicht die Tauben, damit sie nicht die Schafe Christi durch ihre unheilvolle und giftige Berührung zu Fall bringen. Ein Zusammenhang und eine Verbindung ist unmöglich zwischen bitter und süß, zwischen der Finsternis und dem Lichte, zwischen Regen und Sonnenschein, zwischen Kampf und Frieden, zwischen Fruchtbarkeit und Unfruchtbarkeit, zwischen sprudelnden Quellen und der Trockenheit, zwischen Windstille und Sturm. Glaube keiner, daß die Guten von der Kirche sich zu trennen vermögen! Den Weizen weht kein Wind davon, und den Baum, der durch starke Wurzeln mit dem Grunde verwachsen ist, stürzt kein Sturm um: nur die leere Spreu ist es, die vom Winde hin und her getrieben wird, nur die kraftlosen Bäume werden durch den Anprall eines Wirbelwindes entwurzelt. Solchen gilt die Verwünschung und Zurechtweisung des Apostels Johannes, wenn er sagt: „Von uns sind sie hinausgegangen, aber sie sind nicht von uns gewesen. Denn wenn sie von uns gewesen wären, so wären sie bei uns geblieben“.</p><p>Dadurch sind schon häufig Irrlehren entstanden, und sie entstehen noch, indem der verkehrte Sinn keinen Frieden hat, indem widerspenstige Untreue an der Einheit nicht festhält. Daß dies aber geschieht, erlaubt und duldet der Herr; denn die Selbständigkeit des eigenen freien Willens bleibt unbeschränkt, damit die unverletzte Treue der Erprobten in hellem Lichte erstrahlt, indem die Unterscheidung der Wahrheit unsere Herzen und Sinne prüft. Durch den Mund des Apostels spricht der Heilige Geist im voraus die Mahnung aus: „Es muß auch Irrlehren geben, damit die Erprobten offenbar werden unter euch“. So werden die Treuen erprobt, so die Treulosen entlarvt, so werden schon vor dem Tage des Gerichts auch hier bereits die Seelen der Gerechten und der Ungerechten geschieden und von dem Weizen die Spreu gesondert. Daher stammen sie, die sich eigenmächtig vor einer Versammlung von zusammengelaufenen, unbesonnenen Leuten ohne göttliche Verordnung als Vorsteher aufwerfen, die sich ohne irgendwelche gesetzliche Weihe als Vorgesetzte aufstellen, die den Namen eines Bischofs sich anmaßen, ohne daß ihnen jemand die bischöfliche Würde übertragen hätte. Sie bezeichnet der Heilige Geist in den Psalmen als die, die auf dem Stuhle der Pestilenz sitzen, als die Pest und Seuche des Glaubens, die mit dem Munde der Schlange täuschen, und als Meister in der Entstellung der Wahrheit, die mit ihren verderbenbringenden Zungen tödliches Gift ausspeien. Ihre Rede frißt um sich wie ein Krebs, ihre Schriften gießen in Brust und Herz eines jeden todbringendes Gift.</p><p>Gegen solche Menschen erhebt der Herr seine Stimme, von ihnen zieht und ruft er sein irrendes Volk zurück mit den Worten: “Höret nicht auf die Reden der falschen Propheten, denn die Gesichte ihres Herzens täuschen sie! Sie reden, aber nicht aus dem Munde des Herrn. Sie sagen zu denen, die das Wort Gottes verwerfen: Friede werdet ihr haben und alle, die nach ihrem Willen wandeln. Jeder, der im Irrtum seines Herzens wandelt, über den wird kein Unheil kommen.”Ich habe nicht zu ihnen geredet, und sie haben selbst geweissagt. Wären sie auf meiner Grundlage stehen geblieben und hätten sie meine Worte gehört und mein Volk gelehrt, so hätte ich sie von ihren bösen Gedanken bekehrt“. Auf die gleichen zeigt und weist abermals der Herr hin, wenn er sagt:”Mich haben sie verlassen, den Quell des lebendigen Wassers, und haben sich löcherige Behälter gegraben, die kein Wasser halten können". Obwohl es doch eine andere Taufe außer der einen nicht geben kann, bilden sie sich ein, taufen zu können; obwohl sie den Quell des Lebens verlassen haben, verheißen sie die Gnade des leben- und heilspendenden Wassers. Nicht gereinigt werden dort die Menschen, sondern vielmehr beschmutzt, und nicht gesühnt werden dort die Sünden, sondern im Gegenteil noch gehäuft. Nicht für Gott, sondern für den Teufel bringt jene Geburt Kinder hervor. Durch die Lüge geboren, erlangen sie nicht die Verheißungen der Wahrheit; aus dem Unglauben erzeugt, gehen sie der Gnade des Glaubens verlustig. Zur Belohnung des Friedens können die nicht gelangen, die den Frieden des Herrn in rasender Zwietracht gebrochen haben.</p><p>Mögen sich auch gewisse Leute davor hüten, sich mit einer unrichtigen Auslegung zu täuschen, weil der Herr gesagt habe: “Wo immer zwei oder drei versammelt sind in meinem Namen, da bin ich bei ihnen”. Indem sie das Evangelium verdrehen und falsch auslegen, berufen sie sich auf das letzte und übergehen dabei das Vorhergehende, lassen den einen Teil gelten und unterschlagen in betrügerischer Absicht den anderen. Wie sie selbst von der Kirche sich losgerissen haben, so zerreißen sie den Sinn eines einheitlichen Abschnittes. Denn als der Herr seinen Jüngern Einmütigkeit und Frieden ans Herz legte, sprach er; “Ich sage euch: Wenn zwei von euch übereinstimmen auf Erden, so wird euch in jeder Sache, um die ihr bittet, Erfüllung werden von meinem Vater, der im Himmel ist. Denn wo immer zwei oder drei versammelt sind in meinem Namen, da bin ich mit ihnen”; damit wollte er nur zeigen, daß es nicht auf die Menge, sondern auf die Einmütigkeit der Bittenden am meisten ankomme. “Wenn zwei von euch”, sagte er, “übereinstimmen auf Erden”: die Einmütigkeit hat er vorangestellt, friedliche Eintracht hat er vorausgesetzt; übereinstimmen sollen wir, das hat er getreulich und mit Bestimmtheit gelehrt. Wie aber kann der mit irgendeinem übereinstimmen, der mit dem Leib der Kirche selbst und mit der gesamten Brüdergemeinde keine Übereinstimmung zeigt? Wie können sich zwei oder drei in Christi Namen versammeln, von denen feststeht, daß sie von Christus und seinem Evangelium geschieden sind? Denn nicht wir sind von ihnen, sondern sie sind von uns weggegangen, und da Irrlehren und Spaltungen erst später entstanden sind, haben sie die Quelle und den Ursprung der Wahrheit verlassen, indem sie für sich gesonderte Vereinigungen gründeten. Der Herr aber spricht nur von seiner Kirche, und er redet nur zu denen, die in der Kirche stehen; sie können, wenn sie selbst eines Herzens sind, wenn sie nach seinem Gebot und seiner Mahnung auch nur zu zweien oder dreien sich versammeln und einmütig bitten, von der Majestät Gottes das Gewünschte erlangen, selbst wenn es nur zwei oder drei sind. “Wo immer zwei oder drei versammelt sind in meinem Namen, da bin ich”, sagte er, “mit ihnen”: mit den Herzenseinfältigen nämlich und Friedfertigen, mit solchen, die Gott fürchten und Gottes Gebote halten. Mit diesen ist er, hat er gesagt, selbst wenn es nur zwei oder drei sind. So war er auch mit den drei Jünglingen im Feuerofen und belebte sie inmitten der sie umzüngelnden Flammen mit dem Hauche des Tauwindes, weil sie herzenseinfältig gegen Gott und einmütig untereinander blieben. So erschien er auch selber den beiden im Kerker eingeschlossenen Aposteln, weil sie herzenseinfältig, weil sie einmütig waren; er selbst öffnete das Schloß des Kerkers und setzte sie wieder in Freiheit, damit sie das Wort, das sie getreulich predigten, der Menge weiter verkündigten. Wenn er also in seinen Geboten die Worte gebraucht: “Wo zwei oder drei versammelt sind in meinem Namen, da bin ich mit ihnen”, so will er damit nicht etwa die Menschen von der Kirche trennen, er, der die Kirche eingesetzt und geschaffen hat, sondern indem er den Treulosen ihre Zwietracht vorhält und den Getreuen den Frieden durch sein Wort ans Herz legt, zeigt er, daß er eher mit zweien oder dreien ist, die in Einmütigkeit bitten, als mit einer noch so großen Zahl von Uneinigen, und daß das einträchtige Flehen weniger mehr zu erreichen vermag als das uneinige Gebet vieler.</p><p>Deshalb hat er auch, als er seine Vorschrift für das Beten gab, die Worte hinzugefügt: „Und wenn ihr dasteht zum Gebet, so vergebet, wenn ihr etwas wider jemand habt, damit auch euer Vater, der im Himmel ist, euch die Sünden vergibt“. Und den, der in Uneinigkeit lebt und zum Opfer kommt, ruft er vom Altar zurück und fordert ihn auf, sich zuerst mit seinem Bruder auszusöhnen und dann erst friedfertig wiederzukommen und Gott seine Gabe darzubringen, weil Gott auch Kains Gaben nicht angesehen hat. Denn mit Gott konnte doch der keinen Frieden haben, der mit seinem Bruder aus Zwietracht und Eifersucht keinen Frieden hielt. Welchen Frieden versprechen sich also sie, die Feinde ihrer eigenen Brüder? Was für Opfer glauben die neidischen Gegner der Priester zu feiern? Bilden sie sich etwa ein, Christus sei mit ihnen, wenn sie versammelt sind, obwohl sie sich doch außerhalb der Kirche Christi versammeln?</p><p>Selbst wenn solche bei dem Bekenntnis des [christlichen] Namens ihren Tod finden, so laßt sich dieser Flecken nicht einmal durch das Blut abwaschen. Die unsühnbare, schwere Schuld der Zwietracht wird selbst durch das Leiden nicht getilgt. Wer nicht in der Kirche steht, der kann kein Märtyrer sein; zum Himmelreich wird der nicht gelangen können, der sie verläßt, die zur Herrschaft im Himmel bestimmt ist. Den Frieden hat uns Christus gegeben, eines Herzens und eines Sinnes zu sein, hat er uns befohlen, den Bund der Zärtlichkeit und Liebe hat er uns unversehrt und unverletzt zu bewahren geboten. Der kann sich nicht als Märtyrer erweisen, der an der brüderlichen Liebe nicht festgehalten hat Dies lehrt und bezeugt auch der Apostel Paulus mit den Worten: „Und wenn ich einen Glauben hätte, so daß ich Berge versetzen könnte, hätte aber die Liebe nicht, so wäre ich nichts. Und wenn ich zur Speisung [der Armen] meine ganze Habe verteilte und wenn ich meinen Leib zum Verbrennen hingäbe, hätte aber die Liebe nicht, so nützte es mir nichts. Die Liebe ist hochherzig, die Liebe ist gütig, die Liebe kennt keine Eifersucht, sie bläht sich nicht auf, sie läßt sich nicht aufreizen, sie handelt nicht leichtfertig, sie sinnt nichts Arges, alles liebt sie, alles glaubt sie, alles hofft sie, alles erträgt sie. Die Liebe wird niemals aufhören“‘. „Niemals“, sagt er, „wird die Liebe aufhören.“ Denn sie wird stets im Himmelreich herrschen, sie wird kraft der Einheit der unter sich innig verbundenen Brüdergemeinde in Ewigkeit währen. Zum Himmelreich kann die Zwietracht nicht gelangen; am Lohne Christi, der da gesagt hat: „Das ist mein Gebot, daß ihr einander liebet, wie ich euch geliebt habe“, wird der keinen Anteil erlangen können, der die Liebe Christi durch treulosen Abfall verletzt hat. Wer die Liebe nicht hat, der hat Gott nicht. Ein Wort des seligen Apostels Johannes lautet: „Gott ist die Liebe, und wer in der Liebe bleibet, der bleibet in Gott, und Gott bleibet in ihm“. Mit Gott können diejenigen nicht vereint bleiben, die in der Kirche Gottes nicht haben einmütig sein wollen. Mögen sie auch den Flammen und dem Feuer übergeben werden und verbrennen oder den wilden Tieren vorgeworfen ihr Leben enden, so wird das doch nicht die Krone des Glaubens sein, sondern nur die Strafe für ihre Treulosigkeit, nicht das ruhmvolle Ende frommer Tugend, sondern nur der Untergang der Verzweiflung. Getötet werden kann ein solcher, gekrönt werden kann er nicht. Als Christ bekennt er sich in der gleichen Weise, in der auch der Teufel sich oft für Christus ausgibt, wie der Herr selbst schon im voraus warnend spricht: „Viele werden kommen in meinem Namen und sagen:,Ich bin Christus’, und sie werden viele täuschen“. Sowenig jener Christus ist, obwohl er unter seinem Namen irreführt, ebensowenig kann der für einen Christen gelten, der nicht bei seinem Evangelium und im wahren Glauben beharrt.</p><p>Denn auch die Gabe, zu weissagen und böse Geister auszutreiben und große Wunder auf Erden zu verrichten, ist gewiß etwas Erhabenes und Bewunderungswürdiges: und doch gewinnt einer, bei dem auch all diese Fähigkeiten sich finden, deswegen das Himmelreich noch nicht, wenn er sich auf seinem Wege nicht an die gerade und rechte Straße hält. Das kündigt der Herr an und sagt: „Viele werden zu mir an jenem Tage sagen:.Herr, Herr, haben wir nicht in Deinem Namen geweissagt und in Deinem Namen böse Geister ausgetrieben und in Deinem Namen große Wunder getan?’ Und dann werde ich zu ihnen sagen:,Ich habe euch nie gekannt; weichet zurück von mir, die ihr Unrecht übt!“’ Gerechtigkeit ist nötig, um an Gott einen gnädigen Richter zu finden. Seinen Geboten und Mahnungen gilt es zu gehorchen, damit unsere Verdienste ihren Lohn erhalten. Als der Herr im Evangelium uns den Weg unserer Hoffnung und unseres Glaubens in gedrängter Kürze zeigte, sagte er: „Der Herr, dein Gott, ist ein einziger Herr, und du sollst den Herrn, deinen Gott, lieben aus deinem ganzen Herzen und aus deiner ganzen Seele und aus allen deinen Kräften! Dies ist das erste [Gebot], und das zweite ist ihm ähnlich: Du sollst deinen Nächsten lieben wie dich selbst! An diesen beiden Geboten hängt das ganze Gesetz und die Propheten“. Einheit, vereint mit Liebe, empfahl er in seiner Lehre, alle Propheten samt dem Gesetz faßte er in den zwei Geboten zusammen. Welche Einheit aber bewahrt, welche Liebe beachtet oder bedenkt einer, der, von der Raserei der Zwietracht betört, die Kirche spaltet, den Glauben untergräbt, den Frieden stört, die Liebe zerreißt und das heilige Geheimnis entweiht?</p><p>Dieses Übel, getreueste Brüder, hatte schon längst eingesetzt, jetzt aber hat die feindliche Verheerung eben dieses Unheils noch zugenommen, und das giftige Verderben ketzerischer Verirrungen und Spaltungen hat sich allmählich immer mehr erhoben und um sich gegriffen; denn so mußte es ja auch beim Untergang der Welt kommen, da der Heilige Geist durch den Mund des Apostels uns im voraus verkündigt und warnend zuruft: “In den letzten Tagen werden unliebsame Zeiten kommen; die Menschen werden selbstgefällig sein, übermütig, aufgeblasen, habgierig, Lästerer, den Eltern ungehorsam, undankbar, ruchlos, ohne Liebe, ohne Treue, verleumderisch, unmäßig, grausam, ohne Liebe zum Guten, verräterisch, frech, von dummem Stolz aufgebläht, Leute, die die Wollust mehr lieben als Gott, die den Schein der Gottesfurcht haben, aber deren Kraft verleugnen. Zu diesen gehören sie, die sich in die Häuser schleichen und mit Sünden beladene Weiblein gefangen nehmen, die von mannigfachen Lüsten getrieben werden, indem sie immer lernen und niemals zur Erkenntnis der Wahrheit gelangen. Und wie Jannes und Mambres sich Moses widersetzten, so widersetzen sich auch diese der Wahrheit. Aber sie werden nicht sehr viel erreichen; denn ihr Unverstand wird allen offenbar werden, ebenso wie es auch der jener beiden gewesen ist”. In Erfüllung geht alles, was vorhergesagt ist, und da das Ende der Welt bereits naht, ist es schon eingetroffen, wie es die Menschen sowohl als die Zeiten bestätigen. Mehr und mehr wütet der Widersacher, täuscht der Irrtum, erhebt dünkelhafter Stolz, entflammt der Neid, verblendet die Begierde, verführt die Ruchlosigkeit, bläht der Hochmut auf, erbittert die Zwietracht, führt der Jähzorn ins Verderben.</p><p>Doch der übergroße und unerwartete Abfall so vieler soll uns nicht beunruhigen oder verwirren, sondern vielmehr unseren Glauben bestärken; denn damit hat sich nur das Vorherverkündigte verwirklicht. Wie einige solche Abtrünnige geworden sind, weil dies vorausgesagt ist, so mögen sich die übrigen Brüder vor derartigen Menschen in acht nehmen; denn auch dies ist schon vorherverkündigt, indem der Herr lehrt und sagt: „Ihr aber seid auf eurer Hut! Seht, ich habe euch alles vorhergesagt“. Meidet, ich bitte euch, solcherlei Menschen und haltet ihre verderblichen Reden wie eine tödliche Seuche von eurer Seite und euren Ohren fern, wie geschrieben steht: „Umzäune deine Ohren mit Dornen und höre nicht auf eine böse Zunge!“ und wiederum: „Schlechte Gespräche verderben gute Herzen“. Der Herr lehrt und mahnt, man müsse sich von solchen Menschen zurückziehen. „Blind sind sie“, sagt er, „Führer von Blinden. Wenn aber ein Blinder einen anderen Blinden führt, so werden sie zusammen in die Grube fallen“. Abwenden muß man sich von einem solchen Menschen und flüchten vor jedem, der sich einmal von der Kirche getrennt hat. „Verkehrt ist ein solcher, und er sündigt und ist von sich selbst verurteilt“. Oder bildet sich der ein, mit Christus zu sein, der den Priestern Christi zuwiderhandelt, der sich von der Gemeinschaft mit seinem Klerus und Volke lossagt? Die Waffen führt er gegen die Kirche, gegen Gottes Verordnung kämpft er an. Ein Feind des Altars, ein Aufrührer wider das Opfer Christi, statt der Glaubenstreue treulos, statt der Gottesfurcht ein Tempelschänder, ein ungehorsamer Knecht, ein liebloser Sohn, ein feindseliger Bruder, verachtet er die Bischöfe und verläßt die Priester Gottes und wagt es, einen anderen Altar zu bauen, ein neues Gebet in unerlaubten Worten zu verrichten und das wahrhaftige Sühnopfer des Herrn durch falsche Opfer zu entweihen, ohne zu bedenken, daß jeder, der gegen die Anordnung Gottes sich auflehnt, für seine kühne Vermessenheit durch göttliche Heimsuchung bestraft wird.</p><p>So haben Kore, Dathan und Abiron, die es versuchten, wider Moses und den Hohenpriester Aaron das freie Recht des Opferns sich anzueignen, sofort für ihr Wagnis büßen müssen. Die Erde ging aus den Fugen und öffnete sich bis in die innersten Tiefen. Wie sie leibten und lebten, verschlang sie der Schlund des unter ihnen schwindenden Bodens; und nicht nur sie, die die Anstifter gewesen waren, traf der Grimm des zürnenden Gottes, sondern auch die übrigen zweihundertfünfzig Teilnehmer und Genossen des gleichen wahnwitzigen Beginnens, die sich mit ihnen zusammen zu dem vermessenen Unterfangen verbunden hatten, verzehrte das vom Herrn ausgehende Feuer in schleuniger Rache: zur Warnung offenbar und zum Zeichen dafür, daß alles sich gegen Gott richtet, was die Ruchlosen in ihrem menschlichen Eigenwillen unternehmen, um die Anordnung Gottes umzustoßen. So wurde auch der König Ozias, als er mit der Räucherpfanne in der Hand gegen Gottes Gesetz die Befugnis zu opfern sich gewaltsam anmaßte und trotz des Widerstandes des Hohenpriesters Azarias nicht gehorchen und nachgeben wollte, von Gottes Zorn gestraft und durch fleckigen Aussatz an der Stirne entstellt und so für die Beleidigung des Herrn gerade an dem Körperteil gebrandmarkt, wo die gezeichnet sind, die sich die Gnade des Herrn verdienen. Auch Aarons Söhne, die auf den Altar anderes Feuer legten, als der Herr geboten hatte, wurden sogleich vor den Augen des rächenden Herrn hinweggerafft.</p><p>Ihre Nachahmer und Nachfolger sind doch offenbar diejenigen, die unter Mißachtung der göttlichen Überlieferung neuen Lehren sich zuwenden und Schulen rein menschlicher Erfindung begründen. Gegen sie erhebt der Herr Tadel und Vorwurf in seinem Evangelium mit den Worten: „Ihr verwerfet Gottes Gebot, um eure Überlieferung aufzustellen“. Dieses Verbrechen ist schlimmer als das, das die Gefallenen begangen haben, die doch wenigstens für ihr Vergehen Buße tun und in voller Genugtuung Gottes Gnade erflehen. Hier sucht und bittet man die Kirche, dort bekämpft man sie: hier kann ein Zwang stattgefunden haben, dort verharrt man freiwillig im Verbrechen; hier hat der Gefallene nur sich geschadet, dort hat der, der es unternommen hat, einen Abfall oder eine Spaltung herbeizuführen, viele andere mit sich in den Irrtum hineingezogen; hier handelt es sich nur um den Verlust einer Seele, dort ist eine ganze Menge in Gefahr. Dieser sieht wenigstens seine Sünde ein und beweint und beklagt sie, der andere hingegen ist gar noch stolz auf seine Versündigung und gefällt sich gerade in seinen Verbrechen, während er die Kinder von der Mutter losreißt, die Schafe von dem Hirten hinweglockt und die heiligen Geheimnisse Gottes zunichte macht. Und während der Gefallene nur einmal gesündigt hat, sündigt jener Tag für Tag. Schließlich kann der Gefallene, wenn ihm nachmals der Märtyrertod beschieden ist, die Verheißungen des Himmelreiches noch ernten; wenn aber jener außerhalb der Kirche den Tod erleidet, so kann er unmöglich zu den Belohnungen der Kirche gelangen.</p><p>Auch möge sich niemand darüber wundern, geliebteste Brüder, wenn auch von den Bekennern einige auf diese Abwege geraten, wenn auch von ihnen etliche sich so schrecklich, so schwer versündigen. Denn das Bekenntnis bewahrt nicht vor den Nachstellungen des Teufels und verleiht einem, der noch in der Welt steht, keine dauernde Sicherheit gegen die Versuchungen und Gefahren, gegen die Anläufe und Angriffe der Welt. Sonst würden wir nie bei den Bekennern nachmals Betrug, Unzucht und Ehebruch zu sehen bekommen, wie wir sie jetzt zu unserem großen Leidwesen bei einigen wahrnehmen müssen. Mag der Bekenner sein, wer er will, größer, besser oder Gott wohlgefälliger ist er nicht als Salomo. Und doch behielt auch er nur so lange, als er auf des Herrn Wegen wandelte, die Gnade, die er von dem Herrn empfangen hatte; nachdem er aber den Weg des Herrn verlassen hatte, verlor er auch die Gnade des Herrn. Und deshalb steht geschrieben: „Halte fest, was du hast, damit nicht ein anderer deine Krone nehme!“ Diese Drohung, daß die Krone der Gerechtigkeit auch wieder entrissen werden könne, spricht der Herr sicherlich nur deshalb aus, weil mit dem Verluste der Gerechtigkeit notwendigerweise auch die Krone verloren geht.</p><p>Das Bekenntnis ist nur der erste Schritt zum Ruhme, nicht etwa schon der Gewinn der Krone, und es bildet nicht die Vollendung des Ruhmes, sondern nur den Anfang der Würdigkeit, Und da geschrieben steht: „Wer ausharret bis ans Ende, der wird selig sein“, so ist alles, was vor dem Ende liegt, nur eine Vorstufe, auf der man zum Gipfel des Heils emporsteigt, nicht das Endziel, mit dem man bereits die höchste Spitze erreicht hat. Ein Bekenner ist er: aber nach dem Bekenntnis ist die Gefahr nur noch größer, weil der Widersacher jetzt noch mehr gereizt ist. Ein Bekenner ist er: um so mehr muß er dann zu dem Evangelium des Herrn stehen, nachdem er durch das Evangelium von dem Herrn seinen Ruhm erlangt hat. „Wem viel gegeben wird, von dem wird viel gefordert, und wem viel Würde zuteil wird, von dem wird mehr Unterwürfigkeit verlangt“. Niemand möge durch das böse Beispiel eines Bekenners sich ins Verderben stürzen lassen, niemand möge Ungerechtigkeit, niemand möge Übermut, niemand möge Treulosigkeit im Glauben dem schlimmen Wandel eines Bekenners ablernen! Ein Bekenner ist er: dann sei er demütig und friedfertig, er sei in seinem Tun züchtig und bescheiden, damit er, der ein Bekenner Christi heißt, Christus, den er bekennt, auch nachahmt! Denn da dieser sagt: „Wer sich selbst erhebt, der wird erniedrigt werden, und wer sich selbst erniedrigt, der wird erhöhet werden“, und da er selbst vom Vater erhöht worden ist, weil er, das Wort und die Kraft und die Weisheit Gottes des Vaters, sich auf Erden erniedrigt hat, wie kann dann der die Selbstüberhebung lieben, der uns nicht nur durch sein Gesetz Demut geboten, sondern auch selbst vom Vater zum Lohne für seine Demut den herrlichsten Namen erhalten hat? Ein Bekenner Christi ist er: aber nur, wenn durch ihn nicht nachher die Majestät und Würde Christi gelästert wird. Die Zunge, die Christus bekannt hat, darf nicht schmähsüchtig, nicht aufrührerisch sein, sie soll nicht lärmende Beschimpfungen und Zänkereien vernehmen lassen, sie soll nicht gegen die Brüder und die Priester Gottes nach Worten des Ruhmes das Gift der Schlange schleudern. Wenn er sich aber nachher schuldig und verabscheuenswert gemacht, wenn er das Gut seines Bekenntnisses durch schlechten Lebenswandel vergeudet, wenn er sein Leben mit Schimpf und Schande befleckt hat, wenn er endlich die Kirche, in der er Bekenner geworden ist, verlassen, die in der Einheit begründete Eintracht zerrissen und so die frühere Glaubenstreue mit dem späteren Unglauben vertauscht hat, so kann er sich wegen seines Bekenntnisses nicht damit schmeicheln, als sei er zum Lohne der Herrlichkeit auserwählt; denn gerade dadurch ist das Maß der verdienten Strafe für ihn noch mehr angewachsen.</p><p>Auch den Judas hat ja der Herr unter die Apostel gewählt; und doch hat Judas nachmals den Herrn verraten. Aber die Festigkeit und der treue Glaube der Apostel ist deshalb doch nicht zu Fall gekommen, weil der Verräter Judas von ihrer Gemeinschaft abfiel. Ebensowenig hat auch hier die Heiligkeit und Würde der Bekenner etwa sogleich eine Einbuße erlitten, weil einige die Glaubenstreue gebrochen haben. Der selige Apostel [Paulus] erhebt seine Stimme und sagt in seinem Briefe: „Denn was liegt daran, wenn einige von ihnen vom Glauben abgefallen sind? Hat etwa ihr Unglaube die Glaubwürdigkeit Gottes entkräftet? Das sei ferne; denn Gott ist wahrhaftig, jeder Mensch aber lügenhaft“. Noch steht der größere und bessere Teil der Bekenner fest in der Kraft seines Glaubens und in der Wahrheit des Gesetzes und der Zucht des Herrn, und den Frieden der Kirche geben die nicht auf, die sich dessen bewußt bleiben, daß sie in der Kirche von Gott gewürdigt wurden, die Gnade zu erlangen. Und sie ernten gerade dadurch um so reicheren Ruhm für ihren Glauben, weil sie von dem Glaubensbruch derer, die ehedem durch die Gemeinschaft des Bekenntnisses mit ihnen vereint gewesen waren, sich fernhielten und sich so einer Befleckung durch das Verbrechen entzogen. Durch das wahre Licht des Evangeliums erleuchtet, von dem reinen und lauteren Glänze des Herrn umstrahlt, sind sie in der Bewahrung des Friedens Christi ebenso preiswürdig, als sie siegreich waren im Kampfe gegen den Teufel.</p><p>Mein Wunsch geht nun zwar, geliebteste Brüder, ebenso wie meine Sorge und meine Mahnung dahin, daß wo möglich keiner von den Brüdern zugrunde gehe und daß die Mutter den einen Leib des einmütigen Volkes freudig in ihren Schoß einschließe. Wenn jedoch mein heilsamer Rat einige Führer der Spaltungen und Urheber des Abfalls, die in ihrem blinden und hartnäckigen Wahnsinn verharren, nicht auf den Weg des Heils zurückzurufen vermag, so machet doch wenigstens ihr anderen euch frei von den Schlingen des Truges, die ihr euch in eurer Einfalt habt fangen oder von Irrtum euch habt verleiten oder durch irgendwelche Ränke trügerischer Arglist euch habt hintergehen lassen! Lenket eure irrenden Schritte zurück von den Abwegen und erkennet den rechten Pfad, der zum Himmel führt! Das bekräftigt der Apostel mit dem Worte: „Wir gebieten euch im Namen des Herrn Jesu Christi, daß ihr euch von allen Brüdern zurückzieht, die unordentlich wandeln und nicht nach der Überlieferung, die sie von uns empfangen haben“. Und wiederum sagt er: „Niemand täusche euch mit nichtigen Worten; denn deshalb kommt der Zorn Gottes über die Kinder des Ungehorsams. Werdet also nicht ihre Genossen!“ Zurückziehen muß man sich von den Sündern oder vielmehr sich vor ihnen flüchten, sonst irrt man ab von der Bahn des richtigen Weges und macht sich selbst des gleichen Verbrechens schuldig, indem man sich Leuten zugesellt, die einen schlechten Wandel führen, und auf den Wegen des Irrtums und Verbrechens dahinschreitet. Nur einen Gott gibt es und nur einen Christus, nur eine Kirche und nur einen Glauben und nur ein Volk, das durch den Kitt der Eintracht zu einem festen, einheitlichen Körper verbunden ist. Diese Einheit läßt sich nicht spalten, und der eine Leib kann durch eine gewaltsame Trennung seines festen Gefüges nicht geteilt, kann durch das Zerreißen und Zerfleischen seines Inneren nicht zerstückelt werden. Was immer vom Mutterleib sich trennt, das kann für sich gesondert nicht leben und atmen, das verliert die Möglichkeit des Heils.</p><p>Es mahnt uns der Heilige Geist und sagt: „Wo ist ein Mensch, der das Leben begehrt und es liebt, die besten Tage zu sehen? Bewahre deine Zunge vor dem Bösen und deine Lippen, daß sie nicht tückisch reden! Laß ab vom Bösen und tue Gutes, suche den Frieden und strebe ihm nach!“ Den Frieden muß suchen und erstreben der Sohn des Friedens, vor dem Übel der Zwietracht muß seine Zunge bewahren, wer das Band der Liebe kennt und schätzt. Seinen göttlichen Geboten und heilsamen Lehren fügte der Herr noch kurz vor seinem Leiden die Worte bei: „Den Frieden lasse ich euch, meinen Frieden gebe ich euch“. Ihn gab er uns als Erbe, alle Gaben und Belohnungen seiner Verheißung versprach er uns für die Bewahrung des Friedens. Sind wir die Erben Christi, so laßt uns im Frieden Christi beharren; sind wir Söhne Gottes, so müssen wir friedfertig sein! „Selig“, heißt es, „sind die Friedfertigen, denn sie werden Söhne Gottes genannt werden“. Friedfertig müssen die Söhne Gottes sein, sanftmütig im Herzen, aufrichtig in ihren Worten, einträchtig in der Liebe und in Treue miteinander verbunden durch die festen Bande der Einmütigkeit.</p><p>Diese Einmütigkeit herrschte dereinst zur Zeit der Apostel. So bewahrte das neue Volk der Gläubigen, den Geboten des Herrn gehorsam, die rechte Liebe. Das bestätigt die [göttliche] Schrift, die da sagt: „Die Schar derer aber, die gläubig geworden waren, war eines Herzens und einer Seele“, und abermals: „Und sie verharrten alle einmütig im Gebete samt den Frauen und Maria, die Jesu Mutter gewesen war, und mit seinen Brüdern“. Und deshalb waren ihre Bitten und Gebete so wirksam, deshalb vermochten sie auch mit Zuversicht alles zu erlangen, was sie von Gottes Barmherzigkeit erflehten.</p><p>Bei uns aber ist die Einmütigkeit in demselben Maße geschwunden, wie auch die Freigebigkeit im Wohltun zurückgegangen ist. Damals verkaufte man Häuser und Grundstücke, und indem man sich Schätze im Himmel sammelte, brachte man den Erlös den Aposteln, damit sie ihn zum Besten der Armen verteilten. Jetzt hingegen geben wir von unserem Vermögen nicht einmal den Zehnten, und während der Herr befiehlt, zu verkaufen, kaufen wir vielmehr noch hinzu und mehren unseren Besitz. So sehr ist in uns die Kraft des Glaubens dahingewelkt, so sehr die Stärke der Gläubigen erlahmt. Und deshalb sagt der Herr in seinem Evangelium im Hinblick auf unsere Zeiten: „Wenn des Menschen Sohn kommt, meinst du, er wird Glauben finden auf Erden?“ Wir sehen, wie das in Erfüllung geht, was er vorhergesagt hat. In der Furcht Gottes, im Gesetze der Gerechtigkeit, in der Liebe, in der Wohltätigkeit ist keine Glaubenstreue mehr zu finden. Kein Mensch denkt an Furcht vor der Zukunft, keiner achtet auf den Tag des Herrn, auf den Zorn Gottes, auf die schweren Strafen, die über die Ungläubigen kommen werden, und auf die ewigen Qualen, die für die Treulosen festgesetzt sind. Alles das, was unser Gewissen fürchten würde, wenn es gläubig wäre, fürchtet es in Wirklichkeit nicht, weil es eben überhaupt nicht glaubt Wäre es aber gläubig, so würde es auch auf der Hut sein; wäre es auf seiner Hut, so würde es auch entrinnen.</p><p>Wollen wir uns gegenseitig ermuntern, geliebteste Brüder, soviel wir können; wollen wir den Schlaf der alten Trägheit abschütteln und wachsam sein, um die Gebote des Herrn zu beobachten und zu erfüllen! Wollen wir so sein, wie er selbst uns zu sein geboten hat mit den Worten: „Eure Lenden seien umgürtet und die Lampen brennend und ihr Leuten ähnlich, die ihren Herrn erwarten, wenn er von der Hochzeit kommt, damit sie ihm öffnen, wenn er kommt und anklopft. Selig jene Knechte, die der Herr bei seiner Ankunft wachend findet!“ Umgürtet müssen wir sein, damit wir nicht, wenn der Tag des Aufbruchs kommt, unvorbereitet und ungerüstet betroffen werden. Leuchten und strahlen laßt unser Licht in guten Werken, damit es uns aus dieser Finsternis der Welt zu dem Glänze der ewigen Herrlichkeit emporführe! Laßt uns stets wachsam und vorsichtig der plötzlichen Ankunft des Herrn harren, damit, wenn er anklopft, unser Glaube wach ist und den Lohn seiner Wachsamkeit von dem Herrn empfängt! Werden diese Gebote gehalten, werden diese Mahnungen und Vorschriften befolgt, so können wir nicht vom Teufel tückisch im Schlafe überfallen werden, sondern wir werden als wachsame Knechte herrschen in Christi Reich.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Julius Baer, <em>Über die Einheit der katholischen Kirche</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-41/versions/uber-die-einheit-der-katholischen-kirche-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "sTfINaYq_Книга_о_смертности__Киприан_Карфагенский"
    path: "Cyprian_De_mortalitate"
    title: "Über die Sterblichkeit"
    menu: { parent: "Abhandlungen", title: "Über die Sterblichkeit", priority: 9 }
    update: true
    body: |-
      <p><em>Über die Sterblichkeit, übersetzt von Julius Baer (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34, München 1918).</em></p><p>Zwar ist bei den meisten von euch, geliebteste Bruder, ein fester Sinn, ein starker Glaube und ein frommes Herz zu finden, das angesichts des gewaltigen Umsichgreifens der gegenwärtigen Sterblichkeit sich nicht erschüttern läßt, sondern wie ein mächtiger, unerschütterlicher Fels die stürmischen Anläufe der Welt und die brandenden Wogen des zeitlichen Lebens eher selbst bricht als sich von ihnen brechen läßt und in den Versuchungen nicht unterliegt, sondern sich bewährt; weil ich jedoch bemerke, wie einige unter der Menge infolge des Mangels an Mut oder der Schwäche ihres Glaubens, wegen der Lockungen des weltlichen Lebens, wegen der Weichlichkeit ihres Geschlechtes oder, was noch schlimmer ist, wegen Abirrens von der Wahrheit nicht mehr so recht fest stehen und nicht mehr die göttliche und unbesiegbare Stärke ihres Herzens an den Tag legen, so durfte ich die Sache nicht unbeachtet lassen und mit Stillschweigen übergehen, sondern ich mußte, soweit unsere Wenigkeit es vermag, mit voller Kraft und mit Worten, die aus der Schrift des Herrn entnommen sind, die Feigheit des schwächlichen Sinnes bekämpfen, damit der, der schon angefangen hat, ein Mensch Gottes und Christi zu sein, Gottes und Christi auch wirklich würdig erachtet werde.</p><p>Denn jeder, geliebteste Brüder, der Gott als Krieger dient, der im himmlischen Lager stehend schon auf das Göttliche hofft, muß erst seine Pflicht erkennen, damit es gegenüber den Stürmen und Ungewittern der Welt bei uns kein Zagen, keine Verwirrung gibt. Hat doch der Herr dies alles vorhergesagt, indem er voraussehend mit mahnender Stimme das Volk seiner Kirche unterrichtete und lehrte, indem er es dazu vorbereitete und stärkte, alles Kommende zu ertragen. Daß Krieg und Hungersnot, Erdbeben und Seuchen allerorten ausbrechen, hat er vorherverkündigt und prophezeit, und damit nicht der unerwartete und überraschende Schrecken der Heimsuchungen uns niederschmettere, hat er schon lange zuvor darauf hingewiesen, daß die Drangsale sich in den letzten Zeiten mehr und mehr häufen. Seht, es geschieht jetzt, was gesagt ist, und da nun das eintritt, was vorausverkündigt ist, wird auch all das nachfolgen, was verheißen ist. Denn der Herr selbst verspricht und sagt: „Wenn ihr aber seht, daß dies alles geschieht, so wisset, daß das Reich Gottes ganz nahe ist“. Das Reich Gottes, geliebteste Brüder, ist in nächste Nähe gerückt; der Lohn des [himmlischen] Lebens und die Freude des ewigen Heils, unvergängliche Seligkeit und der dereinst verlorene Besitz des Paradieses winken bereits mit dem bevorstehenden Übergang der Welt. Schon folgt dem Irdischen das Himmlische, Großes dem Kleinen, das Ewige dem Vergänglichen. Wo wäre hier Raum für Angst und Sorge? Wer wäre da zaghaft und traurig, außer etwa einer, dem es an Hoffnung und Glauben fehlt? Denn nur der hat den Tod zu fürchten, der nicht zu Christus gehen will; nur der aber kann sich sträuben, zu Christus zu gehen, der nicht daran glaubt, daß er mit Christus zu herrschen beginnt.</p><p>Es steht geschrieben, der Gerechte lebe durch den Glauben. Wenn du aber gerecht bist und durch den Glauben lebst, wenn du wahrhaft auf Gott vertraust, warum begrüßest du es dann nicht mit Freuden, daß du zu Christus gerufen wirst, und warum wünschest du dir nicht Glück dazu, den Teufel los zu werden; denn du bist dann doch bei Christus und kannst der Verheißung des Herrn sicher sein? So hatte jener gerechte Simeon, der in Wahrheit ein Gerechter war und der mit vollem Glauben Gottes Gebote hielt, von Gott den Bescheid erhalten, er werde nicht eher sterben, als bis er Christus gesehen habe. Als nun das Christuskind mit seiner Mutter in den Tempel kam, da erkannte er im Geiste, daß Christus, von dem ihm vorher geweissagt war, nunmehr geboren sei. Er wußte, daß er nun bald sterben werde, nachdem er ihn gesehen. Voll Freude also über den schon so nahen Tod und der baldigen Abberufung gewiß, nahm er das Kind auf seine Arme, pries Gott, rief und sprach: „Jetzt lassest Du, Herr, Deinen Diener in Frieden scheiden nach Deinem Wort, weil meine Augen Deinen Heiland gesehen haben“. Damit bewies und bezeugte er doch offenbar, daß wir Diener Gottes dann erst Frieden, dann erst volle und ungestörte Ruhe haben, wenn wir den Stürmen dieser Welt entrückt sind und in den Hafen der ewigen Heimat und Sicherheit einlaufen, wenn wir unsere Todesschuld hier abgetragen haben und zur Unsterblichkeit gelangen. Denn das ist der wahre Friede, das ist die zuverlässige Ruhe, das die beständige, feste und ewige Sicherheit.</p><p>Was hat man dagegen auf der Welt anderes, als daß man täglich gegen den Teufel Krieg führen, als daß man gegen seine Speere und Geschosse in beständigem Ringen sich abkämpfen muß? Mit der Habsucht, mit der Unzüchtigkeit, mit dem Zorn, mit dem Ehrgeiz haben wir zu ringen, mit den fleischlichen Lastern, mit den weltlichen Lockungen haben wir einen beständigen und beschwerlichen Kampf zu bestehen. Umlagert und von allen Seiten von den Anfechtungen des Teufels bedrangt, vermag die Seele des Menschen kaum dem einzelnen Fehler entgegenzutreten, kaum dem einzelnen zu widerstehen. Ist die Habsucht niedergeworfen, so erhebt sich die Wollust; ist die Wollust unterdrückt, so tritt der Ehrgeiz an ihre Stelle; ist der Ehrgeiz überwunden, so erbittert uns der Zorn, es bläst der Hochmut uns auf, es lockt uns die Trunksucht, der Neid stört die Eintracht, und die Eifersucht zerreißt die Freundschaft. Du läßt dich dazu drängen, zu fluchen, was das göttliche Gesetz verbietet, du läßt dich dazu verleiten, zu schwören, was doch nicht erlaubt ist.</p><p>So viele Verfolgungen sind es, die unsere Seele Tag für Tag zu erdulden hat, so viele Gefahren bedrängen unser Herz. Und da sollten wir uns freuen, noch lange den Schwertstreichen des Teufels ausgesetzt zu sein, obwohl doch vielmehr sehnlich zu wünschen wäre, durch einen möglichst frühen erlösenden Tod eilends zu Christus zu gelangen? Belehrt er uns doch selbst mit den Worten: „Wahrlich, wahrlich, ich sage euch: ihr werdet weinen und wehklagen, die Welt aber wird sich freuen; ihr werdet traurig sein, aber eure Traurigkeit wird sich in Freude verwandeln“. Wer sollte nicht wünschen, die Traurigkeit los zu werden, wer sich nicht beeilen, zur Freude zu gelangen? Wann aber unsere Traurigkeit in Freude sich verwandelt, das erklärt abermals der Herr selbst mit den Worten: „Ich werde euch wiedersehen, und euer Herz wird sich freuen, und eure Freude wird niemand von euch nehmen“. Da also „Christus sehen“ sich freuen heißt und da es keine Freude für uns geben kann, wenn man nicht Christus sieht, welche Geistes Verblendung oder welcher Wahnsinn ist es dann, die Drangsale, die Pein und die Tränen der Welt zu lieben, statt vielmehr der Freude zuzueilen, die nie wieder genommen werden kann?</p><p>Das kommt aber daher, geliebteste Brüder, weil der richtige Glaube fehlt, weil niemand das für wahr hält, was Gott verheißt, der doch wahrhaftig ist und dessen Worte für die Gläubigen ewig feststehen. Verspräche dir ein würdiger, achtbarer Mann irgend etwas, so würdest du seinem Versprechen Glauben schenken und nicht annehmen, daß er dich täuschen und betrügen könnte, er, von dem du doch wüßtest, daß er in seinen Worten und Taten verlässig ist. Nun ist es Gott, der mit dir spricht: und du schwankst ungläubigen Sinnes mißtrauisch hin und her? Gott verheißt dir Unsterblichkeit und ewiges Leben, wenn du von dieser Welt scheidest: und du zweifelst? Das heißt gar keine Ahnung von Gott haben, das heißt Christus, den Lehrmeister des Glaubens, durch die Sünde des Unglaubens beleidigen, das heißt der Kirche angehören, ohne im Hause des Glaubens auch wirklichen Glauben zu haben.</p><p>Welchen Gewinn es bedeutet, das zeitliche Leben zu verlassen, das hat Christus selbst gezeigt, der Lehrmeister alles dessen, was zu unserem Heil und Nutzen dient; denn als seine Jünger betrübt waren, weil er sagte, er werde nunmehr dahingehen, da sprach er zu ihnen die Worte: „Wenn ihr mich geliebt hättet, würdet ihr euch freuen, daß ich zum Vater gehe“. Damit wollte er offenbar lehren und zeigen, daß wir statt zu trauern vielmehr uns freuen sollten, wenn die Teuren, die wir lieben, das zeitliche Leben verlassen. In Erinnerung daran schreibt und sagt der selige Apostel Paulus in seinem Briefe: „Leben ist mir Christus und Sterben Gewinn“, und er hält es für den größten Gewinn, nicht mehr von den Fallstricken der Welt festgehalten zu werden, nicht mehr den Sünden und Lastern des Fleisches ausgesetzt zu sein, sondern, gerettet aus den ängstigenden Drangsalen und befreit aus dem vergifteten Rachen des Teufels, auf Christi Ruf der Freude des ewigen Heils zuzueilen.</p><p>Aber freilich, manche stoßen sich daran, daß die Macht der jetzt wütenden Krankheit ebenso wie die Heiden auch die Unsrigen ergreift: gerade als ob der Christ nur deshalb gläubig geworden wäre, um, von der Berührung der Übel verschont, in Glück die Welt und das zeitliche Leben zu genießen, und nicht vielmehr deshalb, um für die künftige Freude aufbewahrt zu werden, nachdem er hier alles Widrige erduldet hat. Es stoßen sich manche daran, daß uns mit den anderen Menschen diese Sterblichkeit gemeinsam sei. Aber was hätten wir denn in dieser Welt mit den übrigen Menschen nicht gemeinsam, solange uns noch nach dem Gesetz der ersten Geburt dieses Fleisch gemeinsam bleibt? Solange wir hier in der Welt weilen, sind wir mit dem ganzen Menschengeschlecht durch die Gleichheit des Fleisches verbunden und nur dem Geiste nach getrennt. Bis also dieses Verwesliche die Unverweslichkeit annimmt und dieses Sterbliche die Unsterblichkeit empfängt und bis der Geist uns zu Gott dem Vater führt, solange sind uns all die Mängel, die dem Fleische anhaften, mit dem ganzen Menschengeschlechte gemeinsam. So bleibt ja auch, wenn bei Mißwachs der Boden eine nur magere Ernte liefert, keiner vom Hunger verschont; so trifft, wenn eine Stadt bei einem feindlichen Einfall besetzt worden ist, das Los der Knechtschaft alle zugleich; und wenn ein heiterer Himmel den Reges fernhält, dann haben alle unter der gleichen Trockenheit zu leiden; und wenn das Schiff an einem Felsenriff zerschellt, so ist der Schiffbruch für alle Insassen ohne Ausnahme gemeinsam. Und so haben wir auch die Augenschmerzen, die Fieberanfälle und die allgemeine Gliederschwäche mit den anderen gemeinsam, solange wir in der Welt dieses Fleisch gemeinsam an uns tragen.</p><p>Ja, im Gegenteil, wenn der Christ erkennt und daran festhält, unter welcher Bedingung, unter welcher Voraussetzung er zum Glauben gelangt ist, so wird er wohl wissen, daß er noch Schlimmeres als die anderen in der Welt ertragen muß, da er mehr als sie gegen die Anfechtungen des Teufels zu ringen hat. Die göttliche Schrift belehrt und mahnt uns im voraus mit den Worten: “Mein Sohn, wenn du in den Dienst Gottes trittst, so stehe fest in der Gerechtigkeit und Furcht und bereite deine Seele auf Versuchung!” und abermals: “Im Schmerz halte aus und in deiner Erniedrigung habe Geduld; denn Gold und Silber wird im Feuer bewährt”.</p><p>So ließ sich Job nach dem Verlust seiner ganzen Habe, nach dem Tod seiner Lieblinge, als er auch noch mit Geschwüren und Würmern schwer heimgesucht wurde, dadurch nicht bezwingen, sondern er bewährte sich, er, der inmitten seiner Kämpfe und Leiden die Geduld seines gottergebenen Sinnes zeigte und sprach: „Nackt bin ich aus der Mutter Schoß hervorgegangen, nackt werde ich auch unter die Erde gehen. Der Herr hat gegeben, und der Herr hat genommen. Wie es dem Herrn gefallen hat, so ist es geschehen. Gepriesen sei der Name des Herrn!“ Und als ihn auch sein Weib dazu antrieb, in murrenden und vorwurfsvollen Worten sich gegen Gott zu ergehen, nachdem er die Gewalt des Schmerzes nicht mehr zu ertragen vermöge, da antwortete er und sagte: „Wie eine von den törichten Weibern hast du gesprochen. Haben wir das Gute aus der Hand des Herrn angenommen, sollten wir dann nicht auch das Böse ertragen? In diesem allem, was ihm widerfuhr, versündigte sich Job mit seinen Lippen nicht im Angesicht des Herrn“. Deshalb stellt ihm auch Gott der Herr das Zeugnis aus und sagt [zum Satan]: „Hast du acht gehabt auf meinen Knecht Job? Denn keiner ist ihm gleich auf Erden, ein Mann ohne Klägerin wahrer Verehrer Gottes“. Und auch als Tobias nach den herrlichen Werken, nach den vielen Ruhmestaten seiner Barmherzigkeit an seinen Augen mit Blindheit geschlagen wurde, da fürchtete und pries er Gott in seinem Unglück und wuchs so gerade durch die Heimsuchung seines Körpers zu noch höherem Ruhme empor. Auch ihn suchte sein Weib zu verleiten mit den Worten: „Wo ist nun deine Gerechtigkeit? Sieh nur, was du leidest!“ Aber er blieb standhaft und fest in der Furcht Gottes, und durch seinen treuen Glauben dazu gewappnet, alles Leid zu ertragen, gab er der Versuchung seines schwachen Weibes trotz seines Schmerzes nicht nach, sondern erwarb sich bei Gott durch noch größere Geduld noch mehr Verdienste. Ihn lobt später der Engel Raphael und sagt: „Die Werke Gottes zu offenbaren und zu bekennen, ist ehrenvoll. Denn als du betetest und Sarra, brachte ich das Gedächtnis eures Gebetes vor das Angesicht der Herrlichkeit Gottes. Und als du die Toten ohne Arg begrubest und weil du nicht säumtest, aufzustehen und dein Mahl zu verlassen, sondern hingingst und den Toten bestattetest, bin ich auch gesandt worden, dich zu versuchen. Und wiederum hat mich Gott gesandt, dich zu heilen und Sarra, deine Schwiegertochter. Denn ich bin Raphael, einer von den sieben heiligen Engeln, die wir stehen und wandeln vor der Herrlichkeit Gottes“.</p><p>Diese Geduld haben die Gerechten stets gezeigt, an dieser Lehre haben die Apostel nach des Herrn Gebot stets festgehalten: nicht zu murren im Unglück, sondern mutig und geduldig alles auf sich zu nehmen, was auch in der Welt kommen möge. Das Volk der Juden hingegen hat dadurch immer Anstoß erregt, daß es gegen Gott nur zu häufig murrte, wie Gott der Herr im Buche Numeri bezeugt mit den Worten: „Ihr Murren lasse ab von mir, und sie werden nicht sterben“. Man darf nicht murren im Unglück, geliebteste Brüder, sondern muß geduldig und mutig alles ertragen, was auch kommt; denn es steht geschrieben: „Ein Opfer für Gott ist ein gequälter Geist; ein zerknirschtes und gedemütigtes Herz verachtet Gott nicht“. Auch im Deuteronomium mahnt der Heilige Geist durch Moses und sagt: „Der Herr, dein Gott, wird dich plagen und den Hunger über dich schicken, und in deinem Herzen wird man erkennen, ob du seine Gebote wohl beachtet hast oder nicht“, und wiederum: „Der Herr, euer Gott, versucht euch, um zu wissen, ob ihr den Herrn, euren Gott, liebet aus eurem ganzen Herzen und aus eurer ganzen Seele“.</p><p>So fand Abraham Gottes Wohlgefallen, weil er, um Gott zu gefallen, weder den Verlust seines Sohnes fürchtete noch sich weigerte, den Mord an seinem Kinde auszuführen. Wenn du es nicht erträgst, deinen Sohn nach dem Gesetz und Los der allgemeinen Sterblichkeit zu verlieren, was würdest du dann erst tun, wenn dir befohlen würde, deinen Sohn zu töten? Zu allem sollte dich deine Gottesfurcht und dein Glaube bereit machen. Sei es der Verlust des Vermögens, der dich betrifft, sei es die beständige, qualvolle Erschütterung der Glieder infolge verheerender Krankheiten oder die tiefschmerzliche, traurige Trennung von der Gattin, von den Kindern, von scheidenden Lieben: dies alles darf für dich kein Anstoß, sondern nur ein Kampf sein; dies alles soll des Christen Glauben nicht schwächen oder brechen, sondern vielmehr im Widerstande seine Tapferkeit erweisen. Denn alle Unbilden der gegenwärtigen Übel gilt es zu verachten im Vertrauen auf die künftigen Güter. Geht nicht ein Kampf vorher, so kann es keinen Sieg geben. Erst wenn im Getümmel der Schlacht der Sieg gewonnen ist, dann wird den Siegern auch die Krone zuteil. Den Steuermann erkennt man im Sturme, in der Schlacht bewährt sich der Krieger. Leicht läßt sich’s prahlen, wenn keine Gefahr droht; erst der Kampf in Widerwärtigkeiten ist die Erprobung der echten Tüchtigkeit. Der Baum, der tief im Boden wurzelt, wird von den ihn umtosenden Winden nicht erschüttert, und das Schiff, das in starkem Gefüge gefestigt ist, wird zwar auch von den Wogen hin und her gerüttelt, aber nicht durchbohrt, und wenn auf der Tenne das Getreide gedroschen wird, so spotten die kräftigen, schweren Körner des Windes, nur die leere Spreu wird vom reißenden Luftzug entrafft.</p><p>So sagt auch der Apostel Paulus nach den Schiffbrüchen, nach den Geißelhieben, nach den vielen schweren Martern des Fleisches und Körpers, die er erlitten hatte, er fühle sich durch die Widerwärtigkeiten nicht gequält, sondern geläutert, und er könne sich um so besser bewähren, je schwerer er heimgesucht werde. “Gegeben ist mir”, sagt er, “ein Stachel meines Fleisches, des Satans Engel, daß er mich mit Fäusten schlage, so daß ich mich nicht überhebe. Deshalb habe ich dreimal den Herrn gebeten, damit er von mir weiche, und er hat zu mir gesagt:”Es genügt dir meine Gnade; denn die Kraft wird in der Schwachheit vollendet’“. Wenn also Krankheit und Schwäche und irgendeine verheerende Seuche wütet, dann wird unsere Kraft vollendet, dann wird unser Glaube gekrönt, falls er in der Versuchung standgehalten hat, wie geschrieben steht:”Die Geschirre des Töpfers bewährt der Ofen, und die gerechten Menschen die Prüfung der Drangsal". Das ist also der Unterschied zwischen uns und den anderen, die Gott nicht kennen, daß jene im Unglück klagen und murren, während uns das Unglück von der wahren Tugend und dem wahren Glauben nicht abbringt, sondern im Leiden erprobt.</p><p>Daß jetzt beständiger Durchfall die Körperkräfte verzehrt, daß das tief im Inneren lodernde Feuer immer weiter wütet und den wunden Schlund ergreift, daß fortwährendes Erbrechen die Eingeweide erschüttert, daß die Augen durch den Blutandrang sich entzünden, daß manchen die Füße oder irgendwelche anderen Körperteile von zerstörender Fäulnis ergriffen und abgefressen werden, daß infolge der schweren Schädigung des Körpers durch die eintretende Ermattung der Gang gelähmt, das Gehör abgestumpft oder die Sehkraft getrübt wird, all das dient nur dazu, den Glauben zu erweisen. Gegen so viele Anfälle der Verheerung und des Todes mit unerschütterlicher Geisteskraft zu kämpfen, welch großen Mut zeigt das! Welche Erhabenheit verrät es, inmitten der Vernichtung des Menschengeschlechts aufrecht zu stehen, anstatt mit denen am Boden zu liegen, die keine Hoffnung auf Gott haben! Beglückwünschen dürfen wir uns vielmehr und es als Geschenk der Zeit begrüßen, wenn wir unseren Glauben standhaft zur Schau tragen, wenn wir durch das Erdulden von Leiden auf dem engen Wege Christi zu Christus eilen und so den Lohn dieses Weges und des Glaubens nach seinem Urteil finden. Der Tod ist allerdings zu fürchten, aber nur für den, der nicht aus Wasser und Geist wiedergeboren, sondern den Flammen der Hölle verfallen ist. Den Tod möge fürchten, wer sich nicht auf Christi Kreuz und Leiden berufen kann. Den Tod möge fürchten, wer aus diesem nur zu einem zweiten Tod übergeht. Den Tod möge der fürchten, den bei seinem Scheiden von der Welt die ewige Flamme mit immerwährender Pein foltern wird. Den Tod möge fürchten, wer von einer längeren Frist wenigstens den Gewinn hat, daß seine Qual und sein Seufzen einstweilen noch aufgeschoben ist.</p><p>Viele von den Unsrigen erliegen bei der gegenwärtigen Sterblichkeit dem Tode, das heißt: viele von den Unsrigen werden von der Welt befreit. Diese Sterblichkeit ist den Juden, den Heiden und den Feinden Christi eine schwere Plage, Gottes Dienern dagegen ist sie der Hingang zum Heil. Deshalb, weil nun ohne irgendwelchen Unterschied innerhalb des Menschengeschlechtes mit den Ungerechten auch die Gerechten sterben, braucht ihr noch nicht zu glauben, daß die Schlechten und die Guten ein gemeinschaftlicher Untergang trifft. Zur Erquickung werden die Gerechten gerufen, zur Bestrafung die Ungerechten dahingerafft; besonders schnell wird so den Gläubigen Schutz, den Ungläubigen Strafe zuteil. Blind und undankbar sind wir, geliebteste Brüder, gegen die göttlichen Wohltaten, und wir erkennen gar nicht, was uns alles erwiesen wird. Siehe, da scheiden im Frieden, ungefährdet im Besitze ihres vollen Ruhmes, die Jungfrauen, ohne sich vor den Drohungen des nahenden. Antichrists, ohne sich vor Schändung und vor den Häusern der Unzucht fürchten zu müssen. Die Jünglinge entrinnen der Gefahr der schlüpfrigen Jugendzeit, glücklich gelangen sie zu dem Lohne der Enthaltsamkeit und der Unschuld. Vor den Foltern bangt nicht mehr die zarte Matrone, der die Furcht vor der Verfolgung und die Martern unter den Händen des Henkers durch den schnellen Tod erspart bleiben. Durch die Angst vor der zeitlichen Sterblichkeit werden die Lauen angefeuert, die Lässigen im Zaume gehalten, die Untätigen angespornt; die Abgefallenen werden zur Rückkehr getrieben, die Heiden zum Glauben gezwungen, das alte Volk der Gläubigen zur Ruhe gerufen und ein neues, zahlreiches Heer mit stärkerer Kraft zur Schlacht gesammelt, um ohne Furcht vor dem Tode zu kämpfen, wenn es zum Treffen kommt, ein Heer, das in der Zeit der Sterblichkeit unter die Fahnen tritt.</p><p>Wie bedeutungsvoll, geliebteste Brüder, wie wichtig und wie notwendig ist sodann die Wirkung, daß diese Pest und Seuche, die so schrecklich und verderblich erscheint, die Gerechtigkeit jedes einzelnen erforscht und die Herzen des Menschengeschlechtes daraufhin prüft, ob die Gesunden den Kranken dienen, ob die Verwandten ihre Angehörigen innig lieben, ob die Herren sich ihrer leidenden Diener erbarmen, ob die Ärzte die um Hilfe flehenden Kranken nicht im Stiche lassen, ob die Trotzigen ihr Ungestüm unterdrücken, ob die Habgierigen die stets unersättliche Glut ihrer Habsucht wenigstens in der Furcht vor dem Tode löschen, ob die Stolzen ihren Nacken beugen, ob die Ruchlosen ihre Keckheit mäßigen, ob die Reichen wenigstens jetzt bei dem Tode ihrer Lieben etwas hergeben und spenden, da sie doch ohne Erben dahingehen werden! Selbst wenn diese Sterblichkeit nichts weiter genützt hätte, so hat sie uns Christen und Dienern Gottes schon damit einen großen Dienst erwiesen, daß wir jetzt begonnen haben, mit Freuden nach dem Märtyrertum zu verlangen, indem wir lernen, uns vor dem Tode nicht zu fürchten. Nur Übungen sind das für uns, nicht Heimsuchungen; sie verleihen dem Herzen den Ruhm der Tapferkeit, und durch die Verachtung des Todes bereiten sie zur Märtyrerkrone vor.</p><p>Aber da könnte vielleicht einer einwenden und sagen: „Das ist es ja eben, was mich bei der gegenwärtigen Sterblichkeit betrübt, daß ich, der ich zum Bekenntnis bereit gewesen war und mich von ganzem Herzen und mit voller Kraft darein ergeben hatte, das Leiden zu erdulden, meines Märtyrertums verlustig gehe, indem mir der Tod zuvorkommt.“ Erstens aber steht das Märtyrerturn nicht in deiner Macht, sondern bei Gottes Gnade, und du kannst nicht sagen, du habest etwas verloren, wenn du gar nicht weißt, ob du es zu empfangen verdienst. Zweitens sodann ist es Gott, der Herz und Nieren prüft und das Verborgene durchschaut und erkennt; er sieht und lobt dich und zollt dir Beifall, und wenn er es merkt, daß bei dir der Mut bereit gewesen wäre, läßt er dir auch den Lohn für deinen Mut zuteil werden. Hatte etwa Kain, als er Gott sein Opfer darbrachte, seinen Bruder schon getötet? Und dennoch hat Gott, der alles voraussieht, den im Herzen geplanten Mord schon vorher verdammt. Wie dort der schlimme Gedanke und der verderbliche Plan von Gott, der die Zukunft kennt, vorherbemerkt worden ist, so wird auch bei den Dienern Gottes, die zu bekennen gedenken und das Märtyrertum im Geiste planen, der dem Guten ergebene Sinn nach Gottes Richterspruch gekrönt. Es ist zweierlei, ob zu dem Martyrium der Mut fehlt oder ob es dem Mut nur an der Gelegenheit zum Martyrium mangelte. Wie dich der Herr befindet, wenn er dich ruft, ebenso richtet er dich auch; er bezeugt und sagt ja selbst; „Und alle Gemeinden werden erkennen, daß ich ein Durchforscher der Nieren und Herzen bin“. Denn nicht um unser Blut ist es Gott zu tun, sondern um unseren Glauben. Sind doch auch weder Abraham noch Isaak noch Jakob getötet worden, und dennoch haben sie, ausgezeichnet durch die Verdienste des Glaubens und der Gerechtigkeit, unter den Patriarchen sich den ersten Platz erworben. Ihrer Gemeinschaft wird jeder zugesellt, der treu und gerecht und rühmenswert befunden wird.</p><p>Wir dürfen nicht vergessen, daß wir nicht unseren, sondern Gottes Willen tun müssen nach den Worten, die uns der Herr täglich beten hieß. Wie widerspruchsvoll und wie verkehrt ist es, daß wir zwar darum bitten, daß Gottes Wille geschehe, wenn uns aber Gott ruft und von dieser Welt abfordert, nicht sofort dem Befehle seines Willens gehorchen wollen! Wir sträuben und widersetzen uns und lassen uns wie widerspenstige Knechte voll Trauer und Wehmut vor das Angesicht des Herrn führen, indem wir nur unter dem Zwange der Not, nicht in willigem Gehorsam von hier scheiden: und da wollen wir von demselben, zu dem wir so ungern gehen, mit himmlischen Belohnungen ausgezeichnet werden? Wozu also beten und flehen wir, daß das Himmelreich zu uns komme, wenn die Gefangenschaft auf Erden uns Freude macht? Wozu bitten und wünschen wir in häufig wiederholten Gebeten, der Tag des Reiches möge rasch herannahen, wenn die Sehnsucht größer und der Wunsch stärker ist, hier auf Erden dem Teufel zu dienen als mit Christus zu herrschen?</p><p>Damit übrigens die Beweise für die göttliche Vorsehung noch deutlicher sichtbar werden und zeigen, daß der Herr, der die Zukunft vorher weiß, auf das wahre Heil der Seinigen bedacht ist, hört folgendes Geschehnis! Als einer unserer Amtsbrüder und Mitpriester, durch Krankheit erschöpft und wegen des herannahenden Todes besorgt, noch um eine Frist für sich flehte, da erschien ihm während seines Flehens, als er schon fast im Sterben lag, ein Jüngling, verehrungswürdig durch seinen Glanz und seine Majestät, hoch von Gestalt und blendend anzusehen, eine Erscheinung, wie sie in der Nähe der menschliche Blick mit fleischlichen Augen kaum anzuschauen vermöchte und wie sie höchstens einer ansehen konnte, der schon im Begriffe stand, von der Welt abzuscheiden. Nicht ohne einen gewissen Unmut in Herz und Ton ließ er ihn an und sprach: „Vor dem Leiden [in der Verfolgung] fürchtet ihr euch? Von hinnen scheiden wollt ihr nicht? Was soll ich mit euch tun?“ Mit diesen Worten tadelt und mahnt einer, der wegen der Verfolgung für uns in Angst, wegen unserer Abberufung aber voll Sicherheit ist und der unserem gegenwärtigen Verlangen nicht zustimmt, sondern für die Zukunft Sorge trägt. So bekam unser Bruder und Amtsgenosse vor seinem Tode Worte zu hören, um sie den übrigen mitzuteilen. Denn er, der sie als Sterbender hörte, bekam sie doch nur zu dem Zwecke zu hören, um sie weiterzusagen; er hörte sie nicht für sich, sondern uns zugute. Denn was hätte er noch lernen sollen, der schon am Abscheiden war? Er hat vielmehr lediglich für uns, die Zurückbleibenden, die Lehre erhalten, und wir sollen erkennen, was uns allen zum Besten dient, wenn wir erfahren, daß ein Priester zurechtgewiesen wurde, der noch um eine Lebensfrist bat.</p><p>Wie oft ist auch mir selbst, dem Geringsten und Letzten, geoffenbart, wie häufig und deutlich von Gottes Gnade eingeschärft worden, beständig zu bezeugen und öffentlich zu verkünden, daß wir um unsere Brüder nicht trauern dürfen, wenn sie durch den Ruf des Herrn von der Welt befreit worden sind. Wissen wir doch, daß sie nicht verloren gehen, sondern nur vorausgehen, daß sie mit dem Abscheiden uns nur voranschreiten; daß man sich zwar, wie gewöhnlich bei einer Land- oder Seereise, nach ihnen sehnen, aber nicht um sie klagen darf, und daß man nicht hier schwarze Kleider anlegen soll, wenn sie dort bereits weiße Gewänder angetan haben; daß man den Heiden keine Gelegenheit geben darf, uns mit Fug und Recht zu tadeln, weil wir dieselben, die doch nach unserer Behauptung bei Gott leben, als tot und verloren betrauern und den Glauben, den wir in Wort und Rede kundtun, nicht auch mit Herz und Seele bezeugen und beweisen. Heuchler in unserer Hoffnung und in unserem Glauben sind wir, wenn nur vorgetäuscht, wenn nur erdichtet, wenn nur erlogen erscheint, was wir sagen. Es nützt nichts, wenn man in Worten Mut zur Schau trägt und durch Taten seine Echtheit widerlegt.</p><p>Auch der Apostel Paulus mißbilligt, tadelt und beanstandet es deshalb, wenn manche wegen des Hinscheidens der Ihrigen sich der Trauer hingeben: „Wir wollen euch, Brüder, nicht in Unkenntnis lassen über die Schlafenden, damit ihr nicht traurig seid wie die anderen, die keine Hoffnung haben. Denn wenn wir glauben, daß Jesus gestorben und auferstanden ist, so wird Gott auch diejenigen, die in Jesus entschlafen sind, mit ihm emporführen“. Nur die, sagt er, sind traurig beim Hinscheiden der Ihrigen, die keine Hoffnung haben. Wir aber, die in der Hoffnung leben und an Gott glauben und fest darauf vertrauen, daß Christus für uns gelitten hat und auferstanden ist, wir, die in Christus bleiben und durch ihn und in ihm auferstehen, warum sträuben wir uns dagegen, selbst aus der Welt hienieden abzuscheiden, oder warum trauern und klagen wir um den Hingang der Unsrigen, wie wenn sie verloren wären? Mahnt doch Christus, unser Herr und Gott, selbst und sagt: „Ich bin die Auferstehung. Wer an mich glaubt, wird leben, wenn er auch stirbt, und jeder, der lebt und glaubt an mich, wird in Ewigkeit nicht sterben“. Wenn wir an Christus glauben, so wollen wir auch seinen Worten und Verheißungen Vertrauen schenken, und da wir in Ewigkeit nicht sterben werden, so laßt uns in fröhlicher Gewißheit zu Christus eilen, mit dem wir immerdar leben und herrschen sollen!</p><p>Wenn wir vorerst sterben, so gehen wir durch den Tod zur Unsterblichkeit ein, und das ewige Leben kann nicht nachfolgen, wenn es uns nicht zuerst beschieden ist, von hinnen zu gehen. Das ist kein Hingang für immer, sondern nur ein Übergang und ein Hinüberschreiten zur Ewigkeit, nachdem die zeitliche Laufbahn durchmessen ist. Wer sollte nicht dem Besseren zueilen? Wer sollte nicht wünschen, recht bald verwandelt und umgeformt zu werden nach Christi Gestalt und nach der Herrlichkeit der himmlischen Gnade, wie der Apostel Paulus verkündet: „Unser Wandel aber“, sagt er, „ist im Himmel, woher wir auch den Herrn erwarten, Jesus Christus, der den Leib unserer Niedrigkeit umformen wird, nachgestaltet dem Leibe seiner Herrlichkeit“. Daß wir von solcher Beschaffenheit sein werden, verspricht auch Christus der Herr, wenn er den Vater für uns darum bittet, daß wir bei ihm sein und mit ihm in den ewigen Wohnungen und im himmlischen Reiche uns freuen dürfen, indem er sagt: „Vater, ich will, daß auch die, die Du mir gegeben hast, mit mir sind, wo ich bin, und die Herrlichkeit sehen, die Du mir gegeben hast, bevor die Welt geschaffen ward“. Wer zu Christi Sitz, wer zu der Herrlichkeit des himmlischen Reiches gelangen soll, der darf nicht trauern und klagen, sondern muß vielmehr auf Grund der Verheißung des Herrn und auf Grund seines Glaubens an die Wahrheit über diese seine Reise und Versetzung nur Freude zeigen.</p><p>So finden wir ja, daß auch Enoch hinweggenommen wurde, der Gott gefiel, wie die göttliche Schrift in der Genesis bezeugt mit den Worten: “Und Enoch gefiel Gott und wurde nachher nicht mehr gefunden; denn Gott hat ihn hinweggenommen”. Daß er Gefallen fand vor Gottes Angesicht, hatte die Wirkung, daß er gewürdigt wurde, von dieser Befleckung der Welt hinweggenommen zu werden. Aber auch durch Salomos Mund lehrt der Heilige Geist, daß diejenigen, die Gott gefallen, früher von hier genommen und schneller befreit werden, damit sie nicht durch die Berührungen mit der Welt befleckt werden, wenn sie in dieser Welt noch länger verweilen. “Er ward entrückt”, heißt es, “damit nicht die Bosheit seinen Sinn wandle; denn seine Seele war Gott wohlgefällig. Deshalb eilte er, ihn mitten aus der Ungerechtigkeit hinauszuführen”. So eilt auch in den Psalmen eine ihrem Gott ergebene Seele in geistlichem Glauben Gott zu, wie geschrieben steht: Wie überaus lieblich sind Deine Wohnungen, Gott der Heerscharen! Meine Seele verlangt und eilt zu den Vorhöfen Gottes".</p><p>Nur der kann wünschen, lange in der Welt zu bleiben, dem die Welt Freude macht, den die schmeichelnde und trügerische Zeitlichkeit mit den Reizen der irdischen Lust fesselt. Da nun aber die Welt den Christen haßt, warum liebst dann du sie, die dich haßt, und folgst nicht vielmehr Christus nach, der dich nicht nur erlöst hat, sondern auch liebt? Johannes erhebt in seinem Briefe laut seine Stimme und warnt uns, wir sollten ja nicht den fleischlichen Begierden folgen und die Welt lieben. „Liebet nicht die Welt“, sagt er, „noch das, was in der Welt ist! Wenn jemand die Welt liebt, so ist die Liebe des Vaters nicht in ihm. Denn alles, was in der Welt ist, ist Begehrlichkeit des Fleisches und Begehrlichkeit der Augen und Hoffart des zeitlichen Lebens, die nicht vom Vater ist, sondern aus der Begehrlichkeit der Welt. Und die Welt wird vergehen und ihre Begehrlichkeit; wer aber den Willen Gottes tut, bleibet in Ewigkeit, wie auch Gott bleibet in Ewigkeit“. Laßt uns vielmehr, geliebteste Brüder, mit reinem Herzen, mit festem Glauben, mit starkem Mute zu allem bereit sein, was Gott will, laßt uns alle Todesfurcht abwerfen und an die Unsterblichkeit denken, die nachfolgt! Wollen wir zeigen, daß wir das auch sind, was wir glauben; wollen wir den Hingang unserer Lieben nicht betrauern, und auch wenn der Tag unserer eigenen Abberufung gekommen ist, unverzüglich und mit Freuden zu dem Herrn gehen, da er uns ruft!</p><p>War dies schon immer die Pflicht der Diener Gottes, so hat es jetzt noch viel mehr zu geschehen, wo die Welt schon zusammengestürzt und von den Stürmen des drohenden Unheils umtost ist; und nachdem wir sehen, daß Schlimmes schon begonnen hat, und wissen, daß noch Schlimmeres bevorsteht, sollten wir es für den größten Gewinn erachten, wenn wir schnell von hinnen scheiden. Wenn in deiner Wohnung die altersschwachen Wände wankten, wenn das Dach über dir zitterte, wenn das schon haltlose, schon baufällige Haus samt seinen in der Länge der Zeit verfallenden Räumen jeden Augenblick einzustürzen drohte, würdest du da nicht in aller Eile ausziehen? Wenn auf einer Seefahrt ein wildbrausender Sturm die Fluten gewaltig aufpeitschte und dir nahen Schiffbruch verkündigte, würdest du da nicht schleunigst dem Hafen zueilen? Sieh nun, die ganze Welt wankt und fällt zusammen und bezeugt ihren Einsturz nicht nur mehr durch das Alter, sondern durch das Ende aller Dinge: und du dankst nicht Gott dafür, du wünschest dir nicht Glück dazu, daß du durch einen früheren Hingang entrückt wirst und so dem bevorstehenden Einsturz und Schiffbruch und den drohenden Heimsuchungen entgehst?</p><p>Zu beherzigen haben wir, geliebteste Brüder, und immer wieder zu bedenken, daß wir der Welt entsagt haben und nur als Gäste und Fremdlinge hier leben. Mit Freuden wollen wir den Tag begrüßen, der einen jeden seiner Heimat zuweist, der uns von hinnen nimmt, der uns von den Fallstricken der Welt befreit und dafür dem Paradiese und dem Himmelreich zurückgibt. Wer würde, wenn er in der Fremde weilt, sich nicht beeilen, in die Heimat zurückzukehren? Wer würde, wenn er in schneller Fahrt zu den Seinen gelangen will, nicht besonders sehnsüchtig günstigen Wind sich wünschen, um nur ja recht bald seine Lieben umarmen zu können? Als unsere Heimat betrachten wir das Paradies, unsere Eltern haben wir in den Patriarchen zu sehen begonnen: warum eilen und laufen wir dann nicht, um unsere Heimat sehen, um unsere Eltern begrüßen zu können? Eine große Anzahl von Lieben erwartet uns dort, eine stattliche, mächtige Schar von Eltern, Geschwistern und Kindern sehnt sich nach uns, um die eigene Rettung bereits unbesorgt und nur um unser Heil noch bekümmert. Unter ihre Augen, in ihre Arme zu eilen, welch große Freude für sie und uns zugleich! Welche Wonne dort im himmlischen Reiche, wenn kein Tod mehr schreckt, welch hohes, dauerndes Glück, wenn das Leben nie endet! Dort finden wir den ruhmreichen Chor der Apostel, dort die Schar der jubelnden Propheten, dort die zahllose Menge der Märtyrer, die wegen ihres glorreichen Sieges in Kampf und Leiden die Krone empfing, dort die triumphierenden Jungfrauen, die die Begehrlichkeiten des Fleisches und des Leibes durch die Macht der Entsagung bezwangen, dort die Barmherzigen, die durch die Speisung und die reiche Beschenkung der Armen Werke der Gerechtigkeit vollbrachten und nun dafür ihren Lohn erhielten, die getreu den Geboten des Herrn ihre irdischen Güter in himmlische Schätze verwandelten. Zu ihnen, geliebteste Brüder, laßt uns mit gierigem Verlangen hineilen und mit dem Wunsche, daß es uns vergönnt sein möge, recht bald bei ihnen zu sein, recht bald zu Christus zu gelangen! Diesen Gedanken laßt Gott bei uns sehen, diesen Vorsatz des Geistes und des Glaubens laßt Christus bei uns erblicken! Je größer unsere Sehnsucht nach ihm ist, desto reicher wird der Lohn der Liebe ausfallen, den er uns zuteil werden läßt.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Julius Baer, <em>Über die Sterblichkeit</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 34), München 1918. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-44/versions/uber-die-sterblichkeit-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

