    body: |-
      <p><strong>Gedenktag:</strong> 4. (17.) Dezember</p>
      <h2>Biografie</h2>
      <h3>Das Leben des ehrwürdigen Johannes von Damaskus bis zur Annahme des Mönchtums</h3>
      <p>Über die biografischen Einzelheiten der Kindheit und der Jugend des ehrwürdigen Johannes von Damaskus ist zuverlässig nur wenig bekannt. Es gibt Gründe zu behaupten, dass der heilige Johannes in der zweiten Hälfte des 7. Jahrhunderts in Damaskus geboren wurde.</p>
      <p>Er stammte aus einer bekannten und sehr wohlhabenden Familie. Seine Vorfahren hatten unmittelbaren Anteil an den höchsten Machtstrukturen, die auf dem Gebiet Syriens regierten. Der Großvater des Ehrwürdigen, Mansur ibn Sardschun, bekleidete die Stellung des Leiters des Apparats des Steuerdienstes von Damaskus, wobei er diesen Posten dank seiner persönlichen Eigenschaften sogar beim Wechsel der Herrscher behielt.</p>
      <p>Über seinen Sohn, Sardschun ibn Mansur, wird in einer der Chroniken des ausgehenden 7. Jahrhunderts sowohl als über einen Christen als auch als über einen Schatzhüter berichtet. Den Einschätzungen der Forscher nach waren die Vorfahren des Johannes wahrscheinlich syrischer und nicht arabischer Herkunft.</p>
      <p>Es wird angenommen, dass bei der Ausbildung des Ehrwürdigen ein gut gebildeter Mönch aus Kalabrien eine wesentliche Rolle spielte, den der Vater des Johannes von Damaskus, Sergius (ibn Sardschun), aus der Gefangenschaft losgekauft hatte. Als Sergius einst diesen Unfreien sah, der in bittere Tränen aufgelöst war, und ihn fragte, worin der Grund eines so untröstlichen Weinens bestehe, hörte er zur Antwort, jener bedauere, dass er vielleicht werde sterben müssen, ohne noch rechtzeitig sein geistliches Gut (den angesammelten Erfahrungsschatz) an irgendjemanden weitergegeben zu haben.</p>
      <p>Wie sich herausstellte, besaß der Mönch umfangreiche Kenntnisse auf dem Gebiet der Theologie, der Philosophie, der Musik, der Dialektik, der Rhetorik, der Physik und der Astronomie. Was genau er seinen Schützling lehrte, ist unbekannt, doch lässt sich anhand der später verfassten theologischen und hymnographischen Werke des Johannes von Damaskus unschwer erraten, dass er dessen Seele mit vielem Nützlichen zu erfüllen vermochte. Gemeinsam mit Johannes lernte bei dem Mönch auch der Adoptivsohn des Sergius, Kosmas (der künftige heilige Kosmas von Maiuma).</p>
      <p>Nachdem er die gebührende Bildung erhalten hatte, nahm Johannes als Sohn eines hochgestellten Untertanen einen Platz in der Machthierarchie ein, der der Stellung seines Vaters entsprach. Hinsichtlich der Art seiner beruflichen Tätigkeit gibt es keine einhellige Meinung. Einer Quelle zufolge diente Johannes in der Leitung des Dienstes für die Steuereinziehung, anderen zufolge bekleidete er die Stellung des Stadthauptmanns von Damaskus, des ersten Ministers des Kalifen.</p>
      <p>Obwohl von Vorrechten und Ehren umgeben, hielt Johannes von Damaskus den Weg einer weltlichen Karriere und des materiellen Wohlergehens dennoch nicht für den besten Weg. Sein Herz war schon damals auf Christus gerichtet. Es wird behauptet, dass er bereits in jenen Zeiten zum Schutz des orthodoxen Glaubens vor verschiedenen Häretikern antrat.</p>
      <p>Doch siehe, durch die Vorsehung Gottes war es ihm beschieden, vor die endgültige Wahl zwischen dem weltlichen Glück und der völligen Entsagung von den Dingen dieser Welt zu treten. Als unter Kaiser Leo dem Isaurier die Streitigkeiten um den Ikonoklasmus ausbrachen und danach, nach dem Jahr 728, auch grausame Verfolgungen der Verehrer der orthodoxen Ikonen entfaltet wurden, richtete Johannes von Damaskus die Kraft seines Talents, sein Wissen und seinen Eifer auf den Kampf gegen die ikonoklastische Häresie.</p>
      <p>Seine mündlichen Ermahnungen und seine schriftlichen Werke hatten einen kolossalen Erfolg, was natürlich nicht der Aufmerksamkeit der machthabenden Anhänger der Häresie, der Mächtigen dieser Welt, entgehen konnte (zunächst verfasste er eine Rede zur Verteidigung der heiligen Ikonen und sandte sie nach Konstantinopel, danach schrieb er noch zwei weitere; siehe ausführlicher: Drei Verteidigungsreden gegen die Verächter der heiligen Ikonen).</p>
      <h3>Die mönchische Askese</h3>
      <p>Schließlich wurde die Tätigkeit des Ehrwürdigen bekannt und begann sogar den Kaiser, den Ikonoklasten selbst, zu reizen. Und da bedienten sich die Häretiker im Kampf gegen den Kämpfer für die Reinheit des Glaubens ihrer beliebtesten häretischen Waffe – der Lüge. Nur war die Lüge diesmal nicht gegen die Dogmen des Glaubens gerichtet, sondern auf die Untergrabung des Rufes ihres Verteidigers. Johannes von Damaskus wurde beim Kalifen verleumdet, indem man ihn der Verschwörung und des Verrats beschuldigte. Dabei wurde eine ebenso raffinierte wie schändliche Art der Verleumdung gewählt. Ein Schreiber fälschte die Handschrift des Heiligen und schrieb in seinem Namen einen Brief an den Kaiser mit dem Versprechen, die Stadt Damaskus zu übergeben. Danach wurde dieser Brief dem Kalifen übergeben. Infolgedessen wurde Johannes der Schande und einer grausamen Strafe unterworfen: der Abtrennung der Hand.</p>
      <p>Doch durch ein besonderes göttliches Eingreifen wurde nach dem tränenreichen, herzlichen Gebet des Leidenden vor der Ikone der Gottesmutter die abgeschlagene Hand, die man an die Wunde angelegt und mit einem Tuch verbunden hatte, auf wunderbare Weise geheilt (zu dieser Zeit befand er sich gleichsam wie im Schlaf), die geschändete Ehre wiederhergestellt und die Lästerer beschämt. Später brachte der Ehrwürdige zum Gedächtnis und aus Dankbarkeit für dieses Ereignis ein aus Silber gefertigtes Abbild der Hand an der Ikone an. Zu Ehren dieses Ereignisses setzte sich in der Ikonographie das Bild der Gottesgebärerin „Die Dreihändige“ (Tricherusa) durch.</p>
      <p>Johannes wurde erneut ein Platz am Hof angeboten, doch er lehnte die Stellung ab und zog sich, nachdem er sein gesamtes Vermögen verteilt und die Sklaven freigelassen hatte, von dieser Welt zurück, indem er in die Reihen der mönchischen Bruderschaft eintrat. Bekannt ist, dass die Mönchstonsur in einem der palästinischen Klöster vollzogen wurde. Es gibt eine Überlieferung, dass dieses Kloster die Lavra des heiligen Sabbas des Geheiligten war. Mit dem Mönchtum nahm Johannes auch einen neuen Namen an, unter dem er vor Gott und der Kirche verherrlicht wurde – Johannes (zuvor nannte man ihn wie seinen Großvater: Mansur).</p>
      <p>Man erzählt, dass die Mönche ihm anfangs mit Argwohn begegneten, war er doch immerhin ein ehemaliger Würdenträger. Viele weigerten sich, ihn unter ihre Anleitung zu nehmen. Schließlich fand sich ein strenger Asket, der bereit war, ihn zum Gehorsam anzunehmen. Allerdings wurde Johannes dabei die feste Bedingung gestellt, dass er entschieden von der Beschäftigung mit irgendeiner literarischen Arbeit ablassen müsse. Und er ließ davon ab.</p>
      <p>Doch da geschah es, dass einem Mönch ein Angehöriger starb, woraufhin dieser, von Trauer ergriffen, Johannes zu überreden begann, darüber etwas Tröstliches zu schreiben. Johannes weigerte sich lange, doch dann entschloss er sich dennoch und verfasste Grabgedichte. Die Verse wurden wunderbar, doch der Lehrer des Heiligen, der Greis, der ihm die Beschäftigung mit der Schriftstellerei verboten hatte, in Zorn und jagte ihn sogar aus der Zelle. Da begann Johannes, ihn um Vergebung zu bitten. Dieser Bitte schlossen sich auch die übrigen Klosterbrüder an. Schließlich war der Greis bereit, dem Ehrwürdigen zu vergeben, doch dieser musste, nach seinem Wort, das Kloster eigenhändig von Unrat reinigen.</p>
      <p>Johannes erfüllte den Auftrag und offenbarte dabei aufrichtige Demut, womit er das Herz des strengen Beichtvaters rührte. Unterdessen trat für Johannes die Gottesmutter selbst ein, indem sie dem Greis in einer Erscheinung erschien. Nach diesem Vorfall segnete der Greis Johannes zum literarischen Schaffen zum Ruhm der Orthodoxie.</p>
      <p>Einigen Quellen zufolge rief der Jerusalemer Patriarch Johannes einst Johannes von Damaskus zu sich und weihte ihn in den Rang eines Presbyters. Bald darauf entschlief der Patriarch, und Johannes kehrte in sein Kloster zurück. Man schrieb das Jahr 735.</p>
      <p>Nachdem der Thron des Selbstherrschers auf Kopronymos übergegangen war, loderte der Kampf gegen die Ikonen mit noch größerer Erbitterung auf. Johannes von Damaskus brandmarkte, in Konstantinopel angekommen, kühn den Kaiser und die häretischen Bischöfe, die ihm nach dem Munde redeten. Es wird behauptet, dass auf dem Konzil von 754 (755) gegen den heiligen Johannes von Damaskus eine Anathematisierung ausgesprochen wurde. Einigen Nachrichten zufolge wurde er sogar der Einkerkerung unterworfen.</p>
      <p>Das Todesjahr des Ehrwürdigen ist nicht genau festgestellt. Man nimmt an, dass Johannes von Damaskus um die Jahre 775–780 im Herrn entschlief.</p>
      <h2>Das schöpferische Erbe</h2>
      <p>Der heilige Johannes war ein außerordentlich begabter und fruchtbarer kirchlicher Schriftsteller. Bei aller Weite der in seinen Werken behandelten Themen ist es in ihnen schwer, eine Stelle zu finden, die negative Kritik verdiente. In dieser Hinsicht gilt Johannes von Damaskus mit Recht als einer der nüchternsten und orthodoxesten Wortführer der Heiligen Überlieferung der Kirche.</p>
      <p>Unter den berühmtesten fundamentalen Werken dieses Vaters ragt die „Genaue Darlegung des orthodoxen Glaubens“ hervor. Ein charakteristisches Merkmal der genannten theologischen Abhandlung, das sie von vielen anderen Glaubenslehren jener Zeit unterscheidet, ist die klare, systematisierte Darlegung, die knappe, aber gehaltvolle Erklärung der dargelegten dogmatischen Wahrheiten.</p>
      <p>Als ein weiteres, nicht weniger bemerkenswertes Werk lässt sich „Die philosophischen Kapitel“ nennen. Im Rahmen dieser Arbeit wird eine klare Erläuterung der wichtigsten theologischen Ausdrücke und Termini gegeben, darunter auch derjenigen, die formal aus der Philosophie übernommen wurden. Der Aufzählung und Entlarvung der Häresien ist das Werk „Über die hundert Häresien in Kürze“ gewidmet.</p>
      <p>Außerdem verfasste der Ehrwürdige eine Vielzahl von Werken unterschiedlicher Ausrichtung, darunter Werke, die den wichtigsten christlichen Festen gewidmet sind (siehe zum Beispiel: Rede auf die überaus herrliche Verklärung unseres Herrn Jesus Christus; Zwei Reden auf die Geburt der allerheiligsten Gottesgebärerin; Drei Lobreden auf die Entschlafung der Gottesmutter), sowie Werke hymnographischen, hymnendichterischen Charakters (siehe: Der Osterkanon).</p>
      <h2>Hymnographie</h2>
      <p><strong>Troparion an den ehrwürdigen Johannes von Damaskus, 8. Ton</strong></p>
      <blockquote>
      <p>Mentor der Orthodoxie, / Lehrer der Frömmigkeit und der Reinheit, / Leuchte des Weltalls, / gottbehauchte Zierde der Mönche, Johannes der Weise, / durch deine Lehren hast du alles erleuchtet, geistliche Flöte, // bitte Christus Gott, dass unsere Seelen gerettet werden.</p>
      </blockquote>
      <p><strong>Kondakion an den ehrwürdigen Johannes von Damaskus, 4. Ton</strong></p>
      <blockquote>
      <p>Den Hymnendichter und geehrten Gottverkünder, / den Zuchtmeister und Lehrer der Kirche / und den Widerstreiter gegen die Feinde wollen wir, o Johannes, besingen: Denn er nahm die Waffe, das Kreuz des Herrn, / und wehrte den ganzen Trug der Häresien ab / und als ein warmer Fürsprecher bei Gott // schenkt er allen die Vergebung der Sünden.</p>
      </blockquote>
