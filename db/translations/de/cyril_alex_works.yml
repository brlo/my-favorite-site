      <p><em>Drei ökumenische Briefe (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>*Drei Briefe Cyrills, aus den Jahren 430—433, haben dadurch eine besondere Bedeutung erlangt, daß sie von ökumenischen Konzilien als zuverlässige Darstellungen der katholischen Glaubenslehre anerkannt und bestätigt wurden. Man hat sie deshalb „Ökumenische Briefe" geheißen.</p><p>Dem zweiten Briefe an Nestorius, aus dem Januar oder Februar 430, haben das Konzil zu Ephesus 431, das Konzil zu Chalzedon 451 und noch einmal das Konzil zu Konstantinopel 553 ihre rückhaltlose Anerkennung ausgesprochen. Zu Ephesus, am 22. Juni 431, hatte Cyrillus im Anschluß an die Verlesung des vollständigen Textes die Frage gestellt, ob dieser Brief nicht in Einklang stehe mit dem Nizänischen Glaubensbekenntnisse, worauf alle anwesenden Bischöfe in durchaus bejahendem Sinne antworteten, 125 Bischöfe mit noch erhaltenen kurzen Worten zur Begründung ihres Votums. In der Gesamtausgabe der Werke Cyrills wird der Brief als Ep. 4 gezählt, Migne 77, 43—50; neue Sonderausgaben desselben bei Pusey, S. Cyrilli Epistolae tres oecumenicae usw., Oxonii 1875, 2—11 [hier ist dem griechischen Texte die lateinische Übersetzung von Marius Mercator, gest. etwa 431, zur Seite gestellt]; bei Schwartz a. a. 0. I 1, pars 1, 25—28. *</p><p>Seinem frömmsten und gottgeliebtesten Amtsbruder Nestorius sagt Cyrillus Gruß im Herrn.</p><p>Wie ich höre, bemäkeln gewisse Leute meinen Ruf bei Deiner Gottesfurcht, und zwar sehr häufig, indem sie namentlich die Zusammenkünfte der Spitzen der Gesellschaft als günstige Gelegenheit abpassen und vielleicht auch Deinen Ohren schmeicheln zu können glauben. Sie führen böse Reden über mich, obgleich ich ihnen keinerlei Unrecht zugefügt, wohl aber, und zwar in milder Weise, einen Verweis erteilt habe, dem einen, weil er Blinde und Arme schädigte, dem andern, weil er gegen seine Mutter das Schwert gezogen, dem dritten, weil er zusammen mit einer Magd fremdes Gold gestohlen und immer in einem Rufe gestanden hat, wie man ihn auch seinen schlimmsten Feinden nicht wünschen möchte. Doch will ich über solche Leute nicht weiter reden, damit es nicht den Anschein habe, als ob meine Wenigkeit sich über den Herrn und Meister oder auch über die Väter erheben wollte. Es wird ja kaum jemand, mag er sein Leben gestalten, wie er will, den bösen Zungen schlechter Menschen entgehen können. Aber diejenigen, deren „Mund voll ist von Fluch und Bitterkeit", werden einst dem Richter aller Rechenschaft zu geben haben.</p><p>Ich wende mich wieder dem zu, was mir besonders am Herzen liegt, und bitte Dich auch heute als meinen Bruder in Christus, Du mögest bei Deinen Predigten vor dem Volke mit aller Sorgfalt auf den Gehalt der Lehre und den Sinn des Glaubens acht haben und wohl bedenken, daß der, der auch nur einen einzigen von denen, die an Christus glauben, ärgert, einem unerträglichen Zorne verfällt. Wenn aber deren, die beleidigt werden, so viele sind, wie sollten wir nicht mit größter Vorsicht dafür Sorge tragen, Ärgernisse klug zu verhüten und denen, die nach Wahrheit verlangen, die gesunde Lehre des Glaubens darzureichen? Auch dies aber wird von großem Nutzen für uns sein, wenn wir die Schriften der heiligen Väter zur Hand nehmen und ihre Worte möglichst hoch schätzen und „uns selbst prüfen, ob wir im Glauben sind", wie geschrieben steht, indem wir unsere Ansichten mit den richtigen und untadeligen Lehren der Väter in Einklang bringen.</p><p>Nun hat das heilige und große Konzil erklärt, daß der aus Gott und dem Vater der Natur nach gezeugte eingeborene Sohn, wahrer Gott vom wahren Gott, Licht vom Lichte, der, durch den der Vater alles gemacht hat, in eigener Person herabgestiegen, Fleisch und Mensch geworden ist, gelitten hat, am dritten Tage wieder auferstanden und zu den Himmeln aufgefahren ist.</p><p>Diesen Worten und Lehrsätzen müssen auch wir folgen, wohl bedenkend, was es heißt, daß das Gott entstammte Wort Fleisch und Mensch geworden ist. Wir behaupten nämlich nicht, daß die Natur des Wortes in Fleisch umgewandelt, auch nicht, daß sie zu einem ganzen, aus Seele und Leib bestehenden Menschen umgeändert worden sei. Wir behaupten vielmehr, daß das Wort mit einer vernünftigen Seele beseeltes Fleisch der Person nach in unaussprechlicher und unbegreiflicher Weise sich selbst geeint hat und so Mensch geworden ist und Menschensohn geheißen hat, nicht bloß dem Willen oder dem Wohlgefallen nach, auch nicht bloß durch Annahme einer Person, sondern deshalb, weil aus den beiden verschiedenen, zu wahrer Einheit verbundenen Naturen ein Christus und Sohn geworden ist. Nicht wie wenn die Verschiedenheit der Naturen um der Einigung willen aufgehoben worden wäre, sondern so, daß Gottheit und Menschheit zusammen uns den einen Herrn und Christus und Sohn erbaut haben, vermöge der unaussprechlichen und geheimnisvollen Verbindung zu einer Einheit.</p><p>In diesem Sinne heißt es, daß er, wiewohl er vor Ewigkeiten aus dem Vater sein Dasein empfing und gezeugt wurde, dem Fleische nach auch aus dem Weibe geboren worden ist. Nicht als ob seine göttliche Natur in der heiligen Jungfrau ihren Ursprung genommen hätte, und nicht als ob eine zweite Geburt nach der Geburt aus dem Vater ihrer selbst wegen notwendig gewesen wäre. Denn es ist gottlos und unsinnig zugleich, zu sagen, daß der, der vor aller Ewigkeit ist und gleichewig mit dem Vater ist, einer zweiten Geburt bedurft hätte, um zum Dasein zu gelangen. Aber um unsertwillen und um unseres Heiles willen hat das Wort die menschliche Natur der Person nach sich selbst geeint und ist aus dem Weibe hervorgegangen; und darum heißt es, daß er fleischlich geboren worden ist. Denn es ist nicht zuerst ein gewöhnlicher Mensch aus der heiligen Jungfrau geboren worden und auf diesen dann das Wort herabgestiegen, sondern aus dem Mutterschoße selbst ist er geeint hervorgegangen; und deshalb heißt es, daß er sich der fleischlichen Geburt unterzogen hat, weil er die Geburt seines Fleisches zu seiner eigenen Geburt macht. So, behaupten wir, hat er auch gelitten und ist er auferstanden. Nicht wie wenn Gott das Wort in seiner eigenen Natur gelitten oder die Schläge, die Durchbohrung mit den Nägeln und die sonstigen Wunden empfunden hätte. Denn die göttliche Natur ist leidenslos, weil ja auch körperlos. Da aber der ihm zu eigen gewordene Leib dies gelitten hat, so heißt es wiederum, daß er selbst es für uns gelitten hat. Denn in dem leidenden Leibe war der Leidensunfähige. In gleicher Weise denken wir auch über sein Sterben. Denn das Wort Gottes ist seiner Natur nach unsterblich und unvergänglich und Leben und Lebensspender. Weil aber wiederum sein eigener Leib „durch die Gnade Gottes„, wie Paulus sagt, „für einen jeden den Tod gekostet hat“, so heißt es, daß er selbst für uns den Tod erlitten hat. Nicht als ob er, soweit es auf seine Natur ankommt, dem Tode erlegen wäre — denn dies zu sagen oder zu denken, wäre Wahnsinn —, sondern weil, wie ich soeben sagte, sein Fleisch den Tod gekostet hat. So wird auch, da sein Fleisch auferweckt worden, wiederum von seiner Auferstehung gesprochen, nicht wie wenn er selbst dem Untergange anheimgefallen wäre — das sei fern —, sondern wiederum weil sein Leib auferweckt worden.</p><p>In dieser Weise bekennen wir einen Christus und Herrn, indem wir nicht etwa einen Menschen mit dem Worte zusammen anbeten, damit nicht durch das „zusammen" die Vorstellung einer Scheidung eingeführt werde, sondern einen und denselben Christus anbeten, weil sein Leib dem Worte nicht fremd ist. Mit diesem Leibe thront er ja auch zur Rechten des Vaters, weil wiederum nicht zwei Söhne an der Seite des Vaters sitzen, sondern ein Sohn gemäß der Einigung mit dem Fleische. Wollten wir aber die Einigung der Person nach, sei es als unmöglich, sei es als unangebracht ablehnen, so wären wir gezwungen, zwei Söhne anzunehmen, weil es ganz unvermeidlich sein würde, zu scheiden zwischen einem Menschen für sich, der nur durch den Namen des Sohnes geehrt worden, und dem Gott entstammten Worte für sich, welches von Natur aus den Namen und die Sache der Sohnschaft besitzt.</p><p>Es darf demnach der eine Herr Jesus Christus nicht in zwei Söhne zerteilt werden, und es kann der rechten Glaubenslehre in keiner Weise dienlich sein, dies zu tun, mögen auch einige Leute sich für eine Einigung von Personen aussprechen. Denn die Schrift hat nicht gesagt, daß das Wort sich die Person eines Menschen geeint habe, sondern daß es selbst Fleisch geworden ist. Das aber bedeutet nichts anderes, als daß es in gleicher Weise wie wir an Blut und Fleisch teilgenommen und unsern Leib sich zu eigen gemacht hat und als Mensch aus dem Weibe hervorgegangen ist, ohne aufzuhören, Gott zu sein und aus Gott dem Vater gezeugt zu sein, sondern auch in der Annahme des Fleisches bleibend, was es war.</p><p>Das ist es, was allenthalben als die Lehre des wahren Glaubens gilt. So, finden wir, haben die heiligen Väter gedacht; so haben sie unbedenklich die heilige Jungfrau Gottesgebärerin genannt, nicht wie wenn die Natur des Wortes oder seine Gottheit aus der heiligen Jungfrau ihren Ursprung genommen hätte, sondern weil aus ihr der heilige Leib geboren worden ist, der vernünftig beseelt und dem das Wort der Person nach geeint war; deshalb heißt es, daß er selbst dem Fleische nach geboren worden.</p><p>Indem ich dies auch heute wieder aus der Liebe in Christus schreibe, bitte ich Dich als meinen Bruder und beschwöre Dich im Angesichte Christi und seiner auserwählten Engel, mit uns so zu denken und zu lehren, damit der Friede der Kirche gewahrt werde und den Priestern der Kirche das Band der Eintracht und Liebe unzerrissen erhalten bleibe! Grüße die Brüderschaft bei Dir! Die Brüderschaft bei uns empfiehlt sich Dir in Christus.</p><h2>2</h2><p><em>Gleichzeitig mit dem vorstehenden zweiten ist auch der dritte Brief an Nestorius oder das Alexandrinische Synodalschreiben, etwa aus dem November 430, zu Ephesus 431, zu Chalzedon 451 und wiederum zu Konstantinopel 553 von den Konzilsvätern als getreuer Ausdruck ihrer eigenen Glaubensüberzeugung begrüßt und gutgeheißen worden. In der Gesamtausgabe als Ep. 17 bezeichnet [Migne 77, 105—122], ward dieser Brief von neuem herausgegeben durch Pusey a. a. O. 12—39 [hier ist dem griechischen Texte die lateinische Übersetzung des Marius Mercator beigefügt], sowie durch Schwartz a. a. O. I 1, pars 1, 33—42.</em></p><p>Ihrem frömmsten und gottgeliebtesten Amtsbruder Nestorius sagen Cyrillus und die aus der ägyptischen Provinz zu Alexandrien zusammengetretene Synode Gruß im Herrn.</p><p>Wenn unser Heiland mit Nachdruck erklärt: „Wer Vater oder Mutter mehr liebt als mich, ist meiner nicht wert; und wer Sohn oder Tochter mehr liebt als mich, ist meiner nicht wert“, wie soll es uns ergehen, falls wir, wie Deine Frömmigkeit verlangt, Dich mehr lieben als Christus, den Heiland unser aller? Wer wird uns am Tage des Gerichtes helfen können? Oder wie werden wir es rechtfertigen wollen, daß wir zu den Lästerungen, die Du gegen ihn ausgestoßen hast, uns so lange schweigend verhalten haben? Würdest Du durch solches Denken und Lehren nur Dir allein schaden, so würde unser Kummer noch geringer sein; da Du aber der ganzen Kirche Ärgernis gegeben und den Völkern den Sauerteig einer neuen und fremdartigen Häresie eingeflößt hast, nicht nur den dortigen Christen, sondern den Christen aller Orte — denn Deine Schriften über diese Dinge sind überall verbreitet worden —, wie sollte unser Schweigen noch zu entschuldigen sein? Oder wie sollten wir nicht gezwungen sein, des Wortes Christi zu gedenken: „Glaubet nicht, daß ich gekommen sei, Frieden auf die Erde zu bringen; ich bin nicht gekommen, Frieden zu bringen, sondern das Schwert; denn ich bin gekommen, den Menschen zu entzweien mit seinem Vater und die Tochter mit ihrer Mutter.” Denn wo der Glaube Schaden leidet, soll die Ehrfurcht vor den Eltern als unangebracht und gefährlich weichen, auch das Gesetz der Liebe zu Kindern und Geschwistern zurücktreten und schließlich für die Frommen der Tod den Vorzug verdienen vor dem Leben, „damit sie einer besseren Auferstehung teilhaftig werden", wie geschrieben steht.</p><p>Siehe nun, im Verein mit der heiligen Synode, welche in dem großen Rom versammelt war, unter dem Vorsitz unseres frömmsten und gottesfürchtigsten Bruders und Kollegen, des Bischofs Cälestinus, beschwören wir Dich mit diesem Schreiben zum dritten Male und raten Dir, von den so schlechten und verkehrten Ansichten, die Du hegst und vorträgst, Dich loszusagen und an ihrer Statt den rechten Glauben anzunehmen, der von Anfang an den Kirchen überliefert worden ist durch die heiligen Apostel und Evangelisten, „die auch Augenzeugen und Diener des Wortes geworden sind". Sollte aber Deine Frömmigkeit dies nicht tun, innerhalb der in dem Schreiben des genannten frömmsten und gottesfürchtigsten Bischofs und Amtsbruders zu Rom, Cälestinus, festgesetzten Frist, so wisse, daß Du keinen Teil mit uns hast und unter den Priestern Gottes und Bischöfen weder Sitz noch Stimme hast. Denn wir können unmöglich zulassen, daß die Kirchen so in Verwirrung gebracht und den Völkern Ärgernis gegeben und der rechte Glaube abgeschafft und jene Herden von Dir zerstreut werden, die Du hättest retten sollen, wenn Du wie wir ein Liebhaber des rechten Glaubens gewesen wärest, Dich anschließend an die Gottesfurcht der heiligen Väter. Und mit allen, die um des Glaubens willen von Deiner Frömmigkeit ausgeschlossen oder abgesetzt worden sind, Laien wie Klerikern, halten wir Gemeinschaft. Denn es wäre nicht recht, wenn sie, die an dem wahren Glauben festgehalten haben, unter Deinem Urteil zu leiden hätten, weil sie Dir mit vollem Rechte entgegengetreten sind. Du hast ja selbst davon gesprochen in Deinem Briefe an den heiligsten Bischof des großen Rom, unsern Amtsbruder Cälestinus.</p><p>Es kann jedoch nicht genügen, daß Deine Frömmigkeit nur dem Glaubensbekenntnisse zustimmt, welches seinerzeit im Heiligen Geiste von dem heiligen und großen Konzil aufgestellt wurde, das zu Nizäa versammelt gewesen ist. Denn dieses Bekenntnis hast Du nicht richtig, sondern falsch verstanden und ausgelegt, wenn Du auch äußerlich den Wortlaut anerkanntest. Du mußt deshalb vielmehr schriftlich und eidlich bekennen, daß Du Deine verruchten und gottlosen Lehren anathematisierst und so denken und lehren willst wie wir alle, die wir im Abend- und im Morgenlande Bischöfe und Lehrer und Führer des Volkes sind. Denn die heilige Synode zu Rom sowohl wie wir alle sind darin übereingekommen, daß die von der alexandrinischen Kirche an Deine Frömmigkeit gerichteten Briefe untadelig den rechten Glauben wiedergeben. Wir haben aber diesem unserm Schreiben beigefügt, wie Du denken und lehren sollst und wovon Du Dich lossagen mußt.</p><p>Das nämlich ist der Glaube der katholischen und apostolischen Kirche, in den wir orthodoxen Bischöfe des Abend- und des Morgenlandes insgesamt einstimmen: „Wir glauben an einen Gott, den allmächtigen Vater, Schöpfer aller sichtbaren und unsichtbaren Dinge, und an einen Herrn Jesus Christus, den Sohn Gottes, als Eingeborener gezeugt aus dem Vater, das heißt aus dem Wesen des Vaters, Gott von Gott, Licht vom Lichte, wahrer Gott vom wahren Gott, gezeugt, nicht gemacht, wesenseins mit dem Vater, durch den alles geworden ist, was im Himmel und was auf Erden ist, der um uns Menschen und um unseres Heiles willen herabgestiegen und Fleisch und Mensch geworden ist, gelitten hat und am dritten Tage auferstanden ist, aufgefahren zu den Himmeln und kommend zu richten die Lebenden und die Toten, und an den Heiligen Geist. Diejenigen aber, die da sagen, es habe eine Zeit gegeben, da der Sohn Gottes nicht war, und er sei nicht gewesen, bevor er gezeugt wurde, und er sei aus Nichts geworden oder aus einer andern Substanz oder Wesenheit, oder er sei wandelbar oder veränderlich, diese anathematisiert die katholische und apostolische Kirche."</p><p>Allenthalben nun den auf Eingebung des Heiligen Geistes zurückgehenden Bekenntnissen der heiligen Vater folgend und ihren Gedankengängen uns anschließend und so gleichsam auf königlichem Pfade wandelnd, behaupten wir, daß eben das eingeborene Wort Gottes, der aus dem Wesen des Vaters selbst gezeugte Sohn, wahrer Gott vom wahren Gott, Licht vom Lichte, der, durch den alles geworden ist, was im Himmel und was auf Erden ist, um unseres Heiles wegen herabgestiegen ist, sich selbst entäußert hat, Fleisch und Mensch geworden ist, das heißt aus der heiligen Jungfrau Fleisch angenommen und aus dem Mutterschoße sich zu eigen gemacht hat, und so wie wir geboren worden und als Mensch aus dem Weibe hervorgegangen ist. Er hat aber nicht aufgehört zu sein, was er war, sondern ist auch bei der Annahme von Fleisch und Blut geblieben, was er war, nämlich von Natur aus und in Wahrheit Gott. Auch ist, behaupten wir, nicht das Fleisch in die Natur der Gottheit verwandelt noch auch die unaussprechliche Natur Gottes des Wortes in die Natur des Fleisches umgeändert worden; denn er ist unwandelbar und unveränderlich und bleibt immer durchaus derselbe nach den Schriften. Aussehend wie ein kleines Kind und in Windeln gewickelt und noch am Busen der jungfräulichen Gebärerin ruhend, erfüllte er zu gleicher Zeit als Gott die ganze Schöpfung und war der Throngenosse seines Erzeugers; denn die göttliche Natur kennt keine Ausdehnung und kein Größenmaß und läßt keinerlei Umgrenzung zu.</p><p>Indem wir nun aber bekennen, daß das Wort der Person nach dem Fleische geeint ist, beten wir einen Sohn und Herrn Jesus Christus an, indem wir nicht einen Menschen und Gott nebeneinander stellen und voneinander scheiden, wie wenn sie nur durch Einheit der Würde und Hoheit miteinander verbunden wären — denn das ist leeres Gerede und nichts weiter —, auch nicht das Gott entstammte Wort für sich als Christus und in gleicher Weise den aus dem Weibe Geborenen für sich als einen andern Christus bezeichnen. Wir wissen vielmehr, daß es nur einen einzigen Christus gibt, das aus Gott und dem Vater entstammte Wort mitsamt seinem Fleische. Damals ist er ja auch nach Menschenart im Verein mit uns gesalbt worden, obwohl er selbst den Geist denen gibt, die würdig sind, ihn zu empfangen, und zwar „nicht nach Maß“, wie der selige Evangelist Johannes sagt. Wir behaupten auch nicht, daß das Gott enstammte Wort in dem aus der heiligen Jungfrau Geborenen wie in einem gewöhnlichen Menschen gewohnt habe, weil wir Christus nicht als einen gottgetragenen Menschen darstellen wollen. Denn wenngleich das Wort „unter uns gewohnt hat“, so wird doch auch gesagt, daß in Christus „die ganze Fülle der Gottheit leibhaftig wohnt”. Wenn er also Wohnung nahm, da er Fleisch wurde, so verstehen wir das Wohnen nicht in dem Sinne, in welchem es heißt, daß Gott in den Heiligen wohnt, sondern, der Natur nach mit dem Fleische geeint, aber nicht in Fleisch verwandelt, wohnte er in dem Fleische so, wie man sagen kann, daß auch die Seele des Menschen in ihrem eigenen Leibe wohnt.</p><p>Es ist also ein Christus und Sohn und Herr, nicht als ob ein Mensch nur zur Einheit der Würde oder Hoheit mit Gott verbunden wäre. Denn die Gleichheit der Ehren eint noch nicht die Naturen. Sind doch auch Petrus und Johannes einander gleich an Ehren, insofern beide Apostel und heilige Jünger sind, aber sie sind zwei und nicht einer. Auch nicht im Sinne einer Nebeneinanderstellung können wir die Verbindung gelten lassen, denn das genügt gleichfalls nicht zur Einigung der Naturen, und auch nicht im Sinne eines engen Anschlusses, wie auch wir dem Herrn anhangen und dadurch nach dem Schriftworte „ein Geist“ mit ihm sind. Wir lehnen vielmehr das Wort „Verbindung" [συνάφεια] ab, weil es die Einigung [τὴν ἕνωσιν] nicht genugsam zum Ausdruck bringt.</p><p>Wir nennen auch das Gott dem Vater entstammte Wort nicht Gott oder Herrscher Christi, um nicht wiederum offenkundig den einen Christus und Sohn und Herrn in Zwei zu zerteilen und der Anklage der Lästerung zu verfallen, indem wir ihn zum Gott und Herrscher seiner selbst machen. Denn das, wie wir vorhin schon sagten, der Person nach dem Fleische geeinte Wort ist Gott des Weltalls und herrscht über einen jeden; es ist aber weder Knecht seiner selbst noch Herrscher seiner selbst. Es wäre ja einfältig und überdies auch gottlos, so zu denken oder zu sprechen. Zwar hat er den Vater seinen Gott genannt, obwohl er selbst von Natur aus Gott und aus dem Wesen des Vaters entsprungen ist. Allein wir wissen, daß er, wenngleich Gott, doch auch ein der Hoheit Gottes unterstehender Mensch geworden ist, gemäß dem der Natur der Menschheit entsprechenden Gesetze. Wie aber könnte er sein eigener Gott oder Herrscher sein? Er hat also als Mensch gesprochen; und wie es dem Stande der Entäußerung angemessen war, hat er sich im Verein mit uns unter Gott gestellt. So ist er auch „unter dem Gesetze geworden", wiewohl er als Gott das Gesetz erlassen hat und selbst Gesetzgeber ist.</p><p>Wir verurteilen es aber, von Christus zu sagen: „Um des Trägers willen verehre ich den Getragenen, um des Unsichtbaren willen bete ich den Sichtbaren an“; gleichwie es auch verabscheuungswürdig ist, zu sagen: „Der Angenommene heißt zusammen mit dem Annehmenden Gott”. Denn wer so spricht, nimmt wieder eine Scheidung in zwei Christus vor, indem er den Menschen für sich allein und ebenso Gott für sich allein hinstellt. Er leugnet ja offenbar die Einigung, gemäß welcher nicht ein anderer mit einem andern zusammen angebetet oder zusammen Gott geheißen wird; Christus Jesus ist vielmehr Einer, der eingeborene Sohn, und mitsamt seinem Fleische wird er durch eine Anbetung geehrt.</p><p>Wir bekennen aber, daß eben der aus Gott dem Vater gezeugte eingeborene Sohn und Gott, wiewohl der eigenen Natur nach leidensunfähig, im Fleische für uns gelitten hat nach den Schriften. Leidenslos hat er in dem gekreuzigten Leibe die Leiden seines Fleisches sich zu eigen gemacht und „durch die Gnade Gottes für einen jeden den Tod gekostet“, indem er ihm seinen Leib dahingab, obwohl er der Natur nach Leben und selbst die Auferstehung ist. Weil er nämlich in unaussprechlicher Macht den Tod mit Füßen trat, um zuerst im eigenen Fleische „der Erstgeborene aus den Toten” und „der Erstling der Entschlafenen“ zu werden und sodann der Natur des Menschen den Aufstieg zur Unvergänglichkeit zu bahnen, hat er, wie wir soeben sagten, „durch die Gnade Gottes für einen jeden den Tod gekostet”. Am dritten Tage aber ist er wieder aufgelebt, nachdem er die Unterwelt geplündert hatte. Wenn es also heißt, daß „die Auferstehung der Toten durch einen Menschen erfolgt ist, so verstehen wir unter dem Menschen das aus Gott entsprungene Wort und glauben, daß dieses die Gewalt des Todes gebrochen hat. Er wird aber seiner Zeit kommen als der eine Sohn und Herr in der Herrlichkeit des Vaters, „um den Erdkreis zu richten mit Gerechtigkeit", wie geschrieben steht.</p><p>Wir können jedoch nicht umhin, auch folgendes beizufügen. Wenn wir den Tod des eingeborenen Sohnes Gottes, das heißt Jesu Christi, dem Fleische nach verkünden und das Wiederaufleben von den Toten und die Aufnahme in die Himmel bekennen, so bringen wir in den Kirchen das unblutige Opfer dar, und dann treten wir zu den geheimnisvollen Opfergaben hinzu und werden geheiligt, indem wir teilhaft werden des heiligen Fleisches und des kostbaren Blutes Christi, des Heilandes unser aller. Dieses Fleisch nun nehmen wir nicht als gewöhnliches Fleisch entgegen — das sei fern —, auch nicht als das Fleisch eines geheiligten und mit dem Worte durch Einheit der Würde verbundenen oder auch der Einwohnung Gottes gewürdigten Mannes, sondern als das wahrhaft lebenspendende und eigene Fleisch des Wortes. Denn weil das Wort als Gott seiner Natur nach Leben ist, so hat es, da es sich seinem Fleische einte auch diesem Fleische lebenspendende Kraft verliehen. Wenngleich er daher auch zu uns spricht: „Wahrlich wahrlich, wenn ihr nicht das Fleisch des Menschensohnes eßt und sein Blut trinkt", so betrachten wir dieses Fleisch doch nicht als das Fleisch eines Menschen, wie wir es sind — denn wie sollte das Fleisch eines Menschen seiner eigenen Natur nach lebenspendend sein? —, sondern als das wahrhaft dem zu eigen gewordene Fleisch, der um unsertwillen Menschensohn geworden ist und geheißen hat.</p><p>Die Worte unseres Heilandes aber, welche in den Evangelien mitgeteilt werden, verteilen wir nicht an zwei Hypostasen oder Personen; denn der eine und einzige Christus ist nicht zwiespältig, wiewohl er aus zwei, und zwar verschiedenen Wesenheiten besteht, die aber zu einer unteilbaren Einheit verbunden sind, wie etwa auch der Mensch aus Seele und Leib besteht, aber doch nicht zwiespältig, sondern Einer aus den beiden Teilen ist. Vielmehr lassen wir, dem rechten Glauben gemäß, die menschlichen sowohl als auch die göttlichen Worte von Einem gesprochen sein. Denn wenn er als Gott von sich selbst sagt: „Wer mich gesehen, hat den Vater gesehen“, und „Ich und der Vater sind Eins“, so verstehen wir dies von der göttlichen und unaussprechlichen Natur, in welcher er wegen der Identität des Wesens mit seinem Vater Eins ist und „Gleichnis und Ebenbild und Abglanz seiner Herrlichkeit“. Und wenn er, den Stand der Menschheit nicht verschmähend, zu den Juden spricht: „Nun aber sucht ihr mich zu töten, einen Menschen, der ich euch die Wahrheit gesagt habe”, so nehmen wir desungeachtet wiederum an, daß ebenderselbe, dem Vater ähnliche und gleiche Gott das Wort hier vom Stande seiner Menschheit aus spricht. Müssen wir notwendig glauben, daß er, da er von Natur aus Gott war, Fleisch geworden ist oder mit vernünftiger Seele beseelter Mensch, weshalb glaubt jemand über seine Worte erröten zu müssen, wenn sie menschlich klingen? Soll er alle einem Menschen angemessenen Reden meiden, wer hat ihn denn genötigt, Mensch wie wir zu werden? Hat er aber um unsertwillen sich zu freiwilliger Entäußerung herabgelassen, warum soll er die der Entäußerung entsprechenden Reden meiden? Es sind also sämtliche in den Evangelien mitgeteilten Worte einer Person zuzuschreiben, der einen fleischgewordenen Hypostase des Wortes. Denn es ist ein Herr Jesus Christus nach den Schriften.</p><p>Wenn er aber auch „Apostel und Hoherpriester unseres Bekenntnisses" genannt wird, insofern er Gott und dem Vater das Glaubensbekenntnis darbringt, welches wir ihm und durch ihn Gott und dem Vater und auch dem Heiligen Geiste weihen, so ist wiederum, behaupten wir, von dem der Natur nach Gott entstammten eingeborenen Sohne die Rede. Ihm und nicht etwa einem andern, von ihm verschiedenen Menschen weisen wir den Namen des Priesters zu, den Namen und auch die Sache. Denn er ist „der Mittler zwischen Gott und den Menschen“ geworden und der Friedensstifter, indem er sich selbst Gott und dem Vater zum Wohlgeruche darbrachte. Deshalb sagte er auch: „Schlacht- und Speiseopfer hast du nicht gewollt, einen Leib aber hast du mir bereitet. Da sprach ich: Siehe, ich komme, in der Buchrolle ist über mich geschrieben, zu vollziehen, o Gott, deinen Willen.” Für uns hat er seinen Leib zum Wohlgeruche dargebracht und nicht für sich selbst. Oder welches Speise- oder Schlachtopfers hätte er für sich selbst bedürfen sollen, da er als Gott über jede Sünde erhaben ist? Wenn aber wir „alle gesündigt haben und der Gottesherrlichkeit ermangeln", weil wir der Neigung zum Bösen verfallen sind und die Natur des Menschen an Sündhaftigkeit krankt, er jedoch nicht so, und wir deshalb seiner Herrlichkeit entbehren, wie kann es da noch zweifelhaft sein, daß er als das wahre Opferlamm um unsertwillen und für uns geschlachtet worden ist? Wollten wir sagen, er habe für sich und für uns sich selbst dargebracht, so würden wir der Anklage der Gottlosigkeit nimmermehr entrinnen können. Denn weil er sich in keiner Weise verfehlt und keine Sünde getan hat, wie sollte er einer Opfergabe bedurft haben, da keine Sünde vorlag, derentwegen ein Opfer am Platze sein konnte?</p><p>Wenn er aber von dem Geiste sagt: „Er wird mich verherrlichen“, so behaupten wir vom Standpunkte des rechten Glaubens aus, daß der eine Christus und Sohn nicht so von dem Heiligen Geiste verherrlicht worden ist, wie wenn er der Verherrlichung von Seiten eines andern bedürftig gewesen wäre, da sein Geist nicht erhabener ist und nicht höher steht als er selbst. Weil er jedoch behufs Erweises seiner Gottheit des eigenen Geistes sich bediente zum Wunderwirken, so erklärt er, von diesem Geiste verherrlicht worden zu sein, wie einer aus uns von der ihm gerade innewohnenden Kraft oder Wissenschaft zu irgendwelcher Leistung sagen könnte: sie werden mich verherrlichen. Wenngleich nämlich der Geist eine eigene Person ist und demnach auch für sich betrachtet wird, weil er Geist ist und nicht Sohn, so ist er deshalb doch dem Sohne nicht fremd. Er ist ja „der Geist der Wahrheit” genannt worden, und Christus ist „die Wahrheit“, und er geht aus von Christus, wie er auch von Gott und dem Vater ausgeht. Daher hat der Geist auch durch die Hand der heiligen Apostel die Wunder gewirkt, nachdem unser.Herr Jesus Christus in den Himmel aufgefahren war, und hat ihn verherrlicht Er ward nämlich dadurch beglaubigt als derjenige, der der Natur nach Gott ist und sich jetzt wieder wirksam zeigte durch seinen Geist. Deshalb sagte er auch: „Von dem Meinigen wird er nehmen und es euch verkünden.”</p><p>Wir behaupten damit keineswegs, daß der Geist nur durch Teilnahme weise und mächtig sei. Er ist vielmehr schlechthin vollkommen und bedarf keines Gutes mehr; und da er der Geist der Macht und Weisheit des Vaters, das heißt der Geist des Sohnes ist, so ist er ganz und gar Weisheit und Macht.</p><p>Da aber die heilige Jungfrau den der Person nach mit dem Fleische geeinten Gott fleischlich geboren hat, so behaupten wir, daß sie deshalb auch Gottesgebärerin ist. Nicht wie wenn die Natur des Wortes vom Fleische her ihren Ursprung genommen hätte; denn „das Wort war im Anfang, und Gott war das Wort, und das Wort war bei Gott“, und er ist der Schöpfer der Welten, gleichewig mit dem Vater, und der Bildner des Alls. Aber, wie wir schon sagten, da er die menschliche Natur der Person nach sich selbst einte, so hat er sich auch der fleischlichen Geburt aus dem Mutterschoße unterzogen. Nicht als ob er notwendig oder der eigenen Natur wegen auch der Geburt in der Zeit und in den letzten Weltzeiten bedurft hätte, sondern um auch den Anfang unseres Seins zu segnen. Dadurch nämlich, daß das Weib den mit dem Fleische geeinten Gott gebar, sollte der gegen das ganze Geschlecht gerichtete Fluch, welcher unsere irdischen Leiber dem Tode überantwortete, ein Ende nehmen, sollte das Urteil: „In Schmerzen wirst du Kinder gebären” durch ihn aufgehoben und das Wort des Propheten wahrgemacht werden: „Verschlungen hat der Tod [alles], da er zur Macht gelangt, aber Gott wischt wieder ab alle Träne von jedem Antlitz." Aus diesem Grunde, behaupten wir, hat er in Verfolg der Heilsveranstaltung auch die Ehe gesegnet und zusammen mit den heiligen Aposteln der Einladung nach Kana in Galiläa Folge gegeben.</p><p>So zu denken sind wir gelehrt worden von den heiligen Aposteln und Evangelisten und der ganzen gott-eingegebenen Schrift sowie auch durch das wahre Bekenntnis der seligen Väter. Dies alles muß auch Deine Gottesfurcht gutheißen und ohne jeden Trug annehmen. Was aber Deine Gottesfurcht zu anathematisieren hat, haben wir diesem unserm Briefe angeschlossen.</p><p>1. Wenn jemand nicht bekennt, daß der Emmanuel in Wahrheit Gott ist und die heilige Jungfrau deshalb Got-tesgebärerin ist, weil sie das fleischgewordene aus Gott entstammte Wort fleischlich geboren hat, so sei er im Banne.</p><p>2. Wenn jemand nicht bekennt, daß das aus Gott dem Vater entstammte Wort der Person nach dem Fleische geeint worden und daß Christus mitsamt seinem Fleische Einer ist, nämlich Gott und Mensch in derselben Person, so sei er im Banne.</p><p>3. Wenn jemand bei dem einen Christus nach erfolgter Einigung die Personen zerreißt, indem er sie nur durch Einheit der Würde oder Hoheit oder Macht verbunden sein läßt, und nicht vielmehr durch den Zusammenschluß der Naturen vermöge der Einigung, so sei er im Banne.</p><p>4. Wenn jemand die Worte, die in den evangelischen und apostolischen Schriften entweder von den Heiligen über Christus oder von ihm selbst über sich ausgesagt werden, auf zwei Personen oder Hypostasen verteilt, indem er die einen einem neben dem Gott entstammten Worte für sich bestehenden Menschen, die andern als gotteswürdig dem aus Gott dem Vater entstammten Worte allein zuschreibt, so sei er im Banne.</p><p>5. Wenn jemand zu behaupten wagt, Christus sei ein gottgetragener Mensch und nicht vielmehr in Wahrheit Gott als einziger und natürlicher Sohn, da das Wort Fleisch geworden ist und in gleicher Weise wie wir an Blut und Fleisch teilgenommen hat, so sei er im Banne.</p><p>6. Wenn jemand behauptet, das aus Gott dem Vater entstammte Wort sei Gott oder Herrscher Christi, und nicht vielmehr bekennt, daß Christus in derselben Person Gott und Mensch zugleich ist, weil das Wort Fleisch geworden ist nach den Schriften, so sei er im Banne.</p><p>7. Wenn jemand sagt, Jesus sei als Mensch von Gott dem Worte zu seinem Wirken befähigt worden und die Glorie des Eingeborenen sei ihm als einem andern neben dem Eingeborenen Stehenden verliehen worden, so sei er im Banne.</p><p>8. Wenn jemand zu behaupten wagt, der angenommene Mensch müsse mit Gott dem Worte zusammen angebetet und zusammen verherrlicht und zusammen Gott geheißen werden, wie ein anderer mit einem andern — denn das stets hinzugefügte Wort „zusammen" zwingt so zu denken —, und nicht vielmehr mit einer Anbetung den Emmanuel ehrt und mit einer Lobpreisung ihn verherrlicht, da das Wort Fleisch geworden ist, so sei er im Banne.</p><p>9. Wenn jemand sagt, der eine Herr Jesus Christus sei von dem Geiste in der Weise verherrlicht worden, daß er sich seiner wie einer fremden Macht bedient hätte, und von dem Geiste sei er in den Stand gesetzt worden, gegen die unreinen Geister zu kämpfen und die Gotteszeichen unter den Menschen zu vollbringen, und nicht vielmehr bekennt, daß es sein eigener Geist war, kraft dessen er auch die Gotteszeichen gewirkt hat, so sei er im Banne.</p><p>10. Christus ist Hoherpriester und Apostel unseres Bekenntnisses geworden, sagt die göttliche Schrift, und er hat sich selbst für uns dargebracht zum Wohlgeruch für Gott und den Vater. Wenn also jemand sagt, nicht das aus Gott entstammte Wort sei unser Hoherpriester und Apostel geworden, da es Fleisch und Mensch wie wir ward, sondern ein anderer neben ihm für sich bestehender, aus dem Weibe geborener Mensch, oder wenn jemand behauptet, er habe sein Opfer auch für sich selbst dargebracht und nicht vielmehr allein für uns, da er doch keines Opfers bedurfte, weil er keine Sünde kannte, so sei er im Banne.</p><p>11. Wenn jemand nicht bekennt, daß das Fleisch des Herrn lebenspendend ist und das eigene Fleisch des aus Gott dem Vater entstammten Wortes, sondern sagt, es sei das Fleisch eines andern neben ihm, der der Würde nach mit ihm verbunden oder nur der Einwohnung Gottes gewürdigt gewesen sei, und nicht vielmehr, daß es lebenspendend ist, wie wir sagten, weil es das eigene Fleisch des Wortes geworden ist, welch letzteres alles lebendig zu machen vermag, so sei er im Banne.</p><p>12. Wenn jemand nicht bekennt, daß das Wort Gottes im Fleische gelitten hat und im Fleische gekreuzigt worden ist und im Fleische den Tod gekostet hat und der Erstgeborene aus den Toten geworden ist, da es als Gott Leben und lebenspendend ist, so sei er im Banne.</p><h2>3</h2><p><em>Den Brief an Patriarch Johannes von Antiochien, welcher den Friedensschluß zwischen Cyrillus und den antiochenischen Bischöfen besiegelte, aus dem Februar oder März 433 hat das Konzil von Chalzedon 451 sich zu eigen gemacht und empfohlen. Neue Ausgaben dieses Briefes, in der Gesamtausgabe Ep. 39 [Migne 77, 173— 182], bei Pusey a. a. O. 40—53 [hier griechisch und in alter lateinischer Übersetzung]; bei Schwartz a. a. O. I 1, pars 4, 15—20. </em></p><p>Meinem Herrn, dem geliebten Bruder und Kollegen Johannes, sage ich, Cyrillus, Gruß im Herrn.</p><p>„Die Himmel sollen sich freuen und die Erde soll jauchzen.„ Denn „die Zwischenwand des Zaunes ist gefallen“ und die Trauer hat ein Ende, und jede Meinungsverschiedenheit ist geschwunden. Unser aller Heiland Christus schenkt seinen Kirchen den Frieden. Zu diesem Ende hatten uns die gottesfürchtigsten und gottgeliebtesten Kaiser auch berufen, treffliche Eiferer für die ererbte Gottesfurcht, die da in ihrem eigenen Herzen den rechten Glauben fest und unerschüttert bewahren und in ausgezeichneter Weise für die heiligen Kirchen Sorge tragen, um immerwährenden Ruhm zu ernten und ihre Regierung mit Glorie zu umkleiden. Der Herr der Mächte teilt denn auch mit reicher Hand seine Güter an sie aus und verleiht ihnen Gewalt über ihre Widersacher und den Sieg über ihre Feinde. Denn er lügt nicht, wenn er sagt: „So wahr ich lebe, spricht der Herr, die, die mich verherrlichen, werde ich verherrlichen.”</p><p>Es hat uns also mit herzlicher Freude erfüllt, daß mein Herr, der gottesfürchtigste Bruder und Kollege Paulus, nach Alexandrien kam, um so mehr, als ein solcher Mann die Vermittlung übernahm und über seine Kräfte gehenden Mühen sich unterziehen wollte, um den Neid des Teufels zu besiegen und das Auseinandergerissene zusammenzuknüpfen und durch Beseitigung der dazwischengeworfenen Ärgernisse die Kirchen bei Euch und die Kirchen bei uns mit Eintracht und Frieden zu schmücken. Auf welche Weise die Spaltung eingerissen war, braucht nicht dargelegt zu werden. Ich halte es vielmehr für angebracht, zu sinnen und zu sagen, was zu der Zeit des Friedens paßt. Wir waren also hoch erfreut über die Ankunft des erwähnten gottesfürchtigsten Mannes, welcher vielleicht befürchtet hatte, es werde keine kleinen Kämpfe kosten, um uns zu überzeugen, daß die Kirchen zum Frieden verbunden und das Gelächter der Andersgläubigen zum Schweigen gebracht und überdies der Zwietrachtsstachel des Teufels abgestumpft werden müsse. Er fand uns jedoch so sehr bereit dazu, daß er sich auch nicht die geringste Mühe zu geben brauchte. Wir waren eingedenk des Wortes des Heilandes: „Meinen Frieden gebe ich euch, meinen Frieden hinterlasse ich euch;„ auch sind wir gelehrt worden, in unsern Gebeten zu sprechen: „Herr, unser Gott, gib Frieden, denn [damit] hast du uns alles gegeben“, so daß also jemand, der an dem Frieden teilhat, den Gott verleiht, keines weitern Gutes mehr bedarf.</p><p>Daß aber die Spaltung der Kirchen durchaus gegenstandslos geworden und nicht mehr am Platze ist, davon haben wir uns jetzt voll und ganz überzeugen können, da mein Herr, der gottesfürchtigste Bischof Paulus, uns ein Papier mit einem tadellosen Glaubensbekenntnisse überreichte und erklärte, dieses Bekenntnis sei von Deiner Frömmigkeit und den dortigen gottesfürchtigsten Bischöfen verfaßt worden. Es lautet wie folgt und sei wörtlich in diesen unsern Brief aufgenommen:</p><p>„Wie wir aber über die jungfräuliche Gottesgebärerin und über die Art und Weise der Menschwerdung des eingeborenen Sohnes Gottes denken und sprechen, wollen wir notgedrungen nicht in Weise eines Zusatzes, sondern in Form einer vollen Erklärung, so wie wir es von Anfang an aus den göttlichen Schriften und aus der Überlieferung der heiligen Väter überkommen haben, in Kürze darlegen, ohne dem Glaubensbekenntnisse der heiligen Väter zu Nizäa irgend etwas hinzuzufügen. Denn dieses genügt, wie wir sagten, um alle Gottesfurcht erkennen zu lassen und alle häretische Falschlehre auszuschließen. Indem wir aber unsern Glauben darlegen, wollen wir uns nicht an dem Unerreichbaren vergreifen, sondern unter Eingeständnis des eigenen Unvermögens und unter Absage an diejenigen, die sich überheben zu sollen glauben, auch von dem den Menschen Überragenden sprechen. Wir bekennen also, daß unser Herr Jesus Christus, der eingeborene Sohn Gottes, vollkommener Gott und vollkommener Mensch ist, aus einer vernünftigen Seele und einem Leibe bestehend, vor Ewigkeiten aus dem Vater gezeugt der Gottheit nach, am Ende der Tage aber um unsertwillen und um unseres Heiles willen auch geboren aus Maria der Jungfrau der Menschheit nach, wesensgleich mit dem Vater der Gottheit nach und wesensgleich mit uns der Menschheit nach. Es hat nämlich eine Einigung der zwei Naturen stattgefunden, und deshalb bekennen wir einen Christus, einen Sohn, einen Herrn. Dieser unvermischten Einigung zufolge bekennen wir, daß die heilige Jungfrau Gottesgebärerin ist, weil Gott das Wort Fleisch und Mensch geworden ist und schon von der Empfängnis an den aus ihr genommenen Tempel sich selbst geeint hat. Die evangelischen und apostolischen Worte über den Herrn werden, wissen wir, von den Gottesgelehrten insofern alle zusammengefaßt, als sie auf eine Person bezogen werden, insofern aber unterschieden, als sie von zwei Naturen verstanden werden, die gotteswürdigen von der Gottheit Christi, die niedrig lautenden von der Menschheit."</p><p>Beim Lesen dieser Eurer heiligen Worte konnten wir feststellen, daß wir ebenso wie Ihr denken — denn „es ist ein Herr, ein Glaube, eine Taufe" —, und wir haben Gott den Heiland aller gepriesen und uns gegenseitig beglückwünscht, daß die Kirchen bei uns sowohl wie die Kirchen bei Euch den mit den gotteingegebenen Schriften und der Überlieferung der heiligen Väter übereinstimmenden Glauben haben.</p><p>Weil ich jedoch erfahren habe, daß einige von den Leuten, die ihre Freude am Tadeln haben, nach Art wilder Wespen herumsummen und böse Reden gegen mich im Munde führen, wie wenn ich behauptete, der heilige Leib Christi sei vom Himmel herabgebracht und nicht aus der heiligen Jungfrau geboren worden, so habe ich geglaubt, darüber einige wenige Worte zu ihnen sprechen zu sollen. O ihr Unverständigen und nur des Verleumdens Kundigen, wie seid ihr nur zu dieser Meinung gekommen und auf eine solche Torheit verfallen? Ihr mußtet ja doch, ja ihr mußtet wohl wissen, daß sozusagen unser ganzer Kampf für den Glauben hinausgelaufen ist auf Verfechtung des Satzes: Die heilige Jungfrau ist Gottesgebärerin. Wollen wir aber behaupten, der heilige Leib Christi, des Heilandes unser aller, sei vom Himmel und nicht aus ihr geboren, wie könnte sie dann noch Gottesgebärerin sein? Wen hat sie denn überhaupt geboren, wenn es nicht wahr sein soll, daß sie den Emmanuel dem Fleische nach geboren hat? Diejenigen, die solche Märchen über mich verbreitet haben, sollen also dem Gelächter preisgegeben werden. Denn der selige Prophet Isaias lügt nicht, wenn er sagt: „Siehe, die Jungfrau wird empfangen im Schoße und einen Sohn gebären, und man wird seinen Namen Emmanuel nennen, was in Übersetzung heißt: Mit uns ist Gott.“ Und auch der heilige Gabriel spricht die Wahrheit, wenn er zu der seligen Jungfrau sagt: „Fürchte dich nicht, Maria, denn du hast Gnade gefunden bei Gott, und siehe, du wirst empfangen im Schoße und einen Sohn gebären und seinen Namen Jesus nennen, denn er wird sein Volk erlösen von seinen Sünden.“</p><p>Wenn wir aber sagen, unser Herr Jesus Christus sei vom Himmel und von oben her, so wollen wir damit nicht behaupten, daß sein heiliges Fleisch von oben und vom Himmel her herabgebracht worden sei; vielmehr folgen wir dem göttlichen Paulus, der ausdrücklich erklärt hat: „Der erste Mensch ist von der Erde aus Staub gebildet, der zweite Mensch, der Herr, ist vom Himmel.„ Auch erinnern wir uns, daß der Heiland selbst sagt: „Niemand ist in den Himmel hinaufgestiegen außer dem, der vom Himmel herabgestiegen, der Menschensohn.“ Gleichwohl ist er dem Fleische nach, wie ich soeben sagte, aus der heiligen Jungfrau geboren worden. Der von oben und vom Himmel her niedergestiegene Gott das Wort hat eben sich selbst entäußert, indem er Knechtsgestalt annahm, und hat Menschensohn geheißen, wobei er jedoch blieb, was er war, das heißt Gott — denn er ist der Natur nach unwandelbar und unveränderlich—; und da er nunmehr mitsamt seinem Fleische als Einer gedacht wird, so heißt es, er selbst sei vom Himmel herabgekommen, und so ist er auch der Mensch vom Himmel genannt worden, vollkommen in der Gottheit und zugleich vollkommen in der Menschheit, und in einer Person gedacht. Denn Einer ist der Herr Jesus Christus, ohne daß der Unterschied der Naturen verkannt werden soll, welche in unaussprechlicher Einigung miteinander verbunden sind.</p><p>Denen aber, die behaupten, es habe eine Vermischung oder Vermengung oder Verschmelzung Gottes des Wortes mit dem Fleische stattgefunden, wolle Deine Frömmigkeit den Mund stopfen. Es liegt nämlich nahe, anzunehmen, daß einige auch dies über mich ausstreuen, als ob ich so gedacht oder gesprochen hätte. Ich aber bin so weit entfernt, an so etwas gedacht zu haben, daß ich es für eine Tollheit halte, überhaupt zu glauben, es könne auf die göttliche Natur des Wortes auch nur „der Schatten eines Wechsels„ fallen. Denn sie bleibt immer, was sie ist, und verändert sich nicht und wird sich auch niemals verändern und ist keiner Verwandlung fähig. Überdies bekennen wir alle, daß das Wort Gottes leidenslos ist, obwohl wir sehen, daß der allweise Veranstalter des Geheimnisses die Leiden, die seinem Fleische widerfahren sind, sich selbst zuschreibt. Deshalb sagt auch der allweise Petrus: „Da Christus für uns gelitten hat im Fleische“, und nicht in der Natur der unaussprechlichen Gottheit. Um sich aber als den Heiland aller zu erweisen, legt er, wie gesagt, der Menschwerdung zufolge die Leiden seines Fleisches sich selbst bei. So in dem Worte, welches als sein Wort durch die Stimme des Propheten vorausverkündet worden ist: „Ich habe meinen Rücken zu Geißelhieben hergegeben und meine Wangen zu Backenstreichen und habe mein Antlitz nicht abgewandt von der Schmach der Anspeiungen.“</p><p>Daß wir aber allenthalben den Lehren der heiligen Väter folgen, insbesondere unseres seligen und berühmten Vaters Athanasius, ohne auch nur im geringsten von ihnen abzuweichen, darf Deine Frömmigkeit glauben und darf kein anderer bezweifeln. Ich würde viele Zeugnisse der heiligen Väter beigefügt haben, um durch dieselben meine Worte zu beglaubigen, wenn ich nicht gefürchtet hätte, daß die Länge des Briefes vielleicht Überdruß erregen könnte. Wir dulden auch nicht, daß in irgendeiner Weise von einigen der festgesetzte Glaube erschüttert werde oder das Glaubensbekenntnis, welches unsere heiligen Väter aufgestellt haben, die seinerzeit zu Nizäa zusammengetreten sind; weder uns selbst noch andern gestatten wir, ein Wort daran zu ändern oder eine Silbe davon auszulassen, eingedenk dessen, der sagt: „Verrücke nicht die ewigen Grenzen, die deine Väter gesetzt haben!" Denn nicht sie waren es, die da sprachen, sondern der Geist Gottes und des Vaters, welcher von ihm ausgeht, aber auch dem Sohne nicht fremd ist, gemäß der Einheit des Wesens. Das beglaubigen uns die Worte der heiligen Lehrmeister. In der Apostelgeschichte steht geschrieben: „Da sie aber nach Mysien gekommen waren, versuchten sie nach Bithynien zu gehen, aber der Geist Jesu ließ sie nicht.“ Und der göttliche Paulus schreibt: „Diejenigen aber, welche im Fleische sind, können Gott nicht Wohlgefallen. Ihr aber seid nicht im Fleische, sondern im Geiste, wenn anders der Geist Gottes in euch wohnt; wenn aber jemand den Geist Christi nicht hat, der ist nicht sein.“</p><p>Wenn aber einige von denen, die gewohnt sind, das Rechte zu verkehren, meine Worte nach ihrem Gutdünken abändern, so möge Deine Frömmigkeit sich darüber nicht wundern, da sie weiß, daß alle Häretiker aus der gotteingegebenen Schrift Vorwände für ihren Irrtum zusammensuchen, indem sie das durch den Heiligen Geist recht Gesagte nach ihren falschen Meinungen verdrehen und die unauslöschliche Flamme auf ihr Haupt laden. Da wir aber gehört haben, daß gewisse Leute auch den Brief unseres berühmten Vaters Athanasius an den seligen Epiktet, der rechtgläubig gehalten ist, gefälscht und in entstellter Form herausgegeben haben, wodurch dann viele geschädigt wurden, so glaubten wir deshalb ein für die Brüder nützliches und notwendiges Werk zu tun, wenn wir von alten Exemplaren, die bei uns aufbewahrt werden und frei von Fehlern sind, eine Abschrift nahmen und Deiner Frömmigkeit zusandten.</p>
