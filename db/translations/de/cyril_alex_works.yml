      <p><em>Über die Menschwerdung des Eingeborenen (Bibliothek der Kirchenväter).</em></p><p>A. Scheint dir wohl unsere Abhandlung über die Gottheit des Eingebornen gut und hinreichend abgegliedert und ausgearbeitet zu sein?</p><p>B. Jawohl.</p><p>A. Nach meinem Dafürhalten wenigstens fehlt es ihr an genauer Untersuchung nicht; was aber sagst denn du, o Hermias?</p><p>B. Ich muß wohl natürlich loben, was richtig und sorgfältig dargelegt ist.</p><p>A. Willst du also, daß wir, die weitere Beschäftigung mit diesem Gegenstande lassend, von der Menschwerdung des Eingebornen handeln und, wie es sich mit dem Mysterium derselben verhalte, so deutlich als möglich zu erklären versuchen, so weit es eben Denen verstattet ist, welche im Spiegel und im Räthsel sehen und nur theilweise erkennen, nach dem Maaße der Gabenspendung des Geistes, wie auch der heilige Paulus schreibt?</p><p>B. Sehr gut bemerkt. „Denn Niemand sagt: Herr Jesus, ausser im heiligen Geiste, und Niemand sagt: Anathema [verflucht] Jesus, ausser in Beelzebul.“ Indeß da du eben doch den dießbezüglichen Staub berühren und die so drückende und schwere Arbeit übernehmen willst, so wisse, daß du dadurch vor den Übrigen auch mir nützen wirst. Denn ich möchte sehr gerne die reine, unverfälschte, völlig tadelfreie Lehre von Christus durchforschen. Manche nämlich sind von unterschiedlichen Meinungen berauscht und verunstalten die aus ihn bezüglichen Aussprüche im neuen wie im alten Testamente.</p><p>A. Unentstellt, mein Lieber, ist bei den Unverständigen Nichts, und kopfüber stürzen sie in den Fallstrick der Hölle, wie geschrieben steht, und in’s Netz des Todes, da sie nicht bedenken, was sie reden, noch, worüber sie Behauptungen aufstellen. Welches aber ihre Faseleien und heiligen Mythen seien, sag’ an, mein Bester!</p><p>B. Wohlan denn! Die Einen nämlich erkühnen sich, zu behaupten, daß das Wort Gottes zwar als Mensch erschienen sei, aber nicht, daß es auch das Fleisch aus der Jungfrau getragen habe; sie erdichten also einen bloßen Schein des Mysteriums. — Andere wenden vor, sie schämten sich des Scheines, einen Menschen anzubeten, und weigern sich, das irdische Fleisch mit himmlischen Ehren zu krönen, und aus übergroßer Unkenntniß, an einer gewissen falschen und verdorbenen Ehrfurcht kränkelnd, behaupten sie daher, das aus Gott dem Vater stammende Wort sei in die Natur von Knochen, Nerven und Fleisch umgewandelt worden, indem sie die Geburt des Emmanuel aus der Jungfrau laut verlachen, die Unglückseligen, und die so herrliche und göttliche Veranstaltung als ungeziemend bezeichnen. — Noch Andere glauben, der mit dem Vater gleichewige Gott, das Wort, sei später geboren und sei kaum erst dann in’s Dasein gerufen worden, als es (er) auch den Anfang der Geburt aus dem Fleische erlangte. — Es gibt aber auch Solche, die gottloser Weise so weit im Wahnsinn gekommen sind, daß sie sagen, das Wort aus Gott habe gar kein (persönliches) Fürsichsein, sondern einfach zur Rede (zum Worte) werde im Menschen der bloße Gedankenausdruck. Diese sind Marcellus und Photinus. — Wieder Anderen beliebt es, zu glauben, der Eingeborne sei zwar wahrhaft Mensch geworden und im Fleische gekommen, nicht aber auch, daß das angenommene Fleisch vollständig beseelt war mit einer vernünftigen, geistbegabten Seele wie wir, sondern indem sie das Wort aus Gott und den Tempel aus der heiligen Jungfrau zu einer vollständigen Einheit, wie sie meinen, verknüpfen, sagen sie, das Wort habe in demselben [Tempel] gewohnt und zwar den angenommenen Leib zu seinem eigenen gemacht, die Stelle der vernünftigen und denkenden Seele aber fülle es selbst aus. — Andere wieder lehren zwar von den Meinungen Dieser das Gegentheil und widersetzen sich ihren Ansichten, indem sie behaupten, der Emmanuel bestehe und sei verknüpft aus Gott dem Worte, der vernünftigen Seele und dem Leibe, also der schlechthin vollständigen Menschheit, und doch haben sie noch nicht die ihm gebührende Ehre ganz vollkommen und unversehrt gewahrt. Denn sie zertheilen den einen Christus in zwei, und gleichsam einen dicken Schnitt zwischen beiden machend zeigen sie theilweise jeden von beiden fast als getrennt, indem sie steif behaupten, ein Anderer sei der ganz als Mensch von der Jungfrau Geborne und wieder ein Anderer das Wort aus Gott dem Vater, ohne zu unterscheiden, was die Natur des Wortes und des Fleisches ist, und ohne sich mit den bloßen dießbezüglichen Unterschieden begnügen zu wollen; denn insofern verfehlten sie die richtige Ansicht nicht ganz, da die Natur des Fleisches und Gottes nicht die nämliche ist; aber indem sie den Einen als Menschen für sich hinstellen und gesondert, nennen sie den Anderen, als Gott, der Natur nach und in Wahrheit Sohn. Gleichwohl wollen sie Christen sein; und nun auch einige Sätze hierüber zusammenschreibend haben sie gewagt, wörtlich also zu sagen: Der nämlich, der von Natur und in Wahrheit Sohn ist, ist das Wort aus Gott dem Vater; der Andere aber hat mit dem Sohne nur den gleichen Namen. Und unter Anderem wieder: Das Wort Gottes ist nicht Fleisch, sondern hat einen Menschen angenommen; denn nur der Eingeborne ist im eigentlichen Sinne und an sich Sohn Gottes, des Schöpfers von Allem; der Mensch aber, den er annahm, der nicht von Natur aus Herr ist, fungirt durch den wahrhaftigen Sohn Gottes, der ihn annahm, unter gleichem Namen wie dieser. Denn das: „Niemand kennt den Sohn ausser der Vater“ weist hin auf den von Natur und in Wahrheit aus dem Vater stammenden Sohn; der Ausspruch des Gabriel aber: „Fürchte dich nicht, Maria, denn du hast Gnade gefunden bei Gott, und siehe, du wirst empfangen und einen Sohn gebären und wirst seinen Namen Jesus nennen!“ paßt auf den Menschen. Indessen Dieß sagen Jene. Wir aber werden nie so denken. Denn nimmer wird die Rede der Irrgläubigen uns überreden, das gerade Gleis zu verlassen und ein anderes zu betreten. Aber führe deine Ansicht aus und versuche, sie mir zu sagen, da ich höchst gespannt bin, die reine Wahrheit zu hören und zu erfahren!</p><p>A. O wie schwer ist die Sache und in der That kaum tragbar die Bürde! Oder weißt du nicht, mein Lieber, daß, wenn Einer über jeden Punkt eine lange Erwägung und hinreichende Untersuchung anstellen wollte, er keine geringe Zeit aufwenden und lästigen und unvermeidlichen Schweiß aufstehen und doch kaum Etwas zu Stande bringen wird?</p><p>B. Allerdings.</p><p>A. Wohlan denn also, lassen wir, wenn du willst, die Meinung, als müßten wir lang und eifrig subtile Untersuchungen anstellen, und verwenden wir auf jeden Punkt nur eine ganz kleine Prüfung und sagen wir zunächst den Doketen: „Ihr irret, da ihr die Schrift nicht kennet“ noch auch das große Geheimniß der Gottseligkeit, nämlich Christum, „welcher geoffenbart ist im Fleische, gerechtfertigt im Geiste, erschienen den Engeln, verkündet den Völkern, geglaubt in der Welt, aufgenommen in Herrlichkeit“. Es müssen aber, meine ich, die von der Gegenpartei entweder die Alten verwerfen und als Lügner erklären die Lehrer der ganzen Welt, zu denen Christus selbst sprach: „Gehet hin und lehret alle Völker!“ oder wenn sie anders Das zu thun zurückschrecken, so müssen sie die richtige Ansicht von Christus annehmen und, ihren eigenen Thorheiten Lebewohl sagend, sich fest an die heiligen Schriften halten und, den sicheren Pfad der Heiligen durchschreitend, auf die Wahrheit selbst losgehen. Denn nichts Anderes wohl, meine ich, dürfte „das Geheimniß der Gottseligkeit“ sein als eben das Wort aus Gott dem Vater, welches offenbar wurde im Fleische; denn es wurde geboren aus der heiligen Jungfrau, Knechtsgestalt annehmend. Es erschien aber auch den Engeln, welche den Gebornen feiern mit den Worten: „Ehre sei Gott in der Höhe und auf Erden Friede, bei den Menschen Gnade!“ Ja, indem sie auch den Hirten den für uns Fleisch gewordenen Gott, das Wort, anzeigen, sagen sie: „Siehe, heute ward uns der Heiland geboren, Christus, der Herr, in der Stadt Davids! Und Das sei euch das Zeichen: Ihr werdet ein Kind finden, in Windeln gehüllt, in einer Krippe liegend.“ Wenn aber eine Geburt aus der Jungfrau und eine Erscheinung im Fleische stattfand, wie ist es dann nicht ein eitles Gerede und wie nicht Unsinn und Geschwätz, die so handgreifliche und offenbare Veranstaltung mit dem Namen „Schein“ zu belegen? Denn wenn es Schatten und Schein war und nicht in Wahrheit eine Fleischwerdung, dann gebar ja nicht die Jungfrau und nahm das Wort aus Gott dem Vater nicht den Samen Abrahams an und wurde er nicht gleich den Brüdern. Denn doch wohl nicht Schatten sind wir selbst oder Schein, sondern wir sind in greifbaren und sichtbaren Leibern und mit diesem irdischen Fleische bekleidet und unterliegen der Auflösung und den Affekten. Wenn also nicht Fleisch wurde das Wort, dann kann es auch nicht in Dem, worin es selbst gelitten hat, da es versucht wurde, Denen, die versucht werden, helfen. Denn ein Schatten wird doch wohl Nichts leiden. Es geht uns also das Ganze in der That in das Nichts dahin. Denn was für einen Rücken noch gab er für uns her, oder was für eine Wange den Schlagenden darreichend ertrug er die Streiche der Juden? Und daß er an Händen und Füßen mit Nägeln durchbohrt wurde, wenn er gar nicht im Fleische erschien, wie doch soll Das Einer glauben? Oder was für eine Seite, sag’ mir, durchstechend haben die Soldaten des Pilatus den Zuschauern das zugleich mit Wasser hervorquellende kostbare Blut hergezeigt? Und wenn hierüber hinaus noch Etwas zu sagen nöthig ist: weder ist Christus für uns gestorben, noch auch ist Christus auferstanden, womit, wenn es als wahr angenommen wird, der Glaube vernichtet und das Kreuz dahin ist, das Heil und Leben der Welt, und gänzlich untergegangen die Hoffnung der im Glauben Entschlafenen. Mit Recht nämlich schien es auch dem heiligen Paulus sich so zu verhalten; denn „ich überlieferte euch,“ sagt er „hauptsächlich, was ich auch empfangen habe, daß Christus für unsere Sünden gestorben ist, gemäß den Schriften, und daß er begraben wurde, und daß er auferstanden ist am dritten Tage, gemäß den Schriften, und daß er dem Kephas erschienen ist und dann den Zwölfen. Hierauf erschien er mehr als fünfhundert Brüdern zugleich, von denen die mehreren bis jetzt noch leben, Einige aber auch gestorben sind. Sodann erschien er dem Jakobus, dann allen Aposteln, zuletzt aber von Allen, als einer Fehlgeburt (sagt er), erschien er auch mir.“ Und nach Anderem wieder: „Wenn aber Christus verkündet wird, daß er von den Todten auferstanden ist, wie sagen unter euch Einige, es gebe keine Auferstehung der Todten? Wenn es aber keine Auferstehung der Todten gibt, dann ist auch Christus nicht auferstanden. Wenn aber Christus nicht auferstanden ist, dann ist ja eitel unsere Predigt, eitel auch unser Glaube. Wir werden aber auch als falsche Zeugen Gottes erfunden durch das Zeugniß, daß er Christum auferweckt habe, den er doch nicht auferweckt hat, wenn anders die Todten nicht auferstehen.“ Denn wie doch, sag’ mir, sollte wohl der Schatten sterben? Wie also hat der Vater Christum erweckt, wenn er Schatten war und Schein und den Banden des Todes nicht unterworfen? Fort also mit dem Brecherguß von Jenen! Für Fabel dagegen und Ausbrüche eines unheiligen Willens wollen wir ihre Lehren halten. Denn vor dergleichen Leuten warnt uns der Jünger des Heilandes schon im Voraus, da er schreibt: „Viele falsche Propheten sind in die Welt ausgegangen. Daran wird der Geist Gottes erkannt: Jeder Geist, der bekennt, daß Jesus Christus im Fleische gekommen ist, ist aus Gott. Und Dieß da ist die Lehre des Antichrist, von dem ihr gehört habt, daß er kommt, und er ist jetzt schon in der Welt.“ Denn wenn er nicht Mensch geworden ist, dann ist er ja auch nicht im Fleische zu dem Vater und Gott im Himmel aufgefahren, noch auch wird er in unserer Gestalt vom Him- mel wieder kommen, als Mensch nämlich und im Fleische. Meinst du nicht, daß ich Recht habe?</p><p>B. Allerdings.</p><p>A. Daß nun aber noch Andere aus maßloser Thorheit meinen und denken, das aus Gott stammende Wort habe die Geburt aus der heiligen Jungfrau zurückgewiesen und unsere Natur verschmäht, vielmehr aber selbst sich umgewandelt in das irdische Fleisch, ist eine Schmähung der Heilsveranstaltung und eine Tadelerhebung gegen die göttlichen Rathschlüsse. Denn das allschöpferische und erbarmungsreiche Wort Gottes hat sich selbst entäussert, da es unsertwegen Mensch wurde, geboren vom Weibe, damit, weil ja doch die Kinder, das heißt wir, an Fleisch und Blut Theil hatten, auch es selbst gleichfalls daran Theil nehme, „um durch den Tod Den zu vernichten, der die Gewalt des Todes hatte, nämlich den Teufel, und Diejenigen zu befreien, welche in Todesfurcht ihr ganzes Leben lang der Knechtschaft verhaftet waren.“ So sagt nämlich die heilige Schrift. Diese aber bezeichnen den so überaus schönen und herrlichen Rathschluß als ungeziemend, und als ob sie selbst etwas Besseres erdenken könnten, tadeln sie sogar die Rathschläge der Weisheit. Denn wir brauchten ja nicht, sagen sie, Kreisen und Geburt aus der Jungfrau dem Eingebornen zuzuschreiben, sondern sollten vielmehr glauben, die Natur des Wortes sei in diesen gebrechlichen Leib umgewandelt worden, und sie erdichten eine Verwandlung Dessen, der keine Verwandlung kennt. Denn fest steht die Natur Gottes in ihren eigenen Gütern und unerschütterlich ist ihr Verharren in ihrem Zustande. Denn zwar die gewordene und in der Zeit zum Dasein gebrachte Natur kann eine Veränderung erleiden, und darin wird keine unstatthafte und unwahre Ansicht liegen; denn was jedenfalls einen Anfang des Seins genommen hat, dem ist es gewissermaßen schon angeschaffen, sich verändern zu müssen. Der allen Begriff übersteigende Gott aber, der eine von Entstehen und Vergehen ausgenommene und darüber erhabene Existenz hat, wird auch über die Veränderung erhaben sein und überragt und übersteigt gleichsam auf Grund seiner eigenen Natur, meine ich, alles zur Entstehung Gerufene, und zwar unvergleichlich weit; daher wird er wohl auch über Das, was dem durch ihn Gewordenen zuzustoßen pflegt, erhaben sein, da er Nichts leiden kann durch Das, was geeignet ist, Schaden zu bringen. Also die Gottheit ist in unwandelbaren Gütern; die Kreaturen aber in Veränderung und Wandlungen, der Verderbniß ausgesetzt. Und Dieß sehr wohl einsehend und höchst richtig erwägend rief der Prophet Jeremias zu Gott empor: „Du thronest über der Welt, und wir vergehen in der Welt;“ es thront nämlich gleichsam auf ihrem Sitze die Gottheit immerdar. Alles regierend und beherrschend und keinerlei Leiden (Affekten) unterworfen. Wir aber, die wir eine leicht wandelbare und durchaus zu Veränderung und Wechsel geneigte Natur haben, vergehen in der Welt, das heißt, wir sind zu jeder Zeit und Frist vergänglich und veränderlich. Es kann also weder die Gottheit je Veränderungen erfahren, durch irgend ein Leiden aus ihrer Beharrlichkeit herausgestoßen, noch auch kann die vergängliche und veränderliche, das heißt die gewordene Kreatur eine wesenhafte Unwandelbarkeit besitzen oder der Güter der göttlichen Natur als eigener sich rühmen. Sie wird nämlich mit Recht hören: „Was hast du denn, was du nicht empfangen hast?“ Daß aber durchaus unveränderlich und unwandelbar ist die Natur des Wortes, hingegen durchaus wandelbar die gewordene, wird man wohl auch sehr leicht einsehen, indem der selige David im Geiste singt: „Die Himmel vergehen, du aber bleibst, und alle altern wie ein Gewand, und wie einen Mantel wendest du sie, und sie verändern sich; du aber bist Derselbe, und deine Jahre nehmen nicht ab.“ Wo denn nun ist das Wort aus Gott dasselbe geblieben, wenn es nämlich richtig ist, zu sagen, daß es mit Ablegung seiner Beharrlichkeit und Unbewegtheit in Das, was es nicht war, herabging und in die Natur des Fleisches und das der Verderbniß Unterworfene umgewandelt wurde? Ist Das nicht Geschwätz und sogar auch Wahnsinn?</p><p>B. Ja freilich.</p><p>A. Da könnte man ja, den Thorheiten Jener noch thörichter widerstrebend, sagen, es sei nicht ungereimt, daß auch das irdische Fleisch einmal zur Natur der Gottheit aufsteigen könne und in den Zustand der allerhöchsten Wesenheit gelangen. Denn wenn die Natur der Gottheit selber, gemäß dem Blödsinne Jener, in die Natur des Fleisches überging, so hindert Nichts mehr, daß unsere eigene niedere Natur das Fleisch überfliege und in die Gottheit und das höchste Wesen umgewandelt werde. Aber wir werden nicht den Ungereimtheiten Jener Glauben schenken, sondern vielmehr an die heiligen Schriften uns halten, da sowohl der Prophet sagt: „Siehe, die Jungfrau wird empfangen und einen Sohn gebären, und du wirst seinen Namen Emmanuel nennen,“ als auch der selige Gabriel die Vorhersagung bestätiget und der Jungfrau den göttlichen Beschluß erklärt; denn „fürchte dich nicht,“ sagt er, „Maria, denn siehe, du wirst empfangen und einen Sohn gebären, und du wirst seinen Namen Jesus nennen!“ Wir glauben, daß der Emmanuel in Wahrheit vom Weibe geboren sei, und die glänzende und bewundernswerthe Hohheit unserer Natur werden wir nicht abweisen, indem wir richtig denken.</p><p>B. Du hast ganz Recht. Denn der Eingeborne hat nicht seine eigene Natur angenommen (denn davon hätten wir keinen Gewinn), aber auch nicht die der Engel, sondern den Samen Abrahams, wie geschrieben steht. Denn so und nicht anders war das in’s Verderben geglitschte Geschlecht wieder zu retten.</p><p>A. Wie aber? Muß man nicht überdieß auch über Jenes sich wundern, o Hermias?</p><p>B. Was meinst du?</p><p>A. Beinahe nämlich auch der heiligen Schrift Lebewohl sagend und den Irrthumsgeistern den eigenen Sinn dahingehend sind Einige so weit in der Thorheit und knabenhaften Einfalt gekommen, daß sie meinen, das weltschöpferische, mit Gott und dem Vater gleichewige Wort müsse einen mit der Geburt des Fleisches zusammentreffenden Anfang der Existenz haben, und faseln, der über alle Welt und Zeit Erhabene sei erst später entstanden, so daß erst in den letzten und gerade noch in den Zeiten der Menschwerdung Gott zum Vater geworden sei und Denjenigen, durch den Alles und in dem Alles, erst zugleich mit dem Tempel aus der Jungfrau gleichsam zum Dasein und zur Existenz gebracht habe. Sind Diejenigen nicht bereits bis zur höchsten Grenze der Übel gelangt, die eine so alberne und abscheuliche Fabel bereitwilligst angenommen und ihren Verstand mit ungemischtem (purem) Blödsinn angefüllt haben? „Ein offenes Grab“ in der That „ist ihr Schlund; mit ihren Zungen sind sie listig, Schlangengift ist unter ihren Lippen, ihr Mund ist voll von Fluch und Bitterkeit.“</p><p>B. Einverstanden; denn das Wort des Psalmisten ist richtig.</p><p>A. Muß denn nicht Der, durch den Alles ist, auch vor Allem gewesen sein?</p><p>A. Was aber wollen sie nun thun, da Johannes schreibt: „Im Anfange war das Wort, Alles ist durch dasselbe geworden, und ohne es ist Nichts geworden,“ und wieder: „Was von Anfang an war, was wir gehört, was wir mit unseren Augen geschaut, was wir angesehen und unsere Hände berührt haben, von dem Worte des Lebens (reden wir). Und das Leben ist erschienen, und wir haben es gesehen und bezeugen und verkünden euch das ewige Leben, welches beim Vater war und uns erschienen ist“? Christus selbst aber erklärt den Juden das unsichtbare Alter seiner Existenz. Denn als sie sagten: „Du hast noch nicht fünfzig Jahre und hast den Abraham gesehen?“ vernahmen sie die deutliche Antwort: „Wahrlich, wahrlich, ich sage euch, ehe Abraham wurde, bin ich.“ Wem aber das „er war“ zukommt, ohne einen Zusatz, und deutlich auch das „ich bin“ zugetheilt ist, welchen Anfang der Entstehung könnte man bei Dem wahrnehmen? Oder wie sollte Der, der im unvordenklichen Anfange war, in der Zeit in’s Dasein gerufen sein können? Wenn also Jemand eine sorgfältigere Widerlegung dieser Leute wünschte, so wird es nicht schwer sein, mit Beibringung der Worte der heiligen Schrift die aus der Thorheit Jener entspringenden Verkehrtheiten abzuweisen. Was indeß so offenbarem Tadel unterliegt und so viel Unziemliches enthält, ist doch wohl, glaube ich, überflüssig, weiterer Aufmerksamkeit zu würdigen.</p><p>B. Du hast Recht.</p><p>A. Gehen wir also auf jene Ansicht los, welche der eben verworfenen verwandt ist! Es verunstalten nämlich Einige die Schönheit der Wahrheit, indem sie wie eine Münze sie fälschen und ihr Horn in die Höhe heben und Ungerechtigkeit reden wider Gott, wie geschrieben steht. Als unwirklich und nicht für sich subsistirend stellen sie sich den Eingebornen vor, und er existire nicht in eigener Hypostase, sondern bloß als Rede und zum Ausdruck gelangendes Wort sei er von Gott ausgegangen und habe im Menschen gewohnt, behaupten die Unglückseligen; und indem sie Jesum so zusammenfügen, sagen sie, er sei zwar heiliger als die Heiligen, aber darum noch nicht auch Gott. Also wie auch der Jünger des Heilandes geschrieben hat: „Wer ist ein Lügner, ausser wer läugnet, Jesus sei nicht der Christus? Dieser ist der Antichrist, der den Vater und den Sohn läugnet. Jeder, der den Sohn läugnet, hat auch den Vater nicht; wer den Sohn bekennt, hat auch den Vater.“ Beide nämlich werden durch beide und jeder von beiden durch den anderen sowohl von uns selbst als auch von den heiligen Engeln erkannt. Denn Niemand wohl möchte wissen, was der Vater ist, wenn er nicht in Gedanken den Sohn als existirend und gezeugt annimmt; aber auch Niemand wohl möchte wissen, was der Sohn ist, wenn er nicht klar sich vorstellt, daß der Vater gezeugt hat. Man muß also, glaube ich, auch richtig sagen: Wenn der Sohn unwirklich ist, dann möchten wir wohl auch nicht den Vater in Wahrheit denken. Denn wo ist er noch Vater, wenn er nicht in Wahrheit gezeugt hat? Oder wenn er denn doch etwas Unwirkliches gezeugt hat, was gar nicht existirt, so wird das Gezeugte Nichts sein. Denn das Unwirkliche ist dem Nichts gleich oder vielmehr durchaus Nichts. Dann wird Gott Vater von Nichts sein. Aber, o Beste, möchte ich wenigstens zu solchen Exegeten sagen, eitles Geschwätz sind euere Lehren, oder wenigstens antwortet auf meine Fragen! Wie ist die Liebe Gottes und des Vaters überschwenglich? Und wenn er für uns den Sohn dahingab, der, nach euch, nicht existirt, so gab er also das Nichts für uns hin, und weder Fleisch geworden ist das Wort, noch hat es das heilige Kreuz erduldet, noch die Gewalt des Todes zunichte gemacht, noch auch ist es wieder lebendig geworden. Denn wenn es Nichts ist und unwirklich, wie hat es Das durchgemacht? Getäuscht also hat das Wort der heiligen Schrift die daran Glaubenden, und die Festigkeit des Glaubens schwindet in Nichts dahin.</p><p>B. Das sei ferne!</p><p>A. Wie aber? Lehrt uns nicht die heilige Schrift, der Sohn existire in der Gestalt Gottes, und nennt sie ihn nicht Abbild und Ausdruck des Erzeugers?</p><p>B. Ja freilich.</p><p>A. Die Abbilder aber sind wie die Urbilder.</p><p>B. Wie denn anders?</p><p>A. Also, wenn das Abbild nicht wirklich wäre und der Ausdruck nicht in selbstständiger Existenz gedacht würde, dann werden sie in nothwendiger Folge zugeben (müssen), daß auch Der, dessen Abdruck es ist, unwirklich sei; und die Unschönheit des Abbildes wird doch wohl ganz zurückfallen auf das Urbild? Nicht wahr?</p><p>B. Ja freilich.</p><p>A. Sodann sage mir: Philippus, der sehr wißbegierig war, wünschte den seienden und wirklich existirenden Vater zu sehen, da er sprach: „Herr, zeige uns den Vater, und es genügt uns!“ oder etwa den nichtseienden und unwirklichen?</p><p>B. Den seienden, offenbar.</p><p>A. Wenn doch also der Sohn Nichts ist, als nicht existirend nämlich, gemäß der unverschämten Keckheit Jener, warum bot er zum Abbild und zur genauen Erkenntniß des Vaters sich selbst uns dar, indem er sagte: „So lange bin ich bei euch und du kennst mich nicht, Philippus? Wer mich gesehen hat, hat den Vater gesehen. Glaubst du nicht, daß ich im Vater und der Vater in mir ist? Ich und der Vater sind Eins.“ Es wird aber doch nicht wohl Jemand, glaube ich, den Existirenden in dem Nichtexistirenden erblicken, noch auch je den Existirenden halten mit dem Nichtexistirenden. Wie aber wird der Vater im Sohne sein und der Sohn hinwieder im Vater, als daß man nicht in Wahrheit sagen müßte, daß, wenn das Wort nicht für sich existirt, auch der Vater selbst in Gefahr kommen durfte, da er das Nichts in sich hat und als im Nichts existirend gedacht wird? Denn das gar nicht Seiende läßt sich wohl auch nicht denken.</p><p>B. Nicht unschroff ist die Rede. Denn die Lehre der Gegner krankt in sich an möglichst großer Ungereimtheit und schlägt gleichwohl in’s Widerliche aus.</p><p>A. Wundern aber sollte man sich füglich, wie in dem noch gar nicht zum Dasein gelangten Sohne der Vater Alles gemacht hat. Würde man aber fragen, ob für das Seiende das Sein gut sei oder etwa das Nichtsein, wie würdest du antworten?</p><p>B. Ich würde sagen: Das Sein. Denn darum hauptsächlich, weil er dem Nichtseienden einmal das Sein gab, nennt der Schöpfer sich gut und ist es.</p><p>A. Du hast ganz Recht. Denn so wird wohl der Natur nach die Sache sich verhalten. Also besser daran ist die Kreatur, wenn anders Der, durch den Alles zur Entstehung gerufen wird, selbst für nicht existirend erklärt wird, die Geschöpfe aber existiren und als seiend erkannt werden.</p><p>B. Fort mit der Lästerung! Denn „lebendig ist das Wort Gottes und wirksam,“ wie geschrieben steht. Darum hat es auch gesagt: „Ich bin das Leben.“</p><p>A. Aber sollte man nicht das Leben denken als bestehend (existirend)? Leben aber ist es von Natur aus; denn lügen wird es gewiß nicht. Daß also das aus Gott entsprungene Wort nicht existire, ist eine reine Lüge und ein Abschaum des albernsten Sinnes.</p><p>B. Ganz und gar. Denn zu Moses sprach es selbst: „Ich bin der Seiende.“ Daß aber das wahrhaft Seiende sich nicht in eigener Existenz erhalte, wie wäre Das denkbar?</p><p>A. Also der so Gesinnten äussersten Unverstand werden wir natürlich verabscheuen.</p><p>A. Aber auch jene (Anderen) werden wir wohl nicht loben, o Hermias, wir, die wir sehr wohl gelernt haben, der Wahrheit nachzujagen?</p><p>B. Welche?</p><p>A. Diejenigen, welche sagen, das mit dem Worte vereinigte Fleisch entbehre der vernünftigen Seele. Sie bekleiden nämlich das Wort mit dem bloßen, mit der Fähigkeit des Lebens und Empfindens begabten Fleische und führen es so in die Welt ein, indem sie die Thätigkeit des Geistes und der Seele dem Eingebornen zuweisen. Denn sie schaudern davor, zu bekennen, daß das Wort (ich weiß nicht, wie ich sagen soll) mit einem dem Begriffe der Menschennatur gemäß vollkommenen, das heißt aus Seele und Leib bestehenden Menschen sich vereinigt habe, indem sie einerseits die Überlieferung des von oben stammenden und uralten Glaubens durchaus geringer Berücksichtigung würdigen, anderseits thörichter Weise sich vorsetzen, ihrem bloßen Eigensinn und menschlichen Vernünfteleien folgen zu sollen, und in der That anders denken, als man denken soll.</p><p>B. Und welchen Grund haben sie für eine solche Lehre?</p><p>A. Ich will es sagen. Der Mittler Gottes und der Menschen, sagen wir den Schriften gemäß, sei zusammengesetzt aus unserer Menschennatur in der ihrem Begriffe gemäßen Vollständigkeit und dem aus Gott entsprungenen Sohn von Natur, nämlich dem Eingebornen. Wir behaupten aber, es habe eine Zusammenkunft und unaussprechliche Verbindung ungleicher und unähnlicher Naturen zur Einheit stattgefunden, als einen aber anerkennen wir gleichwohl Christum, den Herrn und den Sohn, der zumal sowohl Gott als auch Mensch ist und als solcher erkannt wird. Wir pflegen die Einheit durchaus ungetrennt zu wahren, indem wir glauben, derselbe sei sowohl der Eingeborne als der Erstgeborne; der Eingeborne als Wort aus Gott dem Vater, welches auch aus seiner Wesenheit entsprang, der Erstgeborne aber, sofern er Mensch geworden ist und unter vielen Brüdern. Denn wie einer ist Gott der Vater, aus dem Alles ist, so auch ein Herr Jesus Christus, durch den Alles ist. Als Gott von Natur aber anerkennen wir das Wort, wodurch Alles ist, auch wenn es Fleisch, das heißt Mensch, geworden ist.</p><p>B. Ganz richtig.</p><p>A. Aber nicht gar sehr zu unseren Lehren hierüber stimmen die Ansichten Jener. Denn als einen zwar nehmen einstimmig auch sie Christum Jesum an, indem sie hierin wenigstens ganz richtig denken; und sie weisen die Trennung des Emmanuel in Zwei als höchst unfromm ernstlich zurück. Indem sie aber gleichwohl das Fleisch der menschlichen und vernünftigen Seele berauben, lassen sie das Wort aus Gott mit demselben verbunden sein. Es hat sich ihnen aber ein, wie sie meinen, überzeugender Grund hiefür gefunden. Denn, sagen sie, die verbindungsweise zur Konstituirung eines vollkommenen Wesens zusammenkommenden Stücke pflegen als Theile, die für sich unvollkommen sind, betrachtet zu werden, während das an sich und in seiner eigenen Natur Vollkommene der Verbindung aus Theilen nicht bedarf. Folglich, sagen sie, muß man natürlich vermeiden, den mit dem Worte vereinigten Tempel als einen vollkommenen Menschen gelten zu lassen, damit auch die Verbindung, die man etwa bei Christus denkt, streng und tadellos ihren Begriff behalte. Und auch Dieß, wie ich glaube, mögen sie noch beifügen. Wenn wir nämlich aus einem vollkommenen Menschen, sagen sie, und dem aus dem Vater seienden Worte den Emmanuel zusammensetzen, so ist nicht gering die Furcht, oder vielmehr es erscheint sogar schon gewissermaßen als unvermeidlich, auch wider Willen zwei Söhne und zwei Christus denken und lehren zu müssen.</p><p>B. Was werden dann wir hierauf antworten?</p><p>A. Erstens, daß es sich geziemt, die so uralte und von den heiligen Aposteln selbst auf uns gekommene Überlieferung des Glaubens nicht durch maßlose Spitzfindigkeiten zu kränken, noch auch das Übervernünftige sublimen Untersuchungen zu unterwerfen, aber auch nicht sich vorzudrängen wie gewisse Grenzbestimmer und Solche, welche vorlaut sprechen: Dieß da ist recht, Das dagegen sollte doch sich anders verhalten, und es wäre in der That besser; sondern vielmehr dem allweisen Gott den Weg seiner Rathschlüsse zu überlassen und nicht das von ihm Gutgeheissene verwegen zu tadeln. Denn wir werden ihn deutlich sagen hören: „Denn meine Rathschlüsse sind nicht wie euere Rathschlüsse und nicht wie euere Wege sind meine Wege, sondern so weit der Himmel weg ist von der Erde, so weit weg ist mein Weg von eueren Wegen und euere Gedanken von meinem Denken.“ — Sodann, was ihnen weise erfunden zu sein scheint, wird sich als völlig eitel und thöricht erweisen. Denn wenn nun Jemand jenen göttlichen Tempel der vernünftigen Seele berauben wollte, so wird die Verbindung nicht aus zwei Unvollkommenen bestehen, daran fehlt viel. Es verhält sich nämlich allerdings zum ganzen aus Seele und Leib bestehenden Menschen das Fleisch allein und für sich als Theil. Aber das göttliche Wort wenigstens kann doch nicht als Theil von Etwas gedacht werden, aber auch nicht als unvollkommen, o Trefflichste; denn es ist in seiner eigenen Natur ganz vollkommen. Wo also wird die Verbindung aus unvollkommenen (Theilen) zu einem Vollkommenen sein, wenn anders sie besteht aus dem vollkommenen Worte und dem, mit Rücksicht auf den ganzen und in seiner Natur vollständigen Menschen, allerdings unvollkommenen Fleische? Söhne aber werden wir keineswegs zwei verehren, aber auch nicht sagen: Zwei Christus, wenn wir auch glauben, daß aus einem vollkommenen Menschen und Gott dem Worte die Verbindung zur Einheit des Emmanuel stattgefunden habe. Gleichwie nämlich (nach Dem wenigstens, wie Jene meinen, daß es recht ist), wenn man auch sagen würde, sie bestehe aus dem bloßen Fleische und dem aus Gott dem Vater, entsprungenen Worte, keine Wendung sie überreden wird, das Fleisch besonders setzend und den Eingebornen wieder besonders, zwei Christus zu bekennen, sondern sie den Emmanuel in einen Herrn Jesus Christus aufnehmen werden (denn hierin wenigstens haben sie sehr richtig zu denken gelernt): ebenso haben wir, wenn wir auch sagen, das Wort aus Gott sei auf unaussprechliche und unbegreifliche Weise mit einem vollkommenen, nämlich aus Seele und Leib bestehenden Menschen gleichsam zusammengetroffen und Eins geworden, nicht zwei Söhne im Sinne, sondern einen und denselben, der von Natur Gott ist und aus der Wesenheit Gottes und des Vaters hervorgegangen, in den letzten Zeiten der Welt aber Mensch geworden und von der heiligen Jungfrau geboren worden ist und von uns selbst und den heiligen Engeln angebetet wird, den Schriften gemäß.</p><p>B. Wie nun, wenn sie sagten, unsere Lage habe nur der Anwesenheit des Eingebornen bedurft; indem er aber den Bewohnern der Erde habe erscheinen und mit den Menschen verkehren und uns den Weg des evangelischen Lebens zeigen wollen, habe er der göttlichen Anordnung gemäß sich mit dem uns ähnlichen Fleische umhüllt? Denn die Gottheit sei ihrer eigenen Natur nach nicht sichtbar.</p><p>A. Man wird sie überführen als Solche, die den Zweck der Menschwerdung mißkennen und das große Geheimniß der Gottseligkeit gar nicht verstehen. Denn wenn die Einfleischung oder Menschwerdung des Eingebornen bloß den Zweck hat, den Erdebewohnern sichtbar zu werden, und der menschlichen Natur sonst Nichts zubrachte, wie soll es dann nicht gewissermaßen besser sein und weise, daß auch wir selbst der Meinung der Doketen beistimmen, welche, indem sie das Wort mit Fleisch und einem irdischen Körper umkleiden, zwar fabeln, es sei wie ein Mensch erschienen, die Unglücklichen, aber doch deutlich zugestehen, es sei der Urheber der höchsten Güter geworden? Oder wirst du es nicht für besser erklären, wenn das Wort aus Gott der menschlichen Natur Nichts nützt, obwohl es Fleisch wurde, es von der fleischlichen Unreinigkeit auszulösen und zu glauben, es habe sich einmal des irdischen Leibes bedient und so den vorgesetzten Zweck vollendet?</p><p>B. Welches also mag wohl der Grund seiner Ankunft, welches die Weise der Menschwerdung gewesen sein, und weßwegen hat sie stattgefunden? Ich möchte es wissen.</p><p>A. Wohlan denn also, mein Bester, höre die heiligen Schriften und, das Auge des Geistes aufmerksam auf die Aussprüche der heiligen Apostel heftend, betrachte nun sorgfältig den Fragepunkt! Es sagt uns also der weise Paulus, der Christum in sich redend hatte: „Da nämlich die Kinder an Blut und Fleisch Theil haben, so hat auch er deßgleichen an ihnen Theil genommen, damit er durch den Tod den Machthaber des Todes vernichtete, nämlich den Teufel, und Diejenigen befreite, welche durch Furcht des Todes ihr ganzes Leben lang der Knechtschaft unterworfen waren.“ Und ferner, indem er auch anderswo uns eine andere Weise darlegt, sagt er: „Denn was dem Gesetze unmöglich war, da es kraftlos war durch das Fleisch, Gott hat, indem er seinen Sohn sandte in Ähnlichkeit des sündlichen Fleisches und wegen der Sünde, die Sünde im Fleische verdammt, damit die Gerechtigkeit des Gesetzes erfüllt, würde in uns, die wir nicht nach dem Fleische wandeln, sondern nach dem Geiste.“ Ist es nun nicht ganz klar und für keinen Menschen undeutlich, daß der Eingeborne geworden ist wie wir, das heißt ein vollkommener Mensch, damit er unseren irdischen Leib von der eingedrungenen Verderbniß erlöse, indem er durch den Einigungsakt zur Gleichheit mit uns herabstieg nach dem Gesetze des Lebens und, die menschliche Seele zur eigenen sich machend, sie darstellte als erhaben über die Sünde, indem er die Festigkeit und Unwandelbarkeit seiner eigenen Natur wie eine Beize ihr einfärbte.</p><p>B. Nicht undeutlich ist, wie ich meine, die Sache. Denn sie trägt in sich den wahrscheinlichen oder vielmehr den wahren Vernunftgrund.</p><p>A. Gleichwie also das Fleisch, da es das Fleisch des Alles belebenden Wortes war, die Macht des Todes und der Verwesung übersteigt, auf dieselbe Weise, glaube ich, hat die Seele, da sie die Seele Dessen war, der keine Sünde kannte, einen in allem Guten gefestigten, unwandelbaren und über die ehedem herrschende Sünde unvergleichlich erhabenen Zustand. Denn Christus ist der erste Mensch, „der keine Sünde gethan hat, noch wurde eine Falschheit gefunden in seinem Munde,“ und er ist gesetzt gleichsam als Wurzel und Erstling der im Geiste zur Neuheit des Lebens Umgestalteten, und er wird die Unverweslichkeit des Leibes und die Sicherheit und Beständigkeit der Gottheit, gleichsam in Theilnahme und aus Gnade, fortan auch auf das ganze Menschengeschlecht übertragen. Und Dieses wissend schreibt der heilige Paulus: „Wie wir nämlich das Bild des Irdischen trugen, werden wir auch das Bild des Himmlischen tragen.“ Unter dem Bilde des Irdischen nämlich verstand er die Geneigtheit zur Sünde und den von daher zu uns gedrungenen Tod; unter dem Bilde des Himmlischen dagegen, das heißt Christi, die Festigkeit in der Heiligung und die Rückkehr aus Tod und Verwesung und die Erneuerung zur Unverweslichkeit und zum Leben. Ganz also, sagen wir, habe das Wort mit dem ganzen Menschen sich geeint. Denn nicht doch wohl hat er das Bessere in uns, nämlich die Seele, keiner Berücksichtigung gewürdigt, bloß dem Fleische die Mühen seiner Anwesenheit schenkend. Vielmehr wurde um Beider willen das Geheimniß der Erlösung herrlich vollbracht. Er bediente sich aber wie eines Werkzeuges des eigenen Fleisches zu den Werken des Fleisches und den physischen Schwachheiten (Leiden) und was immer fern ist von Tadel, der eigenen Seele aber zu den menschlichen und schuldlosen Affekten. Denn es wird von ihm gesagt, er habe gehungert und Ermüdungen erduldet von langen Wanderungen und Schauder und Furcht, Trauer und Todesangst und den Tod am Kreuze. Denn ohne daß ihn Jemand zwang, setzte er von sich selbst seine Seele ein für uns, um über Todte und Lebendige zu herrschen, indem er sein Fleisch daran gab für das Fleisch Aller, ein in der That äquivalentes Geschenk, seine Seele aber zum Lösepreis machte für die Seele Aller, wiewohl er wieder auflebte, da er als Gott das Leben war von Natur. Darum sagt auch der heilige Petrus: „Ihr Männer, Brüder, es sei erlaubt, freimüthig zu euch zu reden von dem Erzvater David: er starb und wurde begraben, und sein Grab ist bei uns bis auf den heutigen Tag. Da er nun ein Prophet war und wußte, daß Gott ihm mit einem Eide geschworen hatte, von der Frucht seines Leibes sollte sitzen aus seinem Throne, hat er, vorhersehend, von der Auferstehung Christi gesprochen, daß weder seine Seele in der Unterwelt gelassen würde noch sein Fleisch die Verwesung sähe.“ Denn man darf doch nicht sagen, das mit dem Worte geeinte Fleisch könne einer stetigen Verderbniß unterliegen und die gotterfüllte Seele den Pforten der Unterwelt verhaftet werden. Sie wurde ja nicht in der Unterwelt gelassen, wie auch der heilige Petrus sagte. Denn nicht von der durchaus unfaßbaren und dem Tode unzugänglichen Natur, nämlich der Gottheit des Eingebornen, sagt er, sie sei aus den untere irdischen Höhlen zurückgeführt worden. Es wäre ja auch nichts Verwunderungswerthes, wenn das Wort aus Gott nicht in der Unterwelt blieb, das durch die Kraft und Natur seiner Gottheit auf unbegreifliche und unaussprechliche Weise Alles erfüllt und Allem inwohnt; denn erhaben über Örtlichkeit und Umgrenzung und meßbare Größe ist die Gottheit und wird selbst durch Nichts umfaßt. Unglaube aber und für Jedermann erstaunlich ist es, daß ein seiner Natur nach zerstörlicher Leib wieder auflebte; denn er war mit dem unzerstörlichen Worte geeint. Die gottvolle Seele aber, welche die Verbindung und Einigung mit demselben erlangt hatte, stieg hinab in die Unterwelt, und sich göttlicher Kraft und Machtvollkommenheit bedienend erschien sie auch den dort befindlichen Geistern. Darum sprach er auch zu den Gefesselten: „Gehet heraus,“ und zu den in der Finsterniß Befindlichen: „Kommet an’s Licht!“ Und mir scheint, etwas dergleichen sage auch der heilige Petrus über das Wort Gottes und die durch die Einigung ihm zu Theil gewordene Seele: „Denn es ist besser, da man Gutes thut, leiden (wenn der Wille Gottes es will, als da man Böses thut; weil auch Christus einmal für die Sünden gestorben ist, als Gerechter für Ungerechte, da mit er uns Gott zuführe, getödtet im Fleischer wieder belebt im Geiste, in welchem er (sagt er) auch den im Gefängnisse befindlichen Geistern, die einst ungläubig waren, bei seinem Hingange die Botschaft brachte.“ Denn er will ja doch, meine ich, nicht sagen, daß die reine Gottheit des Eingebornen an sich in die Unterwelt hinabgegangen sei, und daß sie, die durchaus unsichtbar ist, den dort befindlichen Geistern die Botschaft gebracht habe. Denn die Gottheit ist stets zu erhaben, um gesehen zu werden; wir werden aber auch nicht zugeben, daß sie sich zum Schein und schematisch in die Gestalt einer Seele verwandelt habe, vielmehr müssen wir den Schein zurückweisen; sondern wie den noch im Fleische Befindlichen, so brachte er auch den Seelen in der Unterwelt die Botschaft, indem er als eigene Bekleidung hatte die mit ihm vereinigte Seele. Und tief allerdings und unaussprechlich in der That und für unsere Gedanken nicht faßbar ist die Art der Einigung. Dieses aber geziemt sich gleichwohl in Erwägung zu ziehen: Das, was nicht für uns ist, zu ergrübeln, ist nicht straflos; höchst thöricht aber durchaus ist es, das Übervernünftige der For- schung zu unterziehen und zu denken zu versuchen, was zu denken nicht möglich ist. Oder weißt du nicht, daß dieses tiefe und unseren Verstand übersteigende Mysterium durch einfachen Glauben geehrt ist? Die unbesonnene Rede aber: „Wie kann Das geschehen?“ jenem Nikodemus und Seinesgleichen überlassend wollen wir die Aussprüche des göttlichen Geistes unbezweifelt annehmen und Christo selbst glauben, wenn er sagt: „Amen. Amen, ich sage euch, wir reden, was wir wissen, und was wir gesehen haben, bezeugen wir.“</p><p>B. Du hast Recht.</p><p>A. Fort denn also alles Geschwätz und eitles Gerede und Irrwahn und Trug aufgeputzter Reden; denn wir lassen Nichts zu, was Schaden zu bringen geeignet ist, wenn auch die Gegner mit sehr gekünstelten und sogar heftigen Reden uns zusetzen. Denn unser göttliches Mysterium beruht nicht auf überzeugenden Worten menschlicher Weisheit, sondern auf dem Beweise des Geistes. Indem er also Gott ist und Herr von Allem, den Schriften gemäß, ist der Eingeborne uns erschienen. Denn er wurde auf Erden gesehen und leuchtete den in Finsterniß Befindlichen da er Mensch wurde, und zwar nicht bloß scheinbar (Das sei ferne, denn Wahnsinn ist es, Dieß zu denken oder zu sagen), auch nicht in’s Fleisch umgesetzt durch Umwandlung und Veränderung (denn unveränderlich und immer sich gleich bleibend ist das Wort Gottes), aber auch nicht so, als wäre er selbst erst gleichzeitig mit dem Fleische entstanden (denn er selbst ist der Gründer der Zeiten); auch nicht, als wäre er im Menschen gewesen als bestandloses Wort oder leere Rede (denn der einst das Nichtseiende zum Bestehen und Entstehen rief, hat nothwendig vorher bestan- den; denn er ist das Leben, entsprungen aus dem Leben Gottes des Vaters, der da ist und gedacht wird in eigener Subsistenz); aber auch nicht bloßes, der vernünftigen Seele entbehrendes Fleisch hatte er an, sondern in Wahrheit ist aus dem Weibe geboren und als Mensch erschienen der lebendige und selbstständige und mit Gott dem Vater gleichewige Gott das Wort, Knechtsgestalt annehmend, und ist wie in göttlicher, so auch in menschlicher Natur vollkommen, nicht aus reiner Gottheit und Fleisch zu einem Christus und Herrn und Sohn zusammengesetzt, sondern aus zwei vollkommenen, der Menschheit nämlich und Gottheit, zu Einem und Demselben auf wunderbare Weise verbunden.</p><p>B. Wen nun also gebar die heilige Jungfrau, den Menschen oder das Wort aus Gott?</p><p>A. Nun freilich, Das eben ist der Irrthum und die Abweichung von dem Richtigen und Wahren. Denn du sollst mir den Emmanuel nicht spalten und ihn nicht in einen Menschen für sich und in Gott das Wort scheidend uns als zweipersönlich vorstellen. Würde man nicht mit Recht uns tadeln, wenn wir nicht das Richtige, sondern vielmehr Das denken wollten, was auch durch die heilige Schrift verworfen ist? Denn so hat Einer von den Jüngern Christi gesagt: „Ihr aber, Geliebte, seid eingedenk der Worte, welche von den Aposteln unseres Herrn Jesu Christi vorher geredet wurden, daß sie euch sagten, daß in den letzten Zeiten trugvolle Betrüger kommen werden, die nach ihren Gelüsten wandeln in Gottlosigkeit. Diese sind es, die sich absondern als Sinnesmenschen, die den Geist nicht haben.“</p><p>B. Darf man also auf keine Weise unterscheiden?</p><p>A. Durchaus nicht, und insbesondere wenigstens nicht so, daß man nach der Vereinigung von Zweien rede und Jeden von Beiden für sich denke. Man muß indeß wissen, daß der Verstand einen gewissen Unterschied der Naturen wahrnimmt, denn nicht Dasselbe ist die Gottheit und die Menschheit; er wird aber zugleich mit den Gedanken an diese auch die Verbindung beider zur Einheit bedenken. Aus Gott dem Vater also entsprang er als Gott, aus der Jungfrau aber als Mensch; denn das auf unaussprechliche und unbegreifliche Weise aus Gott dem Vater hervorgehende Wort ist geboren worden auch vom Weibe, indem es zur Menschheit herabstieg und sich herabließ zu Dem, was es nicht war, nicht um entleert zu bleiben, sondern um als Gott anerkannt zu werden, und in unserer Gestalt auf Erden erschien, nicht als im Menschen (bloß) Wohnung nehmend, sondern als selbst ein wirklicher Mensch geworden mit Beibehaltung der eigenen Herrlichkeit. Und darum sagt auch der heilige Paulus, indem er das von gegenseitiger Wesensgleichheit weit Entfernte und durch unermeßlichen Unterschied Geschiedene, die Gottheit nämlich und Menschheit, heilsordnungsmäßig in Eins zusammenfaßt und Christum und den Sohn und Gott aus Beiden als Einen darstellt, also: „Paulus, Diener Jesu Christi, berufener Apostel, auserkoren für das Evangelium Gottes, welches er zuvor verheissen hat durch seine Propheten in den heiligen Schriften, von seinem Sohne, der geboren ist aus dem Samen Davids dem Fleische nach, erkoren als Sohn Gottes in Kraft dem Geiste der Heiligung nach.“ Siehe, klar sagt er, er sei auserkoren für das Evangelium Gottes, da er gleichwohl deutlich schreibt: „Denn nicht uns selbst verkündigen wir, sondern Christum Jesum, den Herrn;“ und wieder: „Ich erachtete, Nichts zu wissen bei euch ausser Jesum Christum, und zwar den Gekreuzigten.“ Indem er ihn aber Sohn Gottes nennt, sagt er auch, er sei geboren worden aus dem Samen Davids, und behauptet, er sei erkoren worden auch zum Sohne Gottes. Wie nun, sag’ mir, ist Der Gott, der aus dem Samen Davids stammte? Und der schon vor den Zeiten und auf ewige Weise Sohn ist, sofern er aus Gott entsprang, wie so denn wurde Der erkoren zum Sohne Gottes, gleich als wäre er zum Anfang der Existenz gelangt? Er sagt nämlich selbst von sich: „Der Herr sprach zu mir: Mein Sohn bist du, ich habe dich heute gezeugt,“ da doch das „heute“ allezeit uns nicht die vergangene, sondern vielmehr die gegenwärtige Zeit anzeigt.</p><p>B. Ich wenigstens bin nicht wenig verlegen; ich möchte aber meinen, daß auch für viele Andere das Verständniß hievon sehr schwer zu erreichen ist.</p><p>A. Für Die, welche Theile machen und trennen, ist es schwer zu fassen und unbegreiflich in der That für Diejenigen indeß, welche den Emmanuel zur Einheit zusammenhalten, ist die unverfälschte Erkenntniß der heiligen Lehrsätze leicht faßlich und naheliegend. Denn da der dem Erzeuger gleichewige und vor aller Zeit existirende Sohn zur Natur des Menschen herabstieg, nicht mit Verlust seiner Göttlichkeit, sondern durch Annahme der Menschlichkeit, so kann man doch leicht von ihm denken, daß er auch aus dem Samen Davids geboren sei und die Geburt in der Menschlichkeit als etwas ganz Neues habe. Es ist aber das Angenommene nicht etwas ihm Fremdes, sondern in der That sein eigen. Es wird daher als Eins mit ihm betrachtet, wie man ja gewiß auch an der Zusammensetzung des Menschen sehen kann. Dieser ist nämlich verknüpft aus von Natur Ungleichen, aus Seele nämlich und Leib, aber Beides zusammen wird als ein Mensch begriffen, so daß man vom Fleische allein bisweilen das ganze Lebewesen benennt, wenn aber die Seele genannt wird, Beides zusammen versteht. Auf die gleiche Weise nun sollst du es auch bei Christo selbst annehmen. Denn ein Sohn und ein Herr ist Jesus Christus, sowohl vor dem Fleische, als da er Mensch wurde; und wir werden den Herrn, der uns erkauft hat, nicht verläugnen, auch wenn er von uns durch menschliche Eigenschaften und nach dem Maaße seiner Erniedrigung bezeichnet wird.</p><p>B. Ich folge nicht ganz; aber ich möchte es klar verstehen.</p><p>A. Zu den Juden redend sprach unser Herr Jesus Christus: „Wenn ihr Kinder Abrahams wäret, würdet ihr auch die Werke Abrahams thun; nun aber suchet ihr mich zu tödten, einen Menschen, der ich euch die Wahrheit gesagt habe; Das hat Abraham nicht gethan.“ Es schreibt aber auch Paulus von ihm: „Er hat in den Tagen seines Fleisches Gebete und Bitten mit starkem Ruf und Thränen Dem dargebracht, der ihn vom Tode retten konnte, und ist seiner Ergebung wegen erhört worden; und er, obwohl Sohn, hat an Dem, was er litt, Gehorsam gelernt.“ Werden wir nun deßhalb Christum für einen bloßen Menschen halten, der auf keine Weise über uns erhaben war?</p><p>B. Das sei ferne.</p><p>A. Daß aber die Weisheit und Kraft Gottes so weit in der Schwachheit gekommen sei, daß sie den Tod fürchtete und vom Vater Rettung erflehte, werden wir Das zugeben und also läugnen, daß der Emmanuel von Natur aus das Leben sei, oder werden wir, indem wir die in den Worten liegende Niedrigkeit auf die Menschheit und das Maß unserer Natur beziehen, etwas Löbliches thun und, sofern er Gott ist, seine überweltliche Herrlichkeit betrach- ten, wohl wissend, der Nämliche sei Mensch sowohl als Gott, nämlich Mensch gewordener Gott?</p><p>B. Erkläre, wie?</p><p>A. Es trete uns also hervor der höchst bewährte Paulus, welcher ruft und spricht: „Weisheit reden wir bei den Vollkommenen, Weisheit aber nicht dieser Welt noch der Fürsten dieser Welt, die zu nichte werden, sondern wir reden Weisheit Gottes, die im Geheimnisse verborgene, welche Gott vorherbestimmt hat vor den Weltzeiten zu unserer Verherrlichung, welche keiner der Fürsten dieser Welt erkannt hat. Denn wenn sie sie erkannt hätten, hätten sie den Herrn der Herrlichkeit nicht gekreuzigt;“ und ausserdem: „Der da ist der Abglanz seiner Herrlichkeit und das Ebenbild seines Wesens und Alles trägt durch das Wort seiner Macht, und der, nachdem er die Reinigung von den Sünden vollbracht hat, sitzet zur Rechten der Herrlichkeit in der Höhe, um so größer geworden als die Engel, je vorzüglicher der Name ist, den er vor ihnen ererbt hat.“ Und doch, daß er Herr der Herrlichkeit ist und heißt, wie sollte Das nicht überaus groß sein und hinaus über alles Gewordene und zum Dasein Gebrachte? Ich übergehe das Menschliche, denn es ist sehr gering; aber sagen will ich, daß, wenn Jemand auch die Engel nennen und Fürstenthümer und Throne und Herrschaften aufzählen würde, und wenn er sogar der höchsten Seraphim gedenken würde, er doch zugeben müßte, daß all Das zurückstehe gegen die so überaus große Herrlichkeit, wenn er je einen unverdorbenen Verstand hat. Denn unvergleichlich, meine ich, ist die Auszeichnung und darf nur der über Alles herrschenden Natur zukommen. Wie nun sollte Derjenige Herr der Herrlichkeit sein, der gekreuziget wurde? Von dem Abglanz des Vaters aber und dem Ebenbild seines Wesens, welcher Alles trägt durch das Wort seiner Kraft, wird gesagt, er sei größer geworden als die Engel, da er doch wohl einen geringeren Stand, wie ich glaube, annahm, als er Mensch wurde. Denn es steht geschrieben: „Den ein wenig unter die Engel erniedrigten Jesus aber sehen wir um der Erduldung des Todes willen mit Herrlichkeit und Ehre gekrönt.“ Werden wir also das aus Gott dem Vater entsprungene Wort hinausstoßen aus der ihm zukommenden wesentlichen Erhabenheit und der genauen Ähnlichkeit mit demselben, weil wir ihn sogar unter die Herrlichkeit der Engel erniedrigt sehen durch die Erniedrigung der Menschwerdung?</p><p>B. Durchaus nicht. Denn ich glaube, man darf weder das Wort aus Gott nach der Fleischesannahme ganz von dem Menschlichen ablösen, noch auch das Menschliche, wenn es in Christo gedacht und gesagt wird, der göttlichen Herrlichkeit berauben. Aber du mußt wissen, daß Einige fragen: Wer denn also ist in Wahrheit Jesus Christus, der Mensch aus dem Weibe oder das Wort aus Gott?</p><p>A. Thöricht ist es durchaus, sich übermäßig anzustrengen und geschwätzigen Faseleien entgegenzuschreien. Sagen aber will ich, daß es gefährlich und nicht straflos ist, zwei Theile zu machen und den Menschen und das Wort gesondert hinzustellen, da die Heilsordnung Dieß nicht zuläßt, und die heilige Schrift Christum als einen verkündet. Denn man darf, sage ich, weder das Wort aus Gott ohne die Menschheit, noch den aus dem Weibe gebornen Tempel ohne Einigung mit dem Worte Christus Jesus nennen. Denn das in heilsordnungsmäßiger Einheit geheimnißvoll mit der Menschheit verbundene Wort aus Gott versteht man unter Christus, der erhabener ist als die Menschheit, als Gott und Sohn von Natur, etwas erniedrigt aber unter die göttliche Herrlichkeit, als Mensch. Darum sagte er auch einmal: „Wer mich gesehen hat, hat den Vater gesehen. Ich und der Vater sind Eins;“ und wieder ein ander Mal: „Der Vater ist größer als ich.“ Denn da er nicht geringer ist als der Vater nach seiner Wesensgleichheit und Allem, worin er ihm gleich ist, erklärt er sich geringer der Menschheit nach. Er wird aber auch durch die heiligen Schriften verkündet, bald als ein vollständiger Mensch, Heilsordnungsmäßige mit Verschweigung seiner Gottheit, bald aber auch wieder als Gott, mit Verschweigung seiner Menschheit; es geschieht ihm aber auf keine Weise Unrecht wegen der Verbindung beider zur Einheit.</p><p>B. Wie meinst du? Denn ich verstehe es nicht völlig.</p><p>A. Der Hebräer aus Hebräern und dem Stamme Benjamin, der berufene Apostel schreibt an die durch den Glauben Gerechtfertigten, die gestorben waren an den Gliedern des Fleisches, nämlich Unzucht, Wollust, böser Begier und Habsucht: „Ihr seid nämlich gestorben, und euer Leben ist mit Christo verborgen in Gott.“ Er selbst aber sagt von seinen Jüngern: „Heiliger Vater, bewahre sie in deinem Namen, wodurch du sie mir gegeben hast, damit sie Eins seien wie wir! Da ich bei ihnen war, habe ich sie bewahrt in deinem Namen, die du mir gegeben hast, und habe sie behütet, und Keiner aus ihnen ging verloren ausser der Sohn des Verderbens, damit die Schrift erfüllt würde. Jetzt aber komme ich zu dir, damit sie meine Freude vollkommen in sich haben.“ Verstehst du also, wie er uns hierin wenigstens gleichsam nur von Seite seiner Menschheit gezeigt zu werden scheint?</p><p>B. Du hast vollkommen Recht.</p><p>A. Wir werden nämlich meinen, er sei gar nicht verborgen und von der Welt ausgewandert, da er ja deutlich sagt: „Wahrlich, wahrlich, ich sage euch: Wo immer Zwei oder Drei in meinem Namen versammelt sind, da bin ich in ihrer Mitte;“ und wiederum: „Sehet, ich bin bei euch alle Tage bis an’s Ende der Welt.“ Du kannst aber auch den heiligen Paulus oft es nicht beachten sehen, daß man ihn auch als Menschen verkünden müsse. Denn „Paulus“, sagt er, „nicht von Menschen noch durch Menschen, sondern durch Jesus Christus.“ Und überdieß sagt er wieder: „Ich thue euch aber kund, Brüder: Das von mir verkündete Evangelium ist nicht von einem Menschen. Denn ich habe es auch nicht von einem Menschen empfangen oder gelernt, sondern durch Offenbarung Jesu Christi.“ Und anderswo sagt er: „Wenn wir aber auch Christum dem Fleische nach gekannt haben, aber jetzt erkennen wir ihn nicht mehr.“ Wer also ist Jesus Christus, der die so unaussprechliche, untrügliche und göttliche Offenbarung seiner Geheimnisse ihm aufleuchten ließ? Nicht das Fleisch gewordene Wort, das um unsertwillen die Geburt aus dem Weibe nicht verschmähte?</p><p>B. Jedenfalls. Ich erinnere mich nämlich, daß der selige Gabriel zur heiligen Jungfrau sprach: „Fürchte dich nicht, Maria; denn sieh’, du wirst empfangen und einen Sohn gebären und wirst seinen Namen Jesus nennen!“ Nun aber, glaube ich, ist dieser Name dem Worte vom Vater gegeben worden durch die Stimme des Engels. Denn so ruft auch ein prophetischer Ausspruch: „Sie werden ihn mit einem neuen Namen rufen, den der Herr ihm geben wird.“</p><p>A. Da nun der dem Vater gleichewige und aller Zeit vorhergehende Sohn und Eingeborne in den letzten Zeiten der Welt Mensch wurde, vom Weibe geboren und als Sohn erkoren wurde, als Erstgeborner auftrat und einer von vielen Brüdern wurde, da bestimmte auch sein natürlicher Vater ihm den Namen, den Gesetzen der Vaterschaft so zu sagen folgend. — Möchtest du auch uns erfreuen dadurch, daß du die Art der Heilsordnung vollkommen verstehest!</p><p>B. Der Nämliche also ist sowohl Eingeborner als auch Erstgeborner.</p><p>A. Meine ja nicht bei dir selbst, daß es sich anders verhalte als so, mein Lieber! Der Eingeborne nämlich (ist er) als Gott, der Erstgeborne unter uns der heilsordnungsgemäßen Einigung nach und unter vielen Brüdern als Mensch, damit auch wir in ihm und durch ihn Söhne Gottes seien der Natur und der Gnade nach; der Natur nach, als in ihm und dem Einzigen, theilnahmsweise aber und der Gnade nach wir (Gerechtfertigte) durch ihn im Geiste. Gleichwie nun in Christo das „Eingeborner“ Eigenthum der Menschheit wurde durch ihre Vereinigung mit dem Worte nach der heilsordnungsmäßigen Verbindung, so wurde das „unter vielen Brüdern“ und das „Erstgeborner“ dem Worte eigen durch seine Vereinigung mit dem Fleische. Da er aber das Gottsein als feststehend hat und stets über den Wandel erhaben ist, so verliert er seine Herrlichkeit nicht. Darum ist mit uns auch der heiligen und seligen Menge der himmlischen Geister befohlen worden, ihn anzubeten. Denn es war doch wohl auch sehr natürlich, daß sie beim Anblick der Niedrigkeit seiner Menschheit die Anbetung verweigerten und es verabsäumten, ihn zu ehren, und den um unsertwillen uns Gleichen der Lobpreisung nicht würdigten, indem sie dabei vom Scheine des Irrthums so weit als möglich entfernt waren. Denn unsichtbar war auch ihnen das Mysterium Christi, aber der Geist offenbarte es ihnen und ließ nicht zu, daß die Geheiligten unehrerbietig wären. Darum sagt der heilige Paulus: „Da er den Erstgebornen in die Welt einführte, sprach er: Und es sollen alle Engel Gottes ihn anbeten.“ Denn der durch seine natürliche Eigenheit sich von der ganzen Welt unterscheidet und ausser ihr existirt als Gott, ging in sie ein, ein Theil der Welt werdend als Mensch; indeß entfiel er dadurch nicht der göttlichen Herrlichkeit. Denn er wird angebetet als Eingeborner, auch wenn er Erstgeborner genannt wird, was offenbar den Maßverhältnissen der Menschheit angemessen ist.</p><p>B. Werden wir also den Emmanuel als Menschen anbeten?</p><p>A. Das sei ferne! Denn leeres Gerede ist Dieß und Täuschung und Irrthum. Wir würden uns aber in Nichts unterscheiden von Denen, die dem Geschöpfe göttliche Verehrung erwiesen statt dem Schöpfer und Weltgründer, welche die Wahrheit Gottes verkehrten in Lüge, wie geschrieben steht. Und wenn wir ähnlich denken würden wie sie, würden wir jedenfalls auch hören müssen wie sie: „Sich für weise erklärend sind sie Thoren geworden und vertauschten die Herrlichkeit des unvergänglichen Gottes mit dem Gleichnisse des vergänglichen Abbildes, des Menschen, der Vögel, der vierfüßigen und kriechenden Thiere.“ Oder würden denn nicht auch wir selbst im Thun und Denken den Erwähnten gleich sein, die Herrlichkeit Gottes vertauschend mit der Lüge, mit dem Gleichnisse des vergänglichen Bildes eines Menschen, wenn wir als einem bloßen Menschen und Einem der Unsrigen dem Emmanuel Anbetung darbringen würden?</p><p>B. Allerdings.</p><p>A. Wie aber? Wird nicht auch selbst die himmlische Schaar der Engel den so weit im Unsinn Gekommenen beigesellt werden?</p><p>B. Nothwendig.</p><p>A. Eine unentrinnbare Anklage aber auf Irrthum werden wir auch gegen die Heerde der Völker erheben, und unauswaschbar wird die Schmach ihrer alten Vergehungen sein. Denn sie irrt, meine ich, auch jetzt und nicht geringer als ehedem und kennt nicht den zum Rechten führenden Pfad. Und nur zu sehr Recht hat der heilige Paulus, der ihnen zuruft und sagt: „Aber ehemals habt ihr, da ihr Gott nicht kanntet, den falschen Göttern gedient. Jetzt aber, da ihr Gott kennet oder vielmehr von Gott erkannt seid, wie wendet ihr euch wieder zu den kraftlosen und armseligen Anfangsgründen, denen ihr neuerdings wieder dienen wollt?“ Denn was für einen Gott erkennen sie noch, wenn Christus, an den sie glauben, nicht wahrer Gott ist? Und wenn sie einem Menschen göttliche Verehrung erweisen, liegen sie in den Schlingen des alten Irrthums. Oder ist nicht wahr, was ich sage?</p><p>B. Ja freilich.</p><p>A. Siehe nun, wie wir schon aus nothwendigen Vernunftgründen fast wider Willen dazu getrieben werden, vernünftiger Weise als wahren Gott den Sohn anbeten zu müssen, auch da er in unserer Gestalt erschien, da ja die Verbindung zur Einheit wohl im Stande ist, das auch bisweilen zum Verdachte der Menschheit Beunruhigende zu beseitigen (λυποῦν εἰς ἀνθρωπότητος ὑποψίαν).</p><p>B. Wie meinst du?</p><p>A. Da die Natur des Wortes das Menschliche angenommen hat, so ist sie keine bloße Menschheit, sondern indem sie vielmehr durch ihre eigene Herrlichkeit das Angenommene übertrifft, erhält sie sich in unerschütterlicher Beständigkeit der göttlichen Glorie. Dieß bedenkend beteten die Jünger an, indem sie sagten: „Wahrhaftig, du bist Gottes Sohn,“ da sie ihn doch zu Fuß gehen sahen und im Fleische wie wir; auf hoher Fluth nämlich schritt er wunderbar dahin als Gott.</p><p>B. Und wer war Der, welcher zu dem samaritischen Weibe sprach: „Ihr betet an, was ihr nicht kennet; wir beten an, was wir kennen“? Sodann, wie wird Derjenige anzubeten sein, der den Anbetern beigesellt ist?</p><p>A. Fürwahr, mein Lieber, sehr oft rufst du dieses Wörtchen „wer“ aus, das ich weiß nicht wie von den Unverständigen erfunden ist. Denn Christus ist keineswegs getheilt. Der aber zu dem Weibe sprach, war der eine und einzige Herr Jesus Christus, aus der anbetenden Menschheit und der angebeteten Gottheit geheimnißvoll zusammengesetzt, wie man allerdings auch anders von ihm sagen könnte. Denn sofern er Gott ist, kann man ihn denken als Herrn der Herrlichkeit; sofern er aber ein durch Theilnahme an Gott zu verherrlichender Mensch geworden ist, war er auch der Herrlichkeit bedürftig, da er sagt: „Vater, verherrliche deinen Sohn!“ Übrigens aber: „Ein Herr, ein Glaube, eine Taufe,“ wie geschrieben steht. Gleichwie nun der Glaube an Christus einer ist und die Taufe in Wahrheit eine, obwohl wir getauft werden und glauben an Vater und Sohn und heiligen Geist, aus dieselbe Art und Weise, glaube ich, ist eine Anbetung des Vaters und des Mensch gewordenen Sohnes und des heiligen Geistes. Denn keineswegs darf von der nothwendigen Anbetung so- wohl bei uns selbst als bei den heiligen Engeln der Eingeborne ausgeschlossen werden, wenn er auch „Fleisch geworden ist und unter uns gewohnt hat“ und als Erstgeborner sich gerirte unter vielen Brüdern. Denn welches übrigens die Art des Glaubens an ihn sei, wie wäre Das nicht der Erwägung werth? Denn weder werden, meine ich, die richtig denken wollen, sagen, daß wir nur an das aus Gott stammende Wort glauben, es des Fleisches entkleidend, noch auch werden wir hinwieder jenes Andere sagen lassen: es wird nämlich gleich besprochen werden.</p><p>B. Was meinst du?</p><p>A. Es handelt sich nämlich nicht um den Glauben als an Einen der Unsrigen oder an einen Menschen, sondern um den Glauben an Gott, der wesentlich und wahrhaft ist im Angesichte (in der Person) Christi; es bestätigt aber diese Ansicht auch der weise Paulus, da er schreibt: „Denn nicht uns selbst predigen wir, sondern Christum Jesum, den Herrn, uns selbst aber als euere Diener um Christi willen. Denn Gott, der aus Finsterniß Licht leuchten hieß, der hat in unsere Herzen geleuchtet, um das Licht der Erkenntniß seiner Herrlichkeit leuchten zu lassen im Angesichte (in der Person) Christi.“ Siehe, klar und deutlich leuchtete das Licht der Erkenntniß Gottes des Vaters im Angesichte (in der Person) Christi. Darum sprach er auch: „Wer mich gesehen hat, hat den Vater gesehen. Ich und der Vater sind Eins.“ Das göttliche Ebenbild aber ist nicht körperlich, sondern in göttlichster Kraft und Herrlichkeit; dieses aber war lauter in Christo, und er würdigte sich sowohl, hiedurch kund zu werden, als auch wollte er, daß durch die Erhabenheit seiner Werke die Hörer zur Erkenntniß seiner sich erhöben, da das Fleisch, das man sah, ihn einigermaßen verringerte. „Denn wenn ich die Werke meines Vaters nicht thue,“ sagt er, „so glaubet mir nicht. Thue ich sie aber, so glaubet, wenn ihr auch mir nicht glaubet, doch meinen Werken!“ Ich meine aber, Christus habe Dieß damals gesagt, wohl wissend, daß die Sache nicht ohne Nutzen sei. Denn da sie meinten, er sei nicht Gott von Natur, der um unsertwillen Mensch geworden ist, sondern einfach ein bloßer Mensch gleich uns, und darum Manche den Glauben an ihn für unannehmbar hielten, so sprach er, nothwendig ihre Furcht und Trägheit hiezu abschneidend, indem er den Glauben der Natur der Gottheit zuwies als in der Person des Vaters und ihn nicht unserer Geringheit zutheilte: „Wer an mich glaubt, glaubt nicht an mich, sondern an Den, der mich gesandt hat.“ Ist es nicht, als ob er sagte: O ihr Hörer meiner Reden, denket nicht klein und niedrig von mir; ihr sollt aber wissen, daß, indem ihr an mich, den ihr im Fleische sehet, eueren Glauben hingebet, ihr nicht einfach an einen Menschen gläubig sein werdet, sondern an den Vater selbst durch mich, den durchaus ihm gleichen und ebenbildlichen Sohn, der ich Fleisch geworden bin um euretwillen und eine geringe Hülle annahm, die Menschheit, aber im Sein und Wirken ihm gleich bin und unverkürzt dieselbe Herrlichkeit besitze wie er?</p><p>B. Es scheint so.</p><p>A. Du kannst aber auch auf andere Weise sehen, daß er den Glauben nicht abweist, sondern ohne Spaltung und Unterscheidung denselben annimmt, als in eigener Person, wenn er auch Fleisch geworden ist. Denn als er den von Geburt Blinden heilte und ihm also das süße und ungewohnte Licht aufpflanzte, wurde er natürlich von Allen bewundert. Aber der von dem Leiden Befreite wurde von den Juden gerichtet und bekannte den Arzt. Christus aber sprach, da er mit ihm zusammentraf: „Glaubst du an den Sohn Gottes?“ Als aber Dieser: „Wer ist es, Herr?“ ausrief, „damit ich an ihn glaube,“ erwiderte er und sprach: „Du hast ihn gesehen, und der mit dir redet, der ist’s.“ Jener aber sprach: „Ich glaube, Herr!“ und betete ihn an. Gleichwohl wie wäre es nicht Allen einleuchtend, daß die göttliche und höchste Natur durchaus unsichtbar ist? „Denn Gott hat Niemand je gesehen,“ wie geschrieben steht. Wenn nun wirklich mit Unterscheidung seines Menschlichen, weil er ja eben dieses geworden ist, der Logos (das Wort) aus Gott dem Vater rein und allein an ihn zu glauben gestattete, den Geheilten vielmehr nicht die Natur Gottes, welches sie wohl wäre, zu bedenken aufforderte, sondern körperlich zeigte, wie man auch mit den Augen selbst sehen konnte (er sagte ja: „Du hast ihn gesehen, und der mit dir redet, der ist’s“): werden wir also nicht sagen, er habe das Fleisch gezeigt?</p><p>B. Ja freilich.</p><p>A. Nun denn, wie sollte übrigens er selbst das Fleisch sein, wenn man nicht von ihm dächte, daß er durch die Einigung selbst Das ist, was sein eigen ist, wie es ja allerdings auch bei uns der Fall ist? Denn es wird wohl Niemand unseren, das heißt den aus Seele und Leib bestehenden Menschen getheilt oder unvollständig aufzeigen können, bloß von Seite seines Fleisches.</p><p>B. Ich stimme bei, denn du hast Recht.</p><p>A. Es schreibt aber irgendwo auch der weise Johannes: „Viele noch andere Zeichen hat Jesus vor seinen Jüngern gethan, welche nicht aufgeschrieben sind in diesem Buche. Diese aber sind aufgeschrieben, damit ihr glaubet, daß Jesus der Gesalbte ist, der Sohn des lebendigen Got- tes, und damit ihr durch den Glauben das Leben habet in seinem Namen.“ Man wird aber nicht weniger auch den heiligen Petrus bewundern, der klar und deutlich zu den Juden sprach: „Ihr Oberen des Volkes und ihr Ältesten höret! Wenn wir heute zur Rede gestellt werden über die Wohlthat an dem kranken Menschen, durch wen er gesund geworden ist, so sei kund euch allen und dem ganzen Volke Israel, daß im Namen Jesu Christi, des Nazareners, den ihr gekreuzigt habt, den Gott von den Todten erweckt hat, in Diesem Jener gesund vor euch dasteht!“ Und gleich darauf wieder: „Und es ist in keinem Anderen das Heil; denn es ist kein anderer Name unter dem Himmel den Menschen gegeben, wodurch wir sollen selig werden.“ Wer nun ist’s, der den Tod überwand und in Herrlichkeit auferstand, und aus Nazareth stammt, ausser Jesus Christus, das heißt der vor der Welt geheimnißvoll aus dem Vater, in der letzten und dem Ende zugehenden Weltzeit aber auch körperlich aus dem Weibe Geborene? Wer nun den Glauben an ihn annimmt, wird das herrliche Ehrengeschenk davontragen; er wird nämlich Sohn Gottes genannt werden. Denn „Jenen, welche ihn aufnahmen, gab er die Macht,“ heißt es „Kinder Gottes zu werden, die nicht aus dem Geblüte noch aus Fleisches Willen noch aus Mannes-Willen, sondern aus Gott geboren sind.“ Denn damit er Der würde, „der in Allem den Vorrang hat,“ wie geschrieben steht, ist er „geboren worden vom Weibe“. Und da er „der Erstling“ der durch die Heiligung zu Gott wieder hergestellten Schöpfung ist, so erwies auch er vor den Anderen sich als aus dem Geiste geboren, indem er den Zusammentritt von Mann und Weib übersprang, nicht um mit Unehre und Schmach die Natur zu verdammen (denn ehrwürdig ist die Ehe, und „der am Anfang schuf, hat sie als Mann und Weib geschaffen“ ), sondern um das Menschliche gewissermaßen schon dem Besseren und unvergleichlich Höheren zuzuweisen. Denn als aus dem Geiste, nicht aus Männern geboren, wollte er, sollten auch wir uns darstellen. „Und ihr sollt,“ sagt er darum, „Keinen auf Erden eueren Vater nennen; denn einer ist euer Vater, der himmlische;“ „ihr alle aber seid Brüder.“ Untadelhaft also durchaus ist es, an ihn zu glauben; vielmehr aber wird es sogar durch die Vergebung der Sünden geehrt (gelohnt). Denn so schreibt abermals der herrliche Paulus: „Wissend aber, daß der Mensch nicht gerechtfertigt wird durch Gesetzes-Werke. sondern nur durch den Glauben an Jesus Christus, sind auch wir gläubig geworden an Christus Jesus. Ich will es aber keineswegs verabsäumen, Das, was ich soeben bereits gesagt habe, zusammenfassend zu sagen, daß unter Christus Jesus nicht bloß und an sich das Wort aus Gott verstanden wird, sondern als es das Menschliche annahm, verband es sich mit dem Fleische; und den so beschaffenen, sichtbar gewordenen und in unserer Gestalt Erscheinenden zeigte der Vater den heiligen Aposteln, indem von oben her diese Stimme erschallte: „Dieser ist mein geliebter Sohn, in dem ich mir wohlgefalle; ihn höret!“ Verstehst du also, wie er nicht sagt: „In Diesem ist mein Sohn,“ damit er nicht getheilt, gleichsam als Einer in einem Anderen, sondern als Einer und Derselbe gedacht würde nach heilsordnungsmäßiger Einigung. Daß es aber sündhaft ist, zu widerstreben, und im höchsten Grade gefährlich, davon wird Johannes überzeugen, der also schreibt: „Dieses ist das Zeugniß Gottes, das er bezeugt hat von seinem Sohne; wer an den Sohn Gottes glaubt, hat das Zeugniß Gottes in sich. Wer Gott nicht glaubt, macht ihn zum Lügner, weil er nicht glaubt an das Zeugniß, das Gott bezeugt hat von seinem Sohne.“ Er hat aber bezeugt: Dieser, der im Fleische und in der Knechtsgestalt ist, ist einzig und ausschließlich mein wahrhaftiger Sohn. Wie aber? Werden wir nicht zugeben, daß auch die herrliche, durch die heilige Taufe ertheilte Gnade und die Lebendigmachung in ihm und die Theilnahme an Gott durch die Heiligung im Geiste durch Jesus Christus vollbracht wurde?</p><p>B. Nothwendig. Denn ich gedenke des Johannes, der sagt: „Der nach mir kommt, ist stärker als ich, dem ich nicht würdig bin die Schuhe zu tragen. Jener wird euch im heiligen Geiste und Feuer taufen.“</p><p>A. Sollen wir also sagen, o Freund, es bedürfe unserer Menschlichkeit, um im heiligen Geiste und Feuer taufen zu können?</p><p>B. Und wie sollte Das geschehen?</p><p>A. In der That, indem er von einem Manne redete, der gar bald kommen und erscheinen würde, sagte er, derselbe taufe im Feuer und heiligen Geiste, nicht einen fremden Geist den Täuflingen mittheilend in der Weise eines Knechtes und Dieners, sondern als Gott von Natur mit höchster Machtvollkommenheit den seinigen und ihm eigenen, durch welchen uns auch das göttliche Kennzeichen aufgedrückt wird. Denn wir werden, als zum göttlichen Ebenbilde, zu Christus Jesus umgestaltet, nicht indem wir eine körperliche Umbildung erfahren (denn ganz ungereimt ist es, Das zu meinen), sondern indem wir durch Empfang des heiligen Geistes Christum selbst in uns besitzen, so daß wir nun freudig ausrufen können: „Es frohlocke meine Seele im Herrn; denn er hat mich bekleidet mit dem Mantel des Heils und dem Gewande der Freude!“ Denn „ihr alle, die ihr auf Christus getauft seid, habt Christum angezogen“ heißt es.</p><p>B. Sind wir also auf einen Menschen getauft, und werden wir sagen, daß Das wahr sei?</p><p>A. O sag’ doch nicht so, Mensch! Was thust du da? Du drückst unsere Hoffnung zur Erde herab. Denn wir sind getauft, nicht aus einen Menschen schlechthin, sondern auf Gott, der Mensch geworden ist und von Strafe und den alten Verschuldungen Diejenigen freiläßt, die den Glauben an ihn annehmen. Und darum sagt der heilige Petrus, zu den Juden sprechend: „Thuet also Buße und lasse sich taufen ein Jeder von euch im Namen Jesu Christi zur Erlassung euerer Sünden, und ihr werdet empfangen die Gabe des heiligen Geistes.“ Denn indem er den ihm Anhängenden von Sünde losspricht, salbt er ihn im Übrigen mit seinem Geiste, den er selbst, als Wort aus Gott dem Vater, sendet und aus seiner eigenen Natur auf uns überquellen läßt. Indem er aber die Sache vermöge der Einigung gleichsam gemeinsam macht mit der Erscheinung im Fleische, hauchte er ihn als Mensch auch körperlich ein. Er hauchte nämlich die Apostel an, indem er sprach: „Empfanget den heiligen Geist!“ Und nicht nach Maaß gibt er den Geist, wie Johannes sagt, sondern er selbst sendet ihn aus sich selbst wie allerdings auch der Vater. Und darum sehen wir auch, daß der heilige Paulus, den hierin statthabenden Unterschied bei Seite lassend, ihn bald Gott dem Vater zutheilt, bald aber wieder dem Sohne. Er schreibt nämlich so: „Ihr aber seid nicht im Fleische, sondern im Geiste, wenn anders der Geist Gottes in euch wohnt; wenn aber Einer den Geist Christi nicht hat, der ist nicht sein. Wenn aber Christus in euch ist, ist zwar der Leib todt, der Sünde wegen, der Geist aber lebt, der Rechtfertigung wegen.“</p><p>B. Es fügt sich also, daß der Geist dem Sohne eigen ist, und nicht etwa bloß, sofern er das aus dem Vater entspringende Wort ist, sondern auch, sofern er gedacht wird als Mensch geworden gleich uns.</p><p>A. Eigen, sofern er aus dem Vater in dem gleichwesentlichen Erzeugnisse, dem aus ihm stammenden Worte, ist, wenn man auch sagen kann, er habe ihn, da er Mensch wurde, empfangen, da er der Eigenheiten der Gottheit in seiner eigenen Natur entbehrt. Obwohl er daher selbst das Leben Aller ist vermöge der geheimnißvollen Geburt aus dem lebendigen Vater, so heißt es doch von ihm, daß er lebendig gemacht wurde mit uns. Gleichwohl aber ist ersichtlich, daß er dem eigenen Fleische die Herrlichkeit der göttlichen Wirksamkeit mittheilte, die Eigenheiten des Fleisches aber wiederum sich aneignete und gleichsam durch die heilsordnungsmäßige Einigung auch der eigenen Natur umlegte.</p><p>B. Auf welche Weise meinst du?</p><p>A. Wirst du denn nicht sagen, es sei höchst geziemend für das der Natur nach aus Gott dem Vater entspringende Wort, von oben zu kommen und vom Himmel und Diejenigen lebendig machen zu können, denen es das Leben verleihen will?</p><p>B. Jawohl.</p><p>A. Wie aber? Das Schaffen auf göttliche Weise, sage mir, würdest du wohl zugeben, daß Dieß etwas Menschliches sei?</p><p>B. Ich wenigstens nicht.</p><p>A. Wie also macht er uns lebendig, als Gott, jedoch nicht bloß durch die Theilnahme am heiligen Geiste, sondern indem er auch das angenommene Fleisch als Speise vorsetzt? Er sagt nämlich: „Wahrlich, wahrlich, ich sage euch, wenn ihr das Fleisch des Menschensohnes nicht esset und sein Blut nicht trinket, habt ihr das Leben nicht in euch.“ Als ihn aber die Juden einst höhnten und das höchste Lob ich weiß nicht wie dem seligen Moses zuzutheilen unternahmen und öffentlich sagten: „Unsere Väter haben das Manna in der Wüste gegessen, wie geschrieben steht: Brod vom Himmel gab er ihnen zu essen, was thust du für ein Zeichen, damit wir dir glauben; was wirkest du,“ als Einer, der von oben und vom Himmel den Leib herab gebracht hat? — da sprach er: „Wahrlich, wahrlich, ich sage euch, nicht Moses hat euch das wahre Brod vom Himmel gegeben! Denn das Brod Gottes ist das, welches vom Himmel herabkommt und der Welt das Leben gibt.“ Und darauf wieder, indem er fast auch mit dem Finger auf sich, den Leibhaftigen, zeigte, sprach er: „Ich bin das lebendige Brod, das vom Himmel herabkam. Wenn Jemand von diesem Brod ißt, wird er leben in Ewigkeit. Und das Brod, das ich geben werde, ist mein Fleisch für das Leben der Welt; wer mein Fleisch ißt und mein Blut trinkt, bleibt in mir und ich in ihm. Und wie mich der lebendige Vater gesandt hat, und ich durch den Vater lebe, so wird auch Derjenige, der mich ißt, durch mich leben.“ Gleichwohl, wie wäre es nicht richtig, zu sagen, daß das Fleisch nicht vom Himmel herabkam, sondern aus der Jungfrau war, gemäß den Schriften? Daß aber das Wort nicht trenne, sondern beide in Eins verbinde und gleichsam die Eigenthümlichkeiten der Naturen mit einander mische, ist uns aus sehr vielen Stellen ersichtlich. Denn zu Nikodemus, der das Mysterium nicht verstand und in seiner Unwissenheit ausrief: „Wie ist Das möglich?“ sprach er: „Wenn ich euch Irdisches gesagt habe und ihr nicht glaubet, wie werdet ihr, wenn ich euch Himmlisches sage, glauben? Und Niemand ist in den Himmel hinaufgestiegen, ausser der vom Himmel herab kam, der Sohn Gottes.“ Zu den Juden aber wieder, die an derselben Ungelehrigkeit krankten wie Jener und ihn ich weiß nicht wie verlachen wollten, da er sagte, sein Leib sei Leben gebend und vom Himmel, sprach er: „Das ärgert euch, wenn ihr nun den Sohn des Menschen dahin aufsteigen sehet, wo er früher war?“ Oder werden wir nicht sagen, daß der Emmanuel vom Weibe geboren sei?</p><p>B. Wie denn nicht?</p><p>A. Wo also war er vorher? Oder wie stieg er dahin auf, wo er sagte, daß er sei, obwohl der mit ihm vereinigte Leib aus der heiligen Jungfrau geboren ist? Und werden wir nicht auch gestehen, das irdische Fleisch sei nicht im Stande, lebendig machen zu können, sofern es auf seine eigene Natur ankommt?</p><p>B. Allerdings.</p><p>A. Wie also, sag’ mir, ist das Fleisch lebendig machend? Oder wie soll man auch denken, daß das von der Erde stammende vom Himmel sei?</p><p>B. Durch seine Verbindung, denke ich, mit dem lebendigen und vom Himmel kommenden Worte.</p><p>A. Da denkst du fürwahr das ganz Richtige und mit den heiligen Schriften Übereinstimmende. Er (Christus) ist ja wohl nicht anders auch göttlich schöpferisch, auch wenn man ihn nicht ohne Fleisch denkt. Zum Bestätiger dieser Ansicht werde ich mir wieder den heiligen Paulus machen, der also schreibt: „Dank sagend Gott dem Vater, der uns tüchtig gemacht hat zum Antheil der Heiligen im Lichte, der uns errettet hat aus der Gewalt der Finsterniß und versetzt in das Reich des Sohnes seiner Liebe, in welchem wir haben die Erlösung, die Vergebung der Sünden, welcher des unsichtbaren Gottes Ebenbild ist, der Erstgeborne vor aller Schöpfung. Denn in ihm ist Alles erschaffen worden, was im Himmel und was auf Erden ist, das Sichtbare und das Unsichtbare, seien es Throne oder Herrschaften oder Obrigkeiten oder Gewalten, — Alles ist durch ihn und zu ihm (für ihn) erschaffen, und er ist vor Allem, und Alles besteht in ihm; und er ist das Haupt des Leibes der Kirche, er, der da ist der Anfang, der Erstgeborne aus den Todten, auf daß in Allem er den Vorrang habe; denn es gefiel Gott, daß in ihm alle Fülle wohne, und durch ihn Alles mit ihm zu versöhnen, in Frieden versetzend durch das Blut seines Kreuzes, sowohl was auf Erden als was in den Himmeln ist.“ Siehe, wieder sagt er deutlich, durch ihn sei Alles geschaffen; und: er ist vor Allem, und Alles besteht in ihm; und er sei, sagt er, der Erstgeborne aus den Todten, der durch das Blut seines Kreuzes zufrieden stellte, sowohl was in den Himmeln als was auf Erden ist. Nun, wer denn ist der Erstgeborne aus den Todten ausser Christus Jesus, das heißt das Wort im Fleische und mit dem Fleische? Denn das Wort wird doch wohl nicht als Gott gestorben sein, noch wird man denken, er sei als Mensch gleich uns der Schöpfer von Allem; sondern er schuf als Gott, auch wenn er nicht ohne Fleisch gedacht wird nach der Einigung. Aber auch der Erstgeborne aus den Todten ist er, sofern er Mensch wurde, ohne die Gottheit abzulegen durch die Menschwerdung. Meinst du, hierin Etwas tadeln zu sollen?</p><p>B. Durchaus nicht.</p><p>A. Du kannst aber auch anderswo in denselben Gedanken Diejenigen sich bewegen sehen, die den heiligen Geist hatten. Denn Johannes zum Beispiel sagt: „Im Anfange war das Wort, und das Wort war bei Gott, und Gott war das Wort. Dieses war im Anfange bei Gott. Alles ist durch dasselbe geworden, und ohne es ist Nichts geworden.“ Paulus aber wieder: „Einer ist Gott der Vater, aus dem Alles; Einer der Herr Jesus Christus, durch den Alles.“ Aber wenn je nach der Vereinigung des Wortes mit dem Fleische eine Scheidung und Trennung zur Verschiedenheit, zur gleichsam Zweiheit von Söhnen da war, wie es dir scheint, wie ist dann Alles durch Jesus Christus geschaffen? Allein in Wahrheit ist Alles durch ihn geschaffen. Es ist also offenbar, daß Das, was dem aus dem Vater stammenden Worte von Natur und eigenthümlich innewohnt, ihm bewahrt blieb, auch da es Mensch wurde. Gefährlich also ist es, eine Trennung zu wagen. Denn einer ist der Herr Jesus Christus, und durch ihn hat der Vater Alles geschaffen.</p><p>B. So ist es.</p><p>A. Er ist also auch Schöpfer, auf göttliche Weise, und lebendig machend, als Leben, als Mensch geworden aber hinwieder auch mit den übermenschlichen Eigenschaften zu einem Mittleren verbunden. Denn Mittler ist er zwischen Gott und Menschen, wie die Schrift sagt, da er von Natur Gott ist, und nicht ohne Fleisch, Mensch aber in Wahrheit, und nicht schlechtweg wie wir, sondern indem er blieb, was er war, auch da er Fleisch wurde. Denn es steht geschrieben: „Jesus Christus, gestern und heute Derselbe und in Ewigkeit.“ Oder glauben wir denn nicht, daß der Emmanuel in den letzten Zeiten der Welt von der heiligen Jungfrau geboren sei?</p><p>B. Ja; denn den heiligen Schriften werden wir doch nicht widersprechen.</p><p>A. Das „gestern und heute“ aber, sag’ mir, o Freund, zeigt es uns nicht die gegenwärtige und die bereits vergangene Zeit an?</p><p>B. Ja.</p><p>A. Wie also wird er Derselbe sein mit dem Vorhergegangenen, wenn er gleich die Geburt nach dem Fleische noch nicht angenommen hat?</p><p>B. Weil er das Wort auch im Anfange war, auch sofern er aus dem ewigen und unveränderlichen Gott und Vater entspringt, hat auch er selbst als in eigener Natur die Ewigkeit und Unveränderlichkeit.</p><p>A. Ich lobe deine Meinung; denn es verhält sich so und ganz richtig; indeß dürftest du wohl einem Neugierigen sagen, mein Guter —</p><p>B. Was?</p><p>A. Ist nicht der Name Jesus ein ganz neuer und dem Worte erst in den Zeiten der Menschwerdung zugekommener?</p><p>B. In der That, Das wurde uns durch sehr Vieles ersichtlich.</p><p>A. Verstehe also, daß er von Jesus Christus und nicht schlechthin von dem Worte sagt, er sei gestern und heute Derselbe und in Ewigkeit! Wie aber sollte die menschliche Natur die Unveränderlichkeit und das Verharren in der Gleichheit haben, da sie doch Bewegung (Übergang) hat und vorzugsweise wenigstens die (den) aus dem Nichtsein zum Sein und Leben?</p><p>B. Hat uns also die heilige Schrift das Wahre ver- fehlt und sagt sie von dem gestern Nichtseienden, er sei vorher gewesen?</p><p>A. Ich möchte Das nicht sagen. Es fehlt auch viel daran. Gestern und heute ist Jesus Christus Derselbe und in Ewigkeit. Das Alterthum aber und die Unwandelbarkeit des Wortes werde ich keineswegs läugnen, auch wenn es Fleisch geworden ist; ich werde aber glauben, in der Einigung mit seinem Fleische zeige er sich wieder, als gestern seiend und vorher existirend. Darum verabscheute ihn der irrsinnige Jude und suchte ihn zu steinigen, indem er den Glauben nicht zuließ. Denn er war erstaunt, daß er, der doch als Mensch erschien wie wir, die Ehrwürdigkeit eines übermenschlichen Alters für sich bezeugte, da er als Gott sagte: „Wahrlich, wahrlich, ich sage euch, ehe Abraham wurde, bin ich,“ worauf Jene erwiderten: „Du hast noch nicht fünfzig Jahre und hast den Abraham gesehen?“ Es sprach aber auch Johannes: „Der nach mir kommt, ist mir vorgegangen, weil er vor mir war.“ Indessen wie sagt er, da er doch den Emmanuel als Menschen kennt und benennt, daß der später Geborne und nach ihm Kommende vor ihm und ihm voraus sei?</p><p>B. Er meint, er sei vor ihm und ihm voran an Ehre, wie mir zu denken in den Sinn kommt.</p><p>A. Und daß es in der That falsch und ungereimt sei, so zu denken, wirst du nicht erst nach langen Reden zugeben. Denn wenn wir das „vor“ nehmen für „vorzüglicher an Ehre“, so werden wir auf dieselbe Weise sagen, auch das „nach“ bedeute recht wohl soviel als „nachstehend an Ruhm“.</p><p>B. Es stand uns also bevor, unverständiger Weise zu vermuthen, Christus werde durch den Ruhm des Jo- hannes übertroffen und stehe ihm nach; denn er sagte: Nach mir kommt ein Mann.</p><p>A. O der Ungereimtheit! Wir werden ja glauben, daß es sich nicht so verhalte, wenn wir richtig verstehen, was in den Psalmen geschrieben steht: „Wer in den Wolken wird dem Herrn gleichkommen, und wer wird Gott ähnlich sein unter den Söhnen Gottes?“ Man muß ihm also auch nach der Menschwerdung die Alterswürde beilegen, als Gott von Natur, der sich einigte mit dem Fleische und die Güter der eigenen Natur dem eigenen Fleische mitzutheilen pflegt.</p><p>B. Ganz richtig.</p><p>A. Daß es sich aber so verhalte und man mit Recht so sage, kannst du auch aus anderen Zeugnissen, mein Lieber, wenn du willst, lernen. Denn es sprach Gott irgendwo von dem dem Fleische nach von David stammenden Christus durch einen der heiligen Propheten: „Und du, Bethlehem, Haus Ephrata, bist die geringste, die da ist unter den Tausenden Juda’s; aus dir wird mir hervorgehen, der da sein soll Herrscher in Israel, und seine Ausgänge sind von Anfang seit den Tagen der Ewigkeit“ (Weltzeit). Von den Kindern Israels aber sagt der heilige Paulus: „Alle wurden auf Moses getauft in der Wolke und im Meere, und Alle aßen die geistige Speise und tranken denselben geistigen Trank. Sie tranken nämlich aus dem ihnen folgenden Fels; der Fels aber war Christus.“ Betrachte also in Christus Jesus der heilsordnungsmäßigen Einigung nach die dem Worte eigenthümliche Alterswürde! Oder ist der Ausspruch nicht klar? Denn sehr wohl heißt es, der Bethlehemite, als Mensch und vom Weibe, habe seinen Ausgang vom Anfange der Ewigkeit (Welt). Denn im Anfange war und vor aller Weltzeit das Wort, welches Mensch wurde, und dieses war der Fels, der den durstigen Israel durch die unverhofften und ungeahnten Quellen tränkte, obwohl er dem Fleische und der Menschheit nach in den letzten Zeiten geboren wurde und gesalbt zur Absendung in die Welt von Gott dem Vater. Denn deßwegen, nicht wegen etwas Anderem ist er Christus genannt worden; Christus aber war der Fels, nach Paulus. Wirst du die Sache für zweifelhaft erklären?</p><p>B. Keineswegs.</p><p>A. Es kämpft aber und ringt für diese Ansicht auch der weise Johannes, indem er die Naturen fast sogar verschmilzt und die Kraft der einer jeden von beiden zukömmlichen Eigenheiten zum Zusammenfluß bringt. Denn sieh, was er sagt: „Was von Anfang war, was wir gehört haben, was wir mit unseren Augen gesehen, was wir angeschaut und unsere Hände betastet haben, von dem Worte des Lebens, — und das Leben ist erschienen, und wir haben es gesehen und bezeugen und verkünden euch das ewige Leben, welches beim Vater war und uns erschienen ist.“ Sieh’, der von Anfang Seiende, sagt er, sei sichtbar erschienen und habe sich sogar berühren lassen! Es rief nämlich Thomas: „Mein Herr und mein Gott!“ nachdem er mit dem Finger die Brustseite des Leibes und die Löcher der Nägel untersucht hatte. Aber auch der heilige Lukas sagt uns, die heiligen Apostel seien Augenzeugen und Diener des Wortes gewesen. Denn sichtbar wurde der Unkörperliche und greifbar der Ungreifbare, indem er das irdische Fleisch nicht als ein fremdes Gewand hatte, sondern es sich zum eigenen Tempel machte und mit demselben sich zu erkennen gab als Gott und Herr. Es schreibt aber, wie du weißt, irgendwo der heilige Paulus: „Denn Keiner von uns lebt sich selbst, und Keiner stirbt sich selbst. Sowohl nämlich, wenn wir leben, leben wir dem Herrn, als auch wenn wir sterben, sterben wir dem Herrn. Mögen wir also leben oder mögen wir sterben, so sind wir des Herrn. Denn darum ist Christus gestorben und wieder lebendig geworden, damit er über Todte und Lebendige herrsche.“ Es ziemt sich also, daß in der That über Todte und Lebendige Derjenige herrsche, der aus keinem anderen Grunde als allein deßwegen gestorben und auferstanden ist.</p><p>B. Allerdings.</p><p>A. Wer also, mein Bester, sagen wir, daß den Tod erduldete und wieder auflebte?</p><p>B. Der Sohn, offenbar.</p><p>A. Allerdings der Sohn, da hast du Recht; ich werde ja beistimmen. Ich möchte aber von dir wissen, ob das Wort aus Gott dem Vater sterblich und der Verwesung zugänglich ist oder über Tod und Verwesung erhaben, als Leben.</p><p>B. Das Letztere, sage ich.</p><p>A. Wie war er dann unter den Todten, und zwar als ein Freier, wie die Schrift sagt? Es kann ja doch wohl nicht das Wort an sich sterben?</p><p>B. Weil sein Fleisch starb, so sagt man, er selbst habe Dieses erduldet.</p><p>A. Ganz richtig und korrekt. Also nicht ohne Fleisch, sondern mit demselben und nach demselben hat die Herrlichkeit der Herrschaft Derjenige erlangt, der nach dem Ge- setze des Fleisches und unserer Natur starb und wieder auferstand, indem er als menschliches Leiden das Sterben, als göttliches Werk aber das Wiederaufleben zeigte, damit er durch Beides erkannt würde sowohl als uns ähnlich als zugleich erhaben über uns als Gott von Allem und, nachdem er mit uns geworden, gesehen würde mit dem Vater. So erkannte ihn Nathanael und sprach: „Rabbi, du bist der Sohn Gottes, du bist der König Israels!“ Er selbst aber sagt zu seinen Jüngern: „Ihr nennt mich Herr und Lehrer, und ihr habt Recht; denn ich bin es.“ Durch die That aber Dieses beweisend vergibt er Sünden und verlieh Macht gegen die unreinen Geister, um sie auszutreiben und zu heilen jegliche Krankheit und jegliche Schwäche im Volke. Denn wurden nicht im Namen Jesu Christi, des Nazareners, der an beiden Füßen Lahme gesund gemacht, der an der „schönen Pforte“ saß und schüttelte sie so lange und ganz unheilbare Doppelkrankheit (jener) Äneas ab, zu dem der heilige Paulus sprach: „Äneas, es heilt dich Jesus Christus“?</p><p>B. Ja freilich.</p><p>A. Von allen Seiten also hingetrieben zur Wahrheit, eifrigst bestrebt, den heiligen Schriften nachzuspüren, und den Ansichten der Väter folgend glauben wir, daß der aus der Wurzel Jesse, der aus dem Samen Davids, der aus der Jungfrau dem Fleische nach Geborne, der mit uns unter dem Gesetze war als Mensch und über uns über dem Gesetze als Gott, der für uns und mit uns unter den Todten war, der über uns durch sich Lebensspender und Leben ist, in Wahrheit der Sohn Gottes sei, indem wir weder das Menschliche der Gottheit berauben, noch auch das Wort nach der unaussprechlichen Verbindung der Menschlichkeit entkleiden, sondern einen und den selben Sohn bekennen, der aus zwei Sachen in eine aus beiden bestehende aus unaussprechliche Weise hervorging, durch die höchste Einigung, versteht sich, und nicht durch eine Umwandlung der Natur. Denn welch großer Gewinn den also Glaubenden übrig bleiben wird, erklärt der Jünger Christi, indem er sagt: „Wer da bekennt, daß Jesus der Sohn Gottes ist, — Gott bleibt in ihm und er in Gott.“ Daß aber Jesus Christus, der dem Fleische nach aus David ist, der Natur nach und wahrhaft Sohn Gottes ist, sofern „das Wort Fleisch geworden ist und unter uns gewohnt hat,“ bestätigt der weise Johannes, da er sagt: „Und wir wissen, daß der Sohn Gottes gekommen ist und uns Verstand gegeben hat, den wahren Gott zu erkennen, und wir sind in dem wahren in seinem Sohne Jesus Christus. Dieser ist der wahrhaftige Gott und ewiges Leben,“ und durch ihn und mit ihm sei Gott dem Vater zugleich mit dem heiligen Geiste Ehre in alle Ewigkeit. Amen.</p>
