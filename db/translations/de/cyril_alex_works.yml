    body: |-
      <p><em>Erklärung des nicäischen Glaubensbekenntnisses (Bibliothek der Kirchenväter).</em></p><p><em>Die Erklärung des Nizänischen Glaubensbekenntnisses dürfte um 438 verfaßt worden sein; zu Eingang [c. 5] wird des Konzils zu Ephesus vom Jahre 431 gedacht; gegen Ende [c. 29] wird ein, wie es scheint, nicht mehr erhaltenes Schreiben des Patriarchen Proklus von Konstantinopel, 434—446, angezogen. In der Gesamtausgabe hat diese Erklärung unter den Briefen als Ep. 55 eine Stelle gefunden [Migne 77, 289—320]. Eine neue Rezension bei Schwartz a. a. O. I 1, pars 4,49—61. </em></p><p>Den geliebten und hochgeschätzten Presbytern Anastasius, Alexander, Martinianus, Johannes, Paregorius, dem Diakon Maximus und den übrigen orthodoxen Vätern der Mönche sowie allen, die mit euch ein Mönchsleben führen und im Glauben an Gott feststehen, sagt Cyrillus Gruß im Herrn.</p><p>Auch heute muß ich die Wißbegier und den Eifer eurer Liebe lebhaft anerkennen und allen Ruhmes wert erklären. Denn wer sollte das Interesse für die göttlichen Wissenschaften und das Streben nach richtigem Verständnis der heiligen Glaubenslehren nicht freudig begrüßen? Führt es doch dem ewigen und seligen Leben entgegen und sind diese Mühen ihres Lohnes sicher. Denn unser Herr Jesus Christus sagt einmal zu dem Vater und Gott im Himmel: „Das aber ist das ewige Leben, daß sie dich erkennen, den allein wahren Gott, und den du gesandt hast, Jesus Christus."</p><p>Der rechte und unanfechtbare Glaube, der begleitet ist von dem Glanze guter Werke, bereichert uns ja mit allem Guten und beweist, daß wir ausgezeichnete Herrlichkeit erlangt haben. Entbehrt jedoch die Vortrefflichkeit des Tuns der rechten Lehranschauungen und des untadeligen Glaubens, so kann sie der Seele des Menschen, wie ich glaube, keinerlei Nutzen bringen. Denn wie „der Glaube ohne die Werke tot ist“,so ist, behaupten wir, auch das Umgekehrte wahr. In Verbindung mit dem Ruhme eines guten Lebens soll also auch die Makellosigkeit im Glauben ihre Strahlen aussenden. So erst werden wir allen Anforderungen entsprechen gemäß dem Gesetze des allweisen Moses; „Denn du sollst vollkommen sein”, sagt er, „vor dem Herrn deinem Gott.“Diejenigen aber, welche die Regeln eines lobenswerten Wandels innehalten, aus Unwissenheit jedoch auf den Besitz des rechten Glaubens wenig Gewicht legen, gleichen gewissermaßen den Leuten, die ein ansprechendes Äußere haben, jedoch einen irren und wirren Blick der Augen, so daß auf sie das Wort Anwendung findet, welches Gott durch den Mund des Jeremias an die Mutter der Juden, ich meine an Jerusalem, richtete: „Siehe, deine Augen und dein Herz sind nicht schön.”</p><p>Ihr müßt also vor allem einen gesunden Geist in euch haben und der Heiligen Schrift eingedenk sein, die da spricht und mahnt: „Deine Augen sollen das Rechte schauen.“Einen geraden Blick der im Innern verborgenen Augen haben aber heißt scharf und, soweit es möglich ist, durchdringend die Lehren würdigen können, wie sie etwa über Gott vorgetragen werden. Wir „sehen ja durch einen Spiegel und in rätselhafter Weise und erkennen nur stückweise“,der aber, „der aus der Finsternis Geheimnisvolles entschleiert„,gießt das Licht der Wahrheit denen ein, die recht über ihn unterrichtet sein wollen. Wir müssen uns daher vor Gott niederwerfen und sprechen: „Erleuchte meine Augen, daß ich nicht etwa entschlafe zum Tode!“Denn des rechten Verständnisses der heiligen Glaubenslehren verlustig gehen, würde nichts anderes sein als ein offenbares Entschlafen zum Tode. Wir verlieren aber das rechte Verständnis, wenn wir uns, statt den gotteingegebenen Schriften zu folgen, von tadelnswerten Mutmaßungen leiten oder durch den Anschluß an gewisse Leute, welche einen falschen Weg in Glaubenssachen wandeln, das Urteil unseres Verstandes beeinflussen und damit vor allem unsere Seele zu Schaden kommen lassen.</p><p>Demnach müssen wir auf solche hören, welche dem rechten Sinn des Glaubens nachforschen nach Maßgabe der heiligen Predigt, wie diejenigen sie uns durch den Heiligen Geist überliefert haben, „die von Anfang an Augenzeugen und Diener des Wortes geworden sind„.In ihre Fußtapfen zu treten, befleißigten sich unsere berühmten Väter, die da das ehrwürdige und ökumenische Glaubenssymbol aufgestellt haben, als sie seinerzeit zu Nizäa zusammengetreten waren. Christus selbst war Teilnehmer dieser Versammlung, er, der gesagt hat: „Wo immer zwei oder drei versammelt sind in meinem Namen, da bin ich mitten unter ihnen.“Wie könnte man bezweifeln, daß Christus selbst unsichtbarer Weise Vorsitzender jener heiligen und großen Versammlung war? Mit dem Bekenntnisse des lautern und unverfälschten Glaubens wurde ja für die Menschen auf dem ganzen Erdkreis gleichsam eine Basis und ein unzerstörbares und unerschütterliches Fundament gelegt. Wie soll da Christus fern gewesen sein, da er doch selbst das Fundament ist nach dem Satze des hochweisen Paulus: „Ein anderes Fundament kann niemand legen als das, was schon gelegt ist, nämlich Jesus Christus.„Der von ihnen dargelegte und festgelegte Glaube ist denn auch unverbrüchlich gewahrt worden von den späteren heiligen Vätern und Hirten der Völker und Leuchten der Kirchen und den hervorragendsten Lehrmeistern. Auch finden wir, daß in den Bekenntnissen oder Darlegungen der Väter über den rechten und unverdorbenen Glauben schlechterdings nichts ausgelassen oder übersehen worden ist von allem dem, was dienlich sein kann, sei es zur Überführung oder Widerlegung irgendwelcher Häresie oder gottlosen Frechheit, sei es zur Stärkung und Festigung derer, die den rechten Weg im Glauben wandeln, denen der strahlende Morgenstern aufgegangen und „der Tag angebrochen ist“, nach den Schriften,denen die Gnade der heiligen Taufe das Licht der Wahrheit eingießt.</p><p>Da aber eure Gottesfurcht geschrieben hat, daß gewisse Leute das Symbol zu falschen Deutungen mißbrauchen, weil sie entweder den Sinn seiner Worte nicht recht verstehen oder auch durch Einwirkung der Schriften gewisser Leute sich zu falschen Auffassungen verleiten lassen, und daß auch ich über diese Dinge zu euch reden und euch eine zutreffende Erklärung geben müsse, so habe ich geglaubt, das, was sich mir aufdrängte, in Kürze vortragen zu sollen. Allenthalben jedoch werden wir den Bekenntnissen und Lehren der heiligen Väter folgen, indem wir das von ihnen Gesagte genau und unvoreingenommen zu Rate ziehen. Es hat ja auch schon die heilige Synode, ich meine diejenige, die nach Gottes Willen zu Ephesus versammelt war und gegen die Falsch lehre des Nestorius ihr frommes und zutreffendes Urteil abgab, mit ihm zugleich alle andern, die etwa nach ihm auftreten würden oder auch schon vor ihm aufgetreten sind, wenn sie ebenso wie er zu denken und zu sprechen oder zu schreiben wagen, verurteilt und mit der gleichen Strafe belegt. Es war eben folgerichtig, wenn einmal einer wegen so verruchter Schwätzereien verdammt wurde, nicht nur gegen diesen einen einzuschreiten, sondern gegen ihre Häresie überhaupt oder gegen die Verleumdung, deren sie sich den frommen Glaubenslehren der Kirche gegenüber schuldig gemacht haben, indem sie zwei Söhne predigten und den Unteilbaren auseinanderrissen und gegen Himmel und Erde die Anklage der Menschenanbetung schleuderten. Denn im Vereine mit uns betet die ganze heilige Schar der obern Geister den einen Herrn Jesus Christus an.</p><p>Damit indessen der Inhalt des Symbols, welches in allen heiligen Kirchen Gottes Geltung hat und verkündet worden ist, nicht doch bei einigen unbekannt bleibe, habe ich die Lehren oder Darlegungen der heiligen Väter in die hier vorliegende Erklärung aufgenommen, damit die Leser wissen, in welcher Weise die Darlegung der heiligen Väter oder das lautere Symbol des rechten Glaubens aufzufassen ist. Ich glaube aber annehmen zu dürfen, daß auch das Buch, welches wir über eben diese Dinge verfaßt haben, zur Kenntnis eurer Liebe gekommen ist.Nachdem ich nunmehr, wie gesagt, das Symbol selbst im Wortlaute angeführt, werde ich mich mit Gottes Hilfe den einzelnen Sätzen desselben zuwenden, um sie deutlich zu erklären. Ich weiß ja wohl, daß der allgefeierte Petrus geschrieben hat: „Immer bereit zur Verteidigung gegen jeden, der Rechenschaft von euch fordert über die in euch lebende Hoffnung."</p><p>„Wir glauben an einen Gott, den allmächtigen Vater, Schöpfer aller sichtbaren und unsichtbaren Dinge, und an einen Herrn Jesus Christus, den Sohn Gottes, als Eingeborener gezeugt aus dem Vater, das heißt aus dem Wesen desselben, Gott von Gott, Licht vom Lichte, wahrer Gott vom wahren Gott, gezeugt, nicht gemacht, wesenseins mit dem Vater, durch den alles geworden ist, was im Himmel und was auf Erden ist, der um uns Menschen und um unseres Heiles willen herabgestiegen und Fleisch und Mensch geworden ist, gelitten hat und am dritten Tage auferstanden ist, aufgefahren zu den Himmeln und kommend zu richten die Lebenden und die Toten, und an den Heiligen Geist. Diejenigen aber, die da sagen, es habe eine Zeit gegeben, da der Sohn Gottes nicht war, und er sei nicht gewesen, bevor er gezeugt wurde, und er sei aus nichts geworden oder aus einer andern Substanz oder Wesenheit, oder er sei wandelbar oder veränderlich, diese anathematisiert die apostolische und katholische Kirche."</p><p>Sie erklären, an einen Gott zu glauben, und erschüttern damit gleichsam von Grund aus die Anschauungen der Heiden, die, „während sie prahlten, Weise zu sein, Toren geworden sind und die Herrlichkeit des unvergänglichen Gottes vertauscht haben mit der Gestalt eines Bildes von einem vergänglichen Menschen und von Vögeln und von vierfüßigen und kriechenden Tieren.„Sie „haben das Geschöpf angebetet mit Umgehung des Schöpfers“und den Elementen der Welt gedient und viele, ja unzählige Götter aufgestellt. Zur Zerstörung dieses polytheistischen Irrwahns also sprechen die Väter von einem Gott, ganz und gar den heiligen Schriften folgend und den Menschen auf dem ganzen Erdkreis den Glanz der Wahrheit vorhaltend. Eben dies tat auch der allweise Moses, da er so klar wie möglich sprach: „Höre, Israel, der Herr dein Gott ist e i n Herr.„Und der Urheber und Herrscher des Weltalls selbst spricht: „Du sollst keine andern Götter haben außer mir.“Und ebenso auch durch den Mund der heiligen Propheten: „Ich bin der Erste und ich bin der Spätere, und außer mir gibt es keinen.“Sehr mit Recht haben daher die allberühmten Väter erklärt, an einen Gott zu glauben, um als notwendige Grundlage für den Glauben die Wahrheit festzustellen, daß von Natur aus und in Wahrheit e i n Gott und nur ein Gott ist.</p><p>Sie nennen ihn den allmächtigen Vater, und mit dem Worte „Vater" weisen sie auf den mit ihm existierenden und immer bei ihm seienden Sohn hin, um dessentwillen er Vater ist. Denn er ist nicht erst im Laufe der Zeit Vater geworden, sondern war immer, was er ist, nämlich Vater, erhaben über alles Gewordene und in den höchsten Höhen thronend. Die Gewalt und Herrschaft über das Weltall verleiht ihm eben eine so hell strahlende und unvergleichliche Herrlichkeit.</p><p>Von ihm, sagen die Väter, ist alles erschaffen worden, was in den Himmeln und was auf Erden ist, damit auch daraus der Abstand zwischen ihm und jedwedem Geschöpfe erhelle. Denn es besteht eine unausgleichbare Verschiedenheit zwischen dem Schöpfer und dem Geschöpfe, dem Ungewordenen und dem Gewordenen, zwischen der im Joche gehenden Natur und ihrer Knechtschaft und der in Herrscherhoheit leuchtenden Natur, die göttliche und überweltliche Herrlichkeit besitzt.</p><p>Indem sie sodann des Sohnes gedenken, wollen sie vor allem der Meinung vorbeugen, als ob sie ihm mit dem Worte „Sohn" einen gewöhnlichen Namen zuwiesen, der in gleicher Weise auch uns beigelegt werden könnte — denn auch wir sind Söhne geheißen worden —, und fügen deshalb sehr verständiger Weise Zusätze bei, aus welchen die ihm innewohnende natürliche Erhabenheit über jedwedes Geschöpf zu ersehen ist. Er ist, sagen sie, gezeugt und nicht gemacht, um damit, daß er nicht gemacht ist, hervorzuheben, daß er seinem Wesen nach nicht auf eine Stufe mit dem Geschöpfe gestellt werden darf, und vielmehr zu erklären, daß er vor aller Zeit und auf unbegreifliche Weise aus dem Wesen Gottes und des Vaters hervorgegangen ist. Denn „das Wort war im Anfang“.Des weitern stellen sie ausdrücklich die Vollwertigkeit der Zeugung und Geburt fest — nach Menschenart soll so gesprochen werden aus Nützlichkeitsgründen —, indem sie sagen, daß der Sohn gezeugt ist als Gott von Gott. Denn wo es sich um eine schlechthin wahre Abkunft handelt, ergibt sich sofort die Notwendigkeit, anzunehmen und zu behaupten, daß das Erzeugte dem Wesen des Erzeugers nicht fremd, sondern ihm eigen ist, weil es auch aus ihm ist, freilich in der ihm entsprechenden und geziemenden Weise. Das Unkörperliche zeugt ja nicht nach Art eines Körpers, sondern so, wie Licht vom Lichte gezeugt wird, wobei das aufstrahlende Licht innerhalb des ausstrahlenden Lichtes ist, so daß es auf unaussprechliche und unsagbare Art von ihm ausgeht, aber vermöge der Einigung und der natürlichen Identität in ihm ist. So, behaupten wir, ist der Sohn im Vater und der Vater im Sohn; denn der Sohn stellt in seiner eigenen Natur und Herrlichkeit ein Abbild des Vaters dar. Hat er doch deutlich genug zu einem der heiligen Jünger — es war Philippus — gesagt: „Glaubst du nicht, daß ich im Vater bin und der Vater in mir ist? Wer mich gesehen, hat den Vater gesehen.”„Ich und der Vater sind Eins.“Der Sohn ist also wesenseins mit dem Vater, und deshalb glauben wir, daß er gezeugt ist als wahrer Gott vom wahren Gott. Zwar finden wir das Wort „gezeugt werden” auch von den Geschöpfen gebraucht, wie in dem Ausspruche Gottes über die Israeliten: „Söhne habe ich gezeugt und erhöht.“Aber das Geschöpf erlangt diese Bezeichnung als Gnade, während von dem natürlichen Sohne nichts Derartiges in uneigentlichem Sinne gesagt wird, sondern alles auf Wahrheit beruht, weshalb auch er allein von allen sagt: „Ich bin die Wahrheit.”Es ist also durchaus nicht unwahr, wenn jemand von seiner Zeugung oder von seiner Sohnschaft spricht, denn er ist die Wahrheit. Die allberühmten Väter geben unserm Geiste darüber Ruhe und Sicherheit, indem sie immer wieder vom Vater und Sohn reden und von Zeugung sprechen und zugleich behaupten, daß der Sohn als wahrer Gott vom wahren Gott und als Licht vom Lichte aufgestrahlt ist. Sie bekunden damit, daß die Zeugung unkörperlich und einfach ist und daß der Sohn aus dem Vater und in dem Vater und ein jeder von beiden als eigene Person zu fassen ist. Denn der Vater ist Vater und nicht Sohn, und der Gezeugte ist Sohn und nicht Vater, und trotz der Identität der Natur bleibt ein jeder das, was er im Besondern ist.</p><p>Wenn sie aber den Vater als den Schöpfer aller sichtbaren und unsichtbaren Dinge bezeichnen und beifügen, er habe alles durch den Sohn erschaffen, so wollen sie damit dem Sohne nicht ein geringeres Maß von Herrlichkeit als seinen Anteil zuerkennen. Das zu glauben, wäre sehr verfehlt, denn bei der Identität des Wesens ist ja nicht abzusehen, wie überhaupt von einem Kleinern oder einem Größern die Rede sein könne. Sie wollen nur sagen, daß es Gott und dem Vater von Natur aus eigen ist, nicht anders wirksam zu sein und etwas ins Dasein zu rufen als durch den Sohn im Geiste oder durch seine eigene Macht und Weisheit. Es steht ja geschrieben: „Durch das Wort des Herrn sind die Himmel gefestigt worden und durch den Hauch seines Mundes all ihr Heer.„Der allweise Johannes aber sagt: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort“, und fährt dann notwendig fort: „Alles ist durch ihn geworden, und ohne ihn ist nichts geworden.“</p><p>Nachdem sie nun bezeugt haben, daß der Sohn mit dem Vater wesenseins ist und die gleiche Herrlichkeit und die gleiche Wirksamkeit hat, gedenken sie sachgemäß seiner Menschwerdung und umreißen das Geheimnis der Veranstaltung im Fleische, da sie wohl erkannt haben, daß erst damit die Überlieferung des Glaubens vollständig und lückenlos sein werde. Denn es genügte für die Gläubigen nicht, überzeugt zu sein, daß er als Gott aus Gott dem Vater gezeugt ist, wesenseins mit ihm und „Ebenbild seiner Substanz“;vielmehr mußten sie auch wissen, daß er des Heiles und des Lebens aller wegen sich selbst zur Entäußerung herabgelassen und „Knechtsgestalt angenommen”und als Mensch erschienen ist, dem Fleische nach „geboren aus dem Weibe“.Deshalb sagen sie, daß er um uns Menschen und um unseres Heiles willen herabgestiegen und Fleisch und Mensch geworden ist. Beachte nun die angemessene Ordnung und die treffliche Gliederung, in welcher ihre Rede dahinschreitet! Herabgestiegen ist er, sagen sie, um darauf hinzuweisen, daß er seiner Natur und Herrlichkeit nach über allen Dingen erhaben ist, und zwar um unsertwillen herabgestiegen, weil er, denke ich, willens war, der Verähnlichung mit uns sich zu unterziehen und im Fleische der Welt aufzuleuchten. Denn im Buch der Psalmen steht geschrieben: „Gott wird sichtbar kommen, unser Gott, und er wird nicht schweigen.”Der Ausgangspunkt des Abstiegs kann freilich, wenn man will, auch anders gefaßt werden, zum Beispiel vom Himmel und von oben her oder vom Vater selbst her. Die heiligen Schriften pflegen ja auch die über die Vernunft hinausgehenden Dinge in uns geläufige Worte zu kleiden. So hat der Herr im Gespräche mit den heiligen Jüngern gesagt: „Ich bin vom Vater ausgegangen und in die Welt gekommen, ich verlasse die Welt wieder und gehe zum Vater;“und wiederum: „Ihr seid von unten, ich bin von oben her;”und ein anderes Mal: „Ich bin vom Vater ausgegangen und bin gekommen.“Und der göttliche Johannes schreibt: „Wer von oben her kommt, ist über allen.”Denn da er in den höchsten Höhen thronte und ebenso wie sein Vater dem Wesen nach über allen Dingen erhaben war, weil durch die Identität der Natur mit dem Vater ausgezeichnet, so „hat er es nicht für Raub gehalten, Gott gleich zu sein; aber er entäußerte sich selbst, indem er Knechtsgestalt annahm, den Menschen ähnlich geworden und im Äußern als ein Mensch erfunden; er erniedrigte sich selbst."Wie nun das Wort Gott war, so ist es auch, als es sich mit unserm Fleische umkleidete, Gott geblieben, und deshalb sagt der hochheilige Paulus, es sei den Menschen ähnlich und im Äußern als ein Mensch erfunden worden. Denn es war, wie gesagt, Gott in unserer Hülle, und es hat nicht, wie einige Häretiker glauben zu sollen gemeint haben, unbeseeltes Fleisch angenommen, sondern vielmehr mit einer vernünftigen Seele beseeltes Fleisch. Es ist also eben das aus dem Wesen des Vaters hervorgegangene Wort, der eingeborene Sohn, wahrer Gott vom wahren Gott und Licht vom Lichte, der, durch den alles geworden ist; er, sagen die Väter, ist herabgestiegen und Fleisch und Mensch geworden, das heißt, er hat sich dem Fleische nach der Geburt aus dem Weibe unterzogen und ist in unserer Hülle erschienen. Denn das heißt Mensch werden.</p><p>Einer ist demnach der Herr Jesus Christus, das eingeborene Wort des Vaters selbst, das Fleisch geworden, ohne aufzuhören zu sein, was es war. Es ist auch in der Menschheit Gott geblieben und in der Knechtsgestalt Herrscher und in unserer Entäußerung voll der Gottheit und in der Schwäche des Fleisches Herr der Mächte und im Stande der Menschheit über alle Schöpfung erhaben. Denn was er vor der Fleischwerdung hatte, das behält er unverlierbar; er war ja Gott und wahrer Sohn, Eingeborener und Licht, Leben und Macht; und was er nicht war, hat er des Heilsratschlusses wegen angenommen, indem er die Eigentümlichkeiten des Fleisches sich selbst zu eigen machte. Das in unaussprechlicher und unsagbarer Weise ihm geeinte Fleisch war ja nicht das Fleisch eines andern, sondern sein eigenes Fleisch. So sagt auch der weise Johannes, daß „das Wort Fleisch geworden“.Er ist aber nicht so Fleisch geworden, wie wenn er durch irgendwelche Umgestaltung oder Wandlung oder Veränderung in die Natur des Fleisches übergegangen wäre, und auch nicht so, wie wenn er sich irgendeiner Vermengung oder Vermischung oder, wie einige schwatzen, Wesensvereinigung [Synusiosis] unterzogen hätte. Denn das ist unmöglich, weil er seiner Natur nach unwandelbar und unveränderlich ist. Vielmehr hat er, wie gesagt, mit vernünftiger Seele beseeltes Fleisch aus dem jungfräulichen und unbefleckten Leibe angenommen und sich zu eigen gemacht. Die gotteingegebene Schrift pflegt ja nicht selten mit dem Worte „Fleisch” allein den ganzen Menschen zu bezeichnen. Wenn es heißt: „Ich gieße von meinem Geiste aus über alles Fleisch",so hat Gott damit nicht dem Fleische, welches nicht mit einer vernünftigen Seele beseelt ist, sondern den aus Seele und Leib bestehenden Menschen seinen Geist einzugießen verheißen.</p><p>Das Wort hat also nicht aufgehört zu sein, was es war, da es Mensch wurde, sondern ist auch, als es in unserer Hülle erschien, Wort geblieben. Und Christus ist nicht zuerst Mensch gewesen und später Gott geworden, sondern das Wort war Gott und wurde dann Mensch, damit es in einer und derselben Person Gott und Mensch zugleich sei. Diejenigen aber, welche ihn in zwei Söhne zerteilen und nun zu behaupten wagen, Gott das Wort habe den aus dem Samen Davids geborenen Menschen mit sich verbunden und seiner Würde und Ehre und der Auszeichnung der Sohnschaft teilhaft gemacht und ihn in den Stand gesetzt, das Kreuz zu erdulden und zu sterben und wieder aufzuleben und gen Himmel zu fahren und sich zur Rechten des Vaters zu setzen, um seiner Beziehung zu Gott wegen von der ganzen Schöpfung die Ehren der Anbetung zu empfangen, diese Leute predigen erstens zwei Söhne und verkehren sodann den Inhalt des Geheimnisses törichterweise in sein Gegenteil. Denn Christus ist, wie gesagt, nicht aus einem Menschen Gott geworden, sondern das Wort ist, da es Gott war, Fleisch, das heißt Mensch geworden. Es wird aber gelehrt, daß er sich entäußert hat, weil er vor der Entäußerung die ganze Fülle dessen besaß, was ihm zukommt, insofern er Gott ist. Er ist eben nicht aus der Leere aufgestiegen zur Fülle; er hat sich vielmehr aus göttlichen Höhen und unaussprechlicher Herrlichkeit selbst erniedrigt, nicht aber ist er als niedriger Mensch zur Höhe erhoben und mit Herrlichkeit gekrönt worden. Ein Freier hat Knechtsgestalt angenommen, nicht ein Knecht die Herrlichkeit der Freiheit erlangt. Der, der in der Gestalt des Vaters und ihm gleich war, ist den Menschen ähnlich geworden, nicht ein Mensch durch Teilnahme Gott ähnlich geworden.</p><p>Warum also verkehren sie die Lehre von der Menschwerdung und verfälschen die Wahrheit, im Widerspruch zu allen gotteingegebenen Schriften, welche auch den menschgewordenen Sohn Gott nennen und ihn allenthalben als Einen bezeichnen? Moses hat in dem Buche von der Erschaffung der Welt geschildert, wie der göttliche Jakob seine Knechte über den Fluß Jabok schickte und allein zurückblieb.Dann rang ein Mann mit ihm bis zum Anbruch des Morgens, und den Namen jenes Ortes nannte Jakob Gottesschau, indem er sprach: „Ich habe Gott geschaut von Angesicht zu Angesicht, und meine Seele ist gerettet worden." Er sah aber die Sonne aufgehen, als das Gesicht Gottes vorübergegangen war, doch hinkte Jakob an seiner Hüfte. Damit deutete Gott dem Patriarchen im voraus an, daß sein eingeborenes Wort zur Zeit Mensch werden und Israel zum Widersacher haben würde, und daß sie ihm gegenüber nicht geraden Weges wandeln, sondern gleichsam lahm sein würden, wie er selbst durch den Mund des Psalmensängers sagt: „Fremde Söhne haben mir vorgelogen, fremde Söhne sind altersschwach geworden und hinkend abgewichen von ihren Wegen.“Das, glaube ich, wurde vorgebildet durch das Hinken Jakobs an seiner Hüfte. Beachte aber folgendes: Ein Mann ringt mit ihm, und er sagt, er habe Gott geschaut von Angesicht zu Angesicht, und nennt ihn Gottesschau. Denn das Wort Gottes ist, auch da es Mensch geworden, in der Gestalt des Vaters verblieben, ich meine dem geistigen Bilde und der vollständig unveränderten Natur nach. Hat er ja auch Philippus gegenüber sich selbst, und zwar da er im Fleische war, für „das Ebenbild des Wesens des Vaters.“erklärt und gesagt: „Wer mich gesehen, hat den Vater gesehen.”</p><p>Und als er einen Blindgeborenen geheilt hatte und ihn im Tempel traf, fragte er: „Glaubst du an den Sohn Gottes?“, und als jener antwortete: „Wer ist es, Herr, daß ich an ihn glaube?”, erwiderte er: „Du hast ihn gesehen, und der, der mit dir spricht, der ist es."Gesehen hatte ihn der Blinde nicht in nacktem oder fleischlosem Zustande, sondern in unserer Hülle; und geglaubt hat er an den, den er gesehen, nicht als an einen Sohn, der mit einem andern Sohne verbunden war, sondern als den einen natürlichen und wahren Sohn, der den Erdenbewohnern nicht ohne Fleisch aufgeleuchtet war.</p><p>Der göttliche Moses aber sagt in seinen Segenssprüchen: „Gebet Levi seine Offenbarung und seine Wahrheit, dem frommen Manne, den man versucht hat bei der Versuchung, geschmäht hat bei dem Wasser der Empörung, der dem Vater und der Mutter sagte: Ich habe nicht auf dich gesehen, — und seine Brüder nicht anerkannte."Es hatte nämlich der Gott des Weltalls für Aaron ein Gewand aus vielfarbigem Gewebe angeordnet, ein Gewand, welches nur dem Hohenpriestertum zustand und ihm ausschließlich vorbehalten war. An der Brust des Hohenpriesters hingen Steine, im ganzen zwölf, und in ihrer Mitte waren Offenbarung und Wahrheit angebracht, dazu noch zwei andere Steine.In geheimnisvoller Weise sollte dadurch der Chor der heiligen Apostel dargestellt werden, wie er im Kreise den Emmanuel umsteht, der die Offenbarung und Wahrheit ist; denn er hat uns die Wahrheit geoffenbart und dem Gottesdienste in Schatten und Vorbildern ein Ende gemacht.</p><p>Daß aber das eingeborene Wort Gottes unser Hoherpriester geworden ist, da es Mensch wurde, wie könnte das bezweifelt werden? Hat ja doch der göttliche Paulus geschrieben: „Achtet wohl auf den Apostel und Hohenpriester unseres Bekenntnisses, Jesus, der treu ist dem, der ihn bestellt hat!“Dem Stande der Menschheit ist die Würde des Priestertums jedenfalls angemessen; zu gering, als daß sie mit der Natur und Herrlichkeit Gottes des Wortes vereinbar wäre, ist sie der Menschwerdung im Fleische durchaus entsprechend. Und alles Menschliche ist ihm zu eigen geworden. „Gebet”, sagt also Moses, „Levi“, das heißt dem Priester, „die Offenbarung und die Wahrheit!” Von welcher Art dieser Levi oder Priester ist, erklärt er dann durch den Zusatz „dem frommen Manne“. Unser Herr Jesus Christus hat eben „keine Sünde getan”,weshalb Paulus von ihm schreibt: „Ein solcher Hoherpriester geziemte uns, fromm, unschuldig, unbefleckt, gesondert von den Sündern und höher geworden als die Himmel.“Ihn hat man versucht bei der Versuchung, hat man geschmäht bei dem Wasser der Empörung. O des Wunders! Einen Mann nennt er ihn, bezeichnet ihn aber sofort als den Gott, den Israel gereizt und versucht hat in der Wüste und bei dem Wasser der Empörung. Der Psalmensänger bestätigt es, indem er berichtet: „Er spaltete den Felsen in der Wüste und tränkte sie wie mit reicher Flut. Er brachte Wasser aus dem Felsen hervor und ließ Wasser gleich Strömen niederfließen.“Und was dann? „Und sie versuchten”, heißt es, „ihn in ihren Herzen und redeten Böses wider Gott und sprachen: Kann etwa Gott einen Tisch decken in der Wüste? Er schlug den Felsen, und Wasser rannen, und Ströme brachen hervor; kann er etwa auch Brot geben oder einen Tisch decken seinem Volke?" Verstehe also, wie sie den wundertätigen Gott, den Moses einen Mann nannte, geschmäht haben! So hat auch der göttliche Paulus den Bericht verstanden, da er schreibt: „Sie tranken nämlich aus dem begleitenden geistigen Felsen, der Fels aber war Christus.“Christus also war der geschmähte Mann, der, da er noch nicht Fleisch geworden war, von den Israeliten versucht wurde.</p><p>Denn daß der vor der Fleischwerdung existierende Sohn nicht, wie einige zu behaupten wagen, ein anderer als der aus dem Samen Davids geborene Mensch, sondern einer und derselbe mit diesem war, vor der Fleischwerdung noch nacktes Wort, nach der Geburt aus der heiligen Jungfrau Fleisch und Mensch geworden, wie die göttlichen Vater geschrieben haben, das hat Moses hinwieder durch ein anderes Kennzeichen außer Zweifel gestellt. Wie wenn jemand fragen würde und zu wissen wünschte, wer der Mann sei, der von den Israeliten. versucht und geschmäht worden, streckt er gewissermaßen die Hand aus und weist mit dem Finger auf Jesus hin, indem er spricht: „Der, der zu Vater und Mutter sagte: Ich habe nicht auf dich gesehen, — und seine Brüder nicht anerkannte." Wir erinnern uns, daß einer der heiligen Evangelisten geschildert hat, wie Christus lehrte und einige Leute in die Geheimnisse einführte und nun seine Mutter und seine Brüder herbeikamen und einer von den Jüngern zu ihm lief und sagte: „Siehe, deine Mutter und deine Brüder stehen draußen und wollen dich sehen.“Da streckte er seine Hand gegen die Jünger aus und sprach: „Meine Mutter und meine Brüder sind die, die das Wort Gottes hören und tun. Denn wer immer den Willen meines Vaters tut, der im Himmel ist, der ist mir Bruder und Schwester und Mutter.” Das ist es, glaube ich, was Moses gemeint hat, als er sagte: „Der zu Vater und Mutter sagte: ich habe nicht auf dich gesehen, — und seine Brüder nicht anerkannte."</p><p>Aber auch der allweise Daniel bezeugt, daß er das eingeborene Wort Gottes in unserer Hülle geschaut hat. Denn er erzählt, er habe einen Alten an Tagen gesehen, der auf einem Throne saß, während zehntausendmal Hunderttausende ihn umstanden und tausendmal Tausende ihm dienten; und nachdem er noch einiges beigefügt hat, fährt er fort: „Ich schaute in dem Gesichte der Nacht, und siehe, mit den Wolken des Himmels kam einer wie ein Menschensohn, und er gelangte bis zu dem Alten an Tagen und ward vor ihn gebracht, und es wurde ihm die Ehre und das Königtum verliehen, und alle Stämme und Zungen werden ihm dienen.“— Siehe, er hat wiederum klar und deutlich den Emmanuel zu dem Vater und Gott in den Himmel aufsteigen sehen; denn „eine Wolke hat ihn entrückt”.Er nennt ihn auch nicht einfach einen Menschen, sondern einen wie ein Menschensohn; denn das Wort war uns ähnlich gewordener Gott. In diesem Sinne sagt auch der allweise Paulus, er sei den Menschen ähnlich geworden und im Äußern als Mensch erfunden worden,und er sei in Fleisch wie Sündenfleisch den Erdenbewohnern erschienen.Wäre er jedoch ein Mensch, der seiner Verbundenheit mit Gott wegen wie Gott geehrt wird, so würde der Prophet gesagt haben, er habe einen wie Gott oder einen wie den Sohn Gottes mit den Wolken kommen sehen. Das hat er aber nicht gesagt, sondern vielmehr: einen wie ein Menschensohn. Er wußte also, daß der Sohn Gott war und Mensch geworden oder nach dem Ausdruck des Paulus den Menschen ähnlich geworden war. Wiewohl er indessen im Fleische erschienen war, „gelangte er bis zu dem Alten an Tagen“, das heißt: stieg er hinauf zu dem Throne des ewigen Vaters, „und es wurde ihm die Ehre und das Königtum verliehen, und alle Stämme und Zungen werden ihm dienen.” Das also war es, was er in die Bitte kleidete: „Vater, verherrliche mich mit der Herrlichkeit, die ich hatte, bevor die Welt war, bei dir."</p><p>Daß aber das fleischgewordene Wort Gottes Throngenosse und auch im Fleische an Hoheit Gott und dem Vater gleich ist, weil es e i n Sohn ist, auch nachdem es Mensch geworden, das bezeugt unzweideutig der allweise Paulus, indem er schreibt: „Wir haben einen solchen Hohenpriester, der sich zur Rechten des Thrones der Majestät in der Höhe gesetzt hat.“Ja, auch unser Herr Jesus Christus selbst hat auf die Frage der Juden, ob er in Wahrheit der Christus sei, geantwortet: „Wenn ich es euch sage, so werdet ihr es nicht glauben, und wenn ich frage, so werdet ihr nicht antworten; von nun an aber wird der Menschensohn zur Rechten der Macht Gottes sitzen.“Der Chor der heiligen Propheten also schaute auch den menschgewordenen Sohn auf den Thronsesseln der Gottheit.</p><p>Sehen wir aber auch, was die Herolde des Neuen Bundes zu künden haben, die Lehrmeister des Erdkreises, zu denen Christus selbst gesagt hat: „Nicht ihr seid es, die da reden, sondern der Geist eures Vaters, der in euch redet.“Der göttliche Täufer also, finden wir, spricht: „Nach mir kommt ein Mann, welcher vor mir auf getreten ist, weil er früher war als ich.”Wie kann nun aber der, der nach ihm kam, früher gewesen sein als er? Denn daß Christus der Zeit des Fleisches nach später war als Johannes, wird doch wohl niemandem unbekannt sein. Wer wird das also aufhellen wollen? Gelöst hat uns das Rätsel der Heiland selbst, indem er zu den Juden sagte: „Wahrlich, ich sage euch, ehe Abraham ward, bin ich.“Er war nämlich vor Abraham seiner Gottheit nach, ist aber nach ihm, insofern er als Mensch erschienen ist. Wenn ferner Gott und der Vater nachdrücklich erklärt: „Ich gebe meine Herrlichkeit keinem andern”— denn es ist kein anderer Gott außer ihm —, so hat Christus zu uns gesagt: „Wenn aber der Menschensohn kommen wird in der Herrlichkeit seines Vaters mit den heiligen Engeln.“Daß wir aber die Herabkunft des Menschensohnes von den Himmeln zu erwarten haben, bezeugt wieder der allweise Paulus, der schreibt: „Denn die heilbringende Gnade Gottes ist allen Menschen erschienen, auf daß sie, der Gottlosigkeit und den weltlichen Begierden entsagend, nüchtern und gerecht und fromm und gottgefällig in dieser Welt leben, wartend auf die selige Hoffnung und das Erscheinen der Herrlichkeit unseres großen Gottes und Heilandes Jesus Christus.”Und anderswo hat er von den Israeliten gesagt: „Ihrer sind die Verheißungen und die Gesetzgebung und der Bundesvertrag, und aus ihnen ist dem Fleische nach Christus, der da über alles Gott ist, gepriesen in alle Ewigkeit. Amen."</p><p>So behaupten wir denn, unverbrüchlich in den Spuren des Bekenntnisses der Väter wandelnd, daß der aus Gott dem Vater gezeugte eingeborene Sohn selbst Fleisch und Mensch geworden, gelitten hat und gestorben und am dritten Tage von den Toten auferstanden ist. Freilich ist das Wort Gottes, soweit es auf seine eigene Natur ankommt, anerkanntermaßen leidensunfähig; und niemand wird so töricht sein, zu meinen, daß die über alles erhabene Natur einem Leiden zugänglich sein könne. Allein er ist Mensch geworden, indem er das Fleisch aus der heiligen Jungfrau sich zu eigen machte; und im Hinblick auf die Menschwerdung lehren wir deshalb, daß er, als Gott allem Leiden entrückt, als Mensch in seinem Fleische gelitten hat. Ist er, da er Gott war, Mensch geworden, ohne etwas von der Gottheit aufzugeben, ist er ein Teil der Schöpfung geworden, aber über die Schöpfung erhaben geblieben, ist er, als Gott Gesetzgeber, dem Gesetze Untertan geworden, aber doch noch Gesetzgeber gewesen, hat er, als Gott Herrscher, Knechtsgestalt angelegt, aber die Herrscherwürde unverlierbar beibehalten, ist er, da er Eingeborener war, „Erstgeborener unter vielen Brüdern“geworden, aber doch Eingeborener geblieben —, was Wunder, wenn er als Mensch im Fleische gelitten hat, aber auch so als Gott leidensunfähig gewesen ist!</p><p>Der allweise Paulus sagt denn auch, daß eben das Wort, das in der Gestalt Gottes und des Vaters und ihm gleich war, gehorsam geworden ist sogar bis zum Tode, ja bis zum Tode am Kreuze.Und in einem andern seiner Briefe schreibt er von ihm: „Der da das Ebenbild des unsichtbaren Gottes ist, der Erstgeborene vor jeglichem Geschöpfe; denn in ihm ist alles erschaffen worden, was im Himmel und was auf Erden istf und er ist vor allem, und in ihm hat alles Bestand; und er“, heißt es, „ist der Kirche zum Haupt gegeben, und er ist der Erstling der Entschlafenen geworden und der Erstgeborene aus den Toten.“Gewiß ist das aus Gott und dem Vater stammende Wort Leben und Lebensspender, weil aus dem Leben dessen entsprossen, der ihn gezeugt hat. Wie kann er dann aber, darf man fragen, der Erstgeborene aus den Toten und der Erstling der Entschlafenen geworden sein? Da er das dem Tode zugängliche Fleisch sich zu eigen gemacht hatte, hat er „durch die Gnade Gottes”, wie der allweise Paulus sagt, „für einen jeden den Tod gekostet",weil er im Fleische leiden konnte, ohne daß er aufhörte, Leben zu sein. Wenngleich es also heißt, daß er im Fleische gelitten hat, so empfindet er das Leiden doch nicht in der Natur der Gottheit, sondern, wie ich eben sagte, in seinem dem Leiden zugänglichen Fleische.</p><p>Hat ja auch der selige Prophet Isaias, der wohl wußte, daß es der menschgewordene Gott war, welcher im Fleische litt, von ihm gesagt: „Wie ein Schaf ward er zur Schlachtung geführt, und wie ein unschuldiges Lamm, welches vor seinem Scherer verstummt, öffnet er nicht seinen Mund. In seiner Erniedrigung ward sein Gericht hinweggerafft. Wer soll sein Geschlecht erzählen? Denn sein Leben wird hinweggenommen von der Erde.“Wäre er irgendein Mensch und würde nur wegen seiner Verbundenheit mit Gott als Sohn besonders ausgezeichnet, wie die Urheber der gottlosen Lehren behaupten, wie sollte es noch schwer sein, jemanden zu finden, der sein Geschlecht erzählen kann? Er ist ja geboren aus dem Samen Jesses und Davids. Aber das Geschlecht Gottes des Wortes oder die Art und Weise seiner Geburt, wer wird sie erklären können? „Denn sein Leben wird hinweggenommen von der Erde”, das heißt sein Dasein, denn unter dem „Leben" ist das Dasein zu verstehen. Er wird in die Höhe entrückt und überragt nun die Erdenbewohner. Denn das Wesen der unaussprechlichen Natur ist menschlichem Verstände unerreichbar und völlig unnahbar.</p><p>Dem Gesagten möchte ich noch beifügen, daß „ein Herr ist, ein Glaube, eine Taufe“, wie der hochheilige Paulus sagt.Wenn nun ein Herr ist, ein Glaube und eine Taufe, wer ist der Herr, und an wen haben wir geglaubt, und auf wen sind wir getauft worden? Es spricht doch alles dafür, daß das aus Gott dem Vater entsprungene Wort es ist, dem die Herrschaft gebührt, dem unser Glaube gilt, und auf den auch die heilbringende Taufe vollzogen wird. Er hat ja den heiligen Aposteln den Auftrag gegeben: „Gehet hin und lehret alle Völker und taufet sie auf den Namen des Vaters und des Sohnes und des Heiligen Geistes.”Der göttliche Paulus aber spricht sich über die Herrlichkeit der Herrschaft sowohl wie das Bekenntnis des Glaubens und auch die Wirksamkeit der Taufe unzweideutig aus, indem er schreibt: „Sag’ nicht in deinem Herzen: Wer wird hinaufsteigen in den Himmel, um nämlich Christus herabzuholen? Oder wer wird hinabsteigen in die Unterwelt, um nämlich Christus von den Toten heraufzuholen? Sondern was sagt die Schrift? Nahe bei dir ist das Wort, in deinem Munde und in deinem Herzen. Denn wenn du sagst: Herr Jesus, und mit deinem Herzen glaubst, daß Gott ihn von den Toten auferweckt hat, so wirst du gerettet werden.“Und wiederum: „Wißt ihr nicht, daß wir alle, die wir auf Christus Jesus getauft wurden, auf seinen Tod getauft wurden?”Siehe, deutlich nimmt er die Herrlichkeit der Herrschaft sowohl wie das Bekenntnis des Glaubens und auch die Gnade der heiligen Taufe wohlweislich für den in Anspruch, der den Tod erlitten hat und von den Toten auferweckt worden ist.</p><p>Sollen wir nun an zwei Söhne glauben? Sollen wir das aus Gott dem Vater aufgestrahlte Wort beiseite schieben und die Herrlichkeit der Herrschaft und auch das Bekenntnis des Glaubens sowie die himmlische Taufe einem andern Sohne, der angeblich gelitten hat, zuweisen? So zu denken oder zu sprechen, wäre doch töricht und überdies auch unzweifelhaft gottlos. Was werden wir also sagen? Es ist in Wahrheit ein Herr, ein Glaube, eine Taufe. Denn es ist ein Sohn und Herr, nicht ein Wort, welches einen Menschen in Weise der Verbundenheit angenommen und zum Teilhaber seiner Würden gemacht und zum Sohne und Herrn erhoben hätte, wie einige Schwätzer behaupten und geschrieben haben, sondern der aus Gott entstammte Gott das Wort, das Licht vom Lichte, welches in eigener Person Mensch und Fleisch geworden ist. Auf seinen Tod sind wir getauft worden, indem er als Mensch in seinem Fleische für uns gelitten hat, während er als Gott leidensunfähig verblieben ist und immerdar lebt; denn er ist Leben aus dem Leben Gottes und des Vaters. So ist der Tod besiegt worden, da er es wagte, den Leib des Lebens anzugreifen; so wird auch in uns die Vergänglichkeit abgetan und die Gewalt des Todes gebrochen; daher sprach Christus: „Wahrlich, ich sage euch, wenn ihr nicht das Fleisch des Menschensohnes eßt und sein Blut trinkt, so habt ihr das Leben nicht in euch."Denn der heilige Leib und das Blut Christi ist lebenspendend. Es ist eben, wie gesagt, nicht der Leib eines Menschen, welcher an dem Leben teilhatte, sondern der eigene Leib dessen, der von Natur aus Leben ist, nämlich des Eingeborenen.</p><p>So denkt mit uns der christusliebende Chor der heiligen Väter, unter ihnen auch derjenige, welcher zur Zeit den Stuhl der heiligen Kirche zu Konstantinopel ziert, unser frömmster und gottesfürchtigster Bruder und Mitbischof Proklus. Er hat an die gottesfürchtigsten Bischöfe des Morgenlandes wörtlich wie folgt geschrieben: „Und der Körperlose wird ohne Verwandlung Fleisch, und der Anfanglose wird dem Fleische nach geboren, und der von Natur aus schlechthin Vollkommene macht dem Leibe nach an Alter Fortschritte, und der über Leiden Erhabene erduldet Leiden, nicht in dem, was er war, den Gewalttaten unterliegend, aber in dem, was er geworden ist, den Leiden des Leibes unterworfen."— Damit wird also der Falschglaube der Leute, die anders, als vorhin gesagt, denken oder geschrieben haben, überführt, allenthalben an Verruchtheit zu kranken und den Lehren der Wahrheit zu widerstreiten.</p><p>Nachdem die dreimalseligen Väter die Lehre über Christus abgeschlossen haben, gedenken sie des Heiligen Geistes. Auch an ihn erklären sie zu glauben gleichwie an den Vater und den Sohn. Denn er ist wesenseins mit ihnen und entspringt oder geht aus wie aus einer Quelle aus Gott und dem Vater und wird der Schöpfung verliehen durch den Sohn. Dieser hauchte ja die heiligen Apostel an und sprach: „Empfanget den Heiligen Geist!"Der Geist ist also aus Gott und ist Gott und dem allerhöchsten Wesen nicht fremd, sondern aus ihm und in ihm und ihm eigen.</p><p>Das also ist der durchaus zutreffende und gänzlich irrtumslose Glaube oder das Glaubensbekenntnis der heiligen Väter. Aber, wie Paulus sagt: „Der Gott dieser Welt hat den Geist der Ungläubigen verblendet, daß sie nicht sehen das Leuchten des Evangeliums von der Herrlichkeit Christi.“So haben daher manche den geraden Weg der Wahrheit nicht gehen wollen und stoßen nun auf Felsen, „ohne zu verstehen, was sie reden, noch worüber sie Behauptungen aufstellen”.Indem sie nämlich die Herrlichkeit der Sohnschaft nur dem aus Gott entsprungenen Worte vorbehalten, behaupten sie, der aus dem Samen Jesses und Davids Geborene sei mit ihm als ein anderer Sohn verbunden worden und habe nur teil an der Sohnschaft und der göttlichen Ehre und der Einwohnung des Wortes und habe überhaupt alles von ihm erhalten, während er nichts Eigenes besitze. Solche Leute, denke ich, sind es, von denen die Jünger des Heilandes geschrieben haben: „Es haben sich nämlich gewisse Menschen eingeschlichen, die längst vorherbezeichnet sind zu diesem Strafgerichte, Gottlose, welche die Gnade Gottes verkehren zu Zügellosigkeit und Jesum Christum, unsern alleinigen Herrscher und Herrn, leugnen.“Jesus Christus wird mit Recht das in menschlicher Gestalt erschienene Wort genannt. Denn die Gegner, welche aus übergroßem Unverstände sich nicht scheuen, so wie Nestorius und Theodorzu denken und zu sprechen, sollen antworten auf den Vorwurf: Ihr sprecht dem aus der heiligen Jungfrau Geborenen die Gottheit und die wahre Sohnschaft Gottes und des Vaters ab, indem ihr ihm lediglich das Leiden zuweist und ihn von Gott dem Worte trennt, um nicht von einem leidenden Gott sprechen zu müssen. Denn das sind die Erfindungen ihrer verstiegenen Spitzfindigkeit — abscheuliche Gedanken. Es würde also das aus Gott dem Vater entstammte Wort für sich allein auch nicht mehr Christus genannt werden dürfen. Denn wie ihm bei der Annahme, daß er nicht im Fleische sei, das Leiden nicht zugeeignet werden kann, so ist auch das Gesalbtwerden etwas, was ihm fern liegt und durchaus fremd ist. „Jesum von Nazareth hat Gott gesalbt mit dem Heiligen Geiste.”Das Wort Gottes aber ist aus sich schlechthin vollkommen und hat einer Salbung durch den Heiligen Geist nicht bedurft. Leugnet also die Menschwerdung, stellt die Liebe des Eingeborenen zu der Welt in Abrede, nennt ihn eurerseits nicht Christus. Oder war es nicht seiner unwürdig, in unsern Verhältnissen geboren zu werden? Weil also auch dies sich für ihn nicht schickte, so soll keiner bekennen, daß Gott Mensch geworden ist, damit Christus auch zu ihnen sage: „Ihr irrt, weil ihr weder die Schriften kennt noch die Macht Gottes."Wir werden also diejenigen, die so haben denken wollen, als Feinde der Wahrheit ansehen und ihre verderbenbringenden Schwätzereien fliehen und vielmehr den Lehren der heiligen Väter folgen und der Überlieferung der heiligen Apostel und Evangelisten. Denn das menschgewordene Wort selbst war es, das in ihnen redete,das Wort, durch welches und mit welchem Gott und dem Vater Ehre, Herrlichkeit und Herrschaft ist, mitsamt dem Heiligen Geiste, jetzt und immer und in alle Ewigkeiten! Amen.</p>
