      <p><em>Über den rechten Glauben an den Kaiser (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Ihr, christusliebende Kaiser, habt den erhabensten und alle andern Würden in unvergleichlichem Abstände übertreffenden und überragenden Gipfelpunkt menschlicher Ehre inne, und euch ist als ausgezeichnetes und einzigartiges Los von seiten Gottes die seiner eigenen Herrschaft über alle Dinge entsprechende Hoheit auf Erden verliehen worden. Denn Gott beugt sich jedes Knie,und Throne und Fürstentümer, Herrschaften und Gewalten neigen unterwürfig ihren Nackenund bringen ununterbrochen die geziemenden Lobpreisungen dar, indem sie sprechen: Himmel und Erde sind voll seiner Herrlichkeit.Und bei eurer Majestät Huld sieht man das augenfällige und hervorstechende Abbild dieser so gewaltigen und alles übersteigenden Größe. Denn ihr seid der Quell aller höheren Posten und selbst keinem Obern unterstellt und der Ursprung und Ausgang des Glückes der Menschheit. Die dem Zepter eurer Herrschaft unterstehenden Völker werden durch die milden Winke eurer Regierung für einen gerechten und ehrbaren und glücklichen Lebenswandel gewonnen; diejenigen aber, die das Joch nicht tragen wollen, sinken schnell zu Boden, niedergestreckt von der euch zur Verfügung stehenden Gewalt. Wenn nur der Schild des Kaisers aufblitzt, weichen ihre Scharen zurück und geben sich verloren, lassen alsbald ihren Unverstand fahren, fallen in die Knie und bitten um Verzeihung, Haben doch die kampfestüchtigen und kriegserfahrenen und sieggewohnten Reihen eurer Krieger den gesamten Erdkreis bezwungen. Im Osten wie im Westen seid ihr der Jubel und der Lobpreis und der Gegenstand jeglicher Feier; im Süden wie im Norden wird man nicht müde, euch Dank zu singen. Die unerschütterliche Grundlage eurer so gottliebenden und ruhmgekrönten Regierung ist unser Herr Jesus Christus selbst, denn „durch ihn üben die Könige Königsmacht und bestimmen die Machthaber, was recht ist", wie geschrieben steht.Denn sein Wille ist allmächtig, und durch einen bloßen Wink verleiht er die Fülle alles Guten. Und gern und bereitwillig verteilt er an diejenigen, die ihn lieben, das Auserlesenste von allem, was man zu wünschen und zu bewundern pflegt. Ein ausreichender Beweis für das Gesagte liegt schon in dem, was eurer Herrschaft geschenkt worden ist und, wie wir vertrauen, noch geschenkt werden wird. Daß aber der Ruhm der Frömmigkeit gegen Gott das unerschütterliche Fundament der Königswürde bildet, das will ich aus der Heiligen und gotteingegebenen Schrift selbst in möglichster Kürze darzutun versuchen.</p><h2>2</h2><p>Gar viele sind es, die im Lauf der Zeiten im Judenlande zur Macht gelangten und den Herrscherthron dort einnahmen. Die einen haben frevelhafterweise die Gottesfurcht geringgeschätzt und das Gerechtigkeit fordernde Gesetz verachtet und sich in die Abgründe der Schlechtigkeit hinabziehen lassen, und diese Elenden sind elend zugrunde gegangen. Denn es ist ein überaus gefährliches Wagnis, sich mit Gott zu verfeinden und durch Abweichen vom Wege der Pflicht ihn irgendwie zu beleidigen. Andere hingegen waren sorgsame Hüter der Frömmigkeit gegen Gott und eifrige Wächter alles dessen, was ihm wohlgefällig ist, und diese haben ohne Mühe ihre Feinde besiegt und ihre Widersacher zu Boden geschlagen. Ein solcher war jener Josias, der die Götzendiener mitsamt ihren Hainen und Altären verbrannte, alle Arten von Zauberei und Wahrsagerei ausrottete und die Schliche teuflischen Truges unterdrückte.Auf diese Weise hat er seiner Regierung bei den Alten Anerkennung und Lobpreisung gesichert; und bis heute wird er bewundert von allen, die die Gottesfurcht zu schätzen wissen. In dieser Beziehung indessen ist bei euren Vorfahren sowohl wie bei euch selbst alles in bester Ordnung. Doch mag es nicht unnütz sein, auch dessen zu gedenken, was sich seinerzeit unter dem weisen Ezechias zugetragen hat, weil die Erinnerung daran eurer frommen Hoheit von Vorteil sein kann.</p><h2>3</h2><p>Ein Mann aus dem persischen Babylon, Rabsakes mit Namen, hatte fast das ganze Judenland erobert und auch Samaria verwüstet und zog nun gegen Jerusalem mit einer unübersehbaren Heeresmacht, einer Reiterschar, die nicht zu besiegen oder vielmehr nicht anzugreifen war, und einer Masse von Fußvolk, die an Zahl dem Sande glich. Dann umzingelte er die Mauer mit Belagerungsmaschinen und dem sonstigen kriegerischen Rüstzeug und erging sich in unsinnigen und barbarischen Großsprechereien. Er prahlte, er werde ebenso wie die andern Städte auch die Heilige Stadt selbst mit Gewalt nehmen, erhob sich dabei auch gegen die unaussprechliche Herrlichkeit [Gottes] und stieß lästerliche Reden aus, auch Gott gegenüber seiner frechen Zunge zügellosen Lauf lassend. Es sei vergeblich, sagte er, auf Gott zu vertrauen und von ihm Hilfe zu erhoffen, weil er doch nicht imstande sein werde, Rettung zu schaffen. Als nun einige Leute kamen, dem Könige Mitteilung zu machen von der Tollheit jenes Menschen und von seinen persischen Hochmut atmenden Reden, da waren es nur die Lästerungen gegen Gott, über die der König großen Schmerz empfand, um so mehr, als diese, wie er klug erwog, vielleicht den Untergang der Stadt herbeiführen könnten. Er zerriß sein Gewand und begab sich in das Haus Gottes, um durch demütiges Flehen den göttlichen Zorn zu entwaffnen und wegen der Lästerungen Abbitte zu leisten. Und was geschieht? Der König besänftigte und versöhnte den Herrn der Heerscharen, und er besiegte den Assyrer, nicht mit Rossen und Reitern, nicht mit Bogenschützen oder Speerwerfern, nicht mit der Kunst der Feldherrn, sondern mit der Entscheidung Gottes, der beschlossen hatte, das Heer der Assyrer in einer einzigen Nacht dem Tode zu überliefern, Denn „der Engel des Herrn", heißt es, „zog aus und schlug aus dem Lager der Assyrer 185 000 Mann; und als man sich am andern Morgen früh aufmachte, fand man lauter Leichen.“Das sind die Früchte der Frömmigkeit gegen Gott und des Abscheus wider jede Verunglimpfung der göttlichen Herrlichkeit.</p><h2>4</h2><p>Indessen bin ich der Meinung, daß den frommen Ohren der Kaiser nichts nahegebracht werden darf, was einer Gotteslästerung gleichkommt, sondern immer nur solches, was jedem Tadel, jeder Anklage entrückt ist und der Gott gebührenden Ehrerbietung voll und ganz gerecht wird. In dem Bewußtsein aber, daß es sich so verhalten soll, habe ich mich veranlaßt, ja genötigt gesehen, in dem beifolgenden Schriftchen die Überlieferung des rechten und apostolischen Glaubens darzustellen und damit eurer Hoheit gewissermaßen ein geistliches Gastgeschenk anzubieten, euch sowohl wie auch den wahrhaft gottliebenden Kaiserinnen, die vereint mit euch im Herrscherglanze strahlen,die eine die glückliche Mutter eurer erlauchten Sprößlinge und Trägerin der Hoffnung auf immerwährenden Bestand des Thrones,die andere eine Blume im Jungfrauenpark und vertraute Teilhaberin an den Sorgen eurer glorreichen Regierung. Steine aus Indien zieren euer erhabenes Haupt, die unsichtbare Zier der Seele und des Geistes sei der rechte und unverfälschte Glaube; und fest vertrauend, daß ihr diesen bewahren werdet, bringe ich mein Schriftchen dar als Stütze des Geistes und Schmuck der Seele und Kranz des Herzens. Denn es steht geschrieben: „Weisheit ist kostbarer als Edelgestein, und kein Kleinod kommt ihr gleich“.Ich will also in Kürze die Lehre von der Menschwerdung des Eingeborenen darlegen und ihr Geheimnis möglichst klar herausstellen, soweit es anders denjenigen verstattet ist, die „durch einen Spiegel und in rätselhafter Weise sehen und stückweise erkennen„nach dem Maße der Gnadengabe des Geistes, wie der göttliche Paulus schreibt.„Denn keiner sagt: Herr ist Jesus, außer im Heiligen Geiste, und keiner sagt: Verflucht sei Jesus, außer in Beelzebub.“</p><h2>5</h2><p>Ich glaube aber jemanden sagen zu hören: Willst du dich dieserhalb zum Kampf anbieten und eine so beschwerliche und mühsame Arbeit auf dich nehmen, wohl, so entrolle uns ungesäumt ein genaues und unverfälschtes und gegen jeden Einwand gesichertes Bild der Wahrheit über Christus. Denn die Aussprüche der neuen wie der alten Schrift über ihn werden von Menschen, die gleichsam trunken sind, in mannigfacher Weise verdreht und entstellt. Wir wissen nun wohl, daß diese unverständigen Menschen keine Tollheit unversucht lassen, daß sie aber auch sehr schnell in die Tiefe der Unterwelt stürzen, wie die Schrift sagt,und in die Schlinge des Todes, sie, „die da nicht verstehen, was sie sagen, noch auch, worüber sie aburteilen".Doch müssen ihre Schreiereien und pomphaften Fabeleien im einzelnen gekennzeichnet werden.</p><h2>6</h2><p>Die einen haben sich erkühnt, zu lehren, daß das Wort Gottes des Vaters zwar als Mensch erschienen sei, daß es aber nicht das aus der heiligen Jungfrau und Gottesgebärerin genommene Fleisch getragen habe, indem sie lügnerisch behaupten, das Geheimnis beruhe lediglich auf Schein. — Andere, die sich nicht entschließen können, einen anscheinenden Menschen als Gott anzubeten und dem von der Erde genommenen Fleische die höchsten Ehrenbezeigungen zu erweisen, sind infolge übergroßer Unwissenheit auf einen falschen und verderbten Glauben verfallen, indem sie behaupten, das aus Gott dem Vater hervorgegangene Wort sei verwandelt worden in die Natur von Knochen und Nerven und Fleisch, während sie über die Geburt des Emmanuel aus der Jungfrau mit weitaufgerissenem Munde lachen und diese beste und gotteswürdige Art der Menschwerdung als unannehmbar von sich weisen. — Wieder andere meinen, der mit Gott dem Vater gleich ewige Gott das Wort sei vielmehr erst später geboren und erst zu der Zeit hervorgebracht worden, als er auch dem Fleische nach ins Dasein trat. — Es gibt auch solche, die in ihrer Gottlosigkeit sich bis zu dem Wahne haben verleiten lassen, daß sie meinen, das aus Gott stammende Wort sei überhaupt nichts Persönliches gewesen, sondern nur ein Reden, erfolgt in einem Menschen. So Marcellus und Photinus.— Noch andere wollen zwar glauben, daß der Eingeborene wahrhaft Mensch geworden und im Fleische gekommen ist, nicht aber, daß das angenommene Fleisch vollkommen beseelt gewesen ist mit einer vernünftigen und geistbegabten Seele wie bei uns. Sie wollen vielmehr das Wort Gottes und den aus der heiligen Jungfrau genommenen Tempel zu einer vollkommenen Einheit, wie sie sagen, verknüpfen und behaupten nun, das Wort habe in dem Tempel gewohnt und den angenommenen Leib sich zu eigen gemacht, die Stelle der vernünftigen und geistigen Seele aber habe es selbst ausgefüllt. — Noch andere treten diesen Meinungen entgegen und bekämpfen diese Aufstellungen, indem sie lehren, der Emmanuel bestehe und sei zusammengesetzt aus Gott dem Worte und der vernünftigen Seele und dem Leibe, also der schlechthin vollkommenen Menschheit, und doch haben auch sie die gesunde und untadelhafte Anschauung über ihn nicht ganz gewahrt. Denn sie zerteilen den einen Christus in zwei und ziehen gleichsam einen dicken Strich zwischen beiden, indem sie einen jeden als für sich allein bestehend betrachten: der aus der Jungfrau geborene vollkommene Mensch sei ein anderer als das aus Gott dem Vater stammende Wort. Nicht wie wenn sie nur die Natur des Wortes und die Natur des Fleisches auseinander hielten und den diesbezüglichen Verschiedenheiten Rechnung tragen wollten; denn damit würden sie noch nicht gegen die wahre Lehre verstoßen, weil in der Tat die Natur des Fleisches durchaus nicht dieselbe ist wie die Natur Gottes. Aber sie stellen den einen [Christus] für sich und gesondert als Menschen hin, und den andern nennen sie der Natur nach und in Wahrheit Gott, und doch wollen sie Christen sein. Sie haben auch Schriften darüber verfaßt und wörtlich also zu sagen gewagt: „Der eine, von Natur und in Wahrheit Sohn, ist das Wort aus dem Vater; der andere teilt mit dem Sohne den Namen des Sohnes.„Und nach anderem sagen sie wieder: „Das Wort Gottes ist nicht Fleisch, sondern hat einen Menschen angenommen. Denn der Eingeborene ist im eigentlichen Sinne und an sich Sohn Gottes, des Schöpfers aller Dinge; der Mensch aber, den er annahm, nicht von Natur Gott, wird um des wahren Sohnes Gottes willen, der ihn angenommen, gleichfalls Gott geheißen. Denn das Wort:,Niemand kennt den Sohn, es sei denn der Vater’,geht auf den von Natur und in Wahrheit vollkommenen Sohn aus dem Vater; die Worte Gabriels aber:,Fürchte dich nicht, Maria, denn du hast Gnade gefunden bei Gott, und siehe, du wirst empfangen im Schoße und einen Sohn gebären und seinen Namen Jesus nennen’,beziehen sich auf den Menschen.“So sagen jene. Wir aber denken nicht so. Denn niemals wird das Reden der Irrgläubigen uns verleiten, den geraden Pfad zu verlassen, um einen andern, nicht zum Ziele führenden und verfehlten Weg einzuschlagen.</p><h2>7</h2><p>Wollte jemand über eine jede dieser Lehren eine lange Untersuchung anstellen und eine erschöpfende Prüfung vornehmen, so würde er nicht geringe Zeit aufwenden müssen und lästigen und peinlichen Schweiß zu ertragen haben und doch nichts Ersprießliches zustande bringen. Wir wollen deshalb auf lange und breite Auseinandersetzungen verzichten und eine jede Lehre einer kleinen und kurzen Prüfung unterziehen. Und zuvörderst wollen wir den Doketen sagen: „Ihr irrt, weil ihr die Schriften nicht kennt“,noch auch „das große Geheimnis der Gottesfurcht”, nämlich Christus, der geoffenbart worden im Fleische, gerechtfertigt durch den Geist, erschienen den Engeln, verkündet bei den Völkern, geglaubt in der Welt, aufgenommen in Herrlichkeit".Die Gegner aber müssen entweder den Alten ein Schandmal aufdrücken und die Lehrer des Erdkreises, denen Christus selbst gesagt hat: „Geht hin und lehret alle Völker“,Lügner schelten, oder aber, wenn sie dies zu tun zurückschrecken, die rechte Lehre über Christus annehmen, den eigenen Torheiten Lebewohl sagen und sich fest an die heiligen Schriften halten, um den Pfad der Heiligen zu wandeln, der zur Wahrheit selbst führt.</p><h2>8</h2><p>Denn „das Geheimnis der Gottesfurcht" ist, denke ich, nichts anderes als das aus Gott dem Vater stammende Wort selbst. Es ist geoffenbart worden im Fleische, weil es, nachdem es Knechtsgestalt angenommen, durch die heilige Jungfrau und Gottesgebärerin geboren ward. Es ist auch den Engeln erschienen, weil diese den Geborenen mit dem Lobgesang verherrlichen: „Ehre sei Gott in der Höhe und auf Erden Friede, unter den Menschen Wohlgefallen“,und auch den Hirten von dem um unsertwillen im Fleische erschienenen Gott dem Worte Kunde bringen, indem sie sprechen: „Heute ist euch ein Heiland geboren worden, der da ist Christus der Herr, in der Stadt Davids, und dies sei euch das Zeichen: Ihr werdet ein Kindlein finden, in Windeln gewickelt und in einer Krippe liegend.”Wenn aber eine Geburt durch die Jungfrau und eine Offenbarung im Fleische statthatte, ist es dann nicht müßiges Gerede oder vielmehr wahnsinniges Geschwätz, die so offenkundige und handgreifliche Menschwerdung als Schein hinzustellen? War es Schatten und Schein, so hat in Wahrheit keine Fleischwerdung stattgefunden, so hat die Jungfrau nicht geboren, so hat das aus Gott dem Vater stammende Wort sich nicht des Samens Abrahams angenommen und ist nicht den Brüdern ähnlich geworden.Wir sind ja doch wohl nicht ein Schatten oder Schein, sondern wir haben einen greifbaren und sichtbaren Leib und sind mit diesem erdgeborenen Fleische umkleidet und unterliegen der Vergänglichkeit und den Leiden.</p><h2>9</h2><p>Ist nun aber das Wort nicht Fleisch geworden, so ist es auch nicht selbst in Leiden versucht worden und kann dann auch nicht denen, die versucht werden, helfen.Denn ein Schatten kann doch wohl nicht leiden, und so zerfällt alles für uns Geschehene in nichts. Oder welchen Rücken soll er für uns dargeboten haben?Welche Wange hat er hingehalten, um die Schläge der Juden aufzunehmen? Und daß er an Händen und Füßen mit Nägeln durchbohrt worden, wenn er gar nicht im Fleische erschienen war, wie kann das jemand glauben? Oder welche Seite haben die Soldaten des Pilatus durchstochen, so daß die Zuschauer das kostbare Blut mit Wasser hervorquellen sahen? Es ist indes noch etwas Wichtigeres zu sagen: Christus wäre nicht für uns gestorben und wäre nicht auferweckt worden. Ist das aber wirklich wahr, so ist der Glaube entwertet und das Kreuz, das Heil und Leben der Welt, fällt dahin, und die Hoffnung der im Glauben Entschlafenen ist gänzlich zunichte geworden. So hat mit Recht auch der selige Paulus geurteilt. „Denn ich habe euch“, sagt er, „vor allem überliefert, was ich auch empfangen hatte, daß Christus für unsere Sünden den Schriften gemäß gestorben ist und daß er begraben wurde und daß er am dritten Tage den Schriften gemäß auferweckt worden ist, und daß er dem Kephas erschien, dann den Zwölfen; dann erschien er mehr als fünfhundert Brüdern auf einmal, von denen die meisten bis jetzt leben, einige aber auch entschlafen sind; dann erschien er dem Jakobus, dann allen Aposteln und zuletzt von allen, als einer Fehlgeburt, erschien er auch mir.”Und nach anderem wieder: „Wenn von Christus gepredigt wird, daß er von den Toten auferweckt worden, wie können da einige unter euch sagen, es gebe keine Auferstehung der Toten? Gibt es keine Auferstehung der Toten, so ist auch Christus nicht auferweckt worden. Wenn aber Christus nicht auferweckt worden, so ist nichtig unsere Predigt, nichtig auch unser Glaube. Wir werden vielmehr als falsche Gotteszeugen erfunden, weil wir wider Gott bezeugt haben, daß er Christus auferweckte, während er ihn doch nicht auferweckte, wenn anders die Toten nicht auferweckt werden“.Wie hätte nun, sag’ mir doch, der Schatten sterben sollen? Wie konnte der Vater Christus auferwecken, wenn er Schatten und Schein war und den Banden des Todes nicht unterworfen? Fort also mit dem Brecherguß jener Menschen! Als Fabel vielmehr und als Auswurf gottlosen Sinnes sollen uns ihre Lehren gelten. Vor solchen Menschen warnt uns im voraus schon der Jünger des Heilandes, indem er schreibt: „Viele falsche Propheten sind in die Welt ausgegangen. Den Geist Gottes erkennt ihr daran: Jeder Geist, der bekennt, daß Jesus Christus im Fleische gekommen, ist aus Gott; und jeder Geist, der Jesus nicht bekennt, ist nicht aus Gott. Und das ist der Satz des Antichrists, von dem ihr gehört habt, daß er kommen wird, und er ist schon jetzt in der Welt.”Denn wenn er nicht Mensch geworden, ist er auch nicht im Fleische zu dem Vater und Gott im Himmel aufgefahren und wird er auch nicht, als Mensch nämlich und im Fleische, vom Himmel her zu uns zurückkehren.</p><h2>10</h2><p>Wenn aber andere aus maßloser Unwissenheit sich zu der Meinung bekennen, das gottentstammte Wort habe die Geburt durch die heilige Jungfrau abgelehnt und unsere Natur verschmäht, sei vielmehr in das erdgeborene Fleisch verwandelt worden, so ist dies eine Mißbilligung der Menschwerdung und eine Herabsetzung der Ratschlüsse Gottes. Denn das allschöpferische und erbarmungsreiche Wort Gottes hat sich selbst entäußert,indem es um unsertwillen Mensch ward, geboren aus dem Weibe,damit es, „da die Kinder„, das heißt wir, „an Blut und Fleisch teilhaben, auch selbst daran teilnähme, um durch den Tod den Machthaber des Todes, das heißt den Teufel, zunichte zu machen und diejenigen, die durch die Furcht vor dem Tode ihr ganzes Leben lang in Knechtschaft gehalten waren, zu befreien“,So sagt die Heilige Schrift. Sie aber warfen dem so schönen und herrlichen Entschlüsse [Gottes] Unschicklichkeit vor; und wie wenn sie imstande wären, Besseres zu ersinnen, weisen sie sogar die Ratschläge der Weisheit von sich. Denn wir dürften, sagen sie, die Wehen und die Geburt aus dem Weibe dem Eingeborenen nicht zuschreiben, müßten vielmehr glauben, daß die Natur des Wortes in diesen hinfälligen und erdgeborenen Leib umgestaltet worden sei, und erdichten damit eine Verwandlung dessen, der keine Verwandlung kennt. Denn die Natur Gottes ist fest verankert im Besitze ihrer Güter und beharrt in ihrem Zustande unerschütterlich. Die gewordene und in der Zeit zum Dasein gebrachte Natur kann eine Veränderung erleiden, und darin darf nichts Ungeziemendes und Unwahrscheinliches gefunden werden; denn was überhaupt erst angefangen hat, zu sein, trägt gleichsam den Keim der Veränderlichkeit schon von Haus aus in sich. Der allen Begriff übersteigende Gott aber, dessen Sein vom Entstehen und Vergehen ausgenommen und darüber erhaben ist, muß auch einer Verwandlung unzugänglich sein; wie er auf Grund seiner Natur alles das, was ins Dasein gerufen worden ist, übertrifft und überragt, und zwar in unvergleichlichem Abstände, so muß er auch wieder über alles, was den durch ihn gewordenen Dingen zustoßen kann, erhaben sein und nichts Schadenbringendes erfahren können. Die Gottheit also ist in ihren Gütern unantastbar, die Geschöpfe aber sind veränderlich und wandelbar und der Verderbnis ausgesetzt. In richtiger Erkenntnis und treffender Erwägung des Sachverhaltes rief der Prophet Jeremias zu Gott: „Du thronst immerfort, und wir vergehen immerfort“.Es thront nämlich die Gottheit gleichsam auf ihrem Sitze immerdar, alles leitend und beherrschend und keinerlei Leiden unterworfen; wir aber, die wir eine so leicht wandelbare und stets zu Veränderung und Wechsel hinneigende Natur besitzen, wir vergehen immerfort, das heißt, wir sind zu jeder Zeit und in jedem Augenblick vergänglich und veränderlich. Es kann also die Gottheit nicht verwandelt und durch Leiden ihrer Beharrlichkeit beraubt werden; und die vergängliche und veränderliche, das heißt, die gewordene Natur kann nicht wesenhafte Unveränderlichkeit erlangen, das Geschöpf kann sich nicht die Güter der göttlichen Natur aneignen. Es würde mit Recht hören: „Was hast du denn, was du nicht empfangen hättest?„Daß aber die Natur des Wortes schlechthin unwandelbar und unveränderlich, die gewordene Natur hingegen durchaus veränderlich ist, läßt sich sehr leicht ersehen, da David im Geiste singt: „Die Himmel werden vergehen, du aber bleibst; und alle werden altern wie ein Gewand, und wie ein Kleid wirst du sie drehen, und sie werden sich wechseln, du aber bist derselbe, und deine Jahre werden nicht abnehmen.“Wie aber soll das aus Gott stammende Wort noch dasselbe geblieben sein, wenn es wahr wäre, daß es seine Beharrlichkeit und Unerschütterlichkeit abgelegt hätte und in das, was ihm fremd war, hinabgestiegen und in die Natur des Fleisches und ein vergängliches Geschöpf umgewandelt worden wäre? Ist das nicht leeres Geschwätz und Wahnwitz dazu?</p><h2>11</h2><p>Würde man doch berechtigt sein — auch das muß schließlich noch gesagt werden —, den Torheiten dieser Menschen eine noch größere Torheit gegenüberzustellen und zu behaupten, es sei nicht unmöglich, daß auch das erdgeborene Fleisch einmal zu der Natur der Gottheit aufsteige und den Zustand der höchsten aller Wesenheiten erreiche. Denn wenn ihrem Unsinn zufolge die Natur der Gottheit in die Natur des Fleisches übergegangen ist, so kann es nicht ausgeschlossen sein, daß die niedere und uns eigene Natur einmal über das Fleisch sich hinausschwinge und zur Gottheit und in die höchste Wesenheit umgewandelt werde. Indessen wollen wir nicht ihrem Unverstände Gefolgschaft leisten, sondern uns vielmehr an die göttlichen Schriften halten, an den Propheten, der erklärt: „Siehe, die Jungfrau wird empfangen und einen Sohn gebären, und man wird seinen Namen Emmanuel nennen“,und an den seligen Gabriel, der die Vorhersagung besiegelt und den Ratschluß des Himmels der Jungfrau mit den Worten enthüllt: „Fürchte dich nicht, Maria, denn siehe, du wirst empfangen im Schoße und einen Sohn gebären und seinen Namen Jesus nennen.”Wir glauben also, daß der Emmanuel in Wahrheit aus dem Weibe geboren ist, und in diesem rechten Glauben werden wir den herrlichen und erhabenen Ruhm unserer Natur nicht ablehnen. Denn nicht seine eigene Natur hat der Eingeborene angenommen — das würde uns nichts geholfen haben — und auch nicht die der Engel, sondern die „des Samens Abrahams", wie geschrieben steht,denn nur so und nicht anders konnte das ins Verderben gestürzte Geschlecht wieder gerettet werden.</p><h2>12</h2><p>Aber wie? Sollen wir uns nicht auch darüber im höchsten Grade wundern, daß es Menschen gibt, die der gotteingegebenen Schrift beinahe vollständig Lebewohl sagen und ihren Verstand den Geistern des Irrtums ausliefern und nun in ihrer Torheit und kindischen Urteilslosigkeit soweit gegangen sind, daß sie glauben, der Schöpfer der Welten, das Gott und dem Vater gleichewige Wort Gottes sei erst zur Zeit der Geburt des Fleisches ins Dasein getreten? Der, der über aller Welt und Zeit ist, soll erst später entstanden sein, so daß erst in den letzten Zeiten, gerade noch in den Tagen der Menschwerdung, Gott zum Vater geworden und der, durch den alles und in dem alles ist, zugleich mit dem aus der Jungfrau genommenen Tempel zur Existenz gelangt sei. Sind sie nicht schon bis zum Gipfel der Schlechtigkeit vorgedrungen, die eine so alberne und abscheuliche Fabel bereitwillig annehmen und ihren Verstand mit reinstem Blödsinn füllen? Wahrhaftig „ein geöffnetes Grab ist ihre Kehle, mit ihren Zungen trogen sie, Otterngift ist unter ihren Lippen, ihr Mund ist voll von Fluch und Bitterkeit.„Muß denn nicht der, durch den alles ist, auch vor allem gewesen sein? Was aber werden sie tun angesichts des Johannes: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort; alles ist durch dasselbe geworden, und ohne dasselbe ist nichts geworden“,und wiederum: „Was von Anfang an war, was wir gehört, was wir gesehen haben mit eigenen Augen, was wir geschaut und unsere Hände berührt haben, von dem Worte des Lebens [verkünden wir euch], und das Leben ist geoffenbart worden, und wir haben es gesehen und bezeugen und verkünden euch das ewige Leben, welches beim Vater war und uns geoffenbart worden ist.“Auch Christus selbst belehrt die Juden über das unvordenkliche Alter seines Daseins; denn als sie sagten: „Du hast noch nicht fünfzig Jahre und du hast Abraham gesehen?„, vernahmen sie die hoheitsvolle Antwort: „Wahrlich, wahrlich, ich sage euch, ehe Abraham geworden ist, bin ich.“Wenn aber das „er war„ ohne Einschränkung von ihm ausgesagt und nicht minder deutlich das „ich bin“ ihm zugesprochen wird, wer will dann den Anfang seines Seins absehen? Oder wie soll der, der in dem über alles Denken hinausreichenden Anfang war, im Lauf der Zeit ins Dasein gerufen worden sein? Wollte jemand diesen Leuten einläßlicher antworten, so würde es durchaus nicht schwierig sein, auf Grund der Zeugnisse der gotteingegebenen Schrift die Angriffe ihrer Torheit abzuschlagen. Da jedoch ihr Geschwätz so offensichtlich zu verwerfen ist und gar so viele Schwächen aufweist, so halte ich es für überflüssig, ihm noch weitere Beachtung zu schenken. Wenden wir uns also einer mit der abgewiesenen Lehre verwandten Ansicht zu!</p><h2>13</h2><p>Es gibt nämlich auch Menschen, welche die Schönheit der Wahrheit verunstalten und sie wie eine Münze verfälschen, indem sie „ihr Horn in die Höhe heben und Vermessenes gegen Gott reden„, wie geschrieben steht.Diese Unglückseligen bilden sich ein, der Eingeborene sei nichts eigentlich Wirkliches, nichts Selbständiges und nichts Persönliches, sondern lediglich ein Reden, ein Wort, welches nur von Gott ausgesprochen worden sei und in einem Menschen Wohnung genommen habe. Indem sie in solcher Weise Jesus zusammenfügen, behaupten sie, er sei zwar heiliger als die Heiligen, aber darum doch nicht auch Gott. Wer nun, wie auch der Jünger des Heilandes schreibt, „wer ist ein Lügner, außer wer leugnet, daß Jesus der Christus ist? Das ist der Antichrist, der den Vater und den Sohn leugnet. Jeder, der den Sohn leugnet, hat auch den Vater nicht; wer aber den Sohn bekennt, hat auch den Vater.“Denn sie werden beide gegenseitig durcheinander, der eine in dem andern, anerkannt, von uns selbst sowohl als auch von den heiligen Engeln. Würde doch niemand fragen, wer der Vater sei, wenn er nicht einen existierenden und gezeugten Sohn in Gedanken einbegriffe, wie auch niemand fragen würde, wer denn der Sohn sei, wenn er nicht sicher wüßte, daß der Vater gezeugt hat. Es wird also, und zwar ohne jedes Bedenken, zu entgegnen sein, daß wir, wenn der Sohn keine Wirklichkeit ist, auch den Vater nicht in Wahrheit als solchen gelten lassen können. Denn wie kann er Vater sein, wenn er nicht in Wahrheit gezeugt hat? Hat er aber etwas gezeugt, was nicht besteht und überhaupt nicht ist, so kann das Gezeugte nur ein Nichts sein. Denn was nicht besteht, ist dem Nichtseienden gleich oder vielmehr ein einfaches Nichts. Dann also würde Gott der Vater eines Nichts sein.</p><h2>14</h2><p>Aber, beste Freunde, möchte ich den Verfechtern dieser Lehre sagen, was ihr vorbringt, ist leeres Geschwätz. Oder antwortet mir auf meine Fragen! Wie soll die Liebe Gottes und des Vaters zu uns überschwenglich sein? Hat er den Sohn für uns dahingegeben, der eurer Aussage nach nicht existiert, so hat er also ein Nichts für uns dahingegeben, und das Wort ist nicht Fleisch geworden und hat das heilbringende Kreuz nicht erduldet und die Gewalt des Todes nicht zunichte gemacht und ist nicht wiederaufgelebt. Denn wenn er ein Nichts ist und nicht existiert nach eurer Aussage, wie hätte er das Gesagte vollbringen können? Das Wort der Heiligen Schrift hat demnach die Gläubigen betrogen, und die Festigkeit des Glaubens zerfließt in Nichts. Und wie? Sagt uns nicht das heilige Schriftwort, der Sohn sei in der Gestalt Gottesund er sei das Abbild und der Ausdruck des Erzeugers?Wie sollte das nicht allen bekannt sein! Nun aber sind die Abbilder wie die Urbilder, was ja schon im Begriffe des Abbildes liegt. Ist also das Abbild etwas Unpersönliches und hat der Ausdruck keine eigene Existenz, so werden sie in notwendiger Folge zugeben müssen, daß auch der, dessen Ausdruck er ist, unpersönlich ist, und die Mangelhaftigkeit des Abbildes wird ganz und voll auf das Urbild zurückfallen.</p><h2>15</h2><p>Sag’ mir aber weiter: Als Philippus, der besonders wißbegierige Jünger Christi, sagte: „Herr, zeige uns den Vater, und es genügt uns„,wünschte er da einen seienden und wirklichen oder einen nichtseienden und unpersönlichen Vater zu sehen? Ohne Zaudern, denke ich, wird man antworten: einen seienden und wirklichen Vater. Wenn nun aber der Sohn ein Nichts ist, weil er ja nicht existieren soll nach der unverschämten Frechheit dieser Menschen, wozu bot er uns behufs genauer Erkenntnis des Vaters sich selbst als Abbild dar, indem er sprach: „So lange Zeit bin ich bei euch, und du hast mich nicht erkannt, Philippus? Wer mich gesehen, hat den Vater gesehen. Glaubst du nicht, daß ich im Vater und der Vater in mir ist?“„Ich und der Vater sind Eins.„Es wird aber doch wohl niemand in einem Nichtexistierenden einen Existierenden erblicken, niemand jemals Seiendes mit Nichtseiendem in Gedanken zu Einem zusammenfassen können. Und wie soll der Vater im Sohne und der Sohn hinwieder im Vater sein? Sofort würde sich die Folgerung ergeben, daß, wenn das Wort keine eigene Existenz hat, auch der Vater in Gefahr gerät, da er das Nichts in sich haben und im Nichts existieren soll. Denn wer gar nicht ist, muß als ein Nichts angesehen werden. Das sind freilich absonderliche Dinge; die gegnerische Lehre krankt eben an gar vielen Ungereimtheiten und nötigt uns nun gleichfalls zu unliebsamen Erörterungen. Wundern aber muß man sich füglich, wie es möglich gewesen sein soll, daß der Vater in dem nicht zum Sein gelangten Sohne das Seiende gemacht hat. Wollte jemand fragen, ob für das Seiende das Sein besser sei oder das Nichtsein, so würde er sofort die Antwort erhalten, besser sei das Sein. Denn gerade deshalb, weil er dem Nichtseienden einst das Sein gegeben hat, heißt und ist der Schöpfer gut. So muß es sich auch in Wahrheit verhalten. Demgemäß wäre das Geschöpf besser daran als der, durch den alles ins Dasein eingeführt wurde. Denn dieser soll ja nicht existieren; das Geschöpf aber existiert und gilt als im Besitz des Seins befindlich. O des Widersinns! Fort mit dieser Lästerung! Denn „lebendig ist das Wort Gottes und wirksam“, wie geschrieben steht. Deshalb hat es auch gesagt: „Ich bin das Leben.„Es könnte jedoch nicht als Leben gedacht werden, wenn es nicht existierte. Leben aber ist es seiner Natur nach; denn es wird gewiß nicht lügen. Eine abscheuliche Lüge ist es mithin und der Abschaum albernsten Sinnes, zu sagen, das aus Gott entsprungene Wort existiere nicht. Hat es doch selbst zu Moses gesagt: „Ich bin, der da ist.“Wie aber könnte man annehmen, daß das wahrhaft Seiende und Selbständige jemals seiner eigenen Existenz verlustig gehe? Die bis auf die Spitze getriebene Torheit dieser Aufstellungen werden wir demnach füglich beiseite schieben dürfen.</p><h2>16</h2><p>Aber auch denen, die da sagen, das dem Worte geeinte Fleisch sei der vernünftigen Seele beraubt gewesen, werden wir, die wir wohl gelernt haben, der Wahrheit nachzuforschen, füglich nicht zustimmen können. Diese Leute umkleiden nämlich das Wort mit einem nur des Lebens und der Wahrnehmung fähigen Fleische und lassen es so in die Welt eintreten, während sie die Tätigkeit des Geistes imd der Seele dem Eingeborenen zuweisen. Sie schrecken, ich weiß nicht wie, davor zurück, zu bekennen, daß das Wort dem der Natur nach mit einer vernünftigen Seele beseelten menschlichen Fleische geeint ist, indem sie der anfänglichen und uralten Glaubensüberlieferung keine Beachtung schenken, vielmehr törichter Weise ihrem eigenen Sinne und menschlichen Vernünfteleien folgen zu sollen meinen und daher tatsächlich anders denken, „als man denken soll“.Und welchen Grund haben sie für diese Lehre? Ich will es sagen. Wir lehren, daß der „Mittler zwischen Gott und den Menschen„den Schriften zufolge zusammengesetzt ist aus unserer Menschennatur in der ihrem Begriffe entsprechenden Vollständigkeit und dem der Natur nach aus Gott entsprungenen Sohne, das heißt dem Eingeborenen. Wir behaupten, daß eine gewisse Zusammenfügung und unaussprechliche Verbindung von ungleichen und unähnlichen Naturen zu einer Einheit stattgefunden hat, und bekennen, daß Christus und der Herr und der Sohn Einer ist, weil er in einer und derselben Person Gott und Mensch zugleich ist. Wir sind gewohnt, die Einheit als schlechterdings unzerreißbar anzusehen, weil wir dafür halten, daß Einer und derselbe Eingeborener und Erstgeborener ist, Eingeborener als das Wort Gottes des Vaters und aus seiner Wesenheit entsprungen, Erstgeborener, insofern er Mensch geworden ist und einer „unter vielen Brüdern“.Wie es nämlich einen Gott Vater gibt, aus dem alles ist, so auch einen Herrn Jesus Christus, durch den alles ist.Wir anerkennen das Wort, durch welches alles ist, als Gott der Natur nach, auch wenn es Fleisch geworden ist, das heißt Mensch.</p><h2>17</h2><p>Aber mit diesen unsern Lehren stimmen die Ansichten jener durchaus nicht überein. Zwar bekennen auch sie so wie wir, daß Jesus Christus Einer ist, und den Emmanuel in Zwei zu zertrennen, weisen sie als eine große Gottlosigkeit weit zurück. Zugleich jedoch behaupten sie, das gottentstammte Wort sei einem Fleische geeint, welches der menschlichen und vernünftigen Seele entblößt gewesen. Sie glauben auch einen, wie sie meinen, überzeugenden Grund für diese Behauptung gefunden zu haben. Denn, sagen sie, die zur Herstellung eines vollkommenen Wesens verbindungsweise zusammentretenden Teile pflegen als Stücke, die für sich unvollkommen sind, betrachtet zu werden, während das für sich und gleichsam in seiner eigenen Natur Vollkommene der Verbindung aus Teilen nicht bedarf. Deshalb, sagen sie, muß man sich füglich hüten, den dem Worte geeinten Tempel als einen vollkommenen Menschen gelten zu lassen, damit die Verbindung, die doch bei Christus anzunehmen ist, genau und einwandfrei ihrem Begriffe gerecht werde. Auch dies, meine ich, könnten sie noch beifügen. Wenn wir, könnten sie sagen, den Emmanuel aus einem vollkommenen Menschen und dem dem Vater entstammten Worte bestehen lassen, so ist nicht geringe Gefahr gegeben, oder vielmehr es erscheint schon fast unvermeidlich, selbst wider Willen zwei Söhne und zwei Christus anerkennen zu müssen. Was werden wir ihnen hierauf antworten? Zuvörderst, daß man die so uralte und auf die heiligen Apostel selbst zurückgehende Glaubensüberlieferung nicht durch maßlose Spitzfindigkeiten auflösen und das über die Vernunft Hinausgehende nicht zum Gegenstande bis auf die Spitze getriebener Untersuchungen machen sollte, auch nicht mit gewissen Kritikern sich vordrängen und selbstbewußt sprechen: das da ist recht so, das aber müßte anders sein. Es geziemte sich vielmehr und es wäre wirklich besser, dem allweisen Gott den Weg seiner Ratschlüsse zu überlassen und das, was er für gut befunden, nicht frevelhafter Weise zu tadeln. Sonst werden wir sein klares Wort zu hören bekommen: „Denn meine Ratschlüsse sind nicht wie eure Ratschlüsse, und nicht wie eure Wege sind meine Wege, sondern soweit der Himmel absteht von der Erde, soweit steht mein Weg ab von euren Wegen und eure Gedanken von meinen Gedanken."</p><h2>18</h2><p>Wir aber beten durchaus nicht zwei Söhne an und verehren keineswegs zwei Christus, wenn wir auch glauben, daß der dem Worte geeinte Tempel mit einer vernünftigen Seele beseelt gewesen. Wenn nun nach ihrer Anschauung der Emmanuel nur aus dem Fleische und dem aus Gott dem Vater entsprungenen Worte bestände, so würden sie doch in keiner Weise genötigt sein, das Fleisch für sich gesondert und den Eingeborenen für sich gesondert hinzustellen und zwei Christus zu bekennen. So nehmen wir, wenn wir nach unserer Lehre behaupten, daß das aus Gott entstammte Wort mit einer dem Begriffe ihrer Natur entsprechend vollständigen Menschheit verbunden und vereinigt worden, wir nehmen, sage ich, auch keine zwei Söhne an, sondern einen und denselben, von Natur aus Gott und aus der Wesenheit Gottes und des Vaters selbst entsprungen, in den letzten Zeiten der Welt Mensch geworden und durch die heilige Jungfrau geboren und von uns wie von den heiligen Engeln anzubeten, wie die Schriften besagen.</p><h2>19</h2><p>Wenn sie jedoch behaupten, der Zustand der Menschheit habe nur die Herabkunft des Eingeborenen gefordert, aber in dem Verlangen, „den Erdbewohnern zu erscheinen und mit den Menschen zu verkehren“und uns den Weg des evangelischen Lebens vor Augen zu führen, habe er aus Zweckmäßigkeitsgründen sich mit einem dem unsrigen ähnlichen Fleische umhüllt — die Gottheit ist ja ihrer Natur nach unsichtbar —, so verraten sie damit, daß sie die Bedeutung der Menschwerdung nicht erkannt und das „große Geheimnis der Gottesfurcht“nicht verstanden haben. Denn wenn die Fleischwerdung oder Menschwerdung des Eingeborenen lediglich den Zweck hatte, ihn den Erdbewohnern sichtbar zu machen, im übrigen aber der Natur des Menschen keinen Gewinn brachte, wie soll es da nicht besser und weiser sein, daß wir der Meinung der Doketen beitreten, die das Wort des Fleisches und des irdischen Leibes entkleiden, um es nur dem Scheine nach auf Erden als Mensch auftreten zu lassen? Diese Unglückseligen dürften aber überführt worden sein, von der Wahrheit abzuirren, und zwar ohne große Mühe. Oder soll es, würden sie sagen, wenn anders das gottentstammte Wort durch die Fleischwerdung der Natur des Menschen keinerlei Nutzen bringt, nicht besser sein, dieses Wort von der Unreinheit des Fleisches freizuhalten und anzunehmen, es habe sich überhaupt nur dem Scheine nach des irdischen Leibes bedient und so den vorgesetzten Zweck verwirklicht? Wenn nun jemand fragt, was denn eigentlich der Grund der Herabkunft oder welches die Art und Weise der Menschwerdung gewesen und wozu sie erfolgt sei, so wollen wir ihm Antwort geben. Die göttliche Schrift soll als Lehrmeisterin dienen. Komm’ also, mein Bester, vernimm die heiligen Schriften, hefte das Auge des Geistes aufmerksam auf die Aussprüche der heiligen Apostel und erfasse wohl den Bescheid auf deine Frage! Der weise Paulus also, und in ihm sprach Christus selbst, erklärt uns: „Da nämlich die Kinder an Blut und Fleisch teilhaben, so hat auch er in gleicher Weise daran teilgenommen, um durch den Tod den Machthaber des Todes, das heißt den Teufel, zunichte zu machen und diejenigen, die durch die Furcht vor dem Tode ihr ganzes Leben lang in Knechtschaft gehalten waren, zu befreien.“Und anderswo belehrt er uns über die Menschwerdung wie folgt: „Was nämlich„, sagt er, „dem Gesetze unmöglich war, weil es schwach war durch das Fleisch, Gott hat seinen eigenen Sohn gesandt in Fleisch wie Sündenfleisch und der Sünde wegen, und hat die Sünde am Fleische verdammt, damit die Satzung des Gesetzes an uns erfüllt würde, indem wir nicht nach dem Fleische wandeln, sondern nach dem Geiste.“</p><h2>20</h2><p>Ist es nun nicht für einen Jeden ganz klar und offensichtlich, daß der Eingeborene einer wie wir geworden ist, das heißt ein vollkommener Mensch? Er wollte unsern irdischen Leib von der eingedrungenen Verderbnis erretten, indem er ihm durch die Menschwerdung in Weise der Einigung sein eigenes Leben einsenkte, die menschliche Seele aber sich zu eigen machen und über die Sünde hinausheben, indem er ihr die Festigkeit und Unwandelbarkeit seiner eigenen Natur aufdrückte wie etwa der Wolle die Farbe. Ich meine nämlich, daß bei Erörterungen über diese an und für sich recht dunkeln Dinge Gleichnisse nicht entbehrt werden können. Wir sehen ja die göttlichen und über die Vernunft hinausgehenden Geheimnisse nur „durch einen Spiegel und in rätselhafter Weise“,Das angezogene Gleichnis aber ist, scheint mir, ganz passend, denn es schließt den wahrscheinlichen oder vielmehr den wahren Sachverhalt in sich. Wie also das Fleisch, nachdem es das Fleisch des allbelebenden Wortes geworden, die Macht der Verwesung und des Todes überragt, in derselben Weise, meine ich, ist die Seele, nachdem sie die Seele dessen geworden, der keine Sünde kannte, im Besitze eines in allem Guten befestigten und unwandelbaren und der ehemals über uns herrschenden Sünde unvergleichlich überlegenen Zustandes. Denn Christus ist der erste und einzige Mensch auf Erden, „der keine Sünde getan und in dessen Mund kein Trug erfunden worden„.Er ist aber gleichsam zur Wurzel und zum Erstling derjenigen gesetzt, die durch den Geist zu dem neuen Leben umgestaltet werden sollen, und er wird die Unverweslichkeit des Leibes und die aus der Gottheit stammende unerschütterliche Beständigkeit [im Guten], der Teilnahme nach und aus Gnade, auf das gesamte Menschengeschlecht übertragen. Das meint der göttliche Paulus, wenn er schreibt: „Wie wir das Abbild des Staubgeborenen getragen haben, so werden wir auch das Abbild des Himmlischen tragen.“Unter dem Abbild des Staubgeborenen nämlich versteht er den Hang zur Sünde und den von daher uns zustoßenden Tod; unter dem Abbild des Himmlischen, das heißt Christi, aber die Festigkeit in der Heiligung und die Rückkehr von Tod und Verwesung und die Erneuerung zu Unverweslichkeit und Leben.</p><h2>21</h2><p>Es ist also, behaupten wir, das ganze gottentstammte Wort mit unserer ganzen Menschheit geeint worden. Denn er hat nicht etwa das Bessere in uns, das heißt die Seele, außer acht gelassen, um die Mühen seines Erdenwandels nur dem Fleische zu widmen. Durch beide vielmehr hat er in entsprechender Weise das Geheimnis der Menschwerdung verwirklicht. Seines Fleisches bediente er sich wie eines Werkzeugs zu den Werken des Fleisches und den natürlichen Schwächezuständen und zu allem, was keinem Tadel unterlag, seiner Seele aber zu den menschlichen und schuldlosen Gefühlen und Stimmungen. Denn es heißt, daß er gehungert hat und Müdigkeit erduldet von langer Wanderung und Schrecken und Furcht und Trauer und Todesangst und den Tod am Kreuze. Ohne daß ihn jemand zwang, hat er von sich aus „sein Leben für uns eingesetzt“,„um über Tote und Lebende zu herrschen”,indem er sein Fleisch für das Fleisch aller hingab, ein in der Tat gleichwertiges Geschenk, seine Seele aber zum Lösepreis für die Seelen aller machte, wenngleich er auch wieder auflebte, weil er als Gott der Natur nach Leben ist. Hat ja auch der göttliche Petrus erklärt: „Ihr Männer, Brüder, es sei gestattet, freimütig von dem Erzvater David zu euch zu reden und zu sagen, daß er gestorben ist und begraben wurde und sein Grab bei uns ist bis auf diesen Tag. Da er nun Prophet war und wußte, daß Gott ihm mit einem Eide geschworen hatte, er werde einen aus der Frucht seiner Lenden auf seinen Thron setzen, so hat er in die Zukunft sehend von der Auferstehung Christi geweissagt, daß seine Seele nicht in der Unterwelt belassen werde und sein Fleisch nicht die Verwesung schaue."Man würde auch nicht annehmen dürfen, daß das dem Worte geeinte Fleisch jemals von der Verwesung hätte ergriffen und die göttliche Seele von den Pforten der Unterwelt hätte überwältigt werden können; denn sie ist nicht in der Unterwelt belassen worden, wie auch der göttliche Petrus erklärte. Wir können ja sein Wort nicht dahin verstehen, daß die durchaus unfaßbare und dem Tode unzugängliche Natur, das heißt die Gottheit, des Eingeborenen aus den unterirdischen Tiefen zurückgeholt worden sei, und es wäre auch nichts Wunderbares gewesen, wenn das gottentstammte Wort nicht in der Unterwelt verblieben sein würde, da es durch die Kraft und Natur der Gottheit in unfaßbarer und unaussprechlicher Weise alles erfüllt und allem innewohnt. Denn das Göttliche ist erhaben über jede Örtlichkeit, jede Grenze und jede meßbare Größe, und von keinem Dinge kann es umschlossen werden.</p><h2>22</h2><p>Wunderbar aber war es und für einen jeden höchst erstaunlich, daß der von Natur vergängliche Leib wieder auflebte, weil er der Leib des unvergänglichen Wortes war, die Seele aber, die die Verbindung und Einigung mit dem Worte erlangt hatte, im Besitze göttlicher Macht und Gewalt in die Unterwelt hinabstieg und den dort befindlichen Geistern erschien. Sprach er ja auch „zu denen, die in Fesseln lagen: Geht hinaus!, und zu denen, die im Finsteren saßen: Kommt ans Licht!“In diesem Sinne, denke ich, sagt der göttliche Petrus von dem Worte Gottes und der kraft der Menschwerdung in Weise der Einigung ihm verbundenen Seele: „Denn besser ist es, als Gutestuende zu leiden, wenn Gottes Wille es so will, denn als Übeltäter, weil auch Christus einmal für die Sünder gestorben ist, der Gerechte für die Ungerechten, damit er uns zu Gott hinführe, getötet im Fleische, lebendig gemacht durch den Geist, wobei er”, sagt er, „auch die im Kerker befindlichen Geister, die einst ungläubig waren, aufsuchte und ihnen predigte."Er will jedenfalls nicht sagen, daß bloß die Gottheit des Eingeborenen für sich allein in die Unterwelt hinabgestiegen sei und den dort befindlichen Geistern gepredigt habe, da sie durchaus unsichtbar ist; das Göttliche ist ja zu erhaben, um jemals gesehen zu werden. Wir werden aber auch nicht zugeben, daß die Gottheit zum Scheine und trügerischer Weise sich in eine Seele verwandelt habe, denn der Schein ist allenthalben abzulehnen. Vielmehr hat er, wie er mit den Menschen auf Erden im Fleische verkehrte, so den Seelen in der Unterwelt im Gewande der Seele gepredigt, wie sie ihm geeint worden war.</p><h2>23</h2><p>Unergründlich freilich und wahrhaft unaussprechlich und unsern Gedanken unerreichbar ist die Art und Weise der Menschwerdung. Wir müssen uns deshalb wieder und wieder vor Augen halten, daß es nicht gefahrlos ist, das, was unserer Erfahrung fern liegt, ergrübeln zu wollen, und daß es höchst unverständlich ist, das, was unsere Vernunft übersteigt, der Nachprüfung zu unterziehen und zu versuchen, auszudenken, was nicht auszudenken ist. Weißt du nicht, daß dieses unergründliche und unsere Vernunft überragende Geheimnis unsererseits am besten geehrt wird durch einfachen Glauben? Das unverständige Wort „Wie kann dies geschehen?“ jenem Nikodemusund seinesgleichen überlassend, wollen wir die Aussprüche des göttlichen Geistes unbezweifelt annehmen und Christus selbst glauben, der da sagte: „Wahrlich, wahrlich, ich sage euch: Was wir wissen, reden wir, und was wir gesehen haben, bezeugen wir."Fort also mit allem Geschwätz und leerem Gerede, mit allem Irrwahn und Trug aufgeputzter Worte! Wir dulden nichts, was geeignet erscheint, Schaden anzurichten, mögen die Gegner mit noch so erkünstelten und auch erbosten Reden gegen uns toben. Denn unser göttliches Geheimnis beruht „nicht auf überredenden Worten menschlicher Weisheit, sondern auf dem Erweise des Geistes.“</p><h2>24</h2><p>Der Eingeborene also, der den Schriften zufolge Gott ist und Herr aller Dinge, hat sich uns geoffenbart. Er „erschien auf Erden"und leuchtete den im Finstern Sitzenden auf, indem er Mensch ward, nicht zum Scheine — Wahn ist es, so zu denken oder zu sprechen —, auch nicht so, daß er durch Veränderung oder Verwandlung zu Fleisch geworden wäre — denn das gottentstammte Wort ist unveränderlich und bleibt stets in einem und demselben Zustande —, auch nicht so, wie wenn er selbst erst gleichzeitig mit dem Fleische zu sein begonnen hätte — denn er ist der Schöpfer der Zeiten —, auch nicht so, wie wenn er als unpersönliches Wort oder als bloße Rede in dem Menschen gewesen wäre — denn der, der einst das Nichtseiende ins Dasein rief, hat notwendig vorher selbst schon existiert, denn er ist das Leben, entsprungen aus dem Leben Gottes des Vaters, der anerkanntermaßen eine eigene Person ist. Er hat aber auch nicht bloßes Fleisch angelegt ohne vernünftige Seele, denn er ist in Wahrheit aus dem Weibe geboren worden und als Mensch erschienen, er, der lebendige und wahrhaft seiende und Gott dem Vater gleichewige Gott das Wort, der „Knechtsgestalt angenommen“;und wie vollkommener Gott, so ist er auch vollkommener Mensch, nicht nur aus Gottheit und Fleisch zu einem Christus und Herrn und Sohn zusammengesetzt, sondern aus zwei vollkommenen Wesenheiten, Menschheit nämlich und Gottheit, zu Einem und demselben in wunderbarer Weise vereint.</p><h2>25</h2><p>Es wird aber, wie sich erwarten läßt, jemand fragen: Wen hat denn nun die heilige Jungfrau geboren, den Menschen oder das gottentstammte Wort? Das ist eben der Irrtum und der Verstoß gegen das Richtige und Wahre, Du sollst mir nach erfolgter Einigung keine Spaltung vornehmen und uns den Emmanuel nicht in einen Menschen für sich und Gott für sich zerteilen, also eine Zweiheit von Personen herstellen. Uns soll niemand mit Recht vorwerfen können, daß wir statt des Richtigen etwas vertreten, was durch die Heilige Schrift verworfen wird. Einer von den Jüngern Christi hat wie folgt gesagt: „Ihr aber, Geliebte, seid eingedenk der früher von den Aposteln unseres Herrn Jesus Christus gesprochenen Worte, daß sie euch sagten: Am Ende der Zeiten werden listige Betrüger kommen, die nach eigenen Gelüsten in Gottlosigkeiten wandeln. Diese sind es, die sich absondern, Sinnesmenschen, die den Geist nicht haben.“Man darf also in keiner Weise sondern oder trennen, vor allem nicht so, daß man nach der Einigung von Zweien redet und einen jeden von beiden für sich gesondert hinstellt. Freilich muß die Vernunft unterscheiden zwischen den Naturen — denn die Gottheit ist nicht dasselbe wie die Menschheit —, aber mit der Unterscheidung verbindet sie zugleich das Wissen um das Verknüpftsein beider zu einer Einheit. Aus Gott dem Vater also ist er als Gott, aus der Jungfrau ist er als Mensch hervorgegangen, denn nach der rechten Lehre ist es das auf unaussprechliche und unbegreifliche Weise aus Gott dem Vater aufgestrahlte Wort, welches auch aus dem Weibe geboren wurde, indem es zu der Menschheit herniederstieg und zu einer andern Natur sich herabließ, nicht um entäußert zu bleiben, sondern um als Gott anerkannt zu werden, und in unserer Gestalt sich auf Erden offenbarte, nicht in einem Menschen wohnend, sondern selbst der Natur nach Mensch geworden, unter Beibehaltung seiner Herrlichkeit. Faßt ja auch der göttliche Paulus das, was von gegenseitiger Wesensgleichheit so weit entfernt, ja durch einen unermeßlichen Abstand voneinander getrennt ist, Gottheit nämlich und Menschheit, der Lehre von der Menschwerdung gemäß in Eins zusammen und verkündet den einen Christus und Sohn und Gott, der aus beiden Teilen besteht. „Paulus“, sagt er, „Diener Jesu Christi, berufener Apostel, ausgesondert für das Evangelium Gottes, welches er vorher verheißen hatte durch seine Propheten in heiligen Schriften, über seinen Sohn, der geworden ist aus dem Samen Davids dem Fleische nach, dargetan als Gottessohn durch Machterweis gemäß dem Geiste der Heiligung.“Siehe, er sagt deutlich, er sei ausgesondert für das Evangelium Gottes, schreibt aber gleichwohl nicht minder deutlich: „Wir verkünden ja nicht uns selbst, sondern Christus Jesus„,und wiederum: „Ich hatte mir nämlich vorgenommen, nichts zu wissen unter euch als Jesus Christus und diesen als Gekreuzigten.“</p><h2>26</h2><p>Er nennt ihn Sohn Gottes und sagt zugleich, daß er aus dem Samen Davids geboren und als Sohn Gottes dargetan sei und beglaubigt werde. Wie nun, sag mir: Kann Gott aus dem Samen Davids entsprossen sein? Und wie kann der, der vor Zeiten und von Ewigkeit her Sohn war, hervorgegangen aus dem Vater, wie kann er als Gottessohn dargetan worden sein, wenn er erst ins Dasein eingeführt wurde? Er hat ja selbst von sich gesagt: „Es sprach der Herr zu mir: Mein Sohn bist du, ich habe dich heute gezeugt„,und „heute“ bezeichnet doch nicht die Vergangenheit, sondern stets die Gegenwart. Tief ist das Geheimnis, ja für diejenigen, die da teilen und trennen, ist es überhaupt nicht aufzuhellen und nicht zu durchdringen, während für die, die den Emmanuel zu einer Einheit verknüpfen, das ungetrübte Verständnis der heiligen Lehrsätze naheliegt, ja sich von selbst aufdrängt. Denn da der dem Erzeuger gleichewige und vor aller Zeit existierende Sohn zur Natur des Menschen herabgestiegen ist, nicht die Gottheit preisgebend, sondern die Menschheit annehmend, so kann man sich unschwer vorstellen, daß er aus dem Samen Davids geboren worden ist und in der Menschheit eine ganz neue Geburt gehabt hat. Das aber, was er angenommen hat, ist ihm nicht fremd, sondern wahrhaft sein eigen. Es wird deshalb als eins mit ihm angesehen, wie denn Entsprechendes sehr leicht auch bei der zusammengesetzten Menschennatur zu beobachten ist. Denn diese ist zusammengesetzt aus zwei der Natur nach ungleichen Bestandteilen, Seele nämlich und Leib, und beides zusammen stellt einen Menschen dar, so zwar, daß bisweilen nach dem Fleische allein das ganze Lebewesen benannt, aber auch unter dem Namen der Seele beides, Seele und Leib, verstanden wird. In gleicher Weise sind nun auch die Aussagen über Christus aufzufassen. Denn es ist ein Sohn und ein Herr Jesus Christus, sowohl vor dem Dasein des Fleisches als auch nach dem Erscheinen als Mensch.</p><h2>27</h2><p>Wir wollen deshalb den Herrn, der uns erkauft hat, nicht verleugnen, auch wenn wir mitunter Menschliches und dem Stande der Entäußerung Entsprechendes von ihm hören. Den Juden hat unser Herr Jesus Christus gesagt: „Wenn ihr Kinder Abrahams wäret, würdet ihr die Werke Abrahams tun. Nun aber sucht ihr mich zu töten, einen Menschen, der ich euch die Wahrheit gesagt habe. Das hat Abraham nicht getan.“Und Paulus schreibt von ihm: „Der in den Tagen seines Fleisches Bitten und Gebete mit lautem Ruf und Tränen dem, der ihn vom Tode retten konnte, dargebracht hat und seiner Gottesfurcht wegen erhört worden ist, der, obwohl er Sohn war, aus dem, was er litt, den Gehorsam erlernt hat.”Sollen wir deswegen Christus für einen bloßen Menschen halten, der in keiner Weise über unsere Natur erhaben war? Das sei fern! Werden wir aber zugeben, daß Gottes Weisheit und Macht bis zu einer derartigen Schwäche hinabgestiegen sei, daß er vor dem Tode bangte und den Vater um Rettung anflehte, und nun nicht mehr anerkennen, daß der Emmanuel der Natur nach Leben ist? Oder werden wir so einsichtig sein und die in jenen Worten ausgesprochene Armseligkeit auf die Menschheit und den Stand unserer Natur beziehen, aber doch die ihm als Gott zukommende überweltliche Herrlichkeit nicht anzweifeln, indem wir uns bewußt bleiben, daß er ebensowohl Gott wie auch Mensch oder menschgewordener Gott ist? Der hochgeschätzte Paulus soll in die Mitte treten und mit mächtiger Stimme sprechen: „Weisheit aber verkünden wir unter den Vollkommenen, freilich nicht die Weisheit dieser Welt und der Fürsten dieser Welt, die doch abgetan werden, aber wir verkünden die in Geheimnisse gehüllte Weisheit Gottes, die verborgen war, die keiner der Fürsten dieser Welt erkannt hatte; denn wenn sie sie erkannt hätten, würden sie den Herrn der Herrlichkeit nicht gekreuzigt haben.“Und sodann: „Der, da er der Abglanz seiner Herrlichkeit und das Ebenbild seines Wesens ist und das Weltall trägt mit dem Worte seiner Macht, nachdem er die Reinigung von unsern Sünden gewirkt, sich zur Rechten der Majestät in den Höhen gesetzt hat, um so größer geworden als die Engel, je vorzüglicher der Name ist, den er vor ihnen ererbt hat.”— „Herr der Herrlichkeit" zu sein und genannt zu werden, ist gewiß etwas überaus Großes, hoch hinausreichend über alles das, was geworden und ins Dasein gerufen ist. Ich übergehe die Menschennatur, weil sie gar so klein ist. Ich betone aber: Auch wenn jemand auf die Engel hinweisen und Fürstentümer und Throne und Herrschaften aufzählen und bis zu den am höchsten stehenden Seraphim vordringen wollte, er würde gleichwohl, wenn anders er gesunde Vernunft und Einsicht hat, zugestehen müssen, daß alles dies hinter jener so überaus großen Hoheit weit zurücksteht. Denn sie stellt, denke ich, eine unvergleichliche Auszeichnung dar und kann nur der über allem thronenden Natur zukommen. Wie nun kann der Gekreuzigte „Herr der Herrlichkeit" sein, der Abglanz des Vaters und das Ebenbild seines Wesens genannt, das Weltall tragend mit dem Worte seiner Macht, größer geworden als die Engel? Ich meine fast, er habe einen niedrigeren Stand erwählt, da er als Mensch erschien. Denn es steht geschrieben: „Den eine kleine Weile unter die Engel erniedrigten Jesus sehen wir wegen des Todesleidens mit Herrlichkeit und Ehre gekrönt."Werden wir also dem aus Gott dem Vater entsprungenen Worte die ihm zustehende wesenhafte Erhabenheit und die genaue Gleichheit mit dem Vater absprechen, wenn wir sehen, daß er sogar unter die Hoheit der Engel erniedrigt wird wegen der mit der Menschwerdung verbundenen Armseligkeit? Durchaus nicht. Wir dürfen, denke ich, weder das gottentstammte Wort nach der Fleischesannahme jemals gänzlich von der Menschennatur trennen noch auch die Menschennatur in Christus der göttlichen Herrlichkeit entkleiden,</p><h2>28</h2><p>Aber ich weiß wohl, daß einige jetzt fragen werden: Wer ist denn nun in Wahrheit Jesus Christus? Der Mensch aus dem Weibe oder das Wort aus Gott? Es würde zwar sehr töricht sein, sich übermäßig anzustrengen und Schwätzereien und Fabeleien im einzelnen zu beantworten. Das aber will ich doch sagen, daß es gefährlich und nicht straflos ist, eine Zweiteilung vorzunehmen und den Menschen und das Wort gesondert hinzustellen, weil die Menschwerdung dies nicht zuläßt und die gotteingegebene Schrift einen Christus verkündet. Denn man darf, behaupte ich, weder das gottentstammte Wort, getrennt von der Menschheit, noch auch den aus dem Weibe geborenen Tempel, losgelöst aus der Einigung mit dem Worte, Christus Jesus nennen. Christus ist vielmehr das gottentstammte Wort, wie es gemäß der Einigung der Menschwerdung auf unaussprechliche Weise mit der Menschheit verbunden ist, erhaben über die Menschheit, insofern es von Natur aus Gott und Sohn ist, aber freiwillig sich unterordnend, mit Rücksicht auf die angenommene Menschennatur. Deshalb sagte er das eine Mal: „Wer mich gesehen, hat den Vater gesehen“,und: „Ich und der Vater sind eins“;ein anderes Mal aber auch wieder: „Der Vater ist größer als ich.“Er ist nicht geringer als der Vater, insofern er der Wesenheit nach derselbe und in allem ihm gleich ist; er erklärt sich aber für geringer mit Rücksicht auf die angenommene Menschennatur.</p><h2>29</h2><p>Die heiligen Schriften stellen ihn daher bald schlechtweg als Menschen dar, unter Verschweigung seiner Gottheit, auf Grund der Menschwerdung, bald aber auch wieder schlechtweg als Gott, unter Verschweigung seiner Menschheit, und hier wie dort geben sie ihm das Seinige, weil das eine mit dem andern zur Einheit verbunden ist. Der göttliche Paulus, Hebräer aus Hebräern und vom Stamme Benjamin, berufener Apostel, schreibt an diejenigen, welche mittels des Glaubens gerechtfertigt worden waren und nun die Glieder des Fleisches, ich meine Unzucht und Leidenschaft, böse Begierde und Habsucht ertötet hatten: „Denn ihr seid gestorben, und euer Leben ist mit Christus verborgen in Gott.„Er selbst aber sagt von seinen Jüngern: „Heiliger Vater, bewahre sie in deinem Namen, die du mir gegeben hast, damit sie eins seien, wie wir es sind. Als ich bei ihnen war, bewahrte ich sie in deinem Namen, den du mir gegeben hast, und ich habe sie behütet, und keiner aus ihnen ist zugrunde gegangen außer dem Sohne des Verderbens, damit die Schrift erfüllt würde. Jetzt aber komme ich zu dir, und dieses spreche ich in der Welt, damit sie meine Freude vollkommen in sich haben.“— Verstehst du, wie er uns an diesen Stellen anscheinend nur von Seiten der Menschheit vorgestellt wird? Denn wir dürfen keineswegs folgern, daß er sich verborgen und die Welt verlassen habe. Sagt er doch deutlich: „Wahrlich, wahrlich, ich sage euch: Wo immer zwei oder drei in meinem Namen versammelt sind, da bin ich mitten unter ihnen“,und wiederum: „Ich bin bei euch alle Tage bis an das Ende der Welt.„Nicht selten hingegen scheint der hochheilige Paulus es ganz außer acht zu lassen, daß er auch als Mensch anerkannt werden muß. Er schreibt: „Paulus, Apostel nicht von Menschen her noch durch einen Menschen, sondern durch Jesus Christus“,und wiederum: „Ich tue euch aber kund, daß das Evangelium, welches von mir verkündet worden, nicht von Menschenart ist; denn ich habe es auch nicht von einem Menschen empfangen oder gelernt, sondern durch Offenbarung Jesu Christi„,und nochmals an einer andern Stelle: „Wenn wir aber Christus auch dem Fleische nach gekannt haben, so kennen wir ihn doch jetzt nicht mehr.“— Wer ist nun dieser Jesus Christus, der ihm die so unaussprechliche, untrügliche und göttliche Offenbarung seiner Geheimnisse aufleuchten ließ? Ist es nicht das Wort, welches Fleisch geworden und um unsertwillen die Geburt aus dem Weibe nicht verschmäht hat? Wie sollte das, was ich da sage, nicht wahr sein? Wir erinnern uns ja, daß der selige Gabriel zu der heiligen Jungfrau sagte: „Fürchte dich nicht, Maria, denn siehe, du wirst empfangen im Schoße und einen Sohn gebären, und du wirst seinen Namen Jesus nennen.“Das war, glaube ich, ein neuer Name, der von Seiten des Vaters durch die Stimme des Engels dem Worte gegeben wurde. So hatte auch ein prophetischer Ausspruch es vorhergesagt: „Und sie werden ihn mit einem neuen Namen nennen, den der Herr ihm geben wird.“Als deshalb der dem Vater gleich ewige und vor aller Zeit existierende Sohn und Eingeborene in den letzten Zeiten der Welt Mensch geworden und aus dem Weibe geboren und als Sohn dargetan und nun auch zum „Erstgeborenen„ bestellt und „einer unter vielen Brüdern“wurde, da bestimmt sein natürlicher Vater ihm auch einen Namen, sozusagen in Verfolg der Gesetze der Vaterschaft.</p><h2>30</h2><p>Einer und derselbe also ist sowohl Eingeborener als auch Erstgeborener. Eingeborener ist er als Gott, Erstgeborener, nämlich unter uns, vermöge der Einigung der Menschwerdung, und einer unter vielen Brüdern ist er als Mensch. In ihm und durch ihn sollten auch wir Söhne Gottes sein, der Natur nach und aus Gnade, der Natur nach er und er allein, der Teilnahme nach und aus Gnade wir [alle] durch ihn in der Kraft des Geistes. Wie also der Menschheit das Eingeborensein Christi zu eigen geworden, weil sie kraft der Menschwerdung dem Worte geeint wurde, so ist es dem Worte eigen geworden, einer unter vielen Brüdern und Erstgeborener zu sein, weil es dem Fleische geeint wurde. Im festen Besitze der Gottheit nun und über allem Wandel erhaben, ist er stets geblieben, was er war, auch als er Mensch wurde, mit der Oberherrschaft über alle Dinge und der höchsten Herrlichkeit gekrönt. Deshalb ist zugleich mit uns auch der heiligen und allseligen Schar der himmlischen Geister das Gebot gegeben worden, ihn anzubeten. Es wäre ja jedenfalls durchaus begreiflich gewesen, wenn diese Geister beim Anblick der Armseligkeit der Menschheit eine Anbetung verweigert und überhaupt jede Ehrenbezeigung abgelehnt und gegen die Verherrlichung dessen, der um unsertwillen einer wie wir geworden war, sich gesträubt hätten, ohne damit auch nur im entferntesten sich einer Verirrung schuldig zu machen. Denn auch für sie war das über Christus liegende Geheimnis noch undurchdringlich, und es bedurfte einer Offenbarung von seiten des Geistes, um sie, die in der Heiligkeit befestigt waren, vor einer Gottlosigkeit zu bewahren. Darum sagt der göttliche Paulus: „Wenn er aber den Erstgeborenen in die Welt einführt, spricht er: Und anbeten sollen ihn alle Engel Gottes."Denn der, der durch seine natürliche Eigenart über die ganze Welt erhaben ist und als Gott außer ihr existiert, ist als Mensch in sie eingegangen und ein Teil der Welt geworden, hat aber deswegen die göttliche Herrlichkeit nicht eingebüßt. Angebetet wird er ja als Eingeborener, wenngleich er auch Erstgeborener genannt wird, wie denn der letztere Name der Menschheit wegen besonders angemessen erscheint.</p><h2>31</h2><p>Werden wir also den Emmanuel als Menschen anbeten? Das sei fern! Das ist leeres Gerede und Täuschung und Trug. Wir würden uns sonst in keiner Weise von denen unterscheiden, die das Geschöpf angebetet haben statt des Schöpfers und Weltenbildners, „die die Wahrheit Gottes vertauscht haben mit der Lüge“, wie geschrieben steht.Wollten wir ebenso denken, so hätten wir jedenfalls mit ihnen zu hören: „Während sie prahlten, Weise zu sein, sind sie Toren geworden und haben die Herrlichkeit des unvergänglichen Gottes vertauscht mit der Gestalt eines Bildes von einem vergänglichen Menschen und von Vögeln und von vierfüßigen und kriechenden Tieren.”Oder würden wir diesen Götzendienern in Tat und Gesinnung nicht ganz an die Seite treten und die Herrlichkeit Gottes vertauschen mit der Lüge, mit der Gestalt eines Bildes von einem vergänglichen Menschen, wenn wir dem Emmanuel als bloßem Menschen und Einem der Unsrigen Anbetung widmen wollten? Und wie? Würde nicht auch das himmlische Heer der Engel den so tief in Wahnsinn Verstrickten beigesellt werden müssen? Und auch gegen den Kreis der Völker würden wir eine unentrinnbare Anklage auf Verirrung erheben können, und die Schmach der alten Sünden würde unaustilgbar sein. Denn die Völker irren, meine ich, auch jetzt noch, nicht weniger als ehedem, ohne den Pfad zum Rechten erkannt zu haben. Der selige Paulus hat, scheint es, allen Grund, ihnen vorzuhalten: „Allein damals zwar, als ihr Gott nicht kanntet, dientet ihr Göttern, die es in Wahrheit nicht sind. Jetzt aber, da ihr Gott erkannt habt oder vielmehr von Gott erkannt worden seid, wie kommt ihr dazu, euch wieder den schwachen und armen Anfangsgründen zuzuwenden, um ihnen von neuem zu dienen?Denn welchen Gott kennen sie noch, wenn Christus, an den sie glauben, nicht in Wahrheit Gott ist? Beten sie aber einen Menschen an, so liegen sie noch in den Schlingen des alten Irrwahns. Oder ist es nicht wahr, was ich sage? Freilich ist es wahr. Sieh also, christusliebender Kaiser, wie wir schon allein durch zwingende Vernunftgründe zu der Folgerung gedrängt werden, daß man das aus Gott dem Vater entsprungene Wort verständigerweise als wahren Gott anbeten muß, auch wenn es in unserer Gestalt erschienen ist, da die Verbindung der zwei Naturen zur Einheit wohl geeignet ist, alles, was etwa den Verdacht bloßer Menschheit erregen könnte, aus dem Wege zu räumen. Denn wenn die Natur des Wortes das Menschliche angenommen hat, so ist sie deshalb keine bloße Menschheit, überragt vielmehr das Angenommene durch ihre eigene Herrlichkeit und verbleibt im unerschütterlichen Besitze göttlicher Hoheit. In dieser Erkenntnis haben die Jünger ihn angebetet, indem sie sprachen: „Wahrhaftig, du bist der Sohn Gottes!",obwohl sie ihn mit Füßen gehen sahen und in einem Fleische, wie wir es haben, denn als Gott wandelte er wunderbarerweise auf hoher Meeresflut.</p><h2>32</h2><p>Der Gegner einer solchen Herrlichkeit wird aber vielleicht fragen: Und wer war der, der zu dem sama-ritanischen Weibe sagte: „Ihr betet an, was ihr nicht kennt; wir beten an, was wir kennen?„Wie kann denn der anzubeten sein, der sich selbst denen zuzählt, die anbeten? Ich antworte, daß die Frage „Wer war es?“ da, wo es sich einfach um Christus handelt, unzulässig und töricht ist. Denn er ist durchaus nicht geteilt. Der, der mit dem Weibe redete, war der eine und einzige Herr Jesus Christus, aus der anbetenden Menschheit und der anzubetenden Gottheit bestehend, in Wahrheit Gott und Mensch zugleich, wie man ja auch sonst Gegensätzliches von ihm aussagen kann. Denn insofern er Gott ist, ist er der Herr der Herrlichkeit; insofern er aber ein durch Teilnahme an Gott zu verherrlichender Mensch geworden ist, bedurfte er auch wieder der Herrlichkeit, weshalb er sprach: „Vater, verherrliche deinen Sohn!„Im übrigen aber: „Ein Herr, ein Glaube, eine Taufe“, wie geschrieben steht.Gleichwie nun ein Glaube an Christus und in Wahrheit eine Taufe, obwohl wir ja getauft werden im Glauben an Vater und Sohn und Heiligen Geist, in gleicher Weise und aus dem gleichen Grunde gibt es, glaube ich, eine Anbetung, des Vaters und des menschgewordenen Sohnes und des Heiligen Geistes, Denn der Eingeborene darf von der für uns sowohl wie für die heiligen Engel pflichtmäßigen Anbetung keineswegs ausgeschlossen werden, wenn er auch „Fleisch geworden ist und unter uns gewohnt hat„und zum „Erstgeborenen unter vielen Brüdern“bestellt ist. Denn welchen Grund gäbe es sonst für den Glauben an ihn? Wie sollte das nicht zu beachten sein? Denn ich kann nicht annehmen, daß sie, wenn sie anders der rechten Lehre eingedenk sein wollen, sagen werden, wir glaubten nur an das aus Gott dem Vater entsprossene Wort, des Fleisches entkleidet; wir dürfen aber auch nicht darauf verzichten, dieses andere beizufügen, wie es noch gesagt werden soll. Der Glaube gilt ja nicht Einem aus uns und nicht einem Menschen, sondern dem, der von Natur aus und in Wahrheit Gott ist „im Angesichte Christi„. Diesem Standpunkt pflichtet auch der weise Paulus bei, wenn er schreibt: „Denn wir verkünden nicht uns selbst, sondern Christus Jesus als Herrn, uns aber als eure Diener durch Jesus Christus. Denn Gott, der aus Finsternis Licht aufleuchten ließ, ist es, der in unsern Herzen aufgeleuchtet ist, um die Erkenntnis seiner Herrlichkeit im Angesichte Jesu Christi erstrahlen zu lassen.“Sieh, klar und deutlich ist die Erkenntnis Gottes und des Vaters aufgeleuchtet im Angesichte Christi. Deshalb sagte er auch: „Wer mich gesehen, hat den Vater gesehen„;„Ich und der Vater sind Eins.“</p><h2>33</h2><p>Das Ebenbild Gottes haftet aber nicht am Leibe, sondern besteht in durchaus göttlicher Macht und Herrlichkeit, und es war bei Christus klar ausgeprägt. Dadurch wollte er erkannt werden, und durch die Größe seiner Werke suchte er die Gedanken der Zuhörer in die Höhe zu heben, da das sichtbare Fleisch ihn in den Augen der Unverständigen immerhin niedriger erscheinen ließ. „Denn“, sagte er, „wenn ich nicht die Werke meines Vaters tue, so glaubt mir nicht; wenn ich sie aber tue, und wenn ihr mir nicht glauben wollt, so glaubt meinen Werken!”Ich denke aber, Christus habe dies damals gesagt, weil er wohl wußte, daß es keineswegs ohne Nutzen sei. Da sie nämlich meinten, der um unsertwillen Mensch Gewordene sei nicht der Natur nach Gott, sondern nur ein Mensch wie wir, und deswegen manche den Glauben an ihn als unannehmbar erachteten, so wollte er ihr Zaudern und Zögern in zwingender Weise abschneiden, indem er den Glauben der Natur der Gottheit, wie sie der Person des Vaters eignet, vorbehielt und nicht für die der unsrigen gleiche Armseligkeit beanspruchte. Daher sagte er: „Wer an mich glaubt, glaubt nicht an mich, sondern an den, der mich gesandt hat; und wer mich sieht, sieht den, der mich gesandt hat."Ist es nicht, wie wenn er sagte: O ihr Hörer meiner Worte, denkt nicht gering und niedrig von mir! Wisset vielmehr, daß ihr, wenn ihr mir, den ihr im Fleische vor euch seht, Glauben schenkt, nicht einfach an einen Menschen glaubt, sondern an den Vater selbst durch mich, seinen Sohn, der ihm in allem gleich und desselben Wesens ist, um euretwillen Fleisch geworden und in die armselige Hülle der Menschheit gekleidet, trotzdem jedoch in seinem Sein und Wirken dem Vater gleich und unverkürzt ganz derselben Herrlichkeit teilhaftig.</p><h2>34</h2><p>Anderswo aber sieht man ihn auch wieder den Glauben nicht abweisen, sondern ohne irgendwelche Trennung oder Unterscheidung wie in eigener Person annehmen, obwohl er Mensch geworden war. Als er den Blindgeborenen geheilt und ihm das süße und ungewohnte Licht mitgeteilt hatte, ward er begreiflicherweise von allen Seiten bewundert.Der von seinem Leiden Befreite wurde von den Juden zur Rede gestellt und gestand, wer der Arzt gewesen. Als nun Jesus ihn traf, sprach er zu ihm: „Glaubst du an den Sohn Gottes?„, und als dieser erwiderte; „Wer ist es, Herr, daß ich an ihn glaube?“, antwortete er: „Und du hast ihn gesehen, und der, der mit dir redet, der ist es.“ Jener aber sagte: „Ich glaube, Herr“, und er betete ihn an. Nun ist aber doch allen bekannt, daß die göttliche und allerhöchste Natur durchaus unsichtbar ist; denn „niemand hat jemals Gott gesehen„, wie geschrieben steht.Wenn aber das aus Gott dem Vater entsprungene Wort, seine Menschennatur, wie sie an sich war, ganz beiseite schiebend, rein und allein für sich Glauben forderte, warum hat er den Geheilten nicht zum Nachdenken über die besondere Natur Gottes gemahnt, sondern sie ihm leiblich gezeigt, wie sie mit Augen gegenwärtig zu sehen war? Er sagte ja: „Und du hast ihn gesehen, und der, der mit dir redet, der ist es.“ Wir werden doch nicht bezweifeln, daß er ihm das Fleisch gezeigt hat. Wie soll er übrigens weiterhin das Fleisch gewesen sein, wenn nicht infolge der Einigung, vermöge deren er das war, was ihm eigen geworden? So ist es ja auch bei uns der Fall. Denn auch Aussagen über den aus Seele und Leib bestehenden Menschen in seiner Gesamtheit, ungeteilt und ungeschmälert, werden oft von dem Fleische allein hergenommen.</p><h2>35</h2><p>Der weise Johannes hat uns auch irgendwo geschrieben: „Noch viele andere Zeichen hat Jesus vor seinen Jüngern gewirkt, die nicht in diesem Buche geschrieben sind. Diese aber sind geschrieben, damit ihr glaubet, daß Jesus der Christus, der Sohn Gottes, ist, und damit ihr durch den Glauben das Leben habet in seinem Namen.“Nicht weniger aber muß man auch den göttlichen Petrus bewundern, der klar und deutlich zu den Juden sprach: „Vorsteher des Volkes und Älteste, wenn wir heute zur Rede gestellt werden über die einem kranken Menschen erwiesene Wohltat, durch wen er gesund geworden sei, so soll euch allen und dem ganzen Volke Israel bekannt sein, daß er im Namen Jesu Christi des Nazareners, den ihr gekreuzigt habt, den Gott von den Toten auferweckt hat, daß er in diesem Namen gesund vor euch steht.”Und weiterhin wieder: „Und in keinem andern ist das Heil; denn es ist kein anderer Name unter dem Himmel den Menschen gegeben, in welchem wir gerettet werden müßten.“— Wer ist nun der, der sich dem Tode unterzogen und in Herrlichkeit auferweckt worden und aus Nazareth gekommen, wenn nicht Christus Jesus, das heißt der, der vor aller Zeit aus Gott dem Vater auf unaussprechliche Weise gezeugt, in der letzten, dem Ende zugehenden Weltzeit aber auch körperlich aus dem Weibe geboren worden? Wer also den Glauben an ihn annimmt, wird, das herrliche Ehrengeschenk erhalten, wird nämlich Sohn Gottes genannt werden. Denn „allen, welche ihn aufnahmen, gab er die Gewalt, Kinder Gottes zu werden, denen, die an seinen Namen glauben, die nicht aus dem Geblüte und nicht aus Fleischeswillen und nicht aus Manneswillen, sondern aus Gott geboren sind”.Zu dem Zwecke nämlich, derjenige zu werden, „der unter allen den Vorrang hat", wie geschrieben steht,ist er aus dem Weibe geboren worden.</p><h2>36</h2><p>Da er aber der Erstling der Schöpfung ist, welche durch Heiligung zu Gott hin erneuert werden soll, so erwies er sich auch vor allen andern als aus dem Geiste geboren. Er umging die Verbindung von Mann und Weib, nicht um die Natur der Unehre und Schmach anzuklagen — denn „in Ehren gehalten sei die Ehe“,5 und „der Schöpfer von Anfang an hat sie als Mann und Weib erschaffen”—, sondern um das Menschliche schon irgendwie zum Größeren und unvergleichlich Erhabeneren hinzuwenden. Denn er wollte, daß auch wir Geistesgeborene seien, nicht Mannesgeborene. Sagte er doch: „Nennt niemanden auf Erden euren Vater, denn Einer ist euer Vater, der im Himmel ist; ihr alle aber seid Brüder.“Es ist also durchaus nichts Tadelnswertes, an ihn zu glauben, es wird vielmehr ausgezeichnet durch Vergebung der Sünden. Denn so schreibt hinwieder der auserwählte Paulus: „Da wir aber wissen, daß der Mensch nicht gerechtfertigt wird aus Gesetzeswerken, außer durch den Glauben an Jesus Christus, so haben auch wir an Christus geglaubt, um in ihm gerechtfertigt zu werden.“Ich möchte aber nicht versäumen, noch einmal zu wiederholen, was ich vorhin gesagt habe, daß nämlich unter Christus Jesus nicht das gottentstammte Wort für sich allein zu verstehen ist, sondern das Wort, welches das Menschliche angenommen hat und unvermischt mit dem Fleische vereint ist. Dieses Wort, wie es sichtbar geworden und in unserer Gestalt erschienen war, zeigte der Vater den heiligen Aposteln, während von oben her die Stimme erscholl: „Dieser ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe; ihn sollt ihr hören.“Beachte wohl, daß er nicht sagt: in diesem ist mein Sohn, damit man nicht meine, er sei zu teilen, und es sei gleichsam einer in dem andern, sondern einer und derselbe ist er, gemäß der Einigung der Menschwerdung. Daß es aber sündhaft ist, zu widersprechen, und äußerst gefährlich, davon kann Johannes überzeugen, der wie folgt schreibt: „Dies ist das Zeugnis Gottes, daß er Zeugnis gegeben hat von seinem Sohne. Wer an den Sohn glaubt, hat das Zeugnis Gottes in sich. Wer Gott nicht glaubt, macht ihn zum Lügner, weil er nicht glaubt an das Zeugnis, welches Gott gegeben hat von seinem Sohne.“Er hat aber bezeugt: Dieser, der im Fleische ist und in Knechtsgestalt, er ist einzig und allein und im eigentlichen Sinne wahrhaft mein Sohn. Wir werden aber notwendig. auch zugeben müssen, daß die durch die heilige Taufe vermittelte herrliche Gnade und das in ihr gewonnene Leben und die Teilnahme an Gott vermöge der Heiligung im Geiste durch Jesus Christus gewirkt worden sind. Wir erinnern uns, daß Johannes sagte: „Der nach mir kommen wird, ist stärker als ich, und ich bin nicht würdig, seine Schuhe zu tragen; er wird euch taufen im Heiligen Geiste und Feuer.”Sollen wir nun, sag’ mir, annehmen, es sei Sache unserer Menschheit, im Heiligen Geiste und Feuer taufen zu können? Wie würde das möglich sein? Er spricht aber von einem Manne, der bald kommen und in Erscheinung treten soll, und sagt, dieser werde taufen in Feuer und im Heiligen Geiste. Nicht einen fremden Geist teilt er den Täuflingen mit, nach Art eines Knechtes oder Dieners, sondern als Gott der Natur nach vermittelt er ihnen mit höchster Machtvollkommenheit den von ihm ausgehenden und ihm eigenen Geist, durch welchen uns auch das göttliche Merkmal aufgedrückt wird. Denn unsere Erneuerung zu dem göttlichen Bilde, zu Christus Jesus, besteht nicht in einer leiblichen Umwandlung — das anzunehmen wäre ganz ungereimt —, sondern darin, daß wir des Heiligen Geistes teilhaftig werden und damit in den Besitz Christi selbst gelangen, so daß wir freudig ausrufen können: „Es frohlocke meine Seele im Herrn, denn er hat mich bekleidet mit dem Mantel des Heiles und dem Gewände der Freude!“„Denn”, heißt es, „ihr alle, die ihr auf Christus getauft worden seid, habt Christum angezogen."</p><h2>37</h2><p>Es könnte nun jemand kommen und fragen: Sind wir denn also auf einen Menschen getauft worden? Werden wir diese Frage bejahen? Wir werden vielmehr entgegnen: Sprich nicht so, o Mensch! Was fängst du an, du Unvernünftiger? Du drückst unsere Hoffnung hinab auf die Erde. Nicht auf einen bloßen Menschen sind wir getauft worden, sondern auf den menschgewordenen Gott, der diejenigen, die sich zum Glauben an ihn bekennen, von Strafe und von den früheren Verschuldungen freispricht. Sagt ja der göttliche Petrus in seiner Ansprache an die Juden auch: „Tut also Buße, und ein jeder von euch soll sich taufen lassen auf den Namen Jesu Christi zur Nachlassung eurer Sünden, und ihr werdet die Gabe des Heiligen Geistes empfangen.“Indem er nämlich dem, der sich zu ihm hinwendet, die Sünden vergibt, salbt er ihn überdies mit seinem Geiste, den er als das aus Gott dem Vater entstammte Wort mitteilt und aus seiner Natur heraus auf uns überströmen läßt. Als er dies zur Zeit seines Wandels im Fleische tat, hat er um der Einigung willen als Mensch auch leiblich den Geist eingehaucht. Denn er hauchte die heiligen Apostel an, während er sprach: „Empfanget den Heiligen Geist!”„Und nicht in kärglichem Maße gibt er den Geist“, nach dem Worte des Johannes,sondern aus sich selbst heraus teilt er ihn mit, ganz so wie auch der Vater. Kann man doch sehen, wie der göttliche Paulus, ohne irgendeinen Unterschied zu machen, den Geist bald Gott dem Vater zuweist, bald aber auch wieder dem Sohne. Er schreibt nämlich wie folgt: „Ihr aber seid nicht im Fleische, sondern im Geiste, wenn anders der Geist Gottes in euch wohnt. Wenn aber jemand den Geist Christi nicht hat, der ist nicht sein. Wenn jedoch Christus in euch ist, so ist zwar der Leib tot um der Sünde willen, der Geist aber ist lebendig um der Gerechtigkeit willen.”Es steht demnach fest, daß der Geist auch dem Sohne eigen ist, und zwar nicht nur dem aus dem Vater entsprungenen Worte, sondern auch dem uns gleich gewordenen Menschen, weil er als solcher der in seiner Natur gründenden Eigenheiten der Gottheit nicht ermangelt. Ist er doch das Leben aller vermöge der unaussprechlichen Geburt aus dem lebendigen Vater, wenngleich es auch wieder heißt, daß er gleich uns lebendig gemacht werde. So kann man auch sehen, daß er seinem Fleische die Herrlichkeit göttlicher Wirksamkeit schenkt, während er anderseits auch wieder das Fleisch sich selbst zu eigen macht und der Einigung der Menschwerdung entsprechend gewissermaßen auch seiner Natur beilegt.</p><h2>38</h2><p>Oder erscheint es nicht durchaus angemessen, daß das der Natur nach aus Gott dem Vater stammende Wort von oben und vom Himmel her kommt und diejenigen lebendig machen kann, denen es das Leben mitteilen will? Soll aber, sag’ mir, das Schaffen nach Art Gottes auch Menschen zustehen? Keineswegs. Wie nun? Er macht uns lebendig als Gott, aber nicht bloß dadurch, daß er uns des Heiligen Geistes teilhaftig macht, sondern auch dadurch, daß er uns das angenommene Fleisch als Speise vorsetzt. Er sagte ja: „Wenn ihr nicht das Fleisch des Menschensohnes eßt und sein Blut trinkt, habt ihr das Leben nicht in euch.“Und als die Juden ihn einst verspotteten und das höhere Lob, ich weiß nicht wie, für den seligen Moses beanspruchen wollten und geradezu erklärten: „Unsere Väter haben das Manna in der Wüste gegessen, wie geschrieben steht: Brot vom Himmel gab er ihnen zu essen, was tust du für ein Zeichen, daß wir dir glauben? Was wirkst du?”,der du uns angeblich von oben und vom Himmel her den Leib heruntergebracht —, da sprach er: „Wahrlich, wahrlich, ich sage euch: nicht Moses hat euch das wahre Brot vom Himmel gegeben, denn das Brot Gottes ist der, der vom Himmel herabkommt und der Welt das Leben gibt.“Und wie mit dem Finger auf sich- selbst, den Fleischgewordenen, hinweisend, fügte er noch hinzu: „Ich bin das lebendige Brot, der ich vom Himmel herabgekommen bin. Wenn jemand von diesem Brote ißt, wird er leben in Ewigkeit. Und das Brot, welches ich geben werde, ist mein Fleisch, welches ich geben werde für das Leben der Welt. Wer mein Fleisch ißt und mein Blut trinkt, bleibt in mir und ich in ihm. Wie mich der lebendige Vater gesandt hat und ich lebe um des Vaters willen, so wird der, welcher mich ißt, auch leben um meinetwillen.”— Und doch bleibt es jedenfalls wahr, daß sein Fleisch nicht vom Himmel herabgestiegen, sondern aus der Jungfrau geboren ist, gemäß den Schriften. Daß aber nicht das Wort die Speise ist, sondern die durch die Menschwerdung erfolgte Verbindung der beiden Naturen zu einer Einheit, können wir aus sehr vielen Stellen ersehen. Zu Nikodemus, der das Geheimnis nicht verstand und törichterweise ausrief: Wie kann dies geschehen?, sprach er: „Wenn ich euch Irdisches sage und ihr nicht glaubt, wie werdet ihr glauben, wenn ich euch Himmlisches sage? Und niemand ist in den Himmel hinaufgestiegen außer dem Menschensohne, der vom Himmel hinabgestiegen.“Und zu den Juden, die an der gleichen Ungelehrigkeit krankten und ihn, ich weiß nicht wie, verlachen wollten, weil er gesagt hatte, sein Leib sei lebenspendend und vom Himmel her, sprach er: „Das ärgert euch? Wenn ihr nun den Menschensohn dorthin hinaufsteigen seht, wo er früher war?”Wir aber werden vielmehr sagen, daß der Emmanuel vom Weibe geboren wurde. Wo ist er nun früher gewesen? Oder wie ist er dorthin hinaufgestiegen, wo er gewesen sein will, da doch der ihm geeinte Leib durch die heilige Jungfrau geboren wurde? Und werden wir nicht auch zugestehen, daß das irdische Fleisch nicht imstande ist, Leben zu spenden, soweit es auf seine eigene Natur ankommt? Wie nun, sag’ mir, soll das Fleisch lebenspendend sein? Oder wie soll das, was von der Erde stammt, vom Himmel sein? Offenbar durch die Einigung mit dem lebendigen und vom Himmel gekommenen Worte. Das wird das einzig Richtige und mit den heiligen Schriften Übereinstimmende sein. Er ist ja nicht anders geworden und ist auch im Fleische als göttlicher Schöpfer tätig..</p><h2>39</h2><p>Als Gewährsmann für diese Lehre rufe ich wieder den himmlisch gesinnten und göttlichen Paulus an, der folgendermaßen geschrieben hat: „Dank sagend Gott und dem Vater, der uns tauglich gemacht, teilzunehmen an dem Lose der Heiligen im Lichte, der uns aus der Gewalt der Finsternis errettet und uns versetzt hat in das Reich des Sohnes seiner Liebe, in welchem wir die Erlösung haben, die Vergebung der Sünden, welcher das Abbild des unsichtbaren Gottes ist, der Erstgeborene vor aller Schöpfung. Denn in ihm ist alles erschaffen worden, was im Himmel und was auf Erden ist, das Sichtbare und das Unsichtbare, seien es Throne oder Herrschaften, seien es Fürstentümer oder Gewalten, alles ist durch ihn und für ihn erschaffen worden, und er ist vor allem, und in ihm hat alles Bestand, und er ist das Haupt des Leibes der Kirche, er der Anfang, der Erstgeborene aus den Toten, auf daß er in allem den Vorrang habe. Denn es hat Gott gefallen, daß in ihm die ganze Fülle wohne und daß er durch ihn alles mit sich versöhne, Frieden stiftend durch das Blut seines Kreuzes, sowohl was auf Erden als auch was im Himmel ist.“— Sieh, er sagt wieder deutlich, daß alles durch ihn und für ihn erschaffen worden und daß er vor allem ist und in ihm alles Bestand hat, und daß er der Erstgeborene aus den Toten ist, der Frieden gestiftet durch das Blut seines Kreuzes und versöhnt hat, was im Himmel und was auf Erden ist. Wer ist nun der Erstgeborene aus den Toten wenn nicht Christus Jesus, das heißt das Wort im Fleische und mit dem Fleische? Jedenfalls ist ja das Wort, welches Gott war, nicht in seiner eigenen Natur gestorben, und ebensowenig kann ein Mensch wie wir der Schöpfer aller Dinge sein. Schöpfer ist er vielmehr als Gott, wenngleich er es nach der Einigung auch im Fleische ist; und Erstgeborener aus den Toten ist er als Mensch, wenngleich er der Menschwerdung wegen die Gottheit nicht abgelegt hat.</p><h2>40</h2><p>Auch anderswo siehst du die Geistesträger in demselben Gedankenkreise sich bewegen. Johannes sagt: „Im Anfang war das Wort, und das Wort war bei Gott, und Gott war das Wort. Dieses war im Anfang bei Gott. Alles ist durch dasselbe geworden, und ohne dasselbe ist nichts geworden,“Paulus hinwieder sagt: „Es ist ein Gott Vater, aus dem alles, und ein Herr Jesus Christus, durch den alles ist.“Wenn jedoch nach der Einigung des Wortes mit dem Fleische eine Zweiteilung vorzunehmen und die Einheit des Sohnes gemäß der Ansicht gewisser Leute in zwei verschiedene Personen zu zerreißen wäre, wie könnte dann alles durch Jesus Christus erschaffen worden sein? Es ist aber alles durch ihn erschaffen worden. Demnach ist dem aus dem Vater stammenden Worte das, was ihm von Natur aus und als Eigenbesitz zukam, offenbar auch gewahrt geblieben, als es Mensch ward. Eine Trennung zu wagen, ist also sehr gefährlich. Denn es ist ein Herr Jesus Christus, und durch ihn hat der Vater alles erschaffen. Auch er ist mithin Schöpfer als Gott und lebenspendend als Leben, ein Mittleres, welches menschliche Eigentümlichkeiten mit den übermenschlichen vereinigt. Deshalb ist er ja „der Mittler zwischen Gott und den Menschen” nach den Schriften,von Natur Gott, aber nicht ohne das Fleisch, und in Wahrheit Mensch, aber nicht bloßer Mensch wie wir, weil er bei der Fleischwerdung blieb, was er war. Denn es steht geschrieben: „Jesus Christus ist derselbe gestern und heute und in alle Ewigkeit.“</p><h2>41</h2><p>Wir bekennen und glauben also, daß der Emmanuel in den letzten Zeiten der Welt durch die heilige Jungfrau geboren worden ist. Und wie sollte das nicht wahr sein? Das „gestern und heute" aber, christusliebender Kaiser, bezeichnet die gegenwärtige und die schon vergangene Zeit. Er ist jedoch wirklich derselbe auch für die vergangene Zeit, da er noch nicht im Fleische geboren war. Denn das Wort war im Anfang; und weil aus dem ewigen und unwandelbaren Gott und Vater entsprungen, ist es auch selbst seiner Natur nach ewig und unwandelbar. Allerdings hat dieses Wort gleichzeitig mit der Menschwerdung einen ganz neuen Namen erhalten, den Namen Christus Jesus. Davon ist ja schon sehr häufig die Rede gewesen. Nun beachte wohl, daß es heißt, Christus Jesus, und nicht etwa das Wort, sei derselbe gestern und heute und in Ewigkeit! Die Menschennatur kann aber nicht unwandelbar sein und in demselben Zustande beharren, da sie doch der Entwicklung unterliegt, vor allem der Versetzung aus dem Nichts ins Sein und Leben. Soll also die Heilige Schrift von der Wahrheit abgeirrt sein und denjenigen schon vorher da sein lassen, der gestern noch nicht da war? Das behaupte ich nicht. Daran fehlt noch viel. Christus Jesus ist derselbe gestern und heute und in Ewigkeit. Damit leugne ich die Vorzeitlichkeit und Unveränderlichkeit des Wortes durchaus nicht, auch wenn es Fleisch geworden; ich glaube vielmehr, daß es auch in der Einigung mit seinem Fleische sich wieder als denjenigen bekundet, der er gestern und der er vorher war. Der unsinnige Jude knirschte und wollte ihn steinigen, konnte sich aber zum Glauben nicht entschließen. Er vermochte es nicht zu fassen, daß der, der dem Aussehen nach ein Mensch wie wir war, das Vorrecht eines übermenschlichen Alters beanspruchte. Als Gott sprach er: „Wahrlich, wahrlich, ich sage euch, ehe Abraham auftrat, bin ich“, als jene entgegnet hatten: „Du hast noch nicht fünfzig Jahre und du hast Abraham gesehen?”Auch Johannes aber sagte: „Dieser ist es, von dem ich euch gesagt habe: nach mir kommt ein Mann, der vor mir aufgetreten ist, weil er früher war als ich.“Er kennt und benennt den Emmanuel als Mann; wie aber kann er sagen, derselbe sei vor ihm aufgetreten und früher gewesen als er, da er doch erst später geboren wurde und nach ihm kam? Vielleicht, fällt mir ein, wird jemand antworten, der Herrlichkeit nach sei er vorher aufgetreten und früher gewesen. Daß dies jedoch falsch und töricht sein würde, das zu beweisen, bedarf es keiner langen Rede. Denn wenn wir das „vor” von der höhern Herrlichkeit verstehen, so werden wir unverkennbar folgerichtig das „nach" auf eine geringere Ehre deuten müssen. Wir wären also zu der Annahme gezwungen, Christus werde an Herrlichkeit durch Johannes übertroffen und stehe ihm nach. Er sagte ja: „Nach mir kommt ein Mann." O des Unverstandes! Vor einer solchen Meinung werden wir bewahrt durch das rechte Verständnis des Psalmenwortes: „Wer in den Wolken wird dem Herrn gleichkommen? Wer dem Herrn ähnlich sein unter den Söhnen Gottes?“Man muß demnach auch dem Fleischgewordenen den Vorrang zuerkennen, weil er der Natur nach Gott ist, mit dem Fleische geeint und gewohnt, seinen Leib an den Gütern seiner Natur teilnehmen zu lassen.</p><h2>42</h2><p>Daß es sich wirklich so verhält und dies die Wahrheit ist, kannst du aber, wenn du willst, auch aus andern Zeugnissen ersehen. Durch einen der heiligen Propheten hat Gott einmal von dem dem Fleische nach aus dem Samen Davids stammenden Christus gesagt: „Und du, Bethlehem, Haus Ephrata, bist nicht die geringste unter den Tausenden Judas; aus dir wird der hervorgehen, der da Herrscher sein soll in Israel, dessen Ursprung von Anfang an ist seit den Tagen der Ewigkeit.„Der göttliche Paulus aber sagt von den Söhnen Israels: „Alle sind auf Moses getauft worden in der Wolke und im Meere und alle haben die geistige Speise gegessen und alle denselben geistigen Trank getrunken; sie tranken nämlich aus dem ihnen folgenden geistlichen Felsen, der Fels aber war Christus.“— Nun beachte, wie der dem Worte eigene Altersvorrang zufolge der Einigung der Menschwerdung Christus Jesus zugeschrieben wird! Oder sind die Worte nicht klar? Augenscheinlich wird doch von dem Bethlehemiten, einem Menschen und vom Weibe Geborenen, gesagt, daß er seinen Ursprung hat vom Anfang der Ewigkeit an. Denn im Anfang und vor aller Ewigkeit war das Wort, welches Mensch geworden, und dieses Wort war der Fels, welcher das dürstende Israel mit den unverhofften und ungeahnten Wassern tränkte, obwohl das Wort dem Fleische und der Menschheit nach erst in den letzten Weltzeiten geboren und zu seiner Sendung in diese Welt von Gott dem Vater gesalbt worden ist. Deshalb und aus keinem andern Grunde ist es Christus genannt worden. Christus aber war laut Paulus der Fels. Es kämpft und streitet aber für diese Lehre auch der weise Johannes, der die Naturen gewissermaßen zusammenfaßt und die einer jeden Natur innewohnenden Eigentümlichkeiten zu einer Einheit verbindet. Schau, was er sagt: „Was von Anfang an war, was wir gehört, was wir gesehen haben mit eigenen Augen, was wir geschaut und unsere Hände berührt haben, von dem Worte des Lebens [verkünden wir euch], und das Leben ist geoffenbart worden, und wir haben es gesehen und bezeugen und verkünden euch das ewige Leben, welches beim Vater war und uns geoffenbart worden ist.„Sieh, von dem, der im Anfang war, sagt er ausdrücklich, er sei sichtbar geworden und habe sich sogar berühren lassen. Thomas rief ja aus: „Mein Herr und mein Gott!“, nachdem er mit dem Finger seine Seite und die Wundmale der Nägel befühlt hatte.Auch der göttliche Lukas sagt, die heiligen Apostel seien Augenzeugen und Diener des Wortes geworden.Der Unkörperliche ist eben in Erscheinung getreten, und der Ungreifbare ist greifbar geworden,weil er das irdische Fleisch nicht als fremdes Gewand getragen, sondern zu seinem Tempel gemacht und in ihm und mit ihm sich als Gott und Herrn zu erkennen gegeben hat. Auch der göttliche Paulus hat, wie du weißt, irgendwo geschrieben: „Denn keiner von uns lebt für sich und keiner stirbt für sich. Denn wenn wir leben, so leben wir für den Herrn, und wenn wir sterben, so sterben wir für den Herrn. Mögen wir also leben oder mögen wir sterben, wir gehören dem Herrn an. Denn dazu ist Christus gestorben und lebendig geworden, daß er über die Toten und über die Lebenden herrsche.“</p><h2>43</h2><p>Es steht demnach unzweifelhaft fest, daß er die Herrschaft erlangt hat über die Toten und über die Lebenden, weil er eben dazu und zu keinerlei anderm Zwecke gestorben und auferweckt worden ist. Wer war es nun, der sich dem Tode unterzog und wieder auflebte? Offenbar der Sohn. Das wird, glaube ich, ein jeder, wer immer es sei, zugestehen. Was werden wir nun sagen? Ist das Gott dem Vater entstammte Wort sterblich und der Vergänglichkeit unterworfen oder ist es als Leben über Tod und Vergänglichkeit erhaben? Aber allen leuchtet doch ein, daß er als Leben Macht hat über den Tod. Wie ist er dann unter die Toten gekommen, wenngleich als „ein Freier“, nach den Schriften?Das Wort an sich kann ja nicht sterben. Wir behaupten daher, daß sein Fleisch gestorben ist und deshalb gesagt wird, er selbst habe den Tod erlitten. Nicht ohne das Fleisch also, sondern in demselben und mit demselben hat er die Herrlichkeit der Herrschaft erlangt. Dem Gesetze des Fleisches und unserer Natur gemäß ist er gestorben und auferweckt worden, indem er durch das Erleiden des Todes seine Menschennatur und durch das Wiederaufleben seine göttliche Macht bekundete. Durch beides zusammen sollte dargetan werden, daß er einerseits Mensch wie wir und anderseits als Gott über uns erhaben ist, und so sollte er sich als den Herrn aller erweisen, er, der vor Annahme des Fleisches mit seinem Vater herrschte. Als solchen erkannte Nathanael ihn und sprach: „Rabbi, du bist der Sohn Gottes, du bist der König Israels.„Er selbst aber sagte zu seinen Jüngern: „Ihr nennt mich Meister und Herr, und ihr sagt es mit Recht, denn ich bin es.“Und sein Wort durch die Tat bekräftigend, läßt er Sünden nach und verleiht Gewalt gegen unreine Geister, um sie auszutreiben und jede Krankheit und jede Schwäche unter dem Volke zu heilen. „Im Namen Jesu Christi des Na-zareners„ ist der geheilt worden, der an den Füßen gelähmt war und an der Schönen Pforte saß.Abgeschüttelt hat die so langwierige und gänzlich unheilbare Doppelkrankheit jener Äneas, zu welchem der göttliche Petrus sprach: „Äneas, Jesus Christus heilt dich.“</p><h2>44</h2><p>Von allen Seiten also zur Wahrheit hingedrängt, eifrigst bestrebt, der Lehre der Heiligen Schriften gerecht zu werden, und den Aussprüchen der Väter folgend, glauben wir, daß der, der dem Fleische nach aus der Wurzel Jesse, aus dem Samen Davids, aus dem Weibe geboren worden, in Wahrheit der Sohn Gottes ist, als Mensch mit uns unter dem Gesetze und als Gott über uns und über dem Gesetze stehend, unsertwegen und mit uns unter den Toten weilend, über uns seinetwegen Lebensspender und Leben. Wir berauben die Menschennatur nicht der Gottheit und entkleiden nach der unaussprechlichen und unbegreiflichen Einigung das Wort nicht der Menschheit. Wir bekennen vielmehr einen und denselben Sohn, der aus zwei Wesenheiten in unfaßbarer Weise zu einer aus beiden bestehenden Einheit geworden ist, durch die denkbar höchste Einigung nämlich und nicht durch eine Umwandlung der Natur.</p><h2>45</h2><p>Welch hoher Gewinn denen winkt, die so glauben, erklärt der Jünger Christi mit den Worten: „Wer da bekennt, daß Jesus der Sohn Gottes ist, in dem bleibt Gott und er in Gott.“Daß aber Jesus Christus, der dem Fleische nach aus David ist, der Natur nach und in Wahrheit der Sohn Gottes ist, gemäß dem Worte: „Das Wort ist Fleisch geworden und hat unter uns gewohnt”,das bestätigt der weise Johannes, indem er schreibt: „Und wir wissen, daß der Sohn Gottes gekommen ist und uns das Verständnis gegeben hat, daß wir den wahren Gott erkennen. Und wir sind in dem wahren [Gott] in seinem Sohne Jesus Christus. Dieser ist der wahre Gott und ewiges Leben."Und durch ihn und mit ihm sei Gott dem Vater die Ehre, mitsamt dem Heiligen Geiste, in alle Ewigkeiten! Amen.</p>
