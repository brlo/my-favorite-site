      <p><em>Große Katechese, übersetzt von Übersetzung der BKV-Ausgabe (BKV 1. Reihe, Bd. 56, Kempten/München 1927).</em></p><h2>0</h2><p>Individueller Unterricht! ― Nur* ein* Gott!</p><p>Die Unterweisung in der Glaubenslehre ist eine Pflicht für die Vorsteher des Geheimnisses der Religion, damit die Kirche durch den Zuwachs der Auserwählten dadurch voll werde, daß das Wort des Glaubens auf dem Wege des Unterrichtes dem Ohr der Ungläubigen vermittelt wird. Doch nicht dieselbe Art des Unterrichtes wird für alle, die zu dem Worte herantreten, passen, sondern man muß die Belehrung jedesmal nach der Verschiedenheit ihrer Religion einrichten, so daß man zwar dasselbe Lehrziel im Auge hat, aber bei allen nicht die nämliche Lehrmethode in Anwendung bringt. Von einer anderen Ansicht ist ja der Jude befangen und von einer anderen der im Heidentum Lebende; desgleichen werden der Anomöer, der Manichäer, die Anhänger des Marcion, Valentin, Basilides und wie die übrige Liste der in Ketzerei Gefallenen lautet, von denen jeder von eigentümlichen Ansichten beherrscht ist, naturgemäß fordern, daß man den Kampf gegen ihre Sondermeinungen aufnimmt; denn nach der Art der Krankheit muß auch das Heilverfahren sich richten. Darum darfst du die Vielgötterei des Heiden und den Unglauben des Juden gegenüber dem Eingebornen Gottes nicht mit denselben Mitteln behandeln; ebensowenig kannst du den in Ketzereien Verirrten die trugvollen Märchen ihrer Lehrsätze mit den nämlichen Gründen umstoßen; und was den Sabellius zurechtbringen könnte, wird schwerlich auch den Anomöer bekehren; gerade so überwinden die Waffen, welche den Manichäer besiegen, nicht auch den Juden. Vielmehr muß man, wie gesagt, auf die Meinungen der einzelnen Rücksicht nehmen und die Belehrung jedesmal im Hinblick auf die besonderen Irrtümer des betreffenden Gegners einrichten; dazu gehört ferner, daß man bei jedem Unterricht gewisse Grundwahrheiten und wohlbegründete Prämissen im voraus feststellt, so daß man, von dem von beiden Teilen Zugestandenen ausgehend, in Form von Folgerungen die ganze Wahrheit entwickelt.</p><p>Bei einer Unterredung mit einem Heiden wird es also gut sein, an ihn in erster Linie die Frage zu richten, ob er sich zum Glauben an ein göttliches Wesen bekenne oder ob er der Lehre der Atheisten beipflichte. Leugnet er nun etwa die Existenz eines göttlichen Wesens, so wird er auf Grund der weisen und kunstvollen Weltordnung überzeugt, daß er annimmt, es gebe eine hierin sich offenbarende und über dem Universum stehende Macht.</p><p>Zweifelt er aber nicht an der Existenz dieser höheren Macht, schweift er jedoch in seinen Gedanken zu einer Vielheit von Göttern aus, so werden wir an ihn die Frage stellen, ob er die göttliche Natur für vollkommen oder für mangelhaft halte. Wenn er nun der göttlichen Wesenheit unausweichlich die Vollkommenheit zugesteht, so werden wir verlangen, daß er diese Vollkommenheit auf alle Eigenschaften, die nach unserer Erkenntnis zur Gottheit gehören, gleichmäßig ausdehne, damit dieselbe nicht etwa aus Gegenteiligem zusammengesetzt erscheine, nämlich aus Mangelhaftigkeit und Vollkommenheit. Eben wegen dieser von unserer Vernunft verlangten Folgerung muß er auch zugleich einräumen, daß jene der göttlichen Natur zukommende Vollkommenheit uns entgegentrete, sowohl in bezug auf die Macht als auch in bezug auf die Güte und die Weisheit, Unvergänglichkeit und Ewigkeit wie überhaupt in bezug auf jede Eigenschaft, die ein seiner würdiger Begriff Gottes in sich schließt.</p><p>Ist aber dies zugegeben, dann dürfte es nicht mehr schwer sein, die Ausschweifung des Geistes auf viele Götter zum Bekenntnis* einer* Gottheit zurückzuführen. Würde er nämlich in bezug auf unseren Gegenstand die durchgängige Vollkommenheit zugeben, aber doch behaupten, es gäbe* vielevollkommene Wesen mit den gleichen Vorzügen, so muß er bei diesen durch keine Abweichung unterschiedenen, sondern in ganz gleichen Eigenschaften sich darstellenden Wesen entweder die charakteristische Eigentümlichkeit nachweisen oder aber, weil vernünftiges Denken an dem, was kein unterscheidendes Merkmal hat, keine Eigentümlichkeit entdecken kann, die Verschiedenheit ebenfalls ablehnen. Wenn man nämlich weder einen Unterschied von Mehr und Minder auffindet ― denn der Begriff der Vollkommenheit schließt jedes Minder, ebenso jedes Schlechter und Besser aus ― denn von Gottheit kann man da nicht mehr reden, wo Mangelhaftigkeit vorhanden ist ―, noch von Ursprünglich und Neuentstanden ―, denn was nicht ewig ist, liegt außerhalb des Begriffes der Gottheit ―, wenn vielmehr ein und derselbe Begriff der Gottheit bei allen angeblichen Göttern zugrunde gelegt werden muß, so wird auch, weil keine sie unterscheidende Eigentümlichkeit von der Vernunft zugelassen wird, die irrtümliche Meinung von vielen Göttern notwendig zu dem Bekenntnis* eines* göttlichen Wesens hingedrängt. Wenn man nämlich die Güte und Gerechtigkeit, die Weisheit und Macht von allen sogenannten Göttern ganz gleichmäßig aussagt und einem jeden derselben alle von der Ehrfurcht geforderten Eigenschaften in derselben Weise zugesteht, so wird eben jeder Unterschied in jeder Beziehung aufgehoben, und damit muß notwendig die Vielheit von Göttern aus der Vorstellung verschwinden, weil die durchgängige Gleichheit zum Glauben an die Einheit zurückführt.Kapitel 1.* Eine* göttliche Natur, aber mehrere göttliche Personen! Das Wort Gottes (═ der Sohn Gottes) ist dem Vater gleichwesentlich.</p><h2>1</h2><p>Doch da auch die christliche Religionslehre einen Unterschied von* Personen* in der Einheit der* Natur* annimmt, so müssen wir, damit wir nicht etwa bei der Bekämpfung der heidnischen Vielgötterei unversehens in den Irrtum des Judentums fallen, letzteren durch genaue, sozusagen kunstmäßige Unterscheidung berichtigen. Denn nicht einmal den außerhalb unserer Glaubenslehre Stehenden ist die Gottheit ohne Wort; dies Zugeständnis wird unsere Auffassung vom Worte des Vaters gut anbahnen. Wer nämlich bekennt, Gott sei nicht ohne Wort, wird jedenfalls von ihm auch zugeben, daß er ein Wort habe, eben weil er nicht ohne Wort ist.</p><p>Nun aber wird das Wort des Menschen mit dem nämlichen Ausdruck bezeichnet; wer sich nun entschließt, sich das Wort Gottes ähnlich vorzustellen wie das unsere, kann auf diese Weise zur richtigen Auffassung des Höheren geführt werden. Nur muß er beachten, daß das Wort Gottes, wie alles andere an Gott, seiner Natur entspreche. Denn man sieht an der menschlichen Natur auch Kraft, Weisheit und Leben; aber niemand wird sich durch die Gleichheit der Worte zur Annahme verleiten lassen, die Kraft oder die Weisheit oder das Leben* Gottes* wären ganz gleicher Art; sondern die Bedeutung solcher Begriffe erniedrigt sich in Beziehung auf uns nach dem Maße unserer Natur: weil vergänglich und schwach unsere Natur, darum ist kurz unser Leben, vergänglich unsere Kraft, flüchtig unser Wort. Dagegen die Bedeutung aller Aussagen, die wir von Gott machen, steigt hoch empor, gemäß der Erhabenheit dessen, auf den sie sich beziehen. Darum darf man, wenn man vom Worte Gottes spricht, keineswegs meinen, dasselbe habe nur in der Anstrengung des Sprechenden seinen Bestand und trete, wie unser menschliches Wort, alsbald wieder in das Nichtsein zurück; sondern wie unsere Natur, weil hinfällig, auch ein hinfälliges Wort hat, so hat die unvergängliche und immer bestehende Natur auch ein* ewiges* und* festbleibendes* Wort.</p><p>Ist nun folgerichtig zugestanden, das Wort Gottes sei ewig, so muß man notwendig auch zugeben, daß die Subsistenz des Wortes eine* lebendige* sei; denn es ist unstatthaft zu glauben, das Wort subsistiere nach der Art der Steine leblos. Vielmehr wenn es als etwas Geistiges und Unkörperliches subsistiert, so lebt es jedenfalls. Wäre es ohne Leben, so hätte es überhaupt keinen Bestand; nun aber hat sich die Meinung, das Wort Gottes habe keinen Bestand, als gottlos erwiesen; folgerichtig ist damit auch zugleich erwiesen, daß dieses Wort als ein lebendiges aufzufassen ist. Da ferner die Natur des Wortes mit Recht für einfach gehalten wird und man weder Zweifachheit noch Zusammensetzung bei ihr zuläßt, so wird wohl niemand demselben ein solches Leben zuschreiben, das es bloß auf Grund der Teilnahme besitzt ― eine derartige Meinung würde die Annahme einer Zusammensetzung einschließen, weil damit gesagt wäre, eines existiere durch das andere ―, sondern sobald man seine Einfachheit anerkennt, muß man auch einräumen, das Wort sei selbständiges Leben, nicht nur teilnehmend am Leben. Wenn nun das Wort lebt, weil es selbst Leben ist, so besitzt es auch Willenskraft; denn es gibt nichts Lebendiges, das ohne Willen wäre.</p><p>Die Ehrfurcht gegen Gott verlangt aber die weitere Folgerung, daß dieser Wille* mächtig* sei. Denn wollte jemand ihm keine Macht zuschreiben, so müßte er von ihm Ohnmacht behaupten. Aber Ohnmacht liegt fernab vom Begriff Gottes; denn nichts Widersprechendes läßt sich von der göttlichen Natur denken ― und man ist zu dem Bekenntnis gezwungen, die Macht des Wortes sei so groß wie sein Wille, damit an dem Einfachen nicht eine Vermischung oder Verbindung von Gegensätzen sich zeige, nämlich Macht und Ohnmacht in ein und demselben Willen, insofern dieser zwar einiges vollbrächte, zu anderem aber unvermögend wäre. Eine Folge der* Allmacht* ist es sodann, daß der Wille des Wortes keine Neigung zum Bösen hat ― eine solche Neigung ist von der göttlichen Natur ausgeschlossen ―, sondern daß er alles Gute will, ferner daß er, was er will, auch kann, aber auch, daß er, was er kann, auch nicht ungeschehen läßt, vielmehr die guten Entschlüsse auch in die Wirklichkeit überführt. Gut ist nun die Welt und all das, was in ihr sich uns als weise und kunstvoll darstellt. Demnach sind alle Dinge das Werk des Wortes ― jenes Wortes, welches lebt und besteht, da es Gottes Wort ist, jenes Wortes, welches alles, was es will, vermag, jenes Wortes, welches alles Gute und Weise und überhaupt alles Treffliche will.</p><p>Da nun einerseits zugestanden ist, daß die Welt gut ist, andererseits soeben der Beweis geliefert wurde, die Welt sei das Werk des Wortes, welches da das Gute sowohl will als auch ausführt, weil ferner das Wort von dem, der es ausspricht,* verschieden* ist ― denn dies bringt der korrelative Charakter des Ausdruckes „Wort“ mit sich, insofern man, sobald man „Wort“ sagt, auch an den Vater des Wortes denken muß, weil es kein Wort gibt, ohne daß es von jemand herrührt ―, unterscheiden wir also, sage ich, wegen des soeben erwähnten korrelativen Charakters, welcher dem Worte als solchem zukommt, verstandesmäßig und notwendig das Wort, sobald wir davon hören, von dem, von welchem es ist, so entrinnen wir der Gefahr, daß wir, während wir den heidnischen Anschauungen entgegentreten, in bedenklicher Weise den Bekennern der jüdischen Religion uns nähern; vielmehr vermeiden wir den Widersinn beider: wir anerkennen das Wort Gottes als lebendig, als wirkend und als schöpferisch, was der Jude nicht annimmt; zugleich aber leugnen wir im Unterschied von Heiden den Unterschied der Natur zwischen dem Worte selbst und dem, von welchem es ist.</p><p>Wie wir nämlich von unserem menschlichen Worte sagen, es habe seinen Ursprung im Verstande, ohne es weder mit demselben ganz zu identifizieren, noch für völlig verschieden von ihm zu erklären ― denn weil das Wort aus dem Verstande ist, ist das Wort etwas anderes und nicht er; aber weil es ihn zur Offenbarung und zum Ausdruck bringt, wird man es auch nicht für etwas vollständig von ihm Verschiedenes halten können, sondern es bleibt der Natur nach mit ihm eins, wenn es auch der Existenz nach von ihm verschieden ist ―, ebenso ist auch das Wort Gottes durch sein selbständiges Sein von dem verschieden, von welchem es dieses selbständige Sein hat; aber dadurch, daß es an sich selbst aufweist, was wir an Gott erkennen, ist es der Natur nach mit jenem identisch, an dem sich die gleichen charakteristischen Eigenschaften finden. Denn mag man Güte oder Macht oder Weisheit oder Ewigkeit und Erhabenheit über Sünde, Tod und Verderben oder Allvollkommenheit und sonst etwas Derartiges als Kennzeichen des Vaters aufstellen; die nämlichen Kennzeichen muß man auch an dem Worte finden, das von ihm ausgeht.Kapitel 2. Der Heilige Geist ist ebenfalls eine göttliche Person.</p><h2>2</h2><p>Wie wir von menschlichen Verhältnissen aus durch eine hoch emporsteigende Betrachtung in der göttlichen Natur das* Wort* erkannten, so werden wir auf dem nämlichen Wege noch auf den Begriff des Geistes oder des Odems geführt, wenn wir gewisse Abschattungen und Abbilder der unaussprechlichen Macht in unserer eigenen Natur ins Auge fassen. Freilich ist bei uns der Odem eine Bewegung der Luft, die nicht zu unserer Natur gehört, die aber zur Erhaltung des Körpers notwendig ein- und ausgeatmet wird; durch sie wird, wenn wir ein Wort aussprechen, die Stimme erzeugt, durch die erst der Sinn des Wortes anderen zugänglich wird. Bei der göttlichen Natur ist ebenfalls die Existenz eines Odems oder Geistes frommgläubig gesetzt (gleichwie die Existenz des Wortes Gottes zugegeben wurde), wenn das göttliche Wort nicht unvollkommener sein kann als das menschliche; außerdem würden wir ja das menschliche Wort mit Geist und Odem ausstatten, das göttliche aber dessen berauben.</p><p>Jedoch gebührt es sich in bezug auf Gott zu glauben, daß der Odem nicht nach Art des unsrigen als etwas zu Gott ursprünglich nicht Gehörendes ihm von außen zuströme und in ihm erst zum Odem werde, sondern es verhält sich hier ähnlich wie beim Worte: wie dieses weder etwas für sich Nichtbestehendes ist, noch durch Erlernung entstanden, noch durch die Stimme hervorgebracht, noch nach dem Entstehen vergänglich, noch mit den Mängeln belastet, an denen unser Wort leidet, sondern wesenhaft subsistierend, willenskräftig, wirkend und allmächtig ist, so verstehen wir auch, wenn wir vom Odem Gottes hören, der das Wort begleitet und seine Wirksamkeit offenbart, darunter keinen leeren Hauch des Atems ― denn eine Auffassung, welche Gottes Odem ganz nach Art des menschlichen sich vorstellt, würde die göttliche Erhabenheit zu unserer Niedrigkeit herabziehen ―, sondern eine wesenhafte Macht, welche in eigener Subsistenz, auf sich selbst fußend, uns entgegentritt, welche auch weder von Gott, in dem sie ist, noch vom Worte Gottes, das von ihr begleitet wird, losgetrennt werden kann, oder welche sich je in das Nichtsein ergießt, sondern welche, dem Worte Gottes ähnlich, hypostatisch existiert, ebenfalls willenskräftig, frei in der Bewegung, wirksam ist, das Gute will und für jeden Plan mit dem Willen zugleich die Macht zur Ausführung hat.Kapitel 3. Das Geheimnisvolle der Trinität und ihr Verhältnis zum heidnischen und jüdischen Gottesglauben.</p><h2>3</h2><p>Wer die Tiefen des Geheimnisses mit aller Genauigkeit durchforscht, gewinnt in seiner Seele eine bescheidene der Unergründlichkeit desselben angemessene Einsicht in die Lehre von der Gotteserkenntnis, jedoch in Worten vermag er die unaussprechliche Tiefe des Geheimnisses nicht darzulegen, wie es zählbar ist und doch der Zählung sich entzieht, wie es getrennt zu betrachten und doch als Einheit zu erfassen ist, wie hinsichtlich der Person eine Unterscheidung gemacht werden muß und hinsichtlich der Substanz eine solche Trennung nicht vorgenommen werden darf. Denn hinsichtlich der Person ist der Geist ein anderer und ein anderer das Wort und wieder ein anderer der, von dem Wort und Geist ausgehen. Und wenn du in denselben die Unterscheidung erkannt hast, so gestattet die Einheit der Natur eine Trennung nicht.</p><p>[Forts. v. ] Darum geht die Macht des einen höchsten Wesens nicht in verschiedene Gottheiten auseinander, indem man es spalten würde, noch trifft unsere Lehre mit dem Glauben der Juden zusammen, sondern die Wahrheit hat ihren Platz in der Mitte zwischen beiden Anschauungen, indem sie die Häresie, welche in jeder der zwei Religionen enthalten ist, verwirft, das Wahre aber, was jede hat, aufnimmt. Die jüdische Lehre schließt sie nämlich durch die Annahme des Wortes und durch den Glauben an den Heiligen Geist aus; der vielgötterische Irrtum der Heiden wird dadurch beseitigt, daß die Einheit hinsichtlich der Natur das Trugbild der Vielheit aufhebt. Andererseits muß von der jüdischen Auffassung die Einheit, nämlich der Natur, festgehalten, desgleichen aus dem Heidentum nur die Unterscheidung hinsichtlich der Personen; hiedurch wird der unwürdigen Vorstellung von Gott, die auf beiden Seiten besteht, die entsprechende Heilung zuteil. Denn sozusagen bewährt sich als Heilmittel für die, welche bezüglich der Einheit sich irren, die Dreizahl, und für die, welche bezüglich der Vielheit auf Abwege kamen, die Lehre von der Einheit.Kapitel 4. Die Lehre vom Worte Gottes und von seinem Odem findet sich schon im Alten Testament.</p><h2>4</h2><p>Wenn ein Jude diesen Darlegungen widerspräche, so würden wir ihn ungleich leichter widerlegen als er uns. Denn gerade aus jenen Lehren, in denen er aufgewachsen ist, ergibt sich mit aller Klarheit die wahre Anschauung. Denn daß Gottes Wort und Gottes Odem (= Geist) wesenhaft existierende Mächte sind, welche sowohl die schöpferische Ursache des Weltalls als auch die es erhaltende Kraft sind, erhellt deutlich genug aus den inspirierten Schriften. Es genügt aber, wenn wir eines einzigen Zeugnisses gedenken; die vielen anderen können wir größerer Mühewaltung überlassen. Es heißt nämlich: „Durch das* Wort* des Herrn wurden die Himmel befestigt und durch den* Odem* seines Mundes all ihre Macht“ (Ps. 32, 6 [hebr. Ps. 33, 6]). Was ist nun das für ein Wort, und was für ein Odem? Denn sicher ist dieses Wort kein bloß gesprochener Laut und dieser Odem nicht bloßer Hauch. Wer lehren wollte, der Schöpfer des Weltalls habe sich eines gewöhnlichen Wortes und Odems bedient, würde die Ähnlichkeit unserer Natur mit Gott so weit ausdehnen, daß Gott ganz vermenschlicht würde.</p><p>Und wäre eine Macht, die von bloßen Lauten und einem bloßen Odem ausgeht, so groß, daß sie genügt hätte, die Himmel und alle Kräfte derselben zu erschaffen? Würde nämlich Gottes Wort ganz unseren Worten und Gottes Odem völlig dem unserigen gleichen, so würde aus dieser Gleichheit folgen, daß auch deren Macht die gleiche wäre, und so würde Gottes Wort nur so viel vermögen als unser Wort. Nun sind aber unsere Worte und der mit ihnen ausgehende Odem ohne Kraft und ohne Selbstand; infolgedessen rauben auch jene, welche die Gottheit restlos zur Ähnlichkeit mit unserem Worte herabziehen wollen, dem Worte Gottes und dem Odem Gottes ihre Kraft und ihren Selbstand. Wenn nun aber, wie David sagt, die Himmel durch Gottes Wort befestigt wurden und die Kräfte der Himmel durch Gottes Odem ihr Dasein bekamen, so ist unerschütterlich das Geheimnis der Wahrheit, welches da lehrt, daß Gottes Wort wesenhaft existiere und Gottes Geist persönlich sei.Kapitel 5. Bei der Darlegung der Menschwerdung des Wortes Gottes muß vom Urzustand des Menschen ausgegangen werden.</p><h2>5</h2><p>Der Lehre von der Existenz des Wortes Gottes und des Odems Gottes wird sich der Heide aus allgemeinen Vernunftgründen und der Jude aus Schriftgründen wohl nicht allzulange verschließen, aber die Menschwerdung des göttlichen Wortes werden beide gleichmäßig als unglaublich und als Gottes unwürdig verwerfen. Dennoch dürfen wir hoffen, die Gegner auch zu diesem Glaubensgeheimnis führen zu können; nur müssen wir einen anderen Ausgangspunkt wählen.</p><p>Zuerst müssen wir die Frage aufwerfen, ob die Gegner glauben, daß vom Schöpfer des Universums alles durch Wort (Vernunft) und Weisheit geschaffen wurde, oder ob sie nicht einmal diesem Satze einen rechten Glauben entgegenbringen. Freilich wenn sie nicht einräumen würden, daß Wort (Vernunft) und Weisheit bei der Schöpfung den Vorsitz innehatten, so würden sie dem Weltprinzip unleugbar Unvernunft und Ungeschick als Beiständer an die Seite geben. Da aber derartiges als ungereimt und als gottlos verworfen werden muß, so sind sie zu dem Zugeständnis gezwungen, daß Wort (Vernunft) und Weisheit an der Spitze des Seins stehen. Wie wir aber bereits dargetan, ist Gottes Wort nicht ein bloß gesprochener Laut oder eine durch Wissenschaft und Weisheit erworbene Kunst, sondern eine wesenhaft subsistierende Macht, die alles Gute will und auch alles, was sie will, ausführen kann; und gerade deshalb, weil es jene Macht ist, welche das Gute will und ausführt, ist sie die schöpferische Ursache der Welt, da diese gut ist. Hängt nun, wie unsere Schlußfolge bewies, die Existenz der ganzen Welt von der Macht des göttlichen Wortes ab, so läßt sich für einzelne Bestandteile der Welt unmöglich eine andere Ursache denken als das nämliche Wort Gottes, durch welches die ganze Welt den Eintritt in das Sein gewann. Ob man dasselbe aber Wort oder Weisheit oder Macht oder Gott nennt oder dafür irgendeinen der erhabenen und ehrfurchtsvollen Namen gebraucht, darauf legen wir kein Gewicht. Denn welchen Namen oder welchen Ausdruck man auch immer für das, was wir meinen, verwenden mag, es ist immer ein und dasselbe, was wir mit den Worten bezeichnen, nämlich die ewige göttliche Macht, die Schöpferin alles Seienden, die Erfinderin dessen, was nicht war, die Erhalterin des Gewordenen, die Seherin der Zukunft.</p><p>Dieser Gott nun, das Wort, die Weisheit, die Macht ward folgerichtig auch als Schöpfer der menschlichen Natur dargetan, nicht als ob er durch eine Notwendigkeit zur Erschaffung des Menschen getrieben worden wäre, sondern in übergroßer Liebe rief er dieses Lebewesen in das Dasein. Denn Gottes Licht sollte nicht ungeschaut, seine Herrlichkeit nicht unbezeugt, seine Güte nicht ungenossen, und die Reichtümer, die wir sonst noch an der Gottheit erkennen, nicht ungenützt bleiben, ohne daß jemand wäre, der daran teilnehmen und davon genießen könnte. Wenn nun der Mensch zu dem Zwecke ins Dasein trat, damit er an den Gütern Gottes Anteil habe, so mußte er notwendig eine solche Ausstattung empfangen, die ihn zur Teilnahme an jenen Gütern befähigt. Wie nämlich das Auge durch den von Natur in ihm vorhandenen Strahl das Licht aufnimmt, indem es durch seine angeborne Kraft das Verwandte an sich zieht, so mußte auch der menschlichen Natur etwas mit Gott Verwandtes verliehen werden, auf daß sie auf Grund der damit hergestellten Wechselbeziehung eine Neigung zu dem ihm Verwandten habe. Auch im Reiche der unvernünftigen Geschöpfe sind die Wasser- und Lufttiere alle ihrer Lebensart entsprechend ausgerüstet, so daß infolge der besonderen Körperbildung den einen die Luft, den anderen das Wasser als das ihnen verwandte und angemessene Lebenselement erscheint.</p><p>Ähnlich mußte der Mensch, weil zum Genusse der göttlichen Güter geschaffen, zur Verwandtschaft mit dem erhoben werden, an dem teilzunehmen er bestimmt war. Darum ward er mit Leben, Vernunft und Weisheit und überhaupt mit allen gotteswürdigen Gaben gar herrlich ausgestattet, damit er durch jedes dieser Geschenke Verlangen trage nach dem, was ihm verwandt ist. Da nun zu den der göttlichen Natur zukommenden Gütern die Ewigkeit gehört, so durfte auch dieses Gut nicht völlig in der Ausrüstung unserer Natur fehlen, vielmehr mußte sie Unsterblichkeit besitzen, damit sie durch eine ihr angeborne Kraft imstande sei, das über sie Erhabene zu erkennen und Verlangen habe nach dem ewigen Gott. All dies will der Bericht über die Weltentstehung in einem einzigen Worte zusammenfassen und aussprechen, indem er nämlich erklärt, der Mensch sei nach „dem Bilde Gottes“ geschaffen worden (Gen. 1, 36 f.); denn in der Ähnlichkeit, die bis zur Ebenbildlichkeit sich erhebt, ist die ganze Reihe der Eigenschaften enthalten, welche der göttlichen Natur zukommen. Das Gesagte wird auch durch die Belehrungen bestätigt, welche Moses weiterhin, mehr in erzählender Form, uns gibt. Denn das Paradies und die Eigentümlichkeit seiner Früchte, deren Genuß den davon Kostenden Erkenntnis und ewiges Leben verleiht, sowie alle ähnlichen Ausführungen stimmen mit den Darlegungen überein, die wir soeben über die Menschennatur gegeben haben, nämlich, daß unsere Natur im Anfange gut und im Besitze von hohen Gütern war.</p><p>Aber vielleicht widerspricht jemand unseren Erörterungen im Hinblick auf die Gegenwart und vermeint, unsere Anschauung deshalb als unrichtig darstellen zu können, weil die Menschheit jetzt nicht mehr im Besitze jener Güter ist, sondern von den entgegengesetzten Übeln heimgesucht wird. Denn wo ist jetzt die Gottähnlichkeit der Seele? wo die Schmerzlosigkeit des Leibes? wo die Ewigkeit des Lebens? Die kurze Dauer unseres Daseins, Krankheiten, Mühseligkeiten, Gebundenheit an jede Art von Leiden an Leib und Seele ― dies und dergleichen anführend ― kann man unter schweren Anklagen unserer Natur die Ansichten, welche wir über den Menschen vorgetragen haben, auf den Kopf zu stellen suchen. Allein wir wollen auch hierüber, damit unsere Rede an keinem Punkte die folgerichtige Beweisführung vermissen lasse, in eine kurze Besprechung eintreten. Die Mißstände, welche jetzt das Menschenleben drücken, beweisen noch lange nicht, daß der Mensch sich niemals in durchaus glücklicher Lage befand. Denn da der Mensch ein Werk Gottes ist, der aus Güte dieses Lebewesen ins Dasein rief, so kann niemand den Verdacht hegen, Gott selbst habe uns, nachdem ihn lautere Liebe zu unserer Erschaffung bestimmte, in eine Welt des Bösen und der Übel gesetzt; vielmehr müssen wir anderswo die Ursache dafür suchen, daß wir das frühere Glück verloren haben und uns jetzt in dem gegenwärtigen Zustand befinden.</p><p>Der Grund hiefür liegt wiederum innerhalb der Zugeständnisse, welche unsere Gegner machen müssen. Derjenige nämlich, welcher den Menschen zum Zwecke der Teilnahme an seinen eigenen Gütern schuf und ihm die Keime zu allen Vorzügen in die Natur einpflanzte, damit durch jeden derselben unser Verlangen nach der entsprechenden verwandten Vollkommenheit in Gott entzündet werde, wollte uns gewiß nicht das edelste und wertvollste Gut vorenthalten, ― ich meine die Gnadengabe der Selbstbestimmung und der Freiheit unseres Willens. Würde nämlich der Zwang der Notwendigkeit über dem menschlichen Leben walten, so wäre das Abbild nach dieser Seite hin mißraten, insofern es durch diese Unähnlichkeit zu sehr vom Urbild abstechen würde. Denn wie könnte eine gewissen Notwendigkeiten unterworfene und von ihnen geknechtete Natur ein getreues Abbild von jener sein, die da königlich herrscht und regiert? Daher mußte der Mensch, weil in allen Stücken zur Ähnlichkeit mit Gott berufen, des Selbstbestimmungsrechtes und der Freiheit teilhaftig werden; infolgedessen ist allerdings auch die Erlangung aller Güter als Kampfpreis an die Tugend geknüpft.</p><p>Wie kommt es nun, wirst du fragen, daß der Mensch, nachdem er in allen Stücken so herrlich ausgestattet ward, doch das Schlimme an Stelle des Guten eintauschte? Der Grund auch hiefür liegt offen da. Die Entstehung auch nicht des geringsten Bösen nahm ihren Anfang im Willen Gottes ― keine Schuld könnte das Böse treffen, falls Gott als dessen Urheber und Vater betrachtet werden könnte ―, sondern das Böse sproßt irgendwie aus unserem Inneren hervor, indem es durch die freie Entscheidung unseres Willens entsteht, sobald ein Abgehen unserer Seele von dem Guten stattfindet. Gleichwie das Sehen eine Tätigkeit der Natur, die Blindheit aber ein Verlust dieser Tätigkeit ist, so steht auch die Tugend der Schlechtigkeit gegenüber. Ein anderer Ursprung der Schlechtigkeit kann nicht gedacht werden als die Entfernung der Tugend; wie nämlich durch die Hinwegnahme des Lichtes die Dunkelheit eintritt, bei dessen Gegenwart aber aufhört, so hat, solange das Gute in der Natur vorhanden ist, die Schlechtigkeit keine Existenz für sich; die Entfernung des Guten bedeutet aber die Entstehung seines Gegenteils. Da nun das Merkmal des Selbstbestimmungsrechtes darin besteht, den Gegenstand des Wollens frei zu wählen, so ist nicht Gott für dich die Ursache der gegenwärtigen Übel, sondern die Unüberlegtheit, welche das Schlechtere an Stelle des Besseren wählte.Kapitel 6. Vom Entstehen der Sünde in der Welt der reinen Geister und der Menschen.</p><h2>6</h2><p>Du wirst aber auch nach der Ursache des soeben erwähnten Fehlers im Willen fragen; denn darauf führt die logische Ordnung der Rede. Daher müssen wir in verstandesmäßiger Überlegung nach einem Ausgangspunkt forschen, der auch diese Frage richtig beantwortet. Wir haben nun von unseren Vätern eine Überlieferung erhalten, welche aber keine fabelhafte Erzählung ist, sondern durch unsere Natur selbst genügende Bürgschaft empfängt.</p><p>Eine zweifache Erkenntnis der Dinge können wir unterscheiden, insofern sich unser Wahrnehmen teils auf Sinnliches teils auf Geistiges richtet; und es dürfte in der Natur der Dinge sich wohl nichts finden, was außerhalb dieser Einteilung läge. Die genannten Gebiete sind aber durch eine große Kluft voneinander getrennt, so daß weder die sinnliche Natur geistige Merkmale hat, noch die geistige etwa sinnliche, sondern beide haben entgegengesetzte Kennzeichen. Denn die geistige Natur ist unkörperlich, unberührbar, gestaltlos, die sinnliche dagegen liegt, wie schon der Name sagt, innerhalb der Wahrnehmung durch die Sinne. Allein wie sogar für die sinnliche Welt, trotz des vielfachen Gegensatzes der Elemente untereinander, eine gewisse gerade durch die Gegensätze vermittelte Harmonie von der göttlichen, das All durchdringenden Weisheit erfunden ward und auf diese Weise ein großer Einklang die ganze Schöpfung durchzieht, ohne daß der Gegensatz irgendwo das Band der Eintracht lösen würde: so findet vermöge der göttlichen Weisheit auch zwischen dem Sinnlichen und Geistigen eine Mischung und Verschmelzung statt, damit alles gleichmäßig an der Schönheit teilnehme und nichts von dem, was existiert, der besseren Natur entbehre.</p><p>Darum ist zwar die feine und leichtbewegliche Substanz, welche gemäß ihrer überweltlichen Beschaffenheit in ihren Eigenschaften eine große Verwandtschaft mit dem Geistigen besitzt, die eigentlich entsprechende Wohnstätte für die geistige Natur; durch eine wunderbare Vorsehung aber findet eine Verbindung der geistigen Natur mit der sinnlichen statt, damit nach des Apostels Lehre nichts von der Schöpfung verwerflich (1 Tim. 4, 4) oder von der Gottesgemeinschaft ausgeschlossen erscheine. Als diese Vereinigung von geistiger und sinnlicher Natur wurde denn der Mensch von Gott dargestellt, wie der Schöpfungsbericht lehrt; denn wie es im Schöpfungsberichte heißt (Gen. 2, 7 ff.), nahm Gott Staub von der Erde und bildete daraus den Menschen, und dann pflanzte er dem Gebilde durch Anhauchen das Leben ein, damit so eine Verbindung von Erdhaftem und Göttlichem erreicht werde und von diesem einen Gnadenwerk die gleiche Ehre auf die ganze Schöpfung überströme, insofern im Menschen das Irdische mit dem Überirdischen eine enge Vereinigung feierte.</p><p>Damals, als die rein geistige Welt schon bestand und jede der Engelmächte von der über alles herrschenden Majestät eine besondere Tätigkeit zur Instandhaltung des Universums angewiesen erhielt, hatte eine dieser Engelmächte von der höchsten Kraft unter Verleihung besonderer Gewalt den Auftrag bekommen, die untere Region innezuhaben und zu regieren. Als nun das aus Erde stammende Geschöpf als Ebenbild der höchsten Macht geschaffen ward ― dieses Lebewesen war der Mensch ― und durch eine geheimnisvolle Kraft die gottähnliche Schönheit der geistigen Natur mit ihm verbunden war, da hielt jener Geist, dem die Verwaltung des Irdischen zugeteilt war, es für schrecklich und unerträglich, daß aus der ihm untergeordneten Natur ein Wesen hervorginge, das Ähnlichkeit mit der höchsten Majestät habe. Wie aber dieser Geist, obwohl ihn der Schöpfer, der nur aus Güte alles ins Dasein rief, zu nichts Bösem erschaffen hatte, in die Leidenschaft des Neides versank, dies ausführlich zu erörtern gehört zwar zur gegenwärtigen Abhandlung nicht, aber vielleicht ist es angezeigt, auf die Sache in Rücksicht auf solche, welche hartgläubig sind, etwas einzugehen.</p><p>Der Unterschied zwischen Gut und Bös darf nicht so aufgestellt werden, als wenn es sich um zwei wirklich existierende Dinge handeln würde, sondern wie man bezüglich des Gegensatzes zwischen Existierendem und Nichtexistierendem nicht so verfahren darf, als ob das Nichtexistierende dem Existierenden als etwas Existierendes gegenüberstände, sondern nur erklären kann, die Nichtexistenz bilde den Gegensatz zur Existenz; auf die nämliche Weise steht die Schlechtigkeit dem Begriff der Tugend gegenüber, nicht als ob sie etwas für sich Existierendes wäre, sondern als etwas, was wir bei Abwesenheit des Guten zu denken haben. Und wie wir sagen, die Blindheit sei der Gegensatz zum Sehen, nicht als ob die Blindheit für sich in der Natur bestünde, sondern als Mangel einer vorher vorhandenen Fähigkeit, so erklären wir, die Schlechtigkeit trete durch die Beraubung des Guten ein, wie das Dunkel durch das Verschwinden des Lichtes.* Da nun* bloß die ungeschaffene Natur einer Bewegung im Sinne von Wechsel und Veränderung unfähig ist, alles andere dagegen der Veränderung unterliegt, weil es ausnahmslos, insofern es vom Nichtsein in das Sein überführt wurde, selbst durch eine Veränderung zu existieren begann,* da ferner* der erwähnte geschaffene Geist auf Grund seiner freien Willensentschließung wählte, was er wollte, und* da er endlich* seinen Blick nicht auf den unendlich Guten und völlig Neidlosen richtete: so hat er, wie jeder, der mitten im Sonnenlicht das Auge mittels der Lider schließt, bloß Dunkelheit wahrnimmt, nur das dem Guten Entgegengesetzte erblickt. Und dies war der Neid.</p><p>Allgemein gilt der Anfang dessen, was geschieht oder ist, als die Ursache der daraus sich ergebenden Folgen. Auf Gesundheit folgt z. B. Wohlbehagen, Arbeitsfreudigkeit und Frohsinn, auf Krankheit dagegen Unbehagen, Untätigkeit und Mißmut. Ähnlich folgt auch alles übrige den Ursachen, mit denen es kraft des natürlichen Zusammenhanges verknüpft ist. Gleichwie also Leidenschaftslosigkeit den Anfang und die Grundlage des Tugendlebens bildet, so erscheint die durch den Neid entstandene Hinneigung zum Bösen als der erste Schritt zu allen nachher eingetretenen Übeln.</p><p>Nachdem nämlich jener Geist in sein Inneres durch Abkehr vom Guten den Neid zugelassen und die Neigung zum Bösen in sich aufgenommen hatte, so ward er, wie ein von der Bergspitze losgerissener Stein durch die eigene Schwere in die Tiefe stürzt, in ähnlicher Weise, sobald er seine Verbindung mit dem Guten löste und dem Bösen entgegenwankte und zustimmte, von selbst wie durch eine Schwerkraft zur äußersten Grenze der Bosheit hingerissen, und die Denkkraft, welche er vom Schöpfer als Gehilfin erhalten hatte, um sich seine Teilnahme am Besseren zu sichern, als Gehilfin zur Erfindung boshafter Pläne verwendend, hinterging er den Menschen listig durch Trug und überredete ihn, zum Mörder und Henker an sich selbst zu werden. Denn da der Mensch, mit dem göttlichen Segen reichlich ausgerüstet, durch seine Hoheit erhaben dastand (er sollte ja über die Erde und über alles auf ihr herrschen), schön von Gestalt (denn er war Ebenbild der Urschönheit), von Natur keinem Leiden ausgesetzt (er war ja Nachahmung des Leidenslosen), voll Zuversicht, weil die Anschauung Gottes von Angesicht zu Angesicht genießend, diese Vorzüge aber gerade für den Widersacher Zündstoff zur Leidenschaft des Neides waren, derselbe jedoch seine schlimmen Absichten auf dem Wege der Gewalt und des Zwanges nicht auszuführen vermochte (denn die Kraft des göttlichen Segens im Menschen war größer als seine Gewalt), so sann er darauf, den Menschen von der ihn stärkenden Macht Gottes abwendig zu machen, damit er dann als leichte Beute ihm in die Schlinge seiner Hinterlist falle.</p><p>Und wie jemand, falls er an einer Lampe, deren Docht vom Feuer ganz ergriffen wurde, die Flamme durch Blasen nicht auslöschen kann, Wasser unter das Öl mischt und durch dieses klug erdachte Mittel die Flamme schwächt, so mischte der Widersacher hinterlistigerweise in das Verlangen des Menschen Böses und bewirkte so ein Verlöschen und eine Minderung des göttlichen Segens; mit dessen Abnahme trat notwendig das Gegenteil an seine Stelle; das Gegenteil aber vom Leben ist der Tod, von der Kraft die Schwäche, vom Segen der Fluch, von der Zuversicht die Scham, und so erblicken wir von jedem Guten ein böses Gegenstück in uns. Darum steht es jetzt so schlimm um die Sache des Menschengeschlechtes, weil der dargelegte Anfang den Grund zu einem solchen Ende legte.Kapitel 7. Trotz aller irdischen Übel ist und bleibt Gott der Schöpfer des Menschengeschlechtes. Es gibt nur ein Übel ― die Sünde, und an dieser ist Gott nicht schuld.</p><h2>7</h2><p>Keiner frage, warum denn Gott, obgleich er das Unglück voraussah, das über den Menschen infolge seiner Torheit kam, zur Erschaffung des Menschen schritt, für den es vielleicht besser gewesen wäre, nicht erschaffen zu werden, als von Übeln umgeben zu sein. Derartiges pflegen die durch Täuschung verführten Anhänger der manichäischen Lehren zur Aufrechterhaltung ihres Irrtums vorzubringen, um dadurch nachzuweisen, daß der Schöpfer der menschlichen Natur ein böses Wesen sei. Denn wenn Gott alles weiß, der Mensch aber voll Elend ist, so könnten wir vielleicht gar unseren Begriff von der göttlichen Güte nicht mehr festhalten, wenn er ja den Menschen dazu ins Dasein rief, damit er nachher mitten im Elend lebe. Kommt es nämlich einer guten Natur durchaus zu, nur Gutes zu schaffen, so können wir, wirft man ein, unser trauriges und hinfälliges Leben nicht auf die schöpferische Tätigkeit des guten Gottes zurückführen, sondern müssen für den Schöpfer eines solchen Lebens einen anderen halten, dessen Natur starke Neigung zum Bösen hat. Denn dies und Ähnliches scheint allerdings denen, welche den häretischen Irrtum wie eine Beize tief in sich aufgenommen haben, wegen der oberflächlichen Wahrscheinlichkeit eine gewisse Stärke zu besitzen, alle aber, welche gründlicher nach Wahrheit forschen, sehen deutlich, daß eine solche Ansicht falsch und leicht als trügerisch zu erweisen ist.</p><p>Wir werden gut daran tun, den Apostel als Wortführer bei der Widerlegung der Gegner zu wählen. In seinem Brief an die Korinther (1 Kor. 2, 15 ff.) unterscheidet er zwischen fleischlichen und geistigen Seelenverfassungen und mahnt in seinen Darlegungen, wie ich glaube, man solle das Gute und Schlimme nicht nach dem sinnlichen Eindruck beurteilen, sondern, ohne die Wirkungen auf den Leib zu beachten, die Natur des Guten und seines Gegenteils an und für sich untersuchen; denn der Geistige, sagt er, beurteilt alles. Wie ich vermute, wurden unsere Gegner zu ihrem erwähnten Irrtum dadurch veranlaßt, daß sie den Begriff des Guten nach dem Genuß, den es für den Leib gewährt, umschrieben und folgerichtig alsdann, da nun einmal unser Körper, weil zusammengesetzt und der Auflösung entgegengehend, notwendig Leiden und Krankheiten unterworfen ist, diese aber wiederum im Körper Schmerzen hervorrufen, zu der Meinung kamen, die Erschaffung des Menschen sei das Werk eines bösen Gottes.</p><p>[Forts. v. ] Nun ― wenn doch ihr Verstand mehr in die Höhe blicken und sie, ihren Geist mehr von der Genußsucht losmachend, unbefangen die Natur der Dinge betrachten würden, so könnten sie nicht meinen, daß es außer der Sünde noch ein Übel gäbe. Alle Sünde aber besteht ihrem Wesen nach in der Beraubung des Guten, da sie nicht an sich selbst etwas ist und keine eigene Existenz zeigt; denn nichts Böses existiert außerhalb des Willens für sich, sondern deshalb, weil es nicht das Gute ist, wird es so genannt. Das Nichtseiende existiert nicht, und Schöpfer des Nichtexistierenden kann nicht der sein, der nur das Existierende geschaffen hat. Also hat Gott keine Verantwortung für das Böse, er, der da der Urheber des Seienden, keineswegs aber des Nichtseienden ist, der das Sehvermögen, nicht die Blindheit bildete, der die Tugend, nicht deren Beraubung schuf, der den nach der Tugend Wandelnden als Kampfpreis für die freie Willensentscheidung das Ehrengeschenk großer Güter vorlegt, nicht aber die menschliche Natur mit Zwangsanwendung unter seinen Willen knechtet, indem er die Menschen wie ein lebloses Gerät willenlos zum Guten hinziehen würde. Wenn aber einer beim hellen Strahl des Himmelslichtes freiwillig die Augen schließt, so ist die Sonne ohne Schuld, wenn er nicht sieht.Kapitel 8. Der Tod ist kein Übel. Gott schuf den Menschen, obgleich er dessen Fall voraussah. Gott ist aber auch der Erlöser des Menschengeschlechtes.</p><h2>8</h2><p>Wer aber auf die Auflösung unseres Leibes hinblickt, wird schmerzlich berührt und hält die Zerstörung des Lebens für ein hartes Geschick; ja das Verlöschen unseres Daseins im Tode bezeichnet er für das größte Übel. So erwäge er denn die übergroße Wohltat, die uns Gott durch dieses dunkle Los erweist, vielleicht wird er dann dahingebracht, daß er die Gnade der göttlichen Fürsorge für den Menschen bewundert! Wer lebt, hat das Verlangen in sich, sein Leben im Genuß des Angenehmen zu verbringen; wer daher sein Leben in Leid verbringen muß, wird das Nichtsein einem leidvollen Dasein vorziehen. Fragen wir nun, ob der Spender des Lebens für uns beim Tode einen anderen Wunsch hat, als daß wir ganz glücklich leben. Da wir nämlich durch freie Willenstat, indem wir das Böse wie ein mit Honig versüßtes Gift aus Lüsternheit unserer Natur beimischten und da wir hierdurch der offenbar in Leidensfreiheit bestehenden Glückseligkeit verlustig gingen und eine Umgestaltung erfuhren, wie es unserer Sünde entsprach, so wird der Mensch wie ein irdenes Gefäß wieder in Erde aufgelöst, damit er nach Ausscheidung des Schmutzes, den er jetzt an sich trägt, durch die Auferstehung zu seiner ursprünglichen Schönheit umgebildet werde, vorausgesetzt, daß er im gegenwärtigen Leben die Ebenbildlichkeit mit Gott sich zu retten wußte.</p><p>Diesen Glaubenssatz verkündet uns, wenngleich in der Form von Erzählungen und Rätseln oder Gleichnissen, auch Moses; doch blickt auch in letzteren die Lehre deutlich hindurch. Nach seinem Bericht (Gen. 3, 21) legte der Herr, nachdem die ersten Menschen das Verbot übertreten hatten und ihrer Glückseligkeit entblößt waren, den Stammeltern Kleider aus Fellen an. Hiebei scheint aber die Absicht der Erzählung nicht gewöhnliche Felle im Auge zu haben; denn was für Tiere hätten denn wohl geschlachtet und abgehäutet werden müssen, um jene zu bekleiden? Vielmehr, da jede vom lebenden Tiere abgetrennte Haut tot ist, so glaube ich, daß der göttliche Arzt unserer Verderbtheit die Fähigkeit zu sterben, welche von den unvernünftigen Tieren entlehnt ist, aus treuer Sorge für uns den Menschen gleichsam wie ein Kleid umlegte ― jedoch um nicht für immer die menschliche Natur damit zu umgeben. Das Kleid ist ja etwas äußerlich Umgehängtes, das eine Zeitlang dem Körper Dienste leistet, aber nicht mit der Natur verwächst. Sonach wurde die Sterblichkeit der Natur der unvernünftigen Tiere entnommen und in weiser Absicht der zur Unsterblichkeit geschaffenen Natur umgelegt in einer Weise, daß sie nur deren Äußeres, nicht deren Inneres umhüllt und nur den sinnlichen Teil berührt, ohne das göttliche Ebenbild selbst zu verletzen. Aber auch der sinnliche Teil wird bloß aufgelöst, jedoch nicht vernichtet. Vernichtung bedeutet nämlich den Übergang in das Nichtsein, Auflösung dagegen die Zurückführung in die kosmischen Elemente, aus denen das Betreffende besteht. Was aber in diese übergeht, ist nicht verloren, auch wenn es sich unserer sinnlichen Wahrnehmung entzieht.</p><p>Die Ursache der Auflösung ergibt sich klar aus der angezogenen (biblischen) Erzählung. Weil nämlich die geistige Natur hoch über den Sinnesempfindungen steht, die Sinnlichkeit aber mit dem Gröberen und Irdischen verwandt ist und weil deshalb auf Grund der durch die Sinne vorgenommenen Prüfung die Entscheidung über das Gute in die Irre geführt wurde, dieser Irrtum hinsichtlich des Guten die Veränderung des ursprünglichen Zustandes in das gerade Gegenteil verschuldete, so wird der leibliche Teil von uns, weil er durch die Aufnahme des Bösen (= der verbotenen Frucht) von seiner Würde herabsank, der Auflösung preisgegeben. Der Gedanke, welcher der Erzählung zugrunde liegt, hat Ähnlichkeit mit folgendem: nehmen wir an, ein Gefäß bestehe aus Ton, dasselbe sei aber heimtückisch mit Blei ausgefüllt worden, welches sich dann, nachdem es hart geworden, nicht mehr entfernen lasse; wenn nun der Besitzer gerade dieses Gefäß wünscht und sich auf das Töpferhandwerk versteht, so kann er es zerbrechen und nach Beseitigung des Bleis in seine frühere Gestalt umformen, damit es seinem Gebrauche entspricht. Ähnlich wird der Bildner unseres Gefäßes, nachdem dem sinnlichen, das ist dem körperlichen Teile die Schlechtigkeit beigemischt ward, den Stoff, der das Böse in sich aufgenommen hatte, auflösen, von dem Beisatz reinigen und durch die Auferstehung neu formen, so daß das Gefäß wieder zur ersten Schönheit umgestaltet wird.</p><p>Da aber Leib und Seele an den sündhaften Affekten gemeinsam beteiligt sind und auch eine gewisse Ähnlichkeit zwischen dem Tod des Leibes und der Seele besteht ― wie wir bezüglich des Leibes dessen Trennung vom sinnlichen Leben allgemein Tod nennen, so geben wir bezüglich der Seele der Trennung derselben vom wahren Leben den nämlichen Namen, weil nun, wie gesagt, die Beteiligung am Bösen für Leib und Seele die gleiche ist (durch beide tritt ja die Sünde in die Wirklichkeit), darum erfaßt zwar der Auflösungstod infolge des Anlegens jener Felle die Seele nicht (denn wie sollte das Nichtzusammengesetzte aufgelöst werden?), aber auch an ihr haften Sündenflecken, welche getilgt werden müssen, und deshalb ist ihr im gegenwärtigen Leben das Tugendstreben als Mittel zur Heilung solcher Wunden dargeboten. Bleibt sie aber ungeheilt, so wird die Kur im zukünftigen Leben vorgenommen.</p><p>Allein wie es verschiedene Krankheiten des Leibes gibt, von denen die einen leicht, die anderen schwieriger zur Heilung gelangen, wobei Schnitte, Brenneisen und bittere Tränke zur Hebung des dem Körper zugestoßenen Leidens angewendet werden, so stellt auch das künftige Gericht zur Heilung der Seelengebrechen Ähnliches in Aussicht was zwar für die Leichtfertigeren eine Androhung und Vorhaltung von Schrecknissen bedeutet, damit sie durch Furcht vor den schmerzlichen Gegenmitteln zur Besinnung gebracht werden und das Böse meiden, von den Einsichtigeren aber als ein Heil- und Kurverfahren von Seite Gottes angesehen wird, der sein Gebilde in den früheren Gnadenstand zurückversetzen will. Denn wie diejenigen, welche die am Körper widernatürlich entstandenen Hühneraugen und Warzen durch Schneiden und Brennen beseitigen wollen, zwar den von ihnen Behandelten nicht ganz schmerzlos die Heilung verschaffen, aber doch nicht zum Schaden der Patienten den Schnitt vornehmen, so werden auch alle Auswüchse der Materie, welche sich an unseren durch die Teilnahme an sündhaften Affekten verfleischlichten Seelen verhärtet haben, zur Zeit des Gerichtes ausgeschnitten und abgefeilt durch die unaussprechliche Weisheit und Macht dessen, der, wie das Evangelium sagt (Matth. 9, 12; Mark. 2, 17; Luk, 5, 31), die Kranken gesund macht; denn es heißt dort: „Nicht die Gesunden bedürfen des Arztes, sondern die Kranken.“</p><p>Weil aber die Seele enge mit dem Bösen verwachsen ist...., gleichwie das Ausschneiden der Warzen die Oberhaut schmerzt (denn der mit der Natur verwachsene Auswuchs hält mit einer Art Anhänglichkeit an seiner Grundlage fest, und es entsteht eine eigentümliche Verbindung des Fremdartigen mit unserem Körper, so daß, wenn der Auswuchs beseitigt wird, unser Gefühl Schmerz und Pein empfindet), ebenso stellen sich auch, wenn die Seele wegen der Vorwürfe über die Sünde, wie der Prophet irgendwo sagt (Ps. 39, 11 [hebr. Ps. 40, 11]), sich abhärmt und abquält, wegen der tiefgehenden Verknüpfung mit dem Bösen gewisse unaussprechliche und unbeschreibliche Schmerzen ein, die sich ebensowenig schildern lassen, wie die Natur der Güter, die wir hoffen; denn weder diese noch jene erreicht die Macht der Rede oder das Forschen des Verstandes.</p><p>Wer also auf das Ziel der Weisheit dessen, der die Welt regiert, hinblickt, dürfte wohl nicht mehr mit stichhaltigen Gründen den Schöpfer der Menschen als Urheber des Bösen bezeichnen, indem er behauptet, derselbe kenne entweder die Zukunft nicht oder er sei, wenn er sie kannte und dennoch zur Erschaffung schritt, von der Hinneigung zum Bösen nicht freizusprechen. Im Gegenteil: Gott wußte sehr wohl, was eintrat, und doch hinderte er mit vollem Bewußtsein den Lauf der Dinge nicht, die da kommen sollten. Denn der Abfall der Menschen vom Guten konnte dem nicht verborgen sein, der durch seine Vorsehung alles beherrscht und das Künftige ebensogut kennt wie das Vergangene. Allein wie er jenen Abfall voraussah, so nahm er zugleich auch die Zurückrufung des Menschen zum Guten in seinen Plan auf. Was war nun besser, in der Voraussicht, daß der Mensch vom Guten abweiche, ihn überhaupt nicht ins Dasein zu rufen, oder aber ihn dennoch zu erschaffen und nach dem Falle wieder durch Buße zur ursprünglichen Gnade zurückzurufen? Um der körperlichen Schmerzen willen, welche den vergänglichen Teil unserer Natur mit Notwendigkeit treffen, Gott als den Urheber des Bösen zu bezeichnen oder gar ihn nicht einmal für den Schöpfer des Menschen zu halten, um ihm nicht die Schuld an unserem Elende beizumessen, dies verrät die äußerste Kurzsichtigkeit von Menschen, die da das Gute und Böse nach der Wirkung auf die Sinnesempfindung beurteilen und nicht wissen, daß seiner Natur nach sehr wohl gut sein kann, was unseren sinnlichen Teil nicht berührt, und daß das Böse nur die Entfremdung vom Guten ist. Nach Schmerz und Lust das Gute und Nichtgute unterscheiden ist ein Kennzeichen der unvernünftigen Natur, weil bei dieser wegen Mangel an Vernunft und Verstand die Erkenntnis dessen, was wahrhaft gut ist, nicht vorhanden sein kann. Allein daß der Mensch von Gott geschaffen wurde sowie daß er gut und zur Glückseligkeit bestimmt ist, ergibt sich nicht bloß aus dem Gesagten, sondern aus unzähligen anderen Gründen, welche wir jedoch jetzt übergehen müssen, um uns nicht in Weitläufigkeit zu verlieren.</p><p>Wenn wir aber Gott als den Schöpfer des Menschen festhalten, so dürfen wir nicht vergessen, was wir in der Einleitung gegen die Heiden bemerkten. Dort haben wir gezeigt, daß das Wort Gottes, wesenhaft und persönlich existierend, sowohl Wort als auch Gott ist und alle Schöpfermacht besitzt oder vielmehr die Allmacht selbst ist, ferner daß es nur das Gute anstrebt und soweit es will, auch ausführt, weil seinem Willen die entsprechende Macht zur Seite steht, desgleichen daß das Leben der Geschöpfe sein Wille und Werk ist, und daß von ihm zumal der Mensch ins Dasein gerufen und durch herrliche Gaben zur Ähnlichkeit mit Gott erhoben wurde. Da nun das Unerschaffene von Natur aus unwandelbar ist, alles dagegen, was durch die unerschaffene Natur erschaffen wurde, eben als Geschaffenes durch eine Veränderung sein Dasein begann und in steten Veränderungen sich weiterentwickelt, sei es daß bei naturgemäßer Entfaltung eine stete Veränderung zum Besseren stattfindet, sei es, daß beim Abgehen vom rechten Wege eine Wendung zum Schlimmen eintritt, und da nun auch der Mensch zu dieser Gattung gehört und seine Veränderlichkeit zum Schlimmen ausglitt, die einmalige Aufgabe des Guten alle Art von Übeln mit Notwendigkeit zur Folge hatte, so daß durch die Abkehr vom Leben der Tod eingeführt wurde, durch die Wegnahme des Lichtes die Finsternis entstand, durch die Entfernung der Tugend die Schlechtigkeit eintrat und statt der größten Fülle von Gütern ein ganzes Heer von Übeln einzog, ― durch wen sollte nun der Mensch, nachdem er aus Torheit in solches Unheil gefallen war (unmöglich konnte er weise sein, da er der Weisheit den Rücken gekehrt hatte, unmöglich klug, da er der Klugheit entflohen war), wieder zur ursprünglichen Gnade zurückgerufen werden? Wem ziemte wohl die Aufrichtung des Gefallenen? wem die Heimholung des Verlornen? wem die Zurechtweisung des Verirrten? Wem sonst als jedenfalls dem Herrn der Natur? Denn nur für jenen, der ursprünglich das Leben verliehen hatte, war es möglich und geziemend, das verlorne Leben wieder zu erschaffen. Und dies gerade lernen wir durch das Geheimnis der Wahrheit, indem wir durch dasselbe belehrt werden, daß Gott es ist, der den Menschen im Anfange schuf und dann nach dem Falle wieder errettete.Kapitel 9. Die Menschwerdung Gottes ist seiner nicht unwürdig.</p><h2>9</h2><p>[Forts. v. ] Wer auf die Folgerichtigkeit meiner Darlegungen achtet, wird ihnen bis hieher zustimmen, weil keine meiner Aufstellungen etwas enthält, was dem richtigen Gottesbegriff zuwider wäre. Anders wird aber das Verhalten gegen das Folgende sein, worin gerade der Kern des Glaubensgeheimnisses liegt; ich meine die menschliche Geburt, das Wachstum von der Kindheit bis zum Mannesalter, Essen und Trinken, Ermüdung und Schlaf, Trauer und Tränen, Anklage und Gericht, Kreuz und Tod und Grablegung. Diese Überlieferungen, welche wir zugleich mit dem Geheimnis überkommen haben, erschweren für die Kurzsichtigen den Glauben nach einer Richtung, so daß sie wegen der soeben berührten Tatsachen das Folgende nicht annehmen wollen: sie sträuben sich nämlich, die Auferstehung von den Toten, welche ohne allen Zweifel, Gottes sehr würdig ist, anzunehmen, und zwar wegen des Todes, den sie voraussetzt, und der Unziemlichkeit für Gott bedeute.</p><p>Dagegen glaube ich, daß man vor allem seinen Geist von fleischlicher, niedriger Auffassungsweise losmachen und das Gute an und für sich samt seinem Gegensatz untersuchen muß, um die Merkmale zu finden, welche jedes von beiden aufweist. Wie ich nämlich glaube, wird niemand den Satz bestreiten, Schande bringe seiner Natur nach lediglich das Schlechte, keineswegs aber das Nicht-Schlechte, ferner alles, was keine Schande bringt, sei etwas wahrhaft Gutes ohne jeden Beigeschmack des Gegenteils; für Gott schickt sich wieder gewiß alles, was zum Bereiche des Guten gehört. Daher müssen die Gegner entweder beweisen, etwas Schlechtes sei die Geburt, die Ernährung, das Wachstum, die Entwicklung der Natur bis zur Mannesreife, das Kosten des Todes, die Rückkehr aus dem Tode, oder aber sie müssen, wenn sie zugestehen, diese Dinge seien unmöglich als schlecht zu bezeichnen, notwendig auch zugeben, daß sie, eben weil sie nicht schlecht sind, auch keine Schande bringen können. Wenn nun aber das, was von aller Schlechtigkeit und Schändlichkeit weit entfernt ist, unabweisbar als gut angesehen werden muß, wie können sie dann jene wegen ihrer Unvernunft nicht anklagen und bedauern, welche die Behauptung aufstellen, für Gott gezieme sich das Gute nicht.Kapitel 10. Die Menschwerdung scheitert nicht an der Unendlichkeit Gottes einerseits und an der Endlichkeit des Menschen anderseits.</p><h2>10</h2><p>Aber die menschliche Natur, wirft man ein, ist etwas gar Kleines und Begrenztes, die Gottheit dagegen etwas Unendliches; wie könnte denn das unendlich Große von dem unendlich Kleinen umschlossen werden? Allein wer sagt denn, daß die Unendlichkeit Gottes von den Schranken des Fleisches wie von einem Gefäß umschlossen ward? Nicht einmal in unserem menschlichen Leben bildet die Grenze des Fleisches eine Schranke für den Geist; nur das massige Fleisch wird durch seine eigenen Bestandteile umgrenzt; die Seele dagegen breitet sich auf den Schwingen des Gedankens frei in der ganzen Schöpfung aus, indem sie ebenso bis zum Himmel hinauf- als in die Tiefen hinabsteigt, über die Oberfläche der Erde wandelt und auch unterhalb derselben ihre Forschungen anstellt, oft aber auch in die Wunder der jenseitigen Welt betrachtend sich erhebt, ohne daß sie durch die Last des Körpers daran gehindert wäre.</p><p>Wenn also unsere Seele trotz ihrer von der Natur notwendig geforderten Verbindung mit dem Körper überall gegenwärtig sein kann, was zwingt uns denn, zu sagen, die Gottheit werde von der Natur des Fleisches eingeschlossen, anstatt lieber durch schickliche Beispiele uns eine würdigere Vorstellung von dem göttlichen Heilswerke zu machen? Wie man nämlich an einer Fackel das Feuer den Brennstoff umzingeln sieht und der Verstand das Feuer am Stoffe ganz gut von dem das Feuer nährenden Stoff zu unterscheiden vermag, in Wirklichkeit aber beide nicht voneinander getrennt werden können, so daß man etwa das Feuer losgelöst vom Brennstoff, zu zeigen vermöchte, vielmehr beide eine untrennbare Einheit ausmachen, ― niemand übertrage mir jedoch die Vergänglichkeit des Feuers in das Vergleichsobjekt, sondern jeder möge nur das Entsprechende am Beispiele annehmen, alles Nicht-Entsprechende oder Unpassende bei Seite lassen ―, auf dieselbe Weise also wie wir die Flamme zwar mit dem Brennstoff enge verbunden, aber doch keineswegs von ihm eingeschlossen sehen, was hindert uns dann noch, eine gewisse Einheit und Verbindung der göttlichen Natur mit der menschlichen anzunehmen und trotz dieser Verbindung den richtigen Gottesbegriff festzuhalten, in der Überzeugung, daß die Gottheit von den Schranken der Endlichkeit frei bleibt, auch wenn sie in einem Menschen wohnt?Kapitel 11. Das beste Analogon zur Verbindung der Gottheit mit der Menschheit ist die Verbindung der Seele mit dem Leibe.</p><h2>11</h2><p>Wenn du aber frägst, wie die Gottheit mit der Menschheit sich verbinde, so mußt du zuvor fragen, welches die Verbindung der Seele mit dem Leibe sei. Bleibst du aber über die Art und Weise der Verbindung der Seele mit dem Leibe im Unklaren, so darfst du dir nicht einbilden, jenes liege innerhalb der Grenzen unseres Begreifens; vielmehr wie wir hier, weil das Fleisch losgetrennt von der Seele, tot und ohnmächtig ist, überzeugt sind, daß der Leib etwas anderes ist als die Seele, und doch die Art der Verbindung nicht begreifen, so bekennen wir auch dort, daß die göttliche Natur wegen ihrer unvergleichlichen Herrlichkeit von der sterblichen und hinfälligen Menschennatur verschieden sei, aber wir können nicht zugeben, daß wir die Art und Weise der Verbindung des Göttlichen und Menschlichen begreifen, sondern* daß* zwar Gott in der menschlichen Natur geboren wurde, bezweifeln wir wegen der berichteten Wunder nicht, das* Wie* aber zu erforschen, lehnen wir, als unseren Verstand übersteigend, ab.</p><p>[Forts. v. ] Denn wenn wir auch glauben, daß die ganze körperliche und geistige Schöpfung durch die unkörperliche und ungeschaffene Natur ihre Existenz empfangen habe, so lassen wir uns durch diesen Glauben keineswegs dazu verleiten, das Woher oder das Wie zu durchforschen, sondern wir nehmen die Tatsache an, lassen aber die Art und Weise der Erschaffung des Universums unerörtert, weil sie unaussprechlich und nicht erklärlich ist.Kapitel 12. Die Gottheit Christi erhellt aus seinen Werken.</p><h2>12</h2><p>Wer aber dafür, daß Gott im Fleische sich geoffenbart habe, die Beweise sucht, der sehe hin auf seine Werke. Denn auch für die Existenz Gottes überhaupt haben wir wohl auch keinen anderen Beweis als den, der in seinen Werken liegt. Wie wir nun im Hinblick auf das Universum und in ernster Würdigung der Einrichtungen der Welt und der Wohltaten, die uns Gott während unseres Lebens spendet, zur Einsicht gelangen, daß über uns eine Macht thront, welche alles Werdende erschafft und alles Seiende erhält, so dürfen wir auch hinsichtlich der Offenbarung Gottes im Fleische als völlig genügenden Beweis die machtvollen Wunder betrachten, weil wir an den vom Herrn berichteten Werken alle jene Merkmale wahrnehmen, welche die göttliche Natur auszeichnen. Gott nur kann die Menschen ins Leben rufen, Gott nur den Lebenden durch seine Vorsehung erhalten, Gott nur ihnen Speise und Trank geben, so lange sie im Fleische leben, Gott nur die Natur durch Heilung wiederherstellen, wenn sie durch Krankheit gelitten, Gott nur in gleicher Weise die ganze Schöpfung beherrschen: Erde, Meer, Luft und die Regionen über der Luft, Gott nur eine Macht besitzen, die alles vermag und vor allem Tod und Verwesung überwindet.</p><p>Wenn nun die Geschichte des Herrn in diesen und ähnlichen Punkten ein Zurückbleiben aufweisen würde, so hätten die Ungläubigen das Recht, unser Glaubensgeheimnis zu verwerfen; wenn aber alle Merkmale, die Gott kennzeichnen, in den Berichten über ihn sich finden ― was kann man dann noch als Hindernis des Glaubens angeben?Kapitel 13. Geburt und Tod beweisen nicht die bloße Menschheit Jesu.</p><h2>13</h2><p>Aber, wirft man ein, Geburt und Tod sind ein Merkmal der fleischlichen Natur. Auch ich gebe dies zu. Doch das, was bei Jesus der Geburt vorausging und dem Tode nachfolgte, weist weit über die Zugehörigkeit zu unserer Natur hinaus. Denn wenn wir die beiden Grenzpunkte des menschlichen Lebens ins Auge fassen, so wissen wir, von woher wir unseren Anfang nehmen und womit wir endigen. Durch Leidenschaft nämlich erhält der Mensch den Anfang des Seins, und in Leiden endet er. Dort aber begann weder die Geburt durch Leidenschaft, noch endigte der Tod in Leiden; denn weder ging der Geburt die Lust voraus, noch folgte dem Tode die Verwesung. Glaubst du nicht dem Wunder? Ich freue mich über deinen Unglauben; denn damit gibst du zu, daß die Vorgänge, um derentwillen du das Gesagte für unglaubenswürdig hältst, über die Natur hinausgehen; aber gerade dies kann dir zum Beweis für die Gottheit des Erschienenen werden, weil die Berichte über ihn sich nicht im Geleise des bloß Natürlichen bewegen. Denn wenn die Berichte über Christus innerhalb der Grenzen der Natur bleiben würden, wo wäre dann das Göttliche? Wenn sie aber die Schranken der Natur überschreiten, so beweisen gerade jene Stücke, die du nicht glauben willst, die Gottheit dessen, der gepredigt wird.</p><p>Der Mensch allerdings wird durch Paarung erzeugt und nach seinem Tod verfällt er der Verwesung. Würde die Predigt* dieses* vom Herrn verkünden, so könntest du niemals an seine Gottheit glauben, weil alsdann Merkmale unserer Menschennatur wie unwiderlegliche Zeugnisse an ihm haften würden. Wenn dir dagegen gesagt wird, er sei zwar geboren worden, er sei aber auch sowohl durch die Art und Weise seiner Geburt als auch durch die Fernhaltung der Verwesung dem gewöhnlichen Verlauf des menschlichen Lebens entrückt worden, so wird es nur gut und folgerichtig sein, wenn du deinem Denken eine andere Richtung gibst und dich zu dem Glauben entschließest, Jesus Christus gehöre nicht zu den Menschen, die durch ihre ganze Natur als solche sich erweisen; denn wer nicht glaubt, daß ein mit solchen Merkmalen Ausgestatteter ein bloßer Mensch sei, muß notwendig zum Glauben gelangen, daß dieser wirklich Gott sei. Denn der nämliche, der uns seine Geburt berichtet, berichtet auch, daß er aus einer Jungfrau geboren sei. Ist es nun auf Grund der Berichte glaublich, daß er geboren ward, so kann es auf den nämlichen Grund hin nicht unglaubhaft sein, daß er in der angegebenen Weise geboren wurde; denn derselbe, der uns seine Geburt erzählt, fügt auch bei, daß sie eine jungfräuliche war. Und ebenso legt jener, der uns seinen Tod berichtet, auch Zeugnis dafür ab, daß er nach dem Tode auferstanden sei. Willst du nun auf Grund dessen, was dir gepredigt wird, seine Geburt und seinen Tod zugeben, so wirst du unter allen Umständen aus dem nämlichen Grund auch zugeben müssen, daß seine Geburt fern von Leidenschaft und sein Tod fern von Leiden gewesen sei; dies geht aber über die Natur hinaus; folglich steht jener auch nicht innerhalb der Grenzen der Natur, von dem nachgewiesen wurde, daß er auf übernatürliche Weise geboren wurde.Kapitel 14. Seine Liebe zu uns veranlaßt Gott, Mensch zu werden.</p><h2>14</h2><p>Aus welchem Grunde wohl, frägt man, stieg Gott zu solcher Niedrigkeit herab, daß unser Glaube wanken möchte, ob Gott, der doch das unfaßbare, undenkbare und unaussprechliche Wesen ist, das über alle Herrlichkeit und Hoheit ist, sich wirklich mit der armseligen Hülle der menschlichen Natur umkleidet habe, so daß durch diese Verbindung mit dem Niedrigen auch seine unendlichen Kräfte in Mitleidenschaft gezogen wurden? Auch hierauf sind wir um eine Antwort nicht verlegen, welche der Hoheit Gottes Rechnung trägt. Du fragst also nach dem Grunde, warum Gott unter den Menschen geboren werden wollte. Wenn du die Wohltaten, die uns Gott erweist, aus unserem Leben streichest, so wirst du kaum noch etwas finden, das dich zur Erkenntnis Gottes führen könnte; denn aus den Wohltaten, die wir empfangen, erkennen wir den Wohltäter. Indem wir nämlich auf das Gute, das uns zuteil wird, unser Augenmerk richten, ziehen wir daraus einen Schluß auf die Natur dessen, der es uns spendet.</p><p>[Forts. v. ] Hast du nun auf diesem Wege gefunden, daß die Liebe zu uns Menschen ein besonderes Merkmal der göttlichen Natur ist, so hast du damit auch den Grund, nach dem du fragest, hast die Ursache, warum Gott unter den Menschen weilte. Es bedurfte ja des Arztes unsere kranke Natur, es bedurfte des Aufhebers der gefallene Mensch, es bedurfte des Lebendigmachers der des Lebens Verlustige; es bedurfte des Zurückführers zum Guten der der Verbindung mit dem Guten Beraubte; es sehnte sich nach der Ankunft des Lichtes der in Finsternis Gehüllte, es verlangte nach dem Retter der Gefangene, nach dem Erlöser der Gebundene, nach dem Befreier der vom Sklavenjoch Niedergedrückte. Sind dies zu geringfügige und zu unbedeutende Dinge als daß sie hätten Gott bestimmen dürfen, wie ein Arzt zum Besuche der menschlichen Natur herabzusteigen, nachdem nun einmal die Menschheit in einer so kläglichen und armseligen Lage sich befand?Kapitel 15. Warum erlöste uns Gott nicht durch einen bloßen Willensakt?</p><h2>15</h2><p>Aber, wirft man ein, es wäre doch für Gott möglich gewesen, der Menschheit zu helfen und dabei selbst leidlos zu bleiben! Denn wenn er durch sein bloßes Denken das Universum schaffen und schon durch eine Bewegung seines Willens das Nicht-Seiende ins Dasein rufen konnte, warum wollte er nicht auch den Menschen durch eine souveräne und göttliche Verfügung der Gewalt des Feindes entreißen und in den ursprünglichen Zustand zurückführen, sobald es ihm beliebte? Warum machte er vielmehr große Umwege, indem er eine körperliche Natur annimmt, durch eine Geburt ins Leben eintritt, folgerichtig auch jedes Alter durchläuft, dann den Tod kostet und so durch seine Auferstehung zum Ziele gelangt, gerade als ob es ihm nicht freigestanden wäre, auf der Höhe der göttlichen Herrlichkeit zu verbleiben und unter Vermeidung aller Umwege durch eine göttliche Anordnung den Menschen zu erretten? ― Solchen Einwänden müssen wir nun die Wahrheit entgegenstellen, damit der Glaube aller, welche die Vernunftgemäßheit unseres Geheimnisses prüfen wollen, kein Hindernis findet. In erster Linie wollen wir, was wir teilweise bereits oben untersucht haben, in Erwägung ziehen, nämlich was im Gegensatz zur Tugend steht.</p><p>Wie dem Lichte die Finsternis, dem Leben der Tod, so steht der Tugend das Böse als Gegensatz gegenüber und sonst nichts in der Welt. Denn gleichwie unter den vielen Dingen, welche wir in der Schöpfung wahrnehmen, keines, weder Stein noch Holz, weder Wasser noch Mensch, noch irgendein anderes von den existierenden Wesen zum Licht und Leben in Gegensatz steht als einzig das, was wir als begrifflichen Gegensatz hiezu feststellen, nämlich Finsternis und Tod, so kann hinsichtlich der Tugend auch niemand behaupten, irgend etwas anderes in der ganzen Schöpfung sei ihr Gegensatz als nur das, was zum Begriff des Bösen gehört. Würde also unsere Lehre die Anschauung vertreten, Gott habe eine Verbindung mit dem Bösen eingegangen, so hätten die Gegner allerdings Veranlassung, unseren Glauben anzugreifen, weil wir Widersprechendes und Ungereimtes über die göttliche Natur aufstellten. Es wäre ja frevelhaft zu sagen, die ewige Weisheit, Güte und Unvergänglichkeit oder was sonst Erhabenes gedacht und genannt werden kann, sei in das gerade Gegenteil verfallen. Wenn nun Gott die unendliche Vollkommenheit selbst ist, der Gegensatz zur Vollkommenheit aber nicht in einer Natur, sondern einzig und allein in der Schlechtigkeit besteht, Gott ferner nicht in der Schlechtigkeit, sondern in der menschlichen Natur erschien, ungeziemend und entehrend aber lediglich der Zustand der Schlechtigkeit heißen kann, in welchen Gott jedoch niemals geriet und auch seiner Natur nach niemals geraten kann, ― was schämen sie sich also, zu bekennen, daß Gott die menschliche Natur angenommen habe, da doch an der menschlichen Ausstattung sich nichts findet, was an sich einen Gegensatz zum Guten bildet? Denn weder die Vernunft, noch der Verstand, noch die Fähigkeit zur Kunst und Wissenschaft, noch etwas anderes, was zur menschlichen Wesenheit gehört, ist dem Begriff des Guten entgegengesetzt.Kapitel 16. Die Menschwerdung versetzte Gott auch nicht in einen seiner unwürdigen Leidenszustand.</p><h2>16</h2><p>Aber die Veränderlichkeit unseres Körpers, sagt man, bedeutet einen Zustand des Leidens; und wer immer einen solchen Körper hat, befindet sich auch in einem Leidenszustand, die Gottheit aber ist leidenslos; eine Gottes unwürdige Annahme ist es daher, wenn man meint, der von Natur aus Leidenslose habe sich in eine Verbindung mit dem Leiden eingelassen. ― Doch auch gegen diesen Einwurf können wir uns des nämlichen Vernunftgrundes bedienen, nämlich des Umstandes, daß man Leiden bald im eigentlichen Sinne nimmt, bald im uneigentlichen. Was sich nun des freien Willens bemächtigt, um ihn vom Guten zum Bösen zu verführen, all das bringt ein wahres und eigentliches Leiden mit sich; alles in unserer Natur aber, was nach bestimmten Gesetzen seinen regelmäßigen Verlauf nimmt, das dürfte man eher ein Tätigsein nennen als ein Leiden oder Dulden; dazu gehört z. B. die Geburt, das Wachstum, die Erhaltung des Subjekts durch die Nahrung, welche aufgenommen, aber auch wieder ausgeschieden wird, ebenso die Vereinigung der Elemente zum Aufbau des Ganzen, desgleichen der Zerfall des Leibes in seine Bestandteile und die darauf folgende Rückkehr derselben in verwandte Stoffe. Womit läßt nun das Geheimnis unseres Glaubens die Gottheit in Verbindung treten? Etwa mit dem wahren und eigentlichen Leiden, oder aber nur mit der naturgemäßen Entwicklung? Würde nämlich die Behauptung vertreten, die Gottheit sei sündhaft geworden, so müßte man ein solch alberne Verkündigung ablehnen, weil sie nichts Vernünftiges über Gott verbreiten würde. Wenn dagegen die Verkündigung dahin geht, er habe die menschliche Natur angenommen, deren Entstehen und Bestehen von ihm ausging, wo verstößt sie alsdann gegen den würdigen Begriff von Gott, da doch dadurch auch vom Glauben kein Leidenszustand in den Gottesbegriff hineingetragen wird? Denn auch vom Arzte sagen wir keineswegs, er verfalle in Krankheit, wenn er Kranke heilt, vielmehr bleibt der Arzt, selbst wenn er den kranken Körperteil berührt, frei von Krankheit.</p><p>Wenn nun, wie dargetan, die Geburt an sich kein Leiden im eigentlichen Sinne genannt werden kann, dann auch nicht das Leben. Freilich gibt die Wollust den Anstoß zur Geburt des Menschen, und die Neigung zum Bösen haftet wie eine Krankheit an unserer Natur: aber der Menschgewordene blieb von beiden Übeln frei, wie das Geheimnis lehrt. War nun die Wollust bei seiner Geburt ausgeschlossen und das Böse aus seinem Leben, wo bliebe dann noch Platz für ein wirkliches Leiden im dargelegten Sinn, mit welchem Gott nach unserer Glaubenslehre in Verbindung getreten wäre?</p><p>Wollte aber jemand die Trennung der Seele und des Leibes als ein Leiden bezeichnen, so hätte er mehr Grund, die Verbindung beider so zu nennen. Ist nämlich die Trennung des Verbundenen ein Leiden, dann verdient auch die Verbindung des Getrennten diesen Namen; denn eine Veränderung bedeutet sowohl die Verbindung des Getrennten als auch die Trennung des Verbundenen; daher muß man der letzteren Veränderung den nämlichen Namen geben wie der ersteren. Ist aber die erste Veränderung, welche wir Geburt nennen, kein eigentliches Leiden, so auch nicht die zweite Veränderung, welche wir Tod nennen, durch den nämlich Leib und Seele geschieden werden. Von Gott nun glauben wir, daß er die beiden Veränderungen, die unserer Menschennatur zukommen, an sich erfahren habe: sowohl diejenige, durch welche die Seele sich mit dem Körper verbindet, als auch jene, durch welche die Seele vom Körper geschieden wird.</p><p>Da ferner das Menschengebild aus Zweifachem, aus Sinnlichem und Geistigem zusammengesetzt ist, so traf Gott bei jener geheimnisvollen und unaussprechlichen Verbindung, die er einging, die Einrichtung, daß das einmal Verbundene, nämlich Leib und Seele, auch für immer verbunden bleibe. Denn da unsere Natur nach dem ihr gegebenen Gesetze auch in ihm zur Scheidung des Leibes und der Seele fortschritt, so verband er das Geschiedene durch die göttliche Macht wie mit einem Leim, indem er das Getrennte zu unauflösbarer Einheit zusammenführte. Und dies ist die Auferstehung, bei der die zuerst schon verbundenen, aber dann voneinander getrennten Bestandteile zu einer Einheit zurückkehren oder sozusagen verschmolzen werden, die keine Lösung mehr kennt, damit der ursprüngliche Gnadenstand der Menschennatur wieder hergestellt wird und die Menschen das ewige Leben zurückgewinnen, nachdem das Böse, das in unsere Natur eindrang, durch unsere Auflösung gleichsam ausrann, ähnlich wie die Flüssigkeit, sobald das Gefäß zerbricht, ausläuft und verschwindet, weil nichts mehr da ist, was sie zusammenhält. Wie aber der Tod bei* einem* Menschen begann und dann auf alle Menschen überging, so fing auch die Auferstehung bei* Einem* an und verbreitet sich von demselben auf die ganze Menschheit. Wie er nämlich die von ihm angenommene Seele wieder mit ihrem Leib vereinigt auf Grund jener höheren Macht, die vom ersten Augenblick des Lebens zu beiden gehörte, so vereinigte er in allumfassender Weise die geistige Substanz mit der sinnlichen, so daß sich, was bei ihm begann, sich bis zum Letzten der Menschen fortsetzt. Da nämlich in dem von ihm angenommenen menschlichen Doppelwesen die Seele nach dem Tode wieder in den Leib zurückkehrte, so geht von ihm wie von einem Urquell die Vereinigung des Getrennten durch göttliche Macht auf die ganze Menschheit über. Und darin liegt das Geheimnis der göttlichen Heilsordnung hinsichtlich des Todes und der Auferstehung, daß auch bei ihm, weil er dem gewöhnlichen Gang der Natur nicht hindernd in den Weg trat, durch den Tod zwar die Seele vom Leibe sich trennte, dann aber bei der Auferstehung beide wieder miteinander vereinigte, damit er selbst die Grenzscheide von beiden werde, des Todes und des Lebens, indem er einerseits in sich der weiteren natürlichen Auflösung des von der Seele getrennten Körpers Stillstand gebot, andererseits der Anfang der Wiedervereinigung der getrennten menschlichen Wesensbestandteile wurde.Kapitel 17. Die Frage, warum uns Gott nicht durch einen Machtspruch, sondern durch die Menschwerdung erlöste, erfordert eingehendere Untersuchung.</p><h2>17</h2><p>Allein mancher wird behaupten, daß der gegen uns erhobene Einwurf noch nicht zurückgewiesen sei, ja, daß durch das Gesagte der Vorhalt der Ungläubigen noch eine Stütze erhalten habe. Wenn nämlich, wie unsere Rede hervorhob, eine so große Macht ihm zur Verfügung steht, daß von ihm sowohl die Aufhebung des Todes als auch die Wiedereinführung ins Leben abhängt, warum führt er denn seinen Heilsplan nicht durch seinen bloßen Willen aus, sondern vollzieht unsere Erlösung auf solchem Umwege, indem er sich, um den Menschen zu erretten, geboren werden und sich ernähren läßt und sogar in den Tod geht, während es ihm doch freistand, uns unter Vermeidung all dieser Umständlichkeiten das Heil zu erwerben? ― Solchen Einreden gegenüber könnte vor Gutgesinnten zwar schon der Hinweis darauf genügen, daß auch die Kranken dem Arzte durchaus nicht das Kurverfahren vorschreiben, noch mit diesem ihrem Wohltäter wegen seiner Behandlungsart ins Gericht gehen, weshalb er etwa den leidenden Körperteil berührt habe und gerade auf dieses Heilmittel verfallen sei, während ein ganz anderes am Platz gewesen wäre; sondern sie behalten das Endziel des ganzen Verfahrens im Auge und nehmen mit Dank die Wohltat entgegen, die er ihnen erweisen will. Aber weil nach den Worten des Propheten der Reichtum der göttlichen Güte ihren Segen im Verborgenen ausstreut (Ps. 30, 23 [hebr. Ps. 31, 23]) und dieselbe für uns, solange wir im gegenwärtigen Leben weilen, nicht taghell sichtbar wird, ― denn alle Einwände des Unglaubens wären sogleich abgeschnitten, wenn der Gegenstand unserer Hoffnung ganz klar vor aller Augen daläge; nun soll uns erst in der Zukunft ganz offen enthüllt werden, was wir jetzt lediglich im Glauben sehen ― so wird es wohl gut sein, hinsichtlich der noch nicht beantworteten Fragen nach Kräften eine Lösung zu suchen, die auch denen genügen dürfte, welche von Vorurteilen befangen sind.Kapitel 18. Die Angemessenheit der Menschwerdung ergibt sich schon aus den segensreichen Wirkungen derselben.</p><h2>18</h2><p>Schwer verständlich ist es aber, daß manche, wenn sie das Weilen Gottes in einem menschlichen Lebensgang glauben sollen, in seiner Herabkunft auf Erden manche Aussetzungen zu machen haben, als ob sie nicht aus weisen und guten Gründen erfolgt sei. Denn für alle, welche der Wahrheit nicht zu schroffen Widerstand leisten, gibt es für das Wohnen Gottes hienieden einen Beweis, der von nicht geringer Bedeutung ist und schon in dem gegenwärtigen Leben in die Erscheinung tritt, ich meine den Beweis, der durch Tatsachen geliefert wird. Denn wer wüßte nicht, wie der Trug der Dämonen über alle Teile der Erde sich ausgedehnt und den höchsten Grad erreicht hatte, indem er durch den Götzenwahn das Leben der Menschen beherrschte, wie es bei allen Völkern der Welt Sitte geworden war, durch Schlachtopfer und Greuel vor den Altären den Dämonen in den Götzen zu huldigen? Seitdem aber, wie der Apostel sagte, die Heilsgnade Gottes für alle Menschen erschienen war (Tit. 2, 11), die in der menschlichen Natur zu uns herniederstieg, da verschwand all das einem Rauche gleich in Nichts, so daß aufhörte der Wahnsinn der Orakel und Zeichendeuterei, aufgehoben wurden die jährlichen Festzüge und die blutigen und unsauberen Metzeleien bei den Hekatomben und bei den meisten Völkern beseitigt wurden Altäre, Vorhöfe, Haine und Bildsäulen, sowie die übrigen Einrichtungen, welche die Götzendiener zur Täuschung ihrer selbst und ihrer Anhänger getroffen hatten, so daß man in vielen Gegenden sich gar nicht einmal erinnert, ob dies je einmal stattgefunden habe, dagegen einzogen im Namen Christi auf dem ganzen Erdenrund Tempel und Altäre, der heilige und unblutige Priesterdienst, die mehr im Werke als im Worte gepflegte erhabene Weisheitsliebe, die Geringschätzung des irdischen Lebens und die Verachtung des Todes, welche unleugbar die von den Tyrannen zur Glaubensleugnung Gedrängten an den Tag legten, da sie die Qualen des Leibes und die Verurteilung zum Tode für nichts achteten, wozu sie nicht fähig gewesen wären, wenn sie nicht einen klaren und unzweifelhaften Beweis von der Erscheinung Gottes auf Erden gehabt hätten.</p><p>Das nämliche können wir auch gegen die Juden als genügendes Zeugnis dafür verwenden, daß derjenige auf Erden erschienen ist, an den sie nicht glauben. Denn bis zur Gotteserscheinung Christi hatten sie in Jerusalem ihren glänzenden Königsthron, ihren hochberühmten Tempel, ihre alljährlichen Feste; und alles, was sonst noch in Bildern für solche, welche mit dem tieferen, mystischen Verständnis noch nicht vertraut sind, vom Gesetze vorgeschrieben war, blieb ihnen nach ihrer altehrwürdigen, verordneten Religionsübung völlig unverwehrt. Da sie aber den Erwarteten und den durch die Propheten und durch das Gesetz Vorherverkündeten gesehen hatten und doch fernerhin dem Glauben an den Erschienenen jenen trügerischen Aberglauben vorzogen, welchen sie infolge falscher Auslegung der Gesetzesworte aufrechthielten, mehr der Gewohnheit als vernünftiger Erwägung gehorchend, und die erschienene Gnade nicht annahmen, so sind die Feierlichkeiten ihres Kultus nur noch in Erzählungen vorhanden, welche keine Verwirklichung mehr finden, ihr Tempel vollends ist kaum mehr in seinen Spuren zu erkennen, von jener herrlichen Stadt aber sind nur Trümmer vorhanden, so daß also den Juden von ihrem Nationalkultus nichts mehr geblieben ist, ja sogar ihre Kultusstätte in Jerusalem durch den Befehl der Herrscher ihnen unzugänglich gemacht wurde.Kapitel 19. Noch andere Gründe für die Menschwerdung.</p><h2>19</h2><p>[Forts. v. ] Da aber weder die Heiden noch die Anhänger der jüdischen Lehrmeinungen geneigt sind, die angeführten Tatsachen als Beweise für das Herniedersteigen Gottes anzusehen, so wird es sich empfehlen, noch in einer besonderen Untersuchung der Frage näherzutreten, warum Gott unsere Natur annahm, um in seiner Person die Menschheit zu retten, statt durch einen Machtspruch diese eine Absicht auszuführen. Welchen Ausgangspunkt werden wir wählen, um die Rede zum vorgesteckten Ziele fortzuführen? Keinen anderen als die Vorstellungen, die die Ehrerbietigkeit von Gott hat und die wir in der Hauptsache noch durchgehen wollen.Kapitel 20. Gott wirkt nicht auf Grund einer einzelnen guten Eigenschaft, sondern auf Grund aller zusammen.</p><h2>20</h2><p>Allgemein wird zugestanden, daß man Gott nicht bloß für mächtig halten müsse, sondern auch für gerecht und gütig und weise und was sonst unser Denken zur Vollkommenheit rechnet. Folglich darf man auch hinsichtlich des Heilsratschlusses der Menschwerdung, die nun zur Erörterung steht, auch nicht verlangen, daß nur* eine* der göttlichen Eigenschaften hervortrete, alle übrigen dagegen ausgeschaltet würden. Überhaupt kann keine der herrlichen Eigenschaften, die wir Gott zugestehen, als eine Vollkommenheit angesehen werden, wenn sie für sich allein, losgelöst von den übrigen, betrachtet wird; so ist weder die Güte wahre Güte, wenn sie nicht mit Gerechtigkeit, Weisheit und Macht gepaart ist ― denn was ungerecht, unweise und schwach ist, ist keine wahre Güte ―; noch sieht man die Macht, wenn sie von Gerechtigkeit und Güte getrennt ist, als eine Vollkommenheit an; denn eine solche Art von Macht wäre Brutalität und Willkür. Und dies gilt von allen göttlichen Attributen. Wäre die Weisheit nicht von der Gerechtigkeit oder die Gerechtigkeit nicht von Macht und Güte begleitet, so würde man diese Eigenschaften eher als Untugenden denn als Tugenden bezeichnen.</p><p>Wenn nun bei den Großtaten Gottes alle seine herrlichen Eigenschaften notwendig zusammenwirken, so wollen wir zusehen, ob der Ratschluß der Menschwerdung eine der Vollkommenheiten vermissen läßt, die wir geziemenderweise Gott zuschreiben! Vor allem verlangen wir nun, daß sich in diesem Geheimnis die Güte Gottes offenbare; wie könnte aber Gott seine Güte deutlicher zeigen als dadurch, daß er dem Menschen, nachdem er zum Feinde übergegangen war, nacheilte, um ihn zu erretten, daß er seiner im Guten beharrlichen und unveränderlichen Natur treu blieb trotz der Veränderlichkeit des menschlichen Willens? Denn er wäre nicht gekommen, um uns zu erlösen, wenn ihm nicht, wie David sagt, seine Güte diesen Plan eingegeben hätte (Ps. 105, 4 [hebr. Ps. 106, 4] vgl. Ps. 118, 55 [hebr. Ps. 119, 55]). Aber die Güte, die in diesem Plane zum Ausdruck kam, hätte nichts genützt, wenn nicht die Weisheit seiner Liebe zu uns Menschen zur Ausführung des Heilsplanes beigestanden wäre. Denn wenn jemand erkrankt, so gibt es zwar viele, welche den Wunsch haben, ihn bald wieder von seinen Leiden befreit zu sehen; nur diejenigen aber können ihren guten Willen zur Ausführung bringen, welche Verständnis und Geschicklichkeit zur Krankenheilung haben. Also muß sich Weisheit mit der Güte verbinden.</p><p>Wie zeigt sich nun bei der Menschwerdung, die uns jetzt beschäftigt, die Verbindung von Weisheit und Güte? Dadurch, daß wir den guten Vorsatz gar nicht hätten erkennen können, wenn er für sich allein geblieben wäre. Denn wie käme der Vorsatz zur Erscheinung, wenn er nicht in den entsprechenden Taten zur Äußerung kommt? Die Ereignisse aber beweisen durch ihre treffliche Verknüpfung und durch ihre richtige Reihenfolge deutlich, welche große Weisheit und Kunst die göttliche Heilsordnung in sich schließt. ― Da jedoch die Weisheit erst durch ihre Verbindung mit der Gerechtigkeit zur Vollkommenheit wird, ohne diese aber nicht als gut bezeichnet werden könnte, so geziemt es sich, diese beiden, ich meine die Weisheit und die Gerechtigkeit, auch hinsichtlich der Menschwerdung ins Auge zu fassen.Kapitel 21. Die Menschwerdung beweist auch die Gerechtigkeit Gottes.</p><h2>21</h2><p>Wie zeigt sich nun die Gerechtigkeit Gottes in der Menschwerdung? Zunächst müssen wir uns an das, was wir der Ordnung halber am Anfang der Untersuchung gesagt haben, wieder erinnern, nämlich, daß der Mensch als Abbild der göttlichen Natur geschaffen wurde und sowohl durch manch andere Vorzüge als auch durch die Freiheit des Willens die Ähnlichkeit mit Gott an sich trägt, aber auch, daß er mit einer gewissen Notwendigkeit eine veränderliche Natur besitzt. Denn weil er den Anfang seiner Existenz durch Veränderung gewann, so war es unmöglich, daß er unwandelbar sei. Der Übergang aus dem Nichtsein in das Sein bedeutet eine gewisse Veränderung, indem sich die Nicht-Existenz durch die Macht Gottes in Existenz verwandelt. Auch aus dem Grunde haftet die Veränderlichkeit notwendig am Menschen, weil er ein Nachbild der göttlichen Natur ist, das Nachbild aber, wenn es sich nicht einigermaßen unterschiede, ganz dasselbe wäre, was das Urbild ist. Die Verschiedenheit zwischen dem geschaffenen Nachbild und dem Urbild besteht nun darin, daß letzteres seiner Natur nach unwandelbar ist, ersteres aber nicht; entsprechend der Veränderung, welcher das Nachbild seine Existenz verdankt, verharrt es aber als Verändertes nicht in der Existenz.</p><p>Die Veränderung aber ist eine nie ruhende Fortbewegung eines Dinges von dem Zustand, in dem es ist, in einen anderen. Diese Bewegung jedoch verläuft in zwei Richtungen: entweder nie rastend zum Guten, wodurch der Fortschritt entsteht, der keinen Stillstand kennt, da das Endziel in unabsehbarer Ferne ist, oder aber zum Gegenteil des Guten, dessen Existenz in der Nicht-Existenz besteht ― wenn wir vom Gegenteil des Guten reden, haben wir eine Gegenüberstellung im Sinne, wie wir sie zwischen dem Seienden und Nicht-Seienden, zwischen Existenz und Nicht-Existenz feststellen. ―</p><p>Da nun also unsere menschliche Natur wegen ihrer Wandelbarkeit und Veränderlichkeit, sowie wegen ihres Drängens und Strebens unmöglich in sich selbst ruhig verharren kann, sondern der Wille stets und unaufhörlich nach etwas verlangt, weil das Begehren nach dem Schönen ihn naturnotwendig in Bewegung setzt, da ferner nur das Gute wahrhaft ist, nicht aber sein Gegenteil, das bloß der Schein des Schönen umgibt, hierüber aber die in uns wohnende Vernunft das Urteil fällt, so daß wir das wahrhaft Schöne ebensowohl erlangen, als es, wenn wir durch den trügerischen Schein verführt, zum Gegenteil uns hinziehen lassen, verlieren können, ― wie es nach der Fabel dem Hunde erging, welcher den Schatten von dem Fleischstück, das er im Munde hatte, im Wasser sah und voll Gier darnach schnappend, die wirkliche Nahrung fahren ließ, so daß er seinen Hunger nicht stillen konnte ―; da also die Vernunft, in ihrem Verlangen nach dem wahrhaft Schönen in die Irre gehend, sich dem Nicht-Seienden zuwendete, weil sie sich durch den Trug des Ratgebers und Erfinders des Bösen bereden ließ, daß das Gegenteil des wirklich Schönen schön wäre ― nimmer hätte der Trug sein Ziel erreicht, wenn nicht wie ein Köder der Schein des Schönen am Angelhaken des Bösen befestigt gewesen wäre ― und da also der Mensch, in sinnlicher Lust dem Feinde des Lebens sich unterwerfend, in dieses Unglück stürzte, so betrachte von diesem Falle aus alle Eigenschaften, welche Gott seinem Begriffe nach zukommen: die Güte, die Weisheit, die Gerechtigkeit, die Macht, die Unvergänglichkeit und was sonst noch zur höheren Vollkommenheit gehört! Weil er die Güte selbst ist, so hat er Mitleid mit dem gefallenen Menschen, und in seiner Weisheit ist er auch nicht im Unklaren über die Art, wie er ihn wieder erheben kann. Die Weisheit schließt aber auch die Fähigkeit in sich, ein gerechtes Urteil zu fällen; denn niemand wird wahre Gerechtigkeit bei der Torheit suchen.Kapitel 22. Die Gerechtigkeit Gottes selbst gegen den Satan.</p><h2>22</h2><p>[Forts. v. ] Worin zeigt sich nun bei unserem Geheimnisse die Gerechtigkeit Gottes? Darin, daß er sich gegen den Satan, der uns in Besitz genommen hatte, nicht gleichsam tyrannischer Gewalt bediente und ihm, obgleich er den Menschen nur durch sinnliche Lust sich unterworfen hatte, einen gewissen Rechtsanspruch zugestand und infolgedessen uns ihm nicht auf Grund seiner Übermacht entriß. Alle, welche um Geld ihre Freiheit hingaben, werden Sklaven ihrer Käufer, da sie ihre eigenen Verkäufer waren, und weder sie noch andere haben das Recht, ihre Freigebung zu verlangen, selbst wenn es Adelige waren, welche sich freiwillig in ein solches Geschick begeben haben; und wenn jemand selbst aus Teilnahme für den Verkauften gegen den Käufer Gewalt anwenden würde, so müßte er als ungerecht erscheinen, da er den auf gesetzlichem Wege Erworbenen auf ungesetzlichem Wege in Freiheit versetzen wollte; dagegen wenn er Lust hat, ihn durch Kauf zu erwerben, so verbietet ihm dies kein Gesetz; in ähnlicher Weise war es, nachdem wir uns selbst freiwillig verkauft hatten, für Gott, als er uns gemäß seiner Güte wieder in Freiheit versetzen wollte, eine Art Notwendigkeit, nicht auf einen gewalttätigen, sondern auf einen gerechten Weg der Befreiung bedacht zu sein. Dieser besteht aber darin, daß man dem Besitzer alles anbietet, was er etwa als Lösegeld für sein Eigentum verlangt.Kapitel 23. Fortsetzung.</p><h2>23</h2><p>Was hat nun der Besitzer lieber haben wollen? Über seine Forderung können wir auf dem Wege der Schlußfolgerung eine Vermutung uns bilden, wenn wir von bereits Gesagtem ausgehen. Um was wohl hätte der, welcher nach den im Anfange unserer Untersuchung gegebenen Darlegungen in Neid gegen den glückseligen Menschen seine Augen gegen das Gute verschlossen und die Finsternis des Bösen in sich hervorgerufen hatte und in die Krankheit des Stolzes, welcher der Anfang oder gleichsam die Mutter aller übrigen Sünden ist, gefallen war, um was hätte dieser sein Eigentum anders wieder herausgegeben als nur um einen höheren und größeren Preis, um durch den Eintausch eines wertvolleren Gutes gegen ein geringeres seiner Leidenschaft des Stolzes noch mehr Nahrung zu geben? Nun hatte er an keinem der Großen, von denen die Geschichte von Anfang an zu berichten weiß, so Wunderbares geschaut wie an dem damals auf Erden Erschienenen: gattenlose Schwangerschaft, unversehrte Geburt, jungfräuliche Mutterbrust, Stimmen vom Himmel, welche seine übernatürliche Würde bezeugten, Krankenheilungen, einzig durch seinen bloßen Befehl und Willensakt bewirkt, Zurückrufung von Toten ins Leben, die Verzeihung von Sünden, Einschüchterung der Dämonen, Macht über das Toben des Windes, Wandeln auf dem Meere, wobei nicht, wie beim Wunder des Moses, das Wasser sich teilte und den Meeresgrund den Hindurchziehenden zum Vorschein kommen ließ, sondern wobei die Oberfläche des Wassers zum festen Boden für den Schritt wurde und für den Fuß sichere Unterlage gewährte, ferner das Fasten, so lange geübt, als er wollte, die reichlichen Speisungen in der Wüste, bei der viele Tausende Sättigung fanden, denen weder der Himmel das Manna taute, noch die Erde durch ihren naturgemäßen Getreidewuchs den Hunger stillte, sondern denen aus den unsichtbaren Vorratskammern der göttlichen Allmacht die köstliche Gabe zukam, fertiges Brot, das in den Händen der Austeilenden wuchs und während der Sättigung der Essenden sich mehrte, wozu noch die Fisch-Zuspeise kam, nicht vom Meere geliefert, sondern von dem, der das Geschlecht der Fische ins Meer säte ― doch wie könnte man jedes einzelne Wunder anführen, welches das Evangelium berichtet?</p><p>[Forts. v. ] Da demnach der Feind des Menschengeschlechtes diese große Macht an jenem sah, erkannte er, daß er bei einem Tausche mehr bekommen könnte, als was er besaß. Deshalb wählte er sich ihn als Lösegeld für die in der Todeshaft Gefangenen. Doch war es auch für ihn unmöglich, die Gotteserscheinung unmittelbar und unverhüllt wahrzunehmen, wenn er nicht an ihr die Natur des Fleisches, das von ihm bereits durch die Sünde unterjocht worden, hätte schauen können. Deshalb umgab sich die Gottheit mit dem Fleisch, damit er gerade im Hinblick auf die ihm bekannte und sogar ihm unterworfene Natur nicht scheue, an die alles überragende Hoheit heranzutreten, und den Erschienenen, als seine Macht in den Wundern immer stärker hervorleuchtete, viel mehr als begehrenswert, denn als furchtbar erachtete. Siehst du, wie sich hier die Güte mit der Gerechtigkeit verband, und wie auch die Weisheit nicht fehlte? Denn in seinem Ratschluß, durch die göttliche Macht mittels der Hülle des Fleisches sich zugänglich und faßbar zu machen, damit nicht der Heilsplan zu unserer Erlösung etwa durch die Furcht vor der himmlischen Erscheinung vereitelt würde, liegt der Erweis der drei erwähnten göttlichen Eigenschaften zugleich: sowohl der Güte als auch der Weisheit und Gerechtigkeit. Sein Wille, uns zu retten, ist ein Zeugnis für seine Güte, die Erlösung des Geknechteten auf dem Wege des Tausches ein Zeichen seiner Gerechtigkeit, die geschickte Zugänglichmachung des Unzugänglichen für den Feind ein Erweis der höchsten Weisheit.Kapitel 24. Außer der Güte, Weisheit und Gerechtigkeit offenbart sich in der Menschwerdung auch die Macht Gottes.</p><h2>24</h2><p>Wer aber dem Gang der Erörterung mit Aufmerksamkeit gefolgt ist, wird wohl fragen: wo ist in diesem Geheimnis die Macht der Gottheit, wo die Unüberwindlichkeit der göttlichen Kraft wirksam? Damit nun auch diese Vollkommenheit deutlich erkannt werde, wollen wir noch tiefer in das Geheimnis eindringen, um zu sehen, worin sich die Macht Gottes im Verein mit seiner Liebe zu uns Menschen am herrlichsten offenbare. Vor allem liegt darin, daß die allmächtige Natur imstande war, auch zur Niedrigkeit der Menschheit herabzusteigen, ein viel deutlicherer Erweis ihrer Macht als in der Größe ihrer Wunder, die alle natürlichen Kräfte übersteigen. Denn wenn sie Großes und Erhabenes wirkt, so gehört dies zur Natur und zum Begriffe der göttlichen Macht; und es hat nichts Befremdendes für das Ohr, zu vernehmen, das ganze Universum und alles, was wir noch außerhalb der sichtbaren Welt erkennen, habe in der Macht Gottes seinen Bestand, da sein Wille jede Verwirklichung findet, die er wünscht. Sein Herabsteigen in die Niedrigkeit ist aber ein gewisses Übermaß von Macht, für die es auch in dem kein Hindernis gibt, was sozusagen gegen seine Natur ist. Denn wie es der Flamme eigen ist, nach oben zu streben, und daher niemand diese ihre natürliche Wirksamkeit für auffällig findet, dagegen alle, welche die Flamme, einem schweren Körper gleich, nach abwärts sinken sähen, so etwas für verwunderlich halten würden, wie das Feuer zwar Feuer bliebe, aber doch in seiner Bewegung nach unten eine Richtung einschlägt, die gegen seine Natur geht, so beweist die Größe der Himmel, der Glanz der Gestirne, die Einrichtung des Universums oder die stete und planmäßige Leitung aller Dinge die göttliche und überschwengliche Macht nicht in dem Grade als das Herabsteigen zur Schwachheit unserer Natur, wie nämlich das Hohe zum Niedrigen sich neigt und in Niedrigkeit erscheint, ohne jedoch von seiner Hoheit herabzusteigen, wie die Gottheit mit der menschlichen Natur sich vereinigt und diese wird, dabei aber jene bleibt. Weil nämlich, wie oben gezeigt wurde, die uns feindselige Macht nicht imstande war, sich mit dem unverhüllt gegenwärtigen Gott in Verbindung zu setzen und seine rein himmlische Erscheinung zu ertragen, so hat sich Gott, um dem sein Lösegeld für uns Verlangenden zugänglich zu werden, unter der Hülle unserer Natur verborgen, damit, wie es bei gierigen Fischen zu geschehen pflegt, mit dem Köder des Fleisches zugleich der Angelhaken der Gottheit verschluckt werde, und so durch Überführung des Lebens in den Tod und durch Aufgang des Lichtes in der Finsternis das dem Leben und dem Tode Entgegengesetzte vernichtet werde; denn weder kann die Finsternis fortbestehen, wenn das Licht erscheint, noch der Tod existieren, wo das Leben wirkt.</p><p>Haben wir somit den inneren Zusammenhang des Geheimnisses in seinen Hauptpunkten wieder aufgenommen, so wollen wir die Verteidigung desselben gegen die Tadler der göttlichen Heilsordnung vollständig zu Ende führen und nachweisen, warum Gott persönlich die Erlösung der Menschen unternahm. Man muß nämlich den richtigen Begriff von Gott haben und ihn nach allen Seiten durchführen und nicht hier erhaben von Gott denken, dort aber ihn entwürdigen, sondern eine allseits geziemende Vorstellung von ihm haben und auf Grund derselben seine Eigenschaften miteinander richtig verbinden. Nun haben wir gezeigt, daß die Güte, die Weisheit, die Gerechtigkeit, die Macht, die Unversehrtheit im Geheimnis der Menschwerdung sich offenbart. Die Güte ergibt sich schon aus dem Willen, den Verlorenen zu retten, die Weisheit und Gerechtigkeit erhellt aus der Art und Weise unserer Errettung, die Macht zeigt sich darin, daß er zwar in Menschenähnlichkeit und Menschengestalt gemäß der Niedrigkeit unserer Natur erschien und sogar in der klar hervortretenden Absicht, sich ebenso wie wir dem Tode zu unterwerfen, dann aber, als er die Menschennatur angenommen hatte, dennoch wirkte und leistete, was seiner höheren Natur angemessen und entsprechend war. Die Natur des Lichtes aber bringt es mit sich, die Finsternis zu vertreiben, und die des Lebens, den Tod zu vernichten. Da wir nun gleich anfangs vom rechten Wege abirrten und uns dadurch dem Leben ab- und dem Tode zuwandten, was stellt uns da das Geheimnis Unwahrscheinliches vor, wenn es uns lehrt, die Reinheit habe sich zu den von Sünde Befleckten herabgeneigt, das Leben zu den Toten, der Wegweiser zu den Verirrten, damit die Befleckten gereinigt, die Toten zum Leben erweckt und die Verirrten auf den rechten Weg zurückgeleitet werden?Kapitel 25. Die Menschwerdung stimmt mit der Allgegenwart Gottes überein.</p><h2>25</h2><p>Keinem, der die Dinge nicht mit allzu kurzsichtigem Auge betrachtet, durfte die Botschaft, Gott habe unsere Natur angenommen, irgendwie einen begründeten Anstoß bereiten. Denn wer ist wohl so unmündigen Geistes, daß er beim Anblick des Universums nicht glauben wollte, daß er in allen Dingen sei, indem er sie durchdringt, umschließt und in ihnen gegenwärtig ist. Denn von dem wahrhaft Seienden hängen alle Dinge ab, und es kann keines existieren, falls es nicht in ihm seine Existenz hat. Wenn nun alles in Gott ist und Gott in allem, warum stoßen sich dann so viele an der Heilsordnung wegen jenes Geheimnisses, das da lehrt, Gott sei zu den Menschen gekommen, während man doch davon überzeugt ist, er sei jetzt den Menschen nicht fern? Denn wenn Gott jetzt nicht auf dieselbe Art unter uns weilt wie damals, so ist doch seine jetzige wie seine damalige auf die nämliche Weise bezeugt und erkennbar. Jetzt ist er bei uns, insoferne er alles im Sein erhält, damals aber hatte er sich auf das innigste mit unserer Natur vereinigt, damit dieselbe durch ihre Verbindung mit Gott göttlich werde, indem er sie dem Tod entriß und aus der Zwingherrschaft des Feindes befreite; denn* seine* Erhebung vom Tode ist für das sterbliche Geschlecht der Anfang der Erhebung zum unsterblichen Leben.Kapitel 26. Gott verfuhr bei der Menschwerdung auch gegen Satan nicht ungerecht.</p><h2>26</h2><p>[Forts. v. ] Aber vielleicht wird jemand bei Überprüfung der göttlichen Gerechtigkeit und Weisheit, welche von uns hinsichtlich dieser Heilsordnung wahrgenommen wird, zu der Meinung verleitet, Gott habe in der Absicht, zu täuschen, den Plan entworfen, uns auf diese Weise zu retten. Denn darin, daß Gott nicht in der reinen, sondern in der mit der Menschennatur verhüllten Gottheit, ohne vom Feinde erkannt zu werden, dem Machthaber sich überlieferte, liegt eine Art Täuschung und Verstellung, insofern alle, welche auf Täuschung ausgehen, darauf ausgehen, bei den Gegnern falsche Erwartungen hervorzurufen und anders zu handeln, als sie hoffen. Aber wer auf die Wirklichkeit schaut, wird zugeben, daß auch dies ein Werk der Gerechtigkeit und Weisheit sogar in hohem Maße ist. Denn vom Gerechten wird verlangt, daß er jedem das Seine nach Gebühr zuerkenne, vom Weisen aber, daß er weder von der Gerechtigkeit abweiche, noch das geplante Liebeswerk unterlasse, um nach der Gerechtigkeit entscheiden zu können, sondern daß er beides geschickt miteinander verbinde, indem er aus Gerechtigkeit jedem das ihm Gebührende zuweist, aber der Absicht, Gutes zu tun, getreu bleibt. Sehen wir daher zu, ob beides nicht auch bei der Menschwerdung hervortritt.</p><p>Die Wiedervergeltung nach Gebühr, nach welcher der zuerst Täuschende ebenfalls getäuscht wird, zeigt die Gerechtigkeit; der Zweck der Menschwerdung aber bezeugt die Güte dessen, der sie vollzog. Denn Sache der Gerechtigkeit ist es, jedem das zuzuweisen, wozu er selbst zuvor den Grund legte, wie ja auch die Erde je nach der Art des in sie gestreuten Samens die derselben entsprechenden Früchte hervorbringt; der Weisheit kommt es aber zu, bei der Absicht, Gleiches mit Gleichem zu vergelten, die Güte nicht außer acht zu lassen. Denn wie sowohl der Feind wie der Arzt, der den Angefeindeten heilen will, in gleicher Weise in die Speise Gift mischt, freilich der eine als todbringendes Mittel, der andere als Gegengift, und diese Methode des Kurierens die edle Absicht des Wohltuns nicht zu beeinträchtigen vermag ― denn wenn auch beide Gift in die Speisen mischen, so werden wir doch im Hinblick auf ihre Absicht den einen loben, den anderen verurteilen ― so empfing auch hier jener, welcher uns getäuscht hatte, auf Grund der Gerechtigkeit nur das zurück, was er mit voller Überlegung und Freiheit vorher gesät hatte (denn weil er zuvor den Menschen durch den Köder der Sinnenlust getäuscht hatte, wird nun er dadurch getäuscht, daß sich Gott mit der Hülle der Menschheit umgab); der Zweck aber, den Gott mit seinem Verfahren verfolgte, bewirkt, daß wir es in den Bereich des Guten verweisen. Jener nämlich beging die Täuschung zum Verderben der Menschheit, Gott aber, der gerecht, gütig und weise zugleich ist, bediente sich eines gut erdachten Mittels der Täuschung zur Errettung des ins Verderben gefallenen Menschengeschlechtes, wobei er nicht bloß dem Verunglückten eine Wohltat ererwies [ber.: erwies], sondern auch dem Urheber des Unglücks. Denn wenn der Tod dem Leben, die Finsternis dem Lichte, die Verderbtheit der Unversehrtheit sich naht, wird das Böse verschwinden und in das Nichtsein versinken; dem davon Gereinigten erwächst aber hierdurch Gewinn. Gleichwie nämlich, wenn ein unedleres Metall mit dem Gold vermengt ist, die Goldarbeiter mittels Anwendung von Feuer den fremdartigen Unrat beseitigen und das Gold in seiner natürlichen strahlenden Lauterkeit wiederherstellen ― allerdings ist die Scheidung nicht mühelos, weil das Feuer durch seine aufzehrende Kraft das Unechte nur nach und nach zu lösen vermag; aber dennoch ist es sozusagen eine Heilung des Goldes, wenn aller Schmutz, der die ursprüngliche Reinheit trübt, ausgeschieden ist ― ebenso hat, während Tod, Verderben und Finsternis und was es sonst noch Schlimmes gibt, den Urheber des Bösen umringte, das Nahekommen der göttlichen Macht wie ein Feuer alles Widernatürliche vertilgt und durch diese Reinigung der Natur eine Wohltat erwiesen, wenn die Scheidung auch mühselig war.</p><p>Nicht einmal bei dem Widersacher dürfte daher ein Zweifel darüber bestehen, daß das Geschehene nicht gerecht und heilsam sei, wenn anders er zur Erkenntnis der Wohltat gelangt. Jetzt ist (dies noch nicht der Fall); denn wie diejenigen, welche bei einer Kur geschnitten und gebrannt werden, dem Arzt darüber böse sind, solange der Schmerz des Schneidens sie durchzuckt, später aber, sobald die Genesung eintritt und der Schmerz des Brennens vorüber ist, allen, welche die Kur an ihnen vorgenommen haben, Dank wissen, ebenso wird die Danksagung, wenn schließlich nach langer Zeit das jetzt mit der Natur vermischte und verwachsene Böse aus ihr entfernt ist und die Wiederherstellung der jetzt im argen Liegenden zum Urstand stattgefunden hat, in der ganzen Schöpfung einmütig dargebracht werden, sowohl von Seiten jener, welche bei der Reinigung Züchtigung ausstanden, als auch von Seiten jener, welche von Anfang einer Reinigung nicht bedürftig waren.</p><p>Dies und Ähnliches lehrt uns das große Geheimnis der Menschwerdung Gottes. Denn gerade dadurch, daß er sich mit der Menschennatur so innig vereinigte und dabei allen Eigentümlichkeiten derselben wie der Geburt, der Ernährung, dem Wachstum, ja selbst dem Tode sich unterzog, hat er alles soeben Erwähnte bewirkt, indem er sowohl den Menschen vom Bösen erlöste, als auch den Urheber des Bösen selbst heilte. Denn wahre Heilung von Krankheit bedeutet Beseitigung des Krankheitsstoffes, wenn sie auch mit Mühseligkeiten verbunden ist.Kapitel 27. Gott nahm die volle menschliche Natur an.</p><h2>27</h2><p>Als Gott unsere menschliche Natur annahm, war es durchaus notwendig, daß er diese Vereinigung mit ihr bis in alle Eigentümlichkeiten derselben durchführte. Denn wie die Kleiderreiniger nicht den einen Teil der Flecken beseitigen, den anderen aber nicht, sondern das Kleid vom Anfang bis zum Ende von allen Unsauberkeiten reinigen, damit das ganze Gewand nach der Waschung wieder sauber und schön sei, so mußte auch, weil nun einmal das menschliche Leben sowohl in seinem Anfang als auch in seinem Ende und in allem, was dazwischen liegt, durch die Sünde befleckt war, die reinigende Macht Gottes sich auf alles erstrecken und nicht bloß den einen Teil durch Reinigung heilen, den anderen aber ungeheilt lassen. Weil nun das menschliche Leben von zwei Grenzen eingeschlossen wird, d. h. vom Anfang und vom Ende, so finden wir jene reinigende Macht an jeder der beiden Grenzen tätig, indem sie mit dem Anfang beginnt, bis zum Ende sich erstreckt, aber auch noch alles durchschreitet, was dazwischen liegt.</p><p>Da aber der Eintritt in das Leben für alle Menschen ein und derselbe ist, von woher nun mußte der zu uns Kommende ins Leben eintreten? Vom Himmel aus ― werden alle antworten, welche die Art und Weise der menschlichen Geburt als schmählich und gemein verabscheuen. Allein der Mensch war nicht im Himmel, und im überirdischen Leben kennt man auch nicht die Krankheit der Sünde. Als er sich aber mit der Menschheit vereinigte, vollzog er die Vereinigung, um der Menschheit zu helfen. Wie kann man sich also der Erwartung hingeben, von dort aus, wo doch die Sünde keinen Platz hatte, und wo das Leben nicht nach Art der Menschen geführt wurde, würde Gott seine Verbindung mit dem Menschen anknüpfen, oder, richtiger gesagt, nicht mit einem wahren Menschen, sondern mit einem Schein- oder Nachbild eines Menschen? Wie hätte aber dann die Wiederherstellung unserer menschlichen Natur stattfinden können, wenn zwar der irdische Mensch erkrankt gewesen, aber ein himmlisches Lebewesen in die Verbindung mit Gott eingegangen wäre? Ist es doch unmöglich, daß der Kranke genese, wenn nicht gerade jener Körperteil von ihm in Kur genommen wird, der leidet. Wenn nun der Kranke auf Erden weilte, die göttliche Macht aber im Hinblick auf die ihr geziemende Zurückhaltung sich nicht mit dem Kranken befaßt hätte, so wäre daraus für den Menschen kein Gewinn erwachsen, wenngleich die Bemühung der göttlichen Macht um andere Geschöpfe noch so groß gewesen wäre, die aber nicht in Verwandtschaft mit unserer Natur stehen. Die Frage aber, ob für Gott geziemend oder nicht geziemend, ist für alle seine Werke in gleicher Weise dahin zu beantworten, daß einzig und allein das Böse für ihn als ungeziemend und unstatthaft zu betrachten ist.</p><p>Wenn aber doch Engherzige die Größe Gottes darin erblicken wollen, daß er an den Eigentümlichkeiten unserer Natur nicht teilnehme, so hätte sich Gott zu einer ebenso unrühmlichen Handlungsweise herbeigelassen, wenn er sich mit einem himmlischen statt mit einem irdischen Leibe verbunden hätte. Denn der Abstand Gottes als des Allerhöchsten und seiner Natur nach gänzlich Unerreichbaren von allen seinen Geschöpfen ist gleich groß, und für ihn haben alle Wesen, die unter ihm stehen, gleichen Wert. Denn was überhaupt unzugänglich ist, kann nicht für das eine erreichbar, für das andere unerreichbar sich zeigen, sondern thront über allem in gleicher Höhe. Daher ist der Würdigkeit nach die Erde Gott nicht ferner und der Himmel ihm nicht näher; ebensowenig unterscheiden sich die Bewohner der beiden Regionen in dieser Hinsicht voneinander, als ob die einen dem Unerreichbaren näher, die anderen ihm ferner stünden. Man müßte denn annehmen, daß die alles regierende Macht nicht alles in gleicher Weise durchdringe, sondern in den einen Geschöpfen mehr, in den anderen weniger gegenwärtig sei; alsdann aber würde die Gottheit auf Grund dieses Unterschiedes zwischen Mehr und Weniger, zwischen Höherem und Niedrigerem sich notwendig als zusammengesetzt darstellen, ohne Einheit mit sich, insofern sie nach einer solchen Auffassung schon ihrer Natur uns Menschen ferne, anderen Geschöpfen dagegen nahe stünde, so daß sie mit diesen leicht in enge Verbindung treten könnte, weil mit ihnen verwandt. Doch die wahre Anschauung zieht, wenn die unendliche Majestät Gottes in Betracht kommt, keine Vergleiche zwischen höheren und niedrigeren Geschöpfen; denn alle stehen gleich tief unter der alles regierenden Macht, so daß, wenn man die irdische Natur des Menschen einer Verbindung mit Gott für durchaus unwürdig halten will, man kaum eine andere finden wird, die einer solchen Vereinigung würdiger wäre. Steht nun alles hinsichtlich der Würdigkeit gleich weit von Gott ab, so bleibt doch das eine Gottes würdig und ihm angemessen, jenen Wohltaten zu erweisen, die deren bedürftig sind. Wenn wir also bekennen, Gott sei dahin gegangen, wo die Krankheit war, was glauben wir damit, was dem Begriffe Gottes unangemessen wäre?Kapitel 28. Auch die menschliche Geburt ist Gottes nicht unwürdig.</p><h2>28</h2><p>Aber sie witzeln über unsere Natur und setzen die Art unserer Geburt herab und meinen, dadurch unser Geheimnis lächerlich zu machen, als ob es für Gott unschicklich wäre, in das menschliche Leben einzutreten. Allein dagegen wurde schon früher betont, daß nur die Sünde und was mit ihr in Zusammenhang steht, für das göttliche Wesen unwürdig und unpassend ist. Die Ordnung in der Natur aber, die durch Gottes Gesetz und Willen festgestellt wurde, ist über den Vorwurf der Sündhaftigkeit hoch erhaben; außerdem würde die Anklage gegen die Natur auf den Schöpfer zurückfallen, falls man etwas an ihr als an sich schon schmählich und schimpflich tadeln wollte. Wenn also nur das Böse von Gott fernbleiben muß und keine Natur etwas aufweist, was an sich böse wäre, das Geheimnis aber ferner lehrt, Gott sei als Mensch, jedoch nicht als Sünder befunden worden, und wenn es endlich für den Menschen nur einen einzigen Eintritt in das Erdenleben gibt, mit welchem Recht verlangen sie von Gott einen anderen Eintritt in das Menschenleben, sie, die es einerseits für durchaus angezeigt halten, daß Gott unser krankes Geschlecht heimsuche, anderseits aber mit der Art und Weise, wie er diese Heimsuchung antrat, unzufrieden sind, ohne zu bedenken, daß die ganze Ausstattung des Leibes an sich den gleichen Wert hat und nichts an ihm, was zur Lebenserhaltung beiträgt, als schändlich und böse Tadel verdient?</p><p>Die gesamte Ordnung der Glieder, die am menschlichen Leibe arbeiten, dienen einem einzigen Zweck, und dieser Zweck ist die Erhaltung des menschlichen Lebens. Die übrigen Organe nun erhalten in der Gegenwart das Leben des Menschen, indem die einen nach dieser Richtung, die anderen nach jener tätig sind, um die Sinne zu ihren Funktionen zu befähigen und den Menschen die Arbeitskraft zu verschaffen; den Zeugungsgliedern obliegt dagegen die Sorge für die Zukunft, indem sie dem Menschengeschlecht immer neuen Nachwuchs zuführen. Welchen Gliedern, die für ehrenvoll gehalten werden, könnten jene, vom Standpunkt des Nutzens aus betrachtet, nachgesetzt werden? Welchen wären sie mit gutem Grund nicht vielmehr vorzuziehen? Denn nicht durch das Auge oder das Ohr oder die Zunge oder durch ein anderes Sinneswerkzeug wird unser Geschlecht fortgepflanzt ― denn diese sind, wie gesagt, für die Gegenwart nützlich ― sondern durch jene wird der Menschheit die Unsterblichkeit vermittelt, so daß der Tod, obgleich er unaufhörlich gegen uns arbeitet, in gewisser Hinsicht doch keinen Erfolg erzielt, weil sich unsere Natur für den erlittenen Abgang selbst immer wieder Ersatz verschafft. Was enthält also unser Geheimnis Unziemliches, wenn Gott sich der Menschheit durch das eingliedert, durch das unsere Natur gegen den Tod ankämpft?Kapitel 29. Warum erschien Gott so spät?</p><h2>29</h2><p>Diesen Standpunkt verlassend, wollen sie von einem anderen aus unseren Glauben angreifen, indem sie fragen: „Wenn die Menschwerdung so gut und geziemend war, warum zögerte er mit der Erweisung dieser Wohltat so lange? Warum trat er damals, als das Böse noch in den Anfängen war, seiner Ausdehnung nicht hindernd entgegen? ― Hierauf antworten wir kurz, daß Gott nur aus Weisheit und in der Absicht, uns zu nützen, die Wohltat in eine spätere Zeit verlegte. Denn auch bei Krankheiten des Leibes, z. B. wenn unter den Poren der Haut verdorbene Säfte stecken, wird von den Ärzten ihren wissenschaftlichen Grundsätzen gemäß der Körper nicht eher mit zusammenziehenden oder schließenden Mitteln bestrichen, als bis der naturwidrige Krankheitsstoff, der im Innern sitzt, ganz an die Oberfläche trat; sie warten zu, bis alles, was inwendig sich verbirgt, an den Tag kommt, um dann erst das bloßgelegte Übel zu heilen. Nachdem nun die Krankheit der Sünde in die Menschennatur eingedrungen war, wartete der Arzt der Welt, bis keine Art der Bosheit sich mehr verborgen halten konnte.</p><p>[Forts. v. ] Deshalb also wollte Gott nach dem Neid und dem Brudermord des Kain nicht sofort mit seiner Heilkunst an die Menschheit herantreten; denn weder war die Verkommenheit derer, die zur Zeit Noes zugrunde gingen, hervorgetreten, noch war die unnatürliche Krankheit des sodomitischen Frevels offenbar geworden, noch der Krieg der Ägypter gegen Gott, noch der Hochmut der Assyrer, noch die Bluttat, welche die Juden an den Heiligen Gottes verübten, noch der entsetzliche Kindermord des Herodes, noch soviel anderes Böses, das teils Aufzeichnung fand, teils aber, ohne überliefert zu werden, in den verschiedenen Zeitperioden begangen wurde, nachdem die Wurzel des Bösen Sprossen der verschiedensten Art in dem Willen der Menschen getrieben hatte. Als nun die Bosheit den höchsten Grad erreicht hatte und kein Frevel mehr übrig war, den die Menschen nicht gewagt hätten, da erst machte er sich an die Heilung, nicht beim Beginne der Krankheit, sondern erst nach ihrem vollen Ausbruche, um die Rettung auf den ganzen Umfang des Elendes auszudehnen.Kapitel 30. Warum ist die Erlösung noch nicht allseitig vollendet?</p><h2>30</h2><p>Wenn aber jemand meint, unsere Glaubenslehre durch den Hinweis auf die Tatsache widerlegen zu können, daß auch nach Abschluß des Heilverfahrens das Leben der Menschen mit Sünden angefüllt sei, so möge er sich durch ein bekanntes Beispiel zur richtigen Auffassung führen lassen. Wie nämlich bei der Schlange, wenn sie einen tödlichen Schlag auf den Kopf erhält, der übrige nachschleppende Teil keineswegs zugleich mit dem Kopfe zu Tode gebracht wird, sondern, sie selbst zwar tot ist, der Schwanz aber noch durch seine eigene Triebkraft beseelt wird und der lebensvollen Beweglichkeit noch nicht ganz verlustig geht, so kann man auch hinsichtlich der Bosheit beobachten, daß sie zwar aufs Haupt geschlagen ist, in den übrigen Teilen aber unser Leben noch stört.</p><p>Aber wenn sie davon abstehen, von diesem Gesichtspunkt aus unsere Glaubenslehre über das Geheimnis zu tadeln, so erheben sie doch darüber Klage, daß der Glaube nicht zu allen Menschen gelangt sei; dabei werfen sie die Frage auf: „Warum kam die Gnade nicht zu allen, sondern ist, während einige sich zur Lehre bekennen, die Zahl derer, die zurückbleiben, nicht klein, sei es, daß Gott nicht den Willen hatte, die Wohltat neidlos allen zuzuwenden, oder daß er nicht die Macht hiezu besaß? In beiden Fällen würde Gott ein Vorwurf treffen; denn weder ist es Gottes würdig, das Gute nicht zu wollen, noch dasselbe nicht vollbringen zu können. Wenn der Glaube aber ein Gut ist, fragen sie, warum kam die Gnade nicht zu allen?“</p><p>Wenn dergleichen Sätze auch wirklich von unserer Lehre aufgestellt würden, nämlich der Glaube werde von Seite des göttlichen Willens den Menschen in der Weise zuteil, daß die einen berufen würden, die andern aber nicht, dann wäre allerdings der erwähnte Vorwurf berechtigt; tatsächlich ergeht jedoch der Ruf zum Glauben an alle gleichmäßig, ohne Unterschied des Ranges, des Alters oder der Nationalität; denn darum hatten beim Beginn der christlichen Predigt ihre Verkünder, die Diener des Wortes, durch göttliche Eingebung plötzlich die Gabe empfangen, in gleicher Sprache zu allen Völkern zu reden, damit niemand der segenspendenden Lehre entbehre. Wie können sie da noch mit Grund gegen Gott die Klage erheben, als ob ihn die Schuld träfe, wenn das Wort (vom Christentum) noch nicht die Herrschaft über alle erlangt hat? Denn der Herr, der über alles gebietet, hat, um die Menschheit überschwänglich auszuzeichnen, etwas auch in unsere Hand gelegt, worüber ein jeder allein Herr ist. Dies ist der freie Wille, ein Vermögen, das keiner Knechtung unterliegt, sondern nur selbst über sich verfügt, die Grundlage für die Freiheit unserer Entschlüsse. Den erhobenen Vorwurf dürfte man daher mit Recht auf diejenigen übertragen, die sich nicht zum Glauben bestimmen lassen, nicht auf den, der sie zum Glauben berief. Denn auch damals, als im Anfang des Christentums Petrus in einer großen Versammlung predigte und an dreitausend Juden sich bekehrten, haben die anderen, welche ungläubig blieben, dem Apostel keinen Vorwurf darüber gemacht, daß sie sich nicht bekehrten. Denn unbillig ist es, wenn, nachdem die Gnade allen ausnahmslos angeboten wurde, derjenige, der sie freiwillig ausschlägt, statt sich selbst jemand anderen wegen seines Unglückes anschuldigt.Kapitel 31. Auch der Glaube hängt von der freien Willensentschließung des Menschen ab.</p><h2>31</h2><p>Aber auch gegen das Gesagte erheben die Gegner aus Streitsucht eine Widerrede. Sie sagen nämlich, Gott könnte doch, wenn er nur wollte, auch den Widerspenstigen zwangsweise zur Annahme der Heilsbotschaft führen. ― Wo wäre aber dann die Freiheit? wo die Tugend? wo das Lob des Gerechten? Denn nur den leblosen oder den unvernünftigen Wesen kommt es zu, nach Gutdünken von dem Willen eines anderen bestimmt und gelenkt zu werden. Die vernünftige und denkende Natur aber würde, sobald sie das Recht der Selbstbestimmung aufgäbe, damit ihre hohe Ausstattung mit dem Denkvermögen verlieren. Denn wozu brauchte sie noch die Fähigkeit, selbst zu denken und zu überlegen, wenn das Recht, nach Gutdünken zu entscheiden, bei einem anderen liegen würde? Wenn aber das Recht der Entscheidung außer Kraft gesetzt wird, dann ist es notwendigerweise vorbei mit der Tugend, da sie durch die Unfähigkeit des Willens, sich selbst in Bewegung zu setzen, am Entstehen gehindert ist; gibt es aber keine Tugend mehr, so verliert das Leben allen Wert, das Verhängnis tritt an die Stelle der Vernunft, das Lob der Gerechten scheidet aus, die Sünde wird gefahrlos, es ist dann ganz gleichgültig, ob man ein gutes oder ein schlechtes Leben führt. Denn mit welchem Rechte könnte man den Wildling tadeln oder den Gesitteten loben? Denn jeder hätte die Antwort zur Hand, daß keiner unserer Entschlüsse von uns abhänge, sondern daß die menschlichen Willensentscheidungen von einer höheren Macht zu dem bestimmt würden, was diesem Herrscher gutdünkt; demnach trifft der Vorwurf, daß nicht alle zum Glauben gelangen, nicht die Güte Gottes, sondern den freien Willen derjenigen selbst, welche die Heilsverkündigung verschmähen.Kapitel 32. Auch der Kreuztod Christi spricht nicht gegen seine Gottheit.</p><h2>32</h2><p>Was wird außerdem noch von unseren Gegnern eingewendet? Vor allem der Hinweis darauf, daß die allerhabene Natur überhaupt nicht hätte sterben dürfen, sondern, daß sie wegen der Überschwänglichkeit ihrer Macht hätte imstande sein sollen, ihren Heilsplan ohne den Tod zur Ausführung zu bringen. Sodann meinen sie, daß Gott, selbst wenn der Tod aus einem verborgenen Grunde unumgänglich notwendig gewesen wäre, wenigstens die Schmach einer entehrenden Todesart hätte vermeiden müssen. Denn was könnte schimpflicher sein, sagen sie, als der Tod am Kreuze? ―</p><p>Was werden wir auf solche Einwände erwidern? Wir antworten, daß die Geburt den Tod als notwendige Folge bewirkt. Denn hatte er einmal beschlossen, die Menschheit anzunehmen, so mußte er sich allem unterziehen, was zu ihrem Wesen gehört. Hätte er nun, nachdem unser Leben zwischen zwei Grenzpunkten verläuft, den einen durchschritten, den anderen aber nicht berührt, so wäre sein Plan bloß zur Hälfte ausgeführt worden, weil er in diesem Fall eine der Eigentümlichkeiten unserer Natur an sich nicht erfahren hätte. Wer aber das Geheimnis gründlich erwogen hat, dürfte mit größerem Rechte sagen, daß der Tod nicht wegen der Geburt eintrat, sondern daß umgekehrt wegen des Todes die Geburt übernommen wurde. Denn derjenige, der da ewig lebt, unterzieht sich nicht des Lebens wegen der leiblichen Geburt, sondern um uns durch den Tod ins Leben zurückzurufen. Da nun die Rückkehr aus dem Tode unserer ganzen Natur zuteil werden sollte, so wollte er, indem er dem Daliegenden die Hand reichte und sich gleichsam zu unserem Leichnam niederbückte, dem Tode so weit sich nahen, daß er die Sterblichkeit austrank und an seinem eigenen Leibe die Auferstehung der Menschheit einleitete, indem er durch seine Macht das ganze Menschengeschlecht mit auferweckte. Denn da jenes die Gottheit beherbergende Fleisch, welches in der Auferstehung zugleich mit der Gottheit erhöht wurde, nirgends anderswoher stammte, als aus der Masse, aus der wir bestehen, so muß, wie bei unserem Leibe die Tätigkeit eines einzelnen Sinneswerkzeuges allen übrigen mit ihm verbundenen Organen eine Mitempfindung verschafft, in ähnlicher Weise die Auferstehung des Teiles, wie wenn die ganze Menschheit nur* eine* Person wäre, auch auf das Ganze übergehen, indem sie kraft des engen Zusammenhanges unserer Natur von dem Teil auf das Ganze sich fortpflanzt. Was lernen wir also Unwahrscheinliches in unserem Glaubensgeheimnis, wenn der Stehende zu dem Gestürzten sich niederbeugt, um den Daliegenden aufzurichten?</p><p>Ob aber das Kreuz noch einen anderen und tieferen Sinn enthalte, werden wohl alle wissen, welche sich mehr auf die Deutung der Geheimnisse verstehen. Folgendes aber erfahren wir durch die Überlieferung. Da nämlich allen Handlungen und Reden, welche uns durch das Evangelium berichtet werden, eine höhere und göttliche Absicht zugrunde liegt und sich nichts findet, was nicht außer den menschlichen Zügen auch den göttlichen Charakter trüge, so daß, auch wenn die Reden und Handlungen rein menschliches Gepräge aufzuweisen scheinen, der verborgene Sinn die göttliche Grundlage entdecken kann, so verlangt die Folgerichtigkeit auch hier die eine Seite ins Auge zu fassen, die andere aber nicht zu übersehen, sondern beim Tode das Menschliche zu betrachten, in der Art und Weise desselben aber die göttliche Bedeutung, die noch klarer hervortritt, mit allem Ernste in Erwägung zu ziehen. Da es nämlich der Gottheit zukommt, alles zu durchdringen und sich, der Natur der Dinge entsprechend, in alle Teile derselben auszudehnen (denn nichts vermag im Sein zu verharren, wenn es nicht in dem Seienden verbleibt; das selbständig und zuerst Seiende ist aber die göttliche Natur, von der wir, durch die Fortdauer der Dinge genötigt, annehmen müssen, daß sie in allem sei), so will uns das Kreuz durch seine Gestalt, die nach vier Seiten auseinandergeht, indem von seinem Mittelpunkt, durch den es zusammengehalten wird, deutlich vier Balken vorspringen, die Lehre geben, daß er, der da im Augenblicke seines nach dem göttlichen Heilsplan erlittenen Todes daran ausgestreckt war, derjenige ist, welcher das Universum in sich eint und harmonisch verbindet, indem er die verschiedenartigen Dinge zu einem einheitlichen Ganzen zusammenfaßt. Denn bei den Dingen blicken wir entweder nach oben oder nach unten, oder unser Forschen bezieht sich auf die beiden Seiten. Magst du nun an das denken, was am Himmel oder was unter der Erde oder was zu beiden Seiten ist, überall tritt deinem betrachtenden Blick die Gottheit entgegen, welche allein an den Dingen und zwar an jedem Teil derselben erkannt wird, und die alle in ihrem Sein erhält. Ob wir nun diese allgegenwärtige Natur Gott oder Wort oder Weisheit oder Allmacht nennen sollen oder sonst etwas, was erhaben ist und den Allerhöchsten besser zu bezeichnen vermag, unser Glaube führt wegen Worte und Ausdrücke und bildlicher Wendungen keinen Streit. Da nun die ganze Schöpfung auf ihn hinsieht und um ihn ist und durch ihn ihre Einheit und Geschlossenheit erhält, so sollten wir nicht allein durch das Ohr zur rechten Erkenntnis Gottes gebracht werden, sondern auch das Auge sollte ein Lehrer der höheren Wahrheiten werden.</p><p>Auf das Kreuz Bezug nehmend, erteilt auch der große Paulus der Gemeinde von Ephesus einen tieferen Unterricht, indem er sie durch seine Belehrung befähigen will, zu verstehen, was die Tiefe und die Höhe, die Breite und die Länge sei (Eph. 3, 18). Denn jeden Kreuzesbalken führt er mit einem besonderen Namen vor Augen: den nach oben gehenden Balken bezeichnet er als Höhe, den nach unten gehenden als Tiefe, die Seitenbalken aber als Breite und Länge. Noch deutlicher setzt er diese Auffassung anderwärts auseinander, wie ich glaube, im Briefe an die Philipper, denen er also schreibt: „Im Namen Jesu Christi sollen sich die Knie aller beugen: derer, die im Himmel, auf Erden und unter der Erde sind“ (Phil. 2, 10). Hier gebraucht er für den mittleren Balken und den in der Quere liegenden nur* ein* Wort* (ἐπίγειον)* [epigeion], indem er alles, was zwischen den Himmlischen und Unterirdischen sich befindet, zur Erde zählt* (ἐπίγειον)* [epigeion].</p><p>Die Ereignisse aber, welche nach unserer Glaubenslehre auf den Kreuzestod folgten, sind sämtlich derartig, daß auch die Ungläubigen zugeben, keines enthalte etwas Gottes Unwürdiges. Denn wenn er nicht im Tode blieb und alle Wunden, die das Eisen seinem Leibe zufügte, die Auferstehung nicht zu verhindern vermochten, wenn er dann nach der Auferstehung ganz nach seinem Ermessen den Jüngern erschien, sooft er, ohne von anderen gesehen zu werden, bei ihnen sein und in ihrer Mitte verweilen wollte, wobei er nicht nötig hatte, durch die Türe einzutreten, wenn er ferner den Jüngern durch die Verleihung des Heiligen Geistes Stärke verleiht und ihnen die Verheißung gibt, bei ihnen zu verbleiben und durch keine Scheidewand von ihnen getrennt zu werden, und wenn er endlich seiner sichtbaren Erscheinung nach zum Himmel auffährt, dem Geiste nach überall ist und was sonst dergleichen der Bericht von ihm erzählt ― so bedarf all das nicht erst der Hilfe vieler Vernunftgründe, um als göttlich und der allerhabenen, höchsten Macht würdig befunden zu werden. Hierüber sind, wie ich glaube, Einzeluntersuchungen nicht nötig, da der Bericht selbst die Übernatürlichkeit ganz klar hervorhebt.</p><p>Allein da zu den geheimnisvollen Lehren unseres Glaubens auch die Heilsordnung des Wasserbades gehört, das man Taufe oder Erleuchtung oder Wiedergeburt nennen mag (denn wegen Namen streiten wir nicht), so dürfte es gut sein, auch hievon in Kürze zu handeln.Kapitel 33. Die Wiedergeburt durch die Taufe und die natürliche Geburt des Menschen.</p><h2>33</h2><p>[Forts. v. ] Sobald sie nämlich von uns hören, daß, wenn das Sterbliche zum Leben übergehen soll, notwendigerweise im Unterschied von der ersten Geburt, welche nur in das sterbliche Leben führt, noch eine andere Geburt erfunden werden mußte, die weder mit Verderbnis beginnt noch in Verderbnis endigt, sondern in das ewige Leben führt, damit, wie das in sterblicher Geburt Geborene notwendig als sterblich entstand, so das in verderbnisfreier Geburt Geborene Siegeskraft über den Vernichter Tod gewinne ― sobald sie dies und Ähnliches hören und auch die Art und Weise kennen lernen, nämlich daß Gebet zu Gott und Anrufung der göttlichen Gnade und Wasser und Glaube die Mittel seien, wodurch die geheimnisvolle Wiedergeburt zustande kommt, so erfaßt sie, indem sie nur auf das, was sie sehen, ihr Augenmerk richten, ein Mißtrauen, als ob der äußere Vorgang der inneren Wirkung, die hervorgebracht werden soll, nicht entsprechen würde. Wie kann, sagen sie, Gebet und Anrufung der göttlichen Macht, wenn sie über dem Wasser erfolgen, Quelle des Lebens werden für die, welche sich so einweihen lassen?</p><p>Diesen gegenüber wird, falls sie nicht zu hartnäckig sind, eine kurze Bemerkung genügen, um sie dahin zu bringen, daß sie unserer Glaubenslehre zustimmen. Wir wollen eine Gegenfrage stellen und zwar in bezug auf die allen bekannte Art und Weise der menschlichen Geburt, nämlich wie das zum Menschen sich entwickelt, was als Grundlage für die Entstehung des lebenden Wesens ausgesät wird. Hierüber allerdings haben wir keinen Beweis, der auf Grund eines Vernunftschlusses Gewißheit verschaffen würde. Denn was hätte der Begriff des Menschen mit den Eigenschaften zu tun, die jenem Dinge zukommen? Der Mensch ist seinem Begriffe nach ein vernunftbegabtes und denkendes Wesen, fähig, Wissen und Können sich anzueignen; jenes aber verrät sich für das Auge nur als eine gewisse feuchte Substanz und mehr als sinnlich Wahrnehmbares kann hier auch der Verstand nicht entdecken. Die nämliche Antwort nun, welche wir auf unsere Frage, wie aus jenem ein Mensch entstehen könne, wahrscheinlich bekommen werden, geben wir auf die an uns gestellte Frage zurück, wie durch das Wasser eine Wiedergeburt bewirkt werden soll. Allgemein lautet nun die Antwort in bezug auf die erste Geburt: durch die göttliche Kraft wird aus jenem ein Mensch; fehlt dieselbe, so bleibt es unwirksam und leblos. Wenn nun dort die stoffliche Grundlage allein den Menschen nicht schafft, sondern die göttliche Macht das Sinnenfällige zum Menschenwesen gestaltet, so verraten doch argen Unverstand alle, welche hinsichtlich der ersten Geburt zwar Gott eine große Macht zuschreiben, hinsichtlich der Wiedergeburt dagegen Gott eine solche Schwäche zutrauen, daß er seinen Willen nicht durchsetzen kann. „Was ― sagen sie ― haben Wasser und Leben miteinander gemeinsam?“ Wir aber stellen die Gegenfrage: „Was haben Feuchtigkeit und Ebenbild Gottes gemeinsam?“ Gewiß ist es hier nicht befremdlich, wenn durch Gottes Willen die Feuchtigkeit in das edelste Lebewesen umgebildet wird. Ebenso aber ist es, folgern wir, nicht zu verwundern, wenn die göttliche Macht durch ihre Gegenwart imstande ist, eine verwesliche Natur zur Unverweslichkeit umzugestalten.Kapitel 34. Die Wirksamkeit der Taufe steht außer allem Zweifel.</p><h2>34</h2><p>Allein sie fordern einen Beweis dafür, daß Gott auf unsere Anrufung hin wirklich zur Heiligung der Handlung gegenwärtig werde. Wer ein solches Verlangen stellt, möge nochmals durchlesen, was wir oben dargelegt haben. Denn der Beweis, daß die im Fleische erschienene Macht wirklich göttlich sei, dient zur Beantwortung der nunmehr zur Erörterung gestellten Frage. Ist nämlich vom Fleischgewordenen, der seine höhere Natur durch seine Wunder offenbart, nachgewiesen, daß er wahrer Gott ist, so ist damit auch schon bewiesen, daß er stets auf die Anrufung zur Taufe gegenwärtig wird. Denn wie jedes Ding gewisse Eigentümlichkeiten hat, wodurch es seine Natur verrät, so besteht eine Eigentümlichkeit der göttlichen Natur in der Wahrhaftigkeit. Nun hat er verheißen, daß er bei denen, die ihn anrufen, sein werde, daß er mitten unter den Gläubigen weile, bei allen bleibe und jedem beistehe. Demnach bedürfen wir für die Gegenwart Gottes bei der Taufhandlung kaum noch eines anderen Beweises, weil wir uns einerseits auf Grund seiner Wunder von seiner Gottheit überzeugt haben, anderseits wissen, daß Gott mit Naturnotwendigkeit unmöglich mit der Lüge Gemeinschaft haben kann. Und so dürfen wir keinen Zweifel daran haben, daß in dem untrüglichen Versprechen schon das Versprochene enthalten ist. Wenn aber bei der heiligen Verrichtung Gott im Gebete vorher angerufen wird, so liegt hierin ein mehr als genügender Beweis dafür, daß sie von Gott mit wirksamer Kraft gekrönt wird.</p><p>Wenn nämlich bei der anderen Art der Menschengeburt, wie bereits erwähnt, das Bestreben der Eltern, selbst wenn sie nicht darum bitten, doch nur mit Hilfe des göttlichen Beistandes, ohne den ihr Bemühen fruchtlos und unwirksam bliebe, ein neues Menschenwesen hervorzubringen vermag, um wieviel mehr wird unser Streben bei der geistigen Geburt erfolgreich sein, da einerseits Gott nach dieser Glaubenslehre seinen Beistand verheißen und seine Kraft in die Handlung gelegt hat, andererseits wir mit unserem Willen zur Erreichung des hohen Zieles beitragen, insofern die Mitwirkung des Gebetes mit dem Akte sich verbindet, wie es sich geziemt. Denn gleichwie diejenigen, welche um den Aufgang der Sonne beten, dem wirklich eintretenden Naturvorgang keinen Eintrag tun, auch niemand derartigen Gebetseifer, der Gott um solches anfleht, was jedenfalls geschieht, für unnütz erklären möchte, so werden auch wir, wenn wir trotz unserer festen Überzeugung, Gott werde seinem untrüglichen Versprechen gemäß den durch jene mystische Handlung Wiedergebornen auf jeden Fall Gnade verleihen, dennoch beten, hiedurch einen Gnadenzuwachs erwerben oder die Gnadenspende wenigstens nicht verhindern. Denn daß die Gnadenmitteilung auf jeden Fall erfolge, glauben wir bestimmt, da derjenige, der sie versprochen hat, Gott ist; der Beweis für seine Gottheit liegt aber in seinen Wundern vor; sonach kann kein Zweifel bestehen, daß Gott durch die Taufe seine Gnade spende.Kapitel 35. Dem dreimaligen Untertauchen kommt eine hohe Bedeutung zu. ― Es gibt auch eine Reinigung durch Feuer.</p><h2>35</h2><p>Das Hinabsteigen in das Wasser aber und das dreimalige Eintauchen des Menschen enthält ein anderes Geheimnis. ― Da der Menschgewordene unsere Erlösung nicht so fast durch seine Lehrunterweisung, sondern mehr durch das, was er tat, bewerkstelligen wollte, indem er freiwillig in das menschliche Leben eintrat, damit er mittels des Fleisches, das er angenommen und zur Göttlichkeit erhoben hatte, alles damit Verwandte und Gleichartige miterrette, so mußte er einen Weg ausfindig machen, um durch Handlungen eine gewisse Ähnlichkeit und Verwandtschaft zwischen Meister und Jünger herbeizuführen. Wir müssen daher untersuchen, welche Handlungen an dem Vorbild unseres Lebens sich finden, damit wir nach den Worten des Apostels (Hebr. 2, 10) auf den Urheber unseres Heiles sehend, unsere Nachfolgerschaft und Nachahmung einrichten können. Denn wie die Soldaten, welche zu gewandtem Waffengebrauch unterrichtet werden sollen, von den im Kriegshandwerk Erfahrenen durch das, was sie sehen, zu militärischen Übungen herangeführt werden, solche aber, welche das Vorgezeigte nicht nachahmen, niemals soldatische Tüchtigkeit erlangen, ebenso müssen alle, welche den gleichen Eifer für das Gute haben, ihrem Meister, der sie zum Heile führen möchte, notwendig dadurch nachfolgen, daß sie ihn nachahmen und ebenfalls vollbringen, was er vor ihnen tat. Denn man kann nicht zum gleichen Ziele gelangen, wenn man nicht die gleichen Wege geht.</p><p>Wie nämlich selbst jene, welche für sich die Irrgänge der Labyrinthe nicht zu durchschreiten vermögen, sobald sie nur einen darin Bewanderten treffen und ihm auf den Fuß nachfolgen, gar schnell die vielfachen und trügerischen Windungen im Bauwerk sicher durchqueren können, während sie keinen Ausweg finden, wenn sie ihrem Führer nicht unmittelbar sich anschließen, so ― bedenke es wohl ― ist auch das Labyrinth dieses Lebens für unsere menschliche Natur undurchschreitbar, wenn wir nicht den nämlichen Weg einschlagen, durch den der Herr entrann, dem Zirkelkreis entkam, als er sich in demselben befand. Mit dem Labyrinth meine ich aber bildlich den Kerker des Todes, der keinen Ausgang hat und in dem das unglückliche Menschengeschlecht eingeschlossen war. Was sehen wir nun an dem Urheber unseres Heiles? Ein dreitägiges Verharren im Tode und seine darauffolgende Wiederbelebung. Darum war es notwendig, etwas zu erdenken, wodurch wir ihm in diesem Punkte ähnlich würden. Welches Mittel wurde nun erfunden, durch dessen Gebrauch wir dieses sein Erlebnis nachahmen können? Als der naturgemäße und passende Ort kommt für alles Tote zunächst die Erde in Betracht, in welche es gesenkt und verborgen wird; aber enge ist mit der Erde das Wasser verwandt, da sie beide allein unter den Elementen schwer sind und abwärts streben, ineinander verharren und sich miteinander verbinden. Da nun der Tod den Urheber unseres Lebens, wie es unserer Natur entsprach, unter die Erde führte, so gelangt die Nachahmung dieses Todes, die von unserer Seite erfolgt, in dem der Erde benachbarten Elemente, im Wasser, zum sinnbildlichen Ausdruck. Und wie jener vom Himmel herabgestiegene Mensch, nachdem er den Tod auf sich genommen, drei Tage unter der Erde sich befand und dann zum Leben zurückkehrte, so soll jeder, der auf Grund der menschlichen Natur mit ihm verbunden ist, um den nämlichen Zweck, d. h. die gewünschte Belebung zu erreichen, statt mit Erde mit Wasser sich überschütten lassen und dreimal in das Element eintauchen, um dadurch die nach drei Tagen erfolgte Gnade der Wiederbelebung nachzuahmen.</p><p>Wie schon oben ausgeführt, verhängte die göttliche Natur über die menschliche Natur den Tod gemäß der Heilsordnung in der Absicht, daß durch die Trennung des Körpers von der Seele das Böse ausgeschieden und der Mensch bei der Auferstehung in einem ganz neuen Zustande wieder hergestellt werde, gesund, leidlos, unversehrt und frei von allem Bösen. Dieses Endziel, welches die Heilsordnung hinsichtlich des Todes verfolgt, wurde bei dem Urheber des Lebens vollständig erreicht, indem sie ihre damit verbundene besondere Absicht restlos zur Erfüllung brachte: was verbunden war, wurde durch den Tod getrennt und dann das also Getrennte wieder vereinigt und zwar so, daß zuerst durch die Trennung der miteinander verbundenen Bestandteile, nämlich des Leibes und der Seele, eine Läuterung der Natur stattfand und infolgedessen eine Wiedervereinigung der Getrennten unter Ausscheidung alles Fremdartigen und Unvollkommenen erfolgen konnte. Bei den Jüngern dagegen gestattet die menschliche Natur nicht eine durchgängige Nachahmung des Meisters, sondern sie übernimmt jetzt von ihm nur soviel als möglich ist, und verspart das noch Übrige auf eine spätere Zeit.</p><p>Was ist es nun, was sie jetzt schon nachahmt? Dies, daß sie durch den Tod, welcher durch das Wasserbad versinnbildet wird, die Vernichtung des ihr beigemischten Bösen bewirkt, freilich nicht eine vollständige Vernichtung, aber immerhin sozusagen eine Durchschneidung des engen Zusammenhangs, in welchem wir mit dem Bösen stehen, indem zur Entfernung des Bösen ein Zweifaches zusammenhilft: nämlich die Reue des Sünders und die Nachahmung des Todes; hiedurch wird der Mensch aus seiner Verbindung mit dem Bösen befreit, indem er durch die Reue zum Haß und zur Verabscheuung der Sünde kommt und durch den Tod auf die Vernichtung des Bösen hinarbeitet. Freilich wenn der Nachahmende in den völligen Tod gehen könnte, so würde dies nicht mehr eine bloße Nachahmung, sondern die ganz gleiche Handlung darstellen, und das Böse wäre gänzlich aus unserer Natur entfernt, so daß er, wie der Apostel sagt (Röm. 8, 4), der Sünde ein für allemal absterben würde. Da wir aber, wie gesagt, die allerhabene Macht nur soviel nachahmen können, als die Armseligkeit unserer Natur es gestattet, so ahmen wir durch die dreimalige Eintauchung in das Wasser und die Wiedererhebung aus demselben das Begräbnis unseres Heilbringers und seine nach drei Tagen erfolgte Auferstehung nach; dabei erinnern wir uns, daß, wie uns die Kraft zukommt, sowohl in das Wasser ein- als auch aus demselben emporzutauchen, ebenso der Träger der Herrschaft über alle Dinge, die Macht besaß, einerseits in den Tod, wie wir ins Wasser, unterzutauchen, anderseits aber auch in seine Herrlichkeit zurückzukehren.</p><p>Wer nun auf das Verhältnismäßige sieht und die Handlungen, Leistungen unter Berücksichtigung der beiderseitigen Macht beurteilt, wird in den Handlungen keinen wesentlichen Unterschied finden, da jeder von beiden tut, was in seiner Macht steht. Denn wie es in der Gewalt des Menschen steht, wenn er will, das Wasser ohne Gefahr zu berühren, so ist es für Gottes Macht unendlich leichter, sich dem Tode zu nahen, ohne irgendwie Schaden zu nehmen. Deshalb müssen wir durch das Wasserbad die Gnade der Auferstehung uns erwerben, damit wir uns bewußt werden, Taufe und Auferstehung sei uns in gleicher Weise leicht zugänglich gemacht. Aber wie im menschlichen Leben eines dem anderen vorausgehen muß und ohne das eine das andere nicht eintreten kann, obschon gar oft bei einem Vergleich zwischen Anfang und Ende der Anfang im Verhältnis zum Endziel fast als nichts erscheint, (welche Ähnlichkeit besteht zwischen dem Menschen und dem zur Erzeugung des Lebewesens dienenden Samen? Und doch könnte ohne das Erste das Zweite nicht entstehen) ― so hat die wunderbare Auferstehung, obgleich sie ihrer Natur nach größer ist als die Taufe, ihre Anfänge und Ursachen in dieser; denn sie kann nicht erfolgen, wenn nicht die Taufe vorausgeht.</p><p>Unmöglich also kann der Mensch ohne die im Wasserbad vor sich gehende Wiedergeburt zur Auferstehung gelangen, ich meine dies nicht im Hinblick auf die Umbildung und den Wiederaufbau unserer Bestandteile (denn hiezu muß unsere Natur infolge der inneren Notwendigkeit, die ihr Schöpfer in sie legte, auf jeden Fall gelangen, mag sie zur Gnade der Taufe kommen oder dieser Einweihung unteilhaftig bleiben), sondern im Hinblick auf die Wiederherstellung zu jenem Leben, das da voll Seligkeit, göttlicher Art und frei von jeder Trübsal ist. Denn keineswegs gelangen alle, welche durch die Auferstehung die Rückkehr in das Sein erhalten, zu dem nämlichen Leben, sondern es wird ein großer Unterschied sein zwischen denen, welche schon die Reinigung empfingen, und jenen, die derselben noch bedürfen. Die bereits hier durch die Taufe gereinigten Seelen bekommen Zutritt zu den ihnen nun verwandten guten Geistern; mit der Reinheit ist aber auch Schmerzlosigkeit verbunden; in der Schmerzlosigkeit liegt aber nach allgemeinem Zugeständnis die Seligkeit. Diejenigen Menschen hingegen, deren Leidenschaften sich verhärteten und die kein Mittel zur Reinigung der Befleckung anwandten: weder das geheimnisvolle Wasser, noch die Anrufung der göttlichen Macht, noch reumütige Besserung, müssen ebenfalls in jenen Zustand gelangen, der ihrem Wesen entspricht ― dem ungeläuterten Golde aber entspricht nur der Schmelzofen ―, damit das ihnen beigemengte Böse ausgeschieden werde und sie so später nach langen Zeitläuften für Gott noch Rettung finden. Da also eine reinigende Kraft im Wasser wie auch im Feuer liegt, so bedürfen diejenigen, welche durch das geheimnisvolle Wasser den Schmutz der Unreinheit abgewaschen haben, des zweiten Reinigungsmittels nicht mehr; jene dagegen, welche der Weihe durch das Wasser der Reinigung nicht teilhaftig wurden, müssen durch Feuer geläutert werden.Kapitel 36. Die Taufe ist ein großes Gnadengeschenk.</p><h2>36</h2><p>Denn sowohl die gewöhnliche Vernunft als auch die Lehre der Heiligen Schrift sagt uns, daß in den göttlichen Chor nicht zugelassen wird, wer nicht alle Unreinheit der Sünde von sich abgewaschen hat. Dies ist, obgleich es an sich klein und unbedeutend erscheint, der Anfang und die Voraussetzung hoher Güter. Klein nenne ich es wegen der Leichtigkeit, mit der es geleistet wird. Denn was ist das für eine Mühe zu glauben, daß Gott, weil in allem seiend, überall ist und darum auch bei denen, die seine lebendigmachende Kraft anrufen, daß er aber, wenn er gegenwärtig ist, auch das wirkt, was ihm zukommt? Der göttlichen Macht kommt nun die Errettung derer zu, die darum flehen; diese aber zeigt sich durch die Reinigung wirksam, welche durch das Wasser vollzogen wird. Der also Gereinigte tritt aber in Gemeinschaft mit der Reinheit, und die wahre Reinheit ist Gott. Du siehst demnach, wie unbedeutend der Anfang ist, und wie er ohne Mühe geleistet werden kann: Glaube und Wasser; ersterer hängt von unserem freien Willen ab, und letzteres begegnet uns allenthalben im menschlichen Leben. Aber wie groß und herrlich ist das Gut, das aus beiden erblüht ― der Besitz der Gemeinschaft mit Gott!Kapitel 37. Von der eucharistischen Nahrung.</p><h2>37</h2><p>Allein da der Mensch ein Doppelwesen ist, indem er aus Leib und Seele besteht, so müssen alle, welche gerettet werden wollen, den beiden Bestandteilen nach mit dem Urheber des Lebens verbunden werden. Die Seele also, welche durch den Glauben mit ihm in Verbindung trat, trägt eben hierdurch die Wurzel der Rettung in sich (denn die Vereinigung mit dem Leben bewirkt auch Teilnahme am Leben); der Leib aber kommt auf eine andere Weise zur engsten Verbindung mit seinem Erretter. Denn wie die, welche auf hinterlistige Weise Gift bekommen haben, die todbringende Macht desselben durch ein Gegengift tilgen, dabei letzteres aber dem verderblichen Trank ähnlich in die menschlichen Eingeweide einführen müssen, damit die Kraft des Heilmittels auf diesem Wege auf den ganzen Körper übergehe, so bedurften auch wir, nachdem wir von einer Speise gekostet hatten, welche die Auflösung unseres Körpers zu bringen drohte, einer anderen, welche die Auflösung hemmt, damit sie als Gegenmittel von uns genommen, den Schaden wieder verdränge, den die erwartete schlimme Nahrung in unseren Körper getragen. Was ist nun diese Speise? Keine andere als jener Leib, der den Tod überwunden und uns das Leben gebracht hat. Denn gleichwie nach den Worten des Apostels (1 Kor. 5, 5) ein wenig Sauerteig die ganze Teigmasse sich ähnlich macht, so bildet jener von Gott mit Unsterblichkeit ausgestattete Leib den unsrigen nach sich um und verwandelt ihn. Denn wie unfehlbar, wenn Verdorbenes mit Gesundem gemischt, die ganze Mischung verdorben wird, so formt umgekehrt der unsterbliche Leib jeden, der ihn aufnimmt, ganz nach seiner Natur um.</p><p>Nun kann nichts auf andere Weise in unseren Leib gelangen als dadurch, daß es in der Form von Speise und Trank in unsere Eingeweide eingeht; daher müssen wir auch die Leben spendende Kraft in den Körper aufnehmen, die unserer Natur entspricht. Da nun jener Leib, der Gott in sich getragen, allein die Gnade besitzt, unsterblich zu machen, unser Körper aber, wie gezeigt, nur dadurch zur Unsterblichkeit gelangt, wenn er durch die Vereinigung mit jenem unsterblichen Leib die Gabe der Unvergänglichkeit empfängt, so müssen wir nur noch die Frage untersuchen, wie es möglich ist, daß jener Leib, obgleich er an so viele Tausende von Gläubigen auf dem ganzen Erdenrund immerfort verteilt wird, einem jeden in der großen Reihe der Teilnehmer doch ganz zuteil wird, und wie er für sich selbst ganz bleibt. Damit unser Glaube, der auf die Forderungen der Vernunft achtet, auch hinsichtlich der vorliegenden Frage keinen Zweifel aufkommen lasse, müssen wir einen kurzen Seitenblick auf die Physiologie des Leibes werfen. Wer weiß nämlich nicht, daß unser Leib seiner ganzen Natur nach nicht durch und aus sich selbst zu leben vermag, sondern durch eine Kraft, die ihm von außen zufließt und die ihn sowohl in seiner Existenz wie in seinem Bestand dadurch erhält, daß in ununterbrochener Tätigkeit, was mangelt, aufgenommen, und, was überflüssig ist, ausgeschieden wird? Und wie ein mit Flüssigkeit gefüllter Schlauch, wenn am unteren Ende der Inhalt auszurinnen anfängt, seine bauchige Gestalt nicht gut bewahren kann, falls nicht Neues von oben zur Behebung der entstehenden Leere hinzugegossen wird, so daß man beim Anblick der Rundung erkennt, sie gehöre trotz des gegenteiligen Scheines nicht zur Gestaltung des Schlauches, sondern der Zufluß von oben gebe der Hülle die Form eines Bauches ― so ist auch unser Leib nicht so ausgestattet, daß er selbst seinen Bestand sichern könnte, sondern eine Kraft, die ihm von außen zufließt, erhält ihn in seiner Existenz, und diese Kraft ist und heißt Nahrung. Doch ist dieselbe nicht für alle Körper, die ihrer bedürfen, gleich, sondern jedem Leib ist die ihm entsprechende Nahrung vom Schöpfer der Natur zugewiesen. Manche Tiere nähren sich von Wurzeln, die sie ausgraben, andere von Gras, wieder andere von Fleisch; für den Menschen aber ist die Hauptnahrung das Brot und sein Trank zur Erhaltung und Bewahrung der Flüssigkeit nicht lediglich Wasser, sondern häufig mit Wein verbessert, um die Wärme in uns zu fördern. Wer demnach diese Dinge sieht, sieht unseren ganzen Körper, weil derselbe in ihnen der Potenz (Möglichkeit) nach enthalten ist; denn wenn ich dieselbe in mich aufgenommen habe, so wird daraus Blut und Leib, indem der Körper durch eine verändernde (assimilierende) Kraft sie entsprechend in seine Wesenheit (Substanz) überführt.</p><p>Haben wir nun die näheren Unterscheidungen in dieser Richtung angegeben, so können wir wieder unsere Gedanken auf den Hauptgegenstand zurücklenken. Es wurde nämlich die Frage aufgeworfen, wie jener eine Leib dem ganzen Menschengeschlecht ewiges Leben zu verleihen vermöge, das heißt allen, welche nur immer glauben und wie er an alle ausgeteilt werden könne, ohne selbst vermindert zu werden. Bald kommen wir an eine befriedigende Antwort heran. Denn wenn der Bestand des ganzen Körpers auf der Nahrung beruht und diese Speise und Trank umfaßt, und zwar Brot als Speise und Wasser, mit Wein verbessert, als Trank, wenn ferner, wie gleich anfangs dargelegt wurde, Gottes Wort in seiner Eigenschaft als Gott und Wort mit der menschlichen Natur sich verband, und dabei, obgleich einen wahren menschlichen Leib annehmend an den Bedingungen seines Bestandes keine Änderung vornahm, sondern die Existenz seines Menschenleibes auf die gewöhnliche und ihm angemessene Weise sicherte, indem er ihm Speise und Trank zu seiner Erhaltung zuführte, wobei Brot als Speise diente, ― so war also, gleichwie bei uns nach unserer wiederholten Darlegung, daß man, wenn man Brot sieht, gewissermaßen den menschlichen Leib sieht, weil ersteres durch den Genuß zu letzterem wird, auch, beim menschgewordenen Worte der Leib, der Gott in sich trug, weil auch er die Nahrung des Brotes zu sich nahm, in gewisser Hinsicht mit dem Brote identisch, weil dieses als Speise, wie gesagt, in die Natur des Leibes übergeht. Denn was von allen menschlichen Leibern gilt, wird auch bei jenem Leibe zugestanden, daß er nämlich durch Brot erhalten wurde; aber derselbe Leib ist es auch, der durch das Einwohnen des Wortes Gottes zur göttlichen Würde erhoben wurde. Mit Recht also glauben wir, daß auch jetzt das durch das Wort Gottes geheiligte Brot in den Leib des Wortes Gottes verwandelt werde; denn auch jener Leib war der Potenz nach Brot, geheiligt aber wurde er durch das Einwohnen des Wortes Gottes, das im Fleische sein Gezelt aufschlug.</p><p>Wie sonach das Brot, das in jenen Leib umgewandelt wurde, in die göttliche Macht überging, so wird auch jetzt noch auf dieselbe Weise Brot zum nämlichen Leibe. Denn damals machte die Gnade des Wortes den Leib heilig, der durch Brot in seinem Bestand erhalten wurde und in gewissem Sinne selbst Brot war, so wird jetzt in gleicher Weise das Brot geheiligt, wie der Apostel sagt (1 Tim. 4, 5), durch das Wort Gottes und durch Gebet, jedoch nicht so, daß es erst durch Essen allmählich in den Leib des Wortes überging, sondern so, daß es sofort durch das Wort in den Leib verwandelt wird, gemäß dem (aus Ber.: lies: „dem“ statt „dessen“), daß das Wort Gottes selbst erklärte: „Dies ist mein Leib.“</p><p>[Forts. v. ] Da aber jeder Mensch auch durch Flüssigkeit genährt wird (denn ohne derartige Zufuhr würde das Erdhafte in uns kaum am Leben bleiben), so gewähren wir, gleich wie wir den festen Bestandteil unseres Körpers durch feste und harte Speise aufrecht erhalten, auch unserem flüssigen Bestandteil eine Nachhilfe aus der nämlichen Natur; diese wird dann, wenn es in uns eingeführt wird, durch die Kraft der Assimilation zu Blut, und zwar zumal dann, wenn es durch Wein die Fähigkeit erhalten hat, in Wärme umgesetzt zu werden. Da nun jenes Gott in sich bergende Fleisch auch den flüssigen Bestandteil des menschlichen Körpers zu seiner Wesenheit und Erhaltung aufnahm, Gott aber sich deshalb mit unserer hinfälligen Natur vereinigte, um den Menschen zur Verbindung mit der Gottheit emporzuheben, so will er mittels des Fleisches, das aus Brot und Wein bereitet wird, allen gläubigen Anhängern der Gnadenordnung, indem er sich mit ihren Leibern vereinigt, sich selbst gleichsam einsäen, damit auch der Mensch durch sein Einswerden mit dem Unsterblichen der Unsterblichkeit teilhaftig werde. Diese Gaben spendet er durch die Kraft der Segnung, indem er die Natur des Sinnenfälligen in jenes umwandelt.Kapitel 38. Übergang zum nächsten Punkt, das heißt zum Beginn des Glaubens.</p><h2>38</h2><p>Unseren Darlegungen über die verschiedenen Punkte unserer Lehre dürfte kaum etwas fehlen, ausgenommen die Erörterung über den Anfang des Glaubens, die wir nun noch in der gegenwärtigen Abhandlung geben wollen. Für solche aber, welche eingehendere Untersuchungen wünschen, haben wir, indem wir mit möglichster Hingabe und Gründlichkeit den Gegenstand erörterten, derartige bereits in anderen Werken geboten, in welchen wir uns teils in einen Kampf mit den Gegnern einließen, teils aus Eigenem die betreffenden Fragen zu lösen suchten. Bezüglich der folgenden Darlegung glaubten wir, es würde genügen, soviel hinsichtlich des Übertritts zum Glauben darzutun, als der Wortlaut des Evangeliums fordert, damit jeder, der die Wiedergeburt des Geistes anstrebt, zweifaches kennen lerne: den Vater, von dem er wiedergeboren, und das Leben, für das er wiedergeboren ward. Denn nur bei dieser Art von Geburt hat der Mensch die Möglichkeit in der Hand, zu werden, was er will.Kapitel 39. Die Wiedergeburt erfolgt aus dem dreieinigen Gott; darum ist der Glaube an denselben notwendig.</p><h2>39</h2><p>Bei allem, was sonst geboren wird, hängt dessen Eintritt in das Sein von dem Willen der Erzeugenden ab; nur die geistige Geburt hängt von der Macht dessen ab, der geboren wird. Da nun gerade darin, das heißt in dem Umstande, daß jedem die Wahl freisteht, die Gefahr liegt, das Zuträgliche zu verfehlen, so ist es, meine ich, nur vorteilhaft, wenn alle, welche wiedergeboren werden wollen, zuerst sich reiflich überlegen, wer ihnen als Vater einen Nutzen verschaffen kann und von wem ihre Natur mit größerem Gewinn ihre Existenz bekäme; denn wie bemerkt, wählt man bei dieser Art von Geburt seine Erzeuger selbst.</p><p>Da man nun zwischen geschaffener und nicht geschaffener Natur unterscheidet, und erstere der Veränderung und dem Wechsel unterliegt, letztere aber als besondere Auszeichnung die Unveränderlichkeit und Unwandelbarkeit besitzt, wessen Kind wird nun der, welcher mit dreifacher Überlegung das ihm Nützliche wählt, werden wollen: ein Kind jener Natur, welche dem Wechsel steter Veränderung unterliegt, oder aber jener, welcher eine für immer unveränderliche und im Guten stets gleichbleibende Wesenheit zukommt? Da nun im Evangelium die drei Personen und ihre Namen überliefert werden, durch welche die Gläubigen ihre Wiedergeburt gewinnen, der aus jener Dreiheit Wiedergeborene aber in gleicher Weise vom Vater, vom Sohne und vom Heiligen Geiste sein neues Leben empfängt, ― so heißt es nämlich im Evangelium vom Geiste: Was aus dem Geiste geboren ist, ist* „Geist“* (Joh. 3, 6) und Paulus „zeugt in Christus“ (1 Kor. 4, 15) und „der Vater ist der Vater aller“ (Eph. 4, 6) ― so muß der Verstand des Gläubigen recht ernstlich darauf achten, daß er sich nicht selbst zu einem Kinde der veränderlichen Natur mache, während es ihm doch freisteht, die unveränderliche Wesenheit zur Quelle des eigenen Lebens zu haben.</p><p>Vom Glauben der zur neuen Heilsordnung Übertretenden hängt nämlich die Wirkungsweise ihrer Wiedergeburt ab: wer die heilige Dreiheit ohne Ausnahme als unerschaffen bekennt, geht in deren wechsel- und wandelloses Leben ein; wer dagegen infolge seines Irrwahnes innerhalb der Dreiheit eine geschaffene Natur annimmt, und sich auf dieselbe taufen läßt, wird zu einem wandelbaren und veränderlichen Leben wiedergeboren; denn der Erzeugte hat notwendig die nämliche Natur wie der Erzeugende. Was möchte also mehr frommen: in das unveränderliche Leben einzugehen oder aber wiederum in das Gewoge des veränderlichen Lebens geworfen zu werden? Da nun jeder, der auf Verstand Anspruch macht, ohne weiteres einsieht, daß das Unveränderliche dem Veränderlichen, das Vollkommene dem Unvollkommenen, das nichts Bedürfende dem Mangel Leidenden, das keines Fortschrittes mehr Fähige und im Guten immerdar Beharrliche dem noch auf dem Wege des Fortschrittes sich Befindlichen bei weitem vorzuziehen ist, so muß, wer irgend Einsicht hat, notwendig eines von beiden wählen:* entweder* glauben, die ganze heilige Dreiheit sei von unerschaffener Natur, und dieselbe sich zum Urheber seines neuen Lebens bei der Wiedergeburt bestellen,* oder,* wenn er den Sohn und den Heiligen Geist außerhalb der Natur des Vaters als des obersten und wirklichen und guten Gottes stellen will, diese Meinung nicht in die Zeit der Wiedergeburt hinübernehmen, damit er nicht unversehens der mangelhaften und der Verbesserung bedürftigen Natur sich anheimgebe und sich sozusagen in die nämliche Art einführe, weil er mit seinem Glauben von der allerhabenen Natur abfiel. Denn wer einem Geschöpfe sich unterwürfig macht, der stellt, selbst wenn er es nicht beabsichtigt, die Hoffnung des Heiles nicht auf Gott.</p><p>Allem Geschaffenen kommt nämlich auf Grund der Tatsache, daß es in ganz gleicher Weise aus dem Nichtsein zum Sein gelangte, eine Verwandtschaft untereinander zu; denn gleichwie beim Baue unseres Körpers alle Glieder, mögen sie ihre Stelle mehr oben oder mehr unten haben, unter sich verwandt sind, so ist auch die geschaffene Natur eben auf Grund der gleichen Erschaffung in Verwandtschaft miteinander verbunden und der Unterschied zwischen größerer oder geringerer Vollkommenheit, den wir Menschen aufstellen, vermag nicht, dieses verwandtschaftliche Verhältnis zu zerstören. Denn an welchen Dingen sich vorher die gleiche Nichtexistenz feststellen läßt, an denen findet sich, so sehr sie auch in anderen Punkten eine Verschiedenheit aufweisen, doch in diesem Punkt keine Wesensverschiedenheit. Wenn nun der Mensch, der ein geschaffenes Wesen ist, auch den Heiligen Geist und ebenso den Eingebornen für ein Geschöpf halten wollte, so hätte er sich, indem er nur zu sich selbst zurückkehren würde, in seiner Hoffnung, in einen besseren Zustand versetzt zu werden, sicher getäuscht. Eine solche Auffassung würde der des Nikodemus ähnlich zu erachten sein, der da, als der Herr zu ihm von der Wiedergeburt sprach, in seinen Gedanken auf den Mutterschoß verfiel. Wer sich daher bei der Wiedergeburt nicht mit der unerschaffenen Natur verbinden will, sondern mit einem ihm verwandten und gleichfalls abhängigen Geschöpf, dessen Wiedergeburt kommt nicht von oben, sondern von unten. Das Evangelium aber lehrt, daß diejenigen, welche selig werden wollen, von oben her wiedergeboren werden müssen (Joh. 3, 3).Kapitel 40. Die Wiedergeburt muß einen neuen Lebenswandel zur Folge haben. ― Schluß mit dem Ausblick auf die Ewigkeit.</p><h2>40</h2><p>Doch scheint mir die Katechese mit dem Dargelegten die Unterweisung noch nicht erschöpfend gegeben zu haben. Denn nach meinem Dafürhalten muß man auch das, was auf die Wiedergeburt folgt, in Betracht ziehen, weil dies viele von denen, welche zur Gnade der Taufe herantreten, übersehen und so sich selbst betrügen, indem sie nur dem Scheine nach, nicht aber wirklich wiedergeboren sind. Denn die Umwandlung unseres Lebens, welche durch die Wiedergeburt geschehen soll, wird doch nicht als Umwandlung anzusprechen sein, wenn wir in dem Zustande bleiben, in welchem wir vorher waren. Denn von jenem, der nach der Taufe noch der nämliche ist, weiß ich nicht, wie man annehmen könnte, er sei ein anderer geworden, während keine seiner in seinem Wandel sich zeigenden Eigenschaften eine Änderung erfuhren. Denn jedermann begreift, daß die heilbringende Geburt die Erneuerung und Umwandlung unserer Natur zum Ziele hat. Nun aber bewirkt die Taufe keine Veränderung der Menschennatur an sich; weder die Vernunft, noch der Verstand, noch die Fassungskraft wird geändert, noch sonst eine Fähigkeit, welche zur menschlichen Natur gehört; denn falls eine derartige Fähigkeit unserer Menschennatur eine Veränderung erführe, so würde dies eine Veränderung zum Schlechtern bedeuten. Da also in der genannten Beziehung eine Änderung nicht eintreten kann, die Wiedergeburt von oben aber dennoch eine Änderung bewirkt, so entsteht die Frage, in welcher Beziehung die Änderung sich vollzieht, welche die volle Gnade der Wiedergeburt mit sich bringt. Klar ist, daß eine Veränderung zum Bessern vorliegt, falls die schlechten Eigenschaften unserer Natur beseitigt werden. Wenn wir nun, in diesem geheimnisvollen Bade gewaschen, in unseren Gesinnungen nach dem Worte des Propheten (Is. 1, 16) geläutert wurden und unsere Missetaten gewaschen sind, dann sind wir besser geworden und haben uns zum Besseren verändert. Wird dagegen dieses Bad nur dem Körper zuteil, während sich die Seele von den Flecken ihrer Krankheit nicht reinigt, sondern das Leben nach der Weihe dem vor der Weihe gleicht, so will ich, wenn es auch ein kühnes Wort ist, es dennoch aussprechen, daß das Wasser bei diesen nur Wasser war, weil die Gabe des Heiligen Geistes an dem Wiedergebornen in keiner Weise sich offenbarte, falls nicht bloß das häßliche Laster des Zornes das göttliche Ebenbild entstellt oder die Leidenschaft der Habsucht oder zügellose und schmähliche Gesinnung oder Stolz und Neid und Hochmut, sondern auch der ungerechte Gewinn bei ihm bleibt und das Weib, das er sich auf ehebrecherische Weise erworben, seinen Lüsten auch nachher noch dient.</p><p>Wenn dies und Ähnliches nach wie vor im Leben des Getauften sich findet, so vermag ich nicht einzusehen, was geändert worden wäre, weil ich ja den nämlichen vor Augen habe, den ich vorher erblickte. Auch derjenige, den der Getaufte vorher gekränkt, verleumdet und aus seinem Besitztum vertrieben hat, merkt an ihm keine Veränderung. Nicht hören sie aus seinem Munde das Wort des Zachäus: „Wenn ich jemand betrogen, so ersetze ich es ihm vierfach“ (Luk. 19, 8). Was sie ihm vor der Taufe nachredeten, das erzählen sie auch nachher von ihm; mit demselben Namen nennen sie ihn auch jetzt noch einen Habsüchtigen, einen Menschen, der nach fremdem Eigentum verlangt und vom Unglück des Nächsten schwelgt. Wer also sich gleichbleibt und dennoch sich einreden möchte, durch die Taufe sei eine Veränderung bei ihm eingetreten, der beachte das Wort des heiligen Paulus: „Wenn einer, der nichts ist, etwas zu sein dünkt, der betrügt sich selbst“ (Gal. 6, 3). Denn was du nicht geworden bist, das bist du nicht.</p><p>Von den Wiedergebornen sagte aber das Evangelium: „So viele ihn aufnahmen, gab er Macht, Kinder Gottes zu werden“ (Joh. 1, 12). Wer aber jemands Kind geworden, der hat jedenfalls die nämliche Natur, wie sein Vater. Hast du nun Gott aufgenommen und bist du ein Kind Gottes geworden, so zeige durch dein Tun und Lassen, daß Gott in dir wohnt, zeige, wer dein Vater ist! Durch die nämlichen Merkmale, durch die wir Gott erkennen, wird sich auch die Gottesverwandtschaft der wahren Kinder Gottes verraten. Gott nun „tut seine Hand auf und erfüllt alles, was da lebt, mit Freude“ (Ps. 144, 16 [hebr. Ps. 145, 16]); „er hasset das Unrecht“ (Mich. 7, 8); „er verabscheut das Böse“ (Jer. 26, 3); „mild ist der Herr gegen alle“ (Ps. 144, 9 [hebr. Ps. 145, 9]); „nicht alle Tage zürnt er“ (Ps. 7, 12 [hebr. Ps. 7, 12]); „gerade ist Gott der Herr und keine Ungerechtigkeit ist in ihm“ (Ps. 91, 15 [hebr. Ps. 92, 15]) [ber.: Ps. 91, 16 bzw. 92, 16], und was wir sonst an verschiedenen Stellen der Heiligen Schrift über Gott hören. Wenn du solch gute Eigenschaften aufweisest, bist du wirklich ein Kind Gottes geworden; wenn du aber in deinen schlimmen Eigenschaften verharrst, so redest du dir vergeblich ein, von oben wiedergeboren zu sein; dann gilt das Wort des Propheten von dir: „Du bist eines Menschen Kind“ (Ps. 81, 6 [hebr. Ps. 82, 6]) und nicht Kind des Allerhöchsten. „Du liebst Eitelkeit und suchst Lüge“ (Ps. 4, 3 [hebr. Ps. 4, 3]). Weißt du nicht, auf welche Weise der Mensch wunderbar erhöht wird? Nicht anders als dadurch, daß er heilig wird.</p><p>Es dürfte notwendig sein, zu dem bereits Gesagten folgendes beizufügen, nämlich, daß die Güter, welche den Guten in Aussicht stehen, von der Art sind, daß sie sich nicht in Worten schildern ließen. Wie sollte dies von dem möglich sein, was „kein Auge gesehen, kein Ohr gehört und was in keines Menschen Herz eingedrungen ist“ (1 Kor. 2, 9)? Aber auch das qualvolle Leben der Gottlosen im Jenseits ist nicht mit irgend etwas von dem gleichbar, was hienieden Schmerz bereitet. Denn wenn auch die eine oder andere der dortigen Strafen mit Namen aufgeführt werden, welche hienieden gebräuchlich sind, so ist der Unterschied doch nicht gering. Denn wenn du vom Feuer hörst (Matth. 3, 10), so wirst du an ein anderes als an das irdische denken müssen, dadurch belehrt, daß jenes eine gewisse Eigenschaft besitzt, die dieses gewöhnliche nicht hat. Jenes nämlich erlischt nicht, für dieses aber hat man durch die Erfahrung viele Löschmittel entdeckt; zwischen Löschbarem und Unlöschbarem ist aber ein großer Unterschied; folglich ist das jenseitige Feuer ein anderes als das diesseitige. Ebenso wenn du von einem Wurm hörst (Is. 66, 24), so darfst du wegen des gleichen Namens mit deinen Gedanken nicht auf das irdische Tierlein verfallen. Denn der Zusatz, daß er nicht stirbt, gibt uns sofort die Gewißheit, daß derselbe eine andere Natur habe wie der Wurm auf Erden.</p><p>Da nun dies für das künftige Leben in Aussicht gestellt ist und je nach der freien Willensentscheidung eines jeden gemäß dem gerechten Urteil Gottes in entsprechender Weise dem Erdendasein zuwächst, so wird es der Weise für notwendig erachten, seinen Blick nicht auf die Gegenwart, sondern auf die Zukunft zu richten und in diesem kurzen und hinfälligen Leben den Grund zu unaussprechlicher Seligkeit zu legen und durch einen guten Willen der Berührung mit dem Bösen zu entrinnen, und zwar mit dem Bösen sowohl, wie es jetzt im Leben droht und wie es nachher bei der Wiedervergeltung verhängt wird.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Große Katechese</em> (BKV 1. Reihe, Bd. 56, Kempten/München 1927). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3150/versions/grosse-katechese-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "UXHY_Об_устроении_человека"
    path: "Gregor_Nyssa_Ausstattung_des_Menschen"
    title: "Abhandlung über die Ausstattung des Menschen"
    menu: { parent: "Werke", title: "Abhandlung über die Ausstattung des Menschen", priority: 2 }
    update: true
    body: |-
      <p><em>Abhandlung über die Ausstattung des Menschen, übersetzt von Heinrich Hand (BKV 1. Serie, Bd. 24, Kempten 1874).</em></p><h2>0</h2><p>Wenn man durch Gaben an Hab’ und Gut die durch Tugend sich Auszeichnenden ehren müßte, so würde die ganze Welt der Schätze, wie Salomo sagt, zu klein erscheinen, um deine Tugend aufzuwiegen. Da jedoch größer als nach Reichthums Werth der deiner Ehrwürdigkeit schuldige Dank ist, das heilige Osterfest aber die gewohnte Gabe der Liebe fordert, so bringen wir Deinem Hochsinne ein Geschenk, o Mann Gottes, das zwar geringer ist, als daß es werth wäre, dir dargebracht zu werden, doch gewiß nicht dürftiger als unser Vermögen. Das Geschenk aber ist eine Abhandlung, gleichsam ein dürftiges, aus unserem ärmlichen Denken nicht ohne Mühe gewebtes Kleid; der Stoff der Abhandlung aber wird vielleicht den Meisten als kühn erscheinen, indeß ward er nicht als ungemessen erachtet. Allein nämlich in würdiger Weise hat die Schöpfung Gottes betrachtet der wahrhaft nach Gott geschaffene und an der Seele nach dem Bilde des Schöpfers gestaltete Basilius, unser gemeinsamer Vater und Lehrer, der die erhabene Einrichtung des Alls durch seine Betrachtung der Menge faßlich gemacht hat, indem er die in wahrer Weisheit von Gott gegründete Schöpfung denen erkennbar machte, die durch seine Einsicht zur Betrachtung sich anleiten lassen. Wir aber, obwohl wir ihn nicht einmal nach Gebühr bewundern können, haben dennoch uns vorgenommen, den Betrachtungen des großen Mannes das Fehlende beizufügen, nicht um durch Überbietung seine Arbeit zu entwerthen (denn es wäre auch nicht Recht, jenen erhabenen Mund durch unsere Nachreden zu beschimpfen), sondern damit nicht der Ruhm des Lehrers in seinen Schülern erloschen zu sein scheine. Denn wenn, da in dem „Sechstagewerk“ die Rücksichtnahme auf den Menschen fehlt, keiner seiner Schüler einen Fleiß auf die Ergänzung des Fehlenden verwenden würde, so hätte natürlich gegen seinen großen Ruhm der Tadel eine Angriffswaffe, als habe er seinen Zuhörern keine wissenschaftliche Tüchtigkeit beibringen wollen. Nun aber, wo wir nach Vermögen uns an die Ausführung des Fehlenden wagen, wird, falls in unseren Leistungen Etwas gefunden werden sollte, was seiner Unterweisung nicht unwürdig ist, Dieses jedenfalls auf Rechnung des Lehrers kommen; falls aber an seine großartige Anschauung unsere Darstellung nicht hinanreicht, so wird er zwar von einer solchen Anklage frei sein und dem Tadel, er scheine nicht gewollt zu haben, daß in seinen Schülern etwas Rechtes entstehe, entgehen,* wir* aber dürften mit Recht den Tadelsüchtigen als schuldig erscheinen, als hätten wir in der Kleinheit unseres Herzens die Weisheit des Lehrmeisters nicht gefaßt.</p><p>Es ist aber nicht klein der uns zur Betrachtung vorliegende Gegenstand, noch steht er irgend einem von den Wundern in der Welt nach, ja vielleicht ist er sogar größer als alle, die wir kennen, weil kein anderes unter den Seienden Gott ähnlich geschaffen ist ausser der menschlichen Kreatur. Darum wird von den billig Denkenden unter den Zuhörern uns bereitwillige Nachsicht bei unserem Vortrage zu Theil werden, wenn etwa weit hinter der Gebühr die Rede zurückbleibt. Denn es darf, meine ich, von Allem, was den Menschen betrifft, sowohl von dem, was wir als früher geschehen glauben, als dem, was wir jetzt sehen, als auch dem, was wir als künftig eintretend erwarten, Nichts ununtersucht bleiben. Denn fürwahr als zurückbleibend hinter der Ankündigung würde sich die Arbeit erweisen, wenn, wo der* Mensch* der Betrachtung vorliegt, Etwas von dem zur Sache Gehörigen übergangen würde. Vielmehr auch das, was an ihm als ein entgegengesetzter Zustand erscheint, weil nicht mehr dasselbe mit dem, was am Anfange war, auch jetzt noch an seiner Natur sich zeigt, muß man in einer gewissen nothwendigen Abfolge gemäß der Lehre der Schrift sowohl als der durch Vernunftschlüsse sich ergebenden verknüpfen, damit der ganze Stoff mit sich übereinstimme durch Verbindung und Ordnung, indem die scheinbaren Widersprüche in ein und dasselbe Ziel zusammen treffen, da eben die göttliche Macht Hoffnung erfindet für das, was über Hoffnung ist, und einen Ausweg für das Unmögliche. Der Deutlichkeit wegen aber hielt ich es für gut, die Abhandlung Dir in Kapiteln vorzulegen, damit Du von dem ganzen Werke in Kürze den Inhalt der einzelnen Untersuchungen übersehen könnest.</p><h2>0</h2><p>„Dieß ist das Buch der Entstehung von Himmel und Erde,“ sagt die Schrift, als alles Sichtbare vollendet wurde und jedes der Wesen abgesondert an seinen gehörigen Ort hinging, als der Himmelskörper Alles rings umfing, die schweren und niedersinkenden Körper, Erde und Wasser, in wechselseitigem Festhalten den Mittelraum des Alls einnahmen und zum Verband und Bestand des Gewordenen die göttliche Kunst und Kraft in die Natur der Wesen niedergelegt wurde, mit zweifacher Thätigkeit Alles lenkend. Durch Stillstand nämlich und Bewegung bewirkte sie dem Nichtseienden die Entstehung und dem Seienden den Fortbestand, indem sie um das Schwere und Unverrückbare der unbewegten Natur, wie um eine feste Achse, die blitzschnelle Bewegung der Himmelskugel einem Rade ähnlich kreisen ließ und beiden durch einander Unauflösbarkeit sicherte, indem sowohl die kreisende Substanz durch ihre schnelle Bewegung den Ball der Erde rings zusammendrängt, als auch das Dichte und Unnachgiebige durch seine unverrückbare Festigkeit den Wirbel der Kreisläufer ununterbrochen anspannt. Gleich aber beiderseits wurde bei den durch ihre Thätigkeiten geschiedenen Theilen die Überbietung gemacht, sowohl in der standfesten Natur als in dem rastlosen Umkreise; denn weder weicht die Erde von ihrem Standort, noch gibt je der Himmel seine Hast auf und läßt nach in seiner Bewegung.</p><p>Das aber ward auch zuerst gemäß der Weisheit des Schöpfers gleichsam als ein Anfang des ganzen Werkes* vor* den Dingen geschaffen, indem meines Erachtens der große Moses dadurch, daß er sagt, am Anfange sei der Himmel und die Erde von Gott geschaffen worden, anzeigt, von Bewegung und Stillstand ausgegangen sei alles in der Schöpfung Erscheinende, nach dem göttlichen Willen zur Existenz gebracht. Indem also der Himmel und die Erde durch ihre Thätigkeiten in diametralem Gegensatze zu einander stehen, bildet die* zwischen* den Gegensätzen befindliche Schöpfung, die theilweise an dem nebenan Liegenden Theil hat, durch sich die Vermittlung der Extreme, damit offenbar werde die wechselseitige Verknüpfung der Gegensätze durch das Mittlere. Denn der steten Bewegtheit und Feinheit der Feuersubstanz ähnelt gewissermaßen die Luft, sowohl in der Leichtigkeit ihrer Natur als in ihrer Beweglichkeit. Gleichwohl ist sie nicht derartig, daß sie der Verwandtschaft mit dem Festen entfremdet wäre, indem sie weder stets unbewegt bleibt, noch durchaus verfließt und verfliegt, sondern durch ihre Verwandtschaft mit beiden ist sie eine Art Grenzgebiet zwischen dem Gegensatze der Thätigkeiten, indem sie durch sich zugleich verbindet und trennt das von Natur Geschiedene. Auf dieselbe Weise schließt sich auch die nasse Substanz durch zweifache Eigenschaften an beiderlei Gegensätze an. Denn durch ihre Schwere und ihren Zug nach unten hat sie eine große Verwandtschaft mit dem Erdartigen, durch ihren Antheil aber an einer gewissen fließenden und unstäten Thätigkeit ist sie dem nicht ganz fremd, was von beweglicher Natur ist, sondern auch hiedurch findet eine gewisse Verbindung und Vereinigung der Gegensätze statt, indem die Schwere in Bewegung übergeht und die Bewegung in der Schwere kein Hinderniß findet, so daß das von Natur extremst auseinander Liegende mit einander zusammen kommt, durch die Mittelglieder gegenseitig vereint. Ja sogar bei genauer Betrachtung bleibt nicht einmal die Natur des Gegentheiligen selbst in ihren Eigenheiten ganz unvermischt gegen die andere, damit, glaub’ ich, alles in der Welt Erscheinende sich gegen einander neige und die in den Eigenheiten der Gegensätze sich darstellende Schöpfung mit sich selbst zusammenstimme. Da nämlich die Bewegung nicht bloß in der Ortsveränderung besteht, sondern auch in Wechsel und Umwandlung sich zeigt, anderseits aber die unveränderliche Natur die Bewegung durch Umwandlung nicht zuläßt, so hat die Weisheit Gottes die Eigenthümlichkeiten vertauscht und dem stets Bewegten die Unwandelbarkeit, dem Unbewegten aber die Wandelbarkeit verliehen, indem er es mit Vorbedacht vielleicht so ordnete, damit nicht die Eigenthümlichkeit der göttlichen Natur, nämlich die Wandellosigkeit und Unveränderlichkeit, wenn sie an irgend einem von den Schöpfungswesen wahrgenommen würde, bewirke, daß man für Gott halte das Geschöpf. Denn kaum wird das noch die Vermuthung der Göttlichkeit für sich haben, was in Bewegung oder Veränderung begriffen ist. Darum ist die Erde feststehend und nicht wandellos, der Himmel aber umgekehrt, der keinen Wandel hat, hat auch die Ständigkeit nicht, damit, durch Verbindung des Wechsels mit der stillstehenden und der Bewegung mit der unwandelbaren Natur, die göttliche Macht Beide sowohl im Austausch ihrer Eigenheiten mit einander befreunde als auch dem Scheine der Göttlichkeit entrücke. Denn keines von beiden, wie gesagt, wird man für Sache der göttlichen Natur halten, weder das, was nicht feststeht, noch das, was sich ändert.</p><p>Schon also war Alles zu seinem Ende gelangt. Denn vollendet war, wie Moses sagt, der Himmel und die Erde und alles dazwischen Liegende, und mit der entsprechenden Schönheit das Einzelne geschmückt, der Himmel mit den Strahlen der Lichter, Meer und Luft mit den schwimmenden und fliegenden Thieren, die Erde mit den mannigfachen Unterschieden von Gewächsen und Weidevieh, welche sie allesammt, durch den göttlichen Willen dazu befähigt, auf einmal hervorbrachte. Und voll war die Erde von den Jahrzeitfrüchten, indem sie zugleich mit den Blüthen die Früchte trieb, voll waren die Wiesen von Allem, was auf den Wiesen wächst, und alle Riffe und Höhen, und alles Flach- und Hügelland und alle Thalgründe waren mit frisch grünendem Grase und der bunten Pracht der Bäume geschmückt, die soeben aus der Erde sich erhoben, schnell aber zur vollendeten Schönheit emporwuchsen. Lustig aber war Alles, natürlich, und umhersprang das auf Geheiß Gottes zum Leben gelangte Gethier, heerden- und artenweise in den Gebüschen geborgen, von den Liedern aber der Singvögel ertönte allenthalben jeglicher Strauch und Schattenbusch. Der Anblick des Meeres dann war natürlich ein anderer von der Art, indem es sich soeben in den Sammlungen der Höhlen zur Ruhe und Stille niederließ, längs welchem Buchten und Häfen, durch göttlichen Willen von selbst in die Ufer eingehöhlt, das Meer mit dem Festland befreundeten; und die sanften Bewegungen der Wogen wetteiferten mit der Schönheit der Wiesen, indem sie unter leichten und spielenden Lüften auf der oberen Fläche zierlich sich kräuselten — und der gesammte Reichthum der Schöpfung zu Land und zu Wasser war fertig, aber der Nutznießer war nicht.</p><h2>0</h2><p>Noch nicht nämlich war dieses große und werthvolle Wesen, der Mensch, in der Welt der Dinge ansässig. Denn es war auch nicht billig, daß der Herrscher vor den Beherrschten erschien, sondern erst nach Zubereitung des Herrschergebietes war es an der Zeit, daß der König auftrat. Nachdem also gleichsam einen königlichen Aufenthalt für den künftigen König der Schöpfer des Alls zurecht gemacht hatte, — das war aber Erde, Inseln, Meer und der wie ein Dach darüber sich wölbende Himmel, — und nachdem allerlei Reichthum in diesen Königssitz niedergelegt war, — unter Reichthum aber verstehe ich die ganze Schöpfung, was da ist an Pflanzen und Gewächsen, und Alles, was Empfindung und Leben und Seele hat, und, muß man auch die Stoffe zum Reichthum zählen, alle, welche wegen eines gewissen Glanzes den menschlichen Augen als kostbar gelten, wie Gold und Silber, auch den der Steine, nämlich derjenigen, welche die Menschen lieben, — und nachdem er von alle dem einen Überfluß gleich wie in einer königlichen Schatzkammer im Schooße der Erde geborgen hatte, ließ er sodann den Menschen in der Welt erscheinen, um von den Wunderwerken in ihr theils Zeuge zu sein, theils Herr, damit er einerseits durch den Genuß die Erkenntniß des Spenders erlange, anderseits aus der Schönheit und Größe die unaussprechliche und unbeschreibliche Macht des Schöpfers erspüre. Darum wurde zum Schluß nach der Schöpfung der Mensch eingeführt, nicht als verächtlich unter das Letzte hingeworfen, sondern als gewürdigt, gleich bei seiner Entstehung König des ihm Untergebenen zu sein. Und wie ein guter Wirth nicht vor der Zubereitung der Speisen den Gast in sein Haus führt, sondern erst, wenn er Alles geziemend zubereitet und mit dem gehörigen Schmucke das Haus, das Lehnpolster, den Tisch geziert hat und das zur Nahrung Dienende bereits fertig ist, den zu Gast Geladenen in sein Haus aufnimmt, auf dieselbe Weise führt der reiche und freigebige Bewirther unserer Natur, nachdem er mit allen möglichen Zierden die Wohnung geschmückt und dieses große und aufwandvolle allgemeine Gastmahl zubereitet hat, da erst den Menschen ein, zur Arbeit ihm gebend nicht den Erwerb des noch nicht Vorhandenen, sondern den Genuß des Gegenwärtigen. Darum legt er auch zweierlei Naturanlagen in ihn, in das Irdische das Göttliche mischend, damit er durch beide für beiderlei Genuß befähigt und empfänglich sei, Gottes genießend durch die gottverwandte Natur, der irdischen Güter aber durch die gleichartige Sinnesempfindung.</p><h2>0</h2><p>Es verdient aber auch das nicht unbeachtet zu bleiben, daß, als die so herrliche Welt und die Theile in ihr elementarisch zum Aufbau des Alls festgestellt wurden, die Schöpfung von der göttlichen Macht gewissermaßen improvisirt wird und sofort mit dem Befehle dasteht, der Ausstattung des Menschen aber eine Berathung vorangeht und von dem Künstler das, was werden soll, durch das Wort vorher beschrieben wird, und, wie es beschaffen sein, mit welchem Urbild es Ähnlichkeit haben, wozu es werden, was es nach dem Werden wirken, und worüber es herrschen solle, das Alles das* Wort* vorher überlegt, damit derselbe schon vor seiner Erschaffung den Vorrang erhalte und noch vor seinem Eintritt in das Sein die Herrschaft über das Seiende bekomme. Denn es sprach Gott, heißt es: „Laßt uns den Menschen machen nach unserem Bilde und Gleichnisse, und sie sollen herrschen über die Fische des Meeres und die Thiere der Erde und die Vögel des Himmels und die Haustiere und über die ganze Erde.“ O des Wunders! Die Sonne wird erschaffen, und keine Berathung geht voraus, ebenso der Himmel, welchen beiden Nichts in der Schöpfung gleich kommt; durch einen bloßen Ausspruch wird dieses Wunder hergestellt, ohne daß das* Wort* andeutet, woher oder wie oder sonst etwas dergleichen. So wird auch alles Einzelne, Äther, Gestirne, die Luft in der Mitte, Meer, Erde, Thiere, Pflanzen, Alles durch ein Wort zur Entstehung gebracht. Bloß zur Erschaffung des Menschen schreitet der Schöpfer des Alls überlegungsweise, um ihm sowohl einen Stoff des Bestehens zu bereiten als seine Form einer gewissen urbildlichen Schönheit ähnlich zu machen, als auch das vorgesteckte Ziel, weßwegen er werden soll, für ihn passend und angemessen den Thätigkeiten seine Natur zu machen, tauglich zu seiner Bestimmung.</p><h2>0</h2><p>Gleichwie nämlich in diesem Leben von den Künstlern das Werkzeug dem Gebrauch entsprechend geformt wird, so hat als ein zur Herrscherthätigkeit taugliches Rüstzeug der höchste Künstler unsere Natur geschaffen, indem er durch die Vorzüge an der Seele und sogar durch die Gestalt des Leibes es derartig ausstattete, daß es tauglich ist zur Herrschaft. Denn die Seele zeigt ihre von der gemeinen Niedrigkeit geschiedene königliche Würde und Erhabenheit sogleich darin, daß sie unabhängig ist und selbständig, nach eigenen Entschlüssen selbstmächtig waltend. Denn wessen sonst ist Dieß und nicht eines Königs? Und noch dazu die Ebenbildlichkeit mit der über Alles herrschenden Natur besteht in nichts Anderem, als daß unsere Natur sogleich als Königin geschaffen wurde. Denn wie nach menschlichem Brauch die Verfertiger der Fürsten-Bilder sowohl den Charakter der Gestalt nachahmen als auch durch den Umwurf des Purpurs die königliche Würde mit andeuten und gewöhnlich auch das Bild König genannt wird, so ward auch die menschliche Natur, da sie zur Herrschaft über das Andere ausgestattet wurde, durch ihre Ähnlichkeit mit dem König des Alls, als ein lebendiges Bild aufgestellt, das mit dem Urbild sowohl die Würde als den Namen gemein hat. Zwar trägt sie keinen Purpur, noch deutet sie durch Scepter und Diadem ihre Würde an (auch das Urbild hat ja das nicht), aber statt des Purpurs ist sie mit der Tugend bekleidet, was wohl von allen Gewändern das königlichste ist, statt des Scepters stützt sie sich auf die Seligkeit der Unsterblichkeit, und statt des königlichen Diadems ist sie mit der Krone der Gerechtigkeit geschmückt. So zeigt sie sich durchaus in der Würde des Königthums, als genaue Nachahmung der urbildlichen Schönheit.</p><h2>0</h2><p>Die göttliche Schönheit aber prangt eben nicht in einem Schmuck und Glücksloos der Gestalt durch ein gewisses Wohlaussehen, sondern besteht in unaussprechlicher Glückseligkeit der Vollkommenheit. Gleichwie nun die Maler die menschlichen Gestalten mittelst Farben auf die Tafeln übertragen, indem sie die gehörigen und entsprechenden Tinten auf das Portrait pinseln, damit die urbildliche Schönheit genau übergetragen werde auf das Abbild, so, denke mir, habe auch unser Bildner wie mit Farben mit dem Umwurf der Tugenden nach der eigenen Schönheit das Bild umblümt und so an uns dargestellt seine eigene Hoheit. Vielartig aber und mannigfach sind die gleichsam-Farben des Bildes, durch welche die wahrhaftige Gestalt abgemalt ist, nicht Röthe und Helle und die wie immer beschaffene Verbindung dieser mit einander, noch ein Braue und Aug’ untermalender und mischungsweise die Vertiefungen des Bildes schattirender Auftrag von Schwärze, und was immer dergleichen die Hände der Maler dazuzukünsteln pflegen, sondern statt dessen Reinheit, Leidlosigkeit, Glückseligkeit, Freiheit von allem Bösen und was immer von solcher Art ist, wodurch den Menschen die Gottähnlichkeit gestaltet wird. Mit solcher Farbenpracht hat der Verfertiger seines eigenen Bildes unsere Natur gemalt. Forschest du aber auch nach dem Übrigen, wodurch die göttliche Schönheit ausgedrückt wird, so wirst du auch in Bezug auf dieses in dem Bild an uns die Ähnlichkeit genau bewahrt finden. Geist und Vernunft (=Wort) ist die Gottheit; denn „im Anfange war das Wort,“ und die nach Paulus „haben Christi Geist, der in ihnen redet.“ Nicht fern von Diesen ist auch das Menschenwesen. Du siehst in dir die Vernunft und den Denkgeist, ein Abbild des Ur-Geistes und Wortes. — Liebe hinwieder ist Gott und Liebesquelle; denn so sagt der große Johannes: „Die Liebe ist aus Gott, und Gott ist die Liebe.“ Das hat auch zu unserem Gesichtsausdrucke gemacht der Bildner unserer Natur. Denn „daran“, sagt er, „sollen Alle erkennen, daß ihr meine Jünger seid, wenn ihr einander liebet.“ Ist also diese nicht da, so ist der ganze Charakter des Bildes verändert. — Alles sieht und Alles hört die Gottheit, und Alles durchforscht sie. Auch du hast die Wahrnehmung der Dinge durch Gesicht und Gehör und die die Dinge untersuchende und durchforschende Denkkraft.</p><h2>0</h2><p>Und Niemand meine, als sagte ich, nach Art der menschlichen Thätigkeit durch verschiedene Vermögen erfasse die Gottheit das Seiende. Denn es ist nicht möglich, in der Einfachheit des göttlichen Wesens eine Mannigfaltigkeit und Vielfachheit der aussagenden Thätigkeit zu bemerken. Denn nicht einmal bei uns sind vielfach die die Thatsachen (Dinge) auffassenden Kräfte, wenn wir auch auf vielfache* Weise* durch die Sinne das Wirkliche erfassen. Denn eine einzige Kraft ist es, der inwohnende Geist selbst, der durch jedes der Sinneswerkzeuge hindurchdringt und die Dinge ergreift.* Dieser* beschaut durch die Augen das Erscheinende, dieser vernimmt durch das Gehör das Gesprochene, liebt das Erwünschte und flieht das Unangenehme und bedient sich der Hand, wozu er will, indem er durch sie ergreift und zurück stößt, je nachdem er es für gut findet, die Mithilfe des Werkzeuges hiezu gebrauchend. Wenn also beim Menschen, wiewohl da verschieden sind die von der Natur zur Wahrnehmung eingerichteten Organe, der in allen Wirkende und Bewegte und ein jedes in entsprechender Weise zu dem, was vorliegt, Gebrauchende Einer und Derselbe ist, der mit den Unterschieden der Thätigkeiten nicht zugleich seine Natur ändert, wie sollte Jemand bei Gott wegen seiner mannigfaltigen Kräfte eine Vieltheiligkeit des Wesens vermuthen? Denn der das Auge gebildet hat, wie der Prophet sagt, und das Ohr gepflanzt, hat nach den Mustern in ihm selbst diese Kräfte gleich wie Erkennungszeichen der Natur der Menschen eingeprägt. Denn „laßt uns“, sagt er, „den Menschen machen nach unserem Bilde.“ Aber wo ist mir die Häresie der Anomöer? Was werden sie zu diesem Ausspruche sagen? Wie werden sie in diesen Worten die Nichtigkeit ihrer Lehre retten? Werden sie etwa sagen, es sei möglich, daß* sein* Bild* verschiedenen* Gestalten ähnlich gemacht wurde? Wenn der Sohn der Natur nach dem Vater unähnlich ist, wie schafft er dann als ein einziges das Abbild der verschiedenen Naturen? Denn der sprach: „Laßt uns (den Menschen) machen nach* unserem* Bilde“ und durch die Mehrheitsbezeichnung die heilige Dreiheit zu erkennen gab, hätte nicht des Abbildes in der Einheit gedacht, wenn unähnlich wären unter einander die Urbilder. Es war ja gar nicht möglich, von den einander nicht Gleichenden* ein* Gleichbild herzustellen, sondern, wenn verschieden waren die Naturen, dann machte er verschieden jedenfalls auch deren Abbilder, das einer jeden entsprechende schaffend. Allein wenn Eines ist das Abbild, nicht Eines aber das Urbild des Abbildes, wer ist so ohne Verstand, um nicht einzusehen, daß die dem Einem Ähnlichen jedenfalls auch unter einander ähnlich sind. Darum sagt, um gleich bei der Schöpfung des menschlichen Lebens diese Lästerung abzuschneiden, das Wort: „Laßt uns den Menschen machen nach unserem Bilde und Gleichnisse.“</p><h2>0</h2><p>Allein was will das Aufrechte der Gestalt? und warum sind die Kräfte zum Leben dem Körper nicht angeboren, sondern wird entblößt der natürlichen Bedeckungen, wehrlos und arm und alles Nothdürftigen ermangelnd, der Mensch in’s Leben gesetzt, der Erbarmung vielmehr als der Seligpreisung werth, wie es scheint? Nicht mit Sprossen von Hörnern ist er bewaffnet, nicht mit Krallenspitzen, nicht mit Hufen oder Hauzähnen oder einem von Natur tödtliches Gift enthaltenden Stachel, dergleichen doch die Mehrzahl der Thiere zur Abwehr der Verfolger besitzt, nicht mit einer Hülle von Haaren ist sein Leib bedeckt. Und doch sollte füglich der zur Herrschaft über die Andern Bestimmte von der Natur mit eigenthümlichen Waffen bewehrt sein, damit er zur eigenen Sicherheit nicht fremden Beistandes bedürfe. Nun aber haben Löwe, Eber, Tiger, Panther und andre dergleichen eine zu ihrer Sicherheit ausreichende Kraft, und dem Stier ist das Horn, dem Hasen die Schnelligkeit, dem Rehe die Sprungkraft und die Sicherheit des Auges, einem andern Thiere die Größe, anderen der Rüssel, den Vögeln der Fittig, der Biene der Stachel und allen überhaupt Etwas zur Schutzwehr von Natur aus angeboren. Einzig dagegen von allen der Mensch ist in Vergleich mit den schnellläufigen langsamer, mit den fleischreichen kleiner, mit den durch angeborne Waffen geschützten leichter besiegbar; und wie, wird man fragen, hat der so Beschaffene die Herrschaft über Alle bekommen? Allein es ist, glaub’ ich, nicht schwer, zu zeigen, daß die scheinbare Dürftigkeit unserer Natur der Anlaß zur Herrschaft über das Unterworfene ist. Denn hätte der Mensch eine solche Kraft, daß er an Schnelligkeit das Pferd überliefe und einen durch Festigkeit unaufreibbaren, mit Hufen und Klauen versehenen Fuß hätte und Hörner und Stachel und Krallen an sich trüge, so wäre er erstens thierisch und widrig, wenn derlei seinem Körper angewachsen wäre, sodann aber würde er sich um die Herrschaft über die andern nichts kümmern, da er der Beihilfe der Unterthanen nicht bedürfte. Nun aber sind die Lebensdienste deßwegen auf die einzelnen uns unterworfenen Wesen vertheilt worden, um die Herrschaft über sie nothwendig zu machen. Die Langsamkeit nämlich und Schwerbeweglichkeit unseres Körpers verwendete das Pferd zum Dienste und zähmte es, die Nacktheit unseres Fleisches aber machte die Schafzucht nöthig, die aus dem jährlichen Ertrag der Wolle den Mangel unserer Natur ergänzt. Die Einfuhr der Lebensmittel zu uns auch aus der Fremde unterwarf die Lastträger unter den Thieren diesen Dienstleistungen. Ferner, daß wir nicht nach Art der Weidethiere Gras fressen können, machte den Ochsen dem Leben dienstbar, der durch seine Arbeiten uns den Lebensunterhalt gewinnen hilft. Da wir aber auch Zähne und Gebiß brauchten, um irgend eines der anderen Thiere zu bewältigen durch den Angriff der Zähne, so lieh der Hund nebst der Schnelligkeit seinen Kinnbacken unserem Bedarfe, indem er gleichsam ein lebendiges Messer für den Menschen ist. In Vergleich mit Hörnerwehr aber und Krallenspitze als stärker und schärfer ward von den Menschen das Eisen erfunden, das uns nicht auf immer angewachsen ist, wie jene den Thieren, sondern nach zeitweiliger Kampfeshilfe im Übrigen für sich bleibt. Und statt des Krokodil-Panzers kann auch er sich diese Rüstung machen, indem er zeitweilig das Lederwamms anlegt; oder, wenn das nicht, so wird auch hiezu durch die Kunst das Eisen geformt, welches, nachdem es zeitweilig zum Kriege gedient, im Frieden den Gewappneten von der Last wieder frei läßt. Es dient aber dem Leben auch die Schwinge der Vögel, so daß wir erfinderisch auch der Flugschnelligkeit nicht entbehren. Denn einige von ihnen werden gezähmt und sind den Jägern behilflich, andere aber werden erfindsam durch jene unseren Bedürfnissen zugeführt, ja sogar die Pfeile hat erfinderisch die Kunst uns befiedert, und schenkt durch den Bogen unseren Bedürfnissen die Flugschnelligkeit. Daß aber unsere Fußsohlen empfindlich sind und leicht aufreiblich im Marsche, macht die Beihilfe von Seite der uns untergebenen Dinge nöthig; denn daher kommt es, daß wir den Füßen die Schuhe anpassen.</p><h2>0</h2><p>Aufrecht aber ist die Gestalt des Menschen und zum Himmel gerichtet, und in die Höhe blickt er. Fürstlich ist auch Dieß und ein Abzeichen der königlichen Würde. Denn daß allein unter den Geschöpfen der Mensch so beschaffen ist, allen anderen aber die Leiber nach unten sich neigen, zeigt deutlich den Rangunterschied zwischen den der Herrschaft Unterwürfigen und der über ihnen stehenden Herrschermacht. Bei allen andern nämlich sind die Vorderglieder Füße, weil das Gebeugte durchaus der Stütze bedurfte, bei der Ausstattung des Menschen aber sind diese Glieder Hände geworden; denn bei der aufrechten Gestalt genügte zum Bedarfe* eine* Basis, die durch zwei Füße ein sicheres Stehen verleiht. Übrigens aber auch dem Gebrauche des Wortes ist der Dienst der Hände behilflich, und wer den Dienst der Hände für eine Eigenheit der sprachbegabten (=vernünftigen) Natur erklärt, wird nicht ganz Unrecht haben, nicht bloß im Hinblick auf jenes Bekannte und Alltägliche, daß wir durch das Geschick der Hände das Wort mit Schriftzeichen andeuten; denn es ist wohl auch Dieß nicht ohne Antheil an der Gabe des Wortes, daß wir schriftlich sprechen und gewissermaßen mit der Hand reden, indem wir durch die Züge der Buchstaben die Worte bewahren: — sondern in anderer Hinsicht nenne ich die Hände der Aussprache des Wortes behilflich. Vielmehr aber, bevor wir Dieß genauer erforschen, wollen wir den vorgesetzten Gegenstand erwägen (denn beinahe wäre uns das Ordnungsgemäße der Entwicklung entgangen), warum nämlich vorausgeht das Sprossen der Erdgewächse, hernach aber die unvernünftigen Thiere kommen, und erst nach der Erschaffung von diesen der Mensch. Vielleicht nämlich lernen wir hiedurch nicht bloß das zunächst zu Denkende, daß dem Schöpfer für die Thiere das Gras als dienlich erschien, für den Menschen aber das Vieh, weßhalb vor den Weidethieren ihre Nahrung, vor dem Menschen aber das der menschlichen Lebsucht dienen Sollende kam, — sondern mir scheint hiedurch Moses eine der verborgenen Lehren anzudeuten und die Philosophie über die Seele geheimnißweise vorzutragen, von der zwar auch die heidnische Wissenschaft einen Schein hatte, die sie jedoch nicht hellklar einsah. Es lehrt nämlich, glaube ich, hiedurch das Wort, daß in* drei* Unterschieden die belebende und beseelende Kraft sich darstelle. Denn die eine ist nur mehrsam und nährsam, zur Zunahme des Ernährlichen das Entsprechende beitragend, welche wachsthümlich heißt und an den Gewächsen sich zeigt; denn es ist auch an dem, was wächst, eine gewisse, der Empfindung untheilhafte Lebenskraft zu bemerken. Eine andere Art aber von Leben ausserdem ist die, welche sowohl Dieß hat als auch das Empfindungsgeschäft dazu bekam, die in der Natur der Thiere ist; denn sie nährt sich nicht bloß und mehrt sich, sondern hat auch Sinnesthätigkeit und Empfindung. Das vollkommene leibhafte Leben aber erblickt man in der vernünftigen, nämlich der menschlichen Natur, das sowohl sich nährt und empfindet als auch am Worte (der Vernunft) Theil hat und mit Verstand waltet. Wir könnten aber die Eintheilung des in Rede stehenden Gegenstandes etwa so machen: Von dem Seienden ist jedenfalls das Eine* geistig,* das Andere aber* körperlich.* Indeß vom Geistigen mag für jetzt die Zerlegung in die Arten beiseit bleiben, denn davon ist nicht die Rede. Von dem Körperlichen aber hat das Eine gar* kein Leben,* das Andere aber besitzt* Lebensthätigkeit.* Von den lebendigen Körpern ferner leben die einen mit* Empfindung,* die andern aber sind * empfindungslos.* Das Empfindungsfähige dann theilt sich wieder in* Vernünftiges* und* Unvernünftiges.* Darum läßt unmittelbar nach der leblosen Materie gleichsam als Grundlage der Gattung der beseelten Wesen der Gesetzgeber dieses pflanzliche Leben gegründet worden sein, welches vorerst in dem Wachsthum der Pflanzen besteht. Dann erst führt er die Entstehung der Empfindungsfähigen auf; und da nach derselben Reihenfolge von den mit fleischlichem Leben Begabten die Empfindsamen an sich auch ohne die geistige Natur sein können, das Vernünftige aber wohl nicht anders in einem Körper sein kann, als in Verbindung mit dem Empfindsamen, darum wurde zuletzt* nach* den Pflanzen und den Thieren der Mensch geschaffen, indem in geordnetem Stufengang die Natur zum Vollkommenen fortschritt. Denn aus jeder Gattung der Seelen zusammen gemischt ist dieses vernünftige Lebewesen, der Mensch. Er nährt sich nämlich nach Art der Pflanzenseele, zur Wachskraft aber kam die empfindende hinzu, die ihrer Natur nach in der Mitte steht zwischen der denkfähigen und der mehr stofflichen Wesenheit, und um so gröber ist denn die erstere als reiner denn die letztere. Dann kommt eine Vermählung und Vereinigung der denkfähigen Wesenheit mit dem Feinen und Lichtartigen der empfindungsfähigen Natur, so daß in diesen Dreien der Mensch seinen Bestand hat, wie wir Solches auch von dem Apostel lernen in dem, was er zu den Ephesiern sagte, wo er fleht, es möge ihnen die vollständige Gnade an Leib, Seele und Geist bei der Erscheinung des Herrn bewahrt werden, indem er statt des ernährlichen Theils den* Leib* nennt, den empfindsamen aber durch die* Seele* andeutet und den denkfähigen durch den* Geist.* Ebenso lehrt auch den Schriftkundigen durch das Evangelium der Herr, höher als jedes Gebot zu stellen die Liebe zu Gott, aus ganzem Herzen, aus ganzer Seele und aus ganzem Gemüthe. Denn auch hier scheint mir das Wort den nämlichen Unterschied zu erklären, indem es den mehr körperlichen Bestandtheil Herz nennt, Seele aber den mittleren, und Gemüth die höhere Natur, die Denk- und Besinnungskraft. Daher kennt der Apostel auch dreierlei Arten von Bestrebungen, die fleischliche, wie er sie nennt, welche dem Bauche und den einschlägigen Wollüsten fröhnt, die seelische, welche mitten inne steht zwischen Tugend und Laster, über dieses zwar erhoben, an jener aber nicht ausschließlich Theil habend, und die geistige, welche das Vollkommene des Gott-gemäßen Wandels im Auge hat. Darum sagt er zu den Korinthern, ihre Genußsucht und Leidenschaftlichkeit schmähend: „Ihr seid fleischlich und der vollkommeneren Lehren unempfänglich;“ anderswo aber einen Vergleich zwischen dem Mittleren und dem Vollkommenen ziehend, sagt er: „Der seelische Mensch faßt nicht, was des Geistes ist, denn es ist ihm Thorheit; der Geistige aber richtet zwar Alles, er selbst aber wird von Niemand gerichtet.“ Wie also der Seelische das Fleischliche überragt, so steht in gleicher Weise der Geistige über diesem. Wenn also zuletzt nach allem Beseelten die Schrift den Menschen entstanden sein läßt, so trägt der Gesetzgeber nichts Anderes als eine Philosophie über die Seele uns vor, indem er nach einer nothwendigen Reihenfolge das Vollkommene in dem, was zuletzt kommt, sieht. Denn in dem Vernünftigen ist auch das Übrige inbegriffen, in dem Empfindsamen aber ist durchaus auch das Pflanzenartige; dieses aber zeigt sich nur am Stofflichen. Demnach macht allerdings die Natur schrittweise, d. h. durch die Lebens-Eigenthümlichkeiten hindurch, einen Fortschritt vom Geringeren zum Vollkommenen.</p><p>Da also der Mensch ein vernünftiges (sprachfähiges) Lebewesen ist, so mußte das Werkzeug des Leibes für den Gebrauch der Sprache tauglich eingerichtet werden. Wie man bei den Musikern sehen kann, daß sie je nach der Art ihrer Instrumente die Musik betreiben und weder auf Leiern flöten, noch auf Flöten leiern, auf dieselbe Weise mußte die Einrichtung der Organe für das Wort (die Sprache) geeignet sein, damit es, je nach dem Bedarfe der Wörter, von den Stimmorganen gebildet, in gehöriger Weise ertöne. Darum wurden dem Körper die* Hände* beigefügt. Denn wenn man auch zehntausend Dienste für’s Leben aufzählen kann, wozu diese geschickten und vielleistenden Werkzeuge der Hände dienlich sind, die bei jeder Kunst und Thätigkeit in Krieg und Frieden geschäftig mitthun, so hat aber doch vorzugsweise des Wortes wegen die Natur sie dem Körper verliehen. Denn wenn der Mensch die Hände nicht hätte, so wären ihm gewiß nach Art der Vierfüßer, dem Nahrungs-Bedürfniß entsprechend, die Theile seines Gesichts eingerichtet worden, so daß dessen Gestalt vorgestreckt sein und zu Schnauzen sich zuspitzen und die Lippen des Mundes hervorragen würden wulstig, ungelenk und grob, um zum Rupfen des Grases geschickt zu sein; inner den Zähnen aber läge eine andere Zunge, etwa fleischig, zäh und rauh, und zugleich mit den Zähnen das unter das Gebiß Gekommene verarbeitend, oder schlüpfrig und hin und her schlappend, wie die der Hunde und der übrigen Fleischfresser ist, die in dem Gezack der Zähne zwischen den Abständen sich schlängelt. Fehlten also dem Leibe die Hände, wie würde dann in ihm eine artikulirte Stimme gebildet, da ja die Einrichtung der Mundtheile nicht für den Dienst des Lautes gestaltet wäre? Es müßte daher der Mensch jedenfalls entweder blöcken oder mäckern oder bellen oder wiehern, oder Ochsen und Eseln ähnlich schreien, oder ein anderes thierisches Gebrüll ausstoßen. Nun aber, da die Hand dem Leibe eingefügt ist, hat der Mund Muße zum Dienste des Wortes. Sonach haben als eine Eigenthümlichkeit der sprachfähigen Natur sich die Hände erwiesen, indem so der Schöpfer durch sie der Sprache die Leichtigkeit erfand.</p><h2>0</h2><p>Da also der Schöpfer unserem Gebilde eine göttliche Schönheit verlieh, indem er die Nachahmungen seiner eigenen Vollkommenheiten in das Ebenbild legte, hat er dadurch zwar die übrigen Güter aus Großmuth der menschlichen Natur geschenkt, Geist und Erkenntniß aber hat er, man kann eigentlich nicht sagen ihr geschenkt, sondern sie daran Theil nehmen lassen, indem er den eigenthümlichen Schmuck seiner eigenen Natur dem Ebenbilde verlieh. Da nun der Geist etwas Denkendes und Unkörperliches ist, so hätte er eine unmittheilsame und ungesellige Schönheit, wenn nicht durch eine sinnige Erfindung seine Thätigkeit kund würde. Darum bedurfte er dieser organischen Ausstattung, um wie ein Plektrum die Stimmorgane betastend durch die so oder so beschaffene Gestaltung der Töne die innere Thätigkeit zum Ausdruck zu bringen. Und wie ein Musikkundiger, wenn er in Folge eines Leidens keine eigene Stimme hat, aber doch seine Kunst an den Tag legen will, mit fremden Stimmen melodirt, indem er durch Flöten und Leier seine Kunst veröffentlicht, so bedient sich auch der menschliche Geist, als Erfinder von allerlei Gedanken, weil er den durch Sinnesempfindungen Vernehmenden durch die bloße Seele die Gedanken nicht zeigen kann, wie ein geschickter Künstler, dieser lebendigen Organe und macht durch den in ihnen enthaltenen Klang die verborgenen Gedanken kund. Gemischt aber ist die Musik beim menschlichen Organ gewissermaßen aus Flöte und Leier, die wie bei einer Harmonie in eins zusammen tönen. Denn der von den Athmungsgefäßen durch die Luftröhre heraufgetriebene Odem, der, wenn das Bestreben des Sprechenden den Theil zur Stimme anspannt, an die inneren Wände anstößt, die ringsum diesen flötenartigen Durchgang einschließen, ahmt gewissermaßen den durch die* Flöte* entstehenden Ton nach, indem er durch die häutigen Hervorragungen im Kreise herumgetrieben wird. Der Gaumen aber nimmt den von unten herkommenden Laut in seine Höhlung auf, in die zwei zur Nase führenden Vorhöfe, und indem er durch plättchenartige Hervorragungen, den Siebbeinknorpeln, die Stimme zertheilt, macht er den Ton heller. Wange aber und Zunge und der Bau der Kehle, wonach das Kinn in eine Wölbung übergeht und spitzig ausläuft, all’ diese Dinge stellen verschieden und mannigfach die Bewegung des Plektrums in den* Saiten* vor, indem sie rechtzeitig mit großer Schnelligkeit je nach Bedürfniß die Töne modificiren. Das Öffnen und Schließen der Lippen aber bewirkt dasselbe, wie wenn man mit den Fingern den Hauch der Flöte je nach der Harmonie des Liedes anhält.</p><h2>0</h2><p>Indem also auf solche Art der Geist durch diese organische Einrichtung in uns die Sprache musikmeistert, sind wir redende Wesen, während wir, wie ich glaube, die Gabe der Sprache nicht hätten, wenn wir die Last und Mühe des Nahrungserwerbes für das Bedürfniß des Leibes mit den Lippen besorgen müßten. Nun aber haben diese Leistung die Hände auf sich genommen und so geeignet für den Dienst des Wortes den Mund gelassen. Zweifach aber ist die Thätigkeit des Organs, die eine zur Hervorbringung des Tones, die andere zur Aufnahme fremder Gedanken. Und es vermengt sich nicht die eine mit der anderen, sondern bleibt bei dem Geschäfte, wozu die Natur sie bestellte, ohne Beeinträchtigung der Nachbarin, da weder das Gehör redet noch die Stimme hört. Denn die eine gibt immer nur Etwas von sich, das Gehör aber nimmt fortwährend auf und wird doch nicht satt, wie Salomo irgendwo sagt; und gerade das scheint mir auch am meisten bewunderungswürdig zu sein an uns, wie geräumig jenes innere Behältniß ist, in welches alles durch das* Gehör* Einströmende zusammen fließt, wer die Aufschreiber der in dasselbe eingeführten Reden sind, und wie beschaffen die Behältnisse der in’s Gehör eingelegten Gedanken, und wie, da doch Vieles und Allerlei auf einander gehäuft wird, doch keine Vermischung und Verwechslung in der Aufeinanderlage der Aufbewahrungsgegenstände entsteht. Ebenso dürfte man sich wohl auch über die Thätigkeit des* Gesichtes* wundern. Denn auf gleiche Weise erfaßt auch hiedurch der Geist das ausser dem Körper Befindliche und zieht die Bilder der Erscheinungen an sich, indem er die Merkmale des Gesehenen in sich abzeichnet. Und wie bei einer geräumigen Stadt, welche von verschiedenen Zugängen her die in sie Einströmenden aufnimmt, nicht allesammt auf den nämlichen Platz in der Stadt zusammenlaufen, sondern die Einen auf den Markt, die Andern in die Häuser, Andere in die Kirchen oder Strassen und Gäßchen oder in die Theater dahingehen, ein Jeder nach seiner Absicht, als eine solche betrachte ich auch die in unserem Innern angelegte Stadt des Geistes, welche die verschiedenen Zugänge durch die Sinne voll machen, während prüfend und forschend der Geist jeden der Eintretenden an den entsprechenden Erkenntnißorten unterbringt. Und wie es bei dem Beispiele von der Stadt ist, daß oft Landsleute und Verwandte nicht durch das nämliche Thor hineinkamen, indem der Eine auf diesem, der Andere auf einem andern Wege nach Zufall hineinging, nichts desto weniger aber innerhalb der Ringmauer sie wieder beisammen sind, als Bekannte, und wie auch der umgekehrte Fall stattfinden kann, daß nämlich Fremde und einander Unbekannte oft denselben Weg in die Stadt nehmen und die Wegesgemeinschaft sie doch nicht an einander knüpft (denn sie können sich ja auch drinnen nach der Landsmannschaft scheiden), etwas Ähnliches erblicke ich auch in der Weiträumigkeit des Geistes. Denn oft wird auch durch verschiedene Sinne uns* eine* Erkenntniß versammelt, indem derselbe Gegenstand mehrheitlich sich auf die Sinne vertheilt. Umgekehrt aber wieder kann man durch eine einzige Wahrnehmung Vieles und Mancherlei inne werden, was seiner Natur nach Nichts mit einander gemein hat. Z. B. (denn es ist besser, an einem Beispiele die Sache zu verdeutlichen) es liege etwas Geschmacksthümliches zu untersuchen vor, was nämlich süß schmecke, und was widerwärtig beim Kosten sei. Nun findet man durch den Versuch sowohl die Bitterkeit der Galle als die Annehmlichkeit des Honigs. Während aber diese verschieden sind, bewirkt von demselben Ding, auch wenn es in getheilter Weise in das Bewußtsein einzieht — der Geschmack, der Geruch, das Gehör, oft aber auch das Gefühl und das Gesicht eine einzige Erkenntniß. Denn sowohl wenn man den Honig sieht, als den Namen hört, und davon kostet und den Duft riecht und ihn betastet, erkennt man durch jedes der Sinneswerkzeuge dieselbe Sache. Dagegen nehmen wir wieder Vielerlei und Verschiedenartiges durch einen einzigen Sinn wahr, indem das Gehör mancherlei Stimmen aufnimmt und die Wahrnehmung durch die Augen unterschiedslos ihre Thätigkeit übt beim Sehen von Verschiedenartigem. Denn gleichmäßig geht sie auf Weiß und Schwarz und Alles, was durch die Farbe von einander absticht. So führt der Geschmack, so der Geruch, so die Betastung, ein Jedes durch die ihm eigene Wahrnehmung uns die Kenntniß von allerlei Dingen zu.</p><h2>0</h2><p>Was ist nun seiner eigenen Natur nach der Geist, der in Empfindungs-Kräften sich vertheilt und durch eine jede in entsprechender Weise die Kenntniß der Dinge aufnimmt? Denn daß er etwas Anderes ist als die Sinnesempfindungen, darüber wird, glaube ich, kein Verständiger im Zweifel sein. Wäre er nämlich identisch mit der Sinneswahrnehmung, so wäre er jedenfalls mit* einer* der Sinnesthätigkeiten verwandt, weil er einfach ist, in dem Einfachen aber keine Mannigfaltigkeit bemerkt wird. Nun aber, da Alle zugeben, etwas anderes sei der Tastsinn und etwas Anderes der Geruch, und da ebenso auch die übrigen sich selbständig und unvermischt gegen einander verhalten, so muß man, da er gleichmäßig einem Jeden in entsprechender Weise innewohnt, ihn durchaus für eine andere Natur als die sinnliche halten, damit man dem Geistigen nicht eine Mannigfaltigkeit beimenge. „Wer hat den Geist des Herrn erkannt?“ sagt der Apostel. Ich aber sage ausserdem: Wer hat seinen eigenen Geist begriffen? Mögen Diejenigen, welche die Natur Gottes für innerhalb ihres Begreifens gelegen erachten, sagen, ob sie sich selbst begriffen, ob sie die Natur ihres eigenen Geistes erkannt haben. Ist er vieltheilig und zusammengesetzt? Und wie kann das Intellektuelle zusammengesetzt sein, oder welches ist die Weise der Mischung des Verschiedenartigen? Ist er aber einfach und unzusammengesetzt, wie verbreitet er sich dann in die Vieltheiligkeit der Sinneswahrnehmung? Wie ist in der Einheit das Mannigfaltige, wie in der Mannigfaltigkeit das Eine? Aber ich erfahre die Lösung der Schwierigkeiten, wenn ich auf die Stimme Gottes selbst zurückgehe. Denn „Laßt uns den Menschen machen,“ sagt er, „nach unserem Bilde und Gleichnisse.“ Solange nämlich dem Bilde keines der Merkmale des Urbildes fehlt, ist es wahrhaftig ein Ebenbild; sofern es aber von der Ähnlichkeit mit dem Vorbilde abweicht, insofern ist es nicht Bild. Mithin da eines der Merkmale der göttlichen Natur die Unbegreiflichkeit des Wesens ist, so muß durchaus auch hierin das Abbild dem Urbilde gleichen. Denn wenn die Natur des Abbildes begriffen würde, das Urbild aber überbegrifflich wäre, so würde die Entgegengesetztheit der Merkmale die Verfehltheit des Bildes beweisen. Da jedoch der Erkenntniß sich entzieht die Natur unseres Geistes, welcher nach dem Bilde des Schöpfers ist, so hat er eine genaue Ähnlichkeit mit dem Allerhabenen, indem er durch seine eigene Unerkennbarkeit die unbegreifliche Natur (Gottes) charakterisirt.</p><h2>0</h2><p>Es schweige also alles muthmaßende Geschwätz Derer, die in gewissen Körpertheilen die geistige Thätigkeit einschließen, von denen die Einen behaupten, im* Herzen* sei das die Herrschaft Führende, die Andern aber sagen, im* Gehirn* halte der Geist sich auf, indem sie mit oberflächlichen Wahrscheinlichkeitsgründen derlei Einfälle bekräftigen. Wer nämlich dem* Herzen* den Vorrang einräumt, macht dessen örtliche Lage zum Beweise seiner Behauptung, weil es gewissermaßen den Mittelpunkt des ganzen Leibes einzunehmen scheint, da ja die Willensbewegung sich leicht von der Mitte aus auf den ganzen Körper vertheile und so zur Thätigkeit fortgehe. Und zum Zeugniß hiefür muß ihm der Trauer- und Muth-Affekt des Menschen dienen, weil derlei Leidenschaften diesen Theil in Mitleidenschaft zu ziehen scheinen. Die aber das* Gehirn* dem Denkvermögen weihen, lassen als eine Akropolis des ganzen Leibes das Haupt gebaut sein von der Natur und darin wie einen König wohnen den Geist, gleichsam als von Botschaftern und Trabanten von den Sinnesorganen rings umgeben. Als Beweis aber für diese Ansicht führen auch Diese an das aus dem Geleis Gerathen des Denkens bei den an der Hirnhaut Verletzten und den Verlust der Erkenntniß des Schicklichen bei den im Rausche schwerköpfig Gewordenen. Es fügen aber auch gewisse natürliche Gründe für derlei Vermuthungen über das Hauptseelenvermögen hinzu die Vertreter von beiderlei Ansichten. Der Eine nämlich läßt mit dem Feuer verwandt sein die Denkthätigkeit, wegen der rastlosen Thätigkeit sowohl des Feuers als des Denkens, und da anerkanntermaßen im Herzen die Wärme quillt, deßhalb behauptet er, die Regsamkeit des Geistes stehe mit der Beweglichkeit der Wärme in Verbindung, und erklärt als Gefäß der Denkkraft das Herz, in welchem die Wärme ihren Sitz habe. Der Andere aber sagt, für alle Sinneswerkzeuge sei gleichsam eine Grundlage und Wurzel die Hirnhaut (denn so nennt man die das Gehirn umgebende Haut), und bekräftigt seine Behauptung damit, daß sonst nirgend die Denkthätigkeit ihren Sitz habe als dort, wo sowohl das dazu eingerichtete Ohr die in es einfallenden Töne anschlägt, als auch die in der Augensitzhöhle befindliche Sehkraft mittelst der in die Pupillen einfallenden Bilder den Abdruck nach innen bewerkstelligt, als auch die Beschaffenheiten der Dünste durch den Zug der Nüstern unterschieden werden, als auch der Geschmack durch das Urtheil der Hirnhaut geprüft wird, welche aus der Nähe gewisse durch sie empfindsame Nervenausläufer durch die Halswirbel bis in den trichterartigen Durchgang (Schlund) an den dortigen Muskeln hinablaufen läßt. Ich aber erkenne zwar die vielfachen Störungen der Denkkraft der Seele in Folge der Einflüsse von Krankheiten und die Abstumpfung des Denkens in seiner natürlichen Thätigkeit in Folge eines körperlichen Umstandes als wahr an; auch daß eine Art Quelle der Körperwärme das Herz sei, welches bei Gemüthsbewegungen miterregt wird, und überdieß noch, daß den Sinnesorganen die Hirnhaut zur Grundlage diene, welche nach der Lehre der Physiologen das Gehirn in sich einschließt und von den von dort kommenden Dünsten angefeuchtet wird, — wenn ich von den in anatomischen Studien Bewanderten derlei höre, so stelle das Gesagte nicht in Abrede. Indeß erachte ich Dieß nicht als Beweis dafür, daß in örtlichen Schranken eingeschlossen sei die unkörperliche Natur. Denn einerseits entstehen die Verrücktheiten, wie wir wissen, nicht bloß aus Kopfleiden, sondern auch wenn die die Brustseiten umschließenden Häute krankhaft afficirt sind, ist die Denkkraft gleichfalls geschwächt, wie die Ärzte behaupten, welche die Krankheit Phrenitis (Wahnsinn) nennen, weil diese Häute den Namen Zwerchfell* (φρένες)* [phrenes] haben. Anderseits beruht die aus Gram entstehende Mitempfindung im Herzen auf einer irrthümlichen Meinung. Da nämlich nicht das Herz, sondern der Magenmund verbittert ist, so führen sie aus Unkenntniß das Leiden in’s Herz zurück. Es sagen aber die genauen Kenner der Krankheiten, daß, wenn in traurigen Stimmungen im ganzen Körper eine Verengung und Schließung der Kanäle entsteht, alles in seiner Ausdünstung Gehinderte in die unteren Höhlungen zusammen gedrängt wird. Daher entsteht auch bei Beklemmung der Lungen durch die Umgebung oft ein etwas gewaltsamer Athemzug durch die Natur, welche zum Zweck der Ausdehnung der Zusammendrängung die Enge erweitert. Dieses Schwerathmen halten wir für ein Symptom der Trauer und nennen es Seufzen und Stöhnen. Aber auch der scheinbare Druck in der Herzgegend ist nicht ein Mißbehagen des Herzens, sondern des Magenmundes, aus demselben Grunde, nämlich der Verengung der Kanäle, indem die Gallenblase jenen scharfen und bitteren Saft in Folge der Zusammenpressung in den Magenmund ergießt. Beweis aber dafür ist das blasse und gelbliche Aussehen, das die Trauernden bekommen, indem durch den großen Druck die Galle ihren Saft in die Adern ergießt. Aber auch der entgegengesetzte Affekt, der der Freude nämlich und des Lachens, bestätigt unsere Ansicht noch mehr. Es erweitern sich nämlich gewissermaßen und erschließen sich bei der Freude die Kanäle des Leibes, wenn man durch eine erfreuliche Nachricht erheitert wird. Denn wie dort durch die Trauer die feinen und unsichtbaren Ausdünstungen der Durchgänge in Stocken gerathen und durch Hemmung der Funktion in den Eingeweiden nach dem Kopfe und der Hirnhaut den feuchten Dunst hinauf treiben, welcher bei reichlicher Ansammlung in den Gehirnhöhlen durch die Öffnungen nach unten zu den Augen heraus getrieben wird, indem die Zusammenziehung der Wimpern die Feuchtigkeit tropfenweise auspreßt (der Tropfen aber heißt Thräne), so, denke ich mir, werde, wenn bei der entgegengesetzten Stimmung mehr als gewöhnlich die Kanäle sich erweitern, ein Lufthauch durch sie nach der Tiefe eingezogen und von dort von der Natur durch die Mundöffnung wieder ausgestoßen, indem alle Eingeweide und vorzüglich die Leber, wie man sagt, mit Geräusch und erschütternder Bewegung diese Luft zumal austreiben. Um daher dem Durchgang der Luft eine gewisse Leichtigkeit zu bewirken, erweitert die Natur die Mundöffnung, indem sie beim Keuchen beiderseits die Backen aus einander treibt; dieser Vorgang heißt Lachen. Weder also darf man deßhalb der Leber das herrschende Vermögen zuschreiben noch wegen der Wallung des Herzblutes bei den muthvollen Affekten glauben, im Herzen sei der Sitz des Geistes, sondern man muß diese Dinge auf die so oder so beschaffenen Einrichtungen der Körper zurückführen, vom Geiste aber glauben, daß er nach einem geheimnißvollen Verhältnisse der Mischung mit jedem der Glieder je nach dem Werthe desselben verbunden sei. Und wollten Einige die (heilige) Schrift uns entgegenhalten, die dem Herzen das herrschende Vermögen zuspreche, so werden wir die Sache nicht ununtersucht annehmen. Denn der des Herzens erwähnt, gedenkt auch der Nieren, da er sagt: „Gott, der Herzen und Nieren erforscht,“ so daß sie entweder in beide oder in keines von beiden den Denkgeist verschließen. Wenn ich aber von der Abstumpfung der Denkkräfte oder auch ihrer gänzlichen Unthätigkeit bei irgend einer Körperverfassung höre, so halte ich das für keinen hinreichenden Beweis der Eingeschlossenheit der Geisteskraft an einem Orte, als würde sie durch die die Theile befallenden Geschwulste aus dem ihr gehörigen Raum verdrängt. Körperhaft ist eine solche Vorstellung, daß, wenn das Gefäß schon von irgend einem Inhalte eingenommen ist, etwas Anderes darin keinen Platz finden könne. Denn die geistige Natur weilt weder gern in den Höhlungen der Körper, noch wird sie durch die Überfülle des Fleisches vertrieben, sondern, da der ganze Körper wie ein Musikinstrument eingerichtet ist, gleichwie es oft der Fall ist bei Denen, die zwar zu spielen verstehen, aber ihre Kunst nicht zeigen können, weil die Unbrauchbarkeit der Instrumente die Kunst nicht annimmt (denn das entweder durch Alter verdorbene oder durch Herabfall geborstene oder durch Rost und Moder unbrauchbar gewordene bleibt ton- und wirkungslos, auch wenn es von einem als Meister in der Flötenkunst Geltenden geblasen wird), so wirkt auch der Geist, der das ganze Instrument durchdringt und den geistigen Thätigkeiten entsprechend jeden der Theile, so wie er eben ist, handhabt, in den naturgemäß disponirten zwar das Verwandte, in den seine Kunstbethätigung nicht aufzunehmen fähigen aber bleibt er unwirksam und unthätig. Denn dem Geiste ist es gewissermaßen natürlich, mit dem in naturgemäßem Zustande Befindlichen befreundet, gegen das davon Abgewichene aber fremd zu sein.</p><p>Und mir scheint in dieser Hinsicht sehr naturgemäß zu sein eine Betrachtung, wodurch wir eine der sinnreicheren Lehren lernen können. Da nämlich das Schönste von Allem und das allerhöchste Gut die Gottheit selbst ist, zu der Alles sich neigt, was nach dem Schönen ein Verlangen hat, darum, sagten wir, verbleibe auch der Geist, der ja nach dem Bilde des Schönsten geworden ist, solange er an der Ähnlichkeit mit dem Urbild, soviel als möglich, Theil hat, auch selbst in dem Schönen; wenn er aber gewissermaßen ausserhalb desselben geräth, verliere er die Schönheit, worin er war. Gleichwie wir aber sagen, mit dem Abglanz der urbildlichen Schönheit sei der Geist geschmückt, wie ein die Gestalt des gespiegelten Gegenstandes an sich tragender Spiegel, auf ähnliche Weise, denken wir, hänge (sich) (aus Ber.: streiche „sich“) auch die unter seine Verwaltung gestellte Natur am Geiste, und durch* seine* Schönheit werde auch* sie* geschmückt, indem sie gleichsam ein Spiegel des Spiegels wird, beherrscht aber werde von ihr und gehalten die materielle Grundlage, an der die Natur sich darstellt. So lange nun das Eine am Andern hängt, geht ebenmäßig durch Alles hindurch die Gemeinschaft der wahrhaften Schönheit, durch das Höhere das daran Haltende verschönend. Wenn aber eine Zerreissung dieser guten Verbindung eintritt oder in umgekehrter Ordnung dem Niederen das Höhere nachgeht, dann verräth sich sowohl von der Materie selbst, sobald sie von der Natur verlassen ist, die Unform (denn etwas Ungestaltes und Unförmliches ist die Materie an sich), als auch wird durch diese Unform zugleich die Schönheit der Natur zerstört, zu der sie durch den Geist verschönt wird. Und so geht das Unschöne der Materie durch die Natur auf den Geist selbst über, so daß das Bild Gottes in dem Ausdrucke des Gebildes nicht mehr zu sehen ist. Denn indem der Geist das Bild der Vollkommenheiten wie ein Spiegel von hinten aufnimmt, wirft er die Spiegelbilder der Einstrahlung des Guten hinaus und sudelt die Ungestalt der Materie an sich selbst hin, und auf diese Weise entsteht das Böse, das in Folge der Hinwegnahme des Schönen sich einstellt. Schön aber ist Alles, was immer mit dem Urguten im Einklang steht; was aber ausser dem Verhältniß und der Ähnlichkeit mit diesem ist, hat am Schönen durchaus nicht Theil. Wenn nun unserer bisherigen Betrachtung gemäß das wahrhaft Gute nur Eines ist, der Geist aber durch seine Ebenbildlichkeit mit dem Schönen auch selbst schön ist, die vom Geiste zusammen gehaltene Natur aber gleichsam ein Bild des Bildes ist, so erhellt hieraus, daß unser materieller Theil Bestand zwar hat und festhält, wenn er von der Natur in Ordnung gehalten wird, sich wieder auflöst aber und hinfällt, wenn er von dem, was ihm Halt und Bestand gibt, getrennt und losgerissen wird von der Verbindung mit dem Schönen. Das geschieht aber nur, wenn eine Umkehr der Natur zum Gegentheil stattfindet, indem das Verlangen nicht zu dem Schönen sich hinneigt, sondern zu dem der Verschönung Bedürftigen. Denn ganz nothwendig muß das, was der um ihre eigene Gestaltung bettelnden Materie ähnlich wird, ebenfalls nach ihrer Unform und Unschöne umgeändert werden.</p><p>Allein Dieß ist von uns nur so gelegentlich beibemerkt, indem es sich bei der Untersuchung über den Hauptpunkt hereinschlich. Die Hauptfrage nämlich war, ob in einem der Theile in uns die Denkkraft ihren Sitz habe, oder ob sie gleichmäßig alle durchdringe. Denn hinsichtlich Derer, welche in örtlichen Theilen den Geist einschließen und zur Bestätigung dieser ihrer Annahme die Hemmung der Denkkraft bei widernatürlicher Verfassung der Gehirnhäute anführen, hat die Untersuchung gezeigt, daß in* jedem* Theile des menschlichen Organismus, je nachdem ein jeder zu wirken bestimmt ist, die Kraft der Seele in gleicher Weise unwirksam bleibe, wenn der Theil nicht in der Natur beharrt. Und darum wob sich folgerichtig in die Untersuchung die vorige Betrachtung ein, woraus wir lernen, daß in dem Menschengebilde der Geist von Gott, von diesem aber unser materielles Leben gelenkt werde, sofern es in der Natur bleibt; wenn es aber von der Natur abweicht, es auch der dem Geiste gemäßen Thätigkeit entfremdet werde. Doch kehren wir wieder dahin zurück, wovon wir ausgingen, daß in den nicht durch ein Leiden von der natürlichen Einrichtung abgewichenen Theilen der Geist seine eigenthümliche Kraft übt und stark ist in den gesunden, ohnmächtig aber dagegen in den seine Wirksamkeit nicht zulassenden. Es läßt sich nämlich der dießbezügliche Lehrsatz auch durch Anderes beglaubigen, und wenn es dem Ohre der durch die Rede bereits Ermüdeten nicht lästig ist, so wollen wir auch hierüber, so kurz als möglich, verhandeln.</p><h2>0</h2><p>Dieses materielle und vergängliche Leben der Leiber, das fortwährend in Bewegung dahingeht, hat darin die Kraft des* Seins,* daß es nie still steht in der* Bewegung.* Gleichwie aber ein seinen Lauf verfolgender Fluß zwar ein volles Bett zeigt, in dem er dahin strömt, jedoch nicht mit demselben Wasser immer an derselben Stelle erblickt wird, sondern ein Theil davon ab- und der andere zuströmt, so wechselt auch das Materielle des Lebens hinieden durch Bewegung und Fluß in steter Folge der Gegensätze, so daß es nie von der Veränderung abstehen kann, sondern in der Unmöglichkeit zu ruhen eine rastlose im Ähnlichen abwechselnde Bewegung hat. Wenn es aber je aufhörte sich zu bewegen, so hätte es durchaus auch das Ende des Seins. Auf das Vollsein z. B. folgt die Entleerung, und wieder tritt die Fülle an die Stelle der Leerheit; Schlaf läßt die Anspannung des Wachens nach, das Wachen sodann spannt das Nachgelassene an; und keines von beiden bleibt immerfort da, sondern Eines entweicht in Gegenwart des Andern, indem die Natur derart sich durch die Abwechslungen erneuert, daß sie theilweise an beiden Theil habend ohne Zerreissung vom Einen zum Andern übergeht. Denn die fortwährende Kraftanstrengung des Lebewesens bewirkt ein gewisses Brechen und Zerreissen der überspannten Theile, und die andauernde Erschlaffung des Körpers verursacht Schwächung und Auflösung des Bestehenden. Die rechtzeitige und maßvolle Berührung mit beiden aber trägt bei zum Fortbestand der Natur, wenn sie durch den steten Übergang zum Entgegengesetzten in beiden sich von den andern ausruht. So also den durch’s Wachen angespannten Körper erfassend, bringt sie durch den Schlaf Lösung in die Spannung, indem sie die Sinneskräfte eine Zeit lang von den Thätigkeiten ruhen läßt und wie Pferde nach den Wagenkämpfen ausspannt. Nothwendig aber für den Bestand des Körpers ist die rechtzeitige Abspannung, damit ungehemmt im ganzen Körper durch die Kanäle in ihm die Nahrung sich verbreite, ohne daß eine Spannung den Durchgang hindert. Denn wie aus der durchnäßten Erde, wenn die Sonne mit heisseren Strahlen darauf scheint, gewisse neblige Dünste von der Tiefe emporgezogen werden, etwas Ähnliches geschieht auch in der Erde in uns, wenn die Nahrung in uns durch die natürliche Wärme aufwallt. Da aber die Dünste ihrer Natur nach aufsteigen und luftartig und in die Höhe strebend sind, so gelangen sie in die Räume des Kopfes, wie ein Dampf durch eine Wandfuge dringt; von da dringen sie verdunstend in die Öffnungen der Sinneswerkzeuge, in denen nothwendig die Sinneswahrnehmung unthätig wird, da sie beim Eintritt jener Dünste entschwindet. Denn die Sehkraft wird durch die Lider gelähmt, als wenn ein Bleigewicht, eine solche Schwere nämlich, das Lid über die Augen zöge; abgestumpft aber durch eben diese Dünste feiert das Gehör, wie wenn ein Brett auf den Gehörtheilen läge, von seiner natürlichen Thätigkeit, und diese Affektion ist der* Schlaf,* indem die Empfindung im Körper rastet und ihre natürliche Wirksamkeit einstellt, damit die Verdauung der Nahrung ungehindert vor sich gehe, indem sie zugleich mit den Dünsten durch alle Kanäle dringt. Und darum streckt, wenn etwa durch die innere Dunstentwicklung der Sinneswerkzeug-Apparat beklommen, der Schlaf aber durch irgend eine Noth gehindert ist, das von den Dünsten voll gewordene Generv naturnothwendig sich von selbst aus, so daß durch die Ausdehnung der von den Dünsten aufgeschwellte Theil verdünnert wird; wie es Diejenigen machen, die durch strengeres Winden das Wasser aus der Wäsche herauspressen. Und da die Theile um den Schlund herum rundlich sind, das Generv aber in diesen zahlreich, so wird, wenn auch aus diesen die Dichtigkeit der Dünste entfernt werden soll, weil es unmöglich ist, den rundlichen Theil gerade auszustrecken, wenn er nicht kreisförmig ausgespannt wird, darum im* Gähnen* der Athem aufgefangen, während der Kinnbacken nach unten in der Gurgel sich aushöhlt, und drinnen Alles kreisförmig ausgespannt und so dann jener in den Theilen befindliche dampfige Qualm zugleich mit dem Ausgang des Odems ausgeathmet. Dieß pflegt aber auch oft* nach* dem Schlafe einzutreten, falls Etwas von jenen Dünsten unverdaut und unverhaucht in den Räumen zurückgeblieben ist.</p><p>Hiedurch also zeigt der menschliche Geist handgreiflich, daß er an der Natur hänge, da er, wenn diese selbstmächtig und wach ist, auch selbst mitthätig und rege ist, wenn sie aber im Schlafe liegt, unthätig bleibt; wenn man nicht etwa die Traumphantasie für eine im Schlafe wirksame Geistes-Thätigkeit halten wollte. Wir aber sagen, nur die bewußte und selbstmächtige Thätigkeit des Denkens sei auf den Geist zurückzuführen, die Traumpossen des Schlafes aber, glauben wir, werden als gewisse Nachäffungen der Thätigkeit des Geistes durch die mehr unvernünftige Art der Seele nach Zufall gebildet. Denn die im Schlafe von den Sinnes-Empfindungen abgelöste Seele ist damit nothwendig auch den geistigen Thätigkeiten entrückt; denn durch jene ist der Geist mit dem Menschen verbunden. Wenn also die Sinne in Ruhe sind, muß auch das Denken unthätig sein. Beweis dafür aber ist, daß der Träumende oft auch in Albernem und Unmöglichem sich zu bewegen meint, was wohl nicht geschehen würde, wenn die Seele zu der Zeit von Besinnung und Überlegung gelenkt würde. Vielmehr scheint mir, daß, wenn die Seele in den vorzüglichsten ihrer Kräfte rastet, nämlich den Thätigkeiten des Geistes und der Sinnes-Wahrnehmung, nur ihr ernährender Theil im Schlafe wirksam sei, in diesem aber gewisse Schattenbilder der Begegnisse des Wachens und Nachklänge der Thätigkeiten der Sinnes-Wahrnehmung und des Denkens, die ihm durch das Erinnerungsvermögen der Seele eingeprägt wurden, wie es eben kommt, sich wieder darstellen, weil ein gewisser Nachhall der Erinnerung in diesem Seelenvermögen zurückblieb. In diesen also phantasirt der Mensch, nicht durch einen gewissen Zusammenhang in den Verkehr mit der Erscheinungswelt geführt, sondern in wirren und unsteten Trugbildern umherirrend. Gleichwie aber bei den körperlichen Thätigkeiten, während jedes der Glieder je nach der von Natur ihm inwohnenden Kraft in eigenthümlicher Weise wirkt, eine gewisse Mitaffektion auch des ruhenden Gliedes mit dem bewegten stattfindet, in ähnlicher Weise wird auch bei der Seele, obwohl ein Theil von ihr eben ruht, der andere aber thätig ist, zugleich mit dem Theile auch das Ganze afficirt. Es ist ja auch nicht möglich, daß die natürliche Einheit völlig zerrissen werde, wenn theilweise eines ihrer Vermögen vorherrschend thätig ist. Vielmehr wie im Wachen und bei der Arbeit der Geist herrscht, die Sinnesempfindung aber dient, von diesen sich aber die Verdauungskraft des Körpers nicht trennt (denn der Verstand erwirbt dem Bedürfniß die Nahrung, die Sinnesempfindung nimmt das Erworbene in Empfang, die Nährkraft des Körpers aber eignet sich das Dargereichte an), so stellt auch im Schlafe die Oberherrschaft dieser Vermögen in uns sich gewissermaßen um, und indem der unvernünftige Theil vorherrscht, ruht zwar die Thätigkeit der übrigen, ist jedoch nicht gänzlich erloschen. Indem aber inzwischen während des Schlafes die ernährende Kraft sich auf die Verdauung verlegt und die ganze Seele mit sich beschäftigt, trennt sich weder die Empfindungskraft gänzlich von ihr (denn es geht nicht, daß das einmal Zusammengewachsene zerschnitten werde), noch auch kann ihre Thätigkeit hervorleuchten, da sie durch die Unthätigkeit der Sinneswerkzeuge im Schlafe gebunden ist. Da aber ebenso auch der Geist zu dem Empfindungsvermögen in Beziehung steht, so wird man wohl mit Recht sagen, wenn dieses thätig ist, sei auch er thätig, und wenn dieses ruht, feire auch er. Wie es aber beim Feuer geschieht, daß, wenn es ganz und gar in der Spreu verdeckt ist, indeß kein Luftzug die Flamme anfacht, es weder weiter um sich greift noch gänzlich erlischt, sondern statt der Flamme ein Qualm durch die Spreu in die Luft aufsteigt, wenn es aber von einem Luftzug erfaßt wird, den Rauch zur Flamme vollendet: auf dieselbe Weise ist auch der Geist, wenn er bei der Unthätigkeit der Sinne im Schlafe zugleich verhüllt ist, weder durch sie hervorzuleuchten im Stande, noch auch gänzlich erloschen, sondern bewegt sich gleichsam rauchartig, theils zwar wirkend, theils aber unvermögend. Und wie ein Musiker, der aus abgespannten Saiten der Lyra das Plektrum anschlägt, das Lied nicht im Rhythmus dahinführt (denn das Nichtgespannte kann wohl nicht tönen, sondern die Hand zwar bewegt kunstfertig sich oftmals, je nach der örtlichen Lage der Töne das Plektrum schlagend, das Klingen aber erfolgt nicht, nur daß bei der Bewegung der Saiten ein undeutliches und ungeordnetes Geräusch nachklingt), so ist auch, wenn im Schlafe der Organismus der Sinneswerkzeuge erschlafft ist, der Künstler entweder völlig in Ruhe, wenn anders das Organ aus Überladung und Schwere eine völlige Abspannung erleidet, oder er wird schwach und undeutlich wirken, wenn das Sinnesorgan seine Kunst nicht vollkommen aufnimmt. Daher phantasirt die verworrene Erinnerung und die wie bei halbdunklen Vorhängen eingeschlafene Voraussicht in Bildern der Beschäftigungen des Wachens und deutet oft Etwas an, was eintrifft. Denn durch die Feinheit ihrer Natur hat sie vor der körperlichen Grobtheiligkeit Etwas voraus, so daß sie Etwas von dem Wirklichen erblicken kann. Indeß kann sie das Betreffende nicht geradewegs verdeutlichen, so daß die Belehrung über das Bevorstehende klar und offenbar wäre, sondern schief und zweideutig geschieht die Andeutung der Zukunft, was die Traumdeuter Räthsel nennen. So preßt der Weinschenk die Traube für den Becher des Pharao, so träumte der Bäcker, Körbe zu tragen, da Jeder von beiden mit dem, womit er sich im Wachen beschäftigte, auch im Traume sich zu befassen meinte. Denn die der Vorahnung ihrer Seele eingeprägten Bilder der ihnen gewohnten Beschäftigungen gaben gelegentlich Anlaß, mittelst jener Vorhersagung des Geistes das Künftige zu wahrsagen.</p><p>Wenn aber Daniel und Joseph und Andere dergleichen durch* göttliche* Kraft, ohne eine Sinnesverdunkelung, eine Vorkenntniß der Zukunft erlangten, so hat das mit dem vorliegenden Gegenstande Nichts zu schaffen. Es wird ja auch Niemand Dieß der Kraft der Träume zuschreiben, da er sonst durchaus folgerichtig auch die im* Wachen* stattfindenden Gottes-Erscheinungen nicht für ein Gesicht, sondern für eine von selbst erfolgende Naturwirkung halten müßte. Wie es also, während alle Menschen nach dem eigenen Geiste gelenkt werden, einige Wenige gibt, die des göttlichen Umgangs in klarer Weise gewürdigt werden, so wird auch, während Allen gemeinsam und gleichheitlich das Träumen im Schlafe naturgemäß zukommt, Einigen, nicht Allen, eine mehr göttliche Erscheinung in den Träumen zu Theil, bei allen Anderen aber, wenn auch eine Vorkenntniß aus Träumen über irgend Etwas stattfindet, geschieht es auf die genannte Art. Wenn aber auch der ägyptische und assyrische Tyrann durch* Gott* zur Erkenntniß der Zukunft geführt werden, so hat es damit eine andere Bewandtniß. Kund werden nämlich sollte die verborgene Weisheit der Heiligen, damit sie nicht ohne Nutzen für das Allgemeine am Leben vorüberginge. Denn wie wohl wäre Daniel als ein Solcher erkannt worden, wenn nicht die Beschwörer und Magier zur Deutung des Traumbildes unfähig waren? Und wie wäre Ägypten gerettet worden, da Joseph im Gefängniß eingesperrt war, wenn nicht die Deutung des Traumes ihn in die Öffentlichkeit führte? Das ist also etwas Anderes und darf nicht nach den alltäglichen Traumbildern beurtheilt werden. Dieses gewöhnliche Traumgesicht aber ist Allen gemein, da es mannigfaltig und vielgestaltig in den Traumbildern vorkommt. Entweder nämlich bleiben, wie gesagt, in der Erinnerung der Seele die Nachklänge der täglichen Beschäftigungen, oder oft auch gestaltet sich die Traumvorstellung je nach den so oder so beschaffenen Körperzuständen. So meint ja der Durstige an Quellen zu sein, und bei Zechgelagen der nach Nahrung Verlangende, und der Jüngling, wenn die Jugend ihm strotzt, träumt gemäß seiner Leidenschaft. Ich habe aber auch eine andere Ursache der Traumräthsel wahrgenommen, da ich einen vom Fieberwahnsinn (Phrenitis) befallenen Verwandten pflegte, der, mit mehr Speise, als er ertragen konnte, beschwert, schrie und die Umstehenden schalt, daß sie Gedärme mit Koth gefüllt und ihm aufgelegt hätten, und, da ihm bereits der Körper nach Schweiß strebte, die Anwesenden beschuldigte, sie hätten Wasser zur Hand, womit sie ihn im Liegen durchnäßten, und nicht nachließ mit Schreien, bis der Ausgang die Ursachen dieser Beschuldigungen erklärte. Denn plötzlich überströmte sowohl reichlicher Schweiß den Körper, als auch brachte der berstende Bauch die Last in den Eingeweiden zu Tage. Was also in Folge getrübter Nüchternheit die durch das Körperleiden mitaffizirte Natur erlitt, da sie gegen das Beschwerende zwar nicht empfindungslos war, das Schmerzende deutlich kund zu geben aber vermöge der aus der Krankheit entspringenden Verrücktheit nicht vermochte, das würde wahrscheinlich, wenn nicht aus Krankheit, sondern durch natürlichen Schlaf die Denkkraft der Seele entschlummert wäre, dem in solcher Lage Befindlichen als Traum erscheinen, so daß das Wasser das Überströmen des Schweißes, die Last der Gedärme aber die Nahrungsbeschwerniß andeutete. Das scheint auch Vielen von den in der Heilkunde Erfahrenen, daß je nach den Verschiedenheiten der Leidenszustände auch die Traumgesichte den Kranken entstehen, andere bei den Magenleidenden, andere bei den an den Hirnhäuten Beschädigten, bei den Fieberkranken wieder andere, bei den an der Galle und den an Schleimsucht Erkrankten nicht dieselben, und bei den Vollblütigen und den Ausgezehrten wieder andere. Hieraus kann man ersehen, daß die nährende und mehrende Kraft der Seele Etwas auch von der Denkkraft hat, als mischungsweise mit ihr verbunden, was dem so oder so beschaffenen Zustand des Körpers ähnlich wird, indem es je nach der herrschenden Affektion in den Traumgebilden sich umändert. Ferner aber auch nach den Charakterbestimmtheiten gestalten sich bei den Meisten die Träume. Andere sind die Phantasiegebilde des Mannhaften, und andere des Feigen, andere die Träume des Zuchtlosen und andere des Enthaltsamen, andere Phantasien hat der Freigebige und andere der Nimmersatt, wobei nirgends die Überlegung, sondern die mehr unvernünftige Seelenverfassung diese Phantasiebilder gestaltet, indem sie, woran sie gewohnt ist im Geschäfte des Wachens, davon die Bilder auch in den Träumen abzeichnet.</p><h2>0</h2><p>Allein wir sind weit von unserem Gegenstande abgekommen. Es handelte sich uns nämlich darum, zu zeigen, daß der Geist nicht an irgend einen Theil des Leibes gebunden sei, sondern, daß er an jedem gleichmäßig hafte, indem er entsprechend der Natur des vorliegenden Theiles die Thätigkeit ausübt. Bisweilen aber auch folgt der Geist den natürlichen Trieben und wird gleichsam Diener. Denn voran geht oft die Natur des Körpers, indem sie eine Empfindung des Schmerzhaften erregt oder ein Verlangen nach dem Ergötzlichen, so daß diese zwar den ersten Anstoß gibt, entweder Eßgier oder überhaupt den Trieb nach irgend etwas Angenehmem bewirkend, der Geist aber, derlei Triebe aufnehmend, durch die ihm eigene Umsicht die Bestrebungen nach dem Verlangten in Verbindung mit dem Körper in’s Werk setzt. Dieß ist jedoch nicht bei Allen der Fall, sondern nur bei den mehr sklavisch Gesinnten, welche, die Vernunft unter die Triebe der Natur knechtend, durch die Mithilfe des Geistes dem sinnlich Angenehmen sklavisch fröhnen. Bei den Vollkommeneren aber ist das nicht so. Denn voran geht da der Geist, nach Vernunft und nicht nach Leidenschaft das Nützliche wählend, die Natur aber folgt dem Führer auf dem Fuße. Da aber drei Unterschiede der Lebenskraft unsere Untersuchung gefunden hat, die empfindungslos nährende, die nährende und empfindende, aber der Vernunftthätigkeit entbehrende, endlich die vernünftige und vollkommene, die das Gesammtvermögen durchdringt, so daß sie sowohl in jenen ist, als auch den Vorzug der Denkkraft hat, so soll darum Niemand meinen, es seien in dem menschlichen Gebilde drei Seelen zusammengeschweißt, als in eigenen Grenzen befindlich, so daß er glaubte, eine Mischung aus mehreren Seelen sei die menschliche Natur. Vielmehr die wahre und vollkommene Seele ist ihrer Natur nach eine, die vernünftige und immaterielle, durch die Sinne mit der materiellen Natur verbundene. Alles Materielle, in Wandel und Veränderung Liegende aber, wenn es der beseelenden Kraft theilhaft ist, wird wachsthümlich sich bewegen; wenn es aber der Lebensthätigkeit entfällt, wird es in Untergang auflösen die Bewegung. Weder also findet Sinnesempfindung ohne materielles Wesen noch Thätigkeit der Denkkraft ohne Empfindung statt.</p><h2>0</h2><p>Wenn aber einige Geschöpfe die ernährende Thätigkeit haben oder wieder andere mit Empfindungskraft begabt sind, ohne daß weder jene der Empfindung, noch diese der denkenden Natur theilhaftig sind, und* darum* Jemand eine Mehrheit von Seelen argwöhnt, so wird ein Solcher nicht nach der richtigen Unterscheidung die Verschiedenheit der Seelen als Lehre aufstellen. Alles Seiende nämlich wird, wenn es vollkommen das ist, was es ist, im* eigentlichen* Sinne auch so genannt, wie man es heißt; was aber nicht durchaus dasj* ist,* was es heißt, hat auch seinen Namen nur* uneigentlich.* Z. B. wenn Jemand das wirkliche Brod zeigte, so sagen wir, ein Solcher gebe im eigentlichen Sinne dem Ding seinen Namen; wenn aber Einer ein aus Stein gefertigtes dem natürlichen gegenüber zeigte, das zwar dieselbe Gestalt und die gleiche Größe und ähnliche Farbe hat, so daß es in den meisten Stücken dem Urbilde gleich sieht, dem aber die Fähigkeit, auch Nahrung zu sein, abgeht, so sagen wir dessentwegen, nicht eigentlich, sondern mißbräuchlich habe der Stein die Benennung* Brod* erhalten. Und ebenso trägt Alles, was nicht vollständig* ist,* was es heißt, mißbräuchlich seinen Namen. So kann nun auch hinsichtlich der Seele, die ja in der Geistigkeit und Vernünftigkeit ihre Vollendung hat, Alles, was nicht so beschaffen ist, zwar gleichnamig sein mit der Seele, nicht jedoch auch wahrhaft Seele, sondern eine gewisse Lebenskraft, der man den Namen der Seele beigelegt hat. Darum hat auch die Natur der Thiere, als nicht weit entfernt vom Pflanzenleben, in gleicher Weise dem Gebrauche des Menschen übergeben der allgemeine Gesetzgeber, um statt des Krautes den Besitzern zu dienen; denn „alles Fleisch,“ sagt er, „esset wie Kräuter des Feldes;“ nur wenig ja scheint sie durch ihre Empfindungsfähigkeit voraus zu haben vor dem, was ohne diese wächst und sich mehrt. Zur Lehre sei Dieß den fleischlich Gesinnten, nicht zu sehr an die sinnlichen Dinge das Denken zu fesseln, sondern in den seelischen Vorzügen geschäftig zu sein, da die wahre Seele in diesen sich zeigt, die Sinnesempfindung aber ebenso auch in den Thieren ist. — Aber auf etwas Anderes abgeschweift ist der Gang der Rede. Denn nicht das lag der Betrachtung vor, daß von den Eigenschaften des Menschen die Thätigkeit des Geistes vorzüglicher sei als das Materielle seines Bestandes, sondern, daß nicht in einem bestimmten Theil in uns der Geist eingeschlossen ist, sondern gleichmäßig in allen ist und durch alle hindurch geht, weder von aussen umschließend noch innen festgehalten; denn das sagt man eigentlich nur von Gefäßen oder anderen in einander befindlichen Körpern. Die Gemeinschaft aber des Geistes mit dem Leibe hat eine unaussprechliche und unbegreifliche Verbindung, da er weder innen ist (denn nicht wird vom Körper umschlossen das Unkörperliche), noch äusserlich umgebend (denn das Unkörperliche umgrenzt Nichts); vielmehr als auf eine unerklärbare und unerforschliche Weise mit der Natur verbunden und zusammenhängend, zeigt sich der Geist sowohl in ihr als um sie herum, aber weder d’rin sitzend noch sie umringend, sondern so, wie man es weder sagen noch denken kann, ausser daß, wenn gemäß ihres eigenthümlichen Gefüges die Natur in gutem Gang ist, auch der Geist thätig ist, wenn aber eine Verletzung an ihr Statt hat, demgemäß auch die Bewegung des Denkens erlahmt.</p><h2>0</h2><p>Nehmen wir aber wieder den göttlichen Ausspruch auf: „Laßt uns den Menschen machen nach unserem Bilde und Gleichnisse.“ Wie kleine und der Hoheit des Menschen unwürdige Vorstellungen haben Manche unter den Heiden gehabt, indem sie durch den Vergleich mit dieser Welt groß machten, wie sie meinten, das Menschliche! Sie sagen nämlich, eine kleine Welt sei der Mensch, da er aus den nämlichen Elementen wie das All bestehe. Denn die mit dem Prunke des Namens der menschlichen Natur ein solches Lob spenden, merken nicht, daß sie mit den Eigenschaften der Mücke und Maus den Menschen prangen lassen. Denn auch in Jenen ist eine Mischung aus den vier Elementen, weil überhaupt von allem Seienden ein größerer oder geringerer Antheil an dem Beseelten bemerkt wird, ohne den keines der mit Empfindung begabten Wesen zu bestehen vermag. Was ist’s also Großes, für ein Gepräge und Gleichniß der Welt den Menschen zu halten, des umlaufenden Himmels, der sich ändernden Erde, da alles in diesen Befaßte mit dem Vorübergang des Umfassenden zugleich vorübergeht? Allein worin besteht nach der kirchlichen Lehre die menschliche Größe? Nicht in der Ähnlichkeit mit der geschaffenen Welt, sondern der Gestaltung nach dem Bilde der schaffenden Natur. Worin also besteht das Bild? wirst du vielleicht fragen; wie ist dem Unkörperlichen ähnlich das Körperhafte, wie dem Ewigen das Hinfällige, dem Unveräußerlichen das im Wechsel sich ändernde, dem Leidlosen und Unvergänglichen das Leidensfähige und Vergehende, dem von allem Bösen Unberührten das durchweg damit Verbundene und Verwachsene? Denn groß ist der Abstand zwischen der Idee des Urbildes und dem zum Abbilde Gewordenen. Wenn nämlich ein Abbild Ähnlichkeit hat mit dem Urbilde, dann nennt man es im eigentlichen Sinne so; wenn aber abweicht von der Vorlage das Nachbild, dann ist dieses etwas Anderes und nicht Abbild von jenem. Wie also ist der Mensch, dieses sterbliche, leidvolle und kurzlebige Wesen, ein Abbild der lauteren und reinen und ewigen Natur? — In der That, den wahren Aufschluß hierüber dürfte wohl nur die wahrhaftige Wahrheit allein genau wissen; wir aber, die wir, so gut wir vermögen, durch Vermuthungen und Schlüsse dem Wahren nachspüren, haben über das Gefragte folgende Ansicht. Weder lügt das göttliche Wort, das da sagt, nach dem Bilde Gottes sei der Mensch geworden, noch ist das klägliche Elend der menschlichen Natur der Seligkeit des leidenslosen Lebens ähnlich. Man muß nämlich, wenn man unser Loos mit Gott vergleichen wollte, eines von beiden zugeben, entweder leidensfähig sei die göttliche, oder leidenslos die menschliche Natur, um durch die gleichen Eigenschaften den Begriff der Ähnlichkeit bei beiden festhalten zu können. Wenn aber weder die göttliche leidensfähig noch die unsrige ohne Leiden ist, so bleibt also noch eine andere Rücksicht übrig, wonach wir als wahr erklären das göttliche Wort, das nach dem Bilde Gottes den Menschen geworden sein läßt. So wollen wir denn die heilige Schrift selbst wieder hernehmen, ob wir vielleicht durch das, was geschrieben steht, eine Hinleitung erhalten zu dem Gesuchten. Nach den Worten: „Laßt uns den Menschen machen nach unserem Bilde“ und nach Angabe des Wozu der Erschaffung, fügt sie noch folgenden Satz hinzu: „Und es schuf Gott den Menschen, nach dem Bilde Gottes schuf er ihn, Mann und Weib schuf er sie.“ Nun wurde zwar auch früher schon bemerkt, daß diese Worte schon im voraus zur Widerlegung der ketzerischen Gottlosigkeit gesprochen sind, damit wir erführen, daß den Menschen der eingeborne Gott schuf nach dem Bilde Gottes, und wir darum in keiner Weise die Gottheit des Vaters und des Sohnes trenneten, da ja die heilige Schrift beide gleichmäßig Gott nennt, den, der den Menschen schuf, und den, nach dessen Bilde er wurde. Allein die Erörterung hierüber wollen wir lassen und auf die vorliegende Frage die Untersuchung hinlenken, wie nämlich Gott selig, der Mensch aber unglücklich ist, und doch dieser Jenem von der Schrift ähnlich genannt wird. Prüfen wir also genau die Worte. Wir finden nämlich, daß etwas Anderes ist das nach dem Bilde Gewordene, etwas Anderes aber das jetzt im Elende Befindliche. „Es schuf Gott,“ heißt es, „den Menschen nach dem Bilde Gottes schuf er ihn.“ Damit ist die Schöpfung des nach dem Bilde Gewordenen fertig. Hierauf folgt die weitere Beschreibung der Ausstattung und es heißt: „Mann und Weib schuf er sie.“ Jeder nämlich, glaube ich, sieht ein, daß Dieß sich nicht auf das Urbild bezieht. Denn „in Christo Jesu,“ wie der Apostel sagt, „ist weder Mann noch Weib.“ Aber doch, sagt die Schrift, sei in diese der Mensch getheilt worden. Also eine doppelte ist die Ausstattung unserer Natur, die eine nach Gott gestaltet, die andere nach diesem Unterschiede getheilt. Denn so Etwas deutet die Schrift durch den Zusammenhang der Sätze an, indem sie zuerst sagt: „Es schuf Gott den Menschen, nach dem Bilde Gottes schuf er ihn,“ dann aber dem Gesagten beifügt: „Mann und Weib schuf er sie,“ was dem, was wir von Gott denken, fremd ist. Ich glaube nämlich, eine große und erhabene Lehre werde durch das Gesagte von der heiligen Schrift überliefert; die Lehre aber ist diese. Zwischen zwei äussersten Gegensätzen steht in der Mitte das Menschenwesen, zwischen der göttlichen und unkörperlichen Natur nämlich und dem vernunftlosen und thierischen Leben. Von beiden nämlich kann man in dem menschlichen Doppelwesen den Antheil sehen, vom Göttlichen die Vernunft und Denkkraft, welche den Unterschied von männlich und weiblich nicht zuläßt, vom Vernunftlosen aber die in Mann und Weib getheilte körperliche Ausstattung und Bildung (diese beiden nämlich sind durchaus in jedem Inhaber des menschlichen Lebens); aber das Geistige geht voran, wie wir von dem Berichterstatter der Erschaffung des Menschen vernahmen, und erst später kommt dem Menschen die Gemeinschaft und Verwandtschaft mit dem Vernunftlosen zu. Denn zuerst sagt er: „Gott schuf nach dem Bilde Gottes den Menschen,“ und zeigt durch diese Worte an, daß, wie der Apostel sagt, „in diesem weder Mann noch Weib ist;“ dann fügt er die Eigenthümlichkeiten der menschlichen Natur hinzu: „Mann und Weib schuf er sie.“ Was lernen wir also hieraus? Und Niemand zürne mir, wenn ich bei der vorliegenden Frage weiter aushole.</p><p>Gott ist seiner Natur nach alles Gute, was man immer im Denken erfassen kann, ja, er ist sogar über alles Gute, was man denken und vorstellen kann, erhaben und schafft daher aus keinem anderen Grunde das menschliche Leben, als weil er gut ist. Weil er aber so ist und deßhalb sich zur Erschaffung der menschlichen Natur entschloß, so hat er die Macht seiner Güte wohl nicht halb bewiesen, so daß er von seinem Vorrathe das Eine zwar gab, die Theilnahme am Andern aber versagte, sondern der vollkommene Erweis seiner Güte besteht darin, daß er den Menschen sowohl aus dem Nichtsein in’s Dasein rief als auch mangellos an Gütern machte. Da aber das Verzeichniß der einzelnen Güter lang ist, so ist es in der That nicht leicht, dieß aufzuzählen. Darum hat die Schrift Alles in einen kurzen Satz zusammengefaßt und angedeutet durch den Ausspruch, nach dem Bilde Gottes sei der Mensch geworden. Denn das heißt ebensoviel als: Er machte die menschliche Natur alles Guten theilhaftig. Ist nämlich Gott die Fülle der Güter, jene aber sein Ebenbild, so beruht natürlich die Ähnlichkeit des Ebenbildes mit dem Urbilde in dem Vollbesitz alles Guten. Somit ist in uns die Idee alles Schönen, alle Tugend und Weisheit und Alles was je zur Vollkommenheit gehört. Eines aber von Allem ist, daß der Mensch frei ist vom Zwange und nicht unterworfen einer physischen Gewalt, sondern freie Wahl hat zu dem, was ihm gut dünkt. Denn etwas Zwangloses und Freiwilliges ist die Tugend, das Abgenöthigte aber und Gezwungene kann nicht Tugend sein. Würde nun das Ebenbild in Allem das Gepräge der urbildlichen Schönheit an sich tragen und nicht in irgend Etwas verschieden sein, so wäre es offenbar kein Gleichniß mehr, sondern als durchaus identisch würde sich erweisen das völlig Ununterschiedene. Welchen Unterschied also bemerken wir zwischen Gott selbst und dem Gott-ähnlich Geschaffenen? Er besteht darin, daß jener ungeschaffen ist, dieser aber durch Schöpfung existirt. Dieser eigenthümliche Unterschied aber hat wieder andere Eigenthümlichkeiten zur Folge. Es wird nämlich allgemein und allseitig zugestanden, daß die ungeschaffene Natur auch unveränderlich sei und immer sich gleich bleibe, die geschaffene aber nicht ohne Veränderung bestehen könne. Denn eben der Übergang aus dem Nichtsein in das Sein ist eine gewisse Bewegung und Veränderung des Nichtseienden, das nach dem göttlichen Willen in das Sein übertritt. Und wie das Evangelium das Erzgepräge des Kaisers* Bild* nennt, woraus wir lernen, in der* Gestalt* liege die Ähnlichkeit der Abbildung mit dem Kaiser, in dem* Stoffe* aber beruhe die Verschiedenheit, so finden wir auch bei der gegenwärtigen Untersuchung, wenn wir statt des Gepräges die* Merkmale* (Eigenschaften) der göttlichen und der menschlichen Natur betrachten, worin die Ähnlichkeit liegt, in dem* Subjekte* (Wesen) die Verschiedenheit, die in dem Unerschaffenen und dem Erschaffenen beruht. Da nun Jenes sich immer gleich bleibt, das durch Schöpfung Entstandene aber mit Veränderung sein Dasein begann und mit solchem Wandel stammverwandt ist, darum brachte der, welcher Alles weiß, bevor es geschieht, wie die Prophezie sagt, nachgehends oder vielmehr kraft seiner Vorsicht vorsehend, wohin zufolge der Freiheit und Selbstmacht die Bewegung des menschlichen Willens sich neigen würde, da er das Künftige wußte, an dem Bilde den Unterschied von Mann und Weib an, welcher sich nicht mehr auf das göttliche Urbild bezieht, sondern, wie gesagt, der mehr vernunftlosen Natur angehört. Die Ursache aber dieser weisen Einrichtung dürften wohl nur die Schauer der Wahrheit und Diener des Wortes kennen, wir dagegen, die wir nur, so viel als möglich, in Vermuthungen und Bildern die Wahrheit uns vorstellen, wollen unsere Gedanken nicht behauptungsweise darlegen, sondern gleichsam in Form eines Versuchs den geneigten Hörern vorlegen. Was ist es also, was wir uns hierüber ausgedacht haben? Wenn die Schrift sagt: „Gott schuf den Menschen,“ so wird durch das Unbestimmte des Ausdrucks die Menschennatur überhaupt bezeichnet. Denn es wird dem Geschöpfe hier nicht sogleich der Name „Adam“ beigelegt, wie im Folgenden die Erzählung thut, sondern der Geschaffene heißt Mensch, nicht ein einzelner, sondern allgemein. Somit werden wir durch die allgemeine Nennung der Natur dahin gebracht, etwa zu denken, daß durch die göttliche Vorsehung und Macht die ganze Menschheit in der ersten Zubereitung zusammengefaßt wurde; denn bei Gott darf man keine Unbestimmtheit in seinen Werken annehmen, sondern vielmehr daß jedes der Wesen sein durch die Weisheit des Schöpfers abgemessenes Ziel und Maß habe. Gleichwie also der einzelne Mensch durch die Körpergröße umschrieben ist und sein Maß der zugleich mit seiner Körpergestalt gegebene Umfang seiner Leiblichkeit ist, so, glaube ich, sei wie in* einem* Leibe die ganze Fülle der Menschheit von dem Gott aller Wesen durch seine vorsehende Macht umfaßt worden, und das lehre die Schrift, wenn sie sagt: Gott schuf den Menschen, und nach dem Bilde Gottes schuf er ihn. Denn nicht in einem* Theile* der Natur ist das Bild, und nicht in einer einzelnen ihrer Eigenschaften die Gnade (Schönheit), sondern über das* ganze* Geschlecht gleichmäßig erstreckt sich diese Kraft. Beweis dafür aber ist, daß Allen gleicher Weise der Geist* (νοῦς)* [nous] innewohnt. Alle haben das Vermögen zu denken und zu beschließen und alles Andere, wodurch die göttliche Natur in dem nach ihr Geschaffenen sich abbildet. Gleichmäßig verhält sich sowohl der mit der ersten Weltschöpfung in’s Leben gerufene Mensch, als auch der am Ende der Welt geboren Werdende; in gleicher Weise tragen sie an sich das göttliche Ebenbild. Darum ward* ein* Mensch genannt das Ganze, weil für die Macht Gottes weder Etwas vergangen ist noch künftig, sondern auch das Zukünftige ebenso wie das Gegenwärtige durch die das All umfassende Thätigkeit beherrscht wird. Die ganze Natur also, wie sie von den Ersten bis zu den Letzten sich erstreckt, ist gleichsam* ein* Bild Dessen, der da ist. Der Geschlechtsunterschied aber von Mann und Weib wurde dem Gebilde zuletzt hinzu geschaffen, und zwar, wie ich glaube, aus folgendem Grunde.</p><h2>0</h2><p>Indeß, bevor wir diesen Punkt erforschen, ist es vielleicht besser, für den von unseren Gegnern vorgebrachten Einwurf die Lösung zu suchen. Sie sagen nämlich, vor der Sünde werde weder eine Geburt erzählt noch Geburtswehen noch ein Trieb nach Kindererzeugung. Nach Vertreibung aber aus dem Paradiese in Folge der Sünde und nach Verurtheilung des Weibes zur Strafe der Geburtsschmerzen, da erst sei Adam daran gegangen, seine Genossin ehelich zu erkennen, und da sei der Anfang der Kindererzeugung gewesen. Wenn es also im Paradiese keine Ehe gab, noch Wehen noch Geburt, so müsse man, sagen sie, folgerichtig schließen, es hätten sich die Seelen der Menschen nicht vervielfältigt, wenn nicht die Gnade der Unsterblichkeit in die Sterblichkeit umschlug und die Ehe mittels der Nachkömmlinge die Natur forterhielt, indem sie statt der Wegsterbenden deren Kinder hereinbrachte. Daher habe die Sünde, die in’s Leben der Menschen eindrang, gewissermaßen Vortheil gebracht. Denn es wäre das Menschengeschlecht auf das Paar der Erstgeschaffenen beschränkt geblieben, wenn nicht die Furcht vor dem Tode die Natur zur Fortpflanzung angeregt hätte. — Allein hierin möchte wohl wieder die wahre Antwort, welche immer es sein mag, nur Denen offenbar sein, welche wie Paulus in die Geheimnisse des Paradieses eingeweiht sind. Die unsere aber ist diese. Als einst die Sadducäer der Lehre von der Auferstehung widersprachen und zur Bekräftigung ihrer Lehrmeinung jenes mehrfach verheirathete Weib, das sieben Brüdern gehört hatte, anführten und dann fragten, wem sie nach der Auferstehung gehören würde, da gab der Herr auf ihre Rede eine Antwort, wodurch er nicht bloß die Sadducäer zurechtwies, sondern auch allen später Lebenden das Geheimniß des Lebens in der Auferstehung offenbarte. Denn „in der Auferstehung,“ sprach er, „nehmen sie weder noch geben sie zur Ehe; sie können ja auch nicht mehr sterben; denn wie Engel sind sie und Kinder Gottes, da sie Kinder der Auferstehung sind.“ Die Gnade der Auferstehung aber verheißt uns nichts Anderes, als die Zurückversetzung der Gefallenen in den früheren Zustand. Eine Art Rückkehr nämlich zum ursprünglichen Leben ist die erwartete Gnade, die den aus dem Paradiese Vertriebenen wieder in dasselbe zurückführt. Wenn nun das Leben der Wiederhergestellten mit dem der Engel verwandt ist, dann war offenbar auch das Leben* vor* der Übertretung ein englisches. Darum wird auch die Rückkehr zum früheren Zustand unseres Lebens den Engeln gleich gestellt. Nun aber sind, obschon, wie gesagt, eine Ehe bei ihnen nicht statt hat, die Heere der Engel in zahllosen Myriaden; denn so hat in seinen Gesichten Daniel erzählt. Auf dieselbe Weise also hätten auch wir, wenn eben keine Verkehrung und Entsetzung von der engelgleichen Würde durch die Sünde bei uns erfolgt wäre, der Ehe nicht bedurft zur Vermehrung; sondern welches immer bei der Natur der Engel die Art der Vermehrung sein mag (unsäglich zwar und unergründlich den menschlichen Vermuthungen, jedenfalls aber findet sie statt),* diese* wäre wohl auch bei den „nur wenig unter die Engel Erniedrigten“ wirksam gewesen, um bis zu dem durch den Rathschluß des Schöpfers bestimmten Maße das Menschengeschlecht zu vermehren. Besteht aber Jemand hartnäckig auf der Frage nach der Entstehungsart der Seelen, falls der Mensch der Vermittlung durch die Ehe nicht bedurfte, so werden auch wir entgegenfragen um die Art der englischen Existenz, wie diese in zahllosen Myriaden sind,* eine* Natur ausmachend und doch eine Vielzahl. Denn auf die Frage: Wie wäre denn ohne die Ehe der Mensch? werden wir antworten: Wie ohne Ehe die Engel sind. Denn daß vor der Übertretung der Mensch diesen ähnlich war, das beweist seine Wiederherstellung in jenen Zustand. Nachdem wir nun Dieses also entschieden haben, müssen wir zur vorigen Untersuchung zurückkehren, wie denn Gott nach der Verfertigung des Bildes den Unterschied von Mann und Weib an dem Gebilde angebracht habe. Denn hiezu, meine ich, ist die eben abgestellte Betrachtung dienlich. Derjenige nämlich, der Alles in’s Sein gerufen und in seinem Willen den* ganzen* Menschen nach dem göttlichen Bilde gestaltet hat, wartete nicht erst, um durch den allmähligen Zuwachs der Nachkommen die Menge der Seelen zu ihrer Vollzahl sich vollenden zu sehen, sondern, indem er durch seine vorsehende Thätigkeit auf einmal in ihrer Gesammtheit die ganze menschliche Natur überschaute und mit dem erhabenen und engelgleichen Loose beehrte, da er durch seine Sehkraft vorhersah, daß ihr Wille nicht auf das Schöne sich hinrichte und darum von dem englischen Leben abfalle, darum legte er, damit nicht die Menge der menschlichen Seelen, die jener Art, nach der die Engel vervielfältigt wurden, entfallen war, verstümmelt werde, das den in Sünde Gefallenen entsprechende Verfahren der Vermehrung in die Natur, indem er statt der englischen Edelgeburt die thierische und unvernünftige Art des aus einander Hervorgehens der Menschennatur einpflanzte. Aus diesem Grunde scheint mir auch der große David, das Elend des Menschen bejammernd, mit folgenden Worten seine Natur beklagt zu haben: „Der Mensch, da er in Ehre war, hat es nicht verstanden,“ indem er „Ehre“ nennt seine Gleichstellung mit den Engeln. „Darum,“ sagt er, „ward er den vernunftlosen Thieren beigezählt und ihnen gleichgestellt.“ Denn wahrhaftig thierartig ist geworden der, der durch seine Neigung zum Materiellen diese flußartige Erzeugung in seine Natur aufnahm.</p><h2>0</h2><p>Ich glaube nämlich, daß aus diesem Anfange auch alle Leidenschaften wie aus einer Quelle zumal strömend das menschliche Leben überfluthen. Beweis aber für diese Behauptung dürfte die Verwandtschaft der Triebe sein, die in gleicher Weise an uns sowohl als an den Thieren sich zeigt. Denn es ist gewiß nicht Recht, der nach dem Bilde Gottes gestalteten Menschennatur die ersten Anfänge der leidenschaftlichen Affizirtheit zuzuschreiben, sondern da das Leben der unvernünftigen Thiere zuerst in diese Welt eintrat, Etwas aber von jener Natur aus dem genannten Grunde auch der Mensch erhielt, die Art der Erzeugung nämlich, so nahm er dadurch auch an dem Übrigen Theil, was an jener Natur bemerkt wird. Denn nicht im Zornesaffekt liegt die Ähnlichkeit des Menschen mit Gott, noch kennzeichnet durch die Lust sich die allerhöchste Natur, und Feigheit und Keckheit, die Sucht nach Erhöhung und der Haß gegen Verringerung und Alles dergleichen ist ferne von dem Gottes würdigen Charakter. Dieß also hat aus dem unvernünftigen Theile die menschliche Natur zu sich herangezogen. Denn, womit das thierische Leben zu seiner Erhaltung ausgerüstet wurde, das wurde, in’s menschliche Leben übertragen, zu Leidenschaften. Durch Zorn nämlich erhalten sich die Fleischfressenden, Wollust bewahrt die vielzeugenden Thiere, die schwachen die Zaghaftigkeit, die für die stärkeren leicht bezwingbaren die Furcht, die fleischreichen die Gefräßigkeit, und das Nichterlangen von irgend Etwas, wonach sie gelüsten, ist bei den unvernünftigen Thieren ein Anlaß zu Mißmuth. Dieß alles und dergleichen ist durch die thierartige Erzeugung in die Natur des Menschen mit hereingekommen. Und man gestatte mir, nach einem gewissen Bildkunstwerke das Menschenbild mit Worten zu zeichnen. Gleichwie man nämlich unter den Bildwerken Doppelgestalten sehen kann, welche die Liebhaber solcher Kunstwerke zur Überraschung Derer, die sie erblicken, verfertigen, indem sie an* einem* Kopfe zwei Gesichter anbringen, so scheint mir der Mensch eine doppelte Ähnlichkeit mit dem Entgegengesetzten an sich zu tragen, indem er einerseits durch das Gott-ähnliche der Vernunft nach der göttlichen Schönheit gestaltet ist, anderseits durch die inwohnenden Leidenschaften die Verwandtschaft mit dem Thierischen an sich trägt. Oft aber verthiert er auch ganz durch die Hinneigung und den Hang zum Unvernünftigen, indem er das Gute durch das Böse ganz verhüllt. Denn wenn Einer hiezu die Vernunftthätigkeit herabzieht und den Verstand zwingt, ein Diener der Leidenschaften zu werden, so geschieht eine Verkehrung des guten Bildes in die thierische Fratze, so daß die ganze Natur hiezu umgemodelt wird, indem der Verstand die Keime der Leidenschaften gleichsam kultivirt und von wenigen zur Menge vermehrt. Denn indem er der Leidenschaft seinen Beistand leiht, macht er üppig und ergiebig den Wachsthum der Thorheiten. So hat die Wollust ihren Anfang zwar in der Ähnlichkeit mit dem vernunftlosen Thiere; allein in den menschlichen Vergehungen hat sie zugenommen, indem sie so vielerlei Wollustsünden erzeugte, als unter den unvernünftigen Thieren nicht zu finden sind. So ist die Aufwallung des Zornes stammverwandt mit dem Triebe der unvernünftigen Thiere, vermehrt aber wird sie durch die Beihilfe der Überlegung. Denn daher kommt der Groll, der Neid, die Lüge, die Hinterlist, die Heuchelei; Das alles kommt von der schlechten Anwendung des Verstandes. Entbehrte nämlich die Leidenschaft der Beihilfe des Verstandes, so bliebe der Zorn kurzdauernd und unnachhaltig, einer Wasserblase gleich zumal entstehend und schnell vergehend. So hat die Gefräßigkeit der Schweine die Habgier eingeführt, und der Stolz des Pferdes ist der Anfang des Übermuthes geworden, und Alles, was je aus der thierischen Unvernunft entspringt, ist durch den schlimmen Gebrauch des Verstandes zum Laster geworden, wie denn auch umgekehrt, wenn der Verstand die Herrschaft über dergleichen Regungen ergreift, jede derselben zu einer Art von Tugend verwandelt wird. Es bewirkt nämlich der Zorn die Mannhaftigkeit, die Zaghaftigkeit Behutsamkeit, die Furcht Folgsamkeit, der Haß Verabscheuung des Bösen, die Liebe das Verlangen nach dem wahrhaft Schönen, der Stolz der Gesinnung erhebt über die Leidenschaften und bewahrt ungeknechtet vom Bösen den Sinn (es lobt aber diese Art der Erhebung auch der große Apostel, indem er stets mahnt, den Sinn nach oben zu richten); und so kann man finden, daß jede derartige Regung, durch die Hoheit der Vernunft mit emporgehoben, nach der Schönheit des göttlichen Bildes mitgestaltet wird. Allein da der Hang zur Sünde gleichsam schwer ist und abwärts zieht, so geschieht öfter das Gegentheil. Denn eher wird durch die Schwere der unvernünftigen Natur das Obere der Seele hinabgezogen als durch die Hoheit der Vernunft das Schwere und Erdhafte emporgehoben. Darum macht unser Elend oft das göttliche Geschenk unerkennbar, indem es wie eine häßliche Larve auf die Schönheit des Ebenbildes die Leidenschaften des Fleisches hinschmiert. Es sind also einigermaßen entschuldbar Diejenigen, welche auf dergleichen hinblicken und dann nicht gerne zugeben, daß hierin die göttliche Bildung sei. Aber durch die, welche ein rechtschaffenes Leben führen, kann man das göttliche Bild in den Menschen sehen. Denn wenn ein Leidenschaftsvoller und fleischlich Gesinnter es unglaublich macht, daß der Mensch wie mit göttlicher Schönheit geschmückt ist, so wird gewiß der an Tugend Erhabene und von Sünden Reine Dir die bessere Ansicht von den Menschen bestätigen. Z. B. (denn es ist besser, durch ein Beispiel die Sache darzuthun) verwischt hat durch den Schmutz der Bosheit die Schönheit der Natur ein bekannter Bösewicht, etwa Jechonias oder ein anderer durch Bosheit Berüchtigter; hingegen in Moses und seines Gleichen hat sich rein erhalten die Wohlgestalt des Bildes. In welchen also die Schönheit nicht getrübt wurde, an Diesen hat man den thatsächlichen Beweis für die Wahrheit, daß der Mensch ein Abbild Gottes ist.</p><p>Aber es schämt sich vielleicht Jemand, daß wir nach Art der unvernünftigen Thiere das Leben durch Speise fristen, und hält darum den Menschen für unwürdig, um als nach dem Bilde Gottes gestaltet zu gelten. Allein er hoffe, daß der Natur dereinst im künftigen Leben Befreiung von diesem Geschäfte zu Theil werden wird. Denn, wie der Apostel sagt, „das Reich Gottes besteht nicht in Essen und Trinken“, „noch lebt der Mensch,“ wie der Herr verkündet hat, „vom Brod allein, sondern von jedem Worte, das aus dem Munde Gottes kommt.“ Aber auch das, daß die Auferstehung uns ein engelgleiches Leben in Aussicht stellt, Essen aber bei den Engeln nicht stattfindet, ist eine hinreichende Bürgschaft dafür, daß der Mensch, der einst nach Art der Engel leben soll, von diesem Geschäfte werde befreit werden.</p><h2>0</h2><p>Aber vielleicht sagt Jemand, es werde ja nicht wieder zur nämlichen Lebensweise der Mensch zurückkehren, wenn anders wir ehedem zwar auf’s Essen angewiesen waren, künftig aber von diesem Geschäfte befreit werden sollen. Allein ich, der ich die heilige Schrift höre, kenne nicht bloß eine körperliche Nahrung und fleischliche Erquickung, sondern ich weiß noch eine andere Speise, die eine gewisse Ähnlichkeit hat mit der des Leibes, deren Genuß aber nur auf die Seele geht. „Esset von meinen Broden,“ ruft die Weisheit den Hungrigen zu, und selig preist die nach solcher Speise Hungernden der Herr. Und: „Wenn Jemand dürstet,“ sagt er, „der komme zu mir und trinke.“ Und: „Trinket Frohsinn“, ruft der große Jesaias Denen zu, die seine Erhabenheit zu verstehen vermögen. Es besteht aber auch eine prophetische Drohung gegen die Strafwürdigen, daß sie mit Hunger sollen gezüchtigt werden. Der Hunger aber ist nicht ein Mangel an Brod und Wasser, sondern ein Fehlen des Wortes. Denn „nicht Hunger nach Brod,“ sagt er, „oder Durst nach Wasser, sondern Hunger zu hören Worte des Herrn.“ Also an eine der Pflanzung Gottes in Eden (Eden aber bedeutet Wohlleben) würdige Frucht muß man denken und nicht zweifeln, daß hievon der Mensch genährt werde, und darf keineswegs an diese vergängliche und hinfällige Nahrung da während des Lebens im Paradiese denken. „Von* allem* Baume im Paradiese,“ heißt es, „magst du essen.“ Wer wird dem auf gesunde Weise Hungernden jenen Baum geben, der im Paradiese ist, der alles Gute in sich schließt, der da heißt:* Alles,* dessen Genuß das Wort dem Menschen gewährt? Denn in dem allgemeinen und allerhabenen Worte sind alle Arten der Güter unter sich verbunden, und eine Einheit ist das Ganze. Wer aber wird mich abwenden von dem gemischten und zweideutigen Genusse des Baumes? Denn gewiß nicht unbekannt ist den Tiefersehenden, was jenes „Alles“ sei, dessen Frucht das Leben ist, und wiederum, was jenes Beigemischte sei, dessen Ende der Tod ist. Denn der den Genuß von Allem neidlos gewährt, der hält gewiß mit Grund* (λόγῳ τινί)* [logō tini] und mit Vorsicht den Menschen von dem Genusse des Gemeinen zurück. Und ich will den großen David und den weisen Salomo als Lehrer zur Erklärung dieses Wortes herbeiziehen. Beide nämlich halten für die* eine* Gnade des eingeräumten Wonnegenusses das wahrhafte Gut selbst, welches eben auch* alles* Gute ist, David, indem er sagt: „Habe deine Wonne an dem Herrn,“ Salomo aber, indem er die Weisheit selbst, welche der Herr ist, „Baum des Lebens“ nennt. Also identisch ist mit dem Baume des Lebens „aller Baum,“ dessen Genuß dem nach Gott Gebildeten (Menschen) das Wort gewährt. Gegenüber aber diesem Baume steht ein anderer Baum, dessen Genuß Erkenntniß des Guten und Bösen ist, nicht als ob er jede von beiden entgegengesetzten Erscheinungen gesondert und theilweise als Frucht trüge, sondern weil er eine Bastard- und Mischlingsfrucht hervorbringt, die aus entgegengesetzten Eigenschaften gemischt ist. Dessen Genuß verbietet der Urheber des Lebens, die Schlange aber räth dazu, um dem Tode den Eingang zu verschaffen. Und der Rathgeber findet Glauben, weil er die Frucht mit schöner Farbe und Süßigkeit umgab, damit sie lieblich aussehe und das Verlangen zum Kosten reize.</p><h2>0</h2><p>Was ist nun das, was die Erkenntniß von Gut und Böse gemischt in sich enthält, im Blüthenschmuck sinnlicher Lüste? Ich werde wohl nicht weit von der Wahrheit vorbeitreffen, wenn ich den Begriff des „Erkennens“ zum Ausgangspunkt der Betrachtung nehme. Denn ich glaube, daß die Schrift hier unter der „Erkenntniß“ nicht eine Wissenschaft verstehe, sondern ich finde einen Unterschied in dem Sprachgebrauche der Schrift zwischen Erkenntniß und beurtheilender Unterscheidung. Denn die einsichtige Unterscheidung des Guten vom Bösen sei Sache höherer Vollkommenheit, sagt der Apostel, und geübter Sinne. Darum befiehlt er auch, Alles zu prüfen, und Sache des Geistigen sei es, sagt er, zu beurtheilen. „Erkenntniß“ aber bedeutet nicht überall das Wissen und die Einsicht, sondern die Neigung zu dem, was man lieb hat. Z. B.: „Es kennt der Herr die Seinigen;“ und zu Moses spricht Er: „Ich erkannte dich vor Allen.“ Von den in Bosheit Mißerkannten aber sagt er, der Alles weiß: „Ich habe euch nie erkannt.“ Der Baum also, von dem man die gemischte Erkenntniß als Frucht bekommt, gehört zu den verbotenen Dingen. Gemischt aber aus Entgegengesetztem ist jene, von der Schlange empfohlene, Frucht, vielleicht in Anbetracht dessen, daß nicht nackt das Böse sich darstellt, an sich selbst in seiner eigenen Natur erscheinend. Denn in der That unwirksam wäre das Böse, wenn es mit nichts Schönem übertüncht wäre, welches zum Verlangen nach jenem den Getäuschten anreizt. Nun aber ist gewissermaßen gemischt die Natur des Bösen, indem es in der Tiefe zwar das Verderben wie eine Falle versteckt enthält, in dem Truge seiner Erscheinung aber einen Anschein des Schönen vorzeigt. Schön scheint den Geldliebhabern der Glanz des Metalls, aber Wurzel aller Übel ist die Geldsucht. Wer aber würde sich in den stinkenden Koth der Unzucht versenken, wenn nicht die Lust für schön und lieblich hielte der durch diesen Köder zur Leidenschaft Hingerissene? So scheinen auch die übrigen Sünden, während sie versteckt die Verderbniß enthalten, im Anfange lieblich und werden in Folge einer Täuschung von den Unachtsamen wie ein Gut erstrebt. Da nun die Meisten das Gute in dem suchen, was die Sinne erfreut, und eine Gleichnamigkeit besteht zwischen dem wahrhaft und dem scheinbar Guten, darum wird die auf das Böse als auf ein Gut gehende Begierde von der Schrift Erkenntniß des Guten und Bösen genannt, um eine gewisse Zusammensetzung und Mischung der Erkenntniß zu bezeichnen. Nicht für absolut schlecht, weil sie umblümt ist mit dem Guten, noch für rein gut, weil darunter versteckt ist das Böse, sondern für gemischt aus beiden erklärt sie die Frucht des verbotenen Baumes, deren Genuß in den Tod stürze, wie es heißt, die davon Kostenden, indem sie beinahe deutlich die Lehre ausspricht, das wahrhaft Gute sei einfach und einheitlich von Natur, aller Zwiespaltigkeit und Verbindung mit dem Gegentheil fremd; das Böse aber sei bunt und aufgeputzt, etwas Anderes scheinend und als etwas Anderes in der Erfahrung sich zeigend, dessen Erkenntniß, d. h. erfahrungsmäßige Bekanntschaft damit, des Todes und Verderbens Anfang und Grundlage sei. Darum zeigt die Schlange die schlimme Frucht der Sünde vor, indem sie nicht, wie es von Natur ist, das Böse offen herzeigte (denn nicht täuschen hätte der Mensch sich lassen durch das offenbare Böse), sondern indem sie mit einem gewissen Blüthenschmuck dessen Erscheinung zierte und eine gewisse Sinnenlust dem Geschmacke einzauberte, erschien sie dem Weibe glaubwürdig, wie die Schrift erzählt. Denn „es sah das Weib,“ heißt es, „daß der Baum gut sei zum Essen und reizend für die Augen zum Ansehen und lieblich zum Kosten, und sie nahm und aß von seiner Frucht.“ Jene Speise aber wurde den Menschen Mutter des Todes. Das also ist die Mischlingsfrucht, indem die Schrift deutlich den Sinn erklärt, in welchem Baum der Erkenntniß des Guten und Bösen genannt ward jener Baum, weil er nämlich wie die mit Honig versetzten schädlichen Gifte, sofern er die Sinnesempfindung kitzelt, gut zu sein scheint, sofern er aber den Kostenden zu Grunde richtet, das Äusserste alles Übels ist. Nachdem also das verderbliche Gift wider das Leben des Menschen gewirkt hat, da ist der Mensch, das der Sache und dem Namen nach hohe Wesen, das Ebenbild der göttlichen Natur, der Nichtigkeit, wie der Prophet sagt, ähnlich geworden. Also das Ebenbild gehört zu dem besseren Theile unseres Wesens; Alles aber, was an unserem Leben traurig und elend ist, ist ferne von der Ähnlichkeit mit Gott.</p><h2>0</h2><p>Allein nicht so mächtig ist das Böse, daß es die gute Macht überwände, noch ist stärker und dauerhafter als die Weisheit Gottes die Unbesonnenheit unserer Natur. Es ist ja nicht möglich, daß das Wandelbare und Veränderliche siegreicher und dauerhafter sei als das stets sich gleich Bleibende und im Guten Gefestete; sondern der göttliche Wille ist überall und durchaus unabänderlich, die Wandelbarkeit unserer Natur aber bleibt nicht einmal im Bösen beharrlich. Denn was* jedenfalls* immer in Bewegung ist, wird, wenn es zum Guten vorangeht, wegen der Unendlichkeit des zu durchschreitenden Gebietes die Vorwärtsbewegung nie endigen; es wird ja des Erstrebten (des Guten) kein Ende finden, mit dessen Erreichung es die Bewegung einmal einstellen müßte. Wenn es sich aber in entgegengesetzter Richtung bewegt, so muß, wann es den Lauf der Bosheit vollendet hat und am Grenzziel des Bösen angelangt ist, alsdann die Rastlosigkeit des Dranges, die keinen natürlichen Stillstand findet, nachdem sie den Raum der Bosheit durchlaufen hat, die Bewegung nothwendig zum Guten hinwenden. Da nämlich die Bosheit nicht in’s Endlose fortgeht, sondern durch nothwendige Schranken begrenzt ist, so beginnt natürlich an der Grenze der Bosheit wieder die Macht des Guten, und so läuft, wie gesagt, die Rastlosigkeit unserer Natur zuletzt wieder auf den guten Weg zurück, durch das Andenken an die vorherigen Unfälle gewitzigt, nicht wieder in ähnliche sich zu verfangen. Somit wird wieder im Guten dahingehen unser Lauf, weil mit nothwendigen Grenzen umschränkt ist die Natur des Bösen. Gleichwie nämlich die Himmelskundigen sagen, vom Lichte sei die ganze Welt erfüllt, die Finsterniß aber entstehe als Schattenwurf durch den Widerstand des Erdkörpers; allein diese zwar werde gemäß der Gestalt des kugelförmigen Körpers rückwärts vom Sonnenstrahle kegelförmig abgeschlossen, die Sonne aber, welche die Erde an Größe vielmal übertrifft und sie von allen Seiten mit ihren Strahlen rings umgibt, vereinige am Ende des Kegels die Lichtströme, so daß, gesetzt es könnte Jemand den ganzen Raum durchschreiten, soweit der Schatten sich erstreckt, er jedenfalls in nicht vom Dunkel unterbrochenes Licht gelangte; — so, glaube ich, muß man auch von uns annehmen, daß wir nach Überschreitung der Grenze des Bösen, wenn wir an der Spitze des Sündenschattens angelangt sind, wieder im Lichte wandeln werden, weil unendlichfach über das Maaß des Bösen die Natur des Guten hinausragt. Wieder also wird kehren das Paradies, wieder jener Baum, der ja auch Lebensbaum ist, wieder die Schönheit des Ebenbildes und die Würde der Herrschaft. Ich meine damit Nichts von alle dem, was dermalen zur Nothdurft des Lebens Gott den Menschen unterworfen hat, sondern auf ein anderes Reich geht die Hoffnung, dessen Wesen ein Geheimniß bleibt.</p><h2>0</h2><p>Doch halten wir uns an die Reihenfolge der Untersuchungen. Denn vielleicht hält Mancher, der nach dem Süß der Hoffnung im Geiste sich beschwingt, es für Beschwer und Verlust, nicht schneller zu jenen Gütern zu gelangen, welche über menschliche Empfindung und Erkenntniß hinausgehen, und stellt sich als schrecklich vor die Länge der Zwischenzeit bis zu dem Ersehnten hin. Allein er gräme sich nicht wie ein Kind, das den kurzen Aufschub seiner Vergnügen schwer erträgt. Denn da durch Vernunft (Wort) und Weisheit Alles verwaltet wird, so muß man durchaus glauben, daß Nichts geschehe ohne die Vernunft (das Wort) selbst und die darin enthaltene Weisheit. Du frägst nun, was das für ein Vernunftgrund* (λόγος)* [logos] sei, wonach die Umwandlung des trauervollen Daseins in den ersehnten Zustand nicht sogleich geschieht, sondern dieses lästige und körperhafte Leben bis zu gewissen bestimmten Zeiten fortwährt und das Ziel der Vollendung des Alls abwartet, damit erst dann, wie von einem Zaume befreit, das menschliche Leben wieder entbunden und frei zu dem seligen und leidenslosen Dasein zurücklaufe? Allein ob zwar der Wahrheit nahe komme die Antwort auf diese Frage, wird genau wohl die Wahrheit selbst wissen; was nun aber in unseren Sinn kam, ist Dieses. Ich beginne mit Wiederaufnahme der vorigen Rede. „Laßt uns,“ spricht Gott, „den Menschen machen nach unserem Bilde und Gleichnisse; und es schuf Gott den Menschen, nach dem Bilde Gottes schuf er ihn.“ Das Bild Gottes also, das in der* ganzen* menschlichen Natur sich zeigt, war vollendet, Adam aber war noch nicht; denn nach etymologischer Bedeutung heißt Adam das Erdgebilde, wie die Kenner der Sprache der Hebräer sagen. Darum nennt auch der Apostel, der die Muttersprache der Israeliten genau kannte, den aus Erde gebildeten Menschen irdisch (choisch), indem er den Namen Adam gleichsam in’s Griechische übersetzte. Es entstand also nach dem Bilde der Mensch, die* Gesammt<em>-Natur, das gottähnliche Wesen, es entstand aber durch die allmächtige Weisheit nicht ein</em> Theil* des Ganzen, sondern zumal die* ganze* Fülle der Natur. Es sah der alle Enden Umfassende, wie die Schrift sagt in der Stelle: „In seiner Hand sind die Enden der Erde,“ es sah der Alles Wissende und, bevor es geschieht, mit seiner Erkenntniß Umgreifende, wie groß an Zahl in den einzelnen Individuen die Menschheit sein werde. Da er aber in unserem Gebilde die Neigung zum Bösen erkannte und daß es, seiner Gleichstellung mit den Engeln freiwillig entlaufen, die Gemeinschaft mit dem Niedrigen sich aneignen werde, darum mischte er auch von dem Unvernünftigen Etwas in sein Ebenbild. Denn in der* göttlichen* und seligen Natur ist der Unterschied nach Mann und Weib nicht; sondern die Eigenthümlichkeit der* thierischen* Ausstattung auf den Menschen übertragend, gibt er unserem Geschlechte eine Vermehrung, die der Erhabenheit unserer Erschaffung nicht entspricht. Denn nicht damals, als er das Ebenbildliche schuf, verlieh er dem Menschen die Macht, zu wachsen und sich zu mehren, sondern als er ihn durch den Unterschied nach Mann und Weib unterschied, da sprach er: „Wachset und mehret euch und erfüllet die Erde.“ Denn das ist keine Eigenschaft der göttlichen Natur, sondern der thierischen, wie die Erzählung nebenbei bemerkt, indem sie anführt, daß Gott Dieß zuerst in Betreff der Thiere gesprochen habe. Falls er daher,* bevor* er der Natur den Unterschied nach Mann und Weib beifügte, dem Menschen die durch diesen Ausspruch verliehene Macht sich zu mehren gegeben hätte, so bedürften wir wohl nicht dieser Art der Erzeugung, durch welche die Thiere erzeugt werden.</p><p>Da also durch die vorwissende Thätigkeit diese Gesammtheit der Menschen vorgesehen war, welche durch die mehr thierartige Erzeugung in’s Leben treten sollte, so hat der Alles nach Ordnung und Zusammenhang lenkende Gott, weil gerade diese Art der Erzeugung für die Menschheit nöthig machte der Hang unserer Natur zu dem Niedrigen, den vor seinem Entstehen kannte der das Künftige ebenso wie das Gegenwärtige Schauende, deßhalb auch das der Natur der Menschen angemessene* Zeitmaaß* vorgesehen, so daß mit dem Vorübergang der vorbestimmten Seelen zugleich auch die Dauer der Zeit sich abschließt und dann die flußartige Bewegung der Zeit stillsteht, wenn nicht mehr sich fortpflanzt in ihr die Menschheit; nach vollendeter Erzeugung der Menschen aber zugleich mit dem Ende dieser auch die* Zeit* ein Ende hat und so die Auflösung des Alls in seine Elemente eintritt und zugleich mit der Umwandlung des Ganzen auch die Menschheit versetzt wird aus dem verweslichen und erdhaften in den leidenslosen und ewigen Zustand. Das scheint mir auch der göttliche Apostel im Sinne gehabt zu haben, wenn er im Briefe an die Korinther den plötzlichen Stillstand der Zeit und die Auflösung des in Bewegung Begriffenen in den früheren Zustand vorhersagt mit den Worten: „Siehe, ich sage euch ein Geheimnis; wir werden zwar nicht alle entschlafen, aber alle verwandelt werden, im Momente, im Augenblick, bei der letzten Posaune.“ Denn damit hat er, wie ich glaube, gelehrt: Wenn die Vollzahl der menschlichen Natur nach dem vorgesehenen Maaße zum Abschluß gelangt sein werde, weil Nichts mehr fehlt an der Zahl der Seelen zu weiterer Vermehrung, dann werde im Nu der Zeit die Umwandlung der Dinge geschehen, indem er Moment und Augenblick nennt jenen Punkt der Zeit und das ausdehnungslose Ende, so daß es dem am letzten und äussersten Grenzpunkte der Zeit Angekommenen, weil an der Grenze kein Theil mehr übrig ist, nicht mehr möglich sei, diese allmählige Umwandlung mittelst des Todes durchzumachen, sondern, wenn einmal die das Todte erweckende Posaune der Auferstehung erschollen sei, dann würden auch die noch im Leben Befindlichen gleich den aus der Auferstehung sich Verwandelnden auf einmal zur Unsterblichkeit umgewandelt werden, so daß nicht mehr die Last des Fleisches nach unten zieht und an die Erde fesselt die Masse, sondern erhaben durch die Luft der Flug geht. Denn „entrückt werden“, sagt er, „werden wir auf Wolken dem Herrn entgegen in die Luft und so allzeit bei dem Herrn sein.“</p><p>Man warte also die Zeit ab, die nothwendig so lange dauert als die Vermehrung der Menschheit. Denn auch die Patriarchen um Abraham hatten das Verlangen, die Güter zu schauen, und ließen nicht ab, das himmlische Vaterland zu suchen, wie der Apostel sagt; aber gleichwohl sind sie noch in Erwartung der Gnade, indem Gott nach dem Ausspruche des Paulus „etwas Besseres für uns vorgesehen hat, damit sie“, sagt er, „nicht ohne uns vollendet würden.“ Wenn also Jene den Aufschub ertragen, die von ferne bloß im Glauben und der Hoffnung die Güter schauten und begrüßten, indem sie, wie der Apostel bezeugt, die Sicherheit des Genusses ihrer Hoffnungen in den Glauben an die Treue des Verheissenden setzten, was müssen wir, die große Masse, thun, die auf Grund des Lebenswandels das Bessere gar nicht hoffen können? Es schmachtete vor Verlangen auch des Propheten Seele, und er bekennt im Psalmgesang diese Liebessehnsucht, indem er sagt, es sehne sich und schmachte seine Seele, in die Vorhöfe des Herrn zu gelangen, wenn er auch unter die Letzten sollte verworfen werden, weil es besser und Wünschenswerther sei, unter Jenen der Letzte zu sein, als in den sündhaften Wohnungen des Lebens der Erste. Aber gleichwohl ertrug er den Aufschub, indem er zwar selig preist den Aufenthalt dortselbst und den kurzen Genuß der Zeit von tausenden vorzieht (denn „besser,“ sagt er, „<em>ein</em> Tag in deinen Vorhöfen als tausende“), aber er grollte nicht über die nothwendige Ordnung der Dinge und hielt es für hinlänglich zur Seligpreisung für die Menschen, auch nur in Hoffnung die Güter zu besitzen. Darum sagt er am Ende des Psalmes: „Herr, Gott der Mächte, selig der Mensch, der auf dich hofft.“ Auch wir also müssen uns nicht grämen über den kurzen Aufschub des Gehofften, sondern uns beeifern, damit wir nicht etwa des Gehofften verlustig werden. Denn gleichwie, wenn Jemand Einem der Unerfahrneren vorhersagen würde, daß zur Sommerszeit die Einsammlung der Früchte stattfinden, und daß voll die Magazine, und angefüllt mit Speisen der Tisch sein werde zur Zeit des Überflusses, Derjenige ein Thor sein würde, der die Ankunft der Zeit beschleunigen wollte, da man ja erst Samen streuen und mit Sorgfalt die Früchte sich zubereiten muß (denn die rechte Zeit wird, man mag wollen oder nicht, jedenfalls zur bestimmten Frist kommen, nicht auf gleiche Weise aber werden sie sehen der, welcher sich den Überfluß der Früchte vorherbereitet hat, und der, welcher aller Vorarbeit baar von der Früchtezeit überrascht wird):* so,* glaube ich, darf man, da durch die göttliche Verkündung Allen bekannt ist, daß die Zeit der Umwandlung kommen wird, nicht vorwitzig sein um die Zeiten (denn es sei nicht an uns, sprach er, die Zeiten zu kennen und Fristen) noch Berechnungen anstellen, wodurch man die Seele nur schwächt in der Hoffnung auf die Auferstehung, sondern muß auf den Glauben an das zu Erwartende gestützt durch einen guten Wandel um die künftige Gnade sich vorbewerben.</p><h2>0</h2><p>Wenn aber Jemand im Hinblick auf den gegenwärtigen in gewisser Stetigkeit dahingehenden Lauf der Welt, worin der Zeitunterschied statt hat, es für unmöglich erklärt, daß der vorher verkündete Stillstand des Bewegten eintreten werde, so glaubt ein Solcher offenbar auch nicht, daß im Anfange Himmel und Erde durch Gott geworden sei. Denn wer der Bewegung einen Anfang zugesteht, der zweifelt gewiß nicht bezüglich des Endes, und wer das Ende nicht zuläßt, der nimmt auch den Anfang nicht an. Allein gleichwie wir denken, daß die Welten durch das Wort Gottes vollendet wurden, indem wir glauben, wie der Apostel sagt, daß aus dem Unsichtbaren das Sichtbare geworden sei, denselben Glauben müssen wir auch dem Ausspruche Gottes schenken, der den nothwendigen Stillstand der Dinge angekündigt hat. Das Wie aber ist von der Nachforschung auszunehmen; denn auch dort haben wir durch den* Glauben* die Verwirklichung des Sichtbaren aus dem noch nicht Erscheinenden angenommen, die Frage nach dem Unerforschbaren bei Seite lassend. Und doch hat uns die Sache in vielen Stücken Schwierigkeiten gemacht, da sie nicht geringe Anlässe zum Zweifel an dem Geglaubten darbietet. Denn auch dort war für die Disputirer Gelegenheit, durch Vernunftgründe folgerungsweise den Glauben zu bestreiten, um nicht als wahr gelten zu lassen die der materiellen Schöpfung vorangehende Erzählung, welche die heilige Schrift bezeugt, indem sie versichert, alle Dinge hätten aus Gott ihren Ursprung. Denn die Vertreter der gegentheiligen Ansicht behaupten, gleichewig mit Gott sei die Materie, indem sie derlei Schlüsse gegen das Dogma vorbringen: Wenn Gott einfach ist von Natur, immateriell, ohne Qualität und Quantität, unzusammengesetzt und frei von gestalthafter Umgrenzung, alle Materie aber in räumlicher Ausdehnung wahrgenommen wird und sich der Wahrnehmung durch die Sinne nicht entzieht, indem sie in Farbe, Gestalt, Schwere, Größe, Widerstand und den übrigen Merkmalen, die sie hat, sich darstellt, wovon Nichts an der göttlichen Natur zu bemerken möglich ist, wie konnte dann aus dem Immateriellen die Materie hervorgehen, aus dem Unräumlichen die räumliche Natur? Glaubt man nämlich, aus Jenem habe Dieses seinen Bestand, so ist es offenbar als in ihm seiend auf geheimnißvolle Weise so in’s Dasein hervorgetreten. War aber in Jenem das Materielle, wie ist dann immateriell der die Materie in sich Habende? Ebenso aber ist es auch mit allen übrigen Kennzeichen der materiellen Natur. Wenn in Gott die Quantität ist, wie ist Gott ohne Quantität? Wenn in ihm das Zusammengesetzte, wie ist er einfach und ohne Theile und Zusammensetzung? Daher muß er entweder materiell sein, dazu nöthigt die Logik, weil die Materie von ihm herrührt, oder, will man das nicht, so muß man annehmen, die Materie sei von ihm zur Erschaffung des Alls von aussen herzugebracht worden. War sie nun ausser Gott, so war sie jedenfalls etwas Anderes neben Gott, was in Hinsicht der Ewigkeit mit dem ungeworden Seienden zugleich gedacht wird, so daß man zwei Anfangslose und Ungewordene im Denken mit einander in Eins zusammenfaßt, das künstlerisch Wirkende und das diese planvolle Wirksamkeit Aufnehmende. Und wollte man demgemäß annehmen, von ewig her sei dem Werkmeister aller Dinge die Materie zur Hand, welch’ große Unterstützung für seine Glaubenssätze wird da der Manichäer finden, welcher das materielle Prinzip der Ursprunglosigkeit nach der guten Natur an die Seite stellt? Nun aber sind wir sowohl davon,* daß* Alles aus Gott sei, auf die Versicherung der Schrift hin überzeugt, als auch nehmen wir uns nicht heraus, das,* wie* es in Gott war, als etwas unseren Begriff Übersteigendes, zu ergrübeln in der Überzeugung, der göttlichen Macht sei Alles möglich, sowohl das Nichtseiende in’s Dasein zu rufen, als auch dem Seienden nach Gutdünken die Beschaffenheiten zu verleihen. Folgerichtig also, wie wir für das Seiende zu seiner Erschaffung aus Nichts für genügend halten die Macht des göttlichen Willens, so werden wir auch, wenn Wir die Wiederauslösung des Bestehenden auf dieselbe Macht zurückführen, für nichts Unglaubliches den Glauben in Anspruch nehmen. Und doch ist es vielleicht wohl möglich, durch eine gewisse Begriffserfindung die über die Materie Nergelnden zu überzeugen, daß sie nicht meinen dürfen, man könne Nichts erwidern auf den Angriff gegen unseren Glauben.</p><h2>0</h2><p>Keineswegs nämlich ausserhalb der folgerichtigen Denkbestimmungen erscheint die Annahme hinsichtlich der Materie, welche behauptet,* dieselbe habe aus dem Intelligiblen und Immateriellen ihren Bestand;* denn wir werden finden, daß die ganze Materie aus gewissen Qualitäten bestehe, mit deren Hinwegnahme sie an sich gar nicht mehr durch den Begriff kann erfaßt werden. Nun aber wird jede Art von Eigenschaft begrifflich von ihrem Subjekte (dessen sie ist) getrennt. Der Begriff aber ist eine geistige und keine körperhafte Anschauung. Zum Beispiel, wenn ein Thier oder ein Baum der Betrachtung vorliegt, oder sonst etwas Materielles, so bemerken wir durch die gedankenmäßige Unterscheidung an dem Gegenstande Vieles, wovon der Begriff eines Jeden mit den übrigen Merkmalen Nichts gemein hat. Denn ein anderer ist der Begriff der Farbe und ein anderer der der Schwere, deßgleichen der der Größe und der der eigenthümlichen Beschaffenheit bei der Betastung. Denn die Weichheit und die Zweielligkeit und die übrigen Prädikate sind dem Begriffe nach weder zu einander noch zum Körper gehörig. Denn die begriffliche Bestimmung eines jeden derselben wird als eine besondere für sich gedacht, die Nichts gemein hat mit irgend einer andern der an dem Subjekte bemerkbaren Eigenschaften. Ist nun* begrifflich* die Farbe, begrifflich aber auch die Festigkeit und die Größe und die übrigen derartigen Eigenschaften, und wird, falls eine jede derselben von dem Gegenstande hinweggenommen würde, damit zugleich auch der Begriff des Körpers aufgelöst, so dürfte es wohl folgerichtig sein, anzunehmen, daß, welcher Merkmale* Abwesenheit* wir als Ursache der Auflösung des Körpers erkannten, dieser* Zusammentreffen* die materielle Natur constituire. Denn wie das kein Körper ist, dem die Farbe, die Gestalt, der Widerstand, die Ausdehnung, die Schwere und die übrigen Merkmale nicht zukommen, jedes aber von diesen nicht Körper ist, sondern als etwas Besonderes, vom Körper Verschiedenes sich zeigt, so machen umgekehrt die genannten Merkmale, wo sie zusammentreffen, die körperliche Substanz aus. Nun aber, wenn geistig* (νοητή)* [noētē] ist die Auffassung dieser Eigenschaften, geistig aber von Natur die Gottheit, so ist es nicht unwahrscheinlich, daß aus der unkörperlichen Natur diese geistigen Anfänge zur Entstehung der Körper herrühren, indem die geistige Natur die* geistigen Kräfte* hergibt, die Vereinigung dieser aber mit einander die materielle Natur in’s Dasein führt. Allein Dieß soll uns nur nebenbei untersucht sein. Wir müssen aber wieder auf den Glauben die Rede zurücklenken, durch den wir annahmen, aus dem Nichtsein sei das All entstanden, und, von der Schrift belehrt, nicht zweifeln, es werde auch wieder in einen ganz andern Zustand umgesetzt werden.</p><h2>0</h2><p>Indeß vielleicht erklärt Jemand, auf die aufgelösten Körper hinblickend und nach dem Maße der eigenen Kraft die Gottheit beurtheilend, die Auferstehung für ein unmögliches Ding, indem er behauptet, es gehe nicht an, daß das jetzt sich Bewegende dereinst stillstehen und das jetzt Bewegungslose (Todte) dereinst auferstehen solle. Allein ein Solcher erachte als ersten und größten Beweis für die Wahrheit der Auferstehung die Glaubwürdigkeit ihrer Verkündung. Der Glaube aber an die Verheissungen hat in dem Eintreffen der übrigen Vorhersagungen seine Bürgschaft. Denn da die heilige Schrift viele und allerlei Aussprüche hingestellt hat, so kann man, wenn man darauf achtet, wie die übrigen Aussprüche sich zu Lüge oder Wahrheit verhalten, nach diesen auch die Lehre von der Auferstehung beurtheilen. Wenn nämlich in den übrigen Dingen als falsch und unwahr ihre Aussprüche sich erweisen, so ist allerdings auch diese Lehre nicht untrüglich; hat aber alles Übrige als Zeugin für seine Wahrheit die Erfahrung, so dürfte es wohl folgerichtig sein, um dessen willen auch die Vorhersagung betreffs der Auferstehung für wahr zu halten. Erinnern wir uns also einer oder zweier Weissagungen und vergleichen wir mit dem Vorhergesagten den Ausgang, um daraus zu erkennen, ob das Wort der Wahrheit gemäß sei. Wer weiß nicht, in welcher Blüthe vor Alters das israelitische Volk stand, da es sich gegen alle Herrschaften auf Erden erhob? wie prächtig die Königsburg in der Stadt Jerusalem war? wie herrlich die Mauern, die Thürme, der Prachtbau des Tempels? Dinge, die auch den Jüngern des Herrn staunenswerth erschienen, und auf die sie auch den Herrn aufmerksam zu machen für werth hielten, indem sie, verwundert über den Anblick, wie die Evangelien-Geschichte berichtet, zu ihm sagten: „Was sind das für Werke, und was sind das für Gebäude!“ Er aber verkündete den das Gegenwärtige Bewundernden die künftige Verödung des Ortes und die Vernichtung jener Pracht, indem er sagte, in Kurzem werde Nichts von dem, was man sehe, mehr da sein. Aber auch zur Zeit des Leidens folgten ihm die Frauen, seine ungerechte Verurtheilung beklagend; denn sie hatten noch keinen Einblick in die Heilsordnung der Dinge. Er aber heißt sie über sein Schicksal schweigen, es sei ja auch nicht der Thränen werth; verschieden aber sollten sie den Jammer und Weheruf auf die wahre Zeit der Thränen, wann von den Belagerern die Stadt umzingelt sein und bis zu solcher Drangsal gestiegen sein würden die Leiden, daß man für glücklich halten würde den Nichtgebornen. Hiebei prophezeite er auch den Greuel der Mutter, die ihr Kind aß, indem er sprach, selig preisen werde man in jenen Tagen den Leib, der nicht gebar. — Wo ist nun jene Königsburg? wo der Tempel? wo die Mauern? wo die Schutzwehren der Thürme? wo die Herrschaft der Israeliten? Sind sie nicht beinahe über die ganze Erde da- und dorthin zerstreut worden und zugleich mit ihrem Untergange auch die Königsburg gestürzt? Mir scheint nämlich Dieß und dergleichen der Herr vorausgesagt zu haben nicht der Ereignisse selbst wegen (denn welch’ ein so großer Gewinn war für die Hörer die Weissagung der jedenfalls kommenden Dinge? Sie hätten ja, auch ohne Vorbelehrung, durch Erfahrung inne geworden, was kommen sollte), sondern damit hiedurch auch ihr Glaube an das Größere eine Bürgschaft erhalte. Denn die Bestätigung des Einen durch den Erfolg ist auch für die Wahrheit des Andern ein Beweisgrund. Denn gleichwie, wenn bei der Erzählung eines Landmannes von der Kraft der Samenkörner ein des Feldbaues Unkundiger etwa ungläubig wäre, es zum Beweis der Wahrheit für den Landmann hinreichen würde, an* einem* der im Schäffel befindlichen Körner die Kraft zu zeigen und hinsichtlich der übrigen zu verbürgen (denn wer das* eine* Waizen- oder Gerstenkorn, oder was etwa sonst im vollen Schäffel ist, nach dem Einsenken in die Erdscholle zur Ähre geworden sieht, der dürfte wohl im Hinblick auf das eine auch betreffs der übrigen nicht zweifeln), ebenso scheint mir zum Zeugnisse für das Geheimniß der Auferstehung hinzureichen die den übrigen Aussagen allgemein zugestandene Wahrheit, mehr aber noch die Erfahrung der Auferstehung selbst, die wir nicht so fast durch Worte als durch die Werke selbst erfahren haben.</p><p>Denn da groß und schwer zu glauben war das Auferstehungswunder, so begann Er mit den geringeren Wunderthaten und gewöhnte so gewissermaßen allmählig unseren Glauben an die größeren. Denn wie eine ihr Kind auf entsprechende Art nährende Mutter dem annoch zarten und weichen Munde die Milch durch die Brust reicht, dem bereits zahnenden und erstarkenden aber das Brod zuführt, nicht rauhes und unverarbeitetes, damit nicht etwa durch die Härte der Nahrung das zarte und ungeübte Zahnfleisch zerrissen werde, sondern solches, das sie zuerst mit den eigenen Zähnen zermalmt und so der Kraft des Genießenden angemessen und entsprechend gemacht hat, und dann nach Maßgabe der zunehmenden Kraft, das an zartere Kost gewohnte Kind allmählig der festeren Nahrung zuführt, — so gibt, die menschliche Kleinherzigkeit wie ein unmündiges Kind durch die Wunder nährend und ammelnd, der Herr zuerst bei einer hoffnungslosen Krankheit ein Vorspiel von der Macht der Auferstehung, was zwar an sich ein großes Wunder war, aber doch nicht von der Art, daß man es nicht glauben sollte, wenn es erzählt wird. Indem er nämlich das Fieber bedrohte, welches heftig die* Schwiegermutter des Simon* quälte, bewirkte er eine so große Änderung des Übels, daß zur Bedienung der Anwesenden erstarkte die schon dem Tode nahe Geglaubte. — Sodann legt er der Kraft ein wenig zu, und an dem* Sohne des königlichen Beamten,* der in anerkannter Gefahr lag (denn so erzählt der Bericht, daß er am Sterben war, als der Vater rief: „Komm’ herab, ehe der Knabe stirbt“), bewirkt er wieder die Auferstehung des schon fast für todt Gehaltenen, indem er mit größerer Kraft das Wunder vollbrachte, da er ja dem Orte gar nicht nahe kam, sondern von ferne durch die Macht des Befehls das Leben sendete. — Und wiederum steigt er stufenweise zu höheren Wundern hinan. Denn als er zur* Tochter des Synagogenvorstehers* ging, verzögerte er absichtlich seinen Gang, indem er die heimlich geschehene Heilung des Blutflusses öffentlich bekannt werden ließ, damit unterdessen über die Kranke der Tod Herr würde. Als nun soeben die Seele sich vom Leibe getrennt hatte und im Wehe-Geschrei stöhnten die den Unfall Bejammernden, da ruft er wie aus Schlaf durch sein Befehlswort wieder zum Leben das Mädchen, indem er methodisch und stufenweise zum Größeren emporhob die menschliche Schwäche. — Dann geht er auch darüber hinaus im Wunder und bahnt durch einen noch höheren Machterweis den Menschen den Weg zum Glauben an die Auferstehung. Von* Naim,* einer Stadt in Judäa, erzählt die Schrift: In ihr war ein* Jüngling,* der Eingeborne einer Wittwe, nicht mehr so jung, daß er zu den Knaben gehörte, sondern bereits von den Knaben zu den Männern übertretend; Jüngling nennt ihn die Schrift. Vieles in Wenigem erzählt die Geschichte; ein Klagelied geradezu ist die Erzählung. Eine* Wittwe,* heißt es, war die Mutter des Todten. Siehst du die Schwere des Unglücks, wie in Wenigem den Schmerz der Bericht tragisch darstellte? Denn was ist es, was gesagt wird? Sie hatte auf Kindersegen keine Hoffnung mehr, welche das Unglück dieses Verlustes hätte mildern können; denn Wittwe war das Weib. Sie konnte auf keinen Anderen statt des Dahingeschiedenen blicken, denn ihr* einziger* Sohn war es. Wie groß aber das dießfällige Unglück ist, wird Jeder leicht einsehen, der sich der Natur nicht entfremdet hat. Ihn allein hat sie in Wehen erkannt, ihn allein an ihren Brüsten genährt, er allein machte ihr fröhlich den Tisch, er allein war der Grund der häuslichen Fröhlichkeit. Bei Spiel und ernster Beschäftigung, bei Körperübung und Erlustigung, auf Vorplätzen, in Ringschulen und Jugend-Genossenschaften war Alles, was den Augen der Mutter lieb und werth war, er allein, er, der bereits das für die Ehe geeignete Alter hatte, der Stammhalter des Geschlechts, der Sprosse der Nachfolgerschaft, die Stütze des Alters. Aber auch die beigefügte Erwähnung seiner Jugend ist ein anderes Klagelied. Denn der ihn einen* Jüngling* nennt, bezeichnete damit die Blüthe der nun verwelkten Jugendzeit, einen eben in den Flaumhaaren Grünenden, noch nicht tief hinein mit Bart Überwachsenen, noch in der Schönheit der Wangen Glänzenden. Was also mußte wohl die Mutter um ihn dabei leiden? Wie Feuer mußte es ihr im Innern brennen. Wie bitter mußte sie um ihn die Wehklage hindehnen, zerschmelzend vor dem daliegenden Leichnam, so daß sie dem Todten die Bestattung wohl nicht beschleunigte, sondern ihrem Leid sich überließ, die Klagen um ihn so lang als möglich hinausdehnend! Und auch das hat der Bericht nicht übergangen. Denn „als Jesus sie sah“, heißt es, „da ward er gerührt, und hinzutretend berührte er den Sarg, die Träger aber hielten still. Und er spricht zum Todten: Jüngling, ich sage dir, steh’ auf! Und er übergab ihn lebend seiner Mutter.“ Nachdem er also bereits seit geraumer Zeit todt und nur noch nicht in’s Grab gelegt war, geschieht von dem Herrn das noch größere Wunder, wiewohl durch gleichen Befehl. — Aber zu noch Höherem schreitet das Wunderwirken fort, damit die sichtbaren Vorgänge dem noch nicht geglaubten Auferstehungswunder noch näher kämen. Krank war Einer der Vertrauten und Freunde des Herrn;* Lazarus* hieß der Kranke. Und es lehnt der Herr den Besuch des Freundes ab, indem er von dem Kranken ferne blieb, damit in Abwesenheit des Lebens der Tod Gelegenheit und Macht finde, durch die Krankheit sein Werk zu thun. Es eröffnete den Jüngern der Herr in Galiläa den Trauerfall mit Lazarus, aber auch seinen Aufbruch zu ihm, um den darnieder Liegenden wieder aufstehen zu machen. Furchtvoll aber waren Jene wegen der Wildheit der Juden, indem sie es für bedenklich und gefährlich hielten, sich wieder nach Judäa mitten unter die Mordthäter zu begeben. Und darum machen sie zögernd und zaudernd den Hinaufgang von Galiläa. Es obsiegte nämlich die Übermacht, und getrieben wurden von dem Herrn die Jünger, gleich als sollten sie die Vorweihe der allgemeinen Auferstehung in Bethanien feiern. Vier Tage bereits waren es nach dem Tode. Alle Herkömmlichkeiten waren an dem (aus Ber.: lies „dem“ statt „den“) Gestorbenen vollzogen; im Grabe geborgen war der Leib. Natürlich war er bereits aufgeschwollen und löste sich auf zur Verwesung, indem in der Fäulniß der Erde moderte und naturnothwendig zerfiel der Leib. Widerlich war der Anblick, da die Natur gezwungen wurde, das bis zum Gestank Aufgelöste wieder herauszugeben zum Leben. Da wird für das unglaubliche Werk der allgemeinen Auferstehung durch ein recht augenfälliges Wunder der Beweis geführt. Denn nicht von einer schweren Krankheit wird Jemand aufgerichtet, noch ein in den letzten Zügen Liegender in’s Leben zurückgebracht, noch ein eben gestorbenes Kind neu belebt, noch ein eben zu begrabender Jüngling wieder aus dem Sarge befreit; sondern ein Mann von reifem Alter, ein abgestandener Todter, der schon fault und verwest, so daß sogar seine Verwandten nicht dulden wollten, daß der Herr dem Grabe sich nähere, wegen der darin befindlichen Widrigkeit des Leichnams, wird durch einen einzigen Ruf wiederbelebt und beglaubigt so die Botschaft von der Auferstehung d. h. den künftigen Eintritt Dessen im Allgemeinen, was wir im Einzelnen durch die Erfahrung gelernt haben. Denn gleichwie bei der Wiederauflösung des Alls nach dem Zeugnisse des Apostels der Herr selbst herabkommen wird im Aufgebot, mit der Stimme eines Erzengels, und mit der Posaune die Todten zur Unsterblichkeit erwecken wird, so schüttelt auch jetzt auf die Stimme des Machtspruches der im Grabe Liegende wie einen Schlaf den Tod ab, und nachdem er von sich geworfen die durch den Tod eingetretene Verwesung, springt er gesund und unversehrt aus dem Grabe, nicht einmal durch das Band der Grabtücher um Füße und Hände gehindert am Hervorgehen.</p><p>Ist Dieß etwa gering zur Beglaubigung der Auferstehung der Todten? Begehrst du, daß noch durch Anderes dir das Urtheil hierüber befestigt werde, nun so scheint mir nicht umsonst zu den Kapharnaiten, gleichsam Namens der Menschen zu sich selbst sprechend, der Herr Folgendes gesagt zu haben: „Allerdings werdet ihr mir das Sprüchwort sagen: Arzt, hilf dir selbst.“ Er mußte nämlich, nachdem er an anderen Leibern die Menschen an das Wunder der Auferstehung gewöhnt hatte, an dem eigenen Menschen die Lehre bestätigen. Du sahst an Anderen die Verkündigung wirksam, sahst die im Sterben Begriffenen, das soeben verlebte Mädchen, den Jüngling am Grabe, den in Verwesung übergehenden Todten — Alle in gleicher Weise auf* einen* Befehl in’s Leben zurückkehren. Verlangst du auch Solche, die durch Wunden (aus Ber.: lies: „Wunden“ statt „Wunder“) und Blut im Tode waren, damit nicht eine an ihnen eingetretene Ohnmacht das Wunder der lebendig machenden Kraft zu nichte mache? Siehe den an den Händen mit Nägeln Durchbohrten, siehe den an der Seite mit der Lanze Durchstochenen, lege deine Finger in die Male der Nägel, stecke deine Hand in die von der Lanze herrührende Wunde, rathe doch, wie tief hinein die Spitze gedrungen sein mußte, indem du aus der Breite der Schramme die Tiefe derselben ermissest. Denn ein wie tiefes Eindringen des Eisens läßt die das Hineinlegen einer menschlichen Hand gestattende Wunde vermuthen? Wenn nun* dieser* auferstanden ist, da dürfte es wohl angemessen sein, das apostolische Wort auszurufen: „Wie sagen Einige, es gebe keine Auferstehung der Todten?“</p><p>Da also jede Weissagung des Herrn durch das Zeugniß der Erfolge als wahr sich erweist, Dieß aber wir nicht durch sein* Wort* bloß gehört, sondern an den durch Auferstehung zum Leben Zurückgekehrten selbst durch die* That* die Bestätigung der Verkündung erhalten haben, was bleibt da für die Nichtglaubenden für ein Anhalt noch übrig? Werden wir nicht Fahrwohl sagen den durch die Philosophie und eitle Täuschung vom unverfälschten Glauben Abgewichenen und uns an das einfache Bekenntniß halten? indem wir in Kurzem von dem Propheten lernen die Weise der Gnadenspendung durch das, was er sagt: „Du nimmst hinweg ihren Odem, und sie vergehen und kehren in ihren Staub zurück; Du sendest aus Deinen Hauch, und sie werden geschaffen, und Du erneuerst das Antlitz der Erde;“ wo er auch sagt, „es erfreue sich der Herr an seinen Werken,“ während „die Sünder von der Erde verschwinden.“ Denn wie wird Einer noch von der Sünde den Namen haben, wenn keine Sünde mehr ist?</p><h2>0</h2><p>Allein es gibt Solche, welche, indem sie in der Ohnmacht menschlicher Schlüsse die göttliche Macht nach unseren Maßen beurtheilen, das für* uns* Unerreichbare auch für Gott nicht als möglich gelten lassen. Sie weisen nämlich auf die Vernichtung der längst Gestorbenen und auf die Überreste der durch Feuer zu Asche Verbrannten, und ausserdem noch führen sie die fleischfressenden Thiere zum Beweis an und den Fisch, der in seinen Leib das Fleisch des Schiffbrüchigen aufnimmt und selbst wieder zur Nahrung der Menschen dient und in die Masse Dessen, der ihn ißt, übergeht durch die Verdauung. Und viele dergleichen kleinliche und der großen Macht Gottes unwürdige Dinge zählen sie auf zur Widerlegung des Glaubenssatzes, als könnte Gott nicht wieder auf denselben Wegen, durch Auflösung dem Menschen das Seinige zurückstellen. Allein wir schneiden uns die langen Umschweife ihrer nichtigen Beweisführung kurz ab, indem wir zugeben, daß die Auflösung des Leibes in seine Bestandtheile allerdings geschieht, und daß nicht bloß die Erde dem göttlichen Worte gemäß wieder zur Erde wird, sondern auch die Luft und die Feuchtigkeit zum Gleichartigen zurückkehren, und daß jeder unserer Theile zu dem Verwandten übergeht, mag nun mit den fleischfressenden Vögeln oder den wilden Raubthieren sich vermischt haben der menschliche Leib durch den Fraß, oder mag er unter den Zahn der Fische gekommen oder in Dünste und Asche verwandelt worden sein durch das Feuer. Wo immer aber Einer annahmsweise in Gedanken den Menschen herumfahren lassen will, jedenfalls ist er innerhalb der Welt. Daß aber diese von der Hand Gottes umfaßt sei, lehrt das göttliche Schriftwort. Wenn nun* dir* Etwas, was in* deiner* Hand ist, nicht unbekannt ist, meinst du denn, das Wissen Gottes sei schwächer als deine Kraft, so daß er nicht von dem von der göttlichen Spanne Umfaßten die genaueste Kenntniß hätte?</p><h2>0</h2><p>Aber vielleicht hältst du im Hinblick auf die Elemente des Alls es für schwierig, daß, wenn die Luft in uns in das verwandte Element sich ergossen und die Wärme und Feuchtigkeit und das Erdartige gleichfalls mit dem Stammverwandten sich vermischt hat, das Angehörige aus dem Gemeinsamen wieder zu dem Seinigen zurückkehre. So kommst du denn nicht durch die menschlichen Beispiele zu dem Schlusse, daß auch das nicht die Grenzen der göttlichen Macht übersteige? Gewiß hast du schon in den menschlichen Wohnstätten eine aus Gemeingut bestehende Gemeindeheerde von Thieren gesehen; aber wenn sie wieder an die Besitzer vertheilt wird, so stellen theils die Gewohntheit (der Thiere) an die Häuser, theils die anhaftenden Zeichen einem Jedem das Seinige zurück. Wenn du dir etwas Ähnliches auch in Bezug auf dich selber vorstellst, so wirst du das Richtige nicht verfehlen. Denn da die Seele eine gewisse natürliche Anhänglichkeit und Zuneigung zu dem Leibe, mit dem sie gelebt hat, hegt, so ist in ihr in Folge der Verbindung mit ihm ein gewisser geheimer Zug nach dem ihr Zugehörigen und eine Wiedererkennung desselben, gleich als ob durch die Natur gewisse Zeichen daran wären, durch welche die Gemeinsamkeit unvermengt bleibt, als unterschieden durch die besonderen Merkmale. Wenn also die Seele das Angestammte und Eigene wieder an sich zieht, welche Mühe, sag’ mir, ist es für die göttliche Macht, die Vereinigung des Verwandten zu vollziehen welches durch einen geheimnißvollen Zug der Natur nach dem ihm Eigenen hinstrebt? Denn daß in der Seele auch nach der Auflösung gewisse Zeichen unseres Körpergefüges zurückbleiben, beweist das Gespräch im Todtenreich, wo zwar die Leiber dem Grabe übergeben waren, ein gewisses leibhaftes Kennzeichen aber den Seelen verblieb, wodurch sowohl Lazarus erkannt wurde, als auch der Reiche nicht unerkannt blieb.</p><p>Also nichts Unwahrscheinliches liegt darin, zu glauben, daß wieder eine Rückkehr der auferstehenden Leiber aus dem gemeinsamen zum Eigenen stattfinde, und besonders ja für den, der sorgfältiger unsere Natur erforscht. Denn es ist auch nicht durchaus in Fluß und Veränderung unser Wesen (in der That ja wäre es völlig unfaßlich, wenn es naturgemäß keinen Stillstand hätte), sondern, genauer gesprochen, Etwas in uns steht still, Etwas aber geht in Veränderung dahin. Es verändert sich nämlich durch Zuwachs und Abnahme der Leib, indem er wie Kleider die auf einander folgenden Lebensalter anzieht. Fest aber steht in allem Wechsel unverändert für sich die Wesensform, welche die einmal ihr von der Natur aufgedrückten Zeichen nicht verliert, sondern bei allen Veränderungen des Körpers mit den ihr eigenen Merkmalen sich darstellt. Auszunehmen aber ist davon die Veränderung durch Krankheit, die der Wesensform (zufällig) zustößt. Denn wie eine fremde Maske verhüllt die krankhafte Mißform die Wesensform, nach deren Hinwegnahme, wie bei Neeman dem Syrer, oder bei den im Evangelium Erwähnten, die durch die Krankheit verdeckte Wesensform im gesunden Zustande wieder in ihren eigenen Merkmalen erscheint.</p><p>Mit dem Gott-ebenbildlichen Theile der Seele nun verwächst sich nicht das im Wechsel Fließende und sich Ändernde, sondern das Beharrende und sich gleich Bleibende in diesem unserem Körpergefüge; und da die Unterschiede in der Form von den Abwechslungen in der Art der Mischung herrühren, die Mischung aber nichts Anderes ist als die Verbindung der Elemente, Elemente wir aber die der Ausstattung des Alls zu Grunde liebenden Bestandtheile heissen, aus welchen auch der menschliche Leib besteht, so ist natürlich, da die Form wie in weicher Masse ein Siegel in der Seele bleibt, auch das, was durch das Siegel sein Gepräge erhalten hat, ihr nicht unbekannt, sondern zur Zeit der Wiederherstellung nimmt sie alles Das wieder an sich, was zum Gepräge der Form paßt. Passen aber wird wohl all Das, was von Anfang mit der Form beprägt worden ist. Es ist also nicht unwahrscheinlich, daß aus dem Gemeinsamen zum Einzelnen wieder zurückkehre das Eigene. Sagt man doch auch vom Quecksilber, daß es, wenn es aus seinem Gefäße an einen flachen und staubigen Ort hingeschüttet wird, in kleine Kügelchen geballt auf der Erde sich zerstreue, ohne sich mit irgend Etwas, womit es in Berührung kommt, zu vermischen; wenn man aber das vielfach Zerstreute wieder in Eins sammelt, so verbinde es sich von selbst wieder mit dem Gleichen, ohne durch ein Mittleres an der Vermischung mit dem Verwandten sich hindern zu lassen. Etwas Ähnliches, glaube ich, muß man sich bei der menschlichen Mischnatur denken: wenn nur von Gott der Anstoß geschieht, so vermischen sich die entsprechenden Theile mit den Verwandten, ohne daß für den durch sie die Natur Wiederherstellenden irgend eine Schwierigkeit stattfindet. Auch in den Gewächsen der Erde ja sehen wir keine Mühsal der Natur am Waizen oder der Hirse oder einem andern der Getreide- oder Hülsenfrucht-Samen bei deren Umwandlung in Halm und Spitzen und Ähren. Mühelos nämlich von selbst geht die entsprechende Nahrung aus dem Gemeinsamen in die Besonderheit der einzelnen Samen über. Wenn also, während gemeinsam für alle Pflanzen der Nahrungssaft da ist, eine jede der davon genährten das Entsprechende an sich zieht zur Vermehrung des Verwandten, was Wunder, wenn auch in Ansehung der Auferstehung, bei Jedem der Auferstehenden, wie bei den Samen, ein solches Ansichziehen des Verwandten stattfindet? Demnach kann man aus Allem lernen, die Botschaft von der Auferstehung enthalte Nichts, was ausserhalb dem durch die Erfahrung Bekannten läge. Und doch haben wir das Bekannteste von dem Unsrigen noch verschwiegen, den ersten Anfang nämlich unseres eigenen Entstehens. Wer kennt nicht das Wunderwerk der Natur, was der mütterliche Schooß empfängt, und was er daraus macht? Oder siehst du nicht, wie einfach gewissermaßen gleichtheilig das ist, was zur Begründung der Existenz des Körpers in den Eingeweiden niedergelegt wird? Die Mannigfaltigkeit aber des sich bildenden Gefüges, welche Rede vermag sie zu schildern? Wer aber, wenn ihn nicht die gemeinsame Natur hierüber belehrt, sollte die Sache für möglich halten, daß jenes Winzige und Unbedeutende Anfang von etwas so Großem ist? Groß aber nenne ich’s, nicht bloß im Hinblick auf das Gebilde des Leibes, sondern, was noch bewunderungswürdiger ist, die Seele selbst meine ich, und was man an ihr bemerkt.</p><h2>0</h2><p>Vielleicht nämlich liegt es nicht ausserhalb der uns vorliegenden Verhandlung, die in den Kirchen erhobene Streitfrage über Seele und Leib zu erörtern. Einige nämlich unserer Vorfahren, von denen über die Urgründe gehandelt wurde, sind der Ansicht, daß wie ein Volk in einer besonderen Staatsverfassung die Seelen präexistiren. Es lägen aber auch dort die Beispiele des Bösen und Guten vor. Und wenn sie nun im Guten verharren, so bleibe die Seele der Verbindung mit dem Körper enthoben; wenn sie aber aus der Gemeinschaft mit dem Guten heraustrete, so gleite sie in das irdische Leben herab und gerathe so in einen Körper. Andere aber, die sich an die Mosaische Ordnung von der Erschaffung des Menschen halten, sagen, die Seele sei der Zeit nach später als der Leib, da Gott zuerst Lehm von der Erde nahm und den Menschen bildete und dann erst ihn beseelte durch den Anhauch. Und durch diese Lehre beweisen sie, werthvoller als die Seele sei das Fleisch, als die erst nachher dazukommende das schon vorher gestaltete. Sie sagen nämlich, wegen des Leibes sei die Seele geworden, damit nicht leblos und regungslos wäre das Gebilde. Alles aber, was wegen Etwas ist, ist jedenfalls weniger werth als das, weßwegen es ist, wie das Evangelium sagt: Mehr als die Nahrung ist das Leben und der Leib mehr als die Kleidung, weil um dieser willen jene. Denn nicht der Nahrung wegen ist das Leben, auch sind nicht um der Kleidung willen die Leiber geschaffen, sondern, weil diese sind, wurden jene des Bedürfnisses wegen dazu erfunden. Da nun in beiden Annahmen die Rede tadelnswerth ist, sowohl Derer, welche von einer Präexistenz der Seelen in einer eigenen Staatsverfassung fabeln, als Derer, welche dieselben erst nach den Leibern geschaffen sein lassen, so dürfte es wohl nöthig sein, Nichts von dem in diesen Lehrsätzen Ausgesprochenen ununtersucht zu übersehen. Allein die eingehende Bekämpfung der beiderseitigen Behauptungen und die Aufdeckung aller in diesen Annahmen enthaltenen Ungereimtheiten möchte wohl eine lange — Zeit sowohl als Rede erfordern. So kurz aber als möglich wollen wir beiderlei Behauptungen erwägen und dann wieder unser Hauptthema aufnehmen.</p><p>Die zur ersteren Lehre stehen und für älter als das Leben im Fleische den Staat der Seelen erklären, scheinen mir von den griechisch-heidnischen Lehren nicht rein zu sein, die bei ihnen über die Seelenwanderung gefabelt wurden. Wenn man nämlich genau nachforscht, so wird man finden, daß auf Das ganz nothwendig ihre Ansicht hinauslaufe, was Einer von den Weisen bei Jenen gesagt haben soll: er selber sei Mann gewesen, habe eines Weibes Körper angezogen, sei mit den Vögeln geflogen, sei als Strauch gewachsen und habe im Wasser gelebt; indem nicht weit von der Wahrheit, nach meinem Urtheile wenigstens, abschweift, der von* sich selbst* das sagt. Denn in der That, des Geschwätzes von Fröschen oder Krähen oder der Stummheit (und Dummheit) der Fische oder der Empfindungslosigkeit der Bäume würdig sind derlei Lehren, zu sagen,* eine* Seele gehe durch so Vielerlei hindurch. Von dieser Ungereimtheit aber ist Dieß die Ursache, daß man eine Präexistenz der Seelen glaubt. Denn folgerichtig kommt der Anfang einer solchen Lehre, indem er zu dem damit Zusammenhängenden und daneben Liegenden die Rede forttreibt, zuletzt soweit in der Faselei. Wenn nämlich durch irgend eine Verkehrtheit von dem höheren Zustande losgerissen die Seele, nachdem sie, wie sie sagen, einmal das körperliche Leben gekostet hat, wieder Mensch wird, das Leben im Fleische aber eingestandener Maßen (aus Ber.: lies: „eingestandener Maßen“ statt „ingestandener Massen“) jedenfalls elender ist als das ewige und unkörperliche, so muß sie nothwendig nach ihrem Eintritt in ein solches Leben, in welchem die Anlässe zum Sündigen mehrfacher sind, in noch mehrfachere Verkehrtheit und in einen noch elenderen Zustand gerathen als vorher. Das Elend der menschlichen Seele aber ist ihre Verähnlichung mit dem Unvernünftigen, und daß sie, wenn sie an dieses sich gewöhnt, zur thierischen Natur herabsinkt, wenn sie aber einmal im Bösen dahingeht, im Zustande der Unvernunft auch niemals vom Fortschritt zum Bösen abläßt. Denn der Stillstand im Bösen ist der Anfang des Tugend-Strebens; Tugend aber gibt es in der Unvernunft nicht. Demnach wird sie nothwendig immer zum Schlechteren sich verändern, indem sie stetig zum Niedrigeren fortschreitet und immer Schlechteres aussucht als die Natur, in der sie ist. Wie aber* unter* dem Vernünftigen das Empfindende steht, so geht es auch von diesem zu dem Empfindungslosen herab. Indeß bis hieher folgt im Verlauf ihrer Rede, wenn sie auch ausserhalb der Wahrheit sich bewegt, doch wenigstens mit einer gewissen Folgerichtigkeit Ungereimtes aus Ungereimtem; im Weiteren aber verliert sich ihre Lehre bereits in zusammenhangslose Fabeln. Denn die Folgerichtigkeit stellt einen völligen Untergang der Seele in Aussicht. Denn die einmal von ihrem erhabenen Zustande herabgeglitschte wird in keinem Maaße von Schlechtheit stehen bleiben können, sondern in Folge ihres Hanges zu den Leidenschaften wird sie von der Vernunft zur Unvernunft übergehen, von dieser aber zur Empfindungslosigkeit der Pflanzen herabsinken. Der Empfindungslosigkeit aber gewissermaßen benachbart ist die Leblosigkeit, auf diese aber folgt die Existenzlosigkeit. Somit wird folgerichtig ganz in’s Nichtsein ihnen die Seele übergehen. Folglich wird ihr nothwendig die Rückkehr zum Besseren unmöglich sein. Nun aber führen sie die Seele aus einem Strauche zum Menschen zurück. Damit beweisen sie also, daß das Leben im Strauche vorzüglicher sei als der körperlose Zustand. Es wurde ja gezeigt, daß der Fortschritt der Seele zum Schlechteren natürlich immer mehr abwärts gehen wird.* Unter* der empfindungslosen Natur aber steht das Leblose, in welches folgerichtig das Prinzip ihrer Lehre die Seele führt. Da sie aber das nicht wollen, so schließen sie die Seele entweder in die Empfindungslosigkeit, oder falls sie dieselbe von da in’s menschliche Leben zurückkehren lassen, so werden sie das holzartige Leben, wie gesagt, für vorzüglicher erklären als den ursprünglichen Zustand, sofern ja von dort der Abfall zum Bösen geschah, von hier aber die Rückkehr zur Tugend erfolgt. Mithin als kopflos und ziellos erweist sich diese Lehre, welche behauptet, die Seelen lebten vor dem Leben im Fleische an sich selbst und würden wegen Schlechtigkeit an die Körper gebunden.</p><p>Von Denen aber, welche die Seele jünger sein lassen als den Leib, wurde schon durch das vorher Gesagte die Ungereimtheit dargelegt. Gleich verwerflich also ist die Ansicht Beider. Mitten aber durch die Meinungen hindurch geradeaus, glaube ich, muß gehen in der Wahrheit unsere Glaubenslehre. Diese aber ist die, daß wir weder gemäß dem griechischen Wahne meinen, durch Verderbtheit schwer geworden fielen die mit dem All herumkreisenden Seelen, aus Unvermögen die Raschheit der Bewegung des Himmels mitzumachen, zur Erde herab, noch hinwieder sagen, zuerst durch das Wort als thönerne Statue gebildet werde der Mensch um dieser willen zur Seele (denn in der That geringer als das thönerne Gebilde wäre demnach die geistige Natur), sondern daß wir, da der Mensch, obwohl aus Seele und Leib bestehend, doch nur Einer ist, ihm auch einen einzigen und gemeinsamen Anfang des Bestehens zuschreiben, damit er nicht etwa älter und jünger sei als er selbst, wenn das Körperliche in ihm früher da wäre, das Andere aber erst dazu käme. Vielmehr sagen wir, in der vorsehenden Macht Gottes zwar, nach der kurz vorher gegebenen Erklärung, präexistire die ganze Menschheit (was auch die Prophezie bezeugt wenn sie sagt, Gott wisse Alles, bevor es geschieht), bei der Erschaffung im Einzelnen aber lassen wir nicht das eine vor dem Andern entstehen, weder die Seele vor dem Leibe, noch umgekehrt, damit nicht der Mensch, durch den Zeitunterschied getheilt, mit sich selbst in Zwiespalt komme.</p><h2>0</h2><p>Da nämlich unsere Natur als eine zweifache zu denken ist, gemäß der apostolischen Lehre, des sichtbaren Menschen und des verborgenen, so würde, falls das Eine früher wäre, das Andere aber darnach käme, als unvollkommen sich erweisen die Macht des Schöpfers, als die nicht für das Ganze zumal genügte, sondern ihr Werk zertheilte und theilweise an jeder der beiden Hälften arbeitete. Vielmehr, wie wir sagen, im Waizen oder einem andern Samen sei der Kraft nach das ganze Wesen der Ähre enthalten, das Gras, der Halm, die Mittelknoten, die Frucht, die Hacheln, und wir von keinem von diesen sagen, es existire in dem Begriff der Natur oder entstehe der Natur des Samens nach früher, sondern, in einer gewissen natürlichen Ordnung zwar komme die im Samen enthaltene Kraft zum Vorschein, keineswegs aber trete eine andere Natur dazu, auf dieselbe Weise nehmen wir auch vom* menschlichen* Samen an, daß er schon im ersten Anfang der Existenz zugleich in sich trage die Kraft der Natur, sich aber entwickle und offenbare in einer gewissen natürlichen Folge zur Vollendung fortschreitend, indem er nicht Etwas von aussen dazunimmt als Vollendungsgrund, sondern sich selbst ordnungsmäßig zur Vollendung forttreibt. Daher ist es weder richtig, zu sagen, die Seele sei vor dem Leibe, noch ohne Seele sei der Leib, sondern beide haben* einen* Anfang, der nach der höheren Rücksicht in dem Urwillen Gottes begründet ist, nach der andern aber auf den Gründen der Zeugung beruht. Denn wie in dem zur Empfängniß des Leibes Niedergelegten (dem Samen) vor seiner Ausgestaltung keine Gliederverbindung zu sehen ist, so ist es auch nicht möglich, die Eigenschaften der Seele darin zu bemerken, bevor sie in Thätigkeit hervorgehen. Und gleichwie wohl Niemand zweifelt, daß zu den Verschiedenheiten der Glieder und Eingeweide jenes Eingelegte sich gestalte, indem nicht eine andere Kraft dazu hineinkommt, sondern die darin enthaltene naturgemäß in ihre Thätigkeit übergeht, so ist auch hinsichtlich der Seele analog das Gleiche zu denken, daß sie, wenn sie auch nicht durch gewisse Thätigkeiten in dem Sichtbaren sich kund gibt, nichts desto weniger darin ist. Denn auch die Wesensform des in der Entstehung begriffenen Menschen ist darin der Kraft nach, aber verborgen, weil es nicht möglich ist, daß sie vor dem nothwendigen Stufengang zum Vorschein komme. So ist zwar auch die Seele darin, obwohl unbemerkbar, sie wird sich aber bemerklich machen durch die ihr eigene und naturgemäße Thätigkeit, indem sie zugleich mit dem körperlichen Wachsthum sich entwickelt. Da nämlich nicht von einem todten Leibe die Kraft zur Empfängniß ausgeht, sondern von einem beseelten und lebendigen, deßhalb, sagen wir, sei es ganz richtig, nicht für todt und unbeseelt zu halten das von einem Lebendigen zur Lebensbegründung Ausgehende. Denn das im Fleische Seelenlose ist jedenfalls auch todt; die Todtheit aber erfolgt durch Beraubung der Seele. Würde man aber nicht in diesem Falle die Beraubung für älter erklären als das Haben, wenn man nämlich die Unbeseeltheit, d. h. die Todtheit, früher sein läßt als die Seele?</p><p>Verlangt man aber einen noch deutlicheren Beweis dafür, daß jener Theil, welcher zum Anfang des entstehenden Lebewesen wird, lebendig ist, so kann man noch aus anderen Zeichen, wodurch das Beseelte vom Todten sich unterscheidet, auch hierüber eine Wahrnehmung machen. Als Beweis nämlich des Lebens bei den Menschen sehen wir es an, daß Einer warm ist und thätig und sich bewege. Die Kälte aber und Regungslosigkeit an den Körpern ist nichts Anderes als Todtheit. Da wir nun als warm und wirksam erfinden das, wovon wir reden, so erkennen wir daraus auch, daß es nicht leblos sei. Allein wie wir es nach seinem körperlichen Theile nicht Fleisch nennen und Knochen und Haare, und was man sonst am Menschen sieht, sondern sagen, der Kraft nach zwar sei es jedes von diesen, sichtbar aber erscheine es noch nicht als solches, so sagen wir auch in Bezug auf den seelischen Theil, es sei zwar noch nicht das Denken und Begehren und der Muthaffekt, und was man sonst an der Seele wahrnimmt, schon in jenem vorhanden, analog aber mit der Gestaltung und Ausbildung des Körpers entwickeln sich auch die Thätigkeiten der Seele zugleich mit dem Stofflichen. Denn wie der schon größer gewachsene Mensch eine offen hervortretende Thätigkeit der Seele besitzt, so gibt er im Anfang der Entstehung die entsprechende und dem dermaligen Bedürfnisse angemessene Mitthätigkeit der Seele in ihm darin kund, daß sie sich aus dem eingelegten Stoffe die ihr angeborne Wohnung bereitet. Denn gar nicht für möglich erachten wir es, daß einer fremden Behausung die Seele sich anbequeme, gleichwie sich das Siegel im Wachs nicht an ein fremdes Petschaft passen läßt.</p><p>Wie nämlich der Leib vom Kleinsten zur Vollendung fortschreitet, so wird auch die Thätigkeit der Seele, die in entsprechender Weise mit dem Stofflichen verwachsen ist, mitzunehmen und mitwachsen. Zuerst nämlich zeigt sich von ihr im ersten Entwicklungsstadium wie eine noch in der Erde versteckte Wurzel bloß die vermehrende und* ernährende* Kraft; denn mehr läßt die Kleinheit des Gefäßes noch nicht zu. Sodann, wenn das Gewächs ans Licht tritt und der Sonne den Sproß zeigt, blüht die* Empfindungsgabe* auf. Wird es aber bereits stark und schießt zur entsprechenden Höhe auf, so beginnt wie eine Frucht die* Denkkraft* durchzuleuchten, nicht auf einmal ganz hervortretend, sondern mit der Ausbildung des Organs sorgfältig mitwachsend, immer so viel Frucht bringend als die Kraft des Substrates erlaubt. Fragst du aber um die Seelenthätigkeiten bei der Bildung des Leibes, so „nimm dich in Acht,“ sagt Moses, und du wirst wie in einem Buche lesen die Geschichte von den Werken der Seele. Denn die Natur selbst erzählt dir, deutlicher als alle Rede, die mannigfachen Geschäfte der Seele im Leibe bei der Bildung sowohl des Ganzen als der Theile. Allein für überflüssig halte ich es, mit Worten die Vorgänge in uns selber zu schildern, wie Berichterstatter von ausländischen Wunderdingen. Denn wer braucht, wenn er sich selbst betrachtet, durch Worte über seine eigene Natur belehrt zu werden? Es kann ja, wer die Weise des Lebens beachtet und bemerkt, wie zu jeder Lebensthätigkeit geschickt der Leib ist, erkennen, womit das Physische der Seele sich beschäftigte bei der ersten Bildung des werdenden Menschen. So ist denn für die nicht Unachtsamen auch hieraus klar, daß nicht als todt und unbeseelt in die Werkstätte der Natur komme, was zur Pflanzung des Lebewesens als Ableger aus einem lebendigen Leibe hineingethan wird. Denn auch die Kerne der Früchte und die Ableger der Wurzeln legen wir nicht, wenn die von Natur in ihnen vorhandene Lebenskraft erstorben ist, in die Erde, sondern, wenn sie noch in sich tragen, verborgen zwar, aber jedenfalls lebendig, die Eigenthümlichkeit der Stammart. Diese Kraft aber legt nicht die umgebende Erde, von aussen aus sich sie herzubringend, hinein (sonst müßte ja auch erstorbenes Holz Sprossen treiben), sondern die schon drinliegende bringt sie zum Vorschein, indem sie das Gewächs durch ihre Feuchtigkeit nährt und es zu Wurzel, Rinde, Mark und Zweigsprossen vollendet. Das wäre nicht möglich, wenn nicht eine natürliche Kraft schon darin läge, welche aus der Umgebung die verwandte und entsprechende Nahrung an sich zieht, wodurch dann ein Strauch oder eine Ähre oder irgend ein Ruthengeschoß entsteht.</p><h2>0</h2><p>Allein über die genaue Einrichtung unseres Leibes belehrt zwar ein Jeder sich selbst aus dem, was er sieht und erlebt und empfindet, indem er seine eigene Natur als Lehrerin hat. Es kann aber auch, wer die in Büchern von den Fachgelehrten bearbeitete Beschreibung davon hernimmt, Alles genau kennen lernen. Von diesen haben die Einen über die Lage der einzelnen Theile in uns durch die Anatomie sich belehrt, die Andern auch die Bestimmung aller Theile des Leibes erforscht und erörtert, so daß hieraus eine hinreichende Kenntniß des menschlichen Baues für die Studienfreunde sich ergibt. Will aber Einer für all Dieses die Kirche als Lehrerin haben, um für Nichts eine fremde Stimme zu brauchen (denn das ist der geistigen Schafe Gesetz, wie der Herr sagt, auf eine fremde Stimme nicht zu hören), so wollen wir in Kürze die Untersuchung auch hierüber aufnehmen.</p><p>Dreierlei erkennen wir an der Natur des Leibes, um deß willen die einzelnen Theile in uns zubereitet sind. Die einen nämlich dienen zum Leben, die andern um schön zu leben, noch andere zur Fortpflanzung der Nachkommen. Was nun in uns von der Art ist, daß ohne dasselbe das menschliche Leben nicht bestehen kann, finden wir in drei Theilen, in Gehirn, Herz und Leber. Was aber eine Zugabe von Gütern ist und eine Freigebigkeit der Natur, welche dadurch dem Menschen ein angenehmes Leben verleiht, das sind die Sinneswerkzeuge. Denn diese begründen uns zwar nicht das Leben, da auch in deren Ermangelung der Mensch oft nichts desto weniger am Leben ist, aber unmöglich kann man ohne diese Thätigkeiten an den Annehmlichkeiten des Lebens Theil haben. Der dritte Zweck aber geht auf die Nachfolge und Fortpflanzung. Es gibt aber ausserdem noch andere Theile, die gemeinsam allen zur Erhaltung dienen, indem sie durch sich die geeigneten Zuflüsse hereinführen, wie Magen und Lunge, von welchen diese durch den Athem das Feuer im Herzen anfacht, jener aber den Eingeweiden die Nahrung zuführt. Bei dieser Eintheilung nun der Einrichtung in uns kann man deutlich sehen, daß nicht einförmig durch* ein* Glied die Lebenskraft in uns waltet, sondern daß die Natur die Bedingungen zu unserer Subsistenz an mehrere Glieder vertheilt und so die Mitwirkung jedes einzelnen zum Ganzen nothwendig macht, so daß, was immer sowohl zur Erhaltung als Verschönerung des Lebens die Natur kunstvoll eingerichtet hat, mehrfältig ist und sehr von einander verschieden. Allein zuerst, glaube ich, müssen wir in Kürze von dem, was uns zur Erhaltung des Lebens dient, die ersten Anfänge unterscheiden.</p><p>Von dem den einzelnen Gliedern gemeinsam zu Grunde liegenden Stoffe des ganzen Leibes sei für jetzt nicht die Rede; denn Nichts zum Zwecke wird uns beitragen die allgemeine Naturlehre für die besondere Untersuchung. Da also von Allen anerkannt ist, daß von allem elementarisch in der Welt Befindlichen in uns ein Theil ist, vom Warmen und Kalten, und von dem anderen Paare, dem Feuchten und Trockenen, so müssen wir das Einzelne durchnehmen. Nun sehen wir* dreierlei* das Leben erhaltende Mächte, von denen die eine Alles mit Wärme durchdringt, die andere das Erwärmte mit Feuchtigkeit netzt, damit durch das Gleichgewicht der Qualität der Gegensätze in der Mitte erhalten werde das Lebewesen, und weder das Nasse vertrockne durch das Übermaß der Wärme, noch das Warme verlösche durch Überhandnahme der Durchnässung. Die dritte Macht aber erhält durch sich in einer gewissen Fuge und Harmonie die Unterschiede der Glieder, indem sie dieselben durch ihre Bande verknüpft und Allen die Kraft der Selbstbewegung und Lebendigkeit zutheilt, in deren Ermangelung schlaff wird und wie todt das Glied, als des Lebensgeistes verlustig.</p><p>Noch mehr aber als Dieß werth der Beachtung ist das Kunstwerk unserer Natur in der Einrichtung des Leibes selbst. Da nämlich das Harte und Feste die empfindenden Thätigkeiten nicht zuläßt (wie zu sehen ist sowohl an den Knochen in uns als an den Pflanzen der Erde, an denen wir zwar eine Art von Leben bemerken im Wachsthum und der Ernährung, bei denen jedoch dagegen die Ungeschmeidigkeit des Stoffes die Empfindung nicht zuläßt), darum mußte den Sinnesthätigkeiten eine gleichsam wachsartige Ausstattung untergelegt werden, welche für die Empfindungs-Eindrücke empfänglich ist und weder verfließt vor übermäßiger Feuchtigkeit (denn nicht haften würde im Flüssigen der Eindruck), noch widersteht im Übermaß der Härte (denn unempfänglich für Eindrücke ist das Unnachgiebige), sondern die Mitte hält zwischen Weichheit und Starrheit, damit nicht der schönsten unter den natürlichen Verrichtungen, der Sinnenthätigkeit nämlich, entbehre das Lebewesen. Da nun das Weiche und leicht Nachgiebige ohne die Kraft des Festen ganz unwirksam wäre und ungegliedert, wie die See-Molusken, darum mischt die Natur in den Leib die Starrheit der Knochen, und indem sie diese durch die geeignete Harmonie mit einander verband und durch die Nervenbänder deren Fugen verknüpfte, umgab sie so dieselben mit dem empfindungsfähigen Fleische, das als minder empfindlich und kräftiger an der Oberfläche sich vertheilt. Indem sie nun auf diese feste Knochennatur, wie auf lasttragende Säulen, die ganze Schwere des Leibes legte, anerschuf sie nicht ohne Gliederung dem Ganzen den Knochen (das Gebein). Denn wahrlich unregsam und unthätig bliebe, wenn so es mit seiner Ausstattung stünde, der Mensch, wie ein Baum, der an* einem* Orte bleibt, sofern weder die Aufeinanderfolge der Beine nach vorwärts fortführen würde die Bewegung noch die Geschäftigkeit der Hände Dienst leisten würde dem Leben. Nun aber hat sie durch diese sinnreiche Einrichtung den Organismus zum Wandeln und Handeln befähigt, indem sie durch den die Nerven durchdringenden Lebensgeist dem Körper den Trieb und die Kraft zu seinen Bewegungen einpflanzte. Dadurch wird der mannigfaltige, vielgewandte und zu jeder Erfindung dienliche Beistand der Hände, dadurch werden die Wendungen des Halses, die Neigungen und Erhebungen des Kopfes, die Thätigkeit der Kinnlade, die zugleich mit dem Wink erfolgende Öffnung der Augenlider und die Bewegungen der übrigen Glieder in gewissen Nerven zwar, die sich an- und abspannen, wie mittelst einer Maschine, bewerkstelligt; die durch diese hindurchgehende Kraft aber hat einen gewissen selbstständigen Antrieb, indem sie gemäß einer gewissen Naturordnung selbstthätigen Geistes in den einzelnen Theilen wirkt.</p><p>Als Wurzel aber und Anfang aller Nervenbewegungen erwies sich das das* Gehirn* umgebende Nervengewebe. Nicht mehr also glauben wir viel forschen zu müssen nach einem der zum Leben nothwendigen Theile, welcher ein solcher sei, nachdem in* diesem* sich gezeigt hat die bewegende Kraft-Thätigkeit. Daß aber sehr viel zum Leben beiträgt das Gehirn, beweist klar der Fall einer Verletzung. Denn wenn die es umgebende Haut eine Verwundung oder Zerreissung erleidet, so erfolgt gleich darauf der Tod, indem nicht im Geringsten die Natur der Verwundung widersteht, wie beim Abbruch einer Grundmauer das ganze Gebäude zugleich mit dem Theile einstürzt. Bei wessen Verletzung also offenbar die Zerstörung des ganzen Lebewesens erfolgt,* das* dürfte man wohl als den Hauptsitz der Ursache des Lebens anerkennen.</p><p>Da aber auch von den aus dem Leben Geschiedenen beim Erlöschen der der Natur einwohnenden Wärme der Leichnam erkaltet, darum erkennen wir auch in der Wärme eine Lebensursache. Denn mit wessen Entschwinden die Todtheit eintritt, durch dessen Gegenwart, das muß man zugeben, besteht das Lebewesen. Von dieser Kraft aber gleichsam als einen Quell und Anfang erkennen wir das* Herz,* von welchem aus röhrenartige, vielfach aus einander sich verzweigende Durchgänge durch den ganzen Leib den feuerartigen und warmen Lebensgeist verbreiten. Da aber dem Warmen von Natur aus auch eine Nahrung zu Gebot stehen mußte (denn das Feuer kann nicht für sich bestehen, ohne daß es eine entsprechende Nahrung erhält), darum gehen die Blutkanäle, die wie aus einer Quelle von der Leber ausgehen, zugleich mit dem warmen Lebensgeiste überall hin im Körper, damit nicht die Trennung des einen vom andern zur Krankheit werde und die Natur zerstöre. Zur Lehre sei Dieß den Verletzern des Rechts und der Billigkeit, und sie sollen von der Natur lernen, daß die Habgier eine Verderben bringende Krankheit ist. Indeß da bedürfnißlos nur die Gottheit ist, die menschliche Armuth aber zum eigenen Bestehen der äusseren Dinge bedarf, darum führt sie jenen drei Kräften, durch welche, wie gesagt, der ganze Leib versorgt wird, einen reichlichen Stoff von aussen her zu, indem sie durch verschiedene Zugänge das ihnen Entsprechende hineinbringt. Der Quelle des Blutes nämlich, welche die Leber ist, vertraute sie die Beschaffung des Nahrungsbedarfes; denn die Zufuhr bewirkt durch die Leber, daß beständig davon die Quellen des Blutes sprudeln, wie der Schnee auf dem Berge durch seine Feuchtigkeit die Quellen am Fuße des Berges schwellt, indem er sein Naß bis tief zu den untern Adern treibt. Der Lebensgeist aber im Herzen wird durch das benachbarte Eingeweide eingeführt, welches Lunge heißt und ein Luftbehälter ist, der durch die innere bis zum Mund gehende Röhre die äussere Luft durch die Athemzüge an sich zieht. Und das in der Mitte davon befindliche Herz, das nach Art der Thätigkeit des stets bewegten Feuers unaufhörlich auch selber bewegt ist, zieht sie, ungefähr wie in den Schmieden die Blasbälge, aus der benachbarten Lunge an sich, durch seine Ausdehnung die Höhlungen füllend, und bläst dann, seine eigene Wärme anfachend, dieselbe in die angrenzenden Kanäle; und das thut es ohne Unterlaß, indem es das von aussen Kommende durch seine Ausdehnung in seine Höhlungen einzieht, das von ihm selbst Kommende aber durch seine Zusammenziehung in die Adern aussendet. Das scheint mir auch dieses unwillkürlichen Athmens Ursache für uns zu sein. Oft ja beschäftigt der Geist zwar sich mit Anderem, oder er feiert auch gänzlich, wenn der Körper im Schlafe gelöst ist; das Athmen der Luft aber hört nicht auf, wenn auch gar nicht dazu mitwirkt die Willkür. Ich meine nämlich, weil umfangen von der Lunge das Herz ist und verwachsen mit ihr an seinem hinteren Theile, so bewegt es bei seinen Ausdehnungen und Zusammenziehungen das Eingeweide mit und bewirkt so das Anziehen und Blasen der Luft in der Lunge. Denn da diese schwammig und sehr porös ist und all’ ihre Höhlungen in den Schlund der Luftröhre münden läßt, so preßt sie, wenn sie sich zusammenzieht und verengert, den in den Höhlen zurückgebliebenen Odem heraus; wenn sie sich aber erweitert und öffnet, so zieht sie bei der Ausdehnung durch den Athemzug in den leeren Raum die Luft ein. Und das ist dieses unwillkürlichen Athmens Ursache, daß nämlich das Feuerartige nicht ruhen kann. Da nämlich die Bewegungsthätigkeit der Wärme eigenthümlich ist, von dieser wir aber die Anfänge im Herzen bemerkt haben, so bewirkt die Stetigkeit der Bewegung in diesem Theile den ununterbrochenen Aus- und Eingang der Luft durch die Lunge. Daher wird auch bei unnatürlicher Steigerung der Hitze das Athemholen der Fieberkranken heftiger, als ob das Herz sich beeilte, die in ihm vorhandene Gluth durch den frischeren Hauch zu löschen.</p><p>Allein da unsere Natur eine arme ist und der Mittel zur eigenen Existenz in Allem bedürftig, so ist sie nicht bloß an eigener Luft arm und an dem die Wärme erweckenden Odem, welcher ja zur Erhaltung des Lebewesens beständig von aussen hereinkommt, sondern sie bezieht auch die die Körpermasse unterstützende Nahrung aus fremder Quelle. Darum befriedigt sie mit Speisen und Getränken das Bedürfniß, wozu sie eine das Fehlende anziehende und das Überflüssige ausstoßende Kraft in den Körper legte, indem auch hiefür das Herzfeuer der Natur keinen geringen Beistand leistet. Da nämlich der vornehmste unter den zum Leben gehörigen Theilen der abgegebenen Erklärung zufolge das Herz ist, das durch seinen warmen Hauch die einzelnen Glieder belebfeuert, so hat ihm unser Schöpfer eine durch die Rührigkeit seiner Kraft nach allen Seiten hin gehende Wirksamkeit verliehen, damit kein Theil desselben unthätig und unnütz für den Haushalt des Ganzen bliebe. Deßhalb geht es* hinten* unter die Lunge hinein, und indem es in unaufhörlicher Bewegung einmal das Eingeweide zu sich herabzieht, erweitert es zum Einziehen der Luft dessen Poren; indem es aber dasselbe wieder zurückdrängt, bewirkt es das Aushauchen des Eingeathmeten; an seinem* Vorder<em>theile dagegen hängt es mit dem Raume des Magens zusammen und verleiht ihm Wärme und Bewegung zu seinen Thätigkeiten, durch Anregung nicht zum Athemholen, sondern zur Aufnahme der geeigneten Nahrung. Denn nahe zwar an einander liegen die Eingänge des Odems und der Nahrung, laufen auch der Länge nach neben einander herauf und schließen sich</em> oben* gleichmäßig zusammen, so daß sie sowohl in einander einmünden als auch in* einem* Munde ihre Kanäle enden, von wo durch den einen die Nahrung, durch den andern der Odem eingeht; allein* unten* besteht keineswegs mehr die enge Verbindung der beiden Kanäle. Denn mitten zwischen den Sitzen beider liegt das Herz und gibt dem einen zur Athmung, dem andern zur Nahrung die Kräfte. Denn es ist die Natur des Feuerartigen, Brennmaterial zu verlangen, was eben nothwendig auch beim Nahrungsbehälter der Fall ist. Denn je mehr er durch die benachbarte Erwärmung erhitzt wird, desto mehr zieht er das, was die Wärme nährt, an sich; dieses Verlangen aber nennen wir Hunger. Falls aber den genügenden Stoff der Nahrungsbehälter gefaßt hat, so ruht auch dann die Thätigkeit des Feuers nicht, sondern bewirkt wie in einem Ofen eine Zerkochung des Stoffes, und die Substanzen auflösend und wie aus einem Tiegel ausgießend ergießt sie dieselben in die nächsten Kanäle; sodann das Gröbere von dem Dünneren ausscheidend, führt sie das Feine durch gewisse Röhrchen zu den Pforten der Leber, den stoffischen Bodensatz aber der Nahrung treibt sie in die geräumigeren Kanäle der Gedärme und in deren vielfachen Windungen sie herumführend behält sie die Nahrung eine Zeit lang in den Eingeweiden, damit nicht etwa durch die Geradheit des Kanals leicht sich entleerend sogleich wieder Hunger bekäme das Lebewesen und niemals von dieser Arbeit abließe nach Art der Thiere der Mensch. Da aber auch die Leber gar sehr die Hilfe der Wärme bedarf zur Verwandlung der Flüssigkeiten in Blut, abseit [abseits?] aber diese vom Herzen gelegen ist (es konnte ja nicht, glaube ich, die eine Quelle und Wurzel der Lebenskraft eng an die andere Quelle sich drängen), so nimmt, damit nicht durch die Entfernung von der Wärmesubstanz Etwas vom Haushalte Schaden leide, ein nervigter Kanal (Arterie heißt dieß beim Fachgelehrten) den feurigen Hauch des Herzens auf und trägt ihn der Leber zu, gerade am Eingang der Flüssigkeiten mündend, und indem er durch die Wärme die Flüssigkeit aufkocht, bringt er in das Nasse Etwas von der Verwandtschaft des Feuers, mit Feuerfarbe das Aussehen des Blutes röthend. Von da dann gehen Zwillingskanäle aus, die rinnenförmig jedweder das Seine enthalten, Odem und Blut, damit die Flüssigkeit, durch die Bewegung des Warmen gehoben und mitlaufend, leicht durchgehe, und diese verbreiten sich vieltheilig durch den ganzen Leib, in viele tausend Kanalanfänge und Verzweigungen nach allen Seiten hin sich spaltend.</p><p>Diese zwei mit einander verbundenen Hauptquellen aber der Lebenskräfte, die das Warme und die das Nasse überall im Körper verbreitende, bringen gleichsam einen nothwendigen Tribut von dem Ihrigen der obersten Kraft des Lebenshaushaltes dar. Das ist aber die an den Hirnhäutchen und dem Gehirne sich zeigende, von der alle Gelenkbewegung, alles Muskelzusammenziehen und aller Selbstthätigkeitsgeist in die einzelnen Glieder ausgeht und so unser irdenes Gebilde als thatkräftig und wie durch eine Maschine bewegt erscheinen läßt. Von dem Warmen nämlich das Reinste und von dem Nassen das Feinste aus beiden Kräften, durch Mischung und Mengung vereint, ernährt und constituirt durch seine Dünste das Gehirn, von welchem wieder auf’s Reinste verfeinert der Rückfluß aus ihm die das Gehirn umhegende Hirnhaut befeuchtet, die, röhrenförmig durch die an einander hängenden Wirbelknochen von oben nach unten hinablaufend und sich und das in ihm befindliche Mark fortsetzend, zugleich mit der Basis des Rückgrats endigt, allen Knochen und Gelenkfugen und Muskelanfängen wie ein Wagenlenker zu jeder Bewegung sowohl als Ruhe den Antrieb und die Kraft verleihend. Darum scheint sie mir auch eines sichereren Schutzes gewürdigt zu sein, indem sie einerseits im Kopfe von doppelten Knochenwänden rings umschlossen ist, anderseits in den Wirbeln durch die Knotenvorsprünge und die vielfachen Verschlingungen in der Stellung, wodurch sie jeder Verletzung entrückt ist, mittels der sie umgebenden Schutzwehr gesichert ist. Ebenso aber kann man sich wohl auch beim Herzen denken, daß es wie eine Schanze auf’s Festeste verwahrt ist durch die Ringmauern der Knochen. Hinten nämlich ist das durch die Schulterblätter von beiden Seiten geschützte Rückgrat, auf beiden Brustseiten umhegt die Rippenwand das Innere und schützt es vor Verletzung; vorne aber bildet die Brust und die beiden Schlüsselbeine eine Schutzwehr, damit es von allen Seiten gegen Anfälle von aussen sicher gestellt sei.</p><p>Ein Gleichniß aber kann man am Landbau sehen, wenn der Regen aus den Wolken oder die Bewässerung durch Kanäle den Boden tränkt; — man denke sich einen Garten, der tausenderlei verschiedene Bäume und allerlei Arten von Erdgewächsen in sich nährt, an denen man eine vielfache Verschiedenheit der Gestalt, der Beschaffenheit, der eigenthümlichen Farbe im Einzelnen wahrnimmt; — von so vielen nun auf* einem* Raume durch die Feuchtigkeit genährten Gewächsen die jedes einzelne benetzende Kraft zwar ist der Natur nach eine, die Eigenthümlichkeit der genährten aber verwandelt die Feuchtigkeit in verschiedene Qualitäten; denn die nämliche wird bitter im Wermuth, verwandelt sich in tödtlichen Saft im Schierling, und wird je anders im Safran, im Balsam, im Mohn (dort nämlich hitzig, da kühl, hier temperirt), im Lorber, im Mastix und dergleichen ist sie wohlduftig, im Feigen- und Birnbaum wird sie süß, im Weinstock wird sie zu Traube und Wein; und der Saft des Apfels, das Roth der Rose, das Weiß der Lilie, das Blau des Veilchens, der Purpur der Hyacinthentinte, und Alles, was auf der Erde zu sehen ist, sproßt aus einer und derselben Feuchtigkeit auf, obwohl es in so viele Verschiedenheiten an Gestalt, Aussehen und Beschaffenheiten aus einander geht. Ein ähnliches Wunder geschieht auch auf* unserem* beseelten Acker durch die Natur oder vielmehr durch den Herrn der Natur. Knochen und Knorpeln, Adern, Arterien, Nerven, Gelenke, Fleisch, Haut, Fett, Haare, Drüsen, Nägel, Augen, Nase, Ohren, alles Dieß und ausserdem tausend Anderes, was durch verschiedene Eigenthümlichkeiten von einander gesondert ist, wird durch eine einzige Art von Nahrung seiner Natur entsprechend ernährt, so daß die einem jeden der zu Grunde liegenden Theile zugeführte Nahrung, auch gemäß dem, dem sie zugebracht wird, sich verändert, indem sie angemessen und entsprechend wird der Eigenthümlichkeit des Theiles. Denn falls sie an’s Auge kommt, so verbindet sie sich mit dem Sehorgan und vertheilt sich entsprechend den Verschiedenheiten der Hüllen um’s Auge auf jede; strömt sie aber den Gehörstheilen zu, so vermischt sie sich dem Gehörorgan; an die Lippe kommend wird sie zur Lippe, im Knochen erstarrt sie, im Mark wird sie weich, spannt sich mit dem Nerven, und an der Hautfläche dehnt sie sich mit dieser herum; in Nägel geht sie über und zur Haarerzeugung verfeinert sie sich durch die entsprechenden Dünste, indem sie, wenn sie durch krumme Poren hervordringt, krausere und geringelte Haare erzeugt, wenn aber in gerader Linie der Austritt der haarbildenden Dünste geschieht, glatte und gerade hervorbringt.</p><p>Aber weit vom Hauptgegenstande ist die Rede uns abgeschweift, indem sie in die Werke der Natur sich vertiefte und zu skizziren versuchte, wie in uns und woraus das Einzelne bestehe, was zum Leben, und was zum schön Leben gehört, und was wir ausserdem noch bei der ersten Eintheilung im Sinne hatten. Denn die Aufgabe war, zu zeigen, die Keimursache unseres Daseins sei weder eine unkörperliche Seele, noch ein unbeseelter Körper, sondern werde aus beseelten und lebendigen Leibern als ein von Anfang an lebendiges und beseeltes Lebewesen erzeugt; sie aufnehmend aber ziehe die menschliche Natur wie eine Amme mit ihren Kräften dieselbe auf; sie werde aber ernährt nach beiden Seiten, und nehme augenscheinlich in beiden Theilen in entsprechender Weise zu. Denn sogleich gibt sie durch diese kunstvolle und weise Gestaltung die mit ihr verbundene Kraft der Seele kund, die Anfangs zwar etwas dunkel erscheint, hernach aber zugleich mit der Vollendung des Organismus klar hervortritt. Ein Beispiel aber kann man bei den Bildhauern sehen: ein Vorwurf nämlich für den Künstler ist es, die Gestalt eines Lebewesens in Stein darzustellen; zu diesem Behufe bricht er zuerst den Stein aus der naturwüchsigen Materie, dann das Überflüssige davon rings abhauend bringt er ihn einigermaßen in der ersten Gestalt zum vorhablichen Ausdruck, so daß auch der Unwissende aus dem, was er sieht, die Absicht der Kunst erräth; dann wieder fortarbeitend nähert er ihn noch mehr der Ähnlichkeit mit dem, worauf er hinstrebt; endlich die vollendete und genaue Form dem Stoffe beibringend führt er seine Kunst zu Ende, und es ist ein Löwe oder Mensch oder was etwa sonst der Künstler gemacht hat, der vor Kurzem noch formlose Stein, indem nicht der Stoff in die Form sich verwandelte, sondern die Form dem Stoffe beigebracht wurde. Etwas Ähnliches wenn man sich bei der Seele denkt, wird man das Richtige nicht verfehlen. Die Allkünstlerin Natur nämlich, sagen wir, nimmt aus dem gleichartigen Stoffe den vom Menschen kommenden Theil in sich auf und schafft daraus ein Menschengebilde. Wie aber der allmähligen Bearbeitung des Steins die Form auf dem Fuße folgte, weniger deutlich zwar am Anfang, vollkommener aber nach der Vollendung der Arbeit, so kommt auch in der Bildung des Organismus die Form der Seele im entsprechenden Verhältniß zum Stoffe des Leibes zum Vorschein, unvollkommen im unvollkommenen, und im vollkommenen vollkommen. Indeß sie wäre von Anfang an vollkommen, wenn nicht durch die Sünde die Natur verstümmelt wäre. Darum läßt die Verwandtschaft mit der leidenschaftlichen und thierischen Erzeugung in dem Gebilde das göttliche Ebenbild nicht sogleich hervorleuchten, sondern führt in einer gewissen Stufenreihe und Folge durch die materiellen und mehr thierischen Eigenschaften der Seele den Menschen zur Vollendung. Diese Lehre aber lehrt auch der große Apostel im Korintherbriefe, da er sagt: „Als ich ein Kind war, redete ich wie ein Kind, dachte wie ein Kind, überlegte wie ein Kind; da ich aber Mann wurde, legte ich ab, was kindisch war.“ Nicht so, daß im Manne eine andere Seele hinzutritt, ausser der im Knaben vorhandenen, wird die mehr kindische Denkweise abgelegt und tritt die mannhafte ein, sondern so, daß die nämliche in jenem das Unvollkommene, in diesem aber das Vollkommene sehen läßt. So sagen wir ja auch von den Pflanzen und Gewächsen, daß sie leben, und Alles, was Leben und natürliche Bewegung hat, wird wohl Niemand unbeseelt nennen, und doch kann man von einem solchen Leben nicht sagen, daß es einer vollkommenen Seele theilhaftig sei. Denn ist auch in den Pflanzen eine gewisse seelenhafte Thätigkeit, so reicht sie doch nicht bis zu den Empfindungsbewegungen. Und ist auch in noch höherem Grade eine seelische Thätigkeit in den Thieren, so gelangt auch diese nicht zur Vollkommenheit, da sie die Gabe der Vernunft und Urtheilskraft nicht in sich begreift. Darum sagen wir, die wahre und vollkommene Seele sei die menschliche, an der sich jede Thätigkeit erkennen läßt. Wenn aber sonst noch Etwas des Lebens theilhaftig ist, so nennen wir es in einem gewissen Mißbrauch von Gewohnheit beseelt, nicht weil in ihnen eine vollkommene Seele ist, sondern gewisse Theile von seelischer Thätigkeit, die, wie wir gesehen haben, nach der mystischen Darstellung der Menschenschöpfung bei Moses auch beim Menschen hinzugekommen sind vermöge seiner Verwandtschaft mit der niedern Natur. Darum gibt Paulus, indem er die, die ihn hören wollen, ermahnt, nach der Vollkommenheit zu streben, auch die Weise an, wie sie dieses Ziel erreichen könnten, indem er sagt, sie sollten ausziehen den alten Menschen und anziehen den neuen, der erneuert werde nach dem Bilde des Schöpfers. So laßt uns denn zurückkehren Alle zu jener Gottebenbildlichkeit, in der im Anfange den Menschen Gott geschaffen hat, da er sprach: Laßt uns den Menschen machen nach unserem Bilde und Gleichnisse. Ihm sei die Ehre und die Kraft in alle Ewigkeit! Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Heinrich Hand, <em>Abhandlung über die Ausstattung des Menschen</em> (BKV 1. Serie, Bd. 24, Kempten 1874). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3154/versions/abhandlung-uber-die-ausstattung-des-menschen-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

