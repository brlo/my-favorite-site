      <p><em>Gespräch mit Makrina über Seele und Auferstehung, übersetzt von Übersetzung der BKV-Ausgabe (BKV 1. Reihe, Bd. 56, Kempten/München 1927).</em></p><p>Als Basilius, der unter den Heiligen einen hervorragenden Platz einnimmt, aus dem menschlichen Leben zu Gott hinübergegangen war und die Kirchen in gleicher Weise um ihn trauerten, unsere Schwester und Lehrerin Makrina aber noch am Leben war, beeilte ich mich, zu ihr zu kommen, um ihr das Unglück des Bruders mitzuteilen. Tiefbetrübt war meine Seele, da sie einen so großen Verlust überaus schmerzlich empfand. Und ich suchte jemand, der, die Größe des Leides gleich mir fühlend, mit mir weinen würde. Als wir uns nun einander ins Auge sehen konnten, erwachte der Schmerz beim Anblicke der Lehrerin doppelt; denn auch sie war bereits von tödlicher Schwäche befallen. Sie aber ließ nach Art geschickter Pferdelenker der Heftigkeit meines Schmerzes eine kleine Weile die Zügel schießen; dann jedoch suchte sie durch ihren Zuspruch mich zu beruhigen, indem sie durch ihre Trostgründe wie mit einem Zügel dem Ungestüm meiner Seele Halt gebot. Und hiebei bediente sie sich des apostolischen Wortes, daß wir über die Entschlafenen nicht übermäßig trauern sollten; denn solch leidenschaftliche Stimmung käme nur denen zu, welche keine Hoffnung hätten (1 Thess. 4, 13).</p><p>Da fing ich, weil mir das Herz vor Weh noch brannte, also zu sprechen an: „Wie kann dies von den Menschen erreicht werden, da doch jeder eine natürliche Abneigung gegen den Tod in sich trägt und sowohl die, welche jemand sterben sehen, solchen Anblick kaum aushalten, als auch diejenigen, welchen der Tod droht, ihm zu entfliehen versuchen, soweit es nur irgendwie möglich ist. Selbst die geltenden Gesetze rechnen die Tötung eines Menschen unter die größten Verbrechen und verhängen für dieselbe die schwersten Strafen. Wie sollen wir es zustande bringen, das Scheiden aus dem Leben bei Fremden und gar erst bei uns Nahestehenden für nichts zu achten?“ „Sehen wir nicht“, sprach ich, „das ganze Dichten und Trachten der Menschen darauf gerichtet, uns am Leben zu erhalten? Denn deshalb haben wir Häuser zum Wohnen erfunden, damit nicht unsere Körper von außen her durch Kälte oder Hitze Schaden nehmen. Der Ackerbau ferner, was ist er anders als ein Rüstzeug für das Leben? Und überhaupt die ganze Sorge, die auf das Leben verwendet wird, ist nur der Furcht vor dem Tode entsprungen. Was ist die Heilkunde? Warum steht sie bei den Menschen in Ehren? Nicht deshalb, weil sie gewissermaßen nach allen Regeln der Kunst gegen den Tod zu kämpfen scheint? Brustpanzer und Schilde, Beinschienen und Helme, die Waffenwehren und Mauerbollwerke, eisenbeschlagene Tore und schützende Schanzgräben und ähnliches, was hat sie anders ersonnen als nur die Furcht vor dem Tode? Da demnach der Tod so schrecklich ist, wie kann man einem leicht gehorchen, der den Hinterbliebenen befiehlt, um den Dahingegangenen nicht zu trauern?“</p><p>Die Lehrerin wendete zwar ein: „Warum scheint dir der Tod an und für sich schon so unendlich traurig? Das Verhalten der Unverständigen berechtigt nicht, solche Klagen zu erheben.“ ― Ich aber erwiderte: „Wie? liegt kein Grund zur Trauer vor, wenn wir den noch eben Lebenden und Sprechenden plötzlich leblos, sprachlos und regungslos sehen? wenn wir sehen, wie alle natürlichen Sinneswerkzeuge außer Dienst gestellt sind, wie weder Auge noch Ohr mehr in Tätigkeit treten können noch sonst ein Organ, das zur Sinnesempfindung bestimmt ist. Selbst wenn du ihm Feuer oder Eisen nahebringst oder mit einem Schwerte den Leib öffnest oder ihn ins Grab legest ― gegen all das verhält sich der Daliegende ganz teilnahmslos.“</p><p>„Wenn nun beim Tode eine derartige Veränderung eintritt, und der Lebensfunke ― was er immer auch sein mag ― vergangen und verschwunden ist, ähnlich wie bei einer ausgelöschten Lampe die eben noch brennende Flamme weder am Dochte geblieben noch sonst nur einen anderen Platz eingenommen hat, sondern gänzlich verflogen ist, wie sollten wir bei einer so großen Veränderung nicht in Trauer versinken, da uns jede Stütze fehlt, die uns aufrecht halten könnte. Denn wenn wir auch vom Scheiden der Seele hören, so sehen wir einzig das, was zurückblieb, in bezug auf das aber, was entwich, wissen wir nicht, was es seiner Natur nach war, noch wohin es verschwand, da jene dem Körper entflohene Kraft sich weder in der Erde findet noch im Wasser noch sonst in einem anderen Element, jene Kraft, deren Entweichen den verlassenen Körper dem Tode und der Verwesung preisgibt.“</p><p>Während ich dies noch darlegte, winkte mir die Lehrerin mit der Hand und fragte: „Es wird doch nicht dein Geist von der geheimen Furcht verwirrt und beunruhigt, als ob die Seele nicht ewig fortdauere, sondern zugleich mit der Auflösung des Körpers vergehe?“ Ich aber ― infolge meiner Gemütsaufregung war ich noch immer nicht zu ruhiger Überlegung gekommen ― gab eine etwas unbedachte Anwort, ohne recht zu wissen, was ich sagte. Ich erklärte nämlich, die Schriftworte würden Befehlen gleichen, „durch die wir zur Annahme der ewigen Fortdauer unserer Seelen gezwungen werden. Nicht durch einen Vernunftgrund wurden wir zu diesem Glaubenssatz geführt, sondern unser Geist scheint durch eine Art innerer sklavischer Furcht den befohlenen Satz anzunehmen, nicht aber aus freiem Antrieb ihm beizustimmen. Gerade darum wird unsere Trauer um die Dahingeschiedenen besonders herb, weil wir nicht mit Bestimmtheit sagen können, ob jener Lebensfunke für sich allein noch existiert und wo er ist und in welchem Zustande oder ob er in keiner Weise und in keiner Form mehr existiert. Weil der wahre Sachverhalt so ungeklärt ist, halten sich die Meinungen für und wider die Wagschale und den einen scheint diese Meinung die Wahrheit zu treffen, den anderen die entgegengesetzte. Wenigstens gibt es bei den Griechen einige Philosophen, deren Namen einen guten Klang haben, welche die Sterblichkeit der Seelen annahmen und lehrten.“</p><p>Da sprach sie zu mir: „Laß die heidnischen Fabeleien, in denen der Erfinder der Lüge mit verführerischem Reize falsche Ansichten zum Nachteil der Wahrheit zusammenstellt! Dir kommt es vielmehr zu, darauf zu achten, daß eine solche Anschauung über die Seele nichts anderes wäre als die Abwendung von der Tugend und die Hinwendung einzig auf den Genuß und damit die Lossagung von der Hoffnung auf ein Leben, das erst in der Ewigkeit sich uns auftut, wodurch allein der Tugend zum Siege verholfen wird.“ ― Darauf erwiderte ich: „Wie können wir wohl zu einer festen und unerschütterlichen Überzeugung über die Unsterblichkeit der Seele gelangen? Denn das fühle ich selbst, daß das Menschenleben seines herrlichsten Gutes, der Tugend meine ich, verlustig geht, wenn nicht der Glaube an die genannte Unsterblichkeit in uns feste Wurzel gefaßt hat. Denn wie könnte die Tugend bei denen Eingang finden, die da als Grenze des Seins das gegenwärtige Leben betrachten und nach demselben auf nichts mehr hoffen?“§ 2. Die Seele in ihrem Verhältnis zu den Elementen.</p><p>Die Lehrerin machte dann folgenden Vorschlag: „Wir müssen also den Ausgangspunkt feststellen, den unsere Untersuchung nehmen soll, und von dir mag die Verteidigung der entgegengesetzten Anschauungen übernommen werden; denn mir scheint, daß deine Denkweise dich zu dieser Rolle geeignet macht. So wird die wahre Ansicht durch das Gegenteil beleuchtet werden.“ Nachdem sie diese Anordnung getroffen, gab ich ihr die Versicherung, daß ich die Einwände, die ich vorbringen würde, nicht selbst für ernst halte, sondern daß sie einzig dazu dienen sollen, die Glaubenslehre über die Seele nur desto fester zu begründen, wenn alle Einwände als hinfällig sich erwiesen. Darauf sprach ich: „Könnten die Vertreter der gegenteiligen Meinung nicht darauf hinweisen, daß der Körper, weil zusammengesetzt, sich vollständig in die Bestandteile auflöse, aus denen er besteht? Ist das Band, das die Elemente im Körper zusammenhält, gelöst, so strebt jedes in entsprechender Weise zu dem ihm Verwandten hin, da die Natur der Elemente selbst mit einer gewissen Notwendigkeit dem Gleichartigen zuführt, was zu ihm gehört. So wird sich die Wärme in unserem Körper wieder mit Wärme verbinden und das Erdartige mit dem Festen und so jeder der übrigen Grundstoffe zu dem ihm Verwandten kommen.“</p><p>„Wo wird denn die Seele sein? Würde darauf jemand antworten, sie wäre in den Elementen, so würde er damit auch zugeben, daß sie selbst ein Element sei; denn nichts kann sich mit Ungleichartigem verbinden. Wäre aber letzteres der Fall, so würde eine solche Verbindung mit verschiedenen Qualitäten ihre Zusammensetzung beweisen. Das Zusammengesetzte ist aber nicht einfach, sondern besagt ein Bestehen aus mehreren Bestandteilen; alles Zusammengesetzte ist aber der Auflösung unterworfen und die Auflösung ist der Untergang des Bestehenden. Das Vergängliche ist aber gewiß nicht unsterblich; sonst müßten wir auch den Leib unsterblich nennen, obgleich er in seine Bestandteile zerfällt.“</p><p>„Ist aber die Seele etwas von den Elementen Verschiedenes, wo sollen wir dann vernünftigerweise ihren Aufenthalt annehmen, da sie sich mit den Elementen wegen ihrer Ungleichartigkeit nicht vereinigen kann, sonst aber in der ganzen Welt sich nichts findet, wo die Seele ein ihrer Natur entsprechendes Leben führen könnte? Was aber nirgendwo ist, das ist überhaupt nicht.“</p><p>Meine Lehrerin seufzte bei diesen Worten leise auf und sprach: „Solches und ähnliches brachten wohl die Stoiker und Epikuräer vor, als sie in Athen gegen den Apostel auftraten (Apg. 17, 18). Denn ich höre, daß Epikur derartigen Anschauungen besonders huldigte, als ob, wie er gefunden zu haben glaubte, die Natur aller Dinge ganz zufällig und von selbst entstanden sei, ohne daß eine Vorsehung das All durchdringe. Folgerichtig sah er im Menschenleben auch nur gleichsam eine Wasserblase, und unseren Körper betrachtete er als durch eine Art Luft aufgeschwellt und nur von so langer Dauer, als das Gefäß den Lufthauch einzuschließen vermöge; sobald aber der Körper zerfalle, verflüchtige sich auch das in demselben Eingeschlossene. Ihm war nämlich das Sichtbare die Grenze der Natur der Dinge, und zum Maß unserer Weltanschauung machte er die sinnliche Wahrnehmung, während er die Erkenntnisquellen des Geistes vollständig verschlossen hielt und unfähig war, auf Geistiges und Unkörperliches seinen Blick zu richten, gerade wie ein in das Zimmer Eingesperrter die Wunder der Himmel nicht zu schauen vermag, weil Decke und Wände ihn hindern hinauszublicken. Denn aus allem, was in der Welt mit den Sinnen wahrnehmbar ist, erbauen sich Schwachköpfe gleichsam feste Wände, die sie verhindern, rein Geistiges zu erkennen. Solche sehen dann nur Erde, Luft, Wasser und Feuer; woher aber jedes dieser Elemente stammt, und wie es mit anderen verbunden ist, und von wem es in seinem Bestande erhalten wird, vermögen sie in ihrer Kurzsichtigkeit nicht zu erkennen. Zwar ein Gewand wenn einer sieht, so schließt er auf den Weber, oder beim Schiffe denkt er an den Schiffszimmermeister; desgleichen kommt beim Anblick eines Gebäudes den Beschauern sofort die Hand des Baumeisters in den Sinn. Die nämlichen aber vermögen, wenn sie die Welt betrachten, wegen ihrer Kurzsichtigkeit den nicht zu erkennen, der sich in ihr offenbart. Und so werden von denen, welche den Untergang der Seele lehren, solche weise und spitzfindige Sätze vorgebracht, als ob der Leib aus Elementen und die Elemente aus dem Leib wären und als ob die Seele nicht für sich allein bestehen könne, weil sie weder zu den Elementen gehöre noch mit ihnen fortbestehen könne.“</p><p>„Wenn nämlich die Gegner gerade deshalb, weil sie nicht gleicher Art mit den Elementen sei, der Ansicht huldigen, sie wäre überhaupt nirgends, so mögen sie vor allem auch das Leben im Fleische für ein Leben ohne Seele erklären; der Körper ist ja nichts anderes als eine Verbindung vieler Elemente; daher mögen sie es offen gestehen, daß nach ihnen die Seele in denselben nicht sein kann, um jene Verbindung zu beleben, wofern sie ihr nachher keine Fortdauer zutrauen, während die Elemente weiter existieren; daher gelangen sie schließlich zu der Behauptung, unser Leben sei tot. Wenn sie dagegen nicht bezweifeln, daß unsere Seele jetzt im Körper sei, wie können sie dann ihre Vernichtung annehmen, wenn der Körper in seine Elemente sich auflöst?“§ 3. Der Gottesbeweis ist zugleich ein Beweis für die Unsterblichkeit der Seele.</p><p>Sodann müssen sie aber auch bezüglich der göttlichen Natur zu denselben Behauptungen sich versteigen. Denn wie können sie annehmen, daß die geistige, immaterielle und gestaltlose Natur das Nasse und Weiche und Warme und Feste durchdringe und so alles Seiende in seinem Bestande erhalte, wenn sie weder mit den Dingen, in denen sie ist, Verwandtschaft hat noch wegen ihrer Ungleichartigkeit in ihnen sein kann? Darum sollen sie aus ihrer Lehre auch die Gottheit streichen, durch welche alles erhalten wird.</p><p>Ich erwiderte: „Darauf kommt es eben an! Wie könnte unseren Gegnern als zweifellose Wahrheit bewiesen werden, das Universum stamme von Gott und werde von ihm erhalten oder es existiere etwas Göttliches, das über die Natur der Dinge erhaben sei?“</p><p>Sie antwortete aber: „Am besten wäre es, zu solchen Dingen zu schweigen und so törichte und gottlose Fragen keiner Antwort zu würdigen, zumal ein göttlicher Ausspruch verbietet, dem Toren auf seine Torheit hin zu antworten (Sprichw. 26, 4); ein Tor aber ist jedenfalls der, der da sagt, es gäbe keinen Gott (Ps. 52, 2 [hebr. Ps. 53, 2]). Da ich mich aber auch dazu äußern muß, so will ich dir eine Rede kundtun, aber nicht von mir, auch nicht die von einem anderen Menschen ― ein solcher ist stets klein und unbedeutend, selbst wenn er groß zu sein scheint ― sondern die Rede, welche die Schöpfung durch ihre Wunder hält, welche das Auge vernimmt und die auf Grund des Gesehenen als eine Rede voll Weisheit und Macht in unseren Herzen widertönt. Klar verkündet ja die Schöpfung den Schöpfer, weil die Himmel selbst, wie der Prophet sich ausdrückt, die Herrlichkeit Gottes mit Worten erzählen, die nicht gesprochen werden (Ps. 18, 2 [hebr. Ps. 19, 2]). Denn wer die Wunder am Himmel und auf Erden betrachtet, und wie die von Natur aus einander widerstrebenden Elemente kraft einer geheimnisvollen Zusammengehörigkeit doch alle zu dem nämlichen Zwecke sich verbinden und ein jegliches mit der gerade ihm eigentümlichen Kraft zur Erhaltung des Ganzen beiträgt, und wie weder das Unvermischbare und das zu einer Verbindung Unfähige gemäß der besonderen Eigenschaften sich voneinander fernhält noch bei vorkommender Verbindung der entgegengesetzten Beschaffenheiten gegenseitig sich zerstört, wie vielmehr einerseits das von Natur aufwärts Strebende in die Tiefe steigt, z. B. die Sonnenwärme, welche in den Strahlen herabströmt, andererseits schwere Körper leicht werden, indem sie sich zu Dünsten verfeinern, so daß sowohl das Wasser gegen seine Natur in die Höhe steigt und auf Winden durch die Luft schwebt, als auch das ätherische Feuer zur Erde sich senkt, damit auch die Tiefe der Wärme nicht entbehre; wer ferner beobachtet, wie das in Regengüssen auf die Erde strömende Naß, obgleich es seiner Natur nach nur eines ist, zahllose verschiedene Pflanzenarten erzeugt, indem es sich mit ihren Wurzeln auf die entsprechende Weise verbindet, wer dann den reißendschnellen Umschwung des Himmels und die umgekehrte Bewegung der inneren Kreisbahnen, sowie den Lauf und die Begegnung der Gestirne samt deren harmonischen Abstand voneinander betrachtet ― wer dies alles mit dem geistigen Auge der Seele anschaut, wird er nicht durch seine Beobachtungen zur klaren Erkenntnis geführt, daß eine wahrhaft göttliche Kraft, mit unendlicher Weisheit und Kunst überall waltend, sowohl die Teile dem Ganzen anpaßt als auch das Ganze durch die Teile vollendet, und daß das Universum durch eine einzige Kraft regiert wird, durch die es in sich selbst beharrt und um sich selbst bewegt wird, und daß es diese Bewegung auch nicht aufgibt noch seinen ihm angewiesenen Platz jemals verläßt?“</p><p>Da sprach ich: „Und wie beweist der Glaube an Gott zugleich das Dasein der menschlichen Seele (da doch die Seele nicht identisch mit Gott ist), so daß mit dem Bekenntnis an die Existenz des einen zugleich die Existenz des andern anerkannt werden müßte?“ Darauf erwiderte sie: „Alle Weisen geben zu, daß der Mensch eine Welt im kleinen (Mikrokosmus) sei, da er diejenigen Elemente in sich enthält, aus denen das Weltall besteht. Ist aber dieses Wort wahr ― und es scheint so ― so bedürfen wir kaum eines anderen Beweismittels für unsere Anschauung über die Seele. Wir sind aber dafür eingetreten, daß die Seele neben dem gröberen Körper auf Grund einer von ihm getrennten und andersartigen Natur für sich allein existiere. Wie wir nämlich, falls wir mittels unserer sinnlichen Wahrnehmung die Welt betrachten, durch unsere Sinnestätigkeit selbst zu einer übersinnlichen Sache und Idee hingeführt werden und das Auge zum Dolmetscher der allmächtigen Weisheit wird, welche sich im Universum offenbart, und auf jenen, der durch sie das Universum erhält, durch sich selbst hinweist ― so können wir, falls wir die Welt in uns ins Auge fassen, mächtige Veranlassungen finden, von dem aus, was in die Erscheinung tritt, auf das zu schließen, was sich verborgen hält. Verborgen ist aber das, was, weil an sich geistig und unsichtbar, der sinnlichen Wahrnehmung sich entzieht.“</p><p>Da wendete ich ein: „Allerdings wegen der weisen und kunstvollen Ordnungen, welche in dieser Weltharmonie die Natur der Dinge uns deutlich vor Augen führt, müssen wir auf die über dem Universum thronende Weisheit schließen. Aber wie sollten wir auf dem besagten Wege, der uns aus den sichtbaren Erscheinungen auf ein unsichtbares Wesen zuführt, auf Grund von Beobachtungen am Körper eine Kenntnis der Seele gewinnen?“ Die Jungfrau erwiderte darauf: „Gewiß finden alle, welche nach dem alten weisen Worte sich selbst kennenlernen wollen, an der Seele selbst eine treffliche Lehrerin hinsichtlich der Ansichten über die Seele in der Richtung, daß sie etwas Immaterielles und Körperloses ist, daß sie wirken und sich bewegen kann, wie es ihrer besonderen Natur entspricht, und daß sie ihre Bewegungen durch die körperlichen Organe verrät. Zwar findet sich diese organische Ausstattung auch bei den Toten in nicht geringerem Maße, aber sie bleibt ohne Leben und ohne Tätigkeit, weil die von der Seele ausgehende Kraft nicht mehr in ihr ist. Nur solange kann sie in Tätigkeit treten, als in den Organen Empfindung vorhanden ist, und durch die Empfindung Geisteskraft strömt, die mittels ihrer eigenen Anregungen die Sinnesorgane nach ihrem Willen in Bewegung setzt.“§ 4. Die Tätigkeit der Seele überragt die der Sinne.</p><p>Hierauf stellte ich die Frage: „Was ist also die Seele, wenn sich ihre Natur überhaupt mit Worten umschreiben läßt, damit wir durch diese Umschreibung einen noch besseren Begriff von der Sache gewinnen?“ Die Antwort der Lehrerin lautet also: „Die einen haben diesen, die anderen jenen Begriff von der Seele aufgestellt, je nach der Vorstellung, die sie sich von ihr gemacht hatten. Unsere Anschauung geht dahin: die Seele ist ein gewordenes Wesen, und zwar ein Wesen lebendig und denkfähig und das dem mit Organen und Sinneswerkzeugen ausgerüsteten Körper die Lebenskraft verleiht und jene Sinneswerkzeuge (aus Ber.: lies: „Sinneswerkzeuge“ statt „Sinneswerzeuge“) befähigt, sich zu betätigen, solange der Körper sich in einem entsprechenden Zustand befindet.“ Während sie das nun Folgende sprach, zeigte sie mit der Hand auf den Arzt, den sie zur Kur des Leibes beigezogen hatte und der neben ihr saß. „Nahe liegt (fuhr sie weiter) die Bestätigung meiner Worte! Denn wie vermag dieser Mann, indem er mit dem Finger den Puls befühlt, durch den* Tastsinn* gleichsam zu hören, was die Natur zu ihm spricht und was sie von ihrem Befinden berichtet, nämlich daß die Körperschwäche zunimmt, daß die Krankheit von diesen Eingeweiden ausging und das Fieber diesen Grad erreicht? Auch durch das* Auge* erfährt er noch einiges andere nach dieser Richtung, wenn er auf die Art des Liegens hinschaut oder auf die Abmagerung des Fleisches, und wie der innere Zustand sich kundgibt in dem Aussehen der Hautfarbe, wenn dieselbe gelblich und gallicht wird, ebenso durch den Blick der Augen, wenn derselbe bei Trauer und Schmerz sich unwillkürlich verzieht. In ähnlicher Weise unterrichtet auch das* Gehör* über dergleichen, indem es an dem häufigen und beklommenen Atmen und durch das Stöhnen, das mit dem Atmen verbunden ist, das Leiden erkennt. Man könnte aber sagen, nicht einmal der* Geruch* ist für den Kundigen hiezu ungeeignet, das Leiden zu bestimmen, vielmehr schließt er aus einer bestimmten Beschaffenheit der Ausatmung auf das im Innern sitzende Übel. Wie könnte all das stattfinden, wenn nicht eine* geistige* Kraft vorhanden wäre, welche jede Sinnestätigkeit begleitet?“</p><p>„Wie könnte uns die Hand durch sich allein eine Kunde verschaffen, wenn nicht Denken das Tasten zur Erkenntnis des betreffenden Gegenstandes emporleitete? Oder wie würde das Gehör, getrennt vom Denken, oder das Auge oder die Nase oder sonst ein Sinneswerkzeug zur Erkenntnis der Sache verhelfen, die zur Untersuchung steht? Vielmehr ist vollkommen wahr, was bereits einer der heidnischen Weltweisen trefflich gesagt haben soll, der Geist sei es, der sieht, der Geist, der hört. Gäbe man die Berechtigung dieses Ausspruches nicht zu, wie könntest du dann, wenn du die Sonne so, wie du es von deinem Lehrer gelernt hast, anschauest, bestimmt erklären, sie sei nicht so klein an Umfang, wie es der Menge erscheint, sondern vielmal größer als die Erde? Nicht etwa deshalb, weil du, von den Erscheinungen zwar ausgehend, der Art der Bewegung, den zeitlichen und räumlichen Abständen und den Ursachen der Verfinsterung mit deinem* Denken* nachspürest, kannst du kühn behaupten, daß es sich so verhalte? Desgleichen wirst du, wenn du die Ab- und Zunahme des Mondes überlegst, auf Grund der äußeren Erscheinung desselben andere Kenntnisse von ihm gewinnen (als es durch die bloße Sinneswahrnehmung möglich wäre), nämlich daß er seiner eigenen Natur nach ohne Licht ist und sich im Kreise um die Erde bewege, sein Licht aber von den Sonnenstrahlen empfange, wie es bei Spiegeln zu geschehen pflegt, welche, wenn die Sonne auf sie scheint, zwar keine Strahlen aus sich selbst aussenden können, aber doch die des Sonnenlichtes, das von dem glatten und blinkenden Körper zurückgeworfen wird. Freilich jenen, welche den Mond bloß anschauen, ohne näher zu prüfen, scheint er den Glanz von sich selbst aus zu verbreiten. Daß dem aber nicht so ist, erhellt daraus, daß, wenn er der Sonne gerade gegenübersteht, seine ganze Scheibe durchleuchtet ist, welche er uns zuwendet. Da aber der Kreis, den er zu durchlaufen hat, kleiner ist und darum in kürzerer Zeit durchmessen werden kann, so durchwandert er seine Bahn mehr als zwölfmal, ehe die Sonne nur einmal die ihrige zurücklegt. Daher kommt es, daß dieser Himmelskörper nicht immer vollständig durchleuchtet ist; denn bei der Oftmaligkeit seines Umlaufes nimmt er der Sonne gegenüber, welche erst in einem langen Zeitraume ihre Kreisbahn vollendet, während er die seinige in kurzer Zeit oftmals durchläuft, nicht immer die gleiche Stellung ein, sondern wie jene Stellung, in welcher er der Sonne gerade gegenüber sich befindet, den ganzen uns zugekehrten Teil des Mondes durch die Sonnenstrahlen durchleuchten ließ, so muß, wenn er in schräge Richtung zur Sonne kommt, die jeweilig* ihr* zugekehrte Hälfte des Mondes von ihren Strahlen beschienen werden, die* uns* zugekehrte dagegen in den Schatten treten, indem der Glanz von dem der Sonne abgewendeten Mondteil auf den ihr zugewendeten Teil übergeht, bis der Mond ganz unter die Sonnenscheibe getreten ist und nun auf der Rückseite die Strahlen aufnimmt, so daß die* obere* Hälfte ganz beleuchtet, der* untere* uns zugekehrte Teil aber dunkel wird, da er eben überhaupt an sich selbst glanz- und lichtlos ist; dies heißt dann die völlige Abnahme des Mondes oder Neumond. Wenn er aber gemäß der Bewegung seines Laufes wieder mehr neben die Sonne und in schräge Richtung zu den Strahlen getreten, so beginnt der vor kurzem noch dunkle Teil wieder zu leuchten, da die Strahlen von dem beleuchteten Abschnitt auf den bisher noch dunklen übergehen.“</p><p>„Siehst du also, in welch bedeutenden Dingen das Auge ein Lehrmeister für dich wird? Freilich könnte es dir niemals eine solche Anschauung durch sich selbst verschaffen, wenn nicht etwas wäre, das sich des Auges als eines Mittels bedient, um zu sehen, und dem die sinnliche Wahrnehmung nur der Wegweiser ist, um durch das Sichtbare zum Unsichtbaren vorzudringen. Was soll ich noch die geometrischen Beweisgänge anführen, die uns an der Hand der sinnlichen Figuren zu übersinnlichen Erkenntnissen hinleiten, und außerdem noch unzählig anderes, woraus hervorgeht, daß durch die Funktionen unseres Leibes das geistige Wesen sich kundgibt, das in unserer Natur verborgen ist?“§ 5. Auch die Erfindungen sprechen für den geistigen Charakter der Seele.</p><p>Hier stellte ich die Frage: „Da bei der sinnlich wahrnehmbaren Natur der Elemente die Materialität zwar überall die gleiche ist, aber doch in jeder Art von Materie im besonderen ein großer Unterschied herrscht (denn es ist bei ihnen sowohl die Bewegung eine verschiedene, nämlich hier aufwärts, dort abwärts, als auch die Gestalt und Qualität nicht dieselbe), wie nun, wenn deshalb jemand behaupten würde, eine von solch stofflichen Elementen ausgehende Kraft sei es, welche jene Vorstellungen und Denkbewegungen aus ihrer eigenen natürlichen Beschaffenheit und Fähigkeit erzeugt, wie wir ja auch aus den Händen der Mechaniker Werke hervorgehen sehen, welche, in kunstvoller Weise hergestellt, die Natur nachahmen, und zwar in solchem Grade, daß die Ähnlichkeit nicht bloß in der Gestalt, sondern auch in der Beweglichkeit sich zeigt und sie sogar einen bestimmten Ton hervorbringen, indem der hiezu eingerichtete Teil der Maschine Laute hören läßt; und doch können wir bei diesen Erscheinungen von einer übersinnlichen Kraft nicht reden, welche durch sich Gestalt und Aussehen, Ton und Bewegung bewirken würde. Wenn wir nun behaupten wollten, ein gleiches fände bei der Maschine unseres menschlichen Leibes statt, ohne daß hiezu die Mitwirkung eines besonderen geistigen Wesens erforderlich wäre, sondern infolge einer mit der Natur unserer Grundstoffe von selbst gegebenen bewegenden Kraft, und als Endresultat ergäben sich die angestaunten menschlichen Leistungen, welche nichts anderes wären als das Produkt von Bewegungen und Antrieben, welche in uns die Erkenntnis von all dem hervorriefen, was uns frommt, was (aus Ber.: lies: „frommt, was“ statt frommt. Was…)würde nun dadurch eher bewiesen: die besondere Existenz jener geistigen und unkörperlichen Wesenheit der Seele oder ihre Nicht-Existenz überhaupt?“</p><p>Sie aber erklärte: „Das angeführte Beispiel spricht zu unseren Gunsten; aber auch das ganze Rüstzeug der gegen uns vorgebrachten Widerrede trägt nicht wenig zur Befestigung unserer Anschauung bei.“ Ich antwortete: „Wie meinst du das?“ Nun gab sie folgende Erläuterung: „Gerade die Fähigkeit, den seelenlosen Stoff so zu behandeln und zu ordnen, daß die in den Maschinen niedergelegte Kunstfertigkeit beinahe zur Seele für den Stoff wird, so daß er Bewegung und Ton und Gestalt und anderes Ähnliches nachahmt, dürfte ein Beweis dafür sein, daß ein Etwas in uns Menschen lebt, das imstande ist, durch die Kraft des Nachdenkens und Erfindens zuerst im Geiste Maschinen zu entwerfen und in Gedanken schon vorher zusammenzustellen, dann mit Hilfe großer Gewandtheit zu fertigen und so Gedanken durch den Stoff darzustellen. Denn zuerst mußte der Mensch beobachten, daß man Odem zur Hervorbringung benötige; dann durchforschte er, um Luft für die Maschine zu beschaffen, die Natur der Elemente und fand, daß nichts in der Welt leer sei, sondern das Leichte im Vergleich zum Schwereren für leer angesehen würde, da ja sogar die Luft ihrem Wesen nach dicht und voll sei; denn ein Gefäß, in dem keine Flüssigkeit ist, heißt nur uneigentlich leer; der Unterrichtete weiß aber auch von einem solchen Gefäß, daß es voll ist, nämlich erfüllt von Luft. Beweis hiefür ist der Umstand, daß ein in einen Teich geworfener Krug sich nicht sogleich mit Wasser füllt, sondern anfangs auf der Oberfläche schwimmt, indem die darin befindliche Luft das Hohlgefäß oben erhält, bis der Krug, etwa von menschlicher Hand niedergedrückt, in die Tiefe geht und nunmehr durch die Mündung Wasser aufnimmt. Bei diesem Vorgang zeigt es sich dann deutlich, daß der Krug auch vor Aufnahme des Wassers nicht leer war. Denn man kann bei der Mündung einen Kampf zwischen den beiden Elementen wahrnehmen, indem das Wasser durch seine Schwere sich in die Höhlung drängt und hineinströmt, die in der Höhlung zuvor befindliche Luft aber neben dem Wasser mit Gewalt herausströmt, so daß das Wasser dadurch gehemmt wird und beim Andrang der Luft schäumend aufgurgelt. Auf Grund solcher Beobachtung gelangte er durch Nachdenken darauf, wie er Luft in die Maschine brächte. Er stellte nämlich eine Höhlung aus festem Stoffe her, schloß darin die Luft undurchdringlich von allen Seiten ein und brachte durch die Mündung eine nach Maßgabe des Bedürfnisses bestimmte Quantität Wasser in die Höhlung. In einer daneben angebrachten Röhre gibt er auf der entgegengesetzten Seite der eingeschlossenen Luft einen Ausweg; die Luft aber, die mittels des Wassers gewaltsam herausgepreßt wird, wird zum Hauche, der dann in die Vorrichtung an der Röhre (Pfeife) drängt und einen Ton erzeugt.“</p><p>„Sieht man nicht deutlich aus diesen offenbaren Tatsachen, daß im Menschen neben dem offen Wahrnehmbaren ein von ihm verschiedener Geist wohnt, der in seiner gestaltlosen und unkörperlichen Natur all diese Dinge denkend entwirft und sodann diese Entwürfe mit Hilfe des Stoffes zum sichtbaren Ausdrucke bringt. Denn wenn gemäß der gegnerischen Meinung die Elemente durch ihre eigene Natur solche erstaunliche Wirkungen hervorbrächten, so würden wohl derartige Maschinen von selbst entstehen, und es würde das Erz nicht auf die Kunst warten, um Menschengestalt anzunehmen, sondern schon gleich durch seine Natur dazu kommen; ebensowenig bedürfte die Luft der Pfeife, um zu tönen, sondern sie würde dies von selbst vermögen, wie sie auch sonst verschiedenartig weht und sich bewegt. Desgleichen brauchte das Wasser in einer Röhre nicht in die Höhe getrieben werden, indem die Kunst durch Druck ihm diese widernatürliche Bewegung aufzwingt, sondern von selbst ginge es in die Maschine, um durch seine eigene Natur in die Höhe zu steigen. Wenn aber hievon nichts durch die Natur der Elemente von selbst geschieht, sondern all das durch die Kunst nach der freien Entscheidung der Menschen zustande kommt, Kunst aber eine Art sicheren Denkens ist, das planmäßig durch die Materie nach Verwirklichung strebt, das Denken aber nur eine dem Geiste eigene Tätigkeit und Bewegung ist, dann hat sogar die aus den Einwürfen gegen uns gezogene Konsequenz die Verschiedenheit des Geistes von der Erscheinung bewiesen.“§ 6. Die Verwandtschaft zwischen dem göttlichen und menschlichen Geist.</p><p>Da erwiderte ich: „Ich selbst gestehe nun, daß dem so sei, nämlich daß das Erscheinende und Nicht-Erscheinende nicht das gleiche seien; doch vermag ich in dieser Darlegung noch nicht das Gewünschte zu sehen. Denn es ist mir noch nicht klar, wofür man jenes Nicht-Erscheinende halten soll, nur daß es nichts Materielles ist, habe ich durch die bisherige Untersuchung erfahren, keineswegs aber, was man (positiv) von ihm zu halten habe. Aber gerade dies möchte ich wissen, was es ist, nicht bloß, was es nicht ist!“ ― Darauf erklärte sie: „Vieles lernen wir auch durch eine solche Definition, bei der wir vom Wesen des betreffenden Gegenstandes nur angeben, das oder jenes sei es nicht. Denn nennen wir jemand untadelig, so erklären wir ihn als gut; und nannten wir jemand unmännlich, so haben wir ihn als feig gekennzeichnet. Es ließen sich noch viele ähnliche Bestimmungen anführen, bei denen wir durch die Negation des Schlechten auf das Vorhandensein einer guten Eigenschaft hinweisen, oder umgekehrt durch die Negation des Guten etwas als schlecht hinstellen. Daher wird auch bei unserer gegenwärtigen Untersuchung jemand nicht leicht die richtige Erkenntnis des Gegenstandes, der in Frage steht, verfehlen.</p><p>Zur Untersuchung steht aber die Frage, was wir als das eigentliche Wesen des Geistes bezeichnen. Wer nun die Existenz unseres zur Erörterung stehenden Gegenstandes wegen seiner Tätigkeit, die sich uns kundgibt, nicht bezweifelt, aber auch noch sein Wesen erkennen möchte, dürfte diese Kenntnis schon gewinnen, wenn er weiß, was es nicht ist, nämlich nicht etwas, was schon die Sinneswahrnehmung erfaßt, also nicht Farbe, nicht Gestalt, nicht Härte, nicht Schwere, nicht Größe, nicht die dreifache Ausdehnung, nicht die örtliche Lage, nicht überhaupt etwas von dem, was man an der Materie beobachtet, d. h. wenn es außerdem noch etwas anderes gibt.“</p><p>Ich fiel ihr nun in die Rede mit folgenden Worten: „Ich weiß nicht, ob nun dadurch, daß wir all dies in Gedanken aufheben, nicht auch unser Gegenstand selbst beseitigt wird. Denn welches Bild sich unser Vorstellungsvermögen nach Aufhebung der genannten Attribute noch machen könnte, kann meines Erachtens wenigstens noch nicht angegeben werden. Denn überall, wo wir bei Untersuchung der Dinge mit dem forschenden Verstande wie Blinde, die an den Wänden zur Türe sich hinleiten, nach ihrem Begriff und Wesen tasten, treffen wir eine der erwähnten Bestimmungen an, sei es, daß wir auf Farbe stoßen oder auf Gestalt oder Größe oder auf eine andere der Eigenschaften, die du aufgezählt hast. Wenn wir aber von einem Wesen annehmen, es habe nichts von all dem, so werden wir von Kleinmut befallen und von der Ansicht versucht, es existiere überhaupt nicht.“</p><p>Unwillig mich unterbrechend erwiderte sie: „Wehe über einen solchen Unverstand! Wohin führt doch eine derartige kleinliche und niedrige Beurteilung der Dinge? Denn wer alles, was er nicht mit den Sinnen wahrnimmt, aus der Liste des Seienden streicht, der dürfte auch jener Kraft, welche das Universum regiert und trägt, das Sein nicht zuerkennen, sondern müßte, sobald er über ihre Unkörperlichkeit und Gestaltlosigkeit belehrt wird, daraus den Schluß ziehen, sie existiere überhaupt nicht. Wenn nun das Nicht-dieses-Sein keineswegs mit dem Nicht-Sein gleichbedeutend ist, wie dürfte man den menschlichen Geist aus dem Reiche des Seienden deshalb verdrängen, weil ihm körperliche Eigenschaften abgesprochen werden müssen?“ ― „Demnach“, sprach ich, „tauschen wir durch diese Schlußfolgerung für eine Verkehrtheit eine andere ein. Denn das Resultat unserer Erörterung geht dahin, daß wir unseren menschlichen Geist für identisch mit dem göttlichen Geiste zu halten hätten, weil wir durch Aufhebung der sinnlichen Eigenschaften zur rechten Vorstellung des einen wie des anderen gelangen sollen.“</p><p>Da sprach meine Lehrerin: „Sage nicht, daß Gott und Seele* gleich* seien ― denn dies wäre ein frevelhaftes Wort ― sondern, wie das göttliche Wort dich unterrichtet, daß beide* ähnlich* sind. Denn was nach dem Ebenbilde geschaffen wurde, besitzt nur Ähnlichkeit mit seinem Ur- und Vorbild, wenngleich eine weitgehende: das Geistige mit dem Geistigen, das Körperlose mit dem Körperlosen; wie dieses ist es frei von Schwere und erhaben über alle Dimensionen. Dennoch sind sie dadurch voneinander verschieden, daß jedem von beiden eine eigene Natur zukommt; denn die Seele wäre nicht bloß mehr Ebenbild, wenn sie in allen Stücken mit Gott übereinstimmen würde. Aber indem sie nicht alle, sondern nur manche Vorzüge, die das betrachtende Auge in der unerschaffenen Natur als dem Urbild erblickt, ebenfalls besitzt, erweist sie sich als deren geschaffenes Abbild. Und wie man oft in einem Stückchen Glas, wenn es gerade vom Sonnenstrahl getroffen wird, die ganze Sonnenscheibe sieht, wenn sie dabei auch nicht in ihrer vollen wirklichen Größe erscheint, sondern in einem weit geringeren Umfang, welcher der Kleinheit des Glases entspricht, so spiegeln sich auch in der Beschränktheit unserer Natur die Abbilder jener unaussprechlichen göttlichen Eigenschaften wider, so daß die Vernunft an der Hand dieser Eigenschaften, vorausgesetzt, daß sie bei der Untersuchung jede körperliche Bedingtheit für die Begriffsbestimmung ausscheidet, sicher zu einer richtigen Erkenntnis vom Wesen der Seele gelangen kann, andererseits wird sie auch nicht die Gleichstellung der geringen und hinfälligen Natur mit der unendlichen und ewigen Natur vollziehen, sondern ihr Wesen zwar als geistig auffassen, weil sie ja auch das Abbild einer geistigen Substanz ist, aber nimmermehr als identisch mit dem Urbild erklären.“§ 7. Die Verbindung der Seele mit dem menschlichen Leibe vor und nach dem Tode.</p><p>„Wie wir nun auf Grund der unaussprechlichen Weisheit Gottes, die in dem Universum sich offenbart, nicht daran zweifeln können, daß die göttliche Natur und Macht allem Seienden innewohne, damit alles im Sein zu verharren vermöge, (obgleich nämlich, wenn man um den natürlichen Begriff fragt, die Wesenheit Gottes von der ganzen Reihe der Dinge, die in der Schöpfung sinnlich und geistig wahrgenommen werden, völlig verschieden ist, so zweifelt doch niemand, daß in diesen jenes seiner Natur nach verschiedene göttliche Wesen vorhanden ist), so ist es auch keineswegs unglaubhaft, daß für die Wesenheit der Seele, auch wenn sie etwas anderes ist ― für was man immer sie halten mag ― der Umstand, daß die sinnlich wahrnehmbaren Elemente der Welt entsprechend dem Begriff ihrer Natur mit ihr nicht übereinstimmen, kein Hindernis für ihre Existenz bildet.“</p><p>„Denn wie bereits gesagt, nicht einmal in den lebendigen Körpern, welche aus einer Vermengung von Elementen bestehen, tritt eine Vermengung der einfachen und gestaltlosen Seele mit den massigen Bestandteilen des Körpers ein, und doch bezweifelt niemand, daß in letzteren die Seele wohnt ihrer Lebenstätigkeit nach, auf Grund einer Verbindung, die den menschlichen Verstand überragt.“</p><p>„Darum wird auch, wenn die Elemente des Körpers wieder auseinandergehen, das Band, das die belebende Seelentätigkeit um dieselben geschlungen hat, nicht völlig der Auflösung verfallen. Im Gegenteil, gleichwie, solange die Elemente miteinander im Körper vereinigt sind, die einzelnen Teile dadurch beseelt werden, daß die Seele alle zum Körper gehörigen Teile auf gleiche und ähnliche Weise durchdringt, und trotzdem niemand dieselbe weder für starr und fest erklären wird, weil sie mit Erdhaftem verbunden ist, noch für naß oder kalt oder warm, weil sie allen diesen Qualitäten innewohnt und ihnen die Lebenskraft einflößt, so ist auch die Vermutung nicht als ganz grundlos zu verwerfen, jene einfache und von aller Zusammensetzung freie Natur werde, auch wenn die Vereinigung der körperlichen Bestandteile aufgehoben ist und dieselben verwandten Stoffen sich zugesellen, noch jedem dieser Teile gegenwärtig bleibe; vielmehr liegt die Meinung nahe, daß sie, nachdem sie einmal mit den Elementen, solange diese beisammen waren, auf geheimnisvolle Weise vereinigt war, auch für beständig bei jenen verharre, mit denen sie verbunden war, und durch nichts aus der Verbindung gerissen werde, in der sie einmal gestanden hatte. Denn es ist keine Gefahr vorhanden, es werde das Nicht-Zusammengesetzte ebenfalls aufgelöst werden, wenn das Zusammengesetzte der Auflösung anheimfällt.“</p><p>Und ich sagte: „Gewiß dürfte der Ansicht, daß die Elemente des Körpers sich zusammenfinden und auch wieder sich trennen, und daß hiedurch der Leib entsteht und stirbt, wohl niemand entgegentreten. Da aber zwischen diesen ein großer Unterschied festzustellen ist, weil sie in bezug auf örtliche Lage, verschiedene Eigenschaften und Bestimmtheiten voneinander abweichen, so ist zwar richtig, daß, wenn die Elemente sich um den Grundstoff versammelt haben, jene geistige und ausdehnungslose Natur, die wir Seele nennen, mit allen zum Körper vereinigten Bestandteilen sich innig verwächst; wenn dieselben aber wieder voneinander getrennt werden und dahin gehen, wohin die Natur ein jedes führt, wie wird es ihr alsdann ergehen, wenn ihr das Fahrzeug in alle Windrichtungen zerstreut wird? Wie ein Schiffer, wenn sein Fahrzeug durch Schiffbruch zerschellt, da er nicht auf allen da- und dorthin im Meere umhergeschleuderten Teilen des zertrümmerten Schiffes zugleich schwimmen kann, jedenfalls halt den nächsten besten ergreifen und die anderen den Wogen überlassen wird, ebenso wird die Seele, da sie bei der Auflösung der Elemente sich nicht mit denselben auflösen kann, jedenfalls, wenn sie wirklich vom Körper untrennbar ist, mit irgendeinem Elemente sich verbinden und von den anderen sich trennen. Und so kommen wir schließlich zu dem Ergebnis, daß wir ebensowenig an ihre Unsterblichkeit glauben, weil sie mit einem Körperbestandteil verbunden lebt, als an ihre Sterblichkeit, weil sie in den übrigen nicht lebt.“</p><p>„Doch“, sagte sie, „das Geistige und Ausdehnungslose zieht sich weder zusammen, noch dehnt es sich aus ― nur Körpern kommt ja Zusammenziehung und Ausdehnung zu ―, sondern infolge seiner unsichtbaren und körperlosen Natur ist es sowohl den im lebendigen Körper vereinigten Elementen, als den nach dem Tode getrennten Bestandteilen gleichmäßig gegenwärtig; sie fühlt sich weder beengt, wenn sie im Körper vereinigt sind, noch verlassen, wenn sie beim Scheiden zu den ihnen verwandten und gleichartigen Stoffen zurückkehren, wie sehr sie auch wegen ihrer verschiedenartigen Natur voneinander abstehen. Sehr verschieden ist ja das aufwärts Strebende und Leichte von dem Schweren und Erdhaften, das Warme vom Kalten, das Nasse vom Trockenen. Aber für die geistige Natur ist es keine Mühe, jedem Teile gegenwärtig zu bleiben, mit dem sie in der Körpermischung verwachsen war; auch berührt sie die Verschiedenheit der Elemente nicht. Denn wenn man auch bei denselben im Hinblick auf die räumliche Entfernung und auf ihre eigentümliche Beschaffenheit einen großen Unterschied annehmen muß, so kann sich doch die ausdehnungslose Seele leicht mit dem räumlich Getrennten verbinden, da es auch jetzt dem Geiste vergönnt ist, sowohl den Himmel zu betrachten, als auch in wißbegierigem Forschen bis an die äußersten Grenzen der Erde zu eilen, während doch der betrachtende Teil unserer Seele nicht zerrissen wird, auch wenn er sich in solche Weiten ausdehnt. Demnach steht der Seele nichts im Wege, den Elementen des Leibes nahe zu sein, mögen sie nun vereint und verbunden oder aufgelöst und zerstreut sein.“</p><p>„Denn wie man bei Verschmelzung von Gold und Silber eine gewisse künstlerische Macht bemerkte, welche die Stoffe zusammenschmilzt, und die Idee der Kunst auch dann, wenn der eine Stoff von dem anderen wieder geschieden wird, bei jedem derselben bleibt, und der Stoff zwar der Trennung unterliegt, die Kunst aber nicht zugleich zerteilt wird (denn wie sollte das Unteilbare geteilt werden), ebenso wird die geistige Natur der Seele sowohl in der Verbindung der körperlichen Elemente vorgefunden, als auch bei deren Zerfall nicht weggestoßen, sondern, in ihnen bleibend, wird sie, obgleich sie doch beim Auseinandergehen dieser Urbestandteile dieselben begleitet, gar nicht zerstückelt, noch etwa nach der Zahl derselben in Teile und Teilchen zerkleinert. Letzteres kann bei der körperlichen und ausgedehnten Natur vorgenommen werden, dagegen die geistige und von der Ausdehnung freie Natur ist über räumliche Bestimmungen erhoben. Demnach verharrt die Seele in den Verbindungen, in die sie einmal eintrat, da sich keine Notwendigkeit einsehen läßt, welche dieselben zerstören könnte. Was ist also Trauriges daran, wenn gegen das Wahrnehmbare das Unwahrnehmbare eingetauscht wird, und warum ist dein Gemüt so gegen den Tod erbittert?“§ 8. Die Grundkräfte der Seele.</p><p>Ich nahm im Geiste den Begriff, den sie früher von der Seele gegeben hatte, wieder auf und gestand, daß ihre Erklärung, die Seele sei ein geistiges Wesen und bringe in den organisch ausgestatteten Körper Lebenskraft, um die Sinneswerkzeuge zu ihrer Tätigkeit zu befähigen, mich nicht genügend über die Kräfte unterrichtet habe, welche an der Seele hervortreten. Denn nicht bloß mit Denken zum Zwecke des Erforschens und Verstehens beschäftigt sich unsere Seele, indem sie in ihrem geistigen Teile nach solcher Richtung tätig ist, auch lenkt sie nicht allein die Sinneswerkzeuge zu der ihrer Natur entsprechenden Tätigkeit, sondern man bemerkt auch in ihrer Anlage eine starke Tätigkeit des Begehrens sowie eine ebenso starke Tätigkeit des Zürnens; und da beide sich in umfassender Weise in uns auswirken, so beobachten wir Äußerungen derselben, die ebenso häufig als mannigfaltig sind; viele Handlungen gehen ja aus der Begierde, viele aus dem Zorn hervor. Und nichts von alldem ist körperlich; das Unkörperliche ist aber geistig; nun ist unsere Seele nach der gegebenen Definition etwas Geistiges. Daraus folgt aber notwendig, daß von zwei Ungereimtheiten die eine auftauchen muß: entweder auch der Zorn und die Begierde seien noch andere Seelen in uns, so daß wir mehrere Seelen statt einer bekämen, oder aber das, was in uns denkt, sei keine Seele. Denn dadurch, daß die Geistigkeit auf alle Seelenvermögen übertragen wird, werden entweder alle als Seelen erklärt oder es wird allen ausnahmslos das eigentümliche Wesen der Seele gleichmäßig abgesprochen.</p><p>Sie gab hierauf folgende Erwiderung: „So hast denn auch du einen Punkt, der bereits von vielen anderen besprochen wurde, zur Untersuchung gestellt, nämlich, wofür man den Zorn und das Begehrungsvermögen halten solle: sei es, daß man beides als zum Wesen der Seele gehörig und als von vorneherein mit ihrem Entstehen vorhanden betrachte, sei es, daß man beides als etwas von ihr Verschiedenes auffasse, das erst später zu ihr hinzugekommen sei. Denn daß man jene Kräfte an der Seele wahrnehme, wird von allen gleichmäßig zugestanden; aber was man von ihnen zu halten habe, konnte die Untersuchung noch nicht so genau feststellen, so daß sich eine feste und bestimmte Ansicht gebildet hätte, vielmehr gehen die Meister in irrtümlichen und verschiedenen Meinungen auseinander. Wenn für uns die heidnische Philosophie, welche diese Frage kunstgerecht behandelt, beweiskräftig wäre, so würde es für uns wohl überflüssig sein, überhaupt eine Erörterung über die Seele anzustellen. Da aber heidnische Philosophen ihre Lehrsätze über die Seele, welche den Eindruck der Folgerichtigkeit erwecken, in uneingeschränkter Freiheit entwickeln, wir jedoch eine solche Freiheit nicht besitzen (ich meine die Freiheit, alles anzunehmen, was uns nur immer einfällt), vielmehr die Heilige Schrift als Richtschnur und Gesetz bezüglich aller Lehrsätze betrachten, so richten wir unseren Blick auf dieselbe notwendig auch in der vorliegenden Frage und nehmen nur das an, was mit dem Geiste der Schriftworte übereinstimmt; darum verzichten wir auf den Wagen Platos und das Zwiegespann mit den beiden jugendlichen, ungleich ausgreifenden Rossen davor und dem Wagenlenker darüber ― jene Gleichnisse, in welchen er über die Seele philosophiert. Verzichten wir desgleichen auf die Ansichten seines Nachfolgers in der Philosophie, der allen Erscheinungen genau nachging und sorgfältig unser gesamtes Leben prüfte, aber dennoch lehrte, die Seele sei sterblich! Indem wir auch die Vorgänger und die Nachfolger der genannten Philosophen, mögen sie in Prosa oder in Rhythmus und Versmaß ihre Meinungen vortragen, beiseite lassen, wollen wir unsere Erörterung unter die Aufsicht und Hut der von Gott eingegebenen Schrift stellen, welche als auszeichnendes Merkmal der Seele nur gelten läßt, was auch Gott zukommt. Denn dadurch, daß er (Moses oder der Heilige Geist) die Seele als das Ebenbild Gottes erklärte, hat er auch erklärt, daß alles Gottwidrige aus dem wesentlichen Bereich der Seele ausscheidet; die Ebenbildlichkeit würde ja nicht gewahrt, falls eine Gegensätzlichkeit zwischen göttlichem und menschlichem Geist vorhanden wäre. Da nun Derartiges (Gottwidriges) an der göttlichen Natur nicht angenommen werden darf, so wird man solches auch nicht als zum Wesen der Seele gehörig betrachten dürfen.“</p><p>„Ein Verfahren also, das mit dialektischer Gewandtheit durch syllogistische und analytische Kunst auch unsere Glaubenssätze begründen möchte, erachten wir zum Erweise der Wahrheit als ungenügend und verdächtig; deshalb lehnen wir einen solchen Aufputz der Erörterung ab. Allen ist ja hinreichend bekannt, daß die dialektische Spitzfindigkeit nach beiden Seiten gleiche Kraft besitzt, nämlich zum Umsturz der Wahrheit wie zur Widerlegung der Lüge. Infolgedessen bringen wir die Wahrheit selbst, dadurch daß sie mit solch dialektischer Kunst vorgetragen wird, nicht selten in Verdacht, so daß eine derartige Fertigkeit unser Denken sogar abstoßen und um die Wahrheit bringen könnte. Wenn man aber nur eine Erörterung zulassen will, die jeden Aufputz verschmäht und sich keiner Kunstgriffe bedient, so müssen wir mit aller Entschiedenheit reden und die Untersuchung über unsere Fragen Schritt für Schritt unter der Leitung der Heiligen Schrift anstellen.“</p><p>„Was ist nun unsere Anschauung? Daß dieses vernünftige Lebewesen, der Mensch, die Fähigkeit zu denken und zu erkennen besitzt, ist auch von denen zugegeben, welche unserer Glaubenslehre fernestehen; diese Umschreibung unserer Natur könnte die Definition niemals geben, wenn Zorn und Begierde und anderes Derartiges zu unserer Natur wesentlich gehören würden. Auch über andere Dinge stellt man keine Definition auf, welche das Allgemeine statt des Besonderen enthielte. Da nun Zorn und Begierde ohne Unterschied sowohl bei der vernunftbegabten wie bei der vernunftlosen Natur sich findet, so geht es nicht an, das Besondere durch das Allgemeine zu bestimmen und zu kennzeichnen. Was aber bei der Umschreibung der Natur überflüssig und weglaßbar erscheint, wie könnte dieses als ein Wesensbestandteil der Natur gelten und dazu berechtigen, die Definition umzustürzen? Denn jede Bestimmung des Wesens faßt das Besondere des Gegenstandes ins Auge, der in Betracht kommt. Was immer außerhalb des Eigentümlichen und Besondern liegt, kommt bei der Begriffsbestimmung nicht in Betracht. Nun ist einmütig zugestanden, daß die Tätigkeit des Zornes und des Begehrens auch jeder unvernünftigen Natur zukommt; was aber allgemein ist, gilt nicht als Besonderes. Darum ist es notwendig, Zorn und Begierde nicht unter die Eigentümlichkeiten zu rechnen, die die menschliche Natur vornehmlich kennzeichnen. Wie derjenige, welcher Empfindung, Ernährung und Wachstum in uns beobachtet, noch keineswegs berechtigt ist, ihretwegen unsere Definition von der Seele umzustürzen (denn wenn die genannten Kräfte in der Seele sind, brauchen sie noch nicht in deren Begriffsbestimmung aufgenommen zu werden), so gibt auch die Beobachtung, daß Zorn und Begierde natürliche Bewegungen in uns sind, keineswegs das Recht, gegen unsere Definition anzukämpfen, als ob sie das Wesen der Seele nur mangelhaft bezeichne.“</p><p>Ich stellte die Frage an meine Lehrerin: „Als was soll man nun Zorn und Begierde anerkennen? Denn ich vermag nicht einzusehen, mit welchem Rechte man Tätigkeiten, die nun einmal in uns sind, abweist, als ob sie nicht zu unserer Natur gehören würden.“ ― „Du siehst, daß unsere Vernunft gegen Zorn und Begierde gleichsam Krieg führt und darauf ausgeht, die Seele davon zu befreien. Manchen ist dieses Streben auch geglückt, wie wir von Moses hören, daß er über Zorn und Begierde den Sieg errang; denn die Geschichte stellt ihm das Doppelzeugnis aus, daß er gegen alle Menschen sanftmütig war ― wer es nämlich durch Sanftmut zur Gelassenheit gebracht, hat unleugbar die Zornmütigkeit überwunden ― und daß er kein Begehren nach dem trug, worauf, wie das tägliche Leben zeigt, das Verlangen der meisten gerichtet ist. Eine solche Nachricht wäre nicht möglich, wenn Zorn und Begehren Wesensbetätigungen wären und zum Begriffe unserer Menschennatur gehören würden. Denn wer seine Natur aufgegeben hätte, würde notwendig auch das Sein aufgeben; nun verblieb Moses im Sein, nicht aber in jenen Seelenbewegungen. Sie sind also etwas anderes als die Natur und nicht Natur. Denn die wahre Natur ist das, woran das Sein des Wesens geknüpft ist. Von jenen Affekten können wir uns frei machen, und zwar in der Weise, daß wir hiedurch keinen Schaden leiden, sondern durch ihre Ausrottung unserer Natur großen Nutzen bereiten. Sonach ist es klar, daß Zorn und Begierlichkeit nicht Wesenheit sind, sondern zu den Anhängseln gehören, die wir an unserer Natur beobachten können, indem sie sich als Leidenschaften derselben darstellen; mit Wesenheit nämlich bezeichnet man das, was die Seele selbst ist.“</p><p>„Der Zorn aber ist nach der Ansicht der meisten ein Aufwallen des Herzblutes, nach der Meinung mancher aber das Streben, dem wehe zu tun, der uns zuvor wehe getan hat; wie wir selbst annehmen, ist der Zorn das Trachten, Böses mit Bösem zu vergelten; auf keinen Fall hat der Zorn etwas mit dem Begriffe der Seele zu tun. Wollen wir nun das Wesen der Begierde bestimmen, so möchten wir sie ein Verlangen nach dem nennen, was uns fehlt, oder ein Streben nach Lustgenuß oder eine Trauer darüber, daß wir nicht besitzen, was wir wünschen, oder ein gewisses Verhalten gegenüber dem Angenehmen, dessen Genuß uns nicht gewährt wird. All das und ähnliches weist auf ein Begehren hin, hängt aber mit dem Begriff der Seele nicht zusammen, so wenig wie viele andere Eigenschaften, welche, Gegensätze bildend, an unserer Seele sich zeigen können, wie Feigheit und Mut, Trauer und Freude, Furcht und Verachtung und noch manche derartige Regungen, welche mit Zorn und Begierde verwandt zu sein scheinen, aber doch durch besondere Grenzbestimmung ihr eigenes Wesen umschreiben. Denn Kühnheit und Stolz bedeuten ein Aufleuchten der Zornesregung; letztere läßt nach oder verschwindet, wenn Feigheit oder Furchtsamkeit sich geltend macht. Schmerz aber kann aus Zorn und aus Begierde entstehen: denn der Zorn läßt, falls er sich zu ohnmächtig fühlt, den Feind abzuwehren, Schmerz zurück; aber dieselbe traurige Stimmung wird in uns hervorgebracht, wenn wir die Hoffnung auf das, was wir ersehnten, aufgeben mußten, oder wenn wir verlieren, was wir hochschätzten und liebten. Doch auch das Gegenteil von Schmerz, das Gefühl der Freude entspringt teils aus Zorn, teils aus Begierde, je nachdem diese oder jene Regung den Affekt hervorruft. All das ist an der Seele, ist aber nicht die Seele selbst, sondern mehr warzigen Auswüchsen zu vergleichen, die aus dem denkenden Teile der Seele emporkeimen. Man kann sie für Teile der Seele halten, weil sie an ihr haften, aber sie sind nicht etwas, das das Wesen der Seele ausmachte.“</p><p>Da sprach ich zur Jungfrau: „Und doch sehen wir, wie tugendhaften Menschen aus ihnen kein geringer Gewinn für das Seelenheil erwächst. So war die Begierde für Daniel ein Lob, und Phinees vermochte durch Zorn Gott zu versöhnen, und vollends heißt es von der Furcht, daß sie der Anfang der Weisheit ist. Auch von Paulus hören wir, daß die gottgemäße Traurigkeit zum Heile führt, und das Evangelium gebietet, uns nicht vor Schrecknissen zu fürchten, und Schrecknisse nicht fürchten, ist eine bloße Umschreibung des Mutes, den die Weisheit unter die guten Eigenschaften zählt. Hierdurch zeigt also das Wort Gottes deutlich, daß wir die genannten Seelenregungen nicht für krankhafte Zustände halten dürfen; denn solche können nicht zum Aufbau der Tugend verwendet werden.“</p><p>Meine Lehrerin sprach nun zu mir: „Wie es scheint, habe ich selbst die hier vorliegende Gedanken-Verwirrung verschuldet, weil ich in meiner Rede hierüber keine so scharfe Unterscheidung gemacht habe, welche in die Erörterung die richtige Ordnung und Konsequenz hätte bringen können. Von nun an soll daher auf eine solche Ordnung in der Darstellung Bedacht genommen werden, damit bei folgerichtigem Fortgang der Untersuchung kein Raum mehr für solche Einwände bleibt. Wir behaupten nämlich, der Seele sei ein Erfassungs- und Unterscheidungs- und Betrachtungs-Vermögen eigen und naturgemäß, und hiedurch trage sie das Ebenbild der göttlichen Schönheit in sich ― denn auch vom göttlichen Geist, was er auch sein mag, machen wir uns die Vorstellung, daß er imstande sei, alles zu überschauen und das Gute vom Bösen zu unterscheiden ― alles aber, was auf dem Grenzgebiet der Seele liegt und seiner Natur gemäß der Biegung nach beiden Seiten fähig ist, so daß es ja nach der Anwendung sowohl zum Guten als auch zum Bösen dienen kann, wie z. B. der Zorn und die Furcht oder andere derartige Regungen der Seele, zu denen jegliche Beobachtung der menschlichen Natur führt, von dem meinen wir, daß es von außen an die Seele herangekommen sei, weil sich solche Bewegungen an ihrem Urbild, das ewig schön und vollkommen ist, nicht finden. Die Ausführung hierüber lassen wir einstweilen auf dem Kampfplatz stehen, um den Schmähungen verleumderischer Zungen zu entkommen.“</p><p>„In einer gewissen Ordnung und Stufenfolge ist Gott zur Erschaffung des Menschen fortgeschritten. Denn nachdem die Erde stand, erscheint, wie der Bericht erzählt, nicht sogleich der* Mensch* auf ihr, sondern ihm gingen die* Tiere,* und diesen die* Pflanzen* voraus. Hierdurch zeigt, wie ich glaube, die Schrift zur Genüge darauf hin, daß die Lebenskraft in einer gewissen Stufenfolge sich mit der Natur der Körper verband, indem sie zuerst in Geschöpfe einzog, welche der Sinneswahrnehmung entbehren, dann zu solchen mit Sinneswahrnehmungen fortschritt, und endlich zum geistigen und vernünftigen Lebewesen emporstieg. Demnach ist ein Teil der Geschöpfe körperlich, der andere rein geistig; von den körperlichen ist ein Teil seelenlos, der andere beseelt; beseelt nenne ich aber schon das, was Leben hat. Von den lebendigen sind einige mit Sinneswahrnehmung ausgestattet, andere haben an letzterer keinen Anteil. Von den mit Sinneswahrnehmung beschenkten Wesen sind die einen vernünftig, die anderen vernunftlos.“</p><p>„Da nun das Leben, welches der Sinneswahrnehmung mächtig ist, nicht wohl ohne Materie bestehen konnte, aber auch das Geistige, falls es sich mit dem sinnlichen Leben verbinden sollte, ebenfalls in einem Körper seine Herberge aufschlagen mußte, so stellt die Erzählung der Bibel die Erschaffung des Menschen als die Schlußkrone der ganzen Schöpfung dar, weil derselbe jede Art des Lebens in sich schließt, sowohl jenes, das in den Pflanzen sich findet, als auch jenes, das in den Tieren sich offenbart. Ernährung nämlich und Wachstum hat der Mensch mit den Pflanzen gemeinsam ― beides kann man auch an den Pflanzen beobachten, welche durch die Wurzeln gleichsam Nahrung aufnehmen und das für die Entwicklung Unbrauchbare durch Blätter und Früchte ausscheiden ― die Lenkung auf Grund der Sinneswahrnehmung aber teilt er mit den Tieren; seine Denkfähigkeit und Vernünftigkeit aber ist ein Gut, das weder den Pflanzen noch den Tieren, sondern ihm allein zukommt und auch eigener Würdigung bedarf. Aber wie unsere Natur die Fähigkeit hat, nach dem zu streben, was zum materiellen Leben nötig ist, welche Fähigkeit wir Begehrungsvermögen nennen ― dieses eignen wir dem Leben der Pflanzen zu, da sich auch an diesen manche Triebe zeigen, die in der Sättigung mit Verwandtem und im Streben emporzuwachsen sich betätigen ― so sind auch die genannten Eigentümlichkeiten der vegetabilischen Natur mit der denkenden Seele verbunden. Bei den Tieren nun“, fuhr sie fort, „zeigt sich der Zorn, bei ihnen die Furcht, bei ihnen all die Regungen, welche sowohl nach dem Guten wie nach dem Bösen sich ausstrecken; ausgenommen sind nur Vernunft und Verstand, die den Vorzug unseres Menschenlebens bilden und die, wie gesagt, das Abbild der göttlichen Natur in sich tragen. Da aber, wie bereits hervorgehoben, die Denkkraft dem Körper nur auf Grund des Sinnenlebens innewohnen kann, das Sinnenleben aber bereits in der Vorstufe des Tierreiches vorhanden ist, so kommt unsere Seele dadurch, daß sie mit dem einen, dem Sinnenleben, sich verbindet, notwendig auch mit anderen Eigentümlichkeiten der tierischen Natur in Berührung.“</p><p>„Alle diese Erscheinungen werden Affekte oder Leidenschaften genannt; sie gereichen dem menschlichen Leben nicht ganz und gar zum Unheil ― denn an den Sünden wäre tatsächlich der Schöpfer schuld, wenn von ihnen Nötigungen zu Verfehlungen ausgingen und diese in unsere Natur eingepflanzt wären ― sondern je nach dem Gebrauche, den unser freier Wille von ihnen macht, werden die genannten Regungen Hilfsmittel zur Tugend oder aber zu Lastern, wie z.B. auch das Eisen, das der Schmied nach seinem Gutdünken formt, die Gestalt annimmt, die ihm derselbe geben will: entweder die eines Schwertes oder die einer Pflugschar. Wenn nun also die Vernunft, welche eben der Vorzug unserer Natur ist, über jene von außen in uns gekommenen Affekte die Oberherrschaft führt, wie das Schriftwort symbolisch durch den Befehl andeutet, über alle Tiere zu herrschen, so wird wohl keiner derselben zum Dienste der Sünde in uns wirksam werden, indem alsdann Furcht Gehorsam bewirkt, Zorn mannhaften Mut, Zaghaftigkeit Behutsamkeit, der Begehrungstrieb aber uns auf die göttliche und unvergängliche Wonne und Freude hinweist. Wenn dagegen die Vernunft wie ein Wagenlenker die Zügel fallen läßt, der alsdann selbst unter das Fuhrwerk kommt und hinter demselben geschleift wird, wohin die Zugtiere in ihrer Unvernunft das Gespann gerade reißen, dann verwandeln sich jene Bewegungen in Leidenschaften, deren Unwesen man auch an den unvernünftigen Tieren sehen kann. Denn da Vernunft ihre Naturtriebe nicht lenkt, so bereiten die wilden Tiere, von Zornwut getrieben, einander den Untergang; anderseits vermögen die großen und starken Tiere aus ihrer Kraft keinen Nutzen zu ziehen, sondern gehen wegen ihrer Unvernunft in den Besitz und Gebrauch des vernunftbegabten Menschen über; auch mit ihrer Begierde und Lust sind die Tiere nicht imstande, sich zu Edlerem emporzuschwingen, noch liegt dem gesamten Leben der Tiere, soweit wir es verfolgen können, irgendeine Rücksicht auf höheren Gewinn zugrunde. So ist es auch bei uns: wenn unsere Leidenschaften nicht, wie es sich geziemt, durch die Vernunft gelenkt werden, sondern umgekehrt die Leidenschaften über die Vernunft herrschen, so sinkt der Mensch von der Höhe des Denkens und der Gottähnlichkeit zu Unvernunft und Unverstand herab, weil er sich durch die Leidenschaften um die Besinnung bringen ließ.“</p><p>Durch die gegebenen Ausführungen lebhaft angeregt, sprach ich: „Jedem Verständigen vermag deine Rede, die so einfach und schmucklos, dabei aber ganz folgerichtig fortschreitet, die Überzeugung beizubringen, daß du recht hast und in keinem Punkte von der Wahrheit abirrst. Da nun zwar denjenigen, welche für schulgerechte Beweisgänge eingenommen sind, die Schlußfolgerungen genügen, um zum Glauben daran zu gelangen, wir aber bekennen, die Beweisführung durch die in der Heiligen Schrift enthaltenen Lehren gebe eine größere Zuverlässigkeit als alle Künste der Schule, so müssen wir auch, wie ich meine, noch untersuchen, ob die gemachten Darlegungen mit der Heiligen Schrift übereinstimmen.“ Sie entgegnete: „Wer möchte bestreiten, daß in dem allein die Wahrheit liege, auf das das Siegel des Schriftzeugnisses aufgedrückt ist? Ist es also notwendig, zur Bekräftigung unserer Darlegungen etwas aus der Lehre des Evangeliums beizubringen, so dürfte uns die Betrachtung der Parabel vom Unkraut (Matth. 13, 24) nicht unpassend sein.“</p><p>„Dort säte nämlich der Hausvater guten Samen (das Haus sind gewiß die Menschen), der Feind hingegen wartete den Schlaf der Leute ab und säte unter den nahrungbringenden Samen einen nutzlosen, d. h. Unkraut unter den Weizen. Beide Samenarten wuchsen miteinander auf; denn mit Naturnotwendigkeit mußte der in den Weizen gestreute Unkrautsame mit jenem aufgehen. Der Aufseher über das Feld verbot aber den Knechten, das Unkraut auszujäten, weil die Wurzeln beider Samen miteinander verwachsen waren, damit nicht mit der schlechten auch die gute Saat ausgerottet werde. Ich vermute nun, daß jene Seelenregungen mit den guten Samenkörnern gemeint sind, von denen bei guter Pflege jedes die Frucht der Tugend in uns hervorbringen wird. Da nun unter diese zugleich der Irrtum in der Beurteilung des Guten eingesät und durch die mitaufsprossende Saat des Irrtums das wahrhaft und seiner inneren Natur nach allein Gute verdunkelt wurde, ― denn die Begierde ist nicht zu dem wahrhaften Guten, dessentwegen sie auch uns eingepflanzt wurde, emporgekeimt und gewachsen, sondern ihr Keim hat sich zum Tierischen und Unvernünftigen gewendet, verleitet durch den Irrtum hinsichtlich dessen, was gut und begehrenswert ist; desgleichen ist auch der Same des Zornes nicht zur Tapferkeit aufgeblüht, sondern hat die Menschen bewaffnet zum Kampfe gegen die Mitmenschen, ebenso fiel die Macht der Liebe vom Geistigen ab, indem sie im Genuß des Sinnlichen verwilderte; und in ähnlicher Weise brachten auch die übrigen Bewegungen der Seele statt der guten oft schlechte Früchte hervor. ― Deshalb ließ der weise Ackersmann das mit dem guten Samen aufgegangene Gesproß des Unkrautes im Boden, in der Besorgnis, wir könnten höherer Güter beraubt werden, wenn mit dem schlimmen Gesproß die Begierde ganz und gar in uns beseitigt würde. Denn wenn dies der menschlichen Natur widerführe, was könnte uns dann zum Streben nach dem Himmlischen antreiben? Und wenn die Liebe in unserem Innern ausgerottet würde, wie könnten wir uns dann mit Gott verbinden? Und wenn Zornesmut ausgelöscht würde, welche Waffe hätten wir dann noch gegen unseren Widersacher?“</p><p>„Demnach läßt der Ackersmann die schlimmen Samenkörner in uns, nicht damit sie für immer die gute Saat überwuchern, sondern damit der Acker selbst ― so wird bildlich das Herz genannt ― durch die ihm angeborene Kraft, welche in der Vernunfttätigkeit besteht, die eine Saat des Unkrautes zum Verdorren bringe, die andere Saat des Guten aber zur Blüte und zu herrlicher Frucht entwickle. Falls dies aber nicht geschieht, so überträgt er dem Feuer die Sichtung des Saatfeldes.</p><p>Wenn wir demnach die öfter erwähnten Triebe in der richtigen Weise gebrauchen, indem wir sie unter unsere Herrschaft bringen, aber nicht selbst unter die ihrige geraten, sondern wie ein König die Vielhändigkeit unserer Untertanen zur Mitarbeit beiziehen, so werden wir um so besseren Erfolg im Streben nach Tugend haben. Falls wir aber unter ihr Joch geraten, wie wenn Sklaven gegen ihren Herrn sich erheben, und uns knechten lassen, indem wir uns schmählich ihren Sklavenlaunen beugen und Knechte derer werden, die ihrer natürlichen Bestimmung gemäß uns unterworfen sind, so werden wir mit Notwendigkeit dazu verführt werden, wozu die Gewalttätigkeit unserer Zwingherren uns nötigt. Weder als Tugenden noch als Laster werden wir so bei der geschilderten Sachlage all die Seelenregungen auffassen, bei denen es ganz von der Anwendung abhängt, ob sie einen guten oder schlimmen Einfluß ausüben, sondern bei ihrer Richtungnahme auf das Edlere werden sie zur Grundlage für herrliche Werke, wie die Begierde Daniels, der Zorn Phinees, die Trauer der in rechter Weise Betrübten; nehmen sie dagegen die Richtung zum Schlimmen, so sind und heißen sie Leidenschaften“.§ 9. Von der Unterwelt.</p><p>Als sie nach dieser Erörterung, um auszuruhen, die Rede ein wenig unterbrach, ließ ich das bereits Erklärte nochmals an meinem Geiste vorüberziehen; dabei hielt ich bei jener Stelle des Gespräches inne, durch welche sie die Möglichkeit darlegte, daß die Seele nach Auflösung des Körpers mit den Elementen vereinigt bleibe. Daher wendete ich mich mit der Frage an die Lehrerin: „Wo ist denn die vielbesprochene sogenannte Unterwelt, von der sooft im täglichen Leben, sooft auch in den Schriften, den heidnischen sowohl wie den unsrigen, gesprochen wird, in welche nach allgemeiner Ansicht wie in ein Behältnis die Seelen von hier versetzt werden? Du wirst wohl nicht die Elemente für die Unterwelt erklären.“</p><p>Die Lehrerin antwortete: „Offenbar hast du nicht zu sehr auf meine Worte geachtet. Denn als ich von der Versetzung der Seelen aus der sichtbaren Welt in die unsichtbare* (Ἀτιδές ═ Ἅιδης),* [Atides = Hadēs] redete, glaubte ich zur Unterwelts- oder Hadesfrage genug gesprochen zu haben. Denn dieser Name, der für den künftigen Aufenthaltsort der Seelen so gerne gebraucht wird, scheint sowohl bei den Heiden wie in der Heiligen Schrift nichts anderes zu bedeuten als eben die Versetzung in die Unsichtbarkeit und Verborgenheit.“ Ich erwiderte: „Und mit welchem Rechte meinen manche, der unter der Erde befindliche Raum habe diesen Namen und er beherberge die Seelen in sich und ziehe die bereits dem Leben entflohenen Seelen an sich wie zu einer Räumlichkeit, die gerade für diese Natur passe?“</p><p>Meine Lehrerin antwortete hierauf: „Durch eine solche Annahme wird meine früher aufgestellte Behauptung nicht beeinträchtigt. Ist nämlich deine Ansicht richtig, daß nämlich der in seinem Kreise alles einschließende Himmel einen stetigen und unzerreißbaren Zusammenhang bildet, und die Erde mit dem zu ihr Gehörigen in der Mitte schwebt, so daß die Bewegung aller kreisenden Himmelskörper um das Stehende und Feste (die Erde) läuft, so muß das, was immer einem der Elemente auf der oberen Erdhälfte zukommt, auch dem entsprechenden auf der unteren zukommen, da ein und dieselbe Substanz (d. i. der Himmel) im Kreise um die ganze Masse (der Erde) herumläuft. Und wie, wenn die Sonne über der Erde scheint, auf dem unteren Teil derselben Schatten herrscht, da sie wegen ihrer Kugelgestalt nicht zu gleicher Zeit ringsum von den Sonnenstrahlen getroffen werden kann, vielmehr mit voller Notwendigkeit, mag die Sonne welchen Teil der Erdoberfläche nur immer bescheinen ― gegen den Mittelpunkt der Erde ist sie allerdings immer gerichtet ―, auf dem anderen diametral entgegengesetzten Punkte Finsternis sein muß und diese Finsternis einem senkrechten Strahl gegenüber zugleich mit der Bewegung der Sonne herumläuft, so daß gleichmäßig sowohl der obere als auch der untere Teil der Erde abwechselnd in Licht und Schatten sich befindet, so ist wohl auch in bezug auf alles übrige nicht zu bezweifeln, daß sämtliche Elemente und Verhältnisse, die auf* unserer* Erdhälfte herrschen, auf der anderen entgegengesetzten genau in der gleichen Weise sich finden. Da demnach an jedem Teile der Erde uns die nämlichen Elemente umgeben, so darf man, glaube ich, denen weder beistimmen noch widersprechen, welche unserer dargelegten Auffassung mit der Behauptung entgegentreten, man müsse entweder diese Erde oder die unterhalb der Erde befindliche Region für den Bestimmungsort der von den Leibern abgeschiedenen Seelen halten. Denn solange der Einwurf den Hauptlehrsatz von dem Fortbestehen der Seelen nach dem Fleischesleben nicht erschüttert, werden wir bezüglich des Ortes, an welchem sich die abgeschiedenen Seelen aufhalten sollen, keine Schwierigkeiten machen, in der festen Überzeugung, daß zwar die Körper eines Aufenthaltsortes bedürfen, die Seelen dagegen, weil unkörperlich, ihrer Natur nach keineswegs an bestimmte Örtlichkeiten gebunden sind.“</p><p>„Wie nun,“ sprach ich, „wenn deine Gegner sich auf den Apostel berufen, der da sagt, alle vernünftige Kreatur werde bei der Wiederherstellung des Alls den Herrn desselben erblicken; bei dieser Gelegenheit erwähnt er aber auch die Unterirdischen, indem er im Briefe an die Philipper schreibt: ‚Ihm wird jegliches Knie sich beugen, derer im Himmel, auf Erden und unter der Erde‘.“ (Phil. 2, 10.) Die Lehrerin erwiderte: „Selbst wenn wir diesen Einwand hören, können wir bei unserer Auffassung bleiben; denn hinsichtlich der Weiter-Existenz der Seele haben wir auch den Gegner, der einen solchen Einwand macht, bereits auf unserer Seite, hinsichtlich des Ortes setzen wir ihm, wie schon bemerkt, keinen Widerstand entgegen“. Ich frug nun weiter: „Was könnte man wohl denen, welche nach dem Sinne jener apostolischen Worte forschen, antworten, wenn man nun einmal die Worte nicht im Sinne einer Ortsbezeichnung nehmen soll?“</p><p>Sie aber sprach: „Nicht nach ihrem verschiedenen Aufenthaltsorte wollte der göttliche Apostel die Geister einteilen, wenn er von Himmlischen, Irdischen und Unterirdischen redet. Vielmehr da es drei Klassen von geistigen Wesen gibt: jene, welche von Anfang an das körperlose Leben empfangen haben und Engel heißen, dann jene, welche in Verbindung mit dem Fleische leben und Menschen genannt werden, endlich diejenigen, welche durch den Tod von ihren Körpern geschieden wurden, so wollte nach meinem Dafürhalten der göttliche Apostel im Hinblick auf die erwähnte Auffassung über die geistbegabten Geschöpfe in der Tiefe seiner Weisheit den in der Zukunft bevorstehenden Einklang der gesamten vernünftigen Natur im Guten andeuten, indem er die körperlosen Engel als Himmlische, die mit einem Körper ausgestatteten Seelen als Irdische, die vom Körper Abgeschiedenen als Unterirdische bezeichnet, oder wenn sonst noch eine andere, von den genannten verschiedene Natur in der Zahl der vernünftigen Wesen sich findet, mögen wir nun ihre Träger Dämonen oder Geister oder sonstwie nennen, da wir über den Namen nicht streiten wollen. Auf Grund allgemeiner Annahme und der Schriftlehre wird nämlich geglaubt, es würden Wesen ohne irdische Körper existieren, die da dem Guten abhold und dem Menschengeschlecht feindselig seien, nachdem sie sich einmal von einem besseren Geschick freiwillig lossagten und durch Abfall vom Guten dessen Gegenteil in sich darstellen. Und diese, sagt man, rechne der Apostel zu den Unterirdischen, indem er durch seine Wendung andeuten wolle, es würde dereinst, wenn nach langen Perioden von Jahrhunderten alles Böse vertilgt werde, kein Geschöpf mehr vom Reiche des Guten ausgeschlossen sein, sondern die Herrschaft Christi fände auch von den zuletzt genannten Geistern Anerkennung. Unter diesen Umständen wird uns wohl niemand mehr nötigen, bei dem Ausdruck „Unterirdische“ an einen Raum unterhalb der Erde zu denken, da doch die Luft in gleicher Weise allseitig um die Erde herumgegossen ist, so daß kein Teil derselben als von jener Luftumkleidung frei angesehen werden kann.“§ 10. Eine Art Verbindung zwischen Seele und Körper bleibt auch nach dem Tode.</p><p>Nach dieser Erörterung der Lehrerin sprach ich nach einer kleinen Pause zu ihr: „Ich bin mir über unsere Frage noch nicht ganz klar; vielmehr schwankt mein Denken noch etwas hinsichtlich der besprochenen Punkte: darum bitte ich, mir die gegebene Darlegung in der nämlichen Reihenfolge zu wiederholen; dabei können jene Punkte übergangen werden, über die wir bereits eine Übereinstimmung erzielten. Mit ziemlicher Sicherheit meine ich ja doch, daß unsere Gegner, soweit sie nicht allzu hartnäckig sind, durch die gepflogenen Erörterungen dahin gebracht werden, die Seele nach der Auflösung des Körpers nicht dem Untergang und der Vernichtung preiszugeben und von ihrer Behauptung abzugehen, sie sei nicht imstande, irgendwo im Universum sich aufzuhalten, weil sie sich von den Elementen wesentlich unterscheide. Denn wenn auch zwischen diesen und der geistigen, immateriellen Seele ein weiter Abstand besteht, so liegt darin kein Hindernis für sie, in denselben zu existieren. In dieser Annahme werden wir durch zwei Tatsachen bestärkt: einmal dadurch, daß die Seele, obgleich sie etwas vom Körper Verschiedenes ist, dennoch während des Erdenlebens in ihm weilt, dann auch dadurch, daß Gott, obwohl er sich von allen sinnlich wahrnehmbaren und materiellen Dingen ganz und gar unterscheidet, trotzdem, wie wir uns im Laufe der Rede überzeugten, jedwedes Existierende durchdringt und durch diese Durchdringung das gesamte Universum in seiner Existenz erhält; daher werden wir folgerichtig der Seele die Existenz nicht absprechen, wenn sie aus dem Leben der Sichtbarkeit in die Unsichtbarkeit übergeht. Aber ein Bedenken bleibt: die zum Leibe vereinigten Elemente nehmen in demselben infolge ihrer gegenseitigen Durchdringung eine andere Gestalt an, die von ihrer ursprünglichen verschieden ist, mit der aber die Seele ganz vertraut ist; wenn diese Gestalt nun beim Tode ganz verschwindet, wie vermag dann die Seele die Elemente zu erkennen, welche ihren Leib bildeten?“</p><p>Nach einigem Besinnen sprach sie: „Zur Beleuchtung des Fragepunktes sei es mir gestattet, als Beweis ein Beispiel zu erdichten, wenn auch das, was ich vorbringen will, außerhalb des Bereiches der Möglichkeit liegt. Es sei mir also die Annahme gestattet, daß die Malerkunst es fertigbringe, nicht allein, wie man es zu tun pflegt, die verschiedenen Farben zu mischen, um ein möglichst getreues Bild herzustellen, sondern auch die Mischungen wieder zu scheiden und jeder Farbe ihre natürliche Tinte zurückzugeben. Wenn nun Weiß und Schwarz oder Rot und Gelb oder sonst eine Farbentinte, um einen Gegenstand zu malen, gemischt wären, dann aber aus der allgemeinen Mischung wieder ausgeschieden und abgesondert würden, so vermag der Künstler nichtsdestoweniger die Mischungsfarben zu erkennen; auch vergißt er keineswegs auf Rot oder Schwarz, wenn sie aus der Gestalt, die sie infolge der Mischung bekommen haben, zu ihrer ursprünglichen Färbung zurückkehren. In Erinnerung an die Art und Weise der Farbenmischung weiß er, welche Farben miteinander gemischt werden müssen, um diese oder jene Farbe hervorzubringen und wie sie nach der Aufhebung der Mischung wieder zu ihrer eigenen Blume zurückkehren, und soll er durch Mischung die gleiche Farbe abermals gewinnen, so wird er dies leicht fertigbringen, weil er durch die frühere Zubereitung schon eine gewisse Übung sich aneignete.“</p><p>„Liegt nun“, fuhr sie fort, „in dem vorgeführten Beispiel etwas Wahres, so müssen wir die Anwendung auf den Gegenstand machen, der uns beschäftigt. An Stelle des Künstlers denken wir an die Seele und an Stelle der Farben an die Elemente, aus denen der Körper besteht; die Mischung der verschiedenen Farben zu einem bestimmten Kolorit und die als möglich angenommene Rückkehr desselben zu den ursprünglichen Farben soll uns sowohl die Verbindung der Leibeselemente als auch deren Auflösung anschaulich machen. Wie wir nun im Beispiele vom Maler wissen, daß ihm die Farbentinte, welche nach der Mischung wieder zu ihrer ursprünglichen Blume zurückkehrt, nicht unbekannt ist, sondern daß er das Rot und das Schwarz, oder was er sonst zur vorgenommenen Mischung verwendete, ganz gut erkenne, sowohl wie die Farben* in der Mischung* waren, als auch wie sie* jetzt sind* im ursprünglichen Zustand, und wie sie alsdann* sein würden,* falls wieder in ähnlicher Weise eine Mischung mit anderen Farben vorgenommen wird ― so ungefähr, meinen wir, wird die Seele jene Elemente, welche insgesamt ihren Leib gebildet hatten, auch nach dessen Auflösung in ihrem ursprünglichen Zustand erkennen. Und wenn gleich die Natur sie wegen ihrer inneren Verschiedenheit und auf Grund des Umstandes, daß sich Entgegengesetztes nicht miteinander verbinden kann, oft weit voneinander trennt, so wird die Seele dennoch bei jedem sein, indem sie durch ihre Erkenntniskraft an allem dem, was zu ihrem Körper gehörte, haftet und verharrt, bis die Wiedervereinigung der sämtlichen Bestandteile des Leibes behufs der Wiederherstellung des Aufgelösten erfolgt, was Auferstehung im eigentlichen Sinne ist und heißt.“</p><p>Da sprach ich: „Vortrefflich hast du, wie mir scheint, nebenbei die Lehre von der Auferstehung verteidigt; auf solche Weise können auch die Gegner allmählich zu dem Eingeständnis gebracht werden, es überschreite keineswegs die Grenzen des Möglichen, wenn die Elemente des Leibes wieder zusammenkommen, um den nämlichen Menschen wieder herzustellen.“ Die Lehrerin fuhr weiter: „Ja, du hast recht; denn die Gegner unserer Lehre hört man oft einwenden: wenn unsere Elemente sich auflösen und nach Maßgabe der Verwandtschaft sich in das All zerstreuen, wie ist es dann möglich, daß z. B. das Warme, das in einem bestimmten Menschen war und dann (nach dessen Tod) sich in das All zerstreute, sich davon, ohne Verwandtes mitzunehmen, vollständig lostrenne, um den Menschen neu zu bilden? Denn wenn nicht genau die nämlichen Bestandteile sich vereinigen, um den Auferstehungsleib zu bilden, sondern an Stelle dessen, was einstens zu einem Individuum gehörte, etwas Anderes, wenn auch Gleichartiges tritt, so wird anstatt des früheren Leibes ein anderer entstehen, und dieses wäre keine Auferstehung, sondern eher die Erschaffung eines neuen Menschen; wenn aber ebenderselbe Mensch erstehen soll, der lebte und starb, so muß er mit dem früheren ganz und gar derselbe (identisch) sein, also hinsichtlich aller Teile seiner Grundstoffe die frühere Natur wieder erhalten.“</p><p>„Demnach,“ sprach ich, „reicht gegen den erwähnten Einwand die Annahme aus, daß die Seele bei jenen Elementen, mit welchen sie von Anfang an verbunden war, auch nach der Auflösung des Leibes verbleibe, gleichsam in der Stellung einer Behüterin ihres Eigentums, und daß sie, wenn sich die Bestandteile ihres Leibes auch mit Gleichartigem verbinden, keinen Teil aus den Augen verliert; denn mag der Leib in noch so kleine Teilchen zerfallen, vermöge der Feinheit und Leichtbeweglichkeit ihrer geistigen Kraft wird die Seele dieselben keineswegs irrtümlicherweise verwechseln, sondern, wenn sie sich mit den ihnen verwandten Urstoffen vermengen, mit ihnen untertauchen und nicht ablassen, ihnen zu folgen, wenn sie in das All zurückströmen, und wird immer bei ihnen verharren, wie die Natur auch mit ihnen verfährt. Wenn aber von der das All lenkenden Macht den getrennten Bestandteilen des Leibes die Erlaubnis zur Wiedervereinigung gegeben wird, so werden, gleichwie verschiedene Seile, die an* einem* Punkte aufgehängt sind, alle und in demselben Augenblicke dem nämlichen Zuge folgen, auch die verschiedenen Elemente des Körpers durch die eine Kraft der Seele angezogen und so wird die Kette unseres Leibes durch das Zusammentreten seiner Teile von der Seele geflochten, indem ein jeder in seine alte und gewohnte Verbindung sich einfügt und die ihm vertraute Umgebung umschlingt.“</p><p>„Aber auch das folgende Beispiel“, sprach die Lehrerin, „kann dem eben Gesagten beigefügt werden, zum Beweise, daß es für die Seele keine große Schwierigkeit bedeutet, das Eigene vom Fremden zu unterscheiden. Setzen wir nämlich den Fall, ein Töpfer habe Ton vor sich, und zwar in großer Menge, von welchem ein Teil bereits zur Anfertigung von Gefäßen geformt wurde, während ein anderer Teil der Verwendung noch harrt; die Gefäße sollen aber einander nicht ähnlich sein an Gestalt, sondern das eine ein Faß, das andere ein Krug, das dritte ein Teller oder eine Schale werden oder sonst eins von den Hausgeräten. All diese Gegenstände sollen nicht* einem* Besitzer gehören, sondern für jedes wollen wir einen eigenen Herrn annehmen. Solange sie ganz sind, kennt sie der Eigentümer sehr wohl; aber auch wenn sie zerbrochen werden, haben sie als Trümmer noch Kennzeichen genug, die da sagen, dies sei aus dem Faße, jenes aus dem Becher; sogar wenn die Scherben mit unbearbeitetem Tone vermischt werden, kann man noch ganz gut die bearbeiteten Teile von letzterem unterscheiden. So ist jeder einzelne Mensch gleichsam ein Gefäß, aus gemeinsamer Materie durch die Verbindung bestimmter Elemente geformt, durch seine eigentümliche Gestaltung aber von allen seinesgleichen sehr verschieden. Ist diese Form nun zerbrochen, so wird nichtsdestoweniger die Eigentümerin des Gefäßes, die Seele, das zu ihr Gehörige aus den Überresten erkennen; denn sie wird weder, wenn die Überbleibsel beisammenliegen, noch wenn sie mit dem Unbearbeiteten, d. h. mit den Grundstoffen sich vermengen, die Bestandteile ihres Leibes vergessen, sondern all ihr Gut stets in Erinnerung behalten und somit in keinen Irrtum bezüglich ihres Eigentums verfallen, weder während der Zeit, in welcher es noch seine unversehrte Gestalt hat, noch dann, wenn letztere zerstört ist, weil sämtlichen ihr zugehörigen Teilen stets sichere Kennzeichen anhaften.“ § 11. Die evangelische Erzählung vom reichen Prasser und vom armen Lazarus widerlegt das Vorgetragene nicht, sondern bestätigt es.</p><p>Ich gab dem Vorgetragenen, als für unseren Zweck passend und geschickt erdacht, meinen Beifall, fragte aber doch: „All das läßt sich ganz gut sagen und annehmen; allein, wenn jemand die Erzählung, welche der Herr nach dem Evangelium über die Unterwelt vorgetragen hat, deinen Worten entgegenhält, als ob sie mit den evangelischen Ausführungen nicht übereinstimmen würden, wie soll man sich dann zur Antwort rüsten?“ Darauf erwiderte sie: „Freilich klingt die Erzählung der Schrift etwas körperlich (materialistisch); aber sie läßt es nicht an zahlreichen Andeutungen fehlen, den aufmerksamen Hörer zu einer mehr geistigen Auffassung zu führen. Denn wenn sie von einer Kluft spricht, welche das Böse vom Guten scheidet, wenn sie ferner den Gequälten nach einem Tropfen Wasser schmachten läßt, der ihm mit einem Finger zu reichen wäre, desgleichen wenn sie dem in diesem Leben von so vielen Leiden Heimgesuchten den Schoß Abrahams als Ruheplatz anweist, wenn sie aber zugleich auch, ja sogar vorher den Tod und das Begräbnis des Armen und des Reichen berichtet, so ladet sie offenbar alle, welche der Erzählung nicht gedankenlos folgen, dringend ein, von dem zunächst vorliegenden Wortsinn abzusehen. Denn was für Augen erhebt der Reiche, nachdem er die leiblichen im Grabe ließ? Und wie empfindet der Körperlose die Flamme, oder was für eine Zunge begehrt nach der Kühlung durch einen Wassertropfen, da er die aus Fleisch nicht mehr hat? Welcher Finger könnte ihm sodann die Labung reichen, und was ist der Schoß, der Ruhe bieten soll? Denn da die Leiber in den Gräbern liegen, die Seele aber weder im Körper sich befindet noch aus Teilen besteht, so ist es unmöglich, die Erzählung für unser Thema im Dienste der Wahrheit zu verwenden, wenn man nicht alle Einzelzüge im bildlichen oder geistigen Sinne nimmt, so daß man unter der Kluft nur die Unmöglichkeit eines Zusammenkommens der beiden voneinander Getrennten versteht, nicht etwa einen Erdschlund. Denn welche Mühe würde es für ein körperloses und geistiges Wesen bedeuten, eine solche Kluft zu überfliegen, da ja ein Geist vermöge seiner Natur, ohne Zeit aufzuwenden, überallhin gelangen kann, wohin er will.“</p><p>„Was also wären“, warf ich ein, „das Feuer oder die Kluft oder die übrigen in der Erzählung vorkommenden Dinge, wenn sie in Wirklichkeit nicht das sind, was sie heißen?“ Darauf versetzte sie: „Durch jede dieser Bezeichnungen will uns das Evangelium bestimmte Lehren über verschiedene Punkte nahelegen, welche die Seele betreffen. Wenn der Patriarch dem Reichen erklärt: Du hast deinen Anteil an Gütern im Fleischesleben bekommen! ― und desgleichen dem Armen versichert, er habe die ihm gewordene Obliegenheit, im Leben Übel zu ertragen, erfüllt, und wenn die Schrift dann noch von der Kluft redet, durch die beide voneinander getrennt sind, so scheint uns dadurch eine bedeutsame Lehre gegeben zu werden. Diese geht nach meinem Dafürhalten dahin: Im Anfang war das Leben der Menschen eingestaltig; eingestaltig aber nenne ich jenes Leben, das nur dem Guten gewidmet ist, ohne dem Schlimmen Anteil zu gewähren. Diese Auffassung wird vom ersten Gebot Gottes bestätigt, welches den Menschen den vollen Genuß der Paradiesesgüter gestattete und bloß das verwehrte, dessen Natur, weil Gutes und Schlimmes in sich vereinigend, aus Gegensätzen zusammengesetzt war; und zwar verschärfte Gott sein Gebot durch Androhung der Todesstrafe für die Übertretenden. Doch mit freiem Willensentschluß verließ der Mensch das von Übeln ungetrübte Leben und erkor sich jenes, das so viele Gegensätze enthält. Gleichwohl ließ die göttliche Vorsehung unsere Verblendung nicht ohne Heilmittel, sondern schied, obgleich die Übertreter der angedrohte Tod hätte ereilen sollen, das menschliche Leben in zwei Perioden, d. h. in das gegenwärtige Leben, das wir hier im Fleische verbringen, und in das zukünftige, das dort außerhalb des Fleisches geführt wird. Doch ist beiden Abschnitten nicht die gleiche Dauer zugemessen, sondern Gott wies dem ersteren nur eine kurze Spanne Zeit zu, dem letzteren aber gewährte er ewige Dauer. Zugleich stellte er es in bester Absicht den Menschen anheim, selbst zu entscheiden, in welchem dieser beiden Lebensabschnitte sie das eine oder das andere, nämlich das Gute oder das Schlimme haben wollen, entweder in diesem kurzen schnell vergänglichen Leben oder in der unendlichen Ewigkeit, deren Grenze die Grenzenlosigkeit ist. Da aber das Gute und das Schlimme eine doppelte Bedeutung hat und jedem ein zweifacher Sinn zukommt, je nachdem man die Sinnlichkeit oder aber den Geist als Maßstab nimmt und demnach die einen das zum Bereiche des Guten rechnen, was für die Sinne angenehm erscheint, während andere nur das für gut ansehen, was als nützlich für die Seele sich erweist, infolgedessen lassen sich gar manche, welche im Abwägen ungeübt und um das Bessere unbesorgt sind, dazu verleiten, den von Natur aus ihnen zugewiesenen Anteil am Guten schon in diesem Leben vollständig zu genießen, ohne etwas für das andere Leben zu versparen. Solche jedoch, welche ihr Leben auf Grund richtigen und nüchternen Abwägens einrichten, bereiten sich, indem sie der Sinnlichkeit wehe tun, für eine kurze Zeit zwar Leid, behalten sich aber gerade hiedurch das Gute für das künftige Leben vor, so daß für sie das bessere Los die Dauer des ewigen Lebens gewinnt. Das ist also nach meinem Ermessen die Kluft zwischen dem Armen und Reichen, die nicht durch eine Spaltung des Bodens entsteht, sondern die durch den Riß gebildet wird, der sich durch das Leben der Menschen zieht, indem deren Willensrichtung so ganz entgegengesetzte Ziele hat. Denn wer einmal die Lust dieses Erdenlebens sich als Ziel erwählte und seine Torheit später nicht durch Sinnesänderung wieder gutmacht, der versperrt sich selbst den Zutritt zum künftigen Land der Seligkeit, indem er dieses unentrinnbare Verhängnis gleichsam wie einen weit gähnenden und unüberwindlichen Abgrund gegen sich selbst aufreißt.“</p><p>„Darum scheint die Schrift auch den glücklichen Zustand der Seele, in welchem sie den Helden der Geduld ausruhen läßt, Schoß Abrahams zu nennen. Denn dieser Erzvater wird unter allen, die je gelebt haben, als der erste gerühmt, welcher an Stelle des Genusses der Gegenwart die Hoffnung auf die Zukunft eintauschte, indem er die angenehmen Verhältnisse, in denen er früher lebte, vollständig aufgab und in der Fremde sein Dasein fristete, also wirklich durch gegenwärtige Trübsal die Hoffnung auf zukünftiges Glück erwarb. Wie wir also einen Meeresteil bildlich Busen nennen, so scheint mir die Schrift durch den Ausdruck Busen oder Schoß deutlich auf jenes unermeßliche Glück hinzuweisen, in das wie in einen herrlichen Meerbusen und ruhigen Hafen alle, welche die Fahrt durch das Leben tugendhaft zurücklegten, ihre Seelen landen lassen, sobald sie hienieden Abschied nehmen. Den anderen aber wird die Entziehung ihrer Scheingüter zu einer Flamme, die ihre Seele versengt, so daß sie einen Tropfen aus dem die Frommen umspülenden Meere der Glückseligkeit erflehen, ohne ihn aber zu erhalten.“</p><p>„Wenn du aber auf die Bezeichnungen von verschiedenen Körperteilen wie der Zunge, des Auges und des Fingers im Gespräche der beiden, die doch gar keinen Körper haben, nur etwas genauer achtest, so wirst du, falls du den Sinn dieser Wendungen verstehen willst, ohne Zweifel zugeben, daß sie zu der Ansicht stimmen, welche wir über die Seele vermutungsweise aussprachen. Denn wenn die Verbindung der Elemente das Wesen des* ganzen* Körpers ausmacht, so muß doch die Natur der* einzelnen* Körperteile von dem nämlichen Gesichtspunkte aus betrachtet werden. Wenn nun die Seele den Elementen des Leibes, wenn sie in das All zurückfluten, überhaupt gegenwärtig bleibt, so wird sie nicht bloß die Gesamtheit derselben, insofern sie den ganzen Leib bildeten, kennen und begleiten, sondern sie ist sich auch vollständig über jene Elemente klar, welche den besonderen Bestandteil der einzelnen Körperteile ausmachten. Darum ist es keineswegs unwahrscheinlich, daß die Seele bei den einzelnen Elementen ebenso verharrt wie bei deren Gesamtheit. Und wenn nun jemand im Hinblick auf die Elemente, welche der Potenz nach die einzelnen Glieder des Körpers bilden (und bei denen die Seele bleibt), die Ansicht vertritt, die Heilige Schrift schreibe der Seele in diesem Sinne Finger, Auge, Zunge und die anderen Glieder zu, so wird er von der Wahrheit nicht allzu entfernt sein. Wenn also sämtliche Einzelheiten in der Schrifterzählung den Geist von einer körperhaften und buchstäblichen Auffassung der Ausdrücke abziehen, so ist es doch nur naheliegend, auch die hier erwähnte Unterwelt nicht für einen Ort zu halten, sondern für einen unsichtbaren und körperlosen Zustand, in welchem nach der Lehre der Schrift die Seele fortlebt.“</p><p>„Aber noch etwas anderes lernen wir aus der Erzählung von dem Reichen und Armen, was zu unserer Frage in enger Beziehung steht. Sie läßt nämlich den Verworfenen und fleischlich Gesinnten, als er die Unabänderlichkeit seines Geschickes erkennt, in Sorge um seine auf Erden zurückgebliebenen Verwandten geraten, und als Abraham versicherte, die im Fleische Lebenden hätten keineswegs Mangel an Fürsorge, sondern reichliche Belehrung durch das Gesetz und die Propheten, läßt die Schrift den Reichen noch die weitere Bitte aussprechen, es möchte einer von den Toten auferstehen, damit sie seinen Worten wegen des Wunders Glauben schenken.“ Ich fragte sodann: „Welche Lehre liegt denn hierin?“</p><p>Sie fuhr fort: „Da Lazarus mit den irdischen Dingen vollständig gebrochen hatte und sich zu nichts mehr von dem, was er zurückgelassen, hinziehen läßt, der Reiche dagegen, auch nach dem Tode noch zäh an dem Fleischesleben festhält, das er auch am Schluß seines Erdendaseins noch nicht ganz ablegte, sondern noch um Fleisch und Blut um Sorge ist ― sein Wunsch, seine Blutsverwandten von Leid befreit zu sehen, zeigt nämlich zur Genüge, daß er von fleischlicher Zuneigung sich noch nicht frei machte ― so will uns, meine ich, der Herr durch diese Schilderung die Lehre geben, daß wir, wenn wir auch im Fleische leben, dennoch durch einen Wandel der Tugend uns von dem Hang zum Fleische möglichst trennen und ablösen sollen, damit wir nach dem Tode nicht noch eines zweiten Todes zur Reinigung von aller fleischlichen Anhänglichkeit bedürfen, sondern die Seele, nachdem sie ihre Fessel zerrissen, leicht und frei in das Land des Guten eilen könne, ohne von der Bürde niedergezogen zu werden, welche der Körper verursacht. Wenn nun jemand in seinem Geiste dadurch, daß er mit jeder Kraft und Regung der Seele den Gelüsten des Fleisches nachkam, selbst Fleisch geworden, so wird ein solcher Mensch, auch wenn er das Fleisch verläßt, keineswegs von den Leidenschaften des Fleisches getrennt, sondern ähnlich wie jene, welche längere Zeit an übelriechenden Orten sich aufhielten, durchaus nicht, selbst wenn sie in die frische, reine Luft kommen, sofort vom Gestank frei werden, in welchem sie länger verweilten und welchen sie dadurch in sich aufnahmen, so ist es für die Fleischesmenschen bei ihrem Übergang in das körperlose und geistige Leben unmöglich, sofort allen üblen Geruch des Fleisches vollständig abzustreifen; ihre Qual wird dadurch noch schmerzlicher, weil ihre Seele gleichsam materialisiert worden war. Mit dieser Meinung scheint in Übereinstimmung zu stehen, was von manchen erzählt wird, daß nämlich an den Begräbnisstätten der Leiber sich oft schattenhafte Gestalten von Verstorbenen sehen lassen; das ist ein Beweis dafür, daß die Seele auch jetzt noch dem Fleischesleben in übertriebener Weise anhängt, so daß sie auch nach ihrer Vertreibung aus dem Fleische noch immer nicht von demselben fortfliegen will und die völlige Umwandlung der sichtbaren Gestalt in eine unsichtbare nicht zulassen möchte, sondern auch nach der Zerstörung des körperlichen Gebildes bei diesem zu verbleiben wünscht und deshalb sehnsuchtsvoll an den Orten der Materie umherirrt und in deren Nähe sich aufhält, obgleich sie doch den materiellen Leib schon verließ.“§ 12. Die Affekte der Seele nach dem Tode.</p><p>Nun hielt ich etwas inne und sprach dann, das Gesagte dem Sinne nach wiederholend: „Das eben Ausgeführte scheint einen Widerspruch zu den früheren Darlegungen über die Affekte zu bedeuten. Denn wenn wir annehmen, jene Bewegungen der Seele, welche in einem Abschnitt der Rede aufgezählt wurden, wie Zorn und Furcht, Begierde und Lust u. dgl., zeigten sich in uns wegen unserer Verwandtschaft mit den Tieren, und wenn dabei betont wurde, ihr guter Gebrauch sei Tugend, nur ihr schlechter Sünde, und wenn die Rede noch darauf hinwies, jene Seelenregungen würden überhaupt zu einem tugendhaften Leben beitragen und das Begehrungsvermögen insbesondere zu Gott emporführen, wie auch eine Kette von unten aus emporzieht, so scheint mir, wendete ich ein, in den angeführten Behauptungen ein Widerspruch zum Hauptgedanken der Rede, d. h. zur Unsterblichkeit der Seele zu liegen.“</p><p>„Wie meinst du das?“</p><p>„Dies, daß, wenn nach unserer Reinigung jegliche unvernünftige Seelenbewegung in uns getilgt ist, jedenfalls auch das Begehren in uns erlischt. Fehlt aber dieses, so fehlt auch das Verlangen nach dem Guten, weil sich ja in der Seele keine Bewegung mehr zeigt, welche ein Verlangen darnach wecken könnte.“</p><p>„Darauf können wir“, sprach sie, „sehr wohl entgegnen, daß die Fähigkeit der geistigen Erkenntnis und Unterscheidung zur Ebenbildlichkeit der Seele mit Gott notwendig gehört, da wir auch Gott die genannte Fähigkeit zuschreiben müssen; wenn wir also entweder durch einen sorgsamen Wandel im Diesseits oder durch eine Reinigung im Jenseits unsere Seele aus der Verbindung mit den unvernünftigen Leidenschaften herausheben, kann sie doch noch das Schöne erkennen; das Schöne aber zieht durch ihre eigene Natur jeden an, der es sieht. Ist demnach die Seele von allem Bösen rein, dann wird sie auf jeden Fall dem Schönen sich zuwenden. Schön ist aber auf Grund seiner Natur vor allem Gott; mit ihm tritt daher die Seele vermöge der Reinheit, die sie sich erworben, in enge Verbindung, weil sie dadurch ihm verwandt wird. Auf diese Weise benötigen wir nicht mehr die Anregung von seiten des Begehrungsvermögens, um zum Schönen zu gelangen. Denn wer allerdings in Finsternis wohnt, empfindet Sehnsucht nach dem Lichte; wer aber bereits zum Lichte vorgedrungen, hat schon den Genuß an Stelle des Verlangens; wo aber der Genuß stattfindet, erlischt das Verlangen.“</p><p>„Infolge dieser Tatsache erleidet demnach die Seele, auch wenn sie von jenen Affekten und Bewegungen frei geworden ist, in ihrer Vereinigung mit dem Guten keine Einbuße, indem sie sich auf sich selbst zurückzieht und sich bis in ihr tiefstes Wesen zu erfassen vermag und hiedurch in ihrer eigenen Schönheit wie in einem Spiegel und Abbild das Urbild schauen kann. Denn in Wahrheit kann man sagen, die wirkliche Gottähnlichkeit bestehe darin, daß unsere Seele den Allerhöchsten einigermaßen nachahmt; denn seiner Natur nach alle Begriffe übersteigend und über die Eigenschaften, die wir an uns beobachten können, hoch erhaben, ist sein Leben ganz andersartig und nur ihm zukommend, keineswegs mit dem vergleichbar, das wir hienieden führen. Denn wir Menschen sind, weil unsere Natur unaufhörlich in Bewegung ist, gewohnt, uns auf das zu stürzen, wohin der Wille sich richtet; dabei verhält sich unsere Seele nicht gleichmäßig sozusagen nach vorwärts und nach rückwärts. Die Hoffnung nämlich leitet die Bewegung nach vorwärts, die Erinnerung aber schließt sich dieser vorwärtsgehenden Bewegung an. Wenn nun die Seele zu wahrhaft Schönem sich hinwendet, so drückt eine solche Wendung der Erinnerung eine heitere, glänzende Spur ein; hat sie dagegen, weil ein Trugbild von Schönheit die davon befangene Seele täuschte, im Schönen sich geirrt, so wird die Erinnerung, welche dieser Seelenbewegung folgt, zur Scham, und so entsteht in der Seele ein Kampf, indem die Erinnerung gegen die Hoffnung Krieg führt, weil sie den Willen so schlecht lenkte. Denn der Affekt der Scham weist deutlich auf eine Geistesverfassung hin, in welcher die Seele wegen des Begangenen sich abhärmt, indem sie ihr törichtes Beginnen mit der Reue wie mit einer Geißel züchtigt und gerne zu ihrer Unterstützung die Vergessenheit heranziehen möchte. Weil arm an Schönem, trägt unsere Natur stets ein Verlangen nach dem, was ihr mangelt; und das Verlangen nach diesem ist eben das Begehrungsvermögen unserer Natur, welches entweder von falschem Urteil geleitet das, was wirklich schön ist, verfehlt, oder auch erreicht, was zu erreichen gut ist. Anders ist es allerdings mit der jeden Begriff des Guten überragenden und über alle Macht erhabenen Natur, die da nichts von dem, was man nur immer als gut betrachtet, benötigt, weil sie selbst die Fülle alles Guten ist, die da auch nicht erst durch Teilnehmen am Schönen zum Besitz des Schönen gelangt, sondern die wesenhafte Schönheit ist, ― diese gestattet, was der Geist auch immer als schön bezeichnen möchte, der Bewegung der Hoffnung keinen Zutritt (die Hoffnung regt sich ja nur in bezug auf das, was man noch nicht besitzt); auch der Apostel sagt: was man schon hat, wie soll man dies noch hoffen (Röm. 8, 24), noch ist sie der Tätigkeit der Erinnerung bedürftig; denn an das, was man vor Augen hat, braucht man sich nicht erst zu erinnern. Da also die göttliche Natur alles Gute weit überragt, das Gute aber mit dem Guten vertraut ist, darum will sie, ihren Blick auf sich selbst richtend, nur das, was sie hat, und zugleich hat sie bereits, was sie will, weshalb sie nichts ersehnt, was außerhalb ihrer gelegen ist. Denn außer ihr gibt es nichts als das Böse; dessen Sein besteht aber, wie sonderbar es auch klingen mag, im Nichtsein; das Böse besteht nämlich in der Beraubung des Seienden. Wahres Sein kommt bloß der Natur des Guten zu; was also nicht in dem Seienden ist, ist im Nicht-Sein.“</p><p>Wenn nun die Seele nach Ablegung all der verschiedenen natürlichen Affekte Gottähnlichkeit erreicht hat und die Begierde hinter sich lassend dahin gelangt ist, wohin sie sich durch die Begierde gezogen fühlte, so hat sie keinen Platz mehr weder für die Hoffnung noch für die Erinnerung; denn was sie hoffte, besitzt sie nun, und durch den Genuß alles Guten ganz in Anspruch genommen, schließt sie die Erinnerung aus den Gedanken aus. Und auf diese Weise, nach den besonderen Eigenschaften der göttlichen Natur gestaltet, lebt sie das höhere göttliche Leben, so daß keiner von den anderen Affekten übrigbleibt als nur der der Liebe, welcher mit dem Schönen in unzertrennlichem Zusammenhang steht; denn die Liebe ist innere Hinneigung zu dem, was gefällt. Wenn also die Seele, nachdem sie einfach, einförmig und gottähnlich geworden, jenes wahrhaft einfache und immaterielle Gut gefunden hat, das allein in Wirklichkeit liebenswürdig und begehrenswert ist, so verbindet und vereinigt sie sich mit ihm vermöge des Affektes der Liebe mit all ihrer Kraft, indem sie sich nach dem gestaltet, den sie nunmehr für immer erfaßt und gefunden hat, und durch Verähnlichung mit dem Guten das wird, was jener schon ist, an dem sie jetzt teilnehmen darf. Und da in Gott, weil er keinen Mangel empfindet, auch keine Begierde ist, so dürfte folgerichtig auch die Seele, weil sie ebenfalls keinen Mangel mehr leidet, die Begierde sowohl als Affekt wie als Anlage aus sich entfernt haben, weil ja Begierde nur da Platz hat, wo man das Ersehnte noch nicht besitzt. Zu dieser Ansicht führt uns auch der göttliche Apostel; denn er verkündigte: Alle unsere Bestrebungen in diesem Leben, selbst die höheren, würden einmal zur Ruhe kommen und aufhören; einzig die Liebe habe kein Ende. Er sagt nämlich: „Die Weissagungen werden schweigen und die Wissenschaften ruhen; aber die Liebe endet nie“ (1 Kor. 13, 8), d. h. sie bleibt immer dieselbe. Aber auch da, wo er „Glaube und Hoffnung bei der Liebe verbleiben“ läßt (nämlich hienieden, 1 Kor. 13, 13), stellt er wiederum letztere mit Recht über die zwei ersteren. Denn die Hoffnung regt sich nur so lange, als der Genuß des Gehofften noch fern ist; desgleichen kann der Glaube die Hoffnung bloß so lange stärken, solange das Gehoffte sich unserem Blicke noch nicht zeigt. Dies spricht er in den Worten aus: „Der Glaube ist eine Grundfeste für das, was man hofft“ (Hebr. 11, 1). Wenn aber das Gehoffte in unseren Besitz gelangt ist, dann bleibt von allen Affekten nur noch die Kraft der Liebe in Tätigkeit, weil sie nichts findet, was an ihre Stelle treten könnte. Daher nimmt sie den ersten Platz ein sowohl unter den Tugendübungen als auch unter den Gesetzesvorschriften.“§ 13. Die Läuterung der Seele vor und nach dem Tode.</p><p>„Wenn nun die Seele zu diesem Ziele emporgestiegen ist, dann bedarf sie keines anderen Gutes mehr, da sie (in Gott) die Fülle alles Seienden umfaßt; sie allein scheint in sich aufnehmen zu können, was die Seligkeit Gottes ausmacht. Denn auch das Leben der göttlichen Natur besteht in der Liebe, weil das Schöne notwendig von denen geliebt wird, die es erkennen; die Gottheit erkennt sich nun selbst; diese Erkenntnis wird aber zur Liebe, weil die göttliche Natur, die erkannt wird, wesenhaft schön ist. Mit dem wahrhaft Schönen ist auch keine Übersättigung verbunden; und da also kein Gefühl des Sattseins das Liebesverhältnis zum Schönen stört, so verläuft das Leben Gottes in immerwährenden Akten der Liebe, weil es von Natur aus sowohl schön ist als auch von Liebe zum Schönen hingezogen wird. Auch kennt diese Liebesbetätigung keine Grenze, weil auch für die göttliche Schönheit keine Grenze festgesetzt werden kann; darum findet die Liebe erst an dem Ende des Schönen ihr eigenes Ende. Erst an seinem Gegenteil aber hört das Schöne auf; derjenige nun, dessen Natur das Böse völlig ausschließt, muß eine Güte besitzen, die ohne Ende und ohne Grenzen ist. Und da jede Natur an sich zieht, was verwandt ist, der Mensch aber zur Verwandtschaft mit Gott durch seine Ähnlichkeit mit dem Urbilde erhoben wurde, wird die Seele notwendig zu der ihr verwandten Gottheit hingezogen; was aber zu Gott gehört, muß auf jeden Fall und ganz gerettet werden.“</p><p>„Allerdings, wenn die Seele, insofern das Gewicht des Körpers sie nicht niederdrückt, leicht und unbeschwert ist, dann wird für sie der Zugang zu dem, der sie an sich zieht, angenehm und bequem; wenn sie dagegen mit den Nägeln der Leidenschaften am Materiellen, in das sie sich versenkt, angeheftet ist, also in ähnlich schlimmer Lage sich befindet wie die Leiber, welche bei dem durch Erdbeben herbeigeführten Einsturz des Hauses in die Trümmer eingequetscht wurden ― denken wir nur an den Fall, daß nicht nur Schutt schwer auf ihnen liegt, sondern daß sie auch von eisernen Haken und Holzstücken mehrfach durchbohrt sind, ― was also solche Leiber, wenn sie von den Verwandten der Bestattung wegen aus dem Trümmerhaufen hervorgezogen werden, Schreckliches erdulden; ― denn sie werden hiebei ganz zerschunden und zerrissen und überhaupt arg zugerichtet, weil Haken und Schutt sie um so mehr zerfleischen, je mehr man Gewalt anwenden muß, sie aus dem Geröll herauszuziehen, ― ähnliche Leiden, meine ich, haben die Seelen auszustehen, wenn die göttliche Macht aus lauter Güte sie aus dem Schutt des Unvernünftigen und Materiellen als ihr Eigentum hervorholen will.“</p><p>„Denn wie ich glaube, will Gott keineswegs bloß aus Haß oder Rachsucht im Hinblick auf ihren schlechten Wandel über die Sünder Leiden verhängen, er, der alles, was er seinetwegen erschuf, zu sich ruft und holt, sondern in edlerer Absicht zieht er die Seele an sich als zur Quelle der Glückseligkeit, wobei allerdings den, welchen er zu sich zieht, Leid trifft, aber nur nach einem unabänderlichen Gesetz der Notwendigkeit. Wie nämlich diejenigen, welche die dem Golde beigemischte Schlacke in reinigendem Feuer ausscheiden wollen, nicht bloß das Unreine, sondern mit unausweichlicher Notwendigkeit auch das Gold im Läuterungsfeuer zur Schmelze bringen, und wie dabei das edle Metall erhalten bleibt, alles Unedle aber verzehrt wird, so muß auch das Böse nach einem Gesetz der Notwendigkeit durch ein Reinigungsfeuer verzehrt werden; hiebei muß aber auch die Seele so lange im Feuer aushalten, bis die beigemischte unechte Schlacke und unsaubere Materie im Feuer ganz verbrannt ist.“</p><p>„Wie, wenn um ein Seil ein recht leimartiger Ton geschmiert ist, dann das Ende des Seiles durch eine enge Öffnung hindurchgesteckt wird und nun jemand das Seil kräftig hindurchzieht, dieses zwar notwendig dem Anziehenden folgen muß, der herumgeschmierte Ton aber infolge des starken Ziehens vom Seile abgestreift wird und so außerhalb der Öffnung zurückbleiben muß, mit der weiteren üblen Folge, daß das Seil immer schwerer durch die Öffnung geht und deshalb mit immer größerer Gewalt gezerrt werden muß ― etwas Ähnliches wird auch der Seele widerfahren, d. h. sie wird, falls sie noch von materiellen und erdhaften Leidenschaften eingehüllt erscheint, in empfindlicher Weise ausgespannt, wenn Gott zwar sein Eigentum an sich ziehen möchte, aber Fremdartiges mit ihr fest verwachsen ist, das erst mit Gewalt abgestreift werden muß, was dann allerdings heftige Schmerzen verursacht, die kaum zu ertragen sind.“</p><p>„So scheint denn“, sprach ich, „das göttliche Gericht in erster Linie die Sünder nicht strafen zu wollen, sondern, wie eine (aus Ber.: lies: „eine“ statt „seine“) Darlegung zeigt, auf die Lostrennung des Guten vom Bösen auszugehen und die Seele zur Teilnahme an der ewigen Glückseligkeit heranzuziehen; den Angezogenen widerfährt allerdings Schmerzliches, wenn ihre Verwachsenheit mit dem Bösen zerrissen wird.“</p><p>„Das ist allerdings“, sagte die Lehrerin, „auch meine Ansicht; ebenso meine ich, daß die Größe der Qual von der Größe der Sündhaftigkeit abhängt, die in einem sich findet. Denn unbillig wäre es, wenn der, welcher auf dem Wege des Bösen schon weit vorangeschritten ist, und der, welcher nur in geringere Nachlässigkeiten verstrickt wurde, bei der Reinigung von ihrem sündhaften Zustand gleich hart mitgenommen würden, vielmehr wird je nach der kleineren oder größeren Quantität der vorhandenen Materie die so schmerzliche Flamme brennen, solange sie Nahrung findet. Wem also eine große Masse von Materie anhaftet, dem wird auch notwendig eine heftige und lange dauernde Flamme beschieden sein; wem aber der Brennstoff für die Flamme nur in geringerer Menge beigemischt ist, bei dem läßt die Strafe an Heftigkeit und Dauer um soviel nach, als der Brennstoff infolge der geringeren Sündhaftigkeit weniger groß geworden war. Denn das Böse muß einmal ganz und gar aus dem Reiche des Seienden entfernt werden und das, was nach den früheren Ausführungen im Seienden ein Nicht-Sein hat, überhaupt nicht mehr existieren. Denn da das Böse außerhalb des freien Willens keine Wesenheit besitzt, so muß, sobald jeglicher Wille ganz in Gott sein wird, das Böse völliger Vernichtung anheimfallen, da alsdann nichts mehr da sein wird, das es aufnehmen könnte.“</p><p>„Doch,“ warf ich ein: „welchen Gewinn könnte diese Hoffnung angesichts der Erwägung wecken, welch großes Übel es ist, auch nur ein Jahr Pein auszustehen; wenn aber jenes unerträgliche Weh über eine ganze Ewigkeit sich erstrecken würde, wie könnte sich dann derjenige mit der Hoffnung auf die Zukunft trösten, dem eine Strafe für die ganze Ewigkeit zuerkannt wird?“</p><p>Die Lehrerin erwiderte darauf: „Darum muß unsere Sorge darauf gerichtet sein, daß wir unsere Seele von allem Schmutz der Sünde ganz rein und unversehrt bewahren, oder daß wir, falls dies wegen der Gebrechlichkeit unserer Natur durchaus unmöglich ist, uns nur Verfehlungen zuschulden kommen lassen, die unbedeutend und daher leicht gutzumachen sind. Denn die evangelische Erzählung (Matth. 18, 23; Luk. 7, 41) erwähnt einen Schuldner von zehntausend Talenten, aber auch von fünfhundert und von fünfzig Groschen, und schließlich von nur einem Heller, welches die kleinste Münze ist; allerdings lehrt sie auch, daß das gerechte Gericht Gottes, ohne das Geringste zu übersehen, sich auf alles erstreckt und jedesmal genau nach der Schwere der Schuld die Heimzahlung bestimmt, die sich als notwendig erweist. Weiterhin bezeugt das Evangelium, daß die Schuldabtragung nicht durch Zahlung in Geld geschehe, sondern daß der Schuldner den Peinigern überliefert werde, bis er, wie es heißt, die ganze Schuld abgetragen habe (das heißt aber nichts anderes als: er müsse durch die Peinigung die noch vorhandene Schuld oder die Gebühr erlegen, welche auf Teilnahme an Strafbarem gesetzt ist, welche Schuld er im Leben auf sich lud, (da er einzig und allein auf Lust ausging, ohne irgendwie Schmerz und Leid verkosten zu wollen) und auf diese Weise nach Ablegung alles Fremdartigen, d. h. alles Sündhaften, und nach Entfernung alles dessen, was als schuldbar auch entsprechende Strafe bringt, zur Freiheit und Unabhängigkeit gelange. Die Freiheit aber bringt Ähnlichkeit mit dem, der da keinen Herrn über sich hat und unbeschränkte Macht besitzt, die uns zwar schon im Anfang geschenkt war, aber durch schändliche Sünden beschränkt wurde. Alle Freiheit ist aber ihrer Natur nach nur ein und dieselbe und verwandt mit allem, was frei ist; folglich wird alles Freie sich mit dem verbinden, was mit ihm gleich freie Art besitzt. Die Tugend aber kennt keinen Zwang; darum wird alles Freie in ihr sein. Denn was keinen Zwang sich auferlegen läßt, ist frei. Nun ist aber die göttliche Natur die Quelle aller Tugend; in ihr sind demnach alle, welche die Sünde von sich geworfen haben, damit, wie der Apostel sagt (1 Kor. 15, 25), Gott alles in allen sei.“</p><p>„Gerade dieses Schriftwort, daß Gott sowohl alles sei als auch in allen sei, scheint mir, den vorher in der Untersuchung festgestellten Gedanken zu bestätigen. Da nämlich das gegenwärtige Leben mannigfaltig und vielgestaltig verläuft, so gibt es in demselben gar manches, an dem wir Anteil haben, wie Zeit, Luft, Raum, Speise,Trank, Kleider, Sonne, Lampenlicht und noch viele andere Dinge, die zur Notdurft des Lebens gehören, von denen aber nicht eines Gott ist. Die Seligkeit aber, die wir erwarten, bedarf keines derselben, vielmehr wird Gott uns alles sein und die Stelle aller Dinge vertreten, indem er sich uns in entsprechender Weise mitteilt, damit wir in ihm alles haben, was zu jenem Leben gehört. Und so ergibt sich aus den göttlichen Aussprüchen mit voller Deutlichkeit, daß Gott für die seiner Würdigen sein wird Wohnung, Haus, Kleidung, Speise, Trank, Licht, Reichtum, Herrschaft und alles andere, was sich nur immer aufzählen und denken läßt als zu einem guten Leben dienlich. Gott, der so* alles* sein wird, wird dies aber auch* in allen* sein. Indem die Schrift dies lehrt, scheint sie mir die Vernichtung der Sünde zu verkünden. Denn wenn Gott in allen ist, dann kann die Sünde nicht mehr in ihnen sein. Denn wenn jemand meinte, die Sünde würde weiter bestehen, wie könnte er dann den Satz aufrechterhalten, daß Gott in allen sei? Denn das Wort, Gott sei alles in allen, wäre umgestoßen, sobald in bezug auf das Böse eine Ausnahme gemacht würde, nämlich als ob dieses weiter bestünde. Wenn Gott auch in allen ist, so kann er unmöglich in dem sein, was keine Existenz hat.“§ 14. Die Ansicht von der Seelenwanderung.</p><p>Ich warf die Frage auf: „Wie sollen wir jene belehren, welche sich bei Unglück kleinmütig zeigen?“ Die Lehrerin gab zur Antwort: „Sagen wir ihnen doch: ganz grundlos ist euere Ungeduld und euer Mißmut über den Verlauf, welchen die Dinge mit scheinbarer Notwendigkeit nehmen! Ihr wisset ja nicht, auf welchen Zweck das einzelne im Zusammenhang mit dem großen Ganzen hingelenkt wird; denn alles soll zur Vereinigung mit Gott geführt werden, und zwar in der Ordnung und Reihenfolge, welche der Weltenlenker mit vollendeter Weisheit festsetzte. Zu diesem Zweck trat die vernünftige Natur ins Dasein, damit die Fülle der göttlichen Güter nicht müßig daliege; die Weisheit, welche das All erschuf, bereitete sich vielmehr in unseren Seelen gleichsam Gefäße und Behälter, mit Freiheit ausgestattet und geeignet, jene Güter aufzunehmen und in sich immer mehr zur Entfaltung zu bringen, je mehr dieselben zufließen. Denn ein Vorzug der göttlichen Güter ist es, daß sie alle, zu denen sie gelangen, größer und aufnahmsfähiger machen, indem ihre Aufnahme eine Vermehrung der Kraft und Größe bewirkt, so daß die Empfänger immer zunehmen und in der Zunahme nicht stille stehen. Da nämlich die Quelle des Guten unaufhörlich fließt, so wird die aus ihr schöpfende Natur, weil infolge der Verwertung des ganzen Zuflusses zum Besten des Empfängers und zur Vermehrung seiner Größe keine der empfangenen Gaben sich als überflüssig oder als unnütz erweist, sowohl kräftiger zur Anziehung des Guten als auch geeigneter zur Aufnahme desselben, so daß beides zugleich zunimmt: einerseits steigt die genährte Kraft infolge der Fülle von Gütern, die zufließen, anderseits mehrt sich der nährende Zufluß, weil auch die Aufnahmsfähigkeit wächst. Zu solcher Größe werden wir demnach emporgehoben, so daß unser Wachstum keine Grenzen kennt. Und eine derartige Erhöhung und Erhebung vor Augen wollt ihr betrübt sein, daß unsere Natur dem Ziele entgegeneilt, das ihr gesteckt ist? Denn wir können den Lauf zu jenen Gütern auf keine andere Weise zurücklegen als dadurch, daß wir, was uns niederdrückt, d. h. diese schwerfällige irdische Masse von der Seele abschütteln, und nur wenn wir die Abhängigkeit von ihr, die wir hienieden tragen müssen, durch Streben nach Höherem abgestreift haben, können wir mit dem Reinen vereinigt werden, weil wir uns ihm gleichartig gemacht haben. Hast du aber auch noch einen gewissen Hang zu diesem Körper und fällt dir in deiner Liebe zu ihm, die Trennung von ihm schwer, so brauchst du auch in dieser Beziehung nicht hoffnungslos sein. Denn du wirst sehen, wie diese körperliche Hülle, wenn der Tod sie auch auflöst, einst aus demselben Stoffe wieder gewebt wird, nicht in dieser groben und schweren Ausstattung, sondern aus einem feineren, ätherischen Gewebe, so daß du deinen Freund wieder gewinnen wirst und sogar in einer besseren und herrlicheren Schönheit.“</p><p>„Doch,“ sagte ich, „wie mir scheint, führte uns der Verlauf der Rede auch auf die Lehre von der Auferstehung, welche ja auf Grund der Heiligen Schrift als durchaus wahr und zuverlässig gelten muß, ohne daß irgendein Zweifel gestattet wäre. Da aber unser schwacher Menschenverstand durch leichtfaßliche Gründe und Beweise eine Stütze bekommt und bereitwilliger für die Glaubenslehre wird, so dürfte es gut sein, auch an diesem Punkt nicht ohne nähere Untersuchung vorüberzugehen. Sehen wir zu, was hier zu sagen ist!“</p><p>Meine Lehrerin sprach nun: „Die außerhalb unserer christlichen Philosophie Stehenden haben die Lehre von der Auferstehung zum Teil berührt, wenn auch in verschiedener Weise. Hiebei stimmen sie weder mit unserer Lehre vollständig überein, noch wollen sie dieselbe ganz verwerfen. Manche ziehen bei dieser Gelegenheit das Menschliche in den Staub durch die Behauptung, die nämliche Seele gehöre bald einem Menschen, bald einem Tiere an, indem sie zuerst in einem menschlichen Körper wohne, dann aber die Leiber wechsle und nach Belieben immer in andere übergehe, sei es, daß sie ein Vogel werde oder ein Wasser- oder auch ein Landtier, und schließlich wieder zur Menschennatur zurückkehre. Einige dehnen diese Albernheit sogar bis zu den Sträuchern aus und meinen, der Menschenseele sei auch das Leben im Holze entsprechend und zusagend. Andere jedoch sind der Ansicht, sie gehe nur von einem Menschen in einen anderen über und das menschliche Leben (aller Jahrhunderte) werde von den nämlichen Seelen gelebt, indem die nämlichen Seelen ohne Unterbrechung bald in diesen Menschen Wohnung nähmen, bald in jenen. Von den Glaubenslehren der Kirche ausgehend, können wir diese philosophischen Ansichten nur nach der einen Seite begrüßen, daß sie in gewisser Beziehung doch eine Übereinstimmung mit unserer Lehre von der Auferstehung aufweisen. Denn die Anschauung, die Seele ziehe nach ihrer Trennung von diesen Körpern wieder in andere, steht nicht in unüberbrückbarem Gegensatz zu dem Wiederaufleben, das wir hoffen. Auch unsere Lehre hält nämlich daran fest, unser Leib bestehe jetzt und später wiederum aus den Elementen der Welt; die Außenstehenden sind derselben Ansicht, und sie dürften auch auf den Gedanken kommen, es gäbe eine andere Körpernatur, die nicht aus der Vereinigung von fremdartigen, neuen Elementen gebildet wäre. Der Unterschied besteht aber darin, daß nach unserer Lehre der nämliche Körper und die nämliche Seele, und zwar aus denselben Bestandteilen sich zusammenfinde, daß dagegen nach der Ansicht jener Nicht-Christen die Seele in andere Körper übergeht, teils in vernunftbegabte, teils in vernunft- und empfindungslose, freilich mit dem Zugeständnis, daß diese aus den Elementen unserer Welt bestünden, dagegen nicht aus den Bestandteilen, welche im früheren Leben mit der Seele verbunden und verwachsen waren, was gerade im Gegensatz zu unserer Glaubenslehre steht. Wir können demnach sagen, die heidnische Philosophie bezeuge selbst die Wahrscheinlichkeit, daß die Seele abermals einen Körper annehme. Da bietet sich also die beste Gelegenheit, einerseits die Unhaltbarkeit der nicht-christlichen Anschauung darzutun, andererseits in logischer Abfolge die Wahrheit unserer Lehre ans Licht zu stellen. Was sollen wir hierüber darlegen?“</p><p>„Diejenigen, welche die Seele in verschiedene Naturen wandern lassen, scheinen mir die Eigentümlichkeit der Naturen zu verwischen und alle Dinge ganz und gar durcheinanderzubringen: das Vernünftige und Unvernünftige, das Empfindende und Empfindungslose, so daß sie ineinander übergehen und nicht mehr durch feste natürliche Grenzen voneinander geschieden werden. Denn sie behaupten, ein und dieselbe Seele wohne jetzt in unserer Körperhülle, mit Vernunft und Denkkraft ausgestattet, dann aber krieche sie mit den Schlangen oder schwärme mit den Vögeln oder trage Lasten oder fresse Fleisch oder lebe im Wasser oder sinke selbst in das Empfindungslose hinab, indem sie, ein Baum werdend, Wurzel schlage, Zweige treibe und an diesen entweder eine Blüte oder einen Dorn, eine nahrhafte oder giftige Frucht trage ― dies behaupten heißt nichts anderes als annehmen, alles sei ein und dasselbe, und es gäbe bloß* eine* Natur, die sich in unterschiedsloser und verworrener Gemeinschaft mit sich selbst vermengt, so daß keine Eigentümlichkeit mehr das eine vom anderen scheidet. Denn wer sagt: „Ein und dasselbe sei in jeglichem“, will damit nichts anderes erklären, als alles sei ein und dasselbe, so daß der an den Dingen offenbar hervortretende Unterschied kein Hindernis für die Vermischung selbst unvereinbarer Gegensätze bilden soll und daß, wer ein giftiges oder reißendes Tier sieht, sich zur Annahme entschließen muß, es sei mit ihm verwandt und gleichartig. Ein solcher muß selbst den Schierling als stammverwandt mit seiner eigenen Natur ansehen, da er mit der menschlichen Natur auch in einer Pflanze rechnen muß; ebenso darf der Mensch auch bezüglich der Rebe, die wir bloß zum Lebensbedarf anbauen, keineswegs jedes Bedenken ablegen; denn sie gehört zu den Pflanzen; zu ihnen zählen wir auch die Ährenfrüchte, von denen wir uns ernähren. Wie wird er also die Sichel anlegen, um die Ähren zu schneiden? wie die Traube auspressen oder den Dorn aus der Erde graben oder die Blumen pflücken oder Jagd auf die Vögel machen oder mit Holz Feuer anzünden, da er nicht weiß, ob er die Hand nicht gegen Geschwister oder gegen Vorfahren oder überhaupt gegen seinesgleichen ausstreckt, mit ihren Körpern Feuer anmacht oder den Krug mischt oder die Nahrung bereitet. Indem er bei all diesen Gegenständen und Verrichtungen glaubt, die Seele werde ein Tier oder eine Pflanze, dabei aber an keinem etwa aufgeklebten Zeichen zu erkennen vermag, ob die Pflanze oder das Tier aus einem Menschen oder aber auf andere Weise entstanden sei, so wird der, welcher von jenem Wahne befangen ist, gegen alles das gleiche Verhalten an den Tag legen, so daß er notwendigerweise auch gegen die wirklichen Menschen sich hart zeigen wird oder, falls er gegen dieselben freundlich und gütig sich benimmt, ebenso gegen jedes lebende Wesen sich verhält, auch wenn er auf Schlangen oder wilde Tiere stößt; ja wenn einer, der dieser Lehre huldigt, in einen Wald kommt, so wird er selbst die Bäume für ein Volk von Menschen halten. Welches Leben führt nun einer, wenn er entweder, weil alles wesensverwandt ist, gegen alles von Vorsicht und Bedenken oder aber gegen die Menschen, weil sie sich von anderen Dingen nicht unterscheiden, von Rücksichtslosigkeit erfüllt ist?“</p><p>„Demnach ist diese heidnische Lehre zu verwerfen, zumal da gegen sie auch noch andere Erwägungen der Vernunft sprechen. Ich habe nämlich von Anhängern dieser Lehre gehört, daß sie gewisse Völkerschaften von Seelen annehmen, welche vor dem Leben im Leibe bereits in einem besonderen Staate leben und wegen ihrer Feinheit und Leichtbeweglichkeit ihrer Natur mit der Umkreisung des Alls sich herumbewegen würden. Aber wegen einer gewissen Hinneigung zum Bösen ihrer Schwingen verlustig geworden, kämen die Seelen in Körper, und zwar zuerst in menschliche, sodann würden sie wegen ihrer Hingabe an unvernünftige Leidenschaften nach dem Ausscheiden aus dem menschlichen Leben in Tierleiber gebannt und von da sänken sie zum pflanzenhaften und empfindungslosen Dasein herab, so daß die Seele, obgleich sie ihrem Wesen nach fein und leichtbeweglich ist, wegen ihres Hanges zum Bösen zuerst eine gewisse Schwere bekäme, dann nach unten strebe und in menschliche Körper eingekerkert werde, hierauf nach Aufzehrung der Denkkraft in unvernünftigen Tieren lebe und endlich nach Verlust des Empfindungsvermögens das gefühllose Pflanzenleben annähme, jedoch nur, um von hier aus in der nämlichen Stufenfolge wieder in die Höhe zu steigen und in die himmlische Region zurückzukehren. Für alle, welche nur etwas Urteilskraft besitzen, widerlegt sich eine solche Lehre von selbst, da sie gar keinen Halt in sich hat. Denn wenn die Seele wegen der Sünde von dem himmlischen Leben zu einem Leben im Holze herabgezogen wird, von diesem aber durch die Kraft der Tugend wieder zum himmlischen Lande zurückkehrt, so gerät sie durch ihre Entscheidung darüber, ob das Leben im Holze oder aber das im Himmel wertvoller ist, in die größte Verlegenheit; denn dadurch, daß die Seele ihren Aufenthaltsort immer wieder wechselt, kommt ein gewisser Kreislauf zustande, der sie stets durch dieselben Regionen führt. Wenn sie nämlich vom unkörperlichen Leben zum körperhaften und zum empfindungslosen herabsinkt und dann abermals zum unkörperlichen aufsteigt, so bedeutet dies nichts anderes als eine unterschiedslose Zusammenmengung von Gutem und Schlechtem, welche die Anhänger der beschriebenen Anschauung vornehmen. Denn einerseits vermag der Aufenthalt im Himmel voll Glückseligkeit nicht festgehalten zu werden, weil ja die Sünde auch dorthin Zutritt erlangt; andererseits werden die Bäume nicht der Tugend entbehren, weil sich nach ihrer Vorstellung hier die Seele zum Guten erhebt, um dort oben das schlechte Leben zu beginnen. Denn wenn die Seele, während sie mit dem Himmel sich bewegt, in die Fallstricke der Schlechtigkeit gerät und, zur Strafe dafür zum Leben im Holze verurteilt, wiederum zur himmlischen Wohnung emporgehoben wird, so verraten sie damit ihre Ansicht, das materielle Leben tilge die Schlechtigkeit, die regelmäßige Umkreisung aber werde für die Seelen Grund und Ursache zum Bösen, da sie ja von hienieden aus auf den Flügeln der Tugend zum Himmel emporziehen, von da aus aber, der Sünde wegen der Flügel beraubt, auf die Erde herabfallen und mit der schwerfälligen und dichten Materie umkleidet werden.“</p><p>„Doch bei diesen Widersprüchen macht die Ungereimtheit jener Lehre noch nicht halt, sie ist aber auch nicht imstande, ihre Grundlage oder Voraussetzung aufrechtzuhalten. Denn wenn sie das Himmlische unwandelbar nennen, wie findet dann doch die Hinfälligkeit in dem Unwandelbaren Platz? Und wenn die irdische Natur hinfällig ist, wie kommt es dann im Hinfälligen zur Beständigkeit? Allein sie mengen untereinander, was keine Vermengung duldet, und sie vereinigen, was sich nicht vereinigen läßt. In dem Wandelbaren sehen sie Unwandelbares, in dem Wandelbaren das Beständige. Und nicht einmal hier bleiben sie stehen; sondern in die nämliche Region, aus der sie die Seele der Sünde wegen verstießen, lassen sie dieselbe aus dem materiellen Leben in ein sicheres und unsterbliches zurückwandern, als hätten sie vergessen, daß sie von dort, von der Sünde niedergezogen, zur irdischen Natur herabsinken. Der Tadel des irdischen Lebens und das Lob des himmlischen wird durcheinander gerührt und vermengt, indem doch einerseits nach ihrer Behauptung gerade das Getadelte zum Guten führt, andererseits das von ihnen selbst Gelobte der Seele den Anstoß gibt, daß sie in das Schlechtere herabstürzt. All diese irrigen und haltlosen Annahmen müssen also von der Verkündigung der Wahrheit vollständig fernegehalten werden. Aber auch denen, welche die Seelen aus weiblichen Leibern in Männer oder umgekehrt die aus männlichen Leibern scheidenden Seelen in Weiber kommen oder auch aus Männern wiederum in Männer und aus Weibern abermals in Weiber übergehen lassen, können wir nicht folgen, weil auch sie von der Wahrheit abirren.</p><p>Die vorher erwähnte Ansicht verdient nämlich nicht nur wegen ihrer Haltlosigkeit und Falschheit völlige Verwerfung, sondern auch wegen ihrer Gottlosigkeit, weil sie behauptet, kein Mensch und kein Erdending trete ins Dasein außer durch eine Sünde, welche jeder Natur den Existenzbeginn vermittle. Denn wenn ohne den Fall einer Seele von oben auf die Erde weder Menschen noch Tiere entstehen sollen, so zeigt es sich deutlich, daß sie die Sünde für die Entstehungsursache alles Irdischen halten. Und wie trifft beides auf die Minute zusammen: die Entstehung eines Menschen durch die Ehe und der Herabsturz der Seele, gleichzeitig mit dem ehelichen Akte erfolgend! Und was noch ungereimter ist als dies: da die Paarung der Tiere meist im Frühjahr geschieht, soll man deshalb annehmen, daß das Frühjahr die Entstehung von Sünden in den höheren Sphären begünstige, so daß die Anfüllung der Seelen mit Sünden, welche den Herabsturz veranlaßt, und das Trächtigwerden der Tierleiber zusammentreffen? Und was wird man vom Landmann sagen, der Pflanzenschößlinge in die Erde setzt? Wie soll dessen Hand zugleich mit dem Schößling die menschliche Seele einpflanzen, so daß das Herabgleiten der Seele gleichzeitig mit der Absicht des Menschen zu pflanzen stattfindet? Nicht weniger verkehrt ist die Meinung, die Seele spähe nach dem Verkehr der Ehegatten aus oder warte die Geburten ab, um in die neu entstehenden Leiber einzuziehen. Wenn aber der Mann der Ehe entsagt und die Frau von den Geburtswehen verschont bleiben will, wird dann wohl die Sünde die Seele keineswegs zur Erde herabziehen? Reizt also die Ehe das Böse zum Angriff auf die Seelen im Himmel oder wird auch ohne dieselbe der Hang zum Bösen in der Seele erwachen? Wird in letzterem Fall die Seele zwischen Himmel und Erde ohne Wohnung und unstät umherschweifen, weil sie einerseits durch die Sünde dem Himmel entfremdet ist, andererseits, da es sich so gerade trifft, auch keinen Körper findet, der sie aufnehmen könnte?</p><p>Wenn sie nun dem geschilderten zufälligen und unvernünftigen Herabgleiten der Seelen die Anfänge des Menschenlebens zuschreiben, welche Vorstellung machen sie sich dann noch von der Regierung und von der Herrschaft Gottes über alles Seiende? Denn wie der Anfang muß unbedingt auch das sich gestalten, was auf denselben folgt. Wenn nämlich der Anfang des Lebens auf einen bloßen Zufall zurückzuführen ist, so muß auch der ganze Verlauf desselben dem reinen Zufall unterliegen. Vergeblich wollen solche das Seiende von der göttlichen Macht abhängig sein lassen, da ja nach ihnen die Dinge in der Welt nicht durch den göttlichen Willen entstehen, sondern durch einen bösen Zufall in das Sein eingeführt werden, insofern nach ihrer Lehre das menschliche Leben nicht beginnen könnte, wenn es nicht durch das Böse veranlaßt würde. Wenn aber der Anfang des Lebens so beschaffen ist, so muß auch der Verlauf desselben diesem Anfang entsprechen. Denn niemand wird wohl aus Bösem Gutes oder aus Gutem Böses entspringen lassen, sondern je nach der Beschaffenheit des Namens erwarten wir auch die Früchte. Demnach wird jene ganz zufällige Bewegung der Seelen vom Himmel zur Erde das ganze Menschenleben beherrschen, ohne daß die Vorsehung Einfluß auf den Erdenlauf hätte. Unnütz wäre alsdann auch die Vorsorge der Menschen mit Hilfe ihrer Vernunft, vergebens die Enthaltung vom Bösen und ohne Aussicht auf Lohn die Übung der Tugend. Denn alles wird dem blinden Zufall unterworfen und das Menschenleben unterscheidet sich von unbeladenen Schiffen in nichts, weil es von den bloßen Zufällen wie von Wellen hin und her getrieben wird, bald empor zu Glück, bald hinab zu Unglück. Denn ein Gewinn kann aus der Tugend nicht für solche erwachsen, deren Natur dem Gegenteil ihren Ursprung verdankt. Untersteht unser Leben nämlich Gott und seiner Regierung, so ist es klar, daß es nicht durch die Sünde angefangen hat; treten wir aber durch diese in das Dasein ein, so werden wir auch unser ganzes Leben nach derselben gestalten.</p><p>Wie ein Märchen klingt dann die Lehre von Gericht und Strafe nach diesem Leben, desgleichen von jenseitiger Wiedervergeltung und überhaupt von all dem, was zur Beseitigung des Bösen genannt und geglaubt wird. Denn wie kann der Mensch von der Sünde frei werden, wenn er durch sie geworden ist? Und wie soll der Entschluß, ein tugendhaftes Leben zu führen, im Menschen erwachen, wenn seine Natur, wie jene sagen, aus der Sünde stammt? Denn wie unvernünftige Tiere kein Verlangen darnach tragen, wie die Menschen zu reden, und ihre Unfähigkeit, vernünftige Worte zu bilden, für kein Unglück halten, wenn sie nur ihre natürlichen und eigentümlichen Laute von sich geben können, in ähnlicher Weise werden auch jene, deren Leben, wie angenommen wird, durch die Sünde begründet und veranlaßt wurde, kein Begehren nach der Tugend empfinden, weil diese außerhalb des Bereiches ihrer Natur liegen würde. Nun aber eifern und verlangen alle, welche ihre Seele schon auf Grund vernünftiger Erwägungen veredeln wollen, nach einem tugendhaften Leben; daraus erhellt deutlich, daß die Sünde nicht älter ist als das Leben, und daß nicht von ihr die Menschennatur abgeleitet werden kann, sondern daß die alles lenkende Weisheit Gottes unserem Leben den Anfang verlieh, daß sie aber, nachdem sie auf die ihm gefällige Weise ins Dasein eingetreten ist, dann die volle Freiheit der Entscheidung haben und werden soll, was sie kraft des Vermögens der Selbstbestimmung will.“</p><p>„Wir können uns aber die Sache durch das Auge veranschaulichen, das als Beispiel sich eignet. Ihm kommt von Natur aus das Sehen zu, das Nichtsehen aber rührt vom Willen oder von einer Krankheit her; das Widernatürliche kann also statt des Natürlichen leicht eintreten, sei es dadurch, daß jemand das Auge freiwillig schließt oder daß die Sehkraft durch ein Leiden verlorengeht. So kann man auch von der Seele sagen, daß sie durch Gott zwar das Dasein habe, daß sie aber, da in Gott keine Spur von Bösem wahrnehmbar ist, hiezu auf keinen Fall gezwungen werden kann. Infolgedessen gelangt sie zu dem Ziel, das sie sich selbst mit freiem Willen gesteckt, indem sie sich freiwillig gegen das Gute verschließt oder, durch die Arglist des unserem Leben nachstellenden Feindes am Auge verwundet, in der Finsternis des Irrtums dahinlebt, oder umgekehrt, indem sie unverwandt auf die Wahrheit blickend alle Einflüsse der Finsternis fernehält.“§ 15. Der Eintritt der Seelen in das Dasein.</p><p>„Nun wird man auch weiter fragen, wann ist die Seele geworden und wie? Allein die Frage, wie jedes einzelne geworden, bleibt von der Erörterung ganz ausgeschlossen; denn selbst in bezug auf die Dinge, die unserer Erkenntnis naheliegen und durch die Sinne wahrgenommen werden, dürfte es der forschenden Vernunft unmöglich sein, selbst bei dem, was sichtbar ist, das Wie der Entstehung zu erkennen, weshalb wir auch sogar den gotterleuchteten und heiligen Männern eine derartige Erkenntnis nicht zuschreiben dürfen. Denn mittels des Glaubens, sagt der Apostel (Hebr. 11, 3), wissen wir, daß die Welten durch das Wort Gottes geschaffen worden seien, so daß das Sichtbare aus dem Unsichtbaren hervorgegangen ist. So würde der Apostel, nach meiner Ansicht, sich niemals ausdrücken, wenn er der Meinung gewesen wäre, die Frage könnte durch Vernunftschlüsse gelöst werden; vielmehr gesteht der Apostel, zum Glauben an die Tatsache gekommen zu sein, daß die ganze Welt und alles, was aus ihr stammt, durch den Willen Gottes geschaffen sei; ― wie man den Ausdruck Welt auch immer verstehen mag, auf jeden Fall ist damit die sichtbare und unsichtbare Schöpfung gemeint ― die Frage nach dem Wie dagegen läßt er unerörtert. Ich glaube auch nicht, daß darauf aller Forscherfleiß eine genügende Antwort geben kann; denn der Lösung dieses Problems stellen sich zuviel Schwierigkeiten entgegen. Wie entsteht aus der feststehenden Natur das Bewegte? wie aus der einfachen und ausdehnungslosen das Zusammengesetzte und Ausgedehnte? Etwa aus der allerhöchsten Wesenheit selbst? Doch das können wir nicht zugeben, weil alle anderen Dinge sich von jenem zu sehr unterscheiden. Aber woher denn? Doch unser Geist erblickt außer der göttlichen Natur nichts (als ewig oder ursprünglich). Außerdem müßte unsere Spekulation verschiedene Prinzipien aufstellen, falls wir außerhalb der schöpferischen Ursache noch etwas annehmen würden, woher die allgestaltende Weisheit die Mittel zur Schöpfung genommen hätte. Da es nun bloß einen einzigen Urgrund für alles Seiende geben, und mit dieser über alles erhabenen Natur kein durch sie geschaffenes Wesen gleichartig sein kann, so ergibt sich, daß folgende zwei Annahmen unmöglich sind: die Meinung, die Schöpfung sei aus der göttlichen Natur gebildet, sowie die Ansicht, alle Dinge hätten eine andere Natur zur Grundlage; denn im ersten Fall würde man Gott zu den Qualitäten der Schöpfung herabziehen, weil ja das Gewordene mit Gott gleichartig wäre. Im zweiten Fall würde statt dessen neben die göttliche (aus Ber.: lies: „die göttliche“ statt „der göttlichen“) Substanz eine materielle Natur gestellt, welche, weil nicht geworden, in bezug auf ewige Existenz Gott gleich käme, wie denn sowohl die Manichäer solchem Wahne huldigten, und einige andere, durch die griechische Philosophie zu den gleichen Anschauungen verführt, diese Phantasterei als Lehrsatz verkündeten.“</p><p>„Um den beiden genannten Ungereimtheiten in der Untersuchung des Seienden zu entgehen, wollen wir nach dem Beispiele des Apostels die Frage über das Wie des Entstehens der geschaffenen Dinge nicht näher erörtern und nur im Vorübergehen bemerken, daß der göttliche Willensakt, sobald er es will, die Wirklichkeit herbeiführt und daß das Gewollte sofort Natur und Wesen gewinnt, da die Allmacht nichts von dem, was sie in ihrer Weisheit und Gestaltungsfähigkeit will, unverwirklicht läßt; die Existenz des Gewollten ist Wesen (d. h. wohl: das von Gott Gewollte gewinnt dadurch Existenz, daß es eine Wesenheit bekommt).“</p><p>„Nun scheidet sich die Welt in zwei Hälften, in eine geistige und in eine körperliche. Die Schöpfung der geistigen Welt scheint allerdings der unkörperlichen göttlichen Natur nicht unähnlich zu sein, sondern vollkommen zu entsprechen, indem sie Unsichtbarkeit, Unbetastbarkeit und Ausdehnungslosigkeit aufweist, also Eigenschaften, welche man ohne die Gefahr eines Irrtums auch der allerhabenen Natur zuschreiben muß. Die Welt des Körperlichen aber zeigt Eigenschaften, welche Gott sicher nicht hat und infolgedessen erheben sich große Schwierigkeiten für unsere Vernunft, die nicht einzusehen vermag, wie aus dem Unsichtbaren das Sichtbare hervorgehen konnte, aus dem Unbetastbaren das Feste und Starre, aus dem Unbegrenzten das Begrenzte, aus dem jede Quantität und Größe Entbehrenden das, was in eine seiner Quantität entsprechenden Größe eingeschlossen ist, und was wir sonst noch alles an der körperlichen Natur wahrnehmen. Angesichts dieser Schwierigkeit wollen wir bemerken: keine von den Eigenschaften des Körpers ist selbst etwas Körperliches, weder Gestalt noch Farbe noch Schwere noch Ausdehnung noch sonst eine zu den Eigenschaften gehörige Bestimmung, sondern jede dieser Eigenschaften ist ein Begriff und ihre Vereinigung und Verbindung macht den Körper aus. Da also alle Eigenschaften, welche den Körper ausmachen, mit dem Geiste und nicht mit den Sinnen erfaßt werden, Gott aber Geist ist, welche Schwierigkeit könnte demnach für den Geist bestehen, geistige Bestimmungen zu bewirken, deren Verbindung die Natur des Körpers ausmacht. Doch dies sei nur nebenher untersucht.“</p><p>„Die Hauptfrage aber lautete: Wenn die Seelen nicht schon vor den Leibern existieren, wann und wie entstehen sie dann? Und deshalb ist unsere Darlegung auf die Frage nach dem Wie nicht näher eingegangen, weil das Ergebnis unsicher ist; doch der andere Punkt, nämlich wann die Seelen ihre Existenz gewinnen, harrt noch der Untersuchung, weil er in engem Zusammenhang mit dem früher Besprochenen steht. Würde nämlich eingeräumt, die Seele lebe bereits vor dem Körper in irgendeinem Zustande, so müßten wir notwendig auch die Phantasterei jener annehmen, welche die Seelen der Sünde wegen in Körper einkerkern. Daß aber auf der anderen Seite die Entstehung der Seele etwa später erfolge und jünger sei als die Bildung der Körper, wird wohl auch kein Verständiger sich einfallen lassen, da doch allen klar sein dürfte, daß Seelenloses weder Kraft zum Wachstum noch Beweglichkeit besitzen kann, während es keinem Zweifel und keiner Frage unterliegt, daß das Kind im Mutterleib sowohl örtlicher Bewegung als auch des Wachstums fähig ist, wie es auch Nahrung zu sich nimmt. Daraus folgt, daß wir nur eine gleichzeitige Entstehung für Seele und Leib annehmen. Und wie die Erde den Wurzelschößling, den sie von den Landleuten empfängt, zum Baume gestaltet, nicht als ob sie in den Schößling die* Kraft* zum Wachstum legen würde, sondern weil sie ihm die Wachstums<em>mittel</em> bietet, so sagen wir auch, das vom Menschen zur Pflanzung eines Menschen Abgetrennte sei ein Lebewesen, ein Beseeltes vom Beseelten, ein Nahrung Empfangendes von einem, der Nahrung empfangen hat. Freilich, wenn die Winzigkeit des Ablegers nicht sofort alle Tätigkeiten und Bewegungen der Seele zuläßt, so können wir uns hierüber nicht wundern. Denn der Weizen, der schon im Samen vorhanden ist, erscheint nicht sogleich als Ähre ― wie könnte so Großes in so Kleines gehen? ― sondern indem die Erde ihn durch entsprechende Zufuhr nährt, wird der Weizen zur Ähre, nicht als ob er in der Scholle seine Natur vertauschte, sondern weil er durch die Nahrung sich selbst entfaltet und vollendet. Gleichwie also bei dem Pflanzensamen der Keim allmählich bis zur Vollendung fortschreitet, auf dieselbe Weise kommt auch bei dem Werden des Menschen die Seele nach Maßgabe der körperlichen Größe zur Geltung, indem sie zuerst dem Kinde, das sich im Mutterleib befindet, der Nähr- und Wachskraft nach innewohnt, dann aber, wenn es das Tageslicht erblickt, ihm auch das Empfindungsvermögen verleiht, hierauf endlich, wenn es schon größer geworden, in ihm die Denkkraft einigermaßen hervortreten läßt, jedoch nicht auf einmal in ihrer ganzen Fülle, sondern fortschreitend in Übereinstimmung mit der Zunahme des Schößlings. Da nun der aus beseelten Wesen zur Bildung eines beseelten Wesens abgelöste Keim nicht tot sein kann (denn der Zustand des Todes tritt durch Beraubung der Seele ein, und keineswegs geht die Beraubung dem Besitze voraus), so erkennen wir hieraus, daß das aus beiden d. i. aus Seele und Leib bestehende Gebilde einen gleichzeitigen Eintritt ins Dasein hat, so daß weder jene (d. i. die Seele) vorausgeht, noch dieser (d. i. der Leib) nachfolgt.“</p><p>„Einen Stillstand in der Vermehrung der Seelen aber erkennt die Vernunft als notwendig im voraus, damit das Menschengeschlecht nicht fortwährend im Flusse sei, indem es durch Zunahme immer weiter sich ergießen und niemals in der Bewegung nachlassen würde. Dieser Stillstand, der nach unserer Ansicht für unsere Natur dereinst notwendig eintreten wird, wird durch die Erwägung begründet, daß, wenn die übrige gesamte geistige Natur in ihrer Vollzahl dasteht, füglich auch unsere Menschennatur einmal zum Abschluß gelangen muß ― denn sie ist auch hierin der göttlichen verwandt ― damit sie nicht immer den Eindruck der Unvollständigkeit mache; denn der fortwährende Zuwachs gibt Anlaß zu solcher Anschuldigung. Wenn also die Menschheit ihre volle Zahl erreicht hat, wird die flußartige Bewegung der Natur stillstehen, weil sie zu dem ihr gesetzten Ziel gelangte; dann wird ein anderer Zustand auf das Leben folgen, ganz verschieden von dem jetzigen, der in beständigem Entstehen und Vergehen verläuft. Denn wenn keine Menschen mehr entstehen, können auch keine mehr vergehen, wenn nämlich die Verbindung von Seele und Leib ― wir verstehen darunter den Lebensanfang durch die Zeugung ― der Auflösung vorausgeht, so folgt daraus, daß, wenn keine Verbindung vorausgeht, auch keine Auflösung nachfolgen kann. Demnach führt uns die logische Betrachtung unseres Glaubenssatzes zur Annahme eines stillstehenden und ewigen Lebens nach dem Tode, in welchem nicht Werden und Vergehen miteinander abwechseln.“§ 16. Schriftbeweise für die Auferstehung.</p><p>Da nun nach diesen Ausführungen der Lehrerin ihre Darlegung nach Ansicht der meisten Anwesenden zu einem passenden Abschluß gekommen schien, ich aber fürchtete, es möchte, wenn die Krankheit einen Ausgang für die Leidende nehme, wie sie ihn dann wirklich genommen, niemand mehr vorhanden sein, der die Einwürfe der Ungläubigen gegen die Auferstehung zurückweisen könnte, so sagte ich: „Gerade den Hauptpunkt in der Erörterung über unseren Glaubenssatz hat deine Rede noch nicht berührt. Die Heilige Schrift erklärt sowohl in der alten als auch in der neuen Unterweisung, jedenfalls werde einmal, nachdem unsere Natur nach einer gewissen Ordnung und Folge die periodische Bewegung der Zeit durchlaufen habe, dieser flußartige, in der Aufeinanderfolge der Nachkommen fortschreitende Kreislauf zwar stillstehen; aber es werde dann, wenn die Vollendung des Alls weder Zuwachs noch Vermehrung gestattet, die gesamte Menge der Seelen aus der Unsichtbarkeit und der Vereinsamung (vom Körper) zur Vereinigung (mit den Leibern) und zur Sichtbarkeit zurückkehren, indem die nämlichen Elemente in der nämlichen Verbindung wieder zusammentreten. Diese Wiederherstellung des Lebens wird von der göttlichen Schriftlehre ‚Auferstehung‘ genannt, welcher Name zugleich mit der Aufrichtung des todhaften Bestandteiles der Menschen auch die gesamte Bewegung der Elemente bezeichnet.“</p><p>„Was ist denn“, sprach sie, „in den bereits gegebenen Darlegungen unberührt geblieben?“ „Die Lehre von der Auferstehung“, antwortete ich. Darauf erwiderte, sie: „Gar vieles von dem, was ich ausführlich behandelte, führt auf dieses Ziel hin.“</p><p>Doch ich erklärte: „Weißt du denn nicht, was für ein Schwarm von Einwendungen gegen diese unsere Hoffnung von den Gegnern vorgebracht wird?“ Dabei machte ich auf alles aufmerksam, was die Gegner gewöhnlich anführen, um unsere Lehre von der Auferstehung zu widerlegen.</p><p>Da fuhr sie in der Belehrung also fort: „Wie mir scheint, müssen wir das, was die Heilige Schrift an verschiedenen Orten über diese Glaubenslehre verkündigt, kurz durchgehen, damit wir von dort her den Schlußstein für unsere Unterredung nehmen. Da höre ich denn die Stimme Davids in seinen göttlichen Liedern ertönen, in denen er die wunderbare Ordnung des Weltalls zum Gegenstand seines lobpreisenden Gesanges macht und am Schluß des Psalmes 103 [hebr. Ps. 104] also ausruft: Du nimmst weg ihren Odem, und sie vergehen und kehren zurück in Staub; du sendest aus deinen Odem, und sie werden geschaffen, und du erneuerst das Angesicht der Erde! ― Mit diesen Worten will er sagen, daß die allenthalben wirksame Kraft des göttlichen Odems (oder Geistes) einerseits diejenigen belebe, in die er kommt, andererseits jene des Lebens beraube, die er verläßt. Da er also mit der Entfernung des Odems den Untergang der Lebenden, mit dessen Eintritt dagegen die Erneuerung der Untergegangenen erfolgen läßt, und da in der dabei eingehaltenen Reihenfolge der Untergang der Erneuerung vorausgeht, so liegt darin die Ankündigung des Auferstehungsgeheimnisses, indem David im prophetischen Geiste der Kirche diese Gnade voraussagte.“</p><p>„Aber auch anderswo sagt derselbe Prophet: „Der Gott des Alls, der Herr alles Seienden, hat angeordnet das Fest unter den Bedeckenden“ (Ps. 117, 27 [hebr. Ps. 118, 27]); durch den Ausdruck „Fest unter den Bedeckenden“ bezeichnet er das Laubhüttenfest, welches seit alter Zeit von der Überlieferung des Moses her eingesetzt war. Der Gesetzgeber wies damit prophetischen Geistes auf Zukünftiges hin, auf etwas, was aber immer stattfindend dennoch nicht stattfand; denn diejenigen Feste, welche stattfanden, waren lediglich Gleichnisse, welche die Wahrheit im voraus anzeigten; das wahre Laubhüttenfest jedoch ward noch nicht begangen. Denn nach dem prophetischen Worte hat Gott, der Herr aller Dinge, diese Anordnung getroffen, um anzudeuten, daß er für die ganze Menschheit den Hüttenbau unserer zerstörten Behausung (des zerstörten Leibes) herstellen werde; denn der Ausdruck „Bedeckung“ bezeichnet seiner Bedeutung nach das Kleid und den Kleiderschmuck. Das Psalmenwort aber lautet also: „Der Herr erschien uns, um anzuordnen ein Fest unter Bedeckenden bis an die Hörner des Altars.“ Sinnbildlich aufgefaßt bezieht sich diese Weisung auf ein Fest für die ganze vernünftige Schöpfung, bei dem die Geringeren mit den Vornehmen einträchtig im Festzug der Guten einherziehen. Wegen der typischen Bedeutung der Tempeleinrichtung war nämlich der Übertritt von der äußeren Umgebung in das Innere nicht allen gestattet, sondern Heiden und Fremden blieb der Zutritt verwehrt und auch denen, welche zugelassen waren, stand der Zugang in das Innere nicht gleichmäßig offen, sondern nur jenen, welche durch einen reineren Wandel und durch gewisse Besprengungen sich geheiligt hatten; aber selbst diese durften nicht ausnahmslos das Innerste des Tempels betreten, sondern nur den Priestern war die gesetzliche Erlaubnis gewährt, zur Erfüllung ihres Opferdienstes hinter den Vorhang zu treten; jedoch sogar den Priestern hinwiederum blieb das Verborgene und Allerheiligste, wo der mit hörnerartigen Vorsprüngen verzierte Opferaltar stand, unzugänglich mit Ausnahme einzig des Hohenpriesters, der es nur einmal während des Jahres an einem bestimmten Tage betrat, um dort allein ein geheimnisvolleres und mystischeres Opfer darzubringen. Durch diese so große Verschiedenheit im Tempel, welche ein Bild und Gleichnis der geistigen Verfassung war, will die körperliche Observanz lehren, daß nicht die gesamte vernünftige Natur dem Tempel sich naht, d. h. dem Bekenntnis des großen Gottes, vielmehr jene, welche zu einem falschen Glauben abgeirrt sind, außerhalb des eingehegten göttlichen Raumes stehen, aber auch, daß unter den auf ihr Bekenntnis hin Eingelassenen, die durch Besprengungen und Heiligungen Gereinigten eine größere Ehre genießen und von diesen wiederum die Geweihten einen Vorzug haben, so daß sie der Einführung in die innersten Geheimnisse gewürdigt werden. Um den Sinn des vorgeführten Typus noch deutlicher zu machen, wollen wir daraus als durch die Schrift gegeben noch die Lehre ziehen, daß von den vernunftbegabten Kräften einige gleichsam als heiliger Opferaltar im Allerheiligsten vor Gott hingestellt sind, unter diesen aber manche wie die Altar-Hörner hervorragen; andere wieder sehen wir um jene herum in einer bestimmten Ordnung und Reihenfolge den ersten und zweiten Rang einnehmen.“</p><p>„Das Menschengeschlecht aber wird wegen der Sünde, in die es gefallen, aus der Umgebung Gottes verstoßen; aber es kann wieder den Zutritt hiezu erlangen, wenn es sich durch das Besprengungsbad (Taufe) gereinigt hat. Aber da diese trennenden Schranken, durch welche die Sünde uns von dem Geheimnisvollen hinter dem Vorhang trennt, dereinst fallen sollen, so wird, sobald unsere Natur wie ein Gezelt bei der Auferstehung wieder hergestellt und das gesamte durch die Sünde über uns gekommene Verderben beseitigt ist, alsdann ein gemeinsames Fest mit Gott als Mittelpunkt für alle veranstaltet, welche durch die Auferstehung „bedeckt“ wurden, damit allen ein und dieselbe Wonne zuteil werde und keine Verschiedenheit mehr die vernünftigen Geschöpfe bei dem Genuß des nämlichen Glückes trenne, sondern auch die der Sünde wegen jetzt noch Außenstehenden in das Allerheiligste der göttlichen Seligkeit eintreten dürfen und mit den Hörnern des Altars d. h. mit den hohen überirdischen Mächten vereinigt werden. Das nämliche spricht der Apostel ganz deutlich aus, wenn er, um den Zusammenklang des Universums dem Guten gegenüber auszudrücken, lehrt: „Jegliches Knie wird sich vor ihm beugen, derer, die im Himmel, auf Erden und unter der Erde sind, und jede Zunge soll bekennen, daß Jesus Christus der Herr ist zur Ehre Gottes des Vaters“ (Phil. 2, 10). Statt von Hörnern des Altares spricht der Apostel von Engeln und Himmlischen; seine anderen Ausdrücke beziehen sich auf die Geschöpfe, welche jenen begriffsmäßig nachstehen d. h. auf uns Menschen; sie alle führt* ein* Fest in voller Eintracht zusammen. Als Fest können wir aber das Bekenntnis und die Erkenntnis Gottes betrachten, dem wahrhaftiges Sein zukommt.“</p><p>„Es lassen sich aber“, fuhr sie fort, „noch viele andere Stellen der Heiligen Schrift auffinden, welche die Lehre von der Auferstehung stützen und beweisen. So versetzt sich Ezechiel, die Zeit, die uns davon noch trennt, im prophetischen Geiste überfliegend, vermöge der Kraft des Vorausschauens in die Stunde der Auferstehung selbst und die Zukunft so erblickend, als wenn sie schon gegenwärtig sei, führt er sie deutlich in seiner Schilderung vor Augen (Ezech. 37, 1). Er sah nämlich ein großes, unendlich weit sich ausdehnendes Feld und auf demselben eine Unzahl von wirr durcheinander geworfenen Gebeinen; von göttlicher Macht ergriffen, fingen diese an, sich alsbald zu den ihnen zugehörigen und verwandten Teilen hinzubewegen, wuchsen der natürlichen Verbindung entsprechend zusammen und bedeckten sich dann mit Sehnen und Fleisch und Haut (was der Psalm „Bedeckung“ nennt); der Geist belebte und erhob dann alles, was dagelegen war. Was soll ich noch die Schilderung anführen, die uns der Apostel von den Wundern der Auferstehung entwirft und die ja allen überall zur Hand ist, wie es dort heißt, „auf ein Machtgebot und auf den Schall der Posaune werde in einem Augenblick alles Gestorbene und Daliegende in den Zustand unsterblicher Natur umgewandelt“ (1 Thess. 4, 15). Auch die Aussprüche des Evangeliums dürfen wir übergehen, da sie ohnehin allen bekannt sind; denn nicht bloß mit Worten sagt der Herr, daß die Toten auferstehen werden, sondern er bewirkt tatsächlich die Auferstehung selbst, wobei er mit Wundern beginnt, die uns näher zu liegen und weniger unglaublich zu sein scheinen. Seine lebendig machende Kraft zeigt er nämlich zuerst an Totkranken, die er durch die Macht seines Wortes von ihren Leiden befreit. Hierauf erweckt er das eben verstorbene Mädchen; darauf läßt er den Jüngling, der bereits zur Grabstätte gebracht wird, von der Bahre aufstehen, um ihn seiner Mutter zurückzugeben; dann ruft er den Lazarus, der schon vier Tage im Grabe gelegen war, aus demselben lebend hervor, nachdem er ihn durch sein lautes Befehlswort wieder zum Dasein gebracht hatte; endlich erweckte er seinen eigenen Menschenleib, von Nägeln und Lanze durchstochen, am dritten Tage wieder zum Leben und zwar so, daß er gerade zum Beweis der Auferstehung die Male der Nägel und die Wunde der Lanze an sich trug. Doch nach dieser Seite glaube ich, nichts weiter anführen zu müssen, da hierin kein Zweifel bei denen besteht, welche die Schriften anerkennen.“§ 17. Einwände gegen die Auferstehung.</p><p>„Allein das war nicht der Fragepunkt,“ wendete ich ein, „denn die Tatsache, daß die Auferstehung dereinst erfolgen und der Mensch vor einem unbestechlichen Gerichtshof erscheinen werde, dürften auf Grund der Schriftbeweise und der bereits gegebenen Erwägungen die meisten anerkennen, die sie hörten. Dagegen sollte noch die Frage untersucht werden, ob das Leben, auf das wir in der Zukunft hoffen, dem jetzigen ähnlich sein werde. Wenn dies der Fall wäre, so sollten, möchte ich sagen, die Menschen die Hoffnung auf eine Auferstehung von sich werfen. Wenn nämlich die menschlichen Leiber in dem nämlichen Zustande, in welchem sie am Ende des Lebens sich gerade befanden, wieder ins Leben zurückgerufen werden, so würde den Menschen durch die Auferstehung ein Unglück ohne Ende in Aussicht stehen. Denn welch kläglicheren Anblick könnte es geben, wenn die von hohem Alter gekrümmten Leiber wieder in Häßlichkeit und Ungestalt auferweckt würden, mit einem Fleisch, das durch die Zeit zusammenschrumpfte, und mit einer Haut, die runzelig geworden und bis an die Knochen verdorrt war. Denn, wenn die Sehnen, sobald sie nicht mehr durch die natürliche Feuchtigkeit geschmeidig erhalten werden, sich zusammenziehen und infolgedessen der ganze Körper gekrümmt wird, so bietet sich uns ein ungefüger und bedauernswerter Anblick dar, in dem der Kopf in der Richtung nach den Knien niedergebeugt ist und die Hände zu beiden Seiten in steter unwillkürlich zitternder Bewegung sind, weil sie zu ihrer naturgemäßen Tätigkeit unfähig wurden. Um ein anderes Beispiel anzuführen, wie sind die Leiber von durch langwierige Krankheit aufgezehrten Menschen beschaffen, die sich von bloßen Knochengerippen nur dadurch unterscheiden, daß sie noch von einer spröden, dünnen Haut bedeckt sind? Und wie sehen die Leiber der von Wassersucht Angeschwollenen aus? Und vollends die Leiber der vom Aussatz Befallenen, welche Rede könnte ihre schreckliche Verunstaltung schildern, wie die immer mehr um sich greifende Fäulnis allmählich sämtliche organische Glieder und Sinneswerkzeuge anfrißt! Oder was soll man von denen sagen, welche durch Erdbeben, im Krieg oder durch sonst einen widrigen Zufall verstümmelt wurden und nachher noch eine Zeitlang in ihrem Elende weiterlebten? Was von denen, die von Geburt aus an dem einen oder anderen Gliede verkrüppelt sind und so aufwachsen müssen? Welche Vorstellung sollen wir uns dann von den Kindern machen, die ausgesetzt oder erstickt werden oder auch so sterben? Werden sie bei der Auferstehung in der Kindheit verbleiben ― was wäre trauriger als so etwas ― oder aber werden sie in ein höheres Alter versetzt? Mit welcher Milch wird die Natur sie alsdann ernähren?“</p><p>„Mithin stellt sich, falls wir genau mit dem nämlichen Leib auferstehen, unsere Hoffnung als ein Elend dar, oder aber wenn es nicht der nämliche Leib ist, so wird der auferstandene ein anderer sein als der tote. Denn wenn jemand als Kind stirbt und als Erwachsener aufersteht oder umgekehrt, wie kann man noch sagen, der nämliche, der gestorben, sei auferweckt worden, da doch hinsichtlich des Alters der Verstorbene von dem Auferstandenen sich so sehr unterscheidet? Falls man statt eines Kindes einen Mann oder statt eines Greises einen Jüngling sieht, so sehen wir eben an Stelle des einen einen ganz anderen. Das gleiche ist der Fall, wenn man statt eines Gekrümmten einen Aufrechtstehenden sieht oder statt eines Ausgezehrten einen Wohlbeleibten usw., um nicht durch Aufzählung aller Einzelheiten lästig zu werden. Wenn demnach der Leib nicht so aufersteht, wie er beschaffen war, als er mit der Erde vermischt wurde, so wird nicht der Verstorbene auferstehen, sondern die Erde wird wiederum zu einem neuen Menschen gebildet werden. Was kümmert mich alsdann die Auferstehung, wenn statt meiner ein anderer auferstehen wird! Und wie soll ich mich als mich selbst anerkennen, wenn ich mich nicht in mir sehe? Denn ich würde tatsächlich nicht ich sein, wenn ich nicht in allen Stücken mit mir selbst identisch wäre. Denn wenn ich z. B. das Bild jemands, wie er in diesem Leben war, im Gedächtnis hätte, etwa daß er dünnhaarig, dicklippig, stumpfnasig, blaßfarbig, blauäugig, weißköpfig und voll Runzeln war, und träfe nun, während ich den soeben Beschriebenen suchte, einen Jüngling mit vollem Haar, mit Adlernase, dunkler Hautfarbe und so in allen übrigen Eigenschaften seines Aussehens verschieden, werde ich diesen für jenen ansehen?“</p><p>„Was soll ich mich aber bei diesen mehr untergeordneten Bedenken aufhalten und gerade die ernstesten beiseite lassen? Denn wer wüßte nicht, daß die Natur des Menschen einem Strome gleicht, weil sie von der Geburt bis zum Tode in steter Bewegung sich befindet und dieselbe erst einstellt, wenn sie ihr Sein aufgibt? Diese Bewegung ist keine solche von einem Ort zum anderen ― denn die Natur geht nicht aus sich selbst heraus ― sondern sie besteht in einer Veränderung, die sich beständig an ihr selbst vollzieht. Die Veränderung aber läßt den hier in Betracht kommenden Körper während seiner ganzen Existenz niemals auf der nämlichen Stufe verharren (denn wie könnte das, was sich stets verändert, imstande sein, sich gleich zu bleiben), sondern wie die Flamme der Lampe dem Aussehen nach zwar immer dieselbe zu sein scheint (denn die Stetigkeit ihrer Bewegung ruft den Eindruck hervor, als ob sie, ohne je zu wechseln, immer die nämliche wäre), in Wahrheit aber immerwährend sich ablöst und niemals die gleiche ist (denn sobald Flüssigkeit durch die Hitze aufgesogen ist, wird sie zwar in eine Flamme, aber zugleich auch, indem sie brennt, in Dampf verwandelt, und so wird durch die Kraft der Umwandlung das Emporzüngeln der Flamme bewirkt, welche dann ihrerseits allen verbrennbaren Stoff sofort in Dampf umsetzt) ― wie man nun die Flamme nicht zweimal an derselben Stelle berühren kann (denn der unaufhörliche Verwandlungsprozeß der Flamme setzt nicht aus, um eine zweite Berührung zu ermöglichen, auch wenn sie noch so rasch auf die erste folgt), sondern die Flamme immer erneuert und verjüngt wird, weil stets neu geboren und sich ablösend, so daß sie niemals auf demselben Punkte bleibt: etwas Ähnliches findet auch hinsichtlich der Natur unseres Körpers statt; denn der Zu- und Abfluß, der durch den Verwandlungsprozeß in unserer Natur vor sich geht, ruht niemals und wird erst stillestehen, wenn das Leben erlischt. Solange aber das Leben andauert, kennt die Natur unseres Körpers keinen Stillstand; denn fortwährend füllt oder entleert sie sich oder sie vollzieht beide Prozesse zugleich. Wenn man also nicht einmal heute mehr derjenige ist, der man gestern war, sondern in einen anderen sich verwandelt, so wird, wenn die Auferstehung unseren Leib zum Leben zurückführt, jeder einzelne von uns sozusagen zu einem förmlichen Volk von Menschen, so daß kein Volksteil fehlt; nicht der Embryo, nicht der Säugling, nicht der Knabe, nicht der Jüngling, nicht der Mann, nicht der Vater, nicht der Greis, überhaupt keine der menschlichen Altersstufen.“</p><p>„Wenn ferner sowohl die Keuschheit als die Unkeuschheit im Fleische geübt wird, wenn dann sowohl jene, welche des Glaubens wegen heftige Schmerzen aushalten, als auch jene, die hiefür zu weichlich waren, die beiderseitige Handlungsweise aber auf das innigste mit Sinnesempfindung verbunden war, in welcher Weise soll da Auferstehung erfolgen, damit der Gerechtigkeit zum Siege verholfen werde? Oder wenn ein Mensch jetzt zwar sündigt, später aber durch Reue sich reinigt, hierauf jedoch abermals in Sünde zurückfällt, und wenn nach dem Laufe der Natur sowohl der befleckte als der unbefleckte Leib sich umwandelt und keiner von ihnen fortwährend verharrt, was für ein Leib wird dann mit dem Zuchtlosen gezüchtigt werden? Etwa der, welchen er hatte, als er dem Tode nahe war, und der im Alter zusammenschrumpfte? Allein das wäre ein anderer als jener, der gesündigt hatte! Oder aber der, der durch Leidenschaft befleckt ward? Aber wo bliebe dann der Greis? Denn entweder wird dieser nicht auferstehen und somit die Auferstehung für ihn wertlos sein, oder aber er wird auferstehen, dann wird der schuldige Leib der Strafe entgehen!“</p><p>„Soll ich noch einen anderen Einwand nach dem Sinne derer vorbringen, welche die Lehre von der Auferstehung nicht annehmen? Wie allgemein zugestanden wird, ist jedem Glied unseres Körpers von Natur aus eine bestimmte Tätigkeit zugewiesen. Die einen haben den Körper am Leben und in seiner Kraft zu erhalten, so daß wir ohne dieselben nicht weiter leben könnten wie Herz, Lunge, Leber, Gehirn, Magen und ähnliche Eingeweide, andere sind für die Sinnestätigkeit bestimmt, wieder andere für die Arbeit und zur Bewegung, während andere zur Weitergabe des Lebens an die Nachfolgenden nötig sind. Wenn nun das zukünftige Leben mit Hilfe dieser Körperteile geführt werden muß, so hat die Auferstehung keinen Zweck; ist aber die Schriftstelle wahr, wie sie es in der Tat ist, die da uns belehrt, daß im Leben nach der Auferstehung weder Ehe geschlossen noch Speise und Trank genossen werden, wozu braucht man dann noch die betreffenden Glieder, da die Aufgaben, denen sie jetzt dienen, in jenem Leben in Wegfall kommen? Denn wenn zum Zwecke der Ehe die für dieselbe bestimmten Glieder vorhanden sind, so haben wir sie durchaus nicht mehr nötig, weil es alsdann keine Ehe mehr gibt. Desgleichen sind die Hände zur Arbeit, die Füße zum Gehen, der Mund zur Aufnahme von Speise, die Zähne zum Mitwirken bei der Ernährung, die Eingeweide zur Verdauung, die abführenden Kanäle zur Fortschaffung der verbrauchten Stoffe bestimmt; wenn es nun diese Verrichtungen und Dinge nicht mehr gibt, wie und wozu sollten dann die für sie in Betracht kommenden Körperteile noch vorhanden sein? Wenn demnach der Körper keines von den Gliedern besitzt, welche dort zur Führung des Lebens durchaus überflüssig wären, so folgt daraus, daß wir gar keines von den Gliedern mehr haben, welche hienieden den Körper in seiner Vollständigkeit bilden (denn ganz anders verläuft dort das Leben). Niemand wird aber so etwas Unsterblichkeit nennen, wenn sämtliche Glieder, weil für jenes Leben völlig unbrauchbar, mit dem Körper nicht auferstehen. Wenn dagegen die Kraft der Auferstehung sich auf all diese Glieder erstreckt, so müssen wir von Gott, der die Auferstehung bewirkt, annehmen, daß er uns bei der Auferstehung ganz überflüssige und für jenes Leben völlig unbrauchbare Dinge gibt.“</p><p>„Trotz alledem sind wir verpflichtet, zu glauben, daß die Auferstehung erfolge, und auch, daß sie nicht unnütz sei. Wir müssen daher auf die Erörterung allen Fleiß verwenden, damit wir dafür eintreten können, daß der Glaubenssatz von der Auferstehung in allen Stücken wohl begründet sei.“§ 18. Widerlegung</p><p>Auf diese meine Einwendungen antwortete die Lehrerin also: „Nach den Regeln der Rhetorik hast du einen kräftigen Angriff auf die Lehre von der Auferstehung unternommen und sie mit Einwänden bestürmt, welche die Wahrheit scheinbar niederzureißen drohen, so daß weniger Unterrichtete hinsichtlich des Geheimnisses in Zweifel gestürzt und zur Meinung gebracht werden könnten, die Einwände wären nicht ohne Grund gemacht worden. In Wirklichkeit aber ist die Wahrheit nicht gefährdet, selbst wenn wir nicht imstande sind, mit gleicher Gewandtheit zu erwidern. Vielmehr liegt die Wahrheit hierüber in den verborgenen Schatzkammern der Weisheit gut verwahrt, um dann offenbar zu werden, wenn uns die tatsächlich vollzogene Auferstehung selbst ihre Geheimnisse enthüllt und wir keine Worte mehr nötig haben, um die Berechtigung unserer Hoffnung zu erweisen. Gleichwie Schlaflose nächtlicherweile über die Pracht des Sonnenglanzes hin und her reden mögen, das Aufleuchten der Strahlenpracht aber jede Schilderung in Worten sofort überflüssig macht, so wird uns der Augenblick, wo wir die Auferstehung am eigenen Leib erfahren, alle Mutmaßungen als vergeblich erscheinen lassen, denen wir uns jetzt über unsere Wiederherstellung hingeben. Dennoch dürfen wir die vorgebrachten Einwände nicht ganz unerörtert lassen; daher wollen wir die Untersuchung über sie in folgender Weise aufnehmen:</p><p>In erster Linie wollen wir Zweck und Ziel der Auferstehungslehre überprüfen und die Absicht untersuchen, in welcher sie von der Heiligen Schrift verkündet und von uns geglaubt wird. Um sie also in der Form einer Begriffsbestimmung etwas zu umschreiben, wollen wir uns dahin ausdrücken, daß die Auferstehung die Zurückführung unserer Natur in jenen Zustand ist, den sie anfangs hatte. In dem ursprünglichen Zustand aber, dessen Schöpfer Gott selbst war, gab es weder Greisenalter noch Kindheit, weder Krankheiten noch Schwachheiten noch sonstwie körperliches Elend (denn billig war es, daß Gott dergleichen nicht schuf), sondern ein göttlich Ding war die Menschennatur, ehe das Menschengeschlecht sich zum Bösen verleiten ließ; als aber die Sünde ihren Einzug hielt, brachen alle jene Übel über uns herein. Darum sollte ein Leben, das sich frei von Sünde hält, auch den Folgen der Sünde nicht unterworfen sein. Denn wie die in kalten Gegenden Reisenden leicht von Frost befallen werden, dagegen die in Sonnenglut Wandernden bald gebräunte Hautfarbe bekommen, beide aber, wenn sie weder der Kälte noch der Hitze ausgesetzt sind, sowohl des Frierens als auch der braunen Farbe los werden und niemand bei dem Fehlen der Ursache von letzterer noch eine Wirkung erwartet, so ist unsere Natur, seitdem sie sich den Leidenschaften preisgegeben hat, in die Folgen derselben verstrickt worden; wenn sie jedoch zur Glückseligkeit zurückkehrt, wo die Leidenschaft nicht mehr herrscht, so ist sie auch den Folgen der Sünde nicht mehr ausgesetzt. Da nun alles, was der menschlichen Natur aus dem unvernünftigen Leben beigemischt ist, nicht eher in uns eintrat, als bis das Menschengeschlecht in die Sünde wegen seiner Leidenschaftlichkeit verfiel, so werden wir, wenn wir die Sündhaftigkeit hinter uns lassen, auch ihr ganzes Gefolge gleichfalls hinter uns lassen. Infolgedessen liegt kein vernünftiger Grund vor, daß wir fürchten müßten, in jenem Leben würden wir etwas von den Übeln antreffen, welche uns hier der Sünde wegen heimsuchen. Denn wie jemand, sobald er seinen zerrissenen Rock ausgezogen hat, die durch letzteren verursachte Verunstaltung nicht mehr an sich erblickt, so wird, wenn wir dieses häßliche Totengewand, das aus Tierfellen gefertigt uns angelegt wurde ― unter dem Tierfell ist die Gestalt der unvernünftigen Natur, des Tieres, zu verstehen, mit welcher wir seit unserer Hingabe an die Leidenschaft umkleidet sind ―, ausgezogen haben, jedes Stück dieses uns einhüllenden Tierfelles mit dem Ablegen des Ganzen zugleich abgelegt. Was wir aber mit dem Tierfell überkommen haben, ist die Begattung, die Empfängnis, die Geburt, der Schmutz, die Mutterbrust, die Nahrung, die Entleerung, das bis zur Reife fortschreitende Wachstum, die Vollkraft, das Alter, die Krankheit, der Tod. Wenn wir nun das Tierfell nicht mehr tragen müssen, wie könnte dann noch etwas von dem an uns haften, was von jenem herrührt? Gerade deshalb, weil wir in jenem Leben einen ganz anderen Zustand erhoffen dürfen, so ist es nutzlos, Dinge, welche für jenes andersartige Leben gar nicht in Betracht kommen, gegen die Lehre von der Auferstehung ins Feld zu führen. Denn was hat Magerkeit und Dickleibigkeit, Auszehrung und Vollsäftigkeit und dergleichen Eigenschaften des vergänglichen Menschenkörpers mit jenem Leben zu tun, das von dem flußartig dahingleitenden und vorübereilenden Verlauf des irdischen Daseins vollständig verschieden ist.“</p><p>„Nur mit der* einen* Frage beschäftigt sich unsere Untersuchung über die Auferstehung, ob ein menschliches Wesen erzeugt und geboren ist, oder richtiger, wie das Evangelium sich ausdrückt, ob ein Mensch in die Welt geboren wurde (Joh. 16, 21). Andere Fragen, z. B. ob das Leben von langer oder von kurzer Dauer war, ob der Tod so oder so eintrat, würden nur unnützerweise in die Erörterung über die Auferstehung einbezogen werden. Denn welche Annahme wir auch machen möchten, die Sache wäre immer die gleiche, ohne daß durch die Verschiedenheit die Auferstehungslehre schwieriger oder leichter würde. Denn wer einmal angefangen hat zu leben, muß notwendigerweise fortleben, und ebenso notwendig muß die Auflösung, welcher der Körper durch den Tod anheimfällt, durch die Auferstehung wieder aufgehoben und gutgemacht werden. Aber die Art und Weise des Todes sowie die Zeit desselben, was haben diese Umstände mit der Auferstehung zu tun? Denn in ein ganz anderes Gebiet sind die Fragen über dergleichen Dinge einschlägig, wie etwa, ob jemand in Sinnesgenuß oder in Abtötung, in Tugend oder in Sünde, lobens- oder tadelnswert, in Leid oder in Freud sein Leben verbracht habe. Diese und ähnliche Fragen betreffen das Maß und die Art des Lebenswandels und gehen den Richter des Lebens an, dessen Sache es ist, nach Anlage, Gebrechen und Krankheit, nach Greisen- und Mannesalter und Jugend, nach Armut und Reichtum zu forschen und zugleich nach der Art und Weise, wie der Mensch in all diesen Lagen sich verhalten habe, ob recht oder unrecht, ob er viel Gutes oder Böses in langer Lebenszeit getan, oder ob er weder zu guten noch zu bösen Handlungen fähig ward, da sein Leben aufhörte, bevor seine Vernunft sich genügend entwickelte.“</p><p>„Wenn aber Gott die Natur des Menschen durch die Auferstehung zu ihrer ursprünglichen Beschaffenheit zurückführen will, so dürfte es wertlos sein, so zu sprechen und zu meinen, die Allmacht könnte durch Hindernisse, wie die vorgebrachten, irgendwie aufgehalten werden, ihr Ziel zu erreichen. Dieses Ziel geht nun dahin: Wenn einmal die Menschennatur in allen einzelnen Menschen dadurch ihre Vollendung gefunden hat, daß die einen bereits in diesem Leben von der Sünde sich reinigten, die anderen aber nach demselben in entsprechenden Zeiträumen im Feuer geläutert wurden, während die dritten die Unterscheidung von guten und bösen Handlungen gar nicht kennenlernten, dann will Gott allen ohne Ausnahme den Zutritt zu seinen Gütern gestatten, welche, wie die Schrift sagt, kein Auge gesehen, kein Ohr gehört und kein Verstand erfaßt hat (1 Kor. 2, 9). Dies bedeutet aber, wie mir scheint, nichts anderes als ein Eingehen in Gott selbst: denn das Gut, das weit über Auge und Ohr und Verstand hinausgeht, wird wohl nur das allerhöchste Wesen sein. Der Unterschied zwischen dem tugendhaften und sündhaften Leben wird sich im Jenseits hauptsächlich darin zeigen, daß man früher oder später zur Seligkeit gelangt, die wir erhoffen; denn die Dauer der Läuterung hängt von dem Maße ab, in welchem Böses in dem einzelnen vorhanden ist. Die Seelenkur will aber alles Böse tilgen; allerdings ohne Schmerz wird die Heilung nicht vor sich gehen, wie wir schon früher betont haben.“</p><p>„Die Nichtigkeit und Haltlosigkeit der vorgebrachten Einwände werden wir aber noch mehr einsehen, wenn wir einen Blick in die Tiefe der apostolischen Weisheit werfen. Den Korinthern nämlich, welche ihm vielleicht dieselben Bedenken vorhielten, welche die jetzigen Gegner erheben, um unseren Glaubenssatz zum Falle zu bringen, erklärt er unser Geheimnis und äußert sich dabei, ihren kecken Unverstand mit seinem Ansehen niederringend, also: Du wirst mich fragen: wie werden die Toten auferstehen und mit welchem Leibe hervorgehen? Du Tor! Was du säest, wird nicht lebendig, es sei denn, daß es zuvor abstirbt; und was du auch säest, du säest nicht schon den zukünftigen Leib, sondern nur ein Korn, wie etwa Weizen oder ein anderes Samenkorn, Gott aber gibt ihm einen Leib, wie es ihm gefällt“ (1 Kor. 15, 35 ff.). Hier scheint mir der Apostel jene zu zügeln, welche, die Beschränktheit ihrer Natur verkennend, die göttliche Macht nach ihrer eigenen Kraft beurteilen und wähnen, Gott vermöge nur soviel, als sich unser Menschenverstand vorstellen kann; was denselben übersteige, übersteige auch die Macht Gottes. Denn durch seine Frage: Wie können die Toten auferstehen? verrät der Gegner die Meinung, es sei unmöglich, daß die zerstreuten Bestandteile des menschlichen Körpers sich wieder vereinigen würden; und da dies einerseits unmöglich sei, andererseits es einen anderen Körper außer dem durch Wiedervereinigung der Urstoffe gebildeten weiter nicht geben könne, so schließt er wie ein gewandter Dialektiker folgerichtig seinen Einwand mit der ferneren Frage: „Wenn der Leib sich als eine Verbindung von Elementen darstellt, diese Verbindung aber unmöglich ist, welchen Leib sollen dann die Auferstehenden haben? ― Dieses scheinbar recht geschickt gefertigte Gewebe nennt Paulus aber eine Torheit von solchen, welche auch sonst in der Schöpfung die Überschwänglichkeit der göttlichen Macht nicht sehen wollen. Indem er nämlich die handgreiflicheren Wunder Gottes, durch welche er die Zuhörer leicht in Verlegenheit hätte bringen können, absichtlich übergeht, wie die Beschaffenheit und den Ursprung der Himmelskörper, der Sonne, des Mondes und der Sterne, widerlegt er mit Hilfe uns ganz geläufiger und gewöhnlicher Vorgänge alle die törichten Einwände. Belehrt dich, sagt der Apostel, denn nicht der Ackerbau, daß ein Tor ist, wer den Maßstab seiner Beschränktheit an die Überschwänglichkeit der göttlichen Macht anlegt.“</p><p>„Woher nehmen sich die Samenkörner die aus ihnen emporwachsenden Körper? Was geht ihrem Aufsprossen voran? Nicht etwa der Tod, insofern man darunter die Auflösung des Zusammengesetzten versteht? Denn der Same käme nicht zum Keimen, wenn er nicht zuvor in der Erde zersetzt, gelockert und porös würde, damit er vermöge seiner neuen Beschaffenheit die Feuchtigkeit in der Nähe aufnehmen und so in Wurzel und Sprößling sich verwandeln kann, um aber auch dabei nicht zu bleiben, sondern um in den Halm überzugehen, mit Zwischenknoten und Bändern gegürtet, so daß er stark genug werde, aufrecht stehend die mit der Frucht beschwerte Ähre zu tragen. Wo waren denn nun all diese verschiedenen Bestandteile des Weizens, bevor er unter der Erde aufgelöst wurde? Sie stammen doch alle vom Samenkorn; denn wäre dieses nicht vorhanden gewesen, so könnte sich auch keine Ähre entwickeln. Gleichwie die Ähre aus dem Samenkorn entspringt, indem die Allmacht Gottes sie aus demselben voll Weisheit und Kunst entstehen läßt, und sie weder mit dem Samenkorn durchaus gleich noch etwas völlig Anderes ist, so, sagt der Apostel, wird das Geheimnis der Auferstehung durch die wunderbaren Vorgänge am Samenkorn im voraus erklärt, daß nämlich die göttliche Macht in der Überschwänglichkeit ihrer Kraft den Körper trotz seiner völligen Auflösung dir nicht bloß wieder zurückgibt, sondern auch anderes Schönes und Großes dir hinzufügt, so daß deine Natur auf das Herrlichste ausgestattet wird. Darum schreibt der Apostel auch: Gesäet wird in Verweslichkeit, auferweckt in Unverweslichkeit ― gesäet wird in Unehre, auferweckt in Herrlichkeit ― gesäet wird ein irdischer Leib, auferweckt ein geistiger Leib (1 Kor. 15, 43 f.). Denn wie der Weizen in der Scholle, auch wenn er seinen geringen Körperumfang und die eigentümliche Beschaffenheit seiner Gestalt verläßt, sich selbst doch nicht aufgibt, sondern mit sich wesenseins (identisch) bleibend zur Ähre wird, so daß er an Größe, Schönheit, Mannigfaltigkeit und Gestalt sich bedeutend von seinem früheren Zustand unterscheidet, so wird auch die menschliche Natur, wenn sie all die Eigenschaften, die sie sich durch ihre Sündhaftigkeit zuzog, bei der Auflösung im Tode aufgeben muß, wie Unehre, Verweslichkeit, Schwäche, den Altersunterschied und dergleichen, sich selbst nicht aufgeben, sondern gleichsam in eine Ähre umgewandelt werden, d. h. zur Unvergänglichkeit, zur Herrlichkeit, zur Kraft, zur allseitigen Vollendung, zur Befreiung von der Notwendigkeit, den Leib nach seinen verschiedenen Bedürfnissen zu versorgen, zur Emporführung in einen geistigen, leidenschaftslosen Zustand. Denn nur dem irdischen Leib ist es eigen, daß er unaufhörlich von einem Zustand in einen anderen übergeht. Und so werden all die Schattenseiten, die wir hier nicht bloß an den menschlichen Leibern, sondern auch sogar an Tieren und Pflanzen sehen, im künftigen Leben verschwinden.“</p><p>„Doch auch in allen anderen Stücken scheint das Wort des Apostels für unsere Auffassung von der Auferstehung zu sprechen, insbesondere für die Definition, die wir von ihr gegeben, nämlich daß die Auferstehung nichts anderes sei, als die Wiederherstellung unserer Natur in den ursprünglichen Zustand. Wie wir nämlich aus der Geschichte der Welterschaffung durch die Heilige Schrift wissen, daß, wie es dort in der Erzählung heißt, die Erde zuerst das Gras hervorbrachte, und daß dasselbe Samen trug, der, über die Erde gestreut, die nämliche Art wie die Anfangspflanze erzeugte, so wird es nach den Worten des Apostels bei der Auferstehung sein. Von ihm hören wir aber nicht nur, daß die menschliche Natur eine größere Herrlichkeit empfangen werde, sondern auch, daß diese Herrlichkeit, die wir hoffen dürfen, jener gleiche, welche wir im Anfange der Schöpfung hatten. Denn da im Anfang nicht die Ähre vom Samen, sondern der Same von der Ähre kam, nachher aber umgekehrt die Ähre aus dem Samen hervorwächst, so gibt uns dies Vorbild, falls wir es folgerichtig auslegen, einen deutlichen Fingerzeig dafür, daß alle Glückseligkeit, die uns aus der Auferstehung erblüht, zur ursprünglichen Ausstattungsgnade zurückführt. Denn auch wir waren zuerst reine Ähren, die jedoch durch den Brand der Sünde dahin welkten; nun soll uns, wenn der Tod uns auflöst, die Erde in ihren Schoß aufnehmen; dann aber wird dieses armselige Samenkorn des Leibes im Frühling der Auferstehung wieder zur vollkommenen Ähre werden, schlank, voll, aufrecht, zum Himmel emporstrebend, und statt mit Halm oder Stengel ist sie mit Unverweslichkeit und den übrigen göttlichen Eigenschaften geschmückt. Denn, sagt der Apostel, das Vergängliche muß anziehen die Unvergänglichkeit; die Unvergänglichkeit aber und die Herrlichkeit, die Ehre und Macht, sind nach allgemeiner Anschauung Eigenschaften Gottes. Anfänglich waren sie an seinem Ebenbild, das er schuf; wir dürfen hoffen, daß sie sich einstens wieder an ihm finden werden. Der erste Mensch, Adam, war die erste Ähre; aber seit die Sünde eintrat und die Menschennatur sich in eine Vielheit zerteilt, verlieren wir alle, wie es bei der Frucht der Ähre der Fall ist, das Aussehen der Ähre und werden selbst in die Erde versenkt; aber bei der Auferstehung sollen wir wieder emporsteigen, geschmückt mit der Schönheit des Urbildes, und statt der einen ersten Ähre zu unzähligen Myriaden von Saaten vermehrt.“</p><p>„Der tugendhafte Wandel wird sich aber von der Sündhaftigkeit dadurch unterscheiden, daß jene, welche sich im Leben durch Tugend gleichsam zu einer schönen Frucht des Feldes gezüchtet haben, sogleich wie eine vollkommene Ähre auferstehen; diejenigen dagegen, welche durch Sünden die in dem Seelensamen gelegene Kraft schwächen und verderben, werden dem Hornhafer ähnlich, welcher, wie alle Sachkundigen wissen, seine Fruchtbarkeit eingebüßt hat, und so müssen sie, obgleich sie zwar bei der Auferstehung aufsprossen, große Strenge vom ewigen Richter erfahren, weil ihnen die Kraft mangelt, sich zur Gestalt einer vollendeten Ähre zu erheben und zwar noch rechtzeitig, ehe sie nämlich verurteilt wurden, unter die Erde zu kommen. Der Herr der Früchte wird aber folgendes Heilverfahren einschlagen: zunächst wird er die Unkräuter und Dörner sammeln, die mit dem Samen aufwuchsen, weil die Kraft, welche die Wurzel hätte nähren sollen, in den unechten Samen drang, so daß der gute, der Nahrung beraubt und vom schlimmen Gewächs erstickt, nicht zur Reife gelangte. Wenn nun alles Unkraut und Fremdartige von dem nahrungshaltigen Korn abgesondert und vertilgt ist und das Feuer diese Entartung der Natur verzehrt hat, so wird auch die Natur der Ungerechten gute Nahrung bekommen, aufblühen und dank dieser Sorgfalt zur Frucht reifen und so, wenngleich nach langen Zeitläuften, jene Beschaffenheit erlangen, welche uns Gott ursprünglich verliehen hatte. Selig aber die, welchen sogleich, sobald sie durch die Auferstehung emporblühen, die vollendete Schönheit der Ähren beschert wird.“</p><p>„Das meinen wir aber nicht so, als ob ein körperlicher Unterschied zwischen denen, welche gut, und denen, welche schlecht gelebt haben, bei der Auferstehung bestünde, so daß wir uns etwa die einen als körperlich vollendet, die anderen aber als körperlich mangelhaft vorzustellen hätten, sondern wie im Leben der Freie und der Gefangene hinsichtlich des Körpers sich wohl nahestehen, dagegen ein großer Unterschied in bezug auf Freude und Trauer sich zwischen beiden geltend macht, so muß man, glaube ich, den Unterschied zwischen den Guten und Bösen in der künftigen Zeit sich denken. Denn die Vollendung der aus der Saat emporsprießenden Leiber wird, wie der Apostel sagt, in Unverweslichkeit, Herrlichkeit, Ehre und Macht bestehen; der Mangel dieser Vorzüge hat aber keine Verstümmelung des Leibes zur Folge, sondern die Beraubung und den Verlust alles dessen, was wir als ein Gut ansehen. Da nun einer von den beiden allgemein anerkannten Gegensätzen, d. h. Gutes oder aber Böses, an uns sich finden muß, so besagt das Urteil, jemand sei nicht im Guten, das nämliche wie das Geständnis, er sei im Bösen; nun ist aber mit diesem nicht Ehre, nicht Ruhm, nicht Unvergänglichkeit, nicht Macht verbunden; infolgedessen kann auch nicht bezweifelt werden, daß bei dem, der die genannten Güter nicht erlangte, das Gegenteil sich einstellt: Ohnmacht, Schmach, Vergänglichkeit und andere Gebrechen, welche nach unseren früheren Darlegungen die Sünde nach sich zieht und welche sich nur schwer aus der Seele ausmerzen lassen, falls sie sich ganz mit ihr verbunden und verwachsen haben, so daß sie fast eins mit ihr wurden. Wenn nun diese Übel durch die Feuerkur ausgeschieden und gesühnt sind, dann werden an deren Stelle alle Güter ihren Einzug halten: Unvergänglichkeit, Ehre, Schönheit, Herrlichkeit, Kraft und die übrigen Vorzüge, die da in erster Linie Gott, aber auch seinem Ebenbild eigen, d. i. der menschlichen Natur.“</p>
