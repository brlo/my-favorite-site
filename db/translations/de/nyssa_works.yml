      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Gespräch mit Makrina über Seele und Auferstehung</em> (BKV 1. Reihe, Bd. 56, Kempten/München 1927). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3149/versions/gesprach-mit-makrina-uber-seele-und-auferstehung-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

