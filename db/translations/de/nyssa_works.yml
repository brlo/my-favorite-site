      <p><em>Das Gebet des Herrn, übersetzt von Übersetzung der BKV-Ausgabe (BKV 1. Reihe, Bd. 56, Kempten/München 1927).</em></p><h2>1</h2><p>Über das Gebet gibt uns das göttliche Wort selbst einen Unterricht, in welchem es seinen würdigen Schülern, die da ernstlich nach dem wahren Verständnis des Gebetes trachten, schon durch das Gebetsformular den Weg weist, auf welchem sie sich die Erhörung bei Gott verschaffen können. Falls es aber nicht zu kühn ist, möchte ich meinerseits zu den Worten der Schrift einen kleinen Zusatz machen. In der heutigen Versammlung will ich nämlich ausführen, nicht* wie* wir beten sollen, sondern* daß* wir überhaupt beten müssen, ― eine Wahrheit, die das Ohr gar vieler wohl noch nicht so ganz erfaßt hat. Von nicht wenigen wird ja im Leben dieses heilige und göttliche Werk vernachlässigt und zurückgesetzt, das Gebet. Deshalb halte ich für angezeigt, zuerst in meiner Rede eindringlich die Pflicht zu bezeugen,* daß* wir, wie der Apostel sagt, im* Gebete* anzuhalten haben (Röm. 12, 12); dann erst wollen wir auf das Wort Gottes hören, das uns die Art und Weise angibt,* wie* wir unser Gebet dem Herrn vortragen sollen.</p><p>Klar sehe ich nämlich, daß heutzutage allem möglichen mit größtem Eifer nachgegangen wird, indem der eine sein Herz an dieses, der andere an jenes hängt; das kostbare Gut des Gebetes aber lassen sich die Menschen nicht angelegen sein. In aller Frühe eilt der Kaufmann an sein Geschäft, eifersüchtig bemüht, eher als seine Gewerbsgenossen seine Waren den Käufern anzubieten, um deren Wünsche zuerst zu befriedigen und die Waren schnell anzubringen. Ebenso eilt der Käufer aus Besorgnis, ein anderer könnte ihm das, was er benötigt, vorwegkaufen, nicht zum Bet-, sondern zum Kaufhaus. Und weil alle die gleiche Gewinnsucht haben, und jeder dem anderen zuvorkommen will, so wird vor lauter Geschäftseifer die Zeit, welche dem Gebete gewidmet werden sollte, in mißbräuchlicher Weise auf Handel und Verdienst verwendet. So macht es der Handwerker, so der Gelehrte, so der Prozeßführende, so der Richter: jeder verlegt sich ganz und gar auf Geschäft und Beruf; der Gebetsdienst aber wird völlig vergessen, in dem Wahn, die Zeit, welche man auf den Umgang mit Gott verwendet, bedeute einen Schaden für unsere irdischen Obliegenheiten. Denn der, welcher dem Handwerke nachgeht, meint, ein ganz unnützes und unwirksames Ding sei die Hilfe Gottes zu seiner Verrichtung. Deshalb unterläßt er das Gebet und setzt seine Hoffnung auf seine Hände, ohne an den zu denken, der ihm die Hände gegeben. Ebenso denkt der Mann der Wissenschaft nicht an den, der ihm die Wissenschaft gegeben, sondern geradeso, als ob er sich selbst in unser menschliches Dasein eingeführt hätte, richtet er seine ganze Aufmerksamkeit auf sich und auf den eifrigen Betrieb der Studien, und im Wahne, die Hilfe Gottes verschaffe ihm keinen Nutzen, gibt er der Forschung und dem Unterricht den Vorzug vor dem Gebete.</p><p>In gleicher Weise verdrängen auch die übrigen Berufe die Beschäftigung der Seele mit den höheren und himmlischen Dingen durch die Sorge um die leiblichen und irdischen. Infolgedessen ist die Sünde so mannigfach im Leben verbreitet, nimmt stets wachsend immer größeren Umfang an und dringt immer mehr in das Tun und Lassen der Menschen ein, weil allenthalben Gottvergessenheit herrscht und die Menschen den Segen des Gebetes nicht an ihre Beschäftigungen knüpfen wollen. Mit dem Handel zieht die Habsucht einher; die Habsucht ist aber Götzendienst (Kol. 3, 5). Ähnlich betreibt der Landmann den Feldbau nicht nach Maßgabe seiner Bedürfnisse, sondern indem er seiner Begierde gestattet, immer mehr zu verlangen, gewährt er der Sünde weiten Zutritt zu seiner Tätigkeit, so daß er sogar seine Grenzmarken auf Kosten anderer ausdehnt. Daher jene schwer schlichtbaren Streitigkeiten, wenn die Leute, von der nämlichen Krankheit der Habsucht ergriffen, wegen der Feldmarken aneinander geraten. Daraus entspringen dann die Zornausbrüche und die Pläne der Rachsucht und die gegenseitigen Händel, die oft genug mit Blut und Mord endigen. Ebenso bietet der Eifer, mit dem man dem Gerichtswesen nachgeht, Anlaß zu Sünden verschiedener Art, indem er auf tausend Mittel sinnt, das Unrecht zu verteidigen. Der Richter beugt entweder wissentlich die Wage der Gerechtigkeit nach der Seite seines Vorteils, oder er bestätigt ohne es zu wollen, das Unrecht, getäuscht durch die Schliche derer, welche die Wahrheit trüben. Wozu sollte man noch weiter die vielen und verschiedenartigen Wege im einzelnen aufweisen, auf denen die Sünde in das menschliche Leben eindringt? Und daran trägt nur der Leichtsinn die Schuld, mit dem man es unterläßt, die Hilfe Gottes zur Verrichtung der irdischen Geschäfte herbeizurufen.</p><p>Geht jedoch Gebet unserem Tun und Lassen voraus, so wird die Sünde keinen Zugang zur Seele finden. Denn wenn die Erinnerung an Gott Wurzel gefaßt hat, so bleiben die Anschläge des Prozeßgegners erfolglos, weil die Gerechtigkeit die Entscheidung in der Verhandlung gibt. Auch den Landmann hält das Gebet von der Sünde ab, da es die Früchte auf einem kleinen Fleckchen Erde vermehrt, so daß nicht mehr mit der Begierde nach immer größerem Besitz die Sünde sich einschleicht. Das nämliche gilt von dem, der eine Reise antritt, auch von dem, der in den Krieg zieht oder eine Ehe schließt, überhaupt von jedem, der ein Werk beginnt; wenn der Mensch alles mit Gebet unternimmt, so wird er, auch wenn er noch so ernstlich nach seinem irdischen Ziel strebt, doch von der Sünde abgehalten, da ihm nichts begegnen kann, was imstande wäre, ihn zur Leidenschaftlichkeit hinzureißen. Wenn dagegen jemand unter Beiseitesetzung Gottes ganz in seinem Geschäfte aufgeht, so wird er schon dadurch, daß er sich außerhalb Gottes stellte, notwendig in dem sein, was Gott widerstrebt. Außerhalb Gottes stellt sich aber jeder, der sich nicht durch das Gebet mit Gott verbindet. Demnach müssen wir uns durch das Wort der Heiligen Schrift dahin belehren lassen, daß „wir immer beten und darin nicht ermüden sollen“ (Luk. 18, 1); denn durch das Gebet wird die Verbindung mit Gott hergestellt; wer aber mit Gott verbunden ist, ist notwendig von dem geschieden, was Gott widerstrebt.</p><p>Das Gebet ist der Schutz der Mäßigung, die Zügelung des Zornes, die Unterdrückung des Hochmutes, die Befreiung von Rachsucht, die Ausrottung des Neides, die Vernichtung der Ungerechtigkeit, die Errettung aus der Gottlosigkeit. Gebet ist Stärke des Leibes, Gedeihen der Familie, Gesetzlichkeit im Staate, Stütze der Herrschaft, Sieg im Kriege, Bürgschaft des Friedens, Versöhnung der Feinde, Bewahrung der Freundschaft. Das Gebet ist das Siegel der Jungfräulichkeit, die Treue in der Ehe, die Wehr der Wanderer, der Wächter der Schlafenden, die Zuversicht der Wachenden, die Bürgschaft der Ernte für die Landwirte, die Rettung der Seefahrer. Gebet ist der Anwalt der Angeklagten, die Erlösung der Gefangenen, die Erholung der Müden, die Wonne der Fröhlichen, die Aufrichtung der Gedrückten, der Trost der Trauernden, der Kranz der Brautleute, die Verherrlichung der Geburtsfeier, das Sterbegewand der Verscheidenden. Das Gebet ist Umgang mit Gott, Schauen der unsichtbaren Dinge, Erfüllung der Sehnsucht, Verähnlichung mit den Engeln, Fortschritt im Guten, Zerstörung des Bösen, Bekehrung der Sünder, Genuß der Gegenwart, Zuversicht auf die Zukunft. Das Gebet machte dem Jonas das Seeungeheuer zur Wohnung (Jon. 2, 3), brachte den Ezechias, als er schon hart an den Pforten des Todes war, zum Leben zurück (4 Kön. 20, 5 [2 Kön. nach neuerer Zählart]); den drei Jünglingen im Feuerofen verwandelte es die Flammenglut in Tauwind (Dan. 3, 50); den Israeliten errang es im Kampfe mit den Amalekitern den Siegeskranz (Exod. 17, 11), und in einer einzigen Nacht tötete es 185,000 Assyrier mit unsichtbarem Schwerte (4 Kön. 19, 35 [2 Kön. nach neuerer Zählart]). Außer diesen lassen sich noch tausend Beispiele aus der Vergangenheit anführen, die beweisen, daß es unter allem, was im Leben kostbar ist, nichts Höheres gibt als das Gebet.</p><p>Es wäre wohl an der Zeit, an das Gebet selbst heranzutreten; doch wollen wir zu unserer Rede noch einen kleinen Zusatz darüber beifügen, daß wir, während uns von der göttlichen Vorsehung viele und mannigfaltige Güter zuteil wurden, nur dieses eine als Gegengabe für das Empfangene zur Verfügung haben: die Möglichkeit, unserem Wohltäter durch Gebet und Danksagung zu vergelten. Ich halte nun dafür: auch wenn wir während unseres ganzen Lebens den Verkehr mit Gott fortsetzen, indem wir danken und beten, so bleiben wir hinter der durch die empfangenen Gaben uns auferlegten Verpflichtung so weit zurück, als wenn wir von Anfang an uns kaum vorgenommen hätten, dem Wohltäter zu danken. Die Dimension der Zeit pflegt man in drei Abschnitte einzuteilen: Vergangenheit, Gegenwart und Zukunft, und über diese drei Teile erstrecken sich die Wohltaten, die der Herr uns erweist. In bezug auf die Gegenwart gilt, daß du sie durch ihn erlebst; hinsichtlich der Zukunft gibt er dir sichere Gewähr für all das, was du erwartest und wünschest; und was die Vergangenheit betrifft, so wärest du nicht in ihr gewesen, wenn er dich nicht erschaffen und erhalten hätte. Ja, reine Wohltat war es, daß du von ihm das Dasein empfangen hast, und abermals reine Wohltat war es, daß du, nachdem du geworden, „in ihm lebest und dich bewegest,“ wie der Apostel sagt (Apg. 17, 28); und die Hoffnungen, die du für die Zukunft hegst, hängen von der nämlichen Macht ab. Nur die Gegenwart steht dir einigermaßen zur freien Verfügung. Darum kannst du, wenn du nicht aufhörest, Gott zu danken, kaum für die Gegenwart deinen Dank voll erstatten; für die Zukunft und Vergangenheit wirst du überhaupt keinen Weg ausfindig machen, um eine Art Wiedervergeltung für alles zu leisten, was du empfangen. Doch obgleich wir weit entfernt sind, den gebührenden Dank abzustatten, wollen wir uns nicht einmal nach unseren Kräften dankbar erweisen, da wir ― ich sage nicht, den ganzen Tag, nein, ― nicht einmal einen kleinen Teil des Tages auf den Umgang mit Gott verwenden.</p><p>Wer hat mir die Erde unter die Füße gebreitet? Wer hat das nasse Element so geschaffen, daß es der erfinderische Menschengeist schiffbar machen konnte? Wer hat mir den Himmel gefestigt wie ein Gewölbe? Wer trägt mir die Fackel der Sonne voraus? Wer entsendet die Quellen in den Schluchten? Wer hat den Flüssen ihre Rinnsale bereitet? Wer hat mir zur Hilfe die unvernünftigen Tiere unterworfen? Wer hat mich, als ich seelenloser Staub war, gerufen zur Teilnahme an Leben und Vernunft? Wer hat jenen Lehm nach dem Gleichnis des göttlichen Vorbildes gestaltet? Wer hat das in mir durch die Sünde entstellte göttliche Ebenbild wieder zur ursprünglichen Schönheit zurückgeführt? Wer zieht mich, nachdem ich aus dem Paradiese ausgeschlossen, vom Baum des Lebens weggetrieben und in den Abgrund der Sinnlichkeit geworfen bin, wieder zu jener Glückseligkeit empor, die zuerst uns geworden war? „Keiner ist, der es erfaßte“, ― sagt die Schrift (Röm. 3, 11). Denn wenn wir darauf unseren Blick richten würden, so würden wir gewiß in keinem Augenblick unseres Lebens aufhören, Gebete des Dankes zu verrichten. So aber sind fast alle Menschen nur auf das Sinnliche und Irdische aufmerksam und bedacht: auf dieses richtet sich ihr Eifer, um dieses dreht sich ihr Verlangen; an dieses hängen sie ihre Erinnerung und ihre Hoffnung. Vor lauter Gier nach mehr sind die Menschen schlaf- und ruhelos in bezug auf all das, was nur immer ein Mehr zuläßt: in bezug auf Ehre und Ruhm, in bezug auf Reichtum an Hab und Gut, in bezug auf die Befriedigung krankhaften Zornes. In all diesen Dingen trachten die Menschen auf jede mögliche Weise nach mehr; dagegen den wahren Gütern Gottes wenden sie keinen Gedanken zu, weder denen, die bereits vorhanden sind, noch jenen, die uns in Aussicht gestellt wurden.</p><p>Doch es dürfte Zeit sein, uns dem Gebetsformular zuzuwenden und zu untersuchen, welcher Sinn den einzelnen Worten desselben zukommt. Es ist klar, daß die Erhörung unserer Gebete von der rechten Art und Weise abhängt, wie wir unsere Gebete verrichten. Wie lautet nun die Unterweisung hierüber? Es heißt: „Wenn ihr betet, so plappert nicht wie die Heiden; sie glauben nämlich, wegen ihrer vielen Worte erhört zu werden“ (Matth. 6, 7). Das Verständnis dieser Lehre ist leicht, da sie uns in ziemlich einfachen Worten gegeben ist, die keine scharfsinnige Untersuchung erheischen, höchstens mit der Ausnahme, daß wir den Ausdruck „Geplapper“* (βαττολογία)* [battologia] untersuchen müssen, damit wir die Bedeutung auch dieses Wortes kennenlernen und das Untersagte meiden. Wie es scheint, will der Herr die Hohlheit der Gesinnung derjenigen zurechtweisen und beseitigen, welche in falschen Ansichten versunken sind; gerade deshalb wählte er den fremdartigen und seltenen Ausdruck „Geplapper“, um den Unverstand aller zu tadeln, die sich unnützen Gedanken und eitlen Begierden hingeben. Die vernünftige, verständige Rede nämlich, welche Nützliches im Auge hat, wird im eigentlichen Sinne „Rede“ genannt; wenn aber das Herz, weil von nichtigen Begierden erfaßt, törichte Wünsche und Gedanken ausspricht, so haben wir keine wirkliche Rede, sondern „Geplapper“, oder um den nämlichen Gedanken in besserer schönerer Sprache wiederzugeben: „Wortschwall“* (Φλυαρία)* [phlyaria], „Posse“* (λῆρος)* [lēros], „leeres Geschwätz“* (φλήναφος)* [phlēnaphos] und was sonst von derartiger Bedeutung ist. Wozu mahnt uns also das Wort der Schrift? Daß es uns im Augenblick des Betens nicht ergehe, wie den Kindern, in deren Seele sich gerne eitle Gedanken und Wünsche erheben. Beim Beten sollen wir nicht den Kleinen ähnlich werden, die, weil sie noch nicht zum vollen Gebrauch der Vernunft gelangt, nicht darnach fragen, ob ihre Einfälle und Wünsche sich verwirklichen lassen, sondern ganz willkürlich allerlei Glücksgüter sich lebhaft vorstellen: Reichtümer, Hochzeiten, Königskronen, herrliche Städte, denen sie selbst Namen geben. Nicht selten bilden sie sich sogar ein, als lebten sie schon in den Verhältnissen, die ihnen ihre alberne Phantasie vorspiegelt. Manche treiben diese Torheit in noch mehr lächerlicher Weise, indem sie, die Schranken der Natur durchbrechend, in ihrer Einbildung Flügel bekommen, Berge mit der Hand bewegen, wie die Sterne leuchten, am Himmel gehen, Greisenalter in Jugend verwandeln, zehntausend Jahre alt werden oder was sonst alles für leeres Gebilde, den Seifenblasen gleich, die Vorstellungskraft in den Kindern erzeugt.</p><p>Wie im Leben jemand, der bei dem Entwurf seiner Pläne sich nicht vom Nutzen, sondern von Phantastereien bestimmen läßt, unverständig und zugleich unglücklich ist, weil er die kostbare Zeit, in der er über Nützliches hätte nachdenken sollen, an Träumereien vergeudet, so wird jeder, der im Augenblick des Gebetes nicht auf den Nutzen der Seele achtet, sondern verlangt, Gott solle auf seine von der Leidenschaft gebornen Gedanken und Wünsche eingehen, ein rechter Schwätzer und Plapperer, weil er betet, Gott möge sich zum Helfer und Handlanger seiner menschlichen Torheiten hergeben. Ein Beispiel! Es naht sich einer im Gebete Gott, und ohne die Erhabenheit der himmlischen Macht, vor die er hintritt, zu bedenken, verunehrt er, ohne es zu merken, die unendliche Majestät durch seine ganz irdischen und niedrigen Zumutungen. Setzen wir folgenden Fall: ein König schickt sich an, Reichtümer und Würden zu verteilen; nun geht aber ein Untertan, der, sei es aus übergroßer Armut, sei es aus Unkenntnis, irdene Geräte für kostbar hält, zum Könige und verlangt, statt Bitten zu stellen, wie man sie an Könige richtet, von ihm, er, der da auf dem Throne sitzt, möge Ton formen und ihm eines von den Dingelchen machen, die der Armselige im Kopfe hat. Einem solchen Toren gleicht derjenige, der ohne Vernunft und Überlegung sich des Gebetes bedient: nicht zur Höhe des Gebers erhebt er sich, sondern er mutet der göttlichen Majestät zu, daß sie zu der irdischen Niedrigkeit und Erbärmlichkeit menschlicher Leidenschaften herabsteige. Seine krankhaften Triebe hält er dem, der die Herzen kennt, nicht zu dem Zwecke vor, daß er sie heile, sondern daß sie noch schlimmer würden, falls sie nämlich durch die Hilfe Gottes zur Verwirklichung kämen. „Weil mich der oder jener beleidigt, und mein Herz ihm daher feindlich gesinnt ist, treffe ihn!“ ― sagt er zu Gott. Es fehlt nur, daß er geradezu schreie: „Meine Leidenschaft soll sich auch in dir erheben, o Gott; meine Bosheit sich dir mitteilen!“ Wie nämlich bei menschlichen Streitigkeiten jemand unmöglich mit der einen Partei sich verbinden kann, ohne an deren Feindschaft gegen den Gegner teilzunehmen, so ist es klar, daß jener, der Gott gegen seinen Feind in Bewegung setzen will, ihn auffordert, sich mit ihm zu erzürnen und Genosse seines Grimmes zu werden. Das heißt aber, an Gott das Ansinnen stellen, in Leidenschaft zu verfallen, in Zornesaufwallung wie ein Mensch zu kommen und die Güte seines Wesens in tierische Wildheit zu verwandeln. Das gleiche gilt aber auch von dem, der dem Ruhme nachjagt, der in Stolz noch immer nach Höherem strebt, der im Streit um Vorrechte nach dem Siege trachtet, der in den turnerischen Wettkämpfen nach dem Kranze strebt, der auf der Schaubühne sich um den Beifall der Zuschauer bewirbt oder der an der tollwütigen Leidenschaft der Jugend dahinschmilzt: alle diese bringen ihre Bitten vor Gott, nicht um von der Krankheit, die sie beherrscht, befreit zu werden, sondern um sie bis auf den höchsten Grad zu steigern. Und da es jeder von ihnen für ein Unglück betrachten würde, nicht an das Ziel seiner irdischen Wünsche zu gelangen, so plappern sie wirklich, wenn sie Gott anflehen, Helfershelfer ihrer Seelenschwäche zu werden, und was das Allerärgste ist, sie verlangen, Gott solle sich von Beweggründen bestimmen lassen, die einander entgegengesetzt sind d. h. Gott solle sich im Handeln einmal von Hartherzigkeit leiten lassen, das andere Mal von lauter Menschenfreundlichkeit. Ihn nämlich, den sie anflehen, daß er gegen sie selbst gnädig und milde sei, rufen sie an, gegen ihre Feinde hart und unerbittlich sich zu zeigen. O über die Torheit solcher „Plapperer“ <em>(βαττολογούντων)</em> [battologountōn]! Denn wenn Gott gegen jene hart ist, so kann er gegen dich nicht von Milde überfließen. Neigt er sich zum Erbarmen gegen dich, wenigstens nach deiner Hoffnung, wie könnte er dann plötzlich ins Gegenteil, in Härte umschlagen, sobald deine Feinde in Betracht kommen.</p><p>Doch Spitzfindige bringen schnell einen Einwand auf derartige Mahnungen vor. Zur Rechtfertigung ihrer Rachsucht führen sie Prophetenstimmen an: den David, der den Untergang der Sünder wünscht und Schmach und Schande auf seine Feinde herabfleht (Ps. 9, 4 [hebr. Ps. 9, 4]), den Jeremias, der die Vergeltung Gottes an seinen Feinden zu sehen begehrt (Jer. 16, 25), den Oseas, welcher betet, seinen Feinden mögen unfruchtbarer Mutterleib und trockene Mutterbrüste beschert werden (Os. 9, 14). Und manches andere dergleichen, das in den hl. Schriften da und dort vorkommt, führen sie zum Beweise dafür an, daß sie ihre Feinde verwünschen und die göttliche Güte zur Mithelferin ihrer Hartherzigkeit machen dürften. Um dem Schwatzen solcher, welche, auf derartigen Einwendungen fußend, zu einer von der unserigen abweichenden Meinung kommen, ein für allemal ein Ende zu machen, so wollen wir zu jeder der angezogenen Stellen, wenn auch nur wie im Vorbeigehen, eine Bemerkung machen. Von keinem der wahrhaft Heiligen, die vom Heiligen Geiste erfüllt waren und deren Worte auf göttliche Anregung hin zur Beherzigung für die Nachwelt aufgeschrieben sind, wird sich nachweisen lassen, er habe etwas Böses erfleht; vielmehr haben sie bei allen ihren Gebeten nichts anderes im Auge als die Besserung des Sündhaften, das sich unter den Menschen findet. Wenn jemand betet, es möge keine Kranken, keine Bettler geben, so wünscht er gewiß nicht den Untergang der Menschen, sondern das Verschwinden von Krankheit und Armut; und so vermag jeder der Heiligen wegen seines Gebetes, es möge alles, was unserem Geschlechte verderblich und böse ist, verschwinden, nur ganz Unverständige zu der Meinung verführen, er wäre gegen die Menschen selbst erzürnt und erbittert.</p><p>Denn wenn der Psalmist ausruft: „Verschwinden mögen die Sünder und Ungerechten von der Erde, damit sie nicht mehr sind!“ (Ps. 9, 18 [hebr. Ps. 9, 18]), so betet er, daß die Sünde und die Ungerechtigkeit aufhören möchten. Der Mensch ist ja nicht als solcher der Feind seiner Mitmenschen, sondern die Richtung seines Willens zum Bösen hin läßt den natürlichen Träger dieses verkehrten Willens in der Rolle eines Feindes erscheinen. Also betet David, das Böse möge aufhören; der Mensch als solcher ist aber nichts Böses. Wie wäre das Ebenbild des unendlich Guten an sich etwas Böses? Ebenso will dich David, so oft er Schmach und Schande auf seine Feinde herabfleht, hinweisen auf die Menge jener Widersacher, die auf seiten des unsichtbaren Feindes immer wieder Krieg in das Leben der Menschen tragen. Diese hat noch offensichtlicher Paulus im Auge, wenn er sich dahin äußert, daß „wir zu kämpfen hätten gegen Fürsten und Mächtige, gegen die Beherrscher dieser Welt, gegen die Geister der Bosheit unter dem Himmel“ (Eph. 6, 12). Die Nachstellungen der Dämonen, durch welche sie den Zunder des Bösen in die Menschheit werfen, bald gereizte Begegnungen, bald Anlässe zu Begierden des Neides, der Überhebung, des Hasses und andere Sündenwurzel ― all diese Angriffe sieht der große Prophet, wenn er sein Gebet gegen seine Widersacher verrichtet, auf die Seele eines jeden einstürmen und betet deshalb, sie möchten zuschanden werden. Die Beschämung seiner Feinde ist aber gleichbedeutend mit der Rettung seiner selbst. Naturgemäß kommt es dem im Ringkampf Besiegten zu, sich über seine Niederlage zu schämen, wie dem Sieger, sich über den Sieg zu freuen. Daß dem so ist, erhellt auch aus der Form des Gebetes, das da lautet: „Beschämt sollen werden und in Verwirrung geraten, die meiner Seele nachstellen“ (Ps. 6, 11 [hebr. Ps. 6, 11]). Der Psalmist verwünscht demnach nicht solche, welche ihm Schaden an Geld zufügen wollen, auch nicht solche, welche der Feldgrenzen wegen Prozesse gegen ihn anstrengen, oder die ihm eine körperliche Schädigung anzutun beabsichtigen, sondern diejenigen, welche seiner Seele nachstellen. Was ist aber die Nachstellung der Seele anders als der Versuch, eine Gottentfremdung herbeizuführen? Gott wird aber die Seele dadurch entfremdet, daß sie sich an eine Leidenschaft hingibt. Da nun Gott frei von Leidenschaftlichkeit ist, so löst der Leidenschaftliche die Verbindung mit Gott auf. Um solches Unheil von sich abzuwenden, betet der Psalmist um die Beschämung seiner Widersacher und damit für sich um den Sieg über seine Feinde; die Feinde aber sind die Leidenschaften.</p><p>Ebenso muß das Gebet des Jeremias aufgefaßt werden. Während nämlich der König und seine von der gleichen Anschauung erfüllten Untertanen wahnwitzigem Götzendienst huldigten, will Jeremias, von Eifer für die Verehrung des wahren Gottes beseelt, nicht irgendein persönliches Mißgeschick durch sein Gebet abwenden, sondern bringt sein Anliegen für die Gesamtheit der Menschen vor, indem er bittet, durch das Einschreiten Gottes gegen die gottlos Gewordenen möge das ganze Menschengeschlecht zur Besinnung gebracht werden. Das nämliche gilt vom Propheten Oseas. Weil er sah, wie äußerst fruchtbar die Bosheit unter den Israeliten sich erwiesen hatte, so wünschte er mit Recht die Strafe der Unfruchtbarkeit über sie herab, von der Absicht geleitet, daß die unheilvollen Brüste der Sünde vertrocknen sollten, damit das Böse unter den Menschen weder geboren noch genährt werde. In diesem Sinne betet der Prophet: „Gib ihnen, o Herr, einen unfruchtbaren Leib und trockene Brüste“ (Osee 9, 14).</p><p>Und wenn sonst ein derartiges Wort in den hl. Schriften sich findet, das irgendwie Rachsucht zu bezeichnen scheint, so hat es ganz bestimmt nur die Bedeutung, daß es lediglich das Böse ausrotten, nicht aber den Menschen verderben will. „Gott hat den Tod nicht gemacht“ (Weish. 1, 13). Hörst du das Wort? Wie hätten da die Propheten Gott zur Tötung ihrer persönlichen Feinde auffordern dürfen, ihn, dem das Wesen und Wirken des Todes fremd ist? Gott freut sich nicht an dem Verderben Lebendiger! Nur ein Schwätzer, der gegen seine Feinde die Menschenliebe Gottes aufreizen möchte, wagt es, ihn aufzufordern, sich über die Heimsuchungen der Menschen zu freuen.</p><p>„Aber“, wendet jemand ein, „manche haben doch schon Ämter, Ehren- und Wohlstand erlangt, weil sie darum gebetet hatten, und durch derartiges Glück wurde sogar die Meinung hervorgerufen, daß sie Lieblinge Gottes seien. Willst du also“, heißt es weiter, „uns abhalten, um derartige Dinge unsere Gebete vor Gott zu bringen?“ Doch hört! Daß alles vom göttlichen Ratschluß abhängt und das Leben hier unten von oben aus regiert wird, ist jedem klar, und niemand dürfte dem widersprechen; aber hinsichtlich solcher Gebetserfolge haben wir andere (als irdische) Ursachen kennengelernt. Gott gewährt nämlich diese Dinge nicht als ob sie durchaus gut wären den Bittenden, sondern in der Absicht, daß durch sie bei den oberflächlicheren Naturen das Vertrauen auf Gott gefestigt werde, nämlich allmählich dadurch, daß wir in den niedrigeren Angelegenheiten die Erfahrung machen, wie Gott die Gebete erhört, und daß wir so schließlich zur Sehnsucht nach den hohen, Gottes wahrhaft würdigen <s101> Gaben gelangen. Ähnliches sehen wir auch an unseren Kindern! Eine Zeitlang hängen sie einzig an der Mutterbrust, wobei sie nur soviel, als ihre Natur verträgt, bei der Mutter suchen; wenn aber das kleine Kind allmählich größer wird und einige Fähigkeit zu sprechen gewinnt, so verschmäht es die Brust und fängt an, anderes zu wünschen, etwa ein Bändchen für das Haar, ein Kleid und derlei Dinge, an denen sich ein Kindesauge ergötzt; wenn es aber erwachsen ist und der Verstand mit dem Leibe zugenommen hat, dann wird es alle kindischen Wünsche von sich weisen und von den Eltern nur mehr solche Dinge erbitten, die dem reifen Lebensalter entsprechen. So verfährt auch Gott. In dem Bestreben, die Menschen durch alles daran zu gewöhnen, ihn selbst zu verlangen und zu suchen, verschließt er oft auch wertloseren Bitten nicht sein Ohr, um durch seine Güte in Kleinigkeiten den Empfänger der Wohltat zum Verlangen nach den höheren Gütern emporzuheben. Auch du also bedenke, wenn der oder jener durch die göttliche Vorsehung aus der Menge der gewöhnlichen Sterblichen herausgehoben wurde und zu Ruhm und Ansehen gelangte oder sonst ein von den Menschen begehrtes Glück erwarb wie Macht, Reichtum, Achtung ― bedenke wohl den Zweck, den Gott mit solcher Freigebigkeit verfolgt, nämlich, daß dir seine Güte in diesen Dingen ein Beweis seiner großen Macht werde, damit du, durch das Gewähren dieser kindischen Spielereien belehrt, auch um Größeres und Vollkommeneres deine Bitten vor den Vater bringst, d. h. um das, was der Seele nützt.</s101></p><p>Welch’ ein Unverstand; vor Gott hintreten und von dem Ewigen verlangen das Zeitliche, von dem Himmlischen das Irdische, von dem Höchsten das Niedrige, von ihm, der das Königreich der Himmel zu verschenken hat, armseliges Erdenglück, von ihm, der Unverlierbares verleihen kann, den kurzen Gebrauch von Dingen, deren Genuß rasch vergeht, deren Verwaltung gefährlich ist! Treffend bringt der Herr das Ungereimte derartiger Bitten zum Bewußtsein durch den Zusatz „wie die Heiden“. Nur auf das Sichtbare allen Fleiß verwenden ist denen eigen, die keine Hoffnung auf das künftige Leben sich zu Gemüte führen, keine Furcht vor dem göttlichen Gerichte, keine Androhung der Hölle, keine Erwartung ewiger Güter, überhaupt nichts, was auf Grund der Auferstehung gehofft wird, ihnen, die wie das liebe Vieh nur auf das gegenwärtige Leben schauen und als höchstes Gut betrachten, dem Trunke, der Völlerei und den übrigen sinnlichen Lüsten frönen zu können, den ersten Platz oder wenigstens einen hohen Rang unter den (aus Ber.: lies „den“ statt „der“) Menschen einzunehmen, Reichtümer zu hüten oder sonst einer Täuschung des Lebens sich hinzugeben. Redet einer diesen gegenüber von der künftigen Hoffnung, so dünkt er ihnen mit seinen Darlegungen über Paradies, Reich Gottes, Wohnung im Himmel usw. geradezu als Schwätzer. Nachdem es also denen bloß, die keine Hoffnung auf Überirdisches haben, eigen ist, ausschließlich am gegenwärtigen Leben zu hängen, so bezeichnet das Wort treffend die Hingabe an ganz irdische, eitle Wünsche, deren Erfüllung die Genußsüchtigen durch das Gebet für sich zu erreichen wähnen, als Sache der Heiden, die da glauben, sie würden wegen dringenden Betens um jene albernen Dinge Gott als Helfershelfer zu Törichtem und Unnützem gewinnen. „Sie glauben nämlich,“ heißt es, „sie würden wegen ihres Plapperns Erhörung finden“ (Mark. 6, 7).</p><p>Unsere bisherige Ausführung zeigte, um was wir nicht bitten sollen. Wie aber tatsächlich die Bitten beschaffen sein müssen, die wir Gott vortragen, werden wir in den folgenden Darlegungen hören mit der Gnade unseres Herrn Jesu Christi, dem Ehre und Macht sei von Ewigkeit zu Ewigkeit. Amen.Zweite Rede: „Vater unser, der du bist in dem Himmel!“</p><h2>2</h2><p>Als der große Moses das Volk Israel an den Berg führte, damit es dort in die heiligen Lehren eingeweiht werde, hielt er es der Erscheinung Gottes nicht eher für würdig, bevor er nicht für das Volk eine Reinigung durch Enthaltsamkeit und Waschung angeordnet hatte. Aber auch so waren die Israeliten nicht ohne Furcht vor dem Erscheinen der göttlichen Majestät, sondern bei jedem Zeichen derselben erschraken sie: beim Feuer, bei der Finsternis, beim Rauche und bei den Posaunen. Und als sie sich von diesen Schrecknissen wieder etwas erholt hatten, baten sie Moses, für sie der Vermittler des göttlichen Willens zu werden, da sie fühlten, daß ihre Kraft nicht ausreiche, Gott zu nahen und seine Erscheinung zu empfangen.* Unser* Gesetzgeber, unser Herr Jesus Christus, der uns der göttlichen Gnade zuführen will, zeigt uns in seiner Verkündigung keinen Berg Sinai, in Finsternis gehüllt und von Feuer rauchend, keine Posaunenstöße, die geheimnisvoll und schrecklich widerhallen. Auch reinigt er die Seelen nicht etwa durch dreitägige Enthaltsamkeit und mit Wasser, das den Schmutz wegwäscht; ebensowenig läßt er die ganze Gemeinde am Fuße des Berges zurück, um nur einem Einzigen den Aufstieg zum Gipfel des Berges zu gestatten, den der Rauch einhüllt, um die Herrlichkeit Gottes zu verbergen. Nein! statt nur auf den Berg führt er zum Himmel empor, indem er ihn für alle, welche der Tugend nachstreben, zugänglich macht. Auch macht er die Menschen nicht bloß zu Zuschauern der göttlichen Herrlichkeit, sondern sogar zu Teilhabern an derselben und führt jene, welche sich ihr nahen, gewissermaßen zur Verwandtschaft mit der göttlichen Wesenheit. Desgleichen verbirgt er nicht die alles überragende Majestät in Dunkel, so daß sie für die, welche sie suchen, schwer zu schauen wäre, sondern mit dem weithin strahlenden Licht seiner Lehre hat er das Dunkel erhellt und in leuchtender Klarheit allen, die reinen Herzens sind, die unaussprechliche Herrlichkeit sichtbar gemacht. Und Wasser zum Besprengen gewährt er nicht aus Bächen, die nicht unser sind, sondern solches, das in uns selbst emporquillt, mag man darunter den Quell der Augen oder das reine Gewissen des Herzens verstehen. Ferner nicht dadurch, daß er den erlaubten ehelichen Verkehr untersagt, will uns der Herr heiligen, sondern dadurch, daß er jede auf das Sinnliche und Irdische gerichtete leidenschaftliche Seelenverfassung verbietet. Solche Reinigung verlangend, führt er uns durch das Gebet zu Gott. Das ist die Absicht seiner Gebetsunterweisung, durch die wir befähigt werden sollen, nicht zur Hervorbringung bestimmter Töne durch das Aussprechen vorgeschriebener Worte, sondern zu höherem Streben und damit zum Aufstieg der Seele zu Gott.</p><p>Nun wollen wir an der Hand der einzelnen Worte die göttliche Unterweisung genauer kennenlernen! ―* „Ὅταν προσεύχησθε“* [Hotan proseuchēsthe] = „wenn ihr betet“, heißt es (Matth. 6, 7): Der Herr hat also nicht gesagt:* „ὅταν εὔχησθε“* [hotan euchēsthe] = wenn ihr gelobet“, sondern:* „ὅταν προσεύχησθε“* [hotan proseuchēsthe] = „wenn ihr betet“, weil es nach seiner Lehre geziemend ist, daß das Gelöbnis vorher schon erfüllt sei, ehe man sich im Gebete Gott naht. Welches ist der Unterschied dieser Ausdrücke gemäß ihrer Bedeutung?* Εὐχή* [Euchē] (Gelöbnis) ist das Versprechen einer Sache, die aus Frömmigkeit Gott geweiht wird;* προσευχή* [proseuchē] (Gebet) hingegen ist das Verlangen nach Gütern, das mit demütigem Flehen verbunden, Gott dargebracht wird. Weil wir denn, wenn wir zu Gott hintreten, um unsere Bitten um unser Heil zu stellen, zuversichtlich reden sollen, so werden wir notwendig zuvor unser Gelübde einlösen, damit wir dann nach Erfüllung unserer Leistung getrost um Gottes Gegengabe bitten können. Darum sagt auch der Prophet: „Meine Gelübde will ich dir entrichten, o Herr, die meine Lippen gesprochen“ (Ps. 65, 15 [auch: V. 13.14] [hebr. Ps. 66, 13.14]), und abermals: „Gelobet und entrichtet das Gelobte dem Herrn, unserem Gotte!“ (Ps. 75, 13 [auch: V. 12] [hebr. Ps. 76, 12]). An vielen Stellen der Schrift kann man eine derartige Bedeutung des Ausdruckes* „ἡ εὐχή“* [hē euchē] (Gelöbnis) finden; darum verstehen wir, daß* εὐχή* [euchē] (Gelöbnis), wie gesagt, das Versprechen einer Gabe ist, zu dem Zwecke angeboten, um Gott wohlgefälliger zu werden, während* προσευχή* [proseuchē] (Gebet) den Hintritt vor Gott bedeutet, der erst nach der Erfüllung des Versprechens stattfindet. Es lehrt uns also das Wort, nicht eher Gott um etwas zu bitten, als bis wir ihm ein Geschenk gemacht haben, das ihn erfreut. Man soll nämlich zuerst geloben, und dann beten, wie auch nach dem Sprichwort die Aussaat der Ernte vorangeht. Demnach sollen wir vorher die Samenkörner des Gelöbnisses ausstreuen und dann erst, wenn dieselben zur Reife gediehen, zur Ernte schreiten d. h. auf unser Gebet hin die göttliche Gnade als Gegengabe in Empfang nehmen. Weil es also außer Zweifel steht, daß unser Hintritt zu Gott nicht zuversichtlich ist, wenn er nicht auf ein vorhergehendes Gelübde oder Geschenk sich stützen kann, so wird das Gelübde notwendig dem Gebete vorausgehen.</p><p>Unter der Voraussetzung nun, daß die Erfüllung des Gelübdes bereits erfolgt sei, spricht der Herr zu seinen Jüngern also: „Vater unser, der du bist in dem Himmel!“ „Wer wird mir Flügel geben wie einer Taube?“ ― sagt irgendwo in den Psalmen der große David (Ps. 54, 7 [hebr. Ps. 55, 7]). Ich möchte ebenfalls so rufen, wenn ich es wagen soll, das gleiche Wort wie Jesus zu sprechen. Wer wird mir jene Flügel geben, damit ich die Kraft erhalte, mich im Geiste, wie es der Großartigkeit des Ausdruckes entspricht, soweit aufzuschwingen, daß ich, die ganze Erde unter mir lassend und das darüber liegende Luftmeer durchdringend, die Schönheit des Äthers erreiche und zu den Gestirnen aufsteige, mit Entzücken ihre volle Pracht und Ordnung schauend? Daß ich aber selbst hier noch nicht Halt mache, sondern weiter eilend dem Bereich alles dessen entfliehe, das sich bewegt und verändert, und endlich zu jener Natur komme, die keine Veränderung kennt, zu jener Macht, die ihre Stütze in sich selbst hat, die alles trägt und leitet, was Dasein hat, alles, was von dem unaussprechlichen Willen der göttlichen Weisheit abhängt. Daß ich allem, was der Veränderung und dem Wechsel unterworfen ist, vollständig entronnen in unbewegter, ruhiger Seelenverfassung den Unwandelbaren und Unveränderlichen zuvor durch meine Gesinnung mir geneigt mache und dann mit dem vertrautesten Namen anrufe, indem ich spreche: „Vater!“ Welche Seele ist zu diesem Worte notwendig! welches Vertrauen! welches Gewissen! Wenn wir von den dem Begriff Gottes möglichst entsprechenden Namen geleitet nur einigermaßen zur Erkenntnis seiner unaussprechlichen Herrlichkeit gelangt sind und nur etwas eingesehen haben, daß die göttliche Natur, was sie auch sonst noch an sich sein mag, wenigstens Güte, Heiligkeit, Seligkeit, Macht, Majestät, Reinheit, Ewigkeit, Unveränderlichkeit ist; wenn wir ferner von diesen und ähnlichen Eigenschaften des göttlichen Wesens an der Hand der Heiligen Schrift und auf Grund des eigenen Nachdenkens uns die höchste Vorstellung gemacht haben ― wer von uns dürfte es dann wagen, ein derartiges Wort über seine Lippen zu bringen und solch ein Wesen Vater zu nennen?</p><p>Soviel ist gewiß: wer nur irgendwie zu denken imstande ist, wird sich, wenn er nicht die nämlichen Eigenschaften, wie an ihm, auch an sich selbst sieht, niemals erkühnen, jenes Wort Gott gegenüber auszusprechen und ihn „Vater“ zu nennen. Denn Vater für Bösewichter zu werden, dazu hat er, der seinem Wesen nach Gute, nicht die Fähigkeit: weder für den durch sein Leben Befleckten der Heilige, noch für den Wankelmütigen der Unveränderliche, noch für die durch die Sünde dem Tode Verfallenen der Urheber des Lebens, noch für die durch schändliche Leidenschaften Entstellten der Reine und Unversehrte, noch für die Habsüchtigen der Barmherzige, noch überhaupt für in irgendwelchem Bösen Befangenen der, welchen wir als den vollkommen Guten erkennen. Denn wenn einer noch der Sühne für sich selbst bedarf, wenn er sein eigenes böses Gewissen wahrnimmt, voll von Flecken und schlimmen Brandmalen und ohne vorausgehende Reinigung sich in die Verwandtschaft mit Gott eindrängen wollte, indem er ihn als „Vater“ anreden würde, der Ungerechte den Gerechten, der Unreine den Reinen: geradezu eine Beschimpfung und Lästerung wären solche Worte, da er doch Gott als den Vater seiner Verworfenheit bezeichnen würde; denn der Ausdruck „Vater“ bezeichnet den Urheber dessen, der von ihm stammt. Wenn wir also mit schuldbeladenem Gewissen Gott unseren Vater nennen, so werden wir nichts anderes tun, als wider Gott aussagen, er sei der Urheber und die Ursache unserer Fehler. Aber „keine Gemeinschaft hat das Licht mit der Finsternis“, sagt der Apostel (2 Kor. 6, 14), sondern mit dem Lichte ist nur Licht verwandt und mit dem Gerechten nur der Gerechte, mit dem Guten nur der Gute und mit dem Unversehrten bloß der Unversehrte. Diejenigen, welche solche Eigenschaften haben, die denen Gottes entgegengesetzt sind, müssen sich als jenem verwandt betrachten, der gleicher Art ist, wie sie selbst. Denn „kein guter Baum kann schlechte Früchte hervorbringen“ (Matth.7,18). Wenn demnach einer, der verstockten Herzens ist und die Lüge sucht, wie die Schrift sagt (Ps. 4, 3 [hebr. Ps. 4, 3]), es wagt, die Worte des Gebetes zu gebrauchen, so soll er wissen, daß nicht der Himmlische es ist, den ein solcher Mensch Vater nennt, sondern der Unterirdische, der selbst ein Lügner ist (Is. 8, 44) und jedesmal, sooft jemand eine Lüge tut, als deren Vater angesehen werden muß, er, der die Sünde selbst und der Vater der Sünde ist. Deshalb werden die, welche leidenschaftlichen Herzens sind, als Kinder des Zornes vom Apostel angesprochen (Eph. 2, 3), und wer vom Leben abgefallen ist, wird Sohn des Verderbens genannt (Joh. 17, 12), ebenso ein schlaffer, weibischer Mensch als Sohn entlaufener Dirnen bezeichnet (Judith 16, 13). Aber auch umgekehrt heißen die, welche ein leuchtend reines Gewissen haben, Söhne des Lichtes und des Tages (Eph. 5, 8) und Söhne der Kraft jene, die sich an der Stärke Gottes Kraft geholt haben.</p><p>Wenn uns also der Herr lehrt, beim Beten Gott unseren Vater zu nennen, so tut er, wie mir scheinen will, nichts anderes, als daß er uns ein reines, erhabenes Leben anbefiehlt. Denn der, welcher die Wahrheit selber ist, lehrt uns doch nicht lügen, so daß wir vorgeben sollten, etwas zu sein, was wir nicht sind, und daß wir uns einen Namen geben dürften, der uns unserer Beschaffenheit nach nicht zusteht, sondern er verlangt, daß wir eben deshalb, weil wir den Unversehrten, Gerechten und Gütigen unseren Vater nennen, eine enge Verwandtschaft mit ihm durch ein makelloses Leben in Wirklichkeit herstellen. Siehst du also, welch ernste Vorbereitung wir zum Gebete notwendig haben! Welch untadeliges Leben müssen wir führen, welch glühenden Eifer müssen wir haben, wenn wir uns mit gutem Gewissen zu solch weitgehender Vertraulichkeit sollen erheben dürfen, daß wir es wagen können, zu Gott „Vater unser“ zu sprechen! Wenn du dagegen nach Geld oder Ehre hungern würdest, wenn du deine Zeit hinbrächtest in Irrfahrten des Lebens, wenn du unheilvollen Begierden fröntest und dann doch ein solches Gebetswort in den Mund nehmen solltest ― was meinst du, wird dazu derjenige sagen, der das Leben prüft und den Sinn des Gebetes wohl versteht? Mir ist es, als hörte ich Gott zu einem solchen Menschen ungefähr also sprechen: „Du, dessen Leben befleckt ist, nennst Vater jenen, der der Vater der Unversehrtheit ist? Was besudelst du mit deiner unsauberen Zunge den reinsten Namen? Was mißbrauchst du das Wort des Gebetes zur Lüge? Was verunehrst du die makellose Natur? Wärest du mein Kind, so müßte dein Leben meine guten Eigenschaften aufweisen! Nimmer kann ich in dir das Abbild meines Wesens erkennen; vielmehr drücken dir die entgegengesetzten Eigenschaften den Stempel der Nichtverwandtschaft auf! Welche Gemeinschaft hat „das Licht mit der Finsternis“ (2 Kor. 6, 14), das Leben mit dem Tode? Welche Verwandtschaft hat der von Natur aus Reine mit dem Unreinen? Eine große Kluft trennt den Freigebigen von dem Habsüchtigen! Unvereinbare Gegensätze sind der Barmherzige und Hartherzige! Ein ganz anderer ist der Vater deiner schlimmen Eigenschaften. Meine wahren Kinder schmücken sich mit den Eigenschaften ihres Vaters: Kind des Barmherzigen ist der Barmherzige, des Reinen der Reine; die Verkommenheit hat einen anderen Erzeuger als den Unverderbbaren. Kurz: aus dem Guten stammt der Gute, aus dem Gerechten der Gerechte. „Von euch aber weiß ich nicht, von wannen ihr seid“ ― (Joh. 9, 29). ― Gefährlich ist es also, sich dieses Gebet anzumaßen und Gott seinen Vater zu nennen, ehe man sein Leben geläutert hat.</p><p>Doch hören wir abermals die Worte des Gebetes, ob wir nicht etwa eine sichere Erkenntnis des darin eingeschlossenen Sinnes durch häufigere Wiederholung gewinnen! „Vater unser, der du bist in dem Himmel!“ Durch die bisherige Darlegung haben wir die Wahrheit genügend beleuchtet, daß wir uns durch ein tugendhaftes Leben mit Gott verwandt machen müssen. Doch scheint uns die Anrede noch eine weitere Belehrung zu geben. Jene Worte erinnern uns nämlich auch an das Vaterland, aus dem wir vertrieben, und an den Adel, dessen wir verlustig gegangen sind. Denn in der Parabel von dem Jüngling (Luk. 15, 12 ff.), der den Herd des Vaters verließ und zu einem Leben, wie es die Schweine führen, herabsank, zeigt uns das göttliche Wort das menschliche Elend, indem es uns in der Erzählung seine Entfernung und seine Verkommenheit vor Augen stellt; und nicht eher führt es ihn zu seinem früheren Glücke zurück, als bis er sein nunmehriges Unglück fühlt, in sich geht und auf Worte der Reue sinnt. Letztere stimmen so ziemlich mit den Worten des Gebetes überein. Er sprach dort nämlich: „Vater, ich habe gesündigt wider den Himmel und vor dir“ (Luk. 15, 21). In seinem Bekenntnis hätte er sicher nicht von einer Sünde wider den Himmel gesprochen, wenn er nicht überzeugt gewesen wäre, daß der Himmel sein Vaterland sei und daß er dasselbe verlassen habe, als er zu sündigen begann. Deshalb machte ihm auch die Ablegung eines solchen Bekenntnisses den Vater so zugänglich, daß dieser sogar auf ihn zueilt und ihm unter Küssen um den Hals fällt ― hiedurch wird auf das geistliche Joch hingewiesen, das dem Menschen durch den Mund, das ist durch die Offenbarung des Evangeliums auferlegt wurde, nachdem er dem ersten Joch des Gesetzes sich entzogen und das Gebot abgeschüttelt hatte, das ihm zu seinem Schutze gegeben war. Auch zieht er ihm das Gewand an und zwar kein anderes, sondern das erste, dessen er sich durch den Ungehorsam entledigt hatte, mit anderen Worten, sobald er von der verbotenen Frucht genoß, sah er sich in seiner Blöße. Und der Ring an der Hand deutet durch das dem Stein eingegrabene Siegel die Wiedergewinnung des göttlichen Ebenbildes an, nach welchem er geschaffen wurde. Er schützt ferner seine Füße mit den Schuhen, damit er, wenn er mit der nackten Ferse dem Kopf der alten Schlange nahe komme, nicht ihrem Bisse ausgesetzt sei.</p><p>Wie also dort die Rückkehr ins Vaterhaus den Vater so gütig gegen den verirrten Jüngling stimmte ― das Vaterhaus versinnbildet den Himmel, gegen den gesündigt zu haben er dem Vater bekennt, ― so scheint mir auch hier der Herr durch seine Weisung, den Vater, der im Himmel ist, anzurufen, dich an jenes herrliche Vaterland erinnern zu wollen, um dir ein heißes Verlangen nach dessen Schönheit einzuflößen und dich dann auf den rechten Weg zu geleiten, der wieder zum Vaterland zurückführt. Der Weg aber, der die Menschen zum Himmel emporführt, ist kein anderer als die völlige Abkehr von den Sünden der Welt, und das Mittel, um die Sünden zu meiden, scheint mir kein anderes zu sein als unsere Verähnlichung mit Gott. Gott ähnlich werden ist aber gleichbedeutend mit: gerecht, fromm, gut und dergleichen werden. Hat nun jemand das Gepräge dieser Tugenden seiner Seele möglichst deutlich eingedrückt, so wird er mühelos, wie von selbst, aus dem irdischen Leben in das himmlische Land übersiedeln. Denn nicht ein räumlicher Abstand trennt Gott und die Menschen, so daß wir irgendeine Vorrichtung oder Erfindung nötig hätten, um unser schwerfälliges irdisches Fleisch in die Wohnung des Geistes und des Körperlosen zu versetzen, sondern da die Scheidung der Tugend vom Bösen in unserem Innern vollzogen wird, bewirkt unser Willensentscheid allein schon, daß wir geistig dort sind, wohin wir uns mit unserer Gesinnung stellen. Weil demnach keine körperliche Anstrengung mit der Entscheidung für das Gute verbunden ist ― der Entscheidung aber folgt auch schon der geistige Besitz dessen, wofür man sich entscheidet ― so kannst du schon dadurch sogleich im Himmel sein, daß du Gott in deinen Geist aufnimmst. Wenn nämlich, wie der Prediger (Ekkle. 5, 1) sagt, „Gott im Himmel wohnt“, der Gerechte aber nach dem Propheten (Ps. 73, 28 [ = hebr.] [Septuag. u. Vulgata = Ps. 72, 28]) eng mit Gott verbunden ist, so wirst du, falls du so mit Gott verbunden bist, mit zwingender Notwendigkeit dort sein, wo Gott ist, das ist im Himmel. Mit seiner Anordnung also, Gott im Gebete unseren Vater zu nennen, hat uns der Herr anbefohlen, durch einen Gott gefälligen Wandel dem himmlischen Vater ähnlich zu werden. Die nämliche Mahnung, nur noch deutlicher, gibt er anderwärts mit den Worten: „Werdet vollkommen, wie euer Vater im Himmel vollkommen ist“ (Matth. 5, 48).</p><p>Wenn wir daher den Sinn so erhabener Gebetsworte recht erfaßt haben, so dürfte es an der Zeit sein, unsere Seele zu bereiten, daß wir es wagen dürfen, diese Worte in den Mund zu nehmen und in zutraulichem Freimut zu sprechen: „Vater unser, der du bist in dem Himmel!“ Doch wie es deutliche Kennzeichen der Gottähnlichkeit, durch die wir Kinder Gottes werden können ― „allen nämlich, die ihn aufnahmen“, heißt es, „gab er Macht, Kinder Gottes zu werden“ (Joh. 1, 12) ― so gibt es auch gewisse, dem bösen Wesen eigentümliche Zeichen, mit denen behaftet man unmöglich ein Kind Gottes ist, weil man das Abbild seines Widersachers an sich trägt. Willst du die Merkmale des bösen Abbildes erfahren? Der Neid, der Haß, die Verleumdung, der Stolz, die Habgier, die leidenschaftliche Begierde, krankhafter Ehrgeiz, diese und ähnliche Eigenschaften sind es, an denen man das Abbild des Widersachers erkennt. Wenn also jemand, dessen Seele mit solchen Flecken und Brandmalen verzerrt ist, im Gebete „Vater“ ruft, was für ein Vater wird auf ihn hören? Gewiß nur derjenige, welcher mit dem Rufer verwandt ist; dies ist aber nicht der himmlische, sondern der unterirdische; denn der, von dessen Sippe er die Zeichen an sich trägt, wird ganz genau seine Verwandtschaft an ihm erkennen. Daher wird das Gebet des schlechten Mannes, so lange er in der Schlechtigkeit verharrt, sogar zu einer Anrufung des Teufels; das Rufen dessen aber, der sich von der Sünde losgesagt hat und ernstlich nach dem Guten strebt, gilt dem guten Vater im Himmel.</p><p>Wenn wir also vor Gott hintreten, wollen wir zuvor unser Leben prüfen, ob wir etwas der Gottesverwandtschaft Würdiges an uns tragen; nur in diesem Falle können wir den Mut fassen, so zu beten. Denn der, welcher uns angewiesen hat, zu Gott „Vater“ zu sagen, gestattet uns nicht, zu lügen. Wer demnach ein Leben führt, das dem Adel unserer göttlichen Verwandtschaft entspricht, darf allein getrost zur himmlischen Stadt sein Auge erheben, wenn er den König der Himmel Vater und die himmlische Glückseligkeit sein Vaterland nennt. Welchen Rat geben wir nun? Nach oben sollen wir schauen, wo Gott ist, dort das Fundament unseres Heilsgebäudes legen, dort Schätze sammeln, dorthin die Wohnung unseres Herzens verlegen! Denn, „wo dein Schatz, ist auch dein Herz“ (Matth. 6, 21). Immerdar sollen wir auf die Vollkommenheit des Vaters blicken und nach ihr unsere Seele ausstatten. „Es gibt kein Ansehen der Person“, sagt die Schrift (Röm. 2, 11). Von deiner Seele sei fern ein solcher Schmutz: von Neid ist das göttliche Wesen rein und von jedem Fehler der Leidenschaft; darum mögen auch dich derartige Leidenschaften nicht beflecken: weder Neid, noch Hoffart noch anderes dergleichen, was die Schönheit des göttlichen Abbildes in dir entstellen könnte. Wenn du so beschaffen bist, dann fürchte dich nicht, Gott mit vertrautem Namen anzureden und den Herrn des Alls deinen Vater zu nennen. Mit väterlichen Augen wird er auf dich herabsehen, dich bekleiden mit dem göttlichen Gewande und dir den Ring an den Finger stecken. Auch deine Füße wird er mit den Schuhen der frohen Botschaft rüsten zur Wanderung nach oben und dich wieder in das himmlische Vaterland zurückführen, ― in Christo Jesu, unserem Herrn, dem die Herrlichkeit und die Macht gebührt von Ewigkeit zu Ewigkeit. Amen.</p><h2>3</h2><p>Das Gesetz, welches in Umrissen das Schattenbild der künftigen Güter entwirft und in gewissen vorbildlichen Rätseln die Wahrheit schon vorher verkündet, sucht den Hohenpriester, sooft es ihn in das sonst unzugängliche Allerheiligste im Tempel führt, damit er zu Gott bete, vorher mit bestimmten Sühnopfern und Besprengungen zu reinigen. Wenn es ihn darauf mit der priesterlichen Kleidung geschmückt hat, die mit Gold, Purpur und verschiedenem Farbenglanz prächtig geziert war, wenn es ihm die Brustbinde angelegt und die Glöcklein an den Quasten mit den Granatäpfelchen angeheftet hat, wenn es oben auf den Schultern das Überkleid festgeschnürt, das Haupt mit dem Sternband umkränzt und reichlich Salböl ihm ins Haar gegossen hat: dann erst führt es ihn ins Allerheiligste, damit er allein und insgeheim das Opfer darbringe. Der Gesetzgeber des Geistes jedoch, unser Herr Jesus Christus, der das Gesetz von den sinnlichen Einkleidungen befreit und die Rätsel der Vorbilder löst, hat erstens nicht einen einzelnen Mann von der Gesamtheit abgesondert, um ihn allein zum Verkehr mit Gott zu führen, sondern verleiht diese Würde ganz gleichmäßig, da er die Gnade des Priestertums für alle, die sie wünschen, ohne Unterschied bereit hält; zweitens: nicht mit äußerem Schmucke, der nach bestimmtem Farbenmuster und aus sorgsam gefertigtem Gewebe hergestellt wird, kleidet er künstlich den Priester in Schönheit und Pracht, sondern innerer und persönlicher Schmuck ist es, den er ihm anlegt, indem er ihn statt mit einem bunten Purpurgewand mit dem Prachtgewand der Tugend umgibt. Aber auch die Brust schmückt er, nicht mit irdischem Golde, sondern stattet durch ein unversehrtes, reines Gewissen das Herz mit Schönheit aus; dazu fügt er in die Brustbinde auch die Strahlen kostbarer Steine, das heißt die Leuchten der heiligen Gebote, wie der Apostel sie auslegt. Auch mit der Hüftbinde schmückt er jenen Teil, für den sie bestimmt ist; du wirst wohl wissen, daß dieses Gewandstück zur herrlichen Tugend der Keuschheit mahnt. Und wenn der neue Gesetzgeber an die Quasten des Lebens geistige Granatäpfel und Glöckchen gehängt wissen will, so kann man unter denselben passend die auch den Augen der Öffentlichkeit zugänglichen Äußerungen des Tugendstrebens verstehen, durch welche unser Erdenwandel sich auszeichnen soll. Nachdem er also für diese Quasten statt der Glöcklein das wohltönende Wort des Glaubens bestimmte und statt des Granatapfels die zuversichtliche Hoffnung auf die jenseitigen Güter, die gerade im Schatten eines strengeren Lebens erblüht, führt er uns in den innersten Teil des Tempels, der nicht betreten werden darf. Doch ist dieser nicht etwas Lebloses und von Menschenhänden Gebautes, sondern die Geheimkammer unseres Herzens, wenn es in Wahrheit keiner Sünde, ja keinem sündhaften Gedanken Zutritt gewährt. Ebenso ziert er das Haupt statt mit einem metallenen Stirnband mit himmlischer Klugheit, nicht indem er Worte in eine goldene Platte einpreßte, sondern indem er Gott selbst in seine Vernunft abprägte, welche da zur Führerin auf dem Lebensweg berufen ist. Endlich gießt er ein Salböl ins Haar, aber ein solches, das von der Seele selbst duftend bereitet wird. So rüstet der neue Gesetzgeber die Seinigen, in mystischem Opferritus ein Brand- und Schlachtopfer darzubringen ― kein anderes jedoch als sich selbst. Wer sich von ihm auf die geschilderte Weise zum Altare bereiten läßt, hat nämlich das eigene Fleisch mit seinen bösen Begierden zu Tode gebracht mit dem geistigen Opfermesser, welches da das Wort Gottes ist, und daher vermag er Gott zu versöhnen, wenn er in das Allerheiligste kommt, weil er sich selbst zum Opfer eingeweiht und seinen Leib dargebracht hat als „lebendiges, heiliges Opfer für Gott“ (Röm. 12, 1.).</p><p>Freilich wird mancher sagen, daß diese Betrachtungen nicht zu einem besseren Verständnis des Gebetes verhelfen, das uns heute beschäftigen soll, und daß wir über Sachen herumredeten, die gar nicht zu unserem Unterrichtsgegenstand gehören. Doch wenn jemand unsere jetzigen Ausführungen mit den ersten Darlegungen verbindet, die wir bereits über das Gebet gegeben, so erkennt er gewiß einen tadellosen Zusammenhang. Wer nämlich seine Seele so bereitete, daß er zuversichtlich wagen kann, Gott seinen Vater zu nennen, der ist vollauf mit jener hohenpriesterlichen Kleidung angetan, welche uns die Heilige Schrift so genau schildert: er läßt die Glöckchen ertönen und erstrahlt im Schmucke der Granatäpfel; es leuchten um seine Brust die Strahlen der göttlichen Gebote und er trägt auf seinen Schultern die Patriarchen und Propheten, indem er statt ihrer Namen ihre Tugenden zu seiner Ausrüstung nahm. Sein Haupt ziert er mit dem Kranze der Gerechtigkeit; sein Haar ist durchnetzt mit Balsam aus dem Himmel, und er befindet sich in einem überirdischen Allerheiligsten, das für jeden unheiligen Gedanken vollständig unzugänglich und unbetretbar ist.</p><p>Doch, wie der Betende gerüstet sein soll, hat unsere Rede an der vorbildlichen Kleidung des Hohenpriesters genügend gezeigt. Es dürfte daher angemessen sein, die Bitte selbst ins Auge zu fassen, die nach dem Willen des Herrn der in das Allerheiligste Eingetretene Gott vortragen soll. Denn wenn wir sie uns in ihrem Wortlaute vorführen, so scheint uns die Bitte keineswegs leicht verständlich zu sein.</p><p>„Geheiligt werde dein Name,“ heißt es, „zu uns komme dein Reich!“ „Welchen Wert haben wohl diese Worte in meiner Not?“ ― könnte vielleicht jemand sagen, der entweder für die begangenen Sünden in bitterer Reue Buße tut oder zur Errettung aus der Versuchung, die ihn mächtig bedrängt, Gott zu Hilfe rufen möchte. Vor seinem Blicke steht drohend immerdar derjenige, der ihm durch Anreizung zur Sünde unaufhörlich zusetzt: hier suchen Zornesausbrüche den Verstand außer Fassung zu bringen; dort wollen törichte Begierden die Spannkraft der Seele entnerven; wieder von einer anderen Seite zieht die Habsucht den Schleier der Blindheit über das sonst so klare Auge des Geistes; oder auch Hochmut, Stolz, Haß und die ganze übrige Reihe der wider uns kämpfenden Feinde umlagern wie ein wütender Haufe, der uns umkreist, unsere Seele und stürzen sie in die äußerste Gefahr. Wer nun nach einem mächtigeren Helfer gegen solche Feinde sich sehnt, um ihnen zu entrinnen: welche Worte könnte dieser mit größerem Rechte gebrauchen, als die des großen David, der da also flehte: „Möge ich gerettet werden aus der Hand derer, die mich hassen!“ (Ps. 68, 15 [hebr. Ps. 69, 15]) oder „Rückwärts mögen sich wenden meine Feinde!“ (Ps. 55, 10 [hebr. Ps. 56, 10]) und „Verleihe uns, o Gott, deine Hilfe in unserer Bedrängnis!“ (Ps. 59, 13 [hebr. Ps. 60, 13]) oder wie immer die Anrufungen lauten, durch die wir uns den Beistand Gottes gegen unsere Widersacher herabrufen könnten. Was sagt nun dagegen das Gebet, das der Herr uns aufgetragen? „Geheiligt werde dein Name!“ Wie? Wäre es denkbar, daß, wenn wir nicht darum bitten, der Name Gottes nicht heilig wäre? Und brauchen wir zu beten: „Zu uns komme dein Reich“? Was wäre denn dem Reiche oder der Macht Gottes nicht unterworfen? ― Gottes, der mit seiner Spanne den ganzen Himmel umfaßt, wie Isaias sagt (40, 12) ― Gottes, der dem Festland mit Allgewalt gebietet und das Meer völlig beherrscht, ― Gottes, der die ganze Schöpfung, sowohl die irdische wie die überirdische, auf seinen Händen trägt? Wenn also der Name Gottes immer schon heilig ist, und nichts der Herrschaft Gottes sich entziehen kann, vielmehr Gott ohnehin alles und jedes beherrscht und an Heiligkeit, weil durchaus fehlerlos und ganz vollkommen, nicht mehr zunehmen kann, was bedarf es noch der Bitte: „Geheiligt werde dein Name, zu uns komme dein Reich“?</p><p>Oder gibt uns vielleicht das göttliche Wort in der Form dieser Bitte die Lehre, daß die menschliche Natur aus sich ohnmächtig ist, Gutes zu erreichen, und daß all unser Streben nicht ans Ziel kommt, wenn Gottes Hilfe nicht mit uns ist? Das höchste und notwendigste Gut besteht nun darin, daß der Name Gottes durch mein Leben verherrlicht werde. Was aber hiermit gemeint ist, dürfte uns klar werden, wenn wir das Gegenteil in Betracht ziehen. Irgendwo in der Heiligen Schrift habe ich gelesen, daß sie jene verdammt, welche sich einer Lästerung Gottes schuldig machen. So sagt sie: „Wehe denen, durch die mein Name unter den Völkern gelästert wird!“ (Is. 52, 5; Röm. 2, 21). Dies Wort ist also zu verstehen: alle, welche noch nicht an die Verkündigung der Wahrheit glauben, schauen begierig auf das Leben derer, welche sich zu dem Glauben an die hochheilige Lehre bekennen. Wenn nun manche zwar den Namen eines Gläubigen angenommen haben, ihr Leben aber diesem Namen widerspricht, weil sie entweder durch Habsucht Götzendienst treiben oder in Trunkenheit und Ausgelassenheit den Anstand verletzen oder sich im Schlamme der Liederlichkeit wie Schweine wälzen: so kann man von Seiten der Ungläubigen gar leicht Reden hören, die ihre Anklage nicht gegen die Gesinnung derer richten, die ein schlechtes Leben führen, sondern sich dahin äußern, die heilige Lehre gestatte ein solches. Hiebei lassen sie sich von der Ansicht leiten: der oder jener Gläubige würde nicht so schmähsüchtig, habgierig, räuberisch oder sonst so schlecht sein, wenn es nicht von seiner Religion irgendwie erlaubt wäre. Deshalb richtet die Heilige Schrift gegen solche Gläubige eine schwere Drohung, indem sie ihnen zuruft: „Wehe denen, durch welche mein Name unter den Völkern gelästert wird.“</p><p>Dieser Schriftstelle entgegengesetzt ist unser Gebetswort; es dürfte an der Zeit sein, es reiflich zu erwägen. So muß ich denn, glaube ich, vor allem darum beten und das zur Hauptangelegenheit meines Gebetes machen, daß der Name Gottes durch mein Leben nicht gelästert, sondern verherrlicht und geheiligt werde. Durch dich demnach, will der Herr sagen, soll mein herrlicher Name, den du anrufst, geheiligt werden, „auf daß die Menschen die guten Werke sehen und den Vater preisen, der im Himmel ist“ (Matth. 5, 46). Wer ist so tierisch und unvernünftig, um, wenn er an den Gottesgläubigen ein Leben sieht, ganz lauter, von Tugend getragen, rein sich haltend von allen Befleckungen der Sünde, selbst jedem geheimen bösen Gedanken abgeneigt, leuchtend durch seine Keuschheit, ehrwürdig durch seine Klugheit, voll männlicher Kraft gegen die Anstürme der Leidenschaft streitend, nach keiner Seite sinnlicher Verweichlichung nachgebend, von Üppigkeit, Schlaffheit und Stolz ganz entfernt, an der Welt nur soweit teilhabend, als es durchaus notwendig ist, gleichsam nur mit der Fußspitze die Erde berührend, nicht durch Sinnengenuß in dieses Leben sich vergrabend, sondern über jeder Täuschung, welche durch das Sinnenleben entsteht, hoch stehend, obgleich mit dem Fleische belastet, eifrig nach einem gleichsam körperlosen Leben strebend, nur einen Reichtum kennend, den Besitz der Tugend, nur einen Adel, die Verwandtschaft mit Gott, nur eine Würde und nur eine Macht schätzend, die der Selbstbeherrschung und der Zügelung der Leidenschaften, die lange Dauer des Erdenlebens als Beschwerde fühlend, voll Sehnsucht wie bedrängte Seefahrer, nach dem Hafen der Ruhe zu gelangen ― wer, sage ich, könnte solche Gläubige sehen, ohne den Namen zu preisen, der zu einem derartigen Leben angerufen wird. Wer also betet: „Geheiligt werde dein Name durch mich“, spricht dem Sinne nach zu Gott etwa also: „Möchte ich mit dem Beistand deiner Gnade untadelig, gerecht, gottesfürchtig werden, ein Mensch, der sich jeder schlechten Tat enthält, die Wahrheit redet, Gerechtigkeit übt, in Geradheit wandelt, durch Keuschheit leuchtet, mit Unverdorbenheit sich schmückt, mit Weisheit und Mäßigkeit sich ziert, nach dem trachtet, was oben ist, das Irdische geringschätzt, durch engelgleiches Betragen glänzt!“ Dies und Ähnliches umfaßt die kurze Bitte: „Geheiligt werde dein Name!“ Denn unmöglich kann Gott durch uns anders verherrlicht werden als dadurch, daß die Tugend, die wir betätigen, auf die göttliche Macht, als auf die Ursache und Quelle des Guten hinweist.</p><p>Das folgende Wort fleht, daß das Reich Gottes kommen möge. Verlangt es etwa, derjenige solle erst König werden, welcher der König des Alls ist, der immer schon ist, was er ist, der, während alles andere steten Wechsel erleidet, allein unveränderlich ist, der keine höhere Machtfülle finden kann, zu der er sich erheben könnte? Was will also die Bitte, welche nach dem Reiche Gottes ruft? Freilich, ihren vollen Sinn werden jene erkennen, denen der Geist der Wahrheit die verborgenen Geheimnisse enthüllt; wir aber haben etwa folgendes als die Bedeutung der Bitte gefunden. Eine einzige Macht und Stärke gibt es, die über das ganze Universum gesetzt ist, die alles leitet und regiert, ohne durch Vergewaltigung und Tyrannei, durch Mittel der Furcht und des Zwanges, alles, was ihr untergeben ist, unter das Joch der Botmäßigkeit zu zwingen; denn frei von Furcht soll die Tugend sein und ohne Knechtung; mit freier Entscheidung soll sie das Gute wählen. Das Wesen des Guten besteht aber stets in der Unterordnung unter jene Macht, von der alles Dasein und Leben stammt. Nachdem nun die menschliche Natur von der Fähigkeit, das Gute zu erkennen, durch Täuschung sich hat abbringen lassen, nachdem die Schwerkraft unseres Willens dem Verbotenen sich zuneigt und das Leben der Menschen allen Unvollkommenheiten unterworfen ist, da der Tod tausend Wege kennt ― jede Erscheinungsform des Bösen wird ja gleichsam ein Weg, auf dem der Tod uns naht ― nachdem wir also von solcher Gewaltherrschaft eingeengt sind und von den anstürmenden Leidenschaften wie von Henkern und Feinden alle Augenblicke dem Tode überantwortet werden, so flehen wir mit Recht, Gottes Reich und Herrschaft möge zu uns kommen. Denn nur dann sind wir imstande, der Todesherrschaft mit all ihren Schrecken zu entrinnen, wenn jene Macht, die allein Leben zu spenden vermag, ihre gütige Herrschaft über uns führt. Wenn wir also die Bitte stellen, es möge das Reich zu uns kommen, so flehen wir damit Gott dem Sinne nach ungefähr also an: gerettet möge ich werden vom Untergang, befreit werden vom Tode, losgelassen aus den Fesseln der Sünde; nicht mehr solle herrschen über mich der Tod, nicht mehr soll wirksam sein die Zwangsherrschaft des Bösen, nicht soll Gewalt über mich haben der Feind, nicht die Sünde mich gefangennehmen; nein, kommen soll zu mir dein Reich, auf daß von mir zurückweichen oder vielmehr in das Nichts übergehen die Leidenschaften, die mich jetzt zu beherrschen und zu knechten suchen! Denn wie der Rauch vergeht, so werden sie vergehen, und wie Wachs vor dem Αngesichte des Feuers, so werden sie verschwinden. Weder läßt der Rauch, sobald er in die Luft emporgestiegen, eine Spur von seinem Wesen zurück; noch wird das Wachs, wenn es ins Feuer geworfen ist, mehr gefunden, sondern auch dieses wird, nachdem es mit seinem Stoff die Flamme genährt hat, in Dunst und Luft verwandelt, und der Rauch tritt in völliges Nichts über. Ähnlich wird, wenn das Reich oder die Herrschaft Gottes zu uns kommt, alles, was bisher die Herrschaft geführt hat, in das Nichts gestürzt werden. Denn die Finsternis verträgt nicht die Gegenwart des Lichtes; nicht bleibt die Krankheit im Körper, wenn die Gesundheit einzieht. Und so weicht die Leidenschaftlichkeit, wenn mit dem Reiche Gottes Leidenschaftslosigkeit in die Seele eingetreten ist; dahin ist der Tod und verschwunden die Verderbnis, wenn das Leben in uns zur Herrschaft gelangt ist und die Unverderbbarkeit (aus Ber.: lies: „Unverderbbarkeit“ statt „Underbbarkeit“) die Oberhand gewonnen hat.</p><p>O süßes Wort: „Zu uns komme dein Reich“! Durch dasselbe tragen wir ungefähr folgende Bitte Gott vor: vernichtet werde die Schlachtreihe, verschwinden mögen die Heereshaufen der Feinde; beendet werde der Krieg des Fleisches gegen den Geist; nicht sei der Leib ein Stützpunkt des Feindes unserer Seelen; es erscheine mir die Macht des Königs, das Heer der Engel, die Tausende der Gewalten, die Zehntausend, die zu seiner Rechten stehen, auf daß auf der Seite des Widersachers tausend Streiter fallen! Zahlreich zwar ist der Gegner, aber nur für den von deiner Hilfe Verlassenen furchtbar, und unbesiegbar bloß so lange, als der Bekriegte allein steht. Wenn aber dein Reich anbricht, so entweichen Trauer und Jammer; dafür kehren ein Leben, Freude, Frohlocken!</p><p>Rufen wir aber nicht mit der Bitte, Gottes Reich möge zu uns kommen, nicht auch zugleich die Hilfe des Heiligen Geistes an, wie uns Lukas den nämlichen Gedanken noch klarer erläutert? Statt: „Zu uns komme dein Reich“ heißt es nämlich (― nach einer spärlich bezeugten Lesevariante ―) in seinem Evangelium: „Der Heilige Geist komme zu uns und reinige uns.“ Was werden nun die frechen Redner gegen den Heiligen Geist angesichts dessen sagen? Wie können sie nunmehr ihren Versuch aufrechthalten, die Hoheit des Reiches in die Niedrigkeit der Knechtschaft zu verwandeln? Was nämlich Lukas* Heiligen Geist* nennt, nennt Matthäus* Reich.* Wie können sie es verantworten, wenn sie trotzdem den Heiligen Geist zu einer untergeordneten Kreatur herabziehen und ihn statt mit der herrschenden, mit der beherrschten Natur auf gleiche Linie stellen? Die Kreatur dient. Dienen ist aber gleichbedeutend mit Beherrschtwerden. Nun bedeutet der Heilige Geist, wie es sich aus dem angeführten Vergleich des ersten mit dem dritten Evangelium ergibt, das Reich und die Herrschaft Gottes; ist er aber Reich und Herrschaft, so folgt notwendig, daß er herrscht und nicht beherrscht wird. Wird er aber nicht beherrscht, so ist er auch nicht etwas Geschaffenes; denn alles, was geschaffen ist, muß seinem Begriff nach unbedingt beherrscht werden oder dienen. Wenn nun der Heilige Geist unleugbar Gottes Reich und Herrschaft in sich schließt, mit welchem Recht weigern sich jene, ihm die unbeschränkte Herrschermacht einzuräumen, sie, die niemals beten gelernt haben, sie, die auch nicht einmal wissen, was der sein muß, der die befleckten Seelen zu reinigen vermag, und was der, der Gottes Herrschaft übernommen hat. Es heißt ja ausdrücklich: „Es komme dein Heiliger Geist und reinige uns!“ Also ist dem Heiligen Geiste als besondere Kraft und Wirksamkeit die Fähigkeit eigen, die Seele zu läutern und die Sünden nachzulassen, wie es eben das Evangelium klar bezeugt. Mit diesem Zeugnis aber, daß er die Macht der Sündenvergebung besitze, hat es auch zugleich Zeugnis von seiner Gottheit abgelegt. Die nämliche Aussage macht der Apostel über den Eingebornen, nämlich daß er, nachdem er Sündenreinigung bewirkt, zur Rechten der Herrlichkeit des Vaters sich gesetzt habe (Hebr. 1, 3). Demnach bewirken beide dasselbe: der Geist, der uns reinigt, und Christus, der die Reinigung von Sünden bewerkstelligt hat. Diejenigen aber, welche dieselbe Wirkung hervorzubringen vermögen, haben auch dieselbe Macht; denn jede Wirkung ist die Äußerung einer Macht. Wenn also sowohl die Wirksamkeit als auch die Macht ganz dieselbe ist, wie wäre es dann möglich, an eine Verschiedenheit der Natur bei solchen zu denken, bei denen wir keinen Unterschied der Macht und Wirksamkeit ausfindig machen können? Es geht durchaus nicht an, falls die beiden Merkmale des Feuers: Leuchten und Brennen in ganz gleicher Weise auftreten, auf wesensverschiedene Ursachen zu schließen; ebensowenig kann ein Vernünftiger, sobald er aus der Schrift ersieht, wie der Sohn und der Heilige Geist die ganz gleichen Wirkungen hervorbringen, irgendwie annehmen, Sohn und Geist besäßen eine verschiedene Natur.</p><p>Schon früher wurde ferner durch Aussprüche der Heiligen Schrift bewiesen, daß der Vater und der Sohn die nämliche Natur haben, da es nicht möglich ist, Wesen verschiedener Art den Namen „Gott“ zu geben. Nie wird auch z. B. eine Bank als ein Sohn des Zimmermanns bezeichnet, und kein Vernünftiger wird sagen, ein Baumeister habe ein Haus gezeugt, sondern mit dem Namen Vater und Sohn wird erklärt, daß beide der Natur nach zusammengehören. Daraus folgt mit Notwendigkeit: wenn zwei ein und demselben Dritten gleich sind, so können sie auch unter sich nicht verschieden sein. Wenn also der Sohn mit dem Vater gleichen Wesens ist, wenn ferner durch die Identität ihrer Wirkung bewiesen wird, daß der Sohn und der Heilige Geist der Natur nach gleich sind, so ergibt sich daraus die Folgerung: die Natur der heiligen Dreifaltigkeit ist nur eine, ohne daß sich aber die einzelnen Personen, weil an jeder eine besondere Eigentümlichkeit wahrzunehmen ist, miteinander vermengen ließen, und ohne daß sie diese besonderen Merkmale gegenseitig vertauschen könnten. Welcher Wahnwitz ist es also, wenn die Bekämpfer des Heiligen Geistes behaupten, der Geist diene! Ihnen ist nicht einmal das Zeugnis des heiligen Paulus maßgebend, der da sagt: „Der Herr aber ist der Geist“ (2 Kor. 3, 17). Oder meinen sie vielleicht gar, der Ausdruck: „er möge zu uns kommen“, wäre geeignet, seine Würde herabzusetzen? Da würden sie nicht einmal auf den großen David achten, der sogar den Vater zu sich herabziehen möchte, indem er fleht: „Komme, uns zu retten“ (Ps. 79, 3 [hebr. Ps. 80, 3]). Wenn also das Kommen beim Vater ehrenvoll ist, wie soll es dann beim Geiste entwürdigend sein? Oder wollen sie in dem Reinigen von Sünden ein Anzeichen dafür sehen, daß er an Würde dem Vater und dem Sohne nachstehe? Nun höre, wie die ungläubigen Juden schreien, daß Sündenvergebung einzig Sache Gottes sei, wobei sie den Vater im Auge haben. So wird ja berichtet: „Was redet dieser Lästerungen! Wer kann Sünden vergeben außer Gott allein?“ (Mark. 2, 7). Wenn demnach der Vater Sünden nachläßt, der Sohn aber die Sünden der Welt hinwegnimmt und der Heilige Geist alle von den Befleckungen der Sünde reinigt, in welche er kommt, was werden dann noch diejenigen einwenden können, welche gegen ihr eigenes Leben (d. i. gegen den Heiligen Geist) ankämpfen?</p><p>Doch es komme zu uns der Heilige Geist, er reinige uns und befähige uns, die erhabenen, gotteswürdigen Gedanken aufzunehmen, die uns in den Gebetsworten durch den Mund des Heilandes geoffenbart werden, dem Ehre sei von Ewigkeit zu Ewigkeit. Amen.</p><h2>4</h2><p>Einen Arzt hörte ich einmal auf Grund seiner medizinischen Kenntnisse über die natürlichen Voraussetzungen der Gesundheit sprechen. Vielleicht leisten seine Ausführungen einen nützlichen Beitrag zur Gesunderhaltung der Seele. Nach ihm läßt sich nämlich jede Krankheit auf eine Verrückung des richtigen Verhältnisses zurückführen, in welchem die verschiedenen Bestandteile unseres Körpers zueinander stehen sollen; und umgekehrt besteht die Heilung der Krankheit in der Zurückversetzung der zu Unrecht verschobenen Teile in die ihnen zukommende naturgemäße Ordnung. Daraus folgerte er, man solle zuerst untersuchen, welches von den Elementen, die in uns in Unordnung gerieten, am meisten den Einfluß des gerade entgegengesetzten Grundstoffes schwächt, der zur Gesundung mitzuwirken berufen ist. Wenn daher z. B. die Hitze überhand nimmt, so müsse man allen davon betroffenen Teilen zu Hilfe kommen und ihnen, bevor sie austrocknen, Feuchtigkeit zuführen, damit nicht etwa durch Vernichtung des Stoffes die Wärme völlig verzehrt werde und in sich selbst erlösche. Desgleichen solle man auch, wenn eine der anderen körperlichen Kräfte, die nach dem Prinzip des Gegensatzes in Betracht kommen, ihre Grenze überschreitet, dem übermächtig gewordenen Teile entgegentreten und dem geschwächten die Hilfe der ärztlichen Kunst angedeihen lassen. Wenn dies geschieht und nichts mehr das Gleichgewicht der Elemente stört, ist die Gesundheit wieder hergestellt, weil die Unordnung aufgehoben ist. Doch wozu diese lange Einleitung zu meiner Rede? Ich hoffe aber, daß die vorgetragene ärztliche Theorie ganz gut zu unserem Zwecke paßt und von unserem heutigen Thema nicht abseits liege. Zur Erwägung soll zunächst die Bitte kommen: „Dein Wille geschehe!“ Alsbald werden wir sehen, warum wir an die arzneiwissenschaftlichen Grundsätze erinnert haben.</p><p>Einstens erfreute sich die Menschheit voller geistiger Gesundheit, da sozusagen ihre Grundstoffe, ich meine die Regungen der Seele, in schönster Ordnung und Eintracht im Sinne der Tugend zusammenwirkten. Als aber die Begierde nach dem Bösen die Oberhand gewann, und die ihr entgegengesetzte Selbstbeherrschung von jenem übermächtigen Teile besiegt war, und es nichts gab, was den überschäumenden Drang nach dem Unerlaubten hätte zurückweisen können, da gesellte sich eine den Tod bringende Krankheit, die Sünde, zur menschlichen Natur. Der wahre Arzt der Seelenkrankheiten nun, welcher aus Liebe zu den Kranken in das menschliche Leben eintrat, beseitigt durch die Unterweisungen, welche er im Gebete erteilt, die Ursachen der Krankheit und führt uns wieder zur geistigen Gesundheit zurück. Die Gesundheit der Seele besteht nun in der Entschlossenheit, immerdar den Willen Gottes zu tun, wie umgekehrt das Aufgeben dieser Bereitwilligkeit in die Seele die Krankheit trägt, die schließlich zum Tode führt. Nachdem nun der Mensch durch das Gift des Ungehorsams, das er reichlich in sich aufgenommen, in schwere tödliche Krankheit gefallen und verurteilt war, das herrliche Leben des Paradieses zu verlassen, da erschien der wahre Arzt, um, wie es die anfangs dargelegte ärztliche Theorie verlangt, das Übel durch entgegengesetzte Mittel zu heilen; weil wir dadurch von Krankheit ergriffen wurden, daß wir uns vom Willen Gottes trennten, so heilt er uns dadurch von unseren Leiden, daß er uns wieder mit dem Willen Gottes vereinigt. So aufgefaßt, bewirken die Worte des Gebetes die Heilung unserer Seelenkrankheit. Wer nämlich ausruft: „Dein Wille geschehe“, betet, wie wenn seine Seele gleichsam von Schmerzen heimgesucht wäre. Der Wille Gottes aber ist das Heil der Menschen. Wenn wir uns nun entschließen, zu Gott zu sagen: „Dein Wille geschehe auch in mir“, so müssen wir vorher jenem Leben widersagen, das im Gegensatz zum göttlichen Willen steht, und ungefähr folgende Meinung mit unserem Gebete verbinden: „Während meines früheren Lebens trieb ein Wille, der dem deinigen, o Gott, entgegengesetzt war, in mir sein Unwesen und ich war ein Knecht des höllischen Zwingherrn, so daß ich gleichsam wie ein Henker die Blutbefehle jenes bösen Feindes an mir selbst ausführte; erbarme dich über meine Verkommenheit und gib, daß endlich dein heiliger Wille in mir geschehe! Wie nämlich in den dunklen Winkeln der Höhlen, sobald man ein Licht hineinbringt, die Finsternis verschwindet, so weicht, wenn dein Wille in mir geschieht, alsbald jene schlechte, ungehörige Regung des Willens!“ Denn die Mäßigung wird das zügellose leidenschaftliche Begehren des Herzens stillen, die Demut den Hochmut vernichten, die Bescheidenheit die Krankheit der Selbstüberhebung heilen, die Tugend der Liebe auch die längste Reihe von Lastern aus der Seele vertreiben. Vor ihr flieht der Haß, der Neid, der Groll, der Zorn, die verdrießliche Stimmung, die Hinterlist, die Heuchelei, die Erinnerung an Kränkungen, das Verlangen nach Rache, das Aufwallen des Herzblutes, der gehässige Blick: überhaupt die ganze Schar der Laster wird durch die Gesinnung der Liebe in die Flucht geschlagen. Zumal vertreibt der Wille Gottes, wenn er in uns zur Entfaltung kommt, den zweifachen Götzendienst: den Wahnsinn mit den Götterbildern und den mit Silber und Gold, die ein Prophetenwort „die Götzenbilder der Heiden“ nennt. „Es geschehe also dein Wille“, damit der Wille des Teufels zunichte werde.</p><p>Weshalb beten wir aber, daß von Gott her uns der Wille zum Guten zuteil werde? Deshalb, weil die menschliche Natur zum Guten zu schwach ist, nachdem sie die Kraft hiezu durch die Sünde einbüßte. Denn keineswegs mit derselben Leichtigkeit, mit welcher sich der Mensch zum Bösen wendet, kehrt er von diesem wieder zum Guten zurück, wie sich auch am Leib ein ähnliches Verhältnis bemerken läßt; nicht auf die gleiche Weise und nicht mit derselben Leichtigkeit wird nämlich das Gesunde krank und das Kranke gesund. Oft kam ein bis dahin ganz rüstiger Mann durch eine einzige Verwundung in die äußerste Gefahr; ein einziger Fieberanfall oder eine Wiederholung desselben lähmte schon die ganze Spannkraft des Körpers, eine geringe Giftdosis schwächte oder zerstörte sie; auf den Biß einer Schlange, auf den Stich eines giftigen Insektes, auf bloßes Ausgleiten oder Fallen, auf eine Übersättigung oder auf etwas Ähnliches erfolgte nicht selten rasch eine Erkrankung oder sogar der Tod. Die Beseitigung der Krankheit hingegen erfordert, wenn sie überhaupt erzielt wird, in der Regel reifliche Überlegung, die Ertragung vieler Beschwerden und den Aufwand großer ärztlicher Kunst. Dem entspricht es auf geistigem Gebiete, daß wir zum Fortschreiten auf der Bahn des Bösen, keinen Helfer benötigen, weil das Böse in unserem verderbten Willen wie von selbst zur vollen Entfaltung sich entwickelt; soll sich aber die Wagschale zum Guten neigen, so brauchen wir die Hilfe Gottes, damit er das Wollen bis zum Vollbringen geleite. Darum geht unsere Bitte dahin: „Da dein Wille, o Herr, die Mäßigung selbst ist, ich aber fleischlich gesinnt und unter die Herrschaft der Sünde verkauft bin, so möge der Wille zum Guten durch deine Kraft in mir hergestellt werden: die Gerechtigkeit, die Frömmigkeit, die Zügelung der Leidenschaften!“ Denn der Begriff Wille schließt sämtliche Tugenden keimhaft in sich und der Wille Gottes enthält alles Gute, was wir nur denken können.</p><p>Doch was bedeutet der Zusatz: „Wie im Himmel, also auch auf Erden“? Dies Wort weist, wie mir scheint, auf eine tiefere Wahrheit hin und leitet zu einer Auffassung der gesamten Schöpfung ein, wie sie Gottes würdig ist. Was ich meine, läuft auf folgendes hinaus: die vernünftigen Geschöpfe lassen sich in solche mit einem Körper und in solche ohne Körper einteilen; die körperlose Klasse bilden die Engel, die körperliche wir Menschen. Weil des schwerfälligen Leibes ledig - ich meine unseren festen, zur Erde niederziehenden Leib - bewegen sich die reinen Geister in jener Region der Welt, die oberhalb der Erde ist, wo sie mit ihrer flüchtigen und rasch beweglichen Natur an leichten und ätherischen Orten wohnen; wir dagegen haben wegen der Verwandtschaft unseres Leibes mit der Erde das irdische Leben, das einem schmutzigen Bodensatz gleicht, als Anteil erhalten, dem wir nicht entfliehen können. Ich kann nicht unfehlbar sagen, was Gott hiebei bezweckte: vielleicht wollte er die ganze Schöpfung unter sich dadurch verwandt machen, daß weder die Erde hier unten ohne allen Anteil an dem Himmel droben wäre noch der Himmel ohne Anteil an der Erde, insofern im Menschengebilde beide eine Vereinigung ihrer Gegensätze feiern, die ihr Begriff mit sich bringt. Denn einerseits wohnt die geistige Seele, die doch gleicher Abstammung und gleichen Geschlechtes mit den Engeln des Himmels zu sein scheint, in Leibern, die aus der Erde ihren Ursprung ableiten; andererseits wird dies aus der Erde genommene Fleisch bei der Wiederherstellung aller Dinge in das Reich des Himmels zugleich mit der Seele versetzt. Der Apostel sagt ja: „Wir werden auf den Wolken dem Herrn entgegen dahingerafft werden in die Luft und immerdar beim Herrn sein“ [1 Thess. 4, 17]. Mag nun die Weisheit Gottes dieses oder noch etwas anderes bezwecken, tatsächlich sind die mit Vernunft begabten Geschöpfe in diese zwei Klassen geschieden und dabei ist die körperlose Natur zur himmlischen Seligkeit berufen worden, die körperliche dagegen wurde wegen ihrer Verwandtschaft mit der Erde auf diese verbannt. Doch beide Naturen, die körperliche und körperlose, haben große Vorzüge gemeinsam: vor allem ist das Verlangen nach dem sittlich Guten mit dem Wesen beider Naturen in gleichem Grade verbunden, und die Persönlichkeit, Unabhängigkeit und Freiheit hat der Herr des Weltalls beiden gleichmäßig anerschaffen, so daß alle Geschöpfe, welche mit Vernunft und Denkvermögen ausgestattet sind, durch ihre eigene freie Willensentscheidung sich selbst bestimmen und leiten. Allein das überirdische Leben ist in jeder Beziehung frei von Unvollkommenheit und auch nicht der geringste Schatten von Unordnung findet sich in demselben; dagegen umgibt jede Art von leidenschaftlicher Erregung und Stimmung das Leben hier unten; das Menschengeschlecht ist hievon wie umlagert. Das göttliche Wort bezeugt, daß das Leben der heiligen Mächte ([d. i. der Engel] frei von Unvollkommenheit und unberührt von jeglicher sündhafter Befleckung ist; alles Böse aber, was es außerhalb des Guten, eben durch die Trennung von diesem überhaupt gibt, ist in die Niederung dieses Erdenlebens wie eine Art Hefe oder Schlamm zusammengeschlossen, und dadurch wird die Menschheit verunreinigt, weil es durch solche Finsternis verhindert wird, das göttliche Licht der Wahrheit zu schauen.</p><p>Wenn nun das Leben da droben kein Übel und keine Sünde kennt, das armselige Leben hienieden aber in mannigfache Leidenschaften und Mühseligkeiten versenkt ist, so wird offenbar jenes überirdische Leben, weil rein von jeglicher Unvollkommenheit, in seinem makellosen Zustand durch die Erfüllung des Willens Gottes erhalten - denn wo nichts Böses ist, muß mit Notwendigkeit Gutes sein - unser Leben auf Erden dagegen ist dadurch, daß es aus der engen Verbindung mit dem sittlichen Guten austrat, auch aus dem Willen Gottes ausgetreten. Deshalb werden wir durch das Gebetswort aufgemuntert, unser Leben so von allem Bösen zu reinigen, daß nach dem Vorbild des Lebens im Himmel auch in uns der göttliche Wille restlos zur Geltung und Herrschaft komme. Wir sagen mit unserer Bitte gleichsam zu Gott: „Wie von den Thronen, Mächten und Gewalten und überhaupt von dem ganzen überirdischen Heere dein Wille geschieht und das Böse in keiner Weise die Entfaltung des Guten hindert, so gelange das Gute auch in uns zur vollen Verwirklichung, damit nach Beseitigung jeder Unvollkommenheit dein Wille einen wohlbereiteten Weg in unsere Seele finde!“</p><p>Aber, könnte jemand einwenden, wie ist es möglich, daß die Menschen, denen ein Leben im Fleische beschieden worden, die Reinheit der körperlosen Mächte erreichen, sie, deren Seele infolge der körperlichen Bedürfnisse in unzählige Schwierigkeiten verstrickt ist? Einen derartigen Einwand scheint nun Gott zu beseitigen, indem er in der folgenden Bitte alles aus dem Wege räumt, was dem Streben nach voller Gleichförmigkeit mit dem Willen Gottes hinderlich sein könnte. Denn, soweit ich sehe, verkündet er durch diese Worte, in denen er uns befiehlt, um das tägliche Brot zu bitten, die Lehre, die Menschen würden dadurch, daß sie genügsam sind und in allem Maß halten, in bezug auf Leidenschaftslosigkeit den Engeln gleich, welche ihrer Natur nach über alle körperlichen Bedürfnisse erhaben sind. Die Engel bitten nämlich in ihren Gebeten Gott nicht um Darreichung von Brot, weil sie dergleichen nicht bedürfen; um Brot zu bitten, wurde nur den Menschen befohlen, weil das, was verbraucht wird, notwendig Ersatz heischt. Flüchtig wie die Welle und vergänglich ist die menschliche Natur in ihrer ganzen Anlage, und für das Verbrauchte muß sie eine Ergänzung suchen. Wer nun bloß den Fortbestand seines Wesens im Auge hat und nicht, durch törichte Sorgen verleitet, Unnötiges anhäuft, wird nicht weit hinter dem Leben der Engel zurückbleiben, indem er ihrer Bedürfnislosigkeit seinerseits durch seine Genügsamkeit nacheifert. Deshalb wurde uns aufgetragen, zu Gott zu sprechen: „Gib uns unser Brot!“ und auf diese Weise lediglich um das zu bitten, was zur Erhaltung des leiblichen Daseins ausreicht, nicht um Üppigkeit und Reichtum, nicht um farbenprächtige Purpurgewänder, nicht um Goldschmuck und glitzernde Edelsteine, nicht um Silbergeschirr, nicht um Überfluß an Landbesitz, nicht um den Oberbefehl über Heerhaufen, nicht um die Herrschaft über Städte und Völker, nicht um Herden von Pferden und Rindern oder um große Mengen von anderem Vieh, nicht um Überfluß an Sklaven, nicht um glanzvolles Auftreten auf öffentlichen Plätzen, nicht um Gedenksäulen, nicht um Seidengewebe, nicht um musikalischen Ohrenschmaus oder um sonst Derartiges, wodurch die Seele von dem ungleich wichtigeren Streben nach Gott abgezogen wird, sondern nur um unser tägliches Brot.</p><p>Siehst du die Tiefe der Weisheit und die Fülle von Lehren, welche dieses kurze Wort in sich birgt! Ganz offen beinahe ruft der Herr damit allen, die es verstehen wollen, zu: Höret auf, ihr Menschen, euch in Begierden nach törichten Dingen zu verlieren; höret auf, euch selbst noch mehr Quellen von Schwierigkeiten zu schaffen! Wenig nur ist es, was du im Hinblick auf deine Menschennatur wirklich notwendig hast; Nahrung bist du deinem armseligen Fleisch schuldig, ― eine Kleinigkeit und leicht zu beschaffen, wenn du im Ernst nur auf das Bedürfnis schaust! Warum vermehrst du selbst deine Steuersumme dem Leibe gegenüber? Warum hast du dich mit so vielen Schulden an ihn beladen, zu deren Abtragung du nun Silber ausgräbst, Gold aus der Tiefe holst und nach glänzendem Stoffe ausspähest? Damit dir durch solcherlei Dinge der nimmersatte Abgabenforderer, der Bauch, in Überfluß schwelge? Er bedarf doch nur des Brotes, das dem Leibe alles bietet, was er zu seinem Fortbestehen braucht! Du aber ziehst bis zu den Indern, setzest dich auf weitem Meere allen Gefahren aus, begibst dich jahraus jahrein auf Seefahrten, um mit aus großer Ferne bezogenen Waren deine Nahrung zu würzen, ohne zu bedenken, daß das Gefühl des Wohlgeschmackes sich nur auf den Gaumen erstreckt! Ebenso gewährt das, was schön aussieht, wohl riecht und angenehm mundet, nur ein hinfälliges, kurzes Behagen. Vom Gaumen an läßt sich kein Unterschied der genossenen Speisen mehr erkennen, weil die Natur alles in gleicher Weise in eine übelriechende Masse verwandelt. Siehst du das Ende aller Kochkunst? Siehst du den schließlichen Ausgang der ganzen Zauberei, mit der man Leckerbissen bereitet? Um das Brot bitte, weil du es zum Leben brauchst. Alles aber, was die Schwelger durch vieles Nachgrübeln außerdem noch ausfindig machen, gehört zum Unkraut, das daneben gesät wurde. Die Aussaat des Hausvaters ist der Weizen und aus dem Weizen wird das Brot bereitet; die Schwelgerei aber ist das Unkraut, das vom Feinde unter den Weizen gesät wurde (Luk. 8. 14). Wenn aber die Menschen es verschmähen, unserer Natur bloß mit den ihr wirklich unentbehrlichen Mitteln den notwendigen Dienst zu leisten, so ersticken sie förmlich, wie das göttliche Wort irgendwo sagt (Mark. 4, 7. 19) in ihren törichten Bestrebungen und bringen keine Frucht, da sich ihre Seele einzig immerdar derartigen Gedanken hingibt</p><p>Wahrscheinlich will die Schrift, so dünkt mir, die nämliche Lehre mehr bildlich und verhüllt vortragen, wenn sie die Schlange als diejenige hinstellt, welche der Eva riet, der Gaumenlust zu frönen. Wenn nämlich dieses Tier, die Schlange, ihren Kopf in die Spalte, in welche sie schlüpfen will, gebracht hat, so kann sie, ― so erzählt man ― am Schwanze nicht mehr leicht zurückgezogen werden, weil die Schuppen auf ihrem Rücken gegen die Gewalt der Anziehenden sich naturgemäß sträuben. Und während sie, weil alsdann ihr Schuppengewand glatt anliegt und das Dahingleiten erleichtert, in der Bewegung nach vorwärts ganz ungehindert fortkriechen kann, ist es ausgeschlossen, sie an ihrem Hinterteile rückwärts zu ziehen, weil sie durch das Sträuben ihrer Schuppen zurückgehalten wird. Dadurch zeigt uns also das Wort, daß man vor der bösen Lust, welche in die Seele eindringen und ihr gleichsam auf den Rücken kommen möchte, mit aller Sorgfalt sich hüten und alle Spalten verstopfen muß, die ein unvorsichtiger Wandel ihr öffnen könnte; alsdann wird unser Leben rein von der befleckenden Berührung durch das giftige Getier bleiben. Hat allerdings die Schlange der sündhaften Lust den Zugang in unser Inneres gefunden, weil sich das Gefüge oder die Ordnung unseres Lebenswandels gelockert hatte, so wird sie schnell vollends eindringen und sich nicht mehr leicht aus den Räumen der Seele entfernen ― wegen ihrer Schuppen. Unter letzteren sind im bildlichen Sinne die verschiedenen Gelegenheiten zur Lust zu verstehen. Im allgemeinen betrachtet ist nämlich die Leidenschaft der Lust, bildlich gesprochen, nur ein einziges Tier; die bunten und mannigfachen Formen der Lust, die sich durch die Sinne in das Leben des Menschen eindrängen wollen, gleichen den Schuppen der Schlange, die wie die Leidenschaften in buntem Farbenspiele schillern.</p><p>Willst du also das Zusammenwohnen mit dem Getier meiden, so hüte dich vor dem Kopfe, das heißt vor dem ersten Anlauf des Bösen; denn darauf zielt, bildlich genommen, die Wendung der Heiligen Schrift: „Sie wird deiner Ferse auflauern und du sollst auf ihren Kopf treten“ (Gen. 3, 15). Nicht den geringsten Zutritt gestatte der Schlange, die in dein Inneres sich schleichen will und nach dem ersten geglückten Versuch sofort ihren ganzen langen Körper nachziehen möchte! Überschreite nicht das Bedürfnis! Das Maß deiner Sorge für das Leben sei die Befriedigung dessen, was hiezu wirklich notwendig ist, durch das, was sich dir gerade darbietet. Wenn aber die Ratgeberin der Eva ein Gespräch über feine Schleckereien anknüpfen würde und du daraufhin zu dem Brote solche und ähnliche Reizmittel als Zukost wünschest, so daß deine Wünsche die Grenzen des Nötigen überschreiten, so würdest du bald erfahren müssen, wie die Schlange sachte weiterkriecht, ein Verlangen nach dem anderen weckend. Wenn sie nämlich von der unentbehrlichen Nahrung zur Schlemmerei gekrochen ist, so wird sie zur Augenlust weiterschleichen und dein Verlangen nach den verschiedensten Luxusartikeln reizen wie nach prächtigen Gewändern, nach Dienern von üppiger Schönheit, silbernen Ruhebetten, weichlichen Lagern, durchsichtigen, goldgestickten Kleidern, Thronsesseln, Dreifüßen, Badewannen, Waschkrügen, Trinkhörnern, Kühlgefäßen, Schenkkannen für den Wein, Waschbecken, Leuchtern, Weihrauchgefäßen u. dgl. Hiermit findet aber auch die Begierde nach Vermehrung des Besitzes bei dir Eingang; damit es nämlich nicht an Mitteln zur Beschaffung der genannten Dinge fehlt, sind entsprechend große Einkünfte erforderlich. Infolgedessen wird mancher weinen, der Lebensgefährte seufzen, viele durch den Verlust ihres Eigentums in Trauer geraten, damit jenem Prasser der gewünschte Pomp ermöglicht werde. Ist es aber der Schlange gelungen, zu den angeführten Dingen sich hinanzuwinden und ihren Bauch mit dem anzufüllen, was sie wünscht, so kriecht sie nach der Sättigung weiter und wälzt sich fort zu toller Ausschweifung. Damit ist dann der Gipfelpunkt menschlichen Elendes erreicht.</p><p>Damit dir nun keines dieser Übel zustoße, so beschränke dein Leben auf ausreichenden Broterwerb und als Zukost strebe an, was unsere Natur selbst an die Hand gibt. In erster Linie ist dies ein gutes Gewissen, das da durch die Gerechtigkeit des Erwerbs das Brot wohlschmeckend macht. Willst du aber auch am Gaumenreiz dich ergötzen, dann diene dir der Hunger als Würze und die feste Regel, nicht Sättigung auf Sättigung zu häufen und nicht durch die Unmäßigkeit und ihre Folgen den Appetit abzustumpfen. Im Gegenteil soll dem Essen der Schweiß vorausgehen, wie es das Gebot verlangt: „In Schweiß und Arbeit sollst du dein Brot essen“ (Gen. 3, 19). Siehst du, wie das Wort Gottes dich auf die vorzüglichste Würze der Speise hinweist. Du darfst deinen Geist soweit bemühen, daß du das Notwendige habest; richtiger aber sollst du deinen Geist um das Brot nicht in Sorgen verstricken, sondern dich an denjenigen wenden, der das Brot aus der Erde hervorbringt (Ps. 103, 14 [hebr. Ps. 104, 14]); rufe zu dem, der die Raben ernährt (Ps. 146, 9 [hebr. Ps. 147, 9]), der allem Fleische Nahrung gibt (Ps. 135, 25 [hebr. Ps. 136, 25]), der die Hand öffnet und jedes lebende Wesen mit Freude erfüllt (Ps. 144, 16 [hebr. Ps. 145, 16]); zu diesem sprich also: „Von dir habe ich mein Leben; von dir werde mir auch der Unterhalt des Lebens zuteil! Gib du mir das Brot, d. h. durch Arbeit in Gerechtigkeit will ich mir meine Nahrung verschaffen.“ Denn wenn Gott die Gerechtigkeit ist, so haben alle jene ihr Brot nicht von Gott, die sich ihren Unterhalt durch habsüchtiges Treiben verdienen. Du hast selbst die Erhörung deines Gebetes in der Hand, nämlich dann, wenn du dein Hab und Gut nicht aus dem Eigentum des Nächsten gestohlen hast, wenn du nicht aus den Tränen anderer erntest, wenn um deiner Sättigung willen niemand hungern, wenn um deiner Befriedigung willen niemand seufzen muß. Gottes Brot dürfen wir vor allem jenes nennen, das da ist die Frucht der Gerechtigkeit, die Ähre des Friedens, nicht vermischt und verunreinigt mit dem Samen des Unkrautes. Wenn du aber fremdes Ackerland bebaust, auf Übervorteilung des Nächsten sinnest, ungerechten Besitz urkundlich verbriefen lässest und dann beten willst: „Gib mir das Brot!“, so verlangst du Erhörung nicht von Gott, sondern von einem anderen; denn die Frucht der Ungerechtigkeit stammt von Gottes Widersacher. Nur wer nach Gerechtigkeit strebt, empfängt das Brot von Gott; wer aber die Ungerechtigkeit ausübt, wird vom Beförderer der Ungerechtigkeit ernährt. Prüfe daher dein Gewissen, wenn du deine Bitte um Brot vor den Herrn bringen willst. Nicht darfst du vergessen, daß „Christus keine Gemeinschaft mit Belial hat“ (2 Kor. 6, 15). Wenn du aus ungerechtem Erwerb eine Gabe reichest, so ist dein Geschenk ein Hundelohn und ein Hurensold, und wenn du von Ehrgeiz geleitet noch so großartige Beiträge leistest, so gilt dir doch das Wort des Propheten, der Gaben aus solcher Quelle mit Abscheu zurückweist: „Was soll mir die Menge der Opfer? spricht der Herr! Ich bin satt von den Opfern der Widder; das Fett der Lämmer, das Blut der Stiere und Böcke verlange ich nicht. Räucherwerk ist mir ein Greuel“ (Is. 1, 11 ff.). Anderswo (Is. 66, 3) setzt er den, der ein Kalb opfert, auf gleiche Linie mit dem, der einen Hund tötet. Nur dann, wenn du dein Brot von Gott hast, d. h. erworben durch Arbeit in Gerechtigkeit, kannst du ihm daraus auch angenehm ein Erstlingsopfer der Gerechtigkeit darbringen.</p><p>Trefflich ist endlich der Zusatz „heute“, indem er uns beten lehrt: „Unser tägliches Brot gibt uns heute.“ Auch in diesem Wörtlein liegt tiefe Weisheit; aus ihm kannst du lernen, daß das Leben des Menschen nur auf einen einzigen Tag beschränkt ist. Nur die Gegenwart gehört uns; die Hoffnung auf die Zukunft ist unsicher; denn wir wissen nicht einmal, was der folgende Tag bringt. Was mehren wir unsere Mühsal durch Sorgen um die Zukunft? „Genug des Schlimmen hat jeder Tag“, heißt es (Matth. 6, 34), wobei unter dem Ausdruck „Schlimmes“ Plag und Mühe zu verstehen ist. Was sorgen wir uns also ab um den morgigen Tag? Indem er dir daher den Zusatz „heute“ anbefiehlt, untersagt der Herr die Sorge für das Morgen; denn mit diesem Wörtchen ruft er dir ungefähr dieses zu: „Wer dir den Tag gibt, gibt dir auch, was zum Tage gehört!“ Wer läßt die Sonne aufgehen, wer das Dunkel der Nacht verschwinden? Wer zeigt dir den Strahl des Lichtes? Wer bewegt den Himmel im Kreise, so daß die Leuchte über der Erde erscheint? Wer dir diese großartigen Dinge gibt, bedarf der etwa deiner Hilfe, um deinem Leibe zu geben, was er benötigt? Welchen Fleiß verwenden die unvernünftigen Geschöpfe auf ihren Lebensunterhalt? Welche Felder bestellen die Raben? Welche Vorratskammern haben die Adler? Verschafft nicht allen ihre Lebensmittel der Wille Gottes, der das Universum mit seiner Macht umfaßt? Ochs und Esel und andere unvernünftige Tiere besitzen von Natur aus genügend Weisheit, um über das, was sie gerade haben, richtig zu verfügen und sich über die Zukunft nicht den geringsten Kummer zu machen. Brauchen wir da erst noch einen Lehrmeister, der uns über die Vergänglichkeit und zeitliche Begrenztheit unseres fleischlichen Lebens aufklärt? Lassen wir uns nicht durch das Geschick anderer zur Einsicht bringen? Öffnen sich nicht unsere Augen durch die Erfahrungen in unserem eigenen Leben? Was haben jenem Reichen seine umfangreichen Zurichtungen genützt, ihm, der sich eitlen Plänen töricht hingab, der niederreißen, aufbauen, sammeln, schwelgen und von nichtiger Hoffnung verführt für viele Jahre in seinen Vorratskammern aufspeichern wollte? Hat nicht eine einzige Nacht alle seine Zukunftsphantasien zuschanden gemacht wie ein ganz nichtiges Traumgebilde, dem jedes Fundament fehlt? Das Leben des Leibes gehört nur der Gegenwart an; dasjenige Leben hingegen, auf das wir bestimmt in der Zukunft hoffen dürfen, kommt bloß der Seele zu. Menschlicher Unverstand zieht daraus aber nicht die richtige Folgerung: das leibliche Leben stellt er sich in seinen Hoffnungen viel länger vor, das der Seele aber will er ganz zum Genießen der Gegenwart herabziehen; infolgedessen wird die Seele notwendig von jenem Gegenstand der Hoffnung, dem allein Wahrheit und Wirklichkeit eignet, abgezogen, indem ihre Tätigkeit nur von den äußerlichen Dingen in Anspruch genommen wird. Auf diese Weise kann die Seele weder diese besitzen, noch das große Gut der Hoffnung erlangen, da sie sich auf Unbeständiges stützt.</p><p>Lassen wir uns also durch die gegebene Erörterung belehren, um was wir für heute und um was wir für später bitten müssen! Das Brot gehört für den Gebrauch des heutigen Tages, das Reich Gottes aber zur seligen Hoffnung. Mit dem Worte „Brot“ will der Herr alles zusammenfassen, was wir für den Leib bedürfen. Wenn wir um dieses bitten, so wird dem Beter zum Bewußtsein kommen, daß er hiermit um Vergängliches bittet, während hingegen, wenn wir um ein Gut der Seele flehen, unsere Bitte auf Immerwährendes und Ewiges abzielt. Auf Letzteres sollen wir aber zumeist unseren Blick richten, voll der Zuversicht, daß doch mit dem Wichtigeren auch alles Übrige, dessen wir bedürfen, zugleich erreicht wird. Der Herr versprach nämlich: „Bittet um das Reich Gottes und seine Gerechtigkeit, und dieses alles wird euch dazugegeben werden“ (Matth. 6, 33). In Christo Jesu, unserem Herrn, dem die Herrlichkeit und die Macht sei von Ewigkeit zu Ewigkeit. Amen.</p><h2>5</h2><p>In seinen Unterweisungen fortschreitend, ist das Wort Gottes mit der vorliegenden Bitte auf den höchsten Gipfel der Gottseligkeit angelangt; denn in ihr gibt es an, wie der Mensch beschaffen sein soll, der sich Gott nahen will: fast nicht mehr in den Grenzen seiner Natur soll sich darnach der Mensch befinden, sondern sich Gott selbst durch Tugend ähnlich machen, so daß er ein anderer zu sein scheint, indem er tut, was Gott allein zukommt. Denn Sündenvergebung ist Gott ausschließlich eigen und ihm vorbehalten; heißt es ja doch: „Niemand kann Sünden vergeben als Gott allein“ (Luk. 5, 21).Wenn also jemand die besonderen Kennzeichen Gottes nachahmt, so wird er in gewissem Sinn selbst Gott, weil er hiedurch den Beweis dafür liefert, daß er sich ihm getreu verähnlicht. Was lehrt uns also das Wort Gottes? Dies: im Vertrauen auf unsere Lebensführung müssen wir uns zuerst das Zeugnis geben können, uns zur Ähnlichkeit mit Gott erhoben zu haben; dann erst dürfen wir es wagen, ihn Vater zu nennen, und ihn wegen unserer bisher begangenen Sünden um Verzeihung zu bitten. Denn auf unser bloßes Beten allein hin können wir nicht Erhörung erwarten, sondern wir müssen uns durch unsere Werke die Berechtigung verdient haben, vertrauensvoll zu bitten. Denn in den angeführten Worten spricht der Herr zu uns geradezu folgendes: Wer dem Barmherzigen sich naht, soll selbst barmherzig sein, wer dem Guten, gut, wer dem Gerechten, gerecht; nur der Geduldige nahe sich dem Geduldigen, nur der Menschenfreundliche dem Menschenfreundlichen. Und in gleicher Weise sollen wir den Gütigen, den Milden, den Spender der Gnaden, den Allerbarmer und überhaupt jede gute Eigenschaft, die wir an Gott wahrnehmen, getreulich in unserem Tun und Lassen nachahmen und uns dadurch die Möglichkeit erwerben, vertrauensvoll zu beten. Wie daher ein Schlechter unmöglich mit dem Guten vertraut werden oder einer, der sich in unreinen Gedanken wälzt, mit dem Reinen und Unbefleckten in Freundschaftsverhältnis stehen kann, so führt die Hartherzigkeit des Beters eine Trennung zwischen ihm und unserem menschenfreundlichen Gott herbei. Wer demnach seinen Schuldiger in bezug auf seine Schulden hart behandelt, der scheidet sich durch sein Benehmen von Gott, der die Menschenfreundlichkeit selbst ist. Denn welche Gemeinschaft besteht zwischen Menschenfreundlichkeit und Hartherzigkeit, zwischen einem liebevollen und einem gefühllosen Herzen? Und so scheiden alle guten Eigenschaften, die sich nur immer durch ihre Gegensätzlichkeit zum Bösen, als dessen Gegenteil erkennen lassen, unerbittlich von den ihnen gegensätzlichen schlimmen Eigenschaften; wer demnach diese oder jene Eigenschaft hat, ist von der gegenteiligen völlig geschieden. Wie etwa ein Verstorbener nicht mehr am Leben Anteil hat und ein Lebender vom Tode geschieden ist, so müssen alle, die sich der Menschenfreundlichkeit Gottes nahen, notwendig jede Hartherzigkeit ablegen. Wer aber alles, was wir als bös bezeichnen, ganz abgelegt hat, wird durch eine solche Seelenverfassung gewissermaßen göttlich, weil er in sich jene Vollkommenheit hergestellt hat, die unsere Vernunft dem göttlichen Wesen zuerkennt.</p><p>Siehst du, zu welcher Höhe der Herr durch die Gebetsworte alle, die auf ihn hören, erhebt, indem er die menschliche Größe in eine mehr göttliche umwandelt und die Menschen, die sich Gott nahen, auffordert, selbst göttlich zu werden. Er ruft dir gleichsam zu: warum trittst du vor Gott wie ein Sklave, von Furcht niedergebückt und von Gewissensbissen gepeinigt? Warum raubst du dir selbst den Mut zu vertrauensvollem Gebete, der nur in einer freien Seele wohnt und der ursprünglich zu unserem Wesen gehörte? Warum gebrauchst du Schmeichelreden dem gegenüber, der sich nicht durch Schmeichelei gewinnen läßt? Warum wendest du dich in wohldienerischen, gleißnerischen Worten an den, der auf die Werke sieht? Alles Gute, das Gott uns geben kann, kannst du auf Grund eigener Entscheidung erlangen, wenn du nämlich zu guter, edelmütiger Gesinnung dich entschließest. Werde dein eigener Richter und fälle selbst ein freisprechendes Urteil über dich. Du begehrst von Gott Nachlaß deiner Schulden; laß du sie nach, und Gott hat gerichtet; denn dein Urteil über deinen Nächsten ― es steht in deiner Gewalt ― verschafft dir den gleichen Urteilsspruch von Gott, ob es so oder anders lautet. Worauf du bei dir selbst erkennst, das wird dir vom Gerichte Gottes bestätigt.</p><p>Doch wie könnte jemand würdig die Großartigkeit des göttlichen Wortes enthüllen! Der Gedanke, welcher in der Bitte: „Vergib uns unsere Schulden, wie auch wir vergeben unseren Schuldigern!“ liegt, geht weit über die Erklärung hinaus, welche durch die Worte selbst nahegelegt wird. Ein kühnes Unterfangen ist es, das, was mir hierüber in den Sinn kommt, verstandesmäßig zu erfassen, ein kühnes Unterfangen, die Gedanken in Worten darzulegen. Was enthält nun das Gebetswort? Wie der Apostel sagt: „Seid meine Nachfolger, wie ich Christi Nachfolger bin“ (1 Kor. 11, 1), schwebt Gott den Guten für ihr Handeln als Muster vor; unser Gebetswort will aber, daß im Gegenteil unsere Gesinnung das Vorbild für Gott abgebe. Die Ordnung wird also hier umgekehrt: wie sonst in uns das Gute durch die Nachahmung Gottes zustande kommt, so dürfen wir in diesem Falle zu hoffen wagen, Gott werde unser Beispiel nachahmen. Wenn wir das verlangte Gute vollbringen, wird es uns gestattet, zu Gott ungefähr zu sprechen: Tue, was ich getan habe; folge deinem Diener nach, obgleich du der Herr bist, du, der Gebieter der Welt, dem armen Bettler. Ich habe die Schulden erlassen, fordere auch du sie nicht von mir ein; meinen Schuldner habe ich entlassen, daß er fröhlich scheiden konnte; so geschehe auch dem deinen: mache du deinen Schuldner nicht trauriger als ich den meinigen! Gleichen Dank sollen beide dem erstatten, der die Schuld zu fordern hatte. Gleiche Nachlassung soll von uns beiden dem Schuldner zuteil werden: dem meinigen und dem deinigen. Er ist mein Schuldner, ich der deine: dasselbe, was ich über meinen Schuldner beschlossen habe, sei auch bei dir zum Beschluß über mich erhoben; ich ließ ihn frei, laß auch mich frei; ich vergab ihm, vergib du mir! Große Barmherzigkeit habe ich meinem Mitmenschen erwiesen; ahme, o Herr, die Menschenfreundlichkeit deines Knechtes nach! Freilich schwerer sind meine Verfehlungen gegen dich, als die seinigen gegen mich; ich gebe es zu. Indes erwäge auch, wie du in allem Guten uns unendlich weit überragest; deshalb ist es doch billig, daß du nach Maßgabe deiner unaussprechlichen Macht uns Sündern dein Erbarmen schenkest. Gering ist die Menschenfreundlichkeit, die ich erwies; denn meine Natur vermochte nicht mehr zu fassen; du aber bist imstande, eine so große aufzunehmen, welche du willst; deine Macht kennt keine Grenze in der Spendung von Wohltaten.</p><p>Doch wir wollen noch eingehender unsere Gebetsworte betrachten, ob uns nicht durch Ergründung des in ihnen liegenden Sinnes nicht noch weitere Anleitung zu einem gottseligen Leben gegeben werde. Untersuchen wir daher, wodurch einerseits die menschliche Natur schuldbeladen ist und worin wir andererseits eine Vergebung gewähren können; denn aus dieser Erkenntnis werden wir aufs neue das Übermaß der göttlichen Güter einsehen.</p><p>Beginnen wir also mit der Aufzählung der menschlichen Verfehlungen gegen Gott! Die erste strafwürdige Schuld zog sich der Mensch vor Gott dadurch zu, daß er von Gott abfiel und zu dessen Widersacher überging, so daß er zum abtrünnigen Flüchtling vor seinem natürlichen Herrn wurde. Die zweite Schuld besteht darin, daß er die harte Knechtschaft der Sünde an Stelle seiner Freiheit und Unabhängigkeit eintauschte und es vorzog, der Macht des Verderbens als Sklave zu dienen, statt in der Gemeinschaft mit Gott zu verbleiben. Aber auch dadurch fehlte er, daß er seinen Blick nicht unverrückbar auf die Schönheit Gottes richtete, sondern sein Antlitz der Häßlichkeit der Sünde zuwendete. Welch größeres Unrecht ließe sich denken als diese Geringschätzung der göttlichen Güter und diese Bevorzugung der Lockungen des Bösen? Welch schwere Strafe verdiente sich dadurch der Mensch? Dazu kommt noch die Zerstörung der Ebenbildlichkeit Gottes, die Entstellung des Merkmales der Göttlichkeit, das uns bei der ersten Erschaffung aufgedrückt wurde, der Verlust der Drachmen, das Aufgeben des väterlichen Tisches, die schmutzige Lebensgemeinschaft mit den Schweinen, das Verprassen des kostbaren Reichtums und alle derartigen Verfehlungen, die man durch die Schrift und durch eigenes Nachdenken erkennen kann ― wer könnte sie sämtlich aufzählen? Weil daher der Mensch wegen so vieler und so bedeutender Vergehen von Gott die verdiente Strafe zu gewärtigen hat, so will uns das Wort Gottes durch unsere Bitte belehren, daß wir, selbst wenn wir uns mit aller Sorgfalt vor Verirrungen gehütet hätten, keineswegs mit dem Wahne uns zum Gebete anschicken sollten, als wäre unser Gewissen gänzlich schuldlos. Denn wer wie jener reiche Jüngling sein Leben nach den Geboten einrichtete, möchte vielleicht von seinem Leben das gleiche rühmen, indem er zu Gott spräche: „Das alles habe ich seit meiner Jugend beobachtet“ (Matth. 19, 20), und zur Meinung sich versteigen, daß die Abbitte, die ja nur für Sünder passe, für ihn unnötig sei, weil er nicht gegen die Gebote sich vergangen habe. Und so könnte er zu der Ansicht kommen, dem Unzüchtigen gezieme eine solche Bitte, oder wer durch Habsucht Götzendienst getrieben, müsse um Verzeihung flehen, oder überhaupt für jeden, der durch einen Fehltritt sein Gewissen befleckt habe, sei es geziemend und notwendig, zur Barmherzigkeit seine Zuflucht zu nehmen. Und wenn es gar der große Elias wäre, oder jener, der im Geiste und in der Kraft des Elias erschien, der Herrlichste unter den vom Weibe Gebornen (Matth. 11, 11; Luk. 7, 28) oder Petrus oder Paulus oder Johannes oder sonst einer, dessen überragende Hoheit von der Heiligen Schrift bezeugt ist ― wozu könnte jemand fragen, würde ein solcher eine Bitte an Gott richten, durch die er um Vergebung der Schuld fleht, während er sich doch keine Schuld durch Sündigen zugezogen hat?</p><p>Damit nun niemand, von solchen Vorstellungen verleitet, sich brüste wie jener Pharisäer (Luk. 18, 11), der von seiner wirklichen Natur kein Verständnis besaß ― wäre er sich recht bewußt gewesen, daß er ein Mensch sei, so hätte er sich wenigstens durch die Heilige Schrift belehren lassen, weil nach ihrem Zeugnis infolge der Verderbtheit unserer Natur kein Mensch sich findet, der auch nur einen Tag vollständig makellos leben würde (Sprichw. 24, 16) ― damit also, sage ich, keine solch hochmütigen Gedanken in den Seelen der Beter entstünden, fordert uns das Wort Gottes durch unsere Bitte auf, nicht auf unsere guten Werke zu sehen, sondern uns immer wieder an die gemeinsame Schuld der Menschennatur zu erinnern, an der jeder so gewiß teilnimmt, wie er an der gleichen menschlichen Natur teilnimmt, und im Andenken daran den ewigen Richter anzuflehen, er möge uns unsere Schulden vergeben.* So lange* wir Menschen alle, ausnahmslos, als lebte Adam in uns, an unserer Natur diese Kleider aus Fellen und die vergänglichen Blätter dieses körperlichen Lebens sehen müssen, die wir uns nach dem Verlust der ewigen, herrlichen Gewänder notdürftig zusammengeflickt haben, indem wir Schwelgerei, Ruhmsucht, hinfällige Ehren, und die schnell vorübergehende Befriedigung der Fleischeslust an Stelle der göttlichen Kleider anzogen,* so lange* wir den Ort des Jammers schauen, an dem wir zusammen zu wohnen verurteilt wurden,* so brechen wir,* wenn wir uns gegen Osten wenden ― nicht als ob Gott nur dort zu finden wäre (denn der Allgegenwärtige ist, weil das Universum gleichmäßig umfassend, an keinem Ort in besonderer Weise zu finden), sondern weil im Osten unsere ursprüngliche Heimat ist, das heißt das Paradies, aus dem wir verstoßen wurden: „Gott pflanzte das Paradies in Eden gegen Osten“ (Gen. 2, 8) ― wenn wir also gegen Osten blicken und im Geiste die Erinnerung an unsere Verbannung aus den lichten Räumen der Glückseligkeit durch den Aufgang der Sonne erwecken,* so brechen wir* mit Recht in unsere Bitte um Vergebung aus, wir, die wir beschattet sind vom schlimmen Feigenbaum des Erdenlebens, aus dem Anblick Gottes verwiesen, übergelaufen zur Schlange, welche Erde frißt, auf der Erde sich windet, auf Brust und Bauch kriecht und die uns verführen will, das gleiche zu tun, das heißt, uns irdischem Genuß hinzugeben, unser Herz über niedrige und gemeine Gedanken hinschleppen zu lassen und auch auf dem Bauch zu kriechen, ich meine, alle Zeit und Mühe auf Sinneslust zu verwenden. In solcher Lage uns befindend, sollen wir dem verlorenen Sohn gleichen, wie er nach dem langen Elend, das er als Schweinehirt ertrug, reumütig unsere Gedanken auf den himmlischen Vater richten, und ihn mit den Worten anflehen, die für uns alle ganz passend sind: „Vergib uns unsere Schulden!“ Daher wird jeder, selbst wenn er Moses, Samuel oder sonst einer der hervorragenden Tugendhelden wäre, diese Bitte auch für sich ganz geeignet finden, insofern er Mensch ist, da er an der Natur des Adam und damit auch an seiner Verbannung teilnimmt. Weil wir alle nach den Worten des Apostels in Adam sterben (1 Kor. 15, 22), so werden die Worte der Reue, die sich für Adam schicken, sich auch für uns alle, die wir mit Adam gestorben sind, ebenfalls geziemen, auf daß wir Sündenvergebung erlangen und vom Herrn in Gnaden gerettet werden, wie der Apostel sagt (Eph. 2, 5).</p><p>Dies habe ich jedoch nur dargelegt, damit man einmal das vorliegende Gebetswort unter dem Gesichtspunkt des Zustandes betrachte, in welchem das ganze Menschengeschlecht sich befindet. Wenn wir aber den Sinn des Wortes noch näher erforschen, so glaube ich, daß wir nicht gezwungen sind, unseren Blick erst auf die Gemeinsamkeit unserer Natur zu richten. Vielmehr genügt für jeden schon das Bewußtsein dessen, was er im Leben getan hat, um ihn zur Bitte um Barmherzigkeit zu nötigen. Denn da unsere Lebenstätigkeit auf dieser Erde sich mannigfach äußert: nämlich teils mittels der Seele und des Geistes, teils mittels der leiblichen Sinne, so ist es, fürchte ich, schwer oder fast ganz unmöglich, sich nicht durch irgendeine Leidenschaft zur Sünde hinreißen zu lassen. Ich meine also: da das Leben des Körpers, das auf Genießen ausgeht, mittels der Sinne sich vollzieht, das Leben des Geistes aber in der Tätigkeit des Denkens und in der Bewegung des Willens, wer steht da so fest und ist so erhabener Sinnesart, daß er auf beiden Gebieten von der Befleckung der Sünde sich rein bewahre? Wer ist in bezug auf das Auge ohne Sünde? Wer hat keine Verantwortung in bezug auf das Gehör? Wer steht jeder tierischen Gaumenlust ganz ferne? Wer ist hinsichtlich des Tastgefühles ganz frei geblieben von verbotener Berührung? Wer kennt nicht die bildliche Wendung der Schrift, durch die Fenster sei der Tod eingedrungen (Jer. 9, 21)? Die Sinne, durch welche die Seele nach außen wirkt und alles, was ihr behagt, erfaßt, hat nämlich die Heilige Schrift Fenster genannt, durch welche, wie es weiter heißt, der Tod Eingang findet. Und tatsächlich gewährt z. B. das Auge dem Tode vielfach Eingang, so wenn der Mensch durch dasselbe einen Zornigen erblickt und zur gleichen Leidenschaft sich entzünden läßt, oder einen Glücklichen, der es nicht verdient, und in Neid gerät, oder einen Hochmütigen, und in Haß aufflammt, oder eine ungewöhnlich schöne Körpergestalt, und ganz in Verlangen nach dem Gegenstand seines Wohlgefallens aufgeht. Ähnlich öffnet auch das Ohr dem Tode die Fenster, durch das, was es hört, und nimmt viele Leidenschaften in die Seele auf: Furcht, Jammer, Zorn, Lust, Begierde, ausgelassene Heiterkeit und ähnliches. Die Befriedigung des Geschmacksinnes ist sozusagen die Mutter aller Übel; denn wer wüßte nicht, daß die unbeschränkte Sorge für den Gaumenkitzel so ziemlich die Wurzel aller Fehltritte im Leben ist? Ihr entspringen Weichlichkeit, Trunkenheit, Schlemmerei, Verschwendung, Völlerei, Blasiertheit, Nachtschwärmerei, der tierische und unvernünftige Trieb zu entehrenden Lastern. Ebenso erzeugt der Tastsinn Verirrungen schlimmster Art; denn alles, was Unzüchtige mit ihrem Körper treiben, sind Krankheiten, welche der Tastsinn hervorruft; sie einzeln aufzuzählen, würde zu weit führen; auch würde es gegen den Anstand verstoßen, wollte man in einer ernsten Rede alle Vorwürfe aufnehmen, welche gegen den Tastsinn erhoben werden können.</p><p>Wer könnte aber die Unzahl der Sünden aufzählen, die im Geiste und im Willensvermögen begangen werden? Die Schrift sagt: „Von innen heraus kommen die bösen Entschlüsse“ und fügt auch eine Aufzählung der Gedanken bei, welche uns verunreinigen können (Matth. 15, 19). Wenn uns demnach dergestalt die Netze der Sünde umstricken ― durch alle Sinneswerkzeuge und die Regungen der Seele ―, „wer wird sich“, um mit der Schrift zu reden, „rühmen, ein reines Herz zu haben?“ (Sprichw. 20, 9). „Wer ist frei geblieben von Schmutz?“ (Job 14, 4). Eine Befleckung ihrer Reinheit droht der Seele durch die Lust, welche sich vielfach und auf mancherlei Weise in das menschliche Leben einschleicht: durch Seele und Leib, durch Gedanken, durch Empfindungen, durch die Bewegungen des Willens, durch die leiblichen Tätigkeiten. Wer hat da eine Seele, die von diesem Schmutz ganz rein bliebe? Wie sollte er nicht vom Hochmutsdünkel berührt, wie nicht vom Fuße des Stolzes getreten worden sein? Wen hat nicht die Hand zum Sündigen und damit zum Wanken gebracht? Wessen Fuß ist nicht dem Bösen nachgelaufen? Wen hat das unbezähmte Auge nicht befleckt, wen das unbewachte Ohr nicht verunreinigt, der Geschmacksinn nicht gefesselt? Und wessen Herz hat allen törichten Regungen Widerstand geleistet? Da nun diese Zustände bei den mehr tierisch Gesinnten schlimmer, bei den für ihr Heil Besorgteren zwar milder sind, die Gebrechen der Natur aber bei allen Menschen, weil sie an der gleichen Natur teilnehmen, tatsächlich sich vorfinden, so müssen wir alle vor Gott niederfallen und ihn anrufen, er möge uns unsere Schulden vergeben.</p><p>Doch bleibt ein solches Flehen wirkungslos und findet bei Gott keine Erhörung, wenn uns das Gewissen nicht zugleich Zeugnis gibt, daß es für Gott am Platze sei, uns Barmherzigkeit zu gewähren. Wer also da glaubt, für Gott sei es geziemend, die Menschen zu lieben ― hätte er diese Meinung nicht, so würde er wähnen, Gott lasse sich zu Ungeziemendem und Unpassendem durch unser Gebet verleiten ― der muß auf Grund der Gerechtigkeit sein Urteil über das, was sich geziemt, durch sein eigenes Verhalten gegen die Mitmenschen bekräftigen, damit er nicht vom göttlichen Richter so etwas höre, wie: „Arzt, heile dich selbst! Mich flehst du um Menschenfreundlichkeit an, die du selbst deinem Nebenmenschen nicht erweisen willst? Du betest um Nachlassung der Schulden, warum würgst du deinen Schuldner? Du bittest, daß dein Schuldbrief ausgelöscht werde, während du die Schuldbriefe deiner Schuldner sorgfältig aufbewahrst? Du bittest um Schuldentilgung, und bist dabei entschlossen, das Geld, das du ausgeliehen hast, noch durch Zins zu vermehren! Dein Schuldner sitzt im Gefängnis, du im Hause des Gebetes! Jener jammert, daß er zahlen soll, du aber erachtest es für angemessen, daß deine Schuld dir geschenkt werde! Dein Gebet bleibt unerhört; denn das Wehegeschrei des von dir Bedrückten übertönt es.“ Wenn du die leibliche (= materielle) Schuld lösest, werden die Fesseln deiner Seele gelöst; wenn du verzeihest, wird dir verziehen. Du wirst dein eigener Richter sein, dir selbst das Gesetz (Norm) vorschreiben, indem du durch dein Verhalten gegen den Schuldiger dir selbst den Urteilsspruch von oben bestimmest.</p><p>Eine ähnliche Lehre scheint mir der Herr auch an einer anderen Stelle zu geben, wo er seine Forderung in der Form einer Erzählung verkündet. Dort tritt nämlich ein König auf, der mit furchtbarer Strenge zu Gericht sitzt, seine Diener einem peinlichen Verhör unterzieht und von einem jeden Rechenschaft über seine Verwaltung fordert. Einer seiner Schuldner nun, der herbeigeschleppt war, hatte, da er vor ihm niederfiel und ihn, statt das Geld zu bezahlen, anflehte, Barmherzigkeit erlangt; dann aber zeigte er sich gegen seinen Mitknecht wegen einer geringen Schuld lieblos und hart; diese Härte versetzte den König in Zorn, und er befahl den Folterknechten, ihn aus dem königlichen Haus zu werfen und so lange in Strafe zu nehmen, bis er die ganze Schuld abgetragen habe. In der Tat sind es nur einige Pfennige, unbedeutend und leicht abtragbar im Vergleich zu Zehntausenden von Talenten, wenn wir die Schulden unserer Brüder gegen uns mit unseren Verfehlungen gegen Gott zusammenstellen. Allerdings ein Unrecht ist die Beleidigung, die der Stolz des anderen dir zufügt, die Bosheit eines Untergebenen oder gar ein Anschlag auf Leib und Leben. Hierüber voll Zorn im Herzen lässest du dich zum Entschluß hinreißen, dies alles zu rächen und bietest deine ganze Erfindungskraft auf, um Rache an deinen Beleidigern zu nehmen. Wenn du aber gegen deinen Knecht in Zorn aufloderst, so bedenkst du nicht, daß nicht die Natur, sondern Macht und Zwang die Menschheit in Knechte und Herren geteilt hat. Denn zum Dienste bestimmte der Ordner des Weltalls nur die vernunftlose Natur, wie der Prophet sagt: „Alles hast du unter seine Füße gelegt, die Schafe, die Rinder, die Vögel, die wilden Tiere und die Fische“ (Ps. 8, 8 [hebr. Ps. 8, 8]). Diese nennt er auch Diener, indem er anderswo in seiner Weissagung schreibt: „(Lobsinget) dem, der den Tieren ihre Nahrung gibt und Gras der Dienerschaft der Menschen“ (Ps. 146, 8 f. [hebr. Ps. 147, 8 f.]; vgl. Ps. 103, 14 [hebr. Ps. 104, 14]). Den Menschen dagegen hat er mit dem Gnadengeschenk der Freiheit ausgestattet. Daher steht dir nach seiner natürlichen Würde der gleich, der dir nach Gesetz und Herkommen untergeben ist; er hat weder sein Dasein von dir, noch lebt er durch dich, noch hat er seine leiblichen und geistigen Kräfte von dir empfangen. Was brausest du also voll Zorn so sehr gegen ihn auf, wenn er leichtsinnig oder untreu ist, oder wenn er dich verächtlich behandelte? Solltest du nicht vielmehr dich selbst ernstlich prüfen, wie du dich gegen deinen Herrn benommen hast, der dich erschaffen und durch die Geburt ins Dasein geführt und an den Wundern der Welt hat teilnehmen lassen, der dir die Sonne hingesetzt, daß du dich ihrer erfreuest, und dir alle Mittel zum Leben aus den Elementen gewährt hat: aus Erde, Feuer, Luft und Wasser; der dir die Fähigkeit des Denkens, die Sinne zur Aufnahme der Außenwelt, die Gabe, Gutes und Böses zu unterscheiden, verliehen hat? Wie nun? Leistest du einem solchen Herrn Gehorsam und gibst du ihm keinen Grund zur Klage? Hast du dich nicht seiner Botmäßigkeit entzogen? Bist du nicht zur Sünde übergelaufen und hast seine Herrschaft mit der des bösen Feindes vertauscht? Hast du nicht das Haus deines Herrn, soweit es auf dich ankam, der Verödung preisgegeben und die Stätte verlassen, wo du auftragsgemäß hättest arbeiten und wachen sollen? Und begehst du nicht durch unerlaubte Taten, Worte und Gedanken so viele Beleidigungen sogar vor seinem Angesichte, da er allgegenwärtig ist und alles sieht? Und in einem derartigen Zustand befindlich und mit so vielen Schulden beladen, vermeinst du deinem Mitknechte eine gar große Gunst zu erweisen, wenn du ihm etwas von seinen Verfehlungen nachsiehst! Wenn wir also Gott um Barmherzigkeit und Verzeihung anflehen wollen, so müssen wir unserem Gewissen das Vertrauen zu dieser Bitte dadurch verschaffen, daß wir vor dieselbe unser Leben als Anwalt hinstellen und in Wahrheit sagen können: „Auch wir haben denen vergeben, die uns schuldig waren.“</p><p>Was will nun das bedeuten, was sich an die besprochenen Worte sogleich anschließt? Es dürfte gut sein, auch an diesem nicht vorüberzugehen, sondern es zu betrachten, damit wir, wohl unterrichtet, unsere Bitte zu dem, zu dem wir beten, mit dem Herzen und nicht bloß mit den Lippen emporsenden: „Führe uns nicht in Versuchung, sondern erlöse uns von dem Bösen.“ Was, meine Brüder, bedeuten diese Worte? Wie mir scheint, gebraucht der Herr für den bösen Feind verschiedene Namen, indem er ihm nach seinen verschiedenen schlimmen Kraftäußerungen auch verschiedene Bezeichnungen gibt: Teufel, Beelzebub, Mammon, Fürst der Welt, Menschenmörder, der Böse, Vater der Lüge usw. Doch auch „die Versuchung“ weist auf etwas hin, was zu ihm gehört. Diese unsere Vermutung wird durch den Zusammenhang bestätigt; denn auf die Worte: „Führe uns nicht in Versuchung!“ läßt der Herr folgen: „Erlöse uns von dem Bösen“, gerade wie wenn durch beides der nämliche bezeichnet würde. Denn wenn bloß derjenige, der nicht in Versuchung gerät, dem Bösen vollständig entrinnt, so nähert sich auch jener, der in Versuchung geraten ist, notwendig dem Bereiche des Bösen; also sind „Versuchung“ und „der Böse“ ihrem Wesen nach ein und dasselbe.</p><p>Wozu mahnt uns die Lehre, die uns damit das Gebet erteilt? Wir sollen frei werden von allem, was man in dieser Welt wahrnimmt, in Übereinstimmung mit dem, was der Herr an einer anderen Stelle sagt: „Die ganze Welt liegt im argen“ (Joh. 5, 19). Darum muß sich jeder, der vor dem Bösen bewahrt bleiben will, notwendig von der Welt entfernen. Denn die Versuchungen hätten nicht die Macht, die Seele gefangenzunehmen, wenn sie nicht das Tun und Treiben der Welt den Naschhaften, wie einen Köder an gefährlichem Angelhaken hinhielten. Noch deutlicher kann uns der Gedanke durch andere Gleichnisse werden. Furchtbar ist oft das Meer im Wogenschwall, aber nicht für solche, welche entfernt von ihm wohnen; verheerend wirkt das Feuer, aber nur für den Brennstoff, der in seine Gewalt fällt; schrecklich wütet der Krieg, aber nur für jene, welche an den Schlachten teilnehmen. Wie nun alle, die den Unfällen und Schrecknissen des Krieges entgehen wollen, bitten und flehen, in keinen Krieg verwickelt zu werden, und jene, die das Feuer fürchten, nicht in die Flammen zu geraten, und wer Angst vor dem Meere hat, keine Seefahrt unternehmen zu müssen, so muß auch jeder, der die Tyrannei des Bösen fürchtet, bitten und rufen, ihm nicht überliefert zu werden. Nachdem jedoch, wie schon bemerkt, das Wort Gottes sagt, daß die Welt im argen liege, die Dinge der Welt aber die Anlässe zu den Versuchungen bieten, so fleht, wer bittet, vor dem Bösen beschützt zu werden, gut und passend zugleich, er möge frei von Versuchungen bleiben. Denn keiner wird den Angelhaken verschlucken, wenn er nicht in Lüsternheit die Lockspeise an sich gezogen und verkostet hätte. &lt;150&gt; Wohlan, erheben auch wir uns und rufen zu Gott: „Führe uns nicht in Versuchung!“ das heißt, laß uns nicht in die Verderbnisse des Lebens geraten, „sondern erlöse uns vor dem Bösen“, der die Herrschaft in dieser Welt führt und vor dem wir beschützt werden mögen durch die Gnade Christi. Denn ihm gebührt Ehre und Herrlichkeit zugleich mit dem Vater und dem Heiligen Geiste, jetzt und allezeit und von Ewigkeit zu Ewigkeit. Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Das Gebet des Herrn</em> (BKV 1. Reihe, Bd. 56, Kempten/München 1927). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3160/versions/das-gebet-des-herrn-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "1zoP_Беседы_о_блаженствах"
    path: "Gregor_Nyssa_Seligkeiten"
    title: "Acht Homilien über die acht Seligkeiten"
    menu: { parent: "Werke", title: "Acht Homilien über die acht Seligkeiten", priority: 4 }
    update: true
    body: |-
      <p><em>Acht Homilien über die acht Seligkeiten, übersetzt von Übersetzung der BKV-Ausgabe (BKV 1. Reihe, Bd. 56, Kempten/München 1927).</em></p><h2>1</h2><p>Als er die Scharen erblickte, stieg er auf den Berg, und nachdem er sich gesetzt hatte, traten seine Jünger zu ihm. Da öffnete er seinen Mund und lehrte sie, indem er sprach: „Selig die Armen im Geiste; denn ihrer ist das Himmelreich!“</p><p>Wer unter den Versammelten ist wohl imstande, in der Gefolgschaft des Wortes Gottes mit diesem von der Erde, hinweg aus dem Gesichtskreis beschränkter, niedriger Anschauungen, emporzusteigen auf den geistigen Berg erhabenster Betrachtung? Dieser Berg ist jedem Schatten entrückt, der von den nur allzu hohen Erdhügeln des Bösen ausgeht, und läßt, auf allen Seiten vom Strahle des wahren Lichtes beleuchtet, in der reinen Himmelsluft der Wahrheit uns alles ringsumher zu unseren Füßen sehen, was jene nicht schauen können, die in engen Tälern eingeschlossen sind. Die Beschaffenheit und die Größe dessen aber, was man von dieser Höhe aus erblickt, legt Gott durch sein Wort selbst dar, indem es seligpreist, welche mit ihm emporsteigen, und dabei gleichsam mit dem Finger zeigt sowohl auf das Himmelreich und auf das Land da droben als auch auf die Barmherzigkeit, Gerechtigkeit, Tröstung und auf die Verwandtschaft mit Gott, dem Herrn des Universums, dann auf die Frucht ausgestandener Verfolgung, die in der Vereinigung mit Gott besteht, sowie noch auf alles andere, was wir, vom Worte Gottes aufmerksam gemacht, hoch oben auf dem Berge, gleichsam wie von hoher Warte aus mit dem Auge der Hoffnung zu sehen vermögen. Weil also der Herr den Berg besteigt, so wollen wir auf Isaias hören, der uns zuruft: „Kommet, lasset uns emporsteigen auf den Berg des Herrn!“ (Is. 2, 3). Und wenn wir infolge unserer Sündhaftigkeit schwach werden, so wollen wir nach des Propheten Wort die müden Arme und die ermattenden Knie aufs neue stärken (Is. 35, 3). Denn wenn wir auf dem Gipfel angelangt sind, so werden wir dort den finden, der jede Krankheit und Schwäche heilt, der unsere Ohnmacht auf sich nimmt und unser Elend trägt (Is. 53, 4). Wollen daher auch wir zum Aufstieg uns beeilen, damit wir, mit Jesus auf dem (aus Ber. lies: „dem“ statt „den“) ersehnten Gipfel angelangt, ringsumher all die Güter sehen, welche das Wort jedem zeigt, der ihm auf die Höhe folgt. Nun, so möge denn Gott, das Wort, auch für uns seinen Mund öffnen und uns lehren, was zu hören Seligkeit ist.</p><p>Machen wir den Anfang der Betrachtung mit dem Anfang der Bergpredigt! Derselbe lautet: „Selig sind die Armen im Geiste; denn ihrer ist das Himmelreich!“ Wenn ein Mensch, voll Gier nach Geld, auf Schriften stößt, die ihm einen Schatz an einem bestimmten Ort verraten, der Platz aber, der den Schatz enthält, dem Geldgierigen viel Schweiß und Mühe schon im voraus ankündigt, wird dieser nun den Anstrengungen gegenüber erschlaffen, auf den Gewinn leichthin verzichten und trotz seines Gelddurstes es für süßer halten, keine Mühe aufzuwenden als reich zu werden? Nein, abermals nein! Im Gegenteil, rasch wird er seine Freunde rufen, von allen Seiten Hilfe herbeiholen und mit einem ganzen Aufgebot von Arbeitskräften darangehen, den verborgenen Schatz zu seinem Eigentum zu machen. Damit ist, meine Brüder, jener Schatz gemeint, auf den die Heilige Schrift aufmerksam macht und der auch unter einem gewissen Dunkel verborgen liegt. Verlangend nach lauterem Golde, wollen wir uns daher eifriger Gebete wie vieler Hände bedienen, damit wir den Reichtum heben und dann gleichmäßig den Schatz teilen, so daß jeder ihn ganz erwerbe. Denn, handelt es sich um eine Verteilung der Tugend, so kann sie allen, die nach ihr streben, gegeben werden, und jedem fällt sie ganz zu, ohne daß die Mitbesitzer irgendwie benachteiligt werden. Bei der Verteilung von irdischem Reichtum allerdings schädigt einer, der mehr an sich reißt, die anderen, mit denen er teilen soll; denn wer einen größeren Anteil nimmt, vermindert notwendig den Anteil seiner Genossen. Der geistige Reichtum aber macht es wie die Sonne, indem er allen Anteil an sich gewährt, die ihr Augenmerk auf ihn richten, und ganz in das Eigentum eines jeden übergeht. Da demnach alle den gleichen Gewinn aus ihrer Anstrengung erhoffen dürfen, so mögen uns alle in gleicher Weise durch ihre Gebete bei unserer Betrachtung unterstützen.</p><p>An erster Stelle müssen wir nun, wie ich glaube, erwägen, was denn Seligkeit an und für sich bedeutet. Seligkeit ist nach meinem Dafürhalten der Inbegriff alles Guten, worin auch die Erfüllung eines jeglichen berechtigten Verlangens eingeschlossen ist. Auch aus der Vergegenwärtigung des Gegenteils von dem, was Seligkeit bedeutet, können wir zu größerer Klarheit gelangen. Das Gegenteil von „glückselig“ ist „mühselig“. Mühseligkeit hinwiederum ist die Plage, welche unangenehme, schmerzliche Gefühle erzeugt. Je nachdem der Mensch glückselig oder mühselig ist, ist seine Gemütsverfassung ganz verschieden: wer glückseliggepriesen wird, kann sich freuen und froh genießen, was die Gegenwart ihm bietet; wer aber unselig oder unglücklich genannt wird, kann sich über seine Lage nur betrüben und Leid empfinden. Was nun aber in Wahrheit glückselig ist, das ist das göttliche Wesen. Denn was wir uns immer auch darunter vorstellen mögen, auf jeden Fall ist voll Seligkeit jenes reine Leben, das unendliche, unbegreifliche Gut, die unaussprechliche Schönheit, die lautere Anmut, Weisheit und Kraft, das wahrhaftige Licht, die Quelle alles Guten, die das Universum beherrschende Macht, das einzig Liebenswerte, das stets Unveränderliche, das immerfort in Wonne Strahlende, die ewige Freude, jenes Wesen, das wir nie nach Gebühr schildern können, auch wenn wir alles Herrliche von ihm aussagen, was wir nur immer ersinnen können. Denn teils erreicht unser Denken die Wirklichkeit nicht, teils können wir unsere Gedanken, falls sie sich hoch emporschwingen, nicht in die entsprechenden Worte kleiden.</p><p>Da aber Gott den Menschen nach seinem Ebenbilde geschaffen, so wird an zweiter Stelle derjenige seligzupreisen sein, dem wir auf Grund seiner Teilnahme an der wirklichen, unendlichen Glückseligkeit diesen Namen geben. Denn wie hinsichtlich der leiblichen Wohlgestalt das schöne Original in der lebendigen Person vorliegt und den zweiten Rang die in einer Nachbildung dargestellte Schönheit einnimmt, so trägt die menschliche Natur als Abbild der höheren göttlichen Glückseligkeit die Züge edler Schönheit an sich, so lange sie auch die übrigen dem unendlich Glückseligen zukommenden guten Eigenschaften, ebenfalls abbildungsweise, an sich aufweist. Als aber der Schmutz der Sünde die Schönheit des Abbildes verwischt hatte, erschien der, welcher mit seinem lebendigen und ins ewige Leben fortströmenden Wasser uns abwäscht, so daß wir die Häßlichkeit der Sünde ablegen und in seliger Schönheit wieder erneuert werden. Und wie der Kunstverständige hinsichtlich der Gemälde zu den Unkundigen sagen kann, jene Person sei schön gemalt, die so und so beschaffene Körperteile hat, z.B. solche Haare, solche Augen, so gezeichnete Brauen, so eine Gestaltung der Wangen und alle anderen Erfordernisse, die zu einer vollkommenen Schönheit gehören, so beschreibt auch der, welcher die Seele wie in einem Gemälde dem allein wahrhaft Seligen nachbilden möchte, in seiner Zeichnung alle Einzelheiten, die in uns vereinigt sein müssen, um mit Recht seliggepriesen werden zu können. Zuerst nun verkündet er: „Selig sind die Armen im Geiste, denn ihrer ist das Himmelreich!“</p><p>Doch was würden wir aus dem vom Herrn so freigebig erteilten Unterricht für einen Gewinn ziehen, wenn uns nicht der in den Worten liegende Sinn enthüllt würde? Denn auch in der Heilkunde bleiben viele wertvolle und seltene Arzneimittel für den hierin Unwissenden unverwendbar und unnütz, bis uns die medizinische Wissenschaft lehrt, wozu jedes dienlich ist. Was bedeutet nun „das Armsein im Geiste“, als dessen Frucht der Besitz des Himmelreiches verheißen wird? Einen doppelten Reichtum lernen wir aus der Schrift kennen: einen, der hochgeschätzt, und einen, der verworfen wird. Hochgeschätzt wird der Reichtum an Tugenden, verworfen der materielle, irdische, weil jener ein Gut der Seele, dieser dagegen geeignet ist, den sinnlichen Menschen zu täuschen und zu verführen. Letzteren zu sammeln, verbietet der Herr, weil er der Verzehrung durch Motten und den Nachstellungen der Diebe ausgesetzt ist; den Reichtum an höheren Gütern dagegen befiehlt er, eifrig anzustreben, weil keine Macht der Zerstörung an ihn heranreicht (Matth. 6, 19 f.); mit der Motte und dem Diebe hat er auf den hingewiesen, der die Schätze der Seele rauben möchte. Wenn nun die Armut das gerade Gegenteil des Reichtums ist, so liegt es nahe, auch eine doppelte Armut anzunehmen: eine, die zu verwerfen, und eine, die seligzupreisen ist. Wer arm ist an Mäßigung oder an dem kostbaren Gut der Gerechtigkeit oder an Weisheit oder an Klugheit, oder wer überhaupt an einem der wirklich kostbaren Güter Mangel leidet und wie ein Bettler erscheint, ist unglücklich wegen seiner Dürftigkeit und bedauernswert wegen seiner Armut an den wahrhaft wertvollen Gütern. Wer aber an allem, was böse ist, kraft seiner freien Willensentscheidung Not leidet und von den teuflischen Gütern nichts in seinen Kammern hinterlegt hat, sondern im Geiste glüht und durch diesen die Armut am Bösen für sich als Schatz aufbewahrt, der ist es wohl, dem das Wort Gottes die Armut, welche es seligpreist, zuerkennt und deren Lohn das Himmelreich ist.</p><p>Doch kehren wir zu unserem Gegenstande zurück, um nach Schätzen zu graben, und lassen wir nicht ab, wie ein Bergmann zu forschen, um das Verborgene an das Tageslicht zu befördern. Es heißt: „Selig sind die Armen im Geiste!“ Schon früher wurde es in gewisser Hinsicht hervorgehoben und soll jetzt wiederholt werden, daß das Ziel und Ende des Tugendstrebens in unserer Verähnlichung mit Gott besteht. Nun entzieht sich aber Gott, weil er vollständig ohne Leidenschaft und ohne Makel ist, einer* durchaus* vollkommenen Nachahmung von seiten der Menschen; denn es ist unmöglich, daß sich das in Leidenschaften befangene Menschenleben allseitig jener Natur angleiche, die keiner Leidenschaft fähig ist. Wenn nun Gott nach dem Apostel „allein selig“ ist (1 Tim. 1, 11), die Menschen aber einerseits nur durch ihre Angleichung an Gott an der Seligkeit teilnehmen, andererseits die allseitige Nachahmung Gottes durch uns ausgeschlossen ist, so ist folglich eine vollkommene Seligkeit für das menschliche Leben unerreichbar. Teilweise jedoch bietet sich Gott den Menschen, die wollen, zur Nachahmung dar. Inwiefern? Mit „der Armut im Geiste“ scheint mir das Wort die freiwillige Verdemütigung zu bezeichnen. Als Beispiel hiefür stellt uns der Apostel jene „Armut“ Gottes vor, die er im Auge hat, wenn er von Gott sagt, daß er „unsertwegen arm wurde, damit wir durch seine Armut reich würden“ (2 Kor. 8, 9). Da nun alle anderen Eigenschaften, die wir an Gott erkennen, das Maß der menschlichen Natur übersteigen, die Demut und die Erniedrigung aber uns gewissermaßen angeboren ist und innig mit uns verwachsen ist, die wir da auf Erden wandeln, aus der Erde unser Dasein fristen und zur Erde wieder zurückkehren, so hast du, wenn du Gott in dem nachahmst, was deiner Natur entspricht, auch die selige Schönheit angezogen.</p><p>Niemand aber glaube, daß die Tugend der Demut mühelos und leicht erworben werde! Im Gegenteil ist sie schwerer zu erlangen als jede andere Tugend, wie sie auch heiße. Warum? Deshalb, weil, während der Mensch nach Aufnahme des guten Samens sich dem Schlaf überließ, gerade der gefährlichste Bestandteil des entgegengesetzten Samens, nämlich das Unkraut des Hochmutes vom Feinde unseres Lebens ausgestreut ward und Wurzel faßte. Denn durch dieselbe Sünde, durch die unser Widersacher sich auf die (aus Ber. lies: „die“ statt „der“) Erde herabstürzte, riß er das unglückliche Menschengeschlecht in gemeinsamem Falle mit sich; und kein anderes Übel ist für uns so schlimm, wie das des Hochmutes. Da nun die Leidenschaft des Hochmutes fast mit jedem, der an der menschlichen Natur teilnimmt, sozusagen verwachsen ist, so stellt der Herr, um denselben gewissermaßen als das Grundübel aus unseren Seelen zu entfernen, die Mahnung an die Spitze der Seligpreisungen, den freiwillig arm Gewordenen nachzuahmen, der wahrhaft glückselig ist, damit wir in dem Punkte, in welchem wir es vermögen, das heißt durch freiwillige Armut nach Kräften ähnlich werden und dadurch auch Anteil an der Seligpreisung erhalten.</p><p>Denn so heißt es: „Ihr sollt so gesinnt sein, wie Jesus Christus, der, obschon er göttlichen Wesens war, es nicht für Raub ansah, Gott gleich zu sein, sondern sich selbst entäußerte und Knechtsgestalt annahm“ (Phil. 2, 5). Was ist armseliger für Gott als die Knechtsgestalt? was ist niedriger für den König der Welt als die Niedrigkeit unserer Natur zu teilen? Der König der Könige und der Herr der Herren nimmt freiwillig Knechtsgestalt an; der Richter über die ganze Menschheit wird einem irdischen Fürsten zinspflichtig! Der Herr der Schöpfung kehrt in einer Höhle ein; er, der das Weltall umfangen hält, findet keinen Platz in der Herberge, sondern muß sich ausgestoßen in die Krippe unvernünftiger Tiere legen lassen! Der ganz Reine und Unbefleckte läßt sich zur Annahme der schmutzigen menschlichen Natur herab; und nachdem er den Weg durch unsere ganze Armseligkeit zurückgelegt hatte, geht er so weit, daß er auch dem Tod sich unterzieht! Sehet da das Vollmaß der Demut: das Leben verkostet den Tod, der Richter wird vor den Richterstuhl geschleppt, der Herr, durch den alle leben, unterwirft sich dem Todesurteil des Richters; der Gebieter über alle himmlischen Mächte und Gewalten stößt nicht die Hände der Schergen von sich! Nach diesem Beispiele, mahnt der Apostel, richte sich das Maß deiner Demut!</p><p>Es wird gut sein, auch das Unvernünftige jener Leidenschaft des Hochmuts zu betrachten, damit wir, wenn wir die Demut leichter und sicherer erlangen, auch die Seligpreisung leichter erwerben. Wie erfahrene Ärzte dadurch, daß sie zuvor die Ursache der Krankheit aus dem Körper entfernen, leichter die Krankheit bewältigen, so wollen auch wir den Hochmütigen dadurch, daß wir ihrer nichtigen Aufgeblasenheit mit Gründen der Vernunft auf den Leib rücken, den Weg zur Demut erleichtern. Womit könnte man wohl das Törichte des Hochmutes kräftiger nachweisen als damit, daß man aufweist, welche Bewandtnis es mit unserer Menschennatur hat? Denn wer auf sich selbst sieht, und nicht auf das Äußere, das ihn umgibt, von dem ist es nicht gut denkbar, daß er in jene Leidenschaft verfällt. Was ist nun der Mensch? Willst du, daß ich eine Art Lobeshymnus auf dich anstimme? Nein, sogar derjenige, der unsere Natur verherrlichen und den Adel des Menschen ziemlich stark preisen möchte, führt seine Entstehung auf ― Lehmerde zurück, und die vornehme Abstammung, mit dem der Hochmütige prunken will, macht ihn verwandt mit ― dem Backstein! Willst du aber deinen unmittelbaren, allernächsten Ursprung hervorheben ― weg damit! Sprich hierüber kein Wort! enthülle nicht, wie es im Gesetze heißt, die Scham deines Vaters und deiner Mutter (Lev. 18, 6)! ziehe nicht in die Öffentlichkeit, was vergessen und in tiefes Schweigen gehüllt werden soll!</p><p>Und da schämst du dich nicht, du Erdenkloß, der bald wieder in Staub zurücksinkt, der du, einer Wasserblase gleich, schnell zerstiebende Luft in dir birgst, ― da schämst du dich nicht, mit Hochmut dich zu füllen, vor Eigendünkel aufzuschwellen und deinen Geist in törichter Einbildung emporzurecken? Offensichtlich vergissest du ganz auf die beiden Pole des Menschenlebens, wie es nämlich anfängt und wie es aufhört, sondern bist stolz auf deine Jugend, schaust auf dein blühendes Alter und gefällst dir in deiner Lebensfrische, weil deine Arme voll strotzender Kraft sich bewegen, deine Füße behend im Springen sich zeigen, deine Locken in den Lüften wehen, der Flaum deine Lippen untermalt und weil dir dein Kleid in Purpurfarbe leuchtet und deine seidenen Gewebe dir bunt geschmückt sind mit Bildern von Schlachten und Jagden und ähnlichen Darstellungen! Oder du siehst vielleicht mit Stolz auf deine Fußkleidung, die in tadellosem Schwarz funkelt und in überkünstlicher Weise noch durch ihre eingesteppten Zieraten ergötzen soll! Auf solche Sachen fällt dein Blick, und auf dich selbst schaust du nicht? Ich will dir wie in einem Spiegel zeigen, wer du bist und welches deine Beschaffenheit ist. Hast du noch auf keinem Beerdigungsplatz die Geheimnisse unserer Natur beobachtet? Hast du nicht die aufeinandergehäuften Knochen gesehen, die von Fleisch entblößten Schädel, wie sie furchtbar und gräßlich mit den leeren Augenhöhlen uns anstieren? Hast du den zähnefletschenden Mund gesehen und die übrigen Gliedmaßen, wie sie umherliegen, aufs Geratewohl hingestreut? Hast du dies gesehen, so hast du darin ― dich selbst gesehen. Wo sind die Zeichen deiner gegenwärtigen Blüte? wo die schöne Farbe deiner Wange? wo deine reizenden Lippen? wo die kecke Schönheit deiner Augen, die unter geschwungenen Brauen hervorleuchtet? wo die geradlinige Nase im feinen Antlitz? wo die um den Nacken wallenden Haare und die Locken um die Schläfe? Wo sind die Hände, die den Pfeil vom Bogen schnellen, die Füße, die das Pferd spornen? Wo ist der Purpur, wo das feine Linnenkleid aus Byssos, wo der Mantel, der Gürtel, die Schuhe? Wo ist das Pferd und sein Lauf, sein Übermut? Wohin ist alles, was jetzt deinen Hochmut nährt? Sag an, wo ist hier das zu finden, weshalb du dich überhebst und dich groß dünkst? Wo ist hier noch ein so eitler Traum? wo noch solche Wahnvorstellungen eines Schlafenden, wo ein so schwaches, ungreifbares Schattenbild wie das der Jugend? Alles erscheint wie ein Traum, der kaum gekommen, sogleich vorüberhuscht!</p><p>Soviel für die Jugend, welche infolge der Unreife ihres Alters noch der Torheit sich hingibt! Was soll man aber von den Menschen gesetzten Alters sagen, wenn zwar das leibliche Wachstum zum Stillstand kam, ihre Sinnesart jedoch noch ohne Halt ist und die Krankheit ihres Hochmutes noch zunimmt? Man nennt eine solche Geistesschwäche nicht selten „Selbstgefühl“. Bei solchen ist gewöhnlich hohe Stellung und der damit verbundene Einfluß der Grund des Hochmutes. Sie ergeben sich ihm entweder, wenn sie zu jener angesehenen Stellung gelangen, oder auch schon, wenn sie sich darauf vorbereiten, oder die bloße Rede, wenn sie sich damit befaßt, weckt die Krankheit aufs neue, auch wenn sie fast schon erloschen war. Welche Belehrung vermöchte in ihre Ohren zu dringen, da sie schon angefüllt sind von der Stimme der Herolde, die ihre hohe Stellung ausrufen? Wer könnte Menschen von solcher Geistesverfassung davon überzeugen, daß sie sich nicht im geringsten von den Leuten unterscheiden, welche auf der Bühne einherstolzieren. Denn auch diese haben, wie es ihr Beruf mit sich bringt, nicht selten eine glänzende Rolle zu übernehmen und tragen infolgedessen auch ein goldbesetztes Purpurgewand, oder sie fahren gar stattlich zu Wagen daher. Aber gleichwohl beschleicht sie nicht die Krankheit des Hochmutes, sondern die Meinung, die sie von sich vor dem Auftreten im Theater hatten, bewahren sie auch bei ihrem prunkvollen Aufzuge und betrüben sich auch nachher nicht, wenn sie aus dem Wagen steigen und ihr Kostüm wieder ablegen müssen. Gar viele aber, welche während ihrer Amtsführung feierlich auf der Bühne des Lebens einherziehen, bedenken weder, was sie vor kurzem waren, noch was sie in kurzem sein werden, sondern wie die Wasserblasen infolge der aufblähenden Luft sich ausdehnen, spreizen sie sich bei dem Ausrufen des Herolds und setzen selbst eine andere Larve auf, indem sie ihre natürliche Miene in ein strenges Gesicht verwandeln, um Furcht einzujagen. Auch nehmen sie eine Kraftstimme an und gebrauchen starke Ausdrücke, um alle einzuschüchtern, die sie hören. Nicht mehr innerhalb der Grenzen, welche den Menschen gezogen sind, wollen sie bleiben, sondern sie drängen sich in die göttliche Macht und Gewalt. Denn sie bilden sich ein, Herr über Leben und Tod zu sein, weil sie über den einen, der vor ihrem Richterstuhl steht, ein freisprechendes Urteil fällen, den anderen zum Tod verurteilen. Nicht einmal das sehen sie mehr, wer in Wahrheit der Herr des menschlichen Lebens ist, der den Anfang und das Ende unseres Daseins bestimmt. Und doch wäre dies allein schon geeignet, dergleichen Aufgeblasenheit zu dämpfen, wenn man sieht, daß viele Hochgestellte gerade in dem Augenblick, wo sie ihre Hoheit zur Schau stellen wollten, vom Herrscherstuhl herabgerissen und ins Grab gelegt wurden, wo Trauergesang das Geschrei des Herolds ablöst. Wie soll also der über fremdes Leben Herr sein, dem nicht einmal sein eigenes Leben gehört? Im Hinblick aber auf den, der für uns freiwillig arm geworden, und in Erinnerung an die Armseligkeit der uns allen gemeinsamen Natur sollen auch Hochgestellte im Geiste arm sein und sich infolgedessen keinen Übermut gegen einen Mitmenschen wegen ihrer eitlen Machthaber-Rolle erlauben; auf diese Weise nehmen sie teil an der Seligpreisung ob der Demütigung, die sie während eines kurzen Lebens geübt haben und für die sie das Himmelreich eintauschen.</p><p>Verschmähe, mein Bruder, auch die andere Auffassung der Armut nicht, die dir den Reichtum des Himmels verschaffen kann. Der Herr sagt nämlich: „Verkaufe alles, was du hast, gib es den Armen, dann komm und folge mir nach, und du wirst einen Schatz im Himmel haben“ (Matth. 19, 31). Auch diese Armut stimmt gewiß mit der seliggepriesenen Armut überein. Ein Jünger sprach zum Herrn: „Siehe, alles, was wir hatten, haben wir verlassen und sind dir nachgefolgt; was wird uns dafür zuteil werden?“ (Matth. 19, 27). Und wie lautete die Antwort: „Selig sind die Armen im Geiste; denn ihrer ist das Himmelreich!“ Willst du wissen, wer arm im Geiste ist? Derjenige, welcher den Reichtum der Seele für das Wohlergehen des Leibes eintauscht; der um des Geistes wegen Not leidet, der den irdischen Reichtum wie eine Last abschüttelt, damit er sich emporheben und durch die Lüfte nach oben sich schwingen kann, um, wie der Apostel sagt: „dem Herrn entgegen auf den Wolken dahinzuziehen“ (1 Thess. 4, 17). Ein gar schweres Ding ist das Gold, schwer der ganze materielle Besitz, den man im Reichtum erstrebt, eine gar leichte und aufwärts führende Sache aber ist die Tugend. Die Schwere und die Leichtigkeit sind Gegensätze, die einander ausschließen. Darum kann keinem Leichtigkeit zukommen, der sich an die Schwere der Materie heftet. Wenn wir also zum Höchsten uns erheben wollen, so lasset uns arm sein an dem, was nach unten zieht, damit wir zu dem gelangen, was oben ist. Auf welche Weise das geschieht, lehrt der Psalmist: „Er streute aus und gab den Armen; seine Gerechtigkeit bleibt ewiglich“ (Ps. 112, 9 [= hebr.] [Septuag. u. Vulgata = Ps. 111, 9]). Wer den Armen mitteilt, darf sich auf die Seite dessen stellen, der unsertwegen arm geworden. Der Herr ist arm geworden; darum fürchte auch du die Armut nicht! Aber siehe! derjenige, der unsertwegen arm geworden war, herrscht jetzt über die ganze Welt. Wenn du demnach mit dem arm Gewordenen arm wirst, so wirst du auch herrschen mit dem, der jetzt herrscht. Selig sind also die Armen im Geiste; denn ihrer ist das Himmelreich! Mögen auch wir desselben gewürdigt werden ― durch Christus Jesus, unseren Herrn, dem die Ehre und Macht sei von Ewigkeit zu Ewigkeit. Amen.Zweite Rede: „Selig sind die Sanftmütigen; denn sie werden das Erdreich besitzen.“</p><h2>2</h2><p>Wer auf einer Leiter in die Höhe steigt, erhebt sich, nachdem er die erste Sprosse betreten, über diese hinweg zur nächst höheren, die zweite führt ihn wiederum zur dritten, diese zur folgenden, diese wiederum zu der, die nach ihr kommt, und so gelangt er beim Emporsteigen, indem er sich von seinem Standpunkt immer zur nächsthöheren Sprosse erhebt, weiter bis auf die höchste Stufe der Leiter. Was beabsichtige ich mit diesem Eingang? Ich glaube, die Reihe der Seligpreisungen ist wie das Sprossenwerk einer Leiter angelegt, und macht es für die Betrachtung leicht, von Stufe zu Stufe emporzusteigen. Denn, wer im Geiste die erste Stufe der Seligpreisung betreten hat, den nimmt gewissermaßen mit zwingender Notwendigkeit die nächste auf.</p><p>Allerdings klingt das Gesagte auffällig, denn wer es hört, könnte einwenden: unmöglich könne man wie in der Weise einer Stufenfolge die Erbschaft des Erdreiches über dem Himmelreiche antreffen, eher wäre, wenn die Rede dem natürlichen Verhältnis der Dinge sich anschließen will, es viel folgerichtiger, daß die Erde ihren Platz vor dem Himmel fände, da wir ja von dieser zu jenem emporsteigen müßten. Doch wenn unsere Gedanken sozusagen Flügel bekämen und uns über das Himmelsgewölbe tragen könnten, so würden wir jene über dem Himmel liegende Erde finden, die den Tugendhaften als Erbe versprochen ist. Demnach ist die Ordnung in der Reihenfolge nicht verfehlt, wenn uns Gott in seinen Verheißungen zuerst den Himmel, dann die Erde vor Augen stellt. Denn alles, was man sieht, ist für die sinnliche Wahrnehmung durch das Auge miteinander nahe verwandt, insofern auch das, was der räumlichen Dimension nach hoch erscheint, doch unterhalb der geistigen Natur liegt. Zu dieser aber kann sich unser Denken nicht erheben, wenn es nicht zuvor geistig das Reich des sinnlich Wahrnehmbaren durchschritten hat. Darüber, daß mit dem Ausdruck „Erdreich“, die höhergelegene Region bezeichnet wird, darfst du dich nicht wundern; denn das Wort Gottes läßt sich zur Niedrigkeit unseres Gehörsinnes herab, das deshalb zu uns herabgestiegen ist, weil wir nicht imstande waren, uns zu seiner Höhe zu erheben. Mit den uns bekannten Ausdrücken und Namen unterrichtet es uns über die göttlichen Geheimnisse, indem es Worte gebraucht, die im menschlichen Leben gang und gäbe sind. Auch in der vorausgehenden Verheißung hat es die unaussprechliche Seligkeit im Himmel ein „Reich“ genannt. Wollte es damit vielleicht etwas bezeichnen, was den irdischen Reichen zukommt, z. B. Diadem, vom Glanz der Edelsteine umstrahlt, Purpurkleider, die das lüsterne Auge mit leuchtender Farbenpracht ergötzen, Vorzimmer, Vorhänge, hohe Thronsessel, Soldaten in Reih und Glied und all den anderen überschwenglichen Prunk, womit diejenigen, welche den majestätischen Eindruck des Herrschertums noch steigern wollen, das große Schaustück auf der Bühne des Lebens ausstatten? Aber nachdem nun einmal der Ausdruck „Reich“ etwas Großes bedeutet und die erste Stelle unter allem einnimmt, was von den Menschen hochgeschätzt wird, so bediente sich das Wort Gottes gerade dieser Bezeichnung, um uns die Größe der geistigen Güter besser zu veranschaulichen. Würde es jedoch bei den Menschen noch etwas Höheres geben als Reich, so würde es sicher auch diese Namen verwenden, um die Seele des Zuhörers zum Verlangen nach jener Glückseligkeit zu entzünden, die unaussprechlich ist; denn unmöglich können die himmlischen Güter, die all unser menschliches Wahrnehmen und Erkennen übersteigen, uns mit ihren eigentlichen Namen enthüllt werden. Denn „kein Auge hat es gesehen, kein Ohr gehört und in keines Menschen Herz ist es gedrungen“ (1 Kor. 2, 9). Damit jedoch die Glückseligkeit, auf die wir hoffen dürfen, nicht ganz unserem Vorstellungsvermögen sich entziehe, so werden wir mit ihrer unaussprechlichen Herrlichkeit in einer Weise bekannt gemacht, die der Niedrigkeit unserer Natur entspricht. Der Doppelsinn des Wortes „Erde“ darf also deinen Geist nicht wieder aus der Welt jenseits des Himmels auf die niedrige Erde herabziehen, sondern wenn dich das Wort Gottes durch die vorausgehende Seligpreisung emporführte und du den Boden der himmlischen Hoffnung betreten hast, so fasse jene Erde ins Auge, die nicht allen als Erbe zufällt, sondern denen, die durch ihre im Leben geübte Sanftmut jener Verheißung für würdig erachtet werden.</p><p>Diese jenseitige Erde, glaube ich, hat auch der große David, dem die Göttliche Schrift das Zeugnis gibt, vor allen seinen Zeitgenossen sanft und geduldig gewesen zu sein, durch die Eingebung des Heiligen Geistes vorauserkannt und im Glauben deren Besitz erhofft, als er sagte: „Ich glaube, damit ich sehe die Güter des Herrn im Lande der Lebendigen“ (Ps. 27, 13 [= hebr.] [Septuag. u. Vulgata = Ps. 26, 13]). Denn ich nehme nicht an, der Prophet habe unsere Erde als „Land der Lebendigen“ bezeichnet, da sie doch alles Sterbliche erzeugt und alles, was sie erzeugt, wieder in Erde auflöst. Vielmehr hatte er eine Erde der Lebendigen im Sinne, die der Tod nicht betritt, auf der niemals der Weg der Sünde beschritten wird, auf welche die Bosheit ihren Fuß nicht setzt, welche der Sämann des Unkrautes nicht mit seinem Pfluge aufreißt, die keine Disteln und Dornen trägt, wo das Wasser der Ruhe und der Ort des ewig frischen Grüns sich findet und die vierfach geteilte Quelle und der vom Herrn der Welt gepflegte Weinstock und alles, was wir sonst noch durch die von Gott angegebene Belehrung in Bildern kennenlernen. Wenn wir nun jene höhere Erde im Auge behalten, die wir über dem Himmel sehen, auf der die Stadt des Königs erbaut ist, über die nach dem Propheten Herrliches gesprochen wurde (Ps. 87, 3 [= hebr.] [Septuag. u. Vulgata = Ps. 86, 3]), so wird uns die Reihenfolge der Seligpreisungen nicht mehr befremden. Denn es wäre wohl etwas ungereimt, wenn die Erde hienieden den Segenshoffnungen derer in Aussicht gestellt wäre, die nach der Lehre des Apostels auf Wolken entrückt werden in die Luft, um immerdar beim Herrn zu sein. Was brauchen wir also noch diese Erde hier unten, da unser Leben auf Hoffnung nach oben gestellt ist? Denn „wir werden auf den Wolken entrückt, dem Herrn entgegen, in die Luft und werden immerdar beim Herrn sein“ (1 Thess. 4, 17).</p><p>Doch laßt uns sehen, für welche Tugend die Erbschaft jener Erde als Ehrenpreis gesetzt ist. Es heißt: „Selig sind die Sanftmütigen; denn sie werden das Erdreich besitzen!“ Worin besteht die Sanftmut und in welcher Hinsicht preist das Wort Gottes die Sanftmut selig? Ich glaube nämlich nicht, daß man alles in gleicher Weise für Tugend halten darf, was mit Sanftmut geschieht, falls man darunter nur ein schwerbewegliches und gelassenes Wesen versteht; denn weder bekommt unter den Läufern der Langsame den Vorrang vor dem Flinken, noch trägt im Faustkampfe der Schwerfällige den Siegeskranz über seinen Gegner davon; und in bezug auf unsere Aufgabe, nach dem Kampfpreis unserer höheren Bestimmung zu laufen, mahnt uns Paulus zu angestrengter Eile, indem er uns zuruft: „Laufet so, daß ihr ihn erlanget“ (1 Kor. 9, 24). Auch er strebte ja in stets größerer Beweglichkeit vorwärts und vergaß, was hinter ihm lag. Ebenso war er im Kampfe flink; denn er achtete genau auf den Vorstoß seines Gegners, hielt fest stand und schwang sein Schwert mit starker Hand nicht ins Blaue und Leere, sondern führte die Schläge nach den verwundbaren Stellen des Gegners und gegen den Körper desselben. Willst du dich überzeugen von der Fechtkunst des Paulus? Betrachte die Wunden seines Gegners, betrachte seine Beulen, betrachte die Verletzungen des Besiegten! Zweifellos kennst du den Gegner, der ihn im Fleische bekämpft, dem er aber mit starker Faust erwidert, den er mit den Nägeln der Enthaltsamkeit durchbohrt, dessen Glieder er durch Hunger, Durst, Kälte und Blöße abtötet, dem er die Wundmale des Herrn eindrückt, den er im Laufe besiegt und hinter sich läßt, damit nicht Todesdunkel auf seine Augen falle, wenn der Feind ihn überholen würde. Wenn nun Paulus feurig und gewandt im Kampfe ist, wenn David im Ansturm gegen die Feinde seine Schritte vergrößert, wenn der Bräutigam im Hohenliede an Schnelligkeit mit der Gazelle verglichen wird, der über Berge springt und auf den Hügeln hüpft, und wenn man viele ähnliche Beispiele anführen kann, in denen Raschheit der Bewegung den Vorzug vor der Langsamkeit verdient ― warum preist dennoch das Wort Gottes hier die Sanftmut selig wie eine herrliche Errungenschaft? Es verkündet ja: „Selig die Sanftmütigen; denn sie werden das Erdreich besitzen“, jenes Erdreich ohne Zweifel, das reich ist an edlen Früchten, beschattet vom Baume des Lebens, bewässert von den Quellen der geistigen Gnadengaben, in dem der wahre Weinstock blüht, den, wie wir hören, der Vater des Herrn pflanzte (Joh. 15, 1).</p><p>Mir scheint nun das Wort ungefähr dies zu lehren, daß die Bereitwilligkeit zum Bösen groß ist und sich unsere Natur rasch auf die Seite des Schlechten neigt, ähnlich wie die schweren Körper in der Richtung nach oben ganz unbeweglich bleiben, dagegen, wenn sie von einer hohen Bergspitze über den Abhang gestoßen werden, mit sausender Gewalt nach unten stürzen, so daß ihre Schnelligkeit unbeschreiblich ist, weil eben die eigene Schwere den Sturz beschleunigt. Da demnach das Ungestüm in dieser Richtung ein widrig Ding ist, so ist gewiß seligzupreisen, was man unter dem entgegengesetzten Streben versteht. Das ist aber die Sanftmut, welche einen gegenüber solchen Triebkräften der Natur zögernden, schwerbeweglichen Zustand bezeichnet. Wie nämlich das Feuer seinem Wesen nach stets nach oben strebt, nach unten gar keine Beweglichkeit zeigt, so ist auch die Tugend in der Richtung nach oben und nach dem Höheren gar rührig und in ihrer Behendigkeit unermüdlich, nach der entgegengesetzten Richtung jedoch überaus langsam. Weil nun in unserer Natur die Schnelligkeit zum Bösen überwiegt, so wird mit Recht jener seliggepriesen, der in dieser Beziehung unbeweglich bleibt; denn wer nach dieser Richtung in voller Ruhe verharrt, liefert hierdurch den Beweis, daß er nach oben strebt.</p><p>Besser noch dürfte es sein, durch Beispiele aus dem Leben selbst die Sache zu erklären. Zweifach ist bei jedem Menschen die Bewegung des Willens, der in Freiheit sich dahin wendet, wohin es ihm beliebt: auf der einen Seite zur Mäßigung, auf der anderen zur Zügellosigkeit. Und was von den einzelnen Betätigungen der Tugend und der Lasterhaftigkeit gilt, das gilt von unserem ganzen Wesen. Der Mensch hat nämlich bei seinem Handeln überhaupt zwischen Gegensätzen zu wählen; so steht der Zorn im Gegensatz zur Gelassenheit, der Hochmut zur Demut, die Mißgunst zum Wohlwollen, der Haß zur liebevollen und der damit verwandten friedfertigen Gesinnung. Da nun unser Leben ein materielles ist, die Leidenschaften so zum Bereiche der Materie gehören und jede Leidenschaft einen heftigen, unwiderstehlichen Drang zur Befriedigung in sich schließt, ― schwer und nach abwärts ziehend ist die Materie ―, so preist der Herr nicht diejenigen selig, die ganz frei und unberührt von Leidenschaft leben; denn es ist unmöglich, sich in einem sinnlichen Leben vollkommen über Leidenschaft und Sinnlichkeit zu erheben. Er bezeichnet vielmehr die Sanftmut als die im fleischlichen Leben erreichbare höchste Stufe der Tugend und erklärt, daß es zur Seligkeit genüge, sanftmütig zu sein. Nicht gänzliche Unempfindlichkeit fordert er von der menschlichen Natur, weil ja nur ein ungerechter Gesetzgeber verlangen könnte, was die menschliche Natur nicht zu leisten vermag. Denn ein solches Verlangen wäre so, wie wenn man den Wassertieren das Leben in der Luft und den Vögeln den Aufenthalt im Wasser anweisen wollte; vielmehr muß ein Gesetz den besonderen und natürlichen Kräften der verschiedenen Wesen entsprechen. Deshalb befiehlt die Seligpreisung nur Mäßigung und Sanftmut, nicht gänzliche Unempfindlichkeit; letztere überschreitet die Kräfte unserer Natur, erstere aber lassen sich durch Tugend erreichen. Würde also die Seligpreisung gänzliche Unempfänglichkeit gegenüber der Begierde zu ihrer Grundlage machen, so wäre sie für das Leben unnütz und unbrauchbar. Wie könnte ein solches Verlangen von dem erfüllt werden, der an Fleisch und Blut gebunden ist? So aber erklärt sie nicht den für verdammenswert, der zufällig von der Begierde erfaßt wird, sondern den, der die Begierde vorsätzlich an sich heranzieht. Denn daß zuweilen eine leidenschaftliche Begierde in uns sich regt, das veranlaßt oft die mit unserer Natur engverbundene Schwäche auch gegen unseren Willen. Daß man sich aber nicht wie ein Gießbach vom Drange der Leidenschaft fortreißen lasse, sondern mannhaft einem solchen Triebe widerstehe und durch Gründe des Geistes die Leidenschaft zurücktreibe, das muß die Tugend bewirken. Selig sind also jene, die den leidenschaftlichen Regungen der Seele nicht schnell nachgeben, sondern durch Mäßigung die Ruhe im Innern bewahren, jene, bei denen die Vernunft wie ein Zügel die Triebe im Zaume hält und die Seele nicht zur Ausschreitung durchgehen läßt.</p><p>Mehr noch kann man an der Leidenschaft des Zornes ersehen, wie die Sanftmut seligzupreisen ist. Wenn nämlich ein nicht ganz angenehmes Wort, eine Tat oder auch nur eine Vermutung diese Krankheit erregt und das Blut im Herzen kocht und die Seele zur Rache sich erhebt, so kann man, wie in den Göttermärchen infolge von Zaubertränken Verwandlungen in unvernünftige Tiere vorkommen, oft genug beobachten, wie ein Mensch durch den Zorn plötzlich in ein Schwein, in einen Hund oder Panther oder sonst in ein wildes Tier verwandelt wird. Das Auge ist mit Blut unterlaufen, die Haare stehen starr zu Berge, die Stimme wird heiser und stößt heftige Ausdrücke hervor; die Zunge wird durch die Leidenschaft fast gelähmt und ist kaum mehr imstande, den Anweisungen des Willens zu gehorchen, die Lippen sind steif und unfähig, die Worte richtig zu bilden; auch können sie die Feuchtigkeit, die infolge der Aufregung im Munde entsteht, nicht zurückhalten, sondern speien beim Sprechen den Geifer in unanständiger Weise aus. Ähnliches gilt von den Händen, von den Füßen, ja vom ganzen Körper: jedes Glied wird von der Leidenschaft gar übel beeinflußt. Wenn sich nun der eine also gebärdet, der andere aber im Hinblick auf die Seligpreisungen die Zorneskrankheit mit Vernunftgründen meistert, so daß sein Blick ruhig und seine Stimme gelassen bleibt, dem Arzte ähnlich, der mit seiner Kunst dem Irrsinnigen, der sich unanständig benimmt, zu Hilfe kommt: wenn du das zweite Bild mit dem ersten vergleichst, wirst du nicht selbst zugeben, daß der Zornwütige in seinem tierischen Benehmen kläglich und abscheuerregend, der Sanftmütige aber seligzupreisen ist, weil er sich durch die Schlechtigkeit des Nächsten nicht gleichfalls in einen Zustand versetzen ließ, der des Menschen unwürdig ist?</p><p>Daß das Wort Gottes ganz besonders die Leidenschaft des Zornes im Auge hat, geht daraus hervor, daß es uns nach der in der ersten Seligpreisung empfohlenen Demut in der zweiten die Sanftmut vorschreibt. Beide Tugenden scheinen eng zusammenzuhängen und die demütige Gesinnung die Mutter eines sanftmütigen Herzens zu sein. Denn sobald du aus deinem Geiste den Hochmut entfernest, hat die Leidenschaft des Zornes keinen Anhaltspunkt mehr, aufzuwallen. Schimpf und Entehrung nämlich veranlassen zumeist die Seelenkrankheit der Zornwütigen; Beschimpfung nimmt sich aber der nicht übermäßig zu Herzen, der sich zur Demut erzogen hat. Denn wenn jemand seine Vernunft von Täuschung fernhält und erwägt, welchem Anfang die hinfällige Natur, an der er teilnimmt, ihr Entstehen verdankt und welchem Ende das kurze, schnell zerrinnende Leben entgegeneilt, wenn er den Schmutz beachtet, der an seinem Fleische klebt, und die Armseligkeit seiner Natur, die nicht durch sich selbst zu bestehen vermag, sondern ihren Verbrauch durch den Überfluß der unvernünftigen Geschöpfe ergänzen muß, wenn er dazu die Leiden, Trübsale, Unglücksfälle und die verschiedenartigen Krankheiten beherzigt, denen das menschliche Leben ausgesetzt ist und von denen keiner ganz verschont bleibt ―: wenn jemand das alles mit dem Auge der Seele betrachtet, ohne sich selbst zu belügen, so wird er wohl nicht leicht ungehalten, falls ihm nur wenig Ehre zuteil wird. Im Gegenteil wird er es für eine Art Betrug ansehen, wenn er vom Nächsten wegen irgendeines Vorzuges eine Ehrenbezeigung empfängt, da wir ja an unserer Natur nichts haben, was auf Ehre Anspruch machen könnte, außer an unserer Seele, deren Ehre aber nicht in den Gütern besteht, die man auf dieser Welt vor allem schätzt. Denn wer kann im Ernste mit seinem Reichtum großtun, auf seine Abkunft stolz sein, auf Ansehen und Rang pochen? Das sind lauter Dinge, in denen zwar menschliche Ehrsucht ihre Befriedigung sucht, die aber sogar geeignet sind, die wahre innere Ehre zu zerstören und Schande zu bereiten, so daß kein Besonnener sich herbeilassen wird, ihretwegen irgendwie die Reinheit der Seele zu beflecken. Eine solche Gesinnung führt zu einem Leben in tiefer Herzensdemut, und wenn diese vollkommen in uns hergestellt ist, wird der Zorn keinen Eingang in unsere Seele finden. Ist aber der Zorn verbannt, so ist ein ruhiges, stilles Leben erreicht und dieses ist gleichbedeutend mit der Sanftmut, deren letztes Ende die Seligkeit und die Erbschaft des himmlischen Erdreiches ist ― in Christus Jesus, dem die Ehre und die Macht sei von Ewigkeit zu Ewigkeit. Amen.Dritte Rede: „Selig sind die Trauernden; denn sie werden getröstet werden.“</p><h2>3</h2><p>Noch haben wir den Gipfel des Berges nicht betreten, sondern befinden uns im unteren Bereiche der Erkenntnisse, wenn wir auch gewissermaßen schon zwei Hügel erreicht haben, als wir zur seliggepriesenen Armut und zu der noch höher als diese stehenden Sanftmut emporstiegen. Von diesen Hügeln führt uns das Wort Gottes höher hinauf und zeigt uns zunächst eine dritte Höhe in den Seligkeiten, zu der wir nun mit aller Kraft emporeilen sollen, während wir alles Bedenken und die uns umstrickende Sünde ablegen, wie der Apostel sie nennt (Hebr. 12, 1), damit wir unbeschwert und wohlgerüstet auf der Spitze anlangen und das Licht der Wahrheit, dem wir uns mit unserer Seele nahen, uns desto heller leuchte.</p><p>Was bedeutet nun der Ausspruch: „Selig sind die Trauernden; denn sie werden getröstet werden.“ Allerdings könnte einer, der seinen Blick auf die Welt richtet, lächeln und über den Ausspruch sich spöttisch also auslassen: „Wenn man diejenigen im Leben seligpreist, die von lauter Mißgeschick verzehrt werden, dann sind folgerichtig jene unglücklich, die ihr Leben ohne Leid und Schmerz genießen!“ Und er wird noch mehr spotten, wenn er, sich anschickend die verschiedenen Arten von Mißgeschicken aufzuzählen, das Elend des Witwenstandes und dessen Jammer vorführt, Vermögensverluste, Schiffbrüche, Kriegsgefangenschaft, ungerechte Verurteilungen bei Gericht, Verbannungen, Gütereinziehung, Aberkennung der bürgerlichen Rechte, Heimsuchungen durch Krankheit wie Erblindung, Verletzung und überhaupt die mannigfachen Leiden des Körpers. Und wenn sonst dem Menschen in diesem Leben ein Übel an Leib oder Seele zustößt, so wird er auf sie alle hinweisen, um die Lächerlichkeit des Ausspruches darzutun, der die Trauernden seligpreist. Aber unbekümmert um solche, welche die göttlichen Worte mit kleiner, niedriger Seele betrachten, wollen wir nach Kräften den Reichtum, der, wenn auch verborgen, im Ausspruche liegt, zu erkennen suchen, damit auch dadurch der große Unterschied offenbar werde, welcher zwischen irdischer, fleischlicher Auffassung und hoher himmlischer Gesinnung besteht.</p><p>Nahe liegt es, vor allem jene Trauer glückselig zu preisen, die wir über Verfehlungen und Sünden empfinden, gemäß der Lehre des Paulus über die Traurigkeit; nach derselben gibt es nicht bloß* eine* Art Traurigkeit, sondern eine weltliche und auch eine nach dem Herzen Gottes: die weltliche bereite den Tod, die andere bringe den Trauernden das Heil durch die Reue (2 Kor. 7, 10). Und in der Tat eignet sich zur Seligpreisung eine Seelenverfassung, in welcher der Mensch das Böse merkt und sein in Sünden verbrachtes Leben bejammert. Es geht nämlich wie bei Erkrankungen des Leibes: ist ein Teil des Körpers durch einen Schaden schlaff geworden, so ist die Unempfindlichkeit ein sicheres Zeichen dafür, daß der schlaffe Teil bereits abgestorben ist; sobald aber durch ärztliche Kunst das Gefühl des Lebens dem Körperteil wiedergebracht worden, so beginnen, obgleich noch Schmerzen vorhanden, der Kranke und seine Pfleger sich zu freuen, indem sie gerade aus dem Umstand, daß das kranke Glied wieder den Schmerz empfindet, mit Recht schließen, der Anfang der Genesung sei bereits vorhanden. Ähnlich gibt es Menschen, welche sich der Sünde vollständig in die Arme geworfen haben, daß sie, wie der Apostel sagt, ganz abgestumpft wurden (Eph. 4, 19); sie sind gleichsam Leichname: sie haben keine Empfindung mehr für die Tugend, aber auch kein Gefühl für das Böse, das sie tun. Wenn aber eine heilkräftige Mahnung gleichsam wie eine brennende, heiße Arznei sie erfaßt, etwa eine ernste Androhung des künftigen Gerichtes, wenn diese ihr Herz durch die Furcht vor den kommenden Dingen tief erschüttert, wenn sie das unauslöschliche Feuer, den nie ersterbenden Wurm, das Zähneknirschen, das unaufhörliche Heulen, die äußerste Finsternis und alles Derartige wie scharfe, herbe Arznei einem durch die Leidenschaft der Wollust Erstarrten beibringt, ihm gleichsam einheizt und ihn so weit bringt, daß er den schlimmen Zustand fühlt, in welchem er sich befindet, so bereitet eine solche Mahnung gerade dadurch, daß sie der Seele die Empfindung des Schmerzes einflößt, seine Seligpreisung vor. Daher geißelte auch Paulus jenen, der in wütiger Lust gegen das Lager des Vaters gefrevelt, mit seinem Tadel nur so lange, als er sich gegen seine Sünde unempfindlich zeigte; als aber die Arznei der Züchtigung ihre Wirkung tat, begann Paulus den Mann als einen, der durch die Traurigkeit schon glückselig geworden, zu trösten, damit er nicht, wie er sagt, vom Übermaß des Schmerzes verzehrt werde. Auch dieser Gedanke soll nicht unnütz für das Tugendstreben sein, weil ja die Sünde im menschlichen Leben überfließend vorhanden ist: als ihr Heilmittel wurde die Trauer nachgewiesen, die durch die Reue hervorgerufen wird.</p><p>Aber noch etwas Tieferes als das Gesagte scheint das Wort Gottes zu enthalten; indem es von einer fortgesetzten Übung der Trauer spricht, fordert es uns nämlich auf, noch an etwas anderes zu denken. Denn wenn es nur auf die Reue über die Sünde hätte hinweisen wollen, so hätte es folgerichtiger diejenigen seliggepriesen, welche getrauert* haben<em>, nicht jene, welche</em> immerfort trauern<em>. So preisen wir ― um abermals den Krankheitszustand zum Vergleiche beizuziehen ― diejenigen glücklich, welche mit Erfolg eine Kur</em> gemacht haben,* nicht jene, welche immerfort eine Kur* machen*; denn die Fortsetzung der Kur verrät die Fortdauer der Krankheit. Aber daß das Wort Gottes nicht bloß in dem oben dargelegten Sinne, als ob es nur den Reumütigen die Seligkeit zuspräche, aufgefaßt werden darf, ergibt sich uns noch aus einem anderen Grunde. Wir finden nämlich gar viele, die ein ganz tadelloses Leben führen, so daß es vom Worte Gottes selbst als tugendhaft bezeugt wird. Welche Habgier gab es an einem Johannes? welchen Götzendienst bei einem Elias? welche andere größere oder kleinere Sünde nennt die Geschichte ihres Lebens? Wie nun? Wird nun das Wort Gottes verkünden, sie stünden außerhalb der Seligpreisung, sie, die niemals in eine Seelenkrankheit gefallen sind und daher auch nicht nötig hatten, das oben dargelegte Heilmittel, nämlich den Reueschmerz, anzuwenden? Wäre es nicht ungereimt, solche Männer von der göttlichen Seligkeit ausgeschlossen zu wähnen, deshalb, weil sie weder gesündigt noch die Sünde durch Trauer getilgt haben? Oder wäre es da nicht besser, zu sündigen als ohne Sünde zu leben, wenn einzig und allein den Reumütigen die Gnade des Trösters in Aussicht steht? Es heißt ja: „Selig die Trauernden; denn sie werden getröstet werden!“</p><p>Wir wollen daher nach Möglichkeit, wie Habakuk sagt, dem folgen, der uns nach oben führt (Hab. 3, 19) und den im Worte liegenden Sinn erforschen, damit wir sehen, welcher Trauer die Tröstung des Heiligen Geistes versprochen ist. Erwägen wir also, was denn zunächst die Traurigkeit an sich ist im menschlichen Leben und wodurch sie hervorgerufen ist. Soviel liegt klar vor aller Augen, daß die Trauer eine trübe Stimmung der Seele ist, hervorgerufen durch den Verlust eines geliebten Gegenstandes; dieser Zustand greift nicht Platz bei jenen, welche ihr Leben in lauter Freude zubringen. Recht glücklich z. B. ist einer im Leben: alle seine Geschäfte gehen ausgezeichnet; er hat seine Freude an seiner Ehegattin, ist stolz auf seine Kinder, hat Sicherheit durch Eintracht mit seinen Verwandten, genießt Ansehen in der Gemeinde und Ehre von seiten der Mächtigen, ist furchtbar seinen Gegnern, geschätzt von seinen Untergebenen, seinen Freunden zugänglich, prangend in Reichtum, fähig, das Leben zu genießen, frei von Kummer, von kräftiger Gesundheit, im Besitz alles dessen, was in dieser Welt als wertvoll gilt: ein solcher lebt gewiß in Frohsinn, weil ihm Freude aus allen seinen gegenwärtigen Verhältnissen zuströmt. Falls aber ein Umschwung am heiteren Himmel seines Glückes eintritt, etwa eine Scheidung von seinen Lieben, ein Vermögensverlust oder eine durch welchen Zufall nur immer herbeigeführte Schädigung seines körperlichen Wohlbefindens, so entsteht durch die Trennung von dem, was ihm Freude verschaffte, die entgegengesetzte Stimmung, die wir Trauer nennen. Demnach ist die aufgestellte Begriffsbestimmung richtig, daß die Traurigkeit ein schmerzliches Empfinden des Verlustes von Dingen ist, welche uns erfreuen.</p><p>Haben wir nun die Traurigkeit begrifflich erfaßt, so möge uns das Bekannte zum Unbekannten führen, damit wir auch einsehen, worin noch die seliggepriesene Traurigkeit besteht, auf welche Tröstung folgen soll. Wenn der Verlust von Gütern des gegenwärtigen Lebens die Traurigkeit hienieden bewirkt, niemand aber über die Einbuße eines unbekannten Gegenstandes klagen kann, so müssen wir zuerst untersuchen, welches das wahre Gut ist, und darauf das Verhältnis, in welchem die Menschen zu diesem wahren Gute stehen; so wird es uns gelingen, die seligmachende Traurigkeit zu finden. ― Einen Vergleich bieten die Blinden; wenn einer in Blindheit geboren ist, der andere aber, nachdem er an das Licht gewöhnt war, in einen finsteren Kerker geworfen wurde, so werden beide von ihrem Geschick nicht in gleicher Weise getroffen; denn der eine weiß, wessen er beraubt ist, und empfindet daher die Entziehung des Lichtes schwer; der andere, der eine solche Wohltat überhaupt nicht kennt, wird sein Leben ohne allzu große Traurigkeit verbringen, weil er, in Blindheit aufgewachsen, kein Gut verloren zu haben glaubt. Infolgedessen wird den einen die Sehnsucht nach dem Lichte antreiben, auf allerlei Mittel und Wege zu sinnen, um wieder all das sehen zu können, was ihm mit Gewalt entzogen wurde. Der andere aber wird bis in sein Greisenalter in seiner Blindheit gelassen dahinleben, weil er von dem höheren Gut (der Sehkraft) keine Ahnung hat und seine Lage für ganz annehmbar erachtet. Ähnlich ist es auch bei dem Gegenstand, der uns jetzt beschäftigt: wer es so weit gebracht hat, das wahre Gut zu erkennen, und dann die Armseligkeit der menschlichen Natur betrachtet, wird sich in seiner Seele sicher unglücklich fühlen, weil ihn darüber Trauer erfaßt, daß sein gegenwärtiges Leben nicht jenes höchste Gut besitzt. Nicht so fast die Traurigkeit an sich scheint vom Worte Gottes seliggepriesen zu sein, als vielmehr die Erkenntnis des höchsten Gutes, verbunden mit der Empfindung der Traurigkeit darüber, daß unserem Leben jenes heißersehnte Gut mangelt.</p><p>Den angezogenen Vergleich weiter verfolgend, müssen wir nunmehr erforschen, welches denn jenes Licht sei, von welchem diese dunkle Höhle der menschlichen Natur nicht mehr erleuchtet wird. Oder stellen wir uns hiemit eine Aufgabe, die leicht gelöst werden könnte? Denn welche Geisteskraft in uns wäre fähig, die Natur des gesuchten Gutes zu ergründen? welche Namen und Worte stünden uns zur Verfügung, uns eine würdige Vorstellung von dem Lichte über uns zu verschaffen? Wie soll ich das Ungesehene nennen? wie das Unstoffliche darstellen? wie das Unsichtbare zeigen? wie das erfassen, was ohne Größe, ohne Quantität, ohne Qualität, ohne Gestalt ist, was weder im Raume noch in der Zeit sich findet, was außerhalb jeder Begrenzung und jeder begrifflichen Vorstellung liegt, dessen Werk das Leben und der Inbegriff alles Guten ist, an dem man alles Hohe, das sich denken und sagen läßt, erschaut: Gottheit, Herrscherwürde, Macht, Ewigkeit, Unvergänglichkeit, Freude und Jubel und überhaupt alles Erhabene, was wir nur immer ersinnen und aussprechen können? Wie also und durch welche Gedanken kann man sich dieses unser höchstes Gut vor Augen stellen, das nur innerlich geschaut, nicht äußerlich gesehen wird, das allem, was ist, Dasein gibt, selbst aber seit Ewigkeit existiert und nicht erst entstehen mußte? Damit meine Rede nicht vergeblich sich abmühe, das Unerfaßliche zu erreichen, wollen wir aufhören, über die Natur des höchsten Gutes nachzugrübeln, da es unmöglich ist, so Erhabenes zu begreifen, und wollen es schon als einen Gewinn aus unserer Untersuchung betrachten, wenn wir gerade infolge der Unmöglichkeit, das Gesuchte zu ergründen, einigermaßen eine Ahnung von der unendlichen Größe des Gesuchten bekommen. Je mehr wir aber einsehen, daß jenes Gut über unser Erkenntnisvermögen erhaben ist, desto höher wollen wir auch die Trauer darüber in uns steigern, daß das Gut, von dem wir getrennt sind, von solcher Beschaffenheit und Hoheit ist, daß wir es nicht einmal mit unseren Gedanken erschließen können.</p><p>An diesem Gute, das alle Fassungskraft übersteigt, hatten wir Menschen einst Anteil, und in solchem Maße fand es sich auch in unserer Natur, daß jene Menschheit, die da in getreuester Nachahmung nach dem Urbilde geschaffen war, eine Änderung erfahren zu haben schien. Denn was wir jetzt an jenem Urbilde auf dem Wege des Glaubens erkennen, das alles befand sich auch einstens im Menschen: Unverweslichkeit, Glückseligkeit, Bedürfnislosigkeit, Unabhängigkeit, Schmerzlosigkeit und Mühelosigkeit des Lebens, Unterhaltung mit göttlichen Dingen und die Gabe, mit offenem, von jeder Täuschung freiem Geiste das Gute zu sehen. Dies alles lehrt uns in wenigen Worten der Bericht über die Weltschöpfung, indem er darlegt, daß der Mensch nach dem Ebenbilde Gottes geschaffen worden sei, im Paradiese lebte und in dessen Erzeugnissen schwelgte; die Frucht der paradiesischen Bäume und Pflanzen war Leben, Erkenntnis und andere ähnliche Güter. Da wir all diese Vorzüge besaßen, wie ist es da möglich, wenn wir unser gegenwärtiges Elend mit der damaligen Glückseligkeit vergleichen, nicht über unseren tiefen Fall zu trauern? Das Hohe ist erniedrigt, das Ebenbild des Himmlischen ward der Erde verwandt, was zum Herrschen bestimmt war, zum Sklaven gemacht, was zur Unsterblichkeit geschaffen war, dem Tode preisgegeben; was in Paradieses Freuden lebte, wurde in dieses Land voll Krankheit und Mühsal verbannt; was den Vorzug haben sollte, von jeder Leidenschaft frei zu sein, hat dafür ein Leben eingetauscht, das angefüllt ist mit Leidenschaften heftigster Art; was sich voller Freiheit erfreute, schmachtet unter der Gewalt vieler Tyrannen. Denn jede Leidenschaft wirft sich, wenn sie die Oberhand gewonnen hat, zum Zwingherrn über den auf, der sich ihr einmal unterwarf. Und sobald sie die Burg der Seele eingenommen hat, läßt sie jeden, der ihr gehorcht, durch seine eigenen Untergebenen knechten, indem sie des Menschen Gedanken und Entschlüsse nach ihrem Gutdünken mißbraucht. So verfährt der Zorn, so die Furcht, die Feigheit, die Unbotmäßigkeit, die Leidenschaft des Schmerzes und der Lust, Haß, Zank, Unbarmherzigkeit, Härte, Neid, Schmeichelei, Rachgier, Gleichgültigkeit und all die Leidenschaften, die in unserem Innern kämpfen und streiten, ― eine ganze Menge von Gebietern und Tyrannen, die vermöge der Macht, die ihnen zur Verfügung steht, die Seele wie eine Kriegsgefangene zur Sklavin machen. Und wenn wir noch dazu die Mißgeschicke des Leibes in Erwägung ziehen, die mit unserer Natur so innig verbunden sind, ich meine, die verschiedenartigen Krankheiten, die das Menschengeschlecht im Anfang nicht kannte, so werden wir noch viel reichlicher Tränen vergießen, da wir bei einem Vergleich deutlich sehen, daß an Stelle der Freude das Leid, an Stelle des Guten das Böse getreten ist.</p><p>Diese Lehre scheint der Herr mit seiner Seligpreisung der Traurigkeit, wenn auch etwas verborgen, zu verkünden, indem er jene Traurigkeit meint, die da bewirkt, daß die Seele das wahre Gute voll Sehnsucht im Auge behalte und sich nicht in die Täuschungen des gegenwärtigen Lebens hinabziehen lasse. Denn beides ist unbestreitbar: einerseits, wer die Dinge dieser Welt richtig beurteilt, kann nicht ohne Tränen leben; andererseits, wer in den Lüsten dieses Lebens versinkt, von dem kann man nicht annehmen, daß er trauere. Letzteres beweisen auch die unvernünftigen Tiere; diese befinden sich zwar von Natur aus in einem bedauernswerten Zustand, ― denn was ist jammervoller, als der Vernunft beraubt zu sein? ― aber ein Gefühl ihres Unglückes haben sie nicht; vielmehr verläuft ihr Leben in einer gewissen Freude: das Pferd ist voll Übermut, der Stier tummelt sich, daß der Staub auffliegt, das Schwein sträubt seine Borsten, die jungen Hunde scherzen, die Kälber hüpfen; jedes Lebewesen kann auch durch mancherlei Zeichen seine Freude ausdrücken. Hätten sie jedoch eine Ahnung von der Vernunft, die sie entbehren, sie verbrächten ihr stumpfes, niedriges Leben nicht in Freude. So ist es auch bei den Menschen: solange sie die kostbaren Güter, deren wir nunmehr beraubt sind, nicht kennen und würdigen, überlassen sie sich ganz der Freude an dem gegenwärtigen Leben. Wer sich aber mit der Freude an der irdischen Gegenwart zufrieden gibt, kennt folgerichtig kein Streben nach Höherem; wer aber nicht strebt, wird auch nicht finden, was nur dem Strebenden beschert wird. Deshalb also preist das Wort Gottes die Traurigkeit selig, nicht als ob es diese um ihrer selbst willen für beseligend halten würde, sondern wegen des Segens, der aus ihr erwächst.</p><p>Der Zusammenhang beweist, daß das Trauern im Hinblick auf die Tröstung seliggepriesen wird; denn es heißt: „Selig sind die Trauernden; denn sie werden getröstet werden.“ Dieses Verständnis besaß bereits, wie es scheint, im voraus der große Moses ― oder vielmehr das Wort, das durch ihn die geheimnisvollen Anordnungen für die Paschafeier traf. Er schrieb nämlich ungesäuertes Brot für die Festtage vor und als Zukost bitteren Lattich; aus solchen Andeutungen sollen wir lernen, daß wir an dem Paschafest nur dann Anteil haben, wenn wir die Bitterkeiten des Lebens mit einem lauteren, sozusagen ungesäuerten Wandel verbinden. Aus dem nämlichen Grund mischt auch der große David, obgleich er mit dem höchsten Maße irdischen Glückes, d. i. mit der Königswürde, ausgestattet war, reichlich Bitterkeiten in sein Leben, indem er seufzend, wehklagend und weinend über die Verlängerung seines Aufenthaltes im Fleische und erfüllt von heißer Sehnsucht nach dem Lande da droben ausruft: „Wehe mir, daß mein Aufenthalt verlängert wird“ (Ps. 120, 5 [= hebr.] [Septuag. u. Vulgata = Ps. 119, 5]). Und unverwandten Auges auf die Schönheit der himmlischen Hütten blickend, sagt er anderswo, er vergehe vor Sehnsucht, weil er es für vorzüglicher halte, dort unter die Letzten zu gehören, als in dieser Welt der Erste zu sein (Ps. 83, 11 [= Septuag. u. Vulgata] [hebr.= Ps. 84, 11]).</p><p>Wenn aber jemand den wahren Begriff der seliggepriesenen Traurigkeit finden will, so betrachte er sie in der Erzählung von Lazarus und dem Reichen; in derselben wird uns die vorgetragene Auffassung noch klarer verkündet. Abraham sagt nämlich zum Reichen: „Erinnere dich, daß du viel Gutes in deinem Leben empfangen hast, ebenso wie Lazarus viel Schlimmes; darum wird dieser getröstet, du aber gepeinigt.“ (Luk. 16, 25). Das ist billig, nachdem ein unberatener oder richtiger ein übelberatener Sinn uns von dem Plane, den Gottes Güte mit uns vorhatte, weit entfernt hat. Nach Gottes Willen sollten wir nämlich nur das Gute ohne jegliches Schlimme genießen, das Schlimme aber nicht zugleich mit dem Guten verkosten; da wir jedoch mit freiem Entschluß, verleitet von unserer Gier, vom Gegenteil, d. h. vom Ungehorsam gegen das göttliche Gebot, kosteten, so muß der Mensch in beide Zustände geraten und sowohl an Leid als auch an Freud seinen Anteil bekommen. Da es nun zwei Welten gibt und ein zweifaches Leben in jeder dieser Welten und demgemäß auch eine doppelte Freude, die eine in dieser Welt, die andere in jener, die uns nach unserer Hoffnung in Aussicht steht, so ist es wohl als Seligkeit zu betrachten, wenn man seinen Anteil an der Freude sich in den wahren Gütern der Ewigkeit sichern will, seine Schuldigkeit aber im Ertragen von Leid in diesem kurzen, vergänglichen Leben auf sich nimmt. Dementsprechend wird man es für einen Verlust ansehen, in diesem Leben nicht manche Freuden zu entbehren, sondern gerade durch deren Vollgenuß einstens der höheren Güter verlustig zu gehen. Wenn es also seligzupreisen ist, in unendlichen Ewigkeiten eine unbegrenzte und immerdar dauernde Freude zu genießen, die Menschen aber auch das Gegenteil kosten müssen, so ist der Sinn des Ausspruches wohl klar und leicht einzusehen, warum jene selig sind, welche jetzt trauern; denn sie werden für ewige Zeit getröstet werden.</p><p>Der Trost aber entspringt aus der Gemeinschaft mit dem Tröster; denn die Gabe des Trostes ist eine besondere Wirkung des Heiligen Geistes. Mögen auch wir derselben gewürdigt werden durch die Gnade unseres Herrn Jesu Christi, welchem Ruhm sei von Ewigkeit zu Ewigkeit. Amen.Vierte Rede: „Selig sind, die hungern und dürsten nach der Gerechtigkeit; denn sie werden gesättigt werden.“</p><h2>4</h2><p>Von solchen, die magenkrank sind und keine Eßlust haben, behaupten die Arzneikundigen, daß sie infolge gewisser schlechter Säfte und Fremdstoffe, die sich in der oberen Magengegend gesammelt hätten, immer voll und satt zu sein glauben und deshalb zuträglicher Nahrung abgeneigt seien, weil das natürliche Verlangen in ihnen durch ein falsches Sattgefühl erstorben sei. Wenn aber einige ärztliche Sorgfalt auf sie verwendet werde und die in den Höhlungen des Magens aufgenommenen und eingeschlossenen Speisen durch eine auflösende Arznei fortgeschafft würden, dann sei die Folge, daß den Kranken, weil Fremdartiges nicht mehr die Natur belästige, das Verlangen nach nützlicher und nahrhafter Speise wiederkehre; ein Zeichen der Gesundheit sei es, daß man nicht gezwungen, sondern mit Begierde und Verlangen die Speisen zu sich nehme.</p><p>Was will nun diese Einleitung? Das Wort Gottes, das uns immer höher auf der Stufenleiter der Seligpreisungen emporführt, indem es nach dem Ausspruch des Propheten, eine herrliche Leiter in unserem Herzen herstellt (Ps. 84, 5 [= hebr.] [Septuag. u. Vulgata = Ps. 83, 5]), zeigt uns nach Besteigung der früheren Sprossen eine weitere Stufe mit den Worten: „Selig sind, die hungern und dürsten nach der Gerechtigkeit; sie werden gesättigt werden.“ Es wird gut sein, unsere Seelen kräftig von Übersättigung und Überfüllung zu befreien, um so das seliggepriesene Verlangen nach solcher Speise und solchem Trank, die hier gemeint sind, in uns hervorzurufen. Der Mensch kann nicht erstarken, wenn nicht genügende Nahrung seine Kraft aufrechterhält, noch wird er Nahrung aufnehmen ohne zu essen, noch essen ohne Verlangen nach Nahrung. Da nun die Kraft im Leben ein Gut ist, diese aber nur durch genügende Sättigung erlangt wird, die Sättigung aber durch Essen zustande kommt, das Essen hinwiederum infolge des Verlangens, so ist das Verlangen seligzupreisen, weil es sich als Anfang und Quelle unserer Kraft darstellt.</p><p>Wir wissen nun, daß sich die Menschen zur sinnlichen Nahrung verschieden verhalten, indem sich nicht alle nach der gleichen Speise sehnen, sondern die Wünsche der Gäste hinsichtlich der eßbaren Dinge auseinandergehen: der eine findet Vergnügen am Süßen, der andere hat Verlangen nach herben scharfen Sachen, ein dritter mag Salziges, ein vierter Saueres usw. Dabei kommt es vor, daß viele nicht nach den Speisen verlangen, die ihnen zuträglich sind; mancher nämlich, der infolge seiner eigentümlichen Säftemischung zu einem Leiden neigt, nährt seine Krankheit noch durch die Beschaffenheit von Speisen, die die krankhafte Anlage begünstigen; wer dagegen sein Verlangen nur nach den ihm zuträglichen Speisen richtet, erhält sich gesund, weil eine solche Nahrung zu seiner Gesundheit beiträgt. In ähnlicher Weise sind auch hinsichtlich der Nahrung der* Seele* die Begierden der Menschen keineswegs auf den gleichen Gegenstand gerichtet: die einen verlangen nach Reichtum oder Ruhm oder sonst dergleichen, was in der Welt Glanz verschafft; bei anderen ist der Wunsch nach Tafelfreuden rege; wieder andere sättigen sich gierig mit Neid wie mit einer giftigen Nahrung. Einige aber verlangen nach dem, was von Natur aus gut ist; von Natur aus gut ist aber stets und für alle das, was nicht wegen eines anderen Gegenstandes erwünscht, sondern was um seiner selbst willen begehrenswert ist, sich stets gleich bleibt und niemals durch Sättigung seinen Reiz verliert. Darum preist das Wort Gottes nicht die einfach Hungernden selig, sondern die hungern nach der Gerechtigkeit.</p><p>Welche Gerechtigkeit ist dies nun? Denn hierüber müssen wir uns zuerst Klarheit verschaffen, damit, nachdem wir die Schönheit dieser Tugend ans Licht gestellt haben, in uns die Sehnsucht nach dem zur Erkenntnis gebrachten Liebreiz derselben erwache. Denn unmöglich können wir ein Verlangen nach uns Unbekanntem tragen, sondern Unbekanntem gegenüber verhält sich unsere Natur untätig und unbeweglich, wenn sie nicht zuvor durch Gehör oder Gesicht eine Vorstellung von dem betreffenden Gegenstand erlangt. Nun sagen einige, die über solche Dinge nachgeforscht haben, Gerechtigkeit bestehe in der Bereitwilligkeit, jedem das zuzuteilen, was billig ist und ihm gebührt. Wenn z. B. jemand die Vollmacht hat, Gelder zu verteilen, so nennt man ihn gerecht, falls er bei der Verteilung auf die Billigkeit schaut und die einzelnen Spenden nach dem Bedürfnis der Empfänger bemißt. Und wenn ein Richter nicht nach Gunst und Mißgunst seine Urteile fällt, sondern die Schuldigen straft und die Unschuldigen freispricht, und wenn er bei den übrigen Gerichtssachen seine Entscheidung nur auf Grund des wirklichen Sachverhaltes trifft, so nennt man ihn ebenfalls gerecht. Ferner wenn einer bei der Auferlegung von Steuern diese in voller Berücksichtigung der Steuerkraft der Untertanen festsetzt; desgleichen wenn der Herr eines Hauswesens, der Vorstand einer Stadt, ein König über ganze Völker die Untergebenen entsprechend ihren Verhältnissen leitet, indem er sich in seinem Machtgefühl nicht von unvernünftigen Beweggründen hinreißen läßt, sondern schlicht und ehrlich in seinem Bereiche waltet und in seinen Anordnungen den Wünschen der ihm Unterstellten entgegenkommt ― all das rechnen diejenigen zum Wesen der Gerechtigkeit, welche den Begriff derselben im Hinblick auf das vorgeführte Verhalten gegen Mitmenschen geben.</p><p>Wenn ich aber meinen Blick auf die hohe Warte der göttlichen Gesetzgebung richte, so komme ich zu der Annahme, daß unter der Gerechtigkeit, um die es sich hier handelt, noch etwas mehr als das Gesagte zu verstehen ist. Denn wenn das Wort des Heiles alle Menschen ohne Ausnahme in gleicher Weise im Auge hat, aber nicht alle in einem der erwähnten Stände leben, ― nur wenige ja können Herrscher, Vorstände, Richter sein oder die Vollmacht über Gelder oder sonst einen Gegenstand der Verwaltung bekommen; die Mehrzahl gehört vielmehr zu den Untergebenen und Regierten ― wie könnte man da annehmen, die wahre Gerechtigkeit wäre derartig, daß ihre Erlangung nicht allen ohne Ausnahme offenstünde? Denn wenn nach der Anschauung außerchristlicher Kreise der Gerechte die Ausgleichung sich zum Ziele setzt, der Vorrang aber auf Ungleichheit beruht, so kann man die gegebene Begriffsbestimmung der Gerechtigkeit nicht für richtig halten, weil sie schon durch die Ungleichheit im Leben widerlegt wird.</p><p>Welches ist nun jene Gerechtigkeit, die alle erreichen können und nach welcher das Verlangen aller geht, die auf den Tisch des Evangeliums blicken, reich oder arm, Diener oder Herr, frei oder Sklave, so daß kein äußeres Verhältnis imstande ist, den Begriff der Gerechtigkeit zu erweitern oder zu verengern? Denn fände sich die Gerechtigkeit nur bei dem, der durch eine bestimmte Macht und Auszeichnung über andere hervorragt, wie wäre dann Lazarus gerecht, der vor der Türe des Reichen hingestreckt lag, er, der keine Unterlage für die vorher dargelegte Gerechtigkeit besaß! kein Amt, keine Macht, kein Haus, keinen Tisch oder sonst eine Ausstattung im Leben, vermöge deren man jene Gerechtigkeit betätigen kann. Wenn nämlich die Gerechtigkeit nur im Befehlen, im Verteilen oder überhaupt in einer ordnenden Tätigkeit möglich ist, so ist einer, der an jenen Lebensstellungen keinen Anteil hat, von der Gerechtigkeit ganz ausgeschlossen. Mit welchem Rechte könnte also der noch einer Erquickung oder Belohnung für würdig erachtet werden, wer nichts von dem hat oder tut, was nach der Ansicht vieler zum Begriff der Gerechtigkeit gehört? Wir müssen daher jene wahre Gerechtigkeit erst suchen, deren Lohn nach der Verheißung jedem zuteil wird, der nach ihr verlangt; heißt es ja doch: „Selig, die nach der Gerechtigkeit hungern; denn sie werden gesättigt werden.“</p><p>Da sich uns Vieles und Mannigfaltiges zum Genusse darbietet, worauf sich das Verlangen der Seele richten kann, so brauchen wir einen hohen Grad von Einsicht, um das Nahrhafte vom Schädlichen zu unterscheiden, damit nicht eine Speise, welche die Seele als kräftigende Nahrung aufzunehmen glaubt, in uns Verderben und Tod statt des Lebens bewirkt. Da ist es vielleicht nicht unpassend, durch die Untersuchung einer anderen Stelle im Evangelium den Sinn unserer Seligpreisung aufzuhellen. Der uns in allem gleich geworden ist außer der Sünde und an denselben Bedürfnissen wie wir seinen Anteil nahm, wies das Gefühl des Hungers nicht ab, als es ihn befiel, sondern unterwarf sich dem natürlichen Trieb des Verlangens nach Nahrung. Denn nachdem er vierzig Tage gefastet hatte, hungerte ihn zuletzt, als es ihm gefiel, der Natur zu erlauben, daß sie auch an ihm ihre Kraft äußere. Als nun der Urheber aller Versuchungen wahrnahm, daß die Empfindung des Hungers auch in ihm sich rege, riet er ihm, sein Verlangen mit Steinen zu befriedigen, wodurch aber das Begehren von der natürlichen Nahrung auf die unnatürliche gelenkt wurde. Er sprach nämlich zum Herrn: „Sprich, daß diese Steine zu Brot werden!“ Was hat der Ackerbau verbrochen? Warum verabscheut der Widersacher den Samen und die daraus gewonnene Nahrung? Weshalb verachtet er die Weisheit des Schöpfers, ob sie nicht in entsprechender Weise das Menschengeschlecht ernähre? Denn wenn auf einmal die Steine geeigneter zur menschlichen Nahrung erscheinen, dann hat die göttliche Weisheit nicht die nötige Vorsorge für das menschliche Leben getroffen. „Befiehl, daß diese Steine Brot werden!“ So spricht der Satan bis zur Stunde zu allen, denen er durch ihre Begierlichkeit Versuchungen bereitet, und er will sie dadurch überreden, auf sein Geheiß hin sich aus Steinen ihr Brot zu bereiten.</p><p>Denn wer seine Begierde über die vom Bedürfnis gezogenen Grenzen hinausschreiten läßt, befolgt den Rat des Teufels, der immer aufs neue die aus der Saat gewonnene natürliche Nahrung verwirft und in den Seelen ein Verlangen nach Unnatürlichem weckt. Von Steinen essen in gewissem Sinne diejenigen, welche sich das Brot der Habsucht vorsetzen lassen, ebenso jene, die sich kostspielige schwelgerische Mahlzeiten durch Werke der Ungerechtigkeit bereiten, desgleichen auch alle, bei welchen die Zubereitung der Tafel nicht nach Maßgabe des Notwendigen erfolgt und nur darauf berechnet ist, möglichst prunkvoll zu sein und das Staunen der Gäste zu erregen. Denn was hat der ungenießbare Stoff des Silbers, der in schwerer, kaum zu tragender Last vorgesetzt wird, mit dem Bedürfnisse der Natur gemein? Was ist denn die Empfindung des Hungers? Nicht etwa das Verlangen nach dem, was unserem Leibe mangelt? Denn wenn die leibliche Kraft verbraucht ist, wird der hierdurch hervorgerufene Mangel durch einen entsprechenden Ersatz ergänzt; Brot ist es also oder sonst etwas Eßbares, wonach die Natur beim Hunger verlangt. Wird diesem Verlangen aber abgeholfen, wenn Gold statt Brot zum Munde geführt wird? Wenn einer auf ungenießbare Stoffe ausgeht, statt auf genießbare, so bemüht er sich um Steine, da die Natur etwas anderes verlangt, als worauf er seine Sorgfalt verwendet. Fast mit lauter Stimme sagt die Natur durch die Empfindung des Hungers, daß sie jetzt Speise bedürfe, weil sie die verflüchtigte Kraft dem Körper wiederersetzen müsse. Du aber hörst nicht auf die Natur; denn du gibst ihr nicht, was sie sucht, sondern bist besorgt, daß dir eine schwere Last Silber auf dem Tisch liege; du siehst dich um Bearbeiter des Metalls um und entwickelst wegen der Fertigung der Bilder, die in das Metall einziseliert werden, eine emsige Tätigkeit, darauf bedacht, daß durch die Arbeit des Künstlers die Leidenschaften und Gemütsstimmungen scharf ausgeprägt werden, daß man genau erkenne den Zorn des Schwerbewaffneten, wenn er mit dem Schwerte zum tödlichen Schlage ausholt, und den Schmerz des Verwundeten, wenn er sich in seinem Blute krümmt und schmerzlich stöhnt, was in seiner ganzen Haltung zum Ausdruck kommen soll. Völlig naturgetreu soll in der Darstellung auch hervortreten die Erregtheit des Jägers, die Wildheit des Tieres, sowie alles andere, was sonst noch die eitlen Toren in ihrer Geschäftigkeit an den für ihren Tisch bestimmten Metallen und Stoffen durch künstlerische Arbeiten darstellen wollen. Zu trinken begehrt die Natur, du aber lässest kostspielige Dreifüße bereiten, Waschbecken, Mischkrüge, Henkelkrüge und unzählig anderes, was mit der Befriedigung des Bedürfnisses nichts zu tun hat. Gehorchst du da in einem derartigen Tun nicht offenbar dem, der in dich dringt, deinen Blick auf Steine zu richten? Wozu soll ich noch die übrigen Arten von solcher Steinliebhaberei durchgehen? Dazu wären noch z. B. zu rechnen schändliche Schaustellungen, aufregende Musikaufführungen und Deklamationen, wodurch man den Weg zu einer ganzen Reihe von Sünden betritt und den Begierden zur Ausschweifung neue Nahrung zuführt. Das ist der Rat des Widersachers in bezug auf die Nahrung; dies beabsichtigt er, wenn er unseren Blick auf die Steine lenken will statt auf den der Natur entsprechenden Brotgenuß.</p><p>Doch der Überwinder der Versuchungen verbannte nicht den Hunger aus der Natur, als wäre er eine Ursache von Sünden, sondern er wies nur die übertriebene Sorge, die sich nach dem Rate des Widersachers zum unabweisbaren Bedürfnis gesellen sollte, von sich, und gestattete, daß die Natur innerhalb der von ihr gezogenen Grenzen ihren Haushalt decke. Wie nämlich jene, die den Wein wegen der ihm anhaftenden Unreinigkeit abseihen, durchaus nicht seinen Nutzen übersehen, sondern nur das Schädliche mit Hilfe des Seihers ausscheiden und dann den so geläuterten Wein recht gerne gebrauchen, so hat das ewige Wort, welches das der Natur Fremdartige wohl zu erkennen und von ihr genau zu scheiden weiß, in seiner gründlichen und treffenden Darlegung den Hunger, weil er die Aufgabe hat, bei der Erhaltung des Lebens mitzuwirken, nicht verworfen, wohl aber die übergroßen Sorgen, die sich leicht in das Bedürfnis einmischen, gleichsam durchgeseiht und ausgeschieden, indem es verkündete, wahrhaft nährendes Brot kenne jener, der sich nach der Anleitung des Wortes Gottes in das rechte Verhältnis zur Natur setzt.</p><p>Hat nun Jesus Hunger empfunden, so ist jener Hunger wohl seligzupreisen, der in uns so wirkt, wie in ihm selbst. Wenn wir also erkennen, wonach den Herrn hungert, so haben wir auch den Sinn unserer Seligpreisung gefunden. Welche Speise ist es also, nach welcher zu verlangen Jesus nicht unter seiner Würde erachtet? Er sagte es selbst, als er nach der Unterredung mit der Samariterin zu seinen Jüngern sprach: „Meine Speise ist es, den Willen meines Vaters zu tun“ (Joh. 4, 34). Und den Willen seines Vaters kennen wir genau durch den Apostel: „Er will, daß alle Menschen gerettet werden und zur Erkenntnis der Wahrheit gelangen“ (1 Tim. 2, 4). Wenn also der Vater will, daß wir gerettet werden und unser Heil die Speise Jesu ist, so unterliegt es auch keinem Zweifel mehr, nach welchem Gegenstand wir den Hunger unserer Seele zu lenken haben: lasset uns hungern nach unserem Heile! lasset uns dürsten nach dem göttlichen Willen, der dahin geht, daß wir gerettet werden! Wie wir nun diesen Hunger in uns hervorrufen sollen, haben wir jetzt durch die Seligpreisung kennengelernt; wer sich nämlich nach der Gerechtigkeit Gottes sehnt, hat entdeckt, was wahrhaft begehrenswert ist.</p><p>Die Sehnsucht darnach will aber Jesus nicht nur nach der einen der beiden Seiten stillen, nach welchen der Appetit in uns sich betätigt. Denn die Teilnahme an der Gerechtigkeit hat er nicht bloß wie eine Speise verlangt; alsdann würde ja das Verlangen, wenn es nur auf die Aufnahme von Nahrung abzielte, nur zur Hälfte befriedigt. Tatsächlich hat er jenes hohe Gut der Gerechtigkeit auch als Trank hingestellt, um das heiße, ja flammende Begehren unserer Seele nach demselben mit dem Bilde vom Durste zu bezeichnen. Da uns der Durst gewissermaßen ganz trocken und glühend macht, so nehmen wir den Trank als ein Heilmittel gegen diesen Zustand mit einem Wonnegefühl zu uns. Weil nun das Verlangen nach Speise und Trank der Art nach gleich, der Zustand aber, der beiden zugrunde liegt, verschieden ist, so preist das ewige Wort, um uns die höchste Begierde nach dem Guten zur Aufgabe zu machen, diejenigen selig, die beide Empfindungen, Hunger und Durst, hinsichtlich der Gerechtigkeit haben, da der Gegenstand des Sehnens dergestalt ist, daß er beiden Trieben zu entsprechen vermag: feste Nahrung zu werden für die Hungernden und ein Trank für alle, welche dürstend die Gnade an sich ziehen möchten. Daher heißt es: „Selig sind, die hungern und dürsten nach der Gerechtigkeit; denn sie werden gesättigt werden!“</p><p>Wenn nun das Verlangen nach der Gerechtigkeit seligzupreisen ist, spricht dann das ewige Wort den nicht selig, der gleiche Sehnsucht hat z.´B. nach der Mäßigung, Weisheit, Klugheit oder nach sonst einer Art von Tugend? Doch die Seligpreisung hat etwa folgenden Sinn: Zwar ist die Gerechtigkeit nur ein Teil von dem, was zum Begriff der Tugend gehört; häufig aber hat die Heilige Schrift, wenn sie auch bloß einen Teil ausdrücklich nennt, trotzdem oft das Ganze im Auge, z. B. wenn sie die göttliche Natur mit dem einen oder anderen Namen umschreibt. Denn einmal spricht der Prophet im Namen Gottes: „Ich bin der Herr; das ist mein ewiger Name und ein Gedächtnis den Geschlechtern der Geschlechter“ (Is. 42, 8); anderswo aber sagt Gott: „Ich bin, der ich bin“ (Exod. 3, 11), und an einer anderen Stelle: „Ich bin barmherzig“ (Jer. 3, 12). Und noch mit zahlreichen anderen Namen, welche die Erhabenheit und Würde Gottes ausdrücken, pflegt ihn die Heilige Schrift zu benennen; daraus ergibt sich ganz klar, daß sie, wenn sie auch bloß* einen* Namen nennt, doch mit demselben die* ganze Reihe* seiner Namen stillschweigend ausgesprochen haben will; denn es ist unmöglich, daß, wenn er Herr genannt wird, er nicht zugleich auch das wäre, was die übrigen Benennungen besagen; vielmehr wird durch den* einen* Namen von Gott ausgesagt, was alle enthalten.</p><p>Hieraus ergibt es sich, daß die Heilige Schrift oftmals sehr viel einschließt, auch wenn sie nur einen Teil ausdrücklich nennt. Dementsprechend bezeichnet das Wort Gottes auch hier, wo es die Gerechtigkeit als den Gegenstand für die glückselig Hungernden angibt, damit überhaupt jede Art von Tugend, so daß in gleicher Weise auch der seligzupreisen ist, der nach Klugheit, Starkmut und Mäßigung hungert oder nach dem, was wir sonst noch Tugend nennen. Denn es ist unmöglich, daß eine Seite der Tugend, losgetrennt von den übrigen, für sich allein schon als vollkommene Tugend bezeichnet werden kann. Wenn nämlich bei unserem Streben nach einer bestimmten Tugend eine andere, die zum Begriff des Guten gehört, nicht mit inbegriffen wäre, so würde mit Notwendigkeit die entgegengesetzte Untugend in uns Raum gewinnen; die Mäßigung z. B. hat als Gegensatz die Zügellosigkeit, die Klugheit die Unbesonnenheit; und so hat jede Tugend ihren Gegensatz. Wenn nun nicht alle Tugenden zum Begriff der Gerechtigkeit gerechnet würden, so wäre sie, für sich allein bleibend, kein Gut mehr; denn niemand wird die Gerechtigkeit unbesonnen, keck, zügellos oder sonst etwas von dem nennen, was wir als schlecht ansehen. Wenn aber der Begriff der Gerechtigkeit keine Vermischung mit etwas Schlechtem gestattet, so faßt er* jegliches* Gute in sich; gut ist aber alles, was zur Tugend gehört. Folglich ist hier jede Art von Tugend unter dem Namen Gerechtigkeit gemeint, wenn das ewige Wort jene seligpreist, die nach ihr hungern und dürsten; er verspricht ihnen die Erfüllung ihrer Wünsche; es heißt ja: „Selig, die hungern und dürsten nach der Gerechtigkeit; denn sie werden gesättigt werden.“</p><p>Unser Ausspruch scheint uns etwa noch folgenden Gedanken in sich zu bergen. Keine Lust der Welt, welche der Mensch um ihrer selbst willen anstrebt, befriedigt ihn; vielmehr ist derartiges Luststreben nach dem Ausdruck der Weisheit (Sprichw. 27, 22) mit einem Faß ohne Boden zu vergleichen. In ein solches schöpfen jene, welche den Lüsten nachjagen; sie gehen ihnen mit unermüdlichem Eifer nach und bieten doch ganz vergeblich und zwecklos alle Kräfte auf, indem sie beständig in den Abgrund der Begierde gießen und außerdem noch all das, was der Lust Vorschub leisten könnte, hinzuschütten, ohne daß es ihnen gelingt, die Lust zur dauernden Sättigung und Befriedigung zu bringen. Denn wer hat je erlebt, daß die Gier nach Geld aufhörte, wenn die Habsüchtigen schon einen großen Reichtum erworben hatten? Wer ließ von seinem krankhaften Ehrgeiz ab, nachdem er sein Ziel erreicht hatte? Und wenn jemand seine Lust zu stillen gesucht hatte an Konzerten, an Schauspielen, an dem rasenden Wahnsinn der Völlerei oder an dem, was der Völlerei zu folgen pflegt, was war ihm schließlich von dem Genuß geblieben? Verfliegt nicht jede Art körperlicher Lust sofort mit ihrer Befriedigung, ohne auch nur ganz kurze Zeit bei denen zu verweilen, die nach ihr griffen? Wir empfangen also vom Herrn die erhabene Lehre, daß nur das Verlangen, welches auf die Tugend gerichtet ist, bleibenden Wert und wirklichen Inhalt besitzt. Denn wer eines der höheren Güter errungen hat, wie Enthaltsamkeit, Mäßigung, Ehrfurcht gegen Gott oder irgendeine der himmlischen Tugenden, die das Evangelium lehrt, empfindet bei jeder Tugendübung nicht bloß ein vorübergehendes, seichtes Vergnügen, sondern eine tiefgegründete, dauernde Freude, die sich auf die ganze Lebenszeit erstreckt. Warum? Weil man diese Tugenden immer betätigen kann, so gibt es keinen Augenblick im Leben, der Überdruß am Vollbringen des Guten einflößte. Denn die Mäßigung und Reinheit, die Beharrlichkeit im Guten und die Fernhaltung vom Bösen wird stets geübt, solange wir unseren Blick auf die Tugend richten, und die Freude, die sie gewährt, dauert so lange als das Tugendstreben.</p><p>Diejenigen aber, welche sich törichten Begierden ohne Einschränkung hingeben, können sich, wenn ihr Verlangen auch ununterbrochen auf zügelloses Genießen geht, doch nicht steter Freude rühmen. Denn dem Lustgefühl im Genuß von Speisen setzt die Sättigung ein Ziel; das Vergnügen am Trinken erlischt zugleich mit dem Durste; in ähnlicher Weise bedürfen auch die anderen sinnlichen Freuden von Zeit zu Zeit einer Unterbrechung, damit das Verlangen nach dem Genuß wiederkehre, wenn es durch die Sättigung abgestumpft ist. Der Besitz der Tugend unterliegt aber für die, bei denen sie Wurzel gefaßt hat, keiner Zeitgrenze noch einer Unterbrechung infolge von Übersättigung, sondern er gewährt allen, die in ihm leben, einen ungetrübten, stets neuen und reichen Genuß all des Guten, das mit der Tugendübung verbunden ist. Darum stellt Gott, das ewige Wort, denen, die nach der Tugend hungern, Sättigung in Aussicht, eine Sättigung, die durch die Befriedigung erst recht entzündet, nicht abgestumpft wird.</p><p>Das also ist die Lehre dessen, der vom hohen Berge der Erkenntnis uns predigt. Darnach sollen wir unser Verlangen nicht auf Dinge richten, welche den nach ihnen Strebenden kein Ziel und Ende in Aussicht stellen, so daß ihr Bemühen so nichtig und töricht erscheint wie das derer, die dem Kopf ihres eigenen Schattens nachjagen: ihr Lauf gilt Unerreichbarem, weil der verfolgte Schatten stets mit gleicher Schnelligkeit dem Nachlaufenden entwischt. Dagegen sollen wir dorthin unser Verlangen richten, wo das Erstrebte als Eigentum allen Eifrigen zufällt. Denn wer nach der Tugend strebt, erwirbt das Gute als sicheren Besitz und kann das, was er erstrebt, in seinem eigenen Innern schauen. Selig ist also, wer nach Mäßigung hungert; er wird mit Befriedigung gesättigt werden. Diese Sättigung bewirkt aber, wie schon gesagt, keine Abnahme, sondern eine Steigerung des Verlangens, und das eine nimmt mit dem anderen in gleichem Verhältnis zu: auf die Begierde nach Tugend folgt die Besitzergreifung des Begehrten, und das erworbene Gut trägt unaufhörliche Freude in unsere Seele. Denn die Natur dieses Gutes bringt es mit sich, daß es uns nicht bloß im Augenblick des Genusses mit Süßigkeit erfüllt, sondern in jedem Teil der Zeit lebendige Freude zu gewähren imstande ist. Denn Freude weckt die Erinnerung an ein gerechtes Leben in allen, die es geführt haben, Freude auch die Gegenwart, wenn sie im Einklang mit der Tugend verbracht wird, Freude auch die Erwartung des Lohnes. Letzterer wird vor allem wiederum in der Tugend bestehen, die einerseits als das Werk der Braven erscheint, andererseits als der göttliche Lohn für das vollbrachte Gute.</p><p>Soll ich aber noch ein etwas kühnes Wort wagen, so halte ich dafür, daß der Herr, wenn er von Tugend und Gerechtigkeit spricht, sich selbst seinen Jüngern als Gegenstand des Verlangens darbietet. Er ist uns ja Weisheit von Gott, Gerechtigkeit, Heiligung und Erlösung geworden (1 Kor. 1, 30), aber auch das Brot, das vom Himmel kommt (Joh. 6, 41) und lebendiges Wasser (Joh. 4, 10). Darnach hat auch David gedürstet, wie er in seinem Psalm gesteht, in welchem er dies beseligende Gefühl seines Herzens Gott mit den Worten darbringt: „Meine Seele dürstet nach dem starken, lebendigen Gott; wann werde ich dahin kommen und vor dem Angesichte Gottes erscheinen?“ (Ps. 41, 2 [ber.: = Ps. 41, 3 Septuag. u. Vulgata] [hebr. = Ps. 42, 3]). Durch die Kraft des Heiligen Geistes wurde David, wie es scheint, im voraus in die vorgeführten, erhabenen Lehren des Herrn eingeweiht, und befähigt, auch die Erfüllung eines solchen Verlangens für sich selbst zu ahnen; denn er ruft aus: „Durch Gerechtigkeit werde ich vor deinem Angesichte erscheinen und mich sättigen am Anblicke deiner Herrlichkeit“ (Ps. 17, 15 [= hebr.] [Septuag. u. Vulgata = Ps. 16, 15]).</p><p>Die hier gemeinte Gerechtigkeit ist demnach die wahre Tugend, die Vollkommenheit, die keinen Makel aufweist, sondern alles Gute in sich schließt, Gott selbst, das Wort, jene Tugend, welche, wie Habakuk sagt (3, 3), die Himmel bedeckt. Und mit Recht werden die seliggepriesen, welche nach dieser Gerechtigkeit Gottes hungern. Denn wer nach dem Ausdruck des Psalmisten den Herrn gekostet (Ps. 33, 8 [ber.: = Ps. 33, 9 Septuag. u. Vulgata] [hebr. = Ps. 34, 9]), das heißt Gott in sich aufgenommen hat, wird von dem erfüllt, nach welchem er gehungert und gedürstet hat ― gemäß der Verheißung dessen, der da versprochen: „Ich und der Vater werden kommen und Wohnung bei ihm nehmen (Joh. 14, 22), während der Heilige Geist gewiß schon vorher in ihm Wohnung genommen hatte. Auch der große Paulus, der von den geheimnisvollen Früchten des Paradieses kosten durfte, ist einerseits von dem, was er genossen, schon gesättigt, andererseits empfindet er noch Hunger. Daß er nämlich von dem, welchen er ersehnt, gesättigt ist, spricht er in den Worten aus: „Christus lebt in mir“ (Gal. 2, 20); aber zugleich streckt er sich wie ein noch Hungernder nach dem aus, was vor ihm liegt, indem er erklärt: „Nicht als ob ich es bereits ergriffen hätte, oder als ob ich schon vollkommen wäre, sondern ich jage ihm nach, damit ich es auch ergriffe“ (Phil. 3, 12).</p><p>In unserer Darlegung wird es noch gestattet sein, etwas ausnahmsweise als Tatsache anzunehmen, was in der Natur niemals vorkommt. Wenn nämlich bei der leiblichen Speise nichts von dem, was wir uns zu unserer Ernährung zuführen, ausgeschieden, sondern alles zur Vermehrung der Körpergröße verwendet würde, so könnte der Körper bald zu einer gewaltigen Höhe emporwachsen, indem alsdann die tägliche Nahrung immer aufs neue die Größe vermehren würde. Tatsächlich aber macht die Gerechtigkeit und die mit ihr verbundene Tugendfülle, da sie vermöge ihres geistigen Charakters keine Ausscheidung des Genossenen kennt, jene, die sie zu sich nehmen, immer größer und größer, indem sie durch ihre Aufnahme unsere Seelengröße stets vermehrt.</p><p>Indem wir demnach den seliggepriesenen Hunger recht auffassen, wollen wir jeder Sättigung, die vom Bösen kommt, entsagen, und nur nach der Gerechtigkeit Gottes hungern, auf daß wir mit ihr gesättigt werden ― in Christus Jesus unserem Herrn, dem die Herrlichkeit sei von Ewigkeit zu Ewigkeit. Amen.Fünfte Rede: „Selig sind die Barmherzigen; denn sie werden Barmherzigkeit erlangen.“</p><h2>5</h2><p>Auf die nämliche Belehrung, welche dem Jakob in einem Gesichte durch ein Gleichnis gegeben wurde, indem er sah, wie eine Leiter von der Erde bis zum Himmel reichte und Gott selbst auf ihr thronte, zielt ungefähr auch die Unterweisung ab, die uns durch die Seligpreisungen zuteil wird; wer sich von ihnen emporführen läßt, wird zu immer höheren Gedanken erhoben. Dort war es, wie ich glaube, das tugendhafte Leben, das dem Patriarchen unter dem Sinnbild der Leiter vorgestellt wurde, damit er selbst lerne und seinen Nachkommen mitteile, zu Gott könne man unmöglich anders gelangen, als wenn man stets nach oben blickt und ein unaufhörliches Verlangen nach immer Höherem trägt, so daß man sich nicht mit dem schon Erreichten begnügt, sondern es für einen Verlust erachtet, nicht die höhere Stufe zu erklimmen. Hier nun in den Seligkeiten, die aufeinanderfolgen, werden wir durch ihre Hoheit in den Stand gesetzt, Gott selbst näherzukommen, dem wahrhaft Seligen, der über aller Seligkeit seinen Thron hat. Wie wir dem Weisen durch Weisheit, dem Reinen durch Reinheit uns verähnlichen, so werden wir dem Seligen auf dem Weg der Seligpreisung uns angleichen; denn Gottes Eigenschaft ist in Wahrheit die Seligkeit, weshalb auch Jakob Gott auf der Leiter thronen sah. Die Teilnahme an den Seligpreisungen ist also nichts anderes als eine Teilnahme an der Gottheit, zu der uns der Herr durch seine Worte emporführt.</p><p>Der Inhalt der Seligpreisung, die uns der Reihenfolge nach jetzt beschäftigen soll, scheint mir den, der das Wort Gottes hört und versteht, in gewisser Weise zu Gott zu machen. Es heißt nämlich: „Selig die Barmherzigen; denn sie werden Barmherzigkeit erlangen.“ Ich weiß nun, daß die heiligen Männer an vielen Stellen der Schrift das Wort „barmherzig“ für die göttliche Macht selbst gebrauchen, so David in seinen Psalmen, so Jonas in seiner Prophetie, so der große Moses oftmals in seiner Gesetzgebung. Wenn also die Bezeichnung „barmherzig“ Gott selbst zukommt, will dich da nicht das Wort einladen, Gott zu werden, um dich nach den die Gottheit auszeichnenden Merkmalen zu gestalten? Denn wenn Gott in der von ihm eingegebenen Schrift barmherzig genannt wird, Gott aber der wahrhaft Seligzupreisende ist, so ergibt sich wohl als einleuchtende Folgerung, daß der Barmherzige, auch wenn er nur Mensch ist, doch der göttlichen Glückseligkeit für würdig gilt, weil er in jene Eigenschaft eintrat, nach welcher Gott besonders genannt wird. „Barmherzig ist der Herr und gerecht, und Gott erbarmt sich unser“ (Ps. 114, 5 [= Septuag. u. Vulgata] [hebr. Ps. 116, 5]). Wie sollte es also nicht beseligend für den Menschen sein, durch sein Benehmen das zu heißen und das zu werden, wonach Gott genannt wird. Das Streben nach den höheren Gnadengaben empfiehlt in seinen Worten der göttliche Apostel (1 Kor. 12, 34).</p><p>Unsere Absicht zielt aber nicht dahin, uns zu überzeugen, daß wir nach dem Guten streben sollen, ― die Hinneigung zum Guten liegt ja ohnehin schon in unserer Natur ―, sondern dahin, daß wir in dem Urteil über das, was gut ist, nicht irre gehen; denn unser Leben irrt sich am meisten nach der Seite, daß wir nicht richtig unterscheiden zwischen dem, was seinem Wesen nach wirklich gut ist, und dem, was nur aus Täuschung dafür gehalten wird. Wenn nämlich das Böse in aller Nacktheit im Leben vor unseren Augen läge und nicht mit dem Schein des Guten übertüncht wäre, so wäre der Mensch niemals zu ihm übergegangen. Wir haben daher Klugheit nötig, um unseren Ausspruch richtig aufzufassen, damit wir über die wahre Schönheit des darin liegenden Gedankens belehrt, uns nach demselben gestalten. Denn wie der Glaube an die Gottheit zwar schon von Natur aus in allen Menschen liegt, sie aber trotzdem, weil sie den wahren Gott nicht kennengelernt haben, im Forschen nach demselben in die Irre gehen, ― viele beten die wahre Gottheit an, die sich im Vater, im Sohne und im Heiligen Geiste darstellt, andere aber sind auf falsche Vorstellungen geraten, indem sie Gott in der Kreatur suchen; nicht selten hat hierin schon eine kleine Abweichung von der Wahrheit der Gottlosigkeit Tür und Tor geöffnet ―, so würde auch bei der uns vorliegenden Seligpreisung, falls wir nicht den wahren Sinn erkannten, der Nachteil für uns nicht gering sein, weil wir von der Wahrheit abirrten.</p><p>Was ist nun die Barmherzigkeit und wie wird sie geübt? Und wie ist der selig, der wieder empfängt, was er gibt? Es heißt: „Selig die Barmherzigen; denn sie werden Barmherzigkeit erlangen.“ In seinem zunächstliegenden Sinn fordert uns der Ausspruch zur gegenseitigen Liebe und zum Mitleid auf, weil wegen der Ungleichheit und wegen des Gegensatzes der Lebensverhältnisse nicht alle in der gleichen Lage sich befinden, weder in bezug auf das Ansehen, noch auf die Körperbeschaffenheit noch auf die übrigen Annehmlichkeiten. Das Leben geht nämlich häufig in Gegensätze auseinander: in Knechtschaft und Herrschaft, in Reichtum und Armut, in Achtung und Verachtung, in Gesundheit und Krankheit und so auch hinsichtlich der meisten anderen Verhältnisse. Damit nun zwischen dem Zu-Viel und dem Zu-Wenig ein Ausgleich stattfinde und der Mangel durch den Überfluß ersetzt werde, schrieb das göttliche Wort Barmherzigkeit gegen die Geringeren vor. Denn das Bestreben, das Unglück des Menschen zu heilen, wird in uns nur dann entstehen, wenn die Barmherzigkeit unsere Seele zu solchem Entschluß erweicht. Die Barmherzigkeit ist begrifflich der Hartherzigkeit entgegengesetzt; wie der Hartherzige und Unmenschliche unzugänglich ist für alle, welche sich ihm bittend nahen wollen, so geht der Barmherzige in seinem Gemüte gewissermaßen eine Verbindung mit den Dürftigen ein, indem er für die Leidenden so wird, wie deren gedrückter Sinn es wünscht. In der Tat ist die Barmherzigkeit, wie man sie begrifflich erklären und umgrenzen kann, eine Traurigkeit, welche der Mensch aus freien Stücken über fremde Leiden trägt.</p><p>Genügt jedoch unsere bisherige Darstellung nicht, so dürfte der Begriff Barmherzigkeit durch eine andere Wendung noch klarer werden. Wir können nämlich die Barmherzigkeit auch als eine liebevolle Teilnahme des Herzens bezeichnen denen gegenüber, welche von schwerem Ungemach heimgesucht sind. Wie nämlich das harte, unmenschliche Wesen vom Hasse seinen Ausgang nimmt, so erblüht die Barmherzigkeit sozusagen aus der Nächstenliebe; sie hat letztere zur notwendigen Voraussetzung. Wenn wir aber das Charakteristische der Barmherzigkeit hervorheben wollen, so können wir sie als einen hohen Grad der Liebe bestimmen, verbunden mit dem Gefühl des Mitempfindens. Am Glücke des Mitmenschen allerdings möchten alle teilnehmen, Feind und Freund; aber die Bereitwilligkeit, an fremdem Unglück teilzunehmen, findet sich nur bei denen, welche sich von der Liebe leiten lassen. Nun ist aber ausgemacht, daß unter allen Tugenden die Liebe den ersten Platz einnimmt; die Barmherzigkeit ist aber ein höherer Grad der Liebe; darum ist derjenige, welcher seine Seele in dieser Stimmung erhält, wahrhaft seligzupreisen, weil er in der Tugend nach dem Höchsten ringt. Dabei soll niemand unsere Tugend bloß nach den äußeren Leistungen beurteilen, ― alsdann könnten sie nur solche erlangen, welche in der Lage sind, Wohltaten zu spenden ―, sondern mir scheint es gerechter, den Sitz der Barmherzigkeit in das Wollen und Wünschen zu verlegen. Denn wer das Gute ernstlich will und verlangt, steht, auch wenn er nicht imstande ist, ein löbliches Werk zu vollbringen, hinsichtlich seines seelischen Wertes durchaus nicht hinter dem zurück, der seine edle Gesinnung auch in Taten umsetzen kann.</p><p>Welch großer Gewinn für das Leben erwächst, wenn wir den Sinn der Seligpreisung so auffassen, wie ich dargelegt habe, ist wohl überflüssig auszuführen, da auch für Einfältige die Vorteile auf der Hand liegen, die das Leben aus dieser Mahnung des Herrn ziehen könnte. Sobald nämlich eine solche Gesinnung gegen die Geringeren eingepflanzt wird, gibt es kein Zu-Viel und auch kein Zu-Wenig; nicht mehr wird das Leben in Gegensätze gespalten: keine Armut wird den Menschen plagen, keine Knechtschaft ihn erniedrigen, kein Mangel an Ansehen ihn betrüben. Denn allen wird alles gemeinsam sein; Gleichheit der Gesetze und der Rechte bürgert sich im Leben der Menschen ein, da der Mitbürger freiwillig den Rückstand der Geringeren ausgleicht. Tritt dies alles ein, dann ist kein Zündstoff zur Feindschaft vorhanden; zur Untätigkeit ist der Neid verurteilt, tot der Haß, verbannt die Rachgier, die Lüge, der Betrug, der Krieg ― lauter Dinge, welche der Begierde nach Mehr entspringen. Ist einmal die mitleidslose Gesinnung entfernt, dann werden mit ihr von Grund aus, wie mit einer bösen Wurzel, die Schößlinge der Bosheit verschwinden und mit der Austilgung des Bösen hält zugleich die ganze Reihe der Tugenden ihren Einzug: Friede, Gerechtigkeit und die ganze Gefolgschaft dessen, was man zum Begriff „Gut“ zählt. Was wäre denn seliger zu preisen als ein Leben, in welchem man die Sicherheit seines Leibes und seiner Habe nicht mehr Riegeln und Schlössern anvertrauen muß, sondern das richtige Verhalten der Menschen zueinander volle Sicherheit verbürgt! Denn wie der Hartherzige und Unmenschliche sich die zu Feinden macht, die seine Mitleidslosigkeit erfahren mußten, so werden wir die Freunde desjenigen, der barmherzig ist; denn Barmherzigkeit erzeugt Liebe in allen, welche sie verkosten durften. Wie die Darlegung zeigt, ist daher die Barmherzigkeit die Mutter des Wohlwollens, das Pfand der Liebe, das Band jeder freundschaftlichen Gesinnung; die Sicherheit, die hiedurch gegeben wird, ist zuverlässiger als jede andere. Daher preist das göttliche Wort mit Recht den Barmherzigen selig, da soviel des Guten in diesem Namen eingeschlossen ist.</p><p>Aber wenngleich jedem der große Nutzen einleuchtet, der aus unserer Seligpreisung für das Leben erwächst, so will doch, wie mir dünkt, ihr wahrer Gehalt dadurch, daß die zukünftige Zeitform gewählt ist, noch Größeres enthalten, als der Wortlaut auf den ersten Blick anzudeuten scheint. Es heißt nämlich: „Selig die Barmherzigen; denn sie* werden* Barmherzigkeit erlangen“, in dem Sinne, daß die Barmherzigen* später* eine Vergeltung erwarten dürfen, nach Maßgabe der Barmherzigkeit, die sie geübt. Wollen wir daher den dargelegten, leichtfaßlichen und von den meisten unschwer gefundenen Sinn unserer Seligpreisung verlassen und, soweit es uns möglich ist, mit forschendem Geist hinter den Vorhang zu blicken versuchen!</p><p>„Selig die Barmherzigen; denn sie werden Barmherzigkeit erlangen.“ Man kann in der Tat eine höhere Lehre in dem Ausspruche entdecken, nämlich ungefähr folgende: Der ewige Schöpfer, welcher den Menschen nach seinem Ebenbilde gestaltete, legte in die Natur seines Geschöpfes die Keime zu jeglichem Guten, so daß nichts Gutes erst von außen her in uns hineinkommen muß, sondern jedes, das wir zu besitzen wünschen, in unserer Gewalt ist, und wir das Gute nur aus der eigenen Natur wie aus einer Vorratskammer hervorholen können. An* einer* Tugend sollen wir lernen, was von* allen* Tugenden gilt: niemand kann das Gute, das er zu erlangen sich sehnt, auf eine andere Weise erreichen als dadurch, daß er es sich selbst spendet. Darum sagt der Herr irgendwo zu seinen Jüngern: „Das Reich Gottes ist in euch“ (Luk. 17, 14); ebenso: „Wer bittet, empfängt; wer sucht findet, und wer anklopft, dem wird aufgetan“ (Matth. 7, 7); demnach hängt es bei allen unseren Bestrebungen von unserem freien Willen ab, das Ersehnte zu bekommen, das Gesuchte zu finden und das Gewünschte zu erhalten. Wollen wir konsequent sein, so müssen wir das Gesagte auch auf das Gegenteil des Guten anwenden: auch der Fall in die Sünde wird nicht durch einen Zwang von außen hervorgerufen, sondern das Böse kommt dadurch zustande, daß wir uns für dasselbe entscheiden, indem es nämlich dann ins Dasein tritt, wenn wir es frei wollen und wählen; außerhalb unseres Willens aber wird das Böse als etwas für sich selbst Bestehendes nirgends vorgefunden. Daraus erweist sich deutlich die unabhängige und selbstherrliche Macht, die der Schöpfer in unsere Natur legte, da alles von unserem Willen abhängt, sowohl das Gute wie das Böse.</p><p>Darum wird aber auch der göttliche Richterspruch in unbestechlichem und gerechtem Urteil nur demjenigen Richterspruch sich anschließen, der von uns selbst durch unsere Gesinnung gefällt wird, und jedem lediglich das zuteilen, was er sich selbst zuspricht: Den einen, die nach der Wendung des Apostels Ehre und Ruhm durch Beharrlichkeit in guten Werken suchen (Röm. 2, 6), ewiges Leben, den anderen aber, welche nicht der Wahrheit, sondern der Ungerechtigkeit gehorchen, Zorn und Trübsal und wie alles das heißt, was zur schrecklichen Wiedervergeltung gehört. Wie nämlich genaue Spiegel vom Antlitz ein solches Bild zeigen, wie es tatsächlich ist, also heiter das der Freudigen, niedergeschlagen das der Traurigen, und niemand diese Eigenschaft des Spiegels tadeln kann, wenn er ein finsteres Gesicht von dem sehen läßt, der in Trübsinn versunken ist, so richtet sich auch der gerechte Urteilsspruch Gottes vollständig nach unserem Zustand; er handelt seinerseits mit uns so, wie wir gehandelt haben. Darum sagt er sowohl: „Kommet ihr Gesegneten!“ als auch: „Weichet ihr Verfluchten“ (Matth.25, 34. 41). Findet hierbei vielleicht ein äußerer Zwang statt, der denen zur Rechten das süße Wort, denen zur Linken aber das zürnende aufnötigen würde? Haben nicht vielmehr die einen durch ihre eigene Barmherzigkeit ebenfalls Barmherzigkeit gefunden, die anderen hingegen durch ihre eigene Hartherzigkeit gegen ihresgleichen Gott gegen sich hartherzig gemacht? Der in Üppigkeit schwelgende Reiche erbarmte sich nicht des Armen, der in Elend vor der Türe lag; damit schneidet er für sich selbst die Möglichkeit des Erbarmens ab, so daß er zwar um Barmherzigkeit fleht, aber nicht erhört wird, nicht als ob ein einziger Tropfen für den mächtigen Strom des Paradieses einen Verlust bedeutet hätte, sondern weil der Tropfen des Erbarmens keine Verbindung mit der Hartherzigkeit einzugehen vermag; denn „welche Gemeinschaft hat das Licht mit der Finsternis“ (2 Kor. 6, 15). Desgleichen heißt es: „Was der Mensch sät, das wird er auch ernten; wer in das Fleisch sät, wird aus dem Fleische Verderben ernten; wer aber in den Geist sät, wird aus dem Geiste ewiges Leben ernten“ (2 Kor. 6. 14 vgl. 9, 6 Gal. 6, 8). Die Saat, glaube ich, ist die Willensentscheidung des Menschen, die Ernte die Vergeltung, die der Willensentscheidung entspricht. Reich an Ertrag ist die Ähre des Guten für die, welche eine solche Saat wählen, qualvoll aber die Distelernte für die, welche Distelsamen im Leben ausstreuen. Denn es muß einer mit Notwendigkeit das ernten, was er eben gesät hat; eine andere Möglichkeit gibt es nicht.</p><p>„Selig sind die Barmherzigen; denn sie werden Barmherzigkeit erlangen.“ Welche Rede vermöchte die Tiefe der in dem Ausspruch liegenden Gedanken erschöpfend darzustellen? Denn das Allgemeine und Unbestimmte des Ausdruckes, daß er nämlich nicht beifügt, gegen wen wir Barmherzigkeit üben sollen, sondern einfach sagt: „Selig sind die Barmherzigen“, gestattet uns, in unseren Betrachtungen noch weiterzugehen, als es schon geschehen ist. Vielleicht will uns hierdurch das ewige Wort zu verstehen geben, daß die barmherzige Gesinnung, die jetzt seliggepriesen wird, in engem Zusammenhang mit der Traurigkeit stehe, welche unmittelbar vorher seliggepriesen ward. Fast scheint das göttliche Wort in beiden Seligkeiten ungefähr die gleiche Belehrung zu geben. Denn wie wir bei fremden Unglücksfällen schmerzlich berührt werden, wenn etwa gute Freunde unerwartet heimgesucht werden, sei es, daß sie vom Vaterhaus verjagt werden oder aus einem Schiffbruch nur das nackte Leben retten, zu Wasser oder zu Land Räubern in die Hände fallen, Sklaven aus freien Menschen, Kriegsgefangene aus schönen Lebensverhältnissen heraus werden oder sonst ein Leid erfahren, nachdem ihnen bisher das Glück lächelte, ― wie also bei derartigen Vorkommnissen ein gewisser schmerzlicher Zustand der Teilnahme in unserer Seele entsteht, so ist es im Hinblick auf uns selbst wohl noch passender, daß eine solche Stimmung in uns über den unwürdigen Sturz eintrete, den unser Leben erlitt. Wenn wir nämlich erwägen, aus welch herrlicher Wohnung wir vertrieben wurden, wie wir in die Gewalt von Räubern fielen, wie wir, in den Abgrund des Lebens hienieden versenkt, nackt und bloß dastehen, wie viele und wie schreckliche Gewaltherren wir uns auf den Hals zogen, statt unser Leben in Freiheit und Unabhängigkeit zu verbringen, wie wir ein Leben voll Seligkeit durch Tod und Verderben zerstörten, wenn wir, sage ich, diese Erwägungen anstellen, ist es dann noch möglich, daß sich unser Mitleid nur fremdem Unglücke [sich] (aus Ber.: „sich“ streichen) zuwende und unsere Seele nicht auch von Mitleid gegen sich selbst erfüllt werde, eingedenk dessen, was sie besessen und was sie verloren hat?</p><p>Was ist bemitleidenswerter als diese Gefangenschaft? Statt des wonnevollen Lebens im Paradiese haben wir ein Land voll Krankheit und Mühsal geerbt; statt jenes leidlosen Zustandes haben wir unzählige Leidensgeschicke geerntet; statt jene erhabene Gesellschaft genießen und mit den Engeln leben zu dürfen sind wir verurteilt, in Gemeinschaft mit den Tieren der Erde zu leben, weil wir für das engelgleiche und leidenschaftslose Leben ein tierisches eintauschten. Wer könnte wohl die grausamen Tyrannen unseres Lebens alle aufzählen, diese rasenden, wütenden Gewaltherren? Ein grausamer Despot ist der Zorn, ein anderer der Neid, der Haß; der leidenschaftliche Hochmut ist ebenfalls ein gar schlimmer Tyrann. Ärger als ein Herr, der seine um Geld gekauften Sklaven seinen Übermut fühlen läßt, knechtet eine auf Ausschweifung gerichtete Lust die menschliche Natur zum unreinen Dienst der Leidenschaft. Und die Tyrannei der Habsucht! Welches Übermaß der Grausamkeit überschreitet sie nicht? hat sie die Seele zur Sklavin gemacht, so zwingt sie dieselbe, ihre unersättlichen Begierden zu sättigen, immer zu sich nehmend, um nie satt zu werden, wie ein vielköpfiges Ungeheuer, das durch tausend Mäuler unaufhörlich Futter dem nimmersatten Bauch zuführt; an keinem Gewinne bekommt sie genug, sondern jeder Gewinn reizt sie zu noch größerer Begierde. Wer könnte, wenn er dieses unglückliche Leben betrachtet, unbarmherzig und hart gegen solches Elend bleiben?</p><p>Der Grund, weshalb wir gegen uns selbst so wenig Mitleid haben, liegt darin, daß wir unseren Jammer nicht genug fühlen. Fast geht es uns hier wie denen, die der Wahnsinn aus dem rechten Geleise gebracht und denen das Übermaß des Unglückes auch noch das Gefühl für ihre Leiden geraubt hat. Wer aber sich selbst recht erkennt und einsieht, was er früher war und was er jetzt ist, ― Salomo sagt irgendwo, daß Selbsterkenntnis Weisheit verrate (Prov. 43, 10) ― wird stets mit sich selbst Mitleid tragen; dieses wird aber auch gewiß das göttliche Mitleid zur Folge haben, denn es heißt: „Selig die Barmherzigen; denn sie werden Barmherzigkeit erlangen“, wohlgemerkt, sie selbst, keine anderen. Darin drückt das göttliche Wort einen ähnlichen Gedanken aus, wie wenn man sagt: „Selig, wer für die körperliche Gesundheit sorgt; denn wer dafür sorgt, wird selbst der Gesundheit sich erfreuen.“ So ist der Barmherzige seligzupreisen, weil die Barmherzigkeit von Seiten Gottes als Frucht in den Besitz des Barmherzigen übergeht, sei es daß wir die Barmherzigkeit in der soeben gefundenen Auffassung nehmen oder in der zuvor erörterten, nämlich in dem Sinne Teilnahme der Seele an fremden Unglücksfällen. Beides ist gleich gut: sowohl sich selbst in der dargelegten Weise bemitleiden, als auch Mitleid mit dem Unglück des Mitmenschen tragen. Denn das gerechte Urteil Gottes erhebt die Gesinnung des Erbarmens, die wir Geringeren entgegenbringen, zu einer übergroßen Macht, indem wir auf diese Weise gewissermaßen unsere eigenen Richter werden, da wir in unserem Urteil über bedauernswerte Mitmenschen uns selbst das Urteil sprechen.</p><p>Da nach unserem Glauben nun, der auf Wahrheit beruht, einstens die ganze Menschheit vor den Richterstuhl Jesu Christi treten wird, damit jeder auch an seinem Leibe empfange nach seinen Werken, mögen sie gut oder böse sein, so darf ich vielleicht sogar ein kühnes Wort sagen: wenn es überhaupt angeht, Geheimnisvolles und Verborgenes in seinen Gedanken zu erfassen, so können wir schon die Seligkeit uns ausdenken, die uns von seiten derer zuteil wird, die unsere Barmherzigkeit erfuhren. Gegen diejenigen, welche uns während ihres ganzen Lebens durch ihr Tun und Lassen Barmherzigkeit erwiesen haben, fühlen wir herzliches Wohlwollen und dieses bleibt billigerweise immerfort und zwar in allen, welche Wohltaten von ihnen genossen haben. Wenn nun beim Gerichte die Empfänger von Guthaben ihren Wohltäter wiedererkennen, was wird dessen Seele empfinden bei den Stimmen der Dankbarkeit, welche laute Segenswünsche über ihn aussprechen vor dem Herrn der ganzen Schöpfung? Wird er noch einer anderen Seligpreisung bedürfen, er, dessen Name vor einer solch gewaltigen Zuschauermenge neben den Besten aufgerufen wurde? Denn daß die Empfänger der Wohltaten zugegen sein werden, lehrt der Wortlaut, welchen nach dem Evangelium der Richterspruch des Königs über die Gerechten und Sünder haben wird; zu beiden spricht er nämlich in der hinweisenden Form, als deute er mit dem Finger auf die Betreffenden: „Was ihr einem von* diesen* meinen geringsten Brüdern getan, das habt ihr mir getan“ (Matth. 25, 40). Mit der Wendung „diesen“ zeigt er die Gegenwart derer an, welche die Wohltaten empfangen haben.</p><p>Wer nun auch die leblose Materie des Geldes höher schätzt als die künftige Seligkeit, sage mir nun doch: welches Gold verbreitet solchen Glanz? welches Funkeln kostbarer Edelsteine, welcher Kleiderschmuck ist so herrlich wie jenes Gut, das uns die christliche Hoffnung verbürgt? Ja, wenn der König der Schöpfung sich dem Menschengeschlecht enthüllt, sitzend in Herrlichkeit auf seinem auserlesenen Thron, wenn um ihn die unzähligen Myriaden von Engeln sichtbar werden, wenn sodann einerseits vor allen Augen das Geheimnis des Himmelreiches entschleiert wird und andererseits die furchtbaren Strafen in die Nähe rücken, in der Mitte aber die ganze Menschheit, wie sie vom Beginn der Schöpfung bis zum Ende aller Tage gelebt hat, dasteht zwischen Furcht und Hoffnung schwebend, bezüglich des Ausganges oft nach beiden Seiten schwankend, weil sogar diejenigen, welche sich während des Lebens ein gutes Gewissen bewahrt haben, wegen der kommenden Dinge in Angst geraten, angesichts dessen, daß andere von ihrem bösen Gewissen wie von einem Henker in die schauerliche Finsternis gezerrt werden, ― wenn dann der Barmherzige unter den segnenden und dankenden Worten derer, die Wohltaten von ihm empfingen, ob dieser Werke mit freudigem Vertrauen vor den Richter hin treten kann, wird da jemand ein solches Glück noch mit dem materiellen und irdischen Reichtum zu vergleichen wagen? würde da auch nur einer an Stelle jener himmlischen Güter alle Berge, Ebenen, Wälder und die Meere annehmen, selbst wenn sie für ihn in Gold verwandelt würden?</p><p>Wenn dagegen der, welcher den Mammon unter Siegeln und Schlössern, hinter eisernen Türen und in festen Truhen verwahrte und die geheime Aufspeicherung der Materie höher als jegliches Gebot schätzte, zum dunklen Feuer kopfüber hingeschleppt wird, während alle ihm seine Härte und Unmenschlichkeit vorwerfen, die sie in ihrem Leben an sich erfahren mußten, und ihm zurufen: „Gedenke, daß du dein Gutes schon im Leben erfahren hast! du hast in deinen festen Geldschränken auch das Mitleid mit eingesperrt; du hast auf Erden Barmherzigkeit nicht geübt, Menschenliebe nicht gekannt; du bekommst jetzt nicht, was du nicht besessen; du findest nicht, was du nicht hinterlegt; du wirst nicht ernten, was du nicht gesät; deine Ernte entspricht deiner Aussaat: Härte hast du gesät, davon ernte die Garben; die Unbarmherzigkeit hast du hochgehalten, nimm in Besitz, was du liebtest; du hattest kein mitleidiges Auge, auch auf dir wird kein mitleidiger Blick ruhen; um Bedrängte hast du dich nicht gekümmert, auch um dich wird sich niemand kümmern, wenn du zugrunde gehst; verabscheut hast du den Armen, verabscheuen wird dich derjenige, der deinetwegen arm geworden ist“ ― wenn diese und ähnliche Rufe ertönen, wo ist dann das Gold? wo die glänzenden Geräte? wo die unter Siegel verwahrten Schätze? wo die zur Nachtwache bestellten Hunde und die gegen Diebe bereit gehaltenen Waffen? wo die Einträge in die Geschäftsbücher? Was ist das alles in Vergleich mit dem Weinen und Zähneknirschen? Wer wird die Finsternis erhellen? wer die Flammen auslöschen? wer den nie sterbenden Wurm töten?</p><p>Darum, geliebte Brüder, wollen wir die Stimme des Herrn beherzigen, der uns in wenigen Worten so vieles über die künftigen Dinge offenbart, und wollen barmherzig sein, auf daß wir dadurch selig werden ― in Christus Jesus, unserem Herrn, dem Ruhm und Ehre sei von Ewigkeit zu Ewigkeit. Amen.Sechste Rede: „Selig, die ein reines Herz haben; denn sie werden Gott anschauen.“</p><h2>6</h2><p>Was denen, die von hoher Felsspitze in ein weit gähnendes Meer hinabschauen, in der Regel begegnet, das stößt mir heute im Geiste zu, da ich von dem erhabenen Ausspruche des Herrn, gleichsam wie von einem ragenden Berggipfel aus in die unermeßliche Tiefe der in ihm enthaltenen Gedanken hinabsehe. Denn wie man an vielen Meeresufern eine ganz steile, der See zu vollständig senkrecht abfallende Bergwand sehen kann und hoch oben auf derselben einen Felsvorsprung, der über dem Abgrund hängt, und wie es nun dem gewöhnlich ergeht, der auf solch hoher Warte stehend in die Tiefe hinabschaut, so ergreift jetzt auch meine Seele eine Art Schwindel, da sie hoch emporgehoben wird durch dieses so große Wort des Herrn: „Selig, die eines reinen Herzens sind; denn sie werden Gott anschauen.“</p><p>Denen, welche ihr Herz gereinigt haben, wird also in Aussicht gestellt, daß sie Gott schauen dürfen, Gott, den doch niemand noch gesehen, wie der große Johannes sagt (Joh. 1, 18). Aber auch der erhabene Paulus stimmt dieser Meinung bei, indem er sagt: „Niemand hat Gott gesehen; niemand kann ihn sehen“ (1 Tim. 6, 16). Dies ist der steil und jäh abfallende Fels, der dem Denken keine Stelle bietet, um Fuß zu fassen, den auch Moses durch seine Lehren als so unzugänglich bezeichnet, daß ihn unser Geist von keiner Seite aus ersteigen könne, weil ihm jeder Stützpunkt durch die gegebene Darstellung abgeschnitten ist. Denn Moses erklärt geradezu: „Es gibt niemanden, der Gott sehen und am Leben bleiben könnte“ (Exod. 33, 20). Besteht aber nicht das ewige Leben in der Anschauung Gottes? Und scheint diese nicht von den Säulen des Glaubens: von Johannes, Paulus und Moses als unmöglich bezeichnet zu werden? Merkst du also den Schwindel der Seele, den die Tiefe der Gedanken erzeugt? Wenn Gott das ewige Leben ist, so kann der, welcher Gott nicht sieht, auch das ewige Leben nicht sehen. Aber gerade dies, daß man Gott nicht sehen könne, verkünden deutlich die gotterleuchteten Propheten und Apostel. In welche Not und Bedrängnis gerät da die Hoffnung der Menschen? Aber der Herr kommt dem sinkenden Mut zu Hilfe, wie einstens dem Petrus, als er in Gefahr war unterzugehen, indem er ihn auf das Wasser wie auf eine feste Fläche stellte, stark genug, um auf ihr dahinzuschreiten. Wenn nun das Gotteswort auch uns die rettende Hand entgegenstreckt und uns wegen unserer Unfähigkeit, bei der Tiefe der Gedanken aus eigener Kraft sicheren Schrittes einherzugehen, auf den festen Boden wahrer Erkenntnis stellt, so werden wir diese starke Hand des Gotteswortes ständig umklammern und jegliche Furcht ablegen.</p><p>Es lautet also die Seligpreisung: „Selig, die eines reinen Herzens sind; denn sie werden Gott anschauen.“ Diese Verheißung ist so groß, daß sie die höchste Stufe der Seligkeit noch zu überschreiten scheint. Denn welches Gut könnte nach diesem noch jener wünschen, der alles in dem besitzt, den er schaut.* „Schauen“* ist nämlich nach dem Sprachgebrauch der Schrift gleichbedeutend mit „haben“. So will die Schrift mit dem Ausdruck:* „Sehen* sollst du die Güter Jerusalems“ (Ps. 125, 5 [ber.: Ps. 127, 5 Septuag. u. Vulgata] [Ps. 128, 5 hebr.]) sicher versprechen: „Du wirst sie* finden“* oder* „erhalten“;* desgleichen will der Prophet in seiner Drohung: „Der Gottlose werde entfernt, damit er die Herrlichkeit des Herrn nicht sehe“ (Is. 26, 10) mit der Wendung „nicht sehen“ bestimmt „ein Nicht-Teilnehmen“ ausdrücken. Wer also Gott* sieht,* ist durch dieses Sehen in den Besitz aller Güter gelangt, die sich nur immer aufzählen lassen, wie: das ewige Leben, die immerwährende Unversehrtheit, die unverlierbare Seligkeit, die endlose Herrschaft, die unaufhörliche Freude, das wahre Licht, die geistige und süße Speise (bzw. Sprache), die unentreißbare Herrlichkeit, der beständige Jubel, überhaupt jedes Gut. So Vieles und so Großes ist es also, was die Seligpreisung unserer Hoffnung in Aussicht stellt.</p><p>Da aber als Mittel, dieses Schauen zu erlangen, die Reinheit des Herzens angegeben wird, so wird mein Verstand auch hier von einem Schwindel ergriffen, weil mich die Furcht befällt, es möchte die Reinheit des Herzens etwa zu den Dingen gehören, die unmöglich und für unsere Natur unerreichbar sind. Denn wenn man hiedurch zur Anschauung Gottes kommen soll, Moses aber Gott nicht gesehen hat und Paulus beteuert, weder er noch ein anderer könne ihn sehen, so scheint diese Reinheit, welche vom Worte selbst als Bedingung angegeben wird, um der Seligpreisung teilhaftig zu werden, tatsächlich in die Unmöglichkeiten eingereiht zu sein. Welchen Gewinn haben wir also davon, wenn wir zwar das Mittel kennenlernen, um zur Anschauung Gottes zu gelangen, wenn wir aber keine Möglichkeit finden, dieses Mittel zu erreichen? Es ist, als wenn jemand sagen würde: „Selig, wer in den Himmel kommt; denn dort sieht er, was im Leben nicht gesehen werden kann.“ Denn nur dann, wenn uns durch ein Wort Gottes, auch das Mittel zur Himmelsreise angegeben wird, ist uns der Hinweis auf die Herrlichkeit des Himmels nützlich. So lange es uns jedoch unmöglich bleibt, nach oben zu gelangen, welchen Gewinn hätten wir dann von dem bloßen Wissen um die Schönheit dort oben? Vielmehr würde es uns bloß in Traurigkeit versetzen, wenn wir nur von der himmlischen Seligkeit hören würden, aber kein Mittel wüßten, uns dieselbe zu verschaffen!</p><p>Befiehlt uns also der Herr etwas, was außerhalb unserer Natur ist, oder überschritt er mit seinem großartigen Gebot die Grenzen der menschlichen Kraft? Keineswegs! Weder befiehlt er denen, welchen er keine Flügel anerschuf, sie sollten sich in die Lüfte erheben, noch verlangt er, daß die Landtiere unter dem Wasser leben. Wenn nun auf allen übrigen Gebieten das Gesetz vollständig der Kraft derjenigen Rechnung trägt, für die es gegeben wird, und nirgend der Natur Gewalt geschieht, so müssen wir folgerichtig auch in unserem Fall annehmen, daß die in der Seligpreisung enthaltene Verheißung nicht außerhalb des Bereiches unserer Hoffnung liegt, daß vielmehr auch Johannes und Paulus wie auch Moses und andere ihnen ähnliche Lehrer der Seligkeit nicht verlustig gingen, welche aus der Anschauung Gottes erwächst, weder jener, der da sagen durfte: „Aufbewahrt ist mir die Krone der Gerechtigkeit, die mir der gerechte Richter übergeben wird“ (2 Tim. 4, 8), noch der Jünger, der an Jesu Brust gelegen hatte, noch derjenige, der die Stimme Gottes vernahm: „Vor allen habe ich dich erkannt“ (Exod. 33, 17).</p><p>Wenn daher zweifellos selbst jene, welche das Sehen Gottes als die menschliche Kraft übersteigend dargestellt haben, zur Seligkeit gelangten, die Seligkeit aber aus dem Schauen Gottes fließt, dieses hinwiederum nur der Herzensreinigkeit zuteil wird, so ist Herzensreinigkeit, die uns die Seligkeit erwirbt, kein Ding der Unmöglichkeit. Wie kann man nun sagen, einerseits hätten die Freunde des Paulus mit ihrer Behauptung, das Sehen Gottes gehe über die Kraft der menschlichen Natur, nur die Wahrheit verkündet, andererseits widerstreite ihnen das Wort des Herrn nicht, das da verspricht, auf Grund der Reinheit des Herzens werde Gott geschaut? Es dürfte gut sein, hierüber einige Bemerkungen vorauszuschicken, damit dann die Erörterung über die übrigen Punkte unseres Themas desto leichter vor sich gehe. Was die göttliche Natur an sich, ihrem innersten Wesen nach ist, übersteigt jegliche Fassungskraft, weil sie für alle Vorstellungen unzugänglich und unerreichbar ist; noch immer ist für die Menschen keine Kraft ausfindig gemacht, um Unbegreifliches zu begreifen, noch immer kein Weg ersonnen worden, um Unerklärbares zu erklären. Deshalb nennt der große Apostel die Wege Gottes unaufspürbar und zeigt durch diese Wendung zur Genüge an, daß die menschliche Vernunft keinen Weg betreten kann, der sie zur Erkenntnis der göttlichen Wesenheit führen würde, weil von allen, die uns im Leben vorangegangen, noch keiner auch nur eine* Spur* eines Vorstellungsmittels für das hinterlassen hätte, was sich unserer Erkenntnis entzieht. Wenn aber Gott seiner Natur nach über jede Natur erhaben ist, so wird er auf andere Weise* gesehen* und* erfaßt,* wenn er auch* an sich* unsichtbar und unfaßbar ist.</p><p>Es gibt nun vielfache Arten solchen Erkennens. So kann man auf Grund der Weisheit, die sich im Weltall zeigt, schlußfolgernd denjenigen erkennen, der das Weltall in Weisheit geschaffen hat, ähnlich wie bei Menschenwerken ihr Hersteller gewissermaßen mit dem Geiste gesehen wird, weil er seine Kunst in sein Erzeugnis niederlegte; hiebei sieht man zwar nicht die Wesenheit des Künstlers selbst, sondern sein künstlerisches Können, das er in seine Arbeit legte; ebenso vermögen wir, wenn wir auf die Ordnung in der Schöpfung unser Augenmerk richten, in unserer Vorstellung kein Bild von der göttlichen Wesenheit hervorzurufen, wohl aber von der Weisheit dessen, der das All in solcher Weisheit erschuf. Und wenn wir den Ursprung unseres Lebens erwägen und dabei beachten, daß Gott nicht gezwungenerweise, sondern aus freiem Wohlwollen zu unserer Erschaffung schritt, so können wir sagen, daß wir auch auf diesem Wege Gott anschauen, indem wir freilich nicht in sein Wesen, aber doch in seine Güte einen Einblick gewinnen. So können wir auch alles andere, was unseren Geist zu Vollkommenerem und Höherem führt, als ein Mittel zur Erkenntnis Gottes betrachten, da der Gedanke einer jeden größeren Vollkommenheit uns Gott vor Augen führt; denn die Macht und die Reinheit, die Unveränderlichkeit und das Freisein des Gegenteiligen ruft in unseren Seelen die Vorstellung irgendeiner göttlichen und erhabenen Eigenschaft hervor. Aus dem Gesagten ergibt sich, daß einerseits der Herr die Wahrheit spricht, wenn er der Reinheit des Herzens die Anschauung Gottes verhieß, andererseits Paulus nicht lügt, wenn er lehrt, niemand habe Gott gesehen und niemand könne Gott sehen. Denn Gott ist* an und für sich* unsichtbar, wird aber sichtbar in seinen* Werken,* insofern durch dieselben manche seiner* Eigenschaften* gesehen werden.</p><p>Allein nicht bloß darauf geht der Sinn der Seligpreisung, daß wir aus den Werken auf den Schöpfer schließen können; denn auch die Verständigen dieser Welt sind wohl imstande, auf Grund der Ordnung des Universums die überirdische Weisheit und Macht zu erkennen. Vielmehr will unsere herrliche Seligpreisung alle, die es fassen, zur Einsicht bringen, daß sie das ersehnte Gut noch in anderer Weise sehen werden. Meine Ansicht will ich durch Beispiele erläutern. Ein hohes Gut für das menschliche Leben ist die Gesundheit des Körpers. Doch das Beseligende liegt nicht darin, daß man weiß, was Gesundheit ist, sondern daß man sich im Leben derselben erfreut. Denn wenn jemand die Gesundheit noch so sehr preisen, aber doch ungesunde, schädliche Nahrung zu sich nehmen würde, was würde ihm dann, wenn er von Krankheit aufgerieben wird, aller Lobpreis nützen? Wenden wir dies auf die Frage an, die uns beschäftigt, so drängt sich uns die Einsicht auf, der Herr preise nicht jene selig, welche ihn nach irgendeiner Seite erkennen, sondern nur jene, welche ihn besitzen.</p><p>„Selig,“ heißt es dann, „die ein reines Herz haben; sie werden Gott anschauen.“ Damit wird dem, dessen Seelenauge gereinigt ist, Gott keineswegs wie ein Bild bloß äußerlich gegenübergestellt, sondern durch die großartige Seligpreisung wird uns jene Wahrheit nahegelegt, die uns das Wort (Gottes) anderwärts deutlicher verkündet, indem es lehrt, daß das Reich Gottes in uns selbst sei (Luk. 17, 21). Hierdurch sollen wir lernen, daß alle, die ihr Herz von allem Bösen und von jeder Leidenschaftlichkeit gereinigt haben, in ihrer eigenen Schönheit das Abbild des göttlichen Wesens sehen. In seiner kurzen Fassung scheint das Wort der Seligpreisung allen ungefähr folgende Mahnung zuzurufen: O ihr Menschen! wenn so manche von euch sich nach der Anschauung Gottes sehnen und wenn ihr doch zugleich höret, daß die göttliche Majestät über die Himmel erhaben ist, ihre Herrlichkeit unbeschreiblich, ihre Schönheit unaussprechlich und ihre Wesenheit unbegreiflich, so lasset euch die Hoffnung nicht rauben, als ob ihr nicht imstande wäret, dieses Gut der Sehnsucht zu schauen. Denn ein bestimmtes Maß von Gotteserkenntnis, wie es dir entspricht, trägst du in dir selbst, indem der Schöpfer jenes hohe Gut gewissermaßen zu einem Bestandteil deiner eigenen Natur gemacht hat; denn Abbilder jener Vollkommenheiten, die seiner Wesenheit selbst zukommen, prägte er dir ein, als er dich erschuf, ähnlich wie man in ein Wachssiegel die Figur des Stempels eindrückt.</p><p>Die Sünde jedoch, die sich um die gottähnliche Gestalt legte, hat die Gottesgabe in dir entwertet, weil sie gleichsam mit häßlichen Decken überzogen wurde. Wenn du nun den Schmutz, der sich auf dein Herz gelagert, durch vorsichtigen Wandel wieder wegspülest, so wird dir deine schöne Gottesebenbildlichkeit aufleuchten, wie du es auch am Stahle sehen kannst. Sobald dieser durch den Schleifstein vom Roste, der ihn soeben noch schwärzte, befreit wird, gehen von ihm, sooft du ihn gegen die Sonne hältst, Strahlen und Glanz aus; so wird auch der innere Mensch ― der Herr nennt ihn Herz ―, wenn wir ihn vom Rostschmutz, welchen der Moderfraß der Sünde um ihn gelegt hatte, sorgsam reinigen, wieder die Ähnlichkeit mit seinem erhabenen Urbild erlangen und damit wieder gut werden; denn wer dem Guten ähnlich wird, wird sicher auch gut werden.</p><p>Wenn ein so Gereinigter auf sich selbst seinen Blick richtet, so sieht er in sich auch den Gegenstand seiner Sehnsucht. Daher kann jeder, der ein reines Herz hat, auf seine eigene Reinheit blickend, in diesem Abbilde das ewige Urbild anschauen. Denn wie die, welche die Sonne im Spiegel sehen, auch wenn sie nicht unverwandten Blickes zum Himmel emporschauen, die Sonne im Glanze des Spiegels fast nicht weniger deutlich sehen, als diejenigen, welche die Sonnenscheibe selbst anschauen, so seid ihr, will er euch zurufen, zwar zu schwach, um das unzugängliche Licht selbst zu schauen; wenn ihr jedoch zu der ursprünglichen, bei der Erschaffung euch verliehenen Gnade der Ebenbildlichkeit mit Gott zurückkehrt, so traget ihr das Gesuchte in euch selbst. Gott ist nämlich Reinheit, Freiheit von Leidenschaft und Abwesenheit jeglicher Sünde; wenn dies in deiner Seele wohnt, so besitzest du auch Gott in dir. Wenn also dein Sinnen und Trachten jegliche Bosheit zurückweist, von aller Leidenschaftlichkeit sich frei bewahrt und jede Befleckung fernehält, so bist du selig zu nennen wegen deiner weitreichenden Sehkraft; denn du kannst das, was der Ungereinigte nicht erschauen kann, infolge deiner Reinigung sehen und es bietet sich dir, nachdem die dicke Finsternis von deinen Seelenaugen hinweggenommen ist, ein beseligender Anblick dar an dem klaren Himmel deines Herzens. Und was erblickst du da? Die Reinheit, die Heiligkeit, die Einfalt ― alles herrliche Abstrahlungen des göttlichen Wesens, in denen also Gott selbst* in denselben* geschaut werden darf. Und daß es sich so verhalte, können wir nach dem Gesagten nicht in Zweifel ziehen.</p><p>Aber noch einen Punkt haben wir zu untersuchen, der uns schon im Anfange Schwierigkeiten machte und der noch jetzt ungeklärt ist. Denn wie die Seligen an den Wundern des Himmels teilnehmen, die Gewißheit hierüber uns aber, solange die Erreichung des Himmels uns unmöglich scheint, keinen Gewinn bringen kann, so unterliegt es zwar auch keinem Zweifel, daß wir durch die Reinheit des Herzens seligzupreisen sind, aber mit der Art und Weise, diese Reinheit nach eingetretener Befleckung wieder herzustellen, scheint es eine ähnliche Bewandtnis zu haben, wie mit der Erlangung des Himmels, falls man darüber nicht unterrichtet ist. Denn wo ist denn die Jakobsleiter, auf der man zum Himmel aufsteigt? Wo findet sich nach dem Vorbild des Feuerwagens, der den Propheten Elias in den Himmel emportrug, auch für uns der Wunderwagen, der unsere Seele zu den Herrlichkeiten dort oben emporheben und von aller Erdenlast befreien könnte? Denn wer die Leidenschaften erwägt, die unaufhaltsam auf unsere Seele einstürmen, kann es leicht für ganz ausgeschlossen erachten, dieser förmlichen Kette von Übeln zu entrinnen. Aus Leidenschaft sind wir geboren, durch Leidenschaft vollzog sich unsere Entwicklung, in Leidenschaft neigt sich unser Leben seinem Ende zu. So ist das Böse gleichsam zu einem Wesensbestandteil unserer Natur geworden durch die Schuld der Stammeltern, welche im Anfang der Leidenschaft sich hingaben und durch ihren Ungehorsam der Krankheit Eingang verschafften. Wie aber bei allen Tiergattungen durch die ununterbrochene Aufeinanderfolge der Generationen die Wesensbeschaffenheit immer forterhalten wird, so daß die Nachkommenschaft von den Vorfahren ganz die gleiche Natur ererbt, so entsteht auch aus dem Menschen wieder ein Mensch von der nämlichen Beschaffenheit, also aus einem leidenschaftlichen Menschen ein leidenschaftlicher, aus einem sündhaften ein sündhafter. Demnach wird, wenn der Mensch geboren wird, sozusagen die Sünde mitgeboren; und wie sie mit ihm ins Leben eingetreten, so entfaltet sie sich mit ihm und endigt erst in seiner Todesstunde.</p><p>Daß aber die Tugend mit tausendfachen Schweißtropfen und Anstrengungen nur schwer erworben, ja mit aller Sorgfalt und Mühe kaum errungen werden kann, lehrt die Heilige Schrift an vielen Stellen. So hören wir in ihr, daß eng und schmal der Weg sei, der ins Himmelreich emporführt, dagegen breit und leicht und geebnet die Sündenbahn, die abwärts ins Verderben geht (Matth. 7, 13 f.). Freilich für ganz unerreichbar hat die Schrift das erhabene Leben nicht erklärt, da sie in den heiligen Büchern das wundervolle Leben so vieler tadelloser Männer erzählt. Da aber die Verheißung von der Anschauung Gottes eine zweifache Auffassung zuläßt, einmal die, daß wir die alles übersteigende Wesenheit ganz erkennen würden, dann die, daß wir zur Vereinigung mit Gott auf Grund eines reinen Lebens gelangen werden, so erklärt zwar die Stimme der heiligen Schriftsteller, die erste Auffassung von einer vollen Gotteserkenntnis sei unmöglich, die zweite aber stellt der Herr dem Menschengeschlechte vor Augen durch seine Verkündigung, die uns gerade beschäftigt: „Selig, die eines reinen Herzens sind; denn sie werden Gott anschauen.“</p><p>Hinsichtlich des Weges aber, der zur Reinheit führt, gibt uns fast jede Seite des Evangeliums ungefähr folgende Unterweisung. Denn wenn du die in demselben enthaltenen Verkündigungen der Reihe nach rasch durchgehst, so wirst du ganz deutlich das Reinigungsmittel für das Herz finden. Der Herr unterscheidet nämlich zwei Gattungen von Sünden: Sünden in Handlungen und Sünden in Gedanken; die erstere Gattung züchtigt er durch das alte Gesetz; er dehnt das Gesetz aber auch auf die zweite Gattung aus und droht nicht bloß den bösen Handlungen Strafe an, sondern will auch die Quelle der bösen Taten treffen, damit überhaupt nichts Böses geschieht. Denn das Böse aus dem Willen entfernen, ist von größerer Bedeutung, als die bösen Handlungen aus dem Leben beseitigen. Da aber das Böse in verschiedener Gestalt und nach verschiedenen Seiten auftritt, so schreibt er jeder Übertretung gegenüber ein besonderes Heilverfahren in seiner Predigt vor.</p><p>Weil man nun das ganze Leben hindurch am meisten zur Krankheit des Zornes geneigt ist, so beginnt er mit der Heilung dieses so einschneidenden und weitverbreiteten Fehlers, indem er die Beherrschung des Zornes an die Spitze stellt. Deshalb erklärt er: „Im alten Gesetz hast du das Gebot vernommen: Du sollst nicht töten!“ (Exod. 20, 3.) Jetzt aber lerne, auch den Zorn gegen den Nächsten aus deinem Herzen zu entfernen. Denn nicht den Zorn überhaupt will er verbieten, weil wir diesen Trieb der Seele öfter auch zum Guten verwenden können, sondern das Ziel seiner Verkündigung ist, daß man in keiner schlimmen Absicht den Zorn gegen die Mitmenschen aufkommen lassen solle; denn es heißt: „Jeder, der ohne Grund seinem Bruder zürnt, ist des Gerichtes schuldig“ (Matth. 5, 22). Der Zusatz „ohne Grund“ zeigt an,daß es manchmal gut ist, den Zorn anzuwenden, nämlich wenn wir ihn zur Züchtigung der Sünde auflodern lassen. Eine derartige Äußerung des Zornes schreibt das Schriftwort dem Phinees zu, als er durch Hinrichtung der Frevler die Drohung abwendet, die Gott gegen sein Volk ausgesprochen hatte (Num. 25, 11). In der Heilung des Bösen weiterfahrend, wendet er sich gegen die Sünden der Wollust und entfernt durch sein Verbot die sündhafte Begierde nach Ehebruch aus dem Herzen. Und wenn du der Reihe nach alle Übertretungen durchforschest, so wirst du finden, wie der Herr in seiner Predigt ein Heilmittel gegen jede Sünde angibt. So verhindert er den ungerechten Angriff auf den Nächsten dadurch, daß er nicht einmal eine Verteidigung gestattet; die Leidenschaft der Habgier vertreibt er durch das Geheiß, dem, der uns mit Gewalt etwas genommen hat, auch noch das zu geben, was er uns gelassen; die Feigheit heilt er durch die Mahnung, den Tod zu verachten. Und so wirst du in allem finden, daß das Gotteswort, wie ein Pflug tief einschneidend, die gefährlichen Wurzeln der Sünden aus den Tiefen der Seele herauswirft, damit wir vor einer Dornen- und Distelernte bewahrt bleiben.</p><p>Auf zweifache Weise kommt also der Herr uns zu Hilfe, sowohl dadurch, daß er uns die Seligkeit verheißt, als auch dadurch, daß er uns den Weg lehrt, der zu derselben führt. Meinst du aber, das Streben nach den höheren Gütern, sei mühevoll, so vergleiche es mit dem entgegengesetzten Streben, und du wirst finden, daß die Sünde unvergleichlich mehr Mühsal bereitet, wenn du deinen Blick nicht bloß auf das gegenwärtige Leben richtest, sondern auf das zukünftige, das nach diesem anfängt. Wer jemals von der Hölle gehört, für den ist wenig Anstrengung und Kraft erforderlich, um die sündige Lust abzuweisen, sondern die Furcht allein schon, die sein Herz ergriffen, wird genügen, um die Leidenschaften zu zügeln. Noch von größerer Wirkung ist es, wenn wir aus der Seligpreisung noch einen Gedanken, auch wenn er nicht geradezu ausgesprochen ist, mit heraushören und beherzigen, um durch denselben unser Verlangen nach dem Guten um so mehr zu entzünden. Denn wenn nur jene selig sind, welche ein reines Herz haben, so sind sicher die zu beklagen, welche ein beflecktes Herz haben, weil sie das Antlitz des Widersachers schauen. Und wenn dem Leben der Guten das Bild Gottes eingedrückt ist, so muß unleugbar das Leben der Bösen Gestalt und Antlitz des Widersachers verraten. Ja, wenn Gott, da er unter verschiedenen Gesichtspunkten betrachtet wird, und sehr viele Vollkommenheiten zum Begriff des Guten gehören, mehrere Namen gegeben werden können wie Licht, Leben, Unverweslichkeit und ähnliches dieser Art, so müssen andererseits dem Erfinder des Bösen Namen zukommen, welche das Gegenteil der genannten Vorzüge ausdrücken wie Finsternis, Tod, Verweslichkeit und andere damit verwandte Bezeichnungen.</p><p>Da wir nun die wichtigsten Bedingungen und Äußerungen sowohl des guten wie des bösen Wandels kennengelernt, so lasset das (aus Ber. lies: „uns“ statt „das“), weil uns wegen unseres freien Willens die Entscheidung nach den beiden Richtungen freisteht, die Ähnlichkeit mit dem Teufel fliehen, indem wir die bösen Eigenschaften ablegen, dagegen nach der Ebenbildlichkeit mit Gott trachten und reinen Herzens werden, auf daß wir zur Seligkeit gelangen, nachdem wir durch einen reinen Wandel Gottes Bild in uns gestaltet haben, in Jesus Christus unserem Herrn, dem die Ehre und Macht sei von Ewigkeit zu Ewigkeit. Amen.Siebente Rede: „Selig sind die Friedfertigen; denn sie werden Kinder Gottes genannt werden.“</p><h2>0</h2><p>In dem heiligen Zelte des Zeugnisses, welches der Gesetzgeber nach dem Muster, das Gott ihm auf dem Berge gezeigt, für die Israeliten errichtete, war innerhalb der Umzäunung alles und jedes heilig und geweiht; das Innerste desselben war aber abgeschlossen und unzugänglich. Es wurde das Heilige des Heiligen (das Allerheiligste) genannt, um, wie ich glaube, schon durch den umständlichen Namen anzuzeigen, daß es nicht bloß den gleichen Grad von Heiligkeit wie alles andere besitze, sondern daß es die übrigen geweihten und heiligen Bestandteile in einem solchen Maße überrage, in welchem das Heilige und Geweihte über dem Gewöhnlichen und Ungeweihten steht. Ohne Zweifel ist ähnlich hinsichtlich der Seligpreisungen, die auf diesem Berge uns gezeigt wurden, alles und jedes, was wir vorher schon durch das Wort Gottes hörten, heilig und geweiht, das aber, was uns jetzt zur Betrachtung vorliegt, ist in Wahrheit das Innerste und das Allerheiligste. Denn wenn es auch kein höheres Gut gibt, als Gott zu sehen, so übertrifft es doch wahrhaft jedes Glück, ein Gotteskind zu werden. Welche Worte können ersonnen, welche Namen erdacht werden, um das Gnadengeschenk einer solch erhabenen Verheißung würdig darzustellen? Was sie uns offenbart, geht über das Höchste hinaus, zu dem sich einer im Geiste zu erheben vermag. Wenn du auch den Inhalt der Verheißung als herrlich, als ehrenvoll oder als großartig bezeichnest, so ist in derselben mehr enthalten, als solche Worte besagen. Es wird ein Glück versprochen, das unsere Wünsche, ein Geschenk, das unsere Hoffnung, eine Gnade, die unsere Natur weit übersteigt. Denn was ist der Mensch im Vergleich zum göttlichen Wesen? Von welchem der Heiligen soll ich Aussprüche anführen, um die Niedrigkeit des Menschen zu beleuchten? Nach Abraham ist er Staub und Asche (Gen. 18, 27), nach Isaias Heu (Is. 40, 6), nach David nicht einmal Gras, sondern nur etwas dem Gras Ähnliches (Ps. 36, 2 [= Septuag. u. Vulgata] [hebr. Ps. 37, 2]) ― denn ersterer sagt wenigstens: „Alles Fleisch ist Heu“, letzterer aber: „Der Mensch ist wie Gras“ ― nach dem Ekklesiastes Eitelkeit (1, 2), nach Paulus Elend (1 Kor. 15, 19). ― Denn die Bezeichnung, die Paulus auf sich anwendet, gilt für jeden Menschen.</p><p>Das ist der Mensch. Was ist aber Gott? Wie soll ich das Wesen schildern, das unser Auge nicht sehen, unser Ohr nicht vernehmen, unser Herz nicht begreifen kann? Mit welchen Worten soll ich seine Natur beschreiben? Oder wo finde ich ein uns zugängliches Gut, mit dem ich Gott irgendwie vergleichen könnte? Oder finde ich neue Worte, um den darzustellen, der unaussprechlich und unbeschreiblich ist? Wohl lese ich in der von Gott eingegebenen Schrift großartige Schilderungen Gottes; aber was sind diese im Vergleiche zu seiner wirklichen Wesensbeschaffenheit? Nur soviel als ich zu fassen vermag, sagt mir das Wort Gottes, ohne mir die volle Erkenntnis des erhabenen Gegenstandes zu vermitteln. Wie jeder nur nach dem Grade seiner Aufnahmsfähigkeit Luft einatmet, der eine mehr, der andere weniger und keiner, auch nicht jener, der sehr viel davon zurückbehalten kann, imstande ist, die ganze Luft in sich aufzunehmen, sondern nur soviel als er vermag, so daß das Element als Ganzes in seinem Bestand unberührt bleibt, so ist auch die Gotteserkenntnis, welche uns in der Heiligen Schrift unter Eingebung des Heiligen Geistes geboten wird, an unserer Einsicht gemessen, unvergleichlich groß und erhaben, aber trotzdem wird die wahre Größe Gottes nicht erreicht. So lesen wir dort: „Wer hat die Himmel mit der Spanne gemessen und mit der Hand das Wasser und die ganze Erde mit der Fläche der Hand“ (Is. 40, 12). Fühlst du nicht die Kühnheit, mit welcher hier die unaussprechliche Macht beschrieben wird? Aber was ist diese großartige Schilderung gegenüber der Wirklichkeit? Denn nur einen Bruchteil des göttlichen Wirkens hat das Prophetenwort in seinen wuchtigen Sätzen uns vorgeführt; die Macht selbst, von der dieses Wirken ausgeht, geschweige die Natur, von der die Macht stammt, hat er uns nicht vorgestellt und auch nicht vorstellen wollen. Vielmehr tadelt er diejenigen, welche es wagen, nach ihren Mutmaßungen ein Bild von Gott zu entwerfen; im Namen Gottes redet er sie nämlich also an: „Mit wem vergleicht ihr mich, spricht der Herr“ (Is. 40, 18). Die nämliche Mahnung gibt auch der Prediger, wenn er schreibt: „Bringe nicht vorschnell ein Wort über Gottes Antlitz vor; denn Gott wohnt im Himmel oben, du aber bist auf Erden hier unten“ (5, 1). Schon durch die Gegenüberstellung von Himmel und Erde will er darauf hinweisen, wie sehr Gott unsere Gedanken überragt, die da an der Erde haften.</p><p>Und diesem Wesen von solcher Vollkommenheit und Größe, das weder Auge noch Ohr noch Verstand erfassen kann, soll der Mensch, der unter den Geschöpfen für nichts erachtet wird, der nur Asche, Gras und Eitelkeit ist, in die engste Beziehung treten, indem er von Gott, dem Herrn der ganzen Welt, an Kindes Statt angenommen wird. Was gäbe es, um Gott für solche Huld würdig zu danken? Welches Wort, welcher Gedanke, welche Begeisterung wäre hinreichend, um das Übermaß der Gnade zu preisen und zu verherrlichen? Weit schreitet der Mensch über seine Natur hinaus, da er aus einem Sterblichen ein Unsterblicher, aus einem Vergänglichen ein Unvergänglicher, kurz, aus einem Menschen Gott wird. Denn wer so hoch erhoben wurde, ein Kind Gottes zu werden, muß auch die Würde des Vaters erhalten und die väterlichen Güter erben. O Freigebigkeit des reichen Herrn! O offene Hand! O mächtiger Arm! Wie unermeßlich sind die Gnaden, die er aus seiner verborgenen Schatzkammer hervorholt, um sie uns zu spenden! Aus reiner Liebe zu uns Menschen erhebt er unsere Natur, welche durch die Sünde ihre Ehre und Hoheit verlor, fast zu seiner eigenen Würde. Denn wenn er den Menschen in die Verwandtschaft mit dem, was er selbst seiner Natur nach ist, in freier Liebe aufnehmen will, was bedeutet dies anders, als daß er ihn auf Grund der genannten Verwandtschaft zur nämlichen Würde erhebt?</p><p>Wie herrlich ist also der Kampfpreis! Welches ist aber der Kampf, der ihn uns verschafft? Die Antwort des Herrn lautet: „Wenn du friedfertig bist, so sollst du mit der Gnadenkrone der Kindschaft Gottes gekrönt werden.“ Ich halte dafür, daß selbst die Leistung, für welche dir ein so großer Lohn verheißen wird, ein zweites Geschenk ist. Denn was ist für den Genuß aller Güter, welche die Erde kennt, notwendiger und süßer als ein Leben im Frieden? Denn alles, was wir hienieden als angenehm zu bezeichnen pflegen, bedarf des Friedens, um wirklich angenehm zu sein. Wenn nämlich alles zur Verfügung stünde, was nur immer im Leben geschätzt wird: Reichtum, Gesundheit, Gattin, Kinder, Wohnung, Eltern, Diener, Freunde, Erzeugnisse von Land und Meer, Parkanlagen, Jagden, Bäder, Turnschulen, Übungsplätze, Gelegenheit zum Schlemmen und Schwelgen und überhaupt alle Mittel, die man zur Befriedigung der Vergnügungssucht erfand, wie, wenn du sie nennen willst, Theater und Konzerte und die anderen Freuden, welche die Genußsüchtigen noch sonst am Leben haben, ― wenn all das vorhanden wäre, das Gut des Friedens aber fehlen würde, welchen Nutzen hätten wir von all den aufgezählten Annehmlichkeiten und Freuden, falls der Krieg ihren Genuß beeinträchtigen würde? Demnach ist der Friede an sich schon angenehm für uns, wenn wir ihn besitzen, und zudem versüßt er alles, was im Leben geschätzt wird.</p><p>Sogar wenn, wie es das Menschenleben mit sich bringt, ein Unglück uns trifft, jedoch zur Zeit des Friedens, so ist doch mit dem Unglück noch ein Glück verbunden, so daß das Mißgeschick von den davon Heimgesuchten leichter ertragen wird. Wenn aber Krieg das Leben bedrängt, so sind wir für andere noch so schmerzliche Ereignisse gewissermaßen unempfindlich; denn das gemeinsame Unglück wird schmerzlicher empfunden als das Unglück des einzelnen. Und wie nach der Meinung der Ärzte von zwei Krankheiten nur die schwerere empfunden wird, das Schmerzliche des geringeren Übels aber sozusagen verborgen bleibt und die Heftigkeit des stärkeren Leidens über das kleinere hinwegtäuscht, so pflegen auch die Leiden des Krieges, weil sie an Schmerzlichkeit das Mißgeschick der einzelnen übertreffen, in der Regel zu bewirken, daß man gegen letzteres sich unempfindlich verhält. Wenn die Seele das Gefühl für die eigenen Leiden verloren hat, wie könnte sie, wenn sie durch die gemeinsamen Leiden des Krieges in Schrecken gerät, noch eine Empfindung für Annehmlichkeiten haben? Waffen, Pferde, geschliffener Stahl, Trompetenstöße, von Lanzen starrende Schlachtreihen, Schild an Schild, furchtbar mit den Büschen nickende Helme, Zusammenstöße, Gedränge, Handgemenge, Schlachten, Metzeleien, Flucht, Verfolgung, Wehklagen, Kriegsgeschrei, blutgetränkter Boden, zertretene Leichen, verlassene Verwundete und was sonst an Schrecknissen des Krieges zu sehen und zu schildern ist ― wer würde, falls er von solchen Übeln umgeben ist, sich bemüßigt fühlen, seine Sinne auf Freude und Lust zu lenken? Und gesetzt, es würde in der Seele der Gedanke an irgend etwas recht Erfreuliches auftauchen, würde es nicht unser Unglück vermehren, wenn die Erinnerung an so Liebes und Teueres gerade im Augenblick der Gefahr in unserem Geiste erwacht?</p><p>Wer dir also dafür, daß du dich von den Übeln des Krieges fernhältst, eine Belohnung geben will, begnadigt dich mit einem zweifachen Geschenk. Das eine Geschenk ist nämlich der Kampfpreis, das andere der Kampf. Daher würde, selbst wenn kein Lohn dafür in Aussicht gestellt wäre, der Friede an sich in den Augen aller Verständigen es verdienen, daß er mehr als andere Güter angestrebt werde. Das Übermaß der Liebe Gottes zu uns Menschen läßt sich also gerade daraus deutlich erkennen, daß er so herrliche Belohnungen nicht etwa auf Schweiß und Mühe gesetzt hat, sondern sozusagen auf Wohlleben und Vergnügen, weil ja der Friede von allem Schönen und Erfreulichen die Hauptsache ist. Und sein Wille geht dahin, dieser Friede möge bei allen in solcher Fülle vorhanden sein, daß ihn jeder nicht bloß selbst besitze, sondern aus seinem reichen Überfluß davon auch jenen mitteile, die ihn nicht haben. Es heißt ja: „Selig die Friedfertigen“; friedfertig ist aber jener, welcher den Frieden einem anderen verschafft; freilich kann man nur das anderen gewähren, was man selbst besitzt. Er will demnach, daß du vor allem selbst mit den Segnungen des Friedens gesättigt seiest, dann aber auch, daß du denen davon mitteilest, welche an diesen Gütern Mangel haben.</p><p>Hiebei brauchen wir keine allzu tiefgründigen Betrachtungen über die Seligpreisung anzustellen; schon ihr zunächstliegender Sinn genügt, um uns das hohe Gut anzupreisen. „Selig sind die Friedfertigen“. In diesem kurzen Satz vollzieht das Gotteswort unsere Heilung von vielen Krankheiten, indem es in dieser allgemeinen, umfassenden Form viele einzelne Wahrheiten uns zugleich nahelegt. Erwägen wir zuerst, was unter Frieden zu verstehen ist. Nichts anderes als eine liebevolle Übereinstimmung mit unseren Mitmenschen. Was ist aber der Liebe zum Nächsten entgegengesetzt? Haß, Zorn, Neid, Groll, Rachsucht, Heuchelei, Streit. Daraus schon kannst du erkennen, für welch zahlreiche und schlimme Krankheiten jenes eine Wort der Seligpreisung als heilendes Gegenmittel dient; denn all den Verfehlungen, die ich soeben aufgezählt, tritt der Friede in gleicher Weise entgegen und sein Kommen genügt, um diese Übel sämtlich zu beseitigen. Gleichwie nämlich die Krankheit durch das Eintreten der Gesundheit weicht und die Finsternis beim Erscheinen des Lichtes schwindet, ebenso müssen beim Nahen des Friedens alle Leidenschaften fliehen, die ihm entgegengesetzt sind. Welch großes Glück damit begründet wird, meine nicht ich erst dir darlegen zu müssen; sondern vergegenwärtige dir selbst, welches Leben die Menschen haben, die einander beargwöhnen und anfeinden. Sie verkehren miteinander voll Ingrimm; sie fühlen sich gegenseitig in allen Dingen abgestoßen; geschlossen ist der Mund, abgewendet die Augen, versperrt das Ohr, mag der Hassende oder der Gehaßte reden; was dem einen lieb ist, ist dem anderen zuwider, und umgekehrt, was der eine verabscheut, liebt der Gegner.</p><p>Wie nun wohlriechende Gewürze die Luft in weitem Umkreis mit angenehmem Dufte erfüllen, so möchte dir der Herr die Gnade des Friedens in überfließendem Maße bescheren, damit dein Wandel die Krankheiten deiner Mitmenschen heile. Welch hohen Wert dieses Gut hat, wirst du einsehen, wenn du die schlimmen Folgen erwägest, welche aus einer feindseligen Gesinnung für die Seele entstehen. Wer könnte die Zornesausbrüche gebührend beschreiben? Und welche Rede vermag die ganze Häßlichkeit dieser Leidenschaft entsprechend darzustellen? All die Schrecknisse, welche du an Besessenen wahrnimmst, wiederholen sich bei den Zornmütigen. Wenn wir die Wirkungen des Satans und die des Zornes miteinander vergleichen, welchen Unterschied könnten wir dann noch feststellen? Blutunterlaufen und verdreht ist das Auge der Besessenen, unbeholfen ihre Zunge, rauh ihre Sprache, bellend ihre Stimme ― diese Übel ruft der Zorn ebenso hervor wie der Satan. Heftiges Schütteln des Kopfes, wilde Bewegungen der Hände, Beben des ganzen Körpers, Wanken der Füße ― diese* eine* Schilderung zeichnet zugleich die zwei Krankheiten der Besessenheit und des Zornes. Nur insofern unterscheiden sich die beiden Übel, daß das eine freiwillig ist, das andere aber die Menschen gegen ihren Willen befällt. Aber um wieviel bejammernswerter sind diejenigen, welche nach ihrem eigenen Willen unglücklich wurden, als jene, die es gegen ihren Willen geworden sind! Und wer immer die satanische Arbeit sieht, wird von Mitleid ergriffen, aber den Wahnsinn des Zornes sieht man und ― ahmt ihn nach, in der Meinung, zurückzustehen, wenn man es dem anderen an Leidenschaftlichkeit nicht zuvor tun würde, der von der Krankheit zuerst befallen war.</p><p>Und wenn Satan den Leib seines Opfers anfällt, so begnügt er sich trotz seiner Bosheit damit, daß er die Hände des Besessenen in die leere Luft schleudert, der Satan des Zornes ruft aber keineswegs so harmlose Bewegungen des Körpers hervor. Wenn nämlich die Leidenschaft sich ganz entfaltet und das Herzblut ins Kochen gerät, während die schwarze Galle ― so sagt man ― infolge der Zorneserregung durch den ganzen Körper sich ergießt, dann wird von den inwendig zusammengepreßten Dünsten ein starker Druck auf alle Sinneswerkzeuge ausgeübt, die sich am Kopfe befinden. Die Augen treten nun unter den Wimpern hervor und blicken bluttriefend und schlangengiftig auf das, was den Grimm verursacht hat, schwerer Atem beengt das Herz, die Adern am Halse schwellen an, schwer wird die Zunge, die Stimme tönt, weil die Luftröhre sich zusammengezogen hat, kreischend, die Lippen werden infolge jener Gallenergießung starr und bläulich und sind unfähig, sich naturgemäß zu öffnen und zu schließen, ja sie können nicht einmal mehr den überschüssigen Speichel zurückhalten, sondern lassen ihn beim Sprechen aus dem Munde treten, so daß mit den heftig hervorgestoßenen Lauten der Geifer herausspritzt. Zugleich kann man sehen, wie die Hände von der Krankheit hin und her bewegt werden, desgleichen die Füße. Doch ist diese Bewegung keineswegs wie bei den Besessenen unschuldiger Natur, sondern durch die feste Absicht veranlaßt, dem Gegner zu schaden. Denn sobald es zum Streite kommt, gehen die Feinde darauf aus, beim Ringen gerade die empfindlichsten Stellen der Sinneswerkzeuge zu treffen. Und wenn hiebei vielleicht der eine den Mund dem Körper des anderen nahe bringt, so bleiben nicht einmal die Zähne untätig, sondern beißen, wie es bei wilden Tieren vorkommt, in das Fleisch des Gegners wie es sich gerade trifft. Doch wer vermöchte alles Schlimme einzeln aufzuführen, welches der Zorn anrichtet! Darum verdient derjenige, welcher so große und so viele Übel verhindert, als umfassender Segensstifter seliggepriesen und hoch geehrt zu werden. Wenn schon der Arzt, der den Menschen von körperlichem Leid befreit, überaus geschätzt wird, um wieviel mehr muß dann derjenige, welcher die Seele aus so schlimmer Krankheit rettet, von allen Einsichtigen als wahrer Wohltäter des Lebens geachtet werden. Denn um wieviel die Seele den Leib an Wert überragt, um soviel ist derjenige, welcher die Seele gesund macht, höher zu schätzen als derjenige, der den Leib gesund macht.</p><p>Trotzdem darf niemand meinen, daß ich etwa den Zorn als das größte Übel hinstellen möchte, das die Feindschaft erzeugt. Nein, nach meinem Ermessen ist die Leidenschaft des Neides und der Falschheit noch schlimmer als der Zorn und zwar in dem Maße schlimmer als versteckte Übel mehr zu fürchten sind als offen daliegende. Müssen wir uns ja auch am meisten vor jenen Hunden hüten, welche weder durch Gebell ihren Zorn verraten noch uns von vorne offen anfallen, sondern unter dem Schein der Ruhe und der Zahmheit auf den günstigen Augenblick lauern, wo sie uns ungesehen und unbeachtet beikommen können. Ähnlich verhält es sich mit der Krankheit des Neides und der Falschheit, bei denen im Innern, tief im Herzen, der Haß wie ein Feuer im Verborgenen glimmt, während voll Heuchelei die Maske der Freundschaft nach außen aufgesetzt wird. Wie nämlich das Feuer, das unter Spreu verborgen loht, anfangs nur im Innern die nächste Umgebung versengt, nach außen aber keine Flamme emporsendet, sondern nur einen beißenden Qualm, der mit Gewalt im Innern zurückgehalten wird, etwas aufsteigen läßt, und wie jedoch dann, wenn ein Luftzug hinzutritt, alsbald eine lichte, helle Flamme emporzüngelt, so frißt auch der Neid inwendig am Herzen wie das Feuer am dichten Spreuhaufen und verbirgt, von Scham ergriffen, seine Krankheit. Freilich gelingt es ihm nicht, sie vollständig verborgen zu halten, sondern jenem beißenden Qualme ähnlich, kommt seine Bitterkeit manchmal in schwachen Äußerungen an das Tageslicht. Wenn aber dem Beneideten ein Unglück zustößt, dann verrät er seine Krankheit deutlich durch die Freude und Lust, die ihm das Leid desselben bereitet.</p><p>Doch selbst solange es ihm gelingt, seine Leidenschaft zu verbergen, kommt sie durch Zeichen zum Vorschein, die sich seinem Antlitz einprägen. Die Todesanzeichen nämlich, welche wir bei Schwerkranken beobachten können, treten auch bei ihm auf, da er infolge des Neides hinzuwelken beginnt: starre Augen, die ausgetrocknet tief in den Höhlen liegen, Augenbrauen, die sich zusammenziehen, Knochen, die an Stelle des Fleisches hervorstechen. Und was hat die Erkrankung veranlaßt? Das Glück, das ein Bruder oder ein Verwandter oder ein Nachbar erlebt. Welch neue Art von Ungerechtigkeit liegt doch darin, daß man dem, dessen Glück einen ärgert, es zum Vorwurf anrechnet, daß er nicht unglücklich ist. Wohlgemerkt, nicht in einem Übel, das er etwa erfahren hätte, erblickt der Neidische ein ihm angetanes Unrecht, sondern einfach in dem Umstande, daß der Nächste, der ihm gar kein Leid zufügte, lediglich seine Wünsche erfüllt sieht. Man möchte ihm zurufen: Was ist dir zugestoßen, du Unglücklicher? Warum härmst du dich ab und schauest mit giftigem Blick auf das Glück deines Nachbarn? Kannst du Vorwürfe gegen ihn erheben, wenn er von schöner Körpergestalt ist, wenn ihn Beredsamkeit ziert, wenn er durch seine Abkunft hervorragt, wenn er ein Staatsamt erlangt und sich nun im Glanze seiner Würde sehen läßt, wenn er Geld in großer Fülle besitzt, wenn sein Wort wegen seiner Einsicht hoch in Ehren steht, wenn er wegen seiner Wohltätigkeit allgemeine Achtung genießt, wenn er stolz auf Kinder sein kann, wenn er an seiner Gattin Freude erlebt, wenn er wegen seiner reichen Einkünfte ein vornehmes Haus führt? Warum bohren denn diese Vorzüge deines Nächsten sich wie spitze Pfeile in dein Herz? Du schlägst die Hände zusammen und verschränkst die Finger, bist von beängstigenden Gedanken verfolgt und stoßest tiefe und schmerzliche Seufzer aus, vergällt ist dir der Genuß deiner Güter, unschmackhaft dein Tisch und trübselig dein Heim. Wird der Glückliche, den du beneidest, verleumdet, so bist du ganz Ohr; wenn er dagegen gelobt wird, so willst du kein Wort davon hören. Obwohl deine Seele in einem derartigen Zustande ist, warum verhüllst du durch Heuchelei ihre Krankheit? Wie kannst du dir die Maske der Freundschaft aufsetzen, indem du heuchlerisch großes Wohlwollen zur Schau trägst? Warum begrüßest du deinen Nächsten mit freundlichen Worten, als ob du nichts sehnlicher verlangtest als sein Glück und sein Wohlergehen, während du im tiefsten Herzen auf ihn das gerade Gegenteil herabwünschest? ― So machte es Kain, der da in Wut geriet wegen des Wohlgefallens, das sein Bruder Abel bei Gott gefunden: Der Neid, den er im Herzen hatte, trieb ihn zum Morde und Heuchelei leistete Beihilfe. Indem er sich nämlich den Anschein der Liebe und Freundlichkeit gab, gelang es ihm, den Bruder aus dem Bereich der Eltern, die dem Abel hätten beistehen können, fort auf das Feld zu führen; und jetzt riß er den Schleier weg, den er über den Neid gedeckt hatte.</p><p>Wer also eine so schlimme Krankheit aus dem Leben der Menschen beseitigt und sie, die doch dem nämlichen Geschlechte angehören, durch das Band des Friedens und des Wohlwollens aneinanderkettet und zu erquickender Eintracht veranlaßt, vollbringt dieser nicht ein Werk von wahrhaft göttlicher Kraft, indem er das Elend des Erdenlebens entfernt, dagegen Gütergemeinschaft einführt? Deshalb wird der Friedfertige Kind Gottes genannt, weil er den wahren Sohn Gottes nachahmt, der ebenfalls die genannten Gnaden dem Menschenleben erwies. Darum „selig die Friedfertigen; denn sie werden Kinder Gottes genannt werden.“</p><p>Wann sind wir nun friedfertig? Dann, wenn wir die Liebe Gottes zu den Menschen nachahmen, dann, wenn wir jenes Wirken, das Gott auszeichnet, zum Vorbild für unser eigenes Wirken wählen. Der Spender und Herr des Guten geht nun darauf aus, alles ganz und gar zu vernichten, was dem Guten widerstrebt oder fremd ist. Ein solches Vorgehen verlangt er daher auch von dir, daß du also ausrottest den Haß, beilegest den Krieg, vertreibest den Neid, entfernest den Zwist, beseitigest die Heuchelei, auslöschest die Rachsucht, auch wenn sie nur tief im Herzen glimmt, daß du hingegen in die Seele all die Tugenden einführest, die aufblühen, sobald ihr Gegenteil weggeschafft wird. Denn wie das Licht kommt, wenn die Finsternis weicht, so wird an Stelle der vorhin erwähnten Übel die Frucht des Geistes einziehen: Liebe, Freude, Friede, Rechtschaffenheit, Geduld, kurz, die ganze Reihe von Geistesgaben, die der Apostel aufzählt (Gal. 5, 22 f.). Wie sollte nicht seligzupreisen sein der Vermittler solch göttlicher Gaben, der Nachahmer des Gnadenspendens Gottes, der da durch Wohltun der unermeßlichen göttlichen Freigebigkeit gleichkommen möchte.</p><p>Vielleicht wird aber die Seligpreisung nicht bloß auf jene zu beziehen sein, welche den Mitmenschen Gutes erweisen, sondern den Namen eines Friedfertigen verdienen ganz besonders auch diejenigen, welche den im eigenen Innern tobenden Streit zwischen Fleisch und Geist und den mit unserer Natur gegebenen Zwiespalt zu friedlicher Ausgleichung führen, bei welcher das Gesetz des Fleisches, das dem Gesetze des Geistes widerspricht, nicht mehr in Kraft bleibt, sondern in Unterwerfung unter den besseren und höheren Herrn zum Vollzieher der göttlichen Gebote wird. Vielmehr richtig gesprochen: wir dürfen nicht meinen, das Wort Gottes vertrete die Ansicht, das Leben der Gerechten wachse aus zwei Wurzeln (Fleisch und Geist) hervor, sondern dadurch, daß die Scheidewand des Bösen in der Wohnung unseres Herzens niedergerissen wird, sollen sie, zu höherer Harmonie emporgehoben, zusammenwachsen und * eins* werden. Wenn nämlich Gott nach unserem Glauben einfach, ohne Zusammensetzung und gestaltlos ist, so soll auch der Mensch, falls er durch die anbefohlene Friedfertigkeit sich von der Zusammensetzung aus zwei Teilen (Prinzipien) erlösen und vollständig zum Guten zurückführen läßt, ebenfalls einfach, gestaltlos und eine wahre Einheit werden, in welcher das Äußere mit dem Innern und das Innere mit dem Äußeren sich vollkommen deckt; alsdann erst kommt die Seligpreisung und der Ehrentitel „Kind Gottes“ zur vollen Auswirkung, entsprechend der Verheißung unseres Herrn Jesus Christus, dem die Herrlichkeit und die Macht sei von Ewigkeit zu Ewigkeit. Amen.Achte Rede: „Selig sind, die um der Gerechtigkeit willen Verfolgung leiden; denn ihrer ist das Himmelreich.“</p><h2>8</h2><p>Die Ordnung, welche der Herr in seiner Unterweisung voll Weisheit und Erhabenheit eingehalten hat, führt uns zur achten Stufe und damit zu dem vorgesetzten Ausspruch; es dürfte aber am Platze sein, zuerst zu untersuchen, welches Geheimnis in der Oktave enthalten ist, die der Prophet in der Überschrift zweier Psalmen erwähnt (Ps. 6 u. 11 [Septuag. u. Vulgata] [hebr. Ps. 6 u. 12]), und welche Bedeutung dem Gebote der Reinigung und Beschneidung zukommt, welche das Gesetz auf den achten Tag verlegte. Vielleicht hat diese Zahl eine Beziehung zur achten Seligpreisung, welche gleichsam wie der Höhepunkt aller Seligpreisungen die letzte Sprosse der herrlichen geistigen Leiter einnimmt. Dort nämlich meint der Prophet mit dem Symbol der Oktave den Tag der Auferstehung; die Reinigung weist hin auf die Läuterung des befleckten Menschen und auf seine Rückkehr zum naturgemäßen Zustand, und die Beschneidung zeigt die Ablegung der Tierfelle an, welche der Mensch (im Paradiese) nach dem Sündenfall und nach Verwirkung des Lebens angezogen hatte. Unter diesem Gesichtspunkte verkündet die achte Seligpreisung, daß den Menschen wieder der Eintritt in den Himmel offen steht, nachdem sie zwar in Knechtschaft verfallen waren, nunmehr aber in Freiheit versetzt wurden.</p><p>Es heißt also: „Selig sind, die um der Gerechtigkeit willen Verfolgung leiden; denn ihrer ist das Himmelreich.“ Siehe, dies ist das Ende der Kämpfe für Gott, der Ehrenpreis für die Mühen, der Siegeslohn für den Schweiß, daß du für würdig erachtet wirst des Himmelreiches! Nicht mehr braucht dein Sehnen nach Glück auf Vergängliches und Wechselvolles umherirrend sich zu richten. Denn nur die Erde ist das Land der Veränderlichkeit und des Wechsels; unter allem aber, was am Himmel sich bewegt und zeigt, findest du nichts, das heute so und morgen anders wäre, sondern sämtliche Himmelskörper gehen in ununterbrochener Ordnung und Harmonie ihre vorgeschriebene Bahn. Siehst du dennoch die unvergleichliche Größe der Gabe, welche die Seligpreisung dir anbietet! Denn nicht in etwas Veränderlichem besteht ihr hoher Lohn, so daß dann die Furcht vor Wechsel die herrliche Hoffnung trüben könnte, sondern ihr klarer Hinweis auf das Reich der Himmel zeigt genugsam an, daß das Gnadengeschenk, das sie uns hoffen läßt, unveränderlich und ewig gleichbleibend ist.</p><p>Doch könnte die Seligpreisung nach zwei Seiten eine gewisse Verlegenheit bereiten; erstens: Warum stellt der Herr der Armut im Geiste und der Verfolgung um seinetwillen den gleichen Lohn in Aussicht, indem er beiden das Himmelreich verheißt? Setzt der gleiche Siegespreis denn nicht nach allgemeiner Erwartung die gleichen Kämpfe voraus? Zweitens: Warum gibt er beim Weltgericht, wenn er die Rechtsstehenden von den Linksstehenden trennt und zum Himmelreich zuläßt, etwas anderes als Verdienst an, das diese Auszeichnung ihnen einträgt? Denn dort gibt er als solches Barmherzigkeit, Freigebigkeit und Liebe zum Mitmenschen an, erwähnt dabei aber in keiner Weise weder die Armut noch die Verfolgung um seinetwillen. Und doch muß man die Verfolgung ihrem ganzen Begriffe nach von den anderen genannten Tugendübungen wohl unterscheiden! Denn was hat sie mit der Armut gemeinsam? Und worin berührt sie sich mit den Werken der Barmherzigkeit und der Nächstenliebe? Wenn nämlich jemand einen Dürftigen speist oder einen Nackten kleidet oder einen Fremden beherbergt oder einem Kranken oder Gefangenen nach Möglichkeit beisteht, wird bei Verrichtung dieser guten Werke wirklich etwas Ähnliches geleistet wie beim Ertragen von Armut und Verfolgung? Der Barmherzige kommt ja fremder Not zu Hilfe, die beiden anderen aber, der Arme sowohl wie der Verfolgte, bedürfen selbst der Hilfe, und doch ist das Endlos und der Lohn für alle drei gleich. Der Herr öffnet in gleicher Weise den Himmel sowohl den Armen im Geiste als auch den um seinetwillen Verfolgten und ebenso den Barmherzigen. Wie stellen wir uns hiezu? Wir meinen: alle diese Tugendübungen hängen auf das innigste zusammen und streben einmütig ein und demselben Ziele zu. Denn die Armut ist zur Ertragung von Verfolgung bereit, und die Liebe zur Armut ist gerüstet zur Ertragung von Gütereinziehung. Doch dürfte es passend sein, zuerst den vorliegenden Ausspruch zu untersuchen und dann erst wollen wir unsere Aufmerksamkeit wieder auf den eben berührten Zusammenhang und dessen richtige Auffassung lenken.</p><p>„Selig, die um der Gerechtigkeit wegen verfolgt werden.“ Welches ist der Beweggrund zur Verfolgung und von wem geht sie aus? Der Gang der Untersuchung führt uns also hinab in die Arena der Märtyrer und auf den Kampfplatz des Glaubens. Denn Verfolgung ruft die Vorstellung vom Wettläufer hervor, der sich bemüht, möglichst schnell zu laufen, oder richtiger, der den Sieg im Wettlauf erringt; denn man kann im Wettrennen nur siegen, wenn man den Nebenbuhler überholt. Die Gläubigen, welche um den Siegespreis der Seligkeit laufen, haben die anderen Mitkämpfer, welche erlahmen, im Rücken, diejenigen aber, welche um den Siegespreis in der vom Feinde betriebenen Verfolgung laufen, den Verfolger ― letzteres gilt von den Märtyrern, welche in den Glaubenskämpfen verfolgt, aber nicht eingeholt wurden und so die Laufbahn der Blutzeugenschaft glücklich vollendeten. Demnach ist im letzten Ausspruch das hohe Gut, das uns die Seligpreisung hoffen läßt, als Siegeskranz uns vorgelegt. Denn beseligend ist es, um des Herrn willen verfolgt zu werden. Warum? Weil die Verfolgung durch den Schlechten das Mittel wird zur Erlangung des Guten; denn mit der Feindschaft des Schlechten beginnt die Freundschaft mit dem Guten. Das Gute aber und zwar das höchste, das es gibt, ist der Herr, und dieser ist das Ziel, dem der Wettlauf des Verfolgten gilt. Selig ist wahrhaftig, dem sogar der Feind zum Guten verhelfen muß. Denn da das menschliche Leben auf der Grenzscheide zwischen Schlecht und Gut liegt, so wird einerseits, wer sich von der schönen und erhabenen Hoffnung abbringen läßt, in den Abgrund geraten, andererseits wird, wer von der Sünde sich zurückgezogen und vom Verderben sich entfernt hat, teilnehmen an der Gerechtigkeit und Unveränderlichkeit. Die Verfolgung, welche die Tyrannen gegen den Märtyrer bewerkstelligen, bringt daher fürs erste und äußerlich betrachtet nur Schmerz, zum Schlusse jedoch eine Seligkeit, die alle Begriffe übersteigt.</p><p>Vorteilhafter aber dürfte es sein, den Sinn des Gotteswortes an Beispielen zum Verständnis zu bringen. So ist nach allgemeinem Urteil Erdulden von Feindseligkeit doch viel bedauernswerter als der Empfang von Liebeserweisen; und dennoch verschafft Unglück, so schmerzlich es auch empfunden wird, nicht wenig Glück sogar schon in diesem Leben, wie die Schrift von Joseph, der von seinen Brüdern verfolgt und gerichtet wurde, ausführlich bezeugt, daß er gerade dadurch, daß sie ihn in die Sklaverei verkauften, zur Würde eines Königs gelangte, der auch als Gebieter seinen ehemaligen Feinden Befehle geben konnte, während er wohl niemals zu einer solch hohen Stellung gekommen wäre, wenn ihm nicht der Neid durch jene Verfolgungen den Weg zum Königsthron geebnet hätte. Wie nun ein über die Zukunft unterrichteter Prophet, der dem Joseph das große Glück vorausgesagt hätte, das ihm durch die neidische Nachstellung zuteil wurde, im Hinblick auf den Schmerz des Augenblickes schwerlich Glauben gefunden hätte, ― wie sollte man bei einem schlechten Anfang ein gutes Ende erwarten ― so wird auch hier bei der Verfolgung der Gläubigen durch die Tyrannen, weil sie so bittere Pein verursacht, ein etwas fleischlich Gesinnter sich schwer zu der Meinung emporschwingen, so schmerzliches Leid gebe Anlaß, auf Seligkeit zu hoffen; der Herr nun, der die Gebrechlichkeit unserer Natur kennt, kündigt den allzu Schwachen im voraus an, welch herrlichen Ausgang der Kampf nehmen werde, damit sie, durch die Hoffnung auf das Himmelreich gestärkt, den Sieg über alle Schmerzempfindungen erringen. Darum freute sich der große Stephanus, als die tobende Menge ihn umringte, und empfing die schweren Tropfen des dichten Steinregens wie einen angenehmen Tau und vergalt seinen Mördern mit Segenswünschen, indem er betete, es möge ihnen die Sünde nicht angerechnet werden ― alles deshalb, weil er sowohl jene selige Verheißung vernommen hatte als auch mit eigenen Augen sah, wie seine Hoffnung mit der Wirklichkeit übereinstimmte. Denn nachdem er schon vorher belehrt worden war, daß die um des Herrn willen Verfolgten in das Himmelreich aufgenommen würden, sah er noch während der Verfolgung die Herrlichkeit wirklich, die er sich erwartete. Denn als er noch im Wettlauf wegen des Bekenntnisses begriffen war, erschien ihm seine ganze Hoffnung: der Himmel öffnete sich und die göttliche Majestät neigte sich von den höheren Regionen herab zur Arena, in der der Märtyrer stritt; ja derjenige zeigte sich selbst als Helfer seinem Auge, für den der Wettkämpfer ringend Zeugnis ablegte. Der Kampfrichter hat nämlich dadurch, daß er stehend erschien, sinnbildlich seine Hilfsbereitschaft für den Kämpfer geoffenbart, zum klaren Zeichen, daß der Herr den Seinigen die Kämpfe nicht nur auferlegt, sondern daß er ihnen in ihrem Wettkampfe gegen die Feinde beisteht. Was wäre also beseligender als um des Herrn willen Verfolgungen zu leiden, da wir das Glück haben, daß uns der Kampfrichter auch als Mitkämpfer zur Seite steht?</p><p>Schwer, um nicht zu sagen unmöglich ist es, daß man das unsichtbare Gut den sichtbaren Freuden und Gütern dieses Lebens vorzieht und den Entschluß faßt, von seinem Hause zu scheiden, Weib und Kinder, Eltern und Geschwister, Jugendfreunde und alle Annehmlichkeiten dieses Lebens zu verlassen, wenn nicht der Herr selbst den von ihm Erwählten und Berufenen beistünde, damit sie jenes Gut erlangen. Denn der Apostel sagt: „Wen er im voraus erkennt, den bestimmt er vorher, beruft, rechtfertigt und verherrlicht ihn“ (Röm. 8, 29). Da nun die Seele durch die Organe des Körpers mit den Annehmlichkeiten des Lebens gleichsam verwachsen ist, z. B. durch das Auge an der Schönheit der Malerei sich ergötzt und durch das Ohr nach Wohlklang sich sehnt, desgleichen durch den Geruch, den Geschmack und das Gefühl auf eine diesen Sinnen entsprechende Weise Freude einatmet, so ist die Seele durch die Macht der Sinne wie mit einem Nagel an die Lebenslust geheftet und gebunden und läßt sich von ihr infolgedessen, weil sie fast zu ihrer Natur gehören, nur schwer losreißen und wird, weil sie nun einmal darin den Schildkröten und Schnecken ähnlich wie in (aus Ber.: „in“ einfügen) eine Schalenhülle eingenistet ist, nicht leicht zum Entschluß der Lossagung gebracht, weil das Leben mit Allgewalt sie festhält. Wegen dieses ihres Zustandes läßt sich die Seele demgemäß von den Verfolgern (nicht) (aus Ber.: „nicht“ ist zu streichen) leicht einnehmen und deren Wünschen rasch gefügig machen, wenn sie mit Vermögenseinziehung oder mit dem Verluste eines anderen geschätzten Erdengutes drohen. Wenn aber das lebendige Gotteswort, das nach dem Apostel schärfer und kräftiger ist als jedes zweischneidige Schwert (Hebr. 4, 12), in den wahrhaft Gläubigen eindringt und die schlimmen Verwachsungen (der Seele) mit der Weltlust und die Bande der Gewohnheit durchschneidet und zerhaut, so kann er, nachdem er die Erdenfreuden als eine seiner Seele aufgeladene Last wie ein Wettläufer entschlossen von seinen Schultern weggeworfen hat, leicht und unbeschwert durch die Kampfarena eilen, und beim Laufe steht ihm mit Macht zur Seite der Kampfesordner selbst.</p><p>Denn er überlegt nicht, wieviel er verlassen hat, sondern wieviel er empfangen wird. Sein Auge richtet er nicht auf das Angenehme, das er hinter sich ließ, sondern auf das hohe Gut, das vor ihm liegt; auch schmerzt ihn nicht der Verlust des Irdischen, sondern er frohlockt über den Gewinn des Himmlischen. Deshalb begrüßt er jede Strafe, die über ihn verhängt wird, als Mittel und Hilfe, um die verheißene Freude zu erreichen: das Feuer, weil es die Materie läutert, das Schwert, damit es die Verbindung des Geistes mit Fleisch und Welt trennt, überhaupt jede Art von Trübsal und Pein nimmt er bereitwillig an, weil er darin ein Arzneimittel erblickt gegen das Sündengift, das die Sinnenlust enthält. Denn wie die Kranken, welche an unreinen Säften und an Galle leiden, selbst bittere Medizin schlucken, um die Krankheitskeime wegzuspülen, so ist der Gläubige, der, vom Feinde bedrängt, zu Gott eilt, bereit, den Leidensansturm hinzunehmen als ein Mittel, um die Macht der Lust zu brechen; denn wer von Schmerz gepeinigt wird, kann sich nicht der Lust hingeben. Da nun die Sünde durch die Lust eintrat, so wird sie notwendig durch das Gegenteil wieder vertrieben. Wenn also die Tyrannen die Gläubigen wegen ihres Bekenntnisses zum Herrn verfolgen, und unerträgliche Martern ersinnen, so bereiten sie durch die Schmerzen eine Seelenarznei, weil sie gerade durch die Leiden, die sie ihnen zufügen, die Krankheit heilen, welche aus der Lust geboren wird. So nimmt Paulus das Kreuz an, Jakobus das Schwert, Stephanus die Steinigung, der selige Petrus die Kreuzigung mit dem Kopfe nach unten, alle späteren Glaubenskämpfer die mannigfaltigsten Strafarten wie wilde Tiere, Abgründe, Scheiterhaufen, Erfrieren, Abreißen des Fleisches von den Rippen, Eindrücken des Hauptes, Ausstechen der Augen, Abhauen der Finger, Auseinanderreißen des ganzen Körpers von den Schenkeln aus, Hungertod ― all diese und ähnliche Qualen ließen die Heiligen mit Freude über sich ergehen als Reinigungsmittel, damit im Herzen keine Spur von Sünde zurückbliebe, die durch Lust in die Seele dringt, indem sie hofften, daß durch die große und grimmige Schmerzempfindung alle Wunden ganz geheilt würden, welche die Lust etwa der Seele geschlagen hatte. „Selig also, die Verfolgung leiden um meinetwillen.“</p><p>Das ist aber ― um auch die andere Seite des Ausspruches in Erwägung zu ziehen ― wie wenn die Gesundheit die Fähigkeit der Rede erhielte und also spräche: „Selig, wer um meinetwillen von der Krankheit befreit wird; denn die Ertragung der Schmerzen bewirkt, daß die ehemals Kranken Anteil an mir haben.“ So wollen wir auf den Ausspruch hören, als ob uns das Leben selbst diese Seligpreisung zuriefe: „Selig, die vom Tod verfolgt werden meinetwegen“ oder wie wenn das Licht spräche: „Selig, die von der Finsternis verfolgt werden meinetwegen.“ Ähnliches gilt von der Gerechtigkeit, der Heiligkeit, der Unvergänglichkeit, der Güte, und so von jeder Eigenschaft, die zum Begriff des Guten gehört und gerechnet wird. Im Hinblick auf jede der genannten hervorragenden Eigenschaften sagt dir ― dies darfst und sollst du annehmen ― der Herr gleichsam: „Selig, wer von dem geraden Gegenteil derselben verfolgt wird und von ihm sich entfernt wie von der Vergänglichkeit, Finsternis, Sünde, Ungerechtigkeit, Habgier und von allem Schlimmen, das im Gegensatz zur Tugend steht, wie sie sich sowohl in Werken wie in Gedanken zeigt.“ Wer nämlich aus dem Umkreis des Bösen scheidet, tritt in den des Guten ein.</p><p>So spricht ja der Herr: „Wer Sünde tut, macht sich zum Knecht der Sünde“ (Joh. 8, 34). Wer also die Sklaverei aufgibt, in der er bisher schmachtete, erlangt die Würde eines Freien. Der wesentlichste Vorzug des Freien besteht jedoch darin, daß er sein eigener Herr ist; eine höhere Herrschaft gibt es aber nicht als die des Königs. Wenn nun der aus der Sündenknechtschaft Entronnene sein eigener Herr ist, die hauptsächlichste Auszeichnung der Königswürde darin besteht, daß man selbst Gesetze vorschreibt, von niemandem aber Gesetze empfängt, so ist folgerichtig seligzupreisen, wer von der Ungerechtigkeit verfolgt wird, weil er durch eine solche Verfolgung zur Königswürde emporsteigt. Laßt uns also, o Brüder, kein Bedauern haben, wenn wir von dem Irdischen vertrieben werden; denn eine derartige Vertreibung führt uns hinauf in die himmlische Königsburg, daß wir dort unsere Wohnung bekommen. Denn das sind die zwei Regionen, welche bei der Schöpfung der vernunftbegabten Geschöpfe zum Aufenthalt bestimmt wurden: die Erde und der Himmel. Die Erde ist der Ort jener Wesen, denen das Leben im Fleische eignet, der Himmel ist aber der Ort für die Körperlosen. An einem dieser zwei Orte müssen wir notwendig leben; werden wir nun von der Erde nicht verfolgt und vertrieben, so müssen wir auf Erden bleiben; wenn wir dagegen von hier scheiden müssen, so werden wir in den Himmel versetzt. Du siehst also, wohin die Seligpreisung uns geleitet, weil sie uns durch scheinbare Trübsal zu einem solch hohen Gut verhilft. Dies hat offenbar auch der Apostel im Auge, wenn er sagt: „Jede Züchtigung scheint für den Augenblick keine Freude zu sein, sondern Trübsal; nachher bringt sie allen, die darin geübt werden, die Friedensfrucht der Gerechtigkeit“ (Hebr. 12, 11). Die Trübsal ist also die Blüte, die zu so herrlicher Frucht sich entwickelt; darum müssen wir um dieser Frucht willen auch die Blüte pflücken.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Acht Homilien über die acht Seligkeiten</em> (BKV 1. Reihe, Bd. 56, Kempten/München 1927). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3161/versions/acht-homilien-uber-die-acht-seligkeiten-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "0Tjh_Послание_о_жизни_преподобной_Макрины"
    path: "Gregor_Nyssa_Makrina_Leben"
    title: "Lebensbeschreibung seiner Schwester Makrina"
    menu: { parent: "Werke", title: "Lebensbeschreibung seiner Schwester Makrina", priority: 5 }
    update: true
    body: |-
      <p><em>Lebensbeschreibung seiner Schwester Makrina, übersetzt von Übersetzung der BKV-Ausgabe (BKV 1. Reihe, Bd. 56, Kempten/München 1927).</em></p><p>Dieses Büchlein scheint, wie die Form der Überschrift ergibt, seiner Art nach ein Brief zu sein, sein Umfang geht aber über die herkömmlichen Grenzen eines Briefes hinaus und erweitert sich zu einer ausführlichen Erzählung. Jedoch rechtfertigt uns der Stoff, um dessentwillen du mich zum Schreiben ermuntert hast und der das für einen einfachen Brief passende Maß überschreitet. Sicherlich erinnerst du dich noch unseres Beisammenseins, als ich, einem Gelübde entsprechend, nach Jerusalem pilgern wollte, um die Denkmale des Wandels unseres Herrn im Fleische an Ort und Stelle zu besichtigen, und mit dir in Antiochien zusammentraf, und gedenkst auch noch der dabei von uns geführten mannigfachen Gespräche; es wäre ja nicht recht gewesen, die Zusammenkunft still abzumachen, da deine Einsicht reichlichen Stoff zur Unterhaltung bot.</p><p>Wie es aber in solchen Fällen oftmals zu gehen pflegt, so kam unsere Unterhaltung in ihrem Verlauf auf das Andenken eines hochberühmten Lebens. Ein Weib bildete den Stoff des Gesprächs, so es überhaupt ein Weib war. Ich weiß nämlich nicht, ob es sich ziemt, sie nach ihrer Natur zu benennen, da sie über ihre Natur erhaben war. Unser Gespräch stützte sich aber nicht auf Gespräche, die wir von andern gehört hatten, sondern wir haben davon ausführlich gesprochen, was die eigene Erfahrung uns gelehrt hatte, ohne uns auf das, was andere erfahren, stützen zu müssen. Denn die erwähnte Jungfrau ist unserer Familie keineswegs fremd, so daß wir nötig gehabt hätten, von andern ihr wunderbares Leben zu erfahren, sondern sie stammte von denselben Eltern wie wir, und ist sozusagen als heilige Erstlingsfrucht zuerst dem mütterlichen Schoße entsprossen. Weil du nun gemeint hast, daß die Beschreibung des Lebens guter Menschen einigen Gewinn bringe, so glaubte ich, damit nicht ein solches Leben der kommenden Zeit verborgen bliebe und sie, die sich durch wahre Lebensweisheit zur höchsten Grenze menschlicher Tugend erhoben hatte, ohne Nutzen für andere, in Stillschweigen gehüllt, vorüberginge, gut zu tun, wenn ich dir nachgebe und so kurz als möglich ihr Leben in schmuckloser und einfacher Erzählung beschreibe.</p><p><em>Makrina</em> hieß die Jungfrau; einem altberühmten Geschlechte gehörte aber Makrina, die Mutter unseres Vaters, an, die sich zur Zeit der Verfolgungen durch ihr Bekenntnis für Christus hervorgetan hatte und nach der das Kind von den Eltern benannt wurde. Das war jedoch nur ihr offenkundiger Name, mit dem sie von den Bekannten genannt wurde; im geheimen war ihr noch ein anderer beigelegt worden, den sie, bevor sie unter den Wehen das Licht der Welt erblickte, auf Grund einer Erscheinung erhalten hatte. Denn auch ihre Mutter war so tugendhaft, daß sie sich überall vom göttlichen Willen leiten ließ und besonders einen reinen, unbefleckten Lebenswandel liebte, so daß sie sich auch für die Ehe nicht freiwillig entschlossen hatte. Aber da sie eine Doppelwaise war, in überaus herrlicher Jugendschönheit erblühte und der Ruf ihrer schönen Gestalt viele Bewerber um sie scharte und für sie Gefahr vorhanden war, wenn sie nicht freiwillig mit einem sich verlobte, gegen ihren Willen einen Frevel erleiden zu müssen, indem die, welche für ihre Schönheit rasend schwärmten, entschlossen waren, sie zu entführen, ― deswegen wählte sie sich einen ob seines ehrenhaften Lebens bekannten und bewährten Mann, um einen Beschützer ihres Lebens zu erhalten, und wurde dann gleich bei ihrer ersten Geburt Mutter von dieser. Und da die Zeit kam, wo die Wehen durch die Geburt ein Ende nehmen sollten, verfiel sie in einen Schlaf und da träumte ihr, sie trüge schon in Händen, was noch im Schoße ruhte, und eine Erscheinung von übermenschlich herrlicher Gestalt und Schönheit redete das Kind, welches sie trug, mit dem Namen Thekla an, jener Thekla, die unter den Jungfrauen so gefeiert ist. Und nachdem die Erscheinung dies getan und dreimal wiederholt hatte, sei sie wieder verschwunden und habe ihr eine leichte Geburt verschafft, so daß sie zugleich mit dem Erwachen das im Traum Geschaute leibhaftig vor sich sah. Das war also ihr geheimer Name. Ich glaube aber, daß die Erscheinung mit jenem Ausruf nicht so sehr die Gebärende zur Benennung mit dem rechten Namen anleiten, sondern damit das Leben des Kindes voraussagen und durch den gleichen Namen auf die Gleichheit der Gesinnung hinweisen wollte.</p><p>[Forts. v. ] Das Kind wurde nun aufgezogen. Obwohl es seine besondere Wärterin hatte, wartete ihm doch meistens die Mutter mit eigenen Händen ab. Als es dann das erste Kindesalter überschritten hatte, übte es sich in Erlernung des elementaren Unterrichtsstoffes. Und was das Mädchen nach dem Urteil der Eltern lernen mußte, darin zeichnete sich seine Begabung aus. Die Mutter war aber bestrebt, das Mädchen auszubilden, jedoch nicht nach dieser weltlichen und enzyklischen Bildung, bei der die jüngsten Altersklassen der Zöglinge zumeist mit Hilfe der Dichterwerke unterwiesen werden. Denn sie hielt es für schimpflich und gänzlich ungeziemend, mit den Schreckensszenen der Tragödie, für welche oft das Leben der Frauen den dichterischen Ausgangspunkt und Stoff abgibt, oder mit den Unanständigkeiten der Komödie die zarte und empfängliche Natur zu belehren, da sie durch die gar schamlosen Weibergeschichten gewissermaßen beschmutzt worden wäre. Vielmehr dienten die Teile der gotterleuchteten Schrift, welche für die erste Jugendzeit faßlicher erscheinen, dem Kind als Unterrichtsstoff, zumeist die Weisheit Salomos und auch von dieser vor allem das, was sich auf unser sittliches Leben bezieht. Auch das Psalmenbuch blieb ihr durchaus nicht unbekannt, indem sie zu gewissen Zeiten immer einen Teil davon durchging: wenn sie vom Lager aufstand und die Arbeit begann und wieder davon ausruhte, wenn sie die Mahlzeit einnahm und vom Tisch sich erhob, zu Bett ging und zum Gebet aufstand, überall hatte sie den Psalter bei sich wie einen lieben Gefährten, der sie zu keiner Zeit verließ.</p><p>Bei solchen und ähnlichen Beschäftigungen wuchs sie heran, erwarb sich in der Zubereitung der Wolle noch eine besondere Geschicklichkeit und kam so ins zwölfte Jahr, wo in der Regel sich die Blüte der Jugendzeit zu entfalten beginnt. Da war es nun auffallend, wie die Schönheit des Mädchens auch in seiner Verborgenheit nicht geheim blieb. In ihrem ganzen Heimatland fand sich kein solches Wunder von Schönheit und Wohlgestalt, das den Vergleich mit ihr hätte aushalten können, so daß auch Malerhände ihre Anmut nicht erreichen konnten, vielmehr diese Kunst, die alles versucht und sich an das Größte wagt, ja selbst von den Elementen nachahmende Bilder fertigt, ihre auserlesene Gestalt nicht genau wiederzugeben vermochte. Deswegen umlagerte ihre Eltern ein ganzer Schwarm von Freiern, die um ihre Hand anhielten. Der Vater zog aber, denn er war verständig und darauf bedacht, nach Recht zu entscheiden, einen geachteten, wegen seines Charakters bekannten Jüngling aus guter Familie, der eben von seinem Studium zurückkehrte, den übrigen vor und beschloß, ihm das Mädchen zu verheiraten, wenn es zu seinem Alter gekommen wäre. Unterdessen weckte dieser die schönsten Hoffnungen und bot dem Vater des Mädchens den Ruhm seiner Beredsamkeit wie ein willkommenes Brautgeschenk dar, indem er in Prozessen für die bedrückte Unschuld die Macht seiner Rede betätigte. Der Neid des Schicksals aber zerstörte die herrlichsten Hoffnungen und raffte ihn in bedauernswerter Jugend aus dem Leben weg.</p><p>Das Mädchen kannte das Vorhaben des Vaters wohl. Aber nachdem durch den Tod des Jünglings das, was für sie bestimmt war, zunichte geworden, nannte sie die Entscheidung des Vaters Ehe, wie wenn die Entscheidung zur Wirklichkeit geworden wäre, und beschloß, von nun ab für sich zu bleiben. Und dieser Entschluß war stärker als ihr Alter. Denn da ihre Eltern ihr oftmals Vorschläge wegen der Hochzeit machten, weil es viele gab, die um sie wegen ihrer gefeierten Schönheit freien wollten, erklärte sie es für widersinnig und unerlaubt, nicht den ihr einmal vom Vater bestimmten Gatten zu lieben, sondern genötigt zu werden, sich nach einem weiteren umzusehen, während es doch in der Natur nur eine Ehe gäbe, wie auch nur eine Geburt und einen Tod. Und sie bestand darauf, daß derjenige, der ihr nach dem Willen der Eltern anverlobt war, nicht gestorben sei, sondern ihrer Überzeugung nach wegen der Hoffnung auf die Auferstehung bei Gott lebe und so bloß in einem fremden Lande weile, aber nicht tot sei. Es sei unziemlich, dem abwesenden Bräutigam nicht die Treue zu bewahren. Mit solchen Reden wies sie die zurück, welche sie zu überreden versuchten, und sie sah ein sicheres Schutzmittel für ihren edlen Entschluß darin, daß sie sich niemals von ihrer Mutter auch nur für kurze Zeit trennte. Daher sagte oftmals die Mutter zu ihr, die übrigen Kinder hätte sie eine bestimmte Zeit lang im Schoß getragen, sie aber trage sie gewissermaßen allzeit und überall mit sich herum. Aber dieses Zusammenleben mit der Tochter war für die Mutter nicht mühsam noch auch ohne Vorteil, denn die Pflege der Tochter ersetzte ihr viele Dienerinnen und zwischen beiden fand ein guter, sich gegenseitig ergänzender Austausch statt. Die eine pflegte nämlich die Seele des Mädchens, die andere aber den Leib der Mutter, indem sie nicht bloß sonst alle erforderlichen Dienste leistete, sondern auch damit, daß sie oftmals der Mutter eigenhändig das Brot bereitete. Das betrachtete sie jedoch nicht als ihre Hauptbeschäftigung. Vielmehr hielt sie erst dann, wenn sie ihre Hände durch religiöse Dinge gesalbt hatte, für passend, den Geschäften des Lebens nachzugehen, und verschaffte der Mutter mit ihrer häuslichen Arbeit reichlichen Unterhalt. Und nicht bloß das, sondern überhaupt alle auf ihr ruhende Sorge teilte sie zugleich mit ihr; denn sie war Mutter von vier Söhnen und fünf Töchtern und mußte an drei Fürsten Abgaben entrichten, weil ihr Besitztum unter so vielen Völkerschaften zerstreut lag.</p><p>Weil nun die Mutter darob von mannigfachen Sorgen in Anspruch genommen war, der Vater war nämlich schon aus dem Leben geschieden, trug sie in alledem gemeinschaftlich mit der Mutter die Mühen, indem sie mit ihr die Sorgen teilte und ihr die Last der Leiden erleichterte. So bewahrte sie sich unter der Führung der Mutter ein untadeliges Leben, das unter den Augen der Mutter immerdar gelenkt und überprüft wurde. Zugleich aber gab sie der Mutter durch ihr eigenes Leben eine gute Anleitung zum gleichen Ziel, nämlich zur Lebensweisheit, indem sie dieselbe allmählich zu einem dem Irdischen abgewendeten, vollkommenen Leben nach sich zog. Und nachdem die Mutter die anständige Versorgung der Schwestern in Übereinstimmung mit ihren Wünschen geordnet hatte, kehrte inzwischen von den Bildungsanstalten, wo er lange Zeit den Studien nachgegangen war, der große Basilius, der Bruder der Vorgenannten, zurück. Sie nahm nun ihn, der von Wissensdünkel mächtig aufgeblasen war, alle Autoritäten verachtete und in seinem Hochmut sich selbst über erlauchte Machthaber erhaben dünkte, und gewann auch ihn so schnell für das Ideal der Lebensweisheit, daß er auf weltliche Ehre verzichtete, den Ruhm der Redekunst verachtete und sich diesem tätigen, die Handarbeit übenden Leben zuwandte, indem er sich durch völlige Besitzlosigkeit von den Hindernissen für das Tugendleben frei machte. Aber sein Leben und seine nachherige Wirksamkeit, durch die er sich in der ganzen Welt einen Namen machte und an Ruhm alle, die durch Tugend hervorleuchteten, in Schatten stellte, erforderte eine ausführlichere Darstellung und viele Zeit. Ich will in meiner Erzählung wieder zu dem mir vorliegenden Gegenstand zurückkehren.</p><p>[Forts. v. ] Nachdem sie sich nämlich nunmehr aller Voraussetzungen für ein mehr irdisches Leben entledigt hatte, überredete sie die Mutter, das bisher geübte Leben mit der ziemlich prunkhaften Art und der gewohnten Verpflegung durch Dienerinnen aufzugeben, der Gesinnung nach den einfachen Leuten gleich zu werden und ihr Leben in enger Verbindung mit dem der Jungfrauen zu verbringen, nachdem sie aus den vielen Sklavinnen und Leibeigenen, welche sie besaß, Schwestern und Genossinnen gemacht hatte. Doch ich will die Erzählung lieber ein wenig unterbrechen und jenes Ereignis nicht unerwähnt übergehen, welches die ideale Gesinnung der Jungfrau noch mehr verrät.</p><p>Unter den vier Brüdern war der zweite nach dem großen Basilius Naukratius, der sich durch glückliche Naturanlage, körperliche Schönheit, Kraft, Behendigkeit und Geschick in allen Dingen auszeichnete. Dieser gab mit zweiundzwanzig Jahren in öffentlichem Auftreten von seinen Studien solche Beweise, daß die ganze Zuhörerschaft durch ihn in gewaltige Erregung kam. Trotzdem gab er in einer Art göttlicher Vorsehung alles, was er in Händen hatte, preis und wandte sich in gar hohem Geistesflug dem einsamen und besitzlosen Leben zu, ohne etwas außer sich selbst mit sich zu führen. Dabei folgte ihm auch einer seiner Diener, namens Chrysaphius, weil dieser in trautem Verhältnis zu ihm stand und zugleich demselben Lebensberuf nachstrebte. Er lebte also für sich an einem entlegenen Orte, den er am Iris vorgefunden hatte. ― Der Iris ist aber ein Fluß, der mitten durch Pontus fließt. Er entspringt in Armenien, fließt durch unsere Heimat und mündet im Schwarzen Meer. ― In dessen Nähe fand der Jüngling einen Platz, mit tiefem Wald bewachsen und mit einem durch einen überragenden Bergrücken verdeckten Hügel und verweilte nun daselbst, indem er den Lärm der Stadt und die Unruhe des Soldatenlebens und des Advokatenberufes weit von sich ließ. Und nachdem er sich von allem, was auf Erden das menschliche Leben umbraust, freigemacht hatte, verpflegte er eigenhändig einige Greise, die in Armut und Gebrechlichkeit mit ihm lebten, da er es für sein Leben für angemessen erachtete, solche Arbeit zu besorgen. Jagend also (fing der Edelgeborene Fische, und) da er in jeder Art des Jagdwesens geschickt war, verschaffte er solchen, die das liebten, Nahrung und hielt mit derartigen Anstrengungen zugleich seine Jugend im Zaum. Aber auch den Wünschen der Mutter stand er, wenn sie ihm einmal etwas auftrug, bereitwillig zu Diensten und gab so durch beide Dinge seinem Leben die rechte Richtung, indem er nicht nur durch die Anstrengungen seine Jugend beherrschte, sondern auch durch seine Sorge um die Mutter in Beobachtung der göttlichen Gebote den rechten Weg zu Gott wandelte. Es war schon das fünfte Jahr, daß er also der Weisheit nachging und durch sein Leben die Mutter beglückte, weil er einerseits durch Besonnenheit sein Leben zierte, anderseits all seine Kraft dem Willen der Mutter unterordnete. Da traf die Mutter, wie ich meine, durch Nachstellung des Widersachers ein schweres, erschütterndes Leid, das die ganze Familie mit Unglück und Schmerz erfüllte. Denn er wurde plötzlich dem Leben entrissen, ohne daß eine vorausgehende Krankheit das Unglück hätte ahnen lassen oder daß sonst irgendeiner der gewöhnlichen und bekannten Umstände den Tod des Jünglings verursacht hätte. Vielmehr war er zum Jagen fortgegangen, womit er den von ihm unterhaltenen Greisen die nötige Nahrung verschaffte, und wurde nun tot in seine Behausung zurückgebracht, er selbst mit seinem Gefährten Chrysaphius. Die Mutter aber weilte abseits, drei Tagreisen weit vom Unglücksort entfernt. Und es kam einer, ihr das Unglück zu melden. Sie war zwar vollkommen in aller Tugend, aber da gewann auch bei ihr begreiflicherweise die Natur die Oberhand. Mit gebrochenem Herzen ward sie nämlich sofort ohnmächtig und sprachlos, indem ihr Geist vom Leide erdrückt wurde und unter dem Ansturm der schlimmen Botschaft lag sie da, wie ein durch einen unerwarteten Schlag zu Boden geworfener edler Held.</p><p>Bei diesem Unglück ward der Starkmut der großen Makrina kund: mit ihrem Geiste sich dem Leid entgegenstemmend, zeigte sie sich nämlich ungebrochen und ward zugleich der Schwachheit der Mutter zur Stütze und richtete sie aus der Tiefe ihres Schmerzes wieder auf, indem sie durch ihre eigene Festigkeit und Standhaftigkeit auch die Seele der Mutter zur Mannhaftigkeit erzog. So wurde die Mutter vom Schmerz nicht jäh fortgerissen, noch ließ sie etwas Unedles und Weibisches über sich kommen, so daß sie zum Unglück geschrieen oder ihr Kleid zerrissen oder im Leid geheult oder mit jämmerlichen Tönen die Totenklage angestimmt hätte; vielmehr hielt sie ihn in ruhiger Gelassenheit aus, indem sie mit besonnenen Erwägungen die Anfechtungen des natürlichen Gefühls abwehrte, sowohl mit den eigenen Erwägungen als auch mit denen, welche die Tochter ihr darbot, um das Leid zu heilen. Damals trat nämlich die erhabene und hochgesinnte Seele der Jungfrau ganz besonders zutage. Denn auch ihre Natur litt eigentlich mit. War es doch ihr Bruder und zwar ihr Lieblingsbruder, der ihr auf solche Weise durch den Tod entrissen worden war. Trotzdem überwand sie ihre Natur und richtete zugleich mit ihren Tröstungen die Mutter auf und half ihr das Leid überwinden, indem sie dieselbe durch ihr Beispiel zu standhaftem und männlichem Starkmut anhielt. Außerdem ließ auch ihr allzeit erhabenes Tugendleben der Mutter keine Gelegenheit, sich eher über den Verlust aufzugrämen als sich am gegenwärtigen Glück freudig aufzurichten.</p><p>Als nun für die Mutter die Sorge der Kinderernährung und die Mühewaltung mit der Erziehung und Unterbringung der Kinder ein Ende hatte und die meisten Gelegenheiten zum mehr erdenhaften Leben auf die Kinder verteilt waren, da veranlaßte, wie schon erzählt, das Leben der Tochter die Mutter zu solcher beschaulichen und dem Irdischen abgewandten Lebensführung. Und nachdem sie dieselbe bewogen hatte, allen gewohnten Umgang aufzugeben, leitete sie dieselbe zum eigenen Streben nach der Demut an, indem sie dieselbe dahin brachte, selber der Gesamtheit der Jungfrauen gleichförmig zu werden, so daß sie den Tisch, das Lager und alles, was zum Leben gehörte, in gleicher Weise mit ihnen allen teilte, wobei aller Rangunterschied in ihrem Leben aufgehoben war. Und so vortrefflich war ihre Lebensordnung und so hoch ging ihre Lebensweisheit und die ernste Lebensführung bei Tag und Nacht, daß man es mit Worten nicht beschreiben kann. Denn wie die durch den Tod vom Leibe befreiten Seelen damit auch von den Sorgen dieses Lebens miterlöst sind, so war ihr Leben von aller irdischen Eitelkeit getrennt und geschieden und ward zur Nachahmung des Lebens der Engel hingeleitet. Denn wo man keinen Zorn, keinen Neid, keinen Haß, keine Überhebung noch sonstiges dieser Art bemerkte und wo kein Streben nach Eitlem, weil Ehre und Ruhm, Stolz und Überhebung und alles Derartige verbrannt war, wo Enthaltsamkeit als Selbstverständlichkeit und Unbekanntheit als Ruhm, Besitzlosigkeit als Reichtum galt und man allen irdischen Überfluß wie Staub vom Leibe abstreifte, wo weiter die Beschäftigung mit dem, was man in diesem Leben mit Eifer besorgt, bloß als Nebenarbeit angesehen wurde und man sich vielmehr nur mit dem Göttlichen abgab, wo unaufhörlich das Gebet gepflegt wurde und der Psalmengesang nicht aufhörte, der gleichmäßig auf die ganze Zeit bei Nacht und bei Tag verteilt war, so daß darin ihre Arbeit wie ihre Erholung von der Arbeit bestand, wer vermöchte solchen Lebenswandel mit menschlicher Rede veranschaulichen, da ihr Leben sich auf der Grenze zwischen der menschlichen und der körperlosen Natur bewegte? Denn daß ihre Natur von den menschlichen Leidenschaften frei war, das ging über Menschenkraft hinaus. Daß sie aber im Leibe erschienen und vom Körper umgeben waren und ihre Sinneswerkzeuge gebrauchten, darin standen sie der Natur der Engel und des Unkörperlichen nach. Vielleicht möchte aber einer die Behauptung wagen, daß der Unterschied keinen großen Abstand bedeutete. Denn da sie im Körper nach Art der unkörperlichen Mächte lebten, so wurden sie durch die Last des Körpers nicht beschwert, sondern ihr Leben ging nach oben, dem Himmel zu, indem es zugleich mit den himmlischen Mächten in der Höhe wandelte. Und die Zeit eines solchen Wandels dauerte nicht bloß kurz. Und mit der Zeit nahm der Gewinn entsprechend zu, indem ihre Weisheitsliebe durch den Zuwachs der neugewonnenen Güter zu immer größerer Reinheit fortschritt.</p><p>Am meisten half ihr zur Erreichung dieses großen Lebens ein leiblicher Bruder, namens Petrus, den unsere Mutter zuletzt geboren hatte. Dieser war nämlich die letzte Frucht ihrer Wehen und er hieß zugleich Sohn und Waise; denn als er zur Welt kam, schied der Vater aus dem Leben. Aber das älteste der Geschwister, dieselbe, von der die Rede ist, nahm ihn, der nur kurze Zeit nach seiner Geburt die Mutterbrust genossen hatte, alsbald der Wärterin ab, zog ihn selbst auf und brachte ihm sogar alle höhere Bildung bei, indem sie ihn von Kindheit an in den heiligen Wissenschaften unterrichtete, so daß sie seiner Seele keine Zeit ließ, sich irgendeiner Eitelkeit hinzugeben. Vielmehr machte sie dadurch, daß sie dem Kinde alles wurde, Vater, Lehrer, Erzieher, Mutter, Ratgeber zu jeglichem Guten, einen solchen Menschen aus ihm, daß er, bevor er das Kindesalter überschritten, noch als Knabe in der Blüte der Unschuld seines Alters sich für das hohe Ziel der wahren Weisheitsliebe begeisterte und durch eine glückliche Naturanlage sich jegliche Fertigkeit und Art in den Handarbeiten angeeignet hatte, so daß er ohne Anleitung mit allem Fleiß die Geschicklichkeit zu all dem besaß, was die meisten erst mit Aufwendung von Zeit und Mühe erlernen. Dieser verachtete also die Beschäftigung mit außerchristlicher Bildung und hatte in seiner Naturanlage eine tüchtige Lehrmeisterin zu allem Guten; dabei schaute er allzeit auf seine Schwester und wählte sie sich zum Vorbild für jegliches Gute. Dadurch wuchs er zu solchem Muster der Tugend heran, daß er in seinem späteren Leben den Tugendvorzügen des großen Basilius keineswegs nachzustehen schien. Damals aber ging er der Mutter und Schwester über alles, da er ihnen zu jenem englischen Leben mitverhalf. Er hatte auch einmal, als drückender Getreidemangel entstanden war und viele von allen Seiten auf den Ruf seiner Wohltätigkeit hin zur Einöde, wo sie wohnten, hinströmten, durch seine umsichtigen Maßregeln solchen Überfluß an Nahrungsmitteln zu verschaffen verstanden, daß die Einöde bei der Menge der Besucher einer Stadt glich.</p><p>Inzwischen war die Mutter ins Vollalter gekommen und schied zu Gott hinüber, indem sie in den Armen ihrer beiden Kinder ihr Leben aushauchte. Erwähnung verdient ihr Segensspruch, den sie über ihre Kinder sprach, indem sie sich sowohl aller abwesenden in Liebe erinnerte, so daß keines ihres Segens verlustig ging, als auch besonders die bei ihr anwesenden Gott im Gebete anempfahl. Wie nämlich diese zwei neben ihr zu beiden Seiten ihres Lagers saßen, faßte sie ihre beiden Kinder je mit einer Hand an und betete mit ihren letzten Worten also zu Gott: „Dir, o Herr, weihe ich die Erstlingsgabe und den Zehnten meiner Mutterschmerzen. Erstlingsgabe ist mir diese Erstgeborene und Zehnter hier dies letzte Kind meiner Schmerzen. Dir ist im Gesetz beides geheiligt und dir gehören sie als Geschenke an. So komme denn dein Segen auf diesen meinen Erstling und diesen Zehnten!“ wobei sie mit diesen hinweisenden Worten die Tochter und den Sohn meinte. Und wie sie zu segnen aufhörte, hörte auch ihr Leben auf, nachdem sie noch ihren Kindern aufgetragen hatte, im väterlichen Grab ihren Leib zu bestatten. Diese erfüllten den Auftrag und strebten dann noch mehr nach der Weisheitsliebe, indem sie immer mit ihrem eigenen Leben wetteiferten und die erreichten Tugenden durch die nachfolgenden in Schatten stellten.</p><p>Währenddessen wurde der hochselige Basilius zum Vorsteher der großen Kirche von Cäsarea erhoben. Er führte den Bruder zum Erbteil der Weihe im Priestertum, indem er ihn durch den mystischen Weihegottesdienst persönlich weihte. Inzwischen machte ihr Leben weitere Fortschritte zu größerer Tugend und Heiligkeit, da jetzt ihre Weisheitsliebe noch durch die Weihe gefördert wurde. Als dann acht Jahre vorüber waren, wanderte der auf der ganzen Erde bekannte Basilius im neunten Jahre von den Menschen zu Gott hinüber und gab dadurch dem Vaterland und der ganzen Erde Anlaß zu allgemeiner Trauer. Sie aber, die in der Ferne die Botschaft vom Unglück vernahm, litt wohl in ihrer Seele ob solchen Verlustes gewaltig, ― wie hätte denn nicht auch sie das Unglück treffen sollen, von dem selbst die Feinde der Wahrheit berührt wurden? ― gleichwie aber die Prüfung des Goldes in verschiedenen Schmelzöfen erfolgen soll, so daß, was beim ersten Schmelzen entgeht, beim zweiten ausgeschieden wird und schließlich beim letzten aller dem Metall beigemischte Unrat entfernt wird, und gleichwie das die beste Prüfung des echten Goldes bedeutet, wenn es durch jeden Schmelzofen hindurchgeht, ohne mehr einen Unrat abzusetzen, etwas Ähnliches traf auch bei ihr zu, indem ihre hohe Gesinnung durch die verschiedensten Stürme von Trauerfällen geprüft und ihre Seele doch immer in unverfälschter Art und ungeschwächter Kraft sich zeigte; so zuerst beim Hingang des andern Bruders, dann beim Tode der Mutter, zum drittenmal, als der gemeinsame Ruhm der Familie, der große Basilius, aus dem Leben schied. Sie hielt also aus wie ein unbesiegbarer Kämpfer, ohne jemals dem Ansturm der Schicksalsschläge zu erliegen.</p><p>Es war im neunten Monat nach diesem Todesfall oder ein wenig darüber, da kam in der Stadt des Antiochus eine Versammlung von Bischöfen zusammen, an der auch wir teilnahmen. Und als wir noch vor Jahresschluß ein jeder wieder in seine Stadt zurückkehrten, da kam mir, dem Gregor, der Wunsch, sie zu besuchen. Denn inzwischen war geraume Zeit vergangen, in der die Aufregungen der Umtriebe, welche ich überall zu erdulden hatte, da ich von den Anführern der Häresien aus der Heimat vertrieben war, ein Wiedersehen verhinderten. Und wie ich die Zeit berechnete, während der die Heimsuchungen ein persönliches Zusammentreffen unmöglich machten, ergab sich mir der nicht kleine Zeitraum von fast acht Jahren. Als ich nun schon den größten Teil des Weges zurückgelegt hatte und nur mehr eine Tagereise entfernt war, hatte ich ein Traumgesicht, das mich mit argen Befürchtungen für die Zukunft erfüllte. Es war mir nämlich, als trüge ich Märtyrerreliquien in meinen Händen und als ginge von denselben ein Glanz aus, wie von einem reinen Spiegel, wenn man ihn der Sonne gegenüberstellt, so daß mir die Augen ob des Lichterglanzes geblendet wurden. Und wiewohl ich in derselben Nacht dreimal dieses Gesicht hatte, konnte ich das Rätsel des Traumes nicht klar deuten. Ich ahnte aber in meiner Seele ein betrübendes Ereignis und wartete mit meinem Urteil über das Traumbild bis zum Ausgang.</p><p>Wie ich nun in die Nähe der Einsamkeit kam, in der sie ihr englisches und himmlisches Leben verbrachte, fragte ich zuerst einen der Genossen nach dem Bruder, ob er da wäre. Als er mir erklärte, daß er mir entgegengereist sei und zwar schon vor drei Tagen, merkte ich, wie es wirklich der Fall war, daß er auf einem andern Wege uns entgegengegangen, und erkundigte mich dann auch nach der Hohen. Als er mir sagte, daß sie krank darniederliege, so beeilte ich mich, den Rest des Weges schneller zurückzulegen. Denn eine gewisse Traurigkeit und ahnungsvolle Besorgnis hatte mich ergriffen und machte mich unruhig. Als ich darauf am Orte selber angekommen war und das Gerücht der Brüderschaft meine Anwesenheit meldete, kam die ganze Schar Männer aus dem Männerheim uns entgegen, denn sie haben es in der Gewohnheit, liebe Gäste durch Entgegengehen zu ehren. Der weibliche Chor der Jungfrauen aber erwartete unsere Ankunft züchtig bei der Kirche. Als dann das Gebet und der Segen beendet war, beugten die letzteren ihr Haupt in sittsamer Haltung zum Segen und zogen wieder ab, indem sie in ihre Behausung zurückkehrten, ohne daß eine von ihnen bei uns verblieb; so vermutete ich, wie es tatsächlich war, daß die Vorsteherin nicht unter ihnen sei, und begab mich ins Innere jener heiligen Wohnung, wobei mich jemand in die Behausung, wo die Hohe wohnte, führte und mir die Türe öffnete. Sie aber war bereits heftig erkrankt, ruhte jedoch nicht auf einem Lager oder Ruhebett, sondern auf dem Boden, indem ein Brett unter das Bußgewand gelegt war und das Haupt wieder von einem andern Brett gestützt wurde, das so zugerichtet war, daß es dem Kopf als Kissen diente, indem es in seiner schrägen Lage unter die Schultern reichte und nach Wunsch ihren Nacken emporhielt.</p><p>Wie sie mich nun zur Türe eintreten sah, richtete sie sich, auf den Ellenbogen gestützt, auf, konnte mir aber nicht entgegengehen, da das Fieber ihre Kraft schon gebrochen hatte. Sie stemmte sich aber mit ihren Händen gegen den Fußboden und streckte sich, so gut es ihr möglich war, von ihrem Lager auf bloßer Erde vorwärts, um mir dadurch die Ehre der Begrüßung zu ersetzen. Ich aber eilte herzu, ergriff ihr tiefgebeugtes Haupt mit meinen Händen von unten, richtete sie wieder auf und legte sie in die gewohnte Lage der Ruhe zurück. Sie aber streckte ihre Hände zu Gott empor und sprach: „Auch diese Gnade hast du, o Gott, mir erfüllt und hast mein Begehr nicht abgewiesen, daß du deinen Diener zum Besuche deiner Magd bewogen hast.“ Und um in meiner Seele kein schmerzliches Gefühl zu wecken, suchte sie das Stöhnen zu unterdrücken und zwang sich, ihren engen Atem möglichst zu verbergen. Und in allem suchte sie uns heiter zu stimmen, indem sie selber eine fröhliche Unterhaltung begann und auch durch ihre Fragen dazu veranlaßte. Als aber im Verlauf der Unterhaltung des großen Basilius gedacht wurde, ward mir die Seele niedergedrückt, mein Angesicht verfiel in Traurigkeit (und aus meinen Augen stürzten die Tränen); sie aber wurde so wenig durch unsern Schmerz zugleich niedergedrückt, daß sie vielmehr die Erwähnung des Heiligen zum Anlaß einer gar erhabenen Erörterung machte und sich darüber ausließ, indem sie über die menschliche Natur tiefsinnig redete und zugleich in ihrer Rede darlegte, wie die göttliche Vorsehung in den Trübsalen verborgen wirke, und indem sie die Dinge des kommenden Lebens, wie vom Heiligen Geist getragen, erläuterte, daß es mir beinahe schien, als ob meine Seele außerhalb der menschlichen Natur weilte, indem sie durch ihre Worte zugleich mithinaufgehoben und unter der Führung ihrer Rede in die heiligen Räume des Himmels versetzt wurde. Und wie wir in der Geschichte Jobs lesen, daß er, obwohl sein ganzer Leib ob der eiternden Wunden unter den Geschwüren dahinsiechte, in seinem Sinnen nicht darauf achtete, sondern wohl am Leibe den Schmerz spürte, aber deshalb in seiner eigenen Betätigung nicht nachließ, noch seine in höheren Ideen sich bewegende Erörterung abbrach: etwas Derartiges bemerkte ich auch bei jener Hohen; obwohl das Fieber ihre ganze Kraft aufzehrte und sie dem Tode zutrieb, gebrauchte sie doch, wie wenn sie mit Tau ihren Körper erfrischt hätte, ihren Geist in der Betrachtung der erhabenen Dinge ganz ungehindert, ohne daß er irgend unter der schweren Krankheit litt. Und wenn unsere Erzählung nicht eine unermeßliche Ausdehnung annähme, würde ich alles der Reihe nach schildern, wie sie in ihrer Rede sich erhob, da sie sich mit uns über die Seele unterredete und die Ursache des Lebens im Fleische durchging und weshalb der Mensch da sei, inwiefern er sterblich sei, woher der Tod komme und worin die Rückkehr von ihm wieder zum Leben bestehe. Alles das ging sie, wie von der Kraft des Heiligen Geistes erfüllt, vollständig genau und in klarer Gedankenfolge durch, wobei ihre Rede ganz leicht dahinfloß wie bei einer Quelle, wo das Wasser ohne Hindernis nach unten strömt.</p><p>Als sie aber ihre Darlegung beendet hatte, sagte sie: „Bruder, es ist für dich Zeit, den Leib ein wenig ausruhen zu lassen, da du von der großen Anstrengung der Reise müde geworden bist.“ Mir war es zwar eine große und wirkliche Erholung, sie zu sehen und dazu ihre erhabenen Worte zu hören. Da ihr aber dies erwünscht und lieb war, so ruhte ich, um mich der Meisterin in allem willfährig zu zeigen, in einem der anliegenden Gärtchen, wo ich ein willkommenes Ruheplätzchen vorfand, im Schatten der an den Bäumen gezogenen Weinreben aus. Aber es war mir nicht möglich, die Annehmlichkeiten zu genießen, da mein Herz im Innern ob der düsteren Befürchtungen beklommen war. Denn das Traumgesicht schien mir durch das, was ich gesehen, sein Geheimnis zu enthüllen. Bildete doch das, was sich meinen Augen dargeboten, in Wahrheit Überbleibsel eines heiligen Märtyrers, welche durch die Sünde ertötet worden waren, durch die innewohnende Gnade des Geistes aber in hellem Glanz erstrahlten. So sprach ich mich auch gegenüber einem von denen aus, die vorher von mir den Traum gehört hatten. Während wir uns nun natürlicherweise voller Betrübnis im Geiste mit der Erwartung des Traurigen beschäftigten, hatte sie, ich weiß nicht auf welche Weise, unsere Gedanken erraten und sandte eine Botschaft heiterer Art uns zu und hieß uns, guten Mutes zu sein und ihretwegen die besten Hoffnungen zu haben. Sie merke nämlich eine Wendung zum Besseren. Das ließ sie uns aber nicht sagen, um uns zu täuschen, sondern ihre Rede war ganz wahrheitsgemäß, wenn wir es auch für den Augenblick nicht begriffen. Wie nämlich fürwahr ein Wettläufer, der seinen Gegner überholt hat und schon ans Ziel der Laufbahn gekommen ist, wenn er dem Siegespreis sich nähert und den Kranz schaut, bei sich frohlockt und auch seinen Gönnern unter den Zuschauern freudig den Sieg ankündigt, gleich als ob er das Ziel schon erreicht hätte, in solcher Stimmung mahnte auch sie, betreffs ihrer das Beste zu hoffen, indem sie schon den Lohn der Berufung nach oben schaute und fast das Wort des Apostels auch von sich gebrauchte: „Es ist mir fortan hinterlegt der Kranz der Gerechtigkeit, welchen mir geben wird der gerechte Richter, nachdem ich ja den guten Kampf gekämpft, den Lauf vollendet und den Glauben bewahrt habe.“</p><p>Wir faßten nun auf die Nachricht von ihrem guten Zustand frohen Mut und machten uns an den Genuß des Vorgesetzten. Mannigfaltiges fand sich da und das Zubereitete bestand aus lauter herzerfreuenden Dingen, indem die Fürsorge der Hohen sich auch auf solche Dinge erstreckte. Als wir aber wieder vor ihren Augen standen, ― denn sie ließ uns die freie Zeit nicht für uns verbringen ― nahm sie die Erinnerung ihrer Erlebnisse seit der Kindheit auf und ging alles wie in einem Buch der Reihe nach genau durch, was sie vom Leben der Eltern im Gedächtnis hatte, wie auch die Ereignisse vor meiner Geburt und das spätere Leben. Der Zweck ihrer Erzählung war aber die Danksagung gegen Gott. Sie legte nämlich dar, wie dem Leben der Eltern bei den Zeitgenossen nicht so sehr der Reichtum Glanz und Ansehen gab, daß vielmehr dasselbe durch göttliche Güte gefördert wurde, indem den Eltern des Vaters wegen ihres Bekenntnisses für Christus das Vermögen eingezogen wurde, während der Großvater mütterlicherseits durch königliche Ungnade aus dem Leben geschafft wurde und all sein Eigentum auf andere Herren überging; gleichwohl sei durch den Glanz ihr Besitz so gewachsen, daß es damals niemanden gab, der einen größeren Namen hatte, als sie. Und obwohl ihr Vermögen nach der Zahl der Kinder wieder neunfach geteilt wurde, sei jedem unter dem Segen das Erbteil so vermehrt worden, daß das Vermögen jedes einzelnen der Kinder den Wohlstand der Eltern übertraf. Ihr selbst sei von dem, was ihr nach dem gleichen Anteil der Geschwister zuerkannt wurde, nichts geblieben, sondern alles sei durch die Hände des Priesters nach dem göttlichen Gebote verwendet worden. Ihr Leben aber sei unter der göttlichen Leitung derart gewesen, daß sie niemals aufgehört habe, mit ihren Händen nach dem Gebote zu arbeiten, noch je nach einem Menschen sich umgesehen habe oder durch irgendwelche menschliche Wohltat sich zu ihrem rechtschaffenen Lebenswandel habe bewegen lassen. Vielmehr habe sie sich weder von den Bittenden abgewendet noch die Gebenden aufgesucht, indem Gott unbemerkt ihre kleinen Werke durch seinen Segen wie Samenkörner zu reichlicher Frucht vermehrte. Als ich aber von den eigenen Leiden, in denen ich mich befunden, erzählte, indem zuerst Kaiser Valens mich um des Glaubens willen verbannte und dann die Verwirrungen in den Kirchen uns zu Kampf und Mühe aufriefen, da sprach die Hohe: „Wirst du nicht davon abstehen, den göttlichen Wohltaten gegenüber unerkenntlich zu sein? Wirst du nicht der Undankbarkeit deiner Seele wehren? Wirst du nicht dein Geschick dem deiner Eltern gegenüberhalten? In dieser Welt rühmen wir uns ja vor allem dessen, daß wir dafür angesehen werden, von edler Geburt zu sein und von edlem Geschlechte abzustammen. Als Mann von hoher Bildung, sprach sie, galt doch damals der Vater viel, aber sein Ruhm beschränkte sich auf die einheimischen Gerichtshöfe. Und als er später die übrigen durch seine Redekunst übertraf, drang sein Ruhm auch nicht über Pontus hinaus, vielmehr genügte es ihm, in der Heimat geachtet zu sein. Du aber, sprach sie, wirst in Städten, Gemeinden und bei Völkern genannt. Dich schicken und rufen die Kirchen, mit ihnen zu kämpfen und Ordnung zu schaffen. Und du willst die Gnade nicht sehen und die Ursache so großer Vorzüge nicht erkennen, daß die Gebete der Eltern dich in die Höhe bringen, obwohl du von Hause aus keine oder nur eine geringe Ausrüstung dazu hast?“</p><p>Wie sie so redete, wünschte ich, daß die Dauer des Tages sich noch verlängerte, damit sie nicht aufhörte, unser Ohr zu erfreuen. Aber die Stimme der Singenden rief zum nächtlichen Dankgebet hinaus. So sandte die Große auch mich zur Kirche und zog sich wieder im Gebete zu ihrem Gott zurück. Und so verging die Nacht. Als es aber Tag geworden war, war es mir nach dem, was ich sah, ganz klar, daß der bevorstehende Tag für sie die letzte Grenze des Lebens im Fleische bedeute, da das Fieber die ganze Kraft ihrer Natur aufgezehrt hatte. Sie aber suchte im Hinblick auf unsern schwachen Mut uns von der traurigen Befürchtung abzubringen, indem sie die Betrübnis der Seele wieder mit jenen herrlichen Gesprächen, von nun an freilich mit schwachem und beengtem Atem, zerstreute. Bei solchem Anblick ward nun meine Seele ganz verschieden gestimmt: einerseits war mein Herz, wie begreiflich, in Traurigkeit versunken, weil es nicht mehr erwarten durfte, noch weiterhin diese Stimme zu hören, sondern befürchten mußte, der gemeinsame Ruhm unserer Familie werde in nicht langer Zeit aus dem Leben hinscheiden, anderseits begeisterte sich meine Seele geradezu an dem, was sich hier zeigte; denn sie schien wahrhaftig die irdische Natur überstiegen zu haben. Denn daß sie nicht einmal in den letzten Zügen bei der Erwartung des Hinübergehens etwas Fremdartiges erlitt, noch wegen des Scheidens aus dem Leben Furcht zeigte, das schien mir nicht mehr Menschenart zu sein, sondern geradezu die Art eines Engels, der nach göttlicher Ordnung Menschengestalt angenommen hatte, bei dem keine Verwandtschaft und kein Zusammenhang mit dem Leben im Fleisch vorhanden war, so daß es wohl begreiflich ist, daß der Geist in Leidenschaftslosigkeit verharrte, ohne daß ihn das Fleisch zu den eigenen Leidenschaften herabzog. Deswegen, glaube ich, hat sie jene göttliche und reine Liebe zum unsichtbaren Bräutigam, welche sie in den geheimen Kammern ihres Herzens still pflegte, damals ihrer Umgebung geoffenbart und ihre Herzensstimmung dadurch gezeigt, daß sie nach dem Geliebten verlangte, um bald mit ihm vereinigt zu werden, befreit von den Fesseln des Leibes. Und wirklich ging ihr Lauf der Tugend zu, indem sonst keine Lust des Lebens ihr Auge auf sich zog.</p><p>Schon war der größte Teil des Tages vorübergegangen und die Sonne neigte sich dem Untergang zu. Ihre Freudigkeit aber ließ nicht nach, sondern je näher es dem Ende zuging, um so mehr schien sie die Schönheit des Bräutigams zu schauen und mit um so heftigerem Begehr drängte sie zum Ersehnten, indem sie ihre schwach werdende Rede nicht mehr an uns, die Anwesenden, sondern an eben jenen, auf den sie unverwandt mit den Augen schaute, richtete. Gegen Osten war nämlich ihr niedriges Lager gekehrt und, nachdem sie aufgehört hatte, nach unserer Weise zu reden, verkehrte sie von nun ab im Gebete mit Gott, mit den Händen flehend und mit leiser Stimme lispelnd, so daß wir ihre Worte nur schwer vernahmen; solcher Art war das Gebet, das unzweifelhaft an Gott gerichtet war und von ihr her vernommen wurde: „Du, o Herr,“ sprach sie, „hast uns die Furcht vor dem Tod genommen. Du hast uns das Ende des Erdenlebens dahier zum Anfang des wahren Lebens gemacht. Du läßt unsere Leiber eine Zeitlang im Schlafe ruhen und erweckst sie daraus wieder mit der letzten Posaune. Du übergibst unsere Erde, die du mit deinen Händen geformt hast, der Erde zur Aufbewahrung und holst dann wieder zurück, was du gegeben, nachdem du das Sterbliche und Unschöne von uns zu Unsterblichkeit und Herrlichkeit umgewandelt hast. Du hast uns vom Fluch und von der Sünde errettet, indem du beides für uns geworden bist. Du hast die Köpfe des Drachen zerquetscht, der mit seinem Rachen den Menschen in den Abgrund des Ungehorsams hinabgerissen hatte. Du hast uns den Weg der Auferstehung bereitet, da du die Pforten der Hölle zerbrochen und den, der die Macht über den Tod hatte, überwunden hast. Du hast denen, die dich fürchten, als Zeichen das Abbild deines heiligen Kreuzes gegeben zur Überwindung des Widersachers und zur Sicherheit unseres Lebens. O ewiger Gott, dem ich vom Mutterleibe an zugeteilt gewesen, den meine Seele aus allen Kräften geliebt hat, dem ich Leib und Seele von Kindheit an bis jetzt geweiht habe, stelle du mir einen lichten Engel zur Seite, der mich geleite an den Ort der Erquickung, wo das Wasser der Ruhe ist, in den Schoß der heiligen Väter, der du das flammende Schwert zerbrochen und den mit dir gekreuzigten Menschen, der dein Erbarmen anflehte, dem Paradies wiedergegeben hast. Gedenke auch meiner in deinem Reiche! Denn auch ich bin mit dir gekreuzigt, da ich aus Furcht vor dir mein Fleisch angenagelt habe und vor deinen Gerichten mich fürchte. Möge der schreckliche Abgrund mich nicht von deinen Auserwählten trennen, noch der Verleumder mir in den Weg treten, noch mögen vor deinen Augen meine Sünden erfunden werden und, wenn ich aus Schwachheit unserer Natur etwas gefehlt und in Wort oder Werk oder Gedanke gesündigt habe, so verzeihe es mir, der du auf Erden die Macht hast, Sünden zu vergeben, damit ich die Erquickung erhalte und, wenn ich meinen Leib ablege, vor dir erfunden werde, an der Gestalt meiner Seele ohne Makel zu sein; ja möge meine Seele untadelig und makellos in deine Hände aufgenommen werden wie liebliches Opferwerk vor dir!“ Während sie so sprach, machte sie zugleich auf die Augen, den Mund und das Herz das Kreuz. Und allmählich konnte ihre im Fieber ganz ausgetrocknete Zunge kein Wort mehr hervorbringen, die Stimme versagte, und wir erkannten nur mehr am Öffnen der Lippen und an der Bewegung der Hände, daß sie mit Gebet beschäftigt war.</p><p>[Forts. v. ] Als inzwischen der Abend herangekommen war und man ein Licht brauchte, schlug sie ihre Augen auf, schaute zum Glanz hin und gab zu erkennen, daß sie auch das abendliche Dankgebet sprechen wolle; weil aber die Stimme versagte, führte sie im Herzen und durch Bewegung ihrer Hände den Vorsatz aus; und ihre Lippen bewegten sich dem inneren Drang gemäß. Wie sie aber das Gebet vollendet hatte und die Hand zur Bekreuzung ans Gesicht führte, um damit das Ende des Gebets anzuzeigen, beschloß sie, ganz schwer und tief aufatmend, zugleich mit dem Gebet ihr Leben. Als sie nun atem- und bewegungslos dalag, erinnerte ich mich des Auftrags, den sie sofort bei der ersten Begegnung gegeben, wo sie den Wunsch ausdrückte, daß meine Hände ihr die Augen zudrücken und daß ich die herkömmlichen Dienstleistungen an ihrem Leibe vornehme, und so berührte ich mit der durch das Leid erschlafften Hand das heilige Antlitz, nur um nicht den Anschein zu geben, als ob ich ihren Auftrag versäumte. Denn ihre Augen brauchten keine Zubereitung, da sie, wie beim natürlichen Schlaf, von den Lidern ganz schön bedeckt waren. Ebenso waren die Lippen natürlich geschlossen, die Hände lagen in züchtiger Ordnung auf der Brust und die ganze Haltung des Körpers war von selbst passend gefügt und so bedurfte es keineswegs einer zurichtenden Hand.</p><p>Meine Seele war aus doppeltem Grunde niedergeschlagen, sowohl durch das, was sich meinen Augen darbot, wie dadurch, daß meine Ohren vom schrecklichen Wehklagen der Jungfrauen umtönt wurden. Bisher nämlich hatten sie sich ruhig verhalten, den Schmerz in ihrer Brust verschlossen und den Drang zum Wehklagen durch Ehrfurcht vor ihr unterdrückt, gleich als fürchteten sie den Tadel ihres zwar bereits schweigenden Antlitzes, damit nicht etwa die Meisterin, wenn sich gegen ihre Anordnung eine Stimme vernehmen ließe, darüber betrübt würde. Als sich aber das Leid nicht mehr still bezwingen ließ, da der Gram wie ein inneres Feuer ihre Herzen durchwühlte, brach plötzlich ein bitteres, nicht mehr aufzuhaltendes Wehklagen los, so daß auch mir der Geist nicht mehr fest blieb, sondern wie von einem losgebrochenen Sturzbach mitfortgerissen sich dem Leid ergab und sich unbekümmert um das, was Pflicht war, ganz dem Wehklagen überließ. Und mir schien, daß die Jungfrauen in mancher Beziehung berechtigten und begründeten Anlaß zum Trauern hatten. Sie beklagten ja nicht den Verlust einer gewohnten leiblichen Pflege und Fürsorge, noch sonst etwas Derartiges, worüber die Menschen sich bei Unglücksfällen abgrämen, sondern im Gefühl, daß ihre Hoffnung bei Gott und das Heil ihrer Seele von ihnen geschieden sei, riefen sie laut und jammerten tief wehklagend also: „Erloschen ist die Leuchte unserer Augen, beseitigt das Licht des Weges unserer Seelen, zerstört die Sicherheit unseres Lebens, gebrochen das Siegel der Unvergänglichkeit, zerrissen das Band der Eintracht, zertrümmert die Stütze der Schwachen und weggenommen das Heil der Kranken! Bei dir war uns die Nacht wie der Tag, von einem reinen Leben erleuchtet; jetzt aber verwandelt sich auch der Tag in Finsternis!“ Noch gewaltiger aber als die andern, ließen jene ihren Schmerz auflodern, welche sie Mutter und Ernährerin nannten. Das waren aber diejenigen, welche sie zur Zeit der Hungersnot von den Wegen aufgehoben, ernährt und erzogen und zu einem reinen und unverdorbenen Leben angeleitet hatte.</p><p>Als ich aber meine eigene Seele sozusagen wie von einem Abgrund heraufgeholt hatte, richtete ich meine Blicke auf jenes heilige Haupt und rief, wie wenn ich ob der Verwirrung derer, die mit ihren Klagen solchen Lärm machten, beleidigt worden wäre, mit lauter Stimme den Jungfrauen zu: „Schauet auf sie und gedenket ihrer Weisungen, mit denen sie euch immer an Ordnung und Wohlanständigkeit gemahnt hat. Nur eine bestimmte Zeit hat uns diese göttliche Seele für die Tränen verstattet, da sie uns mahnte, zur Zeit des Gebetes dies zu tun; das sollt ihr denn jetzt besorgen, indem ihr euer Klagegeschrei in Psalmengesang umwandelt!“ Das rief ich mit ziemlich lauter Stimme, um das Geschrei der Klagenden zu übertönen. Dann hieß ich sie, ein wenig in ihre Behausung sich zu begeben, während einige von ihnen zurückbleiben möchten, deren Dienstleistung sie im Leben gerne angenommen hatte.</p><p>[Forts. v. ] Unter diesen war eine gar ehrbare Frau, durch Reichtum, hohes Geschlecht, körperliche Schönheit und sonstige Zier sehr geachtet; in ihrer Jugend hatte sie sich mit einem Mann aus höherem Stand vermählt; nachdem sie nur kurze Zeit mit ihm verlebt hatte, wurde ihre Verbindung noch in der Blüte ihrer Jugendzeit getrennt, und dann hatte sie die erhabene Makrina zur Wächterin und Leiterin ihrer Witwenschaft gemacht und lebte meistens mit den Jungfrauen zusammen, indem sie von ihnen das Tugendleben erlernte. ― Vestiana hieß die Jungfrau, und ihr Vater war Araxius, einer von denen, welche den Rat der Hypaten bildeten. Zu ihr sagte ich, niemand werde es verübeln, wenn man jetzt wenigstens ihrem Leib einen besseren Schmuck anlege und mit weißen Kleidern ihr reines und unbeflecktes Fleisch schmücke. Sie aber erwiderte, man müsse sich erkundigen, was die Heilige hierüber für gut befunden habe; denn es wäre nicht recht, wenn wir etwas gegen ihre Anordnung besorgten. Jedenfalls aber sei das, was Gott lieb und wohlgefällig sei, auch jener angenehm.</p><p>Im Chor der Jungfrauen war nun eine Vorsteherin, die den Rang der Diakonie besaß und Lampadia hieß. Sie erklärte, die Anordnung der Toten betreffs ihres Begräbnisses genau zu kennen. Als ich sie darüber befragte, sie war gerade bei der Beratung anwesend, sagte sie unter Tränen: „Der Schmuck, den die Heilige sorglich pflegte, war ein reines Leben; das war im Leben ihre Zier und ist auch im Tode ihr Grabschmuck. Was aber den Schmuck ihres Leibes angeht, so hat sie sich darum weder in der Zeit ihres Lebens bekümmert, noch hat sie dafür zur jetzigen Verwendung gesorgt: daher bleibt auch für uns, selbst wenn wir es wollten, nichts weiter übrig, da eine Ausstattung hiezu fehlt.“ Ich entgegnete: „Ist auch unter den Vorräten nichts zu finden, um damit ihr Begräbnis in etwas auszustatten?“ „Unter welchen Vorräten?“ fragte sie. „Du hast alles Verwahrte vor dir. Siehe hier das Oberkleid, hier den Kopfschleier und die abgenützten Sandalen für die Füße: das ist ihr Reichtum, das ihr Vermögen. Außer dem, was du hier siehst, liegt nichts weiter in Kästen und Kammern verborgen und verwahrt. Nur einen Aufbewahrungsort für ihren Reichtum kannte sie, die himmlische Schatzkammer; dort hat sie alles niedergelegt und nichts auf Erden zurückgelassen.“ „Was nun,“ erwiderte ich, „wenn ich von dem, was ich fürs Begräbnis hergerichtet habe, etwas beitrüge, so wird damit doch nichts gegen ihren Willen geschehen?“ Sie erklärte, nach ihrer Meinung sei das nicht gegen ihren Willen. Denn sie hätte wohl auch im Leben eine solche Ehre von dir angenommen aus doppeltem Grunde, einmal wegen deines Priestertums, das sie allzeit schätzte, und dann wegen der Verwandtschaft. Sie hätte nämlich eine Gabe von ihrem Bruder niemals als etwas Fremdes betrachtet. Deswegen hatte sie auch angeordnet, daß ihr Leib durch deine Hände die letzte Dienstleistung erhalte.</p><p>Da aber dieses beschlossen war und man ihren heiligen Leib mit den Gewändern bekleiden mußte, teilten wir uns ins Geschäft miteinander, indem das eine dies, das andere jenes für sie besorgte. Ich ließ durch einen meiner Diener das Gewand herbeibringen. Die genannte Vestiana aber richtete jenes heilige Haupt mit eigenen Händen her und als sie die Hand an den Nacken legte, sprach sie, zu mir aufblickend: „Siehe, was für ein Schmuck am Hals der Heiligen hängt!“ Und zugleich, wie sie das sagte, löste sie hinten das Band und hielt uns ein Kreuzbild von Eisen und einen Ring aus demselben Stoffe her. Diese beiden Dinge hatte sie an einer feinen Schnur immer auf dem Herzen getragen. Und ich sprach: „Wir wollen den Schatz miteinander teilen; behalte du das geweihte Kreuz: mir soll das Erbteil des Ringes genügen.“ Denn auch seinem Siegel war das Kreuz eingegraben. Darauf hinschauend sagte die Frau wieder: „Die Wahl dieses Besitzstückes war für dich kein Fehlgriff. Denn der Ring ist an seiner Kapsel hohl und darin ist ein Stück vom Holz des Lebens verborgen. Und so verrät das Siegel oben durch sein Gepräge, was darunter sich befindet.“</p><p>Als es aber an der Zeit war, ihren reinen Leib mit dem Gewand zu umhüllen und mir der Auftrag jener Hohen diesen Dienst zur Pflicht machte, war jene Frau, welche mit uns die große Erbschaft geteilt hatte, beim Geschäfte zugegen und sprach, indem sie die Hände dazu anlegte: „Laß die Größe der von dieser Heiligen vollbrachten Wundertaten nicht unerzählt vorübergehen!“ „Was meinst du damit?“ erwiderte ich. Sie aber entblößte einen Teil der Brust und sprach: „Siehst du dieses kleine und unscheinbare Zeichen unter dem Hals?“ (Es glich aber dem Stich einer feinen Nadel) und zugleich hielt sie das Licht näher an die mir gezeigte Stelle. „Was ist denn Auffallendes daran,“ fragte ich, „wenn ihr Leib an dieser Stelle mit einem unscheinbaren Mal versehen ist?“ „Das ist“, sagte sie, „ihrem Leib als Erinnerung an die mächtige Hilfe Gottes geblieben. Denn als einmal an dieser Stelle ein schweres Leiden auftrat und Gefahr war, daß man die Geschwulst aufschneiden mußte oder daß das Leiden völlig unheilbar werde, wenn es sich der Herzgegend näherte, bat die Mutter, wie sie erzählte, sie dringend und flehte sie an, sich in die Behandlung des Arztes zu begeben, weil ja auch diese Kunst, wie sie sagte, von Gott zum Heil der Menschen geoffenbart worden sei. Sie aber hielt die Entblößung des Körpers vor fremden Augen für schlimmer als die Krankheit und ging zur Abendzeit, nachdem sie der Mutter mit ihren Händen den gewohnten Dienst besorgt hatte, in das Heiligtum und lag hier die ganze Nacht vor dem Gott der Heiligen und, nachdem sie mit dem aus den Augen tränenden Wasser die Erde begossen hatte, verwendete sie den durch die Tränen entstandenen Kot als Heilmittel für ihr Leiden. Als aber die Mutter in ihrer Verzagtheit sie wieder aufforderte, sich an den Arzt zu wenden, erklärte sie, es genüge zur Heilung ihres Leidens, wenn die Mutter mit ihrer eigenen Hand auf die Stelle das heilige Kreuzzeichen mache. Wie dann die Mutter ihre Hand in den Busen geführt hatte, um die Stelle ringsum mit dem Kreuze zu bezeichnen, tat das Kreuz seine Wirkung und das Leiden war verschwunden. Aber dieses kleine Mal, sagte sie, war schon damals an Stelle des schrecklichen Geschwüres sichtbar und blieb ihr bis ans Ende, damit es, wie ich glaube, als Erinnerung an die göttliche Hilfe zum immerwährenden Dank gegen Gott anspornte und veranlaßte.“</p><p>[Forts. v. ] Als unsere Arbeit fertig und der Leib so gut wie möglich geschmückt war, erklärte die Diakonisse wieder es für ungeziemend, daß sie in bräutlichem Schmuck von den Augen der Jungfrauen erblickt werde. „Aber ich habe“, sagte sie, „das dunkle Gewand eurer Mutter in Verwahrung. Es wird wohl gut sein, das ihr aufzulegen, damit nicht diese heilige Schönheit durch den herzugebrachten Kleiderschmuck aufgeputzt erscheine.“ Der Vorschlag fand Gefallen, und das Gewand wurde über sie gelegt. Sie aber glänzte auch in dem dunklen Gewand, indem die göttliche Macht, wie ich glaube, dem Leib auch noch diese Anmut verlieh, so daß es genau nach dem Traumgesicht schien, als ob gewisse Strahlen von ihrer Schönheit ausgingen.</p><p>Als wir aber damit beschäftigt waren und die frommen Lieder der Jungfrauen, mit dem Wehklagen vermischt, den Ort erfüllten, da strömten auf das Gerücht, das sich, ich weiß nicht wie, ringsum überall zugleich verbreitet hatte, alle Umwohner des Ortes zusammen, so daß der Vorplatz nicht ausreichte, die Zusammenströmenden aufzunehmen. Als nun die nächtliche Feier mit den frommen Liedern, wie bei einem Märtyrerfest, vorüber war und der Morgen anbrach, störte die Menge der aus der ganzen Umgebung zusammengekommenen Männer und Frauen mit ihren Wehklagen den Psalmengesang; ich aber suchte, wiewohl in der Seele ob des Trauerfalles ganz betrübt, soweit es den Umständen nach möglich war, nichts von dem zu unterlassen, was sich für ein solches Leichenbegängnis geziemte, teilte das zusammenströmende Volk nach dem Geschlechte ab, reihte die Menge der Frauen in die Schar der Jungfrauen, das Männervolk aber in die Schar der Mönche und sorgte wie bei einem Chor für einen einheitlichen, wechselseitig geordneten und harmonischen Psalmengesang, in dem die Stimmen aller passend vereinigt waren. Als aber der Tag allmählich heranrückte und der ganze Platz der Einsiedelei von der Menge der Trauergäste besetzt war, befahl der Bischof jener Gegend, ― Aracius war sein Name; er war mit dem ganzen Chor der Priesterschaft anwesend ― die sterbliche Hülle langsam fortzutragen, weil die Entfernung groß war und die Menge einer schnellen Bewegung des Zuges hätte hinderlich werden können. Zugleich mit diesen Worten forderte er alle Mitgenossen der priesterlichen Würde auf, dem Leib das Geleite zu geben.</p><p>Als dies angeordnet war und man mit Eifer sich daran machte, trat ich unter die Bahre und rief jenen auf die andere Seite, während zwei andere angesehene Kleriker unter den hinteren Teil der Bahre traten, und brach auf, wobei wir schrittweise, wie es sich gehörte, und langsam uns bewegten. Denn da das Volk sich um die Bahre drängte und alle an dem heiligen Bild sich nicht satt sehen konnten, war es uns nichts Leichtes, den Weg zu vollenden. Es schritt aber auf beiden Seiten eine nicht geringe Schar von Diakonen und Kirchendienern voraus und geleitete in Ordnung die Leiche, wobei alle Wachskerzen in den Händen trugen. Und was sich vollzog, war ein ganz feierlicher Zug, wobei gemeinsam von den ersten bis zu den letzten ein Psalmenlied, ähnlich dem Liede der drei Jünglinge gesungen wurde. Da die Entfernung von der Einöde bis zum Haus der heiligen Märtyrer, wo die Leiber der Eltern ruhten sieben bis acht Stunden betrug, so brauchten wir fast den ganzen Tag für den Weg. Denn die Menge, welche zusammengekommen war, und die immer noch mehr anwuchs, ließ uns den Weg nicht, wie wir wollten, vollenden. Als wir nun ins Innere des Hauses gekommen waren, stellten wir die Bahre ab und wandten uns zunächst dem Gebete zu; das Gebet aber wurde dem Volk Anlaß zum Wehklagen. Als nämlich der Psalmengesang vollendet war und die Jungfrauen jenes heilige Antlitz schauten und schon das Grab der Eltern geöffnet war, in dem sie beigesetzt werden sollte, da rief eine in heftiger Gemütsbewegung: „Nimmer werden wir nach dieser Stunde dieses Gott ähnliche Antlitz schauen!“ Und wie dann auch die anderen Jungfrauen mit ihr das gleiche schrieen, da störte eine regellose Verwirrung jenen geregelten und feierlichen Psalmengesang, indem alles vom Wehklagen der Jungfrauen ergriffen war. Und nur mit Mühe, als wir Stillschweigen winkten und der Vorbeter zum Gebete aufforderte und der Versammlung die üblichen Worte zurief, nahm das Volk die Haltung zum Gebete ein.</p><p>[Forts. v. ] Nachdem das Gebet das geziemende Ende genommen, beschlich mich eine gewisse Furcht vor dem göttlichen Gebot, das da verbietet, die Scham des Vaters oder der Mutter aufzudecken. „Wie kann ich“, sagte ich, „einem solchen Gericht entgehen, wenn ich an den begreiflicherweise zerfallenen, aufgelösten und in häßliche und widerliche Ungestalt verwandelten Leibern der Eltern die dem menschlichen Geschlecht gemeinsame Scham anschaue?“ Da ich mir das erwog und der Unwille des Noe über seinen Sohn meine Furcht noch steigerte, riet mir die Geschichte des Noe, was ich tun solle. Beim Wegheben des Deckels wurden nämlich die Leiber, bevor sie uns zu Gesicht kamen, mit einem reinen Leinentuch verhüllt, indem das Linnentuch zu beiden Seiten hineingeführt wurde. Nachdem so die Leiber durch das Tuch verhüllt waren, hoben wir, ich und der vorgenannte Bischof des Bezirks, jenen heiligen Leib von der Bahre ab und legten ihn neben die Mutter, indem wir damit einen gemeinsamen Wunsch beider erfüllten. Darum beteten nämlich beide während ihres ganzen Lebens einstimmig zu Gott, daß ihre Leiber nach dem Tode miteinander vereinigt und ihre Lebensgemeinschaft auf Erden auch im Tode nicht getrennt werden möchte.</p><p>Nachdem alles, was bei der Bestattung Vorschrift ist, erfüllt war und man wieder den Rückweg antreten sollte, fiel ich erst am Grabe nieder und küßte den Staub; dann machte ich mich auf den Weg, niedergeschlagen und verweint ob des Gedankens, von welch teurem Schatz mein Leben sich trennen mußte. Auf dem Wege aber kam ein hochgestellter Kriegsmann, der in einem Städtchen von Pontus, namens Sebastopolis, das militärische Kommando inne hatte und mit seinen Untergebenen dort wohnte, mir bei der Ankunft daselbst teilnehmend entgegen; er hatte vom Trauerfall gehört und war darüber schmerzlich berührt ― er gehörte nämlich zu den nahen Verwandten unserer Familie ― und erzählte mir noch ein wunderbares Ereignis von ihr, das ich allein noch dem Berichte anfügen möchte, um dann die Schrift zu beendigen. Als wir nämlich unsere Tränen gestillt und eine Unterhaltung begonnen hatten, sagte jener zu mir: „Vernimm, was für ein teures Gut dem menschlichen Leben entrückt wurde!“ und begann mit diesen Worten also zu erzählen:</p><p>„Es kam einmal uns, meine Gattin und mich, das sehnliche Verlangen an, die Schule der Tugend zu besuchen. Denn so muß man, sagte er, nach meiner Meinung jenen Ort nennen, wo die glückliche Seele sich aufhielt. Bei uns war unser Töchterlein, das infolge einer pestartigen Krankheit an einem Augenübel litt. Es war ein widerlicher und mitleidenswerter Anblick, da sich die Hornhaut an der Pupille verdichtet hatte und infolge der Krankheit eine weißliche Farbe zeigte. Als wir aber an jenem gottgeweihten Orte angelangt waren, teilten wir unseren Besuch bei denen, welche am Orte der Weisheitsliebe nachgingen, nach dem Geschlecht, ich und meine Gattin; ich verweilte in der Männerwohnung, der dein Bruder Petrus vorstand; sie befand sich in der Jungfrauenabteilung bei der Heiligen. Und nachdem inzwischen eine gehörige Zeit verflossen war, hielten wir es für angemessen, die Einsamkeit wieder zu verlassen. Und schon rüsteten wir uns zum Aufbruch, da wurde uns von beiden Seiten in gleicher Weise eine freundliche Aufmerksamkeit zuteil. Mich hieß nämlich dein Bruder, zu bleiben und am Tisch der Mönche teilzunehmen. Die Selige aber ließ meine Gattin nicht fort, sondern drückte das Töchterlein an ihren Busen und erklärte, es nicht herauszugeben, bis sie ihnen den Tisch bereitet und sie mit dem Reichtum der Weisheitsliebe bewirtet hätte; als sie aber das Kind, wie es so Brauch ist, liebkoste und auf seine Augen küßte, bemerkte sie das Übel an der Pupille und sprach: „Wenn ihr mir den Gefallen erzeiget und an unserem Tische teilnehmet, will ich euch für solche Ehre ein nicht unwürdiges Gegengeschenk geben.“ Als dann die Mutter des Mädchens fragte: „Was für eines?“ erklärte die Hohe: „Ich besitze ein Mittel, das imstande ist, das Augenleiden zu heilen.“ Da mir hierüber von der Frauenabteilung durch einen, der jenes Versprechen verriet, Botschaft zukam, so blieben wir gerne, ohne uns viel um die drängende Notwendigkeit der Abreise zu kümmern.</p><p>Als aber das Mahl ein Ende hatte und unser Herz satt war, da der treffliche Petrus uns eigenhändig bediente und uns Unterhaltung leistete, während die heilige Makrina mit aller ehrbaren Fröhlichkeit die Gattin zu uns entließ, kehrten wir also, freudig gestimmt und wohlgemut, denselben Weg zurück, indem wir auf dem Wege einander unsere Erlebnisse erzählten; ich berichtete das, was ich in der Männerwohnung gesehen und gehört hatte, während jene alle Einzelheiten schilderte und nichts, auch nicht das Unbedeutendste, auslassen zu dürfen glaubte. Als sie nun alles der Reihe nach, wie in einem Buch zusammengestellt, durchging und an jenen Punkt kam, wo es sich um das Versprechen der Heilung des Auges handelte, brach sie die Erzählung ab und rief: „Was ist uns Schlimmes widerfahren? Wie konnten wir das Versprochene vergessen, jene uns zugesagte Augensalbe?“ Und da auch ich mich über die Nachlässigkeit ärgerte und einem den Auftrag gab, schnell das Heilmittel zu holen, blickte das Kind, das die Wärterin auf ihren Armen trug, zufällig zur Mutter hin. Die Mutter aber rief, auf die Augen des Kindes schauend: „Laß ab, dich wegen der Nachlässigkeit zu grämen! Denn siehe,“ sprach sie mit vor Freude und Staunen zugleich erregter Stimme, „nichts vom Versprochenen fehlt uns; vielmehr hat sie ihr wirklich heilkräftiges Mittel, nämlich die Heilung durchs Gebet, uns nicht bloß geschenkt, sondern auch bereits wirksam gemacht und an dem durch jenes göttliche Heilmittel geheilten Auge ist von der Krankheit nichts mehr vorhanden!“ Zugleich mit diesen Worten nahm sie das Kind an sich und legte es auch in meine Arme. Und ich dachte damals an die unglaublichen Wunder des Evangeliums in meinem Geiste und sagte: „Was bedeutet es noch Großes, wenn durch die Hand Gottes Blinde ihr Gesicht wiedererhalten, da hier seine Dienerin durch den Glauben an ihn jene Heilungen zuwege gebracht und damit ein Werk vollzogen hat, das nicht viel hinter jenem Wunder zurücksteht?“ Da er dies erzählte, erstickte ihm vor Schluchzen die Stimme, indem die Tränen zwischen seine Erzählung rannen.</p><p>Forts. v. ] Das erzählte mir der Kriegsmann. Was wir aber sonst noch Derartiges von ihren Mitgenossinnen und von denen, die ihr Leben genau kannten, gehört haben, halte ich nicht für sicher genug, um es der Erzählung anzuschließen. Denn die meisten Menschen bemessen die Glaubwürdigkeit des Berichteten nach ihrem eigenem Maßstab. Was aber über die Fassungskraft des Zuhörers hinausgeht, das verdächtigen sie, als ob es jenseits der Wahrheit läge, frevelhafterweise als Lüge. Deshalb übergehe ich jenes unglaubliche landwirtschaftliche Vorkommnis während der Hungersnot, wie man an dem zum Verbrauch bestimmten Getreide keine Verminderung merkte, indem es immer die gleich große Masse blieb sowohl vorher, ehe es an die Bittenden verteilt wurde, als nachher. Und anderes, was noch mehr auffallend ist als dieses, wie Krankenheilungen, Befreiungen von bösen Geistern und untrügliche Vorhersagungen zukünftiger Dinge. Alles halten die Eingeweihten für wahr, wenn es auch unglaubhaft erscheint; von den fleischlich Gesinnten aber wird es als außerhalb des Möglichen angesehen, sie, die nicht wissen, daß nach dem Maß des Glaubens auch die Verteilung der Gnadengaben erfolgt: eine geringe für die Kleingläubigen, eine große für die, welche in ihrem Herzen für den Glauben einen weiten Raum haben. Damit nun nicht die Ungläubigen Schaden leiden, wenn sie den Gaben Gottes nicht glauben, deswegen sehe ich davon ab, von den höheren Wundern im einzelnen zu berichten, indem es genügen dürfte, mit dem Ausgeführten ihr Leben erzählt zu haben.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Lebensbeschreibung seiner Schwester Makrina</em> (BKV 1. Reihe, Bd. 56, Kempten/München 1927). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-3166/versions/lebensbeschreibung-seiner-schwester-makrina-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

