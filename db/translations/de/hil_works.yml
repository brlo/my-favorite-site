      <p><em>Gegen die Arianer, oder gegen Auxentius von Mailand (Kempten 1833).</em></p><h2>1</h2><p>Den geliebtesten Brüdern, die im väterlichen Glauben verbleiben, und die arianische Ketzerei verabscheuen, den Bischöfen und allem Volke wünscht euer Mitknecht Hilarius im Herrn ewiges Heil.</p><h2>2</h2><p>Herrlich ist der Name des Friedens, und schön ist der Gedanke der Ewigkeit, aber wer zweifelt, daß nur die Einheit der Kirche und der Evangelien allein der Friede sey, welcher ein Geschenk Christi ist? Diesen Frieden, über welchen er zu den Aposteln nach seinem ruhmvollen Leiden ge- sprochen, welchen er bei seinem Scheiden zum Unterpfande seines ewigen Gebotes empfohlen hat, diesen, liebste Brüder, haben wir, wo er verloren war, zu suchen, wo er gestört war, herzustellen, wo er gefunden war, zu behalten Sorge getragen. Aber desselben selbst entweder theilhaftig zu werden, oder ihn herzustellen, haben theils die Sünden unserer Zeit nicht verdient, theils haben es die Vorläufer und Diener des bevorstehenden Antichristen nicht gestattet, welche sich mit ihrem Frieden, das heißt, mit ihrer gottlosen Ewigkeit brüsten, und sich nicht wie Bischöfe Christi, sondern wie Priester des Antichristen benehmen.</p><h2>3</h2><p>Und damit man uns nicht vorwerfe, daß wir uns lästernder Schmähworte gegen dieselben bedienen, so verschweigen wir die Ursache des allgemeinen Verderbens nicht, damit sie Niemanden unbekannt bleibe. Daß es mehrere Antichristen gebe, wissen wir auch aus der Lehre des Apostels Johannes. Denn ein Jeder, welcher Christum, wie er von den Aposteln verkündet wurde, verläugnet, ist ein Antichrist. Die eigentliche Bedeutung des Namens Antichrist ist, Christo entgegen seyn. Dieses wird jetzt durch die Ansicht einer verkehrten Religion bewirkt, darauf wird jetzt unter dem Vorwande der Lehre des Evangeliums hingearbeitet, daß der Herr Jesus Christus, während man glaubt, er werde geprediget, verläugnet wird.</p><h2>4</h2><p>Und fürs Erste muß man die Bemühung unseres Zeitalters bedauern, und die thörichten Ansichten der gegenwärtigen Zeiten beseufzen, nach welchen man glaubt, daß Menschliches Gott zum Schirme diene, und nach welchen man zum Schutze der Kirche Christi mit zeitlicher Anstrengung arbeitet. Ich bitte euch, ihr Bischöfe, die ihr dieses zu seyn glaubt, welcher Mittel haben sich zur Verkündigung des Evangeliums die Apostel bedient? Durch welche Mächte unterstützt haben sie Christum geprediget, und fast alle Heiden von den Götzen zu Gott bekehrt? Holten sie sich etwa irgend eine Würde aus dem Palaste, da sie Gott in dem Kerker in Fesseln und nach den Geißelhieben ein Loblied sangen; und versammelte Paulus auf die Befehle des Königs, da er selbst im Theater zur Schau stand, Christo die Gemeinde? Er schützte sich, glaube ich, durch die Gunst des Nero, oder Vespasianus, oder Decius, durch deren Haß gegen uns das Bekenntniß der göttlichen Lehre aufgeblüht hat? Jene, welche sich mit Hand und Arbeit nährten, welche in Stuben, unter dem Dache und in abgelegenen Orten zusammenkamen, welche Flecken und Burgen und die Länder fast aller Nationen zu Wasser und zu Land gegen die Beschlüsse des Senates und gegen die Befehle der Könige durchwanderten, jene hatten, glaube ich, die Schlüssel zum Himmelreiche nicht? Oder widersetzte sich damals nicht offenbar die Macht Gottes dem menschlichen Hasse, als Christus desto mehr geprediget wurde, je mehr man das Predigen zu hindern suchte?</p><h2>5</h2><p>Aber jetzt empfehlen leider irdische Hülfsmittel den göttlichen Glauben, und Christus wird, indem man seinem Namen Anhang zu verschaffen sucht, als arm an Macht dargestellt. Die Kirche schreckt mit Verbannung und Kerker; und erzwingt den Glauben an sie, die der Verbannung und dem Kerker anvertraut ist. Sie vertreibt die Priester, sie, die durch vertriebene Priester fortgepflanzt worden ist. Sie rühmt sich, von der Welt geliebt zu werden, sie, die nicht Christo angehören könnte, wenn sie von der Welt nicht gehaßt würde. So ruft hinsichtlich der Vergleichung der uns einst übergebenen und jetzt verderbten Kirche die Sache selbst, welche vor aller Augen und in Aller Mund ist.</p><h2>6</h2><p>Was aber das sey, was nicht mehr länger unbekannt bleiben darf, will ich kurz auseinandersetzen. Nach der Gott gefälligen Erfüllung sind die Zeiten enge beschränkt. Denn ihre bestimmte Berechnung wird in den heiligen Büchern angegeben; und wir mußten selbst in die Zeit des Antichristen fallen, durch dessen Diener, welche sich, nach dem Ausspruche des Apostels, in Engel des Lichtes verwandeln, der, welcher Christus ist, aus der Erkenntniß und dem Glauben beinahe Aller verdrängt wird. Denn damit die Behauptung des Irrthumes für wahr gelte, wird die Ansicht der Wahrheit als ungewiß vorausgesetzt; und damit dem Antichristen nun der Weg gebahnt sey, zu täuschen, daß er jener Christus sey, über welchen man bisher uneinig war. Daher jene verschiedenen Ansichten, daher bei dem Glauben an Einen Christus die Lehre sehr Vieler, daher die neuliche Um- gestaltung des Geistes des Arius aus einem Engel des Teufels in einen Engel des Lichtes; dessen ganze Erbschaft auf den Valenes, Ursacius, Auxentius, Germinius und Gajus gekommen und übergegangen ist. Denn diese haben jetzt einen neuen Christus, damit durch ihn der Antichrist einschleichen möchte, eingeführt.</p><h2>7</h2><p>Denn sie wollen, daß dieser ihr Christus nicht jenen Grad von Göttlichkeit habe, welchen der Vater hat; sondern daß er ein mächtiges und alle übrigen Geschöpfe übertreffendes Geschöpf sey, und daß er durch den Willen Gottes aus Nichts entstanden sey; er sey zwar, sagen sie, vor allen Jahrhunderten, und überhaupt vor aller Zeit als Gott aus Gott geboren worden, aber er sey nicht aus Gottes Wesenheit, und man dürfe nicht annehmen, daß er wirklich aus Gott geboren worden sey und wahrhaft jene Majestät habe, welche Gott hat; damit nicht der, welcher Sohn ist, ein eben so wahrer Gott sey, wie der wahrer Gott ist, welcher Vater ist; so daß dieses, daß Sohn und Vater in den Evangelien als Eins verkündet werden, nur auf der Gemeinschaft des Willens und der Liebe, nicht auf wahrer Gottheit beruhe. Ist diese bei dem Söhne nicht eben die- selbe, welche sie bei Gott ist, sodaß im Glaubensbekenntnisse Ein Gott sey; warum nennen sie ihn dann Gott Sohn, warum nehmen sie an, daß er vor den Zeiten und Jahrhunderten gewesen sey, wenn nicht deßwegen, weil der Name Gott jedem Heiligen durch die Verleihung der Ewigkeit bestimmt ist? Oder sind nicht alle, welche wiedergeboren sind, wahrhaft Kinder Gottes; oder sind nicht alle Engel, welche allerdings durch Christum geschaffen sind, vor allen Zeiten und vor allen Jahrhunderten geschaffen worden? Jedoch nur, um den Antichristen mit geringem Aufsehen einzuführen und um die Unglücklichen zum Glauben an ihn zu bewegen, theilen sie Christo den Namen Gottes zu, weil dieser auch Menschen verliehen worden sey; sie behaupten, daß er wahrhaft Gottes Sohn sey, weil durch das Geheimniß der Taufe ein Jeder wahrhaft Gottes Sohn wird; sie lehren, daß er vor den Zeiten und Jahrhunderten gewesen sey, weil man dieses von den Engeln und dem Teufel nicht läugnen kann. Somit werden Christo dem Herrn nur solche Dinge beigelegt, welche entweder den Engeln, oder uns eigen sind. Was aber Christo mit Recht gebührt und wahrhaft eigen ist, nämlich daß Christus wahrer Gott ist, das heißt, daß die Gottheit des Sohnes ebendieselbe sey, wie die des Vaters, wird ihm abgesprochen. Und zwar wird durch den Trug dieser Gottlosigkeit bis jetzt bewirkt, daß unter den Priestern des Antichristen das Volk Christi noch nicht untergeht, weil sie meinen, es werde das geglaubt, was gesagt wird. Sie hören, Christus sey Gott; sie halten ihn für das, was er genannt wird. Sie hören, er sey Gottes Sohn; sie glauben, weil er Gott von Geburt sey, sey er in Wahrheit Gott. Sie hören, er sey vor den Zeiten gewesen, und meinen, eben dieses sey vor den Zeiten, was immer ist. Heiliger sind die Ohren des Volkes, als die Herzen der Priester. Wenn die Arianer lehren, daß Christus wahrer Gott sey, so behaupten sie ohne Trug, daß er Gott sey; weil sie, wenn sie ihn Gott nennen, auch be- haupten, daß er nicht wahrer Gott sey; sie geben ihm den Namen und nehmen ihm die Wahrheit.</p><h2>8</h2><p>Obwohl also von ihren höchst gottlosen Lästerungen alle Papiere der Kirchen voll, und voll schon die Bücher sind; so darf doch, was sich erst unlängst ereignet hat, nicht verschwiegen werden. Als der fromme König in einer strengen Verordnung die mailändische Kirche, welche bekennt, daß Christus wahrer Gott sey, und daß er gleiche Gottheit und Wesenheit mit dem Vater habe, unter dem Scheine der Einheit, welchen die Einheit des Willens gewährt, zu beunruhigen befohlen hatte, behauptete ich in einer obwohl ungelegenen Zwischenrede, Auxentius sey ein Gotteslästerer, und müsse überhaupt für einen Feind Christi gehalten werden; auch fügte ich dieses bei, er habe einen andern Glauben, als der König selbst, und alle übrigen. Hiedurch aufgebracht, ließ uns der König vom Quästor und Magister verhören, indem ungefähr zehn Bischöfe zugleich mit uns dasaßen. Und zuerst brachte er, wie es auf dem Forum gewöhnlich ist, persönliche Schmähungen gegen mich vor, ich sey einst von dem Saturninus verdammt worden, und dürfte nicht wie ein Bischof verhört werden. Es ist jetzt nicht Zeit, das anzuführen, was hierauf entgegnet wurde; aber die, welche damals verhörten, waren der Ansicht, es sollte über den Glauben mehr, wie es dem Könige gefiel, verhandelt werden. Und da er bereits in die Enge getrieben, und es gefährlich war, zu läugnen, legte Auxentius das Bekenntniß ab, er glaube, daß Christus wahrer Gott sey, und daß er mit Gott dem Vater Eine Gottheit und Wesenheit habe. Man beschloß also, dieses niederzuschreiben, und damit das, was gesprochen ward, dem Gedächtnisse der Zuhörer nicht entfallen möchte, ließ ich sogleich die Schrift durch den Quästor dem Könige überreichen, worin das, worüber man übereinkam, enthalten war; und damit man mich nicht einer Lüge beschuldigen möchte, legte ich Abschriften davon bei. Alle beschloßen, Auxentius sollte eben dieses Bekenntniß vor der Menge ablegen; und man zwang ihn, es zu schreiben. Dieser aber trieb nach langen Ueberlegungen sehr schlau mit dem Glauben des Königes sein Spiel; er übergab im ein Schreiben, welches ihm Style des Antichristen verfaßt war.</p><h2>9</h2><p>Denn zuerst erklärte er, daß dasjenige, was zu Nicäa in Thrazien durch die Gottlosigkeit Aller verworfen worden wäre, heilig sey; indem er nämlich behauptete, der Glaube des wahren Bekenntnisses bestehe in der den Bischöfen angethanenen Gewalt. Er läugnete auch, daß er den Arius kenne; da er doch zu Alexandria in einer arianischen Kirche, deren Vorsteher Gregorius war, Presbyter zu seyn angefangen hatte. Von der Synode zu Rimini aber, welche von Allen religiöser Weise aufgelöst worden ist, wollen wir nichts sagen; nur die teuflischen Erdichtungen müssen aufgedeckt werden. Obwohl es also gefallen hatte, niederzuschreiben, Christus sey wahrer Gott, und habe mit dem Vater Eine Gottheit und Wesenheit; so stellte er doch, wie der schlaueste Teufel, diese Meinung auf, welche Christum bezeichnen sollte, er sey vor allen Zeiten geborner Gott, wahrer Sohn; so daß, wie bei den Arianern, die Wahrheit sich auf den Sohn, nicht auf Gott bezog. Und damit diese Bezeichnung noch weit mehr sich unterscheiden möchte, wurde beigefügt: aus dem wahren Gott Vater; so daß im Vater, die wahre Gottheit wäre, in Christo nur die Wahrheit des Sohnes bezeichnet würde. Hierauf wird im Verlaufe der Erklärung von Auxentius Eine Gottheit behauptet; und er findet diese nicht auch in dem Sohne, so daß im Vater allein, nicht auch im Sohne die Eine einzige Gottheit wäre.</p><h2>10</h2><p>Unter dem Volke aber wurde die Sage verbreitet, Auxentius habe geschrieen, daß Christus wahrer Gott sey, und Eine Gottheit und Wesenheit mit dem Vater habe; und er weiche von dem Sinne des von mir erklärten Glaubens nicht ab; worauf der König der Reinheit des Glaubens gemäß in eine innige Verbindung mit ihm trat. Da aber dieses lange verborgene Geheimniß der Gottlosigkeit nicht mehr verschwiegen wurde, und ich sagte, es sey Alles nur Verstellung, der Glaube werde geläugnet, Gott und Menschen werden getäuscht; erhielt ich den Befehl, von Mailand fortzuziehen, weil ich hier gegen den Willen des Königes nicht bleiben dürfte.</p><h2>11</h2><p>Dieses also, Brüder, die ihr Gottes Gericht fürchtet, ist so geschehen, wie ich sage. Auxentius wollte das, was er zu läugnen sich fürchtete, nicht bekennen; denn ich habe Abschriften seiner Erklärung beigelegt. Hat er ebendasselbe geschrieben, so überführet mich des Betruges; hat er über etwas anders geschrieben, als er bekennt hat, so erkennet, daß von ihm nun ein anderer Christus, das ist der Antichrist, verkündiget werde. Zwar täuschte jener mit Worten, durch welche er auch die Auserwählten täuschen könnte; aber die so große Gottlosigkeit seiner Lehre ist einleuchtend.</p><h2>12</h2><p>Er sagt, daß er nicht zwei Götter lehre, weil es nicht zwei Väter gibt. Wer sieht diesem zu Folge nicht, daß das Bekenntniß Eines Gottes nur darum dem Vater eigen sey, weil er allein ist? Daher kam auch jene teuflische Erklärung: „Wir erkennen Einen einzigen wahren Gott Vater.“ Und nach boshaften Bezeichnungen heißt es: „Einen nach den Schriften seinem Erzeuger, dem Vater, ähnlichen Sohn.“ Steht irgendwo in den heiligen Büchern dieses geschrieben, so ist seine Lehre die der Unschuld. Sind aber in der wahren Gottheit Sohn und Vater Eins, warum wird dann die unvollkommene Meinung von der Aehnlichkeit vorgezogen? Zwar ist Christus das Ebenbild Gottes; es unterliegt aber keinem Zweifel, daß auch der Mensch Gottes Ebenbild sey, weil Adam nach dem Ebenbilde und der Aehnlichkeit Gottes gemacht worden ist. Warum räumest du, Erbe des Arius, Christo nur das ein, was uns eigen ist? Warum hintergehst du den König, warum die Comites, warum die Gemeinde Gottes, durch die Kunstgriffe deines Vaters, das heißt, des Teufels? Du nennest Christum Gott; warum täuschest du durch den Namen? Läugne, daß Moses von Pharao ein Gott genannt worden sey. Du heißest Christum den Sohn und Erstgebornen Gottes; läugne, daß Gottes erstgeborner Sohn Israel sey. Du behauptest, Christus sey vor den Zeiten geboren; läugne, daß auch der geschaffene Teufel vor den Zeiten und Jahrhunderten gewesen sey. Du erwähnst, Christus sey dem Vater ähnlich; läugne, daß nach dem Ebenbilde und der Aehnlichkeit Gottes der Mensch zu seyn begonnen habe. Nur das versagst du Christo, was er ist, damit er nicht wahrer Gott seyn und mit dem Vater Eine Gottheit und Wesenheit haben möchte. Und du pflegtest in Uebereinstimmung mit deinen Lehrern mich als Häretiker zu beschuldigen. Setze die Religionswidrigkeit meiner Lehre, so sehr du kannst, schriftlich auseinander, und lege den Inhalt meiner Gotteslästerung vor. Meiner Ansicht nach ist der ein Antichrist, welcher nicht bekennt, daß der Sohn in eben dem Grade Gott sey, wie der Vater; und welcher nicht so den Vater den Einen wahren Gott nennt, daß die Wahrheit der Gottheit nicht auch in dem Sohne anerkannt werde. Ist die Göttlichkeit Christi und Gottes Eine und ebendieselbe, warum hast du dieses nicht einfach niedergeschrieben? Ist sie es dir nicht, warum hast du dieses nicht einfach geläugnet?</p><h2>13</h2><p>Ich hätte nun zwar gewünscht, o Brüder, daß Geheimniß eines so verderblichen Mysteriums lieber selbst, als durch ein Schreiben zu enthüllen, und alle Gotteslästerungen des Auxentius im Einzelnen zu erörtern; aber weil mir dieses nicht gestattet ist, so mag wenigstens ein Jeder vernehmen, was ihm gestattet ist. Vieles anderes der Kirche vorzutragen, hindert mich die Scham, und ich scheue mich, das Gräßliche der Gotteslästerungen der Arianer in einem Briefe niederzuschreiben. Vor Einem warne ich; hütet euch vor dem Antichristen; denn schlimm ist es, wenn euch die Liebe zu den Wänden gefesselt hat, schlimm, wenn ihr die Kirche Gottes unter Dächern und in Gebäuden verehret, schlimm, wenn ihr unter diesen den Namen des Friedens aussprechet. Unterliegt es etwa einem Zweifel, daß in diesen der Antichrist seinen Sitz aufschlagen werde; Berge und Wälder und Sümpfe, und Kerker und Abgründe sind für mich sicherer; denn in ihnen haben die Propheten, entweder verweilend oder versenkt, durch Gottes Geist geweissagt. Haltet euch also von dem Auxentius, dem Boten des Satans, dem Feinde Christi, dem verdorbenen Verheerer, dem Verläugner des Glaubens entfernt, welchen er vor dem Könige so bekennt hat, daß er täuschte; welcher so getäuscht hat, daß er lästerte. Nun mag derselbe so viele Synoden, als er will, gegen mich zusammenrufen; er mag mich als Ketzer, wie er es schon oft gethan hat, unter einem öffentlichen Vorwande verbannen, und so sehr es ihm beliebt, den Zorn der Machthaber gegen mich aufregen; mir wird er gewiß niemals etwas anders, als ein Teufel seyn; und ich werde nie Frieden mit Einigen wünschen, ausser mit denjenigen, welche der Verhandlung unserer Väter zu Nicäa gemäß die Arianer verfluchen, und Christum den wahren Gott nennen werden.</p><p></p><h2>14</h2><p>Ein Beispiel der Gotteslästerung des Auxentius:</p><p>Den höchst seligen und glorreichen Kaisern, dem Valentinianus Augustus und Valens Augustus, wünscht Auxentius, Bischof der katholischen Kirche der Mailänder, alles Heil.</p><p>„Ich wenigstens, frömmster Kaiser, glaube, es dürfe die Einigkeit von sechshundert Bischöfen nach so großen, durch den Streit weniger Menschen herbeigeführten Arbeiten nicht wieder von solchen gestört werden, welche schon vor zehn Jahren verstoßen worden sind, wie auch die Schriften beurkunden. Weil aber Einige aus dem Volke, welche nie in den Kirchenverein traten, auch nicht unter den Bischöfen, welche vor mir waren, jetzt von Hilarius und Eusebius noch mehr aufgereizt, Einige in ihren Ansichten verwirrten, und mich einen Ketzer nannten; und weil euere Frömmigkeit befahl, es sollten über diese die löblichen Männer der Quästor und der Magister, erkennen; und es sollten, wie ich voraussagte, nicht jene als Ankläger auftreten oder richten, welche einmal abgesetzt worden sind (ich meine aber den Hilarius und diejenigen, welche ihm beistimmen); so gehorchte ich doch euerer Herrlichkeit und trat vor, um die Sache zu enthüllen, indem sie Unwahrheit reden, und lästern, mich einen Arianer und gleichsam einen solchen nennen, welcher nicht bekenne, daß Christus, der Sohn Gottes, Gott sey.</p><h2>15</h2><p>„Ich habe für die Freunde euerer Frömmigkeit mein Bekenntniß hier auseinander gesetzt, indem ich zuerst hinlänglich zeige, daß ich den Arius nie gekannt, ihn nicht mit meinen Augen gesehen, seine Lehre mcht kennen gelernt habe. Ich habe vielmehr von Kindheit auf so, wie ich gelehrt worden bin, und wie ich aus den heiligen Schriften vernommen habe, geglaubt, und glaube noch an Einen einzigen wahren Gott Vater, welcher allmächtig, unsichtbar, leidenlos und unsterblich ist; und an seinen eingebornen Sohn, unsern Herrn Jesum Christum, welcher vor allen Zeiten und vor allem Anbeginne geboren aus dem Vater Gott wahrer Sohn ist, aus dem wahren Gott Vater, wie es geschrieben steht im Evangelium: „Das ist aber das ewige Leben, daß sie dich, den allein wahren Gott, erkennen, und den, welchen du gesandt hast, Jesum Christum.“ Denn durch ihn sind alle Dinge gemacht, die sichtbaren und die unsichtbaren. Ich glaube, daß der, welcher herabgestiegen ist von den Himmeln nach dem Willen des Vaters um unserer Erlösung willen, und welcher geboren ward von dem heiligen Geiste und Maria der Jungfrau dem Fleische nach, wie es geschrieben steht, gekreuzigt unter Pontius Pilatus, und begraben worden ist, daß er am dritten Tage wieder auferstanden und hinaufgefahren ist in die Himmel, daß er zur Rechten des Vaters sitzt, und kommen wird, zu richten die Lebendigen und die Todten. Ich glaube auch an den heiligen Geist, den Tröster, welchen der Herr und Gott unser Erlöser, Jesus Christus, den Jüngern gesandt hat, den Geist der Wahrheit. So habe ich geglaubt, und glaube ich noch, wie auch der einzige Sohn Gottes, als er zum Himmel auffuhr, den Jüngern aufgetragen hat, indem er sprach: Matth. XXVIII, 19. „Gehet hin, lehret alle Völker, und taufet sie im Namen des Vaters, und des Sohnes, und des heiligen Geistes.“</p><h2>16</h2><p>Zwei Götter aber habe ich nie gelehrt; denn es gibt auch nicht zwei Väter, daß zwei Götter genannt würben, und nicht zwei Söhne; sondern es ist Ein Sohn aus Einem Vater, der Alleine von dem Alleinen, Gott aus Gott, wie geschrieben steht: „Ein Gott, der Vater, aus welchem alle Dinge sind, und Ein Herr, Jesus Christus, durch welchen Alles ist;“ weßhalb wir auch Eine Gottheit predigen. Daher sind alle Irrlehren, welche dem katholischen Glauben entgegen sind, zwar immer von den versammelten katholischen Bischöfen verworfen und verflucht, besonders aber von uns, die wir zu Rimini zusammentraten, und seitdem verworfen worden. Die katholische Lehre aber, und die der Evangelien, welche die Apostel überliefert haben, diese haben wir getreu bewahrt. Damit jedoch euere Frömmigkeit dasjenige richtiger einsehen möchte, was in dem Koncilium zu Rimini verhandelt worden ist, so habe ich es übersendet, und bitte, ihr möchtet befehlen, daß dasselbe gefällig gelesen werde. Denn so wird euere Herrlichkeit einsehen, daß die, welche schon lange abgesetzt sind, das ist, Hilarius und Eusebius, sich bemühen, überall Spaltungen zu veranlassen. Denn euere Frömmigkeit sieht gar wohl ein, daß das, was aus den heiligen Schriften des katholischen Glaubens gut erklärt worden ist, nicht noch einmal verhandelt werden müsse.“</p>
