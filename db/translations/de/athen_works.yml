      <p><em>Bittschrift für die Christen, übersetzt von P. Anselm Eberhard (Bibliothek der Kirchenväter, 1. Reihe, Bd. 12, München 1913).</em></p><h2>1</h2><p>Mächtigste Herrscher!</p><p>Obwohl Eure Untertanen die widersprechendsten Sitten und Einrichtungen haben, sieht sich doch keiner aus ihnen durch ein Gesetz und durch die Furcht vor Strafe gezwungen, von der Liebe zu den heimischen Bräuchen abzulassen, sollten diese auch noch so lächerlich sein. Der hier vergöttert seinen Hektor und betet Helena als Adrasteia an; der Lazedämonier verehrt den Agamemnon als Zeus und Phylonoe, die Tochter des Tyndareos, als Hekate Enodia; der Athener opfert dem Erechtheus, den er mit Poseidon identifiziert; auch werden von den Athenern die Agraulos und die Pandrosos, die doch wegen Öffnung der Kiste als Frevlerinnen galten, durch Weihungen und Geheimdienst verehrt. So hat, um es kurz zu sagen, eine jede Nation und ein jeder Volksstamm Opfer und Geheimdienst nach eigener Wahl. Die Ägypter verehren sogar Katzen, Krokodile, Schlangen, Nattern und Hunde als Götter. Und all diese werden weder von Euch noch von den Gesetzen behelligt. Ihr seht eben ein, daß der volle Atheismus Sünde und Frevel ist und daß man einem jeden die Götter seiner Wahl lassen muß, damit die Menschen aus Furcht vor der Gottheit das Unrecht meiden. [Wir dagegen werden angefeindet - wegen des bloßen Namens! O lasset Euch doch nicht wie die urteilslose Menge vom Hörensagen berücken! Denn nicht die Namen verdienen Haß, erst das Unrecht verdient gerichtliche Verfolgung und Strafe.] Daher bewundert auch alles Eure Güte und Milde, Eure unbegrenzte Friedsamkeit und Menschenliebe. Denn es bekommt nicht nur jeder einzelne das ihm gebührende Recht, nicht nur jede Gemeinde die ihrer Stellung entsprechende Anerkennung, sondern dank Eurer weisen Regierung erfreut sich der ganze Erdkreis eines tiefen Friedens. Leider aber erstreckt sich Eure Fürsorge nicht auch auf uns, die sogenannten Christen. Obschon wir kein Unrecht verüben, sondern, wie im Laufe der Rede gezeigt werden soll, sowohl gegen die Gottheit als gegen Eure Herrschaft das Allerpietätvollste, gerechteste Verhalten beobachten, so lasset Ihr doch zu, daß man uns mißhandelt, ausraubt, fortjagt, indem der Pöbel auf den bloßen Namen hin mit uns Krieg führt. Daher haben wir uns ein Herz gefaßt, unsere Angelegenheiten zur Sprache zu bringen (diese Rede soll Euch den Nachweis liefern, daß wir widerrechtlich und gegen alle Satzung und Vernunft Verfolgung leiden), und legen Euch die Bitte vor, auch in unserer Sache nach dem Rechten zu sehen, damit wir nicht länger mehr Schlachtopfer der Angeber sein müssen. Denn unsere Verfolger haben es eigentlich nicht auf unsere Güter abgesehen, wenn sie unsere Bestrafung betreiben, nicht auf unsere bürgerliche Ehre, wenn sie Schimpf auf uns häufen, nicht auf sonst eines der geringeren Güter, wenn sie uns in Schaden stürzen; solche Güter schlagen wir nämlich nicht hoch an, mögen sie auch der Menge erstrebenswert erscheinen. [Denn wir haben die Lehre empfangen, Leute, die uns quälen, nicht ebenfalls zu schlagen, und Leute, die uns vertreiben und ausrauben, nicht einmal vor Gericht zu fordern, sondern ersteren, wenn sie uns schmählich auf die Schläfe schlagen, auch die andere Seite des Kopfes zum Schlage darzubieten und letzteren, wenn sie uns den Leibrock nehmen, auch noch den Mantel auszuliefern.] Nein, unser Leib und unser Leben ist es, worauf die Nachstellungen der Verfolger zielen, wenn es keine Güter mehr bei uns zu holen gibt. So erklären sich auch die vielen Beschuldigungen, die sie über uns ausstreuen. Aber all diese Dinge lassen wir uns nicht einmal in Gedanken beikommen, während sie dagegen jenen Schwätzern und ihrer Zunft wirklich anhaften.</p>
      <h2>2</h2><p>Kann uns jemand ein kleines oder größeres Unrecht nachweisen, dann sind wir die letzten, die um Abwendung der Strafe bitten, ja wir verlangen in diesem Falle die empfindlichste und schonungsloseste Ahndung. Wenn aber die Anklage kein anderes Objekt hat als den Namen (bis zur Stunde bestehen ihre Faseleien über uns in albernem Geschwätz, das einer dem andern nachsagt, und es ist noch keinem Christen ein Unrecht nachgewiesen worden), so ist es nunmehr an Euch, so mächtigen, so menschenfreundlichen und einem aufklärenden Worte gewiß zugänglichen Fürsten, uns durch ein Gesetz gegen die brutale Behandlung in Schutz zu nehmen. Denn wie der ganze Erdkreis Eurer Wohltaten teilhaftig ist, sowohl die einzelnen Bürger als die Gemeinden, so möchten auch wir Euch danken können in dem erhebenden Gefühle, endlich einmal vor den Treibereien der Angeber Ruhe zu haben. Es entspricht nämlich keineswegs Eurer Gerechtigkeit, daß bei uns der Name schwerer ins Gewicht fällt als die im Prozesse konstatierten Tatsachen. Während die Richter über andere Angeklagte nicht eher eine Strafe verhängen, als bis diesen ein Unrecht nachgewiesen ist, untersuchen sie bei uns nicht dies, ob der Angeklagte ein Unrecht begangen hat, sondern sind auf den Namen erbost, wie wenn schon dieser ein Unrecht wäre. Und doch gilt sonst kein Name als solcher für schlecht oder recht, sondern erst wegen der schlechten oder guten Werke, die sich dahinter verbergen, erscheinen die einen Namen als schlimm, die andern als gut. Indes, auf gründliche philosophische Bildung gestützt, wißt Ihr selbst dies besser. Daher kennen auch alle, die vor Euch abgeurteilt werden, auch wenn in ihrem Prozeß gar Wichtiges auf dem Spiele steht, kein Zagen; wissen sie ja doch, daß Ihr ihren Lebenswandel prüfet und weder auf die Namen etwas gebt, wenn nichts dahintersteckt, noch auf die in den Anklagen enthaltenen Beschuldigungen, wenn sie falsch sind. So nehmen sie dann die verurteilende Stimme mit der gleichen Gelassenheit hin wie die freisprechende. Von der gegen alle geübten Unparteilichkeit erwarten nun auch wir, daß wir nicht deshalb gehaßt und bestraft werden, weil wir Christen heißen (wie kann denn der Name uns schlecht machen?), sondern daß bei jeder Anklage, die man gegen uns erhebt, eine Untersuchung stattfindet und dann die von der Anklage Freigesprochenen entlassen, die als schlecht Befundenen bestraft werden, nicht auf den Namen hin (denn kein Christ ist schlecht, es müßte denn nur sein, daß er sich heuchlerisch so nennt), sondern auf Grund des Unrechtes. Das gleiche Gerichtsverfahren sehen wir den Philosophen gegenüber beobachtet. Vor der Untersuchung erscheint keiner von ihnen dem Richter wegen seiner Wissenschaft oder Kunst gut oder schlecht; erst wenn sich bei einem herausgestellt hat, daß er ein Unrecht begangen hat, wird er bestraft; damit bringt er aber keineswegs die Philosophie in Mißkredit; schlecht ist nur ein Philosoph, der sich um ein Gesetz nichts kümmert, die Wissenschaft als solche trifft kein Tadel; kann sich dagegen einer gegen die Verleumdungen rechtfertigen, wird er frei entlassen. So mache man es auch bei uns; man prüfe den Lebenswandel der Angeklagten, der Name selbst aber bleibe vor jeder Anschuldigung verschont.</p><p>Wenn ich mich nun anschicke, unseren Standpunkt zu verteidigen, muß ich Euch, mächtigste Herrscher, bitten, uns unparteiisch anzuhören, und, anstatt Euch durch das alberne Tagesgeschwätz zu einem Vorurteil hinreißen zu lassen, Euren Wissensdrang und Eure Wahrheitsliebe unserer Sache zuzuwenden. Dann werdet weder Ihr infolge mangelhafter Belehrung Fehler machen, noch werden wir länger bekriegt werden, wenn es uns gelingt, die auf dem gedankenlosen Gerede der Menge beruhenden Beschuldigungen zu widerlegen.</p>
      <h2>3</h2><p>Drei Beschuldigungen sind gegen uns gang und gäbe: Atheismus, thyesteische Mahlzeiten, ödipodeische Beilager. Beruht solches auf Wahrheit, o dann schont kein Geschlecht, dann schreitet gegen die Verbrechen ein und rottet uns aus samt Weib und Kind, wofern nämlich wirklich ein Mensch nach Art von Tieren lebt! Doch selbst die Tiere befassen sich nicht mit solchen, die ihnen verwandt sind, und vereinigen sich nach dem Gesetze der Natur und nur zur Brunstzeit, nicht willkürlich; auch kennen sie ihre Wohltäter. Wenn nun einer wilder lebt als selbst die Tiere, welche Strafe wird er dafür erleiden müssen, um nach Gebühr bestraft zu sein? Wenn aber jene Beschuldigungen nur Faseleien sind, nur Ausgeburten der Verleumdungssucht (denn ganz naturgemäß liegt der Tugend die Schlechtigkeit gegenüber und Gegensätze streiten miteinander nach göttlicher Anordnung), wenn Ihr selbst uns das Zeugnis gebt, daß wir nichts solches verüben, indem Ihr uns auffordert, kein Geständnis abzulegen, so verbleibt Euch die Pflicht, unseren Lebenswandel, unsere Grundsätze, unsere Ergebenheit und Dienstbeflissenheit gegen Euch und Euer Haus und Eure Regierung zu untersuchen und uns so endlich - nicht weiter entgegenzukommen als unsern Verfolgern. Dann werden wir über sie siegen, treten wir ja doch unbedenklich sogar mit unserm Leben für die Wahrheit in die Schranken.</p>
      <h2>4</h2><p>Da wir nun tatsächlich keine Atheisten sind (ich will jetzt jeder Beschuldigung einzeln entgegentreten), so wäre es ein Armutszeugnis, die Anklagen wegen Atheismus nicht widerlegen zu können. Einem Diagoras warfen die Athener mit Recht Atheismus vor, da dieser nicht nur die orphische Lehre mitteilte, und die Mysterien zu Eleusis und die der Kabiren im Volke bekannt machte und das Holzbild des Herkules zusammenschlug, um seine Rüben zu kochen, sondern ganz unverhohlen erklärte, es existiere überhaupt kein Gott. Kann man aber uns, die wir Gott von der Materie wohl unterscheiden und den Beweis liefern, daß die Materie etwas anderes ist als Gott und daß der Abstand ein gewaltiger ist (wir weisen nämlich nach, daß das göttliche Wesen ungeworden und ewig ist, nur dem denkenden Geiste erfaßbar, die Materie dagegen geworden und vergänglich), kann man uns, frage ich, mit Recht Atheisten nennen? Hätten wir die Weltanschauung eines Diagoras, obwohl wir so sichere Unterpfänder für unsere Gottesverehrung haben, nämlich die Ordnung, die alles beherrschende Harmonie, die Größe, die Schönheit, die Gestalt, die Planmäßigkeit der Welt, dann würden wir freilich mit Recht als gottlos verschrieen und wären selbst daran schuld, wenn man uns mißhandelt. Nachdem wir aber das Bekenntnis ablegen, daß einer Gott ist, nämlich der Schöpfer dieses Universums, der selbst nicht geworden ist, weil das Notwendigseiende nicht wird, sondern nur das Möglichseiende, der aber alles durch sein Wort gemacht hat, so erleiden wir beides, sowohl die übel Nachrede als die Verfolgung, ohne jeden vernünftigen Grund.</p>
      <h2>5</h2><p>Sowohl Dichter als Philosophen galten nicht für Atheisten, wenn sie Behauptungen über Gott aufstellten. Schon Euripides äußerte Bedenken gegen die Götter des blinden Volksglaubens:</p><p>„Es sollte Zeus, wenn wirklich er im Himmel herrscht, Kein Unglück bringen über einen solchen Mann“.</p><p>Von dem aber, der in wissenschaftlicher Weise als Gott gedacht wird, lehrte er:</p><p>„Siehst du, wer hoch den unbegrenzten Äther dort Und auch die Erde rings mit weichem Arm umfängt? O diesen nenne Zeus, er gelte dir als Gott.“</p><p>Was die Götter anlangt, so sah er nämlich, daß weder ihre Wesenheiten existieren, denen dann der geeignete Name beigelegt werden könnte („Was Zeus ist, Zeus, kenn ich vom Hörensagen nur“), noch daß ihre Namen auf Grund von Tatsachen ausgesagt werden (denn was sollten die, deren Wesenheiten nicht existieren, mehr haben als die bloßen Namen?); Gott aber (sah er) aus den Werken, indem er die sichtbaren Erscheinungen der Luft, des Äthers, der Erde mit einem Ausblick in das Unsichtbare betrachtete. Den also, dem die Werke zukommen und von dem die Werke durch den Geist gelenkt werden, ließ er als Gott gelten (und dem stimmt auch Sophokles bei:</p><p>„Nur einer ist wahrhaftiglich, nur einer Gott, Er, der den Himmel und die weite Erde schuf“),</p><p>wobei er (Euripides) im Hinblicke auf die Natur Gottes, welche mit der Schönheit Gottes beides (Himmel und Erde) anfällt, sowohl nachwies, wo Gott sein muß, als auch, daß er einer sein muß.</p>
      <h2>6</h2><p>Auch Philolaos liefert mit seiner Behauptung, alles sei von Gott wie in einer Warte umfaßt, einen Beweis sowohl von der Einheit Gottes als auch von dessen Erhabenheit über die Materie. Lysis und Opsimos gehören ebenfalls hierher; der eine definiert Gott als eine irrationale Zahl, der andere als die Differenz zwischen der größten Zahl und der ihr am nächsten stehenden; wenn nun nach der Lehre der Pythagoreer Zehn die größte Zahl ist (sie ist nämlich die Summe der ersten vier Zahlen und enthält alle arithmetischen und symmetrischen Verhältnisse) und wenn ihr die Zahl Neun nahe liegt, so ist Gott die Einheit, d. h. er ist einer; denn um eins überragt die größte Zahl diejenige Zahl, welche für sie die nächstliegende kleinste ist. Nun zu Plato und Aristoteles! Übrigens will ich die Aussagen der Philosophen über die Gottheit nicht durchgehen wie einer, der ihre Lehrmeinungen ausführlich darstellt; denn ich weiß, daß Ihr, wie Ihr alle im Herrschen an Weisheit und Kraft übertrefft, so auch allen an allseitiger, gründlicher Bildung überlegen seid; leistet Ihr ja doch in jedem einzelnen Bildungsfache mehr als selbst die Spezialisten. Weil aber der Nachweis, daß wir nicht die einzigen sind, welche Gott auf die Einzahl beschränken, ohne Beifügung von Namen nicht geliefert werden kann, so griff ich zu Zitaten. Plato also sagt: „Schwer ist es, den Schöpfer und Vater dieses Alls zu finden, und wenn man ihn gefunden hat, ist es unmöglich, ihn allen zu verkünden“. Dabei faßt er den ungewordenen und ewigen Gott als einen einzigen auf. Wenn er aber auch andere kennt, wie Sonne, Mond und Sterne, so kennt er sie doch nur als gewordene. „Götter von Göttern, deren Bildner ich bin, und Vater der Werke, die unauflösbar sind, solange ich (die Auflösung) nicht will; alles Zusammengesetzte ist also lösbar“. Ist nun Plato kein Atheist, wenn er den ungewordenen Gott, den Bildner aller Dinge, als den einzigen auffaßt, dann sind auch wir keine Atheisten, wenn wir den als Gott kennen und festhalten, durch dessen Wort alle Dinge gebildet worden sind und durch dessen Geist sie zusammengehalten werden. Auch Aristote1es und seine Schüler betrachten Gott als einen, der jedoch wie ein animalisches Wesen zusammengesetzt sei; sie lassen ihn aus Leib und Seele bestehen das Ätherische, nämlich die Planeten und die Fixsternsphäre mit ihren kreisförmigen Bewegungen, halten sie für seinen Leib; die Vernunft, welche über die Bewegung dieses Leibes wacht und, ohne selbst bewegt zu werden, dessen Bewegung verursacht, für seine Seele. Ferner können wir uns auf die Stoiker berufen. Sie geben zwar in ihren Aussagen der Gottheit viele Namen, je nach den Veränderungen der angeblich vom Geiste Gottes durchdrungenen Materie, in Wirklichkeit aber kennen sie doch nur einen einzigen Gott. Denn wenn Gott das gestaltende Feuer ist, das seinen Weg wandelt, um die Welt hervorzubringen, und alle samenartigen Vernunftgründe in sich einschließt, nach denen die Einzeldinge mit unabänderlicher Schicksalsbestimmung entstehen, wenn überhaupt sein Geist die ganze Welt durchdringt, so ist eben Gott nach stoischer Auffassung nur einer, der nach dem feurigen Teil der Materie den Namen Zeus, nach der Luft den Namen Hera bekommt, und so auch die übrigen Namen nach jedem einzelnen Teile der von ihm durchschrittenen Materie.</p>
      <h2>7</h2><p>Fast alle, die auf die Weltprinzipien zu sprechen kommen, sind selbst gegen ihren Willen darüber einig, daß die Gottheit nur eine ist, und sie dürfen über die Gottheit ungehindert reden und schreiben, was sie wollen. Wenn aber dann wir behaupten, daß der Ordner dieses Alls der eine Gott ist, so steht uns unbegreiflicher Weise ein Gesetz entgegen, obwohl wir das von uns Erkannte und richtig Geglaubte, nämlich die Einheit Gottes, mit sicheren Anzeichen und Gründen darzutun vermögen. Dichter und Philosophen traten nämlich wie an andere so auch an dieses Thema nur mit Vermutungen heran, wobei zwar jeder je nach dem Grade seiner Empfänglichkeit für das göttliche von seinem eigenen Inneren sich angeregt fühlte zu suchen, ob er die Wahrheit finden und verstehen könne, aber doch nur soviel Erfolg hatte, daß er sich allerlei Gedanken machte, ohne aber das Seiende wirklich zu finden; denn er suchte nicht bei Gott Belehrung über Gott sondern nur bei sich selbst. Daher haben sie auch über Gott und Materie, über Ideen und Welt widersprechende Lehren aufgestellt. Wir dagegen haben für unsere Erkenntnis und für unseren Glauben die Propheten zu Zeugen, die in der Kraft des göttlichen Geistes über Gott und göttliche Dinge Offenbarungen gegeben haben. Auch Ihr, die ihr durch Eure Einsicht und durch Eure Frömmigkeit gegen das wahrhaft göttliche die andern überraget, dürftet zugeben, daß es unvernünftig ist, von der gläubigen Hingabe an den göttlichen Geist, der den Mund der Propheten wie (der Musiker) ein Instrument rührte, abzulassen und sich nach Menschenmeinungen zu richten.</p>
      <h2>8</h2><p>Daß also Gott, der Schöpfer dieses Alls, von Ewigkeit her nur einer ist, dafür nehmet, damit Ihr auch eine rationelle Rechtfertigung unseres Glaubens habt, folgenden Beweis entgegen. Gäbe es von Ewigkeit her zwei Götter oder mehr, so befänden sie sich entweder in einem und demselben (übergeordneten) Wesen oder jeder von ihnen wäre für sich. Nun aber könnten sie nicht in einem und demselben Wesen sein; denn wenn sie Götter sind, sind sie nicht zusammenstimmend, sondern, weil ungeworden, widersprechend, denn nur das Gewordene stimmt mit seinen Vorbildern überein; ungewordene Wesen würden einander widersprechen, da sie weder von einem andern Wesen noch im Hinblick auf andere Wesen gemacht sind. Sollten jene jedoch in der Weise integrierende Bestandteile einer Einheit sein, wie etwa die Hand, Auge, Fuß integrierende Bestandteile eines Organismus sind, dann wäre allerdings Gott auch wieder einer; indes so etwas (= eine Zusammensetzung aus Teilen) ist etwa bei Sokrates der Fall; dieser ist, weil er geworden und vergänglich ist, zusammengesetzt und teilbar; Gott aber als der Ungewordene und über jede Veränderung Erhabene ist unteilbar; er besteht also überhaupt nicht aus Teilen. Und nun zur zweiten Annahme! Ist jeder der Götter für sich und ist der, welcher die Welt erschaffen hat, über den gewordenen Dingen, über dem, was er geschaffen und geordnet hat, wo soll dann der andere Gott sein oder die sonst noch übrigen? Ist nämlich die Welt als ein kugelförmiges Gebilde durch die Himmelskreise abgeschlossen und befindet sich der Schöpfer der Welt über den gewordenen Dingen, sich lediglich durch seine Fürsorge manifestierend, welches ist dann der Ort des anderen Gottes, beziehungsweise der anderen? Denn der andere befände sich weder in der Welt, da diese einem anderen Gott gehört, noch um die Welt, da über der Welt sich der Gott befindet, der die Welt geschaffen hat. Wenn er aber weder in der Welt ist noch m die Welt (denn ringsum wird alles von diesem eingenommen), wo ist er dann? Etwa über der Welt und ihrem Gott in einer anderen Welt und um eine andere? Aber wenn er in einer anderen Welt ist und um eine andere, so ist er nicht um uns (er hat dann gar keine Herrschaft über die Welt) und hat auch keine große Macht (denn er ist an einem durch Grenzen eingeschränkten Orte). Wenn er nun weder in einer anderen Welt ist (denn alles wird von jenem Gotte ausgefüllt) noch um eine andere (denn alles wird von jenem Gotte eingenommen), so ist er überhaupt nicht, da es keinen Ort gibt, wo er sein könnte. Oder was hätte er zu tun, wenn es einen andern Gott gibt, dem die Welt gehört, und er selbst zwar über dem Schöpfer der Welt ist, jedoch nicht in der Welt und um die Welt? [Oder gibt es vielleicht unter dem Seienden etwas, wo der Gewordene seinen Ort haben kann? Dann sind aber Gott und die Werke Gottes über ihm. Und welches sollte sein Ort sein, da, was über der Welt ist, dieser ausfüllt?] Kann er etwa Fürsorge tragen? Auch das kann er nicht, wenn er nicht zuvor schöpferisch tätig war. Wenn er aber nicht schafft und nicht sorgt, wenn überhaupt kein Ort übrig bleibt, an dem er sein könnte, so gibt es eben nur einen Gott, der da von Ewigkeit her existiert und allein der Schöpfer der Welt ist.</p>
      <h2>9</h2><p>Begnügten wir uns jetzt mit derartigen Erwägungen, so müßte man meinen, unsere Rechtfertigung sei Menschenwort. Nachdem aber auch die Aussprüche der Propheten unsere Beweisführungen beglaubigen (bei Eurer seltenen Wißbegierde und Eurem hohen Bildungsgrad werdet Ihr selbst schon von den Aussprüchen eines Moses, Isaias, Jeremias und der übrigen Propheten vernommen haben, die, ihrem eigenen Denken entrückt, unter der Einwirkung des Heiligen Geistes, was ihnen eingegeben wurde, verkündeten, wobei sich der Geist ihrer bediente, wie wenn ein Flötenspieler die Flöte bläst), so laßt uns hören, was diese sagen. „Herr ist unser Gott; neben ihm kann kein anderer in Betracht kommen“; und wiederum: „Ich bin Gott vorher und nachher und außer mir gibt es keinen Gott“. In ähnlicher Weise: „Vor mir war kein anderer Gott und keiner wird nach mir sein; ich bin Gott und außer mir ist keiner“. Und von seiner Größe heißt es: „Der Himmel ist mein Thron und die Erde der Schemel meiner Füße. Welches Haus wollt ihr mir erbauen oder welches soll der Ort meiner Wohnung sein?“ Ich überlasse es Euch, diese Schriften selbst einzusehen und die Aussprüche jener Männer genauer zu prüfen, damit Ihr mit der gehörigen Einsicht den brutalen Mißhandlungen, mit denen man uns quält, ein Ende macht.</p>
      <h2>10</h2><p>Daß wir also keine Atheisten sind, ist von mir hinlänglich dargetan. Denn jener eine ist unser Gott, der da ungeworden und ewig ist, unsichtbar, unwandelbar, unbegreiflich, unfaßbar, nur mit Verstand und Vernunft erkennbar, von Licht und Schönheit, von Geist und Kraft in unaussprechlich hohem Grade umgeben, von dem durch sein Wort das All geschaffen und geordnet ist und regiert wird. Indes kennen wir auch einen Sohn Gottes. Halte es ja niemand für lächerlich, daß Gott einen Sohn habe! Denn unsere Gedanken über Gott Vater und Sohn weichen gar sehr von den Mythen der Dichter ab, die die Götter nicht im mindesten besser sein lassen als die Menschen; der Sohn Gottes ist das Wort (Logos) des Vaters als vorbildlicher Gedanke und schöpferische Kraft; denn nach ihm und durch ihn ist alles gemacht; Vater und Sohn sind eins. Da der Sohn im Vater und der Vater im Sohne ist durch die Einheit und Kraft des Geistes, so ist der Sohn Gottes der Gedanke (Nus) und das Wort (Logos) des Vaters. Sollte Euch aber bei Eurer überlegenen Einsicht die Frage belieben, was der Ausdruck Sohn bedeutet, so will ich Euch in Kürze folgendes antworten: Er ist dem Vater das Erst-Erzeugte, nicht als ob er geworden wäre; denn von jeher hatte Gott als ewiger Gedanke selbst das Wort in sich, da er nie ohne das Wort ist; sondern der Sohn ist hervorgegangen, um für alles Körperliche, das anfangs noch als qualitätslose Naturmasse ohne alles Leben existierte, wobei die dichteren Teile noch mit den leichteren vermischt waren, vorbildlicher Gedanke und schöpferische Kraft zu sein. Hiermit stimmt auch der prophetische Geist überein: „Der Herr“, sagt er, „hat mich erzeugt im Anfang seiner Wege für seine Werke“ ). Indes ist nach unserer Lehre auch der Heilige Geist, welcher sich in den Propheten wirksam erweist, ein Ausfluß Gottes, ausfließend und zurückkehrend wie ein Sonnenstrahl. Wer sollte sich da noch auskennen, wenn er Leute, die einen Gott Vater und einen Gott Sohn und einen Heiligen Geist bekennen und nachweisen, daß dieselben mächtig sind in der Einigung und verschieden in der Ordnung, als Atheisten verschreien hört? Doch bleibt der theologische Teil unserer Lehre nicht dabei stehen, sondern wir lehren auch eine Menge von Engeln und Dienern, welche Gott, der Schöpfer und Bildner der Welt, durch sein Wort verteilt und aufgestellt hat, damit sie über die Elemente und die Himmel, über die Welt, die Dinge in der Welt und deren Ordnung wachen.</p>
      <h2>11</h2><p>Daß ich unsere Lehre ausführlich behandle, möge Euch nicht befremden. Denn ich tue dies deswegen, damit Ihr Euch nicht von der unvernünftigen Tagesmeinung mitfortreißen laßt, sondern Einblick in die Wahrheit bekommt. Schon durch die bloßen Lehrsätze, an denen wir festhalten (diese sind eben nicht Menschenweisheit, sondern göttliche Aussprüche und Offenbarungen), können wir Euch überzeugen, daß wir keine Atheisten sind. Welches sind also unsere Lehren, in denen wir erzogen werden? „Ich sage euch: Liebet eure Feinde, segnet, die euch fluchen, betet für die, die euch verfolgen, damit ihr Kinder werdet des Vaters in den Himmeln, der seine Sonne aufgehen läßt über Böse und Gute und regnen läßt über Gerechte und Ungerechte“. Gestattet hier, da diese Lehre weithin hörbar mit lautem Schall ergangen ist, von der Redefreiheit Gebrauch zu machen, wie dies einer tun darf, der vor Herrschern steht, die Philosophen sind! Welche unter denen, die die Schlüsse entwickeln und die doppelsinnigen Aussprüche lösen und die Wortbedeutungen feststellen, oder unter denen, die das Homonyme und das Synonyme, die Aussageweisen und die Axiome, die Substanz und das Prädikat erklären (dabei versprechen sie, ihre Schüler durch diese und ähnliche Lehren glücklich zu machen), haben eine solche Reinheit der Seele, daß sie ihre Feinde nicht hassen, sondern sogar lieben und denen, die ihnen zuerst Schmach zugefügt haben, nicht übles nachreden (solchen Übles nur nachzureden wäre für sie schon der höchste Grad der Mäßigung), sondern sie sogar segnen und für die, welche ihnen nach dem Leben streben, sogar beten? Im Gegenteil, sie fragen einander immer in böser Absicht nach den obengenannten Geheimnissen aus und wollen immer etwas Böses ins Werk setzen, da sie sich kunstvolles Spiel mit Worten, aber nicht Aufzeigung von Werken zur Aufgabe gemacht haben. Bei uns dagegen könnt Ihr ungebildete Leute, Handwerker und alte Mütterchen finden, die, wenn sie auch nicht imstande sind, mit Worten die Nützlichkeit ihrer Lehre darzutun, so doch durch Werke die Nützlichkeit ihrer Grundsätze aufzeigen. Denn nicht auswendig gelernte Worte sagen sie her, sondern gute Taten zeigen sie auf: geschlagen nicht wieder zu schlagen, ausgeraubt nicht zu prozessieren, den Bittenden zu geben, die Nebenmenschen wie sich selbst zu lieben.</p>
      <h2>12</h2><p>Würden wir uns nun solcher Reinheit befleißen, wenn wir nicht glaubten, daß Gott über der Menschheit walte? Gewiß nicht; sondern weil wir überzeugt sind, daß wir Gott, der uns und die Welt erschaffen hat, über unser ganzes Erdenleben einst Rechenschaft geben müssen, deshalb entscheiden wir uns für das maßvolle, menschenfreundliche und unscheinbare Leben, im Glauben, daß uns hier auf Erden, selbst wenn man uns das Leben nimmt, kein Übel zustoßen wird, das so groß ist wie die Güter, die wir im Jenseits aus der Hand des erhabenen Richters für unser sanftmütiges, menschenfreundliches und anständiges Leben erhalten werden. Plato sagte, Minos und Rhadamanthys werden die Bösen richten und strafen, wir dagegen sagen, daß selbst ein Minos und Radamanthys und deren Vater dem Gerichte Gottes nicht entgehen wird. Und da gelten dann Leute, die das gegenwärtige Leben für gleichbedeutend halten mit: "Lasset uns essen und trinken; denn morgen müssen wir sterben“ und den Tod als einen tiefen Schlaf und als ein vollständiges Vergessen auffassen („Schlaf und Tod sind Zwillingsbrüder“ ), für Gottesverehrer! Wir hingegen, die wir uns darüber klar geworden sind, daß das Erdenleben nur weniges und geringes wert ist, die wir uns einzig von der Erkenntnis des wahren Gottes und seines Wortes leiten lassen (nämlich von der Erkenntnis, welches die Einheit des Sohnes mit dem Vater, welches die Gemeinschaft des Vaters mit dem Sohne ist, was der Geist ist, was die Einigung solcher Größen und der Unterschied der Geeinigten ist, nämlich des Geistes, des Sohnes und des Vaters), die wir ferner wissen, daß das künftige Leben noch viel besser ist, als es sich mit Worten ausdrücken läßt, vorausgesetzt, daß wir von aller Ungerechtigkeit rein vor Gott erscheinen, die wir endlich bis zu dem Grade voll Menschenliebe sind, daß wir nicht nur die Freunde lieben („wenn ihr nur die liebt“, heißt es, „die euch lieben, und nur denen leiht, die euch leihen, welchen Lohn werdet ihr dann bekommen?“), wir sollten, nachdem wir so sind und um dem Gerichte zu entgehen so leben, nicht als Gottesverehrer gelten? Dieses Kleine aus dem Großen, dieses Wenige aus dem Vielen möge genügen, damit wir Euch nicht zu lange aufhalten; auch wer Honig oder Molken versucht, schließt von einem kleinen Teile des Ganzen auf die Güte des Ganzen.</p>
      <h2>13</h2><p>Die meisten von denen, die gegen uns (im allgemeinen) den Vorwurf des Atheismus erheben, haben keine Ahnung vom Wesen Gottes; sie haben nicht gehört und sehen auch nicht ein, wie man das Dasein Gottes aus der Natur beweist und was die Theologie darüber lehrt. Da sie infolgedessen die Frömmigkeit nur nach der Art der Opfer bemessen, so halten sie uns (speziell) zweierlei vor, nämlich daß wir nicht opfern und nicht an die nämlichen Götter glauben wie der Staat. Betrachtet mir nun, Herrscher, diese beiden Vorwürfe in folgender Weise, und zwar zuerst den, daß wir nicht opfern! Der Bildner und Vater dieses Alls bedarf keines Blutes und keines Fettduftes und auch keines Wohlgeruches von Blumen und Räucherwerk, da er selbst der vollkommenste Wohlgeruch ist und weder in sich selbst noch von außen her etwas mangelt. Jedoch ist es ihm das liebste Opfer, wenn wir zu erkennen suchen, wer die Himmel ausspannte und wölbte und die Erde als Mittelpunkt hinsetzte, wer das Wasser in Meeren sammelte und das Licht von der Finsternis schied, wer den Äther mit Sternen schmückte und der Erde jeglichen Samen entsprießen ließ, wer die Tiere ins Dasein rief und den Menschen bildete. Wenn wir uns also an Gott anschließen, den Bildner, der alles zusammenhält und überschaut mit jener Weisheit und Kunst, mit der er alles leitet, und heilige Hände zu ihm erheben, wie sollte er da noch einer Hekatombe bedürfen? (Von den Göttern heißt es:)</p><p>„Diese vermag durch Räuchern und demutsvolle Gelübde, Durch Weinguß und Gedüft ein Sterblicher umzulenken, Bittend mit Flehn, wann sich einer versündiget oder gefehlet.“</p><p>(Der wahre Gott aber spricht:) „Wozu brauche ich Brandopfer, deren Gott nicht bedarf? Wozu Opfergaben, da man mir ein unblutiges Opfer schuldet, einen Gottesdienst im Geiste?“</p>
      <h2>14</h2><p>Aber auch das Gerede, daß wir uns nicht an die nämlichen Götter wenden und an sie glauben wie der Staat, ist vollendete Torheit. Denen, die uns Atheismus vorwerfen, weil wir nicht an die nämlichen Götter glauben wie sie, gelingt es nicht einmal, unter sich eine einheitliche Auffassung von den Göttern zu gewinnen. So haben sich die Athener den Keleos und die Metaneira als Götter aufgestellt, die Lazedämonier den Menelaos, den sie durch Opfer und Feste ehren; die Ilier können nicht einmal den Namen des letzteren ausstehen; dagegen lassen sie sich den Hektor (als Gott) gefallen; die Keer den Aristaios, den sie mit Zeus und Apollo identifizieren, die Thasier den Theagenes, von dem sogar ein Totschlag zu Olympia verübt wurde, die Samier den Lysandros nach so vielen Mordtaten, so vielen Schlechtigkeiten, [Alkman und Hesiodos die Medeia oder] die Kiliker die Niobe, die Sizilier den Philippos, den Sohn des Butakides, die Amathusier den Onesilaos, die Karthager den Hamilkar. Der Tag wird mir zu Ende gehen, wenn ich die ganze Menge aufzähle. Wenn sie nun selbst über ihre eigenen Götter nicht einig werden, wie können sie es dann uns zum Vorwurf anrechnen, daß wir mit ihnen nicht übereinstimmen? Geradezu komisch ist das Treiben der Ägypter; sie schlagen sich nämlich in den Tempeln bei ihren Festversammlungen auf die Brust, wie wenn ihre Götter gestorben wären, und opfern ihnen gleichwohl als Göttern. Doch darf uns dies nicht befremden; denn sie halten sogar die Tiere für Götter, balsamieren sie ein, wenn sie verendet sind, begraben sie in den Tempeln und veranstalten öffentliche Trauerklagen. Sind wir nun deshalb, weil wir nicht in demselben Sinne wie sie Gottverehrer sind, schon Atheisten, o, dann muß dieser Vorwurf alle Städte und Länder treffen; denn nicht die nämlichen Götter gelten bei allen.</p>
      <h2>15</h2><p>Ja selbst wenn alle die gleichen Götter hätten, was würde daraus folgen? Nachdem der große Haufe nicht unterscheiden kann, was Stoff und was Gott ist und wie groß der Unterschied ist zwischen beiden, und sich infolgedessen zu den aus Stoff gefertigten Götterbildern wendet, sollen darum auch wir, die wir doch das Ungewordene und das Gewordene, das Seiende und das Nichtseiende, das geistig und das sinnlich Wahrnehmbare scharf scheiden und jedem den ihm gebührenden Namen geben, die Götterstatuen besuchen und anbeten? Sind Stoff und Gott ein und dasselbe, nur zwei Namen für eine Sache, dann sind wir freilich keine Gottesverehrer, da wir Stein und Holz, Gold und Silber nicht für Götter halten. Sind aber Stoff und Gott voneinander völlig verschieden, etwa so, wie der Handwerker und das zu seinem Handwerk nötige Material, warum macht man uns dann Vorwürfe? Denn wie der Töpfer und der Lehm sich zueinander verhalten (der Lehm ist der Stoff, der Töpfer der Handwerker), so ist auch Gott der Bildner, der Stoff aber das, was ihm zu seinem Schaffen zur Verfügung steht. Wie aber der Lehm von selbst nicht zu Geschirren werden kann ohne Bearbeitung, so nahm auch die zur Aufnahme aller möglichen Formen bereitwillige Materie ohne den bildenden Gott nicht Scheidung, Gestalt und Ordnung an. Wie wir nun den Ton nicht für vornehmer halten als seinen Bearbeiter und die Schalen und Goldgefäße nicht für vornehmer als den Schmied, sondern wegen des Kunstreichen, das sich etwa an ihnen findet, den Künstler loben und eigentlich dieser den Ruhm erntet, der seinen Werken zuteil wird, so darf auch, wenn von Stoff und Gott die Rede ist, für die Ordnung in der Welt nicht der Stoff den Ruhm und die Ehre bekommen, sondern nur Gott, der Bildner des Stoffes. Wir würden daher, falls wir die stofflichen Gebilde als Götter verehrten, den Anschein erwecken, als wüßten wir nichts vom wahren Gott, wenn wir nämlich das Auflösbare und Vergängliche auf gleiche Stufe wie das Ewige stellten.</p>
      <h2>16</h2><p>Gewiß ist die Welt schön, imposant durch ihre Ausdehnung, durch die Stellung der Himmelskörper im Tierkreis und um den Bären, und durch ihre Kugelgestalt; aber deswegen verdient sie noch keine Anbetung; wohl aber verdient eine solche ihr erhabener Künstler. So wenden sich auch Eure Untertanen, wenn sie zu Euch kommen, nicht an Eure prunkvolle Residenz, anstatt Euch, den Herrn und Gebietern, bei denen sie die Erfüllung ihrer Bitten finden könnten, ihre Aufwartung zu machen, sondern Ihr selbst seid in ihrer Wertschätzung alles in allem; den schönen Fürstenpalast bewundern sie nur nebenbei. Außerdem baut Ihr Fürsten Eure Paläste für Euch; die Welt aber ist keinem Bedürfnis entsprungen; denn Gott ist alles selber: unnahbares Licht, vollendete Schönheit, Geist, Kraft, Wort. Und wenn die Welt ein wohlgestimmtes, rhythmisch bewegtes Musikinstrument ist, so bete ich nicht das Instrument an, sondern den, der es gestimmt hat, der ihm die Töne entlockt und das der Melodie des Spieles entsprechende Lied dazu singt. Auch bei den Bewerbern im musischen Wettkampf übergehen die Preisrichter nicht die Zitherspieler und bekränzen statt dieser die Zithern. Ist also die Welt, wie Plato sagt, Gottes Kunstwerk, so bewundere ich zwar ihre Schönheit, wende mich aber im übrigen an ihren Künstler. Ist sie, wie die Peripatetiker wollen, Substanz und Leib, so unterlassen wir es nicht, dem Gotte, der die Bewegung dieses Leibes bewirkt, unsere Huldigung darzubringen; nicht vor den armseligen, ohnmächtigen Elementen fallen wir nieder; nicht beten wir wie jene nebst der unbildsamen Luft die bildsame Materie an. Denkt sich ferner jemand die Teile der Welt als Kräfte Gottes, so wenden wir uns wieder nicht an die Kräfte, um sie zu verehren, sondern an deren Schöpfer und Beherrscher. Ich bitte nicht die Materie um Dinge, die sie nicht hat; auch verehre ich nicht mit Übergehung Gottes die Gestirne, die nichts weiter vermögen als den Befehlen, die an sie ergehen, zu gehorchen; denn wenn sie auch infolge der Kunst ihres Bildners schön anzusehen sind, so sind sie doch wegen der Natur der Materie vergänglich, Dies bezeugt auch Plato; er sagt: „Was man Himmel und Welt genannt hat, hat vom Vater viel Erfreuliches mitbekommen; aber nun hat es auch einen Körper erhalten; folglich kann es nicht ohne Veränderung bleiben“. Wenn ich also nicht einmal den Himmel und die Gestirne, die ich doch wegen ihrer Kunst bewundere, als Götter verehre, wie kann ich dann solche Werke, deren Verfertiger unzweifelhaft Menschen sind, Götter nennen?</p>
      <h2>17</h2><p>Und nun in Kürze noch folgende Betrachtung! Der Apologet muß nämlich noch deutlichere Beweise dafür beibringen, daß die Namen (der Götter) neueren Datums sind und daß die Bilder sozusagen erst gestern und vorgestern entstanden sind. Freilich wißt Ihr selbst das besser, da Ihr Euch gründlich und mehr als alle andern mit dem Altertum beschäftigt. Ich stelle also den Satz auf: Orpheus, Homer und Hesiod sind es, die das, was sie Götter nennen, in Genealogien eingeteilt und mit Namen bezeichnet haben. Dies bezeugt auch Herodot: "Hesiod und Homer sind nach meiner Schätzung vierhundert Jahre älter als ich, nicht mehr; sie sind es, die den Griechen eine Theogonie gegeben haben, indem sie die Götter mit Namen benannten, Ehren und Künste an sie verteilten und ihre Gestalten beschrieben“. Solange es noch keine aus Thon bildende, keine malende und keine statuenschaffende Kunst gab, kamen die Bilder überhaupt nicht in Betracht. Später wurde es anders; es traten Saunas aus Samos, Kraton aus Sikyon, Kleanthes aus Korinth und Kore aus Korinth (das korinthische Mädchen) auf; von Saunas, der im Sonnenschein den Umriß (die Silhouette) eines Pferdes zeichnete, wurde die Schattenzeichnung erfunden, von Kraton, der auf eine weiße Tafel die Schattenbilder eines Mannes und einer Frau mit Farbe auftrug, die Malerei, vom Mädchen Kore die Koroplastik (Terrakottabildnerei); sie zeichnete nämlich das Schattenbild ihres schlafenden Geliebten auf eine Wand, worauf ihr Vater, welcher in Ton arbeitete, die Zeichnung aushöhlte und mit Lehm füllte; der Abdruck wird heute noch in Korinth aufbewahrt. Auf diese folgten Daidalos, Theodoros und Smilis und erfanden weiterhin die statuenschaffende und bildende Kunst. Die Zeit also für die Bilder und für die Entstehung der Götterstatuen ist so kurz bemessen, daß man den Verfertiger eines jeden Gottes angeben kann. Die Statue der Artemis zu Ephesus und die der Athene (richtiger Athele; denn es war eine Athele, wie diejenigen sagen, die mit den Mysterien besser bekannt sind; so hieß nämlich die alte Statue aus Olivenholz) und die Thronende (Athene) hat Endoios geschaffen, ein Schüler des Daidalos; der Pythier (Apollon) ist eine Schöpfung des Theodoros und Telekles, der Delier (Apollon) und die Artemis sind Werke des Tektaios und Angelion; die samische und argivische Hera gingen aus der Hand des Smilis hervor; [von Pheidias stammen die übrigen Götterbilder;] die knidische Aphrodite, die Hetäre, stammt von Praxiteles, der epidaurische Asklepios von Pheidias. Kurz, keines dieser Götterbilder kann sich rühmen, etwas anderes zu sein als Menschenwerk. Wenn sie Götter sind, warum waren sie nicht von Anfang an? Warum sind sie jünger als ihre Verfertiger? Was brauchten sie zu ihrer Entstehung menschliche Kunst? Erde sind sie und Steine und Holz und verschwendete Kunst.</p>
      <h2>18</h2><p>Darauf wissen nun einige folgendes zu entgegnen: Allerdings sind das nur Bilder, aber die Dargestellten sind Götter; sowohl die Wallfahrten, die man zu den Bildern macht, als auch die Opfer beziehen sich auf die Götter und gelten diesen; auch gibt es keine andere Weise, sich den Göttern zu nähern („schwer sind ja erscheinende Götter dem Anblick“). Und um die Richtigkeit dieses ihres Einwandes darzutun, weisen sie auf die Wirkungen hin, die von einigen Götterbildern ausgehen. Daher wollen wir jetzt die Macht derselben untersuchen, die sich an die Namen knüpft. Bevor ich aber meine Darlegung beginne, muß ich Euch, mächtigste Herrscher, um Nachsicht bitten wenn ich unwiderlegliche Beweise beibringe. Ich greife ja die Götterbilder nicht vorsätzlich an, sondern will hiermit nur die gegen uns üblichen Verleumdungen entkräften und eine Rechtfertigung unseres Glaubens geben. (O möchtet Ihr doch, von Euch selbst ausgehend auch die himmlische Herrschaft verstehen lernen! Wie nämlich Euch, dem Vater und dem Sohne, alles in die Hand gegeben ist, nachdem Ihr einmal von oben herab die Herrschaft empfangen habt (denn „des Königs Leben liegt in Gottes Hand“, sagt der prophetische Geist ), so ist auch dem einen Gotte und seinem Sohne, dem Logos, der als (vom Vater) ungetrennt gedacht wird, alles untergeordnet.) Betrachtet mir also vor allem folgendes! Nicht von Anfang an, wie man allgemein sagt, waren die Götter da, sondern jeder aus ihnen ist entstanden, wie wir entstehen. Das wird von ihnen allen zugegeben. Bei Homer heißt es”Okeanos, den Ursprung der Götter, und Thetis die Mutter“. Orpheus der ihre Namen erfand und ihren Ursprung erzählte und die Taten der einzelnen schilderte, der überhaupt das Vertrauen genießt, eine ziemlich richtige Götterlehre gegeben zu haben, dem auch Homer in den meisten Dingen, besonders in der Darstellung der Götter folgt, führt den Ursprung der Götter ebenfalls auf das Wasser zurück. Okeanos, der „allen Geburt verlieh und Erzeugung“. Das Wasser war nach der Lehre des Orpheus der Anfang für alles. Vom Wasser sonderte sich der Urschlamm; von beiden wurde ein Drachentier mit dem Kopfe eines Löwen (und eines Stieres) hervorgebracht; zwischen beiden Köpfen war das Gesicht eines Gottes. Dieses Wesen hieß Herakles oder Chronos. Dieser Herakles erzeugte ein riesiges Ei, welches sich durch die Kraft seines Erzeugers immer mehr anfüllte, bis es infolge von Reibung in zwei Teile zersprang. Die obere Hälfte wurde zum Himmel (Uranos), die untere zur Erde (Ge); auch schlüpfte noch ein Gott hervor mit zwei Leibern. Uranos erzeugte mit der Ge weibliche Wesen: Kiotho, Lachesis, Atropos - und männliche Wesen: die Hekatoncheiren (Hundertarmigen) Kottos, Gyges, Briareos und die Kyklopen Brontes, Steropes, Arges. Diese fesselte er und warf sie in den Tartaros, als er erfuhr, seine Kinder hätten die Absicht, ihn zu entthronen. Darüber erzürnt brachte Ge die Titanen hervor:</p><p>„Und die himmlischen Söhne gebar die Herrscherin Gaia, Welche man deshalb gerade Titanen zu nennen gewohnt ist, Weil sie sich rächten am hohen, Gestirne tragenden Himmel.“</p>
      <h2>19</h2><p>Das ist der Anfang der Entstehung ihrer Götter und der Anfang für das All. Betrachtet nun folgendes: Ein jedes von den in der Götterlehre behandelten Wesen muß, wie es seinen Anfang hat, so auch seinen Untergang haben. Denn wenn sie geworden sind, nachdem sie vorher nicht waren (und so behaupten die Urheber der Götterlehre), so haben sie kein absolutes Sein; entweder ist etwas ungeworden und ewig, oder geworden und vergänglich. Ich sage hier nichts anderes, als was die Philosophen sagen: „Was ist das immer Seiende und Ursprungslose, was ist das Gewordene und nie wahrhaft Seiende?“ Über das geistig und über das sinnlich Wahrnehmbare redend lehrt Plato, daß ersteres, das geistig Wahrnehmbare, weil es immer ist, nie geworden ist, während dagegen letzteres, das sinnlich Wahrnehmbare, weil es kein absolutes Sein hat, als ein Gewordenes anfängt und aufhört. Deshalb lehren auch die Stoiker, daß einst das All durch Feuer zerstört wird, um erst durch einen neuen Weltanfang wieder ins Dasein zu treten. Sie nehmen ein doppeltes Prinzip an, ein aktives und bewegendes, die Vorsehung, und ein passives und auf Gestaltung wartendes, die Materie. Wenn nun die Welt, obwohl sie von der Vorsehung geleitet ist, als ein Gewordenes nicht unverändert bleiben kann, wie sollte dann das zusammengesetzte Wesen jener Götter Bestand haben, die ihren Existenzgrund nicht in sich selber tragen, sondern geworden sind? Um wie viel sollten die Götter, nachdem sie aus dem Wasser entstanden sind, besser sein als die Materie? Das Wasser ist überhaupt nicht der Ursprung aller Dinge wie sie lehren. Denn was könnte aus einfachen und gleichartigen Elementarteilchen entstehen? Der Stoff bedarf eines Bildners wie der Bildner eines Stoffes. Wie könnten ohne den Stoff oder ohne den Bildner Bildungen zustande kommen? Ferner ist es widersinnig, die Materie für älter anzusehen als die Gottheit; denn das schaffende Prinzip muß dem Werdenden vorausgehen.</p>
      <h2>20</h2><p>Wenn sie nun in ihrer Götterlehre nur das eine Unglaubliche vorbrächten, daß die Götter geworden und aus Wasser entstanden sind, so könnte ich jetzt, nachdem ich gezeigt habe, daß alles Gewordene sich auflösen muß, zu den übrigen Beschuldigungen übergehen, die man gegen uns erhebt. So aber haben sie einerseits Beschreibungen von den Leibern ihrer Götter gegeben; den Herakles nennen sie einen gewundenen Schlangengott; andere bezeichnen sie als Hundertarmige; die Tochter des Zeus, die er mit seiner Mutter Rhea oder Demeter, wie sie auch genannt wird, erzeugte, soll außer den zwei naturgemäßen Augen noch zwei Augen auf der Stirne gehabt haben und an der Rückseite des Halses ein Tierantlitz und außerdem noch Hörner; deshalb sei Rhea aus Entsetzen über das schreckliche Aussehen ihrer Tochter davon gelaufen, ohne ihr die Brust zu reichen; daher werde diese ihre Tochter, die sonst Persephone und Kore heißt, in den Mysterien Athele (= die von der Mutterbrust zurückgehaltene) genannt; diese darf man ja nicht mit Athene = Kore verwechseln. Anderseits haben sie auch die Taten ihrer Götter, wie sie meinen, genau geschildert. So wissen sie zu berichten, daß Kronos seinem Vater die Genitalien ausschnitt und ihn vom Wagen herabwarf, daß er zum Kindsmörder wurde, indem er seine männlichen Kinder verschlang, ferner daß Zeus seinen Vater fesselte und in den Tartarus warf, wie es Uranos mit seinen Söhnen gemacht hatte, daß er mit den Titanen um die Herrschaft stritt, daß er seine Mutter Rhea verfolgte, weil sie die Ehe mit ihm verschmähte, und als sie sich in eine Schlange verwandelte, ebenfalls Schlangengestalt annahm, sie mit dem sogenannten Herkulesknoten band und sich so mit ihr begattete (an diese Begattungsweise erinnert der Hermesstab), daß er dann seine Tochter Persephone ebenfalls in Schlangengestalt bezwang und mit ihr den Dionysos erzeugte. Da drängt sich einem doch wohl die Frage auf: Was enthalten denn solche Erzählungen Erhebendes und Brauchbares, damit wir Kronos, Zeus, Kore u.s.w. für Götter halten können? Etwa die Schilderungen ihrer Leiber? Aber wie könnte ein gescheiter und gebildeter Mann glauben, daß von einem Gott eine Natter erzeugt werde?</p><p>"Phanes erzeugte darauf ein anderes grausiges Wesen Aus dem geheiligten Schosse, die furchterregende Natter; Schön vom Kopfe floß ihr das Haar und schön war ihr Antlitz, Doch die übrigen Teile verrieten die schreckliche Schlange, Abwärts vom Nacken (Orpheus) –</p><p>oder es für wahrscheinlich halten, daß Phanes selbst, der erstentstandene Gott (denn er ist es, der dem Weltei entschlüpfte), den Leib oder die Gestalt einer Schlange gehabt habe oder von Zeus verschlungen worden sei, damit dieser uneingeschränkt bleibe? Wenn sie sich in nichts von den niedrigsten Tieren unterscheiden (denn offenbar muß sich das göttliche vom Irdischen und Stofflichen weit abheben), dann sind sie eben keine Götter. Und warum sollten wir uns an sie wenden, die wie Tiere erzeugt und gestaltet sind, häßliche Monstra?</p>
      <h2>21</h2><p>Wenn sie ihren Göttern überhaupt nur fleischliche Natur und Blut und Samen und die Affekte des Zorns und der Begierde beilegten, auch dann schon müßte man solche Reden für eitel und lächerlich halten. Denn in der Gottheit gibt es keinen Zorn, auch keine Begierde und Neigung, auch keinen zeugenden Samen. Mögen ihre Götter immerhin eine fleischliche Natur haben, so sollten sie doch erhaben sein über Aufwallung und Zorn; Athene sollte sich nicht sehen lassen “eifernd dem Vater Zeus, und ihr tobte das Herz in Erbitterung” von Hera sollte man nicht sagen müssen: “Here nur konnte den Zorn nicht bändigen, sondern begann so” Auch sollten sie erhaben sein über den Schmerz.</p><p>„Wehe doch! Einen Geliebten, verfolgt um die Mauer von Troja, Seh’ ich dort mit den Augen; und ach, sein jammert mich herzlich“.</p><p>Ich nenne schon einen Menschen, der sich von Zorn oder Schmerz besiegen läßt, unsinnig und töricht. Wenn aber gar der Vater der Menschen und Götter über seinen Sohn jammert:</p><p>„Wehe mir, wenn das Geschick Sarpedon, meinen Geliebten, Unter Patroklos Hand, des Menötiaden, mir bändigt!“</p><p>ohne ihn durch seine Klagen der Gefahr entreißen zu können</p><p>"Zeusentsproßter Sarpedon: doch Zeus kann dem Sohne nicht helfen“,</p><p>wer sollte da denen, die durch solche Erzählungen ihre Liebe zum göttlichen oder vielmehr ihre Unkenntnis des göttlichen bekunden, nicht Unsinnigkeit vorwerfen? Mögen die Götter immerhin fleischlicher Natur sein, so sollte doch Aphrodite von Diomedes nicht körperlich verwundet werden:</p><p>„Mich hat verletzt der Tydide, der trotzige Held Diomedes“</p><p>oder von Ares nicht seelisch:</p><p>„Wie mich Lahmenden hier die Tochter des Zeus Aphrodite immer der Ehre beraubt und liebt den verderblichen Ares!“</p><p>[Diomedes verwundete sogar den Ares] „und die blühende Haut ihm zerriß er“. Der gewaltige Kriegsgott, des Zeus Kampfgenosse gegen die Titanen, erscheint schwächer als Diomedes! „Wutvoll tobt er wie Ares mit raffendem Speer“. Homer, sei still! Ein Gott tobt nicht. Du aber schilderst mir den Gott als bluttriefenden Menschenmörder – „Ares, o Ares voll Mord, bluttriefender“ - und erzählst mir von seinem Ehebruch und seiner Fesselung: „Beide bestiegen das Lager und schlummerten; plötzlich umschlangen Rings sie die künstlichen Bande des gar sinnreichen Hephaistos Und kein Glied zu bewegen vermochten sie“.</p><p>Oder reden sie etwa nicht soviel gottloses Zeug über ihre Götter? Uranos wird entmannt, Kronos gefesselt und in den Tartaros geworfen, die Titanen empören sich, Styx findet im Kampfe ihren Tod - schon gelten die Götter für sterblich! Sie verlieben sich ineinander, sie verlieben sich in Menschen:</p><p>„Aineias, den Anchises erzeugte mit Aphrodite, Als im Idagehölz hinsank zu dem Manne die Göttin“.</p><p>Aber Götter verlieben sich nicht, Götter leiden nicht. Denn entweder sind es Götter und dann wandelt sie keine Begierde an [oder es sind keine Götter]. Wenn ein Gott infolge göttlichen Ratschlusses Fleisch annehmen sollte, ist er damit schon ein Sklave der Begierde?</p><p>„Denn so sehr hat keine der Göttinnen oder der Weiber Je mein Herz im Busen mit mächtiger Glut mir bewältigt, Nicht als in Lieb ich erglühte für Ixions Lagergenossin, Noch da ich Danae liebt, Akrisios reizende Tochter, Noch auch Phönix’ Tochter, des ferngepriesenen Königs, Noch da ich Semele liebt, auch nicht Alkmene von Theben, Noch da ich einst die erhabne, die schöngelockte Demeter Oder die herrliche Leto umarmte oder dich selber“.</p><p>Wer so spricht, ist geworden und vergänglich und hat nichts Göttliches an sich. Ja sie leisten sogar den Menschen Knechtesdienste:</p><p>„O des Admetos Haus, worin ich es ertrug Den Knechtestisch zu loben, obschon ich selbst ein Gott“</p><p>und gefallen sich als Rinderhirten:</p><p>„Ich kam in dieses Land und ward dem Gastfreund Hirt Und rettete dies Haus“. Also ist Admetos stärker als der Gott. O du weiser Seher, der du voraussiehst, was den andern begegnen wird, du hast den Tod des Geliebten nicht vorausgesehen, sondern sogar mit eigener Hand den Freund getötet – „Da hofft’ ich, truglos werde Phoibos’ Göttermund Mir sein, der kunstreich Weissagungen sprudelnde“, so daß Aischylos den Apollo einen Lügenpropheten schilt:</p><p>„Er aber selbst, der Sänger, der selbst dieses sprach, Er selbst, von damals Hochzeitsgast, ist selber nun Des Sohnes Mörder".</p>
      <h2>22</h2><p>Doch vielleicht sind dies nur Ausgeburten dichterischer Phantasie und es findet sich vielleicht hiefür eine Erklärung durch Deutung der Natur, etwa folgende. Nach Empedokles ist Zeus der „Glänzende“; Hera und Aidoneus sind „lebenspendend“ und</p><p>„Nestis netzet das Auge der sterblichen Menschen mit Tränen“.</p><p>Wenn aber nun Zeus das Feuer ist, Hera die Erde, Aidoneus die Luft, Nestis das Wasser, und wenn dies Elemente sind, nämlich das Feuer, das Wasser, die Luft, dann ist keines aus ihnen eine Gottheit, weder Zeus noch Here noch Aidoneus; dann sind sie ja aus der Materie entstanden und hervorgegangen, die doch von Gott verschieden ist.</p><p>„Feuer und Wasser und Erde, der Luft erquickende Höhe Und mitten darunter die Liebe.“</p><p>Wie kann man das Götter nennen, was, um bestehen zu können, erst Liebe braucht, da es vom Haß zerrüttet wird? Das Herrschende ist nach Empedokles die Liebe, das Beherrschte sind die einzelnen Elemente; nun aber ist das Herrschende zugleich das Absolute; wir würden daher, wenn wir die Macht des Herrschenden und die des Beherrschten für eine und dieselbe hielten, unvermerkt den Fehler begehen, daß wir die vergängliche, dem Flusse des Wechsels und der Veränderung unterliegende Materie auf gleiche Stufe stellten mit der Gottheit, die da ungeworden und ewig ist und immer sich selbst gleich bleibt. Nach der Lehre der Stoiker ist Zeus die feurige Substanz, Hera die Luft (hier wird sogar der Name mitausgesprochen, wenn man ihn mit sich selbst verbindet), Poseidon das Wasser. Bei dem Versuche, die Mythen an der Hand der Natur zu erklären, ergeben sich jedoch viele Meinungsverschiedenheiten. So deuten die einen den Zeus als Luft, als mannweibliches Doppelwesen; andere fassen ihn als Zeitmaß (Kairos) auf, weil er Ordnung in die Zeit (Chronos) bringt, weshalb er auch allein dem Kronos entkam. Nun aber kann man den Stoikern folgendes entgegenhalten: Wenn ihr nur den höchsten Gott für ungeworden und ewig haltet, wenn ihr in den Elementen Differenzierungen der Materie erblickt, wenn ihr behauptet, daß der Geist Gottes, wenn er die Materie durchschritten hat, je nach den Veränderungen, welche die Materie hiebei erlitt, bald diesen, bald jenen Namen bekommt, so werden die Differenzierungen der Materie wohl nur der Leib Gottes sein; so werden, wenn die Elemente im Weltbrande vergehen, mit ihnen auch die Namen verschwinden und der reine Geist Gottes übrig bleiben. Wer sollte also körperliche Wesen, deren Materialität ein Ende nehmen wird, für Götter halten? Andere hinwiederum verstehen unter Kronos die Zeit und unter Rhea die Erde, die von Kronos empfängt und gebiert, weshalb sie auch Allmutter heißt, während jener erzeugt und verschlingt; in der Entmannung erblicken sie den Verkehr des Männlichen mit dem Weiblichen, insofern hiebei eine Abtrennung stattfindet, Same in die Gebärmutter gelangt und ein Mensch entsteht, der die Begierde, d. i. Aphrodite, in sich trägt; das wahnsinnige Toben des Kronos erklären sie als Wandel des Zeitmaßes, der Belebtes und Unbelebtes zerstört; die Fesselung und Hinabsendung zum Tartarus aber deuten sie als die Zeit, insofern sie durch Zeitmaße Wandel erleidet und hinschwindet. Diesen nun möchten wir das Folgende entgegenhalten: Ist Kronos die Zeit, so ändert er sich; ist er Zeitmaß, so ist er wandelbar; ist er Dunkelheit oder Frost oder Feuchtigkeit, so hat nichts hievon Bestand. Das Göttliche dagegen ist unsterblich und unbeweglich und unveränderlich. Daher kann weder Kronos noch sein Bild Gott sein. Auch Zeus kann nicht Gott sein; ist er Luft, die ihr Dasein dem Kronos verdankt (der männliche Teil von ihr heißt Zeus, während der weibliche Hera genannt wird; deswegen gilt auch Hera als Schwester und Gattin des Zeus), so ändert er sich; ist er Zeitmaß, so ist er wandelbar. Das Göttliche aber ist über Veränderung und Wechsel erhaben.</p><p>Doch was soll ich Euch durch längere Ausführung hinhalten? Ihr selbst wißt ja besser, welche Erklärungen die Mythen durch Naturdeutung gefunden haben, was die Schriftsteller über die Natur gedacht haben, etwa über Athene, die sie als den alles durchschreitenden Verstand auffassen, oder über Isis, welche sie als den Ursprung der Lebenszeit deuten, weil alle Wesen aus ihr hervorgegangen sind und ihr das Dasein verdanken, oder über Osiris, der von seinem Bruder hingeschlachtet wurde, worauf dann Isis in Begleitung ihres Sohnes Oros seine Glieder aufsuchte und nach der Auffindung in ein Grab legte, das bis zur Stunde Osirisgrab heißt. Da sie sich aber, sei es nach aufwärts oder nach abwärts, immer nur mit den Differenzierungen der Materie beschäftigen, so finden sie Gott nicht, der nur durch Denken erkennbar ist; dafür machen sie die Elemente und deren einzelne Teile zu Göttern, sie bald so, bald anders benennend. Die Getreidesaat nennen sie Osiris. Daher soll der Isis in den Mysterien wegen Auffindung der Glieder oder Feldfrüchte zugerufen worden sein: „Wir haben sie gefunden, welch ein Glück!“ Die Frucht des Weinstockes nennen sie Dionysos, den Weinstock selbst Semele, die Sonnenglut Blitzstrahl. Alle jedoch, die sich die Götter nach den Mythen vorstellen, sind von der wahren Gotteserkenntnis noch weit entfernt; sie übersehen sogar, daß sie gerade durch das, was sie zur Verteidigung der Götter vorbringen, die Gegenbeweise verstärken. Wie verhalten sich Europa und der Stier, Leda und der Schwan zu Erde und Luft, damit die ehebrecherische Verbindung des Zeus mit diesen Frauen als eine Verbindung zwischen Erde und Luft aufgefaßt werden kann? Aber da ihnen die Größe Gottes verborgen bleibt und ihr Geist sich nicht emporschwingen kann (haben sie ja doch für jene höhere Welt keinen Sinn), so gehen sie eben ganz in den Differenzierungen der Materie auf, und niedersinkend vergöttern sie die wechselnden Formen der einzelnen Elemente, etwa so, wie wenn einer das Schiff, in dem er gefahren ist, für den Steuermann hielte. Wie nämlich ein Schiff, sei es auch mit allem möglichen ausgerüstet, nichts nützt ohne den Steuermann, so helfen die Elemente, mögen sie auch in schöner Ordnung sein, nichts ohne die göttliche Vorsehung. Das Schiff allein wird nicht fahren, die Elemente ohne ihren Meister werden sich nicht bewegen.</p>
      <h2>23</h2><p>Ihr könntet also bei Eurer überlegenen Einsicht die Frage stellen: „Wie erklärt es sich denn, daß einige Götterbilder wirksam sind, wenn diejenigen, zu deren Ehren wir die Statuen errichten, keine Götter sind? Man kann doch nicht annehmen, daß die leblosen und unbeweglichen Bilder aus sich allein eine Kraft haben ohne einen Beweger.“ Daß je nach Plätzen, Städten, Völkerschaften ab und zu Wirkungen stattfinden, die mit den Namen von Götterbildern in Zusammenhang gebracht werden, stellen auch wir nicht in Abrede. Jedoch halten wir, wenn einigen hiedurch genutzt, andern geschadet wurde, jene Wesen, die nach zwei so verschiedenen Seiten bin wirksam waren, nicht für Götter. Wir haben vielmehr genau untersucht, wie Ihr Euch die Kraft der Götterbilder erklären sollt und wer eigentlich die Wirkenden sind, die sich hinter den Namen der Götterbilder verbergen. Bei dem Nachweise, wer die in den Bildern Wirkenden sind und daß sie keine Götter sind, muß ich auch den einen oder andern Philosophen als Zeugen anführen. Zuerst unterscheidet Thales, wie die Kenner desselben hervorheben, Gott, Dämonen und Heroen. Der Weltverstand gilt ihm als Gott; unter Dämonen versteht er seelische Substanzen, unter Heroen die abgeschiedenen Menschenseelen, und zwar unter guten Heroen die guten Seelen, unter schlechten Heroen die bösen. Plato, der sich im übrigen sehr zurückhaltend zeigt, unterscheidet ebenfalls den ungewordenen Gott, die vom Ungewordenen zur Zier des Himmels geschaffenen Wesen, nämlich die Planeten und die Fixsterne, und Dämonen. Er selbst will sich über diese Dämonen nicht äußern und verweist deshalb auf die Lehre der Vorzeit. „Von den andern, nämlich den Dämonen, zu sprechen und ihren Ursprung zu ergründen geht über unsere Kraft; man muß denen glauben, die früher darüber gesprochen haben; denn diese waren nach ihrer eigenen Versicherung den Göttern verwandt; daher mußten sie doch wohl ihre Ahnen genau kennen. Göttersöhnen also muß man glauben, ohne daß sie wahrscheinliche und zwingende Beweisgründe angeben; sie geben ja nach ihrer eigenen Aussage Aufschlüsse über Dinge, die sie selbst angehen; daher müssen wir ihnen dem Gesetze folgend glauben. So mag sich denn, was diese Götter betrifft, ihr Ursprung auch für uns so verhalten, wie jene es lehrten, und so weiter erzählt werden. Von Ge und Uranos kamen Okeanos und Tethys, von diesen Phorkos, Kronos, Rhea und alle mit diesen Zusammengehörigen; von Kronos und Rhea stammen Zeus und Hera und alle, die samt und sonders als Geschwister oder weiterhin als Nachkommen von ihnen bekannt sind“. Soll nun der Mann, der den ewigen, mit Verstand und Vernunft erfaßbaren Gott geahnt und seine Eigenschaften ausgesprochen hat, nämlich das wahrhaftige Sein, die Wesenseinheit, die von ihm ausströmende Güte, d. h. die Wahrheit, soll der Mann, der von einer ersten Kraft gesprochen hat: „Ihn, den König aller Wesen, umgibt alles; um seinetwillen ist alles; er ist der Urgrund von allem“ - und von einem Zweiten und Dritten: „Das Zweite herrscht im zweiten Reiche, das Dritte im dritten“ soll der Mann, frage ich, wirklich geglaubt haben, es übersteige seine Kraft über das, was aus dem sinnlich Wahrnehmbaren nämlich aus Ge und Uranos, entstanden sein soll, eine wahre Erkenntnis zu gewinnen? Das kann man sicherlich nicht behaupten; sondern nur deswegen, weil er überzeugt war, daß bei Göttern ein Erzeugen und Gebären unmöglich ist, da allem Werdenden ein Ende bevorsteht, und daß eine Belehrung des Volkes, das die Mythen ungeprüft hinnimmt, noch unmöglicher ist als jenes, nur deswegen hat er gesagt, es gehe über seine Kraft, über den Ursprung der andern, der Dämonen, Erkenntnisse zu gewinnen und Aussagen zu machen; denn Göttererzeugung kam ihm widersinnig vor und er brachte es nicht über sich, solches zu lehren. Auch jene Stelle: „Er also, der große Heerführer im Himmel, Zeus, einherfahrend auf seinem geflügelten Wagen, zieht voran, alles ordnend, für alles sorgend; ihm folgt die Heerschar der Götter und Dämonen“ bezieht sich nicht auf jenen Zeus, der für den Sohn des Kronos gilt; denn Plato nennt seinen Zeus den Bildner des Alls. Nur deswegen, weil er ihm einen anderen treffenden Namen nicht geben konnte, hat Plato, wie er selbst gesteht, den volkstümlichen Namen gebraucht, nicht als ob dies der eigentliche Name Gottes wäre, sondern nur, um sich verständlich zu machen; er konnte ja nicht anders; denn dem Volke den Begriff der Gottheit beizubringen, ist ein Ding der Unmöglichkeit. Er hat ihm aber das Attribut „groß“ gegeben, um so den himmlischen Zeus vom irdischen zu unterscheiden, den ungewordenen vom gewordenen, der jünger ist als Uranos und Ge, sogar jünger als die Kreter, die ihn verstecken mußten, daß sein Vater ihn nicht töte.</p>
      <h2>24</h2><p>Doch wozu soll ich Euch, die Ihr selbst über alles nachgedacht habt, noch Dichter zitieren, wozu noch andere Aussprüche prüfen? Ich kann mich kurz also fassen: Wenn wirklich Dichter und Philosophen die Einheit Gottes nicht erkannt hätten, wenn sie die Götter für nichts Höheres gehalten hätten als für Dämonen, Materie oder Seelen von Verstorbenen, wäre da schon ein Grund vorhanden, uns in die Fremde zu jagen, weil wir zwischen Gott und Materie, und was ein jedes hievon sei, logisch unterschieden haben? Denn nach unserer Lehre existiert ein Gott und ein Sohn, sein Wort, und ein Heiliger Geist, die hinsichtlich der Macht ein einziges Wesen sind, der Vater, der Sohn, der Geist; denn der Sohn ist des Vaters Verstand, Wort, Weisheit und der Geist ist Ausfluß wie Licht von Feuer; ebenso kennen wir die Existenz anderer Kräfte, die sich im Umkreis und innerhalb der Materie befinden, darunter auch die Existenz einer gottwidrigen Kraft, nicht als ob es etwas gäbe, was Gott prinzipiell gegenüberstünde wie der Haß der Liebe im Sinne des Empedokles und wie die Nacht dem Tage auf dem Gebiete der Naturerscheinungen (denn stünde etwas Gott gegenüber, so müßte es aufhören zu sein, da es infolge der göttlichen Kraft und Stärke allen Halt verlöre), sondern weil der Güte Gottes, die ihm als Eigenschaft zukommt und mit ihm so notwendig existiert wie die Haut mit dem Leibe und ohne die er nicht existiert (nicht als ob sie ein Teil von ihm wäre, sondern weil sie eine notwendige Folge ist und mit ihm vereint und verbunden ist wie das Rot mit dem Feuer und das Blau mit dem Himmel), der die Materie umschwebende Geist gegenübersteht, der von Gott geschaffen ist, wie auch die übrigen Engel von ihm geschaffen sind, und mit der Verwaltung der Materie und der Erscheinungsformen der Materie betraut wurde. Diese, die Engel, hat Gott erschaffen aus Fürsorge für das von ihm Geordnete, damit, während Gott im allgemeinen sorgt für das Ganze und für das Große, für jeden Teil die hiefür beordneten Engel sorgen. Wie aber nun unter den Menschen, deren Tugend und Schlechtigkeit freier Willensentscheidung entspringen (Ihr würdet ja sonst die Guten nicht auszeichnen und die Bösen nicht strafen, wenn Tugend und Schlechtigkeit nicht von ihnen selbst abhinge), die einen in dem ihnen von Euch anvertrauten Amte als eifrig, die andern als unzuverlässig befunden werden, so steht es auch bei den Engeln. Die einen blieben (Gott: hat sie natürlich mit freiem Willen ausgestattet) bei dem, wozu Gott sie geschaffen und bestimmt hatte, die andern aber wurden stolz auf ihre Natur und Herrschaft, darunter auch jener Beherrscher der Materie und ihrer Erscheinungsformen und noch andere, deren Bereich diese unsere Welt ist (seid überzeugt, wir lehren nicht etwas Unbeglaubigtes, sondern was wir verkünden, wurde schon von den Propheten ausgesprochen); die letzterwähnten Engel wurden von Begierde nach Jungfrauen erfüllt und unterlagen der Fleischeslust, jener hingegen zeigte sich nachlässig und schlecht in der Verwaltung des ihm anvertrauten Amtes. Von den Engeln nun, die sich mit Jungfrauen eingelassen hatten, wurden die sogenannten Giganten erzeugt. Daß auch die Dichter über die Giganten teilweise Richtiges vorbrachten, braucht Euch nicht zu befremden; zwischen der prophetischen Weisheit und der Weltweisheit besteht ein ähnlicher Unterschied wie zwischen der Wahrheit und der Wahrscheinlichkeit; jene beschäftigt sich mit himmlischen Dingen, diese mit irdischen und darum auch mit dem Beherrscher der Materie. „Meist ist unser Wissen ein Trug, dem Wahren nur ähnlich“.</p>
      <h2>25</h2><p>Diese Engel nun, die aus den Himmeln gestürzt wurden und nunmehr in der Luft und auf der Erde wohnen, da sie sich zum Himmlischen nicht mehr emporschwingen können, und die Seelen der Giganten, das sind die in der Welt umherirrenden Dämonen. Die Erregungen, die sie hervorbringen, entsprechen bei den einen [den Dämonen] der Natur, die sie empfangen haben, bei den andern [den Engeln] den Begierden, von denen sie erfaßt wurden; der Beherrscher der Materie führt, wie man unmittelbar aus Tatsachen ersehen kann, Aufsicht und Verwaltung in einer der Güte Gottes widersprechenden Weise.</p><p>„Oft schon dacht ich in meiner Seele, Ob Zufall in den menschlichen Dingen herrscht oder ein Dämon. Denn gegen Erwartung und gegen Recht Kommen die einen um Haus und Hof, Von Gott verlassen, während andere im Glücke schwelgen“</p><p>Weil also gegen Erwartung und Recht die einen glücklich, die andern unglücklich sind, so konnte es sich Euripides nicht erklären, wer die Verwaltung der irdischen Dinge habe, bei der man ausrufen möchte:</p><p>„Wie sollten wir beim Anblick solcher Dinge noch An Götter glauben oder halten ein Gesetz?“</p><p>Dies bewog auch einen Aristoteles zu dem Ausspruche, daß es für die Dinge unter dem Himmel keine Fürsorge gebe. Aber die ewige Fürsorge Gottes bleibt uns nach wie vor:</p><p>„Ob gern, ob ungern sprießt die Erde Weide mir. Naturnotwendig, und ernährt zur Mast mein Vieh“</p><p>und auch die Fürsorge für die Teile erstreckt sich tatsächlich, nicht bloß vermeintlich, auf die würdigen; auch für das übrige ist, soweit es der gemeinsame Zweck der Schöpfung fordert, durch weise Einrichtung gesorgt. Weil aber die vom feindseligen Geiste ausgehenden Erregungen und Einwirkungen besagte Unordnung hineinbringen, da sie nunmehr auch die Menschen, den einen so, den andern anders, bald einzelne, bald ganze Völker durch geteilten oder gemeinschaftlichen Ansturm, je nach dem Verhältnisse eines jeden zur Materie und nach dem Grade seiner Empfänglichkeit fürs göttliche, innerlich und äußerlich in Erregung versetzen, so haben einige und zwar Autoritäten gemeint, daß das Universum nicht auf einer Ordnung beruhe, sondern der Tummelplatz blinden Zufalls sei; sie haben dabei übersehen, daß von all den Dingen, von denen eigentlich der Fortbestand der Welt abhängt, kein einziges ungeordnet und vernachlässigt ist, sondern ein jedes eine vernünftige Einrichtung zeigt, so daß sie die ihnen gesetzte Ordnung nicht überschreiten. Auch der Mensch, wie er aus des Schöpfers Hand hervorging, ist ein wohlgeordnetes Wesen, mag man nun die Art und Weise seiner Entstehung betrachten, die einen einheitlichen, für alle gültigen Plan aufweist, oder sein organisches Wachstum, welches das hiefür maßgebende Gesetz nicht überschreitet, oder das Ende des Lebens, das gleich und gemeinschaftlich bleibt für alle. Aber nach seiner eigenen individuellen Vernunft und nach der Einwirkung jenes drängenden Herrschers und seines Dämonengefolges wird der eine so, der andere anders beeinflußt und erregt, obschon die Fähigkeit vernünftigen Denkens allen in gleicher Weise innewohnt.</p>
      <h2>26</h2><p>Wer also die Leute zu den Götterbildern hinzieht, sind die Dämonen, die sich an das Blut der Opfertiere herandrängen und von ihnen naschen. Die Götter des Volksglaubens dagegen sind, wie ihre Geschichte zeigt, vormals Menschen gewesen. Daß nun die, welche hinter den Namen Deckung suchen, Dämonen sind, wird durch die Wirkungsweise der einzelnen bestätigt. Die einen verlangen Entmannung, so im Rheakult, andere Schläge und Einschnitte, so im Artemiskult; die taurische Artemis tötet sogar die Fremden; ich will nicht reden von denen, die sich mit Messern und Geißeln zerfleischen, auch nicht von den verschiedenen Arten der Dämonen; denn es ist Gottes unwürdig, Anregung zu Widernatürlichem zu geben.</p><p>„Der Dämon blendet, wenn er Unglück bringen will, Zuvor des Menschen Sinn“</p><p>Aber Gott ist vollkommen gut und tut ewig nur Gutes. Daß die in den Bildern Wirkenden andere sind als die, zu deren Ehren man die Bilder errichtet, dafür liefern Troas und Parion den schlagendsten Beweis. Troas hat Bilder des Neryllinos, der ein Zeitgenosse von uns ist; Parion hat Bilder des Alexander und des Proteus; von Alexander befindet sich jetzt noch auf dem Marktplatze Grab und Bild. während nun die übrigen Neryllinosbilder nur zum Schmucke der Stadt dienen, wofern überhaupt solches einer Stadt Schmuck verleiht, steht eines in dem Rufe, daß es weissage und Kranke heile. Deshalb bringen die Leute von Troas dieser Statue Opfer dar, salben sie und setzen ihr goldene Kränze auf. Was die Statuen des Alexander und des Proteus betrifft (letzterer hat sich, wie Ihr wohl wißt, bei Olympia ins Feuer gestürzt), so soll die des Proteus ebenfalls weissagen, und der des Alexander („Unglücks-Paris, allerschönster, weibertoller" ) bringt man öffentliche Opfer dar und feiert sie wie einen Gott, der erhört hat. Sind es nun Neryllinos, Proteus, Alexander, die solches bei den Bildern wirken? Oder tut dies etwa die materielle Zusammensetzung der Bilder? Aber die Materie ist Erz. Was vermag das Erz aus sich selbst? Man kann ihm ja wieder eine andere Gestalt geben; so hat Amasis nach dem Berichte des Herodot aus einem Fußbecken ein Götzenbild gemacht. Was für Heil könnten ferner ein Neryllinos, Proteus, Alexander den Kranken bringen? Was nämlich jetzt angeblich das Bild wirkt, wirkt es zu Lebzeiten des Neryllinos und selbst dann, wann dieser krank ist.</p>
      <h2>27</h2><p>Was folgt hieraus? Die unvernünftigen Seelenkräfte, die das Vorstellungsleben mit mannigfachen Truggestalten erfüllen, nehmen teils aus der materiellen Welt allerlei Bilder auf, teils formen und gebären sie solche aus sich selbst. Das widerfährt am meisten einer solchen Seele, die vom Weltgeist annimmt und sich mit ihm vermischt, die nicht zu den himmlischen Dingen und deren Schöpfer aufschaut, sondern abwärts blickt auf das Irdische, die, um alles auf einmal zu sagen, gleichsam nur Blut und Fleisch ist, aber nicht mehr reiner Geist. Jene unvernünftigen, das Vorstellungsleben trübenden Seelenkräfte sind es also, welche Phantasiebilder von Göttern erzeugen, die geradezu ans Wahnsinnige streifen. Wenn dann eine weiche und lenksame Seele, die aber von gesunder Lehre nichts gehört und vernommen hat, die noch keinen Einblick in das Reich der Wahrheit getan und über den Vater und Schöpfer des Alls noch nicht nachgedacht hat, irrige Vorstellungen über sich selbst wie Siegelabdrücke in sich aufnimmt, so machen sich die Dämonen der Materie, die sich in der Nähe des Fettes und Blutes der Opfertiere aufhalten, um davon zu naschen, und immer auf Täuschung der Menschen bedacht sind, jene zu irrigen Vorstellungen anregenden Seelenkräfte bei den Leuten zu nutzen: sie bewirken, daß von den Bildern und Statuen her Phantasiegebilde in sie einströmen; diese aber gehen in Wirklichkeit von den Dämonen selbst aus, die hinter den Namen der Bilder und Statuen Deckung suchen. So ernten dann sogar von alldem, was sich in den Tiefen der unsterblichen Seele vernünftigerweise abspielt, wenn sie Zukünftiges kündet und Gegenwärtiges heut, den Ruhm die Dämonen.</p>
      <h2>28</h2><p>Vielleicht ist es nach dem Vorausgehenden notwendig, noch einiges über die Namen beizubringen. Herodot und Alexander, der Sohn Philipps, geben an (letzterer im Brief an seine Mutter) - beide sollen in Heliupolis, Memphis und Theben mit den Priestern Gespräche gepflogen haben -, sie hätte dort die Versicherung erhalten, daß jene Götter nur Menschen gewesen sind. Herodot sagt: „Von denen also, deren Bilder dastanden, konnten die Priester nachweisen, daß sie solche waren und keineswegs Götter. Vor diesen Männern jedoch hätten Götter über Ägypten geherrscht; sie hätten unter den Menschen gewohnt und einer von ihnen habe jedesmal die Oberherrschaft geführt. Später sei Oros, der Sohn des Osiris, im Lande König gewesen, der nämliche, den die Griechen Apollo nennen; dieser habe Typhon gestürzt und sei zuletzt König von Ägypten gewesen; Osiris aber ist in griechischer Sprache Dionysos“. Die andern also und auch der letzte waren ägyptische Könige. Von den Ägyptern kamen dann die Götternamen zu den Griechen. Apollo ist der Sohn des Dionysos und der Isis. Herodot selbst schreibt: „Apollo und Artemis sind, wie mir dort gesagt wurde, Kinder des Dionysos und der Isis; Leto ist ihre Pflegerin und Retterin gewesen“. Sie hielten also die Menschen, die ihre ersten Könige waren, teils aus Unkenntnis der wahren Gottesverehrung, teils aus Dankbarkeit für ihre Regierung nebst deren Gemahlinnen für Götter. „Die reinen Stiere und Kälber dürfen alle Ägypter opfern, aber keine Kühe, weil diese der Isis heilig sind. Das Bild der Isis stellt eine Frau dar mit Kuhhörnern, gleichwie die Griechen die Jo abbilden“. Wer sollte nun in dieser Frage glaubwürdiger sein als jene, bei denen sich wie das Priestertum so auch das Wissen von Vater auf Sohn forterbt? Es ist doch nicht anzunehmen, daß jene Tempeldiener, die die Bilder so ehrfurchtsvoll behandeln, sagen würden, es seien dies Bilder ehemaliger Menschen, wenn es nicht wirklich so wäre. Wenn nun Herodot (allein) es versicherte, die Ägypter erzählen von den Göttern wie von Menschen, mit dem Zusatze: „Die Göttergeschichten, die ich gehört habe, will ich nicht erzählen; nur die Namen will ich angeben“, so brauchte man dem Herodot als einem Mythenschreiber ja gar nicht zu glauben. Nachdem aber auch Alexander und Hermes, genannt Trismegistos, und zahllose andere, um sie nicht einzeln anzuführen, die Abkunft jener so angeben, wie sie eigentlich war, läßt sich nicht mehr in Abrede stellen, daß sie Könige waren und für Götter bloß gehalten worden sind. Daß sie Menschen gewesen, lehren auch die größten ägyptischen Weisen; Äther, Erde, Sonne und Mond bezeichnen sie als Götter, die andern aber gelten ihnen als Menschen, die sterben konnten, und ihre Gräber als Tempel. Dies bezeugt auch Apollodor in seiner Schrift über die Götter: „Herodot nennt ferner ihre Leidensgeschichten Mysterien. Daß man in der Stadt Busiris, schreibt er, das Fest der Isis feiert, habe ich schon früher berichtet; nach dem Opfer schlagen sich alle, Männer und Frauen, viele Tausende von Menschen; was es aber damit für eine Bewandtnis hat, darf ich nicht sagen“. Wenn sie Götter waren, konnten sie nicht sterben; wenn man sich aber aus Trauer um sie schlägt, wenn es ihre Leidensgeschichten sind, was den Inhalt der Mysterien ausmacht, so waren sie nur Menschen. Ebenso berichtet Herodot: „Auch gibt es das Grab eines gewissen, dessen Namen ich hier nicht zu nennen wage, zu Sais im Tempelbezirk der Athene unmittelbar hinter dem Heiligtum die ganze Mauer der Athene entlang; ganz nahe dabei liegt ein See mit hübscher steinerner Einfassung ringsum, nach meiner Schätzung so groß wie der auf Delos, welcher der radförmige heißt. Auf diesem See stellen die Ägypter zur Nachtzeit die Leidensgeschichte von jenem dar und nennen dies Mysterien“. Und nicht nur das Grab des Osiris wird gezeigt, sondern auch die Art und Weise seiner Einbalsamierung. „Wenn zu ihnen eine Leiche gebracht wird, zeigen sie den Überbringern Muster von Leichen, die aus Holz gefertigt sind und durch ihre Bemalung den Eindruck gelungener Nachbildung machen. Die sorgfältigste Art und Weise der Einbalsamierung sei die von jenem, dessen Namen ich hier nicht zu nennen wage“.</p>
      <h2>29</h2><p>Aber auch unter den Griechen gibt es Dichter und Geschichtskundige, welche dieselbe Ansicht aussprechen. Sie urteilen über Herakles:</p><p>„Nicht der Götter wachendes Auge scheute der Arge, Nicht den gastlichen Tisch; gleichwohl erwürgt’ er ihn selber“,</p><p>den Iphitos nämlich. Bei einem solchen überraschte es auch nicht, daß er tobte und den Scheiterhaufen anzündete und sich verbrannte. In Bezug aus Asklepios sagt Hesiod:</p><p>„Der Vater der Götter und Menschen Grollte und schleuderte her vom Olympos den flammenden Blitzstrahl, Welcher den Letoiden erschlug zum Schmerze des Phoibos“.</p><p>Auf ihn beziehen sich auch Pindars Worte:</p><p>„Auch die Klugheit leider erliegt dem Gewinn. Stolzer Lohn, in Händen gewiesenes blankes Gold verlockte jenen auch … Siehe da traf sie Kronion; Beiden aus der Brust den Atem riß er sofort Und der Blitzstrahl flammte zerschmetternde Glut und Tod herab“.</p><p>Entweder also waren sie Götter und dann hielten sie sich weder an das Gold –</p><p>„O Gold, du schönste Gabe für den Sterblichen! Denn keine Mutter bietet solche Wonnen dar Noch Kinder“ -</p><p>(denn die Gottheit ist bedürfnislos und über jede Begierde erhaben) noch starben sie, oder sie waren Menschen und zwar infolge ihrer Unwissenheit böse, der Geldgier erliegende. Wozu soll ich noch viele Worte machen durch den Hinweis auf Kastor und Polydeukes oder auf Amphiareos, welche sozusagen noch gestern und vorgestern als Menschen, von Menschen erzeugt, gelebt haben und heute für Götter gelten, wie auch Ino nach Ablauf ihres Wahnsinns und der daraus folgenden Leiden eine Göttin geworden sein soll? Von ihr heißt es:</p><p>„Die Meerbefahrer nannten sie Leukothea“,</p><p>und von ihrem Sohne:</p><p>„Erhabenen Palämon nennt der Schiffer ihn.“</p>
      <h2>30</h2><p>Wenn sogar ganz Abscheuliche und Gottverhaßte vergöttert wurden, wenn selbst Semiramis, die Tochter der Derketo, ein wollüstiges und mordbeflecktes Weib, zu einer syrischen Göttin erhoben wurde und die Syrer wegen der Derketo die Fische, wegen der Semiramis die Tauben verehren (denn dieses Weib wurde, was ganz unmöglich ist, in eine Taube verwandelt; dieser Mythos ist bei Ktesias zu lesen), so darf es uns nicht wundern, wenn Fürsten und Tyrannen von ihren Untertanen Götter genannt wurden. Die Sibylle (auch Plato erwähnt ihrer) singt:</p><p>„Jetzt war da das zehnte Geschlecht der sterblichen Menschen, Seit die gewaltige Flut die Männer der Vorzeit ereilte. Kronos, Titan und Iapetos waren der Leute Beherrscher, Treffliche Söhne von Gäa und Uranos; doch erst die Menschen Nannten sie Gäa und Uranos, ihnen den Namen erteilend, Weil sie das erste Paar der sterblichen Menschen gewesen.“</p><p>Auch das läßt sich begreifen, wenn Repräsentanten der Stärke wie Herakles und Perseus vergöttert wurden oder Heilkünstler wie Asklepios. Ein jeder, den entweder die Untertanen oder die Herrscher selbst ehren wollten, bekam Anteil an dem Gottesnamen, sei es aus Furcht oder auch aus Ehrfurcht. Auch dem Antinoos ist es infolge der Liebe Eurer Vorfahren zu den Untertanen gelungen, für einen Gott zu gelten. Die später Lebenden haben dann dieses Erbe skrupellos angetreten.</p><p>„Kreter sind immerdar Lügner; es haben, o Herrscher, die Kreter Schon errichtet dein Grab, obwohl du nicht starbest.“</p><p>Du glaubst zwar, Kallimachos, an die Geburt des Zeus, aber nicht an sein Grab; du würdest ja sonst nach deiner eigenen Meinung die Wahrheit verhüllen; aber auch so verkündest du sogar den Unwissenden, daß er gestorben ist. Schaust du die Grotte an, so denkst du an Rheas Geburt; siehst du den Sarg an, so suchst du die Tatsache zu verdunkeln, daß jener gestorben ist. Du weißt eben nicht, daß allein der ungewordene Gott ewig ist. Entweder also sind die von der Volksmenge und von den Dichtern erzählten Göttermythen unwahr und dann ist der Kult solcher Götter unnütz (erdichtete Helden existieren ja überhaupt nicht) oder die Geburten, Liebschaften, Mordtaten, Diebstähle, Entmannungen, Blitzschläge sind wahr, dann aber haben die fraglichen Persönlichkeiten aufgehört zu sein und existieren nicht mehr, wie sie auch erst aus dem Nichtsein geworden sind. Ist es etwa konsequent, den einen Teil zu glauben, den andern aber nicht, zumal die Dichter ohnehin bestrebt waren, die Helden ihrer Erzählungen zu idealisieren? Denn die Dichter, deren idealisierender Darstellung sie die Vergötterung verdanken, hätten gewiß nicht von „Leiden“ gesprochen, wenn jene nichts zu leiden gehabt hätten.</p><p>Daß wir keine Atheisten sind, da wir an Gott, den Schöpfer dieses Alls, und an seinen Logos glauben, habe ich jetzt, vielleicht nicht so, wie es die Sache verdient, aber doch so gut ich es vermochte, bewiesen.</p>
      <h2>31</h2><p>Ferner dichten sie uns gottlose Mahlzeiten und Beilager an, einerseits um sich einzureden, daß sie uns mit Recht hassen, anderseits in der Erwartung, uns durch Einschüchterung von unserer Lebensweise abzubringen oder durch die Schwere der Anklagen die Behörden gegen uns einzunehmen und zu schonungslosem Vorgehen aufzureizen; aber das ist doch nur ein dummer Spaß Leuten gegenüber, die in dem Kampfe der Schlechtigkeit gegen die Tugend eine ganz gewöhnliche, uralte und nicht erst in der Gegenwart hervortretende Erscheinung erblicken, welche die notwendige Folge eines göttlichen Gesetzes und Planes ist. So starb Pythagoras mit dreihundert Gefährten den Feuertod; Heraklit wurde aus dem Staate der Ephesier, Demokrit aus dem der Abderiten ausgewiesen, jeder, weil man ihn für wahnsinnig erklärte; auch den Sokrates verurteilten die Athener zum Tode. So wenig aber nun die öffentliche Meinung jenen Männern in Hinsicht auf Tugend Abbruch tun konnte, so wenig wirft auch auf uns die unverständige Verleumdung, mit der gewisse Leute uns angreifen, in Hinsicht auf die Rechtlichkeit des Lebens einen Schatten, da wir bei Gott anerkannt sind. Aber dennoch will ich auch diesen Vorwürfen begegnen. Euch freilich sind schon meine bisherigen Darlegungen gewiß eine ausreichende Rechtfertigung; denn da Ihr an Einsicht alle überragt, so wißt Ihr auch, daß wir uns nie auch nur eine ganz kurze Gedankensünde erlauben, denn da Gott die Richtschnur für unser Leben bildet, so ist es unser eifrigstes Bestreben, daß das Leben eines jeden von uns in Gottes Auge schuldlos und untadelig sei. Hätte wir nämlich den Glauben, daß sich unser Leben auf diese Welt allein beschränke, so könnten wir wohl auch in den Verdacht kommen zu sündigen, etwa indem wir den Regungen des Fleisches und Blutes nachgeben oder der Gewinnsucht und Begehrlichkeit unterliegen. Nachdem wir aber wissen, Gott wacht Tag und Nacht über unsere Gedanken und Worte, er sieht, da er ganz Licht ist, auch unser Inneres, nachdem wir ferner überzeugt sind, wir werden nach diesem Leben ein anderes Leben führen, entweder ein besseres als das gegenwärtige, ein himmlisches, kein irdisches, insofern wir bei Gott und mit Gott sein werden, durch nichts mehr in der Seele beeinflußt und beirrt, nicht als Fleisch, obwohl wir Fleisch noch haben werden, sondern als himmlischer Geist, oder, wenn wir mit den übrigen zusammenfallen, ein schlechteres, ein Leben im Feuer (denn Gott hat uns nicht wie Herdenvieh und Zugtiere als Nebensache erschaffen mit der Bestimmung umzukommen und zu verschwinden), nach all dem ist nicht zu erwarten, daß wir Schlechtes begehen und uns der Bestrafung des großen Richters aussetzen wollen.</p>
      <h2>32</h2><p>Zwar nimmt es uns nicht wunder, wenn sie uns Dinge andichten, die sie von ihren eigenen Göttern aussagen; sie stellen ja deren Leidenschaften als Mysterien dar; nur sollten sie dann, nachdem sie einmal einen ungezügelten und unterschiedslosen Geschlechtsverkehr für etwas Arges halten, auch den Zeus verabscheuen, der mit seiner Mutter Rhea und mit seiner Tochter Kore Kinder erzeugte und seine eigene Schwester zur Gemahlin hatte, oder den Erfinder solcher Mären, den Orpheus, weil er den Zeus noch unheiliger und befleckter als einen Thyestes schilderte; auch dieser hat einem Orakelspruche folgend seiner Tochter sich beigesellt, um sich Herrschaft und Recht zu verschaffen. Wir hingegen sind von einem unterschiedslosen Geschlechtsverkehr so weit entfernt, daß uns nicht einmal ein begehrlicher Blick erlaubt ist. „Wer ein Weib ansieht, um ihrer zu begehren,“ heißt es, „hat schon die Ehe gebrochen in seinem Heizen.“ Was berechtigt, an der Reinheit des Lebenswandels derer zu zweifeln, die von den Augen keinen weiteren Gebrauch machen dürfen als den, wozu Gott sie bildete, nämlich daß sie uns Licht seien, denen also schon der sinnliche Blick als Ehebruch ausgelegt wird, weil die Augen anderen Zwecken dienen, und bei denen das kommende Gericht sich sogar auf das bloße Denken erstreckt? Denn unsere Verantwortung erfolgt nicht nach Menschensatzungen, denen ein Bösewicht wohl auch entgehen kann (schon anfangs suchte ich Euch von dem göttlichen Ursprung unserer Lehre zu überzeugen), sondern wir haben ein Gesetz, einen Auftrag, der bewirkt hat, daß wir in der rechten Selbst- und Nächstenliebe das Vollmaß der Gerechtigkeit erblicken. Je nach dem Alter betrachten wir daher die einen als Söhne und Töchter, andere behandeln wir wie Brüder und Schwestern, die Älteren ehren wir wie Väter und Mütter. Und nun liegt uns alles daran, daß die Leiber derer, die wir für Brüder ansehen und Schwestern und was es sonst noch für Verwandtschaftsnamen gibt, unentweiht und unbefleckt bleiben, da uns abermals der Logos sagt: „Wenn jemand deswegen zum zweitenmal küßt, weil es ihm gefallen hat“ und beifügt: „So also mit Vorsicht muß man den Kuß oder vielmehr den Gruß geben, da er uns des ewigen Lebens berauben würde, wenn er irgendwie durch die Gesinnung getrübt würde.“</p>
      <h2>33</h2><p>Da wir also Hoffnung auf ein ewiges Leben haben, so erstreckt sich unsere Weltverachtung selbst auf solche Genüsse, die nur in Vorstellungen bestehen. Jeder von uns hat auch nur ein Weib, das er nach den von uns aufgestellten Gesetzen geehelicht hat, und zwar nur zum Zwecke der Kindererzeugung. Denn wie der Landmann, wenn er die Saat dem Schoße der Erde anvertraut hat, den Erntetag abwartet, ohne neue Saat auszustreuen, so hat auch bei uns die Begierde ihr Ziel in der Kindererzeugung. Indes kann man unter unseren Glaubensgenossen viele finden, Männer und Frauen, die alt werden, ohne zu heiraten, in der Hoffnung auf um so innigeren Verkehr mit Gott. Wenn das Verharren im jungfräulichen Stande beide Geschlechter Gott näher bringt, wenn schon ein Gedanke oder eine Begierde von ihm wegführt, so verabscheuen wir noch viel mehr die Vollbringung dessen, was wir uns nicht einmal zu denken erlauben. Denn nicht im Aussinnen schöner Sprüche besteht unser Leben, sondern in der Ausführung schöner Taten und in der Anleitung hiezu, auf daß ein jeder bleibe, wie er geboren ist, oder nur einmal sich vereheliche. Denn die zweite Ehe ist nur ein verbrämter Ehebruch. „Denn wer sein Weib entläßt,“ sagt unser Lehrer, „und eine andere heiratet, bricht die Ehe“; es ist also keinem gestattet, diejenige zu verlassen, deren Jungfrauschaft er aufgehoben, und eine zweite Heirat einzugehen. Wer sich nämlich seines ersten Weibes entledigt (und eine andere heiratet), ist ein versteckter Ehebrecher, selbst dann noch, wenn jene gestorben ist. Denn er übertritt die Anordnung Gottes, der im Anfang nur einen Mann und nur ein Weib bildete, und löst jenes einigende Band, das zum Zwecke eines geordneten Geschlechtsverkehrs zwischen Fleisch und Fleisch geknüpft ist.</p>
      <h2>34</h2><p>Trotz so erhabener Grundsätze (doch wozu sollte ich die Geheimnisse ausplaudern?) bekommen wir Vorwürfe zu hören, so daß sich das Sprichwort bewahrheitet: „Die Dirne (tadelt) die Anständige.“ Leute, die förmlichen Mädchenhandel treiben, die mit Umgehung der Gesetze der Jugend Gelegenheit zu schändlichen Ausschweifungen jeder Art bieten, die sich nicht einmal männlicher Personen enthalten, sondern als Männer an Männern Arges verüben, Leute, die gerade die stattlichsten und schönsten Leiber auf alle Art schänden und das herrliche Schöpfungswerk Gottes in den Staub ziehen (denn die Schönheit auf Erden ist nicht von selbst da, sondern wird von Gottes Hand und Huld gesendet), solche wagen es, Schändlichkeiten, deren sie sich selbst bewußt sind und die sie auch ihren Göttern nachsagen, weil sie darin etwas Rühmliches und der Götter Würdiges erblicken, uns aufzubürden! Uns, die wir entweder ein ganz jungfräuliches oder ein streng monogamisches Leben führen, wollen die Ehebrecher und Knabenschänder herabwürdigen, sie, die wie Fische leben, denn auch diese verschlingen jeden, der ihnen in den Weg kommt, und der Stärkere macht Jagd auf den Schwächeren. O, das ist Versündigung an Menschenfleisch, wenn man unbeachtet der von Euch und Euren Vorfahren in gerechter Erwägung gegebenen Gesetze Menschen so sehr bedrängt, daß selbst die von Euch aufgestellten Statthalter mit den Prozessen nicht mehr fertig werden, und wenn man dies noch dazu solchen Menschen antut, die nicht einmal bei Schlägen sich zurückziehen dürfen und nicht einmal bei Schmähungen Segensworte unterlassen dürfen. Denn bloß gerecht sein ist noch zu wenig; gerecht sein heißt Gleiches mit Gleichem vergelten; wir aber haben die Vorschrift, gut und geduldig zu sein.</p>
      <h2>35</h2><p>Welcher Verständige sollte nun uns, Leute von solchen Grundsätzen, noch des Menschenmordes bezichtigen? Man müßte ja, um Menschenfleisch essen zu können, zuvor einen Menschen töten. Wie sie nun im ersten Stücke lügen, so auch im zweiten. Fragt man sie, ob sie denn schon gesehen haben, was sie behaupten, so hat keiner die Frechheit, ja zu sagen. Und doch haben wir auch Sklaven, die einen mehr, die andern weniger, vor denen man nicht verborgen bleiben kann. Aber selbst aus diesen hat noch nie einer so etwas uns auch nur angedichtet. Wie könnte auch einer von Leuten, die es nicht einmal über sich bringen, bei einer gerechten Tötung zuzusehen, Menschenmord und Menschenfraß aussagen? Wer rechnet die Gladiatorenspiele und Tierkämpfe, besonders die von Euch veranstalteten, nicht zu den Dingen, die eifrige Beachtung verdienen? Doch macht es nach unserer Auffassung keinen großen Unterschied, ob man bei einer Tötung zuschaut oder sie selbst vollzieht, und deshalb haben wir den Anblick solcher Szenen verboten. Wie sollten also wir, die nicht einmal zusehen, damit uns nicht Blutschuld und Frevel beflecke, jemand töten können? Wie sollten wir, die da behaupten, daß jene Frauen, die zur Herbeiführung eines Abortus Medikamente anwenden, Menschenmörderinnen sind und sich einst bei Gott darüber zu verantworten haben, Menschen umbringen können? Es wäre doch sehr inkonsequent zu behaupten, auch der Embryo sei schon ein Mensch und Gegenstand göttlicher Fürsorge, und ihn dann, wenn er das Licht der Welt erblickt hat, zu töten; und die Aussetzung eines Kindes zu verbieten, weil Kindsaussetzung einem Kindsmorde gleichkommt, dasselbe aber dann, wann es herangewachsen ist, zu beseitigen. Wir sind aber in jeder Hinsicht und in allen Dingen sehr konsequent; denn wir sind Diener der Vernunft, nicht Verdreher derselben.</p>
      <h2>36</h2><p>Und wer erst, der an eine Auferstehung glaubt, wird sich für Leiber, die einst auferstehen sollen, zur Grabstätte darbieten? Denn es wäre wieder nicht konsequent, eine Auferstehung unserer Leiber zu erwarten und Leiber zu verzehren, wie wenn sie nicht zur Auferstehung bestimmt wären, oder zu glauben, daß zwar die Erde ihre Toten wieder herausgebe, daß aber die nicht zurückgefordert werden, die einer in sich selbst vergraben hat. Umgekehrt. Wer da glaubt, er brauche keine Rechenschaft zu geben, ob sein Leben in dieser Welt gut oder schlecht war, und es gebe keine Auferstehung, ja mit dem Leibe vergehe auch die Seele in der Weise eines Erlöschens, von einem solchen Menschen ist zu erwarten, daß er sich wohl keines Frevels enthält. Wir dagegen, die überzeugt sind, daß bei Gott nichts ungeprüft bleibt und daß der Leib, wenn er den unvernünftigen Trieben und Begierden der Seele gedient hat, auch an der Strafe teilnehmen muß, wir haben allen Grund, auch die kleinste Sünde zu verabscheuen. Wenn es aber dem einen oder andern eine gar törichte Rede dünkt, daß der verweste, aufgelöste und zerstörte Leib wieder zusammenkommt, so dürfte dieser Umstand, nämlich daß es Ungläubige gibt, noch kein genügender Grund sein, uns der Schlechtigkeit zu zeihen; man könnte uns höchstens Torheit vorwerfen. Denn wären unsere Grundsätze auch ein Werk der Selbsttäuschung, so würden sie doch niemand wehe tun. Da aber nicht nur nach unserer Lehre, sondern auch nach der Meinung vieler Philosophen die Leiber auferstehen werden, so ist hier nicht der Ort, Beweise hiefür beizubringen, damit wir nicht Dinge hereinziehen, die außerhalb unseres Programms liegen, indem wir etwa reden würden von dem Geistigen und von dem Sinnlichen und von der Zusammensetzung dieser beiden, oder davon, daß das Unkörperliche älter ist als das Körperliche und das Geistige früher als das Sinnliche, obwohl wir auf das Sinnliche zuerst stoßen; die Leiber aber bestehen teils aus dem Unkörperlichen, insofern das Geistige erst hinzutritt, teils aus dem Sinnlichen. Nach Pythagoras und Plato steht nämlich nichts im Wege, daß die Leiber, wenn sie sich aufgelöst haben, aus denselben Prinzipien, aus denen sie ursprünglich entstanden sind, abermals entstehen. Der Beweis für die Auferstehung sei jedoch zurückgestellt.</p>
      <h2>37</h2><p>Ihr aber, die Ihr Euch in jeder Hinsicht und in allen Dingen einer tüchtigen Begabung und Bildung erfreut, die Ihr weise Mäßigung mit Menschenliebe verbindet und wahrhaft würdige Herrscher seid, neiget mir, nachdem ich die Anschuldigungen entkräftet und den Nachweis geliefert habe, daß wir Gott verehren und in strenger Zucht ein anständiges Leben führen, Euer Herrscherhaupt! Denn welche Eurer Untertanen verdienen es, eher Erhörung ihrer Bitten zu finden als wir, die wir für Eure Herrschaft beten, damit die Regierung in gerechtester Erbfolge vom Vater auf den Sohn übergehe und Euer Reich wachse und gedeihe, indem die ganze Welt Euch untertan wird? Dies liegt auch in unserem Interesse, damit unser Leben ruhig und ungestört verlaufe und wir alle Anordnungen bereitwillig vollziehen können.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von P. Anselm Eberhard, <em>Bittschrift für die Christen</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 12), München 1913. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-1070/versions/bittschrift-fur-die-christen-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

