      <p><em>Über die Auferstehung der Toten, übersetzt von P. Anselm Eberhard (Bibliothek der Kirchenväter, 1. Reihe, Bd. 12, München 1913).</em></p><h2>1</h2><p>Neben jeder Lehre und Beweisführung, die in diesen Dingen das Richtige trifft, sproßt auch die eine oder andere Irrlehre auf, aber nicht aus irgendeinem Prinzip geht diese hervor und mit Naturnotwendigkeit, auch ergibt sie sich nicht aus dem Begriffsinhalt der jeweils behandelten Sache, sondern sie wird absichtlich beigebracht von Leuten, die es für rühmlich halten, zur Zerstörung der Wahrheit frevelhafte Lügensaat auszustreuen. Dies kann man zunächst an denen sehen, die sich schon in früherer Zeit mit solchen Fragen beschäftigt haben, und an den Widersprüchen, in die sie mit den noch älteren und mit ihren Zeitgenossen geraten sind, und nicht zum wenigsten gerade an der Verwirrung, die auf dem in Frage stehenden Gebiete herrscht. Keinen richtigen Gedanken gibt es, den solche Leute nicht bestritten hätten: nicht die Wesenheit Gottes, nicht sein Wissen und Wirken verschonten sie mit ihren boshaften Angriffen, nicht die hieraus in logischer Kette abgeleiteten Wahrheiten, die uns zu einem Gott wohlgefälligen Leben anleiten; während die einen auf die Wahrheit in solchen Dingen ein für allemal verzichten, drehen andere sie nach ihrem eigenen Kopfe und wieder andere liefern selbst das Evidente der Skepsis aus. Daher müssen meines Erachtens diejenigen, die sich mit einem derartigen Stoffe beschäftigen, eine doppelte Methode anwenden, <em>eine apologetische, welche die Wahrheit gegen Angriffe in Schutz nimmt, und eine dogmatisch-spekulative, welche sich mit der Wahrheit selbst beschäftigt</em>; erstere wendet sich dann an die Ungläubigen und Zweifler, letztere an alle, die guten Willens sind und die Wahrheit gerne aufnehmen. Deshalb muß ein jeder, der über ein solches Thema schreiben will, das jeweilig vorliegende Bedürfnis prüfen und darnach seine Ausführungen bemessen; dabei kann er die Reihenfolge der Gedanken nach Bedarf abändern; auch soll er nicht dadurch, daß er offensichtlich immer den nämlichen Ausgangspunkt festhält, das Zweckdienliche und die einem jeden Gedanken zukommende Stelle außer acht lassen. In Hinsicht auf Begründung und natürliche Folgerichtigkeit ist freilich jedesmal das dogmatisch-spekulative Verfahren dem apologetischen vorzuziehen; aber umgekehrt liegt die Sache, wenn man das praktische Bedürfnis ins Auge fast. Auch der Landmann kann wohl nicht den Samen in die Erde streuen, ohne zuvor das Unkraut und alles, was der edlen Saat hinderlich ist, entfernt zu haben; ebensowenig wird ein Arzt einem heilungsbedürftigen Körper eine seiner gesunden Arzeneien einflößen, bevor er ihn von dem vorhandenen Krankheitsstoff gereinigt und von hinzukommendem bewahrt hat. So kann auch der Lehrer der Wahrheit, wenn er über die Wahrheit sprechen will, niemand überzeugen, solange im Denken der Hörer eine falsche Meinung versteckt liegt und seinen Worten entgegensteht. Daher lassen auch wir aus praktischen Gründen den dogmatisch-spekulativen Erörterungen öfters apologetische vorangehen. Dieses Verfahren scheint auch jetzt, wo wir von der Auferstehung reden wollen, im Hinblick auf das Bedürfnis gar wohl am Platze zu sein. Denn es entgeht uns nicht, daß auch auf diesem Gebiete die einen ganz ungläubig sind, andere noch zweifeln und selbst von denen, die die Grundlagen schon angenommen haben, manche gleich den Zweiflern schwanken. Was aber das Widersinnigste ist, ist dies, daß sie solches tun, obschon die Sache selbst ihnen nicht den geringsten Anlaß zum Unglauben bietet und sie keinen triftigen Grund für ihren Unglauben oder Zweifel angeben können.</p>
      <h2>2</h2><p>2. Wollen wir die Sache so betrachten! Jeder Unglaube, der nicht leichtfertig und unüberlegt gehegt wird, sondern auf einen triftigen Grund und auf feste Überzeugung hin bei diesem oder jenem sich einnistet, hat Berechtigung, wenn die in Frage kommende Sache selbst unglaublich erscheint. <em>Aber an Dinge nicht zu glauben, die nicht unglaublich sind, verrät Mangel an gesundem Wahrheitssinn.</em> Daher sollten diejenigen, die sich in der Auferstehungsfrage des Unglaubens oder Zweifels nicht entschlagen können, nicht nach ihrer unüberlegten subjektiven Meinung oder nach dem Vorurteil der Zügellosen darüber entscheiden, sondern sie sollten entweder die Entstehung der Menschen von keiner Ursache abhängig machen (das aber läßt sich sehr leicht widerlegen) oder aber, indem sie in Gott den Urgrund alles Seienden suchen, die Grundlage dieser Lehre betrachten und mittels derselben den Beweis liefern, daß die Auferstehung durchaus nicht glaubwürdig ist. Dies wird ihnen aber erst dann gelingen, wenn sie nachweisen können, daß es weder in Gottes Macht noch in Gottes Willen liege, die entseelten oder auch schon ganz verwesten Leiber wieder zu einigen und zur Zusammensetzung der nämlichen Menschen zu verbinden. Können sie dies aber nicht, weg dann mit diesem gottlosen Unglauben, weg mit den frivolen Lästerungen! Mögen sie nämlich behaupten, die Auferstehung sei mit Gottes Macht oder sie sei mit Gottes Willen unvereinbar, sie treffen nicht das Richtige. Die nachfolgende Abhandlung wird dies deutlich zeigen.</p><p><em>Unvermögen</em> ist in Wahrheit offenbar dann vorhanden, wenn einer gar <em>nicht weiß</em>, was werden soll, oder wenn er es zwar weiß, aber <em>nicht auszuführen</em> vermag. Wer nämlich von dem, was werden soll, nichts weiß, wird, was er nicht weiß, übe rhaupt nicht anfangen und vollenden können; und wer zwar ganz gut weiß, was gemacht werden soll, und auch die Mittel und Wege hiezu kennt, aber die Macht, das Erkannte auszuführen, überhaupt nicht hat oder nicht in ausreichendem Maße hat, wird es, wofern er klug ist und seine Macht überlegt, von Anfang an nicht versuchen; hat er es aber unüberlegter Weise begonnen, wird er das Beschlossene nicht vollenden können.</p><p>Nun aber ist es ganz ausgeschlossen, daß Gott die Natur der zur Auferstehung bestimmten Leiber nicht kennt nach all ihren Teilen und Teilchen, daß er nicht weiß, wohin ein jedes Teilchen der sich auflösender Körper gerät und welcher Teil der Materie das Aufgelöste und zu dem ihm Verwandten Hinzugetretene aufgenommen hat, wenn auch menschlichen Augen das mit dem All in naturgemäßem Anschluß wiedervereinigte völlig ununterscheidbar vorkommt. Er, der schon vor der eigenartigen Zusammensetzung eines jeden Organismus die Natur der zu schaffenden Grundstoffe kannte, aus denen die Menschenleiber bestehen, und der auch wußte, aus welchen Teilen derselben er das zur Zusammensetzung des menschlichen Leibes Nötige nehmen sollte, weiß selbstverständlich auch nach der Auflösung des Ganzen, wo ein jedes der von ihm zum Aufbau der einzelnen Leiber verwendeten Atome hingekommen ist. Nach der jetzt für uns geltenden Ordnung der Dinge und nach der Beobachtung, die wir sonst machen, ist das Vorherwissen des Nochnichtseienden mehr; aber für Gottes Würde und Weisheit ist beides naturgemäß und ist das Vorherwissen des Nochnichtseienden nicht schwieriger als die Kenntnis des Aufgelösten.</p>
      <h2>3</h2><p>Daß er dann auch zur Auferweckung der Leiber die ausreichende Macht besitzt, beweist schon deren Entstehung. Wenn er nämlich die Menschenleiber und deren Elemente bei der ersten Zusammensetzung aus dem Nichts erschuf, wird er nach erfolgter Auflösung sie mit der gleichen Leichtigkeit auch auferwecken, wobei es gleichgültig ist, wie sie sich aufgelöst haben. Denn auch dies ist ihm gerade so leicht möglich. Und der Sache verschlägt es nichts, mag man die Elementarstoffe aus einer noch nicht differenzierten Materie oder die Menschenleiber aus den schon bestimmten Grundstoffen als dem Ursprünglichen oder aus Keimen herleiten. Eine Macht, die imstande war; die bei jenen Elementarstoffen vorausgesetzte gestaltlose Substanz zu gestalten, die ungeformte und ungeordnete durch viele und verschiedene Formen zu ordnen, die Teile der Grundstoffe zu einem einheitlichen Gebilde zu verbinden, den Keim, der einheitlich und einfach ist, zu vervielfältigen, das Ungegliederte zu gliedern, dem Leblosen Leben einzuhauchen, ist auch imstande, das Aufgelöste zu einigen, das Liegende aufzurichten, das Tote wieder zu beleben und das Verwesliche zur Unverweslichkeit emporzuheben. Einem und demselben kommt es zu, der nämlichen Macht und Weisheit, das an die Menge der mannigfachen Lebewesen, die sich an menschlichen Leibern zu vergreifen und sich an ihnen zu sättigen pflegen, Verteilte aus diesen auszuscheiden und mit den ursprünglichen Teilen und Teilchen wieder zu vereinigen, mag es nun in eines jener Lebewesen gekommen sein oder in viele und von diesen in andere, oder mag es, nachdem es mit diesen sich aufgelöst hat, in jenem natürlichen Prozesse, durch den sich alles wieder in die Grundstoffe auflöst, schon wieder zu diesen zurückgekehrt sein. Indes gerade dieser Gedanke ist es, der wohl am meisten die Köpfe verwirrte und selbst Kapazitäten stutzig machte, so daß sie, merkwürdig genug, die von der Menge vorgebrachten Bedenken für begründet hielten.</p>
      <h2>4</h2><p>Diese wenden ein, viele Leiber von denen, die bei Schiffbrüchen oder in Flüssen jämmerlich umkamen, seien schon Nahrung für Fische geworden, und viele Leiber der im Kriege Gefallenen oder durch ein herberes Geschick und durch den Drang der Umstände ohne Bestattung Gebliebene hätten den sie auffindenden Tieren zum Fraße gedient. Wenn nun die Leiber in der angegebenen Weise aufgezehrt werden und ihre integrierenden Teile und Teilchen zerstückelt in viele Organismen hineinkommen und sich in Form von Nahrung mit den Leibern der so ernährten Wesen vereinigen, so sei es, wendet man ein, fürs erste unmöglich, diese auszuscheiden, dann aber sei noch weniger durchführbar folgendes Zweite. Es kommen nämlich die Leiber jener Tiere, welche sich mit Menschenfleisch ernährt haben, falls sie sich zur Nahrung für Menschen eignen, selbst wieder in menschliche Mägen und werden so mit den Leibern der Essenden vereinigt; so müssen notwendig solche menschliche Teile, die den auffressenden Tieren zur Nahrung gedient haben, in andere Menschenleiber hinüberwandern, indem die mittlerweile hievon ernährten Tiere das, was ihnen zur Nahrung diente, in jene Menschen hinüberleiten, deren Nahrung sie selbst werden. Außerdem weist man mit erkünsteltem Pathos auf Kinderverzehrungen hin, zu denen Hungersnot oder Wahnsinn trieb, und auf die infolge feindlicher Überlistung von ihren eigenen Erzeugern aufgegessenen Kinder und jenen medischen Tisch und die tragischen Mahlzeiten eines Thyestes und reiht daran noch andere Begebenheiten ähnlicher Art, die sich erst jüngst bei Griechen und Barbaren zugetragen haben. Hiedurch glaubt man, die Unmöglichkeit der Auferstehung dartun zu können; denn bei der Auferstehung können nicht die nämlichen Teile verschiedenen Menschen zugewiesen werden, sondern es müssen entweder die Leiber der einen unvollständig bleiben, weil integrierende Bestandteile von ihnen in andere Menschen hineingekommen sind, oder wenn diese Teile ihren früheren Inhabern zurückerstattet werden, die Leiber der andern ein Manko erleiden.</p>
      <h2>5</h2><p>Mich aber will es bedünken, daß die Vertreter solcher Ansichten zunächst von der Macht und Weisheit dessen keinen Begriff haben, der da dieses All gebildet hat und lenkt, der der Natur und Art eines jeden Lebewesens die passende und entsprechende Nahrung bestimmt hat, der angeordnet hat, daß nicht jede Natur mit jedem Leibe sich vereinige und vermische, der auch die Scheidung des Geeinigten zu bewerkstelligen vermag, der der Einzelnatur der Geschöpfe das naturgemäße Tun und Leiden zuweist und ein anderes abhält, der schließlich alles, was er will, und zu dem Zwecke, wozu er will, geschehen läßt und verändert; ferner scheinen mir jene Leute auch die Fähigkeit und Natur der ernährenden und der ernährten Wesen im einzelnen nicht erwogen zu haben. Sonst müßten sie doch wissen, daß nicht alles, was einer aus Nachgiebigkeit gegen äußeren Zwang in sich aufnimmt, für seinen Organismus naturgemäße Nahrung wird, sondern daß manches schon beim Eintritt in die Gedärme verderben muß, indem es ausgespien wird oder abgeht oder sonstwie sich verteilt, so daß es auch nicht auf kurze Zeit die erste und naturgemäße Verdauung durchmacht, geschweige denn dem zu ernährenden Körper sich assimiliert; ja es braucht sich nicht einmal alles Verdaute, das die erste Veränderung schon überstanden hat, unter allen Umständen mit den zu ernährenden Teilchen vereinigen; manches kann schon im Magen die ernährende Kraft verlieren, anderes kann bei der zweiten Veränderung und bei der in der Leber erfolgenden Verdauung ausgeschieden werden und sich zu einem anderen Teile hinwenden, der mit der Nährkraft nichts zu tun hat; selbst die in der Leber bewirkte Veränderung dient nicht ausschließlich der menschlichen Ernährung; sie liefert naturgemäß auch zu anderen Zwecken etwas ab; ja es kann sogar vorkommen, daß die überflüssige Nahrung selbst noch in den ernährten Teilen und Teilchen anderen Zwecken dienstbar gemacht wird, wenn nämlich Sättigung oder Überfüllung vorherrscht, die das Aufgenommene irgendwie unschädlich zu machen oder zweckmäßig zu verwenden pflegt.</p>
      <h2>6</h2><p>Da also zwischen den animalischen Organismen eine große von der Natur gesetzte Verschiedenheit besteht und gerade die naturgemäße Ernährung bei jeder Art derselben und bei jedem zu ernährenden Leibe eine andere ist, da es ferner hinsichtlich der Ernährung eines jeden Organismus eine dreifache Reinigung und Aussonderung gibt, so muß einerseits alles für die Ernährung eines Organismus Ungeeignete, weil es sich mit diesem nicht vereinigen kann, vollständig zerstört werden und auf natürlichem Wege abgehen oder sich zu etwas anderem hinwenden; anderseits muß die Qualität des ernährenden Leibes den Qualitäten des zu ernährenden Leibes angepaßt und naturgemäß sein und schließlich, wenn sie den naturgemäßen Weg durch die aussondernden Organe zurückgelegt hat und durch die natürlichen Läuterungsmittel sorgfältig geläutert worden ist, ein ganz reiner Zuwachs zur Leibessubstanz werden. Nur so kann man sie auch, vorausgesetzt daß man den Dingen die rechten Namen geben will, Nahrung nennen; denn jetzt ist sie frei von allem für den Bestand des zu ernährenden Organismus Ungeeigneten und Schädlichen und von jener schweren Masse, die bloß zur Ausfüllung des Magens und zur Stillung der Begierde mitaufgenommen worden ist; jetzt vereinigt sie sich unbestreitbar mit dem zu ernährenden Körper, indem sie sich allen Teilen und Teilchen desselben einflicht und anbildet. Eine anders geartete und naturwidrige Nahrung dagegen wird entweder zerstört, wenn sie einer stärkeren Macht begegnet, oder sie wirkt auf eine schwächere Macht leichterdings selbst zerstörend und geht in schlechte Säfte und giftige Stoffe über, da sie dem zu ernährenden Körper nichts Verwandtes und Befreundetes zuführt. Der schlagendste Beweis hiefür ist die Tatsache, daß für viele Organismen, die so ernährt werden, Schmerz daraus erfolgt oder Lebensgefahr oder der Tod, wenn sie allzu gierig mit der Nahrung etwas Giftiges und Naturwidriges in sich aufgenommen haben. Dies kann den so ernährten Organismus ganz zerstören, zumal das, was ernährt werden soll, nur durch Verwandtes und Naturgemäßes ernährt wird, durch Entgegengesetztes aber der Zerstörung anheimfällt. Wenn also nach der Verschiedenheit der durch ihre Natur verschiedenen Organismen auch in der naturgemäßen Nahrung Verschiedenheit herrscht und von dieser selbst weder alles, was der Organismus aufgenommen hat noch auch jeder beliebige Teil hievon der Vermischung mit dem zu ernährenden Leibe fähig ist, sondern immer nur soviel, als durch die einzelnen Verdauungsstufen geläutert und zur Einigung mit dem so oder so beschaffenen Leibe vollkommen umgewandelt worden ist und sich den ernährten Teilen restlos einfügt, so kann selbstredend nie etwas Naturwidriges mit dem sich einigen, wofür es keine naturgemäße und entsprechende Nahrung ist, sondern es geht, sei es in seinem ursprünglichen Zustand oder auch zerstört, durch die Bauchhöhle ab, bevor es noch einen anderen Saft produzieren konnte, oder aber es bleibt länger darin und erzeugt dann Unbehagen oder unheilbare Krankheit, die auch die naturgemäße Nahrung oder sogar das der Nahrung bedürftige Fleisch mitzerstört. Ja - eine solche Substanz geht selbst dann, wenn sie einmal durch irgendwelche Arzneien oder durch bessere Speisen oder durch die natürlichen Kräfte überwunden und abgeführt wird, nicht ohne schwere Schädigung ab, weil sie wegen ihrer Unfähigkeit, sich zu assimilieren, der Natur des Körpers nichts Verträgliches zuführt.</p>
      <h2>7</h2><p>Selbst wenn man zugibt, die aus solchen Substanzen eingehende Nahrung (dieser Ausdruck sei gebraucht, weil er nun doch einmal der gewöhnlichere ist) werde trotz ihrer Naturwidrigkeit aufgesogen und verwandle sich in einen Teil des Flüssigen oder Trockenen oder Warmen oder Kalten, wird aus diesem Zugeständnis unsern Gegnern kein Vorteil erwachsen. Denn die auferstehenden Leiber setzen sich nur aus den eigenen Teilen wieder zusammen. Nun aber ist nichts von dem Erwähnten ein Teil noch kommt ihm die Beschaffenheit und der Platz eines ständigen Teiles zu; auch bleibt es nicht für immer bei den zu ernährenden Teilen des Leibes noch steht es auf mit dem Auferstehenden. Denn Blut, Schleim, Galle, Atem sind dann nicht mehr Lebensfaktoren. Was ehemals die auf Nahrung angewiesenen Leiber brauchten, werden sie dann nicht mehr brauchen; mit der Unvollkommenheit und Sterblichkeit derselben kommt auch ihr Nahrungsbedürfnis in Wegfall. Selbst wenn man annimmt, die durch solche Nahrung hervorgerufene Veränderung erstrecke sich sogar auf das Fleisch, so folgt daraus noch lange nicht, daß das infolge solcher Nahrung schließlich veränderte Fleisch, nachdem es in den Leib eines andern Menschen hineingekommen ist, als Bestandteil zu dessen Wiederaufbau verwendet werden muß. Denn das aufnehmende Fleisch selbst hält nicht jedesmal das aufgenommene fest und dieses ist selbst für den Fall, daß es sich damit vereinigt, kein ständiger Teil und bleibt nicht dauernd bei dem Fleische, dem es sich einverleibt hat; es unterliegt vielmehr einer starken Verwandlung in andere Stoffe, mag es sich nun infolge von Arbeiten und Sorgen verteilen oder infolge von Schmerzen, von Ermüdungen und Krankheiten, von Unpäßlichkeiten, die aus Erhitzung oder Erkältung entstanden sind, verzehren, was deswegen geschehen kann, weil das Fettnetz, welches unbeschadet seines eigenen Zustandes die Nahrung aufnimmt, nicht selbst wieder mit dem Fleische und Fette sich verändert. Zwar gibt es derartige Veränderungen bei jedem Fleische, viel häufiger jedoch kann man sie bei demjenigen Fleische konstatieren, das mit nicht verwandten Stoffen ernährt wird; bald schwillt es infolge des Aufgenommenen an und wird fett, dann wieder scheidet es dasselbe aus, wie es gerade geht, und wird mager, mag nun eine einzige der früher erwähnten Ursachen dies bewirken oder der Komplex mehrerer. Nur dasjenige Fleisch bleibt bei den einzelnen Teilen, die es zu verbinden oder einzuhüllen oder zu erwärmen bestimmt ist, welches von der Natur auserlesen ist und dem sich einverleibt, mit welchem vereint es das natürliche Leben und die in diesem Leben stattfindenden Funktionen bewirkt. Nur wenn man die im Vorhergehenden angestellte Untersuchung nicht gehörig würdigt und die daraus gezogenen Konsequenzen nicht anerkennt und annimmt, lassen sich die Einwände der Gegner noch aufrecht halten. Indes werden sich Menschenleiber nie ihresgleichen assimilieren, wenn einmal einer aus Unwissenheit, von einem andern in Sinnestäuschung versetzt, von einem solchen Leibe etwas in sich aufnimmt oder von selbst aus Not oder im Wahnsinn mit dem Leibe eines Gleichartigen sich befleckt; denn wir dürfen nicht vergessen, daß es wirklich Bestien in Menschengestalt gibt, Synthesen aus Mensch und Tier, wie phantasievolle Dichter sie zu ersinnen pflegen.</p>
      <h2>8</h2><p>Wozu soll ich noch länger von den Leibern reden, die keinem andern Lebewesen zur Nahrung bestimmt sind, sondern aus Ehrfurcht vor ihrer Natur nur in der Erde ihre Grabstätte erhalten sollen? Nach dem Willen des Schöpfers soll ja nicht einmal ein Tier Nahrung für ein Tier der nämlichen Art werden, obschon es sich naturgemäß von anderen Tieren anderer Art ernähren darf. Gelingt also den Gegnern der Nachweis, daß den Menschen Menschenfleisch zur Speise bestimmt ist, so wird nichts mehr im Wege stehen, daß die Menschenfresserei naturgemäß ist wie irgend etwas anderes von der Natur Gestattetes und daß die frechen Verkünder solcher Lehre gerade an den Leibern ihrer Liebsten sich gütlich tun, da ihnen diese näher stehen, oder eben hiemit ihre besten Freunde bewirten, Wenn aber schon solche Worte sündhaft sind und der Genuß menschlichen Fleisches durch Menschen etwas ganz Scheußliches und Verruchtes ist und frevelhafter als jede andere verbotene und widernatürliche Speise oder Tat, wenn das Naturwidrige für die nahrungsbedürftigen Teile und Teilchen wohl nie zur wirklichen Nahrung wird und alles, was nicht zur Nahrung wird, sich dem nicht assimiliert, was es seiner Bestimmung nach auch gar nicht ernähren soll, so werden sich auch die Menschenleiber nie mit gleichartigen Leibern einigen, da sie für diese keine naturgemäße Nahrung bilden, mögen sie noch so oft infolge herben Mißgeschickes durch einen menschlichen Magen hindurchgehen. Sie haben keine ernährende Kraft und kehren sich auflösend wieder zu den Elementen zurück, woraus sie ihre erste Gestaltung empfangen haben. Mit diesen bleiben sie so lange vereinigt, als es eben einem jeden Teile gestattet ist. Von hier werden sie durch die Weisheit und Macht dessen, der jeden Organismus samt den zugehörigen Kräften gebildet hat, wieder ausgeschieden und dann vereinigt sich jedes mit jedem ganz nach seiner Natur, mag es nun im Feuer verbrannt oder im Wasser verfault oder von Raubtieren oder anderen hinzukommenden Lebewesen verzehrt worden sein oder mag es, vom Gesamtorganismus losgetrennt, schon vor den andern Teilen sich aufgelöst haben. Die Teile werden wieder miteinander vereinigt und bekommen ihren alten Platz, damit wieder der nämliche Leib harmonisch sich zusammensetze und das Entseelte oder auch schon ganz Verweste zu neuem Leben auferstehe. Mich noch weiter hierüber zu verbreiten halte ich nicht für angezeigt. Die Sache hat eine Erledigung gefunden, die nur noch bei solchen auf Widerspruch stößt, die halb tierisch sind.</p>
      <h2>9</h2><p>Da es vieles gibt, was für unser Thema weit brauchbarer ist, so will ich jetzt nicht reden von denen, die sich auf die Werke der Menschen und auf deren menschliche Bildner berufen, die ihre zerschlagenen oder mit der Zeit alt gewordenen oder sonstwie zerstörten Werke nicht wieder neu machen können, und mit Hilfe dieses Töpfer- und Zimmermannvergleiches zu beweisen suchen, auch Gott habe weder den Willen noch, wenn er den Willen hätte, die Macht, einen entseelten oder auch schon verwesten Leib wieder aufzuwecken. Diese Leute übersehen ganz, daß sie hiemit in schlimmster Weise Gott lästern, da sie die Kräfte zweier in völligem Gegensatz stehenden Naturen oder vielmehr die Naturen selbst, die sich dieser Kräfte bedienen, auf gleiche Stufe stellen und zwischen Kunsterzeugnissen und Werken der Natur nicht unterscheiden. Hierüber ernstlich zu disputieren würde Tadel verdienen; denn es wäre wahrlich töricht, mit der Oberflächlichkeit und Hohlheit sich abzugeben. Da ist es doch viel annehmbarer und zugleich das Allerrichtigste, den Satz aufzustellen: "Was bei den Menschen unmöglich ist, ist möglich bei Gott“. Gelingt es nun der Vernunft, mit Hilfe jenes annehmbaren Satzes und im Anschluß an das kurz vorher gewonnene Resultat, die Möglichkeit (der Auferstehung) darzulegen, so besteht offenbar keine Unmöglichkeit; die Auferstehung entspricht aber auch dem Willen Gottes.</p>
      <h2>10</h2><p>Ist etwas mit dem Willen Gottes nicht vereinbar, so liegt der Grund hiefür entweder in der Ungerechtigkeit der Sache oder in ihrer Unangemessenheit. Die Ungerechtigkeit käme in der Auferstehungsfrage in Betracht entweder in Hinsicht auf den Auferstehenden selbst oder auf irgendeinen andern neben ihm. Daß kein außerhalb der Menschheit stehendes und zur Welt gehöriges Wesen dadurch ein Unrecht erleidet, ist von vornherein klar. Den rein geistigen Naturen wird durch die Auferstehung der Menschen schwerlich ein Unrecht geschehen; denn die Auferstehung der Menschen bringt ihnen weder eine Einschränkung ihrer Existenz noch Schaden noch Unehre. Aber auch der unvernünftigen und unbeseelten Welt wird dadurch kein Unrecht widerfahren, denn diese wird nach der Auferstehung nicht mehr sein, gegen ein Nichtseiendes aber gibt es kein Unrecht; angenommen jedoch, sie bestehe in Ewigkeit fort, auch dann würde ihr durch die Erneuerung der Menschenleiber kein Unrecht geschehen; denn wenn ihr jetzt kein Unrecht geschieht, indem sie sich der menschlichen Natur und den Bedürfnissen der auf sie angewiesenen Menschen fügen muß und unterjocht und vielfach geknechtet ist, so wird dies noch viel weniger der Fall sein, wenn einmal die Menschen unsterblich und bedürfnislos geworden sind und ihre Dienste nicht mehr nötig haben, so daß sie dann aller Knechtschaft enthoben ist. Auch würde sie, wenn sie reden könnte, gewiß nicht den Weltbildner verklagen, als habe er sie gegen die Gerechtigkeit unter die Menschen erniedrigt, da er ihr nicht die nämliche Auferstehung wie diesen gewährt habe; denn ungleiche Naturen bestimmt ein Gerechter nicht zu gleichem Ziele; außerdem können Wesen, denen der Begriff der Gerechtigkeit fehlt, nicht den Vorwurf der Ungerechtigkeit erheben. Ferner kann man auch nicht behaupten, daß im Hinblick auf den auferstehenden Menschen selbst eine Ungerechtigkeit sich zeigt. Dieser besteht aus Seele und Leib; nun aber widerfährt ihm weder in Bezug auf die Seele noch in Bezug auf den Leib ein Unecht. Daß der Seele ein Unrecht geschieht, wird kein Vernünftiger behaupten wollen; er würde mit dieser Behauptung, ohne es selbst zu merken, auch den gegenwärtigen Lebenszustand verwerfen. Denn wenn ihr jetzt kein Unrecht geschehen ist, indem sie in eine sterblichen und leidensfähigen Leibe wohnt, wird dies noch viel weniger der Fall sein, wenn sie einmal mit einem unsterblichen und leidensunfähigen Leibe zusammenlebt. Aber auch dem Leibe widerfährt kein Unrecht; denn wenn ihm jetzt kein Unrecht geschieht, indem er als sterblicher Teil mit einem unsterblichen vereint ist, wird ihm auch keines geschehen, wenn er einmal als unsterblicher Teil mit einem unsterblichen vereint ist. Endlich wird auch niemand behaupten wollen, in der Auferweckung und Wiedervereinigung des aufgelösten Leibes liege für Gott eine Unangemessenheit. Denn wenn das Geringere nicht gegen Gottes Würde war, nämlich die Erschaffung eines sterblichen und leidensfähigen Leibes, so ist es noch viel weniger das Größere, nämlich das Unsterbliche und Leidensunfähige.</p>
      <h2>11</h2><p>Nachdem nun an der Hand dessen, was naturgemäß das erste ist, und dessen, was weiterhin daraus folgt, jeder einzelne Fragepunkt seine Erledigung gefunden hat, ist es klar geworden, daß die Auferweckung der aufgelösten Leiber ein Werk ist, das mit dem Willen und mit der Macht des Weltschöpfers vereinbar ist und keine Unangemessenheit für ihn einschließt. Denn durch die bisherigen Ausführungen wurde die gegenteilige Ansicht und das widersinnige Gerede der Ungläubigen als unhaltbar dargetan. Wozu soll ich noch reden von der Beziehung dieser drei Punkte aufeinander und von ihrer Übereinstimmung miteinander? Braucht man überhaupt von einer Übereinstimmung derselben zu reden, wie wenn sie irgendwie voneinander geschieden wären, statt einfach zu sagen, daß das Mögliche auch gewollt ist und daß das, was Gott will, auch in seiner Macht liegt und der Würde des Wollenden entspricht?</p><p>Daß die dogmatisch-spekulative Methode von der apologetischen verschieden ist, wurde schon eingangs genugsam hervorgehoben, ebenso worin der Unterschied besteht und wann und gegen welche Leute eine jede von beiden sich nützlich erweist. Nun steht vielleicht nichts im Wege, zum Zwecke gemeinsamer Vergewisserung und wegen des Zusammenhanges des bisher Gesagten mit dem noch übrigen nochmals mit diesen zwei Methoden und dem, was ihnen zukommt, zu beginnen. Der einen käme naturgemäß der Vorrang zu und die andere müßte ihr Trabantendienste leisten, den Weg vor ihr bahnen und alle Hindernisse und Widerstände beseitigen. Die dogmatisch-spekulative Methode ist nämlich schon deswegen die wichtigere, weil sie für alle Menschen zur Erlangung der Gewißheit und des Heiles ein notwendiges Mittel ist. Dies bringt schon die Natur der Sache mit sich, dann auch die Rangstellung dieser Methode und schließlich das praktische Bedürfnis. Die Natur der Sache bringt es mit sich, weil die dogmatisch-spekulative Methode den Sachverhalt eigentlich erst darlegt; ihre Rangstellung, weil sie in dem, was sie verkündigt, ganz aufgeht und damit zusammenfällt; das praktische Bedürfnis, weil sie dem Lernenden liebevoll Gewißheit und Heil vermittelt. Dagegen steht die apologetische Methode hinsichtlich der Natur der Sache und hinsichtlich der Wirkung der dogmatisch-spekulativen nach; denn die Widerlegung des Irrtums ist weniger als der Erweis der Wahrheit. Sie steht ihr auch nach in der Rangordnung; denn sie wendet ihre Spitze gegen falsche Meinungen; eine falsche Meinung ist aber nur das Produkt schlimmer Nachsaat oder verderblicher Nebenlehre. Aber trotzdem wird sie oft absichtlich vor der dogmatisch-spekulativen Methode angewandt und erweist sich unter Umständen als brauchbarer, insofern sie den Unglauben, der so manchen hinderlich ist, und bei Neulingen den Zweifel oder die falsche Meinung zerstört und beseitigt. Auch streben beide Methoden auf dasselbe Ziel hin; die Gottseligkeit ist das Ziel, das sowohl der Widerleger des Irrtums als der Lehrer der Wahrheit im Auge hat. Freilich sind sie nicht ganz und gar eines, sondern die eine ist, wie gesagt, für alle Gläubigen und für alle, die um die Wahrheit und um ihr eigenes Heil besorgt sind, notwendig, während die andere nur manchmal und manchen und gegen manche sich als brauchbarer erweist. Soviel also sei im allgemeinen vorausgeschickt, um schon Gesagtes noch einmal in Erinnerung zu bringen. Doch nun zu unserm eigentlichen Thema!</p><p>Es handelt sich jetzt darum, die Auferstehungslehre als wahr zu beweisen unmittelbar aus der Ursache, nach welcher und aus welcher der erste Mensch entstanden ist und seine Nachkommen, wenn letztere auch nicht auf die gleiche Weise entstanden sind, dann aus der allen Menschen als Menschen gemeinschaftlichen Natur, endlich aus dem Gerichte, welches der Schöpfer über die Menschen halten wird mit Berücksichtigung der Zeit, in der einer gelebt hat, und die Staatsgesetze, denen er als Bürger untertan sein mußte, so daß wohl niemand an der Gerechtigkeit dieses Gerichtes zweifeln kann.</p>
      <h2>12</h2><p>Den von der Entstehungsursache abgeleiteten Beweis bekommen wir, wenn wir uns fragen, ist der Mensch von ungefähr und zwecklos erschaffen worden oder zu einem bestimmten Zwecke; und wenn das letztere der Fall ist, ist er dann da, um nach seiner Erschaffung für sich selbst zu leben und in der ihm angeschaffenen Natur fortzubestehen oder, weil ein anderes Wesen seiner bedarf; wenn er aber in Hinsicht auf ein Bedürfnis erschaffen wurde, ist es dann der Schöpfer selbst, der seiner bedarf, oder irgendein anderes Wesen, das diesem nahe steht und sich hoher Fürsorge erfreut. Was wir schon bei einer allgemeineren Betrachtung finden können, ist die Tatsache, daß jeder Verständige, jeder, der sich durch vernünftiges Urteil zu einer Tätigkeit bewegen läßt, nichts von dem, was er vorsätzlich ins Werk setzt, zwecklos tut, sondern entweder um ein eigenes Bedürfnis zu befriedigen oder einem anderen Wesen, für das er besorgt ist, zu nützen oder wegen des Werkes selbst, wenn ihn nämlich ein natürlicher Zug, eine natürliche Liebe zu dessen Hervorbringung bewegt. So baut der Mensch (ein Beispiel möge die Sache erläutern) ein Haus, weil er selbst dessen bedarf; er baut aber auch für Rinder, Kamele oder für die anderen Tiere, die er benötigt, das einem jeden derselben passende Obdach; wenn man nach dem Augenschein urteilt, tut er dies nicht zu eigenem Gebrauche, wohl aber, wenn man den Endzweck berücksichtigt; zunächst tut er es aus Fürsorge für seine Pfleglinge. Er erzeugt auch Kinder, nicht etwa weil er selbst deren bedarf oder um eines anderen Wesens willen, das ihm nahe steht, sondern in der Absicht, daß seine Sprößlinge einfach da sind und da bleiben solang als möglich, wobei er sich mit der Nachfolge seiner Kinder und Enkel über sein eigenes Ende tröstet und das Sterbliche auf diese Weise unsterblich zu machen wähnt. So machen es die Menschen. Indes hat auch Gott den Menschen wohl nicht zwecklos erschaffen; denn er ist weise; kein Werk der Weisheit aber entbehrt des Zweckes. Auch hat er ihn nicht erschaffen, weil er selbst seiner bedürfte; denn er bedarf überhaupt nichts; einem Wesen aber, das vollständig bedürfnislos ist, kann keines seiner Werke zu eigenem Bedarfe dienen. Er hat aber auch den Menschen nicht um eines andern Geschöpfes willen gemacht; denn kein vernünftiges und urteilsfähiges Wesen wurde oder wird ins Dasein gesetzt, um einem anderen Wesen, sei es nun ein höheres oder ein geringeres, zum Gebrauche zu dienen, sondern um selbsteigenes Leben zu haben, wenn es einmal geworden ist, und selbsteigenen Fortbestand. Auch kann die Vernunft die Entstehung des Menschen nicht auf irgendein Bedürfnis zurückführen; denn die unsterblichen Wesen sind bedürfnislos und brauchen zu ihrer Existenz in keiner Weise eine menschliche Hilfe; die unvernünftigen Wesen dagegen müssen sich nach dem natürlichen Lauf der Dinge beherrschen lassen und dem Menschen die ihrer Natur entsprechenden Dienste leisten, während sie selbst nicht fähig sind, sich der Menschen zu bedienen; denn recht war es nicht und ist es nicht, das Herrschende und Führende in den Dienst eines Geringeren zu stellen oder das Vernünftige dem Unvernünftigen unterzuordnen, das doch zum Herrschen ungeeignet ist. Wenn also der Mensch nicht grund- und zwecklos geschaffen ist (denn kein göttliches Werk ist zwecklos), wenn ferner seine Entstehung weder auf ein Bedürfnis des Schöpfers selbst noch auf ein Bedürfnis eines anderen von Gott geschaffenen Wesens zurückzuführen ist, so ist es klar, daß in erster und allgemeinerer Hinsicht Gott den Menschen geschaffen hat, weil er eben Gott ist und weil überhaupt aus dem Schöpfungswerke seine Güte und Weisheit hervorleuchtet; betrachtet man jedoch die Sache mehr vom Standpunkt der geschaffenen Menschen aus, dann deswegen, weil er das Leben derselben will und zwar nicht ein Leben, das nur für kurze Zeit entfacht wird, dann aber gänzlich erlöschen soll. Den Reptilien freilich, den Luft- und Wassertieren, überhaupt allem Vernunftlosen hat Gott ein kurzes Leben beschieden, dagegen hat er den Menschen, die das Bild des Schöpfers selbst in sich tragen und mit Vernunft und unterscheidendem Verstande begabt sind, ewige Fortdauer verliehen. Denn ihre Bestimmung ist es, in der Erkenntnis ihres Schöpfers und seiner Macht und Weisheit und in der Erfüllung des Gesetzes und Rechtes die ganze Ewigkeit hindurch ohne alles Leid in jenen Gütern zu leben, durch die sie auch schon ihrem vorausgehenden Leben Festigkeit und Halt gegeben haben, obwohl sie in sterblichen und irdischen Leibern wohnten. Alles, was um eines anderen willen entstanden ist, muß, sobald das, wofür es entstanden ist, aufhört, ebenfalls zu sein aufhören; es kann nicht zwecklos fortbestehen, da die Zwecklosigkeit in den Werken Gottes keine Stätte findet; was aber gerade zu dem Zwecke entstanden ist, daß es sei und seiner Natur entsprechend lebe, das kann, weil hier die Ursache mit der Hervorbringung dieser Natur am Ziele angelangt ist und offenbar nichts anderes als die Existenz bezweckte, nie einer anderen Ursache zugänglich sein, welche die Existenz völlig aufheben würde. Vielmehr muß, weil jene Ursache offenbar jedesmal die Existenz bezweckte, das entstandene Wesen auch ganz erhalten bleiben mit all den aktiven und passiven Qualitäten, die zu seiner Natur gehören; auch muß jeder seiner beiden Bestandteile das Seinige mitbeitragen; die Seele nämlich muß in dem ihr angeschaffenen Zustand gleichmäßig sein und beharren und all das leisten, was ihr naturgemäß zukommt; es kommt ihr aber zu, die Begierden des Leibes zu beherrschen und jeden einzelnen Fall mit den gehörigen Beurteilungsmitteln und Maßstäben zu beurteilen und zu messen; der Leib dagegen muß sich naturgemäß zu all dem bewegen lassen, wozu er bestimmt ist, und die ihm beschiedenen Veränderungen annehmen, nämlich außer den andern, die auf die verschiedenen Altersstufen oder auf Gestalt und Größe sich beziehen, auch die Auferstehung. Denn eine Art Veränderung und zwar die allerletzte ist sowohl die Auferstehung als auch die Umwandlung ins Bessere, welche bei den in jener Zeit noch Lebenden erfolgen wird.</p>
      <h2>13</h2><p>Dies (Kommende) steht für uns nicht weniger fest als das bereits Geschehene. In Anbetracht unserer Natur sind wir einerseits mit dem gegenwärtigen Lebenszustand zufrieden, mag er auch, wie es nun einmal sein muß, den Stempel der Unvollkommenheit und Vergänglichkeit tragen, anderseits aber hoffen wir mit Zuversicht auf eine Fortdauer in Unvergänglichkeit. Kein Wahngebilde menschlicher Phantasie ist es, worauf wir bauen, keine trügerische Hoffnungen sind es, womit wir uns nähren, sondern wir haben dem untrüglichsten, dem verlässigsten Bürgen vertraut, nämlich der Absicht unseres Schöpfers, die ihn bewog, den Menschen aus einer unsterblichen Seele und einem Leibe zu bilden und ihn mit Verstand und einem eingepflanzten Sittengesetz auszustatten, damit er das Heil erlange und die göttlichen Gaben bewahre, die einem verständigen und vernünftigen Leben angepaßt sind. Denn wir sind fest überzeugt, Gott hätte ein solches Wesen nicht hervorgebracht und mit allen zu einer Fortdauer dienlichen Mitteln ausgestattet, wenn er die Fortdauer dieses Geschöpfes nicht gewollt hätte. Wenn also der Weltschöpfer den Menschen dazu geschaffen hat, daß er ein verständiges Leben habe und, nachdem er einmal Gottes Herrlichkeit und Schöpferweisheit geschaut, immerdar in der Schauung dieser Dinge bleibe, wie es der Absicht des Schöpfers und der Natur des Menschen entspricht, so ergibt sich aus der Entstehungsursache die Gewißheit der ewigen Fortdauer, aus dieser aber die Gewißheit der Auferstehung, ohne die es eine Fortdauer des Menschen nicht geben könnte. So wird also die Auferstehung, wie aus dem Gesagten ersichtlich ist, durch die Entstehungsursache und durch des Schöpfers Absicht klar bewiesen. Soviel also über die Entstehungsursache, wodurch der Mensch in die Welt eingeführt wurde. Im Anschlusse daran haben wir nun zu betrachten, was naturgemäß oder in logischer Verknüpfung weiterhin folgt. Nun aber kommt nach dem Gange unserer Untersuchung zuerst die Entstehungsursache zur Sprache, dann die Natur der geschaffenen Menschen, hierauf das Gericht, welches der Schöpfer in seiner Gerechtigkeit über die Menschen halten wird, schließlich des Lebens Endziel. Nachdem wir den ersten Punkt erledigt haben, müssen wir jetzt die Natur des Menschen betrachten.</p>
      <h2>14</h2><p>Der Beweis für die Lehren der Wahrheit oder für die wie nur immer zur Untersuchung vorgelegten Sätze geht, wenn er das Besprochene wirklich unzweifelhaft gewiß machen will, nicht von Dingen aus, die außerhalb der Sache liegen, auch nicht von gegenwärtigen oder früheren Autoritäten, sondern vom allgemeinen und natürlichen Denken oder von der logischen Konsequenz aus gegebenen Prämissen, Denn entweder handelt es sich um die Fundamentalsätze, und dann bedarf es nur eines leisen Anstoßes, der das natürliche Denken weckt, oder um die notwendig daraus abgeleiteten Wahrheiten und um die natürliche Schlußfolge, und dann bedarf es einer richtigen Reihenfolge der Sätze und des Nachweises, was denn eigentlich in Wahrheit aus den Prinzipien und Prämissen folgt; jedoch darf man dabei die Wahrheit oder Folgerichtigkeit nicht übersehen und das von der Natur Geordnete oder Abgegrenzte nicht durcheinander werfen oder die natürliche Verkettung zerreißen. Hat man sich also mit dem vorliegenden Thema gehörig beschäftigt und will man darüber ein verständiges Urteil abgeben, ob es eine Auferstehung der menschlichen Leiber gibt oder nicht, so muß man meines Erachtens vor allem die Tragkraft der für den Beweis der Thesis dienlichen Prämissen und die Reihenfolge der einzelnen Beweispunkte hübsch ins Auge fassen, nämlich welches der erste ist und der zweite und dritte und schließlich der letzte. Hat man den Stoff in dieser Weise gegliedert, so muß man die Entstehungsursache des Menschen, d. h. die Absicht des Schöpfers bei der Erschaffung des Menschen, an die erste Stelle setzen; darauf muß man wegen des inneren Zusammenhanges die Natur der geschaffenen Menschen folgen lassen, nicht als ob diese wirklich die zweite Stelle einnähme, sondern nur deswegen, weil man über beide Momente nicht in einem Atemzuge reden kann, wenn sie auch soviel als möglich miteinander zusammenfallen und für die vorliegende Frage von gleicher Wichtigkeit sind. Hat man nun durch diesen ersten, von der Erschaffung ausgehenden Beweis die Auferstehung klar gemacht, so muß man nichtsdestoweniger auch noch durch den Vorsehungsbeweis dieselbe erhärten, nämlich durch die einem jeden Menschen nach gerechtem Urteile geschuldete Belohnung oder Strafe und das Endziel des menschlichen Lebens. Denn viele, welche die Auferstehungslehre behandelten, haben den ganzen Beweis hiefür in diesem dritten Punkte gefunden, in der Meinung, die Auferstehung sei allein durch das Gericht veranlaßt. Dies aber ist ein Irrtum, der darin seine volle Widerlegung findet, daß alle verstorbenen Menschen auferstehen, aber nicht alle Auferstandenen gerichtet werden. Wäre die Gerechtigkeit im Gerichte der einzige Grund der Auferstehung, so dürften diejenigen nicht auferstehen, die weder Böses noch Gutes getan haben, nämlich die ganz kleinen Kinder. Da aber alle auferstehen dürfen, außer den andern auch die im Blütenalter Abgeschiedenen, so bestätigen jene selbst, daß die Auferstehung in erster Linie nicht wegen des Gerichtes stattfindet, sondern wegen der Absicht des Schöpfers und der Natur der geschaffenen Menschen.</p>
      <h2>15</h2><p>Obwohl nun der für die Entstehung des Menschen geltende Grund allein schon hinreicht, um nachzuweisen, daß die Auferstehung mit natürlicher Konsequenz auf die Auflösung der Leiber folgt, so ist es doch vielleicht recht und billig, damit von der angekündigten Disposition kein Punkt unbesprochen bleibt, im Anschluß an das bisher Gesagte Leuten, die nicht von selbst zu einer richtigen Ansicht gelangen können, zu zeigen, was sich aus jedem der folgenden Punkte für Beweismomente ergeben und wie mehr als das andere die Natur der geschaffenen Menschen zu dem nämlichen Gedanken hinlenkt und der Auferstehung die gleiche Gewißheit verleiht. Immer und überall gehört zur menschlichen Natur eine unsterbliche Seele und der bei der Entstehung ihr beigesellte Leib; denn Gott hat weder der Natur der Seele für sich allein noch der Natur des Leibes für sich allein diese Art der Entstehung, dieses Leben und Wirken zugewiesen, sondern dem aus beiden Faktoren bestehenden Menschen, damit derselbe mit den Bestandteilen, durch die er entstanden ist und lebt, auch wirke und ein einheitliches, beiden Bestandteilen gemeinsames Endziel habe. Ist auch der Mensch aus zwei verschiedenen Naturen zusammengesetzt, so ist er doch ein einheitliches Wesen, das bald seelische, bald körperliche Affekte empfindet und Dinge unternimmt und ausführt, welche bald die sinnliche, bald die geistige Urteilskraft in Anspruch nehmen. So muß sich denn die ganze Verkettung dieser Zustände und Tätigkeiten auf ein einheitliches Endziel beziehen; alles muß sich zu harmonischer Einheit, zu voller Zusammenstimmung im Menschenwesen vereinigen, Entstehung und Natur, Leben, Tun und Leiden, das irdische Wirken und das naturgemäße Endziel. Herrscht im ganzen Wesen, sowohl in den seelischen Vorgängen wie in den körperlichen Verrichtungen, Zusammenhang und Zusammenklang, dann muß auch das Endziel der zusammenstimmenden Teile ein einheitliches sein. Einheitlich aber wird das Endziel in Wahrheit nur dann sein, wenn derjenige, dessen Endziel es eben ist, seiner Zusammensetzung nach das nämliche Wesen bleibt; das nämliche Wesen wird er aber offenbar nur dann bleiben, wenn alle Bestandteile seines Wesens die nämlichen bleiben; diese aber werden die nämlichen bleiben und die ihnen charakteristische Einigung aufzeigen, sobald die getrennten Teile zur Zusammensetzung des Wesens wieder vereinigt werden; ist es aber notwendig, daß die getrennten Teile zusammengesetzt werden, damit die nämlichen Menschen wieder entstehen, so ist damit die Auferstehung der entseelten und aufgelösten Leiber bewiesen. Denn ohne die Auferstehung könnten weder die nämlichen Teile naturgemäß miteinander vereinigt werden noch könnte die Natur der nämlichen Menschen zustande kommen. Und wenn Vernunft und Verstand den Menschen dazu gegeben ist, daß sie das Geistige erfassen, nicht nur (konkrete) Wesenheiten, sondern auch die Güte, Weisheit und Gerechtigkeit des Gebers, so muß, da gerade das (Ziel), um dessentwillen der unterscheidende Verstand gegeben ist, fortdauert, auch das hiezu gegebene unterscheidende Vermögen fortdauern. Dieses aber könnte nicht fortdauern, wenn nicht die Natur, die dasselbe in sich aufgenommen hat, in denen, in welchen sie jetzt ist, auch fortdauerte. Was aber Vernunft und Verstand in sich aufgenommen hat, ist der ganze Mensch, nicht die Seele für sich allein. In Ewigkeit fortdauern muß also der aus Seele und Leib bestehende Mensch. Dies ist aber nur dann möglich, wenn er aufersteht. Findet keine Auferstehung statt, so kann die Menschennatur als solche nicht fortdauern. Gibt es aber keine Fortdauer der Menschennatur, dann ist die Seele zwecklos mit der Armseligkeit und den Affekten des Leibes zusammengekoppelt, zwecklos ist dann auch der Leib hinsichtlich der Befriedigung seiner Begierden gefesselt, da er sich die Lenkung und Leitung durch die Seele gefallen lassen muß, zwecklos ist die Vernunft gegeben, zwecklos ist das Denken und die Beobachtung der Gerechtigkeit oder die Übung jeglicher Tugend, die Abfassung und Aufstellung von Gesetzen, überhaupt alles, was es in der Menschheit und wegen der Menschheit Schönes gibt, ja sogar die Entstehung und Natur der Menschen selbst. Ist dagegen die Zwecklosigkeit von allen Werken Gottes und von allen seinen Gaben vollständig ausgeschlossen, dann muß eben mit der unsterblichen Seele in alle Ewigkeit auch der Leib fortdauern und zwar in der ihm eigentümlichen Natur.</p>
      <h2>16</h2><p>Man nehme keinen Anstoß daran, wenn wir ein Leben, das durch Tod und Verwesung unterbrochen wird, Fortdauer nennen; man bedenke vielmehr, daß dieses Wort nicht nur in einem Sinne gebraucht wird und daß der Begriff der Fortdauer mehreres bedeutet, da ja auch die Natur der Fortdauernden nicht eine und dieselbe ist. Denn wenn ein jedes Fortdauernde eine seiner eigenen Natur entsprechende Fortdauer hat, so muß offenbar das schlechthin Unverwesliche und Unsterbliche eine andere Fortdauer haben, da man die stärkeren Wesenheiten nicht auf die gleiche Stufe stellen darf mit den untergeordneten. Es wäre daher unbillig, beim Menschen jene gleichmäßige und unveränderte Fortdauer zu verlangen; denn während jene höheren Wesen von Anfang an unsterblich sind und nach dem Willen des Schöpfers sich ewiger Fortdauer erfreuen, hat der Mensch von Geburt an nur mit seinem seelischen Teile eine unveränderte Fortdauer; hinsichtlich seiner Leiblichkeit bekommt er die Unverweslichkeit erst infolge einer Veränderung. Das ist der Sinn und Zweck der Auferstehung. Im Hinblick auf diese sehen wir der Auflösung des Leibes, die nun einmal auf das mit Unvollkommenheit und Verweslichkeit behaftete Erdenleben folgen muß, getrost entgegen und erwarten nach diesem Leben eine Fortdauer in Unverweslichkeit. Denn wir wissen zwischen unserem Lebensende und dem der unvernünftigen Wesen, zwischen der Fortdauer der Menschen und der Fortdauer der unsterblichen Wesen wohl zu unterscheiden und wollen nicht den Fehler machen, die Natur und das Leben der Menschen mit Ungehörigem zusammenzustellen. Man darf sich also nicht daran stoßen, wenn bei der Fortdauer des Menschen eine Ungleichheit sich zeigt, und die Auferstehung ablehnen, weil eine Trennung der Seele vom Leibe, weil eine Auflösung der Teile und Teilchen den Lebenszusammenhang unterbricht. Auch das sinnenfällige Leben wird, da die Menschen in gleichen Zeitabständen schlafen und dann sozusagen wieder aufleben, durch den natürlichen Ausfall der Empfindungen und das Pausieren der physischen Kräfte während des Schlafes scheinbar unterbrochen; aber trotzdem tragen wir kein Bedenken, von einem und demselben Leben zu reden. Jenes ist wohl auch der Grund, weshalb man den Schlaf den Bruder des Todes nennt; man tut dies, nicht etwa weil man einen Stammbaum vor sich hat und daran abliest, daß sie von denselben Voreltern und Eltern entsprossen sind, sondern weil bei den Schlafenden ähnliche Zustände walten wie bei den Toten, also wegen der Stille, wegen der Gleichgültigkeit gegen alles, was in ihrer Umgebung ist oder geschieht, und sogar gegen das eigene Sein und Leben. Wenn wir also dem Leben der Menschen, trotzdem es von der Geburt bis zur Auflösung so viele Ungleichheiten aufweist und durch alle die erwähnten Umstände unterbrochen wird, den Charakter der Einheitlichkeit keineswegs absprechen, dürfen wir auch das jenseits der Auflösung gelegene Leben nicht ablehnen, welches mit der Auferstehung seinen Anfang nimmt; wird es auch durch die Trennung der Seele vom Leibe eine Zeitlang unterbrochen, so ist es doch immer noch dasselbe Leben.</p>
      <h2>17</h2><p>Die menschliche Natur ist nun einmal von Anfang an nach dem Willen des Schöpfers mit Ungleichheit ausgestattet; diese zeigt sich daher auch im Leben und in der Fortdauer; jetzt führt der Schlaf, dann der Tod eine Unterbrechung herbei; hieher gehören auch alle Veränderungen, welche durch die jeweilige Altersstufe bedingt sind. Dabei lassen sich die späteren Zustände aus den früheren keineswegs klar und deutlich erschließen. Wer würde ohne vorhergegangene Erfahrung glauben, daß im unterschiedslosen, unförmlichen Samen so zahlreiche und bedeutende Lebenskräfte schlummern und auch schon der große Unterschied der hieraus sich entwickelnden und festigenden Massen begründet ist, nämlich der Knochen, Sehnen und Knorpeln, ferner der Muskeln, des Fleisches, der Eingeweide und der sonstigen Körperteile? Weder im feuchten Samen ist etwas hievon zu erblicken noch kann man aus der Gestalt des Säuglings auf die des gereiften Jünglings schließen oder aus der des Jünglings auf die des gestandenen Mannes oder hieraus auf die des Greises. Wenn auch von dem vorher Erwähnten manches gar nicht und manches nur dunkel die natürliche Aufeinanderfolge und die der menschlichen Natur widerfahrenden Veränderungen ahnen läßt, so wissen doch alle, die in Beurteilung dieser Erscheinungen nicht infolge von Bosheit oder Gleichgültigkeit blind sind, daß zuerst die Befruchtung eintreten muß, daß dann, wenn sich aus dem Samen die einzelnen Glieder entwickelt haben und das Kind das Licht der Welt erblickt hat, das Wachstum im ersten Lebensalter sich vollzieht und damit die Entwicklung zur Reife, daß auf die Reife ein Nachlassen der physischen Kräfte folgt, das sich bis ins Greisenalter fortsetzt, und daß schließlich der lebensmüde Körper der Auflösung anheimfällt, Wie also hier, da man aus dem Samen nicht das Wachstum oder die Gestalt des Menschen und aus dem Leben nicht die Auflösung in die Elemente ablesen kann, erst die tatsächliche Reihenfolge der natürlichen Vorgänge das beglaubigt was durch die Einzelerscheinungen allein noch nicht beglaubigt ist, so ist es noch viel mehr der Verstand, der die Auferstehung beweist, indem er durch die natürliche Schlußfolge der Wahrheit auf die Spur kommt. Der Verstand aber ist untrüglicher und stärker als die Erfahrung überall da, wo ein Wahrheitsbeweis erbracht werden soll.</p>
      <h2>18</h2><p>Die Beweise für die Auferstehung, die wir bisher zur Prüfung vorgelegt haben, sind alle von gleicher Art, da sie sich aus einem und demselben Grunde ergeben haben, nämlich aus der Entstehung der ersten Menschen infolge der schöpferischen Tätigkeit Gottes. Nur gewinnen die einen ihre Stärke unmittelbar aus der ersten während die anderen, die von der Natur und dem Leben der Menschen ausgehen, ihre Kraft der Fürsorge entnehmen, die Gott uns angedeihen läßt. Denn die Ursache, nach welcher und aus welcher die Menschen entstanden sind, ist mit der Natur der Menschen verknüpft und bekommt ihre Beweiskraft aus der schöpferischen Tätigkeit Gottes. Dagegen ist der Gerechtigkeitsbeweis, wonach Gott die guten und bösen Menschen vor sein Gericht bringt, vom Ziele der Menschen hergenommen. Geht die Entstehung der Menschen auf die schöpferische Tätigkeit Gottes zurück, so sind sie doch (nach ihrer Entstehung) mehr von der Vorsehung abhängig. Nachdem wir nun die erste Art von Beweisen, so gut es ging, vorgebracht haben, ist es angezeigt, unsere Thesis auch durch die zweite Art von Beweisen sicher zu stellen, nämlich durch die einem jeden Menschen in gerechter Beurteilung geschuldete Ehrung oder Bestrafung und durch das Endziel des menschlichen Lebens; dabei wird es sich empfehlen, von eben diesen Beweisen denjenigen voranzustellen, der naturgemäß der erste ist, also zuerst den vom Gerichte hergenommenen Beweis zu betrachten. Nur soviel wollen wir mit Rücksicht auf den unserem Thema zukommenden Ausgangspunkt und Gedankengang vorausschicken: Glaubt man an Gott als den Schöpfer dieses Alls, so muß man, wofern man seinen eigenen Prinzipien nicht untreu werden will, aus seiner Weisheit und Gerechtigkeit den Schluß ziehen, daß er für alles Geschaffene wacht und sorgt; auf Grund dieser Erkenntnis muß man dann überzeugt sein, daß nichts von den irdischen und himmlischen Dingen ohne Aufsicht und Fürsorge gelassen ist und daß sich die Aufmerksamkeit des Schöpfers auf alles in gleicher Weise erstreckt, auf Unsichtbares und Sichtbares, auf Kleines und Größeres. Denn sowohl die Gesamtheit der Geschöpfe bedarf der Fürsorge des Schöpfers als auch jedes einzelne je nach seiner Natur und seinem Zwecke. Es wäre jedoch ein übel angebrachter Eifer, jetzt alle einzelnen Arten anzuführen oder das einer jeden Natur Zuträgliche aufzuzählen; nur über den Menschen müssen wir hier reden; denn er ist der Gegenstand unserer Untersuchung. Der Mensch braucht als bedürftiges Wesen Nahrung, als sterbliches Wesen Nachfolge, als vernünftiges Wesen Gerechtigkeit. Wenn aber ein jedes der genannten Bedürfnisse dem Menschen naturgemäß ist, wenn er der Nahrung bedarf zum Leben, der Nachfolge zur Fortdauer seines Geschlechtes, der Gerechtigkeit, damit Nahrung und Nachfolge den Gesetzen entsprechen, so muß wohl, da Nahrung und Nachfolge auf die Doppelnatur Bezug haben, auch die Gerechtigkeit sich darauf beziehen; ich verstehe aber unter Doppelnatur den aus Seele und Leib bestehenden Menschen und behaupte, daß der Mensch gerade in dieser Doppelnatur für alle seine Handlungen verantwortlich ist und die ihm gebührende Ehre oder Strafe empfängt. Wenn also ein gerechtes Gericht die Vergeltung der Taten auf die Doppelnatur des Menschenwesens ausdehnt und weder die Seele allein den Lohn einstreichen darf für das, was sie mit Hilfe des Leibes vollbrachte (an und für sich ist sie nämlich erhaben über all die Verirrungen, die bei Befriedigung der Sinnlichen Begierden, bei Ernährung und Schmuck des Leibes vorkommen), noch der Leib allein (denn an und für sich kann er Gesetz und Recht nicht erkennen), sondern der aus beiden bestehende Mensch für jede seiner Taten die Vergeltung empfängt, dies aber, wie man bei verständiger Betrachtung finden kann, weder im gegenwärtigen Leben geschieht (im Erdenleben kommt nämlich die Gerechtigkeit nicht zum Siege, da viele, die von Gott nichts wissen wollen und sich ungescheut jeder Gesetzwidrigkeit und Schlechtigkeit hingeben, bis zu ihrem Lebensende von Leiden verschont bleiben, während umgekehrt Leute, die einen in jeder Hinsicht musterhaften Lebenswandel aufweisen können, in Kümmernissen dahinleben, in Kränkungen und Verdächtigungen, in Beschimpfungen und jeder Art von Ungemach) noch nach dem Tode (es ist ja die substanzielle Einigung der beiden Teile aufgehoben, nachdem sich die Seele vom Leibe getrennt hat und auch der Leib selbst wieder in die Elemente zerfallen ist, aus denen er sich aufbaute, und von seiner früheren Bildung oder Gestalt nichts mehr behalten hat, geschweige denn die Erinnerung an seine Taten), so ist für jeden sonnenklar, was noch übrig bleibt, nämlich daß nach dem Worte des Apostels dieses Verwesliche und Auflösbare sich mit Unverweslichem bekleiden muß, damit, wenn infolge der Auferstehung das Tote wieder zum Leben erweckt und das Geschiedene oder auch schon ganz Aufgelöste wieder vereinigt ist, ein jeder in gerechter Weise ernte, was er mittels seines Leibes getan hat, sei es Gutes oder Böses.</p>
      <h2>19</h2><p>Denen also, die zwar die Vorsehung anerkennen und somit die nämlichen Grundanschauung haben wie wir, dann aber in unbegreiflicher Weise ihren eigenen Voraussetzungen untreu werden, könnte man solcherlei Beweise und, wollte man das in gedrängter Kürze und in Eile Vorgebrachte erweitern, noch viel mehr als diese entgegenhalten. Anders wären die zu behandeln, die schon in den Grundanschauungen von uns abweichen; da wäre es vielleicht gut, von einem anderen, noch allgemeineren Grundsatz auszugehen, indem man den strittigen Punkt mit ihnen selbst der Anzweiflung unterwirft und folgendes untersucht: Bleibt denn wirklich das ganze menschliche Leben und Streben ein für allemal unbeachtet, ist denn wirklich so dichte Finsternis über die Erde ausgegossen, daß sie die Menschen und ihre Handlungen unsichtbar und unhörbar macht, oder ist es nicht viel sicherer anzunehmen, daß der Schöpfer seine Werke lenkt und leitet, auf alles irgendwie Seiende oder Werdende hinschaut und über Werke und Gedanken Gericht hält? Denn gäbe es über die Werke der Menschen nicht irgendwo ein Gericht, so hätten diese vor den unvernünftigen Tieren nichts voraus; ja sie wären noch unglücklicher daran als diese, da sie ihre Leidenschaften bezwingen müssen und nach Frömmigkeit, Gerechtigkeit und sonstigen Tugenden zu streben haben; am besten wäre es dann, wie das liebe Vieh dahinzuleben; die Tugend wäre ein leerer Wahn, die Androhung von Strafen eine platte Lächerlichkeit; der uneingeschränkte Genuß wäre der Güter höchstes; jener eine Satz, der allen Lebemännern und Genußmenschen so sehr behagt, würde allgemeines Dogma sein und oberstes Moralgesetz: „Lasset uns essen und trinken, denn morgen müssen wir sterben “. Ja nach der Lehre einiger ist das Endziel eines solchen Lebens auch nicht in der Lust zu suchen, sondern in absoluter Empfindungslosigkeit. Wenn nun aber der Schöpfer des Menschengeschlechtes für seine Werke Sorge trägt und das gerechte Gericht über die im Leben vollbrachten guten oder bösen Werke irgendwo stattfinden muß, so könnte dies entweder im gegenwärtigen Leben geschehen, solange diejenigen, die tugendhaft oder schlecht lebten, noch da sind, oder nach dem Tode, solange sie noch getrennt und aufgelöst sind. Jedoch nach keiner dieser beiden Möglichkeiten sieht man das gerechte Gericht sich vollziehen. Denn im gegenwärtigen Leben wird weder den Braven die Tugend noch den Bösen die Schlechtigkeit vergolten. Ich will gar nicht erwähnen, daß in unserem gegenwärtigen Lebenszustande die sterbliche Natur gar nicht fähig wäre, für zahlreichere oder schwerere Vergehungen die entsprechende Strafe zu tragen. Ein Räuber, ein Herrscher oder Tyrann, der Tausende und Abertausende ungerecht ums Leben gebracht hat, kann durch sein einmaliges Sterben wohl nicht die schuldige Busse für seine Missetaten entrichten. Wer sich von Gott nie eine richtige Vorstellung zu machen sucht, wer in schrankenloser Selbstüberhebung frech und gewissenlos die Gesetze bricht, wer Knaben und Weiber schändet, wer Städte ungerecht zerstört, Häuser mitsamt den Bewohnern verbrennt, ein Land verheert und dabei Gemeinden und Stämme oder gar ein ganzes Volk vertilgt, wie könnte ein solcher mit seinem vergänglichen Leibe stark genug sein, um die solchen Verbrechen gebührende Strafe abzubüßen, da ja der Tod die volle Vergeltung ausschließt und die sterbliche Natur zu schwach ist, auch nur für einen dieser Frevel die Strafe auszuhalten? Im gegenwärtigen Leben findet also das gerechte Gericht nicht statt. Aber auch nicht nach dem Tode.</p>
      <h2>20</h2><p>Denn der Tod ist entweder ein völliges Erlöschen des Lebens, so daß mit dem Leibe auch die Seele sich auflöst und vergeht, oder es bleibt die Seele für sich unaufgelöst, unzerteilt und unzerstört, so daß nur der Leib zerstört und aufgelöst wird, wodurch er aufhört, sich an das Vollbrachte zu erinnern oder seelische Einwirkungen zu empfinden. Erlischt nun das Leben der Menschen gänzlich, so fällt natürlich mit der Menschheit auch die Sorge um sie fort und es gibt dann auch kein Gericht über die Menschen, mögen sie nun tugendhaft oder schlecht gelebt haben; aber dann bekommen wir als Konsequenzen all die schlimmen Zustände eines unvernünftigen Lebens, den ganzen Schwarm der hiemit zusammenhängenden Ungereimtheiten und schließlich die volle Gottesleugnung, das notwendige Resultat einer solchen Gesetzlosigkeit. Sollte aber nur der Leib zerstört werden und sich jedes der aufgelösten Teilchen mit der ihm verwandten Natur vereinigen, die Seele dagegen für sich als unzerstörbar fortdauern, auch in diesem Falle wäre das Gericht über die Seele nicht am Platze, da ihm die Gerechtigkeit fehlt; man darf doch nicht annehmen, daß von Gott ein Gericht ausgehe und gar noch von ihm selbst abgehalten werde, bei dem das Moment der Gerechtigkeit außer acht bleibt; letzteres aber wäre der Fall, weil dann derjenige nicht mehr voll und ganz da wäre, der gerecht oder gesetzlos gehandelt hat; denn der, welcher alle im Leben geschehenen Werke, die die Materie des Gerichtes bilden, vollbracht hat, war der Mensch, aber nicht die Seele für sich allein. Kurz, eine solche Annahme würde auf keine Weise das Moment der Gerechtigkeit wahren.</p>
      <h2>21</h2><p>Werden nämlich die guten Handlungen belohnt, so geschieht hiebei offenbar dem Leibe Unrecht; denn er mußte mit der Seele zwar an den Mühen teilnehmen, mit denen die Arbeit verbunden war, darf aber nicht teilnehmen an der Ehre, mit denen die guten Handlungen gekrönt werden, und während oft die Seele für manche Fehler wegen der Unvollkommenheit und Armseligkeit des Leibes Verzeihung erhält, wird der Leib selbst von der Gemeinschaft ausgeschlossen, obwohl die guten Handlungen, um derentwillen er im Leben Mühen ertragen mußte, nicht ohne diese Gemeinschaft zustande kamen. Werden aber die Verfehlungen gerichtet, dann kommt hiebei die Seele nicht zu ihrem Rechte, wenn sie allein büßen sollte, was sie auf Drängen des Leibes hin, der sie zu seinen eigenen Begierden und Regungen herabzog, gefehlt hat, bald infolge räuberischen Überfalls und heimlicher Nachstellung, bald in noch gewaltsamerem Ansturm, bald aber auch mit Zustimmung aus Nachgiebigkeit und Gefälligkeit gegen die Natur des Leibes. Oder wie sollte es nicht ungerecht sein, wenn die Seele für sich allein gerichtet würde wegen solcher Dinge, zu denen sie sich ihrer eigenen Natur nach gar nicht hingezogen fühlt und wozu sie weder Hang noch Drang in sich verspürt, wie da sind Wollust, Gewalttat, Habsucht, Unredlichkeit und die dabei vorkommenden Ungerechtigkeiten? Geschieht ja doch die Mehrzahl der genannten Übel nur infolge davon, daß die Menschen die belästigenden Begierden nicht beherrschen; belästigt aber werden sie durch die Unvollkommenheit und Armseligkeit des Leibes und durch die ihm gewidmete Sorge und Pflege; denn aller Besitz und noch mehr die Benutzung desselben, ebenso die Verehelichung und alle äußeren Handlungen im Leben, bei denen und in denen man von Erfolg und Mißerfolg spricht, bezwecken nichts anderes als die Befriedigung leiblicher Bedürfnisse. Wie sollte es also gerecht sein, wenn die Seele allein gerichtet würde wegen solcher Dinge, bei denen zunächst nur der Leib beteiligt ist, der dann erst die Seele zur Mitleidenschaft und zur Teilnahme an den ihm zusagenden Handlungen hinzieht? Nachdem nun einmal die sinnlichen Begierden und Lustgefühle, ebenso die Furcht- und Schmerzgefühle, bei welchen alles Unordentliche straffällig ist, im Leibe ihren Ursprung haben, ist es ungerecht, die daraus folgende Sündenschuld und die an die Sündenschuld geknüpften Strafen auf die Seele allein abzuladen, die doch etwas Derartiges weder nötig hat noch anstrebt noch fürchtet, die überhaupt für sich allein nichts von dem empfindet, was naturgemäß erst der ganze Mensch empfindet. Aber auch für den Fall, daß wir die Leidenschaften nicht dem Leibe allein zuschreiben, sondern dem ganzen Menschen (eine ganz richtige Behauptung, da sein Leben das einheitliche Produkt zweier ganz verschiedenen Faktoren ist), werden wir sie noch lange nicht der Seele auf Rechnung setzen, sobald wir uns von der Eigenart ihres Wesens eine klare Vorstellung machen. Wenn sie nämlich ein für allemal kein Bedürfnis nach Nahrung hat, wird sie wohl auch nie nach Dingen trachten, die sie zu ihrer Existenz in gar keiner Weise benötigt, und wohl auch nie etwas von dem anstreben, womit sie ihrer Natur nach überhaupt nichts anzufangen weiß; auch wird sie sich wohl nie über Mangel an Geld oder Gut abhärmen, da solche Dinge für sie ganz belanglos sind. Wenn sie ferner die Vernichtung überdauert, so ist sie auch über jede Furcht erhaben, da es nichts gibt, was ihr den Untergang bringen könnte; sie fürchtet weder Hunger noch Krankheit weder Verstümmelung noch Marter, weder Feuer noch Schwert; denn nichts hievon kann ihr Schaden oder Schmerz verursachen, da Körper und körperliche Kräfte auf sie überhaupt nicht einwirken. Wie es nun aber ungereimt ist, die Leidenschaften ausschließlich der Seele zuzuschreiben, so ist es auch überaus ungerecht und des göttlichen Strafgerichtes unwürdig, die daraus folgende Sündenschuld und die daran geknüpften Strafen auf die Seele zu beschränken.</p>
      <h2>22</h2><p>Wie sollte es also nicht ungereimt sein, die Ehre, beziehungsweise die Strafe für Tugend und Schlechtigkeit, welch letztere an der Seele allein nicht einmal gedacht werden können (denn die Tugenden sind offenbar Tugenden des Menschen, wie ja auch die ihnen entgegengesetzte Schlechtigkeit nicht der vom Leibe getrennten und für sich allein seienden Seele zukommt), auf die Seele allein einzuschränken? Oder wie könnte man sich an der Seele allein Mannhaftigkeit und Stärke denken, da sie doch vor Tod, vor Verwundung und Verstümmelung, vor Beschädigung und Entehrung, vor den damit verbundenen Schmerzen oder den daraus entspringenden Leiden nicht die mindeste Furcht hat? Wie ferner Enthaltsamkeit und Mäßigung, da die Seele von keiner Begierde zum Genusse von Speise und Trank, zu geschlechtlichem Verkehr, zu den sonstigen sinnlichen Lüsten und Freuden hingezogen wird, zumal sie weder innerlich von etwas belästigt noch äußerlich von etwas gereizt wird? Wie ferner Klugheit, da nichts von dem, was zu tun oder nicht zu tun ist, was zu wählen oder zu fliehen ist, in ihr selbst seinen Grund hat, vielmehr gar keine Neigung, gar kein natürlicher Trieb zu einer äußeren Handlung ihr innewohnt? Worin kommt überhaupt den Seelen die Gerechtigkeit gegeneinander oder gegen ein anderes der gleichartigen oder der verschiedenartigen Wesen von Natur zu? Haben ja doch die Seelen weder das Material noch die Mittel noch die Fähigkeit, den Forderungen der Gerechtigkeit oder Billigkeit nachzukommen; nur die Gottesverehrung ist ihnen möglich. Auch sonst haben sie keine Neigung und keinen Trieb in sich, das Eigene zu benutzen und des Fremden sich zu enthalten, da man doch nur bei den natürlichen Dingen von Benutzung und nur bei den zur Benutzung bestimmten Dingen von Enthaltung redet, die Seele selbst aber weder ein Bedürfnis kennt noch die Fähigkeit hat, irgendwelche Dinge oder irgendwelches Ding zu benutzen; daher kann denn auch bei der so beschaffenen Seele keine sogenannte Ausübung eigener Geschäfte wahrgenommen werden.</p>
      <h2>23</h2><p>Das allerwidersinnigste indes ist es, wenn man zur Haltung der göttlichen Gebote den ganzen Menschen verpflichtet, dagegen die Vergeltung für das gesetzmäßige oder gesetzwidrige Verhalten auf die Seelen einschränkt. Wenn nämlich der Empfänger der Gebote billigerweise auch die Verantwortung für eine etwaige Verletzung derselben tragen muß, der Empfänger der Gebote aber der Mensch ist und nicht die Seele für sich allein, so ist es eben der Mensch, der auch die Verantwortung für seine Fehltritte tragen muß, und nicht die Seele für sich allein. Denn nicht den Seelen hat Gott befohlen, sich gewisser Dinge zu enthalten, die ihnen ganz ferne liegen, wie Ehebruch, Mord, Diebstahl, Raub, Unehrerbietigkeit gegen die Eltern, überhaupt jede auf Beleidigung oder Schädigung des Nächsten gerichtete Begierde. Denn das Wort: „Ehre deinen Vater und deine Mutter!“ paßt nicht auf die Seelen als solche; diese Titel kommen ja nicht den Seelen zu; denn nicht Seelen, die etwa Seelen erzeugen, werden als Vater oder Mutter bezeichnet, sondern Menschen, welche Menschen erzeugen, Auch das Gebot: „Du sollst nicht ehebrechen!“ kann ohne logischen Verstoß wohl nie über Seelen ausgesagt oder auf Seelen bezogen werden, da die Seelen weder geschlechtlich sich unterscheiden noch zu geschlechtlichem Verkehr geeignet sind oder ein Verlangen darnach haben; weil ein solches Verlangen gar nicht besteht, so kommt es unmöglich zu einem Geschlechtsverkehr. Bei Wesen aber, bei denen ein Geschlechtsverkehr überhaupt ganz ausgeschlossen ist, gibt es nicht einmal den erlaubten Geschlechtsverkehr, nämlich die Ehe. Wo es aber nicht einmal den gesetzlich erlaubten Geschlechtsverkehr gibt, kann es noch viel weniger jenes unerlaubte Verlangen nach einem fremden Weibe oder eine derartige Beiwohnung geben; denn dies versteht man unter Ehebruch. Auch das Verbot des Diebstahls und der Übervorteilung kann sich nicht auf die Seelen beziehen; diese bedürfen ja gar nicht jener Dinge, um derentwillen infolge natürlichen Mangels oder Bedürfnisses Diebstähle und Räubereien begangen werden, als da sind Gold oder Silber oder ein lebendiges Wesen oder etwas anders, das zur Nahrung oder Bedeckung oder sonst einem Gebrauche dient; für eine unsterbliche Natur ist alles wertlos, was den bedürftigen Wesen als Gebrauchsgegenstand erstrebenswert erscheint. -Vollständiger hierüber zu reden sei denen überlassen, die sich mit jedem einzelnen Punkt angelegentlicher beschäftigen oder gegen Andersgesinnte erfolgreicher disputieren wollen. Uns kann das eben Gesagte und all das, was in Übereinstimmung damit die Auferstehung bewahrheitet, genügen; daher ist es wohl nicht angezeigt, noch länger bei demselben Gegenstande zu verweilen. Denn es war von vornherein nicht unsere Absicht, alles, was hier überhaupt vorgebracht werden kann, in die Besprechung hineinzuziehen. Nur in Umrissen wollten wir den Versammelten zeigen, was man über die Auferstehung denken soll; auch sollten die Beweise hiefür der Fassungskraft der Anwesenden angemessen sein.</p>
      <h2>24</h2><p>Nachdem wir die angekündigten Punkte mehr oder weniger ausführlich untersucht haben, dürfte es nur noch erübrigen, den vom Endzie1 hergeleiteten Beweis zu betrachten. Da er durch das Vorhergehende schon klar ist, bedarf er nur noch soviel Erwähnung und Naherückung, daß es nicht aussieht, als werde etwas von dem früher kurz Angedeuteten außer acht gelassen und so der Stoff oder die anfangs gegebene Einteilung beeinträchtigt. Deshalb also und im Hinblick auf das, was darin eingeschlossen liegen wird, dürfte es am Platze sein, wenigstens soviel anzuerkennen, daß ein jedes Wesen, mag es nun ein Werk der Natur oder der Kunst sein, seinen besonderen Endzweck haben muß; dies sagt uns wohl schon der gemeine Menschenverstand, und auch der Augenschein bezeugt es. Sehen wir etwa nicht, daß der Landmann ein anderes Ziel verfolgt als der Arzt und daß die von der Erde hervorgebrachten Pflanzen wieder einen anderen Zweck haben als die animalischen Wesen, die auf ihr leben und in natürlicher Reihe entstehen? Wenn aber dies einleuchtend ist und wenn den natürlichen oder künstlerischen Kräften und ihren Leistungen das naturgemäße Endziel folgen muß, so ist es auch absolut notwendig, daß das Endziel der Menschen, da es das Endziel einer ganz eigenartigen Natur ist, aus der Gemeinschaft der anderen Geschöpfe ausscheidet. Es wäre doch nicht recht anzunehmen, daß Wesen, die nach immanenten Sitten- und Vernunftgesetzen handeln und daher auch ein verständiges und moralisches Leben führen, kein höheres Ziel hätten als jene Geschöpfe, die der logischen Unterscheidung entbehren. Somit dürfte für die Menschen nicht die Schmerzlosigkeit als Endziel bestimmt sein; diese käme ja auch den ganz empfindungslosen Wesen zu. Aber auch nicht im Genusse dessen, was den Leib nährt und ergötzt, und in einer Fülle sinnlicher Lustgefühle kann das Endziel der Menschen liegen; sonst hätte das tierische Leben notwendig den Vorrang und das tugendhafte Leben wäre zwecklos; solches mag für Herdenvieh ein geeignetes Endziel sein, aber nicht für Menschen, die eine unsterbliche Seele haben und logischer Unterscheidung fähig sind.</p>
      <h2>25</h2><p>Aber auch die Seligkeit der vom Leibe getrennten Seele kann nicht das Endziel der Menschen sein. Wie nämlich unsere Betrachtung zeigte, kann man nicht von einem Leben oder Endziel nur eines der beiden Teile, die das Menschenwesen konstituieren, reden, sondern nur von einem Leben und Endziel des Ganzen, Ein solches Ganze aber ist jeder Mensch, der dieses Leben erlost hat, und sein Leben muß ein eigenes Endziel haben. Wenn es aber nur ein Endziel des Ganzen gibt, dieses Endziel aber aus den schon wiederholt angeführten Gründen weder in diesem Leben, solange die Menschen noch auf Erden sind, gefunden werden kann noch auch dann, wann die Seele vom Leibe getrennt ist, weil nach der Auflösung oder auch vollständigen Zerstreuung des Leibes trotz des Fortbestandes der Seele der Mensch nicht so vorhanden ist, wie er nun einmal nach der Beschaffenheit seines Wesens sein muß, so ist es absolut notwendig, daß sich das Endziel der Menschen in einer neuen Zusammenstellung des wiederum aus beiden Teilen bestehenden Wesens zeige. Da dies ein zwingender Schluß ist, so muß unter allen Umständen eine Auferstehung der entseelten oder auch ganz aufgelösten Leiber stattfinden und es müssen die nämlichen Menschen wieder in der Doppelnatur ihres Wesens auftreten. Denn das Naturgesetz bestimmt das Endziel nicht blindlings und auch nicht als Endziel irgendwelcher beliebigen Menschen, sondern als Endziel gerade jener, die früher einmal schon gelebt haben; nun aber können die nämlichen Menschen nicht wieder erscheinen, wenn nicht die nämlichen Leiber den nämlichen Seelen zurückgegeben werden. Daß aber die nämliche Seele wieder den nämlichen Leib erhält, ist auf anderem Wege nicht möglich; das kann nur durch die Auferstehung geschehen. Erst wenn diese eingetreten ist, kann das der menschlichen Natur entsprechende Endziel erfolgen. Das Endziel eines verständigen Lebens und logischen Unterscheidens wird man aber, ohne fehl zu gehen, darin erblicken dürfen, daß der Mensch unzertrennlich und ewig mit dem zusammenlebt, wozu ihm der natürliche Verstand hauptsächlich und zunächst verliehen ist, und daß er in der Anschauung des Gebers und seiner Ratschlüsse unaufhörliche Wonne empfindet. Freilich werden die meisten Menschen dieses hohe Ziel nicht erreichen, weil sie sich mit allzu großer Leidenschaft und Heftigkeit an die Dinge dieser Welt anschließen. Aber die große Zahl derer, die von ihrem Ziele abirren, kann die gemeinsame Bestimmung nicht umstoßen. Indes findet hierüber ein besonderes Gericht statt und erhält jeder einzelne für sein Gutes oder Böses, das er im Leben vollbracht hat, in angemessener Weise Lohn oder Strafe.</p>
