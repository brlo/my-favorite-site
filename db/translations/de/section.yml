      <p>In diesem Bereich werden die Werke der alten heiligen Väter und Kirchenlehrer gesammelt. Die Texte sind in verschiedenen Sprachen verfügbar und werden hier nach und nach durch die Bemühungen mehrerer Mitarbeiter zusammengetragen.</p>

      <p><strong>Zur Orientierung: die Sprachkarte von Byzanz um 550 n. Chr. und die Karte der Völker dieser Region.</strong></p>

