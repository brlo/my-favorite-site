    body: |-
      <p><em>Über Christus und den Antichrist, übersetzt von Valentin Gröne (Bibliothek der Kirchenväter, 1. Serie, Bd. 28, Kempten 1872).</em></p><p>Weil du die Hauptstücke, die ich dir vorgelegt habe, gründlich kennen lernen möchtest, mein lieber Bruder Theophilus, so habe ich für angemessen gehalten, das, wonach du forschest, aus den heiligen Schriften, wie aus einer heiligen Quelle zu schöpfen und dir vor Augen zu stellen, damit du es nicht allein mit Freuden den Ohren der Menschen vortragen, sondern auch nach Kräften die Thatsachen selbst untersuchen möchtest, um in Allem Gott loben zu können. Auch wird es dir ein sicherer Zehrpfennig in dem gegenwärtigen Leben sein, das, was Vielen schwer zu erkennen und zu erforschen ist, aus vorliegendem Vortrage zu entnehmen und in die Tafeln deines Herzens wie Weizen in reines Land zu säen. Zugleich wirst du damit Diejenigen beschämen, welche sich der heilbringenden Lehre widersetzen und sie bestreiten. Aber hüte dich, dasselbe ungläubigen und lästerlichen Zungen aufzuhängen, — das wäre gefährlich; — dagegen theile es religiösen und gläubigen Menschen mit, die da mit der Furcht Gottes heilig und gerecht leben wollen. Denn nicht umsonst ermahnt der selige Apostel den Timotheus, indem er sagt: „O Timotheus, das Hinterlegte bewahre! Weise zurück die heillosen Wort-Neuerungen und Gegensätze der fälschlich sogenannten Erkenntniß.“ Und ferner: „Du also, mein Kind, erstarke in der Gnade, die da ist in Christus Jesus, und was du gehört hast von mir durch viele Zeugen, Dies lege nieder an zuverlässige Menschen, welche tüchtig sein werden, auch Andere zu lehren.“ Wenn nun der Selige mit Behutsamkeit das übergab, was von Allen leicht eingesehen werden konnte, indem er im Geiste erkannte, daß nicht Alle den Glauben daran hatten, wie viel mehr liefen wir dann Gefahr, wenn wir ohne Grund und aufs Gerathewohl unreinen und unwürdigen Menschen die Aussprüche Gottes mittheilten!</p><p>Die seligen Propheten sind für uns die Augen gewesen, welche durch Glauben die Geheimnisse des Logos vorhersahen und den späteren Geschlechtern mittheilten. Und sie erzählten nicht allein das Vergangene, sondern verkündigten auch das Gegenwärtige und Zukünftige, damit der Prophet nicht als bloß für seine Zeit bestimmt angesehen werde, sondern auch insofern für einen Propheten gehalten werde, als er allen Geschlechtern die Zukunft verkündigte. Sie nun, die Väter, mit prophetischem Geiste ausgerüstet und vom Logos gebührend geehrt, hatten wie gut zusammenstimmende Instrumente den Logos gleichsam als Plectron immer in sich, von welchem bewegt die Propheten das verkündigten, was Gott wollte. Denn die Propheten erhoben ihre Stimmen nicht aus eigenem Antriebe wie die Betrüger, noch verkündigten sie das, was sie selbst wollten, sondern sie wurden zuerst von dem Logos in die rechte Weisheit eingeführt, dann durch Gesichte trefflich über das Zukünftige belehrt und so selbst überzeugt, verkündigten sie das, was ihnen allein von Gott geoffenbart worden war. Denn wie kann der Prophet ein Prophet genannt werden, wenn er nicht im Geiste das Zukünftige vorhersah? Denn wenn der Prophet über etwas Zufälliges sprach, dann war er wohl kein Prophet, indem er ja das sagte, was Allen klar vor Augen lag, sondern nur Derjenige wird mit Recht für einen Propheten gehalten, der das Zukünftige vorträgt. Deßhalb wurden die Propheten anfangs Seher genannt. Wenn wir daher das, was von ihnen vorhergesagt worden ist, gut gelernt haben, so reden wir nicht aus unserer eigenen Erkenntniß, noch erlauben wir uns, die vorherverkündigten alten Aussprüche durch neue zu ersetzen, wenn wir ihre Schriften erläutern und den Rechtgläubigen vorlesen. Da nun daraus ein für Beide gemeinsamer Nutzen entspringt: für den Vortragenden, daß er den seinem Gedächtniß anvertrauten Stoff recht auslegt, für den Zuhörer, daß er seinen Geist auf das Gesagte richte; Beiden aber auch die Mühe gemeinsam ist, dem Vortragenden, daß er mit Sicherheit vorträgt, dem Zuhörer, daß er das Gesagte gläubig aufnimmt, so fordere ich dich auf, mir im Gebete zu Gott beizustehen.</p><p>Auf welche Weise wohl der Logos Gottes — der Logos vor Alters ist selbst wiederum der Knecht Gottes — vor Alters den seligen Propheten die Offenbarungen gegeben habe, suchst du zu erforschen. Nun wohlan, seine Barmherzigkeit und Nichtachtung der Person zeigt sich in allen Heiligen, die der Logos erleuchtet und wie ein erfahrener Arzt, der die Schwächen der Menschen kennt, für das, was uns zuträglich ist, empfänglich macht. Die Unwissenden sucht er zu belehren, die Irrenden führt er auf seinen wahren Weg zurück. Von denen, die ihn mit Vertrauen suchen, läßt er sich leicht finden, und denen, die mit reinen Augen und keuschen Herzen an die Thür zu klopfen verlangen, öffnet er sofort. Denn keinen seiner Diener verstößt er, als sei er der göttlichen Geheimnisse nicht würdig. Den Reichen achtet er nicht mehr als den Armen, noch verachtet er den Armen wegen seiner Geringheit, nicht schmäht er den Barbaren, noch verstößt er den Eunuchen, als sei er kein Mensch, nicht haßt er das Weib, weil von ihm der Ungehorsam angefangen, noch setzt er den Mann zurück, weil er sich der Übertretung schuldig gemacht; sondern Alle will er, und Alle sucht er zu retten, Alle will er zu Söhnen Gottes machen, und alle die Heiligen ruft er zu dem einen vollkommenen Menschen. Dieser Eine aber ist auch der Knecht Gottes, durch den auch wir im heiligen Geiste die Wiedergeburt erlangt haben, zu dem Einen vollkommenen und himmlischen Menschen wünschen wir alle hinzukommen.</p><p>Der Logos Gottes war nämlich fleischlos, nahm aber dann das heilige Fleisch aus der heiligen Jungfrau an, indem er sich gleichsam wie ein Bräutigam ein Kleid für das Kreuzleiden wob, um dadurch, daß er unserm sterblichen Leibe seine Macht hinzufügte und mit dem Unvergänglichen das Vergängliche und das Schwache mit dem Starken vermischte, den verlornen Menschen zu erlösen. Der Webebaum nun ist das Leiden des Herrn, welches er am Kreuze vollbracht hat, die Kette daran die Kraft des heiligen Geistes, der Einschlag das heilige vom Geiste gewobene Fleisch, der Faden die durch die Liebe Jesu Christi verknüpfende und einigende Gnade, das Webeschiff der Logos, die Weber endlich die Patriarchen und Propheten, welche Christo das schöne lange und vollkommene Gewand weben. Durch sie geht der Logos wie ein Webeschiff hindurch und webt durch sie, was der Vater will.</p><p>Aber schon drängt die Zeit zu dem, was wir uns vorgenommen haben. Das, was wir Eingangs zum Lobe Gottes gesagt haben, reicht hin, und jetzt ist es billig, an die heiligen Schriften selbst zu gehen, um aus ihnen zu sehen, welcher Art die Ankunft des Antichrist sein, unter welchen Verhältnissen und in welcher Zeit sich der Ruchlose offenbaren wird, woher, aus welchem Stamme und wie sein Name, der in der Schrift durch jene Zahl angegeben ist; wie er das Volk in Irrthum führen wird, indem er es von den Enden der Erde versammelt; welche Bedrängniß und Verfolgung er über die Heiligen bringen und wie er sich rühmen wird, Gott zu sein; wie sein Ende, wie die Herabkunft des Herrn vom Himmel sich offenbaren, wie der Brand der ganzen Welt, wie das herrliche und himmlische Reich der Heiligen sein wird, die mit Christus regieren werden, und wie endlich der Gottlosen Strafgericht durch das Feuer.</p><p>Da der Herr Gott Jesus Christus wegen seiner Königswürde und Herrlichkeit wie ein Löwe verkündigt worden ist, so haben die Schriften in gleicher Weise auch den Antichrist wegen seiner Tyrannei und Gewaltthätigkeit einen Löwen genannt. Denn in Allem will der Verführer dem Sohne Gottes ähnlich sein. Weil Christus ein Löwe, daher auch der Antichrist ein Löwe, weil Christus ein König auch der Antichrist ein König. Weil der Erlöser sich als Lamm zeigte, so wird er auch als Lamm erscheinen, während er im Innern ein Wolf ist. Weil der Erlöser in der Beschneidung in die Welt kam, so wird auch er daher kommen. Der Herr sandte Apostel zu allen Völkern, er wird gleichfalls falsche Apostel aussenden. Der Erlöser sammelte die zerstreuten Schafe, er wird ebenfalls das zerstreute Volk versammeln. Der Herr gab denen, die an ihn glauben, ein Siegel, das Gleiche wird er thun. Der Erlöser erschien in der Gestalt eines Menschen, Jener wird auch in der Gestalt eines Menschen kommen. Der Erlöser stellte sein heiliges Fleisch dar und wies darauf hin, wie auf einen Tempel, Jener wird zu Jerusalem den steinernen Tempel errichten. Seine Verführungskünste wollen wir in dem Folgenden darlegen und jetzt zu der Aufgabe übergehen.</p><p>Der selige Jakob sagt in den Segnungen, indem er über unsern Herrn und Erlöser weissagt, also: „Juda, dich werden preisen deine Brüder, deine Hand ist auf dem Nacken deiner Feinde, es beugen dir sich die Söhne deines Vaters. Ein junger Löwe ist Juda: zur Beute, mein Sohn, fährst du empor; rastend streckest du dich nieder wie Löwe und wie Löwin; wer reizt ihn auf? Nicht weichen wird der Scepter von Juda und nicht der Führerstab von seinen Lenden, bis kommt, der gesandt soll werden, und der sein wird die Erwartung der Völker. Da bindet er an den Weinstock seine Eselin und an die Rebe sein Eselsfüllen. Er wäscht im Weine sein Gewand und im Blute der Trauben sein Kleid; funkelnder sind seine Augen denn Wein, und seine Zähne weißer als Milch.“</p><p>Da ich dir darüber Mehreres zur Erläuterung zu sagen weiß, so schien mir angemessen, den Text selbst herzusetzen; auch werde ich auf diese Weise nicht vergessen, das anzuführen, wozu die Worte selbst auffordern. Denn sie sind in der That göttlich und herrlich und können der Seele nützen. Den aus Juda und David dem Fleische nach Gebornen nennt der Prophet das Junge eines Löwen, nicht weil er aus dem Samen Davids entsprossen ist, sondern vom h. Geiste empfangen wird und aus diesem heiligen Keime aus Erde hervorgeht. Denn Isaias sagt: „Und es wird hervorgehen ein Reis aus dem Wurzelstocke Jesse, und eine Blüthe aus seinen Wurzeln steigt empor.“ Das nun, was von Isaias Blume genannt worden, hat Jakob Keim genannt. Denn zuerst keimte Er, dann blühte Er in der Welt. Und wenn Jakob sagt: „Rastend streckst du dich nieder wie Löwe und wie Löwin,“ so hat er darin die dreitägige Ruhe Christi geoffenbart, wie auch Isaias sagt: „Wie ist doch zur Buhlerin geworden das treue Sion; in ihr selbst hat geruhet die Gerechtigkeit, jetzt aber Mörder.“ Ebenso auch David: „Ich schlief und ruhte gut, und ich erwachte, weil der Herr mich schützte,“ um Christi Ruhe und Auferstehung anzuzeigen. Jakob aber sagt: „Wer wird ihn aufwecken?“ Das sagt David zugleich mit Paulus: „Und der Vater, welcher ihn aufgeweckt hat von den Todten“</p><p>Indem er aber ferner sagt: „Nicht weichen wird der Scepter von Juda und nicht der Führerstab von seinen Lenden, bis Derjenige kommt, der gesandt soll werden, und der sein wird die Erwartung der Völker,“ zeigt er, daß in Christus diese Weissagung erfüllt wird. Denn wir erwarten ihn und sehen ihn durch unsern Glauben mit Macht vom Himmel kommen.</p><p>„Er bindet seine Eselin an einen Weinstock“ heißt, er beruft das Volk aus der Beschneidung zu sich, denn er selbst war der Weinstock. „Und an die Weinrebe sein Eselsfüllen“ heißt, auch das Volk der Heiden ruft er herbei, um Beschneidung und Vorhaut zu einem Glauben zu vereinigen.</p><p>„Er wäscht im Weine sein Gewand:“ als nämlich im Jordan mit dem h. Geiste die Stimme des Vaters herabkam. „Und im Blute der Trauben sein Kleid.“ „Im Blute der Traube“, welch’ anderer Traube, als der seines Fleisches, das wie die Traube in die Kelter, so auf das Holz gelegt wurde? aus dessen Seite zwei Quellen hervorsprudelten von Blut und Wasser, durch welche die Völker abgewaschen und gereinigt werden, die er wie einen Mantel zu tragen gedacht wird.</p><p>„Fröhlich sind seine Augen von Wein.“ Was für andere Augen Christi, als so seligen Propheten, welche, da sie im Geiste die Leiden, so über ihn kommen sollten, vorausgesehen und vorherverkündigt hatten, sich freuten, aufgerichtet von dem Logos selbst und seiner Gnade, ihn mit geistigen Augen in seiner Macht zu sehen?</p><p>Wenn er aber sagt: „Und seine Zähne weisser als Milch,“ so hat er damit die aus dem heiligen Munde Christi hervorgegangenen Gebote bezeichnet, die so rein sind wie Milch.</p><p>Ihn nun haben die Schriften als Löwen und als Jungen eines Löwen vorherverkündigt. Dasselbe ist auch von dem Antichrist gesagt worden. Denn Moses sagt so: „Ein junger Löwe ist Dan und wird aus Basan hervorspringen.“ Damit sich aber Niemand täusche und meine, der Ausspruch beziehe sich auf den Erlöser, so möge er wohl aufmerken. „Dan,“ sagt er, „ist ein junger Löwe.“ Mit dem Ausspruche hat er den Stamm Dan bezeichnet, aus welchem dereinst der Antichrist geboren werden soll. Denn wie Christus aus dem Stamme Juda geboren ist, so wird der Antichrist aus dem Stamme Dan geboren werden. Daß dem so sei, sagt Jakob: „Dan wird sein eine Schlange, auf der Erde sitzend, stechend des Pferdes Ferse.“ Wer anders aber ist die Schlange als der Antichrist, jener Verführer, von dem in der Genesis gesagt wird, er habe die Eva verführt und den Adam überlistet? Da es aber nothwendig ist, das Gesagte durch mehrere Zeugnisse zu erhärten, so werden wir es nicht unterlassen.</p><p>Daß in Wirklichkeit aus dem Stamme Dan ein Tyrann, König, gewaltiger Richter, Sohn des Teufels geboren und aufstehen werde, sagt der Prophet in den Worten: „Dan wird sein Volk richten, wie auch ein anderer Stamm in Israel.“ Aber wird man sagen, dieses sei von Sampson gesagt, der aus dem Stamme Dan hervorgegangen, zwanzig Jahre das Volk richtete. Zum Theil freilich bezieht es sich auf Sampson, im Ganzen aber geht es auf den Antichrist. Denn auch Jeremias spricht also: „Von Dan her wird gehört das Schnauben seiner Rosse; von dem Laute des Wieherns seiner Streitrosse erbebt die ganze Erde.“ Und ein anderer Prophet sagt: „Er wird seine ganze Macht versammeln vom Aufgang der Sonne bis zum Niedergang, die er gerufen und nicht gerufen hat, werden mit ihm gehen, das Meer wird weiß sein von den Segeln seiner Schiffe, und das Gefilde schwarz von den Schilden seiner Waffen, und Jeder, der im Kriege ihm begegnet, wird durch das Schwert fallen.“ Daß aber Dieses auf keinen Andern gesagt ist, als auf den unverschämten, Gott widerstreitenden Tyrannen, werden wir in Folgendem zeigen.</p><p>Aber Isaias spricht also: „Und es wird geschehen, wenn der Herr vollbracht hat Alles, was er thun will am Berge Sion und an Jerusalem, will ich heimsuchen die Frucht des hochmüthigen Herzens des Königs von Assur, und das Strahlen seiner stolzen Augen. Denn er sprach: In der Stärke meiner Hand hab’ ich’s gethan, und in meiner Weisheit ersonnen, und ich habe die Grenzen der Völker hinausgerückt und ihre Fürsten geplündert und herabgezogen wie ein Held die, so in Erhabenheit thronten. Und es fand, wie im Neste, meine Hand die Schätze der Völker, und gleich wie man Eier aufliest, die verlassen sind, so habe ich aufgelesen die ganze Welt, und Niemand war, der einen Flügel bewegt oder aufgesperrt hätte den Mund oder hätte gezischt. Darf prahlen die Axt gegen den, welcher haut mit selber? oder sich rühmen die Säge gegen den, von welchem sie gezogen wird? Als ob sich erhöbe die Ruthe gegen den, welcher sie schwingt, und sich schwänge der Stock, welcher doch nur Holz ist. Dafür wird schicken der Herrscher, der Herr der Heerschaaren, über seinen Fetten die Dürre, und unter seiner Herrlichkeit wird entbrennen die Lohe, wie ein Brand des Feuers. Und wird das Licht Israels zum Feuer und das Heilige desselben zur Flamme; und entzündet und verzehrt wird sein Gestrüppe und die Distel an einem Tage.“</p><p>So an einer andern Stelle: „Wie feiert der Dränger, ruhet die Zinspflicht! Zerbrochen hat der Herr den Stock der Gottlosen, den Stock der Zwingherrn, welcher Völker schlug im Grimme mit unheilbaren Wunden, der im Zorn Nationen unterjochte, grausam verfolgte. Es ruhet und schweigt die ganze Erde, sie freut sich und jubelt. Selbst die Tannen freuen sich über dich und des Libanons Cedern: Seitdem du zur Ruhe gegangen, kommt Niemand mehr, der uns fället.“ Das Todtenreich drunten wird aufgestört deiner Ankunft entgegen, es wecket auf vor dir die Schatten. Alle Fürsten der Erde erheben sich von ihren Thronen, alle Fürsten der Völker. Alle zumal entgegnen und sagen zu dir: Auch du bist getroffen, wie auch wir; uns bist du gleich geworden. Hingeschlungen zum Todtenreiche ist dein Stolz, gestürzet deine Leiche, unter dir ist das Bett die Motte und sind deine Decke Würmer. Wie bist du gefallen vom Himmel, Morgenstern, der du früh aufstrahltest! bist hinabgestürzt zur Erde, der du todeswund gemacht die Völker! Der du gesprochen in deinem Herzen: Zum Himmel will ich aufsteigen, über den Gestirnen Gottes erhöhen meinen Thron, will niedersitzen auf dem Berge des Zeugnisses, an des Nordens Seiten. Aufsteigen will ich über die Höhen der Wolken, gleich sein dem Allerhöchsten. Ja doch — zum Todtenreiche stürzest du hinab, in die Tiefe der Grube. Die dich sehen, neigen sich über dich und schauen auf dich: „Ist dies der Mann, welcher erschüttert hat die Erde, welcher die Reiche stürzte, welcher den Erdkreis zur Wüste gemacht und dessen Städte zerstörte, seinen Gefangenen nicht öffnet den Kerker? Alle Könige der Völker zumal schlummern in Ehren. Jeder in seinem Hause; du aber bist hingeworfen, fern von deinem Grabe wie ein unnützer, unreiner Staub und bedeckt von Solchen, welche erschlagen worden durch’s Schwert, und die hinabgesenkt sind zum Boden der Grube — wie moderndes Aas. Nicht wirst du Gemeinschaft haben mit ihnen, auch nicht im Grabe, denn du hast dein Land verwüstet, du hast dein Volk gemordet; nicht werde genannt in Ewigkeit der Same der Bösewichter. Bereitet seine Söhne zum Hinschlachten ob der Schuld ihrer Väter, daß sie nicht aufstehen und nicht in Besitz nehmen die Erde.</p><p>Ezechiel sagt in ähnlicher Weise von ihm also: „So spricht der Herr, Gott: Dafür daß sich erhöht hat dein Herz und du gesagt hast: „Gott bin ich, und auf dem Thron Gottes sitze ich in dem Herzen des Meeres,“ da du Mensch bist und nicht Gott, und weil du gleich gestellt hast dein Herz mit den Herzen Gottes — siehe weiser bist du als Daniel, jegliches Geheimniß ist unverhüllt vor dir; durch deine Weisheit und Einsicht hast du dir Macht bereitet, und erworben Gold und Silber in deinen Schatzkammern; durch die Fülle deiner Weisheit und durch deinen Handel hast du vergrößert deine Macht, und erhoben hat sich dein Herz ob deiner Macht; — darum spricht so der Herr Gott: Dafür, daß sich erhöhet hat dein Herz, wie das Herz Gottes, deßhalb siehe, führe ich her über dich, Fremdling, die Gewaltigsten der Nationen, und sie werden entblößen ihre Schwerter gegen den Glanz deiner Weisheit, und sie schänden deine Pracht. Sie werden dich tödten und hinabstoßen, und du sollst sterben den Tod Erschlagener in dem Herzen des Meeres. Wirst du da sagen, sprechend: „Gott bin ich“ Angesichts deiner Mörder, der du Mensch bist und nicht Gott, in der Hand derer, welche dich erschlagen? Den Tod Unbeschnittener wirst du sterben durch die Hand der Fremdlinge, denn ich habe geredet, spricht der Herr.“</p><p>Nachdem wir diese Aussprüche vorgetragen, wollen wir sehen, was Daniel genauer in seinen Gesichten sagt. Dieser führt die der Reihe nach entstehenden Reiche auf und zeigt in den letzten Zeiten auch die Ankunft des Antichrist und das Ende der ganzen Welt. Das Gesicht des Nabuchodonosor erklärend, sagt er also: „Du König schautest, und sieh, es war eine große Bildsäule; diese Bildsäule, groß und an Gestalt erhaben, stand dir gegenüber, und ihr Anblick war erschreckend. Der Kopf dieser Bildsäule war aus bestem Golde, aber Brust und Arme aus Silber, dann Bauch und Hüfte aus Erz; die Schenkel aber waren eisern, ein Theil der Füße war eisern, der andere dagegen irden. So schautest du, bis sich losriß ein Stein (vom Berge) nicht durch Hände, und er traf auf ihre eisernen und irdenen Füße, und er zerschmetterte diese. Alsbald waren zermalmt zumal Eisen, Thon, Erz, Silber und Gold, und aufgelöst gleichsam im Thau einer Sommertenne; und sie wurden weggerafft vom Winde, und nicht war gefunden ihr Platz; der Stein aber, welcher zerschlagen hatte die Bildsäule, ward ein großer Berg und erfüllte die ganze Erde.“</p><p>Hiermit wollen wir die Gesichte Daniels selbst verbinden und sie zusammen auslegend zeigen, wie übereinstimmend und wie wahr sie sind. Denn also sagt er: „Ich sah in meinem Schauen des Nachts, und siehe, die vier Winde des Himmels kämpften auf dem großen Meere. Und vier große Thiere stiegen empor aus dem Meere, unterschieden von einander. Das erste war gleich einer Löwin und hatte Adlerflügel, ich schaute, bis daß ausgerissen wurden seine Flügel und es ward aufgehoben von der Erde und stand auf den Füßen wie ein Mensch, und ein Menschenherz wurde ihm gegeben. Und siehe, ein anderes Thier, gleich einem Bären, stand ihm zur Seite, und drei Reihen waren in seinem Rachen und in seinen Zähnen, und so sprach man zu ihm: Erhebe dich, friß viel Fleisch. Hierauf schaute ich und siehe, ein anderes, gleich einem Parder, und Flügel hatte es wie von einem Vogel, vier an sich, und vier Köpfe waren an dem Thiere, und die Herrschaft ward ihm gegeben. Nach diesem sah ich im Schauen des Nachts und siehe, ein viertes Thier, schrecklich und wunderbar und stark überaus; es hatte große eiserne Zähne, fraß und zermalmte und zerstampfte die Reste mit seinen Füßen; es war aber verschieden von den übrigen Thieren, welche ich gesehen vor ihm, und es hatte zehn Hörner. Ich betrachtete die Hörner, und siehe ein anderes kleines Horn wuchs aus ihrer Mitte auf, und drei von den früheren Hörnern wurden abgestoßen durch selbes, und siehe, Augen wie Menschenaugen waren an diesem Horne und ein Mund, welcher Ungeheueres redete.“</p><p>„Ich schaute, bis daß Throne aufgestellt waren und der Alte an Tagen sich gesetzt hatte; sein Gewand war weiß wie der Schnee und die Haare seines Hauptes gleich reiner Wolle; sein Thron Feuerflammen, dessen Räder lodernd Feuer. Ein Strom, feurig und reissend, ging aus von seinem Antlitze, tausendmal Tausende dienten ihm, und zehntausendmal Hunderttausende umstanden ihn; das Gericht setzte sich, und Bücher wurden aufgeschlagen. Ich schaute wegen des Lärmens der vermessenen Reden, welche jenes Horn aussprach; und ich sah, daß getödtet wurde das Thier und zu Grunde ging sein Leib, und hingegeben ward er zum Verbrennen im Feuer. Auch den übrigen Thieren war die Macht genommen.“</p><p>„So schaute ich in dem Gesichte des Nachts, und mit den Wolken des Himmels kam wie eines Menschen Sohn, und er gelangte bis zum Alten an Tagen, und vor dessen Angesicht brachte man Jenen. Und er gab denselben Macht, Herrlichkeit und Königthum, und alle Völker, Stämme und Zungen sollen ihm dienen; seine Macht ist ewige Macht, die nicht genommen wird, gleichwie sein Königthum, das nie zu Grunde geht.“</p><p>Da Manchem der geheimnißvolle Sinn des Gesagten schwer verständlich scheint, so wollen wir denen nichts verbergen, die zum Verständniß einen gesunden Sinn besitzen. Er sagt, eine Löwin wird aufsteigen aus dem Meere; diese bezeichnet das babylonische Reich auf Erden, da der Kopf des Bildes von Gold war. Wenn er aber sagt: „Die Flügel desselben wie die des Adlers,“ so bezeichnet er damit, daß der König Nabuchodonosor erhöhet wurde und sich gegen Gott erhob. Dann sagt er: „Die Flügel wurden ihm ausgerissen,“ weil ihm sein Ruhm genommen und er aus der Herrschaft vertrieben wurde. Wenn er ferner sagt: „Ein Herz eines Menschen ist ihm gegeben, und er ist auf Füße eines Menschen gestellt,“ so heißt das, er that Buße, erkannte sich selbst, und daß er ein Mensch sei und gab Gott die Ehre.</p><p>Nach der Löwin ferner sah er ein zweites, einem Bären ähnliches Thier; dieses waren die Perser. Denn nach den Babyloniern herrschten die Perser. Wenn er sagt: Drei Rippen in seinem Munde, so weiset er damit auf drei Völker, die Perser, Meder und Babylonier hin, darauf weiset auch hin, daß nach dem Golde das Silber in dem Bilde folgt. Darauf das dritte Thier, ein Parder, waren die Griechen. Denn nach den Persern herrschte der Macedonier Alexander, der den Darius stürzte und im Bilde das Erz bedeutet. Sagte er ferner: „vier Flügel des Vogels,“ so zeigt er dadurch sehr deutlich an, wie das Reich Alexanders getheilt wurde. Sagte er aber „vier Köpfe“, so wies er hin auf die vier Könige, die aus jenem Reiche hervorgingen. Denn bei seinem Tode theilte Alexander sein Reich in vier Theile.</p><p>Dann sagt er: „Das vierte Thier, schrecklich und wunderbar, seine Zähne von Eisen und seine Klauen von Erz.“ Wer sind das anders als die Römer? So ist das Eisen die jetzt bestehende Herrschaft. „Seine Schenkel waren eisern.“ Und was ist dann nun noch übrig, Geliebtester, als die Fußsohlen des Bildes, die aus einer Mischung von Eisen und Thon bestehen. Geheimnißvoll hat er durch die Klauen der Füße die aus Jenen hervorgehenden Könige geoffenbart. Sagt Daniel ferner: „Ich sann über das Thier nach und siehe, zehn Hörner hinter ihm, unter diesen wird sich ein anderes als Nebenschößling erheben und drei Hörner vor ihm vernichten;“ so bedeutet (dieser Nebenschößling) nichts Anderes als das Auftreten des Antichrist, der auch das Reich der Juden wiederherstellen wird. „Drei Hörner,“ sagt er, „werden von ihm vernichtet.“ Das sind drei Könige von Ägypten, Libyen und Äthiopien, die er in der Feldschlacht vernichten wird, er, der mit Schrecken Alles beherrscht und zugleich als Tyrann Vedrängniß und Verfolgung über die Menschen bringt, indem er sich über sie erhebt. Ferner sagt Daniel: „Ich betrachtete die Hörner, und siehe dieses Horn führte Krieg gegen die Heiligen und besiegte sie, bis getödtet wurde das Thier und zu Grunde ging sein Leib und hingegeben ward er zum Verbrennen im Feuer.“</p><p>Bald nachher wird vom Himmel der Stein kommen, der das Bild traf und zermalmte und alle Reiche aufhob und die Herrschaft den Heiligen des Höchsten übertrug. „Er selbst aber wurde zu einem großen Berge und erfüllte die ganze Erde,“ wie Daniel sagt: „So schaute ich im Geiste des Nachts, und siehe, mit den Wolken des Himmels kam wie eines Menschen Sohn, und er gelangte bis zum Alten an Tagen, und vor dessen Angesicht brachte man Jenen. Und er gab demselben Macht und Herrlichkeit und Königthum, und aller Völker Stämme und Zungen sollen ihm dienen; seine Macht ist ewige Macht, die nicht genommen wird, gleichwie sein Königthum, das nie zu Grunde geht.“ Hierin zeigt er die ganze Macht, welche vom Vater dem Sohn gegeben, der zum Könige und Richter über Alles, was im Himmel, auf Erden und unter der Erde ist, erwählt worden: über das Himmlische, weil er als Logos des Vaters vor Allem gezeugt; über das Irdische, weil er als Mensch unter Menschen geboren wurde, um durch sich den Adam umzubilden; über das Unterirdische, weil er unter die Todten gerechnet den Seelen der Heiligen predigte und den Tod durch den Tod besiegte.</p><p>Da Dieses geschehen wird, wenn auch die zehn Zehen der Statue in Demokratien übergegangen und die zehn Hörner des andern Thiers in zehn Königreiche getheilt sind, so wollen wir das Vorliegende genauer ansehen und augenscheinlich kennen lernen.</p><p>Der Kopf des Bildes, die Löwin, waren die Babylonier; die silbernen Schultern und Arme, der Bär, die Perser und Meder, der Bauch und ehrene Oberschenkel, der Pardel, die seit Alexander herrschenden Griechen. Die eisernen Unterschenkel, das erstaunliche und schreckliche Thier, die jetzt herrschenden Römer. Die irdenen und eisernen Fußsohlen; und die zehn Hörner werden die kommenden Reiche sein; das andere kleine unter ihnen aufschießende Horn, der Antichrist; der die Erde zermalmt und über die Welt das Gericht hält, Christus.</p><p>Dieses, Geliebter, theile ich dir nicht ohne Furcht mit, aber in guter Absicht wegen der überschwänglichen Liebe Christi. Denn wenn die seligen Propheten, welche vor uns lebten und diese Dinge sahen, sie nicht mit Zuversicht verkündigen wollten, um den Gemüthern der Menschen keinen Schrecken zu bereiten, sondern sie geheimnißvoll in Gleichnisse und Räthsel gekleidet vortrugen, indem sie sagten: „Hier ist der Sinn, welcher Weisheit hat“ — um wie viel mehr sollten wir nicht Gefahr laufen, wenn wir das, was von Jenen geheimnißvoll verkündigt wurde, offen zu sagen wagten! Sehen wir nun, was in den letzten Tagen über diese unreine Hure kommen wird, und welche und eine wie große Prüfung dem Zorne Gottes gemäß vor dem Gerichte ganz besonders über sie hereinbrechen wird.</p><p>Komm du nun, o seliger Isaias, erhebe dich und sage uns deutlich was du über das große Babylon geweissagt hast. Denn was du über Jerusalem gesagt, ist erfüllt worden. Du nun sagtest mit Zuversicht: „Euer Land wird wüste, eure Städte werden niedergebrannt vom Feuer; eure Ackerflur, Angesichts euer verzehren sie Fremdlinge, und sie verödet, wie durch feindliche Verwüstung. Und übrig ist gelassen die Tochter Sion, wie eine Hütte im Weingarten, und wie eine Laube im Gurkenfelde, und wie eine Stadt, die verwüstet ist.“ Was denn? ist Dieses schon geschehen? nicht erfüllt, was von dir gesagt worden? Nicht ihr Land Juda verwüstet? nicht verbrannt das Heiligthum? nicht zerstört ihre Mauern? nicht die Städte verwüstet? verzehren nicht ihr Land Fremde? beherrschen nicht die Römer ihr Land? Auch haben dich die Gottlosen aus Haß durchsägt und Christum gekreuzigt. Du starbst in der Welt, aber jetzt lebst du in Christus.</p><p>Wen von euch soll ich mehr lieben als dich? Freilich wohl wird auch Jeremias gesteinigt. Mehr wohl Jeremias? Aber auch Daniel gibt Zeugniß. Daniel, dich lobe ich vor Allen. Aber auch Johannes sagt nichts Falsches. Wie soll ich euch mit Mund und Zunge verherrlichen, mehr noch den Logos, der in euch geredet hat? Ihr starbet mit Christus, werdet aber leben mit Christus. Höret es und freuet euch! Siehe, das, was von euch verkündigt worden, ist seiner Zeit erfüllt worden. Denn ihr sahet es zuerst und habt es dann allen Völkern verkündigt, die Aussprüche Gottes habt ihr allen Völkern dargeboten. Propheten nanntet ihr euch, um Alle retten zu können. Denn der ist in Wirklichkeit ein Prophet, der zeigen kann, daß das, was er als Zukünftiges vorherverkündigt hat, später eingetreten ist. Ihr waret Schüler eines vortrefflichen Lehrers. Darob lobe ich euch mit Recht, als wenn ihr noch lebtet; denn schon besitzet ihr die im Himmel euch hinterlegte Krone des Lebens und der Unvergänglichkeit.</p><p>Sage mir doch, seliger Daniel, überzeuge mich, ich beschwöre dich! du prophezeitest über die Löwin in Babylon, denn dort warst du in Gefangenschaft. Du erzähltest das Zukünftige über den Bären und warest noch in der Welt und sahest es erfüllt werden. Dann nennst du mir den Pardel. Woher wußtest du Dieses, denn du warst schon gestorben (als es eintraf). Wer anders hat dich Dieses sagen gelehrt, als Derjenige, der dich aus dem Schooße der Mutter gebildet hat? Gott sagst du. Du sagtest es und logest nicht: Es stand auf der Pardel, es kam der Ziegenbock; er stieß den Widder; zertrümmerte seine Hörner; zerstampfte ihn mit den Füßen; wurde erhoben in seinem Falle; es erhoben sich unter ihm vier Hörner. Freue dich, seliger Daniel, du hast dich nicht getäuscht; Dieses alles ist geschehen.</p><p>Jetzt erzähle mir ferner von dem vierten Thiere, dem schrecklichen, erstaunlichen. „Seine Zähne sind von Eisen und seine Krallen von Erz, sie verzehren und zermalmen, und was übrig ist, zertritt es mit den Füßen.“ Jetzt aber herrscht das Eisen, schon bezwingt und zermalmt es Alles; schon unterwirft es Alle wider ihren Willen; schon sehen wir Dieses und preisen Gott von ihm belehrt.</p><p>Aber da es unser Vorsatz war, über die Hure zu reden, so komm, du seliger Isaias, herbei. Sehen wir, was du über Babylon sagtest: „Steig herab, setz dich in den Staub, Jungfrau Tochter Babylon! Setze dich zur Erde; nicht ist ein Thron für die Tochter der Chaldäer; denn fürder wird man dich nicht nennen: Weichliche und Zarte. Nimm die Mühle und mahle Mehl, decke auf deine Schande, entkleide die Schulter, entblöße die Schenkel, durchwate die Flüsse. Enthüllt wird deine Scham und gesehen deine Schmach. Rache will ich nehmen, und widerstehen wird mir kein Mensch. Unser Erlöser — Herr der Heerschaaren ist sein Name — der Heilige Israels! Sitze stumm und gehe in’s Dunkel, Tochter der Chaldäer; denn nicht fürder wird man dich nennen: „Herrin der Königreiche!“</p><p>Gezürnt hatte ich auf mein Volk, entweiht mein Erbe und gab sie in deine Hand; nicht wendetest du ihnen Mitleid zu; hast auf den Greis gelegt dein Joch gar schwer. Und du sprachest: „Ewiglich werde ich Herrin sein.“ Hast Solches nicht erwogen in deinem Herzen und gedachtest nicht deines letzten Endes. Nun aber höre Dieß, Verzärtelte und Wohnende in Zuversicht! die du sprichst in deinem Herzen: „Ich bin, und Nichts ist außer mir; nicht verwittwet werde ich sitzen und nicht kennen Kinderlosigkeit.“ — kommen wird dir dieses Beide plötzlich an Einem Tage: Kinderlosigkeit und Wittwenschaft; vollgemessen kommt es über dich ob der Menge deiner Zaubereien und ob der Verstocktheit deiner Beschwörer, der argen. Und zuversichtlich warst du in deiner Bosheit und sprachest: „Keiner ist, der mich sähe;“— deine Weisheit und dein Wissen, sie verführten dich, und du sprachst in deinem Herzen: „Ich bin, und außer mir ist nicht ein Anderer.“ Es kommt über dich Böses, und du merkest nicht sein Aufdämmern, und überfällt dich Unheil, das du nicht zu sühnen vermagst; es kommt plötzlich über dich ein Jammer, den du nicht gewußt. Stehe zu deinen Beschwörern und zur Menge deiner Zaubereien, in denen du dich abgemühet von deiner Jugend an, ob vielleicht dir’s etwas helfe, oder ob du dich zu kräftigen vermagst. Müde bist du von der Menge deiner Berathungen; es mögen sich stellen und dich retten die Himmelsdeuter, die nach den Sternen schauen und die Neumonde ausrechnen, daraus das dir Zukünftige zu künden. Sieh, sie sind wie Stoppeln; Feuer verbrennt sie, nicht retten sie ihr Leben aus der Flammen Gewalt; das sind nicht Kohlen, daran sich zu wärmen, kein Heerd, daß man sich setze an ihn. So werden dir Jene, mit denen du dich abgegeben, mit denen du verkehrt von deiner Jugend an; sie irren Jeglicher auf seinem Wege, Keiner ist dir Helfer.“ Dieses nun weissagt dir Isaias; sehen wir, ob Johannes Ähnliches verkündigt hat.</p><p>Denn als Dieser auf der Insel Patmos war, sah er die Offenbarung schrecklicher Geheimnisse, die er weitläufig erzählt und Andern mittheilt. Sage mir, seliger Johannes, Apostel und Schüler des Herrn: Was sahest und hörtest du über Babylon? Erhebe dich und rede, denn jenes hat auch dich verbannt. „Und es kam Einer von den sieben Engeln, welche die sieben Schalen hatten, und er redete mit mir und sagte: Komm! Ich werde dir zeigen die Verurteilung der großen Buhlerin, welche sitzet auf den vielen Wassern, mit welcher gebuhlt haben die Könige der Erde und sind berauscht worden, die, so die Erde bewohnen, von dem Weine ihrer Buhlschaft. Und er trug mich fort im Geiste in eine Wüste. Und ich sah ein Weib auf einem scharlachrothen Thier, das voll von Lästernamen, sieben Köpfe hatte und zehn Hörner. Und das Weib war angethan mit Purpur und Scharlach, und vergoldet mit Gold und Edelgestein und Perlen; es hatte einen goldenen Becher in seiner Hand, gefüllt mit Greuel und Unsauberkeit ihrer Buhlschaft. Und auf ihrer Stirn war als Name geschrieben: Geheimnis, Babylon, die große und die Mutter der Buhlschaften und der Greuel der Erde.“</p><p>„Und ich sah das Weib trunken von dem Blute der Heiligen und von dem Blute der Zeugen Jesu. Und ich verwunderte mich, als ich sie sah großen Wunders. Und es sagte zu mir der Engel: Warum wunderst du dich? Ich will dir sagen das Geheimniß des Weibes und des Thieres, das sie trägt, welches die sieben Köpfe hat und die zehn Hörner. Das Thier, welches du gesehen, war und ist nicht und wird heraufsteigen aus dem Abgrund und gehet in’s Verderben; und es werden sich wundern, die da wohnen auf der Erde — (deren Namen nicht geschrieben sind in das Buch des Lebens seit Grundlegung der Welt) — so sie sehen das Thier, welches war und nicht ist.“</p><p>„Hier ist der Sinn, welcher Weisheit hat. Die sieben Köpfe sind sieben Berge, über welchem das Weib sitzet; und sieben Könige sind. Die Fünfe sind gefallen; Einer ist, (und) der Andere ist noch nicht gekommen, und wenn er gekommen ist, muß kurze Zeit er bleiben. Und das Thier, welches war und nicht ist, es ist selber der achte, und ist vor den sieben und gehet ins Verderben. Und die zehn Hörner, welche du gesehen, sind zehn Könige, welche ein Reich noch nicht empfangen haben, sondern Gewalt gleichwie Könige bekommen werden für eine Stunde mit dem Thiere. Diese haben* eine* Gesinnung, und ihre Macht und Gewalt geben sie dem Thiere. Sie werden mit dem Lamme Krieg führen, und das Lamm wird sie besiegen, weil es Herr ist der Herren und König der Könige, und die mit ihm (sind) Berufene, Auserwählte und Gläubige.“</p><p>„Und er sagte zu mir: Die Wasser, welche du gesehen, worauf die Buhlerin sitzet, Völker sind es und Nationen und Zungen. Und die zehn Hörner, welche du gesehen an dem Thiere, die werden hassen die Buhlerin und werden sie wüste machen und nackt, und sie essen deren Fleisch und verbrennen sie im Feuer. Denn Gott gab es in ihre Herzen, daß sie thun, was seines Sinnes ist, um zu geben ihr Königthum dem Thiere, bis daß vollbracht werden die Worte Gottes. Und das Weib, welches du gesehen, ist die große Stadt, welche das Königthum hat über die Könige der Erde.“</p><p>„Und nachher sah ich einen anderen Engel herabsteigen von dem Himmel, der hatte große Gewalt; und die Erde ward erleuchtet von seiner Herrlichkeit. Und er rief hinaus mit starker Stimme, sagend: „Gefallen ist, gefallen Babylon die große und ist geworden Wohnung für Dämone, und Warte für jeglichen unreinen Geist, und Warte jedes unreinen und haßwürdigen Gevögels, weil von dem Weine des Grimmes jener Buhlschaft getrunken haben alle Völker, und die Könige der Erde mit ihr gebuhlt, und die Kaufleute der Erde von der Macht ihrer Üppigkeit sich bereichert haben. Und ich hörte eine andere Stimme aus dem Himmel, die da sagte: Gehet heraus aus ihr, mein Volk, damit ihr nicht vergemeinschaftet seiet ihren Sünden, und daß ihr nicht von ihren Plagen empfanget, weil hinanreichen ihre Sünden bis an den Himmel und der Herr gedacht hat ihrer Frevel.“</p><p>„Vergeltet (ihr) dafür, sowie auch sie selber euch vergolten hat, und verdoppelt Doppeltes nach ihren Werken; in dem Becher, mit welchem sie eingeschenkt, schenket ihr zweifach ein. Wie viel herrlich sie sich gemacht und üppig gewesen, also viel gebet ihr Qual und Leid, weil in ihrem Herzen sie sagt: Da sitze ich als Königin und bin nicht Wittwe und sehe kein Leid. Deßwegen werden an* einem* Tage kommen ihre Plagen, Tod und Leid und Hunger, und im Feuer wird sie niedergebrannt werden, weil stark ist Gott, der sie richten wird. Und weinen werden und wehklagen über sie die Könige der Erde, welche mit ihr gebuhlt und in Üppigkeiten gelebt haben, wenn sie sehen den Rauch ihres Brandes von der Ferne stehend aus Furcht vor ihren Qualen und sagend: Wehe, wehe, die große Stadt Babylon, die Stadt, die starke, weil in einer Stunde gekommen ist dein Gericht, und die Kaufleute der Erde werden weinen und Leid tragen über sie, weil ihre Waaren fürder Niemand kaufen wird. Die Waaren von Gold und Silber und Edelgestein, und Perlen, und von Byssus und Purpur, und Seide, und Scharlach, (und jedes Würzholz, und jeglich Geräth aus Elfenbein, und jeglich Geräthe aus Juwelen, und Erz und Eisen und Marmor und Zimmet) — und „Wohlgerüche und Salbe und Weihrauch und Wein und Öl und (Gerste) und Weizen und Zugvieh, und Schafe, und Pferde, Wagen, und Menschenleiber, und Menschenseelen. Und das Obst zur Lust deiner Seele ist fortgegangen von dir, und alles Fette und Gleissende ist verloren für dich, und fürder wird man es nicht finden. Dessen Verkäufer, welche reich geworden, werden ferne von ihr stehen aus Furcht vor ihrer Qual, weinend, leidtragend, sprechend: Wehe, wehe, die Stadt, die große, welche angethan war mit Byssus und Purpur und Scharlach, und vergüldet mit Gold und Edelgestein und Perlen, weil in* einer* Stunde vernichtet ward so großer Reichthum; und jeder Steuermann, und wer die See befährt, und die Schiffer, und die im Meere beschäftigt sind, von Ferne stehen sie und rufen, wenn sie den Rauch ihres Brandes sehen und sagen: Welche war gleich dieser großen Stadt? Und sie werfen Staub über ihre Häupter und rufen weinend und leidtragend und sprechen: Wehe, wehe, die Stadt, die große, in welcher reich geworden Alle, die da Schiffe hatten auf dem Meere, von ihrem Prunke, daß sie in einer Stunde ist vernichtet worden!“</p><p>„Frohlocke über sie, Himmel, und (ihr) Heilige, Apostel und Propheten, weil Gott gerichtet hat euer Gericht an ihr! Und aufhob ein starker Engel einen Stein, wie einen großen Mühlstein, und warf (ihn) in das Meer, indem er sagte: Mit solcher Wucht wird geworfen werden Babylon, jene große Stadt, und nicht fürder wird sie gefunden. Und die Stimmen von Harfnern und Musikern und Flötenspielern und Posaunenbläsern wird nicht fürder gehört werden in dir, und kein Künstler irgend welcher Kunst wird fürder gefunden in dir, und der Laut der Mühle nimmer gehört werden in dir, und Lampenlicht soll nicht mehr scheinen in dir und Stimmen von Bräutigam und Braut nimmer gehört werden in dir, weil deine Kaufleute die Fürsten waren der Erde, weil an deinen Zaubereien irre geworden alle Völker. Und an ihr wurde Blut von Propheten und Heiligen gefunden, und von Allen, welche gemordet sind worden auf Erden.“</p><p>In diesen Aussprüchen ist sehr deutlich das besondere Gericht der Prüfungen geoffenbart, welches in den letzten Zeiten von den Tyrannen, welche dann sein werden, verursacht, über dasselbe kommen wird. Wir müssen aber auch die Zeit genau angeben, wann Dieses geschehen wird und das kleine Horn sich dann erheben wird, in welchen Zeitverhältnissen nämlich die eisernen Schenkel, die jetzt noch herrschen und nach der Darstellung des Bildes und der Gestalt des schrecklichen Thiers in die Fußsohlen und die Zehen hinabreichen, wie früher gezeigt worden ist, sich mit dem Thone in Eins vermischen. Dieses wird uns Daniel zeigen, denn er sagt: „Befestigen aber wird den Bund für Viele* eine* Woche, und in der Hälfte der Woche wird aufhören (mein) Schlachtopfer und Speiseopfer.“ Eine Jahrwoche hat er also bezeichnet, welche am Ende der ganzen Welt die letzte der letzten sein wird, von der die Hälfte die beiden Propheten Henoch und Elias einnehmen werden. Denn diese werden, angethan mit härnen Kleidern, eintausend zweihundert und sechzig Tage predigen und alle Völker zur Buße auffordern.</p><p>Es ist uns ja eine zweimalige Ankunft unsres Herrn und Erlösers durch die Schriften bezeugt worden; die eine, die erste nämlich im Fleische ohne Glanz wegen seiner Erniedrigung, wie Isaias vorherverkündigt hat, indem er sagt: „Nicht ist ihm Schönheit und nicht Zierde, daß auf ihn wir schauten, und ist nicht Aussehen, daß wir sein begehrten, des Verachteten und Letzten der Menschen, des Mannes der Schmerzen und vertraut mit Siechthum; und wie verdeckt war sein Antlitz, und er war verachtet; darum auch achteten wir seiner nicht.“ Seine zweite Ankunft ist aber als herrlich verkündigt, wie er vom Himmel kommt mit der Macht der Engel und der Herrlichkeit des Vaters, wie der Prophet sagt: „Einen König in seiner Herrlichkeit werdet ihr sehen.“ „So schaute ich in dem Gesichte des Nachts und siehe, mit den Wolken des Himmels kam wie eines Menschen Sohn, und er gelangte bis zu dem Alten an Tagen, und vor dessen Angesicht brachte man Jenen. Und er gab demselben Macht und Herrlichkeit und Königthum, und alle Völker, Stämme und Zungen sollen ihm dienen: seine Macht ist ewige Macht, die nicht genommen wird, gleichwie sein Königthum, das nie zu Grunde geht.“ So sind auch zwei Vorläufer gezeigt worden. Der erste war Johannes, der Sohn des Zacharias, der in Allem der Vorläufer und Herold unseres Erlösers geworden und das himmlische Licht, welches in der Welt leuchtete, verkündend, schon im Mutterschooße, sobald er von Elisabeth empfangen war, vorlief, um den neugebornen Kindern die neue Geburt, mit der sie von dem hl. Geiste und der Jungfrau beschenkt werden würden, zu zeigen.</p><p>Denn als er den Gruß der Elisabeth hörte, sprang er vor Freude auf im Schooße der Mutter, weil er den im Schooße der Jungfrau empfangenen Logos Gottes schaute. Darauf predigte er in der Wüste und verkündigte dem Volke die Taufe der Buße, um den in der Wüste der Welt lebenden Völkern die künftige Erlösung anzuzeigen. Dann zeigte er im Jordan den Erlöser in Person und sagt: „Dieser ist das Lamm Gottes, welches die Sünden der Welt hinwegnimmt.“ Als er von Herodes hingerichtet war, predigte er zuerst denen in der Unterwelt und wurde dort ebenfalls Vorläufer, um anzuzeigen, daß der Erlöser auch dahin kommen werde, um die Seelen der Heiligen aus der Hand des Todes zu erlösen.</p><p>Da nun der Erlöser der Anfang der Auferstehung aller Menschen war, so mußte er, der Herr, durch den das Gericht über die ganze Welt kommen sollte, allein von den Todten auferstehen, damit die, welche würdig gekämpft haben, auch würdig von ihm belohnt würden, dem herrlichen Preisrichter, der zuerst die Laufbahn durchlief, der in den Himmel aufgenommen, sitzet zur Rechten Gottes, des Vaters, und am Ende der Welt wieder kommen wird, um sich als Richter zu offenbaren. Vorher aber müssen nothwendig zuerst seine Vorläufer erscheinen, wie er durch Malachias und den Engel sagt: „Ich werde euch senden Elias, den Thesbiten, bevor kommet der Tag des Herrn, der große und furchtbare.“ Und er wird zurückwenden die Herzen der Väter zu den Kindern und die Ungehorsamen zur Einsicht Gerechter, auf daß ich nicht komme und die Erde schlage von Grund aus. Wenn diese nun kommen, werden sie die bevorstehende Erscheinung Christi vom Himmel verkündigen und Zeichen und Wunder thun, ob sie etwa dadurch die Menschen beschämen und zur Buße bekehren möchten von ihrer ungeheueren Zügellosigkeit und Gottlosigkeit.</p><p>Johannes sagt nämlich: „Und geben will ich meinen zwei Zeugen, und sie werden weissagen tausend zweihundert und sechzig Tage hindurch, angethan mit Bußkleidern. — Das ist jene halbe Woche von der Daniel gesagt hat, — dieß sind die zwei Ölbäume und die zwei Leuchter, die da Angesichts des Herrn der Erde stehen. Und wenn Jemand sie schädigen will, geht Feuer aus ihrem Munde und verzehret ihre Feinde; und wenn Jemand sie schädigen will, muß er also getödtet werden. Diese haben Gewalt, den Himmel zu schließen, damit es nicht regne in den Tagen ihrer Weissagung, und sie haben Gewalt über die Wasser, sie zu verwandeln in Blut und zu schlagen die Erde mit jeglichen Plagen, so oft sie wollen.“ Wenn sie aber ihren Lauf und ihr Zeugniß vollendet haben, was sagt der Prophet? „Es wird das Thier, welches heraufsteigt aus dem Abgrund, Krieg führen mit ihnen und sie besiegen und sie tödten,“ weil sie dem Antichrist nicht haben Ehre geben wollen; Dieser ist das aufwachsende kleine Horn. Dieser nämlich, hochmüthigen Herzens, wird anfangen, sich selbst zu erhöhen, und sich für Gott ausgeben, indem er die Heiligen verfolgt und den Gesalbten lästert, wie Daniel sagt: „Ich betrachtete das Horn; und siehe, Augen, wie Menschenaugen, waren an diesem Horn und ein Mund, der Vermessenes redete. Und es öffnete seinen Mund und sprach Lästerung gegen Gott. Und jenes Horn führte Krieg mit den Heiligen und bewältigte sie, bis getödtet wurde das Thier und zu Grunde ging und sein Leib hingegeben ward zum Verbrennen im Feuer.“</p><p>Aber wir müssen eingehender darüber handeln und klarer zeigen, wie der hl. Geist durch eine Zahl auch seinen Namen auf geheimnißvolle Weise geoffenbart hat. Denn also sagt Johannes: „Und ich sah ein anderes Thier aufsteigen aus der Erde, und es hatte zwei Hörner, gleich denen eines Lammes, und es redete wie ein Drache. Und die ganze Gewalt des ersten Thieres übte es Angesichts desselben und machte die Erde, und die auf selber wohnten, anbeten das erste Thier, dessen Todeswunde geheilt war. Und es that große Zeichen, so daß es sogar Feuer vom Himmel herabkommen machte auf die Erde Angesichts der Menschen. Und es führte irre die Bewohner der Erde ob der Zeichen, welche zu thun Angesichts des Thieres ihm gegeben worden, indem es den auf der Erde Wohnenden sagte, ein Bild zu machen dem Thiere, welches die Wunde hat des Schwertes und lebendig ist. Und gegeben ward ihm, Geist zu geben dem Bilde des Thieres, daß sogar das Bild des Thieres redete, und daß es machte, daß Alle, die nicht anbeteten das Bild des Thieres, getödtet wurden. Und machen wird es, daß Alle, die Kleinen und die Großen, die Reichen und die Armen, die Freien und die Sklaven, ein Malzeichen haben in ihrer rechten Hand oder an ihrer Stirne, damit Niemand kaufen könne oder verkaufen, ausgenommen wer das Malzeichen hat, den Namen des Thieres oder die Zahl seines Namens. Hierin ist die Weisheit. Wer Einsicht hat, berechne die Zahl des Thieres. Denn Menschen-Zahl ist sie, und seine Zahl ist sechshundert sechs und sechzig.“</p><p>Dieses aus der Erde aufsteigende Thier, sagt er, werde das Reich des Antichrist sein; die beiden Hörner aber bezeichnen ihn selbst und den falschen Propheten, der bei ihm ist. Daß er sagt, seine Hörner seien ähnlich denen eines Lammes, soll heißen, er wolle dem Sohne Gottes gleichen und sich selbst als König darstellen. Daß er redet wie ein Drache, soll heißen, er sei ein Verführer und Lügner. Das aber: „Er übte die Gewalt des ersten Thieres und machte die Erde, und die auf selber wohnten, anbeten das erste Thier, dessen Todeswunde geheilt war,“ bezeichnet, daß er nach der Weise des Augustus, von dem ja das römische Reich errichtet worden, befehlen und herrschgewaltig Alles anordnen werde, um sich dadurch größeren Ruhm zu bereiten. Das aber bezeichnet das vierte Thier, das am Haupte verwundet und wieder geheilt worden, daß, wenn es zusammengebrochen, entehrt und in zehn Diademe aufgelöst worden, der Antichrist es dann gleichsam heilen und erneuern wird. Ist aber von dem Propheten gesagt worden, „er werde geben einen Geist dem Bilde des Thieres, und es werde reden das Bild des Thieres“, so heißt das, es wird wieder kräftig und stark werden durch das von ihm erlassene Gesetz und wird machen, daß Diejenigen, welche das Thier nicht anbeten, getödtet werden. So wird der Glaube und die Geduld der Heiligen offenbar werden. Denn er sagt ferner: „Und machen wird er, daß Alle, die Kleinen und die Großen, und die Reichen und die Armen, und die Freien und die Sklaven, ein Malzeichen haben in ihrer rechten Hand oder auf ihren Stirnen, damit Niemand kaufen könne oder verkaufen, ausgenommen, wer das Malzeichen hat, (oder) den Namen des Thieres oder die Zahl seines Namens.“ Denn da er voll List ist und aufgeblasen gegen die Diener und sie aus der Welt verdrängen und vertreiben möchte, so wird er, da sie ihn nicht gehört haben, befehlen, daß Alle überall Weihrauchpfannen aufstellen, damit Keiner der Heiligen weder kaufen noch verkaufen könne, ohne vorher geopfert zu haben. Dieses bedeutet nämlich das auf die rechte Hand gegebene Malzeichen. Das Malzeichen auf der Stirn will sagen, daß Alle gekrönt sein und eine Feuerkrone tragen sollen, nicht zum Leben, sondern zum Tode. Derselben List bediente sich Antiochus Epiphanes, der König von Syrien und Enkel Alexanders von Macedonien, gegen die Juden. Auch er, damals aufgeblasen in seinem Herzen, erließ eine Verordnung, alle sollten Altäre vor die Thüre stellen, darauf opfern und sich zu Ehren des Bachus mit Epheu bekränzen; die sich nicht unterwerfen wollten, sollten, nachdem sie gequält und gefoltert, getödtet werden. Aber er empfing auch von dem Alles richtenden und sehenden Herrn und Gott den verdienten Lohn: denn von den Würmern verzehrt, schied er aus dem Leben. Wer dieses genauer erforschen will, der findet es in den Büchern der Maccabäer verzeichnet.</p><p>Jetzt wollen wir das auf unsern Gegenstand Bezügliche sagen. Dasselbe wird auch der Antichrist, der die Heiligen auf alle Weise quälen will, ins Werk setzen. Denn es sagt der Prophet und Apostel: „Hierin ist die Weisheit. Wer Einsicht hat, berechne die Zahl des Thieres, denn Menschenzahl ist sie, und seine Zahl ist sechshundert sechs und sechzig.“ Was seinen Namen angeht, so können wir darüber nicht mit voller Bestimmtheit sagen, wie der selige Johannes ihn verstanden und darüber gelehrt hat, sondern nur muthmaßen. Wenn er aber erscheint, wird der Selige zeigen, was wir suchen. Soviel wir übrigens davon wissen, das sagen wir nicht, ohne zu zweifeln. Wir finden nämlich viele Namen mit dieser in Buchstaben ausgedrückten Zahl, ein solcher ist zum Beispiel Teitan (Titan), ein alter und berühmter Name, oder auch Euanthes, der ebenfalls dieselbe Buchstabenzahl enthält, und so ließen sich noch mehr andere finden. Da wir aber vorhin gesagt haben, daß die Wunden des ersten Thieres geheilt wurden und er (der Antichrist) das Bild reden machen, d. h. es stark machen werde, so leuchtet Allen ein, daß es die noch jetzt herrschenden Lateiner sind. Denn auf den Namen eines Menschen übertragen, gibt die Zahl Lateinos.</p><p>Um indessen durch diese Erklärungen nicht allein Diejenigen, welche gern in den Aussprüchen Gottes forschen, zu überzeugen, wollen wir noch mehrere andere Nachweise beibringen. Daniel sagt nämlich: „Diese allein werden gerettet aus seiner Hand: Edom und Moab und das Haupt der Söhne Ammon.“ Ammon und Moab sind die Söhne Lot’s von seinen Töchtern erzeugt, deren Geschlecht jetzt noch fortdauert. Isaias sagt nämlich: „Und sie fliegen auf die Schultern der Philistäer am Meer; mitsammen plündern sie die Söhne des Osten, Judomäa und Moab sind zu ihrer Hände Befehl, und die Söhne Ammon sind unterthan.“</p><p>Dieser, durch die Zeiten angedeutet, wird alsdann erscheinen, sich der drei von den zehn Hörnern in der Feldschlacht bemächtigen, sie vernichten, nämlich Ägypten, Libyen und Äthiopien und sie der Rüstung und Beute berauben. Hat er sich darauf auch die übrigen von allen Seiten beschädigten Hörner unterworfen, dann wird er anfangen, sich im Herzen aufzublähen und sich gegen Gott zu erheben, indem er den ganzen Erdkreis beherrscht. Sein erster Angriff wird alsdann gegen Tyrus, Berytus und die Umgegend sein. Durch die Eroberung dieser Städte wird er den andern Schrecken einjagen, wie Isaias sagt: „Erröthe, Sidon! denn sagt das Meer, des Meeres Feste sprechend: Ich kreiße nicht und gebäre nicht und nähre keine Jünglinge und ziehe keine Jungfrauen groß. Wenn das kund wird in Ägypten, wird man trauern bei der Botschaft über Tyrus.“</p><p>Wenn Dieses so geschehen wird, Geliebter, und die drei Hörner von ihm abgeschlagen sind, dann wird er anfangen, sich als Gott zu zeigen, wie Ezechiel vorhergesagt hat: „Dafür, daß sich erhöhet hat dein Herz und du gesagt hast: Gott bin ich.“ In ähnlicher Weise Isaias: „Der du gesprochen in deinem Herzen: Zum Himmel will ich aufsteigen, über die Gestirne Gottes erhöhen meinen Thron, … gleich sein dem Allerhöchsten. Ja doch — zum Todtenreiche stürzest du hinab, in die Tiefe der Grube.“ So auch Ezechiel: „Wirst du sagen, sprechend: Gott bin ich, Angesichts deiner Mörder, der du Mensch bist, nicht Gott.“</p><p>Nachdem in diesen Erörterungen die Abstammung des Antichrist, sowie sein Auftreten und sein Untergang, zugleich mit seinem geheimnißvoll angedeuteten Namen gezeigt worden, wollen wir jetzt auch sein Treiben sehen. Derselbe wird aus allen Ländern, wo es zerstreut ist, das ganze Volk zu sich rufen, sie wie seine eigenen Kinder halten, indem er ihnen verspricht, ihr Land herstellen, ihr Königreich und Volk wieder aufrichten zu wollen, um von ihnen als Gott verehrt zu werden, wie der Prophet sagt: „Er wird sein Reich versammeln vom Aufgange der Sonne bis zum Niedergange; die er beruft und nicht beruft, werden mit ihm gehen!?“ Auch Jeremias spricht von ihm unter folgendem Gleichnisse: „Ein Rebhuhn brütet, was es nicht gelegt, so ist, wer Reichthum gewann, doch nicht durch Ehrlichkeit; in der Hälfte seiner Tage verläßt er ihn, und am Ende seiner Tage erscheint er als ein Thor.“</p><p>Es wird nun unserm Gegenstande nicht schaden, die Arglist des Thieres zu erzählen, und daß der Prophet nicht ohne Grund, als er den Ausspruch that, sich des Gleichnisses von jenem Thiere bediente. Das Rebhuhn ist nämlich ein eitles Thier; denn sieht es in seiner Nähe das Nest eines andern Rebhuhns, in welchem Junge sind, so ahmt es, ist deren Vater nach Futter ausgeflogen, des anderen Stimme nach und lockt die Jungen an sich. Diese aber, in der Meinung, es sei ihr eigener Vater, laufen zu ihm. Dieses brüstet sich dann mit den fremden Jungen, als wären sie seine eigenen. Kommt aber der wahre Vater zurück, ruft mit seiner eigenen Stimme, welche die Jungen kennen, so verlassen sie den Verführer und kehren zu dem wahren Vater zurück. Dieses Treiben hat der Prophet tropisch auf den Antichrist übertragen. Auch er wird die Menschheit zu sich rufen und sich aneignen wollen, was ihm nicht gehört, und während er Allen die Freiheit verspricht, kann er sich selbst nicht retten.</p><p>Hat er so das überall ungläubig gewordene Volk um sich versammelt, so wird er, von ihnen aufgefordert, daran gehen, die Heiligen zu verfolgen, die da ihre Feinde und Gegner sind, wie der Apostel und Evangelist sagt: „Ein Richter war in einer Stadt, der Gott nicht fürchtete und die Menschen nicht scheute. Eine Wittwe aber war in jener Stadt, und diese kam zu ihm heran und sagte: Hilf mir zum Rechte von Seite meines Widersachers! Und er wollte eine Zeitlang nicht. Nachher aber sprach er bei sich: Wenn ich auch Gott nicht fürchte und Menschen nicht scheue, werde ich doch, weil diese Wittwe mir überlästig ist, ihr zum Rechte helfen.“</p><p>Unter dem ungerechten Richter, der weder Gott fürchtet noch Menschen scheuet, versteht er unzweifelhaft den Antichrist, den Sohn des Teufels und das Rüstzeug des Satans; denn er wird damit zu regieren anfangen, daß er sich wider Gott erhebt, indem er weder wahrhaft Gott fürchtet noch den Sohn Gottes, den Richter über Alles, scheuet. Mit der Wittwe aber in der Stadt bezeichnet er Jerusalem, welches in der That eine Wittwe ist, verlassen von Gott, dem himmlischen Bräutigam. Diesen nennt es seinen Widersacher und nicht seinen Erlöser, indem es nicht versteht, was von dem Propheten Jeremias gesagt worden ist: „Dafür, daß sie der Wahrheit nicht geglaubt haben, wird diesem Volke und Jerusalem reden der Geist des Irrthums.“ In ähnlicher Weise auch Isaias: „Dafür, daß verschmäht hat dieses Volk die Wasser von Siloe, welche stille dahin gehen, und sich auserwählt hat den Rasin und den Sohn des Romelias; dafür, siehe, wird herausführen über sie der Herr Wasser des Stromes, die gewaltigen und vielen, den König der Assyrer.“ Unter dem Symbol des Königs versteht er den Antichrist, wie auch ein anderer Prophet sagt: „Und er wird mein Friede sein, wenn kam der Assyrer in unser Land, und wenn er eindrang in unsere Berge.“</p><p>In ähnlicher Weise sagt auch Moses, der voraussah, das Volk werde den wahren Erlöser der Welt verstoßen und verwerfen, dem Irrthum sich ergeben und einen irdischen König wählen, den himmlischen aber absetzen: „Ist Dieses nicht bei mir beschlossen und besiegelt in meinen Schätzen?... ich will euch vergelten seiner Zeit, so daß erbeben ihre Füße.“ In Allem haben sie getäuscht, in keiner Sache sind sie in Übereinstimmung mit der Wahrheit gefunden worden: nicht in den Gesetzen, die sie übertreten haben, nicht in den Propheten, da sie die Propheten sogar getödtet haben, nicht in der Verkündigung des Evangeliums, da sie den Erlöser selbst gekreuzigt haben. Auch den Aposteln sind sie nicht gefolgt, vielmehr verfolgten sie dieselben. Überhaupt waren sie Verfolger und Verräther der Wahrheit und wurden als Gottes-Hasser und nicht als Gottes-Freunde befunden, so oft sich Gelegenheit darbot. Aufgebracht gegen die Diener Gottes, rühmten sie sich, durch einen Sterblichen Befreiung zu erlangen. Dieser von ihnen aufgestachelt, fängt an, Anklageschriften gegen die Heiligen auszusenden und sie allüberall zu tödten, da sie ihn nicht ehren und wie Gott anbeten wollen, wie Isaias sagt: „Wehe dem Lande mit den Flügeln der Schiffe, jenseits der Ströme Äthiopiens. Er sendet in das Meer Geiseln und Briefe auf Papyrus über das Wasser; auch leichte Boten werden gehen zu dem unstäten Geschlechte, dem fremden und gegen sich selbst grausamen Volke, zu dem hoffnungslosen und zertretenen Geschlechte.“</p><p>Wir nun, die wir auf den Sohn Gottes hoffen, werden verfolgt und zertreten von den Ungläubigen. Die Flügel jener Schiffe nämlich sind die Kirchen, das Meer ist die Welt, in welcher die Kirche wie ein Schiff auf dem Meere umhergeworfen, aber nicht vernichtet wird, denn sie hat bei sich den erfahrenen Steuermann Christus. In ihrer Mitte führt sie das Banner gegen den Tod, da sie das Kreuz des Herrn mit sich trägt. Des Schiffes Vordertheil ist der Orient, das Hintertheil der Occident, der Bauch der Süden; die Steuerruder sind die beiden Testamente, die ausgespannten Taue die Liebe Christi, welche die Kirche an sich zieht. Das Segel, welches sie mit sich führt, ist das Bad der Wiedergeburt, welches die Gläubigen erneuert, daher der immer gleiche Glanz. Die Stelle des Windes vertritt der Geist vom Himmel, durch welchen die Gläubigen für Gott besiegelt werden. Zugleich folgen ihm eiserne Anker, das sind die Gebote Christi, stark wie Eisen. Auch hat es Ruderer zur Rechten und Linken, das sind die sie begleitenden heiligen Engel, durch welche die Kirche gestärkt und beschützt wird. Die Leiter, welche oben auf den Mastbaum führt, ist die Nachahmung des erlösenden Leidens Christi, welches die Gläubigen zieht, um in den Himmel einzugehen. Die oben an dem Maste angebrachten Abzeichen sind die Reihe der Propheten, Martyrer und Apostel, die im Reiche Christi ausruhen.</p><p>Über die Bedrängniß der Verfolgung, welche der Widersacher über die Kirche bringen wird, sagt auch Johannes: „Und ein großes Zeichen erschien am Himmel: Ein Weib, umkleidet mit der Sonne und der Mond unter ihren Füßen und auf ihrem Haupte eine Krone von zwölf Sternen und gesegneten Leibes schrie sie in Wehen und war in Pein, zu gebären … und der Drache stund vor dem Weibe, welches gebären sollte, damit, sobald sie geboren, er ihr Kind verschlinge. Und sie gebar einen Sohn, einen mannhaften, der da lenken soll alle Völker... und entrückt war ihr Kind zu Gott, und dessen Thron und das Weib floh in die Wüste, wo es eine Stätte hatte bereitet von Gott, damit sie es dort nähre tausend zweihundert und sechzig Tage …. Und da gesehen der Drache, daß er geworfen wurde auf die Erde, verfolgte er das Weib, welches den Knaben geboren hatte. Und dem Weibe wurden gegeben zwei Flügel des großen Adlers, damit es fliege in die Wüste, wo es genährt wird eine Zeit und Zeiten und die Hälfte einer Zeit, fort aus dem Angesichte der Schlange. Und die Schlange warf aus ihrem Munde hinter dem Weibe her Wasser wie einen Strom, daß er es fortschwemmen lasse von dem Strome. Und die Erde half dem Weibe, und auf that die Erde ihren Mund und verschluckte den Strom, welchen der Drache geworfen hatte aus seinem Munde. Und der Drache ergrimmte über das Weib, um Krieg zu führen mit den Übrigen ihrer Nachkommenschaft, die da halten die Gebote Gottes und das Zeugniß Jesu haben.“</p><p>In dem Weibe, umkleidet mit der Sonne, hat er sehr deutlich die Kirche bezeichnet, welche den Logos des Vaters angezogen hat, dessen Glanz die Sonne überstrahlt. Der Mond unter ihren Füßen will sagen, sie sei wie der Mond mit himmlischem Glanze geschmückt. Sagt er: „auf ihrem Haupte eine Krone von zwölf Sternen,“ so bezeichnet er damit die zwölf Apostel, durch welche die Kirche gegründet worden … Und „gesegneten Leibes schrie sie in Wehen und war in Pein zu gebären“ soll heißen: die Kirche wird nicht aufhören, den Logos, der in der Welt von den Ungläubigen verfolgt wird, aus dem Herzen zu gebären. „Und sie gebar,“ sagt er ferner, „einen Sohn, einen mannhaften, der da lenken soll alle Völker,“ d. i. den mannhaften vollkommenen Christus, den Sohn Gottes, Gott und Mensch genannt, den die Kirche immer gebiert, indem sie alle Völker lehrt. Damit aber, daß er sagt: „Entrückt war ihr Kind zu Gott und dessen Thron,“ deutet er an, daß es ein himmlischer und kein irdischer König ist, der aus ihr immer geboren wird. Dasselbe hat auch David vorherverkündigt, indem er sagt: „Der Herr sprach zu meinem Herrn: Setze dich zu meiner Rechten, bis ich lege deine Feinde als Schemel deiner Füße.“ „Und da gesehen der Drache, daß er geworfen auf die Erde, verfolgte er das Weib. Und dem Weibe wurden gegeben zwei Flügel des großen Adlers, damit es fliege in die Wüste, wo es genährt wird eine Zeit, Zeiten und die Hälfte einer Zeit, fort aus dem Angesicht der Schlange“ sagt er ferner. Dieses sind die tausend zweihundert und sechzig Tage, die Hälfte der Woche, in denen der Tyrann herrschen und die Kirche verfolgen wird, während sie von Stadt zu Stadt flieht, sich in der Wüste, in den Bergen verbirgt und ihr nichts Anderes geblieben ist als die beiden Flügel des großen Adlers, d. i. der Glauben an Jesus Christus, der seine heiligen Hände am heiligen Holze ausstreckend gleichsam zwei Flügel ausspannte, den rechten und linken, und Alle, die an ihn glauben, zu sich ruft und sie beschützt, wie ein Vogel seine Jungen. Denn also redet er durch Malachias: „Aber euch, die ihr fürchtet meinen Namen, gehet eine Sonne der Gerechtigkeit auf und Genesung an ihren Flügeln.“</p><p>Der Herr sagt aber auch ferner: „Wenn ihr nun gesehen habt den Greuel der Verwüstung,... stehend an heiliger Stätte, wer liest, merke es; — dann sollen die, welche in Judäa sind, sich flüchten in die Gebirge. Und wer auf dem Dache ist, steige nicht herab, um Etwas zu holen aus seinem Hause. Und wer auf dem Felde ist, kehre nicht heim, um sein Oberkleid zu holen. Wehe aber den Schwangern und Säugenden in jenen Tagen.... Denn es wird dann eine große Bedrängniß sein, dergleichen vom Anfang der Welt bis jetzt nicht gewesen ist … Und wenn nicht abgekürzt worden wären diese Tage, nicht was je Fleisch ist, würde gerettet werden.“ Daniel aber sagt: „Und sie werden geben Gräuel der Verwüstung tausend zweihundert neunzig Tage. Glückselig, wer harret und gelangt bis auf tausend zweihundert fünf und neunzig Tage.“</p><p>Auch sagt der selige Apostel Paulus im Briefe an die Thessalonicenser: „Wir bitten euch aber, Brüder, bei der Ankunft unseres Herrn Jesus Christus und unserer Einversammlung zu ihm, nicht sogleich aus eurer Fassung gebracht und eingeschüchtert zu werden, weder durch Geisteseingebung, noch auch durch Wort oder Brief, als wäre er von uns (geschickt), — wie wenn schon dastehe der Tag des Herrn. Niemand täusche euch in irgend welcher Weise; weil, wenn nicht gekommen ist der Abfall vorher und sich geoffenbart hat der Mensch der Sünde, der Sohn des Verderbens, der Widersacher und der sich erhebt über Alles, was Gott genannt wird oder Anbetungsgegenstand ist, so daß er in den Tempel Gottes sich setzt, sich erzeigend, daß er Gott sei. — Entsinnt ihr euch nicht, daß, als ich noch bei euch war, ich Dieß euch sagte? — Und jetzt wisset ihr, was aufhält, daß er geoffenbart wird zu seiner Zeit. Denn das Geheimniß der Ruchlosigkeit ist bereits wirksam, und daß der jetzt Aufhaltende aufhält, bis er aus der Mitte geschafft wird. Und dann wird geoffenbart werden der Ruchlose, welchen der Herr Jesus vernichten wird mit dem Hauche seines Mundes und abthun wird durch die Klarheit seiner Ankunft — ihn, dessen Ankunft ist gemäß der Wirksamkeit des Satans in aller Kraft und in Zeichen und Wundern der Lüge und in jeglichem Truge des Unrechts für die, welche verloren gehen dafür, daß sie die Liebe zur Wahrheit nicht angenommen haben, um gerettet zu werden. Deßhalb wird Gott ihnen schicken ein Wirken des Truges, damit sie der Lüge glauben, auf daß gerichtet werden Alle, welche nicht der Wahrheit geglaubt, sondern Gefallen gehabt haben an der Ungerechtigkeit.“ Isaias sagt aber: „Fortgenommen soll werden der Gottlose, damit er die Herrlichkeit des Herrn nicht sieht.“</p><p>Wenn Dieses geschieht, Geliebter, die eine Woche in zwei Theile getheilt ist und der Greuel der Verwüstung dann erschienen ist und die beiden Propheten und Vorläufer des Herrn ihren Lauf vollendet haben und die ganze Welt zu Ende geht, was wird dann noch übrig sein als die Erscheinung des Herrn und Gottes unseres Erlösers Jesus Christus vom Himmel, auf den wir gehofft haben, und der die Verbrennung und das gerechte Gericht über Alle verhängen wird, die ihm nicht gefolgt sind? Denn der Herr sagt: „Während aber Dieses anfängt zu geschehen, richtet Euch auf und erhebet eure Häupter, weil euere Erlösung nahe ist.“ „Doch nicht ein Haar von euren Häuptern wird verloren gehen.“ „Denn wie der Blitz ausgehet vom Anfang und hinleuchtet bis zum Niedergange, so wird auch sein die Wiederkunft des Sohnes des Menschen. Wo immer der Leichnam ist, dort versammeln sich (auch) die Adler.“ Ein Leichnam aber war im Paradiese, als dort Adam fiel. Ferner sagt er: „Und er wird aussenden seine Engel, und sie werden seine Auserwählten sammeln von den vier Winden her.“ Auch David verkündigt das Gericht und die Erscheinung des Herrn vorher, indem er sagt: „Von einem Himmelsende geht sie aus und läuft hin bis zu seinem andern Ende; Nichts ist, was sich vor ihrer Gluth verbergen könnte.“ Gluth nennt er den Weltbrand. So auch Isaias: „Gehe, mein Volk, tritt in deine Gemächer, schließe ab deine Thür hinter dir; verbirg dich wie auf kurzen Augenblick, bis vorübergeht der Grimm (des Herrn);“ ebenso Paulus: „Denn geoffenbart wird Gottes Zorn vom Himmel über jegliche Gottlosigkeit und Ungerechtigkeit von Menschen, welche die Wahrheit Gottes in Ungerechtigkeit niederhalten.“</p><p>Über die Auferstehung und Herrschaft der Heiligen sagt Daniel: „Und Viele von denen, welche schlafen im Staube der Erde, werden erwachen: die Einen zum ewigen Leben, und die Andern zur Schande, die immerdar zu schauen ist.“ Auch sagt Isaias: „Erstehen werden die Todten und aufwachen, die in den Gräbern sind, weil der Thau von dir ihnen Heilung ist.“ Der Herr sagt: „Die Todten werden die Stimme des Sohnes Gottes hören, und die, welche sie hören, werden leben.“ Der Prophet sagt: „Wache auf, der du schläfst, und erstehe von den Todten, und zuleuchten wird dir Christus.“ Auch Johannes: „Selig und heilig, wer Theil hat an der ersten Auferstehung, über diese hat der zweite Tod nicht Gewalt.“ Der zweite Tod nämlich ist der Pfuhl des brennenden Feuers. Und wiederum sagt der Herr: „Dann werden die Gerechten aufleuchten wie die Sonne in ihrer Klarheit.“ Und zu den Heiligen wird er sagen: „Kommet, Gesegnete meines Vaters, nehmet zum Erbe das Reich, welches euch bereitet ist von Grundlegung der Welt an.“ Aber was wird er zu den Gottlosen sagen? „Weichet von mir, ihr Verfluchten, in das ewige Feuer, welches bereitet ist dem Teufel und seinen Engeln, welches mein Vater bereitet hat.“ Johannes aber sagt: „Draußen die Hunde und die Zauberer, und die Buhler und die Mörder und die Götzendiener und Jeder, welcher Trug liebt und thut, denn euer Theil ist im Pfuhle des Feuers.“ Ähnlich sagt auch Isaias: „Und sie werden hinausgehen und schauen auf die Leichname der Männer, welche abtrünnig geworden von mir; ihr Wurm wird nicht ersterben und ihr Feuer nicht erlöschen, und sie werden sein ein Abscheu allem Fleisch.“</p><p>Der Apostel Paulus schreibt aber über die Auferstehung der Todten an die Thessalonicenser: „Wir wollen aber nicht, daß ihr in Unkunde seiet, Brüder, über die Entschlafenen, damit ihr nicht trauert wie auch die Übrigen, welche nicht Hoffnung haben. Denn wenn wir glauben, daß Jesus gestorben ist und auferstanden, so wird auch Gott, die so da entschlafen sind, durch Jesus herbeiführen mit ihm. Denn Dieses sagen wir euch in einem Worte des Herrn, daß wir, die Lebenden, die wir übrig gelassen werden bis zur Ankunft des Herrn, nicht vorauskommen werden den Entschlafenen; denn er selbst der Herr, — bei dem Zurufe und bei der Stimme eines Erzengels und bei Gottes Posaune wird er herabsteigen von dem Himmel, und die Todten in Christus werden zuerst auferstehen. Dann werden wir, die Lebenden, die wir übrig gelassen sind, zugleich mit ihnen fortgenommen werden in Wolken entgegen Christo in die Luft und werden so immerdar sein mit dem Herrn.“</p><p>Dieses habe ich, aus der Schrift schöpfend, für dich kurz zusammengestellt, damit du das Geschriebene gläubig bewahrend und das Zukünftige vorhersehend dich tadellos vor Gott und den Menschen erhaltest in Erwartung der seligen Hoffnung und Erscheinung unseres Gottes und Erlösers, bei welcher er unsere Heiligen erwecken und sich mit ihnen freuen wird, den Vater preisend. Ihm sei Preis von Ewigkeit zu Ewigkeit. Amen.</p>
