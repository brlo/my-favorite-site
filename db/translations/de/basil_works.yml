    body: |-
      <p><em>Homilien über das Hexaemeron, übersetzt von der BKV-Ausgabe (Bibliothek der Kirchenväter, 1. Reihe, Bd. 47, Kempten/München 1925).</em></p><h2>1</h2><p><em>„Im Anfange schuf Gott den Himmel und die Erde</em>.”</p><p><em>Inhalt: Angabe des Themas (Weltschöpfung) - Notwendigkeit einer entsprechenden Disposition auf Seiten des Hörers - Glaubwürdigkeit des Hagiographen Moses (c. 1). Die Schöpfung im Urteil der Heiden - nach dem Berichte Mosis (ein Werk Gottes) (c. 2). Die Welt nicht ewig, sondern veränderlich und vergänglich (c. 3). Darüber spottende Philosophen gewärtigen ein furchtbares Gericht (c. 4). Erst eine unsichtbare, dann die sichtbare Welt als Lehrstätte für Menschen und Wohnstätte für alle Kreatur - geworden in und mit der Zeit. Begriff der „Zeit” (c. 5). Der Begriff „Anfang” (ὰϱχἡ) = Prinzip der Ordnung und des Zwecks, nicht = Zeitteil (c. 6). Die Welt eigentliches Werk, und zwar Kunstwerk Gottes. - „Himmel und Erde” schließen in sich alle Elemente und Stoffe (c. 7). Die Substanz des Himmels nach Isaias. - Substanz und Substrat der Erde umstritten, eigentlich undiskutierbar; jedenfalls ruht sie in Gottes Hand (c. 8-9). Der geozentrische Standpunkt hypothetisch (c. 10). Widersprechende Mutmaßungen der Philosophen über die Substanz des Himmels - keine beweisbar. Besser, Moses zu glauben und den Schöpfer zu preisen (c. 11).</em></p><p>Ein passender Anfang, wenn der, welcher über die Entstehung der Welt sich verbreiten soll, seine Rede beginnt mit einem Anfange (= Prinzip), auf den die Ordnung der sichtbaren Welt zurückgeht. Denn die Erschaffung von Himmel und Erde soll erzählt werden nicht als ein von selbst erfolgter Vorgang, wie manche sich einbildeten, sondern als ein Werk, das in Gott seine Ursache hat. Welches Ohr wäre würdig, etwas so Großes anzuhören? Wie muß die Seele vorbereitet sein, die herantreten will, um so erhabene Dinge zu vernehmen! Frei von den sinnlichen Leidenschaften, frei von den finstern Sorgen des Lebens, arbeitsfroh, spekulativ veranlagt, überall Umschau haltend, wo sie irgendwo eine würdige Gotteserkenntnis gewinnen könnte.</p><p>Doch bevor wir den Sinn der Worte genau untersuchen und nachforschen, was alles mit den wenigen Worten gesagt sein will, wollen wir erwägen, <em>wer</em> es ist, der zu uns redet. Denn wenn wir auch schuld der Unzulänglichkeit unseres Verstandes den Tiefsinn des Schriftstellers nicht erreichen, so werden wir doch bauend auf die Glaubwürdigkeit des Erzählers von selbst so weit kommen, daß wir seinen Worten zustimmen. <em>Moses</em> nämlich ist es, der diesen Bericht verfaßt hat, jener Moses, der laut Bezeugung schon als Säugling „bei Gott angenehm” war, den die Tochter Pharaos an Kindes Statt angenommen, den sie königlich erzogen, für den sie die ägyptischen Weisen zu Lehrern und Erziehern bestellt hat, der aus Haß gegen den Druck der Tyrannen zur Niedrigkeit seiner Stammesgenossen zurückgekehrt ist und „lieber mit dem Volke Gottes Ungemach ertragen, als einen augenblicklichen Genuß von der Sünde haben wollte”, der schon aus angeborner Gerechtigkeitsliebe, noch ehe er mit der Führung des Volkes betraut war, und aus natürlichem Haß (gegen die Bosheit) die Missetäter bekanntlich bis auf den Tod verfolgte, der von denen, die er mit Wohltaten überhäuft hatte, vertrieben, freudig die tobenden Ägypter verließ und sich nach Äthiopien begab, wo er, frei von allen sonstigen Beschäftigungen, volle vierzig Jahre der Betrachtung der Dinge oblag, der in einem Alter von achtzig Jahren Gott schaute, soweit ein Mensch ihn zu schauen vermag, ja so schaute, wie es keinem andern je beschieden war - nach dem Zeugnisse Gottes selbst, das lautet: „Ist unter euch ein Prophet des Herrn, so werde ich in einem <em>Gesichte</em> mich ihm offenbaren und im <em>Traume</em> zu ihm reden. Nicht so ist es aber bei meinem Knechte Moses, der mir der Vertrauteste ist im ganzen Hause: Von Mund zu Mund rede ich mit ihm, offenbar und nicht in Rätseln.” Dieser (Moses) also, der gleich den Engeln der unmittelbaren Anschauung Gottes gewürdigt worden, erzählt uns, was er von Gott vernommen hat. So wollen wir denn aufhorchen den Worten der Wahrheit, die „nicht in der Überredungskunst menschlicher Weisheit”, sondern in der Lehrweise des Geistes gesprochen sind, und deren Zweck nicht das Lob seitens der Zuhörer ist, sondern das Heil derer, die belehrt werden.</p><p>„Im Anfange schuf Gott den Himmel und die Erde.” - Mir will die Zunge stocken vor Staunen ob dem Gedanken. Wovon soll ich zuerst sprechen? Womit meine Ausführungen beginnen? Soll ich die Hohlheit der Außenstehenden nachweisen oder unsere Wahrheit preisen? Die griechischen Philosophen haben viel mit der Natur sich beschäftigt. Doch stand bei ihnen auch nicht <em>eine</em> Ansicht unumstößlich und unerschütterlich fest; vielmehr stieß immer wieder eine zweite Ansicht die erste um. Daher macht es uns keine Mühe, ihre Meinungen zu widerlegen; sie genügen einander selbst zu gegenseitiger Widerlegung. Da sie von Gott nichts wußten, wollten sie die Entstehung des Universums nicht von einer vernünftigen Ursache herleiten, sondern ließen sich entsprechend ihrer fundamentalen Unwissenheit zu (irrigen) Schlußfolgerungen verleiten. So nahmen die einen zu materiellen Prinzipien ihre Zuflucht und verlegten die Ursache von allem Sein in die Elemente der Welt. Die andern bildeten sich ein, Atome und unteilbare Körper, Stoffmassen und Bewegungen begründen die Natur der sichtbaren Welt: Je nachdem die unteilbaren Körper bald miteinander zusammenkommen, bald einander ausscheiden, komme es zu Neubildungen und Vernichtungen, und die stärkere Verflechtung der Atome begründe die Haltbarkeit der dauerhafteren Körper. Wahrhaftig, die so etwas schreiben, weben ein Spinnengewebe, da sie für Himmel, Erde und Meer so schwache und unhaltbare Anfänge annehmen. Sie wußten ja nicht zu sagen: „Im Anfange schuf Gott den Himmel und die Erde.” So gaben sie in ihrem Atheismus sich der Täuschung hin, das Universum sei steuer- und ordnungslos, sei dem blinden Zufall überlassen.</p><p>Damit es uns nicht ebenso ergehe, hat der, welcher die Weltschöpfung beschreibt, gleich in den ersten Worten mit dem Namen Gottes unsern Verstand erleuchtet, indem er sagte: „Im Anfange schuf Gott.” Wie trefflich die Reihenfolge! „Anfang” stellt er voran, damit nicht der eine und andere die Welt anfangslos wähne. Dann setzte er das „schuf” hinzu, um zu zeigen, daß die Schöpfung nur ein sehr kleiner Teil der Macht des Schöpfers ist. Denn wie der Töpfer mit derselben Kunst tausend und abertausend Gefäße anfertigt, ohne seine Kunst und Kraft zu erschöpfen, so hat auch der Schöpfer dieses Universums eine nicht auf <em>eine</em> Welt beschränkte, sondern ins Unendliche reichende Schöpferkraft, kraft der er nur mit dem Winke seines Willens die sichtbare Welt in ihrer Größe ins Dasein gerufen hat. Hat also die Welt einen Anfang, und ist sie geschaffen worden, so forsche nach, wer ihr den Anfang gegeben, und wer ihr Schöpfer ist! Doch nein, damit du nicht beim Nachforschen durch menschliche Vernunftschlüsse dich von der Wahrheit abbringen lassest, ist uns Moses mit seiner Belehrung zuvorgekommen und hat unsern Seelen gleichsam als Siegel und Schutzwehr den verehrungswürdigsten Namen Gottes eingeprägt mit den Worten: „Im Anfange schuf Gott.” Das selige Wesen, die unerschöpfliche Güte, der Gegenstand der Liebe für alle vernunftbegabte Kreatur, die heißersehnte Schönheit, der Anfang der Dinge, der Quell des Lebens, das Licht des Geistes, die unbegreifliche Weisheit - ist Er, der im Anfange schuf den Himmel und die Erde.</p><p>Denk dir also, o Mensch, die sichtbare Welt nicht anfangslos, und wenn die Körper am Himmel im Kreise sich drehen, des Kreises Anfang aber unserem Wahrnehmungsvermögen nicht leicht erkenntlich ist, so halte doch die Natur der kreisenden Körper nicht für anfangslos! Dieser Kreis, eine ebene, von nur <em>einer</em> Linie umschriebene Figur, verschließt sich zwar unserer Erkenntnis, und wir vermögen nicht ausfindig zu machen, wo er begonnen und wo er geschlossen; gleichwohl dürfen wir ihn nicht deshalb schon für anfangslos halten. Im Gegenteil: Wenn er auch unserer Erkenntnis sich verschließt, in Wahrheit ist er jedenfalls von einem ausgegangen, der ihn von einem Mittelpunkte aus in einem gewissen Abstande umschrieben hat. So darfst du auch nicht deshalb, weil die im Kreise sich bewegenden Körper auf ihre eigene Bahn einlenken - eben wegen ihrer gleichmäßigen, ununterbrochen fortlaufenden Bewegung - auf den Irrtum von einer anfangs- und endlosen Weltverfallen. „Denn die Gestalt dieser Welt vergeht”, und „Himmel und Erde werden vergehen”. Eine Ankündigung der Lehrsätze vom Ende und der Veränderung der Welt ist also das, was hier kurz in der Einleitung des göttlich inspirierten Unterrichtes gelehrt wird: „Im Anfange schuf Gott.” Alles, was mit der Zeit begonnen hat, muß ganz notwendig auch mit der Zeit vergehen. Hat etwas einen zeitlichen Anfang, dann zweifle nicht an seinem Ende! Die geometrischen und mathematischen Berechnungen, die Untersuchungen über die festen Körper und die vielgepriesene Astronomie, die vielgeschäftige Zeitvergeudung, wohin führen sie denn, wenn doch die, welche sich damit abgaben, auf den Gedanken kamen, diese sichtbare Welt sei gleichewig mit Gott, dem Schöpfer des Universums, und der begrenzten, körperlich-materiellen Welt dieselbe Ehre erwiesen wie der unbegreiflichen und unsichtbaren Natur, und nicht so viel einzusehen vermochten, daß auch das Ganze von dem, dessen Teile einer Vernichtung und Veränderung unterliegen, notwendig einmal dasselbe Schicksal erleiden muß wie seine Teile? Nein, so weit „trieben sie die Eitelkeit in ihren Gedanken, und ward verfinstert ihr unverständiges Herz, und wurden zu Toren, indes sie sich für Weise ausgaben”, daß die einen es offen aussprachen, der Himmel existiere von Ewigkeit her mit Gott, und die andern erklärten, der Himmel sei Gott, ohne Anfang und ohne Ende, und die Ursache für die Gestaltung der Einzeldinge.</p><p>Fürwahr, ihnen wird ihr Überschuß an Weltweisheit einmal eine Verschärfung ihrer schrecklichen Verdammung eintragen, weil sie in nichtigen Fragen so scharf sahen, der Erkenntnis der Wahrheit aber absichtlich blind gegenüberstanden. Sie, die die Entfernungen der Sterne bemessen und die ihnen immer sichtbaren Sterne des Nordens beschreiben sowie auch alle, die um den Südpol liegen und den dortigen Bewohnern sichtbar, uns aber unbekannt sind, die die nördliche Breite und den Tierkreis in unzählige Grade einteilen, die Deklinationen, die Ruhepunkte und Aberrationen der Gestirne sowie deren Aufeinanderfolge genau beobachteten und den periodischen Kreislauf eines jeden Planeten berechneten, - auf die einzige aller Künste kamen sie nicht, Gott als den Schöpfer des Weltalls zu erkennen und als den gerechten Richter, der jedem Leben die gerechte Vergeltung folgen läßt. Darauf kamen sie nicht, aus der Lehre vom <em>Endgerichte</em> den folgerichtigen Schluß auf das Weltende zu ziehen und einzusehen, daß die Welt notwendig eine Verwandlung durchmachen muß, wenn der Zustand der Seelen in eine andere Lebensform übergehen soll. Wie nämlich das gegenwärtige Leben eine dieser Welt gleichartige Natur hat, so wird auch das künftige Leben unserer Seelen ein ihrem Zustande entsprechendes Los erlangen. Doch weit entfernt, mit dieser Wahrheit sich zu befassen, brechen sie vielmehr in ein schallendes Gelächter über uns aus, wenn wir vom Ende dieser Welt und einer Neugeburt, der Zeit reden. Weil aber naturgemäß der Anfang vor dem Ende kommt, so mußte er (Moses) bei der Rede von den in der Zeit gewordenen Dingen zuallererst das Wort vorausschicken: „Im Anfange schuf.”</p><p>Es existierte doch etwas, wie es scheint, auch vor dieser Welt, was wohl unserer Logik erkennbar, aber, als für Anfänger und geistig Unmündige nicht geeignet, unerwähnt geblieben ist. Es gab einen Zustand vor Erschaffung der Welt, der den überweltlichen Kräften entsprach, der überzeitlich, zeitlos, ewig. In diesem Zustande hat aber der Schöpfer und Werkmeister des Universums Dinge geschaffen, ein geistiges Licht, entsprechend der Seligkeit derer, die den Herrn lieben, die vernunftbegabten, unsichtbaren Naturen, sowie die ganze Ordnung der vernünftigen Welt, was alles unser Erkennen übersteigt, Dinge, für die wir nicht einmal eine Benennung zu finden vermögen. Diese machen die unsichtbare Welt aus, wie uns Paulus belehrt mit den Worten: „Denn in ihm ist alles erschaffen, das Sichtbare, und das Unsichtbare, Throne und Herrschaften, Fürstentümer und Gewalten”, die Heerscharen der Engel wie die Ämter der Erzengel. - Dann mußte auch noch diese (sichtbare) Welt zum Bestehenden hinzugefügt werden, vornehmlich als Lehr- und Erziehungsstätte für die Menschenseelen, sodann aber auch überhaupt als Aufenthalt für alles, was entsteht und vergeht. Naturgemäß kam so mit der Welt und den Tieren und Pflanzen auf ihr der Lauf der Zeit, die immer neu kommt und vergeht und nie ihren Lauf unterbricht. Oder ist die Zeit nicht so, daß ihre Vergangenheit verschwunden, ihre Zukunft noch nicht da ist, die Gegenwart aber unsern Sinnen enteilt, ehe man sie recht gewahr wird? Das ist aber auch die Natur alles Werdenden: jedenfalls nimmt sie zu oder ab und hat somit weder Bestand noch Dauer. So lag es also in der Natur der Tier- und Pflanzenwelt, daß sie notwendig gleichsam an eine Strömung gefesselt und einer Bewegung unterworfen ist, die zum Werden oder Vergehen forttreibt, umfangen von der Natur der Zeit, die, den wandelbaren Dingen verwandt, dieselbe Eigentümlichkeit besitzt. Daher hub der, der uns weise über die Entstehung der Welt belehrt, mit den Worten an: „Im Anfange schuf”, d. h. in jenem Anfange der Zeit. Nicht um das höhere Alter der Welt allen gewordenen Dingen gegenüber zu bezeugen, sagt er, sie sei im Anfange geworden, sondern er erzählt, diese sichtbaren und sinnfälligen Dinge hätten <em>nach</em> den unsichtbaren und geistigen zu existieren angefangen. Es wird ja auch jede erste Bewegung „Anfang” genannt, z. B.: „Der Anfang eines guten Wandels ist, Gerechtigkeit zu üben.” Denn mit den gerechten Handlungen nehmen wir den ersten Anlauf zu einem seligen Leben. Ferner heißt auch Anfang, woraus etwas entsteht, insofern nämlich etwas anderes in ihm ist, wie beim Hause das Fundament, beim Schiffe der Kiel. So heißt es doch auch: „Die Furcht des Herrn ist der Anfang der Weisheit.” Die Frömmigkeit ist ja gleichsam das Fundament und die Grundlage zur Vollkommenheit. Es ist aber auch die Kunst der Anfang für Kunstwerke, wie die Weisheit Beseleels der Anfang zur Ausschmückung des Zeltes war. Oft ist der Anfang von Handlungen auch im ersprießlichen Ende des Geschehens zu suchen: So ist die Huld Gottes Anfang der Almosenspende, und einer jeden guten Handlung Anfang ist das Ende, das in den Verheißungen niedergelegt ist.</p><p>Da nun „Anfang” so mannigfach gebraucht wird, so untersuche, ob nicht hier der Ausdruck zu allen Bedeutungen paßt! Du kannst ja wohl auch darauf kommen, in welcher Zeit die Gestaltung dieser Welt begonnen hat; du darfst ja nur von der Gegenwart auf die Vergangenheit zurückgehen und dich ernstlich bemühen, den ersten Tag des Weltursprungs zu finden. So wirst du finden, woher die Zeit die erste Bewegung hat, ferner, daß Himmel und Erde gleichsam als Fundamente und Grundlagen der Welt zuerst gegründet worden, dann, daß es eine künstlerische Vernunft war, die, wie das Wort „Anfang” dir andeutet, in die sichtbare Welt die Ordnung brachte. Auch wirst du einsehen, daß die Welt nicht plan- und sinnlos, sondern zu einem schönen Zwecke und allen Wesen zum großen Nutzen erdacht worden ist, wenn anders sie ja für vernünftige Seelen in Wahrheit eine Schule und Erziehungsanstalt zur Gotteserkenntnis sein soll - eben dadurch, daß sie durch die sichtbaren und sinnfälligen Dinge die Vernunft zur Betrachtung der unsichtbaren hinleitet, wie der Apostel sagt: „Das Unsichtbare an ihm wird seit Erschaffung der Welt aus seinen Werken erkannt und geschaut.” Oder vielleicht ist deshalb, weil das Werk momentan und zeitlos entstanden ist, gesagt: „Im Anfange schuf”; ist doch der Anfang etwas Unteilbares und Untrennbares. Wie der Anfang des Weges noch nicht der Weg, und der Anfang des Hauses nicht das Haus ist, so ist auch der Anfang der Zeit noch nicht die Zeit selbst, ja nicht einmal ein kleinster Teil von ihr. Sollte jemand das bestreiten und sagen, der Anfang sei die Zeit selbst, so soll er wissen, daß er ihn in Zeitteile zu zerlegen hat. Diese sind aber Anfang, Mitte und Ende. Einen Anfang vom Anfange ausklügeln, ist aber über alle Maßen lächerlich. Wer den Anfang in zwei Teile teilt, der wird aus einem zwei oder vielmehr viele und unzählige machen, da ja das Geteilte immer wieder in neue Teile zerlegt werden kann. Um nun uns zu belehren, daß die Welt durch Gottes Willen in einem Simultanakte entstanden sei, heißt es: „Im Anfange schuf.” Andere Ausleger haben die Stelle, um den Sinn deutlicher zum Ausdruck zu bringen, so übersetzt: „Im Prinzip schuf Gott”, d. h. auf einmal und in einem Augenblick. Soviel also über den Anfang, um nur Weniges von Vielem zu sagen.</p><p>Es werden von den Künsten die einen poetische (schaffende), die andern praktische, wieder andere theoretische genannt. Der theoretischen Künste Zweck ist die Betätigung des Geistes, der praktischen die Bewegung des Körpers, bei deren Aufhören nichts mehr da ist, und es nichts mehr zum Leben gibt; das Ende des Tanzes und Flötenspieles ist nichts weiter als das Aufhören der Tätigkeit an sich. Hört aber bei den schaffenden Künsten die Tätigkeit auch auf, so ist doch das Werk da, so bei der Baukunst, Holzschneidekunst, Schmiedekunst und Webekunst und andern derartigen Künsten, die, auch wenn der Künstler nicht da ist, in sich schon die künstlerischen Gedanken genügend bekunden; du kannst den Baumeister, Metallarbeiter und Weber im Werke bewundern. Um nun die Welt, so wie sie allen sichtbar ist, als eine kunstvolle Schöpfung zu erweisen, die an sich die Weisheit ihres Schöpfers zu erkennen gibt, hat der weise Moses mit Bezug auf sie keine andere Wendung gebraucht als den Ausdruck: „Im Anfange <em>schuf</em>”, nicht „bewerkstelligte” oder „stellte her”, sondern „<em>schuf</em>”. Und weil viele in ihrem Wahne, die Welt existiere mit Gott von Ewigkeit her, nicht zugaben, daß sie von ihm erschaffen worden, vielmehr behaupteten, sie sei gleichsam als ein Schatten seiner Macht durch und von ihm selbst entstanden, und weil sie Gott wohl als ihren Urheber bekennen, aber als einen Urheber ohne Willen, so wie der Körper die Ursache des Schattens oder der leuchtende Gegenstand die des Scheines ist, um also diesen Irrtum zu berichtigen, bediente sich der Prophet der unzweideutigen Wendung: „Im Anfange schuf Gott.” Nicht irgendetwas war die Ursache für die Existenz der Welt, sondern <em>Gott</em> schuf in seiner Güte das Nützliche, in seiner Weisheit das Schönste, in seiner Macht das Größte. Und so offenbarte er sich dir als Künstler, der nicht nur in das Wesen aller Dinge eindrang, sondern auch die einzelnen Teile untereinander harmonisch verband und so das Ganze ihm entsprechend in Harmonie und Übereinstimmung brachte.</p><p>„Im Anfange schuf Gott <em>den Himmel und die Erde</em>.” Mit diesen zwei Enden bezeichnete er den Bestand des Ganzen, räumt aber dem Himmel die Priorität der Entstehung ein und läßt die Erde erst an zweiter Stelle erschaffen sein. Wenn aber zwischen diesen beiden etwas in der Mitte steht, so ist es sicher zugleich mit seinen Grenzen geschaffen worden. Wenn er also auch nichts von den Elementen, von Feuer, Wasser und Luft sagte, so wirst du doch bei einigem Nachdenken von selbst finden, daß anfänglich alles in allem vermengt war. In der Erde wirst du Wasser sowohl wie Luft und Feuer finden; aus Steinen springt ja Feuer hervor, und aus dem Stahl, selbst der Erde entstammt, pflegt bei Reibung Feuer in Menge hervorzusprühen. Auffallend ist auch, wie das Feuer in den Körpern steckt, ohne zu schaden, sobald es aber nach außen kommt, die Körper verzehrt, die es bislang verwahrten. Daß aber die Natur des Wassers in der Erde geborgen liegt, weisen die nach, die Brunnen graben, und daß Luft in ihr ist, verraten die Dünste, die aus der feuchten und von der Sonne erwärmten Erde aufsteigen. Weil sodann der Himmel von Natur den oberen Raum einnimmt, die Erde aber zuunterst liegt - das Leichte schwebt ja zum Himmel empor, indes das Schwere naturgemäß zur Erde niedersinkt -, und das Obere und Untere einander ganz entgegengesetzt sind, so hat der, welcher die naturgemäß im weitesten Abstand voneinander stehenden Welten erwähnt hat, damit auch den dazwischen liegenden Bereich miteinschließend genannt. Verlange daher nicht eine in die Teile gehende Aufzählung, sondern laß dir das Übergangene offenbaren aus dem, was mitgeteilt ist!</p><p>„Im Anfange schuf Gott den Himmel und die Erde.” Die Erforschung des Wesens der einzelnen Dinge, der intelligiblen wie der sinnenfälligen, würde zu einer langen und weitschweifigen Auseinandersetzung führen, so daß wir auf die Behandlung dieser Frage mehr Worte verwenden müßten als auf alle übrigen, die im einzelnen besprochen werden sollen. Zudem dürfte es auch nicht sonderlich zur Erbauung der Gläubigen dienen, sich dabei aufzuhalten. In der Frage nach der Wesenheit des Himmels können wir uns begnügen mit den Aussprüchen des Isaias, der uns in schlichten Worten eine hinlängliche Kenntnis von dessen Natur beibrachte, wenn er sagte: „Der den Himmel wie Rauch bildete”, d. h. der zur Bildung des Himmels einen dünnen, nicht einen festen oder dichten Stoff nahm. Auch hinsichtlich der Gestalt des Himmels genügt uns das, was er in einem Lobpreis auf Gott sagt: „Der den Himmel wie ein Gewölbe aufstellte.”</p><p>Ganz so sollen wir aber auch von der Erde denken und nicht lange nachgrübeln, worin denn eigentlich ihre Wesenheit bestehe, nicht mit der Untersuchung über das Substrat selbst uns grübelnd abmühen, auch nicht irgendeine Natur suchen wollen, die ohne Beschaffenheit und, an sich betrachtet, ohne Eigenschaft ist. Vielmehr sollen wir wissen, daß alles, was an ihr wahrgenommen wird, mit Rücksicht auf ihr Dasein angeordnet ist und zur Vollendung ihres Wesens dient. Denn, versuchst du es, ihre Eigenschaften bis auf die letzte wegzudemonstrieren, dann wirst du am Ende auf nichts kommen. Nimmst du die Schwärze, Kälte, Schwere, Dichtigkeit, ihre auf den Geschmack sich beziehenden Eigenschaften weg oder andere, die etwa sonst noch an ihr wahrgenommen werden, so wird kein Substrat mehr da sein. Das also heiße ich dich übergehen und nicht einmal darnach fragen, auf welcher Grundlage sie stehe. Eine solche Untersuchung wird nur verwirren, da das Vernünfteln doch zu keinem sichern Ergebnis führt. Denn sagst du, die Luft sei für die Erdfläche die Unterlage, so wirst du nicht begreifen, wie die weiche und absolut leere Luft ein solches Gewicht aushält und nicht vielmehr überallhin sich zerteilt, der auf ihr liegenden Last ausweicht und immer über die sie zusammenpressende sich ergießt. Nimmst du aber das Wasser als die Unterlage der Erde an, so wirst du auch in diesem Falle fragen, warum der schwere und dichte Körper nicht durch das Wasser dringe, sondern diese weit schwerere Last von der schwächeren Natur gehalten und getragen werde. Zudem mußt du auch für das Wasser selbst eine Unterlage suchen, und da wirst du wieder im Unklaren sein, auf welcher festen und tragfähigen Stütze der letzte Untergrund ruht.</p><p>Nimmst du aber an, ein anderer kompakterer Körper als die Erde verhüte das Versinken der Erde, so bedenke wohl, daß auch dieser einer gleichen Stütze bedarf, die ihn nicht in die Tiefe sinken läßt. Und wenn wir ihm eine Unterlage erdichten, so würde unser Verstand wieder nach deren Unterlage suchen, und wir werden uns so ins Unendliche verlieren und zu den gefundenen Unterlagen immer neue ersinnen. Und je weiter wir den Gedanken fortspinnen, eine desto größere Tragkraft müssen wir annehmen, damit sie der ganzen darüberliegenden Masse ein Widerlager böte. Setze daher deinem Denken Grenzen, damit nicht wegen deines Vorwitzes, das Unerforschliche zu ergründen, dich der Ausspruch Jobs strafe und du von ihm gefragt werdest, „worauf ihre Kreise gefestigt seien”. Hast du aber einmal in den Psalmen gehört: „Ich habe festgestellt ihre Säulen”, so bedenke, daß unter „Säulen” die sie zusammenhaltende Kraft gemeint sein will. Was will ferner die Stelle: „Auf die Meere hat er sie gegründet”, anders besagen, als daß die Erde von allen Seiten von Wasser umflossen ist? Woher kommt es nun, daß das Wasser, das doch flüssig ist und von Natur abwärts fließt, in der Höhe bleibt und nirgends abfließt? Du bedenkst wohl nicht, daß die Erde, die frei in der Luft schwebt, obschon ihr spezifisches Gewicht schwerer ist, dem Verstande dieselbe oder noch größere Verlegenheit bringt. Doch, mögen wir zugeben, die Erde bestehe für sich selbst, oder mögen wir sagen, sie schwimme auf dem Wasser, auf keinen Fall dürfen wir von der frommen Meinung abweichen, vielmehr müssen wir bekennen, daß alles zugleich durch des Schöpfers Macht zusammengehalten wird. Wir müssen sowohl uns selbst als auch den Fragestellern, worauf diese ungeheure und unerträgliche Last der Erde gestützt sei, antworten: „In der Hand Gottes sind die Grenzen der Erde.” Das ist unser sicherster Weg zur Erkenntnis und den Hörern von Nutzen.</p><p>Schon wollen indes einige Naturforscher mit lautem Wortschwall behaupten, die Erde sei unbeweglich, und zwar aus etwa folgenden Gründen: Weil sie ja die Mitte der Welt einnehme und wegen ihres überall gleichen Abstandes von den äußersten Enden nach keiner Seite hin gravitiere, müsse sie notwendig für sich bleiben; eine Deklination nach irgendeiner Seite hin sei für sie gänzlich ausgeschlossen, da ringsum auf allen Seiten das Gleichgewicht bestehe. Den Mittelpunkt bilde die Erde aber nicht etwa von ungefähr oder aus Zufall, vielmehr sei diese ihre (zentrale) Stellung die natürliche und notwendige. Da der himmlische Körper nach oben die äußerste Stelle einnimmt, alle schweren Gegenstände aber nach unserer Annahme von oben herabfallen, so sagen sie, es werden diese Gegenstände von allen Seiten der Mitte zugetrieben. Wohin aber die Teile strebten, dahin gravitiere offenbar auch das Ganze. Wenn nun Steine, Holz und alle erdverwandten Stoffe nach unten drängen, so sei da (unten) wohl auch für die ganze Erde die eigentliche und passende Lage. Wenn aber etwas Leichtes von der Mitte aufsteige, so werde es offenbar bis zu oberst emporgetrieben. Die Bewegung nach unten sei also den schwersten Körpern eigen; das unten ist aber dem Gesagten zufolge die Mitte. Wundere dich also nicht, wenn die Erde als natürlicher Mittelpunkt nach keiner Seite hin ausweicht. Sie muß doch absolut notwendig an ihrer Stelle verbleiben und könnte nur durch eine unnatürliche Bewegung ihre Lage ändern. Sollte dir von diesen Behauptungen die eine oder andere annehmbar klingen, so gelte dein Staunen der Weisheit Gottes, die dies so angeordnet hat. Das Staunen ob so großer Dinge wird ja nicht abgeschwächt, wenn man die Art und Weise ergründet, wie etwas Staunenswertes zustande kommt. Verhält es sich aber anders, so soll die Einfalt des Glaubens stärker sein als der Vernunftbeweis.</p><p>Ebendasselbe möchten wir auch vom Himmel sagen, daß nämlich von den Weltweisen sehr wortreiche Abhandlungen über die Natur des Himmels verfaßt worden sind. Einige haben behauptet, er sei aus den vier Elementen zusammengesetzt, weil tastbar und sichtbar, wegen seiner Härte aus Erde, wegen seiner Durchsichtigkeit aus Feuer, wegen der Mischung aus den übrigen Elementen. Andere hingegen haben diese Meinung als unwahrscheinlich verworfen und zur Bildung des Himmels willkürlich und eigenmächtig einen fünften Körper ersonnen. Nach ihnen gibt es einen ätherischen Körper, der, wie sie sagen, weder Feuer noch Luft noch Erde noch Wasser ist noch überhaupt zu den einfachen Dingen zählt, weil die Bewegung der einfachen Dinge in gerader Richtung verläuft, die leichten nach oben, die schweren nach unten sich bewegen. Die Bewegung nach oben und unten ist aber nicht dasselbe wie der Kreislauf, und überhaupt stehe die gerade Linie zur Kreisperipherie im weitesten Abstande. So müssen die Dinge, deren <em>Bewegungen</em> ihrer Natur nach verschieden sind, auch in ihrer <em>Wesenheit</em> voneinander verschieden sein. Doch wir können uns den Himmel auch nicht aus den ersten Körpern, die wir Elemente nennen, zusammengesetzt denken, weil das Konglomerat aus verschiedenen Stoffen keine gleichmäßige und ruhige Bewegung haben kann, da jedes einfache Ding im Konglomerat naturgemäß eine andere Bewegung hat. Daher lassen sich die Mischgebilde von vorneherein kaum in einheitlicher Bewegung halten, da <em>eine</em> Bewegung nicht für alle Einzelstoffe gleichmäßig passen und den entgegengesetzten genehm sein kann; im Gegenteil verträgt sich die dem Leichten eigene Bewegung nicht mit der Bewegung des besonders Schweren. Wenn wir emporstreben, fühlen wir uns durch das Irdische belastet; bewegen wir uns nach unten, so vergewaltigen wir das Feuerartige, weil wir es gegen seine Natur nach unten ziehen. Dieses feindselige Auseinanderstreben der Elemente ist aber die Ursache der Auflösung. Denn was gewaltsam und unnatürlich verbunden wird, hält nur kurz, gewaltsam und zur Not zusammen und löst sich bald in seine Bestandteile auf, indem jeder Teil in seine natürliche Stellung zurückkehrt. Infolge dieser vermeintlich zwingenden Schlußfolgerungen haben sie die Ansichten ihrer Vorgänger verworfen und eine eigene Hypothese aufzustellen für nötig erachtet, indem sie für das Entstehen des Himmels und seiner Gestirne eine fünfte Körpernatur annahmen. Wieder ein anderer Besserwisser trat wieder gegen diese auf, zerpflückte und widerlegte ihre Meinungen und stellte dafür seine eigene Ansicht auf. Wollten wir jetzt darauf näher eingehen, so würden wir in eine ähnliche Schwätzerei verfallen.</p><p>Doch wir wollen lieber jene sich gegenseitig widerlegen lassen, wollen unserseits die Untersuchung über die Substanz des Himmels fahren lassen, wollen Mosesglauben, daß Gott Himmel und Erde erschaffen hat, den erhabenen Schöpfer der weise und kunstvoll geschaffenen Werke preisen und aus der Schönheit der sichtbaren Dinge den über alle Schönheit Erhabenen kennen lernen. Wir wollen aus der Größe dieser sichtbaren und begrenzten Körper auf den Unendlichen und Unmeßbaren schließen, der durch die Fülle seiner Macht allen Verstand übersteigt. Wenn wir auch die Natur des Gewordenen nicht kennen, so bietet sich doch schon in dem, was allüberall uns in die Sinne fällt, so viel Wunderbares, daß selbst der eindringlichste Verstand sich unfähig erweist, auch nur das Unbedeutendste in der Welt recht zu erklären oder dem Schöpfer das schuldige Lob zu zollen, dem aller Ruhm, alle Ehre und Herrschaft gebührt von Ewigkeit zu Ewigkeit. Amen.</p><h2>2</h2><p><em>Über die Stelle</em>: „<em>Die Erde war unsichtbar und ungestaltet</em>.”</p><p><em>Inhalt: Einleitung (Erhabenheit des Betrachtungsgegenstandes). - Inwiefern die Erde „ungestaltet” und „unsichtbar” (c. 1). Zurückweisung des Irrtums, wornach Gott nur einer ewigen Materie die Form gegeben hätte (c. 2). Unsichtbar und gestaltlos war die Erde insbesondere wegen des sie bedeckenden Wassers (c. 3). Das Wort „Finsternis” verführte manche zum falschen Dualismus vom wesenhaft Guten und wesenhaft Bösen. Das Böse ist weder Substanz, noch kommt es von Gott, ist Folge des Abfalls der Menschen vom Guten (c. 4). Immer noch ist Menschenwille am Bösen schuld. - Die „Finsternis” ist ein Mangel des Lichtes, verursacht durch die Erschaffung des Himmels, der das Himmelslicht der Seligen der Erde entzog (c. 5). Der „Geist Gottes über den Wassern” nahm teil an der Schöpfung (c. 6). Erschaffung und Wirkungen des Lichtes. - Dessen Schönheit seiner Substanz und seinem Zwecke nach (c. 7). Definition von „Tag” und „einem Tag”, und Begründung dieser Unterscheidung (c. 8).</em></p><p>Schon in den wenigen Worten, bei denen wir heute morgen verweilten, offenbarte sich uns eine solche Gedankentiefe, daß wir vom Nachfolgenden überhaupt absehen möchten. Denn wenn der Vorhof des Heiligtums derartig ist und die Vorhallen des Tempels so preiswert und herrlich sind, daß sie durch ihre unermeßliche Schönheit unser geistiges Auge blenden, wie wird dann erst das Allerheiligsle sein! Wer wird imstande sein, sich ins Innere vorzuwagen? Wer wird das Geheimnisvolle schauen wollen? Unzugänglich ist ja schon dessen Schauplatz, unerklärlich vollends der Sinn des Wahrgenommenen. Indes, da man beim gerechten Richter schon für den bloßen Willen, seine Pflicht zu tun, einen nicht zu verachtenden Lohn empfängt, so wollen wir mit der Nachforschung nicht säumen. Sind wir auch der Aufgabe nicht gewachsen, so wird uns der Richter doch nicht ganz unbrauchbar finden, wenn wir mit Hilfe des Geistes vom Sinn der Schrift nicht abweichen, und wir werden mit dem Beistande der Gnade doch etwas zur Erbauung der Kirche beitragen.</p><p>„Aber die Erde war”, heißt es, „unsichtbar und ungestaltet.” Wie? Beide, Himmel und Erde, sind zugleich geworden, der Himmel ward vollendet, die Erde aber ist noch unvollendet und unfertig? Überhaupt, worin lag das Unfertige der Erde? Aus welchem Grund war sie unsichtbar? Die vollkommene Gestaltung der Erde liegt doch in ihrer Fruchtbarkeit: im Sprossen verschiedenartiger Pflanzen, im Wachsen sehr hoher fruchtbarer und unfruchtbarer Bäume, in der Farbenpracht und im Wohlgeruch der Blumen, und in allem, was bald hernach auf Gottes Geheiß der Erde entsproßte, um die Erzeugerin zu zieren. Solange von all dem noch nichts da war, nannte die Schrift mit Recht die Erde „<em>ungestaltet</em>”. Dasselbe möchten wir aber auch vom Himmel sagen: Auch er war noch nicht fertig und hatte seinen eigentlichen Schmuck noch nicht, da er von Mond und Sonne noch nicht durchleuchtet war, noch kein Reigen von Sternen ihn umkränzte. Diese waren ja noch nicht ins Dasein getreten, und so wirst du nicht gegen die Wahrheit verstoßen, wenn du auch den Himmel ungestaltet nennst. - „<em>Unsichtbar</em>” aber nannte Moses die Erde aus zwei Gründen: entweder weil der Mensch, der sie schauen sollte, noch nicht existierte, oder weil sie unter dem Wasser, das ihre Oberfläche überflutete, nicht gesehen werden konnte. Denn noch waren ja die Gewässer nicht in ihre Sammelbecken geleitet, die Gott erst später schuf und Meere nannte. Was ist also unsichtbar? Doch das, was von Natur unserem fleischlichen Auge nicht sichtbar, wie unser Verstand, dann aber auch das, was seiner Natur nach wohl sichtbar ist, aber wegen der auf dem Körper liegenden Schicht verborgen liegt, wie z. B. das Eisen in der Meerestiefe. In letzterem Sinne ist unseres Erachtens hier die Erde „unsichtbar” genannt worden, da sie unter dem Wasser verborgen war. Da sodann das Licht noch nicht geworden war, so wäre es gar nicht auffallend, wenn die Erde, die in Finsternis lag, solange die Luft über ihr noch nicht erleuchtet war, auch in dieser Hinsicht von der Schrift wäre „unsichtbar” genannt worden.</p><p>Allein die Fälscher der Wahrheit, die sich nicht von der Schrift belehren lassen wollen, sondern den Sinn der Schriften nach ihrem eigenen Kopf verdrehen, sagen, mit diesen Worten werde die Materie bezeichnet. Diese ist, behaupten sie, ihrer Natur nach unsichtbar und ungestaltet, an sich eigenschaftslos und darum ohne jede Form und Gestalt. Diese nahm der Künstler und gestaltete sie nach seiner Weisheit und bildete so aus ihr die sichtbaren Dinge. Ist nun aber die Materie ungeworden, so steht sie erstens Gott gleich und verdient dieselbe Verehrung. Was ist aber gottloser als die eigenschaftslose, gestaltlose Materie, den Gipfel der Formlosigkeit, den Ausbund der Häßlichkeit - ich bediene mich nämlich ihrer eigenen Bezeichnungen - derselben Ehrenstellung zu würdigen wie den weisen, mächtigen und allschönen Schöpfer des Weltalls? Ist sodann die Materie so groß, daß sie die ganze Erkenntnis Gottes in sich faßt, so spielen sie damit deren Substanz gewissermaßen gegen die unerforschliche Macht Gottes aus; vermag sie doch Gottes ganze Weisheit von sich aus zu messen! Ist aber die Materie für die Einwirkung Gottes zu geringfügig, so werden diese ihre Worte zu einer noch tolleren Blasphemie ausschlagen, weil sie Gott wegen Mangelhaftigkeit der Materie seine eigenen Werke nicht schaffen und wirken lassen. Doch nein, die Dürftigkeit der menschlichen Natur hat sie getäuscht. Bei ist ja jede Kunst auf einen bestimmten Stoff angewiesen, wie z. B. die Schmiedekunst auf das Eisen, die Schreinerkunst auf das Holz. In diesen Kunstwerken ist aber etwas anderes der Stoff, etwas anderes die Form und wieder etwas anderes das Gebilde der Form. Auch ist der Stoff von außen her genommen, die Form aber wird (ihm) von der Kunst angepaßt, und das Produkt aus beidem besteht aus Stoff und Form. So glauben sie auch die göttliche Schöpfung erklären zu sollen: die der Welt wäre von der Weisheit des Weltenschöpfers gekommen, die aber von außen her dem Schöpfer dargeboten und die Welt so zusammengesetzt worden; so hätte die Welt Substrat und Substanz anderswoher, Gestalt und Form aber von Gott erhalten. Daraus versteht sich ihre Leugnung, der große Gott sei Herr des Entstehens der Dinge, und ihre Behauptung, er habe sozusagen nur beigesteuert, von sich aus nur einen geringen Teil zur Entstehung der Dinge beigetragen.</p><p>Bei ihrer geistigen Beschränktheit waren sie ja. nicht imstande, zur Höhe der Wahrheit emporzuschauen, daß nämlich hier die Künste erst nach den Stoffen, und zwar zur Befriedigung notwendiger Lebensbedürfnisse eingeführt worden sind. So war zuerst die Wolle da, und die Webekunst folgte nach, um ihrerseits das Bedürfnis der Natur zu befriedigen. Auch das Holz war da, und die Kunst, es zu bearbeiten, folgte nach und formte den Stoff entsprechend dem jeweiligen Bedürfnis. So zeigte sie uns die Verwertbarkeit des Holzes, indem sie den Schiffern das Ruder, den Landleuten die Wurfschaufel und den Soldaten den Speer in die Hand gab. Gott aber hat, ehe die jetzt sichtbaren Dinge wurden, in dem Augenblicke, da er sich entschloß und sich daran machte, das Nichtseiende ins Dasein zu rufen, und zugleich erwog, wie die Welt gestaltet sein sollte, mit der Form zugleich auch die ihr entsprechende Materie geschaffen. Für den Himmel bestimmte er den für den Himmel passenden Stoff, und der Gestalt der Erde legte er die ihr eigentümliche und nötige Substanz zugrunde. Auch Feuer, Wasser und Luft bildete er, wie er wollte, und ließ die Dinge ins Dasein treten, wie es die Bestimmung eines jeden erheischte. Die ganze aus so verschiedenen Teilen bestehende Welt verband er durch ein unzerreißbares Band der Freundschaft zu einer einzigen Gemeinschaft und Harmonie, so daß selbst die örtlich zuweitest voneinander geschiedenen Dinge in Eintracht vereint zu sein scheinen. So mögen sie denn ablassen von ihren traumhaften Einbildungen, sie, die mit ihrer schwachen Vernunft die unserem Verstande unfaßbare und menschlicher Zunge ganz unaussprechliche Macht ausmessen wollen.</p><p>. Stiegele, Der Agennesiebegriff in der griech. Theologie des 4. Jhd., Freiburg i.B., 1913</p><p>„Gott schuf den Himmel und die Erde”, beide nicht halb, sondern einen ganzen Himmel und eine ganze Erde, d. h. die Substanz samt der Gestalt. Er ist nicht bloß der Erfinder der Formen, sondern der Schöpfer des Wesens der Dinge. Sie sollen uns doch Red’ und Antwort stehen, wie die werktätige Kraft Gottes und die leidende Natur der Materie miteinander zusammentrafen, wenn doch letztere das gestaltlose Substrat darbot, Gott aber die Kenntnis der Gestalten ohne Materie hatte, daß dem einen wie der andern gegenseitig das Fehlende ersetzt wurde, dem Werkmeister das Objekt, an dem er seine Kunst zeigen konnte, der Materie die Beseitigung ihrer Gestalt- und Formlosigkeit. Doch genug hiervon; wir wollen wieder auf das zurückkommen, wovon wir ausgegangen sind.</p><p>„Die Erde aber war unsichtbar und ungestaltet.” Als er (Moses) sagte: „Im Anfange schuf Gott den Himmel und die Erde”, verschwieg er vieles: Wasser, Feuer, Luft und dieser Elemente Folgeerscheinungen. All dies gehört zum Weltganzen und ist darum offenbar mit dem Weltall entstanden Allein die Berichterstattung hat das übergangen, um unsern Verstand zu der Fertigkeit zu erziehen, aus den wenigen Angaben auf das Fehlende zu schließen. So ist denn auch vom Wasser nicht gesagt, daß Gott es erschaffen; aber es heißt, daß die Erde unsichtbar war. Erwäg’ nun du bei dir, welche Decke sie verhüllte und unsichtbar machte! Das Feuer konnte sie nicht verdecken; denn das Feuer gibt Licht und erhellt die Gegenstände, auf die es fällt, statt sie zu verdunkeln. Auch war gewiß damals die Luft nicht die Hülle der Erde. Denn die Luft ist ihrer Natur nach dünn und durchsichtig, nimmt alle Gestalten der sichtbaren Welt auf und übermittelt sie dem Auge der Beschauer. Es bleibt uns also nur noch die Annahme übrig, Wasser habe die Oberfläche der Erde überflutet, da die flüssige Substanz noch nicht an den für sie bestimmten Ort abgesondert war. Deshalb war die Erde nicht nur unsichtbar, sondern auch ungestaltet. Noch jetzt ist ja übermäßige Nässe der Fruchtbarkeit des Bodens ungünstig. Und eben das ist die Ursache, weshalb die Erde unsichtbar und ungestaltet war. Die Ausstattung der Erde ist ja der ihr eigene und natürliche Schmuck, die wogenden Saaten auf den Fluren, die grünenden und in bunter Flora prangenden Wiesen, die blühenden Täler und von Wäldern beschatteten Bergeshöhen; von all dem hatte die Erde noch nichts. Sie sollte aber all das gebären dank der vom Schöpfer in sie gelegten Kraft, indes noch warten auf die gelegene Zeit, um dann auf göttlichen Befehl hin die Frucht ihres Schoßes ans Tageslicht zu bringen.</p><p>„Aber auch Finsternis”, sagt er, „lag über dem Abgrunde.” - Wieder neuer Anlaß zu Fabeln und Anstoß zu noch gottloseren Hirngespinsten bei denen, die diese Worte nach ihren Ideen verdrehen. Denn die Finsternis erklären sie nicht für das, was sie von Natur aus ist, für lichtlose Luft, oder für einen durch einen vorgelagerten Körper verfinsterten Raum, oder überhaupt für einen aus irgendwelcher Ursache des Lichtes beraubten Ort, sondern für eine böse Macht oder vielmehr für das Böse selbst, aus sich selbst geboren; für einen Gegner und Feind der Güte Gottes erklären sie die Finsternis. Denn wenn Gott das Licht ist, sagen sie, so muß logisch folgerichtig die ihm widerstreitende Macht offenbar die Finsternis sein. Die Finsternis danke keinem andern das Dasein, sondern sei das aus sich selbst geborne Böse. Die Finsternis sei Feindin der Seelen, Todbringerin, Tugendgegnerin, habe ihre Existenz und sei nicht von Gott ausgegangen - so schließen sie zu Unrecht aus den Worten des Propheten. Was ist nicht daraus schon alles an verkehrten und gottlosen Lehren zusammenfabriziert worden! Welche reißenden Wölfe, die die Herde Gottes zerreißen, haben nicht schon dieses kurze Wort zum Anlaß genommen, die Seelen anzufallen! Kommen nicht daher Leute wie Marcion, wie Valentin, die abscheuliche Häresie der Manichäer, die man die Fäulnis der Kirche nennen darf, ohne den Anstand zu verletzen! Was kehrst du, Mensch, dich so weit von der Wahrheit ab und ersinnst dir Mittel und Wege zu deinem Verderben? Einfach und allgemein verständlich ist doch der Ausdruck: „Die Erde war unsichtbar.” Was ist die Ursache? Sie hatte den Abgrund über sich. Was heißt aber „Abgrund”? Eine Wassermasse, deren Tiefe nicht zu ergründen ist. Allein wir wissen, daß viele Körper auch durch das dünnere und durchsichtige Wasser sichtbar werden. Warum war nun kein Teil der Erde durch das Wasser hindurch sichtbar? Weil die darüber ausgegossene Luft noch finster und dunkel war. Denn ein Sonnenstrahl, der durch das Wasser dringt, zeigt oft die Steinchen in der Tiefe; aber in tiefer Nacht kann man die Gegenstände unter dem Wasser überhaupt nicht sehen. Deshalb steht bei dem Ausdruck: „Die Erde war unsichtbar und ungestaltet” der begründende Zusatz: „Der Abgrund lag darüber, und sie war verfinstert.” Der Abgrund ist also weder eine Menge widerstreitender Kräfte, wie einige sich eingebildet haben, noch ist die Finsternis eine ursprüngliche und böse Macht, die dem Guten widerstrebt. Denn zwei mit gleicher Kraft gegeneinander ankämpfende Dinge vernichten jedenfalls gegenseitig ihren Bestand, da sie ja ständig und unaufhörlich miteinander in Fehde liegen. Wenn aber die eine der feindlichen Kräfte mächtiger ist als die andere, so wird die unterliegende ganz und gar vernichtet. Wenn sie also das Böse mit ebenbürtiger Kraft gegen das Gute ankämpfen lassen, dann führen sie einen ewigen Krieg und unaufhörlichen Vernichtungskampf ein, indem beide abwechselnd siegen und besiegt werden. Hat aber das Gute die Übermacht, warum ist dann die Natur des Bösen nicht gänzlich beseitigt? Soll man aber das nicht sagen, dann fällt mir auf, daß sie nicht vor sich selbst fliehen und zu solch gottlosen Lästerungen sich fortreißen lassen.</p><p>Es entspricht aber wahrlich auch nicht der Gottesfurcht, das Böse von Gott herzuleiten, da aus Gegensätzlichem nichts Gegensätzliches kommen kann. Es gebiert doch das Leben nicht den Tod, und die Finsternis ist doch nicht Quelle des Lichtes, sowenig wie Krankheit Gesundheit schaffen kann; vielmehr tritt ein Umschlag der Dinge ins Gegenteil infolge veränderter Zustände ein. Bei den Zeugungen aber geht jede Geburt nicht aus Entgegengesetztem, sondern aus Gleichartigem hervor. Wenn nun das Böse, entgegnen sie, weder ungezeugt ist noch von Gott kommt, woher hat es dann seine Existenz? Denn daß Böses existiert, wird keiner leugnen, der das Leben mitmacht. Was antworten wir nun? Daß das Böse keine lebende, beseelte Substanz ist, sondern ein der Tugend entgegengesetzter Seelenzustand, der bei Leichtfertigen schuld ihres Abfalls vom Guten eintritt.</p><p>Suche daher das Böse nicht außer dir, noch denke an eine ungezeugte Substanz des Bösen; vielmehr sehe sich jeder selbst als den Urheber seiner Bosheit an! Was immer geschieht, trifft uns entweder naturgemäß, wie Alter und Krankheit, oder zufällig wie die unvorhergesehenen Fälle, oft traurige oder auch freudige, die anderweitig verursacht sind, so wenn jemand einen Brunnen gräbt und einen Schatz findet, oder auf den Markt geht und von einem wütenden Hunde angefallen wird. Wieder anderes aber hängt von uns ab, z. B. die Leidenschaften beherrschen oder die Sinnenlust nicht zügeln, den Zorn überwinden oder an den Beleidiger Hand anlegen, die Wahrheit sagen oder lügen, sanft und gelassen im Benehmen oder stolz und übermütig sein. Worüber du also Herr bist, dafür such’ den Ursprung nicht außer dir, sondern laß dir sagen: Das eigentlich Böse nimmt den Anfang mit den freiwilligen Entgleisungen. Denn wenn es ungewollt käme und nicht von uns abhinge, so würde keine so große Furcht vor den Gesetzen die Missetäter drücken, und die Strafgerichte, die den Bösewichten nach Verdienst vergelten, wären unvermeidlich. Soweit über das eigentlich Böse. Denn Krankheit, Armut, Schande, Tod und alle anderen Widerwärtigkeiten des Lebens können nicht so recht zu den Übeln gerechnet werden, weil wir auch das Gegenteil von diesen Dingen nicht unter die höchsten Güter rechnen. Die einen von ihnen sind natürliche Folgen, die andern scheinen vielen davon Betroffenen von Nutzen zu sein.</p><p>Wir wollen nun hier jede bildliche und allegorische Auslegung stillschweigend übergehen, wollen einfach und ungesucht, dem Sinne der Schrift folgend, den Begriff „Finsternis” nehmen. Es frägt aber die Vernunft weiter, ob die Finsternis zugleich mit der Welt erschaffen ward und, wenn <em>vor</em> dem Lichte, warum das weniger Gute zuvor gewesen. Darauf antworten wir: Diese Finsternis hat nicht als Substanz existiert, sondern war nur eine Zuständlichkeit in der Luft, bewirkt durch das Fehlen des Lichtes. Was für ein Licht war es denn aber, dessen der Weltraum plötzlich beraubt befunden wurde, so daß die Finsternis über dem Wasser war? Wir sagen uns also, daß, wenn etwas vor Erschaffung dieser sinnfälligen und vergänglichen Welt war, dies offenbar im Lichte war. Denn weder die Rangordnungen der Engel noch alle die himmlischen Heerscharen noch überhaupt sonstige vernünftige Wesen oder dienstbare Geister mit und ohne Namen lebten in Finsternis, sondern im Lichte, und in aller geistigen Wonne hatten sie eine ihnen entsprechende Zuständlichkeit. Dem wird auch niemand widersprechen, wenigstens der nicht, der in den verheißenen Gütern das himmlische Licht erwartet, von dem Salonion sagt: „Das Licht ist immerdar bei den Gerechten”, und der Apostel: „Damit ihr Gott dem Vater dankt, der uns tüchtig gemacht hat, teilzunehmen am Erbe der Heiligen im Lichte.” Denn wenn die Verdammten in die äußerste Finsternis hinausgeworfen werden, so werden offenbar diejenigen, die der Belehrung Würdiges vollbracht haben, im überirdischen Lichte die Ruhe genießen. Da nun der Himmel auf Gottes Geheiß hin entstand und sich plötzlich über die in seinem Umfange befindlichen Dinge ausspannte, einen kompakten Körper darstellend, der das Innere vom Äußeren trennen mußte, so machte er natürlich den von ihm umspannten Raum lichtlos, indem er ihm den von außen kommenden Lichtstrahl abschnitt. Zum Schatten müssen nämlich drei Dinge zusammenkommen: das Licht, der Körper und der unerleuchtete Raum. Die kosmische Finsternis war also durch den Schatten des Himmelskörpers entstanden. Laß dir das Gesagte an folgendem Beispiele klar machen: Stelle in der größten Mittagshitze um dich ein aus dichtem und undurchdringlichem Stoffe gefertigtes Zelt, und schon hast du dich (ohne weiteres) in Finsternis eingeschlossen. Als eine solche Finsternis stelle dir auch jene vor, die nicht primär da war, sondern anderen Dingen nachfolgte. Diese Finsternis also, heißt es, schwebte über dem Abgrunde, weil die äußersten Luftschichten von Natur mit der Oberfläche der Körper sich verbinden. Damals aber bedeckte das Wasser alles. Deshalb muß es heißen: Die Finsternis lagerte über dem Abgrunde.</p><p>„Und der Geist Gottes”, heißt es, „schwebte über dem Wasser.” Entweder versteht Moses unter diesem Geist die Ausgießung der Luft; dann nimm an, der Geschichtschreiber zähle dir die Teile der Welt auf; denn Gott hat Himmel, Erde, Wasser, Luft geschaffen, und zwar die Luft gleich ausgegossen und in fließendem Zustande. Oder, was der Wahrheit näher kommt und von unseren Vorfahren angenommen wurde, es wird mit dem „Geist Gottes” der Heilige Geist bezeichnet, weil man beobachtet hat, daß er eigens und vornehmlich von der Schrift dieser Bezeichnung gewürdigt und nichts anderes Geist Gottes genannt wird als der Heilige Geist, der die göttliche und selige Dreifaltigkeit vervollständigt. Nimmst du diesen Sinn an, so wirst du größeren Gewinn daraus ziehen. Wie nun schwebte dieser Geist über dem Wasser? Ich will dir nicht <em>meine</em> Meinung sagen, sondern die eines syrischen Mannes, eines Mannes, der von der Weisheit der Welt ebensoweit entfernt war wie der Kenntnis der Wahrheit nahe. Er sagte nun, der syrische Ausdruck sei bezeichnender und komme wegen seiner sprachlichen Verwandtschaft mit dem hebräischen dem Sinne der Schriften in etwas näher. Es sei der Sinn der Stelle etwa folgender: Das Wort „schwebte”, sagt er, nimmt man für „wärmte”. So machte er die Natur des Wassers lebenspendend - gleichnisweise wie ein brütender Vogel die Eier erwärmt und diesen so eine gewisse belebende Kraft einsenkt. Dies, sagen sie, sei der Sinn, der da liege in den Worten „der Geist schwebte”, d. h. er wirkte auf die Natur des Wassers ein, daß es Lebewesen hervorbrachte. Damit ist auch der Fragepunkt einiger hinlänglich erledigt, daß nämlich dem Hl. Geiste die schöpferische Tätigkeit nicht abgeht.</p><p>„Und Gott sprach: Es werde Licht.” Das erste Wort Gottes schuf die Substanz des Lichtes, verscheuchte die Finsternis, verbannte die Schwermut, erleuchtete die Welt und gab allen Dingen ein reizendes und liebliches Aussehen. Auch der Himmel, bis dahin in Finsternis gehüllt, ward sichtbar, und zwar eben in der Schönheit, die noch heute unser Auge bezeugt. Lichtumflutet ward die Luft, oder vielmehr sie nahm das volle Licht ganz in sich auf und sandte die blitzenden Strahlen ihres Glanzes nach allen Enden aus. Aufwärts drang sie bis zum Äther und Himmel selbst, und in der Breite beleuchtete sie alle Teile der Welt, den Norden wie den Süden, den Osten und Westen, und zwar in einem Momente. Denn ihre Substanz ist so durchsichtig und fein, daß das Licht ohne Verzug hindurchgeht. Wie sie unsern Blick ohne Zeitaufwand zu den sichtbaren Dingen lenkt, so rasch, rascher als man es sich denken kann, nimmt sie auch die Strahlen des Lichtes bis zu ihren äußersten Grenzen auf. Auch der Äther wurde mit dem Lichte lieblicher und die Wasser klarer, indem sie den Glanz nicht nur aufnahmen, sondern mit der Brechung des Lichtes ihn auch widerstrahlten, da die Lichtfluten allenthalben vom Wasser abprallen. So verwandelte die göttliche Stimme alles in Anmut und Herrlichkeit. Wie die, die in die Tiefe tauchen, an Ort und Stelle Öl ausgießen und damit den Raum erhellen, so hat der Schöpfer des Weltalls mit einem Wort plötzlich der Welt die Gabe des Lichtes geschenkt.</p><p>„Es werde Licht!” Und der Befehl ward Werk: <em>Die</em> Substanz war da, die das köstlichste Gut ist, das Menschengeist sich ausdenken kann. Wenn wir aber bei Gott von einer Stimme, einem Worte, einem Befehle reden, so verstehen wir unter der göttlichen Rede keinen mittelst Sprachorgan hervorgebrachten Laut, keine mit der Zunge geformte Luft, sondern wir glauben hier die Willensrichtung in der Form eines Befehles geäußert, um sie denen deutlich zu machen, die auf sie achten sollten.</p><p>„Und Gott sah, daß das Licht schön war.” Wie könnten wir ein würdiges Lob finden für das Licht, dem der Schöpfer selbst zuerst das Zeugnis gegeben hat, daß es schön sei! Auch überläßt bei uns der Verstand das Urteil dem Auge, da er so wenig das Große ausdrücken kann, das die Wahrnehmung zuvor bezeugt. Wenn aber die Schönheit eines Körpers im Ebenmaß seiner Teile und in einer gesunden Farbe des Äußern liegt, wie wird dann beim Lichte, das von Natur einfach ist und in lauter gleiche Strahlen sich zerteilt, der Begriff „Schönheit” gerettet? Doch wohl so, daß man beim Lichte nicht etwa eine Symmetrie zusammengehöriger Teile sucht, sondern das Angenehme und Milde sieht, das es für unser Auge hat. In dieser Weise ist ja auch das Gold schön, das nicht durch Übereinstimmung seiner Teile, sondern allein durch seine schöne Farbe Reiz und Entzücken für das Auge hat.</p><p>Und der Abendstern ist der schönste der Sterne, nicht, weil bei ihm zusammengehörige Teile zueinander im richtigen Verhältnis stehen, sondern weil von ihm ein heiterer und lieblicher Glanz in unser Auge fällt. Sodann richtete sich hier das Urteil Gottes über die Schönheit nicht lediglich nach der Wonne, die ein Auge empfindet, sondern auch nach dem künftigen Nutzen, den das Schöne vorausschauen ließ. Augen gab es ja noch nicht, um über die Schönheit zu urteilen. „Und Gott machte eine Scheidung zwischen dem Lichte und zwischen der Finsternis”, d. h. Gott schuf ihre Natur so, daß sie keine Vermischung zuließ und im Gegensatz zur andern stand. Denn er hat beide voneinander getrennt und geschieden durch einen sehr großen Zwischenraum.</p><p>„Und es nannte Gott das Licht Tag, und die Finsternis nannte er Nacht.” Nunmehr, nach Erschaffung der Sonne, ist Tag die von der Sonne erleuchtete Luft, wenn diese an der Halbkugel über der Erde erscheint; die Nacht aber ist das Dunkel der Erde, das mit Sonnenuntergang eintritt. Damals aber kam der Tag und folgte die Nacht nicht nach der Bewegung der Sonne, sondern durch jenes erstgeborne Licht, das in der von Gott bestimmten Fülle sich ergoß und sich wieder zurückzog. „Und es ward Abend, und es ward Morgen, Ein Tag.” Der Abend ist also die gemeinsame Grenze von Tag und Nacht, und der Morgen ist ebenso die Annäherung der Nacht an den Tag. Um nun das erste Vorrecht der Entstehung dem Tag zu geben, nannte Moses zuerst die Grenze des Tages, dann erst die der Nacht, als wenn die Nacht dem Tage folgte. Der Zustand der Welt vor Entstehung des Lichtes war nicht die Nacht, sondern die Finsternis; aber das Gegenteil vom Tage wurde eben Nacht genannt und hat auch erst nach dem Tage den neuen Namen bekommen. „Es ward also Abend, und es ward Morgen.” Er redet also von einer Tag-Nachtzeit. Und in der Beifügung sprach er nicht mehr von <em>Tag</em> und <em>Nacht</em>, sondern legte dem wichtigeren Teile die ganze Benennung bei. Diese Manier dürftest du in der ganzen Schrift finden, daß nämlich bei der Messung der Zeit (nur) die Tage, nicht auch die Nächte mit den Tagen gezählt werden. „Die Tage unserer Jahre”, sagt der Psalmist. Ferner Jakob: „Die Tage meines Lebens sind wenige und böse.” Und abermals heißt es: „Alle Tage meines Lebens.” Sonach ist das, was hier im Gewande der Geschichte geboten wird, ständige Norm für die Folgezeit geworden. - „Und es ward Abend, und es ward Morgen, <em>ein</em> Tag.” Warum sagte er nicht: „Der erste Tag”, sondern „<em>ein</em> Tag”? Es wäre doch, wenn er einen zweiten, dritten und vierten Tag folgen lassen wollte, folgerichtiger gewesen, den eine Reihe anhebenden Tag als ersten zu bezeichnen. Er sagte aber „ein Tag”, um das Maß von Tag und Nacht zu bestimmen und die Tag-Nachtzeit zusammenzufassen; denn 24 Stunden machen <em>einen</em> Tag aus, wenn unter „Tag” auch die Nacht mitinbegriffen wird. Deshalb sind jedenfalls auch zur Zeit der Sonnenwende, wo Tag und Nacht ungleich sind, beide Zeiträume mit der fixierten Zeit umschrieben. So hätte Moses sagen können: „Das Maß von vierundzwanzig Stunden ist die Zeit eines Tages”, oder „der Umlauf des Himmels von einem bestimmten Zeichen zu demselben zurück vollzieht sich in einem Tage”. So oft also entsprechend der Drehung der Sonne Abend und Morgen die Welt umfangen, so oft wird der Umlauf nicht in längerer Zeit, sondern im Zeitraum <em>eines</em> Tages vollendet.</p><p>Noch stärker drängt sich uns der ja sonst tief verborgen liegende Gedanke auf: Gott, der die Natur der Zeit erschaffen, hat ihr in den Tagesabschnitten Maß und Zeichen gesetzt; er mißt sie auch nach der Woche, indem er ihr befiehlt, immer wieder in sich selbst zurückzukehren und so die Bewegung der Zeit zu messen. Die Woche füllt nun wieder <em>einen</em> Tag aus, insofern sie siebenmal in sich zurückläuft. Das ist aber das Bild des Kreises: von sich ausgehen und in sich zurückkehren. Das ist aber auch der Ewigkeit eigen: in sich selbst zurückkehren und nirgends begrenzt sein. Deshalb nannte er den Anfang der Zeit nicht den ersten, sondern <em>einen</em> Tag, damit er auch schon in der Benennung die Verwandtschaft mit der Ewigkeit habe. Als etwas Einziges und Alleinstehendes charakterisiert, wurde der Tag mit Recht und zutreffend „<em>einer</em>” genannt. Wenn uns aber die Schrift viele Ewigkeiten vorstellt und häufig von der „Ewigkeit der Ewigkeit” und den „Ewigkeiten der Ewigkeiten” redet, so wird uns dabei keine erste oder zweite oder dritte Ewigkeit aufgezählt, sondern es werden uns dabei mehr die Unterschiede der Zustände und der verschiedenen Verhältnisse, nicht aber die Schranken und Grenzen und Reihenfolgen von Ewigkeiten angegeben. „Denn der Tag des Herrn”, heißt es, „ist groß und herrlich.” Und wieder: „Was fällt euch ein, nach dem Tag des Herrn zu verlangen? Auch er ist Finsternis und nicht (bloß) Licht.” Finsternis für die, die natürlich die Finsternis verdienen. Die Schrift weiß wohl, daß jener Tag ohne Abend, ohne Nachfolge, ohne Ende ist; er ist jener Tag, den der Psalmist den achten zubenannt hat, weil er außer der Woche liegt. Magst du ihn nun Tag oder Ewigkeit nennen, du sprichst denselben Gedanken aus. Mag nun jener Zustand Tag genannt werden, so ist es <em>einer</em>, und nicht sind es viele; oder mag er Ewigkeit heißen, so ist es wieder eine einzige und keine vielfache. Um unsere Gedanken auf das künftige Leben zu lenken, hat die Schrift jenen Tag <em>einen</em> genannt, jenen Tag, das Bild der Ewigkeit, den Erstling der Tage, den Altersgenossen des Lichtes, den hl. Herrntag, der da geheiligt in der Auferstehung des Herrn. „Es ward also Abend,” heißt es, „und es ward Morgen, <em>ein</em> Tag.”</p><p>Doch unsern Worten über jenen Abend gebietet der heutige Abend Einhalt und setzt unserer Rede hier ein Ziel. Der Vater des wahren Lichtes aber, der den Tag mit himmlischem Lichte geziert, die Nacht mit Feuerfunken erleuchtet hat, die Ruhe des zukünftigen Lebens mit geistigem und ewigem Lichte ausgestattet hat, er erleuchte eure Herzen in der Erkenntnis der Wahrheit, er erhalte euer Leben untadelig und verleihe euch, wie am Tage ehrbar zu wandeln, damit ihr leuchtet wie die Sonne im Lichte der Heiligen, zur Freude mir auf den Tag Christi, dem Ehre und Herrschaft von Ewigkeit zu Ewigkeit. Amen.</p><h2>3</h2><p><em>Das Firmament</em></p><p><em>Bitte um Aufmerksamkeit mit Hinweis auf die Segnungen der Predigt (c. 1). Gottes Reden bedingt kein menschliches Sprachorgan, ist bloßer Willensausdruck dem Sohne gegenüber und will uns letzteren leise offenbaren (c. 2). Widerspruchsvoll reden die heidnischen Philosophen von einer Einzahl oder Unzahl der Himmel, statt von einer Mehrzahl. - Die Sphärenmusik eine Fiktion der Philosophie (c. 3). Was unter „Feste” positiv und negativ zu verstehen. - Gen 1, 6-7 ein Beweis für den Eingebornen (c. 4). In der Schöpfung eine Unmenge Wasser - notwendig zur Paralysierung des Feuers. - Das Feuer nötig im Haushalt der Menschen wie der Natur (c. 5). Die Wassermasse auf und unter der Erde beweisen die vielen Quellen, Flüsse und Meere (c. 6). Bedeutung des Wortes „Feste”. - Die Sonne, ein Feuerball, verzehrt unaufhörlich viel Wasser (c. 7). Ätherischer Himmel, Regen, Schnee. - Vorzug der Schriftoffenbarung vor heidnischer Belehrung (c. 8). Ablehnung der allegorischen Deutung von der „Scheidung der Gewässer” (c. 9). Erklärung von Gen 1, 10. Gott sieht sein Werk „schön” in Hinsicht auf dessen Vollendung und Zweckmäßigkeit. - Aufforderung zur Nachbetrachtung des Gehörten. Segenswort (c. 10).</em></p><p>Bisher haben wir von den Werken des ersten oder vielmehr des <em>einen</em> Tages gesprochen. Denn wir dürfen ihm seine Würde, die er von Natur besitzt, und die ihm vom Schöpfer eigens verliehen ist, nicht nehmen und ihn den übrigen Tagen anreihen. Die gestrige Rede erstreckte sich auf die an diesem Tage geschehenen Dinge und verteilte den Vortrag für die Hörer, bot am Morgen eine Kost für die Seele, am Abend eine Erquickung. Heute geht sie aber zu den Wundern des zweiten Tages über. Ich sage aber das nicht mit Beziehung auf die Fähigkeit des Dolmetschers, sondern mit Bezug auf die Anmut des Textes, der von Haus aus leicht faßlich ist und willkommen wie lieb einem jeden Herzen, das die Wahrheit der Wahrscheinlichkeit vorzieht. Dementsprechend hebt ja auch der Psalmist ganz begeistert die Lieblichkeit der Wahrheit hervor und ruft: „Wie süß sind deine Worte meinem Gaumen! Süßer denn Honigseim sind sie meinem Munde.” Gestern haben wir also, soweit es möglich war, mit der Betrachtung über die Worte Gottes eure Herzen zur Freude gestimmt; heute, am zweiten Tage, sind wir wieder zusammengekommen, um die Wunderwerke des zweiten Tages zu betrachten. Doch ist mir ja nicht unbekannt, daß viele einfache Handwerker, die gern mit ihrer täglichen Arbeit sich ihr Brot verdienen, uns umstehen und uns das Wort abschneiden, um nicht zu lange von der Arbeit abgehalten zu werden. Was soll ich denen sagen? Daß die Gott geopferte Zeit nicht verloren ist, sondern von ihm mit einer großen Zulage wieder erstattet wird. Denn alle die hemmenden Umstände wird der Herr beseitigen, dem Leib Spannkraft, der Seele frohen Mut, den Unternehmungen guten Fortgang und das ganze Leben lang Wohlergehen verleihen, wenn man das Geistige höher schätzt. Aber selbst wenn unsere Unternehmungen im Augenblick nicht nach Wunsch verlaufen, so ist doch für das künftige Leben die Lehre des Geistes ein vortrefflicher Schatz. Banne daher aus deinem Herzen alle Nahrungssorge und sammle dich hier ganz für mich! Denn nichts nützt des Leibes Gegenwart, wenn dein Herz um irdischen Schatz sich kümmert.</p><p>„Und Gott sprach: Es werde das Firmament inmitten des Wassers und scheide das Wasser vom Wasser.” Schon gestern haben wir die Worte Gottes gehört: „Es werde Licht!” Und heute hören wir: „Es werde das Firmament!” Diese letzteren Worte scheinen aber etwas mehr zu enthalten; denn die Rede verblieb hier nicht beim nackten Befehl, sondern gab auch den Zweck an, wozu der Bau des Firmamentes erforderlich war. „Damit es scheide”, sagt er, „inmitten Wasser vom Wasser.” Zunächst fangen wir an, zu untersuchen, <em>wie</em> Gott redet. Etwa nach unserer Art, daß zuerst das Bild von den Dingen in das Bewußtsein kommt, daß er dann nach gewonnener Vorstellung jedem Dinge die ihm eigentümlichen und zutreffenden Bezeichnungen auswählt und ausspricht, daß er dann das Gedachte dem Dienste der Sprachorgane übergibt und so durch den Luftdruck in Verbindung mit der artikulierten Bewegung der Stimme den geheimen Gedanken kundgibt? Wie, ist es nicht unglaublich, daß man sagt, Gott benötige zur Offenbarung seiner Gedanken eines solchen Umweges? Ist es nicht gottesfürchtiger zu sagen, der göttliche Wille und die erste Regung der geistigen Tätigkeit sei Gottes Logos (Wort)? Auf ihn weist die Schrift durchgängig hin, um zu zeigen, daß Gott die Schöpfung nicht nur (schlechthin) entstehen, sondern sie durch einen Mitwisser ins Dasein treten lassen wollte. Denn Moses hätte von allen Dingen sagen können, wie er im Anfange gesagt hat: „Im Anfange schuf Gott den Himmel und die Erde”, dann: „Er schuf das Licht”, hernach: „Er machte das Firmament.” Da aber hier die Schrift Gott befehlend und redend einführt, so weist sie stillschweigend auf den hin, dem er befiehlt und mit dem er redet. Dabei mißgönnt sie uns die Kenntnis keineswegs, sondern sie will uns nur zur Sehnsucht entflammen, wenn sie einige Spuren und Andeutungen vom Geheimnisse einwebt. Denn das mühsam Erworbene wird freudig aufgenommen und sorgfältig verwahrt; was man aber leicht erwirbt, dessen Besitz schätzt man gern gering ein. Deshalb führt uns die Schrift schrittweise und allmählich zur Erkenntnis des Eingebornen. Gewiß bedurfte die körperlose Natur des verlautbaren Wortes so wie so nicht, da ja das Gesagte selbst dem Mitwirkenden mitgeteilt werden konnte. Was brauchen denn die das (gesprochene) Wort, die schon durch den Gedanken einander ihren Willen mitteilen können? Die Stimme ist doch nur des Gehörs wegen und das Gehör der Stimme wegen da. Wo aber weder Luft noch Zunge noch Ohr noch ein gewundener Gehörgang ist, der die Stimmen zur Wahrnehmung im Kopfe bringt, da bedarf es auch keiner Worte; vielmehr erfolgt da die Mitteilung des Wollens sozusagen schon durch die Gedanken des Herzens. Wie gesagt, um unsern Verstand zur Erforschung der Person, an die jene Worte gerichtet sind, anzuregen, ist weise und klug diese Ausdrucksweise gewählt worden.</p><p>Zweitens ist zu untersuchen, ob dieses Firmament, das auch Himmel genannt wurde, von dem „im Anfange” geschaffenen Himmel verschieden sei, und ob es überhaupt einen zweiten Himmel gebe. Diejenigen, die über den Himmel philosophiert haben, würden sich ja lieber die Zunge herausreißen lassen denn dies als wahr annehmen. Sie nehmen nur <em>einen</em> Himmel an und meinen, dieser habe eine Natur, daß ein zweiter, dritter oder vielfacher Himmel daneben nicht bestehen könne, da die ganze Substanz des himmlischen Körpers bei der Gestaltung des <em>einen</em> Himmels aufgebraucht worden sei. Nach ihnen gibt es nur <em>einen</em> rotierenden Körper, und zwar einen begrenzten. Ist dieser für den ersten Himmel aufgebraucht worden, so bleibe zur Entstehung eines zweiten oder dritten nichts mehr übrig. So spintisieren die, welche dem Schöpfer eine ungeschaffene Materie an die Hand geben, und aus dem ersten Schwindel verfallen sie auf die darauffolgende Lüge. Wir ersuchen aber die griechischen Weisen, uns nicht eher zu verlachen, als bis sie selbst unter sich einig geworden sind. Denn einige unter ihnen behaupten, es gebe unzählige Himmel und Welten Wenn aber andere diese unglaubliche Annahme mit gewichtigeren Beweisen widerlegen und mit mathematischen Schlußfolgerungen dartun, daß die Natur außer dem <em>einen</em> keinem zweiten Himmel Raum lasse, dann werden wir über ihr geometrisches und kunstgerechtes Geschwätz noch mehr lachen. Denn obschon sie sehen, daß aus gleicher Ursache sowohl <em>eine</em> wie viele Wasserblasen aufsteigen, zweifeln sie doch daran, ob die schaffende Kraft eine Mehrzahl von Himmeln habe ins Dasein rufen können. Denn dieser Himmel Wucht und Größe bedeuten unserer Ansicht nach nichts mehr als die hohlen Bläschen, die in dem Springbrunnen aufsteigen, sobald man auf die Erhabenheit der Macht Gottes sieht. Deshalb ist ihre Rede von der Unmöglichkeit lächerlich. Wir aber zweifeln so wenig an einem zweiten Himmel, daß wir sogar nach einem dritten suchen, dessen Anblicks der selige Paulus gewürdigt wurde. Der Psalm, der vom „Himmel der Himmel” redet, legt uns gleichfalls den Gedanken an mehrere Himmel nahe. Das ist doch nicht erstaunlicher als die sieben Kreise, in denen nach fast einstimmiger Annahme die sieben Planeten sich bewegen, und die laut Theorie nach Art ineinandergepaßter Gefäße einer dem andern sich einfügen. Diese Planeten, die eine dem Weltall entgegengesetzte Bahn laufen, sollen, wenn sie den Äther durchschneiden, einen so wohltönenden und harmonievollen Klang abgeben, der wonniger sei als alle Melodien. Fragt man dann diese Theoretiker nach sinnenfälliger Bezeugung, was antworten sie? Wir hätten in urdenklicher Angewöhnung an den Klang von der ersten Stunde unseres Daseins an so sehr <em>uns</em> an ihn gewöhnt, daß wir durch das viele Hören den Sinn dafür verloren hätten, wie ja auch die, die ständig in der Schmiede arbeiten, das Gehör einbüßen. Doch diese faulen Sophismen - als das erscheinen sie ganz klar einem jeden schon beim ersten Anhören - zu widerlegen, ist nicht Sache eines Mannes, der mit seiner Zeit zu sparen weiß und der Einsicht seiner Zuhörer noch etwas zutraut. Überlassen wir das Profane „denen, die draußen stehen”, und nehmen wir wieder unsere kirchliche Rede auf.</p><p>Es haben nun einige vor uns gesagt, es handle sich hier nicht um die Schöpfung eines zweiten Himmels, sondern nur um eine genauere Erklärung des ersten. Denn an erster Stelle werde die Erschaffung von Himmel und Erde im allgemeinen angegeben, hier aber gebe uns die Schrift eine genauere Schilderung der Art und Weise, wie jedes Ding entstanden ist. Wir aber sagen: Weil uns ein anderer Name und eine eigene Bestimmung des zweiten Himmels überliefert worden ist, deshalb ist dieser zweite ein anderer als der im Anfang erschaffene, ein Himmel festerer Natur und mit besonderer Bestimmung für das All.</p><p>„Und Gott sprach: Es werde eine Feste inmitten des Wassers, und sie scheide in der Mitte Wasser vom Wasser. Und Gott machte die Feste; und Gott machte eine Scheide mitten zwischen dem Wasser, das unter der Feste war, und mitten zwischen dem Wasser, das über der Feste war.” Doch bevor wir uns an den Sinn der Schrift machen, wollen wir es versuchen, die gegnerischen Einwände zu beseitigen. Sie fragen uns nämlich: Wenn der Körper der Feste kugelförmig ist, wie der Augenschein zeigt, das Wasser aber flüssig und von den Höhen auf allen Seiten herabfließt, wie hätte es sich denn auf der gewölbten Peripherie des Firmamentes halten können? Was sollen wir darauf antworten? Zunächst folgendes: Erscheint uns etwas nach der inneren Wölbung rund, so muß es an seiner äußeren Oberfläche nicht auch schon kugelförmig, ganz genau abgerundet und ringsum geglättet sein; denn wir sehen ja auch Bäder mit steinernen Gewölben und höhlenartige Gebäude, die, von innen besehen, die Gestalt eines Halbkreises haben, oben auf dem Dache aber oft eine ebene Oberfläche haben. Deshalb sollen sie darob weder sich selbst noch uns Schwierigkeiten machen, als könnten, wir nicht das Wasser oben festhalten.</p><p>Nun dürfte es aber Zeit sein, zu sagen, was die Natur der Feste ist, und warum ihr befohlen ward, inmitten des Wassers zu stehen. Die Bezeichnung „Feste” (Firmament) ist der Schrift geläufig bei Dingen, die durch Stärke sich auszeichnen, so wenn sie sagt: „Der Herr ist meine Feste und meine Zuflucht”, und „Ich habe festgestellt ihre Säulen”, sodann: „Lobet ihn in der Feste seiner Kraft!” Die Außenstehenden nennen das einen festen Körper, was sozusagen dicht und voll ist; im Gegensatz dazu spricht man von einem mathematischen Körper. Der mathematische Körper besteht nur in Dimensionen, denen der Breite, Tiefe und Höhe; der feste Körper aber hat zu den Dimensionen hin noch Härte und Widerstandskraft. Sodann ist es der Schrift geläufig, auch das, was stark und unnachgiebig ist, Feste zu nennen, so z. B. auch von der oft stark zusammengepreßten Luft diesen Ausdruck zu gebrauchen und zu sagen: „Der den Donner befestigt.” Die Kompression und den Gegendruck der Luft, die im Schöße der Wolken eingeschlossen ist und in gewaltsamem Ausbrechen das Donnerhallen verursacht, nannte die Schrift die Feste des Donners. Und so glauben wir auch hier diesen Ausdruck gebraucht für eine feste Natur, die das schlüpfrige und leicht verfließende Wasser zusammenzuhalten vermag. Indes dürfen wir nicht glauben, daß das Firmament, weil nach allgemeiner Annahme wohl dem Wasser entstiegen, gefrorenem Wasser vergleichbar sei oder irgendeiner derartigen Materie, die dem Niederschlag der Feuchtigkeit ihr Dasein dankt, wie der Kristall(-stein), der sich durch gesteigertes Gefrieren des Wassers bilden soll, oder der Spiegelstein, der unter den Metallen kristallisiert. Es ist aber dieser Stein durchsichtig, hat einen besonderen und sehr reinen Glanz, ein Stein, der in seiner natürlichen Reinheit, frei von Unrat und tiefen Rissen angetroffen, an Durchsichtigkeit der Luft fast gleichkommt. Doch mit keinem von diesen Dingen vergleichen wir das Firmament. In der Tat, nur ein kindischer, einfältiger Kopf kann sich von den himmlischen Körpern solche Vorstellungen machen. Und wenn auch alles ineinander ist, das Feuer in der Erde, die Luft im Wasser und desgleichen von den übrigen Elementen das eine im andern, ja keines der sinnfälligen Elemente rein und unvermischt ist, und zwar wegen der Verbindung entweder mit dem mittleren oder dem entgegengesetzten Elemente, so wagen wir dennoch nicht zu entscheiden, ob das Firmament aus einem einfachen Elemente oder aus einer Mischung mehrerer solcher bestehe; wir sind ja von der Schrift belehrt, unserm Verstande in keiner Weise zu gestatten, über die erlaubten Grenzen hinauszugehen.</p><p>Wir sollen aber auch das nicht unerwähnt lassen, daß, nachdem Gott befohlen hatte: „Es werde die Feste!” nicht schlechthin gesagt wurde: „Und es ward die Feste”, sondern: „Und Gott machte die Feste”, und wiederum: „Gott machte eine Scheide.” Hört, ihr Tauben, schaut empor, ihr Blinden! Wer ist denn taub, wenn nicht der, der den Geist nicht hört, trotzdem er so laut ruft? Und wer ist blind? Doch der, der trotz so deutlicher Beweise für den Eingebornen keinen Blick hat. „Es werde die Feste!” Das ist die Stimme der uranfänglichen Ursache. „Gott machte die Feste.” Das ist das Zeugnis der tätigen und schöpferischen Macht.</p><p>Doch wir wollen unsere Rede wieder auf die Fortsetzung unserer Erklärung einstellen. „Sie scheide in der Mitte Wasser vom Wasser!” sagt die Schrift. Grenzenlos war, wie es scheint, die Flut der Wasser, die überall die Erde überschwemmten und über sie sich erhoben. So schien Wasser auch im Verhältnis zu den andern Elementen weit reichlicher vorhanden gewesen zu sein. Deshalb ist auch im voraus gesagt worden, der Abgrund habe überall die Erde umgeben. Die Ursache für die Wassermasse wollen wir im nachfolgenden angeben.</p><p>Jedenfalls darf keiner aus euch, auch der allseitig Gebildete nicht, noch der, der die Dinge dieser vergänglichen und hinfälligen Natur scharf sieht, unserer Ansicht opponieren, als ob wir etwa vom Standpunkt der Vernunft aus unmögliche oder phantastische Voraussetzungen machten, noch darf man von uns verlangen, auf die Frage Rede und Antwort zu stehen, auf welcher Grundlage die Substanz des Wassers ruhe. Aus demselben Grunde nämlich, aus dem sie die Erde, die doch spezifisch schwerer ist als das Wasser, von den äußersten Endpunkten entfernen und in der Mitte schweben lassen, aus demselben Grunde werden sie ja gewiß auch zugeben, daß dieses unermeßlich viele Wasser sowohl wegen seines natürlichen Laufes nach unten wie auch wegen seines allseitigen Gleichgewichtes um die Erde herum stillstehe. So war also die unermeßliche Wassersubstanz rings um die Erde ausgegossen, mit dieser nicht gleich groß, sondern um ein Vielfaches über sie hinausgehend, weil der große Werkmeister von Anfang an die Zukunft vorausschaute und deshalb schon die ersten Dinge in Rücksicht auf das spätere Bedürfnis anordnete.</p><p>Wozu nun das unsagbar viele Wasser? Das Weltall braucht die Substanz des Feuers nicht bloß im Interesse der erdgeschaffenen Dinge, sondern auch zur Vervollständigung des Universums. Denn mangelhaft wäre das Weltall, wenn ihm eines der wichtigsten und nützlichsten Elemente fehlte. Nun aber stehen diese beiden Elemente im Kampfe gegeneinander, und das eine will das andere vernichten, das Feuer das Wasser, wenn es die Oberhand gewinnt, das Wasser aber das Feuer, wenn es in größerer Menge vorhanden ist. Es durfte aber nicht zu gegenseitigem Kampfe kommen, noch mit dem gänzlichen Verschwinden des einen oder anderen Elementes für das Weltall die Gefahr einer Auflösung erstehen. Deshalb schuf der Weltenlenker eine so gewaltige Wassermenge, daß sie trotz allmählichen Verdunstens unter der Einwirkung des Feuers bis zu den festgesetzten Grenzen des Weltbestandes ausreicht. Derjenige, der alles nach Gewicht und Maß ordnete - gezählt sind von ihm nach Job selbst die Regentropfen -, wußte wohl, wieviel Zeit er der Welt zu ihrem Bestehen bestimmte, und wieviel Nahrung für das Feuer vorzusehen war. Das ist der Grund für das Plus an Wasser bei der Schöpfung. Wie notwendig aber der Welt das Feuer, darüber wird wohl kein noch so weltfremder Mensch belehrender Worte bedürfen. Nicht bloß die lebensnotwendigen Handwerke wie Weberei, Gerberei, Baukunst und Ackerbau benötigen die Macht des Feuers, sondern auch das Wachstum der Bäume, das Reifen der Früchte, die Entstehung der Land- und Wassertiere, und ihre Nahrungsmittel wären weder im Anfang entstanden, noch hätten sie auf die Dauer genügt, wenn es keine Wärme gäbe. So war denn die Erschaffung der Wärme notwendig, um den Dingen das Dasein zu geben und sie im Bestand zu erhalten, notwendig auch der Überschuß an Feuchtigkeit, weil das Feuer unaufhörlich und unerbittlich davon zehrt.</p><p>Sieh dir ringsum die ganze Schöpfung an, und du wirst in allen Dingen bei deren Entstehen und Vergehen die Kraft der Wärme wirksam sehen. Darum ward in Fülle das Wasser über die Erde ausgegossen und über unsern Horizont hinaus erbreitert und dazu noch in alle Tiefen der Erde verteilt. Daher die Unzahl von Quellen, die Behälter der Brunnen, die strömenden Flüsse, Gießbäche wie perennierende Gewässer, wodurch eben in vielen verschiedenen Behältern die Feuchtigkeit aufbewahrt werden soll. Von Nordosten fließt der Indus, unter allen Strömen der wasserreichste, wie die Geographen erzählen. Aus dem mittleren Osten kommen der Baktrus, der Choaspes und Araxes, von dem der Tanais sich trennt und in den Mäotischen See fließt. Außer diesen münden der Phasis, der im kaukasischen Gebirge entspringt, und zahllose andere Flüsse vom Norden her in das Schwarze Meer. Im Südwesten aber, am Fuße der Pyrenäen, entspringen der Tartessus und der Ister; der erstere ergießt sich jenseits der Säulen des Herkules in das Meer, der Ister aber durchquert Europa und mündet im Schwarzen Meer, Doch wozu noch die anderen Flüsse aufzählen, die dem Ripäischen Gebirge, das, weit über das innerste Skythien hinausliegt, entspringen? Darunter ist auch der Eridanus nebst zahllosen anderen schiffbaren Flüssen, die an den westlichen Galatern (Galliern) und Kelten und deren benachbarten Barbaren vorbeifließen und sich alle in den westlichen Ozean ergießen. Andere kommen aus dem Süden, von oben durch Äthiopien und münden zum Teil in unser Meer; zum Teil entleeren sie sich in das, welches über das schiffbare hinausliegt, so der Ägon, Nyses und der sogenannte Chremetes, dazu auch der Nil, der eigentlich keinem Flusse mehr gleicht, wenn er einem Meere gleich Ägypten überflutet. So ist der bewohnbare Raum unserer Erde mit Wasser umgeben, von unzähligen Meeren eingeschlossen, von tausend unversieglichen Flüssen durchströmt - dank der unaussprechlichen Weisheit dessen, der die Anordnung getroffen hat, daß die dem Feuer entgegengesetzte Substanz nicht leicht verzehrt wird. Es wird zwar eine Zeit kommen, da alles im Feuer verbrennen wird, wie Isaias sagt, wenn er mit dem Gott des Weltalls also redet: „Der du zum Abgrund sprichst: Du wirst öde werden, und alle deine Flüsse werde ich austrocknen.” Darum laß die törichte Weisheit fahren, und nimm mit uns die Lehre der Wahrheit an, deren Sprache zwar unbeholfen ist, dafür aber unfehlbare Erkenntnis bietet.</p><p>Daher „werde eine Feste inmitten des Wassers und scheide das Wasser vom Wasser”. Es ist bereits gesagt worden, was in der Schrift die Bezeichnung „Feste” bedeutet: Sie versteht darunter keine widerstrebende, feste Substanz mit spezifischer Schwere und Widerstandsfähigkeit - denn in diesem Falle hätte die Erde solche Benennung mit weit mehr Recht beansprucht -, sondern wegen der feinen, luftartigen und übersinnlichen Natur der höher liegenden Körper, also im Vergleiche mit den feinsten und den Sinnen nicht zugänglichen Dingen, hat sie den Himmel „Feste” genannt. Denke dir irgendeinen Raum, der die Feuchtigkeit zu scheiden vermag, der das Feine und Durchgeseihte nach oben durchläßt, das Dichte und Erdartige aber als Niederschlag zurückläßt, wobei aber beim allmählichen Verschwinden der Feuchtigkeit von Anfang an bis zum Schlusse dieselbe Temperatur erhalten bleibt. Aber du siehst bedenklich auf die Menge des Wassers und siehst nicht auf die Menge der Wärme; ist letztere quantitativ auch nicht viel, sie hat doch die Kraft, viel Feuchtigkeit aufzuzehren. Denn sie zieht die Feuchtigkeit in der Nähe an, wie wir das beim Schröpfkopfe beobachten können; was sie aber anzieht, das verzehrt sie, wie das Lampenlicht den ihm durch den Docht zugeführten Nahrungsstoff anzieht, sofort verwandelt und verbrennt. Wer zweifelt aber daran, daß der Äther feurig ist und verbrennt? Wäre ihm von seinem Schöpfer nicht eine natürliche Grenze gesetzt worden, was hätte ihn gehindert, alles in Brand zu setzen und zusammenzubrennen und zugleich alle Feuchtigkeit in den Dingen zu verzehren? Deshalb ist Wasser in der Luft in Form von Wolken, die sich im oberen Raum aus den aufsteigenden Verdunstungen der Flüsse, Quellen, Sümpfe, Seen und aller Meere bilden, damit nicht der Äther alles erfasse und verbrenne. Sehen wir doch auch, wie unsere Sonne zur Sommerzeit oft einen feuchten und schlammigen Ort in kürzester Zeit ganz trocken und ausgedorrt zurückläßt. Wohin kam nun hier das Wasser? Das sollen uns die Allerweltsweisen angeben. Ist es denn nicht allgemein bekannt, daß es von der Sonnenhitze verdunstet und aufgezehrt wurde? Trotzdem lassen jene die Sonne nicht einmal warm sein - freilich, wenn sie nur etwas behauptet haben! Seht doch, mit welchem Beweis sie gegen die augenscheinliche Tatsache anlaufen! Die Farbe der Sonne, sagen sie, sei weiß, nicht rötlich noch gelblich; deshalb sei sie auch der Natur nach nicht feurig; vielmehr entstehe ihre Hitze aus ihrer schnellen Rotation. Aber was gewinnen sie damit? Etwa das, daß man auch nicht glauben soll, die Sonne verzehre Feuchtigkeit? Obschon nun ihre diesbezügliche Behauptung nicht wahr ist, so will ich sie, die meinen Schluß bestätigt, nicht verwerfen. Es wurde also gesagt, wegen der Absorption durch die Hitze sei das viele Wasser notwendig. Dabei verschlägt es nichts, ob die Sonne von Natur heiß ist oder ihre Hitze einem äußeren Vorgang dankt, wenn sie nur bei denselben Materien dieselben Wirkungen hervorbringt. Denn ob Holz durch Aneinanderreiben in Feuer und Flamme gesetzt wird oder an einer Flamme sich entzündet, das Ende ist in beiden Fällen das gleiche und dasselbe. Übrigens sehen wir des Weltregenten Weisheit auch daran, daß er die Sonne von einem Ort an den anderen versetzt, damit sie nicht durch ein stetes Stehen an nämlicher Stelle mit einem Übermaß an Hitze die Ordnung zerstöre. Vielmehr führt sie der Schöpfer bald gegen den Süden zur Wintersonnenwende, bald versetzt er sie zu den Zeichen der Tag- und Nachtgleiche; von der rückt er sie gegen Norden zur Sommersonnenwende, so daß durch ihren allmählichen Umlauf die Erdzonen ihre gemäßigte Temperatur erhalten.</p><p>Doch sie mögen sehen, ob sie nicht mit sich selbst uneins werden: Behaupten sie ja doch, das Meer trete trotz der einmündenden Ströme nicht über die Ufer dank der verdunstenden Einwirkung der Sonne, und zudem bleibe es salzig und bitter, weil das leichte und trinkbare Wasser von der Hitze absorbiert werde, was in erster Linie Folge der zersetzenden Tätigkeit der Sonne sei, die das Leichte fortnimmt, das Schwere und Erdhaltige aber gleichsam als Schlamm und Bodensatz zurückläßt, woher auch das Bittere, Salzige und die Trockenwirkung des Meeres komme. Das behaupten sie also vom Meere und ändern doch wieder ihre Meinung und sagen, durch die Sonne werde keine Abnahme der Feuchtigkeit bewirkt.</p><p>„Und Gott nannte die Feste Himmel.” Diese Benennung paßt ja eigentlich auf etwas anderes, aber der Ähnlichkeit halber bekommt auch die Feste diese Bezeichnung. Wir haben aber beobachtet, wie vielfach der Raum, den wir sehen, Himmel genannt wird, und zwar wegen der dichten und zusammenhängenden Luft, die deutlich in unser Gesichtsfeld fällt, und wie er eben deshalb, weil er gesehen wird (παϱὰ τὸ ὁϱᾶσϑαι), die Benennung „Himmel” (οὐϱανὸς) bekommt, so wenn z. B. die Schrift sagt: „Die Vögel des Himmels” und wiederum: „Und die Vögel am Firmamente des Himmels.” Ähnlich heißt es auch: „Sie stiegen hinauf bis zum Himmel.” Und da Moses den Stamm Joseph segnete, erteilte er ihm die Segnungen von den Früchten des Himmels und des Taues, von den Sonnenwenden und Neumonden, vom Gipfel der Berge und den ewigen Hügeln; denn die Erdoberfläche dankt ihre Fruchtbarkeit der günstigen Stellung des Himmels. Auch bei den Verwünschungen spricht er zu Israel: „Der Himmel über deinem Haupte wird sein wie Erz.” Was will er damit sagen? Es wird eine allgemeine Trockenheit eintreten und ein Mangel an Wasser in der Luft, das der Erde die Fruchtbarkeit verleiht. Wenn er also sagt, daß Tau und Regen vom Himmel kommen, so verstehen wir darunter das Wasser, das laut Anordnung den obern Raum einzunehmen hatte. Denn wenn sich die Dünste in der Höhe sammeln und die Luft unter dem Drucke der Winde sich verdichtet, wenn so die bisher dunstartig und fein in den Wolken zerstreute Feuchtigkeit sich sammelt, so entstehen Regentropfen, die infolge der Schwere der verdichteten Feuchtigkeit herabfallen; so eben entsteht der Regen. Wird aber die Feuchtigkeit von den Winden gepeitscht und in Schaum verwandelt, der dann wegen heftiger Kälte ganz zusammengefriert, dann fällt, wenn die Wolke bricht, Schnee herab. Hieraus kannst du übrigens ersehen, daß jede feuchte Substanz in der Luft über uns ganz analog entsteht.</p><p>Vergleiche doch niemand mit der Kniffigkeit derer, die über den Himmel spintisiert haben, das Einfache und Ungekünstelte der geistlichen Reden. So hoch die Schönheit züchtiger Jungfrauen über der feiler Dirnen steht, so erhaben stehen unsere Reden über dem Geschwätz derer, die draußen stehen. Denn diese bringen ihre Worte höchstens auf eine erzwungene Wahrscheinlichkeit; hier aber wird die Wahrheit ohne Spitzfindigkeiten vorgetragen. Wozu sollen wir uns denn auch mit der Widerlegung ihrer Lügen abmühen? Genügt es doch, ihre Schriften einander gegenüberzuhalten und in aller Seelenruhe als Zuschauer ihres Streites dazusitzen. Nicht weniger an Zahl noch geringer an Ansehen, nur sehr verschieden durch die Geschwätzigkeit sind die, welche der gegnerischen Ansicht gegenübertreten und sagen, das Weltall würde im Feuer vergehen, aber dann aus den vom Brande zurückgebliebenen Samenstoffen wieder aufleben. Damit führen sie endlose Weltzerstörungen und Wiedergeburten ein. Doch diese sagen sich nach beiden Seiten hin los von der Wahrheit und suchen sich da und dort Auswege für ihren Irrtum.</p><p>Wir müssen aber auch gegen einige Kirchenschriftsteller etwas über die Scheidung der Gewässer sagen. Unter dem Vorwand höherer Erleuchtung und erhabenerer Einsicht haben sie zur Allegorese ihre Zuflucht genommen und behaupten, unter den Wassern seien bildlich geistige und körperliche Kräfte zu verstehen, die besseren seien oben beim Firmament geblieben, die bösen hätten sich an irdischen und materiellen Örtlichkeiten niedergelassen. Daher, sagen sie, loben Gott auch die Wasser am Himmel, d. h. die guten Kräfte, die da wegen der Reinheit des Geistes würdig seien, dem Schöpfer das gebührende Lob darzubringen. Die Wasser unter dem Himmel aber seien böse, aus ihrer natürlichen Höhe in die Tiefe der Bosheit gestürzte Geister. Diese letzteren, unruhig und aufrührerisch und von ungestümen Leidenschaften hin und her getrieben, seien wegen der leichten Wandelbarkeit und Unbeständigkeit ihrer Willensregungen Meer genannt worden.</p><p>Doch solcherlei Reden weisen wir als Traumgebilde und Altweibergeschwätz ab, verstehen unter Wasser Wasser und nehmen die durch das Firmament bewirkte Scheidung in genanntem Sinne an. Und wenn auch einmal die Wasser über den Himmeln zum Lobpreis des gemeinsamen Schöpfers des Weltalls aufgerufen werden, so halten wir sie deshalb doch noch nicht für vernunftbegabte Natur. Denn die Himmel sind doch nicht beseelt, weil sie „Gottes Herrlichkeit erzählen”, noch ist das Firmament ein sinnbegabtes Lebewesen, weil es „das Werk seiner Hände verkündigt”. Wenn aber jemand sagt, die Himmel seien die kontemplativen Kräfte, das Firmament aber bestehe in den aktiven, die Weltwirklichkeit schaffenden Kräften, so nehmen wir diese Rede als feinsinnigen Einfall hin, geben aber niemals zu, daß er zutreffend sei. Denn so wären auch Tau und Reif, Kälte und Hitze, die von Daniel zum Preis auf den Schöpfer des Weltalls aufgerufen wurden, geistige und unsichtbare Wesen. Wird aber diese Redeweise in dem Sinne genommen, wie sie von Vernünftigen aufgefaßt wird, dann vollendet sie den Lobpreis auf den Schöpfer. Denn nicht bloß das Wasser über den Himmeln verkündigt das Lob Gottes), als wäre es wegen der ihm eigenen Vortrefflichkeit besonders bevorzugt, sondern es heißt auch: „Lobt ihn, auch ihr auf Erden, ihr Ungeheuer und alle Abgründe.” Demnach auch der Abgrund, den die Allegoristen zum schlechteren Teil verwiesen - auch er wurde vom Psalmisten nicht für verwerflich befunden, sondern in den gemeinsamen Chor der Schöpfung aufgenommen; und auch er stimmt nach seiner Weise harmonisch in den Lobgesang auf den Schöpfer ein.</p><p>Doch hier wollen wir unsern Vortrag über den zweiten Tag schließen, um den eifrigen Zuhörern Zeit zu geben, über das Gehörte nachzudenken, das Nützliche daraus ihrem Gedächtnis einzuprägen und in fleißiger Betrachtung und richtiger Verdauung sich anzueignen, und um denen, die dem Verdienst nachgehen müssen, Muße zu geben, damit sie während dieser Zeit ihr Geschäft besorgen und dann mit sorgenfreier Seele zur Abendpredigt wie zu einem Gastmahl zurückkehren.</p><p>Gott aber, der das Große geschaffen und es gefügt hat, daß dies Wenige gesagt worden, verleihe euch in allem die Erkenntnis seiner Wahrheit, auf daß ihr aus dem Sichtbaren den Unsichtbaren erkennt und aus der Größe und Schönheit der Geschöpfe den Schöpfer nach Gebühr preisen lernt! „Denn was an ihm unsichtbar ist, wird seit der Schöpfung der Welt durch seine Werke erkannt und geschaut”, so daß Erde, Luft, Himmel, Wasser, Nacht und Tag sowie alle sichtbaren Dinge uns laut an unseren Wohltäter erinnern. Wir wollen den Sünden keinen Augenblick opfern noch dem Feinde in unseren Herzen Raum geben, indem wir durch stetes Gedenken Gott in uns tragen, dem alle Ehre und alle Anbetung jetzt und allezeit und von Ewigkeit zu Ewigkeit. Amen.</p><h2>4</h2><p><em>Die Sammlung der Gewässer</em></p><p><em>Inhalt: Die Betrachtung der Schöpfungswunder ist weltlicher Lustbarkeit vorzuziehen (c. 1). Gen 1,9-10. Das Abwärtsgleiten des Wassers liegt nicht ursprünglich ir. seinem Wesen, sondern erfolgte auf besonderen Befehl Gottes hin. Einwände dagegen (c. 2). Der Lauf des Wassers (in Quellen und Flüssen) wie der Verbleib des Meeres in seinen Grenzen ist Gottes Befehl (c. 3). Nur ein Weltmeer, aber viele Seen, auch Meeresteile und -namen (c. 4). Die Bezeichnung „das Trockene” für die „Erde” (Gen 1,9.10) charakterisiert spezifisch dies Element. - Die Grundeigenschaften der andern Elemente. Ihre gegenseitige Verbindung auf dem Wege verwandter Eigenschaften (c. 5). Wunderbare Schönheit des Meeres (Gen 1,10), weil es in all seinen Formen, Bewegungen, Wirkungen und vielfachen Segnungen für die Menschen dem Schöpferwillen entspricht. - Das Meer ein Bild der Kirche. Predigtschluß (c. 6-7).</em></p><p>Es gibt Städte, die vom frühen Morgen bis zum späten Abend an allerlei Schauspielen der Gaukler ihre Augen weiden. Und wahrhaftig, mögen sie lose und schlechte Lieder, die allenthalben in den Herzen wilde Zügellosigkeit verschulden, noch so lange hören, sie bekommen nicht genug. Viele preisen solche Völker glücklich, weil sie den Marktbetrieb oder die Erwerbs- und Lebenssorgen beiseite lassen, in lauter Leichtsinn und Vergnügen die ihnen bestimmte Lebenszeit vergeuden, ohne zu bedenken, daß die Bühnen mit ihren vielen lasziven Schauspielen für die Besucher eine allgemeine und öffentliche Schule der Unsittlichkeit sind, und daß die so harmonischen Melodien der Flöten und die unzüchtigen Gesänge in den Herzen der Zuhörer sich festsetzen und nichts weniger als alle zur Schamlosigkeit erziehen, da diese die Gebärden der Flöten- und Zitherspieler nachahmen. Wieder andere sind leidenschaftliche Pferdeliebhaber, streiten selbst im Schlafe um die Pferde, spannen die Wagen um, wechseln die Wagenlenker und haben so nicht einmal im Schlafe vor der Torheit des Tages Ruhe. Sollten nun wir, die der Herr, der große Wundertäter und Künstler, zur Betrachtung seiner Werke zusammenberufen hat, ermüden, sie anzuschauen, oder träge werden, die Aussprüche des Geistes anzuhören? Sollen wir nicht vielmehr diese große und reichhaltige Werkstätte göttlichen Schaffens umstehen, im Geiste ein jeder zu den entschwundenen Zeiten zurückkehren und die Ausschmückung des Weltalls betrachten? Den Himmel zunächst, der nach dem Ausspruche des Propheten wie ein Gewölbe ausgespannt ist, dann die Erde, unendlich groß und schwer und auf sich selbst gestützt, sodann die ausgegossene Luft, die ihrer Natur nach weich und feucht, allem, was Odem hat, die wesentliche und stete Nahrung gibt, wegen ihrer Feinheit aber vor den sich bewegenden Körpern ausweicht und sich teilt, um denen nicht hinderlich zu sein, die in ihr leben, indem sie sich immer hinter diejenigen, die sie durchschneiden, leicht zurückzieht und sie umfließt. Die Natur des Wassers aber, des Trinkwassers wie des übrigen Nutzwassers, sowie seine wohlgeordnete Sammlung an den bestimmten Orten, wirst du aus dem eben Verlesenen ersehen.</p><p>„Und Gott sprach: Es sammle sich das Wasser, das unter dem Himmel ist, an einem Sammelort, und es komme zum Vorschein das Trockene. Und also ward es; es sammelte sich das Wasser, das unter dem Himmel war, in seinen Sammelbecken, und es kam zum Vorschein das Trockene. Und Gott nannte das Trockene Erde, und die Ansammlungen der Wasser nannte er Meere.” Wieviel machtest du mir in den früheren Vorträgen zu schaffen, da du die Erklärung dafür haben wolltest, wie die Erde unsichtbar sein konnte, da doch jeder Körper von Natur seine Farbe hat, jede Farbe aber dem Auge sichtbar ist. Vielleicht schien dich auch unsere Erklärung nicht zu befriedigen, wornach die Erde mit Bezug auf u n s, nicht mit Bezug auf die <em>Natur</em> „unsichtbar” genannt ward, (mit Bezug auf uns), weil eben damals eine Oberschicht Wasser die ganze Erde bedeckte. Wohlan, höre jetzt die Schrift, wie sie sich selbst erklärt. „Es sollen sich sammeln die Wasser, und es komme das Trockene zum Vorschein!” Die Decke wird nun zusammengezogen, damit die bis dahin unsichtbare Erde sichtbar werde. Vielleicht möchte der eine oder andere auch noch folgendes wissen wollen. Erstens, warum wird die schon rein <em>natürliche</em> Abwärtsbewegung des Wassers hier im Bericht noch auf einen besonderen Befehl des Schöpfers zurückgeführt? Solange das Wasser auf einer horizontalen Ebene liegt, steht es still, weil es nirgends hinfließen kann. Sobald es aber auf abschüssiges Terrain kommt, gerät das vordere Wasser sofort in Bewegung, und das mit ihm zusammenhängende tritt sofort an seine Stelle und so immer weiter: wie das vordere Wasser entweicht, drängt das folgende nach. Und der Lauf wird um so schneller, je schwerer das abfließende Wasser und je tiefer gelegen der Ort, wohin es fließt. Hat nun das Wasser dieses Naturgesetz, dann war doch der Befehl, sich an <em>einem</em> Sammelort zu sammeln, überflüssig. Denn es wäre jedenfalls dank einer natürlichen Tiefenrichtung von selbst an den tieferen Ort geflossen und hätte nicht eher Halt gemacht, als bis das gleiche Niveau wieder hergestellt gewesen wäre. Denn keine Ebene ist so gleichmäßig, wie die Oberfläche des Wassers. - Zweitens sagt man: Wie konnte den Wassern befohlen worden sein, in <em>ein</em> Sammelbecken zu fließen, wo doch viele Meere zu sehen sind, die durch sehr große Zwischenräume voneinander getrennt sind.</p><p>Auf die erste Frage antworten wir folgendes: Du hast doch sicher erst nach dem Befehle des Herrn die Bewegungen des Wassers kennen gelernt, daß es nämlich überall hinfließt, unstet ist und von Natur abschüssigen und hohlen Räumen zustrebt. Ob es aber vordem diese Kraft hatte, d. h. bevor ihm durch diesen Befehl der Lauf angewiesen war, das hast du weder selbst gesehen noch hast du darüber einen Augenzeugen gehört. So denk doch, daß Gottes Stimme die Schöpferin der Natur ist, und daß der damals an die Schöpfung ergangene Befehl den Kreaturen die Norm für die Zukunft gab. Tag und Nacht wurden ein für allemal erschaffen, und seitdem lösen sie sich bis heute noch ab und teilen immerfort die Zeit in gleiche Teile.</p><p>„Es sollen sich sammeln die Wasser.” Damit erhielt die Substanz des Wassers den Betehl zu laufen, und wird nie müde, von jenem Befehl unablässig getrieben. Dies behaupte ich in Hinsicht des fließenden Teils der Gewässer. Denn die einen fließen ganz von selbst, wie die Quellen und Flüsse, die anderen Gewässer bleiben beisammen und fließen nicht ab. Doch eben rede ich von den fließenden Gewässern. „Es sollen die Wasser sich sammeln an <em>einem</em> Sammelort.” Hast du jemals, stehend an einer Quelle, aus der reichliches Wasser floß, darüber nachgedacht, wer dieses Wasser aus dem Schoße der Erde hervorsprudeln läßt, wer es dann weiter forttreibt, aus welchen Behältern es entspringt, wohin es eilt, woher es kommt, daß jene Behälter nie leer und die Sammelbecken nie voll werden? Das hängt an jenem ersten Worte. Von diesem ward dem Wasser der Lauf gegeben.</p><p>Bei jeder Erwähnung von Wassern erinnere dich jener ersten Stimme: „Es sollen sich sammeln die Wasser!” Sie mußten laufen, um an ihren Platz zu kommen, und an den ihnen angewiesenen Orten angekommen, mußten sie dort beieinander verbleiben und durften nicht weiter wandern. Daher heißt es beim Prediger: „Alle Flüsse laufen in das Meer, und das Meer wird nicht voll.” Denn sowohl das Fließen der Wasser hängt vom göttlichen Befehle ab wie das Verbleiben des Meeres innerhalb seiner Schranken, von jenem ersten Gebot: „Es sammeln sich die Wasser an <em>einem</em> Sammelort!” Damit nicht das fließende Wasser über seine Aufnahmestellen hinaus sich ergieße und immer weiter sich ausbreitend einen Ort um den andern anfülle und schließlich das ganze Festland überschwemme, wurde ihm geboten, „an <em>einem</em> Sammelort sich zu sammeln”. Das ist der Grund, weshalb das von Winden oft aufgepeitschte, rasende und seine Wogen zur höchsten Höhe auftürmende Meer, sobald es nur das Gestade berührt, sein Toben in Schaum auflöst und zurückprallt. „Werdet ihr mich nicht fürchten, spricht der Herr, der ich dem Meere Land als Grenze gesetzt habe?” Mit dem allerschwächsten Dinge, mit Sand, wird das aller Gewalt spottende Meer gebändigt. Was würde sonst das Rote Meer abhalten, das ganze, tiefer liegende Ägypten zu überschwemmen und sich mit dem Ägypten angrenzenden Meere zu vereinigen, wenn es nicht durch jenen Befehl des Schöpfers gebunden wäre? Denn daß Ägypten tiefer liegt als das Rote Meer, haben uns in der Tat die bewiesen, die das Ägyptische und Indische Meer, zu dem das Rote Meer gehört, miteinander verbinden wollten. Daher stand sowohl der Ägypter Sesostris, der zuerst den Versuch machte, als auch der Meder Darius, der später sich ans Werk machen wollte, vom Vorhaben ab. Das habe ich gesagt, damit wir einsehen sollten die Wirkung des Gebotes: „Es sollen sich sammeln die Wasser an <em>einem</em> Sammelort”, d. h. nach dieser Sammlung soll keine andere mehr statthaben, vielmehr soll das Gesammelte in der ersten Sammlung verbleiben.</p><p>Sodann hat der, welcher sagte, die Wasser sollen sich in <em>einem</em> Sammelort sammeln, dir zu verstehen gegeben, daß viele Wasser an vielen Orten verteilt waren. So hatten die Höhlen der Berge, von tiefen Klüften durchbrochen, ihre Wasseransammlungen. Außerdem wurden auch viele schrägliegende Ebenen, so groß wie die größten Meere, und abertausend Täler und auf diese oder jene Weise ausgehöhlte Schluchten, die alle damals mit Wasser gefüllt waren, auf den Befehl Gotles hin geleert, indem das Wasser von allen Seiten her an <em>einen</em> Sammelort geleitet wurde. Sage doch niemand, daß, wenn ja Wasser über der Erde war, jedenfalls alle Tiefen, die jetzt das Meer aufnahmen, mit Wasser angefüllt gewesen seien, und wo hätten wir uns denn die Wasseransammlungen zu denken, wenn die Tiefen schon angefüllt waren? Darauf antworten wir, daß in dem Augenblicke, da das Wasser in <em>einen</em> Sammelort sich absondern mußte, auch die Wasserbehälter hergerichtet waren. Denn das Meer außerhalb Gades existierte noch nicht; auch jenes große, von den Seeleuten gefürchtete Meer, das die britische Insel und Westspanien umflutet, gab es noch nicht; vielmehr erst, nachdem auf Gottes Befehl der weite Raum geschaffen war, ergossen sich in ihn die Wassermassen.</p><p>Auf den Einwand aber, als widerspreche unsere Ansicht von der Weltschöpfung der Erfahrung - denn nicht alles Wasser scheint an <em>einem</em> Sammelort zusammengelaufen zu sein -, könnten wir Vieles und Allbekanntes erwidern, wenn es nicht etwa lächerlich wäre, mit solchen Leuten sich in einen Streit einzulassen. Sie wollen doch hoffentlich uns nicht die Moräste und Regenpfützen vorführen und damit unsere Ansicht widerlegt glauben! Hat doch auch Moses nur den größten und vollständigsten Zusammenlauf der Wasser „<em>eine</em> Sammlung” genannt. Auch die Brunnen sind handgefertigte Sammelplätze des Wassers, in welche die in der Erde versprengte Feuchtigkeit zusammenfließt. Die Bezeichnung „Sammelort” bedeutet also nicht die nächsten besten Ansammlungen der Wasser, sondern die vornehmlichste und größte, in der das ganze Element beisammen erscheint. Denn wie das Feuer zu unserm Gebrauch wohl in kleine Teile zerlegt, im Äther aber in Masse ausgegossen ist, und wie auch die Luft wohl in kleinen Mengen gesondert ist, aber den Raum um die Erde in Masse einnimmt, so gibt es auch beim Wasser trotz einiger kleiner, abgesonderter Ansammlungen nur <em>einen</em> Sammelort, der das ganze Element von den übrigen Sammlungen scheidet. Denn die Seen, sowohl die nördlichen wie die, welche in Griechenland, Makedonien, Bithynien und Palästina liegen, sind offenbar auch Wasseransammlungen; aber hier ist von der allergrößten, die an Größe der Erde gleichkommt, die Rede. Niemand wird leugnen, daß jene Seen eine Menge Wasser fassen; aber Meer im eigentlichen Sinne wird sie doch wohl niemand nennen wollen, obschon einige ebenso salz- und erdhaltig sind wie das große Meer, so z. B. der Asphaltsee in Judää und der Serbonitissee, der zwischen Ägypten und Palästina der Wüste Arabiens vorlagert. <em>Seen</em> sind das; dagegen gibt es nur ein <em>Meer</em>, wie die erzählen, welche die Welt bereist haben. Wohl wähnen einige, das Hyrkanische und Kaspische Meer hätten ihre eigenen Grenzen; aber wenn man den Geographen glauben darf, so sind sie doch miteinander durch einen unterirdischen Kanal verbunden und münden beide zusammen in das große Meer, wie sich auch das Rote Meer mit dem jenseits des Gades vereinigen soll. Warum hat nun Gott, fragen sie, die Wasseransammlungen <em>Meere</em> genannt? Weil zwar die Gewässer an <em>einem</em> Sammelort zusammengeflossen sind, der Herr aber die Wasserbehälter, d.h. die Busen, die von der sie umgebenden Erde in ihrer eigenen Form belassen sind, Meere genannt hat. So ist ein anderes das nördliche, ein anderes das südliche, ein anderes das östliche und wieder ein anderes das westliche Meer. Auch haben die Meere eigene Namen: so sind der Pontus Euxeinos, die Propontis, der Hellespont, das Ägäische und Jonische, das Sardo(i)nische, Sizilische und Tyrrhenische Meer verschiedene Meere. Zahllos sind die Namen der Meere; sie alle der Reihe nach hier anzuführen, wäre ebenso langweilig wie geschmacklos. Deshalb also hat Gott die Wasseransammlungen Meere genannt. Dahin hat uns der Gang der Rede geführt; wir wollen aber wieder auf unseren Ausgangspunkt zurückkommen.</p><p>„Und Gott sprach: Das Wasser sammle sich an <em>einem</em> Sammelort, und es erscheine das Trockene.” Er sagte nicht: „Und es erscheine die Erde”, damit es nicht den Anschein gewinnt, als wäre sie noch ungestaltet, schlammig, mit Wasser vermengt gewesen, und als hätte sie ihre eigentümliche Gestalt und Kraft noch nicht gewonnen. Zugleich aber schuf der Schöpfer, damit wir nicht der Sonne die Austrocknung der Erde zuschrieben, die Trockenheit der Erde <em>vor</em> der Entstehung der Sonne. Gib aber wohl auf den Sinn der Schrift acht, wornach nicht bloß das überflüssige Wasser von der Erde abfloß, sondern auch alles, was in der Tiefe mit ihr vermischt war, dem unerbittlichen Gebot des Herrn gehorsam, sich verzog. „Und so geschah es.” Hinlänglich zeigt dieser Zusatz, daß das Wort des Schöpfers sich verwirklichte.</p><p>In vielen Abschriften der Bibel ist noch beigefügt: „Und das Wasser unter dem Himmel sammelte sich an seine Sammelorte, und es kam zum Vorschein das Trockene,” Diese Worte hat kein anderer Übersetzer überliefert, noch scheint der hebräische Text sie zu haben. Und in der Tat ist nach der Konstatierung: „Und es ward so”, die Wiederholung derselben Sache überflüssig. Die verlässigeren Abschriften haben deshalb an dieser Stelle einen Obelos, das Zeichen der Unechtheit.</p><p>„Und Gott nannte das Trockene Erde; die Sammelbecken der Wasser aber nannte er Meere.” Warum ward denn schon früher gesagt: „Es sollen sich sammeln die Wasser an einem Sammelort, und es komme zum Vorschein das Trockene”? Warum heißt es denn nicht: „Und es erscheine die Erde”? Und warum steht hier wiederum: „Es komme zum Vorschein das Trockene, und Gott nannte das Trockene Erde”? Antwort: Weil das Trockene die eigentümliche Eigenschaft, gleichsam das Charakteristische der Erdsubstanz ist; „Erde” aber ist bloße Sachbenennung. Wie das Wort „vernünftig” eine Eigenschaft des Menschen ausdrückt, das Wort „Mensch” aber das Lebewesen bezeichnet, dem diese Eigenschaft zukommt, so ist auch die Trockenheit eine besondere und vorzügliche Eigenschaft der Erde. Das also, dem die Trockenheit eigentlich zukommt, wird Erde genannt, wie das Wesen, dem das Wiehern eigen ist, Pferd genannt wird. Das ist aber nicht bloß bei der Erde der Fall, sondern auch jedes andere Element hat seine besondere, ihm zugeteilte Eigenschaft, durch die es sich von den andern unterscheidet und sich in seiner Eigenart kenntlich macht. So hat das Wasser als seine besondere Eigenschaft die Kälte, die Luft die Feuchtigkeit, das Feuer die Wärme. So betrachtet gelten diese Elemente als die primären (= Ur-)Elemente der zusammengesetzten Körper; sind sie aber schon in einem Körper dargestellt und fallen sie in die Sinne, so kommen jene Eigenschaften nur noch vermischt vor. Überhaupt existiert nichts Sichtbares und Sinnfälliges ganz für sich allein, einfach und rein; vielmehr ist die Erde trocken und kalt, das Wasser feucht und kalt, die Luft warm und feucht, das Feuer warm und trocken. So ist mit der Verbindung der Eigenschaften die Möglichkeit gegenseitiger Vermischung gegeben. Ein jedes Element vermischt sich vermittels der gemeinsamen Eigenschaft mit dem nächst verwandten, und auf dem Wege der Gemeinschaft, in der ein Element mit dem jeweils nächsten steht, verbindet es sich (schließlich) mit dem entgegengesetzten. So z. B. verbindet sich die trockene und kalte Erde mit dem Wasser, wegen der Kältequalität ihm verwandt, und vereinigt sich durch das Wasser mit der Luft, weil das Wasser, mitten zwischen beide gestellt, gleichsam wie mit zwei Händen mit seinen beiden Eigenschaften die benachbarten Elemente erfaßt, nämlich die Erde mittels der Kalte, die Luft mittels der Feuchtigkeit. Die Luft sodann vermittelt die Versöhnung zwischen den feindlichen Naturen des Wassers und Feuers, indem sie mit dem Wasser durch die Feuchtigkeit, mit dem Feuer durch die Wärme sich verbindet. Das Feuer aber, von Natur warm und trocken, verbindet sich mit der Luft, kehrt aber durch seine Trockenheit wieder zur Gemeinschaft mit der Erde zurück. Und so entsteht ein harmonischer Reigen und Chor, weil alle Elemente zusammenstimmen und sich zusammenreihen (συστοιχούντων); deshalb ist eigentlich für sie die Bezeichnung „Reihen” (στοιχεὶα = Reigen, Reihen, Elemente) gut angepaßt. Das habe ich gesagt, um zu erklären, weshalb Gott das Trockene Erde genannt hat, nicht aber die Erde das Trockene genannt hat. Denn das Trockene ist nicht etwas erst später der Erde Hinzugekommenes, sondern gehörte von Anfang an zu ihrem Wesen. Denn das, was ihr die Existenzbedingungen schafft, ist von Natur früher und vorzüglicher als das, was hernach hinzukommt. Daher wurden natürlich auch die Merkmale für die Erde aus deren früheren und älteren Eigenschaften hergenommen.</p><p>„Und Gott sah, daß es schön war.” Mit diesem Ausdruck will aber nicht etwa gesagt sein, das Meer habe auf Gott einen gefälligen Eindruck gemacht. Denn der Schöpfer sieht die Schönheiten der Schöpfung nicht mit Augen, sondern er betrachtet die Dinge in seiner unerforschlichen Weisheit. Ein entzückendes Schauspiel ist es ja um das weißschäumende Meer, wenn lautlose Stille es umfängt, entzückend auch, wenn sanftes Windeswehen seinen Rücken kräuselt, und es bald purpurrot, bald dunkelblau aufleuchtet, wenn es nicht ungestüm das nahe Ufer peitscht, sondern gleichsam in friedlicher Umarmung es kosend umspült. Aber nicht so, dürfen wir glauben, hat die Schrift es gemeint, da sie sagt, Gott habe das Meer schön und entzückend gefunden; vielmehr wird hier das Schöne nach dem Zwecke der Schöpfung beurteilt. Demnach ist das Meer schön erstens, weil das Meereswasser die Quelle aller Erdenfeuchtigkeit ist. Zerteilt in den verborgenen Gängen, wie ersichtlich an den porösen und zerklüfteten Teilen des Festlandes, in die das wogende Meer kanalartig sich ergießt, wird es zunächst in gewundenen, nicht direkt an die Oberfläche führenden Durchlässen eingeschlossen. Wenn nun der Wind das Meer bewegt, dann durchbricht das (unterirdische) Wasser die Oberfläche und fließt heraus; infolge der Filtration verliert es die Bitterkeit und wird trinkbar. Wenn es aber beim Durchgange durch Metallschichten schon eine höhere Temperatur erreicht, so wird es eben infolge der Bewegung oft sogar siedend und glühend, wie man vielfach auf Inseln und an Küstenstrichen konstatieren kann. Um kleine Vorgänge neben großartige Erscheinungen zu stellen - es gibt sogar mitten auf dem Festlande gewisse Örtlichkeiten nahe von Flußwassern, wo Ähnliches sich abspielt. Wozu habe ich das gesagt? Zum Beweis, daß die ganze Erde unterminiert ist, und das Wasser in verborgenen Kanälen der Heimat des Meeres entrinnt.</p><p>Schön ist also das Meer vor Gott wegen der in der Tiefe (der Erde) rinnenden Feuchtigkeit, schön auch, weil es der Sammelort der Flüsse ist, die Strömungen von überall her aufnimmt und doch in seinen Grenzen bleibt, schön auch, weil es in gewissem Sinne Ursprung und Quelle des Wassers in der Luft ist. Ist es nämlich von den Sonnenstrahlen erwärmt, so gibt es das leichte Wasser in Form von Dunst ab, der, in die obere Region emporgegangen, dann erkaltet wegen der hohen Lage, in der die Strahlenbrechung am Erdboden nicht mehr wirksam ist, noch weiter abgekühlt durch den Wolkenschatten, schließlich in Regen sich verwandelt und die Erde befeuchtet. Das wird doch gewiß niemand bezweifeln, der beobachtet hat, wie mit Wasser gefüllte Kessel über dem Feuer oft sich entleerten, weil alles siedende Wasser darin in Dunst sich auflöste. Aber man kann auch sehen, wie die Seeleute das Meerwasser sieden und die Dünste mit Schwämmen auffangen, um in der Not wenigstens einigermaßen das Bedürfnis zu befriedigen.</p><p>Das Meer ist aber auch noch auf andere Weise schön vor Gott, weil es die Inseln umschließt und ihnen sowohl Reiz leiht wie Sicherheit bietet. Ferner ist es auch schön, weil es die entlegensten Länder miteinander verbindet, den Seefahrern einen ungehinderten Verkehr gewährt, durch die es uns auch Neuigkeiten bringt, den Kaufleuten Reichtum verschafft und leicht die Lebensbedürfnisse befriedigt, indem es den Produzenten die Ausfuhr ihres Überflusses ermöglicht, denen aber, die Mangel leiden, die Beschaffung des Fehlenden erleichtert. Doch wie kann ich die ganze Schönheit des Meeres, wie sie sich dem Auge des Schöpfers darstellte, genau sehen? Ist aber das Meer schön und lobenswert vor Gott, wie viel schöner ist dann die Versammlung einer solchen Gemeinde, in der die vereinte Stimme der Männer, Frauen und Kinder gleich einer ans Ufer schlagenden Welle in unsern Gebeten zu Gott emporsteigt? In tiefer Ruhe steht sie unerschüttert da; die Geister der Bosheit konnten mit ihren häretischen Lehren sie nicht in Verwirrung bringen. Macht euch würdig des Wohlgefallens vor dem Herrn dadurch, daß ihr diese schöne Ordnung aufs ehrenvollste wahrt in Christus Jesus, unserm Herrn, dem Ehre und Herrschaft von Ewigkeit zu Ewigkeit. Amen.</p><h2>5</h2><p><em>Das Sprossen der Erde</em></p><p><em>Inhalt: Gen 1,11: „Die Erde sprosse.” Das Schöpferwort ward zum Naturgesetz der Pflanzenwelt. - Dem Schöpfer, nicht der Sonne dankt die Erde ihre Vegetation, mit der Tier und Mensch versorgt werden (c. 1). Inhalt des Ausdruckes „Samen treibend”. Widerlegung des Einwandes, daß den Pflanzen vielfach der Samen fehle. - Die herrliche Flora erinnere an den Schöpfer und deren Welken an des Menschen eigene Vergänglichkeit (c. 2). Wunderbares Wachstum (Entwicklungsphasen) und Gestaltung jeder Einzelpflanze (c. 3). Nebst „Nutzpflanzen” auch schädliche und giftige, die aber nicht zwecklos sind, sondern nur den Menschen zur Vorsicht mahnen, Tieren zur Nahrung und Menschen zu Arzneimitteln dienen (c. 4). Das Gesetz von der Erhaltung der Art Folge des Schöpferwortes. Degenerationserscheinungen sind zufällig. Unkraut und Wachstum der Samen haben auch symbolische Bedeutung. - Ursprünglich (vor dem Sündenfall) üppigste Vegetation (c. 5). Erschaffung und Eigenart der Bäume. Die Dornenrose als Sinnbild. Die Fortpflanzung jeder Baumart durch Samen oder Triebe gesichert. Ölbaum und Weinstock sind besondere Edelsorten und haben eine reiche Symbolik (c. 6). Die Mannigfaltigkeit der Bäume, verschieden ihre Verwertung, ihre Gestaltung, Rinde und Forterhaltung. Künstliche Veredelung gewisser Bäume. Verschieden ihre Früchte, ihr Geschlecht. Natürliche und künstliche Befruchtung der Bäume (Palme). Nutzen der Wildfeige für die Edelfeige, eine Mahnung für Christen, von Andersgläubigen zu lernen (c. 7). Reichtum der Obstsorten; die Reifung der Früchte verschiedentlich von der Sonne abhängig. - Die Feuchtigkeit wirkt sich in den Baumarten und Baumteilen nach Geschmack, Farbe und Geruch verschieden aus. - Die üppige Vegetation mahnt zum Preise des Schöpfers. Bemerkenswert noch das wechselnde oder immergleiche Blattwerk der Bäume und das Doppelleben der Tamariske als Bild der Charakterlosigkeit (c. 8-9). Das Schöpferwort zum ewigen Naturgesetz geworden (c. 10).</em></p><p>„Und Gott sprach: Die Erde sprosse das Grün des Grases, Samen treibend nach seiner Art, und die Fruchtbäume, fruchtbringend nach ihrer Art, deren Samen in sich selbst enthaltend.” Folgerichtig ward der Erde, nachdem sie der Wasserlast losgeworden war und sich ausgeruht hatte, der Befehl gegeben, zuerst Grünes, dann Holz hervorzubringen, wie wir es ja auch heute noch beobachten können. Denn die Stimme von damals und jener erste Befehl wurde gleichsam ein Gesetz der Natur, blieb in der Erde und gab ihr für die Folge die Kraft, zu gebären und Früchte zu bringen. „Die Erde sprosse.” Das erste ist das Sprossen. Wenn dann die Keime ein wenig hervorragen, entwickelt sich das junge Grün; nach einigem Wachstum wird dies zum Gras; dann entwickeln sich allmählich die Halme, bis schließlich der Same in seiner vollendeten Entwicklung dasteht. Das Treiben und Grünen ist bei allen Gewächsen gleich. „Die Erde <em>sprosse</em> das Grün des Grases!” Die Erde soll von sich selbst das Sprossen bewirken und keine Hilfe anderswoher benötigen.</p><p>Freilich meinen manche, die Sonne sei schuld am Wachstum der Erde, indem sie mittels der Wärme die Triebkraft aus der Tiefe der Erde an die Oberfläche ziehe. Aber eben deshalb ist die Ausschmückung der Erde älter als die Sonne, damit die, welche in jenem Irrtum befangen sind, auch aufhören, die Sonne als die vermeintliche Quelle des Lebens anzubeten. Wenn sie sich nun überzeugen, daß die Erde schon vor dem Entstehen der Sonne in ihrem vollen Schmucke dastand, und wenn sie sich sagen, daß die Sonne jünger ist als Gras und Grün, dann werden sie doch die übertriebene Bewunderung für sie aufgeben. - Ward nun dem Vieh das Futter bereitet, ohne daß die Vorsehung an unsere Nahrung gedacht hätte? Nein! Denn der, welcher Rind und Pferd mit Futter versorgt hat, bereitet auch dir Reichtum und Genuß. Denn wer dein Vieh ernährt, bestellt damit in noch reicherem Maße dir den Lebensunterhalt. Was bedeutet denn die Entstehung der Samen anders als eine Fürsorge für die Erhaltung deines Lebens? Zudem dienen viele Kräuter und Gemüse dem Menschen zur Nahrung.</p><p>„Die Erde sprosse das Grün des Grases, Samen treibend”, sagt er, „nach seiner Art.” Wenn also eine Grasart auch nur Tieren nützlich ist, so kommt doch der Nutzen, den diese davon haben, auch uns zugute, und uns ist der Nießbrauch der <em>Samen</em> vorbehalten, so daß der Sinn der Worte der ist: „Es sprosse die Erde das Grün des Grases <em>und</em> Samen, treibend nach seiner Art.” Auf diese Weise läßt sich ja auch die richtige Abfolge der Worte herstellen - denn hier scheint die Zusammenstellung nicht die richtige zu sein -, und wird der notwendige Verlauf im Naturgeschehen gewahrt bleiben. Denn das erste ist das Sprossen, dann das junge Grün, dann das Wachstum des Grasest dann der Abschluß des Wachstums im Samen.</p><p>Aber wie, fragen sie, kann die Schrift beweisen, daß alle Organismen der Erde Samen tragen, wo doch augenscheinlich weder der Schilf noch das Futterkraut noch das Minzkraut, weder Saffran noch Knoblauch noch Binse noch sonst viele andere Pflanzenarten einen Samen hervorbringen? Darauf antworten wir, daß viele Gewächse der Erde in den unteren Teilen, in der Wurzel ihre Samenkraft haben. So z. B. treibt der Schilf nach einjährigem Wachstum aus der Wurzel einen Auswuchs, der den neuen Samen enthält. Das tun noch unzählige andere Gewächse auf der Erde, die alle in den Wurzeln die Fortpflanzungskraft enthalten. Deshalb steht es außer allem Zweifel, daß in jeder Pflanze entweder Same oder Samenkraft verborgen liegt. Und das ist der Sinn des Ausdruckes: „<em>Nach ihrer Art</em>.” Denn der Schößling des Schilfrohrs bringt keinen Ölbaum hervor, vielmehr entsteht aus einem Schilfrohr wieder ein anderes Schilfrohr, und aus den Samen sprossen nur mit dem Gesäten verwandte Pflanzen hervor. Und so ist das, was bei der Urschöpfung der Erde entsprossen, bis heute erhalten, da bei der Folge der Zeugungen die Art ungetrübt dieselbe bleibt.</p><p>„Es sprosse die Erde.” Bedenke, wie auf diesen kurzen Ruf und den knappen Befehl hin die erkaltete und unfruchtbare Erde sogleich zu kreißen und zu gebären anfing, wie sie gleichsam ihr Trauer- und Klagegewand ablegte, dafür das Freudengewand anlegte und frohlockend über ihren eigenen Schmuck unzählige Pflanzen hervorbrachte.</p><p>Ich wollte, du ließest das Wunder der Schöpfung stärker auf dich wirken, damit du immer, wo du gehst und vor einer Pflanzenart stehst, eine lebhafte Erinnerung an den Schöpfer bekommst. Vor allem denke, wenn du das Grün des Grases und eine Blume siehst, an die menschliche Natur, und erinnere dich an das Bild des weisen Isaias, daß „alles Fleisch wie Gras ist und alle Herrlichkeit des Menschen wie des Grases Blume”! Die Kurzfristigkeit des Lebens, die flüchtige Wonne und Heiterkeit des menschlichen Glückes hat hier beim Propheten das treffendste Bild gefunden. Heute körperlich gesund und wohlgenährt, strotzend in der gesunden Farbe seiner Jugendblüte, munter und heiter, kraftvoll, ohne seinesgleichen zu finden - morgen ist derselbe elend, vom Alter geschwächt oder durch Krankheit entkräftet. Da steht einer in Ansehen wegen der Größe seines Reichtums; es umgibt ihn eine Menge Schmeichler, es begleiten ihn vermeintliche Freunde, die nach seiner Gunst haschen, es umlagert ihn ein Haufe von gleich heuchlerischen Verwandten und zahllosen Schmarotzern - teils des Essens, teils anderer Bedürfnisse wegen -, die er beim Aus- und Heimgehen hinter sich herschleppt und dadurch den Neid aller, die ihm begegnen, weckt. Füge noch zum Reichtum politische Bedeutung oder auch Ehrenstellen aus der Hand von Regenten, eine Minister- oder Feldherrnwürde, den Herold, der mit lauter Stimme vor ihm her ruft, die Liktoren, die überall den Untertanen schwere Furcht einjagen, mit Schlägen, Güterkonfiskation, mit Verbannung und Fesseln drohen, woraus sich für die Untergebenen eine unerträgliche Furcht anhäuft! - und was dann? Eine einzige Nacht, ein Fieber, eine Brustfell- oder Lungenentzündung rafft plötzlich diesen Menschen von den Menschen hinweg, macht jäh der Rolle, die er spielte, ein Ende, und jene Herrlichkeit verschwindet wie ein leerer Traum. Deshalb hat der Prophet die menschliche Herrlichkeit mit der so rasch welken und hinfälligen Blume verglichen.</p><p>„Die Erde sprosse das Grün des Grases, Samen treibend nach seiner Art und Ähnlichkeit.” Auch jetzt noch bezeugt die Ordnung des Wachstums die ursprüngliche Anordnung; denn das Sprossen geht jedem Grün und jeder Pflanze voraus. Mag die Pflanze aus der Wurzel, aus einem Auswuchs von unten aufschießen, wie Saffran und Gras, sie muß erst sprossen und an die Oberfläche kommen. Oder mag sie aus einem Samen entstehen, auch dann muß zuerst kommen das Sprossen, dann das Grün, dann der grünende Halm, dann endlich die reifende Frucht auf dem schon dürren und festen Stengel.</p><p>„Es sprosse die Erde das Grün des Grases.” Wenn das Samenkorn in mäßig feuchte und warme Erde fällt, wird es weich und porös, greift in der umliegenden Erde um sich und zieht die ihm gleichartigen und verwandten Stoffe an sich. Die durch die Poren eindringenden und sich einsenkenden feinen Erdteilchen erweitern die Dimensionen des Samenkorns, so daß es nach unten Wurzeln schlägt, nach oben emportreibt und gleichviel Halme wie Wurzeln zeigt. Der immer warme Keim zieht mittels der Wurzeln die Feuchtigkeit an sich und führt soviel warmen Nährstoff aus dem Erdboden herbei, als erforderlich ist, und verteilt ihn auf den Halm, die Rinde, die Fruchtkapsel, die Frucht selbst und die Ähren. So erreicht jede Pflanze in allmählichem Wachstum ihre natürliche Größe, mag sie zu den Getreidearten, den Hülsenfrüchten, Gemüsen oder Gesträuchen gehören. <em>Ein</em> Grashalm, <em>eine</em> Pflanze reicht hin, deine volle Aufmerksamkeit zu fesseln für die Betrachtung der Kunst, die diese Organismen geschaffen hat, wie z. B. der Halm des Getreides von Knoten durchsetzt ist, damit diese Art von Bändergefüge die Last der Ähren leicht trage, wenn diese fruchtbeladen sich zur Erde neigen. Dem Hafer fehlen sie, weil sein Haupt mit nichts beschwert ist. Dagegen hat die Natur den Weizen mit solchen Bändern versehen; das Korn hat sie in eine Hülse eingeschlossen, damit es nicht so leicht von den Samenpickern geraubt werden kann. Auch noch durch die hervorstehenden Grannen werden die kleinen (Getreide-)Schädlinge wie durch Stacheln abgehalten.</p><p>Was soll ich erwähnen? Was mit Stillschweigen übergehen? Unter den reichen Schätzen der Schöpfung ist die Auswahl des Vorzüglicheren schwierig; das Übergangene wird aber als Lücke schmerzlich empfunden.</p><p>„Es sprosse die Erde das Grün des Grases!” Und alsbald waren mit den nützlichen Pflanzen auch die schädlichen da, mit dem Getreide der Schierling, mit den übrigen Nährpflanzen die Nießwurz, der Eisenhut, der Alraun und der Mohnsaft. Was nun? Sollen wir unsern Dank für die Nutzpflanzen einstellen und den Schöpfer anklagen wegen der unserm Leben schädlichen Dinge? Oder wollen wir uns nicht sagen, daß nicht alles unseres Bauches wegen geschaffen ist? Doch die für uns bestimmten Lebensmittel sind zur Hand und allen wohl bekannt. Jede Kreatur hat aber in der Gesamtschöpfung einen besonderen Zweck zu erfüllen. Durfte etwa deshalb, weil das Ochsenblut für dich schädlich ist, das Tier nicht geschaffen werden? Oder mußte das Tier, dessen Stärke unser Haushalt so vielfach benötigt, blutlos geschaffen werden? Nein, dir genügt dein Hausverstand zur Abwehr des Schädlichen. Wissen doch schon Schafe und Ziegen sich zu hüten vor dem, was ihnen schadet, obschon sie nur mit äußeren Sinnen das Schädliche erkennen. Für dich aber, dem eine Vernunft, eine vorteilhaft arbeitende Arzneikunde, die Erfahrung der Geschädigten, die dich die Flucht vor Schädlichem lehrt, zu Gebote steht, für dich soll es, ich bitte dich, schwer sein, von dem Giftigen dich fernzuhalten? Doch, nichts von all dem ist umsonst und zwecklos erschaffen. Entweder dienen sie dem Vieh zur Nahrung oder die Arzneikunde hat darin ein Mittel zur Linderung verschiedener Leiden gefunden. Den Schierling fressen die Stare, ohne am Gift Schaden zu nehmen, weil ihr Körper dementsprechend geschaffen ist. Am Magenmunde haben sie nämlich feine Durchgänge, so daß sie den Schierling eher verdauen, bevor die von ihm ausgehende Kälte die edleren Teile erfaßt. Die Nieswurz dient den Wachteln zur Speise, die gleichfalls dank ihrer (Körper-)Temperatur daran keinen Schaden nehmen. Ja eben diese Pflanzen sind unter Umständen auch uns von Nutzen: Durch den Alraun führen die Ärzte den Schlaf herbei, durch Opium stillen sie die heftigen Leibesschmerzen. Einige haben mit Schierling auch schon das Feuer der Begierden gedämpft und mit der Nieswurz viele langwierige Leiden gehoben. Was du dem Schöpfer zum Vorwurfe machen zu können glaubtest, das hat jetzt bei dir zur Vermehrung deiner Dankbarkeit geführt.</p><p>„Es sprosse die Erde das Grün des Grases.” Wieviele von selbst sich darbietende Nahrung nennt er doch damit, Nahrung in Wurzeln, in der Pflanze selbst und in Früchten! Wieviel Nahrung, die uns als Frucht der Arbeit und der Landwirtschaft zufällt! Nicht sofort hieß Gott die Erde Samen und Frucht hervorbringen, sondern erst sprossen und grünen und dann sich zum Samen vollenden; denn dieser erste Befehl sollte der Natur Norm werden für ihre spätere Entwicklung. Wie bringt nun aber, fragt man, die Erde Samen „nach seiner Art” hervor, wo wir doch oft gelben Weizen aussäen und schwarzen einheimsen? Doch hiebei handelt es sich, nicht um eine Verwandlung in eine andere Art, sondern gleichsam um eine Krankheit und Abnormität des Samens. Denn der Weizen hörte nicht auf, Weizen zu sein, sondern ist nur schwarz geworden durch den Brand, wie man auch aus der Benennung selbst ersehen kann. Durch übergroße Kälte brandig geworden, hat er Farbe und Geschmack geändert. Auch soll er in geeignetem Boden und bei günstiger Temperatur sein ursprüngliches Aussehen wieder bekommen.</p><p>So wirst du in der Vegetation wohl nichts finden, was jenem Befehl zuwiderginge. Der sogenannte Lolch und die übrigen unreinen Samenarten, die sich unter das Getreide mischen und in der Schrift gewöhnlich als Unkraut bezeichnet sind, entstehen nicht durch Verwandlung des Getreides, haben vielmehr eigenen Ursprung und eigene Art. Sie sind ein Sinnbild von denen, welche die Lehren des Herrn verfälschen, die, nicht rechtmäßig im Worte Gottes unterwiesen, sondern in der Schule des Bösen verdorben, mit dem gesunden Leibe der Kirche sich vermischen, um heimlich ihre Giftstoffe den Arglosen einzuträufeln. Anderseits vergleicht schon der Herr die Vervollkommnung derer, die an ihn glauben, mit dem Wachstum der Samen, da er sagt: „Wie wenn ein Mensch Samen auf die Erde streut; er mag schlafen oder aufstehen bei Tag und bei Nacht; der Same keimt und wächst auf, ohne daß er es wahrnimmt. Die Erde trägt von selbst Frucht, zuerst den Halm, dann die Ähre, dann die volle Frucht in der Ähre.”</p><p>„Es sprosse die Erde das Grün des Grases.” Und in demselben Augenblicke begann die Erde zu sprossen, um die Gesetze des Herrn zu erfüllen, durchlief alle Formen des Wachstums und brachte sofort sprossende Gewächse zur vollen Ausbildung: Die Wiesen waren üppig mit hohem Grase bedeckt, und die fruchtbaren, von Saaten strotzenden Felder glichen bei der schwankenden Bewegung der Ähren dem wogenden Meere. Alles Grün und jede Art von Küchengewächs und was es sonst gibt an Gesträuchen und Gemüsen, bot damals die Erde in aller Fülle dar. Auch gab es in der damaligen Vegetation keinen Fehlschlag: keine bäuerliche Unerfahrenheit oder ungünstige Witterung oder sonst eine Ursache gefährdete das Wachstum. Auch hemmte noch kein Fluch die Fruchtbarkeit der Erde. Denn diese Güter sind älter als die Sünde, deretwegen wir verurteilt wurden, im Schweiße unseres Angesichtes das Brot zu essen.</p><p>Aber „auch fruchtbare Bäume,” heißt es, „welche Frucht tragen, die ihren Samen in sich haben, jeder nach seiner Art und Ähnlichkeit auf Erden”. Auf dies Wort hin erwuchsen dichte Wälder, schossen empor die höchsten Bäume, wie die Fichten, die Zedern, Zypressen und Pechföhren, waren sofort da die dichten Gesträuche mit ihrem Laubschmuck, die sogenannten Kranzgewächse, die Rosen, Myrten und Lorbeerbäume; sie alle, die es zuvor auf der Erde nicht gab, traten in einem Augenblicke ins Dasein, ein jedes Gewächs mit seiner charakteristischen Eigenschaft, mit all seinen Unterscheidungsmerkmalen, mit seiner spezifischen Erkennungsmarke? - Nur war damals noch die Rose ohne Dornen; erst später kamen zur Schönheit der Blume die Dornen, damit der süße Genuß auch die Trauer in der Begleitung habe und wir der Sünde gedächten, derentwegen die Erde dazu verurteilt wurde, uns Dornen und Disteln zu tragen.</p><p>Aber die Erde bekam doch Befehl, sagt man, „fruchtbare Bäume, die Frucht tragen auf Erden, die ihren Samen in sich selber haben”, hervorzubringen; und doch sehen wir viele Blumen, die weder Früchte noch Samen haben! Was sollen wir erwidern? Zunächst, daß die von Natur vorzüglicheren Bäume vorzugsweise erwähnt wurden, dann, daß ein scharfes Auge entdecken wird, wie alle entweder Samen tragen oder eine den Samen gleichwertige Kraft besitzen. Die Schwarzpappeln, Weiden, Ulmen, die Weißpappeln und alle derartigen Bäume scheinen keine sichtbare Frucht zu tragen; aber einen Samen wird man bei genauem Zusehen in jedem dieser Bäume finden. Die Hülse, die unten am Blatte hängt und die einige, die sich mit der Namengebung abgeben, Mischon nennen, hat die Kraft des Samens in sich. Denn alles, was naturgemäß von Zweigen ausgeht, schlägt meistens von da aus auch Wurzel. Bald treten an Stelle des Samens auch die Wurzeltriebe, welche die Gärtner zur Fortpflanzung der Art abtrennen.</p><p>Zuerst aber sind, wie gesagt, alle jene Bäume der Erwähnung gewürdigt worden, die vorab unser Leben fristen, die den Menschen mit ihren Früchten beschenken und ihm reichliche Nahrung spenden sollten: Da ist der Weinstock, der Wein erzeugt, um das Menschenherz zu erfreuen, der Ölbaum, der eine Frucht bringt, die das Antlitz durch Öl erheitern kann. Wieviele Naturerzeugnisse kommen da an <em>einem</em> Gewächs plötzlich zusammen! Die Wurzel des Weinstockes, die ringsum grünenden und weitauslangenden Reben über dem Boden, die Schossen, die Ranken, der Herling, die Trauben.</p><p>Und der Weinstock, besinnlich betrachtet, erinnert dich laut genug an deine eigene Natur. Denn du erinnerst dich sicher an das Gleichnis des Herrn, in dem er sich selbst einen Weinstock, seinen Vater den Gärtner und uns alle, die wir durch den Glauben der Kirche eingepflanzt sind, Reben genannt hat, und uns mahnt, viele Früchte zu bringen, damit wir nicht wegen Unfruchtbarkeit verdammt und dem Feuer überantwortet werden. Und immer wieder und überall vergleicht er die Menschenseele mit dem Weinstock: „Ein Weinberg”, sagt er, „ward meinem Lieblinge auf der Höhe an ergiebiger Stelle.” Und: „Ich habe einen Weinberg gepflanzt und mit einem Zaune umgeben.” Offenbar versteht er unter Weinberg die Menschenseelen, die er mit einem Zaune, d. h. mit dem Wall der Gebote und der Wache der Engel umgeben hat. „Denn der Engel des Herrn wird die beschützen, die ihn fürchten.” Sodann hat er gleichsam Schutzwehren um uns aufgestellt, indem er in der Kirche zuerst die Apostel, dann die Propheten und endlich die Lehrer bestellte, indem er mit dem Beispiele der alten, seligen Männer unser Gemüt emporhob und nicht zuließ, daß es zu Boden gedrückt und mit Füßen zerstampft zu werden verdiente. Er will auch, daß wir den Nächsten mit den Umarmungen der Liebe gleichsam wie mit Ranken umfassen und davon nicht ablassen, damit wir immer den Zug nach oben haben und wie an Bäumen gezogene Weinstöcke bis zu den höchsten Gipfeln emporsteigen. Er verlangt von uns, daß wir uns auch eingraben lassen. Eingegraben aber wird die Seele in der Abschüttelung der Weltsorgen, die eine Belastung unseres Herzens sind. Wer also die fleischliche Liebe und die Begierde nach Reichtum ablegt oder die Sucht nach erbärmlichem, eitlem Ruhm abscheulich und verächtlich findet, der ist gleichsam eingegraben und atmet wieder auf, weil er sich der törichten Last irdischer Gesinnung entledigt hat. Es darf aber der Weinstock - nach dem Sprichwort - nicht zu sehr ins Holz wachsen, d.h. wir dürfen nicht einherstolzieren und nach dem Lobe der Draußenstehenden jagen, sondern wir sollen fruchtbar sein, um dem wahren Gärtner unsere Schätze vorzeigen zu können. Du aber „sei wie ein fruchtbarer Ölbaum im Hause Gottes”, immer voll Hoffnung und voll Sorge um das im Glauben dir erblühende Heil. So wirst du dem Immergrün des Ölbaumes gleichen, wirst wie er viele Frucht bringen und zu jeder Zeit reichlich Almosen spenden.</p><p>Doch laßt uns wieder zurückkommen auf die Betrachtung der kunstvollen Anordnungen! Wie viele Baumarten kamen damals zum Vorschein, die fruchttragenden, die zu Dachgiebeln oder zum Schiffsbau, wieder andere zu Brennholz geeigneten! Und unter diesen Arten hat wieder jeder Baum eine verschiedene Anordnung seiner Teile. Schwierig freilich ist die Auffindung der jeweiligen Eigenart und die Beobachtung des Unterschiedes eines Baumes von andersgearteten: Die einen von ihnen schlagen tiefe Wurzeln, die andern haben sie an der Oberfläche; die einen haben einen geraden Wuchs und sind einstämmig, die andern sind niedrig und von der Wurzel an in viele Auswüchse geteilt. Alle Baumarten mit langen und weit in die Luft hinausgreifenden Ästen haben tiefe und in weitem Umkreise verteilte Wurzeln, wie wenn die Natur der von oben drückenden Last eine entsprechende Unterlage hätte geben wollen. Wie reich die Mannigfaltigkeit der Rinden! Die einen Bäume haben eine glatte, andere eine rauhe Rinde; die einen haben nur <em>eine</em> Rinde, andere mehrere Rinden. Das Wunderbare ist, daß du auch bei den Bäumen ähnliche Erscheinungen gewahrst wie beim menschlichen Jugend- und Greisenalter: Um die jungen und frischgrünenden Bäume spannt sich eine glatte Rinde, bei den alternden wird sie rauh und runzelig. Die einen schlagen, wenn abgehauen, wieder aus; die andern bleiben ohne Nachwuchs und haben von der Axt gleichsam den Todesstreich bekommen. Auch will man beobachtet haben, daß abgehauene und abgebrannte Fichtenbestände in Eichenwälder sich verwandeln. Auch wissen wir, daß Naturfehler von Bäumen durch sorgfältige Pflege der Landleute ausgebessert werden. So z.B. verwandeln die sauren Granatäpfel und die Bittermandeln den bitteren Saft in einen wohlschmeckenden, sobald man den Stamm an der Wurzel durchbohrt und einen saftigen Keil von der Pechföhre mitten durch das Mark hineintreibt. - Keiner, der in Sünden lebt, soll sich darum aufgeben, weiß er doch, daß Baumwartskunst die Eigenschaften der Bäume verändern kann, eifrige Seelsorge aber imstande ist, über alle Schwächen Herr zu werden.</p><p>Die Verschiedenheit der Fruchtbäume in Hinsicht der Früchteerzeugung ist aber so groß, daß man sie überhaupt nicht schildern kann. Denn nicht nur findet man an den verschiedenartigen Bäumen verschiedene Früchte, sondern schon bei der nämlichen Baumart ist der Unterschied groß. So ist die Frucht der männlichen Bäume verschieden von der der weiblichen, wie die Baumzüchter beobachtet haben, die denn auch die Palmen in männliche und weibliche einteilen. Man kann gelegentlich auch beobachten, wie der sogenannte <em>weibliche</em> Baum seine Zweige senkt, als fühle er den Trieb zur Begattung und verlange nach der Umarmung des männlichen Baumes, wie denn die Pflanzer des Palmenhains auf die Zweige etwas werfen wie Samen von den männlichen Bäumen - Psen nennen sie ihn -, worauf dann die Zweige wie im Gefühle des Genusses sich wieder emporrecken, und die Blätter des Baumes wieder ihre natürliche Stellung einnehmen. Dasselbe sagt man auch von den Feigenbäumen. Deshalb pflanzen die einen wilde Feigenbäume neben die veredelten. Andere wieder binden wilde Zweige auf die veredelten und fruchtbaren Feigenbäume, helfen so deren Schwäche nach und erhalten durch die wilden Zweige die bereits fallende und sich verlierende Frucht. - Was will dir dieses Rätsel der Natur sagen? Daß wir oft auch von den Andersgläubigen einen gewissen Ansporn zur Vollbringung guter Werke uns geben lassen sollen. Denn siehst du einen Heiden oder einen schuld einer verderblichen Häresie von der Kirche Getrennten eines enthaltsamen und überhaupt sittlich geordneten Wandels beflissen, dann spanne deinen Eifer noch mehr an, damit du gleich werdest dem fruchtbaren Feigenbaume, der aus der Gegenwart der wilden Zweige an Kraft gewinnt, das Abfallen (der Frucht) aufhält und sie sorgfältiger ausreifen läßt.</p><p>So mannigfach und verschieden ist also die Entstehungsweise der Bäume, um von so vielem nur ganz wenig zu sagen. Wer aber möchte die Mannigfaltigkeit der Früchte selbst aufzählen, ihre Gestalten, Farben, die Eigentümlichkeit ihres Geschmackes und die jeweilige Verwertbarkeit? Wer schildern, wie einige ohne Hülse von der Sonne gekocht werden, andere in Hülsen eingeschlossen reifen, wie die Bäume, deren Frucht zart ist, eine dichte Blätterdecke haben, so die Feige, diejenigen aber, deren Früchte härter, einen leichten Blätterschutz haben, so der Nußbaum. Die ersteren bedurften wegen ihrer Schwäche eines stärkeren Schutzes; letzteren aber wäre eine dichtere Decke wegen des Schattens der Blätter schädlich gewesen. Wie (weise) ist doch das Blatt des Weinstockes gespalten, daß die Traube den schädlichen Einflüssen der Luft widerstehe und anderseits den Sonnenstrahl durch die Dünne reichlich aufnehme! Nichts ohne Ursache, nichts durch Zufall; alles verrät eine unaussprechliche Weisheit. Welche Rede könnte alles erschöpfen? Wie könnte menschlicher Verstand alles genau durchgehen, so daß er alle die Eigentümlichkeiten erkennen, die Verschiedenheiten eines jeden Dinges deutlich unterscheiden und die verborgenen Ursachen vollständig darstellen könnte?</p><p>Ein und dasselbe Wasser, von der Wurzel aufgesogen, nährt anders die Wurzel selbst, anders die Rinde des Stammes, anders das Holz, anders den Kern. Ebendasselbe Wasser wird auch Blatt, teilt sich in Äste und Zweige und gibt den Früchten das Wachstum; auch die Träne und der Saft des Baumes entquillen derselben Ursache. Aber wie groß die hier obwaltende gegenseitige Verschiedenheit ist, kann mit keinem Worte ausgedrückt werden. Anders ist nämlich die Träne des Mastixbaumes, anders der Saft der Balsamstaude. Und einige Doldenpflanzen in Ägypten und Libyen weinen wieder eine andere Art von Säften aus. Auch soll der Bernstein zu Stein verhärteter Pflanzensaft sein. Ein Beleg für diese Ansicht sind die in ihm vorkommenden Hälmchen und sehr kleinen Tierchen, die sich auf den einst weichen Saft setzten und darin eingeschlossen wurden. Wer nicht die verschiedensten Eigenschaften der Säfte aus Erfahrung kennen gelernt hat, wird überhaupt nie die Sprache finden, deren Wirksamkeit darzustellen. Wie bildet sich aus derselben Feuchtigkeit im Weinstocke Wein, im Ölbaum Öl? Nicht bloß das ist erstaunlich, wie dort die Feuchtigkeit süß, hier fettig geworden ist, sondern daß auch unter den süßen Früchten selbst die unglaublichste Differenz in der Eigenschaft („süß”) obwaltet. Denn anders ist die Süßigkeit im Weinstocke, anders im Apfelbaum, anders in Feige und Palme. Ferner wünsche ich dir allen Eifer zur Untersuchung, wie dasselbe Wasser bald mild schmeckt, wenn es in gewissen Bäumen ist und dadurch süß wird, bald herb schmeckt, wenn es durch andere Bäume fließt und dabei sauer wird, und wie es im Wermut und Skamonienkraut sogar zur höchsten Bitterkeit sich steigert und den Gaumen angreift. Auch in den Eicheln und Hagebutten nimmt es die saure und herbe Eigenschaft an, während es in den Terebinthen und Nußbäumen eine zarte und ölige Natur bekommt.</p><p>Was braucht es, Fernliegendes zu erwähnen, wo doch das Wasser in demselben Feigenbaum ganz entgegengesetzte Eigenschaften annimmt? Es ist nämlich äußerst bitter im Safte, sehr süß dagegen in der Frucht. Ebenso ist es beim Weinstocke in den Reben sehr herb, in den Trauben aber sehr süß. Und erst wie vielerlei Farben! Auf einer Wiese siehst du dasselbe Wasser in dieser Blume rot, in einer andern purpur, blau in einer dritten und wieder in einer andern weiß. Noch reichere Abwechslung als die Farben bieten die Gerüche. Aber ich sehe, daß meine Rede schuld meiner unbegrenzten Vorliebe für diese Betrachtung über das Ziel hinausgeht, und müßte ich sie nicht auf das Notwendige einschränken und auf die Schöpfung wieder zurückkommen, so würde mir der Tag nicht hinreichen, die große Weisheit des Schöpfers euch auch in den kleinsten Erscheinungen nachzuweisen.</p><p>„Es sprosse die Erde fruchtbare Bäume, die Frucht tragen auf Erden.” Und alsbald bedeckten sich die Höhen der Berge mit Laub; kunstvolle Lustgärten taten sich auf, und der Flüsse Gestade schmückten sich mit tausenderlei Arten von Pflanzen. Die einen davon waren gepflanzt, um den Tisch des Menschen zu zieren, andere, um mit ihren Blättern und Früchten das Vieh zu ernähren. Wieder andere boten uns heilsame Arzneimittel in ihren flüssigen Absonderungen, Säften, Reisern, Rinden und Früchten; einfach alles, was die lange Erfahrung in den einzelnen Fällen als nützlich erkannt und herausgefunden hat, das hat die scharfsehende Vorsehung des Schöpfers vorher erkannt und ins Dasein gerufen. Wenn du nun die edlen und wilden Arten, die Wasser- und Landpflanzen, die blühenden oder nichtblühenden siehst, dann erkenne im Kleinen das Große, steigere deine Bewunderung immer mehr und mehre nur deine Liebe zum Schöpfer! Erwäg, wie er die einen Bäume mit Immergrün bekleidet, andere blätterlos geschaffen hat, und wie von den immergrünenden die einen das Laub abwerfen, die andern es immer behalten: Der Ölbaum und die Fichte werfen ihr Laub ab, wechseln es aber so unbemerkt, daß sie es nie zu verlieren scheinen. Die Palme aber behält immer ihre nämlichen Blätter vom ersten Sprossen an bis an ihr Absterben. Auch auf das achte noch, wie die Tamariske gleichsam doppellebig ist: sie zählt zu den Wasserpflanzen und findet sich doch auch sehr häufig in den Wüsten. Daher vergleicht auch Jeremias die schlechteren und zweideutigen Elemente mit dieser Pflanze.</p><p>„Die Erde sprosse!” Dieser kurze Befehl war alsbald eine große Natur und ein kunstvolles Gesetz; denn gedankenschnell rief er die Myriaden von Gewächsarten ins Dasein. Dieser Befehl wohnt immer noch in der Erde und treibt sie an, im periodischen Umlauf des Jahres ihre Kraft zu entfalten und Pflanzen, Samen und Bäume hervorzubringen. Wie die Kreisel auf einen einmaligen Antrieb hin die nachfolgenden Umdrehungen machen und sich um ihren eigenen Mittelpunkt fortwährend drehen, so hat auch der Naturlauf in jenem ersten Befehl seinen Anfang genommen und geht nun durch alle Zeit hindurch, bis er beim allgemeinen Weltende zum Abschluß kommt. Diesem wollen auch wir alle entgegeneilen, reich an Früchten und voll guter Werke, damit wir, in das Haus des Herrn verpflanzt, in den Vorhöfen unseres Gottes erblühen in Christus Jesus, unserm Herrn, dem Ehre und Macht in alle Ewigkeit. Amen.</p><h2>6</h2><p><em>Die Erschaffung der Lichter</em></p><p><k> <em>Inhalt: Die fruchtbare Betrachtung der Weltschöpfung bedingt einen für das Thema interessierten und in besinnlicher Anschauung des Himmels geübten Geist, anderseits einen Führer durch das Wunderland der Welt. - Die sichtbare, vergängliche Schönheit läßt die unsichtbare, ewige ahnen (c. 1). Gen 1,14. Durch die zweite göttliche Person wurden Sonne und Mond als Träger des früher geschaffenen Lichtes (c. 2). In Sonne und Mond ist das Licht nicht wesenhaft (Substanz), sondern Eigenschaft oder Zugabe (Akzidenz) -, deutlich beweisbar aus den Mondphasen. Diese Lichter scheiden und regeln Tag und Nacht (c. 3). Meteorologische Einflüsse von Sonne und Mond (c. 4). Astrologie in all ihren Formen lächerlicher Unsinn (c. 5-6), in ihren Konsequenzen gottlos, unsittlich und wider alle Erfahrung (c. 7). Die Sonne verursacht durch ihren Lauf die Jahreszeiten und das jeweilige Klima, beherrscht auch den Tag (c. 8). Die Größe der Sonne nicht relativ, sondern absolut; in ihrer Entfernung erscheint sie trotzdem klein (c. 9). Die Größe der Sonne ersichtlich aus ihrer Lichtfülle. Mondgröße und Mondlicht. - Die Mondphasen erinnern an die Hinfälligkeit des Irdischen und den Wankelmut der Menschen. - Einflüsse des Mondes auf Fauna und Flora (c. 10). Weitere meteorologische und physikalische Einflüsse des Mondes (Stürme und Ebbe-Flut). Neue Beweise für die Größe des Mondes. Keine Mondbeschwörungen. - Sonne und Mond schwache Abbilder der Größe und Schönheit des Schöpfers. Schlußsegen (c. 11).</em></k></p><p>Wer Kämpfern zuschaut, muß auch selbst eine gewisse Spannkraft haben. Das mag man aus den allgemeinen Spielregeln ersehen, welche die Zuschauer beim Kampfspiele barhäuptig dasitzen heißen - wie mir dünkt, damit der einzelne nicht bloß dem Kämpfer zuschaue, sondern in gewissem Sinne auch selbst Kämpfer werde. So muß nun auch außer dem darstellenden Prediger so großer und außerordentlicher Wunder auch der Hörer der wirklich erhabenen und unaussprechlichen Weisheit von zu Hause ein großes Interesse für die Betrachtung des Themas mitbringen und mit mir nach Kräften am Kampfe teilnehmen, und zwar nicht so fast als Kritiker, sondern als Mitkämpfer, damit uns nicht etwa die Auffindung der Wahrheit entgehe, und meinen Irrtum alle Zuhörer büßen müssen. - Weshalb sage ich das? Weil es unsere Aufgabe ist, die Einrichtung der Welt zu erforschen und das Weltall zu betrachten, wobei wir aber nicht auf die Weisheit der Welt zurückgehen, sondern uns an die Unterweisung halten, die Gott seinem Diener (Moses) gegeben hat, zu dem er in bestimmter Form, nicht in Rätseln gesprochen hat. Dazu ist aber doch jedenfalls notwendig, daß die Freunde so erhabener Schauspiele nicht ungeschult und unvorbereitet zu unserem Vortrage kommen dürfen, wenn sie ihn verstehen wollen. Wenn du einmal bei heiterer Nacht zur unaussprechlichen Schönheit der Sterne emporgeschaut und dir Gedanken gemacht hast über den Schöpfer des Universums, wer mit diesen mannigfaltigen Blumen den Himmel geziert hat, und wie in der sichtbaren Welt das Notwendige vor dem Angenehmen kommt, wenn du ferner am Tage in besinnlicher Stunde die Wunder des Tages kennengelernt und aus dem Sichtbaren das Unsichtbare erschlossen hast - dann kommst du als ein wohlvorbereiteter Zuhörer und bist würdig, an diesem erhabenen und seligen Schauspiel teilzunehmen.</p><p>Nun wohlan, wie man Landkinder in der Stadt an der Hand nimmt und herumführt, so will auch ich wie ein Fremdenführer euch zu den verborgenen Wundern dieser großen Stadt führen. In dieser Stadt, in der unser angestammtes Vaterland ist, aus der uns der Menschenmörder, der Teufel, vertrieben hat, nachdem er den Menschen mit seiner Arglist in Ketten geschlagen hatte, hier kannst du die erste Schöpfung des Menschen und den alsbald uns erfassenden Tod besehen, den die Sünde gebar, die Erstgeburt des Teufels, des Erzmissetäters. Auch dich selbst wirst du kennen lernen, wie du zwar erdhaft von Natur, aber ein Werk der Hände Gottes bist, wie du zwar an Kraft weit hinter den unvernünftigen Geschöpfen kommst, und trotzdem auserwählter König der unvernünftigen und unbeseelten Kreatur bist, daß du in der natürlichen Ausstattung nachstehst, aber doch imstande bist, mit der erhabenen Vernunft dich gar bis zum Himmel aufzuschwingen. Wenn wir das lernen, dann werden wir uns selbst erkennen, Gott erkennen, den Schöpfer anbeten, dem Herrn dienen, den Vater preisen, unsern Ernährer lieben, den Wohltäter ehren und unablässig den Urheber unseres gegenwärtigen und künftigen Lebens anbeten, der durch den uns bereits verliehenen Reichtum auch seine Verheißungen beglaubigt und durch den Genuß der gegenwärtigen Güter uns die zu erwartenden bestätigt. Wenn schon die augenblicklichen Güter so groß sind, wie werden dann erst die ewigen sein? Wenn die sichtbaren so schön sind, wie werden dann die unsichtbaren sein? Wenn die Größe des Himmels das Maß menschlicher Berechnung übersteigt, welcher Verstand könnte dann das Wesen der ewigen Dinge ergründen? Wenn unsere der Vernichtung unterworfene Sonne so schön, so groß, so schnell in der Bewegung ist, so exakt an wohlgeordnete Umlaufszeiten sich hält, eine dem Weltall entsprechende Größe hat, die über dessen Verhältnis nicht hinausgeht, und in ihrer natürlichen Schönheit wie ein hellglänzendes Auge der Schöpfung leuchtet, so daß wir sie nie genug anschauen können - wie schön muß dann die „Sonne der Gerechtigkeit” sein! Wenn es für den Blinden eine Qual ist, diese nicht zu sehen, welche Qual wird es dann dem Sünder bereiten, des wahren Lichtes beraubt zu sein!</p><p>„Und Gott sprach: Es sollen Lichter werden an der Feste des Himmels, um auf der Erde zu leuchten, so daß sie scheiden mitten zwischen dem Tage und mitten zwischen der Nacht.” - Himmel und Erde waren vorangegangen; nach ihnen war das Licht erschaffen und Tag von Nacht geschieden worden, war das Firmament entstanden und war zum Vorschein gekommen das Trockene. Das Wasser war an einem Orte gesammelt und abgegrenzt; die Erde war angefüllt mit ihren (heimischen) Gewächsen, hatte tausenderlei Pflanzenarten hervorsprossen lassen und strotzte in üppigster Vegetation. Aber Sonne und Mond waren noch nicht da, damit die, welche Gott nicht kennen, die Sonne nicht den Urheber und Vater des Lichtes nennen und sie nicht als Schöpferin der erdentsprossenen Gewächse wähnen. Daher war es der <em>vierte</em> Tag, da Gott sprach: „Es sollen Lichter werden an der Feste des Himmels.”</p><p>Hast du den Redenden kennengelernt, so verbinde in Gedanken mit ihm sofort den Hörenden! „Es sprach Gott: Es sollen Lichter werden; und Gott schuf die beiden Lichter.” Wer sprach? Und wer schuf? Erkennst du darin nicht die Zweiheit der Personen? Überall im Berichte ist das Dogma der Theologie geheimnisvoll miteinverwoben. - Auch der Zweck für die Entstehung der Lichter ist beigefügt: „Um auf der Erde zu leuchten”, heißt es. War aber schon früher das Licht erschaffen, warum heißt es jetzt noch einmal, die Sonne sei „zum Leuchten” entstanden? Zunächst soll nun dir die eigentümliche Ausdrucksweise nicht lächerlich vorkommen; wir wollen uns nicht eure „gewählte” Sprache aneignen noch auf den Rhythmus in der Wortstellung aus sein. Denn bei uns gibt es keine Wortdrechsler noch Schönredner; vielmehr hat bei uns immer die Klarheit den Vorzug vor der Phrase. Beachte also, ob er mit den Worten „um zu leuchten” genügend ausgedrückt hat, was er sagen wollte; denn anstatt „um zu glänzen” sagt er: „um zu leuchten.” Das steht aber nicht im Widerspruche mit dem, was vom Lichte gesagt worden ist. Damals nämlich wurde die <em>Lichtsubstanz</em> geschaffen; jetzt aber wurde der <em>Sonnenkörper</em> gebildet, um jenem erstgeschaffenen Lichte (Licht-)Träger zu sein. Denn etwas anderes ist das Feuer, etwas anderes die Lampe: das Feuer hat die Kraft zu leuchten, letztere ist gemacht worden, um denen zu leuchten, die Licht brauchen. Ebenso sind jetzt auch diese Lichter für jenes reine, klare und immaterielle Licht zu Trägern gemacht worden. Wie auch der Apostel von gewissen Lichtern in der Welt redet, das wahre Licht der Welt aber etwas anderes ist, mit dem in Gemeinschaft die heiligen Lichter geworden sind für die Seelen, die sie unterwiesen und der Finsternis der Unwissenheit entrissen, so hat auch jetzt der Schöpfer des Weltalls unsere Sonne für jenes glänzendste Licht erschaffen und in der Welt angezündet.</p><p>Keinem darf das Gesagte unglaublich scheinen, daß nämlich etwas anderes der Glanz des Lichtes, etwas anderes der Lichtkörper sei. Zunächst unterscheiden wir bei allen zusammengesetzten Dingen die empfängliche Wesenheit und die ihr zukommende Eigenschaft (Akzidenz). Wie nun etwas anderes die natürliche Weiße ist und etwas anderes der weißgestrichene Körper, so sind auch die eben genannten Dinge von Natur verschieden, sind aber durch die Macht des Schöpfers verbunden worden. Auch sage mir nicht, diese Dinge seien unmöglich voneinander zu trennen! Denn ich behaupte ja nicht, daß die Trennung des Lichtes vom Sonnenkörper dir oder mir möglich sei; aber was wir <em>logisch</em> trennen können, das kann vom Schöpfer der Natur auch in Wirklichkeit getrennt werden. Dir ist ja auch die Trennung der Brennkraft des Feuers vom Glänze eine Unmöglichkeit; aber Gott, der durch ein wunderbares Schauspiel seinen Diener an sich ziehen wollte, legte in den Dornbusch ein Feuer, das nur eine Leuchtkraft, aber keine Brennkraft äußerte. Das bezeugt auch der Psalmist mit den Worten: „Die Stimme des Herrn, der die Feuerflamme zerteilt.” Daher belehrt uns auch eine geheimnisvolle Lehre, daß bei der Vergeltung unseres diesseitigen Lebens und Wirkens die Natur des Feuers geteilt werde, näherhin das Licht den Gerechten zur Freude, das schmerzende Brennen den Übeltätern zur Strafe bestimmt sei.</p><p>Sodann können wir auch aus den Mondphasen die Verlässigkeit unserer Untersuchung bestätigen. Denn wenn er zu scheinen aufhört und abnimmt, so berührt das seinen Körper nicht; vielmehr bietet er uns die Erscheinungen des Ab- und Zunehmens, insofern er das ihn umgebende Licht ablegt und wieder annimmt. Daß aber beim Abnehmen des Mondes der Körper unverletzt bleibt, bezeugt deutlich der Augenschein. Denn bei reinem und ganz nebelfreiem Himmel kannst du, zumal wenn der Mond gerade die sichelförmige Gestalt hat, beobachten, daß sein dunkler und nicht beleuchteter Teil denselben Radius wie der Vollmond hat. Daher sieht man den vollen Kreis ganz deutlich; das Auge braucht nur den dunklen und finsteren Busen mit dem beleuchteten Teil in Beziehung zu setzen. Sag mir auch nicht, das Licht des Mondes sei ein entlehntes, weil er abnimmt, wenn er sich der Sonne nähert, und zunimmt, wenn er ferne steht. Denn das zu untersuchen, ist jetzt nicht unsere Aufgabe, sondern darum handelt es sich, ob sein Körper etwas von der Leuchtkraft Verschiedenes ist. Dasselbe hast du nun auch von der Sonne zu denken. Nur legt sie das einmal empfangene und ihr zugemessene Licht nicht wieder ab, während der Mond in einem fort das Licht gleichsam auszieht und wieder anzieht und damit von selbst auch das über die Sonne Gesagte bestätigt.</p><p>Diese Lichter wurden nun bestimmt, zwischen dem Tage und der Nacht zu scheiden. Denn oben hatte Gott inmitten des Lichtes und inmitten der Finsternis geschieden und ihre Naturen in unvereinbaren Gegensatz zueinander gestellt, so daß das Licht mit der Finsternis keine Gemeinschaft hätte. Was nämlich am Tage der Schatten ist, für das muß die Natur der Finsternis bei der Nacht gehalten werden. Wie nämlich bei einem brennenden Lichte aller Schatten der Körper auf die dem Lichte abgekehrte Seite fällt, und zwar am Morgen nach dem Westen hin sich ausdehnt, am Abend gegen Osten sich neigt, um Mittag nach Norden fällt, so weicht auch die Nacht nach der Gegenseite der Strahlen, da sie ja ihrer Natur nach nichts anderes ist als der Schatten der Erde. Denn wie am Tage der Schatten durch ein lichtsperrendes Objekt entsteht, so zieht naturgemäß die Nacht herauf, wenn die Luft über der Erde verfinstert wird. Das wollen die Worte sagen: „Gott schied mitten zwischen dem Lichte und der Finsternis.” Es flieht ja die Finsternis beim Nahen des Lichtes, da ihnen schon bei der ersten Schöpfung eine natürliche Abneigung gegeneinander eingepflanzt worden ist. Jetzt aber hat er die Sonne aufgestellt, den Tag zu messen; den Mond aber hat er, wenn er einmal seinen eigenen Kreis ganz ausfüllt, zum Herrn der Nacht bestellt. Um diese Zeit etwa stehen die Lichter sich diametral gegenüber, weshalb zur Zeit des Vollmondes der Mond bei Sonnenaufgang verschwindet, oft aber im Osten wieder aufgeht, sobald die Sonne wieder untertaucht. Wenn aber das Mondlicht in den übrigen Phasen nicht mit der Nacht seinen Lauf vollendet, so bleibt das für unser Thema belanglos. Nur das eine noch: Wenn Vollmond, dann beherrscht er die Nacht, da er mit seinem Lichte die Sterne überstrahlt und die Erde ringsum beleuchtet und so wie die Sonne die Zeitabschnitte mißt.</p><p>„Und sie sollen sein zu Zeichen und zu Zeiten und zu Tagen und zu Jahren.” Für das menschliche Leben notwendig sind die Anzeichen, die die(se) Lichter geben. Selbst wenn man auch nicht übermäßig viel auf diese Zeichen gibt, wird man doch die Beobachtungen einer langen Erfahrung brauchbar finden. Man kann eben doch viel lernen bezüglich des Regens, der Trockenheit, der Luftströmungen, der einzelnen wie der allgemeinen, der stürmischen wie der sanften. Eines von den Anzeichen, das wir der Sonne danken, hat uns auch der Herr mitgeteilt, wenn er sagte: „Es wird Sturm eintreten; denn der Himmel ist trüb und rot.” Wenn nämlich die Sonne durch den Nebel aufsteigt, dann verdunkeln sich ihre Strahlen, und die Sonne sieht sich an glutrot wie (feurige) Kohle und blutrot; die Dicke der Luft verursacht diesen Eindruck auf unser Auge. Wird nun die so verdichtete und kompakte Luft vom Sonnenstrahl nicht geteilt, und strömen ihr noch die Ausdünstungen der Erde zu, so kann sie sich offenbar nicht halten, sondern führt wegen der Übersättigung an Feuchtigkeit für die Gegenden, wo sie sich zusammenballt, ein Gewitter herbei. Ebenso haben wir auch Zeichen von wassergesättigter Luft oder Anzeichen von Sturm, wenn sich rings um den Mond eine Dunsthülle zieht, und wenn um die Sonne sich die sogenannten Höfe bilden. Auch die sogenannten Nebensonnen, wenn sie zugleich mit dem Laufe der Sonne sich drehen, deuten auf gewisse Ereignisse in der Luft hin. Und die regenbogenfarbigen Ruten, die in gerader Richtung in den Wolken erscheinen, zeigen ebenfalls Regen oder ungewöhnlichen Sturm oder überhaupt starken Witterungsumschlag an. Auch im zu- oder abnehmenden Monde haben die Meteorologen viele derartige Anzeichen beobachtet, wie wenn die Luft um die Erde naturnotwendig mit den Mondphasen sich änderte. Ist nämlich der Mond um den dritten Tag klar und rein, so zeigt er „beständig heiter” an; erscheint er aber an seinen Hörnern dick und rot, so droht er mit starkem Regen oder mit heftigem Südsturm. Wer kennt nicht den Vorteil solcher Wetterankündigung für das Leben? Der Seemann, der die von den Winden drohenden Gefahren voraussieht, kann sein Schiff im Hafen zurückhalten. Der Wanderer, der aus dem trüben Himmel einen Witterungsumschlag zu befürchten hat, kann von vorneherein die Nachteile verhüten. Die Landleute, die sich an das Säen und Pflanzen machen wollen, finden in jenen Zeichen die für ihre Arbeiten günstige Zeit. Ja, daß bei der Zerstörung der Welt an Sonne, Mond und Sternen Zeichen sichtbar werden, hat der Herr vorausgesagt: „Die Sonne wird sich in Blut verwandeln, und der Mond wird seinen Schein nicht mehr geben.” Das sind die Zeichen des Weltendes.</p><p>Freilich einige gehen über alles Maß hinaus, vergewaltigen dies Wort zur Fürsprache für die Sterndeuterei und behaupten, unser Leben hänge von der Bewegung der Himmelskörper ab, und so deuteten auch die Chaldäer aus den Sternen unsere Lebensschicksale. Das einfach lautende Wort der Schrift: „Sie sollen zu Zeichen sein”, verstehen sie nicht von den Luftveränderungen, auch nicht vom Wechsel der Jahreszeiten, sondern von den Lebensschicksalen - gerade wie es ihnen beliebt. Was sagen sie denn? Daß das Zusammentreffen der Planeten mit den Sternen des Tierkreises in eben dieser Konstellation die entsprechenden Geburten verursache, daß aber eine andere Konstellation ein entgegengesetztes Lebenslos schaffe.</p><p>Der Deutlichkeit halber dürfte es nicht unnütz sein, etwas weiter auszuholen. Ich will nichts Eigenes von mir vorbringen, sondern zu ihrer Widerlegung mich ihrer eigenen Worte bedienen, um den schon darin Befangenen ein Heilmittel gegen das Gift zu reichen, den übrigen ein Schutzmittel gegen ähnliche Verirrung.</p><p>Die Erfinder dieser Sterndeuterei sahen wohl ein, daß bei einem großen Zeitmaß ihnen viele Konstellationen entgehen würden. Deshalb nahmen sie ein möglichst kleines Zeitmaß an, als ob in einem minimalen und kürzesten Zeitteil oder, wie der Apostel sagt, „in einem <em>Zeitpunkt</em>, in einem Augenblick” der Unterschied zweier Geburten riesengroß wäre. So werde, sagen sie, der in diesem Augenblick Geborene ein Beherrscher der Städte, ein überaus reicher und mächtiger Fürst von Völkern sein, der in einem andern Augenblicke Geborene aber (irgend) ein Bettler und Landstreicher, der sein tägliches Brot von Tür zu Tür erbetteln müsse. Deshalb teilten sie den sogenannten Tierkreis in zwölf Teile, und weil die Sonne in dreißig Tagen den zwölften Teil der sogenannten unbeweglichen Kugel durchläuft, teilten sie jeden dieser zwölf Teile wieder in dreißig Teile, und jeden dieser Teile teilten sie wiederum in sechzig, und jeden dieser sechzig Teile noch einmal in sechzig. - Wenden wir uns nun zu den Geburten und sehen nach, ob sie diese Genauigkeit der Zeiteinteilung werden einhalten können. Sobald das Kind geboren ist, sieht die Hebamme nach, ob es ein Knabe oder ein Mädchen ist. Dann wartet sie auf das Schreien des Kindes, dies Lebenszeichen des Neugeborenen. Wieviele Sechzigstel sind wohl in dieser Zeit vorübergegangen? Alsdann zeigt sie dem Chaldäer die Geburt an. Wieviele kleinste Zeitteile müssen wir als verflossen rechnen, bis die Hebamme die Anzeige gemacht hat, zumal wenn der, welcher die Stunde notiert, außerhalb des Frauengemaches sich befindet? Denn wer das Horoskop stellen will, muß genau die Stunde notieren, ob bei Tag oder bei Nacht. Welche Unzahl von Sechzigstel vergeht wieder in dieser Zeit! Man muß ja finden, nicht nur im wievielten Zwölftel der Geburtsstern steht, sondern auch in welchem Teile des Zwölftels, und in welchem der Sechzigstel, in die wir vorhin jeden Teil wieder teilten, oder, um sicher zu gehen, in welchem Sechzigstel des Sechzigstels. Und diese präzise, unbegreifliche Erforschung der Zeit muß nach ihnen bei jedem Planeten angestellt werden, um zu finden, welche Stellung sie in der Geburtsstunde des Kindes zu den Fixsternen, und welche sie zu einander hatten. Wenn es also unmöglich ist, die Stunde genau zu finden und bei der geringsten Abweichung die ganze Berechnung fehlschlägt, dann trifft unser Spott sowohl die, die sich mit dieser vermeintlichen Kunst befassen, wie die, welche solche Leute anstaunen, als könnten diese ihr künftiges Schicksal wissen.</p><p>Welchen Inhalt haben denn auch ihre Prophezeiungen? Dieser N. N. wird krauses Haar und schöne Augen haben; denn er hat die Stunde des Widders; etwa ein solches Aussehen hat dieses Tier. Er wird aber auch mutvoll sein; denn der Widder hat eine Führernatur. Auch freigebig wird er sein und wieder ein Leichtverdienender; denn dieses Tier legt ohne Schmerz seine Wolle ab und wird von der Natur wieder rasch bekleidet. - Wer dagegen im Stiere geboren wird, sagen sie, wird geplagter Dienstbote; denn der Stier beugt sich unter das Joch. Wer aber im Skorpion geboren wird, ist ein Schläger - schuld seiner Ähnlichkeit mit diesem Tiere. Wer aber in der Wage geboren wird, wird gerecht sein, weil unsere Wage das Gleichgewicht hält. Könnte es noch etwas Lächerlicheres geben? Der Widder, von dem du die Geburt des Menschen abliesest, ist der zwölfte Teil des Himmels, wo die Sonne im Frühling steht. So sind auch Wage und Stier je der zwölfte Teil des sogenannten Tierkreises. Mit welchem Rechte suchst du dort die ausschlaggebenden Ursachen des menschlichen Lebens und charakterisierst nach den Tieren auf Erden die Anlagen der Menschen, die geboren werden? Freigebig ist ja der im Widder Geborene nicht etwa, weil jener Teil des Himmels diese Eigenschaft mitteilt, sondern weil das Schaf diese Eigenschaft hat. Warum lenkst du unsern Blick ab von der Untrüglichkeit der Gestirne und suchst uns mit dem Blöken der Schafe zu überzeugen? Denn wenn der Himmel von den Tieren solche eigentümlichen Eigenschaften angenommen hat, dann ist auch er fremden Herrschaften Untertan, da sie eben ihre Eigenschaften den Tieren verdanken. Ist nun solche Behauptung lächerlich, dann ist noch viel lächerlicher, aus Dingen, die nichts miteinander zu tun haben, jene Meinung glaubwürdig machen zu wollen. Doch diese ihre Sophistereien gleichen Spinngeweben, in die eine Mücke, Fliege oder sonst ein ähnlich schwaches Tierchen geraten kann, darin eingesponnen und gefangen wird, während ein stärkeres Tier, das auf das Netz stößt, ihm leicht entkommt und das schwache Gewebe zerreißt und zerstört.</p><p>Und bei dem allein bleiben sie nicht stehen; sie wollen auch das, was von unserem freien Willen abhängt - ich meine die Betätigungen der Tugend oder des Lasters -, auch das wollen sie mit den Gestirnen in ursächlichen Zusammenhang bringen. Wiewohl es an sich lächerlich ist, ihnen zu widersprechen, so kann man sie doch wohl nicht mit Stillschweigen übergehen, weil sehr viele in diesem Irrtume befangen sind. Zunächst nun möchte ich sie darnach fragen, ob nicht die Stellung der Sterne an jedem Tage tausendmal sich ändert. Immer in Bewegung sind ja die sog. Planeten; die einen holen einander schneller ein, die andern machen ihren Umlauf langsamer, so daß sie oft in ein und derselben Stunde einander sowohl zu- wie abgewendet sind. Nun ist es von größter Wichtigkeit bei den Geburten, ob sie von einem sogenannten wohlwollenden oder einem übelwollenden Sternbilde angeschaut werden. Und da der Augenblick, in dem der wohlwollende Stern Zeugnis gab, aus Unkenntnis eines einzigen kleinsten Zeitteilchens oftmals nicht ausfindig gemacht werden konnte, so buchte man ihn vielfach als in das Unglückszeichen fallend. Ich muß mich eben ihrer eigenen Worte bedienen.</p><p>In solcherlei Reden liegt ja viel Unverstand, aber noch weit mehr Gottlosigkeit. Die übelwollenden Sterne schieben ja die Schuld an ihrer Bosheit auf ihren Schöpfer. Sind sie nämlich von Natur böse, dann ist ihr Schöpfer Vater des Bösen; sind sie aber böse aus freier Wahl, so werden sie fürs erste freiwollende Wesen sein, frei und unabhängig in ihren Bewegungen. Aber es ist Unsinn, solches Vermögen unbeseelten Dingen anzudichten. Sodann, welche Unvernunft, das Böse und das Gute nicht nach Verdienst jedem zuzuteilen, sondern zu behaupten: weil der Stern an eben dieser Stelle steht, so ist er wohltätig, und weil er dort gesehen wird, ist derselbe unheilbringend, und wenn er wieder etwas von dieser Stellung abrückt, dann vergißt er sofort wieder seine Bösartigkeit.</p><p>Soweit hievon. Wenn aber die Konstellation (der Sterne) mit jedem Augenblick eine andere wird, und wenn bei diesen unzähligen Veränderungen oft im Tage die Konstellationen der königlichen Geburten eintreten, warum werden dann nicht jeden Tag Könige geboren? Warum gibt es dann überhaupt bei den Dynastien eine Nachfolge in der Herrschaft? Es schaut doch wohl nicht jeder König nach der königlichen Konstellation der Gestirne, um damit die Geburt seines Sohnes in Einklang zu bringen. Welcher Mensch ist denn darüber Herr? Wie kam es, daß Ozias den Joatham, Joatham den Achaz, Achaz den Ezechias zeugte, ohne daß einen von ihnen die <em>knechtische</em> Geburtsstunde traf? - Sodann, wenn die schlechten wie tugendhaften Handlungen prinzipiell nicht von uns ausgehen, sondern notwendige Folgen der Geburt sind, dann sind überflüssig die Gesetzgeber, die vorschreiben, was wir tun und was wir meiden sollen, überflüssig die Richter, die Tugend lohnen und Bosheit strafen. Es gibt ja kein Verbrechen des Diebstahls oder des Mordes; denn schuld der unwiderstehlichen Notwendigkeit, die den Verbrecher zum Handeln trieb, war es ihm auch bei gutem Willen nicht möglich, die Hand einzuhalten. Die allergrößten Toren sind die, welche im Erwerbsleben sich abmühen: Denn der Landmann wird Überfluß haben, auch ohne daß er Samen aussäet, ohne daß er die Sichel wetzt. Überreich wird der Kaufmann werden, mag er wollen oder nicht, weil das Schicksal ihm den Reichtum anhäuft. Aber die großen Hoffnungen der Christen werden sich verflüchtigen, da weder die Gerechtigkeit belohnt noch die Sünde gestraft wird, weil ja von den Menschen nichts aus freiem Willen geschieht. Denn wo Notwendigkeit und Schicksal herrschen, da gibt es für das Verdienst keinen Platz, was doch die Voraussetzung für ein gerechtes Gericht ist. Soweit also gegen jene. Mehr Worte braucht es nicht, weil ihr selbst ein gesundes Urteil habt; anderseits erlaubt es die Zeit nicht, noch weiter gegen sie zu polemisieren.</p><p>Wir wollen jetzt wieder auf die bekannten Worte zurückkommen. „Sie sollen sein zu Zeichen und zu Zeiten, zu Tagen und zu Jahren”, heißt es. Von den Zeichen haben wir bereits gesprochen. Mit „Zeiten” sind wohl die Wechsel der Jahreszeiten, des Winters, Frühlings, Sommers und Herbstes, gemeint, deren regelmäßige Wiederkehr wir der gesetzmäßigen Bewegung der Gestirne verdanken. Denn der Winter tritt ein, wenn die Sonne in den südlichen Zonen weilt und in unserer Gegend den langen Schatten der Nacht verursacht; dadurch erkaltet die Luft über der Erde, sammeln sich um uns an alle feuchten Ausdünstungen, und Regen, Fröste und häufiger Schneefall sind die Folge. Kehrt sie dann wieder aus den südlichen Zonen zurück und erreicht die Mitte, so daß Tag- und Nachtgleiche ist, dann führt sie allmählich eine Temperatur herbei, die um so günstiger ist, je länger sie über den betreffenden Erdgegenden leuchtet. Und es kommt der Frühling, der alles Wachstum zu neuem Sprossen weckt, der die meisten Bäume neu belebt, allen Land- und Wassertieren Nachwuchs von Jungen schenkt und so deren Art erhält. Von da nimmt dann die Sonne ihren Lauf zur Sommerwende gen Norden und schenkt uns die längsten Tage. Und weil sie sehr lange im Verkehr steht mit unserer Atmosphäre, erhitzt sie die Luft über uns, trocknet die ganze Erde aus, verhilft dadurch den Samen zur Reife und beschleunigt die Zeitigung der Baumfrüchte. Wenn die Sonne am heißesten ist, wirft sie um Mittag kurze Schatten, weil sie unmittelbar über uns den Ort bescheint. Die längsten Tage sind die, an denen die Schatten am kürzesten sind, und umgekehrt sind die kürzesten Tage die, welche die längsten Schatten haben. So ist es bei uns, die wir „Einschattige” genannt werden, insofern wir die nördlichen Gegenden bewohnen. Es gibt nämlich auch Menschen, die jedes Jahr zwei Tage lang um Mittag gar keinen Schatten haben, denen die Sonne über dem Scheitel leuchtet, und die sie von allen Seiten gleichmäßig bescheint, so daß selbst das Wasser im tiefen Brunnen durch enge Spalten von ihr beschienen wird. Man nennt sie deshalb „Schattenlose”. Bei denen aber, die über das Gewürzland hinaus wohnen, wechseln die Schatten nach beiden Seiten. Denn sie allein unter den Erdbewohnern werfen den Schatten um Mittag nach Süden, weshalb sie von manchen „Doppelschattige” genannt werden. Dies alles aber geschieht, wenn die Sonne bereits nach Norden sich wendet. Hieraus läßt sich schließen auf die starke Erhitzung der Atmosphäre durch die Sonnenbestrahlung und auf die verschiedenen Folgen daraus. Alsdann nimmt uns die Zeit des Herbstes auf; sie bricht die übermäßige Hitze; die Wärme nimmt allmählich ab, und so werden wir durch den Übergang einer gemäßigten Temperatur ohne Nachteil in den Winter hineingeführt. Die Sonne kehrt nämlich wieder aus dem Norden nach dem Süden zurück. Diese Zeitenwechsel, die der Bewegung der Sonne folgen, regeln unser Leben.</p><p>„Sie sollen sein”, heißt es, „zu Tagen”, nicht um Tage zu machen, sondern den Tagen vorzustehen. Tag und Nacht sind ja älter als die Lichter. Das zeigt uns auch der Psalmist mit den Worten: „Er setzte die Sonne zur Beherrschung des Tages, Mond und Sterne zur Beherrschung der Nacht.” Wie hat nun die Sonne die Herrschaft über den Tag? Dadurch, daß sie das Licht mit sich bringt, wenn sie jeweils an unserem Horizonte aufsteigt, die Finsternis vertreibt und den Tag herbeiführt. Daher dürfte der wohl nicht irren, der den Tag definiert als die von der Sonne erleuchtete Luft, oder der sagt, Tag sei das Maß der Zeit, in der die Sonne in der Hemisphäre über der Erde verweilt. Doch auch „zu Jahren” sind Sonne und Mond bestimmt worden. Wenn der Mond zwölfmal seinen Lauf vollendet hat, so macht er ein Jahr; nur ist oft ein Schaltmonat notwendig, um ein genaues Zusammentreffen der Zeiten zu erzielen; so maßen vor alters die Hebräer und die ältesten Griechen das Jahr. Ein Sonnenjahr aber ist die Zeit, welche die Sonne braucht, um entsprechend ihrer Bewegung von einem bestimmten Zeichen zu eben demselben zurückzukehren.</p><p>„Und Gott machte die zwei großen Lichter.” Das Wort „groß” hat bald eine <em>absolute</em> Bedeutung wie in den Ausdrücken der „große Himmel”, die „große Erde”, das „große Meer”, bald, und zwar meist eine <em>relative</em>, wie z. B. wenn man spricht von dem „großen Pferde”, vom „großen Stier”; nicht wegen ihres ausnehmenden Körpergewichtes, sondern nur im Vergleiche mit gleichartigen Tieren erhalten sie das Prädikat „groß”. Wie haben wir nun hier das Wort „groß” zu fassen? Etwa wie wir eine Ameise oder irgendein von Natur kleines Tier groß nennen, indem wir es mit einem andern derselben Art vergleichend als besonders groß prädizieren? Oder verstehen wir mit dem Wort „groß” die Größe, in der die Lichter in ihrer natürlichen Beschaffenheit sich zeigen? Ich verstehe es im letzteren Sinne. Denn sie sind nicht deshalb groß, weil sie größer sind als die kleinen Sterne, sondern weil sie ein solches Ausmaß haben, daß der von ihnen ausströmende Lichtglanz Himmel und Luft genügend beleuchtet und zugleich über die ganze Erde und das Meer sich ergießt. Auf welchem Fleck am Himmel sie stehen, ob sie auf- oder untergehen oder die Mitte einnehmen, überall erscheinen sie den Menschen gleich groß, was doch deutlich ihre ungeheure Größe beweist, wenn die Breite der Erde für ihr größeres oder kleineres Aussehen nichts zu bedeuten hat. Die fernabstehenden Gegenstände sehen wir ja sonst kleiner; je näher wir ihnen kommen, desto größer finden wir sie, Der Sonne aber ist niemand näher und niemand ferner, sondern sie erscheint allen Bewohnern der Erde in gleicher Entfernung. Beweis dafür ist, daß die Inder und Briten sie gleich groß sehen. Denn für die östlichen Bewohner verliert die Sonne bei ihrem Untergange nicht an Größe, für die Abendländer erscheint sie beim Aufgange nicht kleiner, und wenn sie mitten am Himmel steht, dann ändert sie ihr Aussehen nach keiner der beiden Seiten. Laß dich nicht vom Scheine täuschen, und denk nicht, es sei ihre wirkliche Größe, wenn sie dem Auge nur ellenbreit erscheint! In sehr großen Entfernungen nimmt die Größe der Objekte, die wir sehen, ganz natürlich ab, weil die Sehkraft den Zwischenraum nicht zu durchdringen vermag, sondern sich gleichsam auf halbem Wege verliert und nur in einem kleinen Teil bis zu den geschauten Dingen vordringt. Unser kurzes Gesicht also läßt uns die Gegenstände klein sehen, indem es die eigene Schwäche auf das Gesehene überträgt. Wenn also das Gesicht sich täuscht, so ist seinem Urteil nicht zu glauben. Denk nur an deine eigene Erfahrung, und du wirst das Gesagte selbst bestätigt sehen. Hast du einmal von einer hohen Bergesspitze aus eine weite und flache Ebene überschaut? Wie klein erschienen dir da die Ochsengespanne, wie klein die Ackerer selbst? Sind sie dir nicht fast wie Ameisen vorgekommen? Oder wenn du von einer Warte an einem großen Meere den Blick aufs Meer geworfen, wie klein kamen dir da die größten Inseln vor? Wie klein eines der größten Lastschiffe, das mit seinen weißen Segeln über das blaue Meer dahinfuhr? Schien es dir nicht kleiner als jede Taube? Eben deshalb, weil, wie gesagt, die Sehkraft von der Luft verzehrt und geschwächt wird und zur genauen Wahrnehmung der sichtbaren Dinge nicht ausreicht. Auch sehr große, durch tiefe Schluchten gespaltene Berge möchte unser Gesicht rund und glatt nennen, weil es nur bis zu den vorstehenden Teilen reicht, aber in die Höhlen dazwischen wegen seiner Schwäche nicht dringen kann. So kann es nicht einmal die Gestalten der Körper unterscheiden, sondern hält viereckige Türme für runde. Aus alledem erhellt, daß bei sehr großen Entfernungen unser Gesicht nicht ein scharf umrissenes, sondern ein sehr wirres Bild von den Körpern erhält. Groß ist also das Licht nach dem Zeugnis der Schrift, unendlich größer als es scheint.</p><p>Auch folgendes sei dir ein deutliches Zeichen für die Größe. So zahllos auch die Sterne am Himmel sind, all ihr Licht reicht nicht aus, die Düsterkeit der Nacht zu verscheuchen. Wenn aber <em>sie</em> allein aufsteigt am Horizonte, oder vielmehr erst erwartet wird, also überhaupt noch nicht über der Erde steht, zerstreut sie (schon) die Finsternis, überstrahlt die Sterne und erweicht und zerteilt die bisher verdichtete und dicke Luft über der Erde. Daher auch die Morgenwinde und der Tau, der bei heiterer Witterung die Erde benetzt. Wie könnte sie aber in einem Augenblick diese weite Welt ganz erleuchten, wenn sie nicht aus einem großen Kreise das Licht entsendete? Hier schau mir an des Schöpfers Weisheit, wie er diesem Abstande angemessen der Sonne ihre Wärme gab! Ebenso stark ist ihre Brennkraft, daß die Erde einerseits durch ein Zuviel sich nicht entzünde und anderseits durch ein Zuwenig nicht starr und unfruchtbar bleibe.</p><p>Ganz ähnliche Gedanken wie die ausgesprochenen mache dir auch vom Monde! Groß ist ja auch sein Körper und der leuchtendste nach der Sonne. Nicht immer zwar sichtbar bleibt seine Größe; bald scheint er voll in seinem Kreise, bald abnehmend, kleiner werdend, und zeigt bald auf dieser, bald auf jener Seite die lichtlose Stelle. Nimmt er nämlich zu, dann ist er auf der einen Seite dunkel; und die andere Seite tritt ins Dunkel zur Zeit der Abnahme.</p><p>Eine geheime Absicht des weisen Schöpfers liegt in diesem bunten Wechsel der Gestalten. Er wollte uns ein deutliches Bild von unserer Natur geben mit der Lehre: Nichts Menschliches hat Bestand; das eine gelangt aus dem Nichts zur Vollendung, das andere, zu seiner Blüte gekommen und zum Höchstmaß seiner Kraft, nimmt allmählich wieder ab, vergeht, verdirbt und geht zugrunde. So lassen wir uns durch den Anblick des Mondes belehren über unser Los, und machen wir uns unsere Gedanken über den raschen Wechsel der menschlichen Dinge, auf daß wir nicht übermütig werden in guten Tagen, nicht unserer Macht uns rühmen, nicht pochen auf unsicheren Reichtum, auf daß wir verachten das Fleisch mit seiner Veränderlichkeit, aber für die Seele sorgen, deren Gut unerschütterlich ist. Wenn aber der Mond dich betrübt, weil er durch allmähliches Abnehmen seinen Glanz verliert, dann soll dich noch mehr betrüben die Seele, die es zur Tugend gebracht hat, aber in Lauheit das Gut verliert, die nie in derselben Gesinnung verharrt, sondern häufig sich wandelt und ändert - schuld des unbeständigen Sinnes. In der Tat, wie geschrieben steht, „es verändert sich der Tor wie der Mond”.</p><p>Ich glaube aber auch, daß zur Konstitution der Tiere wie zur Entwicklung der Vegetation die Wandlungen des Mondes nicht wenig beitragen. Anders steht es um die Organismen bei abnehmendem Monde, anders bei zunehmendem. Bei abnehmendem werden sie dünn und leer; nimmt er aber zu und nähert er sich dem Zustande des Vollmondes, dann werden auch sie wieder voller, und zwar deshalb, weil er eine Feuchtigkeit, mit Wärme gemischt, unvermerkt in das Innere (der Lebewesen) fließen läßt. Dies bezeugen die, welche bei Mondschein unter freiem Himmel schlafen und die Höhlungen ihres Hauptes reichlich mit Feuchtigkeit voll bekommen, auch das frisch geschlachtete Fleisch, das sich im Mondschein schnell verändert, ferner das Gehirn der Landtiere und die Weichteile der Wassertiere, sowie das Mark der Bäume. All diese Wesen könnte der Mond durch seinen Wechsel nicht umgestaltend beeinflussen, wenn er nicht eine ungewöhnliche und außerordentliche Kraft hätte, die ihm die Schrift bezeugt.</p><p>Auch die Lufterscheinungen hängen mit dem Mondwechsel zusammen, wie uns oft die beim Neumonde nach großer Ruhe und Windstille plötzlich eintretenden Stürme bezeugen, wenn die Wolken gejagt und durcheinandergewirbelt werden. Und es zeugen dafür auch die Ebbe- und Flutbewegungen in den Meerengen wie auch die Ebbe im sogenannten Ozean, die nach den Beobachtungen der Anwohner nach den Mondwechseln sich richten. Die Meerengen strömen bei allen (übrigen) Phasen des Mondes nach beiden Seiten zurück, nur zur Zeit des Neumondes sind sie keinen Augenblick ruhig, sondern wogen und toben in einem fort, bis er wieder erscheint und die Ebbe wieder in Gang bringt. Das westliche Meer aber hat seine Ebbe- und Flutbewegungen, indem es bald zurückweicht, bald überströmt, wie wenn es durch das Einatmen des Mondes zurückgezogen, durch dessen Ausatmen wieder an seinen angewiesenen Raum vorgetrieben würde. - Dies habe ich gesagt zum Erweis der Größe der Lichter und zur Bestätigung dessen, daß von den göttlich inspirierten Worten auch keine Silbe überflüssig ist; und doch hat unsere Rede von der Hauptsache fast noch nichts berührt. Über die Größe und die Entfernungen von Sonne und Mond läßt sich auch vieles auf dem Wege der Schlußfolgerung finden, wenn man nicht bloß oberflächlich deren Wirkungen und Kräfte ins Auge faßt. Offenherzig müssen wir uns unserer Schwäche anklagen, auf daß man nicht die größten Schöpfungen an unsern Worten bemißt, sondern aus dem wenigen Gesagten von selbst den Schluß zieht, wie viel Großes und Herrliches wir übergangen haben. So miß also auch den Mond nicht mit dem Auge, sondern mit dem Verstand, der viel verlässiger ist in der Erforschung der Wahrheit als das Auge.</p><p>Es sind gewisse lächerliche Fabeln, von alten, trunkenen Weibern albern ersonnen, überall im Umlauf, daß man nämlich den Mond mit gewissen Beschwörungen aus seiner natürlichen Stellung bringen und auf die Erde herabziehen könnte. Wie sollen aber Zauberformeln von Gauklern den verrücken können, den der Höchste selbst festgegründet hat? Welcher Raum hätte auch den Herabgezogenen aufnehmen können?</p><p>Willst du einen Beweis für seine ungeheure Größe kleinen Tatsachen entnehmen? Alle Städte unseres Erdkreises, mögen sie noch so weit auseinanderliegen, erhalten in ihren ostwärts gelegenen Vierteln das Mondlicht in gleicher Weise. Stünde er nicht ihnen allen vis-a-vis gegenüber, so würde er die ihm direkt zugekehrten Gassen vollkommen erleuchten, auf die aber, welche über seine Breite hinausliegen, würde er seine Strahlen schräg und von der Seite her fallen lassen. Man kann ja das auch bei den Lampen in den Wohnungen beobachten. Wenn mehrere das Licht umstehen, dann fällt der Schatten des direkt vor ihm Stehenden auch geradeaus, während die übrigen Schatten nach beiden Seiten hinneigen. Wäre also der Mondkörper nicht unermeßlich und außerordentlich groß, dann könnte er nicht gleichmäßig nach allen Seiten hin sein Licht verbreiten. Denn wenn der Mond in der Gegend der Tag- und Nachtgleiche aufgeht, dann genießen ihn gleichmäßig sowohl die Bewohner der kalten Zone, die unter dem Wagen des Bären liegen, als auch die, welche im Schoße des Südens der heißen Zone nahe sind. All diesen kehrt er nämlich seine ganze Breite zu - der deutlichste Beweis für seine Größe. Wer will also bestreiten, daß sein Körper ungeheuer groß ist, wo er doch auf so viele und so große Entfernungen sich gleich bleibt? Soviel über die Größe von Sonne und Mond.</p><p>Der aber, der uns die Einsicht verliehen, aus den kleinsten Geschöpfen die große Weisheit des Schöpfers zu erkennen, er möge uns auch aus den großen Werken noch größere Gedanken über den Schöpfer fassen lassen. Im Vergleiche mit dem Schöpfer nehmen sich ja freilich Sonne und Mond aus wie Mücke und Ameise. Es ist ja nicht möglich, aus all dem eine entsprechende Vorstellung von der Größe des Gottes des Universums zu bekommen; wir gelangen durch sie nur zu winzigen, armseligen Spiegelbildern, wie ähnlich auch an der Hand jedes kleinsten Wesens aus Fauna oder Flora. Begnügen wir uns mit dem Gesagten!</p><p>Ich danke dem, der mich zu diesem kleinen Dienst am Worte berufen hat; ihr aber sollt dem danken, der euch mit geistiger Speise nährt, der auch jetzt wieder euch mit der geringen Gabe unseres Vortrages wie mit einem Gerstenbrote gespeist hat. Möge er euch immer speisen und nach dem Maß des Glaubens euch die Offenbarung des Geistes geben in Christus Jesus, unserm Herrn, dem Ehre und Macht in alle Ewigkeit. Amen.</p><h2>7</h2><p><em>Die Kriechtiere</em></p><p><k> <em>Inhalt: Gen 1, 20. Die Ausstattung des Wasserelementes mit Wassertieren, die eine höhere Stufe von Lebewesen darstellen. Im gewissen Sinne sind sie „Reptilien”. Eine Unmenge von Fischarten (c. 1). Verschiedenartigkeit der Wassertiere bezüglich der Lebensweise und Fortpflanzung (c. 2). Lebensweise und Eigenschaften von Fischen erinnern teils an schlimme Eigenschaften und Manieren der Menschen, teils sind sie vorbildlich (c. 3). Die Wassertiere folgen treu dem Naturgesetze, ob sie in ihren angewiesenen Grenzen bleiben oder zur Brutzeit auf die Wanderung gehen - eine Lehre für Menschen (c. 4). Der Mensch lebt oft nicht so vernünftig wie der Fisch, der stets dem Instinkte folgt. Beispiele: der Seeigel (der Wetterprophet); die Wasserschlange und der Meeraal in ihrer Begattung ein Vorbild ehelicher Verträglichkeit und Liebe für Frau und Mann (c. 5). Das Meer birgt wertvolle Tiere zum Nutzen des Menschen, Riesentiere und erstaunliche Zwergtiere zum Schrecken der Menschen und zum Preise des Schöpfers. - Entschuldigung wegen der überlangen Rede. Mit der Mahnung, das Gehörte bei Tisch und selbst im Schlafe zu überdenken, schließt die Homilie (c. 6).</em></k></p><p>„Und Gott sprach: Es bringen hervor die Wasser die kriechenden Tiere mit lebendiger Seele nach ihrer Art, und Vögel, die fliegen am Firmamente des Himmels nach ihrer Art.” Nach Erschaffung der Lichter füllen sich nunmehr auch die Wasser mit Lebewesen; auch dieser Bereich sollte seinen Schmuck erhalten. Die Erde hatte ja in ihren Gewächsen ihren Schmuck bekommen. Bekommen hatte auch der Himmel der Sterne Blüten, und wie mit einem strahlenden Augenpaar schmückte ihn das Zweigespann der großen Leuchten. Es fehlte noch, daß auch den Wassern ihr Schmuck gegeben wurde. Da kam ein Befehl, und sofort wurden fruchtbar die Flüsse, und jeder See gebar die ihm eigenen und natürlichen Arten. Auch das Meer öffnete seinen Schoß zur Erzeugung aller Arten von schwimmenden Tieren; nicht einmal das Wasser in Tümpeln und Sümpfen blieb müßig und teilnahmslos bei der Vollendung der Schöpfung: Frösche, Schnaken und Mücken schlüpften ja in Masse daraus hervor. Was nämlich jetzt noch zu sehen ist, ist ein Beweis für das Vergangene. So hatte es jedes Wasser eilig, dem schöpferischen Befehl nachzukommen. Und das Leben all dieser Tiere, deren Arten man nicht einmal zählen kann, hat die große und unaussprechliche Macht Gottes sofort mit vitaler Lebenskraft bedacht. „Es bringen die Wasser hervor die kriechenden Tiere <em>mit lebendiger Seele</em>.” Jetzt erst war das animalische, sinnbegabte Lebewesen geschaffen. Von Pflanzen und Bäumen sagt man ja wohl auch aus, sie leben, weil sie teilnehmen an der Fähigkeit, sich zu nähren und zu wachsen. Allein sie sind keine animalischen, beseelten Wesen. Deshalb „sollen die Wasser die <em>kriechenden</em> Tiere hervorbringen”.</p><p>Alles, was schwimmt, mag es auf der Oberfläche des Wassers einherschwimmen, oder mag es in der Tiefe das Wasser durchschneiden, hat die Natur der Kriechtiere, weil es sich durch den Körper des Wassers schleppt. Haben auch einige Wassertiere Füße und gebrauchen sie zum Gehen - die meisten davon gehören zu den Amphibien, wie die Robben, Krokodile, die Flußpferde, die Frösche und Krebse -, so bevorzugen sie doch das Schwimmen. Daher heißt es: „Die Wasser bringen <em>Kriechtiere</em> hervor!” Welche Art wäre in diesen wenigen Worten übergangen? Welche nicht miteingeschlossen im Schöpfungsbefehle? Sind nicht miteingeschlossen die Säugetiere, die lebendige Junge zur Welt bringen wie die Robben, Delphine, Kampfrochen und andere dieser Art, die man Knorpelfische nennt? Nicht die, welche Eier legen, was bei fast allen Fischarten der Fall ist? Nicht alle Schuppen- und Schaltiere, nicht die, welche Flossen haben und die, welche keine haben? Der Wortlaut des Befehls ist kurz, eigentlich überhaupt kein Wortlaut, sondern nur ein Wink, ein Willensakt. Aber der Inhalt des Befehls entspricht in seiner reichen Mannigfaltigkeit der Fülle von unterscheidenden und gemeinsamen Merkmalen der Fische; alle Fischarten genau aufzählen wollen, hieße aber die Wogen des Ozeans zählen oder das Wasser des Meeres mit hohler Hand messen wollen.</p><p>„Es bringen die Wasser hervor kriechende Tiere!” Darunter fallen die Tiere, die im Meere, an den Gestaden, in der Tiefe, an den Felsen, die herdenweise und vereinzelt leben, die Walfischarten, die Riesen- und Zwergfische. Durch dieselbe Macht, auf denselben Befehl hin erhielt Groß und Klein das Dasein. - „Die <em>Wasser</em> bringen hervor!” Das zeigt dir an die physische Verwandtschaft der Wassertiere mit dem Wasser; deshalb kommen die Fische um, sobald sie auch nur kurze Zeit außer Wasser sind. Denn sie haben keinen Atem, um diese Luft einzuziehen; was aber für die Landtiere die Luft ist, das ist für das schwimmende Geschlecht das Wasser. Der Grund liegt auf der Hand. Wir haben die Lungen, ein zartes, porenreiches Eingeweide, das durch die Ausdehnung der Brust die Luft aufnimmt und unsere innere Wärme durchlüftet und abkühlt. Bei jenen aber tritt an Stelle des Atems das Öffnen und Schließen der Kiemen, die das Wasser aufnehmen und ausstoßen. Die Fische haben ein eigenes Los, eine eigene Natur, eine besondere Lebensweise und ein eigenartiges Leben. Deshalb läßt sich auch kein schwimmendes Tier zähmen und duldet überhaupt keine Berührung durch menschliche Hand.</p><p>„Es bringen hervor die Wasser kriechende Tiere mit lebendiger Seele nach ihrer Art.” Jetzt will er die Erstlinge jeder Art gleichsam als einige Samen der Natur hervorgebracht wissen; ihre Menge wird auf die nachfolgende Fortpflanzung verschoben, wann sie wachsen und sich mehren müssen. Eine Gattung sind die sogenannten Schaltiere, wie die Muscheln, die Kammmuscheln, die Meerschnecken, die Stromben und tausend Arten von Austern. Wieder eine andere, von der genannten verschiedene Gattung sind die sogenannten Krustentiere wie die Krabben, Krebse und dergleichen. Zu wieder anderer Gattung gehören die sogenannten Weichtiere, deren Fleisch zart und weich ist, wie die Polypen, Tintenfische und dergleichen. Auch unter diesen gibt es wieder unzählige Abwandlungen. Denn die Drachen, Muränen und Aale, die in schlammigen Flüssen und Sümpfen gedeihen, kommen mit ihrer Natur den giftigen Reptilien näher als den Fischen. Anderer Gattung sind die Eierlegenden, und anderer die, welche lebendige Junge zur Welt bringen. Lebendige Geburten haben die wiesel- und hundeartigen Wassertiere und überhaupt die sogenannten Knorpelfische. Auch besonders die Walfischarten haben Junge, wie die Delphine und Seehunde, die bei drohender Gefahr ihre noch zarten Jungen, um sie zu schützen, wieder in ihren Bauch aufnehmen sollen.</p><p>„Es bringen die Wasser hervor nach ihrer Art.” Die Wale und die kleinen Fische bilden je für sich eine besondere Gattung. Und unter den Fischen gibt es wieder tausend verschiedene, voneinander gesonderte Arten, verschieden durch Namen, Nahrung, Gestalt, Größe, Eigenschaften des Fleisches; kurz die größten Unterschiede trennen alle voneinander und lassen sie in den verschiedensten Gestalten erscheinen. Welcher Thunfischkenner könnte uns die verschiedenen Arten aufzählen? Und doch sagt man, daß sie bei großen Haufen von Fischen sogar die Zahl angeben. Wer ist an den Ufern und Gestaden so alt geworden, daß er uns eine genaue Naturgeschichte aller Fische geben könnte? Andere Arten kennen die Fischer im Indischen Meer, andere die Fischfänger im Ägyptischen Meerbusen, andere die Inselbewohner, andere die Mauretanier. Alle die kleinen und großen hat jener erste Befehl und jene unaussprechliche Macht auf einmal hervorgerufen.</p><p>Zahlreich sind die verschiedenen Arten der Lebensweise, zahlreich die verschiedenen Formen der Fortpflanzung einer jeden Gattung. Es brüten die meisten Fische nicht wie die Vögel auf den Eiern; sie bauen keine Nester, ziehen ihre Jungen nicht mit Mühe auf; vielmehr nimmt das Wasser das gelegte Ei auf und entwickelt es zum Lebewesen. Und jede Art sorgt für rassenreine, mit keiner andern Natur vermischte Fortpflanzung; (es ist hier) nicht wie bei den Mauleseln auf dem Lande oder wie bei gewissen Vögeln, die in unnatürlicher Mischung die Art verfälschen. Keine Fischart ist nur hälftig mit Zähnen bewaffnet, wie bei uns der Ochs und das Schaf. Auch gibt es unter ihnen keinen Wiederkäuer als nur den Skarus, wie einige erzählen. Alle Fische aber haben dichtgereihte und spitze Zähne, damit ihnen nicht beim langen Kauen die Speise weggespült würde. Denn wenn sie nicht rasch zerkaut in den Magen käme, so würde sie bei der Zerkleinerung vom Wasser weggeschwemmt.</p><p>Jede Fischart hat auch ihre besondere Nahrung. Die einen nähren sich vom Schlamme, die andern vom Seegrase; wieder andere begnügen sich mit Kräutern, die im Wasser wachsen. Die meisten Fische aber sind Fischfresser: der kleinere ist die Nahrung für den größeren. Kann auch vorkommen, daß ein Fisch, der sich eines schwächeren bemächtigt hat, Beute eines dritten wird und so schließlich beide in den <em>einen</em> Magen des letzteren kommen. - Was tun wir Menschen anders, wenn wir tyrannisch die Schwächeren unterdrücken? Wie unterscheidet sich vom letzteren (Raub-)Fisch der, der aus unersättlicher Gier nach Reichtum die Schwachen im unausfüllbaren Magen seiner Habsucht verschlingt? Jener besaß die Habe des Armen; du aber hast ihn gepackt und zu einem Teil deines Reichtums gemacht. Du hast dich damit als den Ungerechten der Ungerechten, als den Habsüchtigsten der Habsüchtigen verraten. Sieh zu, daß dich nicht dasselbe Ende der Fische erwarte, irgendeine Angel, eine Fischreuse oder ein Netz. Denn sicher werden auch wir, wenn wir viel Unrecht begangen haben, am Ende der Strafe nicht entrinnen. Wenn du nun schon bei einem schwachen Tiere viel Bosheit und Hinterlist gewahrst, dann möchte ich dich vor der Nachahmung des Verruchten warnen.</p><p>Den Krebs gelüstet nach dem Fleisch der Auster; aber wegen der harten Schale kann er der Beute schwer habhaft werden. Denn mit unzerbrechlicher Hülle hat die Natur das zarte Fleisch geschützt, weshalb sie auch „hartschalige” genannt wird. Und weil zwei genau aufeinanderpassende Schalen die Auster umgeben, so sind natürlich die Scheren des Krebses nicht praktisch. Was, tut er nun? Wenn er sieht, wie die Auster an windstillen Plätzchen behaglich sich wärmt und ihre Schalen gegen die Sonnenstrahlen öffnet, dann wirft er unversehens ein Steinchen dazwischen, verhindert so die Verschließung und ersetzt damit, wie man sieht, mit List das, was ihm an Kraft fehlt. Das ist die Bosheit von vernunftlosen und stummen Tieren. - Ich möchte dir den Erwerbssinn und die Geschicklichkeit der Krebse wünschen, ohne daß du dabei dem Nächsten schadest. Einem Krebse gleicht derjenige, der sich arglistig an seinen Bruder heranmacht, auf das Unglück seines Nebenmenschen ausgeht und sich über fremdes Mißgeschick freut. Hüte dich, verruchte Menschen nachzuahmen! Sei zufrieden mit deinem Lose! Armut mit wahrer Genügsamkeit ist den Weisen lieber als jeder Genuss.</p><p>Ich möchte die List und Raubsucht des Polypen nicht übergehen, der von jedem Felsen, an den er sich hängt, die Farbe annimmt. Daher schwimmen so viele Fische unvorsichtig dem Polypen wie auf einen Felsen zu, und werden so dem Listigen eine willkommene Beute. - Solcher Art sind die Leute, die es mit den jeweils herrschenden Machthabern halten, sich den jeweiligen Umständen anpassen, nicht beharrlich in ihrer Gesinnung bleiben, sondern leicht bald so, bald anders sind, keusch mit den Keuschen, unzüchtig unter Unzüchtigen, und nach jedes Gefallen ihre Ansicht ändern. Solchen ist nicht leicht auszuweichen, noch vor Benachteiligung ihrerseits sich zu schützen, weil sie unter der Maske der Freundschaft ihre wohlüberlegte Bosheit verborgen halten. Solche Charaktere nennt der Herr reißende Wölfe, die in Schafskleidern auftreten. Fliehe solchen Wankelmut und solche Charakterlosigkeit! Folge der Wahrheit, der Aufrichtigkeit und Einfalt! Die Schlange ist vielfarbig (und verschlagen), ist darum auch zum Kriechen verdammt worden. Der Gerechte kennt keine Verstellung, wie Jakok. Deshalb „läßt der Herr die Gleichgesinnten in einem Hause zusammenwohnen”. „Da ist das große und geräumige Meer; darin sind kriechende Tiere ohne Zahl, kleine und große.” Aber dennoch herrscht bei ihnen eine weise und gute Ordnung.</p><p>Allein wir haben die Fische nicht bloß anzuklagen; manches an ihnen ist auch nachahmenswert. Wie haben doch die Fischarten je einen entsprechenden Strich sich zugeteilt, betreten kein fremdes Gebiet, sondern bleiben in ihren Grenzen! Und doch hat ihnen kein Geometer die Behausungen zugeteilt, noch sind sie von Mauern umschlossen oder durch Grenzsteine abgeteilt; von Natur ist jeder Fischart der geeignete Bereich festgesetzt. So nährt dieser Meerbusen diese Fischarten, jener andere; und die hier in Masse vorkommen, findet man anderswo kaum. Keine Bergkette mit hohen Gipfeln trennt sie, kein Fluß hindert den Übergang; vielmehr hat ein Naturgesetz gleichmäßig und gerecht die Lebensbedürfnisse der einzelnen Fischarten befriedigt.</p><p>Aber wir sind nicht so. Woher kommt das? Weil wir die ewigen Grenzen verrücken, die unsere Väter gesetzt haben. Wir verteilen die Erde, fügen Haus an Haus, Acker an Acker, um dem Nächsten etwas zu nehmen. Die Walfische kennen ihren von der Natur angewiesenen Aufenthalt; sie haben das Meer außerhalb der bewohnten Länder bekommen, das insellose Meer, dem kein Festland gegenüberliegt. Es wird daher nicht befahren; kein Wissenstrieb und kein Bedürfnis rät den Schiffer zu solchem Wagnis. Dies Meer bewohnen die Wale, den höchsten Bergen gleich an Größe, wie die erzählen, die sie gesehen haben; sie bleiben in ihren Grenzen, bedrohen weder Inseln noch Seestädte. So also haust jede Fischart in den ihr zugewiesenen Teilen des Meeres wie in Städten oder Dörfern oder alten Heimatsitzen.</p><p>Doch gibt es auch wandernde Fischvölker, die gleichsam von einem gemeinsamen Rate in die Fremde gesandt werden und gemeinsam auf ein verabredetes Zeichen hin aufbrechen. Wenn nämlich die bestimmte Laichzeit kommt, wandern sie aus den verschiedenen Meerbusen aus und drängen, dem gemeinsamen Naturgesetze folgend, in das Nordmeer. Zur Zeit der Auswanderung kannst du sehen, wie die Fische in Massen einem Strome gleich durch die Propontis ins Schwarze Meer strömen. Wer ist es, der sie treibt? Wo ist ein königlicher Befehl? Welche öffentliche Bekanntmachung gibt ihnen die bestimmte Zeit an? Wer ist ihr Führer in die Fremde? Du siehst überall die göttliche Anordnung, wie sie selbst die kleinsten Dinge beherrscht. Der Fisch widerspricht dem Gebote Gottes nicht, und wir Menschen wollen uns nicht an die heilsamen Lehren halten. Verachte die Fische nicht, weil sie nicht Sprache noch Vernunft haben! Fürchte dich vielmehr, unvernünftiger als sie zu sein, wenn du der Anordnung Gottes dich nicht fügst! Höre, wie die Fische lautlos, nur mit der Tat sagen: Zur Erhaltung der Gattung werden wir auf diese weite Wanderung geschickt. Sie haben keine eigene Vernunft, haben aber das Naturgesetz, das mächtig in ihnen lebt und ihnen den Weg weist. Laßt uns in das Nordmeer wandern, sagen sie. Denn süßer ist dort das Wasser als in dem übrigen Ozean, weil die Sonne nur kurz darüber verweilt und mit ihren Strahlen ihm nicht alles trinkbare Wasser entzieht. Es freuen sich am Süßwasser auch die Seetiere, weshalb sie häufig in die Flüsse hinausschwimmen und sich weit vom Meere entfernen. Deshalb ist ihnen das Schwarze Meer lieber als die übrigen Meerbusen, weil es geeignet ist zur Erzeugung und Aufzucht ihrer Brut darin. Haben sie dann ihren Zweck voll erreicht, dann kehren sie wieder alle scharenweise nach Hause zurück. Und was ist der Grund? Hören wir die Stummen! Das Nordmeer, sagen sie, ist seicht und wegen seiner flachen Lage den Stürmen ausgesetzt, hat nur wenige Gestade und Buchten. Daher peitschen es die Winde leicht bis auf den Grund auf, so daß sich selbst der Sand in der Tiefe mit den Wellen vermischt. Aber auch kalt ist es zur Winterszeit, weil viele große Flüsse einmünden. Wenn sie also im Sommer darin, so gut es ging, sich ihres Lebens gefreut haben, so eilen sie im Winter wieder zu der Wärme in der Tiefe und an die sonnigen Plätze und ziehen sich scheu vor der grimmigen Kälte des Nordens in die weniger stürmischen Busen (wie in Seehäfen) zurück.</p><p>Ich sah das selbst und bewunderte in allem die Weisheit Gottes. Wenn die unvernünftigen Geschöpfe die nötige Einsicht und Vorsicht haben in bezug auf ihr Wohl, und der Fisch weiß, was er zu wählen und zu fliehen hat, was wollen dann wir sagen, die wir mit Vernunft begabt sind, im Gesetze unterwiesen, durch Verheißungen ermutigt, vom Geiste erleuchtet sind und doch weniger vernünftiger als die Fische auf unser Wohl bedacht sind? Die Fische wissen um eine gewisse Vorsorge für die Zukunft; wir aber vergeuden aus Mangel an Zukunftshoffnung in tierischer Wollust unser Leben. Der Fisch wechselt soviele Meere, um irgendeinen Vorteil zu finden; was willst du sagen, der du im Müßiggang dahinlebst? Müßiggang ist aber der Anfang der Bosheit. Niemand schütze Unwissenheit vor! Eine natürliche Vernunft, die uns die Aneignung des Guten wie die Flucht vor dem Gefährlichen anrät, ist in uns gelegt. Ich höre mit Beispielen aus dem Bereich der Seetiere noch nicht auf; denn mit ihrer Erforschung haben wir es eben zu tun.</p><p>Ich hörte von einem Küstenbewohner, daß der Seeigel, ein ganz kleines und unansehnliches Tier, für die Seeleute häufig zum Vorboten von Windstille und Sturm wird. Sobald er den Sturm voraussieht, schlüpft er unter einen großen Stein, wo er gleichsam fest vor Anker liegt und durch dessen Schwere festgehalten wird, daß er nicht leicht von den Wogen weggespült wird.</p><p>Sobald die Schiffer dies Zeichen sehen, wissen sie, daß ein heftiger Sturm im Anzuge ist. Kein Astrolog, kein Chaldäer, der aus dem Aufgang der Gestirne die Erschütterungen der Luft erschließen will, hat dies Verhalten dem Igel gelehrt, sondern der Herr über Wind und Meer hat dem kleinen Lebewesen eine Spur seiner großen Weisheit eingesenkt. Nichts, was Gott nicht vorausgesehen, wofür er nicht vorgesehen hätte. Alles schaut sein nie schlafendes Auge. Allen ist er nahe, sorgt für eines jeden Wohl. Wenn nun Gott den Igel nicht außer acht gelassen, sollte er dann nicht auf dich acht haben? „Männer, liebet eure Frauen!” Wäret ihr auch einander landfremd, so seid ihr doch in der ehelichen Gemeinschaft zusammengekommen. Das Band der Natur, das unter Segen aufgelegte Joch soll die Getrennten einen. Die Wasserschlange, das gefährlichste unter den Kriechtieren, eilt zur Vermählung mit dem Meeraal und ruft ihn durch ihr Zischen aus den Tiefen zur ehelichen Umarmung. Dieser gehorcht und vereint sich mit dem giftigen Tiere. Was will ich damit sagen? Daß die Gattin ihren Mann, auch wenn er rauh ist und ungeschlacht, geduldig ertragen muß und unter keinem Vorwande die Verbindung lösen darf. Er ist ein Schläger? Gleichwohl der Mann. Ein Trunkenbold? Gleichwohl dir verbunden durch die Natur. Er ist rauh und mürrisch? Gleichwohl ist er ein Glied von dir, und zwar der Glieder vorzüglichstes.</p><p>Es höre aber auch der Mann die ihm geltende Mahnung! Die Viper speit aus Ehrfurcht vor der Ehe ihr Gift aus; und du solltest deine Herzenshärte und Unmenschlichkeit nicht ablegen aus Ehrfurcht vor der ehelichen Verbindung! - Vielleicht ist uns das Beispiel der Viper noch nach einer anderen Seite hin lehrreich: Die Vermischung der Viper mit der Wasserschlange ist doch gewissermaßen ein natürlicher Ehebruch. Die nach fremdem Ehebett gelüsten, sollen sich sagen lassen, welchem Gewürm sie gleichen. Ich habe nur den einen Zweck, die Gemeinde auf jede Weise zu erbauen. Die Leidenschaften der Unenthaltsamen sollen durch Beispiele aus der Welt der Land- und Wassertiere gedämpft und gezügelt werden.</p><p>Hier muß ich aber meine Rede schließen; meine Erschöpfung und die späte Stunde nötigen mich dazu, obschon ich für die aufmerksamen Zuhörer noch viele staunenswerte Dinge über die Lebewelt im Meere und über das Meer selbst hinzuzufügen hätte - über das Meer selbst z. B., wie das Wasser zu Salz wird, wie die kostbare Koralle, im Meere eine Pflanze, an der Luft zu einem harten Stein sich verhärtet, warum die Natur in das unansehnlichste Tierchen, in die Perlmuttermuschel, die hochgeschätzte Perle gelegt hat. Was die Schatzkammern der Könige begehren, das liegt an den Gestaden und Ufern und rauhen Felsen ausgestreut und in Muschelschalen verborgen. Womit nährt die Steckmuschel die goldene Wolle, die bisher noch kein Schönfärber nachgemacht hat? Woher geben die Purpurschnecken den Königen den Purpur, der an Farbenpracht selbst die Blumen der Wiesen zurücklässt?</p><p>„Die Wasser bringen hervor!” Was gibt es da an Notwendigem, das nicht geworden wäre, was an Kostbarem, das uns nicht zum Leben geschenkt wurde? Das eine ist für die Menschen da zur Nutznießung, das andere zur Betrachtung des Schöpfungswunders. Wieder andere Dinge sind schrecklich, um unserm Leichtsinn zu wehren. „Gott schuf die großen Walfische.” Sie werden nicht groß genannt, weil sie größer sind als Krabbe und Mäna, sondern weil sie mit ihrer Körpermasse den größten Bergen gleichen und oft den Eindruck von Inseln machen, wenn sie einmal an die Oberfläche des Wassers auftauchen. Sie halten sich nicht an Ufern und Gestaden auf, sondern hausen im sogenannten Atlantischen Ozean. Uns zur Furcht und zum Schrecken sind diese Tiere so geschaffen worden. Und wenn du hörst, daß das kleine Fischlein Echeneis die größten, mit vollen Segeln und bei günstigem Winde fahrenden Schiffe so leicht anhält, daß er das Schiff sehr lange unbeweglich festhält, gleichsam als wäre es im Meere festgewurzelt, findest du dann nicht auch bei diesem kleinen Tiere den nämlichen Beweis für die Macht des Schöpfers? Nicht nur die Schwert-, Säge-, Hund-, Wal- und Hammerfische sind furchtbar, sondern sogar der Stachel des Stachelrochen, und zwar des toten, und der Seehase sind nicht weniger furchtbar, weil sie schnellen und unvermeidlichen Tod bringen. So will der Schöpfer dich immer wachsam haben, damit du in der Hoffnung auf Gott allen Fährlichkeiten entrinnst.</p><p>Doch laßt uns jetzt aus den Tiefen zurückeilen und aufs Festland uns flüchten. Es haben ja die vielen Wunder der Schöpfung nacheinander uns ergriffen und wie ein unaufhörlicher Wogenschwall unsere Rede in die Tiefe gezogen. Und doch würde es mich wundern, wenn unser Geist, der auf dem Festlande zwar noch größere Wunder gesehen, nicht wieder gern nach Jonas’ Beispiel aufs Meer eilte. Es scheint mir aber der Vortrag, der auf tausend Wunder gestoßen ist, Maß und Ziel vergessen zu haben und in denselben Fehler verfallen zu sein, den die Seeleute machen, die ohne festes Ziel auf dem Meere herumsegeln und am Ende oft nicht wissen, welche Strecke sie durchlaufen haben. Das scheint auch bei uns der Fall zu sein: Unsere Rede durcheilte die Schöpfung, ohne der Fülle des Gesagten gewahr geworden zu sein. Allein wenn auch diese ehrwürdige Versammlung freudig zuhört, und die Erzählung von den Wundern des Herrn in den Ohren seiner Diener angenehm klingt, so wollen wir doch hier unsere Rede schließen und für die Fortsetzung den Tag abwarten. - Erheben wir uns alle, um für das Gesagte zu danken und um die Vollendung des noch Fehlenden zu bitten! Möge der Inhalt meiner Morgen- und Abendpredigt auch bei der Einnahme der Mahlzeit euer Tischgespräch sein! Ja, möchtet ihr selbst im Schlafe euch mit diesen Gedanken beschäftigen, und auch im Schlafe die Freude des Tages verkosten, auf daß ihr sagen könnt: „Ich schlafe, aber mein Herz wacht”, indem es Tag und Nacht das Gesetz des Herrn betrachtet, dem Ehre und Macht in alle Ewigkeit. Amen.</p><h2>8</h2><p><em>Geflügel und Wassertiere</em></p><p><em>Inhalt: Gen 1, 24. Dem Schöpfer dankt die Erde ihre produktive Kraft. - Die Landtiere stehen auf höherer Stufe als die Wassertiere (c. 1). Die Tierseele. - Das Geflügel (ein Nachtrag). Äußerliche Verwandtschaft von Fischen und Vögeln (Flossen = Flügel) (c. 2). Unzählige Arten von Flügeltieren, verschieden in Gestalt, Lebensweise, Eigenschaften, Stimme (c. 3). Biene, Bienenstaat, Bienenwaben. - Die Biene als Vorbild für Menschen (c. 4). Kranich, Storch, Krähe, Schwalbe, Eisvogel sind mit ihren Eigenheiten dem Schöpfer zum Preis, uns zur Belehrung (c. 5). Turteltaube, Adler, Seeadler sind gleichfalls uns Beispiel. - Begattungslos sich fortpflanzende Vögel eine Analogie zur Jungfrauengeburt Maria (c. 6). Eigenarten und Eigenschaften gewisser Vogelgattungen (Fledermaus, Nachtigall, Eule, Hahn, Gans, Geier, Heuschrecke. Seleukisvogel). - Die Insektenwelt. Wasservögel (c. 7). Die Seidenraupe in ihren Entwicklungsstadien - ein Bild unserer Auferstehung. Die Predigt überlang geworden. Deren Anhörung bewahrt wenigstens vor Schlimmerem, vor Trinkgelage, Würfelspiel und nutzlosem Geschwätz. Schluß (c. 8).</em></p><p>„Und Gott sprach: Die Erde bringe hervor eine lebendige Seele nach ihrer Art, vierfüßige, Kriechtiere und wilde Tiere nach ihrer Art. Und es geschah so.” - Es kam der Befehl, ging seinen Weg, und die Erde kleidete sich in ihren Schmuck. Oben hieß es: „Es bringen die <em>Wasser</em> kriechende Tiere mit lebendigen Seelen hervor.” Jetzt aber heißt es: „Die <em>Erde</em> bringe eine lebendige Seele hervor.” Ist denn die Erde beseelt, und haben die törichten Manichäer ein Recht, der Erde eine Seele zu geben? Nicht weil er sprach: „Sie bringe hervor”, brachte die Erde das in ihr Ruhende hervor, sondern e r, der den Befehl gab, verlieh ihr auch die Kraft, hervorzubringen. Auch als die Erde hörte, „sie sprosse das Grün des Grases und fruchtbare Bäume”, war nicht sie es, die das in ihrem Schöße befindliche Gras hervorbrachte, nicht <em>sie</em> trieb die Palme, Eiche oder Zypresse aus der verborgenen Tiefe ihres Schoßes an die Oberfläche empor, sondern das göttliche Wort ist Schöpfer der Kreatur. „Die Erde sprosse" heißt nicht, sie soll hervorbringen, was sie hat, sondern sie soll empfangen, was sie nicht hat, indem ihr Gott die produktive Kraft verleiht. So auch hier: „Die Erde bringe eine Seele hervor”, nicht die in ihr liegende, sondern die ihr von Gott im Befehle gegebene. Zudem wird sich ihre Lehre ins Gegenteil kehren. Denn hat die Erde die Seele hervorgebracht, dann hat sie sich selbst seelenlos zurückgelassen. Doch die Abscheulichkeit ihrer Lehre liegt am Tage.</p><p>Warum aber mußte das Wasser kriechende Tiere mit lebendigen Seelen hervorbringen, die Erde aber eine lebende Seele? Wir schließen nun also: Die schwimmenden Tiere scheinen von Natur ein in etwa weniger vollkommenes Lebensprinzip zu haben, weil sie in dem dichten Wasser leben: Ihr Gehör ist schwer, stumpf ihr Blick, weil sie durch das Wasser sehen; sie haben kein Gedächtnis, keine Phantasie, pflegen keinen Verkehr (mit den Menschen). Damit scheint uns gewissermaßen angedeutet, daß bei den Wassertieren das sinnliche Leben die animalischen Regungen beherrscht, bei den Landtieren aber, deren Leben ein vollkommeneres ist, der Seele die ganze Leitung übertragen ist. Denn bei den meisten Vierfüßlern sind die Sinne schärfer ausgebildet, ist die Auffassungsgabe eine bessere, die Erinnerung an die Vergangenheit eine treuere. Daher sind, wie es scheint, bei den Wassertieren beseelte Leiber geschaffen worden - denn die Kriechtiere mit lebendiger Seele sind aus den Wassern hervorgegangen -, bei den Landtieren aber mußte eine den Leib lenkende Seele entstehen, da die auf dem Lande lebenden Tiere am Lebensprinzip etwas innigeren Anteil haben. Vernunftlos sind ja freilich auch die Landtiere; aber gleichwohl bekundet doch jedes durch seinen Naturlaut mannigfache seelische Regungen: Freude und Trauer, Kenntnis von der Geselligkeit und Bedürfnis nach Nahrung, Absonderung von ihren Weidegenossen und unzählige Gemütsbewegungen lassen sie in der Stimme verlauten. Die Wassertiere aber sind nicht nur stumm, sondern auch unzähmbar und ungelehrig und jedem Verkehr mit den Menschen unzugänglich. „Der Ochs kennt seinen Besitzer und der Esel die Krippe seines Herrn.” Der Fisch aber erkennt wohl kaum seinen Ernährer. Der Esel kennt die gewohnte Stimme, weiß den Weg, den er oft gegangen, und manchmal wird er gar Wegweiser dem Menschen, der fehlgeht. Das scharfe Gehör des Tieres soll nicht seinesgleichen haben unter den Landtieren. Welches Seetier könnte es dem Kamel gleichtun in Erinnerung an Mißhandlung, in Rachgier und langwierigem Zorne? Wenn nämlich das Kamel früher einmal geschlagen worden ist, so verbirgt es lange seinen Groll, vergilt aber die Mißhandlung, sobald sich Gelegenheit bietet. Hört, ihr Zornmütigen, die ihr das Nachtragen einer Beleidigung für Tugend wähnt, wem ihr ähnlich seid, wenn ihr den Groll auf den Nebenmenschen wie einen unter der Asche glimmenden Funken so lange verwahrt, bis ihr den Anlaß findet, gleichsam die Flamme des Zornes auflodern zu lassen.</p><p>„Es bringe die Erde hervor eine lebendige Seele.” Warum bringt die Erde eine lebendige Seele hervor? Damit du den Unterschied zwischen einer Tierseele und einer Menschenseele kennen lernest. Etwas später sollst du erfahren, wie die Seele des Menschen beschaffen ist; jetzt aber höre etwas über die Seele der Tiere! Da nach der Schrift eines jeden Tieres Seele sein Blut ist, das Blut aber sich verdichtet und in Fleisch verwandelt, das Fleisch aber verwest und in Erde sich auflöst, so ist die Tierseele natürlich erdhaft. „Die Erde bringe eine lebendige Seele hervor.” Sieh auf die Verwandtschaft der Seele mit dem Blute, des Blutes mit dem Fleische, des Fleisches mit der Erde, und geh umgekehrt wieder denselben Weg zurück von der Erde zum Fleische, vom Fleische zum Blute, vom Blute zur Seele, so findest du, daß die Tierseele Erde ist. Glaub nicht, sie sei älter als ihre Leibessubstanz, oder sie werde nach der Auflösung des Fleisches fortbestehen! Kehr dich ab von dem Geschwätz der anmaßenden Philosophen, die sich nicht schämen, ihre Seelen mit den Seelen der Hunde auf <em>eine</em> Linie zu stellen, und behaupten, sie seien selbst einmal Frauen, Gesträuche und Seefische gewesen. Ob sie nun je einmal Fische gewesen, will ich nicht entscheiden, aber daß sie in dem Augenblicke, da sie das niederschrieben, unvernünftiger als die Fische waren, das möchte ich steif und fest behaupten. „Die Erde bringe hervor eine lebendige Seele.”</p><p>Vielleicht wundern sich sehr viele, weshalb ich mitten im Laufe der Rede ziemlich lange geschwiegen habe; doch werden die besonders aufmerksamen Zuhörer den Grund für mein Schweigen wohl wissen. Wieso? Durch ihr gegenseitiges Anschauen und Winken haben sie mich aufmerksam gemacht und mich an das erinnert, was ich übergangen hatte. Eine ganze Gattung in der Kreatur, und zwar nicht die unbedeutendste, ist uns entgangen, und nur wenig fehlte, so hätte unser Vortrag sie überhaupt nicht berührt. Denn „die Wasser bringen hervor kriechende Tiere mit lebendiger Seele nach ihrer Art und <em>geflügelte Tiere</em>, die über der Erde am Firmamente des Himmels dahinfliegen.” Gesprochen haben wir wohl von den schwimmenden Tieren, soweit es die gestrige Abendstunde erlaubte; heute sind wir zur Schilderung der Landtiere übergegangen. Es entging uns also das Geflügel in der Mitte. Wie vergeßliche Wanderer, die etwas Wichtiges zurückgelassen haben und, obschon eine gute Strecke Weges weitergegangen, diese noch einmal machen und als verdiente Strafe für ihre Vergeßlichkeit die Beschwerden des Weges auf sich nehmen, so müssen also auch wir, wie billig, denselben Weg noch einmal machen. Was wir nämlich übergangen haben, ist auch nicht etwas Nebensächliches, sondern etwa ein Drittel der Tierwelt. Es gibt ja drei Tiergattungen: Landtiere, Vögel und Wassertiere. „Die Wasser”, heißt es, „bringen hervor kriechende Tiere mit lebendiger Seele nach ihrer Art, und geflügelte Tiere, die über der Erde an der Feste des Himmels dahinfliegen, nach ihrer Art.” Warum ließ er auch die geflügelten Tiere aus den Wassern entstehen? Weil eine gewisse Verwandtschaft besteht zwischen dem Gefieder und den Fischen. Wie nämlich die Fische das Wasser durchschneiden, mit den Flossen sich vorwärts bewegen, mit der Wendung des Schwanzes sich sowohl die Seitwärtsbewegungen geben wie die Richtung geradeaus, so sieht man auch das Geflügel mit seinen Schwingen in ähnlicher Weise die Luft durchschwimmen. Weil also beide Gattungen das Schwimmen als ihre gemeinsame Eigenart haben, ward zwischen ihnen gewissermaßen die Verwandtschaft infolge ihrer (gemeinsamen) Entstehung aus dem Wasser hergestellt. Nur daß kein Vogel ohne Füße ist, weil sie alle von der Erde ihre Nahrung erhalten, und darum alle den Dienst der Füße benötigen. Die Raubvögel haben zum Fange ihrer Beute ihre scharfen Klauen; den andern Vögeln ward zur Beschaffung ihres Futters und zu ihrer sonstigen Lebenserhaltung der Dienst ihrer Füße gegeben. Wenige Vögel sind schlecht auf den Füßen, die weder zum Gehen noch zum Jagen taugen; so können die Schwalben nicht gehen noch jagen, besonders die sogenannten Mauerschwalben, denen ihre Nahrung aus dem, was in der Luft herumschwirrt, zugedacht ist. Übrigens ersetzt bei der Schwalbe der nahe Flug an der Erde den Dienst der Füße.</p><p>Es gibt aber unzählig verschiedene Arten auch in der Vogelwelt. Wollte man darauf ebenso eingehen, wie wir es teilweise bei der Schilderung der Fische versucht haben, so würde man unter der <em>einen</em> Bezeichnung „Geflügel” unzählige Unterschiede an Größe, Gestalt und Farbe finden. Auch in ihrer Lebensweise, in ihrem Treiben, in ihren Gewohnheiten würde man eine unglaubliche Mannigfaltigkeit entdecken. Schon haben es ja einige auch mit neuen Benennungen versucht, um durch solche spezifische, besondere Bezeichnung wie mit Brandmalen die Eigentümlichkeit jeder Art kenntlich zu machen. So nannten sie einige Vögel Spaltflügler, wie die Adler, andere Hautflügler, wie die Fledermäuse, andere Dünnflügler, wie die Wespen, wieder andere Scheideflügler, wie die Käfer und alle, die gleichsam in Scheiden und Schalen geboren werden und erst nach Zerreißung der Hülle zum Fluge frei werden. Allein uns genügt zur Unterscheidung der besonderen Arten der allgemeine Sprachgebrauch und die in der Schrift übliche Einteilung in reine und unreine Tiere. Eine andere Art ist die der Fleischfresser, die auch einen andern, ihrer Lebensweise entsprechenden Körperbau haben: Sie haben scharfe Krallen, einen krummen Schnabel, einen raschen Flug, um die Beute schnell erhaschen, zerreißen und verzehren zu können. Einen anderen Bau haben die Samenfresser, und wieder einen anderen die Vögel, die sich von allem nähren, was sie finden. Auch unter letzteren gibt es wieder eine Menge Unterschiede. Einige von ihnen - die Raubvögel ausgenommen, die nur zur Paarung zusammenkommen - scharen sich zusammen, wie die Tauben, die Kraniche, Staren und Dohlen. Unter diesen sind die einen wieder ohne eine Herrschaft, gewissermaßen autonom; die andern aber lassen sich eine Führung gefallen, wie die Kraniche. Auch waltet bei ihnen noch ein anderer Unterschied ob, demzufolge die einen an ihrem Aufenthaltsort und im Lande verbleiben, die andern Zugvögel sind und beim Nahen des Winters regelmäßig auswandern. Sehr viele Vögel lassen sich aufziehen, werden heimisch und zahm, ausgenommen die schwachen, welche wegen übergroßer Scheu und Furchtsamkeit die stete Beunruhigung durch die Hand nicht ertragen. Einige Vögel sind gern mit den Menschen zusammen, wohnen mit uns unter demselben Dach; andere sind Gebirgsvögel und lieben die Einöde. Am meisten unterscheiden sich die Vögel in der Stimme. Die einen sind geschwätzig und plauderhaft, andere aber schweigsam. Die einen sind melodische Sänger, die andern sind ganz unmusikalisch und gesangsunkundig. Die einen ahmen gerne nach - entweder aus natürlicher Veranlagung oder auf Grund von Dressur, die andern geben immer denselben gleichförmigen, unveränderten Laut von sich. Der Hahn ist stolz, der Pfau eitel, die Tauben und Haushühner geil, das sie jeden Augenblick die Paarung vornehmen. Das Rebhuhn ist listig und neidig und boshaft den Jägern beim Erjagen der Beute behilflich.</p><p>Wie gesagt, unzählbar die Unterschiede in Betätigung und Lebensweise! Es gibt bei einigen Tieren auch eine Art Staatswesen, sofern dessen Eigentümlichkeit darin besteht, daß alle seine Glieder mit ihrer Tätigkeit <em>einen</em> gemeinsamen Zweck verfolgen, wie man das bei den Bienen beobachten kann. Gemeinsam ist ihre Wohnung, gemeinschaftlich der Flug, <em>eine</em> aller Betätigung; und, was das Größte ist, unter einem König und Anführer fassen sie die Arbeit an und wagen sich nicht eher auf die Wiese hinaus, als bis sie den König an der Spitze des Schwarmes sehen. Ihr König ist kein Wahlkönig - oft schon hat ja mangelnde Urteilskraft des Volkes den Schlechtesten auf den Thron erhoben -; auch dankt er seine Macht nicht dem Lose - die blinde Zufallslosung überträgt oft dem Allerletzten die Macht -; auch keine Abstammung bringt ihn auf den Thron - auch diese werden ja sehr oft durch Schweißerei und Schmeichelei verzogen und sind jeder Tugend bar -; sondern von Natur hat er die Herrschaft über alle, weil er durch Größe, Gestalt und Charaktermilde sich auszeichnet. Der König hat wohl einen Stachel, gebraucht ihn aber nicht zur Rache. Eines von den ungeschriebenen Gesetzen der Natur ist eben auch dies, daß die Träger der obersten Gewalt bei Bestrafungen langsam vorgehen sollen. Aber die Bienen, die dem Beispiele des Königs nicht folgen, haben ihre Unbesonnenheit bald zu bereuen, insofern sie mit dem Stiche sterben. Hört es, ihr Christen, denen geboten ist, keinem Böses mit Bösem zu vergelten, sondern im Guten das Böse zu besiegen. Ahme das Verhalten der Biene nach, die niemand schadet und keine fremde Frucht zerstört, wenn sie ihre Waben baut. Wie man sieht, sammelt sie von den Blumen das Wachs, den Honig aber, d. h. die tauartig in die Blumen gelegte Feuchtigkeit, saugt sie mit dem Rüssel ein und trägt ihn in die hohlen Waben. Daher ist er anfangs auch flüssig, wird aber mit der Zeit gekocht, besteht und wird süß. Die Biene hat in den Sprüchen ein schönes und zutreffendes Lob bekommen, indem sie weise und arbeitsam genannt wird: Sie sammelt so fleißig ihre Nahrung - „ihrer Arbeit Frucht”, heißt es, „beschaffen sich Könige und einfache Leute zur Gesundung” -, so weise und kunstgerecht baut sie die Aufbewahrungskammern für den Honig, zu einem dünnen Häutchen spannt sie das Wachs aus und baut darauf dicht nebeneinander die Zellen; und die dichte Aneinanderreihung der sonst so zarten Zellen gibt dem Ganzen Halt und Festigkeit. Eine Zelle hängt an der andern, durch eine dünne Wand voneinander geschieden und doch wieder verbunden. Sodann sind diese Röhren in zwei bis drei Stockwerken übereinander gebaut. Denn die Biene hütet sich, nur einen fortlaufenden Zellenbau zu machen, damit nicht die Flüssigkeit infolge der Schwere nach außen abfließt. Und sieh, wie die Erfindungen der Geometrie eine Zugabe der so weisen Biene sind: Alle Röhren der Waben sind sechseckig und gleichseitig; auch liegen sie nicht direkt übereinander, damit nicht der gemeinsame Boden der leeren und vollen Zellen Schaden leide; vielmehr sind die Winkel des unteren Sechseckes Stütze und Fundament für das darüberliegende und tragen so sicher die Last darüber, und der Honig bleibt in den einzelnen Waben gesondert.</p><p>Wie könnte ich dir alle die Eigenheiten der Vögel in ihrer Lebensweise genau aufzählen? Wie die Kraniche bei Nacht abwechselnd Wachen aufstellen; während die einen schlafen, umkreisen sie die andern und gewähren ihnen während des Schlafes volle Sicherheit. Ist die Zeit der Wache vorüber, so schreit der Wächter und legt sich zum Schlafen; ein anderer übernimmt den Posten und gewährt ihm seinerseits dieselbe Sicherheit, die ihm zuteil geworden. Eine gleiche Ordnung beobachtet man bei ihrem Fluge. Da übernimmt einer die Führung, und wenn er eine bestimmte Zeit lang den Zug geführt hat, zieht er sich zurück und übergibt die Führung dem, der hinter ihm kommt. - Der Störche Verhalten verrät fast vernünftige Überlegung: Wie sie alle um dieselbe Zeit in unsere Gegenden kommen, so ziehen sie auch alle wie auf ein verabredetes Zeichen wieder fort. Unsere Krähen aber geben ihnen wie Trabanten das Geleite und leisten ihnen, wie mir scheinen will, eine gewisse Hilfe im Kampfe gegen die feindlichen Vögel. Anzeichen dafür ist mir erstens, daß um diese Zeit herum nirgends eine Krähe zu sehen ist, sodann, daß sie Wunden zurückbringen als sichere Merkmale des Schutz- und Trutzbündnisses. Wer hat ihnen die Gesetze solcher Gastfreundschaft gegeben? Wer hat ihnen für ein Desertieren eine Strafe angedroht, so daß keine vom Geleite zurückbleibt? - Das mögen die sich gesagt sein lassen, die hart gegen Fremde sind, ihnen die Türen verschließen, ihnen selbst im Winter und bei Nacht kein Obdach geben. Und die Fürsorge der Störche für ihre Alten sollte unseren Kindern, wenn sie darauf achten wollten, genug Ansporn sein, ihre Kindesliebe zu bezeugen. Es ist doch jedenfalls kein Mensch so unvernünftig, daß er es nicht beschämend fände, an Tugend den unvernünftigsten Vögeln nachzustehen. Die Störche umstellen nämlich im Kreise den Vater, wenn ihm im Alter die Federn ausfallen, wärmen ihn mit ihren Flügeln und besorgen ihm reichlich Futter, und sogar beim Fluge geben sie ihm alle mögliche Hilfe, indem sie ihn auf beiden Seiten mit den Flügeln sanft emporheben. Das ist so allgemein bekannt, daß man bereits die Wiedervergeltung von Wohltaten als „Storchendank” bezeichnet.</p><p>Niemand klage über Armut, noch verzweifle er an seinem Leben, wenn er auch zu Hause keinen Vorrat hat, sondern er schaue auf die Geschicklichkeit der Schwalbe. Wenn sie nämlich ihr Nest baut, trägt sie mit dem Schnabel dünnes Reisig zusammen. Weil sie aber mit den Füßen den Kot nicht aufheben kann, benetzt sie die Spitzen ihrer Flügel mit Wasser, taucht sie dann in feinsten Staub und weiß so den Kot nutzbar zu machen, indem sie damit wie mit Leim das dünne Reisig allmählich verbindet. In diesem Neste zieht sie nun ihre Jungen groß. Verletzt sich eines am Auge, so hat sie ein natürliches Heilmittel, womit sie das Gesicht der Jungen wieder gesund macht. Dies soll dich mahnen, nicht aus Armut dem Laster dich zu ergeben, noch in den drückendsten Heimsuchungen alle Hoffnung zu verlieren und untätig und energielos hinzuliegen, sondern zu Gott deine Zuflucht zu nehmen, der, wenn er die Schwalbe mit solchen Wohltaten überhäuft, noch weit größere Gaben denen verleihen wird, die ihn von ganzem Herzen anrufen.</p><p>Der Eisvogel ist ein Seevogel. Er pflegt unmittelbar an den Gestaden zu brüten und legt seine Eier in den Sand. Er brütet etwa mitten im Winter, wenn das Meer von vielen heftigen Winden gegen das Land getrieben wird. Doch schweigen alle Winde und ruht die Meereswoge während der sieben Tage, die der Eisvogel über den Eiern sitzt. Denn in soviel Tagen brütet er die Jungen aus. Weil sie aber auch Futter brauchen, so hat der gütigste Gott den winzigen Tierchen noch weitere sieben Tage zur Aufziehung der Jungen gegeben. Das wissen die Seeleute allgemein und nennen daher diese Tage die Halkyonischen („Eisvogelbruttage”). Diese Vorsehung Gottes für die unvernünftige Kreatur soll dich ermahnen, von Gott zu erbitten, was zu deinem Heile dient. Welches Wunder sollte nicht geschehen deinetwegen, der du ja nach Gottes Ebenbild erschaffen bist, wenn er sogar einem winzigen Vogel zuliebe das gewaltige, schreckliche Meer bändigt und ihm gebietet, mitten im Winter sich ruhig zu verhalten?</p><p>Die Turteltaube, einmal von ihrem Gatten getrennt, soll keine andere Verbindung mehr eingehen, sondern unbegattet bleiben, indem sie in Erinnerung an den früheren Gatten die Verbindung mit einem andern verschmäht. Aufhorchen mögen die Frauen, wie selbst bei den unvernünftigen Geschöpfen die Ehre des Witwenstandes dem Unziemlichen mehrmaliger Heirat vorgezogen wird! - Der Adler ist höchst ungerecht in der Aufziehung seiner Jungen. Zwei Junge brütet er aus; eines von ihnen stößt er mit Flügelschlägen von sich und wirft es auf die Erde hinab. Nur <em>eines</em> läßt er bei sich und nimmt es zu eigen an; weil ihm die Ernährung (beider) zu viel Mühe kostet, macht er sich von einem los, das er erzeugt hat. Aber die Phene läßt, wie man sagt, dieses (verstoßene) Junge nicht umkommen, sondern nimmt es auf und zieht es mit ihren Jungen groß. So handeln jene Eltern, die unter dem Vorwande der Armut ihre Kinder aussetzen, oder auch bei Verteilung des Erbes sehr ungleich ihre Kinder behandeln. Denn es ist nur gerecht, daß sie, wie sie einem jeden auf gleiche Weise das Dasein gegeben haben, so auch allen die zum Leben nötigen Mittel gleichmäßig und gleichwertig gewähren. Ahme nicht die Grausamkeit der krummkralligen Vögel nach, die ihre Jungen, kaum flügge geworden, aus dem Neste werfen, mit den Flügeln schlagen und verstoßen und sich nicht weiter mehr um sie kümmern! Lobenswert ist die Liebe der Krähe zu ihren Jungen; sie begleitet die Brut noch, wenn sie schon ausfliegt, speist und nährt sie sehr lange.</p><p>Viele Vogelarten bedürfen zur Empfängnis nicht der Begattung durch das Männchen. Bei den anderen Arten sind die Windeier unfruchtbar. Die Geier sollen größtenteils ohne Begattung legen, und zwar noch in sehr hohem Alter; denn sie werden gewöhnlich bis zu hundert Jahre alt. - Dies sollst du mir aus der Geschichte der Vogelwelt recht wohl merken, damit du für den Fall, daß einige unser Geheimnis von der Geburt aus der Jungfrau ohne leichteste Verletzung deren Jungfrauschaft als etwas Unmögliches und Widernatürliches verspotten, dich erinnerst, daß Gott, dem es gefallen hat, durch die Torheit des Evangeliums die Gläubigen selig zu machen, schon in der Natur tausendfachen Anlaß gab, an die Wunder zu glauben.</p><p>„Die Wasser bringen hervor kriechende Tiere mit lebendiger Seele und geflügelte Tiere, die über der Erde am Firmamente des Himmels dahinfliegen.” „Über der <em>Erde</em>” zu fliegen ward ihnen geboten, weil sie alle von der Erde ihr Futter bekommen, am „Firmamente des <em>Himmels</em>” aber, weil, wie schon oben dargelegt, hier die Luft οὐϱανός (= Himmel) genannt wird - vom Worte ὁϱσϑαι (= gesehen werden). „<em>Firmament</em>” aber heißt es, weil die Luft zu unsern Häupten im Vergleiche mit dem ätherischen Körper etwas dichter und mit den von unten aufsteigenden Dünsten gesättigt ist. Du hast also einen Himmel mit seinem Schmucke, eine Erde mit ihrer Schönheit, ein Meer mit seiner reichen Fauna, eine Luft voll Vögel, die sie durchfliegen. Das alles ist auf Gottes Befehl aus dem Nichts ins Dasein gerufen worden. Was alles aber unsere Rede übergangen hat, um nicht zu weit und zu breit zu werden, das erwäg als eifriger Christ bei dir selbst, lern’ in allem die Weisheit Gottes kennen, und hör’ nie auf, sie zu bewundern und den Schöpfer in jeglicher Kreatur zu verherrlichen!</p><p>Du hast in der Dunkelheit die Arten der Nachtvögel, beim Lichte die Tagesvögel. Die Fledermäuse, Nachteulen und Nachtraben gehen bei Nacht auf Nahrung aus. Kannst du also einmal nicht zeitig einschlafen, so darfst du nur bei diesen verweilen und ihre Eigentümlichkeiten betrachten, und du hast Grund genug zum Lobpreis auf Gott: (Erwäg) wie die Nachtigall nicht schläft, wenn sie auf den Eiern sitzt und die ganze Nacht hindurch ihr Singen nicht einstellt wie die Fledermaus zugleich ein vierfüßiges und fliegendes Tier ist, wie sie allein unter den Vögeln Zähne hat und wie die vierfüßigen Tiere Junge wirft; wie sie in der Luft schwärmt, aber nicht mit Fittichen, sondern mittels eines ledernen Häutchens sich aufschwingt; wie auch diese Art von Natur in gegenseitiger Liebe zueinander steht, wie nämlich die Fledermäuse sich gleich einer Kette aneinanderschließen und aneinanderhängen, was bei uns Menschen nicht leicht der Fall ist; denn den meisten stehen ihre Sonder- und Privatinteressen höher als Gemeinwohl und Einigkeit. Wie gleichen doch den Augen der Eule die, welche mit der eitlen Weisheit sich beschäftigen! Auch ihr Gesicht ist bei Nacht scharf, wird aber stumpf, sobald die Sonne aufleuchtet. So ist auch der Verstand solcher Leute in eitler Wissenschaft sehr scharf, aber für die Erkenntnis des wahren Lichtes abgestumpft.</p><p>Auch am Tage hast du immer und überall reichlich Anlaß zur Bewunderung des Schöpfers. Wie weckt dich der Haushahn zur Arbeit, der mit lautem Geschrei kräht und das Nahen der noch weitabstehenden Sonne ankündigt, mit dem Wanderer aufwacht und den Landmann zur Ernte hinaustreibt! Wie wachsam ist das Geschlecht der Gänse und wie scharf deren Sinn für die schleichende Gefahr! Haben sie doch einst die Kaiserstadt gerettet, als sie die Feinde, die durch unterirdische, verborgene Gänge der Burg Roms nahten und sie schon nehmen wollten, verrieten. Bei welcher Vogelart zeigt nicht die Natur ein besonderes Wunder? Wer kündigt den Geiern den Tod der Menschen an, wenn diese widereinander zu Felde ziehen? Du siehst ja unzählige Scharen Geier den Heeren folgen, die aus der Waffenrüstung auf den Ausgang schließen. Das kommt aber menschlichem Schließen recht nahe. Oder soll ich dir von den furchtbaren Heereszügen der Heuschrecken erzählen? Wie auf ein Zeichen hin erhebt sich ein solcher Schwärm und lagert auf weitem Felde, rührt aber die Früchte nicht eher an, als bis ihm der göttliche Befehl dazu erteilt wird. Wie kommt es, daß der Seleukis den Heuschrecken folgt - als Befreier von der Plage, dem eine unersättliche Freßlust eigen ist, mit der der gütige Gott seine Natur der Menschen wegen bedacht hat. Wie eigenartig ist doch das Zirpen der Zikade? Warum ist es am Mittage lauter, da sie doch durch das Einziehen der Luft in die Panzerhöhlung den Laut hervorbringt?</p><p>Doch mir scheint, ich vermag noch weniger mit Worten die Wunder in der Vogelwelt zu schildern als mit meinen Füßen ihre Schnelligkeit zu erreichen. Wenn du von den Geflügelten die sogenannten Insekten - so heißen sie von den Einschnitten, die sie überall zeigen -, wie die Bienen und Wespen siehst, so beherzige, daß sie keinen Atem haben noch eine Lunge, sondern am ganzen Körper mit Luft genährt werden. Werden sie also mit Öl benetzt, und werden so die Poren verstopft, dann kommen sie um. Begießt man sie aber dann sofort mit Essig, dann öffnen sich die Poren, und sie leben wieder auf. Nichts Überflüssiges hat unser Gott erschaffen, aber auch nichts vergessen, was notwendig ist. Betrachtest du sodann die Wasservögel, so wirst du bei ihnen einen anderen Körperbau finden, nämlich weder gespaltene Füße wie bei den Krähen, noch Krallen wie bei den Fleischfressern, sondern breite, häutige Füße, damit sie leicht auf dem Wasser schwimmen, indem sie mit den Fußhäuten wie mit Rudern das Wasser von sich stoßen. Wenn du aber beobachtest, wie der Schwan seinen Hals in die Tiefe taucht und sich vom Grunde das Futter heraufholt, so wird dir die Weisheit des Schöpfers klar werden, der ihm deshalb einen Hals gegeben hat, der länger ist als die Füße, damit er ihn wie eine Angel hinabtauche und die in der Tiefe verborgene Nahrung heraufhole.</p><p>Die Schriftworte, nur so gelesen, sind ein paar kurze Silben. „Es bringen die Wasser hervor geflügelte Tiere, die über der Erde am Firmamente des Himmels dahinfliegen.” Erforscht man aber den Sinn dieser Worte, dann wird das große Wunder der Weisheit des Schöpfers offenbar. Wie vielerlei Geflügel hat er doch vorgesehen! Wie hat er sie doch nach Art und Gattung geschieden, und wie jede Art durch Eigentümlichkeiten charakterisiert! Der ganze Tag reichte nicht aus, euch die Wunder der Luft zu schildern. Es ladet uns das Festland ein, die wilden, kriechenden und zahmen Tiere vorzuführen; es hat den Pflanzen, Wassertieren und der ganzen Vogelwelt Gleichwertiges gegenüberzustellen.</p><p>„Die Erde bringe hervor lebende Wesen, zahme, wilde und Kriechtiere nach ihrer Art.” Was sagt ihr dazu, die ihr des Paulus Lehre über die Verwandlung bei der Auferstehung nicht glaubt, wenn ihr doch viele Tiere in der Luft ihre Gestalt verändern seht? So erzählt man vom gehörnten indischen Wurm, er verwandle sich zuerst in eine Raupe, werde dann mit der Zeit eine Puppe, bleibe aber auch in dieser Gestalt nicht, sondern werde mit dünnen breiten Blättern beflügelt. Wenn nun ihr Frauen dasitzt und dessen Gespinst abhaspelt, die Kokons nämlich, die euch die Serer zur Anfertigung weicher Kleider senden, so denkt an die Verwandlung dieses Tierchens, verbindet damit lebhaft den Gedanken an die Auferstehung, und zweifelt nicht an der Verwandlung, die Paulus allen verkündet.</p><p>Allein ich merke, daß meine Rede das Maß verliert. Wenn ich auf die Menge des Gesagten schaue, so habe ich sichtlich das Maß überschritten; sehe ich aber auf den Reichtum der Weisheit in ihren Schöpfungen, dann glaube ich kaum mit der Schilderung begonnen zu haben. Doch ist es nicht unnütz, euch länger hinzuhalten. Was kann denn einer auch bis zum Abend tun? Es drängen euch keine Gäste; es erwarten euch keine Trinkgelage. So wollen wir denn, wenn es euch gefällt, leiblich fasten zur Wohlfahrt der Seele. Oft genug hast du der Lust des Fleisches gedient; heute oblieg dem Dienste der Seele! „Habe deine Lust an dem Herrn, so wird er dir geben, was dein Herz verlangt.” Liebst du Reichtum; hier hast du geistigen Reichtum. „Die Gerichte des Herrn sind wahrhaftig, gerechtfertigt in sich selbst, wünschenswerter als Gold und viel Edelgestein.” Liebst du Genuß und Vergnügen, so hast du die Worte Gottes, die dem geistig Veranlagten „süßer sind als Honig und Honigseim”. Entlasse ich euch und löse die Versammlung auf, so laufen einige zum Würfelspiele. Dort gibt es Flüche, heilige Streitereien und leidenschaftliche Geldgier. Der Teufel steht dabei, stachelt mit punktierten Knochen zur Wut, verteilt den (Geld-)Einsatz bald auf diese, bald auf die andere Seite und macht so bald diesen stolz auf einen Sieg und versenkt den andern in Traurigkeit, bald macht er letzteren übermütig und beschämt ersteren. Was nützt das leibliche Fasten, wenn die Seele mit tausend Bosheiten angefüllt ist? Wer aber nicht würfelt, sondern anderweitig müßig geht, was redet der nicht unnütz’ Zeug; was Törichtes hört der nicht an? Denn Muße ohne Gottesfurcht ist für Unbeschäftigte Lehrerin der Schlechtigkeit. Vielleicht werdet ihr doch aus Gesagtem einigen Gewinn schöpfen, wenn nicht, dann läßt euch die Aufmerksamkeit hier wenigstens keine Zeit übrig, zu sündigen. Euch länger hinhalten, heißt euch länger dem Bösen fernhalten.</p><p>Einem wohlmeinenden Beurteiler mag das Gesagte genügen, wenn er nicht auf den Reichtum der Schöpfung, sondern auf unser schwaches Können sieht und darauf, daß es die Erschienenen erheben und befriedigen kann. Die Erde hat euch erfreut mit ihren Gewächsen, das Meer mit seinen Fischen, die Luft mit ihren Vögeln. Das Fastland ist in der Lage, dem Gleichwertiges aufzuweisen. - Doch hier wollen wir mit dem Morgenmahl Schluß machen, damit nicht Übersättigung euch den Geschmack am Abendmahle verderbe. Der aber, der alles mit seiner Schöpfung erfüllt und uns in allem leuchtende Denkmäler seiner Wunder hinterlassen hat, erfülle eure Herzen mit aller geistigen Freude in Christus Jesus, unserm Herrn, dem Ehre und Macht von Ewigkeit zu Ewigkeit. Amen.</p><h2>9</h2><p><em>Die Landtiere</em></p><p><em>Inhalt: Einleitung: Basilius fühlt sich als dürftigen Gastgeber. - Bibelworte nicht allegorisch, sondern buchstäblich zu nehmen. Bibeloffenbarung befriedigt mehr als hypothetische Menschenweisheit (c. 1). Das Gesetz von der Erhaltung der Art. - Die immer produktive Erde. Die Tiere erdentstammt - erdwärts gerichtet. Des Menschen Bestimmung: himmelwärts (c. 2). Jedes Tier hat dieselbe animalische Seele; doch die Eigenschaften sind reich differenziert. Die Äußerungen des Tierinstinktes mahnen den Menschen zur Sorge für Leben und Seele (c. 3). Naturanlagen und Naturgesetze im Menschen. Durch zuwiderlaufende Sünden Entwürdigung des Menschen unter das Tier (c. 4). Die weise Ökonomie in der Gestaltung der Tierwelt zu deren Erhaltung und Fortpflanzung (c. 5). Das Wild erschaffen zur Stärkung des gläubigen Sinnes. - Die Erschaffung des Menschen gemeinsam mit der zweiten göttlichen Person, die dem Vater wesensgleich. Die jüdisch gesinnten Anomöer leugnen diese Deutung von Gen 1, 26. Schlußermahnung (c. 6).</em></p><p>Wie hat euch der Morgentisch (meines Vortrages) gefallen? Mir ist nämlich der Gedanke gekommen, meine Leistung mit dem guten Willen eines armen Gastgebers vergleichen zu dürfen, der gern eine gute Tafel vorsetzen möchte, aber aus Mangel an köstlichen Gerichten in übertriebener Weise auf die ärmliche Aufmachung der Tafel es absieht und damit seine Gäste nur ärgert und sich mit seinem Ehrgeize den Vorwurf der Albernheit zuzieht. Derartig ist wohl auch unsere Leistung; ihr müßtet nur etwa anders urteilen. Doch sei dem, wie ihm wolle, wenn ihr uns nur nicht verachtet. Verschmähten doch auch den Elisäus seine Zeitgenossen nicht als schlechten Gastgeber, obschon er seine Freunde nur mit wilden Kräutern bewirtete.</p><p>Ich kenne die Gesetze der Allegorese, obschon ich sie nicht aus mir selbst geschöpft habe, auf die ich vielmehr in den Arbeiten anderer gestoßen bin. Sie nehmen die Schriftworte nicht in ihrem gewöhnlichen Sinne und nennen Wasser nicht Wasser, sondern verstehen darunter irgendeine andere Natur; auch Pflanze und Fisch deuten sie willkürlich, verdrehen und deuten auch die Entstehung der kriechenden und anderen Tiere ganz nach ihrem Geschmacke, wie die Traumdeuter die Traumerscheinungen ganz nach ihrem Kopfe auslegen. Wenn ich aber von Gras höre, dann denke ich an Gras, und Pflanze, Fisch, Wild, Haustier, überhaupt alles verstehe ich so, wie das Wort besagt. „Ich schäme mich doch des Evangeliums nicht.” Die Kosmographen haben ja freilich viel über die Gestalten der Erde sich gestritten, ob sie eine Kugel sei, ein Cylinder oder einer Wurfscheibe (Diskus) gleich und auf allen Seiten gleichmäßig abgerundet, oder ob siebkorbartig und in der Mitte hohl - auf all diese Hypothesen sind die Kosmographen verfallen, ein jeder zur Widerlegung des andern. Aber das kann mich doch nicht dazu verleiten, unseren Weltschöpfungsbericht geringschätziger zu beurteilen, weil der Diener Gottes nichts von den Gestalten meldet noch sagt, daß der Umfang der Erde einhundertachtzigtausend Stadien betrage, auch nicht angibt, wie weit ihr Schatten reiche, wenn die Sonne unterhalb der Erde sich bewegt, noch wie dieser die Mondfinsternisse verursacht, wenn er den Mond trifft. Wenn er nun das, was für uns belang- und nutzlos ist, verschwiegen hat, soll ich deshalb die Offenbarungen des Geistes geringer werten als die törichte Weltweisheit? Oder soll ich nicht vielmehr den preisen, der unsern Geist mit eitlen Dingen verschonen wollte und nur das aufschreiben ließ, was zur Erbauung und Läuterung unserer Seelen dient? Das scheinen mir die nicht bedacht zu haben, die mit absonderlichen, und bildlichen Auslegungen aus ihrem Kopfe den Schriftworten etwas Ansehen zu geben versuchten. Doch so handelt nur, wer sich selber weiser dünkt als die Worte des Geistes und unter dem Vorwande der Exegese seine eigenen Meinungen hereinschmuggelt. Man nehme sie so, wie sie geschrieben stehen!</p><p>Es bringe die Erde hervor die lebende Seele von zahmen, wilden und kriechenden Tieren.” Betrachte, wie das Wort Gottes durch die Schöpfung läuft, wie es damals begonnen hat und noch jetzt wirksam ist und bis ans Ende walten wird, d. h. bis die Welt vergeht. Denn wie eine Kugel, die, einmal in Lauf gesetzt, an irgendeinem tieferen Punkte anlangt, dank ihrer eigenen Beschaffenheit und eines günstigen Terrains abwärts rollt und nicht eher still steht, als bis sie die Ebene erreicht hat, so durchläuft die Natur der Dinge, auf <em>einen</em> Befehl hin lebendig geworden, die Schöpfung gleichmäßig bei ihrem Entstehen und Vergehen und erhält die aufeinanderfolgenden Geschlechter in ihrer Gleichheit, bis sie selbst ihr Ende erreicht. Sie läßt ja aus dem Pferde wieder ein Pferd entstehen, aus dem Löwen einen Löwen, aus dem Adler einen Adler und sorgt für die Erhaltung des Tieres durch fortlaufende Abstammung bis zur Vollendung des Weltalls. Keine Zeit verdirbt oder vernichtet die Eigentümlichkeiten der Tiere, sondern die Natur läuft ewig jung, gleichsam erst entstanden, mit der Zeit weiter.</p><p>„Die Erde bringe hervor eine lebendige Seele.” Dieser Befehl haftet an der Erde, und sie hört nicht auf, dem Schöpfer zu dienen. Die einen Tiere danken ihr Dasein ihrer Abstammung von der älteren Generation, die andern erhalten, wie ersichtlich, auch jetzt noch ihr Leben von der Erde selbst. Denn nicht nur Zikaden bringt sie zur Regenzeit hervor und tausend andere Arten in der Luft schwärmender Tiere, von denen die meisten wegen ihrer Kleinheit namenlos sind, sondern sie bringt sogar Mäuse und Frösche aus ihrem Schöße hervor. Bei Theben in Ägypten wird, wenn es nach der Hitze heftig regnet, das Land mit Feldmäusen geradezu überschwemmt. Auch die Aale sehen wir nicht anders denn aus dem Schlamme entstehen. Kein Ei noch sonst etwas besorgt ihre Fortpflanzung, vielmehr danken sie ihre Entstehung direkt der Erde. - „Die Erde bringe hervor eine lebendige Seele.” Die Tiere sind erdgeboren und zur Erde geneigt. Aber das himmlische Gewächs, der Mensch, zeichnet sich ebensosehr aus durch den Körperbau wie durch den Adel seiner Seele. Welche Gestalt haben die Vierfüßer? Ihr Kopf ist der Erde zugekehrt, sieht auf den Bauch und sucht auf jede Weise dessen Lust zu befriedigen. Dein Haupt ist dem Himmel zugewandt; deine Augen schauen nach oben. Sobald du dich aber einmal durch die Lüste des Fleisches entehrst und dem Bauche dienst sowie dem, was unter ihm ist, so „bist du gleichgeworden dem unvernünftigen Vieh und ihm ähnlich”. Eine andere Sorge steht dir an, zu „suchen, was droben ist, wo Christus ist”, und mit deinen Gedanken über dem Irdischen zu stehen. Wie du gestaltet bist, so richte auch dein Leben ein! Dein Wandel sei im Himmel! Deine wahre Heimat ist das himmlische Jerusalem. Deine Mitbürger und Heimatgenossen sind die Erstgebornen, „die in den Himmeln eingeschrieben sind”.</p><p>„Die Erde bringe hervor eine lebendige Seele.” Es lag also die Seele der Tiere nicht etwa in der Erde verborgen und kam nun hervor, sondern zugleich mit dem Befehle trat sie ins Dasein. <em>Eine</em> aber ist die Seele der Tiere; das einzig Charakteristische an ihr ist die Unvernunft. Durch besondere Eigenschaften ist aber jedes Tier gekennzeichnet: Stark ist der Ochs, faul der Esel, brünstig das Pferd von Verlangen nach der Stute, unzähmbar der Wolf, listig der Fuchs, furchtsam der Hirsch, arbeitsam die Ameise, dankbar der Hund und in meiner Freundschaft treu. In <em>einem</em> Akte wurde jedes erschaffen und empfing seine natürliche Besonderheit. Mitgeboren ward mit dem Löwen sein Mut, seine einsame Lebensweise und seine Ungeselligkeit. Gleichsam der Beherrscher der Tierwelt, duldet er aus natürlichem Stolze die Gleichstellung mit einer Vielheit nicht. Er rührt auch die Speise vom Vortage nicht mehr an, kehrt nicht mehr zu den Überresten seiner Beute zurück. Ihm hat die Natur auch solch gewaltiges Stimmorgan gegeben, daß viele Tiere, die ihn an Schnelligkeit übertreffen, oft schon durch sein Gebrüll gefangen werden. Reißend ist der Panther und angriffslustig; sein Körper, beweglich und behende zugleich, folgt leicht den Regungen der Seele. Träge ist die Natur des Bären, eigenartig sein Wesen, verschlagen und sehr verschlossen. Dementsprechend ist auch sein Körper, schwerfällig, gedrungen, ungelenk, geschaffen für die kalte Höhle, in der er haust.</p><p>Gehen wir nun in unserer Rede durch, welch große, nicht erlernte, sondern angeborne Sorge für ihr Leben diesen unvernünftigen Tieren eigen ist, dann werden wir entweder zur Bewachung unserer selbst und zur Sorge für unser Seelenheil bewogen werden, oder wir werden ein noch strengeres Gericht zu gewärtigen haben, wenn wir es nicht einmal zur Nachahmung der unvernünftigen Geschöpfe gebracht haben. Der Bär, der tiefe Wunden empfangen hat, heilt sich in der Regel selbst, indem er die Verletzungen mit aller Kunst mit jenem (heilkräftigen) austrocknenden Wollkraut verstopft. Man kann auch beobachten, wie der Fuchs mit Fichtentränen sich heilt. Die Schildkröte, die sich von Otternfleisch vollgefressen hat, entgeht der schädlichen Wirkung des Giftes durch die Gegenwirkung des Dosten. Auch die Schlange heilt das Augenleiden durch Genuß von Fenchel.</p><p>Wieviel vernünftige Einsicht verrät nicht die Prognose der Luftveränderungen! So zeigt das Schaf beim Nahen des Winters eine besondere Freßlust, als wollte es sich für das künftige Bedürfnis mit Speise vorsehen. Die Rinder, die zur Winterszeit lange eingeschlossen sind, merken beim Herannahen des Frühlings mit ihrem natürlichen Instinkt den Wechsel, schauen aus den Ställen nach den Ausgängen, und wie auf <em>ein</em> Zeichen hin ändern alle ihre Haltung. Auch haben schon einige fleißige Beobachter gemerkt, wie der Erdigel an seiner Höhle zwei Luftlöcher anbringt und bei einsetzendem Nordwind das nördliche verstopft, sich aber zum nördlichen zurückzieht, wenn der Südwind wieder einsetzt.</p><p>Was wird dadurch uns Menschen angedeutet? Nicht bloß das durchgängige Walten der Fürsorge unseres Schöpfers, sondern auch die Begabung der Tiere mit einem Blicke für die Zukunft, auf daß auch wir nicht an diesem gegenwärtigen Leben hängen, sondern unsere ganze Sorge auf das künftige Leben verwenden möchten. Willst du nicht gern deinetwegen dich abmühen, o Mensch, willst du nicht in diesem Leben dir die Güter der künftigen Ruhe sichern, wenn du auf das Beispiel der Ameise siehst? Diese sammelt sich im Sommer ihre Speise für den Winter und läßt die Zeit bis zum Eintritt des traurigen Winters nicht im Leichtsinn verstreichen, sondern strengt sich bei der Arbeit mit unermüdlichem Fleiße an, bis sie in ihren Zellen genügend Nahrung aufgespeichert hat. Auch geht sie dabei nicht nachlässig zu Werke, sondern sinnt in klugem Nachdenken darauf, die Nahrung möglichst lange zu konservieren. Sie zernagt nämlich mit ihrem Gebisse die Früchte in ihrem innersten Kern, damit sie nicht keimen und für sie ungenießbar werden. Auch trocknet sie die Früchte, wenn sie merkt, daß sie feucht geworden sind, legt sie aber nicht jederzeit heraus, sondern nur, wenn sie anhaltend gute Witterung voraussieht. Sicher sieht man keinen Regen aus den Wolken fallen, solange die Ameise ihr Getreide auslegt.</p><p>Welche Rede reichte hin, welches Ohr möchte fassen, welche Zeit genügte, alle die Wunder des Schöpfers zu nennen und zu schildern? So wollen auch wir mit dem Propheten sagen: „Wie groß sind deine Werke, o Herr! Alles hast du mit Weisheit gemacht!” Es genügt daher zu unserer Entschuldigung nicht (zu sagen), daß wir durch Schriften über das Nützliche nicht belehrt werden, da uns doch ohne Belehrung, durch das Gesetz der Natur die Wahl des Nützlichen ermöglicht ist. Weißt du, was Gutes du dem Nächsten tun sollst? Was du willst, daß es dir von einem andern getan werde. Weißt du, was böse ist? Was du selbst von einem andern nicht leiden möchtest. Keine Arzneikunst, keine Pflanzenkunde hat den Tieren Aufschluß über das ihnen Zuträgliche gegeben, sondern von Natur besorgt sich jedes Tier, was zu seiner Wohlfahrt dient, und es hat eine ganz unglaubliche Vertrautheit mit der Natur.</p><p>Auch wir haben von Natur die Tugenden, zu denen die Seele nicht auf Grund menschlicher Belehrung, sondern von Natur sich hingezogen fühlt. Wie kein Unterricht uns die Krankheit hassen lehrt, vielmehr wir schon einen natürlichen Widerwillen vor allem Schmerzlichen haben, so hat auch die Seele eine nicht bloß anerlernte Abneigung gegen das Böse. Jedes Böse ist eine Krankheit der Seele, Tugend aber bedeutet Gesundheit. Treffend haben ja einige Gesundheit als das Wohlbefinden der natürlichen Kräfte definiert. Wer daher auch das Wohlbefinden der Seele so nennt, wird nicht fehlgehen. Daher verlangt die Seele nach dem, was ihr angemessen ist, von Natur aus, nicht auf Grund von Belehrung. Deshalb scheint allen lobenswert die Keuschheit, empfehlenswert die Gerechtigkeit, bewundernswert der Mut, begehrenswert die Klugheit. Diese Tugenden gehören noch wesentlicher zur Seele als zum Leibe die Gesundheit. Ihr Kinder, liebet die Eltern! „Ihr Eltern, reizt eure Kinder nicht zum Zorne!” Sagt dies nicht auch die Natur? Nichts Neues verlangt Paulus, er zieht nur die Bande der Natur straffer an. Wenn die Löwin ihre Jungen liebt und der Wolf für seine Jungen kämpft, was will dann der Mensch sagen, der das Gebot überhört und die Natur verzerrt, wenn z. B. ein Sohn seinen greisen Vater nicht ehrt, oder der Vater infolge einer zweiten Ehe die Kinder aus erster Ehe vergißt? Unbegreiflich groß ist bei den Tieren die gegenseitige Liebe der Eltern und Jungen, weil Gott, ihr Schöpfer, den Mangel an Vernunft durch ein Übermaß sinnlicher Gefühle ersetzt hat. Woher kommt es denn, daß das Lamm, das aus dem Stalle hüpft, unter tausend Schafen sogar Farbe und Stimme seiner Mutter erkennt, zu ihr eilt und seine Milchquellen sucht? Und selbst wenn es das Euter seiner Mutter fast leer findet, so gibt es sich mit ihm zufrieden und springt an vielen strotzenden und vollen Eutern vorbei. Und woher kennt die Mutter unter tausend Lämmern ihr eigenes? Die Stimme ist <em>eine</em>, die Farbe dieselbe, der Geruch bei allen gleich, soweit unser Geruchsinn zu urteilen vermag; aber gleichwohl haben sie einen Sinn, der schärfer ist, als wir zu beurteilen vermögen, (einen Sinn,) mit dem jedes das seinige zu unterscheiden vermag. Solange der junge Hund noch keine Zähne hat, verteidigt er sich mit dem Maule gegen seinen Angreifer. Noch hat das Kalb keine Hörner und weiß doch, wo ihm seine Waffen wachsen werden. Das beweist, daß keine (Tier-)Natur einer Belehrung bedarf, daß in der Kreatur nichts ungeordnet und zwecklos ist, sondern alle Geschöpfe die Spuren der Weisheit des Schöpfers an sich tragen und an sich zeigen, daß sie mit den Mitteln zum Schütze ihrer eigenen Wohlfahrt versehen geschaffen worden sind. - Hat der Hund auch keinen Verstand, so hat er doch den Sinn, der ihm den gleichen Dienst tut wie der Verstand. Was die Weltweisen nach langen Jahren des Studiums kaum gefunden haben, nämlich die Kettenschlüsse, das weiß, wie man sieht, der Hund, nur von der Natur belehrt. Wenn er nämlich ein Wild aufspürt und dabei auf verschiedene Fährten stößt, dann den überallhin führenden Spuren nachgeht, so spricht er doch mit solchem Verhalten nur den Syllogismus aus: „Das Wild hat sich dahin oder dorthin oder nach einer dritten Seite hin gewendet; aber es ist weder dahin noch dorthin gelaufen; folglich muß es nach dieser Seite hin gelaufen sein.” So findet er nach Ablehnung des Unrichtigen das Richtige. Was leisten die mehr, die gravitätisch vor mathematischen Aufgaben sitzen, Linien in den Sand zeichnen, von drei Annahmen zwei verwerfen und in der restierenden die Wahrheit finden? - Wo ist sodann der gegen Wohltäter Undankbare, den nicht dieses Tieres stete Dankbarkeit für empfangene Wohltaten beschämt? Man erzählt ja von vielen Hunden, daß sie bei ihren ermordeten Herren an einsamem Orte starben. Ja, bei frischer Missetat wurden Hunde schon Wegweiser beim Fahnden nach den Mördern und bewirkten so, daß die Missetäter zur Strafe gezogen wurden. Was wollen die dazu sagen, die den Herrn, ihren Schöpfer und Ernährer, nicht bloß nicht lieben, sondern die zu Freunden haben, die gegen Gott lästern, mit solchen sogar am gleichen Tische sitzen und selbst während der Mahlzeit die Lästerungen gegen den Ernährer dulden?</p><p>Doch kehren wir zur Betrachtung der Schöpfung zurück! Die Tiere, die man leichter einfängt, sind fruchtbarer. Deshalb haben die Hasen und wilden Ziegen viele Junge und werfen die wilden Schafe Zwillinge, damit nicht das Geschlecht von den Fleischfressern ganz aufgefressen wird und ausstirbt. Die Tiere aber, die andere verzehren, sind weniger fruchtbar. Daher wird die Löwin kaum <em>eines</em> Löwen Mutter; mit seinen scharfen Klauen soll er bei der Geburt die Gebärmutter aufreißen. Auch die Nattern kommen so zur Welt, daß sie den Mutterleib zernagen und so der Mutter mit gebührendem Lohne vergelten. So gibt es in der Kreatur nichts Unvorhergesehenes, nichts ohne den nötigen Schutz. - Auch wenn du auf die Glieder der Tiere siehst, wirst du finden, daß der Schöpfer kein überflüssiges gegeben, kein notwendiges fortgelassen hat. Den Fleischfressern gab er scharfe Zähne; solche brauchten sie im Hinblick auf die Art ihrer Ernährung. Die nur hälftig mit Zähnen bewaffnet sind, versah er mit vielen, mannigfachen Speisebehältern. Weil von diesen die Speise beim ersten Genuß nicht genügend zermalmt wird, ermöglichte er ihnen, das Geschluckte wieder heraufzuholen und durch Wiederkauen so zu zermalmen, daß es sich zur Ernährung eignet. Die Schlünde, die zweiten und dritten Mägen und großen Eingeweide sind den betreffenden Tieren nicht umsonst gegeben worden, vielmehr erfüllt jeder Teil seinen notwendigen Dienst. Der Hals des Kamels ist lang, den Füßen angemessen, um das Gras zu erreichen, von dem es lebt. Kurz und fast unter den Schultern versteckt ist der Hals des Bären, Löwen, Tigers und der übrigen derartigen Tiere, weil nicht das Gras ihre Nahrung ist und sie sich nicht zur Erde bücken müssen, sondern weil sie Fleischfresser sind und sich vom Raub der Tiere erhalten. Was soll der Rüssel beim Elefanten? Das große, unter den Landtieren größte Tier, das zum Schrecken derer, die ihm begegnen, geschaffen wurde, mußte einen feisten, fleischigen Körper haben. Wäre ihm nun ein langer, den Füßen entsprechender Hals gegeben worden, dann könnte er kaum gelenkt werden und würde wegen der übermäßigen Schwere immer nach unten sinken. Nun ist aber der Kopf nur durch wenige Nackenwirbel mit dem Rückgrate verbunden, und der Rüssel versieht den Dienst des Halses, nimmt die Speise auf und schlürft den Trank ein. Aber auch seine Füße sind ungelenk und wie Säulen geformt, um die Last zu tragen. Wenn ihm nämlich schlanke und gelenkige Füße gegeben wären, so würden immer Gliederverrenkungen eintreten; sie könnten die Last nicht tragen, so oft er niederknien oder wieder aufstehen wollte. Nun aber hat der untere Fuß des Elefanten nur einen kleinen Knöchel, ist sonst ohne Gelenk und ohne Knie; gelenkige Glieder könnten die dicke, wackelige Fleischmasse dieses Tieres nicht tragen. Deshalb bedurfte es auch der bis auf die Füße hinabreichenden Nase. Siehst du nicht, wie sie im Kriege gleich lebendigen Türmen dem Heere vorangehen oder gleich Fleischhügeln in unwiderstehlichem Angriffe die Schlachtreihen der Feinde durchbrechen? Würden die unteren Teile den Fleischmassen nicht entsprechen, so könnte das Tier überhaupt nicht leben. Nun aber erzählen manche, daß der Elefant dreihundert Jahre und darüber alt werde. Deshalb sind seine Füße kompakt und nicht gelenkig. Sein Rüssel aber hebt, wie gesagt, die Speise von der Erde auf, weil er schlangenförmig ist und von Natur noch geschmeidiger. So bleibt wahr das Wort, daß es nichts Überflüssiges und nichts Lückenhaftes in der Schöpfung gibt.</p><p>Dieses Riesentier aber hat Gott uns untertänig gemacht, daß es sich abrichten und schlagen läßt, und belehrt uns damit deutlich, daß er uns alles unterworfen hat, weil wir nach dem Bilde des Schöpfers erschaffen worden sind. Doch nicht bloß in den großen Tieren läßt sich seine unergründliche Weisheit betrachten; auch in den kleinsten können wir kaum weniger Wunderbares beobachten. Wie ich die hohen Bergesgipfel, die, den Wolken nahe und stets vom Frosthauch umweht, ewig Winter haben, nicht mehr anstaune als die Talgründe, die nicht unter der frostigen Höhenluft leiden, die vielmehr immer laue Luft durchstreicht, ebenso bewundere ich unter den Tiergestalten den Elefanten ob seiner Größe nicht mehr als die dem Elefanten furchtbare Maus oder als den feinsten Stachel des Skorpions, den der Werkmeister wie eine Röhre ausgehöhlt hat, damit durch ihn das Gift in die Wunden dringe. Niemand klage den Schöpfer an, daß er giftige, gefährliche und unserem Leben feindliche Tiere erschaffen hat. Sonst könnte man ebenso auch einen Lehrer tadeln, der um der Zucht und Ordnung willen den Leichtsinn und die Ausgelassenheit der Jugend mit Stock und Rute züchtigt.</p><p>Für den Glauben ein Beweis sind die wilden Tiere. Vertraust du auf den Herrn? „Auf Nattern und Basilisken wirst du wandeln und niedertreten Löwen und Drachen.” Und du hast im Glauben die Gewalt, über Schlangen und Skorpione zu gehen. Oder siehst du nicht, wie einem Paulus beim Reisigsammeln eine Natter sich an die Hand hängte, ohne ihm ein Leid zuzufügen, weil der Heilige des Glaubens voll befunden ward? Bist du aber ungläubig, so fürchte das Wild nicht mehr als deinen Unglauben, durch den du dich jedem Unheil preisgegeben hast!</p><p>Aber ich merke schon längst, daß man von mir die Erschaffung des Menschen vernehmen möchte, ich aber nur nicht zu hören scheine, was meine Hörer in ihren Herzen mir zurufen: „Über die Natur der Dinge um uns bekommen wir Aufschluß; uns selbst aber kennen wir nicht.” So müssen wir darüber reden und dürfen keinen weiteren Aufschub dulden.</p><p>In der Tat scheint das Schwerste zu sein, sich selbst zu erkennen. Das Auge, das die Außenwelt sieht, gebraucht seine Sehkraft nicht zum Blicke auf sich selbst; und auch unser Verstand, der scharf auf die fremde Sünde sieht, ist stumpf bei der Erkenntnis der eigenen Schwächen. Deshalb ist auch jetzt unsere Rede, die peinlich genau auf anderweitige Dinge eingegangen ist, so träge und säumig in der Untersuchung der eigenen Person. Und doch können wir Gott aus Himmel und Erde nicht besser kennen lernen als aus unserer eigenen Beschaffenheit. Das ist wenigstens der Fall bei dem, der sich selbst verständig erforscht, wie der Prophet sagt: „Wunderbar ward das Wissen von dir an mir selbst”, d. h. dadurch, daß ich mich kennen lernte, ward ich auch unterrichtet in deiner erhabenen Weisheit.</p><p>„Und Gott sprach: Laßt uns einen Menschen machen.” Wo ist der Jude, der im Bisherigen, wo das Licht der Theologie gleichsam durch die Fenster leuchtet und die zweite Person geheimnisvoll angedeutet, wenn auch noch nicht deutlich sichtbar wird, gegen die Wahrheit ankämpfen wollte mit der Behauptung, Gott rede hier mit sich selbst? Denn er sprach, heißt es, und er machte. „Es werde Licht, und es ward Licht.” Schon hier lag also die Ungereimtheit ihrer Behauptung auf der Hand. Denn welcher Schmied oder Zimmermann oder Schuster, der allein, ohne Gehilfen, bei seinen Werkzeugen sitzt, sagt zu sich selbst: „Laßt uns das Schwert machen oder den Pflug zusammensetzen oder den Schuh anfertigen”, anstatt stillschweigend die anfallende Arbeit zu vollbringen? Es wäre doch wirklich ein sonderlich Reden, wenn jemand dasäße als Herr und Gebieter und an sich selbst nicht gebietende und herrische Worte richtete. Und doch, was können Leute nicht alles sagen, die ungescheut den Herrn selbst lästern und eine im Lügen geübte Zunge haben! Aber vorstehender Ausdruck wird ihnen den Mund stopfen. „Und Gott sprach: Laßt uns einen Menschen machen.” Sage mir ja nicht auch hier, es handle sich um eine einzige Person! Es heißt ja nicht: „Es werde der Mensch”, sondern: „Laßt uns einen Menschen machen.” Solange der, welcher belehrt werden sollte, noch nicht da war, lag die Lehre über Gott noch im Verborgenen verhüllt; wie aber nun die Erschaffung des Menschen zu erwarten steht, da enthüllt sich der Glaube, und deutlicher offenbart sich die Lehre der Wahrheit. „Laßt uns einen Menschen machen.” Du hörst es, Christusgegner, wie Gott zum Teilnehmer an seinem Schöpfungswerke spricht, „durch den er auch die Zeiten geschaffen, der alles trägt mit dem Worte seiner Macht”. Doch der Jude nimmt das Wort gottesfürchtigen Glaubens nicht willig hin. Gleich blutdürstigsten Tieren, die in ihren Käfigen eingesperrt sind, an den Gittern auf und ab wüten und ihre wilde, grimmige Natur zeigen, ohne ihre Wut befriedigen zu können, wollen auch die wahrheitsfeindlichen Juden, in die Enge getrieben, behaupten, es seien viele Personen, an die das Wort Gottes ergangen. Zu den ihn umstehenden Engeln soll er gesagt haben: „Laßt uns einen Menschen machen.” Das ist jüdische Fiktion, eine Erdichtung ihrer Frivolität. Um den <em>einen</em> nicht annehmen zu müssen, nehmen sie Tausende an. Den Sohn verwerfen sie und übertragen so auf Diener die Würde von Ratgebern und machen unsere Mitknechte zu Herren unserer Erschaffung. Der vollkommene Mensch erschwingt sich zur Würde der Engel. Welches Geschöpf kann aber dem Schöpfer gleich sein? Sieh aber auch noch auf folgende Worte: „Nach unserm Ebenbilde.” Was sagst du dazu? Es ist dann wohl das Ebenbild Gottes und der Engel <em>ein und dasselbe</em>? Vater und Sohn müssen ja ganz notwendig dieselbe Gestalt haben, die Gestalt natürlich Gott entsprechend gedacht, nicht als eine menschliche Figur, sondern in der Eigentümlichkeit der Gottheit. Höre auch du aus der neuen Beschneidung, der du unter der Maske des Christentums dem Judentum anhängst! Zu wem spricht er: „Nach unserm Bilde”? Zu wem anders als zum „Abglanze seiner Herrlichkeit” und zum „Ebenbilde seines Wesens”, der da ist das „Bild des unsichtbaren Gottes”? Zu seinem eigenen lebendigen Ebenbilde spricht er doch, das da gesagt hat: „Ich und der Vater sind <em>eins</em>”, und „wer mich sieht, sieht den Vater”. Zu eben diesem spricht er: „Laßt uns einen Menschen machen nach unserm Ebenbilde.” Wo aber ein und dasselbe Bild, wo ist da die Ungleichheit? „Und Gott machte den Menschen” - nicht: sie machten. Hier vermied Moses die Mehrzahl der Personen. Mit ersteren Worten belehrt er die Juden, mit letzteren weist er das Heidentum zurück und kehrt dann unbeirrt zur Einheit zurück, damit du den Sohn mit dem Vater erkennen und der Gefahr der Vielgötterei entrinnen mögest. „Im Bilde Gottes schuf er ihn.” Wieder führt er hier die Person des Mitschöpfers ein. Denn er sagte nicht „in seinem Bilde”, sondern „im Bilde Gottes”.</p><p>Inwiefern nun der Mensch die Gottesebenbildlichkeit hat, und wie er an seiner Ähnlichkeit teil hat, das wird, so Gott will, später erörtert werden. Für jetzt wollen wir nur so viel sagen: Wenn es nur ein Ebenbild gibt, wie konnte dir die unerträgliche Gottlosigkeit in den Sinn kommen, den Sohn dem Vater ungleich zu nennen? O der Undank! Jene Ähnlichkeit, deren du teilhaft geworden, erkennst du deinem Wohltäter nicht zu! Und du glaubst von Rechts wegen zu besitzen, was dir aus <em>Gnade</em> verliehen worden, gibst aber nicht zu, daß der Sohn die Ähnlichkeit mit dem Vater von <em>Natur</em> hat?</p><p>Doch Schweigen gebietet uns nunmehr der Abend, der schon längst die Sonne zum Untergehen entlassen hat. So wollen wir denn hier unsere Rede beschließen - zufrieden mit dem Gesagten. Wir haben jetzt in unserem Vortrage so viel berührt, als hinreicht, euren Eifer zu wecken; die weitere Ausführung des vorliegenden Themas werden wir mit Hilfe des Geistes im folgenden bieten. So geht nun freudig hin, christgeliebte Gemeinde, und statt allerlei kostbarer Speisen und Gewürze gib deinem ehrbaren Tische die Erinnerung an das Gesagte zum Schmucke! Schämen aber soll sich der Anhomöer, zu Schanden werde der Jude; es freue sich der Gottesfürchtige ob der Lehren der Wahrheit, und gepriesen sei der Herr, dem die Ehre und die Macht in alle Ewigkeit! Amen.</p>
