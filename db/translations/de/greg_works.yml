    body: |-
      <p><em>Lobrede auf Origenes, übersetzt von Dr. P. Hermann Bourier (Bibliothek der Kirchenväter, 1. Reihe, Bd. 2, Kempten und München 1911).</em></p><h2>1</h2><p>Es ist etwas Kostbares um das Schweigen und zwar nicht nur vielfach für so viele andere Menschen, sondern auch ganz besonders für mich im gegenwärtigen Augenblick, wo mir, ich mag wollen oder nicht, der Mund verschlossen und Schweigen aufgenötigt wird. Bin ich ja <em>ungeübt und unerfahren</em> in jenen schönen und glanzvollen Reden, die mit ihren gewählten und gediegenen Worten und Ausdrücken wohlgeordnet wie in unaufhaltsamem Flusse gesprochen oder verfaßt werden. Vielleicht bin ich sogar von Natur aus allzu wenig geeignet mich diesem anmutigen und im vollen Sinne des Wortes hellenischen Werke zu unterziehen. Und wahrlich, es kann nicht anders sein. Es sind ja jetzt schon <em>acht Jahre,</em> seitdem ich weder selbst etwas vorgetragen oder überhaupt eine große oder kleine Rede verfaßt noch einen anderen gehört habe, der für sich etwas geschrieben oder vorgetragen oder auch öffentlich eine Lob- oder Verteidigungsrede gehalten hätte, jene bewunderungswürdigen Männer abgerechnet, die sich dem schönen Studium der Weisheit in die Arme geworfen haben. Aber auch diesen ist es weniger um schöne Sprache und zierliche Ausdrücke zu tun. Indem sie den sprachlichen Wohlklang erst in zweiter Linie berücksichtigen, wollen sie das Wesen der Dinge selbst mit Scharfsinn erforschen und zum Ausdruck bringen, nicht als ob ich glaubte, daß ihr Streben nicht dahin ginge — im Gegenteil, sie trachten sogar sehr darnach ihre schönen und scharfsinnigen Gedanken in schöner und wohlgefälliger Rede auszudrücken — aber sie sind vielleicht nicht imstande so ohne weiters den tiefen, heiligen und gottähnlichen Gehalt, der in ihren Gedanken liegt, und andrerseits eine in gefälligen Ausdrücken sich bewegende Rede mit ein und demselben und noch dazu beschränkten menschlichen Geist zu umfassen. Es sind dies zwei Vorzüge, die bei den einzelnen Menschen gesondert vertreten und in gewissem Sinn einander geradezu entgegengesetzt sind. Wenn nun auch der denkenden und forschenden Tätigkeit das Schweigen sozusagen befreundet und förderlich ist, so wird man doch die Fertigkeit und den Wohlklang in der Rede nicht wohl anderswo mit Erfolg suchen können als im Vortrag und in ununterbrochener Übung darin.</p><p>Indes ist es noch ein anderer Wissenszweig, der meinen Verstand gewaltig in Anspruch nimmt, und der Mund legt die Zunge in Fesseln, wenn ich auch nur etwas weniges in griechischer Sprache vorbringen möchte. Es sind das unsere <em>bewunderungswürdigen Gesetze,</em> nach welchen jetzt die Angelegenheiten aller Untertanen des römischen Reiches geregelt werden und die ohne mühevolle Arbeit weder zustande kamen noch von Grund aus erlernt werden können, da sie an sich schon weise und scharfsinnig, mannigfaltig und bewunderungswürdig, mit einem Worte im höchsten Grade dem hellenischen Geiste entsprechend, außerdem aber in der lateinischen Sprache abgefaßt und übermittelt sind, die da Achtung gebietend und prunkvoll und der kaiserlichen Gewalt angemessen ist, für mich aber immerhin ihre Schwierigkeiten hat. Ich hatte auch in der Tat nicht die Möglichkeit und, ich darf wohl sagen, auch nie den Wunsch sie mir auf andere Weise gründlich anzueignen.</p><p>Da nun aber unsere Ausdrücke nichts anderes sind als eine Art Bilder für die Empfindungen unserer Seele, so müssen wir wohl zugeben, daß die befähigten Redner ebenso wie etwa gute Maler, die in ihrer Kunst eine hohe Fertigkeit besitzen und über einen großen Farbenreichtum gebieten, wenn sie nach keiner Seite hin etwas daran hindert, berechtigt sind nicht bloß einerlei Bilder zu malen sondern auch mannigfaltige und solche, die durch reichliche Beimischung von Blumen einen besonderen Grad von Schönheit erreichen.</p>
      <h2>2</h2><p>Ich aber will wie ein Unbemittelter, dem solche bunte Farben nicht zur Verfügung stehen — sei es nun, daß ich sie überhaupt nie besessen oder auch daß ich sie vielleicht verloren habe — gleichsam wie nur mit Kohlen oder irdenen Täfelchen mit den mir vertrauten und mit alltäglichen Worten und Redensarten nach Maßgabe meiner Kräfte die Urbilder meiner Seelenstimmungen mit den mir geläufigen Ausdrücken abzeichnen und nachbilden, indem ich es versuche die Züge meiner geistigen Bilder, wenn auch nicht klar und mit vielem Schmucke, so doch wenigstens im Kohlenabrisse darzustellen. Kommt mir dabei irgendwo ein anmutiger und wohlklingender Ausdruck in den Weg, so heiße ich ihn herzlich willkommen, ist dies nicht der Fall, so will ich mich nach einem solchen umsehen.</p><p>Aber es ist auch noch ein <em>dritter</em> Umstand, der mich außerdem zurückhält und abwendig macht und mir noch weit mehr als die erwähnten Einhalt gebietet, ja mir vorschreibt einfach still zu sein, und das ist <em>der mir vorliegende Gegenstand.</em> Seinetwegen fühlte ich mich zwar von Begierde hingerissen zu reden, aber jetzt muß ich zögern und mich sträuben. Ich beabsichtige nämlich über einen Mann zu sprechen, der zwar, äußerlich betrachtet, ein Mensch zu sein scheint, aber in den Augen derer, die in die Tiefe seines Charakters einen Blick hinabzuwerfen vermögen, bereits mit höheren Vorzügen ausgestattet ist, die ihn der Gottheit näher bringen. Ich habe auch nicht im Sinne seine leibliche Abstammung und Erziehung zu rühmen; denn auch da fühle ich mich eingeschüchtert und zurückgehalten durch überwältigende Hochachtung; auch nicht seine körperliche Kraft und Schönheit, denn das sind offenbar Gegenstände des Rühmens für Knaben, wobei es weniger darauf ankommt, ob sie nach Gebühr hervorgehoben werden oder nicht. Denn über Dinge, die nicht Dauer und Bestand haben, sondern auf mannigfache Art und schnell vergehen, eine prunkvolle und schon im Eingang hochfeierliche Rede zu halten, das möchte, so fürchte ich, abgeschmackt und zwecklos sein. Ich möchte darüber nicht einmal reden, wenn mir etwas dergleichen als Thema einer Rede gestellt wäre, da es unnütze und hinfällige Dinge sind, Dinge, die ich nie freiwillig als Gegenstand einer Rede mir ausersehen hätte. Freilich bräuchte ich, falls mir wirklich dieses Thema gestellt wäre, bei meiner Rede keineswegs in ängstlicher Verlegenheit oder Sorge zu sein, ich möchte durch irgend eine Äußerung der Würde des Gegenstandes nicht gewachsen erscheinen. Nun aber will ich dessen Erwähnung tun, was <em>an ihm das Gottähnlichste</em> ist, und was in ihm die Wesensverwandtschaft mit Gott ausmacht, einerseits eingeschlossen in diese sichtbare sterbliche Persönlichkeit, andererseits aber unablässig ringend nach der Ähnlichkeit mit Gott. Ich gehe ferner daran mich in gewissem Sinn mit erhabeneren Dingen zu befassen, so auch um seinetwillen der Gottheit meinen Dank dafür abzustatten, daß mir das Glück zuteil geworden ist mit einem so großen Manne in Berührung zu kommen, gegen alle fremde und eigene menschliche Erwartung und ohne daß ich es je beabsichtigt oder auch nur gehofft hätte. Mit so wichtigen Dingen will ich mich befassen trotz meiner gänzlichen Bedeutungslosigkeit und geistigen Beschränktheit: werde ich da nicht mit gutem Grund schüchtern und zaghaft und zum Schweigen geneigt?</p><p>Ja wahrlich, es erscheint mir ratsam mich still zu verhalten, damit ich nicht etwa unter dem Vorwande der Dankbarkeit, zugleich aber aus vorschnellem Eifer vielleicht über erhabene und heilige Dinge unedel, einfältig und alltäglich daherrede und so nicht bloß hinter der Wahrheit zurückbleibe, sondern ihr, soweit es bei mir steht, bei denen, die meiner Darlegung Glauben schenken, auch noch Eintrag tue, da sich meine Rede als kraftlos darstellen wird, mehr wie eine Verhöhnung denn durch ihren Gehalt als getreue Schilderung seiner Verdienste. Und doch sind deine Vorzüge, o teures Haupt, über alle Verkleinerung und Verhöhnung erhaben, und noch viel mehr die Gottheit, die in sich unerschütterlich bleibt, wie sie ist, und durch meine unbedeutenden und unwürdigen Worte nicht beeinträchtigt werden kann. Ich aber weiß nicht, wie ich den Eindruck der Verwegenheit und des vorschnellen Eifers vermeiden soll, wenn ich aus Unbesonnenheit mit einem geringen Maße von Verstand und Vorbildung hinüberspringen will auf große und meine Kräfte jedenfalls überragende Dinge. Ja, wenn ich anderswo und vor anderen Zuhörern den Entschluß gefaßt hätte einen solchen jugendlichen Streich auszuführen, wäre ich noch immer bis zu einem gewissen Grade keck und tollkühn; aber es würde doch nicht die Frechheit Schuld sein an meinem vorschnellen Auftreten, weil ich eine solche Verwegenheit nicht dir gegenüber an den Tag legen würde. Jetzt aber will ich das Maß der Unbesonnenheit voll machen oder habe es vielmehr schon voll gemacht, indem ich es gewagt habe sozusagen mit ungewaschenen Füßen das Heiligtum jener Ohren zu betreten, in welchen das Wort Gottes selbst nicht wie für die große Mehrheit der Menschen gleichsam unter dem dicken Leder rätselhafter und unklarer Ausdrücke mit verhüllten, sondern, man könnte sagen, mit entblößten Füßen klar und ganz erkennbar seinen Einzug hält und seinen Aufenthalt nimmt. Ich aber trage meine menschlichen Worte wie eine Art Schmutz und Schlamm an mir und habe es gewagt sie in Ohren einzugießen, die geübt sind reine und göttliche Klänge zu vernehmen. Doch ich habe bis jetzt schon genug gesündigt und jetzt wenigstens soll ich anfangen mich zu mäßigen, indem ich in der Rede nicht weiter fortfahre, sondern sie beschließe, nicht wahr? Ich täte es gern. Indes da ich doch einmal so keck aufgetreten bin, sei es mir gestattet vorerst die Ursache anzugeben, die mich ermutigt hat hier öffentlich aufzutreten; vielleicht dürfte dann diese meine Zudringlichkeit nachsichtige Beurteilung finden.</p>
      <h2>3</h2><p>Nach meiner Anschauung ist es <em>etwas Entsetzliches um die Undankbarkeit,</em> etwas Entsetzliches, und das im vollsten Sinne des Wortes; denn Wohltaten zu empfangen ohne sich zu bestreben sie, wenn es auch auf andere Weise nicht möglich sein sollte, wenigstens durch Dankesbezeigungen in Worten zu erwidern, das verrät einen Menschen, der entweder ganz ohne Verstand und ohne Sinn für Wohltaten oder ohne Gedächtnis ist. Wer von Anfang an Sinn und Verständnis hat für das Gute, das er erfährt, der ist, wenn er die Erinnerung daran nicht auch für die Folgezeit bewahrt und nicht irgendwie dem Sprecher des Guten auch seinen Dank erzeigt, stumpfsinnig, undankbar und gewissenlos und versündigt sich in unverzeihlicher Weise, mag er nun hoch oder nieder gestellt sein — im ersten Fall, wenn er hochgestellt und gebildet ist, weil er nicht mit aller Dankbarkeit und Ehrerbietigkeit die großen Wohltaten, die er erfährt, im Munde führt, in letzterem Fall, wenn er niedrig gestellt und unbedeutend ist, weil er nicht aus allen Kräften Lob und Anerkennung ausspricht gegen den, der nicht bloß den Hohen, sondern auch den Niedrigen seine Wohltaten spendet. Höher Gestellte und geistig Begabtere haben natürlich in Anbetracht ihres größeren Vermögens und ihres großen Reichtums die unabweisbare Pflicht ihren Wohltätern nach Kräften größere und ehrenvollere Anerkennung zu zollen; aber auch den niedrig Gestellten und in beschränkten Verhältnissen Lebenden steht es nicht gut an, teilnahmslos oder nachlässig zu sein oder den Mut sinken zu lassen, weil sie nach ihrer Ansicht nichts Würdiges oder Vollkommenes zu leisten vermögen, sondern wie arme Leute von dankbarer Gesinnung sollen sie nicht die Leistungsfähigkeit dessen, den sie ehren wollen, sondern ihre eigene als Maßstab zugrunde legen und mit den ihnen zu Gebot stehenden Kräften ihre Ehrenbezeigungen erweisen, die dem Geehrten vielleicht wohlgefällig und angenehm und in seinen Augen nicht minder wertvoll sein werden wie eine Menge von größeren Auszeichnungen, vorausgesetzt, daß sie dieselben mit etwas größerer Bereitwilligkeit und ganz ergebener Gesinnung darbringen. So wird in der heiligen Schrift erzählt, daß einmal eine unbedeutende arme Frau gleichzeitig mit reichen und vermöglichen Leuten, die von ihrem Reichtum große und kostbare Geschenke opferten, für sich allein nur eine unbedeutende und ganz geringe Gabe beisteuerte, obwohl sie ihre ganze Barschaft war, und darum das Zeugnis erhielt, daß sie am meisten gegeben habe. Denn nicht nach der Größe der Gabe, die ja etwas Äußerliches war, sondern mehr nach den Gesinnungen und Absichten, die dabei zutage traten, bemaß, wie ich glaube, die hl. Schrift ihren Wert und ihre Vortrefflichkeit. Darum ziemt es sich auch für mich durchaus nicht, daß ich aus Furcht, mein Dank möchte den Wohltaten nicht entsprechen, Zurückhaltung beobachte, nein gerade im Gegenteil, es ist in der Ordnung, daß ich es wage und den Versuch mache, wenn auch nicht in ebenbürtiger Weise, so doch wenigstens nach dem Maße meines Könnens meine Ehrenbezeigungen als eine Art Gegenleistung darzubringen; wenn auch meine Rede etwa nicht den Grad der Vollkommenheit erreicht, wird sie doch wenigstens teilweise einen guten Erfolg haben, indem sie dem vollendeten Vorwurf der Undankbarkeit entgeht. Denn es wäre wirklich unedel ganz und gar zu schweigen unter dem verlockenden Vorwand, daß man nichts Würdiges sagen könne, während der Versuch einer Gegenleistung immer etwas Edles bleibt, auch wenn die Kräfte des Dankenden dem betreffenden Verdienste nicht gewachsen sind. Wenn ich also auch nicht imstande bin zu sprechen, wie es das Verdienst erfordert, so werde ich doch nicht schweigen; ja wenn ich alles geleistet habe, was in meinen Kräften steht, dann will ich mich dessen sogar noch rühmen.</p><p><em>Meine heutige Rede soll also eine Dankrede sein.</em> Daß sie sich (unmittelbar) an <em>Gott, den Herrn der Welt,</em> richtet, möchte ich zwar nicht sagen. Und doch geht von ihm alles Gute aus, das wir haben, und bei ihm müßte ich auch mit meinen Kundgebungen des Dankes, des Jubels und des Lobes den Anfang machen. Indes selbst angenommen, ich wollte mich ganz, nicht aber in meinem gegenwärtigen Zustand der Unheiligkeit und Sündhaftigkeit, vermischt und vermengt mit fluchwürdiger und unheiliger Bosheit, sondern frei davon im Zustande möglichst hoher Reinheit, herrlichen Glanzes und vollkommener Lauterkeit und ohne alle Beimischung von Unvollkommenheit, ich wiederhole, selbst angenommen, ich wollte mich ganz frei davon wie ein neugeborenes Kind als Opfer darbieten, auch dann könnte ich von meiner Seite keine Gabe darbringen, die würdig genug wäre dem Lenker und Urheber des Weltalls Ehre und Dank zu bezeigen; dieses nach Gebühr zu preisen vermöchte weder jemals ein einzelner für sich noch auch alle Menschen zusammen, auch wenn alles, was rein ist, sich vereinigen, aus sich hinaustreten oder vielmehr in <em>einem</em> Geist versammelt und in <em>einem</em> Anlaufe zusammenstimmend sich an ihn wenden wollte. Denn was auch immer von seinen Werken jemand aufs beste und erschöpfendste ergründen und, wenn es je möglich wäre, in würdiger Weise über ihn aussprechen könnte, er würde gerade um dieser Fähigkeit willen, deren er von niemand anderem gewürdigt worden wäre, sondern die er wieder von ihm empfangen hätte, nicht daran denken können darüber hinaus von irgend einer Seite etwas Größeres sich zu verschaffen und als Beweis seiner Dankbarkeit darzubringen.</p>
      <h2>4</h2><p>Wir wollen vielmehr unsere Lobpreisungen und Huldigungen für den Beherrscher und Erhalter des Weltalls, der die unerschöpfliche Quelle alles Guten ist, an den richten, der auch hierin unsere Schwache heilt und allein das Fehlende zu ergänzen vermag, den Führer und Erlöser unserer Seelen, sein <em>erstgeborenes Wort,</em> den Schöpfer und Lenker des Weltalls, weil dieser allein die Fähigkeit besitzt sowohl für sich selbst als auch für alle, und zwar für jeden einzelnen so gut wie für die Gesamtheit zumal, fortwährend und unausgesetzt seinem Vater den Dank darzubringen. Denn da er selbst die Wahrheit, die Weisheit und Kraft des Allvaters, und dazu noch in ihm und mit ihm vollkommen geeinigt ist, deshalb ist es gar nicht denkbar, daß er aus Vergeßlichkeit oder aus Mangel an Einsicht oder irgendwie aus Schwachheit wie einer, der außerhalb von ihm sein Dasein hat, entweder nicht hinreichend Kraft hätte ihn zu preisen oder es zwar vermöchte, aber freiwillig — es wäre Sünde dies zu sagen — seinen Vater ohne Lobpreis lassen wollte. Er allein vermag am vollkommensten den ganzen Tribut des Lobes darzubringen, das ihm gebührt. Ihn hat der Allvater selbst mit sich Eins gemacht, indem er durch ihn nahezu sich selbst übertraf. Darum muß der Vater, wenn man so sagen darf, in jeder Beziehung in gleich hohem Grade, wie er ihn ehrt, von ihm wieder Ehre empfangen. Dazu ist zuerst und einzig unter allen Wesen befähigt sein Eingeborner, Gott das Wort, das in ihm ist, während wir anderen alle nur insoweit Dankbarkeit und Ehrfurcht an den Tag legen können, als wir den vollgültigen und würdigen Dank für die vom Vater empfangenen Wohltaten ihm allein übertragen und auferlegen, in der Überzeugung, dies sei der einzige Weg der Gottesverehrung, durch seine Vermittlung in allem an den Urheber des Weltalls zu denken. Darum also soll offen das Bekenntnis abgelegt werden, daß der allumfassenden und immerwährenden Vorsehung, die im Größten wie im Kleinsten für uns sorgt und uns bis hieher geleitet hat, Dank und Preis darzubringen nur jenes Wort hinreichend würdig sei, welches höchst vollkommen und lebendig und das geistbelebte Wort der Urvernunft ist.</p><p><em>Mein</em> Wort des Dankes aber soll heute unter allen Menschen vornehmlich <em>dem heiligen Manne</em> gelten, der hier zugegen ist. Wollte ich aber mit meinem Lobe noch höher hinaufsteigen, so möge es unter den unsichtbaren und der Gottheit näher stehenden Schutzgeistern der Menschen dem gelten, der durch Auswahl des Allerhöchsten die Aufgabe erhielt mich von meiner Kindheit an zu leiten, zu pflegen und für mich zu sorgen, der heilige <em>Engel Gottes,</em> der mich ernährt von Jugend auf, wie jener Liebling Gottes sagt, indem er offenbar dabei an seinen Engel denkt. Doch er, der ein großer Mann war, hatte in angemessener Weise einen sehr erhabenen Geist oder sonst jemanden, wer es auch immer sei, oder vielleicht gar den Engel des großen Ratschlusses selbst, den gemeinsamen Erlöser der Menschheit, um seiner Vollkommenheit willen zum ausschließlichen Beschützer erhalten, — ich weiß es nicht gewiß; jedenfalls hat er in seinem Engel, wer es auch immer sein mochte, etwas Großes erkannt und gepriesen. Ich aber tue das Gleiche neben dem gemeinsamen Lenker aller Menschen auch dem meinigen gegenüber, wer auch immer dieser eigens für meine Unerfahrenheit bestimmte Leiter sein mag. Er ist mir von jeher in jeder Beziehung und überall ein guter Erzieher und Pfleger gewesen (nicht wie es mir oder einem meiner lieben Angehörigen ersprießlich zu sein scheint — wir sind ja zu blind selbst dem gegenüber, was vor uns liegt, als daß wir etwas von dem, was wir bedürfen, auch nur zu beurteilen vermöchten — sondern wie er selbst es als nützlich erkennt, da er alles im voraus überschaut, was für unser Seelenheil ersprießlich ist) und auch jetzt noch ist er mein Ernährer, mein Erzieher und mein Führer. Und von allem andern ganz abgesehen, hat er es auch, was unstreitig das Allerwichtigste war, so einzurichten gewußt, daß er mich mit diesem Manne in Berührung brachte, ohne daß ich mit ihm durch Abstammung oder irgend welche Bande menschlichen Blutes verbunden gewesen oder sonst in näherer Beziehung gestanden wäre oder mich in seiner Nähe befunden oder überhaupt nur zu seinem Volksstamme gehört hätte — dies sind bekanntlich die Umstände, die für die Mehrzahl der Menschen der Anlaß werden, daß sie Freundschaft miteinander schließen und einander kennen lernen — sondern, um es kurz zu sagen, unbekannt, verschieden nach unserer Herkunft, gegenseitig fremd und einander ganz und gar fernstehend, sodaß Völker, Berge und Flüsse trennend zwischen uns lagen, hat er uns <em>mit wahrhaft göttlicher und weiser Vorsehung zusammengeführt</em> und mir dieses heilbringende Zusammentreffen ermöglicht; und das hat er, wie ich glaube, nach himmlischem Beschlusse schon gleich bei meiner Geburt und seit den frühesten Tagen meiner Kindheit ausgedacht. In welcher Weise aber, das wäre zu weitläufig zu erzählen, nicht bloß wenn ich bestrebt wäre genau zu sein und nichts zu übergehen, sondern auch wenn ich das meiste beiseite lassend in gedrängter Kürze nur einige wenige meiner wichtigeren Erlebnisse erwähnen wollte.</p>
      <h2>5</h2><p><em>Meine erste Erziehung</em> von Geburt an ging nämlich unter den Augen meiner Eltern vor sich und die Lebensweise in der Heimat war eine vom Pfade der Wahrheit abweichende. Daß ich einmal davon frei werden sollte, wagte wohl niemand zu erwarten und konnte auch ich nicht hoffen als unzurechnungsfähiger Knabe unter einem Vater, der dem Götzendienst ergeben war. <em>Da verlor ich meinen Vater</em> und wurde verwaist, und gerade das legte in mir bald den Grund zur Erkenntnis der Wahrheit. Damals nämlich wandte ich mich <em>zum ersten Male dem heilbringenden und wahrhaftigen Worte</em> zu, ich weiß nicht wie, geschah es mehr aus Zwang oder aus eigenem Antrieb. Was hätte ich denn auch mit vierzehn Jahren für eine Unterscheidungsgabe haben sollen? Indes begann von jener Zeit an dieses heilige Wort sogleich eine gewisse Anziehungskraft auf mich auszuüben, weil in ihm eben die allgemeine Vernunft der Menschheit zum vollen Ausdruck gelangt; diese Anziehungskraft äußerte es gleichwohl damals zum ersten Male. Darin nun erblicke ich (wenn auch nicht von jeher, so doch wenigstens jetzt, wo ich darüber nachdenke) ein nicht geringes Kennzeichen der heiligen und wunderbaren Fürsorge für mich, <em>in der Fügung nämlich, daß dies gerade mit diesen Jahren zusammentraf,</em> damit so einerseits alles, was dieser Altersstufe vorausging, insoweit es in Werken des Irrtums bestand, meiner Unmündigkeit und Unvernunft zur Last falle und das göttliche Wort nicht umsonst einer dafür noch nicht empfänglichen Seele überliefert werde, andererseits damit meine Seele, nachdem sie dafür empfänglich geworden, wenn auch nicht erfüllt mit dem göttlichen und reinen Wort, so doch wenigstens der Ehrfurcht gegen dieses Wort nicht bar sei, sondern das menschliche und göttliche Wort gleichzeitig in mir zur Herrschaft gelange, dieses, indem es mit der ihm eigentümlichen und für mich unaussprechlichen Kraft Hilfe brachte, jenes, indem es Hilfe empfing. Diese Erwägung nun ist es, die mich gleichzeitig mit Freude und Furcht erfüllt, indem mich einerseits der Gedanke an diese Führung erhebt, andererseits aber die Furcht beschleicht, ich möchte trotz dieser großen Gnadenerweisungen gleichwohl mein Ziel nicht erreichen.</p><p>Doch ich habe mich unvermerkt bei diesem Teil meiner Rede zu lange aufgehalten. Ich möchte allerdings die wunderbare Führung zu diesem Mann ausführlich auseinandersetzen, trotzdem aber will ich mich am Anfang beeilen und kurz fassen um zu den folgenden Punkten zu gelangen, nicht als ob ich glaubte dem, der es so gefügt hat, den Tribut des Preises oder des Dankes und der Huldigung, so wie ich es schulde, darbringen zu können (ich müßte ja als anmaßend erscheinen, wenn ich diese Bezeichnungen gebrauchte und doch nichts Würdiges zu sagen wüßte), sondern weil ich mir vorkomme wie einer, der einfach eine Aufzählung macht oder ein offenes Bekenntnis ablegt oder wie man sonst die Sache zutreffender bezeichnen kann.</p><p>Meine Mutter, die von meinen Eltern allein zurückgeblieben war um für mich zu sorgen, beschloß mir jene <em>allgemeine Ausbildung</em> geben zu lassen, wie sie bei Knaben von edler Herkunft und Erziehung von jeher üblich war, und mich außerdem noch zu einem <em>Redner</em> in die Schule zu schicken, weil ich eben ein Redner werden sollte. Ich besuchte diese Schule auch wirklich, und die damaligen Sachverständigen versicherten, daß ich es in nicht gar langer Zeit zum Redner bringen werde. Ich dagegen kann das nicht gerade behaupten und möchte es auch nicht tun. Es bestand auch kein Grund für diese Annahme, auch fehlte es noch an jeder Voraussetzung zu den Beweggründen, die mich auf meine gegenwärtige Laufbahn zu führen vermochten. Indes stand mir wachsam zur Seite der himmlische Erzieher und wahrhaftige Vormund, ohne daß meine Angehörigen daran dachten oder ich selbst darnach verlangte, und <em>gab einem meiner Lehrer einen Gedanken ein</em> — dieser Lehrer war lediglich damit beauftragt mich in der lateinischen Sprache zu unterrichten, nicht daß ich es darin hätte zur Meisterschaft bringen sollen, sondern damit ich auch in dieser Sprache nicht ganz und gar unbewandert sei; zufällig aber hatte er auch einige Kenntnis in der Rechtswissenschaft — dieses nun gab er ihm in den Sinn und ließ mich durch ihn ermuntern mir die <em>Kenntnis des römischen Rechtes anzueignen.</em> Und das tat der Mann mit großer Beharrlichkeit. Ich aber ließ mich überreden, mehr aus Gefälligkeit gegen den Mann als aus Vorliebe für jenen Wissenszweig. Er nahm mich also als Schüler an und begann den Unterricht mit großem Eifer. Dabei ließ er eine Äußerung fallen, die sich an mir im höchsten Grade bewahrheitet hat, die Kenntnis des Rechtes werde für mich die vorteilhafteste Ausstattung auf dem Lebenswege sein (so lautete wörtlich sein Ausdruck), sei es nun, daß ich als Anwalt in den Gerichtshöfen oder sonst als Redner auftreten wollte. Das waren seine Worte, und er bezog sich damit auf die menschlichen Verhältnisse; mir aber scheint es geradezu, daß er die Wahrheit vorhergesagt hat in einem Anflug von Begeisterung, die mehr von Gott kam als seinem eigenen Gedankenkreis entsprang.</p><p>Als ich nämlich halb freiwillig halb widerstrebend in den genannten Gesetzen Unterricht nahm, waren mir schon gewisse Fesseln angelegt, und die Stadt Berytus mußte den Grund und die Veranlassung dazu bieten, daß ich in meine gegenwärtigen Verhältnisse eingeführt wurde. Diese Stadt war nämlich nicht weit von meinem damaligen Aufenthaltsort abgelegen, hatte mehr römisches Gepräge und stand in dem Rufe, daß sie eine Pflanzschule der genannten Rechtswissenschaft sei. Aber auch diesen heiligen Mann haben andere Geschäfte von Ägypten, aus der Stadt Alexandria, wo er vorher seine Heimat hatte, weggezogen und hieher geführt, wie wenn er mit mir zusammentreffen sollte. Ich weiß allerdings seine Beweggründe dafür nicht anzuführen und will gern darauf verzichten. Dazu aber, daß ich hieher kam und mit diesem Manne in Verbindung trat, bestand kein so zwingender Grund wie für mein Rechtsstudium; denn ich hätte auch in die römische Hauptstadt übersiedeln können. Wie nun wurde auch dieses bewerkstelligt? Der damalige Statthalter von Palästina nahm unerwartet meinen <em>Schwager,</em> den Mann meiner Schwester, zu sich, indem er ihn gegen seinen Willen vereinsamt von der Gattin wegriß, und versetzte ihn dorthin, damit er ihn im Amte unterstützen und mit ihm die Beschwerden der Regierung des Landes teilen sollte. Er war nämlich einigermaßen in den Gesetzen bewandert und ist es wohl auch jetzt noch. So reiste denn mein Schwager gemeinsam mit jenem ab, gedachte aber, in nicht allzu ferner Zeit seine Frau nachkommen zu lassen und zu sich zu nehmen, da er sich nur hart und ungern von ihr getrennt hatte, aber auch uns wollte er zugleich mit ihr kommen lassen und bei sich behalten. Wir gingen eben mit dem Plane um, eine Reise anzutreten — ich weiß nicht, wohin, jedenfalls eher anderswohin als an den genannten Ort — da trat plötzlich ein <em>Soldat</em> zu uns, der den Auftrag hatte unserer Schwester das Geleit zu geben und sie wohlbehalten ihrem Manne zuzuführen, <em>zugleich mit ihr aber auch uns</em> als Reisebegleiter mitzubringen. Damit würden wir unserem Schwager und ganz besonders unserer Schwester Freude machen, (weil sie sonst gegen den Anstand verstoßen und gegen die Reise einigen Widerwillen haben könnte,) ebenso auch seinen Hausgenossen und Verwandten, die viel auf uns hielten und uns außerdem noch manchen nicht unbedeutenden Vorteil erwirken könnten, wenn wir nach Berytus ziehen und dort unser Rechtsstudium durchmachen wollten. Somit wirkte alles bestimmend auf uns ein, die triftigen Gründe, die man hinsichtlich unserer Schwester angeführt hatte, unser eigenes Fachstudium, und dazu noch der Umstand, daß der Soldat (denn auch ihn muß ich noch erwähnen) Anweisung auf mehr Staatsfuhrwerke mitbrachte, als man bedurfte, sowie eine größere Zahl von Reisekarten, mehr aus Rücksicht auf uns als auf unsere Schwester allein. Dies waren die Gründe, die in die Augen fielen; Gründe aber, die nicht so offen zutage lagen, aber darum nicht minder wirklich vorhanden waren, das war der Verkehr mit diesem Manne oder genau gesprochen der Unterricht, den wir durch ihn über das „Wort" empfangen und der Nutzen, den wir daraus für unser Seelenheil ziehen sollten. Diese Gründe waren es, die uns, obwohl wir blind dafür waren und nichts davon ahnten, dazu bestimmten, aber zu unserm Heile. Nicht der Soldat also, sondern <em>ein himmlischer Reisegefährte,</em> ein guter Begleiter und Wächter, er, der uns während unseres ganzen Lebens wie auf einer weiten Reise beschirmt, <em>er hat uns von allem andern und auch von Berytus,</em> um dessentwillen zumeist wir hieher zu eilen wähnten, <em>abgelenkt, uns hieher gebracht und hier abgesetzt,</em> indem er alles aufbot und in Bewegung setzte, bis er uns mit aller Geschicklichkeit an diesen Mann kette, der so viel Segen über uns brachte. Nachdem uns nun der himmlische Engel soweit geleitet hatte, übertrug er die Führung diesem Mann, und nun gönnte er sich wohl auch einige Ruhe, nicht aus Ermüdung und Überdruß, (denn das Geschlecht der himmlischen Boten kennt keine Ermüdung,) sondern weil er uns einem Manne übergeben hatte, der alle nur mögliche Umsicht und Fürsorge betätigen sollte.</p>
      <h2>6</h2><p>Mit dem ersten Tag aber, an dem er uns bei sich aufgenommen hatte — es war dies in Wahrheit <em>mein erster und,</em> wenn ich so sagen darf, <em>mein ehrenvollster Tag,</em> als für mich zum erstenmal die Sonne der Wahrheit aufzugehen begann — <em>gab er sich zunächst alle erdenkliche Mühe uns an sich zu fesseln,</em> während wir in ähnlicher Weise wie wilde Tiere, Fische oder Vögel, die in Schlingen oder Netze geraten sind, zu entschlüpfen und zu entrinnen suchten und mit dem Gedanken umgingen von ihm weg nach Berytus oder in unsere Heimat zu entweichen. Dabei bewegte er sich in allen Tonarten und zog, wie man im Sprichwort sagt, an allen Stricken und setzte alle seine Kräfte in Bewegung. Er pries die Liebe zur Weisheit und ihre Liebhaber mit großen, reichlichen und zutreffenden Lobeserhebungen. Nur die, sagte er, führten in Wahrheit ein Leben, wie es vernünftigen Wesen gebührt, die bemüht seien rechtschaffen zu leben und vor allem eine Erkenntnis erlangten von ihrer eigenen Natur und im Anschluß daran von dem wahrhaft Guten, das der Mensch anstreben, und von dem wahrhaft Bösen, das er fliehen soll. Dann geißelte er die Unwissenheit und alle, die in Unwissenheit leben. Es gibt aber deren viele, die, blind am Geiste wie das liebe Vieh, nicht einmal wissen, was sie sind, die herumgehen, wie wenn sie keine Vernunft hätten und überhaupt weder wissen noch wissen wollen, worin denn eigentlich das Wesen des Guten und des Bösen besteht, die nach Reichtum und Ruhm, nach Ehrenbezeigungen vonseiten des Volkes und körperlichem Wohlbefinden trachten und schmachten, wie wenn darin das Gute bestünde, die diese Dinge hoch, ja über alles schätzen, und von den Fertigkeiten nur die, die zu diesen Gütern verhelfen können, sowie von den Berufsarten nur jene, die dazu eine Aussicht eröffnen, den Kriegerstand, den Richterstand und das Studium der Rechte. Dies seien, so betonte er mit besonderem Nachdruck und großer Geschicklichkeit, die Beweggründe, die uns leiteten, wenn wir unsere Vernunft vernachlässigten, die doch, wie er sagte, am meisten in uns zur Herrschaft berufen sei. Ich könnte jetzt nicht sagen, wie viele Aussprüche dieser Art aus seinem Munde kamen um uns zum Studium der Weisheit zu bewegen, nicht bloß an einem einzigen Tage, sondern an mehreren Tagen der ersten Zeit, in der ich ihn aufsuchte. Ich fühlte mich von seiner Rede wie von einem Pfeil getroffen und zwar gleich vom Beginn dieses Lebensabschnittes an; denn sie war gewissermaßen eine Mischung von süßer Anmut, überzeugender Beredsamkeit und zwingender Kraft. Aber immer noch wand und drehte ich mich (wenn man so sagen darf) und sann hin und her. Und ich bestand auf dem Studium der Weisheit, war aber noch nicht ganz dafür gewonnen und doch konnte ich merkwürdigerweise nicht wieder davon abstehen, sondern fühlte mich fort und fort durch seine Worte wie mit höherem Zwange zu ihm hingezogen. Er erklärte es nämlich für ganz unmöglich den Herrn der Welt auch nur richtig zu verehren, — und das ist doch eine Auszeichnung und ein Vorzug, den unter allen lebenden Wesen auf der Welt nur der Mensch besitzt, und davon ist natürlich gar niemand ausgeschlossen, ob er unterrichtet ist oder nicht, außer er hat durch etwaige Geistesstörung den Gebrauch seines Denkvermögens ganz und gar verloren, — also selbst die Gottesverehrung erklärte er mit Recht immer wieder und wieder für ganz unmöglich, wenn man sich nicht mit der Weisheit befaßt habe. So häufte er eine Menge von derartigen <em>Beweggründen</em> aufeinander, bis er mich, wie in einem Zauber befangen, durch seine Künste ohne die geringste Regung des Widerstandes an das Ziel gebracht und — ich weiß nicht, wie — durch seine Vorstellungen, ich möchte sagen, mit göttlicher Kraft neben sich festgebannt hatte. Denn er verwundete mich auch noch mit einem Stachel, dessen man sich nicht leicht erwehren kann, der scharf ist und sehr geeignet zum Ziele zu führen, nämlich mit dem <em>Stachel der Freundschaft,</em> gewandten Benehmens und edler Gesinnung, die sich mir schon durch den Ton seiner Stimme in der Anrede und Unterhaltung als eine wohlwollende zu erkennen gab. Nicht schlechthin durch Vorstellung von Gründen suchte er mich zu überwältigen, sondern mit seiner gewandten, menschenfreundlichen und ganz edlen Gesinnung suchte er mich dem Untergang zu entreißen und mir an den Gütern der Weisheit Anteil zu verschaffen, sowie auch ganz besonders an den übrigen Gaben, welche die Gottheit mehr als den meisten oder vielleicht auch mehr als allen jetzt lebenden Menschen ihm allein verliehen hat. Ich meine den Lehrmeister der Gottesfurcht, das heilbringende Wort, das sich vielen nähert und alle unterwirft, mit denen es in Berührung kommt, — denn gar nichts vermag ihm zu widerstehen, da ihm die Herrschaft gehört über alles in der Gegenwart wie in der Zukunft — das sich aber verbirgt und von den meisten nicht nur nicht mit Leichtigkeit, sondern auch nicht mit Schwierigkeit so erkannt wird, daß sie, darüber befragt, eine klare Auskunft geben könnten. <em>Wie ein Funke, der mitten in mein Herz gefahren, entbrannte und entflammte meine Liebe gegen das heilige, gegen das liebenswürdigste Wort</em> selbst, das alle mit seiner unausprechlichen Schönheit aufs unwiderstehlichste an sich zieht, und <em>zugleich meine Liebe gegen diesen Mann, den Freund und Herold des Wortes.</em> Durch diese Liebe aufs tiefste verwundet ließ ich mich überreden alle Beschäftigungen und Kenntnisse, die mir, wie es schien, zugestanden wären, von den andern ganz abgesehen sogar das Studium meiner herrlichen Gesetze beiseite zu lassen, ferner meine Heimat und meine Verwandten, sowohl jene, die in meiner Umgebung waren als auch die, um derentwillen ich auf die Reise gegangen war. Nur eines war mir lieb und teuer, das Studium der Weisheit und mein Führer zu ihr, dieser himmlische Mann. <em>Und die Seele Jonathans verband sich mit [der Seele des] David.</em> Dies habe ich später in der heiligen Schrift gelesen, empfunden aber habe ich es schon zuvor nicht weniger deutlich als es ausgesprochen ist und es ist doch ganz klar und bestimmt ausgesprochen. Es wurden nämlich nicht schlechthin Jonathan und David miteinander verbunden, sondern gerade das Wichtigste, ihre Seele, also das, was selbst dann, wenn das Sinnenfällige und Sichtbare am Menschen sich trennt, durch kein Mittel gezwungen werden kann sich gleichfalls zu trennen, ohne seine Zustimmung wenigstens auf keinen Fall. Die Seele ist nämlich etwas Freies und läßt sich in keiner Weise einschließen, auch wenn man sie in einem Käfig eingesperrt halten wollte. Denn sie ist so geartet, daß sie zunächst überall dort ist, wo der Verstand verweilt. Und wenn du auch glaubst, sie sei im Käfig, so wird sie erst nachträglich durch deine Einbildungskraft dahin versetzt; denn sie ist um dessentwillen durchaus nicht verhindert dort zu sein, wo sie eben sein will. Um so mehr kann sie durchaus nur dort sein und muß natürlich dort für anwesend gehalten werden, wo sich der Schauplatz und das Ziel ihrer höchst eigenen und besonderen Tätigkeit befindet. Hat also nicht der heilige Schriftsteller das, was in mir vorging, ganz klar mit dem kürzesten Ausdrucke veranschaulicht, wenn er sagt, daß Jonathans Seele verbunden wurde mit der Seele Davids? Eine solche Verbindung wider ihren Willen zu zerreißen wird, wie gesagt, in keiner Weise gelingen, freiwillig aber wird nicht leicht eine Zustimmung dazu erfolgen. Denn nicht der schwächere Teil, der dem Wechsel zugänglich und leichter geneigt ist seine Entschlüsse zu ändern, darf, glaube ich, sich herausnehmen diese heiligen Bande der Freundschaft zu lösen, da es auch nicht von ihm allein abhing sie am Anfang zu knüpfen. Dies steht vielmehr dem geistig Überlegenen zu, der standhaft und nicht leicht zum Wanken zu bringen ist und von dem es hauptsächlich abhing die Bande und diese heilige Verknüpfung zuwege zu bringen. Es wurde ja auch nach dem göttlichen Wort nicht so fast Davids Seele mit Jonathans Seele verbunden, sondern im Gegenteil heißt es, daß die Seele des Schwächeren erfaßt und mit der Seele Davids verbunden wurde. Denn nicht das Stärkere, das sich selbst genügt, möchte sich gern verbunden sehen mit dem Schwächeren, das unter ihm steht, sondern das Schwächere, welches der Hilfe von seiten des Besseren bedarf, sollte sich mit dem Stärkeren verbinden und von ihm abhängig sein, damit das eine, in sich selbst verharrend, keinen Schaden nehme durch seine Gemeinschaft mit dem Schwächeren, das in sich Ungeordnete aber, mit dem Besseren verbunden und wohl zusammengefügt, keinen Schaden anrichte, sondern durch den Zwang der Fesseln, die es an das Bessere ketten, unterwürfig gemacht werde. Darum stand die Herstellung jener Bande dem Überlegenen zu und nicht dem Schwächeren. Sich die Bande anlegen zu lassen ist dagegen Sache des Geringeren und zwar so, daß es ihm gar nicht mehr freisteht sich von ihnen loszumachen. <em>Mit solchen zwingenden Fesseln hält mich dieser David gleichsam fest zusammengeschnürt,</em> nicht nur gegenwärtig, sondern schon von jener Zeit an, und wenn ich auch wollte, ich könnte mich nicht von seinen Fesseln losmachen. Ja wenn ich sogar in ein anderes Land gehen wollte, wird er meine Seele nicht loslassen, die er im Sinne der heiligen Schrift so fest an sich gebunden hält.</p>
      <h2>7</h2><p>Übrigens verfuhr er, sobald er mich gefangen und auf alle mögliche Weise umringt und nachdem er die Hauptarbeit getan und ich mich zu bleiben entschlossen hatte, von da an wie ein guter <em>Landwirt</em> mit einem unbestellten Ackerboden, der zwar in keiner Weise fruchtbar, sondern salzhaltig und ausgebrannt, steinig und sandig ist oder auch mit einem solchen, der zwar nicht ganz und gar ohne Erträgnis und Wachstum, sondern im Gegenteil sehr üppig und dennoch wüst und vernachlässigt, mit Dornen und wilden Gesträuchen verwachsen und schwer zu bearbeiten ist, oder er machte es wie ein <em>Gärtner</em> mit einem Baum, der zwar wild und ohne edle Früchte, aber doch nicht ganz und gar unbrauchbar ist, falls jemand mit seiner Gartenkunst ein edles Reis nimmt und es ihm aufpfropft, indem er zuerst in der Mitte einen Spalt macht, dann das Reis hineinsteckt und den Stamm verbindet, bis endlich beide in eins zusammenwachsen (wie zwei zusammenfließende Quellen). So kann man nämlich manchen Mischling von einem Baume sehen, der zwar nicht von der ursprünglichen Art ist, aber doch aus einem unfruchtbaren ein guter Fruchtbaum geworden ist und die Früchte des edlen Ölbaums auf wilden Wurzeln hervorbringt. Er machte es also wie ein Gärtner entweder mit einem Stamm, der zwar wild, aber dessen ungeachtet für einen geschickten Gärtner nicht unbrauchbar ist oder mit einem Edelstamm, der gute Früchte hervorbringt, aber nicht in der gewünschten Richtung, oder mit einem Stamm, der aus Mangel an Kunstfertigkeit nicht beschnitten, nicht begossen und nicht reinlich gehalten ist und ersticken muß vor den vielen überflüssigen Schößlingen, die an ihm zwecklos herauswachsen und sich gegenseitig hindern vollkommen auszuwachsen und Frucht zu tragen. So ungefähr nahm er mich in seine Hände, und mit der ihm eigenen Gewandtheit in Bestellung des Erdreichs musterte und durchschaute er nicht bloß, was jedermann sichtbar war und offen in die Augen fallen mußte, sondern er grub das Erdreich auf und prüfte es im tiefsten Grunde, indem er Fragen stellte und vorlegte und auf meine Antworten hörte; und nachdem er so in mir ein Element erkannt hatte, das nicht unbrauchbar, unnütz und nicht ohne Aussicht auf Erfolg war, grub er und ackerte um und begoß und setzte alles in Bewegung, bot alle seine Geschicklichkeit und Sorgfalt auf und bearbeitete mich beharrlich. Dornen und Disteln und alle Gattungen von wilden Kräutern und Gewächsen, wie sie meine unstete, weil ungeordnete und unbesonnene Seele üppig wachsen und hervorsprießen ließ, alles schnitt er ab und nahm es hinweg durch seine Beweisgründe und seine Verbote. Er faßte mich an und ganz in der Weise eines Sokrates stellte er mir sozusagen bisweilen durch sein Beweisverfahren ein Bein und brachte mich zu Fall, wenn er etwa sah, daß ich wie ein wildes Pferd ganz und gar die Zügel abstreifte, über den Weg hinaussprang und vielfach zwecklos umherrannte, bis er mich mit einer gewissermaßen zwingenden Überredungsgabe durch Beweisgründe aus meinem eigenen Munde wie durch einen Zaum wieder zur Ruhe brachte. Anfangs war es mir widerwärtig und sogar kränkend, wie er seine Beweisgründe vorbrachte; denn ich war noch nicht daran gewöhnt und hatte noch gar keine Übung gehabt in der Unterordnung unter die Gründe der Vernunft. Aber es lag darin gleichwohl ein läuterndes Element.</p><p>So machte er mich fähig und bereitete mich wohl vor zur Aufnahme der Beweisgründe der Wahrheit. Dann erst, <em>als das Erdreich gleichsam ganz gut hergerichtet, weich und bereit war den eingestreuten Samen hervorsprießen zu lassen, streute er ihn reichlich aus,</em> indem er sowohl die Aussaat rechtzeitig bewerkstelligte als auch die ganze übrige Sorge rechtzeitig darauf verwendete und alles in angemessener Weise und mit der eigenartigen Kraft seiner Rede vollführte. Alles, was in meinem Geiste stumpf und verbildet war, sei es, daß er von Natur so beschaffen oder daß er infolge von übermäßiger Leibesnahrung schwerfällig geworden war, schärfte er und vergeistigte es durch seine feinen auf die geistigen Lebensprozesse berechneten Beweisgründe und Wendungen, die, aus den einfachsten Voraussetzungen folgerichtig entwickelt und vielfältig ineinander verflochten, sozusagen zu einem unzerreißbaren und schwer zu lösenden Gewebe sich gestalteten und mich dann wie aus dem Schlafe aufweckten und belehrten stets an dem vorgesteckten Ziele festzuhalten und mich weder durch ihre Länge noch durch ihre Feinheit irgendwie aus dem Gleichgewicht bringen zu lassen. Was aber unüberlegt und voreilig war, sei es nun, daß ich der nächsten besten Ansicht beipflichtete, wie beschaffen sie auch sein mochte, und selbst wenn sie falsch war, oder sei es, daß ich oft widersprach, auch wenn eine richtige Ansicht ausgesprochen wurde: auch das verbesserte er durch jene vorhin erwähnten oder auch noch andere mannigfaltige Beweisgründe. Denn der in Rede stehende Teil des Studiums der Weisheit ist gar reich an Abwechslungen und gewöhnt daran nicht blindlings oder aufs Geratewohl mit Zustimmungen verschwenderisch zu sein und umgekehrt auch nicht blindlings abzusprechen, sondern dabei genaue Untersuchung anzustellen und zwar nicht nur über das, was in die Augen fällt — es hatten sich nämlich auf diesem Wege viele berühmte und glänzende Aussprüche unter dem Deckmantel einer edlen Sprache in meine Ohren eingeschlichen, als wenn sie auf Wahrheit beruhten, während sie innerlich faul und lügenhaft waren, und hatten mir mit Erfolg die Anerkennung ihrer Wahrheit abgestohlen; aber in nicht gar langer Frist wurden sie als faul und unglaubwürdig erkannt und es war umsonst, daß sie sich in das Gewand der Wahrheit zu verhüllen suchten. Er überzeugte mich auch mit Leichtigkeit, daß ich mich in lächerlicher Weise getäuscht und blindlings auf Ansichten geschworen hatte, die es nicht im mindesten verdienten. Umgekehrt hinwiederum hatte ich andere Ansichten, die gediegen waren, aber nicht prunkend auftraten oder nicht in Vertrauen erweckende Ausdrücke gefaßt waren, für widersinnig und höchst unglaubwürdig gehalten und ohne weiteres als falsch verworfen und in unwürdiger Weise mich darüber lustig gemacht. Später aber, wenn ich sie gründlich erforschte und überdachte, erkannte ich, daß das, was ich bisher für verwerflich und unannehmbar gehalten hatte, im allerhöchsten Grade der Wahrheit entsprechend und schlechthin unanfechtbar war. — Also <em>nicht nur die glänzende und in die Augen fallende Außenseite,</em> die aber bisweilen trügerisch und auf Täuschung berechnet ist, <em>solle man,</em> so lehrte er mich, <em>gründlich erforschen, sondern das innere Wesen,</em> man solle jedes einzelne Ding nach allen Seiten untersuchen, ob sich nicht irgendwo ein Mißklang herausstelle, und sich dabei zuerst selbst vergewissern und so erst dem äußeren Eindrucke beipflichten und über jedes einzelne ein Urteil fällen. <em>So entwickelte er nach den Gesetzen des Denkens das Urteilsvermögen meiner Seele</em> in Bezug auf Ausdrücke und Redewendungen und zwar nicht, wie die glänzenden Redekünstler unterscheiden, ob etwas nach seinem sprachlichen Laute hellenisch oder ausländisch ist. Denn das zu wissen ist nicht von Bedeutung und auch nicht notwendig. Aber jenes ist für alle höchst notwendig, für Hellenen und Nichthellenen, für Gelehrte und Ungelehrte, überhaupt (um nicht durch Aufführung aller Wissenszweige und Beschäftigungen weitläufig zu werden) für alle Menschen, welchen Beruf sie auch immer ergreifen mögen, insoferne wenigstens alle, die über irgend einen Gegenstand mit anderen zu verhandeln haben, besorgt und bemüht sind nicht der Täuschung zum Opfer zu fallen.</p>
      <h2>8</h2><p>Aber nicht nur diese Seite meiner Seele, deren Heranbildung nur der Dialektik zufällt, suchte er zu wecken und zu entwickeln, sondern auch ihren niedrigen Teil. Ich war ja allerdings in Staunen versunken über die Großartigkeit und Bewunderungswürdigkeit sowie über die mannigfaltige und höchst weise Einrichtung der Welt; ich war, wenn auch ohne tiefere Einsicht, von Bewunderung hingerissen und von ehrfurchtsvoller Hochachtung ganz eingeschüchtert, aber einem unvernünftigen Wesen gleich verstand ich nicht das Geringste zu erklären. Da weckte und entwickelte er auch dieses Vermögen in mir durch anderweitige Wissenszweige, nämlich die <em>Naturwissenschaften,</em> erklärte und sichtete jedes einzelne Ding und zwar haarscharf bis zu seinen Urbestandteilen zurück, umfaßte es sodann mit seiner Denkkraft und verfolgte seine natürliche Entwicklung sowohl im ganzen als auch nach seinen Teilen, den vielgestaltigen Wechsel und die Umwandlung der Dinge im Weltall, bis er mich mit sich fortriß durch seine klare Lehrweise und durch die Begründungen, die er sich teils durch Lernen teils durch eigenes Nachdenken über die heilige Anordnung des Weltalls und die auf das vollkommenste eingerichtete Natur angeeignet hatte, und so meiner Seele <em>statt einer gedankenlosen Bewunderung eine solche beibrachte, die auf Vernunftgründen beruhte.</em> Und diesen hohen und göttlichen Zweig des Wissens vermittelt die so allgemein geschätzte Erforschung der Natur <em>(Physiologie).</em> Was soll ich die erhabenen Zweige der <em>Mathematik</em> erwähnen, die allgemein geschätzte und über alle Zweifel erhabene <em>Geometrie</em> und die <em>Astronomie,</em> die sich in überirdischen Gebieten bewegt? Und das alles prägte er meinem Geiste ein durch Belehrung oder durch anregende Erinnerung oder wie ich es sonst heißen soll. Dabei machte er ohne weiteres die erstere, nämlich die <em>Geometrie,</em> da sie etwas Unerschütterliches ist, gleichsam zur <em>Grundlage des Ganzen</em> und sozusagen zu einem festen Unterbau. Da er mich andererseits auch bis zu den <em>höchsten Höhen</em> hinaufführte durch die <em>Astronomie,</em> so machte er mir durch die beiden genannten Wissenschaften wie durch eine <em>himmelhohe Leiter</em> den Himmel zugänglich.</p>
      <h2>9</h2><p>Was aber von allem die Hauptsache ist und die eigentliche Triebfeder für die Anstrengungen aller Anhänger der Weisheit, — daß sie nämlich gleichwie aus einer reichhaltigen Pflanzstätte aus langandauernder Beschäftigung mit der Weisheit und allen anderen Wissenszweigen herrliche Früchte ernten, nämlich <em>die göttlichen Tugenden eines sittlichen Charakters,</em> durch die die Seelenkräfte in einen Zustand unerschütterlicher und stets gleichmäßiger Ruhe gelangen — <em>er war fernerhin bestrebt mich unempfindlich gegen Leid und jede Art von Unglück, dagegen fest gegründet in innerer Ordnung und innerem Gleichgewicht, endlich in Wahrheit gottähnlich und glückselig zu machen.</em> Und dies suchte er zu erreichen durch die ihm eigentümliche milde und geistreiche Art, wie er sich über meinen Charakter und mein Benehmen äußerte, nicht zum mindesten auch durch die zwingende Beweiskraft, die sich in diesen Äußerungen kundgab. Und nicht bloß durch Gespräche, sondern in gewissem Sinne bereits auch durch Taten beherrschte er meine Regungen, nämlich gerade durch diese Beobachtung und Betrachtung der Regungen und <em>Stimmungen</em> des Seelenlebens. Denn dadurch vor allem, daß unsere Seele ihre Unordnung erkennt, vermag sie sich daraus emporzuarbeiten und aus dem Zustand der Verwirrung zu geklärten und wohlgeordneten Verhältnissen überzugehen. Zuerst muß sie sich selbst wie in einem Spiegel beschauen, nämlich die Uranfänge und Wurzeln des Übels, all ihr unvernünftiges Wesen, woraus unsere unschicklichen Leidenschaften entspringen, und andererseits alles, was den besseren Teil unseres Wesens ausmacht, die Vernunft, unter deren Herrschaft sie für ihren Teil frei von Schaden und Leiden bleibt. Dann, wenn sie dieses ihr Wesen genau betrachtet hat, soll sie alle Auswüchse der niedrigeren Natur, die uns vor Ausgelassenheit alle Zügel schießen lassen oder vor Kleinmut uns niederdrücken und beängstigen, wie die sinnlichen Lüste und Leidenschaften oder die Traurigkeit und Furcht sowie die ganze Reihe von Übeln, welche diese Sorte von Auswüchsen in ihrem Gefolge hat, beseitigen und aus dem Wege räumen, indem sie ihnen gleich im Entstehen und ersten Wachstum entgegentritt und ihnen auch nicht den mindesten Zuwachs gestattet, sondern sie zugrunde richtet und spurlos verschwinden läßt. Was dagegen aus dem besseren Teile hervorsproßt und für uns gut ist, das soll sie heranziehen und am Leben erhalten, es in seinen Anfängen sorgfältig pflegen und überwachen bis zu seiner Vollendung, Denn auf diesem Wege (meinte er) vermöge sich die Seele mit der Zeit die göttlichen Tugenden anzueignen: die <em>Klugheit,</em> welche imstande ist zunächst eben jene Bewegungen in der Seele zu beurteilen, wobei dann, von diesen ausgehend, auch die Erkenntnis des Guten oder Bösen gewonnen wird, das sich allenfalls außer uns befindet, dann die <em>Mäßigkeit,</em> jene Fähigkeit, die vom Anfang an darin die richtige Auswahl zu treffen weiß, ferner die <em>Gerechtigkeit,</em> die jedem das ihm Gebührende zuteilt, und endlich den <em>Starkmut,</em> der alle diese Errungenschaften zu bewahren weiß. Übrigens gewöhnte er mich nicht mit ausführlichen Worten an die Auffassung, daß die Klugheit eben in der Erkenntnis bestehe, was gut und bös oder was zu tun und nicht zu tun sei; das wäre ja offenbar ein leeres und nutzloses Wissen, wenn das Wort mit den Taten im Widerspruch stünde und die Klugheit nicht tun wollte, was man tun soll, und nicht von dem zurückhalten wollte, was man nicht tun soll, und doch denen, welche sie besitzen, die betreffende Erkenntnis an die Hand gäbe, wie wir es an vielen sehen. Desgleichen sagte er nicht bloß, die Mäßigkeit sei eben eine Erkenntnis dessen, was man wählen und nicht wählen soll, während die übrigen Lehrer der Weisheit so viel wie gar keine Anleitung dazu geben, ganz besonders die jüngeren, die mit Worten allerdings kraftvoll und stark sind, so daß ich mich oft über diese Leute gewundert habe, wenn sie den Menschen eine gleiche Tugend beilegten wie Gott und den Weisen auf Erden dem höchsten Gott gleichstellten, die aber weder imstande sind die Klugheit so zu lehren, daß man auch nach den Forderungen der Klugheit handelt, noch die Mäßigkeit in der Weise, daß man sich auch für das entscheidet, was man kennen gelernt hat. Das Gleiche gilt auch in Ansehung der Gerechtigkeit und des Starkmutes. Nicht in solcher Weise ging er mit mir die Tugendlehre durch, sondern <em>er forderte mehr zum Handeln auf, und zwar forderte er mehr durch seine Taten dazu auf als durch den Inhalt seiner Worte.</em></p>
      <h2>10</h2><p>An die Philosophen unserer Tage, soweit ich sie selbst kennen gelernt habe oder aus den Vorträgen anderer vom Hörensagen kenne, und an meine übrigen Zuhörer stelle ich die Bitte das, was ich jetzt sage, ohne Groll anzuhören. Niemand möge argwöhnen, daß ich so spreche aus Freundschaft für den Gefeierten oder gar noch aus haßerfüllter Gesinnung gegen die übrigen Philosophen. Denn diesen will ich so gut wie irgend ein anderer wegen ihrer Lehren ergeben sein, und ich bestrebe mich ihnen sowohl selbst Lob zu spenden als auch aus dem Munde von anderen die schönsten Dinge über sie anzuhören. Aber es ist nun einmal so, daß nahezu von allen sogar der Name der Philosophie aufs äußerste mißhandelt wird und daß ich es beinahe vorziehen möchte in gänzlicher Unwissenheit zu verharren als etwas von dem zu lernen, was sie vortragen. Diesen Leuten während meines künftigen Lebens mich auch nur zu nähern hielt ich, vielleicht mit Unrecht, nicht für angemessen. Niemand möge außerdem annehmen, daß ich so rede entweder aus einem gewissen ehrgeizigen Bestreben diesen Mann zu feiern oder aus einem sonstigen ehrgeizigen Beweggrunde dieser Art gegenüber den auswärtigen Philosophen. Im Gegenteil, jeder möge es mir glauben, daß meine Worte hinter seinen Leistungen zurückbleiben — ich will ja nicht den Anschein erwecken, als wolle ich schmeicheln. Man glaube es mir, da ich mir nicht Redensarten und Worte und kunstreiche Wendungen zusammensuche um ihn zu preisen! Ich wollte mich ja nicht einmal als Knabe damals, als ich bei einem Lehrer der Beredsamkeit Unterricht im öffentlichen Vortrag erhielt, bereitwillig dazu verstehen jemand zu loben und zu jemands Preise eine Rede zu halten, die mit der Wahrheit nicht im Einklang stand. Darum halte ich es auch jetzt, wo ich mir eine Lobrede vorgenommen habe, für durchaus unstatthaft den Gefeierten auf Kosten anderer zu erheben; andernfalls würde ich den Mann schmähen, wenn ich seinen glückseligen Lebenswandel den Fehltritten anderer gegenüberstellen wollte um mich über ihn noch rühmender aussprechen zu können. So töricht bin ich nicht. Nein, ich will lediglich das, was ich an mir selbst erfahren habe, eingestehen, fern von irgend einer Gegenüberstellung und einem rednerischen Kunstgriffe.</p>
      <h2>11</h2><p><em>Dieser Mann war der erste und einzige, der mich bewog mich auch mit der hellenischen Philosophie zu befassen,</em> indem er mich durch seine eigene Lebensweise bestimmte auch seine Darstellung über die Lebensregeln anzuhören und aufmerksam zu verfolgen, während ich, was die übrigen Philosophen betrifft — ich hebe nochmal diese Tatsache hervor — mich wohl nicht dazu verstanden hätte, zwar nicht mit Recht, sondern nahezu zu meinem Unglück. Freilich kam ich anfangs auch nicht mit mehreren in Berührung, sondern nur mit einigen, die sich als Lehrer darin ankündigten, aber doch mit lauter solchen, die mit ihrer Philosophie nicht über die leeren Redensarten hinauskamen. Er aber war der erste, der mich auch mit Worten zur Beschäftigung mit der Weisheit anregte, dadurch daß er <em>durch die Tat seiner mündlichen Anregung zuvorkam, indem er nicht bloß wohl einstudierte Redensarten vorbrachte, sondern es selbst unter seiner Würde fand etwas zu sagen, außer mit lauterer Gesinnung und mit dem Bestreben das Gesagte auch in die Tat umzusetzen, </em>indem er ferner bemüht war sich so zu zeigen, wie es dem Bilde entspricht, das er von einem guten Lebenswandel entwirft, gern hätte ich auch gesagt, indem er das Muster eines Weisen bot. Da aber meine Rede von Anfang an Wahrheit und nicht Schönfärberei in Aussicht gestellt hat, so will ich ihn jetzt noch nicht als das Musterbild eines Weisen bezeichnen. Freilich würde ich die Wahrheit sagen, wenn ich behaupten wollte, daß er es sei; aber ich will für jetzt davon absehen. Also nicht ein Musterbild im buchstäblichen Sinne will ich ihn nennen, aber einen Mann, der demselben im höchsten Grade gleichzukommen trachtete, der sich mit allem Ernst und Eifer und zwar, wenn ich so sagen darf, über das Maß der menschlichen Kräfte hinaus mit Gewalt dazu anhielt und außerdem noch bestrebt war aus mir ein weiteres Ebenbild dieser Art zu gestalten, damit ich nicht bloß die Vorträge über die Gemütsbewegungen, sondern die Gemütsbewegungen selbst in meine Gewalt bekäme und verstünde. <em>Er drang nämlich auf Taten</em> und Worte zugleich und brachte mir bei der Veranschaulichung selbst einen nicht unbedeutenden Teil jeder einzelnen Tugend bei und hätte mir vielleicht das Ganze beigebracht, wenn ich es zu fassen vermocht hätte. Er nötigte mich sozusagen <em>gerecht</em> zu leben durch die tatsächliche Gerechtigkeit seiner eigenen Seele, der er mich in überzeugender Weise innerlich beizutreten bewog, indem er mich ablenkte von der Geschäftigkeit im Dienste des täglichen Lebens und von dem lästigen Auftreten in der Öffentlichkeit und mich dagegen aneiferte <em>mich selbst zu erforschen und meine eigenen Angelegenheiten in Wahrheit zu betreiben.</em> Darin aber besteht das Leben nach der Gerechtigkeit und darauf beruht die wahre Gerechtigkeit, wie auch einige von den alten Philosophen gesagt haben — sie dachten meines Erachtens dabei an das Verhalten zu sich selbst und erblickten darin ein wirksameres Mittel zur Erlangung der Glückseligkeit sowohl für sich als auch für ihre Anhänger —, wenn anders es die Eigentümlichkeit dieser Tugend ist nach Gebühr zuzuteilen und zwar jedem, was ihm eigen ist. Was könnte es nämlich für die Seele noch Eigentümlicheres und Angemesseneres geben als die Sorge für sich selbst, indem sie nicht nach außen blickt, sich nicht mit fremden Dingen befaßt und um es kurz zusammenzufassen sich selbst auch nicht das geringste Unrecht zufügt, sondern innerlich in sich gekehrt ihr eigenes Wesen an sich selber zurückgibt und so die Gerechtigkeit ausübt! <em>So bildete er mich heran, indem er mich, wenn man so sagen darf, nötigte die Forderungen der Gerechtigkeit zu erfüllen und andererseits nicht minder die Forderungen der Klugheit,</em> dadurch daß meine Seele in sich gekehrt war und den Willen und das tätige Streben nach Selbsterkenntnis in sich trug. Das ist offenbar die schönste Aufgabe der Weltweisheit, was bekanntlich auch dem vorzüglichsten Wahrsagergeiste als ein Gebot der tiefsten Weisheit in den Mund gelegt wird mit den Worten: „Erkenne dich selbst!“ Daß dies in der Tat die Aufgabe der Klugheit sei und daß darin die göttliche Klugheit bestehe, wird von den Alten treffend behauptet, da tatsächlich die göttliche und menschliche Tugend ein und dasselbe ist, insofern sich die Seele darin übt sich selbst wie in einem Spiegel zu sehen und den göttlichen Geist, wenn sie dieser Gemeinschaft für würdig befunden werden sollte, in sich selbst widerspiegelt und so die Spuren eines geheimnisvollen Weges zu dieser Vergöttlichung entdeckt. Dasselbe findet dementsprechend auch Anwendung auf die <em>Mäßigkeit</em> und den <em>Starkmut;</em> auf die Mäßigkeit, insofern man, falls es der Seele je einmal gelingen sollte sich selbst zu erkennen, diese Klugheit der sich selbst erkennenden Seele unversehrt beibehalte — denn das mache hinwiederum das Wesen der Mäßigkeit aus, daß sie gewissermaßen eine unversehrt beibehaltene Klugheit sei — auf den Starkmut aber, insofern man bei den erwähnten Fertigkeiten verharre und nicht davon abgehe, weder freiwillig noch unter dem Drucke irgend einer Nötigung, sondern sie bewahre und die erwähnten Errungenschaften in seiner Gewalt behalte. Denn das Wesen dieser Tugend bestehe darin, daß man seine Überzeugung festhalte und bewahre.</p>
      <h2>12</h2><p>Mich gerecht, klug und mäßig oder starkmütig zu machen liegt allerdings infolge meiner Schwerfälligkeit und Langsamkeit trotz seines großen Eifers sicherlich noch in der Zukunft, da ich noch weit davon entfernt bin irgend eine menschliche oder göttliche Tugend wirklich oder annähernd zu besitzen. Diese letzteren sind nämlich außerordentlich groß und erhaben, und niemand kann sich an eine dieser beiden Gattungen heranmachen um sie sich anzueignen, wenn ihm nicht Gott die Kraft dazu einhaucht. Ich besitze weder von Natur eine solche Fähigkeit, noch bin ich, das gestehe ich ein, vorläufig wert eine solche zu erreichen, weil ich infolge von Trägheit und Schwachheit nicht alles getan habe, was sich für jene geziemt, die nach den höchsten Tugenden streben und sich um die vollkommensten Güter bewerben. Gerecht zu sein oder mäßig oder <em>eine von den</em> übrigen <em>Tugenden zu besitzen, das liegt also,</em> wie gesagt, <em>für mich noch in der Zukunft. Aber Liebe dazu und zwar eine im höchsten Grade brennende Liebe,</em> wie es wohl nur bei ihm allein möglich war, <em>hat mir dieser bewunderungswürdige Mann schon längst eingeflößt</em> als Freund und Wortführer der Tugenden. Er hat mir durch seine eigene Tugend <em>Liebe</em> eingepflanzt <em>zu der Schönheit der Gerechtigkeit,</em> deren wahrhaft goldenes Antlitz er mir zeigte, <em>Liebe zur Klugheit,</em> die für jedermann ein Gegenstand des Strebens zu sein verdient, <em>Liebe zur</em> wahren und im höchsten Grade liebenswürdigen <em>Weisheit, Liebe zur</em> göttlich schönen <em>Mäßigkeit,</em> die das Gleichgewicht und den Frieden der Seele bildet für jeden, der sie besitzt, <em>Liebe zum Starkmut,</em> der der höchsten Bewunderung würdig ist, <em>Liebe zur gegenseitigen Verträglichkeit</em> und endlich noch <em>Liebe zur Gottesfurcht,</em> die man mit Recht als Mutter der Tugenden bezeichnet. Sie ist ja der Anfang und der Endzweck aller Tugenden. Wenn wir mit ihr den Anfang machen, müssen auch die übrigen Tugenden mit größter Leichtigkeit unser Eigentum werden, wenn wir nämlich, was jeder Mensch tun muß, der nicht Gottesleugner oder Sklave der sinnlichen Gelüste ist, eifrig bemüht sind uns die Freundschaft Gottes und Eifer für seine Ehre zu erwerben und deshalb auch den übrigen Tugenden unsere Sorge zuwenden, damit wir nicht im Zustande der Unwürdigkeit und der Befleckung, sondern im Gefolge aller Tugend und Weisheit zu Gott hintreten können wie an der Hand eines guten Führers und eines höchst weisen Opferpriesters. Ich wenigstens glaube, daß das Endziel aller kein anderes sei als mit reinem Herzen Gott ähnlich zu werden, ihm zu nahen und in ihm zu bleiben.</p>
      <h2>13</h2><p>Wie könnte ich neben aller sonstigen Anstrengung und Mühe, die er sich kosten ließ, die Lehrweise und die ängstliche Sorgfalt, mit der er die <em>Gottesgelehrtheit</em> behandelte, erschöpfend schildern und mich tiefer einlassen auf den Gedankengang des Mannes, mit welcher Gesinnung und mit welcher Vorbereitung wir uns nach seinem Wunsche alle Vorträge über das Göttliche aneignen sollten, wie ängstlich er besorgt war, daß wir nicht etwa in Gefahr kämen, das Allernotwendigste aus den Augen zu verlieren, nämlich die <em>Erkenntnis des letzten Grundes</em> von allem! Er leitete uns nämlich an, die Weisheit in der Art zu erforschen, daß wir nach Maßgabe unserer Kräfte <em>alle vorhandenen Schriften der alten Philosophen und Dichter durchgingen, ohne etwas auszuschließen</em> oder zu verwerfen; wir könnten nämlich darüber vorderhand noch nicht einmal ein Urteil haben. <em>Nur die Werke von Gottesleugnern sollten ausgenommen sein,</em> weil diese zugleich sogar die Grenzen des menschlichen Denkens überspringen und das Vorhandensein Gottes und der Vorsehung in Abrede stellen. Solche Schriften auch nur zu lesen hielt er für ungeziemend, damit unser Herz nicht einmal im Vorübergehen befleckt werde, indem es nach Gottesfurcht strebend Reden anhören müsse, die der Verehrung Gottes zuwider seien; denn selbst diejenigen, meinte er, welche sich den Tempeln ihrer vermeintlichen Gottesverehrung näherten, berührten gar nichts Unreines. Die Schriften dieser Gottesleugner also sollten billigerweise gar nicht aufgezählt werden bei Männern, die sich die Gottesfurcht zu ihrer Lebensaufgabe erwählt hätten. <em>Mit allen übrigen aber sollten wir uns beschäftigen und abgeben und dabei sollten wir nicht eine einzelne Gattung oder einen einzelnen Gegenstand aus dem Gebiete der Weisheit bevorzugen oder auch verwerfen,</em> gleichviel ob hellenisch oder nicht, sondern auf alles sollten wir hören. Das war klug und sehr zweckmäßig angeordnet, <em>damit nicht etwa irgend eine einzelne Ansicht von diesem oder jenem Verfasser für sich allein gehört und geschätzt werde und,</em> selbst wenn sie mit der Wahrheit im Widerspruch stehen sollte, <em>als ausschließliche Wahrheit in unsere Herzen Eingang finde, uns täusche, für sich einnehme und zu ihren sklavischen Anhängern mache,</em> die nicht mehr imstande sind davon abzugehen oder sich davon wieder rein zu waschen wie Wolle, die in Färbestoff getaucht worden ist. Die menschliche Rede ist nämlich ein gefährliches und sehr gefügiges Ding, mannigfaltig in ihren Spitzfindigkeiten und blitzschnell drückt sie, sobald sie in unser Ohr eingedrungen ist, dem Geist ihr Gepräge auf und nimmt ihn für sich ein und wenn sie einmal einen mit sich fortgerissen hat, so bringt sie es dahin, daß man sie liebt, als wäre sie die Wahrheit, und daß sie im Innern haften bleibt, selbst wenn sie Lüge und Täuschung ist, gebieterisch wie ein Zauberer, indem sie in der Person des Getäuschten selbst noch einen Vorkämpfer besitzt. Die menschliche Seele andererseits ist leicht durch die Rede zu täuschen und leicht zur Zustimmung zu bewegen und auch bereit, ehe sie nach allen Seiten untersucht und geprüft hat, infolge ihrer eigenen Kurzsichtigkeit und Schwachheit oder infolge der Spitzfindigkeit des Gesagten, die Mühe einer genaueren Untersuchung von sich abzuwälzen und ohne sich in ihrer behaglichen Ruhe stören zu lassen, sich oftmals falschen Reden und Anschauungen hinzugeben, die nicht bloß für sich selbst vom rechten Wege abgeirrt sind, sondern auch die irreleiten, die an ihnen festhalten; und nicht bloß das, sondern sogar dann, wenn eine Gegenrede den Irrtum berichtigen möchte, gewährt sie ihr keinen Zutritt mehr und läßt sich zu keiner anderen Ansicht mehr bekehren, sondern wird ganz von der einmal aufgenommenen beherrscht wie von einem unerbittlichen Tyrannen, der sie in seine Gewalt bekommen hat.</p>
      <h2>14</h2><p>Und nun frage ich, hat er etwa nicht diese Gegensätze und Widersprüche in den Ansichten der Philosophen und ihre Spaltungen eingehend aufgeführt, wie sich die einen den Behauptungen der anderen entgegenstellen, wie die einen dies, die andern jenes beharrlich festhalten, wie die einen sich dem, die andern wieder einem andern anschließen? Hat er nicht angeführt, wie zwar alle den Willen haben und ihn kundgeben sich mit dem Studium der Weisheit zu beschäftigen, von dem Augenblicke an, wo sie den ersten Anlauf dazu gemacht haben, wie sie versichern, daß sie dieses nicht weniger im Auge haben, wenn sie mitten in ihren Erörterungen stehen, als zur Zeit, wo sie den Anfang dazu machten, ja daß sie vielmehr jetzt eine noch größere Liebe zum Studium der Weisheit verspüren, wo es ihnen ermöglicht worden ist sie sozusagen zu verkosten und bei ihren Lehren zu verweilen, als damals, wo sie zuerst noch ohne Erfahrung nur so von einem unbestimmten Drange getrieben wurden sich mit dem Studium der Weisheit zu befassen, wie sie zwar so sagen, aber <em>keinerlei Erörterungen von Andersdenkenden mehr das geringste Gehör schenken?</em> Und so hat nicht ein einziger unter den Alten einen von den Neueren oder aus der Schule des Lyzeums bewogen sich an ihn anzuschließen und seine Ansicht von der Weisheit vorzutragen und auch nicht umgekehrt, überhaupt gar keiner irgend einen andern. Es läßt sich nämlich nicht leicht einer überreden seine eigene Ansicht aufzugeben und anderen beizustimmen, und zwar vielleicht nicht einmal solchen, die man ursprünglich liebgewinnen würde, wäre man für sie gewonnen worden, ehe man zum Studium der Weisheit überging. Denn wäre die Seele noch nicht von vornherein befangen, so würde man diesen Anschauungen Vertrauen schenken und zugetan sein und ebenso aus dem gleichen Grunde dem sich widersetzen, was man zur Zeit festhält. In dieser Weise haben unsere gefeierten, höchst scharfsinnigen und ganz unermüdlich forschenden Hellenen das Studium der Weisheit betrieben, indem jeder einzelne das, was er eben zuerst auffand, im Anflug einer gewissen Begeisterung für das einzig Wahre erklärte, dagegen alles übrige bei den anderen Philosophen für Täuschung und albernes Geschwätz. Ohne daß einer selbst seinen Standpunkt nur in etwas besser begründen könnte, als dies bei den anderen der Fall ist, kämpft jeder für seine eigene Anschauung um nicht infolge von Zwang oder Überredung sich in die Notwendigkeit versetzt zu sehen zu einer anderen Schule überzugehen und seinen Standpunkt aufzugeben. Dabei hat er aber, wenn ich die Wahrheit sagen soll, keinen anderen Beweggrund als jenen gedankenlosen Zug zu den besagten philosophischen Lieblingsmeinungen und für seine vermeintlichen Wahrheiten — man möge in meinen Worten keinen Widerspruch erblicken — kein anderes Prüfungsmittel als den prüfungslosen Zufall. <em>Das liebt ein jeder, was er zu allererst vorgefunden hat, und ist er einmal davon gleichsam gefesselt, so ist er nicht mehr imstande sich mit etwas anderem abzugeben,</em> selbst wenn er in allen Stücken den siegreichen Nachweis für die Wahrheit seiner eigenen und für die Unwahrheit der gegnerischen Sache führen könnte und dabei auch die Vernunft auf seiner Seite hätte, da er sich ja sogar ohne sich von ihr helfen zu lassen willenlos wie ein Ding, das man findet, den Grundsätzen hingibt und überläßt, die ihn zuerst in Beschlag nahmen; diese aber täuschen ihre Anhänger, wie in anderen Dingen, so ganz besonders in dem Allerwichtigsten und Notwendigsten, in der Gotteserkenntnis und Gottesverehrung. Und so bleiben solche Leute trotzdem gewissermaßen in ihren Fesseln gefangen und <em>es wird wohl nicht mehr leicht möglich sein, daß sie jemand daraus errette, so wenig Rettung möglich ist aus einem Sumpf</em> in einer weit ausgedehnten und fast unwegsamen Ebene, der es denen, die einmal in ihn hineingeraten sind, unmöglich macht sich zu retten, da sie weder rückwärts noch vorwärts können, sondern in ihm bleiben müssen bis zu ihrem Tode; <em>oder so wenig Rettung möglich ist aus einem ausgedehnten, dicht bewachsenen und hohen Walde,</em> in den ein Wanderer eingetreten ist, offenbar in der guten Meinung, er werde wohl wieder hinausfinden und wieder dorthin gelangen, wo der Wald, der ihn einschließt, ins Freie führt — wegen seiner Ausdehnung und Dichtigkeit aber ist er nicht dazu imstande; er wendet sich darin nach den verschiedensten Seiten hin, findet drinnen einige zusammenlaufende Wege und wandert mannigfaltig umher um vielleicht auf einem von ihnen hinauszukommen; aber sie führen nur einwärts, keineswegs aber nach außen, weil sie ausschließlich für den Wald bestimmte Wege sind; zuletzt wird der Wanderer ermüdet und erschöpft und als ob sich alles in Wald verwandelt hätte und auf Erden gar kein Wohnsitz mehr wäre, entschließt er sich dort zu bleiben und seinen Herd aufzuschlagen und sich, so gut es geht, im Walde Raum zu verschaffen —; <em>oder so wenig Rettung möglich ist aus einem Labyrinth,</em> zu welchem nur ein einziger Eingang sichtbar ist; da das Äußere durchaus nichts Verfängliches vermuten läßt, tritt einer durch die eine sichtbare Türe ein, dringt dann bis ins Innerste vor und betrachtet die Sehenswürdigkeit mit ihrer reichen Abwechslung und den sinnreichen und vielverschlungenen Bau mit seinem schlau angelegten Gewirr von Ein- und Ausgängen; sobald er aber wirklich hinausgehen will, ist er nicht mehr imstande es zu tun, weil er drinnen gefangen ist von dem in seinen Augen so weise eingerichteten Gebäude. Ja es ist kein Labyrinth so verwickelt und vielgestaltig, kein Wald so dicht und mannigfaltig, keine Ebene und kein Sumpf so geeignet die, die sich hineinwagen, festzuhalten wie das Wort, wenn man sich einem von diesen Philosophen gegenüber befindet. Damit es nun mir nicht gerade so ergehe wie dem großen Haufen, führte er mich nicht etwa nur in eine einzige Anschauung der Philosophen ein und mutete mir auch nicht zu mich an sie anzuschließen, sondern <em>er führte mich zu allen hin in der Absicht, daß ich mit keiner der hellenischen Lehrmeinungen unbekannt bleiben sollte.</em> Aber er ging auch selbst mit mir darauf ein, indem er wie <em>auf einer Reise voraus ging und mich an der Hand führte,</em> für den Fall, daß sich auf dem Weg eine Krümmung, eine versteckte Grube oder sonst etwas Verfängliches finden sollte, wie ein Meister, der viel mit Spekulationen umgeht und für den es infolgedessen nichts gibt, worin er nicht Übung und Erfahrung besäße, nicht nur selbst oben auf sicherem Standpunkt bleibt, sondern auch anderen die Hand reicht und sie rettet, indem er sie gleichsam herauszieht, wenn sie ins Wasser gefallen sind. So sammelte er alles, was von sämtlichen Philosophen brauchbar und der Wahrheit entsprechend war, und legte es mir zur Annahme vor, während er alles, was falsch war, aussonderte, wie überhaupt, so ganz besonders das, was in Bezug auf Religion bloße Ausgeburt des Menschengeistes war.</p>
      <h2>15</h2><p>In dieser Hinsicht gab er mir den <em>Rat auf nichts zu achten,</em> selbst wenn jemand nach dem Zeugnis aller Menschen ein Ausbund von Weisheit wäre, <em>sondern nur auf Gott sollte ich achten und auf seine Propheten. Dabei machte er selber den Dolmetscher und Ausleger,</em> wo etwas dunkel und rätselhaft war, wie ja dergleichen vieles in den heiligen Offenbarungen enthalten ist — entweder deshalb, weil es Gott so mit den Menschen zu verkehren beliebte, damit nicht das Wort Gottes nackt und unverhüllt auch in eine unwürdige Seele, wie sie der Mehrzahl nach sind, Eingang finde, oder deshalb, weil jede göttliche Offenbarung zwar von Natur aus höchst klar und einfach ist, aber uns unklar und dunkel erscheint, da wir von Gott abgefallen sind und wegen der Länge der Zeit es verlernt haben auf sie zu hören, das vermag ich nicht zu sagen — kurz er machte den Erklärer und Ausleger, gleichviel ob es sich nun etwa um dunkle Stellen handelte (er besitzt ja die Gewandtheit und in höchstem Grade die Einsicht auf Gott zu hören) oder um Stellen, die von Natur aus keinerlei Schwierigkeit boten und nichts enthielten, was ihm unverständlich gewesen wäre, ihm, der allein von allen gegenwärtig lebenden Menschen, soweit ich sie persönlich kennen lernte und einzelne von andern schildern hörte, in dieser glücklichen Lage sich befindet, da er darin geübt ist den lauteren und lichtvollen Inhalt der göttlichen Aussprüche in seine Seele aufzunehmen und andere darüber zu belehren. Denn der Urheber all dieser Aussprüche, der den Gott befreundeten Propheten alle Offenbarungen, alle geheimnisvollen und göttlichen Reden vorsagt und eingibt, hatte ihn so als seinen Liebling bevorzugt und zu seinem Wortführer aufgestellt. <em>Was er durch andere nur in dunkeln Andeutungen mitgeteilt hatte, das gestaltete er in dem Munde dieses Mannes zu einem förmlichen Unterrichte</em> und er verlieh ihm die Gabe die tiefere Bedeutung jener Stellen zu ergründen und aufzufinden, in welchen er, die höchste Autorität des Glaubens, entweder wie ein Herrscher Befehle erteilt oder auch Wahrheiten geoffenbart hat, damit der, der etwa hartherzig und ungläubig oder auch lernbegierig wäre, in gewissem Sinne sich gezwungen sehe, durch den Unterricht bei diesem Mann ein Verständnis zu gewinnen, sich zum Glauben zu entschließen und so dem Rufe Gottes zu folgen. Und diese Aufschlüsse kann er nach meiner Überzeugung auf keinem anderen Wege geben als in Verbindung mit dem göttlichen Geiste; denn die Propheten und die Erklärer der Propheten sind auf eine und dieselbe Kraft angewiesen, und niemand kann einen Propheten verstehen, wenn ihm nicht der in dem Propheten tätige Geist selbst das Verständnis seiner Worte verleiht. In diesem Sinne enthalten auch die heiligen Schriften den Ausspruch, daß der mit dem Schlüssel Versehene allein zu öffnen vermag, sonst aber niemand; das göttliche Wort aber öffnet, was verschlossen ist, indem es die dunkeln Stellen aufhellt. Diese höchste Gabe hat der Mann, den wir feiern, von Gott empfangen und vom Himmel ward ihm der <em>herrliche Beruf zuteil den Sinn der göttlichen Worte an die Menschen zu vermitteln,</em> das Göttliche wie aus dem Munde Gottes zu vernehmen und den Menschen zu erklären, wie es für menschliche Ohren verständlich ist. Auf diese Weise gab es für mich nichts Unbesprechbares, weil auch nichts Verborgenes und Unzugängliches.</p><p>Ich hatte aber Gelegenheit von jeder wissenschaftlichen Behauptung Kenntnis zu nehmen, mochte sie fremden oder hellenischen Ursprunges sein, das Gebiet des Geheimnisvollen oder des Staatslebens näher berühren, dem Inhalte nach göttlich oder menschlich sein, und zwar so, daß ich <em>mit aller Freiheit alles zum Gegenstand meines Studiums und Forschens machen und mich mit allen geistigen Gütern bereichern und sättigen durfte.</em> Mochte man eine alte Lehre der Wahrheit oder etwas anderes der Art namhaft machen, an ihm besaß ich die bewunderungswürdige und vollständige Sammlung und Auswahl der schönsten geistigen Augenweide; und mit einem Wort, er war mir in Wahrheit ein Lustgarten, ein Abbild von jenem großen Garten Gottes, ein Paradies, in welchem meine Aufgabe nicht darin bestand diese niedrige Erde zu bestellen und stumpfsinnig den Leib zu pflegen, sondern ausschließlich darin die Fortschritte des Geistes zu mehren, indem ich mich selbst bebaute wie ein heranreifendes Gewächs oder mich erfreute und in dem Gefühle schwelgte, daß mir ein solches Gewächs vom Urheber des Weltalls ins Herz gepflanzt worden sei.</p>
      <h2>16</h2><p><em>Das war in Wirklichkeit ein Lustgarten,</em> eine wahre Freude und Wonne, in welcher ich die abgelaufene Zeit hindurch schwelgte, eine Zeit, die einerseits keine kurze mehr ist, aber andererseits eine äußerst kurze, wenn sie jetzt mit meiner Abreise und meiner Trennung von diesem Orte bereits zu Ende gehen soll. Ich weiß nicht, was mir widerfahren ist oder was ich abermals verschuldet habe, daß ich hinausziehe, ja hinausgetrieben werde. Ich weiß nicht, was ich anderes sagen soll, als daß ich <em>ein zweiter aus dem Paradiese vertriebener Adam</em> bin und erst angefangen habe zu lallen. Wie schön lebte ich doch, als ich auf meinen Lehrer hörte und schwieg. O könnte ich doch auch jetzt noch in aller Ruhe den Schüler machen und schweigen anstatt dieses neuen Schauspiels, daß der Lehrer die Rolle des Zuhörers spielt! Wozu denn eigentlich bedurfte ich dieser Worte? und wozu diese Ansprache, da ich nicht fortgehen, sondern ausharren sollte? Aber dies scheinen Verirrungen zu sein, die in jener uralten Überlistung ihre Wurzel haben, und jetzt stehen mir bereits die Strafen unserer Ahnen bevor. Oder ich kann auch sagen, es kommt mir vor, als ob ich eine Wiederholung ihres Ungehorsams begehe, indem ich Gottes Worte zu übertreten wage, während ich doch in ihnen und bei ihnen verbleiben sollte. Wenn ich aber fortgehe, so fliehe ich von diesem glücklichen Leben hinweg, gerade so, wie jener Mensch der Urwelt von dem Angesichte Gottes hinweg floh, und ich kehre zur Erde zurück, von der ich genommen wurde; Erdenstaub werde ich deshalb essen alle Tage meines dortigen Lebens und die Erde bearbeiten, die mir dazu nur Dornen und Disteln hervorbringt, nämlich meine Schmerzen und schimpflichen Sorgen, nachdem ich meine schönen und edlen Sorgen preisgegeben habe. Und das, was ich verlassen habe, zu dem kehre ich wieder zurück, zur Erde nämlich, von der ich hergekommen bin, zu meiner irdischen Verwandtschaft und in das Haus meines Vaters und ich verlasse das gute Land, wo meine gute Heimat war, ohne daß ich sie früher kannte, und ich verlasse Verwandte, an denen ich, wie ich erst später zu erkennen anfing, vertraute Freunde meiner Seele hatte, ich verlasse endlich mein wahres Vaterhaus, in welchem mein Vater zurückbleibt und von seinen wahren Söhnen, die dort zu bleiben entschlossen sind, glänzend geehrt und ausgezeichnet wird. Ich hingegen ziehe von da hinweg unedel und unwürdig, da ich mich umwende und wieder zurückkehre. <em>Es wird erzählt, daß sich ein Sohn von seinem Vater den Vermögensanteil, der ihm seinem andern Bruder gegenüber zukam, herausgeben ließ und aus freier Willensentscheidung den Vater verließ und in ein entferntes Land verreiste;</em> durch liederlichen Lebenswandel aber habe er sein väterliches Vermögen verschleudert und aufgezehrt; zuletzt habe er sich in seiner Not als Schweinehirt verdingt, aber vom Hunger gequält habe er sogar Verlangen gefühlt von dem Futter der Schweine einen Teil zu bekommen; doch nicht einmal das sei ihm gewährt worden. So mußte er denn büßen für sein ausschweifendes Leben, nachdem er für den väterlichen Tisch, der doch ein fürstlicher war, die Nahrung der Schweine in der Stellung eines Taglöhners eingetauscht hatte, die ihm vorher nicht in den Sinn gekommen wäre. Etwas Ähnliches scheint mir bevorzustehen, da ich von hier hinweggehe und zwar nicht einmal mit dem ganzen Vermögensanteil, der mich trifft; denn ohne das Nötige mitzunehmen werde ich gleichwohl dahinziehen, die schönen und teuren Güter in deinem Kreise und Bereiche zurücklassend und dafür Dinge von geringerem Werte eintauschend. Es erwartet mich ja nur eine düstere Zukunft, Lärm und Aufregung statt des bisherigen Friedens und statt der bisherigen Ruhe und Ordnung ein regelloses Leben; statt der bisherigen Freiheit aber schwere Knechtschaft, Gerichtsverhandlungen, Prozesse, aufregende Geschäfte, Wohlleben. Und für edlere Bestrebungen bleibt mir auch nicht die geringste Zeit mehr übrig. Nicht mehr soll ich die göttlichen Aussprüche im Munde führen; dafür soll ich im Munde führen die Werke der Menschen; das für sich allein schon hat ein gotterleuchteter Mann als eine Art von Fluch angesehen, ich aber soll sogar von den Werken schlechter Menschen zu reden haben. Wahrhaftige Nacht erwartet mich statt des bisherigen Tages, statt des bisher glänzenden Lichtes Finsternis, statt des bisherigen Festjubels Trauer, statt der bisherigen Heimat ein feindliches Land, wo ich kein heiliges Lied mehr singen darf, — denn wie sollte ich das in einem Lande, das meiner Seele fremd ist, und wo ich bleiben soll ohne meinem Gott nahen zu dürfen? — dagegen nur weinen und seufzen in der Erinnerung an das, was ich hier gehabt, und vielleicht wird man mir das nicht einmal gestatten. Es wird erzählt, daß einst in eine große und heilige Stadt, wo die Gottheit verehrt wurde, die Feinde eindrangen und die Bewohner, die Sänger und Gottesgelehrten als Gefangene mitfortschleppten in ihr Land, und das war Babylon. Die aber, welche dorthin abgeführt wurden, hätten nicht einmal auf Verlangen ihrer Besieger Lust gehabt ihren Gott zu besingen und in unheiligem Lande ihre Saiten ertönen zu lassen, sondern ihre Musikinstrumente an den Weiden befestigt und aufgehängt, sie selbst aber hätten <em>Tränen vergossen an den Flüssen Babylons.</em> Mir kommt es gerade vor, als sei ich einer von ihnen, vertrieben aus dieser Stadt, in der ich mich so heimisch fühle, aus dieser heiligen Stadt, wo Tag und Nacht die heiligen Gesetze, Loblieder und Gesänge und Reden voll tiefer Geheimnisse an unser Ohr tönen, wo das Sonnenlicht ohne Unterbrechung leuchtet, indem wir tagsüber in die göttlichen Geheimnisse eindringen und während der Nacht in der Vorstellung dessen befangen sind, was der Geist am Tage gesehen und behandelt hat, wo überhaupt, um es kurz zu sagen, durchweg die gottbegeisterte Erleuchtung weht. Aus dieser Stadt werde ich vertrieben und als Gefangener in ein fremdes Land geschleppt, wo ich nicht mehr in Tönen der Musik meinem Schmerze Ausdruck geben darf, weil ich auch wie jene mein Instrument an den Weiden aufgehängt habe, sondern wo ich an den Flüssen verweilen und im Schlamme meine Arbeit verrichten und meine Lieder nicht mehr werde singen wollen, wenn ich ihrer gedenke; vielleicht aber werde ich sie infolge meiner sonstigen Beschäftigung, die so unedel ist, sogar vergessen, in meinem Gedächtnis geschwächt. Wenn ich aber noch dazu bei meinem Fortziehen nicht nur nicht mit Widerstreben fortgehe wie ein Gefangener, sondern sogar aus freiem Entschluß, nicht von jemand anderem, sondern von mir selbst besiegt, da es mir ja freistünde dazubleiben, so werde ich bei meinem Weggang von hier vielleicht nicht einmal in Sicherheit reisen können wie einer, der aus einer festen und friedlichen Stadt fortzieht; und es kann recht wohl geschehen, daß ich auf meinem Wege unter Räuber gerate, von ihnen gefangen, entblößt und mit vielen Wunden bedeckt werde und dann irgendwo hingeworfen halbtot liegen bleibe.</p>
      <h2>17</h2><p>Doch was breche ich in solche Klagen aus? <em>Es bleibt mir ja der, der alle rettet,</em> der Beschützer und Arzt für alle, mögen sie nun halbtot oder ausgeraubt sein, <em>das (göttliche) Wort,</em> das über allen Menschen ununterbrochen wacht. <em>Es bleiben mir auch die Keime,</em> sowohl die, die in mir ruhten und die du in mir entwickelt hast, als auch die, die ich von dir empfangen habe, <em>deine vortrefflichen Lehren.</em> Mit ihnen als Begleitern mache ich mich auf den Weg, weinend zwar wie einer, der sich auf die Reise begibt, aber immerhin diese Keime mit mir fortnehmend. Vielleicht bringt mich der Schutzgeist, der über mich wacht, wohlbehalten ans Ziel; vielleicht aber kehre ich wieder zu dir zurück und bringe von den Keimen auch die Früchte und Garben mit, zwar nicht in vollkommener Reife, (denn wie wäre das möglich?) aber doch so weit, als es mir neben meinen amtlichen Geschäften möglich ist. Freilich werden sie schadhaft sein infolge meiner Veranlagung, die unfruchtbar ist oder gewissermaßen Mißwachs erzeugt, <em>aber nicht von meiner Seite noch mehr geschädigt werden soll,</em> vorausgesetzt, daß es Gott so gefällt.</p>
      <h2>18</h2><p>Ich nun will damit meine Rede schließen. Es war zwar kühn, daß sie in Gegenwart eines Mannes erging, vor dem es am allerwenigsten angezeigt gewesen wäre, sie war aber <em>vom besten Willen beseelt</em> und hat, wie ich glaube, meinem Danke einigen Ausdruck verliehen nach Maßgabe meiner Kräfte, und habe ich darin auch nichts den Anforderungen Entsprechendes vorgebracht, so habe ich doch nicht völlig geschwiegen. Ja sie war auch noch mit Tränen verbunden, wie es beim Abschied von lieben Freunden zu sein pflegt, ob kindisch und nicht frei von Schmeichelei, von Unbeholfenheit und Schwulst, das weiß ich nicht; aber nichtsdestoweniger <em>trägt sie</em> auch <em>den Charakter des Ungekünstelten an sich,</em> so viel weiß ich gewiß, und <em>durchweg den Stempel der Wahrheit in unverdorbener Gesinnung und aufrichtiger, rückhaltsloser Ergebenheit.</em></p>
      <h2>19</h2><p>Du aber, teures Haupt, erhebe dich und <em>entlasse mich nunmehr mit deinen Segenswünschen!</em> Du hast mich, so lange ich hier verweilte, vom Untergang errettet durch deinen Unterricht in den heiligen Wissenschaften. <em>Rette mich auch durch deine Gebete,</em> wenn ich in die Fremde gezogen bin! Und nun übergib und überlasse mich fremden Händen, oder vielmehr übergib mich Gott, der mich zu dir hingeführt hat! Danke ihm für all das Gute, das er in der Vergangenheit für mich getan hat, flehe zu ihm, daß er mich auch in Zukunft an seiner Hand führen, daß er mir in allem beistehen, meinem Geiste seine Gebote in Erinnerung bringen und mir seine göttliche Furcht einflößen möge, die mir die beste Erzieherin sein wird! Denn wenn ich einmal von hier fort bin, werde ich ihm nicht mehr mit der nämlichen Freiheit gehorchen, die ich unter deinen Augen besaß. Flehe für mich, daß ich von ihm auch einigen Trost erlangen möge für die Entbehrung deiner Gegenwart, daß er mir einen guten Führer mit auf den Weg geben möge, einen Engel als Gefährten meiner Reise! Bete endlich auch, daß er mich zur Umkehr bestimme und abermals zu dir zurückführe; ja das allein wird mir den allergrößten Trost bereiten!</p>
