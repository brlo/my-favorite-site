    body: |-
      <p><em>Glaubensbekenntnis, übersetzt von Dr. P. Hermann Bourier (Bibliothek der Kirchenväter, 1. Reihe, Bd. 2, Kempten und München 1911).</em></p><p>** <em>(Es ist) ein Gott</em>, Vater des lebendigen Wortes, der persönlichen Weisheit, der Kraft und des Urbildes von Ewigkeit, der vollkommene Erzeuger des Vollkommenen, der Vater des eingeborenen Sohnes.<em>(Es ist) ein Herr</em>, alleinig vom Alleinigen, Gott aus Gott, der Abdruck und das Bild der Gottheit, das schaffende Wort, die Weisheit, die den Bestand aller Dinge umfaßt, und die Kraft, die die ganze Schöpfung ins Werk setzt, der wahrhafte Sohn des wahrhaften Vaters, der Unsichtbare (hervorgegangen) aus dem Unsichtbaren, der Unvergängliche aus dem Unvergänglichen, der Unsterbliche aus dem Unsterblichen, der Ewige aus dem Ewigen.* Und (es ist) ein heiliger Geist<em>, der aus Gott seine (persönliche) Subsistenz hat und durch den Sohn erschienen ist, unter den Menschen nämlich; das Abbild des Sohnes, vollkommen vom Vollkommenen, das Leben, der Urgrund alles Lebenden; die heilige Quelle, die Heiligkeit und der Vermittler der Heiligung. In ihm wird Gott der Vater geoffenbart, der über allem und in allem, und Gott der Sohn, der durch alles ist.</em> (Es ist) eine vollkommene Dreiheit* in Herrlichkeit, Ewigkeit, Herrschaft, ohne Teilung und gegenseitige Entfremdung. Es ist also* nichts Geschaffenes oder Untergeordnetes* in der Dreiheit, auch* nichts Hinzugefügtes<em>, das, zuerst nicht bestehend, nachher zu ihr hinzugetreten wäre. Niemals also hat dem Vater der Sohn gemangelt oder dem Sohne der Geist, sondern</em> unwandelbar und unveränderlich ist es dieselbe Dreiheit immerdar*.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Dr. P. Hermann Bourier, <em>Glaubenserklärung</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 2), Kempten und München 1911. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-1766/versions/glaubenserklarung-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

