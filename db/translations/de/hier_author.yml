    body: |-
      <p><strong>Gedenktag:</strong> 15. (28.) Juni</p><h2>Biographie</h2><p>Über die ersten Lebensjahre des seligen Hieronymus von Stridon ist wenig bekannt. Die Zeit hat sowohl das genaue Datum seiner Geburt als auch sogar seinen weltlichen Namen der Vergessenheit anheimfallen lassen (es gibt jedoch Anlass zu der Annahme, dass er Eusebius hieß). Der Geburtsort des Hieronymus ist Stridon (eine kleine Stadt an der Grenze zweier Gebiete: Dalmatien und Pannonien). Die Eltern des Hieronymus waren Christen. Es gibt die Version, dass sie ihrem sozialen Status nach zu den wohlhabenden Freigelassenen gehörten.</p><p>Die erste Bildung erhielt Hieronymus unter der Leitung eines Lehrers zu Hause. Dann begab er sich auf Wunsch der Eltern nach Rom, wo er seine Ausbildung fortsetzte. Unter anderen Bildungsdisziplinen studierte er Philosophie und Beredsamkeit. Während seines Aufenthalts in Rom erlebte er viele Versuchungen, die er keineswegs immer überwand. Bei alledem gelang es ihm, jenes Flämmchen des Glaubens zu bewahren, das ihm in der Kindheit Mutter und Vater ins Herz gepflanzt hatten. An den Sonntagen beispielsweise besuchte er gern die Gräber der christlichen Märtyrer, deren Eindruck seine Seele so stark berührte, dass es ihm, nach eigenem Bekenntnis, schien, als stiege er selbst lebendig ins Grab hinab.</p><p>Während seines Aufenthalts in Rom beschloss Hieronymus, sein Leben zu ändern. Vermutlich empfing er in dieser Zeit die Taufe. Nachdem er die ewige Stadt verlassen hatte, dachte er während einer Reise durch Gallien ernsthaft über das Mönchtum nach. Als er 372 in sein heimatliches Stridon zurückkehrte, fand er seine Eltern nicht mehr am Leben. Die Notwendigkeit, sich um die Schwester und den jüngeren Bruder sowie um das elterliche Erbe zu kümmern, zwang ihn, seine Pläne eines Einsiedlerlebens aufzuschieben. Eine Zeit lang lebte er in Aquileia im Umgang mit Gefährten eines „halbmönchischen“ Kreises. Dann unternahm er eine Reise in den Osten, mit der Absicht, Jerusalem, Syrien und Ägypten zu besuchen. Als er jedoch Antiochien erreichte, erkrankte er schwer.</p><p>Nach der Genesung ließ er sich in der syrischen Thebais nieder, wie man annimmt, in einem dortigen Kloster. Dort lebte er etwa fünf Jahre in asketischen Übungen und Gebet. In dieser Zeit studierte er die Heilige Schrift und die hebräische Sprache. In Antiochien schloss er sich der Gemeinde des Bischofs Paulinus an und wurde zum Priester geweiht. Kurze Zeit später begab er sich nach Konstantinopel, wo er Umgang mit zwei großen Hierarchen hatte: Gregor von Nazianz und Gregor von Nyssa. Im Jahr 381 verließ er Konstantinopel und begab sich nach Rom. Zu dieser Zeit fand dort eine Synode statt, die wegen des meletianischen Schismas einberufen worden war. In Rom wurde der selige Vater mit dem Amt eines Sekretärs bei Papst Damasus betraut.</p><p>Nicht alle nahmen das hochgeistliche Leben des Vaters Hieronymus an: für viele war er ein Ankläger. Gegen den Heiligen begannen Intrigen. Verleumdungen ergossen sich. Zu allen übrigen Anschuldigungen kam noch der Vorwurf der Sympathie für Origenes hinzu.</p><p>Mit dem Tod Papst Damasus’ im Jahr 384 verstärkte sich der Druck auf den Vater Hieronymus nur noch: Der neue Papst Siricius mochte ihn nicht. Da verließ der Selige, seinen Bruder Paulinianus mitnehmend, Rom und begab sich ins Heilige Land. Nach der Verehrung der heiligen Stätten unternahm er eine Pilgerreise nach Ägypten. Hier hatte er das Glück, Didymus den Blinden zu hören und mit den nitrischen Wüstenvätern zu sprechen.</p><p>Im Jahr 386 übernahm Hieronymus die Leitung eines Klosters in Bethlehem. Neben der Leitung des Klosters und asketischen Übungen widmete er sich der literarischen Tätigkeit.</p><p>Der Beitrag des seligen Hieronymus zur kirchlichen Schriftstellerei ist kaum zu überschätzen. Nach ihm blieb ein umfangreiches literarisches Erbe zurück. Eine seiner wichtigsten Leistungen gilt als die Übersetzung der Bücher der Heiligen Schrift ins Lateinische. Am 30. September 420 entschlief der Heilige im Herrn.</p><h2>Hymnographie</h2><p>Tropar des seligen Hieronymus von Stridon</p><blockquote><p>Groß hast du, du Gottweiser, / als Fürsprecher vor dir die Versammlung der Rechtgläubigen, / denn du bist ein Genosse der Heiligen / und ein Teilhaber der göttlichen Weisheit; / so bitte, wunderbarer Hieronymus, / Christus Gott, // dass er uns große Barmherzigkeit schenke.</p></blockquote><p>Kondak des heiligen Hieronymus von Stridon, 8. Ton</p><blockquote><p>Den Heiligsten unter den Heiligen und den Seligsten unter den Seligen, den Lehrer, / lasst uns mit Liedern preisen, den lobenswerten Hieronymus, / den Führer und Fürsprecher der Gläubigen, ihm in Liebe zurufend: / Freue dich, gottweiser Vater.</p></blockquote>
