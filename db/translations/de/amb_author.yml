    body: |-
      <h2>Biographie</h2><p>Gedenktag: 7. (20.) Dezember</p><p>Der heilige Ambrosius von Mailand wurde in Augusta Treverorum (Treveris; heute Trier) geboren. Als sein Geburtsjahr gilt traditionell 339. Seine Eltern stammten aus Rom und gehörten zu aristokratischen Familien mit alten christlichen Traditionen. Zu seinen Verwandten zählten neben Konsuln die heilige Jungfrau Soteria, die während der Verfolgung unter Kaiser Diokletian das Martyrium erlitt. Nach dem Tod ihres Mannes im Jahr 340 zog Ambrosius’ Mutter mit den kleinen Kindern nach Rom.</p><p>Ambrosius erhielt eine glänzende Ausbildung. Seine erste Stellung im Staatsdienst war die eines Advokaten in Sirmium (Präfektur Illyrien); einige Zeit später ernannte ihn der Prätorianerpräfekt Petronius Probus zum Berater. Um 370 erhielt Ambrosius auf Fürsprache des Probus das Amt eines Konsulars (Statthalters, Gouverneurs) der Provinz Aemilia-Liguria mit Zentrum in Mediolanum (heute Mailand).</p><p>Im Jahr 374 wurde Ambrosius nach dem Tod des mailändischen Bischofs Auxentius I. von der örtlichen christlichen Gemeinde auf den mailändischen Bischofsstuhl gewählt, obwohl er zu dieser Zeit noch nicht einmal getauft war. Anfangs widerstrebte der heilige Ambrosius der Wahl, willigte dann aber ein, den Bischofsstuhl zu übernehmen. Kurze Zeit nach der Taufe wurde er zum Bischof erhoben. Danach verteilte er sein Vermögen und führte bis zu seinem Lebensende einen strengen Lebenswandel.</p><p>Da der heilige Ambrosius in theologischen Fragen nicht besonders bewandert war, begann er, die Heilige Schrift eifrig anhand der Auslegungen bekannter christlicher Schriftsteller zu studieren, und eignete sich bald einen gewichtigen Schatz an Kenntnissen auf diesem Gebiet an. Als überzeugter Anhänger des nicäischen Orthodoxie trat er dem Arianismus entgegen und überzeugte recht schnell viele schwankende und irrende Gläubige aus seiner Herde. Er bekämpfte auch deren alte heidnische Gewohnheiten. Als Kaiser Theodosius der Große bei der Niederschlagung des Aufstands in Thessaloniki übermäßige Härte zeigte, soll Ambrosius ihm verboten haben, sich den Sakramenten der Kirche zu nähern. Der Kaiser unterwarf sich in seiner ihm eigenen Achtung vor der kirchlichen Disziplin und tat öffentlich Buße.</p><p>Ambrosius gewann die große Liebe seiner Herde. Die Überlieferung berichtet von Wundern, die auf seine Gebete hin geschahen. In den letzten Lebensjahren widmete er sich mehr der literarischen Tätigkeit und diktierte seine Schriften seinem Sekretär Paulinus. Am 4. April 397 entschlief der Heilige friedlich im Herrn. Die Verehrung des Ambrosius entstand sowohl im Westen als auch im Osten sogleich nach seinem Tod, wovon die bereits im 5. Jahrhundert entstandenen lateinischen und griechischen Lebensbeschreibungen zeugen.</p><p>Ambrosius von Mailand ist für sein reiches literarisch-theologisches Erbe bekannt. Unter seinen Werken finden sich Schriften exegetischen, dogmatischen, moralisch-sittlichen, hymnographischen und anderen Charakters.</p><h2>Hymnographie</h2><h3>Tropar des heiligen Ambrosius von Mailand (4. Ton):</h3><blockquote><p>Als Regel des Glaubens und Bild der Sanftmut, / als Lehrer der Enthaltsamkeit / erwies dich deiner Herde / die Wahrheit der Dinge. / Darum erlangtest du durch Demut das Hohe, / durch Armut das Reiche, / Vater Ambrosius, / bitte Christus Gott, // dass unsere Seelen gerettet werden.</p></blockquote><h3>Kondak des heiligen Ambrosius von Mailand (3. Ton):</h3><blockquote><p>Mit göttlichen Dogmen erstrahlend, / verdunkeltest du den Betrug des Arius, / du geheimnisvoller Priester und Hirte Ambrosius, / und durch die Kraft des Geistes Wunder wirkend, / hast du offenkundig verschiedene Leiden geheilt, / ehrwürdiger Vater, // bitte Christus Gott, dass unsere Seelen gerettet werden.</p></blockquote><h3>Weiterer Kondak des heiligen Ambrosius von Mailand (8. Ton):</h3><blockquote><p>Das vortreffliche Wort des Lebens hast du erlangt, weiser Vater, / und dich nicht gescheut vor der königlichen Höhe, / du von Gott belehrter Ankläger des Königs, und hast ihn weise gemacht. / Darum wurdest du umso ehrenvoller geehrt / und hast die Herde deines Volkes zu Gott geführt. / Darum rufen wir dir zu: // Freue dich, wunderbarer Ambrosius.</p></blockquote>
