    body: |-
      <p><strong>Gedenktag:</strong> 13. Januar (Gallien, Griechenland, Rumänien, OCA)</p><h2>Biographie</h2><p>Nach dem Zeugnis des heiligen Hieronymus wurde er im zweiten Jahrzehnt des 4. Jahrhunderts in Poitiers (Aquitanien) geboren. Aus vornehmem Geschlecht stammend, erhielt er eine klassische Bildung und widmete die frühen Lebensjahre dem Studium der Philosophie. Das Streben, den Sinn des Lebens zu erfassen, führte ihn zum Neuen Testament. Der Überlieferung nach kam, als er den Prolog des Johannesevangeliums las, in dem die Lehre vom göttlichen Wort-Logos dargelegt wird, himmlisches Licht auf ihn herab, was ihn zur Taufe bewog.</p><p>Um 350 wurde Hilarius zum Bischof seiner Heimatstadt gewählt, obwohl er zu diesem Zeitpunkt bereits verheiratet war und eine Tochter namens Abra hatte. Hilarius nahm nicht an den Synoden von Arles (353) und Mailand (355) teil, die die Absetzung des heiligen Athanasius von Alexandrien bestätigten, begann jedoch aktiv, die Opposition der gallischen Bischöfe gegen Saturninus, den arianischen Bischof von Arles, zu organisieren, weshalb er von Constantius als politischer Unruhestifter nach Kleinasien verbannt wurde.</p><p>Während der Verbannung (356–359) verfasste Hilarius sein wichtigstes theologisches Werk, die Abhandlung „Über die Dreieinigkeit“ (De Trinitate), die dem Beweis der Gottheit des Sohnes gewidmet ist. Interessant ist, dass Hilarius in einem anderen wichtigen Werk, „Über die Synoden“ (De synodis), erzählt, dass er erst unmittelbar vor der Verbannung das nicäische Glaubensbekenntnis kennenlernte. In der Abhandlung „Über die Dreieinigkeit“ wird der Gedanke geäußert, dass der Unterschied zwischen rechtgläubiger und häretischer Lehre manchmal ein unterschiedliches Verständnis der Begriffe sein könne und nicht wirkliche Glaubensverschiedenheit.</p><p>Von der Liberalität seiner Anschauungen zeugt der Erfolg, den Hilarius bei der Herstellung von Kontakten mit verschiedenen religiösen Parteien im Osten erzielte. Zugleich verurteilte Hilarius als „Sakrileg“ die Erklärung der extremen Arianer, die die sogenannte zweite Sirmische Formel (357) annahmen, wonach der Sohn dem Vater „nicht ähnlich“ sei. Auf der Synode von Seleucia (359) begrüßte er den Sieg der gemäßigten Partei unter Führung des Bischofs Basilius von Ancyra und billigte die Annahme des antiochenischen Glaubensbekenntnisses, das zur Garantie der Rechtgläubigkeit der Ostkirche werden konnte.</p><p>Anfang 360 wandte sich Hilarius an den Kaiser mit der Bitte, ihm eine öffentliche Disputation mit Saturninus von Arles zu gestatten und an einer neuen Synode in Konstantinopel teilzunehmen („An Constantius Augustus“, zweites Buch), erhielt jedoch auf beide Bitten eine Absage, woraufhin er mit einer offenen Anklage des Constantius hervortrat („Gegen Constantius Augustus“). Dennoch wurde Hilarius 361 die Rückkehr nach Gallien erlaubt, wo er seinen Kampf gegen Saturninus wieder aufnahm, infolgedessen dieser auf der Synode von Paris (361) erneut verurteilt wurde.</p><p>Von diesem Zeitpunkt an verlor das Arianismus seine Positionen in Gallien, und Hilarius versuchte, den Kaiser Julian zu überzeugen, den Arianer Auxentius, Bischof von Mailand, in die Verbannung zu schicken; doch der den Arianern gegenüber tolerante heidnische Kaiser weigerte sich. Hilarius starb wahrscheinlich am 13. Januar 367.</p><p>Hilarius von Poitiers wird in den Akten des Fünften Ökumenischen Konzils unter den heiligen Vätern und Lehrern der Kirche genannt, deren orthodoxe Lehre von der Kirche als Maßstab angenommen wird.</p>
