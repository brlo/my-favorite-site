      <p><em>Der Festgeankerte (Ancoratus) (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>Unser großer und heiliger Vater Epiphanius ist geboren zu Eleutheropolis in Palästina, wo er auch später Vater der Mönche geworden ist. Sein asketisches Leben begann er als Einsiedler in Ägypten und verharrte darin bis zu seiner Heimkehr im zwanzigsten Jahre seines Alters, wo er wieder in das Gebiet von Eleutheropolis zurückging und dortselbst ein Kloster gründete.</p><p>„Der Festgeankerte" heißt diese Schrift deshalb, weil sie wie ein Anker den um Leben und Heil sich kümmernden Geist hält, indem darin eine geordnete Zusammenfassung der meisten Glaubensartikel gegeben wird. Ich nenne nur den Artikel von der gleichen Wesenheit des Vaters und des Sohnes und des Hl. Geistes, von der wahren und wirklichen Menschwerdung Christi, von der Auferstehung der Toten und von dem ewigen Leben sowie vom Gerichte über Leib und Seele gleich darauf; dazu kommen die Auseinandersetzungen gegen Götzenbilder und Häresien im einzelnen, gegen die Juden et cetera. Ferner gibt die Schrift die Namen von achtzig Häresien und gewährt Aufschluß über andere Fragen aus der Hl. Schrift. — Geschrieben ist der „Festgeankerte" an die Bewohner Suedras in Pamphilien, welche darum baten in Briefen, die hier der eigentlichen Abhandlung vorangestellt sind. Das geschah neunzig Jahre nach [dem Regierungsantritt des] Diokletian, im zehnten Jahre des Valentinian und Valens, im sechsten Jahre Gratians.</p><p>BRIEF AUS SUEDRA in Pamphilien an den hl. Epiphanius, den Bischof von Konstanzia auf Cypern, geschrieben von dem Kreise um Tarsinus und Matidius und andere Priester, die ihn befragen über den Glauben an den Vater und den Sohn und den Hl. Geist und über andere Punkte unseres Glaubens.</p><p>Dem gottseligen Bischof Epiphanius entbieten Matidius und Tarsinus, Neon und Numerianus, Priester der katholischen Kirche in Suedra, Gruß im Herrn.</p><p>Auf verschiedene Weise pflegt der Feind des Menschengeschlechtes, der Teufel, Verwirrung anzurichten und seinen eigenen Samen auszustreuen in denen, die einfältigen Herzens und im Glauben an die hl. Dreifaltigkeit noch nicht hinlänglich befestigt sind. „Aber das Fundament Gottes steht fest“, wie die Schrift sagt, „und hat dieses Siegel: Es kennt der Herr die Seinen.” Die Häretiker aber, welche zu allem fähig sind, zeigen ihre Ruchlosigkeit auf andere Weise, nachdem sie aufgehört haben, Jesum zu lästern: „Sie erheben nämlich ihre Zungen gegen den Hl. Geist und sprechen Bosheit gegen den Erhabenen". Und doch: Mögen auch Tausende wankend werden, wir beharren durch die Gnade des Herrn auf dem gesunden Glauben und lassen uns kein Jota von der rechten und gesunden Lehre rauben. Ja viele, die sogar schon dem Irrtum verfallen schienen, haben sich mit der Gnade Gottes wieder zurechtgefunden dank der Briefe des preiswürdigen Bischofs Athanasius hochseligen Andenkens und deines frommen Amtsbruders Proklianus. Da aber noch da und dort sich Ableger der unheilvollen Lehre finden, so sollen sie von einem so wohlerfahrenen Gärtner, wie ihr seid, entweder auf den guten Ölbaum wieder aufgepfropft oder gleich ausgehauen werden. Deshalb wenden wir uns an deine Gottseligkeit mit der schriftlichen Bitte: Deine fromme Klugheit möge gütigst ein Schreiben an unsere Kirche ausarbeiten und darin eine ausführliche Darstellung des rechten und gesunden Glaubens geben, damit auch die Ununterrichteten und die im Glauben Schwankenden durch deinen heiligen Brief wieder bestärkt werden und damit der Feind der Kirche, der Teufel, durch dein heiliges Gebet zuschanden werde. Gott erhalte dich noch viele Jahre in Gesundheit! Gedenke unser in deinem Gebete!</p><h2>2</h2><p>BRIEFLICHE ANFRAGE des Palladius, Bürgers der nämlichen Stadt Suedra an ebendenselben Epiphanius, Bischof von Konstanzia auf Cypern, in der gleichen Angelegenheit.</p><p>Meinem verehrten Herrn, dem gottseligen Bischof Epiphanius entbietet Palladius, Bürger von Suedra, Gruß im Herrn.</p><p>Solange sanfter Wind das Schiff in seinem Kurs geradeaus treibt, kümmern sich diejenigen, welche das weite, breite Meer durchkreuzen wollen, nur wenig um die Häfen an den Gestaden, da sie glauben, mit leichter Mühe ihren Nachen über See zu bringen. Sobald aber eine widrige Bö in die Segel fährt, von allen Seiten die Wellenberge in die Höhe peitscht und das Schiff umbrandet, dann sehnen sie sich allerdings nach dem ruhigen Hafen und spähen das ganze in Sicht liegende Festland ab; können sie aber nirgends vor Anker gehen, so bleibt ihnen keine andere Wahl, als an einer zufällig vielleicht gerade nahen Insel zu landen, um sich zu retten, wie es eben geht. Nur indem sie auf diese zuhalten und sich unter den Schutz der vorgelagerten Klippen flüchten, können sie mit knapper Not dem ringsum drohenden Verderben entrinnen. So geht es auch uns, mein Herr, die wir, in der Heilslehre Gottes unterrichtet, das unruhige Meer des Weltgetriebes verlassen und unser Lebensschifflein in den sturmlosen Hafen Christi steuern möchten. Wir erfahren nämlich, wie gegenstandslose und, nach meinem Urteile wenigstens, unvernünftige Fragen über den Hl. Geist aufgeworfen werden von Leuten, die sagen, man dürfe ihn nicht zugleich mit der göttlichen Majestät verherrlichen, sondern er stehe auf der Stufe eines Dieners und Boten Gottes; ja sie verbreiten noch schlimmere und erniedrigendere Lehren über ihn. So sehen wir uns denn von ruhelosem Wogentanz und schwerer Brandung umtost, können aber in unserem Kreise keinen finden, der geeignet wäre, die aufgeworfenen Fragen zu lösen und die gesunde Lehre uns zu entwickeln, weshalb wir uns gezwungen fühlen, deiner Frömmigkeit die Sache vorzulegen, indem auch wir mit Fug jenen Hilferuf ausstoßen: „Meister, rette uns." Wir flehen also zu deiner über jeden Verdacht erhabenen Rechtgläubigkeit, welche vorab schon guter Ruf und vertrauenswürdige Zeugen bekunden und verkünden. Würdige dich, vom Heiland dazu berufen, unsere Bitte nicht ungut aufzunehmen und wolle in einem heiligen Brief in etwas breiter und gemeinverständlicher Ausführung den Glauben an die heilige Dreifaltigkeit darlegen und dies dann an uns senden zu dem Zwecke, daß wir, die wir darin befestigt sind, erlangen, was wir anstreben; daß ferner diejenigen, welche schon gut nach diesem Glauben wandeln, sich erfreuen, die Irrenden womöglich sich bekehren und Gott in allem verherrlicht werde.</p><h2>3</h2><p>BRIEF nach Pamphilien an den Kreis um den Priester Matidius, Tarsinus, Neon und Numerianus in Suedra und an den Bürger Palladius über den Glauben an den Vater, Sohn und Hl. Geist und über andere Glaubensartikel, so über die Auferstehung der Toten und die Menschwerdung Christi, geschrieben im neunzigsten Jahre Diokletians im Monat Juli, zu den Fragen, die sie in ihren Briefen stellten, wie sie vorstehend wiedergegeben sind.</p><p>Den Herren, meinen hochgeehrten Brüdern, den Presbytern Matidius, Tarsinus und Numerianus und den andern allen bei euch, sowie meinen vielgeliebten Söhnen Palladius und Severianus, die den rechten Eifer pflegen und das glückselige, aller Sehnsucht werte Leben sich erwählt haben, [ein Leben] im rechten Glauben und in vollkommener [innerer] Harmonie, ihnen, die das Wort des Herrn erfüllen: „Wenn du vollkommen sein willst, so verkaufe, was du hast, und gib es den Armen„, und das andere: „Sie verkauften das Ihrige und legten es zu Füßen der Apostel nieder“, die endlich, was nur immer nutzt und frommt, für ihre Seelen erwerben, — [ihnen] entbieten ich, Epiphanius, der geringste unter den Bischöfen, und meine Brüder Gruß in Gott dem Herrn!</p><p>Wohl möchte ich mich glücklich preisen, Geliebteste, daß wir, obwohl wir nicht hinanreichen an die tugendhafte Lebensführung heiliger und tüchtiger, vom Eifer für Gott ergriffener Männer, doch gerade von solchen eines Anspornes gewürdiget werden, uns aufzuraffen und für die gute Sache einzutreten. Denn mein schüchterner Sinn, der die Ruhe pflegen und sich nicht mehr anstrengen will als diejenigen, welche allzusehr auf jenes Apostelwort hinschauen: „Damit ich mich nicht überhebe über jenes Regelmaß, welches uns Gott gegeben hat", muß jetzt doch darangehen. Denn die von allen Seiten mich einladenden Stimmen sowohl eures gottentstammten Eifers als auch der anderen Gleichgesinnten, ich meine derer, die für den rechten Glauben eifern, sowie meines Sohnes Hypatius, der deshalb bis vom Ägypterlande zu mir gereist ist, haben mich bewo-gen, alle Gleichgültigkeit und alles Zögern abzulegen, so daß ich nicht mehr zurückhalten noch etwas für wichtiger halten kann, als diesen Brief über den Glauben zu schreiben. Fraget ja ihr und unsere Brüder an in Sachen eures Heiles, nach dem aus der göttlichen und heiligen Schrift sich ergebenden festen Fundament des Glaubens an den Vater, den Sohn und den Hl. Geist und des übrigen ganzen Heilsgutes in Christo, nämlich der Auferstehung der Toten, der Menschwerdung des Eingeborenen, des Alten wie des Neuen Testamentes, mit einem Worte: der anderen Elemente des vollen Heiles. Da nun ein solcher Fragebogen, auf dem wahrlich nicht wenig steht, an mich gekommen ist, von dem Kreise und der Gemeinde unseres Mitpriesters Konops, von anderen von euren Ehrwürden, liebe Kinder, nicht zu vergessen meinen Sohn Hypatius, der von Ägypten deswegen zu mir gekommen ist, — so packte das meinen ganzen inneren Menschen, als ich so viele gleichlautende Stimmen vereinigt sah, und ich ging mit mir zu Rate; und ich hielt es für angezeigt, bereitwillig auf eure briefliche Bitte einzugehen und ohne Umschweife trotz meiner Unzulänglichkeit für eure Wünsche diesen Brief zu schreiben.</p><p>Voller Ehrfurcht bewundere ich die Vorsehung unseres Herrn und Gottes, dem es in der Überfülle seiner Güte gefallen hat, in allem seinen Hl. Geist denen zu geben, die ihn in Wahrheit suchen. Denn nicht von ungefähr, glaube ich, sind eure und der Eurigen Bittbriefe, Geliebteste, sondern ich bildete mir das Urteil, daß jene Anregung durch göttliche Gnade entstanden. In Wahrheit werden ja auch diejenigen, die, ein Herz und Mund mit dem seligsten Petrus, bekennen: „Du bist der Christus, der Sohn des lebendigen Gottes“, klar vom Herrn selbst selig gepriesen werden, wie ja auch jener Heilige selig gepriesen wurde und hören durfte: „Selig bist du Simon”, Bar Jona, d. h. Sohn des Jonas, — denn sein Vater hieß Jonas, und das hebräische Bar bedeutet Sohn —. Und dies war das Leben, welches der eingeborene Sohn seinen Jüngern gab, wenn er sagte: „Damit sie das Leben in sich haben, zu erkennen den einen wahren Gott und den er gesandt hat, Jesum Christum“. Indem er sagte: den einen wahren Gott, führte er uns hin zu dem Dienste des Einen, damit wir nicht mehr den Elementen der Welt dienstbar seien, auf daß nicht mehr Vielgötterei unter uns herrsche und der Menschen Sinn mit solchem Sündenglauben buhle, sondern zur Einheit des allein wahren Gottes sich kehre. „Denn der Anfang der Hurerei”, sagt die Schrift, „ist das Ersinnen von Götzen“. „Und den du gesandt hast, Jesum Christum.” Wen [meint er mit] Jesum Christum? Den wahren Gott. Wenn aber den Gott Christus Jesus, [so meint er ihn,] wie Johannes über ihn sagt: „Der Eingeborene, der im Schoße des Vaters ist, er hat es uns erzählt". Ein Gott ist also der Vater und der allein wahre Gott, und zwar nicht nach Art der erlogenen Götter, welche einige der Hellenen für Götter hielten, während sie doch keine Götter sind, sondern der allein wahre Gott, da der eine Sohn des einen Vaters ist der Eingeborene und einer der eine Hl. Geist. Denn die Dreiheit ist in der Einheit, und e i n Gott ist Vater, Sohn und Hl. Geist.</p><p>Es beunruhigt aber dies Wort diejenigen, die nicht des Hl. Geistes gewürdigt wurden: „Es kann niemand sagen: Herr Jesus, außer im Hl. Geiste“. Allerdings sprechen den Namen Jesus auch die Juden aus, aber sie halten ihn nicht für den Herrn. Auch die Arianer sprechen den Namen aus und nennen ihn angenommenen Gott, nicht wahren Gott, da sie des Hl. Geistes nicht teilhaft wurden. Denn wenn einer den Hl. Geist nicht empfangen hat, so nennt er Jesus nicht wirklich Herrn und wirklich Gott und wirklich Sohn Gottes und wirklich ewigen König. Es mögen denn jene, welche diese schlimme Meinung hegen, wissen, daß der eingeborene Sohn Gottes in allweg nicht über sich selbst zeugen will. Denn so sprach er im Evangelium: „Wenn ich über mich selbst zeuge, so ist mein Zeugnis nichts. Ein anderer ist’s, der Zeugnis gibt von mir”. Und wer ist der andere? Der vom Himmel rief: „Dies ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe“. Er aber, der sagt: „Wenn ich über mich zeuge, so ist mein Zeugnis nichts”, sagt hinwiederum: „Und wenn ich über mich zeuge, so ist mein Zeugnis wahr“. Und wiederum: „Die Werke selbst, die mir der Vater gegeben hat, legen Zeugnis ab”, Und wiederum: „Moses schrieb von mir“, und: „Moses zeugt über mich”. Fürs erste [sagt er]: „Wenn ich über mich selbst zeuge, so ist mein Zeugnis nichts“, weil doch viele sich selbst rühmen und Zeugnis über sich ablegen, um abzuschneiden die Prahlerei der Prahler und derer, die sich selbst anempfehlen. Wenn er fürs andere sagt: „Und wenn ich über mich zeuge, so ist mein Zeugnis wahr”, so zeigt er, daß sein Zeugnis nicht menschlich ist, sondern daß Gott es ist, der durch sein Zeugnis die Wahrheit sagt. Wahrer Gott ist also der Vater, wahrer Gott der Sohn, wahrer Gott der Hl. Geist, der Geist Gottes und der Geist der Wahrheit, eine Dreiheit, die in einem Namen zusammengefaßt wird. Denn vom Vater spricht der Sohn selbst: „Damit sie dich als den allein wahren Gott erkennen“. Der ihn aber den eingeborenen Gott nennt, ist ein glaubwürdiger Zeuge, da er ja „an seiner Brust lag”. Dem eingeborenen Gott gab er aber nicht die weitere Bezeichnung: wahrer Gott, sondern vom Vater steht geschrieben als dem wahren Gott, vom Sohne aber, daß er der eingeborene Sohn ist. Das hinwiederum gilt vom Vater: „Gott ist das Licht“, vom Sohne aber, „er war das wahre Licht”.</p><p>Nun habe mir acht auf den genauen Sinn der Hl. Schrift. Es ist ja der Vater das Licht, und doch ist der Aussage über ihn nicht hinzugefügt: das wahre Licht: bei seiner Aussage über den Sohn aber sagt er: wahres Licht, und niemand wagt es, anders zu sagen. Denn wer ist so tollkühn oder besser gesagt, wer wollte eine solche Narrheit sich zuschulden kommen lassen, daß er es wagen würde, den Verdacht der Blasphemie auf sich zu laden, weil er bei dem Gesagten den Zusatz: „das wahre" nicht findet. Denn wenn der von ihm gezeugte wahre Sohn das „wahre" Licht ist, so ist zweifellos der Erzeuger des Sohnes auch das wahre Licht, er, den denselben ohne Anfang und außerhalb aller Zeit als das wahre Licht zeugte. Und wie man es bezüglich des Vaters nicht wagen darf zu behaupten, daß er nicht das „wahre" Licht sei, sondern wie von selbst das religiöse Denken es uns sagt, wenn es auch nicht geschrieben steht, daß er das wahre Licht ist, und wie wir daran nicht zweifeln, um nicht verloren zu gehen, so verhält es sich auch mit der Schriftstelle über den Sohn: „Der Sohn ist Gott“, — und auch wenn nicht hinzugefügt ist die Bestimmung „der wahre Gott”, so würden wir doch das Zeugnis des Wahnsinns uns ausstellen, wenn wir es wagen sollten, zu lästern und nicht zu sagen, der Sohn sei wahrer Gott. Denn es genügt, all das, was die Dreiheit eint, von dem Einen [= der einzelnen Person] auszusagen und vom Vater aus zu erschließen den Sohn als wahren Gott, als wahren auch den Hl. Geist, indem für beide Namen das gleiche Attribut der Wahrheit wechselseitig gegeben ist, für den Vater die Bezeichnung wahrer Gott, für den Sohn die Bezeichnung Gott, hinwiederum für den Sohn: „das wahre Licht“, für den Vater: „das Licht”, damit wir beide Aussagen über die Gottheit verbindend, über den Vater nämlich: „wahrer Gott“, über den Sohn: „wahres Licht”, und über den Vater: „das Licht“, über den Sohn: „Gott”, auf Grund der Ausdrücke „Licht und Gott" die eine Gottheit und auf Grund der Wendungen: „wahrer Gott und wahres Licht" die eine Einheit der Wirksamkeit bekennen.</p><p>Ähnliche Aussprüche finden sich auch über den Hl. Geist. „Wenn ich weggegangen sein werde„, spricht Christus, „kommt jener Geist der Wahrheit“, und von sich selbst sagt er: „Ich bin die Wahrheit„, und vom Vater: „Der Geist meines Vaters ist’s, der in euch spricht“, und wiederum vom Geiste: „Mein Geist steht in eurer Mitte„, Eben dieser Geist, der auf unerklärliche Weise mit dem Sohne wirkt, führt ihn auch in die Wüste, damit er vom Teufel versuchet würde. Der Herr selbst sagt von ihm: „Der Geist Gottes kam über mich, deshalb salbte er mich“. Allerdings spricht der Hl. Geist durch die Propheten: „Dies sagt der Herr, der Allmächtige, der Herr, der in den Propheten spricht, der den Donner befestigt und den Geist [Wind] erschafft„; aber offenbar ist die Rede von dem Donner, dessen Rollen die Menschen hören, und von der Erschaffung des Geistes [Windes] zur Hervorbringung der Regen, welche von Gott auf die Erde geschickt werden. Von Kreaturen spricht er also in den Worten: „Der den Donner befestigt und den Geist [Wind] erschafft“; denn diese sind geschaffen worden. Wo er aber, der Vater, seinen Gesalbten den Menschen ankündigt, da ist er nicht mehr der Schaffende, nicht mehr der Befestigende, sondern [einfach] derjenige, der ihn verkündigt den Menschen, den wahrhaft aus ihm Gezeugten, den Ungeschaffenen, den Unwandelbaren, den Unveränderlichen, den ewigen Sohn des ewigen Vaters, ihn, den Johannes als den Ewigen verkündet hat. Denn: „Der da ist„, sagt er, „hat mich gesandt“, wie Moses sagt. Und Johannes: „Der im Schöße des Vaters ist, der hat es erzählt„. Der Seiende ist der Sohn, der Seiende ist der Vater, der Seiende bei dem Seienden, aus ihm gezeugt, nicht als eine Vermischung mit dem Vater, ohne einen Anfang des Seins, ewig der Ebenbürtige beim Vater, ewig der Vater der Erzeuger des Sohnes. Denn es gab nie eine Zeit, wo der Vater nicht Vater gewesen wäre, es gab nie eine Zeit, wo dem einen Vater kein Sohn gewesen wäre. Denn wenn es eine Zeit gäbe, wo er nicht Vater war, so war er selbst folgerichtig der Sohn eines anderen Vaters, ehe er der Vater des Eingeborenen ward. Und so verunehren erst recht den Vater, die ihn zu ehren meinen. Denn in Gott hat keine Zeit statt, kein Termin, kein Zeitpunkt, nicht der kleinste Bruchteil einer Stunde, kein Augenblick, kein Gedankenblitz, sondern soweit auch dein Denken vorschreitet, um den Sohn im Glauben zu erfassen, denke zugleich auch den Vater. Der Name [Sohn und Vater] ist dafür bezeichnend. So oft du nämlich den Sohn nennst, denke bei dem Worte Sohn an den Vater. Denn aus dem Begriff des Sohnes folgt der andere des Vaters. Und wenn du „Vater“ sagst, bezeichnest du [auch] den Sohn. Denn nur wegen des Sohnes sagt man Vater.</p><p>Wann also wirst du es wagen und sagen, daß der Vater nicht Vater war, um die Behauptung zu wagen, daß auch der Sohn nicht [Sohn] war? Wenn du es aber nicht wagst, einen Zuwachs an Würde dem Vater beizulegen — denn das Göttliche bleibt immer dasselbe und bedarf keiner Zugabe, keiner Verherrlichung, keines Fortschrittes —, so verlerne nun das Lästern, o Feind des Glaubens, der du vielmehr von Glaubens wegen dein eigener Verfolger bist, und glaube, daß der Vater ewig den wahrhaft ewigen Sohn gezeugt hat, den ewig wahrhaft seienden, bei dem wahrhaft seienden Vater. Denn der Sohn ist ewig, nicht in Vermischung mit dem Vater, nicht als sein Mitbruder, sondern als wirklicher vom Vater gezeugter Sohn, als natürlicher, nicht als angenommener Sohn. Der Sohn ist gleichwesentlich mit dem Vater, nicht wesensverwandt, sondern gleichwesentlich, d. h. nicht außer dem Vater gezeugt, wie einige vorgeben, indem sie ihn zum angenommenen, nicht wahrhaften Sohn machen wollen. Das „Homousios„ aber ist das Band [Schiboleth] des Glaubens. Denn wenn du den Ausdruck „gleichwesentlich“ gebrauchst, so hast du den Sabellius ins Herz getroffen. Denn wo es einmal heißt: „gleichwesentlich„, da zeigt es offenbar nur e i n e Hypostase an. Aber es bedeutet auch, daß in dieser Hypostase sei der Vater, in dieser Hypostase der Sohn, in dieser Hypostase der Hl. Geist. Wenn man ferner von „gleichwesentlich“ redet, so bezeichnet man damit nichts von eben derselben Gottheit Verschiedenes, sondern Gott von Gott, den Sohn, und Gott von eben derselben Gottheit, den Hl. Geist, nicht drei Götter. Denn auch wenn wir den Sohn und den Vater Gott nennen, so bekennen wir nicht zwei Götter. Denn einer ist unser Gott, wie der selige Moses sagt: „Der Herr, dein Gott, ist ein Herr". Nicht Götter nennen wir, sondern Gott den Vater, Gott den Sohn, Gott den Hl. Geist, und nicht Götter. Denn es ist auch keine Vielheit von Göttern in Gott. Durch die drei Namen wird die eine Gottheit bezeichnet, des Vaters, Sohnes und Hl. Geistes, und nicht zwei Söhne. Denn der eine Sohn ist der eingeborene. Der Hl. Geist [ist] der Geist der Heiligkeit, der Geist Gottes, der allezeit beim Vater und Sohn ist, nicht verschieden von Gott, sondern aus Gott seiend, vom Vater ausgehend und vom Sohne nehmend. Aber der eingeborene Sohn ist unbegreiflich, unbegreiflich ist auch der Geist, aus Gott, nicht verschieden von Vater und Sohn. Er ist auch nicht die Vermischung von Vater und Sohn, sondern es ist ewig eine Dreiheit eines und desselben Wesens. Die Wesenheit ist nichts anderes neben der Gottheit, noch auch etwas anderes die Gottheit neben der Wesenheit, sondern es ist eben dieselbe Gottheit und aus eben derselben Gottheit der Sohn und der Hl. Geist.</p><p>Der Geist also ist Heiliger Geist, der Sohn aber Sohn. „Der Geist geht vom Vater aus und nimmt vom Sohne„ und „erforschet die Tiefen Gottes“; der Geist verkündet, was er vom Sohne vernommen, heiliget in der Welt die Heiligen durch die Dreifaltigkeit, der dritte in der Benennung: der Vater, der Sohn und der Hl. Geist. „Gehet hin„, heißt es, „taufet im Namen des Vaters und des Sohnes und des Hl. Geistes“. So ist er das Siegel der Gnade, das Band der Dreifaltigkeit, nicht etwas [davon] numerisch Verschiedenes, nicht auf anderer Rangstufe zu nennen, nicht unbeteiligt an der Gnadengabe, sondern es ist ein Gott, ein Glaube, ein Herr, eine Gnade, eine Kirche, eine Taufe. Immer ist die Dreifaltigkeit Dreifaltigkeit. Nie empfängt sie einen Zuwachs, indem man sie also aufzählt: Vater, Sohn und Hl. Geist. Die Dreifaltigkeit ist nichts durch Verschmelzung Entstandenes, noch ist in ihr etwas von der eigenen Einheit Verschiedenes. In vollkommener Subsistenz, vollkommen der Vater, vollkommen der Sohn, vollkommen der Hl. Geist. Der Geist wiederum erscheint aber auch unter den Gnadengaben. Denn „es sind Verteilungen der Gnadengaben, doch ist es derselbe Geist, und Verteilungen der Dienste gibt es, aber es ist derselbe Herr, und Verteilungen der Wirkungsweisen gibt es, aber es ist derselbe Gott, der wirket alles in allem„. Von dieser Vorlage wollen wir nicht abweichen, von der Wahrheit nicht abfallen. Es ist nicht an dem, daß wir uns als Gottes Anwalt aufspielen wollten, vielmehr denken wir gottesfürchtig, damit wir nicht zugrunde gehen; und wir sprechen so, nicht als ob wir Gott begreifen oder fassen könnten; als Menschen sprechen wir ja aus, was wir erfahren haben. Die göttliche Majestät ist ja unendlich, tausendmal über alle unsere Begriffe hinaus verherrlicht, und sie bleibt verherrlicht, indem sie weder einen Zuwachs an Ehre empfangen kann noch eine Verminderung. Nichts ist in der Dreifaltigkeit geschaffen oder erst nachher in ihr entstanden. Der Vater zeugt den Sohn. Es war aber nie eine Zeit, in der der Sohn nicht gewesen wäre; denn wann wäre der Vater nicht Vater zu nennen? Es war also immer der Vater und es war immer der Sohn, nicht als Mitbruder, sondern als Sohn, gezeugt in geheimnisvoller, so genannt in unbegreiflicher Weise, ewig mit dem Vater und nie aufhörend zu sein. Der Vater ist ungezeugt und ungeschaffen und unbegreiflich, der Sohn gezeugt, aber auch ungeschaffen und unbegreiflich, der Hl. Geist ewig, nicht gezeugt, nicht geschaffen, nicht Mitbruder, nicht Vatersbruder, nicht Großvater, nicht Enkel, sondern aus demselben Wesen des Vaters und Sohnes, der Hl. Geist. Denn”Gott ist ein Geist“.</p><p>Jeder dieser Namen ist eindeutig und läßt keine weitere Bedeutung zu. Denn der Vater ist Vater und hat nichts, was ihm gegenübergestellt werden könnte oder was ihn mit einem anderen Vater auf eine Stufe stellt, damit nicht etwa zwei Götter seien. Und der Sohn ist der Eingeborene, wahrer Gott vom wahren Gott; er hat nicht den Namen des Vaters, ist auch nichts Verschiedenes vom Vater, sondern der Sohn des einen Vaters. Er ist der Eingeborene, damit er allein den Namen Sohn habe, und Gott aus Gott, e i n Gott Vater und Sohn genannt werde. Auch der Hl. Geist ist eingeboren; er hat nicht den Namen Sohn, nicht des Vaters Benennung, sondern Hl. Geist, so heißt er, ohne etwas vom Vater Verschiedenes zu sein. Denn der Eingeborene selbst sagt: „Der Geist des Vaters“, und: „Der vom Vater ausgeht und vom Meinen nehmen wird”, damit man nicht glaube, der Hl. Geist sei etwas vom Vater oder Sohn Verschiedenes, sondern von derselben Wesenheit, derselben Gottheit, göttlicher Geist, der Geist der Wahrheit, der Geist Gottes, der Tröstergeist; er allein trägt diesen Namen, er hat nicht seinesgleichen, er wird auch keinem anderen Geiste gleichgehalten, nicht mit dem Namen des Sohnes genannt oder mit der Benennung des Vaters benannt, damit nicht der Eigenname Gattungsname werde; nur der Begriff Gott liegt gemeinsam sowohl in der Bezeichnung Vater als auch Sohn und Hl. Geist, die Beziehung: Gottes und der Begriff: Gott. Denn der Geist Gottes ist der Geist des Vaters und Geist des Sohnes nicht nach Art einer Zusammensetzung, wie in uns Leib und Seele [verbunden] sind, sondern inmitten des Vaters und Sohnes, aus dem Vater und Sohn [hervorgehend, der dritte der Benennung nach. Darum heißt es auch: „Gehet hin, taufet auf den Namen des Vaters und des Sohnes und des Heiligen Geistes!“. Wenn aber der Vater auf seinen Namen tauft als auf den Namen Gottes und so das Siegel im Namen Gottes vollständig in uns besiegelt ist, und wenn Christus auf seinen Namen tauft als auf den Namen Gottes, und wenn jenes Siegel vollkommen ist, indem wir im Namen Gottes besiegelt werden: wer wird da gegen seine eigene Seele freveln und sagen, daß der Geist etwas Verschiedenes von der Gottheit sei? Denn wenn auf den Namen des Vaters und auf den Namen des Sohnes und auf den Namen des Hl. Geistes doch das Siegel der Dreiheit nur eines ist, so ist auch die Macht der Gottheit in der Dreiheit nur eine. Wenn nun dieses eine Gott ist, das andere aber erschaffen und daher nicht Gott, wie könnten die zwei [Sohn und Geist, wenn sie nicht Gott wären] zu dem einen verbunden sein in dem Siegel der Vollendung? Wir sind also nur auf den einen königlichen Namen des Vaters besiegelt worden, und alles andere ist nicht königlich, sondern”wir dienen noch den Elementen und den Geschöpfen". Es sollte nämlich, das ist die Meinung der Irrlehrer, des Vaters Name allein uns nicht haben retten können und er sich daher zwei andere Elemente geschaffen haben, auf daß seine Gottheit noch einen Zuwachs an Macht erhalte und den von ihm Versiegelten retten könne und der von ihm geschaffene Mensch Nachlassung der Sünden und Erlösung erlange.</p><p>Wehe über diesen Irrtum, o diese Blasphemie! Woher ist denn wieder ins Leben getreten dieser neue Unglaube, oder wie ich lieber sagen möchte, dieser Falschglaube. Denn schlimmer ist der Falschglaube als der Unglaube. Wer nichts glaubt, braucht nur den Glauben anzunehmen, um bekehrt zu sein, wer aber einen falschen Glauben hat, ist unbekehrbar, schwer zu retten, wenn nicht irgendwie die Gnade von oben ihn heimsucht. Auch der hl.Petrus sagt zu Ananias: „Warum hat euch der Satan versucht, dem Hl. Geist zu lügen?„ Und er fügt hinzu: „Du hast nicht Menschen gelogen, sondern Gott“. Also ist Gott aus dem Vater und Sohn der Geist, welchem logen diejenigen, die vom Kaufpreis etwas unterschlugen, — wie ja auch Paulus mit diesem Wort übereinstimmt, wenn er sagt: „Ihr seid ein Tempel Gottes, und der Geist Gottes wohnt in euch„. Also ist der Geist, wie schon bemerkt, Gott. Denn deswegen werden jene heiligen Menschen, in welchen der Hl. Geist wohnt, ein Tempel Gottes genannt. So bezeugt es uns der Fürst der Apostel, welcher gewürdigt wurde, vom Herrn selig gepriesen zu werden, „weil ihm der Vater geoffenbart hat“. Ihm hat ja der Vater den wahren Sohn geoffenbart, und er wird deshalb selig gepriesen, den Hl. Geist aber offenbart er selbst. So geziemte es sich ja für den ersten der Apostel, den festen Fels, „auf welchem die Kirche Gottes erbaut ist, und gegen den die Pforten der Hölle nichts vermögen„. Unter den Pforten der Hölle sind aber die Häresien und die Häresiarchen zu verstehen. Denn allerweise ist in ihm der Glaube gesichert worden, der die Schlüssel des Himmelreiches erhielt und der auf Erden löset und im Himmel bindet. In ihm kann man all die subtilen Fragen über unseren Glauben [dargestellt] finden. Er ist es, der dreimal verleugnet hat und dreimal sich verflucht hat, ehe der Hahn krähte. Denn um seine überfließende Liebe zum Herrn zu zeigen, hatte er mit Zuversicht beteuert: „Wenn auch alle dich verleugnen sollten, so werde ich dich nicht verleugnen“, und hiermit bekannte er ihn als wahren Menschen. Petrus ist es ferner, der auf den Ruf des Hahnes weinte, um so anzudeuten und zu bekennen, daß der Sohn Gottes nicht etwa nur zum Scheine, sondern wirklich gefangen genommen worden sei, und ihn so, indem er über seinen Verrat und die Gefangennehmung des Herrn weinte, als wahren Menschen bekenne. Petrus war auch der Genosse dessen, „welcher an der Brust des Herrn lag„. Dieser lernte vom Sohne und erhielt von ihm die Tiefe der Erkenntnis und offenbarte sie. Jenem aber gab es der Vater ein, als er die Festigkeit des Glaubens grundlegte [durch sein Felsenbekenntnis]. Petrus ist es auch, welcher nach seiner Berufung im Schiffe auf dem See Tiberias leicht geschürzt fischte, und zu welchem der Jünger, den Jesus lieb hatte, auf das Wort des Erlösers: „Kinder, habt ihr nichts zu essen?“ und: „Werfet zur Rechten eure Netze aus, und ihr werdet fangen„, als alle über diese Worte staunten, sagte: „Der Herr ist es“; Mensch zwar nach dem Fleische von Maria, geboren in Wahrheit und nicht nur dem Fleische nach, zugleich aber auch Gott und Geist aus dem Himmel vom Vater gekommen. Petrus ist es, der vom Herrn vernahm: „Petrus, weide meine Lämmer!„, welchem die Herde anvertraut worden ist, der sie in der Kraft Gottes selbst gut leitet, welcher die Menschheit Christi bekannte, welcher in Wahrheit über den Sohn mitteilt, was er vom Vater empfangen, welcher den Hl. Geist bezeichnet und seine Würde in der Gottheit, welcher dem Paulus und dem Barnabas zugleich mit Jakobus und Johannes die Rechte reichte zum Zeichen der Gemeinschaft, „auf daß durch drei Zeugen jedes Wort bestehe“.</p><p>Nichts kann ohne zwei oder drei Zeugen fest bestehen. Auf sie wurde in verschleierter Weise schon bei denen unter dem Gesetze der Glaube gegründet, obwohl sie doch nur den Vater erkannten, wenn sie nicht etwa auch noch die Kraft des Sohnes annahmen und so das Zeugnis des Vaters und Sohnes zur Bekräftigung hatten, als drittes Zeugnis aber vollends den Hl. Geist annahmen, da die Stimmen der Cherubim und Seraphim deutlich dreimal rufen: „Heilig, heilig, heilig!“ Denn die Lobpreisung im Himmel besteht nicht etwa nur in einem zweifachen Rufe; ebensowenig rufen die heiligen, unsichtbaren himmlischen Geistwesen viermal eben dieses „Heilig”, oder etwa nur einmal, sondern sie sprechen drei einzelne Worte: „Heilig, heilig, heilig!" Sie sagen aber nicht: die Heiligen, die Heiligen, um die Einheit als vielnamig zu bezeichnen und doch nicht eine Dreizahl zu offenbaren; sie wiederholen dreimal den Heiligruf und sprechen in der Einzahl und immer dasselbe Wort, damit sie nicht viele Götter auszudrücken scheinen. Denn ein Gott ist der Vater im Sohne, der Sohn im Vater zugleich mit dem Hl. Geiste, Und daher ist heilig unter Heiligen thronend der Vater wahrhaft als eine Person, der Sohn wahrhaft als eine Person, und der Hl. Geist wahrhaft als eine Person, drei Seiende, eine Gottheit, eine Wesenheit, eine Verherrlichung, ein Gott. Hast du den Namen „Vater" ausgesprochen? In Gedanken hast du mit inbegriffen die Dreifaltigkeit. Empfingst du den Hl. Geist? So bist du auch gewürdigt worden der Kraft des Vaters und des Sohnes Gottes. Du hast den Vater gepriesen? Damit hast du auch getroffen den Sohn und den Hl. Geist, aber nicht etwa auf Grund einer Vermischung. Denn der Vater ist und bleibt Vater, der Sohn ist und bleibt Sohn, der Hl. Geist ist und bleibt Hl. Geist. Und es ist die Dreiheit von der Einheit und Dieselbigkeit nicht getrennt. Es wird geehrt der Vater, insoferne er Vater ist; es wird geehrt der Sohn, insoferne er Sohn ist; es wird geehrt der Hl. Geist, insoferne er der wahrhafte Geist und Gottes Geist ist. — So spricht [aber] der Eingeborene: „Wer den Vater ehrt, ehrt auch den Sohn". Denn schon dadurch, daß du vom Vater redest, bezeichnest du auch den Sohn und ehrst den Sohn. Und wer den Sohn ehrt, ehrt auch den Vater. Denn schon dadurch, daß du den Sohn nennst, ehrst du den Vater, indem du sagst, Christus sei nicht geringer als der Vater.</p><p>Denn, wenn [schon] unter uns Menschen diese Denkweise herrscht und wir die Söhne nicht niedriger haben wollen und zurückstehend hinter der Ehre der Eltern — denn die die Söhne treffende Unehre geht auf die Väter zurück —, um wieviel mehr wird der Gott und Vater nicht wollen, daß sein Sohn ihm nachstehe? Wer also annimmt, daß der wahrhafte Sohn des Vaters der Herrlichkeit des Vaters ermangle, der entehrt ihn [den Vater] vielmehr, statt ihn zu ehren, befangen in Unwissenheit. Wie er [der Sohn] aber den Vater offenbart in den Worten: „Niemand kennt den Vater außer der Sohn und niemand kennt den Sohn außer der Vater“2], so wage ich zu sagen: auch den Geist kennt niemand außer der Vater und der Sohn, von dem er ausgeht und von dem er es nimmt. Wie aber können sie es wagen, den Geist etwas vom Vater Verschiedenes zu nennen, sie, die mehr von Verblendung sich leiten lassen als von der Wahrheit, warum fassen sie nicht auf das wahre Wort des glaubwürdigen hl. Paulus, des Apostels, dem der Apostelfürst die Rechte gab, der gewürdigt wurde, die Schlüssel des Reiches zu erhalten, Paulus der vom Himmel hörte: „Saul, Saul, warum verfolgst du mich?”, der gewürdigt wurde „unaussprechliche Worte zu hören, die einem Menschen auszusprechen nicht erlaubt sind“, der sagt: „Niemand weiß, was des Menschen ist, als nur der Geist des Menschen, der in ihm wohnt”, indem er an dem Beispiele das Himmlische erklären wollte, nicht um das menschliche Beispiel an Gott anzugleichen, sondern um durch das Beispiel einen Teil des Himmlischen aufzuhellen? Denn die ganze Schöpfung zusammengenommen, die Engel und die Erzengel, die Cherubim und Seraphim mit dem ganzen himmlischen Heere, Himmel und Erde, Irdisches und Überirdisches und Unterirdisches, Gestirne und Sterne, das Trockene und das Feuchte, kurz alles, was im Himmel und auf Erden ist, kann den Herrn nicht darstellen und nicht abbilden das Urbild des Herrschers. Dem Menschep verleiht Gott gnadenweise sein Bild, indem es in der Schrift heißt’ “Gott machte den Menschen, nach seinem Bilde machte er ihn”. Durch besondere Gnade also hat jeder Mensch das Bild Gottes. Niemand aber kann sich mit seinem Herrn gleichstellen. Denn das Abbild ist sichtbar, das Urbild unsichtbar; dieses unsterblich, jenes sterblich; dieses die Quelle jeglicher Weisheit und alle Vollkommenheiten in sich vereinigend; der Mensch aber, der diese Gnade Gottes nur zum Teil hat, ermangelt jener Vollkommenheit, wenn nicht Gott je nach Würdigkeit denen, die es soweit bringen, das Gnadengeschenk der Vollkommenheit verleihen will.</p><p>Dennoch gebraucht derselbe hl. Apostel den Vergleich und sagt: „Kein Mensch weiß, was des Menschen ist, außer der Geist des Menschen, der in ihm wohnt; so hat auch niemand erkannt, was Gottes ist.„ Und er sagt nicht: außer der Geist Gottes, der in ihm wohnt, sondern nur: [außer] „der Geist Gottes“; damit sich nicht einer das Göttliche zusammengesetzt oder aus Teilen bestehend denke, so sagt er nur: außer der Geist Gottes. Denn „der Geist Gottes erforscht alles, auch die Tiefen der Gottheit„. Nicht verschieden ist also von Gott der Geist Gottes, der die Tiefen erforscht. Denn wenn uns die göttliche Schrift tadelt mit den Worten: „Was dir aufgetragen wurde, das bedenke, und das Verborgene geht dich nichts an, und Höheres als du suche nicht, und Tieferes als du wolle nicht erforsehen“, werden wir dann wohl auch vom Hl, Geiste sagen, daß er mehr aus Neugier und nicht vielmehr naturgemäß die Tiefen der Gottheit erforscht? Wo erforscht er denn die Tiefen der Gottheit? Aus welcher Ursache? Sprich, o Tor! Etwa, weil er neugierig ist? weil er sich um fremde Dinge kümmert? weil sein Sinn nicht nach dem Eigenen steht? Das sei ferne! Sondern nachdem einmal die Heiligen die Gnade haben, daß der Hl. Geist in ihnen wohnt, so gibt er ihnen, sobald er seine Wohnung in den Heiligen aufgeschlagen hat, das Charisma, die Tiefen der Gottheit zu erforschen, damit sie ihn aus der Tiefe preisen, wie auch David dies bekennt: „Aus den Tiefen„, sagt er, „rief ich zu dir, o Herr“. Und dies geschieht unermeßlich, nicht so gering und unvollkommen, wie die Arianer und alle Sekten [meinen]. Und es sind, seitdem das Gesetz durch Moses gegeben wurde, der Häresien, die sich nach ihm abgetrennt haben, elf bis zur Ankunft Christi im Fleische, und nach der Erscheinung Christi im Fleische weitere sechzig, dazu kommen die fünf vor dem Gesetze und vor allen den genannten, ferner die anderen vier hellenischen Häresien, macht neun vor dem Gesetze. Zusammen aber erreichen alle mit ihren Müttern die Zahl achtzig. Mütter sind fünf in folgender Ordnung: Der Barbarismus, Skythismus, Hellenismus, Judaismus, Samaritismus. Davon gebar der Plellenismus vier Häresien, nämlich die der Pythagoreer, Platoniker, Stoiker, Epikureer. Aus dem Gesetze entstammten vor der Menschwerdung Christi elf; sieben nämlich aus dem Judaismus: die Schriftgelehrten, die Pharisäer, die Sadduzäer, die Essäer, die Nasaräer, die Hemerobaptisten, die Herodianer; vier aus dem Samaritismus: die Gorothener, Sebuäer, Essener, Dositheer. Macht zusammen unter dem Gesetze aus den Juden und Samaritern elf.</p><p>Vor der Erscheinung Christi im Fleische, von Adam bis Christus, gab es zwanzig Häresien; nach der Menschwerdung Christi aber bis zur Regierung des Valentinianus, Valens und Gratianus zählt man sechzig Ketzereien, welche sich fälschlich den Namen Christi beilegten. Sie ordnen sich wie folgt: Die Simonianer, die Menandriner, die Satorniler, die Basilidianer, die Nikolaiten, die Gnostiker, auch Stratiotiker oder Phibioniten, nach einigen auch Sekundianiten, nach anderen Sokratiten, Zakchäer und Koddianer, auch Borboriten genannt; die Karpokratiten, die Korinthianer, auch Merinthianer, die Nazoräer, die Ebionäer, die Valentiner, die Sekundianer, mit denen zu verbinden ist Epiphanius und Isidor, die Ptolemäoniten, die Markosier, die Kolorbasier, die Herakleoniten, die Ophiten, die Kaianer, die Sethianer, die Archontiker, die Kerdonianer, die Markionisten, die Lukianisten, die Apelleianer, die Severianer, die Tatianer, die Enkratiten, die Kataphryger, welche auch Montanisten und Taskodrugiten heißen; die Pepuzianer, welche auch Priszillianer und Quintillianer heißen. Diesen werden beigezählt die Artotyriten, die Quartodezimaner, welche Ostern an einem fixierten Tage des Jahres feiern, die Aloger, welche das Evangelium und die Apokalypse des Johannes nicht annehmen, die Adamianer, die Sampsäer, auch Elkesäer, die Theodotianer, die Melchisedekianer, die Bardesaniten, die Noetianer, die Valesier, die Katharer, auch Navatäer oder Montesier, wie man sie in Rom nennt, die Angeliker, die Apostoliker, die Apotakten, die Sabellianer, die Origenisten, welche auch die Schamlosen heißen, die Origenisten des Adamantius, die Anhänger des Paulus von Samosata, die Manichäer oder Akoaniten, die Hierakiten, die Meletianer, welche in Ägypten ein Schisma bilden, die Arianer oder Ariomaniten, die Audianer, welche zwar im Schisma, aber nicht in der Häresie sind, die Photinianer, die Marzellianer, die Halbarianer, die Pneumatomachen, welche gegen den göttlichen Hl. Geist freveln, die Aerianer, die Aetianer oder Anomöer, welchen sich beigesellt Eunomius oder besser der „Anomos", die Dimöriten, welche die vollkommene Menschwerdung Christi leugnen, die Apollinarier, welche behaupten, daß die heilige und beständige Jungfrau Maria nach der Geburt Christi mit Joseph sich ehelich verbunden habe, und die man auch Anti-dikomarianiten nennt, diejenigen, welche zu Ehren Mariens einen Kuchen [collyris] opfern und daher Kollyrianer heißen, die Messalianer, die Martyrianer aus den Heiden, die Euphemiten und die Satanianer.</p><p>Genug! Es ist und bleibt mir zuwider, soviele Häresien namentlich aufzuzählen; so will ich denn nur über die zwei angeführten Schismen reden. Von diesen ist das eine das der obenerwähnten Meletianer in Ägypten. Diese haben sich derer wegen, die zur Zeit der Verfolgung abfielen und dann von den Unsrigen nach geschehener Buße wieder in ihren früheren Stand eingesetzt wurden, von der Kirchengemeinschaft losgerissen, bilden aber keine Häresie. Das andere Schisma ist das der Audianer in Mesopotamien, welche zwar auch im Schisma leben, aber keinen falschen Glauben bekennen, sondern nur darüber hartnäckig streiten, daß der Mensch nach dem Ebenbilde Gottes geschaffen sei, die auch nicht wegen des Glaubens sich auflehnen und sich lostrennen oder wegen eines andern Grundes, sondern nur, weil sie in einer gewissen überspannten Gerechtigkeit keine Gemeinschaft haben wollen mit Bischöfen und Priestern, die Gold und Silber besitzen, und weil sie das Pascha zur selben Zeit mit den Juden feiern; deswegen trennen und entfernen sie sich von der Einheit der orthodoxen Kirche. Weil sie den Hl. Geist nicht empfingen und die Tiefen der Gottheit nicht verstanden, so wurden sie auch in diese Häresien verwickelt und in die willkürlichen schismatischen Streitereien. Da sie nämlich die Wahrheit verlassen hatten, kamen sie auf viele Irrwege und dachten heute so und morgen anders. Es erklärt aber derselbe hl. Apostel, indem er uns kundtut, weswegen er dieses sagte: „Wir haben den Geist Gottes empfangen, damit wir die Gnadengeschenke Gottes erkennen, wovon wir auch reden, nicht in gelehrten Weisheitsworten, sondern in Lehrworten des Hl. Geistes, indem wir Geistliches mit Geistlichem zusammen urteilen". Und so weiter. Der Geist Gottes ist also nicht verschieden von Gott. Denn, wenn er verschieden von Gott ist, wie erforscht er die Tiefen der Gottheit? Aber was willst du mir noch sagen, o eitler Tor, der du dein eigener Feind bist, damit ich den Hl. Geist nicht Gottes [Geist] nennen soll? Warum denn, eitler Tor, stürmest du an gegen den Unnahbaren? Warum bekriegst du den Unbekriegbaren? „Hart ist es dir, gegen den Stachel zu lecken“. Dir selber bist du ein Ärgernis, nicht dem Logos. Dich selber fängst du in deinen Schlingen, nicht den Geist. Dich selbst entfremdest du der Gnade Gottes, nicht den Sohn dem Vater, und nicht den Hl. Geist dem Vater und dem Sohne.</p><p>Gewiß erwiderst du in deiner Schlauheit — und ich habe schon einige Unverständige, welche die Wahrheit Gottes und unseres Erlösers zu Lästerungen verkehren, so sagen hören —: „Der Geist erforschet zwar die Tiefen der Gottheit, aber er begreift sie nicht; denn der Apostel sagt in seinem Ausspruche einfach nur: Er erforschet die Tiefen Gottes, setzt aber nicht hinzu: und begreift sie.„ Was ist doch das für eine große Weisheit! So war es denn notwendig, du Schaf, nach dem Worte „erforscht“ noch hinzuzufügen “und er begreift„? Nach deiner törichten Ansicht wenigstens ist der ganze Tatbestand lückenhaft, wenn nicht jenes Wort hinzugefügt wird. Aber hier gibt es für dich keinen Ausweg mehr; denn die Schrift bestätigt doch in allweg für einen frommen und religiösen Menschen die Wahrheit. Da steht nun über den allmächtigen Gott folgendes geschrieben: „Gott prüfet die Nieren und erforschet das Innere des Leibes“. Wenn nun Gott die Nieren prüfet, erkennt er dann nicht, was er prüft? Oder kam [nicht vielmehr] schon der ganze Erkenntnisvorgang in dem Prüfen zum Ausdruck? „Er erforscht das Innere des Leibes„, wieder ist nicht hinzugefügt: er begreift es. Wenn nun der Zusatz”er begreift es“ nicht dasteht, werde ich mir nun deshalb den [geistigen] Tod antun und jenen Zusatz hinflicken „er begreift es„, entsprechend deiner Meinung, du Tor? Ebenso heißt es nun auch vom Hl. Geiste: „er erforscht“ und es war nicht notwendig hinzuzufügen, daß er auch begreift. Der gewählte Ausdruck selbst läßt erkennen, daß der Hl. Geist die Kenntnis Gottes und der Tiefen der Gottheit habe. Wenn es also auch nicht heißt: er begreift, so mußt du doch auch dies mitverstehen, wenn du nicht deine Seele verderben willst. Wie es also niemand wagen wird, bezüglich des Vaters zu sagen: er erforscht, aber er begreift nicht — denn der Vater hat ja den Menschen erschaffen mit dem Sohne und dem Hl. Geiste; immer ist ja die Dreieinigkeit Dreieinigkeit, und sie kann nie einen Zuwachs erleiden — so gilt das auch vorn Hl. Geiste. Denn wenn er sagt: „Lasset uns den Menschen machen„, „im Anfange schuf Gott Himmel und Erde“, so wird damit hingewiesen auf den zum Werke der Schöpfung einladenden Ruf des Vaters; und in dem Ausspruch: „Lasset uns machen„ möchte ich einen Hinweis sehen nicht bloß auf den Sohn, sondern auch auf den Hl. Geist. Es heißt ja in der Schrift: „Durch das Wort des Herrn sind die Himmel befestigt worden und durch den Hauch seines Mundes alle ihre Kräfte“. Daher schafft mit dem Vater der Sohn, und es schafft mit der Hl. Geist. Gott also, der Allmächtige, der den Menschen geschaffen hat, sollte nicht wissen, was des Menschen ist, weil es von ihm nur heißt: „Er erforschet das Innere des Leibes”? Die ganze Fülle der göttlichen Erkenntnis aber deutet die Schrift an, wenn es weiter heißt: Damit nicht einer, der Sünde tut, glaube, daß er vor Gott verborgen sei. Denn er kennt den Menschen und was des Menschen ist.</p><p>Der Vater erforscht also das Innere des Leibes und erkennt es, der Hl. Geist erforschet die Tiefen der Gottheit und erkennt sie. Er offenbart ja den Heiligen die Geheimnisse Gottes und lehrt sie Gott aus der Tiefe preisen und zeigt den Seinen Gottes Unbegreiflichkeit. Daher ist der Geist nicht verschieden von Gott. Denn nicht von den Engeln heißt es, daß sie erforschen die Tiefen der Gottheit, nicht von den Erzengeln. „Niemand weiß den Tag oder die Stunde„, sagt der Sohn Gottes, „weder die Engel des Himmels noch der Sohn, sondern nur der Vater“. Es meinen aber unverständige Toren, die nicht geschmückt sind mit dem Hl. Geiste, ob doch nicht etwas im Vater sei, was nicht ist in der Gottheit des Sohnes. Aber: „Wie der Vater das Leben in sich hat, so hat auch der Sohn das Leben in sich„. Und: „Alles, was der Vater hat, ist mein“, sagt ebenderselbe hl. Logos. Was anderes aber ist des Vaters als etwa dieses: Die Gottheit ist des Vaters? Sie ist auch des Sohnes. Das Leben ist des Vaters? Offenbar auch des Sohnes. Die Unsterblichkeit ist des Vaters? Ebenso auch des Sohnes. Die Unbegreiflichkeit kommt dem Vater und dem Sohne zu. Alles, was der Vater hat, hat auch der Sohn. Wenn nun er alles hat, was der Vater, so muß auch die im Vater wohnende Erkenntnis auch im Sohne und im Hl. Geiste sein. Wenn nun einer meint, daß der Sohn den Tag nicht wisse, so soll er sich eines Besseren belehren lassen und nicht lästern. Ich lege ihm ja die Erkenntnis vor, und er wird erkennen. Sage mir also, mein Lieber, — denn ich nenne dich so; ich hasse ja niemand als nur den Teufel und die Werke des Teufels und den Falschglauben — um deiner selbst willen bitte ich, daß du zur Wahrheit Gottes kommst und nicht dich selbst zugrunde richtest mit deiner Lästerung gegen Gott. Denn tief sind die Worte Gottes, vom Hl. Geist aber werden sie durch die Charismen mitgeteilt. „Denn dem einen„, heißt es, „wird gegeben das Wort der Weisheit, dem andern das Wort der Lehre“ usw. „Es ist aber ein und derselbe Geist, der einem jeden zuteilt, wie er will”, um dir zu zeigen auch die Selbstherrlichkeit des Hl. Geistes. Wenn nämlich derselbe Geist allen die Gnadengaben verleiht, wie er will, so bitte denn den Vater, daß er dir den Sohn offenbare und bitte den Sohn, daß er dir den Vater offenbare und wiederum bitte den Vater, daß er dir den Sohn gebe und dir offenbare den Hl. Geist und dir die Gnade verleihe, ihn in dir zu haben, damit der dir gegebene Hl. Geist dir enthülle alle Erkenntnis des Vaters und Sohnes und Hl. Geistes, auf daß du erkennest, daß im Sohne keinerlei Nichtwissen sei, ebensowenig im Hl. Geiste.</p><p>Denn wenn auch die Engel größerer Macht und Erkenntnis ermangeln, so sei es doch ferne [zu glauben], daß auch der Sohn Gottes und der Hl. Geist derselben ermangeln. In geistlichem Verstande spricht Gott, der vom Vater zu uns gekommene hl. Logos: Die Psychiker aber werden gerichtet, da sie nicht erkennen die Weisheit des Sohnes, vielmehr das Wort der Weisheit. Ich frage dich, sage mir: Wer ist größer, der Vater oder jener Tag, über den er spricht? Du wirst es nicht wagen zu behaupten, der Vater sei nicht größer. Wenn nun der Vater größer ist als der Tag und die Stunde und alles, was er erschaffen hat und erschaffen wird, und niemand ihn erkennt als der Sohn, was ist dann wohl größer: den Vater zu kennen oder jenen Tag? Offenbar doch, den Vater zu erkennen. Wie sollte also dem, der das Größere weiß, das Geringere entgehen? Wenn er somit den Vater erkennt, so kennt er sicher auch den Tag, und es gibt nichts, dessen Kenntnis dem Sohne verschlossen wäre. Aber du wirst einwenden, daß der Vater größer ist und alles weiß, der Sohn aber keineswegs, wie er ja auch selbst sagt: „Der Vater ist größer als ich“. Aber so spricht der Sohn, um den Vater zu ehren, wie es sich ziemte, während er selbst höher vom Vater geehrt wurde. Es mußte nämlich in Wahrheit der rechtmäßige Sohn den eigenen Vater ehren, um sich als echten Sohn zu erweisen. In welcher Beziehung nun glaubst du, daß er größer sei? An Umfang oder Masse, zeitlich überhaupt oder in einem bestimmten Zeitabschnitte, an Würde oder Gottheit oder Unsterblichkeit oder Ewigkeit? Glaube doch das nicht! Denn in der Gottheit gibt es dem Sohne gegenüber keine Verschiedenheit, sondern nur insoferne der Vater Vater ist und er sein wahrer Sohn, gibt er seinem Vater die Ehre. Denn die Gottheit ist keine ausgedehnte Masse, so daß etwa der Vater ausgedehnter wäre als der Sohn, noch unterliegt sie der Kategorie der Zeit, so daß etwa der Vater vorzeitiger wäre dem Sohn gegenüber, noch hat der Vater seinen Platz in einer bestimmten Höhe — alles begreift er ja in sich, von nichts wird er inbegriffen —, so daß der Sohn etwa als untergeordnet zu denken wäre. „Er setze sich zur Rechten des Vaters”, [sagt die Schrift,] und nicht: er ging ein in den Vater, um den Sabellius zu widerlegen und den Arius wegen seiner Blasphemie zu verurteilen.</p><p>Deswegen forsche nicht nach dem Unerforschlichen, sondern ehre den Sohn, um den Vater zu ehren. Wenn es aber ferner von Gott heißt: „Niemand ist gut als nur einer, nämlich Gott„, so sollst du deswegen, weil der Sohn den Vater besonders zu ehren diesen Ausspruch tat, dich nicht vermessen, den Sohn etwa für nicht gut zu erklären. Denn nicht um zuzugeben, daß er selbst nicht gut sei, nennt er den Vater gut; im Gegenteil, er zeigt sich um soviel besser, indem er seinem Vater die Ehre gibt, so daß man also aus der Güte des Vaters ableiten kann die Erkenntnis der Güte des Sohnes, der von dem guten Vater Gott gezeugt ist. Es ist seitens derjenigen, welche so etwas von dem Sohne zu sagen wagen, das Zeichen eines großen Unverstandes, wenn man sich auch darauf beruft: „Einer ist nur gut, Gott.“ An vielen Stellen lehrt uns die göttliche Schrift, [wie das zu verstehen sei]. Sie redet von einem „armen und klugen Knaben und nennt ihn gut„, und anderswo: „Samuel war gut vor Gott und den Menschen“, und wieder: „Gut war Saul, des Kis Sohn aus dem Stamme Benjamin, um eine Schulter und mehr höher als ganz Israel„, und: „Es ist gut, zu gehen in das Haus des Schmerzes mehr als des Trankes“, ferner: „Öffne, o Herr, den Himmel, deinen guten Schatz„, und: „Die Rede ist gut über ein Geschenk“, und: Besser ein lebender Hund als ein toter Löwe„, „Besser zwei als einer“, „Besser ist der Rede Schluß als der Anfang„. „Wenn ihr, die ihr böse seid, euren Kindern gute Gaben zu geben wisset“, wo er von Fisch und Brot redet. Wie kann man nach alledem zu behaupten wagen, daß der Sohn, indem er die Güte des Vaters betont, seine eigene in Abrede stelle und nicht vielmehr die Güte des Vaters mit überschwänglicher Ehre hervorheben wollte? Er sah nämlich, daß der, welcher zu ihm sprach: „Guter Meister„, nicht so sehr aus dem Herzen als nur mit dem Munde es sprach, und er wollte ihm beweisen, daß er seiner Lippenrede nicht traue, sondern das Herz durchforsche, wie er ja auch an anderer Stelle sagt: „Was sagt ihr zu mir: Herr, Herr, und tuet doch meine Worte nicht?“ So wollte er ihn überführen. Er hatte ihn einen guten Meister genannt, verharrte aber nicht im Glauben an ihn, im Vertrauen auf seine Wesensgüte.</p><p>Er selbst also, der hl. Logos, der persönlich Lebende, der himmlische König, der wahre Sohn, er, der immer mit dem Vater ist, der aus dem Vater hervorgeht, der Glanz der Herrlichkeit, das Ebenbild seines Wesens, das wahrste Bild des Vaters, er, der denselben Thron einnimmt mit dem Vater, „dessen Reiches kein Ende sein wird“, „der Richter der Lebendigen und der Toten”, die Weisheit aus der Weisheit, die Quelle aus der Quelle — denn es heißt von ihm: „mich, die Quelle des lebendigen Wassers haben sie verlassen, und sich geborstene Brunnen gegraben“ —, er, der unaufhörliche Fluß, „der durch seinen Andrang die Stadt Gottes erfreut”, der aus derselben Quelle hervorkommt, „von dessen Innerem“, wie es heißt, „ausfließen werden Ströme”, das Szepter Davids, die Wurzel Jesse, die Blüte aus derselben, der Löwe, der König aus dem Stamme Juda, das vernünftige Opferlamm, der lebendige Stein, der Engel des großen Rates, er, der wahrhaft Mensch geworden ist und ebenso wahr Gott ist, der seine Natur und seine Gottheit nicht änderte, der geboren worden ist im Fleische, der eingefleischte Logos, „der fleischgewordene Logos“ — wobei vor „geworden” das Wort „Fleisch" gesetzt ist; denn die Schrift sagt nicht der gewordene, sondern nach dem Wort „Logos" setzt sie einfach „Fleisch" hinzu, und nach Fleisch folgt dann „gewordene“, damit so die Geburt aus Maria bezeichnet werde und man erkenne, daß der Logos vom Himmel vom Vater herabgestiegen sei, — er also, der heilige und lebende Logos, der Gott vom Vater, „der Engel des großen Rates”, der die Ratschlüsse des Vaters verkündet, „der Vater der zukünftigen Welt“, er hat gesagt: „Niemand weiß den Tag und die Stunde, nicht einmal die Engel im Himmel.” Dabei bedenkt man aber nicht, daß der Sohn ausdrücklich und bedeutungsvoll hinzufügt: „als nur der Vater“. Da aber der Sohn den Vater kennt, der Vater aber größer ist als der Tag und die Stunde, was niemand bezweifelt, wie sollte, der das Größere kennt, das Geringere nicht kennen? Denn „den Vater kennt niemand als der Sohn, und niemand kennt den Sohn als der Vater”. Denn wie der Vater groß ist, weil er den Sohn kennt, so ist auch der Sohn groß, weil er den Vater kennt. Weil er also den Vater, das ist das Größere, kennt, wie sollte er das Kleinere, das ist den Tag und die Stunde, nicht kennen? Forsche daher in den göttlichen Schriften und lerne kennen die Macht des Hl. Geistes! Und eben der Geist, der den Vater und den Sohn kennt, wird dir die Kenntnis des Logos, des Sohnes Gottes, eröffnen, auf daß du nicht von der Wahrheit abirrest und deine eigene Seele verlierest.</p><p>Denn ein zweifaches Erkennen, ein zweifaches Wissen unterscheidet die göttliche Schrift, ein praktisches und ein theoretisches. Damit ich aber aus Beispielen Analogien beibringe, um durch mehrere Argumente deinen und deiner Gesinnungsgenossen verirrten Sinn zu bekehren, so höre, was die Schrift über Adam sagt: „Sie waren nackt„, heißt es, „in dem Paradiese und erröteten nicht“. Dabei waren sie aber keineswegs blind und des Gesichtes beraubt. Denn hätten sie nicht gesehen, wie hätten sie dann bemerken können, „daß der Baum gut zum Essen und schön zum Anschauen sei„? „Und es nahm das Weib“, heißt es weiter, „und aß und gab ihrem Manne, welcher mit ihr war.„ Sie waren also nicht blind, sondern hatten die Augen offen. Obwohl sie aber nackt waren, so fühlten sie beim Anblick keine Scham, und weil sie nackt waren, erkannten sie sich. Sie erkannten sich aber nur der Wahrnehmung, nicht der Tat nach. Denn erst lange darnach, nachdem sie aus dem Paradies vertrieben worden waren, weil sie von der verbotenen Frucht gegessen, heißt es: „Adam erkannte sein Weib Eva.“ Wie ist nun das zu erklären? Doch so: Sie sahen einander, weil sie nackt waren, und sie erkannten einander dem Sehen nach, aber nicht der Tat nach. Die Schrift nennt nämlich auch die leibliche Veρbindung eine Erkennung. Es ist aber in ihrer Redeweise Erkennen und Erkennen zweierlei. So sagt sie denn an anderer Stelle: „Jakob erkannte sein Weib Lea und sie gebar„. Er hatte sie aber schon früher erkannt, hatte er ja doch mit ihr durch sieben Jahre die Schafe des Laban, ihres Vaters, geweidet! Allein diese Erkenntnis war nur vom Sehen und Verstehen, später aber erkannte er sie durch die Tat: „Und er erkannte Rachel, sein Weib.“ Anderswo aber lesen wir: „Es alterte David, und sie deckten ihn mit Kleidern zu, und er erwärmte sich nicht. Und sie sprachen zum König: Es möge eine schöne Jungfrau gesucht werden. Und es fand sich Abisag, die Sunamitin. Und sie wurde zum Könige gebracht, und sie schlief mit ihm und erwärmte ihn. Und David erkannte sie nicht„, da sie doch bei ihm war und an seiner Seite schlief. Von welcher Erkenntnis redet da wohl die Schrift, von der durch das Gesicht, oder meint sie das Erkennen durch die Tat? Und ähnlich: „Und es erkannte der Herr die Seinen“. Sollte er also die anderen nicht kennen? Und wieder: „Weichet von mir, ihr Übeltäter, denn niemals kannte ich euch„. Soll also der Sohn Gottes betreffs einiger unwissend sein? Und an anderer Stelle: „Euch kenne ich aus allen Völkern“. Kennt er mithin die anderen Völker nicht? Das sei ferne; sondern die göttliche Schrift unterscheidet ein zweifaches Erkennen: das eine besteht im Wissen, das andere in der Tat.</p><p>Da nun der Eingeborene des Vaters, der seinen Willen erfüllt, [daran ging, Gericht „zu halten über die Welt„], so zeigte er alles in Vollendung [mit den Worten: der Vater hat alles Gericht dem Sohn übergeben]. Es erkennt nämlich der Vater die Stunde und den Tag, er erkennt sie wissend und wirkend. Denn er weiß ja alles. Wenn aber der Sohn sagt: „Der Vater hat alles Gericht dem Sohn übergeben“, so richtet er selbst, wenn auch nicht direkt, so doch eben dadurch, daß er es dem Sohn übergeben. Denn Gott hat sich seines Rechtes nicht begeben, zu richten, die zum Gerichte kommen; und indem der Vater nicht richtet, hat er sein Gericht schon gehalten. Der Sohn aber weiß, wann er kommt. Denn er selbst führt ihn ja herbei, den Tag, und er selbst bestimmt und hält und vollendet ihn. Denn so spricht er: „Wie ein Dieb in der Nacht kommt jener Tag„. Und wiederum: „Wandelt nicht in der Nacht, damit nicht jener Tag euch in Finsternis ereile“. Wenn nun die Diener Christi Kinder des Tages sind, sollte dann wohl der Sohn selbst, der den Tag herbeiführt, ihn nicht wissen, so daß der Tag ihn überrasche und nicht vielmehr er den Tag bringe? er kann solches ohne Blasphemie denken und so Ungebührliches über den Vater und Sohn meinen? Vielmehr kennt der Vater den Tag und die Stunde auf beide Weisen, sowohl dem Wissen als der Tat nach. Denn er weiß, wann er kommt, und hinwiederum hat er schon gerichtet, indem er den Sohn zum Richter bestellte, und so kennt er ihn auch der Tat nach. Der Sohn Gottes aber weiß wohl, wann er kommen wird, und er selbst führt den Tag herbei, und kennt ihn somit wohl, aber er hat ihn noch nicht gewirkt nach seiner Erkenntnis, d. h, [er kennt ihn noch nicht] der Tat nach. Denn noch freveln die Frevler und die Ungläubigen glauben nicht und die Ketzer lästern, noch ist der Teufel am Werke und Sünden werden begangen, das Unrecht nimmt Überhand, und das Gericht läßt auf sich warten, bis es endlich kommt und er [der Sohn auch] der Tat nach es erkenne und Vergeltung übe und rette diejenigen, die in Wahrheit auf ihn hoffen und nicht lästern seine Gottheit, [die Gottheit] des Vaters und Sohnes und Hl. Geistes.</p><p>Den heiligen Engeln aber fehlt diese eben besprochene Würde. Sie sind ja zu ehren, weil der Vater und der Sohn und der Hl. Geist ihnen dies verliehen hat. Aber was ihnen fehlt ist dieses: Sie wissen nicht, wann das Vorausbestimmte eintritt. Denn „die Zeiten hat der Vater seiner Macht vorbehalten„. Wenn aber der Vater im Sohn ist und der Sohn im Vater, so kann die Macht, die im Vater ist, dem Sohne nicht fehlen. Sie fehlt aber den Engeln; denn geschaffen sind die Engel, die Erzengel und die Kräfte. Der Vater aber ist unerschaffen, der Sohn unerschaffen, der Geist Gottes unerschaffen. Es wissen also die Engel den Tag und die Stunde nicht, weder der Erkenntnis noch der Tat nach. Denn sie wissen nicht, wann der Vater und der Sohn und der Hl. Geist den Tag herbeiführen wollen. Auch haben sie davon noch keine praktische Erkenntnis; denn noch haben sie nicht den Auftrag erhalten „hinzugehen und das Unkraut zu sammeln und in Bündel zu binden zum Verbrennen in unauslöschlichem Feuer“. Somit verhalten sie sich [zum Gerichtstage] einstweilen weder tätig noch wissend, der Vater aber ist wissend und war schon tätig, der Sohn aber hat wohl das Wissen, aber er hat es noch nicht in die Tat umgesetzt. Das will es besagen: „Nur der Vater allein, nicht der Sohn.„ Lasset uns die Bedeutung des Schriftwortes bedenken, damit uns nicht der Buchstabe zum Tode werde. Denn, so heißt es, „der Buchstabe tötet, der Geist aber macht lebendig“. Lasset uns den Geist aufnehmen, um aus dem Buchstaben Nutzen zu ziehen. Nicht der Buchstabe [als solcher] tötet, im Buchstaben ist ja das Leben, sondern er tötet denjenigen, der unverständig an den Buchstaben herangeht und den erklärenden Geist nicht hat, der den Buchstaben aufschließt und seinen Sinn enthüllt. Darum hat ja auch der heilige Vater seinen eingeborenen, wahren, von ihm gezeugten Sohn und seinen Hl. Geist seiner heiligen Kirche gegeben, in einer Harmonie der Erkenntnis, in einem Bande der Vollkommenheit, damit wir im Namen des vollkommenen Vaters und Gottes das Siegel empfangen, und im Namen des vollkommenen Sohnes und Gottes und im Namen des göttlichen und vollkommenen Geistes das Siegel erhalten. O heilige Dreiheit, die wir zählen, Dreiheit, die wir zählen in einem Namen! Denn nicht Einheit und Zweiheit wird gesagt, auch nicht Einheit und Einheit, sondern Einheit in der Dreiheit und Dreiheit in der Einheit, unter einer Wesensform, einem Namen, e i n Gott Vater im Sohne, Sohn im Vater mit dem Hl. Geiste.</p><p>Rufe mir an als Zeugen der Wahrheit, rufe mir an die Jünglinge, die aus dem babylonischen Ofen gerettet wurden, die ausersehen wurden, ins Feuer geworfen, aber davon nicht verzehrt zu werden, das Feuer nicht auszulöschen, damit sie nicht in den Verdacht kämen, als hätten sie neues Zauberwerk dagegen ins Werk gesetzt, vielmehr im Feuer zu stehen, aber nicht verzehrt zu werden im Feuer wegen ihres rechten Glaubens, indem Gott durch sie uns lehrte, was das Geschaffene ist und was das Ungeschaffene, was das Gemachte und was das Ungewordene, was das Ewige und was das daraus gewordene Sein, Die solchergestalt geretteten Jünglinge wollten ihre dankbare Gesinnung gegen Gott beweisen, ihren Retter, auf den sie vom Anfange an gehofft hatten, dessentwegen sie nicht geschwankt und den Nacken nicht gebeugt hatten vor dem Bilde, vor dem Zorne und der Tyrannei des Königs. Und da sie Gott irgendwie Dank erstatten wollten, so erforschten sie mit dem Hl. Geiste die Tiefen in ihren Herzen, heilig wie sie waren, und erwogen, daß der Himmel und alles in ihm, die Erde und alles unter ihr, und alles was ist, nicht würdig seien, Gott zur Gabe dargebracht zu werden. Es war ihnen auch gar nicht möglich, etwas über ihre Person Hinausgehendes zu opfern, deshalb wollten sie nach Gebühr und Möglichkeit nur in Hymnen Gott preisen. Denn so steht geschrieben: „Opfert ein Opfer des Lobes„ und „ein Opfer des Lobes wird mich verherrlichen“. Denn schon wendeten sie unter Einwirkung des Hl. Geistes den Alten Bund zum Neuen und hatten so kein Tieropfer noch bedurften sie Brandopfer. Denn sie sagen sich: „Nicht ist hier eine Stätte zum Darbringen von Früchten noch ein Opfer noch ein Altar„, da ja alles ihnen fehlte. Weil sie nun ein solches Lobopfer darbringen wollten unter ruhiger Hinnahme ihrer Armseligkeit, so zeigen sie sich demütig. „Denn ein jeder, der sich selbst erhöht, wird erniedrigt werden, wer sich aber selbst erniedrigt, wird erhöht werden“. Mit dem Gnadengeschenk ihrer Rettung empfangen sie auch diese Gabe der Demut; so wollen sie Gott ihr Lobopfer darbringen und nicht säumen, und indem sie sich aufschwingen zum unaussprechlichen Lobpreis Gottes, wollen sie die Kreatur zum Lobpreise mitfortreißen und fangen an zu singen, indem sie den ganzen Kreis der Schöpfung ausschreiten.</p><p>Sie unterscheiden aber die Werke von dem Werkmeister, die Geschöpfe vom Schöpfer und beginnen: „Preiset alle Werke des Herrn den Herrn“. Sie sagten alle [Werke], ließen keines aus. Der Hl.Geist will die vollkommene Erkenntnis durchblicken lassen, damit man wisse, was Gott und was von Gott geschaffen, auf daß wir nicht mit dem Ewigen das vermengen, was aus dem nicht Seienden geworden, und so unser Denken verderben; deswegen zählten sie alles namemtlieh auf. Denn es offenbarte ihnen der Hl. Geist, daß sie gewürdigt wurden, mit Engeln zusammen zu sein, als Hausgenossen der Engel, sowohl was im Himmel als auch, was auf der Erde ist, so daß sie alles wußten. Es singen also diese Jünglinge, wie vorausgesagt: „Lobpreiset alle Werke des Herrn den Herrn!“ Und sie beginnen aufzuzählen und zu unterscheiden, was Werke, was Bildner und was Gebilde, was wirkend und was gewirkt ist. So zählen sie denn auf den Himmel, die Erde, das Wasser ober dem Himmel und die Engel, denn auch sie sind Geschöpfe; und die Thronen und die Mächte, denn auch diese sind geschaffen; die Sonne, den Mond, denn sie sind nicht von selbst und nicht ungeschaffen; die Wolken und die Nebel, die Winde, den Schnee und die Blitze, die Gewitter, die Erde, das Meer, die Quellen, die Abgründe, die Flüsse, die ganze Menschheit, die Gebirge, die Vögel des Himmels, die Haustiere und das Wild, die Seelen der Frommen, die Geister der Gerechten, den Ananias, Azarias, Misael, die Priester und die Diener Gottes; denn alles ist gemacht und gebildet, von Gott geschaffen durch den Logos und durch den Hl. Geist; „denn durch das Wort des Herrn sind die Himmel gegründet worden, und durch den Hauch seines Mundes alle Macht derselben“. Siehe nun, geliebter Bruder, alles dieses haben sie aufgezählt, getragen vom Hl. Geiste, aber sie haben nicht aufgezählt den Sohn unter den Geschöpfen und auch nicht den Hl. Geist, sondern sie erkannten, daß eine und dieselbe Gottheit in der Dreiheit und diese Dreiheit in einer Gottheit sei. Und sie lobpriesen den Vater in dem Sohne und den Sohn im Vater mit dem Hl. Geiste — eine Heiligung, eine Verehrung, eine Göttlichkeit, e i n Lobspruch.</p><p>Aber richtig wagt es der Teufel, auch dieses unter den Menschen anzustiften, daß sie jenen heiligen Jünglingen frechen Unglauben andichten und vorspiegeln: jene wußten den Namen des Hl. Geistes gar nicht auszusprechen, denn sie waren Juden; als Juden kannten sie ebensowenig den Sohn. Aber sofort überführen die Schriftworte den Unglauben der Übelmeinenden. Es heißt nämlich: „Und es war das Antlitz des vierten wie das Antlitz eines Sohnes Gottes“. Siehe den Namen „Gottessohn“. Man kann also doch nicht von einem Unbekanntsein desselben reden, auch schon vor der Episode mit dem Feuerofen, da Daniel [schon] erfüllt ward mit dem Hl. Geiste und sprach: „Ich bin rein vom Blute dieser.“ Und sie kehrten um zum Gerichte und er richtete die Ältesten, getragen vom Hl. Geiste“. Somit kannten sie also den Sohn, sie kannten auch den Vater und den Hl. Geist, und nicht aus Unkenntnis sprachen sie die Namen nicht aus, sondern in weiser Vorsicht. Sie sagten nämlich: „Preiset alle Werke des Herrn den Herrn.“ Und nicht: Preise, Sohn Gottes, den Herrn, ebensowenig: Preise, Hl. Geist, den Herrn, sondern: „Preiset alle Werke des Herrn den Herrn.“ Nun soll keiner von denen, die auf Ausflüchte ausgehen, kommen und sagen, daß sie [auch] die Cherubim und Seraphim nicht nannten; folglich seien dann auch sie keine Werke Gottes. Denn das göttliche Wort hat sich im voraus schon gesichert gegen solche, die sich auf Kniffe verlegen, weil es voraussah ihren Einwurf, der gleicherweise sie und jene Jünglinge entehrt. Denn dreifach haben die heiligen Jünglinge ihren Lobgesang verdoppelt, sie, die alles, was geschaffen und gemacht ist, zum Lobe Gottes aufriefen. Zuerst sprachen sie: „Gepriesen bist du, Gott, Herr unserer Väter, und lobwürdig und hochgerühmt ist dein Name in Ewigkeit“, und dann u. a.: „Gepriesen bist du, der du sitzest über den Cherubim“, und endlich: „Gepriesen bist du auf dem Throne deines Königtums“, und: „Gepriesen bist du, der du schauest in die Abgründe und thronest auf den Cherubim.“ Deswegen, damit man bei dem Worte „Thron“ denke an die Cherubim und Seraphim, und bei der Nennung der Cherubim, der Abgründe, des geheiligten Thrones und aller anderer Namen, aus der Zusammenstellung aller Genannten auf den Gedanken komme, daß sie zu den Werken [Gottes] gehören, da sie mit den übrigen in einer Reihe aufgezählt werden. Denn nachdem sie all dieses zum Lobpreis aufgerufen haben, fügen sie allsogleich hinzu: „Preiset alle Werke des Herrn den Herrn“, auf daß Gabriel und Michael preisen den Vater und Sohn und Hl. Geist.</p><p>Auch die ehrwürdigen Engel im Himmel singen den Triumphgesang, indem sie mit den Seraphim und Cherubim, die Dreifaltigkeit gleichehrend, gleichmäßig und gleichwesentlich preisen und rufen: “Heilig, heilig, heilig”. Drei Worte sprechen sie aus, aber in der Einzahl, nicht in der Mehrzahl. Sie rufen ihr “Heilig” nicht ein viertesmal, um nicht der Benennung der Dreiheit noch etwas anzuhängen; sie rufen das “Heilig” nicht zweimal, damit ihr Lobpreis nicht der Vollkommenheit ermangle, sondern dreimal, um den Vater und Sohn und Hl. Geist mit derselben Ehre heilig zu preisen. Sie rufen auch nicht: heilig und halbheilig, sondern sie wiederholen ganz gleich “Heilig”, damit sie so mit demselben Laute, mit denselben Worten und mit derselben Vollkommenheit die Dreiheit in der Einheit und die Einheit in der Dreiheit preisen. Diese Kenntnis uns zu lehren, kam auch der eingeborene Sohn, diese Weisheit verkündet uns der Hl. Geist, diese Vollkommenheit offenbarte uns der Vater. In Wirklichkeit stellte uns dieses Leben dar der menschgewordene Logos, errichtete diesen Bau der Hl. Geist: “Denn wenn jemand auf diesem Grunde bauet Gold, Silber, Edelsteine, Holz, Heu, Stoppeln” usw.. Denn es ist kein anderer Grund. “Einen anderen Grund kann ja niemand legen außer dem, der gelegt ist, welcher ist Jesus Christus”, der Sohn Gottes, dessen Bau und dessen Pflanzung wir sind, “erbauet auf dem Grunde der Apostel und Propheten, auf daß wir wissen, daß unser Bau fest sei in Wahrheit und daß unser Grund ewig ist und keinen Anfang gehabt habe. Aber nicht in allen ist nach des Apostels Wort diese Kenntnis, sondern nur in denen, welche durch die Gnade des Hl. Geistes die Geheimnisse der Wahrheit zu erfahren gewürdigt worden sind. Denn er, der sich selbst und seinen Vater und den Hl. Geist offenbart, tadelt einige, welche in Unwissenheit wandeln, indem er spricht:”Ihr kennet nicht die Schrift und ihre Kraft“, und anderswo:”Wer Ohren hat zu hören, höre“, und wiederum sagt er zur Samariterin:”Wenn du wüßtest, wer von dir einen Trunk verlangt, würdest du denselben verlangt haben“, und ebenso:”Ihr wisset nicht, wessen Geistes ihr seid“. Aber es haben nicht alle diese Kenntnis; denn die Charismen werden von Gott verschiedentlich ausgeteilt, und, wie die Schrift sagt,”wem mehr gegeben ist, von dem wird man auch mehr fordern", womit angedeutet wird, daß einige nur ein weniges empfangen, andere nichts, wieder andere aber mehr und reichlicher.</p><p>Daß sich aber das so verhalte, kann man aus den Aussprüchen der heiligen Schriften selbst ersehen. Denn die Hl. Schrift, geistlich verstanden, enthält sehr vieles, besonders über unser Heil, ich meine über die Kenntnis des Herrn. Aber gerade was tiefer ist und unseren Seelen zur rechten Festigkeit dienen muß, das pflegt denen, welche die Wissenschaft von Gott nicht empfangen haben, zum Anstoße zu sein, wie Oseas, der Prophet, bezeugt: „Wer ist weise und versteht dieses? Und wem ist das Wort der Erkenntnis von Gott gegeben, und er wird dieses erkennen? Gerade sind die Wege des Herrn, Gottlose jedoch stürzen auf denselben“. Ja, allerdings gerade sind diese Wege des Herrn, aber die Gottlosen stürzen auf denselben, da doch diese unschuldig sind an dem Anstoße der Menschen. Denn die, welche sich an dem Steine des Anstoßes stoßen, müssen das ihrer eigenen Sorglosigkeit zuschreiben. So stießen sich an dem Steine des Anstoßes und nahmen Ärgernis besonders die Juden. Denn da sie den eingeborenen Sohn Gottes im Fleische gekommen sahen und bemerkten, wie er Wunder wirkte, sprachen sie, der himmlischen Kenntnis nicht teilhaft: „Wer ist dieser Mensch, welcher Blasphemisches redet?“, und ein andermal: „Wäre dieser Mensch aus Gott, so würde er nicht den Sabbat brechen“. Sie kannten also die Gottheit nicht, sondern hielten ihn nur für einen bloßen Menschen. Diese aber haben ihn auch als Gott erkannt, mißkennen aber seine vollkommene Herrlichkeit, nachdem sie gehört haben, was geheimnisvoll über ihn gesagt ist, gemäß der an uns gewirkten Heilsveranstaltung, und kommen zu schlechten Ansichten, weil sie sich täuschen über seine Gottheit. Ihre ganze Geistesrichtung führte sie auf falsche Fährte. Wie nämlich die Juden Hörer des Wortes geworden waren und doch in die Irre gingen, so ist es auch bei ihnen: sie hörten und irrten. Jene nämlich sahen, was in den Propheten vorausgesagt war; da sie aber nicht einsahen, daß es mit der Erscheinung Christi im Fleische erfüllt sei, so wurden sie irre. Diese hinwiederum hören, was wegen seiner Heilsveranstaltung geschrieben steht, fassen es aber verständnislos auf, werden darum irre und wenden zu ihrem eigenen Verderben, was zu unserem Frommen geschrieben ist. Sie wenden ein, er hat ja doch gesagt: „Ich gehe zu meinem Gott und eurem Gott, zu meinem Vater und eurem Vater“. Siehst du, daß auch er eines von den Geschöpfen ist? — So erkühnen sie sich lästernd zu sagen.</p><p>Du siehst also, wie die Heilsveranstaltung der Menschwerdung für sie zum Ausgangspunkt des Irrtums wird. Laß sie nur zurückgehen auf den Uranfang und nach den Zeiten und Momenten fragen: „Sein Ausgang“, heißt es, „ist ja von den Tagen der Ewigkeit“. Sehen wir also, was vorher war. Es spricht der Vater: „Lasset uns den Menschen machen nach unserem Bilde und Gleichnisse“, und er sagte nicht: ich will den Menschen machen nach meinem Bilde. So laß dich überzeugen, du mit deinem verstockten Herzen, gemäß dem Schriftworte: „Aber ihr Herz wurde verhärtet“, und erkenne, daß der Sohn allzeit beim Vater ist. Denn die Redewendung: Lasset uns machen, weist nicht hin auf einen allein, sondern auf den Vater, der zum Sohne spricht. Laß dich überzeugen, du, der du behauptest, der Sohn sei dem Vater unähnlich. Denn indem er sagte: „nach unserem Bilde“, unterschied er nicht das Gleichnis des Sohnes von dem des Vaters, auch nahm er nichts hinweg von der naturhaften Gleichheit des Vaters gegenüber dem Sohne; denn er sagte nicht: Nach meinem Bilde oder nach deinem Bild, sondern: nach dem Bilde des Vaters und des Sohnes und des Hl. Geistes. Er bezeichnete also damit eine Wesenheit und Gottheit. Darum sagte er: Nach unserem Bilde und Gleichnisse, um anzudeuten, daß eben eine und dieselbe die Gottheit des Vaters und des Sohnes und des Hl. Geistes sei, und daß der Mensch nach dem Bilde der einen Gottheit des Vaters, Sohnes und Hl. Geistes geschaffen sei. Laß dich überzeugen auch du, Arius, wenn du hörst, daß der Vater zum Sohne sagt: „Lasset uns machen“ und ihn also als Mitschöpfer bezeichnet. Denn oft schon habe ich einige sagen hören, daß der Sohn nichts geschaffen habe, sondern daß nur durch ihn gemacht wurde, was gemacht ist. Wenn es aber durch ihn gemacht worden ist, so hat er es auch selbst erschaffen, wie deutlich gezeigt ist. Denn der Werkmeister Logos ist der Hervorbringer von allem, und durch ihn wirkt der Vater. Man höre nur, was er selbst deutlich sagt: „Mein Vater wirket bis jetzt, und auch ich wirke“. Durch diese Worte also bezeichnet er, daß sein Vater alles gemeinschaftlich mit ihm wirke. Aber nochmals: laß deinen Geist nicht irre gehen und tritt nicht an den Sohn heran wie zu einem Diener, statt wie zu dem wahren und wirklichen Herrn. Denn wäre er nur Knecht und nicht der wirkliche Herr, wie hätte er „Knechtsgestalt annehmen“ können, als er auf die Erde kam, er, „der göttlicher Gestalt war“? Oder wie hätte er von sich sagen können, daß er mit dem Vater alles erschaffen habe, wenn er nicht die vollkommene göttliche Natur hätte? Glaube also an den Sohn als vollkommenen Gott und als den wahren Sohn, der vom Vater ausgeht.</p><p>Du darfst auch nicht den böswilligen Einwand machen: Der Vater sprach allerdings zum Sohne: „Lasset uns machen“, der Sohn aber sprach nicht zum Vater: „Lasset uns machen“, auch sagt der Sohn nicht: ich wirke und mein Vater wirkt, sondern den Vater stellt er voran im Reden wie im Handeln. Das hieße ich denn doch töricht daherreden, denn damit wolltest du die Gottheit als eine Mehrheit von Urprinzipien denken. Es ist aber nur e i n Urprinzip und dies ist die eine Gottheit, nirgends aber sagt der Sohn dort [= im A. T.]: mein Gott. Ich konstatiere das, nicht als ob der Sohn die dem Vater gebührende Ehre anstreiten wollte, sondern im Sinne des innergöttlichen Verhältnisses. Und wiederum heißt es: „Es hörte Adam Gott im Paradiese wandeln in der Abendkühle“. Nirgends ferner sagt der Sohn „meinen Gott“ und „euren Gott“, sondern er nennt ihn hier Gott schlechthin. Und abermals: „Und es sprach Gott zu Noe“ — wirklich nirgends findet sich diese Redeweise —, „und es erschien“, heißt es, „Gott dem Abraham, da er bei der Eiche in Mambre saß und siehe: drei Männer, und er neigte sich zur Erde und sprach: Wenn ich Gnade vor deinen Augen gefunden habe“, damit bezeichnet er den Einen als Gott, seine zwei Begleiter aber als seine Engel. In diesem Sinne heißt es auch: „Und es ging Gott von Abraham fort.“ Er selbst aber, der zu Abraham gekommen war, redet ihn also an: „Kann ich meinem Knechte Abraham etwas verbergen? Der Ruf von Sodoma und Gomorrha“, fährt er fort, „hat das Maß voll gemacht vor mir.“ Und so weiter. Und nirgends findet sich in diesen Zeiten die Wendung „mein Gott“ und „euer Gott“. „Und es kamen die zwei Männer nach Sodoma“, [„Zwei“], denn der dritte war nach der Trennung von Abraham zum Himmel aufgestiegen, weg von den zwei, die zum Strafgericht nach Sodoma gegangen waren. Von dem, der in den Himmel aufgestiegen war, sagt die Schrift weiter: „Und der Herr ließ regnen über Sodoma und Gomorrha Schwefel und Feuer vom Herrn.“ Und es bedurfte nicht jener Worte: „Mein Gott“ und „euer Gott“. Ebenso sagt Moses in seinem Gesange: „Und alle Engel Gottes sollen ihn anbeten“. Wenn die Schrift sagt: „Engel Gottes“ und „Feuer vom Herrn“, und nicht einfach „Engel“, so tut sie das, um zu zeigen, daß das Reich des Vaters und des Sohnes eines sei, da die Engel nicht in einzelne Reiche abgeteilt werden, sondern einfach Engel Gottes sind, die den Sohn anbeten, eben weil er Gott ist. Denn die Engel beten sich nicht gegenseitig an. Auch hier heißt es nirgends „mein Gott“ und „euer Gott“.</p><p>David sagt: „Es sprach der Herr zu meinem Herrn: Setze dich zu meiner Rechten, bis ich lege deine Feinde zum Schemel deiner Füße“. Er sagt: „Es sprach der Herr zu meinem Herrn“; denn damals hatte er die menschliche Natur noch nicht angenommen, um derentwillen er sagen mußte: „Mein Gott“ und „euer Gott.“ „Siehe die Jungfrau wird empfangen und einen Sohn gebären, und du wirst seinen Namen Emmanuel nennen, das heißt: der Gott mit uns“. Auch an dieser Stelle konnte noch nicht gesagt werden: „Mein Gott“ und „euer Gott“. Und wieder lesen wir: „Und du Bethlehem, Haus des Stammes Ephrata, du bist nicht zu gering, um zu sein unter Judas Tausenden; denn aus dir wird hervorgehen der, welcher zum Herrscher sein wird in Israel; und sein Ausgang ist von Anbeginn, von den Tagen der Ewigkeit her“; oder nach den anderen Handschriften: „Und du Bethlehem, du bist nicht die geringste unter den Fürstenstädten Judas; denn aus dir wird herrorgehen der Anführer, und er wird mein Volk weiden.“ Auch damals war noch nicht die Zeit zu sagen: „Mein Gott“ und „euer Gott“. Als aber die Prophetie des Jeremias erfüllt war und ingleichen die des Isaias, daß aus der Jungfrau der Logos geboren werden und menschliche Natur annehmen sollte, wie Jeremias sagt: „Und er ist ein Mensch, und wer wird ihn kennen lernen?“, nachdem er die menschliche Natur angenommen und ohne männlichen Samen aus der Gottesgebärerin Maria das heilige Fleisch zu sich emporgebildet hatte, gemäß jenem Worte der Schrift: „Gebildet aus dem Weibe“, — also um unseres Loses willen unser Los auf sich genommen hatte, — da erst sagte er: „Mein Gott.“ Weil er aber seiner Natur nach von Ewigkeit her wirklicher Gottessohn ist, sagt er: „Mein Vater“, „euer Vater“ aber wegen des Gnadenverhältnisses, in das er seine Jünger versetzte; „euer Vater“ wegen des naturhaften Verhältnisses seiner Jünger zu seiner und seines ewigen Vaters Gottheit. Denn er war der Gott der Jünger. Vater des Herrn [ist Gott] der Natur nach, Vater der Jünger der Gnade nach. Der Gott des Sohnes aber ist der Vater, insoferne der Sohn Mensch ist, sein Vater aber wegen seiner ewigen und unbegreiflichen, wahren Sohnschaft, weil Gott in Wahrheit sein Vater ist, da er ihn gezeugt hat vor aller Zeit, ohne Anfang, seiner Gottheit nach. Gott also mußte er ihn nennen wegen des Heilswerkes, das er unsertwegen ausführte, er, der immer beim Vater war, der anfangslos erzeugte Logos, im Fleische aber von Maria, in den letzten Tagen geboren dem Fleische nach aus Maria, eben der heiligen Jungfrau durch den Hl. Geist.</p><p>Möchten daher doch alle die Tiefe des göttlichen Ratschlusses bedenken und erwägen und nicht gerade die Gnade Gottes zur Ungnade verkehren, indem sie sein Heilswerk an uns auffassen als eine Beeinträchtigung der Ehre der unaussprechlichen und unbegreiflichen göttlichen Natur. Von Gott, sagt man, steht geschrieben: “Er wird nicht hungern und nicht dursten, und unergründlich ist seine Weisheit”; vom Sohne aber, daß er “nach der Versuchung in der Wüste hungerte”. “Euer Gott”, heißt es, “wird nicht müde werden.” Der Herr Jesus aber “ermüdete” auf der Reise. “Es schlummert nicht und schläft nicht, der Israel bewacht”. Der Herr aber “schlief” im Schiffe. O, wie eitel sind die Gedanken derjenigen, die solche Einreden gebrauchen! Hat ja doch der heilige Logos, da er uns zu Liebe kam, nicht nur unsere Lasten auf sich genommen, sondern er wollte auch berührt werden können, er nahm Fleisch an und wurde als ein Mensch befunden und von den Schriftgelehrten gefangen genommen und [es erfüllte sich]: “Ich gab meinen Leib den Geißelhieben preis und wendete mein Antlitz nicht ab von denen, die mich schmähten und anspien”. Ja, er weinte auch, wie in dem Evangelium nach Lukas, und zwar in dem unkorrigierten Texte enthalten ist, und es bediente sich dieser Stelle auch der hl. Irenäus in seinem Werke gegen die Häresien gegen diejenigen, welche behaupten, daß Christus nur dem Scheine nach auf Erden gewandelt sei. Orthodoxe aber haben diese Stelle ausgemerzt aus Ängstlichkeit, weil sie deren Zweck und guten Sinn nicht kannten, Jesus, heißt es ferner, “da er mit dem Tode rang”, schwitzte, und “sein Schweiß war wie Blutstropfen, und es erschien ein Engel und stärkte ihn”. Und nicht nur das, sondern er fragt auch in menschlicher Weise: “Wo habt ihr den Lazarus hingelegt?”, und betreffs jenes blutflüssigen Weibes: “Wer hat mich berührt?”, und diejenigen, die ihn suchten: “Wen sucht ihr?” Auch die Jünger fragt er in echt menschlicher Weise: “Für wen halten die Leute mich, des Menschen Sohn”, und wiederum: “Wieviele Brote habet ihr bei euch?” Ermüdet vom Wege saß er ferner am Brunnen in Samaria. Von ihm berichtet die Schrift: “Das Kind wuchs und ward stark im Geiste”; “Jesus nahm zu an Alter und an Weisheit”. Auch ist von ihm gesagt: “Bevor der Knabe verstehen wird zu nennen Vater und Mutter, wird er erlangen die Schätze von Damaskus und die Beute von Samaria”, von ihm, der die Weisheit ist, “der die Menschen Erkenntnis lehret, der den Menschen das Ohr eingepflanzet”, der den Menschenkindern die Sprache verliehen hat und “der Unmündigen Zunge beredt gemacht hat”. Dies alles hat er für uns auf sich genommen, damit er die ganze Konsequenz der unsertwegen gewirkten Menschwerdung tragend, die Echtheitsnote [derselben] nicht verwische.</p><p>Damit wir aber die Zeugnisse, die wir anführten, indem wir sie vom Standpunkt der Widersacher gegen die Wahrheit als Gegeninstanzen aus der Hl. Schrift zusammenstellten, während sie von ihnen [in Wirklichkeit] nur falsch verstanden werden, — nicht einfachso unerklärt hinausgehen lassen, so wollen wir von einem jeden Sinn und Bedeutung angeben, weswegen die anthropopathische Redeweise angewendet ist; nochmals werden wir nach Besprechung des Ausdruckes “mein Gott” und “euer Gott” viel darüber sagen, so daß jeder, der seinen Verstand bei der Sache hat, schon auf Grund des ganzen Gedankenganges erkennen kann, daß mit gutem Grund gesagt ist: “Er ist ein Mensch, und wer wird ihn erkennen?” In einer und derselben Stelle deutet uns die göttliche Schrift beides an, das Sichtbare und das Unsichtbare. Wegen des Sichtbaren sei wohlberechtigt das Wort: “mein Gott”, wegen des Unsichtbaren aber sei gesagt: “mein Vater”, so daß also auch nicht eine der beiden Wendungen der Vernunft widerspreche. Denn wie sollte er, wenn er ein Mensch war, nicht erkannt werden? War er aber kein Mensch, warum wurde er dann Mensch genannt? Denn unweigerlich wird jedermann, der von Menschen abstammt, von Menschen erkannt, von der Mutter, von den Verwandten, von den Angehörigen, von Nachbarn, von den Hausgenossen oder Mitbürgern. Allerdings kann das genannte Wort sich nicht an einem bloßen Menschen erfüllen, erfüllt sich aber an dem Gott-Logos und Sohne Gottes, wenn gesagt wird: “Mensch ist er”; [er ist es] in Wahrheit. Das andere Wort aber: “Wer wird ihn erkennen?” [dies erfüllt sich,] weil er Gott ist; deswegen ist er Mensch unter Menschen und ist Gott, unerkennbar den Menschen wegen seines unbegreiflichen Wesens. Ein Mensch aber ist er, aus Maria in Wahrheit ohne Zutun eines Mannes geboren. — “Und die Jungfrau wird empfangen.” Der Prophet verkündet das in der Zukunft Kommende: “Und die Jungfrau wird empfangen.” Zukünftig war ja dies: Sie wird einen Sohn gebären. Wenn nun aber als Jungfrau, so geht der Eintritt der Mutterschaft nicht von einem Manne aus, weil schon vor dieser Zeit zu Achaz gesagt worden ist: “Begehre für dich ein Zeichen nach der Tiefe oder nach der Höhe.” Der aber sagt demutsvoll:,;Ferne sei es, daß ich begehre und versuche den Herrn, meinen Gott“, womit er es ablehnt, ein Zeichen sich zu erbitten. Weil er aber keines erbittet, so gewährt sofort deren zwei Gott, der große Gabenspender für die Menschen; denn er sendet von der Höhe den Logos aus eigener Entschließung zugleich mit der eigenen Entschließung des Logos selbst, aus der Tiefe aber bereitet er das Fleisch [= die menschliche Natur für die Menschwerdung] aus eigenem Gnadenwillen zusammen [stimmend] mit dem Logos selbst. Sagt er doch darauf:”Und man wird seinen Namen nennen Emmanuel." Er sagte nämlich nicht: ich werde ihn nennen, sondern: sie werden nennen. Denn den Menschen allerdings wurde der bei ihnen unbekannte Gott geoffenbart. Aber er nimmt die Bezeichnung nicht als eine neue Prägung. Denn er sagte nicht: “ich werde seinen Namen Emmanuel nennen”, sondern: “sie werden ihn nennen”.</p><p>Die Wendung: „Geboren aus dem Weibe“ ist, wie ich schon oben klar gemacht habe, gebraucht, damit der Ausdruck „geboren“ durch den Zusatz „aus dem Weibe“ präzisiert, der Logos aber allen als ewig klar hingestellt werde. Wenn es aber von Gott heißt: „Er dürstet nicht“, über den Sohn aber gesagt wird, daß er hungerte und dürstete, so ist dies notwendig uns zuliebe so geschehen. Denn wie sollte die Heilsveranstaltung als wahre und wirkliche erfunden werden, wenn er nicht die der Menschwerdung naturhaft entsprechende Lebensweise führte. Gerade darin ist uns der Weg gezeigt zur Widerlegung aller von den Häretikern gemachten Einwürfe. So widerlegt sich ohne weiteres die Irrlehre der Manichäer. Denn indem es heißt, daß er gegessen und getrunken habe, so weist das auf eine wahrhafte menschliche Natur hin. Ebenso wird der Irrturn der Lucianisten zurückgewiesen und die Kraft des Arius erschüttert. Lucianus nämlich und alle Lucianisten behaupten, daß der Sohn Gottes keine Seele, sondern eben nur das Fleisch angenommen habe. Sie tun das deshalb, um dadurch dem göttlichen Logos menschliche Schwachheiten und Bedürfnisse beilegen zu können, nämlich Hunger und Durst, Tränen und Ermüdung, Traurigkeit und Trostlosigkeit, und was man noch weiter in seiner Erscheinung,als Mensch bemerkt. Es ist aber doch wohl eine Torheit, dergleichen auf die Gottheit des Sohnes Gottes zu beziehen. Das Fleisch an und für sich, so schließen sie, hungert ja nicht und dürstet nicht und wird nicht müde, und was dergleichen ist. Auch ich stimme dem bei, daß dem Fleische als solchem derlei nicht zukomme. Aber der Logos nahm die ganze menschliche Natur an, Leib und Seele und was immer dem Menschen zugehört. Hunger und Ermüdung, Durst und Trauer und so fort waren aber eben Eigentümlichkeiten der Seele und des Leibes. Christus „weint“ also und widerlegt dadurch den Irrtum des Manichäus, daß er nicht nur dem Scheine nach mit dem Leibe umkleidet war, sondern in Wahrheit einen menschlichen Leib angenommen habe. Er „dürstet“ und zeigt damit an, daß er nicht nur einen Leib, sondern auch eine Seele habe. Denn es dürstete doch wohl nicht seine Gottheit: an der Seele dürstete er und wurde müde von der Wanderung, wie das natürlich aus der Verbindung von Leib und Seele folgt.</p><p>Daß aber der Logos wirklich Leib und Seele angenommen habe, davon sollten sie sich aus den heiligen Schriften des Alten und und Neuen Testamentes überzeugen. Denn schon David redet von ihm und Petrus stimmt ihm bei mit folgenden Worten: „Du wirst meine Seele nicht im Totenreiche lassen und deinem Heiligen die Verwesung nicht zu schauen geben“. Es soll daraus die zusammengesetzte Natur des Gott-Menschen erkannt werden und uns ein klares Verständnis darüber aufgehen; ferner will er dartun, daß die Seele mit der Gottheit in jenen drei Tagen abgeschieden gewesen sei auch will er zeigen, daß das Fleisch des Erlösers heilig war und daß die Gottheit mit der Seele in der Vorhölle, wo sie nicht zurückgehalten werden konnte, das Mysterium [unserer Erlösung] vollendet habe. Dazu kommt noch ein anderes Zeugnis, das so lautet: „Unter den Toten frei“ Der Ausdruck “frei„ soll anzeigen, daß das Totenreich keine Gewalt über ihn habe, sondern daß er freiwillig mit der Seele bis in die Vorhölle hinabgestiegen sei. Petrus ergänzt: “Da es ja unmöglich war, daß er sollte von ihr gehalten werden„, das ist vom Totenreiche. Und der Heiland selbst sagt: “Ich habe Macht, meine Seele zu nehmen und sie hinzugeben„, und wiederum: “Ich bin der gute Hirte, der seine Seele gibt für seine Schafe„; “Meine Seele ist betrübt„, spricht er, “und was soll ich sagen?„ — wie im Zweifel redend: was soll ich sagen —, “Vater, rette mich aus dieser Stunde; aber deshalb kam ich ja in dieser Stunde„, womit er anzeigt, daß seine Gottheit freiwillig in diese Lage gekommen ist. Das Wort: “Meine Seele ist betrübt„, wird deshalb gebraucht, um jeden Zweifel abzuschneiden, daß er die menschliche Natur wahrhaft und wirklich angenommen habe; denn nicht nur dem Scheine nach war er Mensch. Aber gerade so wie ein großer König, der einen Krieg führt gegen einen Schwächeren und dabei wohl einsieht, daß der Feind, wenn er ihn mit großer und starker Heeresmacht heranziehen sieht, einer Schlacht ausweichen, die Flucht ergreifen und viele Lande seiner Untertanen verwüsten wird, denselben klug durch Kriegslist und Scheinmanöver täuscht, sich abwendet und flieht, bis der Feind ermutigt ihn angreift und verfolgt, weil er den König für feig und ohnmächtig hält, während hingegen der König sich plötzlich umwendet und den schwachen Feind vollständig unterwirft, — so fürchtete auch unser Herr den Tod nicht, er, der noch vor seinem Leiden auf seiner Wanderung andeutete, des Menschen Sohn werde überliefert und gekreuziget werden, am dritten Tage aber wieder auferstehen. Und da Petrus zu ihm sprach: “Herr, schone deiner selbst, das soll dir nicht widerfahren„, da schilt ihn Christus mit den Worten: “Weiche zurück, Satan, weil du nicht auf das, was Gottes ist, sinnest, sondern was des Menschen ist.„ Wie konnte nun Christus, der dies vorausgesagt, ja der eben deswegen gekommen war, später flehen, daß der Kelch an ihm vorübergehe, ohne daß er ihn trinke? Er, der über seinen Tod sprach, lange ehe er eintrat, durfte schon aus dem Grunde nicht bitten, daß der Kelch an ihm vorübergehe, damit er nicht als Lügner befunden würde. Aber er fordert dergestalt den Widersacher heraus, damit, während dieser meint, der Erlöser fürchte den Tod, er ihm den Tod brächte zum Heile der Sterblichen auf Grund des Heilsplanes. Aber auch wenn du hörst, daß der Herr gestorben ist, so merke wohl, wovon das Todesleiden sich erfüllt hat. Petrus, der Fürst der Apostel, erklärt uns das ganze Bekenntnis seines Todes; er sagt: “Getötet nach dem Fleische, lebendig gemacht nach dem Geiste”. Denn seine Gottheit, die das Leiden im Fleische annahm, ist leidensunfähig und war leidensunfähig und blieb leidensunfähig, da die Leidensunfähigkeit sich nicht verwandelt hatte und seine Ewigkeit nicht ausgeschöpft wurde.</p><p>Darauf werden wieder jene eitlen Schwätzer sagen: Mit derartigen Beweisstellen kannst du uns nicht überzeugen, daß Christus wirklich eine Seele gehabt habe, weil man ja in den göttlichen Schriften auch liest, daß Isaias in der Person Gottes des Vaters über den Eingeborenen spricht: „Dies ist mein geliebter Sohn, an welchem ich mein Wohlgefallen habe, den meine Seele liebt“. Was soll man nun über den Vater denken, daß er eine Seele in sich gehabt habe oder daß er sie noch habe? Wer möchte wohl so ungeschickt daher reden und so vom Vater denken? Was also, so sagen sie, bleibt übrig? Offenbar, daß dieses Wort [Seele] vom Vater im bildlichen Sinne gebraucht werde. Wenn man’s nun vom Vater im bildlichen Verstande nehme, so müsse man es wohl auch vom Sohne so nehmen. Wenn er da daher auch sage: „Meine Seele ist betrübt“, und: „Ich habe Gewalt, meine Seele hinzugeben und sie wieder zu nehmen“, so habe er deshalb noch keine Seele haben müssen, sondern es sei die Rede bildlich zu verstehen. Es scheint nun allerdings diese Schlußfolgerung etwas für sich zu haben, doch die Wahrheit erweist sich selbst aus zahlreichen Zeugnissen; denn jede Redensart muß von dem betreffenden Eigenwesen aus verstanden werden. Vom Vater nun darf man nicht so [= von einer Seele] reden, weil er ja auch nicht Fleisch angenommen hat. Da hingegen die Menschwerdung sowohl von den Lucianisten als auch den Arianern zugestanden wird, so kann [beim Sohne] kein Zweifel obwalten. Aber, fahren sie fort, es heißt: „Das Wort ist Fleisch geworden“, und nicht: Das Wort ist Fleisch und Seele geworden. Gegen diesen von großer Unwissenheit zeugenden Einspruch erwidere ich, daß es in der Schrift heiße: „Gott.bildete den Menschen aus Erdenstaub“.. Geradeso, wie in dem Worte: „Er bildete“ alles zusammengefaßt wird, so liegt auch in dem Ausdrucke: Er ist „Fleisch“ geworden, alles enthalten. Es können ja auch wir den Irrlehrern mit dem gleichen Recht einen Einwurf machen und sagen: Sehet, die Hl. Schrift sagt nur: „Es bildete Gott den Menschen“, und es wird nicht angeführt, er machte ihm die Leber und die Lungen und das Herz und die Adern und die Nerven und alles übrige, was zum menschlichen Leibe gehört. Werden wir nun deshalb, weil die Schrift nicht im einzelnen genau die Teile, aus welchen der Mensch besteht, aufzählt, annehmen wollen, daß er ein massives, ungegliedertes Etwas gewesen sei? Sicherlich doch nicht. Wie also hier die Schrift in einem Begriff das einzelne zusammengefaßt hat, so kann man auch ganz klar aus der Annahme eines Leibes die einer Seele erschließen.</p><p>Wenn nun Christus Seele und Leib angenommen hat, wie gezeigt worden ist, so war die Gottheit des Logos durchaus nicht dem Wesen des Vaters untergeordnet und in die Schranken menschlichen Empfindungslebens eingeengt, so daß sie etwa Durst und Müdigkeit und Hunger und all die andern menschlichen Bedürfnisse erduldet hätte. Man kann daher auch daraus, daß es in der Hl. Schrift heißt: „Er ermüdet nicht, und unergründlich ist seine Weisheit“, vom Sohne aber gesagt wird, daß er ermüdet gewesen sei, keinesfalls den Schluß ziehen, daß der vom Himmel herabgestiegene Logos nicht aus dem Wesen des Vaters hervorgegangen sei. Denn nicht im Himmel ermüdete er, sondern im Fleische. Er mußte ja dem Fleische nach ermüden, damit man einsehe, er habe nicht etwa nur dem Scheine nach, sondern in Wahrheit das Fleisch angenommen. Auch alles andere, was hierher gehört, wie das Übernachten, Schlafen und die betastbare Erscheinung sind Kennzeichen seiner menschlichen Natur. Das alles hat er auf sich genommen und ist so „als Mensch befunden worden“. „Wir haben den Messias gefunden, von welchem Moses geschrieben hat“. Sie fanden ihn aber nicht seinem unbegreiflichen Wesen nach, sondern nach seiner sinnenfälligen, d. h. seiner leiblichen Natur; da er auf Grund seiner unbegreiflichen Natur nicht gefunden wurde, deshalb wird er von den Schriftgelehrten ergriffen und gab „seinen Leib den Geißelhieben preis und wandte sein Antlitz nicht ab von jenen, die ihn verspotteten und anspien“, er weinte und was sonst noch über ihn geschrieben steht. Könnte aber jemand den Gott-Logos im Himmel geißeln oder schlagen oder anspeien, ihn, den Unaussprechlichen und Unbegreiflichen? Wenn aber das alles der leidensunfähige Logos Gottes erduldet hat, so muß das Leiden notwendigerweise dem Leibe zukommen, außerhalb der leidensunfähigen Natur liegen, und doch wieder nicht außerhalb: wegen seiner bereitwilligen Zustimmung wird das Leiden ihm zugerechnet, obwohl er [seiner göttlichen Natur nach] nicht gelitten hat. Und geradeso wie ein Flecken im Kleide den Leib des damit Bekleideten zwar nicht verunstaltet, aber doch dem Träger zugeeignet wird, so hat auch Gott im Fleische gelitten, obgleich seine Gottheit nicht litt. Aber der Gottheit ist das Leiden des von der Gottheit getragenen Fleisches zugerechnet, damit in der Gottheit uns das Heil erstehe.</p><p>Wir kommen nun wieder zu dem angezogenen Wort aus dem Evangelium des hl. Lukas; wir wollen auch dieses nicht unerklärt übergehen. Die Stelle lautet: “Als er mit dem Tode rang, vergoß er Schweiß. Und es wurde sein Schweiß wie Blutstropfen. Es erschien aber ein Engel des Herrn, der ihn stärkte”. Wie ich immer sage, werden gerade die tiefsten und wichtigsten Schriftworte von denjenigen, welche die Bedeutung derselben verkennen, statt zu ihrem Nutz und Frommen zu ihrem eigenen Schaden gewendet. Kein Wort steht besser an seinem Platz als das vorwürfige. Denn wenn es heißt: “Er rang mit dem Tode”, so wird doch damit ganz gewiß der Gottmensch als wahrer Mensch bewiesen. Um das noch eindringlicher zu zeigen und darzustellen, daß nicht die Gottheit jene Todesangst gelitten habe, folgt unmittelbar: “Er vergoß Schweiß, und es wurde sein Schweiß wie Blutstropfen.” Wir haben es also mit einer körperlichen und nicht mit einer geistigen Erscheinung zu tun. “Es erschien aber ein Engel des Herrn, der ihn stärkte.” Das ist nicht so zu verstehen, als ob er um die Stärkung durch den Engel gebeten hätte, er, der größer ist als die Engel, “vor dem sich alle Knie beugen derer, die im Himmel, auf Erden und unter der Erde sind”, weil er ja wahrer Gott, der ewige Logos ist, der immer beim Vater war und aus ihm gezeugt worden ist; sondern damit wird erfüllet, was in jenem großen Lobgesange des Moses in der Wüste gesungen worden ist, wo es heißt: “Anbeten werden ihn alle Söhne Gottes”, und; “Stärken sollen ihn die Engel Gottes”. Der Ausdruck: “Sie sollen ihn stärken” bedeutet nicht Stärkung seiner Kraft durch Engelskraft, sondern ihre Lobpreisung ist Verstärkung des Lobes Gottes, indem ja die Engel im Himmel und alle belebten geistigen Wesen lobpreisend rufen: “Dein ist die Macht, dein die Herrschaft, dein die Stärke “. Hierin ist angedeutet, was das”Anbeten" und “Stärken” bedeuten solle, nämlich die eigene Kraft und Stärke ihm aufopfern und hingeben. In der Weise erschien auch der Engel vor den Augen der Jünger, um seinen Herrn anzubeten, da er die überströmende Liebe seiner menschenfreundlichen Heilsveranstaltung wohl kannte. Voll Bewunderung über das in ihm zur Tat gewordene Liebeswerk, welches den Teufel überwunden und den Stachel des Todes zerbrochen, über die Herrschaften und Mächte triumphiert und der Sünde die Todeswunde geschlagen hat, ja überwältigt von Bewunderung spricht in seinem Lobpreis anbetend der Engel: Dein, o Herr, ist die Kraft. Denn du hast den Tod und die Hölle und den Teufel überwunden, du hast seinen Stachel gebrochen und ihn aus dem Reiche der Menschheit hinausgewiesen.</p><p>Wenn aber Christus nach Menschenart redet und fragt: “Wo habt ihr den Lazarus hingelegt?”, und betreffs des blutflüssigen Weibes: “Wer hat mich berührt?”, oder: “Wen suchet ihr?”, “Für wen halten die Leute des Menschen Sohn?”, und wenn es ferner von ihm heißt: “Der Knabe wuchs und ward stark”, “Er nahm zu an Alter und Weisheit”, oder endlich: “Bevor der Knabe Vater und Mutter zu nennen wußte”, — erkennst du nicht gerade aus dem Texte selbst mehr als deutlich, daß hier vom Leibe und von der Menschheit aus geredet wird? Denn was immer im Alten Testament von der Person Gottes des Vaters zur Lehre für die Menschen verlautet, so, als verrate es ein Nichtwissen, während doch Gott es sicher weiß — das alles hat der Logos, nachdem er gekommen, ausgeführt, um so das Wort zu erfüllen: “Mein Vater wirket bis jetzt, und auch ich wirke”°]. So fragt er: “Wo habt ihr den Lazarus hingelegt?” nachdem er schon nahe zur Begräbnisstätte hingekommen war; schon ehe er dorthin ging, sagte er, ohne es von jemand gehört zu haben, zu seinen Jüngern: “Lazarus, unser Freund, schläft”. Wenn er also, da er doch eine so große Strecke Weges entfernt war, wußte, daß Lazarus tot sei, sollte er, da er an Ort und Stelle war, es nicht gewußt haben? Er wollte aber nur zeigen, daß er alle diese Wundertaten vollführte, während noch niemand einen vollkommenen Glauben zu ihm habe, und er wollte so seine schonende Liebe und Menschenfreundlichkeit gegen uns offenbaren. Dann allerdings wohl hätten jene Schwestern des Lazarus nicht sagen sollen: “Er ist schon vier Tage tot, er riecht schon”, ebensowenig durften sie hingehen und den Begräbnisplatz zeigen, sondern sie hätten sprechen sollen: “Du weißt alles, und wenn du willst, so wird er leben.” Deshalb weinte auch der Herr über die Herzenshärte der Menschen. Nicht Unwissen ist also der Grund seiner Frage, sondern er tadelt prüfend und handelt menschenfreundlich. Ebenso ist die Frage: “Wer hat mich berührt?” nicht so zu verstehen, als ob er es nicht gewußt hätte, sondern [er fragt] damit er nicht selber das gewirkte Wunder verkünden müsse, vielmehr jenes Weib diese Frage höre, herbeikomme, die ihr widerfahrene Liebestat verkünde und nach ihrem Bekenntnisse höre: “Dein Glaube hat dich geheilt”, auf daß so auch andere zum Glauben gebracht und geheilt würden. Das Wort: “Für wen hält man des Menschen Sohn?” ist in derselben Art und Weise gesagt, wie im Alten Testamente der Vater fragt: “Adam, wo bist du?” Denn Gott der Vater wußte wohl, wo Adam wäre, und daher tadelt er ihn auch sogleich, sprechend: “Du hast vom Baume gegessen”. So spricht er auch den Kain an: “Wo ist Abel, dein Bruder?” und er fragte nicht, um es erst zu erfahren, denn er fügt gleich bei: “Verflucht bist du auf der Erde, die aufgetan hat ihren Mund, um aufzunehmen deines Bruders Blut aus deiner Hand. Siehe, das Blut desselben schreit zu mir”. Wenn Gott sagt: “Das Blut deines Bruders schreit zu mir”, so fragte er wohl nicht nach demselben aus Unkenntnis, sondern darum, weil er dem Kain die Möglichkeit der Buße zu seiner Entschuldigung geben wollte.</p><p>Aber sie wollen sich nicht belehren lassen, sondern verharren in ihrer Streitsucht und sagen, daß alle die vorgeführten Stellen im Alten Testamente auf den Sohn zu beziehen seien. Doch dieses ihr Bemühen läßt sich gar schnell vereiteln. Denn der zu Moses gesprochen hat: „Was ist das, was du in deiner Hand hältst?“, eben derselbe fügt sofort bei: „Ich bin, der ich bin.“ Und da der Herr selbst mit den Sadduzäern über die Auferstehung der Toten redete, sprach er: „Daß die Toten auferstehen werden, sagt Gott mit den Worten: Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs; nun ist er doch ein Gott Lebendiger und nicht Toter“. Und so könnte man viele Stellen aus dem Alten Testament anführen, in denen der Vater redend eingeführt wird, obgleich auch viele sind, in denen der Sohn oder der Hl. Geist spricht. So sprach zu Abraham derjenige, welcher mit den zwei Engeln vom Himmel herabgekommen war, der Sohn Gottes: „Wo ist Sara, dein Weib?“ Hätte er aus Unkenntnis gefragt, so hätte er nicht gesagt: „Sara....“ Mit den Worten: „Es lachte Sara im Innern des Hauses“, will er Saras züchtige Bescheidenheit allen Frauen, welche ein wahrhaft frommes Leben führen wollen, als Muster und Vorbild darstellen, daß sie nämlich, wenn sie Gastfreunde empfangen, eigenhändig dieselben zwar bedienen, aber in Züchtigkeit ihr Antlitz den Männern nicht zeigen sollen. Jene Preiswürdige bereitete zwar den Fremdlingen ein Mahl, ließ sich aber nach der Bereitung desselben vor den Engeln nicht sehen, ein schönes Beispiel züchtiger Eingezogenheit den Frauen zukünftiger Zeiten hinterlassend. Aber um zu zeigen, wer er sei, nannte der anwesende Gast den Namen der Frau, er, der eben erst zu jener Stunde eingekehrt war, [um zu zeigen,] daß weder ihr Name, noch ihre Beschäftigung, noch der Gedanke eines Menschen ihm verborgen seien. [Nun zur Frage:] „Für wen halten die Leute mich, den Menschensohn?“ Er selbst gebraucht hier den Ausdruck „Menschensohn“, worin ein Bekenntnis liegt, damit sie [die Jünger] nicht etwa glauben möchten, er frage um seine göttliche Natur. Da nun seine Jünger antworteten: „Für Elias oder Jeremias oder Johannes“, so fragte er weiter: „Ihr aber, für wen haltet ihr mich?“ Petrus antwortete: „Du bist Christus, der Sohn des lebendigen Gottes.“ Und allsogleich preist ihn der Herr selig. Denn er hatte ja nicht aus Unkenntnis gefragt, sondern um zu zeigen, daß jene Lehre, welche der Kirche den wahren Sohn Gottes verkündigt, vom Vater ausgegangen sei, um den Petrus zu zwingen, öffentlich auszusprechen, worüber er vom Vater belehrt worden.</p><p>Wenn aber Christus sagt: „Durch mich kommt man zum Vater“, so darf man sich über diesen Ausspruch nicht etwa wundern und meinen, Christus sei dem Wesen nach vom Vater verschieden. Denn eben derselbe belehrt uns auch: „Niemand kommt zu mir, wenn ihn nicht der Vater ziehet“. Wie also der Vater zum Sohne leitet, so führt der Sohn zum Vater, damit so gezeigt werde, daß die Gottheit eine und dieselbe sei. Wenn es heißt:”Er nahm zu an Alter und Weisheit„, so ermangelte er, wenn damit die Weisheit Gottes gemeint ist, der Weisheit nicht. Nachdem er vielmehr sich selbst entäußert und Knechtsgestalt angenommen hatte, so wurde die Fülle [seiner Gottheit] nicht vermindert, sondern [dies geschah nur], um zu zeigen, daß er vom Himmel zur Menschheit herabgestiegen sei, und zwar in den Leib Mariens. “Ausgeleertes Salbenöl„, sagt die Schrift, “ist sein Name„. Bemerkenswert ist, daß es nicht heißt “ausgegossen„, sondern “ausgeleert„, vom Himmel nämlich auf die Erde und von der Erde in Maria, und von Maria wird er, Fleisch geworden, empfangen und zu Bethlehem geboren: von Bethlehem begibt er sich nach Nazareth, von Nazareth nach Kapharnaum, von Kapharnaum nach Jerusalem und dem Meere, als er nämlich über die Gewässer wandelte; ferner kommt er in das Gebiet von Tyrus und nach Naim, nach Judäa und Jericho, nach Bethphage und Bethania, in den Tempel zu Jerusalem, auf den Ölberg, in den Garten Gethsemane, in das Haus des Kaiphas, in das Prätorium zu Herodes, zur Schädelstätte, in das Grab, in die Vorhölle, auf die Erde nach der Auferstehung, in den Himmel. Als Salbenöl, das von Gefäß zu Gefäß geleert wird, erfüllt er alle Gefäße mit Wohlgeruch. So hat die Herabkunft Christi vom Himmel die ganze Erde geheiligt, die nämlich, welche ihn in Wahrheit aufnahmen. Er ist jener Berg, von dem es bei Daniel heißt: “Ein großer Berg. Ein Stein, losgehauen nicht durch Hände„ d. h. ohne menschlichen Samen erzeugt. Wieder wird der Große klein erfunden, doch der Stein nimmt Größe an und wird wieder ein großer Berg. Auch ist der Berg nicht räumlich beschränkt, sondern erfüllt die ganze Erde. Er, der die Weisheit selbst ist, ist Mensch geworden und “nahm zu an Alter und Weisheit„, insoferne er seine Macht auf die ganze Erde ausdehnte, damit er so den Erdkreis mit seiner Gnade erfüllte. Wie hätte er, der die Weisheit des Vaters ist und die Menschen die Sprache lehrte und ihnen die Zunge bildete und Ohren zum Hören verlieh, wie hätte er nicht Vater und Mutter zu nennen verstehen sollen?”Die Macht von Damaskus und die Beute von Samaria wird er nehmen“ usw. Aber weil dann, wenn er allsogleich nach seiner Geburt sich sprechend gezeigt hätte, und wenn er tadellos, geradezu fließend gesprochen hätte, man seine Empfängnis im Fleische nur für ein Phantasiegebilde, nicht für Wahrheit, vielmehr nur für bloßen Schein gehalten hätte, — deshalb machte er die Beschränktheit des kindlichen Alters durch, um nicht die Wahrheit und Folgerichtigkeit seiner Natur zu verwischen.</p><p>Aber sie [die Gegner] machen ja förmlich Jagd darauf, den heiligen Schriften törichte Unterstellungen zu machen, sie denken nur auf Widersprüche und sagen: „Nehmet an den hohen Priester unseres Bekenntnisses, der da treu ist dem, der ihn gemacht hat“, und an einer anderen Stelle: „Kundgetan sei euch, dem ganzen Volke Israel, daß diesen Jesus, welchen ihr gekreuzigt habt, Gott zum Herrn und Christus gemacht hat“. Da muß ich mich nun baß wundern, wie diejenigen, welche sich so an den Schriftbuchstaben anklammern, den darin ausgesprochenen Sinn so mißkennen. Denn die Worte; „Nehmet den Hohenpriester, der treu ist dem, der ihn gemacht hat“, sind ja nicht von seiner Gottheit gesprochen. Es ist doch Gott selbst gekommen und die heiligen Schriften sind für uns in allweg klar und deutlich; nichts ist in ihnen verdreht oder verwickelt, sondern: „Alles ist offenbar für die Verständigen und gerade für die, welche Erkenntnis fanden“. „Nehmet an“, heißt es auch da, „Zucht und nicht Silber!“ Denn wenn jemand Zucht von Gott, das ist den Glauben an die Wahrheit nicht annimmt, so ist ihm alles schief und verwickelt, was für die Verständigen und was denen, die Erkenntnis finden, gerade und unverfänglich ist. Aber um sie zu widerlegen, sagt der Apostel: „Jeder Hohepriester, aus den Menschen genommen, wird aufgestellt zu dem, was für die Menschen ist, nämlich Opfer und Gaben darzubringen“. Deshalb nahm auch der Eingeborene, da er den Menschen zuliebe geboren werden wollte, von uns das Fleisch an, damit er von uns geboren für uns sich selbst seinem eigenen Vater als Opfer darstellen und seine Schüler Brüder nennen könne. Von wem wird dieses erfüllt? Von niemand anderem als dem Hohenpriester. „Nehmet also den Hohenpriester an, der dem treu ist, der ihn machte,“ Um noch zum Überflusse das Gesagte durch ein Beispiel zu erläutern, so nehmen wir an, daß jemand einen König über seinen Sohn befrage und sich so zu sagen getraue: Wer ist dieser? Nachdem nun der königliche Vater die ganz wahre Antwort gegeben: Mein Sohn, so frage jener weiter: Ist das dein wahrer und echter Sohn? Und auf die Bejahung des Königs erkundige sich der Fragesteller weiter: Wozu machtest du ihn denn? Er aber sage einfach: Zu einem König habe ich ihn gemacht. Hat er nun damit, daß er seine Würde nannte, seine echte Sohnschaft geleugnet? Hat er das erste zurückgenommen, wenn er das zweite sagte? Keineswegs. So hat auch der Vater den Sohn ohne Anfang gezeugt, und in dem Menschenleben desselben hat sich der Satz bewahrheitet: „Er machte ihn zum Hohenpriester.“</p><p>Aber, so lautet ein weiterer Einwand: Es steht geschrieben: “Der Herr hat mich erschaffen als Anfang seiner Wege vor seinen Werken”. Aber fürs erste ignorieren diese eitlen Schwätzer den Namen und den Titel dieses Buches ganz. Dieses Buch führt nämlich die Überschrift: Sprichwörter Salomons. Sprichwörter nun wollen nicht dasselbe besagen, was die eigentliche Bedeutung der Wörter angibt. So spach unser Herr Jesus Christus in Parabeln, und wir finden, daß diese parabolischen Redeweisen nicht mit unserer Anschauung übereinstimmen. “Das Himmelreich”, sagt er, “ist gleich einem Senfkörnlein”. Wenn wir aber nach unseren Begriffen und Vorstellungen alles im einzelnen erwägen, so wird wohl offenbar jeder das Himmelreich für einen Ort von sehr großer Ausdehnung halten, wenn anders man das einen Ort nennen kann, wo Gott der Vater herrscht und der Gott-Logos und Sohn Gottes sowie der Hl. Geist Gottes, die Engel und die Erzengel, die geistlichen Heere, Abraham und Isaak und Jakob und alle Gerechten. Wie kann denn alles das in einem Senfkörnlein inbegriffen sein? Allein die ganze Stelle ist tropisch und sinnbildlich zu verstehen. Es stimmt also das parabolisch Gesagte mit dem Wortsinne nicht überein. Ebenso wird das Himmelreich verglichen mit “einem Weibe, welches zehn Drachmen hat und eine verliert, ein Licht anzündet und dieselbe wieder findet”; ferner “einem Netze, das in das Meer ausgeworfen wird”, und “einem Samenkorn, das in das Erdreich gelegt wird”: lauter bildliche Redeweisen, welche mit dem Wortsinne nicht dasselbe besagen. Übrigens wissen wir nicht einmal, ob Salomon, der Verfasser der Sprichwörter, die angezogene Stelle vom Sohne Gottes gemeint habe. Denn das Wort “Weisheit” wird in einem mehrfachen Sinne gebraucht. So schreibt der Apostel: “Es erkannte die Welt durch Gottes Weisheit Gott nicht”; “es machte Gott die Weisheit der Welt zuschanden”, und: “Nicht in fleischlicher Weisheit, sondern in der Kraft Gottes”. Salomon kennt noch eine andere Weisheit, von der er sagt: “Ich liebte ihre Schönheit und nahm sie mir als Braut”. Eben diese Weisheit kannte auch schon Job und sagte von ihr: “Von wannen wurde die Weisheit gefunden, und welches ist der Platz der Erkenntnis?” Anderswo heißt es von derselben: “Die Weisheit des Armen ist verachtet”, “Er ist der Helfer der Weisheit”, und: “Die Weisheit des Vaters ist der Eingeborene”.</p><p>Was sollen wir nun sagen? Wäre der Sohn die Weisheit des Vaters und doch nicht aus ihm als Logos und Gott und als Weisheit hervorgegangen, müßten wir da nicht bekennen und folgern, daß der Vater selbst keine Weisheit habe? Wie könnte es dann heißen: „Gott, dem allein Weisen, Unsichtbaren“? Aber es ist dieses alles für die Menschen unbegreiflich und unerforschlich. Es gab Gott Weisheit dem Salomon und er erfüllte mit Weisheit den Beseleel. Auch heißt es: „Weise Menschen verbergen die Schmach“, wie man ja überhaupt über diese Weisheit gar vieles vorbringen könnte. Jene Weisheit des Vaters aber ist einzig in ihrer Art und duldet keine Gegenüberstellung. Immerhin: Ob die in Rede stehende Stelle sich darauf bezieht, das wage ich weder zu behaupten noch zu bestreiten. Das zu wissen steht bei Gott. Der Wahrnehmung aber kann ich die Augen nicht verschließen, daß die Worte selbst widerspruchsvoll sind. Es heißt: „Er schuf mich als Anfang seiner Wege vor seinen Werken, vor der Weltzeit gründete er mich, vor allen Hügeln zeugte er mich“. Wie kann nun das, was gezeugt wird, gegründet, wie das Erschaffene gezeugt werden? Denn ist etwas geschaffen, so ist es nicht gezeugt. Wir allerdings schaffen das, was wir erzeugen, und erzeugen, was wir schaffen. Denn wir sind geschaffene Wesen, und was von uns erzeugt wird, ist geschaffen. Bei Gott aber, dem selbst Unerschaffenen, kann das, was erzeugt wird, nicht geschaffen sein; denn was er erzeugte, das hat er nicht geschaffen. Wenn es nämlich heißt, er habe nach dem Schaffen wiederum gezeugt, — wie kann denn das zuerst Geschaffene später wieder gezeugt werden? Soll man daher die besprochene Stelle auf Christus anwenden, so muß man sie auf seine Menschwerdung beziehen. Und darum erwähnt er auch das zeitlich näher Gerückte zuerst und läßt das Ursprüngliche folgen. Denn in der Absicht, die [der Erfüllung] Nächststehenden zu überzeugen, beginnt er mit der Menschwerdung. Das ist ja der Anfang der Wege der evangelischen Gerechtigkeit: Das Wort ist in Maria für uns Fleisch geworden, die Seele aber ist in ihrem Fleische grundgelegt worden; somit bezeichnet er das Frühere als das Spätere. Vom Logos aber sagen wir, daß er aus dem Schöße des Vaters vom Himmel auf die Erde herabgekommen sei, da er später zu uns kam als Vollender des großen Heilswerkes. Der Logos ist also nicht geschaffen — das sei ferne —, und es kann keine Rede davon sein, daß die Hl. Schrift eine irrtümliche Auffassung nahelege.</p><p>In Wirklichkeit aber finden wir bei den Übersetzern eine abweichende Lesart. Aquilas z. B. übersetzt: "Der Herr hat mich bekommen.„ Im hebräischen Texte heißt es: “Adonai kanani„, was man allerdings so übersetzen kann, wie wir gesagt haben, pflegen doch auch wir, wenn jemandem ein Kind geboren wird, zu sagen, er habe ein Kind bekommen, übrigens ist damit der Sinn der Lesart noch nicht eindeutig bestimmt, denn das hebräische “Adonai kanani„ kann auch so übersetzt werden: Der Herr hat mich ausgebrütet [wie ein Küchlein]. Daher spricht auch Petrus nicht umsonst: “Diesen Jesum, welchen ihr gekreuziget habt.„ Er sagt nicht den göttlichen Logos, welcher vom Himmel herabstieg, sondern “diesen„, welcher aus jenem Fleische besteht, das im Leibe Mariens verbunden worden ist mit dem vom Himmel herabgekommenen Logos, diesen Jesus, welcher so genannt wird, weil der Herr die menschliche Natur aus Maria angenommen hat. An diesem erfüllte sich auch das Wort vom Getötetwerden, wie Petrus es ausspricht: “Getötet nach dem Fleische, lebendig gemacht nach dem Geiste„; ebenso: “Christus, der für uns im Fleische gelitten hat.„ Und der Apostel sagt: “Aus denen ist Christus dem Fleische nach„. Ja, auch der Heiland selbst sagte im Evangelium: “Nun wollt ihr mich, einen Menschen, der euch die Wahrheit gesagt hat, töten„, und: “Ich habe es vom Vater gehört“, damit er so zeige, daß das Leiden von der menschlichen Natur erduldet werde, während er der natürliche Sohn des himmlischen Vaters und vom Himmel herabgekommen sei. Damit stimmt auch der hl. Apostel Paulus überein, wenn er sagt: „Es ist e i n Gott und e i n Mittler zwischen Gott und den Menschen, der Mensch Jesus Christus“, „welcher es nicht als einen Raub ansah, Gott gleich zu sein, sondern sich selbst entäußerte und Knechtsgestalt annahm“. Hier wird er also als Mensch bezeichnet, aber nicht als bloßer Mensch. Denn Mittler zwischen Gott und den Menschen wird er deswegen genannt, weil er vor Gott inmitten beider steht. Im Verhältnis zum Vater betrachtet ist er Gott von Natur, aus seinem Wesen gezeugt; im Verhältnis zu den Menschen ist er natürlicher Mensch, echter Sohn Mariens, ohne eines Mannes Samen gezeugt. Denn so nur ist er Mittler zwischen Gott und den Menschen, indem er Gott ist und Mensch geworden ist, ohne seine Natur zu verändern, sondern nach seinen beiden Naturen in bezug auf beide vermittelnd.</p><p>Leute, die sich nicht belehren lassen, wenden weiter ein: Merket ihr, was es besagen wolle, daß er es nicht als Raub betrachtet habe, Gott gleich zu sein? Aber hier verstehen unsere streitsüchtigen Gegner nicht einmal die Redeweise. Denn es heißt nicht: Er wollte nicht der Gottheit gleich sein durch einen Raub, sondern: „Er erachtete es nicht als Raub, Gott gleich zu sein“, das heißt, der Natur nach Gott zu sein, weil er es eben war. Wäre er es nicht gewesen, wie hätte er Knechtsgestalt annehmen können? Der Apostel betonte das, was für ihn neu war [nämlich die Menschengestalt], und erwies damit voll Bewunderung den Überschwang [der Herablassung]: obwohl er Gott war, hat er sich entäußert und Knechtsgestalt angenommen, nicht etwa um das Freie unfrei zu machen, sondern um in der Knechtsgestalt, welche er angenommen hatte, die ihm folgenden Unfreien zu befreien. Es bezeugen aber auch die Juden, daß er sich selbst nicht scheute und kein Bedenken trug, sich Gott gleich zu nennen, sondern ganz zuversichtlich es aussprach mit den Worten: „Wenn ich es nicht sagte, so wäre ich ein Lügner gleich euch“. Deswegen erwidern ihm auch die Juden: „Nicht wegen eines guten Werkes töten wir dich, sondern weil du dich, obgleich ein Mensch, Gott gleich machest“. Doch, wenden unsere Gegner weiter ein, man muß zugeben, daß von ihm tropische Redensarten gebraucht werden, indem die Schrift dergleichen viele über ihn sagt und man nicht leugnen kann, daß er bildlich genannt wird: Türe, Stein, Säule, Wolke, Löwe, Schaf, Leuchter, Fackel, Same, Engel, Wurm, Fels, Eckstein, Weg, Stier, Kalb und dergleichen. Wir sind weit davon entfernt zu leugnen, daß das gleichnisweise über ihn Vorhergesagte an ihm erfüllt worden sei; ja, wir wissen vielmehr auch den Grund anzugeben, warum solches von ihm geschrieben steht. Weg wird er genannt, weil wir durch ihn zum Himmelreich, zu ihm selbst und zum Vater gelangen; Türe, weil wir durch ihn eintreten; Säule, weil er das Fundament unseres Glaubens ist; Fels, weil er unverrückbar ist; Stein wegen seiner Grundlegung; Sonne der Gerechtigkeit ist er, weil er unsere verfinsterten Geister mit seinem Lichte erhellt.</p><p>Nun sagen sie: Da über ihn geschrieben steht, daß er ein Geschöpf ist, so muß man ihn auch als solches bekennen. Nachdem wir einen Teil jener bildlichen Redeweisen erklärt haben, die an ihm zu unserem Heile sich verwirklicht haben, so mögen nun auch unsere Gegner uns sagen, was das bedeuten solle, wenn der Sohn eine Kreatur genannt wird. Wird er nicht mit gutem Grund bildlich Türe genannt, weil er unser Eingang zum Heile werden soll? Und Weg, weil wir darauf wandelnd nicht in die Irre gehen sollen? Warum aber soll er für uns ein Geschöpf werden? Was kann uns das frommen? Doch, sagen unsere streitbaren Großsprecher: Wenn du ihn nicht Geschöpf nennst, so legst du dem Vater ein Leid [eine Veränderung] bei. Denn ein jeder, der erzeugt, unterliegt Veränderungen seines Zustandes. Er muß sich ja entweder zusammenziehen oder erweitern oder vereinfachen, er muß auseinandergehen oder sich vergrößern, oder etwas anderes dergleichen erleiden. Weg mit einer ebenso schlechten als falschen Ansicht! Wer wird solches von Gott denken? Wer solches zu vermuten wagen? Nicht einmal ein Teufel kann so etwas denken! Nein, wer immer an den Vater glaubt, der glaubt auch, daß er den Sohn wahrhaft gezeugt habe. Gott ist ja weder ein Körper mit Gewicht und Umfang, noch auch gebiert er körperlich, so daß er das Aufgezählte alles erdulden müßte, sondern er ist ein Geist. Als Geist aber erleidet er weder ein Auseinanderfließen, noch ein Auseinanderschneiden oder Zusammenziehen, noch eine Verminderung oder Ausdehnung, noch etwas Ähnliches; sondern wie der Vater ein Geist ist, so hat er auch den Sohn, den Gott-Logos, geistig gezeugt, ohne Zeit, unbegreiflich und ohne Anfang.</p><p>Um nun diejenigen, welche so denken, zu überzeugen, will ich zwar nicht etwas Gleichwertiges anführen, aber doch gleichnisweise ihrer schlimmen Wehr begegnen; [nur gleichnisweise, denn:] das Geschöpfliche steht ja unsäglich, unendlich weit ab vom Herrn. Es pflegen nämlich Menschen in der Wüste, wenn sie Feuer brauchen, ein Glasgefäß mit Wasser zu füllen und irgendeinen leicht entzündbaren Stoff aus Flachsfäden oder Wergbündel den Strahlen der Sonne gegenüber anzubringen. Die Sonnenstrahlen nun beleuchten durch das Glas den darunter angebiachten Stoff, der alsbald von dem Feuer der Sonne ergriffen Feuer fängt. Kann man nun etwa sagen, daß wegen der Mitteilung von Feuersubstanz ein Teil von der Sonne losgetrennt wird, oder daß die Sonne aufhört oder vermindert wird? Wenn nun hier die Sonne, die doch ein Geschöpf ist, nicht vermindert wird, um wieviel mehr muß der unendliche, unbegreifliche und unbefleckte Gott, der ein Geist ist und den unaussprechlichen und unbegreiflichen und unvergänglichen Gott-Logos aus sich erzeugt, denselben in völliger Unversehrtheit ohne irgendwelche Veränderung oder Abtrennung oder Verminderung, sondern selbst vollkommen den Vollkommenen in Vollkommenheit erzeugen! Man kann aber vermöge der Natur des Feuers viele Lichter von einer Flamme anzünden, ohne daß das erste vermindert wird, es kann aber auch hienieden darum ebendieselbe Substanz aus vielen einzelnen Lichtern oder Fackeln bestehen. So ist’s aber keineswegs bei Gott. Denn der Logos ist nicht erst hinzugekommen und mit dem Vater eins geworden, sondern der Vater ist Vater und der Sohn Sohn und der Hl. Geist Hl. Geist.</p><p>Töricht aber ist die Behauptung der Manichäer, daß im Sinne des Manes die Seelen von einer Lichtsäule entsprossen ein Ganzes bilden, und daß sie von ihren Leibern getrennt wieder zu e i n e r Substanz, nämlich in jene eine Säule zurückgebildet werden. Aber dem widerspricht das Evangelium, in welchem es heißt, Jesus brach fünf Brote und sättigte fünftausend, und die übriggebliebenen Stücke habe man nicht weggeworfen, sondern er habe befohlen: „Sammelt, damit keines von den Stücken zugrunde gehe; und sie sammelten zwölf Körbe.“ Sie sammelten also die Stücklein in Körbe zusammen; aber er machte die Stückchen nicht mehr zu ganzen Broten, wie sie früher waren. Sie.sammelten die ganze Menge in vielen Stücken, um sie in Körben zu vereinigen. Diese Erklärung geben wir nicht als etwas, was sich mit unserer Anschauung deckt, ebensowenig wie das Beispiel von der Sonne. Denn wir glauben nicht, daß die Brote oder die einzelnen Stücke Seelen seien, das sei ferne; noch auch halten wir Gott gleich der Sonne, welche er geschaffen, und den Eingeborenen gleich dem Sonnenstrahle, welcher auf das Wergbündel geleitet wird. Allein es liegt eine Ähnlichkeit darin, daß auch die geschaffenen Seelen nicht zu einem Ganzen, sondern nur in die Wohnungen Gottes vereinigt werden, von denen geschrieben steht: „Viele Wohnungen sind beim Vater“, so daß dieselben also nicht zu einer Masse vereint sind, sondern jede einzelne für sich gezählt wird. Mit der Behauptung aber, daß Gott seinen eingeborenen Sohn gezeugt habe, übertragen wir keineswegs auf Gott eine Veränderung, wie die gotteslästerliche Ansicht der Häretiker meint, daß, wer erzeugt, irgendwelche Zustandsänderungen erleiden müsse. Wir dürfen am Ende nach der Meinung unserer Gegner den Sohn weder ein Geschöpf noch eine Erzeugung Gottes nennen, damit wir nicht in dem einen Falle Gott eine mühevolle Tätigkeit und in dem zweiten Falle ein Leiden zuschreiben. Woher kommt es dann aber, daß er Sohn genannt wird, und warum heißt er dann Gott? Doch alles das sind nur menschliche Syllogismen, irdischer Weisheit entsprossen! Die menschlichen Schwachheiten auf Gott zu übertragen, ist gottlos und unerlaubt, da Gott ausdrücklich sagt: „Nicht wie eure Gedanken sind meine Gedanken“, und: „Nicht so wie ein Mensch ist auch Gott.“</p><p>Mögen doch endlich die Häretiker aufhören, blasphemisch zu reden und lernen vom Vater, der ausdrücklich sagt: “Dieser ist mein geliebter Sohn, an welchem ich mein Wohlgefallen habe”, und der wiederum, gleichsam um die Zögernden zum Glauben zu bewegen, erklärt: “Du bist mein geliebter Sohn, welchen ich auserwählt”. Desgleichen heißt es in dem Hohenliede: “Auserwählt aus Tausenden”. Fragen wir nun, woher jene Auswahl geschah, so meinen die eitlen Schwätzer daß er ihn mit dem Worte: “welchen ich auserwählt” nach der Gnade Sohn genannt und nicht nach der Natur. Das sollen sie uns aber zeigen, wer dem Sohne gleich gewesen sei, so daß der Vater, nachdem er alle geprüft, ihn ausgewählt habe. Wenn er der eingeborene Sohn ist, so ist ihm doch wohl niemand gleich, niemand kann gefunden werden, “der dem Sohne ähnlich wäre unter den Söhnen Gottes”. Da solche nur der Gnade nach Söhne Gottes genannt werden, so kann keiner ihm gleichgestellt werden, welcher der Natur nach Sohn Gottes ist. Uns aber ist klar und offen, woher er auserwählt worden ist und woraus die Auswahl geschah. Viele Tausende waren nämlich auf Erden, und Maria allein fand Gnade, und aus ihr erwählt er sich das heilige Fleisch, woran er sein Wohlgefallen hatte, wie auch David vom Standpunkte der Apostel aus, welche an den Herrn glaubten und seine Gnade den Völkern verkündeten, spricht: “Er unterwarf uns Völker und Nationen unter unsere Füße; die Schönheit Jakobs, welche er lieb hatte”, das ist seine reine und unversehrte Schönheit, die Schönheit des ganzen Jakob, nämlich jenes Fleisch, welches er aus Maria durch den Hl, Geist sich auserwählt hatte. Das Werk der Menschwerdung zeigt der Vater vom Himmel dem Johannes Baptista, denn der Vater hatte sein Wohlgefallen an der Ankunft Christi im Fleische; die Gottheit aber ist ihrer Natur nach unbegrenzt.</p><p>Der Apostel nennt Christus auch „den Sohn der Liebe“. „Der euch befreit hat“, sagt er, „aus der Macht der Finsternis und euch versetzt hat in das Reich des Sohnes seiner Liebe“. Hier nun meinen einige Unverständige, welche den Sinn dieser Stelle nicht bedenken, daß Christus vermöge einer besonderen Liebe Gottes sein Sohn zu nennen sei, und übersehen ganz, diese Stelle über den Logos einer anderen Stelle gegenüber zu stellen, in welcher nämlich der Apostel sagt: „Gott liebte uns in Christus.“ Denn er ist ja wahrlich der geliebte Sohn, der eingeborene; denn der Vater ist die Liebe, der Sohn ist die Liebe und aus der Liebe ist die Liebe entstanden. Der Sohn ist nun der Sohn der Liebe in einem zweifachen Sinn, seiner selbstwillen und unsertwillen, insofern nämlich Gott in ihm uns liebte und seinen Eingeborenen für uns hingegeben hat. Es war also für den Vater weder eine Mühe, ihn zu machen, noch ein Leid, ihn zu erzeugen. Möchten die Irrlehrer nur nicht grundlos sich so vieler Gotteslästerungen schuldig machen! Ist der Sohn ein Geschöpf, so darf er nicht angebetet werden gemäß ihrer Auffassung. Wäre es ja töricht, ein Geschöpf anzubeten und jenes erste Gebot zu übertreten, welches lautet: „Höre, Israel, der Herr, dein Gott ist einer“. Wenn also der heilige Logos angebetet wird, so ist er kein Geschöpf. Es beteten ihn aber an seine Schüler, es beten ihn an die Engel im Himmel! „Und es sollen ihn anbeten“, heißt es in der Schrift, „alle Engel Gottes“, und wieder: „Es bete dich an, o Herr, meine Kraft.“ Noch ist anzuführen ein ganz kurzer, aber ebenso unwiderleglicher Beweis, welchem niemand widersprechen kann: Es können jene Hasser des Sohnes Gottes kein einziges Zeugnis anführen aus dem Alten oder dem Neuen Testament, wo der Vater sagt: „Ich habe mir einen Sohn erschaffen“, oder wo der Sohn sagt: „Der Vater hat mich erschaffen.“ Es sind vier Evangelien, und sie haben eintausendeinhundertundzweiundsechzig Hauptstücke, und vom Anfange bis zum Ende spricht der Sohn und zu ihm der Vater und nirgends spricht jener: „Erschaffen hat mich mein Vater“, noch der Vater: „Erschaffen habe ich mir einen Sohn, oder ich habe meinen Sohn erschaffen.“</p><p>Doch, fahren unsere Widersacher in ihrer ebenso großen Zanksucht als eitlen Ruhmgier fort: Ihr redet hier offenbar von jenem Leibe, den Christus aus Maria angenommen hat. Was ist aber von Maria zu halten; ist sie unerschaffen oder erschaffen? Und auf unsere Erwiderung, daß sie offenbar ein Geschöpf sei, aus der Vereinigung von Mann und Weib erzeugt, fragen sie weiter, wofür wir nun das halten, was aus Maria seinen Ursprung genommen; ob wir den Erlöser im Leibe anbeten oder nicht. Und da wir entgegnen: Warum sollen wir ihn nicht anbeten? Wenn wir ihn nicht anbeten, so werden wir das Leben nicht haben, so rufen sie schließlich aus: Also betest du ein Geschöpf, einen bloßen Körper an. O der großen Verblendung jener, die solches behaupten! Der König im Purpur wird von allen verehrt. Richtet sich da die Verehrung auf den Purpur oder auf den König? Offenbar auf den König. Mit dem König wird aber auch zugleich der Purpur verehrt, welchen er trägt. Zieht der König das Purpurkleid aus und legt es weg an seinen Platz, so wird es nicht mehr weiter verehrt. Setzt sich ein König in dem Thronsaal auf seinen Thron, so verehren diejenigen, welche den König verehren, sowohl ihn in seinem Thronsaale als auch seinen Thron. Hat sich aber der König erhoben und ist er fortgegangen, so verehrt niemand weder den Thronsaal noch den Thron. Niemand aber wird so töricht sein, daß er in der Absicht, den König selbst zu verehren, zu ihm spreche: Geh aus deinem Thronsaal, damit ich dich verehre. So wird auch kein Vernünftiger zum Sohne sprechen: Lege den Leib ab, damit ich dich anbete; sondern er betet den Eingeborenen an mit dem Leibe, das ist, er betet an den unerschaffenen Logos mit seinem heiligen Tempel, den er bei seiner Menschwerdung angenommen hat. Und sowie auch niemand zum Könige sagt: Steh auf von deinem Throne, damit ich dich ohne Thron verehre, sondern wie man den König zugleich mit dem Thron verehrt, so wird auch Christus angebetet mit dem begrabenen und auferstandenen Leibe.</p><p>Weiter fragen sie: Was sagst du nun dazu: Hat der Vater den Sohn mit Willen oder ohne Willen gezeugt? und: Nicht wahr, der Logos hat immer existiert und es hat keine Zeit vor ihm gegeben? Aber, es sagten selbst die Arianer zur Irreführung der Leute, daß der Sohn Gottes ohne Zeit erzeugt worden sei; nur wollten sie ihn nicht ewig nennen, sondern sagten, es war einmal eine Zeit, da er nicht war. Sie halten aber dieses „einmal“ für keine Zeit, Wenn man aber diesen Satz näher prüft, so kann man sie leicht der Unwissenheit überführen; denn dieses „einmal“ bezeichnet einen Zeitpunkt. Da sie aber behaupten, keinen bestimmten Zeitpunkt feststellen zu wollen, so verfallen sie mit ihrer Ansicht in Ungereimtheit und Irrglauben zugleich. Dabei verstehen sie die Worte in ganz anderem Sinne, indem sie ihrer wirklichen Meinung nach den Sohn Gottes aufs heftigste bekämpfen, lehrend, er sei von der Gottheit des Vaters ganz und gar verschieden. Ihre Frage also lautet: Hat der Vater den Sohn mit Willen oder ohne Willen gezeugt? Antworten wir: ohne Willen, so [denken die Arianer] unterwerfen wir die Gottheit der Notwendigkeit; behaupten wir ersteres, so war der Wille des Vaters eher als der Logos; und wenn wir auch nur einen kleinen Zeitabschnitt, ja den geringsten Zeitteil annehmen, so bezeichnet uns doch eben dieser geringste Zeitabschnitt, es habe vor dem Logos schon eine Zeit gegeben und so gelangen wir notgedrungen auf ihren Standpunkt. Behaupten wir aber, daß der Vater ohne Willen erzeugt habe, so wird Gott durch eine Naturnotwendigkeit getrieben und nicht durch die Freiheit seines Willens. In Wirklichkeit aber paßt auf Gott nichts von dem, wie du meinst, du Wichtigmacher, denn bei Gott kann solches nicht vorkommen. Er erzeugte also weder mit Willen noch ohne Willen, sondern vermöge seiner allervollkommensten Natur. Die göttliche Natur nämlich ist über alle Pläne und Absichten erhaben; sie unterliegt nicht der Zeit und nicht dem Zwange; denn bei uns gibt es keine reine Aktualität, [= in uns ist nichts gleich fertig,] weil wir einmal nicht waren; und daher überlegen wir auch zuerst und führen dann erst unsere Pläne aus, und wenn wir keinen Plan fassen, so ist das noch nicht vorhanden, was wir noch nicht ausgeführt haben. Bei Gott hingegen ist alles vollkommen, alles fertig und alles in ihm vollendet. Er hat also weder mit Willen noch ohne Willen den ewigen, aus ihm erzeugten heiligen Logos und Gott gezeugt, sondern vermöge seiner unendlichen und unbeschreiblichen Natur.</p><p>Ich muß mich immer sehr verwundern, o Söhne des Glaubens und der Kirche, wenn ich bedenke, wie die zänkischen Irrlehrer die eigentlichen Redensarten zu uneigentlichen verdrehen, und die uneigentlichen ganz irrtümlich für eigentlich und wahr annehmen. Das Gezeugtsein, wie es doch dem Sohn seiner Natur nach zukommt, leugnen sie und sagen, bei ihm sei es nicht wie bei einem Sohn; das Geschaffensein aber, das doch mit seiner Gottheit in Widerspruch steht, nehmen sie, wenn es je an einer Stelle in allegorischem Sinne von ihm gesagt wird, im eigentlichen und wirklichen Sinne. Aussprüche aber, die im eigentlichen Sinne zu nehmen sind, deuten sie beliebig um; so, wenn Isaias sagt: “Ich sah den Herrn der Heerscharen”, oder wenn es heißt: “Er erschien der Herr dem Moses”, und: “Es erschien der Herr dem Abraham”, “Daniel sah in einem Gesichte den Alten an Tagen”. Es erschien der Herr dem Ezechiel und dieser sprach: “Ich sah die Gestalt Gottes”. Da sagen sie, so etwas gebe es nicht, die Propheten würden durch das Wort des Evangeliums Lügen gestraft werden. Der Herr selbst lehrte: “Niemand hat Gott je gesehen”. Da die Propheten behaupten, ihn gesehen zu haben, so muß entweder der Eingeborene selbst oder die Propheten lügen. Nach der Meinung derer, welche so schließen, sowie nach der Lehre der Manichäer werden die Prophetien überhaupt Lügen sein. Wenn aber nichtsdestoweniger die Propheten nicht lügen, sondern die Wahrheit reden, wie ja der Heiland selbst es bestätigt mit den Worten: “Ich bin es, der durch die Propheten spricht, siehe, da bin ich”, so wird ein geheimer Sinn zu suchen und eine allegorische Erklärung notwendig sein. Das begegnet uns im gewöhnlichen Leben schon oft. Wir sehen zum Beispiele] von der Spitze eines Berges oder von einer Ebene aus das Meer: so sprechen wir doch volle Wahrheit, wenn wir behaupten, das Meer gesehen zu haben. Und doch spricht auch der, welcher etwa sagen sollte, daß er das Meer nicht gesehen habe, volle Wahrheit und lüget nicht; denn er hat ja weder des Meeres Tiefe noch auch die Länge und die Masse und den Umfang desselben gesehen. So sehen wir auch häufig durch ein ganz schmales Fenster einen Menschen, ohne aber seine ganze Gestalt bemerken zu können. So nun jemand sagt, er habe den Menschen gesehen, redet er recht, und so ein anderer sagt, er habe ihn nicht gesehen, redet er auch recht Denn wir haben wirklich gesehen, soweit wir’s eben vermochten; wir sahen aber nicht, was der Betreffende in sich ist. So wurden auch die Propheten gewürdigt, gleichsam durch das enge Fenster ihres Leibes den Herrn zu sehen, und sie haben ihn in Wahrheit gesehen, allerdings nicht wie es die Unermeßlichkeit des Geschauten fordert. Und so erweist es sich, daß die heiligen Schriften vollständig miteinander übereinstimmen, wenn die Propheten sagen, daß sie den Herrn gesehen haben, denn sie haben ihn auch in Wahrheit gesehen, und wenn der Heiland aussprach: “Niemand hat Gott je gesehen”, denn sie haben ihn nicht gesehen, wie er an sich ist. Er selbst aber hat gesehen unsichtbar die Wesenheit und er hat denen, die [sie] nicht sehen können, eine Kraft der Gnade gegeben zu geistiger Schauung.</p><p>Freilich kannst du mir Ausreden daherbringen und sagen, die Propheten hätten Gott nicht mit den Augen, sondern im Geiste gesehen, so daß sie ihn fast begriffen und schauten. Darum, [um diesem Einwand zu begegnen,] sagte ja schon Isaias ausdrücklich: “Wehe mir, ich bin vernichtet; denn ich bin ein Mann mit unreinen Lippen, und unter einem Volke, das unreine Lippen hat, wohne ich und den Herrn der Heerscharen schaute ich”. Dabei sagte er nicht: ich schaute ihn im Geiste, sondern mit “meinen Augen”. Die Propheten sahen also den Herrn und sie sahen ihn nicht; nur soweit es möglich war, sahen sie ihn, aber in Wahrheit. Nicht aber sahen sie ihn, wie er in seiner unendlichen, unbegreiflichen Natur ist. So erklären auch viele das Paradies allegorisch, wie besonders der Schwärmer Origenes, der viel lieber ein Phantasiegebilde als die Wahrheit ins Leben einführte; er sagt nämlich: Es gibt kein Paradies auf der Erde, und stützt sich auf einen Ausspruch des hl. Apostels: “Ich sah einen Menschen vor vierzehn Jahren, [ob im Leibe, ich weiß es nicht, ob außer dem Leibe, ich weiß es nicht, Gott weiß es,] derselbe ward entzückt bis in den dritten Himmel”. Aber das darfst du nicht mißverstehen und den dritten Teil des Himmels meinen. Indem nämlich der Apostel sagt: “bis in den dritten Himmel”, spricht er nicht von einem dritten Teil des Himmels, sondern von drei der Zahl nach unterschiedenen Himmeln. Er fügt hinzu: “Ich weiß, daß derselbe Mensch entzückt ward in das Paradies und unaussprechliche Worte gehört hat, die kein Mensch sagen darf.” Dank dem allmächtigen Gotte, der in jeder Beziehung so genau und deutlich auch das geringste erklärt und angegeben hat, daß die, welche nach Wahrheit streben, nicht getäuscht werden können. So faßte er auch hier den Himmel und das Paradies nicht in einem einzigen kurzen Ausdruck zusammen, so daß sie miteinander verwechselt werden könnten, sondern die Schrift sagt zuerst: “Ich kenne einen Menschen, der bis in den dritten Himmel entzückt ward”, und dann folgt: “Der entzückt ward in das Paradies.” Jenes Wort nämlich, welches den Artikel hat, bezeichnet einen anderen Gegenstand und bestimmt eine andere Örtlichkeit. Wir können uns diese zweifache Entzückung in den Himmel und in das Paradies gerade so vorstellen, wie wenn jemand einen Berg und ein ebenes Feld besitzt, das den Berg rings umgibt, und er beabsichtigt nun, in sein jenseits des Berges liegendes Feldgebiet zu gehen; will er nun durch die Ebene seinen Weg nehmen an diesen Ort und, dort angekommen, etwa gegen den Berg hinangehen, so wird ihm dies möglich sein; will er aber zuerst den Berg besteigen und vom Berge aus zu dem jenseits des Berges liegenden Punkt der Ebene gelangen, so kann er auch das tun. So mußt du dir auch vorstellen, was vom Apostel gesagt ist, daß er nämlich zuerst zum Himmel hinaufstieg und dann erst ins Paradies entrückt wurde, wie es heißt: “Es stieg mein Geliebter hinab in seinen Garten”, und so wie der Heiland sagt: “Heute wirst du mit mir im Paradiese sein”.</p><p>Ist das Paradies auf der Erde nicht wirklich, so ist auch alles das, was das Buch Genesis berichtet, nicht wirklich und wahr, sondern muß gleichnisweise erklärt werden; dann gibt es aber überhaupt nichts Wahres und Wirkliches, sondern es muß alles bildlich aufgefaßt werden. „Im Anfange“, so erzählt die Schrift, „schuf Gott den Himmel und die Erde.“ Das ist denn doch wohl nicht bildlich zu nehmen, sondern mit Augen zu sehen. Dann schuf er das Firmament und das Meer, Keime und Bäume, Pflanzen und Kräuter, sodann die Tiere, Fische und Vögel und alles andere, was wir wirklich vorhanden erblicken, und endlich den Menschen, der doch wirklich geschaffen ist. Und diesen Menschen setzte er in das Paradies, nachdem er ihn nach seinem Bilde, dem Bilde Gottes, geschaffen hatte. Möchte man doch unterlassen, allzu vorwitzig sich um alle jene Geschenke zu bekümmern, die Gott aus reiner Liebe dem Menschen gegeben. Gewiß ist, daß alle Menschen nach Gottes Ebenbild geschaffen sind; worin aber dieses Ebenbild bestehe, darnach forschen wir nicht allzu angelegentlich. Wir meinen nicht, daß der Leib nach dem Ebenbilde Gottes sei, noch die Seele noch der Geist, noch daß es in der Tugend bestehe; denn vieles hindert uns, das eine oder das andere zu behaupten. Doch sagen wir auch nicht, daß der Leib oder die Seele nicht nach dem Ebenbilde Gottes sei. Es ist Sache eines Gläubigen, die Schrift nicht zu leugnen, sondern als wahr anzunehmen, so wie ein Ungläubiger die Gnade zurückzuweisen pflegt. Es ist also in dem Menschen Gottes Ebenbild; das „Wie“ aber kennt Gott. Wenn man nämlich bekennt, der Mensch sei nach Gottes Ebenbild geschaffen und dabei etwa meint, es liege im Leibe, so macht man, da Gott unsichtbar, unbegreiflich und unerforschlich ist, das Sichtbare, Begreifbare, Sinnenfällige zum Bilde des Unsichtbaren, Unbegreiflichen. Wollte man aber behaupten, der Leib sei nicht nach Gottes Bild, so widerlegt uns die Schrift, die da sagt: „Er nahm Staub von der Erde und bildete den Menschen“. Mensch nennt die Schrift also das Gebilde aus Erde; Mensch nennt sie auch das Seelenwesen. Es heißt nämlich: „Er hauchte in sein Antlitz und es wurde der Mensch zur lebendigen Seele,“ Als geschaffen erkennen wir demnach die Seele so wie den Leib. Wie so geschaffen? Die Schrift sagt ja: „Er hauchte ein.“ Dabei nennen wir die Seele weder einen Teil Gottes noch glauben wir, sie sei etwas anderes als der Gotteshauch. Wie man sich aber diese feine und subtile Sache näher zu denken habe, weiß Gott allein.</p><p>Wir aber glauben ohne Umschweif und Rückhalt Gott, der in allem die Wahrheit ist. Vielleicht sagst du, daß die Seele es sei, in der das Bild Gottes liege, während doch der Apostel spricht: „Das Wort Gottes ist lebendig und kräftig und schärfer als ein zweischneidiges Schwert und durchdringend bis zu den Teilungen der Seele“. Wenn aber die Seele teilbar ist, wie kann in ihr das Ebenbild Gottes liegen, der doch unteilbar ist? Die Seele weiß das Zukünftige nicht, Gott aber weiß alles; ferner sehen wir nur die uns zugewandte Seite eines Gegenstandes, die abgewandte aber kennen wir nicht. Wollte hinwiederum jemand behaupten, Gottes Ebenbild liege nicht in der Seele, so steht dagegen, daß die Schrift auch die Seele Mensch nennt, indem sowohl die Seele als auch der Leib Mensch ist. Aber vielleicht meinst du: Im Geiste [Nus] liege die Gottebenbildlichkeit. Nun sagt die Schrift: „Ich sehe ein anderes Gesetz, das da widerstreitet in meinen Gliedern und mich gefangen gibt in meinem Geiste dem Gesetze der Sünde, welches in meinen Gliedern ist“. Wie sollte aber dasjenige, das gefangen genommen wird, nach dem Ebenbilde Gottes sein? Dazu kommt, daß die Schrift sagt: „Beten will ich mit dem Geiste, beten will ich mit dem Verstande“. Willst du aber sagen, in der Tugend liege die Gottebenbildlichkeit, so werde ich dir erwidern: So sage mir von Adam, welche Tugend er geübt habe vor seiner Erschaffung. Im Anfange war er nicht da; von Anfang an aber ward er nach Gottes Ebenbild geformt. Wollte man dagegen leugnen, daß die Gottebenbildlichkeit in der Tugend liege, so wäre das kaum richtig; denn wem kommt mehr zu, nach Gottes Ebenbild zu sein als der Tugend? Dabei darf man aber nie vergessen, daß der Mensch vor der Tugend nach Gottes Bilde geschaffen wurde; Adam hatte ja noch keinerlei Tugend geübt, ja, er war noch nicht einmal geschaffen. Schließlich könntest du noch sagen, in der Taufe liege die Gottebenbildlichkeit; aber dann wären die Gerechten, welche die Taufe nicht empfangen haben, nicht nach dem Bilde Gottes gewesen. Denn von Moses und dem Meere fing das Vorbild [der Taufe] an, von Johannes wurde dieses Vorbild weiter entwickelt, in Christus aber ward dieses Gnadengeschenk vollendet.</p><p>Es haben also alle das, was nach dem Ebenbilde Gottes geschaffen heißt, aber [sie haben es] nicht naturgemäß. Denn die Gottebenbildlichkeit des Menschen bedeutet nicht Gottgleichheit. Gott ist ja unfaßbar, weil er ein Geist ist, und zwar Geist über allen Geist, Licht über alles Licht. Übrigens wollen wir das, was er uns gnädig geschenkt hat, keineswegs uns selbst abstreiten. Denn der, welcher in gnädiger Liebe den Menschen verliehen hat, nach [seinem Bilde] zu sein, ist wahrhaft und getreu; und man kann es sich aus Analogien klarmachen. Denn wir sehen, daß der Heiland „es“ in seine Hände nahm, wie im Evangelium steht, daß er beim Mahle aufstand und dieses nahm und danksagend sprach: „Dieses ist mein hier“. Und er gab es seinen Jüngern mit den Worten: „Dieses ist mein hier.“ Wir sehen aber weiter, daß „es“ keine Gleichheit und Ähnlichkeit hat weder mit der fleischlichen Gestalt noch mit der unsichtbaren Gottheit noch mit den Formen und Eigentümlichkeiten der Glieder. Denn das eine ist von runder Form, [das andere aber unerforschlich] und unwahrnehmbar, [aber zu vergleichen ist beides] der Kraft nach und er wollte in seiner Gnade sagen: „Dieses ist mein hier.“ Und niemand zweifelt an seinem Worte, denn wer nicht glaubt, daß er wahrhaft sei, der verliert, wie er gesagt hat, Gnade und Heil. Wenn wir [sein Wort] hören, so wollen wir es glauben. Wir glauben, daß es sein [Leib] ist, von unserem Herrn aber wissen wir, daß er ganz Gefühl und fühlend, ganz Gott, ganz bewegend, ganz. wirkend, ganz Licht, ganz Logos ist, unbegreiflich, ganz unbegreiflich ist, daß er aber dies alles in Gnade uns geschenkt hat.</p><p>Adam wurde, wie wir schon oben erwähnt, in das Paradies versetzt und aß dort vom Baume. “Das Paradies war”, wie die Schrift erzählt, “in Eden gegen Sonnenaufgang. Und eine Quelle erhob sich in Eden”. Bemerkenswert ist, daß es nicht heißt: Es kam eine Quelle herab. So wird deshalb gesagt, damit wir nicht etwa meinen, daß Eden im Himmel sei. In diesem Falle müßte es heißen: Es kam eine Quelle herab. Weiter heißt es: “Ein Fluß geht aus von Eden [auch hier heißt es nicht kommt herab von Eden]. Dieser teilte sich in vier Hauptströme. Der Name des ersten ist P h i s o n.” Diesen Phison nun sehen wir noch in unseren Tagen. Denn Phison ist der Ganges, wie er bei den Indiern und Äthiopiern heißt, oder der Indus, wie ihn die Griechen nennen. Dieser umfließt das ganze Land Evilat, nämlich das große und das kleine, mit einem Wort das Gebiet der Elymäer, durchläuft das große Äthiopien in südlicher Richtung und mündet endlich innerhalb Gades in das große Weltmeer. Der zweite Fluß ist der G e o n. Dieser ist gleichfalls keine leere Allegorie, wir können ihn mit unseren Sinnen wahrnehmen. Denn es ist derselbe Strom, welcher aus Äthiopien kommend das kleine Äthiopien, das anubitische Gebiet, Blamyen und Axumitis durchströmt, Thebais und Ägypten überschwemmt, und sich endlich in unser Meer ergießt. So jemand dies unglaublich finden möchte, lese er nur bei Jeremias die Stelle: “Was soll’s euch in dem Lande Ägypten, um zu trinken das Wasser des Geon, das trübe?” Den dritten Strom nennt die Schrift “T i g r i s”; das ist derselbe, der aus dem Gebiete der Assyrier kommt. Er durchschneidet einzelne östliche Gebiete, verliert sich aber dann unter der Erde. Er hat seine Quellen in Armenien im Gebiete der Kardiäer und Armenier, verschwindet, erscheint nochmals und durchschneidet das Gebiet der Assyrier. Der vierte Fluß ist der E u p h r a t. Auch er versiegt in derselben Weise wie der Tigris, entsteht in Armenien und berührt Persien. Ist nun das Paradies nicht sinnlich zu verstehen, so ist auch keine Quelle, daher kein Strom, und nicht existieren die vier genannten Hauptströme. Wenn es keinen Phison gibt, so gibt es auch keinen Geon, und wenn der Tigris nicht existiert, so ebensowenig der Euphrat. Wenn der Euphrat nicht wirklich ist, ist’s ebensowenig der Feigenbaum und die Blätter und Adam und das Essen von der verbotenen Frucht; und Eva hat nicht gegessen vom Baume, einen Adam hat es nie gegeben. Ist Adam nicht, so sind auch keine Menschen, alles Wirkliche löst sich in Fabel auf, alles wird Allegorie. Nun aber i s t Adam; denn von Adam stammen wir ja alle ab durch die ganze Aufeinanderfolge der Geschlechter, und wir sehen in der großen Zahl der Nachkommen ihn, den Stammvater.</p><p>Denn Adam erzeugte nach seinem Bilde den Seth. Die Schrift setzt dieses „nach seinem Bilde“ ausdrücklich darum bei, damit ja niemand glaube, der von Gottes Hand gebildete Adam sei verschieden gewesen von denen, welche durch Zeugung von ihm abstammen. Ferner zeugte Seth den Enos, Enos den Kaina, Kaina den Malaleel, Malaleel den Jared und Enoch, Enoch den Methusalem, Methusalem den Lamech, Lamech den Noe, unter welchem die große Sündflut geschah — doch wohl nicht nur allegorisch, sondern wirklich, da ja alles Lebende vertilgt und nur acht Menschenseelen gerettet wurden. Auch an dem Worte „Seelen“ darf niemand Anstoß nehmen und sie etwa nur für Phantasiegebilde halten. Es wird eben hier nur der eine Wesensteil des Menschen für den ganzen Menschen gesetzt; wie es in derselben Weise von Jakob heißt, daß er mit fünfundsiebzig Seelen nach Ägypten hinabgestiegen sei, wobei ihm gewiß nicht die Seelen ohne Leiber, sondern mit denselben folgten; wie ferner Lukas, der Verfasser der Apostelgeschichte, ähnlich berichtet: „Wir waren im Schiffe beiläufig achtzig Seelen“. Es besteht ja auch [umgekehrt] die Gepflogenheit, die Diener „Leiber“ zu nennen und man spricht also von einem Herrn über hundert Leiber; natürlich verstehen wir beseelte Leiber. Da aber die Herrengewalt der Menschen sich nur auf die Leiber und nicht auch auf die Seelen erstreckt, kann man ganz passend die Diener beseelte Leiber nennen, um die Gewalt über die Leiber anzudeuten. Noe stieg aber aus der Arche und seine Söhne waren Sem, Cham und Japhet. Sem zeugte den Arphaxad, Arphaxad den Kainan, Kainan den Sala, Sala den Heber, Heber den Phalek, Phalek den Rhagam, Rhagam den Seruch, Seruch den Nachor, Nachor den Tharra, Tharra den Abraham, Abraham den Isaak, Isaak den Jakob, Jakob den Judas, Judas den Phares, Phares den Esrom, Esrom den Aram, Aram den Aminadam, Aminadam den Naason, Naason den Salomon, Salomon den Booz, Booz den Obed aus der Ruth, Obed den Jesse, Jesse den König David, David den Salomon von dem Weibe des Urias, Salomon den Roboam, Roboam den Abia, Abia den Asaph, Asaph den Josaphat, Josaphat den Joram, Joram den Ochozias, Ochozias den Joas, Joas den Amasias, Amasias den Ozias, der auch Azarias hieß, Ozias den Joathan, Joathan den Achaz, Achaz den Ezechias, Ezechias den Manasse, Manasse den Arnos, Arnos den Josias, Josias den Jechonias, Jechonias den Salathiel, Salathiel den Zorobabel, Zorobabel den Abiud, Abiud den Eliakim, Eliakim den Asor, Asor den Sadok, Sadok den Achim, Achim den Eliud, Eliud den Eleazar, Eleazar den Matthias, Matthias den Jakob, Jakob den Joseph.</p><p>Joseph nun, der greise Witwer, zeugte in seiner ersten Ehe vier Söhne: den Jakobus, genannt der Bruder des Herrn, weil er mit ihm aufgezogen worden war, den Simon, den Judas und Joses, und zwei Töchter: Anna und Salome. Da stammweise die Witwer und unverheirateten Männer für die im Tempel auferzogenen Jungfrauen ausgelost wurden — denn die Erstgeborenen beider Geschlechter pflegten ja in dem Tempel geheiligt und Gott geweiht zu werden —, so nahm unser Joseph, als greiser Witwer durchs Los bestimmt, die heilige Jungfrau Maria, aus welcher nach dem Fleische geboren wurde unser Herr Jesus Christus durch den Hl. Geist, nicht durch Mannessamen noch durch körperliche Vereinigung. Es ist also der Herr, unser Gott, geboren aus dem Stamme Juda, aus dem Samen Davids und Abrahams nach dem Fleische in dem vierzigsten Jahre der Regierung des Augustus. Es herrschte aber Augustus 66 Jahre und 6 Monate [!], Ihm folgte sein Sohn Tiberius, welcher 23 Jahre herrschte. Nach Tiberius regiert Cajus 3 Jahre 9 Monate 23 Tage. Nach Cajus herrscht Claudius 13 Jahre. Nach Claudius herrscht Nero 13 Jahre. Nach Nero herrscht Vespasian 9 Jahre. Nach Vespasian herrscht Titus, sein Sohn, 2 Jahre. Nach Titus herrscht Domitian, sein Bruder, 5 Jahre 5 Monate. Nach Domitian herrscht Nerva 4 Jahre. Nach Nerva herrscht Trajan 19 Jahre. Nach Trajan herrscht Adrian 22 Jahre. Nach Adrian herrscht Antoninus Pius 22 Jahre. Nach Antoninus herrscht Markus Aurelius Antoninus, auch Verus zubenannt, 19 Jahre. Commodus 14 Jahre. Pertinax 6 Jahre. Severus 18 Jahre. Sein Sohn Antoninus 7 Jahre. Macrinus 1 Jahr. Antoninus II. 2 Jahre. Alexander, verschieden vom A. Macedo, 3 Jahre. Maximinus 3 Jahre. Gordianus 6 Jahre. Philippus 6 Jahre. Decius 1 Jahr. Gallus und Volusianus 3 Jahre. Galienus 15 Jahre, Claudius II. 1 Jahr. Aurelianus 14 Jahre. Tacitus 6 Monate. Probus 6 Jahre. Carus und Carinus und Numerianus 2 Jahre. Diokletian 20 Jahre. Nach Diokletian Maximianus, Licinius, Constantius, Constantinus, Constans, Julianus, Jovianus, Valentinianus, Valens, Gratianus. Und vom Todesjahre des Diokletian zählt man bis zum jetzigen siebzig Jahre. Denn dieses ist das Jahr neunzig seit Diokle-tian, das zehnte seit Valens und Valentinian, das sechste des Gratian, das dritte im Konsulate des Gratianus Augustus und des glorreichen Equitius; in der zweiten Indiktion.</p><p>Wir stammen also alle in ununterbrochener Reihenfolge der Geschlechter von Adam ab, und die Schöpfungen Gottes dürfen nicht allegorisch erklärt werden, sondern es hat wirklich einen Adam gegeben, und wirklich existierten die Feigenblätter und der Feigenbaum und der Baum der Erkennbarkeit des Guten und des Bösen, und der Baum in Mitte des Paradieses und die Schlange und der Ungehorsam sowie der Gehorsam, und es waren die besprochenen Flüsse wirklich vorhanden, wirklich war Eva und wirklich die Schöpfung. Denn bei Gott ist kein Ding unmöglich, er kann das Vergängliche zum Unvergänglichen umgestalten und dem Irdischen diese Unvergänglichkeit mitteilen. Darüber braucht man sich nicht zu verwundern. Denn er ist ja gekommen und hat dieses gezeigt, indem er jenen vergänglichen und irdischen Leib, welchen er annahm und mit seiner Gottheit verband, unvergänglich und unsterblich gemacht hat. Wer wird darüber mit Gott rechten wollen? Doch verfolgen wir die heilige Geschichte weiter! Gott stieß die ersten Menschen aus dem Paradiese und stellte die Cherubim mit dem flammenden Schwert auf, zu bewachen den Zugang zum Baume des Lebens. Adam also und die Seinigen wohnten nunmehr außerhalb des Paradieses. Niemand komme da mit leeren Fabeleien. „Es kann ja Gott aus Steinen sich Kinder erwecken“. Es kann Gott auch das Vergängliche zum Unvergänglichen umgestalten und er kann auf Erden Paradiesesruhe hervorbringen nach seinem Willen. Denn nicht die Erde ist eines Gottes und der Himmel eines andern, sondern beide sind eines und desselben, und wie er will, so verleiht er jedem die Unvergänglichkeit. Denn auch vom Leibe des Adam wissen wir, daß er aus Erde gebildet ward, aus welcher auch unsere Leiber sind; daher auch wir die Hoffnung haben auf ein unvergängliches Erbe. War ja auch des Erlösers Leib aus Maria und ist mit der Unsterblichkeit des Logos im Himmel verbunden worden. Dieses alles haben wir gesammelt und an dieser Stelle vorbringen zu müssen geglaubt, um nichts von dem, was die Schrift berichtet, zu übergehen, es vielmehr schlicht und recht anzunehmen und als gläubig befunden zu werden gegen Gott in allem, was er uns in Wahrheit schrieb, und wozu er den Weg der Wahrheit und unseres Heiles uns geschenkt hat. Ihm allein geziemt es, die Wissenschaft vom Unerforschlichen zuzuschreiben.</p><p>Origenes aber, dem Gott seine Phantastereien verzeihen möge, die er den Menschen vorallegorisierte, führt noch eine andere törichte und mythische Erklärung vor. Er behauptet nämlich, jene Röcke von Tierfellen, welche nach den Worten der Schrift Gott den ersten Menschen gemacht hat, seien gar keine lederartigen Röcke gewesen, sondern man habe darunter die Fleischmasse des Körpers oder den Leib selbst zu verstehen, in welchen nach dem Ungehorsam und dem Essen der verbotenen Frucht die Seelen eingeschlossen worden seien. Doch Origenes sucht Scheingründe beizubringen und ergeht sich darüber des weiteren. Gott, so sagt er, ist doch kein Lederarbeiter, daß er die Häute gerbte und dann dem Adam und der Eva Kleider zusammengenäht haben soll. Was er da sagt, ist doch noch die höhere Eselei. Was war denn für Gott leichter, den Himmel aus nichts zu machen oder Tierhäute zusammenzunähen? Wann hat Gott seine bewunderungswürdigen Taten nicht ausführen können nach seinem Willen, er, der das Unbelebte selbst in Belebtes umwandelte? Hat er denn nicht den dürren Holzstab des Moses in eine belebte Schlange verwandelt, welche den Moses verfolgte, und vor welcher er sich fürchtete, damit so unzweifelhaft feststehe, daß es nicht ein Phantasiegebilde, sondern eine wirkliche Schlange war? Wie war es denn möglich, daß durch vierzig Jahre die Kleider des israelitischen Volkes nicht abgenützt wurden und das Haupthaar nicht wuchs und die Sandalen nicht altersbrüchig wurden? Da sollen mir nun die Gescheiten, die den Unsinn des Origenes in diesem Punkte mitmachen, sagen, ob wohl Christus, nachdem er von den Toten auferstanden war, die Linnen aber, wie geschrieben steht, im Grabe zurückgelassen hatte, sich seinen Jüngern nackt zeigte, da er doch mit Leib und Seele auferstand. Und damals, als er dem Thomas seine Gebeine und seine Hände und seine Seite zeigte, war er doch offenbar nicht nackt! Wer hat ihm also die Kleider, die er nach der Auferstehung trug, gefertigt? Ja, so wird man mir sicherlich antworten, er hat sich selbst gewissermaßen geistige Kleider gemacht. Wenn er sich aber solche Kleider machen konnte, sollte er dann jene Fellröcke für die ersten Menschen durch seinen bloßen Willen nicht haben machen können? Mit der allegorischen Erklärung des Origenes ist es tatsächlich nichts, Wenn nämlich erst nach dem Genüsse der Frucht dem Adam das Fleisch anerschaffen worden wäre, woher, frage ich, hätte Gott die Rippe genommen? Oder wie hätte er, als er aus seinem Schlafe erwachte, sprechen können: „Bein von meinem Bein und Fleisch von meinem Fleische ist dieses“.</p><p>Keiner möge uns daher fernerhin mit Einwendungen belästigen; denn so hat es die heilige Kirche Gottes von Anbeginn gelehrt; denn Origenes wird am Tage des Gerichtes nicht auf unserer Seite stehen. Darum muß es mich in Wahrheit wundern, wie einige es ertragen können, daß jener lästert gegen seinen Herrn. Solche sollen nur lesen das Werk des Origenes „Über die Prinzipien“, und sie, die Söhne der katholischen Kirche zu sein glauben, mögen Lehre annehmen und nicht wagen, den Sohn zu trennen von der Gottheit des Vaters. Hat ja Origenes sich nicht entblödet zu sagen: Der Sohn sieht den Vater nicht; ja, er behauptet noch dazu: Gleichwie den Vater der Sohn nicht sehen kann, so könne auch der Hl. Geist den Sohn nicht sehen, und wiederum: Die Engel können den Hl. Geist nicht schauen und die Menschen können die Engel nicht sehen. So hat er in willkürliche Annahme verstrickt sich selbst und diejenigen, welche sich von ihm täuschen ließen, nicht aber denjenigen, welcher verständig und gläubig ist und festhält an der Wahrheit und der geistlichen Lehre. Schweige denn, o Origenes, und schweiget, ihr Schüler des Origenes! Denn die Apostel und die Propheten reden reinere Wahrheit als ihr und euer Meister. Verstummen sollen die Gnostiker, die sich „Beurteiler“ nennen, aber in ihren Sitten „zu verurteilen“ sind. Verstummen mögen die Valentinianer, die Manichäer und die Marcionisten, welche ganz und gar im Irrtum leben. Und verstummen mögen die Arianer, die Anomäer, die Sabellianer, die Pneumatiten oder Pneumatomachen und die Dimöriten, welche unverständig den Verstand verleugnen. Denn in allweg spricht die göttliche Schrift Wahrheit. Es ist aber Verständnis nötig, um Gott zu erkennen, ihm und seinem Wort zu glauben und die Gnadengaben Gottes, die schon erteilten und die in Aussicht stehenden, und die endliche Auferstehung der Toten gemäß der Verheißung zu erkennen. Denn jede Häresie lügt, weil sie nicht empfangen hat den Hl. Geist, gemäß der Überlieferung der Väter in Gottes heiliger katholischer Kirche.</p><p>Über diese ganze Materie gedenke ich ein andermal noch nach meinen schwachen Kräften zu sprechen. Da ich aber von Gott gewürdigt worden bin, Mitglied der heiligen Kirche Gottes zu sein, ja, obgleich der geringste und niedrigste unter allen, sogar das Amt eines Vorstehers in derselben inne zu haben, so will ich, insoweit meine schwachen Kräfte es erlauben, die einzelnen Punkte noch abgesondert für sich behandeln zu Nutz und Frommen derjenigen, welchen ihr Heil am Herzen liegt. So dürfte zwar hinlänglich genügen, was wir über den Vater und den Sohn und den Hl. Geist bereits mitgeteilt haben; um aber noch ein übriges zu tun in unserer Erläuterung zur Aufklärung, Erbauung und Stärkung der Gläubigen, so habe ich von allen Seiten die Zeugnisse der göttlichen Schrift gleichsam zu einer großen Freudentafel für die Gläubigen zusammengestellt und gehe nun sogleich daran zu zeigen, wie sicher und fest unsere Hoffnung in Gott ist, weil kein Unterschied trennend tritt zwischen Vater, Sohn und Hl. Geist, sondern gleichen Ranges und gleicher Wesenheit ist die heilige Dreieinigkeit. Und zwar wollen wir nicht irgend anderswoher noch auch aus unseren eigenen Gedanken die Unterweisung nehmen, sondern nur aus unserem Leben, das ist aus den Propheten und aus der Erscheinung und Menschenliebe unseres Erlösers. Denn er kam ja, er kam als unser Leben zu uns und zeigte uns, die er vom rechten Wege abgewichen fand, den Wandel des Lichtes, Denn wir alle hatten uns ja leider hingegeben dem Stolze und der Gotteslästerung, den Götzenbildern und dem Kulte der Dämonen, wir alle waren elende Sklaven alles Bösen. Da wir nun in dem allen gegen unseren Willen so verwickelt waren, „denn nicht, was ich wollte, das tat ich, sondern was ich haßte“, das zu tun fühlte ich mich angetrieben, indem die Sünde es mir also antat; da schickte der heilige Vater seinen heiligen Sohn. Und durch dessen Erbarmungen rettete er mich und befreite er mich von allen Übeln.</p><p>Denn erschienen ist uns die Gnade Gottes, unseres Heilandes, uns unterweisend, daß wir, absagend der Unfrommheit und den weltlichen Begierden, besonnen und gerecht und fromm leben in dieser Jetztzeit, erwartend die selige Hoffnung und Ankunft der Herrlichkeit unseres großen Gottes und Heilandes Jesus Christus, welcher sich selbst dargegeben hat für uns, damit er uns loskaufe von aller Ungerechtigkeit und sich reinige ein Eigentumsvolk, strebsam nach guten Werken, nachdem er ausgelöscht die wider uns lautende Handschrift mit den Satzungen — er nahm sie hinweg aus der Mitte und nagelte sie an das Kreuz —, und nachdem er entwaffnet hatte die Fürstentümer und die Gewalten, führte er getrost sie auf, triumphierend über sie in sich selber. Und nachdem er die ehernen Tore zerrieben und die eisernen Pfosten zerbrochen hatte, offenbarte er uns das Licht des Lebens und reichte er uns seine hilfreiche Hand, zeigte uns die wahre Himmelsleiter und wies uns wiederum das Paradies als unseren Wohnsitz an. “Er wohnte unter uns” und brachte uns das rechtfertigende Gesetz des Hl. Geistes, damit wir ihn erkennen und daß die Lehre von ihm Anfang und Ende des Lebens ist. Gesetz der Gerechtigkeit ist er uns geworden, Gesetz des Geistes frei vom Gesetz des Fleisches der Sünde. Darum “freuen wir uns an dem Gesetze Gottes, dem inneren Menschen nach”. In unserm Innern ist aber Christus, denn “er wohnt ja in uns”. Er ist der Lebensweg geworden, indem er für uns gestorben ist, “damit, die da leben, nicht mehr sich selber leben, sondern dem, welcher für sie gestorben und auferstanden ist”, dem Urheber des Lebens, der, wie David sagt, “eingedenk war des Eides”, den er vor vielen Menschenaltern geschworen hatte. “Denn Gott war ja in Christus, die Welt mit sich versöhnend, ihnen nicht zurechnend ihre Vergehen”, “weil es gefallen hatte, daß in ihm die ganze Fülle innewohne, und durch ihn zu versöhnen alles zu sich hin, indem er Friede machte durch das Blut seines Kreuzes”. Er kam also, um die Fülle der Zeiten zu bringen, wie es dem Abraham und den Vätern verheißen war, “um in ihm alles wieder aufzurichten, was im Himmel und was auf Erden ist”. Denn es war sozusagen durch die zuwartende Langmut Gottes eine Zwietracht und Feindschaft entstanden, Christus aber hat beide in seinem Fleische friedlich vereint, indem er in sich die beiden zu einem verband: “Denn er kam als unser Friede und er hat die Mittelwand der Abzäunung, alle Feindschaft nämlich, gelöst, indem er in seinem Fleische das Gesetz der Gebote in Satzungen abgetan hat, damit er die zwei erschaffe zu einem neuen Menschen.” Daß aber die Heiden Glieder desselben Leibes, Mitteilhaber und Miterben der Verheißung sein sollten, das war sein Wille, wenn er sprach: “Kommet zu mir alle, die ihr mühselig und beladen seid, und ich will euch erquicken”. “Da ich also”, wie der Apostel sagt, “schwach war durch das Fleisch, so wurde für mich der Erlöser in Ähnlichkeit des Fleisches der Sünde gesandt”, welcher dieses ganze Heilsgeschäft auf sich nahm, damit er mich von der Knechtschaft loskaufe, los vom Verderben, los vom Tode; und “der für mich geworden ist Rechtfertigung und Heiligung und Erlösung”. Er ist geworden “Rechtfertigung”, weil er durch Wasser und Geist uns in seinem Wort frei machte; “Erlösung”, weil er sein Blut, das Blut des wahren Lammes, für uns hingegeben hat als Lösepreis; “Versöhnungsopfer”, durch welches die Welt gereiniget und alles im Himmel und auf Erden versöhnt worden ist, “indem er das Geheimnis, welches verborgen gewesen von Weltaltern und Geschlechtsfolgen her, in der Fülle der Zeiten erfüllt hat”. Ebenderselbe Christus wird aber auch “umbilden den Leib unserer Niedrigkeit, gleichgestaltet dem Leibe seiner Herrlichkeit gemäß der Macht, auch alles sich unterwerfen zu können”; “denn in ihm wohnt ja die Fülle der Gottheit leibhaftig”.</p><p>Christus, in dem die Weisheit und Gottheit leibhaft wohnt, ist unser Mittler und er versöhnt durch sich selbst alles mit Gott, „nicht zurechnend die Vergehen“, indem er die verborgenen Geheimnisse Gottes erfüllt durch den Glauben an sein Testament, welches durch das Gesetz und die Propheten vorhergesagt worden war, als Gottes Sohn verkündet, Davids [Sohn] genannt; denn er ist beides, Gott und Mensch, „Mittler zwischen Gott und den Menschen“, die wahrhaftige Wohnung Gottes, das heilige Priestertum und der Geber des wieder gebärenden und alles erneuernden Hl. Geistes; denn „der Logos ist Fleisch geworden und hat unter uns gewohnt, und wir haben seine Herrlichkeit gesehen als die des Eingeborenen vom Vater“. Denn gerade so, wie der Regen sich mit den Bäumen und Gewächsen verbindet und da etwas Körperliches hervorbringt, und zwar eine jede Frucht ähnlich dem Gewächse, auf dem sie gewachsen, und so an dem Ölbaume aus dem Regen fettes Öl erzeugt wird, welches sein Wesentliches aus dem Ölbaume angenommen hat, an der Rebe süßer Wein gedeiht und auf dem Feigenbaume süße Feigen reifen, kurz an jeglichem Gewächse gemäß seiner Eigenheit der Wuchs gefördert wird, gerade so ist, denke ich, auch das Wort Gottes in Maria Fleisch geworden und ist nach der Verheißung Samen Abrahams als Mensch. An ihm haben wir ja den Messias gefunden, von welchem Moses geschrieben hat, indem er sagte: „Niederströme wie Regen mein Wort“. Und David sagt: „Es soll herabkommen wie Regen auf das Vließ und wie Wassertropfen, die auf die Erde träufeln“. [Indem die Wolle den Tau aufnimmt, mehrt sie den Wuchs des Vließes, und indem die Erde den Regen aufnimmt, mehrt sie die Frucht, die der Bauer erhofft, einerseits durch [diese] Aufnahme, dem Herrn gehorsam, gerne ihre Natur bereitstellend, anderseits dadurch, daß sie von ihm mehr Triebkraft bekommt.] So erhält auch die Jungfrau auf ihre Frage: „Woher werde ich erkennen, daß dies mir geschehen wird?“ die Antwort: „Der Geist Gottes wird über dir sein, und die Kraft des Höchsten wird dich überschatten; daher wird auch das, was aus dir geboren werden wird, heilig sein und des Allerhöchsten Sohn genannt werden“. Im Engel spricht Christus, und der Herr selbst ist es, der sich bei seiner Menschwerdung bildete, „indem er Knechtsgestalt annahm“. Maria nimmt nämlich zwar das Wort Gottes zur Empfängnis auf, wie die Erde den Regen, aber das Wort bildet sich selbst zur heiligen Frucht, indem es Knechtsgestalt freiwillig annimmt. So [ist also Christus geboren worden] aus Maria, die ihn freudig aufnahm, so wie die Erde und das Vließ [den Regen], als die Frucht wahrer und echter Sehnsucht und der Erwartung der Heiligen, so wie Elisabeth sagte: „Gebenedeit bist du unter den Weibern, und gebenedeit ist die Frucht deines Leibes“. Die menschliche Natur nahm er an des Leidens wegen, der leidensunfähige Logos. Christus ist „das lebendige Brot, welches vom Himmel herabgestiegen ist“ und uns Leben spendet, er ist die Frucht des wahren Ölbaumes, das heilige, zusammengesetzte Salböl, welches Moses schon sinnbildlich angedeutet, er ist „der wahre Weinstock“, welchen nur der Vater pflanzt, und der für uns Trauben der Freude trägt, er ist „das lebendige Wasser, bei welchem der Mensch, der davon trinkt, nicht weiter mehr dürsten wird, sondern welches in ihm verbleibt und emporquillt ins ewige Leben“. Von ihm, dem wahren Weinstocke, haben die neuen Winzer die Ableger in die ganze Welt verpflanzt, die alten Winzer aber haben durch Unglauben ihn ausgerissen und getötet. Durch sein Blut werden die Völker geheiligt und durch seinen Geist führt er die Berufenen in den Himmel auf. Denn „diejenigen, welche sich von seinem Geiste leiten lassen“, die leben Gott, die andern aber sind noch dem Tode verschrieben und werden Psychiker und Sarkiker genannt. Darum befiehlt er uns, abzulegen die Werke des Fleisches, welche Beförderungsmittel der Sünde sind, abzutöten die Glieder des Todes durch seine Gnade und zu empfangen den Hl. Geist, welchen wir früher nicht hatten, der mich, der längst im Tode war, lebendig macht, ohne den ich des Todes sein werde. Ohne seinen Geist ist ja jeder tot. „Wenn der Geist dessen, welcher Jesum auferweckt hat von den Toten, in uns wohnt, so wird er lebendig machen unsere sterblichen Leiber wegen des uns innewohnenden Geistes“. Beide aber, der Sohn und sein Geist, wohnen, glaube ich, in dem Gerechten.</p><p>Ob aber nach unserm Glauben Christus vom Vater ausgeht als Gott von Gott, und der Hl. Geist von Christus oder von beiden, wie Christus sagt: “Der vom Vater ausgeht”, und anderseits: “Dieser wird von dem Meinigen nehmen”, während Christus vom Hl. Geiste [empfangen] ist nach des Engels Wort, dieses Geheimnis meiner Erlösung verstehe ich nur im Glauben, aufs bloße Hören hin, in Liebe gegen den, der zu mir gekommen ist. Gott kennt sich ja selbst, sich selbst predigt Christus, sich selbst offenbart der Hl. Geist den Heiligen. Auch in den heiligen Schriften wird die heilige Dreifaltigkeit uns verkündet, und geglaubt wird sie ohne Umstände, ohne Widerstreit gegen das gehörte Wort. Aus diesem Glauben wird uns ja das Heil der Gnade gegeben: “Aus dem Glauben kommt die Gerechtigkeit ohne die Werke des Gesetzes”; es steht geschrieben, daß auf Grund des willigen Anhörens des Glaubens der Geist Christi gegeben wird denen, die das Heil erlangen. Die zuverlässige Aussage der allgemeinen Glaubenszeugen lautet, wie ich wenigstens, durch die Schrift belehrt, glaube, dahin: drei Heilige, drei Gleichheilige; drei Gestaltete, drei Gleichgestaltete; drei Wirkende, drei Zusammenwirkende; drei Personen untereinander vereint. Das wird die heilige Dreieinigkeit genannt: drei Seiende, eine Übereinstimmung, eine Gottheit ebendesselben Wesens, ebenderselben Gottheit, ebenderselben Hypostase, ähnlich aus ähnlichem, in der Gleichheit der Gnade des Vaters und des Sohnes und des HI. Geistes. In welcher Weise das möglich sei, müssen wir Gott selbst überlassen, daß er es uns offenbare. Denn: “Niemand kennt den Vater als der Sohn, niemand den Sohn außer der Vater und wem es der Sohn offenbaret”. Er offenbart es aber durch den Hl. Geist, durch den auch der Vater offenbart. Es sind also diese drei: aus ihm oder von ihm oder zu ihm hin Beziehungen, die bei jedem entsprechend zu denken sind, je nachdem sie sich offenbaren; sie werden Licht, Feuer und Geist genannt und mit andern Bezeichnungen sichtbarer Dinge, wie eben der Mensch, dem sie dienen, die Gnade hat. Gott selbst, der im Anfange gesprochen hat: “Es werde Licht”, worauf auch das sichtbare Licht entstanden ist, ist es, der uns erleuchtet, das wahre Licht zu schauen, “das jeden Menschen erleuchtet, der in die Welt kommt”. “Sende dein Licht und deine Wahrheit”Ps. 42, 3., betet darum David. Ebenderselbe Gott ist es auch, der gesagt hatte: “In den jüngsten Tagen werde ich ausgießen meinen Geist und prophezeien werden deren Söhne und Töchter und deren Jünglinge Gesichte schauen”Joel 2, 28.. Er zeigt uns also drei Personen im Heilswerk auf Grund des dreifaltigen Wesens.</p><p>“Ich sage nun, daß Christus der Diener der Beschneidung geworden ist um der Wahrhaftigkeit Gottes willen, um die Verheißungen zu bestätigen”Röm. 15, 8., sein Mitdiener aber ist der Hl. Geist. Denn so haben wir es überkommen aus den hl. Schriften: Christus wird vom Vater ausgesandt, auch der Hl. Geist wird ausgesandt; Christus redet in den Heiligen, ebenso auch der Hl. Geist; Christus heilet, der Hl. Geist heilet; Christus heiliget, der Hl. Geist heiliget; Christus tauft in seinem Namen, auch der Hl. Geist. Das bezeugen die Aussprüche der Schrift. So heißt es: “Du wirst deinen Geist senden und erneuen das Angesicht der Erde”, und übereinstimmend damit: “Du wirst dein Wort senden und sie schmelzen”. Ebenso: “Während sie den Dienst feierten dem Herrn und fasteten, sprach der Hl. Geist: Sondert mir ab den Saulus und Barnabas zu dem Werke, zu welchem ich sie herzuberufen habe”, dazu vergleiche man die andere Stelle: “Der Herr aber sprach: Gehe in die Stadt und dort wird dir gesagt werden, was du tun sollst”, und: “Diese nun, gesandt vom Hl. Geiste, kamen nach Seleucia”, wie auch Christus ähnlich sagt: “Siehe, ich sende euch wie Lämmer in Mitte von Wölfen”. An anderer Stelle: “Es hat dem Hl. Geiste gefallen, keine andere Last aufzulegen als dieses Notwendige”, analog dazu: “Es sage nicht ich, sondern der Herr, daß das Weib von dem Manne sich nicht trenne”. Ferner: “Sie durchwanderten Phrygien und das Galatergebiet; der Hl. Geist aber wehrte ihnen, das Wort Gottes in Asien zu verkündigen; nachdem sie aber nach Mysien gekommen waren, versuchten sie nach Bithynien zu reisen, aber der Geist ließ es nicht zu”; hierher gehört auch das Wort Christi: “Gehet hin und taufet alle Völker”; “Traget keine Tasche und keinen Stab und keine Schuhe”. Wenn es an anderer Stelle heißt: “Diese aber sagten dem Paulus durch den Hl. Geist, er solle nach Jerusalem nicht hinaufsteigen”, und Agabus sagt: “Dies spricht der Hl. Geist: den Mann, dessen Gürtel es ist”, so ist dazu zu vergleichen der Ausspruch des Apostels: “Begehret ihr eine Probe des in mir redenden Gottes?”, und: “Seid eingedenk der Worte des Herrn, da er selbst gesagt hat: Geben ist seliger, denn nehmen.” “Und nun sieh, gebunden im Geiste reise ich”, dies Wort deckt sich mit dem andern: “Paulus, der gefesselte Jesu Christi”. Ferner: “Der Geist bezeugt es mir durch die Städte” zu vergleichen mit: “Der Herr gibt meiner Seele Zeugnis, daß ich nicht lüge”. “In der Kraft gemäß dem Geiste der Heiligung” zu vergleichen mit: “Der Heilige, der in den Heiligen ruhet”. Ebenso: “Die Beschneidung des Herzens im Geiste”, und: “Ihr seid beschnitten worden mit Beschneidung, nicht durch die Hand gemacht in Wegnahme vom Leibe der Sünden, sondern in der Beschneidung Christi”. Dem Ausspruche: “Wenn der Geist Gottes in euch wohnet” ist verwandt: “So wie ihr nun empfangen habt Christum, wandelt in ihm”. Und: “Der Geist des Herrn sprach in mir, und sein Wort ist in meinem Munde”. “Die wir die Erstlinge des Geistes haben” dementsprechend: “Der Erstling Christus”. “Der Geist selbst bittet für uns”, und: “Der zur Rechten Gottes ist, der auch für uns bitte”. Der Ausspruch: “Damit das Opfer der Völker genehm sei, geheiligt im Hl. Geiste” ist ähnlich jenem: “Der Herr heiligt euch, auf daß ihr rein ohne Makel seid auf den Tag des Herrn”. “Uns hat Christus geoffenbart durch seinen Geist” besagt dasselbe wie: “Als es Gott gefiel, welcher mich ausgesondert hat vom Schoße meiner Mutter an und mich berufen hat durch seine Gnade, zu offenbaren seinen Sohn in mir”. Und: “Wir haben nicht den Geist der Welt, sondern den Geist Gottes empfangen” ist zu vergleichen mit dem Ausspruche: “Prüfet euch selbst, ob Christus in euch sei” “Ihr seid ein Tempel Gottes und der Geist Gottes wohnet in euch”; dazu vergleiche man: “Weilen werde ich bei ihnen und werde unter ihnen wandeln und werde sein ihr Gott, und sie werden mein Volk sein”.</p><p>Aus beiden kommt nach der Schrift auch Gerechtigkeit und Gnade. So heißt es: „Ihr seid gerechtfertigt worden in dem Namen unseres Herrn Jesus Christus und in dem Geiste unseres Gottes“, und damit übereinstimmend: „Gerechtfertigt aus dem Glauben haben wir Frieden in Hinsicht auf Gott durch unsern Herrn Jesus Christus“. „Niemand kann sagen: Herr Jesus, außer im Hl. Geiste“; Niemand kann den Hl. Geist empfangen, es sei denn vom Herrn; „Verteilungen der Gnadengaben gibt es, jedoch es ist derselbe Gott, der alles in allem wirket“; „Von Glorie zu Glorie sowie von des Herrn Geist“; „Betrübet nicht den Hl. Geist Gottes, in welchem ihr besiegelt worden auf den Tag der Erlösung“. Dazu halte man den Ausspruch: „Wenn wir den Herrn eifern machen, sind wir wohl stärker als er?“ „Der Geist spricht offenkundig“; dazu vergleiche man: „Dies spricht der Herr, der Allmächtige“. „Mein Geist steht in eurer Mitte“ ist zu vergleichen mit: „Wenn mir jemand öffnet, so werde ich und der Vater zu ihm kommen und wir werden bei ihm Wohnung nehmen“. Isaias sagt: „Und über ihn der Geist Gottes“; Christus aber: „Der Geist des Herrn, deshalb hat er mich gesalbt“, und anderswo heißt es: „Jesum von Nazareth, welchen Gott im Hl. Geiste gesalbt“, und: „Der Herr hat mich gesandt und sein Geist“. Klar genug ist ferner der dreifache Ruf der Seraphim: „Heilig, heilig, heilig ist der Herr Gott Sabaoth“; wenn du aber hörst; „Durch die Rechte Gottes nun erhöhet und nachdem er die Verheißung des Hl. Geistes empfangen hat von dem Vater“; oder; „Erwartet die Verheißung des Vaters, welche ihr gehört“; oder: „Der Geist trieb ihn in die Wüste“; oder: „Seid nicht bedacht, was ihr sprechen sollt, weil der Geist meines Vaters in euch redet“; oder: „Wenn ich im Geiste Gottes die Teufel austreibe“; oder: „Wer aber gelästert hat wider den Hl. Geist, dem wird nicht vergeben werden usw.“; oder: „Vater, in Deine Hände empfehle ich meinen Geist“; oder: „Der Knabe wuchs und ward stark im Geiste“, und: „Jesus aber, voll vom Hl. Geiste, kehrte zurück von dem Jordan“; oder: „Jesus kehrte zurück in der Kraft des Geistes“; oder: „Was geboren ist aus dem Geiste, ist Geist“, so halte dagegen das andere Wort: „Was gemacht worden ist, in ihm war das Leben“, und: „Ich werde den Vater bitten, und einen anderen Tröster wird er euch geben, den Geist der Wahrheit“; oder wenn Petrus zu Ananias sagt: „Warum hat eingenommen der Satan dein Herz, daß du belogst den Hl. Geist?“ worauf es heißt: „Nicht Menschen hast du angelogen, sondern Gott“. Der Hl. Geist, welchem diejenigen, die von dem Wertbetrage des Ackers beseitigt haben, logen, ist also Gott aus Gott. Oder: „Offenbar war er im Fleische, gerechtfertigt im Geiste“. Mehr als das kann ich doch nicht mehr sagen! Aber auch der Sohn ist Gott. Dies bezeugt der Apostel: „Aus welchem Christus ist“, sagt er, „dem Fleische nach, welcher ist Gott über allem“. „Glaube“, sagt die Schrift ferner, „an den Herrn Jesum und du wirst geheilt werden“. Und wieder: „Er redete zu ihnen das Wort des Herrn“, und: „Und nachdem er sie hinaufgeführt hatte in seine Wohnung, deckte er ihnen den Tisch und war fröhlich mit seinem ganzen Hause, weil er gottgläubig geworden war“. Oder: „Im Anfange war das Wort, und das Wort war bei Gott, und Gott war das Wort“; oder: „Damit sie die Lehre Gottes, unseres Vaters, zieren“; oder: „Es erschien die Gnade Gottes, unseres Heilands Christi, allen Menschen, uns unterrichtend“; oder: „Erwartend die selige Hoffnung und Ankunft der Herrlichkeit unseres großen Gottes und Heilandes Jesus Christus“; oder: Dies ist der Dienst des Geistes und des Wortes. „Habet acht“, heißt es ferner, „auf euch selbst und auf die gesamte Herde, in welcher euch der Hl. Geist gesetzt hat als Bischöfe, die Kirche Gottes zu werden“, womit zu vergleichen ist: „Dank weiß ich dem, welcher mich gekräftigt hat, Christus Jesus, unserem Herrn, daß er getreu mich erachtete, zum Dienst mich bestellend“.</p><p>Es wirket also, wie wir gezeigt haben, mit dem Vater der Sohn und der Hl. Geist. Denn: „Durch das Wort des Herrn sind die Himmel gefestigt und durch den Hauch des Mundes all ihre Kraft“. Der Geist muß auch angebetet werden: „Denn die Gott anbeten, müssen ihn im Geiste und in der Wahrheit anbeten“. Wenn er aber mitschafft, so ist es nicht ein Geschöpf, das die Schöpfung wirkt, auch gibt es keine geschaffene Gottheit, ebensowenig ist Gott nach Maß und Umfang bestimmbar; denn Gott ist unbeschreiblich, unbegreiflich, unfaßbar, da er alle Geschöpfe umfaßt. Ein Geschöpf dürfte man ja auch gar nicht anbeten. [Sagt ja die Schrift:] „Sie dienten dem Geschöpfe mehr als dem Schöpfer, und dadurch sind sie zu Toren geworden“. Wäre es denn nicht töricht, eine Kreatur als Gott anzubeten und dadurch jenes erste Gebot zu übertreten, welches mahnt: „Höre Israel: Der Herr, dein Gott, ist ein einziger, nicht sei dir ein neuer Gott!“ Jedoch werden in den heiligen Schriften dem Vater und dem Sohne und dem Hl. Geiste verschiedene Namen beigelegt. So wird der Vater genannt: „der allmächtige Vater“, „der Vater aller“, „der Vater Christi“. Der Sohn heißt: „das Wort“, „Christus“, „das wahre Licht“. Der Hl. Geist aber wird bezeichnet als: „der Tröster“, „der Geist der Wahrheit“, „der Geist Gottes“, „der Geist Christi“. Ferner heißt der Gott und Vater auch „Licht“, und zwar Licht, welches alles mit seinem wunderbaren Glänze erhellt, „Kraft“ und „Weisheit“. Wie aber der Vater und Gott „Licht“ heißt, so der Sohn Licht vom Lichte, „der in einem unzugänglichen Lichte wohnt“. Gott ist ganz Kraft und sonach „Herr aller Kräfte“. Der Sohn ganz Weisheit und mithin die Weisheit aus der Weisheit, „in welchem alle Schätze der Weisheit verborgen sind“. Gott ist auch ganz Leben, daher Leben vom Leben der Sohn. „Ich“, sagt er, „bin die Wahrheit und das Leben“. Von beiden hier aber ist der Hl. Geist, der Geist aus dem Vater, „denn der Geist ist Gott“. Der Geist ist der Geber der Gnadengaben, der Wahrhaftigste, der Erleuchter, der Tröster, der Verkünder des göttlichen Willens. Denn gerade so, wie der Sohn „der Engel des großen Ratschlusses“ heißt, so lesen wir auch vom Hl. Geiste: „Wir haben den Geist Gottes empfangen, damit wir wissen, was von Gott uns in Gnaden gegeben worden, was wir auch reden, nicht in überredenden Worten [menschlicher] Weisheit, sondern in der Lehre des Geistes Gottes, Geistiges mit Geistigem verbindend“.</p><p>Aber, so könnte jemand uns einwenden, so bekennen wir ja zwei Söhne Gottes, wie soll da Christus der Eingeborene sein? Wir erwidern mit den Worten der Schrift: „Wohl denn, o Mensch, wer bist du, daß du haderst mit Gott?“ Denn wenn er denjenigen Sohn nennt, der aus ihm [geboren ist], Hl. Geist aber den, der von beiden [ausgeht] — [[nur im Glauben werden sie [diese göttlichen Personen] von den Heiligen erkannt; sie sind Licht und Lichtspender, haben eine lichtgleiche Wirkungsweise und harmonieren mit dem „Vater des Lichtes“ selbst]] —, so höre das Glaubenswort, du Menschenkind, daß der Vater eines wahren Sohnes Vater ist, ganz Licht, und der Sohn eines wahren Vaters Sohn, Licht vom Licht, nicht etwa wie die geschaffenen und gemachten Dinge nur dem Namen nach; und wie der Hl. Geist der Geist der Wahrheit ist, das dritte Licht vom Vater und Sohn. Alles andere führt den Namen nur auf Grund einer Annahme und des Sprachgebrauchs, nicht aber, wie sie, in Ansehung der Wirkung oder Kraft, des Lichtes oder Gedankens. So wenn es heißt: „Ich habe Söhne gezeugt und sie emporgebracht“; oder: „Ich habe es gesagt: Götter seid ihr und Söhne des Allerhöchsten, ihr alle“; oder: „Der gezeugt des Taues Trophen“; oder: „Von welchem aus jegliche Vaterschaft im Himmel und auf Erden ist“; oder endlich: „Ich bin es, der den Donner gebildet und den Geist geschaffen“. Denn nicht hat jener wahre Vater nach Art der anderen Väter oder der Urväter angefangen, Vater zu sein, noch hört er einmal im Verlaufe der Zeit auf, es zu sein. Denn hätte er einmal angefangen, Vater zu sein, so wäre er einmal Sohn eines anderen Vaters gewesen, bevor er nämlich selbst Vater des Eingeborenen war, gerade so, wie man durch die ins Unendliche fortgesetzte Betrachtung der Väter als Kinder anderer Väter endlich auf den wahren Urvater zurückkommen muß. Auch der wahre Sohn konnte nie nach Art der irdischen Söhne neugeborener Sohn sein; denn in diesem Falle hätte der Vater einmal nicht Vater des Eingeborenen gewesen sein müssen. Und so ist auch nicht, wie andere Geister, der Geist der Wahrheit geschaffen oder gemacht, und nicht nach Art der anderen Engel wird er „Engel des großen Rates“ genannt. Denn diese haben Anfang und Ende, sie aber [Sohn und Geist] sind unfaßbar in ihrem Ausgangspunkt und ihrer Macht; sie haben alles erschaffen, indem sie in alle Ewigkeit mit dem Vater mitwirken, jenes aber wird von ihnen geschaffen, so wie es ihnen beliebt; jene [Engel und geschaffenen Geister] huldigen ihnen, sie aber empfangen die Huldigung von der ganzen Schöpfung. Sie heilen ihre Geschöpfe, jene empfangen die Heilung, jene werden nach Gerechtigkeit gerichtet, sie aber halten das gerechte Gericht ab; die einen leben in der Zeit, die anderen stehen über der Zeit; die einen erleuchten alles, die anderen werden von diesen erleuchtet; diese rufen die Kleinen zur Höhe, jene werden von dem, der vollkommen ist, gerufen; die einen verleihen Gnaden, die anderen empfangen Gnaden. Um es mit einem Worte zu sagen: jene preisen in den Himmeln der Himmel und in den anderen unsichtbaren Orten die Heiligkeit, diese aber sind die Gepriesenen und verleihen Gnaden nach Würdigkeit den Würdigen.</p><p>Übrigens nennt die Schrift viele Geister. So heißt es: “Der seine Engel zu Geistern macht und seine Diener zur Feuersflamme”; ebenso: “Alle Geister lobet den Herrn”. Wird ja auch denen, welche würdig sind, die Gabe der Unterscheidung der Geister gegeben. Denn es gibt himmlische Geister, welche sich an der Wahrheit vergnügen; irdische, die der Verführung und dem Irrtum dienen; unterirdische, Söhne des Abgrunds und der Finsternis. “Es baten ja” nach dem Evangelium die Geister, “daß er sie nicht in den Abgrund schicke”. So gebot er auch den Geistern, verscheuchte sie durch sein Wort und verstattete innert nicht, zu reden; ferner werden in den Schriften genannt “Geister des Gerichtes und Geister des Verbrennens”. Ebenso spricht die Schrift von einem “Geiste der Welt”: “Wir haben den Geist der Welt nicht empfangen”; von einem Geiste des Menschen: “Wer weiß, was des Menschen ist, als der Geist, der im Menschen ist?” und: “Der Geist, der hinstreifet über ihn und er kehret”, “Der Geist, der hinstreifet über ihn und er besteht nicht mehr”, und: “Du nimmst hinweg ihren Geist und sie vergehen”; oder: “Und Propheten-Geist ist Propheten untergeben”; oder: “Und siehe, es trat ein Geist hervor und stellte sich vor den Herrn, und der Herr spach zu ihm: Wodurch wirst du Achab täuschen? Und jener antwortete: Ich werde der Geist der Lüge im Munde der Propheten sein”. Überdies werden noch verschiedene andere Geister genannt, wie: “Der Geist der Zerknirschung” und “der Geist der Feigheit”, und “der Geist der Pytho” und “der Geist der Unzucht”, “der Geist des Sturmes”, “der Geist der Beredsamkeit”, “der Geist der Schwachheit”, “der unreine Geist”, “der taube Geist” “der stumme Geist”, “der schwerredende Geist”, “der sehr böse Geist”, welcher “Legion” heißt, und “der Geist der Bosheit”; ja an unzählbaren Stellen der Schrift werden Geister genannt, wie die Schriftkundigen wohl wissen. Aber gerade so, wie es sehr viele Söhne dem Namen und der Annahme nach, [aber nicht der Wahrheit gemäß] gibt, weil sie ja Anfang und Ende haben und in Sünden [geboren werden], so gibt es auch viele Geister dem Namen und der Annahme gemäß, welche allerdings dem Sündigen unterworfen sind. Dagegen wird der Hl. Geist allein Geist des Vaters und Sohnes, “Geist der Wahrheit”, “Geist Gottes”, “Geist Christi” und “Geist der Gnade” genannt. Dieser gibt jedem besondere Gaben; “dem einen wird gegeben der Geist der Weisheit, dem andern der Geist der Wissenschaft; dem einen der Geist der Stärke, dem anderen der Geist der Heilungen; dem einen der Geist der Prophetie, dem anderen der Geist der Unterscheidung; dem einen der Geist der Sprachen, einem anderen der Geist der Sprachenausbildungen”, und alle die anderen Gnadengaben, wie der Apostel sagt; es ist aber “der eine und derselbe Geist, der einem jeden zuteilt, wie er will”. “Dein guter Geist wird mich leiten”, sagt David, oder: “Der Geist weht, wo er will und du hörst seine Stimme, aber du weißt nicht, von wo er kommt und wohin er geht”; und wieder: “Wenn ihr nicht wiedergeboren werdet aus dem Wasser und dem Hl. Geiste”, analog sagt Paulus: “Denn in Christus Jesus habe ich euch gezeugt”. Von diesem Geiste spricht ferner Christus also: “Wenn der Tröster kommen wird, welchen ich euch schicken werde, der Geist der Wahrheit, der vom Vater ausgeht, so wird er Zeugnis geben über mich”, und: “Noch vieles habe ich euch zu sagen, jedoch ihr könnt es jetzt nicht tragen. Wenn aber jener gekommen ist, der Geist der Wahrheit, wird er euch einweisen in die gesamte Wahrheit; denn nicht wird er reden von sich selber aus, sondern was er gehört hat, wird er reden, und das Kommende wird er euch verkünden. Jener wird mich verherrlichen, weil er von dem Meinigen nahm und es euch verkündigen wird”.</p><p>Da nun der Geist vom Vater ausgeht und, wie Christus spricht, „von dem Meinen“ nimmt, so möchte ich behaupten, daß, wie „niemand den Vater kennt außer der Sohn und niemand den Sohn außer der Vater“ in gleicher Weise den Geist niemand kennt außer der Vater, von dem er ausgeht, und der Sohn, von dem er nimmt; ebenso aber kennt niemand den Vater und Sohn als der Hl. Geist, er, der wahrhaft verherrlicht, alles lehret, der Zeugnis gibt über den Sohn, der vom Vater und aus dem Sohne ausgeht und allein der Wegweiser zur Wahrheit ist; er ist der Ausleger der heiligen Satzungen, der Verkünder des geistigen Gesetzes; er ist der Führer der Propheten, der Lehrer der Apostel, der Erleuchter der evangelischen Boten; er erwählt die Heiligen, er ist das wahre Licht aus dem wahren Lichte. Der Sohn ist natürlicher, wahrer, echter Sohn, der Alleinige aus dem Alleinigen, mit ihm auch der Hl. Geist, der aber Geist genannt wird. Dies ist der in der Kirche gepriesene Gott, immer Vater, immer Sohn, immer Hl. Geist, der Allerhöchste, nur geistig aufzufassen, der eine unendliche Herrlichkeit inne hat, dem alle geschaffenen und gemachten Wesen unterworfen sind, auch alle vernunftbegabten, kurz, alles Endliche. Übrigens wurde eine Gottheit vorzüglich von Moses verkündet, Zweiheit von den Propheten, die Dreiheit aber im Evangelium geoffenbart, so wie in den Zeitabschnitten und Geschlechtern Erkenntnis und Glaube für die Gerechten sich schickte. Diese Erkenntnis ist Unsterblichkeit, sie heißt die Erkenntnis aus dem Glauben, sie wird zur Gotteskindschaft. Aber sie [die Gottheit] verkündet zuerst nur Rechtfertigung des Fleisches, so gleichsam in Moses nur die äußere Umfassungsmauer des Heiligtums aufführend; dann stellt sie dar die Rechtfertigung der Seele, so gleichsam das Heiligtum selbst schmückend, was durch die übrigen Propheten geschah; endlich erteilte sie Rechtfertigung des Geistes, so gleichsam den Gnadenstuhl und das Allerheiligste sich zur Stätte der Gegenwart aufrichtend, was durch das Evangelium geschah. Ihr heiliges Gezelte aber, ihr heiliges Volk ist nur der Gerechte, der mit ihr verbunden ist. In ihm wohnt also die eine, unendliche, unvergängliche, unbegreifliche, unerfaßliche, unbeschreibliche und unsichtbare Gottheit; jene Gottheit, die allein sich kennt und offenbart, wem sie will, und sich selbst ihre Zeugen bereitet, ruft, vorherbestimmt, verherrlicht und aus dem Totenreiche befreit und heiligt, die wiederum in eins zusammenbringt, um sich Ehre und Glauben zu verschaffen, folgende Dreiheiten: Himmlisches und Irdisches und Unterirdisches; Geist und Seele und Fleisch; Glaube und Hoffnung und Liebe; Vergangenheit, Gegenwart und Zukunft; die Zeit der Zeit und die Ewigkeit der Ewigkeit und den Sabbat der Sabbate; die Beschneidung des Fleisches und die Beschneidung des Herzens und „die Beschneidung Christi in Wegnahme vom Leibe der Sünden“. Endlich aber bereitet sie selbst alles zu ihrem Lobe, das Unsichtbare wie nicht minder das Sichtbare, die Thronen und die Herrschaften und die Fürstentümer und die Gewalten und die Mächte. Durch alles hindurch aber ertönt die eine heilige Stimme von Herrlichkeit zu Herrlichkeit: „Heilig, heilig, heilig“, lobsingend dem Vater im Sohne, dem Sohn im Vater mit dem Hl. Geiste, dem die Ehre und die Stärke von Ewigkeit zu Ewigkeit. Amen. Und wer so glaubt, wird sagen: Es geschehe, es geschehe.</p><p>Und so haben wir denn über die Dreieinigkeit und Wesensgleichheit Gottes des Vaters und Sohnes und Hl. Geistes nach unserer Schwachheit und Einfalt, ohne Sophisterei, ohne das Würfelspiel menschlich gelehrten Disputes mitzumachen, vielmehr aus den göttlichen Schriften unsere Zeugnisse gesammelt für die, welche guten Willens sind, teilweise wenigstens gesammelt, den Gläubigen zur Lehre und zur Wehr gegen die eitlen Toren, welche nicht glauben wollen. Groß ist ja die Macht des Glaubens im Hl. Geiste, welcher uns in der Hl. Schrift auf viele und mannigfache Art verkündet wird. Da aber die Gewißheit unseres Heiles in dem zuversichtlichen Bekenntnisse von der Menschwerdung des Erlösers und seiner Erscheinung im Fleische und in der Stärke unserer Hoffnung bezüglich der Auferstehung der Toten und unserer Wiedergeburt beruht, so wollen wir es bei dieser unserer vorliegenden Arbeit nicht bewenden lassen, sondern für diejenigen, welche genauer darauf eingehen wollen, noch fortfahren, aus den göttlichen Schriften Zeugnisse zu sammeln und unsere logische Erörterung zu ergänzen. So befiehlt ja auch, wie wir schon in dem Vorausgegangenen gehört haben, unser Herr Jesus selbst im Evangelium seinen Jüngern: „Gehet hin und taufet alle Völker auf den Namen des Vaters und des Sohnes und des Hl. Geistes, indem ihr sie alle Gebote halten lehret, welche ich euch gegeben habe“. Es ist das heilige, wesenhafte Wort, das vom Vater ausgegangen, durch den die Welten, die Zeiten und die Perioden geworden sind. Denn eine Zeit oder Zeitperiode war nicht vor dem Sohne. Hätte es vor dem Sohne eine Zeit gegeben, so wäre ja die Zeit größer als der Sohn. Wie könnte es denn heißen: „Durch ihn ist alles geworden, und ohne ihn ist nichts geworden, was geworden ist“. Durch ihn ist also alles geworden, was geworden ist; er selbst aber ist ungeschaffen und ewig, weil der Vater ewig war und sein Hl. Geist ewig war. Hätte es also eine Zeit vor dem Sohne gegeben, so müßte man fragen, durch wen denn die Zeit bis zum Sohne hin geworden ist? So kämen wir schließlich auf eine Torheit, die unsere Gedankenfolge zu einer Wahnvorstellung führen würde, wie sie in jener Annahme beschlossen liegt, oder vielmehr zu einer Ausschweifung der Gedanken, weitab von aller Vernunft. Vor dem Sohne gab es also keine Zeit. Denn nicht ist durch die Zeiten der Sohn geworden, sondern durch den Sohn die Zeiten und die Engel und alle anderen Geschöpfe. Nie war eine Zeit, da der Sohn nicht war oder der Geist nicht.</p><p>Einige aber hegen eine falsche Auffassung, weil sie es nicht verstehen, den Text abzuteilen. Sie sagen: „Alles ist durch dasselbe [Wort] geworden, und ohne dasselbe ist nichts geworden“. Da beschließen sie den Satz und ziehen nun eine gegen den Hl. Geist ganz blasphemische Folgerung. Sie stoßen sich also an der Stelle, und infolge der falschen Leseart straucheln sie und lassen sich zur Gotteslästerung gegen den Hl. Geist hinreißen. Aber die Stelle lautet so: „Alles ist durch dasselbe geworden und ohne dasselbe ist nichts geworden, was geworden ist“, d. h. alles, was geschaffen worden ist, ist durch ihn geschaffen worden. Der Vater also war immer, und der Geist weht aus dem Vater und dem Sohne, und es ist weder der Sohn geschaffen noch ist der Geist ein Geschöpf. Alles andere aber, was unter dem Vater und dem Sohne und dem Hl. Geiste ist, ist geschaffen und hervorgebracht; und da es einmal nicht war, vom Vater und Sohn und Hl. Geist aus geworden, durch das ewige Wort bei dem ewigen Vater. Durch dieses Wort also ist alles Geschaffene geworden, durch ihn, den König des Himmels, das persönliche Wort, unseren Heiland und Wohltäter. Denn er ist der heilige Erlöser, der vom Himmel herabgestiegen ist und im jungfräulichen Schöße das Geheimnis unseres Heiles zu vollbringen sich gewürdigt hat; er ist es, der, empfangen vom Hl. Geiste, aus Maria geboren worden ist, der das Fleisch angenommen hat, — „und das Wort ist Fleisch geworden“, — der seine Natur nicht verändert, sondern zur Gottheit die Menschheit angenommen hat, der Vollkommene vom Vater. Um das Heilsgeschäft vollkommen zu erfüllen, kam er in die Welt uns zu Liebe und um unseres Heiles willen; menschlichen Leib und menschliche Seele hat er, der Vollkommene vom Vater, angenommen und ist unter uns nicht etwa dem Scheine nach, sondern wahrhaft Mensch geworden, indem er sich zum vollkommenen Menschen aus Maria, der Gottesgebärerin, durch den Hl. Geist bildete. Er wohnte ferner nicht in einem Menschen, wie er in den Propheten zu reden und in der Kraft in ihnen zu wohnen und zu wirken pflegte, sondern der Logos selbst ist wirklich Mensch geworden. Aber er änderte nicht seine Natur, um Mensch zu werden noch auch vertauschte er die Gottheit mit der Menschheit, sondern zu der ihm eigenen Fülle seiner Gottheit und der ihm eigenen Hypostase des wesenhaften Gott-Logos nahm er hinzu die menschliche Existenz und zwar eine vollkommene menschliche Existenz, das heißt alles, was im Menschen ist und so, wie der Mensch ist. Diesen ganzen vollkommenen Menschen anzunehmen ist der Eingeborene in die Welt gekommen, damit er so in vollkommener Menschheit das ganze Heil als Gott vollkommen wirke, ohne etwas vom Menschen auszunehmen, damit nicht dieser ausgenommene Teil wiederum Teufels Anteil werde.</p><p>Wenn nun einige eitle Fabeleien zusammenspinnen und das Wort der Schrift zur Fabel machen, indem sie sagen, er habe nur Fleisch angenommen, eine Seele aber nicht, so mögen sie auf Grund des Wortes: “Wir haben den Geist Christi”, gerade auf Grund dieses Wortes erwägen, daß diejenigen, welche sagten: “Wir haben den Geist Christi”, doch ihren eigenen Geist hatten und diesen nicht wohl “ausgeschwitzt” hatten. Wie nun diese ihren eigenen Geist und den Geist Christi hatten und so mit beiden erfüllt waren, so daß Christi Geist sie besser machen konnte, ihr eigener aber von der richtigen Einsicht sich leiten ließ, gerade in derselben Weise hat man sich in bezug auf Christus die Sache zu denken, daß er nämlich, der wahrlich Gott und Geist war, den Nus des Menschen zugleich mit Leib und Seele angenommen habe. Keineswegs hat er also als Mensch den menschlichen Geist zurückgewiesen, aber er lenkte ihn und leitete ihn und machte ihn besser. Gerade so wie er das Fleisch angenommen hat, ohne jedoch der Herrschaft des Fleisches zu verfallen, so wurde er auch von dem menschlichen Geiste, den er angenommen, nicht regiert. Im Gegenteil verwickeln sich diejenigen, welche dieses meinen, noch in große Schwierigkeiten und Widersprüche. Denn blättere in der Schrift vor und zurück; sie spricht laut genug schwere Anklagen nicht gegen den Geist, sondern gegen das Fleisch. “Des Fleisches Früchte”, sagt der Apostel, “sind Buhlschaft, Unlauterkeit, Üppigkeit und dergleichen”, und: “Die im Fleische leben, können Gott nicht gefallen”, oder: “Das Fleisch begehrt wider den Geist”. Über den Geist hingegen heißt es: “Lobsingen will ich im Geiste, lobsingen im Sinne”, und; “Mein Geist ist fruchtbar oder unfruchtbar”. In diesen Stellen soll unter Geist verstanden werden, was die Schrift sonst “Herz” zu nennen pflegt, welches gleichsam der Herr des ganzen Menschen und der Lenker desselben ist, welches Gutes und Böses unterscheidet und das Gute, was wir getan, billigt. Denn "der Geist prüft die Reden, wie des Essers Gaumen den Geschmack. Der Nus ist nämlich allerdings das Unterscheidende im Menschen, aber noch nicht das Entscheidende, solange er nicht sich nach einer bestimmten Richtung leiten läßt.</p><p>Wie hat es doch bei solchem Sachverhalte einigen einfallen können, der menschlichen Natur des Herrn denselben abzustreiten. Was haben sie damit besser gemacht fürs Leben, oder haben sie nicht vielmehr Verwirrung hineingetragen? Oder wollen sie sozusagen Christus zu Hilfe kommen oder ihm einen großen Gefallen erweisen und sagen deshalb: Er hat keinen Nus angenommen? Doch „die Galater sind törichte Leute“, heißt es in der Schrift, und „die Kreter ein lügnerisches Volk“, und „Ephraim eine einfältige Taube“. Die Wahrheit ist: Da unser Herr die menschliche Natur auf dieser Erde angenommen hat, so hat er sie ganz angenommen, oder, vielleicht besser gesagt, sich selbst genommen, weil er sich ja selbst seinen Leib gebildet hat und sich selbst die Seele genommen oder besser eingegeben hat. Einige wollen jedoch die Menschheit Christi und infolgedessen sein vollkommenes Heilswerk verkürzen, indem sie ebenso unbegreiflich als irrtümlich behaupten, Christus habe einen menschlichen Verstand nicht angenommen. Sie meinen nämlich, der Nus sei eine eigene Hypostase und wagen die Behauptung, die der Schrift geläufige Wendung vom Geiste im Menschen sei naturhaft zu verstehen, wie der Apostel sagt: „Damit unser Geist und unsere Seele und unser Leib untadelig bewahrt werde am Tage unseres Herrn Jesu Christi.“ Aber sie befinden sich da in einem Irrtume. Denn wenn Nus = Pneuma ist und Pneuma = Nus, wie sie selbst sagen, die Seele aber etwas anderes ist als der Nus und als das Pneuma, so sind im Menschen nicht mehr zwei Hypostasen zu einer Hypostase verbunden, es ist nicht mehr bloß die Seele für sich eine Hypostase und eine Hypostase der Leib, sondern wir finden deren vier: der Nus ist die eine Hypostase, die Seele eine andere, wieder eine andere das Pneuma und noch eine andere der Leib. Und wenn wir noch weiter suchen, finden wir noch mehr. Denn der Mensch wird mit verschiedenen Benennungen bezeichnet, sowohl als äußerer wie als innerer Mensch. Die Schrift bedient sich solcher Benennungen mit Absicht, um unsere Gedanken darauf hinzulenken, daß wir ja nichts, was zu unserem Heile ist, übergehen und uns kein Vorwand gelassen werde, von unserem Ziele abzuweichen. Und es ist ja auch alles das im Menschen wirklich vorhanden; doch geziemt es sich nicht, allzu vorwitzig sich damit zu beschäftigen. Ist jedoch nach der Meinung unserer Gegner der Sinn dasselbe, was der Geist uns bezeichnet, der Geist dasselbe, was der Sinn, und sind diese beiden neben der Seele noch vorhanden, wie kann dann der Apostel sagen: „Lobsingen will ich mit dem Geiste, lobsingen mit dem Sinne“? In diesem Ausspruche ist doch offen dargetan, daß weder der Geist dasselbe sei wie der Sinn, noch der Sinn soviel als Geist bedeute.</p><p>Wenn es in der Hl. Schrift heißt „Die Seele, welche sündigt, soll sterben“, so gilt das gewiß nicht von der Seele in ihrer Trennung vom Leibe, und wenn gesagt wird: „Es waren im Schiffe beiläufig siebzig Seelen“, so sind damit doch wohl nicht die Seelen ohne Leib, sondern in ihrer Vereinigung mit dem Leibe gemeint. Hierher gehört auch die Gepflogenheit, einen Menschen nur nach einem Teile zu benennen, so daß wir von dem Herrn über achtzig Leiber reden, ohne dabei an unbeseelte Leiber zu denken. So ist denn auch „das Wort Fleisch geworden“, aber gewiß nicht ohne Seele, ohne alles, was zum Menschen gehört. Denn wenn nach dem Obigen die Schrift von Seelen spricht, so meint sie die Seelen zusamt dem Leibe, und wenn wir von Leibern reden, denken wir sie keineswegs unbeseelt. Wie konnten also einige behaupten wollen, daß der Nus von der Menschheit Christi zu trennen sei? Meinten sie etwa damit der Kirche zu nützen? Oder aber haben sie nicht vielmehr Verwirrung und Unordnung angerichtet? Macht man durch eine solche Behauptung nicht das ganze Heilswerk und unsere Erlösung unvollkommen und unvollständig? Wir wenigstens können uns nie zu dem Gedanken bequemen, daß der Verstand etwas außerhalb unseres Wesens Liegendes oder ein für sich selbst subsistierendes Wesen sei, sondern er existiert nur in der Zusammensetzung [ist Teil kraft eines Ganzen], er ist das Vernünftige, Denkende in jedem, der da umherirrt, sozusagen die Intelligenz des Menschen; was die Augen im Körper, das ist der Nus in der Seele, aber auch dieses behaupten wir wiederum nicht rechthaberisch, sondern sagen einfach: er ist die Denkkraft des Menschen. Was ist also endlich der Mensch? Ist er Seele oder Leib, Verstand oder noch etwas anderes? Und was wollte der Herr durch seine Ankunft auf Erden erlösen? Ohne Zweifel den ganzen Menschen. Daher muß er alles, was zum Menschen gehört, vollkommen angenommen haben. Wie hätte er anders erfüllt, was die Propheten von Christus als einem vollkommenen Menschen mit Bezug auf Verstand, Leib, Seele und die ganze Menschheit, nur ohne Sünde, geweissagt und vorherverkündigt haben? So heißt es unter anderem: „Siehe, einsehen wird mein geliebter Knecht, welchen ich auserkoren, an welchem Gefallen hat meine Seele. Ich werde meinen Geist auf ihn legen“ usw. Wo und wie ist nun dieses „einsehen“ erfüllt worden? Etwa an seiner Gottheit? Dann wäre dieselbe bisher ohne Einsicht gewesen. So absurd dieses anzunehmen ist, so gewiß ist unsere Weissagung an der Menschheit des Herrn erfüllt worden. Ist dies der Fall, so müssen wir zugleich als reine Unmöglichkeit erkennen, daß die Menschheit ohne Verstand habe einsehen können. Wenn also dieses „einsehen“ notwendigerweise auf Christus bezogen werden muß, Christus aber, das Gottes-Wort vom Himmel, „Fleisch geworden ist“ aus Maria und, wie die Schrift weiter sagt, als Mensch „unter uns gewohnt hat“, so muß er zweifellos die ganze menschliche Natur zusamt dem Verstande angenommen haben, da ja seiner menschlichen Natur das Einsehen zukommt. In ebenderselben Weise heißt es auch von ihm im Evangelium: „Er nahm zu an Weisheit und Alter.“ Nicht die Gottheit bedarf ja des Wachstums im Alter, nicht die Gottheit strebt nach Fortschritt in der Weisheit, sie, die ja ganz Weisheit ist; sondern das Zunehmen bezieht sich auf die Menschheit des Erlösers, die keinesfalls ohne den Nus war, weil sie ja sonst nicht einmal hätte weise werden können; die Menschheit war es ferner, die mit dem Alter zunahm, indem das Kind in Wahrheit heranwuchs und erstarkte.</p><p>Wenn er aber durch Annahme des Nus der Sündlichkeit unterworfen würde, so wäre dies ja a fortiori der Fall, wenn wir zugeben, daß er Fleisch angenommen, ohne welches die Sünde nicht vollbracht wird. „Offenbar sind ja die Werke des Fleisches“. Unweigerlich [also], — das einmal zugegeben, — hat er auch [ in der Konsequenz der gegnerischen Meinung —] gesündigt im Fleisch, nachdem er Fleisch angenommen. „Ich weiß“, sagt der Apostel, „daß in mir nichts Gutes wohnt, das ist in meinem Fleische.“ Wer aber wird es wagen zu behaupten, weil unser Erlöser Fleisch angenommen hat, so sei er auch der Herrschaft des Fleisches verfallen gewesen und habe folglich auch des Fleisches unheilige Werke vollbracht, in folgerichtiger Übereinstimmung seiner Leibesnatur mit jeder anderen, er, der zwar ein schwaches und echt menschliches Fleisch gehabt, das aber ohne Sünde war? Denn Gott, das Wort, da es ihm gefiel, vom Vater im Himmel herabzukommen und im Fleische zu erscheinen, hielt seinen Leib im Zaum und konnte, wie er wollte, von jeder unnützen fleischlichen Handlung ihn abhalten; wenn er aber wollte, überließ er ihn sich selbst, nämlich zu vernünftigen und für seine Gottheit anständigen körperlichen Bedürfnissen. Denn obgleich er wirklich einen Nus hatte, wie überhaupt die ganze Menschwerdung bei ihm Wirklichkeit war, so wurde sein Nus doch nicht zu unvernünftigen Begierden hingerissen, noch tat oder dachte er Werke des Fleisches wie wir, sondern als Gott in wahrhaftigem Fleische geboren aus Maria der Jungfrau, wirkte er mit Fleisch, mit Seele und Geist, kurz, mit der ganzen Menschennatur weilend unter dem Men- schengeschlechte, von oben herabgekommen, vom Vater, der wesenhafte Gott-Logos. Da komme man nicht mit Ausflüchten und sage, dieses sei bildlich gesprochen wie die Stelle: „Höre mein Geschrei.“ Denn das steht bildlich für eine Bitte, und der Sprachgebrauch ist dabei klar. Seine Menschwerdung aber ist von den Propheten vorherverkündigt worden; auch der Bericht: „Er nahm zu an Alter“ ist ja im eigentlichen Sinne zu nehmen.</p><p>Was können doch unsere Gegner dawider sagen, wenn wir lehren, daß Christus als vollkommener Mensch aus Maria geboren worden sei und einen menschlichen Nus gehabt habe? Werden wir deshalb meinen, er sei der Sünde unterworfen gewesen? Das sei ferne! Denn “nicht tat er ja die Sünde, und in seinem Munde wurde keine List gefunden”. Denn wenn er heiligen Männern seine Kraft einblies und diese infolgedessen anerkanntermaßen stets heilig, gerecht und alle Tage ihres Lebens untadelig lebten, um wieviel mehr konnte er, in welchem “die Fülle der Gottheit leibhaft wohnen wollte”, wenn er auch aus Maria, der immerwährenden Jungfrau, einen wahren Leib und eine menschliche Seele in Wahrheit und einen Nus, und was sonst noch etwa zum Menschen gehört, angenommen hat, als wahrer Gott alles in sich derart zusammenhalten und lenken, daß kein Teil seines Ich der Sünde frönte, nichts vom Bösen in Beschlag genommen wurde, nichts in den Schlingen der Lust sich finge, nichts der Schuld Adams verfiele. Deshalb sagt ja auch der Apostel: “Geworden unter dem Gesetze”, und: “Im Äußeren befunden wie ein Mensch.” Die Worte: “im Äußeren”, “geworden” und “unter dem Gesetze” miteinander verbunden bezeichnen die Vollkommenheit und Sündelosigkeit. Es heißt “geworden”, also war er vollkommen, — “unter dem Gesetze”, also war er keine Scheinexistenz, — “im Äußeren”, also blieb sich gleich sein inneres Wesen, — “wie ein Mensch”, also war er sündelos. Da sich dieses nun so verhält, täusche sich niemand mit eitlen und fabelhaften Lehren. Denn wenn ebenderselbe, welcher vom Vater im Himmei gezeugt worden ist, auch aus Maria gezeugt worden ist, so ist er wahrhaft im Himmel und auf Erden. Wenn er also im Himmel unvollkommen ist, so ist er es auch auf Erden, ist er aber oben vollkommen, so ist er es auch unten. Er hat nicht etwa nur in einem anderen Vollkommenen gewohnt, sondern er hat sich selbst vollkommen gemacht. Und er ist auferstanden von den Toten und ist nicht mehr geteilt in den Leib im Grabe und in die Gottheit und Seele in der Unterwelt, er läßt sich nicht betasten, nichts kann ihn hindern, sondern er kommt durch verschlossene Türen, wird aber von Thomas angerührt, um nicht als Scheingebilde dazustehen, sondern in Wahrheit. Thomas bezeugte ihm seinen Glauben, nachdem sich das Vorhergesagte erfüllt hatte: “Mit meinen Händen habe ich Gott gesucht, und ich bin nicht getäuscht worden”. Ein und derselbe ist Gott und Mensch zugleich, aber er hat keine Vermischung vorgenommen, sondern er hat die zwei in eins zusammenrinnen lassen. Er ließ nicht [das eine] in das Nichts zurücksinken, sondern er hat den irdischen Leib mit der Gottheit kraftvoll verbunden, zu einer Kraft geeint, zu e i n e r Gottheit zusammengebracht. E i n Herr ist er, ein Christus, nicht zwei Christusse oder zwei Götter. In ihm ist der geistige Leib, in ebendemselben die unbegreifliche Gottheit, das, was gelitten hat, ohne zu verwesen, der leidensunfähige Unverwesliche, ja das Ganze ist Unverweslichkeit. Auch da unser Herr und Gott zur Rechten des Vaters sich setzte, ließ er das Fleisch nicht zurück, sondern er hat das Ganze zu einem Wesen und zu einer Gottheit vereint und sitzet so zur Rechten des Vaters.</p><p>Dieser Eingeborene Sohn Gottes, der Vollkommene, Ungeschaffene, Unverwandelbare, Unveränderliche, Unbegreifliche und Unsichtbare, der unter uns Mensch geworden ist, der geistig auferstanden ist und nun nicht mehr stirbt und nicht mehr arm wird — denn „um unsertwillen ist er arm geworden, obgleich er reich war“ —, der ganz Geist ist, der das Fleischliche und das Göttliche vereint hat, der eine Herr, König, Christus, der Sohn Gottes, der im Himmel zur Rechten des Vaters sitzt, „über alle Herrschaften und Mächte und Gewalten und jeglichen Namen, der genannt wird“, sagt im Evangelium: „Gehet hin und taufet alle Völker auf den Namen des Vaters und des Sohnes und des Hl. Geistes!“ Das Verbindungswort „und“, welches zwischen den einzelnem Wörtern steht, zeigt an, daß der Sohn keineswegs mit dem Vater vermischt sei, sondern den Vater kennt er als den wahren Vater, sich selbst bezeichnet er als den wahren, den wesenhaften Logos, und seinen Hl. Geist als den wesenhaften Geist, den Geist der Wahrheit, den Ungeschaffenen, Unveränderlichen, den Unwandelbaren, — [die Worte sind klar,] — nicht daß einer, ein Schalk in Glaubenssachen, sich seine eigenen versteckten Gedanken mache, den Pferdefuß schlau verberge und mit der Wahrheit sein falsches Spiel treibe; denn „Gott prüfet die Herzen und Nieren“. So sprechen ja die Sektierer: Auch ich glaube, daß der Vater Vater, der Sohn Sohn und der Hl. Geist Hl. Geist sei; auch ich bekenne drei Hypostasen in einer Wesenheit. Ich betone aber: die Wesenheit ist nichts anderes als die Gottheit und die Gottheit nichts anderes als die Wesenheit, aber um der größeren Genauigkeit willen sagen wir Wesenheit, um nicht bald diese, bald jene Wesensbezeichnung der dreifaltigen Gottheit zu gebrauchen. Die genannten Häretiker aber sprechen nur, um ihre wahre Gesinnung zu verbergen und aus Hinterlist und Verstellung mit uns: Ich glaube, daß der Vater Vater, der Sohn Sohn, der Hl. Geist Hl. Geist ist, haben aber dabei einen Gedanken im Hinterhalt, in dem sie sich analog unserer Natur das Göttliche etwa so vorstellen: Wie wir einen Leib und eine Seele, einen menschlichen Geist haben, so ist das auch ähnlich bei der Gottheit. Der Vater ist gleichsam die Gestalt und Erscheinung; der Sohn ist das, was im Menschen die Seele; der Geist entspricht dem hauchenden Prinzip im Menschen. Es gibt nämlich solche, die flunkern und sich die Gottheit derart denken. Wir aber haben nicht so gelernt. Siehe, der Vater im Himmel gibt Zeugnis durch die Stimme, die er ertönen läßt, siehe, der Sohn ist im Jordanflusse, siehe, der Hl. Geist erschien in Gestalt einer Taube; doch nahm er diese Gestalt selbst an, weil er ja für sich eine Hypostase ist, keine von der des Vaters und Sohnes verschiedenartige, sondern von derselben Wesenheit. Auch noch auf andere Weise [belehrt uns die Schrift]: „Der Vater sitzet im Himmel“; dieses Sitzen ist aber nicht menschlich zu fassen, sondern auf eine gewisse unbegreifliche und unergründliche Weise. Ferner heißt es dann nicht: Der Sohn stieg zum Vater hinauf, sondern: er „setzte sich zur Rechten des Vaters“. Und betreffs des Hl. Geistes belehrt uns der Eingeborene mit den Worten: „Ich gehe nun weg, und jener wird kommen, der Hl. Geist, der Geist der Wahrheit; denn wenn ich nicht weggehe, so wird jener nicht kommen.“ Wäre der Geist vermischt mit dem Sohne, so würde es nicht heißen: „Ich gehe weg und jener kommt.“ Vielmehr soll damit gezeigt werden: [der Sohn ist] eine Hypostase und [der Geist ist] eine Hypostase.</p><p>Solches habe ich geschrieben für diejenigen, welche [kennen] wollen den inneren Zusammenhang unseres [Gnaden-] Lebens und das [feststehende] Bekenntnis, so wie es von dem Gesetze und den Propheten und den Evangelien und Aposteln und von den Tagen der Apostel an bis auf unsere Zeiten in der katholischen Kirche unverfälscht bewahrt worden ist. Obgleich durch den Neid und die Unbotmäßigkeit der Häretiker im Laufe der Zeiten verfolgt und bedrängt, ist er doch der eine und wahre Glaube, unsere Hoffnung und unser Heil in seiner Wahrheit fest und unerschütterlich bestehen geblieben, während die Häresien jederzeit sich selbst entwürdigten und von der Kirche getrennt wurden, So hören wir erst neuerdings wieder von einigen, welche die gefeiertsten Helden zu sein scheinen in gewissen Asketenkreisen Ägyptens, der Thebais und einiger anderer Gegenden; sie wandeln auf den Spuren der Hierakiten und bekennen zwar eine Auferstehung unseres Fleisches, aber nicht dieses [gegenwärtigen], sondern eines anderen an seiner Stelle; somit sind auch sie auf Abwege gekommen und haben die Wahrheit Gottes und unsere zuversichtliche Hoffnung in eitle Fabeleien verkehrt. So sehen wir uns denn gezwungen, auch darüber noch zu reden.</p><p>Die Ungläubigen leugnen die Auferstehung rundweg; die Falschgläubigen, die in rohem Unverstände die Hoffnung, welche in der Wahrheit liegt, fahren ließen, pflegen über die Auferstehung in der angegebenen Weise zu denken. Die Heiden nun, welche die Auferstehung ganz leugnen, müssen dieses tun wegen der Gottlosigkeit und der vielen, vielen Torheiten, die sie begehen. Sie hassen nämlich die Auferstehung, welche ihnen doch nur Schande und Verderben einbringen muß, weil sie Gott nicht kannten noch seine Gebote; aber sie werden doch auch gegen ihren Willen auferstehen. Schon die ganze Natur widerlegt sie deutlich genug, indem sie täglich das Bild der Auferstehung uns vorhält. Es geht der Tag unter und wir sehen dunkel das Bild des Todes, weil die Nacht den Todesschlaf versinnbildet; der Tag geht auf, weckt uns und läßt uns das Auferstehungszeichen in die Augen strahlen. Die Frucht wird abgepflückt und was [auf dem Felde] steht abgeschnitten und so uns gleichsam ein Bild unseres Hinganges aus diesem Leben dargestellt; es wird der Same in die Erde gelegt, und sie bringt neues Wachstum hervor, und so ersteht das wieder, was früher abgeschnitten worden ist. Die Heuschrecke stirbt, nachdem sie ihre Brut im Schoße der Erde begraben hat, und nach Verlauf einer gewissen Zeit gibt die Erde das ihr Anvertraute zurück. Es wird der Same der Pflanzen in die Erde gelegt und erstirbt; nachher aber gelangt er zu reichem Wachstum; denn wenn er nicht früher gestorben ist, so kann aus ihm nicht Leben sprossen. Siegel der Auferstehung hat Gott uns selbst angelegt in unseren Nägeln, zehn und zehn, die Zeugnis geben von unserer Hoffnung. Ja, es ist, als hätte er auch durch den Kranz unseres Haares unsere Auferstehung verkünden wollen; denn gerade jener Teil des Körpers, der uns abgestorben zu sein scheint, nämlich der glattgeschorene Haarboden, wächst wieder und wird uns so ebenfalls zum Zeichen der Hoffnung auf Unsterblichkeit.</p><p>Noch unsäglich vieles wäre anzufügen zur mehreren Überzeugung der Ungläubigen an der Hand von Beispielen. Aber solche Leute kann weder die Ringeltaube noch der Maulwurf eines Besseren belehren. Letzterer erstirbt nämlich auf sechs Monate, jene aber auf vierzig Tage. Wenn aber dann ihre Zeit um ist, so erwachen sie zu neuem Leben. Der Skarabäus aber verbirgt sich unmitelbar vor seinem Ende in einem Düngerstücke, welches er in die Erde eingegraben und mit Erde überschüttet hat, und doch beginnt er durch eine Art erzeugungsfähiger Flüssigkeit, die er aus sich selbst absondert, durch sich selbst wieder zu leben. Soll ich erst noch erinnern an den arabischen Vogel Phönix, dessen Geschichte Gläubigen wie Ungläubigen bekannt ist? Man erzählt sich von demselben folgendes: Wenn der Vogel Phönix in einem Alter von fünfhundert Jahren fühlt, daß sein Ende gekommen sei, so baut er sich ein Nest von aromatischen Kräutern und kommt damit in eine ägyptische Stadt, Heliopolis oder Ou, wie sie die Ägypter und Hebräer nennen. Dort schlägt er mit seinen eigenen Flügeln ebenso stark als andauernd seine Brust und erzeugt so aus seinem eigenen Leibe eine Flamme, mit der er sein eigenes Nest anzündet. Und so verbrennt er sich selbst und all sein Fleisch zusamt seinen Gebeinen. Durch Gottes Zulassung aber ergießt eine Wolke reichlichen Regen und löscht die Flamme, welche den Phönix verzehrt hat, aus. Nachdem also schon der Vogel tot, ja ganz und gar verbrannt ist, auch die Flamme ausgelöscht ist, so bleibt nur noch die frische Asche zurück. Daraus entsteht in einem Tag ein unscheinbarer Wurm, der sich bald beflügelt und ein junger Phönix wird. Dieser wächst nun bis zum dritten Tage. Groß geworden, zeigt er sich den Bewohnern jenes Ortes, läuft nun wieder in seine Heimat zurück und kommt dort zur Ruhe.</p><p>Ich muß mich wahrlich wundern über den Unglauben der Hellenen und anderer Barbaren und ihre durch und durch verblendete Gesinnung, indem sie sich nicht scheuen, in ihren mythologischen Erzählungen eine Auferstehung überhaupt anzudeuten und über die Auferstehung oft zu singen oder gar ganz klar zu lehren. So berichtet ihre Mythologie von der Alcestis, der Tochter des Pelias, welche für ihren Gemahl Admetus gestorben ist, nach drei Tagen aber von Herakles lebendig aus der Unterwelt herausgeführt wurde. Ebendasselbe geschah auch mit Pelops, dem Sohne des Tantalus, dessen Leib der eigene Vater in Stücke gehauen und ihren Scheingöttern geopfert hatte. Ferner geschieht Erwähnung des Euklees, welchen Äskulap wieder ins Leben zurückgeführt hat; des Kastor, der durch seinen Bruder Polydeukes gerettet wird, welcher sich’s erbat, Tag für Tag mit seinem Bruder das Leben [in der Ober- und Unterwelt] tauschen zu dürfen, ähnlich Protesilaus mit Laodameia. Sisyphos und Tantalus und die Töchter des Kaukasus, welche Erinnyen heißen, und Tiresias sind in den Tartarus verstoßen worden und müssen dort Strafe leiden, indem der eine durch einen Fels, ein anderer durch ein Rad und wieder ein anderer auf eine andere Weise gepeinigt werden, und zwar bis auf den heutigen Tag, so daß diese alle also nicht förmlich vernichtet worden sind, sondern noch in ihren Leibern fortexistieren. Denn hätten sie keinen Leib, wie könnten sie zur Strafe durch einen Fels oder durch ein Rad verurteilt worden sein? Und noch gar vieles ließe sich über diese Sache reden zur Bekräftigung unseres Glaubens und ihrer [= der Hellenen] Widerlegung.</p><p>Aber auch die Nachbeter der Häretiker fabeln Ähnliches und stoßen in dasselbe Hörn mit dem Unglauben, insoferne einige Häretiker, speziell die Manichäer, die Auferstehung auf die Seelen, nicht aber auf die Leiber beziehen. Ebendasselbe meinen und glauben auch die Hellenen, von denen ich eben gehandelt habe. Ihre Ansicht ist so recht läppisch und von allen guten Geistern verlassen. Gibt es denn etwas Ungeschickteres, als von einer Auferstehung zu reden, ja an eine solche überhaupt zu glauben und sie nur auf die Seele zu beschränken? Wie soll denn die Seele auferstehen, da sie doch nicht gestorben ist? Denn wir begraben ja doch nicht die Seelen in den Gräbern, sondern die Leiber. Nicht die Seele stirbt ja, sondern die Leiber; daher auch die Gewohnheit, die toten Leiber Leichname zu nennen. Wenn also jene schon überhaupt von einer Auferstehung sprechen, so ist klar, daß sich diese auf die Leiber, welche ja gestorben sind, und nicht auf die Seelen beziehen muß. Die Heiden aber, welche die Auferstehung als solche ganz und gar leugnen, werden schon durch ihre eigene Gewohnheit widerlegt, Speise und Trank an den sogenannten Festtagen zu den Gräbern der Toten zu bringen. Sie machen aus den Speisen ein Brandopfer und gießen den Wein als Trankopfer aus, wodurch sie doch gewiß den Toten nichts nützen, sich selbst aber einen Verlust zuziehen. Doch eben durch diese Gewohnheit legen sie gegen ihren Willen ein lautes Zeugnis für die Auferstehung ab. Ja noch mehr, wenn sie zu dem Grabe des Verstorbenen gekommen sind, so rufen sie den Toten beim Namen und sagen: „Stehe auf“ — und sie nennen seinen Namen —, „und iß und trink und laß dir’s gut gehen!“ Tun sie das in der Meinung, daß die Seelen in den Gräbern ihrer Leichname seien, so muß der Zustand der Seelen wohl der eines empfindungs- und teilnahmslosen Wartens sein, daß sie nämlich den Tag, der da kommen soll, und die Auferstehung zur Wiedergeburt erwarten, bis sie die ihnen gehörigen, ihnen gleichsam vermählten Leiber wieder erhalten. Zwar verabscheuen die Kinder der Hellenen das Fleisch als etwas, was schlecht ist, gänzlich vernichtet werden muß und keine Hoffnung auf Wiederbelebung habe. Tun sie das aber nicht im angedeuteten Sinne, weshalb ketten sie dann die Seelen, die doch etwas Besseres sind, an die Substanz des Leibes und bestrafen sie so eigentlich, indem sie sich von ihrer Einbildung dazu bestimmen lassen, warum verweilen sie bei den sterblichen Überresten oder in welcher Erwartung und Hoffnung harren sie dort aus? Das sollen sie uns einmal sagen! Soviel ist doch sicher, daß sie nicht glauben, daß die Seelen in den Grabmälern seien, sondern an bestimmten Orten, die von Gott jeder Seele angewiesen sind, je nachdem es ihr Leben, ihr Handel und Wandel hier verdienen. Dagegen setzt jeder selbst die Leiber seiner Angehörigen in den Leichenkammern oder eigentlich „Beinhäusern“ bei. Das ist denn doch sonderbar: alle sind diesem einen Glauben mit seinen Folgerungen ergeben — allerorts herrscht da Übereinstimmung —, von den Ungläubigen aber wird im Gegenteil diese Wahrheit geleugnet und das, was bei Gott möglich [die Auferweckung der Toten], ist bei ihnen nicht zu fester Hoffnung erstarkt.</p><p>Doch genug hievon; aus der Fülle der Belege haben wir nur einiges angerührt. Was aber diejenigen betrifft, welche dem Scheine nach Christen sind, aber dem Origenes anhangen, und zwar eine Auferstehung der Toten, unseres Fleisches sowohl als auch jenes heiligen Leibes, den der Herr von Maria genommen hat, lehren, zugleich aber meinen, daß nicht dieses Fleisch auferweckt, sondern ein anderes an dessen Stelle uns von Gott gegeben werde, so können wir nicht umhin zu sagen, ihre Meinung sei gottloser als die der übrigen, und sinnloser als die der Hellenen. Denn wenn nach ihrer Lehre ein anderes Fleisch an Stelle des unsrigen auferweckt wird, so ist das Gericht Gottes keineswegs gerecht, weil es ja ein anderes Fleisch richtet anstatt des sündhaften, oder einen anderen Leib zur Herrlichkeit des Vaterlandes und des Himmelreiches hinaufführt als den, der durch Fasten und Nachtwachen und Verfolgungen um Gottes willen sich abgemüht hat. Wie sollte ferner gemäß der häretischen Lehre das Gericht ergehen über die Seele allein ohne Beisein des Leibes, der mitgesündigt hat? Würde da nicht die Seele dem Gerichte Gottes widersprechen und sagen können, des Leibes seien die begangenen Sünden. Es könnte ja die Seele, soweit kommt es mit der Lehre unserer Widersacher, die sich mehr auf Streitsucht als Wahrheitsliebe stützt, sogar den Beweis erbringen und sagen: Nicht ich habe gesündigt, sondern der Leib. Seitdem ich den Leib verlassen, habe ich weder Hurerei noch Ehebruch und Diebstahl und Mord begangen, nicht der Idololatrie oder anderer derartiger Laster mich schuldig gemacht. Und man wird diese Verteidigung wohl begründet finden müssen. Verteidigt sie sich aber so mit gutem Grunde, was werden dann wir sagen? Ist das Gericht Gottes eine müßige Sache oder verhängt Gott ungerecht seinen Zorn über die Menschen? Das sei ferne!</p><p>Wir wissen, daß Gott kein Ding unmöglich ist und er nicht nur einen Leib ohne Seele hervorbringen sondern auch die dahingeschwundenen Leiber wiederum beleben kann, und daß diese sich durch sich selbst bewegen ohne Seelen, wenn Gott will; wie ja Gott auch betreffs jener Gebeine bei Ezechiel eine solche Wirksamkeit geäußert hat. Denn er sprach zu dem Propheten: „Befiehl, Menschensohn, daß Gebein zu Gebein sich füge, und jedes Gelenk zu seinem Gelenke“. Und da konnte man die göttliche Allmacht schauen und bewundern; denn da noch die Seelen nicht eingegossen, sondern nur dürre Gebeine vorhanden waren, erhielten diese nicht nur die Fähigkeit sich zu bewegen auf Grund der Gottestat, sondern die Gebeine wurden auch mit einer Einsicht und Erkenntnis erfüllt, wie sie sonst nicht vorkommt. Denn jene Gebeine, welche zu den Füßen gehörten, fügten sich nicht etwa aus Vergessenheit in der Nähe des Kopfes ein, noch auch suchten die Halswirbel bei dem Fußknöchel den Ort, um sich dort anzupassen, sondern jedes der Gebeine bewegte sich und fügte sich ganz verständnisvoll an seinem Gelenke ein. Wenn also Gott will, so kann er auch Leiber ohne Seele erwecken. Diese seine Macht hat er ja gezeigt, indem er gerade jenes, woran bei den Menschen am meisten gezweifelt wird, zuerst belebte durch den angeführten Befehl bei Ezechiel. Darum hat er zu Ezechiel auch nicht gesagt: Befiehl, o Menschensohn, daß zuerst der Geist komme, sondern erst nachdem er das, was das Schwierigste zu sein scheint, vollbracht hatte, nämlich die Leiber zusammenzufügen, da erst befahl er, daß die Seelen zu ihren Leibern kommen. Und wirklich „erhob sich“, wie die Schrift sagt, „eine ungeheure Schar“. Ich sage also: Gott kann auch den Leib ohne Seele auferwecken, wie soeben gezeigt wurde, aber nicht, daß der Leib für sich allein gerichtet wird; denn auch er könnte eine wohlbegründete Verteidigung gegen das Gericht Gottes vorbringen und seinerseits sagen: Von jener Seele gingen alle Sünden aus, ich bin unschuldig. Denn ich habe seit der Trennung von ihr nicht gesündigt durch Ehebruch oder Unkeuschheit und Diebstahl. Nicht habe ich seither die Götzenbilder angebetet, keines von allen anderen Verbrechen begangen. Und so würde nach der Lehre jener streitbaren Herren das Gericht Gottes illusorisch. Wie daher Gott aus Seele und Leib in ihrer Verbindung einen Menschen erschaffen hat, so wird er auch als der gerechte Richter den Leib auferwecken und ihm seine Seele wieder vereinigen. So wird auch Gottes Gericht ein gerechtes sein, in dem beide teil haben, sei es nun an der Strafe für die Sünde oder an der Gottseligkeit der Tugend und an dem Lohne, der den Heiligen aufbewahrt ist.</p><p>Und dieses Wenige, was wir aus Vielem zur Bekräftigung und Bewahrheitung unserer Hoffnung angeführt haben, möge genügen. Nunmehr wollen wir nur noch wegen derjenigen, welche meinen, daß ein anderer Leib an Stelle des in die Erde gelegten auferweckt werden wird, einiges hinzufügen, um so denen zu nützen, die es verstehen wollen und es nicht darauf ankommen lassen, ihr eigenes Leben zu verlieren. Und möchten doch alle aus meiner schwachen und unzulänglichen Arbeit Nutzen ziehen, so daß nicht ferner mehr die Auferstehung unseres Fleisches geleugnet wird! Auf ihr beruhen ja alle Schätze und die Grundlage jedes verständigen Seelenlebens und die Hoffnung jeglicher Guttat, gemäß den Worten der Schrift: „Wir haben diesen Schatz in tönernen Gefäßen“ usw. Denn obgleich schwach, führen wir doch ein enthaltsames und reines Leben, obgleich selbst unvermögend, geben wir doch Almosen, um einstens bei der Auferstehung der Toten jene Güter zu erhalten, welche wir erhoffen. Und so wird derjenige, welcher ernstlich sein Heil wirkt, bestärkt durch das Zeugnis des Glaubens und der Hoffnung und der Liebe Gottes, und Gott zuliebe harret er mitten unter Prüfungen und Verfolgungen und übermenschlichen Leiden getreu bei denen aus, welche die Auferstehung unseres Fleisches nicht leugnen, sondern fest glauben, daß eben der Leib, der jetzt in die Erde gesät wird, einst auferstehen werde. Denn zwei klare und deutliche Zeugnisse geben uns die heiligen Schriften, aus welchen wir die Hoffnung auf unsere Auferstehung fassen können, damit wir nicht durch die eitlen Fabeleien der Neuerer uns täuschen lassen, die, so wie sie selbst Betrogene sind, so auch für die Menschen durch ihre Schriften zu Betrügern werden. Um nun nicht allzu viele Zeugnisse, auf welche sich unsere Hoffnung und der Glaube an die Auferstehung gründet, anzuführen, denn die Hl. Schrift des Alten und des Neuen Bundes enthält deren gar viele, so sei nur ganz kurz folgendes erwähnt.</p><p>Wäre wirklich der Leib, welcher auferstehen wird, ein anderer, wie es einige lehren, so hätte wohl der Apostel nicht gesagt: „Es muß dieser verwesliche Leib die Unverweslichkeit anziehen“. Und betreffs der Herrlichkeit der Heiligen, daß sie glänzen werden und verwandelt werden in Herrlichkeit nach der Auferstehung, wie geschrieben steht: „Er wird auferweckt in Herrlichkeit“, sagt die Schrift, um uns zu befestigen in der Hoffnung: „Unverständiger! Was du säest, wird nicht belebt, wenn es nicht abstirbt. Und was du säest, ist nicht der Körper, welcher werden wird, sondern ein Korn, etwa vom Weizen oder von einem der übrigen. Gott aber gibt ihm einen Körper, so wie er will“. Dieses ist gesagt, um die Herrlichkeit derjenigen darzustellen, welche helleuchtend auferstehen werden. Um aber zu zeigen, daß das Samenkorn an sich selbst diese Herrlichkeit annehme, so spricht ebenderselbe, welcher durch Paulus über die Auferstehung uns belehrt, auch im Evangelium: „Wenn nicht das Weizenkorn in die Erde fällt und abstirbt, so bleibt es vereinzelt; wenn es aber stirbt, bringt es viele Frucht“. Es spricht also der Apostel von dem Leibe als einem Samenkorn und der Heiland hat an sich eben dieses Samenkorn als das seines Leibes gezeigt. Was werden wir nun daraus schließen? Ist sein eigener, der in die Erde gesenkte Leib, das ist das Samenkorn, auferstanden, oder ist jenes, was nach drei Tagen aus dem Grabe auferstanden ist, ein anderer Leib, ein anderes Samenkorn gewesen? [Wie könnten wir das glauben], da doch die Engel sagen:”Er ist auferstanden und nicht hier„. Da er zu Maria spricht: “Rühre mich nicht an! Denn noch bin ich nicht aufgefahren zu meinem Vater„, und da er seine Hände und seine Seite dem Thomas zeigt, mit den Worten:”Sei nicht ungläubig“. Aber keinen Glauben hat, wer überhaupt sagt: Er ist nicht auferstanden; einen falschen Glauben hat, wer sagt: Nicht der zur Grabesruhe gebettete Leib selbst ist auferstanden. Der Gläubige aber sagt: Ebenderselbe Leib ist auferstanden und zwar wurde er uns zuliebe mit ebendemselben Leib auferweckt, um uns in der Hoffnung der Wahrheit zu befestigen.</p><p>Zu diesem Ende behielt er auch die Wundmale der Nägel und den Lanzenstich bei und wollte sie nicht auslöschen, obschon er bei verschlossenen Türen eintrat. Denn sein fleischlicher Leib stand ja als ein geistiger auf, war aber dabei kein anderer als der frühere; nur ging dieser, mit der Gottheit verbunden, in eine gewisse geistige Feinheit über. Denn wäre jene Feinheit nicht eine geistige gewesen, wie klein müßte da der Leib gewesen sei, um durch eitle Türritze erscheinen zu können? Er wollte uns also zeigen, daß „dieser unser verweslicher Leib die Unverweslichkeit sich anziehe“; denn wenn er auch sterblich ist, so zieht er doch die Unsterblichkeit an. Darum erschien er bei verschlossenen Türen, um uns zu belehren, daß das Grobmaterielle zart und fein, das Sterbliche unsterblich, das Verwesliche unverweslich werde. Um aber alle diejenigen, welche an unser Heil, ich meine die Auferstehung, nicht glauben, zu widerlegen, behielt er auch, nachdem er den Leib in einen geistig feinen umgewandelt und die Auferstehung [= den Auferstehungsleib] mit dem Geiste eng verbunden hatte, die Wundmale der Nägel und die Seitenwunde bei und belehrte uns so, daß der Leib, welcher auferstanden ist, identisch sei mit dem, welcher am Kreuze gelitten, daß aus demselben kein anderer geworden, sondern daß nur eben der Leib, welcher früher gelitten, jetzt leidensunfähig sei, und eben das Samenkorn, welches in die Erde gelegt worden war, auferstanden sei, und zwar als ein unverwesliches. Damit wir ferner ja nicht glauben, daß nur ein Teil von ihm auferweckt worden sei, [sondern vielmehr erkennen,] daß der ganze Leib die Verwesung nicht geschaut hat — denn es heißt:”du wirst deinen Heiligen nicht schauen lassen die Verwesung„ —, und daß er ganz auferstanden ist, so sagt die Schrift: "Er ist auferstanden; er ist nicht hier.“ Der Heiland ist also wahrhaftig auferstanden und nicht betrügen uns die Schriften, die unser Leben und unser Heil sind. Und damit die Betrogenen [die nach c. 89 selbst Betrüger sind] ja keine Ausflucht finden, so zeigte er Fleisch und Bein dem Thomas und sprach zu seinen Jüngern: „Sehet mich, daß ich es bin; denn ein Geist hat nicht Fleisch und Gebein, wie ihr es mich haben seht“.</p><p>Wollte nun einer recht gescheit sein und sagen: Ja, der Leib unseres Erlösers war besonders bevorzugt [sc. und empfing die Auferstehung als speziellen Vorzug vor den anderen Menschen], weil er allein aus Maria ohne Mannessamen geboren war, so wird niemand in der Lage sein, dies zu behaupten und zu beweisen. Mit der weiteren Einwendung aber, daß nur der Leib Christi ganz auferstanden sei, von uns aber nicht derselbe Leib auferweckt werden wird, sondern an seiner Statt ein anderer, ist unvereinbar das Schriftwort: „Christus ist auferstanden als der Erstling der Entschlafenen“. Es ist ein und derselbe Leib, und dadurch auch der Erstling der Auferweckten. Inwiefern aber Christus der Erstling der Entschlafenen gewesen sei, mögen sich die Irrlehrer recht zu Gemüte führen, damit sie nicht von einem Irrtume in den anderen fallen und schließlich die anderen Bücher der Hl. Schrift der Lüge beschuldigen. Christus hat nämlich schon vor seiner eigenen Auferstehung den Lazarus auferweckt und den Sohn der Witwe in Naim. Auch Elias hat einen Toten auferweckt, Elisäus aber zwei Tote ins Leben zurückgerufen, von denen der eine noch nicht bestattet war, der andere schon im Grabe ruhte. Aber alle diese sind nach ihrer Auferweckung wiederum gestorben und erwarten jetzt auch die eine allgemeine Auferstehung. Christus aber ist [im Gegensatze zu diesen] der Erstling der Entschlafenen, „weil er nach seiner Auferstehung nicht wieder stirbt und der Tod nicht mehr über ihn herrscht“, um mit den Worten der Schrift zu reden. Einmal nämlich ist er für uns gestorben und hat so unsere Leiden für uns gelitten; einmal hat er für uns den Tod gekostet und zwar „den Tod des Kreuzes“, einmal hat er, das Wort, sich freiwillig uns zuliebe in den Tod hingegeben, damit er durch seinen Tod den Tod töte. Er, „das Fleisch gewordene Wort“, hat nicht in der Gottheit gelitten, sondern mitgelitten mit der Menschheit; das Leiden wird ihm zugerechnet, während er selbst leidensunfähig blieb; der Tod wird ihm zugerechnet, während er selbst unsterblich blieb; oder besser gesagt: seine ganze Person ist Unsterblichkeit. Denn er selbst sagt ja: „Ich bin das Leben“. [Das Leben aber stirbt niemals, sondern es kam, um Leben zu spenden, indem es für uns in den Tod ging; denn nicht von einem Menschen kommt uns das Leben,] noch vom Fleische die Hoffnung. Denn „verflucht ist, wer vertraut auf einen Menschen; denn er wird sein wie die wilde Wald-Tamariske“.</p><p>Was werden wir nun dazu sagen? Ist Christus nicht ein Mensch gemäß dem Gesagten? Das weiß doch jeder daß wir unentwegt bekennen, daß der Herr, das Wort, Mensch geworden ist und zwar nicht nur der Erscheinung nach, sondern in Wahrheit und Wirklichkeit; auch kam er nicht als ein Mensch, der zur Gottheit fortschritt. Denn unter allen Menschen seit Adam konnte keiner uns das Heil bringen, sondern der Gott-Logos, „der Mensch geworden“ ist, damit so unsere Hoffnung nicht auf einen Menschen gerichtet sei, sondern auf einen lebendigen Gott, der wahrhaft Mensch geworden ist. Denn „jeder Hohepriester wird aus Menschen genommen für Menschen bestellt“, wie es in der Schrift heißt. Darum hat also der Herr von unserem Fleische seinen Leib genommen, und darum ist das Gottes-Wort Mensch geworden, uns ähnlich, damit er in seiner Gottheit uns das Heil verleihe und in seiner Menschheit für uns Menschen leide, damit er vom Leiden durch seine Leiden uns befreie, den Tod durch seinen Tod töte. Zugerechnet aber wurde das Leiden der Gottheit, obgleich die Gottheit ohne Leiden war. So hat es dem heiligen, leidensunfähigen Worte Gottes, das uns zuliebe Mensch geworden ist, gefallen. Es verhält sich etwa so. Wenn jemand das Kleid, das er anhat, mit einem Blutstropfen besprengt und so befleckt, der Leib dessen, der das Kleid anhat, aber in keiner Weise befleckt wird, so wird dennoch die Makel am Kleide dem zugeschrieben, der das Kleid am Leibe hat. Ähnlich hat Christus im Fleisch gelitten, nämlich in eben der Menschennatur, die das heilige Wort Gottes sich selbst gebildet hat, da es vom Himmel auf die Erde herabstieg. So lehrt es auch der hl. Petrus: „Getötet dem Fleische, aber lebendig gemacht dem Geiste nach“, und anderswo: „Da nun Christus für uns gelitten hat im Fleische, waffnet auch ihr euch mit derselben Gesinnung“ ]. So wird das Blut am Mantel dem Träger zugerechnet; ihm wurde das Leiden des Fleisches der Gottheit zugerechnet, obgleich die Gottheit nichts litt, damit die Welt nicht auf einen Menschen ihre Hoffnung setze, sondern auf den Gott-Menschen, indem ja die Gottheit selbst sich das Leiden zurechnen lassen wollte. Auf diese Weise ist die Gottheit, welche ihrer Natur nach leidensunfähig ist, das Heil der Welt geworden, indem das Leiden, welches der Leib erduldet hat, der Gottheit zugerechnet worden ist, die doch selbst nichts erduldet hat. In diesem Sinne ist auch das Wort der Schrift zu verstehen: „Hätten sie ihn erkannt, so würden sie ihn, den Herrn der Herrlichkeit, nicht gekreuzigt haben“.</p><p>Gekreuzigt wurde er also, gekreuzigt der Herr, und ihn, den Gekreuzigten und Begrabenen, der am dritten Tage auferstanden und in den Himmel aufgefahren ist, beten wir an. „O Tiefe des Reichtums, der Weisheit und Erkenntnis Gottes“, wie die Schrift sagt. „Zum Teile erkennen wir und teilweise weissagen wir“. Wir schöpfen nämlich gleichsam aus dem Meere nur einen Tropfen der Erkenntnis Gottes und erfassen [unvollkommen] die Tatsache dieser großartigen Heilsveranstaltung und die Gnade unserer Hoffnung, des Heilswerkes Gottes selbst, nach dem Wohlgefallen des Vaters, nach dem Willen des Sohnes mit dem Willen des Hl. Geistes. Die Verkündigung der Auferstehung enthält die ganze Hl. Schrift an vielen Stellen, aber die Vollendung derselben war der Erscheinung des wesenhaften Wortes aufbehalten. „Denn die Fülle des Gesetzes ist Christus“. Wo spräche die göttliche Schrift nicht von einer Auferstehung? Zu allererst predigt Abels Blut die Auferstehung; denn auch nach seinem Tode „ruft es zu Gott“, wie uns die Hl. Schrift berichtet. Enoch wurde hinweggenommen und nicht menr gefunden und er sah den Tod nicht, weil er „Gott gefiel“. Noe baute nach dem Befehle Gottes die Arche, indem er sie sich herrichtete zur Wiedergeburt für seine Familie. Abraham erhielt hochbetagt und mit schon erstorbenem Leibe einen Sohn, und Gott gab ihm Erfüllung seiner Hoffnung sozusagen aus Totem, indem ja der Leib der Sara erweckt Gott zu neuer Kraft, und so ge-naturnotwendigen Laufe der Dinge schon erstorbenen Leib der Sara erweckt Gott zu neuer Kraft und so gebiert die alte Sara gleich einem jungen Weibe. Isaak wird gleichsam vom Tode ins Leben zurückgerufen, dem Vater zurückgegeben. Gott wollte nämlich dadurch, daß er wie von den Toten dem Vater das Kind lebend zurückgab, Hoffnung [der Auferstehung] ihm einflößen. Auch Jakob bezeugt uns dasselbe, weil er bezüglich seiner Gebeine eine Hoffnung hegte, die er nicht in den Hintergrund treten ließ.Sicherlich aber wollte er nicht etwa um die vergänglichen Gebeine als solche eine so große Sorgfalt angewendet wissen, sondern weil sie wieder aufleben sollten, darum befahl er nachdrücklich, daß sie aus dem Lande Ägypten weggetragen würden. Auch Joseph deutete dies an mit den Worten: „Nehmet meine Gebeine von hier mit euch, denn Gott wird euch heimsuchen“. Wäre keine Hoffnung auf die Auferstehung, wozu diente dann die gar so große Sorgfalt um die Gebeine, indem die Gerechten betreffs derselben so genaue Auftrage und Vorschriften gaben? Auch jene erste Berufung, die von Gott an Moses erging, gibt uns Zeugnis. Gott sprach nämlich: “Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs „, [wobei wir erganzen], die in der Welt schon längst gestorben sind, aber bei mir leben.Es ist einer und derselbe Geist, der im Gesetze dieses geredet hat und im Evangelium uns belehrt, was der Herr den Sadduzäern angedeutet hat mit den Worten: “Der gesprochen hat in den Propheten, sieh, da bin ich.</p><p>Hinweisen können wir ferner auf den Stab Aarons, der schon seit vielen Jahren verdorrt war und im Bundeszelte vom Anbruch der Nacht bis zum Beginn der Morgenröte aufbewahrt wurde. Während von sich aus lebende Bäume kümmerlich in zwölf Monaten, nach Verlauf eines vollen Jahres, unter den warmenden Sonnenstrahlen und der Feuchte des Regens und dem belebenden Tag und Nacht währenden Einflüsse des Taues früchte reifen, hat Gott in einer einzigen Nach dieses schwierige Werk ganz leicht vollbracht; denn es blühte der dürre Stab und trieb Blätter und brachte reife Früchte. Damit hat uns Gott ein Bild der zukunftigen Auferstehung geben wollen. Während aber bei der heiligen und von Gott eingesetzten Ehe die Geburt des Kindes nur nach und nach geschieht, indem das Kind erst neun Monate nach der Empfängnis zur Reife gelangt und geboren wird, so wird sich bei der Auferstehung die Sache ganz anders verhalten. Die Auferstehung der Leiber wird nämlich in einem Augenblick vollbracht sein. Es wird die Posaune schallen und die Toten werden unverweslich auferstehen. So wie es der Herr in dem Zelte des Zeugnisses vorgebildet hat, wo die Mandeln, welche lebende Bäume erst nach zwölf Monaten tragen, an dem dürren Holze in großer Menge wuchsen und reiften, und wo, wie schon bemerkt wurde, Gott das Werk von zwölf Monaten in einer Nacht, ja in einem einzigen Moment gewirkt hat. Und während nach dem anderen Beispiel das Kind als Leibesfrucht durch neun Monate im Schoß der Mutter getragen wird, also lange Zeit zu seiner Ausbildung und Vollendung braucht, wird bei der Auferstehung der Mensch in einem einzigen Momente vollkommen und vollständig auferstehen.</p><p>Möchten sich doch die Ungläubigen durch die Macht und Kraft Gottes überführen lassen, “dessen Willen ja niemand zu widerstehen vermag”. Möchten sie doch Moses hören und von ihm sich überzeugen lassen! “Was ist in deiner Hand?” fragt Gott, und er antwortet: ein Stab. Es war aber ein hölzerner und ganz dürrer Stab. Und Gott spricht: “Wirf ihn auf den Boden!” Und Moses warf den dürren Stab auf den Boden! Und da machte Gott das, was dürr war, saftvoll und nicht nur saftvoll, sondern auch belebt, so daß also der Stab seiner Natur nach umgewandelt war und in der Substanz anders gestaltet. Und das war nicht etwa bloß sinnliche Täuschung, sondern Tatsache; denn auf Befehl Gottes hin vollzieht es sich wirklich und nicht bloß dem Scheine nach. Um in allweg unsere Einsicht richtig zu leiten, demonstrierte er die Wirklichkeit [des Vorganges] durch Moses ad oculos: es anerkannte nämlich der Prophet, daß das Geschehene nicht nur dem Scheine nach, sondern Wirklichkeit sei, indem er davonlief. Hätte er den ganzen Vorgang nur für sinnliche Täuschung und nicht für Wirklichkeit gehalten, so wäre er beim Anblicke der Schlange nicht geflohen. Damit aber ja nicht etwa unsere streitseligen Widersacher an dieser Erzählung Anstoß nehmen und die Behauptung aufstellen, es sei ja ein ganz anderer Stab gewesen, dem Gott nach seinem Willen eine andere Gestalt mitgeteilt habe, so mögen sie vorerst vernehmen, daß Gott nicht den einen Stab für den anderen belebt habe, sondern eben jenen dürren Holzstab. Das erhellt schon daraus, daß ja Gott keineswegs die Absicht hatte, diesen dem Stabe gegebenen Leib und die von ihm angenommene Art und Form etwa zu richten oder etwa über die Schlange anstatt des Stabes Gericht zu halten, sondern uns durch diesen Stab die volle Gewißheit unserer Auferstehung geben und seine Macht zeigen wollte, damit ja niemand ihm, dem Allmächtigen, mißtraue. Und wir bemerken noch, daß Gott dieses Wunder mit aller Vorsicht gewirkt hat. Denn er hat nicht etwa nur einen Teil des Stabes lebendig gemacht, sondern den ganzen Stab, entsprechend seinem Willen.</p><p>Daß sich das alles wirklich so verhalte, und die Toten die Hoffnung auf ein ewiges Leben haben, und die in den Gräbern ruhen auferstehen werden, dafür laß mir nochmals als Zeugen auftreten den gewiß glaubwürdigen Moses. Da nämlich, so erzählt uns Moses, Ruben die bekannte Schandtat begangen hatte, fluchte ihm sein Vater, der heilige Patriarch Jakob, in folgenden Worten; “Ruben, mein Erstgeborener und der Anfang meiner Kinder, du hast großen Frevel begangen. Dein Übermut war wie überschäumend Wasser. Du sollst nicht hochkommen; denn du hast das Bett deines Vaters bestiegen und meine Lagerstätte entweiht„. Im Hebräischen steht Elthothar, was sich übersetzen läßt mit: Nicht sollst du zurückkehren, oder: Nicht sollst du deine Jahre vermehren, oder endlich: Nicht sollst du Überfluß haben. Mit einer litera tenuis geschrieben wird es zu geben sein mit: Nicht sollst du hochkommen, wie es auch die Übersetzer erklärt haben. Daß die Stelle wirklich so zu geben sei und für den frevelhaften Sohn vom Vater der Tod als Strafe festgesetzt worden sei, erhellt aus dem Zeugnisse des Moses. Als er nämlich über die zwölf Stämme seinen Segen sprach und zum Stamme Rüben kam [in seiner Rede], sprach er, eingedenk des Priestertums Levis [denn durch das Priestertum wurden die Sünden gelöst und gebunden]: “Ruben lebe, und nicht soll er sterben„. Wie sollte aber der leben, der schon vor hundertundzwanzig Jahren begraben worden war? Aber er sagte das darum, weil er wohl wußte, daß eine Auferstehung sein werde, und daß ein zweiter Tod, nämlich der Verdammnis, am Tage des Gerichts selbst folgen werde. Den Rüben also nach Erduldung einer Strafe von den andern zukünftigen zu befreien, sagte er: “Ruben lebe„, in der Auferstehung nämlich, in der alle werden erweckt werden. Mit dem Segenswunsche: “Nicht soll er sterben„, wollte er ausdrücken, er möge nicht den zweiten Tod, der Verdammnis nämlich und der ewigen Strafe, erleiden. Wäre ihm nur die Verhütung des Todes im gegenwärtigen Leben am Herzen gelegen, so hätte er nur zu sagen gebraucht: Es lebe Rüben; da er aber an die Zukunft denkt, so spricht er:”Rüben lebe, und nicht soll er sterben.“</p><p>Wer wäre wohl imstande, alle die unzähligen Zeugnisse über die Auferstehung und unsere Hoffnung auf eine Auferstehung, und zwar in Wahrheit und nicht nur dem Scheine nach, zu sammeln? Es sollen doch einmal diese ruhmredigen, streitsüchtigen Menschen sagen, ob nur ein Teil auferstehe von den Leibern, ob von allen nur ein Teil auferstehen wird oder doch wieder von einigen der ganze, und weiter, von welchen Menschen nur ein Teil und von welchen der ganze Leib auferstehen werde; woher diese Bevorzugung einiger sei, und ob es wohl bei Gott ein Ansehen der Person gebe Das sei ferne! Laßt uns nachsehen, wo und wann die Heiligen einen Toten zum Teil, und ob sie nicht vielmehr immer den ganzen Leib auferweckt haben Der Sohn der Witwe von Sarepta ist ganz auferstanden, und kein Teil von ihm ist im Tode zurückgelassen worden Der Sohn der Sunamitin ist ganz auferstanden, und der Heiland ließ keinen Teil desselben unauferweckt Ebenso erweckte der Herr den Lazarus ganz, ohne einen Teil im Grabe zurückzulassen, ja dieser kam samt den Binden und Tüchern aus dem Grabe; übrigens braucht man am Tage des Gerichts gar keine Gewänder. Auch den Sohn der Witwe in Naim hat der Erlöser ganz auferweckt sowie die Tochter des Synagogenvorstehers und die Tochter des Hauptmanns. Wie töricht erweist sich schon aus diesem die Annahme jener, welche glauben, daß ein Teil auferweckt, ein anderer Teil aber im Grabe zurückgelassen werden wird. Wir wollen aber unser Beweismaterial nochmal ansehen, was für uns eine gleich starke Stütze unserer Hoffnung geworden ist. Enoch wurde ganz hinweggenommen und hat bis heute den Tod nicht geschaut, Elias wurde ganz im Leibe hinaufgenommen und sah den Tod bis zur Stunde nicht, so daß er also an zwei lebenden Leibern die Auferstehung als eine vollkommene veranschaulicht. Und damit keiner zweifle, so stellte er zwei Typen in den zwei Erstlingen unserer Auferstehung auf: Enoch lebte in der Vorhaut, und das hinderte seine Auferstehung ebensowenig als die Fortsetzung seines Lebens im Leibe; Elias aber lebte in der Beschneidung, damit so nicht die Auferstehung auf diese oder jene beschränkt, sondern als allgemein geglaubt werde. Elias war unverheiratet, damit die Auszeichnung des jungfräulichen Lebens der Welt die Unsterblichkeit verkünde und auch selbst die Unvergänglichkeit dem Leibe nach. Damit man aber nicht etwa glaube, daß die Auferstehung und die Fortdauer des Leibes nur der Jungfräulichkeit zukomme wegen ihres besonderen Vorzuges, so war der zweite, Enoch, nicht jungfräulich, aber keusch und zeugte Kinder. Diese zwei also leben noch fort und zwar sowohl dem Leibe als auch der Seele nach, um unsere Hoffnung zu stärken und jeden Zweifel zu beheben.</p><p>Andere hingegen hat Gott samt den Leibern in die Hölle verstoßen. So öffnete sich die Erde und verschlang den Dathan und Abiron, die Söhne des Core, und den Aunam, und sie sind lebendig mit Leib und Seele von der Erde verschlungen worden. Diese wurden also in derselben Stunde abgeurteilt, ohne daß früher Leib und Seele getrennt oder irgendein Teil oder Überbleibsel zurückgelassen wurden, sondern ganz mit Leib und Seele wurden sie zur Strafe übergeben. Der Dulder Job sagt; “Bis ich wieder werde und dieser Leib, der alles das erduldet, und du mich wieder herstellen wirst”, und anderswo: “Erneuert wird werden meine Jugend, wie die des Adlers”]; Isaias aber verkündet: “Die Toten werden auferstehen, und die in den Gräbern sind, werden auferweckt werden”, weil ja der gekommen ist, “welcher herausgeführt in starker Macht Gefesselte, desgleichen die, so da erbittern, die da wohnen in den Gräbern”. Allerdings sagt Job: “Wenn der Mensch im Tode ruht, so wird er nicht mehr auferweckt werden und seinen Ort nicht wieder erkennen”. Und wirklich geschieht die Auferstehung nicht Tag für Tag, sondern sie ist auf einen bestimmten angesetzt.Er zeigt aber auch, daß er weiß, auf welchen Termin er wartet und löst die Frage sofort: “Solange der Himmel und die Erde ist, bleiben die Leiber in der Erde”. Wenn aber jener gekommen sein wird, “der die Himmel wie ein Buch zusammenrollt und die Erde erschüttert”, dann werden diejenigen, die in der Erde sind, auferweckt werden. Deshalb erging auch das Wort des Herrn an Ezechiel: “Befiehl, o Menschensohn, daß Gebein zu Gebein sich füge und ein Glied zum andern”, und so geschah es. Es entstanden an diesen Nerven und Adern und Fleisch und Haare und Nägel. Wiederum sprach Gott: “Befiehl, o Menschensohn, es komme der Geist von den vier Enden der Erde”, nämlich von den Orten welche für die Geister bestimmt sind. Warum aber doch wohl der Herr selbst nicht spricht, sondern den Menschen reden heißt? Das Wort des Herrn ist zugleich Tat und wird nicht mehr rückgängig gemacht. Er hat also hier dem Menschen aufgetragen zu befehlen, damit dadurch, daß die Leiber für kurze Zeit auferstanden unsere Heilshoffnung dargestellt, dann aber des Menschen Wort und nicht das des Herrn wieder aufgehoben würde; es sollten ja jene Gebeine wieder sterben. Wenn aber der Herr spricht: Stehet auf, so werden sie auferweckt und sterben nie wieder; Gottes Wort wird ja nie rückgängig gemacht werden.</p><p>Aus diesem Grunde wohl hat unser Herr in seiner Erscheinung im Fleische Tote erweckt, damit sie wieder den Weg alles Fleisches gehen könnten, bis er kommt und nicht mehr in der Einzahl spricht: Wache auf, sondern: Wachet alle auf! und somit die allgemeine Auferstehung ins Werk setzt. Er ist ja die Auferstehung der Toten. Darum hat er auch nach seiner eigenen Auferstehung keinen von den kurz zuvor Verstorbenen auferweckt. Es standen wohl mit ihm “viele entschlafenen Heiligen auf und erschienen vielen, sie zogen aber auch mit ihm in das Brautgemach ein. Das ist es, was wir in den Evangelien lesen, keineswegs aber, daß nur ein Teil von den Leibern der Heiligen auferstanden sei. Sondern ausdrücklich heißt es:”Leiber der Heiligen“; auch zeigten sie sich vielen, und das nicht etwa in einem anderen Leibe, sondern sie wurden von den Ihrigen als die unlängst Verstorbenen gekannt. Da aber der Herr Jesus auch andere von seiner Wundermacht überzeugen wollte, so wirkte er seine Wunder in der Art, da er sie immer leichter vollbrachte, je schwerer sie den Menschen erschienen. So als er zu der eben verstorbenen jugendlichen Tochter des Synagogenvorstehers gekommen war:”Stehe auf, Mädchen!“ Durche dieses Wort:”Stehe auf“ stärkte er das eben im Tod Aufgelöste wieder, indem ja das Mädchen noch auf dem Sterbebette lag. Den Sohn der Witwe zu Naim aber, der schon auf der Bahre hinausgetragen wurde, erweckte er viel leichter zum Leben; denn er berührte nur die Bahre, ohne etwas zum Toten zu sagen, und schon infolge des Berührens stand jener sogleich auf. Was aber noch viel bedeutungsvoller ist und über alle menschliche Erwartung weit hinaussgeht, ist das, daß er bei Lazarus, der doch schon vier Tage im Grabe ruhte, weder die Worte: “Stehe auf” aussprach, noch mit der Hand das Grab berührte, sondern so ganz leicht und ohne weitere Umstände ihm kraft seiner göttlichen Macht zuruft: “Lazarus, komme heraus!” Nun ist es gewiß viel leichter und hat gar keine Schwierigkeiten zu sagen: Komm heraus, als das Berühren; das Berühren aber ist wieder viel leichter als zu befehlen: Mädchen, stehe auf! Dies alles hat das heilige Wort Gottes getan, um uns die Hoffnung der Auferstehung vor Augen zu stellen.</p><p>Wollte ich alle Zeugnisse der ganzen Hl. Schrift aufzählen, wäre wohl dafür unser Geist zu klein, zu kurzsichtig und unerfahren, zugleich würde ich wegen der Menge derselben die Abhandlung zu sehr in die Länge ziehen. Ich fasse mich also kurz und sage: Unser Heil läßt sich kurz in wenig Worte fassen, es kommt immer wieder auf das gleiche hinaus, da eine Hoffnung auf Auferstehung uns verheißen ist. Daran glauben aber die Ungläubigen nicht, das verdrehen die Ketzer, das nehmen nicht an die Streitsüchtigen, das verwerfen die Eingebildeten. Diesen allen möge Gott Barmherzigkeit schenken und die Finsternis ihres Geistes erleuchten. Die Heiden werden, sobald sie den Hl. Geist empfangen haben, von der Wahrheit selbst und von allen den früher angeführten Zeugnissen überführt werden, besonders auch durch euch, Söhne der heiligen Kirche Gottes und des rechten Glaubens. Belehret sie daher, ihr, die ihr den Hl. Geist empfangen habt, die ihr gewürdigt worden seid der Gabe wohlgesetzer Rede, wenn ihr den Mund auftut. Belehret sie zuerst darüber, daß ihr gewürdigt worden seid, Schüler Christi zu sein, des obersten Hirten und Leiters der Seelen, weil ihr ja der Herde Christi, das ist den euch anvertrauten Volksscharen, Nahrung sammelt und darauf bedacht seid, sowohl euch selbst als auch die Herde Gottes, nämlich jeden, der aus jenem heiligen Lande Nutzen ziehen will, das bei Moses angedeutet wird, sorgsam zu weiden. Welcher vernünftige Mensch aber möchte, wenn er euch gottesfürchtige und gläubige Männer betrachtet, euch rechtgläubige Söhne der Kirche [und wenn ich einige nenne, meine ich damit alle Kinder der Wahrheit, wie geschrieben steht], wer sage ich, möchte da an irgendeiner dieser Lehren zweifeln? Ihr seid Söhne jenes weisen und starken Weibes, dessen Ruhm bei Salomo so gefeiert wird: "Wer wird finden ein starkes Weib? [Er denkt es sich selten, ja einzigartig.] So wählet denn das Bessere und liebet das Nützlichere. Erkennet aber mit mir als das starke Weib die Kirche Gottes, eure Mutter, deren Stärke keine gleichkommt, da sie in jeder erregten Verfolgung für den Namen ihres Mannes dem Tode sich weiht.</p><p>Diese so wackere Frau fragt angelegentlich ihren Bräutigam im Hohenliede: „Wo weilest du, wo ruhest du am Mittag?“ Christus aber weidet die Seinen in jenem früher erwähnten Lande, und er weidet sie nicht nur, sondern er heißt sie auch die Schuhe von den Füßen lösen, wie Moses als der Erste andeutete. Von ihm nehmet denn auch ihr diese Überlieferung und führet vor allem die in die heilige Wissenschaft Einzuweihenden mit sicherer Hand, indem ihr dafür sorgt, daß einem jeden die Schuhe gelöst werden. Diese sind aber bei jedem von uns verschieden; denn jeder hat sie sich durch sein eigen Tun geschnürt. So hört schließlich jeder auf euch, die Jünger und guten Hirten; und wer sich in Götzendienst verstrickt hat, der macht sich davon los auf eure Ermahnung hin, ein anderer sagt sich los vom Ehebruch, ein anderer von der Unzucht, ein anderer vom Diebstahl, wieder ein anderer von der Habsucht. Und nicht genug damit. Sie entsagen auch allen verabscheuungswürdigen Worten und den schändlichen Reden: in der Hoffnung auf Seligkeit gibt sich jeder durch euch, die wackeren Jünger, unter die mächtige Hand des guten Hirten, um sich weiden zu lassen. Es wird nämlich ein jeder seine Irrtümer ganz aufgeben. Haltet jedem die Wahrheit klar vor Augen, rottet die Götzenbilder aus und saget es offen und frei, wie sehr die irren, welche dieselben verehren. Haltet die Götzen keineswegs für tot, da sie ja nie Leben hatten, sondern zeiget sie nach Gebühr als eitel, nichtig und als Unding auf alle Weise und bei allen. Sie existierten ja nie, so daß man bei ihnen von einem Sein reden könnte, sondern sie sind vielmehr böse Geister, reines Lügengewebe der menschlichen Vernunft, welches Gelegenheit und Reizmittel zum Bösen wurde, indem jeder seine Leidenschaften zum Gegenstande der Verehrung aufstellte. So wurde, sobald einmal diese böse Neuerung bei den Menschen durch die Bosheit der Teufel gemacht worden war, die Unzucht als Gottheit erklärt und in rohen Umrissen Bilder derselben gemacht. Später stellte jeder seine Kunst, die er übte und durch die er sein Fortkommen fand, seinen Kindern zur Verehrung auf, und es bildete sich jeder mit dem Stoffe seines Gewerbes seine Götter, der Töpfer aus Ton, der Zimmermann aus Holz, der Goldarbeiter aus Gold, der Silberarbeiter aus Silber.</p><p>Zudem stellte jeder seine Leidenschaft dar nach der Gestaltähnlichkeit seiner eigenen Anschauung. Der Blutdürstige nannte seinen Gott Ares, der Ehebrecher und die Ehebrecherin Aphrodite, der Tyrann gab der Nike Flügel, der Verrottete und nach irdischen Gütern Lüsterne zeichnete sich das Bild des Kronos, der Weichling bildete sich seine Kybele und Rhea, wohl wegen des Blutflusses, der die Folge häufiger fleischlicher Vermischung ist, der Vagabund hinwiederum verehrte als seine Gottheit die Jägerin Artemis oder den trunkenen Bacchus oder den an Mühsalen reichen Herakles, die Buhlerin den Zeus und Apollo. Doch wozu sollte ich die ganze Menge der unzähligen Leidenschaften anführen, die im Menschen herrschen? Weit ärger aber noch als alle anderen verfielen in Irrtum die Ägypter, die nicht nur ihre Leidenschaften vergötterten, sondern sogar auch Vögel und vierfüßige Land- und Was-jsertiere, wilde Bestien und solche Tiere, die ihnen von Gott zu ihrem Dienste sind angewiesen worden So sehr haben sie die natürliche Ordnung verkehrt, daß sie, gleichsam selbst tierisch, die bei ihnen vorkommenden Tiere als Gottheit verehrten und sich nicht schämten, für einen Gott zu halten den heulenden Hund, die von kriechenden Tieren sich nährende Katze, den geilen Bock, das schwache Schaf, das schuppige und ekle Krokodil, den Giftiges fressenden Ibis, den Hühnergeier, den Habicht und den Raben, lauter dienstbare Tiere, ja sogar die sich krümmende, häßliche Schlange. Kurz, was ist das für eine Schande: sie haben Augen und sehen nicht, wie sie unrecht haben; sie haben Ohren und hören es nicht, einen Verstand und sehen es nicht ein was bei ihnen Törichtes geschieht. So sind sie wie geschlagen von einem bösen Geschick und lassen sich weder von ihren eigenen Philosophen ein Licht anzünden noch wollen sie die Wahrheit sehen mit den zum Schauen Bestellten. Sie hören ja auch nicht auf Diagoras, der aus Holzmangel seine hölzerne Heraklesstatue verbrannte und dabei höhnisch dem Gotte zurief: „Wohlan nun, o Herakles, vollbringe deine dreizehnte Arbeit, komme und koche mir mein Mahl!“ Hierauf ergriff und spaltete er die Statue unter lautem Gelächter über seinen Gott, den es gar nicht gebe, und speiste dann lächelnd das durch ihn bereitete Mahl.</p><p>Herakleitos aber ruft den Ägyptern zu: Wenn es Götter sind, warum betrauert ihr sie? Sie beklagen nämlich den Typhon und Osiris und andere unterirdische Gottheiten in lauten Trauergesängen und bejammern sie als Begrabene. Herakleitos wollte sagen: Wenn es Götter sind, warum beweint ihr sie? Wenn sie aber tot sind, dann betrauert ihr sie vergebens. Ein anderer, der Komiker Eudaimon, sagt: “Wenn es auch Götter gibt, so kann ich doch nicht von ihnen reden oder eine Vorstellung davon geben, wie sie sind. Denn vieles hindert mich daran.” Und Homer sagt: “Nichts Gutes ist die Vielherrschaft.” Der Komiker Philemon aber bemerkt: “Jene, die einen Gott anbeten, haben schöne Hoffnung auf das Heil.” Bekanntlich wurde jener Spreu fressende Apisstier von Kambyses, dem Könige der Assyrer, mit dem Schwerte am Schenkel verwundet, damit das herausfließende Blut bezeuge, daß dieser Stier kein Gott sei; die Anbeter des Kronos aber gestehen selber zu, daß ihr Gott mit eisernen Ketten gefangen gehalten werde. Wenn aber einer sich in Haft befindet, so geschieht dies nicht einfach darum, weil er einem Größeren untersteht, sondern der Betreffende ist als Übeltäter in Gewahrsam. Wenn ich nun erst über die Isis sprechen soll, die auch Atthis oder Jo heißt, und eine Tochter des Kappadoziers Apis, auch Innachos genannt, war, so schäme ich mich fürwahr einerseits, ihre Handlungen anzuführen, andererseits aber glaube ich mich doch nicht schämen zu sollen, das zu besprechen, was jene göttlich zu verehren sich nicht schämen. Schämen aber sollen sich ihre und der Aphrogeneia [Aphrodite] Anbeter, daß sie ihre Töchter und Schwestern anhalten, die Taten dieser Göttin nachzuahmen, da ja diese Göttin, gleichwie sie selbst ihren Bruder Typhon sündlich liebte, auch die anderen zu einer solchen Geschwisterliebe antreibt. Ein großer Schandfleck an dieser Göttin ist es, daß sie daß Schmachvolle an dieser Liebe zu ihrem eigenen Bruder nicht erkennt und nicht zufrieden ist mit dem Umgange nicht verwandter Männer, sondern bis zu ihrem eigenen Bruder sich verirrt. Ja noch mehr; diese Göttin zeigt sogar in ihrer unersättlichen Wollust ein Beispiel eines Brudermordes. Sie hatte auch einen Sohn Horus, dem niemand Gewißheit verschaffen konnte, wer sein leiblicher Vater sei; darum war er auch in beständigem Zweifel, ob er den Typhon als Vater ehren und lieben oder dem Osiris Kindesliebe erweisen sollte. Fürwahr ein schöner Gott das, den eine derartige Mutter selbst unterrichtete, die durch zehn Jahre in Tyrus als öffentliche Dirne lebte! Indem sie aber den Serapis oder Apis, den König der Sinopesier, vergötterten, dienten sie mehr dem Befehle eines Tyrannen als der Wahrheit.</p><p>So sieht’s mit den Gottheiten aus, welche die Ägypter verehren, welche alle einzeln aufzuzählen zuviel Zeit erfordern würde! Die Griechen aber, die sich einbilden, etwas Großes zu sein, aber ihre Wissenschaft nur in leeren Worten und spitzfindigen Reden bekunden, nicht aber in Taten, sind mehr als die anderen auf Abwege geraten. Sie holen den Kronos vom Himmel herunter, indem sie sagen, er sei von Uranus erzeugt worden, habe aber dann die Schamglieder seines eigenen Vaters amputiert. Welch schlechte Tat, welch schändliche Ansicht, als ob, wenn er nicht verschnitten worden wäre, mehrere Kronos geworden wären! Dieser Treffliche, der sich am eigenen Vater vergriff, begnügte sich nicht mit dieser ersten Verruchtheit, sondern er, der in jungen Jahren seinem Vater solches Unrecht zugefügt hatte, verschlang, älter geworden, seine eigenen Kinder Poseidon und Pluto, suchte dann den Zeus auf und verschlang, von Rhea hintergangen, einen großen umwickelten Stein statt seines Kindes, Ganz wie ein Gott! Dieser, edler Eltern Sohn, um diesen Ausdruck zu gebrauchen, Zeus mit Namen, kam in die Versuchung, der Gemahl aller Frauen zu werden, und nicht minder sein Sohn Hermes. Und wenn er doch wenigstens legitime gefreit hätte und nicht als heimlicher Buhler und Schurke. Die Penelope schändete er, und dazu verwandelte er sich in einen Bock, obgleich nach meiner Meinung er vielleicht ein Bock genannt wurde, weil er, der Edle, so wacker auf die Weiber losging. Bei Danae verwandelte er sich in Gold, um die züchtige, in ihrem Gemache weilende Jungfrau zu entehren; doch konnte er wohl niemals zu Gold werden, sondern ein Schelm, der er war, betörte er die Jungfrau durch goldene Geschenke, Bei Leda wiederum wurde er ein Schwan, um dadurch gleichsam die geflügelte Sehnsucht der in ihm entbrannten Lust zu zeigen. Als Adler aber flog er wohl niemals auf, niemals zum Adler geworden, er, der Lehrmeister der Knabenschänder, sondern er fuhr mit einem Schiffe, das wegen seiner Schnelligkeit einen Adler zum Abzeichen hatte und nach diesem Zeichen benannt wurde, nach Troja, raubte dort den Sohn des trojanischen Königs Ganymed und vollbrachte dessen Schändung. Der Pasiphae und der Europa näherte er sich als Stier.</p><p>Doch wozu soll ich die ganze Menge der Schandtaten dieses trefflichen Verführers und Lehrmeisters der Unzucht anführen, dessen Grabmal so vielen bekannt ist? Wird es ja doch auf dem sogenannten Berge Lasios auf Kreta bis heute gezeigt. Zeus war nicht nur einer oder zwei, sondern es gab deren drei oder vier. Unter diesen war jener, der den Beinamen Kronide hat, und der seinen Vater auf dem Berge Kaukasus in den Tartarus stürzte. Der zweite wurde Latiarus genannt, und von ihm stammen die Ringkämpfer ab. Ein anderer war der sogenannte Tragodos, der sich die Hand verbrannte. Obzwar er nämlich ein Gott war, so vergaß er doch, daß das Feuer brenne, und wußte nichts von den Worten, die das Feuer zu dem bocksfüßigen Satyr sprach, der zuerst dasselbe entdeckte und hinging, um es liebend zu umfassen:,.Rühre mich nicht an, du Bock; denn wenn du mich berührst, so wirst du dir den Bart verbrennen!" Auch Athene gab es nicht etwa nur eine, sondern mehrere. Eine irrte umher und hielt sich am tritonischen Sumpfe auf; eine zweite war die Tochter des Okeanos, eine andere des Kronos und so dergleichen mehr. Auch Artemis gab es viele: eine zu Ephesus, eine andere war des Zeus Tochter und so noch eine ganze Reihe. Von den Dionysoi war der eine ein Thebaner, ein anderer Sohn der Semele, ein dritter Vorsteher der Korybanten, wieder ein anderer ist jener, der von den Titanen zerrissen wurde, wobei die Kureten die mystische Fleischverteilung vornahmen. Von Herakles, den man den Übelverteiler nennt, will ich die übrigen Taten übergehen und nur eine derselben, die nämlich von ihm besonders gepriesen wird, anführen. Es hätte ihm ja wohl genug sein können, diese einzige Tat vollführt und damit der Menschheit Heil gebracht zu haben. Wenn er nämlich nicht in einer Nacht fünfzig Jungfrauen geschändet hätte, wie hätte anders dann die Welt gerettet werden können? Gewiß wäre sie sonst ganz zugrunde gegangen. Doch, um kurz zu sein, gestehe ich gerne, daß es mich verdrießt, einen förmlichen Lasterkatalog zusammenzustellen. Zu alledem haben ja Könige und unmenschliche Tyrannen manche ihrer Lieblinge, nachdem dieselben begraben waren und sie ihnen keinen anderen Beweis ihrer Gunst und Liebe mehr geben konnten, indem sie ja auch selbst sterbliche Menschen waren, unter ganz verwerflichen Vorwänden von ihren Untertanen göttlich verehren und ebenso ihren Grabdenkmälern göttliche Huldigung erweisen lassen. So wurde Antinous, der in der ihm geichnamigen Stadt starb und in einer Lustbarke begraben wurde, von Hadrian unter die Götter versetzt, ebenso Timagenes in Asien; Kanobus, der Steuermann des Menelaus, und seine Gemahlin Enmenuthis, beide in Alexandrien am Meerufer, zwölf Meilensteine von der Stadt, begraben, werden ebenfalls göttlich verehrt. Marnas, des Kreters Asterias Sklave, wird bei den Gazäern, der Schiffsherr Kasios bei den Pelusiern verehrt.</p><p>Indem ihr nun dieses alles in der Kirche sorgfältig darlegt, so zeiget auf das schlimme Ende des Todesweges und machet die soweit Verführten wieder frei. Andere führt vom Ehebruch zu keuscher Besonnenheit und bringt sie dazu, nicht bloß von heimlicher Buhlerei sich zu enthalten, sondern auch dem Umgang mit ihrer eigenen Gattin zu entsagen; da ja, wie der heilige Apostel sagt, “die Zeit kurz ist”, Unterweiset auch die Unzüchtigen, daß sie doch nicht durch Verübung solcher vor Gott und den Menschen unerlaubter Handlungen sich der Strafe überliefern. Indem ihr dies alles durch Wort und Tat ihnen unermüdet vorstellt, redet ihnen zu, daß sie von euch das annehmen; doch zeigt alles zuerst durch die eigenen Werke, laßt es Gestalt gewinnen an euch selbst und verschafft so euren Worten Glaubwürdigkeit, indem ihr durch eure Werke zuerst euch selbst erbaut, bevor ihr andere belehrt. Wo ihr kein Wort sprechet, macht es wie die Sonne, die auch ohne Worte alles allüberall aufklärt; denn mit ihrem ersten Strahle schon lehrt sie ohne Worte jeden seine Kunst, und indem ihr die heilsamen Früchte alles dessen euren Kindern oder vielmehr euren gläubigen Brüdern zuwendet, bringt sie dahin, daß sie “auf Erden wandelnd, ein Leben wie im Himmel führen”. Pflanzet, so vielen ihr könnt, Eifer und Liebe zum Mönchsleben ein durch eure Beharrlichkeit und euren aufrichtigen Glauben; verabscheut die Ketzer, bringt die Manichäer zum Schweigen, vertreibt die Marcionisten und andere ähnlichen Schlages aus dem Schafstalle Gottes und stopfet ihnen den Mund durch Widerlegung aller ihrer Scheingründe! Was sie auch immer gegen Gott und seine heiligen Propheten in frecher Weise vorbringen, jene eitlen Schwätzer, welche den Hl. Geist nicht haben; sie lästern den Schöpfer des Alls und hassen die herrlichen Gnadenerweise, die Gott durch seine heiligen Propheten allen Menschen auf dem Wege der Prophetie im Geiste zuteil werden ließ; sie erkennen auch nicht die geheimnisvollen Tiefen des Gesetzes und der Propheten, da sie ja irdische, fleischliche Menschen sind und nur wie Psychiker urteilen. Sie lästern in den Tag hinein. Wohlan, zaudert nicht, den Zuhörern deren Hirngespinst auszutreiben, indem ihr sie mit Gründen der Wahrheit überführt; denn jene durch Worte betörten Menschen werden wie dürres Reisig in den Fluten eines wasserreichen Flusses fortgerissen.</p><p>Aber, so pflegen unsere Gegner zu sagen, das muß ein schöner Gott sein, dieser Gott des Gesetzes, der, nicht wissend, wo Adam sei, fragte: “Adam, wo bist du?”, der ferner zu Kain sagte: “Wo ist dein Bruder Abel?”, und zu Abraham: “Wo ist Sara, deine Gemahlin?” Indem sie aber diese und ähnliche Reden führen, glauben sie auch dem Erlöser, dem wahren und allwissenden Gotte, nur mit dem Munde, nicht aber im Geiste und in der Wahrheit. Denn wie im Alten Bunde, so fragte auch der Heiland ähnlich: “Wo habt ihr den Lazarus hingelegt?”, und: “Wer hat mich berührt?”, und: “Wieviele Brote habt ihr bei euch?”, und: “Wen verlanget ihr, wen suchet ihr?” Darum ist die Antwort auf obigen Einwurf leicht und naheliegend. Wie nämlich der Sohn, der doch im voraus alles weiß, fragte, ebenso fragt auch im Alten Bunde der Vater, der immer derselbe bleibt und sich nicht ändert. Indem der Heiland fragte: “Wohin habt ihr den Lazarus gelegt?” zeigte er dadurch keine Unkenntnis weder des Evangeliums noch des Alten Bundes. Wohin habt ihr ihn gelegt? sagte er, um dadurch die Schwestern zu beschämen, die nicht einmal einen so großen Glauben zeigten, wie die Sunamitin, da doch diese nur mit einem Menschen, dem heiligen Propheten Elisäus, sprach, Martha aber und ihre Umgebung mit Gott selbst redeten. Und wenn der Erlöser sagte: “Wer hat mich berührt?” zeigt er dadurch nicht etwa Unwissenheit, sondern er will die Frau bestimmen, aus sich selbst Zeugnis zu geben, damit nicht er selbst, der Sohn Gottes, Zeugnis von sich gebe, sondern es von anderen empfange. Wenn er ferner sagte: “Habt ihr Brot bei euch?” so fragt er deshalb, auf daß die kleine Menge Brotes allen offenbar werde und die Größe des Wunders umso mehr Bewunderung errege, da mit so wenigen Broten eine so große Schar gesättigt wurde. Durch die Frage: “Wen suchet ihr?” will er anzeigen, daß die Suchenden selbst die Betrogenen seien, da sie Jesum, dessen Name Arzt und Heiland bedeutet, suchen und durch seine Tötung also ihr eigenes Heil verlieren.</p><p>Somit haben wir aus der Heilsökonomie des Herrn gezeigt, daß alles dieses zwar nach menschlicher Weise erzählt wird, aber doch nicht ohne Vorauswissen; denn kein vernünftiger Mensch wird sagen, Jesus habe, weil er in der besprochenen Weise fragte, nicht gewußt, wohin sie den Lazarus gelegt, nachdem er doch dem Orte ganz nahe war und kurz zuvor, im fernen Galiläa weilend, aus sich selbst angezeigt hatte, daß Lazarus gestorben sei. Auf dieselbe Art erklären wir auch derlei Stellen aus dem Alten Testamente. Wenn nämlich Gott sagte: „Adam, wo bist du?“ so fragte er nicht, weil er es nicht wußte, sondern weil er ihm zum Bewußtsein bringen wollte, wie hoch er gestanden und wie tief er in die Schande gefallen. Ebenso verhält es sich mit der Frage: „Wo ist dein Bruder Abel?“ Das heißt: Er, den du immer auf den Händen getragen und mit dem du immer vereint sein solltest, er ist von dir zu Boden gestreckt worden. Es ergibt sich auch aus dem Zusammenhang, daß Gott nicht aus Unwissenheit fragte, sondern um Kain durch seine Worte zu überführen; es heißt nämlich: „Verflucht sei die Erde in deinem Werke, und du selbst sei verflucht auf der Erde, die ihren Mund aufgetan hat, um das Blut deines von deiner Hand getöteten Bruders aufzunehmen; denn sieh, [sagt Gott,] die Stimme desselben ruft zu mir“. Und desgleichen fragt Gott nicht aus Unwissenheit: „Wo ist Sara, deine Gemahlin?“ Denn wie hätte er es nicht wissen sollen, da er sie ja doch lachend im Hause gesehen? Nicht aus Unwissenheit fragt er daher, sondern um ihren [dereinstigen] Töchtern, die sich zur Gottesfurcht bekennen würden, ihren Lebenswandel zur Lehre hinzustellen, wenn sie einmal heilige Männer durch ihre Arbeit bedienen sollten; denn sie, die doch einer so mühevollen Arbeit sich unterzog, indem sie selbst die ungesäuerten, in der Asche zu backenden Brote bereitete und dieses Werk zugleich mit ihren Dienerinnen ausführte, sah nicht einmal das Antlitz derer, die von ihr so bedient wurden und hinterließ dadurch unseren Zeitgenossen ein Beispiel gebührender Züchtigkeit. Dies wird genügen zur Richtigstellung der Einwürfe dieser Toren.</p><p>Doch unsere Gegner ruhen nicht. Sie erwidern: Das ist ein schöner Gott, der Gott des Gesetzes, der die Ägypter betrog und sein Volk beim Auszuge aus dem Lande Ägypten rauben lehrte. Aber jene Toren bedenken nicht, daß bei Gott nichts unvergolten bleibt, daß seine Urteile gerecht sind und er seiner nicht spotten lasse. Was meinten denn wohl die Ägypter, da sie die Juden anhielten, umsonst zu arbeiten, und zwar nicht nur einige Jahre, sondern durch 215 Jahre, wozu noch die 215 Jahre kommen, welche unter Joseph verflossen sind. Wie dem Abraham und seinem Samen ein Aufenthalt von 40 Jahren in der Fremde war verkündet worden mit den Worten: „Dein Samen wird fremd sein im fremden Lande“, so geschah es auch wirklich. Nur teilte Gott in seiner übergroßen Güte die Jahre der Wanderschaft in zwei Teile und ließ sie 215 Jahre in Kanaan verleben, die restierenden 215 Jahre aber verteilte er auf den Aufenthalt in Ägypten. Die Zahl dieser Jahre läßt sich auf folgende Weise berechnen: Abraham zählte damals 75 Jahre; es sind daher vom fünfundsiebzigsten Jahre des Abraham bis zur Geburt Isaaks 25 Jahre. Isaak zeugte den Jakob im Alter von 60 Jahren, gibt zusammen 85 Jahre. Jakob zeugte mit 89 Jahren den Levi, das sind im Ganzen 174 Jahre. Levi zeugte 44 Jahre alt den Kaath, und im siebenundvierzigsten Jahre des Levi zog Jakob nach Ägypten; gibt im Ganzen 211 Jahre wozu noch die 4 Jahre nach dem Einzüge in Ägypten kommen, was zusammen 215 Jahre gibt Von da an rechnet man weitere 215 Jahre des Aufenthaltes der Israeliten in Ägypten. Kaath nun zeugte nach der Wanderung nach Ägypten im fünfundsechzigsten Jahre seines Alters den Vater des Moses, Abraham [Amram], daher sind es vom funfundsiebzigsten Jahre des ersten Abraham bis zur Geburt des zweiten 280 Jahre; seit dem Einzüge in Ägypten aber 65 Jahre. Abraham erzeugte im Alter von 70 Jahren den Moses, mithin sind es vom älteren Abraham 350 Jahre, seit der Einwanderung aber 135 Jahre. Moses zog in seinem dreißigsten Jahre aus Ägypten durch das Rote Meer, was vom älteren Abraham an 380 Jahre, seit der Einwanderung aber 565 Jahre gibt. Die übrigen 50 Jahre verbrachten sie nach dem Durchzuge durch das Rote Meer bis zur Ankunft in Palästina nicht wegen der Länge des Weges, sondern wegen der Kämpfe und Hindernisse seitens der auf der Wegstrecke wohnenden Völkerschaften. Es sind daher vom fünfundsiebzigsten Jahre des alten Abraham, in welchem ihm die Verheißung gegeben wurde, bis zu Moses und der Ankunft der Söhne Israels in Palästina 430 Jahre, vom Eintreffen in Ägypten aber bis zur Ankunft in Palästina 215 Jahre.</p><p>Holl bemerkt unter Hinweis auf die Angaben bei J. Africanus, Hippolyt, Eusebius: „E. weicht… von allen ab und hat seine Quelle entweder mißhandelt oder bereits verderbt vor-gefunden.“</p><p>Nachdem nun die Juden ohne Lohn durch so viele Jahre gearbeitet hatten, wäre es da nicht vor Gott und den Menschen gerecht gewesen, ihnen wenigstens am Ende ihren Lohn zu geben? Gott handelte also nicht ungerecht, da er sein Volk mit Beute beladen von dort wegführte. Wenn aber jemand noch Bedenken tragen sollte, ob die Jahre wirklich so zu zählen seien, so möge er die Worte des Moses selbst hören: „Der Aufenthalt der Söhne Israels in Kanaan und in Ägypten dauerte vierhundertdreißig Jahre“. Wenn mithin hier Gott der Herr selbst für diesen durchaus gerechten Lohn Sorge trug, wie muß da nicht jeder Einwurf von Seiten derjenigen zunichte gemacht werden, die den heiligen Gott selbst tadeln wollen? Den wahren Gott kann ja niemand tadeln, und wer es versuchte, der schleuderte den Vorwurf und Tadel nur gegen sich selbst. Ein anderer törichter Einwurf vom Schlage des erstgenannten ist bei ihnen gang und gäbe, nämlich: Ein schöner Gott ist der Gott des Gesetzes, hat er ja doch die Kananäer benachteiligt, um ihre Wohnsitze den Israeliten zu geben „die Häuser nämlich, die sie nicht gebaut, und die Öl- und Feigen- und Weingärten, die sie nicht gepflanzt haben“. Diesen erwidere ich: O ihr Toren! Wenn Gott ein Mensch wäre, so würde, was heute gesprochen und getan wird, an ihm vorübergehen und nicht in seinen Gedanken haften bleiben. Da aber Gott eben Gott ist und nicht Mensch, vergißt er in seiner strafenden Gerechtigkeit nie und nimmer auf noch so viele Geschlechter hinaus, was gegen ihn getan und verübt worden ist. Wenn sie das noch nicht wissen sollten, so will ich es ihnen jetzt zeigen.</p><p>Alle wissen, daß der gerechte Noe nach der Sintflut allein in der Welt übrig geblieben ist. Als nun er und seine drei Söhne übrig geblieben waren, suchte er in seiner Gerechtigkeit auch seine Söhne gottesfürchtig zu erziehen, damit sie nicht in dieselben Übel gerieten wie die Menschheit in der Sintflut, und er zeigte ihnen daher die Gottesfurcht nicht bloß mit Worten, sondern forderte auch durch einen Eidschwur von jedem einzelnen derselben wohlwollende Liebe zu den Brüdern. Er verteilte gleichsam, zum Erben der Welt von Gott bestimmt, seinen drei Söhnen die ganze Erde durch das Los und wies einem jeden seinen Anteil durch das Los an. Dem erstgeborenen Sem fiel als Anteil das Land Persien und Baktrien bis Indien und bis in das Gebiet der Rhinokururer zu. Dies liegt in der Mitte zwischen Ägypten und Palästina gegenüber dem Roten Meere. Cham, der zweite, bekam das Gebiet von Rhinokurura bis Gadeira gegen Süden zu; Japhet, der dritte Sohn, das Land von Medien bis Gadeira und bis zu den Rhinokururen gegen Norden.</p><p>Sem bekam Kinder und Kindeskinder und sie zerfielen infolge der Spracheneinteilung in verschiedene Sprachen und Stämme und Reiche. Ihre Namen sind: Elimäer, Päoner, Lazer, Kossäer, Gasphener, Palästiner, Inder, Syrer, Araber mit dem Beinamen Tajaner, Arianer, Masyrelier, Hyrkaner, Magusäer, Troglodyten, Assyrer, Germanen, Lyder, Mesopotamier, Ebräer, Koelener, Baktrianer, Adiabener, Kamelier, Sarazener, Skythen, Chionen, Gymnosophisten, Chaldäer, Parther, Enter, Kordylener, Massener, Phöniker, Madienäer, Komagener, Dardanier, Elamasener, Kedrusier, Elamiter, Armenier, Kilikier, Ägypter, Kappadoker, Phöniker, Pontiker, Marmarider, Bioner, Karier, Chalyber, Psylliter, Lazer, Mossynöker, Iberier, Phrygier. Cham, dem zweiten unter den Söhnen des Noe, wurden an Kindern und Kindeskindern zweiunddreißig geboren: Die Äthiopier, Trogloditer, Aggäer, Gangener, Sabener, Ichthyophagen, Hellaniker, Ägypter, Phöniker, Marmarider, Karier, Psyliter, Mossynöker, Phrygier, Makedonier, Krakoner, Syrtiter, Leptiter, Magneten, Bithynier, Nomaden, Lykier, Mariandener, Pamphilier, Moschesidier, Pisidener, Augaläer, Kilikier, Maurusier, Kreter, Magarder, Numidier, Ophräer, Byzakener, Nasomener, Phasginer, Maziker, Garamer, Getuler, Blemmyer, Auxomiter. Diese alle wohnen von Ägypten bis zum Ozean. Auch haben sie folgende Inseln inne: Kurkudalopadusa, Gaulos, Ride, Melita, Kerkyra, Mene, Sardane, Gortyna, Kreta, Klaukos, Thera, Arianos, Astypaläa, Chios, Lesbos, Tenedos, Imbros, Jasos, Samos, Kos, Knide, Nisuros, Megiste und Kypros. Dem dritten Sohne Japhet endlich wurden bis zur Spracheneinteilung Kindeskindern fünfzehn geboren: Die Meder, Garganer, Arrheer, Amazonen, Koller, Korzener, Beneagener Galater, Kappadoker, Paphlagonier, Mariandener, Tibarener, Chalüber, Mossynöker, Kolcher, Melaschener, Sauromaten, Mäoter, Skythen, Taurier, Thraker, Basterner, Illyrier, Makedonier, Libyer, Panomer, Uesterer, Venner, Daunier, Japygier, Kalabrier, Hippiker, Latiner oder Römer, Tyrrhener. Gallier, Kelten, Libystener, Kampaner, Keltiberer, Gallier, Aquitanier, Illyrianer, Basanter, Samier, Kartaner, Lusitanier, Wakäer, Brethaniker, Skoter, Spanier. Ihre Insel heißen: Bretannia, Sikilia, Euböa, Rhodos, Chios, Lesbos, Kythera, Zakynthus, Kephalenia, Ithaka, Kerkyra, Kypros. Wenn der Name eines Volkes oder einer Insel doppelt angeführt wurde, nämlich im Anteil des einen und eines anderen, so liegt der Grund darin, weil entweder sie innerhalb derselben Grenzen wohnten, oder weil gelegentlich Kolonien entstanden, oder endlich weil Cham Gebietsteile gewaltsam an sich riß, indem er seinen Bruder Sem übervorteilte und von seinem Anteile ihm wegnahm. Dies, damit niemand sich darüber verwundere oder die Sache bezweifle.</p><p>Da nun alle diese Völkerschaften von den drei Söhnen Noes abstammten und die ganze Erde in drei Teilen unter diese drei Söhne verteilt wurde, verlangte, wie ich früher schon bemerkte, der Vater von ihnen einen Eid, daß keiner an dem Anteile des Bruders sich vergreife; und wer die Bestimmung des Eides überträte, sollte mit seinem ganzen Geschlechte zugrunde gehen Da nun Palästina und die umliegenden Landschaften durch das Los dem Sem zugefallen waren, fiel der gewaltige Chanaan, Chams Sohn, in das spätere Palästina oder Judäa ein und raubte es. Gott nun war langmütig und gab ihm Zeit zur Buße, damit die Nachkommen Chams in sich gingen und den Nachkommen Sems ihren Anteil zurückgäben. Doch jene zeigten keine Reue, und als sie das Maß vollgemacht, rächte Gott, der Gerechte, nach vielen Geschlechtern die Übertretung des Eides. Also „mußte das Maß der Amorrhäer voll werden“ Sem zeugte den Arphaxad, Cham den Chanaan, Chanaan aber erzeugte nach der gewaltsamen Besitzergreifung den Amorrhäus und Gergesaus und Pheregäus und Euäus und Arukäus und Aradius und Sidonius Auf diese Weise zählt man die Geschlechter bis zur Rache für Sem. Der beraubte Sem erzeugte, wie gesagt, den Arphaxad, Arphaxad zeugte den Kainas, Kainas den Sala, Sala den Eber; da fand der Turmbau statt. Eber zeugte den Phalek, und damals erfolgte die Teilung der Erde und der Sprachen. Phalek zeugte den Rhagau, Rhagau den Seruch, Seruch den Nachor, Nachor den Tharre, Tharre den Abraham, Abraham den Isaak, Isaak den Jakob mit dem Beinamen Israel, von dem die Israeliten den Namen haben; Jakob zeugte den Judas, Judas den Phares, Phares den Esrom, Esrom den Aram, Aram den Aminadab, Aminadab den Naasson und den Salmon. Dies ist die Geschlechtsfolge von Sem. Da also diese von den Söhnen Chams Unrecht erlitten hatten und ihres eigenen Gebietes beraubt worden waren, rächte sie Gott, indem er die Nachkommen Chanaans vertilgte gemäß ihrem Eide; und so nahmen die Nachkommen Sems ihr Eigentum wieder an sich. Kein Unrecht hat also Gott begangen, indem er vielmehr jedem Teile das ihm Gebührende gab; denn „Gott läßt seiner nicht spotten“, wie ich oben bemerkt habe.</p><p>Da Gott beim Auszuge der Israeliten die Synagoge sich verbinden wollte, sprach er zu Moses: „Löse die Schuhe von deinen Füßen!“ Wer nämlich zu einem Bade gelangen will, muß zuerst die Schuhe ablegen. Obgleich nun schon lange Zeit verflossen und „jeglicher auf seinem Wege abgeirrt war“ und auch die Synagoge selbst in ihren Übeln verharrte, ließ Gott noch nicht das Bad der Wiedergeburt erscheinen, sondern schob es noch auf viele Jahre hinaus auf und eröffnete erst später in seiner Kirche dies heiligste Taufbad. In Moses zog er [seinem Volke] die Schuhe aus, in den Propheten nahm er [ihm] den äußeren Überrock ab, indem er dem Jeremias nur den Leibrock ließ. Bei Johannes warf er alle Kleidung der Welt weg und bekleidete ihn mit einem Gewande aus Kamelhaaren. Endlich in dem Erlöser und seinen Schülern legte er „die Gestalt dieser Welt ab; denn von oben, vom Himmel herab bekleidete er sie nach der Reinigung durch das Wasser mit dem Gewande des Feuers und des Hl. Geistes. Obwohl aber die Israeliten seinen Gnadenvorzug sahen, erkannten sie doch nicht, daß er Gott sei, weshalb denn auch schon der Prophet mit ernsten Vorwürfen über sie klagte wegen der Unehre, die sie dem Erlöser bereiten würden: “Also vergeltet ihr dem Herrn, o törichtes und herzloses Volk!„ Sie erkannten nicht, daß er es war mit dem im Anfange der Vater zu Rate ging, sprechend: “Lasset uns den Menschen machen nach unserem Bilde und Gleichnisse!„ Die Worte: “Lasset uns machen„ bezeichnen nicht die Einzahl, sondern es beriet sich eben der Vater mit dem Sohne und dem HL Geiste. Denn “durch das Wort des Herrn sind die Himmel gefestigt worden und durch den Geist seines Mundes all ihre Macht„. Auch verstanden sie nicht, wenn es in demselben Buche heißt: “Feuer ließ regnen der Herr, nämlich der, welcher zu Abraham gekommen, vom Himmel herab von dem Herrn„, [nämlich von dem, der ihn gesandt hatte]. Nicht erkannten sie, daß er sie aus Ägypten befreit, nicht verstanden sie das prophetische Wort: “Und du, Bethlehem, bist nicht die geringste„. Wie konnte man denn eine Stadt “die geringste„ nennen, welche den umschloß, den Himmel und Erde nicht zu fassen vermögen? Ferner: “Aus dir wird hervorgehen der Führer.” Wer ist nun der, der aus Bethlehem hervorgeht? Es ist ein Mensch. Wie kommt es nur, daß er Gott genannt wird?</p><p>Gott und Mensch zugleich, — daran stoßen sich unsere Gegner. Aber es heißt ja doch in obigem Buche: “Sein Ausgang ist vom Anbeginn seit Erschaffung der Welt.” Das kann nimmermehr von einem Menschen gelten, sondern nur von Gott. Auch erinnern sie sich da nicht des Wortes: “Sieh, eine Jungfrau wird empfangen und einen Sohn gebären, und man wird seinen Namen Emmanuel nennen”. Dieses: “Man wird nennen” bezieht sich nämlich auf die Sitte frommer und gläubiger Söhne der Kirche; denn auf die Frage der gottesmörderischen Juden betreffs des Erlösers, wie man doch an einen Gekreuzigten glauben könne, hört man von den Gläubigen die Antwort: Bei euch ist er gekreuzigt worden, unter uns aber ist er Gott. Auch Davids Zeugnis hören sie nicht und verstehen nicht sein Wort, das er als Seher im Hl. Geiste sprach, erschauernd vor dem zukünftigen Heilswerke eben des Herrn: “Es sprach der Herr zu meinem Herrn: Setze dich zu meiner Rechten“ usw. — Der alte Sabbat ist vergangen, der wahre Sabbat wird bei uns gepredigt; aufgehört hat die frühere Beschneidung, welche nur einen sehr kleinen Körperteil beschnitt, und in Kraft ist dafür jene himmlische Beschneidung getreten, welche den ganzen Körper trifft; denn das Wasser und die heilige Anrufung betrifft nicht nur e i n Glied des Menschen, sondern reinigt und beschneidet den ganzen Leib des Menschen und befreit ihn von allen Übeln. Alle diese Geheimnisse aber sind der heiligen Kirche anvertraut worden. Und doch erhoben sich wider sie gewaltige Feinde, die sich ihre Hausgenossen nennen, obgleich sie nicht dem wahren Glauben der Apostel angehören; denn”wenn sie aus ihnen gewesen wären, wären sie auch bei ihnen verblieben". Da sie aber unechte Söhne und Mischlinge sind, folgen sie wiederum der bösen Begierde nach dem Wohlgeruche der Fische und Feigen Ägyptens, indem sie fort und fort den Sohn Gottes lästern. Hierher gehören die Ariomaniten, die wir schon oben gebrandmarkt haben, ebenso die Sabellier, welche eigentlich ganz und gar die Existenz des Sohnes und des Hl. Geistes leugnen, indem sie sagen, daß der Sohn selbst der Vater sei und der Vater selbst der Sohn und der Hl. Geist selbst der Vater, so daß eigentlich weder der Sohn noch der Hl. Geist existieren; und dadurch haben sie sich als zweite Juden und Gottesmörder gezeigt. Die Ariomaniten aber sind unter allen die gottlosesten, da sie es wagen, den Sohn vom Wesen des Vaters zu trennen und zu unterscheiden und erklären, der Sohn verdiene nicht die gleiche Ehre wie der Vater, auch sei er nicht aus dem Wesen des Vaters gezeugt. Andere sind gleichsam deren Sprößlinge und, erst unlängst entstanden, in denselben mit inbegriffen. Da sie den Hl. Geist lästern, so möchte ich sie vielmehr den Juden beizählen, mit den Sadduzäern und Samaritanern und anderen ruhmlosen Toten und Ungläubigen auf gleiche Linie stellen.</p><p>Um aber nicht die Zeugnisse gegen diese Menschen mit Tinte und Papier zu weit auszudehnen, und um den Lesern dadurch nicht lästig zu fallen, soll den Sabellianern, abgesehen von den anderen Zeugnissen, das Zeugnis am Jordan genügen, von dem ich schon oben Erwähnung gemacht habe. Der Sohn ging ja in Wahrheit an den Jordan, er, der menschgewordene Gott, der, ohne sein Wesen zu ändern, Fleisch angenommen hat, der ohne den Samen eines Mannes aus der heiligen Jungfrau in der Kraft des Hl. Geistes seinen Leib genommen, d. h. eine vollkommen menschliche Natur mit Seele und Leib. Es kam also zu Johannes an den Jordan der Gott und Mensch, da einer und derselbe Sohn Gottes, Christus und Herr ist. Der Vater aber rief vom Himmel herab zum Zeugnisse für seinen an den Jordan gekommenen Sohn: „Dieser ist mein geliebter Sohn“. Der Hl. Geist aber kam in Gestalt einer Taube über ihn herab, nachdem er ins Wasser getreten war, um dies Wasser rein zu erklären für diejenigen, welche auf den Namen des Vaters und des Sohnes und des Hl. Geistes getauft werden sollten. Für die Arianer dagegen soll nebst dem bereits Gesagten folgendes Wort des Sohnes genügen: „Ich bin im Vater, und der Vater ist in mir“. Damit zeigte er ja seine Gleichheit mit dem Vater und seine vollbürtige Sohnschaft. Den Abkömmlingen der Arianer aber, die den Geist lästern, gelten jene zwei Zeugnisse, die wir oben bereits angeführt haben; das eine von Daniel lautet: Sidrach, Misach und Abdenago fordern im Feuerofen die ganze Schöpfung Gottes zugleich mit sich selbst zum Lobe und Preise Gottes heraus, ausrufend: „Lobpreiset den Herrn, alle Werke des Herrn!“ und dann zählen sie auf die Himmel und die Engel, den Mond und die Sterne und die Mächte, die Erde und das Meer und alles in ihnen. Doch nirgends zählen sie den Sohn und den Hl. Geist unter die geschaffenen Dinge. Die Seraphim aber preisen die Dreieinigkeit, indem sie nicht einmal, nicht zwei- oder vielmal, sondern dreimal ihr „Heilig“ sprechen.</p><p>Ferner diene zu ihrer Widerlegung Petrus, der die Leute um Ananias tadelte mit den Worten: „Ihr habt den Hl. Geist versucht“ und hinzufügt: „Nicht einen Menschen habt ihr belogen, sondern Gott.“ Der Apostel weiß eben, wie wir schon öfter ausführten, daß der Hl. Geist nicht verschieden ist von Gott, indem es ja heißt: „Er durchforscht selbst die Tiefen der Gottheit“. Denn was nicht aus dem Wesen Gottes ist, kann unmöglich die Tiefen der Gottheit durchforschen. Wir wissen also, daß der Vater der Vater, der Sohn der Sohn und der HL Geist der Hl. Geist ist, Dreiheit in Einheit. Denn eins ist des Vaters, des Sohnes und des Hl. Geistes Einheit, eins ist ihr Wesen, eins ihre Herrschaft, eins ihr Wille: eine Kirche, „eine Taufe, ein Glaube“. Deshalb sollen endlich jene aufhören mit ihren Lästerungen gegen Christi heilige Jungfrau und keusche Braut, das ist gegen unsere Mutter, die Kirche; deren Kinder haben von ihren Vätern, das ist von den heiligen Aposteln, den Glauben überkommen, um ihn zu bewahren, zugleich aber auch, um ihn ihren Kindern zu übergeben und zu verkünden. Bemühet euch darum, teuerste Brüder, auch selbst zu den treuen Söhnen der Kirche zu gehören. So bekennet und solches leset aus den heiligen Schriften, um euch und eure Zuhörer im Glauben zu bestärken; so lehret, unterweiset, unterrichtet und höret nicht auf, die ihr gläubig und orthodox seid, diesen heiligen Glauben der katholischen Kirche, wie ihn die heilige und einzige Jungfrau Gottes von den heiligen Aposteln des Herrn überkommen hat, zu bewahren. Und so sollt ihr nicht bloß jeden der Katechumenen, die hinzutreten wollen zum heiligen Taufbad, verkünden lassen den Söhnen im Herrn, sondern ihr sollt sie auch unterweisen, daß sie ausdrücklich mit der einen Mutter von euch und uns allen [die Glaubensformel] sprechen:</p><p>Wir glauben an einen Gott, den allmächtigen Vater, Schöpfer Himmels und der Erde, aller sichtbaren und unsichtbaren Dinge; und an einen Herrn Jesus Christus, den eingeborenen Sohn Gottes, gezeugt aus dem Vater von Ewigkeit her, d. h. aus dem Wesen des Vaters, Licht vom Lichte, wahrer Gott vom wahren Gott, gezeugt und nicht geschaffen, gleicher Wesenheit mit dem Vater, durch welchen alles geworden, was im Himmel und was auf Erden ist; der wegen uns Menschen und wegen unseres Heiles herabkam vom Himmel und Fleisch annahm vom Hl. Geiste aus Maria, der Jungfrau, und Mensch geworden ist. Er ist gekreuzigt worden für uns unter Pontius Pilatus, hat gelitten und ist begraben worden. Er ist auferstanden am dritten Tage nach der Schrift und aufgefahren in den Himmel, er sitzet zur Rechten des Vaters und wird wiederkommen in der Herrlichkeit, zu richten die Lebendigen und die Toten, und seines Reiches wird kein Ende sein. Und an den Hl. Geist, den Herrn und Lebendigmacher, der vom Vater ausgeht, der mit dem Vater und dem Sohne zugleich angebetet und verherrlicht wird, der gesprochen hat durch die Propheten. An die eine, heilige, katholische und apostolische Kirche. Wir bekennen eine Taufe zur Nachlassung der Sünden, wir erwarten eine Auferstehung der Toten und das Leben der zukünftigen Welt. Amen. Jene aber, welche behaupten, es sei eine Zeit gewesen, wo der Sohn nicht war, und bevor er gezeugt worden, sei er nicht gewesen, oder er sei aus dem Nichts geworden oder aus einer anderen Natur oder Wesenheit, und welche sagen, daß der Sohn Gottes wandelbar oder veränderlich sei, diese belegt die katholische und apostolische Kirche mit dem Banne. Dieser Glaube wurde von den heiligen Aposteln überliefert und in der Kirche, als der heiligen Stadt [Gottes], von allen versammelten heiligen Bischöfen, über dreihundertzehn an der Zahl, bestätigt.</p><p>Da jedoch eine Häresie nach der anderen auftaucht in unseren Tagen, d. h. zur Zeit der Kaiser Valentinian und Valens, im zehnten Jahre ihrer Regierung, und wiederum im sechsten Jahre des Gratian, d. h. im neunzigsten Jahre seit dem Tyrannen Diokletian, um dessenwillen, so sagen wir mit euch und mit allen rechtgläubigen Bischöfen, kurz mit der ganzen, heiligen, katholischen Kirche, gegenüber den aufgetauchten Häresien in Übereinstimmung mit der früher angeführten Glaubensformel jener heiligen Väter besonders zu denen, welche dem heiligen Taufbad sich nahen also, daß [auch] sie so verkünden und sagen: Wir glauben an einen Gott, den allmächtigen Vater, den Schöpfer aller unsichtbaren und sichtbaren Dinge, und an einen Herrn Jesus Christus, den Sohn Gottes, gezeugt von Gott dem Vater, den Eingeborenen, d. h. aus dem Wesen des Vaters, Gott von Gott, Licht vom Lichte, wahrer Gott vom wahren Gott, gezeugt und nicht geschaffen, gleichen Wesens mit dem Vater, durch den alles gemacht ist, was im Himmel und auf Erden ist, Sichtbares und Unsichtbares, der wegen uns Menschen und wegen unseres Heiles herabgestiegen ist und Fleisch geworden ist, d. h. vollkommen geboren wurde aus der heiligen, allzeit jungfräulichen Maria durch den Hl. Geist; der Mensch geworden ist, d. h. die vollkommen menschliche Natur angenommen hat, nämlich Seele, Leib und Geist [Nus] und alles, was zum Menschen gehört, die Sünde ausgenommen, und zwar ohne Samen eines Mannes und nicht in einem Menschen gleichsam wohnend, sondern er hat zu sich selbst das Fleisch emporgebildet zu einer heiligen Einheit; nicht in der Weise, wie er die Propheten inspirierte und in ihnen sprach und wirkte, sondern er ist vollkommen Mensch geworden. Denn „das Wort ist Fleisch geworden“, ohne daß es einer Veränderung sich unterzog oder seine Gottheit in die Menschheit verwandelte; in eins hat er vielmehr verbunden seine heilige vollkommene Menschennatur und Gottheit. Denn e i n Herr Jesus Christus ist und. nicht zwei; er ist Gott, er ist Herr, er ist König. Derselbe hat im Fleische gelitten und ist auferstanden und aufgefahren in den Himmel mit seinem Leibe und sitzet in der Herrlichkeit zur Rechten des Vaters und wird kommen mit demselben Leibe in Herrlichkeit, zu richten die Lebendigen und die Toten, und seines Reiches wird kein Ende sein. [Wir glauben] auch an den Hl. Geist, der gesprochen hat im Gesetze und gepredigt hat in den Propheten und herabgestiegen ist in den Jordan, der in den Aposteln sprach und in den Gläubigen wohnet. In dem Sinne glauben wir an ihn, daß er ist der Hl. Geist, der Geist Gottes, der vollkommene Geist, der Tröstergeist, unerschaffen, ausgehend vom Vater und empfangend vom Sohne. Wir glauben auch an eine einige, heilige, katholische und apostolische Kirche und eine Taufe der Buße, an eine Auferstehung der Toten, ein gerechtes Gericht für Seelen und Leiber, ein himmlisches Reich und an ein ewiges Leben. Jene aber, welche behaupten, daß es eine Zeit gegeben habe, wo der Sohn oder der Hl. Geist nicht war, oder daß er aus Nichts geworden sei oder aus einer anderen Natur oder Wesenheit, sowie jene, welche sagen, der Sohn Gottes oder der Hl. Geist seien veränderlich oder wandelbar, diese belegt die katholische und apostolische Kirche, eure und unsere Mutter, mit dem Banne. Ebenso bannen wir jene, welche die Auferstehung der Toten nicht bekennen, sowie alle Häresien, die nicht mit diesem heiligen Glauben übereinstimmen. Da nun ihr, Geliebteste, so glaubet und eure Kinder, und da ihr die aus diesem Grunde folgenden Gebote erfüllen wollt, so hoffen wir, daß ihr für uns betet, damit wir allzeit teilhaben an der Gemeinschaft eben dieses Glaubens auf dem Boden seiner sittlichen Forderungen. Betet für uns, ihr und jeder, der diesen Glauben bekennt und die Gebote des Herrn bewahrt in Christo Jesu, unserem Herrn, durch welchen und mit welchem Ehre sei dem Vater mit dem Hl. Geiste in alle Ewigkeit. Amen.</p><p>Soweit, meine geliebten Brüder, sahen wir uns gezwungen, mit unserem bißchen schwachen Verstand aufzuwarten, da so vortreffliche Leute wie ihr uns aufmunterten, trotz unserer Unzulänglichkeit mit aller Anspannung das Maß unserer Kraft zu überschreiten, so daß uns wohl Hilfe nottat. Aber der treue Gott weiß ja alles. Übrigens sei „Friede jedem, der nach dieser Richtschnur [des wahren und rechten Glaubens] wandelt und mit dem Hause Israel“ Grüßet alle die Heiligen im Herrn; es grüßen euch die Diener des Herrn, besonders ich Anatolius, der ich dieses Buch, welches „der Festgeankerte“ heißt, geschrieben habe, und ich wünsche, daß es euch im Herrn wohlergehe.</p>
