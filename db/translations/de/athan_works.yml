    body: |-
      <p><em>Gegen die Heiden, übersetzt von Anton Stegmann und Hans Mertel (Bibliothek der Kirchenväter, 1. Reihe, Bd. 31, München 1917).</em></p><p>Zur Erkenntnis der (rechten) Gottesverehrung und der Wahrheit überhaupt bedarf es nicht so fast eines Unterrichtes durch die Menschen, als ja vielmehr eine solche unmittelbar sich gewinnen läßt. Fast Tag für Tag erhebt sie in den Werken laut ihre Stimme, und sonnenklar offenbart sie sich in der Lehre Christi. Doch gleichwohl möchtest du von ihr reden hören. Nun gut, du Glücklicher, soweit wir dazu imstande sind, wollen wir über einige wenige Fragen aus dem christlichen Glauben uns auseinandersetzen. Wohl kannst du diesen Glauben auch aus den göttlichen Schriften schöpfen, hörst aber doch recht gern auch andere an. Es genügen ja die heiligen und inspirierten (θεόπνευστοι) Schriften zur Verkündigung der Wahrheit; doch gibt es daneben auch viele Kommentare, die unsere seligen Lehrer dazu verfaßt haben. Wer diese nachsieht, der wird ja wohl die (nötige) Schriftexegese finden und die Erkenntnis, nach der er verlangt, gewinnen können. Da wir aber die Traktate der Lehrer augenblicklich nicht zur Hand haben, so müssen wir das, was wir von jenen gelernt haben, dir mitteilen und schreiben — ich meine nämlich den Glauben an Christus den Erlöser —, damit man nicht die bei uns vorgetragene Lehre geringschätze noch auch den Glauben an Christus für unvernünftig halte, wie etwa die Heiden, die mit verleumderischer Zunge spotten und offen über uns lachen, obschon sie uns immer nur das Kreuz Christi vorzuhalten wissen. Und doch gerade daraufhin möchte man ihren Stumpfsinn am meisten betrauern, weil sie, die Spötter des Kreuzes, nicht sehen, wie seine Kraft die ganze Welt erfüllte, und wie durch das Kreuz die Werke der göttlichen Erkenntnis allen offenbar geworden sind. Denn wenn auch sie Leute wären mit einem geraden Sinn und Blick für seine Gottheit, dann würden sie über etwas so Grandioses nicht spotten. Nein, vielmehr müßten auch sie ihn als Weltheiland anerkennen und einsehen, daß das Kreuz der Kreatur nicht zum Verderben, sondern zum Heile geworden ist. Denn wenn mit dem Eintritt des Kreuzes in die Welt aller Götzendienst ein Ende nahm, wenn alles Gaukelspiel der Dämonen diesem Zeichen weichen muß und nur mehr Christus angebetet und durch ihn der Vater erkannt wird, wenn die Widersacher zuschanden werden, er aber täglich die Herzen derer, die ihm widersprechen, im stillen umstimmt, wie kann man da noch — man darf sie wohl mit Recht so fragen — an ein Menschenwerk denken, anstatt zu bekennen, daß es der Logos Gottes und der Heiland der Welt ist, der das Kreuz bestiegen hat? Mit diesen Leuten scheint es ähnlich zu stehen wie mit einem Menschen, der auf die Sonne schmähte, die hinter den Wolken sich verbirgt, und doch ihr Licht bewunderte, weil er sieht, wie die ganze Schöpfung von ihr beleuchtet wird. Denn wie das Licht schön ist und schöner noch die Sonne als Quelle des Lichtes, so muß auch, da die Erfüllung des ganzen Erdkreises mit der Erkenntnis Gottes eine göttliche Tat ist, der Schöpfer und Lenker eines solchen Wunderwerkes Gott und Gottes Logos sein.</p><p>Wir wollen also (von der Sache) reden, so gut wir es vermögen, und zunächst den Ungläubigen ihre Unwissenheit nachweisen, damit dann auf die Widerlegung ihrer Lügen hin die Wahrheit von selbst leuchte, und auch du, o Mensch, an Zuversicht gewinnst, der Wahrheit geglaubt zu haben und mit der Erkenntnis Christi nicht irre gegangen zu sein. Sodann finde ich es in der Ordnung, mit dir, einem Freund Christi, über Christus zu reden, zumal ich überzeugt bin, daß du seine Erkenntnis und den Glauben an ihn höher als alles wertest.</p><p>Im Anfange gab es keine Bosheit, und sie findet sich ja auch jetzt nicht bei den Heiligen; ja für sie existiert sie überhaupt nicht. Erst später sind die Menschen auf sie verfallen und begannen, sie zu ihrem eigenen Verderben weiterzubilden. So bildeten sie sich denn auch eine Vorstellung von Idolen und dachten sich das Nichtseiende als wirklich.</p><p>Gott, der Schöpfer der Welt und Allbeherrscher, der über jedes Wesen und jede menschliche Vorstellung erhaben ist, hat in seiner Güte und überreichen Liebe durch seinen eigenen Logos, unseren Heiland Jesus Christus, das Menschengeschlecht nach seinem eigenen Bilde erschaffen und den Menschen in seiner Verähnlichung mit sich zum sinnigen und verständigen Betrachter der Dinge bestellt. Er gab ihm auch Begriff und Kenntnis von seiner eigenen Ewigkeit, damit er in demselben Urzustand verharre, nie von seiner Gottesvorstellung abfalle, noch auch vom Umgang mit den Heiligen sich lossage, vielmehr im Besitze der Gnade des Gebers und seiner eigenen Kraft, die vom väterlichen Logos stammt, freudig mit Gott verkehre und ein ungetrübtes und wahrhaft seliges, unsterbliches Leben führe. Denn nichts steht ihm hindernd auf dem Weg zur Erkenntnis des Göttlichen, und so schaut er in seiner eigenen Unversehrtheit (καθαρότης) immerdar das Bild des Vaters, den Logos Gottes, nach dessen Ebenbild er auch geschaffen ist. Ja, er gerät außer sich vor Bewunderung, wenn er dessen Vorsehung im Weltall betrachtet; er erhebt sich über alles Sinnenfällige und jede körperliche Vorstellung und tritt mit der göttlichen, geistigen Welt im Himmel in Verbindung in der Kraft seines Geistes. Wenn nämlich der menschliche Geist nicht mit dem Körperlichen sich abgibt und auch keinerlei Beimischung von der daraus entspringenden Begierlichkeit von außen erhält, vielmehr ungeteilt ist, in erhabener Höhe mit sich selbst beschäftigt, wie er im Anfange gewesen, ja, dann schreitet er über die Sinnenwelt und alles Menschliche hinaus, schwebt in der Höhe, sieht den Logos und schaut in ihm auch den Vater des Logos, voll Entzücken ob seiner Anschauung und in immer neuem Verlangen nach ihm. So hat ja der erste Mensch, der in der Sprache der Hebräer auch Adam genannt ward, nach Angabe der heiligen Schriften zu Anfang in harmloser Freiheit mit Gott geistigen Umgang gepflogen und mit den Heiligen zusammengelebt in der Betrachtung der geistigen Welt, der er an jener Stätte oblag, die auch der heilige Moses bildlich Paradies nannte. In ihrer Reinheit ist aber die Seele dazu fähig, Gott in sich selbst wie in einem Spiegel zu schauen, wie auch der Herr sagt: „Selig, die reinen Herzens sind, sie werden Gott anschauen“.</p><p>So also hat der Schöpfer, wie gesagt, das Menschengeschlecht ausgestattet, und so sollte es nach seinem Willen bleiben. Doch die Menschen schätzten das Bessere gering, waren säumig in dessen Ergreifung und suchten mehr das, was ihnen näher lag. Näher aber lag ihnen der Körper mit seinen Sinnen. So wandten sie ihren Geist vom Geistigen ab und begannen sich selbst zu betrachten. Aber in der Betrachtung ihrer selbst, beschlagnahmt vom Körper und der übrigen Sinnenwelt und hier gleichsam daheim sich wähnend, verfielen sie der Begierde nach sich selbst und zogen das Ihrige der Betrachtung des Göttlichen vor. Indem sie aber darin verweilten und von dem, was näher lag, nicht lassen wollten, gaben sie ihre von allerlei Begierden verwirrte und verunreinigte Seele den körperlichen Lüsten gefangen; schließlich vergaßen sie der ihnen ursprünglich von Gott verliehenen Kraft. Man kann das schon beim ersten erschaffenen Menschen bewahrheitet sehen - laut dem, was die heiligen Schriften von ihm erzählen. Auch er blieb, solange er seinen Geist auf Gott und dessen Betrachtung richtete, abgewandt von der Betrachtung seines Körpers. Als er aber auf Anraten der Schlange seine Gedanken von Gott ablenkte und sich zu betrachten anfing, da verfielen sie alsbald auch der sinnlichen Lust, erkannten, daß sie nackt waren, und schämten sich nach erwachter Erkenntnis. Sie erkannten aber ihre Nacktheit nicht so fast im Mangel an Kleidung, sondern weil sie der Betrachtung des Göttlichen verlustig gegangen waren und ihre Gedanken auf das Gegenteilige gerichtet hatten. Denn abgefallen von der Betrachtung des Einen und Wahren, nämlich Gottes, und von der Liebe zu ihm, ergaben sie sich jetzt den verschiedenen Begierden des Leibes und seinen Trieben. Und, wie es zu geschehen pflegt, von der gelegentlichen und vielfachen Befriedigung der Lust kam es bei ihnen auch zur entsprechenden Gewohnheit, so daß sie gar in Furcht lebten, ihnen entsagen zu müssen. So kam denn auch feige Angst und Furcht, Vergnügungssucht und vergängliches Trachten in die Seele. Denn weil sie sich von den Lüsten nicht trennen will, fürchtet sie den Tod und die Trennung vom Leibe. Weil sie aber für ihre Begehrlichkeit wieder nicht das Entsprechende fand, so lernte sie morden und Unrecht tun. Wie sie aber hierbei zu Werke geht, darf wohl nach Kräften gezeigt werden.</p><p>Nachdem die Seele von der Betrachtung des Geistigen abgekommen war und die einzelnen Kräfte des Körpers mißbraucht, an der Betrachtung des Leibes sich ergötzt und in der Lust ein Gut für sich gefunden hatte, mißbrauchte sie in ihrem Wahne das Wort ‘Gut’ und glaubte, die Lust sei das wahre Gut selbst, — ähnlich einem geistig Verrückten, der ein Schwert verlangte wider die, die ihm begegnen, und dabei meinte, weise zu handeln. Die Lust aber einmal liebgewonnen, begann die Seele, sie auf mannigfache Weise zu erregen. Denn von Natur sehr beweglich, treibt sie nach ihrer Abkehr vom Guten immer weiter. Sie bewegt sich nun zwar nicht mehr in der Richtung der Tugend und so, daß sie Gott schaute, sondern sie hängt am Nichtseienden, gibt ihrer Fähigkeit eine andere Richtung und mißbraucht sie zu Lüsten, die sie ersonnen, da sie ja freigeboren ist. Sie kann wie dem Guten zustimmen, so auch vom Guten sich abkehren. Wendet sie sich aber vom Guten ab, dann denkt sie notwendig an seine Kehrseite. Denn sie kann nicht zu absoluter Ruhe kommen, weil sie, wie vorhin bemerkt, von Natur sehr beweglich ist. Und im Bewußtsein ihrer Freiheit erkennt sie, daß sie die Glieder des Leibes in zweifacher Richtung gebrauchen kann, für das Seiende sowohl wie für das Nichtseiende. Das Seiende ist aber das Gute, das Nichtseiende das Böse. Wesenhaft aber nenne ich das Gute, sofern es sein(e) Urbild(er) im wahrhaft seienden Gott findet. Nichtseiend aber nenne ich das Böse, weil es, ohne wirklich zu sein, nur menschlichem Sinnen entsprungen ist. Denn obschon der Körper Augen hat, um die Schöpfung zu sehen, aus ihrer vollen Harmonie den Schöpfer zu erkennen, obschon er auch ein Gehör hat, um die göttlichen Offenbarungen und die Gebote Gottes zu vernehmen, obschon er auch Hände hat, um die notwendige Arbeit zu leisten und beim Gebet sie zu Gott zu erheben, so kehrte sich die Seele doch ab von der Betrachtung des Guten und dem Leben in ihm und treibt jetzt in ihrem Wahne in entgegengesetzter Richtung. Denn als sie ihrer Fähigkeit, wie schon gesagt, inne wurde und sie dann auch mißbrauchte, kam sie darauf, daß sie die Glieder des Leibes auch in entgegengesetzter Richtung bewegen könnte. Und deshalb wendet sie das Auge, anstatt auf die Schöpfung zu schauen, auf Begierden und zeigt so, daß sie auch hierzu imstande ist, wobei sie glaubt, ihre Würde zu bewahren, wenn sie nur einmal tätig sei, und nicht zu sündigen, wenn sie tue, was sie könne. Und sie begreift nicht, daß sie nicht zur Bewegung überhaupt, sondern zu zweckmäßigem Leben erschaffen ist. Deshalb mahnt ja auch die Stimme des Apostels: „Alles ist erlaubt, aber nicht alles nützt“.</p><p>Allein die Verwegenheit der Menschen sah es nicht auf das Nützliche und Geziemende ab, sondern zielte nach dem Möglichen und begann, in entgegengesetzter Richtung tätig zu sein. So führte sie die Hand zu widernatürlichem Tun und ließ sie morden, verführte das Ohr zum Überhören und die anderen Glieder zum Ehebruch anstatt zu rechtmäßiger Kindererzeugung, die Zunge statt zur Segnung zu Lästerung, Schmähung und Meineid, die Hand wieder zu Diebstahl und Mißhandlung der Nebenmenschen, den Geruchsinn zur Aufnahme mannigfacher erotischer Gerüche, die Füße zu raschem Blutvergießen, den Bauch zu Trunkenheit und unersättlicher Schlemmerei, was lauter Missetaten und Sünden der Seele sind. Die Schuld daran liegt aber nirgends anderswo als in der Abkehr vom Besseren. Denn wie ein Wagenlenker, der auf der Rennbahn das Gespann besteigt, aber auf das Ziel nicht achtet, dem er zufahren soll, von diesem vielmehr ablenkt und das Roß überhaupt nur leitet, wie er es gerade kann — er kann es aber leiten, wie er will —, oft auf die ihm Begegnenden stößt, oft auch über Abhänge stürzt und da anlangt, wohin ihn die Hitze der Rosse führt, und dabei noch meint, bei solchem Laufe das Ziel nicht verfehlt zu haben — er sieht ja nur auf den Lauf, ohne darauf zu achten, ob er vom Ziel abgekommen ist —, so kommt auch die Seele zum Falle, die vom Wege zu Gott sich abkehrt und die Glieder des Leibes zu Ordnungswidrigem veranlaßt oder gar auch selbst mit ihnen sich instinktiv leiten läßt; und sie gestaltet sich selbst das Böse, ohne wahrzunehmen. daß sie vom Wege abgeirrt ist und fern vom Ziel der Wahrheit steht, das der Christusträger, der selige Paulus, im Auge hatte, wenn er sagte: „Ich verfolge das Ziel, den Siegespreis der himmlischen Berufung in Christus Jesus“. So auf das Gute achtend, tat der Heilige nie das Böse.</p><p>Einige Heiden, die vom Wege abirrten und Christum nicht kannten, haben sich zwar dahin ausgesprochen, daß das Böse als Substanz und an und für sich existiere. Damit irrten sie im einen wie im anderen Falle: sei es, daß sie den Schöpfer nicht als den Urheber des Seienden gelten lassen — denn er wäre nicht Herr des Seienden, wenn ja, wie sie meinen, das Böse an sich Existenz und Wesenheit hätte —, oder daß sie andernfalls, wenn sie ihn Schöpfer aller Dinge sein lassen, ihn notwendig auch als Urheber des Bösen erklären, — denn zum Seienden gehörte nach ihnen auch das Böse. Dies ist aber doch wohl offenbar ungereimt und unmöglich. Denn das Böse kommt nicht vom Guten, ist nicht in ihm, noch durch dasselbe. Das Gute könnte doch nicht mehr gut sein, wenn es eine Mischnatur wäre oder Quelle von Bösem. Die Häretiker freilich, die von der kirchlichen Lehre abgefallen sind und im Glauben Schiffbruch gelitten haben, sie faseln ja auch von einer Substanz des Bösen und stellen sich außer dem wahren Vater Christi einen zweiten Gott vor, und zwar als ungewordenen Schöpfer des Bösen und Urheber der Bosheit wie als Gründer der Schöpfung. Doch diese sind leicht zu widerlegen sowohl aus den göttlichen Schriften wie auch aus der menschlichen Vernunft selbst, laut der sie auch mit diesen Vorstellungen zu den Wahnwitzigen gehören. So sagt zur Bekräftigung der Worte Mosis unser Herr und Heiland Jesus Christus in seinen Evangelien: „Gott der Herr ist <strong>einer</strong>“, und: „Ich preise Dich, Vater, Herr Himmels und der Erde“. Wenn aber Gott <strong>einer</strong> ist, und dieser der Herr Himmels und der Erde, wie kann es neben diesem einen zweiten Gott geben? Und wo wird auch dieser ihr Gott sein, wenn der Eine und Wahre im Umkreis des Himmels und der Erde alles erfüllt? Wie könnte auch ein anderer der Schöpfer dessen sein, worüber nach dem Worte des Heilandes Gott selbst und der Vater Christi der Herr ist? Sie müßten denn im Sinne einer Gleichsetzung sagen, der Herr des guten Gottes könne auch der böse Herr sein. Aber wenn sie das behaupten, dann sieh, in welche Gottlosigkeit sie fallen! Bei gleich Mächtigen kann man doch keinen Vorrang oder Vorzug entdecken. Wenn nämlich das eine gegen den Willen des anderen ist, so liegt bei beiden die gleiche Macht und Ohnmacht: gleiche Macht, weil sie mit ihrer (bloßen) Existenz den beiderseitigen Willen überwinden, gleiche Ohnmacht, weil die Dinge auch ohne und gegen ihren Willen ihren Lauf nehmen. Denn es existiert der Gute wider den Beschluß des Bösen, und es besteht der Böse gegen den Willen des Guten.</p><p>Übrigens kann man ihnen auch noch folgendes vorhalten: Wenn das Sinnenfällige ein Werk des Bösen ist, wo ist dann das Werk des Guten? Denn in die Erscheinung tritt einzig und allein nur die Schöpfung des Baumeisters. Wo ist dann noch ein Wahrzeichen für die Existenz des Guten, wenn keine Werke von ihm da sind, aus denen man ihn erkennen könnte? Aus den Werken erkennt man doch den Meister. Doch wie könnte es überhaupt auch zwei einander entgegengesetzte Existenzen geben, bzw. worin liegt das sie scheidende Moment, so daß sie gesondert voneinander existieren können? Gleichzeitig können sie ja nicht existieren, weil sie sich gegenseitig aufheben. Auch kann keine in der anderen sein wegen der Unvereinbarkeit und Ungleichheit ihrer Natur. So wird das trennende Moment von einem Dritten herkommen, und das wäre auch Gott. Doch welche Natur wird dies Dritte haben, die des Guten oder die des Bösen? Das wird dunkel bleiben. Unmöglich kann es die Natur beider haben. Da so nun diese ihre Anschauung sich als töricht herausstellt, so muß die Wahrheit, wie sie in der kirchlichen Lehre liegt, Licht bringen. Danach kommt das Böse nicht von Gott, noch ist es in Gott, noch ist es von Anfang dagewesen, noch ist es irgendeine Substanz, vielmehr begannen die Menschen in Ermangelung der Vorstellung vom Guten sich auszudenken und einzubilden, was nicht ist und ihnen beliebt. Denn wie einer, der bei Sonnenschein und bei Beleuchtung der ganzen Erde durch das Sonnenlicht die Augen schlösse und sich eine Finsternis vorstellte, obschon eine solche nicht bestünde, und dann gleichsam im Dunkel irrend herumginge, oft hinfiele und in Abgründe stürzte, im Wahne, es wäre nicht Licht, sondern Finsternis — er meint ja zu sehen und sieht doch absolut nicht —, so hat auch die menschliche Seele ihr Auge geschlossen, mit dem es Gott schauen kann, und sich das Böse vorgestellt, in dem sie sich herumtreibt, und weiß nicht, daß sie nur etwas zu tun wähnt, (in Wahrheit) aber nichts leistet; denn sie bildet sich das Nichtseiende ein. Sie blieb auch nicht so, wie sie gewesen ist, sondern zeigt sich jetzt in der Befleckung, die sie selbst verschuldet hat. Denn sie ist erschaffen worden, um Gott zu schauen und von ihm erleuchtet zu werden. Doch sie hat nicht Gott, sondern das Vergängliche und die Finsternis gesucht, wie irgendwo auch der Geist Gottes urkundlich sagt: „Gott hat den Menschen recht erschaffen; sie aber strebten nach einer Allerweltweisheit“. Das war also der Ursprung und die Entwicklungsgeschichte des Bösen bei den Menschen. Wie sie dann auch in den wahnwitzigen Götzendienst herabgesunken sind, davon muß nunmehr die Rede sein, damit du erkennest, daß die Erfindung der Götzen durchaus nicht vom Guten, sondern vom Bösen ausgegangen ist. Was aber im Prinzip schlecht ist, kann wohl nie irgendwie für gut befunden werden, da es absolut schlecht ist.</p><p>Nicht genug daran, die Bosheit ersonnen zu haben, begann die menschliche Seele, nach und nach in noch Schlechterem sich auszuwirken. Sie lernte verschiedene Arten von Lüsten kennen, zog über sich her den Schleier der Vergessenheit für das Göttliche, ergötzte sich an den fleischlichen Regungen, sah nur mehr auf das Augenblickliche und dessen Reize und verfiel so auf den Wahn, es gebe außer dem Sichtbaren nichts weiteres mehr, vielmehr sei das Zeitliche und Leibliche das Gute. Aber abgekehrt und verlustig gegangen des Bewußtseins, ein Ebenbild des guten Gottes zu sein, sieht sie jetzt nicht mehr mit der ihr eigenen Kraft Gott den Logos, nach dem sie erschaffen ist; vielmehr macht sie, außer sich gekommen, sich Gedanken über das Nicht-seiende und stellt es sich vor. Denn mit dem Wust der sinnlichen Begierden hat sie gleichsam den Spiegel in sich verdeckt, in dem allein sie das Bild des Vaters schauen konnte, und sieht jetzt nicht mehr, woran die Seele zu denken hat; vielmehr treibt sie sich überall herum und sieht nur, was in die Sinne fällt. Deshalb stellt sie sich, trunken vor lauter fleischlicher Begier und betäubt von ihren Vorspiegelungen, nunmehr den Gott, den sie im Herzen vergessen hatte, in körperlichen und sinnlichen Dingen vor, indem sie den Namen Gott auf die sichtbaren Dinge überträgt und nur das preist, was ihr beliebt und was sie willkommen findet. Voraus geht also dem Götzendienst als dessen Quelle die Bosheit: Erst verstunden es die Menschen, sich die nichtseiende Bosheit auszudenken, dann schufen sie sich auch die nichtseienden Götter. Wie einer, der in die Tiefe stürzte und bei seiner Blickrichtung nach unten und kraft des ihm nachstürzenden Wogenschwalles das Licht nicht mehr sähe noch das im Lichte Sichtbare, und jetzt, wo er nur das in der Tiefe Liegende wahrnimmt, wähnte, es gebe außer dem nichts weiteres, sondern eben dem ihm Sichtbaren komme die Herrschaft über das Seiende zu, so haben auch vor Zeiten die törichten Menschen, versunken in die fleischlichen Begierden und Vorstellungen und verlustig gegangen ihres Gottesbegriffes und Gottesglaubens, ihrer verfinsterten Vernunft oder vielmehr Unvernunft folgend, die sichtbaren Dinge als Götter sich gedacht, erhoben so die Kreatur über den Schöpfer und erwiesen lieber den Werken göttliche Verehrung als ihrem Urheber und Schöpfer, Gott dem Herrn. Wie aber nach dem vorhin angeführten Gleichnis die in die Tiefe Sinkenden, je weiter sie abwärts gleiten, in um so dunklere und tiefere Stellen geraten, so ist es auch dem Menschengeschlechte ergangen. Denn sie hielten nicht an einem Götzendienst fest, blieben nicht bei dem stehen, womit sie begonnen, sondern solange sie noch bei den ersten Verirrungen verweilten, gingen sie schon auch auf neuen Teufelsspuk aus. Und weil sie an den ersten nicht satt wurden, füllten sie sich mit neuem Bösen an, kamen so in den schändlichsten Dingen immer weiter und erschlossen ihrer Gottlosigkeit immer weiteres Gebiet. Dafür zeugt auch die göttliche Schrift, wenn sie sagt: „Wenn der Gottlose in den Abgrund der Bösen gerät, dann achtet er es nicht“.</p><p>Kaum war nämlich der menschliche Geist von Gott abgekommen, da sanken die Menschen in ihrer Einsicht und in ihrem Urteil und übertrugen die Gott schuldige Ehre zuerst auf den Himmel, die Sonne, den Mond und die Sterne, und sie hielten diese Gestirne nicht nur für Götter, sondern auch für die Begründer der übrigen, zeitlich späteren Dinge. Dann sanken sie in ihrem verfinsterten Urteil noch tiefer und nannten den Äther, die Luft und die Erscheinungen in der Luft Götter. Noch weiter gingen sie im Bösen und priesen schon auch die Elemente und Urstoffe der Körperbildung, die Wärme, die Kälte, die Trockenheit und Feuchtigkeit als Götter. Wie aber die, die ganz hinfallen, nach Art der Erdschnecken auf der Erde kriechen, so haben die Gottlosesten unter den Menschen, nachdem sie gefallen und von der Vorstellung (des wahren) Gottes abgekommen waren, nunmehr Menschen und Gestalten von Menschen, sei es noch während ihres Lebens, sei es nach ihrem Tode unter die Götter versetzt. Ja, als ihr Sinnen und Trachten noch verkommener wurde, übertrugen sie gar auf Steine und Holzstücke, auf Kriechtiere im Wasser und auf dem Land und auf unvernünftige wilde Tiere den göttlichen und überirdischen Namen Gottes, erwiesen ihnen alle göttliche Ehre und kehrten sich ab vom wahren und wahrhaft seienden Gott, dem Vater Christi. Aber wäre doch wenigstens die Verwegenheit der Toren hierbei stehen geblieben, und hätten sie sich doch nicht noch mehr erniedrigt und mit Gottlosigkeit befleckt! Einige sanken ja geistig gar so tief, und ihr Verstand wurde so sehr verfinstert, daß sie sogar Dinge, die überhaupt nie und nirgends existieren und in der Welt vorkommen, gleichwohl sich einbildeten und zu Göttern erhoben. Sie vermischten vernünftige Wesen mit unvernünftigen, kombinierten naturverschiedene Dinge und verehren sie als Götter. Dahin gehören bei den Ägyptern die Götter mit Hunds-, Schlangen- und Eselsköpfen, bei den Libyern Ammon mit dem Widderkopf. Wieder andere nahmen die Körperteile: Haupt, Schulter, Hand und Fuß für sich gesondert, versetzten einen jeden unter die Götter und verehrten ihn göttlich, wie wenn sie nicht genug hätten an ihrem Kult für den ganzen, ungeteilten Körper. Andere treiben die Gottlosigkeit noch weiter: sie vergöttern und verehren den Lockruf zur Erfindung dieser Götter und zu ihrer eigenen Bosheit, die Lust und die Begierde. So liegt es bei ihrem Eros und der Aphrodite in Paphos. Andere bei ihnen erkühnten sich, als wollten sie sich in der Schlechtigkeit überbieten, ihre Regenten oder deren Kinder unter die Götter zu versetzen, bald aus Verehrung gegen die Herrscher, bald aus Furcht vor deren Tyrannei: Dahin zählen ihr hochberühmter Zeus auf Kreta, und der arkadische Hermes, bei den Indern Dionysos, bei den Ägyptern Isis, Osiris und Oros und jetzt Antinous, der Liebling des römischen Kaisers Hadrian, den sie wohl als einen Menschen kennen, und dazu als einen Menschen, der statt ehrwürdig zu sein voll Geilheit war, den sie aber doch verehren aus Furcht vor dem, der es gebot. Als nämlich Hadrian in Ägypten weilte, befahl er die Verehrung des verstorbenen Antinous, des Werkzeuges seiner Lust, weil er den Knaben auch nach dem Tode noch liebte — übrigens zugleich ein konkreter Beweis und das Zeugnis dafür, daß eben alle Idololatrie bei den Menschen nicht anderswie aufkam als auf dem Wege der Begierlichkeit auf seiten derer, die sie gestalteten, wie auch schon die Weisheit Gottes bezeugt: „Der Anfang der Unzucht ist die Erfindung der Götzen“. Doch wundere dich nicht und halte das Gesagte nicht für so unglaublich, wo doch noch unlängst oder vielleicht bis in die Gegenwart herein der römische Senat die Regenten, die je einmal seit Anfang über die Römer geherrscht haben, alle oder in beliebiger Auswahl unter die Götter dekretiert und ihre göttliche Verehrung vorschreibt. Denen sie nämlich nicht gewogen sind, die geben sie als von Natur feindlich aus und nennen sie Menschen; die sie aber sympathisch finden, diese sollen wegen ihrer Tugend verehrt werden, als stünde es in ihrer Macht, Götter zu schaffen, sie, die doch selbst Menschen sind und ihre Sterblichkeit nicht leugnen können. Sie müßten aber, wenn sie Götter schaffen wollen, zuerst selbst Götter sein. Denn das erschaffende Prinzip muß höher stehen als das Ding, das gemacht werden soll: der Richter muß über dem stehen, den er richtet, und der Geber gibt jedenfalls nur, was er hat, wie gewiß auch jeder König nur verleiht, was er hat, und mächtiger und größer ist als der Empfänger. Wenn sie aber die als Götter kanonisieren, die sie haben wollen, so müßten sie erst selbst Götter sein. Doch das Auffallende daran ist, daß sie als Menschen selbst auch sterben und damit ihren Beschluß über die von ihnen Vergötterten als trügerisch verwerfen.</p><p>Übrigens ist dieses Verfahren nicht neu und kam auch nicht erst im römischen Senat auf, sondern war längst vorher bekannt und wurde üblich, um zu Idolen zu kommen. So wurden die bei den Griechen von jeher gefeierten Götter Zeus, Poseidon, Apollo, Hephäst, Hermes, und unter den weiblichen Hera, Demeter, Athene und Artemis auf Anordnung des bei den Griechen hochberühmten Theseus des Gottesnamens gewürdigt. Diejenigen, die solche Anordnungen trafen, werden nachher als sterbliche Menschen beweint, die sie aber als Götter installierten, werden als Götter angebetet. O des großen Widerspruches und Wahnsinnes! Sie kennen den, der den Kult gebot, und ehren doch mehr die, die er zum Kult erhob. Und hätte doch ihr Götzenwahn beim männlichen Geschlechte haltgemacht und nicht auch noch auf das weibliche den Gottesnamen übertragen! Ja, sogar Frauen, die man nicht einmal zu einer gemeinsamen Beratung von öffentlichen Fragen mit ruhigem Gewissen zulassen kann, erwiesen sie die Gott schuldige Ehre und Ehrfurcht, wie denen, die, wie gesagt, von Theseus eingesetzt wurden: bei den Ägyptern der Isis, Kore, Neotera, und bei anderen Aphrodite. Die Namen der übrigen kann man nach meinem Urteil nicht einmal mit Anstand nennen; so ganz und gar lächerlich sind sie. Es sind nämlich viele, nicht nur in den alten Zeiten, sondern auch in unseren, die nach dem Verlust ihres Teuersten, von Brüdern, Verwandten, Frauen und Männern, die alle von der Natur als sterbliche Menschen erwiesen wurden, eben diese in ihrer großen Trauer um sie abbilden ließen, Weihegaben (für sie) ersannen und aufstellten; diesen erwiesen dann die Nachkommen wegen des Bildes und des künstlerischen Wertes göttliche Verehrung — ein ganz unnatürliches Vorgehen. Denn die die Eltern als Nichtgötter beweinten — hätten sie sie nämlich als Götter gewußt, so würden sie ja sie nicht als tot betrauert haben; deshalb also, weil sie nicht nur nicht an ihre Göttlichkeit glaubten, sondern nicht einmal an ihre Existenz, ließen sie diese im Bilde darstellen, um über ihr Nichtmehrsein durch den Anblick ihres bildlichen Abrisses sich zu trösten —, eben diesen huldigen als Göttern gleichwohl die Toren und erweisen ihnen die dem wahren Gott schuldige Ehre. Wenigstens in Ägypten wird heutzutage noch die Trauer über den Tod des Osiris, Oros und Typhon und der anderen gefeiert. Und die Erze in Dodona und die Korybanten auf Kreta bezeugen heute noch, daß Zeus nicht Gott, sondern ein Mensch ist, und daß er von einem Vater gezeugt ist, der rohes Fleisch aß. Das Auffallendste aber ist, daß sogar Plato, der hochberühmte Weise der Griechen, der sich auf seine Spekulation über Gott viel zugute tat, mit Sokrates in den Piräus hinabgeht zur Anbetung der Artemis, die Menschenkunst gebildet hatte.</p><p>Auf diese und derlei Geburten des Götzenwahnes hat ehedem und schon lange vorher die Schrift aufmerksam gemacht mit den Worten: „Der Anfang der Unzucht ist das Ersinnen von Götzen; ihre Erfindung aber ist die Entartung des Lebens. Denn sie waren nicht von Anbeginn, noch werden sie ewig bleiben. Durch die Hoffart der Menschen kamen sie in die Welt, und deshalb ward ihnen ein schnelles Ende zugedacht. Denn von maßlosem Schmerz ergriffen, ließ ein Vater ein Bild von einem schnell hinweggerafften Kinde entwerfen, ehrte den schon Toten, als wäre er noch am Leben und empfahl seinen Untergebenen Mysterien und Zeremonien. Mit der Zeit befestigte sich diese gottlose Sitte und gewann kanonische Geltung. Auf das Gebot von Gewalthabern hin wurden Schnitzwerke verehrt. Und weil die Menschen die, die fernab wohnten, nicht persönlich verehren konnten, stellten sie sich die entfernte Gestalt im Bilde dar und schufen ein sichtbares Bild des verehrten Herrschers, um dann im Wetteifer dem Abwesenden zu schmeicheln, als wäre er persönlich da. Zu erhöhter Verehrung reizte die Unwissenden auch der Ehrgeiz des Künstlers. Denn wohl um dem Herrscher zu gefallen, bot dieser alle Kunst auf, die bestmögliche Ähnlichkeit zu erreichen. Der große Haufe aber ließ sich durch die Schönheit des Bildes bestechen, den vor kurzem noch als Menschen Geehrten als Gegenstand göttlicher Verehrung zu betrachten. Und das war geschehen zur Täuschung des Lebens, daß die Menschen entweder unter dem Druck der Verhältnisse oder der Gewalt den unmitteilbaren Namen Steinen und Holzstücken beilegten“. — So also nahm nach dem Zeugnis der Schrift die Götzenfabrikation bei den Menschen ihren Anfang. Jetzt gilt es, dir auch ihre (innere) Nichtigkeit aufzudecken, indem wir unsere Beweise nicht so fast von außen, als vielmehr aus den Vorstellungen der Menschen über die Götzen schöpfen.</p><p>Wenn man bei ihren sogenannten Göttern, um zunächst mit diesen niedrigen Dingen zu beginnen, auf die Handlungen sieht, so wird man finden, daß sie nicht nur keine Götter, sondern die schändlichsten Menschen waren. Was, ja was muß man doch bei den Dichtern an Liebschaften und Ausschweifungen des Zeus mitansehen! Was muß man mitanhören von seinem Raub des Ganymedes, von seinen geheimen Ehebrüchen, von seiner Furcht und Angst, es möchten wider seinen Ratschluß Trojas Mauern fallen. Wie muß man mitansehen, daß er über den Tod seines Sohnes Sarpedon trauert, wie er ihm helfen möchte und doch nicht kann, daß er von anderen sogenannten Göttern bedroht wird, nämlich von Hera, Athene, Poseidon, aber von Thetis, einem Weibe, und dem hundertäugigen Agäon Hilfe bekommt, wie er ein Opfer der Wollust wird, ein Knecht der Weiber, und ihnen zulieb in der Gestalt von unvernünftigen, vierfüßigen und geflügelten Tieren sein Leben riskiert, wie er bald wieder vor den Nachstellungen seines Vaters sich verbirgt, bald den Kronos in Fesseln schlägt und jener wieder seinen Vater entmannt. Ist es nun recht, den für einen Gott zu halten, der solche Dinge verbrochen hat und sich vorwerfen lassen mußte, die das gemeine römische Recht nicht einmal den einfachen Sterblichen zu tun freistellt?</p><p>Um von den vielen und allzu vielen Geschichten nur wenige anzuführen: Wenn man mitansieht, wie er an Semele, Leda, Alkmene, Artemis, Leto, Maia, Europe, Danae und Antiope sich Sünde und Schändung erlaubte, oder wie er gar an seiner eigenen Schwester sich frevlerisch verging und sie zur Schwester und Gattin hatte, muß man da nicht seiner spotten und ihn zum Tod verdammen? Ja, er beging nicht nur Ehebruch, sondern nahm gar die im Ehebruch erzeugten Kinder unter die Götter auf, um mit dem Schleier solcher Vergöttlichung seinen Frevel zu verhüllen: dahin zählen Dionysos, Herakles, die Dioskuren, Hermes, Perseus und Soteira. Wenn man der sogenannten Götter unversöhnlichen, gegenseitigen Zank vor Ilium wegen der Griechen und Trojaner sieht, muß man da nicht ihre Schwäche verurteilen, wenn sie wegen ihres Haders untereinander auch noch die Menschen aufreizten? Wenn man sieht, wie Ares und Aphrodite von Diomedes, Hera und Ädoneus, der sogenannte Gott der Unterwelt, von Herakles, Dionys von Perseus, und Athene von Arkas verwundet werden, und Hephäst aus dem Himmel geworfen wird und hinkt, muß man da nicht ihre Natur verachten und endlich aufhören, sie Götter zu nennen? Hört man noch, daß sie sterblich sind und leidensfähig, muß man sie dann nicht schlechterdings nur als Menschen beurteilen, und zwar als schwache Menschen, und sollte man nicht eher die Verwundenden als die Verwundeten bewundern? Oder wenn man den Ehebruch des Ares mit der Aphrodite sieht und auf die List des Hephäst gegen beide und auf die anderen sogenannten Götter, die auf die Einladung des Hephäst zum Anblick des Ehebruches auch herbeikommen und ihre Unzucht mitansehen, muß man da nicht spotten und ihre Verkommenheit verdammen? Oder muß man nicht spotten, wenn man die von der Berauschung kommende Besinnungslosigkeit und Liederlichkeit des Herakles an der Omphale sich austoben sieht? — Ihr lüsternes Verhalten, ihre wahnsinnigen Buhlereien und die Götterfabrikation in Gold und Silber, Erz und Eisen, in Stein und Holz braucht man nicht ausdrücklich bloßzustellen, da diese Dinge an sich schon Abscheu erregen und an sich selbst das Merkmal der Verirrung tragen. Daher müßte man am meisten die bedauern, die sich hierin täuschen lassen. Sie hassen den Ehebrecher, der zu ihrer Gattin geht, schämen sich aber nicht, die Lehrer des Ehebruches zu vergöttern. Sie kennen keinen fleischlichen Verkehr mit ihren Schwestern, und doch beten sie die an, die solches tun. Sie geben zu, daß Knabenschändung eine Missetat ist, und verehren doch die, die solcher Vorwurf trifft. Und was die Gesetze nicht einmal den Menschen erlauben, das hängen sie, ohne zu erröten, ihren sogenannten Göttern an.</p><p>Wenn sie dann Steine und Holzstücke anbeten, so übersehen sie, daß sie die gleichen Dinge mit Füßen treten und verbrennen, Teile davon aber Götter nennen. Und was ihnen eben noch Gebrauchsgegenstand war, das schnitzen und verehren sie in ihrem Unverstand, ohne zu sehen noch überhaupt zu bedenken, daß sie nicht Götter, sondern die Kunst des Bildhauers anbeten. Denn solange der Stein unbehauen, das Holz unbearbeitet ist, ebensolange treten sie mit Füßen darauf und benützen diese Dinge zu ihren Bedürfnissen, oft auch zu weniger ehrenvollen. Sobald aber der Künstler dank seiner Fertigkeit diesen Stoffen Ebenmaß gibt und aus dem Stoff die Figur eines Mannes oder einer Frau gestaltet, ja, dann wissen sie zuerst dem Künstler Dank und hernach beten sie die Figuren als Götter an, die sie um Geldeslohn vom Bildhauer erstanden haben. Vielfach betet auch der Bildhauer selbst, als hätte er vergessen, was er selbst geschaffen, zu seinen Werken, und was er eben noch gemeißelt und behauen hat, das nennt er nach der künstlerischen Verarbeitung Gott. Man hätte aber, wenn diese Dinge wirklich Bewunderung verdienten, die Kunst des Meisters anerkennen und nicht die Werke über ihren Schöpfer stellen sollen. Denn nicht hat der Stoff die Kunst, sondern die Kunst den Stoff verschönert und vergöttlicht. So sollten sie weit eher den Künstler anbeten als seine Werke, zumal er auch vor den kunstgeborenen Göttern existierte, und diese so geworden sind, wie ihm beliebte. Nun aber verstoßen sie sich gegen das Normale, setzen Wissenschaft und Kunst hintan, verehren aber die Schöpfungen von Wissenschaft und Kunst, und während der Mensch, der sie erschaffen, stirbt, beten sie seine Werke an als unsterblich, die doch bei ihrer Natur jedenfalls mit der Zeit untergehen, wenn nicht tagtägliche Fürsorge sie erhält. Sind sodann die Menschen nicht auch deshalb zu bedauern, weil sie, obschon selber sehend, die anbeten, die nicht sehen, obschon selber hörend, zu denen beten, die nicht hören, weil sie, obschon selbst beseelt und vernünftig von Natur, die als Götter anreden, die sich überhaupt nicht bewegen, sondern leblos sind? Und vollends auffallend, daß sie denen wie Herren dienen, die sie selbst bewachen und in Gewalt haben. Glaube ja nicht, daß ich etwa das einfach nur sage oder sie verleumde; man kann sich ja hiervon auch durch den Augenschein überzeugen, und wem es darum zu tun ist, der kann derlei Dinge selbst beobachten.</p><p>Noch stärkere Bezeugung hierfür findet sich in der göttlichen Schrift, die schon längst zuvor den Aufschluß gab mit den Worten: „Die Götzen der Heiden sind Silber und Gold, Werke von Menschenhänden. Augen haben sie und sehen nicht, einen Mund und reden nicht; Ohren haben sie und hören nicht, eine Nase und riechen nicht. Hände haben sie und fühlen nicht, Füße haben sie und gehen nicht; nicht rufen sie mit ihrer Kehle. Ähnlich mögen ihnen werden, die sie machen“. Auch fehlt es hier nicht am Tadel der Propheten, vielmehr liest man auch bei ihnen eine Anklage wider sie, wenn der Geist sagt: „Es sollen zuschanden werden, die einen Gott gestalten, und alle, die eitle Schnitzwerke schaffen! Alle sind verdorrt in dem, woraus sie gemacht worden. Alle sollen stumm von den Menschen sich absondern und stillstehen zugleich; sie sollen in sich gehen und sich schämen allzumal. Denn ein Zimmermann schärfte ein Eisen, bearbeitete das Schnitzwerk mit einem Beile, fügte es mit dem Bohrer zusammen und stellte es auf mit der Kraft seines Armes. Und er wird hungern und kraftlos werden und gar kein Wasser trinken. Denn der Zimmermann wählte das Holz aus, maß es ab, leimte es zusammen, machte es einer Menschengestalt und menschlichen Schönheit gleich; er stellte im Hause auf, was er als Holz im Eichenwald gefällt, was der Herr gepflanzt und der Regen groß gemacht hatte, auf daß es den Menschen nütze zum Verbrennen, damit er davon nähme und sich erwärme. Sie verbrannten es, buken Brot darauf; aus dem Rest fertigten sie aber Götter und beteten sie an, nachdem sie die Hälfte davon im Feuer verbrannt hatten. Mit der einen Hälfte also machten sie Feuer zum Braten des Fleisches, aßen und sättigten sich; und erwärmt sprach er: ‘Wohl ist mir, daß ich mich erwärmt und Feuer gesehen habe.’ Den Rest aber betete er an: ‘Rette mich; denn mein Gott bist du.’ Sie konnten nicht weise sein, da sie verblendet waren, so daß ihre Augen nicht sahen und ihr Herz es nicht begriff. Nicht erwog er in seinem Herzen noch in seinem Geiste, noch erkannte er mit seiner Vernunft, daß er die Hälfte davon im Feuer verbrannt und auf dessen Kohlen Brot gebacken, daß er Fleisch gebraten und gegessen und den Rest zu einem Scheusal gebildet hatte, das sie anbeten. Wisset, daß ihr Herz Asche ist, daß sie im Irrtum sind, und niemand ihre Seele retten kann. Schauet hin, und ihr werdet nicht sagen, daß Lüge sei in meiner Rechten“. Wie sollten da nicht allgemein die für gottlos gelten, die auch von der göttlichen Schrift der Gottlosigkeit beschuldigt werden? Oder sollten die nicht Bösewichte sein, die so offen erwiesen die leblosen Dinge verehren anstatt der Wahrheit? Wo gäbe es da eine Hoffnung für diese oder wo eine Verzeihung für die, die doch auf unvernünftige, leblose Dinge bauen, die sie an Stelle des wahren Gottes anbeten!</p><p>Wenn, ja wenn doch der Künstler ihnen die Götter nur gestaltlos gebildet hätte, damit sie ihren Stumpfsinn nicht so offen erwiesen sehen müßten! Dann hätten sie ja die Einfältigen betören können, als hätten die Götzen Empfindung, wenn nämlich nicht die Sinnesorgane wie Augen, Nase, Ohren, Hände und Mund regungslos blieben, wenn es gilt, den Sinn zu gebrauchen und das Sinnliche aufzunehmen. Nun aber haben sie und haben nicht, stehen sie und stehen nicht, sitzen und sitzen nicht. Sie haben die jeweilige Energie nicht, sondern in der Lage, in der der Bildner sie haben wollte, verbleiben sie auch, und sie tragen kein Merkmal der Gottheit an sich, sondern sie zeigen sich absolut leblos und nur als eine Arbeit menschlicher Kunst. Und hätten doch auch die Herolde und Propheten solch falscher Götter, ich meine die Dichter und Schriftsteller, sie einfach nur als Götter vermerkt! Doch nein, sie haben auch ihre Handlungen zum Erweis ihrer Ungöttlichkeit und ihres schändlichen Treibens beschrieben. Sie hätten ja mit der bloßen Nennung der Gottheit die Wahrheit verschleiern oder vielmehr dem großen Haufen die Wahrheit vorenthalten können. Nun aber zählen sie die Buhlereien und Ausschweifungen des Zeus auf, die Knabenschändungen der anderen, die Eifersüchteleien wegen ihrer Begierde nach dem weiblichen Geschlecht, Beweise von Furcht und Feigheit und die übrigen Gebrechen, und so klagen sie nur sich selber an, daß sie nicht einmal von ehrenwerten Menschen, geschweige denn von Göttern reden, vielmehr von schändlichen und dem Guten fernabstehenden Wesen fabeln.</p><p>Doch vielleicht reden sich daraufhin die Gottlosen hinaus mit der Eigenart der Dichter und sagen, es sei eine Eigenheit der Dichter, den Hörern zu gefallen, das, was nicht ist, zu schaffen und Mythen auszuspinnen, denen zulieb sie also nach ihnen auch die Dichtungen über die Götter geschaffen hätten. Daß aber diese ihre Ausrede haltloser ist als alle, läßt sich ihnen aus ihrer eigenen Meinung und ihrem Urteil hierüber erweisen. Ist nämlich das, was bei den Dichtern steht, Einbildung und Lüge, dann ist wohl auch die Namengebung für Zeus, Kronos, Hera, Ares und die übrigen Trug. Ja, es sind vielleicht auch die Namen fingiert, wie sie selbst sagen, und es gibt überhaupt keinen Zeus, Kronos, Ares; vielmehr schaffen sie die Dichter zur Täuschung der Zuhörer. Schaffen aber die Dichter das Nichtseiende, warum beten sie dann die Gebilde an, als existierten sie? Oder werden sie wohl sagen, daß sie die Namen nicht schaffen, nur die Handlungen ihnen andichten? Doch auch dann bleibt ihre Verteidigung gleich haltlos. Haben sie nämlich die Handlungen erlogen, dann jedenfalls auch die Namen derer, von denen sie die Handlungen erzählten. Wenn sie aber bezüglich der Namen bei der Wahrheit bleiben, dann notwendig auch in bezug auf die Handlungen. Übrigens, die diese als Götter fingiert haben, wissen wahrhaftig, was Göttern ansteht zu tun, und sie hätten nur die Einfälle von Menschen Göttern zugeschrieben, wie auch niemand die Wirkung des Feuers dem Wasser beilegen wird; denn das erstere brennt, letzteres aber hat eine kalte Natur. Sind aber die Werke der Götter würdig, dann mögen deren Vollbringer wirklich Götter sein. Sind aber Ehebruch und die bereits erwähnten Werke Handlungen von Menschen, und zwar von schlechten, so sollen die, die solche vollbringen, auch Menschen sein und nicht Götter. Denn die Handlungen müssen dem Wesen entsprechen, damit auch aus dem Handeln der Handelnde bezeugt und aus dem Wesen die Handlung erkannt werde. Wie man bei einer Erörterung über Wasser und Feuer und bei einer Besprechung ihrer Wirkungsweisen nicht sagte, daß das Wasser brenne, das Feuer kühle, noch bei der Rede von Himmel und Erde behauptete, die Erde leuchte, die Sonne aber bringe Pflanzen und Früchte hervor, im Gegenteile mit solchen Aufstellungen alle Verrücktheit überböte, so hätten auch die heidnischen Schriftsteller und vorab der alle überragende Dichter Zeus und den anderen Göttern, wenn sie dieselben als Götter gewußt hätten, nicht solche Handlungen beigelegt, die den gegenteiligen Beweis erbringen, daß sie nicht Götter, sondern Menschen sind, und zwar keine vernünftigen. Oder wenn die Dichter gelogen haben und du ihnen das nachsagst, warum haben sie dann nicht auch bei der Tapferkeit der Heroen es mit Lügen versucht und die Tapferkeit zur Schwäche und die Schwäche zur Tapferkeit umgedichtet? So hätten sie ja, wie bei Zeus und Hera, auch dem Achilles Unmännlichkeit andichten, an Thersites aber Kraft bewundern, dem Odysseus Mangel an Einsicht nachsagen, dem Nestor Unverstand zusinnen, dem Diomedes und Hektor weibische Taten und der Hekabe männliche Art andichten müssen. Die Dichter hätten ja, wie sie selbst behaupten, durchweg erdichten und lügen müssen. Nun aber hielten sie sich bei den Menschen an die Wahrheit, bei den sogenannten Göttern aber operierten sie ungescheut mit Lügen. Es könnte ja einer aus ihnen auch folgendes vorbringen: Im Berichte über ihre schamlosen Handlungen lügen sie, aber in ihren Lobeserhebungen, wo sie Zeus Vater der Götter, Höchsten, Olympier und Herrscher im Himmel nennen, erdichten sie nicht, sondern reden die Wahrheit. Daß aber diese Ausrede gegen sie spricht, könnte nicht bloß ich, sondern jeder andere nachweisen. Denn wieder wird mit den obigen Beweisen die Wahrheit gegen sie auftreten. Ihre Handlungen verraten sie als Menschen, die Lobsprüche aber übersteigen die menschliche Natur. Aber hier wie dort der Widerspruch in sich selbst: Es ist den Himmlischen nicht eigen, desgleichen zu tun, noch kann man anderseits die für Götter halten, die derlei Dinge treiben.</p><p>Was anders läßt sich schließlich noch denken, als daß die Lobeshymnen unwahr und bloße Schmeicheleien sind, die Handlungen aber ein wahres Zeugnis über sie bleiben? Daß diese Annahme der Wahrheit entspricht, läßt sich schon aus dem allgemeinen Verfahren erschließen: Niemand klagt über den Wandel dessen, den er loben will; vielmehr erhebt man die, deren Handlungen schändlich sind, um dem verdienten Vorwurf zu begegnen, mit Lobsprüchen, um durch ein Übermaß hierin die Hörer zu täuschen und die Verkommenheit jener zu verbergen. Wie wenn man im Bestreben, einen zu loben, ohne in dessen Wandel und Herzensverfassung einen Anhalt zu Lobpreisungen zu finden, weil daselbst nur Schande, gleichwohl solche Kreaturen auf andere Weise verherrlichte und ihnen unverdiente Prädikate zubilligte, so haben auch ihre gepriesenen Dichter aus Abscheu vor den schändlichen Handlungen ihrer sogenannten Götter eben diesen einen übermenschlichen Namen beigelegt, ohne sich zu sagen, daß sie mit ihrem Ersinnen von übermenschlichen Prädikaten das Menschliche an ihnen nicht verdecken werden, im Gegenteil eher den Beweis erbringen, daß mit den menschlichen Gemeinheiten der Götter die Vorstellungen von Gott nicht zusammengehen. Und ich wenigstens glaube, daß sie wider ihren Willen von den Leidenschaften und Handlungen der Götter gesprochen haben. Denn da sie, wie die Schrift sagt, den unmitteilbaren Namen Gottes und seine Ehre auf die zu übertragen suchten, die nicht Götter, sondern sterbliche Menschen waren, und damit eine große und gottlose Frechheit sich leisteten, deshalb wurden sie sogar wider ihren Willen von der Wahrheit genötigt, deren Leidenschaften zu schildern, damit im Interesse der nachkommenden Generationen eben dieser Götter Leidenschaften zur Widerlegung ihrer Gottheit in den Schriften über sie eingetragen und allen offenbar würden.</p><p>Wo fände sich da noch eine Verteidigung, wo noch ein Beweis für die Gottheit solcher Figuren auf seiten derer, die in diesem Götzenwahn befangen sind? Denn aus dem eben erst Gesagten schloß die Vernunft, daß sie Menschen sind, und zwar keine ehrenwerten. Doch vielleicht wollen sie sich jetzt darauf hinausreden und stark pochen auf die von ihnen gemachten praktischen Erfindungen und behaupten, sie würden deshalb auch für Götter gehalten, weil sie den Menschen nützlich geworden sind. Zeus soll ja die Plastik, Poseidon die Kunst des Steuermannes, Hephäst das Schmiedehandwerk, Athene die Webekunst, Apollo die Musik, Artemis die Jagd, Hera die Bekleidungskunst, Demeter den Ackerbau und andere wieder andere Künste erfunden haben, wie die Schriftsteller von ihnen berichtet haben. Doch diese und derlei Künste hätten die Menschen nicht ihnen allein gutschreiben sollen, sondern der allgemeinen Menschennatur, dank deren Beobachtungsgabe die Menschen die Künste erfinden; denn die Kunst, heißt es allgemein, ist Nachahmung der Natur. Wenn sie also in den Künsten, mit denen sie sich abgaben, bewandert geworden sind, so braucht man sie deshalb auch nicht für Götter zu halten, sondern viel eher für Menschen. Denn nicht von ihnen sind die Künste ausgegangen, vielmehr haben die Menschen dabei die Natur nachgeahmt. Denn da die Menschen laut Definition von Natur für die Wissenschaft empfänglich sind, so ist es kein Wunder, wenn sie selbst mit ihrem menschlichen Verstand auf ihre eigene Natur sahen und auf einfache Beobachtung hin die Künste erfanden. Oder wenn sie es billig finden, jene dank der Erfindung der Künste als Götter anzusprechen, so muß man auch die Erfinder der übrigen Künste Götter nennen, und zwar mit demselben Recht, mit dem auch jene dieses Namens gewürdigt wurden. Denn das Alphabet erfanden die Phönizier, das Heldenepos Homer, die Dialektik der Eleate Zeno, die Rhetorik Korax von Syrakus, die Bienenzucht Aristäus, die Aussaat des Weizens Triptolemos, die Gesetze Lykurg von Sparta und Solon von Athen; die Verbindung der Buchstaben und die Zahlen, Maße und Gewichte erfand Palamedes. Wieder andere brachten andere und verschiedenartige für das menschliche Leben nützliche Entdeckungen, wie die Geschichtschreiber uns bezeugen. Wenn also die Künste zu Göttern erheben, und dank ihnen es geschnitzte Götter gibt, so müssen auch die späteren Erfinder von Künsten wie jene Götter sein. Oder aber sie würdigen diese nicht göttlicher Ehre, sondern betrachten sie als Menschen, dann folgt, daß man auch Zeus, Hera und die anderen nicht Götter zu nennen, sondern zu glauben hat, daß auch sie Menschen gewesen, und dies um so mehr, da sie nicht einmal ehrwürdig waren, wie sie auch schon durch die Anfertigung von Bildwerken beweisen, daß sie nichts weiter als Menschen gewesen sind.</p><p>Was für eine andere Gestalt geben ihnen denn die Bildhauer, als die von Männern und Frauen und von noch tiefer stehenden, von Natur vernunftlosen Wesen, von allerlei Vögeln, zahmen und wilden Vierfüßlern und Kriechtieren, so viele Erde und Meer und jede Art von Gewässer hervorbringt? Denn einmal versunken in die Torheiten der Leidenschaften und Lüste und nur mehr bedacht auf Sinnenlust und Fleischesgier, gleichsam in dieser vernunftlosen Triebrichtung lebend, stellten sich die Menschen auch das Göttliche in unvernünftigen Wesen dar — entsprechend ihren mannigfachen Leidenschaften, und ließen sich ebensoviele Götter schnitzen. Bilder von Vierfüßlern, Kriechtieren und Vögeln finden sich bei ihnen, wie auch der Dolmetscher der göttlichen und wahren Gottesfurcht sagt: „Sie wurden eitel in ihren Gedanken, und ihr unverständiges Herz wurde verfinstert. Während sie sich für Weise ausgaben, sind sie Toren geworden. Und sie vertauschten die Herrlichkeit des unvergänglichen Gottes mit dem Gleichnis und Bilde des vergänglichen Menschen, auch der Vögel, Vierfüßler und Kriechtiere. Deshalb überantwortete sie Gott auch schmählichen Leidenschaften“. Erst zogen sie, wie vorhin gesagt, mit den Torheiten ihrer Lüste ihre Seele in Mitleidenschaft, dann verfielen sie auf solche Abgötterei. Und einmal gefallen, sind sie nunmehr, wie ihrer Gottverlassenheit überantwortet, so in ihren Lüsten gefangen, und stellen Gott, den Vater der Vernunft, in vernunftlosen Wesen dar. Nach solcher Entgegnung bestreiten die heidnischen Philosophen und Gelehrten zwar nicht, daß ihre sichtbaren Götter Gestalten und Typen von Menschen und unvernünftigen Wesen sind, sagen aber zu ihrer Verteidigung, daß sie solche hätten, damit durch diese die Gottheit ihnen Antwort gebe und in die Erscheinung trete; denn sie könnten ihn, den Unsichtbaren, auf keinem anderen Wege erkennen als durch derartige Bilder und solchen Kult. Wieder andere, die noch philosophischer sein und tiefer gehen wollen, behaupten, die Bilder seien eben zum Zweck der Anrufung und Offenbarung göttlicher Boten und Kräfte gefertigt und gestaltet worden, damit diese auf diesem Wege in die Erscheinung träten und ihnen von der Erkenntnis Gottes Offenbarung gäben. Diese wären gleichsam Schriftzüge für die Menschen, in denen sie Aufschluß finden könnten über die Erkenntnis Gottes, insofern die Offenbarung der göttlichen Boten in ihnen vor sich geht. So also fabeln jene; sie reden nicht wie Theologen — weit entfernt! Prüft man sorgfältig ihre Begründung, dann wird man finden, daß ihre Ansicht nicht minder falsch ist wie die vorhin widerlegten.</p><p>Man könnte sie vor dem Richterstuhl der Wahrheit fragen: Wie antwortet oder gibt sich Gott durch diese zu erkennen? Durch den Stoff, aus dem sie bestehen, oder durch die Form, die sie haben? Wenn nun durch den Stoff, wozu bedarf es der Form, und warum offenbarte sich Gott nicht in jedem beliebigen Stoff, ehe diese Dinge gebildet waren? Sinnlos dann auch, Tempel mit Mauern zu bauen und darin einen einzelnen Stein oder ein Holzstück oder einen Goldklumpen einzuschließen, wo doch die ganze Erde mit solchen Stoffen erfüllt ist. Wenn aber die spätere Form Ursache für die göttliche Offenbarung wird, wozu bedarf es dann der Materie von Gold und der übrigen Stoffe, und warum offenbart sich Gott nicht vielmehr in der lebendigen Natur, von der die Götzenbilder ihre Form haben? Denn wenn man einmal eben bei dieser Begründung bleibt, so wäre es wohl noch besser von Gott gedacht, wenn man ihn in beseelten vernünftigen und vernunftlosen Wesen erwartete, als in unbeseelten und regungslosen; freilich leisten sie sich damit gerade im Widerspruch mit sich selbst eine Gottlosigkeit. Während sie nämlich die natürlichen Lebewesen, Vierfüßler, Vögel, Kriechtiere wegen ihrer Wildheit oder Häßlichkeit verabscheuen und fliehen, bearbeiten sie gleichwohl deren Gestalten in Stein, Holz und Gold und machen sie zu Göttern. Sie hätten doch eher die lebendigen Wesen selbst verehren, als deren Gestalten in diesen Stoffen anbeten sollen. Oder aber ist vielleicht keines von beiden, weder Form noch Stoff, Ursache für die Ankunft Gottes, vielmehr nur die Kunst in Verbindung mit der Wissenschaft macht das Göttliche gegenwärtig, da sie ja eine Nachahmung der Natur ist. Wenn aber wegen der Wissenschaft das Göttliche in den Kunstwerken gegenwärtig wird, wozu bedarf es dann wieder des Stoffes, da doch die Wissenschaft in den Menschen ist? Wenn aber Gott überhaupt nur dank der Kunst offenbar in die Erscheinung tritt und deshalb auch die Bildwerke als Götter verehrt werden, so hätte man die Menschen als die Urheber der Kunst anbeten und verehren sollen, weil sie vernunftbegabt sind und die Wissenschaft in sich selber tragen.</p><p>Auf ihre zweite und sicher tiefergehende Rechtfertigung ließe sich wohl füglich auch folgendes sagen: Wenn ihr Heiden diese (Bildwerke) gefertigt habt, nicht damit Gott selbst darin sich offenbare, sondern seine Boten darin gegenwärtig werden, warum erhebt ihr dann die Götzenbilder, durch die ihr die Mächte anruft weit über die angerufenen Mächte selbst? Um der Erkenntnis Gottes willen schnitzt ihr ja nach eurer Angabe die Formen, gebt aber doch den Bildwerken selbst die Ehre und den Namen Gottes und macht euch damit einer fluchwürdigen Handlung schuldig. Ihr gebt wohl zu, daß die Macht Gottes die Unansehnlichkeit der Götzenbilder überragt und getraut euch deshalb nicht, durch sie Gott anzurufen, sondern nur die untergeordneten Mächte; aber doch habt ihr über sie hinweg den Namen desjenigen, vor dessen Gegenwart ihr euch fürchtet, Steinen und Holzstücken beigelegt, nennt sie Götter anstatt Steine und Kunstwerke von Menschenhand und betet sie an. Denn wenn sie euch auch gleichwie Schriftzüge, wie ihr weismachen wollt, zur Betrachtung Gottes führen, so geht es doch nicht an, die Zeichen über das Bezeichnete zu stellen. Es könnte ja einer, der den Namen des Königs niederschriebe, den Namenszug auch nicht ungestraft höher werten als den König; vielmehr wird ein solcher mit dem Tod bestraft. Und doch ist der Namenszug durch die Technik des Schreibers entstanden. So hättet auch ihr bei einem gesunden Urteil das so erhabene Kennzeichen nicht auf den Stoff übertragen; nein, ihr hättet das Bildwerk nicht höher gewertet als den menschlichen Bildner. Denn sollten sie überhaupt nur wie Schriftzüge die Erscheinung Gottes anzeigen und eben als solche der Vergötterung würdig sein, so hätte jedenfalls der, der sie geschnitzt oder gemeißelt hat, nämlich wieder der Künstler, weit eher vergöttert werden sollen, da er doch mächtiger und göttlicher ist als jene — um so mehr, als letztere ganz nach seinem Belieben geschnitzt und gebildet wurden. Wenn also das Alphabeth Bewunderung verdient, dann weit mehr noch der, der es schreibt, — wegen seiner Kunst und geistigen Bildung. Darf man sie also auch aus diesem Grund nicht für Götter halten, so möchte man sie abermals ob ihres Götzenwahnes zur Rede stellen und sie mit Recht über die Veranlassung einer solchen Götzengestalt verhören.</p><p>Ist das Göttliche, weil anthropomorph, eben dementsprechend so abgebildet worden, warum fassen sie es dann auch in Typen von vernunftlosen Wesen? Wenn es aber die Gestalt unvernünftiger Triebwesen hat, warum geben sie ihm dann auch Formen von vernünftigen Wesen? Ist das eine wie das andere der Fall, und denken sie sich Gott aus beiderlei zusammengesetzt, so daß er die Gestalten von unvernünftigen und vernünftigen Wesen hat, warum trennen sie, was verbunden ist, und sondern die Gestalten von Tier und Mensch voneinander, anstatt ihn überall aus beiden darzustellen, wie man solchen Gebilden in Mythen begegnet, einer Scylla, Charybdis, dem Hippocentaur und bei den Ägyptern dem hundsköpfigen Anubis? Denn man hätte sie entweder nur so — mit ihrer Doppelnatur — darstellen oder, wenn sie eine Gestalt haben, nicht auch eine zweite ihnen andichten sollen. Haben sie sodann männliche Gestalt, warum geben sie ihnen auch weibliche Formen? Haben sie aber weibliche Gestalt, warum dichten sie ihnen männliche Formen an? Haben sie jedoch beider Gestalt, so hätte man sie nicht trennen, sondern beide verbinden sollen, so daß sie analog den Hermaphroditen geworden wären. So verriete ihr Götzenwahn nicht nur Gottlosigkeit und Schmach, sondern reizte die Augenzeugen auch zum Gelächter. Und überhaupt, wenn sie sich das Göttliche körperlich denken, und es dementsprechend mit einem Bauch, mit Händen und Füßen, und weiter mit Nacken und Brust und auch den menschlichen Zeugungsgliedern sich vorstellen und einbilden, so sieh doch, in welch ungeheure Gottlosigkeit und Gottvergessenheit ihr Geist versunken ist, daß sie derlei Vorstellungen vom Göttlichen haben. Demzufolge muß es ja auch den anderen menschlichen Zuständlichkeiten unterworfen sein, so daß es zerschnitten, geteilt und wieder ganz vernichtet werden kann. Doch diese und derlei Zuständlichkeiten sind nicht Gott eigen, wohl aber den irdischen Körpern. Gott ist unkörperlich und unvergänglich und unsterblich und hat überhaupt kein Bedürfnis. Diese Gestalten aber sind vergängliche Körperfiguren und bedürfen, wie bereits gesagt, des Dienstes der Menschen. Wir sind ja oft Zeugen davon, daß sie, veraltet, der Renovierung bedürfen, und daß die, welche Zeit oder Regen oder irgendein Geschöpf auf Erden verunstaltet hat, restauriert werden. Deshalb kann man sie der Torheit zeihen, weil sie die Götter nennen, deren Schöpfer sie selber sind, und weil sie von denen das Heil erflehen, die sie doch selbst mit ihrer Kunst sorgsam instand halten müssen, damit sie nicht vor ihnen zugrunde gehen, weil sie von diesen die Befriedigung ihrer Bedürfnisse erwarten, die doch, wie sie selbst wohl wissen, ihrer Sorgfalt bedürfen, und weil sie sich nicht scheuen, diejenigen als Herrn Himmels und der Erde anzusprechen, die sie in kleine Kapellen einschließen.</p><p>Doch nicht bloß hieraus kann man ihre Gottlosigkeit erkennen, sondern auch daraus, daß ihre Auffassung von ihren Götzen selbst widersprechend lautet. Sind diese nämlich wirkliche Götter, wie sie behaupten und philosophieren, an welche von ihnen soll man sich anschließen, und welche aus ihnen soll man für mächtiger halten, um entweder mit Vertrauen den wahren Gott anzubeten oder, wie sie sagen, um an ihnen das Göttliche unfehlbar zu erkennen? Denn es sind nicht die gleichen, die man allerwärts Götter heißt, sondern so viele Völker es gibt, fast eben so viele Götter werden auch erdichtet. Ja, manchmal sind auch ein und dasselbe Land und eine und dieselbe Stadt nicht eins miteinander in der abergläubischen Verehrung der Götter. So kennen die Phönizier die Götter nicht, die bei den Ägyptern verehrt werden, und die Ägypter beten nicht die gleichen Götzen an wie die Phönizier. Die Skythen wollen nichts wissen von den Göttern der Perser, noch die Perser von den Göttern der Syrer. Auch verwerfen die Pelasger die thrakischen Götter, und die Thrakier kennen die thebaischen nicht. Uneins im Götzendienst sind die Inder und Araber, die Araber und Äthiopier, und auch die Äthiopier unter sich selbst. Ebensowenig verehren die Syrer die Götzen der Cilizier; der Volksstamm der Kappadozier nennt wieder andere Gottheiten als diese; die Bitynier ersannen sich wieder andere und wieder andere die Armenier. Doch wozu der langen Aufzählung? Festlandsbewohner beten andere Götter an als die Inselbewohner, und die Inselbewohner verehren andere als die Bewohner des Festlandes. Ja, überhaupt jede Stadt und jedes Dorf gibt den eigenen Göttern den Vorzug, da es die der Nachbarn nicht kennt, und halten nur diese für Götter. Von den Mißgeburten der Ägypter braucht man nicht einmal zu reden, da sie allen in die Augen fallen. Haben doch dort die Städte entgegengesetzte und sich widerstreitende Kulte, und gehen doch die Nachbarn immer darauf aus, jeweils einen anderen Gegenstand zu verehren als der Anwohner. So wird von den einen das Krokodil als Gott angebetet; bei den Nachbarn gilt es als Scheusal. Bei den einen wird der Löwe göttlich verehrt; die Nachbarn verehren ihn nicht nur nicht, sondern töten ihn, wenn sie ihn finden, als ein wildes Tier. Auch der Fisch, bei den einen vergöttert, wird an einem anderen Orte als Speise gefangen. Daher sind bei ihnen zu Hause Kriege, Unruhen, aller Anlaß zu Mordtaten und alle Lust zu Ausschweifungen. Und besonders auffallend ist, daß, wie die Geschichtschreiber erzählen, die Pelasger von den Ägyptern die Namen der Götter vernahmen und doch die ägyptischen Götter nicht kennen, sondern andere als diese verehren. Und überhaupt ist der Glaube und die Verehrung aller im Götzenwahn befangener Völker verschieden; ja man trifft nicht bei denselben das gleiche. Das geschieht ihnen recht. Denn da sie von der Erkenntnis des einen Gottes abfielen, so verfielen sie auf viele und verschiedene Dinge; und weil sie sich vom wahrhaftigen Logos des Vaters, dem Weltheiland Christus, abkehrten, so trieben sich ihre Gedanken natürlich bei vielem herum. Wie die, die von der Sonne sich abkehren und an finsteren Orten weilen, auf vielen unwegsamen Pfaden herumirren, die Anwesenden nicht sehen, die Abwesenden aber als anwesend sich einbilden und sehend doch nicht sehen, genau so lassen auch die, welche von Gott sich abgewandt haben und deren Seele verfinstert ist, ihren Geist umhertreiben und stellen sich Dinge vor, die nicht existieren, wie Trunkene und Blinde.</p><p>Diese Tatsache ist aber ein nicht unwesentlicher Beweis für einen wirklichen Atheismus derselben. Denn wenn es verschiedene und viele Götter in Stadt und Land gibt, und der eine den Gott des anderen aufhebt, so werden alle von allen verworfen. Die vermeintlichen Götter der einen werden Opfer und Spenden für die sogenannten Götter der anderen; und umgekehrt sind die Opfergaben der anderen die Götter der ersteren. Die Ägypter verehren das Rind und (speziell) den Apis, einen Stier, andere opfern ihn dem Zeus. Wohl opfern sie nicht gerade die, die sie (zur Anbetung) exponiert haben; aber, wenn sie ihresgleichen opfern, tun sie doch augenscheinlich dasselbe. Die Libyer haben einen Widder, den sogenannten Ammon, zum Gott, und dieser wird von anderen mit Vorliebe zum Opfer gebracht. Die Inder verehren den Dionys, der ihnen symbolische Bezeichnung für Wein ist, den andere anderen Göttern spenden. Wieder andere verehren besonders Flüsse und Quellen, und ganz besonders die Ägypter das Wasser und nennen sie Götter. Gleichwohl waschen andere und selbst die diesem Götzendienst ergebenen Ägypter fremden und eigenen Schmutz mit Wasser ab und schütten den Rest ungeniert aus. Ja, fast die ganze Götterschaft der Ägypter gibt für die Götter der anderen die Opfergabe ab, so daß sie eben jenen zum Gespötte sind, weil sie nicht Götter göttlich verehren, sondern Dinge, die bei anderen und gar bei ihnen selbst als Sühn- und Schlachtopfer dienen.</p><p>Ja, einige haben sich in der Gottlosigkeit und Torheit so weit treiben lassen, daß sie ihren Pseudogöttern sogar Menschen, von denen diese doch Typen und Form haben, schlachten und zum Opfer bringen. Und die Unseligen sehen nicht, daß die Schlachtopfer die Urbilder der von ihnen ersonnenen und angebeteten Götter sind. Sie opfern ja fast Gleiches dem Gleichen oder vielmehr das Bessere dem Minderwertigen: sie opfern beseelte Wesen den unbeseelten, vernünftige den bewegungslosen. So opfern die sogenannten taurischen Skythen ihrer sogenannten Jungfrau die Schiffbrüchigen und alle Griechen, deren sie habhaft werden können, womit sie bis zum Übermaß ihren Frevelsinn gegen die gleichgearteten Menschen bekunden und so deutlich die Roheit ihrer Götter verraten. Denn sie schlachten ja ihrerseits die, welche die Vorsehung aus den Gefahren des Meeres errettet hat, und treten so fast gegen die Vorsehung auf, weil sie deren gnädige Fügung mit ihrer tierwilden Seele vereiteln. Dem Ares zu Ehren teilen wieder andere nach siegreicher Heimkehr aus dem Krieg die erbeuteten Gefangenen, soweit es reicht, in Abteilungen zu hundert ab, nehmen je einen heraus und schlachten so viele, als sie Hunderte abzählten. Doch nicht bloß die Skythen verüben bei ihrer angeborenen barbarischen Wildheit solche Greueltaten; vielmehr ist dieses Verfahren für die Verruchtheit der Götzen und Dämonen charakteristisch. So brachten auch die Ägypter vor Zeiten der Hera solche Schlachtopfer dar; und die Phönizier und Kreter versuchten den Kronos mit ihren Kindesopfern gnädig zu stimmen. Die alten Römer verehrten den sogenannten latiarischen Zeus mit Menschenopfern. Ob auf die eine oder andere Art, es verunreinigten einfach alle, und alle wurden verunreinigt: Verunreinigt wurden sie, indem sie Mordtaten verübten; sie verunreinigten aber ihre Tempel mit dem Rauch solcher Opfer. Das gab den Menschen Anlaß zu einer Unzahl von Missetaten. Denn da sie sahen, daß ihre Dämonen sich daran ergötzten, so machten sie es alsbald ihren Dämonen in diesen Verfehlungen nach und hielten die Nachahmung des vermeintlich Besseren für ein besonderes Verdienst. Daher erniedrigten sich die Menschen zu Menschen- und Kindermorden und zu allen möglichen Ausschweifungen. So ist denn auch fast jede Stadt aller Unzucht voll, weil ihre Sitten nach denen ihrer Götter sich richteten; und unter den Götzendienern ist keiner recht, der bei ihnen nicht das Zeugnis der Unzucht hat.</p><p>So gaben sich einst in den Götzentempeln Phöniziens Frauen preis und opferten den dortigen Göttern den ersten Verdienst von ihrer Prostitution, im Wahne befangen, mit ihrer Unzucht ihre Göttin zu versöhnen und sie damit zum Wohlwollen zu bestimmen. Anderseits verleugnen Männer ihre Natur, wollen nicht mehr männlichen Geschlechts sein und geben sich die weibliche Natur, im Glauben, damit der Mutter ihrer sogenannten Götter einen besonders erwünschten und ehrenden Dienst zu erweisen. Alle aber leben zusammen mit den Lasterhaftesten und wetteifern miteinander in der Schlechtigkeit. So hat ja auch der heilige Diener Christi Paulus gesagt: „Denn ihre Weiber vertauschten den natürlichen Gebrauch in den widernatürlichen. Ebenso gingen auch die Männer vom natürlichen Umgange mit dem Weibe ab und entbrannten in gegenseitiger Lust, indem Männer mit Männern Schändliches trieben“. Damit aber, daß sie dies und Ähnliches verüben, gestehen und beweisen sie, daß auch ihre sogenannten Götter ein ähnliches Leben geführt haben. Von Zeus haben sie die Knabenschändung und den Ehebruch, von Aphrodite die Unzucht, von Rhea die Schwelgerei, von Ares die Mordtaten und von anderen andere solche Dinge gelernt, welche die Gesetze ahnden und jeder vernünftige Mensch verabscheut. Geht es da noch an, die für Götter zu halten, die solche Dinge verbrechen, und muß man nicht vielmehr sie wegen ihres ausschweifenden Wandels für sinnloser halten als die vernunftlosen Geschöpfe? Geht es an, deren Verehrer für Menschen zu halten, und muß man nicht eher sie bemitleiden, da sie unvernünftiger sind als die vernunftlosen Wesen und gottloser als die Geschöpfe ohne Seele? Denn wenn sie an das vernünftige Prinzip ihrer Seele gedacht hätten, so wären sie nicht total kopfüber auf solche Dinge verfallen und hätten nicht den wahren Gott, den Vater Christi, verkannt.</p><p>Doch vielleicht werden die, welche sich über diese Leute emporschwingen und einen offenen Blick für die Schöpfung haben, errötend ob der Enthüllungen solcher Greuel auch ihrerseits zugeben, daß diese von allen wohl eingesehen und widerlegt werden können. Dafür werden sie aber jene ihre Ansicht für gesichert und unwiderleglich ausgeben, wonach der Welt und ihrem Treiben Verehrung gebührt. Sie werden sich damit rühmen, daß sie nicht einfach Steine und Holzstücke und Gestalten von Menschen und vernunftlosen Vögeln, Kriechtieren und Vierfüßlern, sondern Sonne, Mond und die ganze himmlische Welt verehren und anbeten, und anderseits wieder die Erde und alles, was feucht heißt. Sie werden sagen, niemand könne beweisen, daß diese nicht von Natur Götter seien, da ja allgemein bekannt, daß sie weder unbeseelt noch unvernünftig sind, sondern gar die menschliche Natur überragen, da sie im Himmel, jene aber auf Erden ihren Wohnsitz haben. Billig darum, auch hier nachzusehen und nachzuprüfen. Denn jedenfalls wird auch hierin die Vernunft mit sicherem Beweis gegen sie entscheiden.</p><p>Ehe wir nachsehen und den Beweisgang antreten, mag laut genug die Schöpfung selbst wider sie gleichsam ihre Stimme erheben und zeigen, daß ihr Schöpfer und Baumeister Gott ist, ihr und des Weltalls Regent, der Vater unseres Herrn Jesu Christi, er, von dem die Scheinweisen sich abkehren, dafür die durch ihn entstandene Schöpfung anbeten und vergöttern, während doch gerade auch sie den anbetet und bekennt, den jene um ihretwillen leugnen. (Denn so können die Menschen, welche die Teile der Schöpfung anstaunen und sie für Götter halten, treffend durch das gegenseitige Bedürfnis der Teile beschämt werden.) Sie bekennt auch und bekundet den Vater des Logos als ihren Herrn und Schöpfer durch den ihr strikte anbefohlenen Gehorsam gegen ihn, wie es auch im göttlichen Gesetze heißt: „Die Himmel rühmen die Herrlichkeit Gottes, und seiner Hände Werk verkündet das Firmament“. — Der Glaube hieran bleibt aber nicht dunkel, sondern ist ganz lichtvoll für die, deren geistiges Auge nicht gänzlich geblendet ist. Wenn man nämlich die einzelnen Teile der Schöpfung für sich nimmt und jeden einzeln betrachtet, z. B. die Sonne für sich allein und den Mond besonders, dann wieder die Erde und die Luft, die Wärme und die Kälte, die Trockenheit und Feuchtigkeit aus ihrer wechselseitigen Verbindung gelöst, jedes für sich nimmt und gesondert betrachtet, so wird man finden, daß gar nichts sich selbst genügt, vielmehr alles der gegenseitigen Ergänzung bedarf und sich nur durch gegenseitigen Beistand erhält. Die Sonne bewegt sich im Kreis mit dem ganzen Himmel und wird von ihm umschlossen, und sie könnte nie außerhalb seines Kreises bestehen. Der Mond und die übrigen Gestirne bezeugen ihre Abhängigkeit von der Sonne. Die Erde wieder läßt ohne Regengüsse keine Früchte hervorsprossen; die Regen aber fielen nicht nieder ohne Vermittlung der Wolken; aber auch die Wolken könnten ohne die Luft für sich allein nicht erscheinen noch je bestehen. Ebenso erhält auch die Luft nicht aus sich selbst, sondern vom Äther die Wärme und leuchtet von der Sonne durchglüht. Auch Quellen und Ströme werden sich nie ohne die Erde bilden. Die Erde aber ist nicht auf sich selbst gestützt, sondern ruht auf der Substanz der Wasser; doch auch diese selbst ist wieder umgeben — in die Mitte des Weltalls eingeschlossen. Das Meer und der große Ozean, der von außen her die ganze Erde umfließt, wird von den Winden in Bewegung gesetzt und getrieben, wohin ihn die Gewalt der Winde trägt. Die Winde selbst wieder entstehen nicht in sich selbst, sondern nach Angabe derer, die sich hierüber geäußert haben, eben in der Luft infolge der Erhitzung und Erwärmung der Luft durch den Äther, und sie wehen durch sie überallhin. Und was die vier Elemente anlangt, aus denen die Natur der Körper besteht, nämlich die Wärme und Kälte, Feuchtigkeit und Trockenheit, wer wäre so sinnverrückt, daß er nicht wüßte, daß diese in Verbindung miteinander bestehen, getrennt und für sich bestehend alsbald einander aufheben, je nachdem das eine oder andere der Elemente das Übergewicht erlangt? Die Wärme wird von der überwiegenden Kälte aufgehoben, und die Kälte muß der Macht der Wärme weichen; das Trockene wird vom Nassen befeuchtet und letzteres vom ersteren aufgetrocknet.</p><p>Wie können also diese Dinge Götter sein, die der Ergänzung durch andere bedürfen? Oder wie mag man die um etwas bitten, die selbst voneinander Hilfsdienste erbetteln müssen? Denn wenn es von Gott heißt, daß er ganz bedürfnislos sei, sich selbst genüge und von sich selbst voll sei, und daß in ihm alles bestehe, ja gar daß er allem das Dasein gebe, wie darf man dann Sonne und Mond und die anderen Teile der Schöpfung, die nicht so beschaffen sind, sondern wechselseitige Hilfe benötigen, Götter nennen? Doch vielleicht stimmen auch sie mit uns darin überein, daß sie, getrennt und für sich genommen, Bedürfnisse haben, weil der Beweis augenscheinlich vorliegt, behaupten aber, indem sie alles miteinander verbinden und zu einem ganzen Körper zusammenfassen, das Ganze sei Gott. Denn nachdem das Ganze sich gebildet hat, wird ihnen von außen kein Bedürfnis mehr erstehen; vielmehr wird das Ganze sich genügen und zu allem hinreichen. So werden die Pseudophilosophen sagen, um auch darin widerlegt zu werden. Doch diese ihre These wird eher noch mehr als das Vorausgegangene ihre Gottlosigkeit wie ihre große Unwissenheit verraten. Kommt das Ganze zustande durch die Verbindung von Einzelteilen, und besteht das Ganze aus Einzelteilen, so besteht ja das Ganze aus Teilen, und das Einzelne ist ein Teil des Ganzen. Aber das ist von den Vorstellungen, die wir von Gott haben, himmelweit entfernt. Denn Gott ist ein Ganzes und hat keine Teile, und er besteht nicht aus verschiedenen Dingen, vielmehr gibt er selbst allen Dingen Bestand. Sieh doch, welche Gottlosigkeit in solcher Sprache gegen das Göttliche liegt! Besteht er nämlich aus Teilen, so wird er jedenfalls sich selbst ungleich vorkommen als ein Konglomerat von ungleichen Teilen. Ist er nämlich Sonne, so ist er nicht Mond; und ist er Mond, so ist er nicht Erde; ist er aber Erde, so ist er nicht Meer. Und nimmt man so das Einzelne her, dann wird man die Ungereimtheit dieser ihrer These finden. Gerade so kann man sie auch schon aufgrund einer Betrachtung des menschlichen Körpers widerlegen. Denn wie das Auge nicht Ohr ist, das Ohr nicht Hand, wie der Bauch nicht Brust und der Nacken nicht Fuß ist, wie vielmehr ein jeder dieser Teile seine eigene Energie hat, und aus diesen verschiedenen Teilen <strong>ein</strong> Körper entsteht, der die Teile an sich trägt als solche, die verbunden sind während des Gebrauchs, sich aber trennen, wenn die Zeit kommt, wo die Natur gemäß der Weisung Gottes wieder scheidet, was sie (einst) zusammengefügt hat, so muß — möge der Gütige den Ausdruck verzeihen! —, wenn sie die Teile der Schöpfung zu <strong>einem</strong> Körper verbinden, er an und für sich ungleich sein, wie gezeigt worden, und außerdem sich wieder auflösen, da die Teile ihrer Natur nach teilbar sind.</p><p>Doch auch noch auf einem anderen Wege könnte man ihnen ihre Gottlosigkeit beweisen, wenn man die Wahrheit gelten läßt. Wenn nämlich Gott unkörperlich ist, unsichtbar und unberührbar von Natur, wie können sie sich da Gott körperlich denken und göttliche Ehre zollen Dingen, die man mit dem Auge sieht, mit der Hand berührt? Wenn man sodann recht behält mit der Behauptung, daß Gott allmächtig ist und nichts ihn in Gewalt hat, vielmehr er alles in Gewalt hat und Herr ist, warum sehen die Vergötterer der Schöpfung nicht ein, daß sie mit einer solchen Definition von Gott nichts zu tun hat? Ist nämlich die Sonne unterhalb der Erde, so tritt die Erde als dunkler Punkt vor das Licht, so daß man es nicht sieht; den Mond aber verbirgt bei Tag die Sonne mit ihrer Lichtflut. Die Früchte der Erde schädigt oft der Hagel; das Feuer seinerseits erlischt, wenn eine Wasserflut darüber kommt. Den Winter verdrängt der Frühling, dem Frühling aber gebietet der Sommer Halt, und ihm steckt wieder der Herbst seine feste Grenzlinie ab. Wären sie nun Götter, dann dürften sie sich nicht gegenseitig besiegen und verdrängen lassen, sondern müßten immer untereinander zusammen sich vertragen und gleichzeitig die gemeinsamen Energien entfalten. Es müßte bei Tag und Nacht die Sonne zugleich mit dem Mond und dem übrigen Chor der Gestirne das gleiche Licht haben, und dieses müßte allen leuchten, und alles müßte von ihnen erhellt werden. Es müßten gleichzeitig Sommer, Winter, Frühling, Herbst ohne Wechsel und zu derselben Zeit bestehen. Es müßte das Meer mit den Quellen sich vermengen und den Menschen einen gemeinsamen Trank reichen. Im gleichen Moment müßte Windstille und Sturmesbrausen herrschen. Feuer und Wasser müßten den Menschen zu einem und demselben Gebrauch dienlich sein. Auch hätte niemand von ihnen etwas zu fürchten, da sie ja nach Ansicht jener Götter sind und darum nichts zum Schaden, vielmehr alles zu Nutz und Frommen tun. Da aber dies wegen ihres inneren Gegensatzes nicht möglich ist, wie kann man dann diese Dinge, die zueinander im Gegensatze und Kampfe stehen und nicht miteinander bestehen können, noch Götter nennen oder mit göttlicher Verehrung ihnen huldigen? Wie könnten Wesen, die mit sich selbst von Natur in Disharmonie stehen, anderen auf ihre Bitten hin den Frieden verleihen und ihnen Wächter der Eintracht werden? Demnach ist natürlich weder die Sonne noch der Mond noch irgendein anderer Teil der Schöpfung, und noch viel weniger sind die aus Steinen und Gold und anderen Stoffen gefertigten Bildwerke, noch auch die von den Dichtern in Mythen gepriesenen Götter, Zeus und Apollo und die anderen, in Wirklichkeit Götter, wie die Erörterung ergab. Vielmehr sind die einen von ihnen Teile der Schöpfung, die anderen sind leblose Gegenstände, und wieder andere sind nur sterbliche Menschen gewesen. Daher ist auch ihre Verehrung und Vergötterung nicht ein Weg zur wahren Gottesverehrung, sondern ein Weg zum Atheismus und jeglicher Gottlosigkeit und ein Beweis einer großen Abirrung von der Erkenntnis des einzigen und allein wahren Gottes, nämlich des Vaters Christi. Nachdem nun auf diesem Weg bewiesen und gezeigt worden, daß der Götzendienst der Heiden aller Gottlosigkeit voll und nicht zu Frommen, sondern zum Untergang des menschlichen Lebens eingeführt worden ist, wohlan, so wollen wir nach der Widerlegung des Irrtums, wie wir versprochen haben, den Weg der Wahrheit weisen und betrachten den Lenker und Schöpfer des Weltalls, den Logos des Vaters, damit wir durch ihn auch Gott seinen Vater erkennen und die Heiden zur Einsicht kommen, wie weit sie selbst von der Wahrheit abgerückt sind.</p><p>Im vorausgehenden haben wir eigentlich nur die Verirrung des menschlichen Lebens bloßgelegt; der Weg der Wahrheit aber wird den wahrhaft seienden Gott zum Ziele haben. Zu dessen Erkenntnis und tieferer Erfassung benötigen wir aber nicht andere, sondern uns selbst. Wohl ist Gott selbst über alles erhaben; doch nicht ebenso ist der Weg zu ihm uns ferne oder außerhalb von uns; vielmehr ist er in uns, und wir können seinen Ausgang in uns finden, wie auch Moses lehrte mit den Worten: „Das Wort des Glaubens ist in unseren Herzen“. Ebenso gab auch der Herr zu verstehen und beteuerte: „Das Reich Gottes ist in euch“. Weil wir nämlich inwendig in uns selbst den Glauben und das Reich Gottes haben, so können wir den König des Weltalls, den heilbringenden Logos des Vaters, leicht betrachten und erkennen. Und es sollen die götzendienerischen Heiden ja nicht sich hinausreden noch auch sonst jemand sich einfach täuschen, als ob ihnen dieser Weg nicht offen stünde und sie daher eine Ausflucht für ihren Atheismus fänden. Denn wir alle haben diesen Weg betreten und haben ihn (wenigstens), wenn auch nicht alle ihn gehen, sondern wegen der von außen lockenden Lüste des Lebens von ihm abbiegen und ihn verlassen wollen. Und sollte jemand nach diesem Weg fragen, so entgegne ich einfach: es ist die Seele eines jeden und der Geist in ihr. Denn nur durch ihn kann Gott betrachtet und erkannt werden, es müßten denn nur die Gottlosen so, wie sie Gott leugneten, auch sich verbitten, eine Seele zu haben, wozu sie übrigens mehr Grund hätten als zu ihren übrigen Behauptungen. Wer nämlich einen Geist hat, wird dessen Schöpfer und Bildner nicht leugnen. Daß nun jeder Mensch eine Seele hat, und zwar eine vernünftige, das muß man der Einfältigen wegen in Kürze dartun, zumal auch einige Häretiker eine solche leugnen und glauben, der Mensch sei weiter nichts als die sichtbare Körpergestalt. Mit ihrer Konstatierung soll es ihnen dann ermöglicht werden, in sich selbst einen noch schlagenderen Beweis gegen ihre Götzen zu finden.</p><p>Fürs erste liegt ein nicht unwesentlicher Beweis für die Vernünftigkeit der Menschenseele darin, daß sie von den vernunftlosen Wesen verschieden ist. Deshalb eben pflegt ja die Natur die letzteren vernunftlos zu nennen — im Gegensatz zum menschlichen Geschlecht, das vernunftbegabt ist. Weiter ist wohl auch ein nicht unwichtiger Beweis hierfür die Tatsache, daß nur der Mensch über die Dinge außer sich nachdenkt, das Abwesende sich vergegenwärtigt, daß er ferner überlegt und mit freiem Urteil für das als besser Erkannte sich entscheidet. Die vernunftlosen Geschöpfe sehen nur auf das Gegenwärtige und zielen nur auf das in die Augen Fallende ab, auch wenn ihnen hieraus ein Nachteil erwächst. Der Mensch stürmt aber nicht auf das los, was er sieht, sondern prüft in vernünftiger Überlegung das, was ihm in die Augen fällt. So fühlt er oft einen Antrieb, beherrscht sich aber dank seines vernünftigen Urteils, und nach einem ersten Nachdenken sinnt er abermals nach. So gewahrt ein jeder, dem es um die Wahrheit zu tun ist, daß der Menschengeist etwas anderes ist als die leiblichen Sinne. Und weil er etwas anderes ist, eben deshalb wird er auch zum Richter über die Sinne, und was diese aufnehmen, das beurteilt er, hält es im Gedächtnis fest und zeigt ihnen das Bessere. Denn das Auge kann nur sehen, die Ohren können nur hören, der Mund kann nur kosten, die Nase nur riechen, die Hand nur betasten; was man aber sehen, hören, betasten, kosten, riechen soll, das können nicht mehr die Sinne bestimmen, sondern nur die Seele und ihr Geist. Freilich kann die Hand auch das Schwert ergreifen und der Mund Gift verkosten; aber sie wissen nicht, daß diese Dinge schädlich sind, wenn nicht die Vernunft das Urteil fällt. Es verhält sich damit — um zur Veranschaulichung ein Bild zu gebrauchen — wie mit einer trefflich konstruierten Leier und dem Musiker, der sie mit Virtuosität handhabt. Wie nämlich jede Saite der Leier ihren eigenen Ton hat, die eine einen tiefen, die andere einen hohen, die eine einen mittleren und eine andere wieder einen anderen, ihre Harmonie und Verbindung aber nur von dem Virtuosen erkannt und gefunden werden kann — erst dann nämlich kommt ihre Harmonie und rechte Verbindung zum Ausdruck, wenn der, welcher die Leier hält, die Saiten schlägt und jede harmonisch berührt —, ebenso beurteilt und weiß auch die Seele, was sie macht und tut, wenn der erfahrene Geist die einer Leier gleich gestimmten Sinne des Leibes meistert. Das vermögen aber nur Menschen, und darin zeigt sich das vernünftige Prinzip der menschlichen Seele, mit dem sie von den vernunftlosen Geschöpfen sich unterscheidet und zeigt, daß sie in der Tat etwas anderes ist als das, was am Leib in sichtbare Erscheinung tritt. So denkt der Mensch oft über das Himmlische nach und betrachtet es, wenn schon sein Leib auf der Erde liegt; und oft ist der innere Mensch geschäftig, während der Leib regungslos ist, ruht und schläft, und er betrachtet die Dinge außer sich, schwebt in ferne Länder, durchwandert sie, begegnet den Bekannten, und gar oft ahnt und weiß er damit seine Handlungen für den kommenden Tag voraus. Was sollte das aber anders sein als die vernünftige Seele, mit der der Mensch nachdenkt und erkennt, was über ihm ist?</p><p>Auch noch folgendes soll beitragen zur gründlichen Widerlegung derer, die immer noch an der unverschämten These von der Vernunftlosigkeit (der Seele) festhalten. Wie kann ein Mensch, dessen Leib von Natur sterblich ist, über die Unsterblichkeit nachdenken und oft aus Liebe zur Tugend eher den Tod sich erbitten? Oder wie kann der Mensch, dessen Leib vergänglich ist, über das Ewige nachdenken, so daß er gar gegen das Gegenwärtige gleichgültig wird und nach dem Ewigen sich sehnt? Der Leib käme von sich aus nicht zu solchen Gedanken über sich, und er machte sich überhaupt keine Gedanken über die Dinge außer sich; denn er ist sterblich und vergänglich. Etwas anderes muß es sein, was das Gegensätzliche und über die Natur des Leibes Hinausragende denkt. Was könnte das wieder sein, wenn nicht die vernünftige, unsterbliche Seele? Denn nicht von außen, sondern inwendig entlockt sie dem Leibe, wie der Musiker der Leier, die erhabeneren Töne. Wie kommt es sodann, daß Aug’ und Ohr, die natürlichen Organe zum Sehen und Hören, bald sich verschließen, bald sich öffnen? Wer ist es denn, der dem Auge das Sehen wehrt? Wer, der den natürlichen Gehörsinn gegen den Laut verschließt? Oder wer beschneidet oft dem Gaumen, dem natürlichen Geschmacksinne, seine natürlichen Triebe? Wer hält die von Natur geschäftige Hand ab, etwas anzurühren? Wer verbietet dem Geruchsinn, der doch zum Riechen geschaffen, das Riechen? Wer ist es, der den natürlichen Trieben des Leibes entgegenwirkt? Oder wie kommt es, daß der Körper seine Natur verleugnet und einlenkt auf die Ratschläge eines anderen und seinem Wink willfährig wird? Das alles beweist eben nur, daß eine vernünftige Seele den Leib regiert. Der Körper kann von Natur aus sich selbst keine Bewegung geben, erhält vielmehr von einem Dritten Bewegung und Leben, ähnlich wie das Roß, das auch nicht sich selbst ausspannt, sondern von seinem Herrn in Lauf gesetzt wird. Darum eben gibt es auch Gesetze für die Menschen, das Gute zu tun, das Böse zu lassen. Für die vernunftlosen Geschöpfe aber bleibt das Böse undenkbar und unerkennbar, da ihnen Vernünftigkeit und vernünftiges Urteil abgeht. So glaube ich, im vorausgehenden bewiesen zu haben, daß es in den Menschen eine vernünftige Seele gibt.</p><p>Daß aber die Seele auch unsterblich geschaffen ist, — auch um diese Lehre der Kirche muß man wissen, um die Beseitigung der Götzen zu begründen. Die diesbezügliche Erkenntnis ließe sich nun wohl zunächst und einfacher aus der Kenntnis des Leibes gewinnen und aus der Verschiedenheit von Leib und Seele. Denn wenn die Erörterung für ihre Verschiedenheit vom Leibe bereits den Beweis erbracht hat, der Leib aber von Natur sterblich ist, so muß die Seele unsterblich sein, soll sie anders sein als der Leib. Wenn sodann die Seele, wie bewiesen, den Leib bewegt und selber nicht von anderen Dingen bewegt wird, so folgt daraus, daß die Seele, die sich selbst die Bewegung gibt, auch nach der Ablegung des Leibes zu seiner Bestattung in die Erde sich selbst wieder die Bewegung gibt. Nicht die Seele ist es, die stirbt, sondern der Leib — infolge seiner Loslösung von ihr. Wenn nun auch sie vom Leibe die Bewegung erhielte, so müßte sie selbst sterben, wenn der Beweger entweicht. Bewegt aber die Seele auch den Leib, so muß sie vorab sich selbst die Bewegung geben. Bewegt sie sich aber von selbst, dann muß sie auch nach dem Tode des Leibes fortleben. Die Bewegung der Seele ist ja nichts anderes als ihr Leben, so wie wir ja auch vom Leibe sagen, er lebe, wenn er in Bewegung ist, und dann seinen Tod konstatieren, wenn die Bewegung aufhört. Indes kann man dies auch deutlich genug aus ihrer allgemeinen Wirksamkeit im Leibe wahrnehmen. Denn auch wenn sie sich im Leibe niedergelassen hat und an ihn gefesselt ist, so läßt sie sich doch nicht auf den Raum des Leibes einengen und abgrenzen. Vielmehr weiß sie, mag auch der Leib im Bette liegen und sich nicht regen, sondern wie im Tode ruhen, aus eigener Kraft zu wachen und über die Natur des Leibes sich zu erheben, und gleichsam los vom Leibe und doch in ihm verbleibend denkt und betrachtet sie das Überirdische; ja oft tritt sie gar mit Heiligen und Engeln in Verbindung, die außerhalb der irdischen Körperwelt stehen, und sie schwingt sich zu ihnen empor im Vertrauen auf die Reinheit des Geistes. Wie, wird sie dann nicht noch weit mehr nach ihrer Trennung vom Leibe, wenn es Gott gefällt, der sie daran gebunden, die Unsterblichkeit in hellerem Lichte schauen? Denn, lebt sie schon in Verbindung mit dem Leibe ein Leben außerhalb des Körpers, so wird sie weit eher auch nach dem Tode des Leibes weiter leben und nicht aufhören zu leben — dank der Gnade Gottes, der sie so erschaffen durch seinen Logos, unseren Herrn Jesus Christus. Deshalb denkt und sinnt sie auch über Unsterbliches und Ewiges nach, da sie ja auch unsterblich ist. Wie der sterbliche Leib und seine Sinne Vergängliches wahrnehmen, so muß die Seele, die Unsterbliches betrachtet und erwägt, selbst unsterblich sein und immerfort leben. Denn die Begriffe und Gedanken von der Unsterblichkeit verlassen sie nie, sondern verbleiben in ihr gleichsam als Funke zum Unterpfand der Unsterblichkeit. Deshalb hat sie auch die Gottesidee und wird ihr eigener Weg, indem sie nicht von außen, sondern in sich selbst die Kenntnis und den Begriff vom Logos Gottes schöpft.</p><p>Wir behaupten demnach, wie bereits früher gesagt, daß diejenigen, die Gott leugneten und unbeseelte Dinge verehren, ebensowenig an eine vernünftige Seele glauben und eben damit für ihre Torheit büßen müssen, daß sie sich unter die vernunftlosen Geschöpfe zählen. Und deshalb muß man sie, die gleichsam selbst unbeseelt mit unbeseelten Wesen abergläubischen Kult treiben, bedauern und an der Hand führen. Wenn sie aber glauben, eine Seele zu haben und mit Recht auf ihre Vernünftigkeit stolz sind, warum erlauben sie sich denn so Vernunftwidriges, als hätten sie keine Seele, und denken nicht, wie es sich gehört, sondern stellen sich über das Göttliche? Denn obschon sie eine unsterbliche und unsichtbare Seele haben, so stellen sie doch Gott in sichtbaren und vergänglichen Dingen bildlich dar. Oder warum nehmen sie jetzt nicht wieder ihre Zuflucht zu Gott, wie sie von ihm abgefallen sind? Denn wie sie sich mit ihren Herzen von Gott abwandten und nicht-seiende Dinge als Götter sich einbildeten, so können sie mit ihrer vernünftigen Seele sich wieder erheben und wieder zu Gott zurückkehren. Das können sie aber nur, wenn sie allen Schmutz der Begierlichkeit, mit dem sie sich bedeckt haben, ablegen und so lange sich reinigen, bis sie jeden Fremdkörper aus der Seele entfernt haben und sie in ihrer ursprünglichen Reinheit herstellen, damit sie so in ihr den Logos des Vaters, nach dessen Bild sie im Anfang geschaffen, schauen könnten. Denn nach Gottes Bild und Gleichnis ist sie erschaffen, wie auch die göttliche Schrift anzeigt, die in der Person Gottes spricht: „Laßt uns den Menschen machen nach unserem Bild und Gleichnis“. Daher schaut sie auch, wenn sie allen angehäuften Unrats der Sünde sich entledigt und nur das reine Abbild bewahrt, ganz natürlich, wenn dieses wieder aufleuchtet, wie in einem Spiegel den Logos, das Bild des Vaters, und erkennt in ihm den Vater, dessen Bild der Erlöser ist. Oder wenn dieser Aufschluß die Seele nicht befriedigt, weil Dinge von außen her ihr Urteil trüben, und sie so das Bessere nicht sieht, so kann man wieder durch die Erscheinungswelt zur Erkenntnis Gottes gelangen, da die Schöpfung Schriftzügen gleich durch ihre Ordnung und Harmonie ihren Herrn und Schöpfer anzeigt und laut verkündet.</p><p>Hat doch der gütige und menschenfreundliche Gott, der sich um die von ihm erschaffenen Seelen kümmert, der, weil unsichtbar und unbegreiflich von Natur, erhaben ist über jede geschaffene Substanz, weshalb ja das Menschengeschlecht zur Erkenntnis seiner nicht gelangen könnte — denn es stammt aus dem Nichtseienden, er aber ist ungeworden —, hat er doch eben deshalb durch seinen Logos die Schöpfung so eingerichtet, daß er, von Natur ja unsichtbar, wenigstens aus den Werken für die Menschen erkennbar würde. Denn aus den Werken wird der Künstler oftmals erkannt, wenn er auch nicht sichtbar ist. So erzählt man vom Bildhauer Phidias, daß seine Schöpfungen durch ihre Symmetrie und ihre Proportionalität den Beschauern den Phidias verrieten, obschon er nicht zugegen war. Ebenso muß man auch aus der Ordnung der Welt Gott, ihren Schöpfer und Baumeister, erkennen, wenn schon man ihn mit dem leiblichen Auge nicht sieht. Denn Gott hat seine unsichtbare Natur nicht mißbraucht — komme doch niemand mit dieser Ausrede! — und sich etwa den Menschen gänzlich unbezeugt gelassen, sondern er hat, wie bereits gesagt, die Schöpfung so eingerichtet, daß er, wenn schon unsichtbar von Natur, gleichwohl aus den Werken erkannt würde. Und das sage ich nicht aus mir selbst, sondern ich schöpfte es aus den Äußerungen der Theologen, zu denen Paulus gehört, der an die Römer also schreibt: „Denn das Unsichtbare an ihm wird seit Erschaffung der Welt aus seinen Werken erkannt und geschaut“. Die Lykaonier redet er in aller Offenheit an: „Auch wir sind Menschen, Leiden unterworfen wie ihr, und predigen euch, daß ihr euch bekehren sollt vom Eitlen zum lebendigen Gott, der den Himmel erschaffen und die Erde und das Meer und alles, was darin ist; der in den vergangenen Zeiten alle Völker ihre Wege wandeln ließ. Doch hat er sich nicht unbezeugt gelassen, indem er Wohltaten spendete, vom Himmel herab uns Regen gab und fruchtbare Zeiten und unsere Herzen sättigte mit Nahrung und Freude“. Wer sähe denn den Kreis des Himmels, den Lauf der Sonne und des Mondes, die Stellungen und Bahnen der übrigen Gestirne, die zwar entgegengesetzt und verschieden sind, aber bei aller Divergenz die einheitliche Ordnung bewahren, ohne bei sich selbst zu bedenken, daß sie sich nicht selbst lenken, sondern ein anderer es ist, der sie ordnet und leitet, ihr Schöpfer? Und wer bei Tag die Sonne aufgehen und bei Nacht den Mond scheinen und ihn in ganz bestimmten Perioden von Tagen ununterbrochen ab- und zunehmen sieht, wer sieht, wie die einen Sterne sich hin- und herbewegen und verschiedentlich ihren Lauf ändern, die anderen ohne Abirrung ihre Bewegung beibehalten, sollte der nicht auf den Gedanken kommen, daß es einen Schöpfer geben muß, der sie lenkt?</p><p>Wer sollte bei der Wahrnehmung, daß von Natur entgegengesetzte Elemente verbunden sind und in voller Harmonie sich zusammenfinden, wie z. B. angesichts der Tatsache einer Vermischung von Feuer und Kälte, von Trockenem und Feuchtem, die sich nicht gegenseitig bekämpfen, sondern wie aus einem Element einen Körper bilden, wer sollte da nicht auf den Gedanken kommen, daß der, welcher sie zusammengefügt hat, außerhalb der Elemente sich befinde? Wer sollte bei der Beobachtung, daß der Winter dem Frühling, der Frühling dem Sommer, der Sommer dem Herbst weicht, und daß diese Jahreszeiten trotz ihrer entgegengesetzten Natur — denn der eine macht kalt, der andere erhitzt, der eine ernährt, der andere zehrt auf — gleichwohl alle in gleicher Weise die Wohlfahrt der Menschen bezwecken, nicht zur Einsicht kommen, daß einer über ihnen steht, der alle zu ihrem gleichen Rechte kommen läßt und alles lenkt, wenn schon er diesen nicht sieht? Wer könnte die Wolken in der Luft dahintreiben und an die Wolken das Schwergewicht des Wassers gebunden sehen, ohne dadurch auf den Gedanken an den zu kommen, der diese Verbindungen geschaffen und diese Vorgänge geregelt hat. Oder wer müßte angesichts der Tatsache, daß gar die von Natur so schwere Erde auf dem Wasser ruht und unbeweglich bleibt auf dem von Natur beweglichen Elemente, sich nicht sagen, daß es einen Gott gibt, der sie so zubereitet und geschaffen hat? Wer hätte ein offenes Auge für den periodischen Fruchtertrag des Landes, für die Regengüsse vom Himmel, für die Bewässerung durch die Ströme, für die Wassersprudel der Quellen, für die Zeugungen von ungleichen Tiergattungen, also für Vorgänge, die nicht in einem fort, sondern in ganz bestimmten Perioden sich vollziehen, ja, wer könnte überhaupt an eben diese und ähnliche Ordnung denken, die unter ungleichen und gegensätzlichen Dingen herrscht, ohne sich bewußt zu werden, daß es <strong>eine</strong> Kraft gibt, die — selbst in erhabener Ruhe — dies alles ordnet und lenkt, wie es ihr gefällt. Denn für sich allein könnten diese Vorgänge nicht entstehen noch je in Erscheinung treten, weil sie von Natur im Gegensatz zueinander stehen. Das Wasser ist ja spezifisch schwerer und fließt abwärts; die Wolken aber sind leicht und schweben rasch empor. Gleichwohl sehen wir aber, wie das schwerere Wasser in den Wolken schwebt. Anderseits ist die Erde sehr schwer, das Wasser leichter als sie; und doch wird das Schwerere vom Leichteren getragen, und die Erde sinkt nicht ein, sondern steht unbeweglich. Und was männlich ist, ist nicht dasselbe wie das Weibliche, und doch verbinden sie sich zu einer Einheit und durch beide kommt <strong>eine</strong> Geburt eines ähnlichen Wesens zustande. Kurz gesagt: Das kalte Element ist dem warmen entgegengesetzt, das nasse kämpft mit dem trockenen; gleichwohl gehen sie zusammen und stoßen sich gegenseitig nicht ab, sondern erzielen durch Eintracht <strong>einen</strong> Körper und die Entstehung aller Dinge.</p><p>Es hätten sich also die von Natur einander widerstreitenden und entgegengesetzten Dinge nicht zusammengefunden, wenn es nicht einen Mächtigeren gäbe und einen Herrn, der sie verband, dem auch die Elemente wie Sklaven dem Herrn untertan sind, nachgeben und gehorchen. Und so steht nicht das eine im Kampf mit dem anderen -— jedes mit dem Ziel, seine eigene Natur durchzusetzen, vielmehr anerkennen sie den Herrn, der sie verbunden, und finden sich einträchtig zusammen, von Natur sich gegenseitig feind, aber in Liebe geeint durch den Willen des Lenkers. Denn wäre es nicht auf eine höhere Anordnung hin zu einer Mischung dieser Elemente gekommen, wie hätte sich dann das Schwere mit dem Leichten, oder das Trockene mit dem Nassen, oder das Runde mit dem Geraden, oder das Feuer mit der Kälte, oder überhaupt das Meer mit dem Land, oder die Sonne mit dem Monde, oder wie hätten sich die Sterne mit dem Himmel und die Luft mit den Wolken vermischt und zusammengefunden, da doch keines mit dem anderen die Natur teilt? Es hätte ein großer Streit unter ihnen entstehen müssen, da das eine brennt, das andere kühlt, das Schwere abwärts, das Leichte umgekehrt aufwärts zieht, die Sonne wieder erleuchtet, die Luft verfinstert. Und wohl auch die Sterne würden untereinander in Zwietracht geraten, weil die einen höher, die anderen niedriger gestellt sind. Auch wäre die Nacht dem Tag nicht gewichen, wäre vielmehr immerfort im Kampf und Aufruhr gegen ihn verharrt. Wäre aber dem so, dann gäbe es nur mehr ein Chaos statt der Harmonie, Regellosigkeit statt der Regelmäßigkeit, eine Auflösung des Ganzen statt des Zusammenhalts, ein Mangel an Ebenmaß statt der Symmetrie zu sehen. Durch den Aufruhr und Zwist des einzelnen würden entweder alle vernichtet, oder es könnte nur das Stärkere in die Erscheinung treten; das würde wieder das Chaos des Weltalls bedeuten. Denn allein gelassen und der Ergänzung durch die anderen beraubt, würde es in das Ganze Disharmonie bringen, gerade so wie auch der Leib nicht vollkommen bliebe, wenn auch nur <strong>ein</strong> Fuß oder <strong>eine</strong> Hand fehlte. Was gäbe denn das für eine Welt, wenn nur die Sonne schiene oder nur der Mond noch kreiste, oder wenn nur Nacht wäre oder immerfort nur Tag? Was wäre sodann das für eine Ordnung, wenn es nur einen Himmel gäbe ohne die Sterne, oder Sterne ohne den Himmel? Was könnte es nützen, wenn es nur Meer gäbe oder nur Land ohne Wasser und ohne die anderen Teile der Schöpfung? Wie könnte ein Mensch oder überhaupt ein Lebewesen auf Erden existieren, wenn die Elemente unter sich uneins wären, das Obsiegende nur <strong>eines</strong> wäre und dieses unfähig und unzureichend, den Körpern die Existenz zu geben? Denn kein Teil im Weltall könnte nur aus dem warmen oder nur aus dem kalten, nur aus dem nassen oder trockenen Elemente entstehen; vielmehr wäre alles ordnungs- und ganz zusammenhanglos. Doch auch das scheinbar obsiegende Element könnte ohne Beistand der übrigen nicht bestehen; denn nur so besteht es auch jetzt.</p><p>Wenn also im Weltall nicht Regellosigkeit, sondern Regelmäßigkeit, nicht Mangel an Ebenmaß, sondern Symmetrie, nicht ein Chaos, sondern Ordnung herrscht und durchgängige Harmonie im Weltganzen, so müssen wir vernünftigerweise auf den Gedanken kommen, daß ein Herr existiert, von dem diese Verbindung und dieses Gefüge herrührt und der ihre Harmonie zuwege bringt. Denn wenn er auch für das Auge unsichtbar bleibt, so kann doch aus der Ordnung und dem Einklang der Gegensätze ihr Herr, Ordner und König erschlossen werden. Denn wenn wir z. B. ein Staatsgebilde aus vielen und verschiedentlichen Menschen, aus Kleinen und Großen, Reichen und Armen, aus Greisen und Jünglingen, aus Männern und Frauen trefflich regiert und in ihm die verschiedenen Elemente einmütig zusammenleben sähen, also die Reichen nicht im Kampf gegen die Armen, die Großen nicht im Gegensatz zu den Kleinen, die Jünglinge nicht im Widerspruch mit den Greisen, sondern alle in gleich friedlicher Eintracht, wenn wir, sage ich, dies sähen, so kämen wir sicher auf den Gedanken, daß hier ein Regent da ist, der für die Eintracht sorgt, auch wenn wir ihn nicht sähen. Die Unordnung verrät die Anarchie, die Ordnung weist auf einen Herrscher. Und wenn wir die Glieder am Leibe in harmonischer Zusammenarbeit sehen, das Auge also nicht in Opposition zum Gehör und die Hand nicht im Streit mit dem Fuß, sondern jedes Glied in widerspruchsloser Erfüllung seiner Aufgabe, so schließen wir daraus mit Sicherheit, daß dem Leibe eine Seele innewohnt, welche die Glieder meistert, auch wenn wir sie nicht sehen. Gerade so muß man in der Regelmäßigkeit und Harmonie des Weltalls den Lenker der Welt, Gott, erkennen, und zwar in der Einzahl, nicht in der Mehrzahl. Schon die Ordnung im Weltgebilde, wie auch die volle Harmonie aller Teile weist nicht auf viele hin, sondern auf einen, der sie beherrscht und lenkt, den Logos. Hätte nämlich die Schöpfung viele Regenten, so ließe sich eine solche Ordnung im Weltall nicht aufrechterhalten, vielmehr würde bei der Vielheit alles wieder in Unordnung geraten, da ein jeder nach seinem Willen alles lenken wollte und mit dem dritten kämpfen würde. Denn wie wir den Polytheismus als Atheismus erklärten, so muß Vielherrschaft Anarchie bedeuten. Jeder würde ja die Herrschaft des anderen aufheben, und schließlich wäre keiner mehr Regent, sondern es herrschte allenthalben die Anarchie. Wo kein Herrscher mehr ist, muß die Unordnung eintreten. Anderseits weist die Ordnung und Eintracht unter den vielen und verschiedenartigen Teilen auf einen Herrscher. Wenn z. B. einer eine viel- und verschiedensaitige Leier von ferne hört und sich wundert ob des harmonischen Zusammenklangs der Saiten, weil nicht die tiefe oder hohe oder mittlere Saite allein den Ton gibt, sondern alle miteinander zu einem gemeinsamen Akkord ertönen, so schließt er daraus jedenfalls nicht, daß die Leier sich selbst in Schwingung bringt oder etwa von vielen geschlagen werde, vielmehr, daß nur ein Musiker den Ton einer jeden Saite zu einem harmonischen Akkord virtuos verbinde, vermag er auch diesen nicht zu sehen. Gerade so folgt auch aus der allharmonischen Ordnung im Weltganzen, aus der Tatsache, daß das Obere nicht gegen das Untere, noch das Untere gegen das Obere sich kehrt, vielmehr alles auf eine Ordnung abzielt, daß man sich nur einen und nicht viele als Regenten und König der gesamten Schöpfung denken darf, der mit seinem Lichte alles erleuchtet und bewegt.</p><p>Man darf also nicht glauben, daß die Schöpfung viele Schöpfer und Regenten habe; vielmehr entspricht es aufrichtiger Gottesfurcht und der Wahrheit, einen als ihren Schöpfer zu bekennen, und zwar deshalb, weil es die Schöpfung selbst deutlich beweist. Denn ein untrüglicher Beweis dafür, daß die Weit nur einen Schöpfer hat, liegt in der Tatsache, daß es nicht viele Welten gibt, sondern nur eine. Gäbe es viele Götter, so müßte es auch viele und verschiedene Welten geben. Denn es ginge nicht an, daß die vielen eine Welt erschaffen, noch daß die eine von vielen erschaffen würde — wegen der daraus folgenden Ungereimtheiten. Fürs erste, wenn die eine Welt von vielen erschaffen wäre, so verriete dies die Ohnmacht der Schöpfer, weil das eine Werk nur den vielen möglich war. Darin läge ein nicht unwesentlicher Beweis für die unzulängliche Schöpferkunst eines jeden. Würde nämlich einer genügen, so brauchten nicht die vielen das gegenseitige Defizit zu decken. Aber behaupten, in Gott sei etwas Mangelhaftes, ist nicht nur gottlos, sondern geht über alle Grenzen von Ruchlosigkeit. Schon unter den Menschen würde man ja einen Künstler nicht vollkommen nennen, sondern armselig, wenn er nicht allein, sondern nur im Verein mit vielen ein Werk zustande brächte. Konnte aber ein jeder das Weltall vollenden, und hätten alle nur deshalb mitgearbeitet, um ihren Anteil am Werke zu haben, so wäre solche Handlungsweise lächerlich, wenn ein jeder nur des Ruhmes wegen gearbeitet hätte und aus Besorgnis, sonst als ohnmächtig zu gelten. Den Göttern aber eitlen Ehrgeiz nachsagen, gehört zum Allerdümmsten. Wenn ferner ein jeder zur Erschaffung des Weltalls die Macht besitzt, wozu dann so viele, wenn doch einer vollauf genügte? Übrigens nähme es sich gottlos und töricht aus, wenn das Werk nur eines wäre, die Schöpfer aber verschiedene und viele, sagt uns doch schon die natürliche Vernunft, daß das Eine und Vollkommene höher steht als das Verschiedene. Auch das muß man sich noch sagen, daß die Welt als ein Werk von vielen verschiedenartige und ihr selbst ungleiche Bewegungen hätte. Sie hätte sich ja nach jedem ihrer Schöpfer zu richten, hätte somit auch verschiedene Bewegungen. In dieser Abweichung läge aber, wie bereits früher gesagt, wieder das Chaos und die Unordnung für das Ganze; wird ja nicht einmal ein Schiff, das von mehreren gesteuert wird, den rechten Kurs einhalten, wenn nicht <strong>ein</strong> Steuermann das Ruder führt. Und auch eine Leier, von vielen geschlagen, wird keinen richtigen Akkord hören lassen, wenn nicht ein Künstler sie schlägt. Weil es also nur eine Schöpfung, eine Welt und eine Ordnung in ihr gibt, so darf man auch nur einen als ihren König und Schöpfer annehmen. Deshalb hat ja auch der Schöpfer selbst die ganze Welt als eine erschaffen, damit man nicht aus der Existenz vieler Welten viele Schöpfer mutmaßte, sondern daß man durch das eine Werk auch zum Glauben an dessen einen Schöpfer komme. Doch existiert nicht etwa deshalb nur eine Welt, weil es nur einen Schöpfer gibt — denn Gott hätte auch noch andere Welten schaffen können —, sondern weil die erschaffene Welt eine ist, deshalb darf man auch nur an einen als ihren Schöpfer glauben.</p><p>Wer mag nun dieser sein? Auf diese Frage vor allem muß man ja Rede und Antwort stehen, damit niemand wegen mangelnder Erkenntnis seiner irre gehe und auf einen anderen rate und so mit den früher Genannten in dieselbe Gottlosigkeit falle. Ich glaube zwar, daß hierüber niemand im Zweifel ist. Hat doch unsere Erörterung gezeigt, daß die sogenannten Götter der Dichter keine Götter sind, daß diejenigen irren, welche die Schöpfung vergöttern, und daß überhaupt der Götzenkult der Heiden Atheismus und Gottlosigkeit ist. So kann nach der Beseitigung jener Götter ganz natürlich nur mehr bei uns der würdige Gottesdienst zu finden und nur der von uns angebetete und verkündigte Gott der wahre sein, der Herr der Schöpfung und der Schöpfer jeglicher Natur. Wer anders ist nun das als der allheilige und über jede geschaffene Substanz hocherhabene Vater Christi, der einem trefflichsten Steuermann gleich mit seiner eigenen Weisheit und seinem eigenen Logos, unserem Herrn und Heiland Christus, alles zum Heile lenkt, anordnet und tut, so wie er es immer für gut findet? Gut so aber ist es, wie es geschehen ist und wie wir es geschehen sehen, da er ja auch das will. Das wird wohl niemand bezweifeln. Wäre nämlich die Bewegung der Schöpfung eine unvernünftige und würde die Welt nur so dahingetrieben, so würde man mit gutem Grund unseren Worten keinen Glauben schenken. Ist sie aber aus Vernunft, Weisheit und Einsicht hervorgegangen und mit voller Harmonie geschaffen, so kann ihr Regent und Ordner kein anderer sein als der Logos Gottes. Unter dem Logos verstehe ich aber nicht den, der mit jedem geschaffenen Wesen verbunden und ihm angeboren ist, den einige auch den ‘Befruchtenden’ (σπερματικόν) zu nennen pflegen, der unbeseelt ist, jeglicher Vernunft und jeden Gedankens bar und nur durch äußere Technik wirksam wird entsprechend dem Verständnis dessen, der ihn mitteilt. Ich meine auch nicht das Wort (λόγον), wie es das vernünftige Geschlecht kennt, das Wort, das aus Silben besteht und in der Luft wahrnehmbar wird, sondern ich meine den lebendigen und wirksamen Gott des Guten und des Gottes aller Dinge, der durch sich selbst Logos ist (ἀυτολόγος), der verschieden ist von den entstandenen Dingen und von der ganzen Schöpfung und der eigene und einzige Logos des guten Vaters ist, der durch seine Vorsehung das gegenwärtige All erschaffen hat und erleuchtet. Als der gütige Logos des gütigen Vaters hat er die Einrichtung der Welt angeordnet, indem er die Gegensätze mit den Gegensätzen ausglich und aus ihnen eine Harmonie herstellte. Er, „Gottes Kraft und Weisheit“, gibt dem Himmel seinen Kreislauf, hält die Erde in der Schwebe und befestigt sie, obschon sie auf nichts ruht, durch seinen Wink. Von ihm beleuchtet, gibt die Sonne der Erde das Licht und erhält der Mond sein Licht zugemessen. Dank ihm hängt auch das Wasser in den Wolken, befeuchten die Regen die Erde, bleibt das Meer in seinen Grenzen eingeschlossen und sproßt üppig die Erde allerlei Gewächs. Und wenn einer ungläubig auf unsere Ausführung hin noch die Frage stellte, ob es überhaupt einen Logos Gottes gebe, so müßte ein solcher mit seinem Zweifel am Logos Gottes wahnsinnig sein. Er findet aber gleichzeitig in dem, was er sieht, den Beweis, daß durch den Logos und die Weisheit Gottes alles besteht, und daß auch nicht ein Ding ein Dasein gewonnen hätte, wenn es nicht, wie erwiesen, durch den Logos, und zwar durch den göttlichen Logos entstanden wäre.</p><p>Als Logos ist er aber, wie gesagt, nicht dem menschlichen Worte gleich aus Silben zusammengesetzt, sondern das unveränderte Bild seines Vaters. Der Menschen Wort ist ja freilich zusammengesetzt und auflösbar, da sie selbst aus Teilen bestehen und aus dem Nichtseienden entstanden sind. Gott aber ist ein seiender und nicht zusammengesetzt. Daher ist auch sein Logos ein seiender und nicht zusammengesetzt; vielmehr ist er ein einziger und eingeborener Gott, der aus dem Vater wie aus einer guten Quelle gut hervorgeht, alles anordnet und zusammenhält. Der Grund aber, weshalb der Logos, der Logos Gottes, sich zu den Dingen herabgelassen hat, ist wahrhaft wunderbar und läßt erkennen, daß die Dinge nicht anders als so werden durften, wie sie wirklich sind. Denn weil aus dem Nichts hervorgegangen, ist die Natur der geschaffenen Welt, für sich betrachtet, hinfällig, ohnmächtig und sterblich; der Gott des Weltalls aber ist gut von Natur und erhaben schön. Deshalb ist er auch menschenfreundlich. Dem Guten liegt ja doch aller Neid fern. Daher beneidet er auch niemand um sein Dasein, sondern will es für alle, um auch seine Menschenliebe bezeugen zu können. Nun sah er, daß die ganze geschaffene Natur nach ihrer (eigenen) Anlage hinfällig und auflösbar wäre. Um dies zu verhüten und einer Wiederauflösung der Welt in das Nichts vorzubeugen, hat er, der ja eben deshalb die Welt durch seinen eigenen und ewigen Logos geschaffen und der Kreatur das Dasein gegeben hatte, sie nicht dem Drängen und Stürmen ihrer eigenen Natur überantwortet, damit sie nicht riskieren muß, ins Nichts zurückzusinken. Nein, in seiner Güte lenkt und erhält er durch seinen Logos und Gott die ganze Schöpfung, damit sie im Lichte der Führung, Vorsehung und ordnenden Weisheit des Logos unerschütterlich bestehen könnte — in Gemeinschaft mit dem wahrhaftigen Logos des Vaters und dank seines Beistands zu ihrem (dauernden) Sein. So sollte ihr fernbleiben, was ihr sonst widerfahren wäre, ich meine das Nichtsein, wenn nicht der Logos sie erhielt, „der da ist das Bild des unsichtbaren Gottes, der Erstgeborene der ganzen Schöpfung; denn durch ihn und in ihm besteht alles, das Sichtbare und Unsichtbare, und er ist das Haupt der Kirche“, wie die Diener der Wahrheit in den heiligen Schriften lehren.</p><p>Eben der allmächtige und ganz vollkommene heilige Logos des Vaters läßt sich auf alles nieder und entfaltet überall seine Kräfte, erleuchtet alles Sichtbare und Unsichtbare, bringt alles mit sich in Verbindung und schließt es zusammen, läßt nichts abseits seines Machtbereiches liegen, sondern er gibt allem und durch alles dem einzelnen für sich wie dem großen Ganzen Leben und Fortbestand. Auch vermengt er die Urstoffe jeder sinnlichen Substanz, wie Wärme und Kälte, Feuchtigkeit und Trockenheit zu einem Ganzen und sorgt dafür, daß sie sich nicht entzweien, sondern eine volle Harmonie darstellen. Dank dem Logos und seiner Macht liegt nicht das Feuer im Kampfe mit der Kälte, noch das nasse Element im Kampfe mit dem trockenen, sondern gleichsam befreundet und verschwistert finden sich die sonst entgegengesetzten Elemente zusammen, erzeugen die sichtbare Natur und werden so für die Körper Ursache ihrer Existenz. Folgsam diesem Gott-Logos treten die einen Dinge auf Erden ins Dasein, die anderen bilden sich am Himmel. Seinetwegen haben alle Meere und der große Ozean in festen Grenzen ihre Bewegung, und alles Land sproßt üppig allerlei und verschiedenartiges Gewächs, wie bereits gesagt worden. Und um mich nicht mit Detailangaben bei so bekannten Dingen aufzuhalten: es gibt ja nichts in allem Sein und Werden, was nicht in ihm und durch ihn geworden wäre und bestände, wie auch der Theologe sagt: „Im Anfang war der Logos, und der Logos war bei Gott, und Gott war der Logos. Alles ist durch ihn geworden, und ohne ihn ist nichts geworden“. Wie ein Musiker, der seine Leier stimmt und die tiefen Töne mit den hohen und die mittleren mit den anderen virtuos verbindet und dadurch eine Melodie zum Vortrag bringt, so weiß auch die Weisheit Gottes, die das Weltall wie eine Leier hält und die Dinge in der Luft mit denen auf der Erde und die im Himmel mit denen in der Luft verbindet, das Ganze zu den Teilen fügt und sie nach seinem Wink und Willen lenkt, eine Welt und Weltordnung in harmonischer Schönheit zu schaffen, wobei sie aber selbst unbeweglich beim Vater verbleibt, allem aber nach eigener Anordnung Bewegung gibt, wie es jeweils ihrem Vater gefällt. Denn das Wunderbare an seiner Gottheit ist das, daß er mit einem und demselben Wink alles zu gleicher Zeit und nicht in Intervallen, sondern in einem Akte alles, das Gerade und das Runde, das Obere, Mittlere und Untere, das Flüssige, Kalte und Warme, das Sichtbare und Unsichtbare lenkt und anordnet — entsprechend der Natur eines jeden. Denn gleichzeitig bewegt sich auf seinen nämlichen Wink hin das Gerade wie Gerades, das Runde im Kreise und das Mittlere dementsprechend; das Warme wird warm, das Trockene trocken gehalten. Alle Dinge erhalten von ihm gemäß ihrer Natur Leben und Bestand: ja eine ganz wunderbare und wahrhaft göttliche Harmonie bringt er zuwege.</p><p>Um den so wichtigen Gegenstand in einem Gleichnis verständlich zu machen, sei als entsprechendes Bild hierfür ein großer Chor gewählt. Der Chor gruppiert sich ja aus verschiedenerlei Leuten: aus Knaben, Frauen, bejahrten Männern und Jünglingen. Auf das Zeichen eines Dirigenten hin singt ein jedes nach seiner Natur und Fähigkeit, der Mann wie ein Mann, der Knabe wie ein Knabe, der Greis wie ein Greis, der Jüngling wie ein Jüngling, und doch erzielen sie alle eine Harmonie. Oder (ein anderes Bild): Unsere Seele setzt in ein und demselben Augenblick unsere Sinne entsprechend ihren Einzelfunktionen in Bewegung, so daß bei einem augenblicklich sich abspielenden Vorgang alle zugleich bewegt werden, das Auge zum Sehen, das Ohr zum Hören, die Hand zum Betasten, der Geruchsinn zum Riechen, der Gaumen zum Kosten, ja oft gar auch die übrigen Glieder des Leibes, wie die Füße zum Gehen. Oder um in einem dritten Gleichnisse die Sache zu veranschaulichen: Es verhält sich mit ihr wie mit einer eben erbauten großen Stadt, die unter den Augen ihres Herrn und Königs, der sie auch erbaut hat, verwaltet wird. Solange er nämlich persönlich da ist und regiert und sein Auge auf alles richtet, leisten alle Gehorsam, die einen eilen zur Feldarbeit, die anderen an die Wasserleitungen, um Wasser zu holen; ein anderer wieder geht fort, um Lebensmittel beizuschaffen; der eine geht in die Ratsversammlung, der andere besucht die Volksversammlung; dem Richter obliegt die Pflicht, Recht zu sprechen, dem Fürsten Gesetze zu geben. Hurtig macht sich der Handwerker an seine Arbeit, der Schiffer eilt ans Meer, der Zimmermann zum Zimmern, der Arzt zum Kurieren, der Baumeister auf den Bauplatz. Der eine geht auf das Feld hinaus, der andere kommt vom Feld zurück; die einen machen ihre Gänge in der Stadt herum, die anderen ihre Ausgänge außerhalb der Stadt und kehren wieder dahin zurück. All das spielt sich ab und geht (schön) zusammen unter den Augen des einen Fürsten auf seine Anordnung hin. Danach also hat man auch von der ganzen Schöpfung, wofür das gewählte Bild freilich ein schwacher Vergleich ist, sich seine Vorstellung zu machen, nur in größerem Maßstabe. Denn durch einen einzigen Willensakt des Logos Gottes wird alles zugleich geordnet, entfaltet jedes Wesen seine Kräfte und durch alle zugleich kommt eine Ordnung zuwege.</p><p>Denn auf den Wink und durch die Macht des Herrn und Lenkers aller Dinge, des göttlichen und väterlichen Logos, dreht sich der Himmel, bewegen sich die Sterne, scheint die Sonne, wandelt der Mond seine Bahn und empfängt die Luft von der Sonne das Licht, wird erwärmt der Äther, wehen die Winde, ragen empor die Berge, wogt das Meer, finden die Tiere darin ihre Nahrung, bringt das unbeweglich verharrende Land Früchte hervor, entsteht der Mensch, lebt und stirbt wieder, erhält kurz alles Leben und Bewegung, brennt das Feuer, kühlt das Wasser, sprudeln die Quellen, fluten über die Flüsse, gibt es Zeitperioden und Jahreszeiten, fallen die Regengüsse, füllen sich Wolken, entsteht der Hagel, bildet sich Schnee und Eis, fliegen die Vögel, kriechen die Reptilien, schwimmen die Wassertiere, wird das Meer befahren, das Land besäet und sproßt zu seiner Zeit, wachsen die Pflanzen, keimen die einen, reifen die anderen, altern und welken die, welche aufgewachsen sind, verschwinden die einen, entstehen und kommen die anderen. All das aber und noch mehr als das, was wir bei der großen Fülle nicht namhaft machen können, empfängt Licht und Leben vom wundertätigen und wunderbaren Logos Gottes. Mit einem Wink bewegt und ordnet er es und bringt so eine Welt zustande, ohne dabei die unsichtbaren Mächte aus seinem Bereich auszuschließen. Denn auch diese begreift er, weil er ja auch ihr Schöpfer ist, in das große Ganze mit ein, hält und belebt sie durch seinen Wink und seine Vorsehung. Zu einem Dementi dessen hat man wohl nichts zur Hand. Denn wie die Körper seiner Vorsehung ihr Wachstum verdanken, die vernünftige Seele in Tätigkeit tritt und die Fähigkeit zu denken und zu leben hat — das braucht nicht erst lange bewiesen zu werden; wir sehen es ja vor Augen —, so bewegt und erhält wieder der Logos Gottes mit einem bloßen Wink und seiner Macht die sichtbare Welt wie die unsichtbaren Gewalten und gibt einem jeden seine eigene Energie, so daß sich die göttlichen Dinge mehr göttlich bewegen, das Sichtbare aber so, wie man es auch gewahrt. Er aber, Herr und König über alles und Urquell aller Dinge, wirkt alles zur Ehre und Erkenntnis seines Vaters und lehrt und verkündet geradezu durch seine Werke: „Aus der Größe und Schönheit der geschaffenen Welt wird vergleichsweise deren Schöpfer erkannt“.</p><p>Wie man durch den Aufblick zum Himmel und durch den Anblick seiner Pracht und des Sternenlichtes auf den Logos kommen kann, der das alles so wohl ordnet, so muß man, wenn man einmal einen Logos Gottes erkennt, auch dessen Vater erkennen, von dem er ausgeht und deshalb mit Recht Herold und Bote seines Vaters heißt. Um das einzusehen, könnte man von unseren Verhältnissen ausgehen. Wenn wir uns nämlich sagen, daß für das Wort, das vom Menschen ausgeht, der Geist die Quelle ist, und sehen und denken wir anderseits im Wort, um darauf den Nachdruck zu legen, das Gepräge des Geistes, so gewinnen wir noch weit mehr, wenn wir in einem höheren Geistesflug und in unvergleichlicher Erhabenheit die Kraft des Logos schauen, auch eine Vorstellung von seinem gütigen Vater. So sagt der Heiland selbst: „Wer mich sieht, sieht auch den Vater“. Noch deutlicher und eingehender verkündet dies auch die inspirierte Schrift, auf die ja auch wir uns stützen, wenn wir dir das schreiben, und worauf du den Glauben an unsere Worte wirst bauen können. Denn eine Rede, die von höheren bestätigt wird, hat eine unwiderlegliche Beweiskraft. So warnte schon vor Zeiten der göttliche Logos das jüdische Volk vor der Einführung der Götzen mit den Worten: „Du sollst dir kein Götzenbild machen noch sonst ein Abbild von all dem, was oben am Himmel und unten auf der Erde ist“. Den Grund für deren Verwerfung gibt er anderswo an mit den Worten: „Die Götzen der Heiden sind Silber und Gold, Werke von Menschenhänden. Sie haben einen Mund und reden nicht, haben Augen und sehen nicht, Ohren und hören nicht, eine Nase und riechen nicht, haben Hände und tasten nicht, Füße haben sie und gehen nicht“. Auch hat er es nicht vergessen, bezüglich der Kreatur eine Lehre zu erteilen, sondern weil er ihre reizende Schönheit gar wohl auch kennt, warnt er die Menschen, daß sie nicht mit trunkenem Blick für ihre Geilheit die geschaffenen Dinge als Götter verehrten statt als Gottes Werke und sagt: „Und wenn du dein Auge erhebst und aufblickst zu Sonne und Mond und zu der ganzen Pracht, so laß dich nicht irreführen und bete sie nicht an, was der Herr, dein Gott, allen Völkern zugeteilt hat, die unter dem Himmel sind“. Er teilte ihnen aber diese Dinge nicht zu als Götter, sondern damit die Heiden aus ihrer Wirksamkeit, wie gesagt, Gott, den Schöpfer des Weltalls, erkannten. Das alte Judenvolk hatte ja eine eingehendere Belehrung, insofern sie nicht bloß aus den Werken der Schöpfung, sondern auch aus den göttlichen Schriften ihre Gotteserkenntnis schöpften. Und um überhaupt die Menschen vom Irrtum und dem unvernünftigen Wahne der Abgötterei abzuhalten, mahnt er: „Du wirst keine fremden Götter neben mir haben“. Nicht als ob es andere Götter gäbe, wehrt er ihnen, solche zu haben, sondern damit niemand vom wahren Gott sich abwende und dazu komme, sich das Nichtseiende zum Gott zu erheben, wie dergleichen sind die sogenannten Götter der Dichter und Schriftsteller, die, wie bewiesen, nicht existieren. Ja, schon der Wortlaut beweist, daß sie keine Götter sind, insofern es heißt: „Du wirst keine fremden Götter haben“, was sich ja auf die Zukunft bezieht. Was aber in der Zukunft eintritt, besteht nicht in dem Augenblick, da von ihm die Rede ist.</p><p>Hat also die göttliche Lehre nach Verwerfung des Atheismus der Heiden oder der Götzendiener geschwiegen und das Menschengeschlecht nur so ohne alle Kenntnis Gottes dahinleben lassen? Keineswegs! Vielmehr kommt sie unserer Vernunft zuvor und sagt: „Höre, Israel, der Herr, dein Gott, ist ein einziger Herr“. Und wieder: „Du sollst den Herrn, deinen Gott, lieben aus deinem ganzen Herzen und aus allen deinen Kräften“. Und wiederum: „Den Herrn, deinen Gott, sollst du anbeten, ihm allein dienen und ihm anhangen“. Die in allem und für alles tätige Vorsehung und Fürsorge des Logos bezeugt sich ja in der ganzen inspirierten Schrift, und so mögen die folgenden Stellen genügen zum Erweis der Glaubwürdigkeit unserer Behauptung, der die Gottesgelehrten die Worte reden: „Du hast die Erde gegründet, und sie bleibt: durch Deine Anordnung bleibt der Tag“. Und wieder: „Lobsingt unserem Gott mit der Harfe; er deckt den Himmel mit Wolken und bereitet Regen der Erde; er läßt Gras wachsen auf den Bergen und Kräuter zum Dienste der Menschen und gibt dem Vieh seine Nahrung“. Durch wen anders aber gibt er dies, als durch den, durch den alles erschaffen ist? Denn der, durch den alles erschaffen ist, sorgt natürlich auch für alles. Wer aber wäre das anders als der Logos Gottes, von dem es auch in einem anderen Psalme heißt: „Durch den Logos des Herrn sind die Himmel befestigt worden und durch den Hauch seines Mundes all ihr Heer“. Daß alles in ihm und durch ihn entstanden, erzählt die Schrift, wenn sie uns bezeugt und sagt: „Er sprach, und sie wurden; er gebot, und sie wurden geschaffen“. Dies bestätigt auch der in allweg so große Moses im Anfange seines Schöpfungsberichtes, wenn er zur Erklärung der zitierten Worte sagt: „Gott sprach: Laßt uns den Menschen machen nach unserem Bild und Gleichnis“. Und auch, als der Vater die Erschaffung des Himmels und der Erde und aller Dinge vornahm, sprach der Vater zu ihm: „Es werde der Himmel, und es soll das Wasser sich sammeln und das Trockene erscheinen; und die Erde bringe Kräuter und lebende Wesen hervor!“. Damit könnte man nun auch die Juden widerlegen, die sich nicht genau an die Schrift halten. Denn mit wem, könnte man sie fragen, redete Gott, daß er sogar einen Befehl aussprach? Wenn er den Geschöpfen gebot und mit ihnen sprach, so war seine Rede überflüssig: sie waren ja noch nicht, sondern sollten erst werden. Niemand aber redet eine Sache an, die noch nicht ist, oder spricht in der Befehlsform etwas an, was noch nicht ist, aber entstehen soll. Wenn Gott hätte dem befehlen wollen, was entstehen sollte, so hätte er sagen müssen: Werde, Himmel! Werde, Erde! Komm hervor, Pflanze! Bilde dich, Mensch! Nun aber sprach er nicht so, sondern er befiehlt mit den Worten: „Laßt uns den Menschen machen“, und „das Kraut sprosse hervor!“ Daraus folgt, daß Gott mit einem Dritten in der Nähe darüber redet. Es muß also jemand bei ihm gewesen sein, mit dem er redete und alles schuf. Wer anders wäre aber dies als sein Logos? Mit wem anders könnte denn Gott reden als mit seinem Logos? Oder wer war mit ihm, als er die ganze Kreatur schuf, wenn nicht seine Weisheit, die da sagt: „Als er den Himmel und die Erde machte, war ich bei ihm“? In der Bezeichnung Himmel und Erde begreift er alles Geschaffene im Himmel und auf Erden mitein. Da er als Weisheit bei ihm war und als Logos den Vater sah, schuf er das Weltall, gestaltete und ordnete es, und als die Kraft des Vaters gab er allen Dingen Kraft zur Existenz, wie auch der Heiland sagt: „Alles, was ich den Vater tun sehe, tue auf gleiche Weise auch ich“. Ja, daß durch ihn und in ihm alles geworden, lehren auch seine heiligen Jünger, wie auch, daß er als gute Geburt aus einem Guten und als wahrhaftiger Sohn Kraft, Weisheit und Logos des Vaters ist, und zwar nicht dank einer Teilnahme oder einer Mitteilung von außen her, wie dies bei denen der Fall ist, die an ihm teilnehmen, durch ihn weise sind und in ihm mächtig und vernünftig werden, sondern so, daß er die Selbstweisheit, Selbstvernunft, die eigene Selbstkraft des Vaters, Selbstlicht, Selbstwahrheit, Selbstgerechtigkeit, Selbsttugend, Abriß, Abglanz und Bild (des Vaters) ist. Und um mich kurz zu fassen: Er ist die vollkommenste Frucht des Vaters, einziger Sohn und unveränderliches Abbild des Vaters.</p><p>Wo nun, ja wo gäbe es doch jemand, der die Größe des Vaters ausrechnen möchte, um auch die Kräfte dieses Logos aufzufinden? Wie er nämlich Logos und Weisheit des Vaters ist, so läßt er sich auch zu den Geschöpfen herab und wird zum Zweck einer Erkenntnis und Erfassung des Vaters die Heiligkeit selbst und das Leben selbst, Türe, Hirt, König, Licht und Vorsehung für alle Dinge. Da nun der Vater aus sich einen so guten und schöpferischen Sohn hat, so verbarg er ihn den Geschöpfen nicht, sondern er offenbart ihn gar täglich allen in dem Entstehen und Leben, das die Dinge ihm danken. In ihm und durch ihn gibt er sich auch selbst zu erkennen laut dem Worte des Heilandes: „Ich bin im Vater, und der Vater ist in mir“, wonach also notwendig der Logos im Erzeuger und der Erzeugte mit dem Vater ewig lebt. Wenngleich aber dem so ist, und außer ihm nichts existiert, vielmehr Himmel und Erde und alles, was darin ist, von ihm abhängt, so haben doch törichte Menschen die Erkenntnis und Verehrung desselben von sich gewiesen, das Nichtseiende über das Wirkliche gestellt und anstatt des wahrhaft seienden Gottes das Nichtseiende vergöttert und in ihrem törichten und gottlosen Beginnen die Schöpfung statt des Schöpfers angebetet. Es ist dies gerade so, wie wenn einer die Werke mehr bewunderte als den Künstler und vor den Gebäuden in der Stadt betroffen dastünde, aber deren Baumeister keines Blickes würdigte, oder wie wenn einer das Musikinstrument lobte, aber von dem nichts wissen wollte, der es fertigte und stimmte. Wie töricht und verblendet sind doch diese Leute! Wie wüßten sie denn sonst etwas von einem Gebäude oder Schiff oder einer Leier, wenn nicht der Schiffsbauer das Schiff gebaut, der Baumeister das Haus erstellt und der Musiker das Instrument gefertigt hätte? So gewiß ein solcher Logiker verrückt ist und seine Torheit über alle Grenzen geht, ebenso kommen auch die mir geistig krank vor, die Gott nicht erkennen und seinen Logos nicht verehren, den Heiland aller, unseren Herrn Jesum Christum, durch den der Vater alles anordnet, erhält und für alles sorgt. Wenn auch du ihm Glauben und Ehrfurcht zollst, dann freue dich, Freund Christi, und sei guter Hoffnung, daß die Frucht deines Glaubens an ihn und deiner Frömmigkeit die Unsterblichkeit und das Himmelreich ist, wenn nur die Seele eine Lebensordnung nach seinen Geboten einhält. Denn wie denen, die ein Leben nach seinem Willen führen, das ewige Leben als Siegeslohn winkt, so droht denen, die den entgegengesetzten und der Tugend abgekehrten Weg gehen, große Schande und ein unerbittliches Unheil am Tage des Gerichtes, weil sie den Weg der Wahrheit gekannt und doch wider ihr besseres Wissen gehandelt haben.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Anton Stegmann und Hans Mertel, <em>Gegen die Heiden</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 31), München 1917. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2090/versions/gegen-die-heiden-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "QFHf_Слово_о_воплощении_БогаСлова"
    path: "Athanasius_Menschwerdung"
    title: "Über die Menschwerdung des Logos"
    menu: { parent: "Werke", title: "Über die Menschwerdung des Logos", priority: 2 }
    update: true
    body: |-
      <p><em>Über die Menschwerdung des Logos, übersetzt von Anton Stegmann und Hans Mertel (Bibliothek der Kirchenväter, 1. Reihe, Bd. 31, München 1917).</em></p><h2>1</h2><p>Im vorausgehenden haben wir aus der Menge der Fragen bezüglich des heidnischen Götzenwahnes und Aberglaubens wenigstens einige wenige zur Genüge erörtert, so die Frage, wie man im Anfang auf diese Verirrungen kam und wie die Menschen aus ihrer Bosheit heraus sich ihren Götzenkult ersannen. Doch haben wir mit Gottes Gnade auch schon über den göttlichen Logos des Vaters einige wenige Andeutungen gemacht und über seine allumfassende Vorsehung und Macht und gezeigt, daß der gütige Vater durch ihn alles anordnet, alles von ihm Bewegung und in ihm Leben erhält. Nun wohlan, Glücklicher und wahrer Christusjünger, im folgenden wollen wir, dem frommen Glauben treu, auch die Fragen von der Menschwerdung des Logos behandeln und uns klar werden über seine göttliche Erscheinung unter uns, auf welche die Juden lästern, die Heiden höhnen, die wir aber anbeten. So soll dann die äußere Erniedrigung des Logos dir geradezu Anlaß geben zu einer noch größeren und höheren Ehrfurcht gegen ihn. Denn je mehr er den Ungläubigen zum Gespötte ist, desto schlagender führt er den Beweis für seine Gottheit, weil er das als möglich offenbart, was Menschen unmöglich und darum unbegreiflich finden, weil er in seiner Güte das ehrenhaft macht, was Menschen als anstößig verspotten, weil er in seiner Macht das als göttlich erweist, was die Menschen in ihrer Weisheit als menschliche Schwächen verhöhnen, insofern er den Götzenwahn mit seiner vermeintlichen Erniedrigung am Kreuze zerstört und die Spötter und Ungläubigen unvermerkt bekehrt, so daß sie seine Gottheit und Macht anerkennen. Zur Erläuterung dessen ist es angezeigt, an das bereits Gesagte zu erinnern, damit du auch den Grund der in einem Leibe erfolgten Erscheinung des so großen und erhabenen Logos des Vaters einsehen könnest und nicht etwa meinst, der Heiland hätte dem Naturgesetz zufolge einen Leib getragen; vielmehr sollst du erkennen, daß er, obschon unkörperlich von Natur und Logos, gleichwohl gehorsam der Menschenfreundlichkeit und Güte seines Vaters um unseres Heiles willen im Menschenleibe uns erschienen ist.</p><p>Es empfiehlt sich aber, bei einer diesbezüglichen Erörterung zuerst von der Schöpfung der Welt zu reden und von ihrem schöpferischen Gott, um so auch ihre Erneuerung durch den Logos, der sie im Anfange geschaffen hat, recht würdigen zu können. Denn man wird keinen Widerspruch darin finden, wenn der Vater die Erlösung der Welt in dem bewerkstelligt hat, durch den er sie auch erschaffen.</p>
      <h2>2</h2><p>Die Gründung der Welt und die Erschaffung aller Dinge haben viele verschieden aufgefaßt, und ein jeder hat nach seinem Kopf eine Erklärung gegeben. Die einen behaupten, alles sei von selbst und durch Zufall entstanden, so die Epikureer, die zu ihrem eigenen Verderben die Vorsehung in der Welt wegschwatzen - in direktem Widerspruch mit der hellen, augenscheinlichen Wahrheit. Wäre nämlich alles durch sich selbst ohne Vorsehung entstanden, wie sie meinen, dann hätte alles einfach entstehen müssen, sich gleich, nicht verschieden. Wie in <strong>einem</strong> Körper müßte alles notwendig Sonne oder Mond sein, und bei den Menschen müßte das Ganze Hand oder Auge oder Fuß sein. Nun ist es aber nicht so. Wir sehen vielmehr da Sonne, da Mond, da Erde, und so wieder bei den menschlichen Körpern da Fuß, da Hand, da Haupt. Solche Ordnung aber zeigt, daß sie nicht von selbst entstanden, weist vielmehr auf eine vorausliegende Ursache für diese Dinge hin, aus der man auf Gott, der alles angeordnet und geschaffen hat, schließen kann. Andere hingegen, zu denen auch der große Grieche Plato zählt, behaupten, aus einer bereits vorliegenden, unerschaffenen Materie hätte Gott das Weltall geschaffen. Gott hätte ja nichts machen können, wenn die Materie nicht bereits vorgelegen hätte, so wie auch dem Zimmermann das Holz zur Verfügung stehen muß, um etwas verfertigen zu können. Doch die so reden, merken nicht, daß sie Gott eine Schwäche beilegen. Ist er nämlich nicht auch Urheber der Materie, schafft er vielmehr überhaupt alle bestehenden Dinge aus einer bereits vorhandenen Materie, so erweist er sich schwach, weil außerstande, ohne die Materie auch nur <strong>ein Ding </strong>zu schaffen, wie es selbstverständlich auch ein Unvermögen des Zimmermanns verrät, wenn er ohne Holz keinen der unentbehrlichen Gegenstände fertigen kann. Nach dieser Annahme hätte also Gott nichts fertigen können, wenn keine Materie vorgelegen hätte. Wie könnte man ihn dann noch Schöpfer und Baumeister nennen, wenn er einem dritten, der Materie, seine schöpferische Macht verdankt? In diesem Falle wird aber nach ihrer Ansicht Gott nur mehr ein Handwerker sein, nicht mehr eigentlich Schöpfer, wenn er ja nur den vorliegenden Stoff bearbeitet, nicht aber auch dem Stoff das Dasein gibt. Er kann überhaupt nicht Schöpfer genannt werden, wenn er nicht auch den Stoff schafft, aus dem das Geschaffene geworden ist, Die Häretiker träumen sich freilich einen anderen Weltschöpfer als den Vater unseres Herrn Jesu Christi und verraten in ihren Worten eine arge Verblendung. Wenn der Herr zu den Juden sagt: „Habt ihr nicht gelesen, daß Gott im Anfange sie als Mann und Weib schuf und sprach: Deshalb wird der Mann Vater und Mutter verlassen und seinem Weibe anhangen, und sie werden zwei in einem Fleische sein?“, und hernach mit einem Hinweis auf den Schöpfer: „Was Gott verbunden hat, soll der Mensch nicht trennen“, warum reden sie denn so, als hätte die Schöpfung mit dem Vater nichts zu tun? Und wenn Johannes zusammenfassend sagt: „Alles ist durch ihn geworden, und ohne ihn ward nichts“, wie könnte es denn neben dem Vater Christi einen anderen Schöpfer geben?</p>
      <h2>3</h2><p>So faseln diese Leute. Die göttliche Lehre aber und der christliche Glaube verurteilen solch törichtes Gerede als Gottlosigkeit. Sie sagen uns, daß die Dinge nicht von selbst entstanden sind, da sie ja unter einer Vorsehung stehen, noch auch aus einem bereits vorhandenen Stoff, weil ja Gott nicht schwach, daß vielmehr Gott durch seinen Logos alle Dinge aus dem reinen Nichts ins Dasein gerufen habe, wie es bei Moses heißt: „Im Anfang schuf Gott Himmel und Erde“, und im sehr nützlichen Buch vom Hirten: „Allererst glaube, daß nur einer Gott ist, der alles erschaffen und angeordnet und aus dem Nichts ins Dasein gerufen hat“. Dasselbe lehrt Paulus mit den Worten: „Im Glauben erkennen wir, daß die Welten durch das Wort Gottes geschaffen worden sind, so daß also nicht das Sichtbare aus der Erscheinungswelt hervorgegangen ist“. Denn Gott ist gut, oder vielmehr er ist die Quelle der Güte. Den Guten aber kann keinerlei Neid befallen, weshalb er niemand das Dasein vergönnte und alles aus dem Nichts geschaffen hat durch seinen eigenen Logos, unseren Herrn Jesum Christum. Unter den irdischen Kreaturen aber erregte vor allen das Menschengeschlecht sein Mitleid, und weil er sah, daß es nach dem Gesetze seines eigenen Werdens außerstande wäre, immerdar fortzubestehen, gewährte er ihnen einen Vorzug und schuf die Menschen nicht einfach wie die ganze vernunftlose Lebewelt auf der Erde, sondern er machte sie nach seinem Bilde und teilte ihnen von der Kraft seines eigenen Logos mit, damit sie gleichsam einen Schatten vom Logos hätten und so, vernünftig geworden, in seligem Zustand verbleiben könnten - im Besitze des wahren und wahrhaft heiligen Paradieseslebens. Da er ferner die doppelte Wahlfreiheit der Menschen kannte, so traf er Vorsorge und suchte ihnen durch Gesetz und Ort die ihnen gewährte Gnade zu sichern: Er führte sie in sein Paradies ein und gab ihnen ein Gebot, damit sie, im Falle, daß sie die Gnade bewahrten und gut blieben, zu der Verheißung ihrer himmlischen Unsterblichkeit hin auch im Paradiese ein Leben ohne Kummer, Schmerzen und Sorgen hätten, im Falle, daß sie aber das Gebot überträten und nach ihrer Abkehr von Gott schlecht würden, zur Einsicht kommen sollten, daß sie der natürlichen Verwesung im Tode unterworfen wären und nicht mehr im Paradiese leben, sondern nunmehr aus ihm verbannt und in Tod und Verwesung verbleiben würden. Dies verkündet ganz offen auch die göttliche Schrift, die in der Person Gottes also redet: „Von allen Bäumen des Gartens magst du essen, aber vom Baume der Erkenntnis des Guten und Bösen sollt ihr nicht essen. Am Tage, da ihr davon esset, sollt ihr des Todes sterben“. „Ihr werdet des Todes sterben“, was soll das anderes bedeuten, als nicht nur sterben, sondern auch in der Verwesung des Todes verbleiben?</p>
      <h2>4</h2><p>Vielleicht wunderst du dich etwas, daß wir, die wir uns doch vorgenommen haben, von der Menschwerdung des Logos zu reden, jetzt vom Ursprung der Menschen handeln. Doch auch das hängt mit dem Zweck unserer Abhandlung zusammen. Wenn wir von der Erscheinung des Heilands unter uns reden wollen, so müssen wir auch vom Ursprung der Menschen reden, um zu erkennen, daß unsere Schuld Anlaß zu seiner Herabkunft gegeben und unsere Sünde die Menschenliebe des Logos herausgefordert hat, so daß der Herr zu uns kam und unter den Menschen erschien. Wir sind die Ursache seiner Verkörperung (ἐνσωματώσεως). Und um unseres Heiles willen offenbarte er seine Menschenliebe, wollte in einem menschlichen Leibe geboren werden und erscheinen.</p><p>So also hat Gott den Menschen erschaffen und ihn in der Unsterblichkeit belassen wollen. Die Menschen jedoch würdigten den geistigen Verkehr mit Gott wenig, kehrten sich davon ab, erdachten und ersannen sich die Bosheit, wie im ersten Teil ausgeführt wurde, und verfielen dem angedrohten Todesurteil. Jetzt sollten sie auch nicht mehr so bleiben, wie sie geschaffen worden sind, vielmehr sanken sie entsprechend ihrer Denkart immer tiefer, und der Tod wurde ihr Gewaltherr. Denn die Übertretung des Gebotes warf sie auf ihren natürlichen Urstand zurück, so daß sie, wie aus dem Nichts geworden, so auch mit Recht nach Ablauf der Zeit den Verlust ihrer Existenz zu gewärtigen hatten. Denn wenn es in ihrer Natur lag, einmal nicht zu sein, und sie erst durch das Eingreifen und die Menschenliebe des Logos ins Dasein gerufen wurden, so ergab sich als natürliche Folge, daß die Menschen mit dem Verlust ihrer Gottesvorstellung und mit ihrer Abkehr zum Nichtseienden - nichtseiend ist das Böse, seiend das Gute, weil ja vom Seienden Gott ausgegangen - auch ihrer ewigen Existenz verlustig gingen, das heißt aber, daß sie der Auflösung anheimfielen und im Tod und in der Verwesung verblieben. Tatsächlich ist ja der Mensch von Natur aus sterblich, da er aus dem Nichts entstanden ist. Doch dank seiner Ähnlichkeit mit dem Seienden hätte er in dem Falle, daß er sie mit einer richtigen Herzensstellung zu ihm bewahrt hätte, die naturgemäße Auflösung von sich ferngehalten und wäre unverweslich geblieben, wie ja die Weisheit sagt: „Die Beobachtung der Gebote ist die Sicherung der Unverweslichkeit“. Wenn aber unverweslich, dann hätte er fortan wie Gott gelebt, wie dies auch irgendwo die göttliche Schrift zum Ausdruck bringt, wenn sie sagt: „Ich habe gesagt: Götter seid ihr und Söhne des Höchsten allzumal. Doch Menschen gleich sterbet ihr dahin und fallet wie einer der Fürsten“.</p>
      <h2>5</h2><p>Gott hat uns ja nicht nur aus dem Nichts erschaffen, sondern durch die Gnade des Logos uns auch ein gottgleiches Leben verliehen. Da aber die Menschen das Ewige von sich wiesen und auf Eingebung des Teufels sich dem Vergänglichen zuwandten, so haben sie selber damit ihre Vergänglichkeit im Tode verschuldet; sie waren ja wohl, wie vorhin bemerkt, von Natur aus sterblich, wären aber diesem natürlichen Los dank ihrer Teilnahme am Logos entronnen, wenn sie gut geblieben wären. Denn um des Logos willen, der mit ihnen war, hätte die naturgemäße Vernichtung sie nicht betroffen, wie auch die Weisheit sagt: „Gott hat den Menschen zur Unverweslichkeit erschaffen und als Bild seiner eigenen Ewigkeit; aber durch den Neid des Teufels kam der Tod in die Welt“. Wie aber das geschehen war, begann das Sterben der Menschen; die Vergänglichkeit gewann nunmehr und entfaltete um so stärkere Macht über das ganze Geschlecht denn der natürliche Urstand, als sie auch die Drohung Gottes wegen der Übertretung des Gebotes ihnen gegenüber voraus hatte. Denn auch bei ihren Verfehlungen blieben die Menschen nicht bei bestimmten Grenzen stehen, sondern sie kamen nach und nach immer weiter und haben schließlich kein Maß mehr gekannt. Zuerst wurden sie zu Erfindern der Bosheit und beschworen gegen sich herauf Tod und Verderben. Dann verfielen sie in Ungerechtigkeit und überboten sich in aller Gesetzwidrigkeit, blieben nicht bei <strong>einer </strong>Schlechtigkeit stehen, sondern ersannen immer neue zu neuen und sind so im Sündigen unersättlich geworden. Ehebruch und Diebstahl waren allenthalben an der Tagesordnung; von Raub- und Mordtaten voll war die ganze Welt. Kein Gesetz wußte der Verderbnis und Ungerechtigkeit zu wehren. Alle Missetaten wurden vereinzelt und im Bunde von allen verübt. Staaten führten gegen Staaten Krieg; Völker erhoben sich gegen Völker; der ganze Erdkreis war durch Zwietracht und Kampf gespalten, indes ein jeder den anderen im Sündigen zu überbieten suchte. Nicht einmal von widernatürlichen Lastern hielten sie sich frei, sondern wie der Apostel, der Zeuge Christi, sagte: „Ihre Weiber verkehrten den natürlichen Umgang in den widernatürlichen; ebenso gaben auch die Männer den natürlichen Umgang mit dem Weibe auf und entbrannten in ihren Begierden zueinander, indem Männer mit Männern Schändliches trieben und den verdienten Sold ihrer Verirrung an sich selbst empfingen“.</p>
      <h2>6</h2><p>Da infolgedessen der Tod immer mächtiger wurde und das Verderben über der Menschheit lagerte, so ging das Menschengeschlecht dem Untergang entgegen, der vernünftige und nach dem Bilde Gottes erschaffene Mensch mußte verschwinden und das von Gott geschaffene Werk verloren gehen. Denn, wie vorhin gesagt, der Tod gewann jetzt über uns gesetzliche Gewalt, und es war unmöglich, dem Gesetze zu entrinnen, weil es von Gott wegen der Sünde erlassen worden war.</p><p>In der tatsächlichen Verwirklichung dessen lag aber etwas Ungereimtes und Unwürdiges zugleich. Ungereimt wäre es, Gottes Rede Lügen zu strafen, wenn nämlich der Mensch trotz der göttlichen Verfügung, er müsse im Falle der Übertretung des Gebotes des Todes sterben, nach der Sünde nicht starb, vielmehr seine Verfügung aufgehoben wurde. Dann war ja Gott nicht wahrhaftig, wenn der Mensch nicht starb trotz seines Wortes, daß wir sterben würden. Anderseits war es unziemlich, wenn die einmal erschaffenen vernünftigen und seines Logos teilhaftig gewordenen Wesen zugrunde gingen und auf dem Weg der Vernichtung wieder ins Nichts zurücksanken. Es reimte sich doch nicht mit der Güte Gottes zusammen, wenn die von ihm geschaffenen Wesen wegen des vom Teufel an den Menschen verübten Truges umkamen. Zudem war es ganz und gar unziemlich, daß das Kunstwerk Gottes in den Menschen durch deren Sorglosigkeit oder durch den Dämonentrug verloren ging. Da also die vernünftigen Wesen dem Verderben und solch vorzügliche Werke dem Untergang geweiht waren, was mußte da Gott in seiner Güte tun? Etwa zulassen, daß das Verderben gegen sie weiter seine Macht entfalte und der Tod über sie herrsche? Wozu dann auch ihre Schöpfung im Anfange? Sie wären dann besser nicht entstanden, als nach ihrer Entstehung der Verwahrlosung und dem Untergang anheimgefallen. Denn solche Vernachlässigung, wie die Überantwortung seines eigenen fertiggestellten Werkes an die Zerstörung, verrät deutlicher die Schwäche, nicht die Güte Gottes, als wenn er den Menschen von Anfang an nicht erschaffen hätte. Denn wenn er ihn nicht erschuf, dachte niemand an eine Schwäche. Erschuf er ihn aber und rief er ihn ins Dasein, dann war es höchst ungereimt, wenn die Werke dem Untergang verfielen - und dies gar unter den Augen des Schöpfers. So durfte er also die Menschen nicht dem Verderben überantworten, weil das unziemlich und der Güte Gottes unwürdig gewesen wäre.</p>
      <h2>7</h2><p>Doch so gut sich das gehörte, so sehr steht anderseits dem entgegen, was die Ehre Gottes erforderte, daß nämlich Gott in der Aufstellung des Todesgesetzes wahrhaftig erschien. Denn es wäre widersinnig gewesen, wenn Gott, der Vater der Wahrheit, unseres Nutzens und unserer Erhaltung wegen als Lügner sich erwiesen hätte. Was mußte also auch in dieser Beziehung geschehen, bzw. was mußte Gott tun? Von den Menschen Reue ob ihrer Sünde verlangen? Dies hätte man ja Gottes würdig finden können und sagen, daß sie, wie sie infolge der Sünde dem Verderben anheimgefallen sind, so auf ihre Reue hin wieder zur Unverweslichkeit gelangen sollten. Doch die Reue hätte das, was der Ehre Gottes entsprach, nicht gewahrt - denn er wäre wieder nicht wahrhaftig geblieben, wenn die Menschen nicht im Tod bezwungen worden wären -, noch hebt auch anderseits die Reue den natürlichen Zustand auf, sondern setzt nur dem Sündigen ein Ende. Wenn also nur Sünde, und nicht auch Vernichtung als deren Folge dagewesen wäre, dann wäre es mit der Reue gut gewesen. Wenn aber die Menschen einmal nach geschehener Sünde dem natürlichen Tode preisgegeben und der Gnade ihrer Gottebenbildlichkeit verlustig gegangen waren, was mußte da geschehen? Oder wessen Hilfe war dann zu solcher Gnade und Wiederherstellung nötig, wenn nicht die des Logos Gottes, der auch im Anfange alles aus nichts gemacht hat? Ihm stand es ja wieder zu, sowohl das Verwesliche zur Unverweslichkeit zurückzuführen, als auch für alle die Ehrenschuld beim Vater einzulösen. Denn als Logos des Vaters und über alle erhaben, war er eben damit allein nur imstande, alles zu erneuern und für alle zu leiden, und fähig, für alle beim Vater Vermittler zu sein.</p>
      <h2>8</h2><p>Deshalb also kommt der körperlose, unverwesliche und immaterielle Logos Gottes in unsere Heimat, obschon er auch vorher uns nicht ferne stand. Denn kein Teil der Schöpfung ist von ihm leer gelassen; vielmehr hat er alles in allem erfüllt, indes er selbst bei seinem Vater blieb. Aber jetzt erscheint er und läßt sich zu uns herab aus Liebe zu uns Menschen, und zwar in sichtbarer Gestalt. Er sah das vernünftige Geschlecht zugrunde gehen und den Tod mit seiner Verwesung herrschen über die Menschen; er sah, wie auch die Strafandrohung für die Sünde uns im Banne des Verderbens festhalte und eine Befreiung daraus vor der Erfüllung des Gesetzes unangebracht wäre; er sah auch das Unziemliche, das im Falle des Unterganges der Wesen, deren Schöpfer er selber war, gelegen wäre; er sah auch die überflutende Bosheit der Menschen und wie sie diese nachgerade bis zur Unerträglichkeit zu ihrem eigenen Verderben steigerten; er sah endlich alle Menschen als die Beute des Todes. Deshalb erbarmte er sich unseres Geschlechtes, hatte Mitleid mit unserer Schwachheit, ließ sich herab zu unserer Vergänglichkeit, duldete die Herrschaft des Todes nicht, und um die Schöpfung gegen den Tod zu schützen und das Werk seines Vaters an den Menschen nicht vergeblich sein zu lassen, nahm er einen Leib an, und zwar keinen anderen als den unsrigen. Denn er wollte nicht einfach in einem Leibe Wohnung nehmen, und er wollte nicht bloß äußerlich erscheinen. Hätte er nur das wollen, so hätte er in einem anderen besseren Leibe als Gott erscheinen können. Aber nein! Er nimmt unseren Leib an, und zwar nicht auf einem beliebigen Wege, sondern von einer unbefleckten, makellosen und mit keinem Mann bekannten Jungfrau einen reinen, vom Verkehr mit Männern wahrhaft unberührten Leib. In seiner Macht und als Schöpfer aller Dinge bereitet er sich in der Jungfrau den Leib zum Tempel und eignet sich ihn als Werkzeug an, gibt sich in ihm zu erkennen und wohnt darin. Und so nahm er einen Leib an, dem unsrigen gleich, überantwortete ihn, da alle unter der Macht des Todes standen, anstatt aller dem Tode und brachte ihn dem Vater dar. Und das tat er aus Liebe zu den Menschen, damit alle in ihm sterben und so das Gesetz von der Verwesung der Menschen aufgehoben würde, da ja seine Macht am Leibe des Herrn sich erschöpft hat und bei den gleichartigen Menschen keinen Zugang mehr finden kann. Auch wollte er die Menschen, die in die Verweslichkeit zurückgefallen waren, wieder zur Unverweslichkeit erheben und sie vom Tode zu neuem Leben erwecken, indem er durch die Aneignung des Leibes und die Gnade der Auferstehung den Tod in ihnen wie eine Stoppel im Feuer vernichtete.</p>
      <h2>9</h2><p>Der Logos erkannte nämlich, daß das Verderben unter den Menschen nicht anders behoben werden könnte als durch seinen unbedingten Tod. Nun aber konnte der Logos, weil unsterblich und Sohn des Vaters, nicht sterben. Deshalb nimmt er einen sterbensfähigen Leib an, damit dieser durch seine Teilnahme am Logos, dem alle unterstehen, zum Tod für alle geeignet würde, dank dem einwohnenden Logos unvergänglich bliebe und nunmehr für alle das Verderben in der Gnade der Auferstehung ein Ende fände. Daher hat er den Leib, den er angenommen, als eine Weihegabe und als ganz makelloses Schlachtopfer in den Tod gegeben und verscheuchte alsobald von allen seinesgleichen den Tod durch das stellvertretende Opfer. Denn weil erhaben über alle, hat natürlich der Logos Gottes mit der Hingabe seines Tempels und der leiblichen Werkstätte ein Entgelt für das Leben aller entrichtet und die Schuld in seinem Tod bezahlt. Und so bekleidete der unverwesliche Sohn Gottes, durch den gleichen Leib mit allen in Gemeinschaft getreten, natürlich auch alle mit der Unverweslichkeit - in der Verheißung der Auferstehung. Denn auch die Auflösung im Tode hat keine Macht mehr über die Menschen wegen des Logos, der unter ihnen in dem einen Leib gewohnt hat. Wie wenn ein mächtiger König in irgendeine große Stadt kommt und darin auch nur in einem Hause Wohnung nimmt, sicher eine solche Stadt aller Ehre gewürdigt wird und kein Feind oder Räuber sie mehr anfällt und unterjocht, wie ihr vielmehr wegen des Königs, der darin auch nur in einem Hause wohnt, alle Aufmerksamkeit geschenkt wird, so war es auch der Fall beim König aller Dinge. Denn damit, daß er in unsere Heimat kam und in einem unserem Leibe gleichen Körper wohnte, hat jede feindliche Nachstellung gegen die Menschen ein Ende genommen. Auch das Verderben des Todes, das ehedem unter ihnen wütete, war vorüber. Das Menschengeschlecht wäre verloren gewesen, wenn nicht der Herr und Heiland aller, der Sohn Gottes, gekommen wäre, um dem Tode ein Ende zu machen.</p>
      <h2>10</h2><p>Vor allem aber geziemte dies wahrhaft große Werk der Güte Gottes. Denn wenn schon ein König ein Haus oder eine Stadt, die er erbaut hat und dann wegen der Gleichgültigkeit der Einwohner von Räubern überfallen sieht, durchaus nicht ihrem Schicksal überläßt, sondern als sein Werk verteidigt und rettet, wobei er nicht auf die Lässigkeit der Bewohner, sondern auf das sieht, was sich für ihn ziemt, so hat noch weit weniger der göttliche Logos des allgütigen Vaters das von ihm erschaffene Menschengeschlecht, das auf dem Weg zum Verderben war, seinem Schicksal überlassen. Vielmehr hat er den verschuldeten Tod mit der Opferung seines eigenen Lebens hinweggenommen, hat die Nachlässigkeit der Menschen durch seine Lehre wieder gut gemacht und die ganze Lage der Menschen durch seine Macht wieder in die rechte Ordnung gebracht. Das kann man auch beglaubigt hören von den Gottesmännern, die um die Person des Heilandes waren, wenn man in ihren Schriften die Worte liest: „Die Liebe Christi drängt uns, indem wir also urteilen: Ist einer für alle gestorben, so sind füglich alle gestorben. Nun aber ist er für alle gestorben, damit wir nicht mehr uns leben, sondern dem, der für uns gestorben und von den Toten auferstanden ist, unserem Herrn Jesus Christus“. Und wieder: „Doch sehen wir den kurz unter die Engel Erniedrigten, Jesum, mit Herrlichkeit und Ehre gekrönt wegen seines Todesleidens, womit er durch die Gnade Gottes für einen jeden den Tod kosten wollte“. Dann gibt er auch den Grund an, weshalb kein anderer als Gott der Logos selbst Mensch werden mußte, wenn er sagt: „Denn es ziemte sich für ihn, um dessentwillen alles und durch den alles ist, viele Kinder zur Herrlichkeit zu führen und deshalb den Urheber ihres Heils durch Leiden zu vollenden“. Mit diesen Worten gibt er ja zu verstehen, daß es keinem anderen zukam, die Menschen aus dem verhängten Verderben zu erretten als Gott dem Logos, der sie auch im Anfang geschaffen hat. Daß sodann der Logos einen Leib angenommen, um ihn als Opfergabe für die ihm ähnlichen Leiber darzubringen, auch das deuten sie an mit den Worten: „Da also die Kinder Fleisch und Blut gemeinsam haben, so nahm er in ähnlicher Weise auch daran teil, damit er durch den Tod den überwinde, der die Gewalt des Todes hatte, nämlich den Teufel, und die erlöste, die im Banne der Todesfurcht ihr Leben lang unter dem Joch der Knechtschaft standen“. Denn mit der Opferung seines eigenen Lebens hat er dem Gesetz wider uns ein Ende gesetzt und uns einen neuen Anfang des Lebens gegründet, indem er uns die Hoffnung der Auferstehung gab. Weil ja der Tod durch Menschen(schuld) über die Menschen die Macht erhalten hatte, deshalb ist wieder durch die Menschwerdung Gottes des Logos des Todes Macht gebrochen worden und die Auferstehung des Lebens eingetreten. Sagt ja doch der Christusträger: „Denn wie durch einen Menschen der Tod, so durch einen Menschen die Auferstehung von den Toten. Wie in Adam alle sterben, so werden in Christus alle lebendig gemacht werden usw.“. Jetzt sterben wir nicht mehr, um gerichtet zu werden, sondern mit der Bestimmung zur Auferstehung harren wir auf die gemeinsame Auferstehung aller, die Gott zu seiner Zeit schauen lassen wird, er, der sie auch bewerkstelligt und gewährt hat. Das also ist die erste Ursache der Menschwerdung des Erlösers. Doch auch aus folgendem mag man erkennen, daß seine gnädige Ankunft unter uns wohlbegründet war.</p>
      <h2>11</h2><p>Als Gott, der über alles die Macht hat, das Menschengeschlecht durch seinen eigenen Logos erschuf, da wußte er alsobald auch um die Ohnmacht seiner Natur und daß diese nicht imstande wäre, von sich aus den Schöpfer zu erkennen noch überhaupt von Gott eine Erkenntnis zu gewinnen, da er ja unerschaffen, sie aber aus dem Nichts hervorgegangen ist, er unkörperlich, die Menschen aber irgendwo hienieden mit einem Leib gebildet worden sind und überhaupt den geschöpflichen Wesen ein großer Mangel anhaftet, um den Schöpfer zu begreifen und zu erkennen. So erbarmte er sich wieder in seiner Güte des Menschengeschlechtes und wollte den Menschen nicht die Erkenntnis seiner vorenthalten, damit sie nicht ein Dasein führten, ohne einen Gewinn davon zu haben. Was haben denn die Geschöpfe für einen Gewinn davon, wenn sie ihren Schöpfer nicht erkennen? Oder wie wären sie vernünftig, wenn sie den Logos des Vaters nicht erkannten, in dem sie doch entstanden sind? Denn zwischen ihnen und den vernunftlosen Wesen wäre gar kein Unterschied, wenn sie weiter nichts als irdische Dinge wahrnähmen. Wozu hätte sie Gott auch erschaffen, wenn er von ihnen nicht erkannt sein wollte? Eben um dieses zu verhüten, teilt er ihnen in seiner Güte sein eigen Bild, unseren Herrn Jesum Christum, mit und macht sie seinem Bild und seiner Ähnlichkeit gleichförmig, damit sie durch diese das Abbild erkannten, nämlich den Logos des Vaters, und durch ihn eine Vorstellung vom Vater gewinnen könnten und in der Erkenntnis des Schöpfers ein glückliches und wahrhaft seliges Leben führten. Doch die also angebotene Gnade mißachteten ihrerseits die Menschen im Unverstand und kamen so weit von Gott ab und befleckten so sehr ihre Seele, daß sie nicht nur die Vorstellung von Gott vergaßen, sondern auch andere Dinge um Dinge sich einbildeten. Götzenbilder schufen sie sich an Stelle der Wahrheit, das Nichtseiende stellten sie höher als den wahrhaftigen Gott und huldigten der Schöpfung anstatt dem Schöpfer. Und das Schlimmste war noch, daß sie auf Holzstücke und Steine, auf alle möglichen Stoffe und auf Menschen die Gott schuldige Ehre übertrugen und noch mehr dergleichen sich leisteten, wie bereits früher gesagt worden. Ja, so gottlos wurden sie, daß sie nunmehr gar Dämonen verehrten und als Götter ansprachen und deren Wünsche erfüllten. Opfer von vernunftlosen Wesen und Menschenopfer brachten sie ihnen, wie früher erwähnt worden, als schuldigen Tribut dar und ließen sich durch deren Lockungen immer mehr in Fesseln schlagen. Deshalb wurden bei ihnen auch magische Künste gelehrt, und Orakelsprüche da und dort täuschten die Menschen, und alle schrieben die Ursachen ihrer Geburt und ihres Lebens den Sternen zu und allen Erscheinungen am Himmel, ohne an etwas anderes zu denken als an das Sichtbare. Überhaupt war alles voll Gottlosigkeit und Sünde, und nur der eine Gott und sein Logos wurden nicht erkannt, obschon er sich den Menschen nicht unbezeugt ließ und ihnen auch nicht nur eine primitive Erkenntnis seiner gab, sondern sie ihnen auch mannigfach und in vielen Offenbarungen erläuterte.</p>
      <h2>12</h2><p>Genügt hätte ja schon die Gnade unserer Ebenbildlichkeit, um Gott den Logos und durch ihn den Vater zu erkennen. Da aber Gott die Ohnmacht der Menschen kannte, traf er schon zum voraus auch für deren Gleichgültigkeit Vorsorge, damit sie im Falle ihrer Lässigkeit, von sich aus Gott zu erkennen, Gelegenheit hätten, aus den Werken der Schöpfung den Schöpfer zu erkennen. Da aber die Interesselosigkeit der Menschen immer mehr zu Schlimmerem ausartete, so hatte Gott auch für diese ihre Schwäche vorgesehen und ihnen ein Gesetz gegeben und bekannte Propheten, damit sie bei ihrer Lethargie, zum Himmel aufzublicken und den Schöpfer kennen zu lernen, aus ihrer nächsten Umgebung sich die Belehrung holen könnten. Denn Menschen können leichter von ihresgleichen über höhere Probleme Aufschluß erhalten. So war es ihnen wohl möglich, im Aufblick zur Größe des Himmels und in der Betrachtung der in der Schöpfung waltenden Harmonie ihren Regenten, den Logos des Vaters, zu erkennen, der mit seiner allesumfassenden Fürsorge allen den Vater offenbart und eben deshalb allem die Bewegung gibt, damit durch ihn alle zur Erkenntnis Gottes gelangten. War aber das den Menschen beschwerlich, so konnten sie sich doch an die Heiligen wenden und durch sie Gott als den Schöpfer der Welt und den Vater Christi kennen lernen und einsehen, daß ihr Götzenkult Atheismus und aller Gottlosigkeit voll ist. Sie konnten aber dann auch bei ihrer Kenntnis des Gesetzes von jeglicher Gesetzwidrigkeit ablassen und ein tugendhaftes Leben führen. Denn nicht allein der Juden wegen war das Gesetz da, und nicht bloß ihretwegen wurden die Propheten gesandt. Sie wurden wohl zu den Juden gesandt und von den Juden verfolgt, waren aber für den ganzen Erdkreis eine heilige Lehranstalt für Theologie und Moral. So groß also die Güte und Menschenliebe Gottes war, so haben die Menschen gleichwohl im Banne der augenblicklichen Lüste und der Vorspiegelungen und Trugbilder der Dämonen sich nicht zur Wahrheit bekannt, sondern sich neuen Sünden und Missetaten überantwortet, so daß sie nicht mehr vernünftig erschienen, sondern - nach ihrem Wandel zu schließen - unvernünftig waren.</p>
      <h2>13</h2><p>Wenn nun die Menschen so den vernunftlosen Tieren gleichgeworden waren, wenn der teuflische Trug überallhin seinen Schatten geworfen und die Erkenntnis des wahren Gottes verfinstert hatte, was hätte da Gott tun sollen? Hätte er zu solch schrecklichem Zustand schweigen, die Menschen der Verführungskunst der Dämonen überlassen und ihnen die Erkenntnis Gottes entziehen sollen? Wozu wäre aber dann der Mensch im Anfange nach dem Bilde Gottes erschaffen worden? Er hätte ja dann einfach als unvernünftiges Geschöpf erschaffen werden sollen, oder aber, wenn vernünftig geschaffen, durfte er nicht leben wie das unvernünftige Tier. Was hätte es ihm überhaupt genützt, im Anfang eine Vorstellung von Gott gehabt zu haben? Wenn er nämlich auch jetzt einer solchen nicht gewürdigt werden kann, dann hätte sie ihm auch im Anfang nicht gegeben werden sollen. Was aber würde es Gott dem Schöpfer an Nutzen oder Ehre eintragen, wenn die von ihm erschaffenen Menschen nicht ihn anbeten, sondern andere als ihre Schöpfer wähnen? Gott scheint dann für andere, nicht für sich die Menschen erschaffen zu haben. Sodann läßt auch ein König, wenn schon nur ein Mensch, die von ihm gegründeten Städte nicht in fremde Hand und Herrschaft kommen noch auch zu anderen übergehen, vielmehr gibt er ihnen brieflich Mahnungen, nicht selten stellt er sie auch durch Freunde zu und erscheint, wenn nötig, persönlich, um sie dann durch seine Gegenwart anders zu stimmen, damit sie ja nicht unter die Herrschaft anderer geraten und so sein Werk vereitelt würde. Wird nicht noch viel mehr Gott seine Geschöpfe davor bewahren, daß sie nicht von ihm abirren und nichtseienden Dingen dienen, zumal da eine solche Verirrung ihr Verderben und ihr Ende wäre? Es sollte aber das, was einmal mit dem Bilde Gottes in Gemeinschaft stand, nicht verloren gehen. Was hatte nun Gott zu tun? Oder was anders hatte zu geschehen, als wieder eine Erneuerung nach dem Ebenbilde vorzunehmen, damit die Menschen ihn darin wieder erkennen könnten? Wie hätte aber dies geschehen können, wenn nicht das Ebenbild Gottes selbst, unser Heiland Jesus Christus, erschien? Durch Menschen war dies unmöglich, da ja auch sie nach dem Bilde geschaffen sind, aber auch nicht durch Engel, - sie sind ja keine Ebenbilder. Deshalb kam der Logos persönlich zu uns, um als Bild des Vaters den ebenbildlich erschaffenen Menschen wiederherzustellen. Dies hätte aber wieder nicht anders vor sich gehen können, wenn nicht Tod und Verwesung beseitigt wurden. Daher nahm er natürlich einen sterblichen Leib an, damit nunmehr der Tod in ihm vernichtet werden könnte und die ebenbildlich erschaffenen Menschen wieder erneuert würden. So war also niemand anders dieser Aufgabe gewachsen als nur das Bild des Vaters.</p>
      <h2>14</h2><p>Wenn z. B. eine auf Holz gemalte Figur durch den Schmutz von außen unkenntlich geworden ist, so muß derjenige, der in der Figur dargestellt ist, wieder zugegen sein, wenn das Bild in demselben Holz erneuert werden soll; wegen des Bildes wird nämlich eben das Material selbst, auf dem gemalt worden, nicht weggeworfen, vielmehr auf ihm die Figur nachgezeichnet. Ebenso hat auch der allheilige Sohn des Vaters als Bild des Vaters an unseren Stätten sich eingefunden, um den nach ihm erschaffenen Menschen zu erneuern und ihn, der verloren war, durch die Sündennachlassung wieder zu finden, wie er ja auch selbst in den Evangelien sagt: „Ich bin gekommen, zu suchen und zu retten, was verloren war“. Daher sagte er auch zu den Juden: „Wenn jemand nicht wiedergeboren wird“. Er verstand das nicht von der Geburt aus einem Weibe, wie jene vermuteten, sondern meinte die Seele, die in der Verähnlichung mit ihm eine Wiedergeburt und Erneuerung erfährt. Wenn nun der Götzenwahn und der Atheismus den Erdkreis im Banne hielt und die Erkenntnis Gottes verschwunden war, wer hätte da die Welt über den Vater belehren sollen? Ein Mensch - könnte etwa einer sagen. Doch Menschen waren nicht imstande, den ganzen Erdkreis zu durchwandern, noch hatten sie von Natur die Kraft zu solchem Laufe. Auch hätten sie nicht mit der nötigen Autorität für ihre Lehre einstehen können, noch auch hätten sie von sich aus dem Trug- und Gaukelspiel der Dämonen zu widerstehen vermocht. Wenn doch alle vom teuflischen Trug und Götzenwahn beschlagnahmt und verwirrt waren, - wie hätte da ein Mensch Herz und Sinn der Menschen umstimmen können, wo sie doch diese nicht einmal sehen konnten? Was man aber nicht sieht, wie vermag man das umzubilden? Doch vielleicht möchte einer sagen, die Schöpfung hätte dazu genügt. Doch wenn die Schöpfung genügt hätte, wären keine solche Übel eingetreten. Die Schöpfung war ja wirklich da; und doch blieben die Menschen in demselben Irrwahn über Gott befangen. Wer also hätte helfen können, außer dem Logos Gottes, der Weg und Sinn durchschaut, allen Dingen in der Schöpfung Bewegung gibt und durch sie den Vater offenbart. Denn dem, der durch seine Vorsehung und Anordnung aller Dinge über den Vater Aufschluß gibt, dem kam es auch zu, eben diese Lehre wiederaufzufrischen. Wie hätte nun dies geschehen sollen? Vielleicht möchte einer antworten, daß es eben durch die nämlichen Mittel möglich gewesen wäre, so daß also wieder durch die Werke der Schöpfung der Aufschluß über den Vater erfolgt wäre. Aber das hätte keine Sicherheit mehr geboten. Durchaus nicht! Denn eben das haben ja zuvor die Menschen unbeachtet gelassen und ihr Auge nicht mehr aufwärts, sondern abwärts gewandt. Deshalb kommt er, der den Menschen nützen wollte - nämlich durch die Werke des Leibes -, natürlich wie ein Mensch zu uns, nimmt einen Leib an, der dem jener gleich ist und von unten stammt, damit die, welche ihn nicht aus seiner allumfassenden Vorsehung und Herrschaft erkennen wollten, wenigstens aus den Werken seines Leibes den im Leibe befindlichen Logos Gottes erkannten und durch ihn den Vater.</p>
      <h2>15</h2><p>Wie nämlich ein guter Lehrer, dem etwas an seinen Schülern liegt, für die, die dem höheren Lehrgang nicht mit Nutzen folgen können, sicher zu einem leichter faßlichen sich herabläßt und sie so unterrichtet, so hält es auch der Logos Gottes, wie auch Paulus sagt: “Weil die Welt mit ihrer Weisheit Gott in seiner Weisheit nicht erkannte, hat es Gott gefallen, durch die Torheit der Predigt diejenigen selig zu machen, welche glauben”. Da sich nämlich die Menschen von der Betrachtung Gottes abgekehrt hatten und, wie im Abgrund versunken, ihre Augen abwärts kehrten und Gott in der Natur und den sinnlichen Dingen aufsuchten und (schließlich) sterbliche Menschen und Dämonen als Götter sich vorstellten, deshalb nimmt der menschenfreundliche und allen gemeinsame Erlöser, der Logos Gottes, einen Leib an und verkehrt wie ein Mensch unter Menschen, nimmt die Empfindungen aller Menschen an, damit die, die Gott in körperlichen Gestalten wähnen, aus den Werken, die der Herr durch die Werke des Leibes vollbringt, die Wahrheit einsehen und durch ihn den Vater erkennen möchten. Denn da sie als Menschen auch nur an Menschliches dachten, so sahen sie sich von all dem angezogen, worauf ihre Sinne fielen, und von allen Seiten über die Wahrheit belehrt. Mochten sie die Schöpfung anstaunen, sie sahen in ihr ein Bekenntnis an Christus den Herrn. Mochten ihre Gedanken für Menschen eingenommen sein, so daß sie diese gar für Götter hielten, so erwies sich aus den Werken des Heilandes, verglichen mit denen jener, nur einer unter den Menschen als Sohn Gottes, der Heiland, da ja jene nichts Ähnliches aufzuweisen haben, was seitens des Logos Gottes geschehen ist. Waren sie aber den Dämonen zugetan, so mußten sie doch, wenn sie diese vor dem Herrn fliehen sahen, zur Erkenntnis kommen, daß dieser allein der Logos Gottes ist, und nicht auch die Dämonen Götter sind. Stand aber gar ihr Geist im Banne des Totenkultes, so daß sie die Heroen und die bei den Dichtern vorkommenden Götter verehrten, so mußten sie angesichts der Auferstehung des Heilandes zugeben, daß jene Truggestalten sind und der wahre Herr allein der Logos des Vaters ist, da er auch der Herr ist über den Tod. Darum ward er auch geboren, erschien als Mensch, starb, stand wieder auf, und mit seinen eigenen Werken stellte er die Taten aller Menschen aller Zeiten in den Hintergrund und in den Schatten, um die Menschen aus jedweder Verbohrtheit herauszuführen und sie seinen wahren Vater kennen zu lehren, wie er auch selbst sagt: “Ich bin gekommen, zu retten und zu suchen, was verloren war”.</p>
      <h2>16</h2><p>Denn da einmal der Menschengeist in die Sinnenwelt versunken war, so erbot sich der Logos, im Leibe zu erscheinen, um als Mensch die Menschen an sich zu ziehen, ihre Sinne auf sich zu lenken und sie dann mit seinen Werken, die sie ihn in Menschengestalt vollbringen sehen, zur Überzeugung zu führen, daß er nicht nur Mensch, sondern auch Gott, Logos und Weisheit des wahrhaftigen Gottes wäre. Eben das will auch Paulus zu verstehen geben in den Worten: „In der Liebe festgewurzelt und begründet, damit ihr imstande seid, mit allen Heiligen zu begreifen, welches die Breite, Länge, Höhe und Tiefe sei, und zu erkennen, daß die Liebe Christi alle Erkenntnis weit überragt, damit ihr erfüllt werdet zu aller Fülle Gottes“. Überall hat sich ja der Logos verbreitet, oben und unten, in der Tiefe und in der Breite, oben in der Schöpfung, unten in der Menschwerdung, in der Tiefe in der Unterwelt, in der Breite in der Welt, und so ist alles von der Erkenntnis Gottes angefüllt. Eben deshalb hat er sich auch nicht unmittelbar nach seiner Ankunft mit der Hingabe seines Leibes in den Tod und mit dessen Auferweckung das Opfer für alle dargebracht, weil er sich damit unsichtbar gemacht hätte. Vielmehr hat er im Leibe sich sichtbar gemacht, indem er in ihm verweilte und solche Werke vollbrachte und Zeichen wirkte, die ihn nicht mehr als Menschen, sondern als Gott-Logos offenbarten. Zwei Liebesdienste erwies uns der Heiland durch seine Menschwerdung, einmal, daß er den Tod von uns hinwegnahm und uns erneuerte, und daß er, an sich nicht wahrnehmbar noch sichtbar, durch seine Werke sich kundgab und sich als den Logos des Vaters, als den Lenker und König des Alls zu erkennen gab.</p>
      <h2>17</h2><p>Er war ja nicht im Körper eingeschlossen und war auch nicht nur in einem Leibe und nirgends anderswo. Auch gab er ihm nicht die Bewegung, indes das All seiner Wirksamkeit und Fürsorge entraten mußte, sondern als Logos war er - ganz auffallend - von keinem Ding eingeschlossen, schloß vielmehr alles in sich ein. Und wie er sich in der ganzen Schöpfung befindet, außerhalb des Alls mit seiner Wesenheit, in allem aber vermöge seiner Wirksamkeit, alles anordnend, alles in allem mit seiner Fürsorge durchwaltend, das Einzelne wie das Ganze zugleich belebend, alles umschließend, ohne selbst umschlossen zu werden, nur in seinem Vater voll und ganz ruhend, so belebte er, auch im menschlichen Leibe weilend und ihn selbst belebend, natürlich auch alles. Und so war er in allem und doch außerhalb des Alls. Und wie er an den mit dem Körper vollbrachten Werken erkennbar war, so offenbarte er sich auch in seiner Tätigkeit im Weltall.</p><p>Es liegt nun zwar auch im Wirkungskreise der Seele, auch das außerhalb des Leibes Liegende zu betrachten und zu überdenken, aber nicht auch außerhalb des eigenen Leibes eine Wirksamkeit zu entfalten oder das, was ihm fernliegt, durch ihre Gegenwart in Schwingung zu setzen. Nie vermag ein Mensch den fernabliegenden Gegenstand seines Denkens nun schon auch zu bewegen und zu versetzen. Wenn jemand in seinem Hause sitzt und über die Himmelserscheinungen sich seine Gedanken macht, so bewegt er damit nicht auch schon die Sonne und dreht er nicht auch schon den Himmel. Vielmehr sieht er bloß die Bewegungen und Vorgänge, vermag aber nicht auf sie einzuwirken. Nicht so also war der Logos im Menschen. Denn er war nicht an den Leib gefesselt, sondern er war Meister über ihn, so daß er sowohl in diesem als auch in allen anderen war und sogar außerhalb der Dinge und im Vater allein ruhte. Und das Wunderbare daran war das, daß er wie ein Mensch lebte und als Logos alles belebte und als Sohn mit dem Vater war. Deshalb litt er auch nicht unter der Geburt der Jungfrau und wurde nicht befleckt, da er im Leibe war, vielmehr heiligte er den Leib. Auch nimmt er nicht an allem Anteil, obschon er in allem ist; vielmehr wird alles von ihm belebt und ernährt. Denn wenn schon die Sonne, die von ihm erschaffen ist und von uns gesehen wird, bei ihrem Kreislauf am Himmel durch ihre Berührung mit irdischen Körpern nicht beschmutzt wird und durch die Finsternis nicht unsichtbar wird, vielmehr selbst die Körper beleuchtet und reinigt, so wurde noch weit weniger der allheilige Logos Gottes, der Schöpfer und Herr der Sonne, durch seine Offenbarungen im Leibe befleckt. Nein, weil selbst unverweslich, belebte und reinigte er vielmehr den sterblichen Leib. „Denn der keine Sünde beging“, heißt es, „und in dessen Mund keine Arglist gefunden ward“.</p>
      <h2>18</h2><p>Wenn also die Gottesgelehrten, die hiervon handeln, behaupten, daß er aß, trank, geboren ward, so wisse, daß zwar der Leib als Leib geboren und mit den entsprechenden Speisen genährt wurde, daß aber Gott der Logos selbst, der mit dem Leibe zusammen war, dadurch, daß er alles anordnete und durch die Werke, die er im Leibe vollbrachte, sich nicht als Mensch, sondern als Gott-Logos offenbarte. Wohl sagt man diese Zuständlichkeit von ihm aus, weil eben auch der Leib, der aß, geboren ward und litt, nicht einem anderen, sondern dem Herrn gehörte, und weil man nach seiner Menschwerdung dieses von ihm wie von einem Menschen mit Fug und Recht sagte, damit er in Wirklichkeit und nicht in der Einbildung mit einem Leibe erscheine. Doch wie man hieraus auf seine leibliche Gegenwart schloß, so gab er sich durch die Werke, die er durch seinen Leib vollbrachte, als Gottes Sohn zu erkennen. Deshalb rief er auch den ungläubigen Juden die Worte zu: „Wenn ich nicht die Werke meines Vaters tue, so glaubt mir nicht! Tue ich sie aber, so glaubt, wenn ihr mir auch nicht glauben wollt, meinen Werken, damit ihr erkennet und wisset, daß der Vater in mir ist und ich in dem Vater“. Denn wie er, an sich unsichtbar, aus den Werken der Schöpfung erkannt wird, so sollte, nachdem er Mensch geworden und in einem Leibe verborgen ist, aus den Werken erkannt werden, daß es nicht ein Mensch, sondern Gottes Kraft und Logos ist, der dies vollbringt. Denn wenn er Teufeln gebietet und sie austreibt, so ist das kein menschliches, sondern ein göttliches Werk. Und wenn man ihn Krankheiten heilen sieht, an denen das Menschengeschlecht leidet, wer möchte ihn da noch für einen Menschen und nicht für Gott halten? Denn er heilte Aussätzige, machte Lahme gehen, öffnete Tauben das Gehör, machte Blinde sehen und verscheuchte einfach alle Krankheiten und Gebrechen von den Menschen, woraus ein jeder seine Gottheit erkennen konnte. Wer würde denn angesichts der Tatsache, daß er die Mängel der Geburt ersetzt und die Augen eines Blindgeborenen öffnet, nicht auf den Gedanken kommen, daß die Geburt der Menschen seiner Macht untersteht und daß er ihr Begründer und Schöpfer ist? Wer nämlich etwas verleiht, was der Mensch von Geburt auf nicht besaß, der muß doch offenbar auch über die Geburt der Menschen Herr sein. Deshalb bildete er sich auch, wie er im Anfang zu uns herabkam, seinen Leib aus einer Jungfrau, um allen einen nicht unwesentlichen Beweis seiner Gottheit zu geben, insofern der, welcher diesen geschaffen, auch der Schöpfer der übrigen (Leiber) ist. Wer müßte denn angesichts der Tatsache, daß ein Leib ohne Beteiligung eines Mannes aus einer Jungfrau allein hervorgeht, sich nicht sagen, daß der, welcher in diesem Leibe erscheint, auch Schöpfer und Herr der übrigen Leiber ist? Oder wenn einer auch die Substanz des Wassers verändert und in Wein verwandelt sieht, sollte der nicht einsehen, daß der, welcher das zuwege brachte, der Herr und Schöpfer der Substanz aller Wasser ist? Deshalb betrat er auch wie ein Herr das Meer und wandelte darauf wie auf festem Lande und gab damit den Augenzeugen einen Beweis seiner Herrschaft über alles. Wenn er dann mit Wenigem eine so große Menge speiste, und wenn er aus dem Mangel Überfluß schuf, so daß mit fünf Broten Fünftausend gesättigt wurden und noch so viel übrig blieb, so offenbarte er sich damit doch als nichts anderes denn als den Herrn, der für alles sorgt.</p>
      <h2>19</h2><p>All das zu vollbringen, fand der Heiland für gut, damit die Menschen, die für seine allesumfassende Fürsorge kein Verständnis hatten, wenigstens auf seine im Leibe vollbrachten Werke hin aufblickten und durch ihn einen Begriff bekämen von der Erkenntnis des Vaters - und zwar, wie bereits gesagt, auf dem Wege einer Schlußfolgerung von den Einzelwerken auf seine Fürsorge für das Ganze. Wer wird denn angesichts seiner Macht über die bösen Geister oder als Zeuge davon, daß die Dämonen ihn als ihren Herrn anerkennen, noch Zweifel hegen, ob dieser der Sohn Gottes, die Weisheit und Macht sei? Ja, nicht einmal die Schöpfung durfte schweigen, sondern wunderbar ereignete sich gerade bei seinem Tode oder vielmehr in der Siegestrophäe über den Tod, nämlich im Kreuze, daß die ganze Schöpfung den, der im Leibe sichtbar war und litt, nicht einfach als Menschen, sondern als Gottes Sohn und Heiland aller bekannte. Als nämlich die Sonne sich wegwandte, die Erde bebte, die Felsen sich spalteten, da erschraken alle. Diese Vorgänge bezeugten aber Christum am Kreuze als Gott und die ganze Schöpfung als ihm Untertan und als die fürchtende Zeugin für die Gegenwart des Herrn. So also hat Gott der Logos durch seine Werke den Menschen sich geoffenbart. Es dürfte sich aber empfehlen, auch über das Ende seines Wirkens und Wandels im Leibe zu berichten und anzugeben, welcher Art sein leiblicher Tod gewesen, zumal es sich hierbei um den Hauptpunkt unseres Glaubens handelt und alle Welt davon spricht. So mögest du dann einsehen, daß auch hieraus wenigstens ebensogut Christus als Gott und Gottes Sohn erkannt wird.</p>
      <h2>20</h2><p>So haben wir denn im Vorausgehenden den Grund für seine Erscheinung im Leibe, so gut es möglich war, (wenigstens) teilweise und nach unserem geistigen Vermögen angegeben. Danach kam es keinem anderen zu, das Verwesliche in die Unverweslichkeit umzuwandeln, als nur dem Heiland selbst, der auch im Anfang alles aus nichts erschaffen hat. Kein anderer sollte die Menschen nach dem Ebenbilde wieder erneuern als das Ebenbild des Vaters, und kein anderer das Sterbliche unsterblich machen als unser Herr Jesus Christus, der das Leben selbst ist; kein anderer sollte über den Vater Aufschluß bringen und den Götzenkult beseitigen als nur der Logos, der alles regiert und allein der wahre eingeborene Sohn des Vaters ist. Weil aber die Schuld aller getilgt werden mußte - es mußten ja, wie bereits gesagt, alle sterben, weshalb er ja auch in erster Linie herabgekommen ist -, deshalb brachte er nach dem faktischen Beweis seiner Gottheit alsbald auch für alle das Opfer dar, indem er für alle seinen Tempel dem Tode preisgab, um alle für die alte Übertretung unverantwortlich und von ihr freizumachen, und um sich als den Herrn auch über den Tod zu erweisen, indem er seinen eigenen Leib in Unverweslichkeit als Erstlingsfrucht der Auferstehung aller aufwies. Wundere dich doch nicht, wenn wir so oft über denselben Gegenstand dasselbe sagen! Denn da wir von der Huld Gottes reden, deshalb erklären wir denselben Gedanken weitläufiger, daß es nicht etwa scheint, als übergingen wir etwas, oder daß uns nicht der Vorwurf trifft, als hätten wir die Sache nur notdürftig behandelt. Denn besser ist es, sich den Vorwurf gefallen lassen zu müssen, daß man sich wiederhole, als den, daß man etwas Notwendiges zu schreiben unterlassen habe.</p><p>So mußte also der Leib, der auch mit allen anderen das Wesen gemeinsam hatte - denn ein menschlicher Leib war es -, wie die anderen sterben, weil eben doch auch er sterblich war trotz seiner unerhört wunderbaren Bildung aus einer bloßen Jungfrau. Aber weil der Logos in ihm sich niederließ, verfiel er nicht mehr folgend dem Gesetz seiner Natur der Verwesung, sondern blieb dank dem einwohnenden Logos Gottes vor ihr bewahrt. So geschah ganz auffallend bei einem und demselben Geschehnis etwas Doppeltes: Der über alle verhängte Tod übte sein Recht am Leibe des Herrn, und Tod und Verwesung wurden wegen des einwohnenden Logos aufgehoben. Der Tod mußte eintreten, und zwar im Interesse aller, um die allgemeine Schuld zu zahlen. Deshalb nahm, wie bereits gesagt, der Logos, der an sich nicht sterben konnte - er war ja unsterblich -, einen Leib an, der sterben konnte, um ihn als eigenen für alle zu opfern und durch sein mit dem Eintritt in den Leib bedingtes Leiden für alle „dem die Macht zu nehmen, der die Herrschaft über den Tod hatte, d.h. dem Teufel, und die zu erlösen, die im Banne der Todesfurcht ihr ganzes Leben hindurch in der Knechtschaft standen“.</p>
      <h2>21</h2><p>Gewiß, da der gemeinsame Heiland aller für uns gestorben ist, so brauchen wir, die wir in Christus gläubig sind, jetzt nicht mehr des Todes zu sterben, wie ehedem das Gesetz laut drohte; aufgehoben ist ja dies Urteil. Vielmehr werden wir jetzt, da die Verwesung in der Gnade der Auferstehung beseitigt und gehoben ist, nur mehr entsprechend unserem sterblichen Leib eine Zeitlang aufgelöst, wie es Gott einem jeden festgesetzt hat, um zu einer besseren Auferstehung gelangen zu können. Denn nach Art der in die Erde gesenkten Samen gehen wir bei der Auflösung nicht zugrunde, sondern Saatkörnern gleich werden wir auferstehen, da der Tod in Kraft der Gnade des Heilandes überwunden ist. Deshalb sagt ja auch der selige Paulus, der allen ein Bürge der Auferstehung geworden ist: „Dies Verwesliche muß die Unverweslichkeit anziehen und dies Sterbliche die Unsterblichkeit. Wenn aber dies Verwesliche die Unverweslichkeit und dies Sterbliche die Unsterblichkeit angezogen hat, dann wird das Wort der Schrift sich erfüllen: Verschlungen ist der Tod im Sieg! Tod, wo ist dein Stachel? Hölle, wo ist dein Sieg?“ Man könnte nun einwenden: Wenn er für alle seinen Leib dem Tod überantworten mußte, warum hat er ihn dann nicht wie ein Mensch in natürlicher Weise abgelegt, sondern ließ es bis zur Kreuzigung kommen? Er wäre es seiner Ehre doch eher schuldig gewesen, von sich aus den Leib abzulegen als mit Schmach einen solchen Tod erleiden. Doch habt acht, ob dieser Einwand nicht menschlich ist! Nein, wahrhaft göttlich war, was der Heiland vollbrachte, und von vielen Gesichtspunkten aus seiner Gottheit würdig: Fürs erste tritt der Tod, der über die Menschen kommt, ein infolge der Schwäche ihrer Natur. Nicht imstande, auf die Länge zu bestehen, gehen sie mit der Zeit ihrer Auflösung entgegen. Deshalb kommen auch die Krankheiten über sie, und sie sterben an Entkräftung. Der Herr aber ist nicht schwach, sondern Gottes Kraft und Gottes Logos und das Leben selbst. Hätte er also irgendwie auf natürliche Weise und nach dem gewöhnlichen Lauf des Menschenlebens seinen Leib in einem Bette abgelegt, so hätte man auch ihm diese Leiden als Schwäche seiner Natur ausgelegt und ihn mit den anderen Geschöpfen auf die gleiche Linie gestellt. Da er aber das Leben und Gottes Logos war, und anderseits der Tod bei allen eintreten mußte, so teilte er als das Leben und die Kraft in seiner Person die Kraft mit dem Leibe, holte aber, um dem Tod seinen Tribut zu zahlen, nicht bei sich, sondern bei anderen die Veranlassung zur Vollbringung des Opfers; durfte ja doch auch der Herr nicht krank werden, er, der die Krankheiten anderer heilte. Auch kein Kräfteverfall durfte über seinen Leib kommen, in dem er ja auch die Schwäche der anderen in Stärke umwandelte. Warum wehrte er dann nicht auch dem Tod wie der Krankheit? Weil er eben darum den Leib trug und es untunlich war, den Tod zu verhindern, weil damit auch die Auferstehung hintangehalten worden wäre. Ebensowenig ging es andererseits an, daß dem Tod eine Krankheit vorausging, damit man nicht den im Leib Befindlichen schwach wähne. Hat ihn aber nicht gehungert? Freilich, es hungerte ihn entsprechend dem Bedürfnis des Leibes; allein weil der Herr ihn trug, erlag er dem Hunger nicht. Daher sah er auch die Verwesung nicht, obschon er zur Sühne für alle starb. Unversehrt stand er ja wieder auf, da es nicht der Leib des nächsten Besten, sondern des Lebens selbst war.</p>
      <h2>22</h2><p>Aber er hätte doch, könnte man einwenden, dem Anschlag der Juden entgehen sollen, um so seinen Leib überhaupt unsterblich zu erhalten. Doch ein solcher lasse sich sagen, daß auch das dem Herrn nicht angestanden hätte. Wie es sich für den Logos Gottes, der das Leben ist, nicht geziemt hätte, von sich aus seinen Leib dem Tode zu überantworten, so hätte es sich auch nicht gepaßt, dem von anderen ihm bereiteten zu entfliehen, sondern eher ihn zu verfolgen bis zu seiner Vernichtung. Deshalb hat er mit Recht weder selbst den Leib abgelegt noch anderseits die verfolgungssüchtigen Juden geflohen. Solches Vorgehen verriet aber nicht Schwäche des Logos, offenbarte ihn vielmehr als Heiland und Leben, weil er einerseits den Tod abwartete, um ihn zu vernichten, anderseits es ihn drängte, zur Erlösung aller sein Todeslos zu besiegeln. Und zudem kam der Heiland nicht, um seinen Tod, sondern den der Menschen zu besiegeln. Deshalb entäußerte er sich seines Leibes nicht in einem höchsteigenen Tod - als das Leben kannte er ja keinen solchen -, sondern er nahm den Tod von den Menschen herüber, um eben diesen, mit seinem Leibe in Berührung gebracht, endgültig zu beseitigen. Sodann mag auch folgendes ein solches Ende des Herrenleibes recht gut erklären. Es war dem Herrn in erster Linie um die Auferstehung des Leibes zu tun, die er bewerkstelligen wollte. Denn eben das war das Zeichen des Triumphes über den Tod, diese (Auferstehung) allen vor Augen zu stellen und allen die sichere Überzeugung zu verschaffen von dem durch ihn eingetretenen Ende der Verwesung und einer nunmehrigen Unverweslichkeit der Leiber, für die er gewissermaßen zum allgemein gültigen Unterpfand und Wahrzeichen einer allen beschiedenen Auferstehung seinen eigenen Leib unverweslich bewahrt hat. Wäre aber der Leib krank geworden, und hätte der Logos vor aller Augen sich wieder von ihm getrennt, so wäre es unschicklich gewesen, daß der, der die Krankheiten anderer heilte, sein eigenes Organ in Krankheit hätte verkümmern lassen. Denn wie hätte man ihm die Macht, die Schwächen anderer zu heilen, zugetraut, wenn sein eigener Tempel an ihm gebrechlich gewesen wäre? Entweder hätte man ihn verspottet, weil er nicht imstande, der Krankheit zu wehren, oder man hätte ihn, wenn er es trotz der Macht dazu nicht getan hätte, ihn für lieblos auch gegen die anderen gehalten.</p>
      <h2>23</h2><p>Hätte er sodann ohne irgendwelche Krankheit und ohne jedwelchen Schmerz irgendwo für sich in einem Winkel oder in einem einsamen Ort, zu Hause oder sonst irgendwo seinen Leib verborgen gehalten, und hätte er hernach plötzlich wieder sich gezeigt und von sich behauptet, daß er von den Toten auferstanden sei, so hätte niemand ihn mit seiner Behauptung ernst genommen; im Gegenteil hätte seine Aussage von einer Auferstehung um so weniger Glaube gefunden, als ja überhaupt niemand seinen Tod hätte bezeugen können. Der Auferstehung muß aber der Tod vorausgehen, weil es ohne vorausgegangenen Tod keine Auferstehung gibt. Wäre daher der Tod seines Leibes irgendwo in der Verborgenheit erfolgt, so wäre bei der Heimlichkeit des Todes und bei dem Mangel eines Zeugen hierfür auch seine Auferstehung geheim und unbezeugt geblieben. Oder warum hätte er, auferstanden, seine Auferstehung verkünden sollen, den Tod aber geheim eintreten lassen? Oder warum hätte der, welcher die bösen Geister vor aller Augen austrieb, dem Blindgeborenen die Augen öffnete, das Wasser in Wein verwandelte, um dadurch als Logos Gottes sich zu beglaubigen, das Sterbliche nicht vor aller Augen als unverweslich erweisen wollen, um sich als das Leben selbst zu beglaubigen? Woher hätten auch seine Jünger den Mut zur offenen Predigt von seiner Auferstehung gehabt, wenn sie nicht auch sagen konnten, daß er zuvor gestorben? Oder wie hätten sie mit ihrer Behauptung, erst sei der Tod erfolgt und dann die Auferstehung, Glauben gefunden, wenn sie nicht die zu Zeugen seines Todes gehabt hätten, vor denen sie mit allem Freimut davon predigten? Wollten doch die damaligen Pharisäer trotz der allgemein bezeugten Tatsache seines Todes und seiner Auferstehung nicht nur selbst nicht glauben, sondern zwangen gar die Augenzeugen, diese Auferstehung zu bestreiten. Fürwahr, wären jene Vorgänge geheim geblieben, wieviel Ausreden hätten sie erst dann für ihren Unglauben gefunden? Wie wäre aber dann das Ende der Todesherrschaft und der Sieg über ihn erwiesen worden, wenn er ihn nicht vor aller Augen herausgefordert und ihn als einen durch die jetzige Unverweslichkeit des Leibes entwaffneten Toten erwiesen hätte?</p>
      <h2>24</h2><p>Auch die etwaigen Äußerungen von anderer Seite müssen wir vorausgreifend widerlegen. Es könnte nämlich vielleicht einer auch mit folgender Behauptung kommen: Mußte sein Tod vor aller Augen und vor Zeugen eintreten, damit die Botschaft von seiner Auferstehung Glauben fände, so hätte er sich doch einen Tod in Ehren ausdenken sollen, um wenigstens der Schmach des Kreuzes zu entgehen. Allein damit hätte er gegen sich den Verdacht wachgerufen, als ob er nicht über jeden Tod Macht hätte, sondern nur über den von ihm erwählten. Und so hätte man gleichwohl wieder eine Ausrede für seinen Unglauben gegenüber der Auferstehung gehabt. Deshalb erfolgte der Tod seines Leibes nicht nach eigener Wahl, sondern auf einen Anschlag hin, damit der Heiland eben den Tod, den sie ihm bereiteten, vernichte, Ein hochgemuter Kämpfer, groß durch Einsicht wie durch Tapferkeit, wählt sich seine Gegner auch nicht selbst, um nicht bei einigen in den Verdacht der Furchtsamkeit zu kommen, sondern überläßt dies dem Belieben der Zuschauer, zumal wenn es seine Feinde sind, um den nächsten Besten, den sie ihm gegenüberstellen, niederzuschmettern und sich so als den allen Überlegenen zu bewähren. Geradeso hat auch das Leben aller, unser Herr und Heiland Jesus Christus, nicht selbst eine Todesart für seinen Leib erdacht, um nicht den Anschein zu erwecken, als bange ihm vor einer anderen. Vielmehr ließ er sich dazu herbei, den Tod, den ihm andere, und zwar gerade seine Feinde als schrecklichen, ehrlosen und furchtbaren ersannen, den Tod am Kreuze, auf sich zu nehmen und zu erdulden, damit er gerade durch dessen Überwindung selbst als das Leben beglaubigt und die Macht des Todes endgültig gebrochen würde. Etwas ganz Wunderbares und Auffallendes ist damit geschehen: Der Tod der Unehre, den sie ihm beizubringen wähnten, der ward zum Siegeszeichen über den Tod selbst. Deshalb litt er auch nicht den Tod des Johannes durch Enthauptung noch wurde er zersägt wie Isaias, damit er auch im Tode den Leib ungeteilt und ganz bewahre und denen keinen Vorwand biete, welche die Kirche spalten wollen.</p>
      <h2>25</h2><p>Soviel den Außenstehenden, die auf solche Spitzfindigkeiten ausgehen. Wenn aber jemand aus unserer Mitte nicht aus Streitsucht, sondern aus Wißbegier darüber nachforscht, warum er nicht anders als am Kreuze starb, so lasse auch er sich sagen, daß es nur so für uns ersprießlich war, und daß der Herr dieses Sterben unsertwegen aus gutem Grunde auf sich nahm. Denn wenn er gekommen ist, den über uns ergangenen Fluch zu tragen, wie anders wäre die Verfluchung Wirklichkeit geworden als eben dadurch, daß er den im Fluche verhängten Tod auf sich nahm? Dieser aber ist das Kreuz, So steht auch geschrieben: „Verflucht, wer an dem Holze hängt!“ Ferner, wenn der Tod des Herrn der Lösepreis für alle ist, und durch seinen Tod die trennende Scheidewand niedergerissen wird und die Berufung der Heidenvölker erfolgt, wie hätte er uns denn berufen, wenn er nicht gekreuzigt worden wäre? Denn nur am Kreuze stirbt man mit ausgespannten Armen. Daher mußte der Herr gerade diesen Tod erdulden und die Arme ausspannen, um mit dem einen das alte Volk, mit dem anderen die Berufenen aus der Heidenwelt an sich zu ziehen und beide Teile in sich zu verbinden. Das hat er ja auch selbst gesagt, da er andeutete, durch welchen Tod alle erlöst werden sollten: „Wenn ich erhöhet sein werde“, sagt er, „werde ich alle an mich ziehen“. Wenn sodann der Feind unseres Geschlechtes, der Teufel, aus dem Himmel verstoßen, in dieser unteren Luft umherirrt und hier seinen gleich ihm ungehorsamen Genossen gebietet, mit Blendwerken auf die Phantasie (der Menschen) einwirkt und die aufwärts Strebenden zurückzuhalten sucht - hierüber bemerkt ja auch der Apostel: „Unter dem Einfluß des Fürsten, der Macht hat in dieser Luft, des Geistes, der jetzt wirkt in den Söhnen des Ungehorsams“, - wenn sodann der Herr gekommen ist, den Teufel zu stürzen, die Luft zu reinigen und uns den Weg zum Himmel zu bahnen, wie der Apostel gesagt hat, „durch den Vorhang, d.i. sein Fleisch“, und wenn dies durch den Tod geschehen mußte, durch welch anderen Tod wäre das geschehen als durch den in der Luft, durch den am Kreuze? Denn nur dann stirbt einer in der Luft, wenn er sein Leben am Kreuze beschließt. Darum hat auch mit Recht der Herr diesen Tod erduldet. Doch so erhöht, reinigte er die Luft von der Nachstellung des Teufels und jedem Anschlag der bösen Geister, wie er selber sagt: „Ich sah Satan wie einen Blitz niederfallen“. Und er eröffnete uns wieder den Weg zum Himmel, wie er wieder sagt: „Erhebet eure Tore, ihr Fürsten, erhebet euch, ihr ewigen Tore!“ Der Logos selber hatte nicht nötig, daß ihm die Tore geöffnet wurden, da er der Herr aller Dinge ist; auch gibt es kein geschaffenes Ding, das dem Schöpfer verschlossen wäre. Wohl aber bedurften wir solcher Öffnung, die er mit seinem eigenen Leibe emportrug. Wie er nämlich diesen für alle dem Tode überantwortete, so bahnte er wieder durch ihn uns den Weg zum Himmel.</p>
      <h2>26</h2><p>Recht und billig also war sein Tod am Kreuze für uns. Seine Begründung hat sich in allweg als stichhaltig erwiesen und entspricht auch den Forderungen der Vernunft, daß die allgemeine Erlösung nicht anders als durch das Kreuz erfolgen durfte. Denn so ließ er sich selbst am Kreuz nicht unbezeugt, vielmehr hieß er zu allem hier auch die Schöpfung Zeugnis geben für die Gegenwart ihres Schöpfers und erweckte seinen Tempel, den Leib, den er nur vorübergehend ruhen ließ und nur zum Zeichen, daß er eine Leiche geworden im Kampfe mit dem Tod, sofort am dritten Tag und trug als Triumph- und Siegeszeichen über den Tod davon des Leibes Unverweslichkeit und Leidensfreiheit. Wohl hätte er ja unmittelbar nach dem Tode den Leib auferwecken und wieder lebendig zeigen können. Doch auch das hat der Heiland in kluger Voraussicht nicht getan. Denn man hätte mit dem Einwand kommen können, er wäre überhaupt nicht gestorben, oder der Tod hätte sich seiner nicht ganz bemächtigt, wenn er sofort die Auferstehung hätte folgen lassen. Vielleicht wäre auch in dem Falle, daß der Tod und die Auferstehung im gleichen Zeitraum erfolgt wären, die Glorie der Unverweslichkeit nicht zur Geltung gekommen. Um also den Tod seines Leibes zu beweisen, wartete der Logos einen Zwischentag ab und hat dann erst am dritten Tag allen ihn in seiner Unverweslichkeit geoffenbart. Um also den Tod an seinem Leibe zu konstatieren, hat er ihn am dritten Tage auferweckt. Um aber nicht mit einer Auferstehung nach einem längeren Intervall und nach völliger Verwesung (des Leibes) dem Mißtrauen zu begegnen, als trage er nicht denselben, sondern einen anderen Leib - man hätte ja seiner Erscheinung wegen der Länge der Zeit mißtrauen und das Geschehnis vergessen können -, so ließ er es aus diesem Grunde nicht länger als drei Tage anstehen und hielt die, die von seiner Auferstehung gehört hatten, nicht lange hin. Nein, zu einer Zeit, wo seine Rede in ihrem Ohr noch nachklang, ihr Auge noch nach ihm ausschaute und ihre Seele voller Erwartung war, wo die Mörder noch auf Erden lebten und an Ort und Stelle waren und den Tod des Herrenleibes noch bezeugen konnten, da - nach dreitägigem Intervall - hat der Sohn Gottes den erst toten Leib unsterblich und unverweslich geoffenbart. Und so ward allen klar, daß der Leib nicht infolge der Schwäche der Natur des einwohnenden Logos gestorben ist, sondern zum Zweck der Beseitigung seines Todes in der Kraft des Heilandes.</p>
      <h2>27</h2><p>Daß der Tod überwunden und der Sieg über ihn im Kreuze vollendet, und daß er nun keine Gewalt mehr hat, sondern wirklich tot ist, dafür ist kein unwesentlicher Beweis und sichere Bürgschaft die Tatsache, daß er von allen Jüngern Christi verachtet wird, alle ihm trotzen und sich nicht mehr vor ihm fürchten, sondern im Zeichen des Kreuzes und im Glauben an Christus ihn wie einen Toten zu Boden treten. Dereinst vor der göttlichen Ankunft des Heilandes war der Tod selbst für die Heiligen etwas Schreckliches, und alle beweinten die Sterbenden als der Vernichtung verfallen. Seitdem aber der Heiland seinen Leib von den Toten auferweckt hat, ist der Tod nicht mehr schrecklich; vielmehr treten ihn alle, die an Christus glauben, mit Füßen, wie wenn er nichts bedeutete, und wollen lieber sterben als den Glauben an Christus verleugnen. Denn sie sind sich sicher, daß sie sterbend nicht untergehen, sondern fortleben und durch die Auferstehung unverweslich werden. Jener Teufel aber, der vormals böswillig mit dem Tode dräute, ist nach Beseitigung der Todeswehen allein wirklich tot geblieben. Beweisend hierfür ist, daß die Menschen, ehe sie an Christus glauben, den Tod als schrecklich ansehen und ihn fürchten. Sobald sie aber zum Glauben an ihn und seine Lehre übergetreten sind, machen sie sich so wenig aus dem Tode, daß sie sogar hochgemut ihm entgegengehen und Zeugen der Auferstehung werden, die der Heiland im Kampfe gegen ihn errungen hat. Ja selbst solche, die im zarten Kindesalter stehen, eilen in den Tod, und nicht nur Männer, sondern auch Frauen üben sich im Kampf gegen ihn. So ohnmächtig ist er geworden, daß selbst das von ihm zuvor getäuschte Frauengeschlecht seiner wie eines Toten und Verblichenen spottet. Denn wie nach einem Sieg des rechtmäßigen Königs über einen Tyrannen und nach dessen Fesselung an Händen und Füßen nunmehr alle, die vorübergehen, ihn verhöhnen, schlagen und an ihm herumzerren, da sie ja seine Wut und Grausamkeit nach dem Siege des Königs nicht mehr zu fürchten haben, so treten auch nach Überwindung des Todes, seiner Bloßstellung im Kreuze des Heilandes und seiner Fesselung an Händen und Füßen auf ihn alle, die in Christus vorübergehen, und sie spotten zum Zeugnis für Christus des Todes und höhnen ihn mit den oben zitierten Worten der Schrift: „Tod, wo ist dein Sieg? Hölle, wo ist dein Stachel?“</p>
      <h2>28</h2><p>Ist das etwa ein geringfügiger Beleg für die Ohnmacht des Todes? Oder ist es ein schwacher Beweis für den Sieg des Heilandes über ihn, wenn die christlichen Knaben und Mädchen das Leben hienieden nicht achten und zum Sterben sich rüsten? Von Natur aus fürchtet ja der Mensch den Tod und die Auflösung des Leibes. Daher ist es sogar auffallend, daß der, welcher den Glauben an das Kreuz angenommen hat, um Christi willen die Natur nicht achtet und den Tod nicht scheut. Wenn z. B. jemand bei der Tatsache, daß zum Wesen des Feuers die Brennkraft gehört, sagte, es gebe etwas, was seine Flamme nicht fürchte, sondern eher deren Unvermögen beweise, wie man dies z. B. vom indischen Amiant behauptet, und daraufhin dann ein Ungläubiger die Probe mit der Sache machen wollte, den unverbrennlichen Stoff anzöge und ihn dem Feuer nahebrächte, so gewänne er daraufhin sicher die Überzeugung von der Ohnmacht des Feuers. Oder wenn einer den gefesselten Tyrannen sehen wollte, dann begäbe er sich ins Land und Reich des Siegers, und sähe nun den für andere so Furchtbaren in seiner Ohnmacht. Geradeso mag der, der auch nach so vielen Ereignissen und auf so viele christliche Martyrien hin und trotz tagtäglich sich wiederholender Geringschätzung des Todes von seiten der glorreichen Streiter in Christus, gleichwohl noch ungläubig ist und Zweifel hegt in seinem Herzen, ob der Tod wirklich beseitigt und am Ende angekommen sei, ja, so mag er ganz wohl staunen ob solch großen Geschehnisses. Doch möge er nicht im Unglauben sich verhärten und gegen so einleuchtende Wahrheiten nicht unverschämt sein! Wie vielmehr der, welcher mit dem Amiant den Versuch gemacht hat, erkennt, daß das Feuer ihm gegenüber keine Brennkraft besitzt, und der, welcher den Tyrannen in Fesseln sehen will, in das Reich des Siegers sich begibt, so soll auch der, welcher den Sieg über den Tod bezweifelt, den Glauben an Christus annehmen und in seinen Unterricht übergehen; dann wird er die Ohnmacht des Todes und den Sieg über ihn zu schauen bekommen. Denn viele, die zuvor ungläubig waren und spotteten, haben später, gläubig geworden, den Tod so wenig geachtet, daß sie sogar Märtyrer für Christus wurden.</p>
      <h2>29</h2><p>Wenn aber durch das Zeichen des Kreuzes und den Glauben an Christus der Tod mit Füßen getreten wird, so ist doch wohl offenbar vor dem Richterstuhl der Wahrheit niemand anders als eben Christus derjenige, der die Trophäen und Siege über den Tod aufzuweisen und ihm die Macht genommen hat. Und wenn der Tod zuvor die Macht hatte und deshalb furchtbar war, aber jetzt nach der Ankunft des Heilandes und dem Tod seines Leibes und der Auferstehung verachtet wird, so ist doch wohl offenbar der Tod eben von Christus, der das Kreuz bestiegen hat, entkräftet und besiegt worden. Denn wie es ganz unzweifelhaft ist, daß, wenn nach der Nacht die Sonne aufgeht und der ganze Erdkreis von ihr beleuchtet wird, eben die Sonne mit ihrem ausstrahlenden Licht auch zugleich die Finsternis verscheucht und alles erleuchtet, so liegt es auch ganz klar am Tag, daß, wenn seit der erlösenden Erscheinung des Heilands im Leibe und seinem Tod am Kreuze der Tod verachtet und mit Füßen getreten wird, es eben der im Fleische erschienene Heiland ist, der den Tod vernichtet hat und tagtäglich in seinen Jüngern Siege über ihn aufzuweisen hat. Wenn man nämlich sieht, wie von Natur schwache Menschen sich in den Tod stürzen und vor seiner Verwesung nicht zurückschaudern noch auch den Weg in die Unterwelt fürchten, sondern hochgemuten Herzens ihn herausfordern, vor den Martern nicht zittern, vielmehr um Christi willen den Gang in den Tod dem Leben hienieden vorziehen, oder wenn man Zeuge davon ist, wie Männer, Frauen und zarte Kinder um ihres christlichen Glaubens willen freudig in den Tod gehen und sich hineinstürzen, - wer wäre da noch so töricht oder so ungläubig, oder wer geistig noch so verblendet, daß er nicht einsähe und bedächte, daß Christus selbst, für den die Menschen das Zeugnis ablegen, den Sieg über den Tod einem jeden verleiht und gibt, indem er ihn ohnmächtig macht in jedem, der den Glauben an ihn hat und das Zeichen des Kreuzes trägt? Auch wer eine Schlange zertreten sieht, deren frühere Wildheit er vielleicht besonders gut kannte, zweifelt weiter nicht mehr, daß sie tot und ganz ohnmächtig geworden ist, er müßte denn nur geistig verrückt geworden sein und nicht einmal die gesunden leiblichen Sinne haben. Und wenn man Kinder einen Löwen necken sieht, weiß man dann nicht, daß er tot ist oder doch alle seine Kraft verloren hat? So gut man nun hier von der Wirklichkeit mit seinen Augen sich überzeugen kann, so soll angesichts des Spottes und der Verachtung des Todes auf Seiten der Christusgläubigen niemand mehr zweifeln und auch der Wahrheit sich nicht verschließen, daß der Tod von Christus überwunden und seine Verwesung aufgehoben und beendigt ist.</p>
      <h2>30</h2><p>Daß also dem Tod seine Macht genommen und das Kreuz des Herrn das Zeichen des Sieges über ihn ist, dafür ist das oben Gesagte ein nicht geringer Beweis. Daß aber die nunmehrige unsterbliche Auferstehung des Leibes von Christus, dem gemeinsamen Weltheiland und Leben, bewirkt worden, dafür spricht denen, die noch einen offenen, ungetrübten Blick haben, der Augenschein deutlicher, als es Worte vermögen. Denn wenn der Tod, wie die Erörterung gezeigt hat, vernichtet ist, und um Christi willen ihn alle mit Füßen treten, so hat doch noch weit eher zuerst er selbst ihn mit seinem Leibe niedergetreten und ihm die Macht genommen. Wenn aber der Tod von ihm getötet war, was anders hätte dann geschehen sollen, als daß der Leib auferstand und als Zeichen des Sieges über ihn sich offenbarte? Oder wie wäre die Vernichtung des Todes offenbar geworden, wenn nicht der Leib des Herrn auferstanden wäre? Wenn aber einem dieser Beweis für seine Auferstehung nicht hinreichend scheint, so glaube er dem Gesagten wenigstens auf den Augenschein hin. Denn wenn ein Verstorbener nichts mehr wirken kann, vielmehr die Gunst ihn nur bis ans Grab geleitet und dann aufhört - denn nur den Lebenden sind Handlungen eigen und ein Bestimmungsvermögen auf die Menschen, - dann soll der nächste Beste zusehen und auf den Augenschein hin urteilen und dann die Wahrheit bekennen. Wenn nämlich der Heiland unter den Menschen so Großes vollbringt und tagtäglich von allen Seiten, im Lande der Griechen wie der Barbaren, eine solche Menge unbemerkt für seinen Glauben gewinnt und alle seiner Lehre gefügig macht, kann man da noch zweifeln in seinem Herzen, ob die Auferstehung des Heilandes wirklich erfolgt sei und ob Christus lebe oder vielmehr das Leben selbst sei? Könnte etwa ein Toter die Herzen der Menschen erschüttern, daß sie den Satzungen ihrer Väter abschwören und dafür der Lehre Christi huldigen? Oder wie, wenn er selbst untätig ist - das ist ja beim Toten der Fall, - könnte er der Wirksamkeit der Tätigen und Lebenden wehren, so daß der Ehebrecher die Ehe nicht mehr bricht, der Mörder nicht mehr mordet, der Ungerechte nicht mehr der Habsucht frönt, der Gottlose fortan gottesfürchtig ist? Wie kann er auch, wenn er nicht auferstand, sondern noch tot ist, die falschen Götter, die von den Ungläubigen für lebend ausgegeben werden, und die bösen Geister, die sie verehren, austreiben, verfolgen und vernichten? Denn wo Christus und der Glaube an ihn bekannt wird, da schwindet aller Götzendienst, aller Trug der bösen Geister kommt ans Licht, ja kein Dämon verträgt seinen Namen, sondern flieht in alle Weite, wenn er diesen nur hört. Das ist aber nicht das Werk eines Toten, sondern eines Lebenden und vorab Gottes. Übrigens wäre es lächerlich, von den Dämonen, die von ihm verfolgt, und den Götzen, die von ihm vernichtet wurden, zu behaupten, sie hätten ein Leben, von dem aber, der sie vertrieb und in seiner Macht sie auf Nimmerwiederkehr verstieß, ja der sogar von diesen selbst als Sohn Gottes bekannt wurde, zu sagen, er sei tot.</p>
      <h2>31</h2><p>Doch ein gewichtiger Beweis, mit dem die, welche nicht an die Auferstehung glauben, wider sich selbst operieren, liegt darin, daß alle Dämonen und die von ihnen angebeteten Götter den von ihnen totgesagten Christus nicht verfolgen, sondern im Gegenteil Christus diese als tot erweist. Denn wenn es wahr ist, daß der Tote nichts mehr leistet, der Heiland aber tagtäglich soviel fertig bringt, zum Glauben führt, zur Tugend beredet, die Unsterblichkeit lehrt, zur Sehnsucht nach himmlischen Gütern anspornt, die Erkenntnis seines Vaters offenbart, die (nötige) Kraft gegen den Tod einflößt, einem jeden sich zu erkennen gibt, die Gottlosigkeit des Götzenkultes beseitigt, während die Götter und Dämonen der Ungläubigen von alledem nichts vermögen, sondern vielmehr mit der Gegenwart Christi tot umsinken, da sie ja nur ein leeres, eitles Trugbild bieten, wenn vor dem Zeichen des Kreuzes jegliche Zauberei weichen muß und kein Zaubermittel mehr wirken will, alle Götzen vereinsamt und verlassen werden, wenn alle tierische Lustbarkeit ein Ende nimmt und ein jeder von der Erde zum Himmel aufschaut, - wen könnte man da wohl totsprechen? Etwa Christum, der so Großes vollbringt? Aber es liegt doch nicht in der Macht des Toten, eine Wirksamkeit zu entfalten. Oder den, der überhaupt nichts leistet, sondern wie leblos daliegt, wie dies der Fall ist bei den leichengleichen Dämonen und Götzen? Denn der Sohn Gottes, der lebt und tätig ist, wirkt tagtäglich und wirkt das Heil aller. Der Tod aber verrät sich selbst Tag für Tag in seiner Ohnmacht, und die Götzen und Dämonen sieht man geradezu aussterben. So kann also daraufhin niemand mehr an der Auferstehung seines Leibes zweifeln. Wer aber an die Auferstehung des Leibes des Herrn nicht glaubt, der scheint die Macht des Logos und der Weisheit Gottes nicht zu kennen. Denn wenn er überhaupt einen Leib annahm und diesen in richtiger Konsequenz sich zu eigen machte, wie unsere Abhandlung gezeigt hat, was hätte denn der Herr mit ihm anfangen sollen? Oder welches Ende hätte der Leib nehmen sollen, nachdem einmal der Logos bei ihm Einkehr genommen hatte? Nicht sterben war ein Ding der Unmöglichkeit, da er ja sterblich war und für alle in den Tod dahingegeben werden sollte, weshalb auch der Heiland ihn sich zubereitete. Tot durfte er aber auch nicht bleiben, weil er der Tempel des Lebens gewesen war. Deshalb starb er, weil er sterblich war, lebte aber wieder auf, weil das Leben in ihm war, und seiner Auferstehung Zeugen sind die Werke.</p>
      <h2>32</h2><p>Wenn aber seine Auferstehung deshalb keinen Glauben findet, weil man ihn nicht sieht, dann müssen die Ungläubigen auch natürliche Vorgänge leugnen. Denn, wie bereits weiter oben gesagt worden, gehört es zum Wesen Gottes, nicht gesehen, wohl aber aus den Werken erkannt zu werden. Wenn nun keine Werke vorliegen, so versagen sie mit gutem Grund dem den Glauben, der sich nicht kundgibt. Wenn aber die Werke laut ihre Stimme erheben und klares Zeugnis geben, warum leugnen sie denn geflissentlich das so offenkundige Leben der Auferstehung? Wenn sie ja auch geistig verblendet sind, so könnten sie doch mit ihren äußeren Sinnen die unbestreitbare Macht und Gottheit Christi sehen. Denn auch ein Blinder, der zwar die Sonne nicht sieht, doch die von ihr ausgehende Wärme spürt, weiß, daß eine Sonne über der Erde strahlt. So sollen auch die Widerspruchsgeister, auch wenn sie, augenblicklich blind für die Wahrheit, noch im Unglauben verharren, doch wenigstens angesichts des Starkmuts der anderen, die gläubig sind, die Gottheit Christi und die von ihm verwirklichte Auferstehung nicht bestreiten. Es ist doch ganz klar, daß ein toter Christus die Dämonen nicht verjagte und den Götzen keine Beute abnähme; einem Toten hätten die bösen Geister nicht gehorcht. Wenn sie aber augenscheinlich schon beim Aussprechen seines Namens die Flucht ergreifen, dann ist er doch wohl offenbar nicht tot, zumal ja die bösen Geister, die auch das den Menschen Verborgene schauen, in der Lage waren, sich zu überzeugen, ob Christus tot, und ihm dann überhaupt den Gehorsam zu verweigern. Nun aber sehen die bösen Geister das, was die Gottlosen nicht glauben, daß er nämlich Gott ist, und darum fliehen sie, fallen vor ihm nieder und bezeugen, was sie schon bekannten, als er noch im Leibe war: „Wir wissen, wer Du bist; Du bist der Heilige Gottes“, und: „Laß doch, was haben wir mit Dir zu schaffen, Sohn Gottes? Ich bitte Dich, quäle mich nicht!“. Wenn also die bösen Geister solches Bekenntnis und tagtäglich die Werke ihr Zeugnis ablegen, so ist doch wohl offenbar - und niemand wage doch, der Wahrheit keck zu trotzen -, daß der Heiland seinen eigenen Leib auferweckt hat, und daß er der wahrhaftige Sohn Gottes ist, aus dem er als des Vaters eigener Logos, Weisheit und Kraft, stammt, der später in der Zeit zum Heil der Welt einen Leib annahm und dem Erdkreis Aufschluß gab über den Vater, den Tod vernichtete und alle mit der Unverweslichkeit begnadigte mit der Verheißung der Auferstehung, als deren Erstlingsfrucht er seinen eigenen Leib erweckte und im Zeichen des Kreuzes das Siegeszeichen über den Tod und dessen Verwesung aufpflanzte.</p>
      <h2>33</h2><p>Da dem so ist, und der Beweis für die Auferstehung des Leibes und den Sieg des Heilandes über den Tod klar vor uns liegt, wohlan, so wollen wir auch dem Unglauben der Juden und dem Spott der Heiden die Antwort geben. Denn hierin treffen die Juden mit ihrem Unglauben und die Heiden mit ihrem Spott zusammen, daß sie an der Schmach des Kreuzes und der Menschwerdung des Logos Gottes ihren Spott auslassen. Doch unsere Untersuchung wird weder den einen noch den anderen scheu ausweichen, zumal ja offensichtliche Beweise wider sie zu Gebote stehen.</p><p>Die ungläubigen Juden finden ihre Widerlegung in den Schriften, die sie selber lesen. Erhebt doch die ganze von Gott inspirierte Schrift von vorne bis hinten ihre Stimme laut dafür, wie auch die Einzelworte selbst ganz klar sind. So kündigten schon in alten Zeiten die Propheten das Wunder von der Jungfrau und ihrer Geburt an in den Worten: „Siehe, die Jungfrau wird empfangen und einen Sohn gebären, und man wird seinen Namen Emmanuel, d.h. Gott mit uns nennen“. Auch Moses, der wirklich große Mann, der auch ihnen Autorität für die Wahrheit ist, hat das Wort über die Menschwerdung des Heilandes grandios gefunden und die erkannte Wahrheit in den Worten niedergelegt: „Aufgehen wird ein Stern aus Jakob und ein Mann aus Israel und zerschmettern wird er den Fürsten Moabs“. Und wieder: „Wie schön sind deine Wohnungen, Jakob, deine Zelte, Israel, wie schattige Täler und wie Gärten an Strömen, und wie Zelte, die der Herr aufgeschlagen hat, wie Zedern am Wasser. Hervorgehen wird ein Mensch aus seinem Samen und wird herrschen über viele Völker“. Und wieder sagt Isaias: „Ehe das Knäblein Vater- oder Mutternamen nennen kann, wird es die Stärke von Damaskus nehmen und die Beute von Samaria vor dem Angesichte des Königs der Assyrer“. Daß also ein Mensch erscheinen werde, wird damit angekündigt. Und daß der, der kommen soll, Herr der Welt ist, geben wieder folgende Worte zum voraus zu verstehen: „Siehe, der Herr thront auf einer lichten Wolke, und er wird nach Ägypten kommen, und erbeben werden die von Menschenhand erschaffenen Gebilde Ägyptens“. Von da ruft ihn auch der Vater zurück, wenn er sagt: „Aus Ägypten habe ich meinen Sohn gerufen“.</p>
      <h2>34</h2><p>Auch sein Tod ist nicht vergessen worden, sondern er wird sogar recht deutlich in den göttlichen Schriften angekündigt. Ja, auch die Ursache des Todes, daß er ihn nämlich nicht seinetwegen, sondern um der Unsterblichkeit und des Heiles aller willen erduldet, den Anschlag der Juden und ihre Freveltaten wider ihn haben sie ungescheut erzählt, damit niemand die künftigen Geschehnisse außer acht lasse und in Irrtum gerate. Sie sagen nämlich: „Ein Mensch, der verwundet ist und die Schwachheit tragen kann, weil sein Antlitz abgewandt ist. Er wurde entehrt und nicht beachtet. Er trägt unsere Sünden und leidet für uns. Wir dachten uns ihn in der Strafe, unter der Zuchtrute und im Elend. Er aber ward verwundet um unserer Missetaten willen, und um unserer Sünden willen ist er zerschlagen. Unseres Friedens wegen liegt die Züchtigung auf ihm, und durch seine Wunden werden wir geheilt“. Staune ob der Liebe des Logos zu den Menschen, da er unsertwegen sich Entehrung gefallen läßt, damit wir zu Ehren gelangen. „Denn wir alle“, heißt es, „sind wie Schafe in die Irre gegangen; der Mensch ist von seinem Wege abgekommen; und der Herr hat ihn unseren Sünden überliefert. Obschon mißhandelt, öffnet er seinen Mund nicht. Wie ein Schaf ward er zur Schlachtbank geführt und stumm wie ein Lamm vor dem, der es schert, öffnet er seinen Mund nicht. In seiner Erniedrigung wurde sein Urteil aufgehoben“. Dann aber kommt die Schrift, um zu verhüten, daß man wegen seines Leidens ihn für einen gewöhnlichen Menschen halte, den Meinungen der Menschen zuvor und erinnert an seine erhabene Macht und seine uns ungleiche Natur mit den Worten: „Wer wird seine Geburt erklären. Denn sein Leben wird von der Erde hinweggenommen. Für die Ungerechtigkeiten des Volkes wurde er in den Tod geführt. Und ich will ihm die Bösewichte für sein Begräbnis geben und die Reichen für seinen Tod. Denn er hat keine Missetat begangen, und kein Trug ward gefunden in seinem Munde, Und der Herr will ihn reinigen von seiner Wunde“.</p>
      <h2>35</h2><p>Allein nach diesen Prophezeiungen über seinen Tod wünschest du wohl die Andeutungen über seinen Tod zu erfahren. Denn auch darüber herrscht nicht Schweigen, vielmehr haben wir darüber von den Heiligen ganz deutliche Offenbarungen. So verkündet als erster Moses ganz laut die Botschaft: „Ihr werdet euer Leben vor euren Augen hängen sehen und nicht glauben“. Auch andere Propheten nach ihm bezeugen wieder dasselbe mit den Worten: „Wie ein unschuldiges Lamm, das zur Schlachtbank geführt wird, erkannte ich es nicht. Sie ersannen wider mich einen schlimmen Anschlag und sprachen: Kommt und laßt uns Holz unter sein Brot mengen und ihn vertilgen aus dem Lande der Lebendigen“. Und wiederum: „Sie haben meine Hände und Füße durchbohrt; alle meine Gebeine haben sie gezählt, meine Kleider unter sich geteilt und das Los geworfen über mein Gewand“. Der Tod in der Luft und am Holz kann kein anderer sein als die Kreuzigung. Auch werden bei keiner anderen Todesart Hände und Füße durchbohrt als nur beim Kreuzestode. Weil aber mit der Ankunft des Heilandes auch bei allen Heidenvölkern allüberall die Erkenntnis Gottes aufleuchtete, so haben sie auch das nicht unerwähnt gelassen, vielmehr auch hiervon in den heiligen Schriften Erwähnung getan. „Denn“, so sagt sie, „es werden sein die Wurzel Jesses und der sich erhebt, zu herrschen über die Völker; auf ihn werden die Heidenvölker hoffen“.</p><p>Diese wenigen Zeugnisse seien (angeführt) zur Bestätigung dessen, was sich verwirklicht hat. Doch ist die ganze Schrift voll solcher Stellen zur Widerlegung des Unglaubens der Juden. Wo fände sich denn je unter den in den göttlichen Schriften genannten Gerechten, heiligen Propheten und Patriarchen der Mann, der sein leibliches Leben bloß aus einer Jungfrau erhalten hätte? Oder wo wäre ein Weib gewesen, die auch ohne einen Mann Menschen das Dasein hätte geben können? Stammt nicht Abel von Adam, Enoch von Jazed, Noe von Lamech, Abraham von Thara, Isaak von Abraham, Jakob von Isaak? Nicht Juda von Jakob, Moses und Aaron von Ameram? Stammt nicht Samuel von Elkana, nicht David von Jesse, Salomo von David, nicht Ezechias von Achaz, nicht Josias von Arnos, nicht Isaias von Arnos, nicht Jeremias von Helkias, nicht Ezechiel von Buzi? Hatte nicht ein jeder einen Vater zum Urheber seiner Geburt? Wer ist nun aus einer Jungfrau allein geboren worden? Dem Propheten lag ja sehr viel daran, diesen Umstand anzuführen. Wessen Geburt ging ein Stern am Himmel voraus und verkündete den Neugeborenen dem Erdkreis? Moses wurde ja bei seiner Geburt von den Eltern versteckt. Von der Geburt Davids bekamen nicht einmal die Nachbarn zu hören, kannte ihn ja doch nicht einmal der große Samuel, mußte er vielmehr erst fragen, ob Isai noch einen weiteren Sohn habe. Auch Abraham wurde, erst groß geworden, seiner Umgebung bekannt. Für die Geburt Christi aber ward nicht ein Mensch Zeuge, sondern ein leuchtender Stern stand am Himmel, von wo er auch herniedergestiegen war.</p>
      <h2>36</h2><p>Wo wäre sodann je der König gewesen, der, noch nicht imstande, Vater oder Mutter zu rufen, schon regiert und im Kampf gegen seine Feinde Trophäen erbeutet hätte? Ist nicht David im dreißigsten Lebensjahre König geworden und Salomo im Jünglingsalter? Hat nicht Joas mit sieben Jahren die Herrschaft angetreten und der noch spätere Josias mit etwa sieben Jahren die Regierung übernommen? Doch gleichwohl konnten auch sie mit diesem Alter Vater und Mutter rufen. Wer ist also der, der fast schon vor seiner Geburt herrscht und den Feinden die Beute abnimmt? Wo ist ein solcher König in Israel und Juda aufgestanden, die Juden mögen nachforschen und Antwort geben -, auf den alle Völker ihre Hoffnung gesetzt und Frieden gefunden haben? Fanden jene nicht vielmehr überall ihren Gegner? Denn solange Jerusalem stand, lag es in ständigem Krieg mit ihnen, und alle kämpften wider Israel: Die Assyrer bedrängten sie, die Ägypter verfolgten sie, und die Babylonier griffen sie an. Ja, ganz auffallend hatten sie sogar die Syrer in der Nachbarschaft zu ihren Feinden. Oder hat nicht David die Moabiter bekriegt und die Syrer geschlagen? Mußte nicht Josias vor den Nachbarn auf der Hut sein, und hatte nicht Ezechias die Brutalität des Senacherib zu fürchten? Ist nicht gegen Moses Amalek ins Feld gerückt, und haben nicht die Amorrhäer sich gegen ihn gestellt? Haben nicht die Einwohner von Jericho gegen Josue, den Sohn des Nave, gekämpft? Und haben jemals die Heidenvölker eine freundschaftliche Stellung Israel gegenüber eingenommen? Wer nun der ist, auf den die Völker ihre Hoffnung gesetzt haben, das muß man nachsehen. Da muß er sein, da ja der Prophet unmöglich lügen kann. Wo hat aber je einer der heiligen Propheten oder alten Patriarchen zum Heil der Welt den Kreuzestod erduldet, oder wurde verwundet und hinweggerafft zur Genesung aller? Wann ging ein Gerechter oder König hinab nach Ägypten, und stürzten bei dessen Ankunft die Götzen der Ägypter zusammen? Abraham ging hinab; aber der Götzendienst blieb über all nach wie vor. Moses ist dort geboren worden, und trotzdem verblieben die Verirrten dort bei ihrem Götzenkult.</p>
      <h2>37</h2><p>Wo liest man in der Schrift von einem bezeugt, daß er an Händen und Füßen durchbohrt worden, oder daß er überhaupt am Holze gehangen und am Kreuze zum Heile aller verstorben sei? Abraham starb an Naturnachlaß im Bette; auch Isaak und Jakob streckten ihre Füße und verschieden im Bette. Moses und Aaron starben auf dem Berge, David zu Hause, ohne einem Anschlag der Völker zum Opfer gefallen zu sein. Denn obschon Saul ihm nach dem Leben trachtete, entrann er doch mit heiler Haut. Isaias ward zwar zersägt, aber er hing nicht am Holze; Jeremias wurde mit Schmach überhäuft, starb aber nicht auf einen Richterspruch hin. Ezechiel mußte leiden, aber nicht für das Volk, sondern weil er ungünstige Prophezeiungen über das Volk machte. Sodann waren alle diese Leidensheroen Menschen wie alle anderen - vermöge ihrer gleichen Natur. Der aber in den Schriften als Dulder für alle gemeint ist, wird nicht einfach Mensch, sondern Leben aller genannt, auch wenn er der Natur nach den Menschen ähnlich war. „Denn ihr werdet“, heißt es, „euer Leben vor euren Augen hängen sehen“, und: „Wer wird seinen Stammbaum verfolgen?“ Bei allen Heiligen kann man nämlich den Stammbaum erfahren und ihn zurück bis zum Ursprung verfolgen. Bei dem aber, der das Leben ist, läßt sich laut den göttlichen Aussprüchen der Stammbaum nicht angeben. Wer ist es nun, von dem die göttlichen Schriften solches berichten? Oder wer ist so erhaben, daß auch die Propheten über ihn so Großes vorhersagen? Ja fürwahr, kein anderer läßt sich ausfindig machen in den Schriften als der gemeinsame Heiland aller, Gott der Logos, unser Herr Jesus Christus. Er ist es ja, der aus einer Jungfrau hervorgegangen und als Mensch auf Erden erschienen ist, und dessen fleischliche Geburt sich nicht verfolgen läßt. Niemand kann nämlich seinen leiblichen Vater nennen, da sein Leib nicht von einem Mann, sondern nur von einer Jungfrau stammt. So also, wie man ein Stammregister von David, Moses und all den Patriarchen aufstellen kann, läßt sich die fleischliche Abstammung des Heilands aus einem Mann nicht verfolgen. Er ist es auch, der die Geburt seines Leibes durch einen Stern anzeigen ließ. Es mußte doch der Logos, der vom Himmel herabkam, auch vom Himmel her ein Zeichen geben; es mußte der König in dem Augenblick, da er hervortrat, von der ganzen Schöpfung deutlich erkannt werden. Gewiß ward er in Judäa geboren, und aus Persien kamen sie, um ihn anzubeten. Er ist es, der auch schon vor seiner Erscheinung im Leibe den Sieg über seine Widersacher, die Dämonen, errang und über den Götzendienst triumphierte. So schwören denn auch überall alle Völker der Vätersitte und der Gottlosigkeit des Götzendienstes ab und setzen nunmehr ihre Hoffnung auf Christus und verschreiben sich ihm, wie man solches mit eigenen Augen sehen kann. Denn erst damals hat die Gottlosigkeit der Ägypter ein Ende genommen, als der Herr aller Dinge wie auf einer Wolke schwebend im Leibe dorthin kam, den Götzenwahn aufhob und alle zu sich und durch sich zum Vater bekehrte. Er ist es, der gekreuzigt worden im Angesichte der Sonne, der Schöpfung und derer, die an ihm das Todesurteil vollstreckten. Und durch seinen Tod ist für alle das Heil gekommen und ist die ganze Natur erlöst worden. Er ist das Leben aller, der wie ein Schaf zum Heile aller seinen Leib als Entgelt dem Tode überantwortete, mögen auch die Juden es nicht glauben.</p>
      <h2>38</h2><p>Wenn ihnen aber das nicht ausreichend scheint, so mögen sie sich mit anderen Weissagungen, die sie auch selbst wieder kennen, überzeugen lassen. Von wem sagen denn die Propheten: „Offenbar ward ich jenen, die mich nicht suchten; ich ward gefunden von jenen, die nach mir nicht fragten. Ich sprach: Siehe, hier bin ich - zu einem Volke, das meinen Namen nicht anrief; ich streckte aus meine Hände nach einem unfolgsamen, widerspenstigen Volke“. Wer ist nun der, der sichtbar geworden ist? könnte man die Juden fragen. Ist es nämlich der Prophet, dann sollen sie sagen, wann er sich verborgen hat, um später zu erscheinen. Was ist aber das für ein Prophet, der aus der Verborgenheit an die Öffentlichkeit getreten ist und am Kreuze seine Arme ausgespannt hat? Gewiß keiner von den Gerechten, allein nur der Logos, der, von Natur unkörperlich, unsertwegen im Leibe erschienen ist und für alle gelitten hat. Genügt ihnen auch das nicht, so mögen sie noch durch andere Stellen beschämt werden, wenn sie sich denn so klar widerlegt sehen. Denn so sagt die Schrift: „Werdet stark, ihr ermatteten Hände und ihr geschwächten Kniee! Seid getrost, ihr Kleingläubigen; fasset Mut, fürchtet euch nicht! Seht, unser Gott vergilt das Gericht; er selbst wird kommen und uns erretten. Dann werden sich öffnen die Augen der Blinden, und die Ohren der Tauben werden hören. Dann wird springen wie ein Hirsch der Lahme, und deutlich wird werden die Zunge der Stammelnden“. Was vermögen sie nun hierüber zu sagen, oder wie mögen sie überhaupt demgegenüber ihr Auge erheben? Denn die Prophetie kündigt das Kommen Gottes an; die Zeichen geben aber auch die Zeit seiner Ankunft an. Denn das Sehen der Blinden, das Gehen der Lahmen, das Hören der Tauben, das Lösen der Zunge bei den Stammelnden, das sagen sie für die Zeit der göttlichen Ankunft vorher. Wann nun sind solche Zeichen in Israel geschehen? Oder wo ist so etwas in Judäa geschehen? Sie sollen doch antworten! Ein Aussätziger Naaman wurde gereinigt; doch kein Tauber erhielt das Gehör noch konnte ein Lahmer gehen. Einen Toten erweckten Elias und Elisäus; aber nicht erlangte ein Blindgeborener das Gesicht. Freilich ist es auch um eine Totenerweckung etwas wahrhaft Großes; aber es ist eben doch nicht ein solches Wunder, wie es vom Heiland erwartet wurde. Denn wenn die Schrift den Vorgang vom Aussätzigen und dem toten Sohn der Witwe nicht verschwiegen hat, dann hätte sie auch einen wirklichen Vorfall einer Lahmen- oder Blindenheilung sicher nicht übergangen. Da aber die Schriften sich hierüber ausschweigen, so ist offenbar etwas Derartiges früher nicht vorgekommen. Wann wäre nun das vorgekommen, wenn nicht damals, als der Logos Gottes selbst im Leibe erschienen ist? Wann aber ist er erschienen, wenn nicht damals, als die Lahmen umhergingen, die Stammelnden verständlich redeten, die Tauben hörten und die Blindgeborenen sahen? Eben darum sprachen damals auch die Juden, die Dinge mitansahen, wovon sie zuvor nie gehört hatten: „Solange die Welt steht, hat man noch nie gehört, daß einer einem Blindgeborenen die Augen geöffnet hat. Wenn also dieser nicht von Gott wäre, könnte er solche Dinge nicht tun“.</p>
      <h2>39</h2><p>Doch vielleicht sehen sie sich jetzt selbst außerstande, wider so offenbare Wahrheiten zu kämpfen und wollen das nicht bestreiten, was geschrieben steht, behaupten aber, daß sie darauf noch warten und daß Gott der Logos noch nicht erschienen sei. Denn das sagen sie ja immer und immer wieder und trotzen ganz ausgeschämt offenkundigen Wahrheiten. Doch auch hierin, ja hierin vor allem sollen sie ihre Widerlegung finden, nicht von uns, sondern von dem hochweisen Daniel, der den Zeitpunkt wie die göttliche Ankunft des Heilandes ankündigte mit den Worten: „Siebzig Wochen sind bemessen für dein Volk und für die heilige Stadt, um zu vollenden die Schuld und zu besiegeln die Sünden, zu beendigen die Ungerechtigkeiten und zu sühnen die Missetaten, zu bringen ewige Gerechtigkeit und zu besiegeln das Gesicht und die Propheten und zu salben den Heiligen der Heiligen. Du sollst wissen und merken: Von der Zeit an, da der Ausspruch erfolgt, daß Jerusalem wieder aufgebaut werden soll, bis daß der Gesalbte als Führer kommt“. Vielleicht können sie wenigstens für die anderen Stellen Ausreden finden und die Schriftworte für eine erst kommende Zeit gelten lassen. Was aber können sie auf die Stelle sagen oder wie ihr begegnen, in der ja der Gesalbte vorausgesagt wird und der, welcher gesalbt werden soll, nicht einfach als Mensch, sondern als der Heilige der Heiligen verkündet wird, und wonach bis zu seiner Ankunft Jerusalem bestellt und dann Prophet und Gesicht in Israel ein Ende nehmen? Gesalbt wurden einst David, Salomo und Ezechias; aber anderseits blieb auch Jerusalem und die Stätte bestehen und die Propheten prophezeiten weiter: Gad, Asaph, Nathan und nach ihnen Isaias, Osee, Amos und andere. Dann wurden auch die Gesalbten selbst heilige Männer genannt, nicht aber Heilige der Heiligen. Wenn sie aber auf die Gefangenschaft verweisen und sagen, daß ihr zufolge kein Jerusalem mehr bestehe, was wollen sie dann von den Propheten sagen? Denn als vor Zeiten das Volk nach Babylon hinabzog, waren daselbst Daniel und Jeremias, und es prophezeiten Ezechiel, Aggäus und Zacharias.</p>
      <h2>40</h2><p>Demnach fabeln die Juden, wenn sie den bereits eingetretenen Zeitpunkt in die Zukunft verlegen. Wann verschwand denn Prophet und Gesicht aus Israel, wenn nicht damals, als Christus, der Heilige der Heiligen, kam? Ein Zeichen und ein ganz wichtiger Beweis für die Ankunft Gottes des Logos ist doch die Tatsache, daß Jerusalem nicht mehr besteht, kein Prophet mehr erweckt, noch auch solchen ein Gesicht zuteil wird - und ganz mit Recht. Wenn ja der Angekündigte da ist, wozu dann noch solche, die ihn anzeigen? Und wenn die Wahrheit da ist, wozu dann noch der Schatten? Eben deshalb prophezeiten sie ja auch, bis der kam, der die Gerechtigkeit selber ist und die Sünden aller tilgt. Deshalb stand auch Jerusalem so lange, damit sie dort zuvor die Typen der Wahrheit studieren könnten. Als dann der Heilige der Heiligen ankam, da wurde dann mit Recht auch Gesicht und Prophetie besiegelt und nahm die Herrschaft Jerusalems ein Ende. Denn nur so lange wurden bei ihnen Könige gesalbt, bis der Heilige der Heiligen gesalbt wurde. Auch Jakob weissagt, daß das Königtum der Juden bis auf ihn bestehen bleibe, wenn er sagt: „Nicht wird der Herrscher aus Juda weichen und der Führer aus seinen Lenden, bis kommen wird, was ihm hinterlegt ist; und er ist die Erwartung der Völker“. Daher hat auch der Heiland selbst laut verkündet: „Das Gesetz und die Propheten bis auf Johannes haben geweissagt“. Wenn es nun bei den Juden jetzt noch einen König oder einen Propheten oder ein Gesicht gibt, dann leugnen sie mit Recht die Ankunft Christi. Gibt es aber keinen König, kein Gesicht mehr, ist vielmehr jetzt jegliche Prophetie besiegelt und Stadt und Tempel erobert, warum sind sie dann so gottlos und sündigen so schwer, daß sie trotz der Geschehnisse, die sie vor Augen sehen, den leugnen, der sie verwirklicht hat, Christum? Wenn sie sehen, wie sogar die Heiden ihre Götzen verlassen und durch Christus ihre Hoffnung auf den Gott Israels setzen, wie mögen sie da noch Christum leugnen, der aus der Wurzel Jesse stammt dem Fleische nach und nunmehr die Herrschaft hat? Wenn die Heidenvölker einen anderen Gott verehrten als den Gott Abrahams, Isaaks, Jakobs und Mosis, dann könnten sie wenigstens wieder mit Recht mit der Ausrede kommen, Gott sei nicht gekommen. Wenn sie aber den Gott verehren, der dem Moses das Gesetz gegeben und dem Abraham die Verheißung gegeben hat, und dessen Logos die Juden schmählich verunehren, die Heiden aber verehren, warum sollen sie nicht zur Einsicht kommen, oder vielmehr warum wollen sie es geflissentlich übersehen, daß der von den Schriften geweissagte Herr den Erdkreis erleuchtet hat und ihm leiblich erschienen ist? So hat ja die Schrift gesagt: „Gott der Herr ist uns erschienen“, und wiederum: „Er sandte seinen Logos und heilte sie“, und abermals: „Nicht ein Bote, nicht ein Engel, sondern der Herr selbst hat sie errettet“. Es geht ihnen aber ähnlich wie einem geistig Verrückten, der die von der Sonne beleuchtete Erde sieht, die sie erhellende Sonne aber wegstreitet. Was hätte denn auch der, den sie erwarten, nach seiner Ankunft noch mehr zu tun? Die Heidenvölker berufen? Doch sie sind schon berufen. Oder dem Propheten, dem König und dem Gesicht ein Ende setzen? Auch das ist schon geschehen. Oder die Gottlosigkeit des Götzenkultes bloßstellen? Sie ist aber bereits widerlegt und gerichtet. Aber den Tod ohnmächtig machen? Das ist aber bereits geschehen. Was ist also noch nicht geschehen, was Christus tun mußte? Oder was bleibt noch übrig und ist noch nicht in Erfüllung gegangen, daß die Juden sich darob erfreuen und im Unglauben verharren könnten? Denn wenn sie, wie wir sehen, weder einen König, noch einen Propheten, noch ein Jerusalem, noch ein Opfer, noch ein Gesicht haben, vielmehr der ganze Erdkreis von der Erkenntnis Gottes angefüllt ist und auch die Heiden von ihrer Gottlosigkeit weg zum Gott Abrahams sich bekehren durch den Logos, unseren Herrn Jesum Christum, so muß es selbst den Ausgeschämtesten klar sein, daß Christus bereits gekommen ist, daß er alle ohne Ausnahme mit seinem Lichte erleuchtet und die wahre und göttliche Lehre über seinen Vater gebracht hat. So kann man damit und mit noch weiteren Beweisen aus den göttlichen Schriften die Juden schlagend widerlegen.</p>
      <h2>41</h2><p>Was aber die Heiden betrifft, so mag man sich höchlichst wundern, daß sie das verspotten, was doch gar nicht lächerlich ist, für ihre eigene Schmach aber blind sind, die sie, ohne es zu merken, in Holzstücken und Steinen bloßstellen. Da wir aber um Beweise für unsere Behauptung gar nicht verlegen sind, wohlan, so wollen wir auch diese Heiden mit guten Gründen zuschanden machen, vornehmlich mit Berufung darauf, was wir selber sehen. Was gäbe es denn bei uns Ungereimtes oder Lächerliches als äußersten Falles unsere Behauptung, der Logos sei im Leibe erschienen? Doch werden sie wohl auch selbst zugestehen, daß das nicht in widersinniger Weise vor sich gegangen ist, falls sie es wirklich mit der Wahrheit ernst nehmen. Wenn sie nun überhaupt das Dasein eines Logos Gottes leugnen, dann tun sie etwas Überflüssiges, wenn sie über das spotten, wovon sie nichts wissen. Geben sie aber einen Logos Gottes zu und bekennen sie, daß er der Lenker des Alls ist, daß in ihm der Vater die Schöpfung zustande gebracht hat, daß durch seine Vorsehung alles erleuchtet und belebt wird und besteht, und daß er über alles herrscht, so daß er selbst aus den Werken seiner Vorsehung erkannt wird und durch ihn der Vater, so sieh doch, bitte, ob sie nicht, ohne es zu wissen, sich selbst lächerlich machen. Die Welt erklären die griechischen Philosophen für einen großen Körper und sagen damit eine Wahrheit. Wir sehen ja, wie sie und ihre Teile in die Sinne fallen. Wenn also der Logos in der Welt wie in einem Körper ist, und wenn er in das Ganze und in all die Einzelteile eingegangen ist, wie soll es dann sonderbar oder ungereimt sein, wenn wir sagen, daß er auch in einen Menschen eingegangen ist? Denn wenn es ungereimt klingt, daß er überhaupt in einem Körper wohnt, so wäre es auch ungereimt, wenn er im Weltall Wohnung genommen hätte und alles durch seine Vorsehung erleuchtete und bewegte; denn ein Körper ist auch das Weltall. Wenn es aber angeht, daß er in die Welt kommt, und daß er im Ganzen sich zu erkennen gibt, so wird es auch angehen, wenn er auch in einem menschlichen Körper sich offenbart und dieser von ihm erleuchtet wird und seine Wirksamkeit erhält. Ein Teil des Ganzen ist ja auch das Menschengeschlecht. Und wenn es nicht angeht, daß ein Teil sein Medium für die Erkenntnis Gottes wird, dann geht es wohl erst recht nicht an, daß er durch die ganze Welt sich zu erkennen gibt.</p>
      <h2>42</h2><p>Wie einer angesichts der Tatsache, daß der ganze Körper vom Menschen in Bewegung gesetzt und beleuchtet wird, mit seiner Behauptung, es sei ungereimt, die Kraft des Menschen auch in der Fußzehe anzunehmen, wohl für unverständig erachtet würde, da er trotz seines Zugeständnisses, daß er den ganzen Körper durchdringt und bewegt, ihn nicht im Einzelteile sein ließe, so sollte auch der, der gläubig zugibt, daß der Logos Gottes im Weltall ist und das Weltall von ihm beleuchtet und bewegt wird, es nicht ungereimt finden, wenn ein menschlicher Körper von ihm bewegt und erleuchtet wird. Wenn sie aber deshalb, weil das Menschengeschlecht kreatürlich und aus dem Nichts entstanden ist, es nicht für passend finden, daß wir von einer Erscheinung des Heilandes in einem Menschen reden, so müssen sie ihn auch von der ganzen Schöpfung ausschließen; denn auch sie ist durch den Logos aus dem Nichts ins Dasein getreten. Wenn es aber nicht ungereimt klingt, daß der Logos in der Welt weilt trotz ihrer Kreatürlichkeit, dann ist es doch auch nicht ungereimt, wenn er in einem Menschen sich befindet. Denn was sie vom Ganzen denken wollten, das müssen sie auch vom Teile annehmen; ein Teil vom Ganzen ist ja, wie ich vorhin sagte, auch der Mensch. So ist es also durchaus nicht ungehörig, wenn der Logos sich in einem Menschen befindet und alles von ihm und durch ihn Licht, Bewegung und Leben erhält, wie auch ihre Schriftsteller sagen: „In ihm leben wir, bewegen wir uns und sind wir“. Was sagen wir also Lächerliches, wenn (tatsächlich) der Logos das, worin er weilt, als Werkzeug benützt, um sich zu offenbaren. Wäre er nicht in ihm gewesen, so hätte er sich seiner auch nicht bedienen können. Wenn wir sodann bereits zugegeben haben, daß er im Ganzen und in den Einzelteilen ist, wie sollte es unglaublich sein, wenn er sich in dem, worin er weilt, auch sichtbar macht. Denn wenn er mit seinen Kräften ganz in die Einzelteile wie ins Ganze eingeht und alles reichlich versieht, und wenn er durch die Sonne oder den Mond oder den Himmel oder die Erde oder das Wasser oder Feuer sich offenbaren wollte, so würde es wohl niemand beanstanden, wenn er sich auf diese Weise vernehmen ließe und sich und seinen Vater zu erkennen gäbe; er schließt ja alles in einem Akt in sich zusammen und ist mit allem und in jedem Einzelteile zugegen und offenbart sich, ohne gesehen zu werden. Geradeso ist es wohl auch nicht ungereimt, wenn er, der alles ordnet und das Ganze belebt und den Menschen sich kundgeben wollte, sich eines menschlichen Leibes als eines Werkzeuges zur Mitteilung der Wahrheit und zur Offenbarung des Vaters bedient hat. Ein Teil vom Ganzen ist ja auch die Menschheit. Und wie der Verstand, der den ganzen Menschen durchwaltet, durch ein Glied des Leibes, die Zunge, sich offenbart, und dabei doch wohl niemand behauptet, dadurch verliere das Wesen des Verstandes, so erscheint es doch wohl auch nicht unpassend, wenn der Logos, der in allem ist, einen Menschen als Werkzeug benützt hat. Denn wenn es, wie vorhin gesagt, unziemlich war, daß er einen Leib zum Werkzeug nahm, dann gehörte es sich auch nicht, daß er im Weltall weilt.</p>
      <h2>43</h2><p>Wenn sie nun sagen: Warum erschien er denn nicht in anderen schöneren Teilen der Schöpfung, und warum hat er sich denn nicht eines herrlicheren Werkzeuges, etwa der Sonne, des Mondes, der Sterne, des Feuers oder des Äthers bedient, sondern nur eines Menschen? - so mögen sie wissen, daß der Herr nicht herniederkam, um zu prunken, sondern um die Leidenden zu heilen und zu lehren. Denn es wäre Ostentation gewesen, nur zu erscheinen und die Augenzeugen perplex zu machen. Wer aber heilen und lehren will, hat nicht einfach zu kommen, sondern auf das Wohl der Notleidenden bedacht zu sein und sich bei der Ankunft nach ihrem Bedürfnis und Befinden zu richten, um nicht durch überflüssigen Aufwand für die Notleidenden eben die Bedürftigen zu verwirren, und ihnen so die Erscheinung Gottes unnütz würde. Nun gab es unter den Kreaturen keine, die sich in ihrem Denken über Gott verirrt hatte als allein der Mensch. Sonne, Mond, Himmel, Sterne, Wasser, Äther waren doch wahrhaftig nicht von der Ordnung abgewichen, sondern dank ihrer Erkenntnis des Logos, ihres Schöpfers und Königs, verblieben sie, wie sie geschaffen worden sind. Nur die Menschen kehrten sich vom Guten ab, bildeten sich dann das Nichtseiende ein anstatt der Wahrheit und übertrugen die Gott gebührende Ehre und den Begriff von ihm auf Dämonen und Menschen in Steinfiguren. Da es nun der Güte Gottes nicht entsprach, solch schwere Verirrung ruhig mitanzusehen, anderseits aber auch die Menschen ihn als Ordner und Lenker im Weltall nicht erkennen konnten, deshalb nimmt er billig einen Teil vom Ganzen als Werkzeug an, den menschlichen Leib, geht in ihn ein, damit die Menschen ihn, den sie im Ganzen nicht hätten erkennen können, wenigstens im Teile erkannten, und damit sie ihn, dessen unsichtbare Macht sie nicht schauen konnten, wenigstens aus Gleichartigem erschließen und erkennen könnten. Denn als Menschen werden sie durch einen dem ihrigen gleichen Körper und durch die in ihm gewirkten Werke rascher und sicherer der Erkenntnis seines Vaters näherkommen können, wenn sie einsehen, daß seine Taten nicht Menschen-, sondern Gotteswerke sind. Wenn sie sodann die Möglichkeit für ungereimt halten, durch die im Leibe vollbrachten Werke den Logos zu erkennen, dann wäre es wieder ungereimt, ihn aus den Werken des Alls zu erschließen. Denn wie er mitten in der kreatürlichen Welt nichts von der Kreatur annimmt, vielmehr allen Dingen von seiner Macht mitteilt, so nahm er auch, wenn er den Leib als Werkzeug benützte, nicht an den Zuständlichkeiten des Leibes teil, heiligte vielmehr selbst den Leib. Denn wenn selbst auch der von den Griechen vielbewunderte Plato sagt, daß der Schöpfer der Welt, wenn er sie in Sturmesdrang sieht und in der Gefahr, in das Reich des Chaos zu versinken, an das Steuerruder der Seele sich setzt und Hilfe bringt und alle Schäden ausbessert, was liegt dann Unglaubliches darin, daß wir sagen, der Logos habe, nachdem die Menschheit sich verirrt hatte, in ihr sich niedergelassen und sei als Mensch erschienen, um sie aus ihrer Bedrängnis durch seine Steuerung und Güte zu erretten?</p>
      <h2>44</h2><p>Doch vielleicht werden sie beschämt dem beipflichten, aber entgegnen wollen: Gott hätte, wenn er einmal die Menschen belehren und erlösen wollte, durch einen bloßen Wink das tun sollen, ohne daß ein Logos mit einem Leibe in Berührung kam, wie er ja auch ehedem verfahren ist, als er die Dinge aus dem Nichts ins Dasein rief. Auf diese ihre Entgegnung könnte man mit Recht erwidern, daß ehedem, da noch nirgends etwas existierte, es nur eines Winkes und bloßen Willensaktes bedurfte, um die Welt zu erschaffen. Als aber der Mensch erschaffen war und das Bedürfnis eintrat, nicht das Nichtseiende, sondern das schon Existierende zu heilen, da war es nur natürlich, daß der Arzt und Heiland in dem bereits Geschaffenen gegenwärtig wurde, um auch das Existierende zu heilen. Erschaffen aber war der Mensch. Deshalb bediente er sich auch eines menschlichen Werkzeuges, des Leibes. Denn wenn der Logos nicht auf diesem Wege hätte kommen sollen, wie hätte er, der sich nun einmal eines Organs bedienen wollte, dann zu uns kommen sollen? Oder woher hätte er dies nehmen sollen, wenn nicht aus dem, was bereits vorhanden war und seiner Gottheit durch die Vermittlung der gleichartigen Natur bedurfte? Denn nicht das Nichtseiende bedurfte der Erlösung, so daß ein bloßer Befehl genügt hätte, sondern der bereits erschaffene Mensch war dem Verderben und Untergang überantwortet. Deshalb hat der Logos gewiß recht passend sich eines menschlichen Werkzeuges bedient und über alles sich verbreitet. Sodann muß man sich auch das sagen, daß das eingetretene Verderben nicht außerhalb des Leibes lag, sondern an ihm haftete, und daß er statt der Verweslichkeit das Leben anziehen mußte, damit wie im Leibe der Tod gekommen ist, so in ihm auch das Leben erstehe. War der Tod außerhalb des Leibes, so mußte auch das Leben außerhalb seiner existiert haben. Haftete aber der Tod am Leibe und herrschte er in ihm über ihn, dann mußte auch das Leben mit dem Leibe sich verbinden, damit der Leib das Leben wieder anziehe und die Verweslichkeit ablege. Zudem wäre der Tod, wenn der Logos außerhalb des Leibes und nicht in ihm gewesen wäre, auf ganz natürliche Weise überwunden worden, da ja der Tod dem Leben gegenüber machtlos ist; aber es wäre eben gleichwohl die Verweslichkeit, die der Leib sich zugezogen hat, geblieben. Deshalb hüllte sich billig der Heiland in einen Leib, damit dank der Vereinigung von Leib und Leben der Leib nicht mehr sterblich im Tode verbliebe, sondern mit der Unsterblichkeit bekleidet sei und dann auferstanden immer unsterblich bleibe. Denn einmal angetan mit der Verweslichkeit, wäre er nicht auferstanden, wenn er nicht das Leben angezogen hätte; anderseits hätte der Tod für sich nicht erscheinen können, sondern nur im Leibe. Deshalb zog er einen Leib an, um den Tod darin zu suchen und dann daraus zu verbannen. Wie hätte der Herr überhaupt sich als das Leben erweisen können, wenn er nicht das Sterbliche belebt hätte? Und wie die Stoppel vom Feuer ganz natürlich verzehrt wird, aber nicht verbrennt, wenn man das Feuer von ihr fernhält, gleichwohl aber Stoppel Stoppel bleibt und die Feuersgefahr zu fürchten hat - denn von Natur droht das Feuer, sie zu verzehren -, aber gefaßt in vielen Amiant, der ja als feuersicher gilt, die Stoppel das Feuer nicht mehr zu fürchten hat, dank der Sicherung, die ihr die feuersichere Hülle gewährt, genau so könnte man auch vom Leib und Tod sagen, daß der Leib, der nur mit einem bloßen Befehl gegen den Tod geschützt worden wäre, gleichwohl wieder entsprechend der Natur der Leiber sterblich und verweslich wäre. Um aber das zu verhüten, hat er den unkörperlichen Logos Gottes angezogen, und so braucht er den Tod nicht mehr zu fürchten noch auch die Verwesung, da er ja das Leben als Hülle trägt und in ihm die Verwesung verschwindet.</p>
      <h2>45</h2><p>So hat also der Logos Gottes folgerichtig einen Leib angenommen und sich eines menschlichen Werkzeuges bedient, um auch den Leib zu beleben und um in gleicher Weise, wie er in der Schöpfung durch die Werke sich offenbart, auch im Menschen sich zu betätigen und sich überall zu zeigen, ohne auch nur eine Stätte gegen seine Gottheit und Erkenntnis abzumessen. Ich sage hier noch einmal, woran ich schon früher erinnert habe: Der Heiland hat dies getan, um, wie er alles ringsum mit seiner Gegenwart erfüllt, so auch alles mit seiner Erkenntnis zu erfüllen, wie auch die göttliche Schrift sagt: „Die ganze Welt ward erfüllt mit der Erkenntnis des Herrn“. Denn mag man zum Himmel aufschauen, man sieht dessen Ordnung; oder man mag, wenn das nicht möglich, nur auf den Menschen sein Augenmerk richten, so gewahrt man aus den Werken seine übermenschliche Macht und erkennt, daß er allein unter den Menschen der Logos Gottes ist. Oder wer sich in die Dämonenwelt verirrt hat und für sie eingenommen ist, der sieht, wie er diese verjagt, und erkennt ihn daraus als ihren Herrn. Oder wer in das Element des Wassers sich versenkt hat und dieses für Gott hält, wie die Ägypter, die das Wasser verehren, der sieht, wie dieses von ihm verwandelt wird und folgert daraus, daß der Herr sein Schöpfer ist. Ja, stiege einer gar in die Unterwelt hinab, und staunte er die Heroen, die dorthin hinabgestiegen sind, als Götter an, so sieht er auch da seine Auferstehung und seinen Sieg über den Tod und schließt daraus, daß auch unter ihnen Christus allein wahrer Herr und Gott ist. Alle Teile der Schöpfung hat ja der Herr berührt, und aller Kreatur die Erlösung und Überzeugung von allem Trug gebracht, wie Paulus sagt: „Er hat die Herrschaften und Gewalten entwaffnet und über sie triumphiert am Kreuz“, damit niemand mehr betrogen werden könnte, vielmehr jeder überall den wahren Logos Gottes fände. Denn wenn so überall ringsumschlossen der Mensch die Gottheit des Logos überall, d. h. im Himmel, in der Unterwelt, im Menschen, auf der Erde walten sieht, so kann er sich nicht mehr über Gott täuschen, betet nur ihn an und erkennt durch ihn recht gut den Vater. Damit werden hoffentlich auch die Heiden sich von uns geschlagen wissen, und zwar mit guten Gründen. Wenn sie aber die Gründe zu ihrer Beschämung nicht hinreichend finden, so mögen sie aus dem, was vor aller Welt sich abspielt, sich vom Gesagten überzeugen lassen.</p>
      <h2>46</h2><p>Wann begannen denn die Menschen, den Götzenkult aufzugeben, wenn nicht von dem Augenblick ab, da Gott, der wahre Logos Gottes, unter den Menschen aufgetreten ist? Wann haben denn die Orakel bei den Griechen und allerorts ein Ende genommen und sind verstummt, wenn nicht mit dem Augenblick, da der Heiland erschienen ist? Wann erwachte die Erkenntnis, daß die sogenannten Götter und Heroen bei den Dichtern einfach nur sterbliche Menschen sind, wenn nicht damals, als der Herr seinen Triumph über den Tod feierte und den Leib, den er angenommen, in der Unverweslichkeit bewahrt hat, da er ihn von den Toten erweckte? Wann sagte man sich los vom Dämonentrug und -wahn, wenn nicht eben damals, als der Logos, die Kraft Gottes, aller und auch ihr Gebieter, um der Ohnmacht der Menschen willen herabgestiegen und auf Erden erschienen ist? Wann begann man, über Zauberkunst und Zauberlehre hinwegzugehen, wenn nicht eben damals, als die Theophanie des Logos unter den Menschen Wirklichkeit geworden ist? Wann hat sich überhaupt die Weisheit der Heiden als Torheit erwiesen, wenn nicht damals, als die wahre Weisheit Gottes auf Erden sich offenbarte? Ehedem war der ganze Erdkreis und jeder Ort im Wahne des Götzenkultes befangen, und nur in den Götzen wähnten die Menschen ihre Götter. Jetzt aber geben die Menschen auf dem ganzen Erdkreis ihren abergläubischen Götzenwahn auf, flüchten sich zu Christus, beten ihn als Gott an und lernen durch ihn auch den Vater erkennen, den sie zuvor nicht kannten. Und wie wunderbar! Es gab verschiedene und abertausend Religionen, und jeder Ort hatte seinen eigenen Götzen; aber keiner ihrer sogenannten Götzen vermochte auch nur im nächsten Nachbarbereich Eingang zu finden, so daß er auch die Nachbarn zu seiner Anbetung bewogen hätte; vielmehr fand er kaum bei seinen Eigenen die gebührende Verehrung, - denn niemand verehrte den Gott des Nachbars, sondern ein jeder hielt seinen eigenen Götzen im Wahne, dieser wäre aller Herr. - Nur Christus wird von allen und überall als ein und derselbe angebetet. Und was der Ohnmacht der Götzen nicht gelungen ist, wenigstens die nächsten Anwohner zu gewinnen, das hat Christus fertiggebracht, indem er nicht nur Nachbarn, sondern einfach die ganze Erde dahin brachte, einen und denselben Herrn anzubeten und durch ihn Gott, seinen Vater.</p>
      <h2>47</h2><p>Auch war ehedem alles voll vom Truge der Orakel, und die Orakel in Delphi, Dodona, Böotien, Lycien, Libyen, Ägypten, bei den Kabiren und die Pythia fesselten die Phantasie der Menschen. Jetzt aber, seitdem Christus überall verkündet wird, hat auch dieser Wahn ein Ende genommen, und es gibt bei ihnen keinen Wahrsager mehr. Einst täuschten die Dämonen mit ihrem Blendwerk die Menschen, ließen sich vornehmlich nieder an Quellen oder Flüssen, im Holz oder Stein und schreckten so mit ihren Gaukeleien die Einfältigen. Jetzt aber, nach der göttlichen Erscheinung des Logos, hat dieser Spuk aufgehört. Mit dem bloßen Kreuzeszeichen verscheucht der Mensch ihren Trug. Ehedem hielten die Menschen die bei den Dichtern erwähnten Götter Zeus, Kronos, Apollo und die Heroen für wirkliche Götter und verehrten sie in ihrem Wahne. Kaum aber war der Heiland unter den Menschen erschienen, da wurden jene bloßgestellt als sterbliche Menschen, und Christus allein ward unter den Menschen als wahrer Gott erkannt, als Gott der Logos Gottes. Was soll man aber von ihrer so hochgehaltenen Zauberkunst sagen? Ehe der Logos erschienen war, spielte sie eine große Rolle bei den Ägyptern, Chaldäern und Indern und setzte die Zuschauer in Staunen. Doch mit der Ankunft der Wahrheit und der Erscheinung des Logos ward auch sie gerichtet und zum Tod verurteilt. Was aber die heidnische Weisheit und das Wortgepränge der Philosophen anlangt, so glaube ich, daß wir darob kein Wort zu verlieren brauchen, liegt doch das Wunder offen da, daß die heidnischen Philosophen mit all ihren Schriften nicht einmal ein paar Leute aus ihrer nächsten Umgebung von der Unsterblichkeit zu überzeugen und zu einem Tugendleben zu führen vermochten, während Christus in einfachen Worten und mit Leuten, die nicht redegewandt waren, den ganzen Erdkreis bevölkerte mit Gemeinden und sie dahinbrachte, den Tod zu verachten, an das Unsterbliche zu denken, über das Zeitliche wegzusehen, auf das Ewige es abzusehen, die Erdenherrlichkeit für nichts zu achten und allein nach dem Himmlischen zu trachten.</p>
      <h2>48</h2><p>Was wir aber hier behaupten, sind keine leeren Worte, sondern die Erfahrung selbst gibt dem das Zeugnis der Wahrheit. Komme, wer da wolle, und achte er auf den sprechenden Beweis in der Tugend der Jungfrauen Christi und der keuschheitsbeflissenen Jünglinge, anderseits in dem Glauben bei einem so großen Chor von Märtyrern. Wer das vorhin Gesagte auf seine Wahrheit prüfen will, der komme doch und mache über den Dämonenspuk, den Orakeltrug und über die Gaukeleien der Zauberkunst das Zeichen des von ihnen geschmähten Kreuzes und spreche den Namen Christi nur aus, dann wird er sehen, wie vor ihm die Dämonen fliehen, die Orakel verstummen, alle Zauberei und Beschwörung abgetan ist. Wer ist also dieser Christus und wie groß ist er, wenn er schon mit seinem Namen und seiner Gegenwart überall alles in Schatten stellt und beseitigt und allein mächtiger ist als alle und den ganzen Erdkreis mit seiner Lehre erfüllt? Sie sollen doch Rede stehen, die Heiden, die gar so sehr spotten, ohne zu erröten! Denn ist er ein Mensch, wie konnte <strong>ein</strong> Mensch die Macht aller ihrer Götter überbieten und deren Nichts mit seiner Kraft erweisen? Nennen sie ihn aber einen Zauberer, wie ist es möglich, daß von einem Zauberer alle Zauberei gebrochen und nicht vielmehr befestigt wird? Hätte er nur den einen und anderen menschlichen Zauberer besiegt oder nur über einen obgesiegt, dann hätten sie wohl mit Recht ihn nur den anderen dank einer größeren Geschicklichkeit überlegen gehalten. Hat aber sein Kreuz über alle Zauberei überhaupt und gar über ihren Namen den Sieg davongetragen, dann ist doch wohl offenbar der Heiland kein Zauberer, da ja auch die von anderen Zauberern angerufenen Dämonen vor ihm wie einem Herrn fliehen. Wer er nun ist, das sollen uns die Heiden sagen, die sich nur aufs Spotten verlegen. Möglich, daß sie sagen, er sei selbst auch ein Dämon gewesen und besitze deshalb solche Kraft. Doch bei solcher Ausrede werden sie für den Spott sicher nicht zu sorgen haben, und schon die obigen Beweise können sie wieder zuschanden machen. Wie kann denn der ein Dämon sein, der die Dämonen vertreibt? Hätte er einfach nur Dämonen ausgetrieben, dann hätte man ganz wohl annehmen können, daß er im obersten der Dämonen die niedrigeren seine Macht fühlen läßt, wie ja ähnlich auch die Juden ihm höhnisch vorwerfen wollten. Wenn aber der ganze Dämonenwahn vor seinem Namen weicht und flieht, dann sind sie offenbar auch hierin im Irrtum befangen, und unser Herr und Heiland Christus ist nicht, wie sie meinen, eine dämonische Macht. Wenn also der Heiland weder ein einfacher Mensch, noch ein Zauberer, noch ein Dämon ist, wenn er vielmehr die Gebilde der Dichter, den Dämonenwahn und die Weisheit der Dichter mit seiner Gottheit überwunden und in den Schatten gestellt hat, so liegt doch wohl klar am Tage und muß von allen zugestanden werden, daß er in Wahrheit der Sohn Gottes ist als der Logos, die Weisheit und die Kraft des Vaters. Deshalb sind auch seine Werke nicht menschlich, sondern übermenschlich. Daß sie in der Tat Gottes Werke sind, ergibt sich schon aus dem Augenschein und aus der Vergleichung mit denen der Menschen.</p>
      <h2>49</h2><p>Denn wo hätte es je einen Menschen gegeben, der nur aus einer Jungfrau sich einen Leib bildete? Oder wo hätte je ein Mensch so viele Krankheiten geheilt wie der gemeinsame Herr aller? Wer hat einem schon bei der Geburt vorhandenen Mangel abgeholfen, und einen Blindgeborenen sehend gemacht? Äskulap wurde von ihnen als Gott verehrt, weil er die Heilkunst ausübte und Kräuter fand für die kranken Körper, die er aber nicht selber aus Erde bildete, sondern dank seiner Naturkunde entdeckte. Doch was bedeutet das im Vergleich zu dem, was der Heiland tat, der nicht bloß eine Wunde heilte, sondern eine Neuschöpfung vornahm und den Körper wiederherstellte? Herkules wird von den Griechen als Gott angebetet, weil er mit seinesgleichen kämpfte und wilde Tiere listig erlegte. Was ist aber das im Vergleich mit den Taten des Logos, der die Menschen von Krankheiten, Dämonen und selbst vom Tode befreite? Dionysos wird bei ihnen verehrt, weil er den Menschen ein Lehrmeister der Trunksucht gewesen war. Aber der wahrhaftige Heiland und Herr des Alls, der die Mäßigkeit gelehrt, wird von ihnen verspottet, Doch genug hiervon! Wo fände sich aber eine Parallele zu den übrigen Wundertaten seiner Gottheit? Wo starb ein Mensch, währenddessen die Sonne sich verfinsterte, die Erde bebte? Siehe doch: bis heute sterben Menschen, und es starben solche schon im Anfange. Wann aber wäre solch ein Wunderzeichen bei ihnen eingetroffen? Oder, um die Taten zu übergehen, die er im Leibe vollbrachte, und nur die Werke nach seiner leiblichen Auferstehung zu erwähnen: wo gab es je einen Menschen, dessen Lehre von einem Ende der Erde bis zum anderen überall als eine und dieselbe Geltung gewonnen hätte, so daß seine Verehrung im Flug die ganze Welt erobert hätte? Oder wenn ja Christus, wie sie meinen, nur ein Mensch wäre und nicht Gott der Logos, warum verhindern es dann ihre Götter nicht, daß seine Verehrung auf die Stätte übergreift, wo sie selber sind, ja daß vielmehr der Logos selbst, wo er hinkommt, mit seiner Lehre ihren Kult beendet und ihr Blendwerk zuschanden macht?</p>
      <h2>50</h2><p>Der Könige und Beherrscher der Erde hat es vor ihm viele gegeben; von vielen Weisen und Magiern bei den Chaldäern, Ägyptern und Indern weiß die Geschichte zu berichten. Welcher von diesen hat nun je - ich sage nicht: nach dem Tode, sondern noch bei Lebzeiten - eine solche Macht entfaltet, daß er die ganze Erde mit seiner Lehre erfüllte und eine solche Menge vom teuflischen Götzenwahn abbrachte, wie unser Heiland von den Götzen weg zu sich bekehrte? Die heidnischen Philosophen haben vieles mit überzeugender Kraft und in kunstvoller Darstellung geschrieben. Vermochten sie einen Erfolg aufzuweisen wie das Kreuz Christi? Bis zu ihrem Lebensende fanden ihre Sophismen Glauben. Nein, noch zu ihren Lebzeiten wurde das, was ihnen sicher schien, Gegenstand wechselseitiger Kontroverse, und sie verlegten sich auf eine gegenseitige Bekämpfung. Aber ganz auffallend lehrte der Logos Gottes in einer mehr als einfachen Sprache und stellte doch damit die ersten Sophisten in Schatten, verdrängte ihre Lehren, zog alle an sich und füllte seine Kirchen. Und es ist gewiß wunderbar, daß er die Großsprecherei der Weisen über die Götzen damit zum Verstummen brachte, daß er als Mensch in den Tod ging. Wessen Tod vertrieb denn je die Dämonen? Oder wessen Tod fürchteten denn die Dämonen je so wie den Tod Christi? Wo immer der Name des Heilandes genannt wird, da weicht auch jeglicher böse Geist. Wer hat die Menschen von den Leidenschaften des Herzens so freigemacht, daß die Unkeuschen jetzt keusch leben, die Mörder nicht mehr zum Mordstahl greifen, und die männlich stark werden, die zuvor im Banne feiger Furcht standen? Und wer hat überhaupt die Barbaren- und Heidenvölker überall so weit gebracht, daß sie ihre Wildheit ablegten und friedliche Gesinnung annahmen, wenn nicht der Glaube an Christus und das Zeichen des Kreuzes? Wer anders hat die Menschen im Glauben an die Unsterblichkeit so sehr bestärkt wie das Kreuz Christi und die Auferstehung seines Leibes? Denn obschon die Heiden alle möglichen Lügen fertigbrachten, so konnten sie eine Auferstehung ihrer Götzen sich doch nicht einbilden, da sie überhaupt nicht mit der Möglichkeit rechneten, daß der Leib nach dem Tod noch fortbestehen könne. Und hierin möchte man ihnen am ehesten rechtgeben, insofern sie in einer solchen Schlußfolgerung die Ohnmacht ihres Götzenkultes bewiesen, dagegen Christus die Macht zugestanden, so daß alle auch daraufhin ihn als Gottes Sohn erkennen könnten.</p>
      <h2>51</h2><p>Wo wäre auch der Mensch, der nach seinem Tode oder schon zu Lebzeiten die Jungfräulichkeit gelehrt und diese Tugend unter Menschen für wohl möglich gefunden hätte? Aber Christus, unser Heiland und König aller Dinge, fand mit seiner diesbezüglichen Lehre solchen Anklang, daß selbst Kinder, die das gesetzliche Alter noch nicht erreicht haben, die über das Gebot hinausgehende Jungfräulichkeit geloben. Welcher Sterbliche vermochte je solche Strecken zu durchqueren, zu den Skythen, Äthiopiern, Persern, Armeniern, Gothen oder zu den Völkern, die man jenseits des Ozeans loziert, oder die über Hyrkanien hinauswohnen, oder überhaupt (auch nur) zu den Ägyptern und Chaldäern zu gelangen, die der Magie zugetan und außergewöhnlich abergläubisch und sittenroh sind, und dort von Tugend und Keuschheit und gegen den Götzenkult zu predigen, wie der Herr aller, die Kraft Gottes, unser Herr Jesus Christus getan hat? Er hat diesen nicht nur durch seine Jünger gepredigt, sondern sie auch so weit gebracht, daß sie ihre Sittenroheit ablegten und jetzt nicht mehr die Götter ihrer Väter verehren, sondern zur Erkenntnis seiner gelangen und durch ihn den Vater anbeten. Denn vor Zeiten, da die Griechen und Barbaren noch den Götzen dienten, lagen sie im Krieg gegeneinander und waren gegen eigene Stammesgenossen grausam. Es war überhaupt nicht möglich, über Land oder Meer zu reisen, ohne seine Hand zu bewaffnen - eben wegen ihrer unaufhörlichen gegenseitigen Befehdung. Ja, ihr ganzer Lebenslauf war ein Waffengang; das Schwert war ihr Stock und ihre einzige Rettung. Doch, wie vorhin gesagt, mochten sie auch ihren Götzen dienen und ihren Dämonen Opfer bringen, der teuflische Götzenwahn ließ bei ihnen, die in solcher Verfassung waren, natürlich keine sittliche Umwandlung zu. Als sie aber zur Lehre Christi übertraten, da ließen sie auffallend, tief im Herzen gerührt, von der mordlustigen Grausamkeit ab und denken jetzt nimmer an Krieg; vielmehr hegen sie jetzt nur mehr Gesinnungen des Friedens und der Freundschaft.</p>
      <h2>52</h2><p>Wer hat nun solches fertiggebracht, oder wer hat die im Frieden geeint, die zuvor sich haßten, wenn nicht eben der geliebte Sohn des Vaters, der gemeinsame Heiland aller, Jesus Christus, der in seiner Liebe um unseres Heiles willen alles ertragen hat? Schon vor Zeiten war der Friede, der mit ihm anbrechen sollte, geweissagt in den Worten der Schrift: „Ihre Schwerter werden sie zu Pflugscharen umschmieden und ihre Lanzen zu Sicheln; nicht mehr wird Volk gegen Volk zum Schwerte greifen, und sie werden nicht mehr auf den Krieg sich einüben“. Und es klingt dies doch recht glaubwürdig, wenn noch jetzt die roh gesitteten Barbaren, solange sie eben den Götzen opfern, widereinander wüten und keine Stunde ohne das Schwert sein können, sobald sie aber von der Lehre Christi hören, alsbald vom Krieg zum Feldbau übergehen und die Hand, anstatt mit dem Schwert sie zu bewaffnen, zum Gebet erheben. Ja, ganz allgemein waffnen sie sich jetzt, anstatt zu kriegen gegen ihresgleichen, gegen den Teufel und die bösen Geister, um sie in Keuschheit und Seelenstärke niederzuringen. Das ist aber doch ein sichtlicher Beweis für die Gottheit des Heilandes, wenn die Menschen das, was sie von den Götzen nicht lernen konnten, von ihm gelernt haben, wie es anderseits nicht unwesentlicher Beleg ist für die Ohnmacht und Nichtigkeit der Dämonen und Götzen. Die Dämonen waren sich ja ihrer Ohnmacht wohl bewußt; deshalb hetzten sie ehedem die Menschen zum Krieg gegeneinander, damit sie nicht vom Hader unter sich abließen und dann gegen die Dämonen den Kampf aufnähmen. Wahrhaftig, die Jünger Christi befehden nicht sich gegenseitig, sondern setzen sich mit ihren guten Sitten und einem tugendhaften Wandel gegen die Dämonen zur Wehr, verjagen sie, schlagen selbst den obersten, den Teufel, sind keusch in ihrer Tugend, halten stand in den Versuchungen, harren aus in den Mühsalen, erdulden Mißhandlungen und machen sich nichts daraus, wenn sie ausgeraubt werden, und gewiß auffallend: sie achten nicht des Todes und werden Märtyrer für Christus.</p>
      <h2>53</h2><p>Und um noch <strong>einen</strong>, und zwar ganz auffallenden Beweis für die Gottheit des Heilandes anzuführen: Wann hat denn je ein bloßer Mensch oder Zauberer oder Herrscher oder König für sich allein mit so vielen sich zu messen vermocht und zu kämpfen wider den ganzen Götzenkult, gegen das ganze Heer der Dämonen, gegen alle Zauberei und alle Weisheit der Heiden, da sie noch soviel galten und auf dem Höhepunkt waren und alle Welt in Staunen setzten, und mit <strong>einem</strong> Schlag allen gegenüberzutreten wie unser Herr, der wahre Logos Gottes, der unsichtbar einen jeden über seinen Götzenwahn aufklärt und allein alle Menschen allen (Götzen) abwendig macht, so daß die, die zuvor vor den Götzen auf die Erde sich niederwarfen, diese nunmehr mit Füßen treten, die bewunderten Größen der Magie ihre Bücher verbrennen und die Weisen die Erklärung der Evangelien allem anderen vorziehen? Die Götzen, die sie zuvor anbeteten, geben sie auf und beten den an, den sie als Gekreuzigten zuvor verspotteten, Christum, und bekennen ihn als Gott. Und ihre sogenannten Götter werden durch das Kreuzeszeichen verscheucht, der gekreuzigte Heiland aber wird auf dem ganzen Erdkreis als Gott und Gottes Sohn verkündigt. Die Götter, welche die Heiden anbeten, werden von ihnen wegen ihrer Schändlichkeit verworfen; diejenigen aber, die die Lehre Christi annehmen, führen ein züchtigeres Leben als jene. Wenn nun dies und Ähnliches nur Menschenwerk ist, so zeige und beweise doch mal einer, wer immer nur will, ein Gleiches auch für die früheren Zeiten. Wenn aber diese Erscheinungen nicht als Menschenwerk, sondern als Gottes Werk erscheinen und das auch wirklich sind, warum versteigen sich denn die Ungläubigen zu solcher Gottlosigkeit, daß sie den Herrn nicht erkennen, der das gewirkt hat? Es geht ihnen ja ähnlich so wie denen, die aus den Werken der Schöpfung Gott, ihren Schöpfer, nicht erkennen. Denn wenn sie seine Gottheit aus seiner Macht, die sich auf alles erstreckt, erkannten, so hätten sie damit auch die Erkenntnis gewonnen, daß auch die im Leibe vollbrachten Werke Christi nicht die eines Menschen sind, sondern Taten des Heilandes aller, des Gott-Logos. Hätten sie solche Erkenntnis gehabt, „dann hätten sie“, wie Paulus sagte, „den Herrn der Herrlichkeit nicht gekreuzigt“.</p>
      <h2>54</h2><p>Wie also einer, der den von Natur unsichtbaren und überhaupt nicht sichtbaren Gott schauen will, ihn aus seinen Werken erkennt und begreift, so möge auch der, welcher Christum mit seinem Geiste nicht sieht, ihn wenigstens aus den Werken des Leibes erkennen und prüfen, ob es Menschen- oder Gotteswerke sind. Sind es Menschenwerke, dann mag er spotten; sind es aber nicht Menschen-, sondern Gotteswerke, dann soll er zur Einsicht kommen und nicht spotten über das, was keinen Spott verdient. Nein, er soll sich vielmehr wundern, daß uns das Göttliche durch eine so geringfügige Sache offenbar geworden ist, durch den Tod allen die Unsterblichkeit zuteil wurde und in der Menschwerdung des Logos die allwaltende Vorsehung und ihr Urheber und Schöpfer, der Logos Gottes, erkennbar wurde. Denn er wurde Mensch, damit wir vergöttlicht würden. Er offenbarte sich im Leibe, damit wir zur Erkenntnis des unsichtbaren Vaters gelangten; er ließ sich den Frevelmut seitens der Menschen gefallen, damit wir die Unsterblichkeit ererbten. Er erlitt ja für seine Person keinen Schaden, da er leidensunfähig und unverweslich, der Logos selbst und Gott war. Die leidende Menschheit aber, derentwegen er das auf sich nahm, hat er in seiner Leidensunfähigkeit bewahrt und gerettet. Überhaupt sind die Großtaten des Heilandes, die er in seiner Menschwerdung vollbrachte, derart und so groß, daß man beim Versuch, sie aufzuzählen, denen gliche, die auf das unermeßlich weite Meer hinausschauen und dessen Wogen zählen wollen. Denn wie man mit dem Auge nicht alle Wellen erreichen kann, da immer neue folgen, die dem zählenden Auge entschwinden, so wäre es auch dem, der alle Großtaten Christi, die er im Leibe vollbracht hat, zusammenfassen wollte, unmöglich, sie in ihrer Gesamtheit auch nur in seinem Geiste aufzunehmen, weil mehr noch seiner Beobachtung entgeht, als was er erfaßt zu haben glaubt. Es empfiehlt sich darum mehr, nicht auf alles zu sprechen zu kommen, wovon man ja doch nicht einmal einen Teil vollständig behandeln kann, vielmehr nur noch an einen Punkt zu erinnern und das Allgemeine dir zur Bewunderung anheimzustellen. Alles ist ja gleich wunderbar, und wohin man schauen mag, man gewahrt die Gottheit des Logos und wird ganz überrascht.</p>
      <h2>55</h2><p>Folgendes verdient also nach dem Gesagten besonders deine Beachtung und muß für die vorausgegangene Erörterung gleichsam die Grundlage bilden und gar sehr Erstaunen erregen, daß nämlich mit der Ankunft des Heilandes der Götzendienst nicht mehr zunahm, sondern der bereits bestehende abnimmt und allmählich verschwindet, daß die heidnische Weisheit keine Fortschritte mehr macht, im Gegenteil die noch vollends aufhört, die da ist, die Dämonen mit Gaukelei, Wahrsagerei und Zauberei nicht mehr betören, sondern schon beim ersten kecken Versuch dazu durch das Kreuzeszeichen zuschanden werden. Und um es kurz zu sagen: Betrachte nur, wie die Lehre des Heilandes überall neue Anhänger findet, aller Götzendienst aber und alles, was dem christlichen Glauben zuwiderläuft, von Tag zu Tag abnimmt, ohnmächtig wird und zusammenfällt! Bei solcher Betrachtung bete den Weltheiland an, den mächtigen Gott-Logos, verwirf das, was vor ihm weichen und verschwinden muß! Denn wie beim Sonnenschein die Finsternis keine Macht mehr hat, vielmehr vor ihm noch der letzte Rest (von Finsternis) verschwinden muß, so hat seit der göttlichen Erscheinung des Gott-Logos die Finsternis der Götzen keine Macht mehr; vielmehr stehen jetzt überall alle Teile des Erdkreises im Lichte seiner Lehre. Und wie oftmals einige Aufrührer in einem Lande, in dem ein König ist, der sich aber in der Öffentlichkeit nicht zeigt, sondern innerhalb seines Palastes bleibt, unter Benützung dieser seiner Zurückgezogenheit sich selbst proklamieren lassen, und der einzelne verkleidet den Einfältigen gegenüber sich als König ausgibt, und die Leute sich so durch den Namen irreleiten lassen, da sie wohl von einem Könige hören, aber ihn nicht sehen, zumal sie ja auch nicht in seinen Palast gelangen können, dann aber, wenn der wirkliche König sich zeigt und öffentlich auftritt und dann die betrügerischen Aufrührer mit seiner Gegenwart entlarvt werden, die Leute angesichts des rechten Königs ihre früheren Verführer verlassen, so haben ehedem auch die Dämonen die Menschen betrogen, als sie sich göttliche Würde anmaßten. Seitdem aber der Logos Gottes im Leibe erschienen ist und uns seinen Vater zu erkennen gegeben, da schwindet der Trug der Dämonen und hört gänzlich auf; die Menschen aber schauen auf den wahrhaftigen Gott-Logos des Vaters, lassen ab von den Götzen und anerkennen nunmehr den wahren Gott. Das ist aber ein Beweis, daß Christus Gott der Logos und Gottes Kraft ist. Denn wenn das Menschliche aufhört, das Wort Christi aber bleibt, so ist doch allen klar, daß das, was ein Ende hat, augenblicklich ist, der aber, der bleibt, Gott und wahrer Sohn Gottes und der eingeborene Logos ist.</p>
      <h2>56</h2><p>Diese kurze Abhandlung sei dir, Freund Christi, als erster Entwurf und Abriß einer Glaubenslehre über Christus und seine göttliche Ankunft unter uns gewidmet! Du aber wirst diesen Anlaß benützen, dich mit den biblischen Schriften zu befassen und ehrlichen Sinnes in sie dich vertiefen, um zum Verständnis ihres Inhalts zu gelangen und damit auch zu einer vollkommeneren und klareren Erkenntnis dessen, was wir gesagt haben. Denn in jenen Schriften hat Gott durch gottesgelehrte Männer geredet und geschrieben. Wir aber tradieren dir auch zu deinem Studium, was wir von den gotterleuchteten Lehrern gelernt haben, die auf das Schriftstudium sich verlegten und sogar Märtyrer für die Gottheit Christi geworden sind. Du wirst aber auch von seiner zweiten herrlichen und wahrhaft göttlichen Ankunft bei uns Kenntnis erhalten, wann er nicht mehr in Niedrigkeit kommt, sondern in seiner Herrlichkeit, nicht mehr in Demut, sondern in seiner Majestät, nicht mehr, um zu leiden, sondern um dann allen die Frucht seines Kreuzes mitzuteilen, nämlich die Auferstehung und die Unverweslichkeit. Auch wird er nicht mehr gerichtet; vielmehr richtet er alle, einen jeden nach dem Guten oder Bösen, das er mit seinem Leibe getan hat. Da ist den Guten das Himmelreich aufbehalten, den Übeltätern aber das ewige Feuer und die äußerste Finsternis. Denn so spricht der Herr selbst: „Ich sage euch: von nun an werdet ihr den Menschensohn zur Rechten der Kraft sitzen und auf den Wolken des Himmels kommen sehen, in der Herrlichkeit des Vaters“. Darum lautet auch ein heilsames Wort, das uns auf jenen Tag vorbereiten will: „Seid bereit und wachet; denn er kommt zu einer Stunde, die ihr nicht wisset“. Denn nach dem seligen Paulus „müssen wir alle vor dem Richterstuhl Christi erscheinen, damit ein jeder empfange, was er in seinem Leibe Gutes oder Böses getan hat“.</p>
      <h2>57</h2><p>Aber zum Studium und wahren Verständnis der Schriften hin bedarf es noch eines guten Lebenswandels, eines reinen Herzens und der christlichen Tugend, damit der Geist auf diesem Weg erlangen und erfassen kann, wonach er strebt, soweit überhaupt der Menschennatur ein Wissen über Gott den Logos erreichbar ist. Denn ohne reinen Sinn und Nachahmung des Lebens der Heiligen kann wohl niemand die Sprache der Heiligen verstehen. Denn wie einer, der das Licht der Sonne sehen möchte, gewiß das Auge abwischt und reinigt und sich durch die Reinigung dem Sehobjekt fast ähnlich macht, damit das Auge, so gleichsam Licht geworden, das Sonnenlicht schaue, oder wie einer, der eine Stadt oder ein Land sehen möchte, notgedrungen an die Stätte sich begibt, um seine Beobachtung zu machen, so muß der, welcher die Gedanken der Gottesgelehrten verstehen will, seine Seele im Leben zuvor abwaschen und reinigen und durch gleichartige Handlungen den Heiligen selbst nahekommen, damit er durch einen gleichen Lebenswandel mit ihnen verbunden auch das verstehe, was diesen von Gott geoffenbart worden, und, von nun an gleichsam mit diesen vereint, der den Sündern drohenden Gefahr und ihrem Feuer am Tage des Gerichtes entrinne und das erlange, was den Heiligen im Himmelreich hinterlegt ist, „was kein Auge gesehen, kein Ohr gehört hat und in keines Menschen Herz gedrungen ist“, was alles denen bereitet ist, die tugendhaft leben und Gott und den Vater lieben in Christus Jesus, unserem Herrn, durch den und mit dem dem Vater selbst mit dem Sohne im Heiligen Geiste Ehre, Macht und Herrlichkeit sei von Ewigkeit zu Ewigkeit. Amen! PAGE 40</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Anton Stegmann und Hans Mertel, <em>Über die Menschwerdung des Logos</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 31), München 1917. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2091/versions/uber-die-menschwerdung-des-logos-und-dessen-leibliche-erscheinung-unter-uns-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

