      <p><strong>Quelle:</strong> Übersetzung von Übersetzung des 19. Jahrhunderts, <em>Geschichte der Arianer</em> (BKV 1. Serie, Bd. 15, Kempten 1836). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2127/versions/geschichte-der-arianer-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

