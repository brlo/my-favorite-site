    body: |-
      <p><em>Schutzschrift gegen die Arianer, übersetzt von Jos. Fisch (BKV 1. Serie, Bd. 29, Kempten 1875).</em></p><h2>1</h2><p>Ich glaubte, es würden nach so vielen Beweisführungen für unsere Sache unsere Feinde sich nicht mehr hervorwagen und in den Punkten, in denen sie die Übrigen verleumdeten, vielmehr sich selbst für schuldig erkennen. Da sie aber nicht einmal erröthen, obschon sie in dieser Weise sich entpuppt haben, sondern in ihrer Verblendung feindselige Reden verbreiten, in der Meinung, es müsse über Alles neu entschieden werden, nicht als wollten sie sich selbst dem Richterspruch unterziehen, ― denn davon wollen sie Nichts wissen, sondern um uns und die Seelen der Arglosen zu beunruhigen, so hielt ich es für nothwendig, mich bei euch zu rechtfertigen, damit ihr auf ihr Murren nicht mehr achtet und euch von ihrer Bosheit und Ränkesucht überzeuget. Vor euch als rechtlich gesinnten Menschen führe ich meine Vertheidigung; gegen meine Gegner aber flößen mir die Beweise Muth ein, die mir gegen dieselben zu Gebote stehen. Denn unsere Sache bedarf keines Richterspruches mehr, denn sie ist nicht einmal oder zweimal, sondern oft entschieden worden. Zum ersten Mal geschah es in einer Versammlung unserer Provinz von nahezu hundert Bischöfen, zum zweiten Mal in Rom, als Eusebius geschrieben hatte, da wir selbst vorgeladen und dort mehr als fünfzig Bischöfe versammelt waren, und zum dritten Mal auf der großen Synode zu Sardica, die sich im Auftrag der gottesfürchtigen Kaiser Constantius und Constans versammelt hatte, auf welcher unsere Widersacher als Verleumder verurtheilt wurden. Dem uns freisprechenden Urtheile stimmten mehr als dreihundert Bischöfe bei, aus den Eparchien von Ägypten, Libyen, der Pentapolis, Palästina, Arabien, Isaurien, Cypern, Pamphylien, Lycien, Galatien, Dacien, Mysien, Thracien, Dardanien, Macedonien, Epirus, Thessalien, Achaia, Kreta, Dalmatien, Siscien, Pannonien, Noricum, Italien, Picenum, Tuscien, Campanien, Calabrien, Apulien, Bruttium, Sicilien, ganz Afrika, Sardinien, Spanien, Gallien, Britanien. Ihnen schloßen sich auch Ursacius und Valens an, die zuerst auf Seite der Ankläger standen, später aber ihre Gesinnung änderten. Denn sie stimmten nicht nur dem über uns gefällten Urtheile bei, sondern gaben auch zu, daß sie selbst und unsere übrigen Gegner uns verleumdet hätten. Denn da sie in dieser Weise ihre Ansicht geändert und in dieser Weise geschrieben haben, so überführen sie offenbar auch die Anhänger des Eusebius. Denn gemeinsam mit ihnen schmiedeten sie Ränke gegen uns. Es wird nun Jedermann zugeben, daß es überflüssig sei, das, was von so vielen und so großen Bischöfen geprüft, entschieden und klar bewiesen wurde, noch einmal entscheiden zu lassen, damit es nicht, wenn es auch jetzt noch untersucht wird, wieder entschieden und nochmals untersucht werde, und so ihre übertriebene Geschäftigkeit kein Ende finde.</p>
      <h2>2</h2><p>Es hätte das Urtheil so vieler Bischöfe genügt, um die Leute zu beschämen, die gegen uns auch nur zum Scheine noch Etwas vorbringen wollten. Da aber sogar die Feinde für uns und gegen sich selbst Zeugniß geben, indem sie das, was gegen uns geschehen ist, für Ränke erklären, wer schämt sich nicht, jetzt noch einen Zweifel zu hegen? Denn während das Gesetz befiehlt, daß die Urteilssprüche auf der Aussage von zwei oder drei Zeugen beruhen sollen, so haben wir eine so große Menge Zeugen für uns, zu der auch noch die Erklärung unserer Feinde hinzutritt, daß auch die Übrigen sich nicht mehr auf ihren willkürlichen Urteilsspruch berufen, sondern sich genöthigt sehen, uns, von denen sie überführt werden, mit Beleidigungen statt mit Gründen zu bekämpfen. Denn das macht ihnen den größten Kummer, daß das, was sie selbst heimlich thaten und in einem verborgenen Winkel unter sich abmachten, von Valens und Ursacius ausgeredet und ans Licht gezogen wurde. Auch ist ihnen wohl bekannt, daß deren Sinnesänderung ihnen zum Verdammungsurtheil wird, denen aber, die von ihnen gekränkt wurden, zur Rechtfertigung dient. Deßhalb wurden sie auch auf der Synode in Sardica, wie ich vorhin gemeldet, verurtheilt, und zwar mit Recht. Denn in dieser Weise vertheidigten einst auch die Pharisäer den Paulus und verriethen ihre und der Juden Verschwörung gegen ihn. So wurde bewiesen, daß der selige David ohne Grund verfolgt wurde, als sein Verfolger das Geständniß machte: „Ich habe gefehlt, Sohn David!“ So wollten auch diese es machen, indem sie von der Wahrheit sich besiegen ließen, und übergaben dem Julius, Bischof von Rom, ein Schreiben. Sie schrieben auch an uns und verlangten in Frieden mit uns zu leben, da sie doch so großen Lärm geschlagen hatten und wohl jetzt noch erröthen, weil sie die, welche sie zu tödten gesucht hatten, durch die Gnade des Herrn noch am Leben sehen. Und über Arius und seine Häresie sprachen sie das Verdammungsurtheil aus und handelten hierin folgerichtig. Denn da sie wußten, daß die Anhänger des Eusebius uns lediglich wegen ihrer eigenen Gottlosigkeit verfolgten, so sagten sie sich, nachdem sie einmal zum Geständniß sich entschlossen hatten, uns verleumdet zu haben, zugleich auch von der christusfeindlichen Häresie los, wegen welcher sie auch auf uns gelogen hatten. Was nun von den Bischöfen zu unserer Vertheidigung in verschiedenen Synoden geschrieben worden ist, und zuerst von den ägyptischen, ist Folgendes.</p><p>Die heilige Synode in Alexandria, versammelt aus Ägypten, der Thebais, Libyen und der Pentapolis, entbietet allen Bischöfen der katholischen Kirche, den geliebten und heißersehnten Brüdern im Herrn ihren Gruß.</p>
      <h2>3</h2><p>Wir hätten bereits, geliebte Brüder, im Anfang als man gegen unsern Amtsgenossen Athanasius Ränke zu schmieden begann, oder nachdem er nach Alexandria gekommen war, ihn gegen die Ränke der Anhänger des Eusebius vertheidigen und über die von denselben ihm zugefügten Leiden Beschwerde erheben und alle gegen ihn vorgebrachten Verleumdungen enthüllen können. Da es aber damals die Umstände nicht erlaubten, wie ihr selbst wißt, wir aber jetzt nach der Rückkehr des Bischofs Athanasius glaubten, sie würden wegen ihrer so offenkundigen Ungerechtigkeiten sich schämen und erröthen, so wollten wir deßhalb schweigen. Da sie aber nach so vielen Leiden des Mannes, nachdem er nach Gallien verbannt war und statt im heimathlichen Lande in einem fremden weit entfernten Lande sich aufhielt, nachdem er in Folge ihrer Verleumdungen bald getödtet worden wäre, wenn er nicht einen gütigen Kaiser gefunden hätte, was doch jedem andern wenn auch noch so grausamen Feinde genügt hätte, dennoch nicht erröthen, sondern gegen die Kirche und den Mann wieder übermüthig anstürmen, und weil sie über seine Freilassung ungehalten sind, neuerdings Schlimmeres wagen und leichtsinnige Anklagen erheben, ohne die Worte der heiligen Schrift zu fürchten: „Ein lügenhafter Zeuge wird nicht ungestraft bleiben,“ und: „Ein Mund, der lügt, tödtet die Seele,“ so können wir aus diesem Grunde nicht mehr schweigen und sind erstaunt über ihre Bosheit und ihren unersättlichen Wetteifer, Ränke zu schmieden. Denn siehe, sie hören nicht auf, von Neuem die Ohren des Kaisers gegen uns zu stacheln, hören nicht auf, zur Beseitigung eines Bischofes unheilschwangere Briefe zu schreiben, der ein Feind ihrer Gottlosigkeit ist. Denn wieder haben sie in einem Schreiben an die Kaiser ihn angegriffen, wieder wollen sie gegen ihn intriguiren, indem sie ihm Mordthaten zur Last legen, die nicht vorgekommen sind. Wieder wollen sie ihn tödten, indem sie Todschläge ihm aufbürden, die nicht stattfanden. Denn auch damals hätten sie ihn durch ihre Verleumdungen getödtet, wenn wir nicht einen gütigen Kaiser gehabt hätten. Wieder suchen sie ihn, damit wir das Geringere sagen, in die Verbannung zu schicken, und stellen sich, als ob ihnen die Unfälle derer zu Herzen gingen, die durch ihn das Loos der Verbannung getroffen habe. Sie äussern ihren Schmerz über das, was bei uns nicht vorkam, begnügen sich aber nicht mit dem, was gegen ihn bereits geschah. Vielmehr wollen sie neuerdings noch Schlimmeres hinzufügen, so groß ist ihre Milde und Güte, so menschenfreundlich sind ihre Sitten, oder vielmehr, um die Wahrheit zu sagen, so verkommen und grausam sind sie, da sie mehr in Schrecken und Drohungen als in Gottesfurcht und Milde, wie es sich für Bischöfe geziemt, ihre Ehre suchen. Denn sie haben solche Reden in ihren Schreiben an die Kaiser vorzubringen gewagt, wie sie nicht einmal irgend ein ausserhalb der Kirche stehender Prozeßkrämer aussprechen möchte, und so vieler Mordthaten und Todschläge beschuldigten sie ihn nicht vor einem Statthalter, noch vor sonst irgend einem Hochgestellten, sondern vor den drei Kaisern. Und sie schracken vor keiner noch so weiten Reise zurück, damit nur alle hohen Gerichtshöfe von ihrer Anklage erfüllt würden. Denn eine Anklage ist es in der That, Geliebte, was von ihnen geschah, eine Anklage, die alle andern weit übertrifft, da auch die Gerichtshöfe alle andern menschlichen Gerichtshöfe weit übertreffen. Denn auf was Anderes zielt diese Untersuchung ab, als durch Aufreizung der Kaiser ihm den Tod zu bereiten?</p>
      <h2>4</h2><p>Nicht also die Thaten des Athanasius, sondern ihre eigenen sind geeignet, Thränen und Wehklagen hervorzurufen. Mit Recht möchte man also vielmehr über sie weinen. Denn über sie muß man Thränen vergießen, da ja geschrieben steht: „Weinet nicht über den Todten und erhebet keine Wehklage um ihn. Vergießet Thränen über den, der fortzieht, weil er nicht mehr zurückkehren wird.“ Denn ihr ganzer Brief ist auf nichts Anderes als auf den Tod gerichtet, und sie gehen darauf aus, zu morden, wenn ihnen nachgegeben wird, und in die Verbannung zu schicken. Denn es wurde ihnen vom gottesfürchtigen Vater der Kaiser nachgegeben, der ihren Groll statt mit Hinrichtung durch Veränderung des Aufenthaltsortes befriedigte. Wir glauben nun, es werde euer Gewissen in Christus begreifen, daß diese Thaten nicht einmal für einfache Christen, ja kaum für Heiden, am allerwenigsten aber für Bischöfe sich geziemen, von denen man voraussetzt, daß sie Andere zur Gerechtigkeit anleiten. Denn wenn sie Andere von Anklägereien abzuhalten suchen, warum treten sie selbst als Ankläger und sogar vor Kaisern auf? Warum geben sie sich, da sie Mitleid mit dem Unglück lehren, nicht einmal nach unserer Verbannung zufrieden? Denn als gemeinsam erachteten wir Bischöfe die Verbannung, und Alle glaubten wir verbannt und jetzt mit Athanasius der Heimath zurückgegeben und statt der früheren Thränen und Klagen jetzt in die höchste Freude und Glückseligkeit versetzt zu sein, die der Herr erhalten und durch die Anhänger des Eusebius nicht möge vernichten lassen. Das würde selbst dann einen Tadel verdienen, wenn ihre Anschuldigungen gegen ihn wahr wären, weil sie im Widerspruch mit dem Gebote des Christenthums auch nach den Leiden der Verbannung neuerdings auf ihn losgehen und Anklagen auf Mordthaten, Todschläge und andere Vergehen erheben und damit in feindseliger Gesinnung gegen die Bischöfe die Ohren der Kaiser umtönen. Wenn sie aber durchweg lügen und durchweg Ränke schmieden und keine Wahrheit in ihrem Munde noch in ihren Schriften ist, wie weit verzweigt ist ihre Bosheit? Oder was müßt ihr von diesen Menschen halten? Wollen wir nunmehr an die Sache selbst gehen und uns mit ihren gegenwärtigen Anklagen befassen. Denn wir werden hieraus nachweisen, daß auch das, was sie früher als Synodalbeschluß verbreiteten, nicht in der rechten Weise zu Stande gekommen sei, ja sogar nicht einmal richtig dargestellt werde, und sie werden auch hierin wieder sich verurtheilt sehen.</p>
      <h2>5</h2><p>Wir schämen uns wohl, in Betreff solcher Dinge uns zu vertheidigen. Da jedoch die vermessenen Ankläger vor Nichts zurückschrecken und die Beschuldigung vorbringen, daß nach der Rückkehr des Athanasius Mordthaten und Todschläge geschehen seien, so bitten wir, über die Rechtfertigung nicht ungeduldig zu werden, wenn sie auch etwas weitschweifig wird, denn die Umstände machen es nothwendig. Eine Mordthat ist nun weder durch Athanasius geschehen, noch seinetwegen, da uns denn die Ankläger, wie wir vorhin gesagt haben, auf dieses schmähliche Gebiet der Vertheidigung führen. Denn Hinrichtungen und Gefängniß sind unserer Kirche fremd. Dem Scharfrichter hat Athanasius keinen Menschen überliefert, und das Gefängniß wurde durch ihn, so weit er einen Einfluß üben konnte, niemals bevölkert. Unsere Heiligthümer waren wie immer so auch jetzt unbefleckt, und nur durch das Blut Christi und die fromme Gesinnung gegen ihn ehrwürdig. Kein Priester, kein Diakon wurde von Athanasius getötet. Keine Hinrichtung, keine Verbannung wurde von dem Manne bewerkstelligt. Aber hätten nur auch sie gegen ihn Dieß in Wahrheit nicht gethan und ihn nicht Dieß zu leiden genöthigt! Denn hier ist seinetwegen Niemand verbannt worden, sondern nur durch sie der Bischof Athanasius von Alexandria. Und da dieser aus der Verbannung zurückgekehrt ist, suchen sie ihn neuerdings in die nämliche oder in eine noch schlimmere Lage zu versetzen, indem sie ihre Zunge zu allen lügenhaften und todbringenden Worten in Bewegung setzen. Denn sieh, nun schreiben sie auch die Thaten der Richter ihm zu, und obschon sie im Briefe offen zugeben, daß der <em>Eparch</em> von Ägypten gegen Einige das Urtheil gesprochen habe, so scheuen sie sich dessenungeachtet nicht, für diese Urtheile den Athanasius verantwortlich zu machen, und zwar als er noch nicht einmal nach Alexandria gekommen, sondern auf der Rückreise aus der Verbannung begriffen war und sich in Syrien aufhielt, wenn man anders auch eine weite Abwesenheit zur Rechtfertigung vorbringen soll, daß man für das nicht verantwortlich sein könne, was ein Feldherr oder Eparch in Ägypten thut. Denn wenn er auch in Alexandria gewesen wäre, was haben die Thaten des Eparchen mit Athanasius zu schaffen? Aber gleichwohl war er in der Gegend nicht anwesend, und was geschah, ist nicht in kirchlichen Angelegenheiten vom Eparchen in Ägypten unternommen worden, sondern aus gewissen Veranlassungen, die ihr aus den Akten ersehen werdet, die wir, nachdem wir von ihrem Schreiben Kenntniß bekommen haben, zum Überfluß euch übersenden. Da sie also auch jetzt laut schreien, daß das geschehen sei, was nicht geschehen und weder durch ihn, noch seinetwegen geschehen ist, und betheuern, daß sie von so vielen Übelthaten volle Gewißheit haben, so sollen sie sagen, aus welcher Synode sie auch diese Kenntniß erlangt haben, durch welche Beweise, durch welchen Richterspruch. Wenn sie aber, ohne einen Anhaltspunkt zu haben, so Etwas schlechtweg behaupten, so stellen wir es euch anheim, zu ermessen, wie das Frühere geschehen ist, oder wie sie es darstellen. Denn es ist nichts Anderes als Ränkesucht, feindliche Verfolgung, ein unaufhaltsam hervortretender Groll, eine Gottlosigkeit, die gegen die Gottesfurcht im Kampfe für die Ariomaniten wüthet, damit die Rechtgläubigen auf die Seite geschafft werden und die Fahnenträger der Gottlosigkeit von nun an, was ihnen beliebt, ohne Scheu predigen können. Wahrlich so verhält es sich.</p>
      <h2>6</h2><p>Als der gottlose Arius, von dem auch die Häresie der Ariomaniten den Namen trägt, vom seligen Bischof Alexander aus der Kirche ausgestoßen worden war, glaubten die Anhänger des Eusebius, da sie Jünger und Genossen seiner Gottlosigkeit waren, gleichfalls ausgestoßen zu sein und wendeten sich schriftlich mit dringenden Bitten an den Bischof Alexander, er möge den Häretiker Arius nicht aus der Kirche ausschließen. Da aber Alexander wegen seiner Frömmigkeit gegen Christus den Gottlosen nicht aufnahm, so grollten sie auf Athanasius, der damals Diakon war, weil sie ausspionirt hatten, daß er mit dem Bischof Alexander sehr viel verkehre und bei ihm in Ansehen stehe. Da sie auch auf der in Nicäa versammelten Synode seine Frömmigkeit gegen Christus kennen gelernt hatten, wo er gegen die Gottlosigkeit der Ariomaniten unerschrocken aufgetreten war, so wurde ihr Haß noch größer. Als ihn aber Gott zur bischöflichen Würde berief, wurde die lange genährte Bosheit von Neuem angefacht, und da sie seine Rechtgläubigkeit und seinen Widerstand gegen die Gottlosigkeit fürchteten und Eusebius noch mehr von seinem schlechten Gewissen beunruhigt wurde, so verfolgten und bedrängten sie den Mann auf alle mögliche Weise. Sie reizten gegen ihn den Kaiser auf, drohten oft mit Synoden und versammelten sich schließlich in Tyrus. Und selbst jetzt hören sie noch nicht auf, gegen ihn zu schreiben, und sie sind so unversöhnlich, daß sie auch seine Erhebung zur bischöflichen Würde begeifern und überall ihre Feindseligkeit und ihren Haß gegen den Mann zu erkennen geben und Lügen verbreiten, um nur durch ihre Lügenhaftigkeit ihn in üblen Ruf zu bringen. Aber gerade mit diesen ihren Lügen beweisen sie, daß das, was sie früher sagten, erlogen und ränkevoll war. Sie sagen nämlich: „Nach dem Tode des Bischofs Alexander, da einige Wenige des Athanasius Erwähnung thaten, wählten ihn sechs oder sieben Bischöfe heimlich und an einem verborgenen Orte.“ Das schrieben sie auch an die Kaiser, da sie jede Lüge zu schreiben bereit sind. Daß aber die ganze Menge und das ganze Volk der katholischen Kirche wie in einer Seele und in einem Leibe sich versammelte und rief und schrie und den Athanasius zum Bischof der Kirche verlangte, um das öffentlich zu Christus flehte und uns viele Tage und Nächte hindurch beschwor, hierin zu willfahren, und weder selbst die Kirche verließ, noch uns gestattete, uns zu entfernen, das können sowohl wir bezeugen als auch die ganze Stadt und Eparchie. Und sie brachten nicht, wie Jene schrieben, etwas Ungünstiges gegen ihn vor, sondern nur Gutes, indem sie ihn eifrig, fromm, einen Christen, einen Asceten, einen wahren Bischof nannten. Daß aber die Mehrzahl von uns im Angesichte und unter den Zurufen Aller ihn wählte, dafür sind wiederum wir, die wir ihn wählten, bessere Zeugen als die, welche abwesend waren und lügen. Gleichwohl weiß Eusebius an der Einsetzung des Athanasius Etwas auszusetzen, ein Mensch, der vielleicht gar keine Einsetzung gehabt hat und, wenn er sie hatte, sie selbst ungiltig machte. Anfangs war er in Berytus, dann verließ er Berytus und ging nach Nikomedien, indem er ersteres im Widerspruch mit dem Gesetze verließ und letzteres gegen das Gesetz in Besitz nahm. Und seine eigene Kirche verließ er lieblos, in die fremde aber ist er unberechtigt eingedrungen. Und indem er die Liebe zur ersten in Folge der Begierde nach der fremden ausser Acht ließ, bewahrte er sie nicht einmal der zweiten, obschon sie aus Begierde entsprungen war. Denn sieh, auch diese verließ er und hat wieder eine fremde in Besitz, indem er überall auf fremde Städte seine Augen wirft und in den Reichthum und in die Größe der Städte die Gottesfurcht setzt und die Auserwählung Gottes, durch die Einer eingesetzt wurde, für Nichts achtet und nicht weiß, daß, wo zwei oder drei im Namen des Herrn versammelt sind, dort der Herr mitten unter ihnen ist, und nicht die Worte des Apostels erwägt: „In fremden Mühen werde ich mich nicht rühmen,“ nicht achtet auf seine Mahnung: „Bist du an ein Weib gebunden, so suche nicht, dich zu scheiden.“ Wenn der Ausspruch von einem Weibe gilt, um wie viel mehr von einer Kirche und von dem nämlichen bischöflichen Sitze? Denn wer an einen solchen gebunden ist, muß nicht einen andern suchen, damit er nicht nach den göttlichen Schriften als Ehebrecher erfunden werde.</p>
      <h2>7</h2><p>Aber obschon er solche Dinge auf seinem Gewissen hatte, hat er es doch gewagt, die Einsetzung des Athanasius, die bei Allen ein gutes Zeugniß hat, anzugreifen, und wagt es, ihm die Absetzung vorzuwerfen, und ist doch selbst abgesetzt worden, wie die statt seiner vorgenommene Einsetzung bezeugt. Wie konnten nun er oder Theognius einen Andern absetzen, da sie selbst abgesetzt worden sind und durch die statt ihrer vorgenommenen Einsetzungen überführt werden? Denn es ist euch wohl bekannt, daß Amphion in Nikomedien, Chrestus in Nicäa statt ihrer sowohl wegen ihrer eigenen Gottlosigkeit eingesetzt wurden, als auch wegen ihrer Gemeinschaft mit den von der ökumenischen Synode verurtheilten Ariomaniten. Und indem sie jene wahre Synode ausser Kraft setzen wollen, bemühen sie sich, ihrer eigenen rechtswidrigen Zusammenrottirung den Namen einer Synode zu verschaffen, und indem sie die Beschlüsse der ersteren nicht gelten lassen wollen, verlangen sie, daß ihre eigenen Beschlüsse gelten, und reden von einer Synode, da sie einer so großen Synode nicht gehorchen. In dieser Weise haben sie sich nicht um eine Synode gekümmert, sondern sie geben sich den Anschein, als ob sie sich darum kümmerten, um die Rechtgläubigen aus dem Wege zu schaffen und die von der wahren und großen Synode gegen die Arianer gefaßten Beschlüsse umzustoßen. Indem sie diese, wie immer, so auch jetzt in Schutz nehmen, wagen sie es, den Bischof Athanasius mit Lügen zu verfolgen. Denn ähnlich ist auch das, was sie jetzt lügen, daß es bei seinem Einzuge Aufstände, Thränen und Wehklagen gegeben habe, weil das Volk über seine Aufnahme ungehalten war. Denn nicht so Etwas hat stattgefunden, sondern gerade das Gegentheil, Freude und Fröhlichkeit und Zusammenströmen des Volkes, das zum ersehnten Anblick herbeieilte. Voll Jubel waren die Kirchen, und überall wurden dem Herrn Dankgebete dargebracht. Alle Kirchendiener und Kleriker wurden bei seinem Wiedersehen in ihren Herzen mit Freude erfüllt und erachteten jenen Tag für den schönsten Tag ihres Lebens. Und was brauchen wir die unaussprechliche Freude zu schildern, die wir Bischöfe empfanden? Wir haben ja schon vorhin gesagt, daß wir mit ihm zu leiden glaubten.</p>
      <h2>8</h2><p>Da Dieß also in dieser Weise als ausgemacht erscheint und von ihnen in entgegengesetzter Weise vorgebracht wird, was für eine Zuversicht gewährt die von ihnen vielgenannte Synode oder richterliche Entscheidung? Denn wie können die, welche in dieser Weise es wagen, sich mit dem zu befassen, was sie nicht sahen, worüber sie nicht zu richten hatten, wozu sie nicht zusammenkamen, und darüber zu schreiben, wie wenn sie überzeugt wären, in dem einen Glauben finden, was sie als Zweck ihrer Zusammenkunft bezeichnen? Wird man nicht glauben, daß sie das Eine wie das Andere in feindseliger Gesinnung gethan haben? Denn was für eine Synode von Bischöfen gab es damals auch? was für eine Versammlung, der es um die Wahrheit zu thun war? War nicht die Mehrzahl derselben gegen uns feindlich gesinnt? Lagen nicht wegen der Raserei des Arius die Anhänger des Eusebius mit uns im Kampfe? Verleiteten sie nicht die Andern, die mit ihnen gleicher Ansicht waren? Schrieben wir nicht beständig gegen sie, als gegen Meinungsgenossen des Arius? Wurde nicht Eusebius zu Cäsarea in Palästina von den Bekennern auf unserer Seite des Götzenopfers beschuldigt? Wurde Georgius nicht überwiesen, daß er von dem seligen Alexander abgesetzt worden sei? Wurden nicht Andere wegen verschiedener anderer Dinge angeklagt? Warum wollten sie also, um über uns zu richten, zusammenkommen? Und wie können sie sich erdreisten, von einer Synode zu reden, bei der ein Comes präsidirte, ein Spekulator anwesend war und ein Commentarius statt der Diakonen der Kirche uns einführte? Jener sprach, und die Anwesenden schwiegen oder gehorchten vielmehr dem Comes. Und die Bischöfe wurden durch sein Eingreifen gehindert, der Meinung ihres Herzens zu folgen. Jener commandirte, wir aber wurden von den Soldaten fortgeschleppt, oder er war vielmehr auf Befehl der Eusebianer ihrem Willen zu Diensten. Überhaupt aber, Geliebte, was ist das für eine Synode, wo der Ausgang Verbannung und Hinrichtung war, wenn es dem Kaiser gefiel? Was waren es aber auch für Beschuldigungen? Denn man muß sich hierin noch mehr über sie wundern. Es war ein gewisser Arsenius, dessen Ermordung sie zum Vorwurf machten, und sie sprachen die Verleumdung wegen eines zerbrochenen heiligen Kelches aus. Aber Arsenius lebt und wünscht mit uns in Gemeinschaft zu treten und erwartet keine anderen Zeugnisse, um zu beweisen, daß er lebt, sondern bekennt selbst, daß er lebt, und schreibt einen eigenhändigen Brief an unsern Mitbischof Athanasius, den sie als seinen Mörder erklärten. Die Gottlosen schämten sich nicht, die Anklage zu erheben, daß ein Mann trotz des großen Zwischenraumes, da er zu Wasser und zu Land eine gar weite Strecke entfernt war, von ihm getödtet worden sei. Und man wußte in jenen Zeiten nicht einmal seinen Aufenthaltsort, sondern sie haben sich sogar erkühnt, ihn unsichtbar zu machen, ohne daß ihm Etwas begegnet war. Und wäre es möglich gewesen, so hätten sie ihn in eine andere Welt versetzt oder ihn vielmehr wirklich aus der Welt geschafft, um nur, sei es durch einen wirklichen, sei es durch einen erdichteten Mord den Athanasius in Wahrheit zu morden. Aber der göttlichen Vorsehung sei auch in dieser Beziehung Dank gesagt, daß sie kein Unrecht gedeihen ließ, sondern den Arsenius in lebendem Zustand Allen vor Augen führte und ihre damaligen Intriguen und Ränke offen bewies. Denn er flieht uns nicht als Mörder, noch haßt er uns, als ob wir ihm ein Unrecht angethan hätten. Denn es ist ihm ganz und gar Nichts geschehen. Vielmehr will er mit uns in Gemeinschaft stehen und zu uns gezählt werden, wie er uns schreibt.</p>
      <h2>9</h2><p>Gleichwohl wurde von ihnen gegen Athanasius intriguirt, als hätte er den Lebenden getödtet, und er wurde von ihnen sogar verbannt. Denn nicht der Vater der Kaiser verbannte ihn, sondern ihre Verleumdungen. Denn sehet, ob es sich nicht so verhält. Als an unserm Amtsgenossen Athanasius Nichts erfunden wurde, der Comes aber Gewalt anwendete und Vieles gegen ihn in Bewegung setzte, entzog sich der Bischof Athanasius der Anwendung von Gewalt und ging zum gottesfürchtigen Kaiser, wo er zugleich gegen den Comes und ihre Intriguen protestirte und verlangte, es möchte eine rechtmäßige Synode von Bischöfen berufen werden, oder er selbst gestatten, daß er sich gegen die ihm gemachten Vorwürfe vertheidige. Und der Kaiser, von Unmuth ergriffen, ladet sie schriftlich vor und erklärt, er wolle sie selbst hören, da er auch den Zusammentritt der Synode veranstaltet hätte. Die Eusebianer reisten hin und brachten über Athanasius nicht mehr die Anklagen vor, mit denen sie in Tyrus so viel Lärm geschlagen hatten, sondern wegen des Zurückhaltens des Getreides und der Schiffe, wie wenn Athanasius erklärt hätte, er könne die Ausfuhr des Getreides von Alexandria nach Konstantinopel verhindern. Das haben Einige von den Unsrigen, die mit Athanasius im Palaste waren, vernommen, als der Kaiser darob ihn anfuhr. Als hierauf Athanasius über die Anklage einen großen Jammer aufschlug und betheuerte, daß dieselbe nicht auf Wahrheit beruhe, denn ein armer Privatmann hätte keine so große Macht, da schwor Eusebius, indem er nicht einmal die öffentliche Verleumdung scheute, Athanasius sei reich und mächtig und vermöge Alles, um so glauben zu machen, daß Athanasius auch das gesagt habe. Solche Anklagen erhoben die ehrwürdigen Bischöfe. Die Gnade Gottes freilich hat sich stärker erwiesen als ihre Bosheit. Denn sie hat die Gottesfurcht des Kaisers zur Milde bewogen und setzte an die Stelle des Todes die Verbannung. Es sind also ihre Verleumdungen daran Schuld und nichts Anderes. Denn der Kaiser tadelte in einem frühern Schreiben ihre Ränkesucht, beschuldigte sie der Verfolgungssucht, verurtheilte die Melitianer, indem er sie in seinem Schreiben als ungerecht, fluchwürdig und mit den schrecklichsten Namen bezeichnete. Er wurde nämlich aufgebracht, als er von einem getödteten Menschen hörte, der am Leben war; er wurde aufgebracht, als er von der Ermordung eines Lebenden hörte, der des Lebens nicht beraubt war. Den Brief haben wir euch zugesendet.</p>
      <h2>10</h2><p>Die sonderbaren Eusebianer schützen gleichwohl, damit es den Anschein gewinne, als ob sie dadurch die Wahrheit, und was geschrieben vorliegt, entkräften könnten, den Namen einer Synode vor, setzen aber an die Stelle derselben den Kaiser. Und es findet sich dabei ein Comes ein, und Soldaten finden sich dabei ein als Trabanten der Bischöfe, und ein kaiserliches Schreiben ruft die zur Versammlung, welche sie dazu beiziehen wollten. Betrachtet hier ihre ausserordentliche Verfolgungssucht und die Widersprüche in ihrem kecken Verfahren, um in jeder Weise, sei es wie nur immer, uns den Mann zu entreissen. Denn wenn sie als Bischöfe sich allein das Recht der Entscheidung zuerkannten, wozu hatten sie einen Comes und Soldaten nöthig? Oder warum versammelten sie sich auf ein kaiserliches Schreiben hin? Und wenn sie des Kaisers bedurften und sich seines Ansehens bedienen wollten, warum ließen sie seine Entscheidung nicht gelten? Oder warum, da Jener die Melitianer in seinem Schreiben für verruchte Intriguanten, den Athanasius aber für ganz unschuldig erklärt und die Erdichtung von dem Morde an Einem, der noch am Leben ist, höchlich mißbilligt hatte, haben sie entschieden, daß die Melitianer die Wahrheit sprechen, Jener aber schuldig sei, und haben sie ohne Scheu aus dem Lebenden einen Todten gemacht, der noch nach der richterlichen Entscheidung des Kaisers lebte, und noch als sie zusammentraten, und der bis jetzt noch unter uns weilt? So viel von Arsenius.</p>
      <h2>11</h2><p>Welcher heilige Kelch aber und wo ist ein solcher von Makarius zerbrochen worden? Denn das verbreiten sie und sprengen es nach allen Richtungen aus. Aber den Athanasius haben nicht einmal die Ankläger zu beschuldigen gewagt, wenn sie nicht von ihnen angestiftet wurden. Gleichwohl richten sie den Tadel gegen ihn, da er doch nicht einmal den Makarius hätte treffen sollen, wenn er nicht überführt war. Und sie schämen sich nicht, mit diesen Geheimnissen vor den Katechumenen, ja was das Schlimmste ist, vor den Heiden Scandal zu erregen, da man doch, wie geschrieben steht, das Geheimniß des Königs verbergen soll, wie auch der Herr befahl: „Gebet das Heilige nicht den Hunden, und werfet die Perlen nicht den Schweinen vor!“ Denn man muß nicht die Geheimnisse den Uneingeweihten zum Besten geben, damit nicht die unwissenden Heiden darüber lachen, den Katechumenen aber, indem sie zur Neugierde gereizt werden, Ärgerniß gegeben werde. Gleichwohl, was für ein Kelch oder wo oder von wem ist ein solcher zerbrochen worden? Melitianer sind ja die Ankläger, die durchaus keinen Glauben verdienen; denn sie sind Schismatiker und Feinde der Kirche, nicht erst jetzt, sondern seit dem seligen Petrus, dem Bischof und Martyrer, da sie ja auch den Petrus selbst verfolgten, den Achillas, seinen Nachfolger, verleumdeten und den Alexander sogar beim Kaiser anklagten. Denn nachdem sie so in dieser Weise verfahren waren, machten sie sich zuletzt auch an Athanasius und thaten Nichts, was mit ihrer Bosheit nicht in Einklang stand. Denn wie gegen die Früheren, so intriguirten sie auch gegen ihn, nur haben erst jetzt und nicht früher ihre Intriguen und Verleumdungen Erfolg gehabt, weil sie die Eusebianer zu Gehilfen und Führern hatten, wegen der den Ariomaniten eigenen Gottlosigkeit, in welcher sie wie gegen viele Bischöfe so auch gegen Athanasius Ränke schmiedeten. Denn der Ort, an dem nach ihrer Angabe der Kelch zerbrochen wurde, war keine Kirche, kein Priester bewohnte den Ort. Der Tag, an dem Makarius das gethan haben soll, war kein Sonntag. Da also dort weder eine Kirche war noch ein Priester, noch auch der Tag es mit sich brachte, was für ein heiliger Kelch oder wann oder wo ist er zerbrochen worden? Denn es gibt offenbar auch viele Kelche in den Häusern und mitten auf dem Markte, und wer einen von diesen bricht, handelt nicht gegen die Gottesfurcht. Der heilige Kelch aber, durch dessen absichtliche Zerbrechung der, welcher es unternimmt, als gottlos erscheint, ist nur bei den rechtmäßigen Vorständen zu finden. Dieß Verhältniß allein hat es mit diesem Kelche, kein anderes. Diesen reicht ihr dem Volke vorschriftsmäßig zum Genusse, diesen habt ihr von der kirchlichen Anordnung überkommen, dieser gehört denen allein, die der katholischen Kirche vorstehen. Denn euch allein kommt es zu, das Blut Christi auszuspenden, ausserdem Keinem. Aber so gottlos der ist, der den heiligen Kelch zerbricht, so ist doch der noch gottloser, der das Blut Christi verhöhnt. Diese Verhöhnung begeht aber der, welcher das gegen die kirchliche Vorschrift thut. Und das sagen wir, nicht als ob von Makarius auch nur ein Kelch von Schismatikern zerbrochen worden wäre, da ja vielmehr ganz und gar kein Kelch dort war. Denn wie wäre es möglich gewesen, da dort keine kirchliche Stätte, kein Diener der Kirche, und da nicht einmal die Zeit für die Feier der Geheimnisse war? Es war dieß der vielgenannte Ischyras, der nicht einmal von der Kirche gewählt war noch, als Alexander die von Melitius eingesetzten Priester aufnahm, unter jener Zahl sich befand, also nicht einmal bei dieser Gelegenheit eingesetzt wurde.</p>
      <h2>12</h2><p>Wie ist also Ischyras Priester? Wer hat ihn denn geweiht? Etwa Kolluthus? Denn das allein bleibt noch übrig. Es ist aber offenbar und unterliegt keinem Zweifel, daß Kolluthus als Priester starb und seine beiden Hände ohne Kraft waren und alle von ihm im Schisma Geweihten Laien sind und in dieser Eigenschaft in den Versammlungen erscheinen. Wie kann man also glauben, daß ein Privatmann, der ein Privathaus bewohnt, einen heiligen Kelch habe? Aber damals nannten sie den Privatmann einen Priester und gaben ihm diesen Namen aus Ungerechtigkeit gegen uns, und jetzt lassen sie ihm zum Lohne für seine Anklage eine Kirche bauen. Es hatte eben der Mann keine Kirche, sondern zum Lohn seiner schlechten Handlungsweise und dafür, daß er sich zur Anklage brauchen ließ, empfängt er jetzt, was er nicht hatte. Und sie haben ihm vielleicht sogar die bischöfliche Würde zum Lohn gegeben. Denn das breitet er ringsherum aus, und mit solchem Stolze tritt er gegen uns auf. Solche Preise werden nun also von den Bischöfen an die Ankläger und Verleumder ausgetheilt, und mit Recht. Denn die, welche ihn zur Erreichung ihrer Zwecke benützt hatten, verschafften ihm, da er an ihren Thaten Theil genommen, die gleiche bischöfliche Würde. Doch laßt uns hievon noch schweigen und merket auf das, was damals von ihnen geschah.</p>
      <h2>13</h2><p>Da sie gegen die Wahrheit, obschon sie sich gegen dieselbe gerüstet hatten, nicht aufzukommen vermochten und Ischyras zu Tyrus Nichts beweisen konnte, sondern ihm nachgewiesen wurde, daß er ein Verleumder sei, und ihre Intriguen an der Verleumdung scheiterten, so setzten sie zum Zwecke der Beweisführung die Verhandlung aus und erklärten, Einige aus ihrer Mitte nach der Mareotis zur genaueren Untersuchung schicken zu wollen, und die, welche wir aus vielen Gründen, weil sie es mit Arius hielten und deßhalb unsere Feinde waren, offen zurückwiesen, sandten sie unter eigenmächtigem Vorgehen heimlich ab, den Diognius, Maris, Theodor, Macedonius und zwei Jüngere an Alter und Sitte, den Ursacius und Valens von Pannonien. Diese also begaben sich, nachdem sie schon eine so weite Reise unternommen hatten, um ihren Feind zu richten, wieder von Tyrus nach Alexandria. Dabei verschmähten sie es, obschon sie Richter waren, nicht, als Zeugen aufzutreten, vielmehr trieben sie offen jede Art der Verfolgung und scheuten keine Anstrengung und keine Reise, um ihr unternommenes Intriguenspiel zu einem günstigen Ausgang zu führen. Den Bischof Athanasius hielten und ließen sie in fremdem Lande zurück, sie selbst aber gingen in die Stadt des Feindes, als wollten sie die Kirche und das Volk verheeren. Und was noch sonderbarer ist, während sie den Ankläger Ischyras mit sich führten, gestatteten sie dem angeklagten Makarius nicht, sie zu begleiten, sondern ließen ihn gefangen in Tyrus zurück. Denn nach allen Seiten hin wurde von ihnen der alexandrinische Priester Makarius angeschuldigt.</p>
      <h2>14</h2><p>Sie kamen also allein mit dem Ankläger nach Alexandria, indem sie mit diesem gemeinsam wohnten, aßen und tranken, und gingen in Begleitung des Philagrius, des Eparchen von Ägypten, nach der Mareotis ab, und dort führten sie allein mit dem Genannten die Untersuchung, wie es ihnen beliebte. Den Priestern, die inständig baten, daß man sie zulassen möchte, wurde die Bitte nicht gewährt. Es wünschten aber viele Priester in der Stadt und in der ganzen Provinz zugelassen zu werden, um zu zeigen, was für Leute die von Ischyras vorgeschlagenen Zeugen und woher sie seien. Und während sie die Diener der Kirche zurückwiesen, forschten sie bei den Heiden über Kirche, Kelch, Tisch und heilige Dinge nach. Und was noch ärger ist, bei der Untersuchung über einen heiligen Kelch luden sie Heiden als Zeugen vor, und die, von denen sie bei der Vorladung durch den Katholikus erklärt hatten, sie seien von Athanasius auf die Seite geschafft worden, und sie wüßten um ihren Aufenthaltsort nicht, die ließen sie nur zu sich und zum Eparchen kommen, und schämten sich der Behauptung nicht, daß die von Athanasius auf die Seite geschafft worden seien, auf deren Zeugenaussagen sie sich beriefen, wie es kein Geheimniß war, sondern auch hier geben sie wieder, da sie nur tödten wollen, in Nachahmung ihres Verfahrens bei Arsenius die Lebenden für todt aus. Denn Menschen, die noch am Leben sind und in ihrem Heimathsland gesehen werden können, lassen sie für euch, die ihr ferne seid, unter großen Jammerrufen verschwinden, um unsern Amtsbruder, weil die Beweise ferne sind, zu verleumden, als ob er äusseren Zwang und äussere Gewalt in Anwendung brächte, da doch sie selbst Alles mit Hilfe äusserer Gewalt und des weltlichen Armes vollbringen. Denn man verfuhr auch in der Mareotis wieder in ähnlicher Weise wie in Tyrus. Wie sich nämlich dort ein Comes mit militärischer Bedeckung befand, der nicht gestattete, daß Etwas gesagt oder gethan wurde, ausser was Jene beschlossen, ebenso befand sich auch hier der Eparch von Ägypten mit einer Abtheilung Soldaten, der alle Diener der Kirche in Schrecken setzte und Niemandem ein wahres Zeugniß abzulegen gestattete. Und in noch auffallenderer Weise wohnten sie am Orte und im Hause des Klägers selbst, und man wußte, daß sie untersuchten, wie es ihnen beliebte, da sie als Richter oder als Zeugen oder, was wahrscheinlicher ist, als Diener für ihre eigenen oder für des Eusebius Wünsche erschienen waren.</p>
      <h2>15</h2><p>Und was sie in Alexandria sich zu thun unterfangen haben, das ist euch, glauben wir, nicht unbekannt. Denn es hat sich überall verbreitet. Man griff mit entblößten Schwertern die heiligen Jungfrauen und die Brüder an und geißelte die bei Gott in Ehren stehenden Leiber. In Folge der Wunden wurden die an den Füßen gelähmt, die an der Seele in Keuschheit und in allen Tugenden unversehrt waren. Es wurden Handwerker und heidnische Haufen gegen sie in Bewegung gesetzt, um sie zu entblößen, zu schlagen, übermüthig zu behandeln, ihnen mit Altären und Darbringung von Opfern zu drohen. Ein übermüthiger Mann faßte, wie wenn nunmehr der Eparch aus Nachgiebigkeit gegen die Bischöfe dazu Erlaubniß gegeben hätte, eine Jungfrau bei der Hand und schleppte sie an einen nahen Altar, indem er den Zwang bei der Darbringung von Opfern und bei der Verfolgung nachahmte. Und während das vorging und die Jungfrauen flohen und die Kirche von den Heiden verhöhnt wurde, befanden sich drinnen die Bischöfe und wohnten in dem Hause, wo das vorging, und von dem aus die Jungfrauen, weil man ihnen gefällig sein wollte, mit entblößten Schwertern, mit jeder Gefahr, mit Mißhandlungen und übermüthiger Behandlung Bekanntschaft gemacht haben. Und das duldeten sie fastend von denen, die drinnen mit den Bischöfen schmausten.</p>
      <h2>16</h2><p>[Forts. v. ] Da wir das vorhersahen, daß die Ankunft von Feinden nicht ein geringer Nachtheil wäre, lehnten wir sie ab. So dachte auch Alexander, Bischof von Thessalonich, der in einem Schreiben an die, welche dort zurückgeblieben waren, ihre Intriguen nachwies und von ihrer Verfolgungssucht Zeugniß gab. Wenn sie diesen nun auch zu den Ihrigen rechnen und als einen Teilnehmer an ihrer Verfolgung aufzählen, so beweisen sie damit nur, daß sie gegen ihn Gewalt gebraucht haben. Denn auch der Erzbösewicht Ischyras hat sich nicht ohne Furcht und Anwendung von Gewalt dazu verstanden, sondern ist zur Anklage durch Zwang getrieben worden. Beweis dafür ist, daß Ischyras selbst an seinen Mitbischof Athanasius schrieb, daß dort nichts Solches vollbracht worden sei, sondern daß er angestiftet wurde, es zu erdichten. Und das schrieb er, da er nicht von ihm als Priester aufgenommen war, nicht einen solchen Namen aus Gnade empfangen, nicht den Bau einer Kirche zur Belohnung erhalten hatte, nicht als Lohn die bischöfliche Würde ihm in Aussicht gestellt war, was er alles wegen seiner Anklage von ihnen bekam. Ja es pflog sogar seine ganze Verwandtschaft Umgang mit uns, den sie gewiß nicht gepflogen hätte, wenn ihnen das geringste Unrecht zugefügt worden wäre.</p>
      <h2>17</h2><p>Daß das nicht eine leere Rede, sondern Thatsache ist, dafür sind Zeugen alle Priester in der Mareotis, die den Bischof immer auf seinen Rundreisen begleiten, und die damals gegen Ischyras schrieben. Aber weder gestattete man in Tyrus denen aus ihnen die Wahrheit zu sagen, die gekommen waren, noch erlaubte man denen, die in der Mareotis geblieben waren, dem Ischyras nachzuweisen, daß er ein Verleumder sei. Zeugniß geben auch die Abschriften der Briefe des Alexander, der Priester und des Ischyras. Wir schicken euch auch den Brief des Vaters der Kaiser. Darin zeigt er sich nicht bloß wegen des Arsenius ungehalten, daß man Anklage über die Ermordung eines Menschen erhebe, der noch lebt, sondern er drückte auch in Betreff des Kelches seine Verwunderung über das Schwankende und die Verworrenheit der Anklage aus, daß sie bald den Priester Makarius, bald den Bischof Athanasius anklagten, als hätte er den Kelch mit den Händen zerbrochen, und erklärt dann die Melitianer für Verleumder, dagegen den Athanasius für ganz schuldlos. Denn wie sind die Melitianer nicht Verleumder, und vor Allem Johannes? Dieser war in die Kirche aufgenommen worden und war mit uns in Gemeinschaft getreten. Er hatte sein eigenes Verfahren verurtheilt und Nichts mehr in Betreff des Kelches unternommen. Da sah er, daß die Anhänger des Eusebius den Ariomaniten ergeben seien, es aber nicht wagten, offen mit ihnen zu halten, sondern sich anderer Personen zu bedienen suchten, und so übernahm er eine Rolle wie ein Schauspieler bei den heidnischen Theatern. Das Stück hatte zum Gegenstand den Kampf der Arianer, der Grundgedanke war, ihnen zum Siege zu verhelfen, ihr Hinterhalt und ihre Wachposten Johannes mit seinem Anhang. Damit die Gönner der Arianer, indem sie diese vorschieben, scheinbar als Richter die Feinde der Gottlosigkeit zurückdrängen, die Gottlosigkeit befestigen und die Arianer in die Kirche einführen, suchen sie, die die Gottesfurcht verdrängen wollen, auch durch Gottlosigkeit den Sieg zu erzwingen. Und die der Gottlosigkeit gegen Christus sich ergeben haben, suchten die Feinde der Gottlosigkeit als gottlos aus dem Wege zu räumen, und sie reden uns von einem zerbrochenen Kelche, damit es scheine, daß auch Athanasius gleich ihnen gegen Christus gottlos sei. Wie kommen sie nur dazu, von einem heiligen Kelch Erwähnung zu thun? Woher kommt den Fahnenträgern der Gottlosigkeit gegen Christus der fromme Sinn in Betreff eines Kelches? Woher ist denen, die Christus nicht kennen, der Kelch Christi bekannt? Warum entehren die, welche sich stellen, als ob sie einen Kelch ehrten, den Gott des Kelches? Oder warum suchen die, welche wegen eines Kelches Lärm schlagen, den Bischof zu morden, der in ihm die heilige Handlung vollbringt? Sie hätten ihn ja getödtet, wenn es in ihrer Macht gestanden wäre. Und warum suchen sie, da sie den mit bischöflichem Schmucke gezierten Thron beweinen, den Bischof zu tödten, der ihn einnimmt? Damit der Thron den Bischof vermisse und das Volk der frommen Lehre beraubt werde? Es hat sie also weder ein Kelch noch ein Mord noch sonst irgend eine von ihnen gemeldete Schauderthat, sondern die bereits erwähnte Gottlosigkeit der Arianer hiezu verleitet, wegen der sie den Athanasius und andere Bischöfe verfolgten und jetzt noch die Kirche bekriegen. Denn von wem sind denn die Mordthaten und Verbannungen in Wahrheit ausgegangen? Nicht von diesen? Wer verfolgt die Bischöfe, indem er sich der weltlichen Macht bedient? Sind es nicht vielmehr die Eusebianer, statt Athanasius, wie sie selbst schreiben? Haben nicht vielmehr von ihnen Athanasius und Andere zu dulden gehabt? Denn auch vier Priester aus Alexandria, die doch nicht einmal nach Tyrus gekommen waren, sind in jener Zeit von ihnen in die Verbannung geschickt worden. Wer verdient beweint und betrauert zu werden? Nicht die, welche das Erste vollbrachten und Neues hinzuzufügen nicht verschmähten und alle Intriguen spielten, um einen Bischof zu verderben, der sich für ihre gottlose Häresie nicht gewinnen ließ? Daher stammt die Feindschaft der Eusebianer, daher stammen die Umtriebe in Tyrus, daher die vorgeblichen Richtersprüche, daher auch jetzt ihr Schreien ohne Richterspruch, wie wenn sie überzeugt wären, daher ihre Verleumdungen beim Vater der Kaiser und bei den gottesfürchtigen Kaisern selbst.</p>
      <h2>18</h2><p>Denn ihr müßt erfahren, was auch jetzt gegen unsern Amtsgenossen Athanasius ausgesagt worden ist, damit ihr auch hieraus von ihrer Schlechtigkeit euch überzeugt und einsehet, daß sie nichts Anderes beabsichtigen, als den Mann zu ermorden. Vom Vater der Kaiser wurde Getreide gespendet theils zum Unterhalte der libyschen, theils auch einiger ägyptischen Wittwen. Dieses empfangen bis in die Gegenwart Alle, und Athanasius erlangte davon für sich Nichts, als daß er nur mit ihnen die Mühe hatte. Und abschon jetzt die, welche es empfangen, keine Beschwerde führen, sondern bekennen, daß sie es empfangen, so hat man doch den Athanasius verleumdet, als ob er das ganze Getreide verkaufe und den Erlös für sich einstecke. Und diese Beschuldigung erhob in Folge der geschehenen Verleumdungen der Kaiser in einem Schreiben. Welches sind nun die Verleumder? Nicht die, welche das Erste vollbrachten und die folgenden Umtriebe nicht verschmähten? Wer hat dieses Schreiben veranlaßt, das, wie man sagt, vom Kaiser kam? Nicht die Arianer in ihrem Eifer, die gegen den Mann alles Mögliche zu reden und zu schreiben sich unterfangen? Denn Niemand möchte sie, da sie so Großes vollbracht haben, für unschuldig halten und Andere in Verdacht haben. Auch tritt der Beweis ihrer Verleumdung ganz deutlich an den Tag. Sie suchen nämlich, auf die Verleumdung gestützt, der Kirche das Getreide zu entziehen und es den Arianern zu verschaffen. Das fällt weitaus am meisten den Urhebern des Planes und ihren Häuptern zur Last, die es weder verschmäht haben, mit Mordthaten gegen den Mann aufzutreten, als sie beim Kaiser lügenhaft gegen ihn Anklage erhoben, noch den Wittwen der Kirche die Nahrungsmittel zu entziehen, um eigentlich den Häretikern einen Gewinn zu verschaffen.</p>
      <h2>19</h2><p>Wir übersenden euch auch das Zeugniß unserer Amtsgenossen in Libyen, der Pentapolis und aus Ägypten, damit ihr auch daraus die gegen Athanasius gespielten Intriguen kennen lernet. Das aber thun sie, damit die, welche der gottesfürchtigen Lehre huldigen, von nun an aus Furcht schweigen sollen und die Häresie der gottlosen Arianer Eingang finde. Auch euerer Frömmigkeit, Geliebte, sei Dank gesagt, daß ihr oft in eueren Schreiben die Arianer mit dem Anathem belegtet und ihnen die Aufnahme in die Kirche nicht gewährt habt. Die Widerlegung der Eusebianer liegt nahe. Denn sehet, nach ihrem ersten Schreiben über die Arianer, von dem wir euch die Abschrift senden, hetzen sie nunmehr offenbar die von der ganzen katholischen Kirche mit dem Anathem belegten Ariomaniten gegen die Kirche auf, und sie stellten für sie einen Bischof auf und spalten durch ihre Drohungen und Schrecknisse die Kirchen, um überall Genossen ihrer Gottlosigkeit zu haben. Denn sie senden auch Diakonen zu den Ariomaniten, die offen bei ihnen ihre Zusammenkünfte halten und an sie schreiben und von ihnen Schreiben erhalten, dabei in die Kirche Spaltungen bringen, mit ihnen in Gemeinschaft stehen und überallhin Briefe senden, worin sie ihre Häresie befürworten und von der Kirche sich lossagen. Das werdet ihr aus dem abnehmen können, was sie an den römischen Bischof und wohl auch an euch schrieben. Daß nun das nicht ungestraft bleiben kann, sehet auch ihr ein, Geliebte! Denn es ist schrecklich und der Lehre in Christus fremd. Deßhalb haben wir uns gemeinschaftlich versammelt und an euch geschrieben, und wir bitten euere Klugheit in Christus, ihr möget diese gemeinsame Erklärung gütig aufnehmen und unserm Mitbischof Athanasius euer Mitleid schenken und gegen die Anhänger des Eusebius euer Mißfallen zeigen, die Solches unternehmen, damit nie mehr eine solche Verkehrtheit und Schlechtigkeit in der Kirche einreisse. Denn euch rufen wir als Rächer dieser Ungerechtigkeit an, indem wir euch an das Wort des Apostels erinnern: „Nehmt den Bösen weg aus euerer Mitte!“ Denn böse fürwahr und der Gemeinschaft unwürdig ist, was sie vollbracht haben. Achtet also nicht mehr darauf, wenn sie wieder gegen den Bischof Athanasius an euch schreiben, — denn Alles, was sie bringen, ist erlogen, ― und nicht einmal, wenn sie Namen ägyptischer Bischöfe in ihren Briefen eintragen sollten. Denn gewiß sind sie nicht von uns geschrieben, sondern von Melitianern, die beständig Schismatiker sind und jetzt noch die Kirchen in Verwirrung setzen und Aufstände erregen. Denn sie unternehmen unvernünftige Einsetzungen von fast heidnischen Männern und vollbringen solche Thaten, daß wir sie uns zu schreiben schämen, die ihr aber von denen erfahren könnt, die wir senden, und die euch auch den Brief überbringen.</p>
      <h2>20</h2><p>Dieß schrieben also die Ägyptier an alle Bischöfe und an den Bischof Julius in Rom. Die Eusebianer aber schrieben gleichfalls an Julius, und in der Absicht, uns zu erschrecken, baten sie ihn, er möge eine Synode berufen, und Julius möge selbst, wenn es ihm beliebe, die Sache entscheiden. Als wir nun nach Rom gegangen waren, so schrieb Julius natürlich auch an die Eusebianer. Er sendete zugleich zwei seiner Priester ab, den Elpidius und Philoxenus. Als Jene von uns vernahmen, erschracken sie, weil sie nicht erwartet hatten, daß wir hinreisen würden, und sie lehnten es ab, indem sie unglaubwürdige Entschuldigungen vorbrachten, im Grunde aber fürchteten, sie möchten dessen überführt werden, was Ursacius und Valens eingestanden haben. Es traten nun über fünfzig Bischöfe da zusammen, wo der Priester Vito seine Versammlungen hielt, stimmten unserer Rechtfertigung bei und beschloßen, uns Gemeinschaft und Liebe zu gewähren. Sie drückten ihren Unwillen über Jene aus und baten den Julius, Folgendes an die Eusebianer zu schreiben, die auch an ihn geschrieben hatten, und er schrieb und sandte den Brief durch den Comes Gabianus.</p><p>Brief des Julius.</p><p>Julius dem Darius, Flacillus, Narcissus, Eusebius, Maris, Macedonius,Theodor und ihren Genossen, die von Antiochia an uns geschrieben haben, den geliebten Brüdern, Gruß im Herrn!</p>
      <h2>21</h2><p>Ich las den Brief, der mir durch meine Priester Elpidius und Philoxenus überbracht wurde, und es befremdete mich, daß ihr, während wir mit Liebe und dem Bewußtsein der Wahrheit schrieben, mit Zank und nicht in geziemender Weise uns geantwortet habt. Denn Übermuth und Ruhmredigkeit verriethen die Briefschreiber in ihrem Briefe. Das ist aber dem Glauben in Christus fremd. Denn was mit Liebe geschrieben war, hätte eine gleiche liebevolle und nicht zanksüchtige Erwiderung finden sollen. Oder ist es nicht ein Zeichen der Liebe, Priester zu senden, um den Leidenden Beileid auszudrücken, die, welche schrieben, einzuladen, daß sie kommen sollen, damit Alles rascher gelöst und geordnet werden könne und weder unsere Brüder mehr leiden, noch euch Jemand verleumde? Aber ich weiß nicht, was euch in eine solche Stimmung versetzt hat, daß wir auf den Gedanken kommen, ihr möchtet auch die Worte, mit denen ihr uns zu ehren scheinet, mit einer gewissen Verstellung in einem andern Sinne gebraucht haben. Denn auch die abgesandten Priester, die mit Freude hätten zurückkehren sollen, kehrten im Gegentheil mit Schmerz zurück über das, was sie dort haben vor sich gehen sehen. Und was mich betrifft, so habe ich, nachdem ich das Schreiben gelesen hatte, die Sache lange bei mir überlegt und den Brief bei mir behalten, indem ich glaubte, es würden doch Einige kommen, und ich bedürfe des Briefes nicht, damit er nicht, wenn er öffentlich bekannt würde, hier Viele in Schmerz versetzte. Als ich aber, da Niemand kam, ihn doch vorzeigen mußte, so wunderten sich, ich gestehe es euch, Alle, und sie konnten es fast nicht glauben, daß das überhaupt von euch geschrieben worden sei. Denn der Brief enthielt mehr Zank als Liebe. Hat aber der Verfasser des Briefes nur geschrieben, um seine Beredsamkeit zum Besten zu geben, so geziemt sich ein solches Streben für Andere. Denn in kirchlichen Dingen handelt es sich nicht um den Prunk der Beredsamkeit, sondern um die apostolischen Vorschriften und darum, daß man sich bemühe, in der Kirche Keinen von den Kleinen zu ärgern. Denn es ist nach dem Ausspruch der Kirche besser, daß Einem ein Mühlstein an den Hals gebunden und er ins Meer versenkt werde, als daß man auch nur Einen von den Kleinen ärgert. Wenn aber, weil Einige aus gegenseitiger Engherzigkeit sich gekränkt fühlten, — denn ich möchte nicht behaupten, daß Alle diese Gesinnung theilen, — dieser Brief entstanden ist, so hätte man entweder überhaupt dem Gefühle der Kränkung sich nicht hingeben oder wenigstens die Sonne über seinen Groll nicht untergehen lassen sollen. Wenigstens hätte man sich nicht so weit treiben lassen sollen, daß man demselben schriftlich Ausdruck gab.</p>
      <h2>22</h2><p>Doch was ist denn vorgekommen, das Groll zu erzeugen geeignet war? Oder was von dem, was wir schrieben, war geeignet, euern Groll zu erregen? Vielleicht, daß ich euch einlud, euch zu einer Synode einzufinden? Aber das hättet ihr eben mit Freude aufnehmen sollen. Denn die, denen ihre Thaten oder, wie sie selbst sagen, ihre Entscheidungen Zuversicht einflößen, nehmen es nicht übel auf, wenn die Entscheidung von Andern geprüft werden will, sondern sie zeigen Muth, weil die gerechte Entscheidung niemals ungerecht werden kann. Deßhalb haben auch die in der großen Synode von Nicäa versammelten Bischöfe nicht ohne göttliche Führung zugegeben, daß die Beschlüsse der ersten Synode in einer zweiten untersucht würden, damit die Richter, indem sie die spätere zweite Untersuchung vor Augen haben, mit aller Genauigkeit forschen, und damit die, über welche der Urtheilsspruch gefällt wird, fest glauben, daß sie nicht wegen des Hasses der früheren Richter, sondern nach Gerechtigkeit gerichtet werden. Wenn aber das eine alte Gewohnheit ist, die in der großen Synode erwähnt und schriftlich gemeldet wird, und ihr nicht wollt, daß sie bei euch zur Geltung komme, so ist eine solche Zurückhaltung ungeziemend. Denn was einmal in der Kirche zur Gewohnheit geworden und von den Synoden bestätigt worden ist, kann nicht mit Recht von Einigen abgeschafft werden. Aber auch ausserdem können sie sich hierin nicht mit Recht gekränkt fühlen. Denn als die, die von euch Eusebianern mit Briefen abgesendet worden waren, nämlich der Priester Makarius und die Diakonen Martyrius und Hesychius, hieher gekommen waren und den angekommenen Priestern des Athanasius nicht Stand halten konnten, sondern in Allem beschämt und überführt wurden, da baten sie uns, eine Synode zu berufen und sowohl an den Bischof Athanasius in Alexandria zu schreiben, als auch zu schreiben an die Eusebianer, damit in Gegenwart Aller die gerechte Entscheidung getroffen werden könne. Denn damals versprachen sie auch, Alles gegen Athanasius beweisen zu wollen. Denn öffentlich waren Martyrius und Hesychius mit ihren Begleitern von uns überführt worden, und die Priester des Bischofs Athanasius widerstanden unerschüttert. Die Begleiter des Martyrius aber, um die Wahrheit zu sagen, wurden in Allem beschämt, weßhalb sie auch auf den Zusammentritt einer Synode drangen. Hätte ich nun, ohne daß Martyrius und Hesychius mit ihren Begleitern auf den Zusammentritt einer Synode gedrungen hätten, wegen unserer Brüder, die über erlittenes Unrecht klagten, aufgemuntert, die Briefschreiber nicht leicht durchzulassen, so wäre selbst dann die Aufmunterung gerechtfertigt und gerecht gewesen, denn sie ist kirchlich und Gott wohlgefällig. Da aber die, welche ihr Eusebianer selbst eueres Vertrauens für würdig hieltet, uns um die Berufung baten, so wäre es für die Gerufenen billig gewesen, sich nicht gekränkt zu fühlen, sondern vielmehr bereitwillig zu kommen. Daraus geht also hervor, daß der angenommene Groll der Gekränkten grundlos, ihre Ablehnung aber, da sie nicht kommen wollten, ungeziemend und verdächtig sei. Erhebt Jemand über das, was er an <em>sich selbst</em> billigt, eine Anklage, sobald er es einen <em>Andern</em> thun sieht? Denn wenn, wie ihr schreibt, jede Synode eine Giltigkeit hat, an der man nicht rütteln darf, und der Richter entehrt wird, sobald Andere den Richterspruch untersuchen, so erwäget, Geliebte, wer die Synode entehrt, und wer die Entscheidungen der früheren Richter umstößt. Damit es aber nicht den Anschein gewinne, als wollte ich durch Erforschung des Einzelnen jetzt Jemand lästig fallen, so genügt, was zuletzt geschehen ist, bei dessen Anhörung man schaudern möchte, um einen Begriff von all dem zu geben, was wir übergehen.</p>
      <h2>23</h2><p>Die Arianer, die von Alexander seligen Andenkens dem ehemaligen Bischof von Alexandria, wegen Gottlosigkeit excommunicirt wurden, sind nicht bloß in allen Städten ausgewiesen, sondern auch von Allen, die auf der großen Synode zu Nicäa sich gemeinsam versammelt hatten, mit dem Anathem belegt worden. Denn nicht einen gewöhnlichen Fehler hatten sie begangen noch gegen einen Menschen gesündigt, sondern gegen unsern Herrn Jesus Christus selbst, den Sohn des lebendigen Gottes. Und gleichwohl heißt es jetzt, daß die, welche vom ganzen Erdkreis ausgestoßen und in der ganzen Kirche gebrandmarkt wurden, Aufnahme gefunden haben, und ich glaube, daß auch ihr bei dieser Nachricht ungehalten sein müßt. Wer also entehrt die Synode? Nicht die, welche die dreihundert Stimmen für Nichts achten und die Gottlosigkeit der Gottesfurcht vorziehen? Denn die Häresie der Ariomaniten wurde überall von allen Bischöfen verurtheilt und verboten. Den Bischöfen Athanasius und Marcellus aber stehen Mehrere zur Seite, die für sie sprechen und schreiben. Denn von Marcellus wurde uns bezeugt, daß er auch auf der Synode in Nicäa den Gesinnungsgenossen des Arius widersprochen hat. Von Athanasius aber wurde uns bezeugt, daß er nicht einmal in Tyrus verurtheilt werden konnte, in der Mareotis aber nicht anwesend war, wo das Beweismaterial gegen ihn gesammelt worden sein soll. Ihr wißt aber, Geliebte, daß einseitiges Vorgehen keine Giltigkeit hat und verdächtig erscheint. Obschon aber Dieß so sich verhält, so habe ich der gründlichen Untersuchung wegen weder euch, noch denen, die für sie geschrieben haben, den Vorzug gegeben, sondern die, welche geschrieben hatten, eingeladen zu kommen, damit, da Mehrere für sie geschrieben haben, Alles auf einer Synode untersucht und so weder der Unschuldige verurtheilt noch der Schuldige als schuldlos angesehen würde. Nicht also von uns wird eine Synode entehrt, sondern von denen, die willkürlich und ohne Umstände und ohne Zustimmung der Richter die von Allen verurtheilten Arianer aufgenommen haben. Denn die meisten derselben sind bereits aufgelöst bei Christus, einige aber werden auch jetzt noch in diesem Leben geprüft und sind gehalten, daß man ihren Richterspruch umgestoßen hat.</p>
      <h2>24</h2><p>Dieß haben wir auch von denen erfahren, die in Alexandria waren. Denn es sind auch ein gewisser Karpones, der von Alexander wegen der Häresie des Arius excommunicirt worden war, und Einige, die gleichfalls wegen der nämlichen Häresie excommunicirt worden waren, von einem gewissen Gregorius gesendet, hieher gekommen. Zugleich haben wir durch den Priester Makarius und durch die Diakonen Martyrius und Hesychius Nachricht erhalten. Bevor nämlich die Priester des Athanasius angelangt waren, forderten sie uns auf, an einen gewissen Pistus in Alexandria zu schreiben, als noch der Bischof Athanasius in Alexandria war. Von diesem Pistus aber erklärten die anwesenden Priester des Athanasius, daß er ein Arianer und von dem Bischof Alexander und der Synode in Nicäa excommunicirt, von einem gewissen Secundus aber geweiht worden sei, den die große Synode als einen Arianer excommunicirte. Dieß widersprachen selbst Martyrius und seine Begleiter nicht, und sie stellten nicht in Abrede, daß Pistus von Secundus die Weihe empfangen habe. Ermesset also auch hieraus, wer wohl mit Recht Tadel verdiene, wir, daß wir uns nicht verleiten ließen, an den Arianer Pistus zu schreiben, oder die, welche uns riethen, die große Synode zu entehren und an die Gottlosen wie an Gottesfürchtige zu schreiben. Denn auch der Priester Makarius, der von Eusebius im Gefolge des Martyrius abgesendet worden war, reiste, wie er von der Anwesenheit der Priester des Athanasius vernommen hatte, während wir auf seine Ankunft warteten, mit Martyrius und Hesychius und ihren Begleitern zur Nachtszeit ab, obschon er unpäßlich war. Daraus konnten wir mit Recht schließen, daß er abzog, weil er sich der Überweisung des Pistus schämte. Denn unmöglich konnte die Weihe durch den Arianer Secundus in der katholischen Kirche giltig sein. Denn das ist in Wahrheit eine der Synode und den auf ihr versammelten Bischöfen zugefügte Schmach, wenn das, was mit so großer Sorgfalt und Gewissenhaftigkeit wie in der Gegenwart Gottes geschah, als ungiltig umgestoßen wird.</p>
      <h2>25</h2><p>Sollen nun, wie ihr schreibt, die Beschlüsse der Synoden nach dem Beispiel des Novatus und Paul von Samosata zu Recht bestehen, so hätte man um so mehr den Beschluß der Dreihundert nicht umstoßen, es hätte die katholische Synode von einigen Wenigen nicht entehrt werden sollen. Denn Häretiker sind die Arianer wie Diese, und die Beschlüsse gegen sie sind den Beschlüssen gegen Diese ähnlich. Da also Dieß gewagt worden ist, wer ist es, der die Flamme der Zwietracht angezündet hat? Denn ihr habt uns in eurem Schreiben diese That vorgeworfen. Haben also wir Zwietracht gestiftet, die wir den Schmerz mit den leidenden Brüdern theilten und in Allem nach dem kirchlichen Gesetze handelten, oder die, welche aus Zanksucht und gegen die kirchliche Vorschrift den Beschluß der Dreihundert umstießen und in Allem die Synode mißachteten? Denn es wurden nicht nur die Arianer aufgenommen, sondern es haben auch die Bischöfe die Gewohnheit angenommen, von einem Ort zu einem andern überzusiedeln. Wenn ihr nun die Würde der Bischöfe in Wahrheit für die gleiche und die nämliche haltet und nicht nach der Größe der Städte, wie ihr schreibt, die Bischöfe beurtheilt, so sollte der, welcher mit einer kleinen betraut worden ist, in der ihm anvertrauten ausharren und nicht mit Geringschätzung des anvertrauten Gegenstandes zu einer ihm nicht übergebenen übergehen, um die ihm von Gott anvertraute zu mißachten und eitlem Menschenruhme nachzustreben. Ihr hättet also, Geliebte, kommen und nicht ablehnen sollen, um die Sache zu Ende zu führen; denn das ist vernünftig. Aber vielleicht hinderte euch der festgesetzte Termin? Denn das habt ihr in euerm Schreiben bemängelt, daß wir einen zu kurzen Termin für die Synode angesetzt hätten. Aber auch das, Geliebte, ist eine Ausrede. Denn wenn Einigen, da sie auf der Reise begriffen waren, die Zeit zu kurz geworden wäre, so wäre es ein Beweis, daß eine zu kurze Zeit als Termin festgesetzt wurde. Wenn sie aber, während sie selbst nicht kommen wollten, auch die Priester bis zum Monat Januar zurückhielten, so verräth die Ausrede, daß sie keine Zuversicht hatten. Denn sie wären, wie gesagt, gekommen, wenn sie Zuversicht gehabt hätten, ohne sich um den weiten Weg zu kümmern oder sich vom Termin beirren zu lassen, indem sie vielmehr auf die Gerechtigkeit und Billigkeit ihrer Sache vertraut hätten. Aber vielleicht kamen sie wegen der Zeitumstände nicht? Denn das habt ihr mir wieder schriftlich mitgetheilt, wir sollten im Hinblick auf die gegenwärtigen Zustände im Orient euch nicht zumuthen, zu erscheinen. Wenn ihr aber wegen dieser Zustände nicht gekommen seid, wie ihr sagt, so hättet ihr zuerst im Hinblick auf diese Zustände keine Spaltung, noch Jammer und Thränen in den Kirchen veranlassen sollen. Nun aber haben die, welche Dieß thaten, bewiesen, daß nicht die Zeitumstände die Schuld trugen, sondern der freie Entschluß, weil sie nicht kommen wollten.</p>
      <h2>26</h2><p>Ich wundere mich auch über eine Stelle des Briefes, daß ihr schreiben mochtet, ich allein habe den Eusebianern allein und nicht an euch alle geschrieben; denn man kann in diesem Tadel eher Leichtsinn als Wahrheit finden. Denn da ich von keiner andern Seite einen Brief gegen Athanasius empfangen hatte als von Martyrius und Hesychius und ihren Begleitern, so mußte ich an die schreiben, die gegen ihn geschrieben hatten. Es hätten daher entweder die Eusebianer nicht allein ohne euch Alle schreiben, oder ihr hättet es nicht übel aufnehmen sollen, daß ich nicht an euch schrieb, während ich an die schrieb, die auch ihrerseits schrieben. Denn hätte ich an euch alle schreiben sollen, so hättet auch ihr mit Jenen schreiben sollen. Nun aber haben wir in folgerichtiger Weise an die geschrieben, die auch mit uns in schriftlichen Verkehr getreten sind. Hat es euch aber verletzt, daß ich allein an Jene geschrieben habe, so müßt ihr auch ungehalten sein, daß sie an mich allein geschrieben haben. Aber auch in dieser Beziehung haben wir eine glaubwürdige und gegründete Entschuldigung, Geliebte! Ich muß euch nämlich zugleich mittheilen, daß, wenn ich auch allein schrieb, Dieß doch nicht allein meine Meinung, sondern die Meinung aller Bischöfe in Italien und in diesen Gegenden ist. Und ich wollte nicht, daß sie alle schrieben, damit sie nicht durch ihre Menge lästig fielen. Es sind jedoch trotzdem zur festgesetzten Zeit Bischöfe zusammengetreten und haben sich in dieser Ansicht geeinigt, die ich euch wieder schriftlich mittheile. Wenn ich euch also auch allein schreibe, Geliebte, so erkennet, daß das die Meinung Aller sei. So viel nun darüber, daß Einige von euch nicht vernünftige, sondern ungerechtfertigte und verdächtige Entschuldigungen vorbringen.</p>
      <h2>27</h2><p>Daß wir aber unsere Mitbischöfe Athanasius und Marcellus nicht leichtsinnig und in ungerechter Weise in unsere Gemeinschaft aufgenommen haben, glauben wir, obschon das bereits Gesagte genügen würde, noch in Kürze nachweisen zu sollen. Es schrieben zuerst die Eusebianer gegen Athanasius mit seinem Anhang. Jetzt aber habt auch ihr geschrieben, und es haben sehr viele Bischöfe aus Ägypten und den übrigen Eparchien für Athanasius geschrieben. Erstens nun sind euere Schreiben gegen ihn mit sich selbst in Widerspruch, und das zweite stimmt mit dem ersten nicht überein, vielmehr wird in vielen Dingen das erste vom zweiten aufgehoben, und das zweite vom ersten angeklagt. Wenn aber die Briefe nicht übereinstimmen, so verdient deren Inhalt keinen Glauben. Ferner, wenn ihr wollt, daß man glaube, was ihr schreibt, so muß man auch denen, die für ihn geschrieben haben, den Glauben nicht verweigern, zumal ihr in der Ferne seid, Jene aber auf dem Schauplatz sind und den Mann kennen und über die dortigen Ereignisse schreiben, indem sie seinem Leben Zeugniß geben und versichern, daß in Allem gegen ihn intriguirt worden sei. Auch hieß es einmal von einem Bischof Arsenius, er sei von Athanasius getödtet worden. Aber von diesem erfuhren wir, daß er lebe, ja sogar mit ihm in Freundschaft stehe. Jene Aufnahme des Beweismaterials, die in der Mareotis geschah, ist nach seiner Versicherung einseitig geschehen. Denn es sei dort weder der angeklagte Priester Makarius noch sein Bischof Athanasius selbst anwesend gewesen. Und das erkannten wir nicht bloß aus seinen Worten, sondern haben es auch aus dem Beweismaterial erkannt, das uns Martyrius und Hesychius überbrachten. Denn beim Durchlesen fanden wir, daß der Ankläger Ischyras dort war, nicht aber Makarius noch der Bischof Athanasius, ebenso, daß die Priester des Athanasius zu erscheinen wünschten, aber mit ihrer Bitte abgewiesen wurden. Es hätte aber, Geliebte, wenn man bei der Untersuchung sich um die Wahrheit gekümmert hätte, nicht bloß der Ankläger, sondern auch der Angeklagte zugegen sein sollen. Denn wie in Tyrus der angeklagte Makarius zugegen war und sein Ankläger Ischyras, und Nichts bewiesen wurde, ebenso hätte auch nach der Mareotis nicht bloß der Ankläger, sondern auch der Angeklagte abgehen sollen, damit er in seiner Anwesenheit entweder überführt worden wäre oder, konnte er nicht überführt werden, das Intriguennetz hätte nachweisen können. Da aber das nun nicht geschah, sondern der Ankläger mit denen, die Athanasius ablehnte, allein hinging, so erscheint die Sache verdächtig.</p>
      <h2>28</h2><p>Er erhob auch Beschwerde, daß die, welche nach der Mareotis abgingen, ohne seine Zustimmung dahin abgegangen seien. Er sagte nämlich, daß sie den Theognius, Maris, Theodor, Ursacius, Valens und Macedonius, die verdächtig waren, abgesendet hätten. Und das wies er nicht nur in seinen Reden, sondern auch aus dem Briefe Alexanders, des ehemaligen Bischofs von Thessalonich, nach. Er zeigte nämlich seinen Brief vor, den er an Dionysius, den Comes auf der Synode, geschrieben hatte, und in dem er kund gibt, daß gegen Athanasius offenbar Intriguen gespielt worden seien. Auch wies er einen ächten ganz von der Hand des Anklägers Ischyras geschriebenen Brief vor, in dem er den allmächtigen Gott zum Zeugen anrief und behauptete, es sei weder ein Kelch zerbrochen noch ein Tisch umgestürzt worden, sondern er sei von Einigen angestiftet worden, diese Anklage zu erdichten. Auch Priester, die von der Mareotis gekommen waren, versicherten, daß weder Ischyras ein Priester der katholischen Kirche sei noch Makarius so Etwas verbrochen habe, wie Jener ihn beschuldigte. Die Priester und Diakonen aber, die hieher kamen, bezeugten nicht Weniges, sondern Vieles zu Gunsten des Bischofs Athanasius und versicherten, daß Nichts von dem wahr sei, was gegen ihn vorgebracht werde, und daß gegen ihn intriguirt worden sei. Und alle Bischöfe Ägyptens und Libyens versicherten in ihrem Schreiben, daß sowohl seine Weihe gesetzlich und kirchlich vor sich gegangen als auch Alles, was ihr gegen ihn ausgesagt habt, erlogen sei. Denn es sei weder ein Mord geschehen, noch sei seinetwegen Jemand getödtet noch ein Kelch zerbrochen worden, sondern Alles sei erlogen. Und aus dem in der Mareotis einseitig gesammelten Beweismaterial zeigte der Bischof Athanasius, daß ein Katechumen auf gestellte Frage gesagt habe, er sei drinnen bei Ischyras gewesen, als Makarius, der Priester des Athanasius, nach ihrer Angabe sich am Orte befand, ebenso, daß von Andern, die verhört wurden, der Eine ausgesagt hätte, daß Ischyras in einer kleinen Kammer, ein Anderer, daß er neben der Thüre lag und damals krank war, als nach ihrer Angabe Makarius dorthin kam. Aus dem, was er sagte, machen natürlich auch wir uns unsere Gedanken: Wie konnte der, welcher krank an der Thüre lag, aufrecht stehen und den Gottesdienst feiern und opfern? Oder wie konnte die Opferung stattfinden, wenn die Katechumenen drinnen waren? Denn waren die Katechumenen drinnen, so war noch nicht die Zeit der Opferung. Das sagte, wie gesagt, der Bischof Athanasius und wies aus dem Beweismaterial unter Beistimmung seiner Begleiter nach, daß er weder überhaupt jemals Priester in der katholischen Kirche gewesen noch als Priester jemals bei einer Versammlung in der Kirche erschienen sei. Denn nicht einmal, so behaupteten sie, als Alexander gemäß der Milde der großen Synode die Anhänger des melitianischen Schismas wieder aufnahm, sei er von Melitius unter den Seinigen genannt worden, woraus ganz deutlich hervorgeht, daß er auch zu den Priestern des Melitius nicht gehöre. Denn wenn er dazu gehörte, so müßte auch er unter ihnen aufgezählt werden. Ausserdem wurde auch in andern Dingen dem Ischyras von Athanasius aus dem Beweismaterial seine Lügenhaftigkeit bewiesen. Denn da er ihn angeklagt hatte, als seien zur Zeit, da nach ihrer Angabe Makarius erschien, Bücher verbrannt worden, wurde er von den von ihm selbst vorgeführten Zeugen als Lügner überführt.</p>
      <h2>29</h2><p>Da also Dieß in dieser Weise ausgesagt wurde und so viele Zeugen zu seinen Gunsten sprachen und er so Vieles zu seiner Rechtfertigung vorbrachte, was hätten wir thun sollen? Oder was verlangt das Kirchengesetz anders, als den Mann nicht zu verurtheilen, sondern ihn vielmehr aufzunehmen und als Bischof zu betrachten, wie wir auch thaten? Denn abgesehen von all dem blieb er hier ein Jahr und sechs Monate und wartete auf euere Ankunft oder die Ankunft derer, die kommen wollten. Durch sein Erscheinen aber beschämte er Alle, weil er nicht erschienen wäre, wenn er keine Zuversicht gehabt hätte. Denn er ist nicht aus eigenem Antrieb gekommen, sondern weil er von uns eine schriftliche Einladung empfangen hatte, wie wir auch an euch schrieben. Und gleichwohl habt ihr trotz so Vielem uns getadelt, als hätten wir gegen die Kirchengesetze gehandelt. Erwäget nun, wer gegen die Kirchengesetze gehandelt hat, wir, die wir bei so vielen Beweisen den Mann aufgenommen haben, oder die, welche in einer Entfernung von sechsunddreissig Stationen in Antiochia einen Fremdling zum Bischof ernannten und mit Militärmacht nach Alexandria sandten? Das geschah nicht einmal damals, als er nach Gallien in die Verbannung geschickt wurde. Es wäre aber auch damals geschehen, wenn er wirklich überführt worden wäre. Er fand darum ja auch bei seiner Rückkehr eine verwaiste und auf ihn harrende Kirche.</p>
      <h2>30</h2><p>Jetzt aber weiß ich nicht, in welcher Weise das Geschehene geschehen ist. Denn erstens, wenn man die Wahrheit sagen soll, hätte Niemand dem Urteilsspruch der Synode vorgreifen sollen, wenn wir zu einer Synode einluden. Ferner hätte nicht eine solche Neuerung in der Kirche stattfinden sollen. Denn was ist das für ein Kirchengesetz oder was für eine apostolische Überlieferung, daß, obschon die Kirche ruhig ist und so viele Bischöfe mit Athanasius, dem Bischof von Alexandria, in Eintracht leben, man den Gregorius hinsendet, welcher der Stadt fremd, in derselben nicht getauft und den Meisten unbekannt ist, ohne von den Priestern, ohne von den Bischöfen, ohne vom Volk verlangt worden zu sein, daß man ihn vielmehr in Antiochia weiht und nach Alexandria sendet, nicht mit Priestern, nicht mit Diakonen der Stadt, nicht mit Bischöfen aus Ägypten, sondern mit Soldaten? Denn darüber sprachen und beschwerten sich die, welche hieher kamen. Denn hätte man auch den Athanasius nach der Synode schuldig gefunden, so hätte die Weihe nicht in so gesetzwidriger Weise und im Widerspruch mit den Kirchengesetzen geschehen, sondern es hätten in der Kirche selbst, aus dem Priesterstande selbst, aus dem Klerus selbst die Bischöfe in der Eparchie einen Bischof weihen, und es hätten nicht die apostolischen Vorschriften umgangen werden sollen. Denn hättet ihr, wenn gegen Einen von euch so Etwas geschehen wäre, nicht euere Stimme erhoben, hättet ihr nicht Bestrafung verlangt, weil die Kirchengesetze verletzt seien? Geliebte, wie in Gottes Gegenwart sprechen wir der Wahrheit gemäß es aus und sagen, daß das nicht gottesfürchtig ist, noch gerecht, noch kirchlich. Denn auch, was von Gregor bei seinem Einzug geschehen sein soll, läßt erkennen, wie es mit seiner Weihe bestellt ist. Denn in so friedlichen Zeiten, wie die selbst meldeten, die von Alexandria kamen, und wie die Bischöfe schrieben, gab es in der Kirche einen Brand, wurden Jungfrauen entblößt, Einsiedler mit Füßen getreten, Priester und viele Laien mißhandelt und ihnen Gewalt angethan, Bischöfe ins Gefängniß geworfen, Viele herumgeschleift. Die heiligen Geheimnisse, wegen deren sie den Priester Makarius beschuldigten, wurden von den Heiden geplündert und auf die Erde geworfen, damit Einige sich der Einsetzung des Gregorius fügten. Solche Dinge aber zeigen, wer die Kirchengesetze verletze. Denn wäre die Weihe gesetzlich gewesen, so hätte er nicht in ungesetzlicher Weise die zum Gehorsam genöthigt, die ihm nach dem Gesetze den Gehorsam verweigerten. Und obschon Dieß geschah, schreibt ihr doch, daß tiefer Friede in Alexandria und Ägypten geherrscht habe. Da müßte wahrlich das Geschäft des Friedens ein anderes geworden sein, wenn ihr solche Zustände Frieden nennt.</p>
      <h2>31</h2><p>Auch das glaube ich euch mittheilen zu müssen, daß Athanasius versicherte, Makarius sei in Tyrus unter einer Bewachung von Soldaten geblieben, und nur der Ankläger sei mit denen, die nach der Mareotis gingen, abgegangen, den Priestern, die bei der Untersuchung anwesend zu sein wünschten, sei Dieß nicht gestattet worden, die Untersuchung über den Kelch und Tisch habe stattgefunden vor dem Eparchen und seiner Mannschaft in Gegenwart von Heiden und Juden. Das kam mir Anfangs unglaublich vor, wenn es nicht aus dem Beweismaterial hervorgegangen wäre, und das erregte unser Staunen und wird auch, glaube ich, euer Staunen erregen, Geliebte! Den Priestern wird die Anwesenheit nicht gestattet, die doch die Diener der Geheimnisse sind, aber vor einem auswärtigen Richter, in Gegenwart von Katechumenen, und was das Schlimmste ist, vor Heiden und Juden, die in Bezug auf ihre Stellung zum Christenthum nicht wohl angeschrieben sind, findet eine Untersuchung über des Blut Christi und den Leib Christi statt. Denn wäre überhaupt irgend ein Verbrechen vorgekommen, so hätten solche Dinge in der Kirche von Klerikern in gesetzlicher Weise untersucht werden sollen, und nicht von Heiden, die das Wort verabscheuen und die Wahrheit nicht kennen. Ich glaube, daß es euch und Allen einleuchten werde, was das für ein großer und schwerer Verstoß ist. So viel von Athanasius.</p>
      <h2>32</h2><p>In Betreff des Marcellus aber, da ihr auch von ihm schreibt, als ob er gegen Christus gottlos sei, will ich euch mittheilen, daß er, als er hier war, betheuerte, es sei das, was ihr über ihn geschrieben habt, nicht wahr. Als wir gleichwohl ihn aufforderten, über den Glauben sich auszusprechen, da sprach er selbst mit solcher Unbefangenheit sich aus, daß wir erkannten, daß er nur die Wahrheit bekenne. Denn er bekannte, in Bezug auf unsern Herrn und Heiland Jesus Christus so gottesfürchtig zu denken, wie die katholische Kirche denkt, und er betheuerte, nicht bloß jetzt, sondern von jeher so zu denken. (Ebenso gaben unsere Priester, die einst auf der Synode zu Nicäa gewesen waren, seiner Rechtgläubigkeit Zeugniß.) Er versicherte nämlich, sowohl damals als auch jetzt mit der Häresie der Arianer nicht in Übereinstimmung gewesen zu sein. (Deßhalb muß ich auch euch ermahnen, daß Niemand eine solche Häresie aufnehme, sondern als abweichend von der gesunden Lehre verabscheue.) Da er also richtig denkt und ihm seine Rechtgläubigkeit bezeugt wird, was hätten wir auch mit ihm wieder anfangen sollen, als daß wir ihn, wie wir thaten, als einen Bischof betrachteten und ihn nicht aus unserer Gemeinschaft ausschloßen? Das nun habe ich geschrieben, nicht um sie zu vertheidigen, sondern damit ihr euch überzeuget, daß wir nach Recht und Gesetz die Männer aufnahmen, und daß ihr ohne Grund hadert. Ihr aber müßt bestrebt sein und euch in jeder Weise bemühen, daß das, was gegen das Gesetz geschehen ist, wieder recht gemacht werde, die Kirchen Frieden haben, damit der uns verliehene Friede des Herrn von Dauer sei, die Kirchen nicht gespalten werden und euch nicht der Vorwurf treffe, als wäret ihr Urheber der Spaltung. Denn ich gestehe euch zu, daß das Geschehene nicht eine Veranlassung des Friedens, sondern der Spaltung ist.</p>
      <h2>33</h2><p>Denn nicht nur die Bischöfe Athanasius und Marcellus haben sich hieher begeben und Klage erhoben, daß ihnen Unrecht geschehen sei, sondern auch sehr viele andere Bischöfe aus Thracien, Cölesyrien, Phönicien, Palästina, und viele Priester theils von Alexandria, theils aus andern Gegenden kamen hieher zur Synode und beschwerten sich vor allen versammelten Bischöfen ausser Anderm, was sie vorbrachten, auch darüber, daß den Kirchen Gewalt und Ungerechtigkeit widerfahren, und erhärteten, daß Ähnliches, wie in Alexandria vorgefallen, auch ihren und andern Kirchen begegnet sei, nicht bloß mit Worten sondern auch durch Thatsachen. Auch aus Ägypten und Alexandria kamen neuerdings wieder Priester mit Briefen und klagten, daß viele Bischöfe und Priester, die zur Synode hätten kommen wollen, daran mit Gewalt verhindert worden seien. Sie behaupteten nämlich, daß auch jetzt noch trotz der Abreise des Bischofs Athanasius Bischöfe, die Bekenner waren, mit Schlägen mißhandelt, andere ins Gefängniß geworfen, und sogar schon alte, die schon überaus lange Zeit die bischöfliche Würde inne hätten, in die öffentlichen Steinbrüche geschickt und fast alle Kleriker und Laien der katholischen Kirche bedrängt und verfolgt würden. Ferner sagten sie, daß einige Bischöfe und einige Brüder aus keinem andern Grunde verbannt worden seien, als weil man sie gegen ihren Willen zwingen wollte, mit Gregor und seinen Arianern in Gemeinschaft zu treten. Auch daß zu Ancyra in Galatien Vieles geschehen und das Nämliche, was in Alexandria geschah, hörten wir nicht nur von Andern, sondern es wurde uns auch von Bischof Marcellus bezeugt. Ausserdem haben die, welche ankamen, gegen Einige von euch, um nicht ihre Namen zu nennen, so große und schreckliche Anklagen erhoben, daß ich es nicht über mich bringen konnte, sie niederzuschreiben. Aber vielleicht habt ihr sie von Andern vernommen. Denn deßhalb habe ich euch zumeist in meinem Schreiben eingeladen zu kommen, damit ihr anwesend es vernähmet und Alles wieder recht gemacht und geheilt werden könnte. Aus diesem Grunde hätten die Eingeladenen bereitwilliger kommen und nicht ablehnen sollen, damit sie sonst, wenn sie nicht kämen, nicht wegen ihrer Behauptungen in Verdacht geriethen, als könnten sie nicht beweisen, was sie geschrieben haben.</p>
      <h2>34</h2><p>Da also Dieß in dieser Weise hinterbracht wurde und in dieser Weise die Kirchen litten und verfolgt wurden, wie die Boten versicherten, wer hat das Feuer der Zwietracht angefacht? Wir, die wir hierüber Schmerz empfinden und mit den leidenden Brüdern Mitleid fühlen, oder die, welche Solches gethan haben? Denn ich wundere mich, wie ihr, obschon dort eine so großartige Verwirrung in jeder Kirche war, daß wegen derselben die, welche kamen, hieher gegangen sind, dennoch schreiben konntet, daß in den Kirchen Eintracht geherrscht habe. So Etwas geschieht aber nicht zur Erbauung der Kirche, sondern zu ihrer Vernichtung, und die hierüber sich freuen, sind nicht Söhne des Friedens, sondern der Verwirrung. Unser Gott aber ist nicht ein Gott der Verwirrung, sondern des Friedens. Deßhalb, Gott und der Vater unsers Herrn Jesus Christus weiß es, weil ich für euern Ruf besorgt war und wünschte, daß in den Kirchen nicht Verwirrung herrsche, sondern daß sie in der Weise fortbeständen, wie sie von den Aposteln eingerichtet wurden, erachtete ich es für nöthig, Dieß an euch zu schreiben, damit ihr endlich einmal die verabscheut, welche durch ihre gegenseitige Gehässigkeit die Kirchen in einen solchen Zustand versetzen. Denn ich vernehme, daß einige Wenige an Allem die Schuld tragen. Bestrebet euch als Solche, die ein mitleidiges Herz haben, wie schon gesagt, das, was gegen die Kirchengesetze gefehlt wurde, wieder recht zu machen, damit, wenn auch Etwas im Voraus übersehen wurde, Dieß durch euern Eifer geheilt werde. Schreibet nicht: Du hast die Gemeinschaft mit Marcellus und Athanasius der unsrigen vorgezogen. Denn das sind nicht Kundgebungen des Friedens, sondern des Zankes und Bruderhasses. Deßhalb habe ich ja auch das Vorhergehende geschrieben, damit ihr euch überzeuget, daß wir sie nicht mit Unrecht aufgenommen haben, und ihr einmal diesem Gezänke ein Ende macht. Denn wäret ihr gekommen, und wären sie, falls sie keine gründlichen Beweise für sich hätten vorbringen können, verurtheilt worden, so hättet ihr so Etwas mit Recht geschrieben. Da wir aber, wie gesagt, in gesetzmäßiger und nicht in ungerechter Weise mit ihnen in Gemeinschaft traten, so bitte ich euch um Christi willen, lasset die Glieder Christi nicht zerreissen und laßt euch nicht von Vorurtheilen einnehmen, sondern ziehet den Frieden des Herrn vor. Denn es ist nicht erlaubt und nicht gerecht, wegen der Engherzigkeit Einiger die, welche nicht verurtheilt worden sind, von sich zu weisen und dadurch den Geist zu betrüben. Glaubt ihr aber, daß ihr gegen sie einen Beweis führen und sie offen überführen könnt, so sollen die kommen, welche es wollen. Denn sie selbst erklärten sich bereit, das, worüber sie uns Mittheilung machten, darzulegen und zu beweisen.</p>
      <h2>35</h2><p>Benachrichtigt uns also hierüber, Geliebte, damit wir sowohl an Jene als auch an die Bischöfe schreiben, die wieder zusammenkommen sollen, damit in Gegenwart Aller die Schuldigen verurtheilt werden und nicht mehr Verwirrung in den Kirchen herrsche. Denn es genügt das Geschehene. Es genügt, daß in Gegenwart von Bischöfen Bischöfe verbannt wurden. Darum soll man hierüber auch nicht viele Worte machen, damit es nicht scheine, als wollte man denen, welche damals anwesend waren, nahe treten. Denn wenn man die Wahrheit sagen soll, so hätte man es nicht so weit treiben und hätte die Engherzigkeit nicht so weit gehen sollen. Doch sei es so! Athanasius und Marcellus sind, wie ihr schreibt, aus ihren Sitzen entfernt worden. Was soll man von den Übrigen sagen, über die, wie gesagt, aus verschiedenen Gegenden hieher gekommenen Bischöfe und Priester? Denn auch sie sagten wieder, daß sie fortgeschleppt worden seien und Solches erduldet hätten. O Geliebte, nicht mehr in Übereinstimmung mit dem Evangelium, sondern zum Zwecke der Verbannung und Hinrichtung werden nunmehr die gerichtlichen Untersuchungen in der Kirche veranstaltet! Denn wenn sie überhaupt, wie ihr sagt, Etwas verbrochen haben, so hätte nach dem Kirchengesetze und nicht in solcher Weise das Urtheil gefällt werden sollen. Es hätte an uns Alle geschrieben werden sollen, damit dann von Allen über das Recht entschieden worden wäre. Denn Bischöfe waren es, die duldeten, und nicht die nächstbesten Kirchen duldeten, sondern die, an deren Spitze die Apostel selbst persönlich gestanden waren. Warum wurde uns aber gerade über die alexandrinische Kirche nicht geschrieben? Oder ist euch unbekannt, daß es Sitte war, zuerst an uns zu schreiben und dann von hier aus über das Recht entscheiden zu lassen? Wenn also gegen den dortigen Bischof ein solcher Verdacht bestand, so hätte an die hiesige Kirche geschrieben werden sollen. Nun aber verlangen die, welche uns keine Einsicht gestattet haben und selbst willkürlich verfahren sind, gar von uns, daß wir mit ihnen stimmen, die wir an der Untersuchung nicht Theil genommen haben. Nicht so lauten die Vorschriften des Paulus, nicht so die Überlieferung der Väter. Eine andere Gestalt ist das und eine neue Einrichtung. Ich bitte, tragt es gerne, es trägt zum gemeinen Besten bei, was ich schreibe. Denn was wir vom seligen Apostel Petrus überkommen haben, das theile ich euch mit, und ich würde es nicht geschrieben haben, da ich glaube, daß es Allen bekannt sei, hätte uns das Vorgefallene nicht bestürzt gemacht. Bischöfe werden weggeschleppt und vertrieben. Andere von einer andern Gegend werden dafür aufgestellt, und andere werden verfolgt, so daß sie wegen der fortgeschleppten trauern, wegen der gesendeten aber Zwang erleiden, damit sie die, welche sie wollen, nicht suchen, die sie aber nicht wollen, aufnehmen. Ich bitte euch, daß Solches nicht mehr geschehen möge. Schreibet vielmehr gegen die, welche so Etwas unternehmen, damit den Kirchen nichts Solches mehr begegne, noch ein Bischof oder Priester Mißhandlung erdulde, oder Jemand, wie sie uns mittheilten, genöthigt werde, gegen seinen Willen Etwas zu thun, damit wir nicht den Heiden zum Gespötte dienen, und vor Allem, damit wir Gott nicht erzürnen. Denn Jeder von uns wird am Tage des Gerichtes Rechenschaft ablegen müssen über das, was er hier gethan hat. Möchten aber Alle in ihrer Gesinnung mit Gott übereinstimmen, damit die Kirchen ihre Bischöfe wieder erhalten und sich beständig in Christus Jesus unserm Herrn freuen, durch den dem Vater die Herrlichkeit sei von Ewigkeit zu Ewigkeit. Amen. Ich wünsche, daß es euch wohl ergehe im Herrn, geliebte und heißersehnte Brüder!</p>
      <h2>36</h2><p>Das hatte die Synode in Rom durch Julius, den Bischof in Rom, geschrieben. Als nun die Eusebianer wieder unverschämt waren und die Kirchen in Verwirrung setzten und Viele verfolgten, so ließen die gottesfürchtigen Kaiser Constantius und Constans, als sie hievon Kenntniß erhalten hatten, an die Bischöfe des Abendlandes und Morgenlandes die Aufforderung ergehen, sich in der Stadt Sardica zu versammeln. Eusebius war nun inzwischen gestorben. Als daher von allen Seiten sehr Viele zusammengekommen waren, so forderten wir die Anhänger des Eusebius vor Gericht. Sie aber, da ihnen ihre Thaten vor Augen schwebten, und da sie ihre Ankläger erscheinen sahen, fürchteten den Richterspruch. Denn da Alle ohne Begleitung kamen, führten sie wieder zwei Comites mit sich, den Musonianus und den Hesychius Castresius, um nach ihrer Gewohnheit mit Hilfe ihrer Macht durchzusetzen, was sie wollten. Als aber die Synode ohne Comites gehalten wurde und kein Soldat zu derselben Zutritt erhielt, da erschracken sie, weil sie von ihrem Gewissen gefoltert wurden. Denn nicht mehr, wie ihnen beliebte, wurde über sie Gericht gehalten, sondern wie die Wahrheit es verlangte. Wir luden sie nun oft vor und die Synode der Bischöfe lud sie vor und sagte: Ihr seid gekommen, um gerichtet zu werden; warum also, nachdem ihr gekommen seid, macht ihr Anstände? Denn ihr hättet entweder nicht kommen oder, nachdem ihr gekommen seid, euch nicht entziehen sollen. Denn dadurch sprechet ihr euch am meisten das Urtheil. Sehet, es ist Athanasius da mit seinen Anhängern, die ihr in ihrer Abwesenheit anklagtet, damit ihr sie, wenn ihr Etwas gegen sie zu haben glaubt, in ihrer Gegenwart überführet. Könnt ihr das aber nicht und stellt ihr euch, als ob ihr es nicht wolltet, so seid ihr offenkundige Intriguanten, und es wird euch von der Synode dieser Urtheilsspruch zu Theil werden. Da, als sie das hörten und ihr Unrecht nicht in Abrede stellen konnten, — denn sie wußten, was sie gethan und gegen uns erdichtet hatten — scheuten sie sich zu kommen und verriethen ihre vielen schändlichen Intriguen gegen uns. Die heilige Synode mißbilligte also ihr ungeziemendes und verdächtiges Wegbleiben und ließ uns zur Vertheidigung zu. Und als wir mit Zeugen und Beweisen darlegten, was gegen uns geschehen war, da wurden sie mit Staunen erfüllt, und Alle erkannten, daß sie deßhalb mit Recht die Synode fürchteten, um nicht offen überführt zu werden. Und sie sagten: Vielleicht kamen sie in der Voraussetzung vom Morgenlande, daß Athanasius und seine Anhänger nicht erscheinen würden, weil sie die Flucht ergreifen, sobald sie sehen, daß sie ihrer Sache vertrauen und auf richterliche Entscheidung dringen. Uns also nahmen sie auf als Solche, denen Unrecht zugefügt worden, und die ohne Grund angeklagt wurden, und bekräftigten noch mehr die Gemeinschaft und das Liebesverhältniß mit uns. Die Theilnehmer an der Bosheit des Eusebius aber, die sich besonders anmaßend gezeigt hatten, verurtheilten sie: den Theodor von Heraklea, den Narcissus von Neronias, den Acacius von Cäsarea, den Stephanus von Antiochia, den Ursacius und Valens von Pannonien, den Menophantus von Ephesus, den Georgius von Laodicea, und sie schrieben an alle Bischöfe des Erdkreises und an die Diöcese eines Jeden der Gekränkten Folgendes.</p><p><em>Sendschreiben der in Sardica versammelten Synode.</em></p><p>Die heilige Synode, die durch Gottes Gnade in Sardica versammelt ist, aus Rom, Spanien, Gallien, Italien, Campanien, Calabrien, Apulien, Afrika, Sardinien, Pannonien, Mysien, Dacien, Noricum, Siscien, Dardanien, dem zweiten Dacien, Macedonien, Thessalien, Achaia, Epirus, Thracien, Rhodope, Palästina, Arabien, Kreta, Ägypten, den Priestern, Diakonen und der ganzen heiligen Kirche Gottes, die in Alexandria ihren Sitz hat, den geliebten Brüdern, Gruß im Herrn!</p>
      <h2>37</h2><p>Auch bevor wir das Schreiben eurer Frömmigkeit empfingen, war uns nicht unbekannt, sondern wir wußten sehr wohl, daß die Häupter der verrufenen Häresie der Arianer viele schreckliche Dinge wohl mehr zum Verderben ihrer Seele als zum Nachtheil der Kirche unternahmen. Denn darin bestand ihre Kunst und Verschlagenheit, und diesen todbringenden Vorsatz haben sie beständig in sich getragen, daß sie sich bemühten, Alle, welche wo nur immer dem rechten Glauben angehören und sich an die von den Vätern ihnen überlieferte Lehre der katholischen Kirche halten, zu vertreiben und zu verfolgen. Denn gegen die Einen erhoben sie erdichtete Beschuldigungen, Andere schickten sie in die Verbannung, wieder Andere suchten sie durch die verhängten Strafen aufzureiben. Gewiß waren sie auch bestrebt, der Unschuld unseres Bruders und Mitbischofes Athanasius mit Gewalt und Tyrannei beizukommen, und deßhalb ist ihr Richterspruch weder sorgfältig noch zuverlässig noch überhaupt gerecht gewesen. Weil sie also deßhalb weder ein Vertrauen auf ihre Possenspiele setzten noch auf das, was sie gegen ihn ausbreiteten, sondern vielmehr sahen, daß sie hiefür keine richtigen Beweise führen könnten, wenn sie in der Stadt Sardica wären, so wollten sie zur Synode aller heiligen Bischöfe nicht kommen. Daraus ergibt sich deutlich, daß die Entscheidung unseres Bruders und Mitbischofs Julius gerecht war. Denn nicht unüberlegt hat er den Ausspruch gethan, sondern unter Anwendung großer Sorgfalt entschieden, so daß wir nicht das geringste Bedenken haben konnten, mit unserm Bruder Athanasius in Gemeinschaft zu treten. Denn er hatte achtzig Bischöfe als zuverlässige Zeugen. Auch darin handelte er nach dem Rechte, daß er mit Hilfe seiner Priester, unserer geliebten Brüder, und auf schriftlichem Wege mit den Eusebianern verhandelte, die sich nicht auf eine richterliche Entscheidung, sondern vielmehr auf Gewalt verließen. Deßhalb befestigten alle Bischöfe von allen Seiten ihre Gemeinschaft mit Athanasius wegen seiner Unschuld. Auch den folgenden Umstand möge euere Liebe beherzigen. Als er zur heiligen in Sardica versammelten Synode gekommen war, da richteten wir, wie gesagt, schriftlich und ungeschriebene Mahnungen an die Orientalen und luden sie ein, zu erscheinen. Jene aber begannen, weil ihr Gewissen sie verurtheilte, unter ungeziemenden Vorwänden die richterliche Untersuchung abzulehnen. Denn sie verlangten, wir sollten den Unschuldigen gleich einem Schuldigen aus unserer Gemeinschaft ausschließen, ohne zu bedenken, wie ungeziemend, ja geradezu unmöglich das war. Auch von dem in der Mareotis aufgenommenen Beweismaterial stand fest, daß es von ganz verworfenen und verkommenen jungen Leuten, denen man nicht den niedrigsten Grad im Klerus hätte anvertrauen mögen, einseitig gesammelt worden war. Denn weder unser Bruder, Bischof Athanasius, noch der von ihnen angeklagte Priester Makarius waren zugegen. Zudem war ihre Frageweise oder vielmehr ihr Zuflüstern voll von jeder Schmach. Denn es wurden theils Heiden theils Katechumenen gefragt, nicht, damit sie sagten, was sie wußten, sondern damit sie logen, was ihnen von denselben beigebracht worden war. Denn von euch Priestern, die ihr wegen der Abwesenheit eueres Bischofs die Sorge auf euch nahmet und bei der Untersuchung zugegen sein, die Wahrheit beweisen und die Lüge widerlegen wolltet, ist keine Erwähnung geschehen. Denn sie duldeten euere Anwesenheit nicht, sondern trieben sogar unter Hohn euch fort. Obschon zumeist auch hieraus das Intriguengewebe Allen klar war, so fanden wir gleichwohl, als die Untersuchungsakten vorgelesen wurden, daß Ischyras, der Erzbösewicht, der zum Lohn für seine Verleumdung von ihnen den leeren Namen eines Bischofs erhielt, selbst bewies, daß er ein Verleumder sei. Denn Ischyras selbst plaudert in diesen Akten aus, daß er gerade zur Zeit, da nach seiner Versicherung Makarius in seine Kammer kam, krank darnieder lag. Und dennoch wagten die Eusebianer zu schreiben, daß Ischyras damals stand und opferte, als Makarius erschien.</p>
      <h2>38</h2><p>Auch jene Intrigue und Verleumdung wurde Allen offenbar, welcher sie ferner sich gegen ihn bedienten. Sie sagten nämlich und schlugen Lärm, Athanasius habe einen Mord vollbracht und einen gewissen Arsenius, einen melitianischen Bischof, getödtet. Darüber stießen sie wie Schauspieler verstellte Seufzer aus und vergoßen falsche Thränen und verlangten, es solle der Leichnam des Gemordeten herausgegeben werden, da er doch am Leben war. Aber es waren ihre Schliche nicht unbekannt. Denn Alle wußten, daß der Mann lebe und unter den Lebenden zu finden sei. Und als sie, die zu Allem schnell bereit waren, sahen, daß diese ihre Lügen entdeckt werden würden, — denn der lebende Arsenius selbst bewies, daß er nicht gemordet und nicht todt sei, — so ruhten sie dessen ungeachtet nicht, sondern ersannen neue Ränke zu den frühern Ränken, um mit neuen Kunstgriffen den Mann zu verleumden. Wozu führte nun das, Geliebte? Unser Bruder Athanasius ließ sich nicht aus der Fassung bringen, sondern mit festem Vertrauen forderte er sie auch deßhalb in die Schranken, und wir baten sie und munterten sie auf, sie möchten zur Untersuchung kommen und, wenn sie könnten, den Beweis führen. O große Anmassung, o schrecklicher Übermuth, oder vielmehr, wenn man die Wahrheit sagen soll, o schlechtes und schuldiges Gewissen! Denn das ist Allen klar geworden. Deßhalb, geliebte Brüder, erinnern und ermahnen wir euch, vor Allem am rechten Glauben der katholischen Kirche fest zu halten. Denn ihr habt viel Schreckliches und Hartes gelitten, und die katholische Kirche duldete viel Schmach und Ungerechtigkeit; „aber wer ausharrt bis ans Ende, wird gerettet werden.“ Wenn sie es also wagen sollten, noch Etwas gegen euch zu thun, so soll die Trübsal euch Freude machen. Denn solche Leiden sind ein theilweises Martyrium, und diese euere Bekenntnisse und Qualen sind nicht ohne Lohn, sondern ihr werdet von Gott den Kampfpreis erhalten. Kämpfet deßhalb vorzugsweise für den gesunden Glauben und für die Unschuld eueres Bischofs, unseres Amtsgenossen Athanasius. Denn auch wir schwiegen nicht und waren nicht unbesorgt, um euch der Sorgen zu überheben. Vielmehr trugen wir Sorge und haben gethan, was die Liebe fordert. Denn wir tragen Mitleid mit unsern leidenden Brüdern und halten ihre Leiden für die unsrigen.</p>
      <h2>39</h2><p>Deßhalb wendeten wir uns an die frommen und gottesfürchtigen Kaiser und baten sie, sie möchten in ihrer Menschenfreundlichkeit befehlen, daß die, welche noch von Leiden bedrängt würden, frei gelassen werden sollten, und möchten den Auftrag geben, daß keiner der Richter, die bloß für die Angelegenheiten des Staates zu sorgen haben, weder Kleriker richte noch überhaupt ferners unter dem Vorwande der Kirchen Etwas gegen die Brüder unternehme, damit Jeder, ohne irgend eine Verfolgung, ohne eine Gewaltthat oder Übervortheilung zu erleiden, nach Wunsch und Willen lebe und in Ruhe und Frieden dem katholischen und apostolischen Glauben sich hingebe. Gregorius aber, von dem man sagt, daß er widerrechtlich von den Häretikern eingesetzt und von ihnen in euere Stadt gesendet wurde, davon möge euere Eintracht Kenntniß nehmen, ist durch den Richterspruch der ganzen heiligen Synode abgesetzt worden, oder besser gesagt, er ist überhaupt niemals als Bischof betrachtet worden. Freuet euch also, daß ihr euern Bischof Athanasius wieder zurückerhaltet. Denn deßhalb haben wir ihn in Frieden entlassen. Deßhalb ermahnen wir Alle, die entweder aus Furcht oder durch die Umtriebe gewisser Leute veranlaßt mit Gregorius in Gemeinschaft getreten sind, sie mögen auf unsere Ermunterung, Ermahnung und unser Zureden die abscheuliche Gemeinschaft mit ihm aufgeben und nunmehr mit der katholischen Kirche in Verbindung treten.</p>
      <h2>40</h2><p>[Forts. v. ] Da wir aber erfahren haben, daß Apthonius, Athanasius, der Sohn des Capito, Paulus und Plution, unsere Mitpriester, gleichfalls von den Eusebianern mit Intriguen verfolgt wurden, so daß die Einen in der Verbannung schmachteten, die Andern den Drohungen des Todes sich durch die Flucht entzogen, so erachteten wir es deßhalb für nothwendig, auch hierüber euch aufzuklären, damit ihr erkennet, daß wir auch Diese aufnahmen und als unschuldig freisprachen, indem wir wußten, daß Alles, was von den Eusebianern gegen die Rechtgläubigen geschah, denen zur Ehre und Empfehlung gereiche, gegen die ihre Intriguen gerichtet waren. Es hätte wohl nun eurem Bischof, unserm Amtsgenossen Athanasius, geziemt, hierüber als über seine Angelegenheiten euch als die Seinigen zu benachrichtigen. Da er aber, um ein gewichtigeres Zeugniß zu bringen, wünschte, daß die heilige Synode euch schreiben möchte, so zögerten wir deßhalb nicht, sondern beeilten uns, euch zu verständigen, damit auch ihr, wie wir, sie aufnehmet. Denn auch sie verdienen Lob, weil sie gleichfalls wegen ihrer Frömmigkeit gegen Christus gewürdigt wurden, von den Häretikern Schmach zu leiden. Was aber von der heiligen Synode gegen die Häupter der arianischen Häresie beschlossen wurde, welche gegen euch und gegen die übrigen Kirchen gefehlt haben, werdet ihr aus dem erkennen, was wir beigelegt haben. Denn wir senden es euch, damit ihr auch daraus erkennet, daß die katholische Kirche es nicht gleichgiltig hinnimmt, wenn Jemand gegen sie fehlt.</p><p>Die heilige Synode, die durch Gottes Gnade in Sardica versammelt ist, den Bischöfen in Ägypten und Libyen, den gellebten Amtsgenossen und Brüdern, Gruß im Herrn!</p>
      <h2>41</h2><p>Auch bevor wir das Schreiben euerer Frömmigkeit empfingen, war uns nicht unbekannt, sondern wir wußten sehr wohl, daß die Häupter der verrufenen Häresie der Arianer viele schreckliche Dinge wohl mehr zum Verderben ihrer Seele als zum Nachtheil der Kirche unternahmen. Denn darin bestand ihre Kunst und ihre Verschlagenheit, diesen todbringenden Vorsatz haben sie stets in sich getragen, daß sie sich bemühten, Alle, welche wo nur immer dem katholischen Glauben angehören und sich an die von den Vätern ihnen überlieferte Lehre der katholischen Kirche halten, zu vertreiben und zu verfolgen. Denn gegen die Einen erhoben sie erdichtete Beschuldigungen, Andere schickten sie in die Verbannung, wieder Andere suchten sie durch die verhängten Strafen aufzureiben. Gewiß waren sie auch bestrebt, der Unschuld unseres Bruders und Mitbischofs Athanasius mit Gewalt und Tyrannei beizukommen, und deßhalb ist ihr Richterspruch weder sorgfältig noch zuverlässig noch überhaupt gerecht gewesen. Weil sie also deßhalb weder ein Vertrauen auf ihre Possenspiele setzten, noch auf das, was sie gegen ihn ausbreiteten, sondern vielmehr sahen, daß sie hiefür keine richtigen Beweise führen könnten, wenn sie in der Stadt Sardica wären, so wollten sie zur Synode aller heiligen Bischöfe nicht kommen. Daraus ergibt sich deutlich, daß die Entscheidung unsers Bruders und Mitbischofs Julius gerecht war. Denn nicht unüberlegt hat er den Ausspruch gethan, sondern unter Anwendung großer Sorgfalt entschieden, so daß wir nicht das geringste Bedenken haben konnten, mit unserm Bruder Athanasius in Gemeinschaft zu treten. Denn er hatte achtzig Bischöfe als zuverlässige Zeugen. Auch darin handelte er nach dem Rechte, daß er mit Hilfe seiner Priester, unserer geliebten Brüder, und auf schriftlichem Wege mit den Eusebianern verhandelte, die sich nicht auf eine richterliche Entscheidung, sondern vielmehr auf Gewalt verließen. Deßhalb befestigten alle Bischöfe von allen Seiten ihre Gemeinschaft mit Athanasius wegen seiner Unschuld. Auch den folgenden Umstand möge euere Liebe beherzigen. Als er zur heiligen in Sardica versammelten Synode gekommen war, da richteten wir, wie gesagt, schriftliche und ungeschriebene Mahnungen an die Orientalen und luden sie ein, zu erscheinen. Jene aber begannen, weil ihr Gewissen sie verurtheilte, unter ungeziemenden Vorwänden die richterliche Untersuchung abzulehnen. Denn sie verlangten, wir sollten den Unschuldigen gleich einem Schuldigen aus unserer Gemeinschaft ausschließen, ohne zu bedenken, wie ungeziemend, ja geradezu unmöglich das war. Auch von dem in der Mareotis aufgenommenen Beweismaterial stand fest, daß es von ganz verworfenen und verkommenen jungen Leuten, denen man nicht den niedrigsten Grad im Klerus hätte anvertrauen mögen, einseitig gesammelt worden war. Denn weder unser Bruder, Bischof Athanasius, noch der von ihnen angeklagte Priester Makarius waren zugegen. Zudem war ihre Frageweise oder vielmehr ihr Zuflüstern voll von jeder Schmach. Denn es wurden theils Heiden theils Katechumenen gefragt, nicht um zu sagen, was sie wußten, sondern um zu lügen, was ihnen von denselben beigebracht worden war. Denn von euch Priestern, die ihr wegen der Abwesenheit eueres Bischofs die Sorge auf euch nahmet und bei der Untersuchung zugegen sein, die Wahrheit beweisen und die Lüge widerlegen wolltet, ist keine Erwähnung geschehen. Denn sie duldeten euere Anwesenheit nicht, sondern trieben sogar unter Hohn euch fort. Obschon zumeist auch hieraus das Intriguengewebe Allen klar war, so fanden wir gleichwohl, als die Untersuchungsakten vorgelesen wurden, daß Ischyras, der Erzbösewicht, der zum Lohn für seine Verleumdung von ihnen den leeren Namen eines Bischofs erhielt, selbst bewies, daß er ein Verleumder sei. Denn Ischyras selbst plaudert in diesen Akten aus, daß er gerade zur Zeit, da Makarius nach seiner Versicherung in seine Kammer kam, krank darnieder lag. Und dennoch wagten die Eusebianer zu schreiben, daß Ischyras damals stand und opferte, als Makarius erschien.</p>
      <h2>42</h2><p>Auch jene Intrigue und Verleumdung wurde Allen offenbar, welcher sie ferner gegen ihn sich bedienten. Sie sagten nämlich und schlugen Lärm, Athanasius habe einen Mord vollbracht und einen gewissen Arsenius, einen melitianischen Bischof, getödtet. Darüber stießen sie wie Schauspieler verstellte Seufzer aus und vergoßen falsche Thränen und verlangten, es solle der Leichnam des Gemordeten herausgegeben werden, da er doch am Leben war. Aber es waren ihre Schliche nicht unbekannt. Denn Alle wußten, daß der Mann lebe und unter den Lebenden zu finden sei. Und als sie, die zu Allem schnell bereit waren, sahen, daß diese ihre Lügen entdeckt werden würden, — denn der lebende Arsenius selbst bewies, daß er nicht gemordet und nicht todt sei, — so ruhten sie dessen ungeachtet nicht, sondern ersannen neue Ränke zu den frühern Ränken, um mit neuen Kunstgriffen den Mann zu verleumden. Wozu führte nun das, Geliebte? Unser Bruder Athanasius ließ sich nicht aus der Fassung bringen, sondern mit festem Vertrauen forderte er sie auch deßhalb in die Schranken, und wir baten sie und munterten sie auf, sie möchten zur Untersuchung kommen und, wenn sie könnten, den Beweis führen. O große Anmassung, o schrecklicher Übermuth, oder vielmehr, wenn man die Wahrheit sagen soll, o schlechtes und schuldiges Gewissen! Denn das ist Allen klar geworden. Deßhalb, geliebte Brüder, erinnern und ermahnen wir euch, vor Allem am rechten Glauben der katholischen Kirche festzuhalten. Denn ihr habt viel Schreckliches und Hartes gelitten, und die katholische Kirche duldete viel Schmach und Ungerechtigkeit, aber wer ausharret bis ans Ende, der wird gerettet werden. Wenn sie es also wagen sollten, noch Etwas gegen euch zu thun, so soll die Trübsal euch Freude machen. Denn solche Leiden sind ein theilweises Martyrium, und diese euere Bekenntnisse und Qualen sind nicht ohne Lohn, sondern ihr werdet von Gott den Kampfpreis erhalten. Kämpfet deßhalb vorzugsweise für den gesunden Glauben und für die Unschuld eueres Bischofs, unseres Amtsgenossen Athanasius. Denn auch wir schwiegen nicht und waren nicht unbesorgt, um euch der Sorgen zu überheben. Vielmehr trugen wir Sorge und haben gethan, was die Liebe fordert. Denn wir tragen Mitleid mit unsern leidenden Brüdern und halten ihre Leiden für die unsrigen, und wir vermischten unsere Thränen mit eueren Thränen. Nicht ihr allein habt gelitten, Brüder, sondern auch viele andere unserer Amtsgenossen haben bei ihrer Ankunft solchen Jammer erhoben.</p>
      <h2>43</h2><p>Deßhalb wendeten wir uns an die frommen und gottesfürchtigen Kaiser und baten sie, sie möchten in ihrer Menschenfreundlichkeit befehlen, daß die, welche noch von Leiden bedrängt würden, freigelassen werden sollten, und möchten den Auftrag geben, daß keiner der Richter, die bloß für die öffentlichen Angelegenheiten zu sorgen haben, weder Kleriker richte noch überhaupt ferners unter dem Vorwande der Kirchen Etwas gegen die Brüder unternehme, damit Jeder, ohne irgend eine Verfolgung, ohne eine Gewaltthat oder Übervortheilung zu erleiden, nach Wunsch und Willen lebe und in Ruhe und Frieden dem katholischen und apostolischen Glauben sich hingebe. Gregorius aber, von dem man sagt, daß er widerrechtlich von den Häretikern eingesetzt und von ihnen in euere Stadt gesendet wurde, davon möge euere Eintracht Kenntniß nehmen, ist durch den Richterspruch der ganzen heiligen Synode abgesetzt worden, oder besser gesagt, er ist überhaupt niemals als Bischof betrachtet worden. Freuet euch also, daß ihr euern Bischof Athanasius wieder zurückerhaltet. Denn deßhalb haben wir ihn in Frieden entlassen. Deßhalb ermahnen wir Alle, die entweder aus Furcht, oder durch die Umtriebe gewisser Leute veranlaßt, mit Gregorius in Gemeinschaft getreten sind, sie mögen auf unsere Ermunterung, Ermahnung und unser Zureden die abscheuliche Gemeinschaft mit ihm aufgeben und nunmehr mit der katholischen Kirche in Verbindung treten. Was aber von der heiligen Synode gegen Theodor, Narcissus, Stephanus, Acacius, Menophantus, Ursacius, Valens, Georgius, die Häupter der arianischen Häresie, beschlossen wurde, welche gegen euch und gegen die übrigen Kirchen gefehlt haben, werdet ihr aus dem erkennen, was wir beigelegt haben. Denn wir senden es euch, damit auch euere Gottesfurcht unsern Beschlüssen beistimme und ihr daraus erkennet, daß die katholische Kirche es nicht gleichgiltig hinnimmt, wenn Jemand gegen sie fehlt.</p><p>Die heilige Synode, die durch Gottes Gnade in Sardica versammelt ist, sämmtlichen Bischöfen und Amtsgenossen der katholischen Kirche, den geliebten Brüdern, Gruß im Herrn!</p>
      <h2>44</h2><p>Vieles wagten oft die Ariomaniten gegen die Knechte Gottes, die den rechten Glauben bewahren. Denn indem sie eine falsche Lehre einschmuggelten, suchten sie die Rechtgläubigen zu verdrängen. Sie erhoben sich bereits so heftig gegen den Glauben, daß es auch der Gottesfurcht der frommen Kaiser nicht verborgen blieb. Unter der Mitwirkung der Gnade Gottes versammelten uns also die gottesfürchtigen Kaiser selbst aus verschiedenen Eparchieen und Städten, und sie ermöglichten es, daß diese heilige Synode in der Stadt Sardica gehalten wurde, damit jeder Zwist gehoben und nach Beseitigung jedes Irrglaubens von Allen die Gottesfurcht allein bewahrt werde. Denn es kamen auch die orientalischen Bischöfe, gleichfalls von den gottesfürchtigen Kaisern veranlaßt, vorzugsweise wegen ihrer oftmaligen Ausstreuungen über unsere geliebten Brüder und Amtsgenossen Athanasius, Bischof von Alexandria, und Marcellus, Bischof von Ankyrogalatien. Denn vielleicht sind ihre Verleumdungen auch zu euch gedrungen, und vielleicht haben sie auch euere Ohren zu erschüttern gesucht, damit ihr glaubet, was sie gegen die Unschuldigen sagen, und sie dem Verdacht ihrer bösen Häresie vorbauen. Aber es war ihnen nicht gestattet, das lange zu treiben. Denn der Herr ist das Haupt der Kirchen, der für sie und uns alle den Tod litt und durch sich uns allen den Zugang zum Himmel gewährt hat. Da also die Eusebianer bei Julius, unserm Amtsgenossen, dem Bischof der römischen Kirche, gegen unsere vorgenannten Amtsgenossen, nämlich Athanasius, Marcellus und Asklepas, schriftlich ihre Anklagen vorgebracht hatten, schrieben auch die Bischöfe der übrigen Gegenden und bezeugten die Unschuld unseres Amtsgenossen Athanasius, und daß die Unternehmungen der Eusebianer nur auf Lüge beruhten und voll Verleumdung wären. Wenn nun ihre Verleumdung vorzugsweise daraus, daß sie dem Rufe unseres geliebten Amtsgenossen Julius nicht folgten, offenkundig geworden ist, so ist sie auch aus dem offenkundig geworden, was Julius selbst schrieb. Denn sie wären gekommen, wenn ihre Thaten ihnen Zutrauen eingeflößt hätten, sowie das, was sie gegen unsere Amtsgenossen unternommen haben. Zugleich bewiesen sie mit dem, was sie in dieser heiligen und großen Synode thaten, noch augenscheinlicher ihre Intriguen. Denn als sie nach ihrer Ankunft in der Stadt Sardica unsere Brüder Athanasius, Marcellus, Asklepas und die Übrigen sahen, fürchteten sie sich zur richterlichen Untersuchung zu kommen. Und nicht ein Mal, oder zwei Mal, sondern oft eingeladen, hörten sie auf die Einladungen nicht. Und obschon wir Bischöfe alle gekommen waren, und sogar der hochbetagte Hosius, der wegen seines Alters und als Bekenner und wegen Ertragung so vieler Mühsal aller Verehrung würdig ist, und wir auf sie warteten und sie aufforderten, sich an der richterlichen Untersuchung zu betheiligen, damit sie, was sie in Abwesenheit unserer Amtsgenossen gegen dieselben verbreitet und geschrieben hatten, das jetzt anwesend beweisen könnten, so folgten sie, wie gesagt, der Einladung doch nicht und zeigten hierin ihre Ränke, indem sie fast laut durch ihre Ablehnung die Verfolgung und Hinterlist zu erkennen gaben, deren sie sich schuldig gemacht haben. Denn die auf ihre Aussagen vertrauen, können ihren Gegnern auch vor die Augen treten. Da sie aber nicht kamen, so glauben wir, es könne nunmehr Keinem unbekannt sein, mögen sie auch wieder Kniffe machen wollen, daß sie, ohne einen Beiweis zu haben, unsere Amtsgenossen in ihrer Abwesenheit verleumden, den anwesenden aber ausweichen.</p>
      <h2>45</h2><p>Sie wichen aber, geliebte Brüder, nicht bloß aus, weil sie Diese verleumdet hatten, sondern auch, weil sie sahen, daß Solche, die verschiedene Anklagen gegen sie erhoben, angekommen waren. Denn es kamen Fesseln und Ketten zum Vorschein und Menschen, die aus der Verbannung zurückgekehrt waren. Von denen, die noch in der Verbannung zurückgehalten wurden, waren Amtsgenossen gekommen, sowie Verwandte und Freunde derer erschienen, die durch sie den Tod gefunden hatten. Aber das Wichtigste war, daß Bischöfe zugegen waren, von denen einer Eisen und Ketten zeigte, die er ihretwegen getragen hatte, die andern aber von dem Tode Zeugniß gaben, auf den ihre Verleumdung es absah. Denn so weit gingen sie in ihrem Wahnsinn, daß sie Bischöfe zu tödten versuchten und getödtet hätten, wenn sie ihren Händen nicht entronnen wären. Den Tod fand wenigstens unser Amtsgenosse, der selige Theodulus, der ihrer Verleumdung sich durch die Flucht entzog; denn wegen ihrer Verleumdung war seine Hinrichtung befohlen worden. Andere aber zeigten Verwundungen mit Schwertern, wieder Andere erhoben Klagen, daß sie durch sie Hunger gelitten hätten, und das bezeugten nicht die nächstbesten Menschen, sondern es gab ganze Kirchen, in deren Auftrag die Ankömmlinge und Gesandten uns Nachricht gaben von Soldaten mit Schwertern bewaffnet, von Volkshaufen, die Keulen trugen, von Drohungen der Richter, von Unterschiebung erdichteter Schreiben. Denn es wurde ein erdichtetes Schreiben des Theognius gegen unsere Amtsgenossen Athanasius, Marcellus und Asklepas vorgelesen, um auch die Kaiser gegen sie zu reizen. Und das bewiesen die damaligen Diakonen des Theognius. Ausserdem hörten wir von Entblößungen der Jungfrauen, Niederbrennen von Kirchen, Einsperren von Kirchendienern, und das aus keinem andern Grunde, als wegen der verrufenen Häresie der Ariomaniten. Denn die sich der Gemeinschaft mit ihnen weigerten, mußten sich Solches gefallen lassen. Als sie nun das merkten, waren sie unschlüssig, was sie thun sollten. Denn sie schämten sich, ihre Thaten einzugestehen. Da aber diese nicht mehr verborgen bleiben konnten, so gingen sie nach der Stadt Sardica, um durch ihre Ankunft den Schein und die Muthmassung zu erregen, als hätten sie sich Nichts zu Schulden kommen lassen. Als sie aber die sahen, welche von ihnen waren verleumdet worden, und denen sie Unbilden zugefügt hatten, und die Ankläger, die sie überführen konnten, vor Augen hatten, so wollten sie auf die Einladung nicht kommen, obschon unsere Amtsgenossen Athanasius, Marcellus und Asklepas sehr freimüthig zu Werke gingen, sich beschwerten und in sie drangen und sie herausforderten und sich anheischig machten, nicht nur die Verleumdung zu widerlegen, sondern auch nachzuweisen, wie viele Vergehungen sie sich gegen ihre Kirchen hätten zu Schulden kommen lassen. Sie aber wurden wegen ihres schlechten Gewissens von so großer Furcht ergriffen, daß sie flohen und durch ihre Flucht sich als Verleumder enthüllten und ihre Vergehungen durch die Flucht eingestanden.</p>
      <h2>46</h2><p>Wenn nun auch sowohl aus dem Früheren als auch hieraus ihre Bösartigkeit und Ränkesucht hervorgeht, so haben wir uns gleichwohl entschlossen, damit sie in ihrer Flucht nicht Veranlassung zu einem weiteren Schelmenstreiche finden können, mit Berücksichtigung der Wahrheit ihre Thaten zu untersuchen, und indem wir diesen Vorsatz ausführten, fanden wir in ihren Thaten, daß sie Intriguanten seien, und daß sie unseren Amtsgenossen nur Nachstellungen bereitet haben. Denn Arsenius, von dem sie gesagt hatten, daß Athanasius ihn getödtet habe, lebt und wird unter den Lebenden gefunden. Daher besteht offenbar auch das, was sie über die übrigen Punkte ausgesprengt haben, aus Dichtungen. Und da sie auch in Betreff eines Kelches aussprengten, daß er von Makarius, dem Priester des Athanasius, zerbrochen worden sei, so bezeugten die, welche von Alexandria, der Mareotis und den übrigen Gegenden kamen, daß nichts Solches geschehen ist. Und die Bischöfe, welche von Ägypten an Julius, unsern Amtsgenossen schrieben, versicherten zur Genüge, daß dort auch nicht im Entferntesten nur so ein Verdacht bestanden habe. Ausserdem steht fest, daß das Beweismaterial, welches sie gegen ihn zu haben vorgeben, einseitig aufgenommen worden sei. Und selbst bei dieser Aufnahme wurden Heiden und Katechumenen gefragt. Und Einer von diesen, ein Katechumen, sagte bei dem Verhöre, er sei drinnen gewesen, als Makarius an der Stätte ankam. Und ein Anderer sagte, als man ihn verhörte, daß der von ihnen oft genannte Ischyras damals krank in einer Kammer lag. So wird daraus klar, daß überhaupt kein Geheimniß gefeiert wurde, weil die Katechumenen drinnen waren und Ischyras nicht zugegen war, sondern krank daniederlag. Ja auch der Erzbösewicht Ischyras selbst, der lügenhafter Weise ausgesagt hatte, Athanasius habe etliche göttliche Bücher verbrannt und sei überführt worden, gab zu, daß er damals, als Makarius ankam, krank war und zu Bette lag, so daß er auch hieraus als Verleumder erscheint. Gewiß haben sie dem Ischyras selbst zum Lohne für diese Verleumdung den bischöflichen Namen gegeben, da er doch nicht einmal Priester war. Denn zwei angekommene Priester, ehemalige Anhänger des Melitius, die später vom seligen Alexander, dem ehemaligen Bischof von Alexandria, aufgenommen wurden und jetzt sich bei Athanasius befinden, bezeugten, daß dieser niemals ein Priester des Melitius gewesen sei und Melitius überhaupt in der Mareotis keine Kirche und keinen Kirchendiener gehabt habe. Und dessenungeachtet führten sie den, der nicht einmal Priester war, jetzt als Bischof vor, um wahrscheinlich mit Hilfe dieses Namens durch ihre Verleumdung Diejenigen zu erschrecken, welche ihn vernahmen.</p>
      <h2>47</h2><p>Es wurde auch die Schrift unseres Amtsgenossen Marcellus vorgelesen, und es kam die Arglist der Eusebianer ans Licht. Denn was Marcellus als Gegenstand der Untersuchung hingestellt hat, davon haben sie fälschlich behauptet, daß es von ihm zugegeben würde. Man las also das Folgende und das, was den Untersuchungen vorherging, und man fand, daß der Mann rechtgläubig sei. Denn er schrieb weder, wie sie behaupteten, dem Worte Gottes den Ursprung aus Maria zu, noch schrieb er, daß seine Herrschaft ein Ende habe, sondern daß seine Herrschaft ohne Anfang und Ende sei, und der Amtsgenosse Asklepas wies die Akten vor, die in Antiochia in Anwesenheit der Kläger und des Eusebius von Cäsarea waren aufgenommen worden. Aus den Urtheilssprüchen der richtenden Bischöfe bewies er, daß er unschuldig sei. In begreiflicher Weise also, geliebte Brüder, folgten sie der oftmaligen Einladung nicht, in begreiflicher Weise ergriffen sie die Flucht. Denn von ihrem schlechten Gewissen verfolgt, bestätigten sie durch die Flucht ihre Ränke und haben so bewirkt, daß man von ihnen glaubte, was die anwesenden Ankläger aussagten und vorbrachten. Haben sie ja sogar, von all dem abgesehen, die, welche einst wegen der Häresie des Arius abgesetzt und excommunicirt worden waren, nicht bloß aufgenommen, sondern sogar zu einem höheren Range befördert, die Diakonen zu Priestern und die Priester zu Bischöfen, aus keinem andern Grunde, als um die Gottlosigkeit aussäen und verbreiten zu können und den gottesfürchtigen Glauben zu vernichten.</p>
      <h2>48</h2><p>Es sind aber jetzt nach Eusebius ihre Häupter: Theodor von Heraklea, Narcissus von Neronias in Cilicien, Stephanus von Antiochia, Georgius von Laodicea, Acacius von Cäsarea in Palästina, Menophantus von Ephesus in Asien, Ursacius von Singidonum in Mysien, Valens von Mursa in Pannonien. Diese nun gestatteten denen, die mit ihnen vom Orient gekommen waren, weder zur heiligen Synode zu gehen, noch überhaupt in die Kirche Gottes zu treten. Und als sie nach Sardica kamen, hielten sie an verschiedenen Orten gesonderte Zusammenkünfte und schloßen ein Bündniß unter Drohungen. So unterzogen sie sich, da sie nach Sardica gekommen waren, keineswegs einer richterlichen Entscheidung, noch verbanden sie sich zu dem nämlichen Zwecke mit der heiligen Synode, sondern kaum angekommen, eilten sie, nachdem sie ihr Erscheinen der Formalität wegen angezeigt hatten, rasch wieder fort. Denn das haben wir von unsern Amtsgenossen Makarius aus Palästina und Asterius von Arabien in Erfahrung gebracht, die mit ihnen gekommen sind und ihrem Unglauben entsagt haben. Denn diese erschienen vor der heiligen Synode, bejammerten die erlittene Gewalt und erklärten, daß bei ihnen Nichts in der rechten Weise vor sich gehe. Sie fügten auch Dieß bei, daß es dort Viele gebe, die dem rechten Glauben anhängen und von ihnen gehindert werden hieher zu gehen, weil sie gegen die, welche sich von ihnen trennen wollen, Drohungen ausstoßen. Deßhalb sorgten sie auch dafür, daß sie alle in einem einzigen Hause blieben, und gestatteten ihnen nicht, auch nur kurze Zeit von den Andern getrennt zu leben.</p>
      <h2>49</h2><p>Da wir also ihre Verleumdungen, die Fesseln, Mordthaten, Schläge, die Ränke mit den erdichteten Briefen, die Mißhandlungen, die Entblößungen der Jungfrauen, die Verbannungen, die Verheerungen der Kirchen, die Brandstiftungen, die Versetzungen aus kleinen Städten in größere Diöcesen und vor Allem die verrufene arianische Häresie nicht mit Stillschweigen übergehen und ungemeldet lassen durften, die durch ihre Veranlassung sich gegen den rechten Glauben erhoben hat, so haben wir deßhalb unsere geliebten Brüder und Amtsgenossen Athanasius, Marcellus und Asklepas und ihre Genossen im Dienste des Herrn für unschuldig und makellos erklärt und in die Diöcese eines Jeden geschrieben, damit das Volk einer jeden Kirche die Unschuld seines Bischofs erkennt und diesen für seinen Bischof hält und als solchen erwartet, die aber, welche in ihre Kirchen nach Art der Wölfe eindrangen, den Gregor in Alexandria, den Basilius in Ancyra, den Quintian in Gaza weder Jemand Bischöfe nenne, noch überhaupt Jemand mit ihnen in Gemeinschaft trete, noch Jemand von ihnen Briefe annehme, noch an sie schreibe. Den Theodor dagegen, sowie Narcissus, Acacius, Stephanus, Ursacius, Valens, Menophantus und Georgius, wenn er auch aus Furcht nicht vom Oriente kam, hat gleichwohl die heilige Synode weil er vom seligen Alexander abgesetzt worden ist, und weil sowohl er als auch die Ersteren es mit der Raserei des Arius hielten, wegen der gegen sie erhobenen Beschuldigungen einstimmig der bischöflichen Würde entsetzt, und wir haben entschieden, daß sie nicht bloß für keine Bischöfe gelten, sondern nicht einmal der Gemeinschaft mit den Gläubigen gewürdiget werden sollen. Denn die vom Vater den Sohn trennen und das Wort sondern, müssen sich von der katholischen Kirche trennen und ausser Verbindung mit dem Christennamen stehen. Ihr sollt sie also verfluchen, weil sie das Wort der Wahrheit gefälscht haben. Das befiehlt der Apostel: „Wenn Jemand ein anderes Evangelium verkündet, als ihr empfangen habt, so sei er verflucht.“ Ermahnet, daß Niemand mit Diesen Gemeinschaft habe; denn es besteht keine Gemeinschaft zwischen Licht und Finsterniß. Diese alle haltet ferne von euch; denn es besteht keine Übereinstimmung zwischen Christus und Belial. Auch nehmt euch in Acht, Geliebte, daß ihr an sie weder schreibet noch von ihnen Briefe annehmet. Bemühet vielmehr auch ihr euch, Brüder und Amtsgenossen, als wenn ihr mit dem Geiste bei unserer Synode gegenwärtig wäret, durch euere Unterschrift mit uns zu stimmen, damit die Uebereinstimmung aller Amtsgenossen an allen Orten bewahrt bleibe. Die göttliche Vorsehung möge euch in Heiligung und Freude erhalten, geliebte Brüder! Ich Hosius Bischof habe unterschrieben, und so Alle.</p><p>Das schrieb die Synode von Sardica und sandte es an die, welche nicht kommen konnten, und auch sie gaben ihre Zustimmung zu den Beschlüssen. Die Namen der Bischöfe, die auf dieser Synode schrieben, und der übrigen sind folgende:</p>
      <h2>50</h2><p>Hosius von Spanien, Julius von Rom durch die Priester Archidamus und Philoxenus, Protogenes von Sardica, Gaudentius, Macedonius, Severus, Prätextatus, Ursicius, Lucillus, Eugenius, Vitalius, Kalepodius, Florentius, Bassus, Vincentius, Stercorius, Palladius, Domitian, Chalvis, Gerontius, Protasius, Eulogus, Porphyrius, Dioskorus, Zosimus, Januarius, Zosimus, Alexander, Eutychius, Sokrates, Diodorus, Martyrius, Eutherius, Eukarpus, Athenodorus, Irenäus, Julianus, Alypius, Jonas, Aetius, Restitutus, Marcellinus, Aprianus, Vitalius, Valens, Hermogenes, Castus, Domitian, Fortunatius, Marcus, Annianus, Heliodor, Musäus, Asterius, Paregorius, Plutarch, Hymenäus, Athanasius, Lucius, Amantius, Arius, Asklepius, Dionysius, Maximus, Tryphon, Alexander, Antigonus, Älianus, Petrus, Symphorus, Musonius, Eutychus, Philologius, Spudasius, Zosimus, Patricius, Adolius, Sapricius.</p><p>Aus Gallien Maximian, Verissimus, Victurus, Valentinus, Desiderius, Eulogius, Sarbatius, Dyskolius, Superior, Mercurius, Declopetus, Eusebius, Severinus, Satyrus, Martinus, Paulus, Optatianus, Nikasius, Viktor, Sempronius, Valerinus, Pacatus, Jesses, Ariston, Simplicius, Metianus, Amantus, Amillianus, Justinianus, Viktorinus, Saturnilus, Abundantius, Donatian, Maximus.</p><p>Aus Afrika Nessus, Gratus, Megasius, Coldäus, Rogatianus, Consortius, Rufinus, Manninus, Cessilianus, Herennianus, Marianus, Valerius, Dynamius, Myzonius, Justus, Cölestinus, Cyprian, Viktor, Honoratus, Marinus, Pantagathus, Felix, Baudius, Liber, Capito, Minervalis, Kosmus, Viktor, Hesperion, Felix, Severianus, Optantius, Hesperus, Fidentius, Salustius, Paschasius.</p><p>Aus Ägypten Liburnius, Amantius, Felix, Ischyrammon, Romulus, Tiberinus, Consortius, Heraklides, Fortunatius, Dioskorus, Fortunatianus, Bastamon, Datyllus, Andreas, Serenus, Arius, Theodorus, Evagoras, Elias, Timotheus, Orion, Andronikus, Paphnutius, Hermias, Arabion, Psenosiris, Apollonius, Muis, Sarapampon, Philon, Philippus, Apollonius, Paphnutius, Paulus, Dioskorus, Nilammon, Serenus, Aquila, Aotas, Harpokration, Isaak, Theodorus, Apollos, Ammonianus, Nilus, Heraklius, Arion, Athas, Arsenius, Agathammon, Theon, Apollonius, Elias, Paninuthius, Andragathius, Nemesion, Sarapion, Ammonius, Ammonius, Xenon, Gerontius, Quintus, Leonides, Sempronianus, Philon, Heraklides, Hierakys, Rufus, Pasophius, Macedonius, Apollodorus, Flavianus, Psaes, Syrus, Apphus, Sarapion, Isaias, Paphnutius, Timotheus, Elurion, Gaius, Musäus, Pistus, Heraklammon, Hero, Elias, Anagamphus, Apollonius, Gaius, Philotas, Paulus, Tithoes, Eudämon, Julius.</p><p>Im Canal Italiens Probatius, Viator, Facundinus, Joseph, Numedius, Sperantius, Severus, Heraklianus, Faustinus, Antoninus, Heraklius, Vitalius, Felix, Crispinus, Paulianus.</p><p>In Cypern Auxibius, Photius, Gerasius, Aphrodisius, Irenikus, Nunechius, Athanasius, Macedonius, Triphyllius, Spyridon, Norbanus, Sosikrates.</p><p>In Palästina Maximus, Aetius, Arius, Theodosius, Germanus, Silvanus, Paulus, Claudius, Patricius, Elpidius, Germanus, Eusebius, Zenobius, Paulus, Petrus.</p><p>Das sind also die, welche die Beschlüsse der Synode unterschrieben haben. Es gibt aber auch sehr viele Andere, die <em>vor</em> dieser Synode für uns geschrieben haben, aus Asien, Phrygien und Isaurien, und ihre Namen sind in ihren besonderen Briefen enthalten, nahezu dreiundsechzig, im Ganzen dreihundert vierundvierzig.</p>
      <h2>51</h2><p>Als Dieß der fromme Kaiser Constantius vernommen hatte, rief er uns herbei, indem er eigenhändig an seinen Bruder, den seligen Constans, schrieb, und einmal an uns, und auch ein zweites und drittes Mal, in folgender Weise:</p><p><em>Constantius Augustus der Siegreiche an Athanasius</em></p><p>Die Menschenfreundlichkeit unserer Milde gab nicht zu, daß du von den wilden Wogen des Meeres lange umtost und bestürmt werdest. Unsere unermüdliche Frömmigkeit nahm es nicht gleichgiltig hin, daß du des heimathlichen Heerdes verlustig und der Deinigen beraubt in unwegsamen, von wilden Thieren bewohnten Gegenden umherirrtest. So lange ich daher auch zögerte, den Entschluß meines Herzens dir schriftlich mitzutheilen, indem ich warten wollte, bis du aus eigenem Antrieb zu uns kämest und uns bätest, deinen Mühsalen zu steuern, so haben wir, da vielleicht die Furcht der Ausführung deines Willens im Wege stand, deßhalb an deine Standhaftigkeit ein Schreiben gesandt, das mit reichem Geschenke gefüllt ist, damit du dich bestrebest, ohne Furcht bald unsere Augen mit deiner Gegenwart zu erfreuen, und du, indem dein Verlangen gestillt wird und du unsere Menschenfreundlichkeit erfahrest, den Deinigen zurückgegeben werdest. Denn deßhalb habe ich auch meinen Herrn und meinen Bruder Constans, den siegreichen Augustus, für dich gebeten, er möge dir erlauben zu kommen, damit du mit unserer beiderseitigen Zustimmung deiner Heimath wieder zurückgeben werdest und Dieß als Unterpfand unserer Gnade besitzest.</p><p><em>Zweiter Brief.</em></p><p>Haben wir wohl schon im ersten Schreiben dir zu verstehen gegeben, du mögest unbesorgt dich an unsern Hof verfügen, weil es unser innigster Wunsch ist, dich in die Heimath zu entsenden, so haben wir auch jetzt diesen Brief an deine Standhaftigkeit gesendet und laden dich in demselben ein, du mögest, frei von jedem Mißtrauen und jeder Furcht, die öffentlichen Fuhrwerke besteigen und zu uns eilen, damit du dein Verlangen befriedigen könnest.</p><p><em>Dritter Brief.</em></p><p>Als wir in Edessa weilten, beschloßen wir in Anwesenheit deiner Priester, an dich einen Priester zu senden, damit du schnell an unsern Hof kämest und, nachdem du unser Angesicht gesehen, sogleich nach Alexandria reisen möchtest. Da aber eine sehr lange Zeit verstrichen war, seit du den Brief von uns empfingst, und du nicht gekommen bist, so wollten wir deßhalb auch jetzt dich erinnern, damit du doch jetzt dich bestrebest, uns mit deiner baldigen Gegenwart zu beehren, und du so deinem Vaterland zurückgegeben und deines Wunsches theilhaftig werden könnest. Um dir die Sache umständlicher auseinanderzusetzen, haben wir den Diakon Achitas abgesandt, der dir mittheilen kann, was wir in unserm Herzen beabsichtigen, und daß du deine Wünsche wirst erreichen können.</p><p>So also schreibt der Kaiser. Ich aber ging nach Empfang des Briefes nach Rom, um mich von der Kirche und dem Bischof zu verabschieden. Ich befand mich nämlich, als das an mich geschrieben wurde, in Aquileja. Und die Kirche war von unendlicher Freude erfüllt. Der Bischof Julius theilt die Freude über unsere Rückkehr und schreibt an die Kirche. Und wo wir später durchreisten, begleiteten uns die Bischöfe in Frieden. Folgendes ist der Inhalt des Briefes.</p><p><em>Julius an die Priester, Diakonen und das Volk, das in Alexandria wohnt.</em></p>
      <h2>52</h2><p>Auch ich nehme an euerer Freude Antheil, geliebte Brüder, weil ihr die Frucht eueres Glaubens nun vor Augen sehet. Denn das kann man in Wahrheit an meinem Bruder und Mitbischof Athanasius sich vollziehen sehen, den wegen der Unschuld seines Lebens und wegen eueres Gebetes Gott euch zurückgibt. Daraus kann man ersehen, daß ihr immer reine liebeerfüllte Gebete zu Gott emporgeschickt habt. Denn da ihr der himmlischen Verheissungen und der Leitung zu denselben eingedenk seid, die euch durch die Lehre meines genannten Bruders zu Theil geworden ist, so erkanntet ihr wahrhaft und habt im rechten Glauben, den ihr besitzet, begriffen, daß der nicht beständig von euch getrennt sein werde, der in eueren gottesfürchtigen Seelen euch immer als gegenwärtig vor Augen geschwebt ist. Ich brauche, indem ich an euch schreibe, nicht viele Worte zu machen. Denn Alles, was ich euch sagen mag, hat euer Glaube im Voraus erfaßt und hat in der Gnade Gottes die gemeinsamen Wünsche von uns allen erfüllt. Ich freue mich also mit euch, ich sage es noch einmal, daß ihr euere Seelen lm Glauben unerschüttert bewahrt habt, und nicht minder freue ich mich mit meinem Bruder Athanasius, daß er, obschon er viel Schmerzliches litt, nicht eine Stunde lang euere Liebe und euere Sehnsucht vergessen hat. Denn wenn er auch dem Leibe nach auf eine Zeit lang von euch getrennt zu sein schien, so lebte er doch im Geiste beständig in Gemeinschaft mit euch.</p>
      <h2>53</h2><p>Er kehrt also jetzt in größerem Glanze zu euch zurück, als da er euch verließ. Denn wenn die kostbaren Stoffe wie Gold und Silber in Bezug auf die Reinigkeit das Feuer prüft, welche Worte sind wohl eines so großen Mannes würdig, der, nachdem er so viele Drangsale siegreich bestanden hat, euch zurückgegeben wird, nicht bloß von uns, sondern auch von der ganzen Synode für unschuldig erklärt? Nehmt also, geliebte Brüder, mit aller Ehre und Freude in Gott euern Bischof Athanasius und mit ihm Alle auf, die mit ihm so viele Mühe getheilt haben, und freuet euch, daß der Gegenstand euerer Wünsche euch zu Theil geworden ist, die ihr eueren Hirten, der nach euerer Gottesfurcht, so zu sagen, sich sehnte und dürstete, mit heilsamen Schreiben getränkt und genährt habt. Denn ihr seid ihm bei seinem Aufenthalte in der Fremde ein Trost geworden und habt den Verfolgten durch euere treuen Seelen und Herzen erquickt. Ich aber empfinde bereits Freude, indem ich euere gemeinsame Freude über seine Rückkehr mir vorstelle und sie in Gedanken vorhersehe, sowie das gottesfürchtige Entgegengehen der Menge und die herrliche Festfeier der Herbeiströmenden. Was für ein herrlicher Tag wird das für euch sein, wenn mein Bruder zurückkommt, wenn die früheren Zustände aufhören und die hochgefeierte und erwünschte Rückkehr gleichsam zum frohen Genuß der ungetrübtesten Freude Alle vereinigt! Diese Freude berührt im höchsten Grade auch uns, da gewiß von Gott auch das uns gewährt wurde, daß wir einen so großen Mann konnten kennen lernen. Es geziemt sich nun, den Brief mit einem Gebete zu schließen. Der allmächtige Gott und sein Sohn, unser Herr und Heiland Jesus Christus, möge euch ununterbrochen seine Gnade verleihen und euerem bewundernswerthen Glauben, den ihr an euerem Bischof durch rühmliches Zeugniß an den Tag gelegt habt, den Kampfpreis gewähren, damit er euch und eueren Nachkommen hier und im künftigen Leben das Beste gewähre, was kein Auge gesehen, kein Ohr gehört hat, und was in keines Menschen Herz gekommen ist, was Gott denen bereitet hat, die ihn lieben, durch unsern Herrn Jesus Christus, durch den dem allmächtigen Gotte die Herrlichkeit sei von Ewigkeit zu Ewigkeit Amen. Ich sage euch Lebewohl im Herrn, geliebte Brüder!</p>
      <h2>54</h2><p>Als ich mit diesem Schreiben angekommen war, nahm mich der Kaiser zuvorkommend auf und entließ mich in die Heimath und zur Kirche, indem er an die Bischöfe, Priester und Laien Folgendes schrieb.</p><p><em>Der siegreiche Constantius, der Größte, Durchlauchtigste, an die Bischöfe und Priester der katholischen Kirche.</em></p><p>Nicht wurde der ehrwürdigste Athanasius von der Gnade Gottes verlassen, sondern wenn er auch auf kurze Zeit der Prüfung unter den Menschen ausgesetzt war, so wurde ihm doch durch die Vorsehung, welche über Alles wacht, das verdiente Loos zu Theil, und er gelangte durch den Willen des Höchsten und unsere richterliche Entscheidung zugleich in den Besitz der Heimath und der Kirche, deren Vorsteher er nach dem Willen Gottes war. Es mußte ihm auch das Geziemende von unserer Milde zu Theil werden, so daß Alles, was früher gegen die beschlossen worden ist, welche mit ihm Gemeinschaft gepflogen haben, jetzt der Vergessenheit anheimfallen und jeder Verdacht gegen sie für die Zukunft aufhören und die Abgabenfreiheit, die früher seine Kleriker genossen, ihnen in gebührender Weise bestätigt sein soll. Wir beschlossen nämlich auch dadurch unsere Gewogenheit gegen ihn zu zeigen, so daß Alle, die auf der Liste der Religionsdiener verzeichnet sind, erkennen, daß allen seinen Anhängern Sicherheit gewährt sei, seien es Bischöfe oder Kleriker. Ein genügendes Kennzeichen der rechten Geistersrichtung eines Jeden wird die Vereinigung mit ihm sein. Denn Alle, welche dem besseren Urtheil und Antheil sich anschließen und die Gemeinschaft mit ihm wählen, sollen, wie uns beliebt hat, nach dem Beispiel der früheren Fürsorge auch jetzt die von uns nach dem Willen des Höchsten gewährte Gnade genießen. Gott möge euch erhalten!</p><p><em>Zweiter Brief.</em></p><p><em>Der siegreiche Constantius, der Größte, Durchlauchtigste, an das Volk der katholischen Kirche in Alexandria.</em></p>
      <h2>55</h2><p>Da uns am Herzen liegt, daß bei euch in Allem gute Ordnung herrsche, und da wir wissen, daß ihr schon lange der Fürsorge eines Bischofs beraubt seid, so haben wir uns entschlossen, den Bischof Athanasius, einen durch seine Rechtschaffenheit und die Unbescholtenheit seiner Sitten bei Allen bekannten Mann, wieder zu euch zu senden. Nehmet diesen nach euerer Gewohnheit in geziemender Weise auf, und habt ihr ihn zum Helfer in eueren Gebeten zu Gott angenommen, so bestrebet euch, Friede und Eintracht, wie es euch geziemt und es für uns am besten ist, nach dem Gesetze der Kirche beständig zu bewahren. Denn es ist auch nicht entsprechend, daß irgend ein Zwiespalt oder eine Unruhe unter euch erregt werde, und es steht in Widerspruch mit dem Glücke unserer Zeiten. Und wir wollen, daß das von euch gänzlich ferne sei, und ermahnen euch, daß ihr, indem ihr ihn, wie schon gesagt, zum Vorsteher und Helfer habt, nach euerer Gewohnheit in eueren Gebeten zur Gottheit beständig verharret. So werden dann, wenn ihr in dieser Willensrichtung den Wünschen Aller entsprechet, auch die Heiden, die auch jetzt noch in der Verirrung des Götzendienstes stecken, zur Kenntniß der heiligen Gottesverehrung mit großer Bereitwilligkeit herbeieilen. Geliebte! Wir ermahnen euch also nochmals, euch an das bereits Gesagte stets zu halten. Nehmet den Bischof, der durch den Rathschluß des Höchsten und unsern Willen abgesendet worden ist, liebreich auf und bringet ihm euere ganze Seele und Zuneigung entgegen. Denn das geziemt sich für euch und kommt gewiß auch unserer Milde zu. Um daher den Übelgesinnten jede Lust zu Aufruhr und Ruhestörung zu benehmen, haben wir euere Richter schriftlich beauftragt, gegen alle Ruhestörer, von denen sie Kenntniß erhielten, die Strafgesetze in Anwendung zu bringen. Indem ihr also Beides im Auge behaltet, sowohl unsern Beschluß, den wir in Verbindung mit dem Allerhöchsten gefaßt haben, und die Rücksicht für euch und euere Eintracht, als auch die Züchtigung der Widerspenstigen, und indem ihr beobachtet, was sich geziemt und der Vorschrift der heiligen Religion entspricht, befleißt euch mit aller Ehrfurcht und Hochachtung gegen den Genannten die Gebete in Verbindung mit ihm für euch und die gute Einrichtung des ganzen Lebens zu Gott dem Allvater emporzusenden.</p>
      <h2>56</h2><p>Nachdem er Dieß geschrieben hatte, befahl er, daß die früher von ihm in Folge der Verleumdung der Eusebianer gegen mich gefaßten Beschlüsse aufgehoben und aus den Archiven des Dux und des Eparchen von Ägypten entfernt werden sollten. Der Decurio Eusebius wurde abgesendet und nahm sie aus den Archiven. Das Schreiben lautet, wie folgt.</p><p><em>Der siegreiche Constantius Augustus an Nestorius. Gleichlautend auch an die Präfekten in Augustamnica, Thebais und Libyen.</em></p><p>Wenn sich irgend ein Befehl vorfindet, der früher einmal zum Nachtheil und zur Beeinträchtigung derer erlassen wurde, die mit dem Bischof Athanasius Gemeinschaft pflegen, so wollen wir, daß ein solcher jetzt vernichtet werde. Wir wollen daher auch, daß die Abgabenfreiheit, welche seine Kleriker hatten, ebendieselben auch jetzt wieder haben sollen. Und wir wollen, daß dieser unser Auftrag beobachtet werde, so daß, nachdem der Bischof Athanasius der Kirche zurückgegeben ist, die, welche mit ihm Gemeinschaft haben, die Abgabenfreiheit besitzen, welche sie immer besaßen, welche auch die übrigen Kleriker besitzen, damit so auch sie dieses Besitzes sich erfreuen.</p>
      <h2>57</h2><p>Als ich in dieser Weise entlassen durch Syrien reiste, kam ich zu den Bischöfen in Palästina. Diese hielten eine Synode in Jerusalem und nahmen mich zuvorkommend auf. Auch sie entließen uns in Frieden und schrieben an die Kirche und die Bischöfe, wie folgt:</p><p>„Die heilige Synode, die in Jerusalem versammelt ist, den Amtsgenossen in Ägypten und Libyen, den Priestern, Diakonen und Laien in Alexandria, den geliebten und heißersehnten Brüdern, Gruß im Herrn!</p><p>Wir vermögen dem Gott aller Dinge nicht nach Verdienst zu danken, Geliebte, für die Wunder, die er immer that, und die er auch jetzt an euerer Kirche that, indem er euch eueren Hirten und Herrn, unsern Amtsgenossen Athanasius, zurückgibt. Denn wer hätte gehofft, das jemals mit Augen zu sehen, was euch jetzt in der That zu Theil wird! In der That fanden euere Gebete bei dem Gott aller Dinge Erhörung, der für seine Kirche Sorge trägt und auf euere Thränen und Seufzer sah und deßhalb euere Gebete erhörte. Denn ihr waret wie vernachlässigte und bedrängte Schafe, die keinen Hirten haben. Deßhalb sah der wahre Hirt vom Himmel auf euch herab, der für seine Schafe sorgt, und gibt euch den zurück, nach dem ihr verlanget. Denn sehet, auch wir, die wir Alles für den kirchlichen Frieden thun und mit euerer Liebe zusammenstimmen, haben ihn vor euch umfangen, und indem wir durch ihn mit euch in Gemeinschaft treten, senden wir euch dieses Begrüßungsschreiben und unsere Dankgebete, damit ihr wisset, daß auch wir durch das Band der Liebe mit ihm vereinigt sind. Ihr müsset aber für die Gottesfurcht der frommen Kaiser beten, die, weil sie gleichfalls euere Sehnsucht nach ihm und seine Unschuld kannten, sich entschlossen, ihn euch mit allen Ehren zurückzugeben. Empfangt ihn also mit offenen Armen und beeilet euch, die seinetwegen schuldigen Dankgebete Gott darzubringen, der euch das gewährt hat, damit ihr immer mit Gott euch freuet und unsern Herrn verherrlichet in Christus Jesus unserm Herrn, durch welchen dem Vater die Herrlichkeit sei von Ewigkeit zu Ewigkeit. Amen.“</p><p>Die Unterschriften aber will ich, wenn ich sie auch früher schon anführte, auch jetzt hersetzen. Es sind nämlich unterschrieben: Maximus, Aetius, Arius, Theodorus, Germanus, Silvanus, Paulus, Patricius, Elpidius, Germanus, Eusebius, Zenobius, Paulus, Makrinus, Petrus, Claudius.</p>
      <h2>58</h2><p>Als das Ursacius und Valens sahen, sprachen sie sich nun selbst das Urtheil, gingen nach Rom und legten gleichfalls ein reumüthiges Bekenntniß ab, baten um Verzeihung und schrieben an Julius, den Bischof des alten Rom, und an uns Folgendes. Die Abschrift wurde mir von Paulinus, Bischof von Trier, zugesendet.</p><p><em>Brief an Julius über die Sinnesänderung des Ursacius und Valens.</em></p><p>Aus dem Römischen übersetzt.</p><p><em>An den hochseligen Herrn, den Vater Julius, Ursacius und Valens.</em></p><p>Da bekannt ist, daß wir ehemals Vieles, was schwer verletzend ist, über den Bischof Athanasius schriftlich ausgesagt haben, in Betreff der Sache aber, über die wir Mittheilung gemacht hatten, von deiner Güte schriftlich um näheren Aufschluß angegangen keine Rechenschaft geben konnten, so bekennen wir vor deiner Güte in Gegenwart aller Priester, unserer Brüder, daß Alles, was bisher über den Namen des genannten Athanasius euch zu Ohren gekommen, erdichtet und erlogen ist und nicht im Entferntesten ihn trifft. Deßhalb schließen wir uns gerne der Gemeinschaft des genannten Athanasius an, zumal deine Gottesfurcht in ihrer angebornen Rechtschaffenheit unserer Verirrung Verzeihung zu gewähren sich würdigte. Auch erklären wir Dieß, daß wir, wenn jemals die Morgenländer oder Athanasius selbst deßhalb in böser Gesinnung uns sollten vor Gericht laden wollen, ohne deine Einwilligung nicht erscheinen werden. Den Arius aber und seine Vertheidiger, welche sagen: Es war einmal, da der Sohn nicht war, und der Sohn ist aus dem Nichtseienden, und welche läugnen, daß Christus Gott und Gottes Sohn vor den Zeiten gewesen sei, belegen wir, wie in unserer ersten Erklärung, die wir in Mailand übergeben haben, auch jetzt und immer mit dem Anathem. Indem wir Dieß eigenhändig schreiben, bekennen wir nochmals, daß wir die arianische Häresie, wie wir bereits ausgesprochen haben, und ihre Urheber auf ewig verurtheilt haben. Ich Ursacius habe diese meine Erklärung eigenhändig unterschrieben, ebenso auch Valens.</p><p><em>An den Herrn und Bruder Athanasius, den Bischof, die Bischöfe Ursacius und Valens.</em></p><p>„Da wir, geliebter Bruder, Gelegenheit gefunden haben, durch unsern Bruder und Mitpriester Musäus, der sich zu deiner Liebe begibt, so entbieten wir dir durch ihn aus Aquileja herzlichen Gruß und wünschen, du mögest unsern Brief bei guter Gesundheit lesen. Denn du wirst uns Freude machen, wenn du unser Schreiben erwiderst. Denn wisse, daß wir mit dir Frieden haben und in kirchlicher Gemeinschaft stehen. Und zum Beweise hiefür diene dir die Begrüssung in diesem Briefe. Die göttliche Vorsehung bewahre dich, o Herr und geliebter Bruder!“</p><p>So also lautet der Brief, und das ist das Urtheil und der Richterspruch der Bischöfe zu unsern Gunsten. Um aber zu zeigen, daß sie nicht aus Wohldienerei gehandelt haben noch von Jemand gegen sie ein Zwang geübt wurde, will ich mit euerer Zustimmung die Sache ganz von Anfang erzählen, damit ihr einsehet, daß die Bischöfe freiwillig mit Fug und Recht Dieß geschrieben und Ursacius und Valens, wenn auch spät, die Wahrheit bekannt haben.</p>
      <h2>59</h2><p>Petrus ist bei uns vor der Verfolgung Bischof gewesen und hat in der Verfolgung den Martyrertod gelitten. Dieser setzte den Melitius in Ägypten, der Bischof genannt wurde und vieler Verbrechen und des Götzenopfers überführt war, in einer gemeinsamen Synode der Bischöfe ab. Melitius aber suchte keinen Schutz bei einer andern Synode, noch suchte er sich vor der Nachwelt zu rechtfertigen, sondern veranlaßte eine Spaltung. Und seine Parteigenossen heissen seitdem nicht mehr Christen, sondern Melitianer. Zugleich begann er die Bischöfe zu schmähen und verleumdete zuerst den Petrus selbst, dann seinen Nachfolger Achillas und nach Achillas den Alexander. Und darin handelte er schlau und wählte sich den Absalon zum Vorbild, damit er, weil er sich der Absetzung schämte, wenigstens durch seine Verleumdungen die Einfältigen einigermaßen hintergehen könnte. Während Melitius Dieß that, tauchte auch die arianische Häresie auf. Doch in der Synode von Nicäa wurde die Häresie mit dem Anathem belegt, und die Arianer wurden ausgeschlossen, die Melitianer in gewisser Weise aufgenommen, und es ist jetzt nicht mehr nöthig, hievon die Ursache anzugeben. Es waren nun noch nicht fünf Monate verflossen, als der selige Alexander starb. Die Melitianer aber, welche sich hätten ruhig verhalten und welche hätten dankbar sein sollen, daß sie überhaupt aufgenommen worden waren, setzten, da sie nach Art der Hunde nicht vergaßen, was sie ausgespieen hatten, wieder die Kirchen in Verwirrung. Als nun Eusebius hievon Kenntniß erhalten hatte, so sendete er, da er das Haupt der Arianer war, an die Melitianer und erkaufte sie mit vielen Versprechungen, schloß mit ihnen insgeheim Freundschaft und setzte mit ihnen auch eine bestimmte Zeit fest. Anfangs nun sendete er an mich und bat mich, ich möchte die Arianer aufnehmen, so zwar, daß er mündlich drohte, schriftlich aber bat. Als ich mich aber weigerte und erklärte, daß die nicht aufgenommen werden könnten, die eine der Wahrheit widersprechende Häresie erfunden hätten und von der ökumenischen Synode mit dem Anathem belegt worden wären, veranlaßte er auch den Kaiser, den seligen Constantin, an mich zu schreiben, der die Drohung aussprach, es sollte mir, wenn ich die Arianer nicht aufnähme, das zustoßen, was mir früher und jetzt zugestoßen ist. Hier folgt der betreffende Theil des Briefes. Die Überbringer des Briefes waren Synkletius und Gaudentius aus dem Palaste.</p><p><em>Abschnitt aus dem Briefe des Kaisers Constantin.</em></p><p>„Da du also meinen Willen kennst, so gewähre Allen, die in die Kirche eintreten wollen, ungehinderten Eintritt. Denn wenn ich erfahre, daß du Jemand von denen, welche die Kirchengemeinschaft suchen, nicht aufgenommen oder ihm den Eintritt verwehrt hast, so werde ich sogleich Jemand schicken, der auf meinen Befehl dich absetzen und aus deinem Wohnsitze vertreiben wird.“</p>
      <h2>60</h2><p>Als ich nun auch den Kaiser in einem Briefe überzeugte, daß die christusfeindliche Häresie mit der katholischen Kirche keine Gemeinschaft haben könne, da erklärte endlich Eusebius, daß die mit den Melitianern verabredete Zeit gekommen sei, und überredete sie in einem Briefe, einen Vorwand zu erfinden, um, wie sie gegen Petrus, Achillas und Alexander es gehalten haben, so auch gegen uns Dichtungen zu verbreiten. Nachdem sie nun lange gesucht hatten, ohne Etwas zu finden, einigen sie sich zuletzt mit den Eusebianern und erfinden eine erste Anklage durch Ision, Eudämon und Kallinikus in Betreff leinener Kleidungsstücke, als hätte ich den Ägyptiern eine Abgabe auferlegt und sie von den Genannten zuerst gefordert. Da aber Priester von uns sich dort befanden und der Kaiser sie vernahm, wurden sie zurückgewiesen. Die Priester aber waren Apis und Makarius. Der Kaiser aber schrieb einen Brief, worin er den Ision verurtheilte und mich einlud, zu ihm zu kommen. Der Brief lautet, wie folgt. (Der Brief ist verloren gegangen.)</p><p>Als aber Eusebius hievon Kenntniß erhalten hatte, überredete er sie zu bleiben, und als ich gekommen war, klagten sie den Makarius wieder in Betreff des Kelches an, gegen mich aber sprachen sie nicht eine gewöhnliche Verleumdung, sondern die höchste von allen aus, daß ich als ein Feind des Kaisers gehandelt und an einen gewissen Philumenus eine Kiste Goldes gesendet habe. Der Kaiser vernahm uns auch hierüber in Psamathia; und sie wurden wie gewöhnlich überführt und abgewiesen. Als wir wieder zurückkehrten, richtete er folgendes Schreiben an das Volk.</p><p><em>Constantin der Größte, Durchlauchtigste, an das Volk der katholischen Kirche in Alexandria.</em></p>
      <h2>61</h2><p>„Geliebte Brüder! Ich grüsse euch, indem ich Gott als den höchsten Zeugen meines Willens anrufe und den eingebornen Schöpfer unseres Gesetzes, der über das Leben Aller herrscht und die Zwistigkeiten haßt. Doch was soll ich sagen? Daß wir in guter Gesundheit uns befinden? Aber wir könnten uns eines besseren Wohlbefindens erfreuen, wenn ihr euch gegenseitig lieben und den Haß abschütteln würdet, in Folge dessen wir den Wogen der Zänker den Hafen der Liebe überlassen haben. Wehe über diese Ungereimtheit! Wie viele Unfälle entspringen täglich aus dem unruhigen Neide! So hat der üble Ruf beim Volke Gottes seinen Wohnsitz aufgeschlagen. Wohin hat also der Glaube an die Gerechtigkeit sich zurückgezogen? Wir sind ja so sehr in dunkle Finsterniß gehüllt, nicht bloß wegen des vielverflochtenen Irrthums, sondern auch wegen der Gebrechen der Undankbaren, wir ertragen die, welche dem Unverstande Belohnungen zuerkennen, und lassen es ungeahndet, wenn wir Solche wahrnehmen, die der Gerechtigkeit und Wahrheit widerstreben. Wie schrecklich zeigt sich hierin unsere Verkehrtheit! Wir stellen die Feinde nicht zur Rede, sondern lassen sie in ihrem Räuberhandwerke unbehelligt, wodurch der verderbliche Betrug ohne irgend einen Widerstand sich, so zu sagen, leicht einen Weg bahnte. Gibt es also keine Empfindung, nicht einmal nach dem Zuge der gemeinsamen Natur Aller, wenn wir die Vorschriften des Gesetzes vernachlässigt haben? Aber man wird sagen: Nach der Natur wird die Liebe gefunden. Warum also ertragen wir, da wir ausser der guten Naturanlage das Gesetz Gottes besitzen, die Belästigung und das Geschrei der Feinde, die, wie es den Anschein hat, Alles gleichsam mit Feuerbränden in Brand stecken, und sehen nicht, da wir Augen haben, und empfinden nicht, da wir von den Sinneswerkzeugen des Gesetzes umschlossen sind? Welche Leidenschaft hat also unser Leben ergriffen, da wir uns selbst so sehr vernachlässigen und trotzdem, daß Gott uns daran erinnert? Denn ist das Übel nicht unerträglich? Muß man diese nicht für Feinde halten statt für das Haus und Volk Gottes? Jene grundverdorbenen Menschen wüthen gegen uns und beschuldigen uns, und gehen von entgegengesetzten Seiten auf uns los.</p>
      <h2>62</h2><p>Mit welch großem Unverstande sie aber das thun, bitte ich euch selbst zu erwägen. Denn bei den Thoren ruht die Bosheit auf ihrer Zunge. Diese tragen nun gleichsam bleiernen Groll herum, um sich gegenseitig zu verwunden und uns den Gewinn ihrer eigenen Züchtigung finden zu lassen, und der gute Belehrung ertheilt, wird für einen Feind gehalten. Wer aber die Bosheit des Neides zur Schau trägt, der behandelt die Gutmüthigkeit des Volles nicht in geziemender Weise, verheert es und zehrt es auf, schmückt und verherrlicht sich selbst mit übelwollendem Lobspruch, stürzt die Wahrheit über den Haufen, verletzt die Treue, bis er für sein Gewissen eine Höhle und einen Schlupfwinkel gesucht und gefunden. Diese Verkehrtheit macht sie also unglücklich, wenn sie sich, obschon sie unwürdig sind, vorschnell loben und sagen: „Wehe über das Unheil! Der ist zu alt, Jener ein Kind. Mir gebührt die Ehre, mir ist man sie schuldig, Jener hat sie eingebüßt. Denn ich werde Alle an mich ziehen und sie mit Gewaltanwendung zu vernichten suchen.“ Gewiß ein trefflicher Ausruf des Wahnsinns! Man kann Truppen, aufgebotene Mannschaften, oder so zu sagen die ganze Vorstandschaft des Rudererpersonals bei diesen ihren seltsamen Aufwiegelungen sehen. O über unsere Verkehrtheit! In der Kirche Gottes tragen wir so zu sagen unsern Unverstand zur Schau. Und doch schämen sie sich nicht? Sie tadeln nicht sich selbst? Und es empfindet ihre Seele keinen Schmerz, daß sie wenigstens jetzt gegenüber dem Betruge und dem Zanke etwas Würdiges zu denken scheinen? Es ist bloße Gewaltthat des Neides, gestützt auf die ihm eigenen Zaubermittel. Es vermochten die Bösen Nichts gegen eueren Bischof. Glaubet mir, Brüder, sie sind um nichts Anderes besorgt, als unsere Zeiten zu bedrängen und in diesem Leben keine Zeit zur Reue mehr zu haben. Helfet also euch selbst, ich bitte euch, laßt euch von unserer Liebe fesseln und verfolgt mit aller Kraft die, welche das Glück unserer Eintracht zu zerstören wünschen, und indem ihr auf Gott schauet, liebet euch selbst. Denn ich habe eueren Bischof Athanasius gerne aufgenommen und habe mit ihm geredet wie mit einem Manne, von dem ich überzeugt bin, daß er ein Mann Gottes ist. Euch kommt es zu, Dieß einzusehen, nicht mir, darüber zu urtheilen. Meinen Gruß aber glaubte ich euch durch den ehrwürdigsten Athanasius selbst überbringen lassen zu müssen. Ich erwog nämlich die mit seiner Gerechtigkeitsliebe verbundene Sorgsamkeit, die in einer meines friedfertigen Glaubens nicht unwürdigen Weise immer auf die Wohlthat der heilsamen Lehre gerichtet ist und eindringliche Mahnworte finden wird. Gott möge euch beschützen, geliebte Brüder!“ So weit Constantin.</p>
      <h2>63</h2><p>[Forts. v. ] Nach diesen Vorgängen ruhten die Melitianer auf kurze Zeit. Dann aber lassen sie sich wieder erhitzen und fassen zuletzt, indem sie denen zu gefallen suchen, von denen sie gedungen waren, folgenden Plan. Die Mareotis ist eine Landschaft im alexandrinischen Gebiet. In dieser hatte Melitius dem Schisma keinen Eingang verschaffen können. Da nun Kirchen an bestimmten Orten vorhanden waren und alle Priester in denselben zu den Versammlungen kamen und das Volk in Frieden lebte, so unternahm es ein Mann, Namens Ischyras, kein Kleriker, zudem bösgeartet, die Bewohner seines Dorfes zu verführen, indem er sich für einen Kleriker ausgab. Da der Priester am Orte das in Erfahrung gebracht hatte, theilte er es mir, als ich die Kirchen visitirte, mit, und ich sandte mit ihm den Priester Makarius ab, den Ischyras vorzuladen. Da sie ihn aber krank und im Zimmer liegend antrafen, so trugen sie seinem Vater auf, den Sohn zu ermahnen, Nichts der Art mehr zu thun, als man ihm zur Last gelegt habe. Als er aber von der Krankheit wieder aufgestanden war und von den Seinigen und seinem Vater abgehalten wurde, floh er zu den Melitianern, und diese verständigten sich mit den Eusebianern. Und da nun vereinbaren sie die Verleumdung, daß Makarius einen Kelch zerbrochen habe, und von uns ein gewisser Bischof Arsenius ermordet worden sei. Den Arsenius verbargen sie, damit man wegen seines Nichterscheinens ihn ermordet glauben sollte. Und eine Hand, heißt es, trugen sie von ihm herum, wie wenn er zerstückelt worden wäre. Von Ischyras aber, den sie nicht kannten, begannen sie auszubreiten, daß er ein Priester sei, damit er, wenn er von einem Kelche sprach, täuschen konnte. Ischyras nun kam, da die Seinigen ihm Vorwürfe machten, weinend zu uns und sagte, daß Nichts der Art von Makarius geschehen sei, wie sie ausposaunten, er sei von den Melitianern angestiftet worden, eine solche Schmähung aus der Luft zu greifen. Und er gab folgende schriftliche Erklärung.</p><p><em>Dem seligen Vater Athanasius Ischyras Gruß im Herrn.</em></p>
      <h2>64</h2><p>[Forts. v. ] „Da ich zu dir gekommen bin, o Herr und Bischof, und die Aufnahme in die Kirche nachsuchte, du mir aber vorgeworfen hast, was ich früher ausgesagt habe, als ob ich das aus freiem Antrieb gethan hätte, so übergebe ich dir deßhalb gegenwärtige schriftliche Erklärung, damit du wissen mögest, daß mir Gewalt angethan wurde und ich Schläge empfing von Isaak und Heraklides und von Isaak von Letopolis und von ihren Anhängern. Ich nehme aber Gott hiefür zum Zeugen und erkläre zur Rechtfertigung, daß mir nicht bekannt ist, daß du Etwas von dem gethan habest, was Jene ausgesagt haben. Denn es ist kein Kelch zerbrochen worden, noch ein heiliger Tisch umgestürzt worden, sondern zu allen diesen Aussagen haben mich Jene durch Anwendung von Gewalt veranlaßt. Dieß habe ich zur Rechtfertigung bei dir vorzubringen und habe es dir schriftlich überreicht, indem ich wünsche und das Bittgesuch stelle, mich jenen anschließen zu dürfen, die zu deiner Kirchengemeinschaft gehören. Ich wünsche dir Wohlbefinden im Herrn. Ich habe dieses mein eigenhändiges Schreiben dir, dem Bischof Athanasius, übergeben in Gegenwart der Priester Ammonas von Dikella, Heraklius von Phasko, Bokkon von Chenebri, Achillas von Myrsine, Didymus von Taphosiris und Justus von Bomotheus, und der Diakonen: aus Alexandria Paulus, Petrus und Olympius, aus der Mareotis Ammonius, Pistus, Demetrius und Cajus.“</p>
      <h2>65</h2><p>Obschon nun selbst Ischyras Dieß schriftlich erklärt hatte, so verbreiteten sie gleichwohl wieder überall diese Anklage und brachten sie sogar vor den Kaiser Constantin. Dieser hatte bereits zuvor von dem Kelche in Psamathia in unserer Gegenwart vernommen und die Verleumdungssucht der Feinde verurtheilt und schrieb an den Censor Dalmatius in Antiochia, in Betreff des Mordes Untersuchung einzuleiten. Der Censor schrieb daher an mich, ich sollte zur Vertheidigung gegen die Anklage meine Vorkehrungen treffen. Obschon ich nun Anfangs, weil ich wußte, daß sie nichts Wahres sagten, mich nicht rührte, so schrieb ich gleichwohl, da der Kaiser aufgeregt war, nach Empfang dieses Schreibens an meine Amtsgenossen in Ägypten und sendete einen Diakon hin, weil ich in Betreff des Arsenius Nachrichten einholen wollte. Denn ich hatte den Mann seit fünf bis sechs Jahren nicht gesehen. Kurz, um nicht Das alles ausführlich zu erzählen, es wurde in Erfahrung gebracht, daß Arsenius versteckt sei, Anfangs in Ägypten, später erfuhren die Unsrigen auch wieder, daß er sich in Tyrus verborgen halte. Und in seltsamer Weise gestand er nicht einmal, als man ihn gefunden hatte, daß er Arsenius sei, bis er vor dem Richterstuhl des Paulus, des damaligen Bischofs von Tyrus, überführt wurde und beschämt weiter nicht mehr läugnete. Das aber that er, weil er dem mit den Eusebianern geschlossenen Vertrage nachkam, damit nicht, wenn er gefunden war, ihre Komödie dann in Nichts zerflöße, wie es auch geschehen ist. Denn als ich an den Kaiser schrieb, daß Arsenius gefunden sei, und ihn an das erinnerte, was er in Psamathia in Betreff des Priesters Makarius gehört hatte, ließ er die richterliche Untersuchung des Censors einstellen, sprach in einem Schreiben gegen die Verleumdungssucht unserer Feinde das Verdammungsurtheil und hieß die Eusebianer, die in feindlicher Absicht gegen uns auf einer Reise nach dem Morgenlande begriffen waren, zurückkehren. Daß sie mich nun beschuldigten, als hätte ich den Arsenius getödtet, genügt es, um nicht alle von Vielen an mich gerichteten Briefen hier anzuführen, nur den des Bischofs Alexander von Thessalonich zu bringen; denn aus diesem kann man sich auch von denen der Übrigen ein Urtheil bilden. Dieser nun schrieb, da er wußte, was Archaph, der auch Johannes heißt, gegen uns in Betreff des Mordes verbreitet hatte, und da er Kenntniß erhalten hatte, daß Arsenius lebe, wie folgt:</p><p><em>Dem geliebten Herrn und Sohne, dem gleichgesinnten Amtsgenossen Athanasius, der Bischof Alexander Gruß im Herrn.</em></p>
      <h2>66</h2><p>[Forts. v. ] „Ich freue mich mit dem besten Sarapion, der so sehr bestrebt ist, sich mit heiligen Sitten zu schmücken, und dem Andenken des Vaters höheren Ruhm bereitet. „Denn sein Vater ist“, wie die heilige Schrift sagt, „gestorben und ist gleichsam nicht gestorben.“ Denn er hat ein Andenken im Leben zurückgelassen. Was nun die Gesinnung betrifft, die wir gegen den des Andenkens würdigen Sohon hegten, so ist dir, o Herr, die heilige Erinnerung an ihn und die im Jüngling wohnende Bescheidenheit selbst wohl bekannt. Ich habe einen einzigen Brief durch diesen Jüngling von deiner Ehrwürdigkeit empfangen. Eben das habe ich dir also mitgetheilt, damit du, o Herr, es wissen mögest. Unser geliebter Diakon Makarius hat mir Freude bereitet, da er mir von Konstantinopel schrieb, wie sehr der Verleumder Archaph beschämt wurde, indem er von Einem, der noch lebt, überall verbreitete, daß er gemordet worden sei. Daß er aber mit dem gleichgesinnten Troß für seine anmassenden Handlungen von dem gerechten Richter den verdienten Lohn ernten wird, spricht die Schrift aus, die nicht lügt. Der Herr aller Dinge möge dich möglichst lange erhalten, o Herr, der du Allen großen Nutzen bringst.“</p>
      <h2>67</h2><p>Daß aber Arsenius sich deßhalb verborgen hielt, damit diese das Mährchen von seinem Tode erfinden könnten, das bezeugen die, welche mit ihm umgingen. Denn als wir nach ihm forschten, fanden wir ihn, und Pinnes schrieb an Johannes, der diese Intrigue spielte, wie folgt:</p><p><em>Dem geliebten Bruder Johannes / der Priester Pimes</em> [cor.: Pinnes] <em>im Kloster Ptemencyrcis im Nomos</em> [„Landschaft, Gegend“] <em>Anteopolis Gruß</em></p><p>„Ich will dir zu wissen machen, daß Athanasius einen seiner Diakonen in die Thebais gesendet hat, um Alles in Betreff des Arsenius zu erforschen. Die er nun zuerst traf, der Priester Pecysius und Silvanus, der Bruder des Elias, Tapenacerameus und der Mönch Paulus von Hypsele gestanden, daß Arsenius bei uns ist. Wir aber, als wir hievon Kenntniß erhielten, ließen ihn auf ein Schiff bringen und mit dem Mönche Elias in die unteren Gegenden schiffen. Unmittelbar hernach kam der Diakon wieder mit Einigen und verfügte sich in unser Kloster wegen des nämlichen Arsenius. Ihn selbst fanden sie nun zwar nicht, weil wir ihn, wie gesagt, nach den unteren Gegenden weiter befördert hatten. Mich aber und den Mönch Elias, der ihn übernommen hatte, brachten sie nach Alexandria und führten uns vor den Dux, und ich vermochte es nicht zu leugnen, sondern gestand es ein, daß er lebe und nicht getödtet worden sei. Das Nämliche gestand auch der Mönch, der ihn übernommen hatte. Deßhalb mache ich dir das zu wissen, Vater, damit es dir nicht in den Sinn komme, den Athanasius anzuklagen. Denn ich habe gesagt, daß er lebe und bei uns verborgen war, und Das alles ist in Ägypten bekannt, und es läßt sich nicht mehr verbergen. Der Mönch Paphnutius im nämlichen Kloster schrieb den Brief. Unter herzlichem Gruße wünsche ich dir Wohlergehen.“</p><p>Was aber der Kaiser schrieb, als er erfuhr, daß Arsenius lebendig aufgefunden wurde, ist Folgendes:</p><p><em>Der siegreiche Constantin der Größte, Durchlauchtigste, an den Vater Athanasius.</em></p>
      <h2>68</h2><p>Nachdem ich das Schreiben deiner Einsicht gelesen hatte, entschloß ich meinerseits mich dazu, deiner Standhaftigkeit zu antworten und dich zu ermahnen, du mögest das Volk Gottes zur Ordnung und zum Mitleide anzuhalten bestrebt sein. Denn das halte ich in meiner Seele als das Wichtigste fest, die Wahrheit hoch zu halten und immer im Herzen die Gerechtigkeit zu bewahren und zumeist an denen Freude zu haben, die den rechten Weg des Lebens wandeln. In Betreff jener ganz fluchwürdigen Männer aber, der ganz verkommenen und verruchten Melitianer nämlich, die nunmehr von Verrücktheit strotzen und nur aus Mißgunst unter Lärm und Getöse unsinnige Dinge treiben und ihren lasterhaften Sinn an den Tag legen, will ich Folgendes sagen. Du siehst nämlich, daß die Männer, von denen Jene sagten, daß sie mit dem Schwerte getödtet worden seien, jetzt mitten unter uns wandeln und sich des Lebens freuen. Was könnte es da nun für ein schlimmeres Präjudiz geben, das so klar und deutlich gegen ihre Sache gerichtet ist, als daß die, von denen sie sagten, daß sie ermordet worden seien, am Leben sind und sich wohl befinden, so daß sie offenbar für sich selbst werden das Wort führen können? Es brachten aber die Melitianer unter ihren Anschuldigungen auch Folgendes vor. Sie behaupteten nämlich, du wärest mit gesetzwidriger Gewalt eingedrungen, hättest einen an der heiligsten Stätte aufbewahrten Kelch an dich gerissen und zerbrochen. Das wäre fürwahr die schwerste Beschuldigung und der größte Verstoß, wenn das wirklich so vollbracht und begangen worden wäre. Aber was ist denn das für eine Anklage? Was ist das für eine Unbeständigkeit, was für ein Hin- und Herschwanken, was für eine Ungleichheit in Betreff der That, daß sie jetzt diese Schuld einer andern Person aufbürden? Es ist daher die Sache offenbar klarer als selbst die Sonne, daß sie deiner Klugheit Nachstellungen zu bereiten suchten. Wer sollte nun da noch es mit diesen Menschen halten wollen, die so viel Nachtheiliges ausgebrütet haben, zumal sie sich selbst ins Verderben stürzen und wissen, daß sie wegen erdichteter und erlogener Thaten als Ankläger auftreten? Wer also wird sich ihnen, wie gesagt, anschließen und unaufhaltsam den Weg des Verderbens betreten, jenen nämlich, auf dem nur sie die Hoffnung auf Rettung und auf Hilfe finden zu können glauben? Denn wollten sie ein reines Gewissen suchen und an die beste Meinung denken und einen gesunden Sinn annehmen, so würden sie leicht erkennen, daß ihnen keine Hilfe von der Vorsehung in Aussicht stehe, da sie in solchen Dingen ihren Eifer zeigen und zum eigenen Verderben Solches unternehmen. Das möchte ich nun mit Recht nicht Härte, sondern Wahrheit nennen. Zum Schluß füge ich aber noch hinzu, daß wir wollen, es möge Dieß von deiner Klugheit oft öffentlich vorgelesen werden, daß Alle davon Kenntniß erlangen und vorzugsweise die es erfahren können, welche so handeln und solche Umtriebe machen, daß das, was wir in geraden Worten sagen, der Ausdruck des wahren Sachverhaltes ist. Da also in dieser Sache so viel Ungerechtes vorkommt, so sollen sie wissen, daß ich mich dahin entschieden und diesen Vorsatz gefaßt habe, wenn sie solche Umtriebe machen, dann nicht mehr nach den Gesetzen der Kirche, sondern nach den Staatsgesetzen in eigener Person die Sache zu untersuchen. Und dann werde ich finden, daß sie nicht bloß als Räuber gegenüber dem Menschengeschlecht, sondern auch gegenüber der göttlichen Lehre selbst sich herausstellen. Gott möge dich erhalten, geliebter Bruder!“</p>
      <h2>69</h2><p>Damit aber noch mehr die Schlechtigkeit der Verleumder ans Licht komme, sieh da, so schrieb auch Arsenius, nachdem er in seinem Verstecke aufgefunden worden war. Wie nämlich Ischyras schriftlich die Verleumdung eingestand, so überführt auch Arsenius durch sein Schreiben sie noch mehr ihrer Bösartigkeit.</p><p><em>Arsenius, Bischof der einst unter Melitius stehenden Bewohner der Stadt Hypsele, mit den Priestern und Diakonen dem seligen Vater Athanasius herzlichen Gruß im Herrn.</em></p><p>„Auch wir lieben den Frieden und die Vereinigung mit der katholischen Kirche, über die du mit der Gnade Gottes gesetzt bist, und indem wir entschlossen sind, dem Kirchengesetze in der alten Weise uns unterzuordnen, schreiben wir dir, geliebter Vater, und erklären uns im Namen des Herrn bereit, nicht mehr mit denen in Gemeinschaft stehen zu wollen, die noch in der Spaltung beharren und mit der katholischen Kirche noch nicht in Frieden leben, Bischöfen, Priestern und Diakonen, und es nicht mit ihnen zu halten, wenn sie in einer Synode Etwas erreichen wollen, weder Friedensbriefe zu senden, noch von ihnen anzunehmen, noch ohne Rücksicht auf deine Ansicht, da du der Bischof der Metropole bist, irgend eine Bestimmung über Bischöfe oder sonst über ein gemeinsames kirchliches Gesetz zu erlassen, sondern uns in alle früher aufgestellten Gesetze zu fügen wie die Bischöfe Ammonianus, Tyrannus, Plusianus und die übrigen Bischöfe. Ausserdem bitten wir deine Güte, du möchtest bald an uns schreiben, so wie auch an die Amtsgenossen in Betreff unserer Person, daß wir bereits auf dem angegebenen Punkte angelangt sind, und in Frieden mit der katholischen Kirche leben und mit den Amtsgenossen unserer Gegend in Verbindung stehen. Wir glauben aber, daß dein Gebet, da es leicht Erhörung findet, bewirken wird, daß dieser Friede fest und unauflöslich bis an das Ende dauern werde nach dem Willen Gottes des Herrn aller Dinge, durch Jesus Christus unsern Herrn. Die gesammte dir untergeordnete Priesterschaft grüßen wir mit den Unsrigen. Bald werden wir, wenn es Gott gefällt, mit deiner Güte zusammentreffen. Ich Arsenius wünsche dir Wohlergehen im Herrn für viele Jahre, seligster Vater!“</p>
      <h2>70</h2><p>Ein größerer und offenbarer Beweis, daß wir verleumdet worden sind, ist die Reue des Johannes. Und dafür ist Zeuge der gottesfürchtige Kaiser Constantin seligen Andenkens. Denn da er wußte, welche Anklage Johannes gegen sich selbst erhoben, und da er vom Reumüthigen einen Brief erhalten hatte, schrieb er Folgendes:</p><p><em>Constantin der Größte, Durchlauchtigste, an Johannes.</em></p><p>„Ganz erwünscht ist mir das von deiner Klugheit mir zugekommene Schreiben. Denn ich erfuhr daraus, was ich vorzugsweise zu erfahren wünschte, du habest alle niedrige Denkungsart abgelegt, seiest mit der Kirche, wie es sich geziemte, in Gemeinschaft getreten und habest dich vorzugsweise mit dem ehrwürdigen Bischof Athanasius ausgesöhnt. Wisse also, daß ich dir deßhalb besonderes Lob spende, daß du jeden Zank aufgegeben und, was Gott lieb war, gethan hast, indem du die Vereinigung mit der Kirche suchtest. Damit du nun auch das erlangt zu haben glaubest, wornach du Verlangen hast, so glaubte ich dir gestatten zu müssen, ein öffentliches Fuhrwerk zu besteigen und ins Lager meiner Milde zu eilen. Deine Sache wird es also sein, nicht zu zögern, sondern da dieser Brief dir ein öffentliches Fuhrwerk zur Verfügung stellt, sogleich zu uns zu kommen, damit du dein Verlangen befriedigest und, indem du uns siehst, die entsprechende Freude genießest. Gott möge dich bewahren, geliebter Bruder!“</p>
      <h2>71</h2><p>Das war also der Ausgang des Intriguenspiels, und die Melitianer wurden mit Beschämung zurückgewiesen. Die Eusebianer ruhten selbst jetzt noch nicht, denn es lagen ihnen nicht die Melitianer, sondern die Arianer am Herzen, und sie fürchteten, es möchte ihnen, wenn Jene ruhten, an Schauspielern fehlen, durch die sie ihr Intriguenspiel aufführen könnten. Sie hetzen also neuerdings die Melitianer an und bewegen den Kaiser neuerdings, eine Synode in Tyrus zu veranstalten, und es wird der Comes Dionysius abgesendet und den Eusebianern eine Militärbedeckung gegeben. Makarius wird von Soldaten gefesselt nach Tyrus gebracht, an mich aber schreibt er und drängt mich, daß wir auch gegen unsern Willen kommen sollten. Das ganze Intriguenspiel kann man nun aus dem abnehmen, was die Bischöfe von Ägypten schrieben. Wie sie es aber von Anfang an in Bewegung setzten, davon muß man wohl reden, denn darin kann man die Bosheit und Verschlagenheit wahrnehmen, die sie gegen uns in Anwendung brachten. Es gibt in Ägypten, Libyen, der Pentapolis nahezu hundert Bischöfe. Keiner von diesen beschuldigte uns, kein Priester erhob Klage gegen uns, kein Laie sagte etwas Nachtheiliges über uns aus, sondern es waren die von Petrus excommunicirten Melitianer und die Arianer, die sich in die Verfolgung theilten, und die Einen nahmen die Anklage, die Anderen die richterliche Entscheidung für sich in Anspruch. Wir lehnten nun die Eusebianer ab, weil sie in Folge ihrer Häresie unsere Feinde seien. Dann bewiesen wir, daß der genannte Ankläger ganz und gar kein Priester sei, auf folgende Weise. Als Melitius aufgenommen wurde, (und wäre das nur niemals geschehen!) verlangte der selige Alexander, weil er seine Verschlagenheit kannte, von ihm ein Verzeichniß der Bischöfe, die er in Ägypten zu haben vorgab, und der Priester und Diakonen in Alexandria selbst, und die er etwa im Gebiete von Alexandria hätte. Das aber that der Vater Alexander, damit Melitius sich nicht zu frei in der Kirche bewege, bei Vielen einen Kauf eingehe und täglich einschmuggle, wen es ihm beliebe. Von den ägyptischen machte er folgendes Verzeichniß.</p><p><em>Verzeichniß, das Melitius dem Bischof Alexander übergeben.</em></p><p>Ich Melitius in Lykopolis, Lucius in Antinoopolis, Phasileus in Hermopolis, Achilles in Cusä, Ammonius in Diospolis.</p><p>In Ptolemais Pachymes in Tentyrä.</p><p>In Maximianopolis Theodor in Koptus.</p><p>In der Thebais Kales in Hermethes, Kolluthus im oberen Cynos, Pelagius in Oxyrynchus, Petrus in Herakleopolis, Theon in Nilopolis, Isaak in Letopolis, Heraklides in Nikiopolis, Isaak in Kleopatris, Melas in Arsenoites.</p><p>In Heliopolis Amos in Leontopolis, Ision in Athribi.</p><p>In Pharbethus Harpokration in Bubastus, Moses in Phakusä, Kallinikus in Pelusium, Eudämon in Tanis, Ephraim in Thmuis.</p><p>In Sais Hermäon in Cynus und Busiris, Soterichos in Sebennytus, Pininuthes in Phthenegys, Kronius in Metelis, Agathammon im alexandrinischen Gebiete.</p><p>In Memphis Johannes, vom Kaiser dem Erzbischof beigegeben. Das sind die in Ägypten.</p><p>Die Kleriker aber, die er in Alexandria hatte, sind der Priester Apollonius, der Priester Irenäus, der Priester Dioskorus, der Priester Tyrannus.</p><p>Diakonen: der Diakon Timotheus, der Diakon Antonius, der Diakon Hephästion und Makarius, Priester in Parembole.</p>
      <h2>72</h2><p>Diese übergab Melitius in ihrer persönlichen Anwesenheit dem Bischof Alexander. Von Einem, Namens Ischyras, machte er weder eine Erwähnung, noch gab er zu, daß er überhaupt in der Mareotis jemals welche gehabt habe. Gleichwohl gaben die Feinde nicht nach und der kein Priester war, wurde zu einem Priester gestempelt. Denn der Comes wendete Gewalt an, und wir wurden von Soldaten fortgeschleppt. Aber trotzdem hat die Gnade Gottes gesiegt. Denn sie überführten nicht nur den Makarius wegen des Kelches nicht, sondern auch Arsenius, von dem sie ausgebreitet, daß wir ihn getödtet hätten, zeigte sich noch am Leben und bewies, daß sie Verleumder seien. Da nun die Eusebianer den Makarius nicht überführen konnten, waren sie ungehalten, weil ihnen ihre Beute entronnen war, und sie bewogen den auf ihrer Seite stehenden Comes Dionysius, nach der Mareotis zu senden, ob sie nicht etwa gegen den Priester dort Etwas ausfindig machen könnten, oder vielmehr, um nach ihrer Abreise in unserer Abwesenheit alles Beliebige anzuzetteln. Denn das war es, was ihnen am Herzen lag. Wir sagten allerdings, daß die Relse nach der Mareotis überflüssig wäre. Sie sollten nämlich keine Ausflüchte gebrauchen, als hätten sie in dem, was sie seit langer Zeit bei sich herumgetragen, noch Etwas zu ergänzen, und sollten keinen Aufschub suchen. Denn was sie vorbringen zu können glaubten, hätten sie vorgebracht, und nun gebrauchten sie aus Verlegenheit Ausflüchte. Oder wenn sie die Mareotis noch brauchten, so sollten sie keine verdächtigen Männer schicken. Der Comes stimmte mir in Betreff der verdächtigen Männer bei. Sie aber haben Alles eher als Dieß gethan. Denn die wir wegen der arianischen Häresie ablehnten, gingen schnell fort, Diognius, Maris, Theodor, Macedonius, Ursacius, Valens. Dann wieder ein Schreiben an den Eparchen von Ägypten und militärische Bedeckung. Das Auffallendste aber, und was den höchsten Verdacht erregen mußte, war, daß sie den angeklagten Makarius unter militärischer Bedeckung zurückließen, den Kläger aber mit sich fortnahmen. Wer erkennt nun hieraus das Intriguenspiel nicht? Wer nimmt nicht deutlich die Schlechtigkeit der Eusebianer wahr? Wenn es nämlich in der Mareotis zu einem Richterspruch kommen sollte, so hätte auch der Angeklagte abgesendet werden sollen. Wenn sie aber nicht wegen eines Richterspruches abgingen, warum nahmen sie den Kläger mit? Denn es hätte genügt, wenn er keinen Beweis führen konnte. Sie haben Dieß eben gethan, damit sie, weil sie den Priester in seiner Gegenwart nicht hatten überführen können, gegen den Abwesenden intriguiren und alles Beliebige gegen ihn in Bewegung setzen könnten. Denn auch den Priestern in Alexandria und in dessen ganzer Umgebung, die darüber ihre Mißbilligung aussprachen, daß sie allein erschienen wären, und die das Gesuch stellten, daß auch sie bei ihren Verhandlungen erscheinen dürften, — denn sie hätten, sagten sie, Kenntniß von der Sache und von den Vorgängen mit dem vielgenannten Ischyras, — gestatteten sie das nicht. Vielmehr untersuchten sie in Begleitung des abgefallenen Eparchen von Ägypten, Philagrius, und heidnischer Soldaten, was nicht einmal den Katechumenen zu schauen erlaubt war. Die Kleriker aber ließen sie nicht zu, damit sie nicht auch dort, wie in Tyrus, Leute fänden, die sie überführten.</p>
      <h2>73</h2><p>Aber selbst auf diese Weise konnten sie sich nicht in der Verborgenheit halten. Denn als die Priester der Stadt und von der Mareotis ihre Ränke erfuhren, schrieben und bezeugten sie Folgendes:</p><p><em>An Theognius, Maris, Macedonius,Theodor, Ursacius und Valens, die Bischöfe, die von Tyrus gekommen sind, die Priester und Diakonen der katholischen Kirche in Alexandria unter dem ehrwürdigsten Bischof Athanasius.</em></p><p>Es hätte sich geziemt, daß ihr, als ihr hieher ginget und den Kläger mit euch führtet, auch den Priester Makarius mit euch gebracht hättet. Denn so werden die gerichtlichen Verhandlungen nach der heiligen Schrift eingerichtet, daß der Kläger mit dem Angeklagten erscheint. Da ihr aber weder den Makarius gebracht habt, noch unser ehrwürdigster Bischof Athanasius mit euch gekommen ist, so haben wir das Gesuch gestellt, es möchten wenigstens wir bei der gerichtlichen Verhandlung anwesend sein dürfen, damit die Untersuchung durch unsere Gegenwart an Sicherheit gewänne und auch wir uns überzeugen könnten. Da ihr aber das nicht zugegeben habt, sondern allein in Verbindung mit dem Eparchen von Ägypten und dem Ankläger thun wolltet, was euch beliebte, so bekennen wir, daß wir in der Sache einen schlimmen Verdacht schöpften und auf den Gedanken kamen, daß euere Ankunft nur auf Intrigue und Verfolgung abzielt. Deßhalb übergeben wir euch diesen Brief, der einer wahren Synode zum Zeugniß dienen soll, damit Alle erkennen, daß ihr unter einseitigem Vorgehen thatet, was euch beliebte, und daß ihr nur gegen uns intriguiren wolltet. Wir haben das gleiche Schreiben auch dem Palladius, dem Curiosus des Kaisers, übergeben, damit es nicht von euch geheim gehalten werde. Denn was ihr gethan habt, läßt uns ja so Etwas von euch argwöhnen und muthmaßen.</p><p>Ich Priester Dionysius habe Dieß übergeben. Priester Alexander, Priester Nilaras, Priester Longus, Priester Aphthonius, Priester Athanasius, Priester Amyntius, Priester Pistus, Priester Plution, Priester Dioskorus, Priester Apollonius, Priester Sarapion, Priester Ammonius, Priester Cajus, Priester Rhinus, Priester Äthales.</p><p>Diakonen: Diakon Marcellinus, Diakon Appianus, Diakon Theon, Diakon Timotheus und ein zweiter Diakon Timotheus.</p>
      <h2>74</h2><p>So lautet also das Schreiben der Kleriker aus der Stadt mit ihren Namen. Der Brief aber, den die Kleriker aus der Mareotis schrieben, welche die Lebensweise des Anklägers kannten und mich auf der Rundreise begleiteten, lautet, wie folgt:</p><p><em>Der heiligen Synode der seligen Bischöfe der katholischen Kirche alle Priester und Diakonen in der Mareotis Gruß im Herrn.</em></p><p>Indem wir die Worte der Schrift kennen: „Was deine Augen sahen, das rede,“ und: „Ein falscher Zeuge wird nicht ohne Strafe bleiben,“ bezeugen wir, was wir gesehen haben, zumal da dieß Zeugniß die gegen den Bischof Athanasius gesponnenen Intriguen uns abnöthigten. Denn es nimmt uns Wunder, daß Ischyras überhaupt nach dem Maßstab der Kirche gemessen wurde, und davon glauben wir zuerst reden zu müssen. Ischyras ist niemals Diener der Kirche gewesen. Er nannte sich wohl vordem einen Priester des Kolluthus, aber Niemand glaubte es ihm mit Ausnahme seiner Verwandten. Denn er hatte weder jemals eine Kirche, noch wurde er überhaupt jemals in der nächsten Umgebung seines Dorfes von Jemand als Priester angesehen, ausser, wie gesagt, von seinen Verwandten. Aber da er sich einmal diesen Namen beilegte, so wurde er auf der in Alexandria versammelten Synode in Gegenwart unsers Vaters Hosius abgesetzt und unter die Laien versetzt, und diese Stellung behielt er in der Folge bei, und man war von dem falschen Glauben an seine Priesterwürde abgekommen. Wir halten es für überflüssig, von seinen Sitten zu reden, da Jedermann von denselben sich Kenntniß verschaffen kann. Da er aber unsern Bischof Athanasius wegen der Zerbrechung eines Kelches und Tisches verleumdet hat, so sind wir genöthigt, auch hierüber euch Aufschluß zu geben. Wir haben schon im Vorhergehenden gesagt, daß er niemals in der Mareotis eine Kirche hatte. So sei auch Gott unser Zeuge, daß von unserm Bischof kein Kelch zerbrochen und kein Tisch umgestürzt wurde, noch auch von irgend einem Andern aus seiner Begleitung. Vielmehr ist Alles, was man gesagt hat, Verleumdung. Das können wir sagen, da wir in der Nähe des Bischofs waren; denn wir begleiten ihn alle, wenn er in der Mareotis eine Rundreise macht, und er macht die Rundreise niemals allein, sondern er wird von uns Priestern und Diakonen insgesammt und einer ziemlichen Anzahl von Laien begleitet. Darum können wir auch, da wir während der ganzen Rundreise, die er bei uns gemacht hat, in seiner Begleitung uns befanden, Dieß sagen und bezeugen, daß weder ein Kelch zerbrochen worden ist, noch ein Tisch umgestürzt wurde, sondern daß er in Allem lügt, wie er selbst in einem eigenhändigen Schreiben bezeugt. Denn da er, nachdem er zu den Melitianern abgefallen war und bereits diese Aussagen gegen unsern Bischof Athanasius gemacht hatte, wieder in die Kirchengemeinschaft aufgenommen werden wollte, nahmen sie ihn nicht auf, obschon er in einem eigenhändigen Schreiben eingestand, daß hievon Nichts geschehen, sondern daß er von gewissen Leuten angestiftet worden sei, Dieß zu sagen.</p>
      <h2>75</h2><p>Als daher Theognius, Theodor, Maris, Macedonius, Ursacius und Valens nach der Mareotis kamen und nichts Wahres fanden, sondern die Sache ans Licht zu kommen drohte, daß sie gegen unsern Bischof Athanasius Intriguen gesponnen hätten, so ließen Theognius und seine Begleiter als Feinde seine Verwandten und einige Ariomaniten aussagen, was ihnen beliebte. Denn Niemand aus dem Volke hat sich ungünstig über den Bischof ausgesprochen, sondern sie selbst haben in Folge der Furcht vor Philagrius, dem Eparchen von Ägypten, so wie der Drohungen und des Schutzes der Ariomaniten gethan, was ihnen beliebte. Denn als wir kamen, die Verleumdung nachzuweisen, gestatteten sie uns keinen Zutritt. Vielmehr wiesen sie uns zurück; die sie aber zu ihren Ränken brauchen konnten, nahmen sie an und zogen sie durch die Furcht vor dem Eparchen Philagrius auf ihre Seite, wegen dessen sie uns nicht einmal zu erscheinen gestatteten, damit wir wenigstens die von ihnen vorgeschlagenen Zeugen hätten prüfen können, ob sie der Kirche angehören oder Ariomaniten sind. Es wißt aber auch ihr, geliebte Väter, daß ihr uns lehret, es habe das Zeugniß der Feinde keine Kraft. Daß wir aber die Wahrheit sagen, bezeugt die Handschrift des Ischyras, bezeugen die Thatsachen selbst, weil sie, während uns nicht bekannt war, daß so Etwas geschehen sei, den Philagrius mit sich nahmen, um durch die Furcht vor dem Schwerte und durch ihre Drohungen alle beliebigen Ränke zu schmieden. Dieß bezeugen wir vor Gott. Dieß sagen wir aus, indem wir wohl wissen, daß wir vor dem Richterstuhl Gottes werden erscheinen müssen, indem wir wohl alle zu euch zu kommen wünschten, uns aber mit der Absendung einer Deputation begnügen müssen. So möge denn das Schreiben die Stelle der Abwesenden vertreten.</p><p>Ich Priester Ingenius wünsche euch Wohlergehen im Herrn, geliebte Väter, Priester Theon, Priester Ammonas, Priester Heraklius, Priester Bokko, Priester Trypho, Priester Petrus, Priester Hierax, Priester Sarapion, Priester Markus, Priester Ptollarion, Priester Cajus, Priester Dioskorus, Priester Demetrius, Priester Thyrsus.</p><p>Diakonen: Diakon Pistus, Diaton Apollos, Diakon Serras, Diakon Pistus, Diakon Polynikus, Diakon Ammonius, Diakon Maurus, Diakon Hephästus, Diakon Apollos, Diakon Metopas, Diakon Apollos, Diakon Serapas, Diakon Meliphthongus, Diakon Lucius, Diakon Gregoras.</p><p><em>Die Nämlichen an den Curiosus und an Philagrius, der damals Eparch von Ägypten hieß.</em></p><p>Dem Flavius Philagrius und Flavius Palladius, dem Ducenarius Palatinus, dem Curiosus, dem Flavius Antonius, dem Proviantmeister, dem Centenarius meiner Herrn, der erlauchtesten Eparchen des heiligen Prätoriums, übergeben wir Dieß von den Priestern und Diakonen in der Mareotis, einem Nomos der katholischen Kirche, die unter dem ehrwürdigsten Bischof Athanasius steht, und geben Zeugniß durch die beigefügten Unterschriften.</p>
      <h2>76</h2><p>Theognius, Maris, Macedonius, Theodor, Ursacius uud Valens, als Abgesandte sämmtlicher in Tyrus versammelten Bischöfe, kamen in unsere Diöcese und sagten, sie hätten Auftrag erhalten, gewisse kirchliche Angelegenheiten zu untersuchen, wobei sie auch von einem zerbrochenen Kelche des Herrn sprachen, von dem ihnen Ischyras Mittheliung gemacht hatte, den sie mit sich führten, der sich für einen Priester ausgibt, aber kein Priester ist. Denn er wurde von dem Priester Kolluthus geweiht, der sich die bischöfliche Würde anmaßte und später von der gemeinsamen Synode des Hosius und der mit ihm vereinigten Bischöfe wieder in die Stellung eines Priesters versetzt wurde, wie er es zuvor war. Dem zufolge wurden alle von Kolluthus Geweihten wieder in den nämlichen Rang versetzt, den sie zuvor eingenommen hatten, so daß auch Ischyras wieder als Laie galt. Und die Kirche, die er zu haben vorgibt, war nie eine Kirche, sondern ein kleines Wohnhaus eines Waisenknaben, Namens Ision. Und deßhalb nun legen wir dieses Zeugniß ab und beschwören dich bei dem allmächtigen Gotte und bei unsern Gebietern, dem Kaiser Constantin und seinen Söhnen, den erlauchtesten Cäsaren, daß du eben Dieß ihrer Frömmigkeit zu wissen machest. Denn er ist weder ein Priester der katholischen Kirche, noch hat er eine Kirche, noch wurde jemals ein Kelch zerbrochen, sondern Das alles lügt und erfindet er. Unter dem Consulate des Julius Constantius, des erlauchtesten Patriciers, des Bruders des gottesfürchtigen Kaisers Constantin Augustus, und des Rufinus Albinus, der erlauchtesten Männer, am zehnten Thoth (7. Sept.). So viel die Priester.</p>
      <h2>77</h2><p>Was aber die Bischöfe, die mit uns nach Tyrus gegangen waren, als sie ihre Ränke und Anschläge wahrnahmen, schrieben und bezeugten, ist Folgendes:</p><p><em>Den in Tyrus versammelten Bischöfen, den hochgeehrten Herren, die Bischöfe der katholischen Kirche, die aus Ägypten mit Athanasius gekommen sind, Gruß im Herrn.</em></p><p>Wir glauben, daß die von Eusebius, Theognius, Maris, Narcissus, Theodor und Patrophilus gegen uns geschmiedeten Ränke nicht mehr unbekannt seien. Denn schon Anfangs protestirten wir insgesammt durch unsern Amtsgenossen Athanasius dagegen, daß in ihrer Gegenwart das Verhör stattfinde. Denn wir wußten, daß die Gegenwart eines einzigen Feindes, geschweige denn die Gegenwart vieler, das Verhör verwirren und beeinflussen könne. Auch ihr selbst kennt nun ihre Feindschaft, die sie nicht nur auf uns, sondern auf alle Rechtgläubigen geworfen haben, da sie wegen der Wuth des Arius und wegen seiner gottlosen Lehre auf Alle losstürzen und gegen Alle Ränke schmieden. Da wir aber im Vertrauen auf die Wahrheit die von den Melitianern gegen die Kirche geschmiedeten Ränke nachweisen wollten, so wissen wir nicht, warum die Eusebianer gegen unsere Aussagen Wirren zu stiften suchten und sich gar sehr bemühten, unsere Aussagen sich vom Halse zu schaffen, indem sie den redlichen Richtern drohten, Andere mißhandelten, nur um an uns ihre Absicht zu erreichen; und vielleicht kannte, hochgeehrte Herren, euere gottergebene Gewissenhaftigkeit die von ihnen geschmiedeten Ränke nicht. Jetzt aber, glauben wir, sind sie ans Licht gekommen. Denn sieh, deutlich haben sie selbst ihre Ränke verrathen. Denn sie wollten aus ihrer Mitte verdächtige Männer nach der Mareotis schicken, um, während wir abwesend waren und hier zurückblieben, das Volk in Verwirrung zu bringen und alles Beliebige durchzusetzen. Denn sie sahen, daß die Ariomaniten, Kolluthianer und Melitianer Feinde der katholischen Kirche sind. Deßhalb drangen sie darauf, daß diese abgesendet würden, damit sie, wenn die Feinde anwesend wären, alles Beliebige gegen uns anzetteln könnten. Denn die hiesigen Melitianer sendeten Einige aus ihrer Mitte ab, und vor vier Tagen ließen sie, da sie wußten, daß diese Untersuchung vor sich gehen würde, Abends berittene Couriere abgehen, um Melitianer aus Ägypten nach der Mareotis zu bringen, weil sich daselbst kein einziger befand, sowie Kolluthianer und Ariomaniten aus andern Gegenden, und sie aufzufordern, gegen uns Ränke zu schmieden. Denn auch euch ist ja bekannt, daß Ichyras selbst in euerer Gegenwart eingestand, daß nur sieben Personen mit ihm Gemeinschaft hätten. Da wir also, nachdem sie alles Beliebige angeordnet und verdächtige Leute abgesendet hatten, vernahmen, daß sie zu Jedem von euch kommen und zur Unterschrift auffordern, damit es den Anschein gewinne, als wäre es nach eurem einstimmigen Beschluß geschehen, so fühlten wir uns deßhalb gedrängt, an euch zu schreiben und euch dieses Zeugnlß zu übergeben. Wir bezeugen also, daß sie gegen uns intriguiren, und daß wir von ihnen und durch sie Verfolgung zu leiden haben, und wir bitten euch, daß ihr, indem ihr die Furcht Gottes im Auge behaltet und erwäget, daß sie ohne uns schickten, welche ihnen beliebten, nicht unterschreibet, damit sie nicht vorgeben, als ob das, was sie auf eigene Faust anspinnen, von euch ausgehe. Denn für Christen geziemt es sich, nicht auf das Menschliche zu schauen und die Wahrheit Allem vorzuziehen. Fürchtet daher weder eine Drohung, wie sie solche gegen Alle ausstoßen, noch eine Intrigue, sondern vielmehr Gott. Denn wenn es überhaupt angezeigt gewesen wäre, Gesandte in die Mareotis zu schicken, so hätten auch wir dabei sein sollen, um die Feinde der Kirche zu überführen und die Fremden zu bezeichnen, damit eine gewissenhafte Untersuchung der Sache geführt worden wäre. Denn ihr wißt, daß die Eusebianer in Taschenspielermanier einen Brief übergeben ließen, wie wenn er von den Kolluthianern, Melitianern und Arianern käme, der gegen uns geschrieben war, und es ist offenbar, daß gerade die Feinde der katholischen Kirche über uns nichts Wahres, sondern Alles zu unserm Nachtheil aussagen. Das Gesetz Gottes aber will weder, daß ein Feind Zeuge, noch daß er Richter sei. Im Übrigen nehmt dieses Zeugniß hin im Bewußtsein, daß ihr am Tage des Gerichtes Rechenschaft geben werdet, und indem ihr die gegen uns geschmiedeten Ränke merket, nehmt euch in Acht, auch wenn ihr aufgefordert werdet, Etwas gegen uns zu thun und die Pläne der Eusebianer zu unterstützen. Denn ihr wißt ja, wie gesagt, daß sie unsere Feinde sind, und warum Eusebius von Cäsarea im vorigen Jahre unser Feind geworden ist. Wir wünschen euch Wohlergehen, heißgeliebte Herren!</p><p><em>An Flavius Dionysius, den erlauchtesten Comes, die Bischöfe der katholischen Kirche in Ägypten, die nach Tyrus gekommen sind.</em></p>
      <h2>78</h2><p>Wir glauben, daß die von Eusebius, Theognius, Maris, Narcissus, Theodor und Patrophilus gegen uns geschmiedeten Ränke nicht mehr unbekannt seien. Denn schon Anfangs protestirten wir insgesammt durch unsern Amtsgenossen Athanasius dagegen, daß in ihrer Gegenwart das Verhör stattfinde. Denn wir wußten, daß auch die Anwesenheit eines einzigen Feindes, geschweige denn vieler, das Verhör verwirren und beeinflussen könne. Denn offenkundig ist ihre Feindschaft, die sie nicht nur auf uns, sondern auf alle Rechtgläubigen geworfen haben, da sie auf Alle losstürzen und gegen Alle Ränke schmieden. Da wir aber im Vertrauen auf die Wahrheit die von den Melitianern gegen die Kirche geschmiedeten Ränke nachweisen wollen, so wissen wir nicht, warum die Eusebianer gegen unsere Aussagen Wirren zu stiften suchten und sich gar sehr bemühten, unsere Aussagen sich vom Halse zu schaffen, indem sie den redlichen Richtern drohten, andere mißhandelten, nur um an uns ihre Absicht zu erreichen; und vielleicht kannte deine Güte die gegen uns geschmiedeten Ränke nicht. Jetzt aber, glauben wir, sind sie ans Licht gekommen. Denn sieh, deutlich haben sie selbst ihre Ränke verrathen. Denn sie wollten aus ihrer Mitte verdächtige Männer nach der Mareotis schicken, um, während wir abwesend waren und hier zurückblieben, das Volk in Verwirrung zu bringen und alles Beliebige durchzusetzen. Denn da sie wußten, daß die Ariomaniten, Kolluthianer und Melitianer Feinde der Kirche sind, so drangen sie deßhalb darauf, daß diese abgesendet würden, damit sie, wenn die Feinde anwesend wären, alles Beliebige gegen uns anzetteln könnten. Denn die hiesigen Melitianer sendeten bereits Einige aus ihrer Mitte ab, und vor vier Tagen ließen sie, da sie wußten, daß diese Untersuchung vor sich gehen würde, Abends zwei berittene Couriere abgehen, um Melitianer aus Ägypten nach der Mareotis zu bringen, weil sich daselbst kein einziger befand, sowie Kolluthianer und Ariomaniten aus andern Gegenden, und sie aufzufordern, gegen uns Ränke zu schmieden. Es ist ja deiner Güte bekannt, daß er selbst in deiner Gegenwart eingestand, daß nur sieben Personen mit ihm Gemeinschaft hätten. Da wir also, nachdem sie alles Beliebige angeordnet und verdächtige Leute abgesendet hatten, vernahmen, daß sie zu jedem einzelnen Bischof kommen und zur Unterschrift auffordern, damit es den Anschein gewinne, als wäre es nach ihrem einstimmigen Beschluß geschehen, so fühlten wir uns deßhalb gedrängt, an deine Durchlaucht (<em>λαμπρότητα</em> [lamprotēta]) uns zu wenden und dir dieses Zeugniß zu übergeben. Wir bezeugen also, daß sie gegen uns intriguiren, und daß wir von ihnen und durch sie Verfolgung zu leiden haben, und wir bitten dich, daß du, indem du die Furcht Gottes und die frommen Aufträge des gottesfürchtigsten Kaisers vor Augen hast, in Erwägung, daß sie ohne uns schickten, welche es ihnen zu schicken beliebte, ihnen nicht willfahrest.</p><p>Ich Bischof Adamantius habe es übergeben. Ischyras, Ammon, Petrus, Ammonian, Tyrannus, Taurinus, Sarapammon, Ailurion, Harpokration, Moses, Optatus, Anubion, Saprion, Apollonius, Ischyrion, Arbäthion, Potamon, Paphnutius, Heraklides, Theodor, Agathammon, Cajus, Pistus, Athas, Nikon, Pelagius, Theon, Paninuthus, Nonnus, Ariston, Theodorus, Irenäus, Blastammon, Philippus, Apollos, Dioskorus, Timotheus von Diospolis, Makarius, Heraklammon, Kronius, Muis, Jakobus, Ariston, Artemidor, Phinees, Psais, Heraklides.</p><p>Und noch einmal die Nämlichen.</p><p><em>An Flavius Dionysius, den erlauchtesten Comes, die aus Ägypten nach Tyrus gekommenen Bischöfe der katholischen Kirche.</em></p>
      <h2>79</h2><p>Da wir sehen, daß viele Ränke und Verfolgungen gegen uns im Gange sind, und zwar auf Anstiften des Eusebius, Narcissus, Flacillus, Theognius, Maris, Theodor, Patrophilus, die wir Anfangs ablehnen wollten, aber nicht durchdrangen, so sehen wir uns genöthigt, vorliegenden Protest einzulegen. Denn wir sehen, daß zu Gunsten der Melitianer Vieles in Bewegung gesetzt und die katholische Kirche in Ägypten unsertwegen verfolgt werde. Deßhalb übergeben wir dir diesen Brief und bitten dich, du mögest den allmächtigen Gott vor Augen haben, der die Herrschaft des frömmsten und gottesfürchtigsten Kaisers Constantin aufrecht hält, und die Vernehmung unserer Sache dem gottesfürchtigsten Kaiser selbst vorbehalten. Denn es ist naturgemäß, daß du, da du der Abgesandte seiner kaiserlichen Macht bist, wenn wir an seine Gottesfurcht appelliren, die Sache ihm vorbehältst. Denn die Ränke und Verfolgungen der genannten Eusebianer werden uns unerträglich, und deßhalb bitten wir, es möge die Sache dem gottesfürchtigsten und frömmsten Kaiser vorbehalten werden, bei dem wir unser und der Kirche Recht auseinandersetzen können. Denn wir vertrauen, daß seine Gottesfurcht, wenn sie uns vernimmt, uns nicht verurtheilen wird. Daher beschwören wir dich nochmals bei dem allmächtigen Gotte, sowie bei dem gottesfürchtigsten Kaiser, der noch viele Jahre hindurch siegreich und gesund leben möge mit den Söhnen seiner Gottesfurcht, du mögest weiter Nichts thun und dir nicht erlauben, in der Synode in unserer Angelegenheit Etwas zu unternehmen, sondern die Vernehmung seiner Gottesfurcht vorbehalten. Das Nämliche haben wir meinen Herrn, den rechtgläubigen Bischöfen, mitgetheilt.</p>
      <h2>80</h2><p>Als Alexander, Bischof von Thessalonich, Dieß erfuhr, schrieb er Folgendes an den Comes Dionysius:</p><p><em>An meinen Herrn Dionysius Alexander, Bischof.</em></p><p>Ich sehe deutlich, daß gegen Athanasius Ränke geschmiedet worden sind. Denn es beliebte ihnen in unbegreiflicher Weise, Alle, welche er ablehnte, abzusenden, ohne uns auch nur eine Mittheilung zu machen. Denn es war beschlossen worden, gemeinsam zu berathen, welche abgesendet werden sollen. Ertheile also den Rath, daß keine Unbesonnenheit begangen werde, — denn sie sind in großer Aufregung zu mir gekommen und sagten, die wilden Thiere seien schon voll Feuer und in Begriff auf sie loszugehen, weil nämlich das Gerücht zu ihnen gedrungen war, daß Johannes Einige abgesendet habe, — und daß sie nicht im Voraus alle beliebigen Intriguen spielen. Denn du weißt, daß sowohl die Kolluthianer als auch die Arianer und Melitianer Feinde der Kirche sind und, wenn diese alle miteinander übereinstimmen, sie der Kirche große Übel zufügen können. Erwäge also, was nützlich ist, damit kein Unglück geschehe und uns nicht die Beschuldigung treffe, als hätten wir nicht gerecht gerichtet. Jene hat man vorzugsweise in Verdacht, sie möchten durch die Kirchen, deren Bischöfe hier sind, ihren Weg nehmen, sie in Schrecken setzen und ganz Ägypten verwirren, da sie den Melitianern ergeben sind. Denn sie sehen Das größtentheils jetzt schon vor sich gehen.</p><p>Darauf richtete der Comes Dionysius an die Eusebianer folgendes Schreiben:</p>
      <h2>81</h2><p>Das war es, worüber ich mit meinem Herrn Flacillus sprach, daß Athanasius Beschwerde führte und sagte, daß die abgesendet würden, die er abgelehnt habe, und über erlittenes Unrecht und Rechtsverkümmerung schrie. Das hat mir auch Alexander, der Herr meiner Seele, geschrieben, und damit ihr einsehet, daß das, was mir von seiner Güte geschrieben wurde, vernünftig sei, habe ich es beigelegt, damit ihr es lesen könnet. Denn ihr erinnert euch dessen, was ich früher schrieb. Ich schrieb nämlich an euere Güte, o Herren, daß die Abgesandten nach gemeinsamem Urtheil und Beschluß abgesendet werden sollen. Seht also zu, daß das, was geschieht, keine Schuld mit sich führe, und daß wir denen, die uns anschuldigen wollen, keine Veranlassung zu gerechtem Tadel geben. Denn wie der Partei der Kläger nicht wehe geschehen soll, so auch nicht der der Angeklagten. Ich glaube aber, daß es keine geringe Veranlassung zum Tadel gegen uns sei, wenn es den Anschein gewinnt, daß mein Herr Alexander mit dem, was vorgeht, nicht übereinstimmt.</p>
      <h2>82</h2><p>Als Dieß in dieser Weise vor sich ging, zogen wir uns von ihnen zurück als vor einer Synode der Abtrünnigen. Denn sie thaten, was sie wollten. Daß aber das, was unter einseitigem Vorgehen geschieht, keine Kraft hat, ist Jedermann bekannt. Denn Dieß befiehlt das göttliche Gesetz, das verlangte auch der selige Apostel, der, als er eine ähnliche Verfolgung erlitt, vor dem Richter sagte: „Es hätten die Juden aus Asien vor dir erscheinen und Klage stellen sollen, wenn sie Etwas vorzubringen hatten,“ bei welcher Gelegenheit auch Festus, als die Juden eine ähnliche Verfolgung bereiten wollten, wie diese jetzt gegen mich unternommen haben, sagte: „Es ist nicht Sitte bei den Römern, aus Gefälligkeit einen Menschen auszuliefern, bevor die Ankläger dem Angeklagten vorgeführt wurden und er Gelegenheit fand, sich gegen die Anklage zu vertheidigen.“ Aber die Eusebianer erkühnten sich, auch das Gesetz zu umgehen, und haben die Ungerechten an Ungerechtigkeit übertroffen. Denn sie handelten von Anfang an nicht für sich allein. Als sie aber in unserer Gegenwart Nichts ausrichten konnten, da gingen sie endlich wie die Juden fort und hielten für sich allein Rath, um uns zu verderben und der Häresie Eingang zu verschaffen, wie jene den Barabbas losbaten. Denn daß sie deßwegen Das alles gethan haben, haben sie selbst zugestanden.</p>
      <h2>83</h2><p>Und wenn das auch zur vollständigen Rechtfertigung genügt, so fällt es, um ihre Bosheit und die Freiheit der Wahrheit noch mehr zu beweisen, gleichwohl nicht lästig, ferners in Erinnerung zu bringen und zu zeigen, daß sie in Widerspruch mit sich selbst handelten und, indem sie im Dunkel rathschlagten, auf ihre eigenen Leute stießen und, indem sie uns tödten wollten, gleich Rasenden sich selbst verwundeten. Denn als sie wegen der Geheimnisse nachforschten, wendeten sie sich an Juden und fragten bei Katechumenen: Wo waret ihr, als Makarius kam und den Tisch umstürzte? Und diese antworteten: Wir waren drinnen. Es fand also kein Opfer statt, wenn die Katechumenen drinnen waren. Da sie ferner überallhin geschrieben hatten, daß Makarius, während der Priester stand und opferte, gekommen sei und Alles umgestürzt habe, fragten sie, welche es ihnen zu fragen beliebte: Wo war Ischyras, als Makarius erschien? Und diese erwiderten, daß er in einer Kammer krank darnieder lag. Es stand also der nicht, welcher lag, und es opferte der nicht, der in einer Kammer krank darniederlag. Da ausserdem Ischyras sagte, es seien von Makarius Bücher verbrannt worden, behaupteten die beigebrachten Zeugen, daß nichts Solches geschehen sei, sondern daß Ischyras lüge. Und sonderbar, obschon sie wieder überallhin geschrieben hatten, wir hätten die, welche Zeugniß ablegen konnten, auf die Seite geschafft, stellten sie an dieselben vor aller Welt Fragen und schämten sich nicht, wenn sie sahen, daß von allen Seiten an den Tag trete, daß sie Verleumder seien und Das alles für sich allein ins Werk setzten, wie es ihnen beliebte. Denn sie winkten den Zeugen, der Eparch drohte, die Soldaten führten Hiebe, der Herr aber enthüllte die Wahrheit und bewies, daß sie Verleumder seien. Deßhalb hielten sie auch die Akten geheim, und da sie selbst in deren Besitz waren, befahlen sie den Schreibern, sie zu verstecken und ganz und gar Niemandem mitzutheilen. Aber sie gingen auch hierin irre. Denn der sie schrieb, ist Rufus, der jetzige Speculator in Augustaliane, und er kann Zeugniß geben. Die Eusebianer aber schickten sie durch die Ihrigen nach Rom, und der Bischof Julius schickte sie mir zu. Und sie geberden sich jetzt wie Wahnsinnige, daß in den Besitz dessen, was sie geheim halten wollten, wir gelangten und es lasen.</p>
      <h2>84</h2><p>Indem sie Dieß und Ähnliches trieben, verriethen sie auch bald die Ursache, warum sie das thaten. Denn sie gingen fort und führten die Arianer mit sich nach Jerusalem und nahmen sie dort in die Gemeinschaft auf, indem sie in Betreff derselben einen Brief schrieben, von dem ein Theil von Anfang an also lautet</p><p><em>Die heilige Synode, die in Jerusalem durch die Gnade Gottes versammelt ist, der Kirche Gottes in Alexandria und den Bischöfen, Priestern und Diakonen in ganz Ägypten, Thebais, Libyen, Pentapolis und auf dem ganzen Erdkreis Gruß im Herrn.</em></p><p>„Uns allen, die wir aus den verschiedenen Eparchieen an dem nämlichen Orte zur großen Festversammlung uns eingefunden haben, die wir zur Einweihung des Martyriums des Heilandes, das durch den Eifer des gottesfürchtigen Kaisers Constantin dem König der Welt, Gott und seinem Gesalbten, errichtet worden ist, veranstaltet haben, hat die Gnade Gottes große Freude bereitet. Der gottesfürchtigste Kaiser Canstantin selbst aber mahnte uns durch ein persönliches Schreiben, was wir zu thun hätten, indem er aus der Kirche Gottes jede Mißgunst verscheuchen und allen Neid weit weg verbannen wollte, durch den die Glieder Gottes früher getrennt waren, daß wir nämlich mit einfältigem und friedfertigem Herzen die Arianer aufnehmen sollten, die seit einiger Zeit die gegen das Gute feindselige Mißgunst aus der Kirche ausgeschlossen hielt. Der gottesfürchtige Kaiser bezeugte den Männern durch seinen Brief ihre Rechtgläubigkeit, die er auf gestellte Frage durch ihr lebendiges Wort mit eigenen Ohren vernahm, ihr seinen Beifall gab und uns von derselben überzeugte. Denn er fügte das rechte Gaubensbekenntniß der Männer schriftlich seinem Briefe an.“</p>
      <h2>85</h2><p>Wer sieht nicht, wenn er Dieß vernimmt, ihre Ränke? Denn sie verbergen nicht, was sie gethan haben, oder gestehen vielmehr gegen ihren Willen die Wahrheit ein. Denn wenn ich es war, der den Arianern den Eintritt verweigerte, und sie Aufnahme fanden, als ich unter ihren Ränken zu leiden hatte, worauf anders geht das hinaus, als daß das ihretwegen geschehen ist und sie ihretwegen Alles gegen uns thaten, und daß sie sowohl die Zerbrechung des Kelches als auch die Ermordung des Arsenius erdichtet haben, um nur der Gottlosigkeit Eingang in der Kirche zu verschaffen und nicht für Häretiker zu gelten? Denn das war es, was der Kaiser auch früher mir in einem Drohbriefe schrieb. Und sie schämten sich nicht, das zu schreiben und zu behaupten, daß die die richtige Ansicht hätten, welche die ganze ökumenische Synode mit dem Anathem belegte. Und sie scheuten sich nicht, eine so große Synode, so weit es von ihnen abhing, in einer Winkelsynode kraftlos zu machen, sie, die leichthin Alles sagen und thun. Und der Lohn der Verleumdung zeigt noch mehr ihre Niedertracht und gottlose Absicht. Die Mareotis ist, wie bereits gesagt, eine alexandrinische Landschaft. Es war noch niemals in dieser Landschaft ein Bischof, noch ein Landbischof, sondern dem Bischof von Alexandria sind die Kirchen des ganzen Landes unterworfen. Die einzelnen Priester haben die eigenen großen Dörfer, der Zahl nach wohl zehn und darüber. Das Dorf aber, wo Ischyras seinen Wohnsitz hat, ist ganz klein und hat eine geringe Einwohnerzahl, so zwar, daß es dort keine Kirche gab, sondern im nächstgelegenen Dorfe. Und obschon er in diesem Dorfe nicht einmal Priester war, so beschloßen sie dennoch, gegen die alte Überlieferung ihn Bischof zu nennen, indem sie wohl selbst es für unpassend hielten, aber durch das Versprechen für die Verleumdung genöthigt sich gleichwohl auch dazu verstanden, damit nicht jener Erzbösewicht wegen erlittenen Undanks die Wahrheit aussagte und die Bosheit der Eusebianer verriethe. Es ist ausgemacht, daß er weder eine Kirche hat noch Laien ihm anhängen, sondern er vielmehr von Allen wie ein Hund verfolgt wird. Dessenungeachtet haben sie den Kaiser bewogen, an den Katholikus zu schreiben (denn es ist ihnen Alles erlaubt), es möge ihm eine Kirche verschafft werden, damit er im Besitze einer solchen Glauben fände, wenn er von einem Kelche und Altare sprach. Denn sie ließen ihn sogleich auch Bischof nennen, weil es, wenn er keine Kirche hatte und gar nicht einmal Priester war, deutlich hervorgetreten wäre, daß er ein Verleumder sei und Alles erfinde. Gewiß hilft ihm, da das Volk und selbst die Seinigen sich ihm nicht anschließen, wie der leere Name so auch der folgende Brief Nichts, den er zum Beweise für seine und der Eusebianer ganz verkehrte Richtung vorzeigt.</p><p><em>Brief des Katholikus.</em></p><p><em>Flavius Hemerius dem Exactor in der Mareotis Gruß.</em></p><p>Da der Priester Ischyras die Gottesfurcht unserer durchlauchtigsten Herren und Kaiser gebeten hat, es möge ihm an der Stelle des Friedens des Sekontarurus eine Kirche gebaut werden, so befahl ihre göttliche Würde, es möge das möglichst schnell geschehen. Sei also darauf bedacht, wenn du die Abschrift des göttlichen Schreibens, das mit der gebührenden Verehrung an erster Stelle niedergelegt ist, sowie die unter meiner geheiligten Auktorität aufgenommenen Aktenstücke empfangen hast, sie schnell zu copiren und im Archiv zu hinterlegen, damit der von göttlicher Seite gekommene Auftrag seine Erledigung finden könne.“</p>
      <h2>86</h2><p>In dieser Weise nun gingen Jene listig zu Werke und schmiedeten Ränke. Wir aber gingen zum Kaiser und entdeckten ihm die Ungerechtigkeiten der Eusebianer, da ja auch er es war, der die Abhaltung der Synode angeordnet hatte, und sein Comes dieselbe leitete. Da nun dieser mich vernommen hatte, ging es ihm zu Herzen, und er schrieb Folgendes:</p><p><em>Der siegreiche Constantin, der Größte, Erlauchteste, an die in Tyrus versammelten Bischöfe.</em></p><p>„Ich weiß nicht, was für Dinge von euerer Synode unter Lärm und Geräusch entschieden worden sind. Es scheint aber wohl durch eine gewisse geräuschvolle Unordnung die Wahrheit verkehrt worden zu sein, da ihr offenbar wegen eueres Haders mit eueren Nächsten, in dem ihr unerschütterlich beharren wollt, nicht auf das schauet, was Gott gefällt. Aber es wird ein Werk der göttlichen Vorsehung sein, die Übel solcher Zwietracht handgreiflich nachzuweisen und zu beseitigen und uns augenscheinlich zu beweisen, ob ihr bei euerer dortigen Versammlung auf die Wahrheit irgend eine Rücksicht genommen und ob ihr euere Entscheidungen ohne irgend welche Gunst und Feindschaft getroffen habt. Deßhalb will ich, daß ihr alle vor meiner Gottesfurcht schnell euch einstellet, damit ihr persönlich über euere Thaten genaue Rechenschaft gebet. Warum ich aber für gut fand, Dieß an euch zu schreiben, und euch schriftlich zu mir vorlade, werdet ihr aus Folgendem ersehen. Als ich nämlich in der nach uns genannten hochbeglückten Vaterstadt Konstantinopel mich herumtrieb, — ich befand mich aber damals zu Pferde, — da begegnete mir plötzlich mitten auf der Gasse Bischof Athanasius mit einigen Andern, die ihn begleiteten, und zwar so unvermuthet, daß ich davon nicht wenig überrascht war. Gott ist mein Zeuge, der Alles sieht, daß ich auf den ersten Anblick nicht einmal zu erkennen vermocht hätte, wer er sei, wenn nicht Einige von den Unsrigen auf unsere Anfrage, wie es zu geschehen pflegt, uns gemeldet hätten, wer er sei, und welche Ungerechtigkeit er erlitten habe. Ich unterredete mich nun in jenem Zeitpunkte weder mit ihm, noch trat ich mit ihm in irgend einen Verkehr. Als er aber um Audienz bat, wies ich ihn ab und war nahe daran, seine Entfernung zu befehlen. Da bat er mit größerem Freimuth, es möge ihm von uns weiter Nichts gewährt werden, als euere Ankunft, damit er in euerer Gegenwart über Das Beschwerde erheben könnte, was er habe erdulden müssen. Da mir das vernünftig und zweckdienlich zu sein schien, so ließ ich bereitwillig Dieß an euch schreiben, damit ihr alle, die ihr bei der in Tyrus gehaltenen Synode versammelt waret, unverzüglich ins Lager meiner Milde euch verfüget, um aus den Thaten selbst die Gewissenhaftigkeit und Unbestechlichkeit bei euerem Richterspruche zu beweisen, in meiner Gegenwart nämlich, da wohl auch ihr nicht in Abrede stellen dürftet, daß ich ein wahrer Diener Gottes bin. Es wird daher durch meine Gottesverehrung überall Friede gestiftet und selbst bei den Barbaren der Name Gottes in geeigneter Weise gepriesen, die bisher die Wahrheit nicht kannten. Offenbar aber kennt der, dem die Wahrheit unbekannt ist, auch Gott nicht. Es haben aber auch, wie gesagt, jetzt durch mich, den wahren Diener Gottes, die Barbaren Gott kennen und verehren gelernt, da sie an den Thaten selbst wahrnahmen, daß er überall für mich kämpfe und sorge. Dadurch ist ihnen zumeist Gott bekannt geworden, den sie aus Furcht vor uns verehren. Wir aber, die wir die heiligen Geheimnisse seiner Güte an uns zu tragen scheinen, denn ich möchte nicht sagen, daß wir sie bewahren, wir, sage ich, thun Nichts, als was auf Zwietracht und Haß abzielt und, um es gerade herauszusagen, auf den Untergang des menschlichen Geschlechtes hinarbeitet. Beeilet euch also, wie gesagt, und kommt alle möglichst schnell zu uns. Ihr könnt überzeugt sein, daß ich meine ganze Kraft einsetzen werde, um es dahin zu bringen, daß im Gesetze Gottes vorzugsweise das unversehrt erhalten bleibe, was weder einem Tadel noch einem üblen Rufe je ausgesetzt sein kann, wenn nämlich die Feinde des Gesetzes beseitigt, von Grund aus zermalmt und ganz und gar vernichtet sind, die unter dem Scheine des heiligen Namens mannigfaltige und verschiedene Lästerungen vorbringen.“</p>
      <h2>87</h2><p>[Forts. v. ] Die Eusebianer, die hievon in Kenntniß gesetzt wurden, und die nebenbei wußten, was sie gethan hatten, hielten die übrigen Bischöfe von der Reise ab, und nur solche von ihrer Partei, nämlich Eusebius, Theognius, Patrophilus, ein zweiter Eusebius, Ursacius und Valens reisten hin und sprachen nicht mehr von einem Kelche und von Arsenius, denn sie hatten hiezu nicht mehr den Muth. Dagegen erfanden sie eine andere Anklage, die den Kaiser berührte. Sie sagten nämlich dem Kaiser selbst: Athanasius drohte, das Getreide, das von Alexandria nach deiner Vaterstadt gesendet wird, aufhalten zu wollen. Das vernahmen die anwesenden Bischöfe Adamantus, Anubion, Agathammon, Arbethion und Petrus. Auch die Erbitterung des Kaisers bestätigte es. Denn er, der den angeführten Brief geschrieben und ihrer Ungerechtigkeit das Urtheil gesprochen hatte, gerieth, als er diese Verleumdung vernahm, sogleich in Zorn und sendete uns, statt uns zu vernehmen, nach Gallien. Aber auch das beweist noch mehr ihre Schlechtigkeit. Denn der selige Constantin der Jüngere schrieb, als er uns in die Heimath sendete und an das Schreiben seines Vaters sich erinnerte, gleichfalls folgenden Brief.</p><p><em>Kaiser Constantin an das Volk der katholischen Kirche in der Stadt Alexandria.</em></p><p>„Ich glaube nicht, daß es euerer heiligen Einsicht unbekannt geblieben ist, daß Athanasius, der Verkünder des anbetungswürdigen Gesetzes, deßhalb auf eine Zeit lang nach Gallien gesendet worden sei, damit er, da von der Grausamkeit seiner blutgierigen und erbitterten Feinde seinem heiligen Haupte Gefahr drohte, nicht von der Verkehrtheit der Bösewichte Unsägliches zu leiden hätte. Um nun dieser auszuweichen, wurde er dem Rachen der ihn bedrängenden Männer entrissen und ihm der Auftrag ertheilt, im Gebiete meiner Herrschaft sich aufzuhalten, so daß er in dieser Stadt, in der er lebte, an allem Nöthigen Überfluß hatte, wenn auch seine rühmliche Tugend im Vertrauen auf den göttlichen Beistand die Schläge eines harten Schicksals für Nichts achtet. Wenn nun schon unser Herr, der durchlauchtigste Constantin, mein Vater, entschlossen war, aus Rücksicht für euere geliebteste Gottesfurcht den nämlichen Bischof dem ihm zugehörigem Sitze zurückzugeben, so hielt ich es in gleicher Weise für entsprechend, da er vom menschlichen Loose vorher ereilt wurde und vor Erfüllung seines Wunsches zur Ruhe einging, das Vorhaben des Kaisers göttlichen Andenkens als Erbschaft zu übernehmen und auszuführen. Wenn ihr ihn nun wieder seht, werdet ihr erkennen, welche Ehrfurcht ich ihm zollte. Denn es ist nicht zu verwundern, wenn ich für ihn Etwas gethan habe. Denn meine Seele wurde durch die Vorstellung euerer Sehnsucht und durch die Erscheinung eines so großen Mannes hiezu bewogen und veranlaßt. Die göttliche Vorsehung möge euch bewahren, geliebte Brüder! Gegeben in Trier am fünfzehnten vor den Kalenden des Juli (17. Juni).“</p>
      <h2>88</h2><p>Da wir also aus diesem Grunde nach Gallien gesendet wurden, wer erkennt nicht wieder die Gesinnung des Kaisers und die Blutgier der Eusebianer, und daß der Kaiser Dieß gethan hat, damit sie nicht noch mehr Ränke schmiedeten? Er gab ihnen nämlich einfach nach. So also verfuhren die Eusebianer, solche Hebel setzten sie gegen uns in Bewegung. Wer möchte, wenn er Dieß wahrnimmt, nicht sagen, daß Nichts für uns aus Gunst geschehen sei, sondern daß mit Fug und Recht eine so große Menge von Bischöfen einzeln und in Gesammtheit Solches zu unserer Vertheidigung geschrieben und die Ränkesucht der Feinde verurtheilt hat? Wer sollte, wenn er Solches erwägt, nicht zugeben, daß Ursacius und Valens mit Recht sich das Urtheil sprachen und aus Reue Solches zu ihrer Verurtheilung schrieben, indem sie lieber auf kurze Zeit beschämt werden als ewig die Strafe der Verleumder leiden wollten?</p>
      <h2>89</h2><p>Deßhalb nun handelten auch unsere seligen Amtsgenossen regelrecht und in kirchlichem Geiste, als Einige unsere Sache für zweifelhaft erklärten und die günstige Entscheidung in unserer Sache gewaltsam wieder umzustoßen suchten, wenn sie da lieber Alles dulden wollten und es vorzogen in die Verbannung zu gehen, als die Entscheidungen so vieler Bischöfe umgestoßen zu sehen. Wenn nun denen gegenüber, welche gegen uns zu Rathe gingen und, was zu unsern Gunsten entschieden war, wieder umstoßen wollten, die wahren Bischöfe bei bloßen Worten stehen geblieben wären, oder wenn es die nächstbesten Männer gewesen wären und nicht die Bischöfe von hervorragenden Städten und die Häupter von so großen Kirchen, so könnte man argwöhnen, daß sie wieder aus Gunst handelten und auch jetzt von Parteigeist sich leiten ließen. Da sie aber nicht nur durch Gründe zu überzeugen suchten, sondern auch die Verbannung sich gefallen ließen, und da Liberius, der Bischof von Rom, sich darunter befindet, — denn wenn er auch nicht bis an sein Ende die Trübsal der Verbannung zu ertragen hatte, so mußte er doch, da er die gegen uns geschmiedeten Ränke wohl kannte, zwei Jahre an einem andern Wohnsitz leben, — und da sich darunter der große Hosius mit denen von Italien, Gallien, und andern von Spanien, von Ägypten, Libyen und sämmtlichen aus der Pentapolis befindet, — denn wenn er auch einige Zeit, weil er die Drohungen des Constantius fürchtete, ihnen nicht zu widersprechen schien, so beweisen doch der große Zwang und die tyrannische Gewalt des Constantius, sowie die zahlreichen Mißhandlungen und Schläge, daß er nicht, weil er uns für schuldig hielt, sondern wegen Altersschwäche, weil er die Schläge nicht ertragen konnte, ihnen auf einige Zeit nachgab, — so ist es um so mehr gerechtfertigt, daß Alle hievon überzeugt die Ungerechtigkeit und die an uns verübte Gewaltthat hassen und verabscheuen, zumal da feststeht, daß wir aus keinem andern Grunde als wegen der arianischen Gottlosigkeit Dieß erduldet haben.</p>
      <h2>90</h2><p>Wenn also Jemand in unserer Sache, sowie über die Ränkesucht der Eusebianer sich Aufschluß verschaffen will, so möge er lesen, was zu unserer Vertheidigung geschrieben wurde, und es mögen ihm nicht einer oder zwei oder drei, sondern eine so große Menge Bischöfe als Zeugen dienen. Zu Zeugen hievon möge er ferner den Liberius und Hosius mit ihren Anhängern nehmen, welche, da sie sahen, was gegen uns geschah, lieber Alles erduldeten, als daß sie der Wahrheit und der günstigen Entscheidung in unserer Sache untreu wurden. Und das haben sie in guter und heiliger Absicht gethan. Denn was Diese gelitten, zeigt den Zwang, den auch die übrigen Bischöfe gelitten haben, und es dient als Denkmal und zur Brandmarkung der arianischen Häresie und der Bosheit der Verleumder, zugleich als Richtschnur und Vorbild für die Nachkommen, für die Wahrheit bis in den Tod zu kämpfen, die arianische Häresie als christusfeindlich und als Vorläuferin des Antichrist zu verabscheuen und denen keinen Glauben zu schenken, die gegen uns zu sprechen suchen. Denn ein glaubwürdiges und hinlängliches Zeugniß ist es, daß so viele treffliche Bischöfe uns in Schutz genommen und zu unsern Gunsten gestimmt haben.</p>
