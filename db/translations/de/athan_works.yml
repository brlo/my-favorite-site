    body: |-
      <p><em>Geschichte der Arianer, BKV 1. Serie, Bd. 15, Kempten 1836.</em></p><h2>1</h2><p>Jene aber haben das, weßwegen sie diese Ränke geschmiedet hatten, nicht lange nachher vollbracht. Denn sogleich, nachdem sie ihre Nachstellungen bereitet hatten, nahmen sie den Arius in die Gemeinschaft auf. Und indem sie so viele Urtheile gegen sich gering achteten, schützten sie abermals die königliche Macht für sich vor, und scheuten sich nicht, in ihren Schreiben zu sagen: „Nachdem Athanasius gedemüthigt worden ist, hat der Neid aufgehört, lasset uns nun die Arianer aufnehmen;“ und zum Schrecken der Zuhörer setzten sie hinzu: „Denn dieses hat der König befohlen.“ Ferner schämten sie sich nicht beizufügen: „Diese Menschen denken rechtgläubig,“ und sie fürchteten sich nicht vor dem, was geschrieben steht: „Wehe euch, die ihr das Bittere süß nennet, und die Finsterniß für Licht haltet!“ Denn für die Ketzerei sind sie bereit Alles zu erdulden. Ist es also nicht auch hieraus Allen sonnenklar, daß nicht einem Urtheile der Kirche, sondern der Drohung des Königes zu Folge, einerseits wir wegen unserer Ehrfurcht vor Christo damals gelitten haben, andererseits ihr jetzt verfolget? Denn auch andern Bischöfen haben sie auf diese Weise nachgestellt, und auch gegen jene haben sie Verleumdungen ersonnen, von welchen nun die Einen in der Verbannung entschlafen und des Ruhmes des Bekenntnisses Christi theilhaftig geworden find, die Andern aber auch jetzt noch in der Verbannung leben, und nur noch muthiger gegen die Ketzerei derselben kämpfen, indem sie sagen:„Nichts wird uns scheiden von der Liebe Christi.“</p>
      <h2>2</h2><p>Aber auch hieraus kann man wieder dieselbe Ketzerei erkennen und Gründe gegen sie schöpfen. Denn wer ihr Freund und ein Genosse ihrer Gottlosigkeit ist, der wird, sollte er auch anderer Verbrechen schuldig und mit tausend Anklagen belastet seyn, und sollten auch die augenscheinlichsten Beweise und Belege gegen ihn vorliegen, bei ihnen rechtschaffen, und sogleich ein Freund des Königes, weil ihn seine Gottlosigkeit empfiehlt; und nachdem er sich sehr viel Geld erworben hat, erhält er von den Richtern auch die Erlaubniß, nach Belieben zu handeln. Wer hingegen ihre Gottlosigkeit widerlegt, und Christi Sohn aufrichtig vertheidigt, der wird, wenn er auch in Allem rein, wenn er sich keiner Schuld bewußt ist, wenn er auch keinen Ankläger hat, dennoch, indem jene mancherlei Vorwände erdichten, sogleich ergriffen, und nach dem Urtheile des Königes verbannt, als wenn er der Verbrechen schuldig wäre, welche ihm jene aufbürden wollen, oder als wenn er den Kaiser geschmäht hätte, wie bei Naboth geschah. Wer aber ihre Ketzerei begünstiget, der wird aufgesucht und sogleich in die Kirche des Widerlegers derselben geschickt, und zuletzt werden Verbannungen, Mißhandlungen und alle Uebel über diejenigen verhängt, welche den Eingedrungenen nicht aufnehmen. Und was das Auffallendste ist, wen die Völker wollen und als untadelhaft kennen, diesen entsetzt der König und schickt ihn über die Grenzen; einen solchen aber, welchen sie nicht wollen und nicht kennen, schickt er aus weiter Ferne mit seinen Soldaten und Schreiben; und dann werden sie mit vieler Gewalt gezwungen, denjenigen zu hassen, welchen sie als ihren Religionslehrer und Vater lieben; jenen aber zu lieben, welchen sie nicht wollen; und dem ihre Kinder anzuvertrauen, dessen Wandel und Sitten sie nicht kennen, und von dem sie nicht wissen, wer er sey; oder eine Strafe zu erleiden, wenn sie dem Könige nicht gehorchen.</p>
      <h2>3</h2><p>Dieses verüben jetzt die Gottlosen, wie sie es schon früher verübt haben, gegen die Rechtgläubigen; wodurch sie die Beweise ihrer Bosheit und Gottlosigkeit überall bei Allen verbreiten. Denn gesetzt, sie haben den Athanasius angeklagt, was haben denn die übrigen Bischöfe verbrochen? Welche Veranlassungen gaben sie, oder welcher Arsenius wurde bei ihnen todt gefunden? Was für ein Priester Makarius, oder welcher zerbrochene Kelch fand sich bei ihnen? Welcher Meletianer spielte eine Rolle? Aber wie aus ihren Handlungen erhellet und es sich zeigt, daß ihre Aussagen gegen den Athanasius falsch sind; so erhellet auch aus ihrem Verfahren gegen den Athanasius, daß auch die Beschuldigungen wider Andere erdichtet sind. Ein großes Ungeheuer ist über die Erde ausgegangen, nämlich diese Ketzerei; denn sie verletzt nicht bloß durch Worte wie durch Zähne die Unschuldigen, sondern miethete auch um Geld die äussere Gewalt zur Nachstellung. Und das Auffallende dabei ist, daß, wie ich schon sagte, Niemand aus ihnen angeklagt, oder wenn er angeklagt wird, nicht gerichtet wird, oder daß, wenn man ihn auf den Schein zur Rede stellt, diejenigen, welche ihn überführen, verurtheilt werden, und daß demjenigen, welcher überweiset, nachgestellt, der Schuldige aber nicht einmal beschämt wird. Bei ihnen also strotzen Alle von Unflath, und ihre kataskopoi (Spione), denn episkopoi (Bischöfe) dürfen sie nicht genannt werden, sind unfläthiger, als Alle. Und wenn bei ihnen Jemand Bischof werden will, so hört er nicht die Worte: „Ein Bischof muß untadelhaft seyn;“ sondern nur: Denke feindselig gegen Christum und kümmere dich nicht um den Wandel; denn dieses ist hinreichend, um dich zu empfehlen und ein Freund des Kaisers zu werden. So viel von denen, welche mit Arius gleiche Gesinnung haben. Die Eiferer für die Wahrheit aber werden, obschon sie heilig und rein sich zeigen, wie ich oben gesagt habe, dennoch für schuldig gehalten, wenn jene es wollen, und nach ihrem Gutdünken Verbrechen ersinnen. Dieses kann man, wie ich gesagt habe, aus ihren Handlungen ersehen.</p>
      <h2>4</h2><p>Ein gewisser Eustathius war Bischof zu Antiochien, ein Bekenner und frommgläubiger Mann. Dieser wurde, weil er für die Wahrheit sehr eifrig wirkte, die arianische Ketzerei aber haßte und ihre Anhänger nicht aufnahm, bei dem Könige Constantinus verleumdet, und es wurde die Beschuldigung erdichtet, daß er dessen Mutter gelästert habe; und sogleich wurde er und mit ihm eine große Anzahl Priester und Diakonen des Landes verwiesen; diejenigen aber, welche er wegen ihrer Gottlosigkeit unter den Klerus nicht aufnahm, führten sie hierauf, nachdem der Bischof verbannt worden war, nicht nur in die Kirche ein, sondern stellten sie sogar größtentheils als Bischöfe auf, um sie zu Mitverschwornen in ihrer Gottlosigkeit zu haben. Zu diesen gehört Leontius der Verschnittene, jetzt Bischof zu Antiochien, und sein Vorfahrer Stephanus, Georgius zu Laodicea, Theodosius, weiland Bischof von Tripolis, Eudoxius zu Germanicia, und Eustathius, jetzt zu Sebaste.</p>
      <h2>5</h2><p>Blieben sie nun bei diesem stehen? Nein. Denn Eutropius, einst Bischof zu Adrianopel, ein braver und in Allem vollkommener Mann, hat, weil er den Eusebius öfter überführte und den daselbst Durchreisenden rieth, den gottlosen Worten des Eusebius nicht zu folgen, dasselbe wie Eustathius zu erdulden, und ist aus der Stadt und aus seiner Kirche vertrieben; denn Basilina ward heftig wider ihn aufgebracht. Auch Euphration von Balanea, und Cymatius von Paltus, ein anderer Cymatius von Taradus, Asklepas von Gaza, Cyrus von Beröa in Syrien, Diodorus in Asien, Domnion zu Sirmium, und Hellanicus zu Tripolis wurden, sobald man erfuhr, daß sie die Ketzerei hassen, theils wegen erdichteter Verbrechen, theils ohne solche, durch kaiserliche Schreiben versetzt, und aus der Stadt vertrieben; und anstatt ihrer wurden Andere, deren Gottlosigkeit bekannt war, in die Kirchen derselben eingesetzt.</p>
      <h2>6</h2><p>Was aber den Marcellus, Bischof von Galatien betrifft, ist es vielleicht überflüssig, eine Erwähnung zu machen; denn es weiß Jedermann, daß die Eusebianer, zuvor von ihm der Gottlosigkeit beschuldiget, dagegen auch ihn anklagten und die Verbannung des Greises bewirkten. Dieser aber reiste nach Rom, wo er sich rechtfertigte, und auf ihr Verlangen seinen Glauben schriftlich übergab, welchen auch die Synode zu Sardica guthieß. Die Eusebianer aber vertheidigten sich nicht, und schämten sich nicht, daß sie aus ihren eigenen Schriften der Gottlosigkeit überwiesen wurden; sondern sie betrugen sich vielmehr noch frecher gegen Alle. Denn sie waren bei dem Könige von den Weibern empfohlen, und Allen furchtbar. —</p>
      <h2>7</h2><p>Was aber den Paulus, Bischof von Constantinopel, betrifft, das glaube ich, wird Niemandem unbekannt seyn; denn je berühmter bie Stadt ist, desto weniger bleiben die dortigen Begebenheiten verborgen. Auch gegen diesen ward also eine Beschuldigung erdichtet. Denn sein Ankläger Macedonius, welcher ihn in unserer Gegenwart anklagte und welcher jetzt statt seiner Bischof geworden ist, stand mit ihm in Kirchengemeinschaft, und war unter demselben Paulus Priester; und doch dauerte, als Eusebius aus neidischer Begierde das Bisthum dieser Stadt an sich reißen wollte, (denn auf dieselbe Weise versetzte er sich auch von Berytus nach Nikomedien,) diese Anklage gegen den Paulus fort, und jene ließen von ihren Nachstellungen nicht ab, sondern beharrten bei ihren Verleumdungen. Zuerst wurde Paulus von Constantinus nach Pontus verwiesen; dann wurde er von Constantius, mit eisernen Ketten gefesselt, nach Singara in Mesopotamien verbannt; von dort aber wurde er nach Emesa, und viertens nach Cucusa in Cappadocien, in den Wüsten des Taurus, geschleppt, wo er, nach dem Berichte derer, welche bei ihm waren, von ihnen erdrosselt seinen Geist aufgab. Nachdem sie nun dieses verübt hatten, schämten sie sich selbst nach dem Tode nicht, denn sie reden in nichts die Wahrheit, abermals den Vorwand zu erdichten, derselbe sey an einer Krankheit gestorben, obwohl alle Bewohner jener Gegend die Sache genau wußten. Denn Philagrius, der damalige Stellvertreter des Statthalters jener Gegenden, und welcher, wie nämlich jene meinten, alle ihre Rollen spielte, ertheilte, weil er vielleicht darüber in Staunen und Trauer versetzt wurde, daß nicht er, sondern ein Anderer dieses Verbrechen verübt hätte, sehr Vielen und darunter auch einigen unserer Bekannten, ja selbst dem Bischofe Serapion die Nachricht, Paulus sey von ihnen in einen sehr engen und finstern Ort eingeschlossen worden, damit er daselbst durch Hunger umkäme; als sie aber nach sechs Tagen hineintraten, und ihn noch athmend fanden, seyen sie endlich über den Mann hergefallen und haben ihn erdrosselt, und dieses sey das Ende seines Lebens gewesen. Der Vollzieher dieses Mordes aber, sagten sie, sey gewesen der ehemalige Präfekt Philippus. Allein Gottes Gerechtigkeit ließ diese That nicht unbestraft; denn es war noch kein Jahr verflossen, als Philippus mit vieler Schande der Präfektur entsetzt wurde, so daß er als Privatmann denen, welchen er am wenigsten wollte, zum Gespötte wurde. So nun ging er, sehr betrübt, und wie Kain seufzend und bebend, und täglich erwartend, wer ihn fern von dem Vaterlande und den Seinigen durchbohren würde, gleichsam ausser sich, weil er nicht so sterben wollte, zu Grunde. Aber sie schonen diejenigen, gegen welche sie im Leben Beschuldigungen erdichteten, auch nach dem Tode nicht; denn sie suchen sich auf diese Weise Allen furchtbar zu machen, daß sie die Lebendigen aus dem Lande verweisen, und der Todten sich nicht erbarmen; ja, sie sind die einzigen unter allen Sterblichen, welche die Verstorbenen hassen und den Anverwandten derselben nachstellen, sie, die in Wahrheit Unmenschen, Hasser der Guten, und grausamer, als die unmenschlichsten Feinde, wegen ihrer Gottlosigkeit sind, indem sie nicht mit Wahrheit, sondern mit erdichteten Beschuldigungen uns und allen Uebrigen nachzustellen suchen.</p>
      <h2>8</h2><p>Da dieses die drei Brüder, Constantinus, Constantius und Constans, einsahen, ließen sie, nach dem Tode ihres Vaters, Alle in ihr Vaterland und in ihre Kirche zurückkehren; indem sie in Bezug auf die andern Bischöfe an die Kirchengemeinde eines Jeden, hinsichtlich des Athanasius aber folgendes schrieben, was wieder die hiebei eingetretene Gewaltthätigkeit beweiset, und die blutdürstige Absicht der Eusebianer darthut.</p>
      <h2>9</h2><p>Da nun die Eusebianer sahen, daß ihre Ketzerei an Macht verliere, schrieben sie nach Rom, schrieben sie auch an die Könige Constantinus und Constans gegen den Athanasius. Als aber die Abgeordneten des Athanasius die in ihren Schreiben enthaltene Unwahrheit nachwiesen, wurden jene von den Königen mit Schande abgewiesen. Der römische Bischof Julius aber schrieb, es müsse eine Synode versammelt werden, wo wir wollten; auf daß jene ihre Beschuldigungen erweisen, sich aber hinsichtlich der ihnen gemachten Anklagen ohne Scheu rechtfertigen könnten. Denn um dieses hatten auch die von ihnen gesandten Priester, da sie sich überwiesen sahen, gebeten. Nachdem nun dieses geschehen war, begaben sich jene, die in Allem mißtrauisch waren, weil sie sahen, daß sie bei dem kirchlichen Gerichte unterliegen würden, zu dem Constantius allein, und weinten bei ihm, als dem Beschützer ihrer Sekte, indem sie sagten: „Erbarme dich der Sekte; du siehst, daß von uns Alle abgefallen sind; nur in geringer Anzahl sind wir noch übrig; beginne die Verfolgung, weil wir sonst auch von den Wenigen verlassen werden und keine Anhänger haben. Denn diejenigen, welche wir nach der Verbannung jener Bischöfe durch Gewalt auf unsere Seite gebracht hatten, haben diese nach ihrer Rückkehr beredet, wider uns gesinnt zu seyn. Laß also gegen Alle ein Schreiben ergehen, und übersende es dem Philagrius, welcher zum zweiten Male Präfekt von Aegypten ist; denn dieser kann auf geeignete Weise verfolgen, wovon er schon Proben abgelegt hat, besonders da er ein Abtrünniger ist. Schicke auch den Bischof Gregorius nach Alexandrien, denn auch dieser ist im Stande, unserer Sekte Ansehen zu verschaffen.</p>
      <h2>10</h2><p>Constantius ließ demnach damals ein Schreiben ergehen, verfolgte Alle, und sendete den Präfekten Philagrius, und einen gewissen Eunuchen Arsacius. Er schickte auch den Gregor mit bewaffneter Mannschaft; und es geschahen solche Dinge, wie schon früher. Sie sammelten einen Haufen von Rinderhirten und Schafhirten, und andern Müssiggängern und ausgelassenen Jungen, und stürzten mit Schwertern und Keulen in die sogenannte Kirche des Cyrinus, wo sie Einige tödteten, Andere mit Füssen traten, wieder Andere durch Schläge zerfleischten, in das Gefängniß warfen, und verbannten, viele Weiber ergriffen und öffentlich zum Gerichte schleppten, bei den Haaren zogen und mißhandelten, Andere in die Acht erklärten und wieder Andern ihr Brod wegnahmen, aus keiner andern Ursache, als damit sie an die Arianer sich anschließen und den von dem Könige geschickten Gregorius aufnehmen möchten.</p>
      <h2>11</h2><p>Athanasius schiffte nun, ehe dieses geschehen war, sobald er nur davon Kunde erhielt, nach Rom, theils weil er die Wuth der Ketzer genau kannte, theils damit, wie beschlossen war, die Synode gehalten würde. Julius aber schickte die Priester Elpidius und Philoxenus mit einem Schreiben ab, und setzte ihnen eine Zeit fest, damit sie entweder erscheinen, oder wissen sollten, daß sie in Allem verdächtig seyen. Als aber die Eusebianer auch nur gehört hatten, daß dort ein kirchliches Gericht gehalten werde, wobei weder ein Comes zugegen sey, noch Soldaten vor den Thüren stünden, und daß die Verhandlungen der Synode nicht nach einem königlichen Befehle gestaltet würden, (denn hiedurch hatten sie immer ein Uebergewicht über die Bischöfe erhalten, und ohne diese Dinge getrauen sie sich nicht einmal zu sprechen;) geriethen sie in einen solchen Schrecken, daß sie die Priester über die bestimmte Zeit zurückhielten, und die unpassende Entschuldigung erdachten, daß sie wegen des Perser-Krieges nicht erscheinen könnten. Dieses war aber nicht wahr; sondern Gewissensangst hielt sie zurück. Denn was geht der Krieg die Bischöfe an? Oder warum hätten sie wegen der Perser nicht nach Rom sollen kommen können, obschon es weit entfernt ist und über dem Meere liegt, da sie doch die östlichen Gegenden und die Grenzländer der Perser wie Löwen durchreisten, indem sie nachforschten, wer sich ihnen widersetzte, damit sie denselben verleumden und verbannen konnten?</p>
      <h2>12</h2><p>Ja, nachdem sie die Priester mit jener Entschuldigung, welche keinen Glauben verdiente, entlassen hatten, besprachen sie sich auf folgende Weise mit einander: Da wir durch die kirchliche Untersuchung nicht siegen können, so wollen wir die gewohnte Verwegenheit zeigen. Die schrieben daher an den Philagrius und bewirkten, daß er mit Gregor in kurzer Zeit nach Aegypten kam; hierauf wurden nun Bischöfe gegeißelt und grausam gefesselt; den Bischof und Bekenner Sarapammon verbannten sie; den Bischof und Bekenner Potammon aber, welcher bei der Verfolgung ein Auge verlor, schlugen sie mit so vielen Streichen auf das Genick, daß sie nicht eher aufhörten, als bis sie den Mann für todt hielten. So wurde er nun hingeworfen, und kam kaum nach einigen Stunden durch ärztliche Behandlung und durch Zufächern, indem Gott ihm das Leben schenkte, wieder zu Athem. Allein kurz darnach starb er an den Schmerzen der Wunden, und erlangte in Christo den Ruhm eines zweiten Märtyrertodes. Wie viele andere Mönche wurden mit Ruthen gepeitscht, während Gregor und der sogenannte Dux Balacius den Vorsitz führten! Wie viele Bischöfe wurden verwundet! Wie viele Jungfrauen geschlagen!</p>
      <h2>13</h2><p>Dann forderte der elende Gregor Alle auf, mit ihm in Kirchengemeinschaft zu treten. Allein, wenn du die Kirchengemeinschaft derselben verlangtest, so verdienten sie die Schläge nicht; wenn du sie aber zerfleischtest, weil sie schlecht waren, warum riefest du sie als Heilige herbei? Er hatte jedoch keinen andern Vorsatz, als den Auftrag seiner Sender zu vollziehen, und die Ketzerei zu befestigen. Deßwegen wurde der Thor auch ein Mörder, ein Henker, ein Gewaltthätiger, ein Betrüger, ein Ruchloser, und, mit Einem Worte, ein Feind Christi. Die Tante des Bischofes verfolgte er so sehr, daß er nach ihrem Tode nicht einmal ihre Beerdigung gestattete; und sie wäre unbeerdigt geblieben, und unbestattet hingeworfen worden, wenn nicht diejenigen, welche sie aufhoben, den Leichnam als ihnen gehörig weggetragen hätten; so verrucht war in dieser Beziehung sein Betragen. Ueberdieß befahl er, da Wittwen und andere Bettler Almosen erhielten, das Ausgetheilte wegzunehmen und die Gefäße, worin sie das Oel und den Wein trugen, zu zerbrechen, auf daß er nicht nur durch das Rauben gottlos handelte, sondern auch durch Werke den Herrn entehrte, indem er bald von ihm hören wird: So viel du diese da entehrt hast, hast du auch mich entehrt.</p>
      <h2>14</h2><p>Auch vieles Andere verübte er, wofür es gar keine Worte gibt, und was Jemand, wenn er es hörte, für unglaublich hielte. Zu diesem Verfahren aber veranlaßte ihn der Umstand, weil er weder nach dem Kanon der Kirche eingesetzt, noch nach der apostolischen Ueberlieferung zum Bischöfe ernannt, sondern aus dem Palaste mit militärischer Begleitung und militärischem Gepränge geschickt war, als wenn er ein weltliches Amt erhalten hätte. Daher wünschte er auch mehr ein Freund der weltlichen Obrigkeiten, als der Bischöfe und Mönche zu seyn. Wenn ihm also einmal der Vater Antonius vom Berge aus schriebe, würde, wie die Verehrung Gottes dem Sünder ein Gräuel ist, so das Schreiben des heiligen Mannes ihn aneckeln. Sendete dagegen einmal der König, oder ein Feldherr oder irgend ein anderer Richter ein Schreiben an ihn, so würde er sich so sehr freuen, wie die in den Sprüchen, von welchen die Schrift nicht ohne Unwillen sagt: „Wehe denen, welche die geraden Wege verlassen, welche sich freuen über das Böse, und frohlocken über den Umgang mit den Bösen.“ Gewiß würde er diejenigen, welche ihm ein solches Schreiben brächten, mit Geld beschenken; als ihm aber Antonius einmal schrieb, vermochte er den Dux Balacius dazu, daß er auf den Brief spuckte, und ihn wegwarf. Aber die göttliche Gerechtigkeit ließ dieses nicht unbestraft; denn als nicht lange darauf der sogenannte Dux sich zu Pferde setzte, und zur nächsten Station reiten wollte, wandte sich das Pferd und biß ihn so sehr in den Ober - Schenkel, daß er herabfiel und nach drei Tagen starb.</p>
      <h2>15</h2><p>Auf diese Weise nun verfuhren jene gegen Alle. Die zu Rom versammelten Bischöfe aber, gegen fünfzig an der Zahl, nahmen den Eusebius und seine Anhänger, weil sie verdächtig waren und zu kommen sich scheuten, nicht auf, sondern erklärten auch die Schreiben derselben für kraftlos; uns aber nahmen sie auf, und traten freudig in Kirchengemeinschaft mit uns. Während aber dieses geschah, wurde der König Constans sowohl von der zu Rom gehaltenen Synode, als auch von den Dingen, welche zu Alexandrien und im ganzen Morgenlande gegen die Kirchen verübt wurden, in Kenntniß gesetzt; hierauf schrieb er seinem Bruder Constantius, und beide beschlossen, daß eine Synode gehalten, und die Sache untersucht werden sollte, damit diejenigen, welche Unrecht erlitten, nicht ferner dulden, und die, welche Unrecht zufügten, etwas solches nicht mehr wagen möchten. Es versammelten sich nun aus dem Morgenlande und dem Abendlande in der Stadt Sardika ungefähr hundert und siebenzig Bischöfe; die abendländischen Bischöfe waren allein, und hatten den Vater Hosius bei sich; die morgenländischen aber führten Jugendlehrer und Wortführer, den Comes Musonianus und den Hesychius von dem kaiserlichen Hoftager mit sich; und im Vertrauen auf diese erschienen sie wohlgemuth, in der Meinung, daß sie durch die Macht derselben wieder Alles durchsetzen würden. Denn so und mittelst dieser haben sie allzeit, welchen sie wollten, sich furchtbar gezeigt, und denen nachgestellt, welchen nachzustellen ihnen beliebte. Da sie aber bei ihrem Eintritte sahen, daß nur ein kirchliches Gericht, ohne Comes und Soldaten, gehalten werde; da sie die Ankläger aus jeder Gemeinde und Stadt erblickten, und die Beweise gegen sie; da sie die ehrwürdigen Bischöfe Arius und Asterius sahen, welche zwar mit ihnen gekommen, aber von ihnen abgefallen und zu uns übergetreten waren, und welche ihre Verschlagenheit schilderten und sagten, wie argwöhnisch sie bei ihren Handlungen wären, wie sehr sie sich vor der Untersuchung fürchteten und besorgten, sie möchten von uns als Verleumder überwiesen, und es möchte von den Anklägern, welche sie bestellt hatten, verrathen werden, daß sie selbst ihnen Alles, was sie sagen sollten, vorgesagt und diese Ränke ersonnen hätten; da sie dieses sahen, verschlossen sie, obgleich sie voll Eifer gekommen waren, in der Meinung, wir würden aus Furcht vor ihnen nicht einmal erscheinen, sobald sie unsere Zuversicht bemerkten, sich in den Pallast, denn dort wohnten sie. Und dann sprachen sie so mit einander: Wir sind unter andern Voraussetzungen gekommen, Anderes sehen wir; wir sind mit einem Comes erschienen, und ohne Comes wird das Gericht gehalten; wir werden gewiß verurtheilt. Ihr alle kennet die Befehle; Athanasius hat die Akten über die Vorfälle in Mareotis, durch welche er gerechtfertiget, wir aber beschämt werden. Warum zögern wir also? Warum verschieben wir die Sache? Lasset uns Vorwände ersinnen und hinweggehen, damit wir nicht, wenn wir hier bleiben, verurtheilt werden. Es ist besser zu fliehen und zu erröthen, als der Verleumdung überführt und so beschämt zu werden. Fliehen wir, so können wir doch wenigstens auf irgend eine Weise die Ketzerei begünstigen; und wenn sie auch, da wir fliehen, uns verurtheilen, so haben wir doch den Kaiser zu unserm Beschirmer, welcher nicht gestattet, daß wir von den Völkern aus den Kirchen verstossen werden.</p>
      <h2>16</h2><p>So nun sprachen sie zu einander. Hosius aber und alle andere Bischöfe meldeten ihnen öfter die Zuversicht des Athanasius und seiner Gefährten, und wie bereit sie seyen zur Vertheidigung und zur Widerlegung ihrer Verleumdungen; sie sagten auch: Wenn ihr das Gericht fürchtet, warum seyd ihr erschienen? Denn ihr hättet entweder nicht kommen sollen, oder ihr solltet, nachdem ihr gekommen seyd, nicht fliehen. Als jene dieses hörten, wurden sie noch mehr bestürzt, bedienten sich einer noch ungereimtern Entschuldigung, als früher zu Antiochien, nämlich daß ihnen der König seinen Sieg über die Perser schriftlich gemeldet hätte, und suchten zu fliehen. Diese Entschuldigung überschickten sie, ohne sich zu schämen, durch Eustathius, einen Priester der Kirche zu Sardika. Allein nicht einmal so ging ihnen die Flucht nach Wunsch von Statten; denn sogleich machte ihnen die heilige Synode, in welcher der große Hosius den Vorsitz führte, öffentlich durch ein Schreiben kund: Entweder erscheinet und rechtfertiget euch wegen der gegen euch vorgebrachten Beschuldigungen, und wegen der Verleumdungen, die ihr ausgesonnen habet, oder wisset, daß die Synode euch als Schuldige verurtheilt, den Athanasius und seine Gefährten aber für frei und von aller Schuld rein erklärt. Allein jene ließen sich durch ihre Gewissensangst mehr zur Flucht antreiben, als durch das Schreiben bewegen, demselben Folge zu leisten. Denn da sie die von ihnen Mißhandelten erblickten, achteten sie nicht einmal auf die Abgeordneten, sondern beschleunigten ihre Flucht nur desto mehr.</p>
      <h2>17</h2><p>Auf eine so schimpfliche und schändliche Weise also ging ihre Flucht vor sich. Die heilige Synode aber, aus mehr als fünf und dreißig Provinzen versammelt, ließ, nachdem sie die Bosheit der Arianer erkannt hatte, den Athanasius und seine Genossen zur Rechtfertigung gegen die Anklagen jener Menschen, wegen deren Verleumdungen sie so viel erduldet hatten, zu; nahm sie, nachdem sie sich so, wie wir in dem Vorhergehenden sagten, gerechtfertiget hatten, auf, und fühlten eine solche Hochachtung gegen sie, daß sie dieselben und ihre Kirchengemeinschaft mit Vergnügen sah, und es nicht nur sonst allenthalben schriftlich kund that, sondern auch in die Diöcese eines Jeden schrieb, und vorzüglich nach Alexandrien, nach Aegypten, und nach Libyen, daß nämlich Athanasius und seine Begleiter rein und von allem Vorwurfe frei, ihre Widersacher aber Verleumder, Bösewichte und Alles mehr, als Christen, seyen. Jene entließen sie nun im Frieden; den Stephanus, Menophantus, Acacius, Georgius von Laodicea, Ursacius, Valens, Theodorus und Narcissus aber setzten sie ab. Denn hinsichtlich des Gregorius, welcher von dem Könige nach Alexandrien geschickt worden war, erklärten sie, daß er weder jemals Bischof gewesen sey, noch auch nur Christ genannt werden solle. Auch die Ordinationen, welche er vorgenommen zu haben schien, erklärten sie für ungültig, indem sie befahlen, daß sie in den Kirchen nicht einmal genannt werden sollen, wegen der unerhörten Uebertretung des Gesetzes. So nun wurden Athanasius und seine Gefährten im Frieden entlassen. Ihre Schreiben aber werden wegen der Länge des Briefes am Ende beigefügt; und die Synode wurde geschlossen.</p>
      <h2>18</h2><p>Die Abgesetzten aber, welche schon damals sich ruhig hätten verhalten sollen, und welche nach dieser so schändlichen Flucht nach Hause gegangen waren, verübten solche Dinge, daß ihre frühern Gräuelthaten im Vergleiche mit diesen gering zu seyn schienen. Da nämlich die Bürger von Adrianopel mit ihnen als solchen, welche von der Synode geflohen und mit Verbrechen belastet waren, nicht in Kirchengemeinschaft treten wollten, berichteten sie hierüber an den König Constantius und bewirkten, daß aus der dortigen sogenannten Waffenschmiede zehn Laien enthauptet wurden, wobei ihnen Philagrius, damals Comes daselbst, behülflich war. Die Grabmäler derselben sind ausserhalb der Stadt, und wir sahen sie im Vorbeireisen. Dann befahl der König, als wenn sie recht gethan hätten, daß sie deßwegen entflohen waren, damit sie nicht als Verleumder überwiesen würden, alles, was sie wollten. Sie bewirkten daher, daß von Alexandria zwei Priester und drei Diakonen nach Armenien verwiesen wurden; den Arius und Asterius aber, von welchen der Erstere Bischof zu Petra in Palästina, der Letztere Bischof in Arabien war, verbannten sie, weil sie von ihnen abgefallen waren, nicht nur nach Oberlibyen, sondern sie bewirkten auch, daß sie mißhandelt wurden.</p>
      <h2>19</h2><p>Den Lucius aber, Bischof von Adrianopel, ließen sie, da sie ihn mit vieler Freimüthigkeit gegen sie sprechen und ihre Gottlosigkeit widerlegen sahen, abermals, wie schon früher, an dem Halse und den Händen mit eisernen Banden fesseln, und verbannten ihn so, worauf er auch starb, wie sie wohl wissen. Auch den Bischof Diodorus vertreiben sie von seinem Sitze. Den Olympius von Aenos aber und den Theodulus von Trajanopolis, beide Bischöfe aus Thrazien, rechtschaffene und rechtgläubige Männer, verleumdeten sie, weil sie sahen, daß dieselben ihre Ketzerei haßten; dieses hatten zwar zuerst die Eusebianer gethan, und der König Constantius hatte ein Schreiben erlassen, jene aber erneuerten die Verleumdungen. Das Schreiben aber verordnete, sie sollten nicht nur aus ihren Städten und Kirchen vertrieben, sondern, wenn man sie irgendwo antreffen würde, mit dem Tode bestraft werden. Obschon aber dieses auffallend ist, so liegt es doch nicht ausser ihrem Plane; denn da sie dieses von den Eusebianern gelernt haben, und gleichsam Erben der Gottlosigkeit und der Absichten derselben sind; wollten, wie ihre Väter in Thrazien, so auch sie zu Alexandria sich furchtbar zeigen; und sie wirkten ein Schreiben aus, welchem zu Folge die Häfen und Eingänge der Städte bewacht wurden, damit nicht diejenigen, welche die Erlaubniß dazu von der Synode erhalten hatten, in ihre Kirchengemeinden zurückkehrten. Auch bewirkten sie, daß den Richtern zu Alexandrien durch ein Schreiben, welches sich auf den Athanasius und einige namentlich aufgeführte Priester bezog, angedeutet wurde, daß es, wenn entweder der Bischof oder Einer von jenen, nachdem er die Stadt oder die Gränzen derselben betreten hätte, angetroffen würde, dem Richter erlaubt sey, die Angetroffenen zu enthaupten. So läugnet diese neue jüdische Sekte nicht nur den Herrn, sondern sie hat auch morden gelernt.</p>
      <h2>20</h2><p>Allein nicht einmal so begaben sie sich zur Ruhe; sondern wie der Vater ihrer Sekte, wie ein Löwe, umhergeht, suchend, wen er verschlinge; so gingen auch sie, nachdem sie die Erlaubniß öffentlich umherzugehen erhalten hatten, umher, und wenn sie irgend einen fanden, der ihre Flucht tadelte, und die arianische Ketzerei verabscheute, so geißelten, fesselten und zwangen sie ihn, aus seinem Vaterlande sich zu verbannen; und sie machten sich so furchtbar, daß sie Viele zu Heuchlern bildeten, Viele aber lieber in die Wüsten fliehen, als mit ihnen auch nur überhaupt zusammentreffen wollten. Dieses waren die Gräuelthaten dieser wüthenden Menschen nach der Flucht. Ja sie verübten noch ein neues Verbrechen, welches ihrer Ketzerei ganz entspricht, früher aber noch nie gehört worden ist, ja vielleicht nie mehr geschehen wird, nicht einmal bei den ausgelassensten Heiden, geschweige denn bei Christen. Denn da die heilige Synode Bischöfe als Abgeordnete geschickt hatte, nämlich den Vincentius, Bischof von Capua, welches die Hauptstadt von Campanien ist, und den Euphrates, Bischof von Köln, der Hauptstadt von Ober-Gallien, damit, wie die Synode beschlossen hatte, der König die Bischöfe in ihre Kirchengemeinden zurückkehren lassen möchte, da er dieselben auch vertrieben hatte; und da der sehr gottesfürchtige Constans zu Gunsten der Bischöfe an seinen Bruder ein Empfehlungsschreiben geschickt hatte; ersannen die sonderbaren und zu Allem tollkühnen Menschen, sobald sie dieselben zu Antiochia erblickt hatten, gemeinschaftlich einen Plan, und Stephanus übernahm, als der hiezu Tauglichste, allein die Rolle. Sie mietheten also eine öffentliche feile Dirne, selbst in den Tagen des hochheiligen Osterfestes, entblößten sie, und schickten sie Nachts zum Bischofe Euphrates hinein. Die Hure nun, welche glaubte, ein junger Mann habe sie gerufen, folgte Anfangs mit größter Bereitwilligkeit; als sie aber, von jenen hineingedrängt, sah, daß der Mann schlafe und von dem, was geschehe, nichts wisse; als sie dann das Angesicht eines Greises und die Gestalt des Bischofes erblickte und betrachtete, schrie sie sogleich laut auf und beklagte sich über Gewalt. Jene aber baten sie zu schweigen, und die Sache fälschlich dem Bischofe aufzubürden. Als es nun Tag geworden war, wurde der Vorfall durch die Sage bekannt, und die ganze Stadt lief zusammen. Auch die aus dem Palaste geriethen in Bewegung, indem sie über das Gerücht staunten, und verlangten, es sollte dieses nicht mit Stillschweigen übergangen werden. Die Sache kam also vor Gericht, und der Hurenwirth verrieth die, welche zur Buhlerin gekommen waren, diese aber gaben den Stephanus an; denn sie waren Kleriker von ihm. Stephanus wurde daher abgesetzt, und der Verschnittene Leontius ward an seiner Statt Bischof, damit ja der arianischen Ketzerei kein Beschützer fehlen möchte</p>
      <h2>21</h2><p>Der König Constantius wurde ein wenig betroffen, und ging in sich; indem er aus dem, was sie dem Euphrates gethan hatten, schloß, daß auch ihre Unternehmungen gegen die übrigen Bischöfe so beschaffen seyen, befahl er, die von Alexandria nach Armenien verbannten Priester und Diakone sogleich in Freiheit zu setzen. Er schickte auch den schriftlichen Befehl nach Alexandrien, daß die Kleriker und das Volk des Arhanasius nicht mehr verfolgt werden sollten. Dann ließ er beiläufig zehn Monate nach dem Tode des Gregorius, den Athanasius selbst mit vieler Ehre zu sich kommen, und schrieb ihm nicht ein oder zwei, sondern drei Male sehr freundliche Briefe, in welchen er ihn ermahnte, mit Zuversicht zu erscheinen. Er schickte auch einen Priester und einen Diakon ab, auf daß er mit noch größerem Vertrauen kommen möchte; denn er meinte, ich würde aus Furcht wegen der frühern Ereignisse auf die Rückkehr keinen Werth legen. Er schrieb auch an seinen Bruder Constans, damit auch dieser mich zur Rückkehr ermuthigen sollte. Denn er behauptete, er habe schon ein ganzes Jahr den Athanasius erwartet, und nie zugegeben, daß irgend eine Neuerung oder Ordination vorgenommen werde, weil er dem Bischofe Athanasius seine Kirchengemeinden aufbehalten wolle.</p>
      <h2>22</h2><p>Da er also auf diese Weise geschrieben und ihn durch viele Worte aufgefordert hatte, (denn auch seine Comes ließ er an ihn schreiben, den Polemius, Datianus, Bardion, Thalassus, Taurus und Florentius, welchen man auch mehr glauben konnte,) stellte Athanasius die ganze Sache Gott anheim, welcher das Herz des Constantius hiezu gelenkt hatte, und ging mit den Seinen zu demselben, der ihm einen freundlichen Blick gewährte, und ihn entließ, damit er heimkehrte in sein Vaterland, und zu seinen Kirchen; auch schrieb er an die dortigen Richter, denen er zuvor die Eingänge zu bewachen befohlen hatte, daß sie ihn ungehindert dahin gelangen lassen sollten. Als sich hierauf der Bischof über die erlittenen Unbilden beklagte, so wie über das von dem Könige gegen ihn erlassene Schreiben, und beisetzte, er möchte nach seiner Abreise den Verleumdungen seiner Feinde kein Gehör schenken, und sagte: Laß sie kommen, wenn du willst; denn von uns aus dürfen sie zugegen seyn, und wir überführen sie; that er dieses zwar nicht, befahl aber Alles, was zuvor aus Verleumdung gegen denselben geschrieben worden war, zu vertilgen und auszulöschen, mit der Versicherung, er wolle in Zukunft die Verleumdungen nicht mehr anhören, sondern dieser sein Vorsatz sey fest und unerschütterlich. Und dieses sagte er nicht so geradeweg, sondern er versiegelte seine Worte durch Eide, indem er Gott dabei zum Zeugen anrief. Ueberdieß ermunterte er denselben auch durch viele andere Worte, hieß ihn Vertrauen hegen, und schrieb an die Bischöfe und Richter Folgendes.</p>
      <h2>23</h2><p><strong>Der siegreiche Constantius Maximus Augustus an die Bischöfe und Kleriker der katholischen Kirche.</strong></p><p>Nicht verlassen von Gottes Gnade ist der höchst ehrwürdige u. s. w.</p><p><strong>Zweiter Brief des Constantius an das Volk zu Alexandria.</strong></p><p>Da wir uns euere Ruhe in Allem zum Ziele machen u. s. w.</p><p><strong>Dritter Brief.</strong></p><p>Der siegreiche Constantius Augustus an den Nestorius, den Präfekten Aegyptens.</p><p>Es ist bekannt, daß wir früher einen Befehl erlassen haben, so daß Schreiben gegen die Ehre des wohlehrwürdigen Bischofes Athanasius sich vorfinden; diese aber befinden sich, wie bekannt, in dem Verzeichnisse deiner Heiligkeit. Wir wollen nun, daß deine von uns erprobte Vorsicht alle Schreiben, welche sich in Bezug auf den Namen des Obengenannten in dem dir anvertrauten Commentare vorfinden, diesem unserm Befehle zufolge an unser Hoflager übersende.</p>
      <h2>24</h2><p>Das Schreiben aber, welches er nach dem Tode des seligen Constans ergehen ließ, lautet, wie folgt, und wurde zuerst in lateinischer Sprache verfaßt, dann aber in das Griechische übertragen.</p><p><strong>Der siegreiche Constantius Augustus an den Athanasius.</strong></p><p>Daß es immer mein Wunsch war, es möchte meinem verstorbenen Bruder Constans Alles nach seinem Sinne gehen, war deiner Einsicht nicht verborgen. In welche Trauer ich aber versetzt wurde, als ich erfuhr, daß er von einigen höchst ruchlosen Menschen ermordet worden sey, vermag deine Klugheit ebenfalls zu beurtheilen. Weil es nun Einige gibt, welche dich in der gegenwärtigen so traurigen Zeit zu schrecken versuchen; deßwegen hielt ich es für billig, dieses Schreiben an deine Standhaftigkeit ergehen zu lassen, und ich ermahne dich, daß du, wie es einem Bischöfe geziemt, das Volk in dem zur Gottesverehrung Nöthigen unterrichtest, mit ihm, wie gewöhnlich, den Gebeten obliegest, und nicht leeren Gerüchten, welche sie immer seyn mögen, Glauben schenkest. Denn wir haben den festen Beschluß in der Seele gefaßt, daß du unserm Willen zufolge immer Bischof in deinem Sitze seyn solltest.</p><p>Die göttliche Vorsehung beschirme dich viele Jahre, liebster Vater!</p>
      <h2>25</h2><p>Nachdem dieses so geschehen war, und nachdem Athanasius Abschied genommen, und sich auf den Weg gemacht hatte, freuten sich die Freunde, als sie den Freund sahen; von den Andern aber schämten sich Einige bei seinem Anblicke, Andere hatten den Muth nicht vor ihm zu erscheinen und verbargen sich, wieder Andere aber bereuten das, was sie gegen den Bischof geschrieben hatten. Alle Bischöfe von Palästina also, zwei oder drei und zwar verdächtige Männer ausgenommen, nahmen den Athanasius so auf, und freuten sich so sehr über die Kirchengemeinschaft mit ihm, daß sie sich schriftlich damit entschuldigten, sie hätten das, was sie vormals geschrieben hatten, nicht aus eigenem Antriebe, sondern durch Gewalt gezwungen geschrieben. Denn von den Bischöfen in Aegypten und Libyen, und von den Völkern in jenen Ländern und zu Alerandria zu sprechen ist überflüssig; Alle liefen nämlich zusammen und hatten eine unaussprechliche Freude, nicht allein weil sie die Ihrigen unverhofft lebendig wieder erhielten, sondern auch weil sie von den Ketzern als Wütherichen und wüthenden Hunden befreit wurden. Ungemein groß also war die Freude der Völker, welche in den Versammlungen sich gegenseitig zur Tugend ermunterten. Wie viele unverheurathete vorher zur Heurath bereitwillige Mädchen blieben Jungfrauen, indem sie Christo sich weihten? Wie viele Jünglinge widmeten sich nach dem Beispiele Anderer dem einsamen Leben? Wie viele Väter ermunterten ihre Kinder? Wie viele Väter wurden von den Kindern gebeten, sie möchten ihre Uebung in Christo nicht hindern? Wie viele Gattinen beredeten ihre Männer, wie viele Ehefrauen wurden von ihren Männern beredet, dem Gebete obzuliegen, wie der Apostel sagt? Wie viele Wittwen und wie viele Waisen, welche zuvor Hunger litten und keine Kleider hatten, litten in Folge des großen Tugendeifers der Völker nachher nicht nur keinen Hunger mehr, sondern traten auch gekleidet hervor? So groß war überhaupt der Wetteifer in der Tugend, daß man eine jede Wohnung und ein jedes Haus wegen der Liebe zum Guten, welche die Bewohner erfüllte, und wegen des Gebetes zu Gott für eine Kirche halten konnte. Tiefer und bewunderungswürdiger Friede herrschte in den Kirchengemeinden, indem die Bischöfe von allen Seiten her dem Athanasius schrieben, und von ihm die gewöhnlichen Friedensschreiben erhielten.</p>
      <h2>26</h2><p>Denn sogar Ursacius und Valens änderten, wie von Gewissensbissen gefoltert, ihre Gesinnung, und schrieben dem Bischofe selbst einen freundschaftlichen und friedfertigen Brief, obschon sie von ihm kein Schreiben erhalten hatten. Auch reisten sie nach Rom, thaten Buße, und bekannten, daß Alles, was sie wider denselben verübt und gesagt hätten, falsch und bloße Verleumdung sey. Und sie begnügten sich noch nicht mit diesem; sondern sie verfluchten auch die arianische Ketzerei, und übergaben ihre Reue schriftlich, indem sie dem Bischofe Julius lateinisch schrieben, welches Schreiben aber in das Griechische übertragen wurde, und auf folgende Weise lautet. Eine Abschrift davon in lateinischer Sprache wurde uns von Paulus, dem Bischofe von Trier, überschickt.</p>
      <h2>27</h2><p>Wer verwunderte sich nun nicht, da er dieses und einen solchen Frieden der Kirchengemeinden sah? Wer freute sich nicht, da er die Eintracht so vieler Bischöfe schaute? Wer pries den Herrn nicht, da er in den Versammlungen die Freude der Völker erblickte? Wie viele von den Feinden thaten Buße? Wie viele aus den frühern Verleumdern rechtfertigten sich? Wie viele von denen, welche ihn frühe haßten, gewannen ihn nachher lieb? Wie viele von denen, welche gegen ihn geschrieben hatten, widerriefen? Wieviele aus denjenigen, welche nicht aus eigenem Antriebe, sondern dem Zwange zu Folge es mit den Arianern hielten, kamen bei Nacht, entschuldigten sich, verfluchten die Ketzerei, und baten um Verzeihung, weil sie wegen der Ränke und Verleumdungen, welche sich jene erlaubten, nur dem Körper nach ihren Versammlungen beigewohnt hätten, im Herzen aber mit Athanasius in Kirchengemeinschaft gestanden wären, und es immer mit ihm gehalten hatten? Ja, so ist es, glaubet mir!</p>
      <h2>28</h2><p>Als nun die Erben der Meinung und der Gottlosigkeit des Eusebius, nämlich Leontius der Verschnittene, welcher nicht einmal als Laie zur Kirchengemeinschaft hätte gelassen werden sollen, weil er sich selbst entmannt hatte, um nachher ungehindert bei einer gewissen Eustolium schlafen zu dürfen, welche durch ihn ein Weib war, aber doch Jungfrau genannt wurde, ferner Georgius, Acacius, Theodorus und Narcissus, welche in.der Synode abgesetzt wurden, dieses hörten und sahen, schämten sie sich sehr. Da sie dann sahen, daß mit Athanasius mehr als vierhundert Bischöfe in einträchtiger und friedlicher Verbindung standen, aus dem großen Rom nämlich, aus dem ganzen Italien, aus Calabrien, Campanien, Bruttien, Sicilien, Sardinien, Korsika, aus ganz Afrika, aus Gallien, Britannien und Spanien, mit Einschluß des großen Bekenners Hosius; ferner die Bischöfe aus Pannonien, Noricum, Siscia, Dalmatien, Dardanien, Dacien, Mysien, Macedonien, Thessalien, und ganz Achaia, aus Creta, Cypern und Lycien, auch sehr viele aus Palästina, Isaurien, Aegypten, Thebais, ganz Libyen und Pentapolis; da jene dieses sahen, sage ich, wurden sie von Neid und Furcht ergriffen, von Neid nämlich wegen der kirchlichen Verbindung mit so vielen Bischöfen, von Furcht aber, weil sie besorgten, es möchten die von ihnen Betrogenen der Eintracht so Vieler sich anschließen, und es möchte dann ihre Ketzerei lächerlich gemacht, als besiegt zur Schau ausgestellt und überall gebrandmarkt werden.</p>
      <h2>29</h2><p>Zuerst suchten sie nun den Ursacius und Valens zu überreden, ihre Gesinnung zu ändern, und wie die Hunde zu ihrem eigenen Auswurfe zurückzukehren, wie die Schweine in dem frühern Unflathe der Gottlosigkeit sich wieder zu wälzen, und zum Vorwande ihrer Reue zu erdichten, sie hätten dieses aus Furcht vor dem höchst gottesfürchtigen Constans gethan. Wenn sie aber auch sich gefürchtet hätten, so hätten sie doch, wenn sie ihre Handlungen für gut gehalten hätten, an denselben nicht zu Verräthern werden sollen. Hegten sie aber keine Furcht, sondern sagten sie die Unwahrheit, wie sind sie dann nicht aller Verdammung würdig? Denn es war kein Soldat zugegen, es waren keine Hofbeamten oder Notare geschickt, es geschah nichts von dem, was sie jetzt thun, es war auch der König nicht gegenwärtig, und sie waren von Niemanden aufgefordert worden, als sie dieses schrieben; sondern sie reisten selbst freiwillig nach Rom, thaten in der Kirche, wo kein äusserlicher Zwang Statt fand, wo nur die Furcht vor Gott herrscht, und wo ein Jeder seinen freien Willen hat, aus eigenem Antriebe Buße und legten den Ausdruck ihrer Sinnesänderung schriftlich nieder. Dessen ungeachtet schämen sie sich, da sie nun zum zweiten Male Arianer geworden sind, keineswegs, abermals einen so unpassenden Vorwand zu erdichten.</p>
      <h2>30</h2><p>Hierauf gingen sie gemeinschaftlich zum Könige Constantius, und baten ihn mit folgenden Worten: Da wir zum ersten Male an dich unsere Bitte stellten, wurde uns nicht geglaubt; wir sagten nämlich, als du den Athanasius zu dir beschiedest, du werdest dadurch, daß du diesen herbeiriefst, unsere Sekte verdrängen. Denn dieser war vom Anbeginn ihr Gegner, und hört nicht auf, dieselbe mit dem Fluche zu belegen. Er hat nun schon alle Gegenden mit seinen Schreiben gegen uns angefüllt, und die Meisten stehen mit ihm in Kirchengemeinschaft; von denjenigen aber, welche es mit uns zu halten schienen, haben sich die Einen schon an ihn angeschlossen, die Andern aber sind im Begriffe, es zu thun; wir sind allein übrig. Und es ist zu befürchten, daß die Ketzerei erkannt werde, und daß dann sowohl wir, als auch du mit dem Namen Ketzer belegt werden; und würde dieses geschehen, so siehe zu, daß wir nicht zu den Manichäern gerechnet werden. Beginne also die Verfolgung wieder, und beschirme die Sekte! denn auch diese hat dich zum Könige. Dieses nun waren ihre arglistigen Worte. Er aber änderte, da er bei seinem Eilmarsche gegen den Magnentius durchzog, und die Kirchengemeinschaft der Bischöfe mit Athanasius sah, wie vom Feuer entflammt, seine Gesinnung, dachte nicht mehr an seine Schwüre, vergaß sogar dasjenige, was er geschrieben hatte, und erinnerte sich nicht mehr seiner Verpflichtungen gegen seinen Bruder. Denn sowohl in seinem Schreiben an denselben, als auch bei dem Anblicke des Athanasius gab er die eidliche Versicherung, er wolle nicht anders handeln, als wie das Volk wünsche, und wie es dem Bischofe genehm sey. Allein der Eifer für die Gottlosigkeit bewirkte, daß er Alles zugleich vergaß. Und man darf sich nicht wundern, daß Constantius nach so vielen Schreiben und nach so vielen Schwüren sich umänderte, da ja auch Pharao, weiland Beherrscher von Aegypten, obwohl er oft Versprechungen machte und deßwegen Befreiung von den Strafen erlangte, seine Gesinnung änderte, bis er am Ende mit denjenigen, welche dieselben Gesinnungen, wie er hatte, zu Grunde ging.</p>
      <h2>31</h2><p>Diese also zwang er in den einzelnen Städten zuerst, ihre Meinung zu ändern; als er aber nach Arelas und Mailand kam, handelte er, in allen Stücken, wie die Ketzer es ihm riethen und angaben, ja sie handelten vielmehr selbst so, und fielen, nachdem sie die Macht dazu erhalten hatten, über Alle her. Nun ergingen sogleich Schreiben und Befehle an den Präfekten, man sollte indessen das Getreide dem Athanasius nehmen, und den arianisch Gesinnten geben; und einem jeden, welcher wollte, sollte es erlaubt seyn, diejenigen zu mißhandeln, welche mit demselben Kirchengemeinschaft hätten. Man drohte auch den Richtern, wenn sie nicht mit den Arianern den kirchlichen Versammlungen beiwohnen würden. Dieses war aber nur ein Vorspiel dessen, was nachmals durch den Dux Syrianus verübt wurde. In die äussern Theile wurden wieder Befehle, Notare und Hofbeamte mit Drohungen in die einzelnen Städte zu den Bischöfen und Richtern geschickt, damit die Richter darauf dringen, die Bischöfe aber entweder mit den Arianern in Kirchengemeinschaft treten und gegen den Athanasius unterschreiben, oder die Strafe der Verbannung erdulden, die Laien aber, welche mit diesen sich versammeln würden, wissen möchten, daß sie Fessel, Schmach, Schläge und Beraubung ihrer Güter zu erwarten hätten. Und der Befehl wurde nicht vernachläßigt; denn die Abgeordneten hatten Kleriker des Ursacius und Valens bei sich, damit diese die Erstern aneifern, und die saumseligen Richter bei dem Könige anzeigen sollten. Und sie ließen die übrigen Sekten als ihre kleinern Schwestern wider den Herrn lästern, nur den Christen allein stellten sie nach, weil sie es nicht ertragen konnten, fromme Reden über Christum zu hören. Wie viele Bischöfe wurden daher, wie geschrieben steht, zu den Statthaltern und Königen geführt und hörten von den Richtern Folgendes: Entweder unterschreibet, oder verlasset die Kirchen, denn der Kaiser befahl euere Absetzung? Wie viele wurden von ihnen von Stadt zu Stadt getrieben, damit sie dieselben nicht als Freunde der Bischöfe anklagen möchten? Denn es wurde auch an die Stadtobrigkeiten geschrieben, und ihnen mit Geldstrafe gedroht, wenn nicht eine jede den Bischof ihrer Stadt zur Unterschrift zwingen würde, und überhaupt war jeder Ort und jede Stadt mit Furcht und Verwirrung erfüllt, indem die Bischöfe fortgeschleppt wurden, und die Richter die Thränen und Seufzer der Völker sahen.</p>
      <h2>32</h2><p>Solche Dinge wurden von den abgesandten Hofbeamten verübt. Jene wunderbaren Menschen aber gaben, im Vertrauen auf den erhaltenen Schutz, sich alle Mühe, beschieden daher einige Bischöfe zu dem Könige, hintergingen Andere durch ihre Schreiben und erdichteten Beschuldigungen, damit die Einen die Gegenwart des Constantius fürchten, die Andern aber aus Furcht vor den Gesandten und den auf erdichtete Verleumdung gestützten Drohungen ihre richtige und fromme Ansicht ändern möchten. So nun zwang der König eine so große Anzahl von Bischöfen, theils durch Drohungen, theils durch Versprechungen, zu sagen: Wir haben mit Athanasius keine Kirchengemeinschaft mehr. Denn diejenigen, welche zu ihm kamen, wurden nicht eher vorgelassen, und es wurde ihnen überhaupt keine Freiheit gestattet, oder aus ihrer Wohnung zu gehen erlaubt, ehe sie entweder unterschrieben hatten, oder, wenn sie dieses zu thun sich weigerten, verbannt worden waren. Dieses aber that er darum, weil er sah, daß die Ketzerei von Allen gehaßt werde; weßwegen er auch so Viele nöthigte, sich den Wenigen beizählen zu lassen. Und er bemühte sich einen Haufen Namen zusammen zu bringen, theils aus Neid gegen den Bischof, theils um der arianischen Gottlosigkeit, deren Beschützer er war, einen Schein von Ansehen zu verschaffen, in dem Wahne, daß er, wie die Menschen, so auch die Wahrheit stürzen könne, indem er nicht wußte, noch gelesen hatte, daß die Sadducäer und Herodianer, obgleich sie die Pharisäer auf ihre Seite gebracht hatten, doch die Wahrheit nicht zu verbergen vermochten; denn sie kommt auf diese Weise nur desto heller an den Tag. Diese aber sind, obschon sie schreien: „Wir haben keinen König, als den Kaiser,“ und das Urtheil des Pilatus haben, nichts desto weniger verlassen, und erwarten, daß sie, wenn sie ihren Beschirmer sterben sehen, mit aller Schande, wie jenes Rebhuhn, beinahe entblößt seyn werden.</p>
      <h2>33</h2><p>Wenn es aber auch durchaus ungeziemend ist, daß einige Bischöfe aus Furcht vor diesen ihre Meinung geändert haben; so ist es noch weit ungeziemender, und ein Zeichen, daß sie auf die Wahrheit ihrer Ansichten kein Vertrauen setzen, wenn sie Gewalt gebrauchen und diejenigen zwingen, welche nicht wollen. So macht zwar der Teufel, weil er keine Wahrheit hat, seinen Angriff mit dem Beile und der Axt, und zersprengt die Thüren derjenigen, welche ihn aufnehmen; der Heiland aber ist so sanftmüthig, daß er sagt: „Wenn mir Jemand nachfolgen will;“ und: „Wenn Jemand mein Jünger seyn will;“ und daß er, wenn er zu Jemanden geht, keine Gewalt braucht, sondern vielmehr anklopft und spricht: „Öffne mir, meine Schwester, meine Freundin!“ und wenn man öffnet, geht er hinein; wenn man aber zaudert und nicht will, geht er hinweg. Denn nicht mit Schwertern und Spießen, nicht durch Soldaten wird die Wahrheit verkündet, sondern durch Ueberzeugung und Rath. Was ist aber dort für eine Ueberzeugung, wo Furcht vor dem Kaiser ist? Oder was ist dort für ein Rath, wo der Widersprechende am Ende verbannt oder getödtet wird? David hat, obschon er König war, und den Feind in seiner Gewalt hatte, die Soldaten, welche den Feind tödten wollten, nicht durch seine Macht gehindert, sondern David hat, wie die Schrift sagt, seine Beute durch Worte beredet und ihnen nicht die Vollmacht gegeben, den Saul zu tödten. Dieser aber hat keine Vernunft, und verfährt mit seiner Macht gegen Alle gewaltthatig, damit es Allen einleuchte, daß die Klugheit jener Menschen nicht nach Gott sich richte, sondern menschlich sey, und daß die Anhänger des Arms wirklich keinen andern König haben, als den Kaiser; denn auf sein Ansehen gestützt verüben die Feinde Christi Alles, was ihnen beliebt. Während sie aber durch ihn Vielen Nachstellungen zu bereiten glauben, bemerken sie nicht, daß sie dadurch bewirken, daß Viele Bekenner werden. Zu diesen gehören diejenigen, welche jetzt ein herrliches Bekenntniß abgelegt haben, fromme Männer und vortreffliche Bischöfe, nämlich Paulinus, Bischof von Trier, der Hauptstadt Galliens, Lucifer, Bischof der Hauptstadt Sardiniens, Eusebius von Vercelli in Italien, Dionysos von Mailand, welches ebenfalls eine Hauptstadt Italiens ist. Denn diese ließ der Kaiser kommen und befahl ihnen, gegen den Athanasius zu unterschreiben, und mit den Ketzern Kirchengemeinschaft zu machen. Da sich dann diese über dieses neue Verfahren verwunderten und erwiederten, dieses sey kein kirchlicher Kanon, sprach jener sogleich: Aber was ich will, das muß für einen Kanon gehalten werden; denn so lassen mich die sogenannten Bischöfe Syriens sprechen. Entweder gehorchet also, oder auch ihr werdet verbannt werden.</p>
      <h2>34</h2><p>Als dieses die Bischöfe hörten, wunderten sie sich sehr, hoben ihre Hände zu Gott empor, und sprachen gegen jenen mit vieler Freimüthigkeit, indem sie lehrten, die Herrschaft sey nicht sein, sondern ein Eigenthum Gottes, welcher sie ihm übergeben habe; und sie baten ihn auch, daß er Gott fürchten sollte, damit er ihm dieselbe nicht plötzlich nehmen möchte; sie drohen ihm mit dem Tage des Gerichtes, und riethen ihm, die Lage der Kirche nicht zu verschlimmern, das römische Reich nicht mit den Satzungen der Kirche zu vermischen, und die arianische Ketzerei nicht in die Kirche einzuführen. Er hörte sie aber nicht an und ließ sie nicht weiter reden, sondern drohte heftiger, zog sein Schwert gegen sie, und befahl sogar, Einige von ihnen zum Tode hinwegzuführen; änderte aber, wie Pharao, seine Gesinnung wieder. Die Heiligen schüttelten nun den Staub von den Füssen, erhoben ihre Augen zu Gott, fürchteten die Drohungen des Königes nicht, und verriethen, als das Schwert gegen sie gezückt wurde, die Wahrheit nicht, sondern hielten die Verbannung für eine Obliegenheit ihres Amtes. Denn als sie durch Oerter und Städte zogen, predigten sie, obgleich sie gefesselt waren, dennoch das Evangelium, und verkündeten den frommen Glauben, indem sie die arianische Ketzerei verfluchten, und die Reue des Ursacius und Valens an den Pranger stellten. Dieses geschah aber gegen die Erwartung der Nachstellenden; denn je weiter der Ort der Verbannung entlegen war, desto mehr vergrößerte sich der Haß gegen dieselben, und die Wanderung dieser heiligen Manner war eine Verkündigung gegen die Gottlosigkeit jener Menschen. Denn wer bewunderte sie, als er sie durchziehen sah, nicht als Bekenner im hohen Grade, und wer verabscheute und verwünschte dagegen nicht die Arianer als Gottlose, und als Henker und Mörder, wer nannte sie da nicht lieber Alles, als Christen?</p>
      <h2>35</h2><p>Besser wäre es nun, wenn Constantius gleich Anfangs überhaupt an dieser Ketzerei gar keinen Theil genommen hätte, oder wenn er, nachdem er dieses gethan hatte, den Gottlosen nicht so viele Macht eingeräumt hätte, oder wenn er, nachdem er sie ihnen eingeräumt hatte, mit ihnen wenigstens hiebei stehen geblieben wäre, damit sie nur für die bisher verübten Verbrechen gemeinschaftlich gerichtet würden. Allein da sie sich, wie man sieht, wie Unsinnige mit den Banden der Gottlosigkeit umstricken, ziehen sie sich ein schwereres Gericht zu. Denn sie verschonten Anfangs nicht einmal den römischen Bischof Liberius, sondern dehnten ihre Wuth sogar bis auf die dortigen Bewohner aus; und sie scheuten sich nicht, weil dort der apostolische Stuhl ist; sie fürchteten sich nicht, weil Rom die Hauptstadt des römischen Reiches ist; sie erinnerten sich nicht, daß sie dieselben früher in ihren Schreiben apostolische Männer genannt hatten; sondern sie vermischten Alles mit einander, vergassen Alles zusammen, und waren nur auf ihren Eifer für die Gottlosigkeit bedacht. Denn als sie sahen, daß derselbe rechtgläubig sey, die arianische Ketzerei hasse, und sich beeifere, Alle zu bereden, dieselbe zu verabscheuen und zu verlassen, glaubten die Gottlosen, daß sie, wenn sie den Liberius überredeten, Alle schnell besiegen würden; daher verleumdeten sie ihn bei dem Könige. Dieser nun schickte in der Hoffnung, durch den Liberius schnell Alle auf seine Seite zu bringen, einen gewissen Verschnittenen, Namens Eusebius, mit einem Schreiben und mit Geschenken an ihn ab, um ihm durch die Geschenke zu schmeicheln, durch das Schreiben aber zu drohen. Der Verschnittene reiste also nach Rom ab, und forderte zuerst den Liberius auf, gegen den Athanasius zu unterschreiben, und mit den Arianern in Kirchengemeinschaft zu treten, mit dem Beisatze: Der König will dieses und befiehlt dir, es zu thun. Hierauf zeigte er die Geschenke vor, ermahnte ihn, nahm ihn bei den Händen und sagte: Gehorche dem Kaiser, und nimm diese!</p>
      <h2>36</h2><p>Der Bischof aber machte seine Gegenvorstellung und belehrte ihn mit den Worten: Wie kann dieses gegen den Athanasius geschehen? Denn wie können wir den, welchen nicht bloß Eine Synode, sondern auch eine zweite, welche aus allen Welttheilen sich versammelt hatte, mit Recht als unschuldig erklärte, und welchen die römische Kirche mit Frieden erließ, wie können wlr diesen verdammen? Oder wer wird uns Beifall geben, wenn wir denjenigen, welchen wir bei seiner Anwesenheit freundlich empfangen, und zur Kirchengemeinschaft gelassen haben, in seiner Abwesenheit verabscheuen? So lautet nicht der kirchliche Kanon, und eine solche Ueberlieferung haben wir von den Vätern nicht erhalten, obwohl diese von dem seligen und großen Apostel Petrus Ueberlieferungen empfangen haben. Allein wenn dem Könige der Friede der Kirche am Herzen liegt, wenn er befiehlt, das aufzuheben, was bei uns hinsichtlich des Athanasius geschrieben wurde, so werde auch das aufgehoben, was von jenen gegen ihn geschah, so werde aufgehoben, was gegen alle Andere verübt wurde; und dann werde eine Kirchenversammlung fern von dem Palaste veranstaltet, in welcher weder der König zugegen, ist, noch ein Comes Zutritt hat, noch ein Richter droht, sondern die Furcht Gottes allein genügt, und die Anordnung der Apostel, damit auf diese Weise vor Allem der kirchliche Glaube bewahrt werde, wie die Väter in der zu Nicäa gehaltenen Synode bestimmt haben. Die Anhänger des Arius aber sollen hinausgestossen und ihre Ketzerei soll verflucht werden. Dann erst halte man Gericht über dasjenige, weßwegen Athanasius, und etwa auch mancher Andere beschuldiget wird, und über die Klagen, welche gegen jene erhoben werden; dann verstosse man die Schuldigen, lasse aber die Unschuldigen in Sicherheit leben. Denn man darf diejenigen der Synode nicht beizählen, welche hinsichtlich des Glaubens gottlos sind, und es schickt sich nicht, der Untersuchung über den Glauben die Untersuchung über irgend einen andern Gegenstand vorzuziehen. Denn zuerst muß alle Uneinigkeit in Betreff des Glaubens abgeschnitten, und dann erst über die andern Gegenstände eine Untersuchung angestellt werden. Denn unser Herr Jesus Christus heilte die Kranken nicht eher, als bis sie zeigten und erklärten, was für einen Glauben sie an ihn hätten. Dieses haben wir von den Vätern vernommen; dieses berichte dem Könige; denn dieses ist sowohl ihm, als auch dem Baue der Kirche zuträglich. Dem Ursacius und Valens sollte man kein Gehör geben; denn sie haben ihre frühern Vergehen bereut, und ihre Worte verdienen auch jetzt keinen Glauben.</p>
      <h2>37</h2><p>So nun sprach der Bischof Liberius. Der Verschnittene aber ward aufgebracht nicht so fast, weil jener nicht unterschrieb, als vielmehr deßwegen, weil er fand, daß jener ein Feind der Ketzerei sey; er vergaß, daß er vor einem Bischofe stand, entfernte sich unter heftigen Drohungen mit den Geschenken, und erlaubte sich eine gesetzwidrige Handlung, welche schon von Christen ferne seyn sollte, von Verschnittenen aber noch verwegener ist. Denn er ahmte das Vergehen des Saul nach, ging zum Tempel des Apostels Petrus, und legte daselbst die Geschenke nieder. Als aber Liberius dieses erfuhr, zürnte er heftig über den Bewacher des Platzes, weil er denselben nicht verhindert hatte, und warf das Opfer als ein unerlaubtes weg, was den Verschnittenen noch mehr zum Zorne reizte. Er hetzte daher den König auf und sprach: Wir dürfen nicht mehr darum bekümmert seyn, daß Liberius unterschreibe; sondern deßwegen müssen wir besorgt seyn, weil er gegen die Ketzerei so gesinnt ist, daß er namentlich die Arianer mit dem Fluche belegt. Hiezu bewog er auch noch die übrigen Verschnittenen; es sind aber in der Umgebung des Constantius viele, ja lauter Verschnittene, und sie vermögen Alles bei ihm, und ohne diese kann bei ihm nichts geschehen. Der König schrieb also nach Rom, und es wurden wieder Hofbediente, Notare, Comes und Schreiben an den Statthalter abgeschickt, damit sie den Liberius entweder durch List hintergehen, von Rom hinweg führen und zu ihm in das Lager bringen, oder denselben mit Gewalt verfolgen möchten.</p>
      <h2>38</h2><p>Da nun solches geschrieben worden war, entstand dort Furcht und Verfolgung in der ganzen Stadt. Gegen wie viele Familien wurden nun Drohungen ausgestossen? Wie viele erhielten Versprechungen, wenn sie gegen den Liberius handelten, und welche Versprechungen erhielten sie? Wie viele Bischöfe verbargen sich, als sie dieses sahen? Wie viele Freie des weiblichen Geschlechtes zogen sich wegen der Verleumdungen der Christusfeinde in die Dörfer zurück? Wie vielen Asceten bereiteten sie Nachstellungen? Wie Vielen, welche dort sich aufhielten, und dort ihren Wohnsitz hatten, zogen sie nicht die Vertreibung zu? Wie oft und wie sehr bewachten sie den Hafen und die Eingänge der Thore, damit ja kein Rechtgläubiger hinein käme und den Liberius besuchte? Da erfuhr auch Rom die Wuth der Christusfeinde, und erkannte endlich, was es bei dem frühern Hörensagen nicht geglaubt hatte, wie sehr auch die übrigen Kirchen in sämmtlichen Städten von jenen verheert wurden. Verschnittene aber waren es, welche sowohl dieses, als auch Anderes gegen Andere verübten; und das Auffallendste bei der Nachstellung ist dieß, daß die arianische Ketzerei, welche den Sohn Gottes läugnet, von Verschnittenen ihre Unterstützung erhält, welche, wie von Natur, so auch an der Seele unfähig sind, Tugend zu erzeugen, und überhaupt von einem Sohne gar nichts hören können. Der Eunuche aus Aethiopien glaubte, da er nicht verstand, was er las, dem Philippus, welcher ihn über den Heiland belehrte; die Verschnittenen des Constantius aber geben nicht einmal dem Petrus Gehör, wenn er sein Bekenntniß ablegt, ja sie wenden sich sogar von dem Vater hinweg, wenn er seinen Sohn offenbart, und wüthen gegen diejenigen, welche sagen, er sey der wirkliche Sohn Gottes, indem sie so die Ketzerei der Verschnittenen aufrecht zu erhalten suchen, welche behauptet, daß es nichts Wirkliches und Wahres aus dem Vater gebe. Denn darum verbietet auch das Gesetz, dieselben zu einer Kirchenberathung zuzulassen; und doch sieht man diese jetzt als die Herren der kirchlichen Gerichte an; nach ihrem Gutdünken richtet Constantius, und die sogenannten Bischöfe sehen dabei heuchlerisch zu. O! wer wird wohl diese Dinge beschreiben? Wer wird sie einem andern Menschengeschlechte erzählen? Wer wird es glauben, wenn er hört, daß Verschnittene, welchen man kaum die häuslichen Verrichtungen anvertrauen möchte, daß diese jetzt in kirchlichen Angelegenheiten befehlen, und daß der ihnen untergebene Constantius Allen nachstellte, und den Liberius verbannte?</p>
      <h2>39</h2><p>Denn da er häufig nach Rom schrieb, drohte, Abgeordnete sandte, und Nachstellungen bereitete, brach endlich zu Alexandrien die Verfolgung aus, Liberius wurde zum Könige geschleppt und sprach da mit vieler Freimüthigkeit Folgendes: „Laß einmal ab, die Christen zu verfolgen, suche nicht durch uns die Gottlosigkeit in die Kirche einzuführen. Wir sind bereit, lieber Alles zu erdulden, als Ariomaniten genannt zu werden. Zwinge uns, die wir Christen sind, nicht, Christi Feinde zu werden. Auch dieses rathen wir dir: Kämpfe nicht gegen denjenigen, welcher dir diese Herrschaft übergeben hat; zolle ihm statt des Dankes nicht Gottlosigkeit; verfolge die nicht, welche an ihn glauben, damit nicht auch du hörest: Es ist dir schwer, gegen den Stachel auszuschlagen. Doch nein, sondern du sollst es hören, damit du gehorchest, wie der selige Paulus. Sieh! wir sind da, wir sind gekommen, ehe jene eine Beschuldigung erdichtet haben; denn darum haben wir uns beeilt, indem wir wußten, daß uns von dir die Verbannung bevorstehe, damit wir vor der erdichteten Anschuldigung leiden, und es Allen deutlich gezeigt werde, daß auch alle Uebrigen auf dieselbe Weise, wie wir, gelitten haben, daß die wider sie vorgebrachten Beschuldigungen von den Feinden erdichtet wurden, und daß alles, was gegen sie gesagt wurde, nur Verleumdung und Lüge ist.“</p>
      <h2>40</h2><p>So sprach nun damals Liberius, und wurde von Allen bewundert; jener aber befahl, anstatt zu antworten, und verbannte, indem er, was er auch bei den Frühern gethan hatte, einen Jeden von dem Andern trennte. Denn diese Weise zu verbannen hat er selbst erfunden, um in den Strafen noch grausamer, als die Wütheriche und Verfolger vor ihm, zu seyn. Denn bei der frühern Verfolgung ließ Maximianus mehrere Bekenner zugleich mit einander verbannen und milderte durch den Trost der Gesellschaft die Strafe. Dieser aber wurde grausamer als jener, und trennte die von einander, welche beisammen mit Freimüthigkeit sprachen und bekannten; er schied die von einander, welche durch den Glauben vereint waren, damit sie auch sterbend nicht einander sehen möchten, in dem Wahne, daß die körperliche Trennung durchaus auch die Gesinnung der Seele trenne, oder daß sie, von einander abgesondert, der gegenseitigen Eintracht und Einmüthigkeit vergessen würden. Er weiß nämlich nicht, daß, wenn auch ein Jeder abgesondert lebt, doch ein Jeder den Herrn bei sich hat, welchen sie in Gemeinschaft miteinander bekannt haben, und welcher bewirken wird, daß mehr bei einem Jeden sind, (wie er es bei dem Propheten Elisäus gethan hat, als bei dem Constantius Soldaten sind. Wirklich blind ist die Bosheit! denn indem sie die Bekenner dadurch zu betrüben glaubten, daß sie dieselben von einander trennten, haben sie hiedurch vielmehr sich selbst gar sehr geschadet. Denn wären jene beisammen und an einem und demselben Orte, so würde das Verbrechen der Gottlosen nur von Einem Platze aus bekannt. Nun aber haben sie, da sie dieselben trennten, bewirkt, daß der Ruf von ihrer gottlosen Ketzerei und Bosheit überall sich verbreitet und bekannt wird.</p>
      <h2>41</h2><p>Denn wer soll, wenn er diese ihre verübten Gräuelthaten hört, nicht glauben, daß sie Alles eher als Christen seyen? Denn da Liberius den Priester Eutropius und den Diakon Hilarius mit einem Schreiben an den König abgeschickt hatte, zur nämlichen Zeit, als auch Lucifer und seine Gefährten ihr Bekenntniß ablegten, verbannten jene den Priester sogleich, den Diakon Hilarius aber entblößten sie zuerst, schlugen ihm den Rücken mit Geißeln, und verbannten ihn dann, indem sie dabei ausriefen: Warum hast du dich dem Liberius nicht widersetzt, sondern dessen Schreiben überbracht? Dieses thaten aber Ursacius und Valens mit ihren Verschnittenen. Der Diakon pries während der Geißelung den Herrn, eingedenk der Worte desselben. „Meinen Rücken bot ich zur Geißelung hin.“ Jene aber verspotteten und verhöhnten geißelnd den Mann, und errötheten nicht, daß sie einen Leviten mißhandelten; sie hegten lachend die Gesinnungen, welche ihnen geziemten, jener aber verharrte in der Lobpreisung. Denn geschlagen zu werden ist den Christen eigen, Christen zu geißeln aber ist der Verwegenheit des Pilatus und des Kaiphas eigen. So versuchten sie also auch Anfangs die römische Kirche zu stürzen, und versuchten auch dieser ihre Gottlosigkeit einzuflössen. Der verbannte Liberius aber fiel nach einer Zeit von zwei Jahren, und unterschrieb, durch die Androhung des Todes erschreckt. Allein auch dieses beweist eines Theils die Gewaltthätigkeit jener Menschen, andern Theils den Haß des Liberius gegen die Ketzerei, und seine Stimme zu Gunsten des Athanasius, so lange er frei und nach eigenem Gutdünken handeln durfte. Denn was durch die Foltern gegen die anfängliche Meinung entlockt wird, das ist nicht der Wille der Erschreckten, sondern der Wille der Folternden. Sie versuchten also Alles für ihre Ketzerei zu thun. In allen Kirchen aber bewahren die Völker den Glauben, welchen sie gelernt haben, erwarten ihre Lehrer, und verabscheuen insgesammt die gegen Christum kämpfende Sekte, welche sie gezwungen annahmen, wie eine Schlange.</p>
      <h2>42</h2><p>Nach so großen und so vielen Verbrechen glaubten die Gottlosen noch nichts gethan zu haben, so lange der große Hosius ihre Bosheit nicht gefühlt hätte. Denn auch auf diesen so ehrwürdigen Greis suchten sie ihre Wuth auszudehnen; es erfüllte sie nicht mit Scheu der Umstand, daß er der Vater der Bischöfe war, nicht mit Verehrung die Rücksicht darauf, daß er Bekenner war, nicht mit Achtung die lange Dauer seiner Amtsführung, weil er mehr als sechzig Jahre das Amt eines Bischofes verwaltet hatte; sondern sie setzten Alles hintan, und hatten nur die Ketzerei im Auge, als Menschen, welche wirklich weder Gott fürchten, noch vor einem Menschen sich scheuen. Sie gingen also zum Constantius, und bedienten sich abermals folgender Worte: Wir haben Alles gethan; wir haben den römischen Bischof verbannt, und vor ihm sehr viele andere Bischöfe; wir haben alle Gegenden mit Furcht erfüllt. Aber deine so großen Thaten nützen uns nichts, und es ist von uns noch nichts zu Stande gebracht, so lange Hosius übrig ist. Denn so lange dieser unter den Seinigen ist, verbleiben Alle in ihren Kirchen; denn er kann durch sein Wort und seinen Glauben Alle gegen uns verleiten. Dieser führt auch den Vorsitz bei den Synoden, und seinen Schreiben gehorcht man überall. Dieser hat das nicäische Glaubensbekenntniß verfaßt, und überall verkündet, daß die Arianer Ketzer seyen. Wenn also dieser bleibt, so ist die Verbannung der Uebrigen vergebens; denn unsere Sekte wird verdrängt. Beginne also auch diesen zu verfolgen, und habe mit ihm, obschon er Greis ist, kein Mitleid; denn unsere Sekte weiß auch die grauen Haare der Greise nicht zu ehren.</p>
      <h2>43</h2><p>Nachdem der König dieses vernommen hatte, zauderte er nicht, sondern befahl, weil er den Mann und das Ansehen des Greises wohl kannte, ihm durch ein Schreiben, zu ihm zu kommen zu der Zeit, als er auch den Liberius anfangs versuchte. Als nun derselbe gekommen war, ersuchte und ermahnte er ihn mit den gewöhnlichen Worten, durch welche er auch die Andern zu hintergehen hoffte, daß er gegen uns schreiben und mit den Arianern Kirchengemeinschaft haben sollte. Der Greis aber, welcher dieses mit Widerwillen angehört hatte und darüber betrübt war, daß er so etwas auch nur sagte, erschütterte ihn, beredete ihn, und kehrte so in sein Vaterland und in seine Kirche zurück. Da aber die Ketzer sich darüber beklagten, und wieder aufheizten, auch die Verschnittenen ermahnten und immer mehr aufregten, schickte endlich der König ein Schreiben mit Drohungen ab, und Hosius wurde mißhandelt, aber durch die Furcht vor der Nachstellung nicht von seiner Meinung abgebracht; sondern er blieb fest auf seiner Gesinnung und sprach, weil er das Haus seines Glaubens auf den Felsen gebaut hatte, mit Freimüthigkeit gegen die Ketzerei, indem er die Drohungen in den Briefen für Wassertropfen und für Windstösse hielt. Da nun Constantius öfter schrieb, indem er ihm bald wie einem Vater schmeichelte, bald drohte und die Verbannten nannte mit den Worten: Du bist noch der Einzige, welcher der Ketzerei widerstrebt. Gehorche und schreibe gegen den Athanasius; denn wer wider diesen schreibt, der wird ganz arianisch mit uns denken; bebte Hosius nicht, sondern schrieb, obgleich er Mißhandlungen erduldete, Folgendes; wir haben den Brief gelesen, und fügen eine Abschrift davon bei.</p>
      <h2>44</h2><p><strong>Hosius wünscht dem Könige Constantius Freude in dem Herrn.</strong> Ich habe mein Bekenntniß zum ersten Male abgelegt, als unter deinem Anherrn Maximianus die Verfolgung wüthete. Wenn aber auch du mich verfolgst, so bin ich auch jetzt bereit, eher Alles, was es nur immer sey, zu erdulden, als unschuldiges Blut zu vergießen und an der Wahrheit ein Verräther zu werden. Deine Worte finden, wenn du solches schreibest und drohest, bei mir keinen Eingang. Höre auf solches zu schreiben, und sey nicht arianisch gesinnt, höre die Orientalen nicht an, und schenke dem Ursacius und Valens keinen Glauben. Denn was diese reden, sagen sie nicht wegen des Athanasius, sondern wegen ihrer Ketzerei. Glaube mir, Constantius! mir, der ich dem Alter nach dein Großvater seyn könnte. Ich wohnte der Synode zu Sardica bei, als ihr, du und dein Bruder Constans seligen Andenkens, uns alle zusammenberiefet. Und ich selbst forderte die Feinde des Athanasius auf, als sie in die Kirche kamen, in welcher ich mich befand, sie sollten, wenn sie etwas gegen ihn hätten, es vorbringen. Ich versprach ihnen Sicherheit, und versicherte sie, daß sie nichts anders zu erwarten hätten, als in Allem ein gerechtes Urtheil. Dieses that ich aber nicht ein Mal, sondern zwei Mal, indem ich sie aufforderte, sie sollten, wenn sie nicht vor der ganzen Synode wollten, wenigstens vor mir allein die Sache vorbringen; und ich fügte wieder die Versicherung bei: Wenn Athanasius schuldig gefunden wird, so wird er auch von uns gänzlich ausgestossen werden, wird er aber unschuldig gefunden, überführt er euch als Verleumder, und ihr weiset den Mann dennoch zurück, so werde ich selbst den Athanasius bereden, mit mir nach Spanien zu reisen. Und diesen Bedingungen unterwarf sich Athanasius ohne Widerspruch. Jene aber verweigerten, weil sie von Allem, was sie zu sagen hatten, keinen guten Erfolg sich versprachen, dieses gleichfalls. Athanasius aber begab sich wieder an dein Hoflager, da du ihn durch ein Schreiben dahin beschiedest, und stellte die Bitte, seine Feinde, welche eben in Antiochien zugegen waren, entweder alle mit einander, oder einen Jeden von ihnen einzeln rufen zu lassen, damit entweder sie ihn überführten, oder selbst überführt würden, und sie ihn entweder in seiner Gegenwart als einen solchen, wie sie ihn geschildert hatten, darstellten, oder in seiner Abwesenheit nicht verleumdeten. Du aber achtetest auf seine Worte nicht, und jene lehnten dieses ab. Warum gibst du also seinen Verleumdern noch Gehör? Wie kommt es, daß du den Ursacius und Valens noch geduldig anhörst, da sie doch Buße gethan und ihre Verleumdung schriftlich bekannt haben? Sie haben ja bekannt, ohne daß sie Gewalt litten, wie sie vorgeben, ohne daß sie von Soldaten genöthiget wurden, ohne daß dein Bruder etwas davon wußte; denn so etwas, wie jetzt geschieht, geschah unter ihm nicht, dieß sey ferne! sondern sie kamen freiwillig nach Rom, und schrieben dieses in Gegenwart des Bischofes und der Priester nieder, nachdem sie zuvor auch dem Athanasius einen freundschaftlichen und friedlichen Brief geschrieben hatten. Geben sie aber vor, daß man gewalthätig verfahren sey, sehen sie dieses für unerlaubt an, und billigest auch du es nicht; so höre auf, Gewalt zu gebrauchen, und schicke keine Briefe, keine Comes mehr; sondern rufe die Verbannten zurück, damit nicht, während du die Anwendung der Gewalt tadelst, jene eine noch größere Gewaltthätigkeit verüben. Denn was hat Constans gethan, welches diesem ähnlich wäre? Welcher Bischof wurde verbannt? Wann erschien er bei einer kirchlichen Untersuchung mitten in der Versammlung? Welcher seiner Hofbeamten zwang jemals Einen, gegen Jemanden zu unterschreiben, daß Valens und seine Anhänger so etwas aussagen? Höre auf, ich beschwöre dich, und bedenke, daß du ein sterblicher Mensch bist. Fürchte den Tag des Gerichtes, und bleibe rein von Schuld bis zu jenem Tage. Mische dich nicht in kirchliche Dinge, und gib uns über solche keine Befehle; sondern lerne sie vielmehr von uns. Gott hat dir die Regierung des Reiches übergeben, uns die Verwaltung der Kirche anvertraut. Und wie derjenige, welcher deine Herrschaft an sich zieht, der Anordnung Gottes sich widersetzt, so hüte auch du dich, die Gerechtsame der Kirche an dich zu reißen, und dich dadurch eines schweren Vergehens schuldig zu machen: „Gebet,“ steht geschrieben, „dem Kaiser, was des Kaisers ist, und Gott, was Gottes ist.“ Eines Theils ist es also uns nicht erlaubt, über die Erde zu herrschen, andern Theils hast du, o König! keine Gewalt in geistlichen Dingen. Dieses nun schreibe ich nur aus Sorgfalt für dein Heil; was aber den Inhalt deines Schreibens betrifft, habe ich folgende Gesinnung: Ich trete mit den Arianern in keine Gemeinschaft, sondern verfluche ihre Ketzerei, und gegen den Athanasius schreibe ich nicht, welchen wir und die römische Kirche und die ganze Synode als unschuldig erklärt haben. Daß er unschuldig sey, hast auch du eingesehen; deßwegen hast du den Mann zu dir beschieden, und ihm erlaubt, mit Ehren in sein Vaterland und in seine Kirche zurückzukehren. Was ist nun die Ursache der so großen Veränderung? Denn seine Feinde sind noch dieselben, welche sie früher waren; und was sie jetzt murmeln, denn in seiner Gegenwart sagen sie nichts, das haben sie auch schon früher, ehe du den Athanasius zu dir beschiedest, gesagt, das haben sie, als sie zur Synode kamen, verbreitet, davon konnten sie aber, als sie, wie ich oben sagte, von mir aufgefordert wurden, keine Beweise vorbringen; denn hätten sie solche gehabt, so wären sie nicht so schimpflich entflohen. Wer also hat dich verleitet, daß du nach einer so langen Zeit deiner Schreiben und deiner Worte vergaßest? Halte ein, und folge den schlechten Menschen nicht, damit du nicht wegen ihrer Verbindung unter einander dich selbst strafbar machest. Denn was du ihnen jetzt gestattest, darüber wirst du am Tage des Gerichtes allein Rechenschaft geben müssen. Diese wollen ihrem Feinde vermittelst deiner Hülfe Unrecht zufügen, und dich wollen sie zum Diener ihrer sträflichen Absichten machen, um durch dich die abscheuliche Ketzerei in der Kirche auszusäen. Es ist aber nicht klug, wegen des Vergnügens Anderer sich in eine augenscheinliche Gefahr zu stürzen. Laß also ab, ich beschwöre dich, und gehorche mir, o Constantius! denn es steht mir zu, dieses zu schreiben, und dir, es nicht zu verachten.</p>
      <h2>45</h2><p>So nun dachte und schrieb der abrahamische Greis, der wahrhaft Heilige (Osioj). Jener aber ließ von seinen Nachstellungen nicht ab, und hörte nicht auf, einen Anlaß wider ihn ausfindig zu machen, sondern fuhr mit seinen furchtbaren Drohungen fort, um ihn entweder durch Gewalt zur Aenderung seiner Meinung zu verleiten, oder wenn er nicht gehorchen würde, des Landes zu verweisen. Wie nun die babylonischen Anführer und Satrapen gegen den Daniel keinen Anlaß fanden, ausser in den Gesetzen seines Gottes, so konnten auch die jetzigen Satrapen der Gottlosigkeit keinen andern gegen den Greis ersinnen. Denn Jedermann kannte den wahrhaft Heiligen, und sein Lebenswandel war untadelhaft, wenn man nicht seinen Haß gegen die Ketzerei tadeln wollte. Sie verleumdeten ihn also, nicht wie jene den Daniel bei dem Darius, denn Darius hörte die Anklage gegen den Daniel mit Mißvergnügen, sondern wie Jezabel den Naboth, und wie die Juden bei dem Herodes, indem sie sprachen: Er unterschreibt nicht nur nicht gegen den Athanasius, sondern verdammt uns sogar wegen desselben, und haßt die Ketzerei so sehr, daß er auch an Andere schreibt, sie sollten lieber den Tod erdulden, als an der Wahrheit Verräther werden. Denn wegen derselben (sagt er) wird unser lieber Athanasius verfolgt, und wegen derselben wird dem römischen Bischöfe Liberius und allen Andern nachgestellt. Da Constantius, der Beschirmer der Gottlosigkeit und der König der Sekte, dieses und besonders, daß in Spanien auch noch Andere mit dem Hosius gleiche Meinung haben, gehört hatte, versuchte er auch diese, ob sie nicht unterschreiben möchten, und da er sie dazu nicht zwingen konnte, ließ er den Hosius kommen, und hielt ihn, anstatt ihn zu verbannen, ein ganzes Jahr zu Sirmium gefangen, indem der Gottlose Gott nicht fürchtete, der Ruchlose die freundschaftliche Gesinnung seines Vaters gegen den Hosius nicht ehrte, und der Unmensch das hohe Alter nicht achtete. Denn dieses Alles hielt er um der Ketzerei willen für nichts, er, der neue Achad, und ein zweiter Balthasar unserer Zeit. Denn er verfuhr so gewaltthätig gegen den Greis, und hielt ihn so lange gefangen, bis er endlich den Leiden unterlag, und mit harter Mühe mit Valens und Ursacius Gemeinschaft machte, aber wider den Athanasius nicht unterschrieb. Allein auch dieses ließ der Greis nicht unbeachtet, denn da er dem Tode nahe war, bezeugte er die gegen ihn gebrauchte Gewalt wie in einem Testamente, verfluchte die arianische Ketzerei, und sprach die Warnung aus, daß dieselbe Niemand annehmen sollte.</p>
      <h2>46</h2><p>Wer wird, wenn er dieses sieht, oder auch nur hört, nicht von Staunen ergriffen, und nicht zum Herrn rufen mit den Worten: „Willst du denn Israel zur Vernichtung hingeben?“ Wer wird, wenn er dieses erwägt, nicht zur rechten Zeit zum Herrn aufrufen: „Dinge geschahen in diesem Lande, über welche man erstaunen und sich verwundern muß,“ und: „Es erstaunte der Himmel darüber, und die Erde entrüstete sich sehr.“ Die Väter der Völker und Lehrer des Glaubens werden weggenommen, und die Gottlosen in die Kirchen eingeführt. Wem wurde es, wenn er sah, wie der römische Bischof Liberius des Landes verwiesen wurde, und der Vater der Bischöfe, der große Hosius, so vieles erduldete, oder wem wurde es, da er sah, daß so viele Bischöfe aus Spanien und andern Gegenden verbannt wurden, wenn er auch nur ein wenig Verstand hatte, nicht einleuchtend, daß auch die Beschuldigungen gegen den Athanasius und die Andern erdichtet seyen, und daß Alles voll Verleumdung sey? Denn darum wollten auch jene gerne Alles erdulden, weil sie einsahen, daß die Nachstellung nur eine Folge der Verleumdung der Ketzer sey. Denn welches ist das Verbrechen des Liberius? Oder welches ist die Beschuldigung gegen den Greis Hosius? Wer hat gegen den Paulinus, den Lucifer, den Dionysius und den Eusebius auch nur eine unwahre Anklage vorgebracht? Oder welches ist das Vergehen der übrigen verbannten Bischöfe, Priester und Diakonen? Es gibt keines, dieses sey ferne! Denn nicht wegen Verbrechen wurden die Ränke angesponnen, und nicht einer Anklage wegen wurde ein Jeder verbannt; sondern dieses ist nur ein Angriff der Gottlosigkeit auf die Frömmigkeit, und ein Eifer für die arianische Ketzerei, aber auch ein Vorspiel der Ankunft des Antichristen, welchem Constantius den Weg vorbereitet.</p>
      <h2>47</h2><p>Denn nachdem er Alles, was er wollte, wider die Kirchen Italiens und anderer Länder verübt, nachdem er die Einen des Landes verwiesen, die Andern aber durch Gewalt gezwungen, und überall Alles mit Schrecken erfüllt hatte, kehrte er endlich, wie eine Krankheit, seine Wuth gegen Alexandrien. Schlau aber wurde dieses von den Feinden Christi angefangen; denn damit sie die Unterschriften vieler Bischöfe aufweisen könnten, und damit der verfolgte Athanasius keinen Bischof mehr hätte, bei dem er sich doch wenigstens beklagen könnte, erfüllten sie im Voraus überall Alles mit Schrecken, und diesen Schrecken behielten sie im Rückhalte zu ihren Nachstellungen auf, indem sie nicht einsahen, die Unverständigen, daß sie nicht den freien Willen der Bischöfe, sondern die von ihnen verübte Gewalt vorzeigten, und daß, wenn auch Brüder verlassen, wenn auch Freunde und Verwandte sich weit zurückziehen, und wenn Niemand mehr gefunden wird, welcher Mitleid hätte und tröstete, doch bei Gott eine hinlängliche und Alles übertreffende Zufluchtsstätte sey. Denn allein war auch Elias, als er verfolgt wurde, und Gott war dem Heiligen Alles in Allem. Dieses Vorbild hat auch der Heiland aufgestellt, welcher, nachdem er ergriffen worden, den Nachstellungen der Feinde allein Preis gegeben war, damit wir, wenn auch wir bei der Verfolgung von den Menschen verlassen werden, den Muth nicht verlieren, sondern auf ihn hoffen und die Wahrheit nicht verrathen, welche, wenn sie auch Anfangs unterdrückt zu werden scheint, doch in der Folge auch die Verfolger anerkennen werden.</p>
      <h2>48</h2><p>Sie reizten also den König auf, und dieser schrieb zuerst, und schickte Drohungen an den Dux und die Soldaten. Ferner wurden Diogenius und Hilarius als Notare, und mit ihnen Palatine abgesendet. Und nun geschahen jene so argen und grausamen Dinge wider die Kirche, welche kurz vorher in wenigen Worten geschildert worden sind, und die Alle aus den Zeugnissen kennen, welche die Völker gegeben haben, und welche am Schlusse dieser Schrift beigefügr sind, und die ein Jeder lesen kann. Nach diesen Gräuelthaten des Syrian, nach den so großen Verbrechen und den Mißhandlungen der Jungfrauen ließ jener, solche Schandthaten und Vergehen billigend, abermals ein Schreiben an den Senat und an das Volk zu Alexandrien ergehen, in welchem er die jungen Leute aufreizte, damit sie entweder Alle mit einander vereint den Athanasius verfolgen, oder wissen möchten, daß sie seine Feinde würden. Aber dieser hatte sich, ehe noch diese Dinge hereinbrachen, seitdem Syrianus über die Kirche hergefallen war, entfernt, weil er wußte, daß geschrieben steht: „Verbirg dich auf eine kurze Weile, auf einen Augenblick, bis der Zorn vorüber ist.“ Der Ueberbringer dieser Schreiben aber war ein gewisser Heraklius, mit der Würde eines Comes, der Vorläufer eines gewissen Georgius, welcher von dem Könige als Spion gesandt wurde; denn der von ihm Geschickte war kein Bischof; dieses sey ferne! wie es auch die Vorfälle und das Vorspiel seines Einzuges beweisen.</p>
      <h2>49</h2><p>Er machte also die Schreiben öffentlich bekannt, und diese gereichten dem Verfasser derselben zu einer großen Schande. Denn da er, wie der große Hosius geschrieben hatte, keinen wahrscheinlichen Vorwand für seine Umänderung finden konnte, erdachte er einen für ihn und seine Rathgeber noch weit ungeziemendern; denn er sagte: „Aus Achtung für die Freundschaft meines Bruders, göttlichen und frommen Andenkens, gestattete ich dem Athanasius auf eine bestimmte Zeit zu euch zu kommen.“ Dieses beweist aber, daß er in seinen Versprechungen täusche, und gegen seinen Bruder nach dessen Tode unbillig sey. Ferner nennt er ihn eines göttlichen und frommen Andenkens, wie er es auch wirklich ist, würdig, dessen Befehl und Freundschaft er, wie er schrieb, wenn er auch des Athanasius Rückkehr nur zu Gunsten des Constans, seligen Andenkens, gestattet hätte, nicht hätte unbeachtet lassen und gegen welchen er sich nicht pflichtvergessen hätte zeigen sollen, damit er, wie seines Reiches, so auch seiner Gesinnung Erbe wäre. Allein er setzte, da er, was gerecht ist, fordern wollte, den Vetranio ab, mit den Worten: Wem gehört nach dem Tode der Brüder das Erbe? Wegen der abscheulichen gegen Christum kämpfenden Ketzerei aber weiß er nicht, was gerecht ist, sondern wird sogar gegen seine Brüder unbillig. Wegen dieser Ketzerei fiel es ihm auch nicht einmal ein, die Ansicht seines Vaters unverletzt zu bewahren; sondern er nimmt zwar, in so weit es den Gottlosen gefällt, den Schein an, sich an dieselbe halten zu wollen; sobald ihnen aber dieses mißfällt, weiß er nicht einmal die dem Vater schuldige Ehrfurcht zu beobachten. Denn dieser schickte zwar der Verleumdung des Eusebius und seiner Anhänger zu Folge den Bischof auf einige Zeit nach Gallien, wegen der Grausamkeit seiner Verfolger; er gehorchte aber den Eusebianern nicht, und schickte nicht den Bischof, welche jene dahin senden wollten, sondern verhinderte sie vielmehr in ihrem Vorhaben, und hielt sie, da sie es versuchten, durch heftige Drohungen ab.</p>
      <h2>50</h2><p>Warum hat er nun, wenn er den Willen seines Erzeugers, wie er schreibt, beachten wollte, zuerst den Gregorius, jetzt aber den Räuber Georgius geschickt? Oder warum bestrebt sich dieser die Arianer, welche jener Porphyrianer nannte, in die Kirche einzuführen, und warum verweiset er, während er diese begünstiget, Andere aus dem Lande? Denn obgleich sein Vater den Arius vor sein Angesicht hatte kommen lassen, so verlor doch Arius, als er falsch geschworen hatte, und mitten entzwei geborsten war, das Wohlwollen des Vaters; denn sobald er den Vorfall vernommen hatte, verabscheute er fortan den Arius als einen Ketzer. Warum hat er, da er um den kirchlichen Kanon sich zu bekümmern heuchelte, Alles wider den Kanon zu thun versucht? Denn welcher Kanon befiehlt, einen Bischof vom Palaste aus zu senden? Welcher Kanon sagt, daß Soldaten in die Kirchen einfallen sollen? Oder von wem rührt die Ueberlieferung her, daß Comes und unverständige Verschnittene in kirchlichen Angelegenheiten gebieten und durch einen Befehl das Urtheil so genannter Bischöfe bekannt machen? Jede Lüge erlaubt er sich der verruchten Sekte zu Liebe; denn eines Theils schickte er wider die Ansicht seines Vaters damals den Philagrius zum zweiten Male als Präfekten, andern Theils wurden jetzt diese Gräuelthaten verübt, und er redet hinsichtlich seines Bruders nicht die Wahrheit; denn er schrieb nach dem Tode desselben nicht ein Mal, nicht zwei Mal, sondern drei Mal an den Bischof, und gab ihm wiederholt die Zusicherung, daß er seine Gesinnung nicht ändern werde; ja, er ermunterte ihn, die zuversichtliche Hoffnung zu hegen, daß er von Niemanden beunruhiget, sondern ganz ungestört in seiner Kirche bleiben werde. Und er schickte durch den Comes Asterius und den Notar Palladius dem damaligen Dux Felicissimus und dem Präfekten Nestorius Befehle zu, daß sie, wenn der Präfekt Philippus oder irgend ein Anderer es wagen sollte, dem Athanasius nachzustellen, diesen hieran hindern sollten.</p>
      <h2>51</h2><p>Denn darum haben auch, als Diogenes ankam, und Syrianus Nachstellungen bereitete, jener, wir und das Volk ein Schreiben des Königes verlangt, in der Meinung, daß, wie geschrieben steht: „Keine Lüge soll dem Könige aus dem Munde kommen,“ so der König, da er seine Zusicherung gegeben hatte, weder die Unwahrheit reden, noch seine Gesinnung ändern werde. Warum hat er nun, wenn er uns bloß wegen des Bruders die Rückkehr gestattete, auch nach dessen Tode geschrieben? Wenn er aber auch damals wegen der Erinnerung an jenen schrieb, warum vergaß er ihn nachher so ganz und gar, daß er den Mann verfolgte, und warum handelt er, obwohl er in seinen Schreiben das Urtheil der Bischöfe zum Vorwande gebraucht, doch in Allem so, wie es ihm gut dünkt, da er es doch nicht verbergen kann, und da die Beweise seiner Verschmitztheit nahe liegen? Denn ist es das Urtheil der Bischöfe, was geht es dann den König an? Ist es aber die Drohung des Königes, wozu sind dann da die sogenannten Bischöfe nöthig? Denn wann ist zu irgend einer Zeit so etwas gehört worden? Wann hat ein Beschluß der Kirche von dem Könige Rechtskraft erhalten, oder wann ist überhaupt sein Urtheil hierin als gültig anerkannt worden? Viele Synoden sind vor dieser Zeit gehalten, viele Beschlüsse der Kirche sind gefaßt worden, aber niemals haben die Väter den König zur Beistimmung beredet, und nie hat sich ein König in die ausser seiner Sphäre liegenden Angelegenheiten der Kirche gemischt. Der Apostel Paulus hatte Freunde aus dem Hause des Kaisers, in deren Namen er die Philipper in seinem Sendschreiben grüßte; aber er zog sie nie als Theilnehmer zur Fassung der Beschlüsse. Jetzt aber haben wir ein neues Schauspiel, und dieses ist eine Erfindung der arianischen Sekte. Denn die Ketzer und der König Constantius sind mit einander darin übereingekommen, daß einerseits dieser unter dem Vorwande der Bischöfe gegen alle, gegen welche er wollte, frei verfahren, und obschon er verfolgte, doch nicht Verfolger genannt werden sollte, andererseits aber die Ketzer, mit der Macht des Königes bekleidet, allen, welchen sie wollten, Nachstellungen sollten bereiten dürfen/; sie wol-len aber denjenigen nachstellen, welche nicht gottlos sind, wie sie. Dieses kann man sie aber wie auf einem Theater als eine Komödie aufführen sehen, indem nämlich die sogenannten Bischöfe die Schauspieler machen, Constantius aber ihr Spiel leitet und wie Herodes der Herodias Versprechungen macht; jene dagegen sieht man im pantomimischen Tanze ihre Verleumdungen vorstellen, welche die Verbannung und den Mord derjenigen zum Zwecke haben, welche gegen den Herrn ehrfurchtsvolle Gesinnungen hegen.</p>
      <h2>52</h2><p>Wem haben sie nun durch ihre Verleumdungen nicht geschadet? Wem haben jene Christusfeinde nicht nachgestellt? Wen, der von ihnen angeklagt worden war, hat Constantius nicht des Landes verwiesen? Wann hat er ihnen nicht freudig Gehör gegeben? Und was das Auffallendste ist, wen, der gegen jene sprach, hat er jemals angehört, und hat er nicht vielmehr jene, was sie auch immer vorbrachten, gerne vorgelassen? Welche Kirche betet jetzt Christum mit Freiheit an? Denn ist sie fromm, so schwebt sie in Gefahr; verstellt sie sich aber, so schwebt sie in Furcht. Er hat Alles, so viel in seiner Macht stand, mit Heuchelei und Gottlosigkeit erfüllt. Denn wenn noch irgendwo ein frommer und Christum liebender Mensch ist, (es sind aber überall viele solche, wie die Propheten und der große Elias waren,) so verbergen sie sich, wenn auch sie irgendwo einen treuen Mann, wie den Abdias, finden, oder wenn sie in eine Höhle und in die Schluchten der Erde sich zurückziehen, oder in Wüsten herumirren und verweilen können. Denn jene Wahnsinnigen bringen solche Verleumdungen vor, wie Jezabel gegen den Naboth, und die Juden wider den Heiland erdichtet haben. Und da er ein Begünstiger der Ketzerei ist, und die Wahrheit stürzen will, so wandelt er, wie Achab, den Weinberg in einen Gemüsegarten um, und thut, was jene wollen, weil auch er, was er wünschte, von ihnen gehört hat.</p>
      <h2>53</h2><p>So hat er, wie ich oben gesagt habe, die wirklichen Bischöfe, weil sie nicht, wie er wollte, gottlos waren, verbannt; so hat er jetzt auch gegen den Athanasius den Comes Heraklius geschickt, welcher die Befehle öffentlich vorlegte und die Aufträge des Königes bekannt machte, daß, wenn sie dem Schreiben nicht Folge leisteten, das Brod weggenommen, die Götzenbilder umgestürzt, und viele Staatsbeamte und Leute aus dem Volke schlechthin verhaftet werden sollten. Nach diesen Drohungen schämte er sich nicht öffentlich mit lauter Stimme auszurufen: Der König verabscheut den Athanasius und hat befohlen, den Arianern die Kirchen zu übergeben. Da Alle sich hierüber wunderten, einander winkten und sagten: Ist denn Constantius ein Ketzer geworden? hätte sich jener schämen sollen, er aber nöthigte vielmehr die Senatoren, die heidnischen Obrigkeiten und die Aufseher der Götzentempel, dieses zu unterschreiben und zu erklären, daß sie denjenigen als Bischof aufnehmen wollten, welchen der König schicken würde. Indem Constantius dieses thun ließ, hat er allerdings die kirchlichen Kanone beobachtet; denn anstatt der Kirche forderte er den Marktplatz, anstatt der Kirchengemeinden die Tempelaufseher zur Unterschrift auf; er wußte nämlich, daß er nicht den Christen einen Bischof, sondern denen, welche unterzeichneten, einen streitsüchtigen Menschen schicke.</p>
      <h2>54</h2><p>Heiden also, welche gleichsam durch diese Unterschrift die Unverletzbarkeit ihrer Götzen erkauften, und Einige von den Landleuten haben, als wenn es sich um einen abgeschickten Dux oder irgend einen andern Richter handelte, obwohl ungerne, doch aus Furcht vor seinen Drohungen unterschrieben. Denn was wollten sie, da sie Heiden waren, anders thun, als das, was dem Könige gefällt? Nachdem aber die Gläubigen in der großen Kirche sich versammelt hatten, es war nämlich Samstags um 4 Uhr, nahm am folgenden Tage der Comes Heraklius den Präfekten Aegyptens Kataphronius, den Procurator Faustinus und den Ketzer Bithynus mit sich, und diesem hetzten die jungen Leute auf dem Marktplatze und die Götzendiener auf, indem sie sagten, dieses sey der Befehl des Königes, daß sie in die Kirche hineinstürzen und die Gläubigen steinigen sollten. Als nun bereits die Meisten von dem Volke nach der Entlassung sich entfernt hatten, und nur wenige Weibspersonen zurückgeblieben waren, geschah das, was sie befohlen hatten, und es war ein trauriger Auftritt. Denn so eben hatten sich Einige nach der Beendigung des Gebetes niedergesetzt, da stürzten plötzlich jene junge Leute mit Steinen und Prügeln nackt herein, steinigten die Einen, zerfleischten in ihrer Gottlosigkeit die geweihten Leiber der Jungfrauen, rissen ihnen die Schleier herab, entblößten ihre Häupter, und stießen sie, da sich dieselben sträubten, mit den Füssen, die Ruchlosen. Zwar war dieses schon arg und sehr grausam; aber was darauf folgte, war noch ärger und unerträglicher, als jede Schmach. Da sie nämlich die Ehrbarkeit und die Reinheit der Ohren der Jungfrauen kannten, und wußten, daß dieselben lieber Steine und Schwerter, als anstößige Worte ertragen würden, bedienten sie sich solcher, als sie über dieselben herfielen; diese Worte legten aber die Arianer den jungen Leuten in den Mund; denn über solche Worte und Schandthaten lachten sie. Die heiligen Jungfrauen und andere ehrbare Frauen aber flohen vor solchen Worten, wie vor Schlangen-Bissen; die Feinde Christi hingegen unterstützten die jungen Leute, ja sie sagten vielleicht Aehnliches, wie diese; denn sie fanden an den schmutzigen Reden derselben Vergnügen.</p>
      <h2>55</h2><p>Hierauf schleppten sie, um den Befehl ganz zu vollziehen, (denn dahin ging ihr Streben, dieses hatten der Comes und der Procurator befohlen,) die Bänke, den Bischofsstuhl, den Tisch, denn er war von Holz, die Vorhänge der Kirche, und alles Uebrige, was sie konnten, hinaus, verbrannten es auf der großen Straße vor dem Thore, und warfen Weihrauch in das Feuer. O! wer sollte, wenn er dieses hört, nicht weinen, ja vielmehr nicht seine Ohren verschließen, damit er nicht einmal einen Andern, wenn er solches erzählt, anhöre, in der Meinung, daß auch schon das Anhören einer solchen Sache ihm schaden werde? Denn die Heiden priesen ihre Götzen und sagten: Constantius ist ein Heide geworden, und die Arianer geben unserer Religion Beifall; denn sie tragen kein Bedenken, sich wie Heiden zu betragen, damit nur ihre Sekte Bestand erhält. Denn sie hatten sogar im Sinne, das junge Rind, welches in dem Cäsarium die Gärten bewässerte, zu opfern, und hätten es auch geopfert, wenn es nicht weiblichen Geschlechtes gewesen wäre; denn solche, sagten sie, sey ihnen nicht erlaubt zu opfern.</p>
      <h2>56</h2><p>Solche Gräuelthaten also verübten die gottlosen Arianer mit den Heiden, in der Meinung, daß uns diese zur Schmach gereichen. Allein die göttliche Strafe wies ihre Gottlosigkeit nach, und wirkte ein großes und ausnehmendes Wunder, durch welches sie Allen deutlich zeigte, daß, wie sie in ihrer Gottlosigkeit keinen Andern, als den Herrn bekämpfen, so sie auch durch diese Vergehen wieder über ihn Schmach zu bringen suchten. Und dieses wurde durch das geschehene Wunder noch klarer erwiesen. Denn ein junger Mensch aus den Unverschämten drang hinein, wagte es, sich auf den Bischofsstuhl zu setzen, und nachdem er sich gesetzt hatte, näselte der Elende gewisse unzüchtige Töne her, stand dann auf, und versuchte den Stuhl mit Gewalt wegzureissen, und an sich zu ziehen; er wußte aber nicht, daß er die göttliche Strafe an sich ziehe. Denn wie die ehemaligen Bewohner von Azot, als sie es gewagt hatten, die Bundeslade zu berühren, welche auch nur anzuschauen ihnen nicht erlaubt war, von derselben sogleich vernichtet wurden, nachdem sie vorher durch die Schmerzen am Steiß gequält worden waren, ebenso wagte es auch dieser Elende, den Stuhl wegzureissen, riß, was er wegriß, zu seinem eigenen Verderben an sich, verwundete, wie wenn die Strafe das Holz gegen ihn lenkte, mit demselben seinen eigenen Unterleib, trug anstatt des Stuhles die der Verwundung zu Folge hervorgetretenen Eingeweide, und der Stuhl nahm vielmehr sein Leben hinweg, als daß er von ihm hinweggenommen worden wäre. Herausgefallen sind also, wie von dem Judas geschrieben steht, seine Eingeweide, er stürzte zusammen, wurde weggetragen, und starb einen Tag hernach eines elenden Todes. So wurde auch ein Anderer, welcher mit Oelzweigen hineintrat, als Heide dieselben mit der Hand bewegte und ein Hohngelächter ausstieß, plötzlich von Finsterniß umgeben; er sah nichts mehr, und wußte nicht, wo in der Welt er wäre; und da auch dieser im Begriffe war niederzustürzen, wurde er von seinen Gefährten an der Hand geführt und unterstützt, und ging so hinaus; als er aber am folgenden Tage mit Mühe zum Bewußtseyn gekommen war, wußte der Frevler weder, was er verübt hatte, noch in welchem Zustande er gewesen war.</p>
      <h2>57</h2><p>Als die Heiden dieses sahen, fürchteten sie sich, und wagten nichts weiteres mehr; die Arianer hingegen schämten sich auch jetzt noch nicht, sondern glaubten wie die Juden, obschon sie Zeichen sahen, dennoch nicht, die Ungläubigen! denn sie waren vielmehr, wie Pharao, verhärtet, indem auch sie ihre Hoffnungen auf Abgründe setzten, auf den König nämlich und seine Eunuchen. Die Heiden also, ja vielmehr der Auswurf der Heiden, ließen sie die eben angegebenen Frevelthaten verüben; denn sie hatten für sich hiezu einen Schauspieler, der die Heiden aufreizte, den Faustinus, welcher zwar dem Namen nach Procurator, seinem Wandel nach aber ein Pflastertreter und ausschweifender Mensch war. Die Arianer aber suchten durch sich selbst etwas Aehnliches, wie diese, zu verüben, um, wie sie ihre Ketzerei aus den andern Ketzereien geschöpft haben, so auch ihre Schlechtigkeit mit den Ausgelassenem zu theilen. Das Uebrige also verübten sie, wie ich oben sagte, mit Hülfe jener Menschen; ihre eigenen Frevelthaten aber, wie übertreffen diese nicht alle Schlechtigkeit, wie übersteigen sie nicht die Bosheit eines jeden Henkers? Denn welche Wohnung haben sie nicht zerstört? Welches Haus haben sie unter dem Vorwande, Nachforschungen anzustellen, nicht geplündert? Welchen Garten haben sie nicht zertreten? welches Grab nicht geöffnet? zwar unter dem Vorwande, den Athanasius aufzusuchen, im Ganzen aber aus keiner andern Absicht, als zu rauben und die ihnen Begegnenden auszuplündern. Wie viele Häuser wurden versiegelt? Von wie Vielen gaben sie das, was in den Hospitälern war, den Soldaten, ihren Gehülfen? Wer hat ihre Bosheit nicht erfahren? Wer ist ihnen begegnet, und hat sich nicht auf dem Marktplatze versteckt? Wer hat wegen dieser Menschen nicht sein Haus verlassen, nicht die Nacht in der Wüste zugebracht? Wer hat nicht, da er seine Habe vor ihnen sichern wollte, das Meiste verloren? Wer wollte, obwohl er der Seefahrt unkundig war, nicht lieber auf das Meer sich begeben und den Gefahren desselben sich aussetzen, als sie drohen sehen? Viele haben auch ihre Wohnungen verändert, und sind von einer Gasse in eine andere, und von der Stadt in die Vorstädte gezogen? Wie Vielen wurden Geldstrafen und welche Geldstrafen wurden ihnen auferlegt, und wie Viele mußten, da sie das Geld nicht hatten, es von Andern auf Zinsen borgen, um nur den Nachstellungen dieser Menschen zu entgehen?</p>
      <h2>58</h2><p>Denn Allen zeigten sie sich furchtbar, und bei Allen prahlten sie, indem sie Allen den Kaiser nannten, und indem sie mit dem Zorne desselben drohten, zu Gehülfen ihrer Bosheit aber den Dux Sebastianus, einen Manichäer und ausschweifenden jungen Mann, den Präfekten, den Comes, und zum Schauspieler den Procurator hatten. Ja, viele Jungfrauen, welche die Gottlosigkeit jener Menschen verdammten und die Wahrheit bekannten, verstießen sie aus ihren Häusern; andere mißhandelten sie auf dem Wege, und ließen die Häupter derselben von ihren jüngern Begleitern entblößen; ihren Weibern aber gaben sie die Vollmacht, eine Jede, welche sie wollten, zu mißhandeln. Die züchtigen und gläubigen Frauen wichen daher aus, und räumten jenen den Weg ein. Jene aber liefen wie Bacchantinen und Furien herum, und hielten es für ein Unglück, wenn sie keine fanden, welche sie mißhandeln konnten; sie brachten jenen Tag mit Trauer zu, an welchem sie keiner etwas Schlimmes zufügen konnten, Sie waren überhaupt gegen Alle so unbändig und grausam, daß sie Henker, Mörder, Gottlose, Streitsüchtige, Missethäter und alles eher, als Christen, von Allen genannt wurden.</p>
      <h2>59</h2><p>Sie ahmten wahrhaft die Scythen nach, und schleppten den Subdiakon Eutychius, einen frommen Diener der Kirche, fort, ließen ihn mit Ochsensehnen auf den Rücken fast bis zum Tode schlagen, und trugen dann darauf an, daß er in die Bergwerke geschickt werden sollte, und zwar nicht in gewöhnliche Bergwerke, sondern in die von Phäno, wo ein verurtheilter Mörder kaum wenige Tage leben kann. Und erstaunlich ist es, nicht einmal wenige Stunden ließen sie seine Wunden heilen, sondern bewirkten unverzüglich seine Abführung, indem sie sagten: Wenn dieses geschieht, werden sich Alle fürchten, und in der Folge mit uns sich verbinden. Allein er kam nicht weit, und starb, da er wegen des Schmerzens der Wunden die Bergwerke nicht erreichen konnte, auf dem Wege. Und zwar mit Freuden endete er, weil er den Ruhm des Märtyrerthumes erlangte; die Gottlosen aber schämten sich auch jetzt noch nicht, sondern verübten, weil sie, wie geschrieben steht, ein grausames Herz haben, nachdem sie dieses ausgesonnen hatten, abermals einen teuflischen Frevel. Da nämlich die Gläubigen für den Eutychius sich verwendeten und für ihn baten, ließen sie vier rechtschaffene und freie Männer ergreifen, unter welchen auch Hermias war, welcher den Bettlern die Füße wusch; diese ließ der Dux zuvor durch viele Schläge verwunden, und dann in das Gefängniß werfen. Da aber die Arianer, welche grausamer als die Scythen sind, sahen, daß dieselben durch die Streiche nicht umkamen, schalten und drohten sie mit den Worten: Wir schreiben den Eunuchen, daß er nicht geißelt, wie wir es wollen. Als jener dieses hörte, gerieth er in Furcht, und wurde durch diese veranlaßt, die Männer zum zweiten Male schlagen zu lassen. Diese aber sagten, während man sie schlug, indem sie wußten, weßwegen sie geschlagen wurden, und von wem sie verleumdet worden waren, nichts anders, als: „Wir werden der Wahrheit wegen geschlagen, und wir treten nicht in Kirchengemeinschaft mit den Ketzern; schlage nur zu, wie du willst, Gott wird dich darüber richten.“ Die Gottlosen wollten nun, man sollte sie auch in dem Kerker der Gefahr Preis geben und dort umkommen lassen; allein das Volk Gottes verwendete sich, indem es den günstigen Zeitpunkt, wahrnahm, für dieselben, und nach ungefähr sieben Tagen, oder mehr, wurden sie frei gelassen.</p>
      <h2>60</h2><p>Allein jene versuchten, hierüber gleichsam betrübt, wieder einen verruchten und noch grausamern Frevel zu verüben, welcher zwar bei Allen für grausam galt, aber ihrer Christo widerstrebenden Ketzerei entsprach. Der Herr hat nämlich befohlen, für die Armen zu sorgen, indem er sprach: „Verkauft, was ihr besitzet; und gebet Almosen!“ und: „Ich war hungrig, und ihr habet mir zu essen gegeben; „ich war durstig, und ihr habet mich getränkt. Denn so viel ihr einem dieser Geringsten gethan habet, das habet ihr mir gethan.“ Diese hingegen haben, weil sie in Wahrheit feindliche Gesinnungen gegen Christum hegen, auch hierin seinem Willen entgegen zu handeln gewagt. Denn da sie die Armen erblickten, und die Wittwen, welche, nachdem der Dux den Arianern die Kirchen übergeben hatte, in diesen nicht mehr bleiben konnten, wie sie an den Orten saßen, die ihnen die Kleriker, welchen die Obsorge für die Wittwen anvertraut war, angewiesen hatten; als sie die Brüder sahen, wie sie denselben bereitwillig das Almosen austheilten, und den Wittwen Nahrung reichten; stießen sie die Wittwen mit den Füssen fort, und verklagten die Spender bei dem Dux. Dieses geschah durch einen gewissen Soldaten Dynamius, und es war dem Sebastianus sehr angenehm; denn bei den Manichäern ist kein Mitleid, sondern es ist bei ihnen sogar etwas verhaßtes, mit einem Armen Mitleid zu haben. Eine ungewöhnliche Anklage, und ein ungewöhnlicher Richterstuhl wurde also damals von ihnen zuerst erdacht. Denn wegen einer Wohlthat wurde man vor Gericht gefordert; und wer Almosen gab, wurde angeklagt, wer eine Wohlthat empfing, wurde geschlagen; und sie wollten lieber den Armen Hunger leiden lassen, als jenem, welcher sich erbarmen wollte, gestatten, ein Almosen zu geben. Aber auch dieses haben sie, die neuen Juden, von jenen alten Juden gelernt; denn auch jene erhoben, da sie sahen, daß der Blindgeborne endlich sein Gesicht erhielt, und daß der lange Zeit Gichtbrüchige gesund wurde, gegen den Herrn, welcher eine Wohlthat erwiesen hatte, eine Anklage, und richteten über die, welche eine Wohlthat empfangen hatten, wie über Verbrecher.</p>
      <h2>61</h2><p>Wer verwunderte sich nun nicht hierüber? Wer verfluchte nicht die Ketzerei und ihre Vertheidiger? Wer erkannte nicht, daß die Arianer wilder, als die wilden Thiere seyen? Und doch erreichten die Verruchten nicht, was sie hiedurch zu erreichen suchten; sondern sie vermehrten bei Allen den Haß gegen sich nur noch mehr. Sie hofften nämlich Einige durch Nachstellung und Schrecken für die Ketzerei mit Gewalt zu gewinnen, so daß sie mit ihnen Kirchengemeinschaft hätten. Aber es widerfuhr ihnen das Gegentheil; denn die, welche Verfolgung litten, ertrugen das, was ihnen von jenen zugefügt wurde, als ein Märtyrer-Leiden; sie verriethen nicht und verläugneten nicht den frommen Glauben an Christus. Diejenigen aber, welche in der Umgebung zusahen, ja die Heiden selbst, welche es sahen, verwünschten sie als Antichristen und Henker; denn das menschliche Geschlecht liebte die Armen und ist zum Mitleide geneigt. Diese aber haben sogar den Menschen-Verstand verloren; denn sie ließen denjenigen, welche im Leiden von Andern eine Wohlthat gewünscht hätten, diese von den Andern nicht zukommen, weil sie sich auf die Unmenschlichkett und die Macht der Richter, und vorzüglich auf die des Dux verließen.</p>
      <h2>62</h2><p>Denn was sie auch gegen die Priester und Diakonen verübten, wie sie dieselben unter dem Schutze des Dux und der Richter vertrieben, und die Verwandten derselben aus ihren Häusern jagten, mittelst der Soldaten und des Feldherrn Gorgonius, welcher sie mit Schlägen zerfleischen ließ, wie sie, was das Allergrausamste ist, die Brode der schon Verstorbenen, und mit welcher Ausgelassenheit sie dieselben raubten, läßt sich mit Worten nicht aussprechen, weil ihre Grausamkeit jede Darstellung durch Worte übersteigt. Denn was könnte Jemand sagen, daß er Etwas gesagt zu haben schiene? Oder was könnte er zuerst erwähnen, ohne das Zweite ärger als das Erste, und das Folgende grausamer als das Zweite zu finden? Denn alle ihre Unternehmungen und Verbrechen sind voll von Mord und Gottlosigkeit; und sie haben eine so arglistige Gesinnung, und einen so verschlagenen Charakter, daß sie durch Verheißung ihres Schutzes und durch Bestechung mit Geld zu verführen suchen, um wenigstens hiedurch, da es ihnen an einer Empfehlung aus vernünftigen Gründen gebricht, den Einfältigern ein Blendwerk vorzumachen.</p>
      <h2>63</h2><p>Wer mochte nun diese noch auch nur Heiden, geschweige Christen nennen? Wer sollte ihren Charakter für menschlich, und nicht vielmehr für thierisch ansehen wegen der Gefühllosigkeit und Grausamkeit ihres Verfahrens? Denn sie sind schlechter als Henker und verwegener als die übrigen Sekten; ja, sie sind viel schlechter als die Heiden, und stehen ihnen sehr weit nach. Denn ich habe von den Vätern vernommen, und halte ihre Worte für wahr, daß bei der frühern Verfolgung unter Maximianus, dem Großvater des Constantius, die Heiden unsere christlichen Brüder, als man sie aufsuchte, verbargen, und oft Geldstrafen bezahlten und sich in das Gefängniß führen ließen, um nur an den Fliehenden keine Verräther zu werden. Denn wie sich selbst beschützten sie die, welche zu lhnen flohen, und trugen kein Bedenken, sich für sie Gefahren auszusetzen. Jetzt aber thun diese wunderlichen Menschen, diese Erfinder der neuen Ketzerei, welche man aus nichts anderm, als aus den Nachstellungen kennt, in Allem gerade das Gegentheil. Denn sie sind aus eigenem Antriebe Henker geworden, suchen Alle zu verrathen, und bereiten denen, welche dieselben verbergen, Nachstellungen, indem sie den Verberger eben so wie den Verborgenen für ihren Feind halten; so mordlustig sind diese Bösewichte, und so sehr wetteifern sie in der Bosheit mit dem Judas.</p>
      <h2>64</h2><p>Und es ist nicht möglich, auf eine ihren schlechten Handlungen angemessene Weise zu sprechen, ausser nur so, wie es mir, während ich schreibe und ihre Gräuelthaten aufzählen will, eben einfällt; ob nicht die vierte Tochter des Blutigels, von welchem in den Sprüchen Meldung geschieht, diese Sekte ist, welche nach so vielen Ungerechtigkeiten und nach so vielen Mordthaten noch nicht gesagt hat: Es ist genug. Denn noch tobt sie, und noch geht sie umher, Menschen aufzusuchen, welche sie noch nicht kennt; diejenigen aber, welche sie schon früher mißhandelt hat, sucht sie abermals zu mißhandeln. Denn sieh! nach dem nächtlichen Ueberfalle, nach den daraus entstandenen Uebeln, nach der von Heraklius verübten Verfolgung hören sie noch nicht auf, bei dem Könige zu verleumden. Denn sie hoffen zuversichtlich, daß ihre Gottlosigkeit bei ihm Gehör findet, damit noch etwas mehr, als die Verbannung, verhängt werde, und dann diejenigen, welche ihren Gottlosigkeiten nicht gehorchen, getödtet werden. Denn so haben jetzt die verwegenen Menschen, nämlich der höchst lasterhafte Secundus von Pentapolis, und sein Mitverschworner Stephanus, weil sie wußten, daß sie, wenn sie auch Unrecht thun, ihre Ketzerei zur Vertheidigung haben, da sie den Priester in Barka, Sekundus mit Namen, ihnen nicht gehorchen sahen, diesen, der zwar gleichen Namen, aber nicht gleichen Glauben mit dem Ketzer hatte, mit den Füssen todt gestossen. Er ahmte, als er getödtet wurde, den Heiligen nach und sprach: Keiner räche mich bei den Richtern, ich habe den Herrn zum Rächer, wegen dessen ich auch dieses von ihnen erdulde. Jene erbarmten sich aber seiner nicht, da er so sprach, und hatten auch keine Scheu vor den Tagen; denn selbst in der Fasten stießen sie den Mann mit den Füssen und tödteten ihn.</p>
      <h2>65</h2><p>O der neuen Sekte, die in ihrer Gottlosigkeit und ihrem Betragen ganz den Teufel angezogen hat; denn vor Kurzem ist dieses Uebel zum ersten Male ausgesonnen worden; sollten aber Einige früher über diese Ketzerei nachgedacht zu haben scheinen, so verbargen und verheimlichten sie es doch, daß sie dieses dachten. Eusebius und Arius aber spien, nachdem sie wie Schlangen aus ihrer Höhle hervorgekommen waren, das Gift dieser Gottlosigkeit aus; und Arius übernahm die freche Rolle, offenbar zu verleumden, Eusebius aber nahm die Vertheidigung der Ketzerei auf sich. Er vermochte dieselbe jedoch nicht eher zu schirmen, als bis er, wie ich oben gesagt habe, den Schutz des Königes für sie erhalten hatte. Unsere Väter veranstalteten daher eine allgemeine Synode; mehr oder weniger als dreihundert kamen zusammen, verdammten die arianische Ketzerei, und erklärten insgesammt, daß dieselbe dem Glauben der Kirche fremd sey und zuwider laufe. Da aber die Vertheidiger derselben sich endlich beschämt sahen, und keinen trifftigen Grund vorbringen konnten, ersannen sie einen andern Ausweg, und suchten dieselbe durch fremde Macht zu vertheidigen. Und man wird sich über ihr neues und boshaftes Bestreben hierin und darüber noch mehr wundern, wie sie die übrigen Sekten übertreffen. Denn der Unsinn dessen, was die übrigen Sekten ersinnen, beruht auf der Wahrscheinlichkeit ihrer Worte, um die Unvorsichtigen zu hintergehen. Die Griechen suchen, wie der Apostel sagt, durch die Erhabenheit und Beredtheit ihrer Worte und durch wahrscheinliche Sophismen zu überreden; die Juden aber haben, wie der Apostel sagt, die göttlichen Schriften bei Seite gesetzt, und streiten mit Hülfe von Sagen und endlosen Genealogien. Denn die Manichäer und die Valentinianer und mit ihnen Andere verfälschten die göttlichen Schriften, und erzählen in ihren erdichteten Reden Fabeln; die Arianer aber sind verwegener, als die übrigen Sekten, und erklären dieselben für ihre kleinern Schwestern, indem sie gottloser sind, als jene, wie oben gesagt wurde, und mit Allen, vorzüglich aber mit den Juden, in der Bosheit wetteifern. Denn wie jene den Paulus, da sie ihn der ihm zur Last gelegten Verbrechen nicht überweisen konnten, sogleich zum Kriegstribun und zum Landpfleger führten, so bedienen sich diese, indem sie noch mehr als jene ersinnen, nur der Macht der Richter; und sobald ihnen Jemand auch nur widerspricht, wird er zu dem Landpfleger oder dem Dux geschleppt.</p>
      <h2>66</h2><p>Die übrigen Sekten schweigen, sobald sie sich von der Wahrheit selbst durch Beweisgründe überführt sehen, indem sie, ohne etwas Weiteres zu thun, über die Widerlegung sich schämen; die neue. und abscheuliche Sekte dieser Menschen aber sucht, wann sie durch Vernunftgründe widerlegt wird, wann sie von der Wahrheit selbst beschämt stürzt, dann diejenigen, welche sie durch Worte nicht überreden konnte, durch Gewalt, Schläge und Kerker an sich zu reissen, und gibt dadurch zu erkennen, daß sie Alles eher, als gottesfürchtig sey. Denn es ist der Gottesfurcht eigen, nicht zu zwingen, sondern zu überzeugen, wie wir gesagt haben. Der Herr selbst sagte ja, indem er nicht Gewalt brauchte, sondern es dem Willen eines Jeden frei stellte, zu Allen: „Wenn mir Jemand nachfolgen will;“ und zu seinen Jüngern: „Wollet ihr nicht auch weggehen?“ Da nun diese Sekte mit der Ehrfurcht vor Gott ganz unbekannt ist, was mußte sie da anders thun, als das Entgegengesetzte von dem, was der Heiland that, da sie zum Führer der Gottlosigkeit in dem Kampfe gegen Christum den Constantius, gleichsam den Antichrist selbst genommen hat. Denn der Ketzerei wegen strebte er zuerst dem Saul in der Grausamkeit nachzueifern; denn jener ließ ja, da die Priester dem David Nahrung reichten, alle, dreihundert fünf an der Zahl, tödten; dieser aber erklärte, da Alle die Ketzerei flohen, und das Bekenntniß des gesunden Glaubens an den Herrn abgelegt wurde, die Synode von dreihundert Bischöfen für ungültig, verwies die Bischöfe selbst aus dem Lande, hinderte die Völker, der Gottseligkeit obzuliegen und zu Gott zu beten, und störte ihre Versammlungen. Und wie Saul Nobe, die Priesterstadt, zerstörte, so übergab dieser, indem er die Bosheit noch vergrößerte, die Kirchen den Gottlosen; und wie jener den Verleumder Doeg den wahren Priestern vorzog, den David aber verfolgte und den Ziphäern Gehör gab, so zieht dieser die Ketzer den Frommen vor, verfolgt diejenigen, welche vor ihm fliehen, und schenkt seinen Eunuchen Gehör, welche die Rechtgläubigen verleumden, ohne daß er einsieht, daß Alles, was er immer für die arianische Ketzerei thut und schreibt, gegen den Heiland selbst gerichtet ist.</p>
      <h2>67</h2><p>Nicht einmal Achab war gegen die Priester Gottes so grausam, wie dieser gegen die Bischöfe zu seyn gewagt hat; denn jener war nach der Ermordung des Naboth bestürzt, und fürchtete sich, als er den Elias sah; dieser aber scheute sich nicht vor dem so ehrwürdigen Hosius, und wurde durch die Verbannung so vieler Bischöfe nicht befriedigt oder betrübt; sondern er wird, wie ein zweiter Pharao, je mehr er bedrängt wird, desto mehr verhärtet, und sinnt täglich auf Schlimmeres. Und das Unbegreifliche seiner Gottlosigkeit ist Folgendes; als nämlich die Bischöfe verbannt wurden, traf es sich, daß einige Andere wegen des Verbrechens des Mordes, des Aufruhres oder des Raubes nach der Schwere des Vergehens verurtheilt wurden; und diese ließ er nach wenigen Monaten, als er gebeten wurde, wie Pilatus den Barrabas, frei; die Diener Christi aber ließ er nicht nur nicht frei, sondern verurtheilte sie in der Verbannung nur noch unbarmherziger, indem er ein unsterbliches Uebel für sie wurde. Denn jenen war er wegen ihres Wandels Freund, den Rechtgläubigen aber war er wegen ihrer Ehrfurcht gegen Christum Feind. Hat er also hiedurch nicht Allen deutlich bewiesen, daß auch damals die Juden, als sie den Barrabas verlangten, den Herrn aber an das Kreuz schlugen, eben so beschaffen waren, wie jetzt die sind, welche mit Constantius gegen Christum kämpfen? Und vielleicht ist jener grausamer, als Pilatus; denn dieser wusch, als er die Ungerechtigkeit sah, doch wenigstens die Hände; jener aber knirscht, während er die Heiligen verbannt, nur noch mehr mit den Zähnen.</p>
      <h2>68</h2><p>Was Wunder aber, wenn er, in die Gottlosigkeit verirrt, so gegen die Bischöfe wüthet, da er nicht einmal seiner eigenen Verwandten wie ein Mensch schonte? Denn er hat seine Oheime gemordet, seine Vettern aus dem Wege geräumt, und seines Schwiegervaters, dessen Tochter er schon geheurathet hatte, und seiner unglücklichen Verwandten sich nicht erbarmt; ja er ist auch gegen Alle immer eidbrüchig gewesen. Denn so wagte er es auch, gegen seinen Bruder gottlos zu verfahren. Er nimmt zwar den Schein an, daß er ihm ein Grabmal errichten wolle, hat aber die Verlobte desselben, Olympias, den Barbaren ausgeliefert, welche jener bis an seinen Tod bei sich behalten, und wie seine Gattin erzogen hatte. Auch versuchte er es, die Willensmeinung desselben ungültig zu machen, da er doch dessen Erbe zu seyn sich rühmt, indem er Dinge schrieb, über welche Jemand, der auch nur ein wenig Gefühl hätte, sich schämen würde. Denn wenn ich seine Briefe mit einander vergleiche, finde ich, daß er keinen natürlichen Verstand habe, sondern sich bloß nach dem Willen der Einflüsterer richte, einen eigenen Verstand aber durchaus nicht habe. Salomon sagt: „Wenn ein König ein ungerechtes Wort anhört, werden alle seine Untergebenen Uebertreter seyn.“ Dieser beweiset nun durch seine Handlungen, daß er der Ungerechte, seine Untergebenen aber Uebertreter des Gesetzes seyen.</p>
      <h2>69</h2><p>Wann also kann dieser, der so beschaffen ist, und an solchen Menschen sein Vergnügen findet, etwas Gerechtes oder Vernünftiges denken? ein Mensch, gefesselt an die Schlechtigkeit seiner Umgebung, und zwar einer solchen, die aus Zauberern besteht, welche in der That ein mit den Füssen zertretenes Gehirn haben. Denn darum schreibt er und bereut, was er schreibt; darum wird er, sobald er seine Meinung ändert, aufgebracht, bricht dann wieder in Weheklagen aus, und beweiset, da er nicht weiß, was er thun soll, daß seine Seele keinen Verstand hat. Daher möchte man ihn bei dieser Beschaffenheit vielmehr mit Recht bedauern, daß er bei dem Ansehen und dem Namen eines Freien ein Sklave solcher Menschen ist, welche ihn zu ihrer Freude an der Gottlosigkeit hinreißen. Es ist gewiß unverständig und leichtsinnig, wie die Schrift sagt, daß er sich, während er Andern schmeicheln wollte, selbst dem zukünftigen Gerichte zur Verdammung und dem Feuer zur Verzehrung Preis gegeben hat; da er bereits Alles thut, was jene wollen, und ihnen die Macht gibt, den Bischöfen nachzustellen, nebst der Gewalt über die Kirchen. Denn sieh! auch jetzt hat er die Kirchen in Alexandrien wieder verwirrt, so wie jene in Aegypten und ganz Libyen, und öffentlich den Befehl ergehen lassen, die Bischöfe, welche der katholischen Kirche und dem frommen Glauben anhängen, aus den Kirchen zu vertreiben, und diese sämmtlich den arianisch Gesinnten zu übergeben. Dieses zu thun hat der Feldherr bereits angefangen; Bischöfe sind gebunden, Priester und Mönche in eiserne Fesseln geschlagen, und nachdem sie fast bis zum Tode geschlagen worden waren, verbannt worden. Ueberall ist Alles in Verwirrung; ganz Aegypten und Libyen schwebt in Gefahr, weil die Völker über diesen gesetzwidrigen Befehl aufgebracht sind und die Vorbereitung des Antichristus sehen, weil sie sehen, daß ihr Eigenthum von jenen geraubt und den Ketzern ausgeliefert ist.</p>
      <h2>70</h2><p>Wann nun hat man von einer solchen Ungerechtigkeit gehört? Wann ist ein solches Unheil, selbst zur Zeit der Verfolgung, verübt worden? Heiden waren die frühern Verfolger; aber sie brachten ihre Götzen nicht in die Kirchen. Eine Jüdin war Zenobia, und die Beschützerin des Paulus von Samosate; sie übergab aber nicht die Kirchen den Juden zu Synagogen. Unerhört ist dieses abscheuliche Verfahren; und es ist nicht bloß eine Verfolgung, sondern mehr als eine Verfolgung, nämlich ein Vorspiel und eine Vorrüstung des Antichristus. Denn es sey, daß sie gegen den Athanasius und gegen die übrigen Bischöfe, welche sie verbannten, falsche Beschuldigungen erdichteten; wozu denn nun ausserdem dieser neue Frevel? Was für einen Vorwand haben sie gegen ganz Aegypten, Libyen und Pentapolis vorzubringen? Denn sie haben nicht einem jeden einzeln nachzustellen angefangen, so daß sie daraus eine Gelegenheit zu lügen schöpfen könnten; sondern sie haben Alle insgesammt angegriffen, so daß sie, wenn sie auch eine Lüge aussinnen wollten, der Unwahrheit überführt würden. Hierin verblendete also die Bosheit ihren Verstand, und sie wollten überhaupt alle Bischöfe ohne Grund vertreiben, damit sie dadurch an den Tag legten, daß sie wider den Athanasius und wider die andern Bischöfe, welche sie verbannten, falsche Beschuldigungen erdichteten, aus keiner andern Ursache, als wegen der abscheulichen Ketzerei der Arianer, dieser Feinde Christi. Denn dieses ist nicht mehr verborgen, sondern Allen vorzüglich jetzt offenbar geworden. Denn er befahl, den Athanasius aus der Stadt zu vertreiben, und übergab jenen die Kirchen. Und die Priester und Diakonen desselben, welche von Petrus und Alexander ordinirt worden sind, werden verstossen und vertrieben; die wirklichen Arianer aber, welche nicht aus äussern Gründen wirklich im Verdachte standen, sondern welche schon Anfangs mit dem Arius wegen der Ketzerei von dem Bischofe Alexander abgesetzt wurden, nämlich in Ober-Libyen Secundus, zu Alexandria aber Euzoius der Chananäer, Julius, Ammon, Markus, Irenäus, Zosimus und Serapion mit dem Beinamen Pelycon, in Libyen endlich Sisinnius, und mit ihm einige Jüngere, welche mit ihnen gleich gottlos denken, diese, sage ich, haben die Kirchen in Besitz genommen.</p>
      <h2>71</h2><p>Und der Dux Sebastianus ließ an alle Vorgesetzte und Kriegspräfekten Schreiben ergehen. Da wurden die wahren Bischöfe vertrieben, die Gottlosgesinnten aber anstatt jener eingeführt. Ja, Bischöfe verbannten sie, welche im Klerus Greise geworden waren, und von dem Bischofe Alexander ordinirt, viele Jahre die Bischofswürde bekleidet hatten, nämlich den Ammonius, den Hermes, den Anagamphus, und den Markus in die obere Oase, den Muis aber, den Psenosiris, den Nilammon, den Plenes, den Markus und den Athenodorus nach Ammoniaka, aus keiner andern Absicht, als damit sie auf ihrer Wanderung durch die Wüsten das Leben verlieren möchten. Denn nicht einmal der Kranken erbarmten sie sich, sondern vertrieben sie, obwohl sie dieselben wegen der Krankheit mit Mühe fortbrachten, so daß dieselben auf Tragen fortgeschleppt wurden, und wegen der schweren Krankheit ihnen der Leichenzug nachfolgte. Es starb daher Einer aus ihnen, und sie gestatteten nicht einmal den Seinigen, daß sie den Leichnam wegtrugen. Deßwegen verbannten sie auch den Bischof Drakontius in die Wüsten um Clysma, den Philo aber nach Babylon, den Adelphius nach Psinabla in der Thebais, die Priester Hiearax und Dioscorus nach Syene; deßwegen vertrieben sie den Ammonius, den Agathus, den Agathodämon, den Apollonius, den Eulogius, den Apollo, den Paphnutius, den Gajus und den Flavius, alte Bischöfe, den Dioscorus, den Ammonius, den Heraklides und den Psais, gleichfalls Bischöfe; die Einen lieferten sie in Steinbrüche, Andere verfolgten sie, um sie zu tödten, und viele Andere beraubten sie. Vierzig Laien, und Jungfrauen, welche sie zuvor zum Feuer gestellt hatten, verbannten sie, nachdem sie die Letztern mit Palmruthen so heftig geschlagen hatten, daß Einige nach fünf Tagen starben, Andere, weil die Stacheln der Palmruthen in den Gliedern stacken, der ärztlichen Hülfe bedurften, und Schmerzen, welche schwerer als der Tod waren, ertrugen. Und was für noch grausamer, wenigstens von jedem Verständigen gehalten wird, den Gottlosen aber vollkommen entspricht, ist dieses, daß sie, während jene unter den Schlägen Christum anriefen, noch mehr mit den Zähnen gegen dieselben knirschten. Ja, sie übergaben nicht einmal die Leiber der Dahingeschiedenen den Ihrigen zur Beerdigung, sondern sie verbargen dieselben, um ihre Mordthaten zu verbergen. Allein sie blieben nicht verborgen; denn die ganze Stadt war Augenzeuge, und Jedermann verabscheute sie als Mörder, als Missethäter und Räuber. Ja, sie zerstörten auch Klöster, und suchten Mönche in das Feuer zu werfen; sie plünderten Häuser, nahmen anvertraute Güter, welche von dem Bischofe in das Haus freier Einwohner gebracht worden, indem sie in dieses eindrangen, mit Gewalt weg, stießen die Wittwen mit den Füssen, und verhinderten die Spendung des Almosens.</p>
      <h2>72</h2><p>Von dieser Art sind die Frevelthaten der Arianer. Wen möchte nicht ein Schauder ergreifen, welcher vernimmt, wie die Unternehmungen ihrer Gottlosigkeit beschaffen sind? Denn sie bewirkten, daß so ehrwürdige Greise und so vieljährige Bischöfe in das Elend verwiesen wurden; anstatt dieser fanden sie für gut, jüngere, ausschweifende Heiden, welche nicht einmal Catechumenen waren, sogleich anzupreisen, und andere, welche zwei Weiber zugleich hatten und noch größerer Vergehen beschuldigt waren; solche Menschen stellten sie, nur weil sie Vermögen und im Staate Macht besassen, und Geld hergaben, gleichsam von dem Verkauf-Platze weg auf und solchen gaben sie den Namen Bischöfe. Und nun trat für die Gläubigen eine noch ärgere Bedrängniß ein; da sie nämlich die Miethlinge jener Menschen und ihnen ganz fremde Menschen verabscheuten, wurden sie geschlagen, in die Acht erklärt, und von dem Heerführer in die Gefängnisse geworfen. Denn dieses that er als Manichäer mit großer Bereitwilligkeit, damit sie ihre vorigen Bischöfe nicht aufsuchen, sondern diejenigen, welche sie verabscheuten, aufnehmen möchten, Leute, die solche Possen sich erlauben, wie sie vorher bei den Götzen gespielt hatten.</p>
      <h2>73</h2><p>Wer sollte nun, wenn er dieses sieht, oder hört, wer sollte, wenn er die Ausgelassenheit der Gottlosen und eine solche Ungerechtigkeit erblickt, welcher Gerechte sollte da nicht seufzen? Denn an den Orten der Gottlosen seufzen die Gerechten. Wer sollte bei solchen Ereignissen, und da die Gottlosigkeit eine solche Unverschämtheit sich erlaubte, es noch wagen, den Costyllius einen Christen zu nennen, und nicht vielmehr das Ebenbild des Antichristus? Denn welches Kennzeichen desselben fehlt ihm noch? Oder warum sollte er nicht allenthalben für denselben gehalten, und warum sollte jener nicht für eben so angesehen werden, wie dieser ist? Haben nicht in der großen Kirche, welche im Cäsarium ist, auf seinen Befehl die Arianer und die Heiden Opfer gebracht und Christum gelästert? Bezeichnet nicht das Gesicht des Daniel den Antichristus dadurch, daß er die Heiligen bekriegen und sie überwältigen werde, daß er Alle, die vor ihm waren, an Schlechtigkeit übertreffen, drei Könige erniedrigen, gegen den Allerhöchsten lästern, und den Wahn hegen werde, er könne die Zeit und das Gesetz ändern? Wer hat nun sonst jemals etwas solches zu thun sich erfrecht, als nur allein Constantius? Denn dieser ist so beschaffen, wie wohl auch jener seyn mag. Denn er lästert gegen den Allerhöchsten, indem er die gottlose Sekte begünstigt; er führt Krieg gegen die Heiligen, indem er die Bischöfe in das Elend verweiset, obschon er nur auf kurze Zeit und zu seinem eigenen Verderben diese Macht besitzt. Denn dieser hat alle seine Vorgänger an Bosheit übertroffen, indem er eine neue Verfolgungs-Art erdachte; und nachdem er drei Könige, den Vetranio, Magnentius und Gallus entsetzt hatte, nahm er sogleich die Gottlosigkeit in Schutz, und wagte es, wie ein Riese gegen den Allerhöchsten mit Uebermuth sich zu erheben. Er ließ sich einfallen, das Gesetz zu verändern, indem er die vom Herrn durch die Apostel gegebenen Vorschriften aufhob, die Gebräuche der Kirche umänderte, und eine neue Weise der Einsetzungen ersann. Denn aus fremden Oertern, welche sogar fünfzig Tagreisen entfernt sind, schickt er Bischöfe mit Soldaten zu den Gläubigen, welche dieselben nicht wollen; und diese bringen, anstatt einer Empfehlung an die Gläubigen, Drohungen und Schreiben an die Richter. So hat er den Gregorius aus Kappadocien nach Alexandrien geschickt; so hat er den Germinius von Cyzicus nach Sirmium gesendet; so hat er den Cecropius von Laodicea nach Nikomedien befördert.</p>
      <h2>74</h2><p>Einen gewissen Auxentius aber, welcher mehr ein Freund des Streites als ein Christ ist, ließ er aus Kappadocien nach Mailand kommen, um diesen, nachdem er den Bischof Dionysius, einen frommen Mann, verbannt hatte, daselbst einzusetzen, einen Menschen, welcher nicht einmal der lateinischen Sprache, sondern nur der Gottlosigkeit kundig ist. Jetzt aber hieß er wieder einen gewissen Georgius, einen Menschen aus Kappadocien, welcher zu Constantinopel Proviantverwalter war, alles Geld gestohlen und deßhalb die Flucht ergriffen hatte, mit militärischem Gepränge und der Gewalt des Dux in Alexandrien einziehen. Dann fand er einen gewissen Neophyten Epictetus, einen verwegenen jungen Menschen, und nahm ihn unter seine Freunde auf, weil er ihn zu aller Schlechtigkeit bereit sah; mit dessen Hülfe stellt er nun allen Bischöfen nach, welchen er will; denn dieser Mensch ist bereit, Alles zu thun, was der König wünscht. Dieses Gehülfen also sich bedienend hat er zu Rom eine unerwartete That verübt, welche wirklich das Gepräge der Bosheit des Antichristus an sich trägt. Er richtete nämlich den Palast wie eine Kirche ein, ließ anstatt des Volkes drei seiner Verschnittenen erscheinen, und nöthigte dann drei schlechtgesittete Katascopen (Spione), denn Bischöfe darf man sie nicht nennen, einen gewissen Felix, welcher ihrer würdig war, als Bischof im Palaste zu ordiniren. Denn die Gläubigen, welche die gesetzwidrige Denkart der Ketzer kannten, gestatteten denselben nicht, in die Kirchen einzutreten, sondern wichen alle weit von ihnen zurück.</p>
      <h2>75</h2><p>Was hat er also von dem, was für den Antichristus paßt, unterlassen? oder was wird jener, wann er kommt, mehr thun? oder wie wird jener bei seiner Ankunft den Weg zur leichten Verführung nicht schon von diesem vorbereitet finden? Denn er beruft, anstatt in die Kirchen, in die Paläste die kirchlichen Gerichte zu sich, und führt dabei selbst den Vorsitz. Das Auffallendste aber ist, daß er, wann er die Ankläger in Verlegenheit sieht, selbst die Anklage übernimmt, damit es den ungerecht Behandelten nicht einmal mehr möglich sey, sich zu vertheidigen, in Folge seiner gewaltthätigen Verfahrungsweise. Und dieses that er gegen Athanasius, denn als er die Freimüthigkeit der Bischöfe, nämlich die des Paulinus, des Lucifer, des Eusebius und des Dionysius gewahr wurde und sah, wie diese durch die Rede des Ursacius und Valens die Gegner des Bischofes widerlegten, und riethen, man sollte dem Valens und seinen Anhängern nicht mehr glauben, weil sie das, was sie jetzt sagen, bereuet hätten, stand er sogleich auf und sprach: Ich bin jetzt Ankläger des Athanasius, um meinetwillen glaubet, was diese sagen. Als dann jene erwiederten: Wie kannst du Ankläger seyn, da der Angeklagte nicht da ist? denn obschon du Ankläger bist, kann doch jener in seiner Abwesenheit nicht gerichtet werden. Denn nicht römisch ist das Gericht, so daß du als Kaiser Glauben fändest; sondern über einen Bischof wird Gericht gehalten, und gleiches Recht muß dem Ankläger und dem Beklagten zu Theil werden. Wie aber klagest du an? du konntest ja mit dem Manne, welcher fern von dir lebte, nicht in nähere Berührung kommen; sagest du aber, was du von diesen gehört hast, so ist es gerecht, daß du auch dasjenige glaubest, was jener sagt. Glaubest du aber jenem nicht, und schenkest du diesen Glauben, so scheinen diese vielmehr deinetwegen dieses zu sagen, und dir zu Liebe den Athanasius anzuklagen. Da er dieses hörte, und das, was mit Recht gesagt worden war, für eine Kränkung hielt; verbannte er jene, und ließ, aufgebracht gegen den Athanasius, ein heftigeres Schreiben mit dem Befehle ergehen, ihn so zu mißhandeln, wie er wirklich mißhandelt wurde, den Arianern die Kirchen zu übergeben, und ihnen zu erlauben; Alles zu thun, was sie wollten.</p>
      <h2>76</h2><p>Hart also, und mehr als hart sind diese Dinge; doch geziemt dieses Verfahren demjenigen, welcher die Rolle des Antichristus spielt. Denn wer wird, wenn er ihn an der Spitze derjenigen, welche für Bischöfe gehalten werden, und bei den kirchlichen Gerichten den Vorsitz führen sieht, nicht mit Recht sagen, dieß sey der vom Daniel verkündete Gräuel der Verwüstung? Denn unter dem Vorwande des Christenthumes geht jener in die heiligen Oerter, nimmt in denselben Platz und verheeret die Kirchen, indem er die Kanone derselben aufhebt, und seine Beschlüsse mit Gewalt durchsetzt. Wer getraut sich noch zu sagen, dieses sey die Zeit des Friedens für die Christen, und nicht vielmehr Verfolgung? Und zwar stellen uns die Feinde Christi das Bild einer Verfolgung dar, wie sie noch nie geherrscht hat, und wie vielleicht Niemand je eine herbeiführen wird, den Sohn der Gottlosigkeit ausgenommen. Daher müssen wir auch mit größter Wachsamkeit unsern Blick darauf richten, ob nicht diese Ketzerei, welche eine solche Unverschämtheit besitzt, und welche, wie in den Sprüchen geschrieben steht, ihr Gift wie ein Basilisk ausgießt und eine den Heiland bekämpfende Ansicht aufstellt, eben jener Abfall sey, nach welchem sich der Antichrist offenbaren wird, indem er durchaus zu seinem Vorläufer den Constantius hat. Denn warum wüthet er sonst so gegen die Gottesfürchtigen? Warum streitet er wie für seine eigene Ketzerei? Warum nennt er den seinen eigenen Feind, welcher dem Unsinne des Arius nicht gehorcht? Warum nimmt er das, was von den Feinden Christi gesagt wird, bereitwillig auf, und warum hält er so viele und so große Synoden für nichts? Warum hat er befohlen, die Kirchen den Arianern zu übergeben? Nicht deßwegen, damit jener bei seiner Ankunft Gelegenheit finde, in dieselben einzugehen, und ihm freundlich seinen Beifall gebe, weil er ihm den Weg in diese Orte gebahnt hat? Denn die vom Alexander und von dessen Vorfahrer Achillas, und ferner die von dem Vorfahrer des Letztern, Petrus, ordinirten hochbejahrten Bischöfe wurden vertrieben, und dagegen wurden diejenigen eingeführt, welche die Begleiter der Soldaten vorschlugen; diese schlugen aber solche vor, welche versprachen, mit ihnen gleiche Gesinnung zu haben.</p>
      <h2>77</h2><p>Dieses war für die Meletianer eine leichte Aufgabe. Denn die meisten jener Menschen, ja vielmehr alle, haben keine religiöse Erziehung, sie kennen den gesunden Glauben an Christum nicht, und wissen überhaupt nicht, was Christenthum sey, oder welche Schriften wir Christen haben. Denn die Einen von ihnen kamen aus der Abgötterei, die Andern aus dem Senate und von der höchsten Staatsverwaltung, um nur die elende Freiheit von Staatslasten und Begünstigung zu erhalten; und sie gelangten dadurch, daß sie die Meletianer, welche älter als sie sind, mit Geld bestachen, zu dieser Würde, ohne jemals einer Christenlehre beigewohnt zu haben. Aber wenn sie es auch scheinbar gethan hätten, welche Unterweisung in den Anfangsgründen des Christenthumes gibt es bei den Meletianern? Doch sie kamen, ohne auch nur dem Scheine nach unterwiesen worden zu seyn, plötzlich und erhielten sogleich, wie Kinder einen Namen erhalten, den Namen Bischöfe. Weil sie nun von dieser Art sind, legten sie kein Gewicht auf die Sache, und meinten, daß es zwischen Frömmigkeit und Gottlosigkeit keinen Unterschied gebe. Gern und schnell wurden sie daher aus Meletianern Arianer; würde aber der Kaiser auch etwas Anderes befehlen, so wären sie auch wieder zu diesem bereit. Denn die Unkunde der Gottesverehrung führt sie schnell zu ihrer gewohnten und anfänglichen Thorheit, welche sie gelernt haben. Denn es gilt ihnen für nichts, durch jeden Wind und jede Welle sich hin und her tragen zu lassen, wenn sie nur von Abgaben frei sind und menschlichen Schutz genießen; es gilt ihnen für nichts, sich in solche zu verwandeln, welche sie zuvor waren, und wieder in solche welche sie gewesen sind, als sie noch Heiden waren. Ja, weil sie in ihrem Charakter so wandelbar waren und glaubten, die Kirche sey ein bürgerlicher Rath, und weil sie, als Heiden, abgötterisch gesinnt waren, befleckten sie, nachdem sie den schönen Namen des Erlösers zum Deckmantel genommen hatten, ganz Aegypten, indem sie bewirkten, daß die arianische Ketzerei in demselben auch nur genannt wurde. Denn bisher durfte man nur in Aegypten allein noch überall die Rechtgläubigkeit freimüthig aussprechen; und darum suchten die Gottlosen auch gegen dieses Neid zu erregen, vielmehr aber nicht sie, sondern der Teufel, welcher sie anreizte, damit, wenn sein Herold der Antichrist kommt, auch schon in Aegypten Kirchen finde, welche ihm geweiht sind, und die Meletianer, welche bereits in seiner Lehre unterrichtet sind, und damit er in denselben sich schon abgebildet sehe.</p>
      <h2>78</h2><p>Ein so gottloser Befehl wurde also vom Constantius erlassen; groß aber war die Bereitwilligkeit der Völker zum Märtyrerthume, und noch größer der Haß gegen die höchst gottlose Ketzerei; Trauer herrschte jedoch in den Kirchen, und Alle seufzten, indem sie zu dem Herrn riefen: „Schone, Herr! deines Volkes, und gib dein Erbtheil nicht zur Schmach deinen Feinden;“ sondern eile uns zu retten aus der Hand der Gottlosen. Denn sieh! sie haben deiner Diener nicht geschont, und bereiten dem Antichristus den Weg. Denn diesem werden sich die Meletianer niemals widersetzen, sie werden sich um die Wahrheit nicht bekümmern, und die Verleugnung Christi für keine Sünde halten; Menschen, welche nicht mit aufrichtigem Herzen zum Worte getreten sind, welche, wie das Chamäleon, alle Farben annehmen, und welche Miethlinge derjenigen sind, welche von ihrer Hülfe Gebrauch machen. Denn sie haben nicht die Wahrheit zum Ziele, sondern ziehen ihr das augenblickliche Vergnügen vor, und sagen nur: „Lasset uns essen „und trinken, denn morgen sterben wir.“ Dieser Vorsatz und dieser treulose Wandel geziemt mehr Epikritianischen Schauspielern, als Meletianern. Allein die getreuen Diener des Heilandes.und die wahren Bischöfe, welche den ächten Glauben haben, und nicht sich, sondern dem Herrn leben, welche den frommen Glauben an unsern Herrn Jesus Christus bewahren und gar wohl wissen, daß, wie gesagt, jene Beschuldigungen gegen die Wahrheit falsch und offenbar zu Gunsten der arianischen Ketzerei erdichtet worden sind, (denn aus der Reue des Ursacius und Valens erkannten sie, daß die Verleumdung gegen den Athanasius nur deßwegen angestiftet wurde, um denselben aus dem Wege zu räumen, und die Gottlosigkeit der Feinde Christi in die Kirchen einzuführen;) diese, sage ich, wollten, indem sie dieses einsahen, als Verfechter und Herolde der Wahrheit lieber Schmach und Verbannung erdulden, und erduldeten sie auch, als gegen den Athanasius unterschreiben, und mit den Arianern in Kirchengemeinschaft treten. Denn sie vergassen nicht, was sie gelehrt hatten, sondern wissen vielmehr gar wohl, daß den Verräthern viele Schande, den Bekennern der Wahrheit aber das Himmelreich werde zu Theil werden; daß ferner den Sorglosen und vor Constantius sich Scheuenden nichts Gutes, denen aber, welche diese Drangsale erduldet haben, wie den Schiffern nach einem Sturme ein sicherer Hafen, und wie den Athleten nach dem Wettkampfe ein Kranz zu Theil wird, auf gleiche Weise eine große und ewige Freude und Wonne im Himmel verliehen werde, wie Joseph nach jenen Drangsalen, wie der große Daniel nach den Versuchungen und den vielen Nachstellungen der Hofleute hatte, wie jetzt Paulus, bekränzt von dem Erlöser, genießt, in deren Erwartung überall alle Völker Gottes, indem sie diese Dinge sahen, ihren Muth nicht sinken ließen, sondern vielmehr im Glauben bestärkt wurden, und ihre Bereitwilligkeit noch mehr vergrößerten. Denn vollkommen überzeugt von der Verleumdung und der Gottlosigkeit der Ketzer verdammen sie den Verfolger, und wetteifern mit den Verfolgten in Gesinnung und Uebereinstimmung, damit auch sie die Krone des Bekenntnisses erlangen.</p>
      <h2>79</h2><p>Noch vieles könnte man zwar sagen gegen diese abscheuliche und Christo widerstreitende Ketzerei; noch viele Verbrechen des Constantius könnte man aufweisen, welche Vorboten des Antichristus sind; allein da, wie der Prophet sagt, von den Füssen bis zum Kopfe nichts Vernünftiges an dieser Ketzerei ist, sondern da sie von allem Unrathe und aller Gottlosigkeit strotzt, so daß man sie schon bei dem blossen Hören fliehen muß, wie den Auswurf eines Hundes und wie das Gift der Drachen; da ferner Costyllius offenbar das Bild des Widersachers an sich trägt, so möge, damit ich nicht zu weitschweifig werde, die göttliche Schrift uns genügen, und wir alle wollen ihr gehorchen, indem sie nicht nur über die andern Ketzereien, sondern vorzüglich über diese die Vorschrift gibt; „Zurück! Zurück! Hinaus von da! Rühret nichts Unreines an! Gehet aus ihrer Mitte hinweg und sondert euch ab, die ihr die Gefässe des Herrn traget.“ Denn dieses genügt Allen zur Belehrung, damit, wenn Jemand von ihnen verführt worden ist, dieser gleichsam aus Sodoma ziehe und nicht mehr zu ihnen umkehre, damit ihm nicht etwa begegne, was dem Weibe des Lot widerfuhr. Ist aber Jemand von dieser gottlosen Ketzerei vom Anfange an rein geblieben, so mag er sich in Christo rühmen und sagen: „Wir haben unsere Hände zu keinem andern Gotte ausgestreckt;“ wir haben die Werke unserer Hände nicht angebetet, und kein Geschöpf verehrt anstatt deiner, o Gott, du Schöpfer aller Dinge, durch dein Wort, den eingebornen Sohn unsern Herrn Jesus Christus, durch welchen dir, Vater, und zugleich mit dem Worte in dem heiligen Geiste der Ruhm und die Macht sey von Ewigkeit zu Ewigkeit. Amen.</p><p>Des Bischofes Athanasius Schrift an sämmtliche Einsiedler aller Orte über die von den Arianern unter Constantius verübten Frevel. Diese ganze Schrift ist von dem Bischofe gegen den Constantius verfaßt worden.</p>
