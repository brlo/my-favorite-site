      <p><em>Vier Briefe an Serapion von Thmuis, BKV 1. Reihe, Bd. 13, Kempten/München 1913.</em></p><h2>Erster Brief</h2><p>Dein Brief, ein Beweis deiner heiligen Zuneigung, wurde mir in der Wüste übergeben. Und wenn auch bittere Verfolgung und mannigfache Nachstellung derer uns bedrängte, die uns nach dem Leben strebten, so hat uns doch „der Vater der Erbarmung und Gott jeglichen Trostes" durch deinen Brief getröstet. Denn in der Erinnerung an deine und aller Edeldenkenden Wohlgeneigtheit glaubte ich sie alle da bei mir zugegen. Ich war deshalb beim Empfang des Briefes hocherfreut; als ich ihn aber gelesen hatte, überkam mich um jener willen, die nun einmal gegen die Wahrheit streiten wollen, alsbald wieder große Niedergeschlagenheit. Du, innig und wahrhaft geliebter Freund, selbst voll Betrübnis, schreibst mir nämlich, daß sich einige wegen der Lästerung des Gottessohnes zwar von den Arianern getrennt haben, aber selbst unrichtige Anschauungen über den Heiligen Geist haben und behaupten, derselbe sei nicht bloß ein Geschöpf, sondern sogar einer der dienenden Geister und nur um eine Stufe von den Engeln verschieden. Das ist zwar ein scheinbarer Kampf gegen die Arianer, in Wahrheit jedoch ein Widerspruch gegen den frommen Glauben. Denn wie jene durch die Leugnung des Sohnes auch den Vater leugnen, so schmähen diese durch die Schmähung des Heiligen Geistes auch den Sohn. Beide Parteien teilten sich lediglich in den Widerstand gegen die Wahrheit, um so, indem die einen über den Logos und die andern über den Geist unrichtigen Anschauungen huldigen, die heilige Trinität in gleicher Weise zu lästern. Als ich nun das so bedachte und eingehend überlegte, überkam mich Traurigkeit, weil der Teufel wieder Gelegenheit gefunden hatte, durch jene, die seine wahnwitzige Rolle darstellen, sein Spiel zu treiben. Ich hatte zwar den Entschluß gefaßt, in dieser Zeit zu schweigen; aber auf die Anregung deiner Heiligkeit hin und um des Irrglaubens und der satanischen Dreistigkeit jener Leute willen schreibe ich in aller Kürze diesen Brief, allerdings kaum dazu imstande, nur damit auch du dadurch veranlaßt würdest, gemäß deiner Einsicht das Mangelnde zu ergänzen, und damit so die Widerlegung der gottlosen Ketzerei vollkommen wäre.</p><p>Für die Arianer liegt allerdings auch diese Anschauung nicht fern. Denn da sie einmal den Logos Gottes leugnen, ist es natürlich, wenn sie in gleicher Weise auch gegen seinen Geist lästern. Darum brauche ich gegen sie auch nichts mehr zu sagen; denn es genügt, was vordem gegen sie gesagt worden ist. Gegenüber jenen aber, die sich über den Geist im Irrtum befinden, ist in gewisser Weise, wie sie sich selbst ausdrücken dürften, eine Untersuchung und eine Antwort am Platze. Denn man muß sich über den Unverstand dieser Leute wundern, daß sie die Geschöpflichkeit des Sohnes Gottes ablehnen — und hierin vertreten sie auch die richtige Anschauung —, trotzdem es aber auch nur ertragen können, den Geist des Sohnes ein Geschöpf nennen zu hören. Wenn sie nämlich wegen der Einheit des Logos mit dem Vater nicht zugeben, daß der Sohn selbst zu den geschaffenen Wesen gehöre, sondern, wie es der Wahrheit entspricht, dafür halten, daß er Schöpfer der gewordenen Dinge sei, warum nennen sie den Heiligen Geist ein Geschöpf, der mit dem Sohn dieselbe Einheit besitzt wie dieser mit dem Vater, und warum sehen sie nicht ein, daß sie durch die Ablehnung einer Trennung des Sohnes vom Vater wohl die Einheit Gottes wahren, aber durch die Trennung des Geistes vom Logos die Einheit des göttlichen Wesens in der Trinität darangeben, da sie dasselbe spalten, ihm eine fremde, wesensverschiedene Natur beimischen und es den Geschöpfen gleichstellen? Das läßt die Trinität nicht mehr als Wesenseinheit erscheinen, sondern als Zusammensetzung aus zwei verschiedenen Naturen, wegen der Wesensverschiedenheit des Geistes, wie sie sich dieselbe erdichtet haben. Was soll aber das für eine Gottesvorstellung sein, die Schöpfer und Geschöpf in sich beschließt? Denn entweder gibt es keine Trinität (τριάς), sondern eine Zweiheit (δυάς) und dann die Schöpfung; oder, wenn es eine Trinität gibt, wie es in Wirklichkeit der Fall ist, warum stellen sie den Geist der Trinität mit den Geschöpfen zusammen, die erst auf die Trinität folgen? Denn das heißt wieder, die Trinität zertrennen und auflösen. Weil sie also über den Heiligen Geist unrichtig denken, können sie auch über den Sohn nicht richtig denken. Denn, wenn sie über den Logos richtig dächten, würden sie auch über den Geist richtig denken, der vom Vater ausgeht und dem Sohne eigen ist, von ihm den Jüngern und allen, die an ihn glauben, gegeben wird. In diesem Irrtum befangen, haben sie nicht einmal über den Vater den wahren Glauben. Denn jene, die dem Geiste widerstehen, leugnen, wie der große Blutzeuge Stephanus sagte, auch den Sohn. Jene aber, die den Sohn leugnen, haben auch den Vater nicht.</p><p>Woher nehmt ihr also den Grund zu solcher Kühnheit, daß ihr nicht einmal den Ausspruch des Herrn fürchtet: „Wer gegen den Heiligen Geist lästert, erhält keine Verzeihung, weder in dieser Welt noch in der künftigen„? Denn die Arianer begriffen zwar die Gegenwart des Logos im Fleische und die um derselben willen ergangenen Aussprüche nicht, schöpften aber doch daraus den Vorwand für ihre Ketzerei und wurden so als Feinde Gottes und als Schwätzer erwiesen, die im Irdischen befangen sind. Wodurch seid aber ihr in Irrtum geführt worden? Von wem habt ihr solches gehört, oder welche Bewandtnis hat es mit diesem euern Irrtum? Wir haben, sagen sie, beim Propheten Amos gelesen, daß Gott spricht: „Denn sieh, ich bin es, der den Donner festigt und den Geist (eig. Wind, πνεῦμα) schafft und den Menschen seinen Gesalbten verkündet, der Morgengrauen und Nebeldunkel bildet und auf die Höhen der Erde tritt; Herr, Gott der Allmächtige ist sein Name“. Dadurch wurden wir bestimmt, den Arianern beizupflichten, die den Heiligen Geist für ein Geschöpf erklären. Die Stelle bei Amos habt ihr also gelesen; wenn es aber in den Sprüchen heißt: „Der Herr schuf mich als Anfang seiner Wege zu seinen Werken„, habt ihr das nicht gelesen oder habt ihr es gelesen? Diese Stelle erklärt ihr der Wahrheit gemäß, so daß ihr den Logos kein Geschöpf zu nennen braucht. Die Stelle beim Propheten dagegen bemüht ihr euch gar nicht zu erklären, habt vielmehr, da ihr bloß das Wort πνεῦμα hörtet, angenommen, daß der Heilige Geist ein Geschöpf genannt werde. Nun sagt aber in den Sprüchen deutlich die Weisheit: „Er hat mich geschaffen“. Trotzdem erklärt ihr den Ausspruch richtig, so daß ihr die schöpferische Weisheit nicht unter die Geschöpfe zählt. Die erwähnte Prophetenstelle enthält aber gar keine Aussage über den Heiligen Geist, sondern bezieht sich schlechtweg auf ein πνεῦμα (Wind). Da nun in der Schrift eine sehr mannigfache Bedeutungsverschiedenheit für den Ausdruck πνεῦμα herrscht, und die Stelle ihren eigenen richtigen Sinn haben kann, wie könnt ihr dann in so streitsüchtiger Weise oder, vom Biß der arianischen Schlange verwundet, glauben, es sei von Amos der Heilige Geist gemeint, nur damit ihr es nicht unterlassen müßt, ihn für ein Geschöpf zu halten?</p><p>Sagt also, ob ihr irgendwo in der göttlichen Schrift den Heiligen Geist schlechtweg πνεῦμα genannt findet, ohne einen Zusatz wie „Gottes" (τοῦ θεοῦ) oder „des Vaters" (τοῦ πατρός) oder „mein" (ἐμοῦ) oder selbst „Christi" (τοῦ χριστοῦ) oder „des Sohnes" (τοῦ ὑιοῦ) oder „von mir“(παρ ἐμοῦ) d. h. von Gott (παρὰ τοῦ θεοῦ) oder mit dem Artikel, so daß er nicht einfach πνεῦμα, sondern τὸ πνεῦμα heißt, oder geradezu der „Heilige Geist”, der „Tröster" oder (Geist) „der Wahrheit" d.h. des Sohnes, der da spricht: „Ich bin die Wahrheit“. Durftet ihr demnach vermuten, da ihr einfach das Wort πνεῦμα hörtet, es sei dies der Heilige Geist? Ausgenommen von dieser Regel sollen indes jene sein, die nach dem Empfang des Heiligen Geistes abermals genannt werden, und die, vorher über den Heiligen Geist belehrt, in der Folge, wenn bei Wiederholung und Erinnerung nur vom Geiste (τοῦ πνεύματος) die Rede ist, wohl wissen, von wem die Rede ist, zumal auch so der Artikel dabeisteht. Ohne den Artikel oder einen Zusatz, wie vorhin erwähnt, dürfte der Heilige Geist überhaupt nicht bezeichnet sein. Dahin gehört, was Paulus den Galatern schreibt: „Nur das will ich von euch wissen: Habt ihr durch Gesetzeswerke den Geist empfangen oder durch gläubiges Hören?” Wen hatten sie aber sonst empfangen als den Heiligen Geist, der jenen gegeben wird, die glauben und durch das Bad der Wiedergeburt neu geboren werden? Auch den Thessalonikern schreibt er: „Lasset den Geist nicht erlöschen“. Sie selbst wußten wohl, wen sie empfangen hatten, und deshalb mahnte er sie, die in ihnen entzündete Gnade des Geistes nicht durch Nachlässigkeit erlöschen zu lassen. Den gleichen Sinn hat es, wenn die Evangelisten vom Heiland des Fleisches wegen, das er angenommen hat, in den Evangelien nach Menschenart sagen: „Jesus aber kehrte voll des Geistes vom Jordan zurück”, und „dann ward Jesus vom Geiste in die Wüste geführt“. Vorher wurde nämlich von Lukas bemerkt: „Es geschah aber, während alles Volk sich taufen ließ, als auch Jesus sich taufen ließ und betete, daß sich der Himmel öffnete und der Heilige Geist in körperlicher Gestalt wie eine Taube auf ihn herabkam”. Offenbar wurde mit dem Ausdruck „der Geist" der Heilige Geist bezeichnet. Deshalb ist es, falls jemand den Heiligen Geist besitzt, auch wenn derselbe nur „Geist" genannt wird, keineswegs zweifelhaft, daß der Heilige Geist gemeint sei, besonders wenn der Artikel dabeisteht.</p><p>Äußert euch also über die euch vorgelegte Frage, ob ihr irgendwo in der göttlichen Schrift gefunden habt, daß der Heilige Geist schlechtweg Geist (πνεῦμα) genannt werde, ohne den vorhin erwähnten Zusatz und abgesehen von der angeführten Beobachtung. Aber ihr könnt das nicht beweisen; denn ihr werdet keine solche Stelle finden. Dagegen steht in der Genesis geschrieben: „Und Gottes Geist schwebte über dem Wasser“; und kurz hernach heißt es: „Es soll mein Geist nicht in diesen Menschen bleiben, weil sie Fleisch sind”. Im Buche Numeri ferner spricht Moses zum Sohne Nuns: „Ereifere dich nicht für mich; und wer möchte doch das Volk des Herrn zu Propheten machen, wenn der Herr seinen Geist auf sie geben würde“. Und im Richterbuch heißt es von Othoniel: „Es kam auf ihn der Geist des Herrn und er richtete Israel”. Und wiederum: „Da kam über Jephte der Geist des Herrn“. Von Samson heißt es gleichfalls: „Der Knabe reifte heran und der Herr segnete ihn”, und dann: „Der Geist des Herrn fing an, mit ihm zu sein“, und „es kam über ihn der Geist des Herrn”. David aber singt: „Deinen Heiligen Geist nimm nicht weg von mir“; ebenso im 142. Psalm: „Dein guter Geist wird mich auf rechtem Pfade führen; um deines Namens willen, o Herr, wirst du mich beleben”. Bei Jesaias aber steht geschrieben: „Der Geist des Herrn ist über mir, deshalb hat er mich gesalbt“. Vorher aber heißt es: „Wehe, abtrünnige Kinder! Das spricht der Herr: Ihr habt einen Beschluß gefaßt, aber ohne mich; ihr habt Bündnisse geschlossen, aber ohne meinen Geist, um Sünden auf Sünden zu häufen”; ferner: „Höret dieses: Nicht habe ich von Anfang her im Verborgenen geredet; da es geschah, war ich da; und jetzt hat mich der Herr und sein Geist gesandt“. Kurz darauf heißt es also: „Das ist mein Bund mit ihnen, spricht der Herr, mein Geist, der in dir ist”. Und im folgenden führt er weiter aus: „Kein Gesandter und kein Engel, sondern der Herr selbst rettete sie, weil er sie liebte und sie schonte; er erlöste sie und nahm sie auf und erhöhte sie alle Tage der Ewigkeit; sie aber waren ungehorsam und erzürnten seinen Heiligen Geist, und er wandelte sich ihnen zur Feindschaft“. Ezechiel aber sprach also: „Und der Geist hob mich empor und brachte mich in das Land der Chaldäer zu den Gefangenen, im Gesichte, im Geiste Gottes”. Bei Daniel aber heißt es: „Gott erweckte den Heiligen Geist in einem jungen Knaben mit Namen Daniel, und er rief mit lauter Stimme: Ich bin rein von ihrem Blute“. Und Michäas sagt: „Das Haus Jakob hat den Geist des Herrn erbittert”. Auch durch Joel spricht Gott: „Und nach dem wird es geschehen, daß ich von meinem Geist über alles Fleisch ausgieße“. Durch Zacharias ergeht wiederum die Stimme Gottes also: „Doch, meine Worte und meine Satzungen nehmet an, die ich in meinem Geiste meinen Dienern, den Propheten, auftrage”. Und als der Prophet das Volk zurechtwies, sagte er kurz darauf: „Sie haben ihr Herz unlenksam gemacht, so daß sie nicht auf mein Gesetz hörten noch auf die Worte, die ihnen der Herr der Allmächtige in seinem Geiste durch Vermittlung der früheren Propheten gesandt hat". Dies Wenige habe ich aus dem Alten Testamente gesammelt und beigebracht.</p><p>Erkundigt euch auch nach dem Inhalt der Evangelien und nach dem, was die Apostel geschrieben haben, und ihr werdet hören, wie auch dort, da die Verschiedenheit der Geister sehr mannigfach ist, im besonderen der Heilige Geist nicht schlechtweg Geist (πνεῦμα), sondern mit dem vorhin erwähnten Zusatz genannt wird. Als der Herr, wie ich oben erwähnte, des Fleisches wegen, das er trug, nach Menschenart getauft ward, kam auf ihn, so wird uns berichtet, der Heilige Geist herab. Diesen teilte er seinen Jüngern mit und sprach dabei: „Empfanget den Heiligen Geist„. Ferner belehrte er sie: „Der Tröster, der Heilige Geist, den der Vater in meinem Namen senden wird, der wird euch alles lehren“. Und kurz darauf sagte er von ihm: „Wenn der Tröster kommt, den ich euch vom Vater senden werde, der Geist der Wahrheit, der vom Vater ausgeht, der wird über mich Zeugnis geben„. Und wiederum: „Denn nicht ihr seid es, die da reden, sondern der Geist eures Vaters ist es, der in euch redet“. Und kurz hernach: „Wenn ich im Geiste Gottes die Dämonen austreibe, so ist doch das Reich Gottes zu euch gekommen„. Und unsere gesamte Kenntnis von Gott und unsere Heiligung, durch die er uns mit sich und durch sich mit dem Vater verband, vollendend, trug er den Jüngern auf: „Gehet, lehret alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes“. Als er ihnen die Sendung desselben verhieß, „befahl er ihnen, nicht aus Jerusalem fortzugehen„; und einige Tage später, „als der Pfingsttag herbeigekommen war, waren alle an demselben Ort versammelt; da entstand plötzlich ein Brausen vom Himmel her, als ob ein heftiger Wind einherführe, und erfüllte das ganze Haus, wo sie saßen. Und es erschienen ihnen Zungen wie von Feuer, die sich zerteilten; und auf jeden von ihnen ließ sich eine nieder. Da wurden sie alle vom Heiligen Geiste erfüllt und begannen mit anderen Zungen zu reden, wie der Geist es ihnen eingab, sich auszusprechen“. Darum wurde denn auch durch die Handauflegung der Apostel den Täuflingen der Heilige Geist verliehen. Ferner weissagte ein gewisser Agabos durch ihn, da er sagte: „Das spricht der Heilige Geist„. Und Paulus sprach: „In welcher (Herde) euch der Heilige Geist zu Bischöfen gesetzt hat, die Kirche Gottes zu leiten, die er sich durch sein eigenes Blut erwarb“. Und nach der Taufe des Eunuchen „entführte der Geist des Herrn den Philippus„. Petrus aber spricht: „Wenn ihr die Erfüllung des Glaubens davontragt, das Heil der Seelen; jenes Heil, nach dem Propheten gefragt und geforscht haben, die von der für euch bestimmten Gnade prophezeiten; die forschten, auf welche Zeit und auf welche Lage der Geist Christi in ihnen deutete, wenn er im voraus die Leiden, die Christus treffen, und die Verherrlichungen, die darauf folgen sollten, bezeugte“. Und Johannes schrieb: „Daran erkennen wir, daß wir in ihm bleiben und er in uns, weil er uns von seinem Geist gegeben hat„. Paulus aber schreibt den Römern: „Ihr lebt nicht im Fleische, sondern im Geiste, wenn doch der Geist Gottes in euch wohnt. Wenn aber jemand den Geist Christi nicht hat, der ist nicht sein, Ist dagegen Christus in euch, so ist zwar der Leib tot Um der Sünde willen, der Geist aber Leben wegen der Gerechtigkeit. Und wenn der Geist dessen, der Jesus auferweckt hat, in euch wohnt, so wird er, der Christus von den Toten auferweckt hat, auch euere sterblichen Leiber wieder lebendig machen durch seinen Geist, der in euch wohnt“. Ferner an die Korinther: „Denn der Geist erforscht alle Dinge, auch die Tiefen der Gottheit. Wer erkennt das (Wesen) des Menschen, wenn nicht der Geist des Menschen, der in ihm ist? So hat auch das (Wesen) Gottes niemand erkannt außer der Geist Gottes. Wir aber haben nicht den Geist der Welt empfangen, sondern den Geist aus Gott, damit wir wissen, was uns von Gott geschenkt ist„. Und kurz hernach: „Wisset ihr denn nicht, daß ihr ein Tempel Gottes seid, und der Geist Gottes in euch wohnt?“ Und weiterhin: „Doch, ihr ließt euch abwaschen, doch ihr seid geheiligt, doch ihr seid gerechtfertigt durch den Namen unseres Herrn Jesus Christus und durch den Geist unseres Gottes„. Und wiederum: „Alles das aber wirkt ein und derselbe Geist, der einem jeden besonders seinen Teil zuweist, wie er will“. Und abermals: „Der Herr aber ist der Geist; wo aber der Geist des Herrn, da ist Freiheit„. Sieh auch, wie er den Galatern folgendes schreibt: „Auf daß der Segen Abrahams durch Christus Jesus käme, auf daß wir die Verheißung des Geistes empfingen durch den Glauben“. Und wiederum: „Weil ihr aber Söhne seid, hat Gott den Geist seines Sohnes in euere Herzen gesandt, der da ruft: Abba, Vater. Also bist du nicht mehr Knecht, sondern Sohn; wenn aber Sohn, dann auch Erbe durch Christus„. Zu den Ephesiern aber sprach er also: „Betrübet ja nicht den Heiligen Geist Gottes, durch den ihr besiegelt seid für den Tag der Erlösung“. Und wiederum: „Beeifert euch, die Einheit des Geistes zu bewahren durch das Band des Friedens„. An die Philipper schrieb er freimütig: „Was macht es? Wenn nur auf jede Weise, ob mit Hintergedanken oder in aufrichtiger Gesinnung, Christus verkündigt wird, so freue ich mich darüber, ja werde mich weiter freuen; denn ich weiß, daß mir dies zum Heil gereichen wird durch euer Gebet und die Hilfe des Geistes Jesu Christi, gemäß meiner Erwartung und Sehnsucht, daß ich in keinem Stücke werde zuschanden werden“. Und abermals: „Wir sind nämlich die Beschneidung, die wir dem Geiste Gottes dienen, und unseren Ruhm in Christus Jesus haben„. Den Thessalonikern aber wird versichert: „Der Verächter verachtet demnach nicht einen Menschen, sondern Gott, der seinen Heiligen Geist in euch gegeben hat“. An die Hebräer schreibt er also: „Der Heilige Geist bekundet, daß der Weg zum Heiligtum noch nicht frei ist, solange das alte Zelt noch Bestand hat„. Und wiederum: „Um wieviel schlimmere Strafe, meint ihr, wird dem zugemessen werden, der den Sohn Gottes mit Füßen tritt, das Blut des Bundes für gemein achtet, durch das er geheiligt worden ist, und an dem Geiste der Gnade frevelt?“ Und abermals: „Denn wenn schon das Blut der Böcke und Stiere und die Asche der Kuh, die auf die Unreinen gesprengt wird, zur fleischlichen Reinigkeit heiligt, um wieviel mehr wird das Blut Christi, der sich selbst durch den ewigen Geist als untadeliges Opfer Gott dargebracht hat, unser Gewissen von den toten Werken reinigen?„ Und an die Thessaloniker: „Und dann wird der Frevler sich offenbaren, den der Herr Jesus Christus durch den Geist seines Mundes vertilgen und durch den Glanz seiner Ankunft vernichten wird“.</p><p>Sieh, wie der Heilige Geist in der ganzen göttlichen Schrift kenntlich gemacht ist! Was habt ihr nun dergleichen beim Propheten wahrgenommen? Nicht einmal den Artikel hat beim Propheten das Wort πνεῦμα, damit ihr auch nur einen Vorwand hättet. Aber ihr habt es einfach gewagt, euch selbst Redefiguren (τρόπους) zu ersinnen und zu behaupten, der Geist, von dem gesagt ist, daß er geschaffen werde, sei eben der Heilige Geist, obwohl ihr auch bei gelehrten Männern über die Verschiedenheit der Geister hättet Auskunft erlangen können. Denn auch ein menschlicher Geist wird erwähnt, wie David singt: „Des Nachts sann ich in meinem Herzen, und mein Geist war betrübt„. Auch Baruch betet mit den Worten: „Die Seele in Nöten und der geängstigte Geist ruft zu dir“. Und im Gesang der drei Jünglinge heißt es: „Preist, ihr Geister„ und „Seelen der Gerechten den Herrn“. Der Apostel aber schreibt: „Der Geist selbst bezeugt es unserem Geiste, daß wir Kinder Gottes sind; wenn aber Kinder, dann auch Erben„. Und wiederum: „Niemand kennt das (Wesen) des Menschen außer der Geist des Menschen, der in ihm ist“. Im Brief an die Thessaloniker aber bittet er: „Möchte doch euer Geist und die Seele und der Leib unversehrt, untadelig bis zur Ankunft unseres Herrn Jesus Christus bewahrt werden„. Es ist aber auch vom Wehen der Winde die Rede; so in der Genesis: „Und Gott ließ einen Wind (πνεῦμα) über die Erde streichen und das Wasser nahm ab“. Und von Jonas: „Und der Herr erregte einen Wind (πνεῦμα) auf dem Meer, und es entstand ein großer Sturm auf dem Meer, und das Schiff war in Gefahr, zu scheitern„. Und im 106. Psalm steht geschrieben: „Er sprach, und es erhob sich das Wehen (πνεῦμα) des Sturmwinds, und seine Wogen gingen hoch“. Im 148. Psalm aber: „Preiset den Herrn von der Erde her, Drachen und alle Tiefen; Feuer, Hagel, Schnee, Eis, Sturmwind, die sein Wort vollführen„. Und bei Ezechiel in seinem Klagelied auf Tyros: „Im Herzen des Meeres, auf vielem Wasser führten dich deine Ruderer; der Südwind zerschmetterte dich“.</p><p>Wenn ihr aber die heiligen Schriften zur Hand nehmt, werdet ihr finden, daß auch der Sinn der göttlichen Worte selbst πνεῦμα genannt wird, wie Paulus schreibt: „Der uns auch befähigt hat zu Dienern des Neuen Bundes, nicht des Buchstabens, sondern des Geistes. Denn der Buchstabe tötet, der Geist aber macht lebendig„. Das Wort wird demnach als Buchstabe bezeichnet, der ihm zugrunde liegende Sinn dagegen wird Geist genannt. So ist auch „das Gesetz geistig“, „damit wir„, wie er wiederum sagt, „nicht mehr im alten Buchstaben, sondern im neuen Geiste unseren Dienst leisten“. Dankend aber sagte er: „So gilt es denn von mir: Ich diene mit der Vernunft dem Gesetze Gottes, mit dem Fleisch aber dem Gesetze der Sünde. Es gibt also für jetzt keine Verdammnis mehr für die, die in Christus Jesus sind. Denn das Gesetz des Lebensgeistes hat dich in Christus Jesus frei gemacht von dem Gesetz der Sünde„. Auch Philippus, der den Eunuchen vom Buchstaben zum Geist bekehren wollte, sagte: „Verstehst du, was du liesest?“ Ein solcher Geist war nach dem Zeugnis des Buches Numeri auch in Kaleb, da Gott spricht: „Aber mein Knecht Kaleb, da ein anderer Geist in ihm war und er mir folgte, so will ich ihn in das Land führen, in das er daselbst gekommen ist„. Weil er nämlich anderen Sinnes redete als jene, ward er Gott wohlgefällig. Ein solches Herz sollte auch das Volk nach Gottes Ermunterung haben, da er durch Ezechiel sprach: „Schaffet euch ein neues Herz und einen neuen Geist“. Bei diesem Stand der Dinge und bei der großen Verschiedenheit, die nachweislich bezüglich der Geister besteht, tätet ihr besser, wenn von einem geschaffenen Geist die Rede ist, an einen der oben erwähnten Geister zu denken, wie jenen, von dem bei Jesaias geschrieben steht: „Aram hat sich mit Ephraim verständigt, und es bebte seine Seele und die Seele seines Volkes, wie im Walde ein Baum vom Winde (πνεῦμα) geschüttelt wird„. Das gilt auch von dem „Winde, den der Herr aus dem Meere“ des Jonas wegen „erregte„. Denn dem Donner folgt das Brausen der Winde, wie gelegentlich des Regens über Achab nach der Schrift: „Und es geschah also, und währenddessen verfinsterte sich der Himmel durch Wolken und Wind (πνεύματι)“.</p><p>Aber, heißt es, da die Schriftstelle nun doch einmal den Gesalbten erwähnt, so darf man folglich unter dem hier genannten Geist nichts anderes verstehen als den Heiligen Geist. Ihr habt also wohl bemerkt, daß der Heilige Geist mit Christus zusammen genannt wird; wo habt ihr aber beobachtet, daß er der Natur nach vom Sohn getrennt und geschieden wird, weil ihr behauptet, Christus sei kein Geschöpf, während ihr den Heiligen Geist ein Geschöpf nennt? Es ist auch widersinnig, das von Natur Ungleiche zusammen zu nennen und zu preisen. Denn welche Gemeinschaft oder welche Ähnlichkeit hat das Geschöpf mit dem Schöpfer? Ihr müßtet ja sonst auch mit dem Sohne die durch ihn geschaffenen Wesen zusammenzählen und verbinden. Demnach hätte es genügt, das Schriftwort vom Wehen der Winde zu verstehen, wie ausgeführt wurde. Weil ihr aber vorschützt, daß an jener Stelle auch Christus erwähnt werde, müssen wir die Stelle genauer ins Auge fassen, ob wir nicht auch für den Geist, von dem es heißt, daß er geschaffen werde, einen treffenderen Sinn gewinnen können. Was bedeutet nun die Verkündigung seines Gesalbten unter den Menschen anders als sein Menschwerden und dasselbe wie der Ausspruch: „Sieh, die Jungfrau wird empfangen und einen Sohn gebären, und seinen Namen wird man Emmanuel nennen“, und alles andere, was über seine Ankunft geschrieben steht? Ist aber von der Verkündigung der Ankunft des Logos im Fleische die Rede, was muß man dann unter dem geschaffenen Geist verstehen, wenn nicht die Neuschöpfung und Erneuerung des Geistes der Menschen? Denn diese hat Gott auch durch Ezechiel verheißen mit den Worten: „Und ich werde euch ein neues Herz geben und werde euch einen neuen Geist geben; und ich werde das steinerne Herz aus eurem Fleische nehmen und werde euch ein Herz von Fleisch geben, und meinen Geist werde ich euch geben”. Wann ging denn das in Erfüllung wenn nicht damals, als der Herr erschien und durch seine Gnade alles erneute? Sieh, auch an dieser Stelle wird die Verschiedenheit der Geister ersichtlich: Unser Geist ist jener, der erneut wird; vom Heiligen Geist aber sagt Gott nicht schlechtweg, daß er ein Geist, sondern daß er sein Geist sei, durch den auch der unsere erneut wird, wie auch der Psalmist im 103. Psalm sagt: „Nimmst du weg ihren Geist, so vergehen sie und kehren zum Staub zurück; sendest du deinen Geist aus, so werden sie geschaffen, und du erneust das Antlitz der Erde“. Wenn wir aber durch den Geist in der Tat erneut werden, so ist es nicht der Heilige Geist, von dem hier gesagt wird, daß er geschaffen werde, sondern unser Geist. Wenn ihr also richtig einseht, daß der Sohn kein Geschöpf ist, weil durch den Logos alles geschaffen ist, wie soll es dann keine Lästerung sein, den Geist ein Geschöpf zu nennen, in dem der Vater durch den Logos alles vollendet und erneut? Auch wenn sie sich eingebildet haben, weil einfach geschrieben steht, daß der Geist geschaffen werde, so sei damit der Heilige Geist gemeint, müssen sie sich schließlich doch überzeugen lassen, daß es nicht der Heilige Geist ist, der geschaffen wird, sondern unser Geist, der durch ihn erneut wird. Darum hat auch David im Psalm gefleht: „Ein reines Herz schaffe in mir, und den rechten Geist erneue in meinem Innern”. Hier wird nämlich gesagt, daß er ihn schaffe; zuvor aber hatte er ihn bereits gebildet, wie Zacharias es ausspricht: „Der den Himmel ausspannt und die Erde gründet und den Geist des Menschen in ihm bildet“. Denn den Geist, welchen er vorher gebildet hatte, hat er, nachdem derselbe gefallen war, neu geschaffen, indem er selbst zum Geschöpf kam, als der Logos Fleisch ward, „um”, wie der Apostel sagt, „beide zu einem neuen Menschen zu schaffen“,”der nach Gott geschaffen ist in Wahrheit, Gerechtigkeit und Heiligkeit“. Damit meinte er nämlich nicht, daß etwa ein anderer Mensch geschaffen worden sei als jener, der im Anfang nach dem Ebenbild Gottes geschaffen wurde; er ermahnte vielmehr, die in Christus geschaffene und erneute Gesinnung (νοῦς) anzunehmen, was gleichfalls wieder durch Ezechiel angedeutet wird, wenn er sagt: „Bereitet euch ein neues Herz und einen neuen Geist; und warum sterbet ihr, Haus Israel? Ich will ja nicht den Tod des Sterbenden, spricht Gott der Herr”.</p><p>Hat man sich nun diese Vorstellung vom geschaffenen Geist zu bilden, so kann füglich der Donner, der gefestigt wird, als das Wort des Glaubens und das unerschütterliche Gesetz des Geistes gefaßt werden. Als nämlich der Herr Jakobus und Johannes zu Dienern desselben bestellte, nannte er sie Boanerges, d. h. Donnersöhne. Das ruft auch Johannes wahrhaftig vom Himmel herab: „Im Anfang war der Logos, und der Logos war bei Gott, und Gott war der Logos“. Vorher bot nämlich das Gesetz nur den Schatten der künftigen Güter; als aber Christus den Menschen verkündet ward, und als er erschienen war und sprach: „Ich bin es, der redet”, „da erschütterte“, wie Paulus sagte, „seine Stimme die Erde, nachdem er vorher verheißen hatte: Noch mal werde ich nicht nur die Erde, sondern auch den Himmel erschüttern”. Dieses „noch mal" deutet die Verwandlung dessen an, was erschüttert wird, damit das bleibe, was nicht erschüttert wird. Deshalb, weil wir ein unerschütterliches Reich empfangen, bezeugen wir Dank, „durch den wir Gott wohlgefällig dienen“. Das Reich aber, das er unerschütterlich nennt, besingt David als gefestigtes: „Der Herr ward König, hat sich in Herrlichkeit gekleidet; der Herr hat sich mit Macht gekleidet und umgürtet. Denn er hat den Erdkreis gefestigt, der nicht erschüttert werden soll”. Der Ausspruch des Propheten bezeichnet demnach die Ankunft des Heilands, durch die wir erneut wurden und durch die das Gesetz des Geistes unerschütterlich bleibt. Aber jene haben sich als wahrhaftige Tropiker mit den Arianern verbunden und in die Lästerung der Gottheit geteilt, so daß jene den Sohn, sie aber den Geist ein Geschöpf nennen; sie wagten es, wie sie sich selbst ausdrücken, sich Redefiguren (τρόπους) zu ersinnen und den Ausspruch des Apostels zu verdrehen, den er treffend an Timotheus schrieb: „Ich beschwöre dich vor Gott und Jesus Christus und den auserwählten Engeln, daß du dies ohne Vorurteil beobachtest und nichts aus Parteirücksicht tust“. Jene sagen nun, weil er Gott und Christus und dann die Engel nannte, müsse der Geist den Engeln beigezählt werden, zu ihrer Gattung gehören und ein Engel, größer als die anderen, sein. Das ist nun fürs erste die Erfindung des gottlosen Valentinus, und es ist wohl bekannt, daß sie dasselbe sagen wie er. Dieser behauptete nämlich, daß zugleich mit der Sendung des Trösters die gleich lang existierenden Engel gesendet worden seien. Ferner nehmen sie die Engel, indem sie den Geist zu den Engeln erniedrigen, in die Trinität auf. Denn, wenn ihrer Ansicht gemäß auf Vater und Sohn die Engel folgen, dann gehören die Engel offenbar zur Trinität, und es gibt nicht mehr „dienende Geister, zum Dienste ausgesandt”, noch solche, die geheiligt werden, vielmehr heiligen sie selbst andere.</p><p>Welch großen Unverstand bekunden sie doch! Wo haben sie in der Schrift wieder gefunden, daß der Geist ein Engel genannt werde? Ich muß dazu das gleiche sagen wie vorhin. Tröster ist er genannt, Geist der Kindschaft, Geist der Heiligung, Geist Gottes und Geist Christi; nirgends aber Engel oder Erzengel oder dienender Geist, wie es die Engel sind; vielmehr dient ihm mit dem Sohne Gabriel, der zu Maria spricht: „Der Heilige Geist wird über dich kommen, und die Kraft des Höchsten wird dich überschatten“. Da nun die Schrift den Geist nicht Engel nennt, wie können sie ihr törichtes Unterfangen rechtfertigen? Nannte doch sogar Valentinus, der ihnen diese gottlose Gesinnung eingepflanzt hat, jenen Tröster, diese dagegen Engel, obgleich dieser ganz törichte Mensch den Geist in die gleiche Zeit mit derselben Daseinsdauer wie die Engel stellte. Sieh jedoch! sagen sie, beim Propheten Zacharias steht geschrieben: „Das spricht der Engel, der mit mir (ἐν ἐμοί) redet”. Es ist doch offenbar, daß er mit dem Engel, der zu ihm redet, den Geist meint. Das würden sie aber nicht sagen, wenn sie die Stelle aufmerksam gelesen hätten. Denn Zacharias sagt selbst, da er das Gesicht vom Leuchter schaute: „Und es antwortete der Engel, der mit mir redete, und sprach: Verstehst du nicht, was das ist? Und ich sprach: Nein, Herr. Und er antwortete und sprach zu mir: Das ist das Wort des Herrn an Zorobabel, das da lautet: Nicht durch große Macht noch durch Gewalt, sondern durch meinen Geist (soll es geschehen), spricht der Herr, der Allmächtige“. Es ist also ganz klar, daß der Engel, der mit dem Propheten sprach, nicht der Heilige Geist war, sondern daß jener eben ein Engel, dieser aber der Geist Gottes des Allmächtigen ist, in dessen Dienst der Engel steht, der von der Gottheit nicht getrennt werden kann und dem Logos eigen ist. Wenn sie indes die Äußerung des Apostels als Ausflucht benützen, weil nach Christus die auserwählten Engel genannt sind, so sollen sie sagen, welcher von diesen allen mit der Trinität zusammenzustellen sei. Denn alle sind doch der Zahl nach nicht einer. Oder welcher von ihnen stieg in Gestalt einer Taube zum Jordan hernieder? Denn „tausendmal Tausende und zehntausendmal Zehntausende dienen ihm”. Warum ist nicht gesagt, da der Himmel sich öffnete: Und es kam einer der auserwählten Engel hernieder, sondern „der Heilige Geist“? Oder warum sagte der Herr selbst, als er mit den Jüngern vom Ende der Zeiten sprach, mit deutlicher Unterscheidung: „Der Menschensohn wird seine Engel aussenden”? Und vorher heißt es: „Die Engel dienten ihm“. Er selbst aber spricht wiederum: „Die Engel werden ausgehen”. Als er den Jüngern den Heiligen Geist gab, sprach er: „Empfanget den Heiligen Geist“, und als er sie aussandte, sagte er: „Gehet, lehrt alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes”. Denn er verband weder einen Engel mit der Gottheit noch verband er uns durch ein Geschöpf mit sich und dem Vater, sondern durch den Heiligen Geist, bei dessen Verheißung er sagte, daß er nicht einen Engel, sondern „den Geist der Wahrheit" senden werde, „der vom Vater ausgeht“, „von ihm nimmt und gegeben wird”.</p><p>Auch Moses, der wohl erkannte, daß die Engel Geschöpfe seien, während der Heilige Geist mit dem Vater und dem Sohne geeint sei, hat deshalb abgelehnt, als Gott zu ihm sprach: „Geh, ziehe hinauf von hier, du und dein Volk, das du aus Ägypten geführt hast, in das Land, das ich Abraham, Isaak und Jakob zugeschworen habe mit den Worten: Euerem Samen werde ich es geben. Und ich will vor dir meinen Engel hersenden, und er wird den Kanaanäer vertreiben“. Er entgegnete: „Wenn du nicht selbst mit uns ziehst, so laß mich von hier nicht hinaufziehen”. Er wollte nämlich nicht, daß ein Geschöpf das Volk führe, damit sie nicht mehr dem Geschöpf als dem Schöpfer aller Dinge dienen sollten. Er hat in der Tat den Engel abgelehnt und Gott selbst gebeten, sie zu führen. Gott aber versprach es und sagte zu ihm: „Auch dieses dein Wort, das du gesprochen hast, will ich erfüllen; denn du hast Gnade gefunden vor meinen Augen, und ich kenne dich vor allen“. Ferner steht bei Jesaias geschrieben:”Der den Hirten der Schafe aus dem Lande führte; wo ist der, der den Heiligen Geist unter sie gab, der Moses mit der Rechten führte“. Und bald darauf sagt er: „Es stieg der Geist vom Herrn herab und führte sie. So führtest du dein Volk, dir einen herrlichen Namen bereitend”. Wer sollte aus all dem nicht die Wahrheit ersehen? Denn als Gott versprach, Führer zu sein, sieh, da versprach er nicht, einen Engel zu senden, sondern seinen Geist, der über allen Engeln ist, und der selbst das Volk führen sollte. Es ist daher erwiesen, daß der Geist nicht zu den Geschöpfen gehört, noch ein Engel ist, sondern über die Schöpfung erhaben und mit der Gottheit des Vaters geeint ist. Denn Gott selbst führte durch den Logos im Geiste das Volk, weshalb er auch durch die ganze Schrift sagt: „Ich führte euch aus Ägypten“; „ihr seid mir Zeugen, daß kein anderer Gott bei euch war außer mir”. Auch die Heiligen sprechen zu Gott: „Du führtest wie Schafe dein Volk“; und „der Herr führte sie in der Hoffnung und sie fürchteten sich nicht”. Ihm weihen sie auch ihr Loblied mit den Worten: „Dem, der sein Volk in der Wüste führte; denn in Ewigkeit währt sein Erbarmen“. Der große Moses aber sagt wiederholt: „Gott, der Herr, der vor euch herging”. Der Geist Gottes ist also kein Engel noch überhaupt ein Geschöpf, sondern der Wesenheit Gottes eigen. Denn, indem der Geist beim Volke war, war Gott durch den Sohn im Geist bei ihnen.</p><p>Das mag allerdings richtig sein, gestehen auch sie; aber, warum hat der Apostel nach Christus nicht den Heiligen Geist, sondern die auserwählten Engel genannt? Ebenso könnte man jedoch auch sie fragen: Warum hat Paulus nicht Erzengel, nicht Cherubim, nicht Seraphim, nicht Herrschaften, nicht Throne oder irgendetwas anderes, sondern nur die auserwählten Engel genannt? Sind also, weil seine Aufzählung nicht in dieser Weise erfolgte, die Engel Erzengel, oder gibt es nur Engel, aber keine Seraphim oder Cherubim, keine Erzengel und keine Herrschaften, keine Throne, keine Gewalten noch irgendetwas anderes? Aber das heißt dem Apostel Gewalt antun, warum er nicht so, sondern so geschrieben habe, heißt die göttlichen Schriften nicht kennen und deshalb von der Wahrheit abirren. Sieh, bei Jesaias steht nämlich geschrieben: „Kommet zu mir und höret dieses: Nicht habe ich von Anbeginn her im Verborgenen geredet; als es geschah, war ich da; und jetzt hat mich der Herr gesendet und sein Geist„. Und bei Aggäus: „Und jetzt fasse Mut, Zorobabel, spricht der Herr, und fasse Mut, Jesus, Sohn des Josedek, du Hoherpriester, spricht der Herr, und fasse Mut alles Volk des Landes, spricht der Herr, und arbeitet, weil ich bei euch bin, spricht der Herr der Allmächtige, und mein Geist bleibt in eurer Mitte“. Bei beiden Propheten wird nur der Herr und der Geist erwähnt. Was werden sie also dazu sagen? Wenn sie nämlich den Geist unter die Engel zählen, weil Paulus Christus erwähnte, vom Geiste aber schwieg, die auserwählten Engel dagegen nannte, so müssen sie bei der Lektüre dieser Prophetenstellen auch über den, der stillschweigend übergangen ist, um so dreister urteilen. Denn wenn sie behaupten, mit dem Herrn sei der Sohn gemeint, was wollen sie dann vom Vater sagen? Verstehen sie darunter aber den Vater, was müssen sie dann vom Sohne sagen? Die Lästerung nämlich, die aus ihrer Ansicht folgt, dürfte niemand auch nur denken wollen. Sie müssen ja behaupten, daß das, was mit Stillschweigen übergangen ist, nicht existiere, oder sie müssen es unter die Geschöpfe zählen.</p><p>Was werden sie aber sagen, wenn sie auch den Herrn sprechen hören: „Es war ein Richter in einer Stadt, der Gott nicht fürchtete und sich um keinen Menschen kümmerte“. Ist etwa gar, weil er nach Gott von einem Menschen redete, der Sohn dieser Mensch, Um den der ungerechte Richter sich nicht kümmerte? Oder ist etwa, weil er nach Gott den Menschen erwähnte, der Sohn der dritte nach dem Menschen und der Heilige Geist der vierte? Was werden sie dann sagen, wenn sie auch den Apostel in demselben Briefe wiederholt vernehmen: „Ich gebiete dir vor Gott, der alles belebt, und vor dem Herrn Jesus Christus, der vor Pontius Pilatus das herrliche Bekenntnis abgelegt hat, halte das Gebot mit lauterem Sinn und untadeligem Wandel”? Zweifeln sie etwa, weil er hier von den Engeln und vom Geist geschwiegen hat, an dem Dasein des Geistes oder an dem Dasein der Engel? Sie zweifeln in der Tat, solange sie sich auf solche Lästerungen einlassen. Wenn sie ferner die Schrift in der Exodos vernehmen: „Das Volk aber fürchtete den Herrn, und sie glaubten Gott und Moses, seinem Diener“, werden sie dann Moses Gott beizählen und nach Gott nicht den Sohn, sondern Moses denken? Was aber, wenn sie hören, wie der Patriarch Jakob Joseph mit den Worten segnet: „Gott, der mich behütet von meiner Jugend an bis zu diesem Tag, der Engel, der mich aus allen Nöten errettete, möge diesen Knaben segnen”. Ist etwa der Engel, weil er nach Gott genannt ist, früher als der Sohn, oder wird der Sohn zu den Engeln gezählt? In der Tat, sie werden wieder so urteilen, weil sie ein verderbtes Herz haben. Allein das ist nicht der apostolische Glaube, und ein Christ kann das überhaupt nicht dulden. Denn die heilige und selige Trinität ist ungeteilt und in sich selbst geeint; und wenn der Vater genannt wird, so ist auch dessen Logos dabei, und der Geist im Sohne. Auch wenn der Sohn genannt wird, ist im Sohn der Vater, und der Geist ist nicht außerhalb des Logos. Denn eine ist die Gnade aus dem Vater, die durch den Sohn im Heiligen Geist vollendet wird; eine Gottheit existiert, und ein Gott, der über alles, durch alles und in allem ist. So hat sicherlich auch Paulus, als er sprach: „Ich schwöre vor Gott und Jesus Christus", gewußt, daß der Geist vom Sohne nicht zu trennen, sondern auch selbst in Christus sei, wie der Sohn im Vater. Ganz treffend fügte er aber die auserwählten Engel bei; daran sollte der Schüler, dem der Schwur galt, erkennen, daß das, was von Gott gesprochen wird, im Geist gesprochen ist, daß die Engel in unseren Angelegenheiten Dienste leisten und eines jeden Handlungen beaufsichtigen. Darum soll er die Mahnungen des Lehrers in dem Bewußtsein befolgen, daß er bei seinen Worten beobachtende Zeugen habe. Aber vielleicht schwört er hier bei den Engeln, die beständig das Angesicht des Vaters im Himmel schauen, um der Kleinen in der Kirche willen, damit der Schüler die Beschützer der Völker erkenne und die Mahnungen des Apostels nicht vernachlässige.</p><p>Das scheint mir also der Sinn der göttlichen Aussprüche zu sein, der die Lästerung der Toren gegen den Geist widerlegt. Diese Leute verharren, wie du schreibst, in ihrem Kampf gegen die Wahrheit, schöpfen jedoch nicht mehr aus den Schriften, da sie dort nichts finden, sondern aus dem Unrat ihres eigenen Herzens, und sagen: Wenn er kein Geschöpf und keiner aus den Engeln ist, sondern vom Vater ausgeht, dann ist auch er Sohn, dann sind er und der Logos zwei Brüder. Wenn er aber Bruder ist, wie kann dann der Logos der Eingeborene sein, oder warum sind sie dann nicht gleich, und warum wird der eine nach dem Vater und der andere nach dem Sohn genannt? Und warum wird nicht auch von ihm, wenn er aus dem Vater ist, gesagt, daß er gezeugt oder daß er Sohn sei, warum wird er vielmehr einfach Heiliger Geist genannt? Wenn er aber Geist des Sohnes ist, so ist eigentlich der Vater der Großvater des Geistes. Solche Scherze treiben diese würdelosen Leute und mühen sich in ihrem Vorwitz ab, die Tiefen Gottes zu erforschen, die niemand kennt, außer der Geist Gottes, der von ihnen gelästert wird. Man sollte ihnen eigentlich nicht mehr antworten, sondern sie vielmehr der apostolischen Weisung gemäß, nachdem sie auf Grund des vorhin Gesagten gewarnt sind, als Häretiker meiden, oder sie um Dinge fragen, die ihrer eigenen Fragen wert sind, und von ihnen eine Antwort von der Art fordern, wie sie von uns verlangen. Sie mögen also sagen, ob der Vater von einem (andern) Vater stammt und ob ein anderer mit ihm gezeugt wurde, so daß sie Brüder sind, die von einem Vater stammen, welche Namen sie führen, wer ihr Vater und Großvater ist, und wer die Stammeltern dieser sind. Sie werden jedoch sagen, daß es derlei nicht gebe. Dann sollen sie sagen, warum er Vater heißt, wenn er selbst von keinem Vater stammt? Oder wie konnte er einen Sohn haben, wenn er selbst nicht zuvor als Sohn gezeugt wurde? Ich weiß, daß die Frage gottlos ist; aber es ist billig, ihre Spöttereien mit Spott zu erwidern, damit sie an einer so unsinnigen und gottlosen Fragestellung ihre eigene Torheit merken könnten. Denn das ist nicht so, das sei ferne! Solche Fragen über die Gottheit zu stellen, ziemt sich nicht; denn Gott ist nicht wie ein Mensch, so daß sich jemand erdreisten dürfte, nach menschlichen Verhältnissen bei ihm zu fragen.</p><p>Man sollte also, wie ich schon bemerkte, darüber schweigen und sich um solche Leute nicht kümmern. Damit ihnen aber unser Schweigen nicht einen Vorwand für ihre Unverschämtheit biete, mögen sie folgendes hören. Wie man beim Vater keinen anderen Vater nennen kann, so auch beim Sohn keinen Bruder. Denn außer dem Vater gibt es, wie vorhin auseinandergesetzt wurde, keinen anderen Gott. Es gibt aber auch keinen anderen Sohn; denn er ist eingeboren, deshalb ist der Vater alleinig und einer, Vater des alleinigen und einen Sohnes, und in der einen Gottheit war und ist immer Vater und Sohn. Denn, wenn bei den Menschen jemand Vater genannt wird, so ist er doch eines anderen Sohn, und wenn jemand Sohn genannt wird, so ist er doch eines andern Vater, so daß bei den Menschen der Name Vater und Sohn im uneingeschränkten Sinne nicht bestehen bleibt. Abraham z. B. war Sohn des Thare und wurde Isaaks Vater, Isaak war Sohn Abrahams und wurde Jakobs Vater. Das ist das Eigentümliche der Menschennatur; denn die Menschen sind Teile voneinander, und ein jeder, der geboren wird, hat einen Teil vom Vater, damit er selbst wieder eines andern Vater werde. Bei der Gottheit aber ist es nicht so. Denn Gott ist nicht wie ein Mensch und hat keine teilbare Natur. Darum zeugt er auch nicht durch Teilung den Sohn, so daß auch dieser der Vater eines andern würde, weil er selbst von keinem Vater stammt. Aber auch der Sohn ist kein Teil des Vaters. Deshalb zeugt er auch nicht, wie er selbst gezeugt wurde, sondern ist ganz des Ganzen Bild und Abglanz. In der Gottheit allein ist der Vater im uneingeschränkten Sinn Vater und der Sohn im unbeschränkten Sinn Sohn, und darum war der Vater immer Vater und der Sohn immer Sohn. Und wie der Vater niemals Sohn, so wird auch der Sohn niemals Vater sein. Und wie der Vater niemals aufhören wird, alleiniger Vater zu sein, so wird der Sohn niemals aufhören, alleiniger Sohn zu sein. Wahnwitz ist es daher, überhaupt auch nur zu denken oder zu sagen, der Sohn habe einen Bruder und dem Vater komme der Name Großvater zu. Denn in der Schrift wird der Geist nicht Sohn genannt, damit er nicht für einen Bruder (des letzteren) gehalten werde, noch Sohn des Sohnes, damit der Vater nicht als Großvater betrachtet würde. Der Sohn wird vielmehr Sohn des Vaters, und der Geist wird Geist des Vaters genannt, und so gibt es eine Gottheit der heiligen Trinität und einen Glauben an sie.</p><p>Demzufolge ist es wahnwitzig, ihn ein Geschöpf zu nennen. Denn wenn er ein Geschöpf wäre, würde er nicht mit der Trinität verbunden werden. Sie ist ja ganz ein Gott. Es genügt auch zu wissen, daß der Geist kein Geschöpf ist und den geschaffenen Dingen nicht beigezählt wird; denn der Trinität ist nichts Fremdartiges beigemischt, sie ist vielmehr unteilbar und sich selbst gleich. Das genügt den Gläubigen; soweit reicht die menschliche Erkenntnis; hier hemmen die Cherubim mit ihren Flügeln den Ausblick. Wer mehr als das sucht und ergründen will, hört nicht auf den, der spricht: „Suche nicht zu viel auszuklügeln, damit du nicht zu Fall kommst“. Denn das, was durch den Glauben überliefert ist, darf man nicht nach Art menschlicher Weisheit, das muß man vielmehr durch gläubiges Hören erfassen. Welche Worte könnten denn das, was über die geschaffene Natur erhaben ist, würdig erklären? Oder welches Ohr könnte überhaupt fassen, was Menschen weder zu hören noch zu sagen gestattet ist? So redete Paulus zwar über das, was er gehört hatte, von Gott selbst aber sagte er: „Wie unerforschlich sind seine Wege! Denn wer hat den Sinn des Herrn erkannt und wer ist sein Ratgeber gewesen?” Abraham hat daher nicht in vorwitziger Weise über den, der (zu ihm) sprach, eine Untersuchung angestellt, sondern „glaubte, und es ward ihm zur Gerechtigkeit angerechnet". In diesem Sinn wurde Moses ein treuer (πιστός) Diener genannt. Wenn aber die Gesinnungsgenossen des Arius, weil ihre boshafte Seele der Weisheit nicht zugänglich ist, die unteilbare und heilige Trinität nicht erfassen und glauben können, so sollen sie doch die Wahrheit nicht verdrehen und nicht behaupten, daß das, was sie nicht begreifen, auch nicht existieren könne. Denn es ist ein höchst törichtes Unterfangen, wenn die Arianer, weil sie nicht begreifen können, wie die Trinität unteilbar sein könne, den Sohn mit der Schöpfung zu einer Einheit verbinden, die Tropiker aber deshalb ihrerseits den Geist unter die Geschöpfe zählen. Wenn sie es nicht begreifen, hätten sie entweder gänzlich schweigen, und nicht die einen den Sohn und die andern den Geist mit den Geschöpfen zusammenstellen sollen, oder sie hätten die Aussage der Schrift anerkennen, den Sohn mit dem Vater verbinden sollen sowie den Geist nicht vom Sohne trennen dürfen, damit die Unteilbarkeit und die wahrhaft gleiche Natur der heiligen Trinität unangetastet bleibe. Das hätten sie einsehen müssen und nicht zweifelnd sich zu der Frage erdreisten dürfen, wie das möglich sei, um sich dann, wenn der Gefragte um die Antwort verlegen wäre, selbst verkehrte Anschauungen zu bilden. Ist es doch allen geschaffenen Wesen, zumal aber uns Menschen unmöglich, über das Unaussprechliche in angemessener Weise zu reden. Noch verwegener aber wäre es, wenn wir für das, was wir nicht auszudrücken vermögen, neue, den Schriften fremde Ausdrücke ersinnen wollten. Geradezu wahnsinnig aber wäre ein solcher Versuch, wenn jemand derlei Fragen stellen oder auch nur daran denken wollte, sie zu beantworten. Denn, selbst wenn jemand auch nur über die geschaffenen Dinge so fragen wollte, könnte man von ihm nicht mehr glauben, daß er bei gesundem Verstande sei.</p><p>Oder es sollen sich diese Leute, die über alles so leichtfertig reden, dazu entschließen, die Frage zu beantworten, wie und aus welchem Stoff der Himmel gebildet wurde, wie er zusammengesetzt ist, oder wie die Sonne und alle Sterne entstanden? Was soll es indes Staunenswertes sein, durch den Hinweis auf die Dinge am Himmel ihren Unverstand darzutun, da man nicht einmal weiß, wie die Natur der irdischen Dinge, z. B. des Holzes, beschaffen sei, welches die Bestandteile des Wassers seien, und wie die Lebewesen gebildet und zusammengesetzt seien. Doch, das können sie nicht erklären, da selbst Salomon, der mehr Weisheit als alle besaß, einsah, es sei den Menschen unmöglich, das zu ergründen, weshalb er bemerkte: „Und die ganze Welt sogar legte er in ihr Herz, so daß der Mensch das Werk nicht ergründe, das Gott geschaffen hat, vom Anfang bis zum Ende„. Behaupten sie aber etwa, daß diese Dinge, weil sie dieselben nicht ergründen können, auch nicht existieren? In der Tat, sie werden es behaupten, weil ihr Verstand zerrüttet ist. Daher kann man ihnen mit Recht sagen: O ihr Toren, die sich zu allem erdreisten, warum hört ihr nicht lieber auf, über die heilige Trinität vorwitzig zu grübeln, und glaubt wenigstens, daß sie existiert? Dafür habt ihr als Lehrer den Apostel, der spricht: „Man muß zuerst Gott glauben, daß er ist, und daß er denen, die ihn suchen, Vergelter sein werde“. Denn er hat nicht gesagt, „wie er ist„, sondern „daß er ist“. Wenn sie sich aber nicht beschämt damit bescheiden, so sollen sie sagen, wie der Vater beschaffen sei, damit sie auf diesem Wege auch erkennen, wie der Logos desselben beschaffen sei. Allein sie werden sagen, es sei töricht, über den Vater eine solche Frage zu stellen. Dann müssen sie sich aber sagen lassen, daß es auch töricht ist, über seinen Logos in dieser Weise zu fragen.</p><p>Da also ein solcher Versuch unnütz und mehr als wahnsinnig ist, sollte niemand mehr um solches fragen, sondern nur das zu erkennen streben, was die Schriften enthalten. Die Beispiele, die sie darüber bieten, sind genügend und hinreichend. Nun wird der Vater Quelle und Licht genannt. Denn „mich“, spricht er, „die Quelle des lebendigen Wassers, haben sie verlassen”. Und wieder bei Baruch: „Warum, o Israel, bist du im Lande der Feinde? Verlassen hast du die Quelle der Weisheit“. Und nach Johannes „ist unser Gott Licht”. Der Sohn aber wird mit Bezugnahme auf die Quelle Fluß genannt; denn „der Strom Gottes ist des Wassers voll“. Unter Bezugnahme auf das Licht heißt er Abglanz, indem Paulus sagt: „Dieser ist Abglanz der Herrlichkeit und Abdruck seines Wesens”. Wenn also der Vater Licht, der Sohn aber dessen Abglanz ist, — denn man darf kein Bedenken tragen, das gleiche, zumal über solchen Gegenstand, oft zu sagen — dann kann man im Sohne den Geist schauen, durch den wir erleuchtet werden. Es heißt ja: „Er wolle euch den Geist der Weisheit und Offenbarung geben zu seiner Erkenntnis, wolle die Augen eures Herzens erleuchten“. Wenn wir aber durch den Geist erleuchtet werden, so ist es Christus, der uns durch ihn erleuchtet; denn „er”, heißt es, „war das wahre Licht, das jeden Menschen erleuchtet, der in die Welt kommt“. Wenn ferner der Vater Quelle ist, der Sohn aber Fluß genannt wird, so heißt es auch, daß wir den Geist trinken; denn es steht geschrieben, „daß wir mit einem Geiste getränkt sind”. Indem wir aber mit dem Geiste getränkt werden, trinken wir Christus; denn „sie tranken aus dem sie begleitenden Felsen, der Fels aber war Christus“. Wie ferner Christus wahrer Sohn ist, werden wir, indem wir den Geist empfangen, zu Kindern umgeschaffen; „denn ihr”, heißt es, „habt nicht abermals den Geist der Knechtschaft zur Furcht empfangen, ihr habt vielmehr den Geist der Kindschaft empfangen“. Wenn wir aber durch den Geist zu Kindern umgeschaffen werden, so werden wir offenbar in Christus Kinder Gottes genannt; denn „allen, die ihn aufnahmen, gab er Macht, Kinder Gottes zu werden”. Während dann, wie Paulus sich ausdrückte, der Vater allein weise ist, ist der Sohn seine Weisheit; denn „Christus ist Gottes Kraft und Gottes Weisheit“. Wenn aber der Sohn die Weisheit ist, und wir den Geist der Weisheit empfangen, so haben wir den Sohn und werden durch ihn weise. Denn so steht im 145. Psalm geschrieben: „Der Herr befreit die Gefesselten, der Herr macht die Blinden weise”. Und wenn uns der Geist gegeben wird — der Heiland sprach ja: „Empfanget den Heiligen Geist“ —, so ist Gott in uns; denn Johannes schrieb: „Wenn wir einander lieben, bleibt Gott in uns. Daran erkennen wir, daß wir in ihm bleiben und er in uns, weil er uns von seinem Geiste gegeben hat”. Wenn aber Gott in uns ist, so ist auch der Sohn in uns, da der Sohn selbst sagt: „Ich und der Vater werden kommen und Wohnung bei ihm nehmen“. Wenn ferner der Sohn Leben ist — er sagt ja: „Ich bin das Leben” —, so heißt es von uns, daß wir durch den Geist belebt werden; denn „der“, heißt es, „der Christus Jesus von den Toten erweckt hat, wird auch unsere sterblichen Leiber lebendig machen durch seinen Geist, der in uns wohnt”. Indem wir aber durch den Geist belebt werden, wird von Christus gesagt, daß er selbst in uns lebt. Denn „mit Christus“, heißt es, „bin ich gekreuzigt. Ich lebe, aber nicht ich, sondern Christus lebt in mir”. Der Sohn sagt weiterhin von den Werken, die er vollbrachte, daß sie der Vater wirke; denn „der Vater selbst“, sprach er, „der in mir wohnt, tut die Werke. Glaubet mir, daß ich im Vater bin und der Vater in mir ist; wenn aber nicht, so glaubet mir um der Werke willen”. In gleicher Weise sagte auch Paulus von dem, was er in Kraft des Geistes wirkte, daß es Christi Werke seien: „Denn ich werde mich nicht erkühnen, von etwas zu reden, was nicht Christus durch mich vollbracht hat, um die Heiden zum Gehorsam zu bringen, mit Wort und Tat, mit der Kraft von Zeichen und Wundern, mit der Kraft des Heiligen Geistes".</p><p>Da nun in der heiligen Trinität solcher Zusammenhang und solche Einheit waltet, wer dürfte da den Sohn vom Vater oder den Geist vom Sohne oder auch vom Vater trennen? Oder wer ist so verwegen, daß er behaupten möchte, die Trinität sei in sich selbst ungleichen Wesens und verschiedener Natur, oder der Sohn besitze eine andere Wesenheit als der Vater, oder der Geist sei dem Sohne wesensfremd? Wie ist das aber möglich, könnte vielleicht wieder jemand forschen und fragen? Wie kann man sagen, wenn der Geist in uns ist, so ist der Sohn in uns, und wie kann man sagen, wenn der Sohn in uns ist, so ist der Vater in uns, oder wie kann überhaupt, da eine Trinität existiert, dieselbe in einem Gliede bezeichnet werden, oder wie kann man sagen, wenn einer in uns ist, daß die Trinität in uns sei? Ein solcher trenne zuerst den Glanz vom Lichte und die Weisheit vom Weisen, oder sage, wie das möglich sei. Wenn er aber das nicht kann, so ist es eine noch viel größere Dreistigkeit wahnsinniger Menschen, solches über die Gottheit ergründen zu wollen. Denn die Gottheit wird, wie gesagt ist, nicht durch einen Wortbeweis überliefert, sondern durch den Glauben und durch frommes, ehrfürchtiges Nachdenken. Wenn nämlich Paulus die Bürgschaft vom heilbringenden Kreuz „nicht mit Weisheitsworten, sondern mit der Beweisführung des Geistes und der Kraft„ verkündete, und „im Paradiese unaussprechliche Worte hörte, die keinem Menschen auszusprechen vergönnt ist“, wer kann dann über die heilige Trinität selbst reden? Trotzdem wird man diesem Mangel abhelfen können, in erster Linie durch den Glauben, dann aber auch durch die angeführten Beispiele, nämlich des Ebenbildes, des Abglanzes, der Quelle und des Flusses, des Wesens und des Abdrucks. Denn wie der Sohn im Geist als seinem Ebenbilde ist, so ist auch der Vater im Sohn. Um nämlich unserem Unvermögen, das durch Worte zu erklären und es zu begreifen, entgegenzukommen, hat uns die göttliche Schrift diese Beispiele gegeben, damit wir auf diese Weise wegen des Unglaubens der Verwegenen darüber einfacher und ohne Gefahr reden und mit dem Recht auf Nachsicht erkennen und glauben können, daß die Heiligung eine einzige ist, die aus dem Vater durch den Sohn im Heiligen Geiste kommt. Denn wie der Sohn eingeboren ist, so ist auch der Geist, der vom Sohne gegeben und gesandt wird, gleichfalls einer und nicht viele, auch nicht einer aus vielen, sondern einzig selbst Geist. Wenn nämlich der Sohn, das lebendige Wort, einer ist, dann muß auch seine vollkommene und volle, heilige und erleuchtende, lebendige Wirksamkeit und Gabe eine sein, von der gesagt ist, daß sie vom Vater ausgeht, weil sie aus dem Logos, der nach aller Zugeständnis aus dem Vater ist, hervorstrahlt, gesendet und gegeben wird. Der Sohn wird tatsächlich vom Vater gesendet; denn „so„, heißt es, „hat Gott die Welt geliebt, daß er seinen eingeborenen Sohn sandte“. Der Sohn aber sendet den Geist; denn er sagt: „Wenn ich hingehe, werde ich den Tröster senden„. Der Sohn verherrlicht den Vater, da er sagt: „Vater, ich habe dich verherrlicht“. Der Geist aber verherrlicht den Sohn; denn „jener„, sagt letzterer, „wird mich verherrlichen“. Der Sohn spricht ferner: „Was ich vom Vater gehört habe, das rede ich auch zur Welt„. Der Geist aber nimmt vom Sohne; denn „von dem Meinigen“, sagt er, „wird er nehmen und euch verkünden„. Der Sohn ist im Namen des Vaters gekommen; der Sohn sagt aber: „Der Heilige Geist, den der Vater in meinem Namen senden wird“.</p><p>Da der Geist dem Sohne gegenüber denselben Rang und dieselbe Natur besitzt wie der Sohn gegenüber dem Vater, wie soll dann jemand, der ihn ein Geschöpf nennt, das gleiche nicht notwendig auch vom Sohn denken? Denn wenn der Geist das Geschöpf des Sohnes ist, müßten sie folgerichtig auch vom Logos behaupten, daß er ein Geschöpf des Vaters sei. Denn durch solche Phantastereien sind die Arianer in das Judentum des Kaiphas geraten. Wenn aber jene, die vom Geiste solches behaupten, die Lehre des Arius sich nicht zu eigen machen wollen, dann sollen sie auch seine Ausdrucksweise vermeiden und sich nicht gegen den Geist vergehen. Wie nämlich der Sohn, der im Vater ist und in dem der Vater ist, kein Geschöpf, sondern der Wesenheit des Vaters eigen ist — das behauptet vorgeblich auch ihr —, ebenso ist der Heilige Geist, der im Sohne ist und in dem der Sohn ist, billigerweise nicht den Geschöpfen beizuzählen noch vom Logos zu trennen, wodurch die Trinität der Vollkommenheit beraubt würde. Was die Aussprüche des Propheten und des Apostels betrifft, durch deren sinnwidrige Verdrehung sie in Irrtum gerieten, so genügt es, hiemit die Schmähung der Tropiker, die Folge ihrer Unwissenheit, widerlegt zu haben. Wir wollen nun weiterhin alles, was in den göttlichen Schriften über den Heiligen Geist gesagt ist, für sich betrachten, und wollen wie kundige Wechsler beurteilen, ob der Geist etwas mit den Geschöpfen gemein hat, oder ob er Gott eigen ist, um ihn dann entweder ein Geschöpf zu nennen oder es auszusprechen, daß er von den Geschöpfen verschieden, der in der Trinität bestehenden Gottheit eigen und ein Glied derselben sei. Vielleicht werden sie auf diese Weise zur Besinnung kommen, wenn sie merken, wie wenig die von ihnen ersonnenen Lästerungen mit den göttlichen Aussprüchen in Einklang zu bringen sind.</p><p>Nun sind die Geschöpfe aus nichts entstanden und haben einen Anfang ihres Seins; denn im Anfang schuf Gott den Himmel und die Erde und alles, was darin ist. Vom Heiligen Geist aber ist gesagt, daß er aus Gott sei. Denn „niemand„, heißt es, „kennt das (Wesen) des Menschen als der Geist des Menschen, der in ihm ist; so kennt auch das (Wesen) Gottes niemand als der Geist Gottes; wir haben aber nicht den Geist der Welt empfangen, sondern den Geist aus Gott“. Welche Verwandtschaft des Geistes mit den Geschöpfen folgt nun aus dem Gesagten? Die Geschöpfe waren einmal nicht, Gott aber ist der Seiende, aus dem auch der Geist ist. Was aber aus Gott ist, kann nicht aus dem Nichts stammen noch ein Geschöpf sein, damit nicht der Anschauung jener gemäß auch der für ein Geschöpf gehalten werde, aus dem der Geist ist. Wer wird denn solche Toren ruhig anhören, da auch sie „in ihrem Herzen sprechen: Es gibt keinen Gott„? Denn wenn niemand das Wesen des Menschen erkennt außer der Geist in ihm, und wenn ebenso niemand das Wesen Gottes erkennt außer der Geist in ihm, wie sollte es dann nicht Lästerung sein, den Geist, der in Gott ist und die Tiefen Gottes erforscht, ein Geschöpf zu nennen? Wer das behauptet, wird ja zu dem Schluß gedrängt, daß der Geist des Menschen außerhalb des Menschen, und daß der Logos im Vater ein Geschöpf sei. Der Geist ist und heißt sodann Geist der Heiligung und Erneuerung; denn Paulus schreibt: „Der als Gottessohn in Kraft erwiesen wurde nach dem Geist der Heiligung infolge der Auferstehung von den Toten, Jesus Christus unser Herr“. Und wiederum sagt er: „Aber ihr seid geheiligt, aber ihr seid gerechtfertigt im Namen unseres Herrn Jesus Christus und im Geiste unseres Gottes„. Deshalb schreibt er auch an Titus: „Als aber die Güte und Menschenfreundlichkeit Gottes, unseres Heilands, erschien, brachte er uns Rettung nicht um der Werke willen, die wir in Gerechtigkeit getan, sondern aus seinem Erbarmen, durch das Bad der Wiedergeburt und der Erneuerung des Heiligen Geistes, den er reichlich über uns ausgegossen hat durch Jesus Christus unsern Heiland, damit wir durch seine Gnade gerechtfertigt, der Hoffnung gemäß Erben des ewigen Lebens würden“. Die Geschöpfe dagegen werden geheiligt und erneuert; denn „Du wirst deinen Geist aussenden, und sie werden geschaffen werden, und du wirst das Angesicht der Erde erneuern„. Paulus aber sagt: „Denn es ist unmöglich, die, die einmal erleuchtet worden sind, die das himmlische Geschenk gekostet haben und des Heiligen Geistes teilhaft geworden sind…“.</p><p>Wie sollte also derjenige, der von keinem andern geheiligt und keiner Heiligung teilhaft wird, sondern sie mitteilt, und durch den alle Geschöpfe geheiligt werden, eins aus allen Dingen sein und jenen zugehören, die seiner teilhaft werden? Denn jene, die das behaupten, müssen sagen, daß auch der Sohn, durch den alle Dinge geschaffen sind, eins aus allen sei. Er wird der lebendig machende Geist genannt; denn „derjenige“, heißt es, „der Jesus Christus von den Toten erweckt hat, wird auch eure sterblichen Leiber wieder lebendig machen durch seinen Geist, der in euch wohnt”. Und der Herr ist das Leben selbst und der „Urheber des Lebens“, wie Paulus sagte. Der Herr selbst aber spricht: „Das Wasser, das ich ihm geben werde, wird in ihm zu einer Quelle Wassers werden, das ins ewige Leben sprudelt”. „Das sagte er aber vom Geiste, den jene empfangen sollten, die an ihn glauben“. Die Geschöpfe aber werden, wie gesagt, erst durch ihn belebt. Welche Verwandtschaft hat aber der mit den gewordenen Dingen, der des Lebens nicht teilhaft wird, an dem vielmehr andere teilhaben, und der die Geschöpfe belebt? Oder wie sollte er überhaupt zu den Geschöpfen gehören, die in ihm durch den Logos belebt werden? Der Geist wird Salbung genannt und ist Siegel. Denn Johannes schreibt: „Und ihr, die Salbung, die ihr empfangen habt, bleibt in euch, und ihr habt nicht nötig, daß euch jemand belehre, sondern wie seine Salbung” — sein Geist — „euch über alles belehrt…“. Beim Propheten Jesaias aber steht geschrieben: „Der Geist des Herrn ist über mir, deshalb hat er mich gesalbt”. Und Paulus sagt: „In ihm seid ihr auch, nachdem ihr gläubig geworden, versiegelt worden auf den Tag der Erlösung“. Die Geschöpfe aber werden durch ihn versiegelt und gesalbt und über alles belehrt. Wenn aber der Geist Salbung und Siegel ist, womit der Logos alles salbt und versiegelt, welche Ähnlichkeit oder Eigentümlichkeit haben dann Salbung und Siegel mit den Dingen gemein, die gesalbt und versiegelt werden? Auch hiernach gehört er also nicht zur Gesamtheit aller Dinge; denn das Siegel kann nicht zu den versiegelten Dingen und die Salbung nicht zu den gesalbten Dingen gehören, sondern ist dem salbenden und versiegelnden Logos eigen. Die Salbe besitzt ja den Wohlgeruch und Duft des Salbenden, und die Gesalbten, die daran Anteil bekommen, sprechen: „Christi Wohlgeruch sind wir”. Das Siegel aber trägt das Bild Christi, der versiegelt, und jene, die versiegelt werden und daran teilnehmen, werden nach ihm gestaltet, wie der Apostel sagt: „Meine Kinder, um die ich abermals Geburtsschmerzen leide, bis Christus in euch Gestalt gewinnt". So versiegelt, werden wir ganz natürlich, wie Petrus sagt, der göttlichen Natur teilhaft, und so erhält die gesamte Schöpfung im Geiste teil am Logos.</p><p>Ferner wird gesagt, daß wir alle durch den Geist an Gott teilhaben. „Wißt ihr nicht„, heißt es ja, „daß ihr ein Tempel Gottes seid und der Geist Gottes in euch wohnt? Wenn jemand den Tempel Gottes verdirbt, so wird ihn Gott verderben; denn der Tempel Gottes ist heilig, und der seid ihr“. Wenn der Heilige Geist aber ein Geschöpf wäre, so würde uns durch ihn keine Gemeinschaft mit Gott zuteil; wir würden vielmehr mit einem Geschöpf verbunden und der göttlichen Natur entfremdet, weil wir in nichts derselben teilhaft wären. Nun aber, da von uns gesagt ist, daß wir Christi und Gottes teilhaft sind, ist erwiesen, daß die Salbe und das Siegel in uns nicht zur Natur der geschaffenen Dinge, sondern zu der des Sohnes gehört, der uns durch den Geist, der in ihm ist, mit dem Vater verbindet. Das lehrt, wie vorhin schon ausgeführt wurde, Johannes, indem er schrieb: „Daran erkennen wir, daß wir in Gott bleiben und er in uns, weil er uns von seinem Geist gegeben hat„. Wenn wir aber durch die Teilnahme am Geiste der göttlichen Natur teilhaft werden, so kann nur ein Wahnsinniger behaupten, dem Geiste eigne eine geschaffene Natur, aber nicht die Natur Gottes. Deshalb werden ja jene, zu denen er kommt, vergöttlicht. Wenn er aber vergöttlicht, ist es unzweifelhaft, daß seine Natur göttlich ist. Aber noch deutlicher heißt es zur vernichtenden Widerlegung dieser Irrlehre im 103. Psalm, wie wir schon oben erwähnten: „Du wirst ihren Geist wegnehmen, und sie werden vergehen und zur Erde zurückkehren; du wirst deinen Geist aussenden und sie werden neu geschaffen werden, und du wirst das Angesicht der Erde erneuern“. Paulus aber schreibt an Titus: „Durch das Bad der Wiedergeburt und der Erneuerung des Heiligen Geistes, den er reichlich über uns ausgegossen hat durch Jesus Christus„. Wenn aber der Vater alles durch den Logos im Heiligen Geiste schafft und erneut, welche Ähnlichkeit oder Verwandtschaft besteht dann zwischen dem Schöpfer und den Geschöpfen? Oder wie könnte der, in dem alles geschaffen ist, überhaupt ein Geschöpf sein? Denn aus einer solchen Lästerung folgt auch die Lästerung des Sohnes; daher müssen jene, die den Geist ein Geschöpf nennen, behaupten, daß auch der Logos, durch den alles geschaffen wird, ein Geschöpf sei. Der Geist heißt und ist Bild des Sohnes; denn „die er vorher erwählt hat, hat er auch zur Gleichheit mit dem Bilde seines Sohnes vorausbestimmt“. Da nun nach jener Eingeständnis der Sohn kein Geschöpf ist, so wird wohl auch dessen Bild kein Geschöpf sein. Denn wie das Bild, so muß auch der sein, dessen Bild er ist. Daher ist es recht und billig, daß der Logos kein Geschöpf genannt wird, weil er Bild des Vaters ist. Wer demnach den Geist zu den Geschöpfen zählt, muß unbedingt auch den Sohn zu denselben rechnen und dadurch auch den Vater lästern, weil er dessen Bild lästert.</p><p>Der Geist ist demnach von den Geschöpfen verschieden; es ist erwiesen, daß er vielmehr dem Sohne eigen und Gott nicht fremd ist. Denn auch von ihrer sophistischen Frage: Wenn der Geist aus Gott ist, warum wird er dann nicht auch Sohn genannt? ist schon im vorausgehenden gezeigt, daß sie unbesonnen und dreist ist. Nichtsdestoweniger soll das auch hier gezeigt werden. Wenn der Geist nämlich in den Schriften nicht auch Sohn, sondern Geist Gottes genannt wird, so ist doch von ihm gesagt, daß er in Gott und aus Gott selbst sei, wie der Apostel schrieb. Wenn aber der Sohn, weil er aus dem Vater ist, der Wesenheit desselben eigen ist, so muß auch der Geist, von dem gesagt ist, daß er aus Gott sei, dem Wesen nach dem Sohne eigen sein. In der Tat wird der Geist, wie der Herr der Sohn ist, Geist der Sohnschaft genannt. Und wie ferner der Sohn die Weisheit und Wahrheit ist, so steht vom Geist geschrieben, daß er der Geist der Weisheit und Wahrheit sei. Weiterhin ist der Sohn Kraft Gottes und Herr der Herrlichkeit; der Geist aber wird Geist der Kraft und Geist der Herrlichkeit genannt. Die Schrift redet von jedem in dieser Weise. Paulus schreibt den Korinthern: „Hätten sie die (Weisheit) erkannt, so hätten sie den Herrn der Herrlichkeit nicht gekreuzigt„. Und an anderer Stelle: Denn „ihr habt nicht den Geist der Knechtschaft abermals zur Furcht empfangen, ihr habt vielmehr den Geist der Kindschaft empfangen“. Und wiederum: „Gott hat den Geist seines Sohnes in euere Herzen gesendet, der da ruft: Abba, Vater„. Petrus aber schrieb: „Selig seid ihr, wenn ihr um des Namens Christi willen geschmäht werdet; denn der Geist der Herrlichkeit und Kraft, der Geist Gottes ruht auf euch“. Der Herr aber sagt, daß der Geist der Geist der Wahrheit und der Tröster sei; daraus läßt sich ersehen, daß in ihm die Trinität vollkommen ist. In ihm also verherrlicht der Logos die Schöpfung, indem er sie durch Vergöttlichung und Annahme an Kindesstatt dem Vater zuführt. Was aber die Schöpfung dem Logos verbindet, kann selbst nicht zu den Geschöpfen gehören; und derjenige, der das Geschöpf zum Kinde macht, ist wohl dem Sohn nicht fremd, da man sonst einen andern Geist suchen müßte, damit der erstere durch den letzteren dem Logos verbunden würde. Allein das ist unsinnig. Der Geist gehört also nicht zu den Geschöpfen, sondern ist der Gottheit des Vaters eigen, und durch ihn vergöttlicht auch der Logos die Geschöpfe. Der aber, durch den die Schöpfung vergöttlicht wird, kann selbst nicht außer der Gottheit des Vaters sein.</p><p>Daß der Geist jedoch über die Schöpfung erhaben, von der Natur der geschaffenen Wesen verschieden und der Gottheit eigen ist, kann man auch aus folgendem erkennen. Der Heilige Geist ist unwandelbar und unveränderlich; denn „der Heilige Geist der Wissenschaft“, heißt es, „wird die Verstellung fliehen und sich von unverständigen Gedanken fernhalten”. Auch Petrus sagt: „In der Unvergänglichkeit des stillen und sanften Geistes". Und im Buch der Weisheit heißt es abermals: “Dein unvergänglicher Geist ist in allen Dingen”. Und wenn “niemand das Wesen Gottes kennt außer der Geist Gottes, der in ihm ist”, bei Gott aber, wie Jakobus sagte, “sich kein Wechsel und kein Schatten von Veränderung” findet, so ist der Heilige Geist, der in Gott ist, natürlich unwandelbar, unveränderlich und unvergänglich. Die Natur der gewordenen und geschaffenen Dinge dagegen ist wandelbar, weil sie nämlich außerhalb der Wesenheit Gottes und aus nichts entstanden ist. Denn “jeder Mensch”, heißt es, “ist lügenhaft”, und “alle haben gesündigt und ermangeln der Herrlichkeit Gottes”. “Auch die Engel, die ihre Herrscherwürde in Stich ließen, hat er für das Gericht des großen Tages mit ewigen Banden in Finsternis verwahrt.”. Und bei Job: “Seinen heiligen Engel traut er nicht, gegen seine Engel dachte er Schlimmes”; “die Sterne sind nicht rein vor ihm”. Paulus aber schreibt: “Wißt ihr nicht, daß wir über Engel richten werden? Warum nicht etwa gar übe Dinge des gewöhnlichen Lebens?” Ja, wir haben sogar gehört, daß der Teufel, der sich mitten unter den Cherubim befand und ein Siegel der Gleichheit" (d.h. ein Abbild derselben Würde) war, wie ein Blitz vom Himmel fiel. Wenn nun das die Natur der Geschöpfe ist und das von den Engeln geschrieben steht, wenn der Geist dagegen immer derselbe und unveränderlich ist, die Unwandelbarkeit des Sohnes teilt und mit ihm stets unwandelbar bleibt, welche Ähnlichkeit obwaltet dann zwischen den unwandelbaren und den wandelbaren Dingen? Denn es dürfte klar sein, daß er weder ein Geschöpf ist, noch überhaupt die Natur der Engel besitzt, weil diese wandelbar sind. Es ist vielmehr das Bild des Logos und ist dem Vater eigen. Weiterhin hat der Geist des Herrn den Erdkreis erfüllt: denn so singt auch David: “wo soll ich hingehen vor deinem Geiste?” Und im Buch der Weisheit steht wiederum geschrieen: “Dein unvergänglicher Geist ist in allen Dingen.” Alle gewordenen Dinge dagegen befinden sich an verschiedenen Örtlichkeiten: Sonne, Mond und Sterne, am Firmament, die Wolken in der Luft. Auch in der Menschenwelt hat er für die Völker Grenzen gesetzt, und die Engel werden zu Dienstleistungen gesendet. Und es kamen“, wie bei Job geschrieben steht,”die Engel, um vor den Herrn zu treten.“ Und”der Patriarch Jakob träumte, und sieh, da war eine Leiter aufgestellt auf der Erde, deren Spitze an den Himmel reichte, und die Engel Gottes stiegen an derselben auf und nieder". Wenn aber der Geist alles erfüllt und durch den Logos mitten in allen Dingen gegenwärtig ist, die Engel aber unter ihm stehen und nur dort gegenwärtig sind, wohin sie gesandt werden, so ist es doch nicht zweifelhaft, daß der Geist weder zu den geschaffenen Dinge gehört noch, wie ihr meint, ein Engel, daß er im Gegenteil über die Natur der Engel erhaben ist.</p><p>Auch aus dem Folgenden kann man nämlich wieder ersehen, daß der Heilige Geist sich mitteilt und nicht an anderen teilnimmt. Man darf sich ja nicht scheuen, das nämliche immer wieder zu sagen. “Denn es ist unmöglich”, heißt es, "die, die einmal erleuchtet worden sind, die das himmlische Geschenk genossen, des Heiligen Geistes teilhaftig geworden sind, das gute Wort Gottes gekostet haben …. Die Engel aber und die übrigen Geschöpfe haben am Geiste selbst teil; deshalb können sie ja auch den, dessen sie teilhaft geworden sind, wieder verlieren. Der Geist aber ist immer derselbe; denn er gehört nicht zu den Dingen, die an anderen teilnehmen; alle Dinge nehmen vielmehr an ihm teil. Wenn aber der Heilige Geist immer derselbe ist und sich mitteilt, während die Geschöpfe seiner teilhaft werden, so ist er weder ein Engel noch überhaupt ein Geschöpf, sondern dem Logos eigen, von dem er gegeben wird, damit die Geschöpfe seiner teilhaft werden; denn sonst müßten sie auch den Sohn, dessen wir alle im Geiste teilhaft geworden sind, ein Geschöpf nennen. Der Heilige Geist ist außerdem einer, die Geschöpfe aber sind viele. Denn Engel gibt es tausendmal Tausende und zehntausendmal Zehntausende; es gibt viele Himmelslichter, Throne, Herrschaften, Himmel, Cherubim und Seraphim und viele Erzengel. Überhaupt sind die Geschöpfe nicht eins, sondern alle sind zahlreich und mannigfaltig. Wenn aber der Heilige Geist einer ist, die Geschöpfe dagegen viele, auch die Engel viele, welche Ähnlichkeit obwaltet dann zwischen dem Geist und den gewordenen Dingen? Ferner ist nicht unbekannt, daß der Geist weder zur Vielheit der Dinge gehört noch ein Engel, sondern einer ist, vielmehr dem einen Logos und dem einen Gott eigen und wesensgleich. Das allein schon für sich vom Heiligen Geiste ausgesagt, zeigt, daß er nach Natur und Wesenheit nichts mit den Geschöpfen Gemeinsames noch ihnen Eigentümliches hat, sondern daß er von den gewordenen Dingen verschieden, dem Wesen und der Gottheit des Sohnes eigen und ihr nicht fremd ist. Dadurch ist er auch ein Glied der herrlichen Trinität und macht die Stumpfsinnigkeit jener Leute zuschanden.</p><p>Trotzdem wollen wir überdies auch noch die alte Überlieferung sowie die Lehre und den Glauben der allgemeinen Kirche ins Auge fassen, den der Herr gegeben, die Apostel verkündet und die Väter bewahrt haben. Denn auf ihn ist die Kirche gegründet; und wer von ihm abirrt, kann kein Christ mehr sein, nicht einmal mehr genannt werden. Die Trinität ist also heilig und vollkommen, ihre göttliche Natur wird im Vater, im Sohne und im Heiligen Geiste dargetan, in ihr ist nichts Fremdes oder von außen Beigemischtes; sie besteht auch nicht aus Schöpfer und Geschöpf, sondern ist ganz schöpferische und bildende Kraft. Sie ist sich selbst gleich und ihrer Natur nach unteilbar, und ihre Wirksamkeit ist nur eine. Denn der Vater tut alles durch den Logos im Heiligen Geist. So wird die Einheit der heiligen Trinität bewahrt, so wird in der Kirche ein Gott verkündet, der “über allem, durch alles und in allem„ ist;”über allem“ nämlich als Vater, als Anfang und Quelle, „durch alles„ aber durch den Logos und „in allem“ im Heiligen Geist. Die Trinität ist aber nicht allein dem Namen und dem Klang des Wortes nach, sondern in Wahrheit und in Wirklichkeit eine Trinität. Denn wie der Vater existiert, so existiert auch sein Logos und ist Gott „über alles„. Auch der Heilige Geist ist nicht ohne Dasein, sondern existiert und besteht in Wahrheit. Die katholische Kirche meint damit nicht weniger als dieses, damit sie nicht den Anschauungen jener, die sich jetzt als Juden nach Art des Kaiphas geben, oder des Sabellius verfalle; sie legt aber auch nicht mehr hinein, damit sie nicht in die Vielgötterei der Hellenen gerate. Und daß dies der Glaube der Kirche ist, möge man daran erkennen, daß der Herr den Aposteln bei ihrer Aussendung befahl, diesen Grundstein für die Kirche zu legen, indem er sprach: „Gehet und lehret alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes“. Die Apostel aber gingen hin und lehrten so. Und das ist die Predigt in der ganzen Kirche unter dem Himmel.</p><p>Da nun dies die Grundlage des kirchlichen Glaubens ist, sollen uns jene Leute ferner Rede stehen und die Frage beantworten: Gibt es eine Trinität (τρίας) oder eine Zweiheit (δυάς)? Gibt es nun eine Zweiheit, so mag der Geist von euch zu den Geschöpfen gezählt werden. Dann geht aber euere Glaubensüberzeugung nicht mehr auf einen Gott, der „über allem, durch alles und in allem“ ist; denn das „in allem“ habt ihr nicht, wenn ihr den Geist von der Gottheit trennt und ausschließt. Und euere Vollendung, die ihr zu wirken glaubt, vollzieht sich bei euerer Anschauung nicht mehr ganz im Namen der Gottheit. Denn es wird ihr ein Geschöpf beigemischt, und auch ihr faßt dann, wie die Arianer und die Hellenen, das Geschöpf mit Gott zusammen, der es durch den eigenen Logos geschaffen hat. Was für eine Hoffnung könnt ihr mit solcher Gesinnung haben? Oder wer wird euch mit Gott verbinden, da ihr nicht den Geist Gottes, selbst, sondern den Geist des Geschöpfes habt? Welche Dreistigkeit und Unbesonnenheit begeht ihr, daß ihr den Vater und dessen Logos zu den Geschöpfen erniedrigt, das Geschöpf dagegen Gott gleichstellt! Denn das tut ihr wenn ihr euch den Geist als ein Geschöpf vorstellt und ihn in die Trinität einordnet. Wie wahnwitzig ist es aber wieder von euch, Gott eine Ungerechtigkeit zuzuschreiben, weil ihr nicht alle Engel oder alle Geschöpfe, sondern nur einen aus ihnen Gott und seinem Logos zuzählt! Denn zufolge euerer Anschauung sollte man der Trinität, wenn der Geist nun einmal ein Engel und ein Geschöpf ist und in die Trinität gestellt wird, nicht einen, sondern alle geschaffenen Engel einordnen, und in der Gottheit müßte nicht mehr eine Dreiheit, sondern eine zahllose Vielheit sein. Damit würde euere Vollendung (d.h. Heiligung), die dadurch zu erfolgen scheint, hierhin und dorthin verteilt und durch ihre Mannigfaltigkeit unsicher. Denn solcher Art sind eure und der Arianer Geheimnisse (d.h. Heiligungsmittel), da ihr dient als Gott, der alles geschaffen hat.</p><p>Solche Ungereimtheiten ergeben sich also für euch, wenn ihr eine Zweiheit behauptet. Wenn aber, wie es tatsächlich der Fall ist, eine Trinität existiert, von der erwiesen ist, daß sie unteilbar ist und nichts Ungleiches umschließt, dann muß auch ihre Heiligkeit, ihre Ewigkeit und ihre unveränderliche Natur eine sein. Denn der überlieferte Glaube an sie ist einer und verbindet mit Gott; wer aus der Trinität etwas wegnimmt und bloß im Namen des Vaters oder bloß im Namen des Sohnes oder ohne den Geist im Vater und Sohn getauft wird, empfängt nicht, sondern geht, ebenso wie auch der, der zu geben scheint, leer aus und bleibt unvollendet, da die Vollendung in der Trinität beruht. In gleicher Weise hat derjenige, der den Sohn vom Vater trennt oder den Geist zu den Geschöpfen erniedrigt, weder den Sohn noch den Vater, sondern ist gottlos, schlechter als ein Ungläubiger und alles eher denn ein Christ; und mit Recht. Denn wie die Taufe, die im Vater, Sohn und Heiligen Geist gespendet wird, eine ist, und wie der Glaube an die Trinität einer ist gemäß dem Wort des Apostels, so hat auch die heilige Trinität, die sich selbst gleich, mit sich selbst geeint ist, nichts von den gewordenen Dingen in sich; diese Einheit der Trinität ist unteilbar, und der Glaube an sie ist nur einer. Wenn das aber nach euerer Einbildung, ihr Tropiker, nicht so ist, wenn ihr euch vielmehr in den Kopf gesetzt habt, den Heiligen Geist ein Geschöpf zu nennen, dann ist euer Glaube nicht mehr einer, auch euere Taufe nicht mehr eine, sondern zwei, eine im Namen des Vaters und des Sohnes und eine andere im Namen eines geschöpflichen Engels, und es bleibt euch nichts Sicheres und Wahres mehr übrig. Denn welche Gemeinschaft obwaltet zwischen dem Geschöpf und dem Schöpfer, oder welche Einheit zwischen den niederen Geschöpfen und dem Logos, der sie geschaffen hat? Das wußte der selige Paulus; deshalb trenne er die Trinität nicht wie ihr, sondern lehrte die Einheit derselben in seinem Schreiben über die geistigen Dinge an die Korinther, und führt alles auf einen Gott, den Vater, als das Haupt zurück mit den Worten: „Es gibt verschiedene Gaben, aber nur einen Geist; es gibt verschiedene Dienstleistungen, aber nur einen Herrn; es gibt verschiedene Kraftwirkungen, aber nur einen Gott, der alles in allem wirkt“. Was nämlich der Geist jedem zuteilt, das wird vom Vater durch den Logos gespendet. Denn alles, was der Vater hat, das hat auch der Sohn; deshalb ist auch alles, was vom Sohn im Geist gegeben wird, Gnadengabe des Vaters. Und wenn der Geist in uns ist, so ist auch der Logos, der ihn gibt, in uns, und im Logos ist der Vater. So ist, wie schon ausgeführt wurde, die Stelle gemeint: „Ich und der Vater werden kommen und Wohnung bei ihm nehmen„. Denn wo das Licht ist, da ist auch der Glanz, und wo der Glanz ist, da ist auch seine Wirkung und die strahlende Gnade. Auch das lehrt wieder Paulus, der im zweiten Brief an die Korinther abermals schreibt: „Die Gnade unseres Herrn Jesus Christus, die Liebe Gottes und die Gemeinschaft des Heiligen Geistes sei mit euch allen“. Denn die Gnade und Gabe, die in der Trinität verliehen wird, wird vom Vater durch den Sohn im Heiligen Geist verliehen. Wie nämlich die Gnade vom Vater durch den Sohn verliehen wird, so ist in uns eine Teilnahme an der Gabe nicht möglich außer im Heiligen Geiste, Denn wenn wir an ihm teilhaben, besitzen wir die Liebe des Vaters, die Gnade des Sohnes und auch die Gemeinschaft des Heiligen Geistes.</p><p>Auch aus dem ergibt sich also die Einheit der trinitarischen Wirksamkeit. Denn der Apostel zeigt nicht, daß von jedem Glied Verschiedenes und Geteiltes gegeben wird, sondern daß das, was gespendet wird, in der Trinität gespendet wird, und daß alles von einem Gott kommt. Wie kann also jemand, ohne geradezu gegen den Sohn selbst sich der Gottlosigkeit schuldig zu machen, den ein Geschöpf nennen, der kein Geschöpf, sondern mit dem Sohn vereinigt ist wie der Sohn mit dem Vater, der mit dem Vater und dem Sohn zugleich verehrt und mit dem Logos als Gott bekannt wird? Denn es gibt nichts, das nicht durch den Logos im Geiste geschieht und gewirkt wird. Das wird auch in den Psalmen erklärt: „Durch das Wort des Herrn sind die Himmel befestigt und durch den Geist seines Mundes all ihre Kraft„. Und im 147. Psalm: „Er wird sein Wort senden, und sie schmelzen; sein Geist wird wehen, und die Wasser werden fließen“. Und gerechtfertigt sind wir, wie der Apostel sagt, „im Namen unseres Herrn Jesus Christus und im Geiste unseres Gottes„. Denn der Geist ist vom Logos untrennbar. Wenn nämlich der Herr ganz bestimmt versichert: „Ich und der Vater werden kommen“, so kommt zugleich der Geist mit, nicht anders als der Sohn, der in uns Wohnung nehmen will, da Paulus an die Ephesier schreibt: „Er möge euch nach dem Reichtum seiner Herrlichkeit verleihen, durch seinen Geist an Kraft zu erstarken für den innern Menschen, daß Christus in euch wohne„. Wenn aber der Sohn in uns ist, so ist auch der Vater in uns, da der Sohn spricht: „Ich bin im Vater und der Vater ist in mir“. Weil also der Logos zu den Propheten kommt, weissagen sie im Heiligen Geiste selbst. Wenn daher die Schrift sagt: „es erging das Wort des Herrn„ an irgendeinen Propheten, so wird dadurch ausgedrückt, daß derselbe im Heiligen Geist weissage. Denn bei Zacharias steht geschrieben: „Nehmet doch meine Worte und meine Satzungen an, die ich durch meinen Geist meinen Dienern, den Propheten, auftrage“. Und kurz darauf tadelt er das Volk mit den Worten: „Und sie machten ihr Herz unfolgsam, damit sie mein Gesetz nicht hörten noch die Worte, die der Herr, der Allmächtige, durch seinen Geist mittels seiner früheren Propheten gesandt hat„. Auch Petrus spricht in der Apostelgeschichte: „Männer, Brüder! Es mußte die Schrift erfüllt werden, die der Heilige Geist vorherverkündet hat“. Und einmütig erhoben die Apostel ihre Stimme: „Herr, der du den Himmel, die Erde, das Meer und alles, was darin ist, gemacht hast, der du durch den Heiligen Geist aus dem Munde Davids, unseres Vaters, deines Dieners gesprochen hast„. Und Paulus sprach während seines Aufenthaltes in Rom zu den Juden, die zu ihm kamen: „Treffend hat der Heilige Geist durch den Propheten Jesaias zu eueren Vätern geredet“. An Timotheus aber schrieb er: „Ausdrücklich sagt der Geist, daß in späteren Zeiten einige vom gesunden Glauben abfallen und Irrgeistern sich ergeben werden„. Wenn es also heißt, der Geist komme zu jemand, so ist darunter der Logos zu verstehen, der in ihm den Geist spendet. Da nun die Weissagung erfüllt ist: „Ich will von meinem Geist über alles Fleisch ausgießen“, sagte Paulus: „Durch die Hilfe des Geistes Jesu Christi in mir„. Und an die Korinther schrieb er: „Oder verlangt ihr einen Beweis dafür, daß Christus in mir redet?“ Wenn aber Christus in ihm redete, so war es offenbar Christi Geist, der in ihm redete, denn da Christus in ihm redete, sagte er in der Apostelgeschichte: „Und nun seht! Im Geiste gefesselt ziehe ich nach Jerusalem und weiß nicht, was mir dort widerfahren wird. Doch bezeugt mir der Heilige Geist in jeder Stadt, daß mich Fesseln und Bedrängnis erwarten„. Wenn daher die Heiligen sagen: „Das spricht der Herr“, so reden sie eben im Heiligen Geiste; und indem sie im Geiste reden, sprechen sie in Christus. Wenn also Agapos in der Apostelgeschichte sagt: „Das spricht der Heilige Geist„, so ist das nicht anders gemeint, als daß in ihm das Wort an ihn erging, der Geist ihm eingab, zu reden und anzukündigen, was für Paulus in Jerusalem bevorstand. In der Tat, als der Geist dem Paulus wieder Zeugnis gab, redete Christus selbst in ihm, so daß das Zeugnis, das vom Geiste kommt, das Zeugnis des Logos ist. So kam zugleich mit dem Logos, als er sich in die heilige Jungfrau herabließ, auch der Heilige Geist in sie, und der Logos bildete und formte sich im Heiligen Geiste den Leib in der Absicht, durch sich die Schöpfung dem Vater zu verbinden und darzubringen und in ihm alles wieder zu versöhnen, „nachdem er Frieden gestiftet zwischen dem, was im Himmel, und dem, was auf Erden ist“.</p><p>Übereinstimmend beweisen also die göttlichen Schriften, daß der Heilige Geist kein Geschöpf, sondern dem Logos und der Gottheit des Vaters eigen ist; denn das ist die übereinstimmende Lehre der Heiligen über die heilige und unteilbare Trinität, und der eine Glaube der katholischen Kirche. Die unsinnige Fabelei der Tropiker dagegen widerspricht der Schrift, stimmt jedoch mit der unvernünftigen Lehre der Arianer zusammen. Es ist auch wahrscheinlich, daß sie sich in dieser Weise verstellen, um die Unbefangenen zu täuschen. Aber dank sei dem Herrn, daß es ihnen, wie du schreibst, nicht gelungen ist, sich durch ihre scheinbare Stellungnahme gegen die Arianer zu decken. Denn sie verfielen auch dem Hasse dieser, weil sie nur den Geist und nicht auch den Logos ein Geschöpf nennen. Bei allen aber kamen sie in Verruf, weil sie wirklich gegen den Geist streiten und, des Geistes bloß und bar, bald tot sein werden. Denn nach einem Wort des seligen Apostels konnten sie in ihrer irdischen Gesinnung nicht erfassen, was des Geistes Gottes ist, weil es geistig beurteilt werden sollte. Jene aber, die die Wahrheit erkennen, beurteilen zwar alles, werden aber selbst von niemand beurteilt, weil sie in sich den Herrn haben, der ihnen im Geiste sich selbst und durch sich den Vater offenbart.</p><p>Trotz meines Aufenthaltes in der Wüste habe ich also um der Dreistigkeit jener willen, die von der Wahrheit abgewichen sind, unbekümmert um ihren Spott über die Schwäche und Armseligkeit meiner Beweisführung, dieses kurze Schreiben abgefaßt. Ich übersende es deiner Frömmigkeit mit dem dringenden Ersuchen, es zu lesen, manches zu verbessern, schwache Ausführungen aber nachsichtig zu beurteilen. Denn ich habe mich dem apostolischen Glauben gemäß ausgesprochen, der uns von den Vätern überliefert wurde, und habe nichts Fremdartiges ersonnen. Ich habe, was ich vernommen, in Übereinstimmung mit den heiligen Schriften niedergeschrieben. Das stimmt nämlich mit dem überein, was von mir zur Bekräftigung oben aus den heiligen Schriften angeführt wurde. Das ist auch keine Einbildung, die des Grundes entbehrte; der Herr Jesus Christus selbst hat vielmehr in eigener Person die Samariterin und durch sie uns über die Vollkommenheit der heiligen Trinität und ihre unteilbare und eine Gottheit belehrt. Die Wahrheit selbst bezeugt das, wenn sie zur Samariterin spricht: „Glaube mir, Frau …, es kommt die Stunde, und sie ist schon da, wo die wahren Verehrer den Vater im Geiste und in der Wahrheit anbeten werden; denn der Vater sucht solche Anbeter. Gott ist Geist, und seine Verehrer müssen ihn im Geiste und in Wahrheit anbeten„. Daraus ergibt sich, daß die Wahrheit der Sohn selbst ist, wie er selber sagt: „Ich bin die Wahrheit“. Ihn rief auch der Prophet David herab mit den Worten: „Sende dein Licht und deine Wahrheit„. Die wahren Verehrer beten also den Vater an, aber im Geiste und in Wahrheit, indem sie den Sohn und in ihm den Geist bekennen. Denn der Geist ist vom Sohn untrennbar wie der Sohn vom Vater untrennbar ist. Die Wahrheit selbst bezeugt es mit den Worten: „Ich werde euch den Tröster senden, den Geist der Wahrheit, der vom Vater ausgeht, den die Welt nicht empfangen kann“, d.h. jene, die leugnen, daß er aus dem Vater im Sohne sei. Man muß also in Nachahmung der wahren Anbeter die Wahrheit bekennen und sich zu ihr halten. Wenn somit jene Leute nach diesen Ausführungen die Wahrheit weder erkennen wollen noch begreifen können, so sollen sie doch von ihren Lästerungen abstehen und die Trinität nicht zertrennen, damit sie nicht vom Leben getrennt werden. Sie sollen den Heiligen Geist auch nicht zu den Geschöpfen zählen, damit nicht auch sie, wie einst die Pharisäer, die die Werke des Geistes dem Beelzebul zuschrieben, in gleicher Weise sich erdreisten und hier sowie nach diesem Leben die gleiche Strafe wie jene ohne Hoffnung auf Vergebung erdulden müssen.</p><h2>Zweiter Brief</h2><p>Ich hielt dafür, ohnehin kurz geschrieben zu haben; ich warf mir sogar selbst große Schwäche vor, da ich nicht einmal soviel zu schreiben vermochte, als Menschen zur Erwiderung an jene gestattet ist, die gegen den Heiligen Geist freveln. Wie du schreibst, baten aber einige der Brüder, ich möchte auch das noch kürzer zusammenfassen, damit es ihnen möglich wäre, sofort und kurz sich gegen jene, die über unseren Glauben Fragen stellen, zu verteidigen, und die Gottlosen zu widerlegen. Deshalb entspreche ich diesem Wunsche im Vertrauen, du werdest bei deiner trefflichen Einsicht ergänzen, was hier etwa übergangen sein sollte. Die Arianer, die sich nur auf sich selbst stützen und nach Art der Sadduzäer nur das fassen, was außer ihnen ist, deuteten die von Gott eingegebene Schrift lediglich mit menschlicher Einsicht. Wenn sie also vernehmen, der Sohn sei des Vaters Weisheit, Abglanz und Logos, so pflegen sie darauf zu sagen: Wie kann das sein? Als ob das unmöglich wäre, was sie nicht denken können. So könnten sie doch auch über das ganze Weltall urteilen: Wie konnte die Schöpfung, die einst nicht war, entstehen? Oder wie konnte der Erdenstaub zum vernünftigen Menschen geformt werden? Oder wie konnte das Verwesliche unverweslich werden? Oder wie kann die Erde auf Meeren gegründet sein, und wie hat sie Gott auf Strömungen zurecht gesetzt? Schließlich müssen sie sich selber sagen: „Laßt uns essen und trinken; denn morgen sterben wir", damit nämlich durch ihren Untergang auch ihre wahnwitzige Irrlehre mit zugrunde gehe.</p><p>Diese Lehre der Arianer ist also hinfällig und vergänglich. Das Wort der Wahrheit aber, das auch sie bedenken sollten, besagt vielmehr: Wenn Gott Quelle, Licht und Vater ist, so darf man nicht sagen, daß die Quelle vertrocknet oder das Licht ohne Glanz oder Gott ohne Logos sei, damit Gott nicht etwa ohne Weisheit, ohne Vernunft und ohne Glanz erscheine. Da nun der Vater ewig ist, muß auch der Sohn ewig sein; denn das, was wir im Vater denken, ist zweifellos auch im Sohn, da der Herr selbst spricht: „Alles, was der Vater hat, ist mein“, und alles, was mein ist, gehört dem Vater. Ewig ist also der Vater, ewig ist auch der Sohn, denn durch ihn wurden die Zeiten geschaffen. Wirklich ist der Vater; notwendigerweise daher auch der Sohn, „der da ist über alles”, wie Paulus sagt, „Gott, hochgelobt in Ewigkeit, Amen“. Man darf vom Vater nicht sagen: Es gab eine Zeit, da er nicht war; man darf aber auch vom Sohne nicht sagen: Es gab eine Zeit, da er nicht war. Allmächtig ist der Vater, allmächtig ist auch der Sohn, da Johannes sagt: „Der da ist, der war, der kommen wird, der Allmächtige”. Licht ist der Vater, Abglanz und wahrhaftiges Licht der Sohn. Wahrhafter Gott ist der Vater, wahrhafter Gott der Sohn; denn Johannes schrieb: „Wir sind in dem Wahrhaftigen, in seinem Sohne Jesus Christus“. Es gibt überhaupt unter dem, was der Vater hat, nichts, das nicht auch dem Sohn gehörte. Denn deshalb ist der Sohn im Vater und der Vater im Sohn, weil das, was der Vater hat, auch im Sohn ist, und weil das wiederum im Vater gedacht wird. So ist auch das Wort zu verstehen: „Ich und der Vater sind eins”. Denn es ist nicht etwas anderes im Vater und etwas anderes im Sohn; vielmehr ist das, was im Vater ist, auch im Sohn. Und weil du das, was du im Vater schaust, auch im Sohne schaust, kann man das Wort richtig verstehen: „Wer mich sieht, der sieht den Vater".</p><p>Nach solchen Beweisen ist gottlos, wer den Sohn ein Geschöpf nennt. Denn er wird sich genötigt sehen, auch die sprudelnde Quelle ein Geschöpf, die Weisheit, den Logos, in dem alles ist, was des Vaters ist, ein Geschöpf zu nennen. Überdies kann man auch aus folgendem ersehen, daß die Ketzerei dieser Ariomaniten unhaltbar ist. Wir teilen mit jenen, denen wir gleichen, dieselbe Natur und Wesenheit. Weil wir nun als Menschen gleich sind und dieselbe Natur haben, sind wir einander wesensgleich. Allen kommt ja dieselbe Sterblichkeit, Vergänglichkeit, Wandelbarkeit und derselbe Ursprung aus Nichts zu. Auch die Engel untereinander und alle übrigen Dinge haben ebenso die gleiche Natur miteinander gemein. In ihrem Vorwitz sollten sie also erwägen, ob zwischen dem Sohn und den Geschöpfen Gleichheit obwalte, oder ob sie das, was im Sohne ist, auch in den gewordenen Dingen finden können, so daß sie sich erdreisten könnten, auch den Logos Gottes ein Geschöpf zu nennen. Das werden aber diese ganz unbesonnenen Leute, die von der Frömmigkeit abirren, wohl nicht finden. Denn unter den Geschöpfen ist keines allmächtig, steht keines voll in der Gewalt des anderen, weil jedes Gott gehört. Denn „die Himmel erzählen Gottes Herrlichkeit„, „die Erde ist des Herrn und ihre Fülle“, „das Meer sah es und floh„. Und alles dient dem Schöpfer, vollzieht sein Wort und gehorcht seinem Befehl. Der Sohn aber ist allmächtig wie der Vater; das steht geschrieben und ist bewiesen. Unter den Geschöpfen ist ferner keines von Natur unwandelbar. Denn unter den Engeln haben einige ihre Stellung nicht bewahrt, und „die Sterne sind nicht rein vor ihm“. Auch der Teufel fiel vom Himmel; Adam sündigte, und alles ist veränderlich. Der Sohn aber ist unwandelbar und unveränderlich wie der Vater. Das bringt Paulus aus dem 101. Psalm in Erinnerung mit den Worten: „Und du, o Herr, hast im Anfang die Erde gegründet und die Werke deiner Hände sind die Himmel. Sie vergehen, du aber bleibst; sie alle werden altern wie ein Kleid, und wie ein Gewand wirst du sie ändern, und sie werden sich wandeln. Du aber bist derselbe, und deine Jahre nehmen kein Ende„. Und abermals sagt er: „Jesus Christus gestern und heute, derselbe in Ewigkeit“.</p><p>Ferner ist alles Geschaffene einmal nicht gewesen, sondern erst geworden. Denn er hat die Erde, die zuvor nicht war, geschaffen, und „er ruft das, was nicht ist, ins Dasein“. Was aber gemacht ist, das ist geschaffen; darum hat es auch einen Anfang des Seins. Denn „im Anfang schuf Gott den Himmel und die Erde” und alles, was darin ist. Und wiederum: „Meine Hand hat dies alles gemacht“. Dem Sohn aber kommt das Sein schlechthin zu, und er ist Gott über alles wie der Vater. Das ist auch bewiesen. Er wird nicht gemacht, sondern macht selbst; er wird nicht geschaffen, sondern schafft und vollbringt selbst die Werke des Vaters. Denn durch ihn sind die Welten geworden; alles ist durch ihn geworden, und ohne ihn ist nichts geworden. Wie der Apostel aus dem Psalm bewies, hat er im Anfang die Erde gegründet, und sind die Himmel die Werke seiner Hände. Von den Geschöpfen ist ferner keines seiner Natur nach Gott, sondern jedes der gewordenen Dinge wurde das, was es ward, auch genannt, das eine Himmel, ein anderes Erde, die einen Lichter, die anderen Sterne, andere Meer, Abgründe und vierfüßige Tiere, und endlich eines Mensch; und vor diesen Engel, Erzengel, Cherubim, Seraphim, Gewalten, Fürstentümer, Herrschaften, Paradies. So bleibt auch ein jedes. Wenn einige auch Götter genannt wurden, so geschah es nicht wegen ihrer Natur, sondern wegen ihrer Teilnahme am Sohne. Denn so sagte auch er selbst: „Wenn sie (d. h. die Schrift) diejenigen Götter genannt hat, an die das Wort Gottes erging…”. Weil sie eben nicht von Natur Götter sind, kommt es zuweilen, daß manche sich wandeln und das Wort vernehmen müssen: „Ich sprach: Götter seid ihr und Söhne des Höchsten alle; ihr werdet aber wie Menschen sterben“. So war jener, der das Wort hören mußte: „Du bist ein Mensch und kein Gott”. Der Sohn ist aber wahrhaftiger Gott wie der Vater. Denn er ist in ihm und der Vater ist im Sohn. So schrieb Johannes, wie gezeigt worden ist; David aber singt: „Dein Thron, o Gott, steht für alle Ewigkeit; ein Szepter der Gerechtigkeit ist das Szepter deines Reiches“. Der Prophet Jesaias aber ruft: „Abgemüht hat sich Ägypten und der Handel der Äthiopier, und die Sabäer, hochgewachsene Männer, werden zu dir hinüberziehen und hinter dir hergehen mit Fesseln gebunden, und werden dich anbeten, weil Gott bei dir ist. Denn du bist der Gott Israels, und wir wußten es nicht”. Wer ist aber der Gott, in dem Gott ist, außer der Sohn, der spricht: „Ich bin im Vater und der Vater ist in mir"?.</p><p>Wer sieht bei diesem Sachverhalt und angesichts dieser Schriftzeugnisse nicht ein, daß der ohne mit dem Vater wesensgleich ist, da er mit den Geschöpfen nichts gleich hat, während alles, was des Vaters ist, auch sein ist? Denn wie er mit den Geschöpfen wesensgleich wäre, wenn zwischen ihm und denselben irgendwelche Gleichheit oder Verwandtschaft bestünde, ebenso ist er natürlich dem Vater wesensgleich, weil er von den geschaffenen Dingen dem Wesen nach verschieden, der eigene Logos des Vaters und dieser kein anderer ist als jener, und weil alles, was des Vaters ist, auch ihm eignet. Denn so dachten auch die Väter, als sie auf der Synode in Nicäa das Bekenntnis ablegten, daß der Sohn wesensgleich und aus dem Wesen des Vaters sei. Sie wußten nämlich ganz gut, daß kein geschaffenes Wesen je sagen könnte: „Alles, was der Vater hat, ist mein". Denn weil es einen Anfang des Daseins hat, kommt ihm das Sein schlechtweg und das Ewigsein nicht zu. Eben deshalb aber, weil dem Sohn das zukommt, und weil alles, was oben dem Vater zu gesprochen wurde, auch des Sohnes ist, kann die Wesenheit des Sohnes nicht geschaffen, sondern muß mit dem Vater wesensgleich sein. Übrigens kann sie auch aus dem Grund keine geschaffene Wesenheit sein, weil sie die Eigenschaften Gottes in sich zu fassen vermag. Seine Eigenschaften aber, aus welchen er als Gott erkannt wird, sind z. ß. die Allmacht, das (schlechthinnige) Sein, die Unveränderlichkeit und die übrigen früher erwähnten Eigenschaften, damit nicht Gott selbst den Geschöpfen wesensgleich scheine, wie diese Toren meinen, wenn er Eigenschaften besäße, die auch die Geschöpfe besitzen können.</p><p>Aber auch in folgender Weise kann man die Gottlosigkeit derjenigen widerlegen, die behaupten, der Logos Gottes sei ein Geschöpf. Unser Glaube geht auf den Vater, den Sohn und den Heiligen Geist, da der Sohn selbst zu den Aposteln sprach: „Gehet hin und lehret alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes„. So sprach er, damit wir durch das, was wir wissen, auch das vorher Gesagte verstehen möchten. Wie wir also die Väter nicht Schöpfer, sondern Erzeuger nennen und wie man nicht sagt, daß wir ein Geschöpf der Väter, sondern von Natur deren Söhne und ihnen wesensgleich seien, so ist auch Gott, wenn er Vater ist, auf jeden Fall Vater eines von Natur wesensgleichen Sohnes. Abraham z. B. hat den Isaak nicht geschaffen, sondern gezeugt; Beseleel dagegen und Eliab haben alle ihre Kunstwerke im Zelte nicht gezeugt, sondern gemacht. Auch Schiff- und Hausbaumeister zeugen nicht, was sie machen, sondern jeder stellt es fertig, jener das Fahrzeug, dieser das Haus. Isaak hat natürlich den Jakob nicht gemacht, sondern seiner Natur nach und wesensgleich gezeugt, und Jakob ebenso den Juda und seine Brüder. Wie daher wohl niemand so töricht sein und sagen wird, das Haus sei mit dem Baumeister, das Schiff mit dem Werkmeister wesensgleich, so wird man wohl mit Recht sagen, daß jeder Sohn seinem Vater wesensgleich sei. Wenn also Vater und Sohn existieren, muß der Sohn von Natur und in Wahrheit Sohn sein. Das heißt aber dem Vater wesensgleich sein, wie reichlich gezeigt wurde. Von den Geschöpfen heißt es doch: „Er sprach, und sie sind geworden; er befahl, und sie wurden geschaffen“; vom Sohne aber: „Mein Herz gab ein gutes Wort von sich„. Daniel kannte den Sohn Gottes und kannte auch die Werke Gottes. Er sah den Sohn, wie er den Glutofen mit Tau befeuchtete. Aber, nachdem er von den Werken gesagt hatte: „Preiset, alle Werke des Herrn, den Herrn“, machte er jedes einzelne Geschöpf namhaft; den Sohn jedoch zählte er nicht mit, da er wußte, daß derselbe kein Geschöpf ist, sondern daß die Geschöpfe durch ihn geworden sind, daß er im Vater gepriesen und hoch erhöht wird. Wie also Gott durch ihn jenen geoffenbart wird, die ihn kennen, so wird durch ihn und in ihm dem Vater Lob, Preis, Ehre und Macht zuerkannt, damit, wie die Schriften sagen, ein solches Bekenntnis wohlgefällig würde. Aus vielen anderen und aus diesen Gründen ist es also und wird es bewiesen, daß gottlos ist, wer den Logos Gottes ein Geschöpf nennt.</p><p>Doch, sie schützen die Stelle im Buch der Sprüche vor: „Der Herr hat mich geschaffen als Anfang seiner Wege zu seinen Werken“, und denken bei sich selbst: Sieh, „er hat geschaffen”, er ist also ein Geschöpf. Deshalb ist es notwendig, auch aus dieser Stelle zu zeigen, wie sehr sie irren, da sie die Absicht der göttlichen Schrift nicht erkennen. Wenn er doch Sohn ist, soll man ihn nicht ein Geschöpf nennen; wenn er aber ein Geschöpf ist, soll man ihn nicht Sohn nennen. Im vorhergehenden ist ja gezeigt, welch großer Unterschied zwischen Geschöpf und Sohn besteht. Da ferner die Heiligung (τελείωσις) nicht im Namen des Schöpfers und des Geschöpfes, sondern im Namen des Vaters und des Sohnes vollzogen wird, ist der Herr nicht Geschöpf, sondern Sohn zu nennen. Das steht doch nicht geschrieben? sagt man. Ja, es steht geschrieben und muß unbedingt gelten; die Häretiker verstehen aber das, was treffend ausgesprochen ist, unrichtig. Denn wenn sie das Wesen des Christentums verstehen und kennen würden, so würden sie nicht den Herrn der Herrlichkeit ein Geschöpf nennen noch an dem treffenden Schriftwort Anstoß nehmen. Sie jedoch erkennen es nicht und fassen es nicht und „wandeln" daher, wie geschrieben steht, „in der Finsternis“. Wir aber müssen trotzdem darüber reden. Auch dadurch soll nämlich die Torheit dieser Leute an den Tag kommen; wir aber unterlassen dann die Widerlegung ihrer Gottlosigkeit nicht, so daß vielleicht auch sie zur Einsicht kommen. Das Wesen des Glaubens an Christus besteht gerade darin, daß der Sohn Gottes, der Logos-Gott — denn „im Anfang war das Wort und Gott war das Wort” —, die Wahrheit und Kraft des Vaters — denn Christus ist Gottes Kraft und Gottes Weisheit —, in der Fülle der Zeiten um unseres Heiles willen Mensch geworden ist. Denn Johannes selbst hat nach den Worten „im Anfang war das Wort" alsbald hinzugefügt: „Und das Wort ist Fleisch geworden“. Das will ebensoviel heißen als: es ist Mensch geworden. Auch der Herr sagte von sich selbst: „Was sucht ihr mich zu töten, einen Menschen, der euch die Wahrheit gesagt hat?” Paulus aber, von ihm selbst belehrt, sprach: „Einer ist Gott und einer ist Mittler zwischen Gott und den Menschen, der Mensch Christus Jesus". Er ist Mensch geworden, hat das Wohl der Menschheit bestellt, hat den Tod, dem wir verfallen waren, überwunden und vernichtet, und sitzt jetzt zur Rechten des Vaters, indem er im Vater und der Vater in ihm ist, wie er immer war und allzeit ist.</p><p>Das ist als das Wesen von den Aposteln her durch die Väter auf uns gekommen. Wer übrigens in der Schrift liest, muß prüfen und unterscheiden, wann sie von der Gottheit des Logos und wann sie von seiner Menschheit redet, damit wir nicht das eine für das andere nehmen und törichte Reden führen, wie es den Arianern ergangen ist. Wir haben nun erkannt, daß er der Logos ist, und deshalb wissen wir, daß „durch ihn alles geschaffen und ohne ihn nichts geschaffen ist“, „daß durch das Wort des Herrn die Himmel befestigt sind”, „daß er sein Wort sendet und alles heilt“. Wir haben ferner erkannt, daß er die Weisheit ist, und deshalb wissen wir, daß Gott durch die Weisheit die Erde gegründet und der Vater alles mit Weisheit gemacht hat. Wir haben auch erkannt, daß er Gott ist, und deshalb glauben wir, daß er der Gesalbte ist; denn David singt: „Dein Thron, o Gott, steht für immer und ewig; ein Szepter der Gerechtigkeit ist das Szepter deiner Herrschaft; du liebst die Gerechtigkeit und hassest das Unrecht, deshalb hat Gott, dein Gott, dich gesalbt mit Freudenöl mehr als deine Genossen”; und bei Jesaias sagt er von sich selbst: „Der Geist des Herrn ist über mir, deshalb hat er mich gesalbt“; Petrus aber legte das Bekenntnis ab: „Du bist Christus, der Sohn des lebendigen Gottes”. Ebenso haben wir erkannt, daß er Mensch geworden ist, und deshalb leugnen wir nicht, was von ihm Menschliches ausgesagt wird, z. B. Hungern, Dürsten, Geschlagenwerden, Weinen, Schlafen und endlich den Tod am Kreuz für uns erdulden; denn das alles steht von ihm geschrieben. So hat die Schrift auch das Wort „geschaffen" (ἔκτισεν), das auf die Menschen paßt, nicht verschwiegen, sondern ausgesprochen; denn wir Menschen sind geschaffen und gemacht. Wenn wir aber hören, daß er hungerte, schlief, geschlagen wurde, so leugnen wir doch seine Gottheit nicht. Ebenso werden wir uns wohl, wenn wir das Wort ἔκτισεν vernehmen, folgerichtig daran erinnern, daß er, der Gott ist, als Mensch geschaffen wurde; denn Menschen ist es eigen, geschaffen zu werden, sowie auch, was vorhin angeführt wurde, zu hungern und dergleichen.</p><p>Denn auch jene andere richtige Stelle, die von ihnen gleichfalls unrichtig verstanden wird, nämlich: „Von jenem Tag und jener Stunde weiß niemand, weder die Engel noch der Sohn“, hat einen guten Sinn. Jene folgern nämlich aus den Worten „noch der Sohn”, daß er mit dem Hinweis auf sein Nichtwissen seine Geschöpflichkeit zu erkennen gebe. Dem ist aber nicht so; das sei ferne! Denn wie er mit dem Worte ἔκτισεν sich so ausdrückte, wie es der menschlichen Natur angemessen ist, so hat er sich auch mit den Worten „noch der Sohn" so ausgesprochen, wie es mit Bezug auf die menschliche Natur angebracht erscheint. Und der Grund, warum er so redete, ist sehr verständlich. Da er nämlich, wie geschrieben steht, Mensch geworden ist, das Nichtwissen aber den Menschen eigen ist wie Hungern und alles andere — denn die Menschen erkennen nichts, wenn sie es nicht gehört oder gelernt haben —, darum legte er, insofern er Mensch geworden war, auch die menschliche Unwissenheit an den Tag; einmal um zu zeigen, daß er wahrhaft einen menschlichen Leib habe, dann aber auch, um die menschliche Natur, indem er die menschliche Unwissenheit an seinem Leibe trüge, von allem zu erlösen und zu reinigen und sie vollkommen und heilig dem Vater darzubringen. Welchen Vorwand werden die Arianer noch finden können? Was werden sie ferner noch aussinnen und stammeln? Sie sind überwiesen, daß sie das Wort nicht verstehen: „Der Herr schuf mich zu seinen Werken“. Es ist auch gezeigt, daß sie den Sinn der Worte nicht erfassen: „Von jenem Tage weiß niemand, nicht einmal die Engel oder der Sohn”. Denn durch das Wort ἔκτισε με gibt er die menschliche Natur kund, weil er Mensch geworden und geschaffen worden ist. Aber durch die Worte: „Ich und der Vater sind eins“, „wer mich sieht, der sieht auch den Vater”, und „ich bin im Vater und der Vater ist in mir“ gibt er seine Ewigkeit und seine Wesensgleichheit mit dem Vater kund. Ebenso redet er wieder als Mensch, wenn er sagt: „Niemand weiß es, nicht einmal der Sohn”; denn Menschen ist das Nichtwissen eigen. Wenn er aber sagt: „Niemand kennt den Vater außer der Sohn noch den Sohn außer der Vater“, so wird er wohl noch weit mehr die geschaffenen Dinge kennen. Darum sprachen laut Johannes die Jünger zum Herrn: „Jetzt wissen wir, daß du alles weißst”. Es ist also offenbar, daß es nichts gibt, was er nicht weiß, weil er der Logos ist, durch den alles geworden ist. Weil aber zu diesem allen auch jener Tag gehört, wird er sicher durch ihn kommen, und sollten die Arianer infolge ihrer Unwissenheit auch zehntausendmal bersten.</p><h2>Dritter Brief</h2><p>Du wirst dich vielleicht wundern, wenn du trotz deines Auftrages, den Brief über den Heiligen Geist zu kürzen und den Gegenstand desselben mit wenigen Worten zu erläutern, siehst, wie ich diesen Gegenstand verlasse und gegen jene schreibe, die wider den Sohn Gottes freveln und ihn ein Geschöpf nennen; aber ich bin überzeugt, daß du mich nicht tadeln wirst, wenn du den Grund erfährst, sondern daß es deine Frömmigkeit billigen wird, wenn du die Zweckmäßigkeit dieses Vorgehens ersiehst. Der Herr hat nämlich selbst gesagt: „Der Tröster wird nicht von sich selbst reden, sondern was er hört, wird er reden, weil er von dem Meinigen nehmen und euch verkünden wird“. Der Herr gab ihn aus sich den Jüngern, indem er sie anhauchte, und so goß ihn der Vater dem Schriftwort gemäß über alles Fleisch aus. Deshalb habe ich mit Recht zuerst über den Sohn Gottes gesprochen und geschrieben, damit wir durch die Erkenntnis des Sohnes auch die rechte Erkenntnis des Geistes gewinnen könnten. Denn dasselbe eigentümliche Verhältnis, in dem wir den Sohn zum Vater wissen, obwaltet, wie wir finden werden, auch zwischen dem Geist und dem Sohn. Und wie der Sohn spricht: „Alles, was der Vater hat, ist mein”, so werden wir finden, daß dies alles durch den Sohn auch im Geiste ist. Und wie der Vater auf den Sohn hinwies mit den Worten: „Dieser ist mein geliebter Sohn, an dem ich mein Wohlgefallen habe“, ebenso eignet der Geist dem Sohne. Denn „er sandte”, sagt der Apostel, „den Geist seines Sohnes in unser Herz, der da ruft: Abba, Vater“. Und was besonders bemerkenswert ist, wie der Sohn spricht: Was mein ist, das ist des Vaters; ebenso ist der Heilige Geist, der Eigentum des Sohnes genannt wurde, Eigentum des Vaters, Denn der Sohn selbst spricht: „Wenn der Tröster kommt, den ich euch vom Vater senden werde, den Geist der Wahrheit, der vom Vater ausgeht, so wird er von mir Zeugnis geben”. Paulus aber schreibt: „Niemand kennt das (Wesen) des Menschen außer der Geist des Menschen, der in ihm wohnt; so kennt auch das (Wesen) Gottes niemand außer der Geist Gottes, der in ihm ist. Wir aber haben nicht den Geist der Welt empfangen, sondern den Geist aus Gott, um zu erkennen, was uns von Gott geschenkt worden ist". Und in der ganzen göttlichen Schrift wirst du finden, daß vom Heiligen Geiste gesagt wird, er sei des Sohnes und auch er sei des Vaters. Davon haben wir früher schon geschrieben. Wenn also der Sohn wegen seines eigentümlichen Verhältnisses zum Vater, und weil er die eigene Erzeugung der Wesenheit desselben ist, kein Geschöpf, sondern dem Vater wesensgleich ist, so ist wohl auch der Heilige Geist kein Geschöpf; gottlos ist vielmehr, wer dies angesichts des besonderen Verhältnisses behauptet, in dem der Geist zum Sohne steht, weil er aus letzterem allen gegeben wird, und weil das, was er hat, des Sohnes ist.</p><p>Das genügt zwar, um jeden auch noch so rechthaberischen Menschen zu bestimmen, den kein Geschöpf Gottes mehr zu nennen, der in Gott ist, die Tiefen Gottes erforscht und aus dem Vater durch den Sohn gegeben wird, um nicht dadurch gezwungen zu werden, auch den Sohn ein Geschöpf zu heißen, den Logos, die Weisheit, das Ebenbild, den Abglanz, in dem jeder, der ihn schaut, den Vater schaut, und schließlich das Wort hören zu müssen: „Wer den Sohn leugnet, hat auch den Vater nicht“. Gar bald wird ja ein solcher Mensch wie der Tor sprechen: „Es gibt keinen Gott”. Trotzdem ist es aber angezeigt, um die Widerlegung der Gottlosen durch zahlreichere Beweise zu stützen, eben dadurch, womit die Ungeschöpflichkeit des Sohnes bewiesen wird, auch die Ungeschöpflichkeit des Geistes zu beweisen. Die Geschöpfe sind aus Nichts entstanden und haben einen Anfang ihres Seins; denn „im Anfang schuf Gott den Himmel und die Erde" und was darin ist. Der Heilige Geist aber ist und heißt aus Gott, wie der Apostel gesagt hat. Wenn aber der Sohn, weil er nicht aus Nichts, sondern aus Gott ist, ganz natürlich kein Geschöpf ist, so folgt notwendig, daß auch der Heilige Geist kein Geschöpf ist, weil anerkannt ist, daß er aus Gott sei; denn die Geschöpfe sind aus Nichts entstanden.</p><p>Ferner heißt und ist der Heilige Geist Salbung und Siegel; denn Johannes schreibt: „Und ihr, die Salbung, die ihr von ihm empfangen habt, bleibt in euch, und ihr habt nicht nötig, daß euch jemand belehre, sondern wie seine Salbung euch über alles belehrt…“. Beim Propheten Jesaias aber steht geschrieben: „Der Geist des Herrn ist über mir, deshalb hat er mich gesalbt”. Und Paulus schreibt: „Durch den auch ihr, nachdem ihr gläubig geworden seid, besiegelt wurdet“. Und wiederum: „Betrübet nicht den Geist, durch den ihr besiegelt worden seid für den Tag der Erlösung”. Die Geschöpfe dagegen werden durch ihn gesalbt und versiegelt. Werden aber die Geschöpfe durch den Geist gesalbt und versiegelt, dann ist er kein Geschöpf; denn der Salbende ist nicht den gesalbten Dingen gleich. Diese Salbe ist nämlich Hauch des Sohnes, so daß, wer den Geist hat, sagen kann: „Christi Wohlgeruch sind wir“. Das Siegel ferner drückt den Sohn ab, so daß der Versiegelte die Gestalt Christi hat, wie der Apostel sagt: „Meine Kinder, die ich abermals mit Schmerzen gebäre, bis daß Christus in euch gestaltet ist”. Wenn aber der Geist Wohlgeruch und Gestalt des Sohnes ist, so ist klar, daß er kein Geschöpf ist, da auch der Sohn, der in der Gestalt des Vaters existiert, kein Geschöpf ist. Denn wie derjenige, der den Sohn schaut, auch den Vater schaut, so hat derjenige, der den Heiligen Geist hat, auch den Sohn, und wer ihn hat, ist ein Tempel Gottes, wie Paulus schreibt: „Wisset ihr nicht, daß ihr ein Tempel Gottes seid und der Geist Gottes in euch wohnt?“ Johannes aber sagt: „Daran erkennen wir, daß wir in Gott bleiben und er in uns, weil er uns von seinem Geiste gegeben hat”. Ist es aber anerkannt, daß der Sohn kein Geschöpf ist, weil er im Vater und der Vater in ihm ist, so folgt mit unbedingter Notwendigkeit, daß auch der Geist kein Geschöpf ist; denn in ihm ist der Sohn und er ist im Sohn. Wer den Geist empfängt, heißt daher Tempel Gottes. Weiterhin läßt sich daraus auch gut ersehen, daß der Sohn, wenn er der Logos Gottes ist, wie der Vater nur einer ist; „denn es ist ein Gott, aus dem alles ist, und ein Herr Jesus Christus". Deshalb wird er in Wort und Schrift als der eingeborene Sohn bezeichnet. Die Geschöpfe dagegen sind viel und verschieden: Engel, Erzengel, Cherubim, Mächte, Gewalten u. s. w., wie bereits bemerkt wurde. Wenn aber der Sohn kein Geschöpf ist, weil er nicht einer aus den vielen, sondern einer ist, wie der Vater einer ist, so ist zweifellos auch der Geist kein Geschöpf. Denn vom Sohne muß man auch die Kenntnis über den Geist erlangen. Der Geist ist ja nicht einer aus den vielen, sondern ist gleichfalls einzig.</p><p>Auch das weiß der Apostel, da er sagt: „Dies alles wirkt der eine und derselbe Geist, der eigens jedem zuteilt, wie er will“. Und kurz darauf: „In einem Geiste sind wir alle zu einem Leibe getauft”. Ferner ist es angemessen, vom Sohne, weil man von ihm die Erkenntnis des Geistes gewinnen muß, auch die Beweise herzunehmen. Nun ist der Sohn überall, da er im Vater und der Vater in ihm ist. Denn er hält und umfaßt alles, und es steht geschrieben: „In ihm besteht alles“, sowohl das Sichtbare als das Unsichtbare, „und er ist vor allen”. Die Geschöpfe aber sind an abgegrenzten Orten: die Sonne, der Mond und die übrigen Lichter am Firmament, die Engel im Himmel und die Menschen auf Erden. Wenn aber der Sohn überall ist, weil er nicht an abgegrenzten Orten, sondern im Vater ist, und wenn er kein Geschöpf ist, weil er außer allem ist, so ist folglich auch der Geist kein Geschöpf, weil er nicht an abgegrenzten Orten ist, sondern alles erfüllt und außer allem ist. Denn so steht auch geschrieben: „Der Geist des Herrn hat den Erdkreis erfüllt“. Und David singt: „Wo soll ich hingehen vor deinem Geiste?”. Derselbe ist eben nicht im Raume, sondern außer allem und zwar im Sohne, wie der Sohn im Vater ist. Deshalb ist er ja auch, wie gezeigt wurde, kein Geschöpf. Zu all dem wird die arianische Ketzerei noch kräftiger durch folgendes widerlegt, und wiederum aus dem Sohne die Erkenntnis des Geistes erschlossen werden. Der Sohn ist nämlich Schöpfer wie der Vater. „Denn alles, was ich den Vater tun sehe“, spricht er, „das tue auch ich”. „Alles ist" demnach „durch ihn geworden, und ohne ihn ist nichts geworden“. Wenn aber der Sohn kein Geschöpf ist, weil er Schöpfer ist wie der Vater, und wenn er nicht zu den Geschöpfen gehört, weil alles durch ihn geschaffen wird, dann ist offenbar auch der Geist kein Geschöpf; denn auch von ihm steht im 103. Psalm geschrieben: „Du wirst ihren Geist wegnehmen, und sie werden vergehen und zu ihrem Staube zurückkehren; du wirst deinen Geist aussenden, und sie werden geschaffen werden, und du wirst das Antlitz der Erde erneuern”.</p><p>Nach diesen Zeugnissen der Schrift ist es klar, daß der Geist kein Geschöpf, sondern an der Schöpfung beteiligt ist. Denn der Vater schafft alles durch den Logos im Geiste. Denn wo der Logos ist, dort ist auch der Geist, und was durch den Logos geschaffen wird, hat aus dem Geiste vom Logos die Kraft des Seins. So steht nämlich im 32. Psalm geschrieben: „Durch das Wort (τῷ λόγῳ) des Herrn wurden die Himmel befestigt, und durch den Hauch (τῷ πνεύματι) seines Mundes all ihre Kraft“. Der Geist ist also vom Sohne so untrennbar, daß nach dem Gesagten darüber kein Zweifel mehr besteht. Denn als das Wort (ὁ λόγος) an den Propheten erging, redete derselbe im Geiste das, was ihm vom Logos zukam. So steht auch in der Apostelgeschichte geschrieben, wo Petrus spricht: „Männer, Brüder! es mußte die Schrift erfüllt werden, die der Heilige Geist vorherverkündet hat”. Bei Zacharias aber steht, da das Wort an ihn erging, geschrieben: „Aber nehmet meine Worte und meine Satzungen auf, die ich in meinem Geiste den Propheten auftrage“. Und kurz darauf tadelt er das Volk mit den Worten: „Sie haben ihr Herz unlenksam gemacht, so daß sie nicht auf meine Gesetze hörten noch auf die Worte, die der Herr, der Allmächtige, durch seinen Geist mittels der früheren Propheten gesandt hat”. Und wenn Christus in Paulus redete, wie er selbst sagt: „Sucht ihr einen Beweis dafür, daß Christus in mir redet“, so hatte er nichtsdestoweniger den Geist, der ihm eingab zu reden. Denn so schreibt er selbst: „Gemäß der Hilfe des Geistes Jesu Christi in mir”. Und wiederum sagte er, da Christus in ihm redete: „Aber der Heilige Geist kündigt mir von Stadt zu Stadt an und sagt mir, daß mich Banden und Trübsale erwarten". Der Geist ist nämlich nicht außer dem Logos, sondern ist im Logos und durch diesen in Gott, so daß die Gnadengaben durch die Trinität gespendet werden. Denn bei aller Verschiedenheit derselben ist es, wie er den Korinthern schreibt, derselbe Geist und derselbe Herr und derselbe Gott, der alles in allen wirkt. Denn der Vater selbst wirkt und spendet alles durch den Logos im Geiste.</p><p>Als er den Korinthern seine Segenswünsche aussprach, tat er es unter Berufung auf die Trinität mit den Worten: „Die Gnade des Herrn Jesus Christus und die Liebe Gottes und die Gemeinschaft des Heiligen Geistes sei mit euch allen“. Denn wenn wir des Geistes teilhaftig sind, haben wir die Gnade des Logos und in ihm die Liebe des Vaters. Wie aber die Gnade der Trinität eine ist, so ist die Trinität selbst ungeteilt. Das kann man an der heiligen Maria gleichfalls ersehen. Der Engel Gabriel nämlich, der gesandt war, um die Herabkunft des Logos in sie anzukündigen, sprach: „Der Heilige Geist wird über dich herabkommen”. Er wußte nämlich, daß im Logos der Geist sei. Deshalb setzte er sogleich hinzu: „Und die Kraft des Höchsten wird dich überschatten“, Denn „Christus ist Gottes Kraft und Weisheit”. Da aber der Geist im Logos ist, wird es wohl klar sein, daß er durch den Logos auch in Gott ist. Und so kommen, wenn der Geist zu uns kommt, auch der Sohn und der Vater und nehmen Wohnung in uns. Denn die Trinität ist unteilbar und ihre Gottheit ist eine; und ein Gott ist über alles durch alles und in allem. Das ist der Glaube der katholischen Kirche. Denn in der Trinität hat sie der Herr gegründet und befestigt, indem er zu den Jüngern sprach: „Gehet hin, lehret alle Völker und taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes“. Wenn jedoch der Geist ein Geschöpf wäre, dann hätte ihn der Herr nicht mit dem Vater zusammengestellt, damit die Trinität nicht sich selbst ungleich wäre, wenn etwas Fremdes und Ungleiches mit ihr verbunden würde. Denn was mangelte Gott, daß er etwas dem Wesen nach Verschiedenes annehmen und mit ihm Verherrlichung gewinnen sollte? Das sei ferne! Dem ist nicht so. Er selbst hat gesagt: „Ich bin satt”. Darum hat ihn der Herr selbst mit dem Namen des Vaters verbunden, um zu zeigen, daß die Heilige Trinität nicht aus ungleichen Teilen, nämlich aus Schöpfer und Geschöpf zusammengesetzt sei, sondern daß ihre Gottheit nur eine sei. Das erkannte Paulus und lehrte deshalb, daß die Gnade, die in der Trinität verliehen werde, nur eine sei: „Ein Herr, ein Glaube, eine Taufe". Wie es aber nur eine Taufe gibt, so auch nur einen Glauben. Denn wer an den Vater glaubt, erkennt im Vater den Sohn, und den Geist nicht außer dem Sohne. Und deshalb glaubt er auch an den Sohn und an den Heiligen Geist. Denn die Gottheit der Trinität ist nur eine und wird aus dem einen Vater erkannt.</p><p>Das ist also das Wesen des katholischen Glaubens. Wenn aber jene, die gegen den Geist lästern und ihn ein Geschöpf nennen, durch das Ausgeführte nicht zur Änderung ihrer Ansicht kommen, mögen sie sich wenigstens, durch das Folgende gewarnt, vor Scham verbergen. Wenn es eine Trinität gibt und auf der Trinität der Glaube beruht, so sollen sie sagen, ob die Trinität immer war, oder ob es eine Zeit gab, da sie nicht war. Wenn nun die Trinität ewig ist, so ist der Geist kein Geschöpf, da er ewig zugleich mit dem Logos und in ihm ist. Denn für die Geschöpfe gab es eine Zeit, da sie nicht waren. Ist er aber ein Geschöpf, so ist, da die Geschöpfe aus Nichts entstanden sind, klar, daß einmal eine Zeit war, in der es keine Trinität, sondern eine Zweiheit gab. Was könnte man aber noch Gottloseres aussprechen als dies? Sie behaupten also, die Trinität sei aus Veränderung und Zuwachs zusammengesetzt. Es gäbe zwar eine Zweiheit; diese erwarte aber die Entstehung eines Geschöpfes, damit dasselbe mit dem Vater und dem Sohne verbunden werde und dann so die Trinität entstehe. Es sei fern, daß so etwas einem Christen je auch nur in den Sinn komme! Denn wie der Sohn kein Geschöpf ist, weil er immer existiert, so ist in der Trinität kein Geschöpf, weil sie immer ist; deshalb ist auch der Geist kein Geschöpf. Denn wie die Trinität immer war, so ist sie auch jetzt; und wie sie jetzt ist, so war und ist sie immer, und in ihr Vater, Sohn und Heiliger Geist. Und ein Gott ist der Vater, der über alles, durch alles und in allem, der gepriesen ist in Ewigkeit, Amen. Dies habe ich nun, deinem Verlangen entsprechend, kurz niedergeschrieben und übersende es dir; wenn dabei aber etwas fehlen sollte, so wolle es deiner Einsicht gemäß ergänzen. Lies es den Glaubensgenossen vor und widerlege die streitsüchtigen Lästerer. Vielleicht werden sie, wenn auch spät, doch noch anderen Sinnes und waschen von ihrer Seele die gottlose Gesinnung ab, die sie sich angeeignet haben. Denn es wäre gut für sie, wenn sie, dem Schriftwort gemäß, umkehrten und nicht zauderten, damit sie nicht, wenn sie zögern, das Wort des Herrn hören müssen: „Wer gegen den Heiligen Geist redet, dem wird nicht vergeben werden, weder in dieser Welt noch in der künftigen".</p><h2>Vierter Brief</h2><p>Ich habe den Brief gelesen, den mir deine Frömmigkeit letzthin schrieb, und höchlichst verwundert über die Dreistigkeit der Ketzer, war es mir klar, daß ihnen gegenüber nichts mehr am Platze ist als die Weisung des Apostels: „Einen ketzerischen Menschen meide, nachdem du ihn ein- oder zweimal zurechtgewiesen hast; wisse, daß solch ein Mensch völlig aus den Fugen geraten ist und mit seiner Sünde sich selbst das Gericht zuzieht". Denn da seine Gesinnung verkehrt ist, fragt er nicht, um zu hören und zu gehorchen noch um zu lernen und in sich zu gehen, sondern um jener willen, die von ihm hintergangen wurden, um nicht, wenn er schweigen wollte, auch von diesen verurteilt zu werden. Das früher Ausgeführte sollte allerdings genügen; es sollte nach so vielen Beweisen genügen, um sie von ihren Lästerungen gegen den Heiligen Geist abzubringen. Sie wurden indes nicht zufrieden gestellt; abermals wollen sie in unverschämter Weise zeigen, daß sie im Wortstreit geübt seien, schließlich gegen den Geist streiten und über kurzem an ihrer Unvernunft zugrunde gehen werden. In der Tat, wenn jemand auch auf ihre jetzigen Fragen antworten wollte, so würden sie nichts desto weniger Böses ersinnen, bloß um zu suchen und nicht zu finden, oder um zu hören und nicht zu verstehen. Welches sind aber ihre sophistischen Fragen? Sie sagen: Wenn der Heilige Geist kein Geschöpf ist, so ist er also Sohn, und der Logos und er sind zwei Bruder. Dann fügen sie, wie du schreibst, sofort bei: Wenn der Geist vom Sohne nehmen wird und von ihm gegeben wird — denn so steht geschrieben —, so ist also der Vater Großvater und der Geist sein Enkel.</p><p>Wer soll sie, wenn er das hört, noch für Christen und nicht vielmehr für Heiden halten? Denn solche Dinge reden gegen uns die Heiden untereinander. Wer wird ihnen auf diesen Unsinn noch antworten wollen? Ich wenigstens habe viel nachgedacht und nach einer Antwort gesucht, die für sie passen könnte, habe aber keine gefunden als jene, die vordem die Pharisäer erhielten. Denn wie der Heiland an jene, als sie in böser Absicht Fragen stellten, eine Gegenfrage richtete, damit sie ihre eigene schlechte Gesinnung erkennen möchten, so sollen auch diese, da sie um solche Dinge fragen, uns selber Bescheid geben oder vielmehr auf Fragen antworten, die ihren Fragen gleichen. Da sie nämlich ihre Hirngespinste nicht gewahren, wenn sie reden, werden sie vielleicht ihren Unsinn erkennen, wenn sie davon hören. Wenn der Heilige Geist, wie früher gezeigt wurde, kein Geschöpf, sondern in Gott ist und aus Gott gegeben wird, so ist also auch er Sohn, und er und der Sohn sind zwei Brüder; und wenn der Geist dem Sohne eigen ist und alles vom Sohn empfängt, wie letzterer selbst sagte, und ihn den Jüngern gab, indem er sie anhauchte — denn das gebt auch ihr zu —, so ist also der Vater Großvater und der Geist sein Enkel? Denn was ihr fragt und von uns zu wissen begehrt, das fragt man mit Recht auch euch. Wenn ihr nun leugnet, was geschrieben steht, so könnt ihr nicht mehr Christen genannt werden, und es ist dann billig, daß ihr euch mit Fragen an uns Christen wendet. Wenn ihr aber dasselbe lest wie wir, so müssen wir euch darüber auch in der gleichen Weise fragen. Sagt also ohne Zaudern, ob der Geist Sohn und der Vater Großvater ist. Wenn ihr aber die Sache überlegt, wie es seiner Zeit die Pharisäer getan haben, mögt ihr euch selber sagen: Behaupten wir, daß er Sohn ist, so werden wir zu hören bekommen: Wo steht das geschrieben? Behaupten wir aber, er ist nicht Sohn, so müssen wir fürchten, daß man uns erwidert: Warum steht also geschrieben: „Wir haben nicht den Geist der Welt empfangen, sondern den Geist aus Gott„. Wenn ihr aber, mit euch selbst im Streite, sagt: Wir wissen es nicht, dann darf auch der, den ihr um solche Dinge fragt, schweigen und dem gehorchen, der da spricht: „Antworte dem Toren nicht auf seine Torheit, damit du ihm nicht gleich wirst, sondern antworte dem Toren seiner Torheit gemäß, damit er sich nicht selber weise dünkt“, Die Antwort, die für euch am besten paßt, ist Schweigen, damit ihr euere Unwissenheit erkennt.</p><p>Mit Recht darf man euch also nach dem, was ihr behauptet, in folgender Weise entgegenfragen. Da also die Propheten im Geiste Gottes reden und da durch Jesaias, wie im vorhergehenden gezeigt wurde, der Heilige Geist weissagt, so ist also der Geist Logos Gottes und es gibt zwei Logos, den Geist und den Sohn? Denn die Propheten weissagten dann, wenn das Wort Gottes (ὁ λόγος τοῦ θεοῦ) an sie erging. Und dazu kommt noch etwas. Da alles durch den Logos und ohne ihn nichts geworden ist, Gott durch die Weisheit die Erde gründete und alles mit Weisheit schuf, während, wie im vorhergehenden gezeigt ist, geschrieben steht: „Du wirst deinen Geist aussenden und sie werden geschaffen werden“, so ist also entweder der Geist der Logos, oder Gott hat alles durch zwei geschaffen, durch die Weisheit und durch den Geist? Und warum sagt dann Paulus: „Ein Gott, aus dem alles, und ein Herr, durch den alles ist”? Da ferner „der Sohn das Bild des unsichtbaren Vaters“, der Geist aber das Bild des Sohnes ist — es steht ja geschrieben: „Die er zuvor erwählt hat, hat er auch zur Gleichförmigkeit mit dem Bilde seines Sohnes vorherbestimmt” —, so ist also demnach der Vater Großvater? Und da der Sohn im Namen des Vaters gekommen ist, vom Heiligen Geiste aber der Sohn sagt: „Den der Vater in meinem Namen senden wird“, so ist also auch demzufolge der Vater Großvater? Was sagt ihr dazu, obwohl ihr doch über alles so leichtfertig redet? Was meint ihr bei euch selbst? Oder tadelt ihr vielleicht solche Fragen, wenn ihr euch in Verlegenheit seht? Allein, sprecht euch zuvor selbst das Urteil — denn ihr pflegt solche Fragen zu stellen —, und fügt euch den Schriften, und wenn ihr in Verlegenheit seid, was ihr sagen sollt, so laßt euch dann gesagt sein: Der Geist wird in den Schriften nicht Sohn, sondern Heiliger Geist und Geist Gottes genannt. Wie aber der Geist nicht Sohn genannt ist, so steht auch vom Sohn nicht geschrieben, daß er der Heilige Geist sei. Da nun der Geist nicht Sohn genannt wird und nicht Sohn ist, steht etwa deshalb der Glaube mit der Wahrheit in Widerspruch? Das sei ferne! Jeder der erwähnten Ausdrücke hat vielmehr seine eigene Bedeutung. Denn der Sohn ist die eigene Erzeugung des Wesens und der Natur des Vaters, und das besagt auch der Ausdruck. Und der Geist, der Geist Gottes genannt wird und in ihm ist, ist weder von der Natur des Sohnes noch von der Gottheit des Vaters verschieden. Denn deshalb ist in der Trinität, im Vater, im Sohne und ebenso im Heiligen Geiste eine Gottheit, und in der Trinität selbst ist eine Taufe und ein Glaube. Indem nämlich der Vater den Geist sendet, gibt ihn der Sohn durch Anhauchen den Jüngern, da „alles, was der Vater hat, des Sohnes ist”. Und indem das Wort (τοῦ λόγου γενομένου) an die Propheten erging, weissagten sie im Geiste, wie geschrieben steht und gezeigt wurde: „Durch das Wort des Herrn sind die Himmel befestigt, und durch den Geist seines Mundes all ihre Kraft".</p><p>So ist der Geist kein Geschöpf, sondern der Wesenheit des Logos eigen, eigen auch Gott und, wie gesagt, in ihm. Man darf ja nicht zögern, immer wieder dasselbe zu sagen. Wenn der Heilige Geist auch nicht Sohn genannt ist, so ist er doch nicht außer dem Sohne; er heißt ja Geist der Sohnschaft. Und da „Christus Gottes Kraft und Gottes Weisheit„ ist, so ist folgerichtig vom Geiste gesagt: „Er ist Geist der Weisheit und Geist der Kraft“. Denn indem wir des Geistes teilhaftig sind, haben wir den Sohn, und indem wir den Sohn haben, haben wir den Geist, der, wie Paulus gesagt hat, in unseren Herzen ruft: „Abba, Vater„. Wenn aber von ihm, weil er Geist Gottes ist, geschrieben steht, daß er auch in ihm sei, da „das Wesen Gottes niemand kennt als der Geist Gottes, der in ihm ist“, und wenn der Sohn sagte: „Ich bin im Vater und der Vater ist in mir„, warum haben dann beide nicht einen und denselben Namen, sondern der eine den Namen Sohn und der andere den Namen Geist? Wer so fragt, ist wohl von Sinnen, da er nach dem Unerforschlichen forscht und sich nicht an das Wort des Apostels kehrt: „Wer hat den Sinn des Herrn verstanden? Oder wer ist sein Ratgeber gewesen?“ Wer sollte es übrigens wagen, das, was Gott benannt hat, umzunennen? Dann möge er auch den Dingen der Schöpfung Namen geben. Da ja die Schöpfung auf einen Wink entstand, so mögen sie sagen, warum das eine Sonne, das andere Himmel, Erde, Meer und Luft ist. Wenn das aber diesen Toren unmöglich ist — denn jegliches bleibt, wie es geworden ist —, dann hat um so mehr das, was über der Schöpfung ist, ewigen Bestand und existiert auf keine andere Weise als so, daß der Vater Vater und nicht Großvater ist, der Sohn aber Sohn Gottes und nicht Vater des Geistes, und der Heilige Geist eben Heiliger Geist, aber nicht Enkel des Vaters oder Bruder des Sohnes ist.</p><p>Angesichts dieser Beweisgründe wäre wohl von Sinnen, wer fragen wollte: Ist also auch der Geist Sohn? Auch soll man ihn, weil es nicht so geschrieben steht, deshalb nicht aus seinem Verhältnis der Zugehörigkeit (zu Gott) herausheben, sondern, wie geschrieben steht, glauben und nicht sprechen: Warum ist das so und nicht so? Im Banne solcher Überlegungen könnte man leicht anfangen zu grübeln und zu sprechen: Wo ist also Gott, und wie ist er? Und schließlich müßte man das Wort hören: „Es spricht der Tor in seinem Herzen: es gibt keinen Gott„. Denn das, was durch den Glauben überliefert ist, bietet eine Erkenntnis, die kein vorwitziges Grübeln duldet. Als daher die Jünger das Wort hörten: „Taufet sie im Namen des Vaters und des Sohnes und des Heiligen Geistes“, da grübelten sie nicht vorwitzig, warum an zweiter Stelle der Sohn und an dritter der Geist, oder warum überhaupt eine Trinität genannt wird. Sie glaubten vielmehr wie sie hörten, und fragten nicht wie ihr: Ist also der Geist Sohn? Sie fragten auch nicht, weil der Herr den Geist nach dem Sohn nannte: Ist also der Vater Großvater? Denn sie hatten nicht vernommen: im Namen des Großvaters, sondern: im Namen des Vaters, und diesen Glauben verkündeten sie in richtigem Verständnis überall. Es ging ja auch nicht an, sich anders auszudrücken als der Heiland, der sich den Sohn, jenen aber den Heiligen Geist nannte. Es konnte auch nicht gestattet sein, ebensowenig in der Ordnung, in der sie aneinandergereiht sind, wie bezüglich des Vaters eine Änderung vorzunehmen; denn wie man von ihm nicht anders als vom Vater reden darf, ebenso ist es gottlos, zu fragen, ob der Sohn der Geist oder der Geist Sohn sei. Darum wurde Sabellius von der Kirche ausgeschlossen, weil er sich erdreistet hatte, dem Vater den Namen Sohn und dem Sohn den Namen des Vaters zu geben. Wird also nach alldem noch jemand sich erdreisten, wenn er von Sohn und Geist hört, zu sagen: Ist der Vater also Großvater, oder ist der Geist also Sohn? Ja, die Anhänger des Eunomius, Eudoxius und Eusebius werden es wagen. Denn da sie sich nun einmal in der Rolle der arianischen Ketzerei gefallen, werden sie ihre Zunge nicht mehr von der Gottlosigkeit zurückhalten. Wer hat ihnen denn das überliefert? Wer hat sie das gelehrt? Ganz gewiß niemand auf Grund der göttlichen Schriften; diese Torheit ging vielmehr aus dem Unrat ihres Herzens hervor.</p><p>Wenn ihr nämlich, weil der Geist, wie erwiesen, kein Geschöpf ist, fragt: Ist also der Geist Sohn? so bleibt euch, weil ihr wißt, daß der Sohn kein Geschöpf ist — durch ihn wurden ja die Geschöpfe geschaffen —, nur noch zu fragen übrig: Also ist der Sohn Vater? Oder auch in folgender Weise: Der Geist also ist der Sohn und der Sohn hinwiederum ist der Heilige Geist? Wenn sie indes solche Ansichten hegen, werden sie außerhalb der heiligen Trinität stehen und für Gottesleugner gehalten werden, weil sie den Namen des Vaters, des Sohnes und des Heiligen Geistes ändern und ihn nach eigenem Belieben in der gleichen Bedeutung wie beim menschlichen Ursprungsverhältnis gebrauchen, indem sie von Enkeln und Großvätern reden und sich die heidnische Theogonie neu erdichten. Aber nicht das ist der Glaube der Kirche, sondern, wie der Heiland sagte, der Glaube an den Vater, an den Sohn und den Heiligen Geist; an den Vater jedoch, der nicht Großvater, an den Sohn, der nicht Vater genannt werden kann, und an den Heiligen Geist, der nicht anders als so genannt wird. Über diesen Glauben darf man nicht abwechselnd auf verschiedene Weise reden; der Vater ist vielmehr immer Vater, der Sohn immer Sohn und der Heilige Geist immer Heiliger Geist und wird immer so genannt. Denn für menschliche Verhältnisse gilt das nicht, wenn auch die Arianer sich solches einbilden. Wie nämlich geschrieben steht: „Nicht wie ein Mensch ist Gott", so kann man auch sagen: Nicht wie Gott sind die Menschen. Bei den Menschen ist nämlich der Vater nicht immer Vater und der Sohn nicht immer Sohn; denn der erstere wird zwar Vater eines Lohnes, ist aber selbst eines anderen Sohn gewesen; auch der Sohn ist zwar Sohn eines Vaters, wird aber eines anderen Vater. Abraham z. B. war der Sohn Nachors und wurde der Vater Isaaks; und Isaak war der Sohn Abrahams und wurde der Vater Jakobs. Jeder nämlich wird zwar als Sohn geboren, weil er ein Teil des Erzeugers ist, wird aber auch selbst weder eines anderen Vater. Bei der Gottheit aber verhält es sich nicht so, da Gott nicht wie ein Mensch ist. Der Vater stammt nämlich nicht aus einem andern Vater; deshalb zeugt er auch keinen (Sohn), der eines andern Vater werden soll. Der Sohn aber ist auch nicht ein Teil des Vaters; daher ist er keine Zeugung, um wieder einen Sohn zu zeugen. Weil nun in der Gottheit allein der Vater im uneingeschränkten Sinn und einzig Vater ist, ist er, war er und wird er immer sein. Auch der Sohn ist im uneingeschränkten Sinn und einzig Sohn. Darauf beruht es auch, daß der Vater immer Vater und der Sohn immer Sohn ist und so genannt wird. Auch der Heilige Geist ist immer Heiliger Geist; und wir glauben, daß er Gott ist und vom Vater durch den Sohn gegeben wird. Denn so bleibt die heilige Trinität unveränderlich, in einer Gottheit erkannt. Wer demnach fragt: Ist also der Geist Sohn? der bildet sich ein, daß der Name geändert werden könne, und schafft sich selbst eine wahnwitzige Vorstellung. Und wer fragt: Ist also der Vater Großvater? Der erdichtet sich für den Vater einen Namen und irrt in seinem Herzen. Es ist demnach nicht unbedenklich, noch weiter auf die Unverschämtheit der Ketzer zu antworten; denn das heißt gegen die apostolische Weisung handeln; es ist vielmehr angezeigt, der Weisung des Apostels gemäß zu raten.</p><p>Das genügt zur Widerlegung eueres törichten Geredes. Spottet nicht mehr gegen die Gottheit. Art der Spötter ist es ja, nach dem zu fragen, was nicht geschrieben steht, und zu sagen: Ist also der Geist Sohn und der Vater Großvater? So witzeln die Männer in Cäsarea und in Skythopolis. Es genügt, wenn ihr glaubt, daß der Geist kein Geschöpf, sondern der Geist Gottes ist, und in letzterem die Trinität: Vater, Sohn und Heiliger Geist. Man darf weder dem Sohn den Namen des Vaters beilegen noch ist es gestattet, vom Geiste zu behaupten, er sei der Sohn, oder vom Sohne, er sei der Heilige Geist. Es ist vielmehr so, wie gesagt wurde; eine Gottheit ist in dieser Trinität; einen Glauben gibt es und eine Taufe, die in ihr gespendet wird, und eine Vollendung in Christus Jesus, unserm Herrn, durch den und mit dem dem Vater die Ehre und Macht sei mit dem Heiligen Geiste in alle Ewigkeit. Amen.</p><p>Wegen des Ausspruches im Evangelium aber, den du in deinem Brief erwähntest, wolle mir, mein Lieber, mit gutem Gewissen Nachsicht angedeihen lassen. Ich scheue mich nämlich, überhaupt daran zu gehen; denn es möchte mir, wenn ich mich mit meinem Geist in die Stelle vertiefe und zu forschen beginne, vielleicht nicht gelingen, den darin beschlossenen tiefen Sinn zu ergründen. Ich wünschte deshalb, darüber völlig zu schweigen und mich allein mit den früheren Briefen zu begnügen. Da ich aber vermute, du würdest doch nicht davon abstehen, abermals darüber zu schreiben, habe ich mir selbst Gewalt angetan, um meine bescheidene Kenntnis, die ich darüber besitze, niederzuschreiben. Zuversichtlich hoffe ich auch, du werdest unsere Darlegung, falls wir unseren Zweck erreichen, um dessen willen billigen, von dem sie kommt, uns aber, in der Erkenntnis unserer Bereitwilligkeit und unserer schwachen Kraft nicht tadeln. Es handelt sich also um die Stelle, da nach so vielen Wunderzeichen, die im Evangelium erwähnt sind, die Pharisäer sagten: „Dieser treibt die Dämonen nur mit Beelzebul aus, dem Gebieter der Dämonen. Der Herr aber kannte ihre Gedanken und sprach zu ihnen: Jedes Reich, das mit sich selbst in Zwiespalt kommt, wird verwüstet“. Und nachdem er gesagt hatte: „Wenn ich aber mit dem Geiste Gottes die Dämonen austreibe, dann ist doch wohl das Reich Gottes zu euch gekommen”, fügte er endlich bei: „Deshalb sage ich euch: Jede Sünde und Lästerung wird euch Menschen vergeben werden; die Lästerung gegen den Geist aber wird nicht vergeben werden. Und wer ein Wort gegen den Menschensohn sagt, dem wird vergeben werden; wer aber gegen den Heiligen Geist redet, dem wird nicht vergeben werden, weder in dieser Welt noch in der zukünftigen". Du fragst aber, warum denn die Lästerung gegen den Sohn vergeben wird, die Lästerung gegen den Heiligen Geist jedoch keine Vergebung findet, weder in dieser Welt noch in der zukünftigen.</p><p>Männer der Vergangenheit nun, der überaus gelehrte und emsige Origenes, sowie der bewunderungswürdige und wackere Theognostos, deren kleine Abhandlungen über diesen Gegenstand ich eben las, als du deinen Brief schriebst, schreiben beide darüber und sagen, die Lästerung gegen den Heiligen Geist sei dann gegeben, wenn jene, die in der Taufe der Gabe des Heiligen Geistes gewürdigt worden seien, wiederum in die Sünde zurückfielen. Denn darum, meinen sie, werden dieselben keine Verzeihung erhalten, wie auch Paulus in seinem Brief an die Hebräer sagt: „Denn es ist unmöglich, die, die einmal erleuchtet worden sind, die das himmlische Geschenk genossen, des Heiligen Geistes teilhaft geworden sind, das gute Wort Gottes und die Kräfte der zukünftigen Welt gekostet haben und dann doch abgefallen sind, wiederum zur Sinnesänderung zu erneuern". So äußern sich beide zumal, und jeder fügt seine eigene Ansicht bei.</p><p>Origenes äußert sich nämlich auch über den Grund für dieses Urteil gegen solche Leute in folgender Weise: „Gott und der Vater durchdringt alles und umfaßt alles, das Leblose und Belebte wie das Vernunftbegabte und das Unvernünftige. Die Macht des Sohnes dagegen erstreckt sich auf die vernunftbegabten Wesen (εἰς τὰ λογικά) allein, und zu diesen gehören Katechumenen und Heiden, die noch nicht zum Glauben gekommen sind. Der Heilige Geist aber wohnt nur in jenen, die ihn durch Erteilung der Taufe empfangen haben. Wenn also Katechumenen und Heiden sündigen, so sündigen sie zwar gegen den Sohn, da er, wie gesagt, in ihnen wohnt; gleichwohl können sie Vergebung erlangen, wenn sie der Gabe der Wiedergeburt gewürdigt werden. Wenn aber die Getauften sündigen, so ist dieser Frevel, wie er sich ausdrückt, gegen den Heiligen Geist gerichtet, weil ein solcher sündigt, während er dem Geiste zugehört. Und darum kann ihre Strafe nicht erlassen werden."</p><p>Theognostos äußert sich dazu desgleichen in folgender Weise. Wer die erste und zweite Grenze überschritten hat, mag eine geringere Strafe verdienen; wer aber auch die dritte nicht achtet, kann keine Verzeihung mehr erlangen. Mit der ersten und zweiten Grenze meint er aber die Unterweisung über den Vater und den Sohn, mit der dritten jedoch das bei der Heiligung und bei der Erlangung des Geistes überlieferte Wort. Und um das zu bekräftigen, führt er das Wort an, das der Herr zu den Jüngern sprach: „Noch vieles hätte ich euch zu sagen, aber ihr könnt es noch nicht fassen. Wenn aber der Heilige Geist kommt, wird er es euch lehren“. Dann sagt er: „Wie der Heiland zu jenen redet, die das Vollkommene noch nicht fassen können, indem er zu ihrer Niedrigkeit herabsteigt, mit den Vollendeten aber der Heilige Geist ist, ohne daß man deshalb sagen könnte, daß die Lehre des Geistes die Lehre des Sohnes übertreffe, sondern nur, daß der Sohn sich zu den Unvollendeten herablasse, der Geist aber das Siegel der Vollendeten sei, ebenso ist die Lästerung gegen den Geist nicht wegen der Erhabenheit des Geistes über den Sohn unnachlaßbar und unverzeihbar, sondern weil die Unvollendeten eben Verzeihung erlangen können, während für jene, die die himmlische Gabe gekostet haben und vollendet worden sind, kein Grund zur Verzeihung und keine Entschuldigung übrig bleibt.” So sagen also diese Männer.</p><p>Ich halte aber auf Grund meines Studiums dafür, daß die Ansicht beider einer bescheidenen Untersuchung und Erwägung bedarf, ob nicht in ihren Äußerungen irgendein tieferer Sinn verborgen liege. Denn es ist klar, daß der Sohn, weil er im Vater ist, auch in jenen ist, in denen der Vater ist, und daß der Geist nicht fern ist. Denn die heilige, selige und vollkommene Trinität ist unteilbar. Wenn ferner alles durch den Sohn geworden ist und in ihm alles besteht, wie könnte er außer dem sein, was durch ihn geworden ist? Wenn aber all das nicht fern von ihm ist, so ist er natürlich ebenfalls in allem, so daß derjenige, der gegen den Sohn sündigt und lästert, notwendig auch gegen den Vater und den Heiligen Geist sündigt. Wenn das heilige Bad nur im Namen des Heiligen Geistes gegeben würde, könnte man mit Recht sagen, daß die Getauften nur gegen den Heiligen Geist sündigen. Da es aber im Namen des Vaters, des Sohnes und des Heiligen Geistes gegeben und jeder Täufling in dieser Weise geheiligt wird, so begehen jene, die nach der Taufe sündigen, notwendig eine Lästerung gegen die heilige und untrennbare Trinität. Es dürfte auch billig sein, so zu denken und zu urteilen, Wenn jene, zu welchen der Herr sprach, nämlich die Pharisäer, das Bad der Wiedergeburt empfangen hätten und der Gabe des Heiligen Geistes bereits teilhaft geworden wären, dann wäre die Erklärung allerdings überzeugend, daß sie durch einen Rückfall auch gegen den Heiligen Geist gefehlt hätten. Da sie aber das Bad noch nicht empfangen hatten, vielmehr auch die Taufe des Johannes geringschätzten, wie konnte er sie dann beschuldigen, daß sie gegen den Heiligen Geist gelästert hätten, dessen sie noch nicht teilhaft geworden waren? Denn der Herr sagte das nicht, um lediglich zu belehren; er wollte die Strafe auch nicht für die Zukunft androhen; der Herr tat vielmehr diesen Ausspruch, um die Pharisäer wirklich für den gegenwärtigen Augenblick anzuschuldigen, daß sie sich bereits dieser Lästerung schuldig gemacht hätten. Da die Pharisäer in solcher Weise angeschuldigt wurden, noch bevor sie die Taufe empfangen hatten, kann sich dieser Ausspruch wohl nicht auf jene beziehen, die nach der Taufe sündigen, besonders auch, weil er sie nicht schlechthin wegen Sünden, sondern wegen Gotteslästerung beschuldigte. Der Unterschied besteht darin, daß derjenige, der sündigt, ein Gesetz übertritt, während derjenige, der lästert, gegen die Gottheit selbst frevelt. Als ihnen deshalb der Heiland früher viele Fehler vorhielt, daß sie das von Gott bezüglich der Eltern gegebene Gebot um des Geldes willen übertraten, daß sie sich der Predigt der Propheten gegenüber ablehnend verhielten und daß sie das Haus Gottes zu einem Kaufhaus machten, ermahnte er sie trotzdem zur Buße. Als sie aber sagten, daß er die Teufel durch Beelzebul austreibe, da nannte er das nicht mehr einfach eine Sünde, sondern eine Lästerung, so groß, daß die Strafe jener, die sich zu so etwas erdreisten, unnachlaßbar und unverzeihlich sei.</p><p>Gälte übrigens dieser Ausspruch jenen, die nach der Taufe sündigen, und wäre für diese die Sündenstrafe unnachlaßbar, wie kann dann der Apostel dem reumütigen Sünder in Korinth sogar die Liebe zusichern und die rückfälligen Galater wiedergebären, bis daß Christus abermals in ihnen Gestalt gewinne? Indem er sagt „abermals„, weist er auf ihre frühere Vollendung im Geiste hin. Warum tadeln wir auch den Novatus, der die Buße aufhebt und behauptet, daß jene, die nach der Taufe sündigen, keine Verzeihung erlangen, wenn dieser Ausspruch jenen gilt, die nach der Taufe sündigen? Auch die erwähnte Stelle im Brief an die Hebräer schließt nämlich die Buße der Sünder nicht aus, sondern zeigt nur, daß die Taufe der katholischen Kirche eine und nicht zweifach ist. Er schreibt ja an die Hebräer; und damit sie nicht der im Gesetze wurzelnden Gewohnheit entsprechend unter dem Vorwand der Buße glauben möchten, es gebe viele und tägliche Taufen, mahnt er sie deshalb zur Buße und erklärt, daß es nur eine Erneuerung durch die Taufe und keine zweite gebe, wie er auch in einem andern Briefe sagt: „Ein Glaube, eine Taufe“. Er sagt ja auch gar nicht, daß die Buße unmöglich sei, sondern daß es unmöglich sei, uns durch vorgebliche Buße zu erneuern. Das ist ein großer Unterschied. Denn der Büßer hört zwar auf zu sündigen, behält aber die Narben der Wunden; der Täufling dagegen zieht den alten Menschen aus und wird erneuert, von oben her geboren durch die Gnade des Geistes.</p><p>Wenn ich nun das bei mir überdenke, gewahre ich in dem Ausspruch einen viel tieferen Sinn. Deshalb habe ich auch zuvor viel zum Herrn gefleht, der am Brunnen saß und auf dem Meere wandelte; und nun wende ich mich wieder zur Heilsveranstaltung, die durch ihn für uns getroffen wurde; vielleicht daß ich aus ihr den Sinn der Schriftstelle erfasse. Nun verkündigt und predigt die ganze göttliche Schrift diese Heilsveranstaltung, besonders aber Johannes mit den Worten: “Der Logos ist Fleisch geworden und hat unter uns gewohnt”. Und Paulus schreibt: „Obwohl er in göttlicher Gestalt war, dachte er doch nicht daran, die Gottgleichheit als einen Raub an sich zu reißen, sondern entäußerte sich selbst und nahm Knechtsgestalt an, und ward an Haltung wie ein Mensch erfunden; er erniedrigte sich selbst und ward gehorsam bis zum Tode, ja bis zum Tod am Kreuze“. Denn deshalb, weil er Gott war und Mensch wurde, erweckte er als Gott Tote, heilte er alle durch sein Wort, verwandelte er Wasser in Wein; denn das waren nicht Werke eines Menschen. Da er aber einen Leib trug, dürstete er, ward er müde und litt er; denn das war nicht der Gottheit eigen. Als Gott sprach er: „Ich bin im Vater, und der Vater ist in mir”; insofern er aber einen Leib trug, wies er die Juden zurecht: „Was sucht ihr mich zu töten, einen Menschen, der euch die Wahrheit gesagt hat, die ich vom Vater gehört habe?“ Das geschah aber nicht getrennt je nach der Beschaffenheit der Handlungen, so daß die Werke des Körpers ohne die Gottheit, die Handlungen der Gottheit aber ohne den Körper in die Erscheinung getreten wären. Alles geschah in der Verbindung beider, und einer war der Herr, der es durch seine Gnade wunderbar wirkte. Denn er spuckte nach Menschenart aus, und doch war der Speichel göttlich; er machte ja durch denselben die Augen des Blindgeborenen wieder sehend. Und indem er sich als Gott zu erkennen geben wollte, brachte er es mit menschlicher Zunge zum Ausdruck und sagte: „Ich und der Vater sind eins”. Ebenso heilte er lediglich durch seinen Willen. Indem er seine menschliche Hand ausstreckte, richtete er die fieberkranke Schwiegermutter des Petrus auf und erweckte er die Tochter des Synagogenvorstehers, die bereits gestorben war, wieder von den Toten.</p><p>Die Häretiker verfielen demnach infolge ihrer eigenen Unwissenheit auf die tollsten Ansichten. Die einen sahen beim Heiland nur auf das Körperliche und leugneten das Wort: „Im Anfang war der Logos“; die andern aber schauten bloß auf das Göttliche und verstanden das Wort nicht: „Der Logos ist Fleisch geworden”. Der gläubige und apostolische Mann dagegen, der die Menschenliebe des Herrn kennt, sieht die Wunder der Gottheit und bewundert den Herrn im Leibe, schaut aber auch die Eigenschaften des Körpers und gerät in Staunen, weil er in denselben die Wirksamkeit der Gottheit bemerkt. Das ist der kirchliche Glaube. Daher sündigen zwar manche schwer, wenn sie, auf das Menschliche schauend, den Herrn dürsten, müde sein und leiden sehen und über ihn wie über einen Menschen faseln, können aber trotzdem durch schleunige Buße Verzeihung erlangen, da ihnen die Schwachheit des Leibes zur Entschuldigung dient. [Denn sie haben auch den Apostel für sich, der ihnen Verzeihung gewährt und ihnen gleichsam die Hand reicht, wenn er sagt: „Offenbar groß ist das Geheimnis der Gottseligkeit, Gott ist geoffenbart im Fleische".] Wenn hinwiederum manche, auf die Gottheit schauend, über die Natur des Leibes im Zweifel sind, so sündigen sie ebenfalls sehr schwer, weil sie den Herrn wohl essen und leiden sehen und ihn doch nur für ein Erzeugnis der Einbildungskraft halten; gleichwohl kann der Herr auch ihnen verzeihen, wenn sie schnell Buße tun, weil auch ihnen die Größe der übermenschlichen Werke zur Entschuldigung dienen kann. Nachdem aber jene, die Gesetzeskenntnis zu besitzen wähnten, wie es damals bei den Pharisäern war, die Unwissenheit und Blindheit beider übertrafen, und in wahnsinniger Verblendung den Logos im Fleische gänzlich geleugnet oder die Werke der Gottheit dem Teufel und seinen Dämonen zugeschrieben hatten, erhalten sie mit Recht für solche Gottlosigkeit eine unnachlaßbare Strafe. Denn sie hielten den Teufel für Gott und meinten, der wahrhaftige und wirkliche Gott besitze in seinen Werken keine größere Macht als die Dämonen.</p><p>In solche Gottlosigkeit verfielen also die damaligen Juden und unter den Juden die Pharisäer. Denn da der Herr offensichtlich die Werke des Vaters wirkte — er erweckte ja Tote, schenkte Blinden das Augenlicht, machte Lahme gehen, öffnete Tauben das Gehör, machte Stumme wieder reden, und zeigte, daß ihm die Schöpfung unterworfen sei, indem er den Winden gebot und sogar auf dem Meere wandelte —, gerieten die Volksmassen in Staunen und priesen Gott; die wunderlichen Pharisäer dagegen behaupteten, das seien Werke Beelzebuls, und die Toren scheuten sich nicht, die Macht Gottes auf den Teufel zu übertragen. Infolgedessen erklärte der Heiland mit gutem Grund, daß sie eine unverzeihliche und unvergebbare Lästerung aussprachen. Denn solange sie im Hinblick auf seine menschliche Natur in ihrem lahmen Verstande sagten: „Ist das nicht der Sohn des Zimmermanns?„, „wie kann der Gelehrsamkeit haben, obwohl er keinen Unterricht empfangen hat?“, „was tust du für ein Zeichen hinsichtlich deiner selbst?„, und „er steige jetzt vom Kreuze herab, und wir werden ihm glauben“, solange ertrug er sie und sagte, weil sie gegen den Menschensohn sündigten, voll Trauer über ihre Herzenshärte: „Wenn auch ihr erkennen möchtet, was zum Frieden dient!„ Auch dem großen Petrus, der der Türhüterin, als sie von einem Menschen redete, in der gleichen Art antwortete, verzieh ja der Herr auf seine Tränen hin. Als jedoch jene, nachdem sie bereits gefallen waren, abermals fielen und in ihrem Wahnwitz noch weiter gingen, so daß sie die Werke für Beelzebul in Anspruch nahmen, da ertrug er sie nicht länger; sie schmähten ja seinen Geist, indem sie behaupteten, der, der diese Werke vollbringe, sei nicht Gott, sondern Beelzebul. Deshalb belegte er sie wegen ihrer unerträglichen Dreistigkeit mit ewiger Strafe. Denn ihre Dreistigkeit bedeutete ebensoviel, als ob sie angesichts der Weltordnung und der in ihr waltenden Vorsehung gesagt hätten, daß auch die Schöpfung von Beelzebul stamme, daß die Sonne, dem Teufel gehorchend, ausgehe, und die Sterne auf seinen Wink am Himmel ihre Bahnen ziehen. Denn wie die Werke Gottes sind, so waren auch jene Werke des Vaters; und wenn jene Werke Beelzebuls sind, so sind notwendig auch diese Werke Beelzebuls. Und worauf beziehen sie dann das Schriftwort: “Im Anfang schuf Gott den Himmel und die Erde„? Und doch hat dieser ihr Wahnwitz eigentlich nichts Befremdendes. Denn auch ihre Väter, die der gleichen Gesinnung waren, bildeten sich in der Wüste alsbald nach ihrem Auszug aus Ägypten ein Kalb und schrieben ihm die Wohltaten zu, die sie von Gott empfangen hatten, indem sie sprachen: “Das sind deine Götter, o Israel, die dich aus Ägypten geführt haben.„ Jedenfalls wegen dieser Gotteslästerung wurden auch damals von jenen, die sich dazu erdreistet hatte, gleich anfangs nicht wenige, sondern viele getötet. Gott drohte auch mit den Worten: “An dem Tag, an dem ich sie heimsuche, werde ich ihre Sünde über sie bringen„. Denn solange sie im Verlangen nach Brot und Wasser murrten, solange ertrug er sie in gleicher Weise, wie eine Amme ihr Kind pflegt, als sie aber in ihrem Wahnwitz weiter gingen und, wie Ruhm mit dem Bilde eines Kalbes vertauschten, das Gras frißt“., und als sie so früh schon einer unverzeihlichen Dreistigkeit sich schuldig machten, wurden sie wie die Schrift sagt, wegen der Anfertigung des Kalbes, das Aaron gemacht hatte, gezüchtigt.</p><p>Zu solchem haben sich nun auch die Pharisäer erdreistet und haben deshalb die gleiche Verwerfung durch den Herrn erfahren, die für Beelzebul, auf den ihre Vermutung ging, bereits galt und noch gilt; daher werden sie zugleich mit ihm in dem Feuer verzehrt, das ihm von Ewigkeit bereitet ist. Der Herr tat ja diesen Ausspruch nicht, um zwischen seiner und des Heiligen Geistes Lästerung einen Vergleich anzustellen, als ob der Geist größer wäre als er und deshalb die Lästerung des Geistes ein schwereres Vergehen wäre. Das sei ferne! Denn er hatte ja früher gelehrt, daß alles, was der Vater hat, des Sohnes sei, daß der Geist vom Sohne nehmen und den Sohn verherrlichen werde. Auch gibt nicht der Geist den Sohn, vielmehr spendet der Sohn den Geist den Jüngern und durch sie allen, die an ihn glauben. in diesem Sinn äußerte sich also der Heiland nicht; er brachte vielmehr dadurch zum Ausdruck, daß die Lästerung beider gegen ihn selbst gerichtet, und daß die eine geringer, die andere aber größer sei. Die Pharisäer machten sich ja beider Lästerungen schuldig. Als sie den Menschen sahen, schmähten sie ihn: „Woher hat dieser solche Weisheit“. und „du bist noch nicht fünfzig Jahre alt und willst Abraham gesehen haben“? Und als sie die Werke des Vaters sahen, leugneten sie im Widerspruch gegen dieselbe sogar, daß in ihm Beelzebul sei, und daß es dessen Werke seien. Weil beide Lästerungen gegen ihn gerichtet waren, und die eine, gegen die Gottheit, größer war, deshalb sagte er von der größeren, daß die auf sie gesetzte Strafe unnachlaßbar sei. Ja, als er den Jüngern Mut zusprach mit den Worten: „Wenn sie den Hausherrn Beelzebul geheißen haben …“ hat er sich selbst als den Hausherrn bezeichnet, der von den Juden so getröstet wurde.</p><p>Wenn aber die Juden mit ihrer Bemerkung “durch Beelzebul” niemand andern als den Herrn lästerten, dann ist es also klar, daß die Worte “die Lästerung gegen den Geist” sich auf den Herrn selbst beziehen, und daß der Heiland mit dem ganzen Ausspruch sich selbst gemeint hat. Er ist ja der Hausherr des Weltalls; denn zum sichern Verständnis muß man das gleiche unbedenklich wiederholen. Dürsten, sich abmühen, schlafen, geschlagen werden, essen, ist den Menschen eigen; die Werke aber zu vollbringen, die der Herr vollbrachte, stand nicht mehr in der Macht der Menschen, sondern in der Macht Gottes. Wenn nun manche, wie ich vorher sagte, im Hinblick darauf den Herrn als Menschen lästerten, verdienen sie wohl eine geringere Strafe als jene, die die Werke Gottes dem Teufel zuschreiben. Denn solche werfen nicht bloß das Heilige den Hunden vor, sondern vergleichen sogar Gott mit dem Teufel, und nennen das Licht Finsternis. Daß also hierin die unverzeihliche Lästerung der Pharisäer bestehe, hat Markus bemerkt, wenn er sagt: “Wer aber gegen den Heiligen Geist lästert, erhält keine Vergebung, sondern ist ewiger Sünde schuldig; sie sagten nämlich, er habe einen unreinen Geist”. Und der Blindgeborene bezeugte, als er sehend geworden war: „Seit die Welt steht, hat man es nicht gehört, daß jemand einem Blindgeborenen die Augen öffnete; wäre der nicht von Gott, so vermöchte er nichts zu tun“. Die Volksscharen aber sagten, voll Verwunderung über das, was durch den Herrn geschah: „Das sind nicht Worte eines Besessenen; kann etwa ein Dämon Blinden die Augen öffnen?” Die Pharisäer dagegen, die als gesetzeskundig galten, die Säume ausbreiteten und prahlten, als ob sie mehr wüßten denn die übrigen, schämten sich nicht einmal bei dieser Gelegenheit; sie opferten vielmehr nach dem Schriftwort dem Teufel und nicht Gott, die Unglücklichen, die behaupteten, der Herr habe einen Dämon, und die Werke Gottes seien Werke der Teufel. Dazu ließen sie sich nur aus dem Grund bestimmen, um zu leugnen, daß der, der diese Werke vollbrachte, Gott und der Sohn Gottes sei. Denn wenn Essen und körperliche Erscheinung zeigte, daß er auch Mensch sei, warum erkannten sie aus seinen Werken nicht, daß er im Vater und der Vater in ihm ist? Doch sie wollten eben nicht. Sie hatten vielmehr selbst den Beelzebul, der in ihnen redete, so daß sie auf Grund der menschlichen Eigenschaften den Herrn einen Menschen nannten, auf Grund der Werke aber, die Gott eigen waren, ihn nicht mehr als Gott bekannten, sondern statt seiner den Beelzebul, der in ihnen wohnte, zum Gott machten, um schließlich mit diesem ewig im Feuer gestraft zu werden.</p><p>Auch die Erwägung der Schriftstelle selbst scheint mir eine solche Andeutung zu bieten und zu zeigen, daß beide Lästerungen auf ihn gehen, und daß er mit Bezug auf sich selbst die Bezeichnungen „Menschensohn" und „Geist" gebrauchte, um durch den einen Ausdruck seine Leiblichkeit erkennen zu lassen, durch „Geist" aber seine geistige, erkennende und ganz wahrhaftige Gottheit zu offenbaren. Denn das, wofür man Verzeihung erlangen kann, bezog er auf den Menschensohn, um seine Leiblichkeit anzudeuten; von der unverzeihlichen Lästerung aber zeigte er, daß sie gegen den Geist gerichtet sei, um durch diese Erwähnung des Gegensatzes zum Körperlichen seine Gottheit zu offenbaren. Diese Eigentümlichkeit habe ich auch im Evangelium nach Johannes bemerkt, wenn der Herr vom Genuß seines Leibes redet, und, da er sieht, wie sich viele daran stoßen, sagt: „Das ist euch anstößig? Wenn ihr nun den Menschensohn dahin aufsteigen seht, wo er vordem war? Der Geist ist es, der lebendig macht, das Fleisch nützt nichts. Die Worte, die ich zu euch geredet habe, sind Geist und Leben“. Denn auch hier sagte er beides von sich aus, Fleisch und Geist; er unterschied den Geist vom Fleischlichen, damit sie nicht bloß an seine sichtbare Erscheinung, sondern auch an sein unsichtbares Wesen glaubten und einsehen sollten, daß auch das, was er sagte, nicht fleischlich, sondern geistig sei. Denn wie vielen würde der Leib zur Speise genügen, damit er Nahrung für die ganze Welt würde? Allein deshalb erwähnte er die Auffahrt des Menschensohnes zum Himmel, um sie vom Gedanken an den Leib abzuziehen und sie schließlich zur Erkenntnis zu führen, daß das Fleisch, von dem er redete, als himmlische Speise von oben her und als geistige Nahrung von ihm gegeben werde. Denn er sagte: „Was ich zu euch geredet habe, ist Geist und Leben”; das heißt soviel, als wenn er sagte: Was für das Heil der Welt geoffenbart und gegeben wird, ist das Fleisch, das ich trage; dieses aber und sein Blut wird euch von mir geistigerweise als Speise gegeben werden, dazu bestimmt, einem jeden geistigerweise gereicht und allen ein Bewahrungsmittel für die Auferstehung zum ewigen Leben zu werden. So hat der Herr auch die Samariterin vom Sinnlichen abziehen wollen, wenn er sagte, Gott sei ein Geist; sie sollte sich von Gott fürderhin nicht mehr eine körperliche, sondern eine geistige Vorstellung bilden. So hat auch der Prophet, da er die Menschwerdung des Logos schaute, gesagt: “Der Geist unseres Angesichts, Christus der Herr”; damit man nicht aus der äußeren Erscheinung schließe, der Herr sei ein bloßer Mensch, sondern durch den Klang des Wortes „Geist" erkenne, daß der, der im Leibe ist, Gott sei.</p><p>Ein Zweifaches ist also klar: wer den Herrn von sich reden sieht, aber nur auf seine Leiblichkeit schaut, und ungläubig spricht: „Woher hat dieser seine Weisheit“, sündigt und lästert den Herrn als Menschensohn; wer jedoch seine Werke sieht, die durch den Heiligen Geist vollbracht werden, und behauptet, derjenige, der solches vollbringe, sei nicht Gott und Gottes Sohn, und wer diese Werke sogar dem Beelzebul zuschreibt, der lästert offenbar, weil er die Gottheit des Herrn leugnet. Denn auch an der Stelle im Evangelium deutet er, wie schon oft bemerkt wurde, mit dem Ausdruck „Menschensohn” seine fleischliche und leibliche Natur an, um durch den Ausdruck „Geist" zu offenbaren, daß der Heilige Geist, durch den er alles wirkte, sein sei. Deshalb sagte er, da er seine Werke vollbrachte: „Wenn ihr mir nicht glauben wollt, so glaubet meinen Werken, damit ihr erkennt, daß ich im Vater bin und der Vater in mir ist“. Als er ferner im Begriffe war, sich selbst für uns dem Leibe nach hinzuopfern, und deshalb nach Jerusalem hinaufging, sprach er zu seinen Jüngern: „Schlafet und ruhet weiter; sieh, die Stunde ist nahe, und der Menschensohn wird in Sünderhände überliefert”. Seine Wunder bewirkten nämlich, daß man an ihn als wahren Gott glaubte, sein Tod aber zeigte, daß er wirklich einen Leib hatte. Deshalb bezeichnete er den, der ausgeliefert werden sollte, mit Recht als Menschensohn; denn der Logos ist unsterblich, unberührbar und das Leben selbst. Aber die Pharisäer glaubten nicht daran und wollten auch die Werke ihrer Leute (υἱοί) nicht sehen. Deshalb tadelt sie der Herr abermals in sanfter Weise mit den Worten: „Wenn ich aber die Teufel mit Beelzebul austreibe, mit wessen Hilfe treiben eure Leute sie aus? Deshalb mögen sie eure Richter sein. Treibe ich aber mit dem Geiste Gottes die Teufel aus, dann ist doch wohl das Reich Gottes zu euch gekommen“. Dabei sagte er aber „mit dem Geiste”, nicht als ob er etwa geringer wäre als der Geist, noch auch, als ob der Geist durch ihn die Werke wirkte, sondern um abermals zu offenbaren, daß er, der Logos Gottes, selbst durch den Geist alles wirke, und um die Zuhörer zu belehren, daß sie, falls sie die Werke des Geistes dem Beelzebul zuschreiben, den lästern, der den Geist spendet. Auch durch diese Äußerung gab er nämlich zu verstehen, daß sie sich nicht aus Unwissenheit, sondern aus freien Stücken dieser Lästerung schuldig machen, die sie in eine Strafe stürzt, der man nicht entrinnen kann, und daß sich die Toren nicht schämen, solche Werke, die sie als Gottes Werke erkennen, dem Beelzebul zuzuschreiben, und zu behaupten, sie würden durch einen unreinen Geist vollbracht.</p><p>Wie können also Leute, die solches wagen, den Heiden es noch zum Vorwurf machen, daß sie sich Götzenbilder fertigen und dieselben Götter nennen? Denn ihr Vorgehen gleicht dem Wahnwitz jener, oder vielleicht ist ihr Unterfangen noch ein schwereres Vergehen, weil sie darüber ein Gesetz erhalten hatten und trotzdem durch die Übertretung des Gesetzes Gott mißachteten. Was werden aber solche Lästerer tun, wenn sie den Propheten Jesaias lesen und vernehmen, es seien Zeichen der Ankunft des Gesalbten, daß Blinde sehen, Lahme gehen, Stumme reden, Tote auferstehen, Aussätzige geheilt und Tauben die Ohren geöffnet werden? Wen wollen sie denn als Urheber dieser Zeichen betrachten? Wenn sie nämlich Gott dafür halten, so werden sie sich selbst der Gottlosigkeit gegen den Herrn überführen; denn was der Prophet voraussehend verkündet hat, das hat der Herr bei seiner Anwesenheit getan. Wenn sie sich aber in ihrer Keckheit zur dreisten Behauptung fortreißen lassen, daß auch jene Werke durch Beelzebul vollbracht wurden, so fürchte ich, daß sie in ihrer gottlosen Gesinnung bald weiter gehen, und, wenn sie lesen: „Wer hat dem Menschen den Mund gegeben, und wer macht stumm und taub, sehend und blind, und ähnliche Stellen, in ihrem Wahnwitz wieder sagen, auch das seien Äußerungen über Beelzebul. Denn wem sie die Spendung des Augenlichtes zuschreiben, dem müssen sie auch die Verursachung der Blindheit zuschreiben. Die Schriftstelle besagt ja, daß beides derselbe wirke. Jene, die das behaupten, werden aber gewiß noch auf den Gedanken kommen, daß Beelzebul der Schöpfer der menschlichen Natur sei; denn für den Schöpfer ist es charakteristisch, Macht über die gewordenen Dinge zu besitzen. Moses schon hat ja gesagt: „Im Anfang schuf Gott den Himmel und die Erde“, und „nach dem Bilde Gottes schuf Gott den Menschen”. Auch Daniel spricht ganz freimütig zu Darius: „Ich verehre keine Götzen, die von Menschenhand gemacht sind, sondern den lebendigen Gott, der den Himmel und die Erde geschaffen hat und Macht über alles Fleisch besitzt". Sie müßten nur abermals ihre Ansicht ändern und behaupten, Blindheit und Lähmung und die anderen Gebrechen kämen als Strafen vom Schöpfer, die Befreiung davon aber und alle Wohltaten an den Leidenden wirke Beelzebul. Aber das auch nur zu untersuchen, ist zu einfältig; denn nur wahnsinnige und gänzlich verrückte Leute sind zu solch gottlosem Geschwätz fähig, weil die Toren bei diesem Vergleich das Bessere nicht Gott, sondern dem Beelzebul zuschreiben. Diesen Leuten macht es ja kein Bedenken, die Lehren der göttlichen Schriften zu entstellen, um nur die Ankunft Christi leugnen zu können.</p><p>Die Nichtswürdigen hätten jedoch den Herrn entweder wegen seiner körperlichen Erscheinung nicht gering schätzen dürfen oder ihn offenbar auf Grund seiner Werke als wahren Gott bekennen sollen. Sie handelten aber völlig verkehrt. Da sie einen Menschen sahen, schmähten sie ihn als Menschen; da sie aber göttliche Werke sahen, leugneten sie seine Gottheit und nahmen ihre Zuflucht zum Teufel, in der Meinung, sie könnten durch diese Dreistigkeit dem Gerichte des von ihnen geschmähten Logos entrinnen. Die Beschwörer, Magier und Zauberer des Pharao gaben nach vielen Versuchen und nachdem sie die Zeichen gesehen, die durch Moses geschahen, schließlich doch nach und wandten den Rücken mit der Bemerkung, es sei der Finger Gottes, der das tue. Die Pharisäer und die Schriftgelehrten aber, die die ganze Hand Gottes wirken sahen und gewahrten, wie durch den Heiland noch mehr und Größeres geschah, behaupteten, daß das Beelzebul vollbringe, von dem doch selbst die Magier, obwohl er ihnen eigen war, bekannten, daß er nicht einmal die Werke vollbringen könne, die geringer waren als die Werke des Herrn. Was könnte man nun sagen, um den Wahnwitz dieser Leute noch zu überbieten? Oder wer wird, wie der Prophet sagte, etwas mit der Gottlosigkeit dieser Leute vergleichen können? Denn im Vergleich zu sich lassen sie sogar die Sodomiter gerecht erscheinen; sie haben die Unwissenheit der Heiden übertroffen, sie überbieten sogar die Magier des Pharao an Bosheit; sie können einzig mit den Ariomaniten verglichen werden, weil sie miteinander der gleichen Gottlosigkeit verfallen sind. Denn die Juden schrieben die Werke des Vaters durch den Sohn, als sie dieselben sahen, dem Beelzebul zu; die Arianer aber zählen, wenn sie dieselben Werke sehen, den Herrn, der sie vollbringt, zu den Geschöpfen und behaupten, er sei aus nichts entstanden; er sei nicht gewesen, ehe er geschaffen wurde. Die Pharisäer murrten, da sie den Herrn im Leibe sahen, und sprachen: „Warum machst du, ein Mensch, dich zu Gott?" Die Feinde Christi aber lästern, wenn sie ihn leiden und schlafen sehen, und sagen: Wer dem unterworfen ist, kann nicht wahrer Gott und dem Vater wesensgleich sein. Will übrigens jemand beide Irrtümer vergleichen und untersuchen, so wird er, wie ich oben sagte, finden, daß sie miteinander in das Tal der bittern Torheit gestürzt sind.</p><p>Daher werden weder jene noch diese Nachlaß der auf solche Vergehen gesetzten Strafe erlangen. Das hat der Herr mit den Worten erklärt: „Wer aber gegen den Heiligen Geist lästert, dem wird nicht vergeben werden, weder in dieser Welt noch in der zukunftigen“. Und ganz mit Recht; denn wen soll der, der den Sohn verleugnet, anflehen, um Verzeihung erlangen zu können? Oder welches Leben oder welche Ruhe darf der erwarten, der den verworfen hat, der spricht: „Ich bin das Leben”, und „kommt alle zu mir, die ihr mühselig und beladen seid, ich will euch erquicken“? Werden aber diese in solcher Weise gestraft, dann werden offenbar jene, die Christus fromm verehren, die ihn dem Fleische wie dem Geiste nach anbeten, die ihn als Sohn Gottes anerkennen und nicht leugnen, daß er Menschensohn geworden ist, sondern glauben, daß der Logos im Anfang war und daß der Logos Fleisch geworden ist, ewig im Himmel herrschen, wie es unser Herr und Heiland Jesus Christus selbst verheißen hat mit den Worten: „Jene werden eingehen zur ewigen Pein, die Gerechten aber zum ewigen Leben”. Das schreibe ich dir, wie ich es verstehe, kurz und bündig. Du aber nimm es von mir nicht als vollkommene Unterweisung entgegen, sondern lediglich als ein Hilfsmittel. Dir bleibe es noch anheimgestellt, den genaueren Sinn aus dem Ausspruch des Evangeliums und aus den Psalmen zu schöpfen und die Garben der Wahrheit zu binden, damit man auch zu dir, wenn du sie trägst, sage: „Sie kehren unter Jubel heim, ihre Garben tragend", in Christus Jesus unserm Herrn, durch den und mit dem dem Vater zugleich mit dem Heiligen Geiste Ehre sei und Kraft in alle Ewigkeit. Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung von Übersetzung der BKV-Ausgabe, <em>Vier Briefe an Serapion von Thmuis</em> (BKV 1. Reihe, Bd. 13, Kempten/München 1913). Text nach <a href="https://bkv.unifr.ch/de/works/cpg-2094/versions/vier-briefe-an-serapion-v-thmuis-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "tm9D_Защитительное_слово_против_ариан"
