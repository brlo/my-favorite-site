    body: |-
      <p><em>Leben des heiligen Antonius, übersetzt von Anton Stegmann und Hans Mertel (Bibliothek der Kirchenväter, 1. Reihe, Bd. 31, München 1917).</em></p><h2>1</h2><p>Antonius war ein Ägypter und stammte von edlen Eltern ab, die ein auskömmliches Vermögen besaßen; da sie selbst Christen waren, wurde auch er christlich erzogen. Als Kind wuchs er bei den Eltern auf und kannte nichts anderes als sie und das elterliche Haus. Als er aber zum Knaben heranwuchs und in ein reiferes Alter kam, da wollte er vom Unterricht im Lesen und Schreiben nichts wissen; denn er wünschte sich fernzuhalten vom Verkehr mit den anderen Kindern. Seine ganze Sehnsucht war darauf gerichtet, wie von Jakob geschrieben steht, daß er in Einfalt wohne in seinem Hause. Er besuchte jedoch mit seinen Eltern die Kirche; dabei aber war er nicht, wie Kinder pflegen, ausgelassen oder ein Verächter, wie das bei Erwachsenen der Fall ist. Nein, er war gehorsam den Eltern und merkte auf die Lesungen, um ihren Nutzen in sich zu bewahren. Er, der als Kind in mäßigen Verhältnissen lebte, fiel seinen Eltern auch nicht lästig wegen einer mannigfaltigen und reichlichen Kost; er suchte darin gar keine Ergötzung, sondern ließ sich an dem genügen, was er vorfand, und verlangte nichts weiter.</p>
      <h2>2</h2><p>Nach dem Tode der Eltern hinterblieb er allein mit einer einzigen, ganz kleinen Schwester; er war damals etwa achtzehn oder zwanzig Jahre alt und übernahm selbst die Sorge für das Haus und die Schwester. Es waren noch keine sechs Monate seit dem Tode seiner Eltern vergangen, da ging er nach seiner Gewohnheit zur Kirche; er hielt Einkehr in sich und überlegte, als er so auf und ab ging, wie die Apostel alles verließen und dem Heiland nachfolgten; wie die Gläubigen in der Apostelgeschichte ihren Besitz verkauften, den Erlös brachten und zu den Füssen der Apostel niederlegten, zur Verteilung an die, welche Not litten, und welch schöne Hoffnung ihnen im Himmel bereitet sei. In solchen Gedanken betrat er das Gotteshaus, und es fügte sich, daß gerade das Evangelium vorgelesen wurde, und er hörte, wie der Herr zum Reichen sprach: “Wenn du vollkommen werden willst, wohlan, verkaufe all deine Habe, gib den Erlös den Armen, komm und folge mir nach, und du wirst einen Schatz im Himmel haben.” Dem Antonius aber war es, wie wenn ihm von Gott die Erinnerung an diese Heiligen geworden sei und als ob um seinetwillen jene Lesung der Schriftstelle geschehen; er ging sogleich aus der Kirche und schenkte seine Besitzungen, die er von den Vorfahren hatte, den Einwohnern des heimatlichen Ortes - es waren dreihundert Hufen, fruchtbar und sehr schön; denn er wollte nicht, daß sie auch nur im geringsten ihm und seiner Schwester lästig fielen. Seine gesamte übrige bewegliche Habe verkaufte er und brachte so ein schönes Stück Geld zusammen; dies gab er den Armen und legte nur eine geringe Summe mit Rücksicht auf seine Schwester beiseite.</p>
      <h2>3</h2><p>Wieder besuchte er die Kirche und hörte im Evangelium den Herrn sprechen: “Sorget euch nicht um das Morgen”; da brachte er es nicht über sich, länger zu warten, sondern er ging hinaus und gab auch den Rest den Bedürftigen. Die Schwester vertraute er bekannten, zuverlässigen Jungfrauen an und brachte sie in einem Jungfrauenhaus zur Erziehung unter; er selbst widmete sich von nun an vor seinem Hause der Askese, hatte acht auf sich und hielt sich strenge. Denn es gab damals in Ägypten noch nicht so zahlreiche Klöster, und von der großen Wüste wußte der Mönch überhaupt nichts; jeder, der an seiner Vervollkommnung arbeiten wollte, übte sich darin nicht weit von seinem Heimatsorte, und zwar allein. Nun lebte damals in dem nahen Bezirke ein alter Mann, der von Jugend auf ein Einsiedlerleben führte. Diesen sah Antonius und eiferte ihm im Guten nach; damals fing er auch zuerst an, sich in der Umgebung des Dorfes aufzuhalten. Von hier wanderte er, wenn er von einem trefflichen Manne hörte, zu diesem, suchte ihn auf wie eine kluge Biene, kehrte nicht eher an seinen Wohnsitz zurück, bis er ihn gesehen hatte und ging erst heim, nachdem er von ihm gleichsam eine Wegzehrung erhalten für seinen eigenen Pfad zur Tugend. Die Anfänge verlebte er hier und festigte seine Gesinnung, um nicht zu seinem elterlichen Besitz zurückzukehren, noch sich seiner Verwandten zu erinnern. Seine ganze Sehnsucht aber und seinen ganzen Eifer richtete er auf die Anspannung in der Askese. Dabei beschäftigte er sich mit Handarbeit, da er gehört hatte: “Wer nicht arbeitet, soll auch nicht essen”; einen Teil des Lohnes verbrauchte er für Brot, den anderen verwandte er für die Armen. Er betete beständig, da er gelernt hatte, daß man für sich allein unaufhörlich beten müsse. Bei der Vorlesung der Schrift war er so aufmerksam, daß ihm kein Wort entfiel; vielmehr behielt er alles bei sich, und sein Gedächtnis ersetzte ihm so die Bücher.</p>
      <h2>4</h2><p>So lebte Antonius, und alle liebten ihn. Er selbst aber unterwarf sich gerne den eifrigen Männern, die er besuchte, und suchte für sich von jedem einen Vorteil im Tugendeifer und in der Askese zu lernen. Bei dem einen beobachtete er die Freundlichkeit, bei dem anderen den Gebetseifer; an diesem sah er seine Ruhe, an jenem Menschlichkeit; bei dem einen merkte er auf das Wachen, bei dem anderen auf die Wißbegierde; den bewunderte er wegen seiner Standhaftigkeit, jenen wegen des Fastens und des Schlafens auf bloßer Erde; an dem einen beobachtete er die Sanftmut, an dem anderen seine Hochherzigkeit; an allen zusammen aber fiel ihm auf die fromme Verehrung für Christus und ihre wechselseitige Liebe; erfüllt von all diesem kehrte er an seinen eigenen Asketensitz zurück. Was er von einem jeden erhalten hatte, vereinigte er dann in sich und strebte danach, in sich die Tugenden aller darzustellen. Übrigens war er gegenüber seinen Altersgenossen nicht streitsüchtig, nur wollte er im Besseren nicht als der zweite nach ihnen erscheinen; dies aber erreichte er so, daß er keinen kränkte, sondern daß sie sogar an ihm ihre Freude hatten. Alle die Dorfbewohner und überhaupt die Rechtlichen, mit denen er verkehrte, nannten ihn, wie sie ihn so sahen, einen Liebling Gottes; die einen liebten ihn wie einen Sohn, andere aber wie einen Bruder.</p>
      <h2>5</h2><p>Der Teufel aber, voll Haß und Neid gegen das Gute, konnte es nicht ertragen, einen so standhaften Vorsatz in einem so jungen Menschen zu sehen. Was er schon früher ausgeführt hatte, das versuchte er auch gegen diesen. Zuerst machte er sich daran, ihn von der Askese abspenstig zu machen, indem er die Erinnerung an seinen Besitz in ihm wachrief, die Sorge für seine Schwester, den Verkehr mit seiner Verwandtschaft, Geldgier und Ehrgeiz, die mannigfache Lust des Gaumens und all die anderen Freuden des Lebens, indem er ihm endlich vorstellte, wie rauh die Tugendübung sei und wie groß die Anstrengung dabei; er wies ihn hin auf die Schwachheit des Leibes und die Länge der Zeit. Mit einem Worte, er erregte einen gewaltigen Sturm von Gedanken in seinem Innern, da er ihn von seinem guten Vorsatz abbringen wollte. Als aber der böse Feind seine Schwäche gegenüber dem festen Entschluß des Antonius sah, ja als er merkte, wie er niedergerungen wurde durch seine Festigkeit, zur Flucht gezwungen durch seinen starken Glauben und niedergeworfen durch sein beständiges Gebet, da setzte er sein Vertrauen auf die Waffen “am Nabel seines Bauches”, und voll Stolz darauf - denn es sind seine ersten Fallstricke für Jünglinge -, stürmte er heran gegen ihn, den Jüngling; er bedrängte ihn nachts und setzte ihm am Tage so zu, daß auch die, welche den Antonius sahen, den Zweikampf zwischen ihm und dem Teufel bemerkten. Der Teufel gab ihm schmutzige Gedanken ein, Antonius verscheuchte sie durch sein Gebet; jener stachelte ihn an, er aber, gleichsam errötend, schirmte seinen Leib durch den Glauben, durch Gebet und Fasten. Der arme Teufel ließ sich sogar herbei, ihm nachts als Weib zu erscheinen und alles mögliche nachzumachen, nur um den Antonius zu verführen. Dieser aber dachte an Christus und den durch ihn erlangten Adel der Seele, an ihre geistige Art, und erstickte die glühende Kohle seines Wahnes. Dann wieder stellte ihm der böse Feind die Annehmlichkeit der Lust vor, er aber, voll Zorn und Schmerz, erwog bei sich die Drohung des ewigen Feuers und die Plage des Wurmes; dies hielt er ihm entgegen und ging aus den Versuchungen unversehrt hervor. So lief das alles zur Schande für den schlimmen Feind ab. Denn er, der sich vermessen hatte, Gott gleich zu werden, wurde nun zum Spott durch einen jungen Mann, und er, der voll Prahlerei Fleisch und Blut verachtete, wurde überwunden von einem Menschen, der im Fleische lebte. Denn diesem half der Herr, der für uns Fleisch geworden ist und der dem Leibe den Sieg gegen den Teufel gegeben, so daß jeder, der in Wahrheit kämpft, sagen kann: “Nicht ich, sondern die Gnade Gottes mit mir”.</p>
      <h2>6</h2><p>Als nun endlich der Drache den Antonius auch hierin nicht niederringen konnte, sondern sehen mußte, wie er ausgestoßen ward aus seinem Herzen, da knirschte er mit den Zähnen, wie geschrieben steht, und, wie von Sinnen, stellte er sich ihm, wie er in seiner ganzen Artung ist, auch in der äußeren Erscheinung dar, nämlich als ein schwarzer Knabe. Als ob er sich unterwerfen wollte, griff er ihn nicht mehr durch Gedanken an - denn er war verscheucht worden, der Listige -, sondern sagte mit menschlicher Stimme: “Viele habe ich verführt und die meisten überwunden. Jetzt aber, als ich, wie gegen so viele, auch gegen dich und deine Anstrengungen losging, bin ich schwach geworden.” Da fragte Antonius: “Wer bist denn du, der so zu mir spricht?” Und jener rief mit jammernder Stimme: “Ich bin ein Freund der Unzucht; ich habe als meine Aufgabe übernommen die Verlockungen zu ihr und ihre Reizmittel zum Schaden der Jünglinge, und Geist der Unzucht ist mein Name. Wie viele, die tugendhaft leben wollten, habe ich getäuscht, wie viele, die enthaltsam waren, habe ich durch meine Lockung betört! Ich bin der, um dessentwillen auch der Prophet die Gefallenen tadelt, wenn er spricht: ‘Durch den Geist der Unzucht seid ihr getäuscht worden!’ Denn durch mich waren sie zu Fall gekommen. Ich bin der, der dich so oft bedrängt hat, der so oft von dir überwunden worden ist.” Antonius aber dankte dem Herrn, faßte Mut gegen ihn und erwiderte: “Man kann dich gar wohl gründlich verachten; denn du bist schwarz in deiner Seele und schwach wie ein Kind. Ich habe deinetwegen nicht die geringste Sorge mehr. ‘Denn der Herr ist meine Hilfe, und ich verachte meine Feinde.’” Als das der Schwarze hörte, entfloh er sogleich voll Furcht über diese Worte und scheute sich, dem Heiligen auch nur mehr nahezukommen.</p>
      <h2>7</h2><p>Dies war der erste siegreiche Kampf des Antonius gegen den Teufel oder vielmehr, diese herrliche Tat war in Antonius das Werk des Heilandes, “der die Sünde im Fleische verurteilte, damit die Gerechtigkeit des Gesetzes erfüllt werde in uns, die wir nicht im Fleische wandeln, sondern im Geiste.” Antonius aber wähnte nicht, der Dämon sei unterlegen, so daß er nachlässig werden könne und nicht weiter auf sich zu achten brauche; auch der Feind hielt sich nicht für überwunden und hörte nicht auf, ihm nachzustellen; denn er ging wieder herum wie ein Löwe und suchte einen Vorwand gegen ihn. Antonius aber, der aus der Heiligen Schrift gelernt hatte, daß die Ränke des bösen Feindes vielfach seien, übte sich mit aller Kraft in der Askese; denn er bedachte bei sich, daß der Teufel, wenn er auch nicht imstande gewesen sei, sein Herz durch die Lust des Fleisches zu verführen, jedenfalls eine andere List versuchen werde, ihm nachzustellen; denn der Dämon liebt die Sünde überaus. Mehr und immer mehr bezwang er seinen Körper und machte ihn untertänig, um nicht, hier siegreich, dort zu unterliegen. Daher ging er mit sich zu Rate, wie er sich an eine noch härtere Lebensführung gewöhnen könne. Gar viele bewunderten ihn, er selbst aber ertrug die Mühe leicht. Denn die Bereitwilligkeit seiner Seele, die ihr so lange innewohnte, hatte eine treffliche Verfassung in ihm zustande gebracht, so daß er, wenn er von anderen auch nur den kleinsten Anstoß erhalten hatte, daraufhin einen glühenden Eifer zeigte; er wachte so lange, daß er oft sogar die ganze Nacht schlaflos zubrachte, und dies nicht etwa einmal, sondern oft und oft; darüber wunderten sich dann die anderen; Nahrung nahm er einmal des Tages zu sich nach Sonnenuntergang; bisweilen aß er nur alle zwei, oft aber auch bloß alle vier Tage; er lebte von Brot und Salz, als Getränk diente ihm nur Wasser. Von Fleisch und Wein bei ihm nur zu reden, ist überflüssig, da man dergleichen nicht einmal bei den anderen Frommen fand. Zum Schlafen begnügte er sich mit einer Binsenmatte; meist aber legte er sich auf die bloße Erde zur Ruhe nieder. Sich mit Öl zu salben, lehnte er ab; denn er sagte, es zieme sich für junge Leute mehr, die Askese in bereitwilligem Eifer zu üben, statt all die Dinge zu suchen, die den Körper verweichlichen; man müsse ihn auch an die Mühen gewöhnen, in Erinnerung an das Wort des Apostels: “Wenn ich schwach bin, dann bin ich stark”. Er behauptete, die Spannkraft der Seele sei dann groß, wenn die Begierden des Körpers ohnmächtig seien. Er hielt auch folgenden, wirklich seltsamen Gedanken fest: er wollte den Weg zur Tugend und die Trennung vom Leben, die er sich um ihretwillen auferlegte, nicht durch ein zeitliches Maß messen, sondern durch seine Sehnsucht und seinen Vorsatz. Er wollte sich nicht erinnern an die Zeit, die schon verstrichen; nein, wie wenn er täglich die Askese aufs neue begänne, mühte er sich immer mehr ab um seine Vollendung, indem er beständig die Worte des Apostels Paulus wiederholte: “Vergessend das, was da zurück liegt, strebend nach dem, was vorwärts liegt”; er gedachte auch des Ausspruches des Propheten Elias, der sagt: “Es lebt der Herr, vor dem ich heute stehe”. Denn Antonius beachtete, daß Elias, da er von “heute” sprach, die abgelaufene Zeit nicht maß; wie wenn er immer von neuem den Anfang machte, bemühte er sich, aus sich den zu machen, als der er vor Gott erscheinen sollte, reinen Herzens und bereit, seinem Willen zu gehorchen und keinem anderen. Denn Antonius sagte bei sich, der Asket müsse in dem Lebenswandel des großen Elias wie in einem Spiegel beständig sein eigenes Leben sehen.</p>
      <h2>8</h2><p>So meisterte sich Antonius. Dann wanderte er weg zu Gräbern, die weit von dem Dorfe lagen; einen von seinen Bekannten bat er, ihm von Zeit zu Zeit, aber nur in langen Zwischenräumen, Brot zu bringen; dann ging er in eines der Gräber hinein und blieb, nachdem jener die Türe hinter ihm geschlossen hatte, allein drinnen. Da hielt es der böse Feind nicht aus, er fürchtete, Antonius möchte in kurzem auch die Wüste mit seiner Askese erfüllen, und so ging er in einer Nacht hin mit einer Schar von Dämonen und schlug ihn so heftig, daß er sprachlos vor Qualen auf dem Boden lag. Antonius versicherte nachher, die Schmerzen seien so grausam gewesen, daß man behaupten könne, Schläge von Menschenhand hätten niemals eine solche Pein verursacht. Durch Gottes Fürsorge aber - denn der Herr verläßt die nicht, welche auf ihn hoffen - erschien am nächsten Tage sein Freund, um ihm Brote zu bringen; er öffnete die Türe und sah ihn wie tot am Boden liegen; da hob er ihn auf und trug ihn in die Kirche des Dorfes und legte ihn auf die Erde. Viele von seinen Verwandten und die Leute aus dem Dorfe setzten sich neben Antonius, den sie tot glaubten. Um Mitternacht aber kam dieser zu sich, erwachte, und wie er sie alle schlafen sah, während nur sein Vertrauter wach war, da winkte er diesem, zu ihm zu kommen und bat ihn, er möge ihn wieder aufheben und zu den Gräbern bringen, ohne jemand aufzuwecken.</p>
      <h2>9</h2><p>Er wurde von ihm weggetragen und war so wieder allein innen, nachdem die Türe wie vorher verschlossen worden war. Stehen konnte er wegen der Schläge nicht, also betete er im Liegen; nach dem Gebete aber rief er laut: “Hier bin ich wieder, Antonius; ich fürchte eure Schläge nicht; wenn ihr mich auch noch ärger quält, nichts wird mich trennen von der Liebe zu Christus”. Dann stimmte er den Psalm an: “Wenn sich auch aufstellt ein Heerlager gegen mich, nicht wird sich fürchten mein Herz.” So dachte und sprach der Asket; der höllische Feind aber, voll Hass gegen das Gute, wunderte sich, daß Antonius es nach den Schlägen gewagt hatte, wiederzukommen; er rief seine Hunde zusammen und rief berstend vor Zorn: “Seht ihr, daß wir ihn weder durch den Geist der Unzucht noch durch Schläge zum Schweigen gebracht haben! Im Gegenteil, er ist sogar noch frech gegen uns. Wohlan, wir wollen ihm anders beikommen!” Denn leicht ist es für den Teufel, alle möglichen Gestalten zur Sünde anzunehmen. Da machten sie nachts einen solchen Lärm, daß der ganze Ort zu erbeben schien. Es war, als ob die Dämonen die vier Mauern des kleinen Baues durchbrechen und eindringen wollten; dazu verwandelten sie sich in die Gestalten von wilden Tieren und Schlangen; und gar bald erfüllte sich der Platz mit Erscheinungen von Löwen, Bären, Leoparden, Stieren und Nattern, Aspisschlangen, Skorpionen und Wölfen. Jedes von diesen Untieren bewegte sich nach seiner besonderen Art: Der Löwe brüllte, als wollte er anspringen, der Stier schien mit den Hörnern zu stoßen, die Schlange ringelte sich, aber sie kam nicht, der Wolf stürmte los, blieb aber wie festgebannt; der Lärm aller dieser Erscheinungen zugleich war wirklich schrecklich und ihre Wut grimmig. Antonius, von ihnen zerpeitscht und zerstochen, fühlte zwar heftigen körperlichen Schmerz, aber ohne Zittern und wachsam in seiner Seele lag er da; er seufzte infolge seiner leiblichen Pein, aber klaren Geistes und voll Hohn rief er: “Wenn ihr Macht hättet, genügte es, wenn auch nur einer von euch käme. Aber da der Herr euch die Kraft genommen hat, versucht ihr durch eure Menge vielleicht Furcht einzuflössen. Ein Zeichen eurer Schwäche ist es, daß ihr die Gestalt von wilden Tieren nachahmt.” Und voll Mut sagte er weiter: “Wenn ihr es vermögt und Gewalt empfangen habt gegen mich, dann zaudert nicht, sondern kommt heran! Wenn ihr aber nicht könnt, warum verwirrt ihr euch selbst umsonst? Denn ein Siegel ist für uns und eine sichere Mauer der Glaube an unseren Herrn.” Sie aber versuchten alles Mögliche und knirschten mit den Zähnen gegen ihn, weil sie sich selbst verspotteten und nicht den Antonius.</p>
      <h2>10</h2><p>Der Herr aber vergaß auch da nicht seines Ringens, sondern kam zu seinem Beistand. Denn als Antonius aufblickte, sah er das Dach geöffnet, und ein Lichtstrahl kam auf ihn herab. Die Dämonen wurden plötzlich unsichtbar, die Pein in seinem Körper hörte sogleich auf, und das Haus war wieder unbeschädigt wie zuvor. Antonius aber merkte die Hilfe, atmete auf, er wurde von seinen Schmerzen erleichtert und fragte die Erscheinung: “Wo warst du? Warum bist du nicht zu Anfang gekommen, um meine Qualen zu beendigen?” Und eine Stimme ertönte zu ihm:,,Antonius, ich war hier, aber ich wartete, um dein Kämpfen zu sehen. Da du den Streit bestanden hast, ohne zu unterliegen, werde ich dir immer hilfreich sein, und ich werde dich berühmt machen allerorten". Als er dies hörte, stand er auf und betete. Er gewann soviel Kraft, daß er merkte, jetzt mehr Stärke zu besitzen als vorher. Damals war er nahe an fünfunddreißig Jahre alt.</p>
      <h2>11</h2><p>Am folgenden Tage kam er aus dem Grabe hervor und war noch eifriger auf die Gottesfurcht bedacht. Dann ging er zu dem erwähnten hochbetagten Alten und bat ihn, mit ihm die Wüste zu bewohnen. Dieser schlug es ihm ab, einmal, weil er zu alt war, dann aber, weil diese Sitte damals noch nicht bestand; da eilte Antonius allein auf den Berg. Der böse Feind aber, der seinen Eifer sah und ihn hindern wollte, legte ihm als bloßes Trugbild eine große Menge Silbers auf den Weg. Antonius aber merkte die List des Bösen, hielt an, blickte auf die Scheibe, erkannte den Teufel in ihr und sprach: “Woher kommt in der Wüste eine Scheibe? Dieser Weg ist wenig begangen, auch ist keine Spur von Wanderern hier zu sehen. Wenn sie aber irgendwo herausgefallen wäre, hätte man das gemerkt, da sie doch sehr groß ist. Auch wäre dann der Verlierer umgekehrt, er hätte die Scheibe gesucht und gefunden; denn der Ort hier ist ja öde. Das ist eine List des Teufels. Du wirst mich aber in meinem Vorsatz dadurch nicht hindern, Teufel. Dies Ding da aber fahre mit dir dahin ‘zur Vernichtung’.” Kaum hatte er das gesagt, da verschwand die Scheibe wie Rauch vor dem Feuer.</p>
      <h2>12</h2><p>Als der Heilige dann weiter ging, da sah er nicht mehr ein bloßes Trugbild, sondern wirkliches Gold, das auf seinen Weg geworfen war; ob es ihm aber der böse Feind zeigte oder eine höhere Macht, die den Kämpfer üben wollte, um dem Teufel zu zeigen, daß er sich auch um wirkliche Schätze nicht kümmere, genug, er hat es selbst nicht kundgetan, und wir wissen es nicht; jedenfalls, das Gold war da. Antonius wunderte sich über die Menge, schritt aber darüber weg wie über Feuer und ging daran vorbei, ohne sich auch nur umzuwenden. Noch mehr, er begann so zu laufen, daß er außer Sehweite kam und der Platz so verborgen blieb. Immer kräftiger wurde sein Vorsatz, und so eilte er auf den Berg. Er fand da jenseits des Flusses eine verlassene Verschanzung, die wegen der Länge der Zeit voll kriechenden Gewürms war. Hier ließ er sich nieder und wohnte darin. Das kriechende Getier aber entwich sogleich, wie wenn es jemand verfolgt hätte. Er brach den Eingang auf und speicherte Brot für sechs Monate auf - das tun die Leute von Theben, und oft bleiben die Brote selbst ein ganzes Jahr lang frisch -; Wasser hatte er im Inneren. Gleichsam wie wenn er sich in ein unterirdisches Tempelgemach versenke, so blieb er hier innen allein; er ging nicht heraus und sah keinen Vorübergehenden. Lange Zeit hindurch hielt er sich so in strenger Askese; nur zweimal im Jahre erhielt er von oben her durch das Gebäude sein Brot.</p>
      <h2>13</h2><p>Seinen Bekannten, die zu ihm kamen, erlaubte er nicht hineinzugehen; sie verweilten deshalb oft ganze Tage und Nächte außerhalb und hörten, wie drinnen ganze Scharen lärmten und tobten, klagten und schrien: “Gehe weg aus unserem Reich! Was hast du in der Wüste zu schaffen? Du hältst unsere Nachstellung nicht aus!” Anfangs meinten die Außenstehenden, es seien das einige mit Antonius kämpfende Menschen, die auf Leitern zu ihm eingedrungen seien. Als sie sich aber bückten und durch eine Ritze niemand sahen, da bedachten sie, daß es Dämonen seien und riefen voll Furcht den Antonius um Hilfe an. Der hörte mehr auf sie, als daß er sich um die Dämonen gekümmert hätte. Er kam nahe an die Türe heran und forderte die Menschen auf, sich zu entfernen ohne sich zu fürchten; denn so, sagte er, ließen die Dämonen Trugbilder entstehen zum Schaden derer, die sich fürchten. “Ihr aber drückt euch das Siegel des Kreuzes auf und geht getrost von dannen. Diese aber laßt sich selbst verspotten.” Die Besucher gingen nun hinweg, geschirmt durch das Zeichen des Kreuzes. Er aber blieb und erlitt keinen Schaden von ihnen; er wurde auch nicht müde im Kampfe; denn die Bereicherung durch die Gesichte, die ihm von oben wurden, und die Schwäche der Feinde gab ihm große Erleichterung in den Mühen und rüstete ihn aus mit neuem Eifer. Immer wieder fanden sich seine Bekannten ein, da sie meinten, ihn tot zu sehen und hörten, wie er psalmodierte: “Aufstehen möge Gott und zerstreut sollen werden seine Feinde und fliehen sollen vor seinem Angesicht, die ihn hassen. Wie der Rauch verschwindet, so sollen sie verschwinden. Wie das Wachs schmilzt vor dem Feuer, so mögen zugrunde gehen die Sünder vor dem Angesicht Gottes”, und wieder: “Alle Völker haben mich umringt, und im Namen des Herrn habe ich sie überwunden”.</p>
      <h2>14</h2><p>Fast volle zwanzig Jahre lebte er so für sich allein als Asket; niemals ging er heraus, und nur selten sahen ihn andere Menschen. Da aber wünschten viele gar innig, seine Askese nachzuahmen; andere von seinen Bekannten erschienen und brachen und stießen mit Gewalt die Türe auf; da trat Antonius wie aus einem Heiligtum hervor, eingeweiht in tiefe Geheimnisse und gottbegeistert. Damals zeigte er sich zum ersten Male außerhalb der Verschanzung denen, die zu ihm kamen. Wie ihn nun jene sahen, da wunderten sie sich, daß sein Leib das gleiche Aussehen hatte wie vorher, daß er nicht aufgedunsen war wie der eines Menschen, der ohne alle Bewegung gelebt hatte, daß er keine Spuren von den Fasten und dem Kampf mit den Dämonen zeigte; denn er sah so aus, wie sie es auch von der Zeit wußten, ehe er sich in die Einsamkeit zurückgezogen hatte. Die Verfassung seines Innern aber war rein; denn weder war er durch den Mißmut grämlich geworden noch in seiner Freude ausgelassen, auch hatte er nicht zu kämpfen mit Lachen oder Schüchternheit; denn der Anblick der großen Menge brachte ihn nicht in Verwirrung, man merkte aber auch nichts von Freude darüber, daß er von so vielen begrüßt wurde. Er war vielmehr ganz Ebenmaß, gleichsam geleitet von seiner Überlegung, und sicher in seiner eigentümlichen Art. Viele von den Anwesenden, die ein körperliches Leiden hatten, heilte der Herr durch ihn, und andere befreite er von Dämonen. Er verlieh unserem Antonius auch die Freundlichkeit der Rede; und so tröstete er viele Trauernde, andere, die im Streite miteinander lagen, versöhnte er, so daß sie Freunde wurden; zu allen aber sagte er, sie sollten nichts von dem Irdischen der Liebe zu Christus vorziehen. In seiner Unterweisung gab er auch den Rat, sich der künftigen Güter zu erinnern und der Menschenfreundlichkeit, die Gott uns erwiesen, “der seinen eigenen Sohn nicht schonte, sondern ihn hingab für uns alle”. Dadurch überredete er viele, sich dem Einsiedlerleben zu widmen. So entstanden jetzt auch im Gebirge Klöster, und die Wüste bevölkerte sich mit Mönchen, die alles verließen, was sie besaßen, und sich einzeichneten für das Leben im Himmel.</p>
      <h2>15</h2><p>Als er nun einmal den Kanal von Arsinoë überschreiten mußte - die Notwendigkeit dazu aber trat für ihn ein, weil er die Brüder besuchen wollte -, da war dieser voll von Krokodilen. Er aber sprach nur ein Gebet, dann ging er selbst und alle seine Begleiter hinein, und sie kamen unversehrt hindurch. Nachdem er dann in das Kloster zurückgekehrt war, widmete er sich wieder den gleichen ernsten und tüchtigen Pflichten. Er gab beständig Unterweisungen und vermehrte bei denen, die schon Mönche waren, die Bereitwilligkeit, von den anderen aber brachte er sehr viele dazu, daß sie die Askese lieb gewannen; gar rasch entstanden so unter dem gewinnenden Einfluß seines Wortes Klöster in großer Zahl, die er alle wie ein Vater leitete.</p>
      <h2>16</h2><p>Einmal nun kam er heraus, alle seine Mönche versammelten sich um ihn und wünschten von ihm eine Belehrung zu empfangen; da trug er ihnen in ägyptischer Sprache folgendes vor: “Die Heilige Schrift ist zwar hinreichend zur Belehrung; für uns aber ist es gut, wenn wir einander ermuntern im Glauben und uns salben mit dem Balsam guter Lehren. Ihr sollt wie Kinder alles vor den Vater bringen und ihm sagen, was ihr wißt. Ich dagegen, der ich älter bin wie ihr, teile euch mit, was ich weiß und was ich erfahren habe. Besonders aber soll bei allen der gemeinsame Eifer darauf gerichtet sein, nicht nachzugeben, wenn ihr einmal angefangen, noch bei den Mühen den Mut zu verlieren, nicht zu sagen: Wir haben lange Zeit hingebracht in der Askese. Wir wollen vielmehr, wie wenn wir täglich von neuem begännen, den guten Willen dafür steigern. Denn das ganze menschliche Leben ist überaus kurz, wenn man es an den künftigen Ewigkeiten mißt; unsere ganze Zeitlichkeit ist so nichts gegenüber dem ewigen Leben. Jedes Ding in der Welt wird nach seinem Wert verkauft, und Gleiches tauscht man um Gleiches ein. Die Verheißung des ewigen Lebens aber wird um ein Geringes erworben. Denn es steht geschrieben:”Die Tage unseres Lebens sind bei ihnen siebzig Jahre, wenn sie aber unter den Mächtigen sind, so währt es achtzig Jahre, und das meiste davon ist Mühe und Plage". Wenn wir also auch im ganzen achtzig und selbst hundert Jahre in der Askese verharren, dann werden wir nicht ebensolange wie die hundert Jahre im Himmel das Reich besitzen, sondern statt der hundert Jahre werden wir von Ewigkeit zu Ewigkeit herrschen. Und wenn wir auf Erden unseren Kampf gekämpft haben, dann werden wir unser Erbteil nicht auf dieser Erde haben, sondern unser sind die Verheißungen im Himmel. Und endlich, wenn wir unseren vergänglichen Leib ablegen, werden wir ihn unsterblich zurückerhalten.</p>
      <h2>17</h2><p>Wir wollen also nicht nachlassen, meine Kinder, auch nicht glauben, daß wir lange Zeit so leben oder etwas Großes tun. “Denn die Leiden dieser Zeit sind nichts im Vergleich zu der Ruhmeskrone, die uns in der Zukunft enthüllt werden wird”. Wir wollen auch nicht auf die Welt sehen und glauben, wir hätten großen Dingen entsagt. Denn selbst die ganze Erde ist sehr klein gegenüber dem ganzen Himmel. Wenn wir auch Herren der ganzen Erde wären und dieser ganzen Erde entsagten, so wäre dies wieder wertlos gegenüber der himmlischen Herrschaft. Denn wie man ein einziges Kupferstück verachtet, um hundert Goldstücke zu gewinnen, so gibt der, welcher Herr über die ganze Erde ist und ihr entsagt, nur wenig weg und erhält hundertmal mehr. Wenn nun die ganze Erde nicht soviel wert ist wie der Himmel, so darf der, welcher wenige Hufen Landes hergibt, auch wenn er ein Haus oder viel Geld zurückläßt - gerade wie wenn er nichts zurückließe -, sich nicht rühmen oder lässig werden. Vielmehr müssen wir bedenken, daß wir all dieses, wenn wir nicht der Tugend wegen darauf verzichten, doch später bei unserem Tode zurücklassen, oft sogar denen, welchen wir es nicht wollen, wie daran erinnert der Ekklesiastes. Warum sollen wir die irdische Habe nicht der Tugend wegen aufgeben, damit wir das himmlische Reich gewinnen? Deshalb soll auch keinen von uns die Lust überkommen, etwas zu erwerben. Denn was bringt es für einen Gewinn, das zu erwerben, was wir nicht einmal mit uns nehmen können? Warum sollen wir uns nicht lieber jene Güter gewinnen, die wir mit uns nehmen können, was da ist Klugheit, Gerechtigkeit, Mäßigkeit, Tapferkeit, Einsicht, Liebe, Sorge für die Armen, Glauben an Christus, Sanftmut und Gastfreundschaft? Wenn wir das erwerben, dann werden wir finden, daß dies für sich allein schon uns Gastfreundschaft bereitet dort im Lande der Sanftmütigen.</p>
      <h2>18</h2><p>Aus all dem soll man die Überzeugung in sich festigen, daß man nicht nachlassen darf, ganz besonders dann, wenn man erwägt, daß man ein Diener des Herrn ist. Auch ein Knecht dürfte nicht wagen, so zu sprechen: “Da ich gestern gearbeitet habe, arbeite ich heute nichts”; nicht mißt er die vergangene Zeit und hört auf in den folgenden Tagen, sondern Tag für Tag, wie es im Evangelium heißt, zeigt er die gleiche Willfährigkeit, damit er seinem Herrn gefalle und nicht ins Verderben gerate. So sollen auch wir Tag für Tag in der Askese verharren; denn wir wissen, daß uns der Herr, wenn wir auch nur einen Tag nachlässig sind, nicht wegen der vergangenen Zeit verzeiht, sondern wegen der Nachlässigkeit uns zürnt. Dies haben wir auch bei Ezechiel gehört; auch Judas hat durch eine Nacht die Mühe einer ganzen Vergangenheit verloren.</p>
      <h2>19</h2><p>Daher wollen wir, meine Kinder, an der Askese festhalten und nicht nachlässig werden. Denn wir haben darin auch den Herrn als Mithelfer, wie geschrieben steht: “Einem jeden, der das Gute wählt, hilft Gott zum Guten.” Um aber nicht sorglos zu werden, ist es nützlich für uns, jenes Wort des Apostels zu beherzigen, das “täglich sterbe ich”. Denn wenn auch wir so leben, als ob wir täglich sterben sollten, dann werden wir nicht sündigen. Jenes Wort ist gesagt, auf daß wir, wenn wir jeden Tag erwachen, glauben, nicht bis zum Abend zu leben, und wiederum damit wir, wenn wir einschlafen, glauben, nicht mehr zu erwachen; denn von Natur ist unser Leben unsicher, und es wird uns täglich von der Vorsehung zugemessen. Wenn wir uns so halten und täglich danach leben, werden wir nicht in Sünden fallen, wir werden nichts begehren, keinem zürnen, wir werden keine Schätze sammeln auf Erden. Vielmehr werden wir, wie wenn wir täglich den Tod erwarteten, besitzlos sein und allen alles verzeihen. Der Begierde nach einem Weibe oder einer anderen unreinen Lust werden wir uns durchaus nicht gefangen geben, wir werden uns davon abwenden wie von etwas, das vergänglich ist, immer voll Kampfeseifer und im Hinblick auf den Tag des Gerichtes. Denn es ist ja immer so, daß die Furcht vor dem Schwereren und das Ringen mit den Qualen das Einschmeichelnde der Begierde auflöst und die strauchelnde Seele wieder aufrichtet.</p>
      <h2>20</h2><p>Nachdem wir also nunmehr den Anfang gemacht und den Weg der Tugend betreten haben, wollen wir uns immer mehr anstrengen, um vorwärts zu kommen. Keiner möge sich rückwärts wenden, wie das Weib Lots, besonders da der Herr gesagt hat; “Niemand, der die Hand an den Pflug legt und sich zurückwendet, ist tauglich im Reiche des Himmels”. Sich umwenden heißt aber nichts anderes als Reue empfinden und wieder weltlich denken. Fürchtet euch aber nicht, wenn ihr von Tugend hört, und seid nicht betroffen über den Namen; denn sie ist nicht fern von uns noch steht sie außer uns, sondern in uns liegt die Ausführung, und das Werk ist leicht, wenn wir nur wollen. Die Heiden gehen außer Landes und durchsegeln das Meer, um Gelehrsamkeit zu sammeln, wir aber haben nicht nötig, die Heimat zu verlassen wegen des himmlischen Reiches, noch brauchen wir über das Meer zu fahren um der Tugend willen. Denn einst sprach der Herr: “Das Himmelreich ist in euch”. Zur Tugend ist also nur nötig, daß wir selbst wollen, da sie in uns ist und aus uns entsteht. Denn die Tugend besteht darin, daß die Seele das Vernünftige in sich hat, wie es ihrer Natur gemäß ist. Sie befindet sich aber in ihrem natürlichen Zustand, wenn sie bleibt, wie sie geschaffen ist, geschaffen aber ist sie in Schönheit und voller Harmonie. Deshalb verkündete auch Jesus, der Sohn Naves, dem Volke: “Lenkt euer Herz zum Herrn, dem Gott Israels”, und Johannes: “Macht gerade eure Wege!” Denn in der Geradheit der Seele besteht ihr naturgemäßer vernünftiger Zustand, und so ist sie auch geschaffen. Wenn sie aber anderseits vom rechten Weg abbiegt und sich von ihrem natürlichen Zustand abkehrt, dann ist das die Schlechtigkeit der Seele. Die Arbeit ist also keine schwere; wenn wir bleiben, wie wir sind, dann verharren wir in der Tugend; wenn wir aber an das Schlechte denken, werden wir als böse befunden. Wenn die Ausführung außer uns läge, wäre sie in Wahrheit schwierig; da sie aber in uns liegt, wollen wir uns hüten vor unreinen Gedanken, und wir wollen die Seele dem Herrn bewahren, wie wenn wir sie als ein Pfand überkommen hätten, damit er sein Werk erkenne, daß es so ist, wie er es selbst gebildet.</p>
      <h2>21</h2><p>Wir sollen aber darum kämpfen, daß der Zorn uns nicht beherrsche, noch die Begierde über uns Macht erhalte. Denn es ist geschrieben: “Der Zorn des Menschen bewirkt nicht die Gerechtigkeit Gottes; die Begierde aber erzeugt Sünde, wenn sie empfangen hat; die Sünde aber, die vollbracht worden, gebiert den Tod”. Wenn wir so leben, werden wir sicher unsere Besonnenheit bewahren und, wie geschrieben steht, mit jeglicher Hut bewachen unser Herz. Denn wir haben mächtige und schlaue Feinde, die bösen Geister; mit ihnen müssen wir ringen, wie der Apostel es verkündigt hat: “Nicht gegen Blut und Fleisch, sondern gegen die Mächte und die Gewalten, gegen die Weltherrscher dieser Finsternis, gegen die Geister der Schlechtigkeit in den himmlischen Regionen”. Groß ist ihre Schar in dem Luftraum um uns, und sie sind nicht fern von uns. Es ist jedoch ein großer Unterschied zwischen den einzelnen. über ihre Natur und ihre verschiedene Art könnte man eine lange Rede halten, aber eine derartige Auseinandersetzung ist die Aufgabe anderer, die größer sind als wir. Was jetzt uns obliegt und nötig ist, ist allein dies, ihre listigen Anschläge gegen uns kennen zu lernen.</p>
      <h2>22</h2><p>Fürs erste nun müssen wir einsehen, daß die Dämonen nicht so geschaffen sind, weshalb sie Dämonen heißen; denn Gott hat nichts Schlechtes gemacht; vielmehr sind auch sie gut gewesen; aber sie stürzten aus dem Reiche der himmlischen Weisheit, trieben sich auf der Erde herum und täuschten die Hellenen durch ihre Erscheinungen, auf uns Christen aber sind sie neidisch und setzen alles in Bewegung, da sie uns auf unserem Weg zum Himmel hindern wollen, damit wir nicht dahin gelangen, woher sie selbst herabgestürzt sind. Daher ist eifriges Gebet und Askese nötig, damit man, wenn man durch den Heiligen Geist die Gabe der Unterscheidung der Geister erhalten hat, ihre Art erkenne; damit man wisse, welche von ihnen weniger böse sind, welche schlechter, mit welcher Aufgabe sich jeder von ihnen besonders eifrig beschäftigt, wie jeder von ihnen verscheucht und vertrieben werden kann. Denn vielfach sind ihre Listen und ihre lauernden Bewegungen. Der selige Apostel und seine Nachfolger wußten all dieses, wenn sie sagen: “Wir kennen ihre Gedanken sehr gut”. Wir aber müssen einander durch die Versuchungen, die wir von den Dämonen erduldet haben, aufrichten. Ich, der ich zum Teil die Probe mit ihnen gemacht habe, rede deshalb wie zu meinen Kindern.</p>
      <h2>23</h2><p>Wenn die Dämonen überhaupt Christen sehen, besonders aber Mönche, die sich freudig bemühen und Fortschritte machen, da greifen sie zuerst an und führen sie in Versuchung, indem sie ihnen Anstößiges in den Weg legen; ihre Fallstricke aber sind schlechte Gedanken. Wir brauchen jedoch ihre Eingebungen nicht zu fürchten; denn durch Gebete und Fasten und durch den Glauben an den Herrn kommen sie rasch zu Fall. Aber auch dann hören sie nicht auf, wieder und wieder greifen sie an, listig und verschlagen. Denn wenn sie durch offene, unreine Begierde das Herz nicht verführen können, dann stellen sie es anders an. Sie machen Erscheinungen nach und stellen sich, als wollten sie Schrecken einjagen, sie wechseln ihre Gestalt und verwandeln sich in Weiber, wilde Tiere und Schlangen, in riesenhafte Leiber und Scharen von Kriegern. Aber auch so braucht man ihre Erscheinungen nicht zu fürchten; denn sie sind nichts, und rasch verschwinden sie, wenn man sich schirmt durch den Glauben und das Zeichen des Kreuzes. Doch sind sie kühn und überaus frech. Denn wenn sie so unterlegen sind, versuchen sie wieder einen anderen Anschlag. Sie stellen sich, als ob sie weissagten und die Zukunft verkündigten, sie erscheinen hoch von Gestalt, die bis zur Decke reicht, und mächtig an Größe, damit sie die, welche sie durch ihre Gedanken nicht täuschen konnten, durch solche Trugbilder verführen. Wenn sie aber auch dann die Seele gesichert im Glauben und in der Hoffnung auf die Vorsehung finden, dann führen sie ihren Meister heran.</p>
      <h2>24</h2><p>Sie erscheinen oft in der Gestalt, fuhr er fort, wie der Herr dem Job den Teufel beschrieb, indem er sagte: “Seine Augen sind wie der Anblick des Morgensternes. Aus seinem Munde sprühen brennende Fackeln hervor, es flackern Feuerbrände. Aus seinen Nüstern strömt Rauch hervor wie von den glühenden Kohlen eines flammenden Herdes. Sein Atem ist wie Kohle; eine Flamme geht aus seinem Munde hervor”. So erscheint der Fürst der Dämonen und verbreitet Furcht wie ich oben sagte; gewaltige Worte spricht der Listige wie ihn der Herr gleichfalls entlarvt hat, indem er dem Job verkündete: “Denn er hält das Eisen für Spreu und das Erz für morsches Holz. Das Meer ist ihm wie ein Salbbüchslein, der Schlund des Abgrundes wie ein Gefangener. Der Abgrund ist ihm wie ein Platz zum Lustwandeln”, und durch den Propheten: “Es sprach der Feind: Ich verfolge und werde ergreifen”, und wieder durch einen anderen: “Die ganze Erde habe ich ergriffen mit meiner Hand wie ein Nest, und ich hebe sie empor wie verlassene Eier”. Überhaupt versuchen sie sich in solchen Prahlereien, und derlei sprechen sie, um die Gottesfürchtigen zu verführen. Aber wir Gläubigen brauchen deshalb durchaus nicht die Erscheinungen des Teufels zu fürchten, noch auf seine Stimmen zu hören; denn er lügt und sagt kein wahres Wort. Trotz dieser seiner kühnen Reden und seines Übermutes wurde er vom Heiland wie ein Drache am Angelhaken gezogen, wie ein Stück Vieh erhielt er eine Hafter durch die Nüstern, wie ein Ausreißer wurde er gebunden mit einem Ring durch die Nase, und die Lippen wurden ihm durchbohrt von einer Kette. Er wurde gebunden vom Herrn wie ein Sperling, damit er von uns verspottet werde; sie sind hingestellt worden, er und seine Mitteufel, wie Skorpionen und Schlangen, auf daß sie zertreten werden von uns Christen. Und das ist ein Zeichen, daß wir jetzt leben ihm zum Trotze. Denn er, der sich vermaß, daß er das Meer austrocknen und die ganze Erde ergreifen werde, siehe, er kann jetzt eure Askese nicht hindern, noch mich, der ich gegen ihn rede. Achten wir also nicht auf das, was er sagt, denn er lügt; noch fürchten wir seine Erscheinungen, denn auch sie sind Lüge. Das Licht, das in ihnen leuchtet, ist nicht wahrhaftig, sie bringen vielmehr das Vorspiel und Abbild des ihnen bereiteten ewigen Feuers, worin sie brennen sollen, damit suchen sie die Menschen zu erschrecken; ja, sie erscheinen, aber dann werden sie wieder unsichtbar, ohne daß sie einen der Gläubigen verletzen, da sie mit sich tragen das Abbild des Feuers, das sie aufnehmen wird. Man braucht sie also nicht zu fürchten; denn alle ihre Anstalten sind für nichts durch die Gnade Christi.</p>
      <h2>25</h2><p>Sie sind listig und bereit, sich in alle möglichen Gestalten zu verändern und zu verwandeln. Oft stellen sie sich, als sängen sie unsichtbar Psalmen und gebrauchen die Worte der Schrift. Wenn wir vorlesen, sagen sie bisweilen wie ein Echo dasselbe, was vorgelesen wurde; wenn wir ruhen, wecken sie uns auf zum Gebet; das tun sie fort und fort, so daß sie uns fast nicht zu schlafen erlauben. Manchmal stellen sie sich auch in Mönchsgestalt dar und geben sich den Anschein, als ob sie wie Fromme redeten; so wollen sie durch das gleiche Aussehen verführen, und dann schleppen sie die von ihnen Getäuschten, wohin sie wollen. Man soll aber nicht auf sie achten, wenn sie auch zum Gebet aufwecken oder wenn sie uns raten, nicht mehr zu essen, oder wenn sie tun, als ob sie uns anklagten und schmähten wegen dessen, worin sie einmal unsere Mitwisser geworden sind. Denn nicht aus Frömmigkeit oder Wahrheitsliebe handeln sie so, sondern um die einfachen Herzen in Verzweiflung zu stürzen, um die Askese als nutzlos hinzustellen, um die Menschen krank zu machen, als ob das Einsiedlerleben mühevoll und sehr schwer sei, um die zu hindern, die ihnen zum Trotz so leben.</p>
      <h2>26</h2><p>Der vom Herrn gesandte Prophet meinte sie, wenn er spricht: “Weh über den, der seinen Nächsten tränkt mit schmutziger Vernichtung”. Denn solche Handlungen und Gedanken sind die Vernichtung des Weges, der zur Tugend leitet. Der Herr selbst verschloß ihnen den Mund, wenn auch die Dämonen die Wahrheit sagten - und sie sprachen die Wahrheit, als sie verkündeten: “Du bist der Sohn Gottes” - und hinderte sie zu sprechen, damit sie nicht etwa mit der Wahrheit ihre eigene Sünde ausstreuten und damit er auch uns daran gewöhne, niemals auf sie zu hören, auch wenn sie die Wahrheit zu sagen scheinen; denn es ziemt sich nicht, daß wir, die wir die Heilige Schrift und die Erlösung durch den Heiland besitzen, vom Teufel belehrt werden, der seine eigene Ordnung nicht einhält, sondern bald dies, bald jenes sinnt. Daher hindert er ihn auch, wenn er die Worte der Schrift verwendet, indem er sagt: “Zum Sünder aber spricht Gott: Warum verkündest du meine Gerechtigkeit und nimmst mein Gesetz in deinen Mund?” Denn jegliches tun sie, sie sprechen und lärmen und verstellen sich und verwirren zur Verführung der Reinen. Sie bringen ein Getöse hervor und lachen töricht und pfeifen; wenn man aber nicht auf sie achtet, dann weinen sie und jammern wie Besiegte.</p>
      <h2>27</h2><p>Der Herr also in seiner göttlichen Macht ließ die Dämonen verstummen; wir aber müssen von den Heiligen lernen, wie sie handeln und ihren Mut nachahmen. Denn auch sie sprachen angesichts alles dessen: “Als der Sünder mir gegenüber trat, verstummte ich, und ich demütigte mich und schwieg vom Guten”, und wieder: “Wie ein Tauber hörte ich nicht, und wie ein Stummer öffnete ich nicht den Mund. Und ich wurde wie ein Mensch, der nicht hört”. So wollen auch wir nicht auf sie hören, da sie uns fremd sind, noch wollen wir gehorchen, wenn sie uns zum Gebet wecken oder wenn sie vom Fasten reden. Wir wollen vielmehr eher auf den Vorsatz in unserer Askese merken und uns nicht von ihnen täuschen lassen, die alles mit List ausführen. Man soll sie nicht fürchten, wenn sie auch scheinbar angreifen und mit dem Tode drohen; denn sie sind schwach und vermögen nichts als eben nur zu drohen.</p>
      <h2>28</h2><p>Bisher habe ich über meinen Gegenstand nur oberflächlich gehandelt; jetzt aber darf ich nicht länger säumen, das, was über die Dämonen zu sagen ist, in größerer Ausführlichkeit zu erörtern; denn ihr sollt eine dauernde Erinnerung daran haben. Als der Herr auf die Erde kam, da stürzte der böse Feind nieder, und seine Kräfte wurden schwach. Deshalb vermag er nichts, aber wenn er auch gestürzt ist, verhält er sich trotzdem nicht ruhig, sondern droht wie ein Tyrann, obgleich nur mit dem Munde. Wenn dies jeder von euch bedenkt, kann er die Dämonen verachten. Wenn sie nun an solche Körper gebunden wären wie wir, könnten sie sagen: Die Menschen, die sich verbergen, finden wir nicht; haben wir sie aber gefunden, dann schädigen wir sie. Wir dagegen könnten uns verstecken vor ihnen und vor ihnen die Türen verschließen. Sie sind aber nicht von solcher Art, sie können durch geschlossene Pforten eindringen, sie halten sich im ganzen Umkreis der Luft auf, sie und ihr Oberteufel; sie sind voll bösen Willens und bereit zu schaden, und wie der Heiland sagte: “Der Teufel, der Vater der Sünde, ist ein Menschenmörder von Anbeginn” - da wir aber leben und sogar ihnen zum Widerspruch leben, so haben sie offenbar keine Gewalt. Denn kein Ort hindert sie, uns nachzustellen, sie betrachten uns nicht als Freunde, um uns zu schonen, noch lieben sie das Gute so sehr, um sich zu bessern, sondern sie sind schlecht, und nach nichts trachten sie so sehr, als die Tugendhaften und Gottesfürchtigen zu schädigen. Weil sie aber nichts ausrichten können, vermögen sie nichts als zu drohen; denn wenn sie Macht hätten, würden sie nicht zögern, sondern gleich das Schlechte vollbringen, da sie dazu den bereiten Willen haben, und dies vor allem gegen uns. Aber siehe, jetzt sind wir zusammengekommen und sprechen gegen sie, sie wissen, daß, wenn wir Fortschritte machen, sie selbst machtlos werden. Wenn sie Gewalt hätten, ließen sie keinen von uns Christen am Leben. “Denn ein Gegenstand des Abscheus ist für den Sünder die Frömmigkeit”. Da sie aber nichts vermögen, wüten sie vielmehr gegen sich selbst, weil sie noch nichts von dem vollbringen können, was sie androhen. Sodann ist auch noch folgendes zu bedenken, um die Furcht vor ihnen zu verlieren: Wenn sie Macht hätten, kämen sie nicht in Scharen, sie würden nicht Trugbilder vortäuschen und sich auch nicht verwandeln, um so ihre Listen auszuführen; es wäre genug, wenn auch nur einer erschiene und das vollbrächte, was er kann und will; denn jeder, dem Gewalt verliehen ist, tötet nicht mit Hilfe einer Erscheinung, noch schreckt er durch die Masse, sondern er macht sofort, wie es ihm beliebt, von seiner Macht Gebrauch. Aber die Dämonen scherzen in ihrer Ohnmacht wie auf der Bühne, sie wechseln ihre Gestalten und machen die Kinder fürchten durch ihre massenhafte Erscheinung und ihre Verwandlungen. Deshalb muß man sie vielmehr verachten als Schwächlinge. Der wahre Engel, den der Herr gegen die Assyrer sandte, bedurfte nicht ganzer Haufen, nicht äußerer Erscheinung, nicht des Lärmes und Getöses; er bediente sich einfach seiner Macht und tötete rasch Hundertfünfundachtzigtausend. Die Dämonen aber, machtlos, wie sie eben sind, versuchen zu erschrecken, wenn auch nur durch bloße Erscheinungen.</p>
      <h2>29</h2><p>Wenn nun einer die Geschichte des Job betrachtet und sagt: Weshalb kam der Teufel und tat dies alles gegen ihn; er beraubte ihn seiner Habe, seine Kinder tötete er, und ihn selbst schlug er mit einer schweren Wunde - so möge er erkennen, daß es nicht der Teufel war, der seine Macht zeigte, sondern Gott, der ihm den Job zur Prüfung übergab; denn da er naturgemäß nichts auszurichten vermag, so bat er zuerst und, nachdem er Gewährung erhalten, schritt er ans Werk. Auch daraus kann man den Feind noch mehr verachten, weil er, selbst wenn er wollte, auch nicht gegen einen einzigen Gerechten Macht besitzt; denn wenn er sie hätte, würde er nicht darum bitten; da er aber nicht nur einmal, sondern zweimal bat, erscheint er kraftlos und ohne Vermögen. Es ist auch gar nicht verwunderlich, wenn er gegen Job nichts ausrichtete, da nicht einmal über dessen Vieh Verderben kam ohne Gottes Zulassung; er hat also nicht einmal gegen Schweine Macht. “Sie riefen”, wie im Evangelium geschrieben steht, “den Herrn an und sprachen: Laß uns in die Schweine fahren”. Wenn sie nun nicht einmal über die Schweine Gewalt besitzen, wieviel weniger über die Menschen, die nach Gottes Ebenbild geschaffen sind.</p>
      <h2>30</h2><p>Man muß also Gott allein fürchten, die Dämonen aber verachten und sich durchaus nicht vor ihnen ängstigen; je mehr sie sich mühen, um so eifriger müssen wir uns gegen sie der Askese befleißigen. Denn ein rechtes Leben und der Glaube an Gott ist eine mächtige Waffe gegen sie. Sie fürchten eben der Asketen Fasten, ihr Wachen, ihre Gebete, das Milde, Ruhige, nicht Geldgierige, ihre Verachtung des leeren Ruhmes, ihre Demut, ihre Liebe zu den Armen, ihre Barmherzigkeit, ihre Sanftmut und besonders ihre Frömmigkeit gegenüber Christus. Deshalb tun sie auch alles, um nicht Menschen zu finden, die sie zertreten. Denn sie wissen, daß vom Heiland den Gläubigen Gnade gegen sie verliehen ist, der da sagt: “Siehe, ich habe euch Gewalt gegeben, zu wandeln auf Schlangen und Skorpionen und über jede Macht des Feindes”.</p>
      <h2>31</h2><p>Wenn sie auch vorgeben, sie könnten weissagen, so möge niemand darauf merken. Oft sagen sie voraus, daß nach einigen Tagen Brüder kämen, und diese erscheinen in der Tat. Sie tun das nicht aus Sorge für die, welche auf sie hören, sondern um sie zu überreden, ihnen zu glauben und sie dann, wenn sie sie unter ihre Gewalt gebracht, zu verderben. Man darf deshalb nicht auf sie achten, sondern man muß sie, wenn sie sprechen, verjagen, da wir sie ja nicht nötig haben. Denn was ist da weiter wunderbares daran, wenn sie, deren Körper aus feinerem Stoffe besteht als jener der Menschen, die Brüder, welche ihren Weg angetreten haben, sehen, im Laufe überholen und ihre Ankunft vorher melden? Dies könnte einer auch vorher tun, wenn er beritten wäre, da er schneller ist als die Wanderer; man braucht sie also darum nicht anzustaunen. Denn von dem, was noch nicht geschehen ist, wissen sie nichts vorher. Gott allein ist es, der alles weiß, ehe es noch geschehen ist. Die Dämonen aber verkünden wie Diebe, was sie sehen, indem sie vorauslaufen. Wie vielen zeigen sie nicht an, was bei uns geschehen ist, daß wir zusammengekommen sind, daß wir gegen sie reden, ehe noch einer von uns weggegangen ist und es meldet! Das könnte aber auch ein schnellfüßiger Knabe tun, der den Langsamen überholt. Was ich meine, ist folgendes: Wenn sich jemand von der Thebais oder von einem anderen Landstrich aus auf den Weg macht, so wissen sie nicht, ob er geht, bevor er seine Reise angetreten hat; wenn sie aber gesehen haben, daß er geht, dann laufen sie voraus und melden es, ehe er kommt. Und so kommt es dann, daß jene nach einigen Tagen eintreffen. Gar oft aber haben die Dämonen gelogen, wenn die Wanderer umkehren.</p>
      <h2>32</h2><p>So schwätzen sie bisweilen auch über das Wasser des Nilflusses; sie haben gesehen, daß es in den Gebieten Äthiopiens viel geregnet hat, und sie wissen, daß daraus die Anschwellung des Flusses entsteht; dann laufen sie voraus und sagen es, bevor das Wasser nach Ägypten kommt. Auch Menschen würden das vorhersagen, wenn sie so rasch laufen könnten wie jene. Wie der Kundschafter des David, der auf eine Anhöhe gestiegen war, den Kommenden eher erblickte als der Untenbleibende; und wie der, der vorausgeeilt, vor den anderen Kunde brachte, nicht von dem, was noch nicht geschehen, sondern von dem, was eben kommt und geschieht: so haben auch die Dämonen die Mühe übernommen und melden anderen, nur um zu täuschen. Wenn sich aber die Vorsehung nur etwas anders entschließt mit der Überschwemmung oder den Wanderern - und sie kann es -, dann haben die Dämonen gelogen, und es wurden die getäuscht, welche auf sie merkten.</p>
      <h2>33</h2><p>So entstanden die Orakel der Hellenen, und so wurden sie vormals von den Dämonen getäuscht; aber gleichwohl hat nachher der Irrwahn sein Ende gefunden. Denn es kam der Herr, der zugleich mit ihrer List auch die Dämonen selbst zur Ohnmacht verwies. Denn nichts wissen sie aus sich selbst, sondern wie Diebe schwatzen sie das aus, was sie von anderen sehen; sie verlassen sich viel mehr auf Vermutungen, als daß sie etwas sicher im voraus wissen. Wenn sie auch einmal etwas Wahres derart sagen, so möge man sie deshalb nicht bewundern. Denn auch die Ärzte haben ihre Erfahrung an den verschiedenen Krankheiten gewonnen, und wenn sie an anderen das gleiche Leiden sehen, machen sie vermutungsweise ihre Schlüsse nach der Gewohnheit und geben vorher ihr Urteil ab. Auch die Steuerleute und Bauern beobachten gewohnheitsmäßig den Zustand der Luft und sagen vorher, ob Sturm oder schönes Wetter sein wird. Deshalb wird man aber nicht behaupten, daß sie dies nach göttlicher Eingebung voraus verkünden, sondern auf Grund ihrer Erfahrung und Gewohnheit. Wenn also auch die Dämonen einmal dasselbe vermutungsweise anzeigen, soll sie niemand deswegen bewundern oder auf sie merken. Denn was bringt es den Hörern für Nutzen, wenn sie von diesen die Zukunft einige Tage vorher erfahren? Oder was soll der Eifer, Derartiges zu erkennen, auch wenn man es in Wahrheit erkennt? Denn dabei ist nichts, was Tugend bewirkt, noch hat diese Erkenntnis etwas zu schaffen mit einem guten Charakter. Keiner von uns wird ja gerichtet nach dem, was er nicht weiß, und keiner wird selig gepriesen deshalb, weil er etwas gelernt hat und Erkenntnis erworben, sondern danach wird jeder beurteilt, ob er den Glauben bewahrt hat und die Gebote treulich beobachtete.</p>
      <h2>34</h2><p>Man darf also dies nicht hochschätzen noch sich deshalb üben und mühen, um die Zukunft vorher zu erfahren, sondern damit wir Gott durch ein gutes Leben gefallen. Man darf nicht beten, um vorher zu wissen, noch dies als Lohn der Askese verlangen, sondern damit uns der Herr ein Helfer werde zum Sieg über den Teufel. Wenn wir aber einmal das Wissen des Zukünftigen wünschen, wollen wir rein sein in unserem Denken. Denn ich bin des festen Glaubens, daß eine Seele, die allseitig lauter und ihrer Natur gemäß geartet ist, mehr und größeres als die Dämonen erblicken kann, da sie dann voraussehend geworden ist und den Herrn zur Seite hat, der ihr alles enthüllt. So war es mit der Seele des Elisäus, die da sah die Dinge um Giezi und erblickte die Mächte, die neben ihm standen.</p>
      <h2>35</h2><p>Wenn sie also nachts zu euch kommen und die Zukunft verkünden wollen oder sagen: Wir sind die Engel …, merket nicht auf, denn sie lügen. Wenn sie auch eure Askese loben und euch selig preisen, höret und achtet nicht auf sie; bezeichnet vielmehr euch und euer Haus mit dem Kreuze und betet; und ihr werdet sehen, wie sie verschwinden; denn sie sind feige und fürchten gar sehr das Zeichen des göttlichen Kreuzes; denn durch dieses hat sie der Heiland entwaffnet und versehen mit einem Zeichen. Wenn sie aber noch schamloser standhalten, tanzen und in vielgestaltigen Erscheinungen auftreten: habt keine Furcht, laßt euch nicht einschüchtern, merkt nicht auf sie, als ob sie gut seien; denn es ist leicht und gar wohl möglich, die Anwesenheit der Guten und Bösen zu unterscheiden, da Gott diese Gabe verleiht. Denn der Anblick der Heiligen bringt keine Verwirrung mit sich: “Nicht wird er streiten noch schreien noch wird jemand hören seine Stimme”. Ihre Erscheinung erfolgt so ruhig und sanft, daß sogleich Freude und Fröhlichkeit und Mut in die Seele kommt. Denn mit ihnen ist der Herr, der unsere Freude ist, die Kraft aber ist die Gottes, des Vaters, die Gedanken der Seele aber sind ohne Verwirrung und Erregung; daher erblickt sie, von jener erleuchtet, die Erscheinungen. Sehnsucht nach dem Göttlichen und Zukünftigen überkommt sie, und sie will sich durchaus mit ihnen vereinigen, um mit ihnen von hier zu gehen. Wenn aber manche als schwache Menschen sich vor dem Gericht der Guten fürchten, dann nehmen die Erscheinenden rasch die Angst von ihnen durch ihre Liebe. So machte es Gabriel mit Zacharias, und der Engel, der am göttlichen Grabe den Frauen sich zeigte, und jener, der im Evangelium zu den Hirten sprach: “Fürchtet euch nicht!” Denn die Furcht vor ihnen entsteht nicht aus der Mutlosigkeit der Seele, sondern aus der Erkenntnis von der Gegenwart der Besseren. So verhält es sich mit der Erscheinung der Heiligen.</p>
      <h2>36</h2><p>Der Ansturm und das Gesicht der Bösen aber ist voll Verwirrung, er erfolgt unter Getöse, Lärm und Geschrei wie das Getümmel von ungezogenen Jungen und Räubern. Daraus entsteht sogleich Furcht in der Seele, Verwirrung und Unordnung in den Gedanken, Scham, Hass gegen die Asketen, Sorglosigkeit, Schmerz, Erinnerung an die Verwandten, Furcht vor dem Tode; und dann Begierde nach dem Schlechten, Nachlässigkeit in der Tugend und Verschlechterung des Charakters. Wenn ihr ein Gesicht habt und euch fürchtet, die Furcht aber sogleich schwindet und dafür unaussprechliche Freude entsteht, Wohlbehagen und Mut und Erquickung, Ordnung in Gedanken und all das andere, von dem ich eben sprach, Mannhaftigkeit und Liebe zu Gott, dann seid frohen Mutes und betet; denn die Freude und der ruhige Zustand der Seele zeigen die Heiligkeit des Anwesenden. So frohlockte Abraham, als er den Herrn sah, und Johannes hüpfte vor Freude, als die Stimme der Gottesgebärerin Maria ertönte. Wenn aber bei manchen Erscheinungen Verwirrung entsteht, Lärm von außen, weltlicher Trug, Drohung mit dem Tode und dergleichen, was ich vorher nannte, so erkennt daran, daß der Angriff von Bösen kommt.</p>
      <h2>37</h2><p>Auch dies soll euch ein Kennzeichen sein: wenn die Seele in Furcht verharrt, so ist das ein Beweis für die Gegenwart der Feinde. Denn die Dämonen nehmen die Furcht davor nicht weg, wie es der große Erzengel Gabriel bei Maria und Zacharias tat, und der, welcher in dem Grabe den Frauen erschien; vielmehr wenn sie Furchtsame sehen, steigern sie die Erscheinungen, um sie noch mehr einzuschüchtern; und dann treten sie heran, verspotten sie und sagen: Fallet nieder und betet an. Die Heiden haben sie so getäuscht; und so wurden sie von ihnen für Götter gehalten, während es doch falsche waren. Bei uns aber ließ es der Herr nicht zu, daß wir vom Teufel verführt werden, da er ihn, der vor ihm solche Erscheinungen versuchte, tadelte und sprach: “Weiche zurück von mir, Satan! Denn es steht geschrieben, du wirst den Herrn, deinen Gott, anbeten und ihm allein dienen”. Immer mehr soll daher der Bösewicht von uns verachtet werden. Denn was der Herr sagte, das hat er für uns getan, damit die Dämonen auch von uns solche Worte hören und verjagt werden im Namen des Herrn, der sie damit schmähte.</p>
      <h2>38</h2><p>Man darf sich der Gabe, Dämonen auszutreiben, nicht rühmen, noch sich brüsten mit seinen Heilungen; man darf auch nicht den allein, der das Dämonenwesen vertreibt, bewundern und den, der es nicht kann, verachten. Man soll vielmehr bei jedem die Askese beobachten und sie entweder nachahmen und ihr nacheifern oder sich bessern. Zeichen zu tun ist nicht unsere Sache, sondern das Werk des Heilandes; er sagte ja zu den Jüngern: “Freuet euch nicht, weil die Dämonen euch untertan sind, sondern weil eure Namen aufgezeichnet sind im Himmel”. Denn wenn unsere Namen im Himmel aufgeschrieben sind, so ist dies ein Kennzeichen unserer Tugend und unseres Lebens; Dämonen auszutreiben ist eine Gnade des Heilandes, der sie verliehen hat. Deshalb antwortete er denen, welche sich nicht ihrer Tugend, sondern ihrer Zeichen rühmten und sagten: “Herr, haben wir nicht in Deinem Namen Teufel ausgetrieben und in Deinem Namen viele Wunder gewirkt?” - er antwortete ihnen: “Wahrlich, ich sage euch, ich kenne euch nicht”. Denn nicht kennt der Herr die Wege der Gottlosen. Man muß also mit einem Wort beten, wie ich oben sagte, um die Gnade der Unterscheidung der Geister zu empfangen, damit wir nicht, wie geschrieben steht, einem jeden Geiste glauben.</p>
      <h2>39</h2><p>Ich wollte nun enden und nichts von mir erzählen, sondern mich mit dem Gesagten begnügen; damit ihr aber nicht glaubt, daß ich dies nur so daherrede, sondern überzeugt seid, daß ich es auf Grund meiner Erfahrung und der Wahrheit gemäß berichte, deshalb will ich erzählen von den Anschlägen der Dämonen, die ich sah; mag ich immerhin wie ein Tor erscheinen, der Herr, der mich hört, kennt die Reinheit meines Gewissens, er weiß, daß es nicht meinetwegen geschieht, sondern aus Liebe zu euch und zu eurer Aufmunterung. Wie oft haben sie mich selig gepriesen, ich aber habe sie verflucht im Namen des Herrn! Wie oft haben sie geweissagt über die Stromflut, ich aber sprach zu ihnen: Was kümmert ihr euch darum? Einst kamen sie unter Drohungen und umringten mich wie Kriegsleute mit ihrer Rüstung. Ein andermal wieder füllten sie mit Pferden, wilden Tieren und Schlangen das Haus; ich aber sang den Psalm: “Jene sind in Streitwagen, jene sitzen auf Rossen. Wir aber werden groß werden im Namen des Herrn unseres Gottes”. Und durch die Gebete wurden sie verjagt im Namen des Herrn. Sie kamen einmal während der Dunkelheit in Lichtgestalt und sagten: Wir sind gekommen, Antonius, um dir zu leuchten. Ich aber schloss die Augen und betete, und sogleich erlosch das Licht der Gottlosen. Wenige Monate später erschienen sie, indem sie Psalmen sangen und Worte aus der Heiligen Schrift sprachen; ich aber “wie ein Tauber hörte nicht”. Einst erschütterten sie das Kloster, ich aber betete und blieb unbeweglich in meinem Sinne. Dann erschienen sie wiederum, lärmten, pfiffen, tanzten. Als ich aber betete und für mich allein dalag und Psalmen sang, begannen sie sogleich zu klagen und zu weinen, wie wenn sie ihre Kraft verloren hätten. Ich aber pries den Herrn, der ihre Kühnheit und ihren Wahnsinn zunichte machte und ihm ein Zeichen aufdrückte.</p>
      <h2>40</h2><p>Einmal erschien ein überaus großer Dämon in einem Trugbild und wagte zu sagen: Ich bin die Kraft Gottes; und ich bin die Vorsehung. Was willst du, daß ich dir schenke? Ich aber hauchte da gegen ihn im Namen Christi und versuchte ihn zu schlagen. Und es schien mir, als hätte ich ihn getroffen, und sogleich verschwand er mit all seinen Dämonen im Namen Christi. Als ich einst fastete, da kam der Arglistige auch als Mönch mit Broten in Truggestalt; er riet mir und sprach: Iß und höre auf mit deinen vielen Mühen! Auch du bist nur ein Mensch und wirst schwach werden. Ich aber merkte seine Hinterlist, stand auf und betete. Das hielt er nicht aus, er verschwand, und es schien, als gehe er durch die Türe wie Rauch. Wie oft ließ er mir in der Wüste Gold erscheinen, damit ich es nur nähme und besehe! Ich aber sang einen Psalm gegen ihn, und er schwand dahin. Oft peinigten sie mich mit Schlägen, ich aber sagte: “Nichts wird mich trennen von der Liebe zu Christus”. Dann schlugen sie sich gegenseitig. Aber nicht ich war es, der sie bändigte und niederrang, sondern der Herr, der da spricht: “Ich schaute den Satan, der wie ein Blitz vom Himmel fiel”. Meine Kinder, ich erinnerte mich des apostolischen Wortes und “wandte es auf mich an”, damit ihr lernt, nicht nachzulassen in der Askese und die Erscheinungen des Teufels und seiner Dämonen nicht zu fürchten.</p>
      <h2>41</h2><p>Da ich nun schon einmal durch meine Erzählung zum Toren geworden bin, so nehmt auch folgendes noch mit zu eurer Sicherung und Ermutigung; und glaubt mir, denn ich lüge nicht. Es klopfte einmal im Kloster jemand an meine Türe; ich trat heraus und sah eine große, hohe Erscheinung. Als ich nun fragte: Wer bist du? erwiderte er: Ich bin Satan. Da sagte ich: Wozu bist du hier? Er aber entgegnete: Weshalb tadeln mich die Mönche und alle anderen Christen ohne Grund? Warum fluchen sie mir stündlich? Als ich ihm antwortete: Warum belästigst du sie denn? sprach er: Nicht ich bin es, der ihnen beschwerlich fällt, sondern sie selbst verwirren sich; denn ich bin schwach. Oder haben sie nicht gelesen: “Des Feindes Schwerter sind endlich verschwunden, und du zerstörtest die Städte”. - Ich habe keinen Platz mehr, keine Waffe, keine Stadt. Überall sind Christen, und jetzt ist auch die Wüste mit Mönchen erfüllt. Sie sollen sich selbst behüten und nicht mich ohne Grund verwünschen. Da bewunderte ich die Gnade des Herrn und sprach zu ihm: Obgleich du immer lügst und niemals die Wahrheit sprichst, hast du doch jetzt, wenn auch wider Willen, wahr gesprochen. Denn Christus hat durch seine Ankunft dich zur Ohnmacht verdammt, er hat dich niedergeworfen und entwaffnet. Als jener aber den Namen des Heilandes hörte und seine Glut nicht ertragen konnte, wurde er unsichtbar.</p>
      <h2>42</h2><p>Wenn also der Teufel sogar selbst zugibt, daß er nichts vermag, müssen wir ihn und seine Dämonen gänzlich verachten. Zwar hat der Feind mit seinen Hunden so viele Listen, wir aber können ihn verachten, da wir seine Schwäche kennen gelernt haben. Laßt uns also in Gedanken nicht fallen, laßt uns in der Seele nicht an Furcht denken, wollen wir uns nicht selbst Angst einjagen, indem wir sagen: Wenn nur kein Dämon kommt und mich zur Umkehr zwingt. Wenn er mich nur nicht ergreift und niederwirft oder plötzlich herankommt und mich in Verwirrung bringt! Wir wollen durchaus nicht an etwas Derartiges denken, wir wollen auch nicht trauern, als ob wir zugrunde gingen; wir wollen vielmehr Mut fassen und uns immer freuen, daß wir gerettet werden. Wir wollen in unserem Inneren erwägen, daß der Herr mit uns ist, der sie verscheuchte und niederwarf. Wir wollen überlegen und immer beherzigen, daß die Feinde uns nichts tun werden, da der Herr mit uns ist. Denn wenn sie erscheinen, verhalten sie sich selbst so gegen uns, wie sie uns antreffen, und nach den Gedanken, die sie in uns finden, gestalten sie auch ihre Trugbilder. Wenn sie uns nun feige und in Verwirrung finden, dann eilen sie sogleich herbei wie Räuber, die einen Platz ohne Bewachung treffen; und was wir von uns selbst denken, das vergrößern sie noch obendrein. Wenn sie uns furchtsam und feige sehen, dann vermehren sie die Mutlosigkeit durch ihre Erscheinungen und Drohungen, und die arme Seele wird damit gefoltert. Wenn sie uns dagegen freudig im Herrn finden, wie wir überdenken die zukünftigen Güter, die Gaben des Herrn, wie wir erwägen, daß alles in der Hand des Herrn liegt, daß ein Dämon nichts gegen einen Christen vermag, daß er überhaupt keine Macht hat gegen jemand: wenn sie nur die Seele durch solche Gedanken behütet sehen, dann wenden sie sich beschämt ab. So wich der Feind von Job zurück, als er ihn geschirmt fand. Den Judas aber, den er entblößt von all diesem traf, brachte er in seine Gewalt. Wenn wir also den Feind verachten wollen, mögen wir immer an die Gnaden des Herrn denken, und die Seele soll sich beständig freuen in froher Hoffnung. Dann werden wir das Getändel der Dämonen ansehen wie Rauch, wir werden wahrnehmen, wie sie nicht verfolgen, sondern fliehen. Denn wie ich vorher sagte, sind sie gar feig, da sie immer das ihnen bereitete Feuer erwarten.</p>
      <h2>43</h2><p>Auch folgendes soll noch in euch ein Zeichen der Furchtlosigkeit vor ihnen sein: Wenn eine Erscheinung geschieht, so falle nicht nieder in Feigheit, sondern frage zuerst mutig, von welcher Art sie auch sei: Wer bist du und woher kommst du? Und wenn es ein Gesicht von Heiligen ist, dann geben sie dir Sicherheit und wandeln deine Furcht in Freude. Wenn die Erscheinung aber eine teuflische ist, dann wird sie sogleich kraftlos, wenn sie den Geist stark sieht; denn es ist ein Zeichen von Seelenruhe, wenn man einfach fragt: Wer bist du und woher kommst du? So fragte der Sohn Naves und kam zur Erkenntnis, und es blieb der Feind dem Daniel nicht verborgen, der ihn ausforschte.</p>
      <h2>44</h2><p>Alle freuten sich über die Unterweisung des Antonius; bei den einen wuchs die Liebe zur Tugend, bei den anderen verschwand die Nachlässigkeit, bei den dritten hörte die Einbildung auf. Alle ließen sich überreden, die dämonische Nachstellung zu verachten, und sie bewunderten die dem Antonius vom Herrn verliehene Gnade der Erkenntnis der Geister. In dem Gebirge lagen die Klöster wie Zelte voll göttlicher Chöre, die Psalmen sangen und sich der Lesung der Schrift befleißigten, die fasteten und beteten, die sich freuten über die Hoffnung auf die Zukunft, die arbeiteten am Werke der Barmherzigkeit, die Liebe und Eintracht pflegten untereinander. Es war das alles in Wahrheit anzusehen wie ein Reich für sich, voll Gottesfurcht und Gerechtigkeit. Hier gab es niemand, der Unrecht tat oder litt, man wußte nichts von dem gehässigen Treiben der Steuereinnehmer; es war eine Schar von Asketen, und die Gedanken aller waren auf eines allein gerichtet, auf die Tugend. Wenn einer die Klöster sah und die Haltung der Mönche, dann mußte er ausrufen und sagen: “Wie schön sind deine Häuser, Jakob, und deine Zelte, Israel! Wie schattige Täler und wie ein Lustgarten am Flusse, wie Zelte, die aufgestellt hat der Herr, und wie Zedern am Wasser”.</p>
      <h2>45</h2><p>Antonius aber zog sich nach seiner Gewohnheit auf sich allein zurück in seinem Kloster; er steigerte seine Askese und seufzte täglich im Gedanken an die Wohnungen des Himmels, er sehnte sich nach ihnen und erwog die Vergänglichkeit des menschlichen Lebens. Wenn er essen und schlafen wollte oder die übrige Notdurft des Körpers befriedigte, dann schämte er sich, indem er an die geistige Natur der Seele dachte. Wenn er mit vielen anderen Mönchen zusammen essen wollte, dann erinnerte er sich oft seiner geistigen Nahrung, schlug die Speise aus und ging weit weg von ihnen, da er glaubte erröten zu müssen, wenn ihn andere essen sähen. Er aß jedoch allein, weil ihn die Rücksicht auf seinen Körper dazu zwang; oft tat er es auch gemeinsam mit den Brüdern; er schämte sich zwar vor ihnen, tröstete sich aber mit dem Gedanken an seine nützlichen Ermahnungen. Er erklärte, man müsse seine ganze Zeit eher der Seele als dem Körper widmen; man müsse zwar notgedrungen einen kleinen Teil der Zeit an den Leib wenden, im ganzen aber mehr der Seele leben und ihren Nutzen suchen, damit sie nicht herabgezogen werde von den Lüsten des Körpers, sondern vielmehr den Leib knechte; denn dies sei der Auftrag des Heilandes: “Kümmert euch nicht in euren Herzen darum, was ihr essen oder was ihr eurem Körper anziehen werdet. Suchet nicht, was ihr esset oder was ihr trinket, und erhebt euch nicht. Denn dies alles tun die Kinder der Welt. Euer Vater aber weiß, was ihr von all diesem nötig habt. Suchet vielmehr vor allem sein Reich, und all dieses wird euch hinzugegeben werden”.</p>
      <h2>46</h2><p>Darauf kam über die Kirche die damals ausbrechende Verfolgung des Maximinus. Als die heiligen Märtyrer nach Alexandria geführt wurden, verließ er das Kloster und folgte ihnen nach, indem er sagte: Wohlan, laßt uns auch weggehen, damit wir berufen werden und streiten oder die Kämpfer sehen. Er hatte Sehnsucht danach, Blutzeuge zu werden. Da er sich aber nicht ausliefern wollte, diente er den Bekennern in den Bergwerken und Gefängnissen. Vor Gericht zeigte er großen Eifer, die vorgeladenen Glaubensstreiter mit Zuversicht zu stärken und sie, wenn sie Zeugnis ablegten, in Empfang zu nehmen und zu geleiten, bis sie vollendet hatten. Als der Richter seinen und seiner Jünger Mut und Eifer dafür wahrnahm, befahl er, daß kein Mönch vor Gericht erscheine noch überhaupt weiter in der Stadt bleibe. Alle anderen beschlossen, sich diesen Tag zu verbergen. Antonius aber achtete nicht im geringsten auf den Befehl; er wusch vielmehr sein Obergewand, stellte sich am folgenden Tag vorne hin auf einen erhöhten Platz und zeigte sich dem Vorsitzenden in seiner ganzen Pracht. Alle wunderten sich darüber, und auch der Gerichtsherr sah es; als dieser mit seiner Schar vorbeiging, blieb Antonius furchtlos stehen und gab ein Beispiel des Mutes von uns Christen; denn, wie ich vorher bemerkte, er wünschte sich gleichfalls das Martyrium. Und es schien ihn zu schmerzen, daß er nicht Zeugnis abgelegt hatte. Der Herr aber bewahrte ihn zu unserem und anderer Heil, auf daß er auch in der Askese, die er aus der Schrift gelernt hatte, ein Lehrer für viele werde. Denn wenn sie nur seinen Lebenswandel sahen, bestrebten sich viele, ihm nachzueifern. Er diente nun wieder, wie er es gewohnt war, den Bekennern und mühte sich ab in seinen Dienstleistungen, gleich als ob er mit ihnen gefangen wäre.</p>
      <h2>47</h2><p>Als dann die Verfolgung aufhörte und der selige Bischof Petrus das Martyrium erlitten hatte, da entfernte sich Antonius und zog sich wieder in das Kloster zurück; hier legte er täglich Zeugnis ab in seinem Gewissen und kämpfte in den Kämpfen des Glaubens; er pflegte eine eifrige und noch strengere Askese; immer nämlich fastete er, als Bekleidung diente ihm ein Untergewand, das Haare hatte, während das Obergewand aus Fellen war; dies Gewand behielt er bis an sein Lebensende; seinen Körper wusch er nicht mit Wasser, um den Schmutz zu entfernen, die Füße badete er nicht oder ließ es sich auch nur gefallen, sie in das Wasser zu tauchen ohne dringende Not. Niemals sah ihn jemand nackt, und überhaupt erblickte kein Mensch den bloßen Körper des Antonius, ausgenommen damals, als er nach seinem Tode bestattet wurde.</p>
      <h2>48</h2><p>Wie er sich nun so zurückzog, setzte er sich eine gewisse Frist, während der er selbst nicht erschien, aber auch keinen anderen zu sich ließ. Da kam ein gewisser Martinianus, ein Offizier, und fiel dem Antonius beschwerlich; er hatte nämlich eine Tochter, die von einem Dämon gequält wurde. Der klopfte nun lange an die Türe und bat ihn, er möge herauskommen und zu Gott wegen des Kindes beten. Antonius brachte es nicht über sich, zu öffnen, sondern er beugte sich von oben herab und sagte: “Mann, warum schreist du nach mir? Auch ich bin nur ein Mensch wie du. Wenn du aber an Christus glaubst, dem ich diene, dann entferne dich, bete zu Gott, wie es dein Glaube dich heißt, und es wird sich erfüllen.” Jener glaubte sogleich, rief Christus an, und als er weggegangen, war seine Tochter von dem Dämon befreit. Vieles andere noch wirkte der Herr durch ihn, der da spricht: “Bittet und es wird euch gegeben werden”. Denn sehr viele von den Leidenden schliefen, ohne daß er nur die Türe öffnete, außerhalb des Klosters, und sie wurden gereinigt durch den Glauben und aufrichtiges Gebet.</p>
      <h2>49</h2><p>Als jedoch Antonius sah, daß er von vielen belästigt werde und daß man ihn nicht nach Absicht, wie er es doch wünschte, in Einsamkeit leben lasse, da ging er mit sich zu Rate und brach eilig auf nach Oberthebais zu Menschen, die ihn nicht kannten; denn er war auf seiner Hut, sich nicht wegen der Dinge, die der Herr durch ihn wirkte, zu überheben, auch wollte er nicht, daß ein anderer ihn deshalb über Gebühr schätze. Er nahm von den Brüdern Brote an und setzte sich dann an das Flussufer, um zu sehen, ob ein Schiff vorbeikäme, mit dem er flußaufwärts fahren könne. Während er noch in Gedanken dabei verweilte, erscholl eine Stimme von oben zu ihm:,,Antonius, wohin gehst du und weshalb?" Er aber geriet nicht in Verwirrung, sondern wie wenn er es gewohnt wäre, oft so gerufen zu werden, hörte er zu, antwortete und sprach: “Da mir die vielen Menschen nicht erlauben, in der Einsamkeit zu leben, deshalb will ich hinauf nach Oberthebais, wegen der vielen Belästigungen, die daraus für mich entspringen, besonders aber, weil ich von ihnen um Dinge gebeten werde, die über meine Kräfte gehen.” Die Stimme aber sprach zu ihm: “Wenn du auch nach Oberthebais gehst und selbst wenn du, wie du es vorhast, zu den Weideplätzen entweichst, ich sage dir, du wirst noch eine größere, ja die zweifache Mühe zu ertragen haben. Wenn du wirklich für dich leben willst, dann gehe jetzt hinauf in die innere Wüste.” Antonius aber entgegnete: “Und wer wird mir den Weg weisen; denn ich kenne ihn nicht!” Da zeigte ihm die Stimme sogleich Sarazenen, die den Weg ziehen wollten. Antonius ging zu ihnen hin, näherte sich ihnen und bat sie, daß er mit ihnen in die Wüste wandern dürfe. Sie aber nahmen ihn, wie auf einen Befehl der Vorsehung hin, freundlich auf. Er wanderte drei Tage und drei Nächte mit ihnen und gelangte an einen sehr hohen Berg. Am Fuße des Berges floß überaus klares Wasser, das süß und sehr kalt war. Weiter draußen aber war eine Ebene und einige dürftige Dattelpalmen.</p>
      <h2>50</h2><p>Antonius gewann den Ort wie durch göttliche Vorsehung lieb; denn er war es, den ihm der, welcher am Flußufer zu ihm gesprochen, gezeigt hatte. Anfangs nun nahm er von seinen Reisegefährten Brote an und blieb allein auf dem Berge, ohne daß ein anderer bei ihm war; denn er besaß jetzt den Platz, wie wenn er darin sein eigenes Haus gefunden hätte. Als die Sarazenen den Eifer des Antonius wahrnahmen, zogen sie absichtlich auf jenem Wege durch die Wüste und brachten ihm freudig Brote; eine kleine und einfache Erfrischung boten ihm damals auch die Dattelpalmen. Als dann die Brüder seinen Aufenthalt kennen gelernt hatten, da nahmen sie wie Kinder, die sich ihres Vaters erinnern, die Sorge auf sich, ihm Brot zu senden; wie aber Antonius sah, daß da einige wegen des Brotes geplagt wurden und sich Mühen auferlegten, da wollte er auch hierin die Mönche schonen, ging mit sich zu Rate und bat einige von seinen Besuchern, ihm eine zweizinkige Hacke, ein Beil und ein wenig Getreidekorn zu bringen. Als er dies alles erhalten, da durchforschte er die Umgebung des Berges, fand einen kleinen, geeigneten Platz und bestellte das Land; und da er es aus seiner Quelle reichlich begießen konnte, säte er aus. Nachdem er dies ein Jahr lang getrieben hatte, gewann er davon sein Brot; er freute sich, daß er keinem deswegen lästig falle und in allem anspruchslos bleibe. Als er dann wieder einige Besucher bei sich sah, baute er auch ein wenig Gemüse, damit sich die Gäste ein wenig nach der Mühsal des beschwerlichen Weges erfrischen könnten. Anfangs beschädigten die wilden Tiere der Wüste, die des Wassers wegen kamen, oft seine Saat und seinen Landbau. Er nahm freundlich eines von den Tieren gefangen und sagte zu allen: “Warum fügt ihr mir Schaden zu, der ich keinem von euch etwas zuleide tue? Gehet weg und im Namen des Herrn naht euch nicht mehr diesem Orte.” Von dieser Zeit an kam keines mehr dahin, wie wenn sie sich vor dem Gebote fürchteten.</p>
      <h2>51</h2><p>Er hielt sich weiter innen auf dem Berge auf, beschäftigt mit Gebet und Askese. Die Brüder aber, die ihm dienten, baten ihn, daß sie ihn jeden Monat besuchen und ihm Oliven, Hülsenfrüchte und Öl bringen dürften; denn er war jetzt hoch in den Jahren. Welche Kämpfe er während seines dortigen Aufenthaltes durchzumachen hatte, nach dem Bibelworte nicht gegen Fleisch und Blut, sondern gegen seine Gegner, die Dämonen, das haben wir von denen erfahren, die ihn besuchten. Denn auch dort hörten sie Lärm, viele Stimmen und Getöse wie von Waffen; und den Berg sahen sie nachts voll wilder Tiere; sie beobachteten den Antonius auch, wie er kämpfte, gleich als ob er sichtbare Gegner vor sich habe, und wie er gegen sie betete. Seine Besucher ermutigte er, er selbst aber kämpfte unter Kniebeugungen und Gebet zum Herrn. Und es war in Wahrheit bewundernswert, daß er, der allein in einer solchen Wüste weilte, sich weder vor den Angriffen der Dämonen fürchtete, noch sich ängstigte über die Wildheit so vieler vierfüßigen Tiere und Schlangen, die sich dort fanden. Er vertraute wahrhaftig, wie geschrieben steht, auf den Herrn, wie der Berg Sion, unbeweglichen und ruhigen Sinnes; vielmehr flohen die Dämonen, und die wilden Tiere lebten, wie es in der Schrift heißt, in Frieden mit ihm.</p>
      <h2>52</h2><p>Der Teufel aber beobachtete, wie David singt, den Antonius und knirschte wider ihn mit den Zähnen. Der aber wurde getröstet vom Heiland, und er blieb unversehrt von der List und vielgestaltigen Schlauheit des Bösen. Als der Heilige nachts wachte, sandte der Teufel wilde Tiere gegen ihn. Fast alle Hyänen jenes Wüstenstriches kamen aus ihren Schlupfwinkeln, sie umringten ihn, und er war mitten unter ihnen. Wie nun jede den Rachen aufsperrte und zu beißen drohte, da merkte er die List des Feindes und sagte zu ihnen allen: “Wenn ihr Macht erhalten habt gegen mich, bin ich bereit, mich von euch fressen zu lassen; wenn ihr aber von Dämonen geschickt seid, dann entweicht ohne Zögern. Denn ich bin ein Knecht Christi.” Als Antonius dies sagte, da flohen sie wie verfolgt von der Geißel seiner Rede.</p>
      <h2>53</h2><p>Wenige Tage darauf arbeitete er, denn er hielt darauf, tätig zu sein; da trat jemand an die Türe und zog an dem Bande, mit dem er beschäftigt war; er nähte nämlich Körbe und gab diese den Besuchern für das, was sie ihm brachten. Antonius stand auf und erblickte ein Wesen, das zwar bis zu den Schenkeln wie ein Mensch aussah, das aber Beine und Füße hatte wie ein Esel. Antonius bekreuzigte sich nur und sprach: “Ich bin ein Knecht Christi. Wenn du gegen mich gesandt wurdest, siehe, hier bin ich.” Aber das Tier mit seinen Dämonen entfloh so schnell, daß es infolge seiner Eile zu Fall kam und verendete. Der Tod des Tieres aber bedeutete den Sturz der Dämonen; denn alles mögliche hatten sie versucht, ihn aus der Wüste zu vertreiben, doch sie hatten es nicht vermocht.</p>
      <h2>54</h2><p>Einmal wurde er von den Mönchen gebeten, zu ihnen nach Unterägypten zu kommen und eine Zeitlang sie und ihre Niederlassungen zu besuchen; da zog er mit den Mönchen, die zu ihm gekommen waren; ein Kamel trug ihnen Brot und Wasser. Denn diese ganze Wüste ist wasserlos, und es gibt dort überhaupt kein Trinkwasser außer bei jenem Berge, wo seine Einsiedelei war; hier schöpften sie es auch für sich. Als nun das Wasser auf dem Wege ausging und die brennendste Hitze herrschte, da gerieten sie alle in große Gefahr. Sie streiften in der Gegend umher und fanden kein Wasser; endlich konnten sie nicht mehr gehen, legten sich zu Boden, ließen das Kamel laufen und verzweifelten an ihrer Rettung. Als der greise Antonius alle in Gefahr sah, geriet er in große Betrübnis und seufzte; dann ging er ein wenig von ihnen abseits, beugte die Knie, breitete die Arme aus und betete; und sogleich ließ der Herr an dem Ort, wo er im Gebete stand, Wasser herausströmen. Alle tranken nun und erholten sich; sie füllten die Schläuche, suchten das Kamel und fanden es. Das Halfter hatte sich nämlich zufällig um einen Stein geschlagen, und das Tier war so festgehalten worden. Sie führten es nun herbei, tränkten es, beluden es mit den Schläuchen und setzten ihren Weg unversehrt fort. Als Antonius zu den Klöstern, die außerhalb der Wüste lagen, kam, da begrüßten ihn alle, wie wenn sie ihren Vater sähen. Er selbst beschenkte sie mit seinen Erzählungen, die er gleichsam wie eine Wegzehrung von seinem Berge mitbrachte und teilte ihnen von seinen nützlichen Erfahrungen mit. Und wieder war Freude auf den Bergen und Eifer zum Fortschritt und Trost wegen des Glaubens untereinander. Auch er selbst freute sich, da er den Eifer der Mönche sah und weil er seine Schwester, die in ihrer Jungfräulichkeit zu Jahren gekommen, als Vorsteherin anderer Jungfrauen fand.</p>
      <h2>55</h2><p>Nach einigen Tagen ging er indes wieder zurück auf den Berg, und von jetzt an besuchten ihn viele; auch andere, die ein Leiden hatten, wagten es, zu ihm zu kommen. Für alle Mönche, die ihn aufsuchten, hatte er immer nur diese eine Ermahnung, sie sollten auf den Herrn vertrauen und ihn lieben; sie sollten sich hüten vor schmutzigen Gedanken und fleischlichen Lüsten und sich nicht, wie es in den Sprichwörtern heißt, verführen lassen von der Sättigung des Bauches; sie sollten die nichtige Ruhmsucht fliehen, beständig beten, Psalmen singen vor und nach dem Schlafen, sich einprägen die Gebote der Heiligen Schrift, sich erinnern der Taten der Heiligen, um durch ihre Nachahmung der Seele, indem sie der Gebote eingedenk bleibt, Harmonie zu verleihen. Besonders aber riet er, das Wort des Apostels beständig zu verwirklichen: “Die Sonne möge nicht untergehen über eurem Zorne”; sie möchten bedenken, daß dies allgemein von jedem Gebote gesagt sei, damit die Sonne nicht bloß nicht über unserem Zorne, sondern auch über keiner anderen Sünde von uns untergeht. Denn es sei schön und notwendig, daß die Sonne uns nicht wegen einer Sünde bei Tage, noch der Mond wegen eines Fehltrittes bei Nacht, oder überhaupt wegen einer inneren Erregung, verurteile. Damit nun dieser Zustand uns bewahrt bleibt, ist es gut, auf den Apostel zu hören und sein Gebot zu befolgen, wenn er sagt: “Beurteilet euch selbst und prüfet euch”. Also soll jeder täglich sich Rechenschaft geben von seinen Handlungen bei Tage und bei Nacht. Wenn er gesündigt hat, soll er aufhören; wenn er aber nicht gesündigt hat, soll er sich nicht rühmen. Er soll vielmehr im Guten verharren, nicht sorglos sein, den Nächsten nicht verurteilen noch sich selbst rechtfertigen, wie der selige Apostel Paulus sagte, bis der Herr kommt, der das Verborgene erforscht. Denn oft bleiben wir uns selbst in dem, was wir tun, verborgen, wir wissen es nicht, der Herr aber bemerkt alles. Ihm wollen wir das Urteil anheimstellen, wir aber wollen gemeinsam dulden und einander die Bürde tragen, uns selbst aber wollen wir prüfen, und wenn wir etwas versäumt haben, trachten, es zu erfüllen. Folgendes soll noch ein Schutzmittel sein, um Sicherheit vor der Sünde zu erlangen: Ein jeder von uns soll die Handlungen und Regungen der Seele bemerken und aufzeichnen, als ob wir sie einander mitteilen wollten; und seid überzeugt, daß wir, wenn wir überhaupt uns scheuen, erkannt zu werden, aufhören zu sündigen oder etwas Schlechtes nur zu denken. Denn wer will, wenn er sündigt, gesehen werden? Oder wer lügt nicht lieber, wenn er gesündigt hat, da er verborgen bleiben will? Wie wir, wenn wir einander sähen, nicht Unzucht treiben würden, so werden wir uns auch, wenn wir unsere Gedanken aufzeichnen, als ob wir sie einander mitteilen sollten, uns eher hüten vor schmutzigen Gesinnungen, da wir uns scheuen, erkannt zu werden. Die Aufzeichnung soll an die Stelle der Augen der Mitasketen treten, damit wir nicht einmal an Schlimmes denken, da wir beim Schreiben erröten, als ob wir gesehen würden. Wenn wir uns so bilden, können wir den Leib unterwerfen und dem Herrn wohlgefallen, die Listen des Feindes aber vereiteln.</p>
      <h2>56</h2><p>So sprach er zu seinen Besuchern; mit den Leidenden aber trug er gemeinsam das Leid und betete mit ihnen; oft und bei vielen erhörte ihn der Herr; wenn er Gehör fand, dann prahlte er nicht, wenn er nicht erhört wurde, dann murrte er nicht, sondern immer dankte er dem Herrn, die Kranken aber tröstete er und forderte sie auf, guten Mutes zu sein und zu bedenken, daß die Heilung weder seine Sache noch überhaupt die der Menschen sei, sondern allein in der Hand Gottes liege, der sie bewirke, wann er wolle und an wem er wolle. Die Leidenden nahmen auch die Worte des Greises wie die Heilung an, und sie lernten selbst nicht nachzulassen, sondern vielmehr auszuharren; die aber, welche Heilung fanden, wurden belehrt, nicht dem Antonius zu danken, sondern Gott allein.</p>
      <h2>57</h2><p>Einer nun, namens Fronto, vom Palation, hatte ein schweres Leiden; er zerfleischte seine Zunge und war in Gefahr, sein Augenlicht zu verlieren; der kam auf den Berg und bat den Antonius, für ihn zu beten. Dieser tat es und sagte dann zu Fronto: “Gehe weg von hier, dann wirst du geheilt.” Als dieser aber hartnäckig war und einige Tage auf dem Berge blieb, sagte Antonius von neuem: “Du kannst nicht geheilt werden, wenn du hier bleibst. Gehe weg aus der Wüste, und wenn du nach Ägypten kommst, wirst du das Zeichen sehen, das über dich geschieht.” Fronto glaubte und entfernte sich, und wie er Ägypten nur sah, hörte sein Leiden auf, und der Mann wurde gesund nach dem Ausspruch des Antonius, den dieser in seinem Gebete vom Heiland erhalten hatte.</p>
      <h2>58</h2><p>Ein junges Mädchen aus Busiris in Tripolis hatte ein schweres und abscheuliches Leiden; ihre Tränen nämlich und der Nasenschleim und die Ohrenflüssigkeit wurden, wenn sie zu Boden fielen, sogleich zu Würmern; auch ihr Körper war gelähmt und ihre Augen waren wider die Natur gebildet. Als ihre Eltern erfahren hatten, daß Mönche zu Antonius reisten, da baten sie im Vertrauen auf den Herrn, der die Blutflüssige geheilt hatte, mit ihrer Tochter sich ihnen anschließen zu dürfen. Diese ließen es geschehen; die Eltern blieben mit dem Kinde außerhalb des Berges, bei Paphnutius, dem Bekenner und Mönch. Die Brüder aber gingen hinein, und als sie eben von der Jungfrau berichten wollten, kam Antonius ihnen zuvor, erzählte das Leiden des Kindes und daß es mit ihnen gereist sei. Als diese dann baten, es möchte auch den Eltern gestattet werden, herein zu kommen, da erlaubte er dies zwar nicht, er sagte aber: “Gehet zurück, und ihr werdet sie geheilt finden, wenn sie nicht gestorben ist. Denn nicht mein ist die gute Handlung, weshalb sie zu mir, dem armseligen Menschen, kommen müßte, sondern die Heilung ist das Werk des Erlösers, der überall sein Erbarmen zeigt denen, die ihn anrufen. Und ihr hat der Herr auf ihr Gebet Gehör geschenkt, mir aber hat seine Menschenfreundlichkeit geoffenbart, daß er das Leiden des Kindes, während es noch dort weilt, heilen will.” Und das Wunder geschah wirklich; sie gingen hinaus und fanden die Eltern voll Freude, das Kind aber war gesund von dieser Stunde an.</p>
      <h2>59</h2><p>Als einmal zwei Brüder auf der Reise zu Antonius waren, ging ihnen auf dem Wege das Wasser aus; der eine starb, der andere war nahe daran. Da er nicht mehr imstande war, weiterzukommen, legte er sich auch auf die Erde und erwartete den Tod. Antonius aber, der auf dem Berge weilte, rief zwei Mönche, die zufällig bei ihm waren, drängte sie zur Eile und sagte: “Nehmt ein Gefäß mit Wasser und lauft auf dem Weg nach Ägypten; denn von zwei Wanderern ist der eine eben verschieden, der andere aber wird sterben, wenn ihr nicht eilt. Dies ist mir gerade, als ich betete, geoffenbart worden.” Die Mönche gingen hin, fanden den Toten daliegen und begruben ihn, den anderen aber riefen sie durch das Wasser zum Leben zurück und führten ihn zu dem greisen Antonius; die Entfernung betrug einen Tagemarsch. Wenn man nun nachgrübelt, warum er nicht vor dem Tode des einen gesprochen, dann handelt man nicht recht hierin. Denn die Entscheidung über den Tod lag nicht bei Antonius, sondern bei Gott, der über den einen sein Urteil sprach, während er des zweiten Gefahr enthüllte. An Antonius war nur das wunderbar, daß er auf dem Berge mit klarem Geiste saß und den Herrn zur Seite hatte, der ihm zeigte, was in der Ferne vorging.</p>
      <h2>60</h2><p>Wieder einmal saß er auf dem Berge, blickte auf und sah in der Luft einen Menschen, der emporgeführt wurde, während die, die ihm entgegenkamen, voll Freude waren. Er wunderte sich, pries diese Versammlung selig und hätte dann gerne erfahren, was dies bedeute. Und sogleich tönte eine Stimme zu ihm herab, dies sei die Seele des Amun, des Mönches in Nitria. Dieser war bis in sein höchstes Alter Asket geblieben. Die Entfernung von Nitria bis zu dem Berge, wo Antonius war, beträgt dreizehn Tagereisen. Die Umgebung des Heiligen sah die Verwunderung des Greises, sie wollten den Grund erfahren und hörten, daß eben Amun gestorben sei. Er war bekannt, weil er sich oft hier eingefunden hatte und auch durch ihn viele Zeichen geschehen waren. Eines davon ist folgendes: Er mußte einst den Lykosfluß überschreiten, als eben die Zeit der Überschwemmung war. Da bat er seinen Begleiter Theodorus, sich weit von ihm zu entfernen, damit sie einander beim Durchschwimmen des Flusses nicht nackt sähen. Als nun Theodorus weggegangen war, schämte er sich, sich selbst nackt zu erblicken. Während er noch so mit seiner Scham kämpfte und sich kümmerte, wurde er mit einem Male auf das jenseitige Ufer versetzt. Theodorus, der gleichfalls ein frommer Mann war, näherte sich, sah ihn schon drüben, ohne daß er im geringsten vom Wasser benetzt worden wäre und wollte erfahren, wie er hinübergekommen sei. Als er merkte, daß es Amun nicht sagen wolle, da umschlang er seine Füße und versicherte, er werde ihn nicht eher loslassen, bis er es von ihm gehört. Als nun Amun die Hartnäckigkeit des Theodorus eben aus seiner Versicherung wahrnahm, da verlangte er, er möge es niemand bis zu seinem Tode sagen; dann erzählte er ihm, er sei aufgehoben und auf dem gegenüberliegenden Ufer niedergesetzt worden. Er sei nicht durch das Wasser gegangen, das sei für Menschen überhaupt unmöglich, außer für den Herrn und für die, denen er es erlaube, wie er es mit dem großen Apostel Petrus machte. Nach dem Tode des Amun erzählte Theodorus die Begebenheit. Die Mönche aber, denen Antonius vom Tode des Amun gesprochen, merkten sich die Zeit; und als nach dreißig Tagen Brüder von Nitria heraufkamen, erkundigten sie sich und erfuhren, daß Amun an jenem Tage und zur gleichen Stunde entschlafen sei, wo der Greis seine Seele emporschweben sah. Und beide Teile bewunderten die Reinheit der Seele des Antonius, wie er das, was in einer Entfernung von dreizehn Tagereisen geschehen war, sogleich erfahren hatte und sah, wie die Seele hinaufgetragen wurde.</p>
      <h2>61</h2><p>Auch der Komes Archelaus fand ihn einmal auf dem äußeren Berge und bat ihn nur, er möge beten für Polykratia, die bewundernswerte, Christus im Herzen tragende Jungfrau in Laodicäa. Sie litt an einer schweren Magenkrankheit und an Seitenstechen infolge der übermäßigen Askese und war schwach am ganzen Körper. Antonius betete, der Komes aber merkte sich den Tag, an dem das Gebet geschehen war, er kehrte nach Laodicäa zurück und fand die Jungfrau gesund. Er erkundigte sich, wann und an welchem Tage sie von ihrer Schwäche befreit worden sei, und zog sein Notizbuch hervor, in das er die Zeit des Gebetes geschrieben hatte. Als er sich vergewissert, zeigte er sogleich die Aufzeichnung in dem Buche her; und alle wunderten sich, als sie erkannten, daß der Herr sie zur gleichen Zeit von ihren Leiden befreite, als Antonius im Gebete war und die Güte des Heilandes für sie anrief.</p>
      <h2>62</h2><p>Von den Leuten, die zu ihm kamen, sagte er es oft tagelang voraus, bisweilen aber auch einen Monat und dazu den Grund, weshalb sie kamen. Die einen nämlich stellten sich ein, bloß um ihn zu sehen, andere wegen einer Krankheit und wieder andere, da sie von Dämonen gequält wurden. Und sie alle hielten die Mühe der Reise weder für eine Qual noch für eine Strafe; denn keiner kehrte zurück, ohne daß er einen Nutzen erfahren hätte. Trotz seiner Worte und Gesichte bat er jeden, nicht ihn deshalb zu bewundern, sondern vielmehr den Herrn, weil er uns armen Menschen die Gnade verliehen, ihn nach Kräften zu erkennen.</p>
      <h2>63</h2><p>Einmal kam er wieder zu den äußeren Klöstern hinunter; man bat ihn, in ein Schiff zu kommen und mit den Mönchen zu beten. Da merkte er allein einen schrecklichen und durchdringenden Gestank. Als die Leute des Fahrzeuges sagten, es seien Fische und Eingesalzenes darin und daher komme der Geruch, da erklärte er, das sei eine andere Art von Gestank. Während er noch sprach, schrie ein Jüngling, der einen Dämon hatte und der vorher hineingekommen war und in dem Schiffe sich verborgen hatte, sogleich laut auf. Der Dämon aber wurde verflucht im Namen unseres Herrn Jesu Christi und fuhr aus; der Mensch aber wurde gesund. Alle erkannten, daß der Gestank von dem Dämon gekommen war.</p>
      <h2>64</h2><p>Ein anderer vornehmer Mann kam zu ihm mit einem Dämon. Dieser Teufel war aber so mächtig, daß der Besessene nicht einmal erkannte, daß er zu Antonius kam. Er schlang sogar den Auswurf seines Körpers hinunter. Die nun, welche ihn herbeibrachten, baten den Antonius, für ihn zu beten; Antonius aber, der sich des Jünglings erbarmte, betete und wachte die ganze Nacht mit ihm. Gegen Morgen kam der junge Mann plötzlich zu Antonius und stieß ihn; seine Begleiter waren darüber unwillig, der Greis aber sprach: “Zürnet dem Jüngling nicht! Denn nicht er ist es, sondern der Dämon in ihm. Da er verflucht wurde und den Befehl erhielt, in wasserlose Einöden zu entweichen, da fing er an zu rasen und hat dies getan. Lobet also vielmehr den Herrn! Denn daß dieser so gegen mich losging, das ist für euch ein Zeichen dafür, daß der Dämon entwichen ist.” Nach diesen Worten des Antonius wurde der Jüngling sogleich gesund; von da an hatte er seinen klaren Verstand, er merkte, wo er war, und umarmte den Greis, voll Dank gegen Gott.</p>
      <h2>65</h2><p>Vieles andere der Art, was er wirkte, haben übereinstimmend und gleichmäßig sehr viele von den Mönchen über ihn berichtet. Das alles ist aber nicht so bewundernswert, anderes erscheint noch merkwürdiger. Als er einmal um die neunte Stunde essen wollte und aufstand, um zu beten, da fühlte er sich im Geiste entrückt; und - wie seltsam - er stand da und sah sich außer sich selbst, wie wenn er von einigen Wesen in die Luft entführt werde; dann erblickte er einige widerwärtige und schreckliche Gestalten im Luftraum, die ihn hindern wollten, hindurchzugehen. Seine Führer widerstanden, jene aber verlangten Rechenschaft, ob er ihnen nicht untertänig sei. Wie sie nun eine Prüfung von seiner Geburt an anstellen wollten, da verhinderten dies die, welche den Antonius geleiteten, indem sie zu jenen sagten: “Die Schuld von seiner Geburt her hat der Herr ausgelöscht; von der Zeit an aber, wo er Mönch geworden ist und sich Gott versprochen hat, soll es euch erlaubt sein, Rechenschaft zu nehmen.” Da erhoben jene die Anklage, konnten aber den Beweis nicht führen, und so erhielt er freie und ungehinderte Bahn. Und sogleich sah er sich wieder in Bewegung, zu sich selbst hintreten, und er war wieder ganz Antonius. Da vergaß er das Essen und verharrte den Rest des Tages und die ganze Nacht hindurch in Seufzen und Gebet. Denn er erstaunte, als er sah, gegen wie viele Feinde wir kämpfen müssen und mit wie vielen Mühen man die Luft durchwandern muß. Er erinnerte sich, daß eben dies gemeint sei, was der Apostel verkündete: “Nach dem Herrn, der Macht hat über die Luft”. Denn darin hat der Feind die Macht, zu kämpfen, und zu versuchen, die zu hindern, welche hindurchgehen. Deshalb mahnte der Apostel ganz besonders: “Nehmet auf die Rüstung Gottes, damit ihr widerstehen könnt an jenem schrecklichen Tage”, damit der Feind “beschämt wird, wenn er nichts Schlimmes über euch sagen kann”. Wir aber, die wir das gelernt haben, wollen uns erinnern des Ausspruches des Apostels: “Sei es im Körper, ich weiß es nicht; sei es außerhalb des Körpers, ich weiß es nicht; Gott aber weiß es”. Paulus wurde bis zum dritten Himmel entrückt und kam zurück, nachdem er “geheimnisvolle Worte” gehört hatte. Antonius aber sah sich bis in die Luft kommen und kämpfen, bis er frei wurde.</p>
      <h2>66</h2><p>Er besaß auch folgende Gnadengabe. Wenn er allein auf dem Berge saß, etwas bei sich suchte und unsicher war, dann wurde ihm dies auf sein Gebet von der Vorsehung enthüllt; der Selige stand, wie es in der Schrift heißt, in göttlicher Unterweisung. Er hatte hierauf einmal eine Unterredung mit einigen, die zu ihm kamen, über den Zustand der Seele und darüber, welcher Ort ihr nach diesem Leben bestimmt sei. In der folgenden Nacht rief ihn jemand von oben an und sagte:,,Antonius, stehe auf, gehe hinaus und sieh!" Er ging hinaus, denn er wußte, welchen man gehorchen müsse, blickte auf und sah eine große Gestalt, mißgeformt und furchtbar, die dastand und bis zu den Wolken reichte; auch sah er Wesen, welche aufwärts stiegen, wie wenn sie Flügel hätten. Und der Riese streckte die Arme aus; die einen hielt er ab, die anderen aber flogen darüber und wurden dann, nachdem sie durchgekommen waren, sicher emporgetragen. Über solche nun knirschte der Riese mit den Zähnen, über die aber, welche herunterfielen, freute er sich. Und sogleich richtete sich an Antonius eine Stimme: “Verstehe, was du siehst!” Der Verstand wurde ihm aufgetan, und er begriff, daß dies der Hinübergang der Seelen sei und der dastehende Riese der Feind, der auf die Gläubigen voll Neid ist; und wie er die, welche ihm verfallen sind, ergreift und hindert hindurchzukommen, während er die, welche ihm nicht gefolgt haben, nicht fassen kann, da sie über ihn weggehen. Als er dies wieder gesehen hatte, kämpfte er in der Erinnerung daran nur noch mehr, um täglich vollkommener zu werden. Er hat das Erlebnis nicht aus freien Stücken erzählt; während er aber im Gebet verweilte und in Staunen versunken war, fragten ihn einige aus seiner Umgebung und drängten ihn, und so wurde er genötigt, zu sprechen, da er es als Vater seinen Kindern nicht verbergen konnte. Er glaubte dazu auch, daß sein Gewissen rein sei, für sie aber die Erzählung nützlich werde, wenn sie lernten, daß die Frucht der Askese gut sei und daß man oft als ein Linderungsmittel der Mühen Gesichte erhalte.</p>
      <h2>67</h2><p>In seinem Wesen war er langmütig im Ertragen von Unrecht und demütig in seiner Seele; in dieser Gesinnung ehrte er den Kanon der Kirche über die Maßen und wünschte, daß jeder Kleriker an Ehre vor ihm käme; vor den Bischöfen und Presbytern sich zu verneigen, nahm er keinen Anstand, und wenn einmal ein Diakon der Erbauung wegen zu ihm kam, dann sprach er mit ihm über das, was nützlich war; im Gebete aber gab er ihm den Vortritt, da er gerne selbst lernte. Er fragte oft und wollte von seiner Umgebung etwas hören; und er gestand, daß es ihm nützlich sei, wenn jemand etwas Treffliches gesagt habe. Sein Angesicht strahlte in reicher und seltener Anmut. Auch diese Gnade besaß er vom Heiland. Wenn er sich nämlich unter der Schar der Mönche befand und es wollte ihn jemand sehen, der ihn noch nicht kannte, dann trat er sogleich hinzu, überging die anderen und eilte zu ihm, gleichsam angezogen von seinen Augen. Aber nicht durch Größe oder kräftige Gestalt unterschied er sich von den übrigen, sondern durch die Art seines Wesens und die Reinheit der Seele. Denn da sie voll Ruhe war, waren auch seine äußeren Sinne im Gleichgewicht; die Heiterkeit der Seele drückte auch seinem Gesicht den Stempel der Freude auf und umgekehrt, aus den Bewegungen seines Körpers merkte und ersah man die Verfassung der Seele nach dem Worte der Schrift: “Wenn das Herz sich freut, strahlt das Antlitz. Wenn es aber traurig ist, sieht es finster aus”. So merkte Jakob, wie Laban ihm Böses zufügen wollte und sagte zu den Frauen: “Das Gesicht eures Vaters ist nicht wie gestern und vorgestern”. So erkannte Samuel den David; denn er hatte freundliche Augen und Zähne weiß wie Milch. So erkannte man auch den Antonius; denn er war niemals in Unruhe, da seine Seele voll heiteren Friedens war; niemals wurde er finster, da sein Geist sich freute.</p>
      <h2>68</h2><p>Im Glauben war er überaus bewundernswert und fromm. Niemals hatte er Gemeinschaft mit den schismatischen Meletianern, da er ihre Schlechtigkeit von Anbeginn und ihren Abfall kannte. Auch mit den Manichäern oder irgendwelchen anderen Häretikern sprach er nicht freundschaftlich, außer wenn er sie ermahnte, zur wahren Frömmigkeit zurückzukehren. Denn er glaubte und sagte es auch offen, daß ihre Freundschaft und ihr Umgang der Seele schädlich und verderblich sei. So verabscheute er auch die Häresie der Arianer und verbot allen, ihnen zu nahen und ihren schlechten Glauben anzunehmen. Als einmal einige von denen, die vom Wahn des Arius besessen waren, zu ihm kamen, da erforschte und erkannte er ihre Gottlosigkeit und verjagte sie vom Berge, indem er erklärte, ihre Reden seien schlimmer als Schlangengift.</p>
      <h2>69</h2><p>Als einmal die Arianer die Lüge ausstreuten, er denke ebenso wie sie, da war er unwillig und zornig über sie. Er wurde dann von den Bischöfen und allen Brüdern gerufen, kam herunter von dem Berge, ging nach Alexandria und verdammte die Arianer; er erklärte, dies sei die letzte Häresie und ein Vorläufer des Antichrist. Er belehrte auch das Volk, der Sohn Gottes sei kein Geschöpf, noch sei er aus dem Nichtseienden geworden, sondern das Wort und die Weisheit seien ewig vom Wesen des Vaters. Deshalb ist es auch gottlos zu sagen: Es gab eine Zeit, da er nicht war; denn das Wort war immer zugleich mit dem Vater. Daher habt nicht die geringste Gemeinschaft mit den allergottlosesten Arianern; “denn keine Gemeinschaft hat das Licht mit der Finsternis”. Ihr sollt fromme Christen sein. Jene aber, die lehren, der Sohn Gottes aus dem Vater und das Wort sei ein Geschöpf, unterscheiden sich in nichts von den Heiden, die einem Geschöpf dienen statt Gott dem Schöpfer. Seid überzeugt, daß jedes Geschöpf ihnen zürnt, weil sie den Schöpfer und den Herrn des Alls, in dem alles entstanden ist, weil sie diesen dem Geschaffenen zurechnen.</p>
      <h2>70</h2><p>Die Gläubigen nun freuten sich alle, wie sie von einem solchen Manne die christusfeindliche Häresie bekämpfen hörten; die ganze Stadt lief zusammen, den Antonius zu sehen. Die Heiden und ihre sogenannten Priester kamen zur Kirche und sagten: “Wir wollen den Mann Gottes sehen.” Denn alle nannten ihn so. Und auch dort reinigte der Herr durch ihn viele von Dämonen und machte Geisteskranke gesund. Sogar viele Heiden wünschten den Greis wenn auch nur zu berühren, da sie glaubten, Gewinn davon zu haben. Und in der Tat, in jenen wenigen Tagen wurden so viele Christen, wie man es sonst kaum in einem Jahre sah. Da einige glaubten, er werde von den Massen beunruhigt, trieben sie alle von ihm zurück; er aber sagte in voller Ruhe, es seien alle diese nicht zahlreicher als die Dämonen, mit denen wir auf dem Berge kämpfen.</p>
      <h2>71</h2><p>Als er wieder wegging, geleiteten wir ihn; wie wir an das Tor kamen, rief hinten ein Weib: “Bleibe, Mann Gottes, meine Tochter wird von einem Dämon schrecklich gepeinigt; bleibe, ich bitte dich, damit nicht auch ich in Gefahr komme, wenn ich zu dir laufe.” Der Greis hörte dies, wir baten ihn, und er wartete gerne. Als sich die Frau näherte, wurde das Kind zur Erde geworfen. Antonius aber betete über das Mädchen und nannte den Namen Christi, und das Kind stand gesund auf, nachdem es der unreine Geist verlassen hatte. Die Mutter pries Gott, und alle dankten. Antonius aber war voll Freude, da er wegging wie in sein eigenes Haus auf den Berg.</p>
      <h2>72</h2><p>Antonius war auch sehr klug; und das Wunderbare dabei war, daß er, obwohl er keine Bildung genossen hatte, doch Scharfsinn besaß und ein verständiger Mensch war. Einmal kamen da zwei heidnische Philosophen zu ihm, die glaubten, den Antonius auf die Probe stellen zu können. Er hielt sich auf dem äußeren Berg auf; am Gesicht sah er ihnen die Absicht an, kam zu ihnen heraus und sagte durch seinen Dolmetscher: “Warum habt ihr euch, ihr Philosophen, so bemüht zu einem törichten Menschen?” Als sie antworteten, er sei nicht töricht, sondern überaus klug, da sprach er zu ihnen: “Wenn ihr zu einem Dummen gekommen seid, ist eure Mühe vergeblich; wenn ihr aber glaubt, daß ich klug sei, so werdet wie ich. Denn das Gute muß man nachahmen. Wenn ich zu euch gekommen wäre, würde ich euch nachahmen; da ihr aber zu mir gegangen seid, werdet wie ich; ich bin ein Christ.” Sie aber kehrten voll Erstaunen zurück; denn sie sahen, daß sogar die Dämonen den Antonius fürchteten.</p>
      <h2>73</h2><p>Als dann wieder andere, ähnliche Leute zu ihm auf den äußeren Berg kamen und glaubten, ihn verspotten zu können, weil er ungebildet war, da sagte Antonius zu ihnen: “Was meint ihr denn? Was ist das erste, Verstand oder Bildung? Was ist eines des anderen Ursache, der Verstand für die Bildung oder die Bildung für den Verstand?” Als sie antworteten, das erste sei der Verstand, er sei der Erfinder der Bildung, erwiderte Antonius: “Also wessen Verstand gesund ist, der braucht keine Wissenschaft.” Dieser Ausspruch wirkte mächtig auf sie und die Anwesenden. Sie entfernten sich voll Verwunderung darüber, daß sie soviel Klugheit in einem einfachen Manne gefunden. Denn er war nicht von ungebildeter Art, wie wenn er auf dem Berge aufgewachsen und alt geworden wäre, sondern voll Anmut und Feinheit. Seine Rede war gewürzt mit göttlichem Witze; niemand war daher neidisch auf ihn, alle vielmehr, die zu ihm kamen, hatten an ihm ihre Freude.</p>
      <h2>74</h2><p>Wieder kamen hierauf andere zu ihm, Menschen, welche bei den Heiden als Weise gelten, und forderten von ihm Auskunft über unseren Glauben an Christus; sie wollten disputieren über die Verkündigung des göttlichen Kreuzes und spötteln. Antonius hielt ein wenig an sich und bedauerte sie wegen ihrer Unwissenheit, dann sagte er durch einen Dolmetscher, der seine Worte trefflich übersetzte: "Was ist schöner, sich zum Kreuze zu bekennen oder Ehebruch und Knabenschändung euren sogenannten Göttern anzudichten? Denn was wir verkünden, ist ein Zeichen von Mut und ein Beweis unserer Todesverachtung; das eure aber sind Leidenschaften der Ausschweifung. Ferner, was ist besser, zu sagen, daß das Wort Gottes sich nicht wandelte, sondern als der in sich gleiche zur Errettung und zum Wohle der Menschen einen menschlichen Leib annahm, damit er durch seine Teilnahme an der menschlichen Geburt den Sterblichen zum Anteil an der göttlichen und geistigen Natur verhelfe, oder in unvernünftigen Wesen das Göttliche nachzuahmen und deshalb vierfüßige Tiere zu verehren, Schlangen und Abbilder von Menschen? Denn dies sind die Gegenstände eurer Verehrung, eurer, der Weisen. Wie könnt ihr es wagen, uns zu verspotten, die wir behaupten, Christus habe sich als Mensch geoffenbart? Wo doch ihr, die ihr die Seele vom Himmel ausgehen lasset, lehrt, sie sei umhergeirrt und von der Höhe des Himmels in den Körper gefallen. Wäre sie doch nur in den menschlichen Körper und nicht auch in Vierfüßler und Schlangen gewandert und gefallen! Unser Glaube lehrt die Gegenwart Christi zur Rettung der Menschen. Ihr aber irrt, wenn ihr von der unerzeugten Seele sprecht. Wir denken an die Macht und Menschenfreundlichkeit der Vorsehung, daß auch dies für Gott nicht unmöglich war. Ihr, die ihr die Seele ein Bild des Nus nennt, schreibt ihr Unfälle zu und redet von ihrer Veränderlichkeit. Und dann behauptet ihr auch vom Nus selbst mit Rücksicht auf die Seele Veränderlichkeit. Denn wie das Bild, so muß notwendig auch das sein, dessen Abbild es ist. Wenn ihr aber über den Nus so denkt, dann überlegt doch, daß ihr auch den Vater des Nus selbst schmähet.</p>
      <h2>75</h2><p>Was aber das Kreuz angeht, was heißt ihr wohl vorzüglicher, das Kreuz zu tragen, wenn die Schlechten eine Verfolgung erregen, und keine Art des drohenden Todes zu fürchten, oder zu fabeln von den Irrfahrten des Osiris und der Isis, von den Nachstellungen des Typhon, der Flucht des Kronos und dem Auffressen der Kinder und der Ermordung des Vaters? Denn dies sind eure weisen Lehren. Wie kommt es aber, daß ihr zwar über das Kreuz spottet, aber euch nicht verwundert über die Auferstehung? Denn die, welche dieses lehrten, haben auch jenes geschrieben. Oder weshalb schweigt ihr, wenn ihr euch an das Kreuz erinnert, von der Auferweckung der Toten, von den Blinden, die sehend geworden, von den Lahmen, die geheilt wurden, von den Aussätzigen, die Reinigung erlangten, von dem Wandeln über das Meer, von den übrigen Zeichen und Wundern, welche Christus nicht mehr als Menschen, sondern als Gott zeigen? Es will mir scheinen, als ob ihr euch selbst großes Unrecht tut und daß ihr euch mit unseren Schriften nicht sorgfältig beschäftigt habt. Leset sie also und sehet, daß das, was Christus vollbracht hat, ihn als einen Gott kennzeichnet, der gekommen ist zum Heile der Menschen.</p>
      <h2>76</h2><p>Deutet auch ihr uns eure Lehre! Was aber könntet ihr von den unvernünftigen Tieren sagen außer Unvernunft und Wildheit? Wenn ihr, wie ich höre, behaupten wollt, daß dies bei euch nur mythische Fabeleien seien und daß ihr nur in allegorischer Weise sprecht vom Raube der Kore in bezug auf die Erde, von dem Hinken des Hephaistos in bezug auf das Feuer, von Hera in Beziehung auf die Luft, von Apollo hinsichtlich der Sonne, von der Artemis in bezug auf den Mond und von Poseidon in bezug auf das Meer: so verehrt ihr nichtsdestoweniger nicht Gott selbst, ihr dienet vielmehr einem Geschöpfe statt Gott, dem Schöpfer von allem. Wenn ihr auch, weil die Schöpfung schön ist, euch diese Ansicht zurechtgemacht habt, so hätte es doch genügt, bei der bloßen Bewunderung zu bleiben, nicht aber die Geschöpfe zu vergöttlichen, damit ihr nicht die Ehre, welche dem Demiurgen gebührt, geschaffenen Dingen erweiset. Denn sonst ist es soweit, daß ihr die Wertschätzung des Baumeisters auf das von ihm errichtete Haus übertraget oder die des Feldherrn auf den Soldaten. Was könnt ihr darauf entgegnen, damit wir sehen, ob an dem Kreuze wirklich etwas ist, was Spott verdient?"</p>
      <h2>77</h2><p>Als sie in ihrer Verlegenheit sich hin- und herwandten, da lächelte Antonius und sagte wieder durch seinen Dolmetscher: “Dies ist schon, wenn man nur zusieht, Beweises genug! Ihr stützt euch aber doch auf eure Fertigkeit in Beweisreden; ihr habt diese Kunst, und deshalb wollt ihr, daß auch wir Gott nicht ohne den Wortbeweis verehren. Sagt ihr nun zuerst: Wie lassen sich die Dinge und besonders die Gotteserkenntnis genau erfassen, durch Beweisreden oder durch tätigen Glauben? Was ist zuerst vorhanden, der wirksame Glaube oder der Wortbeweis?” Als sie antworteten, das Ursprünglichere sei der Glaube, der sich im Handeln äußert, und dies sei genaue Erkenntnis, bemerkte Antonius: "Ihr habt wohl gesprochen. Denn der Glaube kommt aus einer bestimmten Verfassung der Seele, die Dialektik aber geht aus der Kunst ihrer Urheber hervor. Die also, welche den wirksamen Glauben haben, brauchen den Wortbeweis nicht, er ist vielmehr sogar überflüssig. Was wir aus dem Glauben wissen, das versucht ihr durch Worte aufzubauen; oft könnt ihr aber gar nicht sagen, was wir meinen. Die Tat durch den Glauben ist daher besser und kräftiger als eure sophistischen Syllogismen.</p>
      <h2>78</h2><p>Das Geheimnis von uns Christen liegt also nicht beschlossen in der Weisheit heidnischer Vernünfteleien, sondern in der Kraft des Glaubens, der uns von Gott durch Jesus Christus gewährt worden ist. Und daß die Verkündigung wahr ist, sehet jetzt, wir glauben an Gott, obwohl wir keine Bildung haben, indem wir aus seinen Werken seine Fürsorge für alles erkennen. Und daß unser Glaube wirksam ist, sehet jetzt, wir stützen uns auf den Glauben an Christus, ihr aber auf eure sophistischen Wortstreitigkeiten. Eure Scheinbilder der Götter werden vernichtet, unser Glaube aber breitet sich überall aus. Ihr könnt trotz eurer Syllogismen und Sophismen nicht vom Christentum zum Heidentum bekehren; wir aber, die wir den Glauben an Christus lehren, wir nehmen auch die Götterfurcht, da alle erkennen, daß Christus Gott und der Sohn Gottes ist. Ihr hindert durch eure Schönrednerei die Lehre Christi nicht; wir aber verfolgen im Namen des gekreuzigten Christus alle Dämonen, die ihr wie Götter fürchtet. Wo das Zeichen des Kreuzes aufgerichtet wird, da schwindet der Zauber, und die Geheimmittel haben keine Kraft mehr.</p>
      <h2>79</h2><p>Saget doch, wo sind jetzt eure Orakel, wo die Zaubergesänge der Ägypter, wo die Trugbilder der Zauberer? Wann hat dies alles aufgehört und ist zugrunde gegangen, wenn nicht seit der Zeit, wo das Kreuz Christi erschien? Ist dies nun des Spottes wert oder vielmehr das, was von ihm unwirksam gemacht und seiner Ohnmacht überführt worden ist? Merkwürdig ist auch dies: euer Glaube wurde niemals verfolgt, im Gegenteil, er wird von den Menschen in jeder Stadt geehrt. Die Anhänger Christi werden dagegen bedrängt, und doch blüht unser Glaube mehr als der eurige und nimmt zu. Eure Lehren werden gelobt und gepriesen und gehen zugrunde. Der Glaube und die Lehre Christi, sie wird zwar von euch verspottet, von den Kaisern oft verfolgt, sie hat aber die Welt erfüllt. Denn wann hat je so die Erkenntnis Gottes emporgeleuchtet? Wann hat sich so stark die Mäßigkeit und jungfräuliche Tugend gezeigt? Wann wurde jemals der Tod so verachtet als seit der Zeit, wo das Kreuz Christi erschien? Niemand zweifelt daran, der auf die Märtyrer hinsieht, die um Christi willen den Tod verachteten, der die Jungfrauen der Kirche betrachtet, die um Christi willen ihren Leib rein und unbefleckt bewahrten.</p>
      <h2>80</h2><p>Es sind dies hinreichend Kennzeichen dafür, daß der christliche Glaube allein wahre Gottesverehrung ist. Siehe, jetzt seid ihr ungläubig, indem ihr nach Schlußfolgerungen aus Worten sucht. Wir aber beweisen ‘nicht mit überredenden Worten’ heidnischer ‘Weisheit’, wie unser Lehrer sagte, wir überzeugen vielmehr durch den Glauben, der augenfällig vorwegnimmt und zunichte macht das Rüstzeug der Worte. Siehe, hier sind Menschen, welche an Dämonen leiden“; - es waren einige zu ihm gekommen, welche von Dämonen gequält wurden; er führte sie in die Mitte und sprach:”Reiniget diese durch eure Vernunftschlüsse oder mit welcher Kunst und Zauberei ihr immer wollt und rufet dabei eure Götterbilder an; oder wenn ihr es nicht vermögt, dann gebt den Kampf gegen uns auf und ihr werdet die Kraft des Kreuzes Christi sehen." Nach diesen Worten rief er Christus an und bezeichnete die Leidenden mit dem Zeichen des Kreuzes zum zweiten und dritten Male. Und sogleich standen die Menschen unversehrt da, sie waren bei Sinnen und dankten dann dem Herrn. Die sogenannten Philosophen aber verwunderten sich und erschraken in Wahrheit über den Verstand des Mannes und das Zeichen, das ihnen geworden war. Antonius aber sprach: “Warum wundert ihr euch darüber? Nicht wir wirken das, sondern Christus ist es, der durch die, welche an ihn glauben, das vollbringt. Glaubet also auch ihr! Und ihr werdet sehen, daß bei uns keine Wortkunst zu finden ist, sondern Glaube durch die Liebe, die auf Christus hinarbeitet. Wenn auch ihr diesen habt, werdet ihr nicht mehr nach Wortbeweisen suchen, sondern ihr werdet den Glauben an Christus für in sich selbst genügend halten.” Dies waren die Worte des Antonius. Seine Besucher aber wunderten sich auch darüber, sie umarmten ihn und gingen weg, indem sie gestanden, daß sie von ihm erbaut worden seien.</p>
      <h2>81</h2><p>Der Ruf des Antonius kam sogar bis zu den Kaisern. Denn als sie dies vernommen hatten, schrieben sie, Konstantinus Augustus und seine Söhne, Konstantius und Konstans die Augusti, an ihn wie an einen Vater und wünschten, ein Antwortschreiben von ihm zu erhalten. Er aber legte dem kaiserlichen Schreiben keinerlei besonderen Wert bei, er freute sich auch nicht über die Briefe, sondern er war ganz der nämliche wie vor der Zeit, wo ihm die Kaiser schrieben. Als ihm die Schriftstücke gebracht wurden, rief er die Mönche zusammen und sagte: “Wundert euch nicht, daß der Kaiser uns schreibt; denn auch er ist ein Mensch. Wundert euch vielmehr darüber, daß Gott den Menschen das Gesetz aufzeichnete und uns durch seinen eigenen Sohn verkündigte”. Er wollte die Briefe nicht annehmen, weil er, wie er sagte, nicht wisse, wie man darauf antworte. Die Mönche aber bestimmten ihn dazu mit dem Hinweis darauf, daß die Kaiser Christen seien und daß sie vielleicht Ärgernis nähmen, als ob sie geringschätzig behandelt würden, und so erlaubte er, sie vorzulesen. Und er schrieb zurück und lobte sie, weil sie Christus verehrten; auch gab er ihnen nützlichen Rat: die gegenwärtigen Güter nicht für etwas Großes zu halten, sondern vielmehr des zukünftigen Gerichtes zu gedenken und zu beherzigen, daß Christus allein der wahre und ewige Kaiser ist. Er bat sie, menschlich zu sein und für das Recht und die Armen zu sorgen. Die Kaiser freuten sich beim Empfang des Schreibens. So war er bei allen beliebt, und alle wünschten ihn zum Vater zu haben.</p>
      <h2>82</h2><p>Nachdem er so in seiner Art sich zu erkennen gegeben und seinen Besuchern geantwortet hatte, kehrte er wieder zurück auf den inneren Berg. Er trieb seine gewohnte Askese; oft wenn er mit seinen Gästen da saß oder umherwandelte, verstummte er, wie im Daniel geschrieben steht. Nach einigen Stunden erst setzte er das Gespräch mit den Brüdern, die bei ihm waren, fort; seine Umgebung merkte dann, daß er ein Gesicht habe. Wenn er auf dem Berge war, erblickte er oftmals das, was in Ägypten vorging und erzählte es dem Bischof Sarapion, der bei ihm innen war und beobachtete, wie Antonius in dem Gesicht versunken war. Wie er einmal dasaß und arbeitete, da geriet er in Ekstase und seufzte tief bei dem Gesichte. Nach einer Stunde wandte er sich zu seiner Umgebung, seufzte und geriet in Zittern, betete und beugte die Knie und blieb lange so. Dann stand der Greis auf und begann zu weinen. Jetzt erbebten auch seine Genossen, sie fürchteten sich sehr und wollten von ihm den Grund erfahren; und sie setzten ihm so lange zu, bis er nachgab und erzählte. Mit einem tiefen Seufzer sprach er also: “Meine Kinder, es wäre besser zu sterben, ehe das eintritt, was ich in dem Gesichte gesehen.” Als sie wieder baten, sprach er unter Tränen: “Über die Kirche wird Zorn kommen und sie wird Menschen überantwortet werden, die gleich unvernünftigen Tieren sind. Denn ich sah den Altartisch der Kirche, und um ihn standen im Kreise auf allen Seiten Maulesel, und sie stießen mit den Hufen nach innen, wie es ohne Ordnung springendes Getier macht. Jedenfalls”, fuhr er fort, “habt ihr gemerkt, wie ich aufseufzte; denn ich hörte eine Stimme, die sprach: ‘Verunreinigt wird werden mein Altar.’” Dies sah der Greis. Und nach zwei Jahren erfolgte der Angriff der Arianer, den wir jetzt erleben, und die Beraubung der Kirchen, als sie die heiligen Geräte mit Gewalt fortnahmen und durch Heiden wegtragen ließen; als sie sogar die Heiden von ihren Werkstätten wegholten und sie zwangen, an ihren Versammlungen teilzunehmen; und mit ihnen taten sie auf dem heiligen Tische, was sie wollten. Da erkannten wir alle, daß die Hufstöße der Maulesel all das dem Antonius verkündet hatten, was jetzt die Arianer unvernünftig tun wie die Tiere. Nach diesem Gesicht tröstete er seine Genossen mit folgenden Worten: “Seid nicht mutlos, meine Kinder! Denn wie der Herr erzürnte, so wird er auch wieder heilen. Und gar bald wird die Kirche wieder ihre alte Ordnung annehmen, und sie wird erstrahlen wie vorher. Ihr werdet sehen, wie die Verfolgten wieder eingesetzt werden, wie sich die Gottlosigkeit wieder zurückzieht in ihre Schlupfwinkel, wie der fromme Glaube überall in voller Freiheit bekannt wird. Beflecket euch nur nicht mit den Arianern. Denn das ist nicht die Lehre der Apostel, sondern der Dämonen und ihres Vaters, des Teufels. Sie ist vielmehr unfruchtbar und unvernünftig und ohne rechten Verstand wie die Unvernunft der Maulesel.”</p>
      <h2>83</h2><p>So verhielt es sich mit Antonius. Wir dürfen nicht ungläubig sein, wenn durch einen Menschen so große Wunder geschahen. Denn es ist eine Verheißung des Heilandes, der da sagt: “Wenn ihr Glauben habt wie ein Senfkorn und ihr saget zu diesem Berge: Gehe weg von hier, so wird er weggehen. Und nichts wird euch unmöglich sein”, Und wieder: “Wahrlich, wahrlich, ich sage euch, wenn ihr den Vater um etwas in meinem Namen bittet, so wird er es euch geben. Bittet und ihr werdet empfangen”. Er sprach auch zu seinen Schülern und zu allen, die an ihn glaubten: “Heilet Kranke, treibt Dämonen aus! Als Geschenk habt ihr es empfangen, als Geschenk sollt ihr es geben!”</p>
      <h2>84</h2><p>Nicht durch Befehl also heilte Antonius, sondern durch Gebet und Anrufung Christi. So wurde allen klar, daß nicht er selbst es war, der wirkte, sondern der Herr, der durch Antonius sich menschenfreundlich erwies und die Kranken heilte. Des Antonius Verdienst war allein das Gebet und die Askese, um derentwillen er auf dem Berge saß und sich zwar freute über die Betrachtung des Göttlichen, aber doch auch Schmerz empfand, da er von vielen beunruhigt und auf den äußeren Berg gezogen wurde. Denn auch die Richter wünschten alle, er möge vom Berge heruntersteigen, da sie unmöglich zu ihm kommen konnten wegen der Rechtsuchenden, die ihnen nachfolgten. Gleichwohl baten sie, er möge erscheinen, damit sie ihn nur sähen. Er aber wich aus und mied die Wege zu ihnen; sie aber gaben nicht nach und schickten sogar die Angeklagten unter militärischer Bedeckung dahin, damit er wenigstens ihretwegen herabkäme. Unter dem Druck dieses Zwanges und vom Anblick ihres Jammers ergriffen, ging er auf den äußeren Berg. Und seine Mühe war nicht nutzlos; denn vielen brachte seine Ankunft Vorteil und Wohltat. Die Richter aber förderte er, indem er ihnen riet, die Gerechtigkeit über alles zu schätzen, Gott zu fürchten und zu bedenken, daß sie gerichtet würden nach dem Urteil, mit dem sie selbst richteten. Den Aufenthalt auf dem Berge aber liebte er doch mehr als alles andere.</p>
      <h2>85</h2><p>Als er einmal wieder so gezwungen wurde von denen, die in Not waren, und auch der General ihn inständig bat, herabzukommen, da erschien er wirklich, sagte einige Worte, die zum Heile dienten und für die Bittsteller bestimmt waren, und wollte wieder wegeilen. Als nun der Dux, wie er genannt wird, ihn ersuchte, er möge ein wenig verziehen, da erwiderte er, er könne nicht bei ihnen bleiben und überzeugte ihn davon durch ein liebliches Gleichnis. Er sagte nämlich: “Wie die Fische sterben, wenn sie auf dem Trockenen bleiben, so werden die Mönche schlaff, wenn sie mit euch sich verhalten und bei euch bleiben. Wie der Fisch in das Meer, so müssen wir auf den Berg eilen, damit wir nicht durch unser Zögern der Dinge vergessen, die da innen sind.” Als der General dies und vieles andere von ihm gehört hatte, da sagte er voll Verwunderung, er sei in Wahrheit ein Diener des Herrn. Denn woher hätte ein einfacher Mensch einen so tiefen und gewaltigen Verstand, wenn er nicht ein Liebling Gottes wäre?</p>
      <h2>86</h2><p>Ein General, namens Balakius, verfolgte uns Christen heftig, da er den verfluchten Arianern anhing. Da er so roh war, daß er sogar Jungfrauen schlagen und Mönche entkleiden und geißeln ließ, sandte Antonius zu ihm und schrieb ihm einen Brief folgenden Inhalts: “Ich sehe, wie Zorn gegen dich herankommt, höre also auf, die Christen zu verfolgen, damit der Zorn dich nicht ergreife; denn er will schon gegen dich heran.” Balakius aber lachte, warf den Brief zu Boden, spuckte darauf, mißhandelte die Überbringer und befahl, dem Antonius folgendes zu sagen: “Da du dich um die Mönche kümmerst, werde ich nunmehr auch zu dir kommen.” Noch waren nicht fünf Tage vergangen und das Gericht kam über ihn. Denn Balakius selbst und Nestorius, der Eparchus von Ägypten, begaben sich zum ersten Einkehrhaus Alexandrias, dem sogenannten Chaireu hinaus, und sie waren beritten. Die Pferde gehörten dem Balakius und waren ruhiger als alle, die bei ihm gehalten wurden. Sie waren noch nicht an den Ort gekommen, da begannen die Tiere, wie sie es oft machen, miteinander zu spielen, und plötzlich warf das sanftere, auf dem Nestorius ritt, den Balakius durch einen Biß herunter und fiel ihn an. Es zerfleischte ihm mit seinen Zähnen den Schenkel derart, daß er sogleich in die Stadt weggetragen werden mußte und nach drei Tagen starb. Und alle wunderten sich, daß die Vorhersagung des Antonius so rasch in Erfüllung gegangen war.</p>
      <h2>87</h2><p>So warnte er wilde Gemüter; die anderen aber, die zu ihm kamen, mahnte er so eindringlich, daß sie sogleich ihre Händel vergaßen und die selig priesen, welche sich aus diesem Leben zurückziehen könnten. Die Mißhandelten schützte er so, daß man glauben konnte, nicht die anderen, sondern er selbst sei der Leidende. So sehr war er für alle ein Vermittler des Heiles, daß viele Soldaten und reiche Leute die Bürde des weltlichen Lebens von sich warfen und dann Mönche wurden. In der Tat, er war wie ein Arzt, den Gott dem Lande Ägypten geschenkt hatte. Denn wer kam traurig zu ihm und kehrte nicht voll Freude heim? Wer kam weinend wegen seiner Verstorbenen und vergaß nicht sogleich sein Leid? Wer kam im Zorn, ohne daß er zur Freundschaft umgestimmt wurde? Wer kam arm und mutlos und verachtete nicht, nachdem er ihn gehört und gesehen, den Reichtum und tröstete sich in seiner Armut? Wenn ein Mönch nachlässig gewesen war und zu ihm ging, wurde der nicht noch ausdauernder? Welcher junge Mensch kam auf den Berg und verleugnete nicht sogleich, nachdem er den Antonius gesehen, die Vergnügungen und liebte die Mäßigung? Wer kam zu ihm, der von einem Dämon geplagt wurde, ohne daß er Ruhe fand? Wer ging von Zweifeln gepeinigt und wurde nicht ruhig in seiner Seele?</p>
      <h2>88</h2><p>Auch das war groß an der Askese des Antonius, daß er, wie ich vorher bemerkte, die Gnade der Unterscheidung der Geister besaß und ihre Regungen erkannte; auch darauf verstand er sich trefflich, worauf jedes einzelnen Eifer und Drang besonders gerichtet war. Und nicht allein wurde er selbst nicht von ihnen zum besten gehalten, er tröstete auch die von Gedankenzweifeln Gepeinigten und belehrte sie, wie sie die Nachstellungen der Dämonen unwirksam machen könnten, indem er die Schwächen und Listen der Besessenheit wirkenden Geister klarlegte. Jeder kehrte dann heim, gleichsam gesalbt von ihm und voll guten Mutes gegen die Anschläge des Teufels und seiner Dämonen. Wie viele Jungfrauen, die schon einen Freier hatten, blieben Jungfrauen Christi, wenn sie den Antonius auch nur von ferne sahen. Die Leute kamen aber auch von den außerägyptischen Landschaften zu ihm. Sie nahmen mit allen teil an der Erbauung und kehrten zurück, entlassen wie von einem Vater. In der Tat, nach seinem Tode trösteten sich alle, wie Waisen, die ihren Vater verloren, allein durch das Gedächtnis an ihn und hielten zugleich seine Ermahnungen und Tröstungen fest.</p>
      <h2>89</h2><p>Wie sein Lebensende war, das ist wert, daß ich es erzähle und daß ihr es hört, wo ihr euch doch danach sehnt; denn auch darin ist er nachahmenswert. Nach seiner Gewohnheit besuchte er die Mönche auf dem äußeren Berg, und da er von der Vorsehung über sein Lebensende belehrt worden war, sprach er zu den Brüdern: “Das ist der letzte Besuch, den ich euch mache, und es soll mich wundern, wenn wir uns in diesem Leben noch einmal sehen. Denn es ist Zeit, daß auch ich nunmehr scheide; denn ich bin fast einhundertundfünf Jahre alt.” Nachdem die Mönche diese Worte vernommen, brachen sie in Tränen aus und umarmten und küßten den Greis. Er aber, wie wenn er aus einer fremden in seine Heimatstadt weggehe, sprach mit ihnen voll Freude. Er ermahnte sie, in den Mühen nicht lässig zu werden, noch in der Askese nachzugeben, sondern zu leben, als ob sie jeden Tag sterben könnten; und, wie ich schon sagte - sich zu bemühen, die Seele vor unreinen Gedanken zu bewahren; den Heiligen nachzueifern und den schismatischen Meletianern nicht zu nahen; “denn ihr kennt ihre schlechte und unheilige Sekte”; keine Gemeinschaft zu halten mit den Arianern. “Denn auch ihre Gottlosigkeit ist allen wohlbekannt. Lasset euch nicht beirren, wenn ihr auch seht, daß sie die Richter beschützen; denn es wird verschwinden, und vergänglich und nichtig ist ihre Erscheinung. Bewahret euch vielmehr rein vor ihnen und behütet das Erbe der Väter und besonders den frommen Glauben an unseren Herrn Jesus Christus, den ihr aus der Heiligen Schrift kennen gelernt habt, und an den ihr von mir oft erinnert worden seid.”</p>
      <h2>90</h2><p>Als die Brüder ihn drängten, er möchte bei ihnen bleiben und hier vollenden, da brachte er es nicht über sich, und zwar aus vielen Gründen, wie er es, wenn er auch nichts sagte, doch andeutete, besonders aber aus folgendem: Die Ägypter pflegen die Leichen der verstorbenen Frommen und hauptsächlich die der heiligen Märtyrer zwar mit Begräbnisfeierlichkeiten zu ehren und mit Leinwand zu umhüllen, sie aber nicht unter die Erde zu bringen, sondern auf Gestelle zu legen und bei sich zu Hause zu behalten; so glauben sie die Abgeschiedenen zu ehren. Antonius hatte oftmals sogar die Bischöfe deshalb gebeten, den Gläubigen abratend zuzureden; ebenso suchte er auch auf die Laien einzuwirken und tadelte die Frauen, indem er sagte, diese Sitte sei weder gesetzlich noch fromm. Denn es werden ja auch die Leiber der Patriarchen und Propheten bis auf den heutigen Tag in Gräbern aufbewahrt, auch der Leichnam unseres Herrn selbst wurde in ein Grabmal gelegt und ein Stein daraufgelegt, der ihn bedeckte, bis er auferstand am dritten Tage. Dadurch bewies er, daß der gesetzwidrig handle, der nach dem Tode die Leichen der Verstorbenen nicht bestatte, auch wenn sie heilig sind. Denn was gibt es Größeres oder Heiligeres als den Leib des Herrn? Viele nun bestatteten von da an, nachdem sie das gehört hatten, unter der Erde und dankten dem Herrn, daß sie eine gute Lehre empfangen.</p>
      <h2>91</h2><p>Er kannte diesen Brauch und fürchtete, sie möchten auch seinen Körper so behandeln; deshalb beeilte er sich, Abschied zu nehmen von den Mönchen auf dem äußeren Berge; er begab sich dann auf den inneren Berg, wo er sich aufzuhalten pflegte; hier erkrankte er nach einigen Monaten. Er rief seine Genossen - es waren dies zwei Männer, die auch auf dem inneren Berg geblieben waren, die sich fünfzehn Jahre der Askese unterwarfen und dem Antonius dienten mit Rücksicht auf sein Alter - und sprach zu ihnen: “Ich wandere, wie geschrieben steht, den Weg der Väter; denn ich merke, wie mich der Herr ruft. Ihr aber seid wachsam und vereitelt nicht eure lange Askese, sondern bemüht euch, wie wenn ihr jetzt erst anfinget, euren Eifer zu bewahren. Ihr kennt die Nachstellungen der Dämonen, ihr wißt, wie wild sie sind, aber auch wie schwach in ihrer Gewalt. Fürchtet sie also nicht, atmet vielmehr immer in Christus und glaubet an ihn. Lebt, wie wenn ihr jeden Tag sterben solltet, achtet auf euch und erinnert euch der Ermahnungen, die ihr von mir gehört habt. Ihr sollt keine Gemeinschaft haben mit den Schismatikern, besonders aber nicht mit den häretischen Arianern. Denn ihr wißt ja, wie ich sie gemieden habe wegen ihrer Christus bekämpfenden und andersgläubigen Häresie. Bemühet euch dagegen, euch immer anzuschließen vor allem an den Herrn, dann aber auch an die Heiligen, damit auch sie euch nach dem Tode in ihre ewigen Wohnungen aufnehmen wie Freunde und Bekannte. Das erwäget, daran denket! Wenn ich euch lieb bin und wenn ihr euch an mich wie an einen Vater erinnert, dann laßt sie nicht meinen Leichnam nach Ägypten bringen, damit sie ihn nicht in den Häusern aufbewahren; denn deshalb bin ich auf den Berg gegangen und kam hierher. Ihr wißt auch, wie ich immer die, welche dies taten, gerügt habe und befohlen, mit dieser Gewohnheit aufzuhören. Bestattet meinen Leichnam und bergt ihn unter der Erde. Mein Gebot soll von euch beachtet werden, so daß niemand den Ort kennt außer ihr allein. Denn ich werde bei der Auferstehung der Toten vom Heiland einen unvergänglichen Körper erhalten. Verteilet meine Kleider; dem Bischof Athanasius gebt das eine Schaffell und den Mantel, den ich darunter anzog; er hat ihn mir neu gegeben, von mir aber ist er abgenützt worden. Dem Bischof Sarapion gebt das andere Schaffell, Ihr behaltet das härene Gewand. Und nun lebt wohl, Kinder; denn Antonius geht hinüber und ist nicht mehr mit euch.”</p>
      <h2>92</h2><p>Nach diesen Worten umarmten ihn seine Gefährten. Dann streckte er die Füße aus, sah die, welche zu ihm kamen, wie Freunde an und freute sich ihretwegen - denn er zeigte, wie er so dalag, ein heiteres Gesicht -, und so verschied er und wurde versetzt zu den Vätern. Seine zwei Freunde aber erwiesen ihm, wie er ihnen aufgetragen hatte, die letzte Ehre, sie hüllten ihn ein und bargen seinen Leichnam unter der Erde, und niemand weiß bis jetzt, wo er verborgen ist außer den beiden allein. Und jeder von denen, die das Schaffell des seligen Antonius und seinen abgenutzten Mantel erhalten hatten, bewahrt dies wie einen wertvollen Besitz auf. Denn wenn man die Kleidungsstücke nur ansieht, so ist es, wie wenn man den Antonius sähe; und wenn man sie anzieht, so ist es, als ob man mit Freude seine Ermahnungen trüge.</p>
      <h2>93</h2><p>Dies war das Ende des irdischen Lebens unseres Antonius, jenes aber der Anfang der Askese. Wenn dies alles auch wenig ist im Vergleich zu seiner Tugend, so erwäget doch daraus, wie der Mann Gottes, Antonius, geartet war, der von Jugend auf bis in sein hohes Alter den gleichen Eifer in der Askese bewahrte; wie er weder mit Rücksicht auf sein Alter unterlag durch die Auswahl der Nahrung, noch wegen der Schwäche seines Körpers die Art seiner Kleidung änderte, oder sich auch nur die Füße mit Wasser wusch; und gleichwohl blieb er in allem unversehrt. Seine Augen waren gesund und untadelig, und er sah gut; von seinen Zähnen fiel auch nicht einer aus; nur am Zahnfleisch waren sie abgenützt, aber wegen des hohen Alters des Greises. Seine Hände und Füße blieben gesund, und überhaupt erschien er glänzender und kräftiger als alle, die sich mannigfacher Nahrung, der Bäder und verschiedener Gewänder bedienen. Ein Kennzeichen seiner Tugend und gottgeweihten Seele ist dies, daß er überall berühmt war und von allen bewundert wurde, und daß sich auch die nach ihm sehnten, die ihn nicht gesehen hatten. Denn Antonius wurde berühmt nicht durch seine Schriften noch durch weltliche Weisheit oder durch irgendeine Kunst, sondern allein durch seine Frömmigkeit. Daß dies eine Gnade Gottes ist, wird niemand leugnen. Wie hätte man sonst von ihm, der sich auf seinem Berge verbarg und ruhig dort saß, in Spanien, Gallien, in Rom und Afrika gehört, wenn es nicht Gott war, der überall die Seinen berühmt macht, der dies auch dem Antonius im Anfang seiner Laufbahn verkündete! Mögen sie selbst auch im verborgenen leben, mögen sie auch wünschen, verborgen zu bleiben, der Herr zeigt sie doch allen wie Leuchten, damit so auch die, welche es hören, erkennen, daß seine Gebote geeignet sind zur Vollkommenheit und damit sie das eifrige Streben nach dem Weg zur Tugend gewinnen.</p>
      <h2>94</h2><p>Dies leset nun den anderen Brüdern vor, damit sie erfahren, wie das Leben der Mönche sein muß, damit sie sich überzeugen, daß unser Herr und Heiland Jesus Christus die rühmt, welche ihn preisen, und die, welche ihm dienen bis zum Ende, nicht allein in das Himmelreich führt, sondern auch schon hier auf Erden wegen ihrer Tugend und zum Nutzen der anderen überall offenbar und bekannt macht, wenn sie sich auch selbst verbergen und bemüht sind, ihr Leben einsam zu verbringen. Wenn es notwendig wird, so leset dies auch den Heiden vor, damit sie erkennen, daß unser Herr Jesus Christus nicht allein Gott und Sohn Gottes ist, sondern daß auch die, welche ihm wahrhaft dienen und fromm an ihn glauben, daß die Christen von den Dämonen, welche die Heiden selbst für Götter halten, klar erkennen, daß sie keine Götter sind, ja daß sie diese sogar bezwingen und verfolgen als Betrüger und Verführer der Menschen in Christus Jesus, unserem Herrn, dem ist Ruhm von Ewigkeit zu Ewigkeit. Amen.</p>
