    body: |-
      <p><em>Dialog Octavius, übersetzt von Dr. Alfons Müller (Bibliothek der Kirchenväter, 1. Reihe, Bd. 14, München 1913).</em></p><h2>1</h2><p>1. Während ich meinen Gedanken nachging und dabei die Erinnerung an meinen guten, treuen Freund Octavius auffrischte, hat mich eine solch süße Zuneigung zu ihm ergriffen, daß es mir fast vorkam, ich kehrte selbst gleichsam in die Vergangenheit zurück, und nicht etwa ich riefe bereits verlebte und entschwundene Zeiten wieder ins Gedächtnis. 2. So sehr hat sich sein Bild in dem Grade, wie es meinen Augen entrückt ward, meinem Herzen, ich möchte fast sagen, den tiefsten Fasern meiner Seele eingeprägt. 3. Ganz natürlicherweise hat der vortreffliche edelgesinnte Mann uns bei seinem Hinscheiden eine starke Sehnsucht nach sich hinterlassen; war er ja auch seinerseits immer von solch inniger Liebe zu uns beseelt, daß er in Scherz und Ernst mit mir willenseins gewesen und alles wollte oder nicht wollte gleich mir. Man hätte glauben können, ein Herz hätte sich auf zwei Personen verteilt. 4. So war er der einzige Vertraute meiner Lieblingsneigungen, er Genosse meiner Irrtümer. Nachdem die Dunsthülle gesunken und ich aus der tiefsten Finsternis zum Licht der Weisheit und Wahrheit mich empor gerungen, versagte er nicht das Geleite, ja er eilte – ganz besonders ruhmvoll für ihn – mir voran.</p><p>5. Wie nun meine Gedanken über die ganze Zeit unseres Beisammenseins und unseres Freundschaftslebens hinschweiften, blieb meine Aufmerksamkeit vorzugsweise auf jenem Gespräche haften, durch welches er den Q. Caecilius, damals noch im Wahne des Aberglaubens befangen, in einer hochbedeutsamen Unterredung zur wahren Religion bekehrt hat.</p>
      <h2>2</h2><p>1. Geschäftshalber und um mich zu besuchen war er nach Rom gereist, Haus, Frau und Kinder zurücklassend. Letztere standen dazu noch in den Jahren der Unschuld, wo die Kinder am liebenswürdigsten sind; eben erst versuchten sie halbe Worte, eine Sprache, die gerade durch die abgerissenen Laute der noch ungelenken Zunge ihre besondere Anmut besitzt. 2. Ich kann es nicht mit Worten ausdrücken, welch große, unbändige Freude seine Ankunft mir gemacht, und die Freude war um so größer, weil mein lieber Freund unvermutet kam.</p><p>3. Bereits hatten wir nun einige Tage lang bei häufigem Zusammensein unsere heiße Sehnsucht befriedigt und gegenseitige Erfahrungen während unserer Trennung miteinander ausgetauscht, da faßten wir den Entschluß, die entzückende Stadt Ostial aufzusuchen. Die Seebäder gaben ein gutes und zuträgliches Kurmittel ab, um aus meinem Körper schädliche Säfte zu beseitigen. Zudem hatten auch die Weinleseferien meine gegerichtlichen Arbeiten erleichtert; es war nämlich gerade die Zeit, wo Herbstwetter nach den heißen Tagen die Sommerhitze gemildert hatte.</p><p>4. Beim Morgengrauen wandelten wir dem Flußufer entlang zum Meere; der milde Lufthauch belebte unsere Glieder und es bereitete uns einen köstlichen Genuß, wie der sandige Boden unsern weichen Tritten nachgab. Da bemerkte Caecilius eine Serapis-Statue. Er führte nach der Sitte des abergläubischen Volkes seine Hand zum Munde und drückte mit den Lippen einen Kuß darauf.</p>
      <h2>3</h2><p>1. Da sprach Octavius: „Mein Bruder Marcus, es ziemt sich nicht für einen edlen Mann, einen Menschen, der zu Hause und in der Öffentlichkeit deine Gesellschaft teilt, in der blöden Unwissenheit des gewöhnlichen Volkes zu lassen und zu dulden, daß er am hellen Tag sich an Steine hinwirft, welche freilich zu Bildern gemeißelt, gesalbt und bekränzt sind. Du weißt doch, daß solch schmachvolle Verirrung ebensogut dir wie ihm zur Last fällt“.</p><p>2. Während er so sprach, hatten wir die Mitte der Stadt erreicht und kamen bereits an die offene Küste. 3. Sanfte Wellen spülten dort am äußersten Rand den Sand an und breiteten ihn am Ufer hin, als wollten sie ihn für einen Spaziergang zurechtlegen. Wohl schlug das Meer nicht mit weiß schäumenden Fluten ans Land; aber wir hatten doch unsere Freude an den gekräuselten, verworrenen Wechselbewegungen der Wellen – das Meer ist ja immer auch bei Windstille unruhig. Wir wanderten gerade am Rand des Meeres dahin; da spülte es abwechslungsweise bald heranwogend seine Wellen an unsere Füße, bald schlurfte es dieselben zurückweichend und zurücktretend wieder in sich hinein. 4. Langsam und gemächlich schritten wir voran am Ufer der schwachgekrümmten Küste und verkürzten mit Plaudereien den Weg. Diese Plaudereien gingen von Octavius aus; er berichtete von seiner Seefahrt. 5. Doch als wir bereits eine ordentliche Strecke Weges unter Gesprächen zurückgelegt, machten wir Kehrt und gingen den gleichen Weg rückwärts. Wir kamen zu dem Platz, wo Schiffe heraufgezogen und auf Eichenstämmen zum Schutz gegen den Einfluß des feuchten Bodens gelagert ruhten. Dort sahen wir Knaben eifrig ein Wettspiel mit Scherben treiben, die sie ins Meer schleuderten. 6. Dieses Spiel besteht darin, daß man ein abgerundetes, von den Wellen geglättetes Steinchen in Form einer Scherbe am Ufer aufliest, dieses Steinchen in horizontaler Lage mit den Fingern faßt, sich selbst so tief als möglich bückt und es dann über die Wellen hinrollen last. Dieses Wurfgeschoß streifte nun den Rücken des Meeres [und schwamm darüber hin,] mit sanfter Gewalt darüber hingleitend oder es schimmerte [und tauchte heraus] über die höchsten Wogen dahinschnellend in fortlaufendem Sprung emporgehoben. Unter den Knaben hielt sich der für den Sieger, dessen Steinchen am weitesten hinauslief und am öftesten emporsprang.</p>
      <h2>4</h2><p>1. Während alle dieses lustige Schauspiel fesselte, gab Caecilius in keiner Weise darauf acht und hatte keine Freude an dem Wettspiel. Schweigsam, bekümmert, in sich versunken, verriet er durch seine Miene, daß ihn etwas schmerzte. 2. Da sprach ich zu ihm: Was ist denn? Caecilius, wo bleibt deine sonstige Lebhaftigkeit, warum muß ich deinen heiteren Blick vermissen, den du sonst selbst bei ernsten Dingen zeigst? 3. Er entgegnete: Schon lange wurmt und quält mich heftig die Rede unseres Octavius, in welcher er sich gegen dich gekehrt und dich der Pflichtversäumnis bezichtigt hat, um desto schwerer auf diese verschleierte Weise mich der Unwissenheit zu beschuldigen. 4. Nun ich will weiter ausholen: ich will über die volle und gesamte Angelegenheit mich mit Octavius aussprechen. Wenn es ihm recht ist, so will ich als Anhänger dieser Richtung mit ihm disputieren; er wird dann gewiß einsehen, daß es leichter ist, ein Wortgefecht unter Freunden zu führen als regelrecht wissenschaftlich miteinander zu kämpfen. 5. Nur wollen wir uns auf jenen zum Schutz der Bäder aufgeworfenen und ins Meer vorspringenden Steindamm niederlassen, damit wir von unserem Marsche ausruhen und um so mehr unsere Gedanken auf das Gespräch richten können. 6. Auf sein Wort hin nahmen wir Platz; die Gegner setzten sich zu beiden Seiten und nahmen mich als Dritten in die Mitte. Das geschah nicht etwa aus Höflichkeit noch mit Rücksicht auf Rang und Ehrenstellung – denn Freundschaft setzt Gleichheit der Personen voraus oder schafft sie – sondern ich sollte auf diese Weise als Schiedsrichter beiden gleich nahe zuhören können und in der Mitte sitzend das streitende Paar voneinander trennen.</p>
      <h2>5</h2><p>1. Nun begann Caecilius also: "Bruder Marcus, du bist zwar über den Gegenstand unserer jetzigen Erörterung nicht im Zweifel; du hast dich ja in beiden Lebensrichtungen sorgfältig umgesehen und die eine verworfen, die andere für richtig erkannt. Dennoch mußt du für jetzt deine Seele so stimmen, daß du die Wage eines durchaus gerechten Schiedsrichters hältst und nicht nach einer Seite überwiegend hinneigst. Dann wird das Urteil als Resultat unserer Erörterungen, nicht etwa als Ausfluß deiner Sinnesrichtung erscheinen. 2. Wenn du mir nun so zu Gericht sitzest wie ein Fremder und wie wenn du keine Partei kanntest, so ist es nicht schwer nachzuweisen: alles im menschlichen Leben ist zweifelhaft, unsicher, schwankend und besser bloß wahrscheinlich als wahr zu nennen. 3. Um so mehr ist es deshalb sonderbar, daß manche einer gründlichen Erforschung der Wahrheit überdrüssig blindlings sich irgendeiner Meinung unterwerfen, anstatt mit unverdrossenem Fleiß bei der Forschung zu verharren. 4. Darum muß man sich allgemein entrüsten und ärgern, daß manche und dazu noch Leute ohne viel Studium, ohne wissenschaftliche Bildung, ja unerfahren selbst in den gewöhnlichsten Gewerben, etwas Bestimmtes über das gewaltige Weltall auszusprechen wagen. Und doch ist darüber seit so vielen, ja allen Jahrhunderten die Philosophie in ihren meisten Schulrichtungen im unklaren. 5. Ganz natürlich; denn so weit ist unsere menschliche Beschränktheit von der Erkenntnis des Göttlichen entfernt, daß uns weder das, was über uns am Himmel schwebt, noch was tief unter der Erde verborgen liegt, zu wissen vergönnt oder zu untersuchen gestattet ist. Wir dürfen uns mit Recht mehr als glücklich und weise dünken, wenn wir nach dem bekannten alten Weisheitsspruch uns selbst ein wenig besser kennen lernen. 6. Aber weil wir nun einmal in wahnwitzigem und sinnlosem Bemühen über die Grenzen unserer Beschränktheit hinausschweifen und, wiewohl in den Erdenstaub gebannt, selbst den Himmel und die Sternenwelt mit keckem Verlangen übersteigen, so wollen wir wenigstens zu dieser Verirrung nicht noch törichte und grausige Vorstellungen fügen. 7. Angenommen, von Anbeginn haben die Keime aller Dinge durch Selbstbefruchtung der Natur sich zusammengefunden, welcher Gott ist dann der Schöpfer? Oder wenn etwa die Teile des Weltganzen durch zufälliges Zusammenkommen aneinandergefügt, geordnet und gestaltet wurden, welcher Gott ist dann der Baumeister? Vielleicht hat das Feuer die Gestirne in Brand gesetzt, hat der eigene Stoff den Luftraum in die Höhe gehoben und die Erde durch sein Gewicht in die Tiefe gezogen; vielleicht ist das Meer aus dem flüssigen Element zusammengeflossen. Aber woher dann diese religiöse Scheu, woher diese Angst? Was ist’s mit diesem Aberglauben? 8. Der Mensch und jedes lebende Wesen, welches entsteht, Leben empfängt und heranwächst, ist gleichsam eine bewußte Zusammensetzung von Grundstoffen; in sie wird der Mensch und jedes lebende Wesen wieder zerteilt, aufgelöst und zerstreut. So strömen sie zu ihrer Quelle zurück und alles macht einen Kreislauf in sich selbst; man braucht da keinen Künstler, keinen Richter und keinen Schöpfer. 9. So sehen wir durch Verdichtung der Feueratome immer wieder neue Sonnen erstrahlen, durch die Ausdünstung der Erddämpfe immer wieder Nebel aufsteigen, welche verdichtet und zusammengeballt als Wolken sich höher emporheben. Wenn sie sich senken, strömt Regen herab, bläst der Wind, rauscht der Hagel oder, wenn die Dunstmassen zusammenstoßen, rollt der Donner, leuchtet der Blitz, zucken die Blitzstrahlen; sie fahren überall nieder, schlagen in Berge, treffen Bäume, treffen ohne Wahl heilige und unheilige Stätten, töten schuldbeladene und oft auch gottesfürchtige Menschen. 10. Was soll ich erst sagen zu den wechselvollen und unstäten Stürmen, durch die ohne Ordnung und Plan alles ungestüm herumgeworfen wird? Erleiden nicht bei Schiffbrüchen Gute und Böse in gleicher Weise ihr Schicksal ohne Rücksicht auf’ Verdienst; finden nicht bei Bränden Unschuldige und Schuldige gleichzeitig ihren Untergang, und wenn die Luft mit verderblichem Krankheitsstoff geschwängert ist, gehen da nicht alle ohne Unterschied zugrunde? Wenn endlich die Kriegsfackel wütet, erliegen da nicht gerade die Besten? 11. Auch in Friedenszeiten stehen die Bösen nicht bloß den Guten gleich, sondern sind sogar geehrt; bei vielen weiß man nicht, ob man ihre Schlechtigkeit verabscheuen oder ihr Glück sich wünschen soll. 12. Wenn die Welt durch eine göttliche Vorsehung und durch eine göttliche Macht regiert würde, so würde einem Phalaris und einem Dionysius niemals ein Königtum, einem Rutilius und Camillus nie die Verbannung, einem Sokrates nie der Giftbecher zuteil werden. 13. Sieh nur, die fruchtbeladenen Bäume, die bereits gebleichten Saaten und die vollsaftigen Reben werden vom Regen verdorben, vom Hagel zerschlagen! So sehr ist es wahr, daß uns die Wahrheit verschleiert und vorenthalten wird, so daß wir sie nicht fassen können; glaubhafter freilich ist: es herrscht in wechselnden und schwankenden Zufällen ohne Gesetzmäßigkeit das Schicksal.</p>
      <h2>6</h2><p>1. Es ist also entweder der Zufall gewiß oder das Naturprinzip ungewiß. Um wieviel pietätvoller und besser ist es dann, die Lehre der Ahnen als Richtschnur der Wahrheit anzunehmen, die überlieferte Religion zu üben, die Götter anzubeten, welche dich die Eltern eher fürchten, als näher kennen gelehrt haben, und nicht über die Götter abzuurteilen, sondern den Vorfahren zu glauben. Sie haben in der noch urwüchsigen Zeit, als die Welt eben entstand, das Glück genossen, Götter als Freunde oder als Herrscher zu besitzen. So sehen wir denn auch in allen Reichen. Provinzen und Städten besondere volkstümliche Religionsgebräuche in Übung und Lokalgottheiten verehrt, Eleusis die Ceres, hei den Phrygiern die Göttermutter, bei den Epidauriern den Aesculap, bei den Chaldäern den Bel, bei den Syrern die Astarte, bei den Tauriern die Diana, bei den Galliern den Mercur, bei den Römern alle Gottheiten insgesamt. 2. Wenn ihre gewaltige Macht den ganzen Erdkreis in Besitz genommen und das beherrschte Gebiet über die Sonnenbahn und selbst über die Grenzen des Weltmeers hinaus ausgedehnt hat, so kommt das daher: sie vereinen im Kampf Tapferkeit und Gottesfurcht; sie schirmen ihre Stadt mit Kultzeremonien, durch keusche Jungfrauen, durch Priester mit Würden und verschiedenen Ehrentiteln; sie verehren belagert und mit Ausnahme des Kapitols in Gewalt der Feinde noch Götter, welche ein anderer schon längst wegen ihrer ungnädigen Gesinnung verschmäht hätte und dringen mitten durch die Reihen der Gallier, die ob solch kühner Ausübung der Religion erstaunten, hindurch ohne Waffen, nur mit einem gottesdienstlichen Gewand ausgerüstet; sie verehren in den Mauern der eroberten feindlichen Stadt, während noch der siegreiche Kampf tobt, die überwundenen Götter überall laden sie die Götter gastlich ein und machen sie zu den ihrigen; sie errichten Altäre selbst den unbekannten Gottheiten und den Manen. 3. So haben sie, weil sie die religiösen Einrichtungen aller Völker übernahmen, auch ihre Reiche gewonnen. In der Folgezeit ist dieser gottesfürchtige Sinn geblieben; er wird durch die Länge der Zeit nicht geschwächt, sondern gekräftigt. Das Altertum pflegte ja den heiligen Gebräuchen und Tempeln um so mehr Heiligkeit zuzuschreiben, je größeres Alter es ihnen zugeschrieben hat.</p>
      <h2>7</h2><p>1. Doch unsere Vorfahren – ich möchte mir erlauben, auf einen Augenblick für meine Person zurückzutreten und so einen etwaigen Irrtum entschuldbarer machen – haben sich nicht ohne Grund auf die Beobachtung der Augurien, Befragen der Eingeweide, Anordnungen religiöser Einrichtungen oder Einweihung von Tempeln verlegt. 2. Prüfe nur die Geschichte, wie sie in den Büchern enthalten ist, und du wirst sofort finden, wie sie die heiligen Gebräuche aller Religionen eingeführt haben; es sollte damit entweder für göttliche Huld Dank abgestattet oder drohender Zorn abgewandt oder ein solcher, wenn er bereits anschwoll und wütete, beschwichtigt werden. 3. Das bezeugt die Mutter vom Ida, welche bei ihrer Ankunft der Römerin ihre Keuschheit bestätigt und die Stadt von Feindeshand befreit hat. Zeugen sind die im Teich, so wie sich gezeigt, aufgestellten Statuen des berittenen Bruderpaares, welches atemlos auf schäumenden und dampfenden Rossen noch am gleichen Tag den Sieg über Perseus gemeldet hat. Zeuge ist die Wiederholung der Spiele zu Ehren des erzürnten Jupiter auf den Traum des Plebejers hin. Ebenso zeugt dafür die wirksame religiöse Hinopferung der Decier; Zeuge ist auch Curtius, welcher durch die Körpermasse von Roß und Reiter oder durch die Ehrenspende die tiefe Erdspalte ausfüllte. 4. Öfter sogar, als wir wollten, haben verschmähte Auspizien der Götter Gegenwart erwiesen. So ist Allia ein Unglücksname geworden, so erlebten Claudius und Junius statt einer Schlacht gegen die Punier einen mörderischen Schiffbruch. Um den Trasimenersee durch Römerblut zu schwellen und zu färben, verachtete Flaminius die Augurien und um von den Parthern die Feldzeichen zurückfordern zu müssen, verdiente und verspottete Crassus die Unheilsdrohungen. 5. Ich übergehe die vielen Beispiele aus alter Zeit und schweige über die Lieder der Dichter auf die Geburtsfeste, Gaben und Geschenke der Götter, eile auch weg über die Weissagungen der Orakel; sonst könnte euch das Altertum als allzu fabelreich erscheinen. Aber schaue nur auf die Tempel und Heiligtümer der Götter, welche die Stadt Rom schützen und schmücken: sie sind mehr noch erhaben durch die Gottheiten, welche dort wohnen und gegenwärtig sind, als reich an äußerem Schmuck, Zierraten und Weihegeschenken. 6. Daher erhalten dort die Seher, von der Gottheit erfüllt und durchdrungen, Aufschluß über die Zukunft, bieten Vorsichtsmaßregeln für die Gefahren, Heilmittel für die Krankheiten, Hoffnung für die Bedrängten, Hilfe für die Unglücklichen, Trost für Leiden, Erleichterung in Mühseligkeiten. Sogar während der Nachtruhe sehen, hören, erkennen wir die Götter, welche wir am Tage gottlos leugnen, verschmähen und meineidig zu Zeugen anrufen.</p>
      <h2>8</h2><p>1. Unter allen Völkern herrscht also eine feste Übereinstimmung über das Dasein unsterblicher Götter, mag auch ihr Wesen oder ihr Ursprung noch so ungewiß sein. Daher kann ich es nicht billigen, wenn jemand mit so großer Vermessenheit und so gottloser Aufgeklärtheit auftritt, daß er diese so alte, so nützliche, so heilsame Religion aufzulösen oder zu schwächer trachtet. 2. Mögen auch ein Theodorus von Cyrene oder schon vorher Diagoras von Melos, welchem die Alten den Beinamen „Gottesleugner“ gegeben, durch die Leugnung der Götter alle religiöse Scheu, die vorher die Menschheit beherrschte, sowie die Gottesverehrung aufgehoben haben; nie werden sie mit dieser gottlosen Lehre ihrer falschen Philosophie einen Namen und Bedeutung gewinnen. 3. Die Athener haben einen Protagoras von Abdera, welcher mehr mit ruhiger Überlegung, als frivol über die Gottheit sich aussprach, aus ihrem Lande verbannt und seine Schriften in der Volksversammlung verbrannt. Ist es da nicht sehr zu bedauern, wenn Leute – ihr werdet entschuldigen, wenn ich im Eifer für die übernommene Sache meinen Gefühlen freien Lauf lasse – ich sage Leute einer bejammernswerten, unerlaubten und verzweifelten Gesellschaft gegen die Götter losziehen? 4. Es sind das Leute, welche aus der untersten Hefe des Volkes Unwissende und leichtgläubige Weiber, die ja schon wegen der Schwäche ihres Geschlechts leicht zu gewinnen sind, sammeln und eine ruchlose Verschwörerbande bilden. Sie verbrüdert sich in nächtlichen Zusammenkünften und bei feierlichem Fasten und unmenschlichen Gelagen nicht etwa durch eine heilige Zeremonie, sondern durch ein unsühnbares Verbrechen, ein duckmäuseriges und lichtscheues Volk, stumm in der Öffentlichkeit, nur in den Winkeln gesprächig. Die Tempel verachten sie als Grabmäler, die Götter verfehmen sie, über die Opfer lachen sie. Sie bemitleiden, selbst bemitleidenswert, wenn man so sagen darf, die Priester, verschmähen Ehrenstellen und Purpurkleider, obwohl sie selbst fast nicht fähig sind, ihre Blöße zu decken. 5. Welch merkwürdige Torheit und unglaubliche Keckheit! Sie machen sich nichts aus gegenwärtigen Martern, während sie ungewisse in der Zukunft fürchten. Sie sterben auf Erden ohne Furcht, fürchten aber einen Tod nach dem Tode. So täuscht sie eine Hoffnung hinweg über die Angst und beschwichtigt sie durch den Trostblick auf ein neues Leben.</p>
      <h2>9</h2><p>1. Und wie das Böse stets besonders üppig wuchert, so werden diese abscheulichen Heiligtümer einer ruchlosen Gesellschaft bei der täglich zunehmenden Sittenverderbnis bereits auf der ganzen Erde immer häufiger. Gründlich ausrotten und verfluchen muß man unbedingt diese Vereinigung. 2. Sie erkennen sich an geheimen Merkmalen und Zeichen und lieben sich gegenseitig fast, bevor sie sich kennen. Allenthalben üben sie auch unter sich sozusagen eine Art von Sinnlichkeitskult; unterschiedslos nennen sie sich Brüder und Schwestern: so wird sogar die gewöhnliche Unzucht durch diesen heiligen Namen zur Blutschande. So prahlt ihr gehalt- und sinnloser Aberglaube noch mit Schandtaten. 3. Wenn dem keine Wahrheit zugrunde läge, würde nicht das scharfsichtige Gerücht von diesen Leuten so ruchlose Dinge erzählen, die man, ohne vorher um Entschuldigung zu bitten, gar nicht sagen darf. Höre ich doch, daß sie den Kopf eines Esels, dieses verächtlichen Tieres, weihen und ich weiß nicht in welchem Wahn verehren, ein Kult, würdig solcher Sitten und aus ihnen entsprungen. 4. Andere erzählen, sie verehrten sogar die Genitalien ihres Vorstehers und Priesters und beteten so gleichsam ihres Vaters Schöpferkraft an. Dieser Argwohn kann falsch sein, aber jedenfalls stimmt er zu ihren geheimen und nächtlichen Feiern. Wer ferner einen Menschen, der für ein Verbrechen mit der härtesten Strafe belegt wurde, sowie das todbringende Kreuzesholz als Gegenstand ihrer Verehrung anführt, schreibt ihnen Altare zu, wie sie für verlorene und verkommene Existenzen passen; sie würden verehren, was sie eigentlich verdienen. 5. Nun gar die Geschichte von der Weihe neuer Mitglieder; sie ist ebenso abscheulich wie bekannt. Ein Kind, mit Teigmasse bedeckt, um die Arglosen zu täuschen, wird dem Einzuweihenden vorgesetzt. Dieses Kind wird von dem Neuling durch Wunden getötet, die sich dem Auge völlig entziehen; er selbst hält durch die Teighülle getäuscht die Stiche für unschädlich. Das Blut des Kindes – welch ein Greuel –schlürfen sie gierig, seine Gliedmaßen verteilen sie mit wahrem Wetteifer. Durch dieses Opfer verbrüdern sie sich, durch die Mitwissenschaft um ein solches Verbrechen verbürgen sie sich gegenseitiges Stillschweigen. Solche heilige Gebräuche sind schändlicher als jegliche Heiligtumsschändung. 6. Bekannt sind auch Ihre Schmausereien. Alles redet davon, auch unser Cirtenser zeugt dafür in seiner Erörterung. An einem festlichen Tag versammeln sie sich mit allen Kindern, Schwestern, Müttern, Leute jeglichen Geschlechts und Alters zum Schmause. Ist hierauf nach einem reichlichen Gastmahl die Tischgesellschaft erhitzt und die Glut unreiner Lust durch Trunkenheit entbrannt, so wird ein Hund, der an den Leuchter gebunden ist, durch einen vorgeworfenen Bissen gereizt. Er stürzt los und springt zum Fang über die Länge der Schnur, mit welcher er gebunden ist, hinaus. Dadurch wird das verräterische Licht umgestoßen und erlischt. Nun schlingen sie in einer der Schamlosigkeit günstigen Finsternis die Bande unsagbarer Leidenschaft, wie es gerade der Zufall fügt. So sind sie, wenn auch nicht alle durch die Tat, wenigstens durch ihr Mitwissen in gleicher Weise blutschänderisch; entspricht ja alles, was durch die Handlung des einzelnen geschehen mag, dem Wunsche der Gesamtheit.</p>
      <h2>10</h2><p>1. Vieles übergehe ich absichtlich. Dies allein schon ist mehr als genug und eben die Heimlichtuerei dieser verwerflichen Religion erweist all das oder so ziemlich alles als richtig. 2. Denn warum suchen sie so angelegentlich den Gegenstand ihrer Verehrung, wie er nun beschaffen sein mag, geheimzuhalten und zu verbergen? Freut sich nicht das Gute stets der Öffentlichkeit, während das Laster sich versteckt? Weshalb sonst hätten sie keine Altäre, keine Tempel, keine bekannten Götterbilder; warum reden sie nicht öffentlich, versammeln sich niemals ungescheut? Weil eben der Gegenstand ihrer Verehrung und Verheimlichung strafbar oder schändlich ist. 3. Woher aber stammt und wer ist und wo ist jener einzigartige, alleinstehende, verlassene Gott, welchen keine Republik, kein Königreich, nicht einmal die Religion der Römer kennt? 4. Nur das elende Judenvölkchen hat auch bloß einen Gott verehrt, jedoch öffentlich mit Tempeln, Altären, Opfern und Zeremonien. Aber seine Gewalt und Macht war so klein, daß er samt seinem Volk der Gefangene der Römer, also von Menschen, ist. 5. Doch welche Ungeheuerlichkeiten und Mißgestalten schafft erst die Phantasie der Christen! Ihren Gott kann man weder zeigen noch sehen und doch soll er die Sitten, Handlungen, Worte, ja sogar die geheimen Gedanken aller genau erforschen. Er muß also bald dahin bald dorthin eilen und überall gegenwärtig sein. So machen sie aus ihm einen Plage- und Wandergeist, der zudem unverschämt neugierig ist, wenn er wirklich bei allen Handlungen zugegen sein soll und allerorts umherschweift. Und doch kann er sich weder mit den einzelnen Dingen abgeben, wenn er auf das Ganze seine Tätigkeit ausdehnt, noch dem Ganzen genügen, wenn er sich in das Einzelne verliert.</p>
      <h2>11</h2><p>1. Doch noch mehr! Dem ganzen Erdkreis und der Weit selbst mit ihren Gestirnen drohen sie mit Verbrennung, sie sinnen nach über deren Zusammensturz, als ob die ewige, auf göttliche Gesetze gegründete Naturordnung zerstört oder das alle Elemente umschlingende Band zerrissen, das Himmelsgefüge gelöst werden und jener Riesenbau, welcher es zusammenhält und umgürtet, zusammenbrechen könnte. 2. Nicht zufrieden mit diesem Wahnwitz fügen sie noch Ammenmärchen dazu und verbinden sie damit. Sie sagen, nach ihrem Tode, wenn sie bereits Asche und Staub geworden, würden sie wieder neu geboren. Diese Lügen glauben sie einander mit unfaßbarer Vertrauensseligkeit. Man könnte wahrhaftig meinen, sie seien bereits ein zweites Mal lebendig geworden. 3. Eine zweifache Verkehrtheit und ein doppelter Unsinn, dem Himmel und den Gestirnen, welche wir so zurücklassen, wie wir sie vorfinden, den Untergang anzukünden, andererseits uns selbst nach Tod und Vernichtung wieder ein ewiges Leben in Aussicht zu stellen, während wir doch vergehen, wie wir entstehen. 4. Aus diesem Grunde verwünschen sie natürlich auch die Scheiterhaufen und verdammen die Feuerbestattung. Und doch wird jeder Leichnam, wenn er auch den Flammen entzogen wird, im Lauf der Jahre und durch die Länge der Zeit in Staub sich auflösen. Da ist es ganz gleichgültig, ob wilde Tiere ihn zerfleischen, das Meer ihn verschlingt, der Boden ihn deckt oder die Flammen ihn verzehren. Für die Leichen ist eben jede Bestattungsart, falls sie noch Empfindung haben, eine Marter, wenn aber die Empfindung erstorben, ist es für sie eine Wohltat, je schneller die Auflösung vor sich geht 5. Getäuscht durch diesen Irrwahn versprechen sie sich als den Guten nach ihrem Tode ein seliges und ewiges Leben, den übrigen künden sie als Ungerechten eine ewige Strafe an. Ich könnte darüber noch viel sagen, aber ich will mit meiner Rede zu Ende eilen. Daß sie gerade eher die Ungerechten sind, habe ich schon genügend erwiesen, ich kann mir die weitere Mühe sparen. Doch auch wenn ich sie für gerecht hielte, weiß ich: Schuld oder Unschuld werden nach der verbreitetsten Ansicht dem Schicksal zugeschrieben. 6. Das ist auch eure Ansicht: macht ihr ja alle Handlungen, wie andere vom Schicksal, so ihr von Gott abhängig. So behauptet ihr, daß nicht freier Wille, sondern Gnadenwahl zu eurer Religionsgemeinschaft führe. Ihr nehmt also einen ungerechten Richter an, welcher an den Menschen ihr Schicksal straft, nicht ihren Willen. 7. Ich möchte jedoch genauer wissen, ob man mit einem Leib [oder ohne Leib] und mit welchem Leib, mit dem gleichen oder einem neuen aufersteht. Ohne Leib? Das ist meiner Ansicht nach weder Geist noch Seele noch Leben. Mit dem gleichen Leib? Aber der ist doch schon längst zerfallen. Mit einem andern Leib? Dann entsteht ja ein neuer Mensch und wird nicht der alte wiederhergestellt. 8. Übrigens ist soviel Zeit hingegangen, unzählige Jahrhunderte verflossen: auch kein einziger ist von der Unterwelt wenigstens nach Art des Protesilaus, mit der Erlaubnis mindestens auf einige Stunden, zurückgekehrt, damit wir doch ein Beispiel für diesen Glauben hätten. 9. All das sind Fabeln einer krankhaften Einbildungskraft und schlechte Trostgründe, von den Dichtern erfunden, um ihrer Dichtung Reiz zu verleihen. Ihr habt sie allzu leichtgläubig schimpflicher Weise für euren Gott wieder aufgewärmt.</p>
      <h2>12</h2><p>1. Nicht einmal von der Gegenwart laßt ihr euch belehren, wie trügerisch die Verheißungen und nichtig die Wünsche sind, durch welche ihr euch täuschen läßt. Urteilt doch, ihr Unseligen, nach den Erfahrungen in eurem Leben, was nach dem Tode euer Los sein wird. 2. Seht nur! Ein Teil von euch, und zwar der größere und eurer Meinung nach der bessere, leidet Not und friert, hungert und plagt sich ab. Euer Gott duldet das und tut, als sähe er das nicht. Er will oder kann den Seinigen nicht helfen: also ist er entweder machtlos oder ungerecht! 3. Der du von einer Unsterblichkeit nach dem Tode träumst, merkst du noch nicht, wie es um dich steht, wenn dich eine lebensgefährliche Krankheit durchschauert, das Fieber dich durchglüht, wenn du von Schmerz geplagt wirst? Erkennst du noch nicht deine Hinfälligkeit? Wider Willen wirst du, Unglücksmensch, deiner Gebrechlichkeit überwiesen und doch willst du es nicht gestehen! 4. Aber ich will nicht länger von allgemeinen Tatsachen reden. Doch seht! Euch treffen drohende Erlasse, Hinrichtungen, Folter und Kreuze – aber nicht um sie anzubeten sondern um sie zu besteigen – auch Feuersgluten, wie ihr es vorausverkündet und fürchtet. Wo ist da jener Gott, welcher den Wiederauflebenden helfen kann, aber nicht den Lebenden? 5. Herrschen und regieren nicht die Römer ohne euren Gott, sind sie nicht ohne ihn im Genusse des ganzen Erdkreises und auch eure Gebieter? Ihr dagegen seid stets in Sorge und Angst und enthaltet euch der ehrbaren Vergnügungen. Ihr besucht keine Schauspiele, nehmt an den öffentlichen Prozessionen nicht teil; die öffentlichen Gastmähler und die heiligen Spiele finden ohne euch statt. Ihr verschmäht die Speisen, welche den Göttern geopfert und die Getränke, welche auf ihren Altären geweiht wurden. Demnach fürchtet ihr doch die Götter, die ihr leugnet! 6. Ihr bekränzt nicht mit Blumen euer Haupt, gönnt dem Leib keine Wohlgerüche. Ihr spart die Salben auf für die Leichname, versagt aber dafür den Gräbern die Blumenkränze, ihr schlotternden Bleichgesichter, würdig des Mitleids – aber unserer Götter. So ersteht ihr Armen weder nach dem Tode, noch lebt ihr vor demselben. 7. Wenn ihr also noch ein bißchen Klugheit oder Ehrgefühl habt, so höret auf, Himmelszonen, der Welten Schicksal und Geheimnisse zu ergründen. Es soll euch genügen, das zu erkennen, was euch sozusagen vor den Füßen liegt, zumal für Leute ohne Gelehrsamkeit und Bildung, ohne Erziehung und Lebensart, die nichts von politischen Dingen verstehen, um wieviel weniger göttliche Dinge erörtern können.</p>
      <h2>13</h2><p>1. Wenn jemand indes eine Neigung zum Philosophieren hat, so möge jeder von euch, der sich dazu berufen fühlt, den Fürsten der Philosophie, Sokrates, nach Kräften nachahmen. Seine Antwort auf Fragen über himmlische Dinge ist bekannt: “Was über uns ist, ist nicht für uns”. Mit Recht ist ihm deshalb vom Orakel das Zeugnis hervorragender Weisheit zuteil geworden. Was das Orakel, das hat er selbst gut eingesehen. Er wurde nämlich allen vorgezogen, nicht weil er alles wußte, sondern weil er erkannt hatte, daß er nichts wisse. So liegt im Eingeständnis der Unwissenheit die höchste Weisheit. 3. Aus dieser Quelle entsprang der sicher gehende Zweifel eines ArkesiIas und viel später eines Karneades und der meisten Akademiker in den höchsten Fragen. Das ist eine Richtung, nach welcher Ungelehrte ohne Gefahr und Gelehrte ruhmvoll philosophieren können. 4. Ferner, verdient nicht das zögernde Verfahren des Lyrikers Simonides die Bewunderung und Nachahmung aller? Dieser Simonides wurde vom Tyrannen Hiero nach seiner Ansicht über Wesen und Eigenschaften der Götter gefragt. Da erbat er sich zuerst einen Tag Bedenkzeit, dann ließ er die Frist noch um zwei Tage verlängern, hierauf fügte er gemahnt noch ebensoviel hinzu. Der Tyrann fragte nach der Ursache solchen Zauderns. Er antwortete, je langsamer er bei der Untersuchung zu Werke gehe, desto mehr verschleiere sich ihm die Wahrheit. 5. Das ist auch meine Ansicht. Man muß zweifelhafte Dinge lassen, wie sie sind, und nicht kühn und keck sich für das eine oder andere entscheiden, während doch so viele große Männer über Zweifel nicht hinauskommen, Sonst greift entweder ein Altweiberglaube Platz oder wird jede Religiosität untergraben."</p>
      <h2>14</h2><p>1. Also sprach Caecilius und mit einem triumphierenden Lächeln – der ungestüme Redefluß hatte seiner überschäumenden Entrüstung Luft gemacht – sagte er: „Nun, wagt hierauf Octavius, der Mann von der Sippe des Plautus, unter den Mühlknechten zwar der erste, aber unter den Philosophen der letzte, eine Entgegnung?“</p><p>2. Da fiel ich ein: „Unterlaß es, gegen ihn zu höhnen; es würde gegen die kunstgerechte Form deiner Rede verstoßen, wolltest du eher triumphieren, bevor beide Teile gründlich sich ausgesprochen haben. Zudem wollt ihr ja mit eurem Streit nicht Ruhm, sondern die Wahrheit erstreben. 3. Wohl hat mich deine Rede in ihrer wohlberechneten Abwechslung außerordentlich ergötzt; aber nicht bloß bei dem gegenwärtigen Streitfall, sondern überhaupt bei Disputationen jeder Art macht auf mich einen tieferen Eindruck die Tatsache, daß die augenscheinlichste Wahrheit je nach den Kräften der Redner und der Gewalt ihrer Beredsamkeit in ganz verändertem Lichte erscheint. 4. Bekanntlich liegt der Grund dieser Erscheinung in einer Schwäche der Zuhörer. Sie stimmen, durch den verführerischen Zauber der Worte vom Inhalt der Sache abgelenkt, urteilslos allem Gesagten zu und unterscheiden das Falsche nicht vom Wahren. Sie bedenken eben nicht, daß auch beim Unglaublichen Wahrheit und beim wahrscheinlich Klingenden Lüge sein kann. 5. Je öfter sie nun den Behauptungen glauben, desto häufiger werden sie von den Verständigeren des Irrtums überwiesen. Wenn sie sich nun oft durch ihre Leichtgläubigkeit getäuscht sehen, so klagen sie über die Unsicherheit der Wahrheit, anstatt die Schuld bei ihrem eigenen Urteil zu suchen. Die Folge ist, daß sie alles verwerfen und lieber alles in Schwebe lassen, als über trügerische Dinge ein Urteil abzugeben. 6. Darum müssen wir uns vorsehen, daß wir nicht in gleicher Weise von einem Widerwillen gegen alle Erörterungen erfüllt werden, wie viele allzu arglose Menschen sich zu Verwünschungen und zum Haß gegen ihre Mitmenschen hinreißen lassen. Denn zu leichtgläubig werden sie von Leuten hintergangen, welche sie für gut gehalten haben. Darnach fassen sie – wieder eine Verkehrtheit – gegen alle Welt Mißtrauen und scheuen als unredlich auch Leute, welche sie ruhig für ganz wacker ansehen konnten. 7. So laßt uns auf der Hut sein, da jede Sache eine doppelte Darstellungsweise zuläßt und da sehr oft die Wahrheit in unscheinbarem Gewande sich einer außerordentlichen Geriebenheit gegenübergestellt sieht, welche mitunter durch den Wortschwall die Glaubwürdigkeit eines unwiderleglichen Beweises erweckt. Darum wollen wir sorgfältig Punkt für Punkt erwägen, die gewandte Darstellung loben, das Richtige aber auslesen, anerkennen und gutheißen.“</p>
      <h2>15</h2><p>1. Da sprach Caecilius: „Du verläßt den Standpunkt eines gewissenhaften Schiedsrichters. Es ist eine schreiende Ungerechtigkeit, daß du die Kraft meines Vortrags durch eine höchst bedeutungsvolle Zwischenrede abschwächst, und doch sollte Octavius alles, wenn es ihm möglich ist, ungeschmälert und unverkürzt widerlegen“.</p><p>2. Ich entgegnete: „Meine Worte, über welche du mir Vorwürfe machst, sind im gemeinsamen Interesse gesprochen, wenn ich mich nicht irre; wir wollen nämlich in gewissenhafter Prüfung unser Urteil nicht nach rednerischem Wortschwall, sondern nach dem Wert der Dinge selbst abwägen. Doch nicht länger soll die Aufmerksamkeit abgelenkt werden, worüber du klagst; in aller Ruhe können wir nun die Antwort unseres ungeduldig harrenden Januarius anhören“.</p>
      <h2>16</h2><p>1. Jetzt begann Octavius: "Gewiß, ich will sprechen, so gut es in meinen Kräften steht, und du mußt mir beistehen, daß wir den Unrat bitterer Schmähungen durch den Fluß wahrheitsgemäßer Worte hinwegspülen. Ich will von vornherein nicht verhehlen, daß die Anschauungen meines Freundes Natalis unstet, ruhe- und haltlos hin- und herschwankten, derart, daß wir tatsächlich im Zweifel sind, ob sie durch Verschmitztheit in Verwirrung geraten oder aus Versehen ins Wanken gekommen sind. 2. Denn abwechslungsweise bekannte er sich bald zum Glauben an die Götter, bald bezweifelte er ihre Existenz. Wenn die Anordnung meiner Gegenrede also auf seine unsicheren Aufstellungen sich gründen würde, würde sie sich noch unsicherer gestalten. Doch bei meinem Natalis kann ich Arglist nicht annehmen und nicht glauben. Durchtriebene Sophisterei liegt seinem geraden Wesen ferne. 3. Wie steht es aber dann? Mancher, der die rechte Straße nicht kennt, bleibt an einem Scheideweg ängstlich stehen, weil er eben den Weg nicht kennt, und er wagt weder den einen zu wählen, noch kann er alle für richtig halten. So schwanken die Ansichten eines Menschen, der keinen sicheren Prüfstein für die Wahrheit hat, hin und her, je nachdem eine zweifelhafte Hypothese auftaucht. 4. Deshalb ist es kein Wunder, wenn Caecilius auch so in Gegensätzen und Widersprüchen sich bewegt, darin auf- und ab wogt und schwankt. Damit dies nicht auch in Zukunft geschehe, will ich all die verschiedenen Behauptungen durch die eine unumstößliche und erprobte Wahrheit gründlich widerlegen. Dann braucht er fürderhin nicht mehr zu zweifeln und zu schwanken.</p><p>5. Mein Bruder hat Verstimmung und Unwillen, Entrüstung und Schmerz darüber laut werden lassen, daß ungebildete, arme, unerfahrene Leute über himmlische Dinge reden. Er möge jedoch wissen, daß alle Menschen ohne Unterschied des Alters, Geschlechtes, Ranges als mit Vernunft und Bewußtsein begabt und dafür fähig erschaffen wurden; sie haben die Weisheit nicht durch ein gutes Geschick errungen, sondern von Natur aus mitbekommen. Ja auch die Philosophen oder andere, die als Erfinder in der Wissenschaft sich ein Andenken bei der Nachwelt bewahrt haben, galten für Plebejer, für ungelehrt und bettelarm, ehe sie sich durch ihre Findigkeit einen berühmten Namen erwarben. Noch mehr, während die Reichen in ihre Reichtümer verstrickt ein größeres Augenmerk auf das Gold zu richten pflegen, als auf den Himmel, haben unsere armen Glaubensgenossen die Weisheit ausgedacht und andern darin Unterricht gegeben. Daraus folgt, daß das Talent nicht durch Geld und nicht durch Studien errungen wird, sondern zugleich mit der Erschaffung des Geistes gegeben ist. 6. Man braucht sich also gar nicht aufzuregen und zu entrüsten, wenn ein gewöhnlicher Mensch über göttliche Dinge forscht, sich darüber eine Ansicht bildet und sie auch zum Ausdruck bringt. Es kommt eben nicht so sehr auf die angesehene Stellung des Sprechers, als auf die Richtigkeit des Gesprochenen an. Ja es ist sogar der Sinn desto klarer, je schmuckloser die Ausdrucksweise ist; so ist er nämlich nicht durch den Aufputz wohltönender Phrasen geschminkt, sondern bleibt durch die Richtschnur der Wahrheit in seiner Einfachheit erhalten.</p>
      <h2>17</h2><p>1. Ich habe nun nichts dagegen, wenn Caecilius vorzugsweise den Nachweis versucht hat, daß der Mensch sich selbst kennen und Umschau halten solle nach seinem Wesen, seinem Ursprung und seiner Bestimmung: ob er ein Gebilde aus den Grundstoffen oder ein Atomengefüge oder vielmehr von Gott erschaffen, gestaltet und beseelt sei. 2. Aber eben dies können wir nicht gründlich erforschen ohne eine Untersuchung über das Weltall. Denn beide Probleme sind so unzertrennlich miteinander verknüpft und verkettet, daß man das Wesen der Menschheit nicht erkennt, wenn man nicht auch das Wesen der Gottheit sorgfältig zu ergründen sucht, ebensowenig wie man Staatsgeschäfte gut führen kann, ohne den gesamten Staatsorganismus des Weltalls erkannt zu haben. Wir unterscheiden uns ja ohnedies von den wilden Tieren dadurch, daß sie, weil gebückt und zur Erde geneigt, nur zum Futtersuchen bestimmt sind. Wir jedoch, mit erhobenem Antlitz, mit dem Blick zum Himmel, mit Sprache und Vernunft, durch die wir Gott erkennen, erfassen und ihm nachstreben, dürfen und können die sich unsern Augen und Sinnen aufdrängende Herrlichkeit des Himmels nicht außer acht lassen. Es käme sogar einer Entweihung des Heiligsten gleich, im Staub zu suchen, was man in der Höhe finden soll. 3. Um so mehr scheinen mir Leute, welche glauben, dieser kunstreiche Weltenbau sei nicht nach göttlichem Plane errichtet, sondern habe sich durch beliebige planlos aneinanderklebende Brocken zusammengeballt, keinen Verstand und Sinn, ja keine Augen zu haben. 4. Denn was kann so offenkundig, so unbestreitbar und so klar sein wenn man die Blicke gen Himmel erhebt und alles unter und um uns prüft, als die Tatsache, daß es ein Wesen von ganz her vorragender Geisteskraft gibt, welches die ganze Natur belebt, bewegt, ernährt und regiert?</p><p>5. Schau nur den Himmel selbst an: wie weit dehnt er sich aus, wie rasch dreht er sich; des Nachts prangt er im Sternenglanze und am Tage wird er vom Sonnenlicht bestrahlt. Du erkennst daraus, welch wunderbares, ja göttliches Gleichgewicht der höchste Leiter in ihm wirken läßt. Sieh auch, wie der Sonnenumlauf das Jahr schafft und wie der Mond durch Zunahme, Abnahme, Verschwinden den Monat bestimmt. 6. Was soll ich sagen von dem immer wiederkehrenden Wechsel von Finsternis und Licht, wodurch wir abwechselnd Arbeit und Ruhe haben? Eine eingehendere Erörterung über die Gestirne, wie sie den Schiffskurs bestimmen oder die Zeit für Saat und Ernte ankünden, müssen wir den Astronomen überlassen. Es sind das Dinge, von denen jedes eines höchsten Baumeisters und einer vollkommenen Vernunft nicht bloß zur Erschaffung, Entstehung und Anordnung bedurfte, sondern auch ohne die größte Kraftanstrengung des Geistes nicht einmal empfunden, durchschaut und begriffen werden kann.</p><p>7. Weiter! Die Jahreszeiten und die Früchte der Erde folgen einander in bestimmter Abwechslung. Bezeugt da nicht der Frühling mit seinen Blüten, der Sommer mit seinem Erntesegen und der Herbst mit seinen lieblichen reifen Früchten wie der Winter mit den nötigen Oliven ihren Schöpfer und Stifter? Wenn diese Ordnung sich nicht auf die höchste Vernunft gründete, würde sie leicht gestört. 8. Welch weise Fürsorge bekundet es, damit nicht bloß ein beständiger Winter mit seiner eisigen Kälte erstarren mache oder bloß ein beständiger Sommer mit seiner Hitze versenge, die gemäßigte Temperatur des Herbstes und Frühlings dazwischen zu schieben; so folgen sich die Übergänge des Jahreskreislaufs unvermerkt und unschädlich auf ihrer Bahn.</p><p>9. Blick hin auf das Meer! Es wird begrenzt durch die Schranken des Ufers. Betrachte die verschiedenen Arten der Bäume, wie sie aus dem Schoße der Erde Leben empfanden. Schau auf den Ozean! In wechselnden Strömungen flutet er hin und zurück. Sieh die Quellen! Sie entströmen unversiegbaren Adern. Betrachte die Flüsse! Rastlos in steter Bewegung gleiten sie dahin. 10. Was soll ich reden von der zweckmäßigen Verteilung der steilen Bergeshöhen, der wellenförmigen Hügel und der ebenen Gefilde? Was soll ich sagen von den vielgestaltigen Schutzwaffen der Tiere gegeneinander? Die einen sind mit Hörnern bewaffnet, die andern mit Zähnen beschirmt und mit Klauen versehen, mit Stacheln bewehrt oder durch die Schnelligkeit ihrer Füße oder die Schwungkraft ihrer Federn geschützt. 11. In hervorragendem Maße bezeugt schon die Schönheit unserer eigenen Gestalt einen schöpferischen Gott: der aufrechte Gang, das erhobene Antlitz, die am höchsten Punkt wie auf einer Warte angebrachten Augen und alle andern Sinne, welche wie auf einer Burg sich zusammenfinden.</p>
      <h2>18</h2><p>1. Es würde zu weit führen, alle Einzelheiten aufzuzählen. Am Menschen gibt es kein Glied, das nicht des Bedürfnisses oder des Schmuckes wegen vorhanden wäre. Besonders auffallend ist es, daß alle dieselbe Körperform haben und doch jeder einzelne wieder abweichende Züge. So erscheinen wir alle - einander ähnlich und sind doch tatsächlich einander unähnlich. 2. Wie ist ferner die Art und Weise unserer Entstehung? Ist nicht der Fortpflanzungstrieb von Gott gegeben, ebenso wie die Erscheinung, daß die Mutterbrust bei Zeitigung der Frucht Milch gibt und der zarte Sprößling unter dem reichen Zufluß des Milchtaus heranwächst? 3. Doch nicht bloß für das Ganze sorgt Gott, sondern auch für die Teile. Britannien hat Mangel an Sonnenwärme; dafür erhält es durch das laue Meer ringsum eine mildere Temperatur. In Ägypten mäßigt der Nilstrom die Trockenheit; Mesopotamien entschädigt der Euphrat für die fehlenden Regengüsse. Dem Orient liefert der Indusfluß, sagt man, Samen und Wasser. 4. Wenn du in ein Haus kämest und sähest alles wohl eingerichtet, geordnet und geschmückt, so würdest du doch sicher annehmen, ein Herr walte darin viel vorzüglicher als alle jene guten Dinge. Ebenso sei versichert: auch im Hause der Welt, in welchem du am Himmel und auf der Erde eine weise Vorsicht, Ordnung und Gesetzmäßigkeit erkennst, ist ein Herr und Vater des Weltalls, der schöner ist als selbst die Gestirne und alle einzelnen Teile des Weltganzen.</p><p>5. Doch vielleicht meinst du, weil über die Existenz einer Vorsehung kein Zweifel obwalten kann, erforschen zu müssen, ob das himmlische Reich durch die Macht eines Einzigen oder durch den Willen einer Mehrheit regiert wird. Aber das klarzustellen ist nicht schwer; man darf nur die irdischen Reiche überdenken, welche jedenfalls ihr Muster im Himmel haben. 6. Wann hat je die Teilung einer Herrschaft mit Vertrauen begonnen und ohne Blut geendet? Ich will nicht reden von den Persern, welche nach dem Rossewiehern den Vorrang zuteilten, will schweigen von der veralteten Fabel vom Thebanerpaar. Weltbekannt ist die Erzählung über die Zwillingsbrüder, die Herrschaft über Hirten und Hütte betreffend. Die Kämpfe zwischen Schwiegersohn und Schwiegervater überfluteten den ganzen Erdkreis und das Geschick eines so großen Reiches bot nicht Raum für zwei. 7. Sieh weiterhin: Eine Königin haben die Bienen, einen Führer die Herden, einen Leitstier die Zugtiere. Du glaubst, daß im Himmel die höchste Macht geteilt ist und die Gewalt jener wahren, göttlichen Majestät gespalten ist. Aber es ist sonnenklar, daß Gott der Vater aller weder einen Anfang noch ein Ende hat. Er verleiht allen Dingen Dasein, sich selbst Unendlichkeit; er war vor der Welt sich selbst eine Welt. Er regiert durch sein Wort alles, was ist, ordnet es durch seine Vernunft und vollendet es durch seine Macht. 8. Man kann ihn nicht sehen; er ist zu licht für das Auge. Ebensowenig kann er betastet werden, denn er ist für die Berührung zu fein; auch nicht gemessen werden, denn er ist über unsere Sinne erhaben, unendlich, unermeßlich und nur sich selbst in seiner ganzen Größe bekannt. Unser Herz aber ist zu beschränkt, um ihn zu begreifen und deshalb schätzen wir ihn so am besten, wenn wir ihn unschätzbar nennen. 9. Ich möchte sprechen, wie ich denke: Wer Gottes Größe zu kennen glaubt, schmälert sie; wer sie nicht schmälern will, kennt sie nicht. 10. Man suche auch keinen Namen für Gott: „Gott“ ist sein Name. Nur da braucht man mehrere Worte, wo man die Einzelwesen in der Mehrheit durch besondere kennzeichnende Benennungen unterscheiden muß: dem Gott, welcher nur Einer ist, gehört das Wort „Gott“ ganz allein an. Wenn man ihn z. B. Vater nennt, so könnte man an einen fleischlichen Vater denken; wenn König, so könnte man einen irdischen vermuten; wenn Herrn, so wird man sicherlich ein sterbliches Wesen darunter verstehen. Laß die Namenszutaten weg und du wirst ihn in seiner vollen Klarheit schauen.</p><p>11. Übrigens herrscht in diesem Punkt nicht allgemeine Übereinstimmung? Ich horche auf das gewöhnliche Volk. Wenn es zum Himmel seine Hände emporhebt, sagt es nichts anderes als „Gott“ und „Gott ist groß“ und „Gott ist wahrhaftig“ und „so Gott will“. Ist das die natürliche Ausdrucksweise des Volkes oder das Gebetet eines gläubigen Christen? Auch wer Jupiter als Oberherrn anerkennt, täuscht sich im Namen, nimmt aber mit uns eine einheitliche Macht an.</p>
      <h2>19</h2><p>1. Ich höre auch die Dichter einen Vater der Götter und Menschen preisen und sagen, der Sterblichen Sinn richte sich danach, wie der Vater des Alls den Tag sende. 2. Was sagt Maro von Mantua? Spricht er nicht noch offener, treffender und wahrer: „Von Anbeginn“ nährt „den Himmel und die Erde“ und die übrigen Teile der Welt „der Geist von innen und bewegt sie der ihnen einwohnende Verstand. Daher haben das Geschlecht der Menschen und Tiere ihren Ursprung und alle andern Lebewesen“. Der gleiche Dichter nennt an einer andern Stelle diesen Verstand und Geist „Gott“. Seine Worte sind:</p><p>„Denn Gott durchdringe die Länder</p><p>Allzumal und die Strecken des Meers und die Höhen des Himmels.</p><p>Durch ihn werde der Mensch und das Tier, auch Regen und Feuer“.</p><p>Was anderes wird auch von uns Gott genannt, als Verstand und Vernunft und Geist?</p><p>3. Durchgehen wir, wenn es genehm ist, die Lehre der Philosophen. Du wirst finden, daß sie zwar in der Ausdrucksweise verschieden sind, aber im Grunde sich in dieser einen Ansicht zusammenfinden und übereinstimmen. 4. Ich übergehe jene alten, naturwüchsigen Philosophen, welche wegen ihrer Aussprüche sich den Namen der Weisen erworben haben. Thales aus Milet möge als erster von allen genannt sein; er hat zu allererst über himmlische Dinge eine Untersuchung angestellt. Dieser Thales von Milet nannte das Wasser den Urstoff der Dinge, Gott aber den Geist, welcher aus Wasser alles gebildet habe, eine Theorie von Wasser und Geist, viel zu hoch und zu erhaben, um von einem Menschen erfunden zu sein; es handelt sich um eine göttliche Offenbarung. Du siehst: die Ansicht des Vaters der Philosophie steht ganz mit der unserigen im Einklang. 5. Anaximenes sodann und später Diogenes von Apollonia erklären die Luft für eine unendliche und unermeßliche Gottheit: auch sie haben also eine ähnlich übereinstimmende Ansicht über Gott. 6. Von Anaxagoras aber wird Gott der ordnende und sich bewegende unendliche Geist genannt und des Pythagoras Gott ist ein durch die gesamte Natur gehendes und ausgebreitetes geistiges Wesen, aus dem auch alle beseelten Wesen ihr Leben empfangen. 7. Daß Xenophanes das endlose, mit Verstand begabte All für Gott erklärt, ist bekannt; ebenso die Behauptung des Antisthenes, es gebe zwar viele Volksgötter, aber nur einen über allem stehenden Naturgott; ebenso daß Speusippus eine beseelte Kraft, die alles regiert, als Gott anerkennt. 8. Spricht weiterhin Demokritus, wiewohl er der Erfinder der Atomenlehre ist, nicht sehr oft von der Gebilde hervorbringenden Naturkraft und von der Vernunft als Gottheit? Ebenso nennt Straton die Naturkraft Gott. Auch der bekannte Epikurus, der sich die Götter entweder müßig oder nichtbestehend denkt, setzt doch die Naturkraft über sie. 9. Aristoteles wechselt in seinen Ansichten; dort bezeugt er eine einzige Gewalt: er nennt bald den Geist, bald die Welt Gott, bald setzt er einen Gott über die Welt. Ebenso bleibt sich auch Theophrastus nicht gleich; er räumt bald der Welt, bald dem göttlichen Geist die erste Stelle ein. Auch Heraklides von Pontus schreibt der Welt freilich in wechselndem Sinne einen göttlichen Geist zu. 10. Zenon, Chrysippus und Kleanthes tragen ihrerseits verschiedene Ansichten vor, aber sie kommen alle schließlich auf eine Vorsehung zurück. Kleanthes nennt bald den Naturgeist und die Naturseele, bald den Äther, sehr oft die Vernunft Gott. Sein Lehrer Zenon stellt bald das natürliche und göttliche Gesetz und den Äther, bald die Vernunft an die Spitze aller Dinge. Er gerade faßt Juno als die Luft, Jupiter als den Himmel, Neptun als das Meer, Vulcan als das Feuer und die übrigen Volksgötter in ähnlicher Weise als Elemente auf und geht so dem irrigen Volksglauben zu Leibe und widerlegt ihn. 11. Fast das gleiche trägt Chrysippus vor. Er betrachtet die göttliche, mit Vernunft begabte Kraft, die Natur und Welt, bald auch das zwingende Verhängnis als Gott und folgt dem Zenon in der physiologischen Auslegung der Gedichte des Hesiod, Homer und Orpheus. 12. Auch Diogenes aus Babylon liebt diese Auslegung und Erklärung der Geburt des Jupiter, der Entstehung der Minerva und ähnlicher Dinge; sie seien Bezeichnungen für Weltvorgänge, nicht für Götter. 13. Xenophon, der Schüler des Sokrates, sagte vollends, die Gestalt des wahren Gottes könne nicht wahrgenommen werden und dürfe deshalb nicht erforscht werden. Nach dem Stoiker Ariston kann sie überhaupt nicht begriffen werden. Beide fühlten die Majestät Gottes, indem sie an der Möglichkeit, ihn zu erkennen, verzweifelten. 14. Platon führt über Gott eine deutlichere Sprache in der Sache, wie in den Namen. Sie wäre ganz himmlisch, wenn sie nicht manchmal durch Beimischung des Volksglaubens entstellt wäre. In der Tat ist der Gott Platons im Timaeus schon seinem Namen nach der Erzeuger der Welt, der Bildner der Seele, der Schöpfer der himmlischen und irdischen Dinge. Freilich sei es schwer, so sagt er im Anfang, wegen seiner übergroßen, unglaublichen Macht einen Begriff für ihn zu finden, und unmöglich, sein Wesen, auch wenn man es entdeckt hat, öffentlich darzulegen.</p><p>15. Ungefähr das gleiche ist auch unsere Ansicht: wir kennen Gott und nennen ihn Vater aller Dinge, sprechen aber doch nicht von ihm öffentlich, außer wir werden deswegen angeklagt.</p>
      <h2>20</h2><p>1. Ich habe nun die Ansichten fast aller Philosophen von größerer Bedeutung vorgetragen und gezeigt, daß sie trotz mannigfaltigster Benennungen doch nur einen Gott gekannt haben. So bekommt jeder die Meinung, entweder seien jetzt die Christen Philosophen oder die Philosophen seien schon früher Christen gewesen.</p><p>2. Wenn nun aber die Welt durch eine Vorsehung geleitet und durch den Wink eines Gottes regiert wird, so darf nicht das unwissende Altertum, das an seinen Märchen sich ergötzt hat oder vielmehr sich dadurch täuschen ließ, uns zu seinen irrigen Vorstellungen hinüberziehen. Denn es wird ja durch die Urteile seiner eigenen Philosophen widerlegt, denen außer der Autorität des Alters auch die der Vernunft zur Seite steht. 3. Unsere Vorfahren waren Lügen gegenüber so leichtgläubig, daß sie blindlings auch an andere Ungeheuerlichkeiten wahre Wunderdinge glaubten; an die vielgestaltete Scylla und Chimära und die aus fruchtbaren Wunden immer wieder neu hervorwachsende Hydra und die Centauren, Rosse, die mit ihren Reitern verwachsen wären. Kurz, was immer die Sage zu erdichten vermag, haben sie gern gehört. 4. Und nun gar jene Ammenmärchen, wonach aus Menschen Vögel und wilde Tiere, ja aus Menschen Bäume und Blumen geworden sein sollen! Wenn dergleichen geschehen wäre, so würde es jetzt noch geschehen; weil es aber nicht geschehen kann, deshalb ist es nicht geschehen. 5. In gleicher Weise haben auch unsere Vorfahren über die Götter sich geirrt: unüberlegt, leichtgläubig haben sie mit naiver Einfalt ihren Glauben gebildet. Während sie ihre Könige mit heiliger Scheu verehrten, während sie nach deren Hinscheiden das Bedürfnis fühlten, sie in Bildern vor Augen zu haben, und das Bestreben hatten, ihr Andenken in Statuen festzuhalten, wurde später ein Gegenstand des Kultes, was ursprünglich nur als Trostmittel gedient. 6. Endlich verehrte jedes Volk, bevor der Erdkreis dem Handel erschlossen ward und die Völker ihre Sitten und Gebräuche austauschten, seinen Stifter oder ruhmreichen Führer oder seine tugendhafte, mehr als weiblichen Mut zeigende Königin oder den Erfinder irgendeiner wohltätigen Einrichtung oder Kunst als einen Bürger von gutem Andenken. So ward den Verstorbenen eine Belohnung und den künftigen Geschlechtern ein Vorbild gegeben.</p>
      <h2>21</h2><p>1. Lies nur die Schriften der Geschichtsschreiber oder die Schriften der Philosophen und du wirst zum gleichen Urteil wie ich kommen, Euhemerus führt Personen auf, welche wegen der Verdienste ihrer Tapferkeit oder Wohltätigkeit für Götter gehalten wurden. Er zählt ihren Geburtstag, ihre Heimat, ihre Grabstätte auf und weist sie in den verschiedenen Provinzen nach, so vom Diktäischen Jupiter, vom Delphischen Apollo, von der Pharischen Isis und der Eleusinischen Ceres. Prodikus erklärt, es seien diejenigen zu Göttern gemacht worden, welche auf ihren Irrfahrten durch neu entdeckte Früchte sich den Menschen nützlich erwiesen haben. In derselben Richtung philosophiert auch Persaeus und führt außerdem noch die aufgefundenen Früchte und die Entdecker eben dieser Früchte mit den gleichen Namen an, ähnlich wie es ein Spruch der Komödie ist, Venus verkümmere ohne Liber und Ceres. 3. Der bekannte Mazedonier Alexander der Große berichtete in einem berühmten Schreiben an seine Mutter, aus Furcht vor seiner Macht habe ihm der Priester das Geheimnis betreffend die menschliche Natur der Götter verraten. Er macht darin Vulcan zum ersten aller Götter und an zweite Stelle setzt er das Geschlecht des Jupiter. 4. Den Saturn als Stammvater dieses Geschlechts und Schwarms haben denn auch alle alten griechischen und römischen Schriftsteller als Menschen dargestellt. Das bezeugen Nepos und Cassius in ihrer Geschichte; auch Thallus und Diodorus reden davon. 5. Dieser Saturn hatte sich auf der Flucht von Kreta nach Italien begeben, aus Angst vor seinem wütenden Sohn. Dort ward er von Janus gastfreundlich aufgenommen. Er lehrte nun jene unwissenden und bäurischen Menschen als feingebildeter Grieche mancherlei: die Kunst des Schreibens, die Münzprägung und die Anfertigung von Werkzeugen 6. Sein Versteck wollte er, weil er dort sicher geborgen war, Latium genannt wissen und er hinterließ nach seinem Namen zum Gedächtnis für die Nachwelt die Stadt Saturnia ebenso wie Janus das Janiculum. 7. Jedenfalls also war es ein Mensch, welcher floh und sich ein Versteck suchte und sowohl eines Menschen Vater wie eines Menschen Sohn. Denn als Sohn der Erde oder des Himmels galt er nur deshalb, weil man bei den Italern seinen Namen nicht kannte. Wir sagen ja auch heutigentags noch von Leuten, die uns plötzlich in die Augen kommen, sie seien vom Himmel gefallen und nennen Menschen von niedriger und unbekannter Herkunft Erdensöhne. 8. Sein Sohn Jupiter regierte auf Kreta, nachdem er seinen Vater vertrieben, starb dort und hatte Söhne daselbst. Noch heute besucht man die Höhle des Jupiter und zeigt sein Grab. So erweist sich sein menschlicher Ursprung schon durch die Art seiner Heiligtümer.</p><p>9. Es ist überflüssig, die Götter einzeln durchzugehen und ihre ganze Geschlechtsfolge zu entwickeln; es ist ja die an den Ureltern nachgewiesene Sterblichkeit schon durch die Erbschaftsordnung auf die übrigen übergegangen. Doch ihr sagt, sie seien erst nach dem Tode zu Göttern geworden, wie Romulus zu einem Gott wurde durch den falschen Eid des Proculus, und Juba Gott sei, weil es die Mauren wollten, und auch andere Könige vergöttert wurden. Aber sie erhalten religiöse Verehrung nicht zur Beglaubigung ihrer Gottheit, sondern nur zum ehrenden Andenken ihrer beendeten Regierung. 10. Kurz, man zwingt ihnen wider Willen diesen Titel auf: sie möchten gerne Menschen bleiben, fürchten sich davor, Götter zu werden und wollen dies auch als Greise nicht. 11. Also sind nicht aus Menschen Götter entstanden, weil ein Gott nicht sterben kann, noch aus Geborenen, weil alles stirbt, was geboren wird; göttlich aber ist das, was weder einen Anfang noch ein Ende hat, Warum werden denn nicht auch heute noch Götter geboren, wenn solche je geboren wurden? Aber Jupiter ist eben vielleicht altersschwach und Juno unfruchtbar geworden und Minerva ergraut, ehe sie geboren hat! Oder hörte etwa jene Zeugungskraft auf, weil derlei Märchen keinen Glauben mehr finden? 12. Wenn übrigens Götter ihr Geschlecht fortpflanzen, aber nicht sterben könnten, so wäre die Zahl der Götter größer, als die der Menschen in ihrer Gesamtheit. Der Himmel könnte sie nicht aufnehmen, die Luft nicht fassen und die Erde nicht tragen. Aus all dem geht klar hervor, daß jene vermeintlichen Götter nur Menschen gewesen sind, von deren Geburt wir lesen und von deren Tod wir wissen... (und von den Ähren der Isis zu der Schwalbe, der Klapper und zu dem Grabhügel deines Serapis oder Osiris, der infolge der Zerstreuung der Glieder leer steht).</p>
      <h2>22</h2><p>1. Betrachte endlich die heiligen Gebräuche und Mysterien selbst und du wirst auf traurige Todesfälle, Schicksalsschläge, Leichenbegängnisse, Trauerzeremonien und Leichenklagen bei den armseligen Göttern stoßen. Isis betrauert ihren verlorenen Sohn, beklagt ihn und sucht ihn mit ihrem hundsköpfigen Begleiter und ihren kahlköpfigen Priestern und die armen Isisverehrer zerschlagen sich die Brust und machen so den Schmerz der unglücklichen Mutter nach. Wenn dann der Kleine gefunden ist, freut sich Isis, jubeln die Priester und rühmt sich der hundsköpfige Finder, und unaufhörlich verlieren sie Jahr für Jahr, was sie finden, und finden, was sie verlieren, 2. Ist es nicht lächerlich zu betrauern, was man verehrt, oder zu verehren, was man beklagt? Und doch ist dieser ehemals ägyptische Gebrauch nun auch in Rom heimisch. Ceres sucht mit brennenden Fackeln, von Schlangen umgeben, ihre entführte und verführte Libera auf Irrwegen voll Angst und Besorgnis: das sind die Eleusinischen Mysterien. Welches sind ferner die heiligen Gebräuche Jupiter betreffend? Eine Ziege ist seine Amme; dem gierigen Vater wird das Kind entzogen, um nicht verschlungen zu werden, und durch die Musik der Korybanten wird Klirren verursacht, damit der Vater das Wimmern nicht höre. 4. Von den Didymamysterien der Cybele schämt man sich zu reden. Sie verstümmelt ihren Buhlen, der ihr unglücklicherweise gefiel, den sie jedoch, weil selbst eine häßliche Alte – sie war ja die Mutter vieler Götter –, nicht verführen konnte. Natürlich, man mußte doch auch einen Verschnittenen unter den Göttern haben. Diesem Märchen zulieb verehren sie die Cybelepriester und Halbmänner durch Verunstaltung ihres eigenen Körpers. Das sind keine heiligen Gebräuche mehr, sondern Foltern.</p><p>5. Beweisen überdies nicht schon die Gestalten und Körperzustände eurer Götter Lächerlichkeit und Schmach? Vulcanus ist ein lahmer und gebrechlicher Gott, Apollo ist trotz seiner vielen Jahre bartlos, Äskulap dagegen hat einen stattlichen Bart, wiewohl er Sohn des ewig jungen Apollo ist. Neptun hat graugrüne, Minerva hellblaue Augen, Juno Augen von einem Rind. Merkur hat geflügelte Füße, Pan Klauenfüße, Saturn gefesselte Füße. Janus gar hat zwei Stirnen, als ob er auch rückwärts gehen könnte. Diana ist bisweilen die hoch aufgeschürzte Jägerin; die von Ephesus mit vielen Brüsten und Zitzen ausgestattet, Diana Trivia bietet mit ihren drei Köpfen und vielen Händen einen grauenhaften Anblick. 6. Und erst euer Jupiter selbst! Bald ist er bartlos dargestellt, bald mit Vollbart abgebildet; unter dem Namen Hammon hat er Hörner, unter dem Namen Capitolinus trägt er Blitze, als Latiaris wird er mit Blut übergossen, als Feretrius mit einem Kranz versehen. Um nicht weiter von den vielen Jupiter zu sprechen; es gibt ebenso viele ungeheuerliche Darstellungen von Jupiter wie Namen. Erigone erhängte sich an einem Strick, damit eine „Jungfrau“ unter den Sternen erglänze. Das Kastorsche Brüderpaar stirbt abwechselnd, um dann wieder zu leben. Äskulap wird vom Blitze getroffen, auf daß er zur Gottheit emporsteige. Herkules wird auf den Höhen des Öta vom Feuer verzehrt, um den Menschen abzustreifen.</p>
      <h2>23</h2><p>1. Diese Fabeln und Irrtümer lernen wir von unverständigen Eltern und, was noch schwerer wiegt, wir verarbeiten sie sogar in unseren Studien und Schulen, besonders in den Werken der Dichter, welche durch ihren Einfluß der Wahrheit den größtmöglichen Eintrag getan haben. 2. Platon hat deshalb ganz mit Recht den berühmten, gefeierten und gekrönten Homer aus seinem im Dialog aufgebauten Staatswesen verbannt. 3. Er hat nämlich vor allem im Trojanischen Krieg eure Götter in das menschliche Tun und Treiben hereinversetzt; freilich treibt er damit nur seinen Scherz. Er hat sie paarweise zusammengestellt, läßt die Venus verwunden, den Mars fesseln, verletzen und in die Flucht schlagen. Nach ihm wurde Jupiter durch Briareus der Gefahr, von den andern Göttern gebunden zu werden, entrissen; nach ihm weinte er über seinen Sohn Sarpedon, weil er ihn dem Tode nicht entreißen konnte, blutige Tränenströme, und von dem Gürtel der Venus bezaubert umarmt er mit größerer Leidenschaft, als sonst seine Buhlerinnen, seine Gemahlin Juno. 5. Anderswo hat Herkules den Mist fortgeschafft und weidet Apollo dem Admetus sein Vieh. Dem Laomedon hat Neptun Mauern erbaut, aber der arme Maurer erhielt keinen Lohn für seine Arbeit. 6. Dort wird Jupiters Blitz zugleich mit den Waffen des Äneas auf dem Amboß geschmiedet, während doch Himmel und Donnerkeile und Blitze schon lange vorhanden waren, bevor Jupiter auf Kreta geboren war, und den Strahl eines wirklichen Blitzes Cyklop nicht nachmachen konnte, dagegen selbst ein Jupiter fürchten mußte.</p><p>7. Was soll ich erst sagen von Mars und Venus, die beim Ehebruch ertappt wurden, und von Jupiters schändlicher Neigung für Ganymed, die durch den Himmel eine heilige Weihe erhielt? Alle diese Geschichten haben nur den Zweck, menschlichen Lastern eine gewisse Berechtigung zu verschaffen. 8, Durch diese und ähnliche Dichtungen und nur zu verführerische Lügen wird der Knaben Geist verdorben. Unter dem tiefen Eindruck dieser Fabeln wachsen sie bis zur vollen Höhe der Manneskraft heran; mit diesen Vorstellungen werden die Bedauernswerten alt: und doch liegt die Wahrheit so nahe, freilich nur für den, der sie sucht.</p><p>9. Wer zweifelt nun daran, daß das Volk geweihte Bildnisse von solchen Menschen anbetet und öffentlich verehrt, wobei der Sinn und Verstand der Unwissenden durch die künstlerische Schönheit getäuscht, durch des Goldes Blitzen geblendet, durch des Silbers Blinken und des Elfenbeines Glanz betört wird? 10. Wenn aber jemand darüber nachsinnt, durch welche Marterinstrumente und welche Vorrichtungen jede Bildsäule geformt wird, so wird er sich schämen, einen Stoff zu fürchten, welcher in dieser Weise vom Künstler mißhandelt ward, um daraus einen Gott zu bilden. 11. Der hölzerne Gott, vielleicht das Stück eines Scheiterhaufens oder Marterpfahls, wird aufgehängt, zugehauen, gezimmert und gehobelt. 12. Der eherne oder silberne Gott wird öfters aus einem unsauberen Gefäß, wie das ein ägyptischer König wirklich getan hat, geschmolzen, mit Wimmern zurechtgeschlagen und auf Ambossen geformt. Der steinerne Gott wird behauen, gemeißelt und von einem gemeinen Kerl geglättet. Er fühlt die Schmach seiner Entstehung ebensowenig wie nachher die Ehrung durch eure Anbetung. 13. Aber vielleicht ist eben der Stein oder das Holz oder das Silber noch nicht der Gott? Wann aber tritt er dann ins Dasein? Er wird gegossen, gezimmert, gemeißelt: noch ist’s kein Gott. Er wird verlötet, zusammengesetzt, aufgerichtet: noch ist’s kein Gott. Er wird geschmückt, geweiht, angebetet: endlich ist es ein Gott, wenn nämlich der Mensch ihm diese Bestimmung gegeben und ihn dazu geweiht hat.</p>
      <h2>24</h2><p>1. Viel richtiger beurteilen die stummen Tiere eure Götter infolge ihres natürlichen Instinktes. Die Mäuse, Schwalben und Geier wissen wohl, daß jene keine Empfindung haben. Sie nagen daran, treten sie mit Füßen, setzen sich darauf und wenn ihr sie nicht verjagt, nisten sie sogar im Munde eures Gottes. Die Spinnen vollends überweben sein Gesicht und hängen an seinem Haupte ihre Fäden auf. 2. Ihr müßt sie abwischen, reinigen, abschaben und habt Angst vor ihnen, während ihr sie doch fertigt und schützt. Es denkt jeder von euch, er müsse erst einen Gott kennen, bevor er ihn verehrt; aber man leistet den Eltern gedankenlos Folge. Man will lieber einem fremden Irrtum beitreten, als sich selbst Glauben schenken, wahrend man doch keine Ahnung von dem hat, was man fürchtet. So wird im Gold und Silber die Habsucht geheiligt, so die Form gehaltloser Statuen zur Geltung gebracht, so ist der Aberglaube der Römer entstanden.</p><p>3. Wenn man ihre Gebräuche mustert, wieviel des Lächerlichen und Erbärmlichen findet sich dabei! Mitten im rauhen Winter laufen sie halbnackt herum, andere kommen mit einem Filzhut bedeckt, tragen alte Schilde herum, schlagen Pauken, tragen Götter bettelnd von Gasse zu Gasse. Manche Tempel darf man nur einmal im Jahr besuchen, manche gar nie. In einige darf kein Mann gehen; zu manchen Gottesdiensten ist den Frauen der Zutritt versagt; auch ist es für Sklaven ein sühneheischendes Vergehen, bestimmten Zeremonien anzuwohnen. Manche Heiligtümer bekränzt ein Weib, das nur einen Mann hat, andere ein Weib vieler Männer, und man sucht mit großem Eifer eines, das mehrere Ehebrüchen aufweisen kann. 4. Noch mehr, wer von seinem eigenen Blute opfert und durch seine Verwundungen Gnaden sucht, wäre der nicht besser gottlos, als in dieser Weise gottesfürchtig? Oder wer sich mit einer Scherbe hat entmannen lassen, wie verletzt der die Gottheit, wenn er sie so versöhnt. Wollte Gott Verstümmelte, so könnte er solche ja schaffen, nicht erst künstlich machen.</p><p>5. Wer sollte nicht einsehen, daß nur Unvernunft und Wahnwitz auf solche Tollheiten kommen kann und daß nur die große Schar der Irrenden sich gegenseitig Schutz gewährt? Hier liegt in der Masse der Wahnsinnigen eine Entschuldigung für den gemeinsamen Wahnsinn.</p>
      <h2>25</h2><p>1. Aber eben dieser Aberglaube, sagt man, hat den Römern ihre Herrschaft verschafft, vermehrt und begründet; sie haben sich nicht so sehr durch Tapferkeit als durch Religiosität und Frömmigkeit hervorgetan. Ja wahrhaftig! Die berühmte und weltbekannte Gerechtigkeitsliebe der Römer hat schon begonnen, als das werdende Reich in der Wiege lag. 2. Sind sie nicht bei ihrem Eintritt in die Weltgeschichte durch Verbrechen zusammengeführt worden und unter dem Schutz ihrer grauenerregenden Unmenschlichkeit herangewachsen. In einem Asyl hat sich ja der erste Kern des Volkes versammelt. Es waren Taugenichtse, Verbrecher, Blutschänder, Meuchelmörder, Verräter zusammengeströmt, und Romulus selbst beging einen Brudermord, um als Herr und Gebieter sein Volk im Verbrecherhandwerk zu überbieten. Das sind die ersten Anfänge dieses religiösen Staatswesens. 3. Bald darauf raubten, mißhandelten und entehrten diese Leute – ein beispielloses Verfahren – fremde Jungfrauen, die schon verlobt, schon Bräute waren, ja auch Ehefrauen, und begannen mit deren Vätern, also mit ihren eigenen Schwiegervätern, Krieg und vergossen das Blut von Verwandten. Was wäre gottloser gewesen, was frecher, was gewährte soviel Sicherheit gerade wegen der Dreistigkeit dieses Frevels? 4. Sodann die Nachbarn aus ihren Gebieten zu verjagen, die nächstgelegenen Städte samt Tempeln und Altären zu zerstören, die Gefangenen zusammenzutreiben, durch fremden Verlust und eigenes Verbrechen emporzukommen, das ist die Politik, welche die folgenden Könige und späteren Feldherrn mit Romulus teilen. 5. So ist alles, was die Römer haben, pflegen und besitzen, ein Lohn für ihre Keckheit. Alle Tempel stammen vom Ertrag ihrer Beute, das heißt aus zerstörten Städten, geplündertem Eigentum der Götter und von ermordeten Priestern. 6. Spott und Hohn ist es, besiegten Göttern zu huldigen, sie zu Gefangenen zu machen und sie dann nach dem Triumph anzubeten. Denn Erbeutetes anbeten heißt einen Tempelraub heilig halten, nicht Gottheiten. Ebenso oft also haben die Römer gefrevelt, als sie triumphiert, soviel Raub an den Göttern verübt, als sie den Völkern Siegeszeichen abnahmen, 7. Nicht ihrer Religiosität also verdanken die Römer ihre Größe, sondern ungestraftem Gottesraub. Konnten sie doch gerade in ihren Kämpfen an den Göttern keine Hilfe haben, gegen welche sie die Waffen ergriffen. Doch die, welche sie niedergekämpft, haben sie zu verehren angefangen, nachdem sie über dieselben Meister geworden. Wie aber können solche Götter für die Römer etwas tun, welche für die Ihrigen gegen deren Waffen nichts vermocht haben?</p><p>8. Wir kennen ja die einheimischen Götter. Es sind das die Götter Romulus, Picus, Tiberinus, Consus, Pilumnus und Volumnus. Die Cloacina erfand und verehrte Tatius, die Gottheiten Pavor und Pallor Hostilius; später wurde, ich weiß nicht von wem, Febris zur Göttin geweiht. Das ist der Aberglaube, welcher diese Stadt großgezogen; Krankheiten und Schwächezustände. Sind ja auch Acca Larentia und Flora, zwei ausgeschämte Dirnen, unter die Krankheiten und Gottheiten der Römer zu zählen. 9. Diese Götter natürlich haben den andern gegenüber, welche bei den verschiedenen Völkern verehrt wurden, ihre Herrschaft ausgedehnt. Denn der thracische Mars oder der Jupiter von Kreta oder Juno von Argos oder Samos oder Karthago oder Diana von Tauris oder die Göttermutter vom Ida oder jene ägyptischen Ungeheuer – Gottheiten kann man sie nicht nennen – haben doch nicht zu Roms Gunsten gegen ihre eigenen Verehrer Partei ergriffen.</p><p>10. Doch vielleicht ist bei den Römern die Keuschheit der Jungfrauen größer oder die Frömmigkeit der Priester reiner gewesen? Aber fast die Mehrzahl der Jungfrauen wurde, freilich ohne daß es Vesta wußte, wegen Unzucht bestraft; die übrigen blieben ungestraft, nicht weil sie die Keuschheit sorgfältiger bewahrt, sondern weil sie bei ihrer Unzucht mehr vom Glück begünstigt waren. 11. Wo aber werden mehr Buhlerinnen feilgeboten, Kuppeleien getrieben, Ehebrüche ausgesonnen, als von den Priestern zwischen Altären und Tempeln? Öfter sogar als selbst in den Bordellen wird in den Zellen der Tempelwächter glühender Leidenschaft gefrönt.</p><p>12. Übrigens hatten nach göttlicher Anordnung schon lange vor den Römern Weltreiche die Assyrer, Meder, Perser, Griechen und Ägypter, obwohl sie keine Pontifices, Arvalen, Salier, Vestalinnen und Auguren hatten und keine in einen Käfig gesperrten Hühner, um nach deren Lust oder Unlust zum Fressen die hohe Staatspolitik zu betreiben.</p>
      <h2>26</h2><p>1. Nun komme ich zu der bekannten römischen Vogelschau und Vogeldeuterei, welche nach deiner Versicherung mit der größten Mühe zusammengestellt wurde, deren Vernachlässigung Schaden, deren Beobachtung Glück gebracht habe. 2. Ach freilich, Clodius und Flaminius und Junius verloren deswegen ihre Heere, weil sie das Fressen der Hühner nicht bis zum Ende abwarten zu müssen glaubten. 3. Aber Regulus? Beobachtete er nicht die Himmelszeichen und geriet doch in die Gefangenschaft? Mancinus hielt treu den religiösen Brauch ein und wurde doch unter das Joch geschickt und ausgeliefert. Auch Paulus hatte freßlustige Hühner und wurde dennoch bei Cannä mit dem größten Teil des römischen Volkes bezwungen. 4. Gajus Cäsar verschmähte die Augurien und Auspizien, weiche ihn abhalten wollten, vor dem Winter Schiffe nach Afrika zu senden: desto leichter wurde ihm die Überfahrt und der Sieg. 5. Was und wieviel soll ich weiterhin über die Orakelsprüche reden? Amphiaraus verkündete nach seinem Tode die Zukunft, er, der nicht wußte, daß er von seiner Frau um ein Halsband werde verraten werden. Tiresias, der doch als Blinder die Gegenwart nicht sah, schaute die Zukunft voraus. 6. Den Orakelspruch des Pythischen Apollo über Pyrrhus hat Ennius erdichtet; hatte doch Apollo bereits aufgehört, in Versen zu sprechen. Sein bekanntes schlaues und doppelsinniges Orakeln hörte auf, als die Menschen anfingen, gebildeter und weniger leichtgläubig zu werden. Demosthenes beklagte sich, daß die Pythische Seherin „die Sprache Philipps rede“; er wußte eben von der Fälschung der Orakelsprüche.</p><p>7. „Doch bisweilen haben die Auspizien und Orakel doch das Richtige getroffen.“ Allerdings könnte man glauben, daß unter den vielen Lügen der reine Zufall den Anschein einer gewissen Planmäßigkeit gewonnen hat. Aber ich will gleich die Quelle des Irrtums und der Verkehrtheit, von der all jener finstere Dunst entquoll, tiefer ergründen und offener zutage legen.</p><p>8. Es gibt unreine, unstete Geister, welche von der himmlischen Kraft durch irdische Makel und Begierden herabgesunken sind. Nachdem sie nun durch die Last und den Sumpf ihrer Laster die Reinheit ihres Wesens eingebüßt, hören diese Geister nicht auf, zum Trost in ihrem Unglück, selbst verdorben, auch andere zu verderben und selbst betört, auch Menschen ihre törichten Irrtümer mitzuteilen und verstoßen von Gott, auch die Menschen durch Einführung falscher Religionen von Gott zu trennen. 9. Die Dichter kennen diese Geister als Dämonen, die Philosophen handeln davon, auch Sokrates weiß von ihnen; er hat ja nach dem Wink und Willen des Dämons an seiner Seite Geschäfte unterlassen oder übernommen. 10. Ebenso kennen die Magier nicht nur die Dämonen, sondern bewirken auch durch die Dämonen all ihr wunderliches Gaukelwerk. Unter ihrer Eingebung und ihrem Einfluß bringen sie ihre Zauberkünste hervor, wobei sie Nichtwirkliches zur Erscheinung bringen oder Wirkliches verschwinden lassen. 11. Der erste Magier in Wort und Werk, Hostanes, erweist dem wahren Gott gebührende Ehre, kennt aber auch Engel, das heißt Diener und Boten, welche den Thron Gottes umgeben und zu seiner Verehrung ihm zur Seite stehen derart, daß sie schon durch Wink und Miene ihres Herrn in Furcht erzittern. Der gleiche spricht auch von Dämonen als irdischen, unsteten und menschenfeindlichen Wesen. 12. Erzählt nicht ebenso Platon, der die Gotteserkenntnis für schwierig hält, von Engeln und Dämonen, ohne dabei Schwierigkeiten zu finden? Versucht er nicht in seinem Symposion, sogar die Natur der Dämonen zu beschreiben? Er denkt sie sich nämlich als eine Substanz, die zwischen der sterblichen und unsterblichen, also zwischen Körper und Geist, in der Mitte stehe, zusammengesetzt aus einer Mischung von irdischer Schwere und himmlischer Leichtigkeit. Daraus, belehrt er uns, erhalte auch die Neigung zur sinnlichen Liebe Gestalt; diese senke sich in die Menschenbrust und errege Empfindungen, bilde die Affekte und entfache die Glut der Leidenschaft.</p>
      <h2>27</h2><p>1. Diese unreinen Geister nun oder Dämonen, wie die Magier und Philosophen sie erklären, stecken hinter den geweihten Statuen und Bildern. Sie erreichen durch ihre Einwirkung ein Ansehen, als ob wirklich eine Gottheit zugegen wäre, indem sie bisweilen Seher begeistern, in Tempeln verweilen, hie und da die Fasern der Eingeweide beleben, den Vogelflug leiten. die Lose lenken, Orakelsprüche hervorrufen, die freilich in mehr Lügen eingehüllt sind, [als sie die Wahrheit enthalten]. 2. Denn sie täuschen sich und täuschen andere, da sie die reine Wahrheit nicht kennen und was sie davon wissen, zu ihrem Verderben nicht zugestehen. So ziehen sie die Menschen vom Himmel nach unten und lenken sie weg vom wahren Gott zu materiellen Dingen, stören das Leben, beunruhigen den Schlaf. Sie schleichen sich sogar heimlich in die Körper ein als feine Geister und bewirken Krankheiten, ängstigen die Seelen, verzerren die Glieder, um sie zu ihrer Verehrung zu nötigen. Sie erwecken den Anschein, als ob sie, durch den Fettdampf der Altäre und die geopferten Tiere gesättigt, eine Heilung bewirkt hätten, während sie doch nur die wieder freilassen, welche sie selbst gebunden hatten. 3. Daher auch die Rasenden, welche ihr öffentlich laufen seht, welche auch Wahrsager sind, nur außerhalb des Tempels; sie wüten gerade so, gebärden sich ebenso toll, wirbeln sich gleicherweise im Kreise herum. Gleich ist auch bei ihnen der Einfluß des Dämons, nur die Erscheinungsweise der Raserei ist anders. 4. Dämonischen Einflüssen sind auch jene Dinge zuzuschreiben, welche du eben vorhin erwähnt hast, daß Jupiter durch einen Traum die Wiederholung der Spiele forderte, daß das Kastorpaar auf Rossen erschien, daß ein Schiff dem Gürtel einer Römerin folgte.</p><p>5. Das alles geben die Dämonen selbst, wie die meisten von euch wissen, über sich selbst zu, so oft sie von uns durch die Folter der Beschwörungen und die Glut des Gebetes aus den Körpern ausgetrieben werden. 6. Saturnus selbst, Serapis, Jupiter und die ganze Dämonenwelt, die ihr verehrt, bekennen, überwältigt von Schmerz, was sie eigentlich sind, und sie lügen nicht, sicherlich zu ihrer Schande, zumal wenn einige aus euch zugegen sind. 7. Glaubt doch ihrem eigenen Zeugnis und Bekenntnis, daß sie Dämonen sind. Denn beschworen beim wahren und einzigen Gott, schaudern sie wider Willen in den Leibern armselig zusammen und verlassen dieselben entweder so fort oder verschwinden allmählich, je nachdem der Glaube des Besessenen mithilft oder die Gnadengabe des Heilenden einwirkt. So fliehen sie vor den Christen in deren nächsten Nähe, um sie in den Versammlungen durch euch aus der Ferne zu verfolgen. 8. Darum verbinden sie sich mit dem Geiste der Unverständigen und flößen heimlich mittels der Furcht Haß gegen uns ein; es ist ja natürlich, den zu hassen, welchen man fürchtet und den möglichst feindlich zu behandeln, welchen man scheut. So fesseln sie die Geister und verstocken die Herzen. Darum beginnen die Leute uns schon zu hassen, bevor sie uns nur kennen; sonst würden sie wohl, wenn sie uns kennen gelernt, uns folgen oder könnten uns wenigstens nicht verdammen.</p>
      <h2>28</h2><p>1. Wie sehr es aber ungerecht ist, ohne vorherige Kenntnisnahme und Prüfung abzuurteilen, wie ihr tut, das glaubt uns, die wir selbst das gleiche bedauern müssen. 2. Denn auch wir waren die gleichen wie ihr; wir dachten geradeso wie ihr, solange wir noch einstens verblendet und verstockt waren, nämlich daß die Christen ungeheuerliche Dinge verehrten, Kinder fräßen, unzüchtige Gelage miteinander feierten. Dabei haben wir nicht bemerkt, daß über sie solche Fabeln immer in Umlauf gesetzt, aber niemals untersucht oder bewiesen wurden und daß in der langen Zeit kein einziger den Verräter spielte, nicht um Verzeihung der Schuld, sondern um den Dank für die Anzeige zu ernten; ja daß es sich so wenig um etwas Böses handle, daß der angeklagte Christ weder errötete noch verzagte, nur eines bedauerte, nicht früher schon Christ geworden zu sein. 3. Wir aber, die wir doch in einzelnen Fällen Tempelräuber und Blutschänder, sogar Vatermörder zur Verteidigung und Vertretung übernahmen, glauben sie gar nicht anhören zu müssen. Ja bisweilen wüteten wir aus Mitleid um so grausamer gegen sie; wir folterten die Bekenner, um sie vor dem Tod zu retten, bis zum Widerruf. So wandten wir bei ihnen eine widersinnige Untersuchungsart an, die nicht die Wahrheit ergründen, sondern zur Lüge nötigen sollte. 4. Wenn dann ein Schwächerer, von Schmerz erdrückt und überwältigt, sein Christentum abgeleugnet hatte, dann waren wir ihm gewogen, wie wenn er durch Abschwörung des Christennamens schon alle seine Schandtaten durch diese Verleugnung gutmachen würde. 5. Erkennt ihr nun, daß wir ganz gleich gedacht und gehandelt haben, wie ihr denkt und handelt? Denn wenn die Vernunft und nicht dämonische Einflüsterung ihr Urteil abgäbe, so müßte man mehr in sie dringen, nicht, damit sie ihr Christentum ableugnen, sondern ihre blutschänderische Unzucht, ihren ruchlosen Gottesdienst, ihre Kinderopfer eingestanden. 6. Durch diese und ähnliche Fabeln haben die gleichen Dämonen die Ohren der Unverständigen gegen uns vollgestopft, um uns zum Gegenstand des Abscheus und der Verwünschung zu machen. Befremdlich ist das nicht; denn die öffentliche Meinung, die stets durch eingestreute Lügen Nahrung erhält, aber durch das helle Licht der Wahrheit in nichts zerrinnt, gehört auch zum Geschäft der Dämonen. Von ihnen nämlich wird eben das falsche Gerede verbreitet und unterhalten. 7. Daher kommt auch, was du gehört haben willst, daß ein Eselskopf bei uns Gegenstand göttlicher Verehrung sei. Wo ist der Tor, der so etwas verehrt? Wo ist der größere Tor, welcher eine solche Verehrung für wahr hält? Ihr freilich weiht gleich ganze Esel in euren Ställen zugleich z. B. mit eurer Epona und verzehrt eben solche Esel mit der Isis in frommer Verehrung. Ebenso opfert und verehrt ihr Rinds- und Widderköpfe. Auch ehrt ihr Götter, die halb Bock halb Mensch sind oder solche mit Löwen- und Hundsköpfen. 8. Betet ihr nicht mit den Ägyptern den Stier Apis an und füttert ihn? Auch mißbilligt ihr nicht die religiösen Kulte, welche für Schlangen, Krokodile und andere Ungetüme, für Vögel und Fische angeordnet sind; auf die Tötung eines solchen Tiergotts ist sogar Todesstrafe gesetzt. 9. Die gleichen Ägypter scheuen mit einer großen Anzahl von euch Isis nicht mehr als die Schärfe von Zwiebeln und bangen vor dem Serapis nicht mehr als vor dem durch gewisse Körperteile verursachten Geräusch. 10. Auch wer gegen uns fabelt, wir beteten die Genitalien des Priesters an, sucht auf uns zu übertragen, was für seinesgleichen paßt. Denn solche Unsauberkeiten mögen etwa denjenigen als heilige Gebräuche gelten, bei welchen beide Geschlechter alle Glieder preisgeben, bei welchen jede Art der Schamlosigkeit feine Bildung heißt, welche die Buhldirnen um ihre Freiheit beneiden, welche Männer mitten am Leibe lecken, die Schamglieder in ihren wollüstigen Mund nehmen, Leute böser Zunge, auch wenn sie schwiegen, die eher Ekel an ihrer Schamlosigkeit, als Scham über sie ergreift. OVerruchtheit! Sie begehen an sich Frevel, die das zartere Alter nicht ertragen, zu denen das abgehärtetere Sklavenvolk nicht gezwungen werden kann.</p>
      <h2>29</h2><p>1. Diese und ähnliche Schamlosigkeiten dürfen wir nicht einmal anhören; schon eine eingehendere Abwehr wäre geradezu unsittlich. Ihr erdichtet von keuschen und schamhaften Leuten Dinge, welche wir überhaupt nicht für möglich halten würden, wenn ihr nicht eurerseits dafür den Beweis liefern würdet.</p><p>2. Wenn ihr weiterhin einen Missetäter und sein Kreuz als Gegenstand unserer religiösen Verehrung erklärt, so irrt ihr weit von der Wahrheit ab, falls ihr glaubt, daß bei uns einer als Gott gilt, der eine Strafe verdient oder nur Irdisches vollbracht hat. 3. In Wirklichkeit ist der bedauernswert, dessen ganze Hoffnung sich auf einen sterblichen Menschen gründet; denn all seine Hilfe hat mit dem Tode dieses Menschen ein Ende. 4. Die Ägypter freilich wählen sich einen Menschen zur Verehrung aus; ihn allein suchen sie gnädig zu machen, ihn befragen sie über alles, ihm schlachten sie Opfertiere. Aber er, welcher den anderen als Gott gilt, bleibt wenigstens für sich ein Mensch, mag er wollen oder nicht; denn sein eigenes Bewußtsein betrügt er nicht, wenn er auch andere täuscht. 5. Sogar Fürsten und Königen wird nicht als großen und auserwählten Männern, wie es recht ist, sondern wie Göttern in schimpflicher Weise eine falsche Schmeichelei entgegengebracht und doch wäre für einen erlauchten Mann Ehre mehr am Platz und für einen Wohltäter Liebe wohltuender. So rufen sie dieselben als Gottheiten an, flehen zu ihren Standbildern, beten zu ihrem Genius, [besser gesagt Dämon,] und es dünkt ihnen weniger gefährlich, bei dem Genius des Jupiter falsch zu schwören, als bei dem des Königs.</p><p>6. Auch Kreuze beten wir nicht an und wünschen sie nicht. Ihr allerdings, die ihr hölzerne Götter weiht, betet vielleicht hölzerne Kreuze an als Bestandteile eurer Götter. 7. Was sind denn anders die militärischen Feldzeichen und Banner und Fahnen, als vergoldete und gezierte Kreuze? Eure Siegeszeichen haben nicht bloß die Gestalt eines einfachen Kreuzes, sondern erinnern auch an einen Gekreuzigten. 8. Das Kreuzeszeichen sehen wir auch ungekünstelt auf dem Schiffe, wenn es mit schwellenden Segeln fährt oder mit ausgestreckten Rudern dahingleitet. Auch wenn ein Joch errichtet wird, entsteht das Zeichen des Kreuzes; ebenso wenn ein Mensch mit erhobenen Händen Gott nur im Geiste verehrt. So liegt die Kreuzesform teils natürlichen Verhältnissen zugrunde, teils kommt sie bei euren religiösen Gebräuchen zur Verwendung.</p>
      <h2>30</h2><p>1. Jetzt möchte ich mich an den wenden, welcher behauptet oder glaubt, wir würden unsere Aufnahme erhalten durch die Ermordung und das Blut eines Kindes. Hältst du das für möglich, daß ein so weicher und kleiner Körper für todbringende Wunden empfänglich ist, daß jemand solch junges Blut eines Neugeborenen, der kaum schon ein Mensch ist, durch Hinmorden vergieße, ausspritze und schlürfe. Niemand kann das glauben, außer wer fähig ist, es auch zu tun. 2. Euch allerdings sehe ich die neugeborenen Kinder bald den wilden Tieren und Vögeln aussetzen, bald durch Erdrosseln auf jämmerliche Weise aus dem Leben schaffen. Manche Weiber vernichten im eigenen Leibe durch eingenommene Arzneien den Keim künftigen Lebens und begehen einen Kindsmord, ehe sie gebären. 3. Diese Dinge kommen allerdings vom Beispiel eurer Götter her. Saturnus hat ja seine Kinder nicht ausgesetzt, sondern aufgefressen. Dementsprechend wurden ihm in einigen Teilen Afrikas von den Eltern Kinder geopfert, wobei man ihr Gewimmer durch Liebkosungen und Küsse erstickte, um nicht ein weinendes Opfer darzubringen. 4. Den Tauriern am Pontus und dem Ägypter Busiris galt es als Religionsbrauch, Fremdlinge zu opfern, und bei den Galliern, dem Merkur menschliche oder vielmehr unmenschliche Opfer darzubringen. Die Römer haben einen Griechen und eine Griechin, einen Gallier und eine Gallierin als Opfer lebend begraben und heute noch wird Jupiter Latiaris von ihnen durch ein Menschenopfer verehrt und – würdig eines Sohnes des Saturn – mit dem Blute eines Bösewichts und Missetäters gemästet. 5. Er, glaube ich, war es, welcher den Katilina lehrte, den Bund der Verschwörung durch Blut zu besiegeln, und die Bellona, ihren Dienst durch Schlürfen von Menschenblut zu vollziehen, und die fallende Sucht durch Menschenblut, das heißt durch ein noch schlimmeres Übel zu heilen, 6. Nicht unähnlich sind ihnen die, welche die wilden Tiere von der Arena weg auffressen, die doch von Menschenblut überronnen und besudelt oder mit menschlichen Gliedmaßen und Eingeweiden gemästet sind. Uns hingegen ist es nicht einmal gestattet, ein Menschenmorden anzusehen oder anzuhören; ja so sehr haben wir Scheu vor Menschenblut, daß wir nicht einmal das Blut eßbarer Tiere unter unseren Speisen kennen.</p>
      <h2>31</h2><p>1. Über unzüchtige Gastmähler hat sodann die Dämonenbande eine großartige Fabel gegen uns ersonnen, um den Ruhm der Keuschheit durch Ausstreuung häßlicher Schmach zu besudeln; so wollten sie die Menschen vor der Erkenntnis der Wahrheit durch den Schrecken einer schlechten Meinung von uns abwendig machen. Auch dein Fronto z. B. hat darüber nicht ein bestätigendes Zeugnis abgelegt, sondern sich in rhetorischen Schmähreden ausgelassen. Doch solche Dinge sind eher bei euren Leuten vorgekommen. Bei den Persern gilt der geschlechtliche Verkehr mit den Müttern für erlaubt; bei den Ägyptern und Athenern sind Ehen mit den Schwestern gesetzmäßig. Eure Geschichten und Tragödien, die ihr gerne lest und hört, prahlen mit Fällen der Blutschande. So verehrt ihr auch unzüchtige Götter, die mit Mutter, Tochter und Schwester ehelich sich verbunden haben. 4. Natürliche Folge davon ist, daß man bei euch Blutschande oft trifft, immer aber zuläßt. Auch ohne Wissen, ihr Armen, könnt ihr in unerlaubte Verhältnisse geraten. Während ihr blindlings der Liebe frönt, allerorten Kinder zeugt, auch oft die im Hause geborenen Kinder fremdem Mitleid preisgebt, müßt ihr notwendig auf die eurigen zurückkommen, zu den leiblichen Kindern euch verirren. So schmiedet ihr eine Tragödie der Blutschande, auch ohne euch dessen bewußt zu sein. 5. Wir dagegen zeigen unsere Schamhaftigkeit nichts durch Äußere, sondern, durch unsere Gesinnung. Wir bleiben willig dem Bande einer Ehe treu, wissen entweder nur von einem Weibe, um unser Geschlecht fortzupflanzen, oder von keinem. Die Gastmähler, die wir veranstalten, sind nicht nur züchtig, sondern auch maßvoll. Wir huldigen nicht Schmausereien oder ziehen das Mahl durch Trinkgelage in die Länge, sondern wir wissen den Frohsinn durch Ernst zu zügeln. Keusch in Worten und noch keuscher dem Leibe nach erfreuen sich sehr viele der ewigen Jungfräulichkeit eines unbefleckten Leibes, ohne sich dessen zu rühmen. So ferne liegt uns die Begierde nach Blutschande, daß manche sich schämen, selbst eine züchtige Verbindung einzugehen.</p><p>6. Wenn wir ferner eure Ehrenstellen und Purpurkleider verschmähen, so folgt daraus noch nicht ohne weiteres, daß wir aus der Hefe des Volkes bestehen. Ebensowenig sind wir parteisüchtig, wenn wir alle für ein Gut begeistert sind, gleich friedfertig in Gesellschaft wie allein, Auch sind wir nicht „nur in Winkeln redselig“, wenn ihr euch schämt oder fürchtet, uns öffentlich zu hören.</p><p>7. Wenn sich ferner unsere Zahl täglich mehrt, so ist das nicht ein Beweis für Verirrungen, sondern ein ruhmvolles Zeugnis. Denn einer schönen Lebensweise bleiben die alten Freunde treu und schließen sich neue an. 8. So erkennen wir uns auch leicht nicht etwa an einem körperlichen Merkmal, sondern am Wahrzeichen der Unschuld und Bescheidenheit. So haben wir, worüber ihr euch ärgert, gegenseitige Liebe, weil wir von Haß nichts wissen. So nennen wir uns – das erregt euren Neid – Brüder als Menschen des einen göttlichen Vaters, als Glaubensgenossen und Miterben der Hoffnung. Ihr dagegen zollt einander keine Anerkennung, brecht wütend in gegenseitigen Zorn aus und erkennt euch nicht als Brüder an, außer etwa um einen Brudermord zu begehen.</p>
      <h2>32</h2><p>1. Glaubt ihr aber, wir halten den Gegenstand unserer Verehrung geheim, wenn wir keine Tempel und Altäre haben? Welches Bild soll ich für Gott ersinnen, da doch im Grunde genommen der Mensch selbst Gottes Ebenbild ist? Welchen Tempel soll ich ihm bauen, da diese ganze Welt, das Werk seiner Hände, ihn nicht zu fassen vermag? Und während ich als Mensch geräumiger wohne, soll ich die Größe solcher Majestät in eine einzige Zelle einschließen? 2. Müssen wir nicht besser in unserer Seele ihm ein Heiligtum errichten, nicht lieber in unserer Brust eine Stätte weihen? Kleine und große Tiere soll ich Gott opfern, welche er doch zu meinem Nutzen erschaffen, so daß ich ihm eigentlich seine Gabe zurückgebe? Das wäre undankbar, wenn doch ein gutes Herz, ein reiner Sinn und ein unbeflecktes Gewissen ein angenehmes Opfer ist. 3. Wer also Unbescholtenheit übt, der erfleht Gottes Barmherzigkeit; wer Gerechtigkeit liebt, bringt Gott Spenden dar; wer sich von Betrug fernhält, versöhnt Gott; wer einen Menschen der Gefahr entreißt, schlachtet das beste Opfertier. Das sind unsere Opfer, das ist Gottesdienst. So gilt bei uns der Gerechteste als der Frömmste.</p><p>4. Freilich den Gott, den wir verehren, können wir weder sehen lassen noch selbst sehen. Gerade deswegen gilt er uns als Gott, weil wir ihn wahrnehmen, aber nicht schauen können, Denn in seinen Werken und in allen Bewegungen der Welt schauen wir immer seine Macht gegenwärtig, im Donner, Blitz und Wetterleuchten wie bei heiterem Himmel. 5. Darüber brauchst du dich gar nicht zu wundern, daß du Gott nicht siehst. Durch die wehenden Winde kommt alles in Bewegung, Schwingung und Antrieb, und doch kommt der Hauch des Windes nicht unter unsere Augen. In die Sonne, die doch allen das Sehen ermöglicht, können wir nicht schauen; durch ihre Strahlen wird die Schärfe des Auges geschwächt, der Blick des Anschauers wird verdunkelt, und wenn man länger hinsieht, wird die Sehkraft ganz zerstört. 6. Wie? Den Schöpfer der Sonne, den Urquell des Lichtes, sollte dein Blick ertragen können, wenn du schon vor seinen Blitzen dich abwendest und vor seinen Weiterstrahlen dich verbirgst? Du willst Gott mit fleischlichen Augen sehen, während du doch deine eigene Seele, welche dir Leben und Sprache verleiht, nicht sehen und nicht greifen kannst?</p><p>7. Du meinst, dieser Gott wisse nichts vom Tun und Treiben der Menschen und könne von seinem Thron im Himmel nicht zu allen kommen und alle kennen. O Mensch, das ist ein Irrtum und eine Täuschung. Wie kann denn Gott weit weg sein, da doch der ganze Himmel und die ganze Erde und alles außerhalb des Erdkreises von Gott erfüllt ist. Überall ist er nicht nur uns ganz nahe, sondern sogar in uns. 8. Betrachte nur noch einmal die Sonne. Sie steht am Himmel und doch ist ihr Licht über alle Länder ausgegossen; allerorts ist sie gleichmäßig gegenwärtig, dringt in alles ein und nirgends wird ihr Glanz getrübt. 9. Um so mehr ist Gott, der alles erschafft und schaut, vor dem nichts verborgen bleiben kann, gegenwärtig in der Finsternis, gegenwärtig in unseren Gedanken, gleichsam einer Finsternis anderer Art. Wir handeln nicht bloß unter seinen Augen, sondern leben, möchte ich fast sagen, mit ihm.</p>
      <h2>33</h2><p>1. Auch wollen wir uns nicht wegen unserer großen Zahl schmeicheln. Uns erscheint unsere Zahl groß, in den Augen Gottes ist sie verschwindend klein. Wir unterscheiden Völker und Stämme: für Gott ist die ganze Welt nur eine Familie. Könige kennen den Zustand ihres Reiches durch die Dienste ihrer Beamten; Gott braucht keine Berichte. Leben wir doch nicht bloß unter seinen Augen, sondern in seinem Schoße.</p><p>2. Aber „den Juden hat es nichts genutzt, daß auch sie einen einzigen Gott mit Altären und Tempeln aufs ängstlichste verehrt haben“. Du irrst aus Unkenntnis, indem du die Vergangenheit vergessen hast oder unkundig nur der späteren Zeit gedenkst. 3. Denn auch sie wurden, solange sie unseren Gott – er ist ja derselbe Gott für alle – [ihn nämlich] in Reinheit, Unschuld und Ehrfurcht verehrten, solange sie seinen heilsamen Geboten gehorchten, aus wenigen eine zahllose Schar, aus Armen reich, aus Knechten zu Herrschern. In kleiner Zahl haben sie viele, wehrlos haben sie einen wohlgerüsteten Feind, auf der Flucht ihre Verfolger auf Gottes Geheiß und mit Hilfe der Elemente überwältigt. 4. Lies nur ihre Schriften oder forsche, um ältere Schriftsteller zu übergehen, bei Flavius Josephus oder, wenn du Römer bevorzugst, bei Antonius Julianus über die Juden nach. Dann wirst du einsehen, daß sie durch ihre Verworfenheit sich ihr Schicksal zugezogen und daß nichts geschehen ist, was ihnen nicht für den Fall fortgesetzter Verstockung schon vorausverkündet war. 5. So wirst du begreifen, daß sie zuerst Gott verlassen, bevor er sie verlassen hat, und daß sie nicht, wie du freventlich sagst, samt ihrem Gott in Gefangenschaft gerieten, sondern von Gott als Verräter an seinem Gesetz preisgegeben wurden.</p>
      <h2>34</h2><p>1. Über den Weltbrand ferner ist es ein verbreiteter Irrtum, wenn man nur schwer oder gar nicht glauben will, daß plötzlich Feuer vom Himmel fallen. 2. Welcher Weltweise zweifelt, wer wüßte es nicht, daß alles, was entsteht, auch vergeht und alles Geschaffene auch wieder zunichte wird, daß auch der Himmel mit allem, was er enthält, ein Ende nehmen wird, wie er einen Anfang gehabt. Daß so die ganze Welt, wenn das süße Quellwasser und das Meerwasser nicht mehr die Sonne, den Mond und die übrigen Gestirne nährt, in ein gewaltiges Feuer aufgehen müsse, ist die beständige Ansicht der Stoiker; wenn nämlich die Feuchtigkeit verdunstet sei, gerate diese ganze Welt in Brand. 3. Auch die Epikureer haben über die Verbrennung der Elemente und die Zerstörung der Welt genau die gleiche Ansicht. 4. Platon sagt, daß die Bestandteile der Welt abwechselnd bald überflutet werden, bald in Brand geraten. Wenn er auch erklärt, daß die Welt selbst ewig und unauflöslich geschaffen sei, so fügt er doch hinzu, daß sie für Gott, ihren Werkmeister, allein zerstörbar und vergänglich sei. Darum ist es nicht zu verwundern, wenn diese Weltmasse von dem gelöst wird, der sie zusammengefügt hat. 5. Du siehst, daß die Philosophen das nämliche lehren wie wir, nicht als ob wir ihren Spuren gefolgt wären, sondern weil sie aus den göttlichen Weissagungen der Propheten das Schattenbild einer freilich entstellten Wahrheit übernommen haben.</p><p>6. Daher haben auch die berühmtesten Philosophen, zuerst Pythagoras, besonders aber Platon die Wahrheit der Wiedererstehung allerdings entstellt und nur halbrichtig gelehrt. Sie nehmen an, daß nach Lösung der körperlichen Bande nur die Seelen fortdauern und immer wieder in andere neue Körper übergehen. 7. Dazu fügen sie – noch eine größere Verdrehung der Wahrheit – die Behauptung, daß die Menschenseelen in Haustiere, Vögel und wilde Tiere zurückkehren. Wahrhaftig eine solche Anschauung ist nicht des Studiums eines Philosophen, sondern des Spottes eines Komikers wert. 8. Doch genügt es für unseren gegenwärtigen Zweck, daß eure Weltweisen auch in dieser Sache einigermaßen mit uns übereinstimmen. 9. Wer ist übrigens so töricht und beschränkt, um einen Widerstreit gegen den Satz zu wagen, daß der Mensch von Gott ebenso neu geschaffen werden könne, wie er das erste Mal von Gott geschaffen werden konnte, daß der Mensch nichts sei nach dem Tode und nichts gewesen sei vor seiner, Geburt, also aus nichts wiederhergestellt werden könne, wie er aus nichts entstehen konnte. Im Gegenteil, es ist schwieriger, dem, was noch nicht ist, einen Anfang zu geben, als das, was bereits vorhanden war, wieder ins Dasein zu rufen. 10. Du meinst, es gehe etwas auch für Gott verloren, wenn es unseren schwachen Augen entrückt ist? Jeder Körper, mag er nun zu Staub verdorren oder in Feuchtigkeit sich auflösen oder zu Asche zerfallen oder in Fettdampf sich verflüchtigen, wird bloß uns entzogen, aber für Gott, den Erhalter der Elemente, ist er noch da. Wir fürchten auch nicht, wie ihr glaubt, irgendeinen Verlust durch die Art der Totenbestattung, aber wir üben die altehrwürdige und edlere Sitte der Beerdigung. 11. Schau ferner, wie zu unserem Trost die ganze Natur auf die künftige Auferstehung anspielt. Die Sonne geht unter und wieder auf; die Sterne schwinden und kommen wieder, die Blumen sterben ab und leben wieder auf, die Gesträucher bekommen wieder junges Laub, nachdem sie entblättert waren, und nur aus verwestem Samen keimt neues Leben. So ist’s mit dem Körper in der Zeitlichkeit wie mit den Blumen im Winter: sie verbergen frische Lebenskraft hinter scheinbarer Erstarrung. 12. Was verlangst du so ungeduldig, daß er schon bei Winterfrost wiederauflebe und zurückkehre? Wir müssen auch für den Körper den Frühling abwarten. Freilich, ich weiß wohl, daß sehr viele im Bewußtsein ihrer Schuld mehr wünschen als glauben, daß sie nach dem Tode in Nichts zerfallen. Sie möchten eben lieber ganz vernichtet werden, als zu Qualen auferstehen. Ihr Irrtum findet Nahrung durch die Freiheit, welche ihnen in dieser Welt gelassen ist und durch die übergroße Langmut Gottes, dessen Gericht um so gerechter ist, in später es kommt.</p>
      <h2>35</h2><p>1. Und doch werden die Menschen durch die Bücher der gelehrtesten Männer und die Gesänge der Dichter an jenen feurigen Strom und jene Glut erinnert, welche immer wieder vom Stygischen Sumpf aus ihren Umlauf beginnt. Beides haben sie als ewige Peinigungsmittel aus den Mitteilungen der Dämonen und den Aussprüchen der Propheten erkannt und gelehrt. 2. Und deshalb schwört nach ihnen sogar Jupiter selbst, der Götterkönig, bei den versengenden Gestaden und dem finsteren Schlund in heiliger Scheu: er weiß eben die Strafe, die ihm und seinen Anbetern harrt, voraus und erschaudert davor. 3. Und für diese Martern gibt es weder Maß noch Ende. Dort brennt ein klug berechnendes Feuer die Glieder und heilt sie wieder, zerfrißt sie und nährt sie wiederum. Und wie das Feuer des Blitzes den Körper berührt, aber nicht verzehrt, wie die Feuer des Ätnaberges und des Vesuvs und sonstiger Erdbrände lodern, ohne sich zu verbrauchen, so wird jenes strafende Feuer nicht durch Verzehrung der brennenden Körper genährt, sondern durch deren unaufhörliche Zerfleischung erhalten. 4. Daß aber diejenigen, welche Gott nicht kennen, mit Recht gemartert werden, als Ruchlose, als Ungerechte, das kann nur ein Gottloser bezweifeln; ist es ja gewiß kein geringerer Frevel, den Vater des Alls und Herrn des Alls nicht zu kennen, als ihn zu beleidigen. 5. Es reicht nun zwar schon die Unkenntnis Gottes zur Strafwürdigkeit hin, wie seine Erkenntnis zur Aussicht auf Verzeihung beiträgt. Indessen werden wir Christen im Vergleich mit euch, wenn auch bei einigen unsere Vorschriften zu wenig ausgeprägt sind, viel besser als ihr befunden. 6. Denn ihr verbietet den Ehebruch und begeht ihn; wir sind als Ehemänner nur für unsere Ehefrauen auf der Welt. Ihr straft Vergehen, die ihr zulaßt; bei uns gilt schon der bloße Gedanke daran als Sünde. Ihr fürchtet die Mitwisser, wir sogar das Gewissen allein schon, ohne das wir nicht sein können. Von euren Leuten endlich wimmeln die Gefängnisse; Christ ist dort keiner, es sei denn, er ist wegen seiner Religion angeklagt oder abtrünnig geworden.</p>
      <h2>36</h2><p>1. Suche sich niemand mit einem Verhängnis zu trösten oder sein Endschicksal zu entschuldigen. Angenommen, das Lebensgeschick hänge vom Zufall ab, so ist doch der Geist frei und deshalb bildet die Handlungsweise des Menschen, nicht seine Stellung, den Gegenstand des Urteils. 2. Was ist denn das Verhängnis anderes, als was Gott über einen jeden von uns bestimmt hat. Da er unseren Charakter zum voraus kennt, bestimmt er entsprechend den Verdiensten und Eigenschaften der einzelnen auch ihre Geschicke. So wird an uns nicht unser angeborenes Naturell bestraft, sondern unsere Geistesrichtung. Doch genug vom Verhängnis, wenn es auch wenig ist für jetzt; wir wollen ein anderes Mal ausführlicher und erschöpfender darüber handeln.</p><p>3. Wenn wir übrigens zum großen Teil für arm gelten, so ist das keine Schande, sondern ein Ruhm für uns. Wohlleben schwächt den Geist, Mäßigkeit kräftigt ihn. 4. Doch wie kann arm sein, wer keine Bedürfnisse fühlt, wer nicht nach fremdem Gut begehrt, wer reich ist in den Augen Gottes? Weit mehr ist der arm, welcher immer noch mehr begehrt, wiewohl er schon viel hat, 5. Doch ich möchte sagen, wie ich denke: niemand kann so arm sein, wie er bei seiner Geburt war. Die Vögel leben ohne Erbgut und das Vieh findet jeden Tag sein Futter, und doch sind diese Geschöpfe nur unsertwegen auf der Welt und wir besitzen all das, wenn wir es nicht begehren. 6. Wie nun der, welcher auf der Straße wandert, um so besser daran ist, je leichter sein Bündel ist, so ist auf dem Lebensweg glücklicher daran, wer sich durch Armut leicht macht und nicht unter der Last des Reichtums seufzt. 7. Und doch würden wir Reichtümer, wenn wir sie für nützlich hielten, von Gott erbitten. Er könnte jedenfalls uns einen Anteil davon geben; es ist alles sein Eigentum. Aber wir wollen lieber die Reichtümer verschmähen, als sie festhalten. Wir wünschen uns lieber Unbescholtenheit, bitten lieber um Ergebung, wollen lieber gut sein, als verschwenderisch.</p><p>8. Wenn wir ferner menschliche Schwächen des Körpers fühlen und darunter leiden, so ist das nicht Strafe, sondern eine Kampfesübung. Denn die Seelenstärke wird durch solche Schwächen erhöht und das Unglück ist oft genug eine Tugendschule. Ja, ohne Übung und Anstrengung erlahmen die Geistes- und Körperkräfte. Sind doch sogar eure Helden, welche ihr als Vorbilder hinstellt, sämtlich durch ihre Drangsale berühmt geworden. 9. So kann auch uns Gott zu Hilfe kommen und verachtet uns nicht, da er ja der Herr des Alls ist und die Seinen liebt. Aber in den Widerwärtigkeiten erforscht und prüft er einen jeden, in den Gefahren wägt er den Charakter der einzelnen, bis zum letzten Todesröcheln erprobt er die Gesinnung des Menschen, ohne besorgen zu müssen, daß ihm etwas entgeht. So werden wir, wie das Gold im Feuer, durch Anfechtungen geprüft.</p>
      <h2>37</h2><p>1. Welch ein herrliches Schauspiel ist es für Gott, wenn der Christ mit dem Schmerze ringt, wenn er gegen Drohung und Todesstrafe und Marter den Kampf aufnimmt, wenn er das Rasseln der Todeswerkzeuge und das Entsetzen vor dem Henker lächelnd mit Füßen tritt, wenn er Königen und Fürsten gegenüber seine Freiheit hochhält, Gott allein, dem er zugehört, gehorcht, wenn er selbst triumphierend und siegreich den, welcher gegen ihn das Urteil gesprochen, herausfordert! Denn Sieger ist, wer sich am Ziel seines Strebens findet. 2. Welcher Soldat wird nicht unter den Augen seines Feldherrn kühner der Gefahr entgegentreten. Denn nur wer sich bewährt, erhält einen Preis Und doch kann der Feldherr das nicht geben, was er nicht hat: er kann das Leben nicht verlängern, kann nur militärische Auszeichnungen geben. 3. Der Streiter Gottes aber sieht sich im Schmerz nicht verlassen und wird durch den Tod nicht vernichtet. So kann der Christ zwar unglücklich scheinen, aber es nicht in Wirklichkeit sein. Ihr selbst erhebt ja Unglücksmänner zum Himmel, wie Mucius Scaevola, der bei den Feinden zugrunde gegangen wäre, nachdem er hinsichtlich der Person des Königs sich getäuscht, hätte er nicht seine Rechte geopfert. 4. Aber wie viele von uns haben nicht bloß ihre Rechte, sondern ihren ganzen Körper versengen und verbrennen lassen ohne einen einzigen Schmerzenslaut, obwohl sie es in ihrer Gewalt hatten, Freilassung zu erlangen. 5. Doch was vergleiche ich Männer mit Mucius oder Aquilius oder mit Regulus? Bei uns spotten Knaben und schwache Frauen der Kreuze und Foltern, der wilden Tiere und aller Schrecknisse der Hinrichtung mit himmlischer Ausdauer im Schmerz. 6. Und doch seht ihr nicht ein, ihr Unseligen, daß es niemand gibt, welcher grundlos eine Strafe ertragen will oder Martern ohne göttliche Hilfe aushalten kann?</p><p>7. Oder beirrt euch die Wahrnehmung, daß solche, die von Gott nichts wissen wollen, Reichtum in Fülle haben, in Ehrenämtern glänzen, in Machtstellungen sich befinden? Die Unglücklichen werden nur dazu höher erhoben, um desto tiefer zu fallen. Sie werden wie Opfertiere zur Abschlachtung gemästet und für die Strafe bekränzt. Manche werden sogar deswegen zu Herrschaft und Macht erhoben, daß ihre ungebundene Machtwillkür nach freiem Belieben die Gesinnung ihres verderbten Herzens zu Markt tragen kann. 8. Kann denn ohne Gotteserkenntnis überhaupt ein dauerhaftes Glück bestehen, da es doch einen Tod gibt? Einem Traumgebilde gleich entschlüpft es, ehe man dasselbe erhascht. 9. Du bist ein König? Doch du mußt ebenso fürchten, wie du gefürchtet bist; wie zahlreich auch dein Gefolge ist, in der Stunde der Gefahr stehst du doch allein. Du bist reich? Aber dem Glück ist nicht wohl zu trauen und durch großes Gepäck wird der kurze Lebensweg nicht erleichtert, sondern erschwert. 10. Du rühmst dich deiner Amtsabzeichen und Ehrenkleider? Ein törichter Wahn und eitle Sorge um Ehrenämter, wenn man in Purpur glänzt, während man im Herzen schmutzig ist. Du bist von adeliger Geburt? Du brüstest dich mit deinen Ahnen? Doch wir alle bringen das gleiche Los mit auf die Welt, nur persönliche Tüchtigkeit unterscheidet uns.</p><p>11. Da wir nun nach Charakter und sittlicher Reinheit beurteilen, bleiben wir natürlich euren schlimmen Vergnügungen, Aufzügen und Schauspielen ferne, deren religiösen Ursprung wir kennen und deren gefährliche Reize wir verwerfen. Wer sollte bei den Wettspielen im Zirkus sich nicht entsetzen über den Wahnsinn, mit dem das Volk sich abzankt? bei den Gladiatorenkämpfen über die handwerksmäßige Menschenschlächterei? 12. Auch in den Schauspielen ist keine geringere Raserei und die Schändlichkeit noch zügelloser: bald erzählt und stellt ein Mime Ehebrüche dar, bald erregt ein entnervter Komödiant die Leidenschaft, während er sie bloß vormacht. Er verunglimpft zugleich eure Götter, indem er ihnen Unzucht, Jammertöne und Haßausbrüche andichtet und entlockt euch in erheucheltem Schmerz durch leeres Mienen- und Gebärdenspiel Tränen. So verlangt ihr im wirklichen Leben nach Mordszenen und beweint sie in der Einbildung.</p>
      <h2>38</h2><p>1. Wenn wir ferner die Überreste der Opferspeisen und die Opfergetränke verschmähen, so liegt darin nicht ein Eingeständnis der Furcht, sondern ein Beweis für die wahre Freiheit. Wohl ist jedes natürliche Erzeugnis eine unverletzliche Gabe Gottes und kann durch keine Art von Benutzung schlecht werden; aber wir enthalten uns doch davon, damit niemand glaube, wir erkennten die Dämonen, denen es geopfert war, an oder schämten uns unserer Religion.</p><p>2. Wer möchte aber daran zweifeln, daß wir die Frühlingsblume lieben? Wir pflücken ja die Frühlingsrose und die Lilie, überhaupt jede Art von Blumen mit reizender Farbe und angenehmem Wohlgeruch. Wir benützen sie einzeln und zusammengebunden und schlingen sie in weichen Gewinden um den Hals. Nur daß wir das Haupt nicht bekränzen, müßt ihr verzeihen; wir pflegen eben der Blumen lieblichen Duft mit der Nase einzuziehen, nicht mit Kopf und Haaren zu genießen.</p><p>3. „Auch die Toten bekränzen wir nicht.“ Ich muß mich freilich in diesem Punkt viel mehr über euch wundern, wie ihr für einen Leichnam, wenn er noch Empfindung hat, eine Feuerfackel, oder wenn er keine Empfindung mehr hat, ein Blumengewinde bestimmen könnt. Ist er selig, so trägt er nach Blumen kein Verlangen; ist er unglücklich, kann er an Blumen keine Freude haben. 4. Wir dagegen bestatten unsere Toten mit derselben Gemütsruhe, mit der wir leben, und winden ihnen nicht einen welkenden Kranz, sondern erwarten von Gottes Hand einen immergrünen von ewigen Blumen. Ruhig und bescheiden, der Freigebigkeit unseres Gottes gewiß, beleben wir unsere Hoffnung auf die einstige Glückseligkeit durch den Glauben an seine gegenwärtige Majestät. So erstehen wir einst selig und leben jetzt schon selig im Hinblick auf die Zukunft.</p><p>5. Da mag der „attische Narr“ Sokrates zusehen, wenn er erklärt, daß er nichts wisse, er, der sich doch des Zeugnisses eines allerdings höchst trügerischen Dämons rühmt. Mag auch Arkesilas und Karneades und Pyrrho und die ganze Schar der Akademiker im Zweifel leben, und Simonides in Ewigkeit Aufschub verlangen: wir verachten die hochweisen Mienen der Philosophen, die wir als Verführer und Ehebrecher kennen und als Tyrannen, die freilich für ihre eigenen Laster stets Entschuldigungen haben. 6. Wir, die wir die Weisheit nicht im Philosophenmantel, sondern in unserer Gesinnung zeigen, deren Stärke nicht in Worten, sondern im Wandel ruht, dürfen uns rühmen, das erreicht zu haben, was jene mit aller Anstrengung suchten, aber nicht finden konnten. 7. Warum sind wir undankbar dafür, warum mißgönnen wir es uns selbst, wenn die Wahrheit über Gott in unserer Zeit zur Reife gelangt ist? Genießen wir vielmehr unser Glück und setzen wir unsere Ansicht über das Gute ins richtige Verhältnis der Aberglaube soll gebannt, die Gottlosigkeit abgetan, die wahre Religion erhalten bleiben.</p>
      <h2>39</h2><p>Octavius hatte geendet. Schweigsam und in Erstaunen versunken sahen wir eine Zeitlang starr vor uns hin. Ich für meinen Teil war von Bewunderung ganz hingerissen; hatte er doch Dinge, welche leichter zu fühlen, als zu sagen sind, durch Beweisgründe, Beispiele und Belegstellen aus der Literatur klar gemacht und unsere Widersacher mit ihren eigenen Waffen der Philosophie zurückgeschlagen und den Beweis erbracht, daß die Wahrheit nicht nur leicht faßlich, sondern auch leicht annehmbar ist.</p>
      <h2>40</h2><p>1. Während ich diesen Gedanken still nachging, brach Caecilius in die Worte aus „Ich wünsche meinem Octavius von Herzen Glück, aber auch mir selbst und ich warte nicht erst auf den Schiedsrichterspruch. Wir haben, auch ohnedies gesiegt mag’s unrecht sein, ich nehme für mich den Sieg in Anspruch; denn wie er über mich gesiegt, so triumphiere ich über den Irrtum.</p><p>2. Was die Hauptpunkte der Besprechung angeht, so erkenne ich eine Vorsehung an, gebe mich hinsichtlich der Gottheit gefangen und gestehe auch die Reinheit der Religion zu, die ich jetzt auch die meinige nenne. Doch habe ich noch einiges auf dem Herzen, das zwar nicht der Wahrheit widerstreitet, aber zu einer vollkommenen Belehrung notwendig ist. Aber die Sonne neigt sich bereits zum Untergang; wir wollen deshalb morgen darüber weiter reden. Es wird uns dies leichter gehen, da wir ja in der Hauptsache einig sind.“ 3. „Meine Freude“, fiel ich ein, „ist noch größer, sie umfaßt uns alle drei; denn auch für mich hat Octavius den Sieg davongetragen, da er mir die peinliche Aufgabe eines Schiedsrichters erspart hat. Doch ich kann mit Worten sein Verdienst nicht nach Gebühr preisen. Das Zeugnis eines Menschen, zumal eines einzigen Menschen, hat wenig Kraft. Er besitzt eine ausgezeichnete Gabe Gottes, dessen Geist ihn bei seiner Rede erfüllt und dessen Beistand ihm den Sieg verschafft hat.“</p><p>4. Nun gingen wir froh von dannen, Caecilius darüber, daß er gläubig geworden, Octavius, daß er gesiegt, ich über den Glauben des einen und den Sieg des andern.</p><hr><p><strong>Quelle:</strong> Übersetzung von Dr. Alfons Müller, <em>Frühchristliche Apologeten</em> (Bibliothek der Kirchenväter, 1. Reihe, Bd. 14), München 1913. Text nach <a href="https://bkv.unifr.ch/de/works/cpl-37/versions/dialog-octavius-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>
