    body: |-
      <p><strong>Gedenktag</strong>: 15. (28.) Juni</p>
      <h2>Biografie</h2>
      <h3>Kindheit und Jugend. Die jungen Jahre</h3>
      <p>Aurelius Augustinus wurde im Jahr 354 in der numidischen Stadt Tagaste (im Norden Afrikas) geboren.</p>
      <p>Der Vater des Augustinus, ein Heide, war Mitglied der städtischen Verwaltung und besaß ein kleines Landgut. Die Mutter des Augustinus, Monica, eine fromme Frau, bekannte – anders als ihr Gatte – den Glauben an Christus (später wurde sie von der Kirche heiliggesprochen). Trotz der traditionell zweitrangigen Stellung der Frauen in der damaligen Gesellschaft hatte der Einfluss Monicas auf den Gatten und den Sohn dennoch Erfolg (schließlich ließ sich der Gatte, Patricius, taufen, wenn auch erst kurz vor seinem Tod).</p>
      <p>Die Familie des Augustinus lebte zwar nicht in Armut, besaß aber nur bescheidenen Wohlstand. Indessen hinderte die Beschränktheit der Mittel die Eltern nicht daran, ihrem Sohn eine gute Ausbildung zu sichern. Zunächst erhielt er Unterricht in seiner Heimatstadt, dann setzte er von 363 bis 366 seine Ausbildung in Madaura fort. Der nächste Ort des Studiums, an den er sich als fünfzehnjähriger Jüngling begab, wurde Karthago.</p>
      <p>Hier schloss Augustinus Bekanntschaft mit einer Vielzahl von Altersgenossen. Dabei führten keineswegs alle von ihnen ein keusches Leben. Da er negative Beispiele vor Augen hatte, aber keinen voll ausgebildeten inneren sittlichen Halt besaß, gab sich Augustinus selbst der Ausschweifung hin.</p>
      <p>In Karthago lernte er eine Frau kennen, von der ihm später, im Jahr 372, ein Kind geboren wurde. Der Sohn wurde Adeodatus genannt (in der griechischen Form – Theodoros). Später gedachte Augustinus seiner oft mit väterlicher Liebe und Zärtlichkeit.</p>
      <h3>Die geistliche Suche</h3>
      <p>Ein gewisser Umbruch in der Weltanschauung und im Weltbild des Augustinus vollzog sich, als er neunzehn Jahre alt war. Damals erwarb er mit Mitteln, die ihm seine Mutter geschickt hatte, eine Handschrift von Ciceros Werk „Hortensius“, in dem dieser mit der ihm eigenen Überzeugungskraft die Bedeutung der Weisheitsliebe als des höchsten Gutes darlegte. Dieses Werk übte auf Augustinus eine starke psychologische Wirkung aus, bewog ihn, ernsthaft über den Sinn des Lebens nachzudenken, auch über den des eigenen, und die ihm vertrauten weltlichen Werte mit den ewigen zu vergleichen.</p>
      <p>In einer gewissen Periode fasste Augustinus Sympathie für die Irrlehre der Manichäer, die zwei entgegengesetzte Prinzipien anerkannten: das gute und das böse. Die Lektüre der Heiligen Schrift rief in ihm kein gebührendes ehrfürchtiges Gefühl hervor. Auch war das Maß seines Vertrauens zum Christentum nicht hoch genug (möglicherweise hing dies mit den heidnischen Vorstellungen des Vaters zusammen). Der Sympathie für den Manichäismus kam jedoch jene innere Zwietracht zu Hilfe, die ihm infolge der sittlichen Zügellosigkeit eigen war und die er innerlich verspürte: auf der einen Seite – ein seelisches Streben nach etwas Hellem und Erhabenem, auf der anderen Seite – niedrige fleischliche Regungen. Was ist das anderes als der Kampf zweier Prinzipien, des guten und des bösen? Die Periode der Begeisterung des Augustinus für den Manichäismus dauerte fast 10 Jahre, annähernd vom Jahr 373 bis zum Jahr 382.</p>
      <p>Nachdem Augustinus in Karthago die gewünschte Ausbildung erhalten hatte, kehrte er in seine kleine Heimat, nach Tagaste, zurück und ließ sich dort als Lehrer der Grammatik nieder. Doch einige Zeit später zog er erneut nach Karthago. Hier belastete er sich neben der Lehrtätigkeit ernsthaft mit theoretischen Forschungen auf dem Gebiet der Naturwissenschaften. Indem er die Grundlagen der Astronomie erfasste, studierte er beispielsweise auch die Astrologie. Die Mutter, die sich aufrichtig um ihn sorgte und näher zu ihrem Sohn nach Karthago umgezogen war, hoffte dennoch, dass er sich eines Tages mit Gottes Hilfe bekehren, von den schädlichen, sündhaften Gewohnheiten und den falschen Ideen ablassen werde.</p>
      <p>Mit der Zeit entstanden bei Augustinus immer mehr Fragen, auf die der Manichäismus ihm keine klare bejahende Antwort zu geben vermochte. Einst, als in Karthago der Bischof Faustus eintraf, der bei den Manichäern Ansehen und Autorität genoss, trat Augustinus an ihn heran und überschüttete ihn mit unbequemen Fragen. Nachdem Faustus zugehört hatte, gestand er, nicht imstande zu sein, seiner Neugier zu genügen. Damals erlebte Augustinus eine gewisse Enttäuschung über den Manichäismus, obwohl er die Aufrichtigkeit des manichäischen Bischofs würdigte.</p>
      <p>Im Jahr 383 begab sich Augustinus nach Rom und zog von dort einige Zeit später nach Mailand (Mediolanum) um, wo er die Stelle eines Rhetors erhielt. Sowohl als wissbegieriger Mensch wie auch als Rhetor war es für ihn interessant, die Predigten des berühmten Bischofs Ambrosius (von Mailand) zu hören. Und er hörte sie. Und dieses Hören blieb nicht fruchtlos.</p>
      <h3>Die Bekehrung zu Christus</h3>
      <p>In dem Maße, wie Augustinus als Katechumene die sonntäglichen Gottesdienste besuchte, begeisterte er sich immer mehr für die Schönheit der Orthodoxie. Aus den Predigten des Bischofs Ambrosius nahm er für sich mit, dass die christliche Glaubenslehre ein weit reicheres und erhabeneres Wissen darstellt, als er hatte vermuten können. Und obwohl die frühere Verdorbenheit sich in Gestalt sündhafter Regungen in seiner Seele bemerkbar machte, näherte er sich durch die Vorsehung Gottes Schritt für Schritt Christus.</p>
      <p>Einen großen Eindruck machte auf ihn ein geheimnisvoller Vorfall. Einst, als er über seine eigene Sündhaftigkeit nachdachte und in der Zerknirschung des Geistes verweilte, hörte er plötzlich eine rätselhafte Stimme, gleichsam eine kindliche, die ihn singend anrief: „Nimm und lies“. Nachdem er sich umgesehen und nicht gefunden hatte, wer dies hätte aussprechen können, deutete Augustinus diesen Zuruf als eine Anrede von oben. Er begriff, dass der Gegenstand der Lesung die Heilige Schrift sein musste. Dieser Zuruf seinerseits erinnerte ihn an die Berufung des Antonius des Großen, dessen Vita seinerzeit einen starken Eindruck auf ihn gemacht hatte. Augustinus kehrte sogleich an den Ort zurück, an dem er die Schrift zurückgelassen hatte, und begann zu lesen. Seine Aufmerksamkeit konzentrierte sich auf den Satz, der vor verschiedenen Gefahren (Gastmählern, Trunkenheit, Wollust, Ausschweifung, Neid, Streit, der Begierde überhaupt) warnte und dazu anhielt, Christus anzuziehen (Röm 13,13-14).</p>
      <p>Im Jahr 388 oder 389 empfing Augustinus endlich die Taufe. Dieses Ereignis konnte seine Mutter, eine eifrige Christin, nur erfreuen. Bald darauf entschlief sie im Herrn.</p>
      <h3>Der Priesterdienst</h3>
      <p>Nach dem Tod der Mutter begab sich Augustinus, nachdem er geraume Zeit in Italien verweilt hatte, in seine Heimatstadt Tagaste. Vom Vater war ihm ein Erbe zugefallen, doch er, der für sich bereits fest die Richtung des künftigen Weges bestimmt hatte, verkaufte alles und spendete den erzielten Erlös für die Bedürfnisse der Kirche.</p>
      <p>Bald darauf siedelte Augustinus nach Hippo über. Zu jener Zeit hatte er bereits einige Bekanntheit als Verteidiger des Christentums und als Theologe erlangt. Im Jahr 391 weihte ihn der Bischof Valerius auf Drängen der örtlichen Gemeinde zum Priester. Seitdem wurde Pater Augustinus dessen treuer Helfer im Werk der Verbreitung des Glaubens, predigte viel, beschäftigte sich mit der Auslegung der Heiligen Schrift und mit dem Kampf gegen häretische Irrtümer.</p>
      <p>Im Jahr 395 wurde Pater Augustinus in die Bischofswürde erhoben, und nach dem Hinscheiden des Bischofs Valerius stand er der Diözese Hippo vor und leitete sie bis zu seinem Tod.</p>
      <p>Einige Jahre vor seinem Ende erwählte der selige Augustinus Heraclius zu seinem Nachfolger. Am 28. August 430 hörte das Herz des vom Fieber erschöpften Erzhirten auf zu schlagen, und er trat vor das Angesicht des höchsten Richters.</p>
      <h2>Das schöpferische Erbe</h2>
      <p>In den Jahren der hirtenamtlichen Tätigkeit gingen aus der Feder des seligen Augustinus Dutzende von Schriften verschiedenartigen Charakters hervor. Als kirchlicher Schriftsteller ist er sowohl als Prediger wie auch als Dogmatiker und als Polemiker wohlbekannt.</p>
      <p>Leider kann nicht alles, was mit dem Schaffen dieses Autors zusammenhängt, ohne Vorbehalt angenommen werden. Eine der am meisten umstrittenen Richtungen seines Autorendenkens ist die von ihm in der Polemik mit den Pelagianern dargelegte Lehre von der Rolle der göttlichen Gnade im Werk der Erlösung. Gegen die Lehre der Häretiker, der Mensch könne sich vom Schmutz der Sünde praktisch mit eigenen Kräften befreien, bemerkte der selige Vater zu Recht, dass dies ohne die Mitwirkung der Gnade grundsätzlich nicht zu verwirklichen sei; doch von der Hitze der Polemik mitgerissen, verringerte er die Rolle des Menschen selbst so sehr, dass dies in der Folge Boden und Anlass für die Herausbildung einer neuen Lehre gab, die das dem Pelagianismus entgegengesetzte Extrem darstellt: die Lehre von der Vorherbestimmung Gottes (nach dieser Lehre wird allein der gerettet, den Gott zur Erlösung vorherbestimmt hat).</p>
      <p>Eine andere strittige Stelle in den Werken des Augustinus von Hippo hängt mit seiner Anschauung vom Heiligen Geist als dem Geist der Liebe zusammen. In der weiteren Auslegung legte dieser Standpunkt die Grundlage für die Lehre der Westkirche über das Hervorgehen des Heiligen Geistes nicht nur vom Vater, sondern auch vom Sohn (der Kern dieser Lehre ist folgender: Der Vater liebt den Sohn und bringt also die Liebe hervor, aber auch der Sohn liebt den Vater und bringt folglich ebenfalls die Liebe hervor; da die Liebe der Heilige Geist ist, ergibt sich daraus, dass der Heilige Geist sowohl vom Vater als auch vom Sohn hervorgeht).</p>
      <p>Indessen wird der selige Augustinus zu Recht als einer der hervorragendsten kirchlichen Schriftsteller von weltweitem Rang verehrt.</p>
      <p>Von den dogmatischen Traktaten sind uns solche Werke von ihm überliefert wie Über die Dreifaltigkeit, Vom Gottesstaat, Über das Glaubensbekenntnis, Enchiridion, Über die 83 verschiedenen Fragen in einem Buch.</p>
      <p>Als polemische Schriften sind bekannt: Über den freien Willen, Über die Natur des Guten gegen die Manichäer, Über die Gnade und den freien Willen, Über Tadel und Gnade, Über die Vorherbestimmung der Heiligen.</p>
      <p>Zu den hirtenamtlichen Unterweisungen rechnet man: Über die Unterweisung der Katechumenen, Predigten und Unterweisungen, Predigt am Tag der Apostel Petrus und Paulus, Predigt über die Erscheinung Jesu Christi vor den beiden Emmausjüngern u. a.</p>
      <p>Eine besondere Gruppe von Arbeiten ist durch die exegetische Ausrichtung bestimmt. Es sind dies: Über die Genesis im Wortsinn, Über die Übereinstimmung der Evangelisten, Betrachtungen über das Evangelium nach Johannes, Auslegung des 125. Psalms, Die christliche Bildung oder Grundlagen der Hermeneutik und der kirchlichen Rhetorik usw.</p>
      <h2>Verehrung</h2>
      <p>Der selige Augustinus wird in den Akten des Fünften Ökumenischen Konzils unter den heiligen Kirchenvätern und Lehrern der Kirche genannt, deren orthodoxe Lehre von der Kirche als Richtschnur angenommen wird.</p>
      <p>In die russischen Monatskalender (Menologien) wurde das Gedächtnis des Seligen (28. Juni) im 19. Jahrhundert aus dem griechischen „Synaxarion“ des Nikodemos vom Heiligen Berg eingetragen.</p>
      <h2>Glaube</h2>
      <h3>Außerhalb der Kirche (in der Augustinus steht) gibt es kein Heil</h3>
      <blockquote><p><strong><em><mark>Außerhalb der katholischen Kirche ist alles möglich, nur nicht das Heil</mark></em></strong><em>. Man kann Würden besitzen, man kann die Sakramente haben, man kann „Halleluja“ singen, man kann „Amen“ antworten, man kann das Evangelium in Händen halten, man kann den Glauben an den Namen des Vaters und des Sohnes und des Heiligen Geistes haben und ihn verkündigen, aber </em><strong><em><mark>nirgends außer in der katholischen Kirche lässt sich das Heil finden</mark></em></strong><em>.</em></p></blockquote>
      <p>(Wort an das Volk der Kirche von Cäsarea, 6)</p>
      <h3>Gebet, Almosen für die Verstorbenen, Opfer für die Verstorbenen in der Liturgie</h3>
      <blockquote><p><em>Und </em><strong><em><mark>man darf nicht leugnen, dass die Seelen der Entschlafenen durch die Liebe der noch lebenden Angehörigen Erleichterung erfahren, wenn für sie das Opfer des Fürsprechers dargebracht oder in der Kirche Almosen gegeben werden</mark></em></strong><em>. &lt;…&gt; Folglich, </em><strong><em>wenn <mark>die Opfer des Altars oder irgendwelche Almosen für alle </mark><u><mark>getauften</mark></u><mark> Verstorbenen dargebracht werden</mark>, so dienen sie für die ganz Guten als Ausdruck des Dankes, für die nicht ganz Schlechten als Sühne, für die ganz Schlechten, obwohl sie den Verstorbenen nicht im Geringsten helfen, – als ein gewisser Trost für die Lebenden. Denen aber, <mark>denen sie Nutzen bringen, verhelfen sie entweder zu völliger Erbarmung oder zu einem milderen Urteil</mark></em></strong><em>.</em></p></blockquote>
      <p>(Enchiridion an Laurentius über Glaube, Hoffnung und Liebe)</p>
      <h3>Das Gebet zu den Heiligen</h3>
      <blockquote><p><strong><em>Selig seid ihr alle, sorgenfrei und freudig, ihr Heiligen Gottes, die ihr bereits dieses tote Meer überquert habt und für würdig erachtet worden seid, in den Hafen der ewigen Ruhe, der Sicherheit und der Stille einzugehen! <mark>Ich bitte euch</mark> bei eurer Liebe, <mark>seid besorgt um uns</mark>.</em></strong><em> &lt;…&gt; </em><strong><em>Ihr, schöne Pforten, die ihr zur großen Höhe emporgestiegen seid! <mark>Helft uns</mark></em></strong><em>, die wir gar tief zur Erde niedergeworfen sind; </em><strong><em>streckt eure Hände aus und richtet die Liegenden auf, damit wir, von der Schwachheit geheilt, im Kampf stark werden. <mark>Tretet für uns ein und betet unablässig für uns arme und lässige Sünder</mark>. </em></strong><em>&lt;…&gt; </em><strong><em><mark>Betet zum Herrn, betet, ihr ganze Menge der Heiligen und unzähligen Scharen der Seligen</mark>, damit wir mit Hilfe eurer Gebete mit unversehrtem Schiff und ganzer Ladung gewürdigt werden, in den Hafen des ewigen Heils, der Ruhe und des unaufhörlichen Friedens einzugehen.</em></strong></p></blockquote>
      <p>(Gebete und geistliche Betrachtungen, Kapitel 24)</p>
      <h3>Die Kindertaufe</h3>
      <blockquote><p><em>„Und wenn jemand in dieser Frage (der Frage der Kindertaufe – Anm.) göttliche Autorität suchen sollte, ungeachtet dessen, dass </em><strong><em><mark>dies die ganze Kirche festhält, obwohl es nicht von Konzilien festgesetzt, sondern als unveränderlicher Brauch bewahrt wird und mit Recht als von apostolischer Vollmacht überliefert gilt</mark></em></strong><em>… so können wir dennoch eine richtige Meinung über die Bedeutung des Sakraments der Taufe für die Kinder gewinnen, indem wir eine Parallele zur alttestamentlichen Beschneidung ziehen“</em></p></blockquote>
      <p>(„Über die Taufe, gegen die Donatisten“, Buch 4, Kapitel 24)</p>
      <blockquote><p><em>Doch </em><strong><em>der Brauch der Mutter Kirche, <mark>die Kinder zu taufen</mark></em></strong><em> darf deshalb keineswegs verworfen noch als überflüssig angesehen werden, sondern man muss ihn </em><strong><em><mark>nicht anders betrachten</mark> denn als <mark>apostolische Überlieferung</mark></em></strong><em>. Denn auch dieses kleine Alter hat die Bedeutung eines Zeugnisses, da es als erstes gewürdigt worden ist, für Christus sein Blut zu vergießen.</em></p></blockquote>
      <p>(Über die Genesis, 10)</p>
      <h3>Die Paten (Taufpaten)</h3>
      <blockquote><p><strong><em><mark>Ihnen (den Kindern – Anm.) ist zur Reinigung und Vergebung der Erbsünde der Glaube derer nützlich, durch die sie dargebracht werden</mark></em></strong><em>, so dass sie von allen Folgen der Laster der anderen, von denen sie geboren werden, </em><strong><em><mark>ebenso genau durch das offene Bekenntnis der anderen gereinigt werden</mark></em></strong><em>. Wahrhaftig heißt es deshalb im Psalm: „Siehe, in Gesetzlosigkeit bin ich empfangen, und in Sünde hat mich meine Mutter geboren“ (Ps 50,7); gleichermaßen ist auch an anderer Stelle geschrieben, dass niemand rein ist vor dem Angesicht Gottes, auch wenn sein Leben auf Erden nur einen Tag währte (Hiob 14,4).</em></p></blockquote>
      <p>(Predigten und Unterweisungen, Rede 11, über den Nutzen der Buße)</p>
      <h3>Die Verehrung der Reliquien der Heiligen</h3>
      <blockquote><p><em>Das Wunder, das sich in Mediolanum während unseres dortigen Aufenthalts ereignete, als ein Blinder wieder sehend wurde, konnte vielen bekannt werden, weil die Stadt groß ist – Mediolanum –, und sich dort damals auch der Kaiser aufhielt, und </em><strong><em><mark>diese Tatsache sich vor den Augen einer ungeheuren Menge Volkes vollzog, die zu den Reliquien der Märtyrer Protasius und Gervasius zusammenströmte, welche, (bis dahin) verborgen und völlig unbekannt, dem Bischof Ambrosius im Schlaf geoffenbart wurden</mark></em></strong><em>; dort also wurde der Blinde wieder sehend, geheilt von langjähriger Blindheit.</em></p></blockquote>
      <p>(Vom Gottesstaat, Buch 22, Kapitel VIII. Über die Wunder, die gewirkt wurden, damit die Welt an Christus glaube, und die nicht aufhören, (heute) gewirkt zu werden, da die Welt bereits glaubt)</p>
      <h3>Die Fürsprache der Heiligen</h3>
      <blockquote><p><strong><em><mark>die Wunder, die durch die Märtyrer geschehen, geschehen allein durch ihr Gebet und ihre Fürsprache, nicht aber durch ihr (unmittelbares) Wirken</mark></em></strong><em>; oder aber die einen durch dieses, die anderen durch jenes, auf eine für die Sterblichen völlig unbegreifliche Weise; jedenfalls dienen diese Wunder der Bestätigung jenes Glaubens, in dem die ewige Auferstehung des Fleisches verkündigt wird.</em></p></blockquote>
      <p>(Vom Gottesstaat, Buch 22, Kapitel IX. Darüber, dass alle Wunder, die von den Märtyrern im Namen Christi gewirkt werden, Zeugnis ablegen für den Glauben, den die Märtyrer an Christus hatten)</p>
      <h3>Das Brot in der Eucharistie wird zum Leib Christi</h3>
      <blockquote><p>„denn <strong><mark>nicht jedes Brot, sondern das, welches den Segen Christi empfängt, wird zum Leib Christi</mark></strong>“</p></blockquote>
      <p>(<a href="https://www.pravenc.ru/text/348067.html">Sermo. 234. 2</a>)</p>
      <h2></h2>
