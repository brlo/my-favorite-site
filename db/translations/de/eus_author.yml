    body: |-
      <p><strong><mark>Eusebius vertrat gemäßigte arianische Ansichten und war zudem Origenist. Man muss auch berücksichtigen, dass er Hofhistoriker Kaiser Konstantins war und wie ein Hofhistoriker schrieb. Beim Lesen des Eusebius muss man also all diese Eigentümlichkeiten des Historikers in Rechnung stellen und unter ihrer Berücksichtigung den Grad des Vertrauens bestimmen, mit dem man seinen Schriften begegnen sollte.</mark></strong></p><p>Der Bereich mit den Werken des Eusebius von Cäsarea <strong>in griechischer Sprache</strong>: <a href="https://bibleox.com/de/grc/w/%CE%95%CF%85%CF%83%CE%AD%CE%B2%CE%B9%CE%BF%CF%82_%CE%9A%CE%B1%CE%B9%CF%83%CE%B1%CF%81%CE%B5%CE%AF%CE%B1%CF%82_%CE%A0%CE%AC%CE%BC%CF%86%CE%B9%CE%BB%CE%BF%CF%82_III-IV_%CE%B1%CE%B9/">hier</a>. Der Wechsel in andere Sprachen ist ebenfalls oben über der Werkliste möglich.</p><h2>Biographie</h2><p>Eusebius wurde in Palästina geboren und in den Schulen von Jerusalem und Antiochien ausgebildet. Er studierte die Werke Platons und Philons von Alexandrien; besonders prägend war für ihn die Lehre des Origenes. Den Beinamen „Pamphilus“, genauer „des Pamphilus“ (Εὐσέβιος ὁ Παμφίλου), erhielt er wegen seiner Freundschaft mit einem gewissen Presbyter Pamphilus; später wurde dieser Beiname als sein zweiter eigener Name verstanden.</p><p>Während der Verfolgung unter Diokletian war er einer der Leiter der Katechetenschule von Cäsarea; es gelang ihm, deren Bibliothek zu retten und sogar durch neue Handschriften zu bereichern. Als die Streitigkeiten über die Natur Christi begannen, ergriff er eher aus persönlichen als aus theologischen Gründen Partei für Arius.</p><p>Auf dem Ersten Ökumenischen Konzil trat er auf und schlug als versöhnliche Formel die Verwendung des Taufbekenntnisses vor. Dieser Vorschlag wurde angenommen, das Bekenntnis selbst aber um den Begriff „wesensgleich“ ergänzt. Eusebius stimmte dem „um des Kirchenfriedens willen“ zu, neigte aber bis zu seinem Lebensende dem Semiarianismus zu und verwandte sich beim Kaiser Konstantin für seine Gesinnungsgenossen.</p><p>Trotz der Fragwürdigkeit seiner dogmatischen Ansichten gilt Eusebius von Cäsarea zu Recht als Vater der Kirchengeschichte. Sein bekanntestes Werk ist der Geschichte des Christentums bis zum Jahr 324 gewidmet und schöpft aus kirchlichen wie staatlichen Archiven. Daran schließt sich der berühmte Panegyrikus „Leben Konstantins“ sowie kleinere Arbeiten über die Geschichte der Märtyrer an.</p><p>Ihm gehören auch theologische Werke: „Vorbereitung auf das Evangelium“, „Beweis für das Evangelium“, „Gegen Hierokles“, „Auszug aus den Propheten über Christus“, „Theophanie“, „Zwei Bücher gegen Marcellus“, „Drei Bücher über die kirchliche Theologie“ und andere.</p>
