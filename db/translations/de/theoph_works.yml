    body: |-
      <p><em>Drei Bücher an Autolykus, übersetzt von J. Leitl (Bibliothek der Kirchenväter, 1. Reihe, Bd. 14, München 1913).</em></p><h2>1</h2><p>Armseligen Menschen mit verdorbenem Sinn verschafft eine gelenke Zunge und eine wohlklingende Phrase Wohlgefallen, Lob und eitlen Ruhm. Wer aber die Wahrheit liebt, kehrt sich nicht an Geflunker, sondern untersucht, welches und wie beschaffen die mit dem Worte verbundene Tat ist. Du bist nun, lieber Freund, heftig auf mich losgefahren mit leeren Prahlereien über deine Götter aus Holz und Stein, von getriebener und Gußarbeit, geschnitzt und gemalt, die nicht sehen und hören; denn sie sind nur Bilder und Werke von Menschenhand. Dann nennst du mich auch einen Christen, indem ich damit, wie du meinst, einen schlechten Namen trage. Ich bekenne nun denn, daß ich ein Christ bin, und trage diesen Gott wohlgefälligen Namen mit der Hoffnung, ein für Gott brauchbarer Mensch zu sein. Denn es ist nicht so, wie du meinst, daß der Name Gottes ein schlechter Name sei, vielmehr denkst du darüber nur deshalb also, weil du vielleicht für Gott noch nicht zu brauchen bist.</p><p>Wenn du aber sagst: „Zeige mir deinen Gott!“ so möchte ich dir antworten: „Zeige mir den Menschen in dir, und ich will dir meinen Gott zeigen!“ Zeige mir also, daß die Augen deiner Seele sehen und die Ohren deines Herzens hören! Denn gleichwie die mit ihren leiblichen Augen Sehenden die Vorgänge im Erdenleben wahrnehmen und zugleich die verschiedenen Erscheinungen unterscheiden, ob Licht oder Finsternis, ob etwas weiß oder schwarz, mißgestaltet oder wohlgestaltet, harmonisch und ebenmäßig, oder unharmonisch und ohne Ebenmaß, oder über das Maß hinaus oder einseitig ist; (wie man auch in gleicher Weise unterscheiden kann) die Dinge, die unter das Gehör fallen, ob nämlich ein Ton hoch oder tief oder angenehm sei: so verhält es sich auch mit den Ohren des Herzens und den Augen des Geistes, wenn es sich um die Möglichkeit handelt, Gott zu schauen. Gott wird nämlich von denen gesehen, die imstande sind, ihn zu sehen, wenn sie nämlich die Augen ihres Geistes offen halten. Denn es haben zwar alle ihre Augen, aber bei einigen sind sie getrübt, und sie sehen das Licht der Sonne nicht. Und wenn die Blinden nicht sehen, so folgt daraus gewiß nicht, daß auch die Sonne nicht scheint, sondern die Blinden müssen sich und ihren Augen die Schuld zuschreiben. So hast auch du, o Mensch, infolge deiner Sünden und schlechten Handlungen getrübte Augen. Wie ein blanker Metallspiegel, so rein sei die Seele des Menschen. Wenn nun Rost auf dem Metallspiegel liegt, so kann man das Antlitz des Menschen im Spiegel nicht sehen; so kann auch, wenn die Sünde im Menschen ist, ein solcher Mensch Gott nicht sehen. Zeige also dich selbst, ob du kein Ehebrecher, kein Dirnenjäger, kein Dieb, kein Räuber, kein Wegelagerer, kein Knabenschänder, kein Mann der Gewalttat, ob du nicht schmähsüchtig, zornmütig, neidisch, prahlerisch, argwöhnisch, ein Raufbold, ein Geizhals, ungehorsam gegen die Eltern, ein Verkäufer deiner Kinder bist. Solchen, die derlei Dinge tun, erscheint Gott nicht, wenn sie sich nicht zuvor von allem Schmutze reinigen. Alles (dieses) also verdunkelt dich auch, wie das Eindringen eines Splitters ins Auge, so daß dieses das Licht der Sonne nicht schauen kann. So umgibt auch dich, o Mensch, mit Finsternis die Abkehr von Gott, so daß du Gott nicht sehen kannst.</p><p>Du wirst nun zu mir sagen: „Beschreibe mir du, der du siehst, die Gestalt Gottes!“ Höre, o Mensch: die Gestalt Gottes ist unaussprechbar, unerklärbar und für leibliche Augen unsichtbar. Seine Herrlichkeit ist unfaßbar, seine Größe unbegreifbar, seine Hoheit dem Denken unerreichbar; seine Stärke unermeßlich, seine Weisheit unvergleichlich, seine Güte unnachahmlich, sein herrliches Wirken unbeschreiblich. Denn nenne ich ihn Licht, so nenne ich ein Geschöpf von ihm; nenne ich ihn Wort, so nenne ich das Prinzip von ihm; nenne ich ihn Vernunft, so nenne ich sein Denken; nenne ich ihn Geist, so nenne ich seinen Odem; nenne ich ihn Weisheit, so nenne ich ein Erzeugnis von ihm; nenne ich ihn Kraft, so nenne ich seine Stärke; nenne ich ihn Macht, so nenne ich seine Wirksamkeit; nenne ich ihn Vorsehung, so nenne ich seine Güte; nenne ich ihn Herrschaft, so nenne ich seine Herrlichkeit; nenne ich ihn Herrn, so nenne ich ihn Schöpfer; nenne ich ihn Richter, so nenne ich ihn gerecht; nenne ich ihn Vater, so nenne ich ihn den Liebevollen; nenne ich ihn Feuer, so nenne ich seinen Zorn. Wird also Gott zornig? wirst du nun zu mir sagen. Allerdings! Er zürnet denen, die Übles tun, gütig aber, gnädig und erbarmungsvoll ist er gegen die, so ihn lieben und fürchten; denn er ist der Lehrmeister der Frommen und der Vater der Gerechten, aber der Richter und Rächer der Gottlosen.</p><p>Er ist ohne Anfang, weil er nicht geworden ist, unveränderlich, weil er unsterblich ist. Gott [theos]<em>(θεός)</em> heißt er, weil er alles auf seine Unbeweglichkeit festgegründet hat [dia to tetheikenai]<em>(διὰ τὸ τεθεικέναι)</em>, oder vom Worte [theein] <em>θέειν.</em>. Dies bedeutet aber soviel wie laufen, bewegen, tätig sein; auch nähren, sorgen, lenken, beleben — alle Dinge nämlich. Herr aber ist er, weil er alles beherrscht; Vater, weil er vor allen Dingen ist; Weltbildner und Schöpfer, weil er es ist, der alles erschaffen und gemacht hat; der Allerhöchste, weil er über alles ist; Allherrscher, weil er alles regiert und umfaßt. Denn die Höhen des Himmels und die Tiefen des Abgrundes und die Grenzen des Erdkreises sind in seiner Hand, und es ist kein Ort seiner Ruhe. Denn die Himmel sind sein Werk und die Erde seine Schöpfung, das Meer ist seine Gründung und der Mensch ein Gebilde und Ebenbild von ihm. Sonne, Mond und Sterne sind von ihm geschaffene Weltkörper, zu Zeichen, Zeiten, Tagen und Jahren zur Leitung und zum Dienste der Menschen bestimmt; und alles hat Gott aus dem Nichts ins Dasein gerufen, auf daß man aus seinen Werken erkennen und ermessen könne seine Größe.</p><p>Denn gleichwie die Seele im Menschen nicht gesehen, da sie für den Menschen unsichtbar ist, aber doch aus der Bewegung des Leibes wahrgenommen wird, so verhält es sich auch mit der Unmöglichkeit, Gott mit menschlichen Augen zu schauen; er wird aber aus seiner Vorsehung und seinen Werken erkannt. Denn gleichwie man, wenn man ein Schiff auf dem Meere sieht, das wohlausgerüstet dahin eilt und in den Hafen einläuft, offenbar auf den Gedanken kommen wird, daß auf ihm sich ein Steuermann befindet, der es lenkt: so muß man auch Gott als Lenker des Alls erkennen, wenn er auch von leiblichen Augen, weil für sie unfaßbar, nicht gesehen wird. Denn wenn der Mensch nicht einmal in die Sonne, einen so kleinen Himmelskörper, schauen kann wegen der außerordentlichen Hitze und Kraft derselben, um wieviel weniger kann das Auge eines sterblichen Menschen die Herrlichkeit Gottes, die unaussprechlich ist, ertragen! Wie ferner ein Granatapfel mit seiner ihn umschließenden Schale in seinem Innern viele Fächer und Kapseln, durch Häutchen geschieden, hat und viele Kerne eingeschlossen enthält, so wird die ganze Schöpfung vom Odem Gottes umgeben, und dieser umgebende Odem Gottes mitsamt der Schöpfung wird von der Hand Gottes umschlossen. Wie nun der Kern im Innern des Granatapfels, eben weil er innen ist, die Dinge außerhalb der Schale nicht sehen kann, so kann auch der Mensch, weil er mitsamt der Schöpfung von der Hand Gottes um- und eingeschlossen ist, Gott nicht sehen. Und ferner, man glaubt doch an das Dasein eines irdischen Königs, der, obwohl nicht von allen gesehen, doch durch seine Gesetze und Verordnungen, durch seine Behörden, seine Heeresmacht und seine Bildnisse erkannt wird: daß aber Gott aus seinen Werken und Wirken erkannt werde, willst du nicht gelten lassen?</p><p>Betrachte, o Mensch, seine Werke: den rechtzeitigen Wechsel der Jahreszeiten, die Veränderungen der Witterung, den geordneten Lauf der Himmelskörper, den regelmäßigen Gang der Tage und Nächte, der Monate und Jahre, die bunte Schönheit der Samen, Pflanzen und Früchte, die verschiedenen Arten der Vierfüßler, der Vögel, Schwimm- und Kriechtiere, der Fluß und Wassertiere; oder den in die Tiere selbst gelegten Trieb für die Fortpflanzung und Ernährung ihrer Jungen, nicht zum eigenen Nutzen, sondern zum Gebrauche des Menschen; dann die Fürsorge, die Gott trägt, indem er Nahrung bereitet allem Fleische, oder die Unterordnung, in der nach seiner Anordnung alle Wesen unter dem Menschen stehen; betrachte, wie süße Quellen sprudeln und stets strömende Flüsse dahin eilen, Tau, Regen und Güsse sich rechtzeitig einstellen, der Himmelskörper verschiedenen Bahnen folgt, den aufgehenden Morgenstern, der die Ankunft des vollkommenen Lichtgestirnes verkündet, die Verbindung der Plejaden und des Orion, den Arcturus und die übrigen Gestirne, wie sie ringsum am Himmel ihren Weg nehmen, und denen allen die vielfältige Weisheit Gottes ihre Namen gegeben. Dieser Gott allein ist es, der das Licht aus der Finsternis geschaffen, der die verborgenen Räume des Südens, die Schatzkammern des Abgrundes, die Grenzen der Meere und die Vorratskammern des Schnees und Hagels gemacht hat, der die Wasser sammelt in den Kammern des Abgrundes, und die Finsternis in ihrem Behältnisse, der das süße, angenehme, erfreuliche Licht hervorbrechen läßt aus seiner Schatzkammer und die Wolken heraufführt vom äußersten Rande der Erde, der Blitze zu vielem Regen gestaltet, der den Donner aussendet zum Schrecken und den Schall des Donners durch den Blitz vorausverkündet, damit die Seele nicht, vom plötzlichen Schrecken erfaßt, vergehe, der aber auch wieder die Kraft des vom Himmel niederfahrenden Blitzes dämpft, daß er die Erde nicht in Flammen setze. Denn würde der Blitz seine volle Macht entfalten, er würde die Erde verbrennen; hätte der Donner seine volle Gewalt, er würde die Dinge auf ihr über den Haufen werfen.</p><p>Das ist mein Gott, der Herr des Alls, der allein den Himmel ausgespannt und die Breite der Erde festgestellt, der den Grund des Meeres aufwühlt und seine Wogen brausen macht, der über die Gewalt des Meeres gebietet und seine brausenden Wogen besänftigt, der die Grundfesten der Erde über den Wassern gelegt hat und ihr den nährenden Odem gegeben, dessen Odem allem das Leben gibt, der diesen Odem nur zurückzuhalten braucht, und alles wird vergeben. Dessen Odem redest du, dessen Odem atmest du, und diesen Gott kennst du nicht, o Mensch! Das ist die Folge der Blindheit deiner Seele und der Verhärtung deines Herzens. Doch du kannst geheilt werden, wenn du willst. Überlasse dich dem Arzte, und er wird dir an den Augen des Geistes und des Herzens den Star stechen. Wer ist der Arzt? Es ist Gott, der da heilt und lebendig macht durch sein Wort und seine Weisheit. Durch sein Wort und seine Weisheit hat Gott alles erschaffen, denn „durch sein Wort sind die Himmel gefestigt worden, und durch seinen Geist all ihre Kraft“. Ganz gewaltig ist seine Weisheit. „Durch seine Weisheit hat Gott die Erde grundgelegt, er hat die Himmel zugerichtet durch seine Klugheit; mit Kenntnis wurde der tiefe Abgrund gebildet und strömten die Wolken ihr Naß“. Wenn du das bedenkst, o Mensch, dabei rein, gerecht und heilig lebst, dann kannst du Gott sehen. Vor allem aber halte zuvörderst Einkehr in deinem Herzen der Glaube und die Furcht Gottes, dann wirst du diese Dinge verstehen. Wenn du die Sterblichkeit wirst abgelegt und die Unsterblichkeit angezogen haben, dann wirst du Gott in entsprechender Weise schauen. Denn Gott wird deinen Leib auferwecken, unsterblich mit deiner Seele, und dann wirst du, selbst unsterblich geworden, den Unsterblichen schauen, wenn du jetzt an ihn glaubst; und dann wirst du auch erkennen, daß du mit Unrecht ihn gelästert hast.</p><p>Aber du glaubst nicht an die Auferweckung der Toten. Wann sie eintreten wird, dann wirst du daran glauben, du magst wollen oder nicht. Und dein Glaube wird dir (dann) als Unglaube gerechnet werden, wenn du nicht jetzt glaubst. Warum aber glaubst du nicht? Weißt du nicht, daß bei allen Werken der Glaube vorangeht? Denn welcher Landmann kann ernten, wenn er nicht den Samen der Erde anvertraut; oder wer kann über die See fahren, wenn er sich nicht zuvor dem Schiffe und dem Steuermann anvertraut? Welcher Kranke kann geheilt werden, wenn er sich nicht dem Arzte zuvor anvertraut? Welche Kunst oder Wissenschaft kann man lernen, ohne daß man sich dem Lehrer hingibt und ihm glaubt? Während also der Landmann der Erde, der Seefahrer dem Schiffe, der Kranke dem Arzte vertraut, willst du dich Gott nicht anvertrauen, obwohl du so viele Unterpfande (seiner Glaubwürdigkeit) von ihm hast? Denn erstens hat dich Gott aus dem Nichts ins Dasein gerufen — denn da dein Vater einmal nicht war, und auch deine Mutter nicht, so warst noch viel weniger du zuvor da —, er hat dich gebildet aus einem kleinen flüssigen Stoff, aus einem ganz kleinen Tropfen, der selbst einmal nicht da war und hat dich so in dies Leben geführt. Zweitens glaubst du, daß die von Menschen verfertigten Bilder Götter seien und Wunderdinge wirken; daß aber Gott, der dich erschaffen hat, dich auch wieder ins Leben zurückrufen kann, glaubst du nicht?</p><p>Und die Namen der Götter, die du verehrst, wie du sagst, sind Namen verstorbener Menschen. Und zwar welcher Menschen! Findet man nicht einen Kinderfresser Kronos, der seine eigenen Kinder verzehrt? Und wenn du mir dann den Zeus, seinen Sohn, erwähnst, so sieh dir auch seine Handlungen und sein Betragen an! Zuerst seine Erziehung auf dem Ida durch eine Ziege, die er nach der Mythologie dann schlachtete, ihr das Fell abzog und sich ein Gewand daraus machte. Seine übrigen Taten, seine blutschänderische Ehe mit der Schwester, seine Ehebrüche und Knabenschänderei lasse ich besser von Homer und den übrigen Dichtern erzählen. Warum soll ich auch von seinen Kindern weiter erzählen? von Herakles, der sich selbst verbrannte, vom betrunkenen und rasenden Dionysus, von Apollo, der sich vor Achilles fürchtet und davon läuft und von Liebe zur Daphne entbrennt und vom traurigen Geschicke des Hyacinthus nichts weiß? oder von der Aphrodite, die verwundet wird, oder vom Ares, dem Menschenwürger, oder auch, wie das Blut dieser sogenannten Götter fließt? Und diese Dinge ließen sich doch noch sagen; aber man findet (bei euch) sogar einen Glied für Glied zerstückelten Gott, Osiris genannt, und alljährlich werden sogar die Feste seines Todes, seiner Wiederauffindung und des Zusammensuchens seiner einzelnen Glieder gefeiert, ohne zu wissen, ob er umgekommen ist, ohne zu zeigen, daß er gefunden worden. Was soll ich reden vom entmannten Attis, oder von Adonis, der im Walde herumirrt und jagt und vom Eber verwundet wird; oder von Asklepius, der vom Blitze getroffen wird; oder von Serapis, der von Sinope nach Alexandrien flüchtet, oder von der skythischen Artemis, die ebenfalls aus dem Lande entflieht, eine Männermörderin und Jägerin ist und sich in Endymion verliebt? Nicht wir sagen ja diese Dinge, sondern eure Schriftsteller und Dichter sind es, die sie laut der Welt verkünden.</p><p>Was brauche ich ferner noch aufzuzählen die Menge der Tiere, welche die Ägyptier verehren: Kriechtiere, Haus- und wilde Tiere, Vögel und Wassertiere? Dazu noch die Becken und unanständigen Töne? Nennst du mir allenfalls die Griechen und die übrigen Völker, so verehren diese, wie wir zuvor gesagt haben, Steine, Holz und die übrigen Stoffe, Bilder verstorbener Menschen. Wir sehen ja, wie Phidias für die Eleer in Pisa den Olympischen Zeus, für die Athener auf der Akropolis die Athene verfertigte. Auch ich will nun an dich die Frage stellen, o Mensch: Wie viele Persönlichkeiten des Zeus gibt es denn? Denn zu allererst heißt er der Olympische Zeus, dann der latiarische (oder latinische), der kassische, der keraunische; Zeus Propator, Zeus Pannychios, Poliuchos und der kapitolinische Zeus. Und Zeus, der Sohn des Kronos, welcher König der Kreter war, hat auf Kreta sein Grab, die übrigen wurden, scheint es, nicht einmal eines Grabes gewürdigt. Wenn du ferner die Mutter der sogenannten Götter erwähnen willst, so möchte ich meinen Mund nicht dazu hergeben, ihre Taten zu erzählen — denn es ist Sünde für uns, solche Dinge auch nur zu nennen oder die Handlungen ihrer Diener und die Gefälle und Abgaben alle, welche die Göttermutter und ihre Söhne dem Kaiser eintragen. Es sind ja keine Götter, sondern nur Götzenbilder, wie schon gesagt, Werke von Menschenhänden und unreine Geister. Mögen ihnen ähnlich werden, die sie machen, und die, so auf sie vertrauen!</p><p>Also will ich lieber dem Kaiser Ehre erweisen, nicht dadurch, indem ich ihn anbete, sondern dadurch, daß ich für ihn bete. Den wirklichen und wahren Gott bete ich an, da ich weiß, daß der Kaiser von ihm bestellt ist. Du wirst mir also sagen: Warum betest du den Kaiser nicht an? Weil er nicht geschaffen ist, um angebetet, sondern um geehrt zu werden mit rechtmäßiger Ehre; denn er ist nicht Gott, sondern ein Mensch, von Gott bestellt, nicht um angebetet zu werden, sondern um ein gerechter Richter zu sein. Es ist ihm nämlich von Gott gleichsam die Verwaltung anvertraut worden. Auch er duldet ja nicht, daß seine untergeordneten Beamten sich Kaiser nennen, denn Kaiser ist<em>sein</em> Name, und keinem andern ist es erlaubt, sich so nennen zu lassen; so auch gebührt die Anbetung einzig Gott. Daher bist du im vollen Irrtum, o Mensch! Ehre den Kaiser mit Liebe gegen ihn, sei ihm untertan, bete für ihn! Dadurch nämlich erfüllst du den Willen Gottes. Denn das Gesetz Gottes sagt: „Ehre Gott und den König, mein Sohn, und sei keinem von beiden ungehorsam, denn schnell werden sie ihre Widersacher zur Strafe ziehen“.</p><p>Was deinen Spott über mich betrifft, indem du mich nämlich einen Christen nennst, so weißt du nicht, was du sagst. Erstens ist das Wort [Xristos]<em>Χριστός</em> ein süßes, gar nutzbringendes und durchaus nicht lächerliches Wort. Denn welches Schiff ist brauchbar und kann glücklich durchkommen, ohne daß es zuerst geteert wird? Oder welcher Turm oder welches Haus ist schön und brauchbar ohne Anstrich? Welcher Mensch tritt in dieses Leben ein oder in einem Ringkampfe auf, ohne gesalbt zu werden? Welches Kunstwerk oder welcher Schmuckgegenstand ist schön ohne Firniß und Politur? Und dann ist ja die Atmosphäre und die ganze Erde gewissermaßen gesalbt von Licht und Odem. Du aber willst nicht gesalbt werden mit dem Öle Gottes? Deswegen also heißen wir Christen, weil wir mit dem Öle Gottes gesalbt sind.</p><p>Und nun deine Leugnung der Auferweckung der Toten. Du sagst nämlich: Zeige mir auch nur einen, der von den Toten auferweckt worden ist, damit ich sehe und glaube. Fürs erste: Was ist es Großes, wenn du das glaubst, das du gesehen hast? Und dann glaubst du auf der einen Seite, daß Herakles, der sich verbrannt hat, jetzt lebt, und daß Asklepios, der vom Blitze erschlagen worden, wieder sei auferweckt worden; auf der andern Seite bist du voll Unglauben den Aussprüchen Gottes gegenüber. Ich dürfte dir auch einen Verstorbenen, der von den Toten erweckt worden ist und lebt, vorzeigen, und du würdest auch da nicht glauben. Gott nun gibt dir viele Beweisgründe hierfür, auf daß du ihm glaubest. Denn betrachte gefälligst, wie die Jahreszeiten, die Tage, die Nächte ebenfalls endigen und wieder erstehen. Findet nicht auch bei den Samen und Früchten eine Wiederauferstehung statt, und zwar zum Nutzen der Menschen? Zum Beispiel das Getreidekorn oder das Korn anderer Samen wird in den Boden gelegt, erstirbt zuerst und zerfällt, dann aber wird es wieder auferweckt und wird zur Ähre. Bringen nicht ferner die Wald- und Fruchtbäume nach göttlicher Anordnung zu ihrer Zeit ihre Früchte, da, wo zuvor nichts sich zeigte und zu sehen war? Ferner sogar verschluckt manchmal ein Sperling oder irgendein anderer Vogel einen Apfel- oder Feigen- oder irgendeinen andern Kern, setzt sich auf einen felsigen Hügel oder auf ein Grabdenkmal, und gibt ihn dort wieder von sich; und der Kern schlägt Wurzeln und wächst zum Baume heran, obwohl er zuvor verschluckt worden und durch soviel Wärme durchgegangen ist. Das alles wirkt die göttliche Weisheit, um auch hierdurch zu zeigen, daß Gott die Macht hat, die allgemeine Auferstehung aller Menschen zu bewirken. Wenn du aber ein noch wundervolleres Schauspiel sehen willst, das zum Beweis der Auferstehung geschieht, nicht bloß auf Erden hier, sondern am Himmel, so betrachte die Auferstehung des Mondes, die allmonatlich eintritt: wie er nämlich abnimmt, verschwindet und wieder aufersteht. Höre weiter, o Mensch, auch von der Tatsache der Auferstehung, die in dir selbst vorgeht, wenn du sie auch nicht merkst. Du bist nämlich vielleicht schon einmal in eine Krankheit gefallen und hast dadurch die Fülle deines Körpers, die Kraft und das gute Aussehen verloren; aber du hast von Gott wieder Erbarmen und Heilung erlangt und damit wieder dein volles Fleisch, das gute Aussehen und die Kraft gewonnen. Und wie du zuvor nicht gewußt hast, wohin dein Fleisch gekommen, als es verschwunden war, so weißt du auch jetzt nicht, woher es dir wieder geworden oder gekommen ist. Du wirst freilich sagen: „Aus der Nahrung und den in Blut verwandelten Säften“. Gut! aber dies ist auch ein Werk Gottes, der es so eingerichtet hat, und nicht irgend eines anderen.</p><p>Sei also nicht ungläubig, sondern gläubig, denn auch ich habe einst nicht geglaubt, daß es also sein wird. Jetzt aber habe ich die Sache erwogen und glaube, weil mir zugleich auch die hl. Schriften der hl. Propheten in die Hände kamen, die da im Geiste Gottes voraussagten die Vergangenheit, wie sie war, die Gegenwart, wie sie ist, und die Zukunft, wie sie sein wird. Da ich nun die Gegenwart und die Weissagungen derselben als Zeugnis habe, bin ich nicht mehr ungläubig, sondern glaube, gehorsam gegen Gott. Und diesem gehorche doch auch du im Glauben, damit du nicht, jetzt ungläubig, einst zu deinem Schmerze, in den ewigen Strafen nämlich, glauben mußt! Von jenen Weissagungen durch die Propheten über diese Strafen haben die Dichter und Philosophen, die ja später waren, aus den hl. Schriften gestohlen, damit ihre Aussprüche glaubwürdig würden. Aber gut ists, daß auch sie (gleich den Propheten) die über die Gottlosen und Ungläubigen ergehenden Strafen vorhergesagt haben, damit dies Zeugnisse seien für alle und niemand sagen könne: „Davon haben wir nichts gehört noch gewußt“. So nimm denn auch du mit gutem Willen und ehrfurchtsvoll die prophetischen Schriften zur Hand, und sie werden dir deutlicher den Weg zeigen, wie du den ewigen Strafen entfliehen und die ewigen Güter Gottes erlangen kannst. Denn derjenige, der den Mund gegeben zum Sprechen, der die Ohren gebildet zum Hören und die Augen erschaffen hat zum Sehen, wird alles zur Rechenschaft ziehen und ein gerechtes Urteil fällen und jedem nach Verdienst seinen Lohn geben. Denen, die mit Beharrlichkeit in guten Werken die Unsterblichkeit suchen, wird er geben ewiges Leben, Freude, Friede, Ruhe und eine Fülle von Gütern, wie sie kein Auge gesehen, kein Ohr gehört, noch in eines Menschen Herz gekommen; den Ungläubigen aber, den Verächtern, die der Wahrheit nicht beipflichten, sondern der Ungerechtigkeit sich hingeben, indem sie sich wälzen im Ehebruch, Hurerei, Knabenschändung, Übervorteilung anderer, in lasterhaftem Götzendienst: Zorn, Ungnade, Trübsal und Angst; und zuletzt wird solchen das ewige Feuer zuteil werden. Weil du nun, mein Freund, gesagt hast: „Zeige mir deinen Gott!“ so siehe, dies ist mein Gott; und ich rate dir, ihn zu fürchten und an ihn zu glauben.</p><h2>2</h2><p>Als wir neulich miteinander zu sprechen kamen, bester Autolykus, und du mich fragtest, wer mein Gott sei, habe ich dir, da du mir für einige Augenblicke Gehör schenktest, meine Religion auseinandergesetzt. Auch gingen wir, als wir Abschied nahmen, in der besten Freundschaft nachhause, obwohl du anfangs bitter gegen mich warst. Du weißt und erinnerst dich nämlich, daß du meine Lehre als Torheit bezeichnetest. Da du nun später selbst mich auffordertest, so will ich dir, trotzdem, daß ich kein Meister der Sprache bin, doch auch jetzt durch diese Schrift deine unnütze gelehrte Beschäftigung und den eitlen Götzendienst, in dem du befangen bist, an der Hand einiger weniger deiner Geschichten, die du liest, wahrscheinlich nicht einmal verstehst, offenkundig machen.</p><p>Es scheint mir nämlich lächerlich, daß Holzschneider, Bildhauer, Maler, Erzgießer Götter bilden, malen, schnitzen, gießen und überhaupt verfertigen, sie aber, da sie aus ihrer Hand kommen, als nichtig ansehen. Werden sie aber für einen sogenannten Tempel oder für ein Haus angekauft, dann opfern ihnen nicht nur die Käufer, sondern auch die Verfertiger und Verkäufer desselben kommen mit Eifer und großem Aufwand von Opfern und Spenden herbei, um sie anzubeten und halten sie jetzt für Götter, ohne daran zu denken, daß sie gerade noch solche Dinge sind, wie sie waren, als sie von ihnen verfertigt wurden, nämlich Stein, Erz, Holz, Farbe oder ein anderer Stoff. Dies passiert aber auch euch, die ihr die Geschichten und Geschlechtsregister der sogenannten Götter leset. Wenn ihr nämlich auf ihre Zeugung kommet, denkt ihr sie als Menschen; gleich darauf aber nennt ihr sie Götter und verehrt sie als solche, ohne zu denken und zu sehen, daß sie, so wie ihr gelesen habt, geborene Menschen sind.</p><p>Und es ging bei den Göttern damals, wenn eine solche Zeugung stattgefunden, eine sehr zahlreiche Zeugung vor sich. Aber wo kann man jetzt ein Fortzeugen der Götter nachweisen? Wenn sie nämlich damals zeugten und gezeugt wurden, so ist klar, daß bis jetzt Götter durch Zeugung entstehen müssen; man müßte sonst ein solches Geschlecht als ein schwächliches Geschlecht ansehen; denn sie sind entweder alt geworden und haben deswegen keine Zeugungskraft mehr, oder sind gestorben und verschwunden. Denn wenn Götter gezeugt wurden, so müßten sie bis auf heute gezeugt werden, so wie auch Menschen gezeugt werden; richtiger, es müßte mehr Götter als Menschen geben, wie die Sibylle sagt: „Pflanzen die Götter sich fort, dabei unsterblich verbleibend, Würden der Götter gezeugt viel mehr als der sterblichen Menschen, Und es gebräche zuletzt für diese zum Stehen an Platz noch.“</p><p>Denn wenn, wie der Augenschein lehrt, von den Menschen, die sterblich und kurzlebig sind, bis jetzt fortwährend Kinder erzeugt werden und ihre Fortpflanzung nicht aufgehört hat, wodurch Städte und Dörfer bevölkert und die ländlichen Fluren bewohnt werden: wie sollten die Götter, die nach den Dichtern nicht sterben, nicht viel eher zeugen und gezeugt werden, so wie ihr behauptet, daß eine Zeugung derselben stattgefunden hat? Warum wurde der Olympus genannte Berg ehemals von den Göttern bewohnt und findet sich jetzt verlassen? Oder warum wohnte Zeus ehemals auf dem Ida (sein dortiger Wohnsitz war eine bekannte Tatsache, wie Homer und andere Dichter dies bezeugen), während man ihn jetzt nicht mehr weiß? Weswegen auch war er nicht überall, sondern nur an einem Punkt der Erde zu finden? Entweder nämlich kümmerte er sich um die übrige Welt nicht, oder es war ihm nicht möglich, überall zu sein oder für alles zu sorgen. Denn wenn er beispielsweise an einem Orte im Morgenlande war, so war er im Abendlande nicht; hinwiederum, wenn er im Abendlande war, war er im Morgenlande nicht. Dem höchsten, wahren Gott, dem Allherrscher aber ist es eigen, nicht bloß überall zu sein, sondern auch alles zu sehen und alles zu hören: davon gar nicht zu reden, daß er von einem Raume eingeschlossen würde. Würde er dies, so wäre der ihn umschließende Raum größer als er; denn das Umschließende ist größer als das Umschlossene; Gott aber wird nicht umschlossen, sondern er ist selbst der Raum für das All. Warum aber auch hat Zeus den Ida verlassen? Ist er gestorben oder gefiel ihm jener Berg nimmer? Wohin ist er doch gegangen? In den Himmel hinauf? Nein. Doch, „nach Kreta!“ wirst du sagen. Gut! denn dort wird ja bis jetzt sein Grab gezeigt. „Nach Pisa“ wirst du ferner antworten, wo er bis jetzt die Künstlerhand des Phidias verherrlicht. Laß uns nun auf die Schriften der Philosophen und Dichter kommen!</p><p>Einige Philosophen aus der stoischen Schule leugnen das Dasein Gottes ganz; oder, wenn es auch einen Gott gebe, so kümmere er sich um nichts als um sich selbst. Und dies hat die Torheit des Epikur und Chrysippus wirklich ausgesprochen. Andere sagen, es herrsche blinder Zufall im All, und die Welt sei von jeher, und die Natur ewig; ja sie wagten sogar zu behaupten, es gebe keine göttliche Vorsehung für das Ganze, sondern nur das Bewußtsein des Einzelnen sei Gott. Andere wieder erklären den alles durchdringenden Lebensodem (das Lebensprinzip) für Gott. Plato und seine Schule geben zwar einen Gott zu, der nicht erst geworden, Vater und Schöpfer des Alls sei; aber dann nehmen sie zu Gott hinzu auch noch eine Materie an, die ungeschaffen und mit Gott gleich alt sei. Wenn aber Gott ohne Anfang und die Materie ohne Anfang ist, so ist Gott nicht mehr der Schöpfer des Alls nach den Platonikern; auch kann die Absolutheit Gottes nicht mehr aufrecht gehalten werden, nach ihnen wenigstens. Wenn ferner die Materie ohne Anfang ist, wie Gott, der, weil ohne Anfang, unveränderlich ist, so ist sie auch unveränderlich und Gott gleich. Denn dasjenige, was werden kann, ist veränderlich und dem Wechsel unterworfen; was ohne Anfang ist, ist unveränderlich und keinem Wechsel unterworfen. Was ist ferner Großes daran, wenn Gott aus einer vorhandenen Materie die Welt gemacht hat? Bildet doch auch ein menschlicher Künstler, wenn er irgendwoher einen Stoff erhält, aus ihm, was er will. Gottes Allmacht zeigt sich aber darin besonders, daß er aus dem Nichtseienden macht, was er will, wie es auch keinem andern als nur Gott eigen ist, Leben und Bewegung zu geben. Denn ein Mensch macht zwar ein Bild, aber Seele, Odem und Empfindung kann er seinem Werke nicht verleihen. Gott aber besitzt noch eine höhere Macht als der Künstler, nämlich ein denkendes, atmendes, empfindendes Wesen zu bilden. Wie also in allen diesen Beziehungen Gott mächtiger ist als der Mensch, so ist ihm auch eigen, die Dinge aus nichts zu erschaffen und erschaffen zu haben, so viele und auf welche Weise er will.</p><p>Es gehen also die Meinungen der Philosophen und Schriftsteller auseinander. Denn während jene obige Ansicht aufstellen, bringt<em>Homer</em> eine andere Hypothese über die Entstehung nicht bloß der Welt, sondern auch der Götter. Er sagt nämlich irgendwo: „Auch den Okeanos, der uns gezeugt, und Thetys, die Mutter; Diesen verdanken das Meer und alle die Flüsse den Ursprung.“</p><p>Aber mit diesen Worten führt er uns wahrlich keinen Gott mehr vor. Denn wer wüßte nicht, daß der Ozean Wasser ist? Wenn aber der Ozean Wasser ist, so ist er doch nicht Gott! Wenn aber Gott der Schöpfer des Alls ist, was er wirklich ist, so ist er auch der Schöpfer des Wassers und der Meere.<em>Hesiod</em> besang ebenfalls die Entstehung nicht bloß der Götter, sondern auch der Welt. Nachdem er aber gesagt, daß die Welt geworden sei, sah er sich nicht mehr imstande anzugeben, von wem sie gemacht worden sei. Er bringt ferner auch Götter daher, den Kronos, dessen Sohn Zeus, den Poseidon und Pluto, und wir erfahren, daß sie später entstanden seien als die Welt. Ferner erzählt er auch, daß Kronos von Jupiter, seinem eigenen Sohne, bekriegt worden sei. Er sagt nämlich: „Als er den Vater besiegt mit Kraft, da verteilte er weise Unter die Götter die Welt, wies jedem das ehrende Amt zu.“ (Theog. 73.)</p><p>Hierauf erwähnt er in seinem Gesang die Töchter des Zeus, die er auch Musen nennt, und ruft sie um ihren Beistand an, indem er von ihnen belehrt zu werden wünscht, auf welche Weise die Welt entstanden sei. Er sagt nämlich: „Seid mir gegrüßt, ihr Töchter des Zeus! Gebt süßen Gesang mir, Feiert das heil’ge Geschlecht unsterblicher, ewiger Götter, Welche entsprossen der Erde, dem sternbesäeten Himmel, Welche der finsteren Nacht, die ernährte die salzige Meerflut. Singt, wie zuerst sind entstanden die Götter, die Erde, die Flüsse, Ferner das wogende Meer, unendlich die Länder umgürtend, Leuchtende Sterne sodann, und darüber der wölbende Himmel, (Und die Verleiher des Guten zusamt, die diesen entsprangen.) Singt, wie sie teilten die Welt und die einzelnen Ämter besetzten. Auch wie zuerst sie den vielfach zerspalt’nen Olympus bewohnten. Meldet mir dieses, ihr Musen, Olympische Höhen bewohnend, An vom ersten Beginne, und was als Erstes geworden.“ (Theog. V. 104 – 115.)</p><p>Wie konnten aber die Musen dies wissen, die doch später entstanden als die Welt? Oder wie konnten sie es dem Hesiod sagen, da doch sogar ihr Vater damals noch nicht geboren war?</p><p>Hesiod nimmt ferner in gewissem Sinne eine (selbstständige) Materie und eine Schöpfung der Welt an, indem er sagt: „Anfangs wurde das Chaos, nach ihm dann die Erde, die Mutter, Weithin gedehnt, stets sicherer Sitz unsterblicher Götter, Wie sie vereint des Olympus schneeige Gipfel bewohnen, Dann im Innern der Erde der finstere Tartarus unten, Eros sodann, an Schönheit der erste der ewigen Götter, Er der Vertreiber des Harms, der sämtlichen Göttern und Menschen Zwingend beherrschet das Herz in der Brust und die klügere Einsicht. Und aus dem Chaos entsprossen die finstere Nacht und das Dunkel. Kinder der Nacht dann waren die Luft und die Helle des Tages, Die sie mit ihrem Gemahle, dem Dunkel, in Liebe erzeugte. Aber die Erde gebar als ersten ihr ähnlichen Sprößling Oben den Himmel mit Sternen geschmückt, um sie zu umhüllen, Und um den seligen Göttern zu sein stets sicherer Wohnsitz. Ferner gebar sie die ragenden Berge, der göttlichen Nymphen Lieblingsort, die ja gern in klüftigen Bergen verweilen. Weiter erzeugte die Erde die rastlos wogende Meerflut, Ebenso auch, doch entbehrend des Mannes Umarmung, den Pontus; Doch im Verein mit dem Himmel gebar sie des Ozeans Tiefen.“ (Theog. V. 116 – 133.)</p><p>Indem Hesiod dieses singt, sagt er auch da nicht, von wem die Dinge geschaffen wurden. Wenn nämlich im Anfang das Chaos und eine ewige Materie vorhanden war, wer war es denn, der sie umgestaltete, ihr Ordnung und Form verlieh? Hat sie selbst sich Form und Ordnung gegeben? Denn Zeus ist erst viel später nicht nur als die Materie, sondern auch als die (gestaltete) Welt, und als das Menschengeschlecht ins Dasein getreten; ja auch sein Vater Kronos kam später. Oder war es vielmehr ein höheres Wesen, das sie erschuf, Gott meine ich, der sie auch geordnet hat? Weiter sieht man, daß Hesiod in jeder Beziehung ungereimtes Zeug sagt und sich selbst widerspricht. Nachdem er nämlich Himmel, Erde und Meer genannt hat, läßt er von ihnen die Götter abstammen, und von diesen dann ein gewaltiges, mit den Göttern verwandtes Geschlecht von Menschen, die Titanen und Kyklopen, und die Schar der Giganten und ägyptischen Gottheiten, oder (vielmehr) nichtiger Menschen, wie Apollonides mit dem Beinamen Horapius in seinem "Semenuthi“ betitelten Buche erwähnt, und wie sie in dessen übrigen Geschichtsbüchern über den Götterdienst und über die Könige der Ägyptier aufgeführt sind.</p><p>Was soll ich über die Mythologie der Griechen und die eitle gelehrte Grübelei in derselben sagen, wie nämlich Pluto über die dunkle Unterwelt herrscht, Poseidon unter dem Meere wohnt, dann durch Umarmung der Menalippe einen Menschen fressenden Sohn erzeugte, oder was alles die Schriftsteller über die Kinder des Zeus zusammengeschrieben haben? Und sie selbst sind es, die ihre Geburt berichten, weil diese eben Menschen und nicht Götter waren. Aristophanes, der Lustspieldichter, versucht ebenfalls in seinem „Die Vögel“ betitelten Stück eine Erklärung der Entstehung der Welt und sagt dort, daß die ganze Welt anfangs in einem Ei sei beschlossen gewesen. Er sagt nämlich: „Uranfangs legte die Nacht mit dem pechschwarzen Gefieder ein Windei.“</p><p>Auch Satyrus in seiner Aufzählung der Stämme der Bewohner von Alexandria gibt, indem er mit Philopator, der auch den Beinamen Ptolemäus hatte, anfängt, den Dionysus als Urheber dieses Stammes an. Deswegen bildete Ptolemäus den ersten Stamm. Satyrus also sagt: Von Dionysus und der Äthea, der Tochter des Thestius, stammt Deianira; von ihr und Herakles, dem Sohne des Zeus, Hyllus; von diesem Kleodemus, von diesem Aristomachus, von diesem Temenus, von diesem Keisus, von diesem Maron, von diesem Thestius, von diesem Akous, von diesem Aristomidas, von diesem Karanus, von diesem Koinus, von diesem Tyrimmas, von diesem Perdikkas, von diesem Philippus, von diesem Aeropus, von diesem Alketas, von diesem Amyntas, von diesem Bokrus, von diesem Meleager, von diesem Arsinoe; von ihr und Lagus Ptolemäus, der auch Soter heißt; von ihm und Berenike Ptolemäus Philadelphus, von ihm und Arsinoe Ptolemäus Euergetes; von diesem und Berenike, der Tochter des Magas, Königs von Cyrene, Ptolemäus Philopator. So wickelt sich die Verwandtschaft der Könige in Alexandrien mit Dionysus ab. Es gibt daher im Dionysischen Stamme auch wieder gesonderte Familien: so die Altheische von Althea, der Tochter des Thestius und Gemahlin des Dionysus; die Deianirische von der Tochter des Dionysus und der Althea und Gemahlin des Herakles; von diesem haben die Familien bei ihnen auch ihre Namen, nämlich: die Ariadnische von Ariadne, der Tochter des Minos und Gemahlin des Dionysus, einer gegen ihren Vater liebevollen Tochter, die mit Dionysus unter der Gestalt eines Schiffsherrn Umgang pflog; die Thestische von Thestius, dem Vater der Althea; die Thoantische von Thoas, dem Sohne des Dionysus; die Staphylische von Staphylus, dem Sohne des Dionysus; die Euanische von Eunous, dem Sohne des Dionysus; die Maronische von Maron, dem Sohne der Ariadne und des Dionysus. Diese alle nämlich sind Söhne des Dionysus. Doch noch viele andere Namen hat es gegeben und gibt es jetzt noch, so die Herakliden von Herakles, die Apolloniden und Apollonier von Apollon, die Poseidonier von Poseidon; die Dioer und Diogenen von Zeus.</p><p>Und wozu soll ich weiter die Fülle von derartigen Benennungen und Stammbäumen aufzählen? In jeder Beziehung also lassen alle die Schriftsteller, Dichter und sogenannten Philosophen, und die sich mit ihnen abgeben, sich zum Besten halten. Denn Fabeln vielmehr und Torheiten haben sie über ihre Götter zusammengeschrieben. Denn nicht als Götter haben sie dieselben hingestellt, sondern als Menschen, die einen als Trunkenbolde, die andern als Hurer und Mörder. Aber auch über den Ursprung der Welt haben sie einander widersprechende und törichte Meinungen ausgesprochen. Denn erstens haben einige die Welt als ewig erklärt, wie wir oben gezeigt haben. Und diese, welche sie für ungeworden und die Natur für ewig erklären, haben Dinge gesagt, die mit den Aussprüchen derer, welche die Welt für einmal geworden erklären, gänzlich unvereinbar sind. Sie haben dies ja nur nach Vermutung und menschlicher Einbildung, nicht nach der Wahrheit ausgesprochen. Andere wieder haben das Dasein einer göttlichen Vorsehung behauptet und so die Sätze jener wieder umgestoßen. Aratus also sagt: „Zeus sei unser Beginn! Laßt nie uns, Männer, von diesem Schweigen; denn voll sind seiner die Gassen und Straßen der Städte, Voll ist jeder Versammlungsplatz, voll Meere und Buchten; Alle bedürfen wir stets in jeder Beziehung des Gottes. Sind wir ja doch sein eigen Geschlecht, und gnädig die Rechte Zeigt er dem Volke, und wecket die Menschen zur Arbeit, Mahnend, fürs Leben zu sorgen; er zeigt, wann Rinder und Karste Leichter die Scholle zerbrechen; er zeigt die gelegene Zeit an, Um das Gepflanzte zu häufeln und alle die Samen zu streuen,“ (Phaen. V. 1—9.)</p><p>Wem sollen wir also glauben? Diesem Aratus oder dem Sophokles, der sagt: „Nicht sich’res Walten Gottes lenkt den Weltenlauf; Am besten ist’s, so hinzuleben wie man kann.“ (Kön. Ödip. V. 978.)</p><p>Homer aber stimmt mit diesem wieder nicht überein; denn er sagt: „Zeus ist’s, welcher vermehrt und vermindert dem Manne die Tugend.“ (Il. 20, 242.)</p><p>Und Simonides: „Keiner hat ohne die Götter Trefflichkeit errungen, kein Staat, kein Sterblicher; Gott ist’s, der alles ersinnt, ohne ihn ist ohne Beschädigung Nichts.“</p><p>Ähnlich sagt Euripides: „Es gibt auf Erden nichts, was ohne Gott besteht.“</p><p>Und Menander: „Die Gottheit nur trägt Sorge für die Sterblichen.“</p><p>Und wieder Euripides: „Wenn Gottes Ratschluß jemand retten will, Dem gibt er viele Rettungsmittel an die Hand.“</p><p>Und Thestius: „So Gott es will, so kommst du auch im Binsenkahn Durchs Meer!“</p><p>Und dergleichen sich selbst widersprechende Aussprüche tun sie zu Tausenden. Sophokles wenigstens, der in dem einen Ausspruche das Nichtvorhandensein einer Vorsehung ausspricht, sagt wieder: „Der Gottheit Hand entflieht kein Sterblicher.“</p><p>Ja sie haben sogar eine Mehrzahl von Göttern erfunden und dabei wieder die Einzigkeit Gottes behauptet, und im Gegensatz zu denen, die eine Vorsehung annahmen, das Nichtvorhandensein derselben behauptet. Daher macht Euripides das Geständnis: „Der eitlen Hoffnung voll, sind wir gar sehr bemüht Und voller Plag’; doch gar nichts wissen wir.“</p><p>Und zwar müssen sie wider Willen bekennen, daß sie die Wahrheit nicht wissen; aber da sie von Dämonen inspiriert und begeistert waren, stammen ihre Aussprüche von diesen. Denn die Dichter, nämlich Homer und Hesiod, von den Musen begeistert, wie man sagt, redeten nach Einbildung und Irrwahn, nicht von einem reinen, sondern von einem trügerischen Geiste inspiriert. Dies wird aber dadurch deutlich bewiesen, daß auch Besessene manchmal, und zwar bis zur Jetztzeit, im Namen des wahren Gottes beschworen werden, und daß da die trügerischen Geister selbst bekennen, sie seien Dämonen, welche einst in jenen Dichtern tätig gewesen. Freilich machten einige von diesen, wenn sie nüchternen Geistes waren, Aussprüche über die Einzigkeit Gottes, über das Gericht und die übrigen Dinge, von denen sie sprechen, welche mit denen der Propheten übereinstimmen, damit sie sich selbst und allen Menschen zum Zeugnisse wären.</p><p>Die Männer Gottes aber, als Gefäße des Heiligen Geistes und als Propheten, waren von Gott selbst inspiriert und unterrichtet, und so gottgelehrte, heilige und gerechte Männer. Deswegen wurden sie auch des Lohnes gewürdigt, Gottes Werkzeuge zu werden und die von ihm ausströmende Weisheit in sich aufzunehmen; und durch diese prophezeiten sie über die Erschaffung der Welt und über alle übrigen Dinge. Denn auch über Pest, Hungersnot, Krieg machten sie Prophezeiungen, und nicht etwa einer oder zwei, sondern es standen ihrer nach der Zeit und Veranlassung mehrere bei den Hebräern auf, aber auch bei den Griechen die Sibylle, und alle Ihre Aussprüche stehen in schönster Harmonie miteinander, die über das vor ihnen Geschehene, die über die Vorgänge zu ihrer Zeit, und die über das, was sich jetzt zu unserer Zeit vollzieht. Deswegen sind wir überzeugt, daß das Zukünftige ebenso eintreffen werde, wie das Vergangene sich vollzogen hat.</p><p>Und zwar lehrten sie uns erstens in voller Übereinstimmung, daß Gott das Weltall aus dem Nichts erschaffen. Denn nichts existierte neben Gott, sondern er selbst war sein Raum, war sich selbst vollkommen genug und war da vor allen Zeiten. Er wollte aber den Menschen schaffen, um von ihm erkannt zu werden; für diesen also bereitete er die Welt zu. Denn der Gewordene ist vieler Dinge bedürftig, der Ewige aber ist bedürfnislos. Es zeugte also Gott mit seiner Weisheit sein Wort, das er in seinem eigenen Innern beschlossen trug, indem er es vor allen Dingen aus sich hervortreten ließ. Dieses Wort nun gebrauchte er als Mittel aller seiner Schöpfungen und erschuf alles durch dasselbe. Dies Wort heißt „der Anfang“, weil es das Prinzip und der Herr aller Dinge ist, die durch dasselbe sind geschaffen worden. Dies Wort also, das da ist der Geist Gottes, das Prinzip (aller Dinge), die Weisheit und Kraft des Allerhöchsten, war es, das auf die Propheten herabkam und durch sie die Offenbarungen über die Erschaffung der Welt und die übrigen Dinge redete. Denn die Propheten waren noch nicht, als die Welt entstand, aber die Weisheit Gottes, die in ihm ist, und das hl. Wort Gottes, das ewig bei ihm wohnt, waren schon. Eben aus diesem Grunde spricht es auch durch den Propheten Salomon: „Als er den Himmel zubereitete, war ich bei ihm, und als er den Grund der Erde fest machte, war ich bei ihm und ordnete mit“. Moses, der viele Jahre vor Salomon lebte, vielmehr das Wort Gottes durch ihn als Organ, sagt: „Im Anfang schuf Gott Himmel und Erde“. Zuerst spricht er vom Anfang und vom Schaffen, und so verband er dann Gott damit. Man soll nämlich Gott nicht müßig und eitel nennen. Denn die göttliche Weisheit wußte im voraus, daß manche eitel daher reden und eine Menge nicht existierender Götter erfinden würden. Damit also der wahre Gott aus seinen Werken erkannt werde, und auch, daß Gott in seinem Worte Himmel und Erde und alles, was darinnen ist, erschaffen habe, sagte er: „Im Anfang schuf Gott Himmel und Erde“. Hernach, nachdem er ihre Erschaffung erzählt hat, fährt er erklärend fort: „Die Erde war unsichtbar und ungeordnet, und Finsternis war über dem Abgrund, und der Geist Gottes schwebte über dem Wasser“. Dies lehrt die göttliche Schrift also zuerst, nämlich gewissermaßen einen Urstoff, von Gott erschaffen, aus dem Gott die Welt gemacht und geformt hat.</p><p>Der Anfang der Weltbildung ist das Licht, weil das Licht das in Ordnung Gebrachte zu schauen ermöglicht. Deswegen sagt die Schrift: „Und es sprach Gott: Es werde Licht! Und es sah Gott das Licht, daß es gut sei“, offenbar gut für den Menschen. „Und es schied Gott das Licht von der Finsternis und nannte das Licht Tag, und die Finsternis Nacht. Und es ward Abend und Morgen, Ein Tag. Und Gott sprach: Es werde eine Feste zwischen dem Wasser, und sondere Wasser von Wasser! Und also geschah es. Und Gott machte die Feste und sonderte das Wasser, das unter der Feste war, von dem Wasser oder der Feste. Und Gott nannte die Feste Himmel. Und Gott sah, daß es gut sei. Und es ward Abend und Morgen, der zweite Tag. Und Gott sprach: Es sammle sich das Wasser, so unter dem Himmel ist, an Einen Ort, und es erscheine das Trockene. Und also geschah es. Und es sammelte sich das Wasser an seine Plätze, und es erschien das Trockene. Und Gott nannte das Trockene Erde, und die Sammlungen der Wasser nannte er Meere. Und Gott sah, daß es gut war. Und Gott sprach: Es lasse die Erde Gras sprossen, das Samen macht nach seiner Art und seinem Gleichnisse, und Fruchtbäume, die da Frucht tragen, in denen ihr Same ist nach ihrer Art. Und es geschah so. Und die Erde ließ sprossen Gras, das Samen macht nach seiner Art, und Fruchtbäume, die ihren Samen in sich haben nach ihrer Art auf Erden. Und Gott sah, daß es gut war. Und es ward Abend und Morgen, der dritte Tag. Und Gott sprach: Es sollen Lichter werden an der Feste des Himmels zur Beleuchtung auf der Erde, und zu scheiden Tag und Nacht, und sie seien zu Zeichen, zu Zeiten, zu Tagen und zu Jahren, sie seien zur Erleuchtung an der Feste des Himmels zu leuchten über die Erde. Und also geschah es. Und Gott machte die zwei großen Lichter, das große zu beherrschen den Tag, und das kleinere zu beherrschen die Nacht, und die Sterne. Und Gott setzte sie an die Feste des Himmels, daß sie über der Erde herleuchten und beherrschen den Tag und die Nacht und scheiden das Licht von der Finsternis. Und Gott sah, daß es gut war. Und es ward Abend und Morgen, der vierte Tag. Und Gott sprach: Es bringe das Wasser hervor kriechendes Getier mit lebendiger Seele und Geflügel über der Erde unter der Feste des Himmels. Und es geschah also. Und Gott schuf die großen Wasserungeheuer und jede Seele der kriechenden Tiere, die das Wasser hervorgebracht nach ihren Arten und alles Geflügel nach seiner Art. Und Gott sah, daß es gut war. Und er segnete sie und sprach: Wachset und mehret euch und erfüllet die Wasser des Meeres, und die Vögel sollen sich mehren auf Erden. Und es ward Abend und Morgen, der fünfte Tag. Und Gott sprach: Es bringe die Erde hervor lebende Wesen nach ihrer Art, Vieh und Gewürm und wilde Tiere der Erde nach ihrer Art. Und also geschah es. Und Gott machte die Tiere der Erde nach ihrer Art und das Vieh und alles Gewürm der Erde nach seiner Art. Und Gott sah, daß es gut war, und sprach: Lasset uns den Menschen machen nach unserm Bild und Gleichnisse, und sie sollen herrschen über die Fische des Meeres und das Geflügel des Himmels und die Tiere über die ganze Erde, und über alles Gewürm, das sich reget auf Erden. Und Gott schuf den Menschen nach seinem Bilde, nach dem Bilde Gottes schuf er ihn, Mann und Weib schuf er sie. Und Gott segnete sie und sprach: Wachset und mehret euch und erfüllet die Erde und macht sie euch untertan, und herrschet über die Fische des Meeres, und über das Geflügel des Himmels, und über alles Vieh, und die ganze Erde, und alles Gewürm, das auf der Erde kriecht! Und Gott sprach: Sieh! ich habe euch gegeben alles Kraut mit Samen, das seinen Samen ausstreut, das sich auf Erden findet, und alle Bäume, die an sich Frucht tragen aus treibendem Samen, sollen sein zur Speise euch und allen Tieren der Erde, und allem Geflügel des Himmels, und allem Gewürme, das kriecht auf der Erde, das da in sich hat den Odem des Lebens; (ihnen habe ich) das grünende Gras zur Speise (gegeben). Und also geschah es. Und Gott sah alles, was er gemacht hatte, und sieh! es war überaus gut. Und es ward Abend und Morgen, der sechste Tag. Und es ward vollendet Himmel und Erde und alle ihre Zier. Und Gott vollendete am sechsten Tage seine Werke, die er gemacht, und ruhte am siebenten Tage von allen seinen Werken, die er gemacht hatte. Und Gott segnete den siebenten Tag und heiligte ihn, weil er an ihm ruhte von allen seinen Werken, die er zu schaffen begonnen hatte.“</p><p>Die Erzählung und den Hergang dieses Sechstagewerkes aber in würdiger Weise ganz wiederzugeben, dazu ist kein Mensch imstande, wenn er auch zehntausend Kehlen und zehntausend Zungen hätte; ja auch wenn einer zehntausend Jahre in diesem Leben zubrächte, so wäre er auch nicht imstande, etwas Würdiges in Beziehung hierüber vorzubringen wegen der überschwenglichen Größe und des unermeßlichen Reichtumes der Weisheit Gottes, welche in diesem vorherbeschriebenen Sechstagewerk sich kundgibt. Viele von den Schriftstellern also haben (die Hl. Schrift) nachgeahmt und eine Beschreibung des Hergangs dieser Dinge zu geben versucht; aber obwohl sie die Gedanken aus derselben entlehnten, über die Erschaffung der Welt nämlich und die Natur des Menschen, haben sie auch nicht einmal den geringsten Funken der Wahrheit, welcher der Sache würdig wäre, vorgebracht. Es scheint zwar das von den Philosophen und Schriftstellern Vorgebrachte glaubwürdig zu sein infolge der glänzenden Darstellung, aber es erweist sich ihre Rede als töricht und inhaltsleer, weil sich bei ihnen zwar viel Geflunker, aber auch nicht das kleinste Körnlein Wahrheit findet. Denn wenn etwas von dem, was sie gesagt haben, wahr zu sein scheint, so ist es stets mit dem Irrtume vermischt. Wie nun ein zerstörendes Gift, mit Honig oder Wein oder einem andern Stoff vermischt, das Ganze schädlich und unbrauchbar macht, so zeigt sich auch der überfließende Wortschwall jener Schriftsteller als nutzloses Gerede und mehr als Schaden für jene, die ihnen glauben. (Sie sprechen) ferner über den siebenten Tag, den alle Menschen so nennen, dessen Ursprung aber die meisten nicht kennen. Was nämlich bei den Hebräern „Sabbat“ heißt, bedeutet: „der siebente Tag“; und diesen Namen hat er bei allen Völkern, aber warum? wissen sie nicht.</p><p>Wenn ferner der Dichter Hesiod sagt, es seien aus dem Chaos der Erebus, die Erde und der Eros (die Liebe) entsprungen, welche über alle die von ihm erfundenen Götter und über die Menschen herrsche, so erweist sich seine Angabe als leeres, mattes und aller Wahrheit bares Gerede; denn sich von der Wollust beherrschen zu lassen, ziemt sich doch für einen Gott nicht, da ja auch Menschen, die sich selbst beherrschen können, sich jeder schändlichen Lust und schlechten Begierde enthalten.</p><p>Aber auch sein Gedanke, daß er mit den Dingen auf der Erde hienieden beginnt, und von ihnen die Welt entstehen läßt, ist, was die Gottheit betrifft, sehr menschlich, niedrig und kraftlos. Der Mensch nämlich fängt, weil er irdisch ist, von der Erde aus zu bauen an, und er kann nicht ordentlich (fortbauen) und den Giebel nicht aufsetzen, wenn er nicht zuvor das Fundament legt. Die Macht Gottes aber zeigt sich darin, daß er das, was ins Dasein tritt, erstens aus nichts macht und so, wie er will. Denn was bei den Menschen unmöglich ist, ist bei Gott möglich. Deswegen hat der Prophet zuerst die Erschaffung des Himmels erzählt, der gewissermaßen den Giebel bildet. indem er sagt: „Im Anfang schuf Gott den Himmel“, d. h. durch den Anfang (= den Logos) wurde der Himmel geschaffen, wie wir oben gesagt haben. Er spricht dann von der Erde gleichsam als von einem Fußboden und einer Grundfeste, vom Abgrund d. i. von der Menge der Gewässer, und von der Finsternis, indem der von Gott erschaffene Himmel die Wasser mitsamt der Erde wie ein Deckel in Dunkel hüllte; er spricht vom Geiste, der über dem Wasser schwebte, den Gott der Schöpfung, um sie zu beleben, verliehen hat, gleichwie dem Menschen die Seele, indem er den feinen Stoff mit dem andern feinen Stoffe vermischte – denn Odem und Wasser sind beide feine Stoffe –, damit der Odem das Wasser, das Wasser aber in Verbindung mit dem Odem nach allen Richtungen hin eindringend die Schöpfung belebe. Der Geist (Odem) allein, der einige Ähnlichkeit mit dem Lichte hat, schwebte zwischen dem Wasser und Himmel, gewissermaßen damit die Finsternis nicht mit dem Himmel, der Gott näher ist, zusammenkomme, bevor Gott sprach: „Es werde Licht!“ Der Himmel hielt also, gleich einem Gewölbe den breiiger Erde gleichenden Urstoff umschlossen. Denn ein anderer Prophet, namens Isaias, spricht über den Himmel in folgender Weise: „Dies ist Gott, der den Himmel gemacht wie ein Gewölbe und ihn übergespannt hat wie ein Zelt zur Bewohnung“. Der Machtspruch Gottes also, das heißt sein Wort, erhellte, leuchtend wie eine Lampe in einer verschlossenen Wohnung, die unter dem Himmel liegende Erde, indem er das Licht getrennt von der Welt erschuf. Und Gott nannte das Licht Tag, die Finsternis aber Nacht. Der Mensch nämlich hätte ja das Licht nicht Tag und die Finsternis Nacht, ebensowenig die übrigen Dinge benennen können, wenn er nicht die Benennung von Gott, dem Schöpfer derselben, überkommen hätte. Im ersten Abschnitte der Geschichte der Weltschöpfung spricht also die Hl. Schrift nicht von unserm Firmament, sondern von einem andern Himmel, der für uns unsichtbar ist; erst später heißt dieser uns sichtbare Himmel Firmament. Über ihn ist die Hälfte des Wassers hinaufgesetzt, damit es den Menschen werde zu Regen, zu Güssen und zu Tau, die andere Hälfte blieb auf der Erde zurück zu Flüssen, Quellen und Meeren. Da nun das Wasser die Erde, besonders deren Bodensenkungen, noch bedeckte, so hieß Gott durch sein Wort das Wasser sich an Einen Ort sammeln, und es sollte das Trockene, das vorher ebenfalls noch unsichtbar war, erscheinen. Die Erde war also sichtbar geworden, aber noch ohne Gestaltung. Gott gestaltete sie also und schmückte sie mit den verschiedenartigen Kräutern, Samen und Pflanzen.</p><p>Betrachte nun die bunte Mannigfaltigkeit, die verschiedenartige Schönheit und Vielfältigkeit dieser Pflanzenwelt, und besonders wie sich in ihr die Wiedererstehung zeigt, als Beweis für die zukünftige Auferstehung des gesamten Menschengeschlechtes. Denn wer wird bei einer solchen Betrachtung nicht bewundern, daß aus einem Feigenkerne ein Feigenbaum wird, oder daß aus den übrigen kleinsten Samen die größten Bäume erwachsen? Das Meer aber können wir füglich ein Bild der Welt nennen. Denn gleichwie das Meer, wenn es nicht durch den reichlichen Zufluß der Ströme und Quellen gespeist würde, wegen seines Salzgehaltes längst ausgetrocknet wäre, so wäre auch die Welt, wenn sie nicht Gottes Gesetz und die Propheten hätte, die ihr gleich Flüssen und Quellen Süße, Milde, Gerechtigkeit und Belehrung durch die göttlichen Gebote zuführen, wegen ihrer Bosheit und der in ihr überwuchernden Sünde schon längst zugrunde gegangen. Und wie sich im Meere Inseln befinden, zum Teil bewohnt, gut bewässert und fruchtbar, mit Buchten und Häfen, daß die Schiffer im Sturme dort eine Zufluchtsstätte finden, so hat Gott der Welt, die infolge der Sünden von wilden Stürmen bewegt wird, Sammelplätze gegeben, heilige Kirchen genannt, in welchen sich gleichsam als in sicheren Inselhäfen die Lehrstühle der Wahrheit finden. Zu diesen flüchten nun diejenigen, die gerettet werden wollen, indem sie die Wahrheit lieben und dem Zorne und Gerichte Gottes zu entfliehen trachten. Und wie es wieder andere Inseln gibt, felsig, wasserlos, unfruchtbar, voll wilder Tiere und unbewohnbar, gefährlich für die Seefahrer und vom Sturme Überfallenen, an denen die Fahrzeuge zerschellen und die darauf Befindlichen umkommen, so finden sich auch die Lehrstühle des Irrtums, ich meine der Ketzereien, welche diejenigen ins Verderben bringen, die zu ihnen hingeraten. Denn diese haben nicht die Wahrheit zum Wegweiser, sondern wie Seeräuber, wenn sie ihre Schiffe mit Reisenden gefüllt, dieselben an den obenbezeichneten Stellen zerschellen lassen, um sie zugrunde gehen zu lassen, so ergeht es auch denen, die von der Wahrheit abirren, daß sie nämlich vom Irrtum ins Verderben gestürzt werden.</p><p>Am vierten Tage wurden die Lichter (am Himmel) erschaffen. Gott kannte in seinem Vorherwissen die Faseleien törichter Philosophen, daß sie nämlich behaupten würden, die Erzeugnisse der Erde verdankten den Lichtgestirnen ihren Ursprung, damit sie keinen Gott brauchten. Deswegen wurden, damit die Wahrheit klar hingestellt würde, die Pflanzen und Samen vor den Lichtgestirnen erschaffen. Es kann nun ja das später Gewordene nicht das früher Gewordene hervorbringen. Diese Lichter aber sind Träger und Bilder eines großen Mysteriums. Die Sonne nämlich ist das Bild Gottes, der Mond das des Menschen. Und wie die Sonne an Kraft und Glanz den Mond bei weitem übertrifft, so übertrifft Gott bei weitem den Menschen. Und wie die Sonne fortwährend ihre volle Scheibe behält, ohne kleiner zu werden, so bleibt Gott immerwährend vollkommen, er der voll ist aller Macht und Einsicht und Weisheit und Unsterblichkeit und aller Vorzüge. Der Mond aber verschwindet allmonatlich und stirbt sozusagen – ein Gleichnis des Menschen; dann wird er wiedergeboren und wächst wieder – ein Vorbild unserer zukünftigen Auferstehung. Auf dieselbe Weise sind auch die drei Tage, welche der Schöpfung der Lichter vorangingen, ein Sinnbild der Dreieinigkeit: Gottes, seines Wortes und seiner Weisheit. Das vierte Sinnbild ist das des Menschen, der des Lichtes bedarf, so daß nun da sind: Gott, sein Wort, seine Weisheit, der Mensch. Deswegen wurden auch am vierten Tage die Lichtgestirne erschaffen. Die Anordnung der Sterne aber gewährt uns ein Bild der Ordnung und Stufenfolge, der gerechten, frommen, das Gesetz Gottes beobachtenden Menschen. Die hervorragenden und glänzenden Sterne nämlich sind ein Bild der Propheten; deswegen bleiben sie auch in ihren Bahnen, ohne von einem Ort zum andern zu wandern. Die auf der zweiten Stufe des Glanzes stehenden Sterne sind ein Bild des Volkes der Gerechten. Die Sterne wiederum, die unstät von einem Ort zum andern gehen, die sogenannten Planeten, sind ebenfalls ein Bild, derjenigen nämlich, die von Gott abfallen und sein Gesetz und seine Gebote verlassen haben.</p><p>Am fünften Tage wurden die Tiere des Wassers geschaffen, durch welche wieder die vielgestaltige Weisheit Gottes auch in diesen Dingen ins hellste Licht tritt. Denn wer könnte die Menge und die mannigfaltigen Arten derselben aufzählen? Auch wurden ferner die Geschöpfe des Wassers von Gott gesegnet, daß auch dieses zum Vorbild werde dafür, daß die Menschen dereinst Buße und Nachlassung der Sünden erlangen sollten durch das Wasser und das Bad der Wiedergeburt, daß alle, die der Wahrheit folgen, wiedergeboren werden und Segen erlangen von Gott. Aber auch die Seeungeheuer und die fleischfressenden Vögel sind ein Bild, nämlich habsüchtiger und frevelhafter Menschen. Wie nämlich von den Wassertieren und Vögeln, die des nämlichen Wesens (mit den übrigen ihrer Art) sind, ein Teil bei der natürlichen Ordnung bleibt, sich an den schwächeren Geschöpfen nicht vergreift, sondern das Gesetz Gottes beobachtet und sich von den Samen der Erde nährt, ein anderer Teil aber das Gesetz Gottes verletzt, indem sie Fleisch fressen und so sich an den schwächeren Geschöpfen vergreifen: so beobachten auch die Gerechten das Gesetz Gottes, verletzen und beschädigen niemanden und führen ein heiliges und gerechtes Leben. Die Räuber, Mörder und Gottlosen aber gleichen den Wasserraubtieren, den reißenden Vierfüßlern und den fleischfressenden Raubvögeln; denn sie fressen sozusagen die Schwächeren auf. Das Geschlecht der Wasser- und Kriechtiere also hat, wenn es auch den Segen Gottes erhalten hat, durchaus keinen eigentlichen Vorzug.</p><p>Am sechsten Tag schuf Gott die vierfüßigen und wilden und kriechenden Landtiere, unterläßt aber den Segen über sie, indem er denselben für den Menschen aufspart, den er am sechsten Tage zu schaffen gedachte. Die vierfüßigen und wilden Tiere wurden zugleich auch zum Bilde mancher Menschen, solcher nämlich, die Gott nicht kennen und ehren, irdisch gesinnt und unbußfertig bleiben. Denn diejenigen, die sich von gesetzwidrigem Tun abwenden und gerecht leben, heben sich mit den Flügeln ihres Geistes gleich den Vögeln in die Höhe, indem sie die Dinge denken, die oben sind, und am Willen Gottes Wohlgefallen haben. Menschen aber, die Gott nicht kennen und verehren, gleichen Vögeln, die zwar Flügel haben, aber nicht auffliegen und die Höhen der Gottheit nicht erreichen können. So heißen auch solche Wesen zwar Menschen, aber von der Schwere ihrer Sünde niedergezogen, denken sie nur niedrige und irdische Dinge. Die wilden Tiere aber haben ihren Namen von ihrem wilden Wesen, nicht als ob sie von Anfang als bösartig oder giftig erschaffen worden wären, denn nichts ist von Gott im Anfang böse erschaffen worden, sondern alles gut, und sehr gut; sondern die Sünde des Menschen hat sie böse gemacht. Denn indem der Mensch vom Wege ablenkte, folgten auch sie ihm. Denn gleichwie bei einem Hausvater, wenn er ein geordnetes Leben führt, auch notgedrungen sein Gesinde ordentlich lebt, wenn aber<em>er</em> sich Ausschreitungen erlaubt, dies auch seine Diener tun, gerade so ging es mit dem Menschen, als er sündigte: weil er der Gebieter ist, so sündigten auch die ihm unterworfenen Geschöpfe mit ihm. Wenn nun der Mensch wieder zu einem seiner Natur angemessenen Dasein sich erheben und nicht mehr Böses tun wird, werden auch sie wieder zu ihrem ursprünglichen sanften Wesen zurückkommen.</p><p>Was aber die Erschaffung des Menschen betrifft, so übersteigt sie ihre Schilderung seitens der Menschen, wenngleich die Hl. Schrift eine kurze Erzählung derselben darbietet. Denn erstens zeigt Gott dadurch, daß er sagt: „Laßt uns den Menschen machen nach unserm Bild und Gleichnis!“ die Würde des Menschen. Denn nachdem Gott durch sein Wort alles erschaffen hatte, erachtete er alles als geringfügig, nur die Schöpfung des Menschen aber als ein ewiges, seiner Hände würdiges Werk. Ferner sieht man Gott hierbei gleichsam Beihilfe fordern, indem er sagt: „Laßt uns den Menschen machen nach unserm Bilde und Gleichnissen!“ Zu niemandem andern aber sagt er dies, als zu seinem Worte und zu seiner Weisheit. Nachdem er ihn nun geschaffen und gesegnet hatte, auf daß er wachse und die Erde erfülle, ordnete er ihm alle Wesen als unterwürfig und dienstbar unter und wies ihn an, sich seine Nahrung vom Anfang an von den Früchten der Erde, den Samen und Kräutern und Baumfrüchten zu nehmen; zugleich sollten auch die Tiere nach Gottes Anordnung wie der Mensch von allen den Samen der Erde sich nähren.</p><p>Als nun Gott auf diese Weise Himmel, Erde und Meer und alles, was darinnen ist, in sechs Tagen vollendet hatte, ruhte er am siebenten aus von allen Werken, die er vollbracht hatte. Hierauf faßt die HI. Schrift noch einmal das Ganze zusammen und berichtet: „Dies ist das Buch des Ursprungs des Himmels und der Erde, da sie erschaffen wurden am Tage, da Gott Himmel und Erde machte und alles Gesträuch des Feldes, ehe es hervorkam, und alles Gras des Landes, ehe es sproßte; denn Gott hatte noch nicht regnen lassen auf Erden, und kein Mensch war da, um sie zu bebauen“. Hierdurch belehrt sie uns, daß auch die ganze Erde zu jener Zeit von einer göttlichen Quelle getränkt wurde, und daß es nicht notwendig war, daß der Mensch sie bearbeitete; sondern die Erde brachte nach der Anordnung Gottes alles von selbst hervor, damit sich der Mensch nicht durch Arbeit abzumühen brauchte. Um aber auch die Art der Schöpfung (des Menschen) zu zeigen, damit nicht eine unlösbare Streitfrage darüber unter den Menschen entstünde, weil Gott gesagt hatte: „Laßt uns den Menschen machen!“ ohne daß seine Erschaffung deutlich erzählt worden ist, so belehrt uns die Hl. Schrift darüber, indem sie berichtet: „Eine Quelle stieg auf von der Erde und befeuchtete die ganze Oberfläche der Erde; und Gott bildete den Menschen aus dem Staube der Erde und hauchte in sein Antlitz den Odem des Lebens, und der Mensch ward zum lebenden Wesen“. Aus diesem Grunde wird auch von den meisten die Unsterblichkeit der Seele behauptet. Nach der Erschaffung des Menschen suchte ihm Gott einen Wohnort aus in den Gegenden gegen Morgen, ausgezeichnet durch Licht, von hellerer Luft durchströmt, voll der herrlichsten Früchte, und dahin setzte er den Menschen.</p><p>Den Wortlaut der hl. Geschichte hat die Schrift in folgender Weise: „Und Gott pflanzte einen Lustgarten in Eden gegen Morgen und setzte darein den Menschen, den er gebildet hatte. Und Gott brachte aus dem Boden hervor allerlei Bäume, schön zu schauen und lieblich zu essen; auch den Baum des Lebens in der Mitte des Gartens und den Baum der Erkenntnis des Guten und Bösen. Und ein Fluß ging aus vom Lustort, zu bewässern den Garten. Von dort an teilt er sich in vier Hauptströme. Der Name des einen ist Phison; dieser ists, der umfließt das ganze Land Evilat; dort also ist das Gold; das Gold dieses Landes ist sehr gut; da findet man auch Bdellium und den Stein Onyx. Und der Name des andern Flusses ist Geon. Dieser umfließt das ganze Land Äthiopien. Und der dritte Fluß ist der Tigris; der geht nach Assyrien. Der vierte Fluß ist der Euphrat. Und es nahm Gott, der Herr, den Menschen und setzte ihn in den Lustgarten, auf daß er ihn bebaue und bewahre. Und Gott gebot dem Adam und sprach: Von jedem Baum im Garten magst du essen, aber vom Baume der Erkenntnis des Guten und Bösen sollt ihr nicht essen; an welchem Tage aber ihr davon esset, werdet ihr des Todes sterben. Auch sprach Gott der Herr: Es ist nicht gut für den Menschen, daß er allein sei; lasset uns ihm eine Gehilfin machen, die ihm ähnlich sei. Und Gott bildete aus Erde ferner noch alle Tiere des Feldes und alles Geflügel des Himmels und führte sie zu Adam; und wie sie – jedes lebende Wesen – Adam nannte, das ist jedesmal ihr Name. Und Adam nannte mit Namen alles Vieh, alles Geflügel des Himmels und alle Tiere des Feldes. Aber für Adam fand sich keine Gehilfin, die ihm ähnlich war. Und Gott ließ Bewußtlosigkeit über Adam kommen und ihn einschlafen und nahm eine von seinen Rippen und füllte ihre Stelle mit Fleisch aus. Und Gott der Herr baute aus der Rippe, die er von Adam genommen, ein Weib und führte es zu Adam. Und Adam sprach: Das ist nun Bein von meinem Gebein und Fleisch von meinem Fleisch; die soll Männin heißen, weil sie von ihrem Manne genommen ist. Darum wird der Mann seinen Vater und seine Mutter verlassen und seinem Weibe anhangen, und es werden Zwei zu<em>einem</em> Fleische werden. Und es waren beide nackt, Adam und sein Weib, und schämten sich nicht.“</p><p>„Aber die Schlange war klüger als alle Tiere auf der Erde, die Gott der Herr gemacht hatte. Und die Schlange sprach zum Weibe: Warum hat euch Gott geboten, ihr solltet nicht von allen Bäumen des Gartens essen? Und das Weib sagte zur Schlange: Von allen Bäumen des Garten dürfen wir essen, von der Frucht des Baumes aber, der in der Mitte des Gartens ist, hat uns Gott geboten, daß wir nicht davon essen, ihn auch nicht berühren, damit wir nicht sterben. Und die Schlange sprach zum Weibe: Ihr werdet nicht des Todes sterben; Gott wußte nämlich, daß, an welchem Tage ihr davon esset, euere Augen sich auftun und ihr wie Götter sein werdet, erkennend Gutes und Böses. Da sah das Weib, daß der Baum gut für das Essen und schön für das Auge und lieblich anzuschauen, und nahm von seiner Frucht und aß und gab auch ihrem Manne, und sie aßen. Da wurden beiden die Augen aufgetan und sie merkten, daß sie nackt waren; und sie nähten Feigenblätter zusammen und machten sich Schürzen. Und sie hörten die Stimme Gottes, des Herrn, der nach Mittag im Garten wandelte, und Adam und sein Weib verbargen sich vor dem Angesichte Gottes mitten unter den Bäumen des Gartens. Und Gott der Herr rief den Adam und sprach zu ihm: Wo bist du? Der sprach: Ich habe deine Stimme im Garten gehört und mich gefürchtet, weil ich nackt bin, und habe mich verborgen. Und (Gott) sagte zu ihm: Wer hat dir denn gesagt, daß du nackt bist, als weil du von dem Baume gegessen, wovon ich dir allein geboten nicht zu essen? Und Adam sprach: Das Weib, das du mir gegeben hast, sie hat mir vom Baum gegeben und ich aß. Und Gott sprach zum Weibe: Warum hast du das getan? Und das Weib erwiderte: Die Schlange hat mich betrogen, und ich aß. Und Gott der Herr sprach zu der Schlange: Weil du dies getan hast, bist du verflucht unter allen Tieren auf der Erde; auf deiner Brust und deinem Bauche sollst du gehen und Erde fressen alle Tage deines Lebens. Und ich will Feindschaft setzen zwischen dir und dem Weibe, zwischen deinem und ihrem Samen; er wird dir den Kopf zertreten und du wirst seiner Ferse lauernd nachstellen. Und zum Weibe sprach er: Ich will deine Schmerzen und deine Wehen vervielfältigen; in Schmerzen sollst du Kinder gebären, und zum Manne soll dein Hinwenden sein, und er wird über dich herrschen. Zu Adam aber sprach er: Weil du Gehör gegeben der Stimme deines Weibes und gegessen hast vom Baume, von dem ich dir geboten habe, daß du von ihm allein nicht essest, so sei die Erde verflucht in deinem Werke; in Schmerzen sollst du von ihr essen alle Tage deines Lebens; Dornen und Disteln soll sie dir tragen, und du sollst das Kraut deines Feldes essen. Im Schweiße deines Angesichtes sollst du dein Brot essen, bis du zur Erde wiederkehrest, von der du genommen bist; denn du bist Erde und sollst zur Erde wiederkehren“. So also lauten die Worte der Hl. Schrift von der Geschichte des Menschen und des Paradieses.</p><p>Du wirst mir nun einwerfen: „Du behauptest, es gehe nicht an, daß Gott im Raume eingeschlossen (gedacht) werde; und wie kannst du jetzt sagen, daß er im Paradiese umherwandelte? Höre, was ich erwidere! Gott, der Vater aller Wesen, ist unbegrenzbar und befindet sich in keinem Raum; denn „es gibt keine Stätte seiner Ruhe“. Sein Wort aber, durch welches er alles gemacht hat, das da ist seine Kraft und seine Weisheit, übernahm die Stelle des Vaters und Herrn aller Dinge, und dieses ist es, das an der Stelle Gottes im Paradiese erschien und mit Adam redete. Denn auch die Hl. Schrift belehrt uns, daß Adam sagte, er habe<em>die Stimme</em> gehört. Was ist aber die Stimme anderes als das Wort Gottes, welches auch sein Sohn ist? nicht auf die Weise, wie die Dichter und Mythographen die Söhne der Götter erzeugt werden lassen, durch fleischliche Vermischung, sondern so, wie die Wahrheit das Wort darstellt, als ewig im Herzen Gottes beschlossen. Denn bevor irgend etwas erschaffen wurde, hatte er dieses zum Ratgeber, da es sein eigener Gedanke und seine Weisheit ist. Als aber Gott die Dinge alle, die er zu erschaffen beschlossen hatte, erschaffen wollte, da erzeugte er dieses Wort als ausgesprochenes, den Erstgeborenen jeglicher Kreatur, nicht, daß er dieses Wortes verlustig wurde, sondern so, daß er es zeugte und in Ewigkeit mit seinem Worte beisammenblieb. Darauf fußt auch die Lehre der hl. Schriften und der mit dem Geist Gottes erfüllten Männer, von denen einer, Johannes, sagt: „Im Anfang war das Wort, und das Wort war bei Gott“, womit er ausspricht, daß im Anfang nur Gott und das Wort in ihm da war. Hierauf sagt er: „Und Gott war das Wort; alles ist durch ihn gemacht“. Das Wort ist also Gott und von Gott gezeugt. Und dies Wort schickt der Vater des Alls, wenn er will, nach irgendeinem Platze im Raum, und vom Vater geschickt erscheint es dort, wird gesehen und gehört und befindet sich so im Raume.</p><p>Am sechsten Tage also schuf Gott den Menschen; seine Schöpfung offenbarte er aber erst am siebenten Tage, als er auch das Paradies geschaffen hatte, damit der Mensch an einem besseren und einem hervorragenden Orte wohne. Und daß obige Erzählung wahr ist, zeigt die Wirklichkeit. Denn weiß nicht jeder von den Wehen, welche die Weiber beim Gebären zu überstehen haben, und daß sie gleich darauf die Qualen wieder vergessen, damit das Wort Gottes, daß das Menschengeschlecht wachsen und sich mehren soll, erfüllt werde? (Sieht ferner nicht jedermann) die Verurteilung der Schlange, wie häßlich sie auf dem Bauche kriecht und Erde frißt, auf daß auch dies uns zum Beweise diente?</p><p>Gott hatte also aus der Erde hervorsprossen lassen jeglichen Baum, lieblich zu schauen und gut zum Essen. Anfänglich nämlich waren bloß die am dritten Tage erschaffenen Pflanzen und Samen und Kräuter vorhanden. Die Gewächse im Paradiese aber wurden mit ausgezeichneter Schönheit und größtem Wohlgeschmacke erschaffen, da dieses ja auch eine von Gott gemachte Pflanzung genannt ist. Und zwar besaß die übrigen Pflanzen auch die Erde von gleicher Art, die zwei Bäume aber, den des Lebens und den der Erkenntnis, hatte die übrige Erde nicht, sondern diese befanden sich einzig im Paradies. Daß aber das Paradies zur Erde gehört habe und auf der Erde gepflanzt war, sagt die Hl. Schrift „Und Gott pflanzte das Paradies in Eden gegen Morgen und setzte den Menschen dahin; und Gott ließ hervorsprießen aus der Erde jeglichen Baum, lieblich zum Ansehen und gut zum Essen“. Durch die Worte also „aus der Erde“ und „gegen Morgen“ lehrt uns die Hl. Schrift deutlich, daß das Paradies unter diesem Himmel sich befunden habe, unter welchem die Erde und der Morgen sich befindet. Das hebräische Wort<em>Eden</em> aber bedeutet Wonne. Ferner gibt sie an, daß ein Fluß von Eden ausging, um das Paradies zu bewässern und sich von dort in vier Hauptströme teilte, von denen zwei, genannt Phison und Geon, die östlichen Gegenden bewässern, namentlich der Geon, der das ganze Land Äthiopien umfließt und in Ägypten unter dem Namen Nil wieder zutage kommen soll. Die anderen zwei Flüsse sind bei uns wohlbekannt, der Euphrat und Tigris nämlich; denn diese befinden sich in unmittelbarer Nachbarschaft unseres Landes. Als nun Gott den Menschen, wie gesagt, ins Paradies gesetzt, um es zu bebauen und zu bewachen, gebot er ihm von allen Früchten zu essen, offenbar auch vorn Baume des Lebens; nur vom Baume der Erkenntnis gebot er ihm, nicht zu kosten. Gott versetzte ihn aber von der Erde weg, aus der er war gemacht worden, ins Paradies und gab ihm den Antrieb zur Weiterbildung, damit er dort fortschreite und vollkommen werde, ja sogar als Gott bezeichnet und im Besitz ewigen Lebens zum Himmel hinaufsteige. Der Mensch war nämlich als Mittelding erschaffen, weder als bestimmt sterblich noch als bestimmt unsterblich, sondern fähig für beides. So stand auch sein Wohnort, das Paradies, in Bezug auf Schönheit, zwischen Himmel und Erde in der Mitte. Der Ausdruck „um es zu bebauen“ aber bedeutet keine andere Tätigkeit als die, das Gebot Gottes zu beobachten, damit er nicht durch Ungehorsam sich ins Verderben stürze, wie er es wirklich durch die Sünde getan hat.</p><p>Der Baum der Erkenntnis selbst war gut, und auch seine Frucht war gut. Es brachte nämlich nicht, wie einige meinen, der Baum den Tod, sondern der Ungehorsam. Denn in der Frucht war nichts anderes, als nur die Erkenntnis. Die Erkenntnis aber ist gut, wenn man sie auf rechte Weise benützt. Adam dort aber war seinem dermaligen Alter nach noch ein Kind, deswegen konnte er die Erkenntnis noch nicht nach Gebühr fassen. Denn auch jetzt ist es so: wenn das Kind geboren wird, ist es nicht sofort imstande, Brot zu essen, sondern es wird zuerst mit Milch genährt und geht erst mit fortschreitendem Alter auch zur festen Nahrung über. So war es wohl auch bei Adam. Deswegen hatte ihm Gott nicht etwa aus Neid, wie manche meinen, vom Baume der Erkenntnis zu essen verboten. Ferner wollte er ihn auch prüfen, ob er seinem Gebote gehorchen werde. Zugleich auch wollte er, daß der Mensch in seinem Kindesalter noch für längere Zeit in argloser Einfalt verbleibe. Denn es ist dies nicht bloß vor Gott, sondern auch bei den Menschen etwas Heiliges, in Einfalt und Arglosigkeit den Eltern untertan zu sein. Wenn es aber Pflicht ist, daß die Kinder den Eltern untertan sind, um wieviel mehr muß dies Gott dem Vater des Alls gegenüber geschehen? Ferner ist es auch unschön, wenn kleine Kinder über ihr Alter hinaus altklug sind. Denn wie man an Alter stufenweise wächst, so wächst man auch in der Erkenntnis. Zudem ist, wenn das Gesetz gebietet, sich eines Dinges zu enthalten, und jemand nicht gehorcht, klar, daß nicht das Gesetz an der Züchtigung Schuld ist, sondern der grobe Ungehorsam. Denn auch ein Vater befiehlt seinem Kinde manchmal, sich gewisser Dinge zu enthalten, und wenn dies dem väterlichen Gebote nicht gehorcht, so wird es derb gezüchtigt und ausgescholten wegen seines Ungehorsams. Und es sind nicht gleich die Handlungen die Ursache der Schläge, sondern der Ungehorsam ist es, der dem Ungehorsamen die empfindliche Züchtigung einbringt. So brachte auch dem Ersterschaffenen sein Ungehorsam die Strafe, daß er aus dem Paradiese vertrieben wurde. Nicht als ob der Baum der Erkenntnis etwas Böses an sich gehabt hätte, sondern durch seinen Ungehorsam hatte der Mensch nun Mühsal, Plage, Schmerz zu erdulden und fiel zuletzt dem Tode anheim.</p><p>Und zwar ist der Tod auch noch eine große Wohltat, die Gott dem Menschen erwiesen hat, auf daß er nicht in der Sünde befindlich ewig lebte; sondern er verwies ihn sozusagen in eine Art Verbannung aus dem Paradiese, damit er die Sünde in der ihm bestimmten Zeit durch die Strafe abbüße und dann gebessert später wieder zurückgerufen würde. Deswegen steht auch in der Hl. Schrift, nachdem der Mensch auf dieser Welt erschaffen war, mit geheimnisvoller Bedeutung, daß er zweimal ins Paradies versetzt worden sei; das erstemal, als er dorthin versetzt wurde, das zweite Mal soll es sich erfüllen nach der Auferstehung und dem Gerichte. Ja noch weiter! gleichwie ein Geschirr wenn es nach der ersten Verfertigung einen Fehler hat, umgegossen und umgebildet wird, so daß es wieder neu und ganz wird, so geschieht auch dem Menschen durch den Tod. Denn er wird sozusagen zerschlagen, um bei der Auferstehung wieder ganz zu erscheinen, d. h. fleckenlos, gerecht und unsterblich. Daß aber Gott sagte und rief: Adam, wo bist du? so tat er dies nicht, weil er es nicht wußte, sondern er wollte ihm in seiner Langmut damit Veranlassung zur Reue und zum Bekenntnisse geben.</p><p>Nun wird man mir aber sagen: „Der Mensch ist also sterblich von Natur aus erschaffen?“ Durchaus nicht! „Was denn? unsterblich?“ Auch das sagen wir nicht. “Also”, wird man sagen, „keines von beiden?“ Auch das sagen wir nicht. Der Mensch ist also von Natur weder sterblich noch unsterblich erschaffen. Denn hätte ihn Gott von Anfang an unsterblich erschaffen, so hätte er ihn zum Gotte gemacht; hinwiederum, wenn er ihn sterblich erschaffen hätte, so würde es scheinen, als ob Gott an seinem Tode schuld sei. Weder unsterblich also noch auch sterblich hat er ihn erschaffen, sondern, wie gesagt, fähig für beides, daß er, wenn er durch die Beobachtung des göttlichen Gebotes der Unsterblichkeit sich zuwendete, die Unsterblichkeit als Lohn von Gott empfing und ein Gott würde, hinwiederum aber, wenn er durch Ungehorsam gegen Gott sich auf Seite des Todes stellte, selbst die Ursache seines Todes würde. Denn Gott hat den Menschen mit Freiheit und Selbstbestimmung begabt erschaffen. Was er sich nun durch seinen Leichtsinn und Ungehorsam zugezogen, das gibt ihm Gott jetzt seinerseits als Geschenk aus Liebe und Erbarmung, wenn sich der Mensch gehorsam unterwirft. Denn gleichwie der Mensch durch seinen Ungehorsam dem Tode hörig geworden ist, so kann durch Gehorsam gegen den Willen Gottes jeder, der will, sich das ewige Leben erwerben. Gott hat uns nämlich sein Gesetz und heiligen Gebote gegeben, auf daß durch deren Erfüllung ein jeder das Heil erlangen, zur Auferstehung gelangen und die Unverweslichkeit erben kann.</p><p>Als aber Adam aus dem Paradiese vertrieben war, erkannte er sein Weib Eva, das ihm Gott aus seiner Seite zum Weibe gebildet. Dies hatte Gott getan, nicht weil er das Weib nicht unmittelbar hätte bilden können, sondern weil er voraus wußte, daß die Menschen eine Menge Götter erfinden würden. Er sah also und wußte voraus, daß der Irrtum durch die Schlange eine Vielheit von Göttern, die nicht existieren, aufbringen würde; – denn während nur<em>ein</em> Gott ist, bemühte sich der Irrtum schon damals, eine Vielheit von Göttern dem Menschen ins Herz zu schmuggeln und zu sagen: „Ihr werdet sein wie die Götter!“ – damit nun nicht die Meinung entstünde, der eine Gott habe den Mann, ein zweiter das Weib erschaffen, deswegen schuf er sie nicht getrennt voneinander. Ja gerade damit dadurch das Geheimnis der Einzigkeit Gottes gezeigt würde, schuf Gott das Weib zugleich mit dem Manne; auch damit ihre gegenseitige Liebe größer sei.</p><p>Adam sagte nun zur Eva: Das ist jetzt Bein von meinem Bein und Fleisch von meinem Fleische, und prophezeite dann: „Deswegen wird der Mann Vater und Mutter verlassen und seinem Weibe anhängen, und es werden ihrer sein zwei zu einem Fleische“. Und dies erfüllt sich doch augenscheinlich auch bei uns. Denn wer, der in rechtmäßiger Ehe lebt, läßt nicht Vater und Mutter und seine ganze Verwandtschaft und Familie und hängt seinem Weibe in innigster Vereinigung an und liebt es mehr (als die Verwandten)? Deswegen unterziehen sich auch manche um ihrer Weiber willen selbst Lebensgefahren. Den Namen dieser Eva, weil sie zuerst von der Schlange verführt und die Chorführerin der Sünde wurde, ruft der böse Feind, der auch Satan heißt, und der damals durch die Schlange mit ihr gesprochen hat, bis auf die Jetztzeit noch bei seiner Tätigkeit in den von ihm begeisterten Menschen als Evan aus. Der Teufel heißt auch der Drache, weil er Gott wie ein flüchtiger Sklave entflohen ist [dia to apodedrakenai]<em>(διὰ τὸ ἀποδεδρακέναι)</em>; denn er war anfänglich ein Engel. Über ihn zu reden, würde zu weit führen; deswegen lasse ich jetzt die weitere Auseinandersetzung hierüber gut sein, da ich schon anderswo über ihn gesprochen habe.</p><p>Adam also erkannte sein Weib Eva, und sie empfing und gebar einen Sohn, mit Namen Kain. Und sie sprach: Ich habe einen Menschen durch Gott bekommen. Und abermal gebar sie einen Sohn, namens Abel. Dieser war der erste Schafhirt, Kain aber bebaute die Erde. Die Geschichte derselben nun würde eine zu große Ausführlichkeit, ja auch eine zu weit greifende Erklärung erfordern; deswegen kann der wißbegierige Leser sich über die Geschichte genauere Belehrung unmittelbar aus dem Buche erholen, das Genesis – die Entstehung der Welt – betitelt ist. Als nun der Satan sah, daß nicht bloß Adam und sein Weib am Leben blieben, sondern daß sie auch Kinder erzeugt hatten, da ergrimmte er vor Neid darüber, daß er sie nicht hatte ums Leben bringen können. Er stachelte daher, da er sah, daß Abel Gott wohlgefiel, ihren andern (Sohn), der Kain hieß, gegen seinen Bruder auf und brachte ihn dazu, daß er seinen Bruder tötete. Und dies war der Anfang, daß der Tod in diese Welt eingetreten und bis auf heute über das gesamte Menschengeschlecht gekommen ist. Gott wollte aber in seiner Erbarmung dem Kain eine Veranlassung zur Buße und zum Bekenntnisse geben und sprach daher zu ihm wie zu Adam: „Wo ist Abel, dein Bruder?“ Kain aber erwiderte Gott trotzig und sagte: „Ich weiß es nicht; ich bin doch nicht der Hüter meines Bruders?“ So erzürnte Gott über ihn und sagte: „Was hast du da getan? Die Stimme von deines Bruders Blut schreit zu mir von der Erde. Und jetzt sollst du verflucht sein von der Erde, die ihren Mund aufgetan, um das Blut deines Bruders von deiner Hand zu empfangen; jammernd und zitternd sollst du auf Erden wandeln”. Von dorther noch entsetzt, nimmt die Erde deswegen das Blut des Menschen, ja selbst das eines Tieres, nicht mehr in sich auf, wodurch klar wird, daß nicht sie schuld ist, sondern der frevelnde Mensch.</p><p>Kain also bekam auch einen Sohn, namens Enoch. Und er erbaute eine Stadt, die er nach dem Namen seines Sohnes Enoch nannte. Da ward der Anfang gemacht, Städte zu bauen, und zwar vor der Sintflut, nicht wie Homer fälschlich singt: „Noch war keine gebaut von den Städten der redenden Menschen.“ (Il. 20, 216.) Dem Enoch aber ward ein Sohn geboren, namens Gaidad; dieser zeugte den Meel, Meel den Mathusala, Mathusala den Lamech. Lamech aber nahm sich zwei Weiber, deren Namen Ada und Sela waren. Von da begann die Vielweiberei; es nahm aber auch die Musik von da ihren Anfang. Lamech nämlich hatte drei Söhne, Obel, Jubal, Thobel. Obel ward ein in Zelten wohnender Hirt, Jubal ist der Erfinder der Harfe und Zither, Thobel ward ein Schmied, mit dem Hammer Erz und Eisen bearbeitend. Bis hierher läßt sich das von Kain abstammende Geschlecht verfolgen; für die Folgezeit aber kam die Stammesgeschichte seines Samens in Vergessenheit wegen seines Brudermordes. Gott verlieh aber der Eva die Gnade, daß sie empfing und einen Sohn anstatt Abels gebar, der Seth hieß. Von diesem stammt das übrige Menschengeschlecht bis auf heute. Und wenn ein Wißbegieriger es wünscht so ist es leicht, ihm das Nähere, selbst über alle Geschlechter, mittelst der Hl. Schrift auseinanderzusetzen. Denn es ist von uns auch zum Teil schon in einem andern Buche, wie oben gesagt worden, die Reihenfolge der Abstammung behandelt worden, im ersten Buche über die Geschichte nämlich. Dies alles lehrt uns der Hl. Geist, der durch Moses und die übrigen Propheten spricht, so daß die bei uns, den Verehrern Gottes, vorhandenen Schriften älter sind und dazu auch als wahrer sich erweisen als die alter Geschichtsschreiber und Dichter. Auch für die Musik setzten einige eitle Schwätzer den Apollo als Erfinder an; andere sagen, Orpheus habe die Musik nach dem lieblichen Gesange der Vögel erfunden. Aber ihr Gerede zeigt sich als eitel und grundlos; denn diese Männer lebten viele Jahre nach der Sintflut. Die Geschichte des Noe, der bei einigen Deukalion heißt, ist von uns in dem Buche abgehandelt, das wir oben erwähnt haben; dies kannst auch du zur Hand nehmen, wenn du willst.</p><p>Nach der Sintflut entstanden allmählich wiederum Städte und Könige auf folgende Weise. Die erste Stadt war Babylon, und Orech und Archad und Chalone im Lande Sennaar. Und König derselben war Nebroth. Von diesen stammte Assur ab, von dem auch die Assyrier den Namen haben. Nebroth aber baute Städte: Ninive und Roboom und Kalak und Dasen zwischen Ninive und Kalak. Ninive aber wurde eine besonders große Stadt. Ein zweiter Sohn Sems, des Sohnes Noes, namens Misraim, erzeugte die Ludonim und die Enemigin und Labiim, die Nephthalim und Patrosiniim und Chasloniim, von denen die Philistiim stammen. Von den drei Söhnen Noes und von ihren Abkömmlingen und ihrer Stammtafel haben wir im oben besprochenen Buch ein kurzes Verzeichnis gegeben. Jetzt nun werden wir das Übergangene bezüglich der Städte und Könige und die Geschichte der Zeit erwähnen, als <em>eine</em> Zunge und<em>eine</em> Sprache war. Vor der Scheidung der Sprachen entstanden die obigen Städte. Als nun die Menschen sich voneinander trennen sollten, faßten sie aus ihrem, nicht durch Gottes Antrieb den Beschluß, eine Stadt und einen Turm zu bauen, dessen Spitze bis zum Himmel reichen sollte, um sich einen berühmten Namen zu machen. Da sie nun ein bedeutendes Werk wider den Plan Gottes zu unternehmen wagten, zerstörte ihnen Gott ihre Stadt und warf ihnen den Turm nieder. Und dann veränderte er die Sprachen der Menschen, indem er jedem eine abweichende Mundart gab. Die Sibylle hat die Sache folgenderweise angegeben, indem sie den Zorn Gottes, der über die Welt kommen sollte, ankündigt wie folgt: „Wenn sich aber erfüllen die Drohungen Gottes des Höchsten, Die er den Menschen gemacht, als einst im assyrischen Lande Diese gebauet den Turm. Einsprachig noch waren sie alle; Und sie wollten ersteigen den sternbesäeten Himmel. Durch Sturmwinde sofort schickt Gott das gewalt’ge Verderben: Diese zerwarfen sodann das Gebäu von der schwindelnden Höhe, Hetzten zu heftigem Streite die Sterblichen gegeneinander. Doch als gefallen der Turm und die Sprachen der sterblichen Menschen Vielfach sich in Zweige geteilt“ usw.</p><p>Das also geschah im Lande der Chaldäer. Im Lande Chanaan aber entstand eine Stadt, namens Charan. Zur selben Zeit erhob sich auch in Ägypten der erste König, Pharao, der nach den Ägyptiern auch Nechaoth hieß, und so kamen der Reihe nach die folgenden Könige. Im Lande Senaar aber bei den sogenannten Chaldäern war der erste König Arioch, nach diesem ein anderer, Ellasar, und nach diesem Chodollagomor, König von Älam, nach diesem Thargal, König der Assyrier genannten Völker. Fünf andere Städte entstanden im Anteile des Cham, des Sohnes des Noe: die erste Sodoma, dann Gomorrha, Adama, Seboim und Balak, die auch Segor heißt. Und die Namen ihrer Könige sind folgende: Ballas, König von Sodoma, Barsas, König von Gomorrha, Senaar König von Adama, Hymor, König von Seboim, Balach, König von Segor, das auch Balak heißt. Diese waren dem König von Assyrien Chodollagomor zwölf Jahre lang unterworfen. Im dreizehnten Jahre aber fielen sie von Chodollagomor ab, und so kam es, daß damals die vier Könige der Assyrier gegen die fünf Könige Krieg anfingen. Dies war das erstemal, daß Kriege auf Erden entstanden. Und sie schlugen die Riesen Karanain und mächtige Völkerschaften mit ihnen und die Ommäer in deren eigener Stadt und die Chorräer im sogenannten Gebirge Seir bis zur sogenannten Terebinthe von Pharan, welches an der Wüste liegt. Zur nämlichen Zeit aber war ein gerechter König, mit Namen Melchisedek, in der Stadt Salem, die jetzt Hierosolyma heißt. Dieser war der erste Priester unter allen Priestern Gottes des Allerhöchsten. Von ihm erhielt die Stadt den Namen Hierusalem, die wir eben Hierosolyma genannt haben. Von ihm an findet man auch, daß Priester auf der ganzen Erde auftraten. Nach ihm trat Abimelech als König auf in Gerara, nach diesem ein anderer Abimelech; hierauf war König Ephron mit dem Beinamen der Chettäer.</p><p>Mit den Namen dieser Könige also, die zuerst auftraten, verhält es sich so. Bei den Assyriern aber wurden später die übrigen Könige im Verlaufe vieler Jahre nicht mehr verzeichnet; von den allerletzten Zeiten, den unsern nämlich, werden als Könige der Assyrier erwähnt Theglaphasar, nach ihm Selamanasar, hierauf Sennacherim. Ein Unterkönig von diesem war der Äthioper Adramalech, der auch über Ägypten herrschte. Freilich sind diese Dinge im Hinblick auf unsere Literatur durchaus so ziemlich neu.</p><p>Aus dem Folgenden nun mögen die Gelehrten und Altertumsforscher die Geschichte beurteilen, ob die von uns nach den hl. Propheten vorgebrachten Tatsachen neu sind. Während es damals in den ersten Zeiten nur wenige Menschen in Arabien und Chaldäa gab, fingen sie nach der Sprachentrennung allmählich an, zahlreich zu werden und sich zu vermehren auf der ganzen Erde. Und zwar wendeten sich die einen gegen Morgen, um dort sich niederzulassen, die andern nach den Teilen des großen Festlandes und gegen Norden, so daß sie sich in den nördlichen Himmelsstrichen bis nach Britannien ausbreiteten, andere nach Chananäa, das auch Judäa und Phönicien heißt; wieder andere nach den Teilen Äthiopiens, Ägyptens und Libyens und dem sogenannten verbrannten Landstrich (Innerafrika) und nach den Ländern, die bis zum Sonnenuntergang sich erstrecken; noch andere besetzten die Länder von der Meeresküste und von Pamphylien an, Asien, Griechenland, Macedonien und weiter Italien, die sogenannten Gallien, Spanien und Germanien, so daß jetzt die gesamte Erde von ihren Bewohnern erfüllt ist. Während also die Erde anfangs nur nach drei Seiten von den Menschen bewohnt wurde, nach Morgen, Mittag und Abend, wurden später auch die übrigen Teile derselben bevölkert, da die Zahl der Menschen ungeheuer anschwoll. Ohne nun diese Dinge zu wissen, wollen die Schriftsteller behaupten, die Erde sei kugelförmig, und wollen sie gleichsam mit einem Würfel vergleichen. Wie können sie aber diese Behauptung als Wahrheit hinstellen, während sie die Geschichte der Erschaffung und Bevölkerung der Erde nicht kennen? Indem die Menschen allmählich auf der Erde anwuchsen und sich vermehrten, wie wir gesagt haben, wurden auch die Inseln des Meeres und die übrigen Erdstriche bevölkert.</p><p>Wer also von den sogenannten Weisen, Dichtern und Geschichtsschreibern hätte hier das Richtige sagen können, da sie viel später lebten und eine Menge von Göttern einführten, die wieder so viele Jahre später als die Städte entstanden, lange nach den Königen, Völkern und Kriegen? Denn sie mußten alles erwähnen, die Ereignisse von der Sintflut, die Schöpfung der Welt, die Erschaffung des Menschen und die folgenden Ereignisse; das alles hätten die ägyptischen oder chaldäischen Propheten und die andern Schriftsteller genau darlegen müssen, wenn sie durch den göttlichen und reinen Geist gesprochen und ihre Aussprüche Wahrheit verkündet hätten; und nicht bloß das Vergangene oder Gegenwärtige, sondern auch die zukünftigen Schicksale der Welt hätten sie vorhersagen müssen. Deswegen ist klar, daß alle übrigen sich im Irrtume befinden, wir Christen allein aber die Wahrheit besitzen, die wir vom Hl. Geiste belehrt werden, der in den hl. Propheten gesprochen und alles vorherverkündet hat.</p><p>Und nun sei es für die Zukunft dein Bestreben, mit gutem Willen die göttlichen Dinge zu erforschen, ich meine die Aussprüche der Propheten, damit du an der Hand des von uns Gesagten und der Angaben der übrigen Schriftsteller zusammen die Wahrheit finden könntest. Was also die Namen der sogenannten Götter betrifft, so haben wir, wie ich oben auseinandergesetzt, schon aus den Schriften, die jene verfaßt haben, bewiesen, daß sich Namen von Menschen bei ihnen vorfinden. Ihre Bildnisse aber werden täglich bis auf den heutigen Tag verfertigt: Götzen, die Werke von Menschenhand verfertigt sind. Und diesen erweist der große Haufe der unverständigen Menschen göttliche Ehre; den Schöpfer und Bildner des Alls aber und den Erhalter jeglichen Odems setzen sie beiseite, törichten Lehren folgend, weil in Irrtum geführt durch den von den Vätern überkommenen unsinnigen Wahn. Gott aber, der Vater und Schöpfer des Alls, hat das Menschengeschlecht nicht verlassen, sondern ihm sein Gesetz gegeben und heilige Propheten geschickt, um dem Menschengeschlechte Kunde und Belehrung zu bringen, auf daß ein jeder von uns sich ernüchtere und erkenne, daß nur<em>ein</em> Gott sei. Diese lehrten auch, daß man sich enthalten müsse vom sündhaften Götzendienste, vom Ehebruch, Totschlag, Hurerei, Diebstahl, Geiz, Meineid, von aller Ausgelassenheit und Uneinigkeit; daß der Mensch alles, was er nicht will, daß es ihm geschehe, auch einem andern nicht tue, und daß so der gerecht Handelnde den ewigen Strafen entgehe und des ewigen Lebens durch Gott gewürdigt werde.</p><p>Das göttliche Gesetz also verbietet nicht bloß, die Götzenbilder, sondern auch die Himmelskörper, Sonne, Mond und die übrigen Gestirne, anzubeten, ebenso dem Himmel, der Erde, dem Meere oder den Quellen oder Flüssen göttliche Ehre zu erweisen, sondern nur dem wahren Gott und Schöpfer des Alls darf man göttliche Ehre erweisen in Heiligkeit des Herzens und aufrichtiger Gesinnung. Deswegen sagt das hl, Gesetz: „Du sollst nicht ehebrechen, nicht töten, nicht stehlen, kein falsches Zeugnis geben, nicht begehren deines Nächsten Frau“. In gleicher Weise auch die Propheten. Salomon lehrt uns, auch nicht durch einen Blick mit den Augen zu sündigen, indem er sagt: „Deine Augen sollen gerade schauen, deine Augenlider Gerechtes winken“. Und Moses, ebenfalls ein Prophet, sagt über die Einzigkeit Gottes: „Dies ist euer Gott, der den Himmel festigt und die Erde gründet, dessen Hände die ganze Heerschar des Himmels haben erscheinen lassen, aber sie euch nicht haben erscheinen lassen, damit ihr ihnen als Göttern anhanget“. Isaias sagt wiederum: „So spricht Gott der Herr, der den Himmel gefestigt und die Erde grundgelegt und das, was in ihr ist, und der Odem gibt dem Volke auf ihr und Atem denen, die auf ihr wandeln; dies ist der Herr, euer Gott”. Und wiederum (spricht Gott) durch denselben: „Ich bin es, der den Himmel und die Erde gemacht und den Menschen auf ihr;<em>ich</em> habe mit meiner Hand den Himmel gefestigt“. Und an einer andern Stelle: „Dies ist euer Gott, der die Grenzen der Erde errichtet; er wird nicht hungrig noch müde werden, und unergründlich ist seine Weisheit“. Auf gleiche Weise sagt auch Jeremias: „Der die Erde gemacht hat in seiner Kraft und den Erdkreis aufgerichtet in seiner Weisheit, und den Himmel ausgespannt in seiner Klugheit, und des Wassers Menge am Himmel, und der die Wolken herbeigeführt von den Enden der Erde, die Blitze zu Regen gemacht, und die Winde hervorgeführt aus seinen Schatzkammern“. Hier wird ersichtlich, wie so ganz übereinstimmend alle Propheten sich aussprachen, da sie ja in einem und demselben Geiste redeten von der Einzigkeit Gottes, von der Entstehung der Welt und der Erschaffung des Menschen. Dazu auch jammerten sie voll Leidwesen über das gottlose Menschengeschlecht und machten die, welche da sich weise dünkten, wegen ihres Irrtums und ihrer Herzenshärte zuschanden. So sagt Jeremias: „Jeder Mensch ist Tor geworden mit seiner Wissenschaft, jeder Goldschmied ist zuschanden geworden mit seinen Gebilden; umsonst verfertigt der Silberschmied seine Werke aus Silber, es ist kein Atem in ihnen, am Tage ihrer Heimsuchung werden sie vertilgt werden“. Das nämlich sagt auch David: „Verderbt sind sie und abscheulich in ihren Anschlägen; keiner ist, der Gutes tut, auch nicht einer; alle sind abgewichen, allsamt unnütz geworden“. Auf gleiche Weise sagt auch Habakuk: „Was nützt dem Menschen das Bild, daß er es geschnitzt als falschen Schein? Wehe dem, der zum Steine sagt: Wach auf! und zum Holze: Erhebe dich!“ Auf gleiche Weise sprachen auch die übrigen Propheten der Wahrheit. Und wozu soll ich die Menge der Propheten noch anführen, deren viele sind, und die unzählige Aussprüche getan haben, die im schönsten Einklange miteinander stehen? Denn jeder, der will, kann ihre Worte finden und daraus genau die Wahrheit kennen lernen, um sich nicht durch Wahn und durch eitle gelehrte Grübelei betören zu lassen. Diese Männer also, die wir erwähnt haben, waren Propheten bei den Hebräern, Männer ohne Wissenschaft, Hirten und ungebildete Leute.</p><p>Die Sibylle aber, die Prophetin bei den Griechen und den übrigen Völkern, schleudert am Anfang ihrer Prophetie gegen das Menschengeschlecht folgende Worte: „Sterbliche Menschen, gebildet aus Fleisch, ganz nichtigen Wesens, Wie so schnelle erhebet ihr euch, nicht denkend ans Ende! Fürchtet und zittert ihr nicht vor Gott, der immer euch zusieht? Der allwissend auch alles erschauet und Zeug’ ist von allem, Als allnährender Schöpfer den lieblichen Odem auf alle Niedergesendet und ihn als Führer der Menschen bestellt hat. Gott ist nur Einer, er Herrscher allein, der Ewige, Größte, Alles beherrschend und, selbst unsichtbar, alles erschauend. Nimmer vermag all sterbliches Fleisch ihn selbst zu erblicken; Denn wie vermöchte das Fleisch wohl jemals den himmlischen, wahren, Ewigen Gott, der den Himmel bewohnt, mit Augen zu schauen? Da ja die Menschen sogar nicht vermögen den Strahlen der Sonne Unentwegt entgegenzuschauen, die sterblich gebor’nen Männer, zusammengesetzt aus Gebein, aus Fleisch und Geäder. Ehret den einzigen wirklichen Gott, der der Lenker des Weltalls Einzig von Ewigkeit ist, und in Ewigkeit herrscht und regieret, Selbererzeugt und anfangslos und alles beherrschend, Alle die Sterblichen richtend im alles erleuchtenden Lichte, Würd’ge Vergeltung sodann wird euch für die schlechte Gesinnung, Daß ihr beiseite gesetzt, zu verehren den ewigen, wahren Gott und zu bringen nur ihm die heiligen Gaben des Opfers, Doch sie Dämonen gebracht, den Bewohnern der Räume des Hades. Doch ihr wandelt in Stolz und Wahnwitz; habt den geraden Richtigen Weg abirrend verlassen und ginget den Irrpfad Hin durch Dornengestrüpp und Verhaue. O lasset, ihr Toren, In lichtloser und finsterer Nacht, und im Dunkel zu schweifen; Endlich entfliehet dem Dunkel der Nacht und erfasset den Lichtglanz! Sehet, er strahlet so hell und nicht zu verkennen für alle. Kommet und wandelt nicht stets im Dunkel des finsteren Irrtums, Sehet, es glänzet so hell, mildblickend das Auge der Sonne. Pflanzet euch Weisheit ins Herz und fasset die rechte Erkenntnis! Ein Gott ist, der das Naß, der die Winde, das Beben der Erde, Blitze und Nöten des Hungers und Pest und traurige Plagen, Schneegestöber und Eis uns schickt – und was sonst noch zu nennen, Er ist Gebieter des Himmels und Herrscher der Erde, nur<em>er</em> ist.“</p><p>Und von den Göttern, die erst entstanden sein sollen, sagt die Sibylle: „Da stets wieder vergeht, was entstanden, so leitet den Ursprung Nimmer ein Gott aus den Lenden des Manns lind dem Schoße der Mutter, Ein Gott ist nur allein, der Erhabenste, der da erschaffen Himmel und Sonne und alles Gestirn und die Leuchte des Mondes Und die mit Früchten beladene Erde, die Wogen des Meeres, Berge mit ragender Höhe und stets fortfließende Quellen; Der da im Wasser erzeugt des Getiers unzählige Menge, Der, was zu Lande sich regt und kreucht, mit Odem belebet; Der da den hellen Gesang und das traute Gezwitscher der Vögel Schuf, die mit buntem Gefieder die Luft lautrauschend durchschneiden; Wies in dem Tal des Gebirgs den wilderen Tieren den Wohnplatz, Gab all zahmeres Vieh zum Dienste des sterblichen Menschen. Allen bestimmte er diesen zum Herrn, den er selber gebildet; Tausenderlei unzählige Dinge erkennen die Herrschaft; Wer von den Menschen vermöchte es wohl, sie alle zu kennen? Einer nur kennt sie allein, der alle erschaffen im Anfang, Er, der da ohne Veränd’rung, der ewige Schöpfer, den Äther bewohnet, Guten noch besseren Lohn zur Vergeltung als Richter bestimmend, Doch gar grimmigen Zorn für Böse und Über des Unrechts, Krieg und Pest und bitteres Weh zur Strafe erregend. Menschen, warum doch bäumt ihr euch so, bis entwurzelt ihr hinstürzt? Schämet euch doch, Krokodil und Katzen als Götter zu ehren! Hat da nicht Tollheit und Wut euch die Klarheit des Geistes getrübet, Wenn euch die Götter die Schüsseln bestehlen, die Töpfe berauben? Statt im himmlischen Glanz ihm zu geben den herrlichen Wohnsitz, Gabt ihr dem Gott wurmstichiges Bild, von der Spinne umzogen. Betet ihr, Törichte, doch auch die Schlange, die Katze, den Hund an, Ehret die Vögel der Luft und die kriechenden Tiere der Erde, Bilder und Zeichen von Stein, von menschlichen Händen verfertigt, Haufen von Steinen sogar auf den Straßen und andere Dinge Viele und nicht’ge – die Scham hält ab, sie zu nennen – verehrt ihr. Das sind Götter, Betrug für törichte Menschen bewirkend, Und Tod bringendes Gift in Wahrheit spritzet ihr Mund aus. Nur vor dem, der das Leben besitzt und ewiges Licht, der Freude den Menschen gewährt, der süßer als süßester Honig, Reichlichen Maßes sie schenkt: vor dem nur beuge den Nacken! Und im Verein mit frömmerer Zeit schlag’ besseren Weg ein! All das habt ihr versäumt und darum auch den Kelch des Gerichtes, Bis zum Rande gefüllt, voll Bitterkeit ohne Vermischung, Alle geschlürft im törichten Wahn und der Blindheit des Herzens. Und doch erwachet ihr nicht und kommt zu weis’rer Gesinnung, Wollt nicht erkennen den König, den Gott, der alles erschauet. Deshalb wird euch die Glut des verzehrenden Feuers erfassen, Und in lodernder Lohe in Ewigkeit werdet ihr brennen Täglich, vergehend vor Scham ob der falschen, der nichtigen Götter, Aber den treuen Verehrern des wahren und ewigen Gottes Wird zum Erbe das Leben, und ewiglich werden sie wohnen Im Paradies, in der wonnigen Lust wohlsprossendem Garten, Essend das Brot voll Süße vom sternbesäeten Himmel.“</p><p>Daß dies nun Dinge sind, die wahr, nützlich, gerecht und für alle Menschen gut gemeint sind, ist klar, wie auch, daß alle Missetäter nach dem Verdienste ihrer Handlungen Strafe zu erwarten haben.</p><p>Schon einige Dichter haben dieses ausgesprochen, gleichsam als Urteil gegen sich selbst und zum Zeugnis gegen diejenigen, welche Unrecht tun, indem sie sagen, daß diese gestraft werden würden. Äschylus sagt: „Wer Übles tut, der muß es auch leiden.“</p><p>Pindar sagt ebenfalls: „Da ja, Die Böses getan, es büßen müssen.“</p><p>Ebenso sagt Euripides: „Erfährst du Übles, duld es; freudig ja tat’st du’s; Gesetz ist’s, Übel dem Feind, wo du ihn triffst, zu tun.“</p><p>Und wiederum sagt derselbe: „Den Feinden Böses tun, halt ich für Mannes Pflicht.“</p><p>In gleicher Weise Archilochus: „Eines weiß ich, Wichtiges: Dem, der uns Übles tut, das Ärgste zum Entgelt zu tun.“</p><p>Und über die Wahrheit, daß Gott alles sieht und nichts ihm verborgen ist, daß er aber in seiner Langmut zuwartet, bis er ins Gericht geht, auch darüber sagt Dionysus: „Der Dike Auge schaut mit ruh’gem Blick umher, Doch sieht er alles stets im gleichem Maß.“</p><p>Und daß das Gericht Gottes kommen und das Wehe über die Schlechten plötzlich hereinbrechen werde, hat Äschylus angedeutet mit den Worten: „Mit schnellem Schritt tritt das Weh den Sterblichen an, Wer immer nur durch Frevel je das Recht verletzt. Du siehst die Dike nahen, lautlos, ungeseh’n Vom Schläfer, Wand’rer, und vom sorglos Sitzenden. Bald tritt sie gleich quer in den Weg, bald später auch. Nicht hüllt die Nacht den schlimmen Übeltäter ein, Und, was du Übles tust, o glaub mir, Einer sieht’s.“</p><p>Sagt nicht auch Simonides: „Kein Unglück erfolgt Für Menschen unerwartet; in geringer Zeit Stürzet die Gottheit alles um.“</p><p>Wiederum sagt Euripides „Nie ist das prunkende Glück und des Schlechten behäbiger Wohlstand Für dauernd anzuseh’n, noch auch Gottloser Menschen Geschlecht; denn die ungezeugte Zeit Bringt der Menschen Schlechtigkeit ans Licht.“</p><p>Ferner Euripides: „Denn die Gottheit ist bewußtlos nicht, sie kennt gar wohl die Eide, Die mit Frevel sind geschworen, oder die der Zwang erpresset.“ (Iphig. in Aul. V 396 flg.)</p><p>Und Sophokles: „Hast Schlimmes du geboten, mußt du’s leiden auch.“</p><p>Daß also Gott über einen falschen Eid oder welches Verbrechen immer dereinst zu Gericht sitzen wird, haben auch diese Männer vorausgesagt; ebenso haben sie über die Zerstörung der Welt durch Feuer mit oder wider Willen ähnliches wie die Propheten gesagt; freilich waren sie später als jene und haben ihre Kenntnis aus dem Gesetze und den Propheten entlehnt.</p><p>Und was liegt denn daran, ob sie früher oder später lebten? Wenigstens haben sie das gleiche ausgesprochen wie die Propheten. Über die Zerstörung der Welt durch das Feuer also sagt der Prophet Malachias; „Siehe, es kommt der Tag des Herrn wie ein brennender Ofen und wird in Flammen setzen alle Gottlosen“. Und Isaias: „Kommen wird der Zorn Gottes wie heftig niederstürzender Hagel und wie in der Schlucht hinbrausendes Wasser“. Also haben die Sibylle und die andern Propheten, ja auch die Dichter und Philosophen über die Gerechtigkeit, das Gericht und die Strafe Gottes sich deutlich ausgesprochen; ebenso haben sie auch über die Vorsehung, daß nämlich Gott fürsorge nicht bloß für die Lebenden, sondern auch für die Toten, gesprochen, wenn auch wider Willen; sie sahen sich nämlich durch die Wahrheit dazu gezwungen. Und zwar hat unter den Propheten Salomon über die Verstorbenen also gesprochen: „Es wird Genesung kommen für das Fleisch und Heilung für das Gebein“. Das nämliche sagt auch David: „Es werden frohlocken die gedemütigten Gebeine“. Hiermit stimmt auch der Spruch des Timokles überein: „Für die Verstorbenen ist Erbarmen beim gnädigen Gotte.“</p><p>Es kamen also die Schriftsteller, wenn sie auch von einer Vielheit von Göttern redeten, doch auf einen einzigen Gott, und wenn sie auch das Nichtvorhandensein einer Vorsehung behaupteten, so taten sie doch Aussprüche über die Vorsehung, und wenn sie auch den Eintritt des Gerichtes leugneten, so sprachen sie doch einhellig von demselben; und diejenigen, die da leugneten, daß nach dem Tode eine Empfindung verbleibe, gaben dies doch wieder zu. Homer nämlich, nachdem er gesagt hat: „Gleichwie ein nichtiger Traum in Nichts ist die Seele entflogen.“ (Od. XI. 221.)</p><p>sagt an einer andern Stelle: „Und aus den Gliedern entfloh ihm die Seele zum Hades hinunter.“ (Il. XVI. 856.)</p><p>und wiederum: „Schleunigst begrab’ mich, so werd’ ich die Tore des Hades betreten.“ (Il. XXIII. 71.)</p><p>In Betreff der übrigen Schriftsteller aber, die du gelesen hast, glaube ich, daß du genau weißt, wie sie sich ausgesprochen haben. Alle diese Dinge aber wird jeder verstehen, der die Weisheit Gottes sucht, und der ihm durch Glaube, Gerechtigkeit und gute Werke zu gefallen strebt. Es sagt nämlich einer von den obenerwähnten Propheten, namens Osee: „Wer ist weise? und er wird dies verstehen; wer klug? und er wird es erkennen. Denn gerade sind die Wege des Herrn, und die Gerechten werden wandeln darauf und die Gottlosen darauf kraftlos sein“. Wer nun ein Freund der Wissenschaft ist, muß auch eifrig trachten, sie zu erlernen. Suche also häufiger mit mir zusammenzukommen, damit du auch von Mund zu Mund mich hörest und so die Wahrheit genau kennen lernst.</p><h2>3</h2><p>Theophilus dem Autolykus seinen Gruß! Die Schriftsteller schreiben gerne eine Menge von Büchern zusammen, um eitlen Ruhm zu erwerben; die einen über Götter, Kriege oder Chronologie, einige andere auch über nutzlose Fabeln und anderes eitles Gerede, womit auch du dich bis jetzt abgegeben hast. Doch bist du noch nicht müde, dich damit abzuplagen, sondern trotz unserer Unterredungen hältst du die Rede der Wahrheit noch für eitles Geschwätz, indem du unsere (hl.) Schriften für eine ganz neue Erfindung ansiehst. Deshalb will auch ich nicht anstehen, dir unter Gottes Beistand in Kürze die Beweise für das Altertum unserer Schriften darzulegen und dir ein kurzes Gedenkblatt zu liefern, damit es dich nicht verdrieße, dasselbe zu Hand zu nehmen, und du so das törichte Gerede der übrigen Schriftsteller erkennest.</p><p>Die Dinge nämlich, worüber die Schriftsteller so sichere Behauptungen aufstellen, müßten sie entweder selbst mit Augen gesehen, oder von solchen, die sie gesehen, mit Zuverlässigkeit gehört haben. Denn Schriftsteller, die Ungewisses schreiben, führen sozusagen Streiche in die Luft. Denn was half es dem Homer, daß er den Ilischen Krieg besang und damit viele anlog, oder dem Hesiod sein genealogisches Verzeichnis der von ihm so genannten Götter, oder dem Orpheus seine 365 Götter, die er am Ende seines Lebens selbst wieder leugnet, indem er in seinem Testamente sagt, es sei nur Ein Gott? Was hatte Aratus von seiner Darstellung des Erdenrundes als kugelförmig, oder diejenigen Schriftsteller, die ähnliche Sätze aufstellten wie er, als nur den Ruhm bei den Menschen, den sie selbst wieder nicht einmal verdient haben? Was haben sie doch Wahres gesagt? Was haben dem Euripides, dem Sophokles und den andern Tragikern ihre Tragödien geholfen, oder dem Menander, Aristophanes und den übrigen Komikern ihre Komödien, oder dem Herodot oder Thukydides ihre Geschichtswerke, dem Pythagoras die Geheimnisse (der Ägyptier) und die Säulen des Herkules, oder dem Diogenes seine cynische Philosophie, oder dem Epikur sein zuversichtlicher Ausspruch, daß es keine Vorsehung gebe, oder dem Empedokles seine Lehre des Atheismus, oder dem Sokrates sein Schwören beim Hund oder bei der Gans, bei der Platane, bei dem vom Blitze getroffenen Äsculapius und bei den Dämonien, die er anrief? Aus welchem Grunde doch ging er freiwillig in den Tod, und welchen Lohn hoffte er sich nach dem Tode? Was half dem Plato seine Erziehungslehre, oder den übrigen Philosophen – um nicht die ganze große Anzahl derselben aufzuzählen –ihre Lehrsätze? Wir führen dies aber an, um ihr nutzloses, gottentfremdetes Denken zu kennzeichnen.</p><p>Denn alle diese Männer strebten nur nach hohlem, eitlem Ruhm und kannten die Wahrheit weder selbst noch führten sie andere zur Wahrheit. Denn gerade ihre eigenen Worte überführen sie, daß sie Widersprüche vorgebracht und daß die meisten von ihnen ihre eigenen Lehrsätze selbst wieder umgestoßen haben. Denn sie widerlegten sich nicht nur gegenseitig, sondern manche von ihnen haben sogar ihre eigenen Lehren wieder als unrichtig dargestellt, so daß ihr Ruhm sich in Hohn und in den Ruf der Narrheit verwandelte; denn von den Verständigen werden sie verurteilt. Sie haben nämlich entweder von Göttern gesprochen, später aber selbst wieder den Atheismus gelehrt, oder sogar von einer Entstehung der Welt, zuletzt aber einen blinden Zufall behauptet, sogar auch von einer Vorsehung geredet und wieder den Satz aufgestellt, die Welt sei ohne alle höhere Lenkung. Haben sie nicht ferner in ihren Versuchen, über die Sittlichkeit zu schreiben, Anleitung zu Ausschweifungen, Hurerei, Ehebruch, sogar auch zur Verübung der fürchterlichen unaussprechbaren Schandtaten gegeben? Und zwar geben sie ihre Götter als die ersten an, die in unnennbaren Verbindungen und entsetzlichen Mahlzeiten das Beispiel gegeben. Denn wer von ihnen besingt nicht den Kinder fressenden Kronos, und wie Zeus seine Tochter Metis verschlang und den Göttern verabscheuungswürdige Gastmähler gibt; dabei, sagen sie auch, habe ein gewisser stelzfüßiger Schmied Hephästion den Aufwärter gemacht. Die Hera habe den Zeus als leibliche Schwester nicht bloß geheiratet, sondern auch noch mit ihrem unsauberen Munde mit ihm Unsagbares verübt. Und all die übrigen Taten des Zeus, wie sie die Dichter besingen, weißt du wahrscheinlich. Was brauch ich endlich die Taten des Poseidon oder Apollo oder Dionysus und Herakles, der busenliebenden Athene und der schamlosen Aphrodite zu erwähnen, da wir sie anderswo einer eingehenderen Besprechung unterzogen haben?</p><p>Ich hätte auch diese Dinge zu widerlegen nicht für notwendig gefunden; allein ich sehe dich jetzt im Zweifel über die Lehre der Wahrheit. Obwohl du nämlich ein verständiger Mann bist, so erträgst du doch die Toren gerne, sonst hätten dich ja unverständige Menschen nicht dazu gebracht, daß du dich durch eitle Worte verführen ließest und dem abgedroschenen Gerede Gehör schenktest, durch welche gottlose Zungen falsche Verleumdungen gegen uns, die wir Verehrer Gottes sind und Christen genannt werden, ausstreuen, indem sie sagen, bei uns bestehe Weibergemeinschaft, und wir übten geschlechtlichen Umgang ohne allen Unterschied, sogar mit leiblichen Schwestern, ja sogar noch, und zwar das Gottloseste und Grauenhafteste von allem, wir genössen Menschenfleisch. Sie sagen auch, unsere Lehre trete als eine ganz neue auf, und wir wüßten zum Beweise der Wahrheit derselben nichts vorzubringen, sondern unsere Lehre sei Torheit. Ich wundere mich nun am meisten über dich, daß du, der du doch sonst in den übrigen Gegenständen des Wissens ein eifriger und genauer Forscher bist, uns so wenig Interesse entgegenbringst. Denn wenn es dir nur irgend möglich ist, stöberst du unermüdlich auch zur Nachtzeit in den Bibliotheken herum.</p><p>Du hast also Vieles gelesen. Was dünkt dir nun von den Lehren Zenos oder des Diogenes, Kleanthes und von dem ganzen Inhalte ihrer Schriften, die zur Menschenfresserei Anleitung geben, so daß die Eltern von den eigenen Kindern gekocht und aufgefressen werden sollten, und wenn jemand nicht mittun wollte oder ein Glied von der grauenhaften Speise wegschleuderte und nicht aß, selbst aufgefressen werden sollte? Überdies findet sich ein noch verruchterer Ausspruch, der des Diogenes, welcher lehrt, die Kinder sollten ihre Eltern als Opfer bringen und dann aufessen. Ferner, erzählt nicht auch Herodot von Kambyses, daß er die Kinder des Harpagus habe schlachten und kochen und sie dann dem Vater zum Essen vorsetzen lassen? Weiter fabelt er, daß auch bei den Indern die Eltern von den eigenen Kindern aufgezehrt werden. O der gottlosen Lehre von Männern, die solche Dinge niedergeschrieben, vielmehr gelehrt haben! o der Gottlosigkeit und Verruchtheit derselben, o des (verkehrten) Denkens solcher Leute, die so tief philosophierten und sich für Philosophen ausgaben! Denn die solche Sätze aufstellten, haben die Welt mit Gottlosigkeit erfüllt.</p><p>Auch über die frevelhafte Schandtat sind fast alle, die sich in dem irrtumsreichen Chor der Philosophen befinden, einig. Und zwar bestimmt Plato, dessen Philosophie doch sittlicher zu sein scheint, im ersten Buche vom Staate mit beredten Worten gewissermaßen als Gesetz, es sollten die Weiber allen gemeinsam sein, indem er als Beispiel hierfür den Sohn des Zeus, den Gesetzgeber der Kreter (Minos) anführt, damit angeblich durch einen solchen Brauch die Zahl der Kinder größer würde, und weil ja gewiß die etwas mehr geplagten Leute durch solchen ungebundenen Verkehr entschädigt werden müßten. Epikur gibt ebenfalls, außerdem daß er den Atheismus predigt, den Rat, auch mit Mutter und Schwestern Umgang zu pflegen, selbst mit Verletzung der Gesetze, die solches verböten. Solon nämlich hatte auch hierüber eine weise gesetzliche Bestimmung getroffen, damit die Kinder auf gesetzmäßige Weise in der Ehe erzeugt würden und nicht aus Hurerei entsprängen, und damit nicht jemand einen als Vater verehre, der es nicht ist, und seinen wahren Vater beschimpfe, weil er ihn nicht kennt. Und so auch alle die Verbote gegen dergleichen Dinge, welche die übrigen Gesetze der Griechen und Römer enthalten. Warum also hat Epikur und die Stoiker gelehrt, mit Schwestern und Knaben zu verkehren? Lehren, mit denen sie die Bibliotheken angefüllt haben, damit man ja von Kindheit an diesen rechtswidrigen Verkehr lerne. Doch was brauch ich mich noch länger mit diesen Dingen abzugeben, da sie von ihren sogenannten Göttern ähnliche Handlungen zu berichten wissen?</p><p>Denn obwohl sie das Dasein der Götter zuvor behaupten, so machen sie diese Behauptung wieder zunichte. Die einen nämlich sagen, die Götter beständen aus Atomen, die andern, sie lösten sich wieder in Atome auf, und die Götter hätten nicht mehr Macht als die Menschen. Plato, der das Dasein der Götter annimmt, will, daß sie aus der Materie bestünden. Pythagoras, der sich über die Götter soviel geplagt und seine Reisen Land aus Land ein gemacht hat, bestimmt zuletzt die Natur (als höchstes) und behauptet die Zufälligkeit des Alls, und daß die Götter sich um die Menschen durchaus nicht kümmern. Und alle die Aussprüche für den Atheismus ferner, welche der Akademiker Klitomachus vorbrachte. Was haben nicht auch Kritias und der Abderite Protagoras gesagt? „Denn wenn es Götter gibt, so kann ich über sie nicht sprechen noch darlegen, wie sie beschaffen sind; denn ich finde da viele Hindernisse“. Über Euhemerus, den ärgsten Atheisten, ist auch nur zu reden überflüssig. Denn nachdem er viele Äußerungen über die Götter gewagt, wagt er zuletzt auch die, es gebe überhaupt keine, sondern er läßt die Welt vom Zufall regiert werden. Plato, der soviel über den Monotheismus und die menschliche Seele geschrieben, der er die Unsterblichkeit zuerkennt, sagt später selbst wieder offen das Gegenteil, indem er behauptet, daß die Seelen immer wieder in andere Menschen, die einiger sogar in Tiere übergehen. Wie sollte Leuten, die Vernunft besitzen, diese seine Lehre nicht schrecklich und gottlos erscheinen, nach der ein Wesen, das einst ein Mensch gewesen, hinwieder ein Wolf oder Hund oder Esel oder ein anderes unvernünftiges Tier werden soll? Gleiche Faseleien findet man auch bei Pythagoras, der zudem auch noch die Vorsehung wegdemonstriert. Wem nun sollen wir glauben, dem Komiker Philemon, der da sagt: „Denn jene, die die Gottheit ehren, haben stets Des Heiles beste Hoffnungen“ oder den oben genannten, einem Euhemerus oder Epikur und Pythagoras und den übrigen, die (jede) Verehrung der Gottheit verwerfen und die Vorsehung leugnen? Über die Gottheit und die Vorsehung sagt Aristo: „Nur Mut! Es pflegt die Gottheit allen Würdigen Zu helfen, zumal aber solchen Wackeren, Genießen einen festbestimmten Vorzug nicht, Die rechtlich leben, ei! was lohnt sichs, fromm zu sein! „Es sei denn so! Jedoch ich sehe gar zu oft, Die frommen Wandel sich erwählen, ohne Glück Im Leben steh’n, doch solche, die nichts anderes, Als nur, was ihnen Nutzen bringt, als Ziel gewählt, In ehrenreich’rer Stellung als wir anderen.“ Für gegenwärtig, ja! Doch muß man vorwärts schau’n Und auf der Dinge letzte Wendung wartend seh’n. Denn nicht, wie bei gar manchen sich die Meinung hält, Die schlimm von Art und nutzlos für das Leben ist, Ist blinder Zufall Lenker, oder fällt der Lohn Nur zu, so wie sich’s eben trifft: denn dieser Wahn Erhöht den Reiz zur Missetat dem Bösewicht. Wer heilig lebt, hat hohen Lohn zu hoffen auch, Den Schlechten aber trifft die Strafe nach Gebühr. Denn nichts geschieht vom höh’ren Walten losgetrennt.“</p><p>Und bei allem, was die andern und beinahe die meisten Schriftsteller über die Gottheit und die Vorsehung gesagt haben, kann man sehen, welche Widersprüche sie vorbringen. Die einen nämlich haben die Gottheit und die Vorsehung ganz ausgeschaltet, die andern wieder einen Gott aufgestellt und erklärt, daß alles durch höhere Vorsehung geleitet werde. Der verständige Zuhörer und Leser also muß genau auf das Gesagte achten, wie Simylus sagt: „Man gibt den Dichternamen allgemein, Den schlechtbegabten, wie den guten, nach Gebrauch; Doch sollte Urteil herrschen.“</p><p>Und wie auch Philemon sagt: „Ein unverständ’ger Hörer ist ein schlimmes Ding, Denn weil er unverständig, schilt er selbst sich nie.“</p><p>Es ziemt sich also, das von den Philosophen und hinwiederum von den Dichtern Gesagte wohl zu beachten und ernstlich zu untersuchen und zu erwägen.</p><p>Denn obwohl sie das Dasein von Göttern leugnen, gestehen sie es doch selbst wieder zu, und zwar lassen sie dieselben rechtswidrigen Dinge verüben. Und zuerst besingen die Dichter mit höherem Schwunge die unschönen Taten des Zeus. Chrysippus, der so viele Torheiten ersonnen, gibt uns die Notiz, Hera habe sich mit unlauterem Munde dem Zeus genaht. Was soll ich weiter die Ausschweifungen der sogenannten Göttermutter aufzählen, oder die des nach Menschenblut dürstenden Jupiter Latiaris, oder die des sich entmannenden Attos (Attis), oder wie Zeus mit dem Beinamen der Tragöde seine Hand verbrannte, wie man erzählt, und jetzt bei den Römern als Gott verehrt wird? Ich übergehe mit Stillschweigen die Tempel des Antinous und der übrigen sogenannten Götter. Denn wenn ich es erzähle, so erregte es bei verständigen Lesern nur verächtliches Lachen. Diejenigen also, die solche Dinge mit ihrer Philosophie ausklügelten, werden durch ihre eigenen Sätze entweder als gottlose Menschen oder als Verteidiger der unbeschränkten Geschlechtslust und des rechtswidrigen Umgangs überführt, ja man stößt sogar in ihren Schriften auch auf Menschenfresserei bei ihnen, und als die ersten, die diese Handlungen verübten, geben sie die Götter an, die sie anbeteten.</p><p>Wir aber bekennen, daß ein Gott sei, aber nur einer, der Schöpfer, Gründer, Bildner dieser ganzen Welt; wir wissen, daß alles durch eine Vorsehung regiert werde, aber von ihm allein; wir haben ein hl. Gesetz gelernt, haben aber als Gesetzgeber den wahrhaftigen Gott, der uns auch lehrt, gerecht zu handeln, gottesfürchtig zu leben und Gutes zu tun. Und zwar sagt er in Betreff der Gottesfurcht: Du sollst keine fremden Götter neben mir haben. Du sollst dir kein Bild machen noch ein Gleichnis von allem, was im Himmel oben, oder was auf der Erde unten, oder was in den Wassern unter der Erde ist. Du sollst sie nicht anbeten noch ihnen dienen; denn ich bin der Herr dein Gott. Und über die Übung des Guten spricht er: Ehre deinen Vater und deine Mutter, auf daß es dir wohl ergehe und du lange lebest im Lande, das ich, der Herr dein Gott, dir gebe. Ferner in Betreff der Gerechtigkeit sagt er: „Du sollst nicht ehebrechen, du sollst nicht töten, du sollst nicht stehlen, du sollst kein falsches Zeugnis geben gegen deinen Nächsten, du sollst nicht begehren deines Nächsten Weib, du sollst nicht begehren sein Haus, noch Feld, noch Knecht, noch Magd, noch Ochsen, noch Zugtier, noch alles Vieh, noch alles, was deinem Nächsten gehört. Du sollst das Urteil des Armen beim Richten desselben nicht verkehren, du sollst jedes ungerechte Wort meiden; du sollst den Unschuldigen und Gerechten nicht töten; du sollst den Gottlosen nicht für gerecht erklären und keine Geschenke nehmen; denn die Geschenke verblenden die Augen der Sehenden und verkehren die Sache der Gerechten“. Der Vermittler dieses göttlichen Gesetzes nun war Moses, der Diener Gottes, zwar für die ganze Welt im allgemeinen, insbesondere aber für die Hebräer, auch Juden genannt, die anfangs der König von Ägypten in Sklaverei gehalten, eine gerechte Nachkommenschaft gottesfürchtiger und heiliger Männer, nämlich Abrahams, Isaaks und Jakobs. Doch erinnerte Gott sich ihrer, tat außerordentliche Zeichen und Wunder durch Moses, befreite sie und führte sie heraus aus Ägypten und hin durch die sogenannte Wüste; setzte sie auch in den Besitz des Landes Chananäa, das später Judäa genannt wurde, und gab ihnen ein Gesetz und lehrte sie jene Satzungen. Von dem Gesetze also, das erhaben und wunderbar in Hinsicht auf jede Gerechtigkeit ist, sind die oben erwähnten, wie gesagt, die zehn Hauptgebote.</p><p>Weil sie nun Fremdlinge in Ägypten gewesen waren, da sie ursprünglich Hebräer waren von Chaldäa – es hatte sie eine zur selben Zeit ausgebrochene Hungersnot gezwungen, nach Ägypten hinüberzukommen, da dort Getreide verkauft wurde, und sie hatten dort lange Zeit ihren Aufenthalt: es war aber dies nach einer Vorhersagung Gottes so gekommen; – weil sie also in Ägypten 430 Jahre gewohnt hatten, so schärfte ihnen Gott, als Moses sie aus dem Lande in die Wüste führen sollte, durch das Gesetz ein: „Den Fremdling sollst du nicht bedrängen; denn ihr wisset, wie es dem Fremdling ums Herz ist; denn auch ihr waret fremd im Land Ägypten“.</p><p>Als nun das Volk das ihm von Gott gegebene Gesetz übertrat, da schickte ihnen Gott in seiner Güte und Erbarmung, weil er sie nicht vertilgen wollte, außerdem daß er ihnen das Gesetz gegeben hatte, später auch noch Propheten aus ihren Brüdern, um sie zu belehren, um ihnen die Vorschriften des Gesetzes in Erinnerung zu bringen und sie zur reuevollen Umkehr zu vermögen, auf daß sie nicht mehr sündigten. Wenn sie aber bei ihren schlechten Werken verharrten, so sagten sie ihnen voraus, daß sie allen Königreichen der Erde würden unterworfen und übergeben werden. Und es lehrt der Augenschein, daß dies ihnen bereits so geschehen ist. Über jene reuevolle Umkehr nun sagt der Prophet Isaias im allgemeinen zu allen Menschen, ausdrücklich aber zu diesem Volke: „Suchet den Herrn und rufet ihn an, so bald ihr ihn findet; wenn er sich euch nahet, verlasse der Gottlose seine Wege und der Ungerechte seine Gedanken und kehre zurück zum Herrn seinem Gott, und er wird sich erbarmen; denn weit weg tun wird er eure Sünden“. Und ein anderer Prophet, Ezechiel, sagt: „Wenn der Ungerechte sich abwendet von allen seinen Ungerechtigkeiten, die er getan, und meine Gebote bewahret und meine Gerechtigkeit übt, so soll er leben und nicht sterben; aller seiner Ungerechtigkeiten, die er getan, wird nicht mehr gedacht werden, sondern durch seine Gerechtigkeit, die er geübt, wird er leben; denn ich will nicht den Tod des Ungerechten, spricht der Herr, damit er sich bekehre von seinem bösen Wege und lebe“. Wiederum sagt Isaias:”Kehret um, ihr, die ihr die tiefen und ungerechten Gedanken hegt, damit ihr gerettet werdet“. Und dann Jeremias: „Kehret zurück zu dem Herrn euerem Gott, wie der Winzer zu seinem Korb, und ihr werdet Erbarmen finden“. Viele oder vielmehr unzählige Stellen finden sich also in der Hl. Schrift über die Buße, da Gott das Menschengeschlecht immer von allem sündigen Wesen zu sich bekehren will.</p><p>Über die Gerechtigkeit ferner, die das Gesetz vorgeschrieben, finden sich auch die gleichen Bestimmungen bei den Propheten und in den Evangelien, weil diese alle als Träger des einen Geistes Gottes durch diesen geredet haben. Isaias sagt: „Tut weg die Schlechtigkeiten von eueren Seelen, lernet Gutes tun, erforschet das Recht, verteidigt den, der Unrecht leidet, sprecht euer Urteil zu Gunsten der Waisen und schafft der Witwe ihr Recht“. Wiederum sagt der nämliche: „Löse alle Bande der Ungerechtigkeit, mache los die Schlingen der gewalttätigen Fesselung, gib schleunigst die Bedrückten frei, zerreisse jede ungerechte Schrift, brich dem Hungrigen dein Brot und die obdachlosen Armen führe in dein Haus; wenn du einen Nackten siehst, so kleide ihn, und wende dein Auge nicht stolz hinweg von den Angehörigen deines Geblüts. Dann wird dein Licht wie Morgenrot hervorbrechen und deine Genesung schnell kommen und deine Gerechtigkeit vor dir hergehen“. In gleicher Weise sagt Jeremias: „Stellet euch an die Wege und sehet und fraget, wie beschaffen der gute Weg des Herrn unseres Gottes ist, und wandelt ihn, und ihr werdet Ruhe für euere Seelen finden. Richtet ein gerechtes Gericht, denn darin liegt der Wille des Herrn eueres Gottes“. Ebenso sagt Osee: „Bewahret das Recht und nahet euch dem Herrn euerem Gott, der den Himmel gefestigt und die Erde gegründet“. Und wiederum sagt Joel mit diesen übereinstimmend: „Versammelt das Volk, heiligt die Gemeinde, bringt zusammen die Greise, versammelt Kinder und Säuglinge; es gehe der Bräutigam aus seiner Kammer und die Braut aus ihrem Brautgemach! Und betet zum Herrn euerm Gott mit Inbrunst, daß er sich euer erbarme, und er wird euere Missetaten auslöschen“. Und wiederum auf gleiche Weise sagt Zacharias: „Dies spricht der Herr der Allmächtige. Richtet das Gericht der Wahrheit und jeder habe Erbarmen und Mitleid gegen seinen Nächsten; die Witwe und Waise und den Fremdling sollt ihr nicht unterdrücken, und keiner gedenke seinem Bruder irgendeine Beleidigung in seinem Herzen, spricht der Herr der Allmächtige“.</p><p>Über das sittliche Verhalten ferner lehrt uns die Hl. Schrift nicht bloß im Werk nicht zu sündigen, sondern selbst auch nicht in Gedanken, daß wir im Herzen nicht einmal an etwas Schlechtes denken oder mit den Augen ein fremdes Weib begehren. Salomon also, der König und Prophet war, sagt: „Deine Augen sollen gerade sehen und deine Augenlider Gerechtes winken; gerade Pfade mache dir für deine Füße“. Die Stimme des Evangeliums aber belehrt noch eindringlicher über die Keuschheit, wenn sie sagt: „Jeder, der ein fremdes Weib ansieht, so daß er es begehrt, hat in seinem Herzen schon die Ehe gebrochen. Und wer eine Geschiedene heiratet, bricht die Ehe, und wer seine Frau entläßt, ausgenommen des Ehebruchs halber, macht sie zur Ehebrecherin“. Salomon sagt ferner: „Kann jemand Feuer in seinem Kleide tragen, ohne seine Kleidung zu verbrennen? Oder kann jemand auf feurigen Kohlen einhergehen, ohne seine Füße zu verbrennen? So wird auch derjenige, welcher zu einem Weibe geht, das unter einem Manne steht, nicht straflos ausgehen“.</p><p>Und daß wir nicht bloß unsere Volksgenossen lieben sollen, wie einige meinen, hierüber sagt der Prophet Isaias: „Sagt denen, die euch hassen und euch fluchen: Ihr seid unsere Brüder, damit der Name des Herrn verherrlicht und gesehen werde in ihrer Freude“. Das Evangelium aber sagt: “Liebet euere Feinde, betet für die, so euch verfluchen. Denn wenn ihr die liebt, die euch lieben, welchen Lohn habt ihr davon? Denn dies tun auch die Räuber und Zöllner“. Diejenigen aber, die Gutes tun, belehrt es, sich nicht damit zu rühmen, damit sie nicht den Menschen zu gefallen bestrebt seien; es sagt nämlich: „Es wisse deine linke Hand nicht, was deine rechte tut“. Dazu noch befiehlt uns das göttliche Wort, den Herrschaften und Obrigkeiten untertan zu sein und für sie zu beten, „auf daß wir ein friedliches und ruhiges Leben führen“. Und es lehrt uns, allen alles zu geben, „Ehre, wem Ehre, Ehrfurcht, wem Ehrfurcht, Steuer, wem Steuer; keinem etwas schuldig zu bleiben, als daß wir alle lieben“.</p><p>Bedenke nun, ob Leute, die solche Lehren erhalten haben, unterschiedslosen und gesetzwidrigen geschlechtlichen Umgang pflegen oder, was das Gottloseste von allein ist, sich an Menschenfleisch vergreifen können, zumal da uns sogar das Zuschauen bei den Gladiatorenkämpfen verboten ist, damit wir nicht Teilnehmer und Mitwisser an Mordtaten werden! Aber auch die übrigen Schauspiele anzusehen, gilt uns für unsittlich, damit unsere Augen und Ohren nicht befleckt werden, wenn sie an den Mordtaten teilnähmen, die dort besungen werden. Denn wenn jemand von Menschenfresserei reden wollte, dort werden die Kinder des Thyestes und Tereus aufgefressen; wenn vom Ehebruch, dort bei ihnen wird er in den Tragödien besungen, nicht bloß von Seite der Menschen, sondern auch der Götter, von denen (die Dichter) in klangvoller Sprache denselben unter deren Großtaten und Kämpfen berichten. Ferne sei aber von den Christen der Gedanke, so etwas zu tun! denn bei ihnen findet sich weise Selbstbeherrschung, wird die Enthaltsamkeit geübt, die Monogamie beobachtet, die Keuschheit bewahrt, die Ungerechtigkeit ausgemerzt, die Sünde mit der Wurzel vertilgt, die Gerechtigkeit ausgeübt, das Gesetz gehalten, die Frömmigkeit durch die Tat bezeugt, Gott bekannt, die Wahrheit als Höchstes betrachtet; die Gnade bewahrt sie, der Friede beschirmt sie, das hl. Wort führt sie, die Weisheit lehrt sie, das (ewige) Leben entscheidet, Gott ist ihr König. Wir hätten also zwar noch vieles zu sagen über unsere Religion und die Satzungen Gottes, des Urhebers der gesamten Schöpfung, doch glauben wir für jetzt genug erwähnt zu haben, um auch dich zumeist durch das, was du bis jetzt gelesen hast, dahin zu bringen, daß du so wie bisher auch ferner gerne Belehrung annehmest.</p><p>Ich will dir nun mit Gottes Hilfe auch die Chronologie genauer darlegen, damit du siehst, daß unsere Lehre nicht neu noch fabelhaft sei, sondern älter und wahrer als die aller Dichter und Schriftsteller, die ins Blaue hinein geschrieben haben. Denn diejenigen, welche die Welt als ungeworden annahmen, gingen bis ins Unbegrenzte zurück; andere, welche eine Entstehung der Welt behaupteten, sagten, es seien seitdem bereits 153,075 Jahre verflossen. Dies schreibt der Ägyptier Apollonius. Plato aber, der für den Weisesten der Griechen gilt, in welche Faseleien verliert sich der! In seinem „Vom Staat“ betitelten Buche nämlich steht ausdrücklich: „Wenn die jetzigen Zustände und Einrichtungen, o Fremdling, immer (und von jeher) dieselben geblieben wären, wie käme es, daß irgendwelche neu erfunden wurden? Hundert Millionen Jahre (vielmehr) blieben diese den damaligen Menschen unbekannt; tausend Jahre aber oder zweimal soviel sind es (erst), seitdem sie erfunden und allgemein bekannt worden sind, teils von Dädalus, teils von Orpheus, teils von Palamedes an“. Und indem er diesen Verlauf der Dinge behauptet, nimmt er jene hundert Millionen Jahre an von der Flut bis auf Dädalus. Und nachdem er viel erzählt hat von Staaten, Niederlassungen und Völkern auf der Welt, gesteht er, daß er diese Dinge nur als Vermutungen ausspreche. Er sagt nämlich: „Wenn irgendein Gott uns verhieße, daß wir, wenn wir die Betrachtung der Gesetzgebung unternehmen, im Vergleich mit dem Gesagten“ –. Also sprach er offenbar nur Vermutungen aus; wenn aber nur Vermutungen, so haben seine Angaben wahrlich auf Wahrheit keinen Anspruch.</p><p>Man muß also in der Gesetzgebung bei Gott in die Schule gehen, wie Plato ja selbst gesteht, daß es unmöglich sei, die klare Wahrheit anderswie zu finden, außer wenn Gott sie durch sein Gesetz lehrt. Behaupten ferner nicht auch die Dichter Homer, Hesiod und Orpheus, sie hätten ihre Kenntnisse von der göttlichen Vorsehung? Ja man sagt sogar, zu den Zeiten der Schriftsteller hätten Seher und Propheten gelebt, und von diesen belehrt, hätten jene die Wahrheit geschrieben. Um wieviel mehr also können wir die Wahrheit wissen, die wir von den hl. Propheten belehrt sind, welche den HI. Geist Gottes in sich aufgenommen hatten! Deswegen stimmen die Aussprüche aller Propheten, durch die sie die künftigen Schicksale der ganzen Welt vorherverkündeten, so vollständig zusammen. Denn der redliche Forscher oder besser der Freund der Wahrheit kann gerade durch das Eintreffen der vorher angekündigten und bereits geschehenen Ereignisse die Überzeugung gewinnen, daß ihre Angaben über die Zeiten und Zeitläufe vor der Sintflut, wie die Jahre von der Erschaffung der Welt bis jetzt verliefen, wirklich wahr seien, so daß die lügenhafte Flunkerei der Schriftsteller und die Unwahrheit ihrer Angaben offenbar werden.</p><p>Plato nämlich, wie erwähnt, nimmt zwar eine Wasserflut an, behauptet aber, sie habe sich nicht über die ganze Erde, sondern nur über die Ebenen erstreckt, und diejenigen, die auf die höchsten Berge geflohen, seien gerettet worden. Andere erzählen von Deukalion und Pyrrha, welche sich in einer Arche gerettet hätten, und Deukalion habe, nachdem er die Arche verlassen, Steine hinter seinen Rücken geworfen, und aus den Steinen seien Menschen geworden; deswegen, sagen sie, habe die Menge der Menschen auch den Namen Laoi erhalten. Wieder andere sagen, bei einer zweiten Flut habe ein gewisser Klymenus gelebt. Es ist nun aus dem oben Gesagten klar, daß Leute, die solche Dinge geschrieben und solche Dinge ausgegrübelt haben, sich als armselige, gottlose und törichte Leute beweisen. Unser Prophet und Diener Gottes aber, Moses, erzählt in seiner Geschichte der Erschaffung der Welt, auf welche Weise die Sintflut auf der Erde eintrat, ferner, welches die näheren Umstände dabei waren, ohne daß er dabei von Deukalion und Pyrrha fabelt oder bloß die Ebenen überschwemmt und bloß die auf die Berge Geflüchteten gerettet werden last,</p><p>Er erklärt aber auch, daß keine zweite Sintflut stattgefunden, ja er versichert sofort, daß ferner keine Wasserflut mehr über die Welt kommen werde, wie ja auch keine mehr eingetreten ist und keine mehr eintreten wird. Weiter erzählt er, es seien im Ganzen acht Seelen gerettet worden in der Arche, die auf Gottes Befehl angefertigt wurde, nicht von Deukalion, sondern von Noe - ein hebräischer Name, der „Ruhe“ bedeutet. Wir haben aber in einer andern Schrift schon erzählt, wie Noe seinen Zeitgenossen, als er ihnen die kommende Flut ankündigte, zurief: Hieher! Gott ruft euch zur Buße. Deswegen wurde er auch Deukalion genannt. Dieser Noe hatte drei Söhne, wie wir im zweiten Buche angegeben haben, deren Namen sind: Sem, Cham und Japheth. Diese hatten wieder drei Weiber, jeder eines nämlich; dazu noch er und sein Weib. Manche haben diesen Mann auch Eunuchus genannt. Also wurden im ganzen acht Seelen, die sich in der Arche befanden, gerettet. Die Sündflut aber, so erzählt Moses, dauerte vierzig Tage und vierzig Nächte, indem die Schleusen des Himmels hernieder strömten und alle Brunnen des Abgrundes sich ergossen, so daß das Wasser 50 Ellen hoch über jedem hohen Berge stand. Und so ging das ganze damalige Menschengeschlecht zugrunde und nur die in der Arche Verwahrten, deren, wie gesagt, acht waren, wurden gerettet. Die Trümmer dieser Arche werden bis jetzt noch im arabischen Gebirge gezeigt. Von der Sintflut also gibt Moses in Kürze die vorstehende Erzählung.</p><p>Moses nun war es, der die Juden aus Ägypten führte, als sie vom König Pharao, dessen Namen Tethmosis war, und der nach der Vertreibung des Volkes noch 25 Jahre und 4 Monate regiert haben soll, wie Manethos ausgerechnet hat, aus dem Lande vertrieben wurden. Nach diesem regierte Chebron 13 Jahre, nach ihm Amenophis 20 Jahre 7 Monate; nach diesem seine Schwester Amessa 21 Jahre 1 Monat; nach ihr Mephres 12 Jahre 9 Monate, nach ihm Methrammuthosis 20 Jahre 10 Monate, nach ihm Tythmoses 9 Jahre 8 Monate, nach ihm Damphenophis 30 Jahre 10 Monate, nach ihm Orus 36 Jahre 5 Monate; dessen Tochter 10 Jahre 3 Monate, nach ihr Mercheres 12 Jahre 3 Monate; dessen Sohn Armais 4 Jahre 1 Monat; nach diesem Rhamesses 1 Jahr 4 Monate, nach diesem Messes Miammu 6 Jahre 2 Monate, nach diesem Amenophis 19 Jahre 6 Monate, nach ihm Thössus und Ramesses 10 Jahre; diese sollen eine für ihre Zeit große Macht an Reiterei und eine mächtige Flotte besessen haben. Die Hebräer, die um diese Zeit sich in Ägypten angesiedelt hatten und vom König, der oben Tethmosis genannt worden ist, zu Sklaven gemacht worden waren, erbauten ihm feste Städte: Pitho, Ramesses und On, welches die Stadt der Sonne ist, so daß also die Hebräer auch älter erscheinen als die damaligen namhaften Städte in Ägypten; und sie sind unsere Voreltern, von denen wir die hl. Schriften haben, die älter sind als alle Schriftsteller, wie vorher gesagt worden ist. Das Land Ägypten aber erhielt seinen Namen vom König Sethos; denn Sethos, sagt man, heißt Ägypten. Sethos aber hatte einen Bruder, namens Armais; dieser hieß Danaos, und er ist der nämliche, welcher aus Ägypten nach Argos kam, dessen die übrigen Schriftsteller als eines Mannes aus dem grauen Altertum erwähnen.</p><p>Der Schriftsteller Manethos aber, der soviel tolles Zeug zu Gunsten der Ägyptier schrieb und dazu noch von Moses und den Hebräern, die mit ihm waren, Schimpfliches zu erzählen weiß, als seien sie wegen des Aussatzes aus Ägypten vertrieben worden wußte nichts Genaues über die Zeitrechnung anzugeben. Er sagt nämlich, sie seien Hirten und Feinde der Ägyptier gewesen. Wenn er sie Hirten nennt, so tat er das wider seinen Willen, von der Wahrheit dazu gezwungen; denn unsere Voreltern waren wirklich Hirten, die sich in Ägypten ansiedelten, aber nicht aussätzig. Als sie nämlich ins sogenannte Land Jerusalem kamen, wo sie sich später auch bleibend niederließen, da ist klar angegeben, wie ihre Priester, die gemäß göttlichem Befehle immer beim Tempel wohnten, jede Krankheit ärztlich zu behandeln wußten, so daß sie auch die Aussätzigen und jedes schimpfliche Gebreste heilten. Den Tempel erbaute Salomon, der König von Judäa. Daß aber Manethos über die Zeitrechnung im Irrtum ist, wird aus dem, was er sagt, klar; er ist es aber auch über den König, der sie vertrieben hat, dessen Name Pharao ist. Denn dieser blieb ihr König nicht mehr langer, denn als er mit seiner Streitmacht die Hebräer verfolgte, ging er im Roten Meere zugrunde. Ferner berichtet er auch falsch über die Hirten, die nach ihm mit den Ägyptiern Krieg geführt hätten; denn sie zogen 313 Jahre früher aus Ägypten und bewohnten von da an das Land, das auch jetzt noch Judäa heißt, ehe Danaos nach Argos kam. Daß aber letzteren die meisten bei den Griechen für älter als die übrigen halten, ist bekannt. So hat uns also Manethos wider Willen zwei wahre Tatsachen in seinen Schriften mitgeteilt: die erste, daß er die Hebräer übereinstimmend Hirten nennt, die andere, daß er auch ihren Auszug aus dem Lande Ägypten berichtet; so daß also aus diesen seinen Aufschreibungen bewiesen ist, daß Moses und sein Volk 900 oder auch 1000 Jahre vor dem Ilischen Kriege gelebt haben.</p><p>Aber auch in Betreff des Baues des Tempels in Judäa, den der König Salomon 566 Jahre nach dem Auszuge der Juden aus Ägypten erbaute, ist bei den Tyriern aufgezeichnet, wie der Tempel gebaut wurde, und die Schrift ist in ihren Archiven aufbewahrt; und in diesen Aufzeichnungen findet man, daß der Tempel 134 Jahre 8 Monate vor der Gründung Karthagos durch die Tyrier entstanden sei. So erzählt der Ephesier Menander in seiner Geschichte des Königreichs der Tyrier, indem er in folgender Weise schreibt: Nach dem Tode des Abibal, des Königs der Tyrier, übernahm sein Sohn Hieromos die Regierung und lebte 53 Jahre. Ihm folgte Bazor, der 43 Jahre lebte und 17 regierte. Nach ihm kam Methuastartos, der 54 Jahre lebte und 12 Jahre regierte; nach ihm dessen Bruder Atharymos, der 58 Jahre lebte, 9 regierte. Diesen ermordete sein Bruder, namens Helles, der 50 Jahre lebte und 8 Monate regierte. Diesen ermordete Juthobal, ein Priester der Astarte, der 40 Jahr lebte und 12 Jahre regierte. Ihm folgte sein Sohn Bazor, der 45 Jahre lebte und 7 Jahre regierte. Dessen Sohn Mettenos, der 32 Jahre lebte und 29 Jahre regierte. Ihm folgte Pygmalion, der 56 Jahre lebte und 7 Jahre regierte. Im siebenten Jahre seiner Regierung floh nach Libyen und gründete eine Stadt, die bis jetzt Karthago heißt. Die ganze Zeit von der Regierung Hieromos bis zur Gründung Karthagos berechnet sich auf 155 Jahre 8 Monate. Im zwölften Jahre der Regierung Hieromos’ aber wurde der Tempel in Jerusalem erbaut, so daß die ganze Zeit von der Erbauung des Tempels bis zur Gründung Karthago 132 Jahre 8 Monate beträgt.</p><p>In Betreff des Zeugnisses der Phönizier und Ägyptier, wie nämlich die Geschichtsschreiber Manethos, der Ägyptier, und der Ephesier Menander, ferner auch Josephus, der den jüdisch-römischen Krieg beschrieb, über unsere Chronologie berichtet haben, möge das Gesagte hinreichen. Denn aus diesen alten Schriftstellern wird bewiesen, daß auch die Werke der übrigen später seien als die uns von Moses gegebenen Schriften, ja sogar als die der späteren Propheten; denn der letzte der Propheten, Zacharias mit Namen, blühte zur Zeit der Regierung des Darius. Aber auch alle Gesetzgeber traten nachweislich später auf. Denn wollte man den Athener Solon nennen, so lebte dieser zu den Zeiten der Könige Cyrus und Darius, zur Zeit des oben erwähnten Propheten Zacharias, der um sehr viele Jahre später lebte. Oder will man von den Gesetzgebern Lykurgus oder Drakon oder Minos reden, so gehen diesen die hl. Schriften an Alter voran, da die Bücher des göttlichen durch Moses uns übermittelten Gesetzes ja auch erweisbar älter sind als Zeus, der über die Kreter herrschte, ja sogar als der Ilische Krieg. Damit wir aber eine genauere Chronologie liefern, wollen wir mit Gottes Hilfe uns jetzt daran machen, nicht bloß die Geschichte nach der Sintflut, sondern auch die vor der Sintflut durchzugehen, um so nach Möglichkeit die Zahl der gesamten Jahre der Welt uns vorzuführen, indem wir auf den fernsten Anfang der Schöpfung der Welt zurückgehen, die uns Moses, der Diener Gottes, durch den HI. Geist beschrieben hat. Indem er nämlich die Geschichte der Schöpfung und Entstehung der Welt und des ersten Menschen und die folgenden Ereignisse erzählt, gibt er auch die Jahre an, die vor der Sintflut verflossen. Ich flehe nun um die Gnade des einzigen Gottes, damit ich nach seinem Willen genau die Wahrheit darlege, damit du und jeder, dem diese Schrift in die Hände kommt, von seiner Wahrheit und Gnade geleitet werde. Ich will nun erst von den aufgezeichneten Geschlechtsregistern beginnen, d. h. von dem ersten Menschen anfangen.</p><p>Adam lebte, bis er seinen Sohn erzeugte, 230 Jahre, sein Sohn Seth 205 Jahre, dessen Sohn Enos 190, dessen Sohn Kainan 170 Jahre, dessen Sohn Maleleel 165 Jahre, dessen Sohn Jahreth 162, dessen Sohn Enoch 165 Jahre, dessen Sohn Mathusala 167 Jahre, dessen Sohn Lamech 188 Jahre. Dessen Sohn war der obengenannte Noe, der den Sem erzeugte in einem Alter von 500 Jahren. Unter ihm fand die Sintflut statt, als er 600 Jahre alt war. Die Gesamtzahl der Jahre bis zur Sintflut beträgt also 2242. Gleich nach der Sintflut zeugte Sem im Alter von 100 Jahren den Arphaxath, Arphaxath im Alter von 135 Jahren den Sala, Sala mit 130 Jahren den Heber, von welchem auch dessen Nachkommenschaft den Namen Hebräer erhielt; dieser zeugte 134 Jahre alt den Phaleg, dieser 130 Jahre alt den Ragau, dieser mit 132 Jahren den Seruch, dieser mit 130 Jahren den Nachor, dieser mit 75 Jahren den Thara, dieser mit 70 Jahren den Abraham; dieser, unser Patriarch, zeugte im Alter von 100 Jahren den Jsaak. Es belaufen sich also die Jahre bis auf Abraham auf 3278. Der vorerwähnte Jsaak lebte, bis er einen Sohn zeugte, 60 Jahre und zeugte dann den Jakob; Jakob lebte bis zu seiner Übersiedlung nach Ägypten, von der wir oben geredet haben, 130 Jahre; der Aufenthalt der Hebräer in Ägypten währte 430 Jahre, und nach ihrem Auszug aus Ägypten verweilten sie in der sogenannten Wüste 40 Jahre. Die Gesamtzahl der Jahre beträgt also 3938 zur Zeit, wo Moses starb und Jesus, der Sohn Naves, die Führung des Volkes übernahm. Er leitete es aber 27 Jahre. Als nun nach Jesus das Volk die Gebote Gottes übertrat, diente es dem König von Mesopotamien, namens Chusarathon, 8 Jahre. Hierauf, als es wieder Buße tat, traten Richter unter ihnen auf: Gothonoel 40 Jahre lang, Eglon 18 Jahre, Aoth 8 Jahre. Dann, als sie wieder abfielen, herrschten Fremde über sie 20 Jahre. Hierauf richtete sie Deborra 40 Jahre. Dann beherrschten sie die Madianiter 7 Jahre; hierauf war Gedeon ihr Richter 40 Jahre, Abimelech 3 Jahre, Thola 23 Jahre, Jair 22 Jahre. Dann dienten sie den Philistern und Ammanitern 18 Jahre. Hierauf richtete sie Jephte 6 Jahre, Esbon 7 Jahre, Älon 10 Jahre, Abdon 8 Jahre. Dann herrschten wieder Fremde über sie 40 Jahre. Hierauf richtete sie Samson 20 Jahre. Dann lebten sie in Frieden 40 Jahre lang. Hierauf war ihr Richter Samera 1 Jahr, Elis 20 Jahre, Samuel 12 Jahre.</p><p>Nach den Richtern aber kamen Könige bei ihnen, der erste mit Namen Saul, der 20 Jahre regierte, dann David, unser Vorahne, 40 Jahre. Bis zur Regierung Davids also beträgt die Gesamtzahl der Jahre 498. Nach ihnen regierte Salomon, der nämliche, der dem Willen Gottes gemäß den Tempel in Jerusalem baute, 40 Jahre, nach ihm Roboam 17 Jahre, nach diesem Abias 7 Jahre, nach ihm Asa 41 Jahre, nach ihm Josaphat 25 Jahre, nach ihm Joram 8 Jahre; nach diesem Ozochias 1 Jahr, nach ihm Gotholia 6 Jahre, nach ihm Joas 40 Jahre, nach ihm Amasias 39 Jahre, nach ihm Ozias 52 Jahre, nach ihm Joatham 16 Jahre, nach ihm Achaz 17 Jahre, nach ihm Ezechias 29 Jahre, nach ihm Manasses 55 Jahre, nach ihm Amos 2 Jahre, nach ihm Josias 31 Jahre, nach ihm Ocas 3 Monate, nach ihm Joachim 11 Jahre, nach diesem ein zweiter Joachim 3 Monate und 10 Tage, und nach diesem Sedekias 11 Jahre. Nach diesen Königen zog, weil das Volk in seinen Sünden verharrte und nicht Buße tat, nach der Prophezeiung des Jeremias der König von Babylon, namens Nabuchodonosor, nach Judäa herauf. Dieser verpflanzte das Judenvolk nach Babylon und zerstörte den Tempel, den Salomon gebaut hatte. In der babylonischen Gefangenschaft aber verbrachte das Volk 70 Jahre. Es beträgt also die Gesamtzahl der Jahre bis zum Aufenthalt im Lande Babylon 4954 Jahre 6 Monate und 10 Tage. Wie Gott aber durch den Propheten Jeremias vorherverkündet hatte, daß das Volk in die Gefangenschaft nach Babylon werde abgeführt werden, so sagte er auch voraus, daß sie nach 70 Jahren wieder in ihr Land zurückkehren würden. Als nun 30 Jahre vorübergegangen waren, wurde Cyrus König der Perser; dieser ließ gemäß der Prophezeiung des Jeremias im zweiten Jahre seiner Regierung öffentlich an alle Juden, die sich in seinem Reiche befanden, den Befehl ergehen, zurückzukehren in ihr Land und ihrem Gotte den Tempel wieder aufzubauen, den der oben erwähnte König von Babylon zerstört hatte. Dazu noch trug Cyrus dem Befehle Gottes gemäß dem Sabessar und Mithridates, seinen Trabanten, auf, die Gefäße, die von Nabuchodonosor aus dem Tempel von Judäa waren weggenommen worden, wieder zurückzubringen und im Tempel aufzustellen. Im zweiten Jahre des Darius nun laufen die 70 von Jeremias vorhergesagten Jahre ab.</p><p>Aus dieser Auseinandersetzung kann man ersehen, wie unsere hl. Schriften sich als älter und wahrer erweisen als die der Griechen und Ägyptier oder irgend beliebiger anderer Geschichtsschreiber. Die meisten von ihnen, seien es Herodot und Thukydides oder auch Xenophon oder die andern Geschichtsschreiber überhaupt, fingen ihren Bericht in der Regel mit der Regierung des Cyrus und Darius an, da sie nicht imstande sind, über die alte und frühere Zeit Genaues zu berichten. Was sagen sie denn Besonderes, wenn sie uns erzählen von, den ausländischen Königen Darius und Cyrus, oder von den Griechen, von Zopyrus und Hippias, oder von den Kriegen der Athener und Lacedämonier, oder von den Taten des Xerxes, oder des Pausanias, der nahe daran war, im Tempel der Athene zu verhungern, oder die Geschichte des Themistokles, oder den peloponnesischen Krieg, oder von Alcibiades und Thrasybul? Denn ich habe nicht vor, Langes und Breites zu reden, sondern ich will die Anzahl der Jahre von der Erschaffung der Welt an darlegen und das törichte vergebliche Bemühen der Geschichtsschreiber brandmarken; denn es sind nicht 200 000 Jahre, wie Plato sagt, der dazu noch behauptet, daß diese vielen Jahre von der Sintflut an bis auf seine Zeit verflossen seien, noch auch 153075 Jahre, wie der Ägypter Apollonius meint, wie oben bemerkt worden; noch ist die Welt ungeworden, noch herrscht der Zufall im All, wie Pythagoras und die übrigen gefaselt haben, sondern die Welt ist geworden und wird mit weiser Fürsorge geleitet von Gott, der alles erschaffen hat; und der ganze Verlauf der Zeit und der Jahre läßt sich denen, die der Wahrheit Gehör schenken wollen, darlegen. Damit es also nicht etwa den Anschein habe, als ob wir die Chronologie bis Cyrus dargelegt, aber dies für die späteren Zeiten unterließen, weil wir es nicht mehr zu tun imstande seien, so werde ich mit Gottes Hilfe auch die Reihenfolge der folgenden Zeiten nach Möglichkeit darzulegen versuchen.</p><p>Cyrus also regierte 38 Jahre und wurde von der Königin Tomyris in Massagetien getötet; es war damals die zweiundsechzigste Olympiade. Damals wurden bereits die Römer allmählich groß, indem Gott ihnen Macht verlieh; Rom aber war gegründet von Romulus, dem Sohne des Ares und der Ilia, wie erzählt wird, in der siebenten Olympiade, am 15. April; das Jahr zählte aber damals 10 Monate. Da nun Cyrus, wie wir soeben erwähnt haben, in der zweiundsechzigsten Olympiade starb, so ergibt sich als Zeitpunkt hierfür das Jahr 220 von der Erbauung Roms an gerechnet, wo dort Tarquinius mit dem Beinamen Superbus herrschte, der zuerst einige der Römer in die Verbannung schickte, Knaben schändete, Bürger zu Verschnittenen machte, ja sogar die Mädchen erst schwächte, ehe sie verheiratet wurden. Deswegen erhielt er den passenden Namen Superbus, d. h. der übermütige. Er war auch der erste, der es einführte, daß diejenigen, die ihn grüßten, durch einen andern wieder gegrüßt wurden. Er regierte 25 Jahre. Nach ihm regierten Konsuln, Tribunen und Ädilen immer auf ein Jahr 453 Jahre lang; ihre Namen aufzuzählen wäre zu weitläufig und nach meinem Dafürhalten überflüssig. Denn wenn sie jemand wissen will, so kann er sie in den Aufzeichnungen finden, die der Nomenklator Chryseros, der Freigelassene des M. Aurelius Verus, angefertigt hat, der alles, Namen und Zeiten von der Erbauung Roms bis zum Tode seines Herrn, des Kaisers Verus, genau verzeichnet hat. Es regierten also, wie gesagt, in Rom einjährige Obrigkeiten 453 Jahre. Hierauf regierten die sogenannten Kaiser. Der erste war Gajus Julius, der 3 Jahre 4 Monate und 6 Tage regierte, Hierauf Augustus 56 Jahre 4 Monate und 1 Tag; Tiberius 22 Jahre; dann ein zweiter Gajus 3 Jahre 8 Monate 7 Tage; Klaudius 13 Jahre 8 Monate 24 Tage; Nero 13 Jahre 6 Monate 28 Tage; Galba 7 Monate 6 Tage; Otho 3 Monate 5 Tage; Vitellius 6 Monate 22 Tage; Vespasian 9 Jahre 11 Monate 22 Tage; Titus 2 Jahre und 22 Tage; Domitian 15 Jahre 5 Monate 6 Tage; Nerva 1 Jahr 4 Monate 10 Tage; Trajan 19 Jahre 6 Monate 16 Tage; Hadrian 20 Jahre 10 Monate 28 Tage; Antoninus 22 Jahre 7 Monate 6 Tage; Verus 19 Jahre 10 Tage. Die Zeit der Kaiser bis zum Tode des Kaisers Verus beträgt also 225 Jahre. Vom Tode des Cyrus an also und der Regierung des Tarquinius Superbus bei den Römern bis zum Tode des Kaisers Verus, von dem wir oben geredet, berechnet sich die Zeit auf 741 Jahre.</p><p>Von der Erschaffung der Welt an aber wird die Gesamtzeit in Kürze so berechnet. Von der Erschaffung der Welt bis zur Sintflut waren 2242 Jahre. Von der Sintflut bis zur Zeugung eines Sohnes durch Abraham, unsern Urvater, 1036 Jahre. Von Isaak, dem Sohne Abrahams, bis zum Aufenthalte des Volkes in der Wüste unter Moses 660 Jahre. Vom Tode des Moses und dem Regierungsantritte Jesus’ des Sohnes Naves, bis zum Tode unseres Stammvaters David 498 Jahre. Vom Tode Davids und der Regierung Salomons bis zum babylonischen Exil 518 Jahre 6 Monate 10 Tage. Vom Regierungsantritt des Cyrus bis zum Tode des Kaisers Aurelius Verus 741 Jahre. In Summe werden von der Erschaffung der Welt an gezählt im Ganzen 5695 Jahre und die nebenher laufenden Monate und Tage.</p><p>Wenn man also die Zeiten und alles Gesagte zusammennimmt, so kann man daraus das hohe Alter der prophetischen Schriften und die Göttlichkeit unserer Religion ersehen, daß sie nämlich nicht neu und unsere Lehren nicht fabelhaft und falsch seien, wie einige meinen, sondern fürwahr älter und wahrer. Thallus nämlich erwähnt den König der Assyrier Belus und den Titanen Kronos und sagt, Belus habe auf Seite der Titanen in ihrem Kriege gegen Zeus und die sogenannten Götter unter ihm gestanden; dort sagt er: Und Gygus floh besiegt nach Tartessus; damals hieß das Land, über welches Gygus zu jener Zeit König war, Akte, jetzt heißt es Attika. Und die übrigen Gegenden, von welchen diese ihre Beinamen erhielten, aufzuzählen, halte ich nicht für notwendig, besonders dir gegenüber, der du in der Geschichte bewandert bist. Daß sich also Moses als älter herausstellt und nicht allein er, sondern auch die meisten Propheten nach ihm, als alle Schriftsteller und als Belus und Kronos und als der Ilische Krieg, ist klar. Denn nach der Geschichte des Thallus tritt Belus 322 Jahre vor dem Ilischen Krieg auf. Daß aber Moses ungefähr 900 oder sogar 1000 Jahre vor der Eroberung Trojas gelebt habe, haben wir oben bewiesen. Da aber Kronos und Belus gleichzeitig lebten, so wissen die meisten nicht, wer Kronos und Belus ist. Einige verehren den Kronos und nennen ihn Bei und Bal, besonders die Orientalen, ohne zu wissen, wer Kronos und Belus sei. Bei den Römern heißt er Saturnus, denn auch sie wissen nicht, wer dieser ihr Gott ist, Kronos oder Belus. Der Anfang der Olympiaden, sagt man, beginnt von Iphitus, nach einigen von Linus, der auch den Beinamen Ilius hatte. Wie sich nun die Reihenfolge der Jahre und der Olympiaden verhält, ist oben dargelegt worden. Ich glaube, das Altertum unserer Geschichte und die ganze Chronologie nach Möglichkeit genau bestimmt zu haben. Denn wenn uns auch irgendein Teil der Zeit entgangen wäre, z. B. 50 oder 100 oder auch 200 Jahre, so sind das doch nicht zehntausende oder tausende von Jahren, wie Plato und Apollonius und die übrigen Lügengeschichtsschreiber berichtet haben. Und dieses, nämlich die Zahl aller Jahre, wissen wir vielleicht nicht genau, weil in den hl. Schriften die nebenher laufenden Tage und Monate nicht verzeichnet sind. Betreffs der Chronologie, die wir aufstellen, stimmt auch Berosus, der chaldäische Philosoph, der die Griechen mit der chaldäischen Literatur bekannt gemacht hat, überein, der in seiner Erzählung von der Sintflut und vielen andern Ereignissen so ungefähr das nämliche wie Moses vorbringt. Ja sogar auch mit den Propheten Jeremias und Daniel stimmt er zum Teil überein; denn er erwähnt des Schicksales, das der König von Babylon den Juden bereitete, der von ihm Nabopalassar, bei den Hebräern aber Nabuchodonosor genannt wird. Auch macht er Erwähnung vom Tempel in Jerusalem, wie er vom Könige der Chaldäer zerstört und wie im zweiten Jahre der Regierung des Cyrus der Grund zum Tempel gelegt und wieder im zweiten Jahre des Darius der Tempel vollendet wurde.</p><p>Die Griechen aber wissen von der wahren Geschichte nichts; erstens weil sie die Schreibkunst erst in neuer Zeit kennen gelernt haben; und dies gestehen sie selbst, indem sie die Erfindung der Buchstaben die einen den Chaldäern, die andern den Ägyptiern, wieder andere den Phöniziern zuschreiben; zweitens weil sie die Sache falsch angegriffen haben und noch angreifen, indem sie nicht von Gott, sondern von eitlen und unnützen Dingen reden. Denn so z. B. reden sie mit Selbstgefühl von Homer, Hesiod und den übrigen Dichtern, die Herrlichkeit des ewigen und einzigen Gottes aber haben sie nicht nur vergessen, sondern sogar verunglimpft; ja sie verfolgten sogar und verfolgen noch täglich diejenigen, die ihn verehren. Selbst Belohnungen und Ehren haben sie für diejenigen ausgesetzt, die in zierlicher Sprache Gott lästern; diejenigen aber, die nach der Tugend streben und sich im hl. Leben üben, haben sie teils gesteinigt, teils zum Tode geführt und überhäufen sie bis jetzt mit grausamen Martern. Solche Menschen haben deshalb notwendigerweise die Weisheit Gottes verloren und die Wahrheit nicht gefunden.</p><p>Nimm also gefälligst diese Schrift fleißig zur Hand, damit du an ihr einen Ratgeber und ein Unterpfand der Wahrheit besitzest.</p>
