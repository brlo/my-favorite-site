    body: |-
      <p><em>Rundbrief der Kirche von Smyrna über das Martyrium des heiligen Polykarp, Bischofs von Smyrna.</em></p>
      <h2>0</h2>

      <p>Die Kirche Gottes, die in Smyrna weilt, an die Kirche Gottes, die in Philomelium weilt, und an alle Gemeinden der heiligen und katholischen Kirche an jedem Ort: Erbarmen, Friede und Liebe Gottes des Vaters und unseres Herrn Jesus Christus mögen euch in Fülle zuteil werden.</p>
      <h2>1</h2>

      <p>Wir haben euch, Brüder, über die Märtyrer und den seligen Polykarp geschrieben, der die Verfolgung gleichsam mit seinem Martyrium besiegelt und beendet hat. Denn fast alles, was sich zuvor ereignet hatte, geschah dazu, dass der Herr uns das Martyrium, wie es im Evangelium bezeugt ist, von neuem vor Augen führe. Polykarp wartete wie der Herr, bis er ausgeliefert wurde, damit auch wir ihm nachfolgten und nicht nur unser eigenes Heil, sondern auch das der Nächsten im Auge hätten. Denn es gehört zur wahren und festen Liebe, nicht nur das eigene Heil zu wünschen, sondern das aller Brüder.</p>
      <h2>2</h2>

      <p>So sind alle Martyrien selig und ruhmvoll, die nach dem Willen Gottes geschehen. Denn wir müssen als Fromme Gott die Macht über alles zuschreiben. Wer sollte sich nicht über den Mut der Märtyrer, ihre Geduld und ihre Liebe zum Herrn wundern? Man zerriss ihre Leiber mit Geißeln, so dass sogar die inneren Adern und Blutgefäße sichtbar wurden; doch sie ertrugen es. Selbst die Umstehenden weinten vor Mitleid, sie aber blieben so tapfer, dass keiner von ihnen aufschrie oder stöhnte. Damit zeigten sie uns allen, dass die herrlichen Märtyrer Christi während ihrer Pein außerhalb des Leibes waren, oder vielmehr, dass der Herr ihnen beistand und mit ihnen redete. Ihr Blick war auf die Gnade Christi gerichtet, und so verachteten sie die irdischen Strafen und erkauften sich in einer Stunde von der ewigen Qual. Das Feuer der unmenschlichen Henker erschien ihnen kühl; denn sie sahen das ewige, unauslöschliche Feuer vor sich und wollten ihm entgehen, indem sie mit den Augen des Herzens auf die Güter schauten, die den Leidenden aufbewahrt sind – Güter, die kein Ohr gehört, kein Auge gesehen und die in keines Menschen Herz gedrungen sind, die aber der Herr ihnen zeigte, da sie nicht mehr Menschen, sondern schon Engel waren. Ebenso erduldeten auch die, welche den wilden Tieren vorgeworfen wurden, viele schwere Qualen: Man spannte sie über scharfe Muscheln und peinigte sie mit allerlei anderen Martern, um sie, wenn möglich, durch die Dauer der Folter zum Verleugnen zu bringen.</p>
      <h2>3</h2>

      <p>Vieles ersann der Teufel gegen sie; aber Gott sei Dank, er überwand sie nicht alle. Der tapfere Germanikus stärkte ihre Furchtsamkeit durch seine Standhaftigkeit. Er kämpfte rühmlich mit den Tieren; denn als der Prokonsul ihn überreden wollte und sprach: „Hab Mitleid mit deinem Alter“, hetzte er das Tier auf sich selbst, um schneller aus diesem ungerechten und gesetzlosen Leben zu scheiden. Da erhob sich die ganze Menge, verwundert über den Mut des gottseligen und frommen Geschlechts der Christen, und rief: „Tod den Gottlosen! Sucht Polykarp!“</p>
      <h2>4</h2>

      <p>Doch ein Phrygier namens Quintus, der erst kürzlich aus Phrygien gekommen war, wurde, als er die Tiere sah, von Furcht ergriffen. Er war es, der sich selbst und einige andere gedrängt hatte, sich ohne Berufung dem Martyrium zu stellen. Der Prokonsul beredete ihn nach vielen Worten, zu schwören und zu opfern. Darum, Brüder, billigen wir die nicht, die sich selbst darbieten; denn das Evangelium lehrt es nicht so.</p>
      <h2>5</h2>

      <p>Der wunderbare Polykarp aber erschrak nicht, als er davon hörte, und wollte zunächst in der Stadt bleiben. Da aber viele ihn baten, fortzugehen, zog er sich auf ein Landgut nahe der Stadt zurück und lebte dort mit wenigen, indem er Tag und Nacht nichts anderes tat, als für alle Menschen und für alle Kirchen der Welt zu beten, wie er es gewohnt war. Drei Tage vor seiner Gefangennahme hatte er im Gebet eine Vision: Er sah, dass sein Kopfkissen vom Feuer ergriffen war. Da wandte er sich an die Seinen und sagte: „Ich muss lebendig verbrannt werden.“</p>
      <h2>6</h2>

      <p>Als man ihn weiter suchte, ging er auf ein anderes Landgut. Plötzlich erschienen die, welche ihn suchten; da sie ihn nicht fanden, ergriffen sie zwei junge Sklaven, von denen einer unter der Folter bekennen musste. Es war ihm unmöglich, sich zu verbergen, denn seine eigenen Hausgenossen verrieten ihn. Der Irinarch, der denselben Namen trug wie Herodes, eilte, Polykarp auf die Rennbahn zu bringen, damit er sein eigenes Los erfülle und Christi teilhaftig werde, die Verräter aber das Los des Judas trügen.</p>
      <h2>7</h2>

      <p>So nahmen die Häscher den Knaben mit und zogen an einem Freitag um die Mittagszeit mit ihren gewohnten Waffen aus und gingen auf ihn zu wie auf einen Räuber. Als sie am Abend alle zusammenkamen, fanden sie ihn in einer Kammer im Obergeschoss liegend. Er hätte auch von dort an einen anderen Ort entweichen können, wollte aber nicht, sondern sprach: „Der Wille des Herrn geschehe!“ Als er hörte, dass die ihn suchten, gekommen seien, stieg er hinunter und redete mit ihnen, so dass sie sich wunderten, als sie sein Alter und seine Festigkeit sahen, und fragten, ob es nötig gewesen sei, solche Mühe aufzubieten, um einen so alten Mann zu ergreifen. Sogleich ließ er ihnen zu trinken und zu essen geben und bat sie nur, ihm eine Stunde ungestört zu beten. Als sie einwilligten, stand er auf und betete, erfüllt von der Gnade Gottes, so dass er zwei Stunden lang nicht aufhören konnte. Die Zuhörer wunderten sich, und viele reute es, dass sie gegen einen so göttlichen Greis ausgezogen waren.</p>
      <h2>8</h2>

      <p>Als er das Gebet beendet hatte, gedachte er aller, die jemals mit ihm verkehrt hatten, der Kleinen und Großen, der Angesehenen und Unbekannten, und der ganzen katholischen Kirche auf Erden. Als die Zeit zum Aufbruch kam, setzten sie ihn auf einen Esel und führten ihn in die Stadt; es war aber der große Sabbat. Unterwegs begegneten ihm der Irinarch Herodes und dessen Vater Niketas. Sie setzten ihn in ihren Wagen und redeten ihm zu: „Was ist Schlimmes dabei zu sagen: Herr Caesar! und zu opfern und das Übrige zu tun und am Leben zu bleiben?“ Er antwortete ihnen zunächst nicht; als sie aber drangen, sprach er: „Ich habe nicht vor, zu tun, was ihr mir ratet.“ Da sie ihn nicht überreden konnten, begannen sie ihn zu schmähen und stießen ihn mit solcher Gewalt vom Wagen, dass er fiel und sich das Schienbein abschürfte. Er aber achtete nicht darauf, als wäre ihm nichts geschehen, und ging rüstig und eilig weiter zur Rennbahn, wohin sie ihn führten und wo ein solcher Lärm herrschte, dass niemand zu hören war.</p>
      <h2>9</h2>

      <p>Als Polykarp aber die Rennbahn betrat, erscholl eine Stimme vom Himmel: „Sei stark und tapfer, Polykarp!“ Den Sprechenden sah niemand; die Stimme aber hörten die Unsrigen, die dort waren. Endlich brachten sie ihn, und es erhob sich ein großer Lärm, als man hörte, dass Polykarp gefangen sei. Sobald sie ihn gebracht hatten, fragte der Prokonsul: „Bist du Polykarp?“ Und nach der bejahenden Antwort suchte er ihn zum Verleugnen zu bewegen und sprach: „Achte dein Alter“, und das Übrige, was sie zu sagen pflegen: „Schwöre beim Glück des Kaisers, besinne dich, sage: Tod den Gottlosen!“ Polykarp aber verfinsterte sein Antlitz, blickte auf die Menge der gesetzlosen Heiden auf der Rennbahn, drohte ihnen mit der Hand und sprach, mit einem Seufzer zum Himmel blickend: „Tod den Gottlosen!“ Der Prokonsul aber drang weiter und sprach: „Schwöre, und ich lasse dich frei; lästere Christus.“ Polykarp antwortete: „Sechsundachtzig Jahre diene ich ihm, und er hat mir nichts zuleide getan; wie könnte ich meinen König lästern, der mich errettet hat?“</p>
      <h2>10</h2>

      <p>Als der Prokonsul weiter drang und sprach: „Schwöre beim Glück des Kaisers!“, antwortete Polykarp: „Wenn du meinst, ich würde beim Glück des Kaisers schwören, wie du sagst, und du dich stellst, als wüsstest du nicht, wer ich bin, so höre mein offenes Bekenntnis: Ich bin ein Christ. Wenn du aber die christliche Lehre kennen lernen willst, so bestimme einen Tag und höre mich an.“ Der Prokonsul sprach: „Überrede das Volk!“ Polykarp antwortete: „Dich allein halte ich einer Antwort für würdig. Denn wir sind gelehrt worden, den von Gott eingesetzten Obrigkeiten und Gewalten die gebührende und für uns unschädliche Ehre zu erweisen; jene aber halte ich nicht für würdig, dass ich mich vor ihnen verteidige.“</p>
      <h2>11</h2>

      <p>Der Prokonsul sprach: „Ich habe Tiere; ihnen gebe ich dich preis, wenn du nicht anders denkst.“ Polykarp antwortete: „Rufe sie! Denn bei uns tauscht man gute Gedanken nicht gegen schlechte. Es ist gut, sich vom Bösen zur Gerechtigkeit zu wenden.“ Der Prokonsul fuhr fort: „Wenn du die Tiere nicht fürchtest, so lasse ich dich verbrennen, wenn du nicht anders denkst.“ Polykarp antwortete: „Du drohst mit einem Feuer, das eine Stunde brennt und bald erlischt; denn du kennst nicht das Feuer des künftigen Gerichts und der ewigen Strafe, das den Gottlosen bereitet ist. Was zögerst du? Tu, was du vorhast.“</p>
      <h2>12</h2>

      <p>Indem er dies und viel Ähnliches sagte, erfüllte ihn Mut und Freude; sein Antlitz leuchtete von Gnade, so dass er nicht nur nicht durch das zu ihm Gesagte beunruhigt wurde, sondern der Prokonsul vielmehr außer sich geriet und einen Herold dreimal in der Mitte der Rennbahn verkünden ließ: „Polykarp hat sich als Christ bekannt.“ Als der Herold dies verkündet hatte, begann die ganze Menge der Heiden und der in Smyrna wohnenden Juden in maßloser Wut laut zu schreien: „Das ist der Lehrer Asiens, der Vater der Christen; er stürzt unsere Götter und lehrt viele, ihnen nicht zu opfern und sie nicht zu verehren.“ So schrien sie und baten den Asiarchen Philippus, einen Löwen auf Polykarp loszulassen. Philippus antwortete, das sei nicht möglich, weil der Tierkampf schon beendet sei. Da beschlossen sie, einmütig zu rufen: „Verbrennt Polykarp lebendig!“ Denn es musste sich erfüllen, was ihm in der Vision des Kopfkissens gezeigt worden war, das er im Gebet brennend sah, und er hatte zu den Gläubigen, die bei ihm waren, prophetisch gesagt: „Ich muss lebendig verbrannt werden.“</p>
      <h2>13</h2>

      <p>Und das geschah sehr schnell, schneller noch, als es gesagt war. Sofort eilten die Menschenmengen, Holz und Reisig aus den Werkstätten und Thermen zu sammeln, wobei die Juden nach ihrer Gewohnheit mit besonderem Eifer halfen. Als der Scheiterhaufen bereitet war, legte Polykarp seine Kleider ab, löste seinen Gürtel und versuchte, sich die Schuhe auszuziehen, was er zuvor nie selbst getan hatte; denn jeder Gläubige beeilte sich, seinen Leib zu berühren, weil ihm wegen seines guten Lebens schon vor dem Martyrium große Verehrung erwiesen wurde. Nun wurden um ihn alle Bestandteile des Scheiterhaufens gelegt. Als man ihn annageln wollte, sprach er: „Lasst mich so. Denn der mir die Kraft gibt, das Feuer zu ertragen, wird mir auch ohne eure Nägel geben, unbeweglich auf dem Scheiterhaufen zu stehen.“</p>
      <h2>14</h2>

      <p>Darum nagelten sie ihn nicht an, banden ihn aber. So stand er, die Hände auf dem Rücken gebunden, wie ein Widder, der aus der großen Herde ausgewählt und zum Opfer bereitet ist, ein Gott wohlgefälliges Brandopfer, blickte zum Himmel und sprach: „Herr, allmächtiger Gott, Vater deines geliebten und gesegneten Sohnes Jesus Christus, durch den wir dich erkannt haben! Gott der Engel und Mächte und aller Schöpfung und des ganzen Geschlechts der Gerechten, die vor deinem Angesicht leben! Ich preise dich, dass du mich an diesem Tag und in dieser Stunde gewürdigt hast, an der Zahl deiner Märtyrer und am Kelch deines Christus teilzuhaben zur Auferstehung in das ewige Leben, an Seele und Leib in der Unvergänglichkeit des Heiligen Geistes. Möge ich heute vor deinem Angesicht unter ihnen aufgenommen werden als ein fettes und wohlgefälliges Opfer, wie du, untrüglicher und wahrer Gott, es vorbereitet, vorherverkündet und vollendet hast. Dafür und für alles lobe ich dich, segne dich und verherrliche dich durch den ewigen und überhimmlischen Hohenpriester Jesus Christus, deinen geliebten Sohn, durch den dir – mit ihm und mit dem Heiligen Geist – die Herrlichkeit sei, jetzt und in alle künftigen Zeiten. Amen.“</p>
      <h2>15</h2>

      <p>Als er „Amen“ gesagt und das Gebet beendet hatte, zündeten die beim Scheiterhaufen Aufgestellten das Feuer an. Als das Feuer hoch aufloderte, sahen wir ein Wunder – wir, denen es gegeben war zu sehen, die wir auch bewahrt wurden, um das Geschehene den anderen zu berichten. Das Feuer nahm die Gestalt eines Gewölbes an, wie ein vom Wind geblähtes Segel, und umgab den Leib des Märtyrers; er war in der Mitte nicht wie ein verbrennender Leib, sondern wie gebackenes Brot oder wie Gold und Silber, das im Schmelzofen glüht. Wir spürten einen solchen Wohlgeruch, als duftete es nach Weihrauch oder einem anderen kostbaren Aroma.</p>
      <h2>16</h2>

      <p>Endlich, als die Gesetzlosen sahen, dass sein Leib vom Feuer nicht verzehrt werden konnte, befahlen sie dem Confector, herbeizukommen und ihn mit einem Dolch zu durchbohren. Als er es tat, flog eine Taube heraus, und es strömte so viel Blut, dass es das Feuer löschte; und die ganze Menge sah mit Staunen, welch großer Unterschied zwischen den Ungläubigen und den Auserwählten besteht, unter denen auch dieser wunderbare Märtyrer Polykarp war, der in unseren Zeiten ein Lehrer nach den Aposteln und Propheten und Bischof der katholischen Kirche von Smyrna war. Denn jedes Wort, das aus seinem Mund hervorging, ist entweder schon in Erfüllung gegangen oder wird in Erfüllung gehen.</p>
      <h2>17</h2>

      <p>Als aber der Neider, der Verleumder und listige Feind des Geschlechts der Gerechten die Größe seines Martyriums sah und sein von Anfang an untadeliges Leben, als er sah, dass er mit der Krone der Unvergänglichkeit gekrönt war und den unbestreitbaren Lohn empfangen hatte, da suchte er zu bewirken, dass auch sein Leib nicht von uns genommen werde, obwohl viele es wünschten und eine Reliquie seines heiligen Leibes zu besitzen verlangten. Er gab Niketas, dem Vater des Herodes und Bruder der Alke, ein, sich an den Prokonsul zu wenden, er möge den Leib nicht herausgeben, damit wir, wie er sagte, den Gekreuzigten verlassend, diesen nicht zu verehren beginnen. Das wurde auf Eingebung und Drängen der Juden gesagt, die bemerkt hatten, dass wir ihn vom Scheiterhaufen nehmen wollten, und nicht verstanden, dass wir niemals Christus verlassen können, der für das Heil aller, die in der Welt gerettet werden, gelitten hat, der ohne Fehl für die Sünder litt, noch einen anderen verehren. Denn ihn beten wir als den Sohn Gottes an; die Märtyrer aber lieben wir als Jünger und Nachahmer des Herrn gebührend um ihrer unbesiegbaren Treue zu ihrem König und Lehrer willen. Gott gebe auch uns, ihre Gefährten und Mitschüler zu werden!</p>
      <h2>18</h2>

      <p>Der Zenturio, der die jüdische Streitlust sah, legte den Leib vor aller Augen, wie es bei ihnen üblich ist, und verbrannte ihn. So nahmen wir sodann seine Gebeine, die kostbarer sind als edle Steine und herrlicher als Gold, und legten sie an einem geziemenden Ort nieder. Dort wird der Herr uns, wenn wir in Freude und Jubel zusammenkommen, geben, den Geburtstag seines Märtyrers zu feiern, zum Gedächtnis derer, die vor uns für den Glauben gekämpft haben, und zur Unterweisung und Vorbereitung für die künftigen Kämpfer.</p>
      <h2>19</h2>

      <p>Das ist die Geschichte des seligen Polykarp. Er war mit denen aus Philadelphia der zwölfte Märtyrer in Smyrna, doch seiner wird mehr als aller gedacht, so dass auch die Heiden überall von ihm reden. Er war nicht nur ein berühmter Lehrer, sondern auch ein hervorragender Märtyrer, dessen Martyrium, das nach dem Evangelium Christi geschah, alle nachzuahmen wünschen. Denn er besiegte durch seine Geduld den gesetzlosen Herrscher, empfing so die Krone der Unvergänglichkeit und freut sich nun mit den Aposteln und allen Gerechten; er preist Gott, den allmächtigen Vater, und segnet unseren Herrn, den Heiland unserer Seelen und Leiber und den Hirten der katholischen Kirche auf Erden.</p>
      <h2>20</h2>

      <p>Ihr batet uns, das Geschehene ausführlicher zu beschreiben; wir berichten es euch nun kurz durch unseren Bruder Markion. Wenn ihr davon erfahren habt, so sendet unseren Brief weiter an die Brüder, damit auch sie den Herrn preisen, der seine Auserwählten unter seinen Knechten erwählt und uns alle durch seine Gnade und Gabe in sein ewiges Reich führen kann durch seinen einziggeborenen Sohn Jesus Christus – ihm sei Herrlichkeit, Ehre, Macht und Größe in Ewigkeit! Grüßt alle Heiligen. Es grüßen euch die, die bei uns sind, und Euarestus mit seinem ganzen Hause, der dies geschrieben hat.</p>
      <h2>21</h2>

      <p>Der selige Polykarp litt am Anfang des Monats Xanthikos, am zweiten Tag, sieben Tage vor den Kalenden des März, am großen Sabbat, in der achten Stunde. Er wurde von Herodes ergriffen, im Pontifikat des Philippus Trallianus, unter dem Prokonsulat des Statius Quadratus, in der ewigen Herrschaft unseres Herrn Jesus Christus.</p>
      <h2>22</h2>

      <p><em>Anhang.</em> Wir wünschen euch, Brüder, im Wort des Evangeliums Jesu Christi gestärkt zu werden und danach zu wandeln, Gott, dem Vater, und dem Heiligen Geist die Herrlichkeit sei für das Heil der heiligen Auserwählten! So wie der selige Polykarp sein Martyrium vollendet hat, so mögen auch wir in seine Fußspuren treten im Reich Jesu Christi. Dies hat aus der Abschrift des Irenäus, des Schülers des Polykarp, Gaius abgeschrieben, der Irenäus kannte. Ich aber, Sokrates, schrieb dies in Korinth nach der Abschrift des Gaius. Die Gnade sei mit allen! Und danach habe ich, Pionius, es nochmals abgeschrieben, nachdem ich die Abschriften durch eine Offenbarung des mir erschienenen seligen Polykarp gefunden hatte, worüber ich später berichten werde. Ich sammelte die Abschriften, die schon fast von der Zeit zerfallen waren; der Herr Jesus Christus möge auch mich in seinem himmlischen Reich mit seinen Auserwählten vereinen. Ihm sei Herrlichkeit mit dem Vater und dem Heiligen Geist in alle Ewigkeit. Amen.</p>

      <p><em>Aus der Moskauer Handschrift.</em> Dies hat aus den Schriften des Irenäus Gaius abgeschrieben, der Irenäus kannte, den Schüler des heiligen Polykarp. Dieser Irenäus, der sich während des Martyriums des Bischofs Polykarp in Rom aufhielt, lehrte viele. Von ihm stammen viele sehr schöne und rechtgläubige Schriften, in denen er auch Polykarp erwähnt und sagt, er sei sein Schüler gewesen, und in denen er zahlreiche Häresien widerlegte und uns die kirchliche und katholische Regel so überlieferte, wie er sie von dem Heiligen empfangen hatte. Er sagt auch dies: „Als Markion einmal dem heiligen Polykarp begegnete, sprach er: ‚Erkenne uns an, Polykarp!‘ Darauf antwortete ihm Polykarp: ‚Ich erkenne dich an, ich erkenne dich an, du Erstgeborener des Satans.‘“ Weiter wird in den Schriften des Irenäus erzählt, dass an demselben Tag und in derselben Stunde, in der Polykarp in Smyrna das Martyrium erlitt, Irenäus, der sich in Rom befand, eine Stimme hörte, die wie aus einer Trompete kam: „Polykarp hat das Martyrium erlitten!“ So hat, wie gesagt, Gaius aus diesen Schriften des Irenäus abgeschrieben, und von der Abschrift des Gaius Isokrates in Korinth. Ich aber, Pionius, habe wiederum von den Abschriften des Isokrates abgeschrieben, nachdem ich sie durch die Offenbarung des heiligen Polykarp aufgefunden und fast von der Zeit zerfallen gesammelt hatte. Der Herr Jesus Christus möge auch mich mit seinen Auserwählten in seinem überhimmlischen Reich vereinen; ihm sei Herrlichkeit mit dem Vater und dem Sohn und dem Heiligen Geist in alle Ewigkeit. Amen.</p>

