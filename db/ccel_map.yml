# Берём только тексты самих древних авторов: вступления и пояснения составителей сборника не нужны.
# Карта импорта трудов из CCEL (ANF, NPNF) в английскую библиотеку святых отцов (q-saints-en).
# Запуск: bin/rails ccel:import [ONLY=anf01] [DRY_RUN=1]; оглавления томов: bin/rails ccel:inventory
#
# # skip_titles: заголовки подразделов, которые в этом томе написаны составителями (по тому)
skip_titles:
  npnf109: [Introduction, Preface]
  npnf114: [Introduction, Preface]
  npnf201: [Preface]
  npnf204: [Introduction]
  npnf207: [Introduction, Preface]
  npnf209: [Introduction]
  npnf210: [Introduction, Prefatory Note]
  npnf211: [Introduction]
  npnf212: [Introduction]
  npnf213: [Introduction, Preface]
  npnf214: [Introduction, Preface]

# cut_after: абзац, после которого до конца раздела идут комментарии составителей (в каноны - толкования к правилу)
cut_after:
  npnf214: Notes.

volumes: название тома, если в XML оно неверное
# authors: ключ -> en-страница автора
#   path       - en-страница (если её нет - создаётся)
#   ru         - ru-страница автора: для связи языков
#   title, title_sub, menu_title, century - для новой страницы и пункта в меню q-saints-en
#   categories - категории трудов в меню новой страницы, по порядку
#   parent, parent_menu - для раздела вне q-saints-en: родительская страница и категория в её меню (вместо century)
# works: труды
#   src      - "том id-раздела" из оглавления
#   author   - ключ из authors
#   title    - название страницы
#   category - категория в меню автора (по умолчанию Works)
#   menu     - вместо category: название готового пункта в меню автора (заготовки без ссылки), куда вписать адрес
#   skip     - id подразделов, которые не берём (вступления составителей отсеиваются и так, по заголовку)
#   parts    - each: страница на каждый подраздел; число: подразделы подряд до N кб на страницу
#   part_titles - названия частей по порядку (вместо заголовков из CCEL)
#   ru       - ru-страница труда (для частей - список по порядку)
#   path     - адрес страницы (по умолчанию <author>-<title>)

# skip_titles: заголовки подразделов, которые в этом томе написаны составителями (по тому)
skip_titles:
  npnf109: [Introduction, Preface]
  npnf114: [Introduction, Preface]
  npnf201: [Preface]
  npnf204: [Introduction]
  npnf207: [Introduction, Preface]
  npnf209: [Introduction]
  npnf210: [Introduction, Prefatory Note]
  npnf211: [Introduction]
  npnf212: [Introduction]
  npnf213: [Introduction, Preface]
  npnf214: [Introduction, Preface]

# cut_after: абзац, после которого до конца раздела идут комментарии составителей (в каноны - толкования к правилу)
cut_after:
  npnf214: Notes.

